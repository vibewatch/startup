  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的市场定义，比笼统的“印度金融科技”更窄。Moneyview 自有渠道描述的是集贷款、银行卡、UPI、保险、存款和投资/黄金于一体的金融
              App，但独立报道仍把个人贷款视为主打产品和主要收入引擎。因此，核心市场应是数字化消费信贷分销；相邻金融产品主要承担提升活跃和交叉销售的作用，不能单独证明 Moneyview 已经变现了广泛的超级 App
              TAM。

              合理边界包括无抵押及相邻消费信贷流程、合作方分销，以及同一 App 内的重复金融产品使用；不包括现有来源没有显示 Moneyview
              已大规模变现的消费金融领域，如全服务银行、商户收单或机构贷款。最可信的现状替代品是零散的单点产品和现有贷款机构的用户路径，而非单一直接竞品市场。但本章证据无法精确量化替代份额，因此应保留为尽调缺口，而不是臆测市场份额主张。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 外部与自下而上的规模视角
        blocks:
          - type: paragraph
            body: >-
              证据池中最广的第三方视角来自 Economic Times 引用的 Redseer：预计印度个人贷款市场到 FY31 达到 ₹33-36 lakh crore，年增长 18-20%。这与 Moneyview
              的核心变现品类吻合，方向上有用，但仍是自上而下的市场预测，不是公司特定的 SAM。另一个更宽松的上限来自 Indianweb2 引用的预测：印度智能手机基数到 Fiscal 2031 可能超过 900m。由于
              Moneyview 通过移动优先 App 分销，相比依赖网点的贷款机构，它更直接受益于智能手机渗透率。

              自下而上的运营视角更具体，但仍不完整。ET Intelligence 报告 FY26 注册用户 13.4 crore、变现用户 1.1 crore；2026 年 3 月 IPO 报道则称约有 1,000 10m
              创收客户和 42 个金融服务合作伙伴。这些数字意味着庞大的安装漏斗和有意义的分销杠杆，但并非干净的 SAM/SOM，因为公开来源没有按借款人群组、收入档位或获客渠道拆分产品转化。最诚实的判断是：Moneyview
              已在一个庞大且仍在增长的品类内证明规模，但各相邻产品可触达的确切钱包份额仍未充分披露。
