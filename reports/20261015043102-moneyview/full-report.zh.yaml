      - number: '3.3'
        title: DLG 战略既是规模杠杆，也是暴露面
        blocks:
          - type: paragraph
            body: >-
              Moneyview 正增加 DLG 支持的贷款；Mint 报道称 Paytm 已退出 DLG，而 Fibe、KreditBee 和 Kissht
              增加了联合放贷活动。这种分化可以支持更快的合作方融资规模，但也把监管和经济敏感性集中在同行正在减少使用的结构上。Moneyview 的 DLG 发放额从 FY24 的 ₹8,848 crore 增至 FY25 的
              ₹11,282 crore，DLG 费用则从 ₹131 crore 增至 ₹321 crore。另据 Economic Times，Moneyview 的 GNPA 从 FY24 的 0.9% 升至 FY26 的
              2.7%；OnEMI 的 GNPA 则从前一年同期的 3.6% 改善至 2026 年 6 月季度的
              2.3%。这些期间和公司不可直接比较，但趋势削弱了“规模本身就是持久护城河”的说法。可比借款人定价、群组损失、审批率和贷款方续约条款仍不可得，因此定位图是受证据约束的序位判断，不是业绩或市场份额排行榜。
