  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Q1 FY27 盈利持续，信用成本稳定，市场认可 Moneyview 作为一家规模化、多产品数字放款机构的价值。
        - 首日溢价证明可持续，开盘估值能从更强的盈利基础上继续复合增长。
        - 无抵押贷款损失未能正常化，或监管趋严。
        - 需要季度披露清晰，且资产质量不再滑坡。
      - - 基准
        - 增长仍然不错，但投资者会继续在运营势头与无抵押信贷波动之间权衡。
        - 当前估值看起来合理：相对 IPO 价格区间并不明显昂贵，但上市冲高后也谈不上便宜。
        - 中等程度的减值压力和不完整的悬而未决风险披露限制上行空间。
        - 最符合今天的混合证据。
      - - 悲观
        - GNPA、减值或监管摩擦恶化，而首日重估被证明过于乐观。
        - 由于账面价值和盈利追赶不够快，开盘溢价收缩。
        - 合作伙伴 vintage 暴露压力、重复借款减弱，或无抵押放贷制度收紧。
        - 如果上市后季度在信用持续性上令人失望，这一情景最可能出现。
    notes: 由于公开证据仍然过于稀薄，无法支持精确的目标倍数或回报模型，因此情景采用定性估值逻辑。
