  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式仍依赖合作方费用变现
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的公开披露显示其是混合模式，而非纯资产负债表贷款机构。招股书称，公司作为个人贷款 LSP 运营，由 WFPL、合作银行和 NBFC
              承保或发放信贷；其他产品则采用以分销为主的合作方模式。这反映在收入结构中：FY26 收入仍以费用和佣金为主，占 56.68%，利息收入占
              39.17%；即使表内放贷更重要，变现仍锚定合作方分销和服务。产品足够广，可以支持交叉销售，但保留的公开来源没有进一步按产品线拆分收入。
