      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最明确的终端用户是印度家庭借款人。ET Intelligence 称 Moneyview 主要服务年收入 ₹3 lakh 至 ₹11 lakh 的家庭，因此平台更像中等收入人群的信贷与金融工具，而非高端银行
              App。用户似乎先建立广泛的消费 App 关系，再通过个人贷款及相邻金融产品加深使用；变现来自用户新增信贷或交易产品，而不是纯订阅模式。

              付款方情况只部分公开。借款人通过贷款利息和费用承担部分经济性；贷款机构、保险公司和银行合作伙伴则可能通过佣金、发放经济性或分销关系承担另一部分。现有来源足以说明流程方向——消费者获客、合作方支持的产品广度和交叉销售——但不足以按产品线分配预算归属或绑定率。这个限制很重要，因为估值取决于用户规模能否转化为更高价值产品，同时不使信用成本或合作方依赖同比上升。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
