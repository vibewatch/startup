      - number: '8.3'
        title: 估值背景与情景
        blocks:
          - type: paragraph
            body: >-
              估值有支撑，但并非单向。IPO 价格区间下，IndianWeb2 估算发行后市值 ₹6,000 crore；ET Intelligence 引用 IPO 后市净率 1.9x，而 OnEMI Technology
              Solutions 为 2.9x。这说明单看账面价值，发行价并不激进。但市场没有停留在发行区间：Seedtable 记录首日开盘市值约 ₹9,788.6 crore，二级买家立即为动能溢价。乐观情景是更强的 Q1
              FY27 盈利和簿记需求可以支撑重估；怀疑情景是市场尚未看到多个上市后季度的无抵押贷款损失、合作方账龄表现及关于悬置压力和资本部署的更清晰披露，重估却已提前计入大量执行成果。
