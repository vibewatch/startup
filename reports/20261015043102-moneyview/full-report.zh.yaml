      - number: '3.2'
        title: 差异化来自编排、数据与资金获取
        blocks:
          - type: paragraph
            body: >-
              Moneyview 最明显的运营差异，是自建技术栈、庞大消费者漏斗、多家受监管贷款合作伙伴以及自有 NBFC 的组合。保留的 DRHP 分析称，截至 2025 年 12 月，公司每天处理超过 200,000
              份申请，约 5 秒出报价，并有 22
              家受监管个人贷款合作伙伴。这些能力可以降低集成摩擦，并提供比单一资产负债表贷款机构更多的路由选择，但不能单独证明其信贷选择更优、获客成本更低或留存更强。双方都可能多重使用：消费者可比较多个 App，银行和
              NBFC 也可与多个 LSP 合作或内部建设。因此切换成本更多来自运营而非合同，源于积累的还款数据、配置好的贷款方集成和服务流程，而非已证实的客户锁定。能力矩阵将已披露证据与未知竞品单元分开。
