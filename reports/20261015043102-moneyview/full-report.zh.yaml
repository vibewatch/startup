      - number: '1.3'
        title: 融资路径、IPO 重置与概览关注点
        blocks:
          - type: paragraph
            body: >-
              Moneyview 在 2026 年转向公开市场，是当前最重要的事件。2026 年 3 月的 DRHP 报道称，IPO 新股发行规模最高为 ₹1,500 crore，老股出售最高为 13.6 crore 股；但
              2026 年 9 月的后续报道显示，交易规模缩小至 ₹1,092 crore，价格区间为 ₹32-34，新股发行 ₹750 crore，OFS 约 ₹342 crore。Finsamudra
              将这次重置描述为较最高私募估值下调约 48%；IPOCentral 和 Prittle Prattle 则将 Tiger Global、Accel、Ribbit Capital、Winter Capital 和
              Evolvence 列为相关投资人。关注点不只是增长和盈利：ET Intelligence 指出 GNPA 恶化及无抵押贷款监管暴露，InCred 则强调一次性网络欺诈和 CEO 激励费用拖累 FY26
              报告利润。这些问题并未否定公司规模，但意味着本章不能把上市当作承保质量持久或治理成熟的证明。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: IPO 重置是概览的核心事实
            body: 这次进入公开市场并非私募融资的简单升级：2026 年 9 月来源将 IPO 估值定为约 ₹5,985-6,000 crore，远低于 2024 年末私募估值基准，但盈利增长叙事仍然存在。
            calloutType: insight
            claimRefs:
              - CO007
              - CO008
          - type: callout
            title: 资产质量与监管暴露已在概览中显现
            body: ET 和 InCred 都在公司概览中提出信用质量与监管担忧，因此后续章节应把承保持久性、DLG 暴露和监管依赖视为一等问题，而不是成功上市后的脚注。
            calloutType: risk
            claimRefs:
              - CO011
              - CO013
