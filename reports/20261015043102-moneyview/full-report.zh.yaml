      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              当前证据中最强的采用驱动是分销规模、产品广度，以及把用户从综合消费金融 App 推向更高变现信贷产品的模式。独立报道称 Moneyview 持续增加相邻产品；HDIN 则描述其从纯 LSP 转向“Platform
              + Asset”模式，利息收入占比上升。这对估值很重要：Moneyview 不只是花钱获取 App 用户，也在通过承保、资产负债表暴露和交叉销售，争取提高每位用户的经济价值。

              同一批证据也说明，为何时间判断和估值倍数扩张应保持克制。ET Intelligence 明确警告 GNPA 已上升，更严格的无抵押贷款监管可能拖慢增长；HDIN 指出 Stage 3 贷款和 RBI
              立场仍需监测。因此，投资人不应把漏斗顶部用户增长直接年化进长期盈利假设。本章可以支持市场足够大、分销基础足够深、公司能够继续增长的判断，但仅凭公开证据，无法支持精确的长期 SAM/SOM
              或按产品拆分的干净转化模型。
            claimRefs:
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 估值应锚定信贷变现，而不是笼统的金融科技 TAM
            body: 证据支持广泛的消费金融产品面，但独立报道仍称个人贷款是主要收入驱动。因此，正确的估值问题是：Moneyview 能否持续把广泛用户触达转化为更高价值的贷款和交叉销售经济性，同时不让信用成本或合作方依赖同比上升。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
              - CM011
          - type: callout
            title: 广泛触达并不能消除监管与信用质量约束
            body: 公开市场叙事可能高估用户规模。证据池中更有力的反向证据表明，GNPA 上升和更严格的无抵押贷款规则，仍可能拖慢从广泛 App 触达到持久、高回报贷款增长的转化。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止贷款 App
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的直接比较对象包括 Navi、Fibe 和 KreditBee 等 App 放贷机构，但买方的替代选择比这些品牌更广。InCred 等多元化 NBFC、银行以及 Paytm
              等大型平台，可以把资金、分销和监管基础设施结合起来；一份分析师来源还将 Bajaj Finance 和 Jio Financial
              列为现有机构威胁。现状替代方案包括直接向银行借款、使用现有机构的数字渠道、推迟购买或依赖非正式信贷。受监管贷款机构也可以自行完成获客、承保和服务，而不使用
              LSP。公开竞品披露不均衡：保留证据提供了有用的模式分类和方向性比较，但没有覆盖整个集合的一致资金、AUM、客户、价格或损失指标。因此，画像表标记不可用字段，而不是把不可比指标强行排成名次。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
