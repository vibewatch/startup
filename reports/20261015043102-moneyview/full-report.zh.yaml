      - number: '4.3'
        title: 资本需求明确，信用成本随表内暴露上升
        blocks:
          - type: paragraph
            body: >-
              IPO 披露明确显示资本依赖。募集净额主要用于支持 DLG 贷款增长和向 WFPL
              注资，符合公司“轻资本平台也需要更多资产负债表与信用支持能力来持续扩张”的叙事。信用成本并不温和，因此这一需求很重要：招股书数据显示减值占 FY26 总收入 28.89%、占平均管理资产规模 5.16%；ET
              Intelligence 称 GNPA 从 FY24 的 0.9% 升至 FY26 的 2.7%，并将无抵押贷款监管列为增长风险。上市确实增加了进入股权市场的渠道，但并未消除密切关注损失吸收和合作方集中度的必要。
