figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Moneyview 从 2014 年成立到 2026 年上市的路径，展现了以信贷为核心的转型、融资扩张，以及大幅缩减后的 IPO。
    data:
      items:
        - date: '2014-08-11'
          label: 公司注册成立
          detail: 前身实体 Whizdm Innovations Private Limited 在班加罗尔注册成立。
          claimRefs:
            - CO005
        - date: '2014'
          label: Moneyview 成立
          detail: Puneet Agarwal 和 Sanjay Aggarwal 创立了公司。
          claimRefs:
            - CO002
        - date: 2024-09
          label: 非公开估值基准
          detail: 后续 IPO 报道将 Moneyview 2024 年末的非公开估值基准定在约 USD 1.2 billion。
          claimRefs:
            - CO008
        - date: '2025-05-22'
          label: 启用 Moneyview 名称
          detail: Business Standard 称，公司于 2025 年 5 月 22 日更名为 Moneyview Private Limited。
          claimRefs:
            - CO005
        - date: '2026-03-05'
          label: 向 SEBI 提交 DRHP
          detail: 2026 年 3 月报道描述了一份 DRHP，包含最高 ₹1,500 crore 的新股发行，以及最高 13.6 crore 股 OFS。
          claimRefs:
            - CO006
        - date: '2026-06-30'
          label: 用户和管理 AUM 规模
          detail: 报道称注册用户为 140.28 million，管理 AUM 为 ₹22,520 crore。
          claimRefs:
            - CO010
        - date: FY26
          label: 实现盈利的财年
          detail: 报道称运营收入为 ₹3,351.2 crore，税后利润为 ₹242.7 crore。
          claimRefs:
            - CO009
            - CO012
        - date: 2026-09
          label: IPO 缩减并定价
          detail: 2026 年 9 月报道逐渐确认 IPO 规模缩小至 ₹1,092 crore，价格区间为 ₹32-34，估值约 ₹6,000 crore。
          claimRefs:
            - CO007
            - CO008
        - date: '2026-10-15'
          label: 可见公开交易
          detail: Business Standard 于 2026 年 10 月 15 日展示了 Moneyview 的 NSE/BSE 实时市场数据，确认公司在报告日之前已上市。
