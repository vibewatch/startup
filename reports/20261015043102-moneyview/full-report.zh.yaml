  - id: TV002
    title: 正论点 / 反论点表
    columns:
      - 论点
      - 重要性
      - 哪些变化会扭转判断
    rows:
      - - 正论点：管理 AUM 和收入已经很大
        - 管理 AUM 达 ₹22,520 crore，FY26 收入达 ₹3,351 crore，说明公司已有真实规模，不是概念股。
        - 上市后多个季度信用成本稳定或改善，会增强投资信心。
      - - 正论点：分销覆盖广
        - Moneyview 称用户超过 12 crore、服务覆盖超过 18,400 个邮编区，说明漏斗顶端足够深。
        - 如果能证明这些用户中有更高比例实现盈利变现，判断会改善。
      - - 正论点：合作伙伴网络扩大供给
        - DigitalLending.in 跟踪到 11 家受监管放款合作伙伴，降低了对单一发起方的依赖。
        - 若披露合作伙伴层面的 vintage、续约和经济条款，这种多元化才更具投资价值。
      - - 反论点：资产质量恶化
        - ET Intelligence 称 GNPA 从 FY24 的 0.9% 升至 FY26 的 2.7%。
        - 如果损失趋势明显回到更好水平，看空逻辑会减弱。
      - - 反论点：盈利质量仍需验证
        - FY26 减值已升至总收入的 28.9%，因此盈利持续性仍是核心争议。
        - 如果连续两个或更多公开季度保持强劲盈利，且信用成本没有再次上升，将有帮助。
      - - 反论点：市场已经给股票重估
        - 股票开盘时市值约 ₹9,788.6 crore，而 IPO 价格区间上限对应 ₹6,000 crore。
        - 更低的入场价格或明显更好的已披露基本面，才能带来更好的风险收益结构。
    notes: 各行将正面的规模 / 分销信号与公开反向证据并列；后者仍使投资建议停留在观察。
