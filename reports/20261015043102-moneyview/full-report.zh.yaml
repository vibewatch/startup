  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开披露支持一条从用户到变现用户、放款、收入类别和信用成本的漏斗。
    data:
      nodes:
        - id: registered-users
          label: 注册用户
          value: 140.28
          unit: million
          note: 截至 2026 年 6 月 30 日。
        - id: monetized-users
          label: 变现用户
          value: 11.9
          unit: million
          note: 截至 2026 年 6 月 30 日，至少使用一种创收产品的用户。
        - id: loan-disbursals
          label: 贷款放款
          value: 230985.19
          unit: INR million
          note: FY26 通过平台促成的无抵押个人贷款放款。
        - id: fee-income
          label: 费用和佣金收入
          value: 18994.55
          unit: INR million
          note: 占 FY26 运营收入的 56.68%。
        - id: interest-income
          label: 利息收入
          value: 13127
          unit: INR million
          note: 占 FY26 运营收入的 39.17%。
        - id: impairment
          label: 金融工具减值
          value: 9835.28
          unit: INR million
          note: 占 FY26 总收入的 28.89%。
      edges:
        - from: registered-users
          to: monetized-users
          label: 采用创收产品
        - from: monetized-users
          to: loan-disbursals
          label: 借款人获得无抵押个人贷款
        - from: loan-disbursals
          to: fee-income
          label: 合作伙伴促成的产品产生费用和佣金
        - from: loan-disbursals
          to: interest-income
          label: 账内 / WFPL 放贷产生利息收入
        - from: interest-income
          to: impairment
          label: 账内敞口承担信用损失和 DLG 成本
    approximationNotes: 该流程只展示顺序和已标注数值；由于保留来源没有提供产品层面的实现率或成本分摊，因此不推断转化率或毛利。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI008
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一个四层架构：多产品界面、AI 主导的决策、混合放款方路由，以及仍然稀疏的信任 / 控制披露层。
    data:
      layers:
        - label: 客户界面
          detail: 单一应用将产品系列打包在一起，而不是提供独立的开发者或合作伙伴控制台。
          modules:
            - 个人贷款
            - 信用卡
            - UPI 和账单支付
            - 数字黄金、保险和储蓄流程
        - label: 开户与决策
          detail: 无纸化获客流程，采用 AI 主导的承保评估、分群和个性化报价。
          modules:
            - eKYC 和数字开户
            - 超过 1 lakh 个承保评估变量
            - 超过 3,000 个用户分群
        - label: 资本路由
          detail: 覆盖合作放款方和自有 NBFC 的混合获客放款与服务模式。
          modules:
            - LSP 合作伙伴发起
            - Whizdm Finance 账内放贷
            - DLG 支持的合作伙伴项目
        - label: 留存循环
          detail: 通过交叉销售，尝试把贷款关系转化为更广泛的金融关系。
          modules:
            - 借款 / 交易 / 投资 / 保障交叉销售
            - 支付和追踪再触达
            - 附属产品搭售机会
        - label: 信任与控制
          detail: 支撑受监管金融流程的安全与韧性披露，但对深度尽调而言仍然浅薄。
          modules:
            - ISO 27001:2022 认证口径
            - 256-bit 安全口径
            - 已披露的网络风险和事件历史
        - label: 外部依赖
          detail: 公开可见的产品执行取决于放款方意愿、合规变化和合作伙伴集成质量。
          modules:
            - 放款方和 NBFC 合作伙伴连接
            - DLG 和无抵押放贷规则
            - 事件响应执行
    approximationNotes: 这是一张基于公开证据的运营图，而非内部系统图；它汇总了公司和外部披露中的产品、承保评估、路由和控制信号。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE009
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开旅程从广泛的服务不足借款人漏斗开始，通过合作伙伴支持的信贷实现变现，再扩展到相邻金融产品；但留存证据最薄弱。
    data:
      items:
        - name: Acquire underserved households
          label: 获取服务不足的家庭
          value: Tier-2+ and Rs 3 lakh-Rs 11 lakh income cohorts
          detail: Moneyview 面向传统银行服务不足的中等收入、信用记录薄弱借款人。
          touchpoints:
            - 个人贷款发现
            - 信用评分 / 资金管理入口
        - name: Activate app funnel
          label: 激活应用漏斗
          value: 12 crore+ users; 5 crore+ downloads
          detail: 官方应用商店指标显示，在信贷变现之前，公司已覆盖全国大量用户。
          touchpoints:
            - Google Play
            - 应用安装和开户
        - name: Monetize into borrowing
          label: 变现为借款
          value: 1.1 crore monetized users; 8.48% monetized share in FY26
          detail: 公开来源显示变现正在改善，但没有披露重复借款行为。
          touchpoints:
            - 个人贷款
            - 5 秒内贷款报价
        - name: Fulfil through partners
          label: 通过合作伙伴完成交付
          value: 42-48 financial partners; 11 named RE partners
          detail: 轻资本信贷交付依赖受监管放款方和合作伙伴资产负债表。
          touchpoints:
            - 联合放贷
            - 卡 / 房贷 / LAP 合作伙伴流程
        - name: Expand wallet share
          label: 扩大钱包份额
          value: Borrow, Transact, Invest, Protect
          detail: 向卡、保险、数字黄金、UPI 及相关产品交叉销售，是主要扩张循环。
          touchpoints:
            - 信用卡
            - 保险
            - UPI
            - 数字黄金
        - name: Re-engage and retain
          label: 再触达并留存
          value: Durability metrics undisclosed
          detail: 公开证据没有披露 NRR、流失、续约、头部合作伙伴集中度或重复借款客群。
          touchpoints:
            - 重复借款
            - 合作伙伴续约
            - 跨产品参与
    approximationNotes: 该顺序反映运营循环的公开证据，而非经审计的转化率。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU007
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 监管和信用质量风险仍是两项最高的剩余敞口；尽管已声明存在控制措施，网络风险仍处于高位。
    data:
      columns:
        - label: 可能性
          detail: 基于当前公开证据，对未来 12-18 个月的概率判断。
        - label: 影响
          detail: 对增长、拨备、披露负担或投资者判断的潜在影响。
        - label: 缓释成熟度
          detail: 观察到的控制、资本或合作伙伴多元化证据。
        - label: 剩余敞口
          detail: 考虑公开缓释因素和缺失尽调后的净评级。
      rows:
        - label: 监管 / DLG 模式风险
          note: 取决于 RBI 规则、DLG 经济性和外包放贷边界。
          values:
            - label: 中
              tone: warning
              note: 规则已在 2025-26 年发生变化，仍是管理层需要主动应对的风险因素。
            - label: 高
              tone: critical
              note: 可能改变单位经济性、产品范围和资本需求。
            - label: 中
              tone: warning
              note: IPO 资金和 NBFC 资本有所帮助，但客群证据仍然缺失。
            - label: 高
              tone: critical
              note: 仍是指定来源池中对投资论点施压的主要因素。
        - label: 资产质量 / 信用成本漂移
          note: 由 FY26 公开报告中的 GNPA 和减值恶化推动。
          values:
            - label: 中高
              tone: high
              note: 公开 FY26 评论中已经可以看到恶化。
            - label: 高
              tone: critical
              note: 直接影响拨备、利润率和 IPO 质量盈利的可信度。
            - label: 中
              tone: warning
              note: 评级和盈利能力有所帮助，但公开 vintage 数据缺失。
            - label: 高
              tone: critical
              note: 在合作伙伴和客群损失透明度提高前，无法下调评级。
        - label: 网络 / 隐私 / 欺诈控制风险
          note: 根据已披露的 2025 年 8 月 Whizdm Finance 事件评估。
          values:
            - label: 中
              tone: warning
              note: 已发生重大事件，但尚未证明会再次发生。
            - label: 高
              tone: critical
              note: 可能触发直接财务损失和监管审查。
            - label: 中
              tone: warning
              note: ISO 27001:2022 和已声明的安全控制有所帮助，但并非决定性因素。
            - label: 中高
              tone: high
              note: 在补救证据公开前，剩余评级维持高位。
        - label: 合作伙伴集中度 / 非排他性
          note: 收入占比有所改善，但关键放款合作伙伴仍然重要。
          values:
            - label: 中
              tone: warning
              note: 风险具有结构性，可能随重定价或终止再次出现。
            - label: 中高
              tone: high
              note: 可能放慢发起放款并削弱单位经济性。
            - label: 中
              tone: warning
              note: 11 家合作伙伴的网络优于依赖单一放款方。
            - label: 中高
              tone: high
              note: 仍需看到合同和续约情况，评级才会下降。
        - label: 多监管机构合规扩张
          note: 保险、卡和上市准备使监管范围超出核心 RBI 放贷规则。
          values:
            - label: 中
              tone: warning
              note: 随着产品广度和上市公司义务扩大，敞口也会增长。
            - label: 中高
              tone: high
              note: 可能放慢产品发布、增加披露负担并抬高补救成本。
            - label: 中
              tone: warning
              note: 治理正在改善，但公开合规证据仍有限。
            - label: 中高
              tone: high
              note: 在按监管机构厘清控制归属前，剩余敞口维持高位。
        - label: 运营规模下的服务韧性
          note: 用户基数和 AUM 较大，宕机或投诉可能迅速产生重大财务影响。
          values:
            - label: 中
              tone: warning
              note: 规模越大，普通事件大范围扩散的可能性越高。
            - label: 中
              tone: warning
              note: 影响不小，但通常不如监管或信用失败那样攸关生死。
            - label: 中
              tone: warning
              note: 公开运营控制和 SLA 披露仍然稀薄。
            - label: 中
              tone: warning
              note: 需要投诉、正常运行时间和催收服务证据，评级才会下降。
    approximationNotes: 可能性和剩余评级是基于保留来源集的分析师判断，并非来源引用的数值概率。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 建议维持跟踪：实际规模和需求得到验证，但上市后更高的入场价格与尚未解决的信贷持续性风险相互抵消。
    data:
      nodes:
        - id: scale
          label: 规模已验证
          note: ₹22,520 crore 的管理资产规模和 ₹3,351 crore 的 FY26 收入，证明公司已具备真实经营规模。
        - id: breadth
          label: 覆盖面和触达已验证
          note: 1.2 亿+用户、18,400+个邮编覆盖区域，以及多产品应用，共同形成更深的转化漏斗。
        - id: demand
          label: IPO 需求强劲
          note: ₹1,092 crore 的交易规模、98.46 倍的整体认购倍数，以及 227.45 倍的 QIB 账簿认购倍数。
        - id: pricing
          label: 入场价格快速上行
          note: IPO 发行区间对应 ₹6,000 crore 估值，但首日市值达到约 ₹9,788.6 crore。
        - id: risk
          label: 持续性风险仍在
          note: FY26 GNPA 升至 2.7%，减值占总收入的 28.9%。
        - id: call
          label: 跟踪 / 公允 / 高风险
          note: 在为首日溢价买单前，等待上市后信贷质量和悬而未决风险的证据更加清晰。
      edges:
        - from: scale
          to: breadth
          label: 支持纳入观察名单
        - from: breadth
          to: demand
          label: 有助于解释需求
        - from: demand
          to: pricing
          label: 推动估值重估
        - from: pricing
          to: risk
          label: 但提高了门槛
        - from: risk
          to: call
          label: 令立场保持谨慎
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
