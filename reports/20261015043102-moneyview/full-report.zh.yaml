              认证和安全宣传，但公开证据缺少足够补救细节，无法确认运营损失路径已经完全关闭。在 IPO 时代披露各队列损失、合作方合同持久性和事件后控制闭环之前，正确判断应是残余风险高，而不是今天就认定投资逻辑破裂。
