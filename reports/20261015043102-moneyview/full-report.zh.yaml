    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与规模
        blocks:
          - type: paragraph
            body: >-
              Moneyview 如今更像一家已上市的印度金融科技公司，而非 IPO 前初创企业：Business Standard 2026 年 10 月 15 日的市场页面已显示 NSE/BSE
              实时行情，但公司自有渠道仍将其定位为覆盖贷款、支付、银行卡、保险和储蓄的综合金融 App。官网强调合作方驱动模式，而不是单一放贷机构；独立 IPO
              报道则将其描述为面向印度中等收入家庭、纯数字化且以信贷为核心的平台。规模数据很大但具有时效性，因此本章明确保留日期：Prittle Prattle 称截至 2025 年 12 月 31 日用户超过 1.25
              亿；Finsamudra 称截至 2026 年 6 月 30 日注册用户为 1.4028 亿、管理资产规模为 ₹22,520 crore。现有证据还将 FY26
              经营收入与税后利润作为不同会计指标呈现，因此公司当前更接近“已上市、仍在扩张”，而不是“不计代价追求增长”。
