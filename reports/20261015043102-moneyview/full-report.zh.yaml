      - number: '8.4'
        title: 最终尽调问题与逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              对价格敏感的结论很直接：保持关注，但在三件事更清楚前，不要按更激进的入场倍数下注。第一，投资人需要最终上市后资本结构，包括 2026 年 3 月 DRHP 的可选 IPO
              前配售或后续售股股东动态是否改变真实悬置压力。第二，上市后季度需要证明，随着无抵押贷款账簿扩大，FY26 上升的 GNPA 和减值没有继续扩张。第三，市场需要更好地披露合作方群组持久性、重复借款质量，以及广泛
              App 覆盖中有多少真正转化为盈利且有韧性的贷款经济性。持续信用成本恶化、收紧的无抵押贷款规则拖慢增长，或首日溢价跑在公司复合增长账面价值和盈利能力之前，都可能打破投资逻辑。
            claimRefs:
              - CV001
