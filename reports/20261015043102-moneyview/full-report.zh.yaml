              Moneyview 比单一贷款方市场更分散，但并未隔绝合作方行为。DigitalLending 跟踪 11 家受监管贷款合作伙伴；BankCreds 强调借款合同与受监管 NBFC 签订，而非与
              Moneyview 签订，这降低了 App 失败时的借款人连续性风险。但商业模式依赖并未消失：Medianama 称 FY26 前 9m 前十大金融合作伙伴仍贡献 37.31%
              收入，且这些合作方并非独家，可能终止合作或转投竞品。因此，投资人的止损标准是可量化的：合作方集中度不再改善、DLG 损失迫使拨备大幅上升、事件后安全补救无法证明，或最终 IPO
              披露让合作方续约、账龄和催收表现继续不透明，风险都会明显恶化。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR015
              - CR016
