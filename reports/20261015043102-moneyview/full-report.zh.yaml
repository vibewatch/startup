      - number: '1.2'
        title: 创始人、治理与所有权概况
        blocks:
          - type: paragraph
            body: >-
              公司核心身份仍由创始人主导。Moneyview 的 About Us 页面和 IPO 报道均确认 Puneet Agarwal 与 Sanjay Aggarwal 为联合创始人；公司成立于 2014
              年，核心使命是让服务不足的家庭获得信贷。Puneet 在 McKinsey、Capital One、Google 的经历以及早期参与 Google Pay 产品，契合信贷与支付方向；Sanjay 在
              Infosys、Yahoo、Minglebox 及工程基础设施方面的经历，则支撑其技术运营模式。公开市场材料也呈现了法律沿革：Business Standard 称公司于 2014 年 8 月注册为 Whizdm
              Innovations Private Limited，并于 2025 年 5 月更名为 Moneyview Private Limited；IPOCentral 称其于 2025 年 6
              月正式转为公众有限公司。当前董事会构成、上市后的控制图谱及主要投资人的确切剩余持股仍缺少公开信息，因此本章将利益相关方地图视为不完整，并把这些控制问题作为尽调缺口延续，而不以过时的更新背景假设填补。
