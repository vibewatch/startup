schemaVersion: report-v2
artifact: customers
slug: moneyview
runDate: 2026-10-15
company:
  name: Moneyview
chapter:
  number: 6
  title: Customers
  summary: >-
    Moneyview shows real top-of-funnel and monetization scale for a middle-income,
    thin-file borrower base, with public evidence pointing to 134.14 million registered
    users in FY26, 140.28 million by 2026-06-30, and a widening financial-partner
    network. The proof is strongest on app reach, partner distribution, and disbursal
    growth, but public retention, concentration, and named customer outcome disclosure
    remain thin.
sections:
  - id: customer-mix-and-surfaced-demand
    title: Customer mix and surfaced demand
    body: >-
      Public evidence is consistent that Moneyview is aimed at "Middle India" rather
      than prime urban-bank customers. Dhan describes households with annual income of
      Rs 3 lakh to Rs 11 lakh as the core segment, while Financial Express adds that
      nearly 80% of monetized users live in tier-2 towns and beyond and are typically
      around age 32. That combination matters because it frames the platform as a
      borrower-acquisition and underwriting system for underserved, thin-file users,
      not just a generic personal-finance app.
      
      The user proposition also looks two-sided. Consumers use the app for borrowing
      and adjacent financial products, while banks and NBFCs fund or distribute the
      credit products behind the interface. By mid-2026, public sources described
      48 financial partners, and earlier independent coverage cited 42 active partners.
      That makes partner depth part of customer proof: the borrower funnel is real, but
      commercialization depends on external capital providers and regulated lenders.
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-engagement-proof
    title: Adoption trajectory and engagement proof
    body: >-
      Moneyview's adoption story is strongest at the top of the funnel. Dhan reports
      83.27 million registered users in FY24, 134.14 million in FY26, and 140.28 million
      as of 2026-06-30, while Economic Times separately says registered users rose 27%
      annually to 13.4 crore between FY24 and FY26. Official surfaces reinforce that
      the app still has mass reach, claiming 12 crore-plus users, 5 crore-plus downloads,
      36 lakh-plus reviews, 18,400-plus pincodes served, and a 4.8 Google Play rating.
      
      Public monetization proof is thinner but still directionally positive. Dhan says
      monetized users as a share of registered users improved from 5.55% in FY24 to
      8.48% in FY26, and Economic Times says monetized users more than doubled to
      1.1 crore over the same span. Loan disbursals and managed AUM also continued to
      expand, which supports production deployment rather than pilot usage, but none of
      the public evidence here breaks out repeat borrowers, product-level cohorts, or
      channel-level mix.
    claimRefs: [CU003, CU004, CU005, CU010, CU011, CU013]
    tableRefs: [TU002]
  - id: durability-expansion-and-reference-quality
    title: Durability, expansion, and reference quality
    body: >-
      Expansion is visible across both product breadth and partner surfaces. Official
      and third-party materials describe a four-bucket product stack spanning Borrow,
      Transact, Invest, and Protect, while IPO and market-map sources point to specific
      partner-led extensions such as co-branded cards, home loans, loans against property,
      and a roster of named regulated lenders. That suggests Moneyview can deepen wallet
      share from a large acquisition funnel instead of relying on a single-product loan app.
      
      The main weakness is durability disclosure. None of the sources retained in this
      pool publishes NRR, GRR, churn, renewal rates, contract length, repeat-borrow share,
      or top-partner concentration. Economic Times also flags worsening GNPA as regulatory
      and underwriting risk, which raises the importance of those missing cohort and
      concentration metrics. The public proof therefore supports real adoption and partner
      expansion, but not yet durable customer quality at an investable level of transparency.
    claimRefs: [CU007, CU008, CU009, CU011, CU012, CU014]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Middle India mass-market households
        - Borrower / app user / borrower
        - Personal loans and adjacent financial products through the Moneyview app
        - 140.28 million registered users as of 2026-06-30; core income band Rs 3 lakh-Rs 11 lakh
        - Largest top-of-funnel for origination and cross-sell
        - No disclosed split between active borrowers, inactive registrants, and non-credit users
      - - Tier-2 and thin-file borrowers
        - Borrower / app user / borrower
        - Unsecured credit for users underserved by traditional banks
        - Nearly 80% of monetized users live in tier-2 towns and beyond; average age 32
        - Core differentiation in underserved geographies and sparse-bureau underwriting
        - No public city-level loss, repeat-use, or partner-mix disclosure
      - - Multi-product existing users
        - App user / app user / borrower or financial-services customer
        - Cross-sell from loans into cards, insurance, UPI, digital gold, and other flows
        - 12 crore+ official users, 5 crore+ downloads, 18,400+ pincodes served
        - Supports higher lifetime value if engagement converts into multiple products
        - No product-level attach-rate or revenue-per-user disclosure
      - - Lending partners and regulated lenders
        - Bank or NBFC partner / borrower-facing app + partner / financial partner
        - Funding, issuing, and distributing credit products behind the app
        - 42 active partners at 2025-12-31; 48 financial partners at 2026-06-30; 11 named RE partners tracked independently
        - Enables capital-light scaling and broader product coverage
        - Public materials do not disclose partner concentration, renewal terms, or economics by lender
    notes: >-
      Combines customer and channel segments because Moneyview's public evidence describes
      a two-sided network; scale figures mix December 2025, FY26, and June 2026 snapshots.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Registered users
        - 83.27 million (FY24), 134.14 million (FY26), 140.28 million as of 2026-06-30
        - FY24-FY26 and 2026-06-30
        - Dhan IPO page; ET Intelligence corroborates 13.4 crore for FY26
        - Medium
        - Confirms top-of-funnel scale kept expanding into the IPO window
        - Active monthly users and active borrowers are not disclosed
      - - Monetized user penetration
        - 5.55% of registered users in FY24 to 8.48% in FY26
        - FY24-FY26
        - Dhan IPO page
        - Medium
        - Conversion from registrations to monetized usage improved
        - Absolute repeat-borrow or renewal share is not disclosed
      - - Monetized users
        - More than doubled to 1.1 crore; about 10 million monetized users at 2025-12-31
        - FY24-FY26 and 2025-12-31
        - ET Intelligence; Financial Express
        - Medium
        - Suggests monetization is scaling alongside the registration funnel
        - Public sources do not show product mix or frequency per monetized user
      - - Loan disbursals
        - Rs 23,098.52 crore in FY26; Rs 7,152 crore in Q1 FY27, up 40% YoY
        - FY26 and Q1 FY27
        - Dhan IPO page; IndianWeb2
        - Medium
        - Production usage is still rising beyond the FY26 reported base
        - New-user versus repeat-user contribution is not disclosed
      - - Public engagement proof
        - 12 crore+ users, 5 crore+ downloads, 36 lakh+ reviews, 4.8 Google Play rating, 18,400+ pincodes
        - Accessed 2026-10-15
        - Moneyview homepage
        - High
        - Supports breadth of consumer reach and national distribution
        - Storefront metrics do not prove retention, loan activation, or revenue quality
    notes: >-
      Public sources mix fiscal-year, 2025-12-31, 2026-06-30, and live storefront snapshots;
      growth metrics are directionally comparable but not a single cohort dataset.
    claimRefs: [CU003, CU004, CU005, CU010, CU011, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - HDFC Bank partnership
        - Bank partner
        - Expanded Moneyview's personal-loan offering through co-lending distribution
        - Production
        - IPOCentral says the tie-up helped expand personal-loan reach during FY23 growth
        - Public sources here do not disclose volumes, take rates, or current status
      - - SBM Bank India co-branded card relationship
        - Card / partner bank
        - Co-branded Visa credit cards plus BNPL-linked product expansion
        - Production
        - Shows expansion beyond personal loans into adjacent credit products
        - No issuance, activation, or spend metrics are disclosed
      - - Regulated lender roster tracked by DigitalLending.in
        - Lending partners
        - Public listing of Clix Capital Services, Whizdm Finance, Cholamandalam, Northern Arc Capital, DMI Finance, Vivriti Capital, and SMFG India Credit
        - Production
        - Independent market-map evidence that Moneyview has multiple live regulated lending relationships
        - Best-effort registry-style evidence; not a complete revenue or customer concentration view
      - - Financial-partner base
        - Bank and NBFC partners
        - Two-sided credit distribution network behind the consumer app
        - Production
        - 42 active partners at 2025-12-31 and 48 partners at 2026-06-30 indicate partner expansion into the IPO window
        - Aggregated counts do not identify the largest counterparties or renewal risk
    notes: >-
      This is a sample of publicly surfaced partner and deployment proof, not an exhaustive
      customer roster. Moneyview does not publish a complete named-customer list or outcome set
      in the retained evidence.
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly available partner and deployment proof captured in this worker pool; the retained
        sources surface selected partners and counterparties rather than a full live customer or
        lender census across Moneyview's network.
    claimRefs: [CU006, CU008, CU009, CU012, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public journey starts with a broad underserved-borrower funnel, monetizes through
      partner-backed credit, and expands through adjacent financial products, but retention
      proof is the weakest step.
    data:
      items:
        - name: Acquire underserved households
          label: Acquire underserved households
          value: Tier-2+ and Rs 3 lakh-Rs 11 lakh income cohorts
          detail: Moneyview targets middle-income, thin-file borrowers underserved by traditional banks.
          touchpoints:
            - Personal-loan discovery
            - Credit score / money-management entry points
        - name: Activate app funnel
          label: Activate app funnel
          value: 12 crore+ users; 5 crore+ downloads
          detail: Official storefront metrics show large national reach before credit monetization.
          touchpoints:
            - Google Play
            - App install and onboarding
        - name: Monetize into borrowing
          label: Monetize into borrowing
          value: 1.1 crore monetized users; 8.48% monetized share in FY26
          detail: Public sources show monetization improving, but they do not disclose repeat-borrow behavior.
          touchpoints:
            - Personal loans
            - Loan offers in 5 seconds
        - name: Fulfil through partners
          label: Fulfil through partners
          value: 42-48 financial partners; 11 named RE partners
          detail: Capital-light credit delivery depends on regulated lenders and partner balance sheets.
          touchpoints:
            - Co-lending
            - Cards / home-loan / LAP partner flows
        - name: Expand wallet share
          label: Expand wallet share
          value: Borrow, Transact, Invest, Protect
          detail: Cross-sell into cards, insurance, digital gold, UPI, and related products is the main expansion loop.
          touchpoints:
            - Credit cards
            - Insurance
            - UPI
            - Digital gold
        - name: Re-engage and retain
          label: Re-engage and retain
          value: Durability metrics undisclosed
          detail: Public evidence does not disclose NRR, churn, renewals, top-partner concentration, or repeat-borrow cohorts.
          touchpoints:
            - Repeat borrowing
            - Partner renewal
            - Cross-product engagement
    approximationNotes: >-
      The sequence reflects public evidence about the operating loop, not audited conversion rates.
    claimRefs: [CU001, CU003, CU006, CU007, CU010, CU012]
callouts:
  - calloutType: insight
    title: Real scale, limited durability disclosure
    body: >-
      Moneyview has credible public evidence of a mass-market funnel and a live partner-backed
      lending network, but the retained sources still stop short of showing customer durability
      with cohort, renewal, or concentration metrics.
    claimRefs: [CU003, CU005, CU006, CU012]
  - calloutType: risk
    title: Customer quality is harder to judge than customer count
    body: >-
      Public growth metrics are strong, yet Economic Times also reports rising GNPA. Without
      repeat-borrow, churn, or top-partner disclosure, growth can be observed more easily than
      customer quality.
    claimRefs: [CU011, CU012]
