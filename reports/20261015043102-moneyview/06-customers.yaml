      missingEvidence: Revenue share, loan volume, and renewal terms for the largest bank and NBFC partners plus any top-product or top-channel concentration.
      whyItMatters: The business is visibly partner-dependent, so undisclosed concentration could turn partner attrition or pricing changes into a customer-growth bottleneck.
      diligencePath: Obtain partner concentration schedules, commercial terms, and termination rights from the RHP annexes or management diligence room.
