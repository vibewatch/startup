    - type: missing-source
      severity: material
      topic: durability-metrics
      missingEvidence: Customer retention data such as NRR, GRR, churn, renewal, repeat-borrow cohorts, or repayment-vintage curves by product and partner cohort.
      whyItMatters: Without durability metrics, Moneyview's strong top-of-funnel growth cannot be converted into a high-confidence view on customer quality or lifetime value.
      diligencePath: Request cohort tables from the RHP or management data room covering repeat-borrow behavior, renewals, and cohort loss performance by acquisition year and lender partner.
