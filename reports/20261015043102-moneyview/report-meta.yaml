companyProfile:
  summary: >-
    Moneyview is an India-based consumer-fintech platform that combines partner-led lending with a captive NBFC and a
    broader app surface for cards, payments, insurance, savings, and investments. The business listed in October 2026
    after a recut IPO, and the public record now shows scaled registered users, managed AUM, and FY26 revenue, but also
    leaves important questions open on partner economics, credit durability, and post-listing control maturity.
