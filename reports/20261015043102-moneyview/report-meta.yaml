  topStrengths:
    - Scaled platform with 140.28 million registered users and ₹22,520 crore managed AUM.
    - FY26 revenue and profitability support a real operating business rather than a concept story.
    - Broad product breadth plus a meaningful partner network give the app multiple monetization paths.
  topRisks:
    - Asset quality, impairment, and unsecured-lending regulation can still compress growth and returns.
    - Partner/DLG economics and renewal terms remain under-disclosed relative to the scale of the platform.
    - Cybersecurity and governance follow-through remain important after the disclosed fraud loss and IPO reset.
  unresolvedGaps:
    - Final partner-level renewal, pricing, and termination terms for the core lending network.
    - Cohort-level loss experience, DLG drawdown history, and repeat-borrow durability by channel.
    - Post-listing board, committee, and management disclosure including current headcount.
    - Security-remediation evidence and updated fraud-loss disclosure after the FY26 cyber event.
