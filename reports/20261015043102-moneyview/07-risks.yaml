  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Moneyview's risk stack is led by regulatory dependence on RBI digital-lending rules, meaningful DLG and partner concentration exposure, and a disclosed August 2025 cyber-loss event. Public evidence also shows deteriorating FY26 asset quality, while the main mitigants are partner breadth, stated security controls, and rating/capital signals ahead of listing."
  },
  "sections": [
    {
      "id": "severity-ranked-overview",
      "title": "Severity-ranked risk overview",
      "body": "The highest-risk cluster is still tied to the lending model itself rather than to a single isolated incident. Moneyview operates as an LSP that depends on regulated lender partners, carries DLG obligations, and is scaling a large unsecured-credit platform into public markets. That means regulatory rule changes, portfolio-quality deterioration, and partner concentration can hit growth and unit economics at the same time. The disclosed cyber incident raises a separate control question: the company can point to ISO 27001 certification and security messaging, but public evidence still lacks enough remediation detail to conclude that the operational loss vector is fully closed. Until the IPO-era disclosures show cohort-level losses, partner contract durability, and post-incident control closure, the right reading is high residual risk rather than a thesis break today.",
      "claimRefs": [
        "CR001",
        "CR004",
        "CR005",
        "CR006",
        "CR009",
        "CR010",
        "CR011",
        "CR012",
        "CR013",
        "CR014",
        "CR015"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulatory and legal risk remains the primary downside driver",
      "body": "The clearest external risk is that Moneyview's economics sit inside a regulatory perimeter that has already moved in recent periods. Reporting on the DRHP says management explicitly flags DLG caps, BNPL norms, and restrictions on outsourcing core lending functions as risks that can change product strategy, required platform work, and unit economics. That matters more here because the company is not just a software front end: public sources frame it as an LSP with a captive NBFC, multiple lender partners, and a widening product scope that now touches RBI, IRDAI, and SEBI oversight. The mitigation case is real but incomplete. Moneyview is raising capital for DLG support and its NBFC, and IPOCentral reports an Ind-Ra upgrade to IND A-/Stable, yet none of the assigned public sources disclose the partner-by-partner loss behaviour or contractual protections needed to downshift this category below high residual exposure.",
      "claimRefs": [
        "CR001",
        "CR004",
        "CR005",
        "CR007",
        "CR008",
        "CR014",
        "CR015"
      ],
      "tableRefs": [
        "TR001"
      ]
    },
    {
      "id": "operational-credit-and-security-risk",
      "title": "Operational, credit, and security signals still need diligence",
      "body": "Public evidence does not show a collapsing franchise, but it does show that scale is amplifying execution risk. ET Intelligence reports FY26 GNPA rising to 2.7% from 0.9% in FY24 and impairment reaching 28.9% of total income from 18.2%, while IndianWeb2 describes managed AUM of ₹22,520 crore and a user base above 140 million by June 2026. Those figures imply that even modest underwriting drift, collections slippage, or service interruptions can translate into material financial consequences. The operational signal is more concrete on cybersecurity: Medianama says Whizdm Finance suffered an August 2025 attack that drove ₹48.3 crore of unauthorised withdrawals. Management's security claims and certifications are helpful, but without an external post-mortem, closure evidence, or updated fraud-loss disclosure, the incident remains a live diligence item rather than a fully mitigated historical footnote.",
      "claimRefs": [
        "CR003",
        "CR005",
        "CR009",
        "CR010",
        "CR011",
        "CR012",
        "CR013"
      ],
      "tableRefs": [
        "TR002"
      ]
    },
    {
      "id": "partner-dependency-and-kill-criteria",
      "title": "Partner dependency is manageable only if concentration and disclosures keep improving",
      "body": "Moneyview has more diversification than a single-lender marketplace, but it is not insulated from partner behaviour. DigitalLending tracks 11 regulated lending partners, and BankCreds emphasizes that the borrower contract sits with the regulated NBFC rather than with Moneyview, which reduces borrower continuity risk if the app itself fails. That does not remove business-model dependency: Medianama says the top 10 financial partners still represented 37.31% of revenue in 9M FY26 and notes that those partners are not exclusive and may terminate or switch to competitors. The kill criteria for an investor are therefore measurable. Risk meaningfully worsens if partner concentration stops improving, if DLG loss experience forces materially higher provisioning, if post-incident security remediation cannot be evidenced, or if final IPO disclosures leave partner renewals, vintages, and collections performance opaque.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR006",
        "CR015",
        "CR016"
      ],
      "tableRefs": [
        "TR003"
      ]
    }
  ],
