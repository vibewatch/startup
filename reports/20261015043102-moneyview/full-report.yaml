      - number: '5.2'
        title: Operating model, decisioning stack, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes a credit stack optimized for distribution and underwriting rather than
              for open developer extensibility. Moneyview's public narrative emphasizes a digital-only, paperless
              journey, and external coverage adds that the flow is fully unassisted at national scale. Under the hood,
              the most repeated technical differentiators are AI-led underwriting, deep risk segmentation, and hybrid
              capital routing: IPO-focused sources say the models analyze more than one lakh variables and segment users
              into more than 3,000 cohorts, while the funding model routes demand between partner lenders and the
              captive NBFC subsidiary Whizdm Finance. That architecture should help Moneyview approve more borrowers
              than a single-balance-sheet lender can, but it also makes the product dependent on lender integrations,
              DLG structures, and partner appetite that are only thinly documented in public.
            claimRefs:
              - CE004
