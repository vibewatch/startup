      - number: '5.3'
        title: Trust, maturity, and product-technical risks
        blocks:
          - type: paragraph
            body: >-
              Trust controls are visible, but the public disclosure depth is still below what a technical diligence
              process would want. Moneyview claims a 256-bit secure system and ISO 27001:2022 certification, which is
              better than having no security signal at all. The harder datapoint is the external risk evidence: ICICI
              says cybersecurity, data-breach, and technology-disruption exposure remains material and cites a FY26
              cyber incident with INR 48.3 crore of unauthorized transactions. Combined with Economic Times' view that
              many non-loan lines are still nascent, the chapter's main takeaway is that Moneyview appears credible as a
              scaled lending-and-distribution product, but not yet transparent enough for an outsider to underwrite
              operational resilience, release discipline, or partner-integration quality from public materials alone.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Lending-first breadth is the core product advantage
            body: >-
              Moneyview's strongest product pattern is not a novel public API or visible proprietary infrastructure
              surface; it is a lending-first consumer app that can route capital across partner lenders and its captive
              NBFC, then reuse that customer relationship across adjacent financial products.
            calloutType: strength
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE014
          - type: callout
            title: Public technical transparency lags the platform ambition
            body: >-
              Security certification and scale claims are visible, but the assigned pool does not provide public status
              history, engineering-change evidence, or detailed remediation after the FY26 cyber incident, leaving
              operational resilience under-documented for outside diligence.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix and surfaced demand
        blocks:
          - type: paragraph
            body: >-
              Public evidence is consistent that Moneyview is aimed at "Middle India" rather than prime urban-bank
              customers. Dhan describes households with annual income of Rs 3 lakh to Rs 11 lakh as the core segment,
              while Financial Express adds that nearly 80% of monetized users live in tier-2 towns and beyond and are
              typically around age 32. That combination matters because it frames the platform as a borrower-acquisition
              and underwriting system for underserved, thin-file users, not just a generic personal-finance app.

              The user proposition also looks two-sided. Consumers use the app for borrowing and adjacent financial
              products, while banks and NBFCs fund or distribute the credit products behind the interface. By mid-2026,
              public sources described 48 financial partners, and earlier independent coverage cited 42 active partners.
              That makes partner depth part of customer proof: the borrower funnel is real, but commercialization
              depends on external capital providers and regulated lenders.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
