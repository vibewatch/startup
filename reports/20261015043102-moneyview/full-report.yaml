      - number: '1.2'
        title: Founders, governance, and ownership surface
        blocks:
          - type: paragraph
            body: >-
              The core identity remains founder-led. Moneyview's About Us page and IPO coverage align on Puneet Agarwal
              and Sanjay Aggarwal as the co-founders, with the company started in 2014 and built around access to credit
              for underserved households. Puneet's background in McKinsey, Capital One, Google, and early Google Pay
              product work supports the credit-and-payments angle, while Sanjay's background across Infosys, Yahoo,
              Minglebox, and engineering infrastructure supports the technical operating model. The legal history is
              also visible in public-market materials: Business Standard says the company was incorporated as Whizdm
              Innovations Private Limited in August 2014 and renamed Moneyview Private Limited in May 2025, while
              IPOCentral says it formally converted into a public limited company in June 2025. What remains less public
              is the live board composition, post-listing control map, and exact remaining ownership for major
              investors, so this chapter treats the stakeholder map as partial and carries those control questions
              forward as diligence gaps rather than filling them with stale refresh-context assumptions.
