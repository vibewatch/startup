  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer stack: multi-product interface, AI-led decisioning, hybrid lender routing,
      and a still-sparse trust/controls disclosure layer.
    data:
      layers:
        - label: Customer interface
          detail: >-
            Single-app surface that bundles the product family rather than exposing a standalone developer or partner
            console.
          modules:
            - Personal loans
            - Credit cards
            - UPI and bill pay
            - Digital gold, insurance, and savings journeys
        - label: Onboarding and decisioning
          detail: Paperless acquisition flow with AI-led underwriting, segmentation, and offer personalization.
          modules:
            - eKYC and digital onboarding
            - 1 lakh+ underwriting variables
            - 3,000+ user segments
        - label: Capital routing
          detail: Hybrid origination and servicing model spanning partner lenders and the captive NBFC.
          modules:
            - LSP partner origination
            - Whizdm Finance own-book lending
            - DLG-backed partner programs
        - label: Retention loops
          detail: Cross-sell layer that tries to convert a loan relationship into a broader financial relationship.
          modules:
            - Borrow / Transact / Invest / Protect cross-sell
            - Payments and tracking re-engagement
            - Ancillary product attach opportunity
        - label: Trust and controls
          detail: >-
            Security and resilience disclosures that support regulated financial workflows, but remain shallow for deep
            diligence.
          modules:
            - ISO 27001:2022 certification claim
            - 256-bit security claim
            - Disclosed cyber-risk and incident history
        - label: External dependencies
          detail: >-
            Publicly visible product execution depends on lender appetite, compliance changes, and partner integration
            quality.
          modules:
            - Lender and NBFC partner connectivity
            - DLG and unsecured-lending rules
            - Incident-response execution
    approximationNotes: >-
