              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, credit, and security signals still need diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show a collapsing franchise, but it does show that scale is amplifying execution
              risk. ET Intelligence reports FY26 GNPA rising to 2.7% from 0.9% in FY24 and impairment reaching 28.9% of
              total income from 18.2%, while IndianWeb2 describes managed AUM of ₹22,520 crore and a user base above 140
              million by June 2026. Those figures imply that even modest underwriting drift, collections slippage, or
              service interruptions can translate into material financial consequences. The operational signal is more
              concrete on cybersecurity: Medianama says Whizdm Finance suffered an August 2025 attack that drove ₹48.3
              crore of unauthorised withdrawals. Management's security claims and certifications are helpful, but
              without an external post-mortem, closure evidence, or updated fraud-loss disclosure, the incident remains
              a live diligence item rather than a fully mitigated historical footnote.
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Partner dependency is manageable only if concentration and disclosures keep improving
        blocks:
          - type: paragraph
            body: >-
              Moneyview has more diversification than a single-lender marketplace, but it is not insulated from partner
              behaviour. DigitalLending tracks 11 regulated lending partners, and BankCreds emphasizes that the borrower
              contract sits with the regulated NBFC rather than with Moneyview, which reduces borrower continuity risk
              if the app itself fails. That does not remove business-model dependency: Medianama says the top 10
              financial partners still represented 37.31% of revenue in 9M FY26 and notes that those partners are not
              exclusive and may terminate or switch to competitors. The kill criteria for an investor are therefore
              measurable. Risk meaningfully worsens if partner concentration stops improving, if DLG loss experience
              forces materially higher provisioning, if post-incident security remediation cannot be evidenced, or if
              final IPO disclosures leave partner renewals, vintages, and collections performance opaque.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR008
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Main thesis-break trigger
            body: >-
              If final public disclosures show worse-than-expected DLG loss behaviour, further GNPA/impairment
              deterioration, or tighter lender-partner economics, the current watchlist case can break quickly because
              all three pressures hit the same unsecured-credit engine.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR015
          - type: callout
            title: What would de-risk this chapter
            body: >-
              A lower-risk view would require partner-vintage DLG and collections data, a credible post-incident
              security remediation package, and clear evidence that concentration and credit-cost trends are still
              improving after listing.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public tape supports a **track** recommendation with **medium** confidence, a **high** risk rating,
              and a **fair** valuation stance rather than a cheap one. Moneyview did clear the market: the IPO combined
              a fresh issue and offer for sale, the book was heavily subscribed, and the stock opened well above the ₹34
              issue price. But that same first-day move also means an investor is no longer underwriting the ₹6,000
              crore IPO-band value alone; the entry point quickly shifted toward an opening market value near ₹9,789
              crore. At that level, the market is already paying for strong FY26 and Q1 FY27 momentum while still
              relying on unsecured-credit loss performance, regulatory stability, and cleaner post-listing disclosure to
              prove that current profitability is durable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Why the name stays on the watchlist
        blocks:
          - type: paragraph
            body: >-
              Moneyview still earns watchlist attention because scale and breadth are real. The company reported managed
              AUM of ₹22,520 crore by June 30, 2026, FY26 revenue of ₹3,351 crore, and annualized Q1 FY27 return on
              equity near 29.92%, while its own channels present a broad consumer-finance app spanning loans, cards,
              UPI, insurance, and investment. Distribution proof also matters: the website claims 12 crore+ users and
              18,400+ pincodes served, and DigitalLending.in tracks 11 regulated lending partners. That combination
              makes it plausible that Moneyview can keep monetizing more than one credit product, but the investment
              case still depends on proving that partner breadth and user scale convert into durable, cleanly disclosed
              cash earnings after listing.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Valuation context and scenarios
        blocks:
          - type: paragraph
            body: >-
              Valuation support exists, but it is not one-sided. At the IPO band, IndianWeb2 put implied post-issue
              market capitalization at ₹6,000 crore, and ET Intelligence cited a 1.9x post-IPO price-to-book multiple
              versus 2.9x for OnEMI Technology Solutions. That comparison argues the offer was not stretched on book
              value alone. However, the market did not stop at the offer band: Seedtable records a first-day opening
              value near ₹9,788.6 crore, so secondary buyers immediately paid up for momentum. The positive version of
              that story is that stronger Q1 FY27 profitability and deep book demand can justify a rerating; the
              skeptical version is that the rerating already capitalizes a lot of execution before the market has seen
              several post-listing quarters of unsecured-loan losses, partner-vintage performance, and cleaner
              disclosure around overhang and capital deployment.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The price-sensitive conclusion is straightforward: stay engaged, but do not underwrite a more aggressive
              entry multiple until three items are clearer. First, investors need the final post-listing
              capital-structure picture, including whether the March 2026 DRHP's optional pre-IPO placement or later
              selling-shareholder dynamics changed the true overhang. Second, the post-listing quarters need to show
              that rising FY26 GNPA and impairment do not keep expanding as the unsecured book scales. Third, the market
              needs better disclosure on partner-cohort durability, repeat-borrow quality, and how much of the broad app
              footprint actually converts into profitable, resilient lending economics. A thesis break would be
              sustained credit-cost deterioration, tighter unsecured-lending rules that slow growth, or evidence that
              the first-day premium outran the company's ability to compound book value and earnings.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV012
              - CV013
