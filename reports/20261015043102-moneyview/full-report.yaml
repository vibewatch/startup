  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a narrower market definition than a generic "Indian fintech" label. Moneyview's
              own properties describe an all-in-one financial app with loans, cards, UPI, insurance, deposits, and
              investment/gold features, but independent reporting still identifies personal loans as the primary
              offering and key revenue engine. That means the relevant core market is digital consumer credit
              distribution, with adjacent financial products acting mainly as engagement and cross-sell layers rather
              than independent proof that Moneyview already monetizes a broad super-app TAM.


              The right boundary therefore includes unsecured and adjacent consumer-credit workflows, partner-led
              distribution, and repeat financial-product engagement inside one app. It excludes large parts of consumer
              finance that the source set does not show Moneyview monetizing at scale today, such as full-service
              banking, merchant acquiring, or institutional lending. The most credible status-quo substitutes are
              fragmented point products and incumbent lender journeys rather than a single direct peer market, but the
              chapter's evidence pool does not quantify substitution share precisely, so that should remain a diligence
              gap instead of a guessed market-share claim.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: External and bottom-up sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The broadest third-party lens in the pool is Economic Times' citation of Redseer, which projects the
              Indian personal-loan market at ₹33-36 lakh crore by FY31 with 18-20% annual growth. That is directionally
              useful because it matches Moneyview's core monetization category, but it is still a top-down market
              forecast rather than a company-specific SAM. A second, looser ceiling comes from Indianweb2's cited
              projection that India's smartphone base could exceed 900 million by Fiscal 2031, which matters because
              Moneyview distributes through a mobile-first app and therefore rides smartphone penetration more directly
              than branch-led lenders.


              Bottom-up operating lenses are more concrete but still imperfect. ET Intelligence reported 13.4 crore
              registered users and 1.1 crore monetized users in FY26, while the March 2026 IPO coverage cited about 10
              million revenue-generating customers and 42 financial-services partners. Those figures imply a large
              installed funnel and meaningful distribution leverage, but they are not a clean SAM/SOM because public
              sources do not break out product-level conversion by borrower cohort, income band, or acquisition channel.
              The most honest read is that Moneyview has proven scale inside a large and still-growing category, while
              the exact share of wallet it can address in each adjacent product remains under-disclosed.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
