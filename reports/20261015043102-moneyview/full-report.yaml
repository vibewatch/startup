      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed end user is the Indian household borrower. ET Intelligence says Moneyview primarily
              serves households earning ₹3 lakh to ₹11 lakh annually, which frames the platform as a middle-income
              credit-and-financial-utility product rather than a premium banking app. Adoption appears to start with a
              broad consumer app relationship and then deepen through personal loans and adjacent financial products,
              with monetization improving as users take additional credit or transaction products rather than through a
              purely subscription-style model.


              The payer picture is only partially public. Borrowers clearly fund part of economics through loan interest
              and fees, while lender, insurer, and banking partners appear to fund another part through commissions,
              origination economics, or distribution relationships. The source set is strong enough to show the workflow
              direction—consumer acquisition, partner-enabled product breadth, and cross-sell—but not strong enough to
              allocate budget ownership or attach rates by product line. That limitation matters because valuation
              depends on whether user scale can convert into higher-value products without a proportional rise in credit
              cost or partner dependence.
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the current pool are distribution scale, product breadth, and a model
              that pushes users from a broad consumer-finance app into higher-monetization credit products. Independent
              reporting says Moneyview keeps adding adjacent products, while HDIN describes a strategic shift from a
              pure-play LSP to a "Platform + Asset" model and a rising mix of interest income. In valuation terms, that
              is important because it suggests Moneyview is not only paying to acquire app users; it is trying to
              capture more economics per user through underwriting, balance-sheet exposure, and cross-sell.


              The same evidence also shows why timing and multiple expansion should stay constrained. ET Intelligence
              explicitly warns that GNPA has risen and that tighter unsecured-lending regulation could slow growth,
              while HDIN notes that Stage 3 loans and RBI posture remain monitoring items. Those constraints mean
              investors should not annualize top-of-funnel user growth straight into long-duration profitability
              assumptions. The chapter can support a view that the market is large enough and the distribution base deep
              enough for continued growth, but it cannot support a precise long-term SAM/SOM or a clean
              product-by-product conversion model from public evidence alone.
            claimRefs:
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation should anchor on credit monetization, not a generic fintech TAM
            body: >-
              The evidence supports a wide consumer-finance surface, but independent reporting still says personal loans
              remain the key revenue driver. The right valuation question is therefore whether Moneyview can keep
              converting broad user reach into higher-value lending and cross-sell economics without a commensurate rise
              in credit cost or partner dependence.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
              - CM011
          - type: callout
            title: Large reach does not remove regulatory and credit-quality constraints
            body: >-
              Public-market framing can overread user scale. The stronger adverse evidence in the pool says rising GNPA
              and tighter unsecured-lending rules can still slow conversion from broad app reach into durable,
              high-return lending growth.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set extends beyond loan apps
        blocks:
          - type: paragraph
            body: >-
              Moneyview's direct comparison set includes app-led lenders such as Navi, Fibe and KreditBee, but the
              buyer's alternatives are broader than those brands. Diversified NBFCs such as InCred, banks and large
              platforms such as Paytm can combine funding, distribution and regulatory infrastructure; Bajaj Finance and
              Jio Financial are also identified as incumbent threats by one analyst source. Status-quo alternatives
              include borrowing from a bank directly, using an incumbent's digital channel, postponing the purchase or
              relying on informal credit. A regulated lender can also build acquisition, underwriting and servicing
              internally rather than use an LSP. Public competitor disclosure is uneven: the retained evidence gives
              useful model categories and directional comparisons, but not consistent funding, AUM, customer, price or
              loss metrics across the entire set. The profile table therefore marks unavailable fields instead of
              turning unlike metrics into a ranking.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP001
