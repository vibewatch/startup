  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model still leans on partner-fee monetization
        blocks:
          - type: paragraph
            body: >-
              Moneyview's public disclosures show a mixed model rather than a pure balance-sheet lender. The prospectus
              says the company operates as an LSP for personal loans, with WFPL plus partner banks and NBFCs
              underwriting or disbursing credit, while other products use a distribution-led partner model. That
              structure shows up in revenue mix: FY26 revenue was still majority fees and commissions at 56.68%, with
              interest income at 39.17%, so monetization remains anchored to partner distribution and servicing even as
              on-book lending has become more meaningful. Product breadth is broad enough to support cross-sell, but the
              retained public sources do not break out revenue by product line beyond the broad fee-versus-interest
              split.
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI012
          - type: table
            tableRef: TI001
