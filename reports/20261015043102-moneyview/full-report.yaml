      - number: '3.3'
        title: The DLG strategy is both a scale lever and an exposed flank
        blocks:
          - type: paragraph
            body: >-
              Moneyview is increasing DLG-backed lending while Mint reports that Paytm retreated from DLG and Fibe,
              KreditBee and Kissht have increased co-lending activity. This divergence can support faster partner-funded
              scale, but it also concentrates regulatory and economic sensitivity in a structure peers are reducing.
              Moneyview's DLG disbursements rose from ₹8,848 crore in FY24 to ₹11,282 crore in FY25, while DLG expense
              rose from ₹131 crore to ₹321 crore. Separately, Economic Times reported that Moneyview's GNPA increased
              from 0.9% in FY24 to 2.7% in FY26, whereas OnEMI's GNPA improved to 2.3% in the June 2026 quarter from
              3.6% a year earlier. These periods and companies are not directly comparable, but the direction weakens
              any claim that scale alone is a durable moat. Comparable borrower pricing, cohort losses, approval rates
              and lender-level renewal terms remain unavailable, so the positioning map is an evidence-bounded ordinal
              view, not a performance or market-share league table.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
