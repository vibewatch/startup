              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.2'
        title: Differentiation sits in orchestration, data and funding access
        blocks:
          - type: paragraph
            body: >-
              Moneyview's clearest operating distinction is the combination of a company-built technology stack, a large
              consumer funnel, multiple regulated lending partners and its own NBFC. The retained DRHP-based analysis
              reports more than 200,000 applications per day, offers in about five seconds and 22 regulated
              personal-loan partners as of December 2025. Those capabilities can reduce integration friction and give
              Moneyview more routing choices than a single-balance-sheet lender. They do not by themselves prove better
              credit selection, lower acquisition cost or stronger retention than peers. Multi-homing remains plausible
              on both sides: consumers can compare several apps, while banks and NBFCs can work with multiple LSPs or
              build internally. Switching cost is therefore more operational than contractual, arising from accumulated
              repayment data, configured lender integrations and servicing workflows rather than demonstrated customer
              lock-in. The capability matrix separates disclosed evidence from unknown competitor cells.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
