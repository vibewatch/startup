      - number: '1.3'
        title: Funding path, IPO reset, and overview watchpoints
        blocks:
          - type: paragraph
            body: >-
              Moneyview's 2026 transition to public markets is the defining current event. The March 2026 DRHP coverage
              described an IPO with up to ₹1,500 crore of fresh issue proceeds and an offer for sale of up to 13.6 crore
              shares, but later September 2026 coverage shows a smaller ₹1,092 crore deal with a ₹32-34 price band, a
              ₹750 crore fresh issue, and roughly ₹342 crore of OFS. Finsamudra characterized that reset as about a 48%
              step-down from the peak private valuation, while IPOCentral and Prittle Prattle identify Tiger Global,
              Accel, Ribbit Capital, Winter Capital, and Evolvence among the investor set around the business. The
              watchpoint is that the IPO story is not just growth-and-profitability: ET Intelligence flagged GNPA
              deterioration and regulatory exposure to unsecured lending, while InCred highlighted the one-time
              cyber-fraud plus CEO-incentive hit to FY26 reported profit. Those issues do not negate scale, but they do
              keep the overview chapter from treating the public listing as proof of durable underwriting quality or
              governance maturity.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: IPO reset is the central overview fact
            body: >-
              The public-market step was not a simple step-up from private funding: September 2026 sources frame the IPO
              at roughly ₹5,985-6,000 crore, far below the late-2024 private valuation benchmark, while still preserving
              a profitable growth narrative.
            calloutType: insight
