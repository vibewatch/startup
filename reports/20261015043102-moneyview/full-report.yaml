  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Regulatory and credit-quality risks remain the two highest residual exposures, with cyber still elevated despite
      stated controls.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-18 months from current public evidence.
        - label: Impact
          detail: Potential effect on growth, provisioning, disclosure burden, or investor view.
        - label: Mitigation maturity
          detail: Observed evidence of controls, capital, or partner diversification.
        - label: Residual exposure
          detail: Net rating after considering public mitigants and missing diligence.
      rows:
        - label: Regulatory / DLG model risk
          note: Depends on RBI rules, DLG economics, and outsourced-lending boundaries.
          values:
            - label: Medium
              tone: warning
              note: Rules already shifted in 2025-26 and remain an active management risk factor.
            - label: High
              tone: critical
              note: Could alter unit economics, product scope, and capital needs.
            - label: Medium
              tone: warning
              note: IPO funds and NBFC capital help, but cohort evidence is still missing.
            - label: High
              tone: critical
              note: Still the main thesis-pressure point in the assigned pool.
        - label: Asset quality / credit-cost drift
          note: Driven by GNPA and impairment deterioration in FY26 public reporting.
          values:
            - label: Medium-High
              tone: high
              note: Deterioration is already visible in public FY26 commentary.
            - label: High
              tone: critical
              note: Directly affects provisioning, margins, and IPO-quality earnings confidence.
            - label: Medium
              tone: warning
              note: Rating and profitability help, but public vintages are absent.
            - label: High
              tone: critical
              note: Cannot be downgraded without partner and cohort loss transparency.
        - label: Cyber / privacy / fraud control risk
          note: Assessed after the disclosed August 2025 Whizdm Finance incident.
          values:
            - label: Medium
              tone: warning
              note: A material incident already occurred, but recurrence is not proven.
            - label: High
              tone: critical
              note: Could trigger direct financial losses and regulatory scrutiny.
            - label: Medium
              tone: warning
              note: ISO 27001:2022 and stated security controls are helpful but not dispositive.
            - label: Medium-High
              tone: high
              note: Residual rating stays elevated until remediation evidence is public.
        - label: Partner concentration / non-exclusivity
          note: Revenue share improved, but key lending partners still matter materially.
          values:
            - label: Medium
              tone: warning
              note: Risk is structural and can recur with repricing or termination.
            - label: Medium-High
              tone: high
              note: Could slow origination and weaken unit economics.
            - label: Medium
              tone: warning
              note: An 11-partner map is better than a single-lender dependency.
            - label: Medium-High
              tone: high
              note: Still needs contract and renewal visibility to move lower.
        - label: Multi-regulator compliance expansion
          note: Insurance, cards, and public-listing readiness widen the oversight surface beyond core RBI lending rules.
          values:
            - label: Medium
              tone: warning
              note: The exposure grows as product breadth and listed-company obligations expand.
            - label: Medium-High
              tone: high
              note: Can slow launches, increase disclosure burden, and raise remediation costs.
            - label: Medium
              tone: warning
              note: Governance is improving, but public compliance evidence remains limited.
            - label: Medium-High
              tone: high
              note: Residual exposure stays elevated until control ownership is clearer by regulator.
        - label: Operating-scale service resilience
          note: A large user base and AUM mean outages or complaints can quickly become financially meaningful.
          values:
            - label: Medium
              tone: warning
              note: Scale increases the chance that ordinary incidents propagate broadly.
            - label: Medium
              tone: warning
              note: Impact is meaningful but usually less existential than regulatory or credit failures.
            - label: Medium
              tone: warning
              note: Public operating controls and SLA disclosure are still thin.
            - label: Medium
              tone: warning
              note: Needs complaint, uptime, and collections-service evidence to move lower.
    approximationNotes: >-
      Likelihood and residual ratings are analyst judgments anchored to the retained source set; they are not
      source-quoted numeric probabilities.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
