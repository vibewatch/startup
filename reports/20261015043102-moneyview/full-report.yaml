      - number: '4.2'
        title: Public scale is strong, but unit economics are only partially visible
        blocks:
          - type: paragraph
            body: >-
              Scale is not the question in the public record. Moneyview disclosed roughly ₹23,099 crore of FY26 loan
              disbursals, about ₹3,351 crore of FY26 revenue, and 140.28 million registered users with 11.90 million
              monetized users as of June 30, 2026. Marketing and direct sourcing cost also fell to 1.90% of FY26
              disbursals from 2.92% in FY24, which is a useful acquisition-efficiency proxy. The problem is that these
              are still top-level indicators: the retained sources do not show CAC by channel, payback by cohort,
              repeat-borrow contribution, or product-level take rates, so the public data supports momentum but not a
              full unit-economic underwrite.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI008
              - CI009
      - number: '4.3'
        title: Capital needs are explicit, and credit costs are rising with on-book exposure
        blocks:
          - type: paragraph
            body: >-
              The IPO disclosures make capital dependency explicit. Net proceeds are directed mainly toward supporting
              DLG-backed loan growth and injecting capital into WFPL, which fits the company's narrative that a
              capital-light platform now also needs more balance-sheet and credit-support capacity to keep scaling. That
              need matters because credit costs are not benign: prospectus data puts impairment at 28.89% of FY26 total
              income and 5.16% of average managed AUM, while ET Intelligence says GNPA rose to 2.7% in FY26 from 0.9% in
              FY24 and highlights unsecured-lending regulation as a growth risk. Public listing does add equity-market
              access, but it does not eliminate the need to watch loss absorption and partner concentration closely.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 'Verdict: good public growth evidence, incomplete underwriting evidence'
        blocks:
          - type: paragraph
            body: >-
              The public picture is strong enough to support a positive view on revenue momentum, product breadth, and
              access to new capital, but not strong enough to underwrite margin durability with confidence. Fee-heavy
              revenue still depends on partner economics that are negotiated rather than published, while the rising
              contribution from interest income increases sensitivity to credit losses, DLG performance, and funding
              conditions. The main blockers are not whether Moneyview is growing, but whether realized pricing, cohort
              losses, partner renewal economics, and post-IPO liquidity are attractive enough after adjusting for rising
              impairment. Until management discloses those details, the chapter can support a growth-and-profitability
              narrative but not a clean public unit-economics case.
            claimRefs:
              - CI003
              - CI008
              - CI010
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credit-cost pressure is the main public disconfirming signal
            body: >-
              The cleanest adverse evidence is not on growth but on credit quality. Prospectus impairment ratios and
              ET's GNPA commentary both say that as on-book exposure grows, margin durability becomes more sensitive to
              loss performance and unsecured-lending regulation.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
          - type: callout
            title: Fresh capital is aimed at keeping the lending engine funded
            body: >-
              The disclosed use of IPO proceeds is economically revealing: most of the fresh issue is reserved either
              for DLG-backed disbursal growth or for augmenting WFPL capital. That suggests Moneyview is scaling from a
              distribution-heavy model toward a structure that still needs material funding support to sustain growth.
            calloutType: insight
            claimRefs:
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Moneyview's public app surface is broad enough to look like a financial super-app, but the evidence still
              points to lending as the center of gravity. The homepage breaks the experience into loans, savings,
              insurance, expense tracking, and payments, while independent IPO coverage describes the app as a single
              digital platform across Borrow, Transact, Invest, and Protect. That breadth matters because it gives
              Moneyview more than one reason to reacquire the same user, yet the strongest public maturity proof still
              sits with digital personal loans rather than the rest of the bundle. Economic Times explicitly says the
              adjacent categories remain nascent, so the right interpretation is not a fully proven multi-line platform,
              but a lending-led interface that is trying to deepen engagement through surrounding financial jobs.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
              - CE014
