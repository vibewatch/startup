      - number: '7.2'
        title: Regulatory and legal risk remains the primary downside driver
        blocks:
          - type: paragraph
            body: >-
              The clearest external risk is that Moneyview's economics sit inside a regulatory perimeter that has
              already moved in recent periods. Reporting on the DRHP says management explicitly flags DLG caps, BNPL
              norms, and restrictions on outsourcing core lending functions as risks that can change product strategy,
              required platform work, and unit economics. That matters more here because the company is not just a
              software front end: public sources frame it as an LSP with a captive NBFC, multiple lender partners, and a
              widening product scope that now touches RBI, IRDAI, and SEBI oversight. The mitigation case is real but
              incomplete. Moneyview is raising capital for DLG support and its NBFC, and IPOCentral reports an Ind-Ra
              upgrade to IND A-/Stable, yet none of the assigned public sources disclose the partner-by-partner loss
              behaviour or contractual protections needed to downshift this category below high residual exposure.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR008
              - CR014
              - CR015
