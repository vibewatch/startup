    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and scale
        blocks:
          - type: paragraph
            body: >-
              Moneyview now reads as a listed Indian fintech rather than a pre-IPO startup: its 15 October 2026 Business
              Standard market page shows live NSE/BSE tickers, while the company's own surfaces still position it as a
              broad financial app spanning loans, payments, cards, insurance, and savings products. The official website
              emphasizes a partner-led model, not a monoline lender story, and independent IPO coverage frames the
              business as a digital-only, credit-led platform built for middle-income Indian households. The scale
              evidence is large but time-sensitive, so the chapter preserves dates explicitly: Prittle Prattle cited
              more than 125 million users as of 31 December 2025, while Finsamudra cited 140.28 million registered users
              and ₹22,520 crore of managed AUM as of 30 June 2026. The current evidence also supports FY26 operating
              revenue and profit after tax as distinct accounting metrics, which makes the current stage "public, still
              scaling" rather than "growth at any cost."
