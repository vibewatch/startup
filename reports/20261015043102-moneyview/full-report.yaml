      - number: '6.2'
        title: Adoption trajectory and engagement proof
        blocks:
          - type: paragraph
            body: >-
              Moneyview's adoption story is strongest at the top of the funnel. Dhan reports 83.27 million registered
              users in FY24, 134.14 million in FY26, and 140.28 million as of 2026-06-30, while Economic Times
              separately says registered users rose 27% annually to 13.4 crore between FY24 and FY26. Official surfaces
              reinforce that the app still has mass reach, claiming 12 crore-plus users, 5 crore-plus downloads, 36
              lakh-plus reviews, 18,400-plus pincodes served, and a 4.8 Google Play rating.

              Public monetization proof is thinner but still directionally positive. Dhan says monetized users as a
              share of registered users improved from 5.55% in FY24 to 8.48% in FY26, and Economic Times says monetized
              users more than doubled to 1.1 crore over the same span. Loan disbursals and managed AUM also continued to
              expand, which supports production deployment rather than pilot usage, but none of the public evidence here
              breaks out repeat borrowers, product-level cohorts, or channel-level mix.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU013
      - number: '6.3'
        title: Durability, expansion, and reference quality
        blocks:
          - type: paragraph
            body: >-
              Expansion is visible across both product breadth and partner surfaces. Official and third-party materials
              describe a four-bucket product stack spanning Borrow, Transact, Invest, and Protect, while IPO and
              market-map sources point to specific partner-led extensions such as co-branded cards, home loans, loans
              against property, and a roster of named regulated lenders. That suggests Moneyview can deepen wallet share
              from a large acquisition funnel instead of relying on a single-product loan app.

              The main weakness is durability disclosure. None of the sources retained in this pool publishes NRR, GRR,
              churn, renewal rates, contract length, repeat-borrow share, or top-partner concentration. Economic Times
              also flags worsening GNPA as regulatory and underwriting risk, which raises the importance of those
              missing cohort and concentration metrics. The public proof therefore supports real adoption and partner
              expansion, but not yet durable customer quality at an investable level of transparency.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU012
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real scale, limited durability disclosure
            body: >-
              Moneyview has credible public evidence of a mass-market funnel and a live partner-backed lending network,
              but the retained sources still stop short of showing customer durability with cohort, renewal, or
              concentration metrics.
            calloutType: insight
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU012
          - type: callout
            title: Customer quality is harder to judge than customer count
            body: >-
              Public growth metrics are strong, yet Economic Times also reports rising GNPA. Without repeat-borrow,
              churn, or top-partner disclosure, growth can be observed more easily than customer quality.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The highest-risk cluster is still tied to the lending model itself rather than to a single isolated
              incident. Moneyview operates as an LSP that depends on regulated lender partners, carries DLG obligations,
              and is scaling a large unsecured-credit platform into public markets. That means regulatory rule changes,
              portfolio-quality deterioration, and partner concentration can hit growth and unit economics at the same
              time. The disclosed cyber incident raises a separate control question: the company can point to ISO 27001
              certification and security messaging, but public evidence still lacks enough remediation detail to
              conclude that the operational loss vector is fully closed. Until the IPO-era disclosures show cohort-level
              losses, partner contract durability, and post-incident control closure, the right reading is high residual
              risk rather than a thesis break today.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR009
