  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Moneyview has public proof of strong FY26 scale, a fee-heavy but increasingly interest-supported revenue mix, and an IPO capital plan aimed at funding loan growth plus NBFC capitalization. The same public record still leaves key underwriting inputs missing, especially realized pricing, CAC payback, current cash runway, and partner-cohort loss performance."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model still leans on partner-fee monetization",
      "body": "Moneyview's public disclosures show a mixed model rather than a pure balance-sheet lender. The prospectus says the company operates as an LSP for personal loans, with WFPL plus partner banks and NBFCs underwriting or disbursing credit, while other products use a distribution-led partner model. That structure shows up in revenue mix: FY26 revenue was still majority fees and commissions at 56.68%, with interest income at 39.17%, so monetization remains anchored to partner distribution and servicing even as on-book lending has become more meaningful. Product breadth is broad enough to support cross-sell, but the retained public sources do not break out revenue by product line beyond the broad fee-versus-interest split.",
      "claimRefs": [
        "CI003",
        "CI006",
        "CI007",
        "CI012"
      ],
      "tableRefs": [
        "TI001",
        "TI002"
      ],
      "figureRefs": [
        "FI001"
      ]
    },
    {
      "id": "scale-and-efficiency",
      "title": "Public scale is strong, but unit economics are only partially visible",
      "body": "Scale is not the question in the public record. Moneyview disclosed roughly ₹23,099 crore of FY26 loan disbursals, about ₹3,351 crore of FY26 revenue, and 140.28 million registered users with 11.90 million monetized users as of June 30, 2026. Marketing and direct sourcing cost also fell to 1.90% of FY26 disbursals from 2.92% in FY24, which is a useful acquisition-efficiency proxy. The problem is that these are still top-level indicators: the retained sources do not show CAC by channel, payback by cohort, repeat-borrow contribution, or product-level take rates, so the public data supports momentum but not a full unit-economic underwrite.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI004",
        "CI005",
        "CI013"
      ],
      "tableRefs": [
        "TI003"
      ]
    },
    {
      "id": "capital-intensity-and-risk",
      "title": "Capital needs are explicit, and credit costs are rising with on-book exposure",
      "body": "The IPO disclosures make capital dependency explicit. Net proceeds are directed mainly toward supporting DLG-backed loan growth and injecting capital into WFPL, which fits the company's narrative that a capital-light platform now also needs more balance-sheet and credit-support capacity to keep scaling. That need matters because credit costs are not benign: prospectus data puts impairment at 28.89% of FY26 total income and 5.16% of average managed AUM, while ET Intelligence says GNPA rose to 2.7% in FY26 from 0.9% in FY24 and highlights unsecured-lending regulation as a growth risk. Public listing does add equity-market access, but it does not eliminate the need to watch loss absorption and partner concentration closely.",
      "claimRefs": [
        "CI008",
        "CI009",
        "CI010",
        "CI011"
      ],
      "figureRefs": []
    },
    {
      "id": "financial-verdict",
      "title": "Verdict: good public growth evidence, incomplete underwriting evidence",
      "body": "The public picture is strong enough to support a positive view on revenue momentum, product breadth, and access to new capital, but not strong enough to underwrite margin durability with confidence. Fee-heavy revenue still depends on partner economics that are negotiated rather than published, while the rising contribution from interest income increases sensitivity to credit losses, DLG performance, and funding conditions. The main blockers are not whether Moneyview is growing, but whether realized pricing, cohort losses, partner renewal economics, and post-IPO liquidity are attractive enough after adjusting for rising impairment. Until management discloses those details, the chapter can support a growth-and-profitability narrative but not a clean public unit-economics case.",
      "claimRefs": [
        "CI003",
        "CI008",
        "CI010",
        "CI013"
      ]
    }
  ],
