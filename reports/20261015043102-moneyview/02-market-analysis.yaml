  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som-methodology
      missingEvidence: A product-level SAM / SOM bridge that ties Moneyview's core borrower segments, adjacent products, and revenue pools to a single comparable denominator.
      whyItMatters: Without that bridge, the market can only be sized through mixed top-down and bottom-up lenses, which weakens precision on adoption headroom and terminal-value assumptions.
      diligencePath: Obtain the full DRHP or management KPI pack with segment-level borrower counts, attach rates, and revenue mix by product.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: Product-level disclosure of who pays for acquisition and economics across borrower fees, lender commissions, insurance distribution, cards, and payments.
      whyItMatters: Budget ownership determines contribution margin durability and whether adjacent products truly widen the addressable market or just add low-yield engagement.
      diligencePath: Request partner contracts or management disclosure on fee splits, take rates, and attach rates by product line.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM003]
