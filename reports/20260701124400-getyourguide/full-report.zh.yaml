            body: >-
              给投资委员会最干净的表达是：这是一个已有规模的品类领导者，只有私人财务事实成立时价格才算公允到有吸引力；公开证据不足以支持溢价买入。公司有足够规模证据，值得继续推进，尤其是 2026 年 IPO
              窗口打开时，但本章不会为公开来源无法提供的信息强行做精确承销。若经审计收入超过 $1 billion、可持续盈利得到验证、股权结构干净，建议可以上调。若 2023 年估值已经嵌入旅行需求高点、2024
              年融资主要是防守性，或公开可比公司倍数压缩，建议会迅速恶化。因此当前立场是纪律性跟踪，并设置明确价格和证据闸门。这样保留有纪律的安全边际，而不是硬做一个虚假的精确估值。
