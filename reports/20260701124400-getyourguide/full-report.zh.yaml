      - number: '2.2'
        title: 规模测算视角与线上渗透率
        blocks:
          - type: paragraph
            body: >-
              最可辩护的规模测算方法是分层。TAM 是体验总支出；SAM 是其中可在线预订或已在线预订的部分；SOM 是专业市场平台在考虑地理重点、品类质量、流量获取和供应商经济性后能够捕获的部分。2026 年
              Arival/Phocuswright 材料给出了少见的直接视角：2025 年导览、活动和景点规模为 $271 billion，2029 年达 $342 billion；2025 年线上渗透率 33%，2029
              年预计为 42%。这些数字意味着 2025 年在线体验总预订额约 $89 billion，到 2029 年约 $144
              billion。因此，机会不只是品类增长，也来自线上占比迁移；该占比仍明显低于更广义旅行市场报道的 64% 线上渗透率。这些数字最好按总预订池理解，而不是净收入。GetYourGuide
              收入还取决于佣金、退款、供应商激励、营销成本和地域组合，所以在获得私有数据前，本章不量化公司特定 SOM。
