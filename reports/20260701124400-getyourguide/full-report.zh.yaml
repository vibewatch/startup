  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何冲击论点
      - 行动含义
    rows:
      - - 收入不达标
        - 经审计 2025 年收入显著低于 $1B
        - 抬高隐含收入倍数，削弱规模叙事
        - 避免溢价或重新定价
      - - 利润率不及预期
        - 增长投入后盈利只是暂时，或转为亏损
        - 抹掉 IPO 级平台经济性
        - 仅跟踪或回避
      - - 优先权压力
        - 新债务 / 优先权分走普通股退出价值
        - 即使企业价值增长，也压低投资者实际回报
        - 要求重置条款
      - - 增长质量担忧
        - 增长靠无利可图的付费获客驱动
        - 压缩终局倍数
        - 下调估值情形
      - - IPO 延迟
        - 到 2026 年仍没有可信公开申报或退出路径
        - 拉长持有期并扩大流动性折价
        - 提高要求回报
    notes: 触发因素对应会改变价格、建议或风险评级的尽调证据。
    claimRefs:
      - CV026
      - CV028
      - CV029
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入质量
        - 月度 GMV、净收入、抽佣率
        - 决定隐含倍数和收入韧性
        - 数据室财务模型和审计师勾稽
      - - 盈利能力
        - 毛利率、贡献利润率、EBITDA、现金转化
        - 区分规模化平台和补贴驱动增长
        - CFO 访谈和经审计报表
      - - 需求质量
        - 复购、CAC 回收期、退款和取消分群
        - 检验增长是否高效且可持续
        - 按地区和渠道导出分群数据
      - - 供给质量
        - 供应商流失、集中度、独家性、质量问题
        - 决定护城河和抽佣率韧性
        - 运营商分群和头部供应商复核
      - - 资本结构
        - 债务、清算优先权、二级交易估值
        - 决定普通股回报路径
        - 股权结构表、融资文件、法律复核
    notes: 这些问题会实质影响建议能否从跟踪推进到买入。
    claimRefs:
      - CV024
      - CV034
      - CV037
      - CV038
      - CV039
