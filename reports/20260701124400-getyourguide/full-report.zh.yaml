              转正。相较自有车队、场馆或库存的运营方，该模式也更轻资产。不过，公司仍是私有公司，且缺少经审计合并财务，现有证据不足以支持投资级承保。英国子公司的申报历史确认存在正式申报，但不能回答集团层面问题。因此，必须拿到的管理层资料包很直接：从
