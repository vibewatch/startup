      - number: '2.4'
        title: 约束、负面证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              让体验品类变得有吸引力的市场信号，也会带来约束。Arival 的运营方数据显示，供应商更依赖 OTA，而直接网站份额下降；即便市场平台解决发现问题，也可能产生抽佣率压力和依赖。信任不是可选项：Airbnb
              的房东要求说明了为什么身份、许可、保险和认证会成为品类准入门槛。目的地层面的监管是最清晰的负面证据。欧洲来源记录了游客税、禁令、访客上限和威尼斯准入控制，这些都可能改变团队规模、高峰可用性和旅行者摩擦。未解决的投资者问题包括：GetYourGuide
              自身在在线 SAM 中的份额、抽佣率、复购率、留存，以及专业市场平台是否比横向 OTA
              捕获更多增量线上迁移。因此，投资者应把监管和信任按运营要求承保，而不是当作边缘情形。在头部目的地，上限或税费可能提高旅行者紧迫感，但也可能减少可用库存、增加取消负担，并让供应商入驻更复杂。
