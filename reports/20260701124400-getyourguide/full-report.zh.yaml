      - number: '3.4'
        title: 护城河结论与尽调要求
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 具备可信的竞争位置，因为它结合了声称的全球广度、已验证评论、支持、免费取消信息、供应商工具和精选
              Originals。但公开证据还无法证明护城河，因为最重要的竞争变量仍是私有的：独家库存份额、实际佣金率、付费搜索依赖、供应商流失、转化、退款率和复购行为。负面情形很直接：Google 和 OTA
              使发现商品化，运营方多平台经营，类似的移动市场平台压缩差异化，直到 CAC 和抽佣率恶化。因此，尽调路径应优先看供应商合同样本、目的地层面的赢 / 输数据、app 留存 cohort、搜索渠道组合和
              Originals 经济性。没有这些，本章可以排序公开能力，但不能证明持久定价权。因此，本章给予 GetYourGuide 真实但受证据约束的竞争优势。公开案例在广度、品牌、app
              存在和精选库存上最强；未解决的问题是，相比 Viator、Klook、OTA 和 Google 中介需求，这些资产能否转化为更低获客成本、更好的供应商条款和复购行为。
