  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 应按目的地内导览、活动、景点、一日游、文化体验及相邻可预订服务的市场平台来测算，而不是按包含机票和住宿的通用 OTA
              来测算。这个边界很重要：描述在线旅行或旅行与旅游的资料能提供需求背景，但核心 TAM
              来自导览、活动和景点。现状仍很分散：旅行者可以在景点售票处购买、询问酒店礼宾、使用本地代理、直接在运营方网站预订、依赖现场余量，或选择竞争性 OTA 和 superapp。GetYourGuide 声称覆盖
              12,000 个城市、超过 150,000
              个体验，说明跨品类具备相关性，但不意味着能自动拿下每一美元活动支出。尽调中重要的边界问题是：支出是否作为一个离散的目的地体验被预订，并伴随可用性、内容、评论和支持需求。这个口径排除了宽泛的旅行组成部分，但纳入了市场平台可以改善发现、降低交易不确定性的活动。
