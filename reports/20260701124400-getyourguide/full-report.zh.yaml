chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide
              更适合按总部位于柏林的在线旅行体验交易平台来承保，而不是按拥有底层活动交付的导览运营商来承保。公司给消费者的承诺是：围绕导览、景点、门票、一日游和其他目的地体验，提供精选发现与预订；供应商条款则把运营模式说清楚：旅行者与独立活动提供方签约，GetYourGuide
              负责撮合预订、收款、排序、支持和 app 流程。这一区分会影响后续每一章，因为真正的资产是市场密度和信任；但供应商履约与内容准确性仍是结构性尽调风险。创始故事稳定且来自公司：Johannes、Tao、Martin
              和 Tobias 几位同学在北京遇到行程规划问题后，于 2009 年创办了公司。当前法律和运营足迹指向柏林的 GetYourGuide Deutschland
              GmbH，区域支付实体支持本地交易。这个框架也能避免后文把供应商经济性重复计入 GetYourGuide 自有服务收入，并让尽调基准锚定可观察的市场事实，而不是宣传口径。
