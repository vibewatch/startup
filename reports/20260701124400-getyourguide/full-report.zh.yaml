      - number: '3.2'
        title: 能力、定价与 UX 同质性
        blocks:
          - type: paragraph
            body: >-
              公开证据能支撑功能比较，但不能给出精确的抽佣率排序。GetYourGuide 披露了只收佣金、不收上架费的供应商模式，并称注册后具体佣金因国家而异；这对供应商沟通有用，但不足以承保已实现利润率。Viator 和
              Klook 都展示了供应商或商户获客入口，确认运营方入驻是一项被争夺的能力。在旅行者侧，GetYourGuide、Viator 和 Klook 都有应用商店证据，所以除非专有转化或留存数据证明相反，移动 UX
              应视为基本门槛。GetYourGuide Originals 是最清晰的公开差异化，但标准景点门票、取消惯例和 app
              预订流程，同行很容易复制或打包。尽调含义是，要把公开功能同质性与专有经济性分开。一个市场平台在消费者文案里看起来差异化，却可能仍在同一运营方库存和付费搜索拍卖中竞争。反过来，渠道管理器连接这样看似很小的功能，也可能显著影响供应商切换成本，因为它改变了运营方增加另一个需求渠道时要付出的额外工作量。
