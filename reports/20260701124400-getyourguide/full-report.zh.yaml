      - number: '7.5'
        title: 缓释、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              缓释要看可测量控制。如果 GetYourGuide 能展示按法域区分的预订条款、P2B 透明度、DSA 投诉流程、隐私治理和成文供应商义务，监管暴露就得到缓释。如果内部看板显示运营方 cohort
              的取消和退款缺陷下降、退款周期短、供应商下架可执行，运营暴露就得到缓释。如果自然 / app /
              直接复购需求增长快于付费获客、供给变得差异化而非商品化，且伙伴渠道能在不稀释利润率的情况下增加需求，竞争暴露就得到缓释。终止标准很直接：证据显示 Google 或 OTA 捕获客户关系，而
              GetYourGuide 为低利润供给买单；退款类负面评论持续恶化；法律结论要求高成本调整退款、排序或商户披露；或在单位经济证明前被迫融资 /
              下调估值融资。这些信号会把可管理的市场平台风险转化为打破投资逻辑的经济性风险。
