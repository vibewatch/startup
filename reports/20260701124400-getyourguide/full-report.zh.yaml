        - 大型盈利性在线旅游最佳基准
        - 住宿占比较高，规模也大得多
      - - Airbnb
        - 公开 2025 年 10-K 披露平台收入和风险
        - 轻资产平台基准
        - 住宿房东经济性不同于旅游团和活动
      - - Tripadvisor
        - 公开 2025 年 10-K 覆盖更广旅游和体验业务
        - 竞争和需求风险的负面基准
        - 业务组合和媒体业务敞口削弱对纯活动业务的映射
      - - PitchBook / Crunchbase 私有公司档案
        - GetYourGuide 私募市场状态参考点
        - 有助于交叉验证私募融资背景
        - 档案数据是二手资料，且常在付费墙后
      - - IMARC / 市场研究页面
        - 在线旅游增长基准
        - 支持情景中的市场顺风
        - 市场类目宽于旅游团和活动
    enumerationScope:
