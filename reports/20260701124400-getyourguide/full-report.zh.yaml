  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 应放在宽竞争集合中承保，而不是只和导览市场平台比较。最接近的替代者是 Viator 和
              Klook，因为它们追求同一个旅行者任务：在出行前或出行中发现、比较并预订导览、景点和本地体验。当景点门票、博物馆、日本线路或本地导览深度决定购买时，Tiqets 和 VELTRA
              作为品类或区域专家也重要。更危险的相邻竞争来自 Airbnb Experiences、Booking.com Attractions、Expedia Things to Do 和 Google Things to
              do，因为它们可以在旅行者有意访问独立体验市场平台之前截获需求。结果是一个分层格局：直接同业压选择和价格，专业平台压特定库存口袋，OTA 压分发经济性，Google
              压发现权力。这个边界很重要，因为每类竞争者攻击的利润池不同。直接同业攻击供应商选择和消费者比较页；专业平台攻击高意图场馆库存；OTA 攻击行程规划语境；Google
              攻击第一次搜索点击。分开处理这些对手，可以避免得出“GetYourGuide 只要更多库存就能赢”的错误结论。
