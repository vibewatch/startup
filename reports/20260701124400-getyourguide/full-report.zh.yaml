            body: >-
              运营流程从旅行者发现和排序开始，随后展示可用性和价格，再进入预订、凭证发放和供应商处核销。供应商流程正好相反：创建并维护产品，保持可用性和价格更新，接受或处理预订，扫描门票，管理取消，与旅行者沟通，并使用表现 /
              推荐动作界面优化上架。公开证据能看到的技术架构不是完整内部技术栈，而是一组边界。API 文档显示 REST / JSON、SSL 和 API token；供应商文档显示 API
              价格、可用性更新、预订处理，以及票券条形码或二维码支持；官方供应商页面称已接入超过 100
              个预订系统和渠道管理器。这使核心架构更像围绕供应商库存系统的市场平台编排层，而不是垂直拥有的导览运营平台。关键承保含义是，产品价值由 GetYourGuide
              和第三方运营方共同生产：软件可以改善发现、同步和核销，但实际导览质量、签到流程和取消行为取决于供应商执行。公开文档足以描绘工作流边界，却不足以量化每次交接的失败率。
