      - number: '2.3'
        title: 需求驱动与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求既受宏观旅行复苏支撑，也受更具体的体验导向行程规划迁移支撑。UN Tourism 2026 年 1 月晴雨表称增长趋势正回到疫情前；Klook、Simon-Kucher、Expedia 和 American
              Express 则指向年轻旅行者、社交发现、AI 辅助规划、本地体验和兴趣驱动旅行。商旅休闲把场景扩展到纯度假之外，因为员工可以在商务安排前后增加本地活动。对 GetYourGuide
              而言，采用路径从灵感开始，经由社交或搜索发现，比较评论和可用性，并在移动结账、灵活政策和值得信任的支持降低行程规划焦虑时转化。这些驱动因素相互强化：国际旅行恢复创造场景，年轻人带来数字发现习惯，商旅休闲创造工作日城市需求。运营问题在于，当大型
              OTA 和社交渠道争夺同一意图时，获客成本能否保持足够低。
