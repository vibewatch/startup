companyProfile:
  summary: >-
    GetYourGuide 是一家总部位于柏林的旅行体验交易平台，成立于 2009 年。公开资料支持这样一种双边模式：平台连接旅行者与独立导览、景点和活动运营方；官方声称覆盖 12,000 个城市、超过 150,000
    个体验，已售出超过 200 million 张门票，并拥有超过 50,000 家供应商。融资证据以 2023 年 6 月 $194M 融资为核心，当时估值约 $1.9B，之后 2024 年又获得融资支持。2025 年公开收入 /
    盈利信号偏正面，但公司尚未发布经审计合并财务或股权结构细节。
