              公开单位经济披露很少，所以本章使用结构性代理指标。GetYourGuide 似乎避免重库存所有权：供应商保留定价和可用性控制，GetYourGuide 提供需求生成、预订转化、支付、集成、客户支持、内容和 AI
              辅助发现。这套架构一旦覆盖付费获客和支持成本，应能支撑相对较低 capex 和可扩展毛利。主要利润率压力项包括效果营销、app
              与网页转化、客服、退款、拒付、合作伙伴佣金和供应商质量运营。应用商店和条款页面承诺即时确认、离线票和大多数预订的灵活取消，而负面评论证据凸显无效票、退款争议和沟通失败。经济问题不是公司能否大规模处理预订；而是扣除获客、支持、退款和伙伴分成后，贡献利润能否在目的地和供应商
