  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 不是一个泛泛的质量评分题，而是一个对价格和证据都敏感的承销判断。本章因此建议跟踪或继续研究，而不是无条件买入。以外界广泛报道的最近一次私人估值、接近 $2 billion
              为锚，只要管理层能证明 2025 年收入超过 $1
              billion、盈利真实存在，并且优先权结构不会把退出价值从新普通股投资者手里分走，投资案例就有吸引力。拿不到这些文件，同样的价格只能算公允：公开记录能证明市场平台规模，却不能证明经审计的单位经济。决策规则故意不对称：价格不高于低个位数收入倍数且条款干净才买入；在审计证据到位前按最近估值继续跟踪；如果收入、利润率或资本结构尽调不达标，就不要为溢价买单。
