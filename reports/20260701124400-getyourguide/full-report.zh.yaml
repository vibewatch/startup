            body: >-
              GetYourGuide 的产品最好理解为双边在线市场平台，而不是单一旅行
              app。在旅行者侧，它把搜索、发现、预订、支付相邻结账、凭证、评论、取消承诺和支持打包成面向导览、景点和活动的消费者流程。在供应商侧，公开页面显示有认证供应商门户、产品与预订管理、表现分析、验票扫描、推荐动作、验证、政策执行和支持工具。产品的第三面是分发：面向更大流量和预订量伙伴的合作伙伴
              API、旅行代理佣金界面，以及面向运营方的预订系统 / 渠道管理器集成。公开最成熟的模块是市场平台发现、供应商自助服务、API / 预订连接和信任政策控制；当前独立的 Originals /
              独家体验模块在保留公开来源中没有足够文档支持，因此作为尽调缺口处理，而不是默认差异化。这个边界对产品尽调仍然重要。
