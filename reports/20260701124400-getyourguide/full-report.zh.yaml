      - number: '1.2'
        title: 规模、产品界面与供给控制
        blocks:
          - type: paragraph
            body: >-
              公开规模画像方向上很强，但指标口径必须谨慎处理。About 页面声称覆盖 12,000 个城市、超过 150,000 个体验，并售出超过 200 million
              张门票；移动应用商店页面显示的体验数更低，分别为超过 75,000 或超过 100,000。本章不强行选出一个唯一口径，而是把网页 About
              页面视为公司当前最高的官方说法，并将渠道差异标为定义或更新节奏缺口。供给质量是核心控制点：供应商门户称 GetYourGuide 与注册、合法合规且入驻前接受审核的公司和独立运营方合作。产品界面现在覆盖网站、原生
              app、Originals by GetYourGuide、先预订后付款、离线票、即时确认、联盟分发和供应商连接。这些功能支撑转化和流动性，但也把评论完整性、供应商合规和排序公平纳入尽调范围。
