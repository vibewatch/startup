              GetYourGuide 的公开信任控制界面很广。供应商标准覆盖安全、伦理、法律合规、受限活动、动物福利、活动质量、提供方评分、临时暂停和永久下架。法律和隐私页面定义消费者与数据义务，DSA 和 phishing
              指引则显示平台合规和供应商安全教育。这些控制有意义，但证据以政策为中心：保留来源没有披露可测量的执行率、事件量、支持 SLA、已验证评论滥用率或 API
              uptime。独立评论网站通过呈现预订、取消和支持投诉提供负面参照，确认即便有政策脚手架，执行风险仍然存在。因此，产品尽调应索取运营遥测，而不只是政策文件。对尽调而言，管理层需要把公开架构接到运营看板：按集成类型拆分的
              API 可用性、陈旧库存事件、凭证扫描失败率、取消根因、评论审核结果和支持响应时间分布。这些指标可以把可见产品图谱转化为可投资的可靠性评估。
