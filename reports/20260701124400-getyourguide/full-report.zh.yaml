        title: 分发权力、供应商准入与多平台经营
        blocks:
          - type: paragraph
            body: >-
              竞争风险不在于某个同业网站明显更好，而在于供给和需求可能拆开。运营方完全可能多平台经营，因为 GetYourGuide、Viator、Klook、Tiqets、Booking、Expedia 和 Google
              都提供某种触达需求或库存分发的路径。Google Things to do 尤其重要，因为其文档描述了 Google 自有页面、feed
              集成、连接伙伴、内容许可和广告用例；这可以把发现变成所有市场平台上游的收费站。Booking 和 Expedia 带来另一种风险：它们能把活动放在住宿、套餐和账户关系旁边。因此，GetYourGuide
              需要可衡量的自然品牌需求、独家库存和供应商分析价值，才能避免纯粹依赖付费分发。这就是为什么供应端和需求端必须一起测试。如果供应商多平台经营，但 GetYourGuide
              拥有复购旅行者需求，护城河仍能成立。如果复购需求弱，发现又从 Google 或 OTA 版位租来，平台就有沦为可替换结账层的风险。
