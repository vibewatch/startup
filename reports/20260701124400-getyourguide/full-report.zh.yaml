    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              从财务上看，GetYourGuide 更适合理解为在线旅行体验交易平台，而不是持有库存的旅行运营商。最干净的公开证据来自供应商页面：运营方无需预付维护费即可上架，只有成功预订才收取佣金；GetYourGuide
              按扣除佣金后的金额支付已履约预订。这意味着收入与交易挂钩，随预订量变化，并依赖公司未公布的抽佣率。第二层变现来自旅行代理分发：代理门户向代理商营销佣金收入，让 GetYourGuide 在直接消费者 app
              和网页获客之外多了一个需求渠道。官方页面还显示，供应商工具、渠道管理器集成、可用性管理、多语言旅行者界面和支付流程共同构成经济基础设施。承保含义是：轻资产市场平台经济性带来正面的收入质量，但精度较弱，因为实际抽佣率、退款漏损、折扣，以及直接预订与代理转介预订的组合仍未披露。
