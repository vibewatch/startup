              当前最强的财务信号，是 Skift 2025 年 10 月报道称 CEO Johannes Reck 表示 GetYourGuide 首次盈利，调整后 EBITDA 转正，过去一年收入接近 €1
              billion，约 $1.2 billion。这与 CB Insights 对 2025 年收入 $1.17 billion 的估计一致，也与官方规模信号相互印证，例如旅行代理页面显示每日预订
