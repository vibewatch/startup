            body: >-
              估值工作采用情景表，而不是单点模型，因为 GetYourGuide
              披露的公开输入参差不齐。牛市情景认可大型在线旅游市场、已具规模的票务基础，以及一家未上市体验专营平台有机会按可信市场平台倍数上市。基准情景承认公司有价值，但等待经审计的收入、贡献利润率和抽佣率证据。熊市情景借用上市公司风险因素和
              Tripadvisor 的警示视角，建模更慢增长、营销压力和品类竞争。Booking Holdings 和 Airbnb 展示了盈利型公开市场平台可以长什么样，但它们偏住宿的经济模型不能机械套到旅游团和活动上。
