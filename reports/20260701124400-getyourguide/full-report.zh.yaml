      - number: '8.2'
        title: 融资背景与估值支撑
        blocks:
          - type: paragraph
            body: >-
              2023 年融资是估值锚，因为它是外部报道中最清晰的价格信号。Reuters 和 Bloomberg 都把该轮估值放在约 $2 billion，合作伙伴和旅游行业来源则指向 2024
              年仍有融资支持。这种支持重要，但不能过度解读。债务或结构化融资可以延长资金续航，也能验证贷款人兴趣，却不能证明新股权应该支付溢价。承销立场把 2024 年支持视为通向规模和 IPO
              可选性的桥，而不是新的公平交易普通股估值。截至运行日，没有留存的 S-1 或招股书，因此 IPO 时点仍只是可选项；本章明确要求尽调当前股本结构和优先权条款。
