- id: unit-economics-cost-structure-and-margin-path
  title: Unit economics, cost structure, and margin path
  body: 'Public unit-economics disclosure is thin, so the chapter uses structural proxies. GetYourGuide appears to avoid heavy
    inventory ownership: suppliers retain pricing and availability control, and GetYourGuide supplies demand generation, booking
    conversion, payments, integrations, customer support, content, and AI-assisted discovery. That architecture should support
    relatively low capex and scalable gross profit once paid acquisition and support costs are covered. The main margin-pressure
    items are performance marketing, app and web conversion, customer service, refunds, chargebacks, partner commissions,
    and supplier-quality operations. App-store and terms pages promise instant confirmation, offline tickets, and flexible
    cancellation on most bookings, while adverse review evidence highlights invalid tickets, refund disputes, and communication
    failures. The economic question is not whether the company can process bookings at scale; it is whether contribution margin
    after acquisition, support, refunds, and partner payouts is consistently positive by destination and supplier cohort.'
