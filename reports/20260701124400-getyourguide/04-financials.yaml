- id: capital-adequacy-and-exit-readiness
  title: Capital adequacy and exit readiness
  body: 'GetYourGuide''s capital story improved materially after the June 2023 financing: multiple reports describe $85 million
    of Series F equity and a $109 million revolving credit facility, led by Blue Pool Capital and UniCredit respectively,
    with KKR, Temasek, BNP Paribas, Citi, and KfW also involved. CNBC and Skift reported total investment above $1 billion
    after the round, while CB Insights reports $1.079 billion across 18 rounds. The difference versus the careers page''s
    $883 million raised appears to reflect whether debt and credit facilities are included. That mixed capital stack matters
    because the RCF can support working capital and growth without immediate equity dilution, but it also introduces debt
    obligations and covenants that are not publicly visible. IPO readiness remains plausible but unproven: CB Insights tags
    an IPO-rumored event in 2026, but no S-1, prospectus, consolidated audit, cash balance, monthly burn, or official timetable
    is public as of the run date.'
