- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is cautiously constructive. GetYourGuide now has public evidence of very large transaction
    scale, a credible 2025 revenue band around €1.0 billion to $1.2 billion, and reported positive adjusted EBITDA. The model
    is also asset-light compared with operators that own fleet, venues, or inventory. However, the evidence remains insufficient
    for investment-grade underwriting because the company is private and audited consolidated financials are unavailable.
    The UK subsidiary filing history confirms formal filings exist but does not close group-level questions. The must-have
    management package is therefore straightforward: audited revenue bridge from GMV to net revenue, take-rate history, gross
    margin and contribution margin by destination and channel, CAC/payback, refund and chargeback rates, cash balance, RCF
    covenants, monthly burn, and 2026 budget. Until those inputs are supplied, the chapter should avoid treating the reported
    profitability milestone as a fully derisked IPO-quality financial profile.'
