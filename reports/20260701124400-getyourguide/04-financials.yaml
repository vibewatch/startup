- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited consolidated revenue
    - Cannot verify whether €1B/$1.2B is net revenue, GMV, or management metric
    - Request audited group P&L and revenue-recognition memo
  - - Cash, burn and runway
    - Cannot judge financing dependency after RCF and profitability milestone
    - Request monthly cash, cash forecast, burn, and debt draw schedule
  - - Take rate and revenue mix
    - Cannot assess revenue quality by channel or destination
    - Request GMV-to-net revenue bridge by market and channel
  - - Gross margin and contribution margin
    - Cannot determine whether positive adjusted EBITDA is durable
    - Request gross margin, support/refund/payment costs, and contribution margin
  - - CAC, payback and retention
    - Cannot evaluate sales efficiency or repeat purchase economics
    - Request cohort-level CAC, payback, repeat bookings, and LTV
  - - Refunds, complaints, chargebacks
    - Review issues may signal leakage or trust drag
    - Request refund rate, chargebacks, support contacts, and NPS by supplier cohort
  notes: These are not cosmetic gaps; they are the minimum package needed before relying on the profitability claim.
