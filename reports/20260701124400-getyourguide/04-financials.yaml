  - - Supplier tooling / integrations
    - Reservation-system integrations and management tools support supply retention
    - 100+ reservation or channel-manager integrations cited
    - Strategic enabler; standalone SaaS fee not disclosed
    - Whether any supplier SaaS fees exist beyond commission
