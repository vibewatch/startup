- id: scale-profitability-and-revenue-evidence
  title: Scale, profitability, and revenue evidence
  body: 'The strongest current financial signal is Skift''s October 2025 report that CEO Johannes Reck said GetYourGuide became
    profitable for the first time, with adjusted EBITDA positive and revenue approaching €1 billion, or about $1.2 billion,
    over the past year. That aligns with CB Insights'' 2025 revenue estimate of $1.17 billion and with official scale signals
    such as 85,000+ daily bookings on the travel-agent page, 1,000+ employees, 50,000+ supply partners, and 150,000+ to 200,000+
    available experiences across official pages. The 2025 revenue band should nevertheless be treated as public-reported rather
    than audited: the cited revenue comes from management remarks and an analyst profile, not consolidated financial statements.
    The quality of the milestone is still meaningful because it is paired with a volume metric — 10 million Q3 experiences
    booked and booking value up 30% year over year — but diligence should reconcile whether reported revenue means net commission
    revenue, gross booking value, or another internal metric.'
