      - number: '7.3'
        title: Operational quality, supplier control, and refund failure risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is structurally high because GetYourGuide does not fully control the local guide,
              attraction, weather, transport, queue, language quality or last-mile safety experience that the traveler
              attributes to the brand. The supplier page confirms the marketplace model; the app-store listings and
              customer-review sources confirm consumer scale and the importance of mobile booking. The adverse evidence
              is not that every customer has a bad experience, but that negative review channels repeatedly cite
              cancellations, refund disputes, unreliable bookings and weak support. Those failure modes matter because
              they can propagate into chargebacks, lower conversion, higher service cost, and paid-marketing
              inefficiency. A risk register should therefore track supplier defect rate, refund cycle time, post-booking
              cancellation rate, support backlog, review-rating trend, and share of bookings from operators with repeat
              complaints. Without those internal controls, public supply breadth can mask fragile quality economics.
