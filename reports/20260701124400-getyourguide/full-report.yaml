      - number: '7.4'
        title: Competitive, dependency, and financial-model pressure
        blocks:
          - type: paragraph
            body: >-
              The competitive risk is broader than Viator. Tripadvisor’s experience surfaces and Viator brand target the
              same traveler intent; Google’s Things to Do documentation shows that Google can intermediate activity
              discovery on its own properties; Booking, Expedia, Airbnb and Tripadvisor public filings show large travel
              platforms with consumer traffic, loyalty assets, and marketing budgets that can subsidize adjacent
              categories. That creates two related financial risks. First, GetYourGuide may need high and continuing
              paid acquisition to win intent against platforms that own accommodation, maps, search, reviews or loyalty.
              Second, suppliers can multi-home across GetYourGuide, Viator, direct websites and OTA partners, which
              limits exclusive inventory and can pressure commission rates. The company’s private disclosure profile
              compounds this: public sources confirm large historical funding but do not disclose current gross booking
              value, contribution margin, CAC payback, refund reserves or supplier concentration.
            claimRefs:
              - CR031
