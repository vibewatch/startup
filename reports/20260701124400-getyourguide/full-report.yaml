      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final investment work should focus on variables that can change the call, not on more market
              narrative. Required diligence includes monthly GMV, net revenue, take rate, gross margin, contribution
              margin, cash conversion, CAC payback, repeat booking, refund rates, supplier churn, and the exact
              liquidation preference stack. Thesis-break triggers are similarly concrete: a down round, a
              recapitalization that disadvantages new common equity, revenue materially below the $1 billion
              underwriting threshold, temporary or negative EBITDA, or evidence that growth depends on unprofitable paid
              acquisition. These triggers transmit directly into the valuation because they either reduce the numerator
              of exit value or increase the multiple discount applied to private opacity.
            claimRefs:
              - CV024
              - CV026
              - CV027
              - CV032
