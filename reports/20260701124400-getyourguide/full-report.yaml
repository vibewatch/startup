  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide is not a generic quality-score exercise; it is a price-sensitive and evidence-sensitive
              underwriting decision. The current chapter therefore recommends tracking or researching more rather than
              an unconditional buy. At the last widely reported private mark of nearly $2 billion, the case can be
              attractive if management can prove that 2025 revenue exceeded $1 billion, profitability was real, and the
              preference stack does not divert exit value away from new common-equity investors. Without those
              documents, the same price is only fair because the public record proves marketplace scale but not audited
              unit economics. The decision rule is deliberately asymmetric: buy only at or below a low-single-digit
              revenue multiple with clean terms, track at the last mark pending audited evidence, and avoid a premium if
              revenue, margin, or capital-structure diligence disappoints.
            claimRefs:
              - CV001
              - CV002
              - CV003
