      - number: '2.3'
        title: Demand drivers and adoption path
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by both macro travel recovery and a more specific shift toward experience-led trip
              planning. UN Tourism’s January 2026 barometer described a return toward pre-pandemic growth trends, while
              Klook, Simon-Kucher, Expedia and American Express point to younger travelers, social discovery,
              AI-assisted planning, local experiences and passion-led trips. Bleisure expands occasions beyond
              holiday-only demand because workers can add local activities before or after business obligations. For
              GetYourGuide, the adoption path starts with inspiration, moves through social or search discovery,
              compares reviews and availability, and converts when mobile checkout, flexible policies and trusted
              support reduce trip-planning anxiety. These drivers are mutually reinforcing: recovered international
              trips create occasions, younger cohorts bring digital discovery habits, and bleisure creates weekday urban
              demand. The operating question is whether acquisition cost stays low enough as large OTAs and social
              channels compete for the same intent.
