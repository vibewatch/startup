  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide should be sized as a marketplace for in-destination tours, activities, attractions, day
              trips, cultural experiences and adjacent bookable services, not as a generic online travel agency that
              includes flights and lodging. That boundary matters because the sources that describe online travel or
              travel and tourism are useful demand context, but the core TAM comes from tours, activities and
              attractions. The status quo is still broad: travelers can buy at attraction box offices, ask hotel
              concierges, use local agents, book direct operator websites, rely on walk-up availability, or choose
              competing OTAs and superapps. GetYourGuide’s stated breadth of more than 150,000 experiences in 12,000
              cities indicates relevance across categories, but not automatic capture of every activity dollar. For
              diligence, the important boundary question is whether spend is booked as a discrete destination experience
              with availability, content, reviews and support needs. That excludes broad trip components but includes
              the activities where marketplaces can improve discovery and reduce transaction uncertainty.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM020
              - CM030
              - CM036
              - CM037
