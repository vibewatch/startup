      - number: '1.2'
        title: Scale, product surface, and supply controls
        blocks:
          - type: paragraph
            body: >-
              The public scale picture is directionally strong but requires careful metric hygiene. The about page
              claims over 150,000 experiences in 12,000 cities and more than 200 million tickets sold, while
              mobile-store surfaces show lower experience counts of more than 75,000 or more than 100,000. Rather than
              force one canonical count, this chapter treats the web about page as the highest current company claim and
              flags the channel mismatch as a definitional or refresh-cadence gap. Supply quality is a core control
              point: the supplier portal says GetYourGuide works with companies and independent operators that are
              registered, legally compliant, and reviewed before onboarding. The product surface now spans the website,
              native apps, Originals by GetYourGuide, reserve-now-pay-later, offline tickets, instant confirmation,
              affiliate distribution, and supplier connectivity. These features support conversion and liquidity, but
              they also make review integrity, supplier compliance, and ranking fairness part of the diligence scope.
