      - number: '5.2'
        title: Workflow and Marketplace Architecture
        blocks:
          - type: paragraph
            body: >-
              The operating workflow starts with traveler discovery and ranking, moves through availability and price
              presentation, then into booking, voucher issuance and redemption at the supplier. The supplier workflow is
              the mirror image: create and maintain products, keep availability and prices current, accept or process
              bookings, scan tickets, manage cancellations, communicate with travelers and optimize listings using
              performance/recommended-action surfaces. The technical architecture visible from public evidence is not a
              full internal stack; it is a set of boundaries. API docs show REST/JSON, SSL and API tokens; supplier docs
              show price-over-API, availability updates, booking processing and ticket barcode or QR-code support;
              official supplier pages describe integrations with over 100 reservation systems and channel managers. This
              makes the core architecture a marketplace orchestration layer around supplier inventory systems rather
              than a vertically owned tour-operations platform. A critical underwriting implication is that product
              value is jointly produced by GetYourGuide and third-party operators: the software can improve discovery,
              synchronization and redemption, but the actual tour quality, check-in process and cancellation behavior
              depend on supplier execution. Public documentation is strong enough to map workflow boundaries, yet not
              strong enough to quantify each handoff's failure rate.
