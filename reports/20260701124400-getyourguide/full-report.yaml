  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape boundary and competitor classes
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide should be underwritten in a broad competitive set, not only against tour marketplaces. The
              closest substitutes are Viator and Klook because they pursue the same traveler job: discover, compare, and
              book tours, attractions, and local experiences before or during a trip. Tiqets and VELTRA matter as
              category or regional specialists where attraction tickets, museums, Japan corridors, or local tour depth
              define the buying decision. The more dangerous adjacencies are Airbnb Experiences, Booking.com
              Attractions, Expedia Things to Do, and Google Things to do because they can intercept demand before a
              traveler intentionally visits a standalone experiences marketplace. The result is a layered landscape:
              direct peers pressure selection and price, specialists pressure specific inventory pockets, OTAs pressure
              distribution economics, and Google pressures discovery power. This boundary matters because each
              competitor class attacks a different profit pool. Direct peers attack supplier choice and consumer
              comparison pages; specialists attack high-intent venue inventory; OTAs attack trip-planning context; and
              Google attacks the first search click. Treating them separately prevents a false conclusion that
              GetYourGuide only needs more inventory to win.
