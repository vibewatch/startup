      - number: '7.2'
        title: Regulatory, legal, and consumer-rights exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory burden is material because GetYourGuide sits between travelers and local operators while
              taking a contractual role in booking, cancellation, refund and data flows. Its own terms and privacy
              policy are useful mitigants because they document booking conditions, cancellation mechanics,
              data-processing controls and the company’s attempt to define platform responsibilities. They do not
              eliminate legal exposure. EU package-travel rules, consumer-rights rules, the Digital Services Act and
              platform-to-business regulation all create obligations that can affect marketplace transparency, complaint
              handling, trader ranking, refund expectations and platform governance. The legal risk is most acute when a
              bundle, cancellation, misdescribed attraction, unsafe operator, or unavailable tour turns a
              customer-service failure into a statutory claim. The company’s ability to prove clear supplier terms,
              accurate descriptions, prompt refunds and auditable complaint escalation is therefore a diligence gate,
              not an operational nice-to-have.
            claimRefs:
