chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide is best underwritten as a Berlin-headquartered online travel-experiences marketplace, not as
              a tour operator that owns the underlying activity delivery. The company presents the consumer promise as
              curated discovery and booking for tours, attractions, tickets, day trips, and other destination
              experiences, while its supplier terms make the operating model explicit: travelers contract with
              independent activity providers and GetYourGuide intermediates the booking, payment collection, ranking,
              support, and app workflow. That distinction matters for every later chapter because marketplace density
              and trust are the asset, but supplier performance and content accuracy remain structural diligence risks.
              The founding story is stable and company-sourced: classmates Johannes, Tao, Martin, and Tobias launched
              the business in 2009 after a trip-planning problem in Beijing. The current legal and operating footprint
              points to GetYourGuide Deutschland GmbH in Berlin, with regional payment entities supporting local
              transactions. This framing also prevents later chapters from double-counting supplier economics as
              GetYourGuide-owned service revenue and keeps the diligence base aligned to observable marketplace facts
              rather than promotional shorthand.
