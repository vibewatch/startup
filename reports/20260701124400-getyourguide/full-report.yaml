      - number: '7.5'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be evaluated through measurable controls. Regulatory exposure is mitigated if
              GetYourGuide can show jurisdiction-specific booking terms, P2B transparency, DSA complaint workflows,
              privacy governance, and documented supplier obligations. Operational exposure is mitigated if internal
              dashboards show declining cancellation and refund defects by operator cohort, short refund cycle times,
              and enforceable supplier offboarding. Competitive exposure is mitigated if organic/app/direct repeat
              demand grows faster than paid acquisition, if supply becomes differentiated rather than commoditized, and
              if partner channels add demand without margin dilution. The kill criteria are straightforward: evidence
              that Google or OTAs capture the customer relationship while GetYourGuide funds low-margin supply;
              persistent adverse-review deterioration tied to refunds; legal findings that require costly refund,
              ranking or trader-disclosure changes; or a financing round/down-round required before unit-economics
              proof. Those signals would convert manageable marketplace risk into thesis-breaking economics risk.
            claimRefs:
              - CR041
