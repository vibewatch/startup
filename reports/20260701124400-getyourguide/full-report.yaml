      - number: '4.2'
        title: Scale, profitability, and revenue evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial signal is Skift's October 2025 report that CEO Johannes Reck said
              GetYourGuide became profitable for the first time, with adjusted EBITDA positive and revenue approaching
              €1 billion, or about $1.2 billion, over the past year. That aligns with CB Insights' 2025 revenue estimate
              of $1.17 billion and with official scale signals such as 85,000+ daily bookings on the travel-agent page,
