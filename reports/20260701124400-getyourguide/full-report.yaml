  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide is financially best understood as an online travel-experiences marketplace rather than an
              inventory-owning travel operator. The cleanest public evidence is the supplier page: operators can list
              without an upfront maintenance fee and are charged a commission only on successful bookings, while
              GetYourGuide pays fulfilled bookings net of commission. That makes revenue transaction-linked, variable
              with booking volume, and dependent on a take rate that the company does not publish. A second monetization
              layer comes through travel-agent distribution: the agent portal markets commission income to agents,
              giving GetYourGuide another demand channel beyond direct consumer app and web acquisition. Official pages
              also point to supplier tooling, channel-manager integrations, availability management, multilingual
              traveler surfaces, and payment workflows as economic infrastructure. The underwriting implication is
              positive revenue quality from asset-light marketplace economics, but weak precision because realized take
              rate, refund leakage, discounting, and mix between direct and agent-referred bookings remain undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
