      - number: '8.3'
        title: Scenario and comparable work
        blocks:
          - type: paragraph
            body: >-
              The valuation work uses a scenario table rather than a single-point model because GetYourGuide's disclosed
              public inputs are uneven. The bull case gives credit for large online travel markets, a scaled ticket
              base, and the possibility that a private experiences specialist can list publicly at a credible
              marketplace multiple. The base case assumes the company is valuable but waits for audited revenue,
              contribution margin, and take-rate proof. The bear case uses public-company risk factors and the
              Tripadvisor cautionary lens to model slower growth, marketing pressure, and category competition. Booking
              Holdings and Airbnb show what profitable public marketplaces can look like, but their lodging-heavy
              economics are not mechanically transferable to tours and activities.
            claimRefs:
