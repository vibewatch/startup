      - number: '3.3'
        title: Distribution power, supplier access, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              The competitive risk is less that one peer has a visibly better website and more that supply and demand
              can unbundle. Operators can plausibly multi-home because GetYourGuide, Viator, Klook, Tiqets, Booking,
              Expedia, and Google all provide some route to demand or inventory distribution. Google Things to do is
              especially important because its docs describe Google-owned surfaces, feed integrations, connectivity
              partners, content licensing, and advertising use cases; this can turn discovery into a toll booth upstream
              of every marketplace. Booking and Expedia add a different risk: they can place activities beside lodging,
              packages, and account relationships. GetYourGuide therefore needs measurable organic brand demand,
              exclusive inventory, and supplier analytics value to avoid pure paid-distribution dependence. This is why
              the supplier side and demand side should be tested together. If suppliers multi-home but GetYourGuide owns
              repeat traveler demand, the moat can still hold. If repeat demand is weak and discovery is rented from
              Google or OTA placements, the marketplace risks becoming an interchangeable checkout layer.
            claimRefs:
              - CP016
