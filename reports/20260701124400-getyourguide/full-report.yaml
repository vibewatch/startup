      - number: '2.4'
        title: Constraints, adverse evidence and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same market signals that make experiences attractive also create constraints. Arival’s operator data
              show suppliers relying more on OTAs while direct website share declines, which can produce take-rate
              pressure and dependence even if marketplaces solve discovery. Trust is not optional: Airbnb’s host
              requirements show why identity, licensing, insurance and certifications can be category gating items.
              Destination-level regulation is the clearest adverse evidence. European sources document tourist taxes,
              bans, visitor limits and Venice access controls, all of which can change group sizes, peak availability
              and traveler friction. The unresolved investor questions are GetYourGuide’s own share of online SAM, take
              rate, repeat rate, retention, and whether specialist marketplaces capture more incremental online shift
              than horizontal OTAs. Investors should therefore underwrite regulation and trust as operating
              requirements, not edge cases. In top destinations, caps or taxes may raise traveler urgency but can also
              reduce available inventory, increase cancellation burden and complicate supplier onboarding.
