  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and thesis-break view
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide should be underwritten as a marketplace whose risk is not one catastrophic license issue but
              a chain of medium-to-high probability stresses that can converge in a travel downturn. The public evidence
              supports a late-stage company with broad supply and global consumer reach, yet it also shows the model
              depends on third-party experience operators, search and app-store discovery, refund trust, and
              cross-border consumer-law compliance. That makes residual risk highest where external counterparties
              control the traveler experience or the demand funnel. Competition is not limited to like-for-like activity
              specialists: Viator and Tripadvisor compete directly for experiences, Booking, Expedia and Airbnb filings
              show large travel platforms with performance-marketing and app ecosystems, and Google offers Things to Do
              integrations on Google-owned surfaces. Thesis break should therefore be defined around observable
              pressure—declining organic visibility, paid-search CAC inflation, lower net take-rate, refund leakage, or
              loss of premium supply—not around a single headline event.
            claimRefs:
