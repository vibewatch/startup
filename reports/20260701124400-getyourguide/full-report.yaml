      - number: '2.2'
        title: Sizing lenses and online penetration
        blocks:
          - type: paragraph
            body: >-
              The most defensible sizing approach is layered. TAM is total experiences spend; SAM is the online-bookable
              or online-booked portion of that spend; SOM is the portion that a specialist marketplace can capture after
              geographic focus, category quality, traffic acquisition and supplier economics. The 2026
              Arival/Phocuswright materials provide an unusually direct lens: $271 billion of tours, activities and
              attractions in 2025, $342 billion by 2029, 33% online penetration in 2025, and a 42% online projection for
              2029. Those figures imply roughly $89 billion of online experiences gross bookings in 2025 and about $144
              billion by 2029. The opportunity is therefore not just category growth, but an online mix shift that
              remains well below broader travel’s reported 64% online penetration. The figures are best read as
              gross-booking pools rather than net revenue. GetYourGuide revenue would depend on commission, refunds,
              supplier incentives, marketing costs and geographic mix, so the chapter keeps company-specific SOM
              unquantified until private data is available.
            claimRefs:
