      - number: '8.2'
        title: Financing context and valuation support
        blocks:
          - type: paragraph
            body: >-
              The 2023 financing is the anchor because it is the clearest externally reported price signal. Reuters and
              Bloomberg both put the round near a $2 billion valuation, while partner and travel-industry sources point
              to continued financing support in 2024. That support matters, but it should not be overread. Debt or
              structured financing can extend runway and validate lender interest without proving that new equity should
              pay a premium. The underwriting stance treats the 2024 support as a bridge to scale and IPO optionality,
              not as a fresh arm's-length common-equity valuation. The absence of a retained S-1 or prospectus as of the
              run date means IPO timing remains optional, and the chapter carries explicit diligence asks for current
              capitalization and preference terms.
            claimRefs:
