  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's product is best understood as a two-sided online marketplace rather than a single travel
              app. On the traveler side, it packages search, discovery, booking, payment-adjacent checkout, vouchers,
              reviews, cancellation promises and support into a consumer workflow for tours, attractions and activities.
              On the supplier side, public surfaces show an authenticated supplier portal, product and booking
              management, performance analytics, ticket scanning, recommended actions, verification, policy enforcement
              and support tooling. The third side of the product is distribution: a partner API for larger traffic and
              booking-volume partners, a travel-agent commission surface, and reservation-system/channel-manager
              integrations for operators. The most developed public modules are marketplace discovery, supplier
              self-service, API/booking connectivity and trust policy controls; a distinct current
              Originals/exclusive-experiences module was not sufficiently documented in retained public sources and is
              treated as a diligence gap rather than assumed differentiation. This boundary remains material for product
              diligence.
