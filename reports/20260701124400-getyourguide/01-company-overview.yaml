- id: capital-stage-and-governance
  title: Capital, stage, and governance stakeholders
  body: 'GetYourGuide fits a late-stage private unicorn profile. The best retained valuation marker is the 2023 financing
    coverage around a $194 million round at roughly $1.9 billion to nearly $2 billion, with subsequent 2024 financing from
    KKR and UniCredit broadening capital availability. Public funding totals are less clean: the careers site states $883
    million raised from investors, while databases and media may count debt, credit, and round components differently. For
    this chapter, the conservative position is to cite the company-disclosed $883 million as the clean public investor-raised
    figure and preserve a diligence gap for any $1.1 billion-plus total-capital claim until management or financing schedules
    reconcile the categories. Stakeholder diligence should focus on SoftBank-linked coverage, General Atlantic, Searchlight,
    KKR, UniCredit, earlier venture investors, founders, suppliers, and distribution partners, because each group can affect
    IPO timing, secondary supply, debt covenants, or marketplace governance.'
