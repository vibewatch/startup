- id: milestones-risks-and-open-items
  title: Milestones, adverse checks, and open items
  body: The milestone record is strongest for founding, product scale, financing, mobile distribution, and legal operating
    model; it is weakest for audited revenue, profitability, exact headcount, and IPO readiness. That asymmetry is typical
    for a private late-stage marketplace and should not be over-interpreted as a negative, but it does constrain valuation
    confidence. The key adverse evidence is not a single catastrophic event; it is a cluster of operating exposures visible
    in the terms and review ecosystem. GetYourGuide disclaims supplier delivery responsibility, uses mandatory arbitration
    for many U.S. disputes, relies on multiple processors and customer-service vendors, and depends on independent suppliers
    whose data and activities sit partly outside GetYourGuide control. Media discussion of profitability and IPO timing should
    therefore be treated as a hypothesis until confirmed by filings or management data. Later chapters should reuse the identity
    facts here while independently testing market size, unit economics, customer satisfaction, and valuation. The chronology
    should therefore be refreshed again if a filing appears, because any public prospectus would supersede media and database
    estimates.
