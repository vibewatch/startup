    - Documented API and feature set
    - Availability, price, booking and QR/barcode sync
    - Uptime, latency and error-rate telemetry unavailable
  - - Partner API
    - OTA, app, high-traffic website
    - Documented tiered access
    - Tiered product/content and booking access
    - Actual partner list and production volume private
  - - Travel-agent affiliate surface
