    - Restricted activities, DSA, quality and safety rules
    - Measured enforcement and dispute outcomes unavailable
  - - Originals / exclusive experiences
    - Travelers / supply partners
    - Insufficient current public proof in retained sources
    - Potential branded differentiation if active
    - Need direct current catalog or partner evidence
