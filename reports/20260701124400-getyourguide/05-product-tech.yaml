  - FE003
- id: differentiation-and-maturity
  title: Differentiation and Product Maturity
  body: 'Differentiation appears to come from marketplace liquidity, partner connectivity, traveler trust surfaces and supplier optimization tooling rather than from a publicly proven proprietary algorithm. Official-ticket and official-tour badges, provider ratings, ranking rules and likely-to-sell-out badges form an evidence-backed conversion/quality layer. The supplier portal and API features indicate a mature operating layer for existing operators: product management, availability and pricing synchronization, ticket redemption and performance management. However, public sources are heavily company-authored. Independent evidence corroborates mobile distribution and traveler review visibility, while architecture depth, fraud control, API uptime, SLA performance, supplier dispute resolution and review-abuse controls are largely opaque. That matters because marketplace product quality ultimately depends on external operators, inventory freshness and support execution.'
  claimRefs:
  - CE008
  - CE009
  - CE018
  - CE019
  - CE023
  - CE025
  - CE026
  - CE028
  - CE031
  - CE032
  - CE035
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-safety-compliance
  title: Trust, Safety, Compliance, and Quality Controls
  body: 'GetYourGuide has a broad public trust-control surface. Supplier standards cover safety, ethics, legal compliance, restricted activities, animal welfare, activity quality, provider ratings, temporary suspension and permanent deactivation. Legal and privacy pages define consumer and data obligations, while DSA and phishing guidance indicate platform compliance and supplier-security education. The controls are meaningful, but the evidence is policy-centric: retained sources do not disclose measured enforcement rates, incident volumes, support SLAs, verified review-abuse rates or API uptime. Independent review sites provide an adverse counterweight by surfacing booking, cancellation and support complaints, confirming that execution risk remains despite policy scaffolding. Product diligence should therefore request operational telemetry, not just policy documents. For diligence, this means management should be asked to bridge the public architecture to operating dashboards: API availability
    by integration type, stale-inventory incidents, voucher scan failure rates, cancellation root causes, review moderation outcomes and support response-time distributions. Those metrics would convert the visible product map into an investable reliability assessment.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE022
  - CE027
  - CE029
  - CE039
  - CE040
  tableRefs:
  - TE004
