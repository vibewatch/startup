  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Originals / exclusive experiences
    missingEvidence: Current official catalog, SKU taxonomy, partner contracts or product pages proving an active Originals/exclusive-experience module.
    whyItMatters: Originals could be a defensible supply-access differentiator, but retained 2026 public sources do not prove its current scope.
    diligencePath: Ask management for a current Originals/exclusive catalog, gross booking value share, attach rates, cancellation rates and supplier terms.
    relatedQuestionRefs:
    - QE017
  - type: private-evidence-only
    severity: material
    topic: Reliability and API telemetry
    missingEvidence: API uptime, p95 latency, booking-sync error rate, voucher scan failure rate, cancellation rates and support SLA attainment.
    whyItMatters: Marketplace product quality depends on inventory freshness and post-booking execution, none of which can be underwritten from policy pages alone.
    diligencePath: Request API status history, incident reports, supplier integration monitoring dashboards and support operational KPI exports.
    relatedQuestionRefs:
    - QE027
    - QE030
  - type: private-evidence-only
    severity: minor
    topic: Security attestations
    missingEvidence: SOC 2, ISO 27001, penetration-test summary, vulnerability management process and incident history.
    whyItMatters: Privacy and phishing guidance are helpful but do not prove enterprise-grade security controls.
    diligencePath: Request current security packet, audit reports under NDA and list of material incidents in the last 36 months.
    relatedQuestionRefs:
    - QE030
