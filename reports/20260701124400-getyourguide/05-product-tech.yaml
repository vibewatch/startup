chapter:
  number: 5
  title: Product & Technology
  description: Evaluate GetYourGuide's marketplace product, platform architecture, and trust controls.
  summary: GetYourGuide's product-tech surface is a two-sided experiences marketplace with consumer web/mobile booking, supplier portal operations, API/channel-manager synchronization, QR/barcode voucher redemption, reviews, ranking/badges, and policy-led trust controls. The strongest public evidence supports marketplace workflow and supplier tooling; the largest diligence gaps are API reliability, enforcement telemetry, security attestations, and current proof for a distinct Originals/exclusive-experience module.
sections:
- id: product-definition-and-module-map
  title: Product Definition and Module Map
  body: 'GetYourGuide''s product is best understood as a two-sided online marketplace rather than a single travel app. On the traveler side, it packages search, discovery, booking, payment-adjacent checkout, vouchers, reviews, cancellation promises and support into a consumer workflow for tours, attractions and activities. On the supplier side, public surfaces show an authenticated supplier portal, product and booking management, performance analytics, ticket scanning, recommended actions, verification, policy enforcement and support tooling. The third side of the product is distribution: a partner API for larger traffic and booking-volume partners, a travel-agent commission surface, and reservation-system/channel-manager integrations for operators. The most developed public modules are marketplace discovery, supplier self-service, API/booking connectivity and trust policy controls; a distinct current Originals/exclusive-experiences module was not sufficiently documented in retained public
    sources and is treated as a diligence gap rather than assumed differentiation. This boundary remains material for product diligence.'
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE010
  - CE012
  - CE020
  - CE034
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-architecture
  title: Workflow and Marketplace Architecture
  body: 'The operating workflow starts with traveler discovery and ranking, moves through availability and price presentation, then into booking, voucher issuance and redemption at the supplier. The supplier workflow is the mirror image: create and maintain products, keep availability and prices current, accept or process bookings, scan tickets, manage cancellations, communicate with travelers and optimize listings using performance/recommended-action surfaces. The technical architecture visible from public evidence is not a full internal stack; it is a set of boundaries. API docs show REST/JSON, SSL and API tokens; supplier docs show price-over-API, availability updates, booking processing and ticket barcode or QR-code support; official supplier pages describe integrations with over 100 reservation systems and channel managers. This makes the core architecture a marketplace orchestration layer around supplier inventory systems rather than a vertically owned tour-operations platform. A critical
    underwriting implication is that product value is jointly produced by GetYourGuide and third-party operators: the software can improve discovery, synchronization and redemption, but the actual tour quality, check-in process and cancellation behavior depend on supplier execution. Public documentation is strong enough to map workflow boundaries, yet not strong enough to quantify each handoff''s failure rate.'
  claimRefs:
  - CE003
  - CE004
  - CE007
  - CE011
  - CE013
  - CE021
  - CE024
  - CE033
  - CE037
  - CE038
