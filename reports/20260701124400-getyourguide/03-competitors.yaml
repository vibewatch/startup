- id: capability-pricing-comparison
  title: Capabilities, pricing, and UX parity
  body: The public evidence supports a feature comparison but not a precise take-rate ranking. GetYourGuide discloses a commission-only
    supplier model with no listing fee and says exact commission varies by country after signup; that is useful for supplier
    messaging but insufficient for underwriting realized margin. Viator and Klook both expose supplier or merchant acquisition
    surfaces, confirming that operator onboarding is a contested capability. On the traveler side, GetYourGuide, Viator, and
    Klook all have app-store proof, so mobile UX should be treated as table stakes unless proprietary conversion or retention
    data proves otherwise. GetYourGuide Originals are the clearest public differentiation, but standard attraction tickets,
    cancellation norms, and app booking flows are easy for peers to match or bundle. The diligence implication is to separate
    public feature parity from proprietary economics. A marketplace can look differentiated in consumer copy while still competing
    on the same operator inventory and paid-search auctions. Conversely, a seemingly small feature such as channel-manager
    connectivity can materially affect supplier switching cost because it changes how much extra work an operator faces when
    adding another demand channel.
  claimRefs:
  - CP003
  - CP004
  - CP006
  - CP008
  - CP011
  - CP015
  - CP021
  - CP024
  - CP033
  - CP036
