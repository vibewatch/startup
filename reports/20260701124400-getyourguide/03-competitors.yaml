  rows:
  - - GetYourGuide
    - Direct marketplace
    - Claims 150,000+ experiences, 12,000 cities, and 200M+ tickets sold
    - Global travelers and activity operators
    - Curated Originals, verified reviews, support, supplier tools
    - Private GMV and take-rate not disclosed
  - - Viator / Tripadvisor
    - Direct marketplace
    - Official consumer and supplier marketplace surfaces
    - Travelers booking tours and operators seeking OTA demand
    - Broad tour marketplace and supplier funnel
    - Exact commission and geographic depth not public
  - - Klook
    - Direct marketplace / Asia-weighted adjacent
    - Officially positions around experiences, activities, transport, and a mobile app
    - Mobile-first leisure travelers and merchants
    - Super-app breadth and local teams
    - Public pages do not disclose current GMV or take rate
  - - Tiqets
    - Focused attraction-ticket peer
    - Consumer and venue pages emphasize museums, attractions, and venues
    - Attraction visitors and venue partners
    - Ticketing focus and venue orientation
    - Narrower than broad tour marketplaces
  - - VELTRA
    - Regional tours-and-activities peer
    - Official tours-and-activities marketplace and company page
    - Travelers in covered regional destinations
    - Regional inventory and long-tail tours
    - Less evidence of global scale versus direct peers
  - - Airbnb Experiences
    - Adjacent local-experience entrant
    - 2025 release and experiences page show renewed activity supply
    - Travelers seeking host-led local activities
    - Host/community brand and stay adjacency
    - Less focused on attraction-ticket breadth
  - - Booking.com Attractions
    - OTA adjacent
    - Attractions surface plus massive Booking Holdings travel demand
    - Accommodation-led trip planners
    - Can bundle activities near lodging booking flow
    - Activity depth and supplier economics not transparent
  - - Expedia Things to Do
    - OTA adjacent
    - Things-to-do surface and developer platform
    - Package and trip-planning customers
    - Distribution via Expedia ecosystem and APIs
    - Activities are one part of larger OTA mix
  - - Google Things to do
    - Discovery layer / likely entrant
    - Developer docs show activity items on Google surfaces and ads
    - Operators, OTAs, and travelers beginning search
    - Controls high-intent discovery and ad surfaces
    - Not itself a full serviced marketplace
  notes: Public-source profile table; private GMV, realized take rate, and supplier churn are unavailable and treated as diligence
    gaps.
