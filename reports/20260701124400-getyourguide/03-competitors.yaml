  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Country-level realized commission schedules and discounting by competitor.
    whyItMatters: Take-rate durability is central to margin and supplier-retention underwriting.
    diligencePath: Request anonymized supplier contracts and country commission tables from management.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Exclusive inventory share, supplier churn, and Originals GMV contribution by destination.
    whyItMatters: Public pages cannot prove whether differentiation is material or cosmetic.
    diligencePath: Sample top destinations and reconcile exclusive SKUs against Viator, Klook, Tiqets, OTAs, and direct operator
      sites.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: capability-unknowns
    missingEvidence: Comparable evidence for all mobile, API, and supplier-feature cells for smaller peers.
    whyItMatters: Unsupported cells prevent a fully symmetric feature matrix.
    diligencePath: Run operator interviews and request product demos from Tiqets, VELTRA, Booking, and Expedia activity teams.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP002
