- id: moat-verdict-and-diligence
  title: Moat verdict and diligence asks
  body: 'GetYourGuide has a credible competitive position because it combines claimed global breadth, verified reviews, support,
    free cancellation messaging, supplier tooling, and curated Originals. The moat is not yet provable from public evidence
    because the most important competitive variables remain private: exclusive inventory share, realized commission rates,
    paid-search dependence, supplier churn, conversion, refund rates, and repeat behavior. The adverse case is straightforward:
    Google and OTAs commoditize discovery, operators multi-home, and similar mobile marketplaces compress differentiation
    until CAC and take rate deteriorate. The diligence path should therefore prioritize supplier contract samples, destination-level
    win/loss data, app retention cohorts, search-channel mix, and Originals economics. Without those, the chapter can rank
    public capabilities but cannot prove durable pricing power. The chapter therefore assigns GetYourGuide a real but evidence-constrained
    competitive edge. The public case is strongest on breadth, brand, app presence, and curated inventory; the unresolved
    case is whether those assets translate into lower acquisition cost, better supplier terms, and repeat purchase behavior
    versus Viator, Klook, OTAs, and Google-mediated demand.'
