- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Global inventory breadth
    - Operators can multi-home across Viator, Klook, OTAs, Google, and direct integrations
    - High
    - Measure exclusive inventory share and supplier churn by top destination
  - - Curated Originals
    - Attraction tickets and standard tours commoditize quickly
    - Medium
    - Quantify Originals GMV share, repeat rate, and margin premium
  - - Consumer app and reviews
    - Viator and Klook also have mature mobile listings
    - Medium
    - Compare conversion, app retention, refund rates, and review sentiment
  - - Supplier tooling
    - Channel-manager integrations reduce switching cost because many platforms connect to the same systems
    - High
    - Audit integrations, API reliability, and operator dependency on analytics
  - - Brand trust and support
    - OTAs and Airbnb bring larger trip-planning brands into activities
    - Medium
    - Benchmark NPS, support cost, and cancellation outcomes
  - - Paid discovery efficiency
    - Google Things to do and OTA bundling can raise CAC or disintermediate search
    - High
    - Separate organic brand demand from paid metasearch and OTA channels
  - - Regional depth
    - Klook and VELTRA may be stronger in specific Asian/Japan corridors
    - Medium
    - Win/loss by city, source market, and language
  - - Pricing power
    - Commission-only public framing does not prove take-rate durability
    - High
    - Obtain supplier contracts and country-level commission schedules
  notes: Risk register is a synthesis from retained public sources; severity is an underwriting judgment, not a disclosed
    metric.
