- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Relevance
  - Limitation
  rows:
  - - Booking Holdings
    - Public 2025 10-K travel marketplace scale and profitability
    - Best large profitable online-travel benchmark
    - Lodging-heavy economics and much larger scale
  - - Airbnb
    - Public 2025 10-K marketplace revenue and risk disclosures
    - Asset-light marketplace benchmark
    - Accommodation host economics differ from tours and activities
  - - Tripadvisor
    - Public 2025 10-K with broader travel and experiences exposure
    - Adverse benchmark for competition and demand risk
    - Portfolio mix and media exposure dilute pure activities read-through
  - - PitchBook / Crunchbase private profiles
    - Private-market reference points for GetYourGuide status
    - Useful for triangulating private funding context
    - Profile data is secondary and often paywalled
  - - IMARC / market research pages
    - Online travel growth benchmarks
    - Supports market tailwind for scenarios
    - Market category broader than tours and activities
