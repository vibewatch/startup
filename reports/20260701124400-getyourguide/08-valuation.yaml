- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  rows:
  - - Bull
    - Revenue above $1B, durable EBITDA, clean preference stack, active IPO window
    - Low-to-mid single-digit revenue multiple can justify upside from 2023 mark
    - Audited data room and IPO readiness
  - - Base
    - Scale holds, growth continues, but financial disclosures remain private
    - Last disclosed valuation is fair; track until evidence improves
    - Current public evidence set
  - - Bear
    - Revenue below threshold, margin temporary, or competition compresses take rate
    - Flat/down exit or recap risk despite brand scale
    - Adverse public comp risk factors and missing financial proof
  - - Kill case
    - Down round, onerous preferences, or unprofitable paid growth
    - Avoid or require major price reset
    - Cap-table and cohort diligence fail
  notes: Scenario ranges are qualitative because current public sources do not disclose audited GetYourGuide revenue or margins.
