- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence base
  - What would change the view
  rows:
  - - 'Thesis: scaled category specialist'
    - Official page states 150,000+ experiences, 12,000 cities, and 200M+ tickets
    - Verified repeat demand and supplier density by cohort
  - - 'Thesis: large market tailwind'
    - Market-data sources point to continuing online travel growth
    - Independent category growth slowing below public travel growth
  - - 'Thesis: financing support'
    - 2023 equity and 2024 financing sources indicate investor and lender support
    - Financing found to be defensive or preference-heavy
  - - 'Anti-thesis: private opacity'
    - No audited GetYourGuide revenue, take rate, or margin in retained public sources
    - Audited 2025 financials and cap table delivered
  - - 'Anti-thesis: public-comparable discount'
    - Booking/Airbnb economics are broader and more profitable than activities-only focus
    - Evidence GetYourGuide margins converge to marketplace leaders
  notes: Pairs the core investment argument with specific evidence that would change the recommendation.
