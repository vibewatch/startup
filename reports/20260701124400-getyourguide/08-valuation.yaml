company:
  name: GetYourGuide
  website: https://www.getyourguide.com
  sector: Online Travel Experiences / Activity Marketplace
  stage: Late-Stage Private (Unicorn)
  headquarters: Berlin, Germany
  shortDescription: Online marketplace connecting travelers with tours, activities, and experience operators globally.
chapter:
  number: 8
  title: Valuation
  summary: 'GetYourGuide screens as a price-sensitive track/research-more case: the last disclosed near-$1.9B private valuation
    is not obviously stretched if 2025 revenue exceeded $1B and profitability held, but the public evidence still lacks audited
    company financials, take-rate, contribution margin, and preference-stack detail. The valuation stance is fair-to-attractive
    only at low-single-digit revenue multiples and should tighten quickly if growth, margin, or IPO-window evidence weakens.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'GetYourGuide is not a generic quality-score exercise; it is a price-sensitive and evidence-sensitive underwriting
    decision. The current chapter therefore recommends tracking or researching more rather than an unconditional buy. At the
    last widely reported private mark of nearly $2 billion, the case can be attractive if management can prove that 2025 revenue
    exceeded $1 billion, profitability was real, and the preference stack does not divert exit value away from new common-equity
    investors. Without those documents, the same price is only fair because the public record proves marketplace scale but
    not audited unit economics. The decision rule is deliberately asymmetric: buy only at or below a low-single-digit revenue
    multiple with clean terms, track at the last mark pending audited evidence, and avoid a premium if revenue, margin, or
    capital-structure diligence disappoints.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV025
  - CV033
  - CV034
  - CV045
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: financing-context-and-valuation-support
  title: Financing context and valuation support
  body: The 2023 financing is the anchor because it is the clearest externally reported price signal. Reuters and Bloomberg
    both put the round near a $2 billion valuation, while partner and travel-industry sources point to continued financing
    support in 2024. That support matters, but it should not be overread. Debt or structured financing can extend runway and
    validate lender interest without proving that new equity should pay a premium. The underwriting stance treats the 2024
    support as a bridge to scale and IPO optionality, not as a fresh arm's-length common-equity valuation. The absence of
    a retained S-1 or prospectus as of the run date means IPO timing remains optional, and the chapter carries explicit diligence
    asks for current capitalization and preference terms.
  claimRefs:
  - CV006
  - CV007
  - CV021
  - CV022
  - CV023
  - CV028
  - CV029
  - CV040
  tableRefs:
  - TV002
  figureRefs:
  - FV003
- id: scenario-and-comparable-work
  title: Scenario and comparable work
  body: The valuation work uses a scenario table rather than a single-point model because GetYourGuide's disclosed public
    inputs are uneven. The bull case gives credit for large online travel markets, a scaled ticket base, and the possibility
    that a private experiences specialist can list publicly at a credible marketplace multiple. The base case assumes the
    company is valuable but waits for audited revenue, contribution margin, and take-rate proof. The bear case uses public-company
    risk factors and the Tripadvisor cautionary lens to model slower growth, marketing pressure, and category competition.
    Booking Holdings and Airbnb show what profitable public marketplaces can look like, but their lodging-heavy economics
    are not mechanically transferable to tours and activities.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV020
  - CV030
  - CV035
  - CV043
  - CV044
