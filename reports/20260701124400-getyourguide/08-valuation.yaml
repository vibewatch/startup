- id: final-view
  title: Final view for investment committee
  body: 'For an investment committee, the cleanest formulation is: scaled category leader, fair-to-attractive price only if
    the private financial facts are true, and insufficient public evidence for a buy at a premium. The company has enough
    scale evidence to deserve continued work, especially if an IPO window opens in 2026, but the chapter does not underwrite
    precision that public sources do not provide. The recommendation can improve if audited revenue exceeds $1 billion, durable
    profitability is verified, and the cap table is clean. It can deteriorate quickly if the 2023 valuation already embeds
    peak travel demand, if 2024 financing was primarily defensive, or if public comps compress. The stance is therefore disciplined
    tracking with explicit price and evidence gates. This preserves a disciplined margin of safety rather than forcing a false-precision
    valuation.'
  claimRefs:
