- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue miss
    - Audited 2025 revenue materially below $1B
    - Raises implied revenue multiple and weakens scale story
    - Avoid premium or reprice
  - - Margin disappointment
    - Profitability temporary or negative after growth spend
    - Removes IPO-quality marketplace economics
    - Track only or avoid
  - - Preference overhang
    - New debt/preference diverts common-equity exit value
    - Reduces realized investor return even if enterprise value grows
    - Require terms reset
  - - Growth-quality concern
    - Growth driven by unprofitable paid acquisition
    - Compresses terminal multiple
    - Cut valuation case
  - - IPO delay
    - No credible public filing or exit path through 2026
    - Extends duration and liquidity discount
    - Increase required return
  notes: Triggers are tied to diligence evidence that would alter price, recommendation, or risk rating.
  claimRefs:
  - CV026
  - CV028
  - CV029
  - CV039
  - CV040
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Revenue quality
    - Monthly GMV, net revenue, take rate
    - Determines implied multiple and revenue durability
    - Data-room financial model and auditor tie-out
  - - Profitability
    - Gross margin, contribution margin, EBITDA, cash conversion
    - Separates scaled marketplace from subsidized growth
    - CFO interview and audited statements
  - - Demand quality
    - Repeat booking, CAC payback, refund and cancellation cohorts
    - Tests whether growth is efficient and durable
    - Cohort export by geography and channel
  - - Supply quality
    - Supplier churn, concentration, exclusivity, quality issues
    - Determines moat and take-rate resilience
    - Operator cohort and top-supplier review
  - - Capital structure
    - Debt, liquidation preferences, secondary marks
    - Determines common-equity return path
    - Cap table, financing documents, legal review
  notes: These asks are material to moving the recommendation from track to buy.
  claimRefs:
  - CV024
  - CV034
  - CV037
  - CV038
  - CV039
