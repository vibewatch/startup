  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: Audited 2025 revenue, gross margin, contribution margin, EBITDA, and cash conversion.
    whyItMatters: These numbers determine whether the last valuation is low-single-digit revenue or meaningfully richer.
    diligencePath: Request audited financial statements, management accounts, and CFO walkthrough.
    relatedQuestionRefs:
    - QV003
    - QV011
    - QV028
    - QV029
    - QV030
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current cap table, debt schedule, liquidation preferences, and secondary marks.
    whyItMatters: Preference overhang can change investor returns even when enterprise value grows.
    diligencePath: Review financing documents, debt agreements, and shareholder register.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: ipo readiness
    missingEvidence: Any S-1, prospectus, exchange filing, or banker-confirmed IPO timetable.
    whyItMatters: Liquidity timing is a material part of late-stage private return underwriting.
    diligencePath: Search regulatory filings again before IC and ask management for exit-process status.
    relatedQuestionRefs:
    - QV015
    - QV030
    - QV031
    relatedTableRefs:
    - TV005
  - type: access-blocked
    severity: minor
    topic: paywalled funding coverage
    missingEvidence: Full text of several paywalled or unavailable funding articles.
    whyItMatters: Independent corroboration improves confidence in round terms and investor composition.
    diligencePath: Retrieve licensed database copies or investor press releases in data room.
    relatedQuestionRefs:
    - QV002
    - QV016
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation table sample coverage
    missingEvidence: A full banker-grade comparable-company and transaction universe for online travel, experiences, and marketplace
      exits.
    whyItMatters: A sample comp set is sufficient for directional discipline but not for final pricing precision.
    diligencePath: Build a full comparable-company and precedent-transaction screen with current trading multiples before
      IC.
    relatedQuestionRefs:
    - QV007
    - QV022
    relatedTableRefs:
    - TV004
