chapter:
  number: 6
  title: Customers
  description: Assess traveler demand, operator supply, retention, and concentration risks for GetYourGuide.
  summary: 'GetYourGuide shows strong two-sided marketplace scale: official materials claim 200M+ tickets sold, 50K+ suppliers,
    40M+ monthly visitors, thousands of cities, and dense 2026 destination pages across Europe, North America, APAC, and the
    Middle East. The customer-quality read is positive but not complete: app stores and live activity pages support real traveler
    and supplier adoption, while adverse review evidence and missing retention, refund, concentration, and cohort data keep
    durability risk material.'
sections:
- id: customer-segments-and-marketplace-liquidity
  title: Customer Segments and Marketplace Liquidity
  body: 'GetYourGuide has two customer systems that must be evaluated together: travelers searching for things to do, and
    suppliers or operators monetizing tours, tickets, and activities. The public record supports a large marketplace but with
    count uncertainty. The about page claims more than 150,000 experiences in 12,000 cities and more than 200 million tickets
    sold, while supplier-facing copy claims more than 50,000 suppliers, 40 million-plus monthly visitors, and 200,000 experiences.
    The mismatch between 75,000-plus app-store copy, 100,000-plus Google Play copy, 150,000-plus web copy, and 200,000 supplier-page
    copy means the safest read is directional scale rather than a single precise inventory number. Destination pages show
    500-plus results in Paris, New York City, Tokyo, and Dubai, plus additional depth in London, Barcelona, and Singapore,
    supporting Europe, North America, APAC, and Middle East breadth. The limitation is that regional booking mix, active-user
    counts, and paid-supplier contribution are not disclosed.'
