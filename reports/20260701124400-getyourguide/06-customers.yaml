- id: named-supplier-and-customer-proof
  title: Named Supplier and Customer Proof
  body: 'The strongest named proof for a travel marketplace is not a logo slide; it is live, bookable inventory with visible
    traveler review surfaces. Public GetYourGuide activity pages provide that form of proof for multiple use cases: Big Bus
    sightseeing in Rome, a Louvre guided museum tour, a Versailles palace tour, and a Barcelona Sagrada Familia private layover
    tour. These are production marketplace listings, not pilots, because they are consumer-facing activities in destination
    search flows. However, this chapter treats them as supplier proof rather than enterprise customer proof: the pages confirm
    active supply and customer review surfaces, but they do not reveal supplier economics, exclusivity, net revenue, or whether
    any single operator is strategically concentrated. The named proof table is therefore intentionally partial and sample-based.
    It enumerates representative live supply rows across transportation, museum access, day-trip, and private-tour use cases
    rather than implying a full supplier roster.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU032
  - CU033
  - CU040
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-satisfaction-and-adverse-feedback
  title: Retention, Satisfaction, and Adverse Feedback
  body: 'GetYourGuide does not publish GRR, NRR, churn, cohort retention, supplier renewal rates, or repeat-purchase cohorts.
    The usable public proxies are app ratings, review volume, verified reviews, flexible cancellation, and breadth of repeatable
    destination coverage. Google Play is the strongest independent mobile signal because it displayed a 4.9 rating, roughly
    320,000 reviews, and 10 million-plus downloads at fetch time. Apple App Store copy confirms the app is a core traveler
    acquisition and booking surface. These positive signals should be read alongside adverse review evidence: Sitejabber/SmartCustomer
    displayed a 2.5 out of 5 rating from 874 reviews and summarized dissatisfaction around customer service, unreliable bookings,
    cancellations, refunds, and communication. That adverse evidence does not disprove scale, but it raises durability risk:
    if refunds and operator reliability are inconsistent, marketplace liquidity can convert into service-cost burden and lower
    repeat intent.'
  claimRefs:
  - CU023
  - CU025
  - CU026
  - CU027
  - CU028
  - CU034
  - CU036
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-channel-risk
  title: Expansion, Concentration, and Channel Risk
  body: 'Supplier expansion appears to come from four loops: traveler demand, affiliate distribution, reservation-system connectivity,
    and commission-only listing economics. The supplier page claims more than 2,500 affiliates including Emirates, Expedia,
    Hilton, and American Express, which can put inventory in front of travelers before and during trip planning. It also says
    suppliers can connect channel managers and ticketing platforms such as Rezdy, Bokun, FareHarbor, and Regiondo, reducing
    operating friction. The same public evidence creates diligence risks. Destination ranking disclosures say popularity,
    customer ratings, availability, diversity, revenue, and supplier commissions influence rankings, so suppliers may face
    a pay-to-compete dynamic even if positions are not guaranteed. More importantly, the company does not disclose top-channel,
    top-supplier, or geographic concentration. The right diligence ask is transaction-level cohort data by traveler, supplier,
    destination, and channel, not more logo examples. This is particularly important for a marketplace because customer experience
    is co-produced by GetYourGuide, the operator, payment and ticketing systems, and distribution partners. A breakdown by
    cancellation cause and support owner would show whether adverse reviews are isolated service incidents or structural marketplace-quality
    leakage.'
