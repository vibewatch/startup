    - Tour/activity operator or attraction / supplier pays commission
    - List inventory, manage bookings, connect channel systems
    - 50K+ suppliers; 200K experiences claimed on supplier page
    - High supply-side value; supplier revenue mix not disclosed
  - - Affiliate and distribution partners
