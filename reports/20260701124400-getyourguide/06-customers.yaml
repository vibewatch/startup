    - High-density city inventory
    - 500+ results shown in Paris, New York City, Tokyo, Dubai
    - Supports liquidity; no regional booking split
  - - Mobile app users
    - iOS / Android travelers
    - In-trip and pre-trip discovery, booking, and voucher access
    - Google Play 10M+ downloads and 320K reviews
    - Strong mobile signal; true repeat cohorts unavailable
  notes: Segmentation combines official marketplace copy, supplier copy, destination pages, and app-store evidence; public
