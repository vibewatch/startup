  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention gaps
    missingEvidence: Traveler repeat booking, refund rate, supplier renewal, GRR, NRR, and churn cohorts by geography and
      channel.
    whyItMatters: Public review proxies cannot prove durable repeat usage or supplier retention economics.
    diligencePath: Request anonymized monthly cohorts by traveler, supplier, destination, and acquisition channel for 2024-2026.
    relatedQuestionRefs:
    - QU015
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration gaps
    missingEvidence: Top supplier, top affiliate, top destination, and top attraction concentration as a share of gross bookings
      and gross profit.
    whyItMatters: Marketplace liquidity may depend on a small set of destinations, operators, or distribution partners.
    diligencePath: Request concentration schedules and stress-test loss of the top five suppliers, destinations, and affiliates.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: experience count
    missingEvidence: A canonical definition of active bookable experiences reconciled across web, supplier, Apple, and Google
      Play surfaces.
    whyItMatters: Different public inventory counts can overstate or understate active supply if stale, localized, or surface-specific.
    diligencePath: Ask management to define active SKU methodology and provide monthly active experiences by destination.
    relatedQuestionRefs:
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named supplier proof table
    missingEvidence: Full supplier roster with production status, booking volume, cancellation rate, take rate, and exclusivity
      by operator.
    whyItMatters: The table samples live public listings but cannot identify the most economically important suppliers.
    diligencePath: Request supplier-level gross bookings and contribution margin for the top 100 operators with permissioned
      reference calls.
    relatedQuestionRefs:
    - QU007
    - QU018
    relatedTableRefs:
    - TU003
