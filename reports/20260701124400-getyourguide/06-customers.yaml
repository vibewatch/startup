- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Affiliate distribution through travel brands
    - Bookings may depend on a small number of high-volume partners
    - Channel loss could reduce demand-side liquidity
    - Request bookings and gross profit by affiliate and direct channel
  - - Supplier connectivity and commission-only onboarding
    - Inventory quality may concentrate in operators able to manage systems and commissions
    - Supplier churn or ranking dissatisfaction could reduce selection
    - Request supplier cohorts by integration type, commission tier, and cancellation rate
  - - Destination density in top cities
    - Revenue may be concentrated in major Europe and North America destinations
    - Regional shocks or overtourism rules could hit booking mix
    - Request gross bookings by destination and attraction category
  - - Ranking algorithm and supplier commissions
    - Suppliers may feel pressure to raise commissions to win visibility
    - Could compress supplier economics or worsen marketplace trust
    - Audit ranking experiments, commission dispersion, and supplier complaints
  notes: Risk rows are derived from public ranking, supplier, and affiliate disclosures; no concentration percentages are
    public.
