callouts:
  - calloutType: insight
    title: Large but still under-digitized
    body: >-
      The category is attractive because both the denominator and the online mix are expanding: TAM growth and online
      penetration gains compound into the online SAM.
    claimRefs:
      - CM001
      - CM003
      - CM032
      - CM033
      - CM035
  - calloutType: risk
    title: Regulation and suppliers cap the upside
    body: >-
      Destination visitor controls, trust obligations and operator dependence on OTAs are the main reasons a large TAM
      should not be treated as frictionless revenue.
    claimRefs:
      - CM025
      - CM027
      - CM028
      - CM045
