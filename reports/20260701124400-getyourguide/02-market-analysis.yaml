chapter:
  number: 2
  title: Market Analysis
  description: Size and analyze the travel experiences market that GetYourGuide serves.
  summary: >-
    GetYourGuide operates in a large travel experiences category: Arival and Phocuswright put tours, activities and
    attractions at $271B in 2025 and $342B by 2029, while online penetration remains only 33% versus 64% for broader
    travel. The investable thesis is an under-digitized, experience-led market with strong OTA channel growth, offset by
    supplier fragmentation, destination regulation, trust obligations and take-rate pressure.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      GetYourGuide should be sized as a marketplace for in-destination tours, activities, attractions, day trips,
      cultural experiences and adjacent bookable services, not as a generic online travel agency that includes flights
      and lodging. That boundary matters because the sources that describe online travel or travel and tourism are
      useful demand context, but the core TAM comes from tours, activities and attractions. The status quo is still
      broad: travelers can buy at attraction box offices, ask hotel concierges, use local agents, book direct operator
      websites, rely on walk-up availability, or choose competing OTAs and superapps. GetYourGuide’s stated breadth of
      more than 150,000 experiences in 12,000 cities indicates relevance across categories, but not automatic capture of
      every activity dollar. For diligence, the important boundary question is whether spend is booked as a discrete
      destination experience with availability, content, reviews and support needs. That excludes broad trip components
      but includes the activities where marketplaces can improve discovery and reduce transaction uncertainty.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM020
      - CM030
      - CM036
      - CM037
      - CM038
    tableRefs:
      - TM001
    figureRefs:
      - FM003
  - id: sizing-and-penetration
    title: Sizing lenses and online penetration
    body: >-
      The most defensible sizing approach is layered. TAM is total experiences spend; SAM is the online-bookable or
      online-booked portion of that spend; SOM is the portion that a specialist marketplace can capture after geographic
      focus, category quality, traffic acquisition and supplier economics. The 2026 Arival/Phocuswright materials
      provide an unusually direct lens: $271 billion of tours, activities and attractions in 2025, $342 billion by 2029,
      33% online penetration in 2025, and a 42% online projection for 2029. Those figures imply roughly $89 billion of
      online experiences gross bookings in 2025 and about $144 billion by 2029. The opportunity is therefore not just
      category growth, but an online mix shift that remains well below broader travel’s reported 64% online penetration.
      The figures are best read as gross-booking pools rather than net revenue. GetYourGuide revenue would depend on
      commission, refunds, supplier incentives, marketing costs and geographic mix, so the chapter keeps
      company-specific SOM unquantified until private data is available.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: demand-drivers
    title: Demand drivers and adoption path
    body: >-
      Demand is supported by both macro travel recovery and a more specific shift toward experience-led trip planning.
      UN Tourism’s January 2026 barometer described a return toward pre-pandemic growth trends, while Klook,
      Simon-Kucher, Expedia and American Express point to younger travelers, social discovery, AI-assisted planning,
      local experiences and passion-led trips. Bleisure expands occasions beyond holiday-only demand because workers can
      add local activities before or after business obligations. For GetYourGuide, the adoption path starts with
      inspiration, moves through social or search discovery, compares reviews and availability, and converts when mobile
      checkout, flexible policies and trusted support reduce trip-planning anxiety. These drivers are mutually
      reinforcing: recovered international trips create occasions, younger cohorts bring digital discovery habits, and
      bleisure creates weekday urban demand. The operating question is whether acquisition cost stays low enough as
      large OTAs and social channels compete for the same intent.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM021
      - CM022
      - CM039
    tableRefs:
      - TM003
    figureRefs:
      - FM004
  - id: constraints-and-risks
    title: Constraints, adverse evidence and diligence gaps
    body: >-
      The same market signals that make experiences attractive also create constraints. Arival’s operator data show
      suppliers relying more on OTAs while direct website share declines, which can produce take-rate pressure and
      dependence even if marketplaces solve discovery. Trust is not optional: Airbnb’s host requirements show why
      identity, licensing, insurance and certifications can be category gating items. Destination-level regulation is
      the clearest adverse evidence. European sources document tourist taxes, bans, visitor limits and Venice access
      controls, all of which can change group sizes, peak availability and traveler friction. The unresolved investor
      questions are GetYourGuide’s own share of online SAM, take rate, repeat rate, retention, and whether specialist
      marketplaces capture more incremental online shift than horizontal OTAs. Investors should therefore underwrite
      regulation and trust as operating requirements, not edge cases. In top destinations, caps or taxes may raise
      traveler urgency but can also reduce available inventory, increase cancellation burden and complicate supplier
      onboarding.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM040
      - CM041
      - CM042
      - CM043
      - CM044
      - CM045
