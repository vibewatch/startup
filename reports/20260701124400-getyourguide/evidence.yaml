evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited or management-certified 2025 revenue, EBITDA/profitability, cash balance, and 2026 year-to-date
      performance.
    whyItMatters: >-
      The IPO and valuation narrative depends on current revenue scale and profitability quality, not only historical
      financing rounds.
    diligencePath: Request management accounts, lender materials, investor update packs, or any IPO filing drafts under NDA.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: >-
      One reconciled supply metric defining active experiences, bookable experiences, cities, operators, and countries
      on the same date.
    whyItMatters: >-
      Public pages and app stores show different experience counts, which can confuse market-share and supply-density
      analysis.
    diligencePath: Ask management for the KPI glossary and monthly active supply export as of 2026-07-01.
    relatedQuestionRefs:
      - QO009
      - QO011
      - QO012
      - QO013
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Current board roster, observer rights, executive leadership list, founder ownership, and investor consent rights.
    whyItMatters: Late-stage financing and IPO readiness depend on governance rights and secondary-liquidity incentives.
    diligencePath: Request cap table, board minutes summary, investor-rights agreement, and D&O biographies.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: diligence-gap
    missingEvidence: >-
      GetYourGuide gross booking volume, category share, take rate, repeat rate and cohort profitability inside the
      online experiences SAM.
    whyItMatters: These private metrics determine whether the large market translates into durable company-level economics.
    diligencePath: Request management KPI pack and reconcile against payment processor, supplier payout and cohort retention exports.
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      Full paid Arival/Phocuswright report methodology, regional tables and segment definitions behind the public $342B
      and $345B press variants.
    whyItMatters: Small headline differences are not thesis-breaking but affect precision in SAM and regional prioritization.
    diligencePath: Obtain the full report or analyst briefing and tie every headline estimate to one definition and currency basis.
    relatedQuestionRefs:
      - QM003
      - QM021
  - type: enumeration-incomplete
    severity: minor
    topic: regulation
    missingEvidence: City-by-city exposure of GetYourGuide inventory to visitor caps, tourist taxes, guide rules and group-size limits.
    whyItMatters: Regulatory exposure can reduce peak inventory and change conversion in top European destinations.
    diligencePath: Export top 50 destination GMV and overlay municipal access rules, guide licensing and attraction capacity caps.
    relatedQuestionRefs:
      - QM008
      - QM022
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Country-level realized commission schedules and discounting by competitor.
    whyItMatters: Take-rate durability is central to margin and supplier-retention underwriting.
    diligencePath: Request anonymized supplier contracts and country commission tables from management.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Exclusive inventory share, supplier churn, and Originals GMV contribution by destination.
    whyItMatters: Public pages cannot prove whether differentiation is material or cosmetic.
    diligencePath: >-
      Sample top destinations and reconcile exclusive SKUs against Viator, Klook, Tiqets, OTAs, and direct operator
      sites.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: capability-unknowns
    missingEvidence: Comparable evidence for all mobile, API, and supplier-feature cells for smaller peers.
    whyItMatters: Unsupported cells prevent a fully symmetric feature matrix.
    diligencePath: Run operator interviews and request product demos from Tiqets, VELTRA, Booking, and Expedia activity teams.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cash-runway
