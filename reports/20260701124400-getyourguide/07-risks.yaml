- id: regulatory-legal-consumer-rights
  title: Regulatory, legal, and consumer-rights exposure
  body: The regulatory burden is material because GetYourGuide sits between travelers and local operators while taking a contractual role in booking, cancellation, refund and data flows. Its own terms and privacy policy are useful mitigants because they document booking conditions, cancellation mechanics, data-processing controls and the company’s attempt to define platform responsibilities. They do not eliminate legal exposure. EU package-travel rules, consumer-rights rules, the Digital Services Act and platform-to-business regulation all create obligations that can affect marketplace transparency, complaint handling, trader ranking, refund expectations and platform governance. The legal risk is most acute when a bundle, cancellation, misdescribed attraction, unsafe operator, or unavailable tour turns a customer-service failure into a statutory claim. The company’s ability to prove clear supplier terms, accurate descriptions, prompt refunds and auditable complaint escalation is therefore
    a diligence gate, not an operational nice-to-have.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  tableRefs:
  - TR001
  figureRefs: []
- id: operational-quality-refunds
  title: Operational quality, supplier control, and refund failure risk
  body: Operational risk is structurally high because GetYourGuide does not fully control the local guide, attraction, weather, transport, queue, language quality or last-mile safety experience that the traveler attributes to the brand. The supplier page confirms the marketplace model; the app-store listings and customer-review sources confirm consumer scale and the importance of mobile booking. The adverse evidence is not that every customer has a bad experience, but that negative review channels repeatedly cite cancellations, refund disputes, unreliable bookings and weak support. Those failure modes matter because they can propagate into chargebacks, lower conversion, higher service cost, and paid-marketing inefficiency. A risk register should therefore track supplier defect rate, refund cycle time, post-booking cancellation rate, support backlog, review-rating trend, and share of bookings from operators with repeat complaints. Without those internal controls, public supply breadth can
    mask fragile quality economics.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
