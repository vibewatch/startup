  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial model
    missingEvidence: Current gross booking value, net revenue, take-rate, CAC payback, refund leakage, support cost and contribution margin by cohort.
    whyItMatters: These metrics decide whether competitive and refund risks are manageable or thesis-breaking.
    diligencePath: Request monthly KPI bridge from management and reconcile to bank, PSP, refund and marketing-platform exports.
    relatedQuestionRefs:
    - QR028
    - QR030
  - type: missing-source
    severity: material
    topic: supplier quality
    missingEvidence: Operator-level cancellation, no-show, complaint, safety incident and delisting data.
    whyItMatters: Public reviews show adverse themes but cannot quantify whether supplier quality is improving or deteriorating.
    diligencePath: Review supplier scorecards, incident logs, insurance/license checks and repeat-offender enforcement by country.
    relatedQuestionRefs:
    - QR016
    - QR025
    relatedTableRefs:
    - TR001
    - TR002
  - type: access-blocked
    severity: minor
    topic: adverse reviews
    missingEvidence: Full current Trustpilot corpus and source-level review distribution could not be extracted in this run.
    whyItMatters: A broader adverse-review corpus would sharpen refund and support trend analysis.
    diligencePath: Use permitted review-data access, customer-support exports and app-store review scraping under counsel-approved terms.
