- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Take-rate compression
    - Supplier commission reductions or OTA parity pressure
    - Net take-rate falls materially without volume offset
    - Re-underwrite margin and valuation
  - - Paid-marketing dependence
    - Paid search/app-install share rises faster than repeat/direct bookings
    - CAC payback extends beyond disclosed target or worsens two quarters
    - Pause buy case until channel economics proven
  - - Refund/service failure
    - Refund complaints, chargebacks or app-review deterioration persist
    - Negative refund themes rise despite support investment
    - Treat as brand and unit-economics impairment
  - - Regulatory remediation
    - DSA/P2B/consumer-law finding or forced terms change
    - Material process change, fine, or mandated refund/re-ranking change
    - Increase legal reserve and lower multiple
  - - Travel shock exposure
    - Demand shock from recession, conflict, disease or air-capacity disruption
    - Bookings decline and refund load spikes simultaneously
    - Stress liquidity and working-capital assumptions
  - - Financing/valuation risk
    - New financing needed before unit-economics proof
    - Down-round, structured round or undisclosed rescue capital
    - Convert to research-more/avoid
  notes: Kill criteria are diligence thresholds inferred from public risk channels; actual thresholds should be calibrated to private KPIs.
