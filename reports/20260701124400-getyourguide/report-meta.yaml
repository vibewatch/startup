companyProfile:
  summary: GetYourGuide is a Berlin-headquartered travel-experiences marketplace founded in 2009. The public record supports
    a two-sided model connecting travelers with independent tour, attraction, and activity operators, with official claims
    of more than 150,000 experiences in 12,000 cities, more than 200 million tickets sold, and more than 50,000 suppliers.
    Financing evidence centers on the June 2023 $194M round at roughly $1.9B valuation, followed by 2024 financing support.
    Public 2025 revenue/profitability signals are encouraging, but the company has not released audited consolidated financials
    or cap-table details.
