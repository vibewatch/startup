  topStrengths:
    - Official and independent sources support very large marketplace scale, including 150K+ experiences, 12K cities, and 200M+ tickets sold.
    - The business model is asset-light and commission-based, which can translate scale into strong operating leverage if take rate and refunds hold.
    - The 2023 financing and 2024 follow-on support indicate continued investor and lender willingness to fund category leadership.
  topRisks:
    - Audited consolidated revenue, gross margin, cash generation, and cap-table preference details are still not public.
    - Competition from Viator, Klook, OTAs, and broader travel platforms could pressure take rate, traffic acquisition, and supplier loyalty.
    - Marketplace quality risks around refunds, cancellations, and supplier performance can erode repeat demand and increase support costs.
  unresolvedGaps:
    - Audited 2025 revenue, gross margin, contribution margin, and cash conversion remain unavailable in public sources.
    - The full debt, revolving-credit, and liquidation-preference stack is not disclosed, limiting return-underwriting precision.
    - Public sources do not disclose traveler repeat booking cohorts, supplier concentration, or channel concentration.
