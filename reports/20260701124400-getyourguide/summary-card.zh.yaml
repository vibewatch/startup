  topStrengths:
    - 官方和独立来源都指向很大的市场规模，包括 150K+ 个体验、12K 个城市，以及 200M+ 张已售门票。
    - 业务模式轻资产、靠佣金变现；只要抽佣率和退款稳定，规模就能转化为强经营杠杆。
    - 2023 年融资和 2024 年后续支持显示，投资人和贷款方仍愿意为品类龙头提供资金。
  topRisks:
    - 经审计的合并收入、毛利率、现金生成能力，以及股权结构中的优先权细节仍未公开。
    - Viator、Klook、OTA 和更广泛旅游平台的竞争，可能压低抽佣率、抬高获客成本，并削弱供应商忠诚度。
    - 退款、取消和供应商履约带来的市场质量风险，可能侵蚀复购需求并推高客服成本。
  unresolvedGaps:
