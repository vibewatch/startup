companyProfile:
  summary: Strava is a San Francisco-based social fitness platform founded in 2009 by Michael Horvath and Mark Gainey. The company has evolved from a run-and-ride tracking utility into a broad social fitness network spanning more than 50 activity types, route planning, segment competition, clubs, AI training insights, and integrations with a large device and developer ecosystem. Public disclosures show the platform moved from 150 million-plus athletes in 2025 to more than 195 million users by early 2026, while management increasingly positions the company as a premium subscription and training platform rather than a pure tracking app.
  foundedDate: '2009-01-01'
  founders:
    - name: Michael Horvath
      role: Co-founder
      background: Former Strava chief executive who transitioned to executive-advisor support after the 2024 CEO handoff.
      claimRefs: [CO002, CO006]
    - name: Mark Gainey
      role: Co-founder
      background: Co-founded Strava with Horvath around a social and competitive fitness thesis rooted in athlete camaraderie.
      claimRefs: [CO002]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Strava sells a freemium mobile and web fitness platform centered on activity tracking, social sharing, clubs, leaderboards, route discovery, training analysis, and premium coaching-adjacent features. Paid plans add deeper analytics, routes, AI athlete intelligence, family plans, and a Strava-plus-Runna bundle, while the company also supports Metro mobility insights and a sizable third-party API ecosystem.
  customerFocus: Consumers who run, ride, hike, and train across endurance and active-lifestyle categories, plus adjacent partners such as event organizers, brand marketers, public-sector mobility users through Metro, and device/app ecosystem partners.
  businessModel: Primarily consumer subscription revenue, supplemented by sponsored challenges, ecosystem partnerships, and strategic adjacency products; public evidence for material data-licensing revenue is weaker than the subscription case.
  stage: Late-stage private platform business with a reported 2025 Series G valuation of $2.2B and subsequent debt financing.
  fundingStatus: Reported May 2025 Series G at a $2.2B valuation led by Sequoia, followed by a June 2025 debt round of undisclosed size.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO005, CO014, CO015, CO030, CO031]
