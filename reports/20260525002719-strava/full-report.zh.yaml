      - number: '1.3'
        title: 融资历史、变现和生态经济
        blocks:
          - type: paragraph
            body: >-
              公开资本和变现证据支撑的是一幅更有层次的图景。变现侧，定价页面清楚显示以付费订阅为核心的免费增值消费者模式：美国年费 $79.99 或月费 $11.99，另有价格更高的家庭计划、Strava 加 Runna
              捆绑包，以及面向学生或专业人士的折扣版本。公开订阅功能包括路线、更深度训练分析、AI 运动者智能、Recover Athletics 使用权和会员优惠。资本侧，最干净的公开时间线来自 Tracxn
              和同期收购报道：Strava 2020 年 11 月 Series F 融资 $110 million，估值 $1.5 billion；2025 年 5 月报道则指向一轮由 Sequoia
              领投、TCV、Jackson Square Ventures 和 Go4it 参与、估值 $2.2 billion 的 Series G，随后在 2025 年 6 月完成债务融资。仍缺失的是 2025
              年资本包的确切美元规模，以及这些投资者对应的持股比例。生态叙事具有战略重要性，因为它同时强化产品深度和防御性。官方开发者材料把 V3 API 描述为公开且稳定；Runna 收购公告称，超过 100 个训练应用连接
              Strava API；2025 年开发者峰会回顾也显示，Strava 是大型第三方生态，而不是封闭围墙式产品策略。
