chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和覆盖范围
        blocks:
          - type: paragraph
            body: >-
              Strava 的身份现在比本轮最初假设清楚得多：官方 2025–2026 年材料显示，公司仍是一家总部位于旧金山的社交健身平台，由 Michael Horvath 和 Mark Gainey 于 2009
              年创立，但现任 CEO 是 Michael Martin，而不是 Horvath。产品已经远超骑行和跑步，扩展成多运动社交图谱，现支持 50 多种活动类型、力量记录、AI
              生成训练洞察、路线、俱乐部、赛段排行榜和安全功能。2025 年 3 月的总部材料显示，公司位于旧金山市中心 181 Fremont
              Street，并在纽约、伦敦、丹佛、柏林、都柏林、巴黎和圣保罗拥有更广的办公室布局。后续章节的基本事实是，Strava 更应被理解为一个以订阅驱动的消费者健身网络：它拥有庞大已安装社区、开放 API
              生态和不断扩展的产品表面，而不是单项运动记录工具。公开证据还显示，直接 API 授权的叙事需要谨慎看待：官方 Metro 产品被描述为面向社会影响交通规划免费提供，因此订阅和捆绑包的公开变现证据明显强于数据授权。
