      - number: '2.4'
        title: 增长驱动、约束和剩余缺口
        blocks:
          - type: paragraph
            body: >-
              有证据支撑的增长驱动很直接。WHO 和 CDC 显示，帮助人们多运动、维持健康习惯的工具拥有持久宏观需求；USA Cycling 2025 年报告也表明，有组织的耐力运动参与仍然健康。Strava
              自身向力量记录、AI 生成训练洞察和捆绑教练扩展产品，把可服务用户任务从简单 GPS
              记录向外打开。可穿戴设备和移动平台继续拓宽数据漏斗，品牌赞助挑战也证明，社区参与可以在订阅之外变现。主要约束同样重要。敏感健康和位置数据处在更严格的平台权限和泄露通知义务之下，抬高信任和合规成本。Apple 和
              Android 仍是数据访问和身份可携性的关键中介，因此 Strava 并不完全控制技术栈。最大分析缺口仍是规模精度：公开报告没有隔离 Strava 专属收入池，也没有披露公司的转化率、开发者强度或 Metro
              客户基础。因此，应保留相互矛盾的估计，而不是把它们简单平均掉。这个市场有吸引力并在扩张，但最终承销仍取决于管理层独有证据：各邻近业务内部的变现深度。
