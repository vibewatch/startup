  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 指示性估值区间
      - 回报逻辑
      - 概率信号
      - 关键失败模式
    rows:
      - - 熊市
        - 外部 2025 年收入代理值更接近 USD 415M，倍数压缩至 2.5x 至 3.5x，合作伙伴或 隐私摩擦持续
        - 估值区间：USD 1000M to 1400M
        - 只有通过深度折价、下行保护或结构化敞口才有吸引力，而不是买入高溢价普通股
        - 更多 API 冲突、更多信任事件、更慢高级订阅转化，或证据显示 2025 年融资结构偏重优先级
        - 类似上市公司的溢价消失，股权故事开始像打折的健身应用工具
      - - 基准
        - 收入或 ARR 确实处在 USD 415M 至 500M 区间，合作伙伴接入保持完整，收购改善 留存，但未证明具备 Duolingo 式质量
        - 估值区间：USD 1600M to 2200M
        - 只有资本表足够干净、普通股上行仍能保住时，最新披露估值才可接受
        - 经审计指标、稳定合作伙伴生态和可见的付费订阅用户增长
        - 即便增长存在，隐藏债务、优先权或偏弱流失经济性也会限制上行
      - - 牛市
        - 经审计经常性收入接近或超过 USD 500M，转化和留存改善，IPO 就绪披露 支撑高端消费者订阅倍数
        - 估值区间：USD 2400M to 3000M
        - 只有 Strava 证明自己具备高端软件经济性，而不是普通健身应用增长，上行才存在
        - 公开申报或董事会级报告包、干净瀑布，以及可信的 M&A 或 IPO 路径
        - 训练收购带来的变现提升没有兑现，或披露仍达不到公开市场标准
    notes: 这些是用于承销纪律的估值区间，不是点估计。它们也不能直接转化为普通股价值，因为公开证据没有披露完整优先级结构。
