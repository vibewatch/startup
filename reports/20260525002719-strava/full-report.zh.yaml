  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、位置数据和监管表面
        blocks:
          - type: paragraph
            body: >-
              Strava 最高级别的残余风险仍是隐私和位置数据暴露：公司的核心产品把精确地理位置、持续社交分享，以及贴近健康数据的活动记录绑在一起。证据并非停留在假设层面。Strava
              自己的隐私政策称，活动数据包括地理位置，也可能包括心率数据；2026
              年条款更新还不得不提醒敏感岗位用户谨慎使用地理位置分享。支持文档说得更直白：隐藏起点和终点不能替代底层隐私设置，结合更多上下文仍可能推断出隐藏位置。独立报道解释了这类警示为何重要。GIJN、CNA、Digital
              Trends 和 Chino 都记录了公开或保护不足的分享如何暴露军事基地、安全团队日常路线，以及其他生活规律信号。在这个背景下，华盛顿州 My Health My Data Act 和 FTC
              位置数据命令，都会抬高任何把运动数据与健康相关推断结合的 app 的合规底线。缓释手段确实存在，但主要靠用户配置和政策约束，而不是从结构上消除问题，所以残余严重度仍然高。
