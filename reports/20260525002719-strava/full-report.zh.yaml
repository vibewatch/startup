        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 这张流程图是定性示意，展示价值如何在平台内流动，并非已披露的分阶段数量漏斗。
    claimRefs:
      - CU014
      - CU018
      - CU026
      - CU031
      - CU032
      - CU038
      - CU045
      - CU049
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Strava 的客户证明在真实部署和参与度上最强，但订阅之外的变现清晰度和留存披露明显弱得多。
    data:
      columns:
        - 具名部署证明
        - 量化结果
        - 变现清晰度
        - 续约可见度
        - 反向信号
      rows:
        - label: 免费运动者 / 消费端 App 用户
          values:
            - 无具名名单
            - 应用商店规模和评分高
            - 低
            - 低
            - 中，来自退款和隐私投诉
        - label: Premium 订阅者
          values:
            - 无具名名单
            - 中，靠定价和活动强度代理指标判断
            - 高
            - 低
            - 中，来自取消订阅摩擦
        - label: 俱乐部和赛事组织者
          values:
            - 是
            - 上传量、成员数和路线收藏高
            - 低至中
            - 低
            - 低至中
        - label: 品牌合作伙伴
          values:
            - 是
            - 线索、里程和参与者表现高
            - 中
            - 低
            - 中，来自活动依赖
        - label: 公共机构 / Metro
          values:
            - 是
            - 采用度和影响主张为中
            - 低
            - 低
            - 中，来自偏差和采购摩擦
        - label: 开发者 / API 用户
          values:
            - 是
            - 生态规模和集成度为中
            - 低
            - 低
            - 高，来自政策反弹
    approximationNotes: 矩阵评估的是证明质量，而不是收入占比。「低」续约可见度意味着本报告留存的公开证据没有披露队列或合同留存数据。
    claimRefs:
      - CU015
      - CU019
      - CU026
      - CU035
      - CU040
      - CU042
      - CU045
      - CU050
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险中，隐私 / 同意和平台依赖高于变现与单纯可靠性，因为它们会同时传导到信任、监管和留存。
    claimRefs:
      - CR014
      - CR018
      - CR024
      - CR029
      - CR032
      - CR039
      - CR045
      - CR047
      - CR048
      - CR051
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 隐私 / 敏感位置暴露
          values:
            - 高
            - 严重
            - 中等
            - 高
        - label: 消费者健康 / 地理定位执法
          values:
            - 中高
            - 严重
            - 发展中
            - 高
        - label: API 政策 / 开发者扰动
          values:
            - 高
            - 高
            - 低至中
            - 高
        - label: Garmin / 合作伙伴切断争议
          values:
            - 中
            - 高
            - 低至中
            - 中高
        - label: Runna / Breakaway 集成拖累
          values:
            - 中高
            - 中高
            - 低至中
            - 中高
        - label: 订阅集中 / 合作伙伴广告依赖
          values:
            - 中
            - 高
            - 中等
            - 中高
        - label: Metro 变现夸大
          values:
            - 中
            - 中
            - 低
            - 中
        - label: 反复宕机 / 可靠性杂音
          values:
            - 中高
            - 中高
            - 中等
            - 中
    approximationNotes: 发生概率和剩余严重性是基于留存证据做出的分析判断，尤其看复发频率、传导范围和可见缓释措施成熟度。
  - id: FR002
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Strava 的用户体验既依赖外部数据通道、设备生态和开发者善意，也依赖自有 App 界面。
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR021
      - CR024
      - CR027
      - CR044
      - CR045
      - CR052
    data:
      nodes:
        - id: n1
          label: Strava 核心平台
          detail: 社交健身网络、订阅、路线、路段
        - id: n2
          label: Apple Health / HealthKit
          detail: iOS 和 Apple Watch 训练数据与权限
        - id: n3
          label: Garmin Connect
          detail: 耐力运动者的主要设备同步通道
        - id: n4
          label: Android Health Connect
          detail: Android 健康数据交换层
        - id: n5
          label: 第三方训练 App
          detail: 数百个已集成的教练和分析工具
        - id: n6
          label: 赞助挑战品牌
          detail: Chipotle / Hoka / Duer 式活动买家
        - id: n7
          label: Metro 公共部门用户
          detail: 使用免费访问权限的城市、规划者和研究人员
        - id: n8
          label: Runna / Breakaway
          detail: 仍在集成中的自有训练 App
      edges:
        - from: n2
          to: n1
          label: 经授权的 Apple 健康数据
        - from: n3
          to: n1
          label: 自动导入训练数据
        - from: n4
          to: n1
          label: Android 健康数据层
        - from: n5
          to: n1
          label: 扩大实用性和转换成本
        - from: n6
          to: n1
          label: 活动收入 / 原生广告
        - from: n7
          to: n1
          label: 免费城市数据使用 / 品牌光环
        - from: n8
          to: n1
          label: 自有训练计划加购
        - from: n1
          to: n5
          label: API 政策和速率限制管住合作伙伴功能
  - id: FR003
    title: 风险传导图
    type: dag
    layout: wide
    summary: 如果隐私、平台或可靠性故障与变现压力、未完成的产品集成叠加，投资论点会最先断裂。
    claimRefs:
      - CR020
      - CR024
      - CR029
      - CR036
      - CR039
      - CR047
      - CR048
      - CR049
      - CR050
      - CR051
      - CR052
    data:
      nodes:
        - id: r1
          label: 隐私 / 同意事件
          detail: 敏感用户暴露或监管投诉
        - id: r2
          label: 平台 / API 规则变化
          detail: Garmin、Apple、Google 或 Strava 政策变化
        - id: r3
          label: 可靠性事件激增
          detail: 反复事件或又一次数小时宕机
        - id: r4
          label: 产品集成延误
          detail: Runna / Breakaway / FATMAP 转换不及预期
        - id: r5
          label: 用户信任与流失压力
          detail: 用户质疑价值、稳定性或数据安全
        - id: r6
          label: 品牌 / 合作伙伴摩擦
          detail: 挑战活动买家和生态合作伙伴犹豫
        - id: r7
          label: 收入增长不及预期
          detail: 订阅和捆绑转化表现不佳
        - id: r8
          label: IPO / 估值压力
          detail: 资本市场时机恶化，或关注点变窄
      edges:
        - from: r1
          to: r5
          label: 数据误用或暴露冲击信任
        - from: r2
          to: r5
          label: 工作流断裂让重度用户受挫
        - from: r3
          to: r5
          label: 服务不稳削弱付费意愿
        - from: r4
          to: r5
          label: 功能缺口削弱产品可信度
        - from: r2
          to: r6
          label: 开发者 / 设备伙伴反弹
        - from: r1
          to: r6
          label: 品牌和机构重新评估关联风险
        - from: r5
          to: r7
          label: 流失加剧、转化走弱
        - from: r6
          to: r7
          label: 合作伙伴收入和生态实用性走软
        - from: r7
          to: r8
          label: 增长不及预期压缩资本选项叙事
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从可见规模和变现潜力出发，经过 Premium 定价、披露缺口和外部风险，落到继续研究的决定。
    data:
      nodes:
        - id: scale
          label: 网络规模已经存在
          detail: 150M 至 195M 用户、40 亿次活动和强社交互动让 Strava 成为真正的平台
        - id: monetization
          label: 变现跑道可信
          detail: Premium、家庭版和 Strava-plus-Runna 定价显示，只要转化改善，ARPU 仍有上调空间
        - id: expansion
          label: 训练和国际扩张增加可选性
          detail: Runna、The Breakaway、Metro 和 Brazil PIX 都指向更宽的变现面
        - id: current-mark
          label: 当前估值已经含有溢价
          detail: 据报 USD 2.2B 估值意味着倍数接近高端消费订阅可比公司
        - id: disclosure-gap
          label: 核心经济性仍未公开
          detail: 公开来源仍缺毛利率、现金流、付费订阅用户质量和融资清偿顺序
        - id: external-risk
          label: 合作伙伴和信任风险仍在
          detail: Garmin/API 杠杆和隐私反弹仍可能压缩倍数
        - id: decision
          label: 继续研究
          detail: 只有价格更低或私有证据明显更好时才推进
      edges:
        - from: scale
          to: monetization
          label: 规模支撑 Premium 转化
        - from: monetization
          to: expansion
          label: 新产品可以抬高支出
        - from: expansion
          to: current-mark
          label: 市场已计入乐观预期
        - from: current-mark
          to: disclosure-gap
          label: 溢价抬高证明负担
        - from: disclosure-gap
          to: external-risk
          label: 数据缺口放大冲击
        - from: external-risk
          to: decision
          label: 价格和证据必须先改善
    approximationNotes: 这是决策流图，不是财务模型；展示的是驱动建议的分析依赖关系。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV023
      - CV025
      - CV035
      - CV040
      - CV041
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 对最影响 Strava 可支撑估值区间的因素给出 0-10 序数敏感性评分。
    data:
      items:
        - label: 经审计的订阅用户经济性
          value: 10
        - label: 股权结构和债务清晰度
          value: 10
        - label: 接近 USD 500M 的收入或 ARR 证明
          value: 9
        - label: 上市可比公司倍数压缩
          value: 8
        - label: 合作伙伴 / API 稳定性
          value: 7
        - label: 隐私和信任韧性
          value: 6
    approximationNotes: 数值是定性敏感性评分，不是百分比变化。分数越高，该因素推动 Strava 可支撑估值区间移动的力量越大。
    claimRefs:
      - CV015
      - CV025
      - CV029
      - CV035
      - CV040
      - CV041
      - CV042
      - CV050
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 熊市、基准、牛市情景对应的平台估值低 / 中 / 高区间。这些区间用于限制入场价格，而不是精确预测当前估值。
    data:
      items:
        - label: 熊市情景
          low: 1000
          mid: 1200
          high: 1400
          unit: USD M
          detail: 倍数向中档上市可比公司压缩，且信任、合作伙伴和清偿优先级风险尚未解决
        - label: 基准情景
          low: 1600
          mid: 1900
          high: 2200
          unit: USD M
          detail: 收入确实在 USD 415M 至 500M 区间，技术栈可控，但披露仍限制溢价
        - label: 牛市情景
          low: 2400
          mid: 2700
          high: 3000
          unit: USD M
          detail: 经审计的收入质量，以及更清晰的 IPO 路径或财务买家承接准备度，支撑高端消费订阅倍数
    approximationNotes: 这些平台估值区间锚定公开收入或 ARR 代理指标和上市可比公司区间。由于融资栈仍未披露，它们不能直接折算为普通股价值。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV035
      - CV036
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 基于公开证据质量，而非管理层接触，对 Strava 投资案例做紧凑评分。
    approximationNotes: 评分是根据本章证据综合出的 0-10 定性判断，并非正式模型生成。
    data:
      items:
        - label: 网络规模
          value: 8
          unit: /10
          detail: 150M 至 195M 用户和异常强的社交互动，支撑真实的平台重要性
          claimRefs:
            - CV009
            - CV010
            - CV011
            - CV012
            - CV013
        - label: 变现证明
          value: 6
          unit: /10
          detail: 定价和收入代理指标扎实，但付费订阅用户质量仍未公开
          claimRefs:
            - CV005
            - CV006
            - CV007
            - CV008
            - CV015
        - label: 战略可选性
          value: 7
          unit: /10
          detail: 训练并购、Metro 和巴西本地化带来可信上行路径
          claimRefs:
            - CV004
            - CV016
            - CV017
            - CV043
            - CV044
        - label: 披露质量
          value: 3
          unit: /10
          detail: 没有公开毛利率、现金流或融资清偿顺序细节，仍是重大短板
          claimRefs:
            - CV040
            - CV041
        - label: 平台依赖
          value: 4
          unit: /10
          detail: Garmin 或信任冲击仍会损害可携性和数据分享意愿
          claimRefs:
            - CV023
            - CV024
            - CV025
            - CV039
        - label: 估值支撑
          value: 4
          unit: /10
          detail: 上一轮估值已经把 Strava 定价到接近高端消费订阅可比公司
          claimRefs:
            - CV035
            - CV036
            - CV037
            - CV046
