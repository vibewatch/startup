      - number: '4.4'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              证据支撑最强的财务结论是：Strava
              是一家规模化、循环收入软件公司，消费者付费意愿有意义，漏斗顶端增长强，邻近变现也可信；但公开披露仍不足以支撑干净承销模型。订阅显然是主导变现引擎，赞助挑战是唯一披露了活动经济性的清晰变现 B2B 产品，Metro
              在当前官方材料中仍可免费访问。公开来源也留下几个关键私营公司问题未回答。投资者仍缺少按网页端与应用商店划分的审计收入确认、付费订阅用户数、计划组合、ARPU、队列留存、NRR、CAC、回本期、毛利率、当前现金、跑道和债务条款。即便收入线也基于估计：Business
              of Apps 称 2025 年收入 $415 million，Sacra 称 2023 年 ARR 为 $265 million，并把业务置于 2025/2026 年接近 $500 million ARR
              的位置；Strava 自身领导层发布也使用同样接近 $500 million
              的框架，但没有给出底层桥接。这足以支撑对收入质量和资本效率方向的建设性立场，但不足以建模标准化利润率或下行保护。因此，尽调重心应从广泛市场验证转向精确财务承销：核实付费订阅用户数、应用商店渠道占比、扣除支付 /
              平台费用后的毛利率、获客和留存效率，以及 2025 年收购和任何配套债务融资的确切现金影响。
