  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 隐藏优先级比暗示更糟
        - 债务、优先权或棘轮在 2025 年估值下实质损害普通股上行
        - 把平台故事变成回报封顶结构
        - 按熊市区间重新定价，或直接放弃
      - - 付费转化质量令人失望
        - 订阅用户增长、流失或毛利率撑不起高端消费者软件倍数
        - 打破高于传统健身可比公司付费的核心理由
        - 维持继续研究建议，或转为回避
      - - 合作伙伴 / API 接入恶化
        - 再次出现类似 Garmin 的争议，威胁上传连续性或迫使 Strava 做出不利用户的让步
        - 削弱 Strava 互操作性护城河，并损害互动质量
        - 削减估值支撑，并要求更大折价
      - - 信任和隐私问题复发
        - 公开反弹或数据分享失误让用户更不愿分享或订阅
        - 侵蚀支撑留存和付费意愿的社交图谱
        - 在信任指标恢复前，将其视为倍数压缩事件
      - - 退出路径关闭，而价格仍在高位
        - 估值预期仍高时，没有可信的战略、财务投资人或 IPO 路径出现
        - 移除区间高端，并降低预期 MOIC
        - 只承销有下行保护的结构，否则离场
    notes: 这些是终止标准，而非泛泛运营风险。每一项都会直接改变估值支撑、退出可信度，或普通股可获得的上行比例。
