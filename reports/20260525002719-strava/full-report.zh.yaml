  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Strava 方案
      - 可见收益
      - 局限
    rows:
      - - 用手机记录跑步或骑行
        - 打开手机 app、开始记录、监控数据、保存训练
        - 移动端原生记录，提供实时地图 / 数据、Beacon、偏离路线提醒和实时海拔
        - 把记录、安全和发布留在一个界面里
