  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程
      - 公开角色
      - 有证据支撑的依赖
      - 风险
      - 重要性
    rows:
      - - 客户端记录层
        - 移动 app 记录，叠加 Web 上传和查看
        - 手机传感器、浏览器兼容性、文件标准
        - 设备权限或浏览器问题会拖累体验
        - 记录可靠性是所有下游社交和训练功能的基础
      - - 活动摄取层
        - 统一原生记录、文件上传和合作伙伴同步
        - Garmin Connect、Apple Health、WHOOP、Wahoo、COROS 及其他导入
        - 合作伙伴 API 或权限变化可能造成摄取缺口
        - Strava 的覆盖广度取决于能否成为聚合层
      - - 路线规划层
        - 根据运动项目、路面和海拔偏好构建路线
        - OpenStreetMap 底图、热力图、社区路线数据、FATMAP 资产
        - 源地图数据差或更新滞后，可能把用户导错路
        - 主要订阅转化入口
      - - 社交层
        - 俱乐部、消息、评论、点赞和挑战
        - 移动 app 覆盖和治理设置
        - 滥用、垃圾信息或治理薄弱会伤害信任
        - 社交激励是留存引擎的一部分
      - - 训练与 AI 层
        - Training Log、Fitness & Freshness、训练计划和 Athlete Intelligence
        - 心率、功率、配速和位置数据质量
        - 数据稀疏或噪声高，会降低摘要质量
        - Strava 靠训练界面证明付费订阅值得买
      - - 开发者平台
        - 面向第三方 app 的 OAuth、activities API 和 webhooks
        - 客户端密钥处理、审核工作流、API 配额
        - 速率限制和单用户准入门槛可能压制生态增长
        - 外部开发者让 Strava 不必自己做完每个垂直小功能，也能保持有用
      - - 合作伙伴设备执行层
        - 在手表和码表上推送路线或接收同步
        - Garmin、Apple Watch、Wahoo、WHOOP 与 COROS
        - 可靠性和能力因合作伙伴而异
        - 执行环节分散在多个生态里，而非垂直自有
      - - 信任与运营层
        - 隐私控制、地图可见性默认设置、状态页透明度
        - 账户设置、地图控制、事件处理
        - 公开证据在控制项上更强，在审计材料上更弱
        - Strava 的消费者信任叙事偏实用，但仍弱于企业级合规叙事
    notes: 本表避开没有支撑的后端基础设施猜测，聚焦 Strava 通过帮助页面、开发者文档、合作伙伴指南和事件 / 状态披露公开记录的层级。
