  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Peloton
        - FY2025 收入约 USD 2.49B
        - 上市；市销率约 1.01x
        - 可作为知名品牌消费者健身订阅的有用下限可比
        - 硬件、重组历史和迥异资本结构让它更像估值底线，而非直接同行
      - - Planet Fitness
        - FY2025 收入约 USD 1.32B
        - 上市；市销率约 3.21x
        - 可作为消费者健身支出和留存的参考
        - 加盟健身房经济性和实体门店模式缺少 Strava 的社交图谱和软件特征
      - - Match Group
        - FY2025 收入约 USD 3.49B
        - 上市；市销率约 2.37x
        - 可作为已变现互动的社交网络和订阅参考
        - 约会市场动态和成熟增长画像与主动健身行为差异很大
      - - Duolingo
        - FY2025 收入约 USD 1.04B
        - 上市；市销率约 4.52x
        - 可作为具备习惯养成和全球规模的免费增值消费者订阅可比
        - Duolingo 披露更干净，变现质量也比 Strava 目前更清晰
      - - Spotify
        - FY2025 收入约 17.19B
        - 上市；市销率约 5.29x
        - 可作为大规模高端消费者平台参考，兼具订阅和发现行为
        - 音频经济性、广告组合和内容版权与健身社区应用差异很大
      - - Strava 最新披露估值
        - 披露的 2025 年私募估值为 USD 2.2B
        - 按 ARR 或收入代理值隐含约 4.4x 至 5.3x
        - 新资金承销纪律的直接价格锚
        - 该轮包含债务，公开来源未披露清算瀑布
    notes: 可比集刻意混合上市消费者订阅参照和 Strava 自身最新披露私募估值。它是区间工具，不是声称任何一家上市同行都能一对一匹配估值。
