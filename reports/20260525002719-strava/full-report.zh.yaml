      - number: '8.3'
        title: 可比区间与情景范围
        blocks:
          - type: paragraph
            body: >-
              公开可比公司支持的是估值走廊，而不是精确标记。Peloton 交易在约 1.0x 销售额，Match Group 接近 2.4x，Planet Fitness 接近
              3.2x，这三者共同框定了较低倍数区间：它们要么有硬件暴露、增长较慢，要么缺乏稀缺溢价。Duolingo 约 4.5x、Spotify 约
              5.3x，则展示了一个全球规模、能塑造使用习惯的消费者订阅平台，在披露更清晰、上市公司报告更成熟时可以获得的交易位置。Strava 据报道的 2025
              年私人市场估值，放到公开收入参照下看，已经令人不太舒服地贴近这个溢价区间。这不说明公司坏了，但说明容错空间很薄，除非经审计的经常性收入确实接近 $500 million，且 2025
              年融资堆叠比市场目前能看到的更干净。因此，悲观情景假设倍数压缩到公开区间中部，基准情景假设围绕最近披露估值取得合理但不便宜的结果，乐观情景则要求证明 Strava
              更像一个高级消费者订阅复利平台，而不是仍有平台和信任风险未解的社交健身 app。
