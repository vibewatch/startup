      - number: '3.3'
        title: 既有生态、定价伞和多栖使用
        blocks:
          - type: paragraph
            body: >-
              既有生态是最强大的分发威胁，因为它们不必逐个订阅赢得用户。Garmin 于 2025 年 3 月推出 Garmin Connect+，作为带 AI 洞察、训练指导、徽章挑战和扩展 LiveTrack
              的高级层，同时明确保留现有 Garmin Connect 免费基础。Apple 以每月 $9.99 或每年 $79.99 销售 Fitness+，并从覆盖 Series、SE 和 Ultra
              设备的手表产品线直接交叉销售。Samsung Health 把睡眠教练、跑步教练和心脏监测捆进 Galaxy Watch 和 Galaxy Ring 栈，Google Health Premium 则营销基于
              Gemini 的教练和自适应计划。


              这些生态也强化多栖使用，而不是排他性。Ride with GPS 将路线推送到 Garmin、Wahoo 和 Hammerhead 设备，AllTrails 也把路线发送到
              Garmin。TrainingPeaks 把自己定位为设备无关、以教练为中心。这意味着 Strava 往往叠在既有设备或教练栈之上，而不是替代它。定价伞反映同一动态：Strava 年费 $79.99 与
              Apple Fitness+ 持平，高于 AllTrails Plus 的 $35.99，低于 TrainingPeaks Premium 的 $134.99，而 Garmin Connect
              保留免费基础层。承销时，分发权力和捆绑经济性至少和产品功能等价性一样重要。
