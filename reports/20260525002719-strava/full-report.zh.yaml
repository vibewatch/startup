  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面和核心运动者工作流
        blocks:
          - type: paragraph
            body: >-
              Strava
              更适合被理解为一个跨手机、网页和伙伴设备工作流的消费者活动操作系统，而不是单一功能跑步应用。已审阅支持材料显示，运动者既可以在移动应用内原生记录，使用实时数据、路线加载、Beacon、偏航提醒和实时海拔，也可以从手表、自行车码表、健康应用、电脑文件或手动录入导入。这种广度重要，因为它降低了已拥有硬件或从事多种运动的运动者的切换成本。它也解释了为什么网页产品仍重要：即便手机应用是日常入口，桌面路线规划、文件上传和活动后管理仍是工作流的一部分。订阅深度进一步扩大循环，加入
              Training Log、Fitness & Freshness、Live Segments 和离线路线。因此，Strava 的产品不只是采集，也不只是社交；它是把采集转化为规划、竞争和习惯强化的连接组织。
