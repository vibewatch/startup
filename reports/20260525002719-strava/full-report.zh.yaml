      - number: '6.4'
        title: 公共机构和开发者明确使用 Strava，但经济性比订阅更不透明
        blocks:
          - type: paragraph
            body: >-
              公共机构和开发者明确使用 Strava，但这些细分的经济性比消费者订阅引擎更不透明。官方 Metro 页面称，该产品向规划师和城市政府免费；2026 年 4 月通勤报告称，超过 4,000
              个伙伴使用它。GovTech 通过 Oregon DOT 增加了真实部署细节：这个工具有价值到值得购买，但最初也难用到 Strava 为非专业人士重新设计 Metro。英国政府 parkrun
              研究更有启发：Strava 数据可以有帮助，但它只是部分代理指标，存在清楚的活动偏差。开发者叙事显示同一模式：真实使用加战略张力。Strava 称运动者每天上传数百万次活动，数千名开发者在 API
              上构建；第三方生态来源把开发者数推到超过 175,000，并称超过半数 Strava 用户连接到 API 驱动应用。Oura 证明存在实时双向集成，但 API 协议也显示 Strava 对伙伴行为保留了很强控制。
