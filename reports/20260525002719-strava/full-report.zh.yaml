companyProfile:
  summary: >-
    Strava 是一家总部位于旧金山的社交健身平台，由 Michael Horvath 和 Mark Gainey 于 2009 年创立。公司已从跑步和骑行记录工具，演进为覆盖 50
    多种活动类型的综合社交健身网络，功能包括路线规划、赛段竞争、俱乐部、AI 训练洞察，以及与大型设备和开发者生态的集成。公开披露显示，平台在 2025 年拥有 1.5 亿以上运动者，至 2026 年初用户数已超过 1.95
    亿；管理层也越来越把公司定位为高端订阅和训练平台，而不是单纯的记录应用。
  foundedDate: '2009-01-01'
  founders:
    - name: Michael Horvath
      role: 联合创始人
      background: Strava 前首席执行官；2024 年 CEO 交接后，转为执行顾问提供支持。
      claimRefs:
        - CO002
        - CO006
    - name: Mark Gainey
      role: 联合创始人
      background: 与 Horvath 共同创立 Strava，最初围绕运动者情谊中的社交和竞技健身命题展开。
      claimRefs:
        - CO002
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Strava 销售免费增值的移动端和网页端健身平台，核心是活动记录、社交分享、俱乐部、排行榜、路线发现、训练分析，以及接近高级教练体验的功能。付费计划增加更深度的数据分析、路线、AI 运动者智能、家庭计划，以及 Strava 加
    Runna 捆绑包；公司还支持 Metro 出行洞察和规模可观的第三方 API 生态。
  customerFocus: 面向在耐力和积极生活方式品类中跑步、骑行、徒步和训练的消费者，也覆盖赛事组织者、品牌营销方、通过 Metro 使用出行数据的公共部门用户，以及设备 / 应用生态伙伴等邻近参与者。
  businessModel: 主要收入来自消费者订阅，赞助挑战、生态伙伴关系和战略邻近产品作为补充；公开证据对重大数据授权收入的支撑弱于订阅案例。
  stage: Late-stage private platform business with a reported 2025 Series G valuation of $2.2B and subsequent debt financing.
