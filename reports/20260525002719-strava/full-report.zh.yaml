      - number: '5.5'
        title: 路线图和结论：Strava 正从活动网络拓宽为捆绑式训练与地图平台
        blocks:
          - type: paragraph
            body: >-
              最清晰的产品技术路线图信号是，Strava 不再只靠渐进功能发布增长。Runna 增加个性化跑步计划和教练，The Breakaway 增加骑行专项分析和进度追踪，FATMAP 增加 3D
              地形、指南和严肃户外规划深度。这些收购不是边缘动作；它们已经体现在定价、订阅者访问权，以及管理层对开放平台的语言中。Athlete Intelligence 以及 2026
              年手表导航和训练推荐更新指向同一方向：Strava 希望在保持设备无关的同时，拥有更多训练前、训练中和训练后循环。这在战略上有吸引力，因为它加深付费价值，又不迫使 Strava
              制造硬件。代价是，这个栈仍明显依赖被收购应用、伙伴设备、地图数据和 API
              层政策闸门。按承销视角，技术叙事在工作流广度和社区强化上强，在平台开放性上中等，在公开可靠性和安全保证上仍不完整。产品有差异化，但不是垂直完整。
