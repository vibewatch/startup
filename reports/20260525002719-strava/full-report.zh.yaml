      - number: '6.2'
        title: 俱乐部和社区功能让 Strava 不只是记录器
        blocks:
          - type: paragraph
            body: >-
              社区表面看起来是真实的，而不是装饰。Strava 支持和伙伴文件显示，俱乐部可以公开或仅限邀请，由管理员运营，并用于动态流、排行榜和活动。2025 年 Year in Sport 发布随后给出规模：网络上超过
              100 万个俱乐部，跑步俱乐部增长 3.5 倍，俱乐部组织活动增长 1.5
              倍。这个组合关系到客户质量。俱乐部把一个人使用的记录应用，变成本地小队、聚会和重复参与的协调层；这正是可以让用户在订阅前也持续回来的行为。它也是 Strava
              看起来比纯训练记录器更耐久的原因之一。很多应用都能记录一次跑步；能成为这次跑步社交操作系统的应用少得多。主要缺口在测量深度。公开材料显示了亮眼的社区势头，但仍没有披露俱乐部
              DAU、按俱乐部类型划分的留存，或俱乐部参与转化为高级订阅或付费 B2B 结果的频率。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: 具名部署证明在赛事和耐力品牌中最强
        blocks:
          - type: paragraph
            body: >-
              Strava 最接近耐力社区的地方，具名客户证明最强。London Marathon Events 使用 Strava 路线、俱乐部和创作者，产生超过 34,000 次上传、12,000 次路线保存，以及超过
              45,000 名成员的俱乐部。Atlanta Track Club 使用同一套工具建立了 11,000 人俱乐部，并在 Peachtree Road Race 前推动路线保存行为；Valencia Ciudad
              del Running 自 2018 年起使用 Strava 路线嵌入，并扩展到二维码路线和酒店大堂。品牌侧，证据从社区参与转向营销表现。CamelBak 2025 年案例研究报告触达 300,000+
              运动者、1.2 million 次活动和 43,000+ 条线索；Chipotle 称，在参与者此前赛段累计记录 9.25 million 英里之后，其城市挑战扩展到 25 个城市。Hoka 与 UTMB 联动的
              Fearless Kilometre 又增加了一个真实部署。这些证据远强于 logo 墙，因为它们展示了实际使用和结果，但仍没有达到续约证明或循环合同价值。
