      - number: '7.4'
        title: 变现、可靠性与集中度
        blocks:
          - type: paragraph
            body: >-
              Strava 的公开经济面已经强过早期创业公司叙事，但模型仍暴露在集中度和可靠性风险下。定价清晰，公司称年经常性收入（ARR）接近 $500 million，TechCrunch 报道有 50 million
              MAU 且下载增长很快。问题在于多元化。公开证据仍显示订阅是经济重心，赞助挑战则是基于营销活动的原生广告，主要局限于运动、健康和营养等本行业品牌。Metro 可能创造战略价值和城市公共善意，但 Strava
              与合作伙伴市场都称访问免费，这削弱了“公共部门授权已经提供主要第二引擎”的判断。与此同时，公开故障监测显示 2026 年运营噪音不小，地图、动态流、设置、赛段排行榜多次受影响，并至少出现一次大约 13
              小时的可用性事件。这种组合很关键，因为变现压力和可靠性摩擦会彼此叠加：如果用户反复感到产品不稳定，或者非订阅收入比表面用户规模暗示的更窄，价格标准化、高级捆绑包增购和 IPO 准备都会更难持续。
