  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 大众运动者免费使用 Strava；高端订阅者是经济核心
        blocks:
          - type: paragraph
            body: >-
              Strava 最大的客户事实是，大多数用户并不是直接付款方。官方 2025–2026 年材料显示，网络从超过 185 个国家、超过 1.8 亿用户，增长到 2026 年 4 月超过 1.95
              亿用户；应用商店描述仍把核心任务表述为免费记录加社区。这很重要，因为 Strava 真实客户图谱始于一个巨大的免费用户基础，之后可以支撑俱乐部、高级订阅转化、品牌、Metro
              和开发者。付费客户叠在这张图谱之上。美国定价公开且消费者容易理解：个人计划月费 $11.99 或年费 $79.99，家庭年费 $139.99，认证学生年费 $39.99，另有价格更高的 Strava+Runna
              捆绑包。这些层级清楚证明谁付费，但不能证明有多少人付费。本轮公开来源仍未披露订阅用户数、转化率、计划组合或流失率，因此免费增值基础已得到证明，付款方耐久性仍披露不足。
