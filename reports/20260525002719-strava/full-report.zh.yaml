      - number: '7.5'
        title: 领导层、执行与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              领导层与执行，是本章所有其他风险之上的最后约束层。Strava 的新班底显然更适合规模化，而不是创始人主导的小众 app：公司引入了有上市公司经验的 CFO 和新
              CMO，明确把团队与订阅增长、全球扩张绑定，并释放出继续收购和最终上市的开放信号。以 Strava
              的触达规模看，这些选择可以成立，但也压缩了犯错空间。管理层必须同时让监管者相信公司能妥善处理隐私和健康相关数据，防止合作伙伴争端削弱同步体验或开发者信任，整合已收购的教练产品而不重演 FATMAP
              式反弹，并证明涨价或捆绑包扩张不会转化为流失。因此，可监测的投资逻辑破裂触发点应是运营性的，而不是抽象口号：敏感用户相关隐私丑闻再次出现；API 或合作伙伴访问受到重大影响；旺季过后故障频率仍居高不下；证据显示
              Metro 仍不产生经济回报且挑战收入波动；或当前整合议程被消化前高级领导层流失。残余严重度为中高，因为大多数缓释都需要持续执行，而不是一次性修补。
