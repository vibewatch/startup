  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Strava 的公开记录足以让投资人感兴趣，但还不足以支撑激进进场价格。公司据报道在 2025 年估值为 $2.2 billion，官方称年经常性收入接近 $500 million，美国公开价格为每年
              $79.99，用户规模披露也从 2025 年 8 月超过 150 million 名运动者，推进到 2026 年 2 月超过 195 million 用户。这些事实说明，Strava
              是一个真实的高级订阅平台，而不是小众工具 app。问题在于，最近一次披露估值已经隐含大约 4.4x 到 5.3x 的经常性收入或收入倍数，具体取决于投资人采用哪项公开参照。这让 Strava 更接近
              Duolingo 和 Spotify，而不是 Peloton、Match Group 或 Planet Fitness；但 Strava
              仍未公开披露毛利率、EBITDA、自由现金流、付费订阅用户数、流失率，或包含债务的 2025
              年融资优先级条款。在最近披露估值或更高价格上，正确选择是继续研究，而不是买入。公开证据支持保持兴趣，但不支持在没有数据室的情况下支付溢价。
