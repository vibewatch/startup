      - number: '5.3'
        title: 集成和开发者生态扩大触达，也界定依赖面
        blocks:
          - type: paragraph
            body: >-
              Strava 的触达高度依赖互操作性。仅 Garmin 就覆盖入站活动同步、出站路线同步，以及受支持设备上的 Live Segments。Apple 通过 Apple Watch 训练导入、Apple
              Health 同步和 2025 年 Fitness+ 合作延展表面。WHOOP、Wahoo 和 COROS 展示同一模式：只要 Strava
              仍是运动者历史、路线和社交身份汇聚的账户，公司不需要拥有设备。开发者平台遵循类似思路，但门槛比面向消费者的营销所暗示更多。OAuth、范围化权限、活动端点和 webhooks
              让第三方集成可行，但速率限制和单玩家模式显示 Strava 主动策展访问权。因此，公开开发者信号真实但不算巨大。它有专门开发者论坛、活跃 Stack Overflow 标签和 GitHub
              组织，但没有广泛开源足迹，不足以让 Strava 看起来像一个深度外部化的平台业务。这并不致命；它只是说明生态具有战略重要性，但仍受政策约束。
