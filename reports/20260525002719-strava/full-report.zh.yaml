  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 订阅模式、标价和需求代理指标
        blocks:
          - type: paragraph
            body: >-
              Strava 的变现重心仍是消费者订阅。官方定价和应用商店表面显示，这是循环会员模式，而不是一次性商业交易：美国标价为每月 $11.99 或每年 $79.99，家庭计划 $139.99，Strava +
              Runna 捆绑包 $149.99。支持 FAQ 明确，账单自动续费，价格变化会在续费前至少 30 天通知；App Store
              也确认了同样的应用内购买价格点。公开来源没有显示的是每位付费用户实际净收入、折扣、应用商店渠道占比，或按计划划分的订阅用户数。需求质量比变现质量更容易看见。Strava 自有 2025–2026 年表面从
              150+ million 运动者，推进到 180+ million，再到 195+ million 用户；第三方应用市场报道称，平台在 2025 年每月新增约 3 million
              用户。这些用户数字不等于付费订阅者，但确实支撑了免费增值转化的庞大漏斗顶端。分析师对精确收入线的估计分化，但方向一致：Business of Apps 估计 2025 年收入 $415 million，Sacra
              估计 2023 年 ARR 为 $265 million，后来又描述 Strava ARR 正接近 $500 million；Strava 自身 2025 年 8 月领导层公告也呼应了接近 $500
              million 的表述。承销含义很直接：标价高度可见，用户规模足以支撑增长可信度，但实际订阅经济性仍需要管理层数据，而不是公开网页。
