      - number: '7.3'
        title: 收购与产品整合风险
        blocks:
          - type: paragraph
            body: >-
              Strava 现在要求投资人承接的产品逻辑，已经不只是跑步和骑行记录；这种扩张已经留下一个困难整合案例，又新增两个待整合对象。FATMAP 退役给出的教训很清楚：Strava
              愿意在完全替代那些吸引重度冬季运动用户的差异化用例之前，就关闭一款深受喜爱的专业 app。Powder 的报道显示，野外路线规划和冬季影像工作流因此留下的功能缺口并不小。Runna 和 The Breakaway
              又把公司进一步推向有教练介入、目标导向的训练，而不只是被动记录。Strava 自己的理由可以理解：2024 年记录了近 1 billion 次跑步，43% 的用户在 2025
              年瞄准大型赛事，管理层也想做出更深的训练闭环。但 TechCrunch 和 DC Rainmaker 都显示，整合路径仍有意保持松散：Runna 短期内继续独立，Breakaway 的整合也尚未完全说清。如果
              Strava 看起来偏袒自有训练 app，而不是更广泛生态，就会在产品一致性、定价架构、合作伙伴中立性和用户信任上制造执行风险。
            claimRefs:
              - CR031
              - CR032
              - CR033
