      - number: '7.2'
        title: 平台、API 与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Strava 的下一组主要风险来自它无法完全控制的依赖。Apple Health、Garmin Connect 和 Android Health Connect
              不是可有可无的插件；大量用户训练记录要靠这些权限和同步轨道进入产品。公共 API 同样具有战略意义：TechCrunch 称它对重度用户至关重要，Strava 自身也仍处在数百个训练 app
              集成的中心。因此，2024 年底的 API 变更影响很大。DC Rainmaker 和 road.cc 称，Strava 关闭了在第三方界面公开展示 Strava 数据的通道，并禁止 API 数据用于 AI
              模型；VeloViewer 为了继续合规，不得不重做同意流程。Garmin 争端进一步放大了这种依赖：一场法律与品牌分歧可能升级为 API
              被切断的风险。这不是单一合作方问题，而是多层平台控制问题——硬件厂商、操作系统所有者和 Strava 自己的 API
              规则，都会塑造下游客户体验。品牌强度和开发者规模能缓释一部分风险，但公司无法单方面保证这些外部轨道持续运转，所以残余暴露仍是中高。
