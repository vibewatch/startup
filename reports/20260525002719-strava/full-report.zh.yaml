      - - 从桌面端或手动文件上传
        - 在 Web 端使用 GPX / TCX / FIT 或手动录入
        - Web 上传器和手动活动工具
        - 覆盖老旧设备和修正工作流
        - Web 工作流能用，但差异化弱于移动端 + 设备同步
      - - 在桌面端规划路线
        - 搜索位置，设置运动项目 / 路面 / 海拔偏好，保存路线
        - Web 路线构建器，叠加热力图、赛段和社区照片
        - 比小屏移动端更适合高上下文规划
        - 高度依赖地图质量和 OSM 更新
      - - 在户外用移动端构建路线
        - 移动中在地图上点选点位或直接绘制
        - 移动端路线构建器，支持点位放置、铅笔模式和 Manual Mode
        - 支持临场规划和订阅用户离线使用
        - Manual Mode 和冬季运动边缘场景说明路线并非总能自动生成
      - - 竞争、协同并保持动力
        - 分享训练、加入俱乐部、给伙伴发消息、发起挑战
        - 赛段、俱乐部、消息和小组挑战
        - 把数据记录变成社区习惯循环
        - 消息和小组挑战仅在移动端提供
      - - 在设备上跟随路线
        - 将路线推送到手表 / 码表，然后骑行或跑步执行
        - Garmin 路线同步和 Live Segments、Apple Watch 路线导航更新
        - 把 Strava 从规划延伸到执行
        - 执行质量仍取决于合作伙伴设备支持
