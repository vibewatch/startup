  - id: TV002
    title: 正面论点 / 反面论点表
    columns:
      - 论点
      - 支持证据
      - 反驳点
      - 改变判断的条件
    rows:
      - - 社交健身网络护城河
        - 官方披露显示 180M 至 195M 用户、14B kudos、每年四十亿次活动，以及扎实的俱乐部 / 社群层
        - 互动不等于付费转化、利润率质量或持久定价权
        - 展示付费订阅用户增长、留存 cohort 和毛利率桥接
      - - 变现空间
        - 高级订阅定价、家庭计划和 Strava-plus-Runna 捆绑包支撑有意义的 ARPU 扩张潜力
        - 公开转化证据偏少，也可能意味着付费意愿存在结构性上限
        - 展示订阅用户数、转化趋势、CAC 回收期和按 cohort 划分的流失
      - - 训练驱动扩张
        - Runna 和 The Breakaway 增加教练与结构化训练界面，可能提高留存和消费
        - 收购可能带来复杂度、合作伙伴摩擦或低回报交叉销售，而不是显著 ARPU 提升
        - 展示附加率、捆绑包采用率和收购后留存提升
      - - B2B 和地域可选性
        - Metro 和巴西 PIX 本地化显示，Strava 能在美国以外变现数据并降低支付摩擦
        - 公开证据没有量化 B2B 收入，也没有证明国际转化经济性已经规模化
        - 展示收入结构、巴西付费增长和 Metro 贡献利润率
      - - 披露缺口
        - 公开来源仍缺少毛利率、EBITDA、自由现金流和融资瀑布
        - 私营业务可能仍远强于公开记录显示
        - 开放经审计的 2025 年财务、债务文件和清算优先权条款
      - - 当前反面论点
        - 最新披露估值已把 Strava 定在接近高端消费者订阅可比公司的水平
        - 如果数据室证明收入质量和资本结构干净，该溢价仍可能成立
        - 支付溢价倍数前，先证明订阅用户质量、合作伙伴耐久度和干净优先级
    notes: 正面论点和反面论点刻意围绕价格，而不是钦佩感。产品强，若公开披露跟不上要求的估值，投资仍可能缺乏吸引力。
