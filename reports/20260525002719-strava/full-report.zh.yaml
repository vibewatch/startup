  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公开记录 Strava 的创立、融资、领导层、收购、规模和隐私里程碑。
    data:
      items:
        - date: '2009-01-01'
          label: 创立
          detail: Mark Gainey 和 Michael Horvath 创立 Strava，重建运动员之间的伙伴感。
          tone: positive
        - date: '2014-10-29'
          label: Series D 轮
          detail: Sequoia 领投一轮已披露的 $18.5M 融资。
          tone: positive
        - date: '2018-01-01'
          label: 热力图反弹
          detail: 隐私审视成为公司的长期风险参照。
          tone: warning
        - date: '2020-11-16'
          label: Series F 轮
          detail: $110M 融资轮将 Strava 估值定在 $1.5B。
          tone: positive
        - date: '2023-12-11'
          label: 宣布 CEO 交接
          detail: Michael Martin 被任命为 CEO，2024 年 1 月 2 日生效。
          tone: neutral
        - date: '2025-03-05'
          label: 总部启用
          detail: Strava 在旧金山 181 Fremont 启用新的全球总部。
          tone: positive
        - date: '2025-04-17'
          label: 收购 Runna
          detail: Strava 签署协议，收购这款跑步教练应用。
          tone: positive
        - date: '2025-05-22'
          label: 收购 Breakaway
          detail: Strava 收购 The Breakaway 骑行应用的核心资产。
          tone: positive
        - date: '2025-05-26'
          label: Series G 轮估值重设
          detail: 公开数据库记录，Sequoia 领投融资对应 $2.2B 估值。
          tone: positive
        - date: '2025-08-19'
          label: 管理层补齐
          detail: Strava 新增 CFO 和 CMO，并称 ARR 接近 $500M。
          tone: positive
        - date: '2025-12-03'
          label: Year in Sport 报告
          detail: 公司报告 180M+ 用户、14B kudos 和 1M 俱乐部。
          tone: positive
        - date: '2026-01-09'
          label: 董事会扩充
          detail: Barry McCarthy 加入董事会。
          tone: positive
        - date: '2026-04-21'
          label: Metro 通勤报告
          detail: Strava 称 Metro 支持 4,000+ 合作伙伴和近 1B 人。
          tone: positive
        - date: '2026-05-21'
          label: 力量训练改版
          detail: 2025 年力量训练上传量超过 5 亿次后，14 项集成同步上线。
          tone: positive
