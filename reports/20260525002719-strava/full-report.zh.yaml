      - number: '3.4'
        title: 护城河耐久性和负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              Strava 仍有真实护城河，但比简单的「社交健身领导者」标签更窄。公开来源集合中最可防御的元素是 Global
              Heatmap，因为它依赖多年聚合社区活动数据，路线规划器或教练应用无法立刻复刻。这个资产的耐久性强于单个教练功能。护城河较弱的一侧是变现耐久性。Strava
              的价格点位处在免费基础和捆绑替代品密集的市场中，用户可以组合多个服务，而不是选择一个排他赢家。


              负面证据很重要。DCRainmaker 对 Strava 涨价推出方式的批评显示，即便核心产品仍强，定价变化也可能伤害信任。Komoot 2025
              年收紧付费墙，是来自竞争者侧的负面证据：路线规划应用也承受变现压力，这会训练用户更积极地横向比较订阅价值。Strava 现在捆绑 Runna
              这件事本身就是战略信号。管理层在传递：教练深度和计划坚持度，属于与社交活动记录同一次续费决策。简言之，Strava 的护城河在社区数据和品牌位置上最强，但在路线规划、教练深度和硬件主导分发上弱得多。
