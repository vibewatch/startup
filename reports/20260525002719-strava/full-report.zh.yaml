      - number: '8.4'
        title: 尽调闸门与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              剩下的工作是决定性的，不是探索性的。第一，投资人需要经审计的 2025 年或过去十二个月付费订阅用户、收入、利润率和流失数据，才能判断高级消费者软件可比组是否真正适用。第二，2025
              年融资包含债务，因此股权结构表、优先股堆叠、稀释机制和契约包必须打开，之后才能把平台表面估值转化为普通股上行空间。第三，管理层需要证明合作伙伴依赖可控：Garmin 争端显示，硬件生态合作伙伴仍能威胁
              Strava 的上传管道，并迫使公司战略后退。第四，用户信任很关键，因为 Strava
              的社交价值主张依赖用户继续分享数据。若再出现一次隐私失误，或有明确证据显示即便涨价和功能扩张，高级订阅转化仍在停滞，即使收入增长维持，也应给出更低倍数。在这些问题解决前，这个投资逻辑只有在价格纪律很强、且愿意随时放弃时才可投资。
