  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 产品 / 套餐
      - 公开价格 / 合同模式
      - 包含能力
      - 未知项 / 注意事项
      - 含义
    rows:
      - - Strava 订阅者
        - $11.99/mo 或 $79.99/yr
        - 在 Strava 社交 / 活动层之上的核心订阅功能
        - 抓取文本未完整显示公开功能页上的精确功能差异
        - 价格处在高端消费者区间
      - - Strava + Runna
        - $149.99/yr
        - Strava 订阅加打包的 Runna 优惠
        - 打包深度仍取决于收购后整合执行
        - 直接回应教练 App 竞争
      - - Apple Fitness+
        - $9.99/mo 或 $79.99/yr
        - 训练课程、定制计划、Apple Watch 关联指标
        - 最佳体验默认用户使用 Apple 硬件
        - 年度标价与 Strava 持平
      - - TrainingPeaks Premium
        - $11.25/mo，按年计费（$134.99/yr）
        - 结构化计划、训练分析、设备同步、力量工具
        - Premium 本身不包含真人教练服务
        - 比 Strava 更贵，但严肃训练规划更深
      - - TrainingPeaks 真人教练
        - $149-$359/mo
        - 真人教练加 Premium 账户
        - 真人服务模式无法直接对比社交网络定价
        - 为选择教练而非社交功能的运动员标出支付上限
      - - Ride with GPS Basic 方案
        - $5.00/mo，按年计费
        - 离线地图、语音导航、实时记录
        - 以骑行为先的定位
        - 对主要购买导航功能的用户，比 Strava 更便宜
      - - Ride with GPS Premium 方案
        - $6.67/mo，按年计费
        - 高级路线规划 / 编辑、热力图、提示、隐私区、私密路段
        - 没有面向大众的广泛社交动态流
        - 更重规划深度，而不是社交参与
      - - Komoot Premium
        - 抓取文本中的官方页面未显示价格；DCR 报道新用户同步门槛为 $59/yr
        - 多日路线、实时追踪、路线天气
        - 官方公开定价可能随市场或入口变化
        - 变现更强硬，也会抬高 Strava 面临的对比压力
      - - AllTrails Plus
        - 试用后 $35.99/yr
        - 离线地图、偏航提醒、向 Garmin 发送路线
        - 更偏步道 / 户外，而不是广义训练
        - 对以导航为主的户外用户，是更低价的替代品
      - - Google Health Premium
        - 抓取片段中未显示价格
        - Gemini 教练、自适应计划、睡眠洞察、训练库
        - 需要在登录态或特定地区流程中进一步确认价格
        - 说明教练价值可以脱离社交账本单独打包
