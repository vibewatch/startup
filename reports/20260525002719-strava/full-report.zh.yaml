  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计收入和付费订阅用户质量
        - 2025 年或过去十二个月收入、付费订阅用户、流失、毛利率，以及按 cohort 划分的 CAC 回收期
        - 决定 Strava 值得高端软件倍数，还是只能用宽泛消费者健身倍数
        - CFO 数据室加董事会级运营看板
      - - 资本表和融资结构
        - 2025 年融资的完整债务条款、清算优先权、转换机制、契约和稀释桥接
        - 把平台估值转化为实际普通股回报测算
        - 对最终融资文件开展法务和财务尽调
      - - 按产品线划分的收入结构
        - 核心订阅、捆绑附加、Metro 或数据产品、合作伙伴关系，以及任何广告或赞助收入之间的拆分
        - 检验 Strava 是否拥有多条持久收入流，还是仍主要依赖单一产品经济性
        - 财务尽调加管理层产品收入桥接
      - - Runna 和 Breakaway 整合 KPI
        - 训练产品的附加率、捆绑包采用率、留存提升和增量 ARPU
        - 显示 M&A 是真正扩大 LTV，还是只是拓宽产品界面
        - 产品和增长团队报告包
      - - 合作伙伴依赖和信任控制
        - 设备合作伙伴合同、API 变更协议、隐私事件日志和信任与安全治理指标
        - Strava 的护城河同时依赖数据可携带性和分享活动数据的意愿
        - 结合法务、平台、信任与安全尽调，以及合作伙伴访谈
    notes: 每项尽调要求都直接绑定估值支撑。若管理层无法提供这些材料，本章建议不应从继续研究上调。
