      - number: '5.2'
        title: 地图、训练和社交深度是主要订阅护城河
        blocks:
          - type: paragraph
            body: >-
              公开记录中差异化最强的一方产品表面，是路线、地图、赛段和由社交介导的训练功能。在网页端，Strava 让订阅者跨 32
              项运动规划路线，按热门度、海拔和路面调整路线，并借助热力图、赛段和社区照片决定去哪里。在移动端，路线构建器更战术化：运动者可以点击点位、画线，或在自动路线不够好时切换到 Manual
              Mode。随后，订阅功能通过把 Training Log、Fitness & Freshness、Best Efforts、个人热力图和 Group Challenges
              叠加在基础活动流之上，让数据值得反复返回。社交层也不只是简单点赞。俱乐部、排行榜、直接或群组消息和挑战机制，把个人进步变成共同进步；这也是为什么即便单个功能模块可以被复制，Strava 仍有黏性。FATMAP
              让地图叙事更宽，把产品进一步推向徒步、越野和山地使用场景；这些场景里，地形和离线规划很重要。
