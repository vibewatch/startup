      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              核心产品的商业结构很简单：个体运动者通常同时是买方、用户和付款方。定价页和 App Store
              列表都暗示，这是一个基于训练效用、社交强化、路线或洞察功能的消费者可选支出决策。公开产品文案还显示，用户基础正从经典跑者和骑行者扩展到力量训练用户和普通健身参与者，但买方通常仍是同一个人。邻近业务里，图谱更有意思。教练捆绑用户代表相邻的消费者延伸，付款方仍是运动者，但预算开始更像高端训练软件。Mars
              和 PepsiCo 等品牌赞助商购买面向 Strava 社区的挑战曝光时，就成为次级付款方。Metro 又把模型翻转：规划师、公共机构和研究人员成为买方或付款方，居民和步道用户则是间接受益者。最后在 API
              和同步层，平台团队和设备厂商掌握集成预算，即便最终运动者仍通过 Strava 感受这段关系。这些区别重要，因为它们说明 Strava 可以触达多个预算所有者，而不需要每个邻近业务今天都变成独立市场。
