      - number: '1.4'
        title: 规模轨迹、里程碑和负面背景
        blocks:
          - type: paragraph
            body: >-
              2025 年至 2026 年初，Strava 的公开规模指标快速加速。公司发布从 2025 年 3 月和 8 月的 1.5 亿以上运动者，推进到 2025 年 12 月超过 1.8 亿用户，再到 2026 年
              4–5 月超过 1.95 亿用户。同一时期，里程碑也更密集：2025 年 3 月总部启用、4 月收购 Runna、5 月收购 Breakaway、2025 年 5 月融资后估值据报升至 $2.2
              billion、2025 年 8 月搭建领导班子、2025 年 12 月发布 Year in Sport 报告、2026 年 1 月 Barry McCarthy 加入董事会、2026 年 4 月发布 Metro
              通勤报告，以及 2026 年 5 月力量训练大改版。这些里程碑让公司概览可作为后续章节的记录时间线复用。主要负面提示在隐私和披露纪律。Forbes 2022
              年安全调查显示，即便在更知名的热力图争议之后，Strava 的数据共享设计和赛段机制仍可能暴露敏感军事身份，这意味着隐私应继续作为活跃风险视角，而不是已关闭的历史脚注。另一个问题是，精确 ARR、2025
              年融资金额和当前员工数等私营公司指标仍只得到部分支撑，因此本章把它们明确列为证据缺口，而不是悄悄转成事实。
