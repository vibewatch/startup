      - number: '5.4'
        title: 信任和隐私控制很务实，但公开保证在功能层强于正式控制披露
        blocks:
          - type: paragraph
            body: >-
              Strava 公开表面中最强的信任证据偏务实，而不是企业剧场式。Privacy Center、地图可见性默认设置和
              Beacon，直接回应了位置密集型健身应用的主要消费者风险：意外过度分享。首次上传后默认隐藏活动地图起点和终点各 200 米，是一个高度产品化的安全选择；可以扩大隐藏半径或隐藏完整地图，也显示 Strava
              理解公共排行榜会与私人住址数据发生冲突。状态页同样有用，因为它让运动者直接看到可靠性事件，而不是只收到模糊的社交媒体道歉。不过，从投资者尽调角度看，信任表面仍不完整。公开文件更擅长解释控制和工作流，而不是拿出控制审计证据、正常运行时间承诺或事件率趋势。这不意味着底层控制弱；它意味着公开证据包为消费者优化，而不是为企业式尽调优化。因此，可靠性和合规仍值得跟进，即便日常产品控制看起来周到。
