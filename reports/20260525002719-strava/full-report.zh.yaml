      - number: '3.2'
        title: 直接应用、路线规划器和邻近替代品
        blocks:
          - type: paragraph
            body: >-
              在直接应用竞争者中，TrainingPeaks 是最清晰的教练优先替代方案。其 Premium 计划年费 $134.99，并向上销售每月 $149 至 $359
              的真人教练包；这让它在结构化训练深度和教练工作流上高于 Strava，即便大众市场社交参与较弱。Ride with GPS 是来源集合中最强的路线规划专家：它销售 Starter、Basic 和 Premium
              分层，强调无线同步到 Garmin、Wahoo 和 Hammerhead 设备，并向俱乐部、车店和赛事营销组织账户。对于比起排行榜或社交发布，更在意导航和路线分发的骑行者和赛事驱动社区，它是务实替代品。


              Komoot 从户外和探险角度竞争同一项路线规划任务。Komoot Shop 仍销售一次性地图产品，Komoot Premium 则捆绑多日规划、实时追踪、路线天气和运动专项地图。DCRainmaker 2025
              年 3 月分析补充了一个负面细节：新用户现在需要 Premium 才能把路线同步到已连接设备，这收紧变现，但可能缩窄免费采用。低端方面，Nike Run Club 免费覆盖核心跑步记录和实时位置分享；传统
              MapMyRun / MapMyFitness 资产仍作为现状记录工具存在，即便当前网页定价不透明。
