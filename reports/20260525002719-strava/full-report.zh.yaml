        - 关注、发消息、参加挑战并组织俱乐部
        - 已规模化的当前功能
        - 把健身记录和社区协同串起来
        - 移动 app 消息界面和治理规则
        - 公开的治理或滥用响应披露有限
      - - 合作伙伴同步层
        - 导入或导出活动、路线和健康数据
        - 已规模化的当前功能
        - 跨主要设备的硬件无关记录入口
        - Garmin、Apple、WHOOP、Wahoo、COROS 及其他合作伙伴
