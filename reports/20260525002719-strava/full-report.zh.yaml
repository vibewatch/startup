      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景从 Strava 的网络效应开始。官方和外部来源共同描绘出一个拥有 180 million 到 195 million 用户、2025 年 14 billion 次 kudos、每年 4 billion
              次活动、深度设备互操作性的平台；它的社交层相对通用记录工具仍有差异化。变现跑道也说得通：Sacra 仍称高级订阅渗透率偏低，而官方定价显示 Strava 现在以有意义的消费者软件价格点销售个人、家庭和
              Strava 加 Runna 方案。Runna 和 The Breakaway 收购说明，管理层正在尝试从被动记录转向更高价值的教练和训练闭环；Metro 加上巴西 PIX
              本地化，也显示核心美国订阅基础之外还有可选空间。反向逻辑在于，用户规模和参与度不会自动转化为可持续的公开市场经济面。隐私事件、Garmin 带来的合作伙伴 / API
              杠杆，以及缺乏公开毛利率、队列留存、现金流或清算瀑布数据，都很重要，因为当前估值已经假设 Strava 是高质量平台。Strava 可能配得上这个溢价，但单靠公开证据还没有证明。
