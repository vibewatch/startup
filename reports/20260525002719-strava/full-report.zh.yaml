      - number: '4.3'
        title: 成本结构、盈利信号和资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑一种资产轻的软件成本结构，但还不足以还原完整私营公司 P&L。Strava
              是订阅应用，没有保留下来的证据显示其销售硬件、持有库存或承担制造义务；可见成本基础指向劳动力、云和地图基础设施、应用商店计费、信任和隐私工作、订阅与品牌合作的
              GTM，以及围绕收购和集成的产品投入。最好的劳动力代理指标虽然旧但官方：2024 年初，Strava 称全球员工已超过 400 人；到 2025 年，公司正在招聘有 IPO 经验的 CFO 和订阅导向
              CMO。同一份 2024 年 CEO 交接发布在财务上也重要，因为它声称 Strava 在此前四年每年都盈利，这显著削弱了公司只是靠失控运营烧钱资助增长的悲观论点。资本结构仍只部分可见。TechCrunch
              和其他媒体坚实佐证了 2020 年 11 月由 TCV 和 Sequoia 领投、金额 $110 million 的 Series F；本报告保留的 SEC 证据更早，关联的是 Strava Capital
              Investments GP 2015 年 Form D，因此满足申报要求，但不能解决当前资本化问题。较新的 2025 年融资信号主要来自 Tracxn 和 Tech Funding News，它们提到 $2.2
              billion 估值，甚至一轮未披露债务融资，但这些条目在这里没有得到备案或主要媒体一手报道佐证。手头现金、月度烧钱、跑道和当前债务条款，在保留的公开证据中仍不可得。实际结论是，Strava
              看起来比依赖硬件的同行更不吃现金，并且可能已具备结构性盈利能力；但收购后的资本充足性，若没有管理层现金桥和债务时间表，无法完全承销。
