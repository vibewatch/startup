  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前公开状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 核心订阅
        - 通过直销和应用商店销售的循环高级会员
        - 月度或年度计划
        - 美国官方标价为月付 $11.99 / 年付 $79.99；分析师来源把订阅视为主导收入线
        - 循环收入质量高，但实际净收入和应用商店渠道占比未披露
        - 付费订阅者数、网页端与应用商店计费、退款、递延收入，以及按队列划分的流失
      - - 折扣订阅包装
        - 家庭和学生折扣不改变核心产品，但拓宽转化选项
        - 年度折扣计划
        - 家庭计划公开价 $139.99/year；学生折扣有公开提及，Sacra 估计为 $39.99/year
        - 可能有利于家庭和学生获客，但折扣弹性未报告
        - 付费家庭 / 学生、折扣兑换率，以及相对全价计划的留存
      - - Strava + Runna 组合包
        - 把 Strava 订阅与 Runna 教练结合的交叉销售组合包
        - 年度组合包
        - Runna 收购后公开标价 $149.99/year；官方收购条款未披露
        - 如果挂载率健康，可能抬高 ARPU，并加深训练工具价值
        - 组合包挂载率、收入分成条款，以及对单独计划的蚕食
      - - 赞助挑战 / 路段
        - 品牌为 Strava 内的挑战活动和奖励兑换流程付费
        - 活动费用
        - Modern Retail 报道活动起价 $20,000，并随定向和放大力度变化
        - 有潜力的 B2B 收入流，但活动级利润率和季节性未披露
        - 年度品牌收入、毛利率、重复广告主和销售周期长度
      - - Metro 数据服务
        - 面向规划者和机构的聚合、去标识化出行数据集
        - 合作访问
        - 官方页面目前称 Metro 向获批公共部门用户免费开放
        - 对品牌和数据飞轮具备战略价值，但当前不是已披露利润中心
        - 是否存在付费企业版本、市政合同收入和内部服务成本
      - - API 生态 / 合作伙伴层
        - 第三方 App 接入 Strava 数据，可能推动留存、训练用例和收购
        - 无公开付费层
        - 公开 API 有速率限制，未披露付费访问层；100+ 训练 App 接入 Strava
        - 通过留存、分发和并购来源间接变现，而不是直接 API 收费
        - 合作伙伴对留存 / 转化的贡献，以及是否存在企业 API 变现
    notes: 本表把已披露收入机制与公开变现证据分开。官方价格是标价，不是实际净收入。
