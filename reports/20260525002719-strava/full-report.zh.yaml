      - number: '2.2'
        title: 用多重规模视角，而不是单一 TAM 标题
        blocks:
          - type: paragraph
            body: >-
              只有先讲清类别边界，公开市场数据才有决策价值。以应用为中心的研究，与运动专项或更广义虚拟健身研究会给出很不一样的答案。The Business Research Company 将 2026 年健身应用市场估为
              $22.36 billion，Coherent 将 2026 年运动和健身应用市场估为 $15.63 billion，Mordor 估算更宽的虚拟健身市场为 $38.81 billion。Wellness
              Creative Co 对应用中心健身的估计更高，达到 $28.7 billion；Grand View 则从低得多的 2025 年基数和更慢的长期 CAGR
              起步。这些不是针对一个完全相同市场的干净矛盾，而是对邻近、部分重叠类别的不同镜头。可穿戴设备基数更大，IDC 预计 2026 年出货量 625.2 million，但那是使能硬件层，不是 Strava
              收入。企业健康管理又增加了 $72.73 billion 的邻近预算池，但缺少 Strava 直接捕获的公开证明。可信结论是：Strava
              身处一个庞大且增长中的软件市场，但没有管理层数据，公开来源无法支撑精确单一的 TAM、SAM 或 SOM。
