      - number: '6.5'
        title: 参与度代理指标很强，但留存和集中度披露不足，投诉真实存在
        blocks:
          - type: paragraph
            body: >-
              强习惯代理指标支撑了耐久性，但没有披露留存数学。Strava 官方报告称，订阅者在应用内每花两分钟，就会产生一小时活跃运动；2025 年交换了 14 billion 个 kudos。消费者评价表面也很庞大：美国
              App Store 页面显示，357,000 条评分给出 4.8 分；Google Play 显示 100 million+ 下载，并邀请用户加入超过 180 million
              活跃人群。这些是真实规模和满意度信号。不过，可见的信任和政策摩擦抵消了一部分。Trustpilot 存档页面显示 1.5 分，围绕意外收费、取消、退款和支持反复出现投诉。The Independent 和
              TrainerRoad 讨论显示，API 限制会让生态伙伴感到暴露；Digital Trends 2026 年报道也提醒，隐私姿态会影响敏感用户和机构。综合来看，Strava
              的客户图谱广且真实，但公开变现证据仍集中在高级订阅和活动式品牌支出上，流失率、GRR、NRR 和合同续约数据仍属私有。
