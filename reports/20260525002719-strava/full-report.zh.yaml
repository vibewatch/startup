  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和排除项
        blocks:
          - type: paragraph
            body: >-
              Strava
              最接近的市场不是整个数字健身，也不是整个可穿戴设备，而是消费者记录活动、比较表现，并为分析或规划工具付费的软件层。官方产品表面把这条边界锚定在一款带社交功能、路线发现、训练洞察和广泛多运动记录的订阅健身应用上。因此，消费者订阅支出、类似教练的附加功能和数据网络功能应纳入范围。同一证据也说明，为什么若干邻近资金池不应纳入核心市场定义。Strava
              不销售硬件、健身房会员、保险报销或医疗服务。可穿戴设备重要，因为它们把数据送入应用，但大部分设备收入属于邻近生态伙伴，而不是 Strava 本身。同样，Metro 和公共 API
              是真实邻近业务，但最好视为核心软件和数据网络的延伸，而不是 Strava 参与所有企业或出行数据类别的证据。因此，正确边界是一个社交健身和耐力追踪平台，并在教练、数据访问和挑战驱动合作中拥有可变现邻近空间。
