      - number: '1.2'
        title: 领导层、创始人和治理信号
        blocks:
          - type: paragraph
            body: >-
              领导层也是当前证据修正旧市场传闻的领域。Strava 于 2023 年 12 月宣布 Michael Martin 出任新 CEO，并于 2024 年 1 月 2 日接任；联合创始人 Michael
              Horvath 则转为执行顾问。2025 年 8 月，公司称已通过任命 Matt Anderson 为 CFO、Louisa Wee 为 CMO 完成领导班子搭建；2026 年 1 月又邀请 Barry
              McCarthy 加入董事会。这一组合重要，因为 Strava 近期运营姿态更像是一家为更大战略选项做准备的规模化订阅平台，而不是只由创始人驱动的初创公司。同时，治理透明度仍不完整。公开材料能清楚识别 CEO
              交接、部分高管和一位重要董事新增，但没有完整披露委员会架构、McCarthy 之外的董事会构成，或投资者控制权。因此，后续章节可以安全复用 Martin 任 CEO、Horvath / Gainey
              为创始人、McCarthy 进入董事会这些基本事实，同时把治理权利和完整董事会监督继续放在尽调清单上。2026 年 Yahoo Finance 仍把 Horvath 列为 CEO
              的过期资料，也是一个有用提醒：第三方公司数据库不是当前领导层事实的权威来源。
