  - id: TV001
    title: 建议摘要表
    columns:
      - 视角
      - 当前判断
      - 公开证据支撑
      - 决策含义
      - 改变判断的条件
    rows:
      - - 建议
        - 继续研究
        - 规模和变现证据真实存在，但估值与资本结构透明度不足
        - 仅凭公开证据，不应按最新披露估值或更高价格承销新资金
        - 只有价格下修，或管理层开放经审计经济性和融资结构，才转为跟踪
      - - 信心
        - 中
        - 证据方向清楚，但精度仍弱
        - 使用情景区间，而不是单一点目标
        - 若披露经审计的 2025 年收入、付费订阅用户和流失数据，信心会上升
      - - 风险评级
        - 高
        - 合作伙伴依赖、隐私信任和隐藏优先级都可能压缩倍数
        - 要求明确终止触发项和下行保护
        - 若合作伙伴接入稳定且转化质量得到验证，风险下降
      - - 估值立场
        - 最新披露 $2.2B 估值偏紧
        - 尽管披露更薄，隐含 4.4x 至 5.3x 收入或 ARR 已接近高端消费者订阅可比公司
        - 避免为仍不透明的平台支付高端软件倍数
        - 若估值接近 USD 1600M 至 1800M，或经审计证据证明高端经济性配得上溢价，立场改善
      - - 偏好退出路径
        - 战略出售或财务投资人再资本化，比今天干净重估更可信
        - 已有 M&A 和 IPO 准备信号，但没有完整披露的公开申报
        - 按私募流动性承销，而不是押注激进的公开市场扩张
        - 若 Strava 公开提交文件，披露深度更强且合作伙伴经济性稳定，判断改善
    notes: 该表把本章转化为投资立场。建议明确对价格敏感，不把公司质量当作估值支撑的替代品。
