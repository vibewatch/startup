        - 任何可信的 2026 年及以后报道显示，在现行条款和控制措施后，敏感角色仍暴露生活模式
        - 暂停承销判断，直到管理层提供根因分析、默认设置调整和监管沟通日志
      - - API / 平台依赖
        - 重大合作伙伴规则变化或开发者反弹
        - Garmin、Apple、Google 或 Strava API 政策变化，移除核心用户关键同步 / 展示流程
        - 重算留存下行情景，并要求提供同步失败、支持量和合作伙伴通知的一手数据
      - - 收购整合
        - 捆绑包或应用整合表现不及预期
        - 两个报告周期后，Runna / Breakaway 仍独立运行，且没有可衡量的上售或留存提升
        - 把 M&A 战略视为执行拖累，而非护城河扩张，并下调收入可信度假设
      - - 变现集中
        - 定价压力上升时，非订阅收入仍然狭窄
        - 赞助挑战续约走弱，或涨价速度超过功能满意度
        - 假设订阅集中度持续，并收紧流失 / 转化情景
      - - 可靠性
        - 高峰季度内故障频率仍处高位
        - 核心界面再次出现多小时可用性事件，或每周反复故障
        - 下调高级订阅转化假设，并要求 RCA、SLA 和故障补偿证据
      - - 领导层 / 治理
        - 管理层不稳或控制深度不足
        - 在收购和隐私议程稳定前，CFO、CMO 或关键信任 / 产品负责人离职
        - 上调执行风险评级，并要求继任计划和董事会监督证据
