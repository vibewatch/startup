  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Strava 面对的产品至少解决四类相邻任务：记录和分享活动、跟随结构化训练、规划和导航路线，以及留在硬件拥有方的健康生态内。因此，竞争集合比直接社交跑步应用更宽。TrainingPeaks
              变现教练和结构化计划。Ride with GPS、Komoot 和 AllTrails 攻路线规划、导航和离线地图。Nike Run Club 以及传统 Under Armour / MapMy
              资产，仍是面向不需要付费社交层跑者的免费或低摩擦记录替代品。Garmin、Apple、Samsung 和 Google/Fitbit
              则从硬件和默认应用侧接近同一运动者，软件可以与手表、戒指、手机或更大的服务栈捆绑。


              Strava 正通过拓宽自身供给来回应。当前美国定价包含 Strava + Runna 捆绑包；TechCrunch 报道，Strava 在 2025 年先后收购 Runna 和 The
              Breakaway。含义是，买方可以组装一个栈，而不是选择单一赢家：用户可以保留设备生态，购买路线规划器，同时仍用 Strava 承载社交层。这降低了每个独立订阅的排他性压力，也提高了持久差异化的门槛。
