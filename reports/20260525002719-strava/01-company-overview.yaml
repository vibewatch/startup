chapter:
  number: 1
  title: Company Overview
  summary: Strava entered late May 2026 as a San Francisco-based social fitness platform founded in 2009 by Michael Horvath and Mark Gainey, but now led by CEO Michael Martin after a 2024 transition. Official and corroborating sources support a 2025-2026 step-up in scale from 150 million-plus athletes to 195 million-plus users, a 2025 valuation reset to roughly $2.2 billion, and a strategy increasingly defined by subscriptions, ecosystem depth, and training-app acquisitions rather than by simple run-and-ride tracking alone.
sections:
- id: identity-product-and-footprint
  title: Identity, Product, and Footprint
  body: 'Strava’s identity is now much clearer than the starting assumptions in this run: official 2025-2026 materials show that the company is still a San Francisco-based social fitness platform founded in 2009 by Michael Horvath and Mark Gainey, but the current CEO is Michael Martin, not Horvath. The product has broadened well beyond cycling and running into a multi-sport social graph that now supports more than 50 activity types, strength logging, AI-generated workout insights, routes, clubs, segment leaderboards, and safety features. March 2025 headquarters materials place the company at 181 Fremont Street in downtown San Francisco and also show a broader office footprint across New York, London, Denver, Berlin, Dublin, Paris, and São Paulo. For later chapters, the essential ground truth is that Strava is best understood as a subscription-led consumer fitness network with a large installed community, an open API ecosystem, and an expanding product surface rather than as a single-sport
    tracking utility. Public evidence also shows that some narratives around direct API licensing should be treated cautiously: the official Metro product is described as free of charge for social-impact transportation planning, so public monetization proof is much stronger for subscriptions and bundles than for data licensing.'
