  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-gap
    missingEvidence: A board-approved financing memo or cap table update showing the exact dollar amount, instrument terms, and dilution of the 2025 Series G and June 2025 debt package.
    whyItMatters: Valuation without round size leaves capital efficiency, runway impact, and dilution assumptions under-specified.
    diligencePath: Request the 2025 financing deck, signed term sheet summary, and post-close cap table from management or lead investors.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: arr
    missingEvidence: Audited 2025 revenue, ARR, gross margin, and mix between subscriptions, bundles, and any partnership-related revenue.
    whyItMatters: The company says it was approaching $500M ARR, but there is no public package that lets investors test the quality or composition of that run rate.
    diligencePath: Request monthly recurring revenue bridge, audited management accounts, and subscriber cohort data covering 2024-2026.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current HRIS-backed employee census by function and geography.
    whyItMatters: Third-party databases reviewed in this run disagree on workforce size, which makes operating-efficiency and org-capacity analysis unreliable.
    diligencePath: Request current employee count, contractor count, and a location/function split from People or Finance.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A full current board roster, committee structure, and summary of investor governance rights or protective provisions.
    whyItMatters: Public releases identify the CEO transition and one board addition, but they do not fully resolve who controls key decisions or how governance is structured.
    diligencePath: Request the board list, charter documents, investor-rights summary, and any board-observer or veto provisions.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: A company-authenticated chronology of exact dates for early product launches, privacy-remediation changes, and any secondary liquidity events.
    whyItMatters: The public chronology is decision-useful but still month- or year-level for several early milestones, which limits precision in later cross-chapter references.
    diligencePath: Ask management for an internal milestone timeline and reconcile it against press releases and financing records.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
