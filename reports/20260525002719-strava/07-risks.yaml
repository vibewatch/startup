  - - Third-party developer ecosystem
    - Coaching, analytics, and training apps
    - Extends utility and switching costs for power users
    - Hundreds of apps integrate with Strava
    - Policy changes alienate developers and push users toward direct-to-device alternatives
    - High
    - Open API messaging and selective platform governance
    - Trust can weaken quickly once developers redesign around Strava rather than with it
  - - Sponsored challenge partners
    - Endemic brands such as Chipotle, Hoka, and Duer
    - Secondary B2B monetization channel
    - Visible but campaign-based rather than recurring SaaS revenue
