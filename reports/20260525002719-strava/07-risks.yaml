    - Cities, planners, researchers
    - Strategic data flywheel and civic brand channel
    - Wide usage but free access
    - High usage may not translate into material direct revenue diversification
    - Medium
    - Public-good positioning and product-led brand benefits
    - The strategic value is real, but direct economics remain under-disclosed
  notes: Severity ranks the dependency by likely transmission into retention, data ingest, partner trust,
