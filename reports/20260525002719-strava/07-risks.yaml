  title: 'Top residual risk: privacy plus consent'
  body: The biggest underwriting problem is not a single disclosed lawsuit. It is the combination of precise
    location data, social visibility, repeat military/security examples, and a tighter U.S. consent regime
    for health-adjacent data.
  claimRefs:
