slug: strava
runDate: '2026-05-25'
company:
  name: Strava
chapter:
  number: 7
  title: Risks
  summary: Strava's highest residual risks are privacy and consent failures around sensitive location
    data, platform dependence on external sync rails and API governance, and execution risk from trying
    to monetize and integrate a broader training stack while reliability remains noisy. Public evidence
    supports real mitigations, but most are policy-, partner-, or user-behavior-dependent rather than
    structurally eliminating the downside.
sections:
- id: privacy-location-and-regulatory-surface
  title: Privacy, location-data, and regulatory surface
  body: 'Strava''s highest-severity residual risk is still privacy and location-data exposure because
    the company''s core product combines precise geolocation, persistent social sharing, and health-adjacent
    activity records. The evidence is not theoretical. Strava''s own privacy policy says Activity Data
    includes geolocation and can include heart-rate data, while the 2026 terms update had to remind users
    in sensitive roles to use geolocation-sharing responsibly. Support documentation is even blunter:
    hiding start and end points does not replace the underlying privacy setting, and hidden locations
    can still be inferred with additional context. Independent reporting shows why that warning matters.
    GIJN, CNA, Digital Trends, and Chino all document how public or weakly protected sharing can reveal
    military bases, security-team routines, and other pattern-of-life signals. Against that backdrop,
    Washington''s My Health My Data Act and FTC location-data orders raise the compliance floor for any
    app that combines movement data with health-adjacent inference. The mitigation set is real, but it
    is user-configured and policy-driven rather than structurally eliminating the problem, which is why
    residual severity remains high.'
  claimRefs:
