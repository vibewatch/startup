  - - Garmin Connect
    - Garmin
    - Automatic ingest rail for a major endurance-device ecosystem
    - High for serious athletes
    - Branding or commercial disputes spill into ingest/API risk or degrade sync
    - High
    - Direct user account linking and manual file-upload fallback
    - Fallbacks are worse than seamless sync and do not remove Garmin leverage
  - - Android Health Connect
    - Google / Android
    - Android health-data exchange layer
    - Medium but rising as Android health-data standards consolidate
