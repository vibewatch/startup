- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / consent / sensitive-user exposure
    - New public report of military, executive-protection, or health-sensitive location exposure tied
      to Strava sharing
    - Any credible 2026+ report showing sensitive-role pattern-of-life exposure after current terms and
      controls
    - Pause underwriting until management provides root-cause analysis, default-setting changes, and regulator-communication
      log
  - - API / platform dependence
    - Material partner rule change or developer backlash
    - Garmin, Apple, Google, or Strava API policy change that removes a key sync/display workflow for
      power users
    - Recut retention downside and demand direct sync-failure, support-volume, and partner-notice data
  - - Acquisition integration
    - Bundle or app integration underperforms
    - Runna / Breakaway remain standalone with no measurable upsell or retention lift after two reporting
      cycles
    - Treat M&A strategy as execution drag rather than moat expansion and lower revenue-confidence assumptions
  - - Monetization concentration
    - Non-subscription revenue remains narrow while pricing pressure rises
    - Sponsored challenge renewals weaken or price increases outpace feature satisfaction
    - Assume subscription concentration persists and tighten churn / conversion scenarios
  - - Reliability
    - Incident frequency stays elevated through a peak quarter
    - Another multi-hour availability event or repeated weekly incidents across core surfaces
    - Discount premium-conversion assumptions and require RCA, SLA, and incident-compensation evidence
  - - Leadership / governance
    - Bench instability or missing control depth
    - Departure of CFO, CMO, or key trust / product leaders before acquisition and privacy agenda is stabilized
    - Escalate execution risk rating and request succession plan plus board oversight evidence
  notes: These kill criteria are meant to be monitored quarterly. Each one is tied to evidence already
    visible in public sources rather than intuition-only red flags.
