- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case
  - Jurisdiction
  - Current status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Sensitive geolocation / consumer-health consent
    - US states + FTC
    - Live; Strava collects precise location and health-adjacent activity data while U.S. enforcement
      is tightening
    - High
    - Critical
    - Privacy controls, policy updates, consumer-health disclosures, user permissions
    - User-configured controls do not eliminate pattern-of-life or consent-chain risk
    - Review consumer-health-data flows, consent logs, and location-sharing defaults by cohort
  - - Pattern-of-life exposure for sensitive users
    - Global / security-sensitive cohorts
    - Live; independent reporting in 2025-2026 still shows military and security exposure from public
      sharing
    - Medium-High
    - High
    - Map visibility controls, private-account options, user education in 2026 terms
    - Users can still overshare and hidden points may remain inferable
    - Audit default privacy settings for new users and sensitive-role escalation policies
  - - Washington My Health My Data Act and analogous health-data rules
    - Washington / broader U.S. trend
    - Active; law covers health data outside HIPAA and regulates collection and sharing
    - Medium
    - High
    - Consumer Health Data Policy, state-law workflows, legal review
    - Private litigation and state-by-state divergence could widen obligations faster than product settings
      adapt
    - Obtain counsel memo mapping Strava features to MHMDA, CPPA, and similar state regimes
  - - Garmin litigation and API leverage
    - US legal + commercial partner channel
    - 2025 complaint filed, then voluntarily dismissed without prejudice; partner dispute still surfaced
      API leverage
    - Medium
    - Medium-High
    - Commercial negotiation, open API positioning, partner diversification
    - A future IP or branding dispute could still interrupt ingest or increase partner friction
    - Review Garmin contract terms, notice periods, branding clauses, and contingency sync plans
  notes: Public-only register. Severity reflects retained evidence on user harm, regulatory trajectory,
    and commercial transmission rather than private settlement probability.
