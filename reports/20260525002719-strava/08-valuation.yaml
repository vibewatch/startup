  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Indicative valuation range
      - Return logic
      - Probability signal
      - Key failure mode
    rows:
      - - Bear
        - External 2025 revenue proxy stays closer to USD 415M, multiple compresses toward 2.5x to 3.5x, and partner or privacy friction persists
        - USD 1000M to 1400M
        - Only attractive via a deep discount, downside protection, or structured exposure rather than premium common equity
        - More API conflict, more trust incidents, slower premium conversion, or evidence that the 2025 financing stack is senior-heavy
        - Public-like premium disappears and the equity case starts looking like a discounted fitness-app utility
      - - Base
        - Revenue or ARR is truly in the USD 415M to 500M zone, partner access remains intact, and acquisitions improve retention without proving Duolingo-like quality
        - USD 1600M to 2200M
        - The last reported mark is only acceptable if the cap table is clean enough for common-equity upside to survive
        - Audited metrics, stable partner ecosystem, and visible paid-subscriber growth
        - Hidden debt, preferences, or weak churn economics cap upside despite growth
      - - Bull
        - Audited recurring revenue is near or above USD 500M, conversion and retention improve, and IPO-ready reporting supports a premium consumer-subscription multiple
        - USD 2400M to 3000M
        - Upside exists only if Strava proves premium-software economics rather than generic fitness-app growth
        - Public filing or board-grade reporting pack, clean waterfall, and credible M&A or IPO path
        - Monetization lift from training acquisitions does not materialize or disclosure still falls short of public-market standards
    notes: >-
      These are valuation bands for underwriting discipline, not point estimates. They also do not translate directly into
      common-equity value because public evidence does not disclose the full seniority stack.
