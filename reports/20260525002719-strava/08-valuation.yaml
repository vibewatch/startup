  - id: diligence-gates-and-thesis-breakers
    title: Diligence gates and thesis-breakers
    body: >-
      The remaining work is decisive rather than exploratory. First, an investor needs audited 2025 or trailing
      twelve-month paid-subscriber, revenue, margin, and churn data to determine whether the premium-consumer-software
      comp set is actually earned. Second, the 2025 financing included debt, so the cap table, preference stack,
      dilution mechanics, and covenant package have to be opened before a headline platform valuation can be translated
      into common-equity upside. Third, management needs to show that partner dependence is manageable: the Garmin
      dispute showed that a hardware ecosystem partner can still threaten Strava's upload pipeline and force a strategic
      retreat. Fourth, user trust matters because Strava's social value proposition depends on people continuing to share
      data. Another privacy misstep, or clear evidence that premium conversion is stalling despite price and feature
      expansion, would argue for a lower multiple even if top-line growth holds up. Until those issues are cleared, the
      thesis is investable only with strong price discipline and a willingness to walk away.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
