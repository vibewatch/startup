  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The bull case starts with Strava's network effects. Official and external sources describe a platform with 180
      million to 195 million users, 14 billion kudos in 2025, four billion annual activities, deep device
      interoperability, and a social layer that still looks differentiated versus generic trackers. The monetization
      runway is also plausible: Sacra still describes premium penetration as low, while official pricing shows Strava
      now sells individual, family, and Strava-plus-Runna plans at meaningful consumer-software price points. The Runna
      and The Breakaway acquisitions suggest management is trying to move from passive logging toward higher-value
      coaching and training loops, and Metro plus Brazil PIX localization show optionality beyond the core U.S.
      subscription base. The anti-thesis is that user scale and engagement do not automatically convert into durable
      public-market economics. Privacy incidents, partner/API leverage from Garmin, and the absence of public gross
      margin, cohort retention, cash flow, or waterfall data all matter because the current valuation already assumes a
      high-quality platform. Strava may deserve that premium, but public evidence alone has not yet proved it.
    claimRefs:
      - CV004
      - CV007
