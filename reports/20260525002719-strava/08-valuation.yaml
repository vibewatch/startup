schemaVersion: report-v2
artifact: valuation
slug: strava
runDate: '2026-05-25'
company:
  name: Strava
chapter:
  number: 8
  title: Valuation
  summary: >-
    Strava has enough scale, monetization evidence, and strategic optionality to merit continued diligence, but the
    last reported $2.2 billion mark already prices the company near premium consumer-subscription comparables while
    public disclosures still omit paid-subscriber quality, margins, cash generation, and the capital-stack waterfall.
    The chapter therefore lands on a research-more recommendation, medium confidence, high risk, and a stretched-at-last-mark valuation stance unless a lower entry price or materially better private evidence emerges.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Strava's public record is strong enough to justify investor interest and too thin to justify an aggressive entry
      price. The company has a reported $2.2 billion 2025 valuation, official language that it is approaching $500
      million of annual recurring revenue, visible U.S. pricing at $79.99 per year, and user-scale disclosures that ran
      from more than 150 million athletes in August 2025 to more than 195 million users in February 2026. Those facts
      indicate a real premium-subscription platform rather than a niche utility app. The problem is that the last
      reported mark already implies roughly 4.4x to 5.3x recurring revenue or revenue, depending on which public proxy
      an investor believes. That puts Strava much closer to Duolingo and Spotify than to Peloton, Match Group, or Planet
      Fitness, even though Strava still does not publicly disclose gross margin, EBITDA, free cash flow, paid-subscriber
      counts, churn, or the seniority terms of the 2025 financing that included debt. The right call at or above the
      last reported mark is research-more, not buy. Public evidence supports interest, but not a premium paid without a
      data room.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
