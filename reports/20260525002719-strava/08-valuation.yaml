  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence in favor
      - Counterpoint
      - What would change the view
    rows:
      - - Social-fitness network moat
        - Official disclosures show 180M to 195M users, 14B kudos, four billion annual activities, and a strong club/community layer
        - Engagement does not equal paid conversion, margin quality, or durable pricing power
        - Show paid-subscriber growth, retention cohorts, and gross-margin bridge
      - - Monetization runway
        - Premium pricing, family plans, and the Strava-plus-Runna bundle support meaningful ARPU expansion potential
        - Low public conversion evidence can also mean willingness to pay is structurally capped
        - Show subscriber count, conversion trend, CAC payback, and churn by cohort
      - - Training-led expansion
        - Runna and The Breakaway add coaching and structured training surfaces that can increase retention and spending
        - Acquisitions can create complexity, partner friction, or low-return cross-sell rather than meaningful ARPU lift
        - Show attach rates, bundle uptake, and post-acquisition retention uplift
      - - B2B and geographic optionality
        - Metro and Brazil PIX localization show Strava can monetize data and reduce payment friction outside the U.S.
        - Public evidence does not quantify B2B revenue or prove international conversion economics at scale
        - Show revenue mix, Brazil paid growth, and Metro contribution margins
      - - Disclosure gap
        - Public sources still omit gross margin, EBITDA, free cash flow, and the financing waterfall
        - The private business may still be much stronger than the public record suggests
        - Open audited 2025 financials, debt documents, and liquidation preference terms
      - - Current anti-thesis
        - The latest reported mark already prices Strava near premium consumer-subscription comparables
        - That premium could still be earned if the data room proves quality of revenue and a clean stack
        - Prove subscriber quality, partner durability, and clean seniority before paying a premium multiple
    notes: >-
      The thesis and anti-thesis are intentionally framed around price, not admiration. A strong product can still be an
      unattractive investment when public disclosures lag the valuation demanded.
