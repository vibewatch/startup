  - id: comparable-corridor-and-scenarios
    title: Comparable corridor and scenario range
    body: >-
      The public comparable set supports a corridor, not a precise mark. Peloton trades around 1.0x sales, Match Group
      near 2.4x, and Planet Fitness near 3.2x, which together frame a lower-multiple bucket for fitness or subscription
      platforms with either hardware exposure, slower growth, or less premium scarcity. Duolingo at roughly 4.5x and
      Spotify at roughly 5.3x show where a globally scaled habit-forming consumer subscription platform can trade when
      investors have cleaner disclosures and more mature public-company reporting. Strava's reported 2025 private mark,
      when set against public revenue proxies, lands uncomfortably close to that premium bucket. That does not make the
      company broken. It does mean the margin for error is thin unless audited recurring revenue is truly near the $500
      million level and the 2025 financing stack is cleaner than the market can currently see. The bear case therefore
      assumes multiple compression toward the public middle of the range, the base case assumes a fair but not cheap
      outcome around the last mark, and the bull case requires proof that Strava behaves more like a premium consumer
      subscription compounder than a social fitness app with unresolved platform and trust risk.
    claimRefs:
