tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current verdict
      - Public support
      - Decision implication
      - What would change the view
    rows:
      - - Recommendation
        - Research-more
        - Scale and monetization proof are real, but valuation and capital-stack transparency are insufficient
        - Do not underwrite new money at or above the last reported mark from public evidence alone
        - Move to track only if price resets lower or management opens audited economics and the financing stack
      - - Confidence
        - Medium
        - Direction of evidence is clear while precision remains weak
        - Use scenario bands rather than a point target
        - Confidence rises with audited 2025 revenue, paid-subscriber, and churn disclosures
      - - Risk rating
        - High
        - Partner dependence, privacy trust, and hidden seniority can all compress the multiple
        - Require explicit kill triggers and downside protection
        - Risk falls if partner access stabilizes and conversion quality is verified
      - - Valuation stance
        - Stretched at the last reported $2.2B mark
        - Implied 4.4x to 5.3x revenue or ARR sits near premium consumer-subscription comps despite thinner disclosure
        - Avoid paying premium-software multiples for a still-opaque platform
        - Stance improves nearer USD 1600M to 1800M or with audited proof that premium economics warrant the premium
      - - Preferred exit path
        - Strategic sale or sponsor recap is more credible than a clean rerating today
        - M&A and IPO-prep signals exist, but not a public filing with full disclosure
        - Underwrite to private liquidity rather than heroic public-market expansion
        - View improves if Strava publicly files with stronger reporting depth and stable partner economics
    notes: >-
      This table turns the chapter into an investment posture. The recommendation is explicitly price-sensitive and does
      not treat company quality as a substitute for valuation support.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV035
      - CV036
      - CV040
