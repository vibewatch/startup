  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-stack
      missingEvidence: Full cap table, debt terms, liquidation preferences, conversion mechanics, and covenant package for the 2025 financing stack.
      whyItMatters: Public headline valuation cannot be converted into common-equity value or target MOIC without knowing seniority and dilution.
      diligencePath: Request definitive financing documents, current cap-table model, and counsel review before underwriting any price near the last reported mark.
      relatedQuestionRefs:
        - QV022
        - QV026
        - QV028
        - QV030
    - type: private-evidence-only
      severity: material
      topic: monetization-quality
      missingEvidence: Audited 2025 or trailing-twelve-month paid subscribers, churn, gross margin, CAC payback, and contribution margin by major product line.
      whyItMatters: These metrics determine whether Strava deserves premium consumer-subscription multiples or should trade closer to middle-tier fitness comps.
      diligencePath: Obtain board-grade subscriber-cohort decks, product-revenue bridge, and audited financial statements.
      relatedQuestionRefs:
        - QV004
        - QV020
        - QV022
        - QV024
        - QV025
    - type: enumeration-incomplete
      severity: material
      topic: comparable-set
      missingEvidence: Broader private round marks, secondary transactions, and paid-database comps for outdoor and fitness consumer apps.
      whyItMatters: The current public comp table is enough for a corridor, but not enough to tighten the band around a precise private valuation.
      diligencePath: Extend the comp set with paid databases, banker precedent calls, and secondary-market references before final pricing.
      relatedQuestionRefs:
        - QV019
        - QV023
        - QV024
        - QV025
      relatedTableRefs:
        - TV004
    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: Actual IPO-preparation materials, audited controls readiness, and sponsor or banker feedback on likely exit routes.
      whyItMatters: The upper end of the range assumes a credible liquidity path; without it, a premium mark is harder to defend.
      diligencePath: Review banker materials, board minutes, audit-readiness workstreams, and any confidential filing timeline.
      relatedQuestionRefs:
        - QV015
        - QV016
        - QV030
