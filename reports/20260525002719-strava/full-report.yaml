  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and core athlete workflow
        blocks:
          - type: paragraph
            body: >-
              Strava is best understood as a consumer activity operating system that sits across phone, web, and
              partner-device workflows rather than as a single-feature running app. The reviewed support material shows
              that an athlete can record natively in the mobile app with live stats, route loading, Beacon, off-route
              alerts, and live elevation, or arrive through imports from watches, bike computers, health apps, computer
              files, or manual entry. That breadth matters because it lowers the switching cost for athletes who already
              own hardware or train in multiple sports. It also explains why the web product still matters: desktop
              route planning, file upload, and post-activity management remain part of the workflow even when the phone
              app is the daily entry point. Subscription depth expands the loop further with Training Log, Fitness &
              Freshness, Live Segments, and offline routes. Strava’s product is therefore not just capture, and not just
              social; it is the connective tissue that turns capture into planning, competition, and habit
              reinforcement.
