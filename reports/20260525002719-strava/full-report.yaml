      - number: '1.4'
        title: Scale Trajectory, Milestones, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              Strava’s public scale markers accelerated quickly across 2025 and early 2026. Company releases moved from
              more than 150 million athletes in March and August 2025 to over 180 million users by December 2025 and
              more than 195 million users by April-May 2026. The same period also produced a denser milestone record:
              the March 2025 headquarters opening, the April Runna acquisition, the May Breakaway acquisition, the May
              2025 funding step-up to a reported $2.2 billion valuation, the August 2025 leadership-bench buildout, the
              December 2025 Year in Sport report, the January 2026 Barry McCarthy board addition, the April 2026 Metro
              commute report, and the May 2026 strength overhaul. Those milestones make the company overview reusable as
              a chronology of record for later chapters. The main adverse caveat is privacy and disclosure discipline.
              Forbes’ 2022 security investigation showed that Strava’s data-sharing design and segment mechanics could
              expose sensitive military identities even after the better-known heatmap controversy, which means privacy
              should remain a live risk lens, not a closed historical footnote. Separately, private-company metrics such
              as exact ARR, exact 2025 financing amount, and current headcount remain only partially supported, so this
              chapter keeps them explicit as evidence gaps instead of quietly converting them into facts.
