  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from visible scale and monetization potential through premium pricing, disclosure
      gaps, and external risks to a research-more decision.
    data:
      nodes:
        - id: scale
          label: Network scale exists
          detail: 150M to 195M users, four billion activities, and strong social engagement make Strava a real platform
        - id: monetization
          label: Monetization runway is credible
          detail: Premium, family, and Strava-plus-Runna pricing show room to raise ARPU if conversion improves
        - id: expansion
          label: Training and international expansion add optionality
          detail: Runna, The Breakaway, Metro, and Brazil PIX all point toward broader monetization surfaces
        - id: current-mark
          label: The current mark is already premium
          detail: The reported USD 2.2B valuation implies a multiple near premium consumer-subscription comps
        - id: disclosure-gap
          label: Core economics remain private
          detail: Public sources still omit gross margin, cash flow, paid-subscriber quality, and the financing waterfall
        - id: external-risk
          label: Partner and trust risks are live
          detail: Garmin/API leverage and privacy backlash can still compress the multiple
        - id: decision
          label: Research-more
          detail: Move only with a lower price or materially better private evidence
      edges:
        - from: scale
          to: monetization
          label: Scale enables premium conversion
        - from: monetization
          to: expansion
          label: New products can raise spend
        - from: expansion
          to: current-mark
          label: Market already prices optimism
        - from: current-mark
          to: disclosure-gap
          label: Premium price raises proof burden
        - from: disclosure-gap
          to: external-risk
          label: Missing data magnifies shocks
        - from: external-risk
          to: decision
          label: Price and proof must improve first
    approximationNotes: >-
      This is a decision-flow figure rather than a financial model. It shows the analytical dependencies that drive the
      recommendation.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV023
      - CV025
      - CV035
      - CV040
      - CV041
      - CV046
