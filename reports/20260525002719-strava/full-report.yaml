  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Strava’s strongest public journey runs from free tracking and social discovery into clubs, premium upsell, and
      then either durable habit or trust friction.
    data:
      nodes:
        - id: discover
          label: Discover Strava
          description: >-
            Athletes arrive through app stores, friends, challenges, or broad awareness of Strava as the social home of
            movement.
        - id: track
          label: Track for free
          description: >-
            Users record runs, rides, hikes, and dozens of other sports without paying, which builds the initial network
            base.
        - id: join
          label: Join clubs and events
          description: Clubs, route embeds, and challenges connect users to local crews, marquee races, and branded activations.
        - id: pay
          label: Upgrade to premium
          description: >-
            A subset of athletes convert for routes, insights, leaderboards, safety features, and bundled services such
            as Runna.
        - id: expand
          label: Generate partner value
          description: >-
            Once the graph is active, Strava can support organizers, brands, Metro users, and API-connected devices and
            apps.
        - id: risk
          label: Habit or friction
          description: >-
            Strong ratings and activity intensity support durability, but billing pain, privacy concerns, or API
            restrictions can weaken trust.
    approximationNotes: >-
      The stages are synthesized from product pages, community docs, partner case studies, and adverse review signals
      rather than a disclosed funnel with stage counts.
    claimRefs:
      - CU003
      - CU004
      - CU012
      - CU013
      - CU018
      - CU026
      - CU040
      - CU042
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Strava’s deployment logic starts with a free athlete graph, then branches into subscriptions, events, brands,
      public agencies, and API integrations.
    data:
      nodes:
        - id: n1
          label: Free athlete graph
          type: input
          detail: Millions of athletes track activities and create a large network before any direct monetization occurs.
        - id: n2
          label: Community layer
          type: process
          detail: Clubs, route embeds, events, and challenges turn solo tracking into shared behavior and repeat engagement.
        - id: n3
          label: Premium conversion
          type: process
          detail: A subset upgrades into individual, family, student, or bundled subscription plans.
        - id: n4
          label: Partner surfaces
          type: process
          detail: Event organizers, brands, planners, and connected-app developers use the graph for their own outcomes.
        - id: n5
          label: Policy control point
          type: process
          detail: Strava keeps pricing, API rules, and Metro access terms under tight platform control.
        - id: n6
          label: Expansion or friction
          type: output
          detail: >-
            The same platform control can create durable network effects or trigger backlash when billing, privacy, or
            API rules become painful.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n2
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: >-
      This flow is qualitative. It shows how value moves through the platform rather than a disclosed stage-count
      funnel.
    claimRefs:
      - CU014
      - CU018
      - CU026
      - CU031
      - CU032
      - CU038
      - CU045
      - CU049
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Strava’s customer proof is strongest on real deployment and engagement, but much weaker on monetization clarity
      and retention disclosure outside subscriptions.
