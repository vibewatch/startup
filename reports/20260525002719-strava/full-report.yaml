      - number: '1.2'
        title: Leadership, Founders, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              Leadership is another area where current evidence corrects stale market chatter. Michael Martin was
              announced as Strava’s new CEO in December 2023 and took over on January 2, 2024, while co-founder Michael
              Horvath shifted into an executive-advisor role. In August 2025 the company said it had finalized its
              leadership bench by adding Matt Anderson as CFO and Louisa Wee as CMO, and in January 2026 it added Barry
              McCarthy to the board. The combination matters because Strava’s recent operating posture looks more like a
              scaled subscription platform preparing for larger strategic options than a founder-only startup. At the
              same time, governance visibility remains incomplete. Public materials are good at identifying the CEO
              transition, selected executives, and one notable board addition, but they do not fully disclose committee
              structure, board composition beyond McCarthy, or investor control rights. That means later chapters can
              safely reuse Martin-as-CEO, Horvath/Gainey-as-founders, and McCarthy-on-the-board as ground truth, while
              keeping governance rights and full board oversight on the diligence list. The stale 2026 Yahoo Finance
              profile that still named Horvath as CEO is a useful warning that third-party company databases are not
              authoritative for current leadership facts.
