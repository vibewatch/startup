      - number: '5.4'
        title: >-
          Trust and privacy controls are practical, but public assurance is stronger on features than on formal control
          disclosures
        blocks:
          - type: paragraph
            body: >-
              The strongest trust evidence in Strava’s public surface is practical rather than enterprise-theatrical.
              Privacy Center, map-visibility defaults, and Beacon directly address the main consumer risk in a
              location-rich fitness app: accidental oversharing. Hiding the first and last 200 meters of activity maps
              by default after the first upload is a notably productized safety choice, and the ability to widen the
              hidden radius or suppress the full map shows Strava understands that public leaderboards and private
              residence data can conflict. The status page is similarly useful because it gives athletes a direct window
              into reliability incidents instead of vague social-media apologies. Still, the trust surface is incomplete
              from an investor diligence perspective. Public documents are much better at explaining controls and
              workflows than at surfacing control-audit evidence, uptime commitments, or incident-rate trends. That does
              not mean the underlying controls are weak; it means the public evidence package is optimized for
              consumers, not for enterprise-style diligence. Reliability and compliance therefore deserve follow-up even
              though the day-to-day product controls look thoughtful.
            claimRefs:
              - CE014
