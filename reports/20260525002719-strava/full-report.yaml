        - Positive
        - Current
        - Supports expansion from endurance tracking into broader strength and wellness workflows
        - What share of new Strava use now comes from strength or general fitness users?
      - - Organized cycling participation resilience
        - Positive
        - Current to medium term
        - Keeps Strava's historic endurance niche healthy while broader categories expand
        - How concentrated is premium usage among cyclists versus newer cohorts?
