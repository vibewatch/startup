  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Exclusions
        blocks:
          - type: paragraph
            body: >-
              Strava's nearest market is not all digital fitness and not all wearables; it is the software layer where
              consumers log activities, compare performance, and pay for analytics or planning tools. The official
              product surfaces anchor that boundary around a subscription fitness app with social features, route
              discovery, training insights, and broad multi-sport logging. That means consumer subscription spend,
              coaching-style add-ons, and data-network features belong in scope. The same evidence also shows why
              several adjacent pools should stay outside the core market definition. Strava does not sell hardware, gym
              memberships, insurance reimbursement, or medical care. Wearables matter because they feed data into the
              app, but most device revenue belongs to adjacent ecosystem partners rather than to Strava itself.
              Likewise, Metro and the public API are real adjacencies, yet they are best treated as extensions of the
              core software and data network, not as proof that Strava participates in every enterprise or mobility-data
              category. The right boundary is therefore a social fitness and endurance-tracking platform with
              monetizable adjacencies in coaching, data access, and challenge-driven partnerships.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
