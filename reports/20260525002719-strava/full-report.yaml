      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed financial verdict is that Strava is a scaled, recurring-revenue software
              business with meaningful consumer willingness to pay, strong top-of-funnel growth, and credible adjacent
              monetization, but still insufficient public disclosure for a clean underwriting model. Subscriptions are
              clearly the dominant monetization engine, while sponsored challenges are the only clearly monetized B2B
              product disclosed with campaign economics, and Metro remains free-to-access in current official materials.
              Public sources also leave several critical private-company questions unanswered. Investors still lack
              audited revenue recognition by web versus app stores, paying-subscriber counts, plan mix, ARPU, cohort
              retention, NRR, CAC, payback, gross margin, current cash, runway, and debt terms. Even the topline is
              estimate-based: Business of Apps says $415 million of 2025 revenue, Sacra says $265 million ARR in 2023
              and places the business near $500 million ARR by 2025/2026, while Strava's own leadership release uses the
              same near-$500 million framing without the underlying bridge. That is enough to support a constructive
              stance on revenue quality and capital efficiency direction, but not enough to model normalized margin or
              downside protection. The diligence burden should therefore shift from broad market validation to precise
              financial underwriting: verify paid subscriber counts, app-store mix, gross margin after payment/platform
              fees, acquisition and retention efficiency, and the exact cash impact of 2025 acquisitions and any debt
              raised alongside them.
