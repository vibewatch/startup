  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Mass-market athletes use Strava free; premium subscribers are the economic core
        blocks:
          - type: paragraph
            body: >-
              Strava’s biggest customer truth is that most users are not direct payers. Official 2025-2026 materials
              moved the network from over 180 million users across more than 185 countries to more than 195 million
              users by April 2026, and the app-store descriptions still frame the core job as free tracking plus
              community. That matters because it means Strava’s real customer graph starts with a vast free user base
              that can later support clubs, premium conversion, brands, Metro, and developers. Paying customers sit on
              top of that graph. U.S. pricing is public and consumer-simple: $11.99 monthly or $79.99 annual for the
              individual plan, $139.99 annual for family, $39.99 annual for verified students, plus a higher-priced
              Strava+Runna bundle. Those tiers clearly prove who pays, but they do not prove how many people pay. Public
              sources in this run still do not disclose subscriber count, conversion, plan mix, or churn, so the
              freemium base is proven while payer durability remains under-disclosed.
