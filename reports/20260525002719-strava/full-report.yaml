        - Useful lower-bound comp for consumer fitness subscriptions with a well-known brand
        - >-
          Hardware, restructuring history, and a very different capital profile make it more of a floor than a direct
          peer
      - - Planet Fitness
        - FY2025 revenue about USD 1.32B
        - Public; price-to-sales about 3.21x
        - Useful consumer-fitness spending and retention reference
        - Franchise gym economics and physical-club model lack Strava's social graph and software characteristics
      - - Match Group
        - FY2025 revenue about USD 3.49B
        - Public; price-to-sales about 2.37x
        - Useful social-network and subscription reference for monetized engagement
        - Dating-market dynamics and mature growth profile differ materially from active-fitness behavior
      - - Duolingo
        - FY2025 revenue about USD 1.04B
        - Public; price-to-sales about 4.52x
        - Useful freemium consumer-subscription comp with habit formation and global scale
        - Duolingo offers cleaner disclosures and clearer monetization quality than Strava currently does
      - - Spotify
        - FY2025 revenue about 17.19B
        - Public; price-to-sales about 5.29x
        - Useful premium-scaled consumer platform with subscription and discovery behavior
        - Audio economics, ad mix, and content rights differ sharply from a fitness community app
      - - Strava last reported mark
        - Reported 2025 private valuation of USD 2.2B
        - Implied at roughly 4.4x to 5.3x ARR or revenue proxies
        - Direct price anchor for new-money underwriting discipline
        - The round included debt and public sources do not disclose the liquidation waterfall
    notes: >-
      The comp set deliberately mixes public consumer-subscription references and Strava's own last reported private
      mark. It is a corridor tool, not a claim that any one public peer is a one-for-one valuation match.
    enumerationScope:
      coverage: partial
      basis: >-
        This enumeration captures the most directly accessible public consumer-subscription and fitness comparables plus
        Strava's own latest reported private mark, but it does not include subscription-only secondary data, board
        marks, or every niche fitness app reference that a full paid-database process would add.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
