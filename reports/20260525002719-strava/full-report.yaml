      - CV037
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Hidden seniority is worse than implied
        - Debt, prefs, or ratchets materially impair common-equity upside at the 2025 mark
        - Turns a platform story into a capped-return structure
        - Reprice into the bear band or pass outright
      - - Paid conversion quality disappoints
        - Subscriber growth, churn, or gross margin fail to support premium-consumer-software multiples
        - Breaks the main argument for paying above traditional fitness comps
        - Hold recommendation at research-more or move to avoid
      - - Partner/API access degrades
        - Another Garmin-like dispute threatens upload continuity or forces user-hostile concessions
        - Weakens Strava's interoperability moat and damages engagement quality
        - Cut valuation support and demand a larger discount
      - - Trust and privacy issues recur
        - Public backlash or data-sharing missteps make users less willing to share or subscribe
        - Erodes the social graph that underpins both retention and willingness to pay
        - Treat as a multiple-compression event until trust metrics recover
      - - Exit path closes while price stays premium
        - No credible strategic, sponsor, or IPO route appears while valuation expectations remain elevated
        - Removes the premium end of the range and reduces expected MOIC
        - Underwrite only to downside-protected structures or walk away
    notes: >-
      These are kill criteria rather than generic operating risks. Each one directly changes valuation support, exit
      credibility, or the fraction of upside available to common equity.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV039
      - CV040
      - CV041
      - CV045
      - CV046
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited revenue and paid-subscriber quality
        - 2025 or trailing-twelve-month revenue, paid subscribers, churn, gross margin, and CAC payback by cohort
        - Determines whether Strava deserves a premium software multiple or only a broad consumer-fitness multiple
        - CFO data room plus board-grade operating dashboards
      - - Cap table and financing stack
        - >-
          Full debt terms, liquidation preferences, conversion mechanics, covenants, and dilution bridge for the 2025
          financing
        - Converts platform valuation into actual common-equity return math
        - Legal and finance diligence on definitive financing documents
      - - Revenue mix by product line
        - >-
          Split among core subscription, bundle attach, Metro or data products, partnerships, and any ad or sponsor
          revenue
        - Tests whether Strava has multiple durable revenue streams or is still overwhelmingly one-product economics
        - Finance diligence plus management product-revenue bridge
      - - Runna and Breakaway integration KPIs
        - Attach rates, bundle uptake, retention lift, and incremental ARPU from training products
        - Shows whether M&A is truly expanding LTV or merely broadening product surface area
        - Product and growth-team reporting pack
      - - Partner dependence and trust controls
        - Device-partner contracts, API change protocol, privacy incident log, and trust-and-safety governance metrics
        - Strava's moat depends on both data portability and willingness to share activity data
        - Legal, platform, and trust-and-safety diligence with partner references
    notes: >-
      Each diligence ask is directly tied to valuation support. If management cannot provide these materials, the
      chapter's recommendation should not be upgraded from research-more.
    claimRefs:
      - CV004
      - CV021
      - CV025
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV050
