companyProfile:
  summary: >-
    Strava is a San Francisco-based social fitness platform founded in 2009 by Michael Horvath and Mark Gainey. The
    company has evolved from a run-and-ride tracking utility into a broad social fitness network spanning more than 50
    activity types, route planning, segment competition, clubs, AI training insights, and integrations with a large
    device and developer ecosystem. Public disclosures show the platform moved from 150 million-plus athletes in 2025 to
    more than 195 million users by early 2026, while management increasingly positions the company as a premium
    subscription and training platform rather than a pure tracking app.
  foundedDate: '2009-01-01'
  founders:
    - name: Michael Horvath
      role: Co-founder
      background: Former Strava chief executive who transitioned to executive-advisor support after the 2024 CEO handoff.
      claimRefs:
        - CO002
        - CO006
    - name: Mark Gainey
      role: Co-founder
      background: Co-founded Strava with Horvath around a social and competitive fitness thesis rooted in athlete camaraderie.
