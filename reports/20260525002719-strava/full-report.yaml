  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Strava's public record is strong enough to justify investor interest and too thin to justify an aggressive
              entry price. The company has a reported $2.2 billion 2025 valuation, official language that it is
              approaching $500 million of annual recurring revenue, visible U.S. pricing at $79.99 per year, and
              user-scale disclosures that ran from more than 150 million athletes in August 2025 to more than 195
              million users in February 2026. Those facts indicate a real premium-subscription platform rather than a
              niche utility app. The problem is that the last reported mark already implies roughly 4.4x to 5.3x
              recurring revenue or revenue, depending on which public proxy an investor believes. That puts Strava much
              closer to Duolingo and Spotify than to Peloton, Match Group, or Planet Fitness, even though Strava still
              does not publicly disclose gross margin, EBITDA, free cash flow, paid-subscriber counts, churn, or the
              seniority terms of the 2025 financing that included debt. The right call at or above the last reported
              mark is research-more, not buy. Public evidence supports interest, but not a premium paid without a data
              room.
            claimRefs:
