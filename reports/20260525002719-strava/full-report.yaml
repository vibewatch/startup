      - number: '5.2'
        title: Maps, training, and social depth are the main subscription moat
        blocks:
          - type: paragraph
            body: >-
              The most differentiated first-party surfaces in the public record are routes, maps, segments, and socially
              mediated training features. On the web, Strava lets subscribers plan across 32 sports, tune routing by
              popularity, elevation, and surface, and use heatmaps, segments, and community photos to decide where to
              go. On mobile, the route builder becomes more tactical: athletes can tap points, sketch lines, or switch
              into Manual Mode when automated routing is not good enough. Subscription features then make the data worth
              returning to by layering Training Log, Fitness & Freshness, Best Efforts, personal heatmaps, and Group
              Challenges over the base activity feed. The social layer is also more substantive than simple likes.
              Clubs, leaderboards, direct or group messaging, and challenge mechanics turn progress into shared
              progress, which is why Strava remains sticky even though individual feature modules can be copied. FATMAP
              makes the maps story broader still, pushing the product further into hiking, trail, and mountain use cases
              where terrain and offline planning matter.
