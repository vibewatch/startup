      - number: '7.3'
        title: Acquisition and product-integration risk
        blocks:
          - type: paragraph
            body: >-
              Strava is now asking investors to underwrite a broader product thesis than simple run-and-ride tracking,
              and that broadening has already produced one difficult integration story plus two new ones. FATMAP's
              retirement created a clear lesson: Strava was willing to shut down a beloved specialty app before it had
              fully replaced all of the differentiated use cases that attracted serious winter users. Powder's reporting
              suggests the resulting feature gap was material for backcountry route planning and winter imagery
              workflows. Runna and The Breakaway push the company even further into coached, goal-oriented training
              rather than passive tracking. Strava's own rationale is understandable: nearly 1 billion runs were
              recorded in 2024, 43% of users targeted big races in 2025, and management wants richer training loops. But
              TechCrunch and DC Rainmaker both show that the integration path is still intentionally loose, with Runna
              remaining standalone near term and Breakaway integration not yet fully clarified. That creates execution
              risk on product coherence, pricing architecture, partner neutrality, and user trust if Strava appears to
              privilege owned training apps over the broader ecosystem.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
      - number: '7.4'
        title: Monetization, reliability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Strava's public economics are stronger than an early-stage startup narrative, but the model is still
              exposed to concentration and reliability risks. Pricing is explicit, the company claims it is approaching
              $500 million of ARR, and TechCrunch reports 50 million MAUs plus rapid download growth. The problem is
              diversification. Public evidence still points to subscriptions as the economic center of gravity, while
              sponsored challenges are campaign-based native ads largely restricted to endemic sports, wellness, and
              nutrition brands. Metro may create strategic value and civic goodwill, but both Strava and partner
              marketplaces say access is free of charge, which weakens any thesis that public-sector licensing already
              provides a major second engine. At the same time, public outage monitors show a meaningful amount of
              operational noise in 2026, with repeated issues affecting maps, feeds, settings, segment leaderboards, and
              at least one roughly 13-hour availability event. That combination matters because monetization pressure
              and reliability friction can compound: price standardization, premium-bundle upsell, and IPO preparation
              all become harder to sustain if users repeatedly feel product instability or if non-subscription revenue
              remains narrower than the headline user scale suggests.
            claimRefs:
