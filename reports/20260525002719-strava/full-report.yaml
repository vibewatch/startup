      - number: '2.2'
        title: Multiple Sizing Lenses Instead of One Headline TAM
        blocks:
          - type: paragraph
            body: >-
              The public market data is decision-useful only when the category boundary is stated plainly. App-centric
              research yields a very different answer from sports-specific or broader virtual-fitness research. The
              Business Research Company puts the 2026 fitness app market at $22.36 billion, Coherent puts the 2026
              sports and fitness apps market at $15.63 billion, and Mordor estimates the wider virtual fitness market at
              $38.81 billion. Wellness Creative Co lands even higher for app-centric fitness at $28.7 billion, while
              Grand View starts from a much lower 2025 base and slower long-term CAGR. These are not clean
              contradictions on one perfectly shared market; they are alternate lenses on adjacent, partially
              overlapping categories. The wearable base is larger still, with IDC projecting 625.2 million 2026
              shipments, but that is an enabling hardware layer rather than Strava revenue. Corporate wellness adds
              another adjacent budget pool at $72.73 billion, yet public proof of direct Strava capture is absent. The
              credible conclusion is that Strava sits inside a large and growing software market, but public sources do
              not support a precise single TAM, SAM, or SOM without management data.
