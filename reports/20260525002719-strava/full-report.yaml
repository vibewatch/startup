      - number: '7.2'
        title: Platform, API, and ecosystem dependencies
        blocks:
          - type: paragraph
            body: >-
              Strava's next major risk cluster sits in dependencies it does not fully control. Apple Health, Garmin
              Connect, and Android Health Connect are not incidental add-ons; they are the permission and sync rails
              through which a large share of user workouts reach the product. The public API is equally strategic:
              TechCrunch describes it as essential to power users, and Strava itself still sits at the center of
              hundreds of training-app integrations. That is why the late-2024 API change matters so much. DC Rainmaker
              and road.cc say Strava shut off public display of Strava data on third-party surfaces and prohibited
              AI-model uses of API data, while VeloViewer had to redesign consent handling just to stay compliant. The
              Garmin dispute sharpened this dependency further by showing how a legal and branding disagreement could
              escalate into threatened API cutoff risk. This is not a one-partner problem; it is a layered
              platform-control problem where hardware makers, operating-system owners, and Strava's own API rules all
              shape downstream customer experience. Mitigation exists in brand strength and developer scale, but
              residual exposure is still medium-high because the company cannot unilaterally guarantee the continuity of
              those external rails.
