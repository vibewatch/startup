      - number: '6.2'
        title: Clubs and community features make Strava more than a tracker
        blocks:
          - type: paragraph
            body: >-
              Community surfaces look real rather than ornamental. Strava’s support and partner documents show that
              clubs can be public or invite-only, administrator-run, and usable for feeds, leaderboards, and events. The
              2025 Year in Sport release then adds scale: over one million clubs on the network, 3.5x run-club growth,
              and 1.5x growth in club-organized events. That combination matters for customer quality. Clubs turn a
              one-person tracking app into a coordination layer for local crews, meetups, and recurring participation,
              which is exactly the kind of behavior that can keep users returning even before they subscribe. It is also
              one reason Strava looks more durable than a pure workout logger. Many apps can record a run; fewer can act
              as the social operating system for that run. The main gap is measurement depth. Public materials show
              impressive community momentum but still do not disclose club DAUs, retention by club type, or how often
              club participation converts into premium subscriptions or paid B2B outcomes.
