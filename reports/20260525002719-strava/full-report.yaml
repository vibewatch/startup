      - number: '5.5'
        title: 'Roadmap and verdict: Strava is broadening from activity network into a bundled training-and-maps platform'
        blocks:
          - type: paragraph
            body: >-
              The clearest product-tech roadmap signal is that Strava is no longer trying to grow only through
              incremental feature releases. Runna adds personalized running plans and coaching, The Breakaway adds
              cycling-specific analysis and progress tracking, and FATMAP adds 3D terrain, guides, and serious
              outdoor-planning depth. Those acquisitions are not peripheral; they are now visible in pricing, subscriber
              access, and management language about the open platform. Athlete Intelligence and the 2026
              watch-navigation and workout-recommendation updates point in the same direction: Strava wants to own more
              of the pre-workout, in-workout, and post-workout loop while remaining device-agnostic. That is
              strategically attractive because it deepens paid value without forcing Strava to manufacture hardware. The
              tradeoff is that the stack remains meaningfully dependent on acquired apps, partner devices, map data, and
              policy gates in the API layer. Underwriting-wise, the technology story is strong on workflow breadth and
              community reinforcement, moderate on platform openness, and still incomplete on public reliability and
              security assurance. The product is differentiated, but not vertically complete.
