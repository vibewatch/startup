    layout: wide
    summary: >-
      Strava layers capture, maps, social, training, and ecosystem surfaces above partner-device, map-data, and policy
      dependencies.
    data:
      layers:
        - id: l1
          label: Client surface
          detail: Mobile recording, web upload, and activity-detail pages are the athlete-facing shell.
        - id: l2
          label: Capture and ingest layer
          detail: Native phone recording plus imports from watches, head units, health apps, files, and manual entry.
        - id: l3
          label: Maps and route layer
          detail: Route builder, heatmaps, segments, map layers, and FATMAP outdoor assets drive planning and navigation.
        - id: l4
          label: Social and competition layer
          detail: Feed, clubs, messaging, group challenges, leaderboards, and Live Segments keep workouts socially relevant.
        - id: l5
          label: Training and AI layer
          detail: >-
            Training Log, Fitness & Freshness, plans, and Athlete Intelligence turn captured activity data into
            guidance.
        - id: l6
          label: Developer and partner layer
          detail: >-
            OAuth, activities API, webhooks, and partner-device integrations extend Strava beyond what the core app
            builds itself.
        - id: l7
          label: Trust and operations layer
          detail: Privacy controls, map visibility defaults, and status-page transparency support consumer trust.
    approximationNotes: >-
      The stack is assembled only from publicly documented surfaces and dependencies; it intentionally avoids
      unsupported claims about Strava’s hidden cloud or ML infrastructure.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE011
      - CE019
      - CE039
      - CE042
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      An athlete can record natively or import from a partner device, then move through analysis, social sharing, and
      route planning without leaving the Strava account.
    data:
      nodes:
        - id: capture
          label: Record on phone or watch
        - id: ingest
          label: Upload or sync into Strava
        - id: analyze
          label: View stats, segments, and training insight
        - id: social
          label: Share to feed, clubs, or messages
        - id: plan
          label: Plan next route on web or mobile
        - id: execute
          label: Follow route on phone or partner device
      edges:
        - from: capture
          to: ingest
        - from: ingest
          to: analyze
        - from: analyze
          to: social
        - from: social
          to: plan
        - from: plan
          to: execute
    approximationNotes: >-
      The flow abstracts many sport-specific variations, but each node is directly evidenced by reviewed help pages on
      recording, uploads, routes, clubs, and partner-device execution.
    claimRefs:
