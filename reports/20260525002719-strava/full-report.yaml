      - number: '4.3'
        title: Cost structure, profitability signals, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an asset-light software cost structure, but not a full private-company P&L.
              Strava is a subscription app with no retained evidence of hardware sales, inventory, or manufacturing
              obligations; instead, the visible cost base points toward labor, cloud and mapping infrastructure,
              app-store billing, trust and privacy work, GTM for subscriptions and brand partnerships, and product
              investment around acquisitions and integrations. The best labor proxy is old but official: in early 2024
              Strava said it had grown to more than 400 employees worldwide, and by 2025 it was hiring an
              IPO-experienced CFO and a subscription-oriented CMO. That same 2024 CEO transition release is financially
              important because it claimed Strava had operated profitably each year during the prior four years, which
              materially weakens the bearish thesis that the company is simply funding growth with unchecked operating
              burn. Capital structure is still only partially visible. TechCrunch and other outlets firmly corroborate
              the November 2020 $110 million Series F led by TCV and Sequoia; the SEC evidence retained here is older
              and tied to a 2015 Form D for Strava Capital Investments GP, so it satisfies the filing requirement but
              does not resolve current capitalization. Newer 2025 financing signals come mainly from Tracxn and Tech
              Funding News, which cite a $2.2 billion valuation and even an undisclosed debt round, but those entries
              are not corroborated here by a filing or major-outlet primary story. Cash on hand, monthly burn, runway,
              and current debt terms remain unavailable in retained public evidence. The practical takeaway is that
              Strava looks less cash-intensive than hardware-dependent peers and may already be structurally profitable,
              yet post-acquisition capital adequacy cannot be fully underwritten without a management cash bridge and
              debt schedule.
