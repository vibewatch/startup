      - number: '7.5'
        title: Leadership, execution, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Leadership and execution are the final binding layer across every other risk in this chapter. Strava's new
              bench is clearly more built for scale than for a founder-run niche app: the company added a
              public-company-experienced CFO and a new CMO, explicitly tied the team to subscription growth and global
              expansion, and signaled openness to more acquisitions and an eventual listing. Those choices can be
              sensible for a platform with Strava's reach, but they also tighten the margin for error. Management must
              simultaneously keep regulators comfortable on privacy and health-adjacent data, prevent partner disputes
              from degrading sync or developer trust, integrate acquired coaching products without repeating
              FATMAP-style backlash, and show that price increases or bundle expansion do not turn into churn. The
              monitorable thesis-break triggers therefore need to be operational rather than rhetorical: a renewed
              privacy scandal involving sensitive users, a material API or partner cutoff, outage frequency that stays
              elevated through peak season, evidence that Metro remains non-economic while challenge revenue is lumpy,
              or senior-leadership turnover before the current integration agenda is absorbed. Residual severity is
              medium-high because most mitigations require sustained execution rather than a one-time fix.
            claimRefs:
