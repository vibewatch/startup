  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Low, mid, and high platform-valuation bands for bear, base, and bull cases. These ranges are meant to cap entry
      price, not to predict a precise current mark.
    data:
      items:
        - label: Bear case
          low: 1000
          mid: 1200
          high: 1400
          unit: USD M
          detail: Multiple compression toward mid-tier public comps plus unresolved trust, partner, and seniority risk
        - label: Base case
          low: 1600
          mid: 1900
          high: 2200
          unit: USD M
          detail: >-
            Revenue is truly in the USD 415M to 500M zone and the stack is manageable, but disclosure still limits the
            premium
        - label: Bull case
          low: 2400
          mid: 2700
          high: 3000
          unit: USD M
          detail: >-
            Audited quality of revenue and cleaner IPO or sponsor-readiness justify premium consumer-subscription
            multiples
    approximationNotes: >-
      These are platform-valuation bands anchored to public revenue or ARR proxies and public comp ranges. They do not
      translate directly into common-equity value because the financing stack remains undisclosed.
    claimRefs:
