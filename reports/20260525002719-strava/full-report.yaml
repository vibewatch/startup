  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Strava competes against products that solve at least four adjacent jobs: tracking and sharing activities,
              following structured training, planning and navigating routes, and staying inside a hardware-owned health
              ecosystem. That makes the relevant set broader than direct social running apps. TrainingPeaks monetizes
              coaching and structured plans. Ride with GPS, Komoot, and AllTrails attack route planning, navigation, and
              offline mapping. Nike Run Club and legacy Under Armour / MapMy properties remain free or low-friction
              tracking substitutes for runners who do not need a paid social layer. Garmin, Apple, Samsung, and
              Google/Fitbit approach the same athlete from the hardware and default-app side, where software can be
              bundled with a watch, ring, phone, or larger services stack.


              Strava is responding by broadening its own offer. Its current US pricing includes a Strava + Runna bundle,
              and TechCrunch reported that Strava acquired Runna and then The Breakaway in 2025. The implication is that
              buyers can assemble a stack rather than choose a single winner: a user can keep a device ecosystem, buy a
              route planner, and still use Strava for the social layer. That reduces exclusivity pressure on every
              standalone subscription and raises the bar for durable differentiation.
            claimRefs:
