        - CO002
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Strava sells a freemium mobile and web fitness platform centered on activity tracking, social sharing, clubs,
    leaderboards, route discovery, training analysis, and premium coaching-adjacent features. Paid plans add deeper
    analytics, routes, AI athlete intelligence, family plans, and a Strava-plus-Runna bundle, while the company also
    supports Metro mobility insights and a sizable third-party API ecosystem.
  customerFocus: >-
    Consumers who run, ride, hike, and train across endurance and active-lifestyle categories, plus adjacent partners
    such as event organizers, brand marketers, public-sector mobility users through Metro, and device/app ecosystem
