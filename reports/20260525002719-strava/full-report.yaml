      - number: '5.3'
        title: Integrations and the developer ecosystem expand reach but also define the dependency surface
        blocks:
          - type: paragraph
            body: >-
              Strava’s reach depends heavily on interoperability. Garmin alone spans inbound activity sync, outbound
              route sync, and Live Segments on supported devices. Apple extends the surface through Apple Watch workout
              import, Apple Health synchronization, and the 2025 Fitness+ collaboration. WHOOP, Wahoo, and COROS show
              the same pattern: Strava does not need to own the device so long as it remains the account where the
              athlete’s history, routes, and social identity converge. The developer platform follows a similar
              philosophy, but with more gating than the consumer-facing marketing might imply. OAuth, scoped
              permissions, activity endpoints, and webhooks make third-party integrations possible, yet rate limits and
              single-player mode reveal that Strava actively curates access. The public developer signal is therefore
              real but not massive. There is a dedicated developer forum, an active Stack Overflow tag, and a GitHub
              org, but not the kind of broad open-source footprint that would make Strava look like a deeply
              externalized platform business. That is not fatal; it simply means the ecosystem is strategically
              important while still policy-constrained.
