  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Strava’s product is a broad mobile-and-web activity operating system that layers routes, maps, segments, social coordination, and training intelligence on top of hardware-agnostic activity ingest. The strongest evidence-backed differentiation is not a hidden backend architecture but the closed loop between capture, planning, community, and paid training features. Product breadth is real, but so are the dependencies: partner devices, OpenStreetMap/FATMAP map assets, API policy gates, and still-limited public disclosure on formal security and reliability commitments."
  },
  "sections": [
    {
      "id": "product-surface-and-core-workflow",
      "title": "Product surface and core athlete workflow",
      "body": "Strava is best understood as a consumer activity operating system that sits across phone, web, and partner-device workflows rather than as a single-feature running app. The reviewed support material shows that an athlete can record natively in the mobile app with live stats, route loading, Beacon, off-route alerts, and live elevation, or arrive through imports from watches, bike computers, health apps, computer files, or manual entry. That breadth matters because it lowers the switching cost for athletes who already own hardware or train in multiple sports. It also explains why the web product still matters: desktop route planning, file upload, and post-activity management remain part of the workflow even when the phone app is the daily entry point. Subscription depth expands the loop further with Training Log, Fitness & Freshness, Live Segments, and offline routes. Strava’s product is therefore not just capture, and not just social; it is the connective tissue that turns capture into planning, competition, and habit reinforcement.",
