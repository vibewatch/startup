    {
      "id": "adjacencies-and-channel-economics",
      "title": "Adjacencies, partner channels, and ecosystem monetization",
      "body": "Outside the core subscription, Strava has several public monetization adjacencies, but they differ sharply in maturity and economic clarity. Sponsored Challenges and Sponsored Segments are the clearest disclosed B2B path: Strava's business page shows a challenge flow that pushes users from a brand-sponsored goal to a reward claim on the partner's own site, and Modern Retail reports campaign pricing starts at $20,000 with economics depending on targeting, duration, and amplification. Those campaigns can generate meaningful reach \u2014 CamelBak and Hoka examples cited six-figure participation \u2014 which makes challenge sponsorship a plausible brand-marketing product even though Strava does not disclose segment revenue or gross margins. Metro looks different. Strava's official Metro site and 2026 commute-report release describe Metro as aggregated, de-identified, and free of charge for approved planners and public agencies; the report says more than 4,000 partners use the dataset. That suggests strategic value in brand, data flywheel, and civic impact, but not a currently disclosed municipal licensing line. The API is better interpreted as an ecosystem and retention channel than a paid product. Developers can access a public API, but official docs emphasize rate limits and new-app restrictions, while Strava's 2024 policy changes triggered adverse developer reaction over display and AI-training limits. Strava still says more than 100 training apps connect to its API and has acquired API-native companies like Runna, so the company seems to be monetizing around the platform rather than charging directly for API access. For GTM, that means subscriptions are the economic core, challenges are the clearest disclosed brand-sales product, Metro is strategically valuable but not obviously revenue-bearing, and the API primarily expands user utility and switching costs.",
