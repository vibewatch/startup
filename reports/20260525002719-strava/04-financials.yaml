    "number": 4,
    "title": "Financials",
    "summary": "Strava's public financial picture supports a predominantly subscription-led, asset-light software model with meaningful but still secondary monetization from sponsored brand challenges and ecosystem adjacency, while Metro currently reads more like a free civic data program than a disclosed profit center. Official pricing pages show current U.S. list prices of $11.99 monthly, $79.99 annual, $139.99 family, and $149.99 for the Strava+Runna bundle; third-party analysts estimate 2025 revenue around $415 million and 2025/2026 ARR near $500 million, with subscriptions still contributing about 90% of revenue. Capital adequacy looks better than an early-stage cash-burn story because Strava disclosed profitability through early 2024 and later hired an IPO-experienced CFO, but current cash, burn, runway, realized subscriber counts, margins, CAC, churn, and debt terms remain materially under-disclosed for underwriting."
  },
  "sections": [
    {
      "id": "subscription-model-and-traction",
      "title": "Subscription model, list pricing, and demand proxies",
      "body": "Strava's monetization center of gravity is still the consumer subscription. Official pricing and app-store surfaces show a recurring membership model rather than one-time commerce: U.S. list pricing is $11.99 per month or $79.99 per year, with a $139.99 family plan and a $149.99 Strava + Runna bundle. The support FAQ makes clear that billing is auto-renewing and that price changes are communicated at least 30 days before renewal, while the App Store confirms the same in-app purchase price points. What public sources do not show is realized net revenue per paid user, discounting, app-store mix, or subscriber count by plan. Demand quality is easier to see than monetization quality. Strava's own 2025-2026 surfaces moved from 150+ million athletes to 180+ million and then 195+ million users, while third-party app-market coverage says the platform added roughly three million users per month during 2025. Those user figures are not the same as paying subscribers, but they do support a large top-of-funnel for freemium conversion. Analyst estimates diverge on exact topline, yet they point in the same direction: Business of Apps estimates $415 million of 2025 revenue, Sacra estimated $265 million of ARR in 2023 and later described Strava as approaching $500 million ARR, and Strava's own August 2025 leadership announcement echoed the same near-$500 million framing. The underwriting implication is straightforward: list pricing is highly visible, user scale is visible enough to support growth credibility, but realized subscription economics still require management data rather than public webpages.",
