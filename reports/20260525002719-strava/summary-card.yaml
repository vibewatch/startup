  topStrengths:
    - >-
      Large global user network with 195M+ users, strong engagement signals, and a durable social graph around fitness
      identity
    - >-
      Clear premium monetization surface through subscriptions, family plans, and the Runna bundle rather than a purely
      ad-dependent model
