- id: buyers-users-payers
  title: Buyer, User, and Payer Segmentation
  body: 'For the core product, the commercial structure is simple: the individual athlete is usually the buyer, user, and payer. The pricing page and App Store listing both imply a consumer discretionary budget decision grounded in training utility, social reinforcement, and route or insight features. Public product copy also shows the user base broadening beyond classic runners and cyclists toward strength users and general fitness participants, but the buyer is still generally the same person. The map gets more interesting in the adjacencies. Coaching-bundle users represent a nearby consumer extension where the payer is still the athlete but the budget starts to look like premium training software. Brand sponsors such as Mars and PepsiCo become secondary payers when they buy challenge exposure to Strava''s community. Metro flips the model again: planners, public agencies, and researchers become the buyer or payer while residents and trail users are the indirect beneficiaries. Finally,
    in the API and sync layer, platform teams and device vendors own the integration budget even though the end athlete still experiences the relationship through Strava. Those distinctions matter because they show Strava can touch multiple budget owners without needing every adjacency to become a standalone market today.'
