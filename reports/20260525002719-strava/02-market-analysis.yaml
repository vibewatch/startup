company:
  name: Strava
chapter:
  number: 2
  title: Market Analysis
  summary: Strava's closest public market is the social fitness and activity-tracking app layer rather than all of digital fitness, but official evidence supports adjacent wedges in coaching bundles, wearables/data integrations, public-agency data products, and sponsored challenges. Public 2026 market estimates span roughly $15.6 billion to $38.8 billion for adjacent software categories, while wearables remain a much larger enabling hardware base at 625.2 million projected shipments. The core buyer is still the individual athlete, with brands, planners, and platform partners emerging as secondary payers and privacy plus platform dependence as the main adoption constraints.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Exclusions
  body: Strava's nearest market is not all digital fitness and not all wearables; it is the software layer where consumers log activities, compare performance, and pay for analytics or planning tools. The official product surfaces anchor that boundary around a subscription fitness app with social features, route discovery, training insights, and broad multi-sport logging. That means consumer subscription spend, coaching-style add-ons, and data-network features belong in scope. The same evidence also shows why several adjacent pools should stay outside the core market definition. Strava does not sell hardware, gym memberships, insurance reimbursement, or medical care. Wearables matter because they feed data into the app, but most device revenue belongs to adjacent ecosystem partners rather than to Strava itself. Likewise, Metro and the public API are real adjacencies, yet they are best treated as extensions of the core software and data network, not as proof that Strava participates in every
    enterprise or mobility-data category. The right boundary is therefore a social fitness and endurance-tracking platform with monetizable adjacencies in coaching, data access, and challenge-driven partnerships.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM011
  - CM041
