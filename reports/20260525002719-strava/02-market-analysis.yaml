- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Physical inactivity burden and public-health demand
    - Positive
    - Long term
    - Activity tracking and behavior-support tools address a durable need
    - How much of this macro demand converts into paid fitness-app behavior?
  - - CDC activity and strength guidelines
    - Positive
    - Current
    - Supports expansion from endurance tracking into broader strength and wellness workflows
    - What share of new Strava use now comes from strength or general fitness users?
  - - Organized cycling participation resilience
    - Positive
    - Current to medium term
    - Keeps Strava's historic endurance niche healthy while broader categories expand
    - How concentrated is premium usage among cyclists versus newer cohorts?
  - - Wearable-device scale and sync breadth
    - Positive
    - Current
    - Large device base widens the data funnel and lowers activity-capture friction
    - Which device partners drive the most activated users and retention?
  - - AI, analytics, and coaching bundle expansion
    - Positive
    - Current to medium term
    - Raises willingness to pay and broadens the product job from logging to guidance
    - What is bundle attach rate and retention lift versus core subscription?
  - - Brand-sponsored challenge inventory
    - Positive
    - Current
    - Creates secondary payer demand without changing the consumer user flow
    - How repeatable and scalable is sponsorship revenue?
  - - Privacy, breach, and location sensitivity
    - Negative
    - Current
    - Raises compliance cost and could reduce sharing or data-collection depth
    - How are privacy controls, consent rates, and breach processes managed?
  - - Apple and Android platform dependence
    - Negative
    - Current to medium term
    - Platform APIs and permissions affect data portability and feature velocity
    - How exposed is Strava to OS-policy changes or degraded access?
  - - Category-definition ambiguity
    - Negative
    - Current
    - Makes a precise TAM narrative fragile and easy to overstate
    - What internal market taxonomy does management use for planning?
  - - Undisclosed conversion, API intensity, and Metro customer counts
    - Negative
    - Current
    - Limits confidence in SAM, SOM, and adjacency monetization depth
    - Request subscriber, developer, and Metro disclosure pack
  notes: Drivers and constraints are evidence-backed where possible; the diligence asks identify the places where public sources stop short of underwriteable monetization detail.
