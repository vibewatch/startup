  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-gap
    missingEvidence: A bottoms-up breakdown of Strava-relevant revenue pools across paid subscribers, brand challenges, API usage, Metro, and coaching bundles.
    whyItMatters: Without a bottoms-up bridge, any single TAM or SAM claim risks overstating or understating the real monetizable market.
    diligencePath: Request management's internal segmentation of paid subscribers, attachment to Runna or coaching bundles, brand-partner revenue, and Metro coverage.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: paid-conversion
    missingEvidence: Current paid subscriber count, ARPU, and free-to-paid conversion by region or user cohort.
    whyItMatters: Consumer buyer quality and willingness to pay determine whether Strava behaves like a niche enthusiast subscription or a broader social fitness platform.
    diligencePath: Ask for cohort retention, subscriber counts, ARPU, and conversion funnels by sport, geography, and acquisition channel.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: developer-ecosystem
    missingEvidence: Current count of active developer apps, API usage intensity, and whether the ecosystem is monetized directly or only strategically.
    whyItMatters: The size and depth of the data ecosystem affects defensibility, switching costs, and the relevance of platform-dependency risk.
    diligencePath: Request API application counts, active monthly integrations, top partner categories, and any API or platform revenue disclosures.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: metro-customer-count
    missingEvidence: A public list of Metro customers, city count, contract model, or penetration by geography.
    whyItMatters: Without customer-count evidence it is hard to size Metro as a true revenue adjacency versus a strategic ecosystem program.
    diligencePath: Request Metro customer count, renewal profile, geography mix, pricing model, and examples of paid versus free public-agency usage.
    relatedQuestionRefs:
    - QM025
