- id: drivers-constraints-gaps
  title: Growth Drivers, Constraints, and Remaining Gaps
  body: 'The evidence-backed growth drivers are straightforward. WHO and CDC show durable macro demand for tools that help people move more and maintain healthy routines, while USA Cycling''s 2025 report suggests organized endurance participation remains healthy. Strava''s own product expansion into strength logging, AI-generated workout insights, and bundled coaching increases the addressable user job beyond simple GPS recording. Wearables and mobile platforms keep widening the data funnel, and brand-sponsored challenges prove that community engagement can be monetized beyond subscriptions. The main constraints are just as important. Sensitive health and location data sit under stricter platform permissions and breach-notification obligations, which raises trust and compliance costs. Apple and Android remain key intermediaries for data access and identity portability, so Strava does not fully control the technical stack. The biggest analytical gap is still sizing precision: public reports
    do not isolate a Strava-specific revenue pool or disclose the company''s conversion, developer intensity, or Metro customer base. That is why contradictory estimates should be preserved, not averaged away. This market is attractive and expanding, but the final underwriting still depends on management-only evidence about monetization depth inside each adjacency.'
