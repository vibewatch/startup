evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-gap
    missingEvidence: >-
      A board-approved financing memo or cap table update showing the exact dollar amount, instrument terms, and
      dilution of the 2025 Series G and June 2025 debt package.
    whyItMatters: Valuation without round size leaves capital efficiency, runway impact, and dilution assumptions under-specified.
    diligencePath: >-
      Request the 2025 financing deck, signed term sheet summary, and post-close cap table from management or lead
      investors.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: arr
    missingEvidence: >-
      Audited 2025 revenue, ARR, gross margin, and mix between subscriptions, bundles, and any partnership-related
      revenue.
    whyItMatters: >-
      The company says it was approaching $500M ARR, but there is no public package that lets investors test the quality
      or composition of that run rate.
    diligencePath: >-
      Request monthly recurring revenue bridge, audited management accounts, and subscriber cohort data covering
      2024-2026.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current HRIS-backed employee census by function and geography.
    whyItMatters: >-
      Third-party databases reviewed in this run disagree on workforce size, which makes operating-efficiency and
      org-capacity analysis unreliable.
    diligencePath: Request current employee count, contractor count, and a location/function split from People or Finance.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A full current board roster, committee structure, and summary of investor governance rights or protective
      provisions.
    whyItMatters: >-
      Public releases identify the CEO transition and one board addition, but they do not fully resolve who controls key
      decisions or how governance is structured.
    diligencePath: Request the board list, charter documents, investor-rights summary, and any board-observer or veto provisions.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      A company-authenticated chronology of exact dates for early product launches, privacy-remediation changes, and any
      secondary liquidity events.
    whyItMatters: >-
      The public chronology is decision-useful but still month- or year-level for several early milestones, which limits
      precision in later cross-chapter references.
    diligencePath: Ask management for an internal milestone timeline and reconcile it against press releases and financing records.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A bottoms-up breakdown of Strava-relevant revenue pools across paid subscribers, brand challenges, API usage,
      Metro, and coaching bundles.
    whyItMatters: >-
      Without a bottoms-up bridge, any single TAM or SAM claim risks overstating or understating the real monetizable
      market.
    diligencePath: >-
      Request management's internal segmentation of paid subscribers, attachment to Runna or coaching bundles,
      brand-partner revenue, and Metro coverage.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: paid-conversion
    missingEvidence: Current paid subscriber count, ARPU, and free-to-paid conversion by region or user cohort.
    whyItMatters: >-
      Consumer buyer quality and willingness to pay determine whether Strava behaves like a niche enthusiast
      subscription or a broader social fitness platform.
    diligencePath: >-
      Ask for cohort retention, subscriber counts, ARPU, and conversion funnels by sport, geography, and acquisition
      channel.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: developer-ecosystem
    missingEvidence: >-
      Current count of active developer apps, API usage intensity, and whether the ecosystem is monetized directly or
      only strategically.
    whyItMatters: >-
      The size and depth of the data ecosystem affects defensibility, switching costs, and the relevance of
      platform-dependency risk.
    diligencePath: >-
      Request API application counts, active monthly integrations, top partner categories, and any API or platform
      revenue disclosures.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: metro-customer-count
    missingEvidence: A public list of Metro customers, city count, contract model, or penetration by geography.
    whyItMatters: >-
      Without customer-count evidence it is hard to size Metro as a true revenue adjacency versus a strategic ecosystem
      program.
    diligencePath: >-
      Request Metro customer count, renewal profile, geography mix, pricing model, and examples of paid versus free
      public-agency usage.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: Strava paid subscriber count and win-loss data
    missingEvidence: >-
      Public or management-supplied data on paid subscriber count, subscriber conversion, churn, or win-loss against
      Garmin, Apple, and TrainingPeaks.
    whyItMatters: >-
      Without subscriber and win-loss evidence, it is impossible to measure whether Strava's social/data moat is
      translating into durable monetization versus merely broad awareness.
    diligencePath: >-
      Request cohort retention, paid subscriber count, and competitive win-loss analysis from management; cross-check
      with app-intelligence or payment-processor data during diligence.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: Quantified multi-homing rates across Strava and device ecosystems
    missingEvidence: >-
      Any public dataset showing how many Strava users also use Garmin Connect, Apple Watch / Fitness+, TrainingPeaks,
      or route-planning apps.
    whyItMatters: >-
      The chapter can show that multi-homing is technically easy, but not how common it is in practice. That distinction
      matters for renewal risk and margin durability.
    diligencePath: >-
      Obtain first-party survey data, app-linkage telemetry, or internal sync statistics that quantify linked-account
      overlap and paid-user stack composition.
    relatedQuestionRefs:
      - QP024
  - type: access-blocked
    severity: minor
    topic: MapMyRun MVP web pricing opacity
    missingEvidence: A clean public price page or app-store billing view for MapMyRun MVP / MapMyFitness MVP in 2026.
    whyItMatters: >-
      MapMyRun is a legacy substitute rather than a core underwriting threat, but precise public pricing would sharpen
      the low-end substitute comparison and free-versus-paid status-quo analysis.
    diligencePath: >-
      Check logged-in billing flows or app-store subscription disclosures for current MVP pricing; confirm whether web
      pricing is intentionally hidden or deprecated.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Current gross margin and net take after app-store commissions, payment processing, cloud, and support.
    whyItMatters: Without gross margin, it is impossible to judge whether current pricing supports durable profitability.
    diligencePath: >-
      Request monthly P&L by revenue stream with direct cost allocations for app stores, payment processing, cloud, and
      support.
    relatedQuestionRefs:
      - QI019
      - QI026
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency
    missingEvidence: CAC, payback, NRR, gross churn, and cohort retention by major acquisition channel and geography.
    whyItMatters: These metrics determine whether Strava's user growth translates into economically durable recurring revenue.
    diligencePath: Request a cohort deck covering acquisition spend, conversion, churn, retention, and payback for 2024-2026.
    relatedQuestionRefs:
      - QI020
      - QI026
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, runway, and any minimum-liquidity policy.
    whyItMatters: Capital adequacy cannot be underwritten without the cash bridge, regardless of historical profitability claims.
    diligencePath: Request monthly cash balances, burn, runway scenarios, and board liquidity materials.
    relatedQuestionRefs:
      - QI024
      - QI026
    relatedTableRefs:
