    {
      "id": "public-agencies-and-developers",
      "title": "Public agencies and developers clearly use Strava, but their economics are less visible than subscriptions",
      "body": "Public agencies and developers clearly use Strava, but the economics of those segments are less transparent than the consumer subscription engine. Official Metro pages say the product is free to planners and city governments, and the April 2026 commute report says more than 4,000 partners use it. GovTech adds real deployment detail through Oregon DOT, where the tool was valuable enough to buy but initially hard enough to use that Strava redesigned Metro for non-specialists. The UK government parkrun study is even more revealing: Strava data can help, but it is only a partial proxy with clear activity bias. The developer story shows the same pattern of real usage plus strategic tension. Strava says athletes upload millions of activities daily and that thousands of developers build on the API; third-party ecosystem sources push that to over 175,000 developers and say more than half of Strava’s users connect to API-powered apps. Oura proves there are live two-way integrations, but the API agreement also shows how much control Strava retains over partner behavior.",
