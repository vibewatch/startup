    {
      "id": "named-event-and-brand-deployments",
      "title": "Named deployment proof is strongest in events and endurance brands",
      "body": "Named customer proof is strongest where Strava sits closest to endurance communities. London Marathon Events used Strava routes, clubs, and creators to generate more than 34,000 uploads, 12,000 route saves, and a club of more than 45,000 members. Atlanta Track Club used the same toolkit to build an 11,000-member club and drive route-saving behavior ahead of the Peachtree Road Race, while Valencia Ciudad del Running has used Strava route embeds since 2018 and extended them into QR-coded circuits and hotel lobbies. On the brand side, the evidence shifts from community engagement into marketing performance. CamelBak’s 2025 case study reports 300,000-plus athletes reached, 1.2 million activities, and 43,000-plus leads, while Chipotle says its city challenge expanded to 25 cities after participants logged 9.25 million miles on prior segments. Hoka’s UTMB-linked Fearless Kilometre adds another real deployment. These are much stronger than logo walls because they show actual use and outcomes, but they still stop short of renewal proof or recurring contract value.",
