    {
      "id": "durability-and-risks",
      "title": "Engagement proxies are strong, but retention and concentration are under-disclosed and complaints are real",
      "body": "Durability is supported by strong habit proxies, but not by disclosed retention math. Strava’s official report says subscribers spend one active hour for every two minutes in app, and 14 billion kudos were exchanged in 2025. Consumer-review surfaces are also massive: the U.S. App Store page shows a 4.8 score from 357,000 ratings, while Google Play shows 100 million-plus downloads and invites users to join more than 180 million active people. Those are real scale and satisfaction signals. They are counterbalanced, however, by visible trust and policy frictions. Trustpilot’s archived page shows a 1.5 score with recurring complaints about surprise charges, cancellations, refunds, and support. The Independent and TrainerRoad discussions show that API restrictions can make ecosystem partners feel exposed, while Digital Trends’ 2026 reporting is a reminder that privacy posture can matter for sensitive users and institutions. Netting it out, Strava’s customer graph is broad and clearly real, but public monetization evidence still looks concentrated in premium subscriptions and campaign-style brand spend, with churn, GRR, NRR, and contract renewal data left private.",
