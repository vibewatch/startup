callouts:
- calloutType: strength
  title: Strava's most durable moat is community activity data, not raw coaching depth
  body: The strongest differentiated asset in the public source set is the Global Heatmap and the broader community activity graph behind it. Coaching, AI guidance, and route planning can be bundled or copied faster than years of aggregated activity density.
  claimRefs:
  - CP005
  - CP035
- calloutType: risk
  title: Multi-homing and hardware bundles limit pricing power
  body: Users can keep Strava while also relying on Garmin, Apple, Ride with GPS, AllTrails, or TrainingPeaks. That weakens technical lock-in and makes every renewal a direct value comparison against free-base, lower-price, or hardware-bundled substitutes.
  claimRefs:
  - CP007
  - CP030
  - CP034
  - CP036
  - CP041
