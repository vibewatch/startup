- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence / basis
  - Mitigation / diligence ask
  rows:
  - - Community activity data and Global Heatmap
    - Device ecosystems can add coaching and planning layers but cannot instantly recreate years of aggregated community activity
    - Medium
    - Dedicated Global Heatmap product signals a differentiated data asset
    - Track engagement and retention on heatmap, route, and community features
  - - Cross-device social layer
    - Multi-homing via Garmin/Wahoo/Hammerhead sync reduces exclusivity
    - High
    - Route tools explicitly send data/routes to third-party devices and coexist with other services
    - Measure how much subscriber value comes from exclusive network effects versus portable utility
  - - Current subscription pricing
    - Free-base or bundled alternatives can compress willingness to pay
    - High
    - Strava annual price matches Apple Fitness+ and sits above AllTrails Plus while Garmin base remains free
    - Test elasticity after bundle launches and annual renewals
  - - Runna bundle as coaching defense
    - Training specialists still lead on structured planning and human coaching depth
    - Medium
    - TrainingPeaks pricing remains materially deeper than a consumer-social subscription
    - Validate whether Runna bundle increases retention or only offsets churn risk
  - - Route-planning relevance
    - Komoot and Ride with GPS still specialize in maps/navigation
    - High
    - Komoot Premium and Ride with GPS route planner both emphasize planning depth and device export
    - Interview subscribers who also keep route apps to understand overlap
  - - AI coaching readiness
    - Garmin, Google, Samsung, and Peloton can ship AI layers into existing ecosystems
    - High
    - Connect+, Google Health Premium, Samsung Running Coach, and Peloton IQ all expand personalized guidance
    - Track launch cadence and whether Strava exposes comparable coaching natively
  notes: Severity is a qualitative 12-24 month underwriting view based on public product signals, pricing structures, and distribution economics. It is not a quantified win-loss model.
