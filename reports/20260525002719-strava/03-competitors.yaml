- id: incumbent-ecosystems-and-multi-homing
  title: Incumbent ecosystems, pricing umbrellas, and multi-homing
  body: |-
    Incumbent ecosystems are the most formidable distribution threat because they do not have to win users one subscription at a time. Garmin launched Garmin Connect+ in March 2025 as a premium tier with AI insights, training guidance, badge challenges, and expanded LiveTrack while explicitly keeping the existing Garmin Connect base free. Apple sells Fitness+ at $9.99 per month or $79.99 per year and cross-sells it directly from a watch lineup spanning Series, SE, and Ultra devices. Samsung Health bundles sleep coaching, running coach, and heart monitoring into the Galaxy Watch and Galaxy Ring stack, while Google Health Premium markets Gemini-based coaching and adaptive plans.

    These ecosystems also reinforce multi-homing rather than exclusivity. Ride with GPS pushes routes to Garmin, Wahoo, and Hammerhead devices, and AllTrails sends routes to Garmin. TrainingPeaks positions itself as device-agnostic and coach-centric. That means Strava often sits on top of an existing device or coaching stack instead of replacing it. The pricing umbrella reflects the same dynamic: Strava's $79.99 annual price matches Apple Fitness+, sits above AllTrails Plus at $35.99, and below TrainingPeaks Premium at $134.99, while Garmin Connect keeps a no-charge base tier. For underwriting, distribution power and bundle economics matter at least as much as product feature parity.
