- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse competitor evidence
  body: |-
    Strava still has a real moat, but it is narrower than a simple “social fitness leader” label suggests. The most defensible element in the public source set is the Global Heatmap, because it depends on years of aggregated community activity data that route planners or coaching apps cannot instantly reproduce. That asset is durable in a way that individual coaching features are not. The weaker side of the moat is monetization durability. Strava's price point sits inside a crowded field of free-base and bundled alternatives, and users can combine multiple services instead of choosing one exclusive winner.

    The adverse evidence is important. DCRainmaker's critique of Strava's price increase rollout shows that pricing changes can damage trust even when the core product remains strong. Komoot's 2025 paywall tightening is adverse evidence from the competitor side: route-planning apps are also under monetization pressure, which trains users to compare subscription value more aggressively across the category. The fact that Strava now bundles Runna is itself a strategic tell. Management is signaling that coaching depth and plan adherence belong in the same renewal decision as social activity logging. In short, Strava's moat is strongest in community data and brand position, but much weaker in route planning, coaching depth, and hardware-led distribution.
