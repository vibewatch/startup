  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Strava paid subscriber count and win-loss data
    missingEvidence: Public or management-supplied data on paid subscriber count, subscriber conversion, churn, or win-loss against Garmin, Apple, and TrainingPeaks.
    whyItMatters: Without subscriber and win-loss evidence, it is impossible to measure whether Strava's social/data moat is translating into durable monetization versus merely broad awareness.
    diligencePath: Request cohort retention, paid subscriber count, and competitive win-loss analysis from management; cross-check with app-intelligence or payment-processor data during diligence.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: Quantified multi-homing rates across Strava and device ecosystems
    missingEvidence: Any public dataset showing how many Strava users also use Garmin Connect, Apple Watch / Fitness+, TrainingPeaks, or route-planning apps.
    whyItMatters: The chapter can show that multi-homing is technically easy, but not how common it is in practice. That distinction matters for renewal risk and margin durability.
    diligencePath: Obtain first-party survey data, app-linkage telemetry, or internal sync statistics that quantify linked-account overlap and paid-user stack composition.
    relatedQuestionRefs:
    - QP024
  - type: access-blocked
    severity: minor
    topic: MapMyRun MVP web pricing opacity
    missingEvidence: A clean public price page or app-store billing view for MapMyRun MVP / MapMyFitness MVP in 2026.
    whyItMatters: MapMyRun is a legacy substitute rather than a core underwriting threat, but precise public pricing would sharpen the low-end substitute comparison and free-versus-paid status-quo analysis.
    diligencePath: Check logged-in billing flows or app-store subscription disclosures for current MVP pricing; confirm whether web pricing is intentionally hidden or deprecated.
    relatedQuestionRefs:
    - QP025
