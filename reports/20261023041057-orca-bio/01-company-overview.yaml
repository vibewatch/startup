company:
  name: Orca Bio
chapter:
  number: 1
  title: Company Overview
  summary: Orca Bio is a privately held, commercial-stage biotechnology company that has moved its precision-engineered allogeneic cell therapy from pivotal clinical development to its first U.S. approval. The strongest evidence supports a differentiated transplant product and substantial financing, while current commercial uptake, private-company financials, and the full leadership and governance picture remain incomplete.
sections:
  - id: identity-and-platform
    title: Identity, product, and operating footprint
    body: >-
      Orca Bio is headquartered in Menlo Park, California, and develops precision cell therapies for blood cancers and autoimmune disease. The company’s lead product, TREGZI, was known during development as Orca-T and is manufactured from matched-donor cells as three defined components: hematopoietic stem and progenitor cells, highly purified regulatory T cells, and conventional T cells. The product is administered in the matched-donor transplant setting rather than as a standalone outpatient biologic. Independent reporting and company materials describe the platform as a high-precision approach intended to control graft composition and reduce chronic graft-versus-host disease while preserving graft-versus-leukemia activity. Orca Bio’s dedicated manufacturing footprint and the product’s patient-specific workflow make execution capacity and logistics central parts of the company identity, not merely back-office considerations. The assigned evidence supports a U.S.-focused commercial-stage company, but does not establish a verified current employee count, revenue base, customer count, or international filing program.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder dependence
    body: >-
      Nate Fernhoff is identified in company announcements as co-founder and chief executive officer, placing a founder-led executive at the center of regulatory and commercial messaging. The Pharma Letter reports the May 2026 appointment of Bijan Nejadnik as chief medical officer, a relevant addition as the company transitions into commercial execution. An assigned company job posting also describes a Head of Business Development role reporting to the CFO or Head of Strategy and working across the C-suite, board, scientific, clinical, regulatory, manufacturing, and commercial teams; this is evidence of a needed capability, not proof that the role was filled. The public record in this pool does not provide a complete board roster, ownership table, liquidation preferences, or a fully enumerated executive bench. The resulting governance risk is concentrated execution dependence: manufacturing, regulatory compliance, clinical credibility, commercial center onboarding, and financing all need to scale together.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: funding-and-milestones
    title: Financing, approval, and unresolved scale questions
    body: >-
      The assigned sources describe a $192 million Series D in November 2019 and a $250 million Series F in January 2026, with Lightspeed Venture Partners identified as a lead investor for the recorded rounds. The same third-party profile states $300 million of total funding despite listing those two larger round amounts, so total capital raised is unresolved rather than safely inferred by addition. These are financing figures, not cash-on-hand, revenue, or runway. The company also moved through FDA priority review, a three-month review extension tied to updated chemistry, manufacturing, and controls information, and U.S. approval of TREGZI on June 30, 2026. The approval is a material milestone, but it does not establish commercial demand or realized revenue. One independent article reports a $428,000 wholesale acquisition cost and an expectation of reaching approximately 25 U.S. transplant centers by year-end 2026; those are reported launch parameters, not observed sales. The key diligence questions are current cash and burn, actual center activation and orders, payer coverage, manufacturing throughput, post-approval safety monitoring, and the economics of future pipeline expansion.
    claimRefs: [CO009, CO010, CO011, CO012, CO016]
    figureRefs: [FO001]
