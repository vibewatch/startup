callouts:
  - calloutType: strength
    title: Regulatory validation with a differentiated product
    body: "FDA approval of TREGZI, supported by randomized Precision-T results, validates Orca Bio’s defined-composition transplant approach; independent reporting cites 12-month chronic GVHD-free survival of 78% versus 38% for conventional transplant."
    claimRefs: [CO003, CO004]
  - calloutType: risk
    title: Commercial proof is still ahead
    body: "The evidence supports approval and launch planning, not realized revenue, payer coverage, center activation, or cash runway; those gaps are material for judging the company after its first approval."
    claimRefs: [CO013, CO014, CO015]
