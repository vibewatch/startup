        - id: economic-gaps
          label: "Economic gaps"
          detail: "No current mark, revenue, cash, burn, or preference data"
        - id: execution-risk
          label: "Execution and safety risk"
          detail: "Individualized manufacturing and serious labeled risks"
        - id: recommendation
          label: "Track / research-more"
          detail: "Require price, capital, and early adoption evidence"
      edges:
        - [clinical-proof, regulatory-milestone]
        - [regulatory-milestone, launch-assumptions]
        - [launch-assumptions, economic-gaps]
        - [economic-gaps, execution-risk]
        - [execution-risk, recommendation]
    claimRefs: [CV001, CV002, CV004, CV006, CV011, CV012]

callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track / research-more: the clinical and regulatory milestone is meaningful, but a current mark,
      cash runway, financing terms, realized launch demand, and payer evidence are missing.
    claimRefs: [CV001, CV002, CV011, CV014]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      A material safety or CMC issue, failure to build the planned center footprint, or financing at
      materially lower terms would break the current clinical-to-commercial thesis.
    claimRefs: [CV003, CV006, CV012, CV014]

