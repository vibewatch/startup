schemaVersion: "report-v2"
artifact: valuation
slug: orca-bio
runDate: 2026-10-23
company:
  name: Orca Bio
chapter:
  number: 8
  title: Valuation
  summary: Orca Bio has reached a meaningful commercial inflection point with TREGZI approval and strong pivotal-trial outcomes, but the assigned evidence does not disclose a current financing valuation, cash balance, revenue, or realized commercial demand. The appropriate stance is track/research-more until price, capital structure, launch economics, and early adoption are verified.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case is evidence-backed clinical differentiation rather than a proven financial
      franchise. The FDA approval announcement reports that the randomized Precision-T study enrolled
      187 patients and that 12-month chronic GVHD-free survival was 78% with TREGZI versus 38% with
      conventional alloHSCT; overall survival was 94% versus 83%. That outcome can support a premium
      product position if transplant centers, payers, and patients adopt the therapy. Independent
      coverage describes the product as a personalized, donor-derived therapy and reports a $428,000
      wholesale acquisition cost, a planned network of about 25 U.S. transplant centers by year-end
      2026, and a second manufacturing facility. These are launch inputs, not evidence of booked
      revenue, realized price, margin, or repeat demand.

      The anti-thesis is that Orca Bio has one approved product and a highly individualized,
      manufacturing-intensive delivery model. The approval source itself lists graft failure,
      GVHD, infusion reactions, secondary malignancies, and infectious-agent transmission among
      warnings and precautions. The assigned sources also do not disclose a current valuation,
      liquidation preferences, dilution, cash runway, monthly burn, reimbursement outcomes, or
      post-approval utilization. Without those inputs, a precise price-to-sales or risk-adjusted
      NPV cannot be calculated responsibly. The recommendation therefore remains track/research-more,
      with a higher-quality call contingent on cap-table and launch evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: scenarios-and-entry
    title: Scenarios and entry discipline
    body: >-
      A scenario framework is more decision-useful than a point valuation because the public record
      is strong on clinical efficacy but thin on economics. The bull case assumes the pivotal result
      translates into rapid center onboarding, payer coverage, reliable vein-to-vein manufacturing,
      and expansion beyond the initial label; the assigned independent article reports the company
      expected approximately 25 centers and first orders within weeks, but those are expectations,
      not realized observations. The base case assumes approval is followed by a measured launch
      while manufacturing, reimbursement, and center workflow constrain volume. The bear case assumes
      slow adoption, safety or CMC friction, or capital needs before commercial cash generation.

      Comparable evidence provides context but not a direct multiple. CompaniesMarketCap reports
      Legend Biotech at a $3.67 billion market capitalization on October 22, 2026, while an ACS
      Chemical & Engineering News account describes Gilead's 2017 Kite acquisition at $11.9 billion
      and notes the complexity of manufacturing individualized cell therapies. These public-company
      and M&A observations establish a range of sector outcomes, not a valuation for a private
      single-product issuer. The entry discipline is consequently to require a verified current
      mark, financing terms, cash runway, gross-margin bridge, center-level orders, payer coverage,
      and safety follow-up before underwriting a target return.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-thesis-breaks
    title: Diligence asks and thesis-break triggers
    body: >-
      The central valuation uncertainty is not whether Orca Bio has a credible clinical asset; it is
      whether the approved asset can become a repeatable, adequately financed commercial business at
      the price implied by the next financing or secondary transaction. A current mark should be
      reconciled to primary-versus-secondary proceeds and preference seniority. Commercial diligence
      should separate list price from net realized revenue and test whether transplant centers can
      operationalize donor collection, manufacturing, shipping, and infusion within the reported
      roughly 72-hour window. Financial diligence should reconcile the reported $250 million recent
      financing reference and $542 million funding total on Simplify with signed financing documents,
      cash on hand, burn, debt, and runway; these third-party listings are not audited financial
      statements.

      Thesis-break triggers are measurable: a material safety signal, a manufacturing or FDA CMC
      issue, failure to establish the planned center footprint, payer denials that prevent adoption,
      or a financing at a materially lower mark. The product's label also requires monitoring for
      graft failure and other serious complications, so post-marketing safety and real-world
      outcomes are valuation inputs rather than narrative qualifiers. Until those checks are
      completed, the evidence supports clinical promise and a watchlist position, not a buy call.
    claimRefs: [CV011, CV012, CV013, CV014]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track / research-more, "Approval and pivotal efficacy are positive; economics and current price are not disclosed", "Do not underwrite a buy without financing and launch evidence"]
      - [Confidence, medium-low, "Clinical evidence is comparatively strong but valuation inputs are sparse", "Confidence can rise with verified cap-table and commercial data"]
      - [Risk rating, high, "Single approved product, individualized manufacturing, and serious labeled risks", "Size conservatively and monitor safety, CMC, and adoption"]
      - [Valuation stance, unknown, "No current financing mark or public revenue base in assigned evidence", "Require a verified mark and downside case before entry"]
    notes: "Evidence is a 2026 public-source snapshot; unknown means the assigned sources do not disclose the input, not that the input is zero."
    claimRefs: [CV001, CV003, CV011, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Investment implication]
    rows:
      - [Clinical differentiation, "12-month cGFS 78% versus 38% in Precision-T", "Durable real-world outcomes fail to reproduce the trial result", "Supports premium positioning, subject to adoption"]
      - [Commercial launch potential, "Approval, reported $428,000 WAC, planned 25-center network", "Orders and payer coverage remain weak after launch", "Treat launch plan as an assumption until observed"]
      - [Manufacturing scalability, "Personalized donor-derived product and planned second facility", "CMC issue, delays, or inadequate throughput", "Apply a material execution discount"]
      - [Capital structure opacity, "No current mark, runway, preferences, or dilution disclosed", "Diligence provides signed terms and cash-flow bridge", "Do not use false-precision private-company multiples"]
    notes: "Rows combine observed trial facts with reported launch expectations; planned centers and price are not realized revenue or cash-flow evidence."
    claimRefs: [CV002, CV004, CV006, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Fast center onboarding, payer coverage, reliable manufacturing, and label expansion", "Premium private mark may be supportable if revenue scales faster than capital needs", "Lower than base because launch evidence is not yet observed", "Safety or CMC issue blocks scale"]
      - [Base, "Measured launch with approval benefit offset by workflow, reimbursement, and manufacturing constraints", "Track until current mark and unit economics support a risk-adjusted return", "Most defensible pending commercial data", "Orders or coverage lag the planned footprint"]
      - [Bear, "Slow adoption, serious safety signal, manufacturing friction, or near-term financing need", "Down-round or dilution risk rises; downside cannot be quantified without cap-table data", "Material possibility given single-product concentration", "Financing at materially lower terms or failed commercialization"]
      - [Required underwriting case, "Verified valuation, cash, burn, margin, orders, payer mix, and preferences", "Only then calculate risk-adjusted NPV or return target", "Unknown until diligence closes the gaps", "Any critical item remains unavailable"]
    notes: "Scenarios are qualitative because the assigned sources do not provide a current valuation, revenue base, cash balance, burn rate, or preference stack; no numeric ranges are fabricated."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV014]

