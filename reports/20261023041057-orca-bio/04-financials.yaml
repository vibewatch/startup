schemaVersion: "report-v2"
artifact: financials
slug: orca-bio
runDate: 2026-10-23
company:
  name: Orca Bio
chapter:
  number: 4
  title: Financials
  summary: >-
    Orca Bio entered commercial launch with a reported $428,000 wholesale
    acquisition cost, $250 million of new equity across its two most recent
    rounds, and up to $100 million of credit-facility liquidity. Those figures
    are not realized revenue or cash available, and the absence of disclosed
    orders, net pricing, COGS, gross margin, burn, and runway blocks financial
    underwriting of the launch.
sections:
  - id: revenue-model
    title: Revenue model and launch monetization
    body: >-
      Tregzi is Orca Bio's first commercial product and creates a one-time,
      patient-specific product-sale opportunity rather than a recurring
      subscription stream. Independent reports consistently quote a $428,000
      wholesale or wholesaler acquisition cost. Reuters reported that the
      company expected availability for orders by the end of July 2026, and
      Adam Feuerstein reported that commercial launch was underway. Neither
      statement establishes administered doses, recognized revenue, net price,
      paid claims, or cash collections. The public stream is therefore best
      modeled as one-time Tregzi product sales through qualified transplant
      centers, with partnership or licensing revenue left at zero until an
      executed agreement is produced. Pipeline programs are option value, not
      current revenue.
    claimRefs: [CI001, CI002, CI003, CI016]
    tableRefs: [TI001]
  - id: pricing-and-gtm
    title: Pricing, reimbursement, and GTM efficiency
    body: >-
      The launch motion is provider-led and operationally gated. Public reports
      describe an initial limited-center rollout and a plan to expand to about
      25 U.S. transplant centers by the end of 2026, but a center target is not
      evidence of activation, referrals, utilization, or sales efficiency. A
      reposted Orca Bio role for a Head of Business Development, reporting into
      the CFO or Head of Strategy, also points to active partnership and
      licensing work; it does not establish a commercial pipeline. Company
      statements that reimbursement pathways are in place likewise do not show
      authorization rates, negotiated reimbursement, denials, payment timing,
      or hospital economics. CAC, sales cycle, gross-to-net, and payback remain
      unavailable.
    claimRefs: [CI004, CI007, CI013, CI015]
    tableRefs: [TI002]
  - id: operating-model
    title: Cost structure and manufacturing intensity
    body: >-
      Tregzi's economics depend on a fresh, patient-specific supply chain.
      Reports describe matched-donor cells, separate cell components, and an
      approximately 72-hour interval from blood collection to infusion because
      the Tregs are not frozen. This creates labor, quality-control, logistics,
      facility-utilization, and failed-batch exposures that a wholesale price
      alone cannot resolve. The FDA's three-month review extension after an
      updated chemistry, manufacturing, and controls submission confirms that
      manufacturing evidence was material to regulatory review, although no
      additional clinical data were requested and approval followed. Public
      sources do not disclose fully loaded COGS, batch yield, failure cost,
      working capital, capex, or dose-level contribution margin.
    claimRefs: [CI005, CI006, CI011, CI016]
    figureRefs: [FI001]
  - id: capital-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      A company-issued financing announcement describes $250 million of new
      equity from Orca Bio's two most recent financing rounds plus up to $100
      million of additional liquidity from a 2025 Silicon Valley Bank
      credit-facility amendment. These are financing measures, not current cash,
      undrawn availability, or runway. Multiples separately reports $442 million
      raised across two rounds, a third-party aggregation that should not be
      substituted for management's cash ledger. Clinical results provide a
      credible value proposition, but they do not establish commercial demand
      or margin. Until Orca Bio supplies current cash, burn, debt terms, launch
      volumes, net price, and dose-level COGS, the financial verdict is a
      potentially high-value launch with material capital, reimbursement, and
      execution uncertainty.
    claimRefs: [CI008, CI009, CI010, CI012, CI014]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit, Current public value or status, Revenue quality, Diligence ask]
    rows:
      - [Tregzi U.S. product sales, One-time patient-specific therapy sale, Per administered treatment, "$428,000 wholesale acquisition cost", "List or wholesale reference; realized net revenue is unavailable", "Obtain contracts, gross-to-net waterfall, administrations, invoices, and collections"]
      - [Initial commercial launch, Orders routed through transplant centers, Per order and completed infusion, "Orders expected by end of July 2026; launch reported underway", "Forward expectation and launch status; no public order count", "Reconcile referrals, orders, manufactured doses, infusions, cancellations, and paid claims"]
      - [Center expansion, Distribution through activated transplant centers, Per active center, "About 25 U.S. centers targeted by end of 2026", "Planned footprint; not evidence of utilization or revenue", "Provide signed, activated, referring, and producing center counts"]
      - [Partnership or licensing, Potential upfront milestone or royalty economics, Per executed agreement, "Business-development remit disclosed; no transaction economics found", "Potential stream only; no public revenue evidence", "Provide executed agreements, payment triggers, obligations, and revenue-recognition policy"]
    notes: "Public evidence distinguishes list pricing and launch plans from realized revenue; unavailable fields are diligence gaps and are not treated as zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI016]
  - id: TI002
    title: Pricing and monetization
    columns: [Dimension, Public evidence, Status, Financial interpretation, Diligence ask]
    rows:
      - [Wholesale acquisition cost, "$428,000 per treatment", "Corroborated as a reported list or wholesale figure", "Starting price reference only", "Verify executed center and payer economics"]
      - [Realized net price, null, "Not disclosed", "Revenue and gross-to-net cannot be modeled", "Provide discounts, rebates, chargebacks, denials, and net collections"]
      - [Reimbursement pathway, "Company said commercial and government pathways are in place", "Company assertion reported by third parties", "Pathway availability does not prove authorization or payment", "Provide payer policies, authorization rates, and time to payment"]
      - [Provider economics proxy, "Some Medicare CAR-T cases do not cover total hospital costs", "Independent analogue; not Tregzi-specific", "Hospital economics may affect uptake but cannot be transferred directly", "Provide Tregzi center-level reimbursement and contribution models"]
      - [Payment timing and working capital, null, "Not disclosed", "Cash-conversion needs remain unknown", "Reconcile invoice date, payer approval, collection date, and bad debt"]
    notes: "The reimbursement benchmark concerns CAR-T and is presented only as a provider-economics analogue; it is not a Tregzi rate or forecast."
    claimRefs: [CI001, CI013, CI015, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Wholesale acquisition cost, "$428,000 per treatment", "High for reported list price", "Sets a gross billing reference before deductions and costs", "Verify net realized price by payer and center"]
      - [Manufacturing turnaround, "About 72 hours from collection to infusion", "High", "Constrains scheduling, logistics, capacity, and failure recovery", "Provide cycle-time distribution and service-level performance"]
      - [Manufacturing cost per dose, null, "Unavailable", "Required for product gross margin", "Provide fully loaded COGS by facility and component"]
      - [Gross margin, null, "Unavailable", "Determines whether launch revenue can fund operations", "Provide audited or management gross-margin bridge"]
      - [Monthly cash burn, null, "Unavailable", "Determines runway and next-round timing", "Provide monthly operating and investing cash-flow bridge"]
      - [Cash and runway, null, "Unavailable", "Tests capital adequacy under launch downside", "Provide current and restricted cash plus base and downside runway"]
      - [Recent equity financing, "$250M from two most recent rounds", "Medium; company-issued", "Supports launch and pipeline but is not cash on hand", "Reconcile gross proceeds, fees, spend, and remaining cash"]
      - [Credit-facility liquidity, "Up to $100M from a 2025 amendment", "Medium; company-issued", "Potential liquidity is not necessarily drawn or available", "Provide draws, remaining availability, covenants, maturity, and interest"]
      - [Commercial footprint, "About 25 centers targeted by end of 2026", "Medium; planned", "Defines a near-term distribution goal, not throughput", "Provide active centers, referrals, doses, and utilization"]
    notes: "Financing raised, credit capacity, list price, and planned footprint are distinct measures; null cost and liquidity fields are underwriting blockers, not zero values."
    claimRefs: [CI001, CI004, CI005, CI008, CI009, CI010, CI014, CI016]
figures:
  - id: FI001
    title: From eligible patient to gross profit
    type: flow
    summary: "A time-sensitive patient-specific process must clear operational and reimbursement gates before a $428,000 list-price reference can become revenue or gross profit."
    data:
      nodes:
        - id: eligible-patient
          label: Eligible matched-donor patient
          value: "Referral and clinical eligibility"
          note: "Eligible patient volume and referral conversion are not disclosed."
        - id: authorization-order
          label: Authorization and order
          value: "Payer and center approval"
          note: "Authorization, denial, and order data are not disclosed."
        - id: donor-collection
          label: Donor blood collection
          value: "Matched donor source"
          note: "Collection initiates the time-sensitive manufacturing chain."
        - id: manufacturing
          label: Patient-specific manufacturing
          value: "Purified cellular components"
          note: "COGS, yield, utilization, and failure cost are unavailable."
        - id: infusion
          label: Center infusion
          value: "Approximately 72-hour collection-to-infusion window"
          note: "Completed commercial infusions are not disclosed."
        - id: billing
          label: Gross billing reference
          value: "$428,000 wholesale acquisition cost"
          note: "This is not realized net revenue."
        - id: net-revenue
          label: Net revenue and collection
          value: "Unavailable"
          note: "Discounts, denials, payment timing, and cash collections are unknown."
        - id: gross-profit
          label: Gross profit
          value: "Unavailable"
          note: "Net revenue and fully loaded dose-level COGS are both required."
      edges:
        - [eligible-patient, authorization-order]
        - [authorization-order, donor-collection]
        - [donor-collection, manufacturing]
        - [manufacturing, infusion]
        - [infusion, billing]
        - [billing, net-revenue]
        - [net-revenue, gross-profit]
    approximationNotes: "The sequence is an analytical revenue bridge; unavailable stages are not estimated and the $428,000 figure is a reported wholesale acquisition cost."
    claimRefs: [CI001, CI005, CI006, CI015, CI016]
callouts:
  - calloutType: strength
    title: Clinical value proposition is evidenced
    body: "The pivotal study reported 78% one-year chronic-GVHD-free survival with Tregzi versus 38% to 38.4% with conventional transplantation, supporting the launch value proposition but not proving willingness to pay or net revenue."
    claimRefs: [CI012]
  - calloutType: risk
    title: Commercial financials remain unobservable
    body: "No assigned source discloses realized revenue, net price, current cash, burn, runway, gross margin, or paid commercial volume."
    claimRefs: [CI014, CI016]
  - calloutType: recommendation
    title: Require a launch-finance data room
    body: "Underwriting requires dose-level COGS, payer and center contracts, launch-cohort utilization, cash and debt schedules, monthly burn, and a downside runway model."
    claimRefs: [CI014]
