callouts:
  - calloutType: risk
    title: Approval shifts rather than eliminates risk
    body: >-
      The central diligence question is no longer whether TREGZI can obtain U.S. approval; it is
      whether Orca Bio can deliver a personalized, donor-derived product reliably, safely, and
      economically across a growing center network without a CMC, payer, or working-capital break.
    claimRefs: [CR001, CR007, CR008, CR009, CR011, CR012]
