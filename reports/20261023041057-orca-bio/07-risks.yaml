    - type: private-evidence-only
      severity: material
      topic: cybersecurity
      missingEvidence: >-
        Orca-specific cyber architecture, validated disaster-recovery results, access controls,
        vendor-risk program, material incidents, and privacy compliance evidence.
      whyItMatters: >-
        A systems or identity failure could interrupt time-sensitive manufacturing and expose
        sensitive donor, patient, or clinical data, but a sector benchmark cannot establish Orca's controls.
      diligencePath: >-
        Review SOC reports, penetration tests, incident logs, recovery exercises, IAM design,
        vendor inventory, validated-system controls, and cyber insurance.
