  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-capacity
      missingEvidence: Current unrestricted cash, monthly burn, runway, launch working-capital needs, and financing covenants.
      whyItMatters: >-
        A personalized commercial launch can consume cash before payer collections arrive, and
        funding raised is not equivalent to cash currently available.
      diligencePath: >-
        Obtain the latest management accounts, cash bridge, 24-month monthly forecast, payer
        collection assumptions, debt terms, and board-approved financing plan.
