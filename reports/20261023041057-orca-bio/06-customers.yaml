figures:
  - id: FU001
    title: Customer journey from eligibility to center expansion
    type: journey-map
    summary: "Commercial conversion requires a patient, donor, capable center, reimbursement workflow, individualized manufacture, monitored treatment, and evidence strong enough to support repeat center use."
    data:
      nodes:
        - label: Eligible patient and donor
          detail: "Adult with a covered hematologic malignancy, an eligible matched donor, and planned myeloablative transplantation."
          touchpoints: ["Referral", "Eligibility review", "Donor confirmation"]
        - label: Center clinical decision
          detail: "A transplant physician and program choose TREGZI within a high-acuity transplant episode."
          touchpoints: ["Physician evaluation", "Center protocol", "Scheduling"]
        - label: Coverage and authorization
          detail: "Hospital teams complete benefit screening, contracting, authorization, registration, coding, and billing."
          touchpoints: ["Payer review", "Authorization", "Revenue cycle"]
        - label: Patient-specific manufacture
          detail: "Matched-donor cells are collected and processed into an individualized product coordinated to transplant timing."
          touchpoints: ["Collection", "Manufacturing slot", "Chain of identity"]
        - label: Infusion and monitoring
          detail: "The center administers the transplant workflow and monitors GVHD, infection, graft failure, and other risks."
          touchpoints: ["Infusion", "Safety monitoring", "Follow-up"]
        - label: Repeat use and expansion
          detail: "Durability would appear as additional eligible-patient orders and more active centers, but neither is publicly quantified."
          touchpoints: ["Repeat orders", "Center activation", "Capacity and reimbursement"]
    approximationNotes: "The sequence describes the evidenced workflow; it does not quantify conversion rates or imply that every participating trial site is a customer."
    claimRefs: [CU002, CU003, CU007, CU013]
callouts:
  - calloutType: strength
    title: Clinical proof is stronger than commercial proof
    body: "A 187-patient randomized study across 19 treatment centers establishes a credible physician-adoption foundation, but the public record does not establish completed commercial orders, repeat use, retention, or payer performance."
    claimRefs: [CU005, CU013]
  - calloutType: risk
    title: Narrow and operationally concentrated funnel
    body: "Matched-donor eligibility, specialist-center capability, patient-specific manufacturing, authorization, and transplant follow-up create multiple conversion gates while account concentration remains unknown."
    claimRefs: [CU001, CU002, CU003, CU013]
