company:
  name: Orca Bio
chapter:
  number: 6
  title: Customers
  summary: "Orca Bio enters commercialization with a defined but narrow customer workflow: U.S. transplant centers treating eligible adults with hematologic malignancies using matched donors and myeloablative conditioning. Multicenter trial participation and strong clinical outcomes support physician interest, while paid deployments, repeat orders, reimbursement performance, retention, and customer concentration remain unverified."
sections:
  - id: customer-segments-and-workflow
    title: Customer segments and purchase workflow
    body: >-
      TREGZI is not sold into a broad, low-touch oncology market. Its initial operating
      customer is a transplant center capable of matched-donor allogeneic hematopoietic
      stem-cell transplantation, while transplant physicians select and treat patients,
      hospital teams coordinate the episode, and payers fund covered care. The labeled
      use is for adults with hematologic malignancies receiving a matched-donor transplant
      after myeloablative preparation. Because the product is manufactured for one patient
      from one matched donor, adoption requires clinical eligibility, donor collection,
      center scheduling, a manufacturing slot, infusion coordination, safety monitoring,
      benefit screening, authorization, coding, and billing. HRSA's nationwide transplant
      center inventory shows a geographically distributed addressable channel, but it does
      not identify which centers have contracted for, ordered, or infused TREGZI.
    claimRefs: [CU001, CU002, CU003, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-trajectory
    title: Adoption proof and commercial trajectory
    body: >-
      The strongest adoption-adjacent evidence is clinical rather than commercial.
      Orca's approval release reports that the randomized Precision-T study enrolled
      187 patients across 19 U.S. treatment centers, and an earlier sponsor-submitted
      registry record reports 155 actual participants across a multi-state site network.
      Those records demonstrate that specialized centers could execute Orca-T protocols,
      but trial participation is not a paid production deployment. One independent launch
      account expected first orders within weeks of the June 2026 approval and roughly
      25 U.S. transplant centers by year-end 2026. Both are forecasts, not observed order
      or active-account counts. The retained evidence provides no current denominator for
      completed commercial infusions, repeat orders, center conversion, utilization, or
      account-level revenue.
    claimRefs: [CU005, CU006, CU007, CU013, CU015]
    tableRefs: [TU002, TU003]
  - id: clinical-value-and-durability
    title: Clinical value is established before commercial durability
    body: >-
      Clinical outcomes give physicians a substantive reason to evaluate TREGZI. The
      approval evidence reports one-year overall survival of 94% versus 83% with
      conventional transplantation and GVHD-free, relapse-free survival of 63% versus
      31%. Separately, Orca's retrospective phase 1b comparison reports one-, two-, and
      three-year overall survival of 96%, 86%, and 83% among 76 TREGZI recipients versus a
      360-patient historical PTCy cohort. The retrospective design and historical control
      limit causal interpretation, and neither clinical data set measures customer renewal.
      Because TREGZI is an individualized one-time therapy, commercial durability should be
      assessed through repeat eligible-patient orders, additional active centers, payer
      approvals, manufacturing reliability, and contribution by account rather than
      subscription-style retention alone.
    claimRefs: [CU008, CU009, CU011, CU012, CU013]
  - id: expansion-and-concentration-risk
    title: Expansion and concentration risk
    body: >-
      Publicly named institutions supply clinical-reference evidence, not verified customer
      evidence. Memorial Sloan Kettering and Stanford experts appear in approval coverage,
      and UCLA appears in the long-term clinical narrative and registry site list, but none
      of those references discloses a commercial contract, a paid infusion, or repeat use.
      Expansion therefore depends on converting a finite specialist-center channel and
      sustaining patient-specific manufacturing and payer authorization. A three-month BLA
      review extension followed updated chemistry, manufacturing, and controls information;
      approval ultimately occurred, but the episode is a relevant adverse signal for launch
      diligence. Without center-level orders, payer outcomes, capacity utilization, and
      revenue concentration, investors cannot distinguish broad uptake from dependence on
      a few trial-familiar centers.
    claimRefs: [CU010, CU013, CU014, CU015, CU016]
