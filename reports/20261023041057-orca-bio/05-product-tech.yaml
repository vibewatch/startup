schemaVersion: "report-v2"
artifact: product-tech
slug: orca-bio
runDate: 2026-10-23
company:
  name: Orca Bio
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Orca Bio's lead product is now an FDA-approved, three-component, donor-derived
    cell therapy with randomized Phase 3 evidence, moving the core technology beyond
    platform-stage risk. The remaining technical underwriting burden is operational:
    public evidence does not establish batch-release performance, capacity, chain-of-
    identity controls, or realized reliability across the planned transplant-center network.
sections:
  - id: product-definition-and-maturity
    title: Product definition and maturity
    body: >-
      TREGZI is not a conventional drug or an off-the-shelf cell product. It is a
      personalized graft manufactured from an HLA-matched donor for adults with
      hematological malignancies undergoing matched-donor transplantation after
      myeloablative conditioning. The product separates the graft into hematopoietic
      stem and progenitor cells, regulatory T cells, and conventional T cells, each
      assigned a distinct role in reconstitution, immune tolerance, and graft-versus-
      leukemia activity. FDA approval on June 30, 2026 materially de-risks clinical and
      regulatory maturity for the lead asset, but it does not establish commercial-scale
      manufacturing reliability. TREGZI is Orca Bio's first approved therapy; Orca-Q
      remains a reported pipeline asset whose current trial stage is not established by
      the assigned evidence. The product matrix therefore separates approved status,
      enabling technology, cellular components, and pipeline maturity rather than treating
      the platform as one uniformly validated asset.
    claimRefs: [CE001, CE002, CE004, CE007, CE012, CE013, CE016]
    tableRefs: [TE001]
  - id: architecture-and-operating-workflow
    title: Architecture and operating workflow
    body: >-
      The operating architecture couples donor qualification, precision cell separation,
      individualized dosing, time-sensitive logistics, and staged clinical administration.
      Public descriptions place hematopoietic stem and progenitor cells and regulatory T
      cells on day 0, followed by conventional T cells on day +2 or +3. A July 2026
      independent article reported an approximately 72-hour blood-draw-to-infusion process,
      Sacramento manufacturing, and non-frozen regulatory T cells; these details are useful
      operating hypotheses, not audited service-level evidence. The workflow shifts risk
      from broad graft composition toward Orca Bio's ability to reproducibly purify, release,
      transport, and coordinate three cellular components within a specialist transplant
      setting. The public record does not disclose yield, batch-failure rate, release-test
      turnaround, shipping excursions, chain-of-identity exceptions, or center-level
      implementation time.
    claimRefs: [CE002, CE003, CE004, CE010, CE011]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: clinical-differentiation
    title: Evidence-backed differentiation
    body: >-
      The strongest differentiation is clinical rather than merely architectural. In the
      187-patient randomized Precision-T study, company-reported approval materials state
      that 12-month chronic GVHD-free survival was 78% with TREGZI plus tacrolimus versus
      38% with conventional allogeneic transplantation plus tacrolimus and methotrexate.
      The same source reported non-relapse mortality of 3% versus 13% and grade 3 or worse
      infections of 44% versus 51%. These results support the proposition that defined
      cellular composition can improve the transplant risk-benefit balance, but they should
      not be generalized beyond the approved matched-donor, myeloablative setting. A
      separate three-year overall-survival comparison was retrospective and used a registry
      cohort, so its reported 83% versus 66% result is supportive rather than equivalent to
      randomized evidence. Real-world effectiveness, center learning effects, and durability
      after launch remain unproven in the assigned public evidence.
    claimRefs: [CE005, CE006, CE007, CE014]
  - id: controls-dependencies-and-risks
    title: Controls, dependencies, and technical risks
    body: >-
      Approval leaves substantial product and process risk. Prescribing-information language
      reproduced in the company releases identifies graft failure, acute and chronic GVHD,
      infusion reactions, secondary or donor-origin malignancies, and transmission of
      infectious agents as risks requiring screening and monitoring. Manufacturing controls
      also received direct regulatory scrutiny: Orca Bio said an updated chemistry,
      manufacturing, and controls submission was classified as a major BLA amendment and
      extended review by three months, although no additional clinical data were requested.
      That episode does not prove a quality defect, but it makes current CMC readiness,
      comparability, and release discipline priority diligence items. A company-issued
      recruiting post shows active interest in licensing and partnerships to expand the
      pipeline; it is a roadmap signal, not independent technical validation. No public
      developer or practitioner evidence in the assigned pool substantiates internal
      platform reproducibility, quality-system performance, cybersecurity, privacy, or
      chain-of-identity controls.
    claimRefs: [CE008, CE009, CE015]
    tableRefs: [TE003]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - User or buyer
      - Status and maturity
      - Differentiation
      - Diligence gap
    rows:
      - - TREGZI
        - Adult transplant teams and eligible patients
        - FDA approved on 2026-06-30 for a defined matched-donor transplant setting
        - Personalized, composition-defined graft intended to improve chronic GVHD-free survival
        - Real-world utilization, center activation, on-time delivery, and batch-release performance
      - - HSPC component
        - Transplant physician and cell-processing team
        - Approved component administered on day 0
        - Intended to drive hematopoietic and immunologic reconstitution
        - Public evidence does not disclose component-level yield or release specifications
      - - Purified Treg component
        - Transplant physician and cell-processing team
        - Approved component administered on day 0
        - Intended to suppress the alloreactivity that drives GVHD
        - Public evidence does not disclose purity acceptance ranges or lot variability
      - - Conventional T-cell component
        - Transplant physician and cell-processing team
        - Approved component administered on day +2 or +3
        - Intended to accelerate immune reconstitution and preserve graft-versus-leukemia activity
        - Timing tolerance and exception-handling performance are not public
      - - OrcaSort platform
        - Orca Bio process-development and manufacturing teams
        - Company-described enabling platform; independent technical validation is limited
        - Claimed single-cell selection and purification of defined populations
        - Throughput, recovery, accuracy, automation, and failure-rate metrics are undisclosed
      - - Orca-Q
        - Clinical investigators and future transplant users
        - Third-party source describes a second-generation asset with RMAT designation
        - Potential extension of the allogeneic T-cell platform
        - Current trial stage, indication plan, and development timeline require verification
    notes: >-
      Status reflects only the assigned public evidence as of 2026-10-23; operational
      performance and pipeline fields are explicitly shown as diligence gaps rather than estimates.
    claimRefs: [CE001, CE002, CE004, CE007, CE012, CE013, CE016]
  - id: TE002
    title: TREGZI workflow and use cases
    columns:
      - User job
      - Conventional workflow
      - Orca Bio solution
      - Measurable or intended benefit
      - Limitation
    rows:
      - - Source a transplant graft
        - Collect an unmanipulated graft from a matched donor
        - Use peripheral blood from a related or unrelated HLA-matched donor
        - Preserves the matched-donor transplant pathway
        - Donor availability, screening, and collection remain prerequisites
      - - Engineer graft composition
        - Infuse a mixed donor-cell population
        - Separate and purify HSPCs, Tregs, and Tcons into defined components
        - Enables component-specific dosing and biological roles
        - Public yield, purity, release, and batch-failure metrics are unavailable
      - - Establish reconstitution and tolerance
        - Administer an unmanipulated graft with multi-agent prophylaxis
        - Infuse HSPCs and Tregs on day 0 with single-agent tacrolimus in the pivotal regimen
        - Phase 3 chronic GVHD-free survival was reported at 78% versus 38% for control at 12 months
        - Evidence is specific to the studied population, conditioning, and comparator
      - - Add conventional donor immunity
        - Deliver all graft cell types together
        - Infuse Tcons on day +2 or +3
        - Intended to support immune reconstitution and graft-versus-leukemia activity
        - Requires coordinated manufacturing, transport, and center scheduling
      - - Operate a time-sensitive supply chain
        - Center logistics vary by conventional graft process
        - Third-party reporting describes non-frozen Tregs and about 72 hours from draw to infusion
        - A short cycle may limit storage and preserve fragile cells
        - No public on-time delivery, excursion, cancellation, or recovery data
    notes: >-
      Workflow timing and manufacturing-location details come from July 2026 third-party
      reporting; the clinical endpoint values come from company approval materials and are not
      operating service levels.
    claimRefs: [CE002, CE003, CE004, CE005, CE010]
  - id: TE003
    title: Technology and operating-control architecture
    columns:
      - Layer or process
      - Role
      - Critical dependency
      - Principal risk or missing control evidence
    rows:
      - - Donor qualification and collection
        - Supply patient-specific starting material
        - Related or unrelated HLA-matched donor and infectious-disease screening
        - Donor availability, antidonor antibodies, and transmissible-agent risk
      - - Cell selection and purification
        - Create defined HSPC, Treg, and Tcon populations
        - OrcaSort process, assays, trained operators, and suitable starting material
        - No public recovery, purity, repeatability, or batch-failure data
      - - Product release and logistics
        - Release and move individualized components to the transplant center
        - Quality-control turnaround, chain of identity, cold chain, and scheduling
        - No public excursion, delay, cancellation, or on-time-delivery metrics
      - - Clinical administration
        - Sequence day-0 and day +2/+3 components
        - Myeloablative conditioning, tacrolimus, and experienced transplant centers
        - Infusion reactions, graft failure, GVHD, and protocol-deviation risk
      - - Long-term surveillance
        - Detect delayed safety events
        - Clinical monitoring and infectious-agent or malignancy testing
        - Secondary or donor-origin malignancies and infectious transmission
      - - Regulatory and quality system
        - Maintain licensed-process control and comparability
        - Current CMC package, validated changes, and release discipline
        - A 2026 major CMC amendment delayed review; current control metrics remain private
    notes: >-
      This architecture distinguishes disclosed dependencies from missing controls; a listed
      risk is not evidence that an incident occurred.
    claimRefs: [CE002, CE003, CE008, CE009, CE010]
figures:
  - id: FE001
    title: TREGZI product and administration stack
    type: stack
    summary: >-
      The therapy combines precision-separated donor-cell populations with staged administration
      and specialist monitoring rather than functioning as a single undifferentiated graft.
    data:
      layers:
        - label: Matched-donor input
          detail: Donor-derived starting material for the individualized graft.
          items:
            - Peripheral blood from a related or unrelated HLA-matched donor
        - label: Precision separation
          detail: Separation of the defined cellular populations.
          items:
            - Hematopoietic stem and progenitor cells
            - Highly purified regulatory T cells
            - Conventional T cells
        - label: Individualized product
          detail: Patient-specific cellular components prepared for administration.
          items:
            - Patient-specific, separately dosed cellular components
        - label: Day 0 administration
          detail: Initial administration of the stem and regulatory T-cell components.
          items:
            - HSPCs for hematopoietic reconstitution
            - Tregs for immune tolerance and GVHD suppression
        - label: Day +2 or +3 administration
          detail: Follow-on administration of conventional donor T cells.
          items:
            - Tcons for immune reconstitution and graft-versus-leukemia activity
        - label: Clinical controls
          detail: Prophylaxis and monitoring across treatment and follow-up.
          items:
            - Tacrolimus prophylaxis
            - Engraftment, GVHD, infection, infusion, and malignancy monitoring
    approximationNotes: >-
      Layer order reflects the disclosed product workflow; it does not represent manufacturing
      duration, component quantity, capacity, or relative risk.
    claimRefs: [CE002, CE003, CE004, CE007, CE008]
callouts:
  - calloutType: strength
    title: Lead-product risk has shifted from approval to execution
    body: >-
      Randomized Phase 3 evidence and FDA approval validate the lead product's defined clinical
      use, while commercial manufacturing and delivery reliability remain unverified publicly.
    claimRefs: [CE001, CE005, CE013]
  - calloutType: risk
    title: A precise graft creates a precise operating burden
    body: >-
      The differentiated biology depends on reproducible separation, release, transport, staged
      infusion, and long-term monitoring; public materials do not quantify those process controls.
    claimRefs: [CE002, CE003, CE008, CE009, CE010]
