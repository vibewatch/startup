  evidenceGaps:
    - type: missing-source
      severity: material
      topic: deployment
      missingEvidence: >-
        Actual activated-center count, first commercial orders, on-time delivery, cancellations,
        and center-level implementation performance after approval.
      whyItMatters: >-
        Announced rollout targets do not establish that a time-sensitive individualized product
        can be delivered reliably across a distributed transplant network.
      diligencePath: >-
        Request a center roster and monthly launch dashboard with orders, successful infusions,
        turnaround times, deviations, cancellations, and root-cause categories.
      relatedQuestionRefs: [QE004]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-quality
      missingEvidence: >-
        Batch yield, failure rate, cell recovery and purity specifications, release-test
        turnaround, comparability data, capacity, and shipping-excursion performance.
      whyItMatters: >-
        Product differentiation depends on reproducible separation and delivery of three
        defined cellular components, making process variance a direct clinical and commercial risk.
      diligencePath: >-
        Review CMC summaries, validation reports, continued-process-verification trends,
        deviation and CAPA logs, lot-release data, and site-capacity models under confidentiality.
      relatedQuestionRefs: [QE009]
    - type: missing-source
      severity: material
      topic: practitioner-validation
      missingEvidence: >-
        Independent practitioner or technical evidence on OrcaSort reproducibility, operator
        burden, center integration, and performance outside company-sponsored materials.
      whyItMatters: >-
        The assigned pool contains no substantive public developer surface or practitioner
        validation of the manufacturing platform's implementation quality.
      diligencePath: >-
        Interview independent transplant-center cell-processing leaders and request blinded
        center-level implementation, deviation, and turnaround data.
      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: material
      topic: security-and-chain-of-identity
      missingEvidence: >-
        Cybersecurity, privacy, electronic batch-record, chain-of-identity, disaster-recovery,
        and third-party logistics control evidence.
      whyItMatters: >-
        A patient-specific living-cell product depends on correct identity, protected clinical
        data, and uninterrupted coordination across donor, manufacturer, shipper, and center.
      diligencePath: >-
        Review security assessments, privacy controls, chain-of-identity validation, business-
        continuity tests, vendor qualification, and incident history under confidentiality.
      relatedQuestionRefs: [QE009]
