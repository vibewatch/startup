companyProfile:
  summary: >-
    Orca Bio develops precision allogeneic cell therapies for blood cancers and autoimmune disease. Its lead product,
    TREGZI, uses matched-donor hematopoietic stem and progenitor cells, regulatory T cells, and conventional T cells in
    a sequentially administered graft for adults undergoing matched-donor transplantation.
