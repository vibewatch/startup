callouts:
  - calloutType: insight
    title: Clinical value is clearer than market size
    body: The pivotal trial and FDA summaries establish a differentiated clinical outcome, but the assigned evidence does not establish how many eligible patients will be treated or what net price will be realized.
    claimRefs: [CM015, CM016]
  - calloutType: risk
    title: Launch execution is part of the market
    body: Center onboarding, donor-cell logistics, manufacturing capacity, and payer policy determine whether a narrow label converts into recurring treatment volume.
    claimRefs: [CM010, CM011, CM012, CM013]
