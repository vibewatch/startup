  evidenceGaps:
    - type: missing-source
      severity: material
      topic: addressable-market-sizing
      missingEvidence: Public counts of U.S. adults meeting Tregzi's exact matched-donor, myeloablative, hematologic-malignancy label criteria and their annual transplant-center distribution.
      whyItMatters: Broad GVHD-treatment estimates mix prevention, treatment, acute and chronic disease, and modalities, so they cannot establish Orca's SAM or SOM.
      diligencePath: Request a label-constrained patient funnel by disease, donor type, conditioning regimen, geography, and center from Orca or an independent transplant registry analysis.
      relatedQuestionRefs: [QM002, QM003]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: adoption
      missingEvidence: Actual post-approval center activations, orders, treated patients, payer approvals, and net realized price.
      whyItMatters: The announced launch footprint is a plan, not evidence of commercial utilization or revenue conversion.
      diligencePath: Obtain monthly launch KPIs, payer mix, order-to-infusion conversion, manufacturing success rate, and center-level reorder data.
      relatedQuestionRefs: [QM004, QM005]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: reimbursement
      missingEvidence: Coverage and payment policy decisions for Tregzi across Medicare, Medicaid, and major commercial plans.
      whyItMatters: A $428,000 WAC and hospital-based administration create a financing and access bottleneck even if clinical demand is strong.
      diligencePath: Collect payer medical policies, negotiated coverage terms, prior-authorization outcomes, and any outcomes-based agreement terms.
      relatedQuestionRefs: [QM005, QM006]
    - type: conflicting-data
      severity: minor
      topic: market-estimates
      missingEvidence: A reconciled methodology for the different 2026 global GVHD-treatment estimates and their inclusion of prevention versus treatment.
      whyItMatters: The reported $3.2B and $3.32B figures have different horizons and methodology disclosures and should not be presented as Orca-specific market size.
      diligencePath: Obtain full methodology appendices and rebuild a label-constrained bottom-up model using registry volumes and eligible patient shares.
      relatedQuestionRefs: [QM002, QM007]
      relatedTableRefs: [TM002]
