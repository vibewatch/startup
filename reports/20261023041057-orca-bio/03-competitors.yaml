  - id: TP002
    title: Product and pricing comparison
    columns: [Product or pathway, Population / indication, Product or regimen, Public price signal, Competitive implication]
    rows:
      - [TREGZI / Orca-T, Adults with hematologic malignancies receiving matched-donor alloHCT, "Purified HSPCs, Tregs, and conventional T cells from a matched donor", "$428,000 wholesale acquisition cost reported by Life Science Daily; realized price unknown", "One-time precision graft with a narrow initial label and a reported approximately 72-hour donor-to-infusion window."]
      - [Ryoncil / remestemcel-L, Pediatric patients at least 2 months old with steroid-refractory acute GVHD, "Off-the-shelf allogeneic mesenchymal stromal cells; eight infusions", "$1,550,000 estimated wholesale acquisition cost in Summit Re article", "Competes for specialist and payer attention in GVHD, but not for the same first-line adult transplant use."]
      - [Omisirge / omidubicel-onlv, Hematologic malignancies after cord-blood transplant or severe aplastic anemia, "NAM-modified cord-blood progenitor cells; single infusion with cultured and non-cultured fractions", "Not reported in assigned source", "Adjacent cell-therapy precedent with different donor source, workflow, and endpoint."]
      - [PTCy plus prophylaxis, Allogeneic transplant recipients in the studied setting, "Post-transplant cyclophosphamide-based GVHD prophylaxis", "Not reported in assigned source", "Potentially lower-complexity regimen alternative; relative total cost versus TREGZI is unverified."]
    notes: "Prices are reported wholesale acquisition cost or estimate, not net sales, reimbursement, cash cost, or margin. No price was inferred for products where the assigned sources were silent."
    claimRefs: [CP004, CP005, CP006, CP007, CP008]
  - id: TP003
    title: Capability and differentiation matrix
    columns: [Buying criterion, TREGZI / Orca-T, Conventional alloHCT, PTCy pathway, Ryoncil / Omisirge adjacencies]
    rows:
      - [Randomized comparator evidence, "Phase 3 randomized open-label multicenter record; 187 actual participants", "Direct standard-of-care comparator in Precision-T", "Randomized evidence versus tacrolimus-methotrexate cited by EBMT, not versus TREGZI", "Different indications and trials; no apples-to-apples comparison in assigned pool"]
      - [Cell or graft engineering, "Purified HSPCs, Tregs, and Tcons from a matched donor", "Unmanipulated donor allograft", "Pharmacologic prophylaxis rather than a precision graft", "Ryoncil: mesenchymal stromal cells; Omisirge: NAM-modified cord-blood progenitor cells"]
      - [Workflow and manufacturing burden, "Dedicated manufacturing; approximately 72 hours from blood draw to infusion reported", "Existing transplant workflow", "Regimen-based workflow; product manufacturing burden not quantified here", "Ryoncil is off-the-shelf; Omisirge uses cultured and non-cultured fractions"]
      - [Initial label fit, "Adults with hematologic malignancies receiving matched-donor alloHCT", "Broad transplant comparator population within the same clinical pathway", "Setting depends on donor and conditioning context", "Ryoncil is pediatric steroid-refractory acute GVHD; Omisirge is cord-blood transplant / severe aplastic anemia"]
      - [Commercial evidence, "FDA approval and reported wholesale acquisition cost; launch volume and payer coverage unknown", "Established standard pathway; market share not quantified", "Established clinical alternative; comparative economics unknown", "Approved products with different labels; comparative adoption and realized prices unknown"]
      - [Risk / trust posture, "Label includes graft failure, GVHD, infusion reactions, secondary malignancies, and infectious-agent transmission warnings", "Known transplant and GVHD risks", "EBMT reports improved outcomes in a studied setting but not TREGZI comparison", "Omisirge label includes boxed warnings; Ryoncil evidence includes serious infections among common adverse effects"]
    notes: "Cells marked unknown reflect unavailable comparable evidence in the assigned pool, not a claim that the capability or risk is absent."
    claimRefs: [CP001, CP002, CP005, CP009, CP011, CP013]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "An ordinal map separates clinical differentiation from operational displacement risk; coordinates are analytical scores anchored to the cited evidence."
    data:
      xAxis: "Clinical differentiation versus the incumbent transplant pathway"
      yAxis: "Operational / commercial displacement risk"
      points:
        - label: TREGZI / Orca-T
          x: 4
          y: 4
          note: "Randomized evidence and engineered graft design support differentiation; manufacturing, workflow, and launch evidence create risk."
        - label: Conventional alloHCT
          x: 1
          y: 1
          note: "Incumbent comparator with established workflow; no new precision differentiation asserted."
        - label: PTCy pathway
          x: 2
          y: 2
          note: "Randomized evidence versus tacrolimus-methotrexate supports a competing prophylaxis pathway."
        - label: Ryoncil
          x: 2
          y: 3
          note: "Approved cell therapy with a distinct pediatric acute-GVHD label; commercial and indication adjacency create limited direct overlap."
        - label: Omisirge
          x: 2
          y: 3
          note: "Approved cell therapy with different cord-blood and aplastic-anemia indications; boxed warnings and workflow differences remain relevant."
        - label: Internal workflow / supportive care
          x: 1
          y: 2
          note: "Existing center protocols remain a substitute when a center does not adopt a precision graft; labor and total-cost tradeoffs are unquantified."
    claimRefs: [CP002, CP009, CP010, CP011, CP013]
callouts:
  - calloutType: strength
    title: Clinical differentiation is real but bounded
    body: "The randomized Precision-T design and the 78% versus 38% one-year chronic-GVHD-free survival result distinguish TREGZI from the conventional graft, but they do not establish superiority against PTCy or all adjacent products."
    claimRefs: [CP001, CP009]
  - calloutType: risk
    title: Workflow and commercial proof are the moat test
    body: "The public record supports a technically differentiated product, yet it does not disclose center onboarding, payer coverage, realized net price, launch volume, or contribution margin; those unknowns leave room for incumbent protocols and adjacent products to retain share."
    claimRefs: [CP007, CP008, CP011, CP012]
