chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Orca Bio is headquartered in Menlo Park, California, and develops precision cell therapies for blood
              cancers and autoimmune disease. The company’s lead product, TREGZI, was known during development as Orca-T
              and is manufactured from matched-donor cells as three defined components: hematopoietic stem and
              progenitor cells, highly purified regulatory T cells, and conventional T cells. The product is
              administered in the matched-donor transplant setting rather than as a standalone outpatient biologic.
              Independent reporting and company materials describe the platform as a high-precision approach intended to
              control graft composition and reduce chronic graft-versus-host disease while preserving
              graft-versus-leukemia activity. Orca Bio’s dedicated manufacturing footprint and the product’s
              patient-specific workflow make execution capacity and logistics central parts of the company identity, not
              merely back-office considerations. The assigned evidence supports a U.S.-focused commercial-stage company,
              but does not establish a verified current employee count, revenue base, customer count, or international
              filing program.
