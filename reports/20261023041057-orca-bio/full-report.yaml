  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              TREGZI is not a conventional drug or an off-the-shelf cell product. It is a personalized graft
              manufactured from an HLA-matched donor for adults with hematological malignancies undergoing matched-donor
              transplantation after myeloablative conditioning. The product separates the graft into hematopoietic stem
              and progenitor cells, regulatory T cells, and conventional T cells, each assigned a distinct role in
              reconstitution, immune tolerance, and graft-versus- leukemia activity. FDA approval on June 30, 2026
              materially de-risks clinical and regulatory maturity for the lead asset, but it does not establish
              commercial-scale manufacturing reliability. TREGZI is Orca Bio's first approved therapy; Orca-Q remains a
              reported pipeline asset whose current trial stage is not established by the assigned evidence. The product
              matrix therefore separates approved status, enabling technology, cellular components, and pipeline
              maturity rather than treating the platform as one uniformly validated asset.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE012
              - CE013
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE012
              - CE013
              - CE016
      - number: '5.2'
        title: Architecture and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The operating architecture couples donor qualification, precision cell separation, individualized dosing,
              time-sensitive logistics, and staged clinical administration. Public descriptions place hematopoietic stem
              and progenitor cells and regulatory T cells on day 0, followed by conventional T cells on day +2 or +3. A
              July 2026 independent article reported an approximately 72-hour blood-draw-to-infusion process, Sacramento
              manufacturing, and non-frozen regulatory T cells; these details are useful operating hypotheses, not
              audited service-level evidence. The workflow shifts risk from broad graft composition toward Orca Bio's
              ability to reproducibly purify, release, transport, and coordinate three cellular components within a
              specialist transplant setting. The public record does not disclose yield, batch-failure rate, release-test
              turnaround, shipping excursions, chain-of-identity exceptions, or center-level implementation time.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
      - number: '5.3'
        title: Evidence-backed differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is clinical rather than merely architectural. In the 187-patient randomized
              Precision-T study, company-reported approval materials state that 12-month chronic GVHD-free survival was
              78% with TREGZI plus tacrolimus versus 38% with conventional allogeneic transplantation plus tacrolimus
              and methotrexate. The same source reported non-relapse mortality of 3% versus 13% and grade 3 or worse
              infections of 44% versus 51%. These results support the proposition that defined cellular composition can
              improve the transplant risk-benefit balance, but they should not be generalized beyond the approved
              matched-donor, myeloablative setting. A separate three-year overall-survival comparison was retrospective
              and used a registry cohort, so its reported 83% versus 66% result is supportive rather than equivalent to
              randomized evidence. Real-world effectiveness, center learning effects, and durability after launch remain
              unproven in the assigned public evidence.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE014
      - number: '5.4'
        title: Controls, dependencies, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Approval leaves substantial product and process risk. Prescribing-information language reproduced in the
              company releases identifies graft failure, acute and chronic GVHD, infusion reactions, secondary or
              donor-origin malignancies, and transmission of infectious agents as risks requiring screening and
              monitoring. Manufacturing controls also received direct regulatory scrutiny: Orca Bio said an updated
              chemistry, manufacturing, and controls submission was classified as a major BLA amendment and extended
              review by three months, although no additional clinical data were requested. That episode does not prove a
              quality defect, but it makes current CMC readiness, comparability, and release discipline priority
              diligence items. A company-issued recruiting post shows active interest in licensing and partnerships to
              expand the pipeline; it is a roadmap signal, not independent technical validation. No public developer or
              practitioner evidence in the assigned pool substantiates internal platform reproducibility, quality-system
              performance, cybersecurity, privacy, or chain-of-identity controls.
            claimRefs:
              - CE008
              - CE009
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Lead-product risk has shifted from approval to execution
            body: >-
              Randomized Phase 3 evidence and FDA approval validate the lead product's defined clinical use, while
              commercial manufacturing and delivery reliability remain unverified publicly.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE013
          - type: callout
            title: A precise graft creates a precise operating burden
            body: >-
              The differentiated biology depends on reproducible separation, release, transport, staged infusion, and
              long-term monitoring; public materials do not quantify those process controls.
            calloutType: risk
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and purchase workflow
        blocks:
          - type: paragraph
            body: >-
              TREGZI is not sold into a broad, low-touch oncology market. Its initial operating customer is a transplant
              center capable of matched-donor allogeneic hematopoietic stem-cell transplantation, while transplant
              physicians select and treat patients, hospital teams coordinate the episode, and payers fund covered care.
              The labeled use is for adults with hematologic malignancies receiving a matched-donor transplant after
              myeloablative preparation. Because the product is manufactured for one patient from one matched donor,
              adoption requires clinical eligibility, donor collection, center scheduling, a manufacturing slot,
              infusion coordination, safety monitoring, benefit screening, authorization, coding, and billing. HRSA's
              nationwide transplant center inventory shows a geographically distributed addressable channel, but it does
              not identify which centers have contracted for, ordered, or infused TREGZI.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU013
      - number: '6.2'
        title: Adoption proof and commercial trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption-adjacent evidence is clinical rather than commercial. Orca's approval release
              reports that the randomized Precision-T study enrolled 187 patients across 19 U.S. treatment centers, and
              an earlier sponsor-submitted registry record reports 155 actual participants across a multi-state site
              network. Those records demonstrate that specialized centers could execute Orca-T protocols, but trial
              participation is not a paid production deployment. One independent launch account expected first orders
              within weeks of the June 2026 approval and roughly 25 U.S. transplant centers by year-end 2026. Both are
              forecasts, not observed order or active-account counts. The retained evidence provides no current
              denominator for completed commercial infusions, repeat orders, center conversion, utilization, or
              account-level revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU015
              - CU016
      - number: '6.3'
        title: Clinical value is established before commercial durability
        blocks:
          - type: paragraph
            body: >-
              Clinical outcomes give physicians a substantive reason to evaluate TREGZI. The approval evidence reports
              one-year overall survival of 94% versus 83% with conventional transplantation and GVHD-free, relapse-free
              survival of 63% versus 31%. Separately, Orca's retrospective phase 1b comparison reports one-, two-, and
              three-year overall survival of 96%, 86%, and 83% among 76 TREGZI recipients versus a 360-patient
              historical PTCy cohort. The retrospective design and historical control limit causal interpretation, and
              neither clinical data set measures customer renewal. Because TREGZI is an individualized one-time therapy,
              commercial durability should be assessed through repeat eligible-patient orders, additional active
              centers, payer approvals, manufacturing reliability, and contribution by account rather than
              subscription-style retention alone.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Publicly named institutions supply clinical-reference evidence, not verified customer evidence. Memorial
              Sloan Kettering and Stanford experts appear in approval coverage, and UCLA appears in the long-term
              clinical narrative and registry site list, but none of those references discloses a commercial contract, a
              paid infusion, or repeat use. Expansion therefore depends on converting a finite specialist-center channel
              and sustaining patient-specific manufacturing and payer authorization. A three-month BLA review extension
              followed updated chemistry, manufacturing, and controls information; approval ultimately occurred, but the
              episode is a relevant adverse signal for launch diligence. Without center-level orders, payer outcomes,
              capacity utilization, and revenue concentration, investors cannot distinguish broad uptake from dependence
              on a few trial-familiar centers.
            claimRefs:
              - CU010
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical proof is stronger than commercial proof
            body: >-
              A 187-patient randomized study across 19 treatment centers establishes a credible physician-adoption
              foundation, but the public record does not establish completed commercial orders, repeat use, retention,
              or payer performance.
            calloutType: strength
            claimRefs:
              - CU005
              - CU013
          - type: callout
            title: Narrow and operationally concentrated funnel
            body: >-
              Matched-donor eligibility, specialist-center capability, patient-specific manufacturing, authorization,
              and transplant follow-up create multiple conversion gates while account concentration remains unknown.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and patient-safety exposure
        blocks:
          - type: paragraph
            body: >-
              FDA approval is a major de-risking event, but it is not a clean safety or compliance endpoint. TREGZI is
              approved only for matched-donor transplantation with myeloablative preparation in adults with
              hematological malignancies, and the published safety language identifies graft failure, life-threatening
              or fatal acute and chronic GVHD, serious infusion reactions, secondary or donor-origin malignancies, and
              transmission of infectious agents. These are clinically consequential hazards embedded in the product
              category rather than isolated historical incidents. The earlier three-month review extension after a major
              CMC amendment is resolved by approval, yet it demonstrates that manufacturing documentation can affect
              regulatory timing. Broader FDA flexibility for cell and gene therapy CMC requirements may reduce some
              process burden, but it does not remove product-specific release, comparability, pharmacovigilance, or
              change-control obligations. No exhaustive regulator, court, or enforcement search is available in the
              assigned evidence, so the absence of another recorded event must not be read as proof that none exists.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.2'
        title: Manufacturing, quality, and security control
        blocks:
          - type: paragraph
            body: >-
              TREGZI is not a conventional inventory product: it is manufactured for an individual patient from a
              matched donor and delivered as defined cellular components. Independent reporting says the unfrozen Treg
              component creates an approximately 72-hour blood-draw-to-infusion window, concentrating risk in donor
              coordination, collection, sorting, release testing, transport, and treatment-center scheduling. A
              third-party analysis reports Orca's low-single-digit failure rate across more than 500 clinical products,
              a useful historical benchmark but not yet evidence of commercial-scale performance. FACT standards show
              that cellular therapy quality spans collection, processing, and administration, so diligence cannot stop
              at Orca's plant. Digital operations add another layer: KPMG identifies availability, integrity,
              confidentiality, identity, and third-party risks across life sciences. The assigned evidence does not
              establish Orca's own cyber architecture, recovery objectives, validation controls, or incident history;
              those remain diligence items rather than inferred strengths.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
              - CR015
      - number: '7.3'
        title: Commercialization and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The initial commercial model depends on a narrow, specialized network rather than broad prescribing.
              Independent reporting describes a target of roughly 25 U.S. transplant centers by the end of 2026 and a
              reported wholesale acquisition cost of $428,000. Both metrics are planning signals, not realized adoption
              or net revenue. Each activated center must coordinate a matched donor, apheresis, a personalized
              three-component product, conditioning, infusion, monitoring, and payer authorization. The most important
              dependency is therefore the full donor-manufacturer-center-payer chain: failure at any link can delay
              treatment even when demand exists. The labeled indication also constrains the initial population to adults
              receiving matched-donor, myeloablative transplants. Payer policy, discounting, time to first commercial
              order, center throughput, and net collections are not established by the assigned sources. Funding raised
              or financing announcements would not answer the separate questions of cash on hand, burn, runway, or the
              capital required to support a national launch.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The appropriate underwriting posture is milestone-based. Patient-safety mitigation should be tested
              through postmarketing event rates, engraftment monitoring, donor screening, infusion readiness, and
              long-horizon malignancy surveillance. Manufacturing mitigation should be measured through lot disposition,
              on-time delivery, chain-of-identity deviations, center-level cancellations, and performance by facility
              and lane; the reported low-single-digit clinical failure rate is the starting benchmark, not a guaranteed
              commercial ceiling. Commercial mitigation should be tracked against active treating centers rather than
              signed sites, with payer coverage, prior-authorization cycle time, gross-to-net deductions, and patient
              starts disclosed separately. Analyst-defined thesis-break triggers include a sustained material
              deterioration from the reported clinical manufacturing record, failure to activate a meaningful share of
              the stated 25-center plan by year-end, restrictive coverage that prevents eligible patient starts, a
              serious emerging safety signal, or a CMC action that interrupts supply. Cash, runway, cyber controls, and
              concentration by facility, payer, and center require primary diligence before investment sizing.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Approval shifts rather than eliminates risk
            body: >-
              The central diligence question is no longer whether TREGZI can obtain U.S. approval; it is whether Orca
              Bio can deliver a personalized, donor-derived product reliably, safely, and economically across a growing
              center network without a CMC, payer, or working-capital break.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is evidence-backed clinical differentiation rather than a proven financial franchise.
              The FDA approval announcement reports that the randomized Precision-T study enrolled 187 patients and that
              12-month chronic GVHD-free survival was 78% with TREGZI versus 38% with conventional alloHSCT; overall
              survival was 94% versus 83%. That outcome can support a premium product position if transplant centers,
              payers, and patients adopt the therapy. Independent coverage describes the product as a personalized,
              donor-derived therapy and reports a $428,000 wholesale acquisition cost, a planned network of about 25
              U.S. transplant centers by year-end 2026, and a second manufacturing facility. These are launch inputs,
              not evidence of booked revenue, realized price, margin, or repeat demand.

              The anti-thesis is that Orca Bio has one approved product and a highly individualized,
              manufacturing-intensive delivery model. The approval source itself lists graft failure, GVHD, infusion
              reactions, secondary malignancies, and infectious-agent transmission among warnings and precautions. The
              assigned sources also do not disclose a current valuation, liquidation preferences, dilution, cash runway,
              monthly burn, reimbursement outcomes, or post-approval utilization. Without those inputs, a precise
              price-to-sales or risk-adjusted NPV cannot be calculated responsibly. The recommendation therefore remains
              track/research-more, with a higher-quality call contingent on cap-table and launch evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
      - number: '8.2'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more decision-useful than a point valuation because the public record is strong on
              clinical efficacy but thin on economics. The bull case assumes the pivotal result translates into rapid
              center onboarding, payer coverage, reliable vein-to-vein manufacturing, and expansion beyond the initial
              label; the assigned independent article reports the company expected approximately 25 centers and first
              orders within weeks, but those are expectations, not realized observations. The base case assumes approval
              is followed by a measured launch while manufacturing, reimbursement, and center workflow constrain volume.
              The bear case assumes slow adoption, safety or CMC friction, or capital needs before commercial cash
              generation.

              Comparable evidence provides context but not a direct multiple. CompaniesMarketCap reports Legend Biotech
              at a $3.67 billion market capitalization on October 22, 2026, while an ACS Chemical & Engineering News
              account describes Gilead's 2017 Kite acquisition at $11.9 billion and notes the complexity of
              manufacturing individualized cell therapies. These public-company and M&A observations establish a range
              of sector outcomes, not a valuation for a private single-product issuer. The entry discipline is
              consequently to require a verified current mark, financing terms, cash runway, gross-margin bridge,
              center-level orders, payer coverage, and safety follow-up before underwriting a target return.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
      - number: '8.3'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The central valuation uncertainty is not whether Orca Bio has a credible clinical asset; it is whether the
              approved asset can become a repeatable, adequately financed commercial business at the price implied by
              the next financing or secondary transaction. A current mark should be reconciled to
              primary-versus-secondary proceeds and preference seniority. Commercial diligence should separate list
              price from net realized revenue and test whether transplant centers can operationalize donor collection,
              manufacturing, shipping, and infusion within the reported roughly 72-hour window. Financial diligence
              should reconcile the reported $250 million recent financing reference and $542 million funding total on
              Simplify with signed financing documents, cash on hand, burn, debt, and runway; these third-party listings
              are not audited financial statements.

              Thesis-break triggers are measurable: a material safety signal, a manufacturing or FDA CMC issue, failure
              to establish the planned center footprint, payer denials that prevent adoption, or a financing at a
              materially lower mark. The product's label also requires monitoring for graft failure and other serious
              complications, so post-marketing safety and real-world outcomes are valuation inputs rather than narrative
              qualifiers. Until those checks are completed, the evidence supports clinical promise and a watchlist
              position, not a buy call.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track / research-more: the clinical and regulatory milestone is meaningful, but a current mark, cash
              runway, financing terms, realized launch demand, and payer evidence are missing.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material safety or CMC issue, failure to build the planned center footprint, or financing at materially
              lower terms would break the current clinical-to-commercial thesis.
            calloutType: risk
            claimRefs:
              - CV003
              - CV006
              - CV012
              - CV014
