  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The most immediate alternative to TREGZI is not another precision T-cell product but the existing
              matched-donor allogeneic hematopoietic cell transplant pathway using an unmanipulated donor allograft and
              conventional GVHD prophylaxis. The ClinicalTrials.gov record defines the randomized Phase 3 comparator as
              standard-of-care alloHCT with an unmanipulated graft and tacrolimus plus methotrexate, while the
              experimental arm uses Orca-T followed by single-agent tacrolimus. That makes the transplant center and
              physician the practical buying gatekeeper: adoption requires changing graft handling, prophylaxis,
              scheduling, and monitoring rather than merely adding a drug. Post-transplant cyclophosphamide (PTCy) is a
              credible status-quo improvement: an EBMT review of a randomized 431-patient trial reported one-year
              chronic GVHD incidence of 21.9% with PTCy versus 35.1% with tacrolimus-methotrexate, and concluded that
              PTCy improved GVHD-free, relapse-free survival in the studied reduced-intensity setting. The evidence is
              not a head-to-head comparison with TREGZI, so it should be treated as a competing prophylaxis pathway, not
              proof of relative superiority.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Product scope, clinical segment, and economics
        blocks:
          - type: paragraph
            body: >-
              Adjacent approved products demonstrate that the cell-therapy competitive set is segmented by indication
              and treatment moment. Ryoncil is an off-the-shelf mesenchymal stromal-cell therapy approved for
              steroid-refractory acute GVHD in pediatric patients, with a reported eight-infusion wholesale acquisition
              cost estimate of $1.55 million in the Summit Re article; it is not a direct substitute for TREGZI's adult
              matched-donor transplant use. Omisirge is a nicotinamide-modified cord-blood progenitor-cell therapy for
              patients receiving umbilical-cord transplantation or for severe aplastic anemia, with boxed warnings
              including GVHD, infusion reactions, graft failure, and engraftment syndrome. These products compete for
              transplant budgets, specialist attention, and institutional cell-therapy capability, but their labels and
              mechanisms differ materially. TREGZI's published wholesale acquisition cost is $428,000 according to the
              Life Science Daily article, which also describes a roughly 72-hour donor-to- infusion window and dedicated
              manufacturing. The figure is a list price, not realized net revenue, reimbursement, or contribution
              margin. Public sources in this pool do not establish discounting, payer coverage, center onboarding, or
              comparative total-cost-of-care outcomes.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Orca Bio's strongest defensible differentiator is the combination of a precisely defined donor-derived
              graft and randomized evidence against the conventional allograft comparator. The company reports one-year
              chronic GVHD-free survival of 78% for TREGZI versus 38% for conventional alloHSCT (hazard ratio 0.26;
              p<0.00001), while the public trial record confirms the randomized, open-label, multicenter design and
              actual enrollment of 187 participants. A separate company-published retrospective analysis compared 76
              TREGZI patients with 360 historical PTCy patients and reported three-year overall survival of 83% versus
              66%; because the comparator is historical and the analysis is company-issued, it is directional rather
              than a clean competitive benchmark. The moat is therefore partly clinical and partly operational. A new
              entrant would need comparable evidence, donor-material logistics, validated manufacturing, and
              transplant-center workflow adoption. The same operating model creates displacement risk: the FDA review
              extension followed a major amendment involving chemistry, manufacturing, and controls information, and the
              label warns that graft failure, GVHD, infusion reactions, secondary malignancies, and transmission of
              infectious agents can occur. PTCy and conventional prophylaxis remain credible alternatives where centers
              value simpler workflows, while Ryoncil and Omisirge show that adjacent cell products can win narrower
              labels without matching TREGZI's mechanism.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP011
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical differentiation is real but bounded
            body: >-
              The randomized Precision-T design and the 78% versus 38% one-year chronic-GVHD-free survival result
              distinguish TREGZI from the conventional graft, but they do not establish superiority against PTCy or all
              adjacent products.
            calloutType: strength
            claimRefs:
              - CP001
              - CP009
          - type: callout
            title: Workflow and commercial proof are the moat test
            body: >-
              The public record supports a technically differentiated product, yet it does not disclose center
              onboarding, payer coverage, realized net price, launch volume, or contribution margin; those unknowns
              leave room for incumbent protocols and adjacent products to retain share.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and launch monetization
        blocks:
          - type: paragraph
            body: >-
              Tregzi is Orca Bio's first commercial product and creates a one-time, patient-specific product-sale
              opportunity rather than a recurring subscription stream. Independent reports consistently quote a $428,000
              wholesale or wholesaler acquisition cost. Reuters reported that the company expected availability for
              orders by the end of July 2026, and Adam Feuerstein reported that commercial launch was underway. Neither
              statement establishes administered doses, recognized revenue, net price, paid claims, or cash collections.
              The public stream is therefore best modeled as one-time Tregzi product sales through qualified transplant
              centers, with partnership or licensing revenue left at zero until an executed agreement is produced.
              Pipeline programs are option value, not current revenue.
