        - Verify accreditation, audits, deviation ownership, and quality agreements at every participating node
        - Medium-high
    notes: >-
      Concentration data are incomplete: public sources identify the intended center scale and product workflow but not
      shares by payer, center, facility, courier, or donor source.
    claimRefs:
      - CR008
      - CR009
      - CR011
      - CR012
      - CR016
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - track / research-more
        - Approval and pivotal efficacy are positive; economics and current price are not disclosed
        - Do not underwrite a buy without financing and launch evidence
      - - Confidence
        - medium-low
        - Clinical evidence is comparatively strong but valuation inputs are sparse
        - Confidence can rise with verified cap-table and commercial data
      - - Risk rating
        - high
        - Single approved product, individualized manufacturing, and serious labeled risks
        - Size conservatively and monitor safety, CMC, and adoption
      - - Valuation stance
        - unknown
        - No current financing mark or public revenue base in assigned evidence
        - Require a verified mark and downside case before entry
    notes: >-
      Evidence is a 2026 public-source snapshot; unknown means the assigned sources do not disclose the input, not that
      the input is zero.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
      - Investment implication
    rows:
      - - Clinical differentiation
        - 12-month cGFS 78% versus 38% in Precision-T
        - Durable real-world outcomes fail to reproduce the trial result
        - Supports premium positioning, subject to adoption
      - - Commercial launch potential
        - Approval, reported $428,000 WAC, planned 25-center network
        - Orders and payer coverage remain weak after launch
        - Treat launch plan as an assumption until observed
      - - Manufacturing scalability
        - Personalized donor-derived product and planned second facility
        - CMC issue, delays, or inadequate throughput
        - Apply a material execution discount
      - - Capital structure opacity
        - No current mark, runway, preferences, or dilution disclosed
        - Diligence provides signed terms and cash-flow bridge
        - Do not use false-precision private-company multiples
    notes: >-
      Rows combine observed trial facts with reported launch expectations; planned centers and price are not realized
      revenue or cash-flow evidence.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Fast center onboarding, payer coverage, reliable manufacturing, and label expansion
        - Premium private mark may be supportable if revenue scales faster than capital needs
        - Lower than base because launch evidence is not yet observed
        - Safety or CMC issue blocks scale
      - - Base
        - Measured launch with approval benefit offset by workflow, reimbursement, and manufacturing constraints
        - Track until current mark and unit economics support a risk-adjusted return
        - Most defensible pending commercial data
        - Orders or coverage lag the planned footprint
      - - Bear
        - Slow adoption, serious safety signal, manufacturing friction, or near-term financing need
        - Down-round or dilution risk rises; downside cannot be quantified without cap-table data
        - Material possibility given single-product concentration
        - Financing at materially lower terms or failed commercialization
      - - Required underwriting case
        - Verified valuation, cash, burn, margin, orders, payer mix, and preferences
        - Only then calculate risk-adjusted NPV or return target
        - Unknown until diligence closes the gaps
        - Any critical item remains unavailable
    notes: >-
      Scenarios are qualitative because the assigned sources do not provide a current valuation, revenue base, cash
      balance, burn rate, or preference stack; no numeric ranges are fabricated.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
