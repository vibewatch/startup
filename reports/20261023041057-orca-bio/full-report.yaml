        title: Cost structure and manufacturing intensity
        blocks:
          - type: paragraph
            body: >-
              Tregzi's economics depend on a fresh, patient-specific supply chain. Reports describe matched-donor cells,
              separate cell components, and an approximately 72-hour interval from blood collection to infusion because
              the Tregs are not frozen. This creates labor, quality-control, logistics, facility-utilization, and
              failed-batch exposures that a wholesale price alone cannot resolve. The FDA's three-month review extension
              after an updated chemistry, manufacturing, and controls submission confirms that manufacturing evidence
              was material to regulatory review, although no additional clinical data were requested and approval
              followed. Public sources do not disclose fully loaded COGS, batch yield, failure cost, working capital,
              capex, or dose-level contribution margin.
            claimRefs:
