  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      The broad GVHD-treatment estimates sit above a narrower, unquantified Orca label opportunity; the diagram is a
      hierarchy of evidence, not a proportional forecast.
    data:
      nodes:
        - id: mordor-current
          label: Mordor global GVHD treatment estimate
          value: 3.32
          unit: USD billions, 2026 estimate
          note: Mordor Intelligence outer reference
        - id: fmi-current
          label: Future Market Insights global GvHD treatment estimate
          value: 3.2
          unit: USD billions, 2026 estimate
          note: Separate publisher and methodology; not Orca SAM
        - id: orca-label
          label: Tregzi label-constrained opportunity
          value: null
          unit: Not publicly isolated
          note: >-
            Requires eligible adult matched-donor myeloablative HSCT volume, center activation, payer coverage, and net
            price
        - id: mordor-forecast
          label: Mordor Intelligence forecast
          value: 4.87
          unit: USD billions, 2031 estimate
          note: Broader GVHD-treatment market, not Orca SAM
        - id: fmi-forecast
          label: Future Market Insights forecast
          value: 5.9
