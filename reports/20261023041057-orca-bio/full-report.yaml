  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Tregzi addresses a specific slice of hematology care: adults with hematologic malignancies receiving a
              matched-donor hematopoietic stem-cell transplant with myeloablative conditioning. FDA and patient-facing
              coverage describe the intervention as a one-time donor-derived transplant component intended to improve
              chronic GVHD-free survival, not as a general blood-cancer drug or a treatment for every GVHD case. The
              status quo is conventional allogeneic transplantation with pharmacologic GVHD prophylaxis, while adjacent
              alternatives include other prophylaxis regimens and post-transplant treatment for established acute or
              chronic GVHD. This boundary excludes autologous CAR-T, unrelated solid-tumor cell therapy, and the broader
              spend on all immunosuppressants. The distinction matters because broad GVHD market estimates include
              prevention and treatment, acute and chronic disease, multiple modalities, and geographies that are not all
              eligible for Tregzi.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              Two commercial research estimates put the 2026 global GVHD-treatment market at $3.32 billion and $3.2
              billion, with forecasts to 2031 or 2036 and different CAGRs. Those estimates are useful as an outer market
              reference, not as Orca's SAM: one explicitly says its build starts with transplant activity, GVHD
              incidence, treatment eligibility, therapy mix, and net price, while also warning that published numbers
              differ when authors choose different patient pools, prevention inclusion, treatment lines, and pricing
              assumptions. The company-specific evidence is more constrained: the initial launch was described as a
              handful of centers with a plan for about 25 centers by year-end 2026, and the trial involved 19 leading
              centers. A defensible SOM therefore requires observed center activation, eligible patient flow, payer
              coverage, orders, and realized net price; none of those launch outcomes is yet disclosed in the assigned
              evidence.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is likely the transplant hospital and its pharmacy or cellular therapy service, while
              the clinical user is the transplant physician and cell processing team; the ultimate payer can be
              commercial insurance or a government program. The treatment's $428,000 wholesale acquisition cost makes
              budget timing, benefit classification, prior authorization, and evidence of avoided GVHD costs central
              adoption questions. Operationally, the product requires matched-donor collection, controlled cell
              processing, and a reported 72-hour vein-to-vein objective, so center qualification and logistics are part
              of the product rather than a conventional drug-distribution afterthought. CMS's CGT Access Model shows
              that state Medicaid programs may use outcomes-based agreements, negotiated discounts, and standard access
              policies for expensive cell and gene therapies, but its initial focus is sickle-cell gene therapy and
              participation is voluntary; it is a reimbursement precedent, not proof of Tregzi coverage. CIBMTR's center
              reporting infrastructure can support market enumeration, but its public materials also identify
              convenience samples that are not generalizable.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is clinical: the randomized Precision-T evidence reported 78% one-year chronic
              GVHD-free survival for Tregzi versus 38% for conventional transplant, while the FDA and CURE summaries
              describe the same direction of benefit. A second driver is a large unmet-burden context: chronic GVHD can
              affect multiple organs and create long-term morbidity. The constraints are equally material. The
              indication is narrow, manufacturing is patient- and donor-dependent, the launch requires center
              onboarding, and the company has had to provide additional chemistry, manufacturing, and controls
              information during regulatory review. Published market reports also describe established drug modalities
              and incumbent companies in the broader GVHD market. For valuation, this supports a differentiated but
              execution-sensitive adoption case: clinical efficacy can justify attention, but realized penetration,
              reimbursement, capacity, and repeatable delivery remain the proof points that convert an outer market
              estimate into revenue.
            claimRefs:
              - CM015
              - CM016
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical value is clearer than market size
            body: >-
              The pivotal trial and FDA summaries establish a differentiated clinical outcome, but the assigned evidence
              does not establish how many eligible patients will be treated or what net price will be realized.
