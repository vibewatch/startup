            body: >-
              A company-issued financing announcement describes $250 million of new equity from Orca Bio's two most
              recent financing rounds plus up to $100 million of additional liquidity from a 2025 Silicon Valley Bank
              credit-facility amendment. These are financing measures, not current cash, undrawn availability, or
              runway. Multiples separately reports $442 million raised across two rounds, a third-party aggregation that
              should not be substituted for management's cash ledger. Clinical results provide a credible value
              proposition, but they do not establish commercial demand or margin. Until Orca Bio supplies current cash,
