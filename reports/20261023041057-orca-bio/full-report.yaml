  - id: FE001
    title: TREGZI product and administration stack
    type: stack
    summary: >-
      The therapy combines precision-separated donor-cell populations with staged administration and specialist
      monitoring rather than functioning as a single undifferentiated graft.
    data:
      layers:
        - label: Matched-donor input
          detail: Donor-derived starting material for the individualized graft.
          items:
            - Peripheral blood from a related or unrelated HLA-matched donor
        - label: Precision separation
          detail: Separation of the defined cellular populations.
          items:
            - Hematopoietic stem and progenitor cells
            - Highly purified regulatory T cells
            - Conventional T cells
        - label: Individualized product
          detail: Patient-specific cellular components prepared for administration.
          items:
            - Patient-specific, separately dosed cellular components
        - label: Day 0 administration
          detail: Initial administration of the stem and regulatory T-cell components.
          items:
            - HSPCs for hematopoietic reconstitution
            - Tregs for immune tolerance and GVHD suppression
        - label: Day +2 or +3 administration
          detail: Follow-on administration of conventional donor T cells.
          items:
            - Tcons for immune reconstitution and graft-versus-leukemia activity
        - label: Clinical controls
          detail: Prophylaxis and monitoring across treatment and follow-up.
          items:
            - Tacrolimus prophylaxis
            - Engraftment, GVHD, infection, infusion, and malignancy monitoring
    approximationNotes: >-
      Layer order reflects the disclosed product workflow; it does not represent manufacturing duration, component
      quantity, capacity, or relative risk.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE007
      - CE008
  - id: FU001
    title: Customer journey from eligibility to center expansion
    type: journey-map
    summary: >-
      Commercial conversion requires a patient, donor, capable center, reimbursement workflow, individualized
      manufacture, monitored treatment, and evidence strong enough to support repeat center use.
    data:
      nodes:
        - label: Eligible patient and donor
          detail: >-
            Adult with a covered hematologic malignancy, an eligible matched donor, and planned myeloablative
            transplantation.
          touchpoints:
            - Referral
            - Eligibility review
            - Donor confirmation
        - label: Center clinical decision
          detail: A transplant physician and program choose TREGZI within a high-acuity transplant episode.
          touchpoints:
            - Physician evaluation
            - Center protocol
            - Scheduling
        - label: Coverage and authorization
          detail: Hospital teams complete benefit screening, contracting, authorization, registration, coding, and billing.
          touchpoints:
            - Payer review
            - Authorization
            - Revenue cycle
        - label: Patient-specific manufacture
          detail: >-
            Matched-donor cells are collected and processed into an individualized product coordinated to transplant
            timing.
          touchpoints:
            - Collection
            - Manufacturing slot
            - Chain of identity
        - label: Infusion and monitoring
          detail: The center administers the transplant workflow and monitors GVHD, infection, graft failure, and other risks.
          touchpoints:
            - Infusion
            - Safety monitoring
            - Follow-up
        - label: Repeat use and expansion
          detail: >-
            Durability would appear as additional eligible-patient orders and more active centers, but neither is
            publicly quantified.
          touchpoints:
            - Repeat orders
            - Center activation
            - Capacity and reimbursement
    approximationNotes: >-
      The sequence describes the evidenced workflow; it does not quantify conversion rates or imply that every
      participating trial site is a customer.
    claimRefs:
      - CU002
      - CU003
      - CU007
      - CU013
