          label: Reported initial launch footprint
          value: 25
          unit: planned U.S. centers, end-2026
          note: Operational plan, not treated-patient volume
    approximationNotes: >-
      The nodes preserve each publisher's own year and market boundary; they are ordered as evidence lenses, not
      mathematically nested or value-proportional layers. The Orca label layer is intentionally unvalued.
    claimRefs:
      - CM005
      - CM006
      - CM008
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      An ordinal map separates clinical differentiation from operational displacement risk; coordinates are analytical
      scores anchored to the cited evidence.
    data:
      xAxis: Clinical differentiation versus the incumbent transplant pathway
      yAxis: Operational / commercial displacement risk
      points:
        - label: TREGZI / Orca-T
          x: 4
          'y': 4
          note: >-
            Randomized evidence and engineered graft design support differentiation; manufacturing, workflow, and launch
            evidence create risk.
        - label: Conventional alloHCT
          x: 1
          'y': 1
          note: Incumbent comparator with established workflow; no new precision differentiation asserted.
        - label: PTCy pathway
          x: 2
          'y': 2
          note: Randomized evidence versus tacrolimus-methotrexate supports a competing prophylaxis pathway.
        - label: Ryoncil
          x: 2
          'y': 3
          note: >-
            Approved cell therapy with a distinct pediatric acute-GVHD label; commercial and indication adjacency create
            limited direct overlap.
        - label: Omisirge
          x: 2
          'y': 3
          note: >-
            Approved cell therapy with different cord-blood and aplastic-anemia indications; boxed warnings and workflow
            differences remain relevant.
        - label: Internal workflow / supportive care
          x: 1
          'y': 2
          note: >-
            Existing center protocols remain a substitute when a center does not adopt a precision graft; labor and
            total-cost tradeoffs are unquantified.
    claimRefs:
      - CP002
      - CP009
      - CP010
      - CP011
      - CP013
