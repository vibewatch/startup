              The launch motion is provider-led and operationally gated. Public reports describe an initial
              limited-center rollout and a plan to expand to about 25 U.S. transplant centers by the end of 2026, but a
              center target is not evidence of activation, referrals, utilization, or sales efficiency. A reposted Orca
