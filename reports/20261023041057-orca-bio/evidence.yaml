    keyQuote: >-
      Tregzi, known during development as Orca-T, is manufactured from the blood of an HLA-matched donor. It is
      administered in three sequential components. Hematopoietic stem and progenitor cells (HSPCs) and regulatory T
      cells, commonly called Tregs, are infused on the day of transplant. Conventional T cells follow two to three days
      later.
