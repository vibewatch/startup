evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financials
    missingEvidence: Current valuation, cash balance, monthly cash burn, debt, committed financing, and runway after the 2026 Series F.
    whyItMatters: >-
      Funding raised is not cash available; capital adequacy determines whether manufacturing and commercial launch can
      proceed without another dilutive financing.
    diligencePath: >-
      Request the latest management accounts, cash forecast, debt schedule, financing term sheets, and board-approved
      operating plan.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: missing-source
    severity: material
    topic: commercial
    missingEvidence: Verified transplant-center activation, orders, payer coverage, net price, and realized revenue after approval.
    whyItMatters: >-
      A planned 25-center footprint and a wholesale acquisition cost do not establish demand, reimbursement, or
      commercial traction.
    diligencePath: >-
      Obtain a center-by-center launch tracker, order history, payer policy set, gross-to-net bridge, and revenue
      ledger.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current executive, board, ownership, and key-person roster.
    whyItMatters: >-
      The company is entering a high-dependency manufacturing and commercial phase, so governance depth and succession
      capacity affect execution risk.
    diligencePath: >-
      Request the current board and executive roster, reporting lines, committee charters, option ledger, and succession
      or retention plans.
    relatedQuestionRefs:
      - QO003
      - QO007
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Reconciled financing history and definitions for total raised, Series F size, and any secondary component.
    whyItMatters: >-
      The assigned company announcement describes a Series F and a third-party database reports round totals that do not
      reconcile cleanly; investor economics cannot be inferred from either alone.
    diligencePath: >-
      Reconcile audited capitalization records, round closing notices, investor schedules, and primary-versus-secondary
      proceeds.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: addressable-market-sizing
    missingEvidence: >-
      Public counts of U.S. adults meeting Tregzi's exact matched-donor, myeloablative, hematologic-malignancy label
      criteria and their annual transplant-center distribution.
    whyItMatters: >-
      Broad GVHD-treatment estimates mix prevention, treatment, acute and chronic disease, and modalities, so they
      cannot establish Orca's SAM or SOM.
    diligencePath: >-
      Request a label-constrained patient funnel by disease, donor type, conditioning regimen, geography, and center
      from Orca or an independent transplant registry analysis.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption
    missingEvidence: Actual post-approval center activations, orders, treated patients, payer approvals, and net realized price.
    whyItMatters: The announced launch footprint is a plan, not evidence of commercial utilization or revenue conversion.
    diligencePath: >-
      Obtain monthly launch KPIs, payer mix, order-to-infusion conversion, manufacturing success rate, and center-level
      reorder data.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: Coverage and payment policy decisions for Tregzi across Medicare, Medicaid, and major commercial plans.
    whyItMatters: >-
      A $428,000 WAC and hospital-based administration create a financing and access bottleneck even if clinical demand
      is strong.
    diligencePath: >-
      Collect payer medical policies, negotiated coverage terms, prior-authorization outcomes, and any outcomes-based
      agreement terms.
    relatedQuestionRefs:
      - QM005
      - QM006
