- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - A down-round or structured insider-led round below the current headline mark
    - New money prices materially below the current unicorn threshold or adds heavy senior preferences
    - Shows external support for the current price was overstated
    - Downgrade to avoid / pass until terms and market support reset
  - - Weak audited monetization bridge
    - Recognized annualized revenue remains too small relative to installed traction or looks mostly services-like
    - Breaks the thesis that open-source and OEM traction are converting into durable software economics
    - Treat the current valuation as overstretched
  - - Adverse contract economics
    - OEM or enterprise deals prove pilot-heavy, subsidized, or mostly integration labor rather than recurring software
    - Undercuts the edge-AI monetization thesis even if deployments are real
    - Re-rate valuation closer to sub-unicorn territory
  - - Cap table / governance overhang
    - Preference stack, liquidation waterfall, or lock-up terms sharply subordinate new investors
    - Turns a plausible company into a weak security
    - Require a material discount or walk away
  - - China AI market-window compression
    - Hong Kong specialist-tech demand or China AI funding appetite cools before ModelBest proves revenue
    - Removes scarcity support from the valuation case
    - Move from research-more to track / wait-for-repricing
  notes: These are valuation-specific kill criteria tied to entry price and evidence quality, not a restatement of the broader risk register.
