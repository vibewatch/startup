- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What supports it
  - What would change the view
  rows:
  - - ModelBest has a real edge-AI wedge rather than a slideware story.
    - thesis
    - Official, GitHub, and Hugging Face sources show a live MiniCPM ecosystem across device categories.
    - More independent customer and paid-deployment evidence would strengthen this into a full commercialization thesis.
  - - The current mark is supported more by strategic investor appetite than by public monetization disclosure.
    - anti-thesis
    - April 2026 funding coverage validates the price floor, while public revenue and pricing remain absent.
    - An audited revenue bridge and contract economics would reduce the reliance on strategic-premium logic.
  - - Open-source traction is a funnel, not a revenue model by itself.
    - anti-thesis
    - 24M downloads and 158 hosted models show reach, but the sources do not disclose conversion, paid seats, or OEM take rates.
    - Verified conversion from downloads and deployments into recurring revenue would materially improve the view.
  - - China and Hong Kong capital markets are currently rewarding AI scarcity.
    - thesis
    - CB Insights and KPMG both show concentrated AI funding and a hot Hong Kong specialist-tech listing window.
    - A cooler IPO market or weaker next round would reduce this external valuation support quickly.
  - - ModelBest is cheaper than Moonshot or DeepSeek, but also more opaque on monetization.
    - anti-thesis
    - Moonshot and DeepSeek have much larger headline values, yet Moonshot at least has public ARR anchors and DeepSeek commands frontier-scarcity status.
    - If ModelBest produces comparable monetization evidence, the relative valuation could look more attractive.
  - - Security quality may lag company quality.
    - anti-thesis
    - No public cap table, preference stack, liquidation waterfall, or investor-rights package is available.
    - Clean term disclosure could improve the investability of the current mark faster than more product headlines.
  notes: Arguments separate company quality from security quality; the anti-thesis is mainly about pricing, monetization, and terms rather than product nonexistence.
