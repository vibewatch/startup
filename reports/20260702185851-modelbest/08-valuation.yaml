- id: strategic-value-versus-monetization-gap
  title: Strategic value is real, but monetization proof is still the gap
  body: |-
    Why can a $1B-class mark exist at all for a company with no public revenue disclosure? Because ModelBest does have assets investors can see. Official and developer-facing sources show a real edge-model franchise: the company positions MiniCPM across phones, AIPCs, smart cockpits, robots, wearables, and legal workflows; OpenBMB ties the company to a Tsinghua-rooted open-source ecosystem; GitHub and Hugging Face show a large live surface with MiniCPM repos, demos, collections, and 158 hosted models on the OpenBMB organization page. Press coverage also consistently cites more than 24 million cumulative downloads and named automotive deployments.

    But none of those are the same as monetization proof. The 24 million figure is company-reported via press rather than audited telemetry. Reviewed public sources disclose no ModelBest revenue, ARR, customer count, pricing card, OEM take rate, gross-margin bridge, or preference stack. Caixin and Tencent coverage make the adverse side plain: commercialization remains the unresolved test, repeated fundraising still matters, and the automotive cockpit lane is crowded enough that a good technical story can still fail to scale. Li Dahai's own June 2026 comments reinforce that the hard part is ecosystem execution with chips, memory, bandwidth, and software, not just model quality. That keeps the valuation debate centered on strategic option value, not on a proven income statement.
