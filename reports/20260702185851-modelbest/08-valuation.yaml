  title: Recommendation summary table
  columns:
  - Decision field
  - Current view
  - Supporting evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Public evidence validates a $1B-class mark but not enough monetization detail to underwrite it cleanly
    - Keep the company on the funnel; do not clear the current price for investment without more diligence
  - - Confidence
    - medium
    - The financing, traction, and comp set are real, but exact valuation, revenue, and terms stay opaque
    - Maintain coverage rather than issuing a hard pass or buy
  - - Risk rating
    - high
    - Monetization opacity, contract-economics uncertainty, and capital-market sensitivity remain material
    - Treat any deal as diligence-heavy and term-sheet-sensitive
  - - Valuation stance
    - stretched
    - The mark rests more on strategic scarcity and edge-AI option value than on public financial proof
    - Require either better evidence or better price
  - - Price discipline
    - No fresh capital at or above the current $1B-class mark without audited revenue and clean terms
    - No public revenue or preference stack supports a price-insensitive buy call
    - Only revisit at the current price if the data room closes the main gaps
  - - Upgrade path
    - Better evidence or lower entry
    - Audited revenue conversion, OEM take rates, and cap-table clarity would move the call faster than more narrative momentum
    - Track the next financing, customer proof, and diligence packet before committing
  notes: 'This table is intentionally price-sensitive: it summarizes what the current valuation already assumes, not a generic view of company quality.'
