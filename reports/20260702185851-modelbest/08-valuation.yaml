- id: comparable-set-and-china-capital-market-context
  title: Comparable set and China capital-market context
  body: |-
    The right comparable frame is not one clean multiple but a bracket. On the high end of private Chinese model scarcity, Moonshot raised about $2 billion at a $20 billion valuation while public sources pointed to ARR above $200 million in April; DeepSeek's first outside round reportedly valued it above $50 billion; and StepFun's 2026 pre-IPO financing chatter ran from $4-6 billion pre-money to an expected $10 billion cornerstone mark. On the public side, Zhipu and MiniMax show that Hong Kong investors will pay meaningful scarcity premiums even for lossmaking large-model issuers, while Palantir and C3.ai provide upper and lower public-multiple anchors from companies with far more transparent revenue ledgers.

    China's 2026 capital-market backdrop matters because it explains why ModelBest's headline price is not automatically absurd. CB Insights says Q1 2026 AI funding was extraordinarily concentrated in mega-round leaders, while KPMG says Hong Kong led the world in IPO funds raised in Q1 2026 and logged six specialist-technology listings plus 366 active applications. Reuters' January MiniMax IPO coverage adds the near-term mood signal: Hong Kong had its strongest IPO year since 2021 and AI/chip issuers were arriving into strong investor demand. That environment can support ModelBest's current headline mark. It does not make the mark attractive by itself, because ModelBest is much earlier on disclosed monetization than Moonshot and far less transparent than any public comp.
