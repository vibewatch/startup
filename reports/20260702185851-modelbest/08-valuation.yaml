- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue bridge
    - Monthly recognized revenue, ARR-equivalent run rate, deferred revenue, and channel mix
    - Determines whether open-source and deployment traction actually support the current mark
    - Finance team, auditor pack, and board materials
  - - Pricing and contract structure
    - OEM royalties, per-device pricing, enterprise subscription terms, support or services mix, and renewal clauses
    - Distinguishes real software value from subsidized pilots or labor-heavy integration
    - Management data room plus top-customer contract review
  - - Cap table and preference stack
    - Full capitalization table, liquidation waterfall, anti-dilution, ROFR, and investor rights
    - Defines actual downside protection and security quality at the current headline valuation
    - Company counsel and financing documents
  - - Gross-margin / compute-cost bridge
    - Hosted-versus-edge inference cost allocation, GPU commitments, and support staffing burden
    - Tests whether edge deployment meaningfully improves unit economics
    - FP&A plus infrastructure operations review
  - - Traction verification
    - Independent telemetry for active paid deployments, OEM ship volumes, and download-to-paid conversion
    - Separates community popularity from monetizable adoption
    - Partner confirmations, billing data, and platform dashboards
  - - Next-round or exit path
    - Timing and structure of the next financing, secondary, or listing process
    - Current valuation partly relies on a still-open China capital-market window
    - Board, lead investors, and banking advisors
  notes: These asks are prioritized by how quickly they could change the recommendation or acceptable entry price, not by how easy they are to obtain.
