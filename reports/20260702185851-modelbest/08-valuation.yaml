  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: download-verification
    missingEvidence: Independent platform telemetry showing active downloads, active users, and paid conversion rather than company-reported aggregate download counts.
    whyItMatters: The valuation case leans on open-source reach, but reach is not monetization unless conversion and paid usage can be verified.
    diligencePath: Request GitHub and Hugging Face telemetry exports plus internal funnel data showing evaluation-to-paid conversion and active enterprise programs.
    relatedQuestionRefs:
    - QV006
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: pricing-contract-structure
    missingEvidence: OEM royalty schedules, per-device pricing, enterprise subscription terms, renewals, and support or integration economics.
    whyItMatters: Without contract structure, a public investor cannot tell whether deployments resemble durable software revenue or strategic pilots and services.
    diligencePath: Request top-customer contracts, standard pricing schedules, and signed term sheets for OEM and enterprise deals.
    relatedQuestionRefs:
    - QV009
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-terms
    missingEvidence: Fully diluted capitalization table, liquidation waterfall, investor-rights package, anti-dilution terms, and any lock-up or control structures.
    whyItMatters: A plausible company can still be an unattractive security if the preference stack or control terms leave little downside protection for new money.
    diligencePath: Obtain counsel-prepared cap table and financing documents from the company and lead investors.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross-margin bridge, compute commitments, hosted-versus-edge cost split, and support staffing burden by major product line.
    whyItMatters: Edge AI only deserves a premium if off-device compute and support costs do not erase the economic benefit of local inference.
    diligencePath: Review FP&A packs, infrastructure contracts, and product-level gross-margin analysis with finance and engineering leaders.
    relatedQuestionRefs:
    - QV035
    relatedTableRefs:
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set
    missingEvidence: A fuller ledger of exact private-round terms and consistent revenue disclosures across Chinese AI peers.
    whyItMatters: The comparable valuation table is intentionally sample-based because many direct peers disclose only headline valuations or partial financials.
    diligencePath: Expand to paid databases, prospectus appendices, and banker materials for exact peer-round, revenue, and dilution data before making a tighter pricing call.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV017
    - QV020
    - QV021
    relatedTableRefs:
    - TV004
