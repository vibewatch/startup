- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Key metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - ModelBest (private, Apr 2026)
    - No public revenue; 24M+ reported downloads; second 2026 round
    - ~$1B-class / unicorn-threshold mark; exact post-money undisclosed
    - Direct asset under review
    - No public revenue, pricing, or term sheet to translate headline valuation into economics
  - - Moonshot AI (private, May 2026)
    - ARR topped $200M in April 2026
    - $20B valuation; ~100x ARR on the disclosed floor
    - Best Chinese open-weight monetization comp with fresh valuation data
    - Much larger monetization base and broader API/subscription surface than ModelBest
  - - Zhipu AI (Hong Kong-listed, Jan 2026)
    - H1 2025 revenue CNY190.9M; H1 net loss CNY2.4B
    - $7.4B market cap at 2026 debut close
    - Shows Hong Kong will price AI scarcity despite losses
    - IPO pricing and early float dynamics can overstate steady-state value
  - - MiniMax (Hong Kong-listed, Jan 2026)
    - '>$11.5B debut market cap; $512M net loss in 9M25'
    - Public market accepted an $11.5B+ lossmaking AI issuer
    - Useful public China AI issuance precedent
    - Debut-day valuation is volatile and business mix is more global than ModelBest
  - - StepFun (pre-IPO, 2026)
    - $4B first-tranche pre-money; $5-6B second tranche; expected ~$10B cornerstone mark
    - Late-stage private / IPO-transition pricing
    - Another China device-and-distribution-oriented AI startup
    - Pre-IPO terms remain unofficial and still listing-window dependent
  - - DeepSeek (private, Jun 2026)
    - No public revenue disclosed; first outside round at >$50B
    - '> $50B valuation with unusual control and lock-up terms'
    - Upper bound for China frontier-model scarcity
    - Control structure and lack of revenue disclosure reduce direct comparability
  - - Palantir (public, Jul 2026)
    - $5.22B TTM revenue
    - $309.97B market cap; 59.25x P/S; 57.76x EV/Sales
    - Upper public benchmark for a proven AI platform with real revenue and profitability
    - Far more mature, global, and financially transparent than ModelBest
  - - C3.ai (public, Jul 2026)
    - FY2026 revenue $250.3M; 31% GAAP gross margin
    - $1.41B market cap; 5.64x P/S; 3.57x EV/Sales
    - Lower public benchmark for an AI software company under execution pressure
    - Not an edge-model platform and public sentiment is much weaker than China scarcity peers
  notes: This is a sample-based comparable set intended to bracket valuation logic, not an exhaustive universe of every AI issuer or private round.
