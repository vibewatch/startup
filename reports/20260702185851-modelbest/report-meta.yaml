companyProfile:
  summary: >-
    ModelBest (面壁智能), formally 北京面壁智能科技有限责任公司, is a Beijing-based edge-model
    startup founded in August 2022 around Li Dahai, Liu Zhiyuan, and Zeng Guoyang. The company
    emerged from Tsinghua University's NLP / OpenBMB ecosystem and built the MiniCPM family as a
    compact, deployment-oriented alternative to cloud-only frontier models. Public sources show a
    strategy centered on open-source distribution through OpenBMB, GitHub, and Hugging Face,
    followed by edge and embedded deployments across phones, AI PCs, smart cockpits, embodied
    robots, wearables, and legal-AI workflows. Repeated 2024-2026 rounds culminated in an April
    2026 financing that pushed ModelBest above the unicorn threshold, but public disclosure still
    lags on revenue quality, pricing structure, governance, and exact security terms.
  founders:
    - name: Li Dahai
      role: Co-founder & CEO
      background: Former senior Zhihu technology executive and the most visible public commercial voice for ModelBest.
      claimRefs: [CO007]
    - name: Liu Zhiyuan
      role: Co-founder & Chief Scientist
      background: Tsinghua computer-science faculty member tied to the Tsinghua NLP and OpenBMB ecosystem.
      claimRefs: [CO008]
    - name: Zeng Guoyang
      role: Co-founder & CTO
      background: Public profiles connect him to earlier WuDao / Wenyuan model work and MiniCPM engineering.
      claimRefs: [CO009]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    MiniCPM is a family of compact language, multimodal, and omni-modal models optimized for
    mainstream chips and local or edge deployment, distributed through official docs, open-source
    repos, Hugging Face releases, and deployment demos rather than a visible public API checkout flow.
  customerFocus: >-
    Device OEMs and automotive programs embedding on-device AI, enterprise and public-sector teams
    deploying local inference, and a broad developer/open-source community evaluating MiniCPM on
    mobile, PC, robot, and embedded workflows.
  businessModel: >-
    Most likely a mix of OEM embedding, enterprise/on-prem deployment, solution integration, and
    open-source-to-commercial conversion rather than a fully public self-serve API pricing model;
    exact contract structure and realized pricing remain undisclosed.
  stage: Growth-stage private company / unicorn threshold
  fundingStatus: >-
    2024-2025 financing built through Primavera/Hubble, Loongson/SAIF-linked, Hongtai/Gozone, and
    other rounds; in 2026 a China Telecom-led round was followed by an April Shenzhen Capital Group
    and Huichuan-led round that reportedly took cumulative first-quarter financing above RMB1 billion
    and pushed the company above the $1 billion valuation threshold.
