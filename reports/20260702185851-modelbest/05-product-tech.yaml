- id: developer-distribution-and-roadmap
  title: 'Distribution and roadmap: the family is unusually open and fast-moving, but version discipline matters'
  body: 'Developer distribution is one of the strongest public proof points. OpenBMB’s GitHub and Hugging Face surfaces show that MiniCPM is maintained as a broad release family rather than as one abandoned research drop, and the repos carry meaningful community scale: on the access date, the MiniCPM repo had more than 9.5k GitHub stars, the MiniCPM-V repo more than 25k, and the V-Apps repo remained active into July 2026. The Hugging Face org page also shows a deep catalogue, while ModelScope adds at least one partner distribution path for GGUF packaging. The roadmap cadence is similarly real. Public histories show MiniCPM-2B in early 2024, 2B-128k and MoE follow-ons in April 2024, MiniCPM3-4B in September 2024, MiniCPM-o 2.6 in January 2025, MiniCPM-V 4.5 in 2025, and MiniCPM5-1B plus MiniCPM-V 4.6 in 2026. That pace is positive for relevance, but it also means that deployment compatibility often depends on model-specific forks, GGUF conversions, or runtime-version coordination instead
    of one frozen enterprise platform.'
