- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Apache 2.0 licensing on core repos
    - Public and verified
    - MiniCPM and MiniCPM-V open-source weights or code surfaces
    - Permissive licensing does not by itself prove enterprise support or safety controls
  - - Open code and deployment examples
    - Public and extensive
    - Repos, readmes, model cards, V-Apps build paths
    - Breadth of code exceeds breadth of independent production proof
  - - ASPICE L2 process claim
    - Public company claim
    - Automotive engineering-process maturity narrative
    - No separate public audit report or customer-case detail was located in reviewed materials
  - - Known-limitations disclosure
    - Public but partial
    - MiniCPM-o admits foundation and speech weaknesses
    - The disclosure is model-specific rather than a full trust-center program
  - - Hub access and packaging governance
    - Mixed
    - Open GitHub repos but some hub pages are gated or JS-heavy
    - Distribution friction can appear at the exact point a developer wants reproducible weights
  - - Public security trust surface
    - Not located
    - SOC 2, ISO 27001, public uptime, incident history, trust center
    - Requires private diligence because the public web surface is thin
  - - Voice and content-governance detail
    - Not located in reviewed public surfaces
    - Cloning, multimodal streaming, and legal workflows
    - Public moderation, watermarking, or abuse-response controls remain unclear
  notes: “Not located” means the control was not visible on the reviewed public web surfaces; it does not prove the control is absent internally.
