- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - ModelBest solution
  - Measurable benefit
  - Limitation
  rows:
  - - Run a private multimodal assistant on a phone or tablet
    - Cloud chatbot or server-hosted vision API
    - MiniCPM-V in V-Apps or local llama.cpp packaging
    - Local execution with 6-8GB-class device targets depending on version
    - Older low-RAM devices can still swap or degrade, especially on V 2.6
  - - Parse dense documents, images, or video on-device
    - OCR plus separate VLM or server round-trips
    - MiniCPM-V 2.6 / 4.5
    - 640-token image encoding on V2.6 and 96x video-token compression on V4.5
    - Most headline accuracy claims are vendor-authored rather than neutral benchmarks
  - - Build a bilingual real-time voice assistant
    - ASR + LLM + TTS cascade or cloud realtime API
    - MiniCPM-o 2.6 / 4.5
    - One integrated speech and multimodal stack with configurable voices
    - Official docs admit omni speech can still be unstable or mispronounce
  - - Ship a fully offline multimodal mobile app
    - Custom app integration work with multiple runtimes
    - MiniCPM-V-Apps source repo
    - Reference apps on iOS, Android, and HarmonyOS reduce integration friction
    - Still requires platform-specific toolchains and build steps
  - - Run a local coding or tool assistant
    - Small local text model or frontier API agent
    - MiniCPM5-1B
    - 1B-class on-device model with tool-use and reasoning posture
    - Current public proof is developer-oriented, not enterprise SLA-backed
  - - Support cockpit, robot, or GUI-agent workflows
    - Custom OEM stack with embedded perception and action
    - MiniCPM plus homepage cockpit, GUI-agent, and embodied surfaces
    - Edge-native latency and device integration narrative fit these scenarios
    - Public proof is strongest on demos and partner mentions, weaker on scaled KPIs
  - - Deploy regulated legal workflows on private networks
    - Manual research and document assistance inside isolated systems
    - ModelBest legal AI stack on court private network
    - Keeps data and inference closer to regulated users
    - Official surfaces do not disclose customer breadth, uptime, or audit controls
  notes: Benefits are phrased as directly observable deployment or packaging advantages, not as audited ROI outcomes.
