- id: trust-safety-and-compliance
  title: 'Trust, safety, and compliance: openness is a plus, but public control-plane disclosure is still thin'
  body: The public trust picture has genuine positives. MiniCPM and MiniCPM-V are Apache 2.0 licensed, the code and deployment examples are open, and ModelBest says it has passed ASPICE L2 for automotive process maturity. Those are materially better signals than a purely closed model vendor with no public engineering surface. Still, the public control plane trails the capability plane. MiniCPM-o’s own docs admit that full-duplex omni-modal capability still needs improvement and that speech output can mispronounce in omni mode, while the generic vLLM docs make clear that broad multimodal compatibility still depends on backend details rather than being universally turnkey. More importantly, the reviewed official surfaces do not expose a public security trust center, SOC 2 or ISO 27001 certification page, or a public uptime and incident program. That does not prove weak controls, but it does mean diligence on safety, content governance, and production reliability still has to move from public
    web evidence into private-room verification.
