chapter:
  number: 5
  title: Product & Technology
  summary: 'ModelBest''s product story is broader and more credible than a single open-weight release: MiniCPM spans small text models, MiniCPM-V multimodal models, MiniCPM-o voice and streaming models, and a real cross-platform V-Apps shell for iOS, Android, and HarmonyOS. The family''s differentiation is consistently about edge efficiency -- token compression, quantization, sparse reasoning, and aggressive runtime packaging -- while the main public weaknesses sit elsewhere: compatibility can still be version-specific, production proof is thinner than packaging proof, and the reviewed public surfaces still do not expose a mature security or trust-control layer.'
sections:
- id: product-line-and-user-jobs
  title: 'Product line: one edge-model franchise spanning text, multimodal, omni voice, and packaged mobile apps'
  body: 'ModelBest’s delivered product is not a single hosted model endpoint but a layered MiniCPM franchise that maps into concrete end-user jobs. The company’s homepage frames the family around phones, AI PCs, intelligent cockpits, embodied robots, wearables, GUI-agent experiences, and legal workflows, which is materially different from a generic chatbot positioning. The base text line still matters: the public MiniCPM history runs from MiniCPM-2B through 2B-128k, MoE and 1B variants, then into MiniCPM3-4B and the newer 4.x and 5-1B lines. On top of that text backbone, ModelBest layers MiniCPM-V for image, video, OCR, and document parsing; MiniCPM-o for real-time voice and live multimodal streaming; and MiniCPM-V-Apps for fully local iOS, Android, and HarmonyOS packaging. That breadth is the chapter’s key product fact: ModelBest is selling a reusable edge-deployment stack for multiple jobs, not just a benchmark sheet. The caveat is that public evidence is much stronger on what the company
    can package and demo than on how many of those surfaces are already scaled production programs.'
