  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production-deployments
    missingEvidence: Named production customers, active deployment counts, and support commitments by MiniCPM module or vertical.
    whyItMatters: The product breadth is visible, but scaled monetizable usage is not separately visible for each module.
    diligencePath: Request a module-by-module deployment ledger covering customer name, environment, devices shipped, SLA owner, and renewal status.
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: Public SOC 2, ISO 27001, uptime-status, incident-history, or trust-center materials for the ModelBest/OpenBMB production stack.
    whyItMatters: Without these disclosures, diligence cannot tell whether enterprise reliability and security maturity match the technical marketing surface.
    diligencePath: Request the latest security certification package, architecture review, uptime reports, and incident-management policy.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: content-governance
    missingEvidence: Public moderation, abuse-prevention, watermarking, or voice-cloning governance details for MiniCPM-o and VoxCPM-style outputs.
    whyItMatters: Voice, live streaming, and legal workflows create higher safety and compliance sensitivity than static text generation.
    diligencePath: Request policy documents, red-team summaries, human-review triggers, and customer-configurable guardrail settings.
    relatedQuestionRefs:
    - QE024
  - type: stale
    severity: minor
    topic: runtime-compatibility
    missingEvidence: A versioned compatibility matrix showing which MiniCPM releases work upstream versus via temporary forks across vLLM, SGLang, llama.cpp, and mobile app shells.
    whyItMatters: Version drift can turn a strong open-source surface into support pain for customers and integrators.
    diligencePath: Request the current internal support matrix with exact runtime versions, known breakages, and planned deprecation dates.
    relatedQuestionRefs:
    - QE025
