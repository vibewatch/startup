- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - MiniCPM text family (2B, 2.4B, 3-4B, 4.x, 5-1B)
    - Device, local-agent, and reasoning developers
    - Open release family; current flagship text line is MiniCPM5-1B
    - Small-model efficiency plus hybrid reasoning and tool-use focus
    - Per-version commercial deployment counts are undisclosed
  - - MiniCPM-V family (2.6, 4.5, 4.6)
    - Multimodal app and OEM teams
    - Actively released and documented
    - High token-density OCR, video, and document understanding on edge devices
    - Independent replication is thinner than vendor benchmark coverage
  - - MiniCPM-o family (2.6, 4.5)
    - Voice and omni-assistant builders
    - Open and rapidly iterating
    - Real-time speech conversation plus live multimodal streaming
    - Official docs still admit omni-mode speech and foundation limitations
  - - MiniCPM-V-Apps
    - Mobile OEMs and local-app developers
    - Working source demos on iOS, Android, HarmonyOS
    - Fully offline packaging for multimodal chat
    - App adoption, retention, and enterprise support terms are not public
  - - GGUF / quantized packaging
    - Local deployers using llama.cpp or partner hubs
    - Broadly available across major releases
    - Shrinks hardware floor and enables offline installs
    - Quality trade-offs by quant level are not benchmarked in one unified table
  - - VoxCPM2
    - TTS and voice-design builders
    - Included in V-Apps stack
    - Adds multilingual TTS and cloning to the device stack
    - Abuse controls and moderation for cloning are not publicly detailed
  - - Legal AI private-network workflow
    - Courts and legal institutions
    - Claimed deployed in professional judicial scenarios
    - On-prem or private-network positioning fits regulated workflows
    - Named customer count and renewal evidence are not public
  - - GUI / cockpit / embodied surfaces
    - OEMs and agent-framework builders
    - Publicly showcased, maturity mixed by module
    - Pushes MiniCPM beyond chat into device-native action loops
    - Showcase breadth is clearer than independently verified scaled production
  notes: Rows distinguish public packaging breadth from proven scaled production. “Status / maturity” reflects what is visible on official surfaces as of 2026-07-02, not private deployment counts.
