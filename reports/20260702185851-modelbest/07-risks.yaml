  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-compliance-gap
    missingEvidence: Company-specific CAC filing or registration number, label implementation proof, and product-by-product compliance statement for all public ModelBest surfaces.
    whyItMatters: Without product-specific proof, the China compliance risk is only partially de-risked even though the rulebooks are explicit and active.
    diligencePath: Ask management for filing numbers, regulator correspondence, screenshots of label placement, metadata samples, and any security-assessment submissions.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: security-privacy-governance
    missingEvidence: Public or diligence-room privacy policy, user agreement, security ownership, incident-response process, and any security testing or certification materials.
    whyItMatters: ModelBest claims sensitive legal, cockpit, and multimodal use cases, so missing governance documentation is a real procurement and enforcement risk rather than a cosmetic website gap.
    diligencePath: Request the current privacy policy, user agreement, data-retention policy, incident playbook, and any internal or third-party security assessments.
    relatedQuestionRefs:
    - QR017
    - QR018
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: monetization-opacity
    missingEvidence: Revenue by channel, public or private API pricing, per-OEM economics, contract duration, renewal rates, and customer concentration.
    whyItMatters: The partner and funding story is visible, but the business cannot be underwritten cleanly without contract economics and concentration data.
    diligencePath: Request a board-grade customer and pricing pack covering top OEM and enterprise accounts, segment margins, and renewal cohorts.
    relatedQuestionRefs:
    - QR027
    - QR031
    relatedTableRefs:
    - TR003
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: compute-resilience
    missingEvidence: Actual training and inference chip mix, export-control screening process, domestic-stack fallback readiness, and any procurement bottlenecks.
    whyItMatters: Public policy and management commentary show real compute exposure, but the magnitude of the company-specific bottleneck cannot be sized from public evidence alone.
    diligencePath: Request chip supplier list, procurement entity structure, current inventory runway, and export-compliance controls by procurement route.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR010
    - QR013
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Current cap table with economic ownership, board seats, veto rights, information rights, and any strategic-commercial side letters.
    whyItMatters: A crowded investor roster can be helpful for channel access but can also constrain future financing or strategic flexibility if rights are complex.
    diligencePath: Request the latest cap table, board composition, shareholder agreement summary, and any rights held by telecom, state, industrial, or competitor investors.
    relatedQuestionRefs:
    - QR023
    - QR024
    - QR025
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: litigation-status
    missingEvidence: A clean, company-specific litigation and enforcement schedule or court-database extract confirming material proceedings, if any, against ModelBest or its key entities.
    whyItMatters: This chapter did not locate a major public case in retained sources, but the absence of a located case is not the same as a verified clean legal record.
    diligencePath: Repeat exact-name searches across Chinese court databases, regulator bulletins, and commercial-risk platforms, then request managements litigation schedule and outside-counsel letter.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A complete rule-by-rule legal inventory across every ModelBest entity, product surface, and jurisdiction.
    whyItMatters: The public register here is intentionally severity-ranked and useful for underwriting, but it is not a substitute for a full legal memo.
    diligencePath: Commission counsel or compliance staff to map every entity and surface against applicable CAC, MIIT, cybersecurity, export-control, and consumer-protection requirements.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
