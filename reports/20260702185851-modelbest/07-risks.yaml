- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / license / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Generative AI filing and security-assessment requirements under the Interim Measures
    - China (CAC / MIIT)
    - Active; service-level filing/assessment required for qualifying public services
    - high
    - high
    - ModelBest can mitigate by documenting whether each public surface is in-scope and by producing filing/assessment materials
    - Public sources reviewed here do not evidence a ModelBest-specific filing number or assessment status
    - Request ModelBests CAC filing/registration numbers, in-scope product list, and security-assessment records by product surface.
  - - AI-generated synthetic content labeling rules
    - China (CAC / MIIT / MPS / NRTA)
    - Active since 2025-09-01
    - high
    - high
    - Implement explicit and implicit labels, user-agreement language, and log retention across text/audio/image/video outputs
    - ModelBests public surfaces reviewed here do not show a visible labeling statement or user-agreement trail
    - Request labeling implementation screenshots, metadata samples, and user-agreement text for MiniCPM-o and public-facing services.
  - - Amended Cybersecurity Law
    - China
    - Active since 2026-01-01
    - medium
    - high
    - Compliance program, data-governance controls, and sector-specific handling for legal/cockpit/consumer surfaces
    - Penalties can escalate to RMB10 million plus suspension, app closure, or license revocation in severe cases
    - Request internal classification of any CIIO-relevant services, PII-handling flows, and responsible compliance owners.
  - - GB/T 45654-2025 generative-AI security baseline
    - China
    - Effective since 2025-11-01
    - medium
    - medium
    - Document training-data provenance, illegal-content filtering, personal-information legal basis, and IP-risk disclosure
    - ModelBests open-source and sensitive-sector use cases create more proof obligations than the public record currently shows
    - Request the latest genAI safety self-assessment pack, data-source controls, and red-team / sampling procedures.
  - - Open-source license and IP / provenance compliance
    - Cross-border / multi-jurisdiction
    - Apache 2.0 code is public; downstream data, model, and output rights remain fact-specific
    - medium
    - medium
    - Separate code-license compliance from model/data/output-rights governance and document enterprise usage terms
    - Forkability and unclear downstream rights can compress pricing and create enterprise procurement friction
    - Request enterprise terms, training-data provenance policy, and infringement / takedown handling process.
  - - Public litigation / enforcement record
    - China / other reachable public channels
    - No major public case confirmed in retained sources; verification incomplete
    - low
    - medium
    - Ongoing docket and regulator monitoring
    - Absence of a located case is not evidence of a clean legal record
    - Repeat company-name searches across Chinese court, regulator, and commercial-risk databases; ask management for a litigation schedule.
  notes: 'Ordered by severity. Coverage is partial: this table prioritizes the rules and legal checks most likely to break the investment thesis rather than attempting a full jurisdiction-by-jurisdiction legal inventory.'
  enumerationScope:
    coverage: partial
    basis: Covers the highest-consequence public regulatory and legal items visible for ModelBests 2025-2026 operating surface, plus the public litigation/enforcement diligence path; not an exhaustive legal-entity inventory.
