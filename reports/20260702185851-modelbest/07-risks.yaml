company:
  name: ModelBest
chapter:
  number: 7
  title: Risks
  summary: 'ModelBest''s risk stack is driven by a widening compliance surface rather than by lack of technical ambition: China''s 2025-2026 generative-AI labeling, filing, safety-standard, and cybersecurity rules now apply to multimodal and potentially socially influential services, while the company''s public surfaces reviewed for this chapter still do not evidence a ModelBest-specific CAC filing number, labeling statement, or privacy-policy trail. At the same time, U.S. advanced-computing export controls continue to reach China-headquartered ultimate parents even outside China, and ModelBest is trying to commercialize an open-source, Tsinghua-derived edge-model stack through OEM and strategic-capital channels without public pricing, revenue, or contract disclosure. The company has real deployment and funding signals, but residual risk stays high until compliance, monetization, and compute resilience are evidenced with company-specific proof.'
sections:
- id: china-regulation-and-legal-stack
  title: 'China regulation and legal stack: filing, labeling, cybersecurity, and standards now matter simultaneously'
  body: 'ModelBest''s first-order risk is that its product surface is already broad enough to fall into several overlapping China AI-control regimes at once. The company homepage positions MiniCPM across phones, AI PCs, smart cockpits, embodied robots, wearables, and court-network legal workflows, while MiniCPM-o materials show full-duplex voice and multimodal interaction rather than a simple text-only model. That matters because China''s Interim Measures for Generative AI Services require security assessment and algorithm filing for services with public-opinion or social-mobilization characteristics, and the March 2025 AI-generated-content labeling rules require both explicit and implicit labeling, user-agreement disclosure of labeling methods, and six-month log retention when unlabeled outputs are supplied. The CAC''s own May 2026 filing notice shows this is not a dormant rulebook: 72 more services were filed in March-April 2026 and launched apps are expected to display model names and
    filing or launch numbers. The amended Cybersecurity Law in force from 2026-01-01 further raises the downside by linking AI service operation to stronger personal-information and critical-infrastructure enforcement, with penalties escalating to RMB10 million and shutdown-style remedies for severe outcomes. Against that backdrop, the public surfaces reviewed for this chapter did not surface a visible ModelBest filing number, public labeling statement, or privacy-policy trail, so the compliance burden is specific and monitorable rather than theoretical.'
