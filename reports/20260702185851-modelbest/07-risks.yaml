- id: mitigation-and-kill-criteria
  title: 'Mitigation, monitorable triggers, and kill criteria: the next diligence cycle should be event-driven'
  body: 'The right way to underwrite ModelBest''s risk is not with generic AI caution but with specific, externally observable triggers. Some mitigations are real: the company has strategic backers, multiple named deployment channels, an edge-first technical identity, and an open-source ecosystem that can lower adoption friction. But those same mitigants are incomplete. Strategic capital is not proof of revenue quality, open source is not proof of moat, and domestic-chip adaptation is not the same as secure export-control resilience. The chapter therefore treats the highest-priority kill criteria as public events: disclosure of a ModelBest CAC filing or label statement, any export-control designation or clear procurement blockage, additional evidence that pricing is collapsing faster than attach-value grows, partner-concentration cracks in the auto/device channel, and public governance or legal disclosures that clarify whether the cap table and sensitive-sector deployments are manageable.
    If those triggers fail to improve on the next refresh, residual exposure should be treated as thesis-breaking rather than as ordinary startup uncertainty.'
