- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - ModelBest-specific CAC compliance visibility
    - Public product page, app detail page, or company disclosure
    - Still no visible model name + filing / launch number or label statement by the next diligence refresh
    - Escalate to a compliance blocker and require evidence before underwriting consumer or socially influential surfaces.
  - - AI-labeling execution
    - Observed product outputs or company compliance materials
    - No explicit labels on in-scope outputs, no metadata evidence, or no user-agreement language despite live multimodal services
    - Treat as a thesis-break on China consumer deployment readiness.
  - - Advanced-compute procurement resilience
    - BIS / company procurement update / supplier notice
    - Export-license denial, inability to source required advanced computing items, or clear dependence on blocked routes
    - Rebase launch cadence and valuation for slower training / serving progress.
  - - OEM concentration and monetization proof
    - New customer disclosure or contract evidence
    - No expansion beyond current named channels or evidence that flagship programs remain pilots without paying scale
    - Discount device / cockpit revenue assumptions and move focus to evidence-backed verticals only.
  - - Price-war pressure
    - Industry API price announcements and company pricing posture
    - Further market-wide cuts without disclosed attach-value or margin protection from ModelBest
    - Model the business as integration/services-led rather than model-licensing-led.
  - - Governance / cap-table complexity
    - Board, financing, or rights disclosure
    - Strategic investor rights materially constrain commercial flexibility or create related-party conflicts
    - Require governance conditions or treat future financing terms as structurally riskier.
  - - Security / privacy governance
    - Public policy page, incident disclosure, or diligence-room documents
    - No evidence of privacy policy, security ownership, or incident process as the company adds more public surfaces
    - Freeze consumer-surface underwriting until governance controls are evidenced.
  notes: These triggers are intentionally monitorable from outside the company so the next refresh can be event-driven. They are not generic startup warnings; each trigger is tied to a specific compliance, monetization, partner, or compute failure mode evidenced in this chapter.
