- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure scenario
  - Severity
  - Mitigation
  - Residual exposure
  rows:
  - - Automotive design wins and cockpit deployment
    - Geely / Volkswagen / Changan / GAC and related integrators
    - Proof-of-deployment and revenue-channel partners
    - Public evidence is concentrated in a handful of named auto/device relationships
    - Loss, delay, or weak monetization of a few flagship OEM programs undermines the edge-commercialization narrative
    - high
    - Broaden OEM set and disclose conversion from design win to paying production program
    - Current public proof is stronger on named partners than on contract economics or renewal depth.
  - - Device and endpoint ecosystem adoption
    - Phone / AI PC / smart-home partners named in public materials
    - Scale path for on-device AI distribution
    - Public claims show breadth but little per-partner unit or revenue disclosure
    - Headline reach does not translate into durable revenue or can be repriced by powerful OEMs
    - high
    - Negotiate sticky integration, support, and software-update economics
    - Residual leverage still sits with larger OEMs until pricing and renewal evidence appears.
  - - Domestic chip and software ecosystem
    - Huawei-linked and other domestic compute stacks
    - Training / inference adaptation and resilience against export controls
    - High technical dependence per management commentary
    - Weak toolchains or insufficient supply slow model iteration and force product compromises
    - high
    - Continue multi-vendor adaptation and keep cloud / edge workload split flexible
    - Domestic alternatives reduce single-route risk but do not erase performance and software-gap exposure.
  - - Strategic capital base
    - China Telecom, Shenzhen Capital, Beijing AI funds, Huichuan-linked capital, other state/industrial investors
    - Financing runway and channel access
    - Capital stack is broad but strategically opinionated
    - Future financing or channel decisions may optimize for ecosystem or policy goals rather than pure shareholder economics
    - medium
    - Clarify investor rights, governance rights, and commercial quid pro quos
    - Funding strength lowers short-term runway risk while increasing governance-complexity risk.
  - - Open-source distribution platforms and community spillover
    - OpenBMB / GitHub / downstream developers
    - Adoption funnel and reputation engine
    - Broad and public by design
    - Forks or community alternatives absorb adoption without paying ModelBest
    - medium
    - Monetize integration, enterprise support, or proprietary deployment know-how
    - 'Open distribution remains a double-edged sword: growth channel plus moat leakage.'
  notes: Rows are ordered by severity and capture dependencies that can be monitored from outside the company. The register is stronger on visible counterparties than on private contractual protections, because those protections are not public in retained evidence.
