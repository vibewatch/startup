      - number: '5.2'
        title: 架构和部署：MiniCPM 靠压缩算力、激进打包并把推理搬到端侧取胜
        blocks:
          - type: paragraph
            body: >-
              技术差异化始终围绕效率，而不是打造最大的基础模型。最早的 MiniCPM 论文认为，1.2B 和 2.4B 模型可以凭更好的规模化纪律与大得多的系统竞争；当前仓库历史又加入
              MiniCPM4.1、MiniCPM-SALA 和 BitCPM 等稀疏推理与量化分支。在多模态工作负载中，最具体的机制是视觉 token 压缩：MiniCPM-V 2.6 称，它只用 640 个视觉 token
              就能处理 1.8M-pixel 图像；MiniCPM-V 4.5 又用统一 3D-Resampler，把 6 个 448x448 视频帧压缩为 64 个 token。部署对护城河故事同样重要。模型卡和
              V-Apps README 共同显示，它支持 Transformers、llama.cpp、vLLM、SGLang、GGUF 打包和完全离线移动应用，公开 RAM 下限从 MiniCPM5-1B 约 4GB 到
              MiniCPM-V 2.6 的 8GB 不等。因此，当买方想在严格时延、隐私或设备成本限制下获得像样的多模态能力时，这个产品最强。
