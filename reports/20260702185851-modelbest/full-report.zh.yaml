  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 包装信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - ModelBest / MiniCPM
        - 直接边缘模型初创公司
        - 核心文本栈采用 Apache 许可；多模态边缘模型；OEM 和受监管行业合作
        - 中国 OEM、应用开发者、受监管企业、边缘设备厂商
        - 跨手机、PC、座舱、机器人、可穿戴的多模态效率
        - 分发靠伙伴驱动，不是消费者驱动；搭载率经济性仍未披露
      - - Microsoft Phi
        - 全球直接 SLM 竞争者
        - MIT 许可的 SLM 家族；Azure Foundry 分发；端侧定位
        - 需要低成本、低延迟多语言推理的企业开发者
        - 端侧叙事清晰，企业工具和安全定位强
        - 分发强度依托 Azure；不是中国原生 OEM 切入口
      - - Google Gemma
        - 全球直接 SLM 竞争者
        - 开放权重；披露移动端内存占用；DeepMind / Google 开发者生态
        - 移动、浏览器、IoT 和本地应用开发者
        - 小模型打包和移动端优化文档充分
        - Google 生态触达强，但设备端商业集成要看开发者执行
      - - Apple Intelligence
        - 平台替代者 / 既有玩家
        - OS 级端侧模型；Foundation Models 框架可离线使用，按请求不收费
        - Apple 平台应用开发者和终端用户
        - 默认分发到 iPhone、iPad 和 Mac，并带隐私品牌背书
        - 生态封闭；不能作为通用跨平台开放模型使用
      - - Meta Llama 3.2
        - 全球直接 SLM 竞争者
        - 1B/3B 家族，128K 上下文，社区分发规模巨大
        - 重视生态、社区工具和量化本地使用的开发者
        - 开源心智很强，智能体 / 检索用例丰富
        - 自定义社区许可不如 MIT / Apache 同行宽松
      - - Mistral / Ministral 3
        - 全球直接 SLM 竞争者
        - Apache 2.0 小型密集模型家族，覆盖 3B/8B/14B，并主打自托管 / 本地部署叙事
        - 边缘、企业和主权部署
        - 许可宽松，自托管叙事强
        - 面向中国 OEM 渠道的优化不如 ModelBest 明确
      - - Alibaba Qwen
        - 中国平台既有玩家兼直接模型对手
        - 开放权重密集模型下探到 0.6B；8B+ 支持 128K；Alibaba 生态工具
        - 需要多语言或智能体模型的中国及全球开发者
        - 模型梯队宽，本地工具和应用生态触达强
        - 开放代码并不能消除对 Alibaba 控制产品入口的依赖
      - - Moonshot Kimi K2.6
        - 中国工作流替代者
        - 开源编程 / 智能体模型；免费用户档加付费计划；256K API
        - 优先看重编程、长周期执行和智能体集群的开发者
        - 智能体工作流卖点强，并提供 OpenAI 兼容 API
        - 主要优化方向不是手机级推理或 OEM 嵌入
      - - MiniMax M3
        - 中国工作流替代者
        - 1M 上下文多模态模型，宣称前沿编程 / 智能体能力；按 token 计划包装
        - 需要长上下文本地或托管智能体工作流的开发者
        - 把长上下文、多模态和编程能力打成一个包
        - 公开包装对独立定价和移动端占用披露较少
      - - Z.ai / GLM-5.1 模型
        - 中国工作流替代者
        - 智能体 / 聊天品牌，加上长周期编程文档和 OpenAI 式 API
        - 需要长时间自主执行的企业或开发者
        - 主打 8 小时任务，编程导向强
        - 小型、移动优先占用的定位不如 MiniCPM 或 Phi 清晰
      - - Baidu ERNIE 5.1
        - 中国既有玩家替代者
        - 国内旗舰模型，强调成本效率，并有既有搜索 / 企业基础设施
        - 中国企业、搜索和国产基础设施买方
        - 性价比叠加国内生态可信度
        - 开放权重可迁移性弱于 ModelBest、Phi、Gemma 或 Mistral
      - - OpenAI / ChatGPT
        - 现状云端替代方案
        - 云优先对话助手，默认心智很强
        - 愿意用云端助手而非本地模型的开发者或用户
        - 不需要离线、主权或逐设备推理时，它是最快默认路径
        - 既不是端侧开放模型，也不是中国原生 OEM 方案
    notes: 表中把直接边缘模型同行和更宽的工作流、平台替代者放在一起，因为 OEM 和企业买方可以用不止一种方式完成同一任务；未知项保持明示，不用厂商营销材料倒填。
