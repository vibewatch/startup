  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 中国监管和法律场景：备案、标识、网络安全和标准现在必须同时处理
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的第一层风险在于，产品表面已经足够宽，会同时落入中国多个相互重叠的 AI 管控制度。公司官网把 MiniCPM 放在手机、AI
              PC、智能座舱、具身机器人、可穿戴设备和法院网络法律工作流中；MiniCPM-o
              材料展示的是全双工语音和多模态交互，而不是简单文本模型。关键在这里：中国《生成式人工智能服务管理暂行办法》要求具有舆论属性或社会动员能力的服务完成安全评估和算法备案；2025 年 3 月的 AI
              生成内容标识规则要求显式和隐式标识、在用户协议中披露标识方法，并在提供未标识输出时留存 6 个月日志。CAC 2026 年 5 月的备案公告说明规则并未沉睡：2026 年 3–4 月又有 72
              项服务完成备案，已上线应用 还需要展示模型名称、备案号或上线编号。2026-01-01 生效的修订版《网络安全法》进一步抬高下行风险，把 AI
              服务运营与更强的个人信息和关键信息基础设施执法挂钩；严重情形下，罚款可升至 RMB10 million，并可能触发停业整顿式措施。在这个背景下，本章审阅的公开页面没有露出 ModelBest
              的备案号、公开标识声明或隐私政策链路，因此合规负担是具体、可跟踪的，不是理论风险。
