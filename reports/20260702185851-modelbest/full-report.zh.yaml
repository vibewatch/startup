companyProfile:
  summary: >-
    ModelBest（面壁智能），法定名称为北京面壁智能科技有限责任公司，是一家北京端侧模型创业公司，2022 年 8 月围绕 Li Dahai、Liu Zhiyuan 和 Zeng Guoyang 创立。公司脱胎于清华大学 NLP
    / OpenBMB 生态，把 MiniCPM 系列做成紧凑、面向部署的模型家族，用来替代只能跑在云端的前沿模型。公开来源显示，它的打法先靠 OpenBMB、GitHub 和 Hugging Face 做开源分发，再进入手机、AI
    PC、智能座舱、具身机器人、可穿戴设备和法律 AI 工作流等端侧与嵌入式部署场景。2024-2026 年连续融资后，2026 年 4 月的一轮融资把 ModelBest
    推过独角兽门槛，但收入质量、定价结构、治理和具体投资条款仍缺公开披露。
