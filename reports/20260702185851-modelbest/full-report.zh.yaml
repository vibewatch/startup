    rows:
      - - 收入桥
        - 月度确认收入、ARR 等效运行率、递延收入和渠道组合
        - 判断开源和部署牵引力是否真正支撑当前估值标记
        - 财务团队、审计资料包和董事会材料
      - - 定价和合同结构
        - OEM 分成、单设备定价、企业订阅条款、支持或服务组合、续约条款
        - 区分真实软件价值与补贴试点或劳务密集集成
        - 管理层数据室 + 头部客户合同审查
      - - 股权结构和优先权层级
        - 完整股本结构表、清算瀑布、反稀释、ROFR 和投资者权利
        - 定义当前名义估值下的实际下行保护和证券质量
        - 公司法律顾问和融资文件
      - - 毛利率 / 算力成本桥
        - 托管与边缘推理成本分摊、GPU 承诺和支持人员负担
        - 测试边缘部署是否真正改善单位经济性
        - FP&A 与基础设施运营审查
      - - 牵引力验证
        - 活跃付费部署、OEM 出货量和下载到付费转化的独立遥测
        - 把社区热度与可变现采用区分开
        - 合作伙伴确认、账单数据和平台看板
      - - 下一轮或退出路径
        - 下一轮融资、二级交易或上市流程的时间和结构
        - 当前估值部分依赖仍然打开的中国资本市场窗口
        - 董事会、领投方和投行顾问
    notes: 这些问题按它们能多快改变推荐结论或可接受入场价排序，而不是按获取难度排序。
    claimRefs:
      - CV002
      - CV012
