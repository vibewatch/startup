        - 驱动
        - 36Kr 和 Grand View 都称，本地处理比纯云端推理更快，也更能保护隐私
        - 当前
        - 网络质量或数据敏感性重要时，支撑边缘模型采用
        - ModelBest 部署中，有多大比例主要由隐私或延迟经济性支撑？
      - - AI+ 终端和智能体目标
        - 驱动
        - 国务院 AI+ 计划提出，终端 / 智能体渗透率到 2027 年超过 70%，到 2030 年超过 90%
        - 2025-2030
        - 智能终端和智能体式产品获得强政策顺风
        - 哪些被点名的重点品类已经能为 ModelBest 变现？
      - - 2026 年 AI 智能体指引和 19 个场景
        - 驱动
        - 国新办 / 新华社称，已在科研、产业、消费、民生和治理等领域明确 19 个应用场景
        - 近期
        - 扩大智能体式产品的合规用例
        - 哪些场景匹配 ModelBest 当前产品能力和合规准备度？
      - - 备案和标识制度
        - 驱动兼约束
        - 2023 年办法叠加 2025 年标识规则，带来审批、披露和可追溯义务
        - 持续
        - 准备充分的供应商可把它变成护城河，但也推高持续合规成本
        - ModelBest 哪些产品已经备案、打标，或通过注册主体分发？
      - - 内存涨价和手机需求疲软
        - 约束
        - IDC 关联的中国预测和 Counterpoint 都提到内存成本上升、中国设备需求放缓
        - '2026'
        - 可能拖慢出货，也压缩 OEM 为模型差异化付费的意愿
        - 如果 OEM 重新收缩中端机发布，ModelBest 的目标项目有多抗压？
      - - 中国 LLM 价格战
        - 约束
        - KrASIA 和 DigWatch 显示，市场出现极端降价、免费档和很低的 token 价格
        - 持续
        - 边缘效率因此更具战略价值，但按 token 或功能变现可能塌陷
        - ModelBest 按设备、API 或混合部署拆开的真实毛利率是多少？
      - - 美国芯片出口收紧叠加国产替代
        - 约束兼驱动
        - CNBC 报道 2026 年 5 月堵上漏洞；CSIS 认为管制会加速中国替代
        - 即期和中期
        - 它抬高算力不确定性，也让适配国产栈的高效模型更值钱
        - 训练端多依赖进口算力？推理端多能落到国产友好栈？
      - - OEM 和渠道议价权
        - 约束
        - 中国智能手机份额仍集中在头部 OEM，ModelBest 的上市路径也以合作伙伴为主
        - 结构性
        - 较小的模型供应商，拿到的价值可能少于掌握出货规模和 UX 入口的 OEM
        - ModelBest 收入在 OEM、品类和直接软件合同之间有多分散？
    notes: 几行刻意写成双刃剑。政策支持、硬件进步、本地化压力让端侧 AI 更容易被采用，也会强化 OEM 和监管方对模型供应商的议价权。
