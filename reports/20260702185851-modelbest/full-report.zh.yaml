        title: 成本结构和定价压力：端侧推理有帮助，但算力和开源仍压缩利润率
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的端侧优先策略在经济上直观：如果更多推理跑在用户设备或 OEM
              控制的硬件上，一部分集中式推理服务成本就能从公司损益表中移走。原始文档和应用仓库支撑这个逻辑，投资人评论也明确把更低部署和调用成本列为吸引力之一。问题是，公开记录同样显示，这还不足以推导出强利润率。MiniCPM-o
              官方演示架构仍假设 gateway、worker、backend、挂载权重、专用 GPU，以及每个初始化 worker 约 21.5 GB VRAM。更宽的中国 AI
              基础设施报道称，推理已成为主导商业工作负载，许多通用训推芯片在在线推理中利用率很差，成本控制仍是核心瓶颈。再叠加 ModelBest 的完全开放分发，利润率风险就很清楚：采用可以快速放大，但除非 OEM
              和企业合同足够自律，价格竞争和支持成本仍可能跑在货币化前面。
