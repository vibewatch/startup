      - number: '7.2'
        title: 开源、数据来源和安全风险：分发优势也会降低护城河、抬高合规负担
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的第二大风险在于，同一套开源和部署优先策略一边加速采用，一边放大合规和变现暴露。OpenBMB 称社区由 Tsinghua NLP Lab 与 ModelBest 共同发起，MiniCPM
              仓库可公开下载，代码采用 Apache 2.0 许可，README
              明确强调端侧部署和全双工多模态用例。这样做扩大了生态触达，但也让技术栈更容易被分叉、跑基准测试和重新封装，削弱靠保密支撑的定价权，并把价值捕获推向合同、集成或专有数据权。新的 TC260
              基线标准进一步加剧这个问题：它要求干净的数据来源、个人信息同意或其他合法基础、在用户协议中披露 IP 风险，并拒绝非法内容占比超过 5% 的训练来源。ModelBest
              自有公开材料又声称已在法院网络法律场景部署，把个人信息、文档来源和输出可靠性等敏感要求一并纳入负担。可是本章抓取的公开页面没有暴露公开隐私政策、用户协议、安全认证或事件响应页面；数据处理、模型治理控制和公开安全姿态仍是尽调空白。
