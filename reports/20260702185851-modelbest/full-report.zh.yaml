              汽车过程成熟度认证。相比没有公开工程表面的纯闭源模型厂商，这些信号实质更好。不过，公开控制面落后于能力面。MiniCPM-o 自己的文档承认，全双工全模态能力仍需改进，omni 模式下语音输出可能读错音；通用
