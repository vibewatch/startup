  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和当前估值标记
        blocks:
          - type: paragraph
            body: >-
              ModelBest 当前最有支撑的估值锚点仍是底线，而不是完整定价的估值标记。多篇 2026 年 4 月报道称，公司完成 2026 年第二轮融资，一季度累计融资超过 RMB1
              billion，并跨过大模型独角兽门槛。ThePaper 进一步把措辞收紧，称公司在 4 月融资后进入 "$1 billion 级别"。这些信号足以把约 $1 billion，或简写的 RMB7
              billion-plus，视为可信的当前头部估值。


              关键限制在于公开证据到此为止。同样验证独角兽门槛的 4 月报道，并未披露精确投后估值、完整稀释图景或投资人权利条款。CB Insights 公开公司页进一步强化不透明：它展示 2026 年 4 月 7
              日融资和投资人名单，但把估值遮为 $XXM，并在公开页把收入列为 0 FY undefined。换句话说，市场已经方向性地透露 ModelBest
              不再是小规模种子公司；但还没有给出足够信息，让人有信心承销确切证券价格。
