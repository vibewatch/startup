  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - ModelBest 专属 CAC 合规可见度
        - 公开产品页、应用详情页或公司披露
        - 到下一次尽调更新，仍看不到可见模型名称 + 备案 / 上线编号或标签声明
        - 将其上调为合规阻断项；在承销消费者或具社会影响力的场景前，必须先拿到证据。
      - - AI 标识执行
        - 观察到的产品输出或公司合规材料
        - 多模态服务已上线，但范围内输出没有明确标识、没有元数据证据，或用户协议没有相关语言
        - 将其视为中国消费者端部署准备度的论点破坏项。
      - - 先进算力采购韧性
        - BIS / 公司采购更新 / 供应商通知
        - 出口许可被拒、无法采购所需先进计算物项，或明显依赖受阻路径
        - 按更慢的训练 / 推理服务进展，重设发布节奏和估值。
      - - OEM 集中度和变现证明
        - 新客户披露或合同证据
        - 没有扩展到当前具名渠道之外，或证据显示旗舰项目仍是试点，未形成付费规模
        - 下调设备 / 座舱收入假设，只把重点放在有证据支撑的垂直场景。
      - - 价格战压力
        - 行业 API 降价公告和公司定价姿态
        - 市场继续普遍降价，而 ModelBest 没有披露附着价值或利润率保护
        - 把业务建模为集成 / 服务驱动，而不是模型授权驱动。
      - - 治理 / 股权结构复杂性
        - 董事会、融资或权利披露
        - 战略投资者权利实质限制商业灵活性，或制造关联方冲突
        - 要求治理条件，或把未来融资条款视为结构性更高风险。
      - - 安全 / 隐私治理
        - 公开政策页、事件披露或尽调室文件
        - 公司增加更多公开触点时，仍没有隐私政策、安全负责人或事件处理流程证据
        - 在治理控制得到证明前，冻结消费者端场景承销。
    notes: 这些触发器刻意设计成可从公司外部监测，方便下一次更新由事件驱动。它们不是泛泛的创业公司警示；每个触发器都对应本章已有证据中的特定合规、变现、合作伙伴或算力失效模式。
