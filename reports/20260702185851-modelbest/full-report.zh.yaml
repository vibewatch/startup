        - 融资、牵引力和可比样本都是真实的，但准确估值、收入和条款仍不透明
        - 保持覆盖，而不是直接给出硬性放弃或买入结论
      - - 风险评级
        - 高
        - 变现不透明、合同经济性不确定、资本市场敏感性仍然重要
        - 把任何交易都视为尽调强度高、且对条款清单敏感
      - - 估值立场
        - 偏高
        - 当前标记更多靠战略稀缺性和边缘 AI 期权价值，而不是公开财务证明
        - 要么拿到更好证据，要么要求更好价格
      - - 价格纪律
        - 没有审计收入和干净条款，就不在当前 $1B 级或更高估值投新钱
        - 公开收入或优先权层级都不足以支撑不计价格的买入结论
        - 只有数据室补齐主要缺口，才按当前价格重新评估
      - - 上调路径
