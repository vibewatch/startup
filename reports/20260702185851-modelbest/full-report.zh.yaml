        blocks:
          - type: paragraph
            body: >-
              ModelBest 的第四项风险，是在经济性不透明的情况下同时推进太多执行面。公司受益于清华系技术深度和异常强的资本联盟，但公开记录也显示，这种优势可能制造复杂性，而不是清晰度。QCC
              列出的投资人阵容拥挤，涵盖电信、国资、产业和战略投资方，包括 China Telecom Investment、北京 AI 产业基金、Shenzhen Capital、Hubble 相关资本，甚至竞争对手
              Zhipu。Caixin 2024 年画像已经把商业化列为关键问题，2025 年后续报道又称 ModelBest 一年多完成三轮融资，却仍未披露该轮确切金额或估值。InfoQ 随后报道，2026 年一季度融资超过
              RMB1 billion，ModelBest 正从模型延伸到 Pinea Pi、EdgeClaw Box
              等硬件产品。这证明公司有野心，但也意味着投资人要同时承销模型研发、芯片适配、产品化和硬件系统执行，而且没有公开收入、定价或客户集中度披露。由此产生的风险，不是 ModelBest
              缺少资本或伙伴兴趣；而是公开证据仍无法说明这些关系能否产出持久毛利、续约行为或简单治理结构。
