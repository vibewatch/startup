      - number: '2.4'
        title: 政策顺风与商业化关口同时放大市场、筛选玩家
        blocks:
          - type: paragraph
            body: >-
              中国政策组合一边扩大机会，一边抬高参与门槛。2023 年 CAC 和 MIIT 生成式 AI 措施把面向公众的服务纳入监管，要求内容治理、用户数据保护，并且对部分服务要求安全评估和备案。2025
              年标识规则又在生成和分发链条上加入显式与隐式标识要求。与此同时，国务院 2025 年 AI+ 行动设定了激进的国家目标：到 2027 年，新一代智能终端和智能体渗透率超过 70%；到 2030 年超过
              90%；并明确优先发展 AI 手机、AI 电脑、网联汽车、可穿戴设备、智能家居和智能体应用。2026 年 5 月 AI 智能体指引又增加了运营层，定义智能体并识别 19 个应用场景。CAC 2026 年 4
              月备案总数也显示了规模：截至 4 月 30 日，已有 868 项生成式 AI 服务备案、530 个应用或功能完成登记。对 ModelBest
              来说，这是顺风，也是门槛：政策让端侧部署更合法，却把备案、标识和可追溯性变成反复要做的商业化工作。
