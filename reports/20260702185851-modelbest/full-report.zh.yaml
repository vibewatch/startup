      - number: '2.5'
        title: 硬约束：内存成本、价格战、出口管制和缺失的份额数据
        blocks:
          - type: paragraph
            body: >-
              市场方向有吸引力，但经济账仍难。内存成本上涨后，Counterpoint 对中国智能手机的展望恶化：其 2025 年 12 月观点还预计 2026 年下滑 5%，到 2026 年 4 月更新时已恶化至
              9%，OEM 已开始涨价，并更多依赖高端 AI 功能刺激换机需求。API 层也承压。KrASIA 和 DigWatch 显示，中国模型价格战中，Alibaba 将 Qwen-Long 定价下调 97%，Baidu
              向部分企业用户免费开放模型，ByteDance 早已重置价格地板。出口管制是另一道约束：CNBC 报道，美国在 2026 年 5 月堵上一个漏洞，此前总部在中国的公司可在海外无需许可证获得先进芯片；CSIS
              则认为同一批管制也会加速中国替代。最后，本次审阅的公开来源没有一个披露 ModelBest 在 AI 手机、AI PC 或智能座舱中可归因的付费份额，所以本章能展示需求扩张，却还不能证明这些价值有多少会落到
              ModelBest，而不是它的 OEM 伙伴手里。
