    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线：一个端侧模型产品族，覆盖文本、多模态、全模态语音和打包移动应用
        blocks:
          - type: paragraph
            body: >-
              ModelBest 交付的产品不是单一托管模型端点，而是一套分层 MiniCPM 产品族，能映射到具体终端用户任务。公司官网把这个家族放在手机、AI PC、智能座舱、具身机器人、可穿戴设备、GUI
              智能体体验和法律工作流周围，这和泛聊天机器人定位有实质差异。基础文本线仍重要：公开 MiniCPM 历史从 MiniCPM-2B，到 2B-128k、MoE 和 1B 变体，再进入 MiniCPM3-4B
              以及更新的 4.x 和 5-1B 系列。在这个文本骨干之上，ModelBest 叠加 MiniCPM-V 用于图像、视频、OCR 和文档解析；MiniCPM-o
              用于实时语音和实时多模态流；MiniCPM-V-Apps 则用于完全本地的 iOS、Android 和 HarmonyOS 打包。这种宽度是本章关键产品事实：ModelBest
              卖的是一套可复用的端侧部署栈，服务多个任务，而不只是一张基准测试表。限制在于，公开证据对公司能打包和演示什么更强，对这些表面已有多少进入规模化生产项目则弱得多。
