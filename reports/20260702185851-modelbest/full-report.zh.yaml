      - number: '8.3'
        title: 可比公司组与中国资本市场背景
        blocks:
          - type: paragraph
            body: >-
              合适的可比框架不是单一整洁倍数，而是一组区间。站在中国私有模型稀缺性的高端，Moonshot 以 $20 billion 估值融资约 $2 billion；公开来源称其 4 月 ARR 超过 $200
              million。DeepSeek 首轮外部融资据报估值超过 $50 billion；StepFun 2026 年 pre-IPO 融资传闻从投前 $4-6 billion 到预期 $10 billion
              基石标记不等。公开市场侧，Zhipu 和 MiniMax 说明，即便大模型发行人仍亏损，香港投资人也愿意支付有意义的稀缺溢价；Palantir 和 C3.ai 则提供上下沿公开市场倍数锚点，且收入账本透明得多。


              中国 2026 年资本市场背景很重要，因为它解释了 ModelBest 头部价格为什么并非天然荒谬。CB Insights 称 2026 年 Q1 AI 融资异常集中在超级轮次领头公司；KPMG 称香港 2026
              年 Q1 IPO 募资额全球第一，录得 6 家专门科技上市和 366 个有效申请。Reuters 1 月 MiniMax IPO 报道补充了短期情绪信号：香港刚经历 2021 年以来最强 IPO 年，AI /
              芯片发行人正迎着强劲投资人需求入场。这个环境能支撑 ModelBest 当前头部估值标记。但环境本身不能让这个价格具备吸引力，因为 ModelBest 披露出的变现成熟度远落后于
              Moonshot，也远不如任何公开可比公司透明。
