      - number: '3.4'
        title: 护城河耐久性：开源有帮助，但前提是 ModelBest 把效率转成粘性渠道
        blocks:
          - type: paragraph
            body: >-
              反向证据很直接。开源可得性现在很常见，不再稀缺。Phi 使用 MIT 许可，Mistral 新小模型使用 Apache 2.0，Gemma 是开放权重并允许负责任商业使用，Qwen3 稠密模型是 Apache
              2.0，Kimi K2.6 和 MiniMax M3 强调开放权重或即将开放权重分发，Llama 3.2 虽许可更受限，却拥有庞大社区。同时，Apple 的 Foundation Models 框架让任何 iOS
              开发者可按每次请求免费使用端侧 AI，中国消费端领先者也已经掌握远大于 ModelBest 的应用分发。上述事实削弱了任何“MiniCPM 只靠开放性或基础端侧效率就能自我防御”的说法。


              ModelBest 仍有可成立的护城河，但比营销叙事更窄、条件更多。MiniCPM 最好的证据是跨平台多模态效率：MiniCPM-V 4.6 声称在微小规模下，相比 Gemma、Qwen 和 Ministral
              有更好的视觉语言效率；公司在中国也有真实的 OEM、云和受监管行业关系。买方如果想要本地部署、中国生态适配，并且不想被单一外国云或 OS
              供应商绑定，这个组合可能重要。缺失的证明是商业粘性：搭载率、续约条款、实际收入，以及 Geely、Huawei、Baidu Cloud 等伙伴究竟把 ModelBest
              视作核心基础设施，还是众多可替换模型中的一个。证据出现以前，MiniCPM 作为强产品家族看起来有耐久性；作为独立护城河，耐久性最多中等。
