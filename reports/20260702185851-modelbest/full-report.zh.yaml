            body: >-
              为什么一家没有公开收入披露的公司也能有 $1B 级估值标记？因为 ModelBest 确实有投资人看得见的资产。官方和面向开发者的来源显示，它拥有真实的端侧模型资产：公司把 MiniCPM
              放在手机、AIPC、智能座舱、机器人、可穿戴设备和法律工作流里；OpenBMB 把公司与清华根基的开源生态绑定；GitHub 和 Hugging Face 则显示 OpenBMB 组织页上有大量活跃触点，包括
              MiniCPM 仓库、演示、合集和 158 个托管模型。媒体报道也持续引用累计下载超过 24 million 和具名汽车部署。


              但这些都不是变现证明。24 million 这个数字来自公司经媒体转述，而不是经审计遥测数据。审阅的公开资料没有披露 ModelBest 收入、ARR、客户数、价目表、OEM
              分成、毛利率桥或优先权结构。Caixin 和 Tencent 报道把反向因素讲得很清楚：商业化仍是未解测试，反复融资仍重要，汽车座舱赛道拥挤到即便技术故事不错也可能无法放大。Li Dahai 2026 年 6
              月的表态也再次说明，难点是芯片、内存、带宽和软件的生态执行，不只是模型质量。这让估值讨论仍围绕战略期权价值，而不是已经验证的损益表。
