  - id: TP004
    title: 护城河持续性 / 竞争风险清单
    columns:
      - 护城河主张
      - 竞争威胁
      - 严重性
      - 证据
      - 缓释 / 尽调要求
    rows:
      - - 跨平台多模态端侧效率
        - Phi、Gemma、Ministral 和 Qwen 现在都在主打高效开放模型；Apple 在自有 OS 内提供免费端侧 API
        - 高
        - MiniCPM-V 4.6 移动部署主张，对照 Gemma/Qwen/Ministral，加上 Apple Foundation Models 零成本打包
        - 要求提供前五大端侧竞争对手的归一化设备基准、时延和功耗
      - - 开源战略和开发者好感
        - 开源赛道已很拥挤：Phi（MIT）、Mistral（Apache）、Gemma（开放权重）、Qwen（Apache）、Kimi 和 MiniMax 都在争同一批心智
        - 高
        - 各同行的公开许可和仓库证据
        - 要求 ModelBest 按模型家族提供真实下游采用、stars、下载量和商业转化
      - - 中国 OEM 和受监管行业准入
        - 伙伴主导的分发可以很强，但也会把议价权集中到 Huawei、Geely、Baidu Cloud 等更大交易方手中
        - 中高
        - ModelBest 伙伴名单很长，但经济性未披露
        - 要求提供合同期限、续约机制、排他性、附加率和按伙伴划分的收入集中度
      - - 信任与合规叙事
        - Apple 隐私、Microsoft 企业安全、Mistral 自托管和 Baidu 国内基础设施，都提供了替代信任锚
        - 中
        - 信任叙事不同，削弱 ModelBest 的独特性
        - 询问客户为何选择 MiniCPM 而非这些其他信任模型，以及该选择是否粘性足够
      - - API / 模型层切换成本低
        - OpenAI 兼容 API 和标准开源推理栈让多栖部署很容易
        - 高
        - Kimi 和 GLM API 兼容性，加上 MiniCPM、Gemma、Llama、Mistral 共用框架
        - 用代表性应用测试 MiniCPM、Kimi、GLM 和 Gemma 之间的迁移时间
      - - 消费者或开发者默认入口
        - AICPB 排名显示，中国头部 AI 应用以及 Apple / Meta 平台的默认触达远大于 ModelBest
        - 高
        - ModelBest 缺席前 50 应用排名；在 MAU 或生态分发上，现有巨头占优
        - 要求提供直接用户遥测，并证明伙伴嵌入带来的是经常性使用，而不是被动安装
    notes: 严重性衡量的是 ModelBest 竞争耐久度的风险，而不是整体端侧 AI 需求的风险。关键区别在于：技术很强的产品家族，是否真的变成商业粘性护城河。
