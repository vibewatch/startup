            body: >-
              开发者分发是最强的公开证据点之一。OpenBMB 的 GitHub 和 Hugging Face 表面显示，MiniCPM 被维护成一个宽发布家族，而不是一次性废弃的研究发布；仓库也有实质社区规模：访问日
              MiniCPM 仓库超过 9.5k GitHub stars，MiniCPM-V 仓库超过 25k，V-Apps 仓库一直活跃到 2026 年 7 月。Hugging Face
              组织页也显示了很深的目录，ModelScope 至少为 GGUF 打包增加了一条伙伴分发路径。路线图节奏同样真实。公开历史显示，MiniCPM-2B 在 2024 年初发布，2B-128k 和 MoE 后续在
              2024 年 4 月，MiniCPM3-4B 在 2024 年 9 月，MiniCPM-o 2.6 在 2025 年 1 月，MiniCPM-V 4.5 在 2025 年，MiniCPM5-1B 加
