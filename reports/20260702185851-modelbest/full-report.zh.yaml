  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：ModelBest 位于端侧模型层，不等于整个 AI 经济
        blocks:
          - type: paragraph
            body: >-
              ModelBest 自己的材料并没有描述一个宽泛的云端模型平台；它描述的是一家公司，试图把大模型放到最贴近用户的手机、AI PC、智能座舱、具身机器人、可穿戴设备和其他终端上。MiniCPM
              仓库也强化了这个框架，强调适合本地部署和资源受限环境的紧凑模型。36Kr 和 Gasgoo 的独立报道指向同一方向：ModelBest 被定位为早期边缘智能厂商，商业路径穿过
              OEM、芯片伙伴和终端部署，而不是纯公共云流量。因此，真正的市场包括端侧模型集成、本地推理软件、座舱
              AI，以及对隐私敏感的本地部署；它排除了大部分上游云训练资本开支，也排除了相当一部分泛应用经济支出。换句话说，ModelBest 竞争的地方，是 NPU 能力、模型压缩、OEM
              集成以及隐私或时延约束比模型参数规模头条更重要的地方。
            claimRefs:
