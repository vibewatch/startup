      - number: '8.5'
        title: 最终尽调问题和打破投资逻辑的触发器
        blocks:
          - type: paragraph
            body: >-
              估值缺口异常集中在少数可以补齐的尽调事项上。投资人需要月度收入和毛利率桥、真实 OEM
              和企业定价结构、股权表和清算瀑布、活跃付费部署相对开源下载的独立遥测数据，以及任何可能让头部独角兽估值在经济上弱于表面的条款。没有这些，当前价格更像战略叙事，而不是经过承销的证券。


              打破投资逻辑的触发器也同样具体。如果新一轮融资低于当前头部估值，说明估值支撑比表面更薄。如果披露的收入桥相对装机基础仍显得太小，说明开源牵引力没有转化为变现。如果优先权结构
              或治理结构大幅压低新投资人优先级，即便公司质量仍强，证券质量也会改变。若 ModelBest 证明收入之前，中国 AI 融资或香港专门科技窗口转弱，当前估值标记内嵌的战略溢价可能很快压缩。
