      - - Moonshot AI（私有，2026 年 5 月）
        - ARR 在 2026 年 4 月超过 $200M
        - $20B 估值；按披露下限约 100x ARR
        - 带有最新估值数据的中国开放权重变现最佳可比
        - 变现基础大得多，API / 订阅面也比 ModelBest 更宽
      - - Zhipu AI（香港上市，2026 年 1 月）
        - H1 2025 收入 CNY190.9M；H1 净亏损 CNY2.4B
        - 2026 年首日收盘市值 $7.4B
        - 说明即便亏损，香港也会给 AI 稀缺性定价
        - IPO 定价和早期流通盘动态会高估稳态价值
      - - MiniMax（香港上市，2026 年 1 月）
        - 首日市值 >$11.5B；9M25 净亏损 $512M
        - 公开市场接受了一家市值 $11.5B+ 的亏损 AI 发行人
        - 有用的中国 AI 公开发行先例
        - 首日估值波动大，业务组合也比 ModelBest 更全球化
      - - StepFun（IPO 前，2026 年）
        - $4B 第一批投前；$5-6B 第二批；预期约 $10B 基石估值
        - 后期私募 / IPO 过渡期定价
        - 另一家偏设备与分发的中国 AI 创业公司
        - IPO 前条款仍未官方确认，并且继续依赖上市窗口
      - - DeepSeek（私有，2026 年 6 月）
        - 未披露公开收入；首轮外部融资估值 >$50B
        - '> $50B 估值，并带有不寻常的控制权和锁定条款'
        - 中国前沿模型稀缺性的上界
        - 控制权结构和缺少收入披露，削弱直接可比性
      - - Palantir（公开，2026 年 7 月）
        - TTM 收入 $5.22B
        - 市值 $309.97B；59.25x P/S；57.76x EV/Sales
        - 有真实收入和盈利能力的成熟 AI 平台，可作为公开市场上界
        - 比 ModelBest 成熟、全球化、财务透明得多
      - - C3.ai（公开，2026 年 7 月）
        - FY2026 收入 $250.3M；31% GAAP 毛利率
        - 市值 $1.41B；5.64x P/S；3.57x EV/Sales
        - 执行承压 AI 软件公司的较低公开基准
        - 不是边缘模型平台，公开市场情绪也明显弱于中国稀缺性可比对象
