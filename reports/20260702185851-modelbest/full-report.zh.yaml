  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 当前建议来自一个真实的边缘 AI 切入点，但它撞上了商业化证明缺失和证券条款不完整。
    data:
      nodes:
        - id: edge
          label: 边缘模型牵引力
          detail: MiniCPM 横跨手机、座舱、AIPCs、机器人和法律工作流。
          tone: positive
        - id: investors
          label: 战略投资者支持
          detail: China Telecom、Shenzhen Capital 和产业投资者托住了当前估值底部。
          tone: positive
        - id: opensource
          label: 开源触达
          detail: 披露的 24M+ 下载量和 158 个托管模型，显示生态注意力真实存在。
          tone: positive
        - id: disclosure
          label: 披露缺口
          detail: 公开材料没有收入、定价、毛利率或优先权清单。
          tone: warning
        - id: competition
          label: 商业化风险
          detail: 开源分发和拥挤的座舱竞争可能削弱定价权。
          tone: warning
        - id: decision
          label: 继续研究 / 估值偏紧
          detail: 公司有可投性，但以当前估值看，还不是可以不看价格就买的证券。
          tone: neutral
      edges:
        - from: edge
          to: decision
        - from: investors
          to: decision
        - from: opensource
          to: decision
        - from: disclosure
          to: decision
        - from: competition
          to: decision
    approximationNotes: 该流程是定性而非概率模型；它映射的是保留公开证据所暗示的当前决策链。
    claimRefs:
