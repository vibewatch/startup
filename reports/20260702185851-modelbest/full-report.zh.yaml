      - number: '8.4'
        title: 牛 / 基准 / 熊情景逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              以目前证据水平，正确建议是继续研究，估值立场是偏高。原因不是 ModelBest 缺少战略价值，而是 $1B 级 入场价已经要求投资人相信，开源牵引力和伙伴部署会在中国 AI
              稀缺性热度降温前转化为有意义、可审计收入。没有公开收入基底时，合适方法是里程碑和情景分析，不是假精确 DCF 或单一收入倍数。


              牛市情景下，ModelBest 把下载量和 OEM 布点转化为真正的经常性软件经济性，证明清晰收入桥，并继续受益于中国 AI 融资和 IPO 市场支持；这可以支撑 $1.3-1.8 billion
              区间。基准情景下，部署证明继续增加，但变现仍只部分披露，当前 $0.9-1.1 billion 区域更接近公允，而非便宜。熊市情景下，开源使用主要停留在社区，OEM
              交易更像战略试点而不是持久软件收入，或资本市场不再奖励稀缺性，价值可能滑回约 $0.6-0.8 billion。升级路径因此取决于证据或价格：要么有更好的经审计证明，要么有更好的入场价。
