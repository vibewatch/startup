  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接端侧模型同业、平台巨头与工作流替代品
        blocks:
          - type: paragraph
            body: >-
              ModelBest 同时在不止一个市场竞争。最窄的一层，MiniCPM 对打的是同样承诺本地推理、移动部署或更优单位参数智能水平的小模型与效率型模型家族：Microsoft Phi、Google
              Gemma、Meta Llama 3.2、Mistral 的 Ministral 系列，以及 Alibaba 较小的 Qwen
              变体，都属于这一类。OEM、应用开发者或企业团队决定把哪种开放或半开放基础模型跑在用户身边，而不是跑在超大规模云里时，这些是最干净的“同一任务”比较。更宽的一层，只要买方更在意代码、长上下文、工具使用或打包生态服务，而不是纯粹的端侧极简，ModelBest
              也会和 Moonshot Kimi、MiniMax、Z.ai / GLM、Baidu ERNIE 等更大的中国智能体模型厂商竞争。


              替代品集合还要更宽。Apple Intelligence 不是作为开放模型出售，但它是强力嵌入式替代，因为 Apple 让任何应用都能离线、免费调用端侧 Apple Intelligence 功能。OpenAI
              的 ChatGPT 是另一种替代：它云优先而不是端侧优先，但开发者和用户仍可能直接采用默认助手，而不是接一套本地栈。内部自建也是现实选项，因为许多竞争对手提供开放权重、标准 transformer 接口或
              OpenAI 兼容 API，让买方更容易组装私有栈，而不是押注单一供应商。
