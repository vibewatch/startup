      - number: '7.3'
        title: 算力、伙伴和竞争风险：出口管制、国产芯片生态不成熟、OEM 集中和价格战相互强化
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的第三组风险不在模型权重本身，而在算力获取、伙伴集中和商品化的市场结构。BIS 2026 年 5 月 31 日指引和 6 月 17 日 FAQ 明确，先进计算许可要求仍适用于总部位于
              Country Group D:5 或最终母公司位于该组别的实体，即使采购主体设在中国境外；CNBC 报道称，这条规则针对通过 Malaysia
              等地海外子公司流转的路径，出口商仍应申请许可。与此同时，Tencent 2026 年 6 月对 Li Dahai 的采访称，ModelBest 当前瓶颈是芯片、内存和带宽的共建，国产软件生态仍显著不如
              Nvidia 完整。CNBC 和 CSIS 描述的中国解法，是用廉价电力和补贴支撑大规模 Huawei 芯片集群，但这条路比 Nvidia 系统消耗更多芯片和电力。下游公开部署记录也很集中：Gasgoo 和
              Tencent 主要指向 Geely、Volkswagen、Changan、GAC 以及 Geely Galaxy M9 座舱项目等汽车和设备伙伴。这个集中风险发生在中国模型市场重新定价的同一时点。KrASIA
              和 Digital Watch 显示 Alibaba、Baidu 把 API 价格压到接近零边际水平；消息源称，超大云厂商或许还能靠云服务绑定变现，但对小型创业公司明显更难。因此 ModelBest
              面临复合风险：供应约束可能拖慢进展，而定价权和伙伴议价力正同时转向不利于独立实验室的方向。
