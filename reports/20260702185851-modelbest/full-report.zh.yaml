              嵌入；法律和工业场景中的企业与本地部署；以及通过集成、支持和定制把开源转成企业收入。同一批证据也解释了为什么投资核验困难：公司看起来商业上真实，但公开材料没有标价到实际成交价的桥，没有公开合同排期，也没有披露
              OEM 经济性到底是授权费、分成、打包支持，还是战略性交叉补贴。开源分发显然帮助采用，但也意味着收入质量取决于合同结构，而不是公开用量定价。
