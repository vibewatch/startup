      - number: '2.3'
        title: 买方地图：设计导入和本地工作流批准，比独立应用份额更关键
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的市场路径与消费者聊天机器人公司结构上不同。公司公开披露了与车企、手机或 PC 生态、芯片厂商、机器人硬件玩家的合作，Gasgoo 也把其商业化直接连到汽车、智能手机、PC
              和智能家居部署。这意味着真正买方通常是 OEM 产品团队、平台方、芯片伙伴，或企业和公共部门部署方，而不是终端用户。在智能手机和 AI PC 里，实际决策者是 OEM 或平台团队，他们判断本地 AI
              功能是否值得付出内存、NPU 和集成成本。在汽车里，买方是掌握座舱架构和上市节奏的车型项目负责人。在受监管的本地部署里，买方是看重隐私、时延和本地控制的 IT
              或合规组织。这种结构把价值捕获从零售应用使用量，转向设计导入、产品周期节奏和伙伴集中度；因此，即便设备级 AI 普及加速，议价权仍可能很高。
