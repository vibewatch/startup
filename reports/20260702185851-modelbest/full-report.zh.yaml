              billion，并把公司推入独角兽估值门槛。这些投资人的战略逻辑也异常明确：Shenzhen Capital 把 ModelBest 的智能密度路径与更低部署和调用成本联系起来，Huichuan /
              Inovance 把公司视为工业自动化和机器人领域的契合对象，China Telecom
              则被描述为云-网-端分发盟友。这是一组真实资本栈，也可能降低近期融资脆弱性。但它仍没有回答投资核验问题。抓取来源没有提供现金余额、月度烧钱速度、现金跑道、债务或已承诺算力支出，也没有可访问的官方投资人公告或备案能超越媒体报道，把证据链闭合。
