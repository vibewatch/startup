      - number: '3.3'
        title: 分发、信任姿态和切换成本更偏向既有巨头，而不是 ModelBest
        blocks:
          - type: paragraph
            body: >-
              分发力让这个领域变得不对称。Apple 可通过 iPhone、iPad 和 Mac 装机量推送端侧模型；Microsoft 通过 Azure Foundry 和更宽的企业栈分发 Phi；Meta
              受益于庞大开源社区和数亿下载；中国消费互联网巨头则控制巨大的 AI 应用表面。AICPB 2026 年 4 月排名显示分发有多集中：Doubao 以 336.04 million MAU 领先，Qwen 为
              220.35 million，Quark 为 162.30 million，DeepSeek 为 138.98 million，Kimi 为 25.33 million。ModelBest 未进入前 50
              名，因此它走向重要性的路径是伙伴嵌入，而不是终端用户拉动。


              信任姿态更混合。ModelBest 有可信的本地信号——法院网络部署、北京重点实验室、ASPICE L2 汽车过程认证——这些对受监管买方和 OEM 买方重要。但竞争对手也以不同形式提供信任：Apple
              强调隐私和 Private Cloud Compute；Mistral 强调自托管和欧盟托管选项；Microsoft 称 Phi 已经过安全后训练，可用于生产；Baidu 则把 ERNIE
              包装成已整合进国内基础设施的高性价比旗舰。模型层切换成本看起来偏低，因为 Kimi 和 GLM 暴露 OpenAI 兼容 API，MiniCPM、Gemma、Mistral、Llama 和 Qwen
              都支持标准开源推理栈。因此，锁定效应如果存在，更可能来自 OEM 渠道、操作系统、应用分发或企业采购，而不是模型 API 或权重格式本身。
