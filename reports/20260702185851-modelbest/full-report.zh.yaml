  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 提供方
      - 价格 / 计费单位
      - 打包方式
      - 包含内容
      - 未知项 / 含义
    rows:
      - - ModelBest / MiniCPM
        - 开放权重本地使用；公开页面没有给出统一 API 价格表
        - Apache 许可仓库加 OEM / 伙伴部署
        - 文本与多模态端侧模型、框架支持、OEM / 渠道集成
        - 经济性取决于伙伴合同，而不只是公开模型访问
      - - Microsoft Phi
        - 检索到的模型页面没有发布推理标价；模型可通过 Azure Foundry 和 MaaS 使用
        - MIT 许可模型加 Azure 托管目录
        - 3.8B 小模型、128K 上下文、函数调用、多语言支持
        - 即使没有透明的公开端侧设备单价，企业买家侧的打包仍很强
      - - Google Gemma
        - 开放权重；本地推理经济性取决于硬件占用，而不是 token 价格
        - 通过开发者生态和移动优化变体发布开放权重
        - 2B/4B 小型移动模型、量化移动路径、多模态
        - 自托管用户切换成本低，但设备总成本取决于硬件约束
      - - Apple Intelligence
        - 应用开发者使用端侧模型时没有按请求收费
        - OS 原生框架和 API
        - 离线端侧推理，加上升级调用 Private Cloud Compute
        - 在 Apple 自有生态内，第三方很难在边际成本上打赢
      - - Meta Llama 3.2
        - 模型访问需接受许可；本地成本取决于所选量化方案和硬件
        - 开放访问下载，附自定义社区许可
        - 1B/3B 模型、128K 上下文、量化端侧用例
        - 尽管开发者访问面广，商业打包不如 MIT / Apache 同行顺滑
      - - Mistral / Ministral 3
        - API 定价存在，但检索到的页面更强调开放权重和部署选项，而不是醒目标价
        - Apache 2.0 权重加 Mistral 平台 / 云伙伴
        - 3B/8B/14B 端侧模型、自托管、企业支持
        - 主要拼部署可迁移性，而不是简单的按 token 价格表
      - - Alibaba Qwen
        - 开放权重 Qwen3 稠密模型；托管访问可通过 Alibaba 工具路由
        - Apache 2.0 小型稠密模型加云 / 应用生态
        - 0.6B-32B 稠密范围、本地框架、智能体支持
        - 打包优势来自 Alibaba 分发，而不只是原始模型价格
      - - Moonshot Kimi K2.6
        - 用户端免费访问并提供付费计划；API 文档指向单独定价文档
        - 开源模型加 OpenAI 兼容 API
        - 256K 上下文、多模态、工具使用、编码 / 智能体工作流
        - 开发者打包不错，但检索到的页面只给出部分价格透明度
      - - MiniMax M3
        - Token Plan 用户价格不变，同时获得更强性能
        - 模型页面、Token Plan 打包、开源 / 本地路线图
        - 1M 上下文、多模态、编码 / 智能体流程
        - 打包有吸引力，但公开单位经济性仍不如 Apple 或纯开放权重模型明确
      - - Z.ai / GLM-5.1 模型
        - 公开文档强调 API 用法，而不是简单标价
        - 智能体 / 聊天品牌，加面向编码的 API 文档
        - 推理模式、65,536 最大输出 token、长周期编码
        - 即使价格透明度有限，类 OpenAI 接口也会降低迁移成本
      - - Baidu ERNIE 5.1
        - 检索到的发布内容强调 6% 相对训练成本，而不是公布客户价格
        - 国内平台加旗舰模型发布
        - 智能体 RL、成本效率、榜单定位
        - Baidu 更靠捆绑生态经济性竞争，而不是公开开放权重打包
    notes: 本表比较商业打包经济性、开放程度和买方摩擦，而不是假装每个竞争者都披露同一套按 token 标价。Apple 的“按请求零成本”和开放权重访问，是已检索来源集中最可比的公开经济性指标。
