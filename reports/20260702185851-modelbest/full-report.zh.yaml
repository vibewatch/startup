        title: 身份、起源与端侧模型定位
        blocks:
          - type: paragraph
            body: >-
              ModelBest 以北京面壁智能科技有限责任公司为法律主体，公开来源把成立时间放在 2022 年 8 月。抓取到的 2026
              年融资资料一致把它描述为一家北京创业公司，源自清华大学自然语言处理生态；OpenBMB 自己的材料也称，开源社区由清华 NLP Lab 和 ModelBest
              联合发起。公司并不把自己包装成通用前沿模型实验室：官网称，它想把大模型放到最贴近用户的地方，覆盖手机、AI PC、智能座舱、具身机器人、可穿戴设备和法律 AI 工作流。官网、GitHub 仓库和 Hugging
              Face 组织页共同指向 MiniCPM：一个紧凑、面向部署的模型家族，靠知识密度和设备效率取胜，而不是纯拼参数规模。
