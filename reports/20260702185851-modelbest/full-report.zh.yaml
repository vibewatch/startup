      - number: '2.2'
        title: 市场测算需要多副镜头，因为公开估算描述的是不同层
        blocks:
          - type: paragraph
            body: >-
              没有一个公开数字能干净衡量 ModelBest 的可服务市场，所以本章并列保留多副镜头，而不是硬凑一个 TAM。设备普及是最清晰的近期镜头：IDC 的全球预测把 GenAI 手机放在 2024 年 234.2
              million 台、2028 年 912 million 台；Counterpoint 预计，2026 年具备 GenAI 能力的设备将达到全球智能手机出货量的 45%。中国需求也很大：IDC
              关联报道预计，2026 年中国智能手机出货约 278 million 台，其中 147 million 台是下一代 AI 手机，渗透率为 53%。AI PC 是第二副镜头，Counterpoint 称具备 AI
              或 GenAI 能力的笔记本在 2024 年已拿下 27% 市场，2025 年可能接近 60%。第三副镜头是更宽的端侧模型经济，但这些数字彼此冲突，因为范围并不相同：Grand View 把 2025 年端侧
              AI 市场估为 USD 10.76 billion，BCC 把边缘 AI 估为 USD 11.8 billion，MarketsandMarkets 则把边缘 AI 硬件估为 USD 26.14 billion。
