      - number: '3.2'
        title: 能力、开放度与打包：ModelBest 很强，但并不孤单
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的正面案例成立。公司把 MiniCPM 定位到手机、AIPC、座舱、机器人和可穿戴设备；MiniCPM 仓库把 MiniCPM5-1B 描述为 1B 级端侧 SOTA
              模型；MiniCPM4.1 强调 128K 上下文下的稀疏注意力提速；MiniCPM-V 系列则声称每参数多模态质量异常强，并支持 iOS、Android 和 HarmonyOS
              移动部署。相比只能跑在云端的代码模型，这更适合 OEM 和中国端侧设备建设者。


              但竞争集合已经向同一个设计中心收敛。Microsoft 明确把 Phi 营销为可在无云连接情况下端侧使用的开源 SLM，Phi-4-mini 有 3.8B 参数、128K 上下文和函数调用。Google 现在提供
              Gemma 4 E2B / E4B，面向移动和 IoT 部署，并公布移动内存占用。Meta 的 Llama 3.2 有 1B 和 3B 尺寸，支持量化端侧用例，但采用自定义社区许可，而不是 MIT 或
              Apache。Mistral 发布了 3B、8B 和 14B 尺寸的 Ministral 3 模型，按 Apache 2.0 用于端侧和本地部署。Qwen3 将稠密开放权重模型下探到
              0.6B；Moonshot、MiniMax、GLM 和 ERNIE 也越来越围绕智能体编码、多模态或长程执行优化。含义很直接：ModelBest
              并不独占“高效开放模型”；它必须在跨平台部署、多模态效率和中国本土商业集成等执行细节上赢。
