  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值对商业化证明最敏感，而不是对又一条增量牵引力新闻最敏感。
    data:
      items:
        - label: 经审计收入转化桥
          value: 5
          detail: 判断当前估值是合理还是偏紧，最缺的就是这项输入。
          tone: warning
        - label: OEM / 企业定价条款
          value: 5
          detail: 合同经济性决定部署更像软件，还是更像服务。
          tone: warning
        - label: 毛利率 / 算力成本证明
          value: 4
          detail: 只有离端成本和支持负担守得住，边缘部署才有帮助。
          tone: warning
        - label: 中国 AI 稀缺溢价
          value: 4
          detail: Q1 2026 的融资集中度和香港上市热度，目前支撑账面估值。
          tone: neutral
        - label: 股权结构 / 优先权清晰度
          value: 4
          detail: 一旦条款可见，证券质量可能比公司质量变化得更快。
          tone: warning
        - label: 独立牵引力验证
          value: 3
          detail: 下载和部署遥测重要，但不如它们本该解释的收入转化桥重要。
          tone: neutral
    approximationNotes: 取值是 1 到 5 的序数影响评分，不是概率估计，也不是机械定价模型。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV034
      - CV036
      - CV043
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 用情景区间比单点目标更站得住，因为 ModelBest 有估值底部，却没有公开损益表。
    data:
      items:
        - label: 悲观情景
          low: 600
          mid: 700
          high: 800
          displayValue: $0.6B-$0.8B
          detail: 开源牵引力转化差，合同看起来以试点为主，或市场窗口降温。
          tone: negative
        - label: 基准情景
          low: 900
          mid: 1000
          high: 1100
          displayValue: $0.9B-$1.1B
          detail: ModelBest 证明了一部分商业化，但不足以在今天估值之上形成清晰安全边际。
          tone: warning
        - label: 乐观情景
          low: 1300
          mid: 1500
          high: 1800
          displayValue: $1.3B-$1.8B
          detail: 经审计收入、克制的 OEM 经济性，以及仍未关闭的中国 AI 溢价，足以支撑在当前底部之上的上行空间。
          tone: positive
    approximationNotes: 区间是基于可比公司范围、资本市场状况和披露质量做出的情景判断，不是 DCF。
    claimRefs:
      - CV034
      - CV036
      - CV039
      - CV042
      - CV043
      - CV049
      - CV050
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: ModelBest 在战略价值和产品方向上得分不错，但经济性可见性和估值舒适度较弱。
    data:
      items:
        - label: 市场 / 战略顺风
          value: 7
          max: 10
          note: 2026 年，中国 AI 融资和香港特专科技上市发行仍有支撑。
        - label: 产品 / 边缘差异化
          value: 7
          max: 10
          note: MiniCPM 在端侧和多模态定位上有真实优势。
        - label: 开源牵引力
          value: 8
          max: 10
          note: 下载、演示和模型数量显示生态注意力仍然活跃。
        - label: 商业化证明
          value: 3
          max: 10
          note: 尚未披露公开收入、定价或续约数据。
        - label: 证据质量
          value: 3
          max: 10
          note: 关键估值输入仍未公开，或只是经媒体转述的公司口径。
        - label: 估值舒适度
          value: 4
          max: 10
          note: 当前估值可以理解，但还不能让人放心下投资结论。
    approximationNotes: 评分是截至运行日期、基于保留证据推导的 IC 式启发，不是管理层 KPI。
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV013
      - CV039
      - CV043
      - CV045
