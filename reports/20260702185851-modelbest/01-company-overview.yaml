- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person dependence
  body: 'The public leadership record centers on the founder trio rather than on a broad disclosed executive bench. Li Dahai
    is the externally visible CEO and the voice behind the company''s density-law and open-source positioning; fetched funding
    profiles also describe his pre-ModelBest background as former Zhihu CTO/executive. Accessible academic and profile sources
    identify Liu Zhiyuan as co-founder and chief scientist while he remains Tsinghua faculty, and identify Zeng Guoyang as
    co-founder and CTO with direct responsibility for MiniCPM engineering. That combination gives ModelBest strong founder-market
    fit in research, open-source tooling, and productization, but it also creates concentration risk: the reviewed public
    record still does not provide a full board roster or a clean ownership split, so later governance analysis will need private
    materials rather than press coverage alone.'
  claimRefs:
