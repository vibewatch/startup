company:
  name: ModelBest
chapter:
  number: 1
  title: Company Overview
  summary: ModelBest (面壁智能) is a Beijing-based, Tsinghua NLP lab-derived edge-model startup founded in 2022 around Li Dahai,
    Liu Zhiyuan, and Zeng Guoyang. Fetched 2026 financing coverage confirms a China Telecom plus Shenzhen Capital/Huichuan-backed
    funding surge that pushed the company across the unicorn threshold, while official and developer-facing sources show MiniCPM
    as a real open-source on-device model franchise. The key chapter-one caveat is that commercialization, board/cap-table
    disclosure, and the exact April 2026 post-money valuation remain less transparent than the fundraising headlines.
sections:
- id: identity-origin-and-strategy
  title: Identity, origin, and edge-model positioning
  body: 'ModelBest operates under the legal name 北京面壁智能科技有限责任公司 and public sources place its founding in August 2022. Fetched
    2026 financing profiles consistently describe the company as a Beijing-based startup that emerged from Tsinghua University''s
    natural-language-processing ecosystem, while OpenBMB''s own materials say the open-source community was jointly initiated
    by Tsinghua NLP Lab and ModelBest. The company does not present itself as a generic frontier-model lab: its homepage says
    it wants to put large models closest to users across phones, AI PCs, smart cockpits, embodied robots, wearables, and legal-AI
    workflows. The common thread across the official site, GitHub repos, and Hugging Face organization page is MiniCPM: a
    compact, deployment-oriented family meant to win on knowledge density and device efficiency rather than sheer parameter
    scale.'
  claimRefs:
