- id: funding-history-investors-and-stage
  title: Funding history, investor coalition, and current stage
  body: 'ModelBest''s funding history shows a private company that kept raising at a fast cadence while broadening its political
    and industrial sponsorship. Caixin documents a 2024 Primavera/Hubble-led round, a December 2024 Loongson-Dinghui-Zhongguancun/SAIF
    round, and a May 2025 round from Hongtai, Gozone, Qingkong Jinxin, and Moutai Fund. In 2026 the pace accelerated again:
    Xinhua-affiliated coverage reports a February round led by China Telecom Investment, and a cluster of April 2026 sources
    says Shenzhen Capital Group and Huichuan Capital then led another hundreds-of-millions RMB round. Those same April stories
    say first-quarter 2026 cumulative financing exceeded RMB 1 billion and that the latest round pushed ModelBest over the
    unicorn threshold. What the public reporting still does not disclose is the exact April post-money valuation in either
    RMB or USD, so the chapter treats ''>US$1 billion'' as verified directionally and the precise figure as unresolved.'
