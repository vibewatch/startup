- id: adverse-signals-and-unresolved-disclosure-questions
  title: Adverse signals and unresolved disclosure questions
  body: The adverse record in chapter 1 is not about a known lawsuit or penalty; it is about commercialization pressure, ecosystem
    dependence, and incomplete disclosure. Caixin's April 2024 profile posed commercialization as the core question even after
    a large financing round, and its May 2025 follow-up emphasized that ModelBest had already completed three rounds in a
    little over a year. Tencent's December 2025 skeptical profile argued that the automotive-cockpit opportunity is crowded
    with chip, OS, and auto-stack incumbents, while Li Dahai's June 2026 interview acknowledged that edge-AI progress now
    depends on co-building with chips, memory, bandwidth, and software ecosystems rather than on model quality alone. Combined
    with the still-undisclosed board roster, cap table, exact April post-money figure, and independently auditable 24 million
    download telemetry, those signals make ModelBest look promising but still diligence-heavy at the company-overview stage.
