- id: milestones-open-source-traction-and-deployment
  title: Milestones, open-source traction, and deployment evidence
  body: ModelBest's most distinctive chapter-one asset is that its technical positioning is visible in public developer channels,
    not just in investor decks. OpenBMB, GitHub, and Hugging Face all show an ecosystem organized around MiniCPM, and the
    main repositories explicitly market on-device, mobile, and multimodal deployment. ThePaper's April 2026 profile says the
    company released XAgent, AgentVerse, and ChatDev in late 2023 before shifting harder into MiniCPM in early 2024; Tencent
    News then reported the 2026 open-sourcing of MiniCPM-o 4.5 as a 9B full-duplex omni-modal model. Several April 2026 financing
    stories further claim that cumulative MiniCPM downloads on GitHub and Hugging Face exceeded 24 million and that deployments
    had already reached named automotive programs such as Changan Mazda EZ-60 and Geely Galaxy M9. Those traction figures
    are material, but they remain company-reported through media channels rather than independently audited telemetry.
