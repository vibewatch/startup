  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Monthly revenue, ARR, segment mix, and revenue-recognition policy by channel.
    whyItMatters: Without a revenue bridge, ModelBest's open-source adoption and deployment claims cannot be converted into underwritable revenue quality.
    diligencePath: Request monthly management revenue packs plus top-customer bookings by OEM, enterprise/on-prem, support/services, and any hosted multimodal line.
    relatedQuestionRefs:
    - QI012
    - QI022
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, restricted cash, and any debt or cloud-commitment schedule.
    whyItMatters: Financing momentum does not equal capital adequacy; runway is the missing variable needed to judge next-round dependency.
    diligencePath: Request latest board package, cash waterfall, burn by function, and base / bear / bull runway cases.
    relatedQuestionRefs:
    - QI013
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, compute COGS, OEM take rates, support costs, CAC, sales cycle, payback, and NRR.
    whyItMatters: The chapter cannot distinguish scalable software economics from labor- or compute-heavy delivery without these metrics.
    diligencePath: Request channel-by-channel unit-economics schedules, renewal cohorts, and sample costed deployments.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: enumeration-incomplete
    severity: material
    topic: oem-contract-structure
    missingEvidence: Per-device royalties, revenue-share formulas, minimum commits, and top-customer concentration by OEM or enterprise account.
    whyItMatters: Device-led commercialization can look large while remaining economically thin if most value leaks to hardware partners or a handful of customers.
    diligencePath: Review top 5 OEM and enterprise contracts, shipment-linked milestones, and concentration reports.
    relatedQuestionRefs:
    - QI004
    - QI021
    - QI022
    relatedTableRefs:
    - TI001
    - TI002
  - type: access-blocked
    severity: material
    topic: filing-verification
    missingEvidence: Accessible company-specific registry, ICP, public-security, or investor-announcement records that close the financing and entity-verification loop.
    whyItMatters: With official investor-side announcements and filing extracts unavailable in the fetched set, key financing facts still rely on independent press reporting.
    diligencePath: Obtain authenticated MIIT / public-security / registry extracts and any investor press releases or closing memos.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited or at least board-grade financial statements showing revenue, opex, cash flow, and margin.
    whyItMatters: No public-only source set can close the underwriting loop without a financial baseline.
    diligencePath: Request audited statements, fundraising data room access, or the first filed prospectus or bond-style disclosure package.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI014
    - QI025
