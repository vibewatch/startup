- id: gtm-and-deployment-economics
  title: 'GTM and deployment economics: B2B2D channels are visible, unit economics are not'
  body: 'The strongest commercial signals are channel and deployment signals. Official pages position ModelBest around phones, AIPC, intelligent cockpits, embodied robotics, wearables, and legal workflows, while third-party April financing coverage says MiniCPM has already landed in vehicles, smartphones, AIPC, and smart-home settings and that cumulative GitHub and Hugging Face downloads exceeded 24 million. The documentation stack goes further: MiniCPM-V-Apps is designed to run fully on-device across iOS, Android, and HarmonyOS, while MiniCPM-o deployment materials still assume GPU-backed worker infrastructure for richer multimodal experiences. Together, those signals imply a B2B2D go-to-market model where open-source adoption and developer enthusiasm feed OEM and enterprise pipelines, but final monetization still depends on integration and partner contracts. What remains absent is the part an investor actually needs: customer count, contract length, OEM take rate, renewal behavior, CAC,
    payback, or the split between software value and systems-integration effort.'
