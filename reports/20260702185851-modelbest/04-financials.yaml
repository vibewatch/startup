- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict and diligence blockers: financeable story, not yet an underwritable one'
  body: 'ModelBest''s positive case is easier to defend than its revenue model. The company has visible product-market direction, an active open-source ecosystem, credible sector deployments, and backers whose strategic incentives line up with edge AI adoption. That combination makes it plausible that ModelBest can continue raising capital and converting technical reputation into embedded and on-prem channels. The negative case is equally concrete. Public evidence still lacks revenue, ARR, gross margin, burn, runway, price realization, customer concentration, and contract structure; even filing verification remained incomplete because accessible official portals did not surface a clean company-specific record during this review. In other words, the market has underwritten the strategic narrative, but outside investors still cannot underwrite the income statement. Until management provides contract-level pricing, customer concentration, compute-cost evidence, and audited or at least board-grade
    financial statements, the correct financial stance is cautious: commercially credible, strategically funded, but still disclosure-light and margin-uncertain.'
