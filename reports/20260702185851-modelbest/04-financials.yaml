chapter:
  number: 4
  title: Financials
  summary: ModelBest has real capital access and real deployment evidence, but its public financial story is still mostly a monetization hypothesis rather than a disclosed income statement. April 2026 financing led by Shenzhen Capital Group and Huichuan/Inovance-linked industrial capital, plus a reported February China Telecom-backed round, lowers immediate funding risk; however, no public revenue, pricing, margin, cash, burn, runway, or contract disclosures support a clean underwrite. The company's open-source, edge-first strategy may lower some serving costs, but it also intensifies pricing pressure and leaves the margin path unresolved.
sections:
- id: revenue-model-and-monetization
  title: 'Revenue model and monetization: deployment is visible, list pricing is not'
  body: 'ModelBest''s public surfaces do not look like a conventional self-serve SaaS funnel. The homepage, Feishu documentation, GitHub repos, and raw readmes all emphasize on-device deployment, local inference, multimodal demos, and integration toolchains rather than a public API checkout flow or token price card. That pushes the most plausible monetization mix toward OEM embedding in phones, cars, AIPC, wearables, and robotics; enterprise and on-prem deployments in legal and industrial settings; and open-source-to-enterprise conversion through integration, support, and customization. The same evidence also explains why underwriting is difficult: the company appears commercially real, but there is no public list-vs-realized pricing bridge, no public contract schedule, and no disclosure of whether OEM economics are royalties, revenue shares, bundled support, or strategic cross-subsidies. Open-source distribution clearly helps adoption, but it also means revenue quality depends on contract
    structure rather than on public usage pricing.'
