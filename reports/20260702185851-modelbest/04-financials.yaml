- id: cost-structure-and-pricing-pressure
  title: 'Cost structure and pricing pressure: edge inference helps, but compute and open source still compress margins'
  body: 'ModelBest''s edge-first strategy is economically intuitive: if more inference runs on the user''s device or in OEM-controlled hardware, some centralized serving cost can move off the company''s P&L. The raw docs and app repos support that thesis, and investor commentary explicitly cites lower deployment and calling costs as part of the appeal. Still, the public record also shows why that is not enough to infer strong margins. MiniCPM-o''s official demo architecture still assumes gateway, worker, backend, mounted weights, dedicated GPUs, and about 21.5 GB VRAM per initialized worker. Broader Chinese AI infrastructure reporting says inference has become the dominant commercial workload, that many general-purpose train-and-infer chips are badly utilized in online inference, and that cost control remains a central bottleneck. Add ModelBest''s fully open distribution and the result is a clear margin risk: adoption can scale quickly, but price competition and support costs can still outrun
    monetization unless OEM and enterprise contracts are disciplined.'
