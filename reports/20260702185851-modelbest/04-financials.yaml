- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on judgment
  - exact diligence path
  rows:
  - - Revenue / ARR / segment mix
    - Prevents testing whether open-source traction converts into recurring paid revenue
    - Request monthly revenue bridge by OEM, enterprise/on-prem, support/services, and any hosted usage line.
  - - List vs realized pricing and discount policy
    - Prevents translating deployment visibility into monetization quality
    - Request top 10 contract summaries, discount bands, and OEM rev-share formulas.
  - - Gross margin and compute COGS
    - Prevents any view on whether edge economics are actually superior
    - Request compute invoices, model-serving architecture, and product-line gross margin.
  - - Cash balance, burn, runway, and debt
    - Prevents evaluating financing dependency and next-round timing
    - Request latest management accounts, cash waterfall, and debt / cloud-commitment schedule.
  - - Customer concentration and shipment exposure
    - Prevents judging how much revenue depends on a handful of OEM launches
    - Request top-customer concentration, launch timing by OEM, and backlog / booked pipeline.
  - - Renewal, retention, and support load
    - Prevents distinguishing scalable software revenue from labor-heavy project work
    - Request renewal cohorts, support headcount by customer, and SLA profitability.
  notes: These are the minimum missing items blocking a public-only underwriting case on ModelBest as of 2026-07-02.
