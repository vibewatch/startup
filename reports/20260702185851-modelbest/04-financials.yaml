  - - Industrial / robotics partnerships
    - Commercialization through industrial automation, robotics, and physical-world AI partnerships
    - Custom commercial agreement
    - Investor commentary links ModelBest directly to industrial automation and robotics use cases
    - Medium for strategic fit, low for recognized-revenue visibility
    - Disclose whether revenue comes from software licenses, joint solutions, hardware attach, or milestone payments.
  - - Open-source-to-enterprise conversion
