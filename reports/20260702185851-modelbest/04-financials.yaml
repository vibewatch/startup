- id: capital-access-and-adequacy
  title: 'Capital access and adequacy: financing momentum is strong, cash visibility is absent'
  body: 'The clearest financial fact in public is not revenue but financing access. Multiple independent April 2026 reports say ModelBest closed a new several-hundred-million-renminbi round led by Shenzhen Capital Group and Huichuan/Inovance-linked industrial capital, after a reported February 2026 round led by China Telecom, taking cumulative first-quarter financing above RMB1 billion and pushing the company into the unicorn valuation threshold. The strategic logic behind those investors is also unusually explicit: Shenzhen Capital linked ModelBest''s intelligence-density approach to lower deployment and calling costs, Huichuan/Inovance framed the company as a fit for industrial automation and robotics, and China Telecom was described as a cloud-network-device distribution ally. That is a real capital stack, and it likely reduces near-term funding fragility. But it still does not answer the underwriting question. No fetched source provides cash on hand, monthly burn, runway, debt, or committed
    compute spend, and no accessible official investor-side announcement or filing closes the loop beyond press reporting.'
