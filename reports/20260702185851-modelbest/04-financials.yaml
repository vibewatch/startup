callouts:
- calloutType: insight
  title: ModelBest's public commercial surface is deployment-led, not pricing-led
  body: The company exposes product docs, local deployment guides, device demos, and open-source distribution, but not a public API price card or commercial SKU sheet. That usually means the monetization engine sits inside negotiated OEM and enterprise contracts rather than in a transparent usage tariff.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
- calloutType: strength
  title: Investor composition is strategically useful, not just financially useful
  body: The 2026 funding stack combines telecom distribution, state-backed venture capital, and industrial automation capital. Even without cash disclosures, that mix suggests ModelBest is being financed by parties who can also provide channels, policy cover, and deployment opportunities.
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI042
  - CI043
- calloutType: risk
  title: Open-source scale and edge positioning do not solve the margin question
  body: ModelBest may avoid part of the centralized-serving bill by pushing inference closer to the device, but the company still shows GPU-backed multimodal infrastructure, ongoing adaptation work, and intense open-source pricing pressure. Without public gross margin or contract data, the margin path remains the central financial risk.
  claimRefs:
