  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the current mark
        blocks:
          - type: paragraph
            body: >-
              ModelBest's best-supported current valuation anchor is still a floor, not a fully priced mark. Multiple
              April 2026 reports say the company completed its second 2026 financing round, took cumulative
              first-quarter financing above RMB1 billion, and crossed the large-model unicorn threshold. ThePaper
              sharpened that language by describing the company as having entered the "$1 billion class" after the April
              round. Those signals are enough to treat roughly $1 billion, or RMB7 billion-plus in shorthand, as a
              plausible current headline mark.


              The key limitation is that public evidence stops there. The same April coverage that validates the unicorn
              threshold does not disclose a precise post-money figure, a full dilution picture, or investor-rights
              terms. CB Insights' public company page reinforces the opacity: it shows the April 7, 2026 round and
              investor roster but masks valuation as $XXM and lists revenue as 0 FY undefined on the public page. In
              other words, the market has revealed directionally that ModelBest is no longer a subscale seed story; it
              has not revealed enough to underwrite the exact security price with confidence.
