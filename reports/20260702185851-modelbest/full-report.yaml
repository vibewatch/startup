        - Text and multimodal edge models, framework support, OEM/channel integration
        - Economics depend on partner contracts, not just public model access
      - - Microsoft Phi
        - Model pages retrieved do not publish list inference pricing; models available through Azure Foundry and MaaS
        - MIT-licensed models plus managed Azure catalog
        - 3.8B mini model, 128K context, function calling, multilingual support
