              published mobile-memory footprints. Meta's Llama 3.2 ships in 1B and 3B sizes with quantized on-device use
              cases, though under a custom community license rather than MIT or Apache. Mistral released Ministral 3
              models in 3B, 8B, and 14B sizes under Apache 2.0 for edge and local deployment. Qwen3 open-weights dense
              models down to 0.6B, while Moonshot, MiniMax, GLM, and ERNIE increasingly optimize for agentic coding,
