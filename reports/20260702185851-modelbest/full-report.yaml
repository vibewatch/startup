      - CV013
      - CV018
      - CV039
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The current valuation is most sensitive to proof-of-monetization drivers rather than to another incremental
      traction headline.
    data:
      items:
        - label: Audited revenue bridge
          value: 5
          detail: The biggest missing input to determine whether the current mark is fair or stretched.
          tone: warning
        - label: OEM / enterprise pricing terms
          value: 5
          detail: Contract economics determine whether deployments are software-like or services-like.
          tone: warning
        - label: Gross-margin / compute-cost proof
          value: 4
          detail: Edge deployment helps only if off-device costs and support burden stay controlled.
          tone: warning
        - label: China AI scarcity premium
          value: 4
          detail: Q1 2026 funding concentration and Hong Kong listing heat currently support headline marks.
          tone: neutral
        - label: Cap table / preference clarity
          value: 4
          detail: Security quality can change faster than company quality once terms are visible.
          tone: warning
        - label: Independent traction verification
          value: 3
          detail: Download and deployment telemetry matter, but less than the revenue bridge they are supposed to explain.
          tone: neutral
    approximationNotes: Values are ordinal impact scores from 1 to 5, not probability estimates or a mechanistic pricing model.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV034
      - CV036
      - CV043
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      A scenario range is more defensible than a single-point target because ModelBest has a valuation floor but not a
      public income statement.
    data:
      items:
        - label: Bear case
          low: 600
          mid: 700
          high: 800
          displayValue: $0.6B-$0.8B
          detail: Open-source traction converts poorly, contracts look pilot-heavy, or the market window cools.
          tone: negative
        - label: Base case
          low: 900
          mid: 1000
          high: 1100
          displayValue: $0.9B-$1.1B
          detail: ModelBest proves some monetization but not enough to create a clean margin of safety above today's mark.
          tone: warning
        - label: Bull case
          low: 1300
          mid: 1500
          high: 1800
          displayValue: $1.3B-$1.8B
          detail: >-
            Audited revenue, disciplined OEM economics, and a still-open China AI premium justify upside from the
            current floor.
          tone: positive
    approximationNotes: >-
      Ranges are editorial scenario estimates based on comp brackets, capital-market conditions, and disclosure quality
      rather than a DCF.
    claimRefs:
      - CV034
      - CV036
      - CV039
      - CV042
      - CV043
      - CV049
      - CV050
      - CV051
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      ModelBest scores well on strategic value and product direction, but poorly on economics visibility and valuation
      comfort.
    data:
      items:
        - label: Market / strategic tailwind
          value: 7
          max: 10
          note: China AI funding and Hong Kong specialist-tech issuance remain supportive in 2026.
        - label: Product / edge differentiation
          value: 7
          max: 10
          note: MiniCPM has a real on-device and multimodal positioning advantage.
        - label: Open-source traction
          value: 8
          max: 10
          note: Downloads, demos, and model count show live ecosystem attention.
        - label: Monetization proof
          value: 3
          max: 10
          note: No public revenue, pricing, or renewal data has been disclosed.
        - label: Evidence quality
          value: 3
          max: 10
          note: Key valuation inputs remain private or company-reported through press.
        - label: Valuation comfort
          value: 4
          max: 10
          note: The current mark is understandable, but not yet comfortably underwritable.
    approximationNotes: Scores are IC-style heuristics derived from retained evidence as of the run date; they are not management KPIs.
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV013
      - CV039
      - CV043
      - CV045
