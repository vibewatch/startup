      - number: '2.5'
        title: 'Hard constraints: memory costs, price wars, export controls, and missing share data'
        blocks:
          - type: paragraph
            body: >-
              The market is attractive in direction but still difficult in economics. Counterpoint's China smartphone
              outlook worsened as memory costs rose: its December 2025 view called for a 5% 2026 decline, but its April
              2026 update worsened to 9%, with OEMs already raising prices and leaning on premium AI features to
              stimulate replacement demand. The API layer is also under pressure. KrASIA and DigWatch show a Chinese
              price war in which Alibaba cut Qwen-Long pricing by 97%, Baidu made some models free for business users,
              and ByteDance had already reset the price floor. Export controls are another constraint: CNBC reported
              that the United States closed a loophole in May 2026 that had allowed China-headquartered firms to obtain
              advanced chips abroad without licenses, while CSIS argues those same controls also accelerate Chinese
              substitution. Finally, none of the reviewed public sources discloses ModelBest's attributable paid share
              inside AI phones, AI PCs, or smart cockpits, so the chapter can show demand expansion but not yet prove
              how much of that value will belong to ModelBest rather than to its OEM partners.
