      - number: '3.2'
        title: 'Capability, openness, and packaging: ModelBest is strong, but not alone'
        blocks:
          - type: paragraph
            body: >-
              ModelBest's positive case is real. The company positions MiniCPM across phones, AIPCs, cockpits, robots,
              and wearables; the MiniCPM repo frames MiniCPM5-1B as a 1B-class on-device SOTA model; MiniCPM4.1
              emphasizes sparse-attention speedups at 128K context; and the MiniCPM-V line claims unusually strong
              multimodal quality per parameter, including mobile deployment across iOS, Android, and HarmonyOS. That is
