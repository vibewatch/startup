  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: ModelBest sits in the device-side model layer, not the whole AI economy'
        blocks:
          - type: paragraph
            body: >-
              ModelBest's own materials do not describe a broad cloud-model platform; they describe a company trying to
              put large models closest to users across phones, AI PCs, smart cockpits, embodied robots, wearables, and
              other terminals. The MiniCPM repository reinforces that framing by highlighting compact models for local
              deployment and resource-constrained environments. Independent coverage from 36Kr and Gasgoo points the
              same way: ModelBest is being positioned as an early edge-intelligence vendor whose commercial path runs
              through OEMs, chip partners, and terminal deployment rather than pure public-cloud traffic. That means the
              relevant market includes device-side model integration, local inference software, cockpit AI, and
              privacy-sensitive local deployments. It excludes most upstream cloud-training capex and a large share of
              generic app economy spending. In other words, ModelBest competes where NPU capability, model compression,
              OEM integration, and privacy or latency constraints matter more than raw headline model size.
