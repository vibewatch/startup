  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct edge-model peers, platform incumbents, and workflow substitutes'
        blocks:
          - type: paragraph
            body: >-
              ModelBest competes in more than one market at once. At the narrowest layer, MiniCPM fights other small or
              efficiency-oriented model families that also promise local inference, mobile deployment, or favorable
              intelligence-per-parameter: Microsoft Phi, Google Gemma, Meta Llama 3.2, Mistral's Ministral line, and
              Alibaba's smaller Qwen variants all fit this class. Those are the cleanest “same job” comparisons for an
              OEM, app developer, or enterprise team deciding which open or semi-open foundation model to run close to
              the user rather than inside a hyperscale cloud. At a broader layer, ModelBest also competes with larger
              Chinese agentic-model vendors such as Moonshot Kimi, MiniMax, Z.ai/GLM, and Baidu ERNIE whenever buyers
              care more about coding, long-context, tool use, or bundled ecosystem services than about raw on-device
              minimalism.


              The substitute set is even broader. Apple Intelligence is not sold as an open model, but it is a powerful
              embedded substitute because Apple lets any app invoke on-device Apple Intelligence features offline and at
              no cost per request. OpenAI's ChatGPT is the opposite kind of substitute: cloud-first rather than
              edge-first, but still a default assistant developers and users may adopt instead of wiring a local stack.
              Internal build is also a live alternative because many of these competitors ship open weights, standard
              transformer interfaces, or OpenAI-compatible APIs, making it easier for buyers to assemble a private stack
              instead of betting on a single vendor.
            claimRefs:
