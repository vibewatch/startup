            body: >-
              ModelBest's public materials describe a wide user map but a much narrower disclosed payer map. Official
              product pages place MiniCPM inside phones, AIPC devices, intelligent cabins, embodied robots, and
              wearables, while the legal section claims a court-workflow deployment on a court private network. That
              implies at least five meaningful user groups for this chapter: OEM and device makers embedding the model,
              enterprise and public-sector deployers buying private or edge deployments, robotics and edge integrators
              packaging MiniCPM into local systems, developers self-hosting or adapting open models, and academic or
              research users interacting through OpenBMB and Tsinghua-linked open releases. The key analytical split is
              buyer versus user versus payer. End users may touch MiniCPM through cars, phones, or tools without paying
              ModelBest directly; the visible payers are likely a much smaller set of OEM, telecom, and enterprise
              accounts. Public evidence therefore supports strong segmentation breadth, but not broad disclosure of
