      - number: '2.3'
        title: 'Buyer map: design wins and local workflow approval matter more than stand-alone app share'
        blocks:
          - type: paragraph
            body: >-
              ModelBest's route to market is structurally different from a consumer chatbot company. The company
              publicly discloses partnerships with automakers, smartphone or PC ecosystems, chip vendors, and
              robotics-related hardware players, while Gasgoo ties its commercialization directly to automobiles,
              smartphones, PCs, and smart-home deployments. That means the real buyers are usually OEM product teams,
              platform owners, chip partners, or enterprise and public-sector deployers rather than end users. In
              smartphones and AI PCs, the practical decision-maker is the OEM or platform team deciding whether local AI
              features justify memory, NPU, and integration cost. In automotive, the buyer is the vehicle program owner
              who controls cockpit architecture and launch timing. In regulated local deployment, the buyer is the IT or
              compliance organization that values privacy, latency, and local control. This structure shifts value
              capture away from retail app usage and toward design wins, product-cycle timing, and partner
              concentration, which is why bargaining power can remain high even if device-level AI adoption accelerates.
