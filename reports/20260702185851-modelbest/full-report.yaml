companyProfile:
  summary: >-
    ModelBest (面壁智能), formally 北京面壁智能科技有限责任公司, is a Beijing-based edge-model startup founded in August 2022 around Li
    Dahai, Liu Zhiyuan, and Zeng Guoyang. The company emerged from Tsinghua University's NLP / OpenBMB ecosystem and
    built the MiniCPM family as a compact, deployment-oriented alternative to cloud-only frontier models. Public sources
    show a strategy centered on open-source distribution through OpenBMB, GitHub, and Hugging Face, followed by edge and
    embedded deployments across phones, AI PCs, smart cockpits, embodied robots, wearables, and legal-AI workflows.
    Repeated 2024-2026 rounds culminated in an April 2026 financing that pushed ModelBest above the unicorn threshold,
    but public disclosure still lags on revenue quality, pricing structure, governance, and exact security terms.
