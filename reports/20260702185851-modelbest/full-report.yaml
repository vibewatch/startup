      - - Google Gemma
        - Open weights; local inference economics depend on hardware footprint rather than token price
        - Open weights via developer ecosystem and mobile-optimized variants
        - Small 2B/4B mobile models, quantized mobile paths, multimodality
        - Low switching cost for self-hosters, but total device cost depends on hardware constraints
      - - Apple Intelligence
        - No cost per request for app developers using on-device models
        - OS-native framework and APIs
        - Offline on-device inference plus Private Cloud Compute escalation
        - Very hard for third parties to beat on marginal cost inside Apple's own ecosystem
      - - Meta Llama 3.2
        - Model access requires license acceptance; local costs depend on chosen quantization and hardware
        - Open-access download with custom community license
        - 1B/3B models, 128K context, quantized on-device use cases
        - Commercial packaging is less frictionless than MIT/Apache peers even though developer access is broad
      - - Mistral / Ministral 3
        - API pricing exists, but retrieved pages emphasize open weights and deployment options over headline list price
        - Apache 2.0 weights plus Mistral platform / cloud partners
        - 3B/8B/14B edge models, self-hosting, enterprise support
        - Competes heavily on deployment portability more than a simple per-token price card
      - - Alibaba Qwen
        - Open-weight Qwen3 dense models; managed access can route through Alibaba tooling
        - Apache 2.0 small dense models plus cloud / app ecosystem
        - 0.6B-32B dense range, local frameworks, agentic support
        - Packaging advantage comes from Alibaba distribution, not just raw model price
