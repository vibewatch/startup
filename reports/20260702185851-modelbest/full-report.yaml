  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a real edge-AI wedge colliding with missing monetization proof and incomplete
      security terms.
    data:
      nodes:
        - id: edge
          label: Edge-model traction
          detail: MiniCPM spans phones, cockpits, AIPCs, robots, and legal workflows.
          tone: positive
        - id: investors
          label: Strategic investor support
          detail: China Telecom, Shenzhen Capital, and industrial investors support the current floor.
          tone: positive
        - id: opensource
          label: Open-source reach
          detail: 24M+ reported downloads and 158 hosted models show real ecosystem attention.
          tone: positive
        - id: disclosure
          label: Disclosure gap
          detail: No public revenue, pricing, gross-margin, or preference ledger is available.
          tone: warning
        - id: competition
          label: Monetization risk
          detail: Open-source distribution and crowded cockpit competition can weaken pricing power.
          tone: warning
        - id: decision
          label: research-more / stretched
          detail: Investable company, but not yet a price-insensitive security at the current mark.
          tone: neutral
      edges:
        - from: edge
          to: decision
        - from: investors
          to: decision
        - from: opensource
          to: decision
        - from: disclosure
          to: decision
        - from: competition
          to: decision
    approximationNotes: >-
      The flow is qualitative rather than probabilistic; it maps the current decision chain implied by retained public
      evidence.
    claimRefs:
