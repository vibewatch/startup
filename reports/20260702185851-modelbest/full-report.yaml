    sections:
      - number: '1.1'
        title: Identity, origin, and edge-model positioning
        blocks:
          - type: paragraph
            body: >-
              ModelBest operates under the legal name 北京面壁智能科技有限责任公司 and public sources place its founding in August
              2022. Fetched 2026 financing profiles consistently describe the company as a Beijing-based startup that
              emerged from Tsinghua University's natural-language-processing ecosystem, while OpenBMB's own materials
              say the open-source community was jointly initiated by Tsinghua NLP Lab and ModelBest. The company does
              not present itself as a generic frontier-model lab: its homepage says it wants to put large models closest
              to users across phones, AI PCs, smart cockpits, embodied robots, wearables, and legal-AI workflows. The
              common thread across the official site, GitHub repos, and Hugging Face organization page is MiniCPM: a
              compact, deployment-oriented family meant to win on knowledge density and device efficiency rather than
              sheer parameter scale.
