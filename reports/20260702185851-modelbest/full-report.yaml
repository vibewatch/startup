        blocks:
          - type: paragraph
            body: >-
              ModelBest's second major risk is that the same open-source and deployment-first strategy that accelerates
              adoption also widens its compliance and monetization exposure. OpenBMB says the community was jointly
              initiated by Tsinghua NLP Lab and ModelBest, the MiniCPM repos are openly downloadable, the code is
              licensed under Apache 2.0, and the readmes explicitly emphasize on-device deployment and full-duplex
              multimodal use cases. That helps ecosystem reach, but it also makes the stack easier to fork, benchmark,
              and repackage, which weakens secrecy-based pricing power and shifts value capture toward contracts,
              integration, or proprietary data rights. The new TC260 baseline standard intensifies this problem by
              requiring clean data provenance, personal-information consent or other legal basis, IP-risk disclosure in
              user agreements, and rejection of training sources with more than a 5% illegal-content rate. ModelBest's
              own public materials broaden the burden further by claiming court-network legal deployment, which is a
              sensitive setting for personal information, document provenance, and output reliability. Yet the fetched
              public surfaces for this chapter did not expose a public privacy policy, user agreement, security
              certification, or incident-response page, so the diligence burden around data handling, model-governance
              controls, and public-security posture remains open.
