  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / packaging signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - ModelBest / MiniCPM
        - Direct edge-model startup
        - Apache-licensed core text stack; multimodal edge models; OEM and regulated-industry partnerships
        - Chinese OEMs, app developers, regulated enterprises, edge-device builders
        - Cross-platform multimodal efficiency across phones, PCs, cockpits, robots, wearables
        - Distribution is partner-led rather than consumer-led; attach-rate economics remain undisclosed
      - - Microsoft Phi
        - Global direct SLM competitor
        - MIT-licensed SLM family; Azure Foundry distribution; on-device positioning
        - Enterprise developers needing low-cost, low-latency multilingual inference
        - Clear on-device framing plus strong enterprise tooling and safety positioning
        - Distribution strength rides Azure; not a China-native OEM wedge
      - - Google Gemma
        - Global direct SLM competitor
        - Open weights; published mobile-memory footprints; DeepMind/Google developer ecosystem
        - Mobile, browser, IoT, and local-app developers
        - Well-documented small-model packaging and mobile optimization
        - Google ecosystem reach is strong, but device-side commercial integration depends on builder execution
      - - Apple Intelligence
        - Platform substitute / incumbent
        - OS-level on-device models; Foundation Models framework available offline at no cost per request
        - Apple-platform app developers and end users
        - Default distribution on iPhone, iPad, and Mac with privacy branding
        - Closed ecosystem; unavailable as a general cross-platform open model
      - - Meta Llama 3.2
        - Global direct SLM competitor
        - 1B/3B family with 128K context and massive community distribution
        - Developers who value ecosystem, community tooling, and quantized local use
        - Huge open-source mindshare and agent/retrieval use cases
        - Custom community license is less permissive than MIT/Apache peers
      - - Mistral / Ministral 3
        - Global direct SLM competitor
        - Apache 2.0 small dense family in 3B/8B/14B plus self-hosted / on-prem story
        - Edge, enterprise, and sovereign deployments
        - Permissive licensing with strong self-hosting narrative
        - Less obviously optimized for China OEM channels than ModelBest
      - - Alibaba Qwen
        - Chinese platform incumbent and direct model rival
        - Open-weight dense models down to 0.6B; 128K on 8B+; Alibaba ecosystem tooling
        - Chinese and global developers needing multilingual or agentic models
        - Broad model ladder plus local tooling and app ecosystem reach
        - Open code does not eliminate dependence on Alibaba-controlled product surfaces
      - - Moonshot Kimi K2.6
        - Chinese workflow substitute
        - Open-source coding / agent model; free user tier plus paid plans; 256K API
        - Developers prioritizing coding, long-horizon execution, and agent swarms
        - Strong agent workflow pitch with OpenAI-compatible API
        - Not primarily optimized for phone-class inference or OEM embedding
      - - MiniMax M3
        - Chinese workflow substitute
        - 1M-context multimodal model with frontier coding / agent claims; token plan packaging
        - Developers wanting long-context local or hosted agent workflows
        - Long context, multimodality, and coding strength in one package
        - Public packaging is less transparent on standalone pricing and mobile footprint
      - - Z.ai / GLM-5.1
        - Chinese workflow substitute
        - Agent/chat branding plus long-horizon coding docs and OpenAI-like API
        - Enterprises or developers wanting long autonomous execution
        - Eight-hour task pitch and strong coding orientation
        - Less clearly positioned as a tiny mobile-first footprint than MiniCPM or Phi
      - - Baidu ERNIE 5.1
        - Chinese incumbent substitute
        - Domestic flagship with cost-efficiency claims and existing search / enterprise infrastructure
        - Chinese enterprise, search, and domestic-infrastructure buyers
        - Cost-performance plus domestic ecosystem credibility
        - Open-weight portability is weaker than ModelBest, Phi, Gemma, or Mistral
      - - OpenAI / ChatGPT
        - Status-quo cloud substitute
        - Cloud-first conversational assistant with strong default mindshare
        - Developers or users comfortable with cloud assistants instead of local models
        - Fastest default path when offline, sovereignty, or per-device inference are not required
        - Not an on-device open model and not a China-native OEM solution
    notes: >-
      Rows mix direct edge-model peers with broader workflow and platform substitutes because OEM and enterprise buyers
      can solve the same job in more than one way; unknowns are left explicit rather than back-filled from vendor
      marketing.
    enumerationScope:
