      - number: '7.3'
        title: >-
          Compute, partner, and competition risk: export controls, domestic-chip immaturity, OEM concentration, and
          price wars reinforce each other
        blocks:
          - type: paragraph
            body: >-
              ModelBest's third risk cluster sits outside the model weights themselves: compute access, partner
              concentration, and commoditizing market structure. BIS's May 31, 2026 guidance and June 17 FAQ make clear
              that advanced-computing license requirements continue to apply to entities headquartered in Country Group
              D:5, or with ultimate parents there, even when the buying entity sits outside China; CNBC reports the rule
              was aimed at flows through overseas subsidiaries in places like Malaysia and that exporters should still
              seek licenses. At the same time, Tencent's June 2026 interview with Li Dahai says ModelBest's bottleneck
              is now chip, memory, and bandwidth co-build and that domestic software ecosystems are still materially
              less complete than Nvidia's. CNBC and CSIS describe China's answer as large Huawei-chip clusters supported
              by cheap energy and subsidies, but that path uses more chips and more power than Nvidia-based systems.
              Downstream, the public deployment record is also concentrated: Gasgoo and Tencent point mainly to auto and
              device partners such as Geely, Volkswagen, Changan, GAC, and the Geely Galaxy M9 cockpit program. That
              concentration hits at the same moment the China model market is being repriced. KrASIA and Digital Watch
              show Alibaba and Baidu compressing API prices to near-zero marginal levels, a dynamic the sources say may
              still work for hyperscalers that monetize cloud attachment but looks materially harder for smaller
              startups. ModelBest therefore faces a compound risk: supply constraints can slow progress just as pricing
              power and partner leverage are moving against independent labs.
