    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Shows the progression from broad community reach to small numbers of named commercial programs and then to an
      unresolved renewal stage.
    data:
      nodes:
        - id: discover
          label: Global discovery
          detail: 24M+ cumulative downloads, trending open-source attention, large Hugging Face catalog.
        - id: evaluate
          label: Technical evaluation
          detail: Repos, cookbooks, Ollama, OpenVINO, and local app demos support trial use on real hardware.
        - id: integrate
          label: Partner / OEM integration
          detail: Device, auto, telecom, and legal channels evaluate the model for private or embedded deployment.
        - id: deploy
          label: Named production-style proof
          detail: China Telecom collaboration, Geely Galaxy M9, and Changan Mazda EZ-60 are the clearest public examples.
        - id: renew
          label: Renewal / expansion proof
          detail: No public NRR, contract-term, or cohort data exists for any named account.
      edges:
        - from: discover
          to: evaluate
          label: developers test locally
        - from: evaluate
          to: integrate
          label: fit to chips / workflows
        - from: integrate
          to: deploy
          label: named channel goes live
        - from: deploy
          to: renew
          label: durability not disclosed
    approximationNotes: null
    claimRefs:
      - CU006
      - CU014
      - CU017
      - CU019
      - CU020
      - CU021
      - CU029
      - CU034
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Compares the quality of public proof across channels: production specificity is best in automotive, while
      retention and revenue visibility are weak everywhere.
    data:
      columns:
        - Evidence independence
        - Production specificity
        - Revenue visibility
        - Retention visibility
      rows:
        - label: China Telecom
          values:
            - Medium — two news reports, no official contract filing
            - Medium — named collaboration but not a named live deployment surface
            - Low — no value or term disclosed
            - Low — no renewal data
        - label: Geely Galaxy M9
          values:
            - Medium — two media reports name the vehicle and model
            - High — named model in named vehicle
            - Low — no unit economics
            - Low — no renewal data
        - label: Changan Mazda EZ-60
          values:
            - High — Mazda confirms program exists; media name ModelBest
            - High — first mass-produced edge-model vehicle claim
            - Low — no revenue data
            - Low — no renewal data
        - label: Huawei / Volkswagen cooperation
          values:
            - Low-to-medium — named in financing coverage only
            - Low — exact SKU or deployment not public
            - Low — no commercial detail
            - Low — no retention data
        - label: Developer ecosystem
          values:
            - High — GitHub / HF / Ollama / OpenVINO pages are directly visible
            - Medium — real deployment surfaces exist
            - Low — monetization invisible
            - Low — repeat usage not disclosed
        - label: Legal / court workflow
          values:
            - Low — only company-controlled public claim
            - Medium — workflow is described but customer is unnamed
            - Low — no procurement or contract detail
            - Low — no cohort or renewal data
    approximationNotes: >-
      The qualitative scores summarize public-evidence quality rather than internal sales status; they are intended to
      show where proof quality is strongest and weakest, not to quantify customer satisfaction.
