    rows:
      - - MiniCPM dense text backbones
        - Base language, code, and reasoning capability
        - MiniCPM training recipe plus Transformers-compatible packaging
        - Capability claims versus larger peers are mostly self-authored or paper-authored
      - - Sparse-reasoning / efficiency variants (MiniCPM4.1, SALA, BitCPM)
        - Push reasoning depth and lower compute cost per useful token
        - Custom sparse attention, low-bit quantization, and model-specific training choices
        - Version fragmentation can increase maintenance burden across runtimes
      - - MiniCPM-V visual stack
        - Image, OCR, document, and video perception
        - SigLIP-family encoder plus token compression strategies
        - Perception quality and benchmark generalization remain version-specific
      - - MiniCPM-o omni stack
        - Speech, live video/audio streaming, and proactive interaction
        - Whisper or speech modules, temporal alignment, and streaming inference
        - The vendor openly states foundation and speech stability gaps remain
      - - GGUF / quantization packaging
        - Enables local installs and smaller memory footprints
        - llama.cpp-compatible weights and conversion flows
        - Quality loss versus full precision is not disclosed in one unified benchmark matrix
      - - Runtime adapters
        - Serve models in Transformers, vLLM, SGLang, llama.cpp, and Ollama-like paths
        - Open-source inference engines and backend compatibility work
        - Some paths depend on model-specific forks or features not equally mature across modalities
      - - V-Apps shell and mobile build system
        - Turns weights plus runtime into installable apps
        - Apple, Android, and HarmonyOS toolchains plus llama.cpp-omni submodule
        - Platform setup remains nontrivial for developers who want to build from source
      - - Distribution hubs
        - Move the same family across GitHub, Hugging Face, ModelScope, and package formats
        - Third-party model hubs and partner mirrors
        - Hub gating, JS-heavy pages, or policy changes can add friction outside the core repo
    notes: >-
