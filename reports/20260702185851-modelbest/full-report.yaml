      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The valuation gap is unusually concentrated in a few closeable diligence items. Investors need a monthly
              revenue and gross-margin bridge, the actual OEM and enterprise pricing structure, the cap table and
              liquidation waterfall, independent telemetry on active paid deployments versus open-source downloads, and
              any terms that could make a headline unicorn mark economically weaker than it looks. Without those, the
              current price remains more a strategic narrative than an underwritten security.


              The thesis-break triggers are correspondingly concrete. A new round below the current headline mark would
              show valuation support was thinner than it appeared. A disclosed revenue bridge that still looks subscale
              relative to the installed base would show open-source traction has not translated into monetization. A
              preference stack or governance structure that sharply subordinates new investors would change the
              security-quality case even if the company-quality case remains strong. And if the China AI funding or Hong
              Kong specialist-tech window weakens before ModelBest proves revenue, the strategic premium embedded in the
              current mark could compress quickly.
