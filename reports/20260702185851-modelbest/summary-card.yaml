      The reported $1B+ mark appears supported more by strategic scarcity and investor coalition quality than by proven
      monetization.
    - >-
      Automotive and device-channel proof is concentrated in a small number of named programs and partners, raising
      concentration and execution risk.
    - >-
      Open-source popularity may not translate into paid deployment economics if OEM and enterprise take-rates remain
      weak or opaque.
