  topStrengths:
    - >-
      Strong fit with a real market wedge: compact multimodal models for on-device and edge deployment rather than
      generic cloud-only LLM supply.
    - >-
      OpenBMB, GitHub, and Hugging Face provide visible ecosystem reach, including 158 hosted models and reported 24M+
      cumulative downloads.
    - >-
      Strategic investors span telecom, state-backed venture capital, and industrial automation, improving channel
      access as well as capital supply.
