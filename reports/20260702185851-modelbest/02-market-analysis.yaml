callouts:
- calloutType: insight
  title: ModelBest is exposed to AI terminal refresh cycles, not one monolithic China LLM TAM
  body: The clearest demand signal around ModelBest is the spread of AI-capable terminals—especially AI phones, AI PCs, and smart cockpits—rather than any single top-down China AI revenue number. That makes shipment mix, memory costs, and OEM launch timing more decision-useful than a headline national AI market figure.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM020
  - CM048
- calloutType: risk
  title: Fast market growth does not guarantee that value accrues to the model vendor
  body: ModelBest’s disclosed footprint is partnership-led and concentrated in markets where OEMs control launch timing, channel access, and the end-user interface. Even if AI-device penetration rises quickly, bargaining power may remain with handset, PC, and vehicle manufacturers rather than with the embedded model supplier.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM046
  - CM048
  - CM049
- calloutType: risk
  title: Efficiency is strategic because price pressure and chip controls are arriving at the same time
  body: The same period that raised enthusiasm for local AI also brought a Chinese model price war and tighter U.S. chip-export enforcement. For ModelBest, efficient small models are not just a product feature; they are one of the few plausible defenses against both falling monetization and unstable access to top-end compute.
  claimRefs:
  - CM003
  - CM004
  - CM040
  - CM041
  - CM042
