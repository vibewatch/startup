tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters to ModelBest
  rows:
  - - AI-phone model layer
    - On-device model integration, local assistants, multimodal device features, and NPU-tuned handset AI
    - Generic handset hardware value not attributable to AI, carrier-service revenue, unrelated app spend
    - Smartphone OEM and platform teams
    - IDC and ModelBest both frame the category around device-side GenAI capability rather than cloud-only traffic
  - - AI PC / local-agent layer
    - Local inference software, bundled copilots, NPU-optimized model deployment, premium device differentiation
    - Commodity PC hardware without AI differentiation, generic office-software revenue
    - PC OEMs, chip partners, enterprise device teams
    - ModelBest publicly markets AI-PC relevance and AI-PC penetration is rising quickly
  - - Smart cockpit / vehicle edge AI
    - Cockpit multimodal interaction, local voice/vision models, in-cabin agent workflows, vehicle-side model integration
    - Battery, drivetrain, and non-AI vehicle BOM
    - Automotive OEMs and cockpit program owners
    - ModelBest has disclosed vehicle programs and cockpit relevance, making automotive an evidence-backed demand surface
  - - Regulated local deployment
    - Local or hybrid deployment in legal, industrial, and public-sector workflows where privacy or latency matters
    - Broad cloud-training capex and unrelated enterprise SaaS budgets
    - Enterprise IT, compliance, or business-unit owners
    - China regulation increasingly rewards vendors that can manage filing, labeling, and data handling in sensitive workflows
  - - Excluded upper-layer cloud / training economy
    - None directly; this layer is mainly an input cost or competitive benchmark
    - Hyperscaler cloud-training spend, GPU clusters, generic public-cloud model serving revenue
    - Cloud platforms and compute owners
    - ModelBest is affected by this layer through chip costs and model-price pressure, but it is not the cleanest place to count the company’s own addressable revenue
  notes: Boundary follows ModelBest’s own terminal-first positioning and independent coverage of its OEM-led deployments. It deliberately excludes most upstream cloud and training spend, which is better treated as input cost, partner leverage, or competitive pressure.
