- id: sizing-lenses
  title: Sizing the market requires several lenses because public estimates describe different layers
  body: 'No single public number cleanly measures ModelBest''s addressable market, so this chapter keeps multiple lenses side by side instead of forcing one TAM. Device adoption is the clearest near-term lens: IDC''s global forecast puts GenAI smartphones at 234.2 million units in 2024 and 912 million by 2028, while Counterpoint expects GenAI-capable devices to reach 45% of global smartphone shipments in 2026. China-specific demand is also material: IDC-linked reporting expects roughly 278 million smartphone shipments in China in 2026, of which 147 million are next-generation AI phones, or 53% penetration. AI PCs form a second lens, with Counterpoint saying AI or GenAI-capable laptops already captured 27% of the market in 2024 and could approach 60% in 2025. A third lens is broader edge-model economics, but those figures conflict because they do not measure the same scope: Grand View sizes on-device AI at USD 10.76 billion in 2025, BCC sizes edge AI at USD 11.8 billion, and MarketsandMarkets
    sizes edge-AI hardware at USD 26.14 billion.'
