company:
  name: ModelBest
chapter:
  number: 2
  title: Market Analysis
  summary: 'ModelBest competes in the on-device and edge-AI layer rather than the whole China AI stack, with public evidence concentrated around AI phones, AI PCs, smart cockpits, robots, wearables, and regulated local deployments. Demand signals are strong but methodologically noisy: IDC-linked China forecasts imply 147 million AI-phone shipments and 53% penetration in 2026, while third-party global on-device and edge-AI estimates range from USD 10.76 billion to USD 26.14 billion for 2025 depending on scope. The market tailwinds are therefore real, but ModelBest still faces memory-driven device weakness, aggressive Chinese model price cuts, tighter chip-export enforcement, and high OEM bargaining power that may cap how much value accrues to an independent model vendor.'
sections:
- id: market-boundary
  title: 'Market boundary: ModelBest sits in the device-side model layer, not the whole AI economy'
  body: 'ModelBest''s own materials do not describe a broad cloud-model platform; they describe a company trying to put large models closest to users across phones, AI PCs, smart cockpits, embodied robots, wearables, and other terminals. The MiniCPM repository reinforces that framing by highlighting compact models for local deployment and resource-constrained environments. Independent coverage from 36Kr and Gasgoo points the same way: ModelBest is being positioned as an early edge-intelligence vendor whose commercial path runs through OEMs, chip partners, and terminal deployment rather than pure public-cloud traffic. That means the relevant market includes device-side model integration, local inference software, cockpit AI, and privacy-sensitive local deployments. It excludes most upstream cloud-training capex and a large share of generic app economy spending. In other words, ModelBest competes where NPU capability, model compression, OEM integration, and privacy or latency constraints matter
    more than raw headline model size.'
