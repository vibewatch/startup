  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: modelbest-market-share
    missingEvidence: ModelBest does not publicly disclose device-category revenue mix, attributable unit share inside AI phones or AI PCs, or per-OEM contract economics.
    whyItMatters: Without category-level mix and attributable share, the chapter can show strong terminal demand direction but cannot prove how much of that value ModelBest captures rather than its OEM partners capturing it.
    diligencePath: Request partner-level revenue mix, design-win counts, or category attach rates from management, or wait for a prospectus or audited disclosure that breaks out device, enterprise, and automotive contributions.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: 'Reviewed market estimates disagree materially because they are not sizing the same thing: one covers on-device AI, one edge AI more broadly, and one hardware only.'
    whyItMatters: Any single-number TAM would overstate precision and could distort valuation or market-share assumptions for a company whose category boundary is already narrow and partnership-led.
    diligencePath: Build a bottom-up China edge-model sizing using device units, AI attach rates, OEM licensing assumptions, and local-deployment budgets rather than relying on off-the-shelf syndicated TAMs.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: ModelBest does not publicly disclose token gross margins, per-device licensing economics, or the profitability of its local-model partnerships under current price-war conditions.
    whyItMatters: The market may be growing, but if OEM pricing pressure and open-model competition force low take rates, ModelBest’s revenue quality could lag the underlying device-adoption story.
    diligencePath: Ask management for category-level gross margins, deployment cost assumptions, and whether AI-phone, AI-PC, and cockpit programs are recurring-license, one-off integration, or revenue-share deals.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: china-ai-pc-tam
    missingEvidence: No reviewed public source isolates a China-only AI PC revenue pool with enough specificity to map directly onto ModelBest’s served market.
    whyItMatters: AI PC is clearly a strategic adjacency for ModelBest, but the lack of a China-specific revenue lens means the chapter must rely on global AI-PC shipment penetration and company partnership disclosures instead.
    diligencePath: Look for IDC, Canalys/Omdia, or OEM investor materials that break China AI-PC units or software attach rates out separately, then link them to ModelBest’s disclosed chip or OEM partnerships.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
    - TM003
