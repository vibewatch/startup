- id: policy-drivers-and-commercialization-gates
  title: Policy tailwinds and commercialization gates simultaneously widen and filter the market
  body: 'China''s policy stack expands the opportunity while also raising the bar for participation. The 2023 CAC and MIIT generative-AI measures made public-facing services a regulated activity, requiring content governance, user-data protection, and, for certain services, security assessment and filing. The 2025 labeling rules added explicit and implicit labeling requirements across the generation and distribution chain. At the same time, the State Council''s 2025 AI+ action set aggressive national targets of more than 70% penetration for new-generation smart terminals and agents by 2027 and more than 90% by 2030, while explicitly prioritizing AI phones, AI computers, connected vehicles, wearables, smart homes, and intelligent-agent applications. The May 2026 AI-agent guidelines add an operational layer by defining agents and identifying 19 application scenarios. CAC''s April 2026 filing totals also show scale: by April 30 there were 868 filed generative-AI services and 530 registered
    applications or functions. For ModelBest, this is both tailwind and gate: policy legitimizes edge deployment but converts filing, labeling, and traceability into recurring commercialization work.'
