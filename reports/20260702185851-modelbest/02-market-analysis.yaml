- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Evidence
  - Timing
  - Valuation implication
  - Diligence ask
  rows:
  - - Privacy, offline availability, and low-latency inference
    - Driver
    - 36Kr and Grand View both describe local processing as faster and more privacy-preserving than cloud-only inference
    - Live now
    - Supports edge-model adoption where network quality or data sensitivity matters
    - What share of ModelBest deployments is justified primarily by privacy or latency economics?
  - - AI+ terminal and agent targets
    - Driver
    - State Council AI+ plan targets >70% terminal/agent penetration by 2027 and >90% by 2030
    - 2025-2030
    - Large policy tailwind for smart terminals and agent-style products
    - Which of the named priority categories are already monetizable for ModelBest?
  - - 2026 AI-agent guidelines and 19 scenarios
    - Driver
    - SCIO/Xinhua says 19 application scenarios were identified across research, industry, consumption, well-being, and governance
    - Near term
    - Expands legitimate use cases for agent-style products
    - Which scenarios match ModelBest’s current product and compliance readiness?
  - - Filing and labeling regime
    - Driver and constraint
    - 2023 measures plus 2025 labeling rules create approval, disclosure, and traceability obligations
    - Ongoing
    - Can act as a moat for prepared vendors but raises recurring compliance cost
    - Which ModelBest products are filed, labeled, or distributed through registered entities?
  - - Memory inflation and weak handset demand
    - Constraint
    - IDC-linked China forecast and Counterpoint both cite rising memory costs and slower China device demand
    - '2026'
    - Can slow units and compress OEM willingness to spend on model differentiation
    - How resilient are ModelBest’s target programs if OEMs re-scope mid-tier launches?
  - - Chinese LLM price war
    - Constraint
    - KrASIA and DigWatch show extreme price cuts, free tiers, and very low token prices
    - Ongoing
    - Edge efficiency becomes strategic, but monetization per token or feature can collapse
    - What are ModelBest’s real gross margins by device, API, or hybrid deployment?
  - - U.S. chip-export tightening plus domestic substitution
    - Constraint and driver
    - CNBC reports a May 2026 loophole closure, while CSIS argues controls accelerate Chinese substitution
    - Immediate and medium term
    - Raises compute uncertainty while making efficient domestic-friendly models more valuable
    - How dependent is ModelBest on imported training compute versus domestic-friendly inference stacks?
  - - OEM and channel bargaining power
    - Constraint
    - China smartphone share remains concentrated among top OEMs and ModelBest’s route to market is partnership-led
    - Structural
    - A smaller model vendor may capture less value than the OEM controlling shipment scale and UX surface
    - How diversified is ModelBest’s revenue across OEMs, categories, and direct software contracts?
  notes: Several rows are intentionally double-edged. The same conditions that make on-device AI attractive for adoption—policy support, hardware progress, localization pressure—also strengthen the negotiating leverage of OEMs and regulators over model vendors.
