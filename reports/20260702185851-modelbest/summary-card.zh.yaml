  topStrengths:
    - 切入点贴合真实市场缺口：面向端侧和边缘部署的紧凑多模态模型，而不是泛化的纯云端 LLM 供给。
    - OpenBMB、GitHub 和 Hugging Face 带来可见生态触达，包括 158 个托管模型，以及据称 24M+ 累计下载量。
    - 战略投资人覆盖电信、国资背景创投和工业自动化，不只补资本，也改善渠道入口。
    - 电信合作和汽车项目里已有具名落地证据，让故事比纯研究实验室叙事更有实质。
  topRisks:
    - 公开资料没有披露收入、ARR、价格表、毛利率或客户数锚点，当前价格仍难以承保。
    - 据报道 $1B+ 的估值，更像由战略稀缺性和投资人联盟质量支撑，而不是由已验证变现能力支撑。
    - 汽车和设备渠道证据集中在少数具名项目和伙伴上，抬高了集中度和执行风险。
    - 如果 OEM 和企业付费转化率仍弱或不透明，开源热度未必能转成付费部署经济性。
  unresolvedGaps:
    - 经审计收入、毛利率和月度烧钱桥接仍未披露。
    - 2026 年 4 月准确投后估值、稀释和优先股堆叠未公开。
    - 公开资料没有披露付费客户数、续约行为或头部客户集中度。
    - 已抓取公开记录中的董事会构成和股权结构持股仍不完整。
