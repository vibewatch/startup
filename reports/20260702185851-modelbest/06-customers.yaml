- id: retention-and-repeat-usage
  title: 'Retention and repeat usage: almost no public durability disclosure'
  body: 'No source reviewed for this chapter discloses the metrics that would convert adoption buzz into durable customer conviction. There is no public paying-customer count, no ARR, no NRR or GRR, no churn, and no contract-length disclosure for China Telecom, Geely, Changan Mazda, or any legal-sector deployment. The best publicly visible repeat-usage proxies are weaker substitutes: cumulative download totals, repeated model launches, a public free API key for MiniCPM-V 4.6, the free MiniCPM-o 4.5 demo and API, and community infrastructure that makes experimentation easy. Those signals support sustained attention, but not commercial retention. The strongest adverse evidence in this chapter comes from the MiniCPM-o 4.5 coverage itself, which argues that earlier half-duplex interaction patterns left many users impatient and hindered multimodal rollout when experience quality was poor. ModelBest''s product direction may address that friction, but public durability evidence remains absent today.'
