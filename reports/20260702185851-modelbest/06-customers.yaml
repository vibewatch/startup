  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-court-customer
    missingEvidence: The specific court, judiciary unit, procurement record, and contract status behind the official legal private-network deployment claim.
    whyItMatters: Without a named public-sector customer, the legal deployment cannot be used as strong proof of revenue durability, concentration, or repeat procurement.
    diligencePath: Request the customer name, procurement process, deployment date, user count, and renewal status from management or customer references.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: paying-customer-conversion
    missingEvidence: Paying-customer count, ARR by segment, top-customer concentration, and conversion from downloads or free API use into paid deployments.
    whyItMatters: The core investment question is whether ModelBest’s large open-source reach converts into recurring commercial accounts rather than remaining mostly community adoption.
    diligencePath: Request segment revenue, top-10 customer concentration, paid API account count, and pipeline conversion from open-source or demo surfaces.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A complete named roster of OEM, telecom, enterprise, and legal customers with production status and deployment stage.
    whyItMatters: The named proof table is necessarily partial, so concentration and breadth cannot be measured precisely from the public record alone.
    diligencePath: Ask management for a customer list with pilot versus production status, contract start date, geography, and current revenue contribution.
    relatedQuestionRefs:
    - QU002
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-cohorts
    missingEvidence: NRR, GRR, churn, contract term, and renewal cohorts for China Telecom, OEM, and enterprise customers.
    whyItMatters: Without retention data, the chapter cannot distinguish one-time launch publicity from durable recurring demand.
    diligencePath: Request cohort-level renewal data, contract samples, and customer-reference interviews for the largest commercial accounts.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: stale
    severity: minor
    topic: brand-level-deployment-detail
    missingEvidence: Updated 2026 deployment detail for Huawei, Volkswagen, and any non-automotive OEM partner beyond financing-article mentions.
    whyItMatters: Named partner lists exist, but the most specific product-level proof remains concentrated in only two auto programs and one telecom channel.
    diligencePath: Refresh partner-announcement searches quarterly and request SKU-level case studies for the named brands mentioned in financing coverage.
