schemaVersion: report-v2
artifact: customers
slug: modelbest
runDate: '2026-07-02'
company:
  name: ModelBest
chapter:
  number: 6
  title: Customers
  summary: 'ModelBest''s public customer proof is bifurcated: the company has unusually broad open-source and developer reach around MiniCPM, plus a small set of named deployment channels led by China Telecom and two publicly named auto programs (Geely Galaxy M9 and Changan Mazda EZ-60). What it still does not disclose is the core investor question — paying-customer count, renewal behavior, contract duration, or concentration by account — so downloads, demos, and partner ecosystems should be treated as top-of-funnel adoption evidence rather than proof of durable recurring revenue.'
sections:
- id: customer-segmentation-and-who-pays
  title: 'Customer segmentation: broad user surfaces, narrow public payer disclosure'
  body: 'ModelBest''s public materials describe a wide user map but a much narrower disclosed payer map. Official product pages place MiniCPM inside phones, AIPC devices, intelligent cabins, embodied robots, and wearables, while the legal section claims a court-workflow deployment on a court private network. That implies at least five meaningful user groups for this chapter: OEM and device makers embedding the model, enterprise and public-sector deployers buying private or edge deployments, robotics and edge integrators packaging MiniCPM into local systems, developers self-hosting or adapting open models, and academic or research users interacting through OpenBMB and Tsinghua-linked open releases. The key analytical split is buyer versus user versus payer. End users may touch MiniCPM through cars, phones, or tools without paying ModelBest directly; the visible payers are likely a much smaller set of OEM, telecom, and enterprise accounts. Public evidence therefore supports strong segmentation
    breadth, but not broad disclosure of account-level monetization.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU025
  - CU026
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-production-and-channel-proof
  title: Named proof exists, but mostly through channels and partner announcements
  body: 'The clearest named commercial proof is channel-led rather than classical SaaS-style case study evidence. China Telecom led a 2026 funding round and both CnTechPost and Gasgoo say it plans deep business collaboration with ModelBest using cloud and computing-power networks. In automotive, Gasgoo and Sina Finance both say ModelBest''s MiniCPM is integrated into vehicles from Geely and Changan Mazda; Sina Finance further names Volkswagen and Huawei as deep partners, while Gasgoo says the Geely Galaxy M9 carries the MiniCPM multimodal model and that the Changan Mazda EZ-60 is the first mass-produced vehicle with an edge-side model. These are meaningful signals because they identify real distribution channels and product surfaces, not just unlabeled logos. But they still fall short of what growth investors usually want from a customer chapter: no contract values, no revenue contribution by partner, no unit economics, and no renewal history. The chapter therefore treats named deployments
    as production-adjacent proof, not as a substitute for disclosed recurring-customer data.'
