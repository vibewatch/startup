- id: expansion-loops-and-concentration-risk
  title: Expansion loops exist, but concentration and channel dependence remain the central risks
  body: ModelBest's expansion logic is understandable from the public record. Open-source releases create awareness and technical trust; deployment cookbooks and framework support move developers into local evaluation; device demos and edge-friendly versions lower integration friction; and only then do a few OEM or enterprise channels become visible as named production references. That loop can work well for phones, automotive cabins, private deployments, and robotics, especially because on-device inference improves privacy and latency. But the same loop also concentrates risk. Publicly named commercial proof is still clustered around China Telecom and a short list of automotive brands, while developer discovery depends heavily on third-party platforms such as GitHub, Hugging Face, Ollama, and OpenVINO. The legal/court claim is strategically attractive but operationally opaque because the customer is unnamed. In effect, ModelBest has broad top-of-funnel reach and a plausible land-and-expand
    motion, but still a thin public base of named, monetized, and renewable accounts.
