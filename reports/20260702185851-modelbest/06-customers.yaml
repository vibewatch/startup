  rows:
  - - OEM / device makers
    - OEM or terminal vendor buys/integrates; end user consumes embedded AI
    - Phones, PCs, wearables, smart home, vehicle cabins
    - Official site lists phones, AIPC, cabins, wearables; Sina names Geely, Changan, Volkswagen, Huawei
    - Potentially highest direct commercial value because device integration is distributable at scale
    - No public royalty, ASP, contract length, or renewal data
  - - Enterprise / telecom / legal deployers
    - Enterprise or telecom pays; professionals use local/private deployment
    - Private-network legal workflow, telecom-edge deployment, industry-specific AI
    - Official court-workflow claim plus named China Telecom collaboration
    - Could support higher-value private deployment and services contracts
    - No named court/customer unit, no revenue contribution, no retention disclosure
  - - Robotics / edge integrators
    - Integrator or platform partner pays; downstream operator uses the model
    - Embodied robots, edge AI modules, intelligent cabin stacks
    - Official site explicitly lists embodied robots and intelligent cabins
    - Strategic expansion channel for high-value vertical solutions
    - Named robotics integrators and contract scope are not public
  - - Developers / open-source community
    - Mostly self-serve users; payer share undisclosed
    - Local deployment, fine-tuning, framework integration, demo apps
    - 24M+ cumulative downloads; HF org with 158 models and 11 spaces; Ollama/OpenVINO support
    - Strong top-of-funnel and ecosystem leverage
    - No conversion rate from downloads to paid accounts
  - - Academic / research users
    - Research lab or academic group uses open releases; payer usually none or indirect
    - Benchmarking, multimodal research, edge-model experimentation
    - OpenBMB + Tsinghua collaboration and arXiv technical reports
    - Strategic credibility and feedback loop rather than immediate revenue
    - No public split between academic usage and commercial usage
  notes: The segmentation is broad, but only a subset of segments has named production-grade proof. Public materials identify user surfaces more clearly than they identify payers.
