figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Maps how ModelBest moves from broad community discovery to narrow named commercial proof, with the largest evidence density at the developer and edge-evaluation stages.
  data:
    items:
    - label: Open-source discovery
      detail: Users first encounter MiniCPM through GitHub, Hugging Face, OpenBMB, Ollama, or related model releases.
    - label: Local technical evaluation
      detail: Developers or integrators test on-device deployment, benchmark efficiency, and validate framework support.
    - label: Edge app experimentation
      detail: iOS, Android, HarmonyOS, and local desktop demos make the models tangible to builders and device teams.
    - label: Industry-specific fit test
      detail: Telecom, legal, cabin, and robotics prospects assess whether privacy, latency, and resource efficiency beat cloud-heavy alternatives.
    - label: Named partner integration
      detail: A small set of channels such as China Telecom, Geely, and Changan Mazda become publicly visible.
    - label: Production deployment
      detail: Only a few public examples show productized use, mostly in auto and channel-led enterprise contexts.
    - label: Expansion loop
      detail: More frameworks, chip targets, and vertical demos feed additional discovery and evaluation cycles.
    - label: Retention proof gap
      detail: Public evidence drops sharply at renewal, NRR, and concentration visibility.
  approximationNotes: null
  claimRefs:
