  - - Hugging Face OpenBMB organization
    - 158 models, 18 collections, 11 spaces, model-specific download counts
    - Large active model catalog and measurable developer interest
    - Download totals do not equal paying customers or retained deployments
    - Hugging Face is a major distribution and credibility channel
  - - MiniCPM-V-Apps / HarmonyOS demos
    - Offline iOS, Android, and HarmonyOS NEXT demos via llama.cpp
    - Real app-level deployment paths exist on consumer devices
    - No evidence that demo users become enterprise customers
    - Mobile-demo channel broadens experimentation surfaces
  - - Intel OpenVINO
    - Official MiniCPM-V optimization guide and device-runtime documentation
    - Third-party ecosystem engineering effort behind MiniCPM deployment
    - No proof of direct revenue from Intel-linked deployments
    - OpenVINO can seed enterprise and edge-integrator adoption
  - - Ollama / local desktop surfaces
    - Official openbmb/minicpm5 entry and desktop-pet references
    - MiniCPM participates in popular local-LLM distribution channels
    - No visibility into repeat use, paid support, or account ownership
    - Ollama widens reach among hobbyist and prosumer developers
  - - OpenBMB / arXiv / Tsinghua research channel
    - OpenBMB site cadence and MiniCPM4 technical report
    - There is an ongoing research-user and academic credibility loop
    - Academic attention may never monetize directly
    - Research prestige strengthens upstream awareness and downstream hiring / contribution loops
  notes: This extra table is intentionally channel-focused rather than revenue-focused. It helps separate visible ecosystem adoption from invisible paying-customer conversion.
