- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / dependence risk
  - Potential impact
  - Diligence path
  rows:
  - - Open-source release -> local evaluation -> OEM/enterprise integration loop
    - Conversion depends on third-party channels (GitHub, Hugging Face, Ollama, OpenVINO) and is not publicly tied to a direct sales funnel
    - ModelBest can have huge technical reach without proving paid-customer depth
    - Request source-of-lead data and conversion from community users to paid deployments
  - - China Telecom collaboration
    - Named telecom channel is strategically important but commercially opaque
    - If China Telecom is the main enterprise-distribution route, concentration could be higher than public materials imply
    - Request booked revenue, pipeline attribution, and exclusivity terms related to China Telecom
  - - Automotive cabin deployments
    - Publicly named vehicle proof clusters around Geely and Changan Mazda, with broader brand names lacking deployment detail
    - Loss or delay in a small number of auto channels would sharply weaken the visible customer narrative
    - Request OEM-by-OEM revenue, launch timeline, and renewal status
  - - Legal / court private deployment
    - Official legal claim is strategically attractive but the end customer is unnamed
    - Unnamed public-sector proof cannot support strong retention or procurement assumptions
    - Request the specific court, contract stage, procurement structure, and post-deployment usage data
  - - Framework and ecosystem support
    - External enablement by Intel, Ollama, and app-demo repos helps adoption but also leaves ModelBest dependent on outside maintainers and platforms
    - Channel power may sit with ecosystems rather than with ModelBest if direct monetization is weak
    - Request percentage of active users entering through each ecosystem and any co-marketing or revenue-sharing terms
  notes: Concentration risk is inferred from the narrow set of named commercial references rather than from any disclosed revenue concentration table, because no such table is public.
