- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competitive threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Cross-platform multimodal edge efficiency
    - Phi, Gemma, Ministral, and Qwen all now market efficient open models; Apple offers free on-device APIs inside its own OS
    - High
    - MiniCPM-V 4.6 mobile deployment claims versus Gemma/Qwen/Ministral, plus Apple Foundation Models no-cost packaging
    - Request normalized device benchmarks, latency, and power draw across the top five edge competitors
  - - Open-source strategy and developer goodwill
    - 'Open-source is crowded: Phi (MIT), Mistral (Apache), Gemma (open weights), Qwen (Apache), Kimi, and MiniMax all compete for the same mindshare'
    - High
    - Public licensing and repo evidence across peers
    - Ask ModelBest for actual downstream adoption, stars, downloads, and commercial conversions by model family
  - - OEM and regulated-industry access in China
    - Partner-led distribution can be strong, but it also concentrates bargaining power in Huawei, Geely, Baidu Cloud, and other larger counterparties
    - Medium-high
    - ModelBest partnership list is long but economics are undisclosed
    - Request contract duration, renewal mechanics, exclusivity, attach-rate, and revenue concentration by partner
  - - Trust and compliance narrative
    - Apple privacy, Microsoft enterprise safety, Mistral self-hosting, and Baidu domestic infrastructure provide alternative trust anchors
    - Medium
    - Trust narratives differ, reducing ModelBest's uniqueness
    - Ask customers why they picked MiniCPM over these other trust models and whether that choice is sticky
  - - Low switching costs at the API / model layer
    - OpenAI-compatible APIs and standard open-source inference stacks make multi-homing easy
    - High
    - Kimi and GLM API compatibility plus common frameworks across MiniCPM, Gemma, Llama, and Mistral
    - Test migration time between MiniCPM, Kimi, GLM, and Gemma for a representative application
  - - Consumer or developer default surface
    - AICPB ranking shows the big Chinese AI apps and Apple/Meta platforms have much larger default reach than ModelBest
    - High
    - ModelBest absent from top-50 app ranking; incumbents dominate MAU or ecosystem distribution
    - Request direct-user telemetry and evidence that partner embeddings create recurring usage rather than passive installs
  notes: Severity measures risk to ModelBest's competitive durability rather than to overall edge-AI demand. The key distinction is between a technically strong product family and a commercially sticky moat.
