- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Price / unit model
  - Packaging
  - What is included
  - Unknowns / implication
  rows:
  - - ModelBest / MiniCPM
    - Open-weight local use; public pages do not quote a universal API price card
    - Apache-licensed repos plus OEM / partner deployment
    - Text and multimodal edge models, framework support, OEM/channel integration
    - Economics depend on partner contracts, not just public model access
  - - Microsoft Phi
    - Model pages retrieved do not publish list inference pricing; models available through Azure Foundry and MaaS
    - MIT-licensed models plus managed Azure catalog
    - 3.8B mini model, 128K context, function calling, multilingual support
    - Strong packaging for enterprise buyers even without transparent public edge-device unit pricing
  - - Google Gemma
    - Open weights; local inference economics depend on hardware footprint rather than token price
    - Open weights via developer ecosystem and mobile-optimized variants
    - Small 2B/4B mobile models, quantized mobile paths, multimodality
    - Low switching cost for self-hosters, but total device cost depends on hardware constraints
  - - Apple Intelligence
    - No cost per request for app developers using on-device models
    - OS-native framework and APIs
    - Offline on-device inference plus Private Cloud Compute escalation
    - Very hard for third parties to beat on marginal cost inside Apple's own ecosystem
  - - Meta Llama 3.2
    - Model access requires license acceptance; local costs depend on chosen quantization and hardware
    - Open-access download with custom community license
    - 1B/3B models, 128K context, quantized on-device use cases
    - Commercial packaging is less frictionless than MIT/Apache peers even though developer access is broad
  - - Mistral / Ministral 3
    - API pricing exists, but retrieved pages emphasize open weights and deployment options over headline list price
    - Apache 2.0 weights plus Mistral platform / cloud partners
    - 3B/8B/14B edge models, self-hosting, enterprise support
    - Competes heavily on deployment portability more than a simple per-token price card
  - - Alibaba Qwen
    - Open-weight Qwen3 dense models; managed access can route through Alibaba tooling
    - Apache 2.0 small dense models plus cloud / app ecosystem
    - 0.6B-32B dense range, local frameworks, agentic support
    - Packaging advantage comes from Alibaba distribution, not just raw model price
  - - Moonshot Kimi K2.6
    - Free user access with paid plans; API docs point to separate pricing docs
    - Open-source model plus OpenAI-compatible API
    - 256K context, multimodality, tool use, coding / agent workflows
    - Good packaging for developers, but price transparency in retrieved pages is partial
  - - MiniMax M3
    - Token Plan users keep the same price while receiving improved performance
    - Model page, token-plan packaging, open-source / local roadmap
    - 1M context, multimodality, coding / agent flows
    - Packaging is compelling, but public unit economics remain less explicit than Apple's or pure open-weight models
  - - Z.ai / GLM-5.1
    - Public docs emphasize API usage rather than simple list pricing
    - Agent/chat branding plus coding-focused API docs
    - Reasoning mode, 65,536 max output tokens, long-horizon coding
    - OpenAI-like interface lowers migration cost even if pricing transparency is limited
  - - Baidu ERNIE 5.1
    - Retrieved release focuses on 6% relative training cost, not published customer price
    - Domestic platform and flagship model release
    - Agentic RL, cost-efficiency, leaderboard positioning
    - Baidu competes on bundled ecosystem economics more than on public open-weight packaging
  notes: This table compares packaging economics, openness, and buyer friction rather than pretending every competitor discloses the same per-token list price. Apple's “no cost per request” and open-weight access are the most comparable public economics in the retrieved source set.
