chapter:
  number: 3
  title: Competitors
  summary: 'ModelBest''s MiniCPM remains a technically credible open edge-model family: the company pitches it for phones, AIPCs, cockpits, robots, and wearables; the core text stack is Apache-2.0 licensed; and recent MiniCPM releases claim unusually strong multimodal and on-device efficiency. But the moat is narrower than the category story implies. Microsoft Phi, Google Gemma, Apple Intelligence, Meta Llama 3.2, Mistral''s Ministral line, Alibaba Qwen, Moonshot Kimi, MiniMax, Z.ai GLM, and Baidu ERNIE all now offer some combination of open weights, mobile footprint, agentic tooling, or pre-installed distribution, while Apple and Chinese platform incumbents control much larger default surfaces. The durable edge for ModelBest is therefore not “small model” in the abstract, but cross-platform multimodal efficiency plus Chinese OEM/regulatory fit; pricing power, developer lock-in, and open-source mindshare alone look commoditized.'
sections:
- id: landscape-and-competitive-classes
  title: 'Landscape: direct edge-model peers, platform incumbents, and workflow substitutes'
  body: |-
    ModelBest competes in more than one market at once. At the narrowest layer, MiniCPM fights other small or efficiency-oriented model families that also promise local inference, mobile deployment, or favorable intelligence-per-parameter: Microsoft Phi, Google Gemma, Meta Llama 3.2, Mistral's Ministral line, and Alibaba's smaller Qwen variants all fit this class. Those are the cleanest “same job” comparisons for an OEM, app developer, or enterprise team deciding which open or semi-open foundation model to run close to the user rather than inside a hyperscale cloud. At a broader layer, ModelBest also competes with larger Chinese agentic-model vendors such as Moonshot Kimi, MiniMax, Z.ai/GLM, and Baidu ERNIE whenever buyers care more about coding, long-context, tool use, or bundled ecosystem services than about raw on-device minimalism.

    The substitute set is even broader. Apple Intelligence is not sold as an open model, but it is a powerful embedded substitute because Apple lets any app invoke on-device Apple Intelligence features offline and at no cost per request. OpenAI's ChatGPT is the opposite kind of substitute: cloud-first rather than edge-first, but still a default assistant developers and users may adopt instead of wiring a local stack. Internal build is also a live alternative because many of these competitors ship open weights, standard transformer interfaces, or OpenAI-compatible APIs, making it easier for buyers to assemble a private stack instead of betting on a single vendor.
