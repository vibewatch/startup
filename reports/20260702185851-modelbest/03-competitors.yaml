  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: oem-economics
    missingEvidence: Partner-level attach rates, renewal terms, exclusivity, and revenue contribution for Geely, Huawei, Baidu Cloud, Intel, Great Wall, and other named ModelBest relationships.
    whyItMatters: ModelBest's moat looks channel-driven, but public sources do not show whether those partner wins create durable switching costs or just one-off integrations.
    diligencePath: Request contract summaries, revenue concentration, renewal dates, and attach-rate / active-device telemetry by major partner.
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: Realized pricing, deployment-cost profile, and gross-margin data for MiniCPM-based commercial deployments versus open-weight self-hosting alternatives.
    whyItMatters: Open-source commoditization matters only if ModelBest cannot convert technical efficiency into better commercial unit economics than peers.
    diligencePath: Request per-device, per-seat, or per-call commercial pricing and the associated delivery cost structure for major customer cohorts.
    relatedTableRefs:
    - TP003
    - TP004
  - type: conflicting-data
    severity: material
    topic: vendor-authored-benchmarks
    missingEvidence: Independent, apples-to-apples benchmarking of MiniCPM-V 4.5 / 4.6 against Gemma, Qwen, Ministral, and Phi on the same hardware and harness.
    whyItMatters: Many of the strongest MiniCPM superiority claims are vendor-authored; without a neutral harness, it is difficult to separate true efficiency edge from benchmark framing.
    diligencePath: Commission or reproduce a third-party benchmark suite covering latency, power, memory, OCR, video, and accuracy on representative edge hardware.
    relatedTableRefs:
    - TP002
    - TP004
  - type: missing-source
    severity: minor
    topic: peer-pricing-transparency
    missingEvidence: Comparable public unit-pricing disclosures for MiniMax, GLM, ERNIE, and Apple's non-OS deployment economics.
    whyItMatters: The public source set supports a packaging comparison, but not a clean per-token or per-device price leaderboard across all competitors.
    diligencePath: Collect current API price sheets, enterprise offer letters, or procurement records for each relevant competitor.
    relatedTableRefs:
    - TP003
