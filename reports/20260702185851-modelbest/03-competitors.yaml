- id: capability-and-packaging-comparison
  title: 'Capability, openness, and packaging: ModelBest is strong, but not alone'
  body: |-
    ModelBest's positive case is real. The company positions MiniCPM across phones, AIPCs, cockpits, robots, and wearables; the MiniCPM repo frames MiniCPM5-1B as a 1B-class on-device SOTA model; MiniCPM4.1 emphasizes sparse-attention speedups at 128K context; and the MiniCPM-V line claims unusually strong multimodal quality per parameter, including mobile deployment across iOS, Android, and HarmonyOS. That is a better fit for OEMs and Chinese edge-device builders than a cloud-only coding model.

    But the competitor set has converged toward the same design center. Microsoft explicitly markets Phi as open-source SLMs for on-device use without cloud connectivity, with Phi-4-mini at 3.8B parameters, 128K context, and function calling. Google now offers Gemma 4 E2B/E4B for mobile and IoT deployment with published mobile-memory footprints. Meta's Llama 3.2 ships in 1B and 3B sizes with quantized on-device use cases, though under a custom community license rather than MIT or Apache. Mistral released Ministral 3 models in 3B, 8B, and 14B sizes under Apache 2.0 for edge and local deployment. Qwen3 open-weights dense models down to 0.6B, while Moonshot, MiniMax, GLM, and ERNIE increasingly optimize for agentic coding, multimodality, or long-horizon execution. The implication is that ModelBest does not own “efficient open model”; it must win on execution details such as cross-platform deployment, multimodal efficiency, and China-specific commercial integration.
