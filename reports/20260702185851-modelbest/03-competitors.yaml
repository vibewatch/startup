- id: moat-durability-and-adverse-evidence
  title: 'Moat durability: open-source helps, but only if ModelBest converts efficiency into sticky channels'
  body: |-
    The adverse evidence is straightforward. Open-source availability is now common, not rare. Phi is MIT-licensed, Mistral's new small models are Apache 2.0, Gemma is open-weight with responsible commercial use, Qwen3 dense models are Apache 2.0, Kimi K2.6 and MiniMax M3 emphasize open-weight or soon-to-be-open-weight distribution, and Llama 3.2 offers an enormous community despite a more restrictive license. At the same time, Apple's Foundation Models framework makes on-device AI free per request for any iOS developer, and Chinese consumer leaders already own far larger app distribution than ModelBest. Those facts weaken any claim that MiniCPM can defend itself purely through openness or baseline edge efficiency.

    ModelBest still has a plausible moat, but it is narrower and more conditional than its marketing suggests. MiniCPM's best evidence is cross-platform multimodal efficiency: MiniCPM-V 4.6 claims superior vision-language efficiency versus Gemma, Qwen, and Ministral at tiny scale, and the company has real OEM, cloud, and regulated-industry relationships in China. That combination could matter for buyers who want local deployment, Chinese ecosystem fit, and independence from a single foreign cloud or OS vendor. The missing proof is commercial stickiness: attach rates, renewal terms, realized revenue, and whether partners such as Geely, Huawei, or Baidu Cloud view ModelBest as core infrastructure or as one swappable model among many. Until that evidence appears, MiniCPM looks durable as a strong product family, but only moderately durable as a standalone moat.
