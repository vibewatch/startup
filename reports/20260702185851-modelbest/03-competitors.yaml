- id: distribution-trust-and-switching-costs
  title: Distribution, trust posture, and switching costs favor incumbents more than ModelBest
  body: |-
    Distribution power is where the field becomes asymmetric. Apple can push on-device models through the installed base of iPhone, iPad, and Mac; Microsoft distributes Phi through Azure Foundry and its broader enterprise stack; Meta benefits from a vast open-source community and hundreds of millions of downloads; and Chinese consumer incumbents control massive AI-app surfaces. AICPB's April 2026 ranking shows how concentrated this distribution is: Doubao leads at 336.04 million MAU, Qwen at 220.35 million, Quark at 162.30 million, DeepSeek at 138.98 million, and Kimi at 25.33 million. ModelBest does not appear in the top 50, so its route to relevance is partner embedding rather than end-user pull.

    Trust posture is more mixed. ModelBest has credible local signals—court-network deployment, a Beijing key laboratory, and ASPICE L2 automotive process certification—that matter for regulated and OEM buyers. Yet competitors also offer trust in different forms: Apple emphasizes privacy and Private Cloud Compute; Mistral emphasizes self-hosted and EU-hosted options; Microsoft says Phi is safety-post-trained for production; and Baidu pitches ERNIE as a cost-efficient flagship integrated into domestic infrastructure. Switching costs look low at the model layer because Kimi and GLM expose OpenAI-compatible APIs, while MiniCPM, Gemma, Mistral, Llama, and Qwen all support standard open-source inference stacks. Lock-in, where it exists, is therefore more likely to come from OEM channels, operating systems, app distribution, or enterprise procurement than from model APIs or weight formats themselves.
