- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  summary: The market converts when a cost or access problem produces an institutional sponsor, then survives
    only if the vendor fits payer, provider, and documentation workflows.
  data:
    nodes:
    - id: problem
      label: Cost or access problem
      detail: Preterm, NICU, ER, depression, or desert-driven access gaps create urgency.
    - id: buyer
      label: Institutional sponsor
      detail: Plan, employer, provider group, or Medicaid agency owns the budget decision.
    - id: program
      label: Benefit or care model launch
      detail: Vendor is contracted for navigation, monitoring, triage, and postpartum continuity.
    - id: integration
      label: Workflow integration
      detail: Program must align with OB, NICU, RPM, coding, and member-engagement workflows.
    - id: scale
      label: Scaled reimbursement-backed adoption
      detail: Expansion happens only when savings and access claims survive operational scrutiny.
    edges:
    - from: problem
      to: buyer
      label: creates sponsor
    - from: buyer
      to: program
      label: funds launch
    - from: program
      to: integration
      label: requires execution
    - from: integration
      to: scale
      label: proves value
