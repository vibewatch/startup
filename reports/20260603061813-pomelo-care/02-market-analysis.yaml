- id: TM003
  title: Segment / buyer map
  columns:
  - Segment or workflow
  - Primary buyer
  - Primary user
  - Budget owner
  - Adoption trigger
  rows:
  - - Commercial health-plan maternity management
    - Health plan clinical or network leadership
    - Pregnant members and plan care-management teams
    - Medical management or value-based care budget
    - Need to reduce preterm, NICU, and avoidable ER spend
  - - Self-insured employer maternity benefit
    - Benefits leadership and consultant ecosystem
    - Employees, dependents, HR support teams
    - Employer health-benefits budget
    - Rising claims trend plus retention and return-to-work concerns
  - - Provider-extension workflow
    - OB-GYN or health-system leadership
    - In-person OBs, MFMs, NICU teams, referred patients
    - Clinical operations or partner-services budget
    - Inbox burden, after-hours triage, and care coordination gaps
  - - State Medicaid maternal-health initiative
    - State Medicaid agency and MCO leadership
    - Medicaid beneficiaries and community partners
    - Medicaid program budget
    - Maternal-outcomes mandates, TMaH-style models, postpartum continuity goals
  - - Status-quo substitute path
    - Carrier maternity vendor or fragmented case management
    - Members and internal care managers
    - Existing benefits or utilization-management budget
    - Buyer chooses a cheaper or incumbent program instead of a clinician-led model
  notes: The market is institutionally purchased but operationally multi-sided, so buyer, payer, provider,
    and member needs all matter in the sales motion.
