  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-attach-rates
    missingEvidence: Buyer-level pricing, PMPM structure, implementation fees, attach rates, and contract
      duration by payer, employer, provider, and Medicaid channel.
    whyItMatters: Without contract economics the chapter can show need and adoption logic, but it cannot
      convert the category into a defensible public SAM or SOM.
    diligencePath: Request anonymized customer contracts or a pricing schedule, plus cohort-level penetration
      and renewal data by buyer type.
    relatedQuestionRefs:
    - QM022
    - QM023
  - type: conflicting-data
    severity: material
    topic: broad-market-estimate
    missingEvidence: A single third-party market model that cleanly breaks out U.S. virtual maternity
      care from adjacent women’s digital-health categories.
    whyItMatters: Public TAM reports conflict on scope and year, so averaging them would create false
      precision in underwriting and valuation work.
    diligencePath: Obtain analyst methodologies or payer-side category spend data that isolate maternity-specific
      virtual care rather than broad femtech.
    relatedQuestionRefs:
    - QM004
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: state-medicaid-reimbursement
    missingEvidence: State-by-state evidence on which maternity telehealth, RPM, and postpartum services
      are reimbursed consistently outside pilots or high-risk carve-outs.
    whyItMatters: Federal policy is directionally supportive, but commercial scale depends on state-level
      Medicaid operations and private-plan reimbursement behavior.
    diligencePath: Build a state policy matrix from Medicaid bulletins and MCO manuals for the largest
      target geographies, then compare to actual billed services.
    relatedQuestionRefs:
    - QM014
    - QM015
    - QM024
    relatedTableRefs:
    - TM004
