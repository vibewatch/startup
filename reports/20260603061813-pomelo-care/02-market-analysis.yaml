tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment or spend bucket
  - Included spend
  - Excluded spend
  - Primary buyer or payer
  - Why it matters
  rows:
  - - Virtual maternity care core
    - Pregnancy and postpartum education, monitoring, triage, coordination, clinician-led virtual care
    - General telehealth not tied to pregnancy or postpartum workflows
    - Health plans, employers, Medicaid, provider groups
    - This is the cleanest public category boundary from PHTI and Pomelo
  - - Institutional maternity-risk programs
    - Programs aimed at preterm, NICU, depression, ER, and c-section cost reduction
    - General wellness stipends and employee-assistance programs without maternity care delivery
    - Payers, self-insured employers
    - This is the monetizable budget wedge Pomelo markets most directly
  - - Provider extension services
    - Referral intake, between-visit messaging, remote monitoring, documentation, postpartum coordination
    - Pure consumer app engagement without provider workflow integration
    - OB-GYN groups, MFMs, NICUs, health systems
    - Provider workflow fit affects adoption and defensibility
  - - Broader women’s digital health
    - Fertility, telemedicine, wearables, mental health, maternal health, chronic-condition tools
    - Unrelated general digital health categories
    - Consumers, employers, providers, insurers
    - Useful outer ceiling but too broad to use as Pomelo SAM
  - - Adjacent lifecycle categories
    - Midlife, pediatric, reproductive, and family-care adjacencies
    - Standalone pediatric-only or menopause-only spend in the current maternity analysis
    - Mixed institutional buyers
    - Important for strategy expansion but not the core chapter denominator
  notes: Boundary discipline matters here because broad women’s-health reports include categories that
    Pomelo may enter over time but that overstate the current maternity-first wedge.
  claimRefs:
  - CM001
  - CM004
  - CM008
  - CM009
  - CM010
  - CM011
- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Publisher or lens
  - Year anchor
  - Scope
  - Value
  - Growth or trend
  - Why it matters
  - Main limitation
  rows:
  - - Strategic Market Research
    - 2024→2030
    - U.S. women’s digital health
    - $590M → $1.35B
    - 14.8% CAGR
    - Shows a low-end broad digital-health ceiling
    - Includes many categories beyond virtual maternity
  - - Grand View Research
    - 2023→2030
    - U.S. women’s digital health
    - $949.3M → $3.2537B
    - 19.2% CAGR
    - Shows how much broader public TAMs can become
    - Different base year and scope from other publishers
  - - March of Dimes prematurity profile
    - '2024'
    - U.S. live-birth denominator derived from preterm rate
    - ~3.63M births
    - Current annual funnel
    - Best public top-of-funnel for maternity-program sizing
    - Births are not revenue and still need payer conversion
  - - March of Dimes + CDC
    - 2024 + 2023
    - High-cost wedge inside the birth funnel
    - 377,204 preterm births; 9.8% NICU admission rate
    - Persistent complication burden
    - Anchors the clinical-cost problem buyers are trying to solve
    - Still not a priced market
  - - Pomelo scale claim
    - '2026'
    - Company exposure within the birth funnel
    - Nearly 7% of U.S. births; >25M covered lives
    - Meaningful current scale
    - Shows Pomelo already operates at national relevance
    - Does not disclose pricing, attach rate, or buyer mix
  - - Evidence-constrained public SAM/SOM
    - '2026'
    - Pomelo-specific monetizable wedge
    - Not isolatable from open sources
    - n/a
    - Prevents false precision in valuation work
    - Needs contract economics, PMPM, and program penetration data
  notes: This table intentionally mixes broad market reports with a constrained birth-based lens because
    the broad reports are contradictory while the birth funnel is observable but not directly monetized.
