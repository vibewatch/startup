  - TM002
  figureRefs:
  - FM002
- id: buyers-payers-and-demand-signals
  title: Buyers, payers, and demand signals
  body: The commercial buyer is institutional, but the workflow is multi-sided. Health plans buy to reduce
    preterm, NICU, and avoidable ER costs across a covered population. Self-insured employers buy for
    the same cost reasons, but also for recruitment, retention, and return-to-work outcomes. Provider
    groups care when a vendor can manage between-visit questions, triage, and monitoring without breaking
    continuity with the in-person OB or NICU team. State Medicaid agencies matter because maternal-outcomes
    policy increasingly rewards continuity, behavioral-health integration, and community-based support.
    Demand evidence is clear. PHTI says plans, employers, and Medicaid programs are actively seeking better
    maternity solutions. Mercer, Business Group on Health, KFF, SHRM, and Aon all show rising employer
    health-benefit costs and stronger scrutiny of vendor value. Maven adds that more than half of benefits
    leaders now see high-risk pregnancies as a cost inflator. Pomelo’s own employer and payer pages, plus
    the Koch case study, are therefore credible as go-to-market evidence even if they are not neutral
    proof of category size.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM025
