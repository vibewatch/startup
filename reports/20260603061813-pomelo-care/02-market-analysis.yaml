figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: A defensible Pomelo market lens narrows from all U.S. births to the high-cost complication
    wedge and then to institutionally purchased maternity-risk programs.
  data:
    items:
    - label: All U.S. live births
      value: ~3.63M
      note: Derived from March of Dimes 2024 preterm rate and count
    - label: High-cost complication wedge
      value: 377k preterm births
      note: Preterm births are the cleanest public cost-problem denominator
    - label: NICU burden signal
      value: 9.8% of births
      note: CDC 2023 NICU admission rate shows why buyers care about neonatal costs
    - label: Current Pomelo birth exposure
      value: ~254k births
      note: Estimated by applying Pomelo’s near-7% share claim to the 2024 birth denominator
    - label: Monetizable wedge
      value: Institutional maternity-risk contracts
      note: Actual revenue depends on payer, employer, Medicaid, and provider contracts rather than raw
        birth counts
  approximationNotes: Birth exposure is estimated from March of Dimes and Pomelo scale claims; it is a
    funnel lens, not disclosed revenue.
  claimRefs:
  - CM003
  - CM019
  - CM020
  - CM039
  - CM040
  - CM044
