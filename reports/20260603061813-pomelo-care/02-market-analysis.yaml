slug: pomelo-care
runDate: '2026-06-03'
company:
  name: Pomelo Care
chapter:
  number: 2
  title: Market Analysis
  summary: Pomelo’s current market is best understood as institutionally purchased virtual maternity care,
    not all women’s digital health. Public evidence supports strong payer, employer, provider, and Medicaid
    demand because preterm, NICU, and access problems are costly and persistent, but broad TAM reports
    conflict and open sources still do not isolate a defensible Pomelo-specific SAM or SOM.
sections:
- id: market-boundary-and-what-counts
  title: Market boundary and what should count in the denominator
  body: 'The right market boundary is narrower than “women’s digital health” and broader than a simple
    pregnancy app. PHTI defines virtual maternity care as education, remote monitoring, care coordination,
    and direct clinical care during and after pregnancy. Pomelo’s current payer, employer, and provider
    pages line up with that framing: the company sells 24/7 clinician-backed support around pregnancy,
    postpartum, and neonatal transitions, then uses midlife and pediatric care as adjacencies beyond the
    core wedge. That means the included spend for this chapter is institutional maternity-program spend
    tied to risk identification, triage, behavioral support, care coordination, and postpartum continuity.
    The excluded spend is just as important. Broad femtech and women’s digital-health reports pull in
    fertility-only tools, generic telemedicine, wearables, chronic-disease apps, and menopause categories
    that Pomelo may touch over time but do not define the current maternity-first market entry. If that
    broader denominator is used without adjustment, it overstates Pomelo’s monetizable wedge and weakens
    valuation discipline.'
  claimRefs:
  - CM001
  - CM004
  - CM007
  - CM008
  - CM009
  - CM010
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses-and-why-public-tams-conflict
  title: Sizing lenses and why public TAMs conflict
  body: Public market reports are directionally useful but not reliable enough to serve as a standalone
    Pomelo TAM. Strategic Market Research places the U.S. women’s digital-health market at about $590
    million in 2024, while Grand View Research starts from a much higher $949.3 million in 2023 and projects
    a much larger 2030 outcome. Those estimates conflict because they measure different scopes and product
    bundles, not because one necessarily describes Pomelo’s actual near-term wedge. A more defensible
    public sizing lens starts with the real maternity denominator. March of Dimes reports 377,204 preterm
    births at a 10.4% rate in 2024, implying roughly 3.63 million live births nationally. CDC then shows
    NICU admission at 9.8% of births in 2023, which highlights how much of the category value is tied
    to avoiding high-cost complications rather than selling wellness content to all women. Pomelo’s own
    claim that it already touches nearly 7% of U.S. births implies meaningful existing scale, but it does
    not reveal price, mix, or attach rates well enough to compute a public SOM.
  claimRefs:
  - CM003
  - CM005
  - CM006
  - CM007
  - CM019
  - CM020
  - CM039
  - CM041
  - CM042
  - CM044
