- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Time horizon
  - Implication for market adoption
  - Diligence ask
  rows:
  - - Maternity care deserts and OB shortages
    - Positive demand driver
    - Current
    - Increase the need for between-visit support and remote triage
    - How much adoption is in shortage counties versus well-served urban plans?
  - - Preterm and NICU cost burden
    - Positive demand driver
    - Current
    - Makes ROI-centric payer and employer sales narratives credible
    - What savings persist after risk adjustment and selection bias?
  - - Medicaid maternal-health reform
    - Positive demand driver
    - Current
    - Creates policy support for telehealth, home monitoring, doulas, and postpartum continuity
    - Which state Medicaid programs reimburse beyond pilots or high-risk pregnancy only?
  - - Employer medical-cost inflation
    - Positive demand driver
    - Current
    - Pushes buyers toward programs that claim measurable outcomes
    - How often do buyers require third-party validation before scaling?
  - - Benefit navigation complexity
    - Negative constraint
    - Current
    - Can keep employees from using available support even when employers expand offerings
    - What share of eligible members actually enroll and engage?
  - - Provider access and directory failures
    - Negative constraint
    - Current
    - Coverage may not convert into real prenatal access without workflow execution
    - How often does Pomelo meaningfully improve appointment access or referral close rates?
  - - Coding and documentation burden
    - Negative constraint
    - Current
    - Reimbursement support still depends on operational rigor rather than policy headlines alone
    - Which services are reimbursed systematically versus absorbed in capitation or PMPM?
  - - Opaque pricing and buyer mix
    - Negative constraint
    - Current
    - Blocks public SAM and SOM calculation even though market need is clear
    - Request PMPM pricing, attach rates, employer versus payer mix, and Medicaid exposure
  notes: The category can be fundamentally attractive while still hard to underwrite if adoption depends
    on workflow execution, reimbursement operations, and undisclosed contract economics.
