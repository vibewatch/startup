- id: TR005
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk domain
  - Monitor
  - Thesis-break trigger
  - Action implication
  - Diligence ask
  rows:
  - - Telehealth reimbursement
    - State denial rate, carve-out changes, parity changes in top states
    - Meaningful reimbursement or eligibility loss in one of Pomelo’s top markets without offsetting pricing
      power
    - Re-underwrite gross margin, coverage strategy, and state expansion assumptions
    - Ask for top-state revenue mix and reimbursement sensitivity model.
  - - Licensure / provider model
    - Provider roster by state, compact participation, licensure exceptions used
    - Documented state billing or licensure failure affecting active members
    - Pause underwriting of national-scale claims until controls are remediated
    - Request state-by-state licensure map and denied-claim history.
  - - Privacy / tracker governance
    - Tracker inventory, BAA coverage, incident reports, vendor audits
    - PHI-bearing authenticated or appointment workflow found leaking data to non-BAA marketing or analytics
      vendor
    - Treat as thesis break because trust, legal exposure, and channel renewals all move at once
    - Request authenticated-page data-flow map and latest privacy assessment.
  - - Security controls
    - Pen-test results, red-team findings, HITRUST surveillance outcomes
    - Material security incident or repeated critical finding without timely remediation
    - Increase discount rate and require evidence of containment before proceeding
    - Request current pen test, SOC/HITRUST surveillance artifacts, and IR playbook.
  - - Evidence credibility
    - PHTI publication, payer-side re-runs, external reference calls
    - Independent review materially weakens ROI or outcome narrative
    - Reset commercial adoption assumptions and buyer-conversion expectations
    - Request full methods appendices and payer-side replication.
  - - AI / product claims
    - Product-claims register, release notes, legal sign-off process
    - AI marketing or product autonomy exceeds substantiated evidence or prompts regulator inquiry
    - Treat expansion narrative as impaired until claims are narrowed or validated
    - Review claims substantiation pack and model-governance policy.
  - - Channel concentration
    - Top-customer share, renewal calendar, NRR/GRR by channel
    - One or two contracts drive economics and show renewal weakness
    - Move from growth-underwriting to concentration-underwriting immediately
    - Request top-10 customer concentration and churn cohort data.
  - - Capital and execution
    - Burn multiple, hiring pace, margin by new program, next-round signals
    - Bridge or down round before new programs prove durable economics
    - Assume valuation compression and slower expansion; revisit entry price
    - Request 24-month operating plan, board materials, and fundraising scenario analysis.
