- id: privacy-hipaa-and-security
  title: Privacy, HIPAA, and Security Risks
  body: |-
    Privacy risk is a first-order thesis variable for Pomelo because its public web surface,
    mobile and portal experiences, and provider workflows all sit near highly sensitive
    maternal and neonatal information. Pomelo’s privacy policy discloses use of cookies,
    pixels, session replay, analytics, and advertising partners on its digital properties.
    HHS and the FTC have repeatedly warned health and telehealth companies that tracker use can
    cross into impermissible disclosures when authenticated portals, appointment flows,
    symptom-entry pages, or other PHI-bearing experiences are involved. HHS is explicit that
    cookie banners and general privacy policies are not substitutes for HIPAA authorization or
    business-associate contracting when PHI is disclosed.

    The enforcement backdrop is no longer theoretical. GoodRx was fined and barred from using
    health data for advertising, OCR has made impermissible disclosure and lack of safeguards
    its most common enforcement categories, and plaintiffs’ lawyers have pursued pixel cases in
    healthcare aggressively. Pomelo does show real mitigation—HITRUST i1 certification, a
    named CISO, a named Head of Compliance, and a Notice of Privacy Practices that describes
    breach notification and business-associate safeguards—but those controls must actually map
    to every authenticated and quasi-authenticated data flow, not just the core provider app.
  claimRefs:
