  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue mix, retention, and renewal concentration by top payer, employer, and state
      market.
    whyItMatters: Covered lives and partner counts do not reveal whether one or two contracts drive the
      economics of the business.
    diligencePath: Request top-10 customer concentration, renewal calendar, NRR/GRR by channel, and state-level
      covered-lives mix.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: licensure-coverage
    missingEvidence: State-by-state clinician licensure map, compact usage, denied-claim history, and
      active-state service limitations.
    whyItMatters: Public disclosures confirm a multistate structure but do not prove that provider supply,
      licensure, and billing capabilities match the covered-lives footprint.
    diligencePath: Request active provider roster by state and specialty, compact participation, claims-denial
      trend for telehealth services, and licensure-monitoring controls.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: workforce-quality
    missingEvidence: Clinician caseloads, response-time attainment by specialty, staffing ratios, attrition,
      and adverse-event or escalation rates.
    whyItMatters: A 24/7, sub-five-minute, seven-month engagement model can fail through staffing bottlenecks
      long before demand weakness appears in sales metrics.
    diligencePath: Request staffing model assumptions, QA dashboards, incident review logs, clinical escalation
      SLAs, and clinician turnover by function.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: external-validation
    missingEvidence: Independent replication of Pomelo-specific outcome claims beyond company-led studies
      and pending category-level assessments.
    whyItMatters: The current evidence base is more rigorous than typical digital-health marketing, but
      it is still largely company-originated and therefore vulnerable to purchaser skepticism.
    diligencePath: Request full methods appendices, payer-side re-runs, external reference calls, and
      any third-party audit or replication of claims-based analyses.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
