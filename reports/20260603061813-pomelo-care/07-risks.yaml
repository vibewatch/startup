- id: mitigations-monitors-and-thesis-breaks
  title: Mitigations, Monitoring, and Thesis-Break Triggers
  body: |-
    Pomelo is not entering these risk areas blind. The affiliated-practice model, named
    security and compliance leadership, HITRUST certification, published claims-based studies,
    and real payer traction are legitimate mitigants. But they are not sufficient for an
    investor if they are evaluated only at face value. The diligence standard should be to tie
    each mitigation to a monitor that would move before the thesis actually breaks. For
    reimbursement and licensure, that means state-level denial rates, credential coverage, and
    contract carve-outs. For privacy, it means tracker inventories, authenticated-page mapping,
    BAAs, and incident logs. For evidence, it means methods appendices, payer-side replication,
    and any purchaser reactions to PHTI’s eventual conclusions.

    The thesis-break triggers are therefore measurable. A material privacy incident on an
    authenticated flow, a documented state licensure or billing failure, a negative or
    inconclusive independent review that undermines ROI claims, a meaningful decline in covered
    lives or payer-partner count, or a financing event that implies the Series C did not buy
    enough time for expansion all change the investment case quickly. The point of this chapter
    is not to predict collapse; it is to define the small set of signals that would tell an
    investor to stop underwriting the current narrative.
