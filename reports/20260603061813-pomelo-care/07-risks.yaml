- id: channel-competition-capital-and-workforce
  title: Channel, Competitive, Capital, and Workforce Risks
  body: |-
    Pomelo’s go-to-market is structurally dependent on institutions, not consumer pull.
    Patients are told to access the service through eligible insurance or employer coverage,
    while payer and employer pages emphasize ROI, claims reduction, and covered lives rather
    than stand-alone subscription economics. That is rational for maternity care, but it means
    customer concentration, renewal risk, and procurement friction matter far more than top-line
    covered-lives numbers. Public materials confirm scale and payer reach, yet they do not show
    revenue concentration, renewal cohorts, or channel retention by state or employer segment.

    Competition is also real and well funded. Maven combines much larger funding, thousands of
    employer clients, and adjacent programs across fertility, maternity, pediatrics, and
    midlife; Oula offers an insured, evidence-oriented hybrid care model that competes on a
    different but still relevant axis. Meanwhile Pomelo has just raised a large Series C at a
    premium valuation and is broadening beyond maternity. That adds operating leverage but also
    increases burn risk and execution complexity. The 24/7 promise, seven-month engagement arc,
    and maternity-desert context make workforce quality a gating variable: if hiring or QA lags,
    the product can degrade before buyers visibly churn.
