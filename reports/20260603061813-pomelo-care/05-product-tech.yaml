  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pediatrics-scope
    missingEvidence: A current module-level pediatrics product map, pediatric staffing ratios, and outcomes beyond NICU/first-three-month support.
    whyItMatters: Public materials show real pediatric adjacency, but investors still cannot tell whether Pomelo has a broad pediatric operating line or a narrower newborn-transition extension.
    diligencePath: Request current pediatric service-line deck, payer-specific rollout list, staffing model, and any claims-based or operational outcomes by pediatric cohort.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: integration-gap
    missingEvidence: Named EHR vendors, connector depth, implementation timeline, and any provider-side workflow metrics for referral/documentation handoff.
    whyItMatters: Pomelo’s provider story depends on low-friction integration, yet public materials stop at “EHR-based referrals” and general documentation claims.
    diligencePath: Ask for implementation runbook, supported EHR matrix, sample referral workflow, provider NPS, and time-to-launch benchmarks by practice type.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: Public or diligence-only uptime targets, incident history, business continuity, disaster recovery, and support-operations metrics.
    whyItMatters: Always-on clinical promises are core to the product; without reliability data, investors cannot underwrite the operational resilience behind the 24/7 claim.
    diligencePath: Request status and incident logs, uptime/SLO reporting, escalation staffing model, DR testing cadence, and any third-party availability attestations.
    relatedQuestionRefs:
    - QE021
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: security-gap
    missingEvidence: Enterprise assurance artifacts beyond HITRUST, such as SOC 2, ISO 27001, pen-test summaries, vulnerability-management reporting, and model-governance controls for GPT-4 features.
    whyItMatters: Pomelo sells into regulated health-plan and provider environments, so procurement-grade security evidence matters for both revenue durability and platform risk.
    diligencePath: Request current security package, HITRUST scope statement, pen-test executive summary, access-control model, AI-governance policy, and vendor risk register.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: roadmap-gap
    missingEvidence: A dated roadmap showing planned releases, adoption targets, or line-of-business milestones across maternity, pediatrics, midlife, and clinician tooling.
    whyItMatters: Public messaging proves strategic direction but not execution cadence, making it hard to judge how far product expansion has moved from narrative to repeatable shipping.
    diligencePath: Request product roadmap, release notes, live-customer count by module, and success criteria for 2026-2027 expansion programs.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE005
