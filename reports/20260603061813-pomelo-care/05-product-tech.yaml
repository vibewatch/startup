tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Fertility & preconception support
    - Patients trying to conceive
    - Publicly marketed program
    - Extends platform earlier than pregnancy with coaching on cycle tracking, nutrition, and conditions such as PCOS
    - No public utilization, outcomes, or payer-by-payer coverage disclosure
  - - Prenatal & postpartum care
    - Pregnant and postpartum members
    - Mature flagship line
    - 24/7 virtual access paired with predictive risk workflows, doula support, and published claims-based outcomes
    - No public module-level breakdown of which interventions drive outcomes most
  - - Pediatric care & NICU support
    - Parents, infants, and newborn families
    - Live but narrower in public detail
    - Extends support from NICU transition into early pediatric issues inside the same care relationship
    - Public materials mostly describe NICU and baby-first-three-month workflows, not a broad pediatric SKU map
  - - Midlife care & healthspan
    - Perimenopause and menopause patients
    - Newer but live
    - Dedicated gynecology, therapy, dietitian, and chronic-condition support broadens Pomelo beyond maternity
    - Public evidence on rollout breadth and covered-plan count is still limited
  - - Grove clinician workspace
    - Pomelo clinicians
    - Internal product in active use
    - Purpose-built command center links clinician communication, coordination, and risk-triggered work inside one surface
    - No public screenshots, audit controls, or workflow benchmark metrics
  - - Patient app + omnichannel access
    - Members across programs
    - Actively maintained
    - One mobile surface plus phone/text/video access keeps support continuous rather than visit-based
    - No public monthly active-user, retention, or outage data
  notes: Rows reflect the externally documented module set and one disclosed internal clinician asset. Public evidence is strongest for maternity and early-life workflows; pediatrics and long-term preventive scope are still described at a higher level.
