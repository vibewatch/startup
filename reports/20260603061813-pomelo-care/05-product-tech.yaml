- id: FE001
  title: Pomelo clinician-platform architecture map
  type: stack
  layout: wide
  summary: Public evidence points to a layered care-delivery stack that starts with omnichannel patient access and ends in governed clinical and data-sharing workflows.
  data:
    layers:
    - label: Patient access layer
      detail: Eligibility flows, mobile app, text, phone, and video access keep patients continuously connected to the care team.
    - label: Clinical team layer
      detail: Fully employed nurses, physicians, therapists, dietitians, lactation specialists, doulas, and pediatric/midlife clinicians execute care plans.
    - label: Grove workflow layer
      detail: Clinician command center coordinates patient communication, team collaboration, and evidence-based workflow execution.
    - label: Risk / data layer
      detail: Claims, lab, pharmacy, EHR, HIE, and remote-monitoring signals are synthesized to surface emerging risk and guide interventions.
    - label: Governance layer
      detail: Affiliated medical practices, HIPAA notices, HIE participation, accessibility program, and HITRUST-backed security controls define the compliance envelope.
  approximationNotes: Pomelo has not published a formal system diagram; this stack is synthesized from public provider, privacy, engineering, and research materials.
