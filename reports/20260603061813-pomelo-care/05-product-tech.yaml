- id: platform-data-and-provider-integration-architecture
  title: Platform, data, and provider-integration architecture
  body: 'Pomelo discloses more architecture than a typical care-navigation startup, though still far less than an enterprise software vendor. The most concrete product surface is Grove, the clinician command center described by software engineer Julia Dai. Grove is where clinicians communicate with patients, coordinate internally, and execute evidence-based care. Underneath it sits a data layer that public sources say ingests claims, lab, pharmacy, EHR, HIE, and remote monitoring feeds to surface emerging risk. Official 2026 materials then add the logic layer: evidence-based pathways, predictive analytics, patient insights, and recommended next actions that together form the company’s clinician co-pilot narrative. Provider-facing integration is lighter weight than full EHR-embedded software, but operationally meaningful. Pomelo says practices can refer via the EHR, receive documentation back, and avoid bespoke IT work; Fidelis’s provider bulletin goes further, describing bidirectional referrals
    plus EHR notes and provider-to-provider calls. The implication is that Pomelo’s architecture is workflow-centric rather than API-led: it is optimized to orchestrate risk detection and coordinated response across clinicians and partner practices, not to expose a broad external developer platform. That is a strength for care delivery today, but it also means the public record still does not show named EHR connectors, API docs, or infrastructure specifics needed for full technical underwriting.'
