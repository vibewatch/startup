company:
  name: Pomelo Care
chapter:
  number: 5
  title: Product & Technology
  summary: Pomelo Care has turned a virtual maternity wraparound service into a broader women’s-and-children’s platform built around a clinician workflow product, not a content-only app. Public evidence supports a real operating stack—Grove for clinician coordination, a risk engine spanning claims/lab/pharmacy/EHR/HIE/RPM data, omnichannel patient access, and provider-facing referral/documentation loops—but also leaves key diligence gaps around named connectors, public SLA/status disclosure, and security attestations beyond HITRUST i1.
sections:
- id: product-scope-and-module-map
  title: Product scope and module map
  body: 'Pomelo’s product is now best understood as a lifecycle care platform rather than a single maternity point solution. The homepage and 2026 Series C materials show four externally visible care programs—fertility and preconception support, prenatal and postpartum care, pediatric and NICU support, and midlife healthspan care—wrapped inside one payer- and employer-sponsored operating model. The module map matters because Pomelo is not just selling chat access: the company pairs each stage with dedicated clinicians, care plans, and routing into adjacent services such as nutrition, therapy, doula support, lactation, or pediatric follow-up. Midlife pages show the newest line is already structured as a real clinical program with gynecology, therapy, dietitian, and chronic-condition support rather than a lightweight content add-on. Public evidence is strongest for maternity, early-infant, and menopause-adjacent workflows; public detail on broader pediatrics remains thinner, which suggests
    expansion is real but not yet equally documented across every module. That mix gives Pomelo a wider platform story than most maternity startups, while leaving investors to diligence exactly how much of the pediatric and long-term preventive surface is already productionized versus still being commercialized.'
  claimRefs:
