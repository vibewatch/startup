    - Visible in iOS/Android stores and Pomelo support pages
    - Recent app updates, encrypted transit on Google Play, support contacts, strong ratings
    - Still no public status page, SLA, or incident-history surface
  notes: This table separates what Pomelo explicitly discloses from what remains unproven in public. The absence of a public SLA or broader assurance package is a diligence gap, not evidence of a specific failure.
