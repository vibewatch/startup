- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Patient access layer (app, text, phone, video)
    - Captures member communication and keeps care reachable outside clinic hours
    - Mobile apps, support operations, care-team staffing
    - No public uptime/SLA or traffic-volume disclosure
  - - Grove clinician workspace
    - Coordinates patient communication, care-team collaboration, and workflow execution
    - Internal product design plus trained clinician users
    - No public audit-log, permissions, or workflow-throughput documentation
  - - Risk and data engine
    - Ingests claims, labs, pharmacy, EHR, HIE, and RPM data to identify emerging complications early
    - Data-sharing agreements, data quality, and timely ingestion
    - Public sources do not disclose refresh latency, model governance, or vendor stack
  - - Provider integration layer
    - Handles EHR referrals, EHR-note updates, and provider-to-provider communication
    - Partner practice participation and payer/provider workflow alignment
    - Named connectors and API coverage are not public
  - - Documentation AI / summarization tooling
    - Uses GPT-4-generated summaries to reduce clinician documentation burden
    - Foundation-model performance, clinician review, and safe rollout controls
    - Public sources do not describe hallucination guardrails or quality metrics
  - - Clinical entity and privacy framework
    - Separates Pomelo Care software/services from affiliated professional medical practices and HIE-enabled treatment workflows
    - Licensed medical practices, HIPAA processes, privacy operations
    - Enterprise-security documentation remains partial beyond HITRUST and privacy notices
  notes: Architecture is reconstructed from public product, provider, privacy, and engineering materials rather than a vendor-published reference diagram. Risk column flags where the workflow is visible but operational depth is not publicly disclosed.
