- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Pomelo solution
  - Measurable benefit
  - Limitation
  rows:
  - - Urgent pregnancy or postpartum question between visits
    - Call office, wait for callback, or use ER/urgent care
    - 24/7 nurse/clinician access by text, phone, video, and app with triage and escalation
    - Public pages report 5-minute median response time and high satisfaction
    - No public escalation-rate or false-positive triage data
  - - High-risk maternity monitoring
    - Periodic in-person visits with fragmented signals between appointments
    - Risk engine surfaces claims/lab/pharmacy/EHR/HIE/RPM data to clinicians inside Grove
    - Published results link sustained engagement to lower preterm birth and NICU use
    - No public sensitivity/specificity or alert-volume disclosure
  - - Practice inbox and coordination burden
    - Office staff handle messages and education manually
    - Pomelo acts as seamless extension of provider team with documentation handoff and follow-up support
    - Providers are promised less inbox load and more time for complex visits
    - No named EHR vendor list or implementation time benchmarks
  - - NICU-to-home and early infant support
    - Parents coordinate discharge questions across fragmented teams
    - Pomelo adds virtual NICU family support, feeding help, pediatric care, and partner-practice collaboration
    - Published NICU-support research shows shorter stays for supported infants
    - Public pediatric scope beyond early infancy is thin
  - - Midlife symptom navigation
    - Patients bounce across multiple specialists without a clear care path
    - Dedicated midlife team provides symptom tracking, medication counseling, nutrition, therapy, and referrals
    - Early program results cite symptom reduction and productivity gains
    - No public data yet on long-term retention or claims-based midlife outcomes
  notes: Benefits combine official operating claims with published or presented outcomes where available. Limitations flag where Pomelo describes the workflow but not the operational denominator, integration depth, or pediatric/midlife maturity in public.
