chapter:
  number: 1
  title: Company Overview
  summary: Pomelo Care is a New York-based virtual women's and children's health company founded in 2021 by former Flatiron Health executive Marta Bralic Kerns. Public disclosures show the company expanding from maternity into fertility, pediatrics, and midlife care, while scaling from 2 million covered lives in 2023 to more than 25 million lives and nearly 7% of U.S. births by early 2026. The business has raised at least $171 million across disclosed rounds, including a $92 million Series C at a $1.7 billion valuation, but key diligence items such as revenue, ARR, headcount, and full governance economics remain undisclosed.
