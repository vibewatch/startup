  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital-disclosure
    missingEvidence: Current board roster, voting rights, ownership percentages, secondaries, and any debt or credit facilities.
    whyItMatters: Control rights and liquidation preferences matter for refresh governance, downside protection, and post-Series C decision-making.
    diligencePath: Request the latest board list, cap table, investor rights summary, and any credit or SAFE instruments directly from management.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics-disclosure
    missingEvidence: Current headcount, ARR, revenue run rate, burn, margin profile, and customer count beyond covered lives.
    whyItMatters: The chapter can size disclosed reach and valuation, but not operating efficiency or revenue quality without internal KPI support.
    diligencePath: Request the current board package or monthly KPI deck with revenue, ARR, headcount, burn, and customer count definitions.
    relatedQuestionRefs:
    - QO011
    - QO022
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: adverse-diligence-surface
    missingEvidence: Independent, company-specific adverse sources on litigation, regulatory complaints, quality incidents, layoffs, or customer churn.
    whyItMatters: The current public corpus shows a category-level evidence burden but does not independently stress-test Pomelo-specific downside scenarios.
    diligencePath: Run direct legal, sanctions, labor, and customer-reference checks outside marketing and financing coverage before investment conviction.
    relatedQuestionRefs:
    - QO020
  - type: missing-source
    severity: minor
    topic: recent-employee-count
    missingEvidence: A dated, source-backed current employee count or organizational chart breadth beyond the public leadership roster.
    whyItMatters: Headcount helps evaluate operating leverage, service capacity, and whether the current scale narrative is supported by team size.
    diligencePath: Ask management for current employee count by function and compare it with open roles and covered-life growth.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
sections:
- id: identity-and-care-model
  title: Identity, scope, and care model
  body: 'Pomelo Care presents itself as a New York-based healthcare company built for women and children, with public materials consistently tracing the business back to 2021. The company started in maternity and newborn care, but the 2026 product surface is broader: fertility and preconception support, prenatal and postpartum care, pediatric and NICU support, and midlife care all appear in current materials. The operating proposition is not just telehealth access. Pomelo says its model combines predictive analytics, evidence-based care pathways, and a multispecialty clinician team available by text, phone, video, and app so risk can be identified earlier and managed between office visits. That positioning matters because Pomelo explicitly says it complements rather than replaces local OB-GYNs, midwives, and other in-person providers. A second diligence detail is the legal structure disclosed in the site footer: clinical care is delivered through Pomelo, P.C. or affiliated professional corporations,
    while Pomelo Care, Inc. operates the broader organization. Public disclosure is therefore strongest on reach and care design, but thinner on classic operating metrics such as headcount and revenue.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO018
  - CO021
  - CO022
  - CO023
  - CO024
  - CO041
  - CO042
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership bench and governance visibility
  body: The founder story is tightly linked to the company's operating thesis. AHIP and Forbes both describe Marta Bralic Kerns as coming from healthcare payment reform and data-driven care delivery work, especially at Flatiron Health, before founding Pomelo. That matters because Pomelo's product narrative is explicitly about using better data and earlier intervention to change outcomes in an expensive, fragmented care journey. Current public bios also show a leadership team with clear functional coverage across clinical care, commercial partnerships, operations, product and data, engineering, security, legal, and compliance. The March 2025 promotion cycle is especially important because it formalized a broader executive bench just before the company's 2025 to 2026 expansion push. Governance visibility is still incomplete, however. Public sources identify investor board involvement and a relatively strong advisory bench, but they do not disclose a full current board roster, ownership stakes,
    or control rights. For diligence, the leadership picture is robust enough to assess capability, but not robust enough to assess governance concentration or investor protections.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO014
  - CO043
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Capital base, valuation, and stakeholder map
  body: 'Pomelo''s disclosed financing history is one of the clearest parts of the public record. The company moved from a $33 million seed and Series A package in 2023, to a $46 million Series B in 2024, to a $92 million Series C in January 2026 led by Stripes at a $1.7 billion valuation. Those disclosed rounds imply at least $171 million in cumulative capital raised. The investor roster also shows continuity rather than a one-off round: Andreessen Horowitz and First Round appear early and repeatedly, while Stripes joins later at the scale-up stage. The stakeholder set extends beyond financial sponsors. Public materials repeatedly cite Penn Medicine and Penn Fertility, large employers such as Koch, and national payers including Medicaid-affiliated plans; Forbes also says Pomelo works with insurers such as UnitedHealthcare and Elevance. That said, public disclosures stop short of cap-table economics. Revenue, ARR, current headcount, and ownership concentration remain undisclosed, which means
    the public story supports market interest and distribution breadth more than unit economics or governance depth.'
  claimRefs:
  - CO013
  - CO015
  - CO016
  - CO017
  - CO018
  - CO033
  - CO038
  - CO039
  - CO041
  - CO043
  tableRefs:
  - TO003
  figureRefs:
  - FO003
- id: milestones-proof-and-gaps
  title: Milestones, proof points, and the remaining burden of proof
  body: The 2025 to 2026 milestone cadence is unusually dense for a still-private health startup. Pomelo added executive depth, announced HITRUST certification, joined the ARPA-H Investor Catalyst Hub spoke network, won a visible New York founder award, and released multiple research and customer-proof artifacts before raising its Series C. The research narrative is stronger than the typical digital health pitch because Pomelo repeatedly uses claims-based outcomes and named collaborators such as Penn Medicine, Penn LDI, and Koch rather than relying on app engagement or soft satisfaction alone. Even so, the reviewed public corpus still leaves real diligence work undone. PHTI's market assessment makes clear that virtual maternity vendors are being judged on clinical effectiveness and budget impact, and Pomelo's own March 2026 research release effectively concedes that the category must clear that higher evidence bar. Public disclosures also do not surface current headcount, revenue, ARR, full
    board composition, or a company-specific adverse file. The result is a company with strong external momentum and better-than-average proof, but still meaningful disclosure gaps for an investor underwriting valuation and durability.
