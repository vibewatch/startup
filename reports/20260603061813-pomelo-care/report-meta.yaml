companyProfile:
  summary: |
    Pomelo Care is a New York-based virtual healthcare company focused on women’s and children’s
    health. The company began with maternity care and now markets fertility or preconception,
    prenatal and postpartum, pediatric or NICU support, and midlife care. Its model combines 24/7
    multispecialty clinical support with predictive analytics and care pathways that are designed to
    supplement, rather than replace, in-person providers.
  foundedDate: '2021-01-01'
  founders:
    - name: Marta Bralic Kerns
      role: Founder and CEO
      background: Former McKinsey and Flatiron Health operator whose own pregnancy experience informed Pomelo's creation.
      claimRefs: [CO005, CO006]
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: |
    Pomelo sells a virtual care platform for women and children that spans fertility or
    preconception support, pregnancy and postpartum care, pediatric or NICU support, and midlife
    care. Patients interact with nurses and other clinicians through text, phone, video, and app
    workflows, while Pomelo coordinates with external OB-GYN and provider teams.
  customerFocus: |
    Health plans and employers that offer Pomelo as a benefit to pregnant members, parents,
    children, and midlife patients.
  businessModel: |
    B2B2C model sold to health plans and employers, with clinical services delivered through
    Pomelo, P.C. or affiliated professional corporations.
