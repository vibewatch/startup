  - - Oula
    - Insurance-based care plus savings-per-birth framing for employers/payers
    - Commercial payer / employer / member cost share
    - Closer to medical-network reimbursement than SaaS subscription
    - Realized payer rates and employer contract structure
  - - Millie
    - Clinical care billed to insurance; app, RPM, and Millie Guide included; some classes/support paid out of pocket
    - Commercial payer / Medicaid / patient for uncovered add-ons
    - Competitive wedge is richer reimbursed experience rather than separate software fee
    - Economics of supportive-care attach rates
  - - Mae
    - Covered by insurance; manages billing and Medicaid reimbursement for doulas
    - Medicaid plan / MCO / state program
    - Economic engine depends on plan partnerships and covered doula benefits
    - Plan fee structure and take rate
  - - Wildflower
    - Claims-based billing at network rates plus value-based program architecture and ROI framing
    - Health plan / provider organization
    - Lets incumbents buy enabling infrastructure without outsourcing the brand
    - Software vs. services mix and minimum contract size
  - - Babyscripts
    - RPM reimbursement, revenue-cycle support, and direct-to-member payer deployment
    - Provider / health plan / Medicaid program
    - Value proposition depends on billable monitoring and care-management workflows
    - Net software fee after reimbursement offsets
  - - Internal build
    - Use existing OB contracts plus modular vendor spend
    - Health plan / provider system
    - Can look cheaper on paper if incumbent resources already exist
    - Integration cost, change management, and outcomes leakage
