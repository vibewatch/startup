  rows:
  - - Maven Clinic
    - Benefits platform / virtual clinic
    - 28M lives; 2,300+ employers; ~$425M funding (Sacra estimate)
    - Global employers, health plans, consumers
    - Fertility, maternity, pediatrics, menopause, hormone care, virtual care
    - Employer and health-plan sales; now also consumer self-pay
    - Broader than maternity; faces virtual-care commoditization pressure
  - - Progyny
    - Benefits administrator / women's health platform
    - 600+ clients; 7.2M lives; public-company scale
    - Large employers, health plans, labor unions
    - Fertility, pregnancy/postpartum, parenting, menopause
    - Employer and payer contracts; 50+ health-plan integrations
    - Less maternity-native clinical identity than Pomelo
  - - Oula
    - Hybrid clinic operator
    - 2,500+ babies delivered; 30+ insurance plans; local clinic footprint
    - Commercially insured maternity patients; payers/employers in NYC-CT
    - OB-GYN + midwife hybrid pregnancy care with virtual support
    - Clinic-led referrals plus employer/payer partnerships
    - Geographically concentrated; not yet national
  - - Millie
    - Hybrid clinic operator
    - Bay Area clinics; insurance-billed maternity bundle
    - Low-to-moderate-risk pregnancies seeking premium support
    - Midwifery-led maternity, gynecology, perimenopause, doula + app
    - Clinic-led acquisition and insurance participation
    - Does not currently accept high-risk pregnancies
  - - Mae
    - Equity-focused doula / Medicaid platform
    - 11 states supported; seed-funded; Medicaid focus
    - Underserved and Medicaid birthing populations
    - Doula matching, care coordination, digital resources, risk tracking
    - Health-plan, MCO, and state partnerships
    - Narrower scope and earlier-stage scale than Pomelo
  - - Quilted Health
    - Midwife network + software
    - Midwife-led care plus professional-services tooling
    - Midwives, birthworkers, and regional maternity patients
    - Pregnancy/postpartum care, network services, EHR
    - Professional solutions and local care delivery
    - More provider-enablement than enterprise benefits platform
  - - Wildflower Health
    - Payer/provider enablement layer
    - 100K women served per year; all-50-state provider connectivity
    - Health plans, OB groups, health systems
    - Digital engagement, advocates, ancillary network, RPM, value-based design
    - Direct payer and provider sales
    - Usually powers the ecosystem rather than owning the full clinical brand
  - - Babyscripts
    - Provider/payer RPM platform
    - Strategic investors include Banner and WellSpan; broad provider footprint
    - Providers, health plans, Medicaid programs, private practices
    - myJourney app, RPM, care management, EMR integration
    - Provider and payer sales; direct-to-member deployments
    - Point-solution risk if buyers want one accountable clinical operator
  - - Internal build / status quo
    - Substitute
    - Uses existing payer case management, OB groups, and modular vendors
    - Plans and providers with existing member relationships
    - Traditional OB visits plus add-on navigation, RPM, doula, or care-management tools
    - Built from incumbent provider and payer workflows
    - Fragmentation can blunt outcomes accountability and user experience
