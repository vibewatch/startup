  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public pricing / contract cue
  - Who pays
  - What the cue implies
  - Key unknown
  rows:
  - - Maven
    - Enrollment-based fixed cost per enrolled member; Sacra also cites platform + per-member + wallet fees
    - Employer / health plan / consumer self-pay
    - Buyer gets predictable budgeting and can add modules over time
    - Net realized PMPM/PEPM by segment
  - - Progyny
    - Pre-negotiated case rates, billing management, and outcomes-based fertility heritage
    - Employer / health plan
    - Better fit for benefits buyers comfortable with managed networks and utilization management
