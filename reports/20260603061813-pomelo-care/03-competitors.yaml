  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-pricing-transparency
    missingEvidence: Executed contracts or proposal sheets for Oula, Mae, Quilted, Wildflower, and Babyscripts showing realized PMPM, PEPM, or episode pricing.
    whyItMatters: Public websites expose business-model cues but not net pricing, so Pomelo's competitive take-rate and discount risk remain hard to benchmark.
    diligencePath: Request anonymized customer contracts, pricing cards, or RFP responses from buyers who evaluated multiple maternity vendors in the same procurement cycle.
  - type: private-evidence-only
    severity: material
    topic: renewal-and-retention-benchmarks
    missingEvidence: Cohort retention, renewal rates, and gross-margin disclosures for private maternity vendors outside Maven and Progyny.
    whyItMatters: Without renewal and margin data it is difficult to tell whether private rivals are winning durable budgets or merely expanding through subsidized pilots.
    diligencePath: Ask management for renewal cohorts, pipeline conversion data, and contribution-margin detail by channel for Pomelo and at least two direct peer evaluations.
