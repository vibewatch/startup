callouts:
- calloutType: risk
  title: The most credible substitute is modular internal build, not another maternity app
  body: Wildflower and Babyscripts show how a payer or provider can buy navigation, RPM, advocacy, and billing workflows separately while keeping the patient relationship and claims stack in-house. That means Pomelo must defend why one accountable operator beats a stitched-together ecosystem on outcomes and total cost, not just on convenience.
  claimRefs:
  - CP033
  - CP036
  - CP038
  - CP044
- calloutType: insight
  title: Distribution power outruns feature breadth in this market
  body: Maven and Progyny matter because they already sit where benefits dollars are allocated, while Oula and Millie matter because they shape the patient experience where care is delivered. Pomelo’s strongest lane remains buyers who want maternity-specific accountability plus virtual clinical operations, not a broad women's-health bundle or a local clinic footprint.
