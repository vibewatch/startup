- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Current holder(s)
  - Why it matters
  - Severity to Pomelo
  - Mitigation / diligence ask
  rows:
  - - Employer / health-plan budget ownership
    - Maven, Progyny
    - Owning the benefits wallet lowers adoption friction and raises switching cost
    - High
    - Measure Pomelo win rates where Maven or Progyny are incumbent across the same buyer segment
  - - Local hybrid clinical experience
    - Oula, Millie
    - High NPS and insurance reimbursement can win metro referrals and patient advocacy
    - Medium
    - Test whether Pomelo can partner with local clinic brands instead of competing head-on
  - - Provider- and payer-side internal build
    - Wildflower, Babyscripts, incumbent plans/providers
    - Buyers can assemble navigation, RPM, and care-management without outsourcing the clinical brand
    - High
    - Ask buyers what share of Pomelo ROI comes from functions they cannot replicate internally
  - - Outcomes evidence and ROI proof
    - Pomelo, Maven, Progyny, Wildflower
    - Value-based maternity buyers increasingly demand claims-backed outcome deltas
    - High
    - Keep Pomelo evidence package fresher and more maternity-specific than broad women's-health rivals
  - - Regulatory / trust maturity
    - Progyny, Wildflower, Quilted, Millie, Oula
    - Privacy, credentialing, MSO structure, and reimbursement integrity gate enterprise sales
    - Medium
    - Benchmark Pomelo compliance artifacts against NCQA/HITRUST, HIPAA, and payer audit expectations
  - - Capital and platform breadth
    - Maven, Progyny
    - Broader product bundles can cross-sell into maternity and reduce standalone-vendor appetite
    - High
    - Track whether Pomelo can expand child/family or chronic-women's-health modules without losing focus
  - - Commoditization of virtual coordination
    - Maven and the category broadly
    - Chat, education, and basic care navigation are easier to replicate than accountable clinical operations
    - High
    - Quantify which Pomelo workflows truly require owned clinical teams and outcomes accountability
  notes: Severity is directional to Pomelo’s current competitive posture, not a market-share forecast. Risks blend direct rivals with substitutes because buyer procurement often compares Pomelo against broader solution architectures, not only brand-to-brand peers.
