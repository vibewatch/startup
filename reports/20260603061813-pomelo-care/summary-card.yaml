  topStrengths:
    - >-
      Pomelo pairs unusually strong maternity outcomes claims with a care model that directly targets high-cost events
      such as preterm birth and NICU utilization.
    - >-
      The platform has scaled quickly from a small maternity footprint to 25M covered lives and nearly 7% of U.S.
      births, indicating payer and employer resonance.
    - >-
      Product expansion into fertility, pediatrics, and midlife care creates a plausible multi-life-stage cross-sell
      story if retention and monetization hold up.
    - >-
      HITRUST certification and provider-collaboration positioning improve trust relative to less-clinically integrated
      women’s health point solutions.
  topRisks:
    - >-
      Public disclosures still omit revenue, margin, churn, pricing, and cap-table terms, making the economics
      impossible to underwrite at growth-equity pricing.
    - >-
      The January 2026 $1.7B mark already prices Pomelo alongside stronger-disclosed category peers, leaving limited
      room for execution misses.
    - >-
      Named customer proof is concentrated, with Koch as the deepest public case study, while payer and employer
      concentration remains opaque.
    - >-
      The model depends on telehealth reimbursement, provider collaboration, compliance execution, and continued
      clinical credibility as it expands beyond maternity.
  unresolvedGaps:
    - Audited revenue, gross margin, and cash-burn data are not public.
    - Renewal, churn, and customer concentration data remain undisclosed.
    - Cap-table terms, liquidation preferences, and any secondary components are not public.
    - Independent replication of Pomelo's outcomes and ROI claims across multiple payer cohorts is still limited.
