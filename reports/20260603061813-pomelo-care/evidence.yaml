evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital-disclosure
    missingEvidence: Current board roster, voting rights, ownership percentages, secondaries, and any debt or credit facilities.
    whyItMatters: >-
      Control rights and liquidation preferences matter for refresh governance, downside protection, and post-Series C
      decision-making.
    diligencePath: >-
      Request the latest board list, cap table, investor rights summary, and any credit or SAFE instruments directly
      from management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics-disclosure
    missingEvidence: Current headcount, ARR, revenue run rate, burn, margin profile, and customer count beyond covered lives.
    whyItMatters: >-
      The chapter can size disclosed reach and valuation, but not operating efficiency or revenue quality without
      internal KPI support.
    diligencePath: >-
      Request the current board package or monthly KPI deck with revenue, ARR, headcount, burn, and customer count
      definitions.
    relatedQuestionRefs:
      - QO011
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-diligence-surface
    missingEvidence: >-
      Independent, company-specific adverse sources on litigation, regulatory complaints, quality incidents, layoffs, or
      customer churn.
    whyItMatters: >-
      The current public corpus shows a category-level evidence burden but does not independently stress-test
      Pomelo-specific downside scenarios.
    diligencePath: >-
      Run direct legal, sanctions, labor, and customer-reference checks outside marketing and financing coverage before
      investment conviction.
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: minor
    topic: recent-employee-count
    missingEvidence: A dated, source-backed current employee count or organizational chart breadth beyond the public leadership roster.
    whyItMatters: >-
      Headcount helps evaluate operating leverage, service capacity, and whether the current scale narrative is
      supported by team size.
    diligencePath: Ask management for current employee count by function and compare it with open roles and covered-life growth.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-attach-rates
    missingEvidence: >-
      Buyer-level pricing, PMPM structure, implementation fees, attach rates, and contract duration by payer, employer,
      provider, and Medicaid channel.
    whyItMatters: >-
      Without contract economics the chapter can show need and adoption logic, but it cannot convert the category into a
      defensible public SAM or SOM.
    diligencePath: >-
      Request anonymized customer contracts or a pricing schedule, plus cohort-level penetration and renewal data by
      buyer type.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: conflicting-data
    severity: material
    topic: broad-market-estimate
    missingEvidence: >-
      A single third-party market model that cleanly breaks out U.S. virtual maternity care from adjacent women’s
      digital-health categories.
    whyItMatters: >-
      Public TAM reports conflict on scope and year, so averaging them would create false precision in underwriting and
      valuation work.
    diligencePath: >-
      Obtain analyst methodologies or payer-side category spend data that isolate maternity-specific virtual care rather
      than broad femtech.
    relatedQuestionRefs:
      - QM004
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: state-medicaid-reimbursement
    missingEvidence: >-
      State-by-state evidence on which maternity telehealth, RPM, and postpartum services are reimbursed consistently
      outside pilots or high-risk carve-outs.
    whyItMatters: >-
      Federal policy is directionally supportive, but commercial scale depends on state-level Medicaid operations and
      private-plan reimbursement behavior.
    diligencePath: >-
      Build a state policy matrix from Medicaid bulletins and MCO manuals for the largest target geographies, then
      compare to actual billed services.
    relatedQuestionRefs:
      - QM014
      - QM015
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: private-pricing-transparency
    missingEvidence: >-
      Executed contracts or proposal sheets for Oula, Mae, Quilted, Wildflower, and Babyscripts showing realized PMPM,
      PEPM, or episode pricing.
    whyItMatters: >-
      Public websites expose business-model cues but not net pricing, so Pomelo's competitive take-rate and discount
      risk remain hard to benchmark.
    diligencePath: >-
      Request anonymized customer contracts, pricing cards, or RFP responses from buyers who evaluated multiple
      maternity vendors in the same procurement cycle.
  - type: private-evidence-only
    severity: material
    topic: renewal-and-retention-benchmarks
    missingEvidence: >-
      Cohort retention, renewal rates, and gross-margin disclosures for private maternity vendors outside Maven and
      Progyny.
    whyItMatters: >-
      Without renewal and margin data it is difficult to tell whether private rivals are winning durable budgets or
      merely expanding through subsidized pilots.
    diligencePath: >-
      Ask management for renewal cohorts, pipeline conversion data, and contribution-margin detail by channel for Pomelo
      and at least two direct peer evaluations.
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Redacted employer and payer contracts showing PMPM, PEPM, episode-based, or value-based fee schedules plus any
      downside protections.
    whyItMatters: >-
      Without real contract terms, public ROI claims cannot be converted into revenue per covered life or contribution
      margin assumptions.
    diligencePath: >-
      Request five redacted current MSAs/SOWs across employer and payer cohorts, including implementation fees, ongoing
      fees, and renewal clauses.
    relatedQuestionRefs:
      - QI008
      - QI020
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Current revenue split across employers, commercial plans, Medicaid plans, and any provider-facing or consumer-paid
      components.
    whyItMatters: >-
      Mix drives pricing power, renewal risk, implementation intensity, and whether margins depend more on self-insured
      employers or health-plan procurement cycles.
    diligencePath: >-
      Request trailing-twelve-month booked revenue by channel, top-10 customer concentration, and contracted lives by
      employer versus payer segment.
    relatedQuestionRefs:
      - QI008
      - QI024
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, payback, win rates, sales cycle length, implementation timeline, and retention/NRR by employer and payer
      cohort.
    whyItMatters: >-
      These metrics determine how much capital Pomelo must keep raising or reserving to keep growth above operating
      leverage.
    diligencePath: >-
      Request cohort tables for pipeline conversion, implementation time, annual logo retention, NRR, and CAC payback by
      segment for the last eight quarters.
    relatedQuestionRefs:
      - QI009
      - QI010
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, debt or credit facilities, monthly burn, runway, and any covenants or reimbursement receivable
      financing.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten from fundraising headlines alone.
    diligencePath: >-
      Request current balance sheet, cash bridge from the Series C close, debt schedule, and base-case versus downside
      runway model approved by management.
    relatedQuestionRefs:
      - QI017
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: clinical-productivity
    missingEvidence: >-
      Clinician productivity by role, care intensity per pregnancy, gross margin or medical loss ratio, and
      reimbursement realization by state.
    whyItMatters: >-
      The model is service-intensive; without productivity and margin data, public ROI claims do not prove scalable unit
      economics.
    diligencePath: >-
      Request role-level staffing ratios, cost per enrolled pregnancy, cost per active month, gross margin bridge, and
      contribution margin by product line.
    relatedQuestionRefs:
      - QI011
      - QI012
      - QI013
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: independent-budget-impact
    missingEvidence: >-
      A completed independent budget-impact assessment from PHTI or equivalent third party covering employer,
      commercial, and Medicaid contexts.
    whyItMatters: >-
      Pomelo's existing savings evidence is strong but still largely company-authored or partner-authored, leaving
      buyers to test generalizability themselves.
    diligencePath: >-
      Monitor for the completed PHTI assessment and request any external actuarial or peer-reviewed replication studies
      used in enterprise procurement.
    relatedQuestionRefs:
      - QI021
      - QI025
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Renewal cohorts, dollar retention, customer concentration, and expansion economics for marquee accounts like Koch
      or large plans.
    whyItMatters: >-
      Case-study wins are encouraging, but concentration risk and one-off favorable cohorts can materially distort
      perceived revenue quality.
    diligencePath: >-
      Request top-20 account ARR, renewal dates, outcome guarantees, attach rates for add-on products, and referenceable
      churn cases.
    relatedQuestionRefs:
      - QI007
      - QI020
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: pediatrics-scope
    missingEvidence: >-
      A current module-level pediatrics product map, pediatric staffing ratios, and outcomes beyond
      NICU/first-three-month support.
    whyItMatters: >-
      Public materials show real pediatric adjacency, but investors still cannot tell whether Pomelo has a broad
      pediatric operating line or a narrower newborn-transition extension.
    diligencePath: >-
      Request current pediatric service-line deck, payer-specific rollout list, staffing model, and any claims-based or
      operational outcomes by pediatric cohort.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE005
  - type: missing-source
    severity: material
    topic: integration-gap
    missingEvidence: >-
      Named EHR vendors, connector depth, implementation timeline, and any provider-side workflow metrics for
      referral/documentation handoff.
    whyItMatters: >-
      Pomelo’s provider story depends on low-friction integration, yet public materials stop at “EHR-based referrals”
      and general documentation claims.
    diligencePath: >-
      Ask for implementation runbook, supported EHR matrix, sample referral workflow, provider NPS, and time-to-launch
      benchmarks by practice type.
    relatedQuestionRefs:
      - QE020
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      Public or diligence-only uptime targets, incident history, business continuity, disaster recovery, and
      support-operations metrics.
    whyItMatters: >-
      Always-on clinical promises are core to the product; without reliability data, investors cannot underwrite the
      operational resilience behind the 24/7 claim.
    diligencePath: >-
      Request status and incident logs, uptime/SLO reporting, escalation staffing model, DR testing cadence, and any
      third-party availability attestations.
    relatedQuestionRefs:
      - QE021
      - QE020
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: security-gap
    missingEvidence: >-
      Enterprise assurance artifacts beyond HITRUST, such as SOC 2, ISO 27001, pen-test summaries,
      vulnerability-management reporting, and model-governance controls for GPT-4 features.
    whyItMatters: >-
      Pomelo sells into regulated health-plan and provider environments, so procurement-grade security evidence matters
      for both revenue durability and platform risk.
    diligencePath: >-
      Request current security package, HITRUST scope statement, pen-test executive summary, access-control model,
      AI-governance policy, and vendor risk register.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: minor
    topic: roadmap-gap
    missingEvidence: >-
      A dated roadmap showing planned releases, adoption targets, or line-of-business milestones across maternity,
      pediatrics, midlife, and clinician tooling.
    whyItMatters: >-
      Public messaging proves strategic direction but not execution cadence, making it hard to judge how far product
      expansion has moved from narrative to repeatable shipping.
    diligencePath: >-
      Request product roadmap, release notes, live-customer count by module, and success criteria for 2026-2027
      expansion programs.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: material
    topic: account-level-retention
    missingEvidence: Account-level renewal rates, contract terms, NRR/GRR, and logo churn by payer and employer cohort.
    whyItMatters: >-
      Without renewal and churn data, it is impossible to tell whether Pomelo's growth is durable or heavily dependent
      on new-logo additions.
    diligencePath: >-
      Request renewal schedules, cohort retention tables, and top-account ARR concentration from management or a data
      room extract.
    relatedQuestionRefs:
      - QU015
      - QU025
    relatedTableRefs:
      - TU004
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current list of production payer, employer, and provider customers, with go-live dates and segment
      labels.
    whyItMatters: >-
      The public named-account corpus is short relative to Pomelo's reported 25 million covered lives, which limits
      concentration and proof analysis.
    diligencePath: >-
      Ask management for a current customer roster with segment, go-live status, and permissioned references; reconcile
      it to public case studies and plan lives.
    relatedQuestionRefs:
      - QU011
      - QU024
      - QU025
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: payer-deployment-depth
    missingEvidence: >-
      Independent plan-side documentation showing how named payers such as Elevance affiliates, Healthy Blue Nebraska,
      or Nebraska Total Care actually deploy Pomelo.
    whyItMatters: >-
      Named references exist in company releases, but public plan-side implementation proof is thin compared with Koch's
      employer case study.
    diligencePath: >-
      Search plan member materials, plan newsrooms, and broker or consultant collateral for plan-specific benefit launch
      pages or member notices.
    relatedQuestionRefs:
      - QU005
      - QU011
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: customer-churn
    missingEvidence: A list of lost accounts, failed pilots, or materially downsized customers, if any, plus reasons for loss.
    whyItMatters: >-
      Public evidence of churn is sparse, so adverse diligence could understate operational or renewal issues if losses
      are kept private.
    diligencePath: >-
      Request win-loss reviews, renewal memos, and customer-support or provider-payment escalation logs during live
      diligence.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue mix, retention, and renewal concentration by top payer, employer, and state market.
    whyItMatters: Covered lives and partner counts do not reveal whether one or two contracts drive the economics of the business.
    diligencePath: Request top-10 customer concentration, renewal calendar, NRR/GRR by channel, and state-level covered-lives mix.
    relatedQuestionRefs:
      - QR027
    relatedTableRefs:
      - TR003
      - TR005
  - type: private-evidence-only
    severity: material
    topic: licensure-coverage
    missingEvidence: State-by-state clinician licensure map, compact usage, denied-claim history, and active-state service limitations.
    whyItMatters: >-
      Public disclosures confirm a multistate structure but do not prove that provider supply, licensure, and billing
      capabilities match the covered-lives footprint.
    diligencePath: >-
      Request active provider roster by state and specialty, compact participation, claims-denial trend for telehealth
      services, and licensure-monitoring controls.
    relatedQuestionRefs:
      - QR028
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: workforce-quality
    missingEvidence: >-
      Clinician caseloads, response-time attainment by specialty, staffing ratios, attrition, and adverse-event or
      escalation rates.
    whyItMatters: >-
      A 24/7, sub-five-minute, seven-month engagement model can fail through staffing bottlenecks long before demand
      weakness appears in sales metrics.
    diligencePath: >-
      Request staffing model assumptions, QA dashboards, incident review logs, clinical escalation SLAs, and clinician
      turnover by function.
    relatedQuestionRefs:
      - QR029
    relatedTableRefs:
      - TR004
      - TR005
  - type: missing-source
    severity: material
    topic: external-validation
    missingEvidence: >-
      Independent replication of Pomelo-specific outcome claims beyond company-led studies and pending category-level
      assessments.
    whyItMatters: >-
      The current evidence base is more rigorous than typical digital-health marketing, but it is still largely
      company-originated and therefore vulnerable to purchaser skepticism.
    diligencePath: >-
      Request full methods appendices, payer-side re-runs, external reference calls, and any third-party audit or
      replication of claims-based analyses.
    relatedQuestionRefs:
      - QR030
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: blocking
    topic: audited-economics
    missingEvidence: Audited revenue, gross margin, PMPM pricing, retention, and customer concentration by payer / employer cohort.
    whyItMatters: >-
      These are the core inputs required to decide whether Pomelo deserves a premium platform multiple rather than a
      telehealth or benefits-service multiple.
    diligencePath: Request the finance pack used for the January 2026 round, including board materials and cohort economics tables.
    relatedQuestionRefs:
      - QV013
      - QV014
      - QV015
      - QV017
      - QV022
      - QV026
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, participation rights, side letters, and any structured protections from the latest round.
    whyItMatters: >-
      Headline valuation alone does not reveal common-equity downside or whether the next investor is inheriting a heavy
      preference overhang.
    diligencePath: Review financing documents and a counsel memo that maps the full preference stack.
    relatedQuestionRefs:
      - QV022
      - QV026
      - QV030
  - type: missing-source
    severity: material
    topic: independent-outcomes-validation
    missingEvidence: >-
      Independent replication of Pomelo’s outcomes and ROI claims across payer and employer cohorts beyond company-led
      materials and customer proof.
    whyItMatters: The thesis leans heavily on outcomes superiority; if the evidence weakens, the premium narrative weakens with it.
    diligencePath: >-
      Ask for peer-reviewed studies, third-party actuarial analyses, and the full methodology behind reported cohort
      improvements.
    relatedQuestionRefs:
      - QV003
      - QV025
      - QV027
  - type: private-evidence-only
    severity: material
    topic: affiliated-pc-structure
    missingEvidence: >-
      The economics split, reimbursement exposure, and compliance responsibilities between Pomelo Care, Inc. and its
      affiliated professional corporations.
    whyItMatters: >-
      This structure can affect gross margin, regulatory risk, and how scalable the model really is as Pomelo expands
      beyond maternity.
    diligencePath: Obtain a legal-entity map, intercompany agreements, and reimbursement-policy summary from counsel and finance.
    relatedQuestionRefs:
      - QV027
