- id: TI001
  title: Revenue streams table
  columns:
  - Stream / Buyer
  - Mechanism
  - Public Unit / Proxy
  - Current Value / Status
  - Revenue Quality
  - Diligence Ask
  rows:
  - - Employer maternity contracts
    - Employer buys Pomelo as a workforce benefit for pregnancy, postpartum, and pediatric support
    - Negotiated contract; no public list price
    - Demo-led sales motion; 3-5x ROI claim; average engagement 7 months
    - Medium — value proposition is strong but realized pricing is undisclosed
    - Request redacted employer MSAs with fee basis, implementation fees, and renewal terms
  - - Health-plan maternity contracts
    - Commercial and Medicaid plans pay for eligible members and use Pomelo to reduce high-cost claims
    - Negotiated plan contract; member cost may be $0
    - 34 payer partners disclosed; 70% first-trimester identification; 3-5x ROI claim
    - Medium — broad scale and strong outcomes, but reimbursement mechanics are hidden
    - Request payer contracts showing PMPM, case-rate, or shared-savings structure by line of business
  - - Plan-sponsored member care
    - Eligible members access Pomelo at no additional cost while plan absorbs program economics
    - No member fee disclosed
    - Fidelis offers Pomelo at no additional cost to eligible members in selected counties
    - Medium — proves payer-funded access, not program margin
    - Confirm whether the plan pays subscription, per-enrollee, per-episode, or fee-for-service economics
  - - Employer / payer upsell
    - Existing maternity relationships expand into doula and midlife offerings
    - Cross-sell economics not public
    - Koch expanded from maternity into doula and midlife support
    - Medium-high — add-ons suggest land-and-expand potential
    - Request attach rates, incremental pricing, and margin profile for non-maternity products
  - - Direct provider revenue
    - Providers refer into Pomelo's model and receive documentation support
    - Not a primary public revenue source
    - Provider page says no cost to providers or eligible patients
    - Low — referral channel rather than payer channel
    - Confirm whether any provider contracts include implementation or care-management fees
  notes: Public evidence supports employer and payer monetization, but contract economics, realized pricing, and revenue mix remain undisclosed.
