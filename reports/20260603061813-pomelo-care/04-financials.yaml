    - Expansion into midlife, pediatrics, doula networks, AI/data tooling, and broad hiring
    - 2025-2026
    - Suggests capital is being deployed into both new verticals and operating scale-up
    - Map each initiative to budget, staffing, and expected contribution timeline
  notes: Historical funding chronology belongs in Company Overview; this table focuses on whether public evidence is sufficient to underwrite forward capital adequacy. It is not.
