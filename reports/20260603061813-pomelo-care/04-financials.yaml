- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / Status
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - Claims-based ROI
    - 3.9:1 versus Pomelo fees (2025 study); 3-5x on official employer and payer pages
    - High
    - Best public proxy for partner willingness to pay and contract renewal potential
    - Request ROI methodology, by-segment variance, and the denominator used in each employer and payer case
  - - Total cost of care reduction
    - 8.8% reduction in 2025 study
    - High
    - Direct economic signal that Pomelo can move claims cost, not just satisfaction
    - Request absolute dollars saved per pregnancy and by payer type
  - - Sustained engagement proxy
    - Average engagement 7 months
    - Medium
    - Long engagement likely improves care intensity capture and savings realization
    - Request active-month distribution, enrollment-to-engagement conversion, and dropout cohorts
  - - Outcome scale anchor
    - Nearly 45,000 deliveries across six plans and six states
    - High
    - Makes the savings narrative more credible than single-employer case studies
    - Request plan-level dispersion of outcomes and whether results replicate outside the flagship geographies
  - - CAC / payback / NRR
    - null
    - Unavailable
    - Core growth-efficiency metrics are missing, so public ROI cannot be translated into investor payback math
    - Request CAC, payback, logo retention, dollar retention, and implementation cost by cohort
  - - Gross margin / contribution margin
    - null
    - Unavailable
    - Service-heavy delivery could be attractive or fragile depending on clinician productivity and reimbursement realization
    - Request gross margin bridge, contribution margin by product, and role-level productivity metrics
  notes: Public unit-economics proxies are strong on outcomes and weak on internal efficiency; every null requires a specific management packet.
