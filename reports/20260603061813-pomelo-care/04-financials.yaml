- id: TI005
  title: Public financial gaps table
  columns:
  - Missing Private Metric
  - Impact
  - Exact Diligence Path
  - Current Public Proxy
  - Severity
  - Implication
  rows:
  - - Employer vs. payer revenue mix
    - Cannot tell whether Pomelo depends more on plan procurement cycles or self-insured employer budgets
    - Request trailing-twelve-month booked revenue and contracted lives by segment
    - Public pages confirm both channels exist, but not the split
    - Material
    - Mix uncertainty limits scenario modeling and concentration analysis
  - - Realized pricing and guarantee structure
    - No way to test if public ROI claims leave sufficient gross profit after clinician delivery costs
    - Review redacted contracts and outcome-guarantee language across top accounts
    - Demo-led commercial pages and Koch's refusal to disclose spend
    - Material
    - Pricing opacity is the biggest blocker to revenue-quality underwriting
  - - CAC, payback, retention, and NRR
    - Sales efficiency and growth durability cannot be evaluated
    - Request cohort dashboards for pipeline conversion, CAC, payback, and retention
    - Case-study expansion and 7-month engagement are only weak proxies
    - Material
    - Growth may look attractive while still consuming too much capital
  - - Gross margin and clinician productivity
    - Cannot tell whether the model gets more profitable with scale or simply more clinically efficient at the expense of margin
    - Request margin bridge, staffing ratios, and cost per active pregnancy month
    - Fully employed clinicians, 24/7 care, and multistate contracting imply a real service cost base
    - Material
    - Margin path could be far below software-like expectations
  - - Cash, debt, burn, and runway
    - Capital adequacy and financing dependency remain impossible to quantify
    - Request current balance sheet, debt schedule, and runway plan under base and downside cases
    - Series C raise and total-raised estimate only
    - Blocking
    - Investors cannot know whether Pomelo is overfunded, adequately funded, or nearing another raise
  - - Independent budget-impact replication
    - Buyers must rely heavily on company-authored or partner-authored evidence
    - Monitor for completed PHTI assessment and request third-party actuarial studies
    - Strong company-authored outcomes plus pending independent PHTI work
    - Material
    - External validation is improving but not yet complete
  notes: These are the explicit diligence blockers for investment-grade underwriting; none can be solved from public web evidence alone.
