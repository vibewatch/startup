  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Redacted employer and payer contracts showing PMPM, PEPM, episode-based, or value-based fee schedules plus any downside protections.
    whyItMatters: Without real contract terms, public ROI claims cannot be converted into revenue per covered life or contribution margin assumptions.
    diligencePath: Request five redacted current MSAs/SOWs across employer and payer cohorts, including implementation fees, ongoing fees, and renewal clauses.
    relatedQuestionRefs:
    - QI008
    - QI020
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current revenue split across employers, commercial plans, Medicaid plans, and any provider-facing or consumer-paid components.
    whyItMatters: Mix drives pricing power, renewal risk, implementation intensity, and whether margins depend more on self-insured employers or health-plan procurement cycles.
    diligencePath: Request trailing-twelve-month booked revenue by channel, top-10 customer concentration, and contracted lives by employer versus payer segment.
    relatedQuestionRefs:
    - QI008
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, win rates, sales cycle length, implementation timeline, and retention/NRR by employer and payer cohort.
    whyItMatters: These metrics determine how much capital Pomelo must keep raising or reserving to keep growth above operating leverage.
    diligencePath: Request cohort tables for pipeline conversion, implementation time, annual logo retention, NRR, and CAC payback by segment for the last eight quarters.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash on hand, debt or credit facilities, monthly burn, runway, and any covenants or reimbursement receivable financing.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten from fundraising headlines alone.
    diligencePath: Request current balance sheet, cash bridge from the Series C close, debt schedule, and base-case versus downside runway model approved by management.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: clinical-productivity
    missingEvidence: Clinician productivity by role, care intensity per pregnancy, gross margin or medical loss ratio, and reimbursement realization by state.
    whyItMatters: The model is service-intensive; without productivity and margin data, public ROI claims do not prove scalable unit economics.
    diligencePath: Request role-level staffing ratios, cost per enrolled pregnancy, cost per active month, gross margin bridge, and contribution margin by product line.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI013
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: independent-budget-impact
    missingEvidence: A completed independent budget-impact assessment from PHTI or equivalent third party covering employer, commercial, and Medicaid contexts.
    whyItMatters: Pomelo's existing savings evidence is strong but still largely company-authored or partner-authored, leaving buyers to test generalizability themselves.
    diligencePath: Monitor for the completed PHTI assessment and request any external actuarial or peer-reviewed replication studies used in enterprise procurement.
    relatedQuestionRefs:
    - QI021
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Renewal cohorts, dollar retention, customer concentration, and expansion economics for marquee accounts like Koch or large plans.
    whyItMatters: Case-study wins are encouraging, but concentration risk and one-off favorable cohorts can materially distort perceived revenue quality.
    diligencePath: Request top-20 account ARR, renewal dates, outcome guarantees, attach rates for add-on products, and referenceable churn cases.
    relatedQuestionRefs:
    - QI007
    - QI020
    - QI024
    relatedTableRefs:
    - TI005
