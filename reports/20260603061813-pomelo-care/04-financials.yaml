company:
  name: Pomelo Care
chapter:
  number: 4
  title: Financials
  summary: 'Pomelo Care''s public financial story is outcomes-led rather than price-led: the company sells employer and health-plan maternity programs through negotiated contracts, cites 3-5x ROI, and backs that narrative with 2025-2026 releases showing 8.8% total-cost-of-care reduction, 3.9:1 ROI versus fees, and large NICU/preterm improvements. Commercial traction proxies are meaningful — 34 payer partners, more than 25 million covered lives, nearly 7% of U.S. births, and a Koch case study with 3,000+ enrolled employees and families — but Pomelo does not publicly disclose revenue, realized pricing, gross margin, CAC/payback, or cash burn. The January 2026 $92M Series C at a $1.7B valuation supports expansion into midlife, pediatrics, doula networks, and AI/data tooling, yet capital adequacy and financing dependency remain un-underwritable from public evidence because cash, debt, runway, and customer concentration are undisclosed.'
sections:
- id: revenue-model
  title: Revenue Model and Monetization
  body: 'Pomelo''s public commercial surfaces show a classic B2B2C maternity-care model rather than a direct-to-consumer subscription. The employer page sells Pomelo as an employee benefit, the payer page sells a plan solution for reducing high-cost maternity claims, and the provider page says practices and eligible patients do not pay directly for the service. Fidelis adds an important corroboration point: eligible members receive Pomelo at no additional cost, which is consistent with a health-plan-funded benefit. What the company does not publish is equally important. Both employer and payer pages route prospects to demo requests and never disclose list pricing, PMPM, episode fees, implementation fees, or outcome-guarantee structure. That means revenue quality cannot be modeled from pricing alone; the economic case rests on whether Pomelo can reliably convert avoided NICU, ER, cesarean, and preterm costs into payer and employer willingness to pay. Public evidence supports the demand narrative,
    but not the contract-level economics.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI005
  - CI006
  - CI046
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-savings
  title: Outcomes-Linked Revenue Proxies and Sales Efficiency Signals
  body: 'Pomelo compensates for the absence of public pricing with unusually specific clinical and economic outcomes. The strongest public anchor is the September 2025 release reporting an 8.8% reduction in total cost of care and a 3.9:1 ROI relative to Pomelo''s fees; the March 2026 release extends that narrative with nearly 45,000 deliveries across six plans and dose-response improvements in preterm birth and NICU length of stay. Commercial scale proxies also matter: the company reports 34 payer partners, more than 25 million covered lives, nearly 7% of U.S. births, and a flagship Koch deployment that has enrolled more than 3,000 employees and family members. Koch''s subsequent expansion into doula and midlife care is a useful retention signal. Still, the public GTM picture remains incomplete. Pomelo discloses no CAC, payback, NRR, ACV, or payer-versus-employer mix, and Koch explicitly says it will not share the investment level publicly. The result is strong evidence of value creation
    but weak evidence on monetization efficiency.'
