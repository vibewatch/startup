callouts:
- calloutType: strength
  title: Savings evidence is strong enough to support real commercial traction
  body: Pomelo's public ROI story is unusually evidence-heavy for a private digital-health company. Between the 8.8% cost-of-care reduction, 3.9:1 ROI versus fees, large multi-plan claims dataset, and Koch's expansion after measurable NICU and cesarean improvements, there is real support for revenue quality even without a disclosed price card.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI021
  - CI022
  - CI023
  - CI024
  - CI026
- calloutType: risk
  title: Pricing opacity is the core underwriting blocker
  body: Pomelo publishes outcomes, not realized pricing. Without contract terms, channel mix, retention, or unit economics, investors cannot tell whether the savings narrative leaves attractive contribution margin after clinician labor, enrollment operations, and compliance overhead.
  claimRefs:
  - CI002
  - CI025
  - CI042
  - CI043
  - CI044
  - CI046
- calloutType: risk
  title: Clinical delivery and compliance costs make the model less software-like than the AI narrative suggests
  body: Public sources point to a 24/7 multispecialty clinical workforce, affiliated professional corporations, multi-state licensure complexity, and nontrivial privacy and security obligations. Those are all sensible investments, but they mean margin scaling must be proven empirically, not assumed from AI-forward positioning.
