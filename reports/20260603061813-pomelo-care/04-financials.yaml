- id: capital-adequacy
  title: Capital Adequacy, Financing Dependency, and Diligence Blockers
  body: 'The January 2026 financing clearly improved Pomelo''s strategic flexibility: the company raised $92 million at a $1.7 billion valuation and press coverage says total capital raised is roughly $171 million. Public signals suggest that capital is being deployed into a broader platform — midlife, pediatrics, doula networks, AI-enabled tooling, and broad functional hiring — rather than supporting a static maternity offering. But capital adequacy itself remains opaque. There is no public revenue figure, no disclosed cash balance, no debt schedule, no monthly burn, no runway disclosure, and no public customer concentration data. That makes financing dependency impossible to quantify from public evidence alone. PHTI''s decision to run an independent evaluation of virtual maternity-care economics reinforces the same conclusion: Pomelo''s commercial story is compelling, but third-party generalizability and long-term margin durability are still open diligence items. The correct underwriting
    posture is therefore cautiously positive on revenue quality, but conservative on capital intensity and follow-on financing assumptions until private metrics are produced.'
