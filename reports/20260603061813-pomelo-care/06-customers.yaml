    {
      "id": "adoption-trajectory-and-named-proof",
      "title": "Adoption trajectory and named customer proof",
      "body": "The strongest public adoption signal is the step-change in disclosed coverage: 2 million lives in 2023, more than 3 million in 2024, and 25 million by early 2026. Independent outlets repeated the latest scale figure and the company's claim that it now touches nearly 7% of U.S. births, so the direction of travel is believable even if the numerator remains company-supplied. Named proof is less evenly distributed. Koch is the only account with a fresh 2026 case study, quantified clinical outcomes, enrollment volume, and evidence of cross-sell into doula and midlife care. By contrast, Penn Medicine, Mount Sinai Health System, Elevance-affiliated plans, Healthy Blue Nebraska, and Nebraska Total Care are named only in older releases; those references validate market access but not current deployment depth or outcomes. The net effect is that Pomelo appears to have genuine enterprise penetration, yet the visible proof stack remains asymmetrical: one detailed employer case study, a modest set of older named-account references, and a far larger pool of unnamed covered lives.",
