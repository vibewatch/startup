    "number": 6,
    "title": "Customers",
    "summary": "Pomelo has moved from 2 million covered lives in 44 states in 2023 to 25 million lives and 34 payer partners by 2026, but the named proof set is still concentrated in one deeply documented employer account: Koch. Public durability proxies are encouraging — seven-month average maternity engagement, 4.9/5 satisfaction, and dose-response clinical improvement after three months of prenatal engagement — yet renewal, churn, and account concentration remain private. The chapter therefore reads as real adoption with credible buyer fit, but only partial transparency on customer quality and concentration risk."
  },
  "sections": [
    {
      "id": "customer-segments-and-surfaces",
      "title": "Customer segmentation by buyer, user, payer, geography, and use case",
      "body": "Pomelo's customer map is unusual because the buyer, payer, user, and referral source are not the same entity. Public surfaces show four explicit constituencies: health plans, employers, patients, and providers. The economic buyers are health plans and self-insured employers; the covered users are pregnant members, postpartum parents, infants, and now women in midlife; and the referral channel often runs through OB-GYNs, care-management teams, and NICU staff rather than through a direct-to-consumer acquisition loop. This distinction matters because adoption scale can rise quickly on a covered-lives basis even when the public named-account corpus remains thin. The geographic picture is similarly layered. Historical disclosures show 44 states in 2023 and 46 states in 2024, while current marketing says 25 million covered lives across all 50 states. Use-case expansion has also widened from maternity and newborn support into fertility or preconception, pediatric follow-on care, doula support, and menopause-focused midlife care. The practical result is a multi-surface customer base that looks broader than a maternity point solution, but still depends on enterprise sponsorship for access and price removal.",
