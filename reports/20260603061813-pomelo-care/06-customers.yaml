    {
      "id": "durability-and-expansion-proxies",
      "title": "Retention, durability, and expansion proxies",
      "body": "Pomelo does not publish conventional B2B durability metrics such as NRR, GRR, logo churn, or contract term. Even so, the public record contains a few useful substitutes. First, the employer maternity page says average member engagement lasts seven months, which is meaningful in a category where many digital point solutions struggle to keep patients active across pregnancy and postpartum. Second, the March 2026 peer-reviewed release shows a dose-response curve: better outcomes begin in the first month and improve further once members stay engaged for three months or longer. Third, the 2025 outcomes release shows symptom reduction for two-thirds of moderate-to-severe depression patients within roughly 40 days, which implies ongoing clinical follow-up rather than one-off chat usage. Expansion signals are also present. Koch expanded from maternity into doula and midlife support, and the corporate product surface now spans fertility, maternity, pediatric, and midlife programs. That pattern supports a land-and-expand thesis, but without published renewal data investors still cannot separate account expansion from headline new-logo growth.",
