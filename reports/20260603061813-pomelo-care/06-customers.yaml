  "callouts": [
    {
      "calloutType": "strength",
      "title": "Koch is meaningful proof, not just a logo slide",
      "body": "Koch gives Pomelo the one thing many point-solution vendors lack: a fresh 2026 case study with enrollment volume, three quantified outcome improvements, a satisfaction score, and evidence of product expansion beyond the initial maternity scope. That does not prove the entire book behaves like Koch, but it does show at least one large employer relationship has moved beyond pilot rhetoric into an outcomes-backed, multi-product deployment.",
      "claimRefs": [
        "CU019",
        "CU020",
        "CU021",
        "CU022",
        "CU023",
        "CU024",
        "CU025"
      ]
    },
    {
      "calloutType": "risk",
      "title": "The biggest missing diligence item is account-level durability",
      "body": "Pomelo's public narrative is rich on covered lives, outcomes, and care-team design, but thin on the metrics investors usually use to judge customer durability: renewal rates, churn, NRR, GRR, contract terms, and top-account concentration. Because the named-account set is short relative to the 25 million-life headline, this gap materially limits confidence on customer quality even though top-line adoption looks real.",
      "claimRefs": [
        "CU040",
        "CU041",
        "CU042",
        "CU046"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Adverse evidence exists, but it is operational rather than strategic",
      "body": "The clearest public negative signal is not a lost payer or failed employer rollout; it is review-level friction. BBB says Pomelo is not accredited and shows two sharp complaints, including one about slow doula payments. That is too small a sample to rewrite the thesis, but it does indicate that contractor or service-operations processes deserve diligence rather than being assumed away by the strong growth narrative.",
      "claimRefs": [
        "CU043",
        "CU044",
        "CU045"
      ]
    }
  ],
