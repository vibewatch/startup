      - number: '6.4'
        title: Concentration risk, procurement friction, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The main customer risk is not whether Pomelo has buyers; it is how concentrated and durable those buyers
              are. Public named-account evidence is sparse relative to the 25 million-life headline, so outside
              investors cannot tell whether the business is diversified across dozens of mid-sized plans and employers
              or anchored by a handful of large contracts. Public procurement evidence also suggests a high bar. Koch
              describes a data-driven vendor review process focused on maternal-cost gaps and ROI, while PHTI notes that
              employers, commercial plans, and Medicaid programs are actively seeking solutions with
              clinical-effectiveness and budget-impact proof. That is favorable for Pomelo because the company has
              claims-based research, but it also means the sales cycle likely depends on expensive proof and stakeholder
              alignment. Adverse evidence is light but not zero. BBB shows Pomelo is not accredited and includes two
              negative reviews, one alleging scam-like service and one complaining about slow payment to a contracted
              doula. These are small-sample signals, not enterprise churn proof, but they are the clearest public
              warnings that operational friction may exist beneath the top-line growth story.
