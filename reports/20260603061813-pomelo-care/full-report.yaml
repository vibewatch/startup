    title: Investment KPIs
    type: kpi
    layout: wide
    summary: These are the public metrics most relevant to underwriting Pomelo’s current round price.
    data:
      items:
        - label: Last round
          value: $1.7B
          detail: Fresh private mark from January 2026.
          tone: neutral
        - label: Covered lives
          value: 25 million
          detail: Strong distribution surface if monetization is real.
