  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Pomelo clears the quality and demand screen, but not yet the price and disclosure screen.
    data:
      nodes:
        - id: A
          label: Outcomes-backed scale
          detail: 25M+ covered lives, ~7% of births, and customer-proof outcomes support relevance.
          tone: positive
        - id: B
          label: Women’s health tailwind
          detail: Benefit design is expanding toward fertility, maternal, and menopause support in 2026.
          tone: positive
        - id: C
          label: Maven-parity price
          detail: Pomelo already carries a valuation equal to Maven’s last reported round.
          tone: neutral
        - id: D
          label: Missing economics file
          detail: Revenue, gross margin, retention, PMPM, and cap-table data are still private.
          tone: risk
        - id: E
          label: Selective capital market
          detail: Digital health funding is concentrated and exits remain narrow.
          tone: risk
        - id: F
          label: research-more / stretched
          detail: Strong company, but not yet a clean buy at the current mark.
          tone: risk
      edges:
        - from: A
          to: B
          label: supports
        - from: B
          to: C
          label: justifies attention
        - from: C
          to: D
          label: demands proof
        - from: D
          to: E
          label: raises financing risk
        - from: E
          to: F
          label: drives posture
    claimRefs:
      - CV054
      - CV057
      - CV058
      - CV060
      - CV061
      - CV069
      - CV071
      - CV072
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The fair-value band moves mostly with the comp lens investors choose and whether Pomelo proves benefits-like
      economics.
    data:
      items:
        - label: Telehealth floor case
          value: 0.8
          detail: If investors anchor Pomelo to distressed public virtual-care comps.
          tone: risk
        - label: Women’s-benefits anchor
          value: 1.4
          detail: If Pomelo proves economics closer to profitable benefits administration than broad telehealth.
          tone: neutral
        - label: Current round reference
          value: 1.7
          detail: The January 2026 private mark already assumes category-winner status.
          tone: neutral
        - label: Maven parity ceiling
          value: 1.7
          detail: Public evidence does not clearly support paying above the best-known women’s health comp today.
          tone: neutral
        - label: Bull platform proof
          value: 2.6
          detail: Requires low churn, strong PMPM economics, and successful adjacency expansion.
          tone: positive
    claimRefs:
      - CV042
      - CV044
      - CV046
      - CV048
      - CV050
      - CV054
      - CV056
      - CV072
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: The scenario range is wide because public evidence still cannot clear the core economics file.
    data:
      items:
        - label: Bear
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B-$1.0B
          detail: Expansion or financing disappoints and telehealth-style downside dominates.
          tone: risk
        - label: Base
          low: 1.3
          mid: 1.6
          high: 1.8
          displayValue: $1.3B-$1.8B
          detail: Maternity strength holds but adjacent products and economics remain early.
          tone: neutral
        - label: Bull
          low: 2.2
          mid: 2.6
          high: 3
          displayValue: $2.2B-$3.0B
          detail: Pomelo proves premium-quality economics plus expansion traction.
          tone: positive
        - label: Preferred entry zone
          low: 1.1
          mid: 1.4
          high: 1.6
          displayValue: $1.1B-$1.6B
          detail: Range where current disclosure risk is better compensated.
          tone: positive
    claimRefs:
      - CV065
      - CV066
      - CV067
      - CV068
      - CV072
