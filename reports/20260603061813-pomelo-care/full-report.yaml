  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what should count in the denominator
        blocks:
          - type: paragraph
            body: >-
              The right market boundary is narrower than “women’s digital health” and broader than a simple pregnancy
              app. PHTI defines virtual maternity care as education, remote monitoring, care coordination, and direct
              clinical care during and after pregnancy. Pomelo’s current payer, employer, and provider pages line up
              with that framing: the company sells 24/7 clinician-backed support around pregnancy, postpartum, and
              neonatal transitions, then uses midlife and pediatric care as adjacencies beyond the core wedge. That
              means the included spend for this chapter is institutional maternity-program spend tied to risk
              identification, triage, behavioral support, care coordination, and postpartum continuity. The excluded
              spend is just as important. Broad femtech and women’s digital-health reports pull in fertility-only tools,
              generic telemedicine, wearables, chronic-disease apps, and menopause categories that Pomelo may touch over
              time but do not define the current maternity-first market entry. If that broader denominator is used
              without adjustment, it overstates Pomelo’s monetizable wedge and weakens valuation discipline.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
              - CM009
