      - number: '7.3'
        title: Evidence Scrutiny, Provider-Model Complexity, and AI Claim Risk
        blocks:
          - type: paragraph
            body: |-
              Pomelo’s strongest commercial advantage is that it has more evidence than many digital
              health peers, but that same posture increases scrutiny. PHTI has now launched an
              independent 2026 evaluation of virtual maternity care for purchasers, which means the
              category’s claims will be benchmarked by an external reviewer rather than by vendor slide
              decks. Pomelo’s own evidence base is better than standard digital-health marketing—its
              flagship 2026 study references claims data from six plans across six states and nearly
              45,000 deliveries—but the public proof is still overwhelmingly company-originated. That
              makes any difference between audience-level marketing claims and study-defined cohorts a
              diligence item, not a footnote.

              The AI positioning raises a second layer of risk. Fierce and Hit Consultant both describe
              Pomelo’s clinician co-pilot and predictive analytics workflow, while FTC enforcement makes
              clear there is no legal carve-out for overclaiming what AI can substitute for. McGuireWoods
              adds that adaptive learning, autonomous recommendations, and patient-facing outputs can
              nudge healthcare AI toward medical-device scrutiny. In practice, Pomelo needs its
              clinician-in-the-loop story, evidence standards, and marketing language to stay tightly
              aligned as expansion broadens the number of clinical surfaces where claims can drift.
            claimRefs:
