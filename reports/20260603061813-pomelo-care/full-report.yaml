      - number: '3.2'
        title: Benefits-platform incumbents are the channel threat
        blocks:
          - type: paragraph
            body: >-
              Maven and Progyny are the most important scaled threats because both already own the enterprise buying
              motion Pomelo depends on. Maven says it supports 28 million lives, serves 2,300+ employers, operates
              across 175+ countries, and offers 24/7 access to more than 30 specialties. Its current model is broader
              than maternity: fertility, pediatrics, menopause, hormone care, GLP-1 care, and a consumer self-pay
              product all sit on the same platform. Maven’s pricing page and Sacra profile suggest an enrollment-based
              contract with explicit platform and per-enrolled-member economics, which gives buyers predictable
              budgeting and gives Maven room to land with fertility or global benefits before expanding into maternity.


              Progyny approaches the market from the benefits-administration side. It supports 600+ clients and 7.2
              million covered lives, integrates with 50+ health plans, and emphasizes pre-negotiated case rates,
              provider billing management, and high retention. Its pregnancy and postpartum program is less full-stack
              clinical than Pomelo’s but it is tightly embedded in employer and payer procurement. That combination
              matters: Pomelo may be more maternity-native, but buyers that already trust Progyny or Maven for broader
              women’s-health spend have a lower-friction expansion path than adopting a separate maternity-only vendor.
