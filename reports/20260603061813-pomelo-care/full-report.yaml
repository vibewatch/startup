      - number: '2.4'
        title: Reimbursement and policy context
        blocks:
          - type: paragraph
            body: >-
              Telehealth policy is a tailwind, but it is not a universal revenue unlock. At the federal level, HHS says
              many Medicare telehealth flexibilities now run through the end of 2027, including home-based
              non-behavioral telehealth and audio-only allowances in specified cases. CMS’s TMaH model goes further for
              maternal health by treating telehealth and home monitoring as tools inside a broader Medicaid whole-person
              model covering prenatal, postpartum, behavioral, and social needs. State policy still matters because
              maternity buyers often live in Medicaid managed care and commercial plans rather than Medicare
              fee-for-service. Virginia’s 2026 update shows the pattern clearly: the state supports RPM for high-risk
              pregnancy and is considering broader pregnancy and postpartum RPM coverage, but reimbursement still
              depends on documentation, coding, and clinical justification. Legal and compliance summaries of the 2026
              Medicare physician fee proposals also show more flexibility for shorter-duration RPM and RTM management
              and virtual supervision. The bottom line is positive but constrained: reimbursement is moving in the right
              direction, yet successful vendors still need payer contracting, clean workflows, and provider-grade
              documentation rather than assuming policy alone closes the sale.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM043
      - number: '2.5'
        title: Growth drivers, adoption constraints, and open gaps
        blocks:
          - type: paragraph
            body: >-
              The demand side of the category is strong because the underlying healthcare system is failing too many
              mothers and infants. March of Dimes, JABFM, and Georgetown show persistent maternity care deserts,
              worsening prenatal-access patterns, and meaningful racial and geographic disparities. CDC and March of
              Dimes show that preterm birth remains a one-in-ten event and that NICU admission rates are rising. Those
              facts create real urgency for earlier risk identification, between-visit support, and postpartum
              continuity. But the constraints are equally real. Employers still want hard proof that vendors reduce
              claims instead of just adding another point solution. Benefits are often hard to navigate, and provider
              access can still fail even when coverage exists, as Georgetown’s Virginia example shows. Workforce
              shortages in OB, midwifery, and rural maternity services mean virtual tools must complement midwives,
              doulas, birth centers, and in-person practices rather than pretend to replace them. The biggest remaining
              diligence gap is commercial detail: public sources do not disclose Pomelo’s PMPM pricing, buyer-level
              attach rate, or reimbursement mix well enough to turn attractive market logic into a defensible public SAM
              or SOM.
