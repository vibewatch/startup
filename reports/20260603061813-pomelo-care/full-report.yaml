            body: >-
              Public sources imply that Pomelo's cost base is materially more service-heavy than a pure software or AI
              wrapper. Employer, payer, and provider pages describe fully employed multispecialty clinicians, 24/7
              availability, remote monitoring, EHR/HIE coordination, and delivery through Pomelo, P.C. or affiliated
              professional corporations. The about-us and hiring pages add a second layer of fixed cost: commercial
              leadership, operations, product and data teams, engineering, security, legal, compliance, finance,
              enrollment operations, and geographically fragmented contract clinician networks. Multi-state delivery
              adds operational friction because telehealth reimbursement, licensure, consent, and payment-parity rules
              still vary by state. Privacy and security are not theoretical overhead either; federal agencies continue
              to warn healthcare operators about tracking-tech misuse and OCR's historical enforcement totals show that
              compliance failures can become real cash costs. None of this proves weak margins, but it does mean the
              margin path should be underwritten as clinically enabled care operations first and software leverage
