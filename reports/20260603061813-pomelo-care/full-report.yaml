        title: Care workflow and clinician operating model
        blocks:
          - type: paragraph
            body: >-
              The user-facing workflow is simple, but the operating model behind it is clinically dense. Public patient
              flows show enrollment starts with an eligibility check, then assignment to a dedicated care team, then
              always-on support over text, phone, video, and app. Provider and Fidelis materials clarify why that
              matters operationally: Pomelo is positioned as an added layer between visits that can absorb triage,
              common questions, social support, NICU transition support, nutrition counseling, and selected prescribing
              or escalation tasks without displacing the local OB, midwife, or pediatrician. That is the core design
              choice behind Pomelo’s differentiation. Instead of trying to replace incumbent practices, it sells a
              between-visit workflow that reduces inbox burden for practices and increases touchpoints for patients. The
              clinical team composition is intentionally broad—nurses, dietitians, therapists, lactation experts,
              doulas, OB/GYN and pediatric leaders—so the service can handle medical, behavioral, and social frictions
              in one operating loop. Evidence from employer, partner, and app surfaces suggests support quality is part
              of the product itself: sub-five-minute response claims, 24/7 access, and strong store ratings all indicate
              the company treats responsiveness as a deployable product feature rather than a generic care-management
              promise.
