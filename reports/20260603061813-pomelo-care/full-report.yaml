      - number: '3.3'
        title: Hybrid clinics and enablement layers attack different parts of the job
        blocks:
          - type: paragraph
            body: >-
              The clinic-led and enablement players pressure Pomelo from different angles. Oula and Millie use
              insurance-based hybrid care to sell a modern alternative to rushed OB-only care: midwife-led teams, doula
              support, longer visits, postpartum follow-up, and proactive monitoring. Oula publishes better C-section
              and preterm-birth outcomes plus savings-per-birth claims for employers and payers, while Millie explicitly
              bills core maternity care to insurance and includes the app, RPM devices, and doula guidance without extra
              charge. Those models can win affluent metro markets, but their current footprints are local and they do
              not yet look like national payer-platform substitutes.


              Mae and Quilted are more specialized. Mae is built around Medicaid, culturally responsive doula support,
              and reimbursement enablement for birth workers; Quilted mixes midwife-led care with practice software and
              network infrastructure for midwives. Wildflower and Babyscripts are the clearest internal-build
              substitutes. Wildflower sells a payer/provider connectivity layer, RPM, health advocates, ancillary
              networks, and value-based care architecture. Babyscripts sells provider and payer programs around remote
              monitoring, EMR integration, risk assessment, and reimbursable workflows. Both can help a plan or health
              system keep the patient and claims relationship while buying components rather than outsourcing the
              clinical brand to Pomelo.
