            Fully employed nurses, physicians, therapists, dietitians, lactation specialists, doulas, and
            pediatric/midlife clinicians execute care plans.
        - label: Grove workflow layer
          detail: >-
            Clinician command center coordinates patient communication, team collaboration, and evidence-based workflow
            execution.
        - label: Risk / data layer
          detail: >-
            Claims, lab, pharmacy, EHR, HIE, and remote-monitoring signals are synthesized to surface emerging risk and
            guide interventions.
        - label: Governance layer
          detail: >-
            Affiliated medical practices, HIPAA notices, HIE participation, accessibility program, and HITRUST-backed
            security controls define the compliance envelope.
