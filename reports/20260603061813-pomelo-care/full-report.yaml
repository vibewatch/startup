  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Pomelo does not face one monolithic rival. The competitive set breaks into three archetypes. First are
              scaled women’s-health benefits platforms, led by Maven Clinic and Progyny, that already sit inside
              employer and health-plan budgets and can add pregnancy support next to fertility, parenting, and
              menopause. Second are hybrid clinic operators such as Oula, Millie, and Quilted, plus equity-focused doula
              network Mae, that compete on patient experience, insurance reimbursement, and low-intervention maternity
              pathways but remain geographically narrower. Third are enablement layers such as Wildflower Health and
              Babyscripts that help payers and provider groups assemble their own navigation, remote monitoring,
              advocacy, and billing stack instead of outsourcing accountability to a full-stack virtual clinic.


              For Pomelo, this means the hardest problem is channel control more than feature parity. Maven and Progyny
              can bundle maternity into broader benefits relationships; Wildflower and Babyscripts let health plans and
              OB groups keep the member relationship in-house; and clinic operators offer a credible "switch from
              traditional OB" story in select metros. The default substitute is still fragmented OB-led care plus payer
              case management, but the more meaningful substitute for national buyers is modular internal build: combine
              RPM, care advocacy, doula support, and billing workflows without buying a new branded clinic.
