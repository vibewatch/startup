            body: >-
              The founder story is tightly linked to the company's operating thesis. AHIP and Forbes both describe Marta
              Bralic Kerns as coming from healthcare payment reform and data-driven care delivery work, especially at
              Flatiron Health, before founding Pomelo. That matters because Pomelo's product narrative is explicitly
              about using better data and earlier intervention to change outcomes in an expensive, fragmented care
              journey. Current public bios also show a leadership team with clear functional coverage across clinical
              care, commercial partnerships, operations, product and data, engineering, security, legal, and compliance.
              The March 2025 promotion cycle is especially important because it formalized a broader executive bench
              just before the company's 2025 to 2026 expansion push. Governance visibility is still incomplete, however.
              Public sources identify investor board involvement and a relatively strong advisory bench, but they do not
              disclose a full current board roster, ownership stakes, or control rights. For diligence, the leadership
              picture is robust enough to assess capability, but not robust enough to assess governance concentration or
              investor protections.
