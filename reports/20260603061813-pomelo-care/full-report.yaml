      - number: '8.4'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Pomelo does not yet look IPO-ready on public evidence. Rock Health says the digital health public exit
              window remains narrow, and Pomelo still has not provided the core disclosure package that public-market or
              late-stage crossover investors usually need: audited revenue, margin, retention, and pricing evidence.
              That makes another private round or a strategic M&A path more plausible than a near-term IPO, especially
              if management wants to preserve the current mark. The company’s affiliated-professional-corporation
              structure is also important. Public materials repeatedly note that clinical care is delivered through
              Pomelo, P.C. or affiliated professional corporations, so investors need to understand where economics and
              regulatory obligations actually sit.


              The diligence agenda is therefore straightforward. First, get the audited economics file. Second, get the
              cap table and preference stack. Third, test customer concentration and renewal quality. Fourth, inspect
              the methodology behind the outcomes claims and how repeatable they are across payer cohorts. Fifth,
              understand whether the affiliated-clinician structure caps margin capture or introduces reimbursement and
              compliance friction. Until those files are open, Pomelo should remain on the active watchlist, but not yet
              in the invest-now bucket at $1.7 billion.
