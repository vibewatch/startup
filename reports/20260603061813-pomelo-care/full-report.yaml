  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: |-
      Causal map linking operating-risk events to commercial, financing, and thesis-level
      consequences.
    data:
      nodes:
        - id: state_policy_shift
          label: State reimbursement or licensure shift
          detail: Coverage, parity, or active-state provider compliance changes
          tone: warning
        - id: privacy_incident
          label: Tracker / PHI disclosure incident
          detail: Authenticated or appointment workflow leaks sensitive data
          tone: negative
        - id: evidence_pushback
          label: Buyer evidence pushback
          detail: PHTI or payer review questions ROI and outcome comparability
          tone: warning
        - id: service_slip
          label: Service quality slip
          detail: Staffing or QA strain weakens response times and member outcomes
          tone: warning
        - id: slower_sales
          label: Slower renewals and pipeline conversion
          detail: Payers and employers extend diligence or delay rollout
          tone: negative
        - id: higher_burn
          label: Higher burn and longer payback
          detail: Expansion costs stay high while channel velocity slows
          tone: negative
        - id: down_round
          label: Bridge or down round risk
          detail: Next financing occurs on weaker terms than Series C narrative implies
          tone: negative
        - id: thesis_break
          label: Investment thesis break
          detail: Growth, trust, and underwriting confidence deteriorate together
          tone: negative
      edges:
        - from: state_policy_shift
          to: slower_sales
          label: coverage uncertainty delays buying decisions
        - from: privacy_incident
          to: slower_sales
          label: trust shock hits renewals and new sales
        - from: evidence_pushback
          to: slower_sales
          label: ROI narrative weakens
        - from: service_slip
          to: slower_sales
          label: quality proof erodes
        - from: slower_sales
          to: higher_burn
          label: growth falls behind staffing and expansion cost base
        - from: higher_burn
          to: down_round
          label: more capital needed on worse terms
        - from: privacy_incident
          to: thesis_break
          label: regulatory and reputational damage can short-circuit the story
        - from: down_round
          to: thesis_break
          label: capital market verdict confirms risk stack
    claimRefs:
      - CR002
      - CR023
      - CR026
      - CR031
      - CR036
      - CR041
      - CR047
      - CR050
