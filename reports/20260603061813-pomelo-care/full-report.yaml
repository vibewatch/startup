  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Pomelo's public commercial surfaces show a classic B2B2C maternity-care model rather than a
              direct-to-consumer subscription. The employer page sells Pomelo as an employee benefit, the payer page
              sells a plan solution for reducing high-cost maternity claims, and the provider page says practices and
              eligible patients do not pay directly for the service. Fidelis adds an important corroboration point:
              eligible members receive Pomelo at no additional cost, which is consistent with a health-plan-funded
              benefit. What the company does not publish is equally important. Both employer and payer pages route
              prospects to demo requests and never disclose list pricing, PMPM, episode fees, implementation fees, or
              outcome-guarantee structure. That means revenue quality cannot be modeled from pricing alone; the economic
              case rests on whether Pomelo can reliably convert avoided NICU, ER, cesarean, and preterm costs into payer
              and employer willingness to pay. Public evidence supports the demand narrative, but not the contract-level
              economics.
