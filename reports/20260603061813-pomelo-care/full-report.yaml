  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis
        blocks:
          - type: paragraph
            body: >-
              Pomelo deserves serious attention because the public record shows unusual category momentum for a young
              women’s and children’s health company. The January 2026 Series C reset the reference price at $1.7
              billion, the company says it now covers more than 25 million lives and supports nearly 7% of U.S. births,
              and its materials plus the Koch customer case study present unusually strong maternity outcome claims.
              Benefit-design trends also help the story: PHTI says virtual maternity care has attracted more than $2.5
              billion of investment, while Evernorth says fertility, maternal, and menopause benefits are expanding in
              2026. That is the core thesis: Pomelo may be emerging as an outcomes-backed category winner with room to
              expand beyond maternity into a broader life-stage platform.


              The anti-thesis is that the price already assumes a lot. Pomelo’s $1.7 billion mark matches Maven’s last
              reported valuation even though Maven publicly discloses more than 2,000 clients across 175 countries and
              more than $425 million of total funding. Pomelo’s public materials emphasize outcomes, covered lives, and
              expansion, but not revenue, gross margin, retention, PMPM pricing, or the preference stack. That leaves
              the company looking strong on product-market fit and weak on underwriteable economics. On public evidence
              alone the disciplined conclusion is research-more, not buy: the company may well deserve a premium, but
              the current round does not leave enough margin for error without a data-room-level economics file.
            claimRefs:
              - CV001
