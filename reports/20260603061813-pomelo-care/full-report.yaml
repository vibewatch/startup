  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reimbursement, Licensure, and Legal-Structure Risks
        blocks:
          - type: paragraph
            body: |-
              Pomelo’s business model depends on a regulatory stack that is fragmented by design.
              Medicaid still treats telehealth as a delivery method rather than a standalone benefit,
              leaving states to decide which services, modalities, providers, and reimbursement methods
              qualify. CCHP’s latest 50-state survey shows why this matters: most states address
              telehealth reimbursement, but explicit payment parity is far from universal and licensure
              exceptions remain inconsistent. For a company that markets itself to Medicaid and
              commercial plans, advertises postpartum support for a full year, and claims broad covered
              lives, this means economics can change because a handful of state manuals or payer
              policies move.

              The entity structure also needs to work every time. Pomelo Care, Inc. says it does not
              provide medical services; instead, affiliated professional corporations and Pomelo
              Providers do. That is a standard approach for navigating corporate-practice-of-medicine
              rules, but it creates an operational obligation to keep licensure, supervision,
              contracting, HIE consent, and billing clean across jurisdictions. If one state’s rules
              shift or if the provider footprint lags the sales footprint, reimbursement leakage and
              compliance risk emerge before demand does.
