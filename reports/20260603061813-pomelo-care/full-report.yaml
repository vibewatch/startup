            body: >-
              Pomelo’s trust posture is credible but still selectively disclosed. On the positive side, the company
              publicly announced HITRUST i1 certification in 2025, publishes a detailed general privacy policy,
              maintains a separate HIPAA notice of privacy practices, and states that its digital properties are being
              tested toward WCAG 2.2 A/AA with Level Access. The privacy materials also reveal operational substance
              that many virtual-care vendors omit: Pomelo’s provider entities license the Pomelo Care web application,
              participate in secure HIEs, and use hosting, analytics, session-replay, and SDK-based digital tooling
              across the website, app, and virtual clinic. Patient-surface deployment maturity is visible in the live
              iOS and Android apps, which show recent updates, strong ratings, encrypted-in-transit data on Google Play,
              and active support contacts. But public reliability disclosure is notably thin. No public status page,
              uptime commitment, incident-history feed, named disaster-recovery posture, or cloud-vendor disclosure
              surfaced in the reviewed sources. Likewise, beyond HITRUST, reviewed sources do not disclose SOC 2, ISO
              27001, pen-test summaries, or other enterprise assurance artifacts. The result is a trust profile that is
              strong enough for commercial storytelling and initial diligence, but not yet transparent enough to
              underwrite platform resilience without direct diligence access.
