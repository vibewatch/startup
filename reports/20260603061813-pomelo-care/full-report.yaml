  - id: FU001
    title: Pomelo customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Buyer-sponsored member journey from enterprise contracting to longitudinal care and cross-sell, showing how plan
      or employer sponsorship removes price friction while providers help feed and reinforce usage.
    data:
      nodes:
        - id: buyer-identifies-gap
          label: Buyer identifies maternal or midlife gap
          description: Health plan or employer sees NICU, ER, maternal-access, or productivity pain and starts a vendor review.
        - id: vendor-selection
          label: Enterprise procurement
          description: >-
            Benefits or payer teams compare vendors using ROI, clinical evidence, and operational fit; Koch describes a
            data-led selection process.
        - id: eligibility
          label: Eligibility and sponsorship
          description: >-
            Member checks whether Pomelo is available through a participating employer or plan, removing most direct
            price friction.
        - id: enrollment
          label: Enrollment and matching
          description: Eligible member downloads the app, is matched to a care team, and receives a personalized plan.
        - id: longitudinal-care
          label: Longitudinal virtual care
          description: >-
            Member uses 24/7 messaging, calls, and video across pregnancy, postpartum, NICU transition, pediatrics, or
            midlife.
        - id: referral-loop
          label: Provider and account reinforcement
          description: >-
            OB-GYNs, NICU teams, and care managers refer eligible patients; quantified outcomes then support renewal or
            cross-sell.
    approximationNotes: >-
      This journey is synthesized from public sponsor, patient, payer, and provider pages plus Koch's employer case
      study; Pomelo does not publish a formal funnel diagram.
    claimRefs:
      - CU001
      - CU013
      - CU015
      - CU016
      - CU037
      - CU038
      - CU047
      - CU048
  - id: FU002
    title: Pomelo adoption and expansion flow
    type: flow
    layout: wide
    summary: >-
      The public adoption path runs from ROI-driven procurement to sponsored eligibility, sustained clinical engagement,
      outcome proof, and then contract or product expansion.
    data:
      nodes:
        - id: procurement
          label: Evidence-led procurement
          description: Plans and employers screen vendors on outcomes, ROI, and operational credibility.
        - id: contract
          label: Benefit or plan contract
          description: Sponsor adds Pomelo as a covered benefit or care-management partner.
        - id: member-enrollment
          label: Sponsored member enrollment
          description: Eligible members opt in through employer or health-plan access.
        - id: sustained-engagement
          label: Sustained engagement
          description: Average maternity engagement reaches seven months, and clinical value compounds with longer use.
        - id: outcome-proof
          label: Outcome proof
          description: Koch and peer-reviewed studies generate ROI and outcome evidence.
        - id: cross-sell
          label: Renewal and cross-sell
          description: Accounts may expand into doula, pediatric, or midlife services if outcomes are strong.
      edges:
        - from: procurement
          to: contract
          label: buyers choose sponsor model
        - from: contract
          to: member-enrollment
          label: covered eligibility unlocks access
        - from: member-enrollment
          to: sustained-engagement
          label: 24/7 care keeps members active
        - from: sustained-engagement
          to: outcome-proof
          label: longer engagement yields stronger measured results
        - from: outcome-proof
          to: cross-sell
          label: proof supports renewal or product expansion
    approximationNotes: >-
      This is a mechanism map, not a numeric conversion funnel; Pomelo does not publish stage-by-stage procurement or
      member-conversion rates.
    claimRefs:
      - CU008
      - CU020
      - CU025
      - CU029
      - CU030
