chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and care model
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care presents itself as a New York-based healthcare company built for women and children, with
              public materials consistently tracing the business back to 2021. The company started in maternity and
              newborn care, but the 2026 product surface is broader: fertility and preconception support, prenatal and
              postpartum care, pediatric and NICU support, and midlife care all appear in current materials. The
              operating proposition is not just telehealth access. Pomelo says its model combines predictive analytics,
              evidence-based care pathways, and a multispecialty clinician team available by text, phone, video, and app
              so risk can be identified earlier and managed between office visits. That positioning matters because
              Pomelo explicitly says it complements rather than replaces local OB-GYNs, midwives, and other in-person
              providers. A second diligence detail is the legal structure disclosed in the site footer: clinical care is
              delivered through Pomelo, P.C. or affiliated professional corporations, while Pomelo Care, Inc. operates
              the broader organization. Public disclosure is therefore strongest on reach and care design, but thinner
              on classic operating metrics such as headcount and revenue.
