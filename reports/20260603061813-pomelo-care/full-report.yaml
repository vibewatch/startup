        - label: Maven parity
          value: $1.7B
          detail: Cleanest private comp ceiling in the public record.
          tone: neutral
        - label: Public comp band
          value: 0.56x-6.96x
          detail: Wide sales-multiple range across telehealth, benefits, DTC, and workflow comps.
