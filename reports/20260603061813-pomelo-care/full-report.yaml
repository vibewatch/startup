      - number: '2.2'
        title: Sizing lenses and why public TAMs conflict
        blocks:
          - type: paragraph
            body: >-
              Public market reports are directionally useful but not reliable enough to serve as a standalone Pomelo
              TAM. Strategic Market Research places the U.S. women’s digital-health market at about $590 million in
              2024, while Grand View Research starts from a much higher $949.3 million in 2023 and projects a much
              larger 2030 outcome. Those estimates conflict because they measure different scopes and product bundles,
              not because one necessarily describes Pomelo’s actual near-term wedge. A more defensible public sizing
              lens starts with the real maternity denominator. March of Dimes reports 377,204 preterm births at a 10.4%
              rate in 2024, implying roughly 3.63 million live births nationally. CDC then shows NICU admission at 9.8%
              of births in 2023, which highlights how much of the category value is tied to avoiding high-cost
              complications rather than selling wellness content to all women. Pomelo’s own claim that it already
              touches nearly 7% of U.S. births implies meaningful existing scale, but it does not reveal price, mix, or
              attach rates well enough to compute a public SOM.
