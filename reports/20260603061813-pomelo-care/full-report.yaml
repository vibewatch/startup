        - Unrelated general digital health categories
        - Consumers, employers, providers, insurers
        - Useful outer ceiling but too broad to use as Pomelo SAM
      - - Adjacent lifecycle categories
        - Midlife, pediatric, reproductive, and family-care adjacencies
        - Standalone pediatric-only or menopause-only spend in the current maternity analysis
        - Mixed institutional buyers
        - Important for strategy expansion but not the core chapter denominator
