      - number: '3.3'
        title: 混合诊所与赋能层攻击不同任务环节
        blocks:
          - type: paragraph
            body: >-
              诊所主导玩家和赋能型玩家从不同角度挤压 Pomelo。Oula 和 Millie 用基于保险的混合护理，销售一种现代化替代方案，对标匆忙的仅 OB
              护理：助产士主导团队、导乐支持、更长就诊、产后跟进和主动监测。Oula 发布了更好的剖宫产和早产结果，以及面向雇主和支付方的每次分娩节省声明；Millie 则明确把核心孕产护理向保险计费，并把应用、RPM
              设备和导乐指导纳入服务，不额外收费。这些模式可以赢下富裕都会区市场，但当前覆盖范围仍是本地化，还不像全国性支付方平台替代品。


              Mae 和 Quilted 更专门化。Mae 围绕 Medicaid、文化响应型导乐支持和生育工作者报销赋能来构建；Quilted 将助产士主导护理与助产士诊所软件、网络基础设施结合。Wildflower 和
              Babyscripts 是最清晰的内部自建替代品。Wildflower 销售支付方 / 医疗服务者连接层、RPM、健康倡导、辅助网络和值基护理架构。Babyscripts 销售围绕远程监测、EMR
              集成、风险评估和可报销工作流的医疗服务者和支付方项目。两者都能帮助健康计划或卫生系统保留患者和理赔关系，同时购买组件，而不是把临床品牌外包给 Pomelo。
