companyProfile:
  summary: >
    Pomelo Care 是一家总部位于 New York 的虚拟医疗公司，聚焦女性与儿童健康。公司从孕产护理起步，现在对外销售的范围包括生育或孕前支持、产前与产后护理、儿科或 NICU 支持，以及中年健康护理。其模式把 24/7
    多专科临床支持、预测分析和护理路径结合起来，定位是补充线下医疗服务，而不是取代线下医生。
  foundedDate: '2021-01-01'
  founders:
    - name: Marta Bralic Kerns
      role: 创始人兼 CEO
      background: 曾在 McKinsey 和 Flatiron Health 任运营岗位；个人孕期经历促成了 Pomelo 的创立。
      claimRefs:
        - CO005
        - CO006
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >
    Pomelo 销售面向女性和儿童的虚拟护理平台，覆盖生育或孕前支持、孕期和产后护理、儿科或 NICU 支持，以及中年护理。患者通过文字、电话、视频和应用工作流与护士及其他临床人员互动，Pomelo 同时与外部 OB-GYN
    和医疗服务团队协同。
  customerFocus: |
    将 Pomelo 作为福利提供给孕产成员、父母、儿童和中年患者的健康计划与雇主。
  businessModel: |
    面向健康计划和雇主销售的 B2B2C 模式，临床服务通过 Pomelo, P.C. 或关联专业公司交付。
