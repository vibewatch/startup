      - number: '8.4'
        title: 退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Pomelo 还不像具备 IPO 条件。Rock Health 称数字健康公开退出窗口仍然狭窄，而 Pomelo
              尚未提供公开市场或后期跨界投资者通常需要的核心披露包：经审计收入、利润率、留存和定价证据。因此，下一轮私募或战略并购路径，比近期 IPO
              更可信，尤其是在管理层想守住当前估值标记的情况下。公司的关联专业公司结构同样重要。公开材料反复指出，临床护理由 Pomelo, P.C. 或关联专业公司交付，所以投资人需要理解经济性和监管义务究竟落在哪里。


              尽调清单因此很直接。第一，拿到经审计的经济性文件。第二，拿到股权结构表和优先股堆叠。第三，测试客户集中度和续约质量。第四，检查结果宣称背后的方法，以及这些结果能否在不同付款方队列中复现。第五，理解关联临床医生结构是否限制利润率捕获，或引入报销和合规摩擦。在这些文件打开之前，Pomelo
              应留在主动观察名单上，但在 $1.7 billion 估值下还不应进入立即投资篮子。
