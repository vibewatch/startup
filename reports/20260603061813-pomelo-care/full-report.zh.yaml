      - number: '7.3'
        title: 证据审查、提供者模式复杂性与 AI 宣称风险
        blocks:
          - type: paragraph
            body: >-
              Pomelo 最强的商业优势，是它比许多数字健康同行拿出了更多证据；但同样的姿态也会招来更严审视。PHTI 已启动面向采购方的 2026
              年虚拟孕产护理独立评估，意味着这个品类的宣称将由外部审查方定标，而不是由供应商 PPT 自说自话。Pomelo 自身证据基础强于标准数字健康营销——其旗舰 2026 年研究引用了 6 个州、6
              个计划的理赔数据，覆盖近 45,000 次分娩——但公开证据仍压倒性地来自公司自身。因此，面向市场的宣称与研究定义队列之间若有差异，那是尽调事项，不是脚注。


              AI 定位带来第二层风险。Fierce 和 Hit Consultant 都描述了 Pomelo 的临床医生 co-pilot 和预测分析工作流，而 FTC 执法已经讲清楚：夸大 AI
              可替代的事项没有法律豁免。McGuireWoods 还指出，自适应学习、自主建议和面向患者的输出，可能把医疗 AI 推向医疗器械审查。落到执行上，随着扩张带来更多临床触点，Pomelo
              必须让“临床医生在环”、证据标准和营销语言保持紧密一致，否则宣称口径会漂移。
