  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |-
      因果图，将运营风险事件连接到商业、融资和投资逻辑层面的
      后果。
    data:
      nodes:
        - id: state_policy_shift
          label: 州级报销或执照变化
          detail: 覆盖、同等报销或实际执业州的服务方合规发生变化
          tone: warning
        - id: privacy_incident
          label: 追踪器 / PHI 披露事件
          detail: 认证或预约工作流泄露敏感数据
          tone: negative
        - id: evidence_pushback
          label: 买方质疑证据
          detail: PHTI 或支付方评审质疑 ROI 和结果可比性
          tone: warning
        - id: service_slip
          label: 服务质量滑坡
          detail: 人员配置或 QA 压力削弱响应时间和会员结果
          tone: warning
        - id: slower_sales
          label: 续约和管道转化放慢
          detail: 支付方和雇主延长尽调或推迟上线
          tone: negative
        - id: higher_burn
          label: 烧钱更高、回本更慢
          detail: 渠道速度放慢时，扩张成本仍居高不下
          tone: negative
        - id: down_round
          label: 过桥轮或估值下调轮风险
          detail: 下一轮融资条款弱于 Series C 叙事暗示的水平
          tone: negative
        - id: thesis_break
          label: 投资逻辑破裂
          detail: 增长、信任和承保信心同步恶化
          tone: negative
      edges:
        - from: state_policy_shift
          to: slower_sales
          label: 覆盖不确定性拖慢购买决策
        - from: privacy_incident
          to: slower_sales
          label: 信任冲击打击续约和新销售
        - from: evidence_pushback
          to: slower_sales
          label: ROI 叙事转弱
        - from: service_slip
          to: slower_sales
          label: 质量证明被侵蚀
        - from: slower_sales
          to: higher_burn
          label: 增长追不上人员和扩张成本底座
        - from: higher_burn
          to: down_round
          label: 需要更多资本，条款更差
        - from: privacy_incident
          to: thesis_break
          label: 监管和声誉损害可能直接切断故事
        - from: down_round
          to: thesis_break
          label: 资本市场判定确认风险堆叠
    claimRefs:
      - CR002
      - CR023
      - CR026
      - CR031
      - CR036
      - CR041
      - CR047
      - CR050
