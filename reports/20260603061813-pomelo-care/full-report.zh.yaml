  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: |-
      八个风险域按固有可能性、固有影响、控制成熟度和
      剩余暴露绘制。
    data:
      columns:
        - 固有可能性（1-5）
        - 固有影响（1-5）
