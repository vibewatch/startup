  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分母口径
        blocks:
          - type: paragraph
            body: >-
              正确的市场边界，比“女性数字健康”更窄，也比单纯的孕期应用更宽。PHTI 将虚拟孕产护理定义为孕期及产后教育、远程监测、护理协调和直接临床护理。Pomelo
              当前面向支付方、雇主和医疗服务者的页面与这一框架一致：公司销售围绕孕期、产后和新生儿转衔的 24/7
              临床人员支持，再把中年护理和儿科护理作为核心切入点之外的相邻扩展。也就是说，本章纳入的支出，是与风险识别、分诊、行为支持、护理协调和产后连续性相关的机构孕产项目支出。被排除的支出同样重要。宽泛的 femtech
              和女性数字健康报告会把单纯生育工具、通用远程医疗、可穿戴设备、慢病应用和更年期品类都拉进来；Pomelo 未来可能触达这些方向，但它们并不定义当前以孕产为先的市场入口。如果不加调整就使用这个更宽的分母，会夸大
              Pomelo 可变现的楔子，也会削弱估值纪律。
