      - number: '2.4'
        title: 报销与政策环境
        blocks:
          - type: paragraph
            body: >-
              远程医疗政策是顺风，但不是通用的收入解锁器。联邦层面，HHS 称许多 Medicare 远程医疗灵活性现在延续到 2027 年底，包括在特定情况下的居家非行为健康远程医疗和纯音频服务。CMS 的 TMaH
              模型在孕产健康上走得更远，把远程医疗和居家监测纳入更广泛的 Medicaid 全人模型，覆盖产前、产后、行为和社会需求。州政策仍然关键，因为孕产买家常常存在于 Medicaid 管理式医疗和商业计划，而不是
              Medicare 按服务收费。Virginia 的 2026 年更新清楚展示了这种模式：该州支持高风险妊娠 RPM，并在考虑更广泛的孕期和产后 RPM 覆盖，但报销仍取决于文档、编码和临床理由。关于 2026 年
              Medicare 医师收费提案的法律与合规摘要也显示，短周期 RPM 和 RTM
              管理、虚拟监督的灵活性有所提高。结论是积极但受约束：报销正朝正确方向移动，但成功供应商仍需要支付方签约、干净的工作流和医疗服务级文档，而不能假定政策本身就能完成销售。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM043
      - number: '2.5'
        title: 增长驱动、采用约束与开放缺口
        blocks:
          - type: paragraph
            body: >-
              这个品类的需求侧很强，因为底层医疗系统让太多母亲和婴儿掉了队。March of Dimes、JABFM 和 Georgetown 显示，孕产护理荒漠持续存在，产前可及性恶化，种族和地理差异有实质影响。CDC 和
              March of Dimes 显示，早产仍是十分之一的事件，NICU
              入院率也在上升。这些事实为更早的风险识别、就诊间隙支持和产后连续性制造了真实紧迫感。但约束同样真实。雇主仍需要硬证据，证明供应商能降低理赔，而不是只增加另一个点状解决方案。福利往往难以导航，即使有覆盖，医疗服务可及性仍可能失灵，Georgetown
              的 Virginia 案例就是如此。OB、助产和农村孕产服务的人手短缺意味着，虚拟工具必须补充助产士、导乐、分娩中心和线下诊所，而不是假装取代它们。最大的剩余尽调缺口是商业细节：公开来源没有披露 Pomelo 的
              PMPM 定价、买家层面的附加率或报销组合，无法把有吸引力的市场逻辑转化为站得住脚的公开 SAM 或 SOM。
