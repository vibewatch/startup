      - number: '6.3'
        title: 留存、持久性与扩张代理指标
        blocks:
          - type: paragraph
            body: >-
              Pomelo 不发布 NRR、GRR、客户流失或合同期限等常规 B2B
              持久性指标。即便如此，公开记录里仍有几个有用替代指标。第一，雇主孕产页面称平均成员参与持续七个月；在许多数字点状解决方案很难让患者贯穿孕期和产后持续活跃的品类里，这个数字有意义。第二，2026 年 3
              月的同行评议发布显示剂量反应曲线：更好的结果从第一个月开始出现，成员持续参与三个月或更久后进一步改善。第三，2025 年结果发布显示，中重度抑郁患者中有三分之二在约 40
              天内症状减轻，这意味着持续临床跟进，而不是一次性聊天使用。扩张信号也存在。Koch
              从孕产扩展到导乐和中年支持，公司产品表面现在覆盖生育、孕产、儿科和中年项目。这个模式支持先落地再扩张逻辑，但没有公开续约数据时，投资人仍无法区分账户扩张和标题式新客户增长。
