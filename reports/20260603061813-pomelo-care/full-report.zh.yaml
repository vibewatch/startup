        title: 领导层梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事与公司的运营命题绑得很紧。AHIP 和 Forbes 都称，Marta Bralic Kerns 在创立 Pomelo 前，经历来自医疗支付改革和数据驱动护理交付，尤其是在 Flatiron
              Health 的工作。这个背景重要，因为 Pomelo
              的产品叙事明确指向：用更好的数据和更早的干预，改变一条昂贵且碎片化的护理旅程中的结果。当前公开履历也显示，领导团队在临床护理、商业合作、运营、产品与数据、工程、安全、法务和合规等职能上覆盖清晰。2025 年 3
              月的晋升周期尤其重要，因为公司在 2025 至 2026
              年扩张推进之前，正式搭出了更宽的高管梯队。不过，治理可见度仍不完整。公开来源能识别投资人董事会参与和相对强的顾问阵容，但没有披露完整的当前董事会名单、持股比例或控制权。对尽调而言，领导层图谱足以评估执行能力，但还不足以评估治理集中度或投资人保护。
