      - number: '7.2'
        title: 隐私、HIPAA 与安全风险
        blocks:
          - type: paragraph
            body: >-
              隐私风险是 Pomelo 投资逻辑的一阶变量，因为它的公开网页触点、移动端和门户体验、提供者工作流，都贴近高度敏感的孕产妇和新生儿信息。Pomelo 隐私政策披露，其数字资产会使用
              Cookie、像素、会话重放、分析和广告合作伙伴。HHS 和 FTC 已多次警告健康和远程医疗公司：一旦认证门户、预约流程、症状录入页面或其他承载 PHI 的体验牵涉其中，追踪器使用可能构成不被允许的披露。HHS
              明确指出，披露 PHI 时，Cookie 横幅和一般隐私政策不能替代 HIPAA 授权或商业伙伴合同。


              执法背景已不再停留在理论层面。GoodRx 被罚，并被禁止将健康数据用于广告；OCR 已把不当披露和缺少保障措施列为最常见执法类别；原告律师也在医疗领域积极推进像素案件。Pomelo
              的确拿出了实际缓释：HITRUST i1 认证、具名 CISO、具名合规负责人，以及描述泄露通知和商业伙伴保障措施的隐私实践通知。但这些控制必须真正映射到每一条认证和准认证数据流，而不只是核心提供者 App。
