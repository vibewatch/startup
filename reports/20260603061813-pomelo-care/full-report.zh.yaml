      - number: '7.4'
        title: 渠道、竞争、资本与劳动力风险
        blocks:
          - type: paragraph
            body: >-
              Pomelo 的市场进入结构依赖机构，而不是消费者拉动。患者被告知要通过符合条件的保险或雇主福利使用服务；付款方和雇主页面强调
              ROI、理赔下降和覆盖人群，而不是独立订阅经济性。对孕产护理来说，这很合理，但也意味着客户集中度、续约风险和采购摩擦，远比表层覆盖人群数字更重要。公开材料确认了规模和付款方触达，却没有展示收入集中度、续约队列，或按州、按雇主分层的渠道留存。


              竞争也真实存在，而且资金充足。Maven 资金规模大得多，拥有数千家雇主客户，并横跨生育、孕产、儿科和中年等相邻项目；Oula 走保险支付、证据导向的混合护理模式，竞争轴线不同但仍相关。与此同时，Pomelo
              刚以溢价估值完成大额 Series C，并开始向孕产之外扩张。这会增加经营杠杆，也会抬高烧钱风险和执行复杂度。24/7 承诺、7
              个月互动周期以及孕产护理荒漠背景，让劳动力质量成为闸门变量：招聘或质控一旦跟不上，买方明显流失前，产品就可能先劣化。
