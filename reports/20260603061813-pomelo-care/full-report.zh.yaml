          - type: callout
            title: 反向证据存在，但性质是运营性的，不是战略性的
            body: >-
              最清楚的公开负面信号，不是失去某个支付方或雇主部署失败，而是评价层面的摩擦。BBB 称 Pomelo
              未获认证，并显示两条尖锐投诉，其中一条涉及向导乐付款缓慢。样本太小，不足以改写投资逻辑，但确实提示：合同工或服务运营流程值得尽调，不能因为增长叙事强就默认没问题。
