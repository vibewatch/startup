      - number: '6.5'
        title: 图表材料
        blocks:
          - type: callout
            title: Koch 是有意义的证明，不只是客户标识页
            body: >-
              Koch 给了 Pomelo 一样许多点状解决方案供应商缺少的东西：一份新鲜的 2026 年案例研究，包含入组规模、三项量化结果改善、满意度分数，以及产品从初始孕产范围向外扩张的证据。这不能证明整本客户账都像
              Koch 一样运转，但确实显示至少一个大型雇主关系已经走出试点话术，进入有结果背书的多产品部署。
            calloutType: strength
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
              - CU023
              - CU024
              - CU025
          - type: callout
            title: 最大缺失尽调项是账户层面的持久性
            body: >-
              Pomelo 的公开叙事在覆盖人数、结果和护理团队设计上很丰富，但在投资人通常用来判断客户持久性的指标上很薄：续约率、流失、NRR、GRR、合同期限和大客户集中度。相对于 25 million
              覆盖人数标题，具名账户集合很短，因此即便顶线采用看起来真实，这个缺口也实质限制了对客户质量的信心。
            calloutType: risk
            claimRefs:
