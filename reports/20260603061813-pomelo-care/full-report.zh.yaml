        title: 成本结构、利润率约束与交付驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开来源显示，Pomelo 的成本基础明显比纯软件或 AI 外壳更偏服务。雇主、支付方和医疗服务者页面描述了全职雇用的多专科临床人员、24/7 可用性、远程监测、EHR/HIE 协同，以及通过 Pomelo,
              P.C.
              或关联专业公司交付。关于我们和招聘页面又叠加了第二层固定成本：商业领导、运营、产品与数据团队、工程、安全、法务、合规、财务、入组运营，以及地理上分散的合同临床人员网络。多州交付增加了运营摩擦，因为远程医疗报销、执照、同意和支付平价规则仍因州而异。隐私和安全也不是理论性开销；联邦机构持续警示医疗运营商关于追踪技术误用的问题，OCR
              的历史执法总额说明，合规失败会变成真实现金成本。这些都不能证明利润率弱，但意味着在贡献数据另有证明之前，利润率路径应先按临床赋能型护理运营承销，其次才是软件杠杆。
