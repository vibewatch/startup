  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Pomelo 的公开商业页面显示，它采用经典 B2B2C 孕产护理模式，而不是面向消费者直接订阅。雇主页面把 Pomelo
              作为员工福利销售，支付方页面把它作为降低高成本孕产理赔的计划解决方案销售，医疗服务者页面则称诊所和符合条件的患者不直接为服务付费。Fidelis 提供了一个重要佐证：符合条件的成员无需额外付费即可获得
              Pomelo，这与健康计划出资的福利一致。公司不公开的内容同样重要。雇主和支付方页面都把潜在客户导向演示请求，从不披露标价、PMPM、单次事件费用、实施费或结果保证结构。这意味着不能只靠定价来建模收入质量；经济逻辑取决于
              Pomelo 能否稳定地把避免的 NICU、ER、剖宫产和早产成本，转化为支付方和雇主的付费意愿。公开证据支持需求叙事，但不支持合约层面的经济模型。
