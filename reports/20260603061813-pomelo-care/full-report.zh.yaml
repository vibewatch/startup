  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Pomelo 值得认真关注，因为公开记录显示，这家年轻的女性与儿童健康公司在品类动能上并不寻常。2026 年 1 月 Series C 把参考价格重置到 $1.7 billion；公司称目前覆盖超过 25
              million 人群，并支持近 7% 的美国出生；其材料加上 Koch 客户案例研究，也给出了异常强的孕产结果宣称。福利设计趋势同样帮它讲故事：PHTI 称虚拟孕产护理已吸引超过 $2.5 billion
              投资，Evernorth 则称生育、孕产和更年期福利会在 2026 年扩张。核心投资逻辑由此成立：Pomelo 可能正在成为一个由结果证据支撑的品类赢家，并有空间从孕产延展为更广的生命阶段平台。


              反向逻辑是，价格已经计入了很多预期。Pomelo 的 $1.7 billion 标记与 Maven 最近一次披露估值相同，但 Maven 公开披露的客户超过 2,000 家，覆盖 175 个国家，累计融资超过
              $425 million。Pomelo 公开材料强调结果、覆盖人群和扩张，却不披露收入、毛利率、留存、PMPM
              定价或优先股堆叠。这让公司看起来产品市场匹配很强，但可承销经济性很弱。仅凭公开证据，审慎结论应是继续研究，而不是买入：公司可能确实配得上溢价，但没有数据室级别经济性文件时，当前轮次没有留下足够容错空间。
