  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与模块地图
        blocks:
          - type: paragraph
            body: >-
              现在更适合把 Pomelo 的产品理解为生命周期护理平台，而不是单一孕产点状解决方案。官网和 2026 年 Series C 材料显示，外部可见的护理项目有四个——生育与孕前支持、产前与产后护理、儿科与 NICU
              支持、中年健康寿命护理——都包在一个由支付方和雇主赞助的运营模式里。模块地图很重要，因为 Pomelo
              销售的不只是聊天入口：公司把每个阶段与专门临床人员、护理计划，以及营养、治疗、导乐支持、哺乳或儿科随访等相邻服务路由配对。中年页面显示，最新产品线已经被搭成一个真实临床项目，包含妇科、治疗、营养师和慢病支持，而不是轻量内容附加项。公开证据在孕产、早期婴儿和更年期相邻工作流上最强；更广泛儿科的公开细节仍更薄，这说明扩张是真实的，但还没有在每个模块上同样充分记录。这个组合让
              Pomelo 比大多数孕产创业公司拥有更宽的平台故事，同时也要求投资人尽调：儿科和长期预防表面中，究竟有多少已经产品化，多少仍在商业化。
