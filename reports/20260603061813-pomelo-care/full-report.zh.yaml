      - CV072
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公允价值区间主要随投资人选择的可比公司视角而动，也取决于 Pomelo 能否证明接近福利业务的经济性。
    data:
      items:
        - label: 远程医疗底部情景
          value: 0.8
          detail: 如果投资人把 Pomelo 锚定到承压的公开虚拟护理可比公司。
          tone: risk
        - label: 女性福利锚点
          value: 1.4
          detail: 如果 Pomelo 证明其经济性更接近盈利的福利管理，而不是广义远程医疗。
          tone: neutral
        - label: 当前轮次参照
          value: 1.7
          detail: 2026 年 1 月私募标记已经假设 Pomelo 是品类赢家。
          tone: neutral
        - label: Maven 持平上限
          value: 1.7
          detail: 现有公开证据还不能清楚支持今天支付高于最知名女性健康可比公司的价格。
          tone: neutral
        - label: 乐观平台证明
          value: 2.6
          detail: 需要低流失、强 PMPM 经济性，以及成功的邻近场景扩张。
          tone: positive
    claimRefs:
      - CV042
      - CV044
      - CV046
      - CV048
      - CV050
      - CV054
      - CV056
      - CV072
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间很宽，因为公开证据仍无法补齐核心经济性文件。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B-$1.0B
          detail: 扩张或融资不及预期，远程医疗式下行占主导。
          tone: risk
        - label: 基准
          low: 1.3
          mid: 1.6
          high: 1.8
          displayValue: $1.3B-$1.8B
          detail: 孕产主线仍强，但周边产品和经济性还处在早期。
          tone: neutral
        - label: 乐观情景
          low: 2.2
          mid: 2.6
          high: 3
          displayValue: $2.2B-$3.0B
          detail: Pomelo 证明高品质服务能跑出经济性，且扩张已有牵引力。
          tone: positive
        - label: 优先进入区间
          low: 1.1
          mid: 1.4
          high: 1.6
          displayValue: $1.1B-$1.6B
          detail: 这个区间能更好补偿当前披露风险。
          tone: positive
    claimRefs:
      - CV065
      - CV066
      - CV067
      - CV068
      - CV072
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这些公开指标最能影响对 Pomelo 本轮价格的投资判断。
    data:
      items:
        - label: 上一轮融资
          value: $1.7B
          detail: 2026 年 1 月形成的最新私人市场估值标记。
          tone: neutral
        - label: 覆盖人群
          value: 25 million
          detail: 如果变现成立，覆盖人群就是很强的分发面。
          tone: positive
        - label: 分娩占比
          value: ~7%
          detail: 孕产赛道相关性信号。
          tone: positive
        - label: 客户 ROI
          value: 3-5x
          detail: 关键主张，但证据仍主要来自公司自己。
          tone: positive
        - label: Maven 对标
          value: $1.7B
          detail: 公开材料里最清晰的未上市可比上限。
          tone: neutral
        - label: 上市可比区间
          value: 0.56x-6.96x
          detail: 远程医疗、福利、DTC 和工作流可比公司的销售倍数跨度很宽。
          tone: neutral
        - label: 证据缺口
          value: Revenue / GM / NRR private
          detail: 仍是最大的尽调阻塞点。
          tone: risk
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV018
      - CV054
      - CV056
      - CV058
