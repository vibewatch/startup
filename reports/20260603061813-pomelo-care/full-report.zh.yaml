  - id: TR005
    title: 缓释措施和投资逻辑失效标准表
    columns:
      - 风险领域
      - 监测指标
      - 投资逻辑失效触发点
      - 行动含义
      - 尽调要求
    rows:
      - - 远程医疗报销
        - 核心州拒付率、剥离安排变化、平价规则变化
        - Pomelo 某个核心市场出现实质性报销或资格损失，且没有抵消性的定价能力
        - 重新测算毛利率、覆盖策略和州扩张假设
        - 索取核心州收入结构和报销敏感性模型。
      - - 执照 / 服务方模式
        - 按州列示服务方名册、跨州执照协议参与情况、已使用的执照例外
        - 有记录的州级计费或执照失效，并影响活跃会员
        - 在控制措施修复前，暂停评估其全国化规模宣称
        - 索取逐州执照地图和拒赔历史。
      - - 隐私 / 追踪器治理
        - 追踪器清单、BAA 覆盖、事件报告、供应商审计
        - 发现承载 PHI 的认证或预约工作流向非 BAA 营销或分析供应商泄露数据
        - 视为投资逻辑失效，因为信任、法律风险暴露和渠道续约会同时变化
        - 索取认证页面数据流图和最新隐私评估。
      - - 安全控制
        - 渗透测试结果、红队发现、HITRUST 监督结果
        - 重大安全事件，或反复出现严重发现且未及时修复
        - 提高折现率，并在继续前要求提供已遏制的证据
        - 索取当前渗透测试、SOC/HITRUST 监督材料和 IR 预案。
      - - 证据可信度
        - PHTI 发布、支付方侧复跑、外部参考访谈
        - 独立评审实质性削弱 ROI 或结果叙事
        - 重置商业采用假设和买家转化预期
        - 索取完整方法附录和支付方侧复现。
      - - AI / 产品宣称
        - 产品宣称台账、发布说明、法律签批流程
        - AI 营销或产品自主性超出已证实证据，或引发监管询问
        - 在宣称收窄或完成验证前，将扩张叙事视为受损
        - 审查宣称佐证材料包和模型治理政策。
      - - 渠道集中度
        - 头部客户占比、续约日历、按渠道划分的 NRR/GRR
        - 一两个合同主导经济性，且显露续约疲弱
        - 立即把尽调重心从增长测算转到集中度风险
        - 索取前 10 大客户集中度和流失队列数据。
      - - 资本与执行
        - 烧钱倍数、招聘节奏、按新项目划分的利润率、下一轮信号
        - 新项目尚未证明经济性可持续前，先出现过桥融资或估值下调轮
        - 假设估值压缩、扩张放慢；重新审视进入价格
        - 索取 24 个月运营计划、董事会材料和融资情景分析。
