  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 报销、执照与法律结构风险
        blocks:
          - type: paragraph
            body: >-
              Pomelo 的商业模式踩在一套本就碎片化的监管栈上。Medicaid 仍把远程医疗视为一种服务交付方式，而不是独立福利；哪些服务、形式、提供者和报销方式合格，交给各州决定。CCHP 最新 50
              州调查说明了问题：多数州都处理远程医疗报销，但明确的支付平价远未普遍，执照例外也不一致。Pomelo 一边面向 Medicaid
              和商业保险计划销售，一边宣传产后支持覆盖整整一年，并声称覆盖人群很广；因此，只要少数州手册或付款方政策调整，经济模型就会变。


              实体结构也必须每次都跑通。Pomelo Care, Inc. 称自身不提供医疗服务，医疗服务由关联专业公司和 Pomelo Providers
              提供。这是应对企业行医规则的标准做法，但也带来运营义务：跨司法辖区把执照、监督、签约、HIE 同意和计费都管干净。只要某一州规则变化，或提供者覆盖落后于销售覆盖，报销流失和合规风险会先于需求浮现。
