      - number: '3.4'
        title: 切换成本、伙伴议价力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本并不均匀。当供应商控制福利设计、谈判费率、医疗服务者资质认证，或嵌在支付方 / 医疗服务者系统中的工作流数据时，切换成本最高。这有利于 Progyny 的病例费率和计费栈、Maven
              的广泛福利覆盖，以及 Wildflower/Babyscripts 与护理管理、RPM 和计划资源绑定的集成。相比之下，诊所优先玩家能在本地形成真实患者忠诚和强
              NPS，但锁定效应更窄，因为买家仍可把转诊导向别处，或在其他地方复制部分环绕服务。因此，Pomelo 最好的护城河不是通用虚拟护理，而是成为一个负责结果的孕产运营商：有可衡量结果、24/7
              临床团队，以及足够的支付方信任，能一次替换多个点状工具。


              反向证据也重要。Sacra 认为，随着市场平台式虚拟护理被复制、区域专科机构加深本地优势，Maven 面临商品化。Millie 明确排除高风险妊娠，Oula 的公开覆盖仍集中在 New York 和
              Connecticut。McGuireWoods 还指出，孕产健康公司从导航进入直接临床护理时，会继承隐私、执照、公司行医限制、FDA 和报销复杂性。Pomelo 能留下来的持久维度，是有证据背书的孕产
              ROI、支付方 / 雇主渠道匹配，以及全栈责任承担。较弱的维度，是任何只基于应用功能、聊天入口或教育内容的护城河，因为 Wildflower、Babyscripts、雇主和医疗服务集团都可以自己组装这些层。
