      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              最强公开采用信号，是已披露覆盖范围的阶跃变化：2023 年 2 million 人，2024 年超过 3 million，到 2026 年初达到 25
              million。独立媒体重复了最新规模数字，以及公司称其现在触达近 7% 美国出生的说法，因此增长方向可信，哪怕分子仍由公司提供。具名证明分布不那么均匀。Koch 是唯一一个拥有新鲜 2026
              年案例研究、量化临床结果、入组规模和交叉销售到导乐与中年护理证据的账户。相比之下，Penn Medicine、Mount Sinai Health System、Elevance 关联计划、Healthy
              Blue Nebraska 和 Nebraska Total Care 只出现在更早期发布中；这些引用验证了市场准入，但不能证明当前部署深度或结果。净效果是，Pomelo
              似乎已经取得真实企业渗透，但可见证明栈仍不对称：一个详细雇主案例研究、一组不大的旧具名账户引用，以及规模大得多但未具名的覆盖人群。
