  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Pomelo 通过了质量和需求筛选，但还没有通过价格和披露筛选。
    data:
      nodes:
        - id: A
          label: 结果支撑的规模
          detail: 25M+ 覆盖人群、约 7% 出生份额和客户证明结果支撑其相关性。
          tone: positive
        - id: B
          label: 女性健康行业顺风
          detail: 到 2026 年，福利设计正向生育、孕产和更年期支持扩展。
          tone: positive
        - id: C
          label: 与 Maven 持平的价格
          detail: Pomelo 估值已经等于 Maven 最近披露轮次。
          tone: neutral
        - id: D
          label: 经济性文件缺失
          detail: 收入、毛利率、留存、PMPM 和股权结构表数据仍未公开。
          tone: risk
        - id: E
          label: 选择性资本市场
          detail: 数字健康融资集中，退出渠道仍窄。
          tone: risk
        - id: F
          label: 继续研究 / 偏高
          detail: 公司很强，但按当前估值标记，还不到可以直接买入的程度。
          tone: risk
      edges:
        - from: A
          to: B
          label: 支撑
        - from: B
          to: C
          label: 值得关注
        - from: C
          to: D
          label: 要求证明
        - from: D
          to: E
          label: 抬高融资风险
        - from: E
          to: F
          label: 决定立场
