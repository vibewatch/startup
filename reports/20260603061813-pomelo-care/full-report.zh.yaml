      - - Maven Clinic
        - 2024 私募轮
        - $125M Series F 后估值 $1.7B
        - 最接近的规模化女性与家庭健康平台可比对象
        - 地理和客户披露更广，使精确映射并不完美
      - - Kindbody
        - 2023 私募轮 / 2025-2026 压力信号
        - 最近确认估值 $1.8B；后续媒体报道显示资本压力和可能的减记
        - 女性健康估值标记如何重置的有用反向先例
        - 偏诊所的生育模式不同于 Pomelo 虚拟、支付方优先的模式
      - - Oula
        - 2024 私募轮
        - $28M Series B
        - 对判断混合式孕产护理需求和结果定位有帮助的可比对象
        - 公司小得多，足迹集中在线下本地诊所，且未披露独角兽级估值标记
      - - Millie
        - 2025 年私募融资
        - $12M A 轮
        - 说明资本仍会投向有结果主张的孕产健康挑战者
        - 早期诊所运营商，不是后期全国性平台
      - - Progyny
        - 上市女性健康福利可比公司
        - 1.80x 销售额 / 市值约 $2.05B
        - 最接近的上市福利导向女性健康锚点
        - 生育福利管理与虚拟孕产护理不是同一种模式
      - - Hims & Hers
        - 上市 DTC 数字健康可比公司
        - 2.97x 销售额 / 市值约 $6.43B
        - 说明规模化、披露充分的消费者健康平台可拿到溢价
        - DTC 健康服务和药房经济性，与支付方驱动的孕产护理差异很大
      - - Doximity
        - 上市临床医生工作流可比公司
        - 6.96x 销售额 / 市值约 $4.12B
        - 盈利、高毛利医疗软件敞口可拿到的高端倍数
        - 临床医生工作流软件比护理交付轻资产得多
      - - Teladoc
        - 上市虚拟护理可比公司
        - 0.56x 销售额 / 市值约 $1.43B
        - 可作为远程医疗下限参照
        - 广覆盖的虚拟护理规模没有转化为公开市场溢价倍数
      - - Amwell
        - 上市虚拟护理可比公司
        - 0.62x 销售额 / 市值约 $151M
        - 可作为承压远程医疗底部参照
        - 公司处于扭转阶段，作为下行锚点严苛但有信息量
    notes: 本表完整覆盖本章使用的可比集合：一行直接标的、四个私有女性健康或孕产参照，以及五个上市数字健康映射。
