      - number: '8.2'
        title: 融资背景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              可比公司集合比公司自述更能锁住 Pomelo 当前估值。Maven 是最清晰的私有市场可比，因为它同样是女性与家庭健康平台，而且最近一次披露估值也在 $1.7 billion 这一水平。这一点重要，因为
              Maven 还披露了更广的客户和地理规模。Kindbody 是最有用的反向私有市场可比：它在 2023 年估值为 $1.8
              billion，但后续报道描述了诊所关闭、融资路径停滞，以及公司寻求新资本时可能出现的估值下调。Oula 和 Millie 等规模更小的孕产健康公司证明了品类需求，却不能验证独角兽定价。


              公开市场可比公司强化了同一条信息。Progyny 是最接近的女性健康福利锚点，交易约为 1.8x 销售额；Teladoc 和 Amwell 则说明，缺少溢价经济性的虚拟护理平台会被公开市场严厉定价。Hims 和
              Doximity 表明更高公开倍数并非没有，但只属于披露更好，且具备强消费者变现或高毛利工作流特征的模式。合在一起，公开记录并不能证明 Pomelo
              被高估，却显示：在没有经审计收入质量和留存证据的情况下，公司已经定价在可辩护区间的上沿。
