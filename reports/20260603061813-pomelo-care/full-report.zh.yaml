      - number: '6.4'
        title: 集中度风险、采购摩擦与反向证据
        blocks:
          - type: paragraph
            body: >-
              主要客户风险不是 Pomelo 有没有买家，而是这些买家有多集中、能持续多久。相对于 25 million
              覆盖人数标题，公开具名账户证据稀疏，因此外部投资人无法判断业务是分散在数十个中型计划和雇主中，还是由少数大型合同支撑。公开采购证据也显示门槛很高。Koch 描述了一个数据驱动的供应商评审流程，重点看孕产成本缺口和
              ROI；PHTI 则指出，雇主、商业计划和 Medicaid 项目正在主动寻找有临床有效性和预算影响证明的解决方案。这对 Pomelo
              有利，因为公司有基于理赔的研究；但也意味着销售周期可能依赖昂贵证明和利益相关方对齐。反向证据很轻，但不是零。BBB 显示 Pomelo
              未获认证，并有两条负面评价，一条指称服务像骗局，另一条抱怨向合同导乐付款缓慢。这些是小样本信号，不是企业流失证明，但它们是最清楚的公开警告：顶线增长故事之下，可能存在运营摩擦。
