      - number: '5.3'
        title: 平台、数据与医疗服务者集成架构
        blocks:
          - type: paragraph
            body: >-
              Pomelo 披露的架构信息多于典型护理导航创业公司，但仍远少于企业软件供应商。最具体的产品表面是 Grove，即软件工程师 Julia Dai 描述的临床人员指挥中心。Grove
              是临床人员与患者沟通、内部协同并执行循证护理的地方。其下是一层数据层，公开来源称该层摄取理赔、实验室、药房、EHR、HIE 和远程监测数据，用于发现正在出现的风险。官方 2026
              年材料又补上逻辑层：循证路径、预测分析、患者洞察和建议下一步动作，共同构成公司的临床人员副驾驶叙事。面向医疗服务者的集成比完全嵌入 EHR 的软件更轻，但在运营上有意义。Pomelo 称诊所可通过 EHR
              转诊，接收回传文档，并避免定制 IT 工作；Fidelis 的医疗服务者公告更进一步，描述了双向转诊、EHR 记录和医疗服务者之间通话。由此可见，Pomelo 的架构以工作流为中心，而不是 API
              主导：它优化的是跨临床人员和合作诊所编排风险发现与协同响应，而不是暴露一个广泛外部开发者平台。这对今天的护理交付是优势，但也意味着公开记录仍没有给出具名 EHR 连接器、API
              文档或完整技术承销所需的基础设施细节。
