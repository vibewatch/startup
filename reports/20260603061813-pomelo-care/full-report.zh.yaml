  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Pomelo 面对的不是一个单一巨头。竞争集合可分为三类。第一类是规模化女性健康福利平台，以 Maven Clinic 和 Progyny
              为代表，它们已经进入雇主和健康计划预算，并可在生育、育儿和更年期旁边加上孕产支持。第二类是 Oula、Millie、Quilted 等混合诊所运营商，以及强调公平性的导乐网络
              Mae；它们在患者体验、保险报销和低干预孕产路径上竞争，但地理覆盖仍更窄。第三类是 Wildflower Health 和 Babyscripts
              等赋能层，帮助支付方和医疗服务集团自行组装导航、远程监测、倡导和计费栈，而不是把责任外包给全栈虚拟诊所。


              对 Pomelo 来说，这意味着最难的问题是渠道控制，而不是功能对齐。Maven 和 Progyny 可以把孕产打包进更广泛的福利关系；Wildflower 和 Babyscripts 让健康计划和 OB
              集团把成员关系留在内部；诊所运营商则在部分都会区给出可信的“从传统 OB 切换”故事。默认替代品仍是碎片化的 OB
              主导护理加支付方案例管理，但对全国性买家来说，更有意义的替代品是模块化内部自建：不购买新的品牌诊所，而是组合 RPM、护理倡导、导乐支持和计费工作流。
