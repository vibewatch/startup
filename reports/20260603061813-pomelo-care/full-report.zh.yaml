chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围与护理模式
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 将自己定位为一家总部位于 New York、服务女性和儿童的医疗公司；公开材料持续把公司历史追溯到 2021 年。公司从孕产和新生儿护理切入，但到 2026
              年，产品面已经更宽：生育与孕前支持、产前与产后护理、儿科和 NICU 支持、中年护理都出现在当前材料里。它的运营主张不只是提供远程医疗入口。Pomelo
              称，其模式把预测分析、循证护理路径和多专科临床团队结合起来，团队可通过文字、电话、视频和应用随时响应，从而更早识别风险，并在门诊之间持续管理。这个定位很关键，因为 Pomelo 明确表示，它补充而不是取代本地
              OB-GYN、助产士和其他线下医疗服务者。另一个尽调细节来自网站页脚披露的法律结构：临床护理通过 Pomelo, P.C. 或关联专业公司交付，Pomelo Care, Inc.
              则运营更广泛的组织。因此，公开披露在覆盖范围和护理设计上最充分，但在员工数、收入等传统经营指标上更薄。
