      - number: '3.2'
        title: 福利平台既有玩家是渠道威胁
        blocks:
          - type: paragraph
            body: >-
              Maven 和 Progyny 是最重要的规模化威胁，因为两者已经拥有 Pomelo 所依赖的企业购买动线。Maven 称其支持 28 million 人群，服务 2,300+ 家雇主，覆盖 175+
              个国家，并提供 30 多个专科的 24/7 访问。其当前模式比孕产更宽：生育、儿科、更年期、激素护理、GLP-1 护理和消费者自费产品都在同一平台上。Maven 的定价页面和 Sacra
              档案显示，它采用基于注册的合约，并明确平台费和按注册成员计价的经济模型，这让买家能做可预测预算，也让 Maven 可以先以生育或全球福利落地，再扩展到孕产。


              Progyny 从福利管理一侧切入市场。它支持 600+ 个客户和 7.2 million 覆盖人群，接入 50+ 个健康计划，并强调预先谈判的病例费率、医疗服务者计费管理和高留存。它的孕期和产后项目没有
              Pomelo 那么全栈临床化，但深嵌在雇主和支付方采购中。这个组合很关键：Pomelo 可能更原生于孕产，但已经信任 Progyny 或 Maven
              承接更广泛女性健康支出的买家，扩展到其孕产产品的摩擦更低，低于采用一个单独的孕产专用供应商。
