      - number: '5.4'
        title: 信任、隐私、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              Pomelo 的信任姿态可信，但披露仍有选择性。积极面是，公司在 2025 年公开宣布 HITRUST i1 认证，发布详细的一般隐私政策，维护单独的 HIPAA 隐私实践通知，并表示其数字资产正通过 Level
              Access 朝 WCAG 2.2 A/AA 测试。隐私材料还露出许多虚拟护理供应商不会披露的运营实质：Pomelo 的医疗服务者实体授权使用 Pomelo Care 网页应用，参与安全
              HIE，并在网站、应用和虚拟诊所中使用托管、分析、会话回放和基于 SDK 的数字工具。面向患者的部署成熟度，也可从已上线的 iOS 和 Android 应用看出：它们有近期更新、强评分、Google Play
              上的传输加密数据，以及活跃支持联系方式。但公开可靠性披露明显偏薄。审阅来源中没有发现公开状态页、正常运行时间承诺、事故历史信息流、具名灾备姿态或云厂商披露。同样，除 HITRUST 外，审阅来源没有披露 SOC
              2、ISO 27001、渗透测试摘要或其他企业级保障材料。结果是：信任画像足以支撑商业叙事和初步尽调，但还不够透明，无法在没有直接尽调访问的情况下承销平台韧性。
