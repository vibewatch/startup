      - number: '4.4'
        title: 资本充足性、融资依赖与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月融资显然提升了 Pomelo 的战略灵活性：公司以 $1.7 billion 估值融资 $92 million，媒体报道称累计融资约 $171
              million。公开信号显示，这些资本正投入更宽的平台——中年护理、儿科、导乐网络、AI
              赋能工具和广泛职能招聘——而不是支撑一个静态孕产产品。但资本充足性本身仍不透明。没有公开收入数字，没有披露现金余额，没有债务计划，没有月度烧钱速度，没有现金跑道披露，也没有公开客户集中度数据。因此，单靠公开证据无法量化融资依赖。PHTI
              决定独立评估虚拟孕产护理经济性，也强化了同一个结论：Pomelo
              的商业故事有吸引力，但第三方可泛化性和长期利润率持久性仍是开放尽调项。因此，正确承销姿态应是对收入质量谨慎乐观，但在公司拿出私有指标前，对资本强度和后续融资假设保持保守。
