      - number: '5.5'
        title: 差异化、路线图与开放缺口
        blocks:
          - type: paragraph
            body: >-
              Pomelo
              最清晰的产品差异化，不是消费者健康品牌，也不是通用远程医疗前门，而是一个临床整合的运营模式：把自雇护理团队、预测性风险浮现和基于理赔结果的责任承担结合起来。独立报道反复把这一做法与由参与度指标驱动的数字健康供应商作对比；MedCity
              也明确将 Pomelo 与 Maven Clinic、Midi Health 等女性健康替代方案放在一起，同时强调 Pomelo
              覆盖孕期、儿科和更年期工作流的协同医疗团队。话虽如此，路线图可见度仍是方向性而非颗粒化。公开材料把战略方向说得很清楚——扩展女性和儿童覆盖、扩大中年护理、继续向支付方和雇主铺开，以及为临床人员提供更多 AI
              原生工具——但没有发布带日期的模块路线图、连接器列表或各业务线采用指标。产品安全、患者体验工程和中年临床岗位招聘显示公司确实在持续投入，但招聘只是代理信号，不是发布说明。对投资人来说，正确解读是：Pomelo
              拥有差异化护理平台，在所属品类中临床证明异常强，但其公开技术记录仍落后于企业软件尽调通常要求的水平，尤其是在可靠性、集成深度、儿科成熟度和产品路线图具体性上。
