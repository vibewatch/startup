  - id: FO001
    title: Pomelo 从孕产初创公司走向更广平台的里程碑弧线
    type: timeline
    summary: 公开里程碑显示，Pomelo 快速从早期孕产基础设施，转向有研究和企业客户证据背书的更广女性与儿童平台。
    data:
      items:
        - date: '2021'
          label: 成立
          details: Marta Bralic Kerns 创办 Pomelo Care，切入孕产健康风险管理和基于价值的护理。
          tone: positive
          claimRefs:
            - CO002
            - CO005
        - date: 2023-06
