      - number: '4.2'
        title: 与结果挂钩的收入代理指标和销售效率信号
        blocks:
          - type: paragraph
            body: >-
              Pomelo 用异常具体的临床和经济结果，弥补公开定价缺失。最强公开锚点是 2025 年 9 月发布的信息：相对于 Pomelo 费用，总护理成本下降 8.8%，ROI 达 3.9:1；2026 年 3
              月发布进一步延展了这个叙事，覆盖六个计划近 45,000 次分娩，并显示早产和 NICU 住院时长存在剂量反应式改善。商业规模代理指标同样重要：公司报告 34 个支付方合作伙伴、超过 25 million
              覆盖人群、近 7% 的美国出生，以及 Koch 旗舰部署，后者已纳入超过 3,000 名员工和家庭成员。Koch 随后扩展到导乐和中年护理，也是有用的留存信号。不过，公开市场进入图景仍不完整。Pomelo
              没有披露 CAC、回本周期、NRR、ACV 或支付方与雇主的组合，Koch 也明确表示不会公开投资水平。结果是：价值创造证据强，但变现效率证据弱。
