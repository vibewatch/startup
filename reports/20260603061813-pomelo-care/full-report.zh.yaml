  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资或惩罚性结构
        - 下一轮新股融资估值低于 $1.7B，或带有重度优先保护
        - 削弱品类赢家定价叙事
        - 暂停，或按显著更低估值重新承销
      - - 留存 / 续约数据偏弱
        - 队列留存或雇主 / 支付方续约指标撑不起持久收入质量
        - 打断溢价倍数所需的可重复性
        - 在旧价格下从继续研究转为回避
      - - 邻近业务牵引不足
        - 中年期、儿科或更广女性健康产品未显示可信商业采用
        - 拿掉乐观情景背后的主要扩张引擎
        - 按更接近纯孕产结果供应商的方式给 Pomelo 估值
      - - 结果证据走弱
        - 独立验证无法在规模上复现 ROI 或临床主张
        - 伤及核心质量护城河
        - 下调估值区间，并要求重新尽调
      - - 退出市场持续关闭
        - 私募和公开数字健康窗口仍然挑剔，而 Pomelo 仍缺少经审计披露
        - 拉长持有期风险和再融资风险
        - 坚持价格折扣或投资者保护
    notes: 这些触发因素设计成可监控，并直接映射到投资逻辑传导，而不是泛泛的经营噪音。
    claimRefs:
      - CV040
      - CV057
      - CV058
      - CV074
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计经济数据
        - 按支付方 / 雇主分部拆分的收入、毛利率、PMPM、抽成率和队列留存
        - 这是判断 Pomelo 是否配得上任何溢价倍数的核心材料
        - 财务团队及审计材料包
      - - 客户集中度
        - 头部支付方 / 雇主集中度和续约时间表
        - 没有集中度背景的覆盖人群，可能高估持久收入质量
        - 收入分析与账户级管线审查
      - - 股权结构表与优先权
        - 清算优先权、附函、参与权，以及任何结构化投资者保护
        - 名义估值看不出下行保护或普通股结果
        - 公司法律顾问与融资文件
      - - 临床验证
        - 结果主张背后的方法论，以及公司主导出版物和案例研究之外的任何独立复现
        - 估值逻辑高度依赖结果可信度
        - 医学事务与第三方研究审查
      - - 关联专业公司结构
        - Pomelo Care, Inc. 与关联专业公司之间的经济分配和合规职责
        - 关联专业公司结构影响利润捕获、监管敞口和可扩展性
        - 法律与报销尽调
      - - 邻近业务经济性
        - 中年期 / 儿科扩张队列的商业牵引、CAC 和留存
        - 乐观情景不只取决于孕产业务
        - 产品、增长和支付方合作伙伴工作流
    notes: 这些尽调问题，是把 Pomelo 从吸引人的叙事转为可按上一轮或接近上一轮价格承销的投资所需的最低资料室材料。
    claimRefs:
      - CV058
      - CV059
      - CV075
      - CV076
