        blocks:
          - type: paragraph
            body: >-
              Pomelo 已披露的融资历史，是公开记录中最清晰的部分之一。公司在 2023 年完成 $33 million 种子轮和 Series A 组合融资，2024 年完成 $46 million Series
              B，2026 年 1 月又完成由 Stripes 领投、估值 $1.7 billion 的 $92 million Series C。这些披露轮次意味着累计融资至少 $171
              million。投资人名单也显示出连续性，而不是一次性融资：Andreessen Horowitz 和 First Round 早期即出现并多次参与，Stripes
              则在后期扩张阶段加入。利益相关方不止财务投资人。公开材料反复提到 Penn Medicine 和 Penn Fertility、Koch 等大型雇主，以及包括 Medicaid
              关联计划在内的全国性支付方；Forbes 还称 Pomelo 与 UnitedHealthcare、Elevance
              等保险公司合作。话虽如此，公开披露没有进一步给出股权结构表经济条款。收入、ARR、当前员工数和所有权集中度仍未披露，这意味着公开故事更能支撑市场兴趣和分销广度，而不是单位经济或治理深度。
