            body: >-
              对一家私营数字健康公司来说，Pomelo 的公开 ROI 故事异常证据密集。8.8% 护理成本下降、相对费用 3.9:1 ROI、大型多计划理赔数据集，以及 Koch 在可衡量 NICU
              和剖宫产改善后扩大合作，这些都在没有披露价目表的情况下支持收入质量。
            calloutType: strength
