      - number: '2.3'
        title: 买家、支付方与需求信号
        blocks:
          - type: paragraph
            body: >-
              商业买家是机构，但工作流是多边的。健康计划购买，是为了降低覆盖人群中的早产、NICU 和可避免 ER
              成本。自保雇主出于同样的成本原因购买，同时也看重招聘、留任和返岗结果。医疗服务集团在意的是，供应商能否处理就诊间隙的问题、分诊和监测，同时不打断与线下 OB 或 NICU 团队的连续性。州 Medicaid
              机构也重要，因为孕产结果政策越来越奖励连续性、行为健康整合和社区型支持。需求证据很清楚。PHTI 称，健康计划、雇主和 Medicaid 项目正在积极寻找更好的孕产解决方案。Mercer、Business
              Group on Health、KFF、SHRM 和 Aon 都显示，雇主健康福利成本在上升，对供应商价值的审查也在加强。Maven 还指出，超过半数福利负责人现在把高风险妊娠视为成本推高因素。因此，Pomelo
              自己的雇主和支付方页面，加上 Koch 案例研究，都能作为上市路径证据，哪怕它们不是中立的品类规模证明。
