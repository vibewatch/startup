      - number: '8.3'
        title: 情景区间与下行触发点
        blocks:
          - type: paragraph
            body: >-
              公开证据给出的区间很宽，因为缺失的经济性文件仍可能大幅挪动公允价值带。乐观情景只有在几个条件同时成立时才跑得通：Pomelo 证明覆盖人群能转化为强 PMPM
              经济性，续约质量高，并且向中年和儿科扩张是在加深收入，而不是分散公司精力。若能做到，估值可以高于当前轮次。基准情景没有那么兴奋：Pomelo
              仍是一个强孕产资产，但如果相邻产品需要时间成熟，且公开市场可比压力压住上行空间，当前标记大致才算合理。悲观情景并不难想象。Kindbody
              已经显示女性健康估值存在重置风险，公开数字健康退出仍在严厉定价许多虚拟护理资产。


              因此，投资人应把 2026 年 1 月价格视为谈判参考，而不是公允价值事实。下行触发点很具体：降价融资、续约或留存数据弱、无法在中年或儿科证明商业牵引力，或出现新证据显示结果 / ROI 故事在 Pomelo
              扩张后站不住。任何一项都会迅速压缩估值带，因为当前标记已经几乎不给失望留下空间。
