  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 类型
      - 论点
      - 何种证据会改变判断
    rows:
      - - 投资逻辑
        - 作为仍年轻的女性健康平台，Pomelo 的孕产结果宣称和客户证明异常强。
        - 结果得到独立复现、留存经过审计，会进一步增强信心。
      - - 投资逻辑
        - 覆盖人群规模以及支付方 / 雇主定位表明，Pomelo 的品类地位不止于小众创业公司。
        - 如果能在这些覆盖人群中持续打入多产品，规模宣称会更有价值。
      - - 投资逻辑
        - 2026 年福利设计趋势支持更多资金流向生育、孕产和更年期项目。
        - 如果 Pomelo 能证明从这些顺风中拿到具体 PMPM，投资逻辑会更强。
      - - 反向逻辑
        - 尽管 Pomelo 在客户广度和经济性上的公开披露少得多，当前估值标记已经追平 Maven。
        - 如果资料室材料能证明收入质量和留存可比，这一担忧会被中和。
      - - 反向逻辑
        - Kindbody 的融资压力和诊所关闭说明，女性健康公司的私募估值标记可能大幅重置。
        - 下一轮融资或老股交易标记若干净地高于当前轮次，会降低重置风险。
      - - 反向逻辑
        - 公开材料强调结果和覆盖人群，却不披露收入、毛利率、NRR 或优先权条款。
        - 经过审计的收入、利润率和股权结构表文件，会把这个案子从“有意思”推进到“可进入投资测算”。
    notes: 这些论点被写成会随尽调和价格变化的投资主张，而不是静态品牌叙事。
