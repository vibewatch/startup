      - number: '5.2'
        title: 护理工作流与临床人员运营模式
        blocks:
          - type: paragraph
            body: >-
              面向用户的工作流很简单，但背后的运营模式临床密度很高。公开患者流程显示，入组从资格检查开始，随后分配专属护理团队，再通过文字、电话、视频和应用提供随时在线支持。医疗服务者和 Fidelis
              材料说明了这在运营上为什么重要：Pomelo 被定位为就诊间隙的附加层，可以吸收分诊、常见问题、社会支持、NICU 转衔支持、营养咨询，以及部分开方或升级任务，同时不取代本地 OB、助产士或儿科医生。这是
              Pomelo 差异化背后的核心设计选择。它不是试图替代既有诊所，而是销售一种就诊间隙工作流，既降低诊所收件箱负担，也增加患者触点。临床团队构成有意做宽——护士、营养师、治疗师、哺乳专家、导乐、OB/GYN
              和儿科负责人——因此服务能在一个运营循环中处理医疗、行为和社会摩擦。来自雇主、合作伙伴和应用端的证据显示，支持质量本身就是产品的一部分：低于五分钟的响应声明、24/7
              访问和强应用商店评分，都说明公司把响应速度当作可部署的产品功能，而不是泛泛的护理管理承诺。
