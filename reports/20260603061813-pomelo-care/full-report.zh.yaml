      - number: '2.2'
        title: 规模测算视角与公开 TAM 冲突的原因
        blocks:
          - type: paragraph
            body: >-
              公开市场报告有方向参考价值，但还不可靠到可以单独作为 Pomelo 的 TAM。Strategic Market Research 估计，美国女性数字健康市场 2024 年约为 $590
              million；Grand View Research 则从 2023 年高得多的 $949.3 million 起步，并预测 2030
              年结果更大。这些估算互相冲突，是因为它们衡量的范围和产品包不同，而不是其中一个必然描述了 Pomelo 真实的近端楔子。更站得住脚的公开测算视角，应从真实孕产分母出发。March of Dimes 报告 2024
              年早产出生 377,204 例，早产率 10.4%，意味着全国活产约 3.63 million。CDC 随后显示，2023 年 NICU 入院占出生的
              9.8%，这凸显出品类价值有多大一部分来自避免高成本并发症，而不是向所有女性销售健康内容。Pomelo 自称已经触达近 7% 的美国出生，这意味着现有规模可观，但价格、组合和附加率披露不足，无法据此计算公开
              SOM。
