  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买家、用户、支付方、地域和用例划分客户
        blocks:
          - type: paragraph
            body: >-
              Pomelo
              的客户地图不寻常，因为买家、支付方、用户和转诊来源并不是同一个实体。公开表面显示四类明确群体：健康计划、雇主、患者和医疗服务者。经济买家是健康计划和自保雇主；覆盖用户是孕产成员、产后父母、婴儿，以及现在进入中年的女性；转诊渠道常常经过
              OB-GYN、护理管理团队和 NICU 员工，而不是直接面向消费者获客循环。这个区别很重要，因为即使公开具名账户语料仍很薄，按覆盖人数计算的采用规模也可能快速上升。地理图景同样分层。历史披露显示，2023 年覆盖
              44 个州，2024 年覆盖 46 个州；当前营销称覆盖全美 50 州的 25 million
              人群。用例扩张也已经从孕产和新生儿支持，拓宽到生育或孕前、儿科后续护理、导乐支持和聚焦更年期的中年护理。实际结果是，一个客户基础看起来比孕产点状解决方案更宽，但访问权和价格移除仍依赖企业赞助。
