      - number: '1.4'
        title: 里程碑、证明点与剩余举证责任
        blocks:
          - type: paragraph
            body: >-
              对一家仍未上市的医疗创业公司来说，Pomelo 在 2025 至 2026 年的里程碑节奏异常密集。公司补强高管层，宣布 HITRUST 认证，加入 ARPA-H Investor Catalyst Hub
              spoke network，获得一项有辨识度的 New York 创始人奖项，并在完成 Series C 之前发布多份研究和客户证明材料。其研究叙事强于典型数字医疗推介，因为 Pomelo
              反复使用基于理赔的结果，并列出 Penn Medicine、Penn LDI、Koch 等具名合作者，而不是只依赖应用参与度或软性满意度。即便如此，本次审阅的公开语料仍留下真实尽调工作。PHTI
              的市场评估清楚说明，虚拟孕产护理供应商正在接受临床有效性和预算影响的检验；Pomelo 自己 2026 年 3
              月的研究发布也等于承认，这个品类必须跨过更高的证据门槛。公开披露同样没有给出当前员工数、收入、ARR、完整董事会构成，或公司特定反向档案。结果是：公司外部动能强、证据质量高于平均，但投资人在承销估值和持久性时，仍面对有意义的披露缺口。
