  rows:
  - - Pomelo Care
    - Jan. 2026 private round
    - $1.7B valuation after $92M Series C
    - Direct subject company with fresh price discovery and strong clinical-outcomes narrative
    - No public revenue, margin, retention, or preference-stack disclosure
  - - Maven Clinic
    - 2024 private round
    - $1.7B valuation after $125M Series F
    - Closest scaled women’s and family health platform comparator
    - Broader geographic and client disclosure makes exact read-through imperfect
  - - Kindbody
    - 2023 private round / 2025-2026 stress signal
    - $1.8B last confirmed valuation; later press suggests capital stress and possible markdown
    - Useful adverse precedent for how women’s health marks can reset
    - Clinic-heavy fertility model differs from Pomelo’s virtual payer-first model
  - - Oula
    - 2024 private round
    - $28M Series B
    - Helpful maternal-care comp for hybrid care demand and outcomes positioning
    - Much smaller company with local-clinic footprint and no disclosed unicorn-scale mark
  - - Millie
    - 2025 private round
    - $12M Series A
    - Shows capital still reaches maternal-health challengers with outcomes claims
    - Early-stage clinic operator, not a late-stage national platform
  - - Progyny
    - Public women’s-health benefits comp
    - 1.80x sales / ~$2.05B market cap
    - Closest public benefits-oriented women’s health anchor
    - Fertility-benefits administration is not the same model as virtual maternity care
  - - Hims & Hers
    - Public DTC digital health comp
    - 2.97x sales / ~$6.43B market cap
    - Shows premium available for scaled, disclosed, consumer health platforms
    - DTC wellness and pharmacy economics differ materially from payer-led maternity care
  - - Doximity
    - Public clinician workflow comp
    - 6.96x sales / ~$4.12B market cap
    - Upper-end multiple for profitable, high-margin healthcare software exposure
    - Clinician workflow software is much more asset-light than care delivery
  - - Teladoc
    - Public virtual care comp
    - 0.56x sales / ~$1.43B market cap
    - Useful lower-bound telehealth read-through
    - Broad virtual care scale did not translate into premium public multiples
  - - Amwell
    - Public virtual care comp
    - 0.62x sales / ~$151M market cap
    - Useful distressed telehealth floor
    - Turnaround profile makes it a harsh but informative downside anchor
