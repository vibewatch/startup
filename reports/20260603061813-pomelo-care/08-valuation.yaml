- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Type
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - Pomelo has unusually strong maternity outcomes claims and customer proof for a still-young women’s health platform.
    - Independent replication of outcomes and audited retention would strengthen conviction further.
  - - Thesis
    - Covered-lives scale and payer / employer positioning suggest category relevance beyond a niche startup footprint.
    - Sustained multi-product penetration across those covered lives would make the scale claim more valuable.
  - - Thesis
    - Benefit-design trends in 2026 support more spending on fertility, maternal, and menopause programs.
    - The thesis improves if Pomelo shows concrete PMPM capture from those tailwinds.
  - - Anti-Thesis
    - The current mark already matches Maven despite Pomelo having much less public disclosure on customer breadth and economics.
    - A data-room pack proving comparable revenue quality and retention would neutralize this concern.
  - - Anti-Thesis
    - Women’s health private marks can reset sharply, as Kindbody’s funding stress and clinic closures demonstrate.
    - A clean next financing or secondary mark above the current round would reduce reset risk.
  - - Anti-Thesis
    - Public materials emphasize outcomes and lives covered, but not revenue, gross margin, NRR, or preference terms.
    - Audited revenue, margin, and cap-table files would move the case from interesting to underwritable.
  notes: Arguments are framed as investment claims that can move with diligence and price, not as static brand narratives.
