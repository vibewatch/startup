- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round or punitive structure
    - Next primary capital is raised below $1.7B or with heavy preference protection
    - Undercuts the category-winner pricing narrative
    - Pause or re-underwrite materially lower
  - - Weak retention / renewal data
    - Cohort retention or employer / payer renewal metrics fail to support durable revenue quality
    - Breaks the repeatability needed for a premium multiple
    - Move from research-more to avoid at the old price
  - - Adjacency traction misses
    - Midlife, pediatrics, or broader women’s health products fail to show credible commercial adoption
    - Removes the main expansion engine behind the bull case
    - Value Pomelo closer to a maternity-only outcome vendor
  - - Outcome evidence weakens
    - Independent validation fails to reproduce the ROI or clinical claims at scale
    - Damages the core quality moat
    - Cut valuation range and require fresh diligence
  - - Exit market stays shut
    - Private and public digital health windows remain selective while Pomelo still lacks audited disclosure
    - Extends holding-period risk and refinancing risk
    - Insist on price discount or investor protections
  notes: These triggers are designed to be monitorable and to map directly to thesis transmission rather than generic operating noise.
  claimRefs:
  - CV040
  - CV057
  - CV058
  - CV074
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited economics
    - Revenue, gross margin, PMPM, take rate, and cohort retention by payer / employer segment
    - This is the main file required to decide whether Pomelo deserves a premium multiple at all
    - Finance team plus auditor pack
  - - Customer concentration
    - Top payer / employer concentration and renewal schedules
    - Covered lives without concentration context can overstate durable revenue quality
    - Revenue analytics and account-level pipeline review
  - - Cap table and preferences
    - Liquidation preferences, side letters, participation rights, and any structured investor protections
    - Headline valuation does not reveal downside protection or common-equity outcomes
    - Company counsel and financing documents
  - - Clinical validation
    - Methodology behind outcomes claims and any independent replication beyond company-led publications and case studies
    - The valuation thesis leans heavily on outcomes credibility
    - Medical affairs and third-party research review
  - - Affiliated-PC structure
    - Economics split and compliance responsibilities between Pomelo Care, Inc. and affiliated professional corporations
    - This affects margin capture, regulatory exposure, and scalability
    - Legal and reimbursement diligence
  - - Adjacency economics
    - Commercial traction, CAC, and retention for midlife / pediatric expansion cohorts
    - The bull case depends on more than maternity alone
    - Product, growth, and payer-partner workstream
  notes: These asks are the minimum data-room set required to convert Pomelo from attractive narrative to underwritable investment at or near the last round.
