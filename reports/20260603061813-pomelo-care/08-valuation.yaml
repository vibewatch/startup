    - Pomelo proves strong PMPM economics, low churn, credible cross-sell into midlife / pediatrics, and continued outcomes leadership.
    - $2.2B-$3.0B
    - 1.3x-1.8x before dilution and time value
    - Expansion may add complexity before it adds margin.
    - Requires audited economics plus clear traction in adjacent products.
  - - Base
    - Maternity leadership holds, but adjacent products remain early and economics are good rather than elite.
    - $1.3B-$1.8B
    - 0.8x-1.1x
    - Public comp pressure keeps upside capped.
    - Most consistent with the current public record.
  - - Bear
    - Expansion stalls, financing conditions tighten, or new evidence weakens the outcomes / ROI narrative.
    - $0.6B-$1.0B
    - 0.4x-0.6x
    - A down-round or reset could cascade into hiring and go-to-market pressure.
    - Becomes likely if diligence cannot clear economics or retention.
  notes: These are scenario-based underwriting ranges, not a DCF; wide bands are intentional because Pomelo does not publicly disclose core financial metrics.
