  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-economics
    missingEvidence: Audited revenue, gross margin, PMPM pricing, retention, and customer concentration by payer / employer cohort.
    whyItMatters: These are the core inputs required to decide whether Pomelo deserves a premium platform multiple rather than a telehealth or benefits-service multiple.
    diligencePath: Request the finance pack used for the January 2026 round, including board materials and cohort economics tables.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV015
    - QV017
    - QV022
    - QV026
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, participation rights, side letters, and any structured protections from the latest round.
    whyItMatters: Headline valuation alone does not reveal common-equity downside or whether the next investor is inheriting a heavy preference overhang.
    diligencePath: Review financing documents and a counsel memo that maps the full preference stack.
    relatedQuestionRefs:
    - QV022
    - QV026
    - QV030
  - type: missing-source
    severity: material
    topic: independent-outcomes-validation
    missingEvidence: Independent replication of Pomelo’s outcomes and ROI claims across payer and employer cohorts beyond company-led materials and customer proof.
    whyItMatters: The thesis leans heavily on outcomes superiority; if the evidence weakens, the premium narrative weakens with it.
    diligencePath: Ask for peer-reviewed studies, third-party actuarial analyses, and the full methodology behind reported cohort improvements.
    relatedQuestionRefs:
    - QV003
    - QV025
    - QV027
  - type: private-evidence-only
    severity: material
    topic: affiliated-pc-structure
    missingEvidence: The economics split, reimbursement exposure, and compliance responsibilities between Pomelo Care, Inc. and its affiliated professional corporations.
    whyItMatters: This structure can affect gross margin, regulatory risk, and how scalable the model really is as Pomelo expands beyond maternity.
    diligencePath: Obtain a legal-entity map, intercompany agreements, and reimbursement-policy summary from counsel and finance.
    relatedQuestionRefs:
    - QV027
