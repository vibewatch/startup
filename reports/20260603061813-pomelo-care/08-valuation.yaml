- id: scenario-range-and-downside-triggers
  title: Scenario range and downside triggers
  body: 'The public-evidence range is wide because the missing economics file can still move the fair-value band materially. The bull case works only if Pomelo proves that covered lives convert into strong PMPM economics, that renewal quality is high, and that expansion into midlife and pediatrics deepens revenue rather than distracting the company. Under that outcome, valuation can move above the current round. The base case is much less exciting: Pomelo remains a strong maternity asset, but the current mark ends up roughly fair only if adjacent products take time to mature and public comp pressure keeps upside capped. The bear case is not hard to imagine. Women’s health valuations have already shown reset risk through Kindbody, and public digital health exits still price many virtual-care assets harshly.


    That is why investors should treat the January 2026 price as a negotiation reference rather than a fair-value fact. The downside triggers are concrete: a down-round, weak renewal or retention data, failure to show commercial traction in midlife or pediatrics, or new evidence that the outcomes / ROI story does not hold as Pomelo scales. Any of those events would compress the valuation band quickly because the current mark already leaves little room for disappointment.'
