- id: financing-context-and-comparable-set
  title: Financing context and comparable set
  body: 'The comparable set bounds Pomelo’s current mark more tightly than the company’s own narrative does. Maven is the clearest private comp because it is also a women’s and family health platform, and its last reported valuation is the same $1.7 billion level. That matters because Maven also discloses broader client and geographic scale. Kindbody is the most useful adverse private comp: it was valued at $1.8 billion in 2023, but later reporting describes clinic closures, a stalled fundraising path, and a possible markdown while the company sought new capital. Smaller maternal-health players like Oula and Millie confirm demand for the category but do not validate unicorn pricing.


    The public comp set reinforces the same message. Progyny offers the closest women’s-health benefits anchor at about 1.8x sales, while Teladoc and Amwell show how harsh public markets can be toward virtual-care platforms that lack premium economics. Hims and Doximity show that higher public multiples are available, but only for models with better disclosure and either strong consumer monetization or high-margin workflow characteristics. Taken together, the public record does not prove Pomelo is overvalued, but it does show that the company is already priced at the upper end of what can be defended without audited revenue quality and retention evidence.'
