- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Identity verification is a large, growing category (~$14-18B, double-digit CAGR) with new regulatory tailwinds
      in Brazil
    - Market growth does not guarantee Unico captures a proportional share as global incumbents and Big Tech also
      expand
    - Show sustained share gains against Jumio, Onfido, Veriff, and AU10TIX in disclosed win-rate data
  - - Product
    - 1.2B+ claimed authentications plus newly added OwnID passkey capability broadens the addressable use cases
    - No independent audit of false-accept/false-reject rates or anti-spoofing performance exists to verify the
      moat
    - Publish or commission independent liveness/PAD certification results
  - - Customers
    - Deep, defensible distribution through Brazilian banks and fintechs, reinforced by new Pix biometric mandates
    - The Serasa episode shows a single reseller/bank channel can carry outsized, hard-to-monitor exposure
    - Disclose customer/channel concentration metrics and reseller-monitoring controls
  - - Financing
    - Reputable investor syndicate (Goldman Sachs, General Atlantic, SoftBank) backs continued scaling
    - No priced financing event since April 2022 means the growth story has not yet been tested against a new valuation
    - Announce or confirm a new primary round, secondary transaction, or 409A mark
  - - Valuation
    - A new round near or above the Incode-style ~$3B reference could look justified given growth and diversification
    - The stale $2.6B mark could just as easily reset toward the Onfido-style ~$163M outcome if litigation or model
      risk crystallizes
    - Price discipline should track the eventual financing event, not the still-repeated 2022 figure
  notes: The anti-thesis centers on price-discovery staleness and unresolved litigation risk rather than a rejection
    of Unico's underlying growth story.
