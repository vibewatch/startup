company:
  name: Unico
chapter:
  number: 8
  title: Valuation
  summary: Unico's last confirmed priced valuation of $2.6 billion traces to its April 2022 Series D, and no newer
    financing event, secondary transaction, or fair-value mark is publicly available to confirm that figure still
    holds in 2026 despite visible growth, a new US headquarters, and three acquisitions since. The recommendation
    is track, with medium confidence, high risk, and a stretched valuation stance pending resolution of the Serasa
    Experian litigation and a fresh pricing event.
sections:
- id: thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'Unico''s investment thesis rests on four pillars: a large, fast-growing identity-verification market (roughly
    $14-18 billion in 2026 with double-digit CAGR); a broadening product line following the September 2025 OwnID
    acquisition, which adds passwordless authentication on top of Unico''s core biometric verification; deep distribution
    through Brazilian banks and fintechs, now reinforced by new Central Bank Pix biometric mandates and the Digital
    ECA age-verification law; and a credible investor syndicate spanning Goldman Sachs, General Atlantic, and SoftBank.
    Company-reported growth in 2026 -- 84% year-over-year transaction-volume growth and 130% international revenue
    growth -- supports the narrative that Unico is scaling beyond its Brazilian base. The anti-thesis challenges
    each pillar on evidentiary grounds rather than rejecting the underlying business. Independent strategic analysis
    frames Brazil concentration as a ''significant'' risk that diversification must resolve. An active, judicially-sealed
    lawsuit against Serasa Experian -- alleging roughly 1.4 million diverted biometric queries and potential exposure
    of up to 22 million Brazilians'' data -- is unresolved and reveals a real channel-monitoring gap regardless
    of legal fault. Most importantly for this chapter, Unico''s last confirmed priced financing event remains the
    $100 million Series D from April 2022, which is also the origin of the ~$2.6 billion valuation figure still
    being repeated in 2025-2026 coverage; no newer round, secondary transaction, or fair-value mark is publicly
    available to confirm that figure still reflects current reality.'
