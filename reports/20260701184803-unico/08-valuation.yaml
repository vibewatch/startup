  title: The real debate is not whether Unico was worth $2.6B in 2022
  body: The debate is whether the public evidence in 2026 supports paying anywhere near that same mark today, given
    four years of unrefreshed pricing, an unresolved lawsuit, and no independent proof that the technology moat
    has kept pace with the fraud threats Unico itself describes.
  claimRefs:
  - CV009
  - CV014
  - CV019
- calloutType: risk
  title: An unresolved lawsuit is a live valuation input, not a footnote
  body: The Serasa Experian litigation is under judicial secrecy and alleges roughly 1.4 million diverted biometric
    queries; its resolution will materially affect both regulatory risk and any future financing terms, and should
    be tracked as a first-order valuation variable.
  claimRefs:
  - CV007
  - CV036
- calloutType: assumption
  title: Sector comparables offer no clean valuation anchor
  body: Identity-verification peers span roughly $163M (Onfido) to $3B (Incode, in talks) with no consistent revenue
    multiple, so Unico's $2.6B figure must be assessed on its own facts rather than benchmarked to a single sector
    norm.
  claimRefs:
  - CV046
  - CV022
  - CV023
- calloutType: recommendation
  title: Anchor the next review on five concrete diligence asks
  body: Confirm the origin of the $2.6B figure, resolve the Serasa litigation status, obtain independent model-performance
    certification, secure audited revenue disclosure, and verify M&A integration metrics before treating this as
    more than a track-rated position.
