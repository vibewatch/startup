- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Serasa litigation resolves adversely
    - A ruling or settlement confirms systemic, undetected biometric-data diversion
    - Undermines confidence in Unico's own channel-monitoring and data-governance controls
    - Re-underwrite the growth thesis and discount for governance risk
  - - ANPD or Central Bank enforcement action
    - A confirmed fine or sanction tied to Unico or a customer's use of its technology
    - Signals the still-forming Brazilian regulatory regime is landing unfavorably
    - Reassess the size and durability of the regulatory-tailwind bull case
  - - Independent model/liveness audit fails or is never produced
    - No certification appears despite repeated public deepfake-risk warnings
    - Suggests the technology moat is not keeping pace with the threat environment Unico itself describes
    - Downgrade confidence in the core product thesis
  - - Financing event prices flat or down
    - A new round, secondary sale, or 409A mark comes in at or below the 2022 $2.6B figure
    - Confirms the valuation had been stale and stretched
    - Re-rate valuation stance from stretched toward fair or expensive-in-hindsight
  - - International growth decelerates sharply
    - Two consecutive quarters of international revenue growth below 50% YoY
    - Undercuts the Silicon Valley/global-platform narrative supporting premium pricing
    - Treat US/UAE/Mexico expansion as underperforming and lower growth assumptions
  notes: Triggers are framed as observable events so headline growth metrics are not mistaken for resolved valuation
    or governance risk.
  claimRefs:
