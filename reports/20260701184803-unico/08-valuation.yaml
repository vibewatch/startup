  - CV019
  - CV009
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Valuation refresh
    - Confirmation of whether $2.6B reflects a new primary round, secondary transaction, or 409A mark, or is simply
      carried forward from April 2022
    - Current valuation stance cannot be finalized without knowing if the price has actually moved since 2022
    - Request the most recent cap-table valuation and financing timeline directly from Unico or its investors
  - - Litigation status
    - Current status, alleged damages, and any settlement terms in the Unico v. Serasa Experian case
    - Materially affects both regulatory risk and reputational standing, and the case is under judicial secrecy
    - Engage outside counsel for a case-status briefing once secrecy lifts or via authorized disclosure
  - - Model performance audit
    - Independently audited false-accept/false-reject rates and liveness/anti-spoofing certification
    - Verifies whether the technology moat matches Unico's own stated fraud-threat escalation
    - Request iBeta/FIDO PAD certification reports or commission an independent red-team test
  - - Revenue and margin disclosure
    - Audited revenue, gross margin, and segment detail by geography and product line (core IDV vs. OwnID passkeys)
    - Needed to test whether growth metrics translate into a defensible unit-economics case
    - Request audited financials or a management-prepared segment P&L under NDA
  - - M&A integration proof
    - Post-acquisition retention, cross-sell, and integration metrics for Trully, Oz Forensics, and OwnID
    - Serial acquisitions without integration proof create hidden execution risk in any valuation model
    - Request cohort retention and integration-milestone data for each acquired unit
  notes: These five asks are the minimum package needed to move from a scenario-based valuation view to a defensible
    entry price.
