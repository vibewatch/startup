- id: financing-context-and-stale-valuation-evidence
  title: Financing Context and Stale-vs-Current Valuation Evidence
  body: 'Unico''s financing history is well documented through its Series D: an approximately $116 million round
    in 2020, an approximately $125 million round in August 2021 that made Unico a unicorn (General Atlantic and
    SoftBank co-leading both), and the April 2022 $100 million Series D led by Goldman Sachs Group Inc. that explicitly
    valued the company at $2.6 billion, per Reuters reporting. General Atlantic''s own portfolio page independently
    confirms it first invested in Unico in 2020, corroborating this sequence. Tracxn''s aggregated tracker puts
    Unico''s total disclosed funding at approximately $341 million. The critical valuation question for this chapter
    is whether the $2.6 billion figure still cited by CB Insights and other trackers as of September 2025 reflects
    any repricing since April 2022. No evidence of a newer primary round, a secondary-market transaction, or a board-approved
    fair-value mark could be found; the figure appears to simply be carried forward from the 2022 event. Meanwhile,
    Unico''s 2026 growth metrics (84% transaction growth, 130% international revenue growth) are company-reported
    and unaudited. Taken together, the valuation evidence is genuinely stale -- roughly four years old at the report''s
    run date -- even though the operating narrative around it has visibly moved forward through new markets, new
    products (OwnID), and new regulatory tailwinds.'
