- id: model-cyber-deepfake-risk
  title: Model / Performance & Cyber-Deepfake Risk
  body: Unico's core value proposition -- reliably distinguishing a live human from a spoof or synthetic identity
    -- faces an accelerating adversarial environment. At SXSW 2026, Unico's own research estimated that sophisticated
    AI-enabled fraud attacks could increase 150-550% during 2026, building on an already-observed 1,082% year-over-year
    increase in digital fraud attempts during 2025. Industry-wide, deepfake incidents targeting identity-verification
    systems are reported to have risen roughly 3,000%, and 'injection attacks' -- where synthetic video or audio
    is fed directly into a verification pipeline via a virtual camera or driver, bypassing the physical camera entirely
    -- are now described as the dominant attack vector rather than physical mask or photo spoofing. Unico claims
    to process over 1.2 billion identity authentications and to have prevented more than $7 billion in financial
    fraud, but these figures are company-reported, and there is no public, independently audited false-accept/false-reject
    rate, demographic-bias testing methodology, or third-party liveness/anti-spoofing certification available to
    verify the model's actual defensive performance against the injection-attack threat it says is now dominant.
    This is the single largest evidence gap in evaluating whether Unico's technical moat is keeping pace with the
    threat environment it describes.
  claimRefs:
