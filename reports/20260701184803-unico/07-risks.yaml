- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Serasa Experian biometric-data litigation
    - Court ruling, settlement terms, or ANPD intervention in the case
    - A ruling or settlement confirming uncontrolled biometric-data leakage or a formal ANPD sanction against Unico's
      channel controls
    - Re-underwrite Unico's data-governance and partner-monitoring assumptions immediately
  - - Digital ECA / age-verification enforcement
    - ANPD enforcement actions, fines, or platform-shutdown orders against Unico customers using its age-assurance
      tools
    - A material fine or shutdown order tied to failures in an age-assurance deployment that used Unico's technology
    - Reassess the size and durability of the age-verification revenue opportunity
  - - Model / deepfake defense credibility
    - Independent PAD/liveness certification results, NIST FRVT submissions, or public breach disclosures
    - Failure of an independent certification test or a confirmed biometric-spoofing breach at a major customer
    - Downgrade confidence in Unico's core anti-fraud technology moat
  - - Capital and valuation durability
    - Next primary financing round terms, or public reporting of a down round / markdown
    - A new round priced at or below the 2022 Series D valuation, or a disclosed SoftBank/General Atlantic markdown
    - Treat the $2.6B mark as stale and re-rate valuation expectations down
  - - International expansion execution
    - US/UAE/Mexico revenue disclosure, customer wins, or disclosed integration failures
    - Two consecutive quarters of international revenue growth deceleration below 50% YoY, or a disclosed acquisition
      write-down
    - Treat global expansion as underperforming relative to the Silicon Valley narrative
  notes: Kill criteria convert the company's growth and litigation narrative into observable thresholds so headline
    growth figures are not mistaken for fully resolved risk.
