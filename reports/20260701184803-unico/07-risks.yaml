- id: capital-procurement-mitigations
  title: Capital / Valuation, Procurement Risk & Mitigations
  body: Unico's most recent disclosed primary financing was a $100 million Series D in April 2022 led by Goldman
    Sachs alongside General Atlantic and SoftBank; the roughly $2.6 billion valuation figure now widely cited in
    2025-2026 press coverage is not clearly tied to a new priced round, and no more recent primary round, 409A mark,
    or board-approved fair-value update is publicly available, leaving open the possibility that the cited figure
    reflects a secondary transaction or analyst estimate rather than a fresh primary mark. On the demand side, Unico's
    growth strategy depends on regulated financial institutions and the newly created Digital ECA age-assurance
    market converting compliance obligations into signed contracts, which typically involves longer, more conservative
    security-review and procurement cycles than the transaction-volume growth figures alone would suggest. Taken
    together, the risk register in this chapter converts the company's public growth and litigation narrative into
    a small set of monitorable thresholds -- a Serasa litigation outcome confirming systemic channel-monitoring
    failure, a confirmed ANPD enforcement action, an independent liveness/PAD certification failure, or a new financing
    round priced flat-to-down versus the 2022 Series D -- any of which should trigger an immediate re-underwriting
    of the current growth-and-technology-moat thesis.
