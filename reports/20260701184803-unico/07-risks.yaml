  evidenceGaps:
  - type: missing-source
    severity: material
    topic: model-risk
    missingEvidence: Independently audited false-accept/false-reject rates, demographic bias testing, and third-party
      liveness/PAD (presentation-attack-detection) certification for Unico's current biometric models.
    whyItMatters: Without independent verification, claims of 'near-100% certainty' and 'zero false acceptance'
      cannot be underwritten and could mask model weaknesses exploited by injection or deepfake attacks.
    diligencePath: Request iBeta/FIDO PAD Level 1-2 certification reports, NIST FRVT submission history, and any
      independent red-team or bias-audit results directly from Unico.
    relatedQuestionRefs:
    - QR011
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue or transaction-volume concentration by top customer/channel, including the share historically
      routed through Banco do Brasil and other bank-linked resellers such as Skill Tecnologia.
    whyItMatters: The Serasa episode shows a single reseller channel could carry enough volume to mask millions
      of diverted queries for an extended period; without concentration data, the true single-partner exposure cannot
      be sized.
    diligencePath: Request customer/channel revenue concentration tables (top 5/top 10 share) and reseller-monitoring
      control descriptions in due diligence.
    relatedQuestionRefs:
    - QR015
  - type: private-evidence-only
    severity: minor
    topic: m&a-integration
    missingEvidence: Post-acquisition customer retention, cross-sell, and technical-integration metrics for the
      Trully, Oz Forensics, and OwnID deals.
    whyItMatters: Serial acquisitions without disclosed integration proof create execution risk that is invisible
      from public sources alone.
    diligencePath: Request cohort retention and integration-milestone data for each acquired business unit for the
      12 months following close.
    relatedQuestionRefs:
    - QR022
    - QR023
  - type: stale
    severity: material
    topic: capital-risk
    missingEvidence: Confirmation of any primary financing event, internal valuation mark, or 409A-equivalent since
      the April 2022 Series D, and whether the widely cited $2.6B figure reflects a new round or a secondary/analyst
      estimate.
    whyItMatters: A valuation mark that is roughly three years old (in a sector where comparable peers like Incode
      are repricing toward $3B while others like Onfido were marked down to ~$163M post-acquisition) may not reflect
      current fair value.
    diligencePath: Request the most recent 409A/cap-table valuation, any board-approved fair-value mark, and details
      of the round(s), if any, underlying the $2.6B figure.
    relatedQuestionRefs:
    - QR027
    - QR028
  - type: missing-source
    severity: minor
    topic: international-expansion
    missingEvidence: Audited or third-party-verified international revenue figures, since the 130% YoY international-revenue
      growth and 84% transaction-volume growth are company-reported.
    whyItMatters: Rapid multi-geography expansion (US, UAE, Israel, Mexico) claims should be corroborated independently
      before being treated as durable growth rather than one-time integration effects from acquisitions.
    diligencePath: Request segment-level revenue disclosure or an independent auditor's letter covering non-Brazil
      revenue for FY2025-FY2026.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: minor
    topic: procurement-risk
    missingEvidence: Typical security-review, procurement, and audit-cycle timelines for Unico's regulated financial-institution
      and public-sector customers.
    whyItMatters: Procurement friction directly affects the speed at which new regulatory-driven demand (e.g., Digital
      ECA age verification) converts into signed contracts and recognized revenue.
    diligencePath: Request average sales-cycle length and security-review checklist requirements from Unico's enterprise
      sales/partnerships team.
    relatedQuestionRefs:
    - QR030
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-enumeration
    missingEvidence: Any non-public ANPD inquiries, sealed court filings, or internal compliance findings beyond
      the publicly reported regulatory and legal risks enumerated in the regulatory/legal risk register.
    whyItMatters: The regulatory/legal risk register (TR001) draws only on publicly reported rulemaking and litigation;
      undisclosed regulatory contacts or additional sealed proceedings would not be visible from public sources.
    diligencePath: Request a management representation letter covering all regulatory inquiries, subpoenas, and
      non-public legal proceedings involving Unico or its subsidiaries.
    relatedTableRefs:
    - TR001
