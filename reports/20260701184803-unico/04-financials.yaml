- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Diligence path
  rows:
  - - Audited revenue, gross margin and net income figures since 2024
    - Cannot independently confirm continued profitability or verify the scale of the estimated $359.7M revenue figure
    - Request audited financial statements or management accounts covering 2025-2026
  - - Monthly cash burn, runway, and precise cash-on-hand balance
    - Cannot verify the 'M&A funded from cash' claim or assess true capital adequacy under a downside scenario
    - Request a cash-flow statement or bank confirmation as part of diligence
  - - Standalone post-acquisition ClearSale financials
    - Loses the best available Brazilian fraud-prevention comparable once folded into Serasa Experian's reporting
    - Monitor whether Experian discloses a Brazil identity-and-fraud segment split in future filings
  - - AU10TIX / ICTS International standalone identity-verification revenue
    - Cannot benchmark AU10TIX's actual scale against its consortium-value marketing claims
    - Request ICTS International's segment disclosures, if any, in its Nasdaq filings
  - - Independent verification of Unico's headcount and revenue-per-employee
    - Growjo and Tracxn disagree by roughly 30% on headcount, undermining confidence in any derived productivity metric
    - Request a company-confirmed headcount figure or LinkedIn-verified employee count
  notes: These are the specific evidence gaps a diligence process should close before underwriting Unico's financial trajectory with high confidence.
