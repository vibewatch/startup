- id: TI004
  title: Capital adequacy table
  columns:
  - Capital signal
  - Detail
  - Source
  - Implication
  rows:
  - - Cash on hand for M&A
    - Management states funding for planned M&A is already in cash reserves and does not depend on new capital raises
    - Bloomberg Linea (2026)
    - Suggests balance-sheet strength sufficient for continued bolt-on acquisitions without near-term dilution
  - - Total equity capital raised to date
    - Estimated $341M across 5 rounds (Tracxn); last priced round $100M Series D (Apr 2022) at $2.6B valuation (Zawya/Reuters)
    - Tracxn; Zawya
    - Establishes the balance-sheet base against which self-funded M&A claims should be assessed
  - - Profitability signal
    - First positive EBITDA in 2024 (operating cash generation, not necessarily net profit); first profitable quarter R$14M (Jan-Mar 2024)
    - Bloomberg Linea; Baguete; Brazil Journal
    - Reduces reliance on external financing for operations, though net-profit sustainability since 2024 is not independently confirmed
  - - Next-round trigger / IPO plans
    - No IPO registration or confirmed listing date announced as of mid-2026 despite market speculation
    - Tracxn; market commentary
    - Capital strategy appears to favor continued private ownership and internally funded growth over a near-term liquidity event
  - - Debt / project-finance obligations
    - No public disclosure of debt facilities or project-finance obligations found in this research window
    - Absence of evidence across all sources reviewed
    - Cannot rule out undisclosed debt; a diligence gap rather than a confirmed zero-debt position
  - - Contingent legal liability
    - Unquantified litigation costs and potential damages/exposure from Unico's own 2026 lawsuit against Serasa Experian/ClearSale
    - Biometric Update
    - Adds an unbudgeted, unquantified capital-adequacy risk pending case resolution
  - - Investor base / patient capital
    - Backed by SoftBank, General Atlantic and Goldman Sachs since the 2022 Series D, all represented on the board
    - Tracxn; Zawya
    - Late-stage, well-capitalized institutional investors reduce near-term forced-financing risk but do not guarantee a future exit path
  notes: Capital-adequacy conclusions rely on management statements and indirect signals (self-funded M&A, EBITDA-positive status); no cash balance, burn rate, or debt schedule has been independently disclosed.
