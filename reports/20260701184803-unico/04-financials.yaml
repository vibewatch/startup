- id: cost-structure-and-margin-drivers
  title: Cost Structure, Margin Drivers, and Service-Delivery Costs
  body: 'Unico discloses no gross margin, cost-of-service, or capex figures, so margin drivers must be inferred from category comparables and qualitative signals. Unico closed 2024 with its first positive EBITDA (an operating cash-generation measure that management and press coverage explicitly distinguish from net profit after taxes, interest and depreciation), following a R$14 million net profit in the January-March 2024 quarter and R$22 million in April 2024 alone. Comparable vendors offer some margin-driver context: Veriff says it doubled revenue past $100 million while reaching profitability, and Socure reports 134% net dollar retention alongside 62% annual recurring revenue growth, both suggesting that platform-based identity verification can scale with improving unit economics once volume is established. The clearest margin-risk comparable is Onfido, whose first post-Entrust-acquisition filing showed revenue falling 10% to £86.8 million alongside a 19% headcount cut, illustrating
    that acquisition integration (a strategy Unico itself is pursuing with Trully, Oz Forensics and OwnID) can pressure standalone revenue and margins even as operating losses improve. Government-run infrastructure such as Serpro''s biometric base offers near-zero marginal-cost verification for lower-risk public use cases, likely capping achievable pricing and margin for private vendors, including Unico, on comparable low-risk transactions.'
  claimRefs:
  - CI012
  - CI013
  - CI032
  - CI039
  - CI038
  - CI036
  tableRefs:
  - TI002
- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'Unico''s capital position appears adequate for its current strategy but rests on management statements rather than audited disclosure. An Unico executive told Bloomberg Linea that funding for planned mergers and acquisitions is already available in cash reserves and does not depend on new capital raises, consistent with the company funding at least three acquisitions (Trully, Oz Forensics, OwnID) since 2024 without a disclosed new priced equity round. Unico''s last confirmed round was a $100 million Series D in April 2022 at a $2.6 billion valuation, led by Goldman Sachs with General Atlantic and SoftBank participating; third-party aggregator Tracxn estimates roughly $341 million has been raised in total across five rounds. No IPO registration or listing date has been publicly confirmed as of mid-2026 despite persistent market speculation. Two capital-adequacy risks are not reflected in any public cash or burn figure: first, Unico''s own mid-2026 lawsuit against Serasa Experian
    and ClearSale creates an unquantified contingent legal-cost exposure; second, Serasa Experian''s much larger parent, Experian plc, reported 15% total Latin America revenue growth in its FY26 first half and disclosed ''Serasa Pass,'' a reusable identity product built jointly by Serasa and ClearSale that directly targets the same reusable-identity market Unico is pursuing, meaning Unico''s next capital needs may be driven as much by competitive response as by organic growth.'
  claimRefs:
  - CI015
