- id: financial-verdict-and-diligence-blockers
  title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
  body: 'Unico''s financial narrative is directionally positive but thinly evidenced: the company reached its first positive EBITDA and profitable quarter in 2024, has sustained double-digit consolidated growth and much faster international growth through Q1 2026, and appears able to self-fund acquisitions without new dilutive capital. However, every headline figure since 2024 is either a company claim or a single third-party news report, and the few independent aggregator estimates available (Growjo, Tracxn) disagree with each other and with Unico''s own disclosures by wide margins on revenue, headcount and even valuation. Reclame Aqui data shows a generally acceptable but imperfect service-reliability record (35 complaints Jan-Jun 2026, 61.5% resolution rate), concentrated in facial-recognition failures at consumer touchpoints, a modest but real revenue-quality risk if it drives customer churn at partner banks and retailers. The biggest diligence blockers are the complete absence of audited
    financials, cash-burn, or margin data, plus two live external risks outside Unico''s control: Serasa Experian''s much larger, credit-bureau-backed parent building a directly competing reusable-identity product, and Unico''s own unresolved, unquantified legal exposure from its lawsuit against that same rival. A lender or investor should treat Unico''s growth and profitability claims as plausible but unverifiable at the precision needed for underwriting until audited statements, a cash/burn schedule, and litigation-cost estimates are produced.'
