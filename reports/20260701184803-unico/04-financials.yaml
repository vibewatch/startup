company:
  name: Unico
chapter:
  number: 4
  title: Financials
  summary: Unico monetizes per-transaction identity verification across IDCloud, IDPay and ID Unico, reached its first positive EBITDA and profitable quarter in 2024, and reports 30-40% guided revenue growth for 2026 with faster international expansion. No audited financials, cash-burn data, or debt disclosure exist publicly, third-party revenue/headcount estimates disagree sharply, and Unico faces an unquantified contingent legal liability plus a newly disclosed reusable-identity product from its much larger, credit-bureau-backed rival Serasa Experian.
sections:
- id: revenue-model-and-mix
  title: Revenue Model, Pricing, and Revenue Mix
  body: 'Unico monetizes identity verification primarily through per-transaction fees charged to banks, retailers, telecoms and gig platforms across at least three product lines: core IDCloud biometric/document verification, IDPay (a card-not-present ecommerce identity check that processed more than 1.5 billion card transactions in its first six months on the market) and ID Unico (ongoing re-authentication for existing accounts, used by two of the three most valuable financial/retail companies in Latin America per a 2024 company statement). None of these streams has a disclosed per-transaction price or an audited revenue breakdown; Unico does not publish a price list, which is standard for this category. Unico serves more than 800 client companies, including named clients Havan, Magazine Luiza, Banco Neon and Vivo, spanning banking, retail and telecom. The company''s 2026 product direction, IDCloud One, unifies previously separate biometric-collection, document-validation and behavioral-analysis
    products into a single integration, aimed at cutting enterprise implementation time from months to days, a packaging change that should reduce sales-cycle friction and could improve realized pricing over time even without a published price list. A newer, smaller revenue line, Unico Skill (an education-sector spin-off now run by former CEO Sergio Chaia), appears immaterial to core financials but its consolidation treatment is unclear and worth confirming in diligence.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: growth-traction-and-gtm-proxies
  title: Public Growth Traction and Go-to-Market Efficiency Proxies
  body: 'Unico''s public traction signals show strong but decelerating headline growth alongside much faster international expansion. Revenue grew roughly 50% year-over-year in 2024, the year of its first profitable quarter; by Q1 2026, consolidated revenue growth had slowed to 34% year-over-year, though management maintained full-year 2026 guidance of 30% to 40% growth. Identity-verification transaction volume grew 84% year-over-year in the same quarter, and international revenue rose 130% year-over-year, led by Mexico, where transaction volume tripled and rose 204% versus the prior quarter. Unico processed 608 million identity transactions in 2024 and projected roughly 3x growth in validation volume for the following year. No public source discloses a customer acquisition cost, sales-cycle length, or payback period for Unico, so go-to-market efficiency cannot be directly benchmarked; the closest available efficiency proxy is Growjo''s third-party estimate of roughly $434,000 in revenue
    per employee, built on an unverified $359.7 million revenue estimate and an 828-employee headcount that itself conflicts by nearly 30% with Tracxn''s separately reported 647-employee count. Company-linked fraud-prevention figures are also inconsistent: Unico''s homepage claims more than $7 billion in fraud prevented annually, while a 2026 press interview cited a R$3.2 billion figure using a different, narrower methodology, underscoring that public traction metrics in this category should be treated as directional, company-influenced signals rather than audited KPIs.'
  claimRefs:
  - CI005
  - CI006
  - CI007
