  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unico-capital-adequacy
    missingEvidence: Unico's monthly cash burn rate, runway, and precise cash-on-hand balance.
    whyItMatters: Without this, the claim that M&A is funded entirely from cash on hand cannot be independently verified, and true capital adequacy under a downside growth scenario is unknown.
    diligencePath: Request a cash-flow statement, bank confirmation, or management accounts covering at least the trailing 12 months as part of financial diligence.
    relatedQuestionRefs:
    - QI013
  - type: missing-source
    severity: material
    topic: unico-capital-adequacy
    missingEvidence: Confirmation of whether Unico carries any debt or project-finance obligations.
    whyItMatters: An undisclosed debt facility would change the capital-adequacy picture materially, especially relative to the self-funded-M&A narrative.
    diligencePath: Request disclosure of any credit facilities, venture debt, or receivables-financing arrangements directly from the company.
    relatedQuestionRefs:
    - QI014
  - type: conflicting-data
    severity: material
    topic: unico-revenue-growth
    missingEvidence: A single, dated, currency-consistent methodology reconciling Unico's $7B+ and R$3.2B fraud-prevention claims.
    whyItMatters: Materially different fraud-prevention figures from company-linked sources undermine confidence in Unico's other self-reported scale metrics.
    diligencePath: Request the underlying methodology and time window for both figures directly from Unico's finance or communications team.
    relatedQuestionRefs:
    - QI011
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-bundling-economics
    missingEvidence: A direct like-for-like comparison of bundled (Entrust/Onfido) versus standalone (Unico) identity-verification monetization economics.
    whyItMatters: Without vendor-agnostic margin data, it is unclear whether bundling into a broader security suite improves or dilutes per-unit identity-verification economics relative to Unico's standalone platform approach.
    diligencePath: Seek analyst commentary (e.g. Gartner/Forrester) or buyer-side procurement data comparing bundled versus standalone identity-verification total cost of ownership.
    relatedQuestionRefs:
    - QI028
