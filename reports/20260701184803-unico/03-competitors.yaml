- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Deep Brazilian bank/government trust and biometric data scale
    - Serasa Experian's credit-bureau + ClearSale + idwall roll-up bundles negative-data, fraud and identity signals that Unico cannot match alone
    - Material
    - Serasa's ~R$2B ClearSale and ~R$450M idwall acquisitions (2025-2026)
    - Verify whether Unico has an equivalent bundling or partnership response, e.g. data-sharing agreements with banks
  - - Proprietary facial-biometric technology as a technical moat
    - Unico alleges its biometric verification capacity was accessed without authorization via a licensed intermediary, suggesting the technology itself may be more leakable/replicable than assumed
    - Material
    - Unico's 2026 lawsuit against Serasa/ClearSale over Skill Tecnologia routing
    - Confirm outcome/settlement of litigation and any resulting licensing or injunctive terms
  - - First-mover LatAm distribution advantage
    - Global specialists (Jumio's selfie.DONE, Incode, Veriff) are actively launching or scaling reusable-identity products aimed at Latin America
    - Material
    - Jumio's April 2026 LatAm selfie.DONE launch; Incode's LatAm focus and 2025 fundraising talks
    - Track win/loss data and pricing response in shared accounts
  - - Government relationship as a distribution channel
    - Serpro/gov.br's free, state-backed biometric infrastructure and the mandatory national ID rollout could reduce private verification demand for lower-risk use cases
    - Minor-to-material depending on segment
    - Serpro's 300M-face/3B-fingerprint IBio base and CIN rollout
    - Assess which Unico revenue lines depend on use cases government ID could substitute
  - - Profitability and independence from further dilutive funding
    - CEO statements ruling out a near-term round suggest capital adequacy, but no audited public financials exist to confirm sustained profitability at 2026 scale
    - Minor
    - Braziljournal's 2024 first-profit report; no subsequent public disclosure found
    - Request updated management accounts or audited statements in diligence
  - - Multi-homing by large regulated buyers limits any single vendor's pricing power
    - Banks and government agencies typically run more than one identity-verification vendor for redundancy, which caps how much moat any single vendor (including Unico) can monetize
    - Minor
    - Inferred from category practice at Serpro/gov.br and Socure's bank-heavy customer base
    - Confirm Unico's largest-account concentration and contract exclusivity terms
  notes: Severity ratings are the author's evidence-based judgment (blocking/material/minor equivalents), not a vendor or third-party risk score.
