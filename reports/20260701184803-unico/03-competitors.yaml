callouts:
- calloutType: risk
  title: Serasa Experian's roll-up plus a live biometric-data lawsuit is the defining competitive risk
  body: 'Serasa Experian''s back-to-back acquisitions of ClearSale (~R$2B, 2025) and idwall (~R$450M, 2026) bundle credit-bureau data with fraud and document-verification workflows, while Unico''s own 2026 lawsuit against Serasa/ClearSale alleges unauthorized access to Unico''s biometric technology via a third-party license. Both threads point the same direction: a much larger, data-rich incumbent is now directly contesting Unico''s core Brazilian moat, and the technology-leakage allegation raises questions about how defensible that moat really is.'
  claimRefs:
  - CP018
  - CP019
  - CP013
  - CP051
- calloutType: insight
  title: Global reusable-identity products are converging on Unico's home turf
  body: Jumio's April 2026 selfie.DONE launch across Latin America, alongside Incode's LatAm-focused fundraising and Persona's AI-native enterprise wins, shows global specialists are no longer content to compete only outside Brazil. Reusable/portable identity is the product vector most likely to commoditize Unico's current document-and-selfie verification workflows if any competitor achieves comparable LatAm distribution.
  claimRefs:
  - CP031
  - CP048
  - CP038
  - CP053
