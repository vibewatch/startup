- id: serasa-experian-consolidation
  title: The Serasa Experian Roll-Up and the Unico Lawsuit
  body: 'The single most important competitive development for Unico in 2026 is not a new entrant but a roll-up: Serasa Experian''s acquisitions of ClearSale (~R$2 billion, 2025) and idwall (~R$450 million, roughly five times revenue, 2026) combine a national credit bureau with a major e-commerce fraud-prevention engine and a document/background-check platform. This bundling threatens to out-distribute standalone identity vendors by pairing negative-data and credit signals with verification workflows in one commercial relationship for banks and retailers. Compounding this, Unico filed criminal and civil lawsuits in mid-2026 alleging that Serasa Experian and ClearSale improperly accessed Unico''s own facial-biometric verification technology through an intermediary, Skill Tecnologia, which held a Banco do Brasil-exclusive license to Unico''s tech; investigators reportedly found at least 1.4 million suspect queries and flagged potential exposure of biometric data for as many as 22 million Brazilians,
    with banks Inter, BTG Pactual and Itau Unibanco named as unwitting sources of the routed traffic. A search-and-seizure warrant was executed and Serasa has denied the allegations; the case is partly under seal, so its outcome is an open evidence gap. Whichever way it resolves, the dispute itself is material: it signals that Unico''s technology may be more exposed to leakage via licensing arrangements than a pure-moat narrative would suggest, and it puts a much larger, credit-bureau-backed rival in a direct and adversarial posture toward Unico for the first time.'
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP016
