  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: serasa-lawsuit
    missingEvidence: A court ruling, settlement disclosure, or Cade regulatory decision resolving Unico's lawsuit against Serasa Experian/ClearSale.
    whyItMatters: The outcome determines whether the alleged biometric-technology leakage was a contained incident or evidence of a structurally weaker technical moat than Unico claims, and whether Unico can extract licensing damages or an injunction.
    diligencePath: Monitor Brazilian court dockets (TJSP) and Cade's public case registry for updates after the case is unsealed; request management's own account of expected timeline and financial exposure.
    relatedQuestionRefs:
    - QP017
    - QP026
  - type: missing-source
    severity: material
    topic: serasa-consolidation
    missingEvidence: Confirmation of Cade antitrust clearance status for the Serasa-idwall acquisition.
    whyItMatters: If blocked or delayed, the competitive bundling threat to Unico from a combined Serasa-ClearSale-idwall entity would be reduced or reshaped.
    diligencePath: Check Cade's public merger-review docket (SEI/Cade) for the idwall transaction's case number and current status.
    relatedQuestionRefs:
    - QP012
  - type: private-evidence-only
    severity: minor
    topic: unico-scale
    missingEvidence: Independent, non-company-sourced verification of Unico's claimed authentication volume, fraud-prevented figure, and continued profitability since 2024.
    whyItMatters: All of Unico's headline scale and profitability claims currently rest on the company's own site or a single 2024 news report; without audited figures or a second independent source, high-confidence claims about its financial trajectory are not fully supportable.
    diligencePath: Request updated management accounts, auditor letters, or a subsequent independent press report confirming 2025-2026 profitability and volume trends.
    relatedQuestionRefs:
    - QP004
    - QP014
  - type: stale
    severity: minor
    topic: clearsale-financials
    missingEvidence: Post-acquisition standalone financial disclosure for ClearSale now that it is owned by Serasa Experian.
    whyItMatters: Historical B3-era ClearSale figures (net revenue ~R$474-476M) may no longer reflect its current scale or margin profile once integrated into Experian's reporting structure, limiting their comparability going forward.
    diligencePath: Check whether Serasa Experian's parent (Experian plc) begins reporting a combined Brazil fraud-and-identity segment that discloses ClearSale's contribution.
    relatedQuestionRefs:
    - QP013
  - type: missing-source
    severity: minor
    topic: moat-risk
    missingEvidence: Independent data directly comparing AU10TIX's consortium fraud-signal network value against Serasa Experian's credit-bureau bundling, and confirmation of typical multi-homing behavior among large regulated identity-verification buyers.
    whyItMatters: Without vendor-agnostic evidence, it is unclear whether AU10TIX's network effect or Serasa's data bundling is the stronger structural moat, and whether Unico's largest accounts are single- or multi-sourced, both of which affect how much competitive pressure Unico actually faces.
    diligencePath: Request buyer-side procurement data or analyst commentary (e.g. Gartner/Forrester identity-verification vendor comparisons) that discusses multi-homing rates and consortium-network value independent of vendor marketing claims.
    relatedQuestionRefs:
    - QP024
    - QP028
