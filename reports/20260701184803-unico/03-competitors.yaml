- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Disclosed pricing model
  - Included capabilities (as disclosed)
  - Discounts / unknowns
  - Competitive implication
  rows:
  - - Unico
    - Not publicly disclosed
    - 'IDCloud bundle: liveness, deepfake detection, risk score, e-signature (per Brazil Journal reporting)'
    - No public price list; enterprise/negotiated
    - Opacity is standard for the category; limits buyer price-shopping
  - - Certta
    - Not publicly disclosed
    - Facial biometrics, liveness, facematch, document analysis, background check, MFA bundled as a 'verification hub'
    - No public price list
    - Bundling strategy suggests land-and-expand rather than point pricing
  - - ClearSale (Serasa)
    - KPI-based performance pricing, and fixed-fee pricing (company-disclosed)
    - E-commerce fraud screening/chargeback protection
    - Model choice implies risk-sharing option for merchants
    - Concrete, rare public disclosure of a dual pricing model in this market
  - - idwall (Serasa)
    - Not publicly disclosed
    - Document verification, background checks, KYC workflows
    - No public price list
    - Now likely to be re-priced/bundled under Experian post-acquisition
  - - Jumio
    - Not publicly disclosed
    - Per-transaction verification, ID Graph reuse, orchestration
    - No public price list
    - selfie.DONE reusable-ID product could shift pricing toward subscription/reuse credits
  - - Socure
    - Not publicly disclosed (enterprise contracts)
    - RiskOS platform bundling identity, fraud, KYC/AML, device signals
    - Net dollar retention of 134% implies expansion/upsell pricing
    - High retention suggests successful land-and-expand monetization
  - - Veriff
    - Not publicly disclosed
    - Verification sessions, fraud detection, biometric checks
    - Reported profitability implies improved unit economics at scale
    - Doubling revenue while reaching profitability suggests pricing power improved
  - - Onfido / Entrust
    - Not publicly disclosed
    - Document + biometric verification bundled into Entrust's broader identity-security suite
    - Revenue decline post-acquisition suggests possible price/volume pressure
    - Bundling into Entrust suite may trade standalone growth for cross-sell
  - - AU10TIX
    - Not publicly disclosed
    - Per-document verification plus consortium fraud-signal network access
    - Consortium value proposition ('$5B saved') is a company claim, not audited
    - Network-effect pricing pitch, unverified independently
  notes: Only ClearSale discloses a concrete pricing-model structure publicly; all other rows reflect inferred packaging from product pages and news coverage, not published price lists.
