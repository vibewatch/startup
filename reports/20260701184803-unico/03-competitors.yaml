  title: 'Competitor profile table: category, scale, target segment, differentiation'
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Unico (benchmark)
    - Domestic AI identity leader
    - Series D Apr 2022 at $2.6B valuation; SoftBank/General Atlantic/Goldman-backed
    - Brazilian banks, retail, gov-adjacent, expanding LatAm/global
    - Deepfake detection, deterministic biometrics, 1.2B+ authentications/yr claimed
    - First profitable quarter only disclosed in 2024; no public financials
  - - Certta (formerly Caf)
    - Domestic identity/fraud hub
    - R$50M raise (2026) from L4/B3 fund + Parallax
    - Brazilian marketplaces, telecom, fintech (Vivo, iFood, Mercado Livre)
    - Positions as multi-signal 'verification hub'; claims 67% 4-yr CAGR
    - No absolute revenue disclosed; smaller scale than Unico/Serasa
  - - idwall (Serasa Experian)
    - Domestic document/background-check
    - Acquired by Serasa ~R$450M (2026), ~5x revenue
    - SMB and enterprise KYC/background checks
    - Now bundled with Experian credit-bureau data
    - Pending Cade antitrust approval; loses independence
  - - ClearSale (Serasa Experian)
    - Domestic e-commerce fraud prevention
    - Acquired by Serasa ~R$2B (2025); B3-listed historically (CLSA3)
    - E-commerce merchants
    - KPI-based or fixed-fee pricing; 5,000+ customers claimed
    - Revenue reportedly declined pre-acquisition; standalone reporting ending
  - - Serpro / gov.br
    - Government status-quo infrastructure
    - State-owned; not fundraising
    - Federal/state agencies, regulated private clients (e.g. Uber via Datavalid)
    - 300M faces / 3B fingerprints; near-zero marginal cost to government users
    - Not a commercial competitor for private-sector UX/CX use cases
  - - Jumio
    - Global identity-verification specialist
    - ~$197-205M total funding; new CEO Mark Lorion (Apr 2026)
    - Global fintech, travel, crypto, gig platforms
    - 5,000+ ID types; launched selfie.DONE reusable ID in LatAm (Apr 2026)
    - Headcount reportedly down ~11% YoY; valuation undisclosed
  - - Socure
    - Global identity/risk decisioning
    - $340M+ ARR (Q1 2026), 62% YoY growth; last equity round $450M (2021) at $4.5B
    - US banks (18/20 top), fintechs, public sector
    - 134% net dollar retention; FedRAMP Moderate authorized
    - Primarily US-centric; limited disclosed Brazil presence
  - - Veriff
    - Global identity-verification specialist
    - ~$200M total funding; $1.5B valuation (2022)
    - Fintech, mobility, gaming, crypto
    - Doubled revenue past $100M and reached profitability (Dec 2025)
    - LatAm distribution depth not independently verified
  - - Persona
    - Global modular identity platform
    - $200M Series D (Apr 2025) at $2B valuation
    - Enterprise/AI-native platforms (OpenAI, LinkedIn, Etsy)
    - Modular workflow/graph architecture for orchestrating many checks
    - Newer entrant with limited disclosed LatAm bank penetration
  - - Onfido / Entrust
    - Global identity-verification, now PE-backed
    - Acquired by Entrust (completed Apr 2024); revenue fell 10% to £86.8M (FY ended Jan 2024)
    - Enterprise KYC across regulated industries
    - Deep enterprise/compliance integration under Entrust security suite
    - Post-acquisition revenue decline and 19% headcount cut disclosed
  - - ID.me
    - Government/consumer identity network
    - 136M+ members claimed; GAO-reviewed federal contracts
    - US federal/state agencies, healthcare, retail
    - Sole IAL2 identity-proofing vendor for 30+ IRS applications
    - GAO found weak oversight and no independent audits (adverse)
  - - AU10TIX
    - Global document-verification specialist
    - Subsidiary of Nasdaq-listed ICTS International; ~$80M total funding
    - Marketplaces, sharing economy, crypto exchanges
    - 5,000+ supported document types; consortium fraud-signal network
    - Revenue figures are third-party estimates only, not disclosed by ICTS separately
  - - Incode Technologies
    - LatAm-focused identity-verification specialist
    - ~$260M raised; in talks (Nov 2025) for up to $300M at $3B valuation
    - LatAm and US enterprise, government
    - ~$170M ARR reported; shares SoftBank/General Atlantic backers with Unico
    - Financials are press-reported estimates, not audited disclosures
  notes: Funding/valuation figures are the most recent publicly reported figures as of each source's publication date; scale claims for privately held vendors are company-reported and not independently audited.
