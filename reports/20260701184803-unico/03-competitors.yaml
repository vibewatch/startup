  title: 'Competitive positioning map: Brazil distribution/trust depth vs. global/technology breadth'
  type: quadrant
  layout: wide
  summary: Ordinal, evidence-backed placement of the twelve profiled competitors on Brazil-specific distribution/trust depth (x) versus global technology/product breadth (y); axis positions are analyst judgment, not measured coordinates.
  data:
    points:
    - label: Unico
      x: 9
      y: 6
      description: Deepest Brazilian bank/biometric trust of any pure-play vendor, now building global breadth via Menlo Park HQ and five recent acquisitions.
    - label: Certta (Caf)
      x: 6
      y: 4
      description: Established Brazilian multi-signal hub with 300+ clients, but smaller scale and no disclosed international footprint.
    - label: Serasa Group (ClearSale+idwall)
      x: 10
      y: 5
      description: Unmatched Brazilian credit-bureau distribution and incumbency after two 2025-2026 acquisitions, but identity-specific technology breadth is now inherited, not built in-house.
    - label: Serpro / gov.br
      x: 8
      y: 2
      description: Maximal government trust and Brazil-only biometric scale, but not a commercial identity-verification competitor with product breadth.
    - label: Jumio
      x: 3
      y: 8
      description: Strong global technology breadth (5,000+ ID types, ID Graph) newly entering LatAm via April 2026 selfie.DONE launch.
    - label: Socure
      x: 2
      y: 8
      description: Deep US bank/public-sector trust and $340M+ ARR, but limited disclosed Brazil presence.
    - label: Veriff
      x: 2
      y: 7
      description: Profitable at $100M+ revenue with broad global fraud/verification coverage, LatAm depth unverified.
    - label: Persona
      x: 2
      y: 7
      description: Modular enterprise platform favored by AI-native firms (OpenAI, LinkedIn); newer to LatAm bank distribution.
    - label: Onfido / Entrust
      x: 3
      y: 7
      description: Broad enterprise compliance breadth under Entrust, but a post-acquisition revenue decline signals execution risk.
    - label: ID.me
      x: 1
      y: 5
