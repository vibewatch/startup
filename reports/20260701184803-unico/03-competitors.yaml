- id: global-specialists-and-latam-entry
  title: Global Identity Specialists and Their Path Into Latin America
  body: 'Outside Brazil, Unico''s most consequential competitors are the global identity-verification specialists, most of which are now larger by disclosed revenue or ARR and are actively courting Latin American distribution. Jumio launched its selfie.DONE reusable-identity product across Latin America in April 2026 under new CEO Mark Lorion, a direct challenge to Unico''s core reusable-identity thesis. Socure reported more than $340 million in total ARR in Q1 2026 (62% year-over-year growth, 134% net dollar retention) and has achieved FedRAMP Moderate authorization, expanding its addressable US public-sector business, though its disclosed Brazil footprint remains limited. Veriff says it doubled revenue past $100 million and reached profitability by December 2025, while Persona raised $200 million at a $2 billion valuation in April 2025 to serve AI-native enterprise customers such as OpenAI and LinkedIn. Onfido, now folded into Entrust after an April 2024 acquisition, posted a 10% revenue
    decline to £86.8 million in its first post-acquisition filing and cut headcount 19%, an adverse signal about integration friction at a peer that once competed head-to-head with Unico on document/biometric verification. AU10TIX and Incode round out the set: AU10TIX (an ICTS International subsidiary) emphasizes consortium fraud-signal networks, while Incode, a Latin America-focused rival backed by the same General Atlantic and SoftBank funds that back Unico, was reported in November 2025 talks to raise up to $300 million at a $3 billion valuation, underscoring investor appetite for further consolidation or capital-intensive competition in the region.'
