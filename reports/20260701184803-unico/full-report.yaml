  - id: FE003
    title: Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      The customer promise depends on capture reliability, identity-base quality, partner data, regional contracts, and
      attack-resistant biometrics all holding together.
    approximationNotes: Dependencies are public-facing choke points, not a complete internal service graph.
    data:
      nodes:
        - id: clients
          label: Customer apps and channels
          detail: Banking apps, wallet flows, merchant checkout, streaming or betting front ends
        - id: sdk
          label: SDK / webview capture layer
          detail: Browser, native app, or hosted journey compatibility and permissions
        - id: engine
          label: Biometric decision engine
          detail: Liveness, identity, fraud, age, and adaptive-auth routing logic
        - id: search
          label: 1:N and vector-search backend
          detail: Large-scale face retrieval, embeddings, and matching state
        - id: partners
