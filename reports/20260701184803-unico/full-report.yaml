  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Unico competes across five overlapping product segments: digital identity verification for KYC and
              onboarding, biometric authentication (facial, voice, and liveness detection), fraud-prevention analytics,
              age verification and age assurance, and deepfake/injection-attack detection. Included spend covers
              software licensing, per-verification API fees, and the machine-learning models that power liveness and
              anti-spoofing checks; excluded spend covers physical biometric-capture hardware and access-control
              turnstiles, which sit in a separate facilities-security budget entirely.


              A clean market-boundary line separates this addressable private-vendor spend from government-delivered
              digital identity. Brazil's federal Conta gov.br platform and the Carteira de Identidade Nacional (CIN),
              which uses the CPF as a unifying identifier, are issued and operated directly by the state at no charge to
              citizens -- an adjacent but largely non-addressable segment for a commercial vendor such as Unico, because
              the government is both the payer and the identity issuer rather than a customer. The status-quo substitute
              that identity-verification vendors displace is manual, document-based KYC review -- a slower,
              labor-intensive process that biometric automation is sold to replace.


              Regulatory context sharpens the boundary further. Brazil's LGPD (Lei 13.709/2018) explicitly classifies
              biometric data as "sensitive personal data" subject to stricter processing rules than ordinary personal
              data, which is one reason vendors market privacy-by-design and consent-management features as part of the
              product rather than a compliance add-on. That sensitive-data classification, together with the exclusion
              of the government-run identity layer, defines the addressable market this chapter sizes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
