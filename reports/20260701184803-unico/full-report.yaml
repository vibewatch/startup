            body: >-
              Public evidence puts Unico squarely inside large, fraud-sensitive customer journeys rather than consumer
              software sold bottom-up. On the paying side, the most visible buyers are large banks, fintechs, retailers
              with digital-credit or checkout exposure, and betting operators that need regulated onboarding and fraud
              controls. The end user is different: account applicants, cardholders, bettors, borrowers, or marketplace
