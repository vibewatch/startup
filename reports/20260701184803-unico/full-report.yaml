      - number: '5.4'
        title: Trust, Compliance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Unico's trust surface is materially stronger than a typical marketing site, but it still leaves diligence
              gaps. The company publicly claims PAD and injection-attack testing, SOC 2 Type 2, NIST testing, GDPR
              alignment, LGPD compliance, multicloud reliability, and real-time monitoring. Its US privacy policy is
              unusually concrete about the categories of personal data it processes, the outside sources it uses in
              identity verification, the fact that it does not sell or share data for targeted advertising, and the
              retention logic it applies to biometric data under state law. Age verification is also being pushed into a
              more demanding regulatory environment: ANPD's 2026 consultation and the Mattos Filho summary both
              emphasize privacy, auditability, anti-circumvention, and minimal-attribute sharing. The main technical
              risk is not that Unico lacks any response to deepfakes; it clearly has one. The harder question is how
              well that response holds up against evolving injection attacks, subgroup bias, false-rejection tradeoffs,
