      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The real debate is not whether Unico was worth $2.6B in 2022
            body: >-
              The debate is whether the public evidence in 2026 supports paying anywhere near that same mark today,
              given four years of unrefreshed pricing, an unresolved lawsuit, and no independent proof that the
              technology moat has kept pace with the fraud threats Unico itself describes.
