chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Unico idtech S.A. is a Brazilian digital-identity and biometric-authentication company headquartered in
              Sao Paulo. The company was founded in 2007 as Acesso Digital, a document-digitization business, and later
              pivoted toward facial-biometric identity verification -- a shift founder Diego Martins has described as
              the company's defining turning point. The business rebranded to Unico around its 2021 fundraising and now
              describes itself as the world's largest identity-validation network.


              Unico's product stack combines facial biometrics, liveness detection, AI-based risk signals, and
              behavioral analytics into a platform sold to banks, fintechs, retailers, gambling operators, and (since
              the 2025 OwnID acquisition) global consumer brands. The company reports processing more than 1.2 billion
              identity authentications per year against a biometric reference network of 170 million-plus unique faces
              across 21-plus countries, and more than 150 million transactions per month on a Google Cloud-based
              multicloud security-and-compliance platform. Its own newsroom states the company prevented more than R$3.2
              billion in fraud in 2024 and authenticates identity for 9 of Brazil's 10 largest retailers, 4 of the 5
              largest banks, and 8 of the 10 largest betting companies -- concentration that makes Brazilian
              financial-services and gambling-sector demand central to the current business model.
