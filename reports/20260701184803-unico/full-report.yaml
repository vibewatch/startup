      - number: '3.4'
        title: Distribution Power, Bank/Government Trust, and Regulatory Posture
        blocks:
          - type: paragraph
            body: >-
              Distribution power in Brazilian identity verification runs through two channels Unico does not fully
              control: government infrastructure and the newly Experian-owned credit-bureau relationship. Serpro
              operates roughly 300 million faces and 3 billion fingerprints of biometric data underpinning gov.br
              services and serves more than 700 public and private clients, including Uber's driver verification via its
              Datavalid product; Brazil's rollout of a biometric national ID card (Carteira de Identidade Nacional)
              further extends free, state-backed identity infrastructure that can substitute for private verification in
              lower-risk use cases. On the regulatory side, ID.me's experience in the United States is instructive even
              though it is a different market: a June 2025 GAO report found the IRS relies on ID.me as its sole IAL2
              identity-proofing vendor for more than 30 applications, with no measurable program goals and no
              independent audits, and flagged that ID.me's AI/facial-recognition use was not recorded in the IRS's
              required AI inventory. This is a cautionary template for any vendor, including Unico, that becomes a
              single point of failure for a government identity program: regulatory scrutiny tends to arrive only after
              concentration risk is already established. In Brazil specifically, LGPD-style data-protection obligations
              and Unico's own lawsuit against Serasa over biometric-data handling both suggest regulators and courts are
              now actively engaged with how identity vendors handle sensitive biometric data, raising the compliance bar
              for all players simultaneously.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP040
              - CP041
