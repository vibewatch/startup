            title: Multi-year scale across banking, retail, and gambling in Brazil
            body: >-
              Unico's own disclosures and independent press consistently describe authentication relationships with the
              large majority of Brazil's largest banks, retailers, and betting companies, plus a
              multi-billion-transaction track record (735M+ ID Unico transactions, 850M+ cumulative facial
              authentications, 1.5B+ IDPay transactions) that predates its 2024-2026 international push. That breadth of
              entrenched, high-volume enterprise usage is a more durable signal than any single funding headline.
            calloutType: strength
            claimRefs:
              - CO011
              - CO029
              - CO030
              - CO031
              - CO032
          - type: callout
            title: Competitive pressure and litigation are recent, not historical, signals
            body: >-
              The January 2023 layoffs and the "waning" core-product characterization could be read as one-time,
              post-pandemic-financing-cycle adjustments. The June 2026 lawsuit against Serasa Experian shows the same
              competitive dynamic is still live three-plus years later, and it specifically alleges a competitor gained
              access to Unico's own technology through a customer-facing intermediary -- a scenario that raises real
              questions about Unico's technology-access controls and IP protection even as it disputes the misuse.
            calloutType: risk
            claimRefs:
              - CO045
              - CO046
              - CO047
              - CO048
              - CO049
          - type: callout
            title: No priced valuation event has been confirmed since April 2022
            body: >-
              Every valuation reference found in this chapter -- including the September 2024 Trully.AI acquisition
              coverage -- points back to the ~$2.6B April 2022 Series D. Absent a new disclosed round, this analysis
              assumes that figure remains the last priced mark, even though Unico has since reported its first
              profitable quarter, continued making acquisitions, and opened a new global headquarters, any of which
              could plausibly support a different current valuation that has simply not been publicly disclosed.
