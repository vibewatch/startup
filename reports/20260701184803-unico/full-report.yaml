      - number: '7.2'
        title: Legal & Litigation Risk
        blocks:
          - type: paragraph
            body: >-
              The single most material near-term legal risk is Unico's own June 2026 civil and criminal litigation
              against Serasa Experian, in which Unico alleges that Serasa (via an intermediary, Skill Tecnologia,
              authorized only to resell facial-recognition queries on behalf of Banco do Brasil) diverted biometric
              verification queries outside that authorized scope. Forensic analysis cited in the filing identified
              roughly 1.4 million irregular transactions, with potential exposure of biometric data belonging to up to
              22 million Brazilians. A Brazilian court authorized a search-and-seizure operation at Skill Tecnologia's
              São Paulo offices, and the case is now proceeding under judicial secrecy, which limits independent
              verification of either side's claims; Serasa has publicly denied wrongdoing. Regardless of how the
              litigation resolves, the episode is itself evidence that a large volume of queries moved through a partner
              channel for an extended period without detection by Unico's own monitoring systems -- a control gap that
              matters independently of legal fault. The trademark record for 'Unico Identity Cloud,' held by the
              operating entity Acesso Digital Tecnologia da Informação S.A., is a rare piece of independently verifiable
              public-registry evidence about Unico's corporate and product structure that is not affected by the
              litigation's judicial secrecy.
            claimRefs:
