  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Unico competes across at least five distinct alternative classes: domestic Brazilian identity/fraud
              idtechs (Certta, idwall), a newly consolidated credit-bureau incumbent (Serasa Experian, now owning both
              ClearSale and idwall), government-run status-quo infrastructure (Serpro's IBio biometric base and the
              gov.br national digital identity program), global identity-verification specialists expanding into Latin
              America (Jumio, Socure, Veriff, Persona, Onfido/Entrust, AU10TIX, ID.me), and the internal-build option
              available to Unico's largest bank and retail customers. This is a materially more concentrated field than
              it looked two years ago: Brazil's identity and fraud-prevention market has consolidated hard around Serasa
              Experian, which bought ClearSale for roughly R$2 billion in 2025 and agreed to buy idwall for roughly
              R$450 million in 2026, pending antitrust clearance. Certta (the 2026 rebrand of Caf) remains the most
              credible pure-play Brazilian rival still standing outside the Serasa umbrella, explicitly naming Unico and
              idwall as its chief competitors. Globally, Jumio, Socure, Veriff and Persona are all larger by disclosed
              revenue or ARR than anything Unico has publicly confirmed, and several are actively pushing
              reusable-identity products into Latin America, most visibly Jumio's April 2026 selfie.DONE launch.
