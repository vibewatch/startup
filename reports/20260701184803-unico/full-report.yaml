      - number: '8.3'
        title: Comparable Set and Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Placed against its identity-verification peer set, Unico's ~$2.6 billion mark sits between recently priced
              US comparables and smaller, similarly stale peers. Incode Technologies was reportedly in talks in late
              2025 for a valuation of up to $3 billion. Persona, a more directly comparable US platform, raised a $200
              million Series D in 2025 at a $2 billion valuation (up from $1.5 billion in 2021) -- a fresher, more
              recently priced benchmark than Unico's own mark. Veriff's $1.5 billion valuation dates to January 2022,
              almost the same vintage as Unico's Series D, while AU10TIX's ~$260 million reference traces all the way
              back to 2019, and Onfido's post-Entrust standalone valuation fell to roughly $163 million in 2025 --
              illustrating how sharply this sector's valuations can diverge and compress. Jumio's estimated $252.7
              million in annual revenue on $205.4 million of total funding offers a revenue-scale anchor given Unico
              discloses no audited revenue. No single valuation-to-scale multiple holds across this comparable set, so
              Unico's figure cannot be cleanly triangulated and should be treated as company-specific pending fresher
              data. Under a bull scenario, successful integration of Unico's three recent acquisitions plus continued
              80%+ growth could support a re-rating toward the Incode-style ~$3 billion reference. The base case assumes
              growth decelerates toward the broader market's 11-17% CAGR and the Serasa litigation settles without a
              material fine, supporting a valuation modestly above the 2022 mark. The bear case assumes the litigation
              exposes systemic control failures and a next round prices flat to down, echoing Onfido's steep de-rating.
