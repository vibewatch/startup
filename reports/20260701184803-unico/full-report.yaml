              separately reported 647-employee count. Company-linked fraud-prevention figures are also inconsistent:
              Unico's homepage claims more than $7 billion in fraud prevented annually, while a 2026 press interview
              cited a R$3.2 billion figure using a different, narrower methodology, underscoring that public traction
              metrics in this category should be treated as directional, company-influenced signals rather than audited
