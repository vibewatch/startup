  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Customer Jobs
        blocks:
          - type: paragraph
            body: >-
              Unico's public surface is broader than a single selfie check. At the center is IDCloud, which the company
              frames as a modular identity-decisioning platform rather than a monolithic KYC widget. The core new-user
              flow starts with Onboarding, where one capture can trigger liveness, identity verification, fraud-risk
              classification, and document capture. Variants then strip or rearrange those steps depending on the
              customer's job: Non-Document Verification removes document dependence for multinational sign-up; Fraud
              Risk Level Detection looks for network or behavioral abuse even when the presented identity looks
              plausible; Multi-Account Prevention performs 1:N biometric uniqueness checks at sign-up; and Data
              Verification adds AML, sanctions, PEP, and prohibited-bettor screening for regulated flows. Unico also
              extends the same identity graph into post-onboarding jobs such as adaptive revalidation, online payment
              proof, and age gating. The net result is a workflow stack organized around customer moments—registration,
              authentication, payment, age assurance, and document formalization—rather than around a single generic
              biometrics SKU.
