      - number: '1.5'
        title: Adverse Signals, Competitive Risk, and Regulatory Context
        blocks:
          - type: paragraph
            body: >-
              Unico's growth narrative has not been uninterrupted. In January 2023 the company cut at least 150
              employees (about 10.5% of headcount) across two rounds of layoffs within three months; independent press
              (InfoMoney) linked the cuts to intensifying competition in facial biometrics and quoted Unico's own
              acknowledgment that facial biometrics had "become just one option in the market." A year earlier, trade
              press analysis of the August 2022 MakroSystems acquisition described the revenue-generating power of
              Unico's core "Check" identity-verification product as "waning," framing the company's acquisition-led
              diversification as a response to that pressure.


              Competitive tension resurfaced more sharply in June 2026, when Unico filed criminal and civil lawsuits
              against Serasa Experian (Experian's Brazilian subsidiary) and its ClearSale unit, alleging they improperly
              accessed Unico's facial-biometric technology through intermediary Skill Tecnologia -- which had a Banco do
              Brasil-exclusive contract with Unico -- to compete for other banks' clients. Unico's suit alleges at least
              1.4 million improper verification transactions were identified, drawn from a sample it believes reflects
              data queries on roughly 22 million Brazilians, with banks including Inter, BTG, and Itau unknowingly
              involved; Serasa Experian denies the allegations, and the case is proceeding under seal. Separately,
              Brazil's National Data Protection Authority (ANPD) is the regulator with direct oversight over how
              companies such as Unico process biometric and other sensitive personal data, and Unico publishes its own
              ethics-and-compliance policy addressing responsible use of biometric data and AI. Taken together, the
              layoffs, the "waning" product characterization, and the active litigation are the clearest available
              signals that Unico operates in a market with real competitive and regulatory pressure, not merely one of
              uninterrupted scale growth.
            claimRefs:
              - CO045
              - CO046
              - CO047
              - CO048
              - CO049
              - CO050
              - CO055
