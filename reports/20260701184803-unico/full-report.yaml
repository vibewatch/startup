          values:
            - High
            - Product pages + homepage scale claims
            - Capture reliability plus biometric engine quality
            - No public FRR or subgroup-performance data
        - label: Fraud network + 1:N uniqueness
          values:
            - High
            - Multi-Account + Fraud Risk docs + Google Cloud case study
            - Identity-base coverage and matching backend scale
            - Public precision claims are not independently benchmarked
        - label: Smart Revalidation / step-up auth
          values:
            - Medium-High
            - Continuous Authentication docs
            - Device metadata, passkey support, and routing correctness
            - Silent-approval failure modes are not publicly disclosed
        - label: Age Verification
          values:
            - Medium
            - Official product page + 2026 launch coverage + ANPD context
            - Liveness quality, privacy controls, and evolving regulation
            - No public fairness or appeal metrics
        - label: IDPay payment verification
          values:
            - Medium-High
            - Payment product pages + DevCenter docs
            - Issuer integrations and liability design
            - Economics and chargeback outcomes are not public
        - label: People / Sign / SAML / SCIM
          values:
            - Medium
            - DevHub + module docs
            - Enterprise workflow adoption and admin integration quality
            - Public packaging suggests adjacency more than full platform cohesion
        - label: Acquisition-enhanced capabilities
          values:
            - Medium
            - Press coverage of Oz, Trully, and OwnID plus API traces
            - Post-acquisition integration into One / IDCloud
            - No exact public milestone plan for packaging and rollout
