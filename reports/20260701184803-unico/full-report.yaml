        title: Concentration & Partner Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Unico's business is geographically and structurally concentrated in ways that amplify the impact of any
              single failure. Independent strategic analysis explicitly characterizes Unico's dominant position in
              Brazil as a 'significant concentration risk' and frames further geographic diversification as close to
              existential for the long-term thesis. The Serasa/Skill Tecnologia episode illustrates the mechanism
              concretely: Unico's exposure to fraud, misuse, or reputational damage can be concentrated through a single
              large financial-sector reseller channel, and a channel-level failure can go undetected for an extended
              period before surfacing. On the capital side, Unico's investor base is concentrated among three lead
              backers -- SoftBank, General Atlantic, and Goldman Sachs -- across its Series B through D rounds, which
              provides some syndicate diversification versus a single backer but still leaves follow-on financing
              dependent on a small number of relationships. More broadly, Unico depends on financial-sector customers
              (banks and fintechs) as its core distribution channel in Brazil, meaning that regulatory or competitive
              shifts affecting that customer segment flow directly through to Unico's growth.
