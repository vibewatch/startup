      - number: '7.5'
        title: Competitive, M&A Integration, International Expansion & People Risk
        blocks:
          - type: paragraph
            body: >-
              Unico competes against well-capitalized global identity-verification vendors -- Jumio, Onfido (now part of
              Entrust), Veriff, and AU10TIX -- as well as against Big Tech platforms embedding native passkey and
              identity capabilities directly into their operating systems, and against repricing dynamics in the sector:
              Incode Technologies was reportedly in talks for a valuation of up to $3 billion in late 2025, while
              Onfido's disclosed standalone valuation fell to roughly $163 million in 2025 after its parent's
              acquisition -- illustrating how widely outcomes can diverge within the same peer set. Unico has pursued an
              aggressive, serial-acquisition strategy to build a global platform, acquiring Trully (Mexico) and Oz
              Forensics (UAE) in 2024 and OwnID (US/Israel passwordless authentication, ~3.5 million authentications per
              month for clients including Nestlé, SAP, the NFL, and Michael Kors) in September 2025, with OwnID
              continuing to operate as 'OwnID by Unico.' No public post-acquisition integration metrics -- customer
              retention, cross-sell attach rates, technical-platform consolidation -- have been disclosed for any of the
              three deals. Unico has layered a new Silicon Valley headquarters (opened in Menlo Park on April 1, 2026)
              and executive hires from Meta, Apple, and Google on top of this M&A activity, alongside reported 84%
              year-over-year growth in identity-verification transaction volume and international revenue growth in Q1
              2026. Simultaneously running compliance response, integration of three acquired businesses, and a
              new-market executive build-out concentrates substantial execution risk on a leadership team whose public
              face remains founder-CEO Diego Martins, and public headcount estimates for the company are inconsistent
              across sources (roughly 647 to 828 employees for similar periods), suggesting reporting-vintage noise that
              diligence should resolve directly with the company.
