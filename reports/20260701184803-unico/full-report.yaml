      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Unico's strongest moat claims rest on Brazilian bank and government trust accumulated over nearly two
              decades, deterministic biometric technology, and an acquisition-funded push into adjacent geographies and
              capabilities (Trully, Oz Forensics, OwnID). Each of these faces a credible commoditization or displacement
              risk. First, the Serasa Experian roll-up of ClearSale and idwall creates a bundled distribution competitor
              with credit-bureau data that Unico cannot easily replicate through its own biometric-only stack. Second,
              Unico's own lawsuit alleging unauthorized access to its verification technology via Skill Tecnologia's
              Banco do Brasil-exclusive license suggests the underlying technology can be leaked or resold through
              licensing arrangements, undercutting the assumption that biometric IP alone is a durable moat. Third,
              global specialists including Jumio, Socure, Veriff and Persona are all racing toward reusable/portable
              digital identity, a product direction that could commoditize one-off document-and-selfie verification if
              any of them achieve LatAm-scale distribution; Jumio's 2026 selfie.DONE LatAm launch is the clearest
              evidence this is already happening. Fourth, government infrastructure (Serpro/gov.br) caps pricing power
              for lower-risk verification use cases. Finally, no public financial statements confirm Unico's
              profitability has persisted since its first profitable quarter in early 2024, and large regulated buyers
              typically multi-home across vendors, limiting how much of a durable pricing moat any single player,
              including Unico, can sustain. Diligence should test whether Unico's growth (84% YoY transaction growth in
              Q1 2026) is coming from expansion with existing large accounts or genuinely new logos in the face of this
              intensifying competitive set.
