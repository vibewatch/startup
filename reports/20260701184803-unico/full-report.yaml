            body: >-
              Unico's public traction signals show strong but decelerating headline growth alongside much faster
              international expansion. Revenue grew roughly 50% year-over-year in 2024, the year of its first profitable
              quarter; by Q1 2026, consolidated revenue growth had slowed to 34% year-over-year, though management
              maintained full-year 2026 guidance of 30% to 40% growth. Identity-verification transaction volume grew 84%
              year-over-year in the same quarter, and international revenue rose 130% year-over-year, led by Mexico,
              where transaction volume tripled and rose 204% versus the prior quarter. Unico processed 608 million
              identity transactions in 2024 and projected roughly 3x growth in validation volume for the following year.
              No public source discloses a customer acquisition cost, sales-cycle length, or payback period for Unico,
              so go-to-market efficiency cannot be directly benchmarked; the closest available efficiency proxy is
              Growjo's third-party estimate of roughly $434,000 in revenue per employee, built on an unverified $359.7
