  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory & Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Unico operates a biometric identity-verification platform in Brazil, where facial biometric data is
              classified as sensitive personal data under the LGPD, and the data-protection authority (ANPD) has moved
              from guidance to active rulemaking. The ANPD opened a public consultation in mid-2025 specifically on the
              processing of biometric data, following its June 2024 'Radar Tecnológico' report on facial-recognition
              technology, and became a fully independent regulatory agency with expanded enforcement powers in April
              2026. Separately, Brazil's new Digital ECA (Law 15,211/2025) took effect on March 17, 2026, banning
              self-declared age online and mandating reliable age-verification methods, with fines of up to R$50 million
              or 10% of a company's Brazil revenue for non-compliance -- a rule set that is simultaneously a demand
              driver and a compliance-cost risk for Unico's age-assurance product line. The Central Bank of Brazil has
              layered on its own biometric mandate: BCB Resolution 493, CMN Resolution 5,274/2025 and BCB Resolution
              538/2025 require multi-factor authentication and biometric verification for Pix transactions beginning
              March 2026, with institutional fines starting at R$50,000. Together, these three regulators (ANPD, Central
              Bank, and the broader Digital ECA framework) create a compounding, moving-target compliance surface that a
              smaller identity-verification vendor must track and adapt to faster than diversified incumbents.
            claimRefs:
