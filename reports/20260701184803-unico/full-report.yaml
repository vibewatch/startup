              broadest scale claims come from current company or partner pages: more than 800 companies served, four of
              Brazil's top five banks, seven of the 10 largest brands, and more than 170 million faces in the network.
              Named public proof is strongest in Brazil's private-sector banking, payments, retail-credit, and gambling
              corridors. Government identity rails are clearly large in Brazil, but the reviewed public-sector sources
