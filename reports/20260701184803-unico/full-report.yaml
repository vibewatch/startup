  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Core onboarding and anti-fraud modules look mature, while age assurance, passwordless adjacencies, and workflow
      products are newer or less transparent.
    approximationNotes: >-
      Maturity labels are evidence-based synthesis from public sources, not formal lifecycle labels published by the
      company.
    data:
      columns:
        - Public maturity
        - Primary evidence
        - Main dependency
        - Main risk
      rows:
