            body: >-
              Precedence Research, MarketsandMarkets, and Mordor Intelligence each publish a different global
              biometrics/digital-identity market estimate, and none breaks out Brazil specifically. This chapter
              substitutes Febraban's total bank technology budget and Unico's own disclosed scale as proxies, but a
