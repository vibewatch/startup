            body: >-
              Unico discloses no gross margin, cost-of-service, or capex figures, so margin drivers must be inferred
              from category comparables and qualitative signals. Unico closed 2024 with its first positive EBITDA (an
              operating cash-generation measure that management and press coverage explicitly distinguish from net
