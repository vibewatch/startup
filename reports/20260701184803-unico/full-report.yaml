  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              Unico monetizes identity verification primarily through per-transaction fees charged to banks, retailers,
              telecoms and gig platforms across at least three product lines: core IDCloud biometric/document
              verification, IDPay (a card-not-present ecommerce identity check that processed more than 1.5 billion card
              transactions in its first six months on the market) and ID Unico (ongoing re-authentication for existing
              accounts, used by two of the three most valuable financial/retail companies in Latin America per a 2024
              company statement). None of these streams has a disclosed per-transaction price or an audited revenue
              breakdown; Unico does not publish a price list, which is standard for this category. Unico serves more
              than 800 client companies, including named clients Havan, Magazine Luiza, Banco Neon and Vivo, spanning
              banking, retail and telecom. The company's 2026 product direction, IDCloud One, unifies previously
              separate biometric-collection, document-validation and behavioral-analysis products into a single
              integration, aimed at cutting enterprise implementation time from months to days, a packaging change that
              should reduce sales-cycle friction and could improve realized pricing over time even without a published
              price list. A newer, smaller revenue line, Unico Skill (an education-sector spin-off now run by former CEO
              Sergio Chaia), appears immaterial to core financials but its consolidation treatment is unclear and worth
              confirming in diligence.
            claimRefs:
