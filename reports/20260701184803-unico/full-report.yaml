  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Unico lands through a high-risk identity moment, then tries to reuse the same identity layer across later customer
      journeys.
    data:
      nodes:
        - id: need
          label: High-risk digital moment
          detail: >-
            A bank, wallet, retailer, or betting operator needs stronger identity assurance at onboarding, credit, or
            checkout.
        - id: integrate
          label: Initial integration
          detail: The enterprise integrates biometrics, document validation, or liveness into the first critical flow.
        - id: recognize
          label: Network recognition
          detail: Known faces and documents can be reused so returning users avoid repeating the heaviest capture steps.
        - id: approve
          label: Conversion and fraud outcome
          detail: The operator measures approval lift, lower manual review, lower fraud, or faster activation.
        - id: expand
          label: Expand into adjacent flows
          detail: >-
            The same identity layer is reused for payment links, high-value approvals, digital credit, or recurring
            authentication.
        - id: renew
          label: Renewal test
          detail: The loop only becomes durable if usage expands and renews, but public NRR and churn data are absent.
    approximationNotes: >-
      This map is qualitative because public evidence describes stages and loops, not standardized stage-by-stage
      conversion percentages across customers.
    claimRefs:
      - CU013
      - CU018
      - CU021
      - CU027
      - CU031
      - CU046
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The public evidence supports a staged enterprise flow from fraud pain to production rollout and then to
      transaction-level expansion, but not numeric stage conversion rates.
    data:
      nodes:
        - id: pain
          label: Fraud or compliance pain
          detail: The buyer starts with rejected good users, document fraud, payment fraud, or regulated KYC burden.
        - id: pilot
          label: Implementation sprint
          detail: Public proof often emphasizes fast integration in days or weeks rather than months.
        - id: prod
          label: Production onboarding live
          detail: A live user journey goes into production with biometrics, liveness, or document reuse.
        - id: measure
          label: Operational outcome
          detail: Public case pages then cite approval-rate lift, reduced manual review, or blocked fraud.
        - id: expand
          label: Adjacency expansion
          detail: The enterprise extends the same identity graph into payment, credit, or recurrent auth moments.
      edges:
        - from: pain
          to: pilot
          label: Select vendor
        - from: pilot
          to: prod
          label: Go live
        - from: prod
          to: measure
          label: Read outcomes
        - from: measure
          to: expand
          label: Broaden usage
    approximationNotes: >-
      A flow is used instead of a numeric funnel because the public corpus shows deployment stages and outcomes but not
      a consistent lead-to-close conversion stack.
    claimRefs:
      - CU013
      - CU019
      - CU025
      - CU037
      - CU046
