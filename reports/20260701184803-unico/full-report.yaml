      - number: '2.4'
        title: Constraints, Competition, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Three structural constraints temper the growth drivers above. First, false positives and friction risk:
              the same trade-press coverage that credits biometric verification with cutting bonus abuse also documents
              an 81% cart/registration abandonment rate tied to onboarding friction, implying vendors face a hard
              ceiling on how aggressively they can tighten fraud rules before suppressing the conversion their buyers
              ultimately care about. Second, in-house build risk: Febraban's 2024 survey found 75% of surveyed Brazilian
              banks already use facial biometrics within their own AI applications, and total bank technology budgets
              have more than doubled since 2015 (R$19.1 billion to R$47.4 billion), suggesting the largest banks have
              both the incentive and the capital to insource core biometric matching rather than remain a durable vendor
              market for the long run. Third, regulatory uncertainty: as of the 2026-07-01 report date, Brazil's
              National Data Protection Authority (ANPD) had only opened a public consultation (running through July 9,
              2026) on its technical age-assessment guidance -- the operative rules that will determine exactly which
              technologies satisfy the Digital ECA mandate remain provisional, not finalized.


              Competitive intensity adds a fourth constraint. VU Security, an Argentina-headquartered competitor, told
              Startupi in July 2025 that it protects more than 350 million identities across 30 countries, targets the
              same finance, gambling, retail, government, health, and telecom segments as Unico, invests 20-25% of
              revenue in R&D, and was targeting 30% revenue growth for 2025 -- evidence that Unico faces at least one
              well-resourced, similarly positioned rival rather than operating in an uncontested category. No
              independent, audited win-rate or market-share benchmark comparing Unico and VU Security (or any other
              named competitor) was found during this research pass, which this chapter treats as an open diligence
              question rather than an assumed Unico advantage.
