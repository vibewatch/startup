      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Unico shows no public evidence of active IPO preparation; its most recent capital-markets activity remains
              the private Series D, so a public listing appears distant and M&A or a further private round are the more
              likely near-term liquidity paths, consistent with its pattern of being an acquirer (Trully, Oz Forensics,
              OwnID) rather than showing acquisition or listing signals of its own. Its founder-CEO, Diego Martins, has
              remained the consistent public face of the company's fundraising, M&A, and litigation-response narrative
              since the 2021 unicorn round, which provides continuity but also concentrates key-person dependency.
              Before any new capital commitment, five diligence asks should be resolved: whether the ~$2.6 billion
              figure reflects any event since April 2022; the current status and potential damages of the Serasa
              Experian litigation; independently audited model-performance and anti-spoofing certification; audited
              revenue and margin disclosure by geography and product line; and concrete post-acquisition integration
              proof for Trully, Oz Forensics, and OwnID. Until this package is available, the thesis should be
              underwritten on growth-narrative momentum tempered by real legal, regulatory, and valuation-staleness
              risk, not treated as a straightforward continuation of the 2022 unicorn story.
            claimRefs:
              - CV033
              - CV034
              - CV035
