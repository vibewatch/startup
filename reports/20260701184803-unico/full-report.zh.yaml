      - number: '4.2'
        title: 公开增长牵引力与 GTM 效率代理
        blocks:
          - type: paragraph
            body: >-
              Unico 的公开牵引力信号显示，头部增长强劲但在放缓，国际扩张速度则快得多。2024 年，也就是公司 首个盈利季度所在年份，收入同比增长约 50%；到 2026 年 Q1，合并收入同比增长放缓至
              34%，但管理层 维持 2026 全年 30% 到 40% 增长指引。同一季度身份验证交易量同比增长 84%，国际收入同比增长 130%， 由墨西哥领跑；墨西哥交易量翻三倍，并较上一季度增长 204%。Unico
              2024 年处理 608 million 笔身份交易， 并预计下一年验证量约 3x 增长。没有公开来源披露 Unico 的获客成本、销售周期长度或回本周期，因此 GTM 效率无法直接对标；最接近的效率代理是
              Growjo 第三方估计的约 $434,000 人均收入，该估计基于未经 验证的 $359.7 million 收入和 828 名员工数，而员工数本身又与 Tracxn 另报的 647 人相差近 30%。
              与公司相连的反欺诈数字也不一致：Unico 首页称每年防止超过 $7 billion 欺诈，而 2026 年一次媒体采访 引用 R$3.2 billion
              数字，且方法更窄。这说明该品类的公开牵引力指标应被视为方向性、受公司影响的信号， 而不是经审计 KPI。
