      - number: '2.4'
        title: 约束、竞争与监管风险
        blocks:
          - type: paragraph
            body: >-
              三个结构性约束压住上述增长驱动。第一是假阳性和摩擦风险：同一组行业媒体既称生物识别验证 能减少奖金滥用，也记录开户注册摩擦导致 81% 购物车 / 注册放弃率。这意味着供应商在收紧反欺诈
              规则时有硬上限；过线就会压低买方真正关心的转化率。第二是自建风险：Febraban 2024 年调查显示， 75% 受访巴西银行已经在自有 AI 应用中使用人脸生物识别，银行技术总预算自 2015
              年以来增加一倍多 （R$19.1 billion 到 R$47.4 billion）。最大银行既有动机也有资本把核心生物识别匹配内化，而不是 长期留给供应商市场。第三是监管不确定性：截至 2026-07-01
              报告日，巴西 National Data Protection Authority（ANPD）只是就其技术年龄评估指南开启公开咨询（至 2026 年 7 月 9 日）；决定哪些技术 满足 Digital ECA
              要求的操作规则仍是临时稿，尚未定稿。


              竞争强度构成第四个约束。总部在阿根廷的竞争对手 VU Security 于 2025 年 7 月告诉 Startupi， 它在 30 个国家保护超过 350 million 个身份，瞄准与 Unico
              相同的金融、博彩、零售、政府、医疗和 电信分层，把收入的 20–25% 投入 R&D，并以 2025 年收入增长 30% 为目标。这说明 Unico 至少面对一个
              资源充足、定位相近的对手，不是在无竞争品类里运营。本轮研究没有找到独立、经审计的胜率或市占率 基准来比较 Unico 与 VU Security（或任何其他具名竞争对手）；本章把它视为开放尽调问题，而不是 默认
              Unico 占优。
