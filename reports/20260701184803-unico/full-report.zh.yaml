      - number: '7.5'
        title: 竞争、M&A 整合、国际扩张与人员风险
        blocks:
          - type: paragraph
            body: >-
              Unico 的竞争对手包括资本充足的全球身份核验供应商——Jumio、Onfido（现为 Entrust 一部分）、Veriff 和 AU10TIX；也包括把原生 passkey 和身份能力直接嵌入操作系统的
              Big Tech 平台；还包括行业内的重定价压力：Incode Technologies 据称在 2025 年底洽谈最高 $3 billion 的估值，而 Onfido 被母公司收购后，2025
              年披露的独立估值降到约 $163 million，说明同一同行集合内的结果可以大幅分化和压缩。Unico 采取激进的连续收购策略来搭全球平台：2024 年收购 Trully（墨西哥）和 Oz
              Forensics（UAE），2025 年 9 月收购 OwnID（美国 / 以色列无密码认证；每月为包括 Nestlé、SAP、NFL 和 Michael Kors 在内的客户提供约 350
              万次认证），OwnID 继续以 “OwnID by Unico” 运营。三笔交易都没有公开披露收购后整合指标——客户留存、交叉销售 attach 绑定率、技术平台整合。Unico 又在这些 M&A
              动作之上叠加了新的 Silicon Valley 总部（2026 年 4 月 1 日在 Menlo Park 开设）和来自 Meta、Apple、Google 的高管招聘，同时报告 2026 年 Q1
              身份核验交易量同比增长 84%、国际收入增长。合规响应、三家被收购业务整合和新市场高管团队搭建同时推进，把相当大的执行风险压在领导团队身上；而对外公开面仍主要是创始人兼 CEO Diego
              Martins。公司公开员工数估计在相近时期也不一致（约 647 到 828 人），说明存在报告时间口径噪音，尽调应直接向公司核清。
