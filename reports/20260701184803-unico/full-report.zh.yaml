      - number: '1.4'
        title: 规模、里程碑与 2025–2026 年全球扩张
        blocks:
          - type: paragraph
            body: >-
              Unico 自身披露长期给出一系列规模指标：一项委托 FGV 完成的研究显示，2018–2023 年累计 850 million 次人脸生物识别认证，估计五年 GDP 影响达 R$8.6 billion；截至
              2023 年 9 月， ID Unico 产品在四家银行和九家零售商中记录 735 million 笔交易，并拦截 10 million 起欺诈； IDPay 产品在 2023 年上线后的六个月内处理超过 1.5
              billion 笔信用卡交易。Unico 在 World Economic Forum 档案中另称，公司 2023 年在超过 165 million 用户和超过 20 个国家中 防止了超过 $14 billion
              的欺诈。


              2024–2026 年，公司在既有规模上叠加并购（2024 年 9 月 Oz Forensics 和 Trully.AI； 2025 年 9 月 OwnID），把平台延伸到 deepfake
              检测、墨西哥市场，并借 OwnID 的标志性客户 IOC、Bayer、Carrefour、Michael Kors、Nestle 和 NFL 正式进入美国市场。2026 年 4 月， Unico 在加州
              Menlo Park 开设新的全球总部，聘入来自 Meta、Apple 和 Google 的高管；到 2026 年 Q1，公司报告身份验证交易量同比增长 84%，墨西哥增长尤其快。2026 年 3 月在
              SXSW， Unico 称其认证量已超过 1.5 billion 次，且误接受率为 0%；公司把 2025 年欺诈尝试同比增长 1,082% 作为理由，称 AI 驱动攻击在 2026 年还可能再上升
              150–550%。独立来源对完成并购总数 给出两个版本：九起（Biometric Update，2025 年 9 月）或十起且 2022 年以来四起（Startupi， 2025 年 12
              月）。本章把这一差异视为未解矛盾，而不是强行调和。
