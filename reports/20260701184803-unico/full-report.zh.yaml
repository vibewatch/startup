      - number: '3.3'
        title: 全球身份验证专家公司及其进入拉美的路径
        blocks:
          - type: paragraph
            body: >-
              巴西之外，Unico 最重要的竞争对手是全球身份验证专家公司；其中大多数在已披露收入或 ARR 上已经 更大，并正积极争夺拉美分发。Jumio 在新 CEO Mark Lorion 领导下，于 2026 年 4
              月在整个拉美推出 selfie.DONE 可复用身份产品，直接挑战 Unico 的核心可复用身份主线。Socure 报告 2026 年 Q1 总 ARR 超过 $340 million（同比增长
              62%，净美元留存 134%），并取得 FedRAMP Moderate 授权，扩大了可服务的 美国公共部门业务，尽管其已披露巴西足迹仍有限。Veriff 称收入翻倍并超过 $100 million，且到
              2025 年 12 月实现盈利；Persona 则在 2025 年 4 月以 $2 billion 估值融资 $200 million，服务 OpenAI 和 LinkedIn 等 AI
              原生企业客户。Onfido 在 2024 年 4 月被 Entrust 收购后并入后者， 首份收购后申报显示收入下降 10% 至 £86.8 million，并裁员 19%；对于曾在证件 / 生物识别验证上与
              Unico 正面竞争的同业，这是整合摩擦的负面信号。AU10TIX 和 Incode 构成其余样本：AU10TIX （ICTS International 子公司）强调联盟式欺诈信号网络；Incode
              是聚焦拉美的竞争者，背后同样有 General Atlantic 和 SoftBank 这两家 Unico 支持方，据 2025 年 11 月报道，曾洽谈以 $3 billion 估值最多融资 $300
              million，凸显投资人仍愿意为区域内进一步整合或资本密集竞争买单。
