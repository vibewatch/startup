              2026 年初记录到的博彩用户 50% 激增，以及随之而来的欺诈和验证需求，明确绑定世界杯驱动的 iGaming 活动。本章假设这部分 2026 年增长有一部分会延续到 2027 年及以后，但不会全部延续；尽调要
              做的是把任何 2026 年收入增长中世界杯驱动的份额，与底层长期趋势分开。
