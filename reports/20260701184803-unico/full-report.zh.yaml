  - id: TV005
    title: 投资论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Serasa 诉讼不利解决
        - 裁定或和解确认系统性、未被发现的生物识别数据转移
        - 削弱对 Unico 自身渠道监控和数据治理控制的信心
        - 重新评估增长论点，并为治理风险打折
      - - ANPD 或巴西央行执法行动
        - 确认罚款或制裁，且与 Unico 或客户使用其技术有关
        - 意味着仍在成形的巴西监管框架落地结果不利
        - 重新评估监管顺风牛市情景的规模和持久性
      - - 独立模型 / 活体审计失败，或始终拿不出来
        - 尽管公开深伪风险警示反复出现，仍没有认证
        - 表明技术护城河没有跟上 Unico 自己描述的威胁环境
        - 下调对核心产品论点的信心
      - - 融资事件持平或下调定价
        - 新一轮、二级出售或 409A 估值标记等于或低于 2022 年 $2.6B
        - 确认估值此前已经过时且偏高
        - 将估值立场从偏高重评为公允，或事后看偏贵
      - - 国际增长显著减速
        - 国际收入增长连续两个季度低于 50% YoY
        - 削弱支撑溢价定价的硅谷 / 全球平台叙事
        - 将美国 / 阿联酋 / 墨西哥扩张视为表现不及预期，并下调增长假设
    notes: 触发项按可观察事件设计，避免把亮眼增长指标误当成估值或治理风险已经解除。
    claimRefs:
      - CV036
      - CV007
      - CV011
      - CV019
      - CV009
      - CV041
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 估值刷新
        - 确认 $2.6B 到底反映新一级融资轮、二级交易或 409A 估值标记，还是只是沿用 2022 年 4 月数字
        - 如果不知道价格自 2022 年以来是否真的变化，当前估值立场无法定稿
        - 直接向 Unico 或其投资人要求最新股权表估值和融资时间线
      - - 诉讼状态
        - Unico v. Serasa Experian 案件的当前状态、指称损害及任何和解条款
        - 案件状态会实质影响监管风险和声誉，且案件处于司法保密
        - 司法保密解除后，或通过授权披露，聘请外部律师提供案件状态简报
      - - 模型表现审计
        - 经独立审计的误接受 / 误拒绝率，以及活体 / 反欺骗认证
        - 验证技术护城河是否匹配 Unico 自称升级中的欺诈威胁
        - 要求提供 iBeta/FIDO PAD 认证报告，或委托独立红队测试
      - - 收入与利润率披露
        - 经审计收入、毛利率，以及按地域和产品线（核心 IDV vs. OwnID 通行密钥）拆分的细节
        - 需要用这些数据检验增长指标是否能转化为站得住的单位经济账
        - 要求提供经审计财务，或 NDA 下由管理层准备的分部 P&L
      - - M&A 整合证据
        - Trully、Oz Forensics、OwnID 收购后的留任、交叉销售和整合指标
        - 连续收购如果没有整合证据，会在任何估值模型中埋下执行风险
        - 要求提供每个被收购单元的队列留存和整合里程碑数据
    notes: 这五项是从情景化估值观点走向站得住脚的入场价格所需的最低证据包。
    claimRefs:
      - CV034
