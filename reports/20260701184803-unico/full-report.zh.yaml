  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Unico 至少面对五类替代选择：巴西本土身份 / 反欺诈科技公司（Certta、idwall）；新近整合后的 征信局既有巨头（Serasa Experian，如今同时拥有 ClearSale 和
              idwall）；政府运营的既有基础设施 （Serpro 的 IBio 生物识别库和 gov.br 国家数字身份项目）；正在进入拉美的全球身份验证专家公司
              （Jumio、Socure、Veriff、Persona、Onfido/Entrust、AU10TIX、ID.me）；以及 Unico 最大银行和
              零售客户可选择的内部自建。这个市场比两年前看起来集中得多：巴西身份和反欺诈市场正快速向 Serasa Experian 集中，后者 2025 年以约 R$2 billion 收购 ClearSale，又在
              2026 年同意以约 R$450 million 收购 idwall，仍待反垄断批准。Certta（Caf 在 2026 年更名后）仍是 Serasa 伞外 最可信的巴西纯身份竞争者，并明确把 Unico 和
              idwall 列为主要对手。放到全球，Jumio、Socure、 Veriff 和 Persona 在已披露收入或 ARR 上都大于 Unico 公开确认过的任何数字，并且多家公司正把
