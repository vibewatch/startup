    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Unico 的运营闭环从采集或交易事件开始，叠加模块化身份核查，再返回一个可在后续时点复用的决策。
    approximationNotes: 这条流程把多个产品变体压缩成一张运营图，因为公开资料把它们描述为同一平台里的可互换模块。
    data:
      nodes:
        - id: trigger
          label: 客户时点启动
          detail: 注册、登录、转账、支付、年龄门槛或签署请求触发流程
        - id: capture
          label: 采集或上下文收集
          detail: 自拍照、证件、支付卡、设备元数据或 API 图像进入流程
        - id: decide
          label: 模块化身份决策
          detail: 按配置触发活体、身份、欺诈风险、数据核验或年龄模块
        - id: route
          label: 自适应路由
          detail: 系统返回是 / 否 / 无结论，或选择静默、Passkeys 或生物识别挑战
        - id: fulfill
          label: 业务动作执行
          detail: 账户开立、交易继续、访问放行，或签署工作流继续
        - id: reuse
          label: 状态和历史复用
          detail: 结果会影响后续重新验证、1:N 核查、支付和反欺诈决策
      edges:
        - from: trigger
          to: capture
          label: 触发
        - from: capture
          to: decide
          label: 输入
        - from: decide
          to: route
          label: 返回
        - from: route
          to: fulfill
          label: 支撑
        - from: fulfill
          to: reuse
          label: 沉淀历史
        - from: reuse
          to: decide
          label: 改进后续决策
    claimRefs:
      - CE002
      - CE004
      - CE007
      - CE009
      - CE011
      - CE028
  - id: FE003
    title: 关键依赖图
    type: dag
