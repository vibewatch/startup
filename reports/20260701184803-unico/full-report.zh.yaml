            body: >-
              公开证据显示，Unico 嵌在大型、对欺诈敏感的客户旅程里，而不是靠自下而上卖给消费者的软件。付款侧最可见的买方，是大型银行、fintech、承担数字信贷或结账风险的零售商，以及需要受监管
              开户流程和欺诈控制的博彩运营商。终端用户则不同：被核验的是开户申请人、持卡人、投注者、借款人或市场平台消费者；付款方是运营这条流程的企业。最宽的规模口径来自公司当前页面或伙伴页面：服务 800
              多家公司，覆盖巴西前五大银行中的四家、十大品牌中的七个，网络内有 1.7 亿多张人脸。具名公开证据在巴西私营银行、支付、零售信贷和博彩走廊最强。政府身份基础设施在巴西显然规模很大，但本次审阅的公共部门来源没有点名
              Unico 是供应商，因此政府应被视为机会空间，而不是已证实的客户集中度。
