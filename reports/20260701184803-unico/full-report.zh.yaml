  - id: TV004
    title: 可比公司估值表
    columns:
      - 可比公司
      - 2026 年价值 / 状态
      - 收入或规模证据
      - 为什么重要
      - 局限
    rows:
      - - Incode Technologies
        - 据报道，2025 年末洽谈估值最高 $3B
        - 媒体报道 ARR 约 $170M
        - 显示直接可比的 AI 身份识别同行，定价高于 Unico 上一轮标记
        - 只是报道中的谈判，尚非已完成且确认的融资轮
      - - Onfido（Entrust 收购后）
        - 披露独立估值约 $163M（2025）
        - 此处未独立披露
        - 显示知名同行被收购后估值可能大幅压缩
        - Onfido 收购后的结构让独立比较并不完美
      - - Veriff
        - $1.5B（2022 年 1 月 Series C，融资 $100M）
        - 该轮融资时，报道称 IDV 量同比增长 800%
        - 一家年龄和规模相近的同行，估值更低、总融资额也小于 Unico
        - 估值已超过四年，同样存在 Unico 标记的过时问题
      - - Persona
        - $2B（2025 年 Series D，融资 $200M；高于 2021 年 $1.5B）
        - 据报道客户数同比翻倍；300M+ 次验证
        - 最新定价的可比公司，比 Unico 自己的 2022 年标记更新鲜
        - 以美国客户为主，与 Unico 锚定巴西的分发不同
      - - AU10TIX
        - 约 $260M（2019 年 TPG Tech Adjacencies 投资，2026 年仍被引用）
        - 估计年收入约 $34-35M
        - 显示较小同行也背着比 Unico 更旧的估值参照
        - 2019 年旧数字，说明该赛道过时标记很常见
      - - Jumio
        - 已被收购 / PE 支持；估值未披露
        - 估计年收入约 $252.7M，总融资约 $205.4M
        - 在 Unico 不披露经审计收入时，提供收入规模参照
        - 第三方数据平台的估算收入，未经审计
    notes: 该表混合了已披露私有估值、洽谈中数字和第三方收入估计；由于这组同行普遍缺乏经审计财务，它不是严格的 EV / 收入可比表。
    enumerationScope:
