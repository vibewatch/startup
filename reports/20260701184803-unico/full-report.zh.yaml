      - number: '1.5'
        title: 负面信号、竞争风险与监管背景
        blocks:
          - type: paragraph
            body: >-
              Unico 的增长叙事并非一路顺风。2023 年 1 月，公司在三个月内两轮裁员，至少削减 150 名员工（约 10.5% 员工数）；独立媒体 InfoMoney 将裁员与人脸生物识别竞争加剧联系起来， 并引用
              Unico 自身承认人脸生物识别已经「成为市场上的一个选项」。再早一年，行业媒体在分析 2022 年 8 月 MakroSystems 收购时，称 Unico 核心「Check」身份验证产品的创收能力在「减弱」，
              并把公司的并购式多元化描述为对这种压力的回应。


              竞争紧张在 2026 年 6 月更尖锐地浮出水面。Unico 对 Serasa Experian（Experian 的巴西子公司） 及其 ClearSale 部门提起刑事和民事诉讼，指控它们通过中介 Skill
              Tecnologia 不当访问 Unico 的人脸生物识别技术；Skill Tecnologia 与 Unico 签有 Banco do Brasil 独家合同，却被 指用于争夺其他银行客户。Unico
              起诉称，已识别至少 1.4 million 笔不当验证交易，样本反映的 查询可能涉及约 22 million 名巴西人，Inter、BTG 和 Itau 等银行在不知情中被卷入； Serasa Experian
              否认指控，案件正在密封程序下推进。另一个监管维度是巴西 National Data Protection Authority（ANPD），它直接监管 Unico 这类公司如何处理生物识别和其他敏感个人数据；
              Unico 也发布了自身伦理与合规政策，涉及负责任使用生物识别数据和 AI。合在一起，裁员、 「减弱」的产品描述和正在进行的诉讼，是目前最清晰的信号：Unico 所处市场有真实竞争和监管压力，
              并不是只会线性扩规模。
