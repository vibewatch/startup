            body: >-
              Unico 也在借平台扩大产品边界。DevHub 和独立文档界面显示了 Sign、People、IDPay、Auto、SAML SSO、SCIM
              开通配置等相邻模块。这很重要，因为它把公司从单纯核验供应商，推向更宽的身份与工作流平台供应商，但成熟度并不均衡。People 和 Sign 看起来是有 API 和具体运营语言的真实产品；不过，Sign
              在公开定位上更像与 People 兼容的文档签名模块，而不是独立的身份旗舰。相比之下，IDPay 与支付证明工作流和发卡方集成绑定很深，更接近身份核心。收购路径也在拓宽能力：Oz Forensics 加入反
              deepfake 技术，Trully 保留墨西哥专用开户注册合同，OwnID 把栈延伸到 passkey 和无密码登录。最后，部署成熟度不只是产品问题：一个客户案例和本地媒体都显示，Unico
