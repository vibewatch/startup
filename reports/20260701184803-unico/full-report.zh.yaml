      - number: '7.3'
        title: 模型 / 性能与网络 deepfake 风险
        blocks:
          - type: paragraph
            body: >-
              Unico 的核心价值主张，是可靠地区分真人活体与欺骗或合成身份；这个主张正面对加速恶化的对抗环境。在 SXSW 2026，Unico 自己的研究估计，复杂的 AI 加持欺诈攻击在 2026 年可能增加
              150-550%，而 2025 年数字欺诈尝试已经同比增加 1,082%。全行业看，针对身份核验系统的 deepfake 事件据称已上升约
              3,000%；“注入攻击”——把合成视频或音频通过虚拟摄像头或驱动直接喂进核验管线，完全绕过物理摄像头——现在被描述为主导攻击向量，而不是实体面具或照片欺骗。Unico 声称处理超过 12
              亿次身份认证，并阻止了超过 $7 billion 的金融欺诈，但这些数字由公司自报；没有公开、独立审计的误受 / 误拒率、人口统计偏差测试方法，或第三方活体 /
              反欺骗认证，可以验证模型面对其所称的主导注入攻击威胁时的真实防御表现。评估 Unico 技术护城河是否跟上它所描述的威胁环境时，这是最大的单一证据缺口。
