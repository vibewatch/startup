    summary: 客户承诺能兑现，采集可靠性、身份库质量、合作伙伴数据、区域合同和抗攻击生物识别都必须撑住。
    approximationNotes: 这些依赖是公开可见的卡点，不是完整内部服务图。
    data:
      nodes:
        - id: clients
          label: 客户应用和渠道
          detail: 银行 App、钱包流程、商户结账、流媒体或博彩前端
        - id: sdk
          label: SDK / webview 采集层
          detail: 浏览器、原生 App 或托管流程的兼容性和权限
        - id: engine
          label: 生物识别决策引擎
          detail: 活体、身份、欺诈、年龄和自适应认证路由逻辑
        - id: search
          label: 1:N 与向量检索后端
          detail: 大规模人脸检索、嵌入和匹配状态
        - id: partners
