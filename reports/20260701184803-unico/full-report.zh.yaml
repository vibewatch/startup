      - - 悲观
        - Serasa 诉讼揭示系统性渠道监控失灵并引发监管制裁，竞争 / 科技巨头压力压缩定价权，新一轮相对 2022 年持平或下调
        - 1.0-2.0
        - 更多诉讼暴露或已披露降估值融资证实熊市情景
