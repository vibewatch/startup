      - number: '2.2'
        title: 测算：TAM/SAM/SOM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              三家独立分析机构都估算了全球生物识别或数字身份解决方案市场，但彼此对不上。Precedence Research 估计 2024 年全球生物识别市场为 $50.08 billion，到 2034 年增至
              $307.24 billion， CAGR 为 19.89%。MarketsandMarkets 在 2025 年 11 月发布的更宽「数字身份解决方案」定义下， 估计 2025 年市场为 $44.20
              billion，到 2031 年增至 $132.14 billion，CAGR 为 20%。 Mordor Intelligence 估计 2025 年为 $58.98 billion，2026 年为
              $67.86 billion，到 2031 年为 $136.86 billion，CAGR 为 15.07%。无论当年基线（约 $44 billion 到 $68 billion）还是远期预测 （约 $132
              billion 到 $307 billion），差距都来自市场范围定义和预测区间不同，而不是能调和成 一个单一数字；本章保留这种矛盾作为证据，不用平均值抹平。


              三家机构都没有披露巴西拆分。本章改用两个巴西特定代理：Febraban 2024 年银行技术调查显示， 巴西银行 2024 年技术预算为 R$47.4 billion（高于 2023 年 R$39 billion
              和 2015 年 R$19.1 billion）， 受访银行 100% 把网络安全列为优先事项，75% 已在 AI 应用中使用人脸生物识别。这是可服务市场的 买方预算上限代理，不是身份专项数字。另一项代理是
              Unico 自身披露的规模：超过 3 billion 次验证、 超过 400 家客户公司、超过 25 个国家，作为公司特定的可获得市场信号。World Bank ID4D 计划另从 需求侧量化缺口：全球 800
              million 人没有任何官方身份证件，2.8 billion 人没有可用于线上交易的 数字身份。这个需求缺口方向上支持市场继续增长，但它本身不是供应商支出估计。
