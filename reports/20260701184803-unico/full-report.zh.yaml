      - number: '4.3'
        title: 成本结构、利润率驱动因素与服务交付成本
        blocks:
          - type: paragraph
            body: >-
              Unico 没有披露毛利率、服务成本或资本开支数字，因此只能从品类可比公司和定性信号推断利润率驱动因素。 Unico 2024 年以首次正 EBITDA
              收官；管理层和媒体报道明确把这一运营现金生成指标与税后、利息和折旧后的 净利润区分开。此前公司在 2024 年 1–3 月季度实现 R$14 million 净利润，并在 2024 年 4 月单月实现 R$22
              million。可比供应商提供了一些利润率驱动背景：Veriff 称收入翻倍超过 $100 million 并实现盈利； Socure 报告净美元留存 134%，年经常性收入增长
              62%。两者都说明，平台型身份验证一旦建立规模，单位经济 性可以改善。最清晰的利润率风险可比样本是 Onfido，其并入 Entrust 后首份申报显示收入下降 10% 至 £86.8 million，同时裁员
              19%；这说明并购整合（Unico 自己也在用 Trully、Oz Forensics 和 OwnID 执行） 即便能改善经营亏损，也可能压迫独立收入和利润率。Serpro
              生物识别库等政府运营基础设施，为低风险公共 用例提供接近零边际成本的验证，可能给包括 Unico 在内的私营供应商在类似低风险交易上的可实现定价和利润率 设上限。
