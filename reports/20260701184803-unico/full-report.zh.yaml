  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Unico 横跨五个重叠产品赛道竞争：用于 KYC 和开户注册的数字身份验证、生物识别认证 （人脸、语音和活体检测）、反欺诈分析、年龄验证和年龄保障，以及 deepfake / 注入攻击检测。
              纳入测算的支出包括软件许可、按次验证 API 费用，以及支撑活体和反欺骗检查的机器学习模型； 排除的支出包括实体生物识别采集硬件和门禁闸机，它们完全落在另一套设施安全预算里。


              清晰的市场边界把这类可触达的私营供应商支出，与政府提供的数字身份分开。巴西联邦 Conta gov.br 平台和 Carteira de Identidade Nacional（CIN）使用 CPF
              作为统一标识，由国家 直接免费向公民发放和运营。这块市场相邻，但 Unico 这类商业供应商大体碰不到， 因为政府既是付款方又是身份发行方，不是客户。身份验证供应商替代的现状方案，是人工、 以证件为基础的 KYC
              审核；流程更慢、吃人力，生物识别自动化正是被卖来替换它。


              监管背景进一步收紧边界。巴西 LGPD（Lei 13.709/2018）明确把生物识别数据列为「敏感个人数据」， 其处理规则严于普通个人数据；因此，供应商把隐私内建和同意管理作为产品功能销售，而不是合规附加项。
              这种敏感数据分类，加上政府运营身份层被排除，共同定义了本章测算的可触达市场。
