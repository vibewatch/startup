      - - 2024 年收入增长
        - ~50% 同比（Brazil Journal，2024 年）
        - 中
        - 构成 2026 年指引的增长基数
        - 索取更新后的 2025 年和 2026 年实际数据
      - - 2026 年 Q1 综合收入增长
        - 同比 34%（idtechwire）
        - 中
        - 2024 年同比 50% 的增速已经放缓，但 FY2026 指引仍为 30-40%
        - 将季度节奏与全年指引对齐核验
      - - FY2026 收入增长指引
        - 30%-40%（公司通过 idtechwire 给出的指引）
        - 中
        - 公司给出的前瞻指引，尚未成为经审计实际值
        - 跟踪 FY2026 实际业绩与该指引的偏差
      - - 国际收入增长（Q1 2026）
        - 同比 +130%（idtechwire）
        - 中
        - 说明国际扩张的增速远快于合并口径基盘，但起始收入规模更小
        - 要求披露国际收入的绝对美元金额
