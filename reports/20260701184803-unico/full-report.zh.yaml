      - number: '7.6'
        title: 资本 / 估值、采购风险与缓释
        blocks:
          - type: paragraph
            body: >-
              Unico 最近一次披露的一手融资，是 2022 年 4 月由 Goldman Sachs 领投、General Atlantic 和 SoftBank 参与的 $100 million Series
              D；2025-2026 年媒体广泛引用的约 $2.6 billion 估值，并没有清楚绑定一轮新的定价融资。公开信息也没有更近的一手融资、409A
              估值或董事会批准的公允价值更新，因此该数字可能来自二级交易或分析师估算，而不是新的一手估值。需求侧，Unico 的增长策略依赖受监管金融机构，以及新形成的 Digital ECA
              年龄保证市场，把合规义务转成已签合同；这类客户通常需要比单看交易量增长更长、更保守的安全审查和采购周期。合在一起，本章风险登记表把公司的公开增长和诉讼叙事，压缩成少数可监控阈值：Serasa
              诉讼结果确认系统性渠道监控失败、ANPD 执法行动被确认、独立活体 / PAD 认证失败，或新一轮融资相对 2022 年 Series D 持平到下行定价。任何一项都应触发对当前增长与技术护城河论点的即时重估。
