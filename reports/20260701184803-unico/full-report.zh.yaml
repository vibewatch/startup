  - id: FM004
    title: 巴西身份验证采用与价值链流
    type: flow
    layout: wide
    summary: 采用路径从欺诈或监管触发因素开始，经过供应商评估、试点部署和续约；自建分支会压缩供应商可触达支出。
    data:
      nodes:
        - id: trigger
          label: 欺诈或监管触发因素
          detail: Pix 欺诈增长、Digital ECA 年龄保障要求或 LGPD 敏感数据义务，都会形成采购指令。
        - id: evaluate
          label: 买方评估供应商
          detail: 合规 / 风险或信任与安全负责人发起 RFP，或与具名竞争对手做供应商比较。
        - id: pilot
          label: 试点 / 概念验证集成
          detail: 供应商以有限范围接入开户或交易流程。
        - id: deploy
          label: 覆盖开户与持续认证的全面部署
          detail: 试点成功后，扩展到生产环境的 KYC、年龄验证或欺诈风险分类工作流。
        - id: renew
          label: 续约或扩展到新用例
          detail: 部署延展到年龄验证、深度伪造检测等相邻用例。
        - id: inhouse
          label: 自建替代路径
          detail: 具备内部 AI 能力和大额技术预算的大型银行，可能把生物识别匹配收回内部，而不是采购。
      edges:
        - from: trigger
          to: evaluate
          label: 形成采购指令
        - from: evaluate
          to: pilot
          label: 选择供应商
        - from: pilot
          to: deploy
          label: 验证
        - from: deploy
          to: renew
          label: 扩大范围
        - from: evaluate
          to: inhouse
          label: 替代路径
        - from: inhouse
          to: deploy
          label: 绕开供应商支出
    approximationNotes: 节点顺序根据供应商 / 竞争对手销售落地信息，以及 Febraban 调查中银行内部 AI 采用情况推断；不是来自单一成文买方旅程研究。
    claimRefs:
      - CM034
      - CM019
      - CM044
      - CM042
