  - id: TU005
    title: 扩张和集中度风险表
    columns:
      - 扩张驱动
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - 开户后，在支付链接、类 Pix 审批、数字信贷和重复认证中复用同一身份层
        - 如果少数大型银行或零售商主导使用量，交易增长会掩盖客户集中度
        - 若交叉销售足够广，向上空间很大；若集中，向下风险也很高
        - 按客户细分和前 20 大账户索取模块采用率和 ARR。
      - - 证件复用和既有网络识别降低回访用户摩擦
        - 最强公开证据集中在银行、零售信贷、博彩等监管重、欺诈高发垂直行业
        - 眼下有助转化，但可能压窄行业多元化
        - 索取金融 / 零售 / 博彩之外的销售管线结构和扩张签约额。
      - - 实施速度正从数月缩到数天，部分小客户还能自助接入
        - 实施快不等于合同粘性强，也不能证明欺诈压力正常化后使用量还能留住
        - 如果留存跟得上，可扩大可触达客户数量
        - 按队列审查从实施到上线的转化率和 12 个月客户留存。
      - - 全球收购带来客户、passkey 技术和低摩擦认证通道
        - 跨境增长可能分散对巴西核心企业客户集中度的注意力
        - 有望分散垂直行业和地域暴露
        - 拆分巴西与国际客户数量、使用量和留存。
      - - 政府身份基础设施很大，但已经围绕 gov.br / CIN 建成
        - 没有具名合同时，公共部门上行空间可能比泛化 TAM 幻灯片暗示的更小、更慢
        - 限制一条想象中的扩张路径，也提高了拿下私营部门钱包份额的必要性
        - 搜索采购记录，并将公共部门销售管线与商业销售管线分开索取。
    notes: 本表把可见的先落地、再扩张杠杆，与可能让这些杠杆价值低于表面交易量增长的集中度或渠道风险逐一配对。
