            title: 没有独立来源能调和巴西特定市场规模
            body: >-
              Precedence Research、MarketsandMarkets 和 Mordor Intelligence 各自发布了不同的全球生物识别 / 数字身份市场估计，且都没有单独拆出巴西。本章用
              Febraban 的银行技术总预算和 Unico 自身披露规模 作代理，但买方应把由本章推导的任何巴西 TAM/SAM 数字仅视为方向性参考，而不是独立验证后的数字。
