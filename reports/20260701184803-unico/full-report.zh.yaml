  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - 公司解决方案
      - 可衡量收益
      - 限制
    rows:
      - - 开立受监管数字账户
        - 用户在账户激活前提交自拍、身份数据，有时还提交证件
        - Onboarding 把活体检测、身份验证、欺诈分类和证件采集合在一起
        - 公司称 3 秒即可验证，且首次尝试通过率高
        - 未公开 FRR、偏差或人工审核占比
      - - 无需本地证件逻辑即可全球开户
        - 用户提供自拍和类似标识符的输入，但不一定上传证件图像
        - Non-Document Verification 在同一合同下复用活体检测、人脸匹配和欺诈信号
        - 公司称同一响应 schema 可覆盖 25+ 个国家
        - 按国家划分的失败处理和异常工作流未公开
      - - 注册时识别合成身份或连续欺诈
        - 用户看似合法，但可能复用数据、轮换设备，或跨机构协同
        - Fraud Risk Level Detection 和 Multi-Account Prevention 加入行为分析与 1:N 唯一性搜索
        - 公司称无需增加用户步骤即可发现隐藏风险并提升精度
        - 第三方基准数据未公开
      - - 批准存量交易，或触发挑战
        - 可信用户希望低摩擦完成转账、提现或登录
        - Smart Revalidation 先评估上下文，再路由到静默认证、passkey 或自拍挑战
        - 公开页面称约 90% 的交易可走静默或 passkey 路径通过
        - 未公开事件、滥用或兜底率
      - - 在线证明法定年龄
        - 用户自拍，以访问有年龄限制的产品或内容
        - Age Verification 返回 YES、NO 或 INCONCLUSIVE，并可选择叠加标识符检查
        - 官方和独立来源均称决策快速、二元，且无需上传证件
        - 未公开公平性、申诉或边缘案例处理指标
