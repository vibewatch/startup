  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与收入结构
        blocks:
          - type: paragraph
            body: >-
              Unico 主要靠向银行、零售商、电信公司和零工平台收取按交易计费的身份验证费用变现，至少横跨三条 产品线：核心 IDCloud 生物识别 / 证件验证；IDPay（无卡电商身份检查，上线前六个月处理超过 1.5
              billion 笔卡交易）；以及 ID Unico（面向既有账户的持续再认证，按 2024 年公司声明，拉美三家 最有价值金融 /
              零售公司中的两家在用）。这些收入流都没有披露单笔交易价格或经审计收入拆分；Unico 不公布价目表，在这一品类中属常态。Unico 服务超过 800 家客户公司，包括具名客户 Havan、Magazine
              Luiza、Banco Neon 和 Vivo，覆盖银行、零售和电信。公司 2026 年产品方向 IDCloud One，把过去分开的
              生物识别采集、证件验证和行为分析产品统一到单一集成中，目标是把企业实施时间从数月缩到数天；这种 打包变化应能减少销售周期摩擦，并可能在没有公开价目表的情况下，随时间改善实际成交价格。较新的小 收入线 Unico
              Skill（教育领域拆分业务，现由前 CEO Sergio Chaia 运营）看起来对核心财务不重要， 但其并表处理不清楚，值得尽调确认。
