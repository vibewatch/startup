  - id: TP001
    title: 竞争对手画像表：类别、规模、目标细分市场、差异化
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Unico（基准）
        - 巴西本土 AI 身份龙头
        - 2022 年 4 月 D 轮，估值 $2.6B；SoftBank / General Atlantic / Goldman 支持
        - 巴西银行、零售、政府相邻市场，并向 LatAm / 全球扩张
        - 深度伪造检测、确定性生物识别；声称每年 1.2B+ 次认证
        - 直到 2024 年才披露首个盈利季度；无公开财务数据
      - - Certta（原 Caf）
        - 巴西本土身份 / 欺诈枢纽
        - 2026 年从 L4 / B3 基金 + Parallax 融资 R$50M
        - 巴西市场平台、电信、金融科技（Vivo、iFood、Mercado Livre）
        - 定位为多信号「验证枢纽」；声称 4 年 CAGR 为 67%
        - 未披露绝对收入；规模小于 Unico / Serasa
      - - idwall（Serasa Experian）
        - 巴西本土证件 / 背景核查
        - 2026 年被 Serasa 以约 R$450M 收购，约 5x 收入
        - SMB 和企业 KYC / 背景核查
        - 现与 Experian 征信数据打包
        - 等待 Cade 反垄断批准；失去独立性
      - - ClearSale（Serasa Experian）
        - 巴西本土电商欺诈预防
        - 2025 年被 Serasa 以约 R$2B 收购；曾在 B3 上市（CLSA3）
        - 电商商户
        - KPI 制或固定费用定价；声称 5,000+ 客户
        - 据报道收购前收入下滑；独立披露即将结束
      - - Serpro / gov.br（政府基础设施）
        - 政府现状基础设施
        - 国有；未融资
        - 联邦 / 州机构、受监管私营客户（如通过 Datavalid 接入的 Uber）
        - 300M 张人脸 / 3B 枚指纹；政府用户边际成本近零
        - 在私营部门 UX / CX 用例中不是商业竞争对手
      - - Jumio
        - 全球身份验证专门厂商
        - 总融资约 $197-205M；Mark Lorion 2026 年 4 月出任新 CEO
        - 全球金融科技、旅游、加密、零工平台
        - 支持 5,000+ 种 ID 类型；2026 年 4 月在 LatAm 推出 selfie.DONE 可复用 ID
        - 据报道员工数同比下降约 11%；估值未披露
      - - Socure
        - 全球身份 / 风险决策
        - ARR $340M+（2026 年 Q1），同比增长 62%；上一轮股权融资为 2021 年 $450M，估值 $4.5B
        - 美国银行（前 20 大中的 18 家）、金融科技、公共部门
        - 净美元留存率 134%；获 FedRAMP Moderate 授权
        - 主要聚焦美国；已披露的巴西存在有限
      - - Veriff
        - 全球身份验证专门厂商
        - 总融资约 $200M；2022 年估值 $1.5B
        - 金融科技、出行、游戏、加密
        - 收入翻倍并超过 $100M，且在 2025 年 12 月实现盈利
        - LatAm 渠道深度未经独立验证
      - - Persona
        - 全球模块化身份平台
        - 2025 年 4 月 D 轮 $200M，估值 $2B
        - 企业 / AI 原生平台（OpenAI、LinkedIn、Etsy）
        - 用模块化工作流 / 图架构编排多类核查
        - 新进入者；已披露的 LatAm 银行渗透有限
      - - Onfido / Entrust
        - 全球身份核验厂商，现由 PE 控股
        - Entrust 已完成收购（2024 年 4 月）；截至 2024 年 1 月财年收入降 10% 至 £86.8M
        - 面向受监管行业的企业 KYC
        - 借 Entrust 安全套件深度接入企业与合规流程
        - 披露收购后收入下滑，裁员 19%
      - - ID.me
        - 政府 / 消费者身份网络
        - 公司声称会员 136M+；联邦合同经 GAO 审查
        - 美国联邦 / 州机构、医疗、零售
        - 30+ 个 IRS 应用唯一 IAL2 身份核验供应商
        - GAO 发现监管薄弱且没有独立审计（反向）
      - - AU10TIX
        - 全球证件核验专门厂商
