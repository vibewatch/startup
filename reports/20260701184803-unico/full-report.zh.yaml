        - 市场平台、共享经济、加密货币交易所
        - 支持 5,000+ 种证件类型；联盟欺诈信号网络
        - 收入数字仅为第三方估算，ICTS 未单独披露
      - - Incode Technologies
        - 聚焦拉美的身份核验专门厂商
        - 已融资约 $260M；2025 年 11 月据称洽谈最高 $300M 融资，估值 $3B
        - 拉美和美国企业、政府
        - 据报 ARR 约 $170M；与 Unico 同获 SoftBank / General Atlantic 支持
        - 财务数据为媒体估算，非审计披露
    notes: 融资 / 估值数字取各来源发布日期时最新公开报道；私营供应商的规模口径来自公司声称，未经独立审计。
