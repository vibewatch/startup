      - number: '8.4'
        title: 建议、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              平衡论点与反方论点后，本章建议是跟踪：Unico 确实显示出真实的增长——虽然由公司自报——并在收购 OwnID、启动 Silicon Valley
              总部后有一条通往全球相关性的可信路径；但未解决诉讼、尚未完成的巴西生物特征监管制度，以及缺少独立模型性能验证，都不支持在当前引用价格上给出高确信买入判断。本建议的置信度为中，反映积极运营信号与未解法律 /
              监管问题并存。风险评级为高：司法保密下的活跃诉讼、仍在成形的监管框架（ANPD 生物特征规则、Digital ECA 执法、央行 Pix 规则），以及没有公开证据证明 Unico 反 deepfake
              技术跟上其自称 2026 年欺诈攻击可能增加 150-550%，都会叠加结构性巴西 / 银行渠道集中度风险。估值立场是偏高：~$2.6 billion
              数字超过四年没有通过新的定价事件刷新，同期可比公司结果有上有下，因此在新融资事件确认前，应把它视为天花板参考，而不是地板。
