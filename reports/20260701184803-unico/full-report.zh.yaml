      - number: '1.3'
        title: 融资历史、投资人和估值
        blocks:
          - type: paragraph
            body: >-
              Unico 已披露融资史始于 2021 年约 R$625 million（约 US$120 million）的一轮融资，由 SoftBank 和 General Atlantic 领投；这轮融资伴随公司从
              Acesso Digital 更名为 Unico， 并在约 800 家客户基础上跻身独角兽。2022 年 4 月，公司完成由 Goldman Sachs Asset Management 领投的 US$100
              million Series D，SoftBank 和 General Atlantic 也参投；该轮 对 Unico 的估值约为 US$2.6 billion，并给 Goldman 一个董事会席位。当时
              Unico 报告每月约 25 million 次认证。2024 年 9 月 Trully.AI 收购报道仍引用这一估值，并确认公司覆盖 17 个国家，说明此后两年多没有披露过显著不同的定价轮。


              到 2024 年中，CEO Sergio Chaia 告诉 Brazil Journal，Unico 短中期没有 IPO 或新融资计划， 因为现金足以支持自有国际扩张；与此同时，公司报告首次季度净利润（2024
              年 Q1 R$14 million， 仅 4 月又达 R$22 million），收入同比增长 50%，IDPay 产品已处理超过 R$5 billion 交易。 盈利、自筹扩张和持续并购（2024 年 9 月
              Oz Forensics 和 Trully.AI；2025 年 9 月 OwnID） 放在一起看，Unico 的 2024–2026 年全球推进更像是靠经营现金流和 2022 年资本底座，而不是
              新一轮一级股权融资。
