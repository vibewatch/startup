      - number: '7.2'
        title: 法律与诉讼风险
        blocks:
          - type: paragraph
            body: >-
              短期最重大的法律风险，是 Unico 自己在 2026 年 6 月针对 Serasa Experian 提起的民事和刑事诉讼。Unico 指控 Serasa 通过中介 Skill
              Tecnologia，将生物特征核验查询挪到授权范围之外；Skill Tecnologia 原本只被授权代表 Banco do Brasil 转售人脸识别查询。起诉文件引用的取证分析识别出约 140
              万笔异常交易，可能暴露最多 2200 万巴西人的生物特征数据。巴西法院批准对 Skill Tecnologia 的 São Paulo
              办公室执行搜查扣押；案件目前处于司法保密程序，限制了对双方主张的独立验证，Serasa 也已公开否认不当行为。无论诉讼最终如何解决，这一事件本身都说明，大量查询曾长期通过伙伴渠道流动，却没有被 Unico
              自己的监控系统发现；这是一处控制缺口，独立于法律责任也值得重视。“Unico Identity Cloud” 的商标记录由运营实体 Acesso Digital Tecnologia da Informação
              S.A. 持有，是少见的、可独立核验的公共登记证据，能说明 Unico 的公司与产品结构，且不受诉讼司法保密影响。
