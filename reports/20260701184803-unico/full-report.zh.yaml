      - number: '5.2'
        title: 架构、集成与运营模型
        blocks:
          - type: paragraph
            body: >-
              最有力的公开架构证据来自 Unico 自己的开发者材料，以及 Google Cloud 的向量搜索案例。集成模型讲得很清楚：采集可以由 Unico 托管，通过 Web、SDK 或 redirect
              路径完成；也可以由客户应用控制，通过同步 API 提交图像；还可以走墨西哥专用的 Magic Link
              流程。因此，“集成”本质上是在不同宿主、认证方案、载荷和回调模型之间选择合同边界，并不存在一个放之四海皆准的端点。Web SDK 还带来实际部署约束：安全 HTTPS 域名、兼容 WebRTC 的浏览器和
              webview、原生相机权限，以及对混合框架的有限支持。在这层表面之下，公开产品和伙伴材料指向一套生物特征决策栈：活体检测、身份匹配、图谱或行为信号、1:N
              搜索、自适应路由，以及以全国规模运行的向量搜索后端。公司关于多云可靠性和控制台监控的定位可信，但可靠性姿态仍大多停留在定性描述，缺少公开 SLA 或事故记录支撑。
