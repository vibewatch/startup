  - id: TP004
    title: 护城河耐久度 / 竞争风险台账
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调问题
    rows:
      - - 巴西银行 / 政府信任和生物识别数据规模
        - Serasa Experian 通过征信局 + ClearSale + idwall 整合，把负面数据、欺诈和身份信号打包，Unico 单独难以匹配
        - 实质性
        - Serasa 约 R$2B 收购 ClearSale、约 R$450M 收购 idwall（2025–2026 年）
        - 核实 Unico 是否有对等的打包或合作应对，例如与银行签数据共享协议
      - - 专有面部生物识别技术可构成技术护城河
        - Unico 指称其生物识别核验能力通过持牌中介遭未授权访问，说明技术本身可能比预想更容易泄露 / 复制
        - 实质性
        - Unico 2026 年就 Skill Tecnologia 路由起诉 Serasa / ClearSale
        - 确认诉讼结果 / 和解，以及由此产生的许可或禁令条款
      - - 拉美先发渠道优势
        - Jumio 的 selfie.DONE、Incode、Veriff 等全球专门厂商正面向拉美推出或扩展可复用身份产品
        - 实质性
        - Jumio 2026 年 4 月在拉美推出 selfie.DONE；Incode 聚焦拉美且 2025 年有融资洽谈
        - 跟踪重合客户中的赢单 / 输单数据和定价应对
      - - 政府关系作为分销渠道
        - Serpro / gov.br 免费、国家背书的生物识别基础设施，以及强制全国 ID 推广，可能压缩低风险场景中的私营核验需求
        - 视细分场景从轻微到实质性
        - Serpro 的 300M 人脸 / 3B 指纹 IBio 底库和 CIN 推广
        - 评估 Unico 哪些收入线依赖可被政府 ID 替代的用例
      - - 盈利能力以及不再依赖进一步稀释性融资
        - CEO 表态排除近期融资，显示资本可能充足，但没有经审计的公开财务数据可确认 2026 年规模下能持续盈利
        - 轻微
        - Brazil Journal 2024 年首次盈利报道；未找到后续公开披露
        - 尽调中要求最新管理账或审计报表
      - - 大型受监管买方多供应商并用，限制任何单一供应商定价权
        - 银行和政府机构通常同时使用不止一家身份核验供应商以保证冗余，这会限制任何单一供应商（包括 Unico）能变现的护城河幅度
        - 轻微
        - 根据 Serpro / gov.br 的品类实践和 Socure 以银行为主的客户基础推断
        - 确认 Unico 最大客户集中度和合同排他条款
    notes: 严重性评级是作者基于证据的判断（对应阻断 / 实质性 / 轻微），不是供应商或第三方风险评分。
