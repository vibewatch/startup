      - number: '4.5'
        title: 财务结论：收入质量、利润率路径与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Unico 的财务叙事方向上积极，但证据偏薄：公司在 2024 年实现首次正 EBITDA 和盈利季度，此后到 2026 年 Q1
              仍保持两位数合并增长和更快国际增长，并且看起来能在不新增稀释性资本的情况下自筹并购资金。 但 2024 年以来每个头部数字，要么来自公司说法，要么来自单篇第三方新闻；少数可用独立聚合估计
              （Growjo、Tracxn）在收入、员工数甚至估值上彼此冲突，也与 Unico 自身披露相差很大。Reclame Aqui 数据 显示服务可靠性整体可接受但并不完美（2026 年 1–6 月 35
              起投诉，61.5% 解决率），问题集中在消费者触点的 人脸识别失败；如果它推动合作银行和零售商的客户流失，就会带来温和但真实的收入质量风险。最大尽调阻断点 是完全缺少经审计财务、现金消耗或利润率数据，外加两个
