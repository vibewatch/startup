      - number: '8.2'
        title: 融资背景与陈旧估值和当前估值证据
        blocks:
          - type: paragraph
            body: >-
              Unico 到 Series D 为止的融资史记录清楚：2020 年约 $116 million 融资；2021 年 8 月约 $125 million 融资，让 Unico 成为独角兽（General
              Atlantic 和 SoftBank 两轮共同领投）；以及 2022 年 4 月由 Goldman Sachs Group Inc. 领投的 $100 million Series D，据 Reuters
              报道，该轮明确把公司估值定在 $2.6 billion。General Atlantic 自己的投资组合页面也独立确认，其 2020 年首次投资 Unico，与这一序列相互印证。Tracxn 的聚合跟踪器 给出的
              Unico 披露总融资约为 $341 million。本章关键估值问题是，CB Insights 等 tracker 截至 2025 年 9 月仍引用的 $2.6 billion 数字，是否反映了 2022 年
              4 月之后的任何重定价。没有找到更新一手融资、二级市场交易或董事会批准公允价值 估值的证据；该数字看起来只是从 2022 年事件沿用至今。与此同时，Unico 的 2026 年增长指标（交易增长
              84%、国际收入增长 130%）由公司自报且未经审计。合在一起，估值证据确实陈旧——按报告生成日算约四年——尽管围绕它的运营叙事已通过新市场、新产品（OwnID）和新监管顺风明显向前移动。
