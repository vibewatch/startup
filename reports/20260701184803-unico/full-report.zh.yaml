      - number: '7.4'
        title: 集中度与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Unico 的业务在地域和结构上都高度集中，任何单点失败的影响都会被放大。独立战略分析明确把 Unico 在巴西的主导地位描述为“重大集中度风险”，并把进一步地域多元化放在几乎关乎长期论点存续的位置。Serasa
              / Skill Tecnologia 事件把机制讲得很具体：Unico
              对欺诈、误用或声誉损害的暴露，可能集中到单一大型金融行业转售渠道；渠道层面的失败也可能在很长一段时间里未被发现，直到浮出水面。资本侧，Unico 从 Series B 到 D
              的投资者基础集中在三家领投方——SoftBank、General Atlantic 和 Goldman Sachs——这相较单一投资方提供了一定财团多元化，但后续融资仍依赖少数关系。更宽地看，Unico
              在巴西依靠金融行业客户（银行和 fintech）作为核心分发渠道，这意味着影响该客户群的监管或竞争变化，会直接传导到 Unico 的增长。
