      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Unico 当前资本位置看似足以支持现有战略，但依据是管理层表述，而不是经审计披露。一名 Unico 高管告诉 Bloomberg Linea，计划中的并购资金已在现金储备中，不依赖新融资；这与公司自 2024
              年以来在没有披露新 定价股权轮的情况下，至少完成三起收购（Trully、Oz Forensics、OwnID）相一致。Unico 最后一次确认融资是 2022 年 4 月 $100 million Series
              D，估值 $2.6 billion，由 Goldman Sachs 领投，General Atlantic 和 SoftBank 参投；第三方聚合平台 Tracxn 估计，公司五轮融资合计约 $341
              million。截至 2026 年中，尽管市场 持续猜测，仍没有公开确认 IPO 注册或上市日期。两个资本充足性风险没有反映在任何公开现金或现金消耗数字中： 第一，Unico 自身 2026 年中针对
              Serasa Experian 和 ClearSale 的诉讼带来无法量化的或有法律成本；第二， Serasa Experian 体量大得多的母公司 Experian plc 报告 FY26 上半年拉美总收入增长
              15%，并披露由 Serasa 和 ClearSale 共同打造的可复用身份产品「Serasa Pass」，直接瞄准 Unico 正在追逐的同一可复用身份市场。 因此，Unico
