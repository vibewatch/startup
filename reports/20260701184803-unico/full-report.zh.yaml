      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Unico 新闻室披露的创始人为 Diego Martins、Rui Jordao 和 Paulo Alencastro。Martins 一直 担任 CEO，直到 2024 年 2 月 6 日 Unico
              宣布领导层交接：曾任 Nextel Brazil 和 Sodexo CEO、 并为 Unico 提供约八年顾问服务的 Sergio Chaia 接任巴西业务 CEO；Martins 转任新设的 CTO
              Global，聚焦国际化，并继续担任董事会主席。截至该公告，Unico 董事会包括 General Atlantic、SoftBank 和 Goldman Sachs 代表，说明治理影响力集中在公司三大机构
              支持方手中。


              2022–2024 年，公司还密集引入高管：来自 Google、Loggi、Nubank、B3、C6 Bank 和 Unilever 的新 CIO、产品、数据、工程和 HR/PeopleX 负责人；CFO
              Mauricio Teixeira（前 Hapvida， 2023 年 12 月入职）；全球战略 VP Rodrigo Magalhaes（前 Itau BBA/Credit Suisse）；以及 IDPay
              首席增长官 Paulo Naliato（前 Cielo/Casas Bahia）。这种配置显示，Unico 在 2024 年 首次报告盈利季度前，有意推动管理层职业化；但公开资料仍没有披露精确董事会投票权、
              创始人持股比例和委员会结构。考虑到公司曾裁员、持续并购且如今卷入诉讼，这是真正的 尽调缺口。
