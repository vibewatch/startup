      - number: '2.3'
        title: 买方分层与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              银行和金融科技仍是锚定买方，合规和风控负责人是主要决策者，Pix 相关欺诈是最强购买触发点： 巴西 2025 年处理超过 80 billion 笔 Pix 交易；到 2026 年 4 月，142 million
              名巴西人通过 Pix 交易，占有银行账户人口的 96.4%；Banco Central 也在 2025 年 9 月收紧疑似欺诈账户冻结规则。 iGaming 和体育博彩已成为第二大重要分层，并被 2026
              年世界杯带来的可记录激增放大：博彩用户 增加 50%，28% 的 iGaming 欺诈发生在开户注册环节，摩擦导致 81% 放弃率，奖金滥用最高吞掉行业 收入的 15%。行业媒体称，生物识别身份验证让有效注册提升
              20%，开户注册流程提速 20%，奖金滥用 下降 70%。


              零售和电商、电信、医疗补齐买方图谱，每一类都有不同采用触发点：零售看拒付和优惠滥用成本； 电信看 SIM-swap 欺诈和身份型网络攻击；医疗看 LGPD 对敏感健康数据的义务。监管本身也是 2026
              年增长驱动：巴西 Digital ECA（Law 15,211/2025）于 2026 年 3 月 17 日生效，要求面向 未成年人的平台做年龄保障；Unico 于 2026 年 5
              月推出专门年龄验证产品，称基于 2025 年完成的 超过 1.5 billion 次身份检查，准确率达 99.98%。Deepfake 和生成式 AI 欺诈增长是并行动力： Biometric Update
              报道，2025 年上半年巴西 deepfake 和人脸操纵欺诈尝试上升 488%；Kaspersky 另记录早在 2023 年 deepfake 视频内容同比增长 900%。供应商把这些数据作为继续投入活体检测和
              呈现攻击检测的理由。
