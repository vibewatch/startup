  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              Unico 的投资论点立在四根柱子上：一个规模大且快速增长的身份核验市场（2026 年约 $14-18 billion，CAGR 为两位数）；2025 年 9 月收购 OwnID
              后扩宽的产品线，在核心生物特征核验之上加入无密码认证；通过巴西银行和 fintech 建立的深度分发，现在又被央行 Pix 生物特征要求和 Digital ECA 年龄核验法强化；以及横跨 Goldman
              Sachs、General Atlantic 和 SoftBank 的可信投资者财团。公司自报的 2026 年增长——交易量同比增长 84%、国际收入增长 130%——支持了 Unico
              正在越过巴西基本盘扩张的叙事。反方论点并不否定底层业务，而是在证据层面挑战每根柱子。独立战略分析把巴西集中度界定为“重大”风险，必须靠多元化解决。一桩针对 Serasa Experian
              的、仍未解决且被司法封存的诉讼——指称约 140 万笔生物特征查询被转移，最多 2200 万巴西人的数据可能暴露——无论法律责任如何，都揭示了真实的渠道监控缺口。对本章最重要的是，Unico
              最后一轮确认的定价融资仍是 2022 年 4 月的 $100 million Series D；它也是 2025-2026 年报道仍在重复的 ~$2.6 billion
              估值来源。没有更新一轮融资、二级交易或公允价值 估值的公开信息，能证明该数字仍反映当前现实。
