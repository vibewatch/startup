chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Unico idtech S.A. 是一家巴西数字身份和生物识别认证公司，总部位于 Sao Paulo。公司于 2007 年以 Acesso Digital 起步，最初做文档数字化，之后转向人脸生物识别身份验证；
              创始人 Diego Martins 称这次转向是公司的关键拐点。公司在 2021 年融资前后更名为 Unico，如今自称拥有全球最大的身份验证网络。


              Unico 的产品栈把人脸生物识别、活体检测、AI 风险信号和行为分析整合进一个平台，卖给 银行、金融科技公司、零售商、博彩运营商，以及（自 2025 年收购 OwnID 后）全球消费品牌。 公司称，每年处理超过
              1.2 billion 次身份认证，依托覆盖超过 21 个国家、超过 170 million 张 唯一人脸的生物识别参考网络；同时在基于 Google Cloud 的多云安全与合规平台上，每月处理 超过 150
              million 笔交易。Unico 自家新闻室称，公司 2024 年阻止了超过 R$3.2 billion 的 欺诈，并为巴西十大零售商中的 9 家、五大银行中的 4 家、十大博彩公司中的 8 家做身份认证；
              这种集中度让巴西金融服务和博彩需求成为当前商业模式的核心。
