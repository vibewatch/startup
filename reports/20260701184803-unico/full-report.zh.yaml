  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户任务
        blocks:
          - type: paragraph
            body: >-
              Unico 的公开产品面并不只是一次自拍核验。核心是 IDCloud；公司把它定义成模块化身份决策平台，而不是单一的 KYC 小组件。新用户主流程从 Onboarding
              开始，一次采集就能触发活体检测、身份核验、欺诈风险分级和证件采集。随后，各变体会按客户任务删减或重排步骤：Non-Document Verification 去掉对证件的依赖，服务跨国开户注册；Fraud
              Risk Level Detection 即便在身份看起来可信时，也会查网络或行为滥用；Multi-Account Prevention 在注册时做 1:N 生物特征唯一性校验；Data Verification
              则为受监管流程加入 AML、制裁、PEP 和禁止投注者筛查。Unico
              还把同一身份图谱延伸到开户注册后的任务，例如自适应复核、在线支付证明和年龄门槛控制。结果是一套围绕客户时刻组织的工作流栈——注册、认证、支付、年龄保证和文件正式化——而不是单一通用生物识别 SKU。
