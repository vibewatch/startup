  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 采集与体验层
        - 通过 SDK、网页、重定向或托管流程采集自拍、证件或支付流程输入
        - 浏览器或 webview 兼容性、相机权限、HTTPS 域名、原生应用封装
        - 混合框架限制和客户端权限错误可能破坏落地质量
      - - 合约与 API 层
        - 提供 Web & SDK、API 和 Magic Link 合约，支持不同的同步或异步结果模式
        - OAuth2 JWT bearer 签发、API key、主机路由、回调或 webhook 处理
        - 没有单一通用端点，集成方可能映射错合约或环境
      - - 核心验证能力
        - 融合活体检测、身份验证、欺诈风险分类、1:1 或 1:N 匹配、证件复用和年龄验证
        - 生物识别引擎质量、身份库覆盖和编排逻辑
        - 单项能力薄弱，就会削弱确定性答案这一整体承诺
      - - 图谱或行为智能
        - 围绕欺诈加入网络历史、连续模式检测、时间序列或图谱信号
        - 历史交易数据、跨客户模式识别和模型维护
        - 没有可见外部基准，行为模型可能漂移或过拟合
      - - 自适应交易编排
        - 根据风险上下文，把用户路由到静默认证、passkey 或人脸生物识别升级认证
        - 设备元数据、行为信号、passkey 支持和参考生物特征
        - 公开材料难以审计静默批准或 passkey 兜底规则
      - - 向量搜索与大规模匹配后端
        - 以全国规模运行 1:N 人脸检索和排序
        - Spanner 向量搜索、嵌入质量、区域部署和低延迟服务
        - 规模说法很强，但公开架构没有披露完整故障域
      - - 合作伙伴和数据集成
        - 连接发卡行、政府或记录提供方、AML 或制裁数据，以及 Trully Mexico 流程
        - 外部数据新鲜度、发卡行覆盖、合作伙伴 API 和区域合规接口
        - 合作伙伴宕机或数据质量问题可能传导到面向客户的决策
      - - 管理与企业身份层
        - 支持 People API、Sign 工作流、SCIM 配置和 SAML 联邦
        - 客户身份提供商、HR 数据卫生和文档治理工作流
        - 邻近管理产品可能造成范围蔓延，并给核心验证之外增加支持负担
    notes: 本表综合官方文档和 Google Cloud 案例研究中明确公开的架构披露；不声称内部微服务细节，因为这些细节未发布。
