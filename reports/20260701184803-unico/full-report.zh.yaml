  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Unico 在巴西运营生物特征身份核验平台；按 LGPD，面部生物特征数据属于敏感个人数据，而数据保护机构 ANPD 已从指南走向主动规则制定。ANPD 在 2025
              年中启动了一项专门针对生物特征数据处理的公开咨询，此前它在 2024 年 6 月发布了关于人脸识别技术的 “Radar Tecnológico” 报告；2026 年 4 月，ANPD
              又成为具备更大执法权的完全独立监管机构。另一条线是，巴西新的 Digital ECA（Law 15,211/2025）于 2026 年 3 月 17
              日生效，禁止线上自报年龄，并强制采用可靠年龄核验方法；违规罚款最高可达 R$50 million，或公司巴西收入的 10%。这套规则既是 Unico
              年龄保证产品线的需求驱动，也是合规成本风险。巴西央行也叠加了自己的生物特征要求：BCB Resolution 493、CMN Resolution 5,274/2025 和 BCB Resolution
              538/2025 要求自 2026 年 3 月起，对 Pix 交易采用多因素认证和生物特征核验，机构罚款从 R$50,000 起步。合在一起，这三个监管者（ANPD、央行和更宽的 Digital ECA
              框架）形成了叠加且不断移动的合规靶面，小型身份核验供应商必须比多元化在位巨头更快跟踪并适配。
