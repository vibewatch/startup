      - number: '3.4'
        title: 分发能力、银行 / 政府信任与监管姿态
        blocks:
          - type: paragraph
            body: >-
              巴西身份验证的分发能力绕不开 Unico 无法完全控制的两条渠道：政府基础设施，以及新近归 Experian 所有的征信局关系。Serpro 运营着支撑 gov.br 服务的约 300 million 张人脸和
              3 billion 枚指纹的 生物识别数据，并服务超过 700 家公共和私人客户，包括 Uber 通过其 Datavalid 产品做司机验证； 巴西生物识别国家 ID 卡（Carteira de
              Identidade Nacional）的推出，又延伸出免费、国家背书的身份 基础设施，可在低风险场景替代私营验证。监管侧，ID.me 在美国的经历虽是不同市场，但很有启发： 2025 年 6 月 GAO
              报告发现，IRS 在 30 多个应用中把 ID.me 作为唯一 IAL2 身份证明供应商，没有可衡量 项目目标，也没有独立审计，并指出 ID.me 的 AI / 人脸识别使用未记录在 IRS 要求的 AI
              清单中。 这给包括 Unico 在内、可能成为政府身份项目单点故障的任何供应商提供了警示模板：监管审查往往在 集中度风险已经形成后才到来。在巴西，LGPD 式数据保护义务以及 Unico 针对 Serasa
              生物识别数据处理 的诉讼，都显示监管机构和法院已经开始主动介入身份供应商如何处理敏感生物识别数据，并同时抬高 所有玩家的合规门槛。
            claimRefs:
              - CP027
