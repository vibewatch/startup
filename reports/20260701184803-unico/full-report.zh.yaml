      - number: '5.4'
        title: 信任、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Unico 的信任披露明显强于典型营销网站，但尽调缺口仍在。公司公开声称做过 PAD 和注入攻击测试，具备 SOC 2 Type 2、NIST 测试、GDPR 对齐、LGPD
              合规、多云可靠性和实时监控。其美国隐私政策对几类事项写得罕见具体：处理哪些个人数据、身份核验使用哪些外部来源、不会为定向广告出售或共享数据，以及按州法处理生物特征数据时采用什么留存逻辑。年龄核验也被推入更严苛的监管环境：ANPD
              的 2026 年咨询和 Mattos Filho 摘要都强调隐私、可审计、反规避和最小属性共享。主要技术风险不是 Unico 对 deepfake
              毫无回应；它显然有回应。更难的问题是，这套回应面对不断演化的注入攻击、子群体偏差、误拒权衡和生产事故时到底扛得住多久，因为这些指标大多仍未公开。
