      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Unico 没有公开证据显示正在准备 IPO；最近的资本市场动作仍是私人 Series D，因此近期流动性路径更可能是 M&A 或进一步私人融资，这也符合它作为收购方（Trully、Oz
              Forensics、OwnID）的模式，而不是自身释放被收购或上市信号。创始人兼 CEO Diego Martins 自 2021 年独角兽轮以来，一直是公司融资、M&A
              和诉讼回应叙事的稳定公开面；这带来连续性，也集中关键人依赖。任何新资本承诺之前，应解决五个尽调问题：~$2.6 billion 数字是否反映 2022 年 4 月后的任何事件；Serasa Experian
              诉讼的当前状态和潜在赔偿；独立审计的模型性能与反欺骗认证；按地域和产品线披露的审计收入与利润率；以及 Trully、Oz Forensics、OwnID
              的具体收购后整合证据。在这套材料可得之前，本论点应以增长叙事动能为基础，同时扣除真实的法律、监管和估值陈旧风险；不应简单视为 2022 年独角兽故事的自然延续。
