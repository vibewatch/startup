      - number: '8.3'
        title: 可比公司集合与牛 / 基 / 熊情景
        blocks:
          - type: paragraph
            body: >-
              放到身份核验同行集合里，Unico 的 ~$2.6 billion 估值，位于近期定价的美国可比公司和体量较小、同样估值陈旧的同行之间。Incode Technologies 据称在 2025 年底洽谈最高 $3
              billion 估值。Persona 作为更直接可比的美国平台，2025 年以 $2 billion 估值完成 $200 million Series D（高于 2021 年的 $1.5 billion），比
              Unico 自身估值更新、更近。Veriff 的 $1.5 billion 估值来自 2022 年 1 月，几乎与 Unico Series D 同期；AU10TIX 的 ~$260 million
              参考值一路追溯到 2019 年；Onfido 被 Entrust 收购后的独立估值在 2025 年降到约 $163 million，说明这个行业的估值可以剧烈分化和压缩。Jumio 年收入估计 $252.7
              million、总融资 $205.4 million；在 Unico 没有披露审计收入的情况下，这提供了一个收入规模锚点。这个可比集合里没有单一估值 / 规模倍数通用，因此 Unico
              的数字无法干净三角定位，在有更新数据前应按公司特定事实处理。牛市情景下，Unico 三笔近期收购整合成功，加上持续 80%+ 增长，可能支撑估值向 Incode 式 ~$3 billion
              参考重估。基准情景假设增长放缓到更宽市场 11-17% CAGR，Serasa 诉讼以无重大罚款方式解决，支撑估值略高于 2022 年标记。熊市情景假设诉讼暴露系统性控制失败，下一轮持平到下行定价，呼应
              Onfido 的陡峭降估值。
