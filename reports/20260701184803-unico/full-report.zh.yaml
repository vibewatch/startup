      - number: '3.5'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              Unico 最强的护城河叙事建立在近二十年积累的巴西银行和政府信任、确定性生物识别技术，以及靠并购 推入相邻地域和能力（Trully、Oz
              Forensics、OwnID）之上。每一项都面临可信的商品化或替代风险。 第一，Serasa Experian 对 ClearSale 和 idwall 的整合，造出一个带征信局数据的打包分发竞争者，
              Unico 很难只靠自身生物识别栈复制。第二，Unico 自身诉讼称，有人通过 Skill Tecnologia 的 Banco do Brasil
              独家许可未授权访问其验证技术；这说明底层技术可能经许可安排泄露或转售，削弱「仅靠 生物识别 IP 就能形成持久护城河」的假设。第三，Jumio、Socure、Veriff 和 Persona 等全球专家公司
              都在冲向可复用 / 可携带数字身份；如果任何一家拿到拉美规模分发，一次性证件 + 自拍验证可能被商品化， Jumio 2026 年 selfie.DONE 拉美发布是这件事已经发生的最清楚证据。第四，政府基础设施
              （Serpro/gov.br）给低风险验证场景的定价权设上限。最后，没有公开财务报表能确认 Unico 自 2024 年初 首个盈利季度后持续盈利；大型受监管买方通常多家供应商并用，也限制了包括 Unico
              在内任何单一玩家 能维持的持久定价护城河。尽调应测试 Unico 的增长（2026 年 Q1 交易同比增长 84%）到底来自既有大客户 扩张，还是在竞争加剧下真正新增客户。
