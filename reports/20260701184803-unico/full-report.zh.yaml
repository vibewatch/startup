      - number: '3.2'
        title: Serasa Experian 整合与 Unico 诉讼
        blocks:
          - type: paragraph
            body: >-
              2026 年对 Unico 最重要的竞争变化不是新进入者，而是一轮整合：Serasa Experian 收购 ClearSale （约 R$2 billion，2025）和 idwall（约 R$450
              million，约五倍收入，2026），把全国征信局、 主要电商反欺诈引擎以及证件 / 背景检查平台合在一起。这种打包把负面数据和征信信号与验证流程
              放进同一条面向银行和零售商的商业关系中，可能在分发上压过独立身份供应商。更糟的是，Unico 2026 年中提起刑事和民事诉讼，指控 Serasa Experian 和 ClearSale 通过中介 Skill
              Tecnologia 不当访问 Unico 自有人脸生物识别验证技术；Skill Tecnologia 持有 Unico 技术在 Banco do Brasil 的独家许可。调查人员据称发现至少 1.4
              million 次可疑查询，并标记最多 22 million 名巴西人的 生物识别数据可能暴露，Inter、BTG Pactual 和 Itau Unibanco 等银行被列为导流流量的不知情来源。
              搜查扣押令已执行，Serasa 否认指控；案件部分密封，结果仍是开放证据缺口。无论最终如何解决， 争议本身已经重要：它说明 Unico 技术可能比纯护城河叙事所暗示的更容易经许可安排外泄，也让一个
              体量大得多、有征信局背书的对手首次以直接对抗姿态面对 Unico。
