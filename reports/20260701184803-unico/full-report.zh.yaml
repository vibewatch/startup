  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Unico 先切入高风险身份时刻，再尝试把同一身份层复用到后续客户旅程中。
    data:
      nodes:
        - id: need
          label: 高风险数字时刻
          detail: 银行、钱包、零售商或博彩运营商在开户、授信或结账时，需要更强的身份保障。
        - id: integrate
          label: 初始集成
          detail: 企业把生物识别、证件验证或活体检测接入第一个关键流程。
        - id: recognize
          label: 网络识别
          detail: 已知人脸和证件可以复用，回访用户不用重复最重的采集步骤。
        - id: approve
          label: 转化与欺诈结果
          detail: 运营方衡量批准率提升、人工审核下降、欺诈下降或激活更快。
        - id: expand
          label: 扩展到相邻流程
          detail: 企业把同一身份层复用于支付链接、高价值审批、数字信贷或重复认证。
        - id: renew
          label: 续约考验
          detail: 只有使用范围扩大并完成续约，这个循环才算稳固；但公开资料没有披露 NRR 和流失数据。
    approximationNotes: 这张图是定性图，因为公开证据只描述阶段和循环，没有给出跨客户的标准化逐阶段转化率。
    claimRefs:
