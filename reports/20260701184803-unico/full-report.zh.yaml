      - CU018
      - CU021
      - CU027
      - CU031
      - CU046
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据支持一条分阶段企业流程：从欺诈痛点到生产上线，再扩展到交易级使用；但不支持量化各阶段转化率。
    data:
      nodes:
        - id: pain
          label: 欺诈或合规痛点
          detail: 买方起点是好用户被拒、证件欺诈、支付欺诈，或受监管 KYC 负担。
        - id: pilot
          label: 实施冲刺
          detail: 公开证据常强调几天或几周内完成快速集成，而不是几个月。
        - id: prod
          label: 生产开户注册上线
          detail: 活体、生物识别或证件复用进入线上用户旅程。
        - id: measure
          label: 运营结果
          detail: 公开案例页随后提到批准率提升、人工审核减少或拦截欺诈。
        - id: expand
          label: 相邻场景扩展
          detail: 企业把同一身份图谱扩展到支付、信贷或经常性认证时刻。
      edges:
        - from: pain
          to: pilot
          label: 选择供应商
        - from: pilot
          to: prod
          label: 上线
        - from: prod
          to: measure
          label: 复盘结果
        - from: measure
          to: expand
          label: 扩大使用
    approximationNotes: 这里用流程图而非数字漏斗，因为公开材料展示的是部署阶段和结果，不是一套一致的线索到成交转化栈。
