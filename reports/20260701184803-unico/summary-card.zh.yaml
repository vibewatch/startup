  topStrengths:
    - 作为身份平台，Unico 在本地分销上很深：公开证据覆盖巴西五大银行中的四家，以及 800 多家企业客户。
    - 产品栈不止自拍式 KYC，还覆盖开户、欺诈评分、付款验证、年龄核验、电子签名和无密码认证。
    - 管理层交出了看得见的经营进展，包括 2024 年首次 EBITDA 转正，以及 2026 年合并收入增长 30% 到 40% 的指引。
    - 在墨西哥、活体检测和无密码认证上的连续收购，让平台走出了只做巴西开户的单一赛道。
  topRisks:
    - Serasa Experian 纠纷仍未解决，部分案卷密封；如果 Unico 的指控被证实，或者案件长期拖延，法律、声誉和竞争后果都可能显现。
    - 没有新的融资轮、老股交易标记或公允价值披露，能证明反复引用的 $2.6 billion 估值仍代表当前市场出清价。
    - 公开披露在审计财务、现金消耗、债务、客户集中度、logo 流失，以及误拒、偏差、正常运行时间等独立模型表现指标上都很弱。
    - 巴西和银行业仍是经济重心，公司因此暴露在本土监管、采购周期、银行自建系统和征信机构支持的竞争对手之下。
  unresolvedGaps:
    - 需要新的新股或老股估值标记，或董事会层面的公允价值信号，取代已经过期的 2022 年 4 月定价参考。
    - 需要经审计的 2025-2026 年财务报表，披露当前现金、债务、烧钱速度、营运资本和收购整合成本细节。
    - 需要经验证的客户留存和集中度数据，包括 NRR、GRR、大客户收入占比、合同期限和政府部署组合。
    - 需要生物识别模型质量、误拒趋势、偏差测试，以及 Serasa 诉讼最终财务或运营影响的独立证据。
