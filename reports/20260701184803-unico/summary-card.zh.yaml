  headline: 观察：Unico 在巴西身份认证市场确实有规模、产品宽度和近期盈利改善，而这个市场仍在结构性增长；但 Serasa Experian 诉讼仍未了结，公开披露偏薄，2022 年估值标记也已过期，当前风险回报还够不上买入门槛。
