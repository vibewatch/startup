- id: expansion-loops-concentration-and-public-sector-gap
  title: Expansion logic is credible, but concentration and public-sector proof are still gaps
  body: 'The best expansion argument is structural: once Unico is installed at onboarding, the same identity layer can be reused in later, higher-frequency journeys. That pattern appears in PagBank''s move into transactional cardholder validation, BETMGM''s document reuse, Havan''s digital-credit flow, and management''s push toward a more unified, transacional platform. Fast Company adds a downstream commercial signal by showing IDPay recovering lost sales and lifting GMV for some customers. The risk is that the visible book of business still looks concentrated in large Brazilian private banks, major retailers, and other regulated verticals where fraud pain is acute. Public sources do not disclose top-account concentration, renewal timing, or contract economics, so it is impossible to tell whether the land-and-expand story is broad-based or dependent on a few heavyweight accounts. Government identity infrastructure is also getting stronger on its own merits, which may make public-sector
    upside harder to win than a simple TAM slide suggests.'
