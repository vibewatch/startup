company:
  name: Unico
chapter:
  number: 6
  title: Customers
  summary: 'Public evidence supports Unico as a broadly adopted identity layer for Brazilian banks, fintechs, retailers, and betting operators: current sources point to 800+ enterprise customers, four of Brazil''s top five banks, and named production proof at 99Pay, PagBank, Havan, BETMGM Brazil, Magie, and Fintec do Corban. The underwrite is weaker on durability and concentration, because the public record still does not disclose NRR, GRR, logo churn, top-customer share, contract terms, or named government deployments, and Reclame Aqui shows non-zero end-user friction.'
sections:
- id: customer-base-and-buyer-user-payer
  title: Customer base segmentation by buyer, user, payer, and vertical
  body: 'Public evidence puts Unico squarely inside large, fraud-sensitive customer journeys rather than consumer software sold bottom-up. On the paying side, the most visible buyers are large banks, fintechs, retailers with digital-credit or checkout exposure, and betting operators that need regulated onboarding and fraud controls. The end user is different: account applicants, cardholders, bettors, borrowers, or marketplace consumers are the people being verified, while the payer is the enterprise operating the flow. The broadest scale claims come from current company or partner pages: more than 800 companies served, four of Brazil''s top five banks, seven of the 10 largest brands, and more than 170 million faces in the network. Named public proof is strongest in Brazil''s private-sector banking, payments, retail-credit, and gambling corridors. Government identity rails are clearly large in Brazil, but the reviewed public-sector sources do not name Unico as the vendor, so government should
    be treated as opportunity space rather than proven customer concentration.'
