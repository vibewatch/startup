- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Reuse the same identity layer after onboarding in payment links, Pix-like approvals, digital credit, and recurrent auth
    - If a few large banks or retailers dominate usage, transaction growth can mask logo concentration
    - High positive upside if cross-sell is broad; high downside if concentrated
    - Request module-adoption rates and ARR by customer segment and top-20 account.
  - - Document reuse and prior-network recognition reduce friction for returning users
    - The strongest public proof is concentrated in regulated, fraud-heavy verticals such as banking, retail credit, and betting
    - Helps conversions today but may narrow sector diversification
    - Request pipeline mix and expansion bookings outside finance/retail/gambling.
  - - Implementation speed is improving from months to days, plus some smaller-client self-onboarding
    - Fast implementation does not prove contracts are sticky or that usage survives once fraud pressure normalizes
    - Could expand addressable customer count if backed by retention
    - Review implementation-to-go-live conversion and 12-month logo-retention by cohort.
  - - Global acquisitions add customers, passkey tech, and lower-friction auth lanes
    - Cross-border growth can distract from core Brazilian enterprise concentration
    - Potentially diversifies vertical and geography exposure
    - Separate Brazil versus international customer count, usage, and retention.
  - - Government identity rails are huge, but already built around gov.br / CIN infrastructure
    - Public-sector upside may be smaller or slower than a generic TAM slide implies without named contracts
    - Limits one perceived expansion vector and increases need to win private-sector wallet share
    - Search procurement records and request public-sector pipeline separately from commercial pipeline.
  notes: The table pairs visible land-and-expand levers with the specific concentration or channel risks that could make those levers less valuable than top-line volume growth suggests.
