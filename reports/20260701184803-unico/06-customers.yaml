tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale proof
  - Revenue / strategic value
  - Key gap
  rows:
  - - Large private banks and incumbent financial institutions
    - Buyer and payer are fraud, risk, digital, or channels teams; user is the bank customer being verified
    - Account opening, recurrent authentication, Pix-like high-value approvals, fraud checks
    - Four of Brazil's top five banks; largest private banks cited in public sources
    - High-volume, high-frequency flows make this the core strategic wedge
    - No public revenue share, contract length, or top-bank concentration
  - - Digital banks, fintechs, and wallets
    - Buyer and payer are product, fraud, or growth teams; user is the end customer transacting
    - Wallet onboarding, account security, payment-link approval, digital credit
    - Named public proof at 99Pay, PagBank, Banco Neon, and Fintec do Corban
    - Shows Unico can serve faster-growth digital channels, not just incumbents
    - No public segment ARR, churn, or cohort renewal
  - - Retailers and retail-credit operators
    - Buyer and payer are commerce or credit teams; user is the shopper or borrower
    - Checkout approval, cardholder validation, app-based digital credit, document checks
    - Havan and Magazine Luiza are publicly named; Google and Bloomberg both mention retail depth
    - Retail flows support transaction-linked expansion beyond onboarding
    - No public split between e-commerce, store card, and credit economics
  - - Betting and gaming operators
    - Buyer and payer are compliance, product, or fraud teams; user is the bettor
    - KYC, document reuse, account protection, payout and fraud checks
    - Named public proof at BETMGM Brazil and Novibet; Unico says eight of the top 10 betting platforms use it
    - Regulatory onboarding creates a strong compliance-led wedge
    - No public retention or wallet-share data by operator
  - - Smaller or mid-market clients
    - Buyer and payer are implementation or operating teams; users are the end customers of those businesses
    - Self-onboarding, lighter integrations, guided rollout
    - UserGuiding says Unico built a self-onboarding path for smaller clients and cut onboarding time by almost 70%
    - Can diversify beyond a few enterprise whales if self-serve implementation scales
    - No public count of active SMB accounts or their spend levels
  - - Government / public-sector identity flows
    - Potential buyer is a public agency; user is the citizen; payer is public budget
    - Biometric login, identity validation, account recovery
    - gov.br and CIN show large biometric rails, but no reviewed public document names Unico as vendor
    - Large TAM if won, but not proven customer proof today
    - Named contracts, procurement records, and production proof were not found
  notes: Segmentation mixes payer, operator, and end-user roles because Unico sells into enterprise workflows where the verified person is not the party paying the invoice.
