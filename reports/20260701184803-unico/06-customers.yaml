- id: durability-proxies-and-retention-gaps
  title: Durability proxies are visible, but retention remains under-disclosed
  body: 'Durability is where the public record turns thin. There are useful proxies: Magie cut manual reviews from 40 percent to 2 percent and reduced flow time to seconds; PagBank says approval rates and TPV improved while chargeback risk stayed close to zero; BETMGM reports 80 percent-plus documentless onboarding and a 94 percent identity-approval rate; and Unico says liveness conversion runs above 99 percent. UserGuiding also describes a roughly 70 percent reduction in customer onboarding time and a self-serve lane for smaller customers, which implies implementation friction is getting lower. But these are still operating or satisfaction proxies, not retention metrics. None of the reviewed public sources gives NRR, GRR, logo churn, contract length, or renewal cohorts. Even the best public satisfaction signal—Reclame Aqui''s 7.2 out of 10 with 35 complaints in the last six months—captures end-user support experience, not enterprise renewal. The right conclusion is that adoption looks real,
    while durability still requires private diligence.'
  claimRefs:
