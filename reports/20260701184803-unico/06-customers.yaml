- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Disclosed outcome
  - Evidence limitation
  rows:
  - - 99Pay
    - Wallet / fintech
    - Facial-biometrics and proof-of-life layer across digital-account transactions inside the 99 ecosystem
    - Production account-security and transaction flow
    - 23M-user surface; five-day integration; 99% reprocessing adherence; supports 99Pay, 99 Mobility, and 99Food
    - Mostly vendor- or partner-published; no renewal or spend-per-account data
  - - PagBank
    - Payments / acquiring
    - IDPay in payment links to verify the buyer and cardholder during online purchases
    - Production payments flow, later expanded across channels and API
    - Immediate TPV and approval-rate lift; chargeback risk described as practically zero; first mover in payment links
    - No disclosed duration of gains or merchant-retention cohort
  - - Havan
    - Retail / digital credit
    - App-based identity verification and digital-card credit onboarding
    - Production retail-credit flow
    - 800+ suspicious identity cases flagged in three months and roughly R$250k loss prevented
    - Outcome is a fraud snapshot, not proof of long-term credit-book retention
  - - BETMGM Brazil
    - Betting / gaming
    - Regulated-market onboarding with facial biometrics and document reuse
    - Production launch in Brazil in 2025
    - 20-point identity-conversion lift; 80%+ documentless onboarding; 94% approval; tens of thousands of fraud attempts blocked
    - Proof set is fresh and quantified, but still concentrated in launch/onboarding metrics
  - - Magie
    - Digital bank / WhatsApp banking
    - WhatsApp-based account opening with facial biometrics and liveness
    - Production onboarding flow
    - Manual reviews fell from 40% to 2%; capture step under 3 seconds
    - No public evidence on long-term account activity or renewal economics
  - - Fintec do Corban
    - Banking correspondent / credit distribution
    - Cadastro + ID products for FGTS-anticipation onboarding and validation
    - Production credit-flow deployment with multiple products live
    - 15-day implementation and 23% boost in automatic approvals
    - No public repeat-usage or portfolio-retention disclosure
  notes: This is a partial public sample of named production references; rows emphasize recent deployment proof and measurable outcomes, while blank renewal data reflects what the sources do not disclose.
