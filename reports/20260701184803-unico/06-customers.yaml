  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: A current customer roster by segment, geography, and revenue band, plus which logos are production versus historic or pilot deployments.
    whyItMatters: Public proof includes only a sample of named customers, so breadth and segment mix can be overstated if the unpublished tail is weak or inactive.
    diligencePath: Request a current top-50 customer list with start date, production status, product modules used, and segment tags; cross-check a sample against invoices or account owners.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Current NRR, GRR, and logo-churn by major segment such as banks, fintechs, retailers, and betting operators.
    whyItMatters: Without retention metrics, adoption proof can show launch success while hiding weak renewal, low expansion, or short-lived usage.
    diligencePath: Ask finance and CS leadership for the last eight quarters of retention bridges by segment and top-20 accounts.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-10, and sector concentration by ARR, transaction volume, and gross profit.
    whyItMatters: Large-bank and large-retailer references are strategically attractive but can mask reliance on a handful of accounts or sectors.
    diligencePath: Request customer concentration tables from finance and compare them with renewal calendars and product-module adoption.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Average contract length, auto-renewal structure, termination rights, implementation fees, and minimum-commit terms by segment.
    whyItMatters: Expansion velocity matters less if contracts are short, easy to cancel, or heavily front-loaded with implementation revenue.
    diligencePath: Review standard MSA/SOW templates and a sample of live enterprise contracts across bank, retailer, and betting segments.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: public-sector-deployments
    missingEvidence: Named procurement records, contract notices, or official agency statements proving Unico inside Brazilian public-sector identity journeys.
    whyItMatters: Government identity rails are large, but the public record reviewed does not show that Unico captures that demand today.
    diligencePath: Search procurement portals and submit LAI requests to gov.br, Poupatempo, and major state digital-service agencies for biometric-vendor rosters.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
  - type: missing-source
    severity: material
    topic: retention-cohorts
    missingEvidence: Time-series account or revenue retention cohorts with month- or year-bucket percentages for production customers.
    whyItMatters: The planned cohort figure cannot be rendered honestly without actual retention percentages, so durability must be assessed through weaker proxies.
    diligencePath: Request cohort exports from billing and CRM systems, then split by segment and product module to test whether onboarding strength converts into recurring usage.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU026
    relatedTableRefs:
    - TU006
