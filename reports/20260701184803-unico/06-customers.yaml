- id: adoption-trajectory-and-named-production-proof
  title: Adoption trajectory and named production proof
  body: 'The public adoption record is stronger on throughput and implementation than on raw logo count. Current pages say Unico processes more than 150 million transactions per month and more than 1.2 billion authentications per year, while external reporting says 2024 identity transactions reached 608 million and management expects roughly three times more validations this year. The product is also moving beyond account opening into recurrent or high-stakes moments such as payment-link approvals, Pix-like high-value actions, digital credit, and betting KYC. Named proof is not just logo use: 99Pay, PagBank, Havan, BETMGM Brazil, Magie, and Fintec do Corban all have public descriptions of live deployment, specific use cases, and at least one measurable outcome or operating change. The evidence remains mostly vendor-curated, but it is recent enough and varied enough to show real production adoption across multiple Brazilian customer types rather than a single flagship reference.'
