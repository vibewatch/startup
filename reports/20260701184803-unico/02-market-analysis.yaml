  rows:
  - - Digital identity verification (KYC/onboarding)
    - Software licensing, per-verification API fees, integration services
    - Physical biometric-capture hardware, national-ID chip cards
    - Bank/fintech compliance and risk budgets
    - Unico's core product line
  - - Biometric authentication (facial/voice/liveness)
    - Liveness detection engines, facial-matching models, presentation/injection-attack detection
    - Physical access-control hardware (turnstiles, badge readers)
    - Same buyers, plus gambling and retail risk teams
    - Core to identity verification and continuous authentication
  - - Fraud prevention / anti-fraud analytics
    - Behavioral risk scoring, device fingerprinting, transaction-fraud modules
    - General-purpose cybersecurity (SIEM, firewalls, endpoint protection)
    - Risk/fraud teams at banks, fintechs, retailers, iGaming operators
    - Adjacent to Unico's fraud-risk-classification product
  - - Age verification / age assurance
    - Facial age-estimation engines, document-based age checks
    - Parental-control software, generic content filtering
    - iGaming, streaming, alcohol e-commerce compliance teams
    - A named, regulation-driven Unico product line since May 2026
  - - Deepfake / injection-attack detection
    - Presentation-attack detection (PAD), injection-attack detection (IAD)
    - General antivirus/endpoint security
    - Same buyers seeking anti-spoofing assurance
    - Positioned as a distinct segment by trade-press market reports
  - - Government digital-identity infrastructure
    - Public-sector-funded national ID issuance and Conta gov.br operation
    - Private-vendor commercial spend (delivered directly by the state)
    - Federal government / citizens (free of charge)
    - Adjacent market, largely excluded from Unico's addressable private spend
  - - Legacy manual / document-based KYC (status-quo substitute)
    - Manual review labor, in-person proof-of-life processes
    - Automated biometric software spend
    - Same compliance buyers, using older workflows
    - The substitute Unico's platform is sold to displace
  notes: Distinguishes the identity-verification, biometric-authentication, fraud-analytics, age-assurance, and deepfake-detection segments Unico competes in from the adjacent government-ID and legacy-manual-KYC categories that are largely excluded from its addressable private spend.
