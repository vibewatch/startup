- id: sizing-tam-sam-som-and-contradictory-estimates
  title: 'Sizing: TAM/SAM/SOM and Contradictory Estimates'
  body: |-
    Three independent analyst publishers estimate the global biometrics or digital-identity-solutions market, and none of them agree. Precedence Research puts the global biometrics market at $50.08 billion in 2024, growing to $307.24 billion by 2034 at a 19.89% CAGR. MarketsandMarkets, using a broader "digital identity solutions" market definition published in November 2025, estimates $44.20 billion in 2025 growing to $132.14 billion by 2031 at a 20% CAGR. Mordor Intelligence estimates $58.98 billion in 2025, $67.86 billion in 2026, and $136.86 billion by 2031 at a 15.07% CAGR. The spread in both current-year baseline (roughly $44 billion to $68 billion) and long-run forecast (roughly $132 billion to $307 billion) reflects differing market-scope definitions and forecast horizons rather than a single reconcilable number, and this chapter preserves that contradiction as evidence rather than averaging it away.

    None of the three publishers discloses a Brazil-specific breakout. In its place, this chapter substitutes two Brazil-specific proxies: Febraban's 2024 banking-technology survey, which found Brazilian banks budgeted R$47.4 billion for technology in 2024 (up from R$39 billion in 2023 and R$19.1 billion in 2015) with 100% of surveyed banks prioritizing cybersecurity and 75% already using facial biometrics in AI applications -- a buyer-ceiling proxy for serviceable market, not an identity-specific figure -- and Unico's own disclosed scale of 3 billion-plus verifications, 400-plus client companies, and 25-plus countries as a company-specific obtainable-market signal. The World Bank's ID4D program separately quantifies unmet demand globally: 800 million people lack any official identity document and 2.8 billion lack a digital identity usable for online transactions, a demand-side gap that is directionally supportive of continued market growth but is not itself a vendor-spend estimate.
