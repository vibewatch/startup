  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: global-market-size-disagreement
    missingEvidence: A reconciled global biometrics/digital-identity market-size figure or a documented explanation for why Precedence Research, MarketsandMarkets, and Mordor Intelligence diverge by more than $20 billion in current-year baseline.
    whyItMatters: Any TAM figure quoted from a single publisher without disclosing the other two estimates would materially overstate the precision of the sizing.
    diligencePath: Commission or obtain a licensed analyst report with disclosed methodology and confidence intervals, or request underlying segment-level data from at least one of the three publishers.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: brazil-specific-market-size
    missingEvidence: A Brazil-specific TAM/SAM breakout for biometrics, digital identity, or fraud-prevention spend from any independent analyst firm.
    whyItMatters: This chapter substitutes Febraban's total bank technology budget and Unico's disclosed scale as proxies precisely because no independent Brazil-specific figure exists; those proxies are directional, not audited market-size estimates.
    diligencePath: Commission a Brazil-specific market-sizing study, or request country-level segment data as a paid add-on from Precedence Research, MarketsandMarkets, or Mordor Intelligence.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: anpd-guidance-provisional
    missingEvidence: ANPD's finalized technical guidance on age assessment methods, which was still in public consultation (through July 9, 2026) as of the report run date.
    whyItMatters: The Digital ECA age-assurance mandate is a named 2026 growth driver, but the specific technical bar vendors must meet is not yet fixed, creating regulatory-compliance uncertainty for any vendor selling into this driver.
    diligencePath: Monitor ANPD's public consultation outcome and any finalized normative act following the July 9, 2026 comment deadline.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM004
