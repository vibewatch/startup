callouts:
- calloutType: risk
  title: No independent source reconciles a Brazil-specific market size
  body: Precedence Research, MarketsandMarkets, and Mordor Intelligence each publish a different global biometrics/digital-identity market estimate, and none breaks out Brazil specifically. This chapter substitutes Febraban's total bank technology budget and Unico's own disclosed scale as proxies, but a buyer should treat any Brazil-specific TAM/SAM number derived from this chapter as directionally indicative only, not as an independently verified figure.
  claimRefs:
  - CM008
  - CM010
  - CM011
  - CM014
  - CM016
- calloutType: assumption
  title: 2026 World Cup demand may be partially non-recurring
  body: The 50% surge in gambling users and the associated fraud-and-verification demand documented for early 2026 are explicitly tied to World Cup-driven iGaming activity. This chapter assumes some, but not all, of that 2026 growth persists into 2027 and beyond; the diligence ask is to isolate the World-Cup-linked share of any reported 2026 revenue growth from the underlying secular trend.
  claimRefs:
  - CM026
  - CM039
- calloutType: risk
  title: Bank in-house build capability constrains long-run vendor-addressable spend
  body: Febraban's 2024 survey found 75% of surveyed Brazilian banks already use facial biometrics within their own AI applications, funded by technology budgets that grew from R$19.1B (2015) to R$47.4B (2024). Large banks retaining or building core biometric-matching capability in-house is a structural ceiling on the vendor-addressable share of that budget, distinct from -- and potentially more durable than -- near-term competitive or pricing pressure.
  claimRefs:
  - CM040
  - CM044
