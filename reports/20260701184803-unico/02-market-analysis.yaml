- id: buyer-segments-and-adoption-drivers
  title: Buyer Segments and Adoption Drivers
  body: |-
    Banking and fintech remains the anchor buyer segment, with compliance and risk officers as the primary decision-maker and Pix-related fraud as the leading purchase trigger: Brazil processed more than 80 billion Pix transactions in 2025, 142 million Brazilians transacted via Pix by April 2026 (96.4% of the banked population), and Banco Central tightened account-blocking rules for suspected fraud in September 2025. iGaming and sports betting has emerged as a second major segment, amplified by a documented 2026 World Cup-linked surge: a 50% jump in gambling users, 28% of iGaming fraud occurring at onboarding, an 81% abandonment rate tied to friction, and up to 15% of industry revenue lost to bonus abuse -- with biometric identity verification credited by trade-press sources with lifting valid registrations 20%, speeding onboarding journeys 20%, and cutting bonus abuse 70%.

    Retail and e-commerce, telecom, and healthcare round out the buyer map, each with a distinct adoption trigger: chargeback and promo-abuse costs for retail, SIM-swap fraud and identity-based cyberattacks for telecom, and LGPD sensitive-health-data obligations for healthcare. Regulation is itself a growth driver in 2026: Brazil's Digital ECA (Law 15,211/2025), effective March 17, 2026, mandates age assurance for platforms serving minors, and Unico launched a dedicated age-verification product in May 2026 claiming 99.98% accuracy against 1.5 billion-plus identity checks performed in 2025. Deepfake and generative-AI fraud growth is a parallel driver: Biometric Update reported a 488% rise in deepfake and facial-manipulation fraud attempts in Brazil during the first half of 2025, and Kaspersky separately documented a 900% year-over-year rise in deepfake video content as early as 2023, both cited by vendors as justification for continued investment in liveness and presentation-attack detection.
