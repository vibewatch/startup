- id: FM004
  title: Brazil Identity-Verification Adoption and Value-Chain Flow
  type: flow
  layout: wide
  summary: Adoption moves from a fraud or regulatory trigger through vendor evaluation, pilot deployment, and renewal, with an internal-build branch that constrains vendor-addressable spend.
