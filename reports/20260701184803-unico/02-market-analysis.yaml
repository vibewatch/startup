    nodes:
    - id: trigger
      label: Fraud or regulatory trigger
      detail: Pix fraud growth, Digital ECA age-assurance mandate, or LGPD sensitive-data obligation creates a purchase mandate.
    - id: evaluate
      label: Buyer evaluates vendors
      detail: Compliance/risk or trust-and-safety owner runs an RFP or vendor comparison against named competitors.
    - id: pilot
      label: Pilot / proof-of-concept integration
      detail: Vendor is integrated into onboarding or transaction flow on a limited basis.
    - id: deploy
      label: Full deployment across onboarding and continuous authentication
      detail: Successful pilots scale into production KYC, age-verification, or fraud-risk-classification workflows.
    - id: renew
      label: Renewal or expansion to new use cases
      detail: Deployment expands into adjacent use cases such as age verification or deepfake detection.
    - id: inhouse
      label: Internal build alternative
      detail: Large banks with in-house AI capability and big technology budgets may insource biometric matching instead of buying.
    edges:
    - from: trigger
      to: evaluate
      label: creates mandate
    - from: evaluate
      to: pilot
      label: selects vendor
    - from: pilot
      to: deploy
      label: validates
    - from: deploy
      to: renew
      label: expands scope
    - from: evaluate
      to: inhouse
      label: alternative path
    - from: inhouse
      to: deploy
      label: bypasses vendor spend
  approximationNotes: Node sequence is inferred from vendor/competitor go-to-market messaging and Febraban survey findings on bank in-house AI adoption, not from a single documented buyer journey study.
