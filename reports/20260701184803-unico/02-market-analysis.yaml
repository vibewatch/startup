company:
  name: Unico
chapter:
  number: 2
  title: Market Analysis
  summary: 'Unico competes in Brazil''s digital-identity, biometric-authentication, and fraud-prevention market, a category three independent analyst firms size globally at roughly $44-68 billion in 2025-2026 baseline value, growing to $132-307 billion by 2031-2034 -- estimates that diverge by methodology and market-scope definition and that none of the analysts breaks out for Brazil specifically. This chapter substitutes Febraban''s R$47.4 billion 2024 Brazilian bank-technology budget and Unico''s own disclosed scale (3B+ verifications, 400+ clients, 25+ countries) as Brazil-specific sizing proxies, maps banking, iGaming, retail, telecom, and healthcare buyer segments against Pix-fraud growth, the 2026 Digital ECA age-assurance mandate, and 2026 World-Cup-linked iGaming demand as adoption drivers, and weighs those drivers against three structural constraints: false-positive/friction ceilings, bank in-house build capability, and unresolved competitive benchmarking against rivals such as VU Security.'
sections:
- id: market-definition-and-boundary
  title: Market Definition and Boundary
  body: |-
    Unico competes across five overlapping product segments: digital identity verification for KYC and onboarding, biometric authentication (facial, voice, and liveness detection), fraud-prevention analytics, age verification and age assurance, and deepfake/injection-attack detection. Included spend covers software licensing, per-verification API fees, and the machine-learning models that power liveness and anti-spoofing checks; excluded spend covers physical biometric-capture hardware and access-control turnstiles, which sit in a separate facilities-security budget entirely.

    A clean market-boundary line separates this addressable private-vendor spend from government-delivered digital identity. Brazil's federal Conta gov.br platform and the Carteira de Identidade Nacional (CIN), which uses the CPF as a unifying identifier, are issued and operated directly by the state at no charge to citizens -- an adjacent but largely non-addressable segment for a commercial vendor such as Unico, because the government is both the payer and the identity issuer rather than a customer. The status-quo substitute that identity-verification vendors displace is manual, document-based KYC review -- a slower, labor-intensive process that biometric automation is sold to replace.

    Regulatory context sharpens the boundary further. Brazil's LGPD (Lei 13.709/2018) explicitly classifies biometric data as "sensitive personal data" subject to stricter processing rules than ordinary personal data, which is one reason vendors market privacy-by-design and consent-management features as part of the product rather than a compliance add-on. That sensitive-data classification, together with the exclusion of the government-run identity layer, defines the addressable market this chapter sizes.
