- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Capture and experience layer
    - Collects selfie, document, or payment-flow inputs through SDK, web, redirect, or hosted journeys
    - Browser or webview compatibility, camera permissions, HTTPS domains, native-app wrappers
    - Hybrid-framework limitations and client-side permission errors can break rollout quality
  - - Contract and API layer
    - Exposes Web & SDK, API, and Magic Link contracts with different sync or async result patterns
    - OAuth2 JWT bearer issuance, API keys, host routing, callback or webhook handling
    - Integrators can mis-map contracts or environments because there is no single universal endpoint
  - - Core verification capabilities
    - Combines liveness, identity verification, fraud-risk classification, 1:1 or 1:N matching, document reuse, and age verification
    - Biometric engine quality, identity base coverage, and orchestration logic
    - Weakness in one capability can degrade the whole promise of deterministic answers
  - - Graph or behavior intelligence
    - Adds network history, serial-pattern detection, and time-series or graph signals around fraud
    - Historical transaction data, cross-customer patterning, and model upkeep
    - Behavioral models can drift or overfit without visible external benchmarking
  - - Adaptive transaction orchestration
    - Routes users across silent auth, passkey, or facial-biometric step-up based on risk context
    - Device metadata, behavioral signals, passkey support, and reference biometrics
    - Silent approvals or passkey fallback rules are hard to audit from public materials
  - - Vector-search and large-scale matching backend
    - Runs 1:N facial retrieval and ranking at national scale
    - Spanner vector search, embeddings quality, regional deployment, and low-latency serving
    - Scale claims are strong, but public architecture stops short of full failure-domain disclosure
  - - Partner and data integrations
    - Connects to issuers, government or records providers, AML or sanctions data, and Trully Mexico flows
    - External data freshness, issuer coverage, partner APIs, and regional compliance hooks
    - Partner outages or data-quality problems can propagate into customer-facing decisions
  - - Admin and enterprise identity layer
    - Supports People APIs, Sign workflows, SCIM provisioning, and SAML federation
    - Customer identity providers, HR data hygiene, and doc-governance workflows
    - Adjacent admin products can create scope creep and support burden beyond core verification
  notes: This table synthesizes explicit public architecture disclosures from official docs and the Google Cloud case study; it avoids claiming internal microservice details that were not published.
