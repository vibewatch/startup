- id: adjacent-modules-maturity-and-expansion
  title: Adjacent Modules, Maturity, and Expansion
  body: 'Unico is also using the platform to widen product scope. DevHub and separate documentation surfaces show adjacent modules for Sign, People, IDPay, Auto, SAML SSO, and SCIM provisioning. That matters because it changes the company from a pure verification vendor into a broader identity and workflow platform vendor, but the maturity is uneven. People and Sign look like real products with APIs and concrete operational language, yet Sign is publicly positioned as a People-compatible document-signature module rather than a standalone identity flagship. IDPay, by contrast, is tightly linked to payment-proof workflows and issuer integrations, so it looks closer to the identity core. The acquisition path also broadens capability. Oz Forensics adds anti-deepfake technology, Trully preserves a Mexico-specific onboarding contract, and OwnID extends the stack into passkeys and passwordless login. Finally, deployment maturity is not only a product question: a customer case study and local press
    both suggest Unico is investing in faster rollouts and a “One” access layer to reduce engineering lift for customers.'
