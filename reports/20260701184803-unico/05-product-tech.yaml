- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Open a regulated digital account
    - User submits selfie, identity data, and sometimes documents before account activation
    - Onboarding combines liveness, identity verification, fraud classification, and document capture
    - Company-claimed 3-second verification and high first-attempt approval
    - No public FRR, bias, or manual-review share
  - - Onboard globally without local document logic
    - User provides selfie and identifier-like input but not necessarily a document image
    - Non-Document Verification reuses liveness, face match, and fraud signals under one contract
    - Company says one response schema works across 25+ countries
    - Country-specific failure handling and exception workflows are not public
  - - Detect synthetic or serial fraud at sign-up
    - User appears legitimate but may reuse data, cycle devices, or coordinate across institutions
    - Fraud Risk Level Detection and Multi-Account Prevention add behavior analytics plus 1:N uniqueness search
    - Company-claimed hidden-risk and precision benefits without extra user steps
    - Third-party benchmark data is not public
  - - Approve or challenge an in-life transaction
    - Trusted users want low-friction transfers, withdrawals, or logins
    - Smart Revalidation scores context then routes to silent auth, passkey, or selfie challenge
    - Public pages say ~90% of transactions can pass via silent or passkey routes
    - No public incident, abuse, or fallback-rate disclosure
  - - Prove legal age online
    - User takes a selfie to access age-restricted products or content
    - Age Verification returns YES, NO, or INCONCLUSIVE and can optionally layer identifier checks
    - Official and independent sources describe fast binary decisions with no document upload
    - No public fairness, appeal, or edge-case handling metrics
  - - Authorize an online card payment or avoid chargebacks
    - User binds or uses a card in a remote transaction
    - IDPay / Card Not Present Verification checks identity, liveness, card ownership, and behavior
    - Issuer integrations can reduce disputes and support silent approvals for trusted users
    - Public economics and liability outcomes remain contract-specific
  - - Formalize HR or document transactions
    - User receives a signature request by e-mail or SMS and signs under document governance controls
    - Unico Sign, paired with People, manages digitally signed documents and API-based signature requests
    - Biometric authentication plus document retrieval can reduce paper-heavy workflows
    - Public materials do not show standalone Sign adoption, pricing, or cross-product rollout scale
  notes: Benefits are reported qualitatively unless a source provided a concrete public metric; absence of a metric in the final column means the reviewed sources did not quantify that step.
