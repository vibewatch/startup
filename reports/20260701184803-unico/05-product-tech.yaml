- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - IDCloud Onboarding
    - Banks, fintechs, wallets, regulated digital sign-up teams
    - Live / mature core flow
    - One capture can bundle liveness, identity, fraud, and document capture into a single decisioning flow
    - No public false-rejection, subgroup-bias, or per-vertical conversion breakdown
  - - Non-Document Verification
    - Cross-border onboarding teams and lower-friction sign-up flows
    - Live / targeted variant
    - Removes local document dependence while keeping liveness, identity, and fraud checks under one contract
    - No public disclosure of regional accuracy variance or fallback handling by country
  - - Fraud Risk Level Detection + Synthetic Identity prevention
    - Risk teams that need behavior-aware onboarding decisions
    - Live / differentiated analytics layer
    - Adds graph or time-series fraud signals and network history beyond clean-looking documents
    - Behavioral-model precision is company-claimed; external validation is not public
  - - Multi-Account Prevention / Step-up Authentication
    - Wallets, betting, and transaction-abuse programs
    - Live / high-signal anti-abuse module
    - Uses 1:N biometric uniqueness at sign-up and at the moment of action to enforce one-face rules
    - Public docs do not reveal customer-specific segmentation design or dispute rates
  - - Smart Revalidation
    - Existing-account transaction and login flows
    - Live / expanding orchestration layer
    - Adaptive routing across silent, passkey, and selfie challenge reduces friction versus biometric-only rechecks
    - No public SLA or failure-mode data for silent approvals, passkeys, or fallback logic
  - - Age Verification
    - Betting, adult content, streaming, and alcohol platforms
    - Newly launched / early scaling
    - Binary age-gating response from a selfie with selective-disclosure positioning and regulatory relevance in Brazil
    - No public fairness, age-band calibration, or appeals data
  - - IDPay / Card Not Present Verification
    - Merchants, wallets, and payment-risk teams
    - Live / payments-adjacent module
    - Combines identity, liveness, card ownership, behavioral signals, and issuer-network workflows
    - Liability-shift and dispute outcomes remain contract-specific and not publicly quantified
  - - People + Sign + SAML / SCIM admin surfaces
    - HR, enterprise-admin, and document-signature buyers
    - Live but adjacent to core identity stack
    - Extends the platform into document governance and enterprise identity administration
    - Public docs suggest Sign is People-coupled; standalone packaging and adoption are not clear
  notes: Rows summarize distinct public modules or surfaces visible across product pages and developer docs as of 2026-07-01; hidden internal services, pricing tiers, and unpublished SKUs are excluded.
