- id: architecture-integration-and-operating-model
  title: Architecture, Integration, and Operating Model
  body: 'The strongest public architecture evidence comes from Unico''s own developer materials plus Google Cloud''s vector-search case study. The integration model is explicit: capture can be hosted by Unico through Web, SDK, or redirect journeys; controlled by the client application through synchronous API image submission; or handled through a Mexico-specific Magic Link flow. That means “integration” is really a contract choice spanning different hosts, authentication schemes, payloads, and callback models, not a single universal endpoint. The Web SDK adds practical deployment constraints—secure HTTPS domains, WebRTC-compatible browsers and webviews, native camera permissions, and limited support for hybrid frameworks. Beneath that surface, public product and partner materials point to a biometric-decisioning stack with liveness, identity matching, graph or behavior signals, 1:N search, adaptive routing, and a vector-search backend operating at national scale. The company''s positioning
    on multicloud reliability and console monitoring is credible, but much of the reliability posture is still described qualitatively rather than through public SLA or incident records.'
