chapter:
  number: 5
  title: Product & Technology
  summary: 'Unico''s public product stack is a modular identity-decisioning platform rather than a single face-match API: the company documents onboarding, non-document verification, graph- or behavior-based fraud controls, 1:N duplicate detection, adaptive revalidation, age gating, IDPay payment proof, and adjacent People or Sign workflow modules. The best technical proof comes from Unico''s own developer contracts plus Google Cloud''s Spanner case study, which together show explicit SDK or API integration patterns and large-scale 1:N vector-search operations in Brazil and Mexico. The main diligence risks are not lack of surface area but lack of public transparency on false rejection, bias, uptime, incident history, and exact post-acquisition integration timing for newer modules such as age assurance and passwordless authentication.'
sections:
- id: product-scope-and-customer-jobs
  title: Product Scope and Customer Jobs
  body: 'Unico''s public surface is broader than a single selfie check. At the center is IDCloud, which the company frames as a modular identity-decisioning platform rather than a monolithic KYC widget. The core new-user flow starts with Onboarding, where one capture can trigger liveness, identity verification, fraud-risk classification, and document capture. Variants then strip or rearrange those steps depending on the customer''s job: Non-Document Verification removes document dependence for multinational sign-up; Fraud Risk Level Detection looks for network or behavioral abuse even when the presented identity looks plausible; Multi-Account Prevention performs 1:N biometric uniqueness checks at sign-up; and Data Verification adds AML, sanctions, PEP, and prohibited-bettor screening for regulated flows. Unico also extends the same identity graph into post-onboarding jobs such as adaptive revalidation, online payment proof, and age gating. The net result is a workflow stack organized around
    customer moments—registration, authentication, payment, age assurance, and document formalization—rather than around a single generic biometrics SKU.'
