- id: FE002
  title: Customer Workflow / Operating Flow
  type: flow
  layout: wide
  summary: Unico's operating loop starts with a capture or transaction event, adds modular identity checks, then returns a decision that can be reused across later moments.
  approximationNotes: The flow compresses multiple product variants into one operating picture because public sources describe them as interchangeable modules in a shared platform.
  data:
    nodes:
    - id: trigger
      label: Customer moment starts
      detail: A registration, login, transfer, payment, age gate, or signature request begins
    - id: capture
      label: Capture or context collection
      detail: Selfie, document, payment card, device metadata, or API image enters the flow
    - id: decide
      label: Modular identity decisions
      detail: Liveness, identity, fraud-risk, data-verification, or age modules fire as configured
    - id: route
      label: Adaptive routing
      detail: The system returns yes/no/inconclusive or chooses silent, passkey, or biometric challenge
    - id: fulfill
      label: Business action executes
      detail: Account opens, transaction proceeds, access is granted, or signature workflow continues
    - id: reuse
      label: State and history are reused
      detail: The result informs future revalidation, 1:N checks, payments, and anti-fraud decisions
    edges:
    - from: trigger
      to: capture
      label: initiates
    - from: capture
      to: decide
      label: feeds
    - from: decide
      to: route
      label: returns
    - from: route
      to: fulfill
      label: enables
    - from: fulfill
      to: reuse
      label: generates history for
    - from: reuse
      to: decide
      label: improves future decisions
  claimRefs:
  - CE002
  - CE004
  - CE007
  - CE009
  - CE011
  - CE028
