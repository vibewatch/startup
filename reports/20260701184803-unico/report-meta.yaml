companyProfile:
  summary: >-
    Unico is a Brazilian identity-infrastructure company that evolved from Acesso Digital into a biometric,
    fraud-prevention, and reusable-identity platform for high-trust onboarding and transaction flows. Its core
    strength is local distribution and data scale across Brazilian banks, fintechs, retailers, and adjacent
    regulated sectors, reinforced by a broadening product stack that now spans onboarding, liveness,
    transaction verification, digital signatures, age assurance, and passwordless authentication. The main
    underwriting challenge is not demand but evidence quality: public disclosure is still thin on audited
    economics, concentration, model performance, and post-2022 valuation.
  founders:
