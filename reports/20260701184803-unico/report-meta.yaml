  headquarters: São Paulo, Brazil
  productSummary: >-
    Unico sells transaction-based identity verification and fraud-decisioning software built around IDCloud,
    onboarding, liveness, non-document verification, 1:N duplicate detection, card-not-present payment checks,
    age verification, People/Sign workflow modules, and newer passwordless capability added through OwnID.
  customerFocus: >-
    Large banks, fintechs, retailers, payments platforms, iGaming operators, telecoms, and other regulated or
    fraud-sensitive enterprises that need high-conversion onboarding and recurring identity checks.
  businessModel: >-
    Predominantly usage-based monetization: Unico charges around transaction and verification workflows rather
    than pure seat-based SaaS, then expands accounts into adjacent modules such as IDPay, People/Sign, and age
    assurance.
  stage: Late-stage private
  fundingStatus: >-
    The last disclosed priced round was the April 2022 $100 million Series D at a $2.6 billion valuation. Public
    evidence after that points to self-funded acquisitions, profitability improvement, and no near-term plan for a
    new raise or IPO, but no fresh price-discovery event confirms whether the 2022 mark still holds.
