summary:
  headline: >-
    Track: Unico has real scale, product breadth, and recent profitability momentum in a structurally growing Brazil
    identity market, but the active Serasa Experian litigation, thin public disclosure, and stale 2022 valuation mark
    keep the current risk-reward from clearing a buy threshold.
