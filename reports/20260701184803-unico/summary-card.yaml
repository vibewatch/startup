  topStrengths:
    - >-
      Unico has unusually deep local distribution for an identity platform, with public proof across four of Brazil's
      top five banks and more than 800 enterprise customers.
    - >-
      The product stack is broader than selfie-based KYC alone, spanning onboarding, fraud scoring, payment
      verification, age assurance, digital signatures, and passwordless authentication.
    - >-
      Management has shown visible operating progress, including a first positive EBITDA in 2024 and 30% to 40%
      consolidated revenue-growth guidance for 2026.
    - >-
      Serial acquisitions in Mexico, liveness detection, and passwordless authentication broaden the platform beyond a
      Brazil-only onboarding niche.
  topRisks:
    - >-
      The Serasa Experian dispute is unresolved, partly sealed, and could carry legal, reputational, and competitive
      consequences if Unico's allegations are substantiated or if the case drags on.
    - >-
      No fresh financing round, secondary mark, or fair-value disclosure confirms that the widely repeated $2.6 billion
      valuation still reflects current market-clearing value.
    - >-
      Public disclosure is weak on audited financials, cash burn, debt, concentration, logo churn, and independent
      model-performance metrics such as false rejects, bias, and uptime.
    - >-
      Brazil and banking remain the economic center of gravity, leaving the company exposed to domestic regulation,
      procurement cycles, in-house bank builds, and bureau-backed competitors.
  unresolvedGaps:
    - >-
      A fresh primary or secondary valuation mark, or board-level fair-value signal, to replace the stale April 2022
      pricing reference.
    - >-
      Audited 2025-2026 financial statements with current cash, debt, burn, working-capital, and acquisition-integration
      cost detail.
    - >-
      Verified customer-retention and concentration data, including NRR, GRR, top-customer share, contract duration, and
      government-deployment mix.
    - >-
      Independent evidence on biometric-model quality, false-reject trends, bias testing, and the eventual financial or
      operational impact of the Serasa litigation.
