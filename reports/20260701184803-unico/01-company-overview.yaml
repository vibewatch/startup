  name: Unico
chapter:
  number: 1
  title: Company Overview
  summary: Unico idtech S.A. is a Sao Paulo-headquartered digital-identity and biometric-authentication company founded in 2007, backed by General Atlantic, SoftBank, and Goldman Sachs since a ~$2.6 billion April 2022 Series D. Public sources support large transaction scale, a 2024 first-profit milestone, and an aggressive 2024-2026 acquisition and global-expansion push (Oz Forensics, Trully.AI, OwnID, a new Menlo Park headquarters), but they also show a January 2023 mass layoff, a trade-press characterization of the core product's revenue power as 'waning', and an active June 2026 lawsuit against Serasa Experian over alleged unauthorized use of Unico's biometric technology.
sections:
- id: identity-product-business-model
  title: Identity, Product, and Business Model
  body: |-
    Unico idtech S.A. is a Brazilian digital-identity and biometric-authentication company headquartered in Sao Paulo. The company was founded in 2007 as Acesso Digital, a document-digitization business, and later pivoted toward facial-biometric identity verification -- a shift founder Diego Martins has described as the company's defining turning point. The business rebranded to Unico around its 2021 fundraising and now describes itself as the world's largest identity-validation network.

    Unico's product stack combines facial biometrics, liveness detection, AI-based risk signals, and behavioral analytics into a platform sold to banks, fintechs, retailers, gambling operators, and (since the 2025 OwnID acquisition) global consumer brands. The company reports processing more than 1.2 billion identity authentications per year against a biometric reference network of 170 million-plus unique faces across 21-plus countries, and more than 150 million transactions per month on a Google Cloud-based multicloud security-and-compliance platform. Its own newsroom states the company prevented more than R$3.2 billion in fraud in 2024 and authenticates identity for 9 of Brazil's 10 largest retailers, 4 of the 5 largest banks, and 8 of the 10 largest betting companies -- concentration that makes Brazilian financial-services and gambling-sector demand central to the current business model.
