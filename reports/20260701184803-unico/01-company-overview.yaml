- id: scale-milestones-global-expansion
  title: Scale, Milestones, and 2025-2026 Global Expansion
  body: |-
    Unico's own disclosures show a long run of scale claims: an FGV-commissioned study found 850 million cumulative facial-biometric authentications between 2018 and 2023 with an estimated R$8.6 billion five-year GDP impact; its ID Unico product logged 735 million transactions and blocked 10 million frauds across four banks and nine retailers by September 2023; and its IDPay product processed more than 1.5 billion credit-card transactions within six months of its 2023 launch. Unico's World Economic Forum profile separately states the company prevented more than $14 billion in fraud in 2023 across 165 million-plus users and 20-plus countries.

    The 2024-2026 period layered acquisitions (Oz Forensics and Trully.AI in September 2024; OwnID in September 2025) onto that scale, extending the platform into deepfake detection, the Mexican market, and -- via OwnID's marquee logos including the IOC, Bayer, Carrefour, Michael Kors, Nestle, and the NFL -- a formal US market entry. In April 2026 Unico opened a new global headquarters in Menlo Park, California, hiring executives from Meta, Apple, and Google, and by Q1 2026 the company reported 84% year-over-year growth in identity-verification transaction volume, with particularly fast growth in Mexico. At SXSW in March 2026, Unico said it now processes more than 1.5 billion authentications with a claimed 0% false-acceptance rate, framing 2025's reported 1,082% year-over-year rise in fraud attempts as the reason AI-enabled attacks could climb a further 150-550% in 2026. Independent sources put the total number of completed acquisitions at either nine (Biometric Update, September 2025) or ten with four since 2022 (Startupi, December 2025) -- a discrepancy this chapter treats as unresolved rather than reconciled.
