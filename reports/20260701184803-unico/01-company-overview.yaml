- id: founders-leadership-governance
  title: Founders, Leadership, and Governance
  body: |-
    Unico's newsroom names Diego Martins, Rui Jordao, and Paulo Alencastro as founders. Martins led the company as CEO until February 6, 2024, when Unico announced a leadership transition: Sergio Chaia -- a former CEO of Nextel Brazil and Sodexo who had advised Unico for about eight years -- became CEO of the Brazil operation, while Martins moved to a newly created CTO Global role focused on internationalization, retaining the board chairmanship. As of that announcement, Unico's board included representatives from General Atlantic, SoftBank, and Goldman Sachs, reflecting the concentration of governance influence among the company's three largest institutional backers.

    The 2022-2024 period also brought a wave of senior hires -- a new CIO, product, data, engineering, and HR/PeopleX directors from Google, Loggi, Nubank, B3, C6 Bank, and Unilever -- alongside a CFO (Mauricio Teixeira, ex-Hapvida, hired December 2023), a VP of global strategy (Rodrigo Magalhaes, ex-Itau BBA/Credit Suisse), and an IDPay chief growth officer (Paulo Naliato, ex-Cielo/Casas Bahia). That pattern suggests a deliberate professionalization of management ahead of Unico's first reported profitable quarter in 2024, but public sources still leave exact board voting rights, founder ownership percentages, and committee structure undisclosed -- a real diligence gap given the company's history of layoffs, acquisitions, and now active litigation.
