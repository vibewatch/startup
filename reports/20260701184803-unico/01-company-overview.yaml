- id: funding-investors-valuation
  title: Funding History, Investors, and Valuation
  body: |-
    Unico's disclosed financing history begins with a 2021 round of roughly R$625 million (about US$120 million) led by SoftBank and General Atlantic, which coincided with the company's rebrand from Acesso Digital to Unico and its move to unicorn status with about 800 clients. In April 2022 the company raised a US$100 million Series D led by Goldman Sachs Asset Management, with SoftBank and General Atlantic also participating; the round valued Unico at approximately US$2.6 billion and gave Goldman a board seat. At the time, Unico reported roughly 25 million authentications per month. That valuation reference was still being cited by press coverage of the September 2024 Trully.AI acquisition, which also confirmed a 17-country footprint, suggesting no materially different priced round had been disclosed in the intervening two-plus years.

    By mid-2024, CEO Sergio Chaia told Brazil Journal that Unico had no near-term or medium-term plans for an IPO or a new funding round, citing sufficient cash to fund its own international expansion -- even as the company reported its first quarterly net profit (R$14 million for Q1 2024, rising to R$22 million in April alone) on 50% year-over-year revenue growth, with the IDPay product having processed more than R$5 billion in transactions. That combination of profitability, self-funded expansion, and continued acquisitions (Oz Forensics and Trully.AI in September 2024; OwnID in September 2025) is consistent with a company using operating cash flow and its 2022 capital base rather than fresh primary equity to fund the 2024-2026 global push.
