      - number: '5.3'
        title: Cloud Architecture, Multi-Tenant Infrastructure, and Stack
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Tipalti operates a multi-tenant software-as-a-service infrastructure governed by a
              unified codebase, eliminating customer-managed upgrades and version fragmentation. The system image is
              backed up on a daily basis with automated database snapshots every four hours, replicating critical state
              to an offsite secondary environment for robust disaster recovery. The application stack features
              bi-directional integration engines that maintain continuous synchronization with leading ERP platforms,
              including NetSuite, SAP, Workday, and QuickBooks. Executive technology leadership under Chief Product and
              Technology Officer Roby Baruch has focused on embedding machine-learning pipelines directly into core
              transaction paths. These capabilities power automated document parsing and intelligent payment routing,
              ensuring continuous throughput across global high-volume customer deployments.
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
