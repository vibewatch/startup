  - id: FO001
    title: Tipalti Corporate Milestone and Capitalization Timeline
    type: timeline
    summary: >-
      Chronological evolution of Tipalti from its 2010 founding through major equity rounds, debt facilities, product
      acquisitions, and AI platform developments.
    data:
      items:
        - date: '2010'
          label: Company Founded
          detail: >-
            Chen Amit and Oren Zeev establish Tipalti to automate cross-border payments for ad networks and digital
            publishers.
          tone: positive
        - date: '2014'
          label: Platform Expansion
          detail: >-
            Tipalti rolls out multi-currency automated routing, tax compliance screening, and initial cloud ERP sync
            capabilities.
          tone: positive
        - date: 2021-04
          label: Approve.com Acquisition
          detail: Acquires Approve.com for $40 million to integrate cloud procurement intake and vendor approval workflows.
          tone: positive
        - date: 2021-12
          label: Series F Valuation Peak
          detail: >-
            Raises $270 million in Series F equity financing led by G Squared, reaching an $8.3 billion post-money
            valuation mark.
          tone: positive
        - date: 2023-05
          label: Growth Debt Facility
          detail: >-
            Secures $150 million in growth financing from JPMorgan Chase Bank and Hercules Capital to support
            operational expansion.
          tone: neutral
        - date: 2023-08
          label: European EMI Licensing
          detail: >-
            Expands European footprint under Electronic Money Institution authorization to support localized
            cross-border banking rails.
          tone: positive
        - date: 2025-08
          label: Statement Acquisition
          detail: >-
            Acquires AI-native treasury automation startup Statement to embed real-time cash forecasting and liquidity
            management.
          tone: positive
        - date: 2025-09
          label: $200M Debt & AI Agent Launch
          detail: >-
            Secures $200 million in growth debt from Hercules Capital; announces $200M+ ARR and introduces agentic
            Tipalti AI capabilities.
          tone: positive
        - date: 2026-04
