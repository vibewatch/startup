      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Tipalti operates under the joint governance of co-founder and Chief Executive Officer Chen Amit and
              co-founder and Chairman Oren Zeev, managing partner of Zeev Ventures. The executive management committee
              includes President Rob Israch, Chief Financial Officer Dan Barzily, Chief Customer and Operating Officer
              Manish Vrishaketu, Chief Revenue Officer Wissam (Sam) Barakat, Chief Product and Technology Officer Roby
              Baruch, and Chief Legal & Regulatory Officer Alice Davidson. Governance and audit oversight are supported
              by Audit Committee Chair Teodora Gouneva, advisor Carl Pascarella, and lead institutional investor Dovi
              Frances. Because core payment architecture, capital relationships, and corporate vision remain closely
              held by founding leadership, executive succession and institutional continuity present material key-person
              considerations.
            claimRefs:
