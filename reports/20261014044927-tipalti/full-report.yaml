chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Genesis, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Tipalti (operating legally as Tipalti Payments, Inc.) was established in 2010 by Chief Executive Officer
              Chen Amit and Chairman Oren Zeev. The company originated from an acute operational pain point:
              international vendor payout inefficiencies and currency exchange frictions experienced by digital
              businesses sending cross-border remittances to online ad publishers. Headquartered at 1051 E. Hillsdale
              Boulevard in Foster City, California, Tipalti has established a distributed international operational
              footprint with offices in Tel Aviv, London, Vancouver, Toronto, Tbilisi, Amsterdam, Plano, and Medellín.
              Operating as a licensed Money Services Business (MSB) in the United States and a regulated Electronic
              Money Institution (EMI) in the United Kingdom and European Union, Tipalti provides cloud architecture
              connecting mid-market finance teams to banking rails across more than 200 countries and territories in 120
              currencies with over 50 payment methods.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
