callouts:
  - calloutType: risk
    title: Multi-Jurisdictional Money Transmission and Banking Rail Fragility
    body: Tipalti relies on regulated money transmitter licenses in the US, an EMI license in the Netherlands, and partnerships with commercial banks like Citi and J.P. Morgan. Any compliance lapse in AML/KYC or sanctions screening could jeopardize local operating licenses or lead to clearing partner de-risking.
    claimRefs:
      - CR003
      - CR004
      - CR010
  - calloutType: insight
    title: Debt-Funded Growth and Valuation Asymmetry
    body: Tipalti has raised substantial growth debt—most recently $200 million from Hercules Capital in September 2025—while anchoring to a stale 2021 equity valuation of $8.3 billion. In the absence of disclosed profit margins or net retention metrics, debt service covenants create downside vulnerability if payment volume growth decelerates.
    claimRefs:
      - CR011
      - CR012
      - CR013
