figures:
  - id: FP001
    title: Competitive Positioning Map
    type: quadrant
    summary: >-
      Comparative positioning across global payout complexity and ERP integration depth illustrates Tipalti
      differentiation in cross-border disbursements against ERP-native and domestic AP alternatives.
    data:
      xAxis:
        label: Global Payout & Multi-Currency Breadth
        min: 1
        max: 5
      yAxis:
        label: ERP Architecture Depth & System-of-Record Native Integration
        min: 1
        max: 5
      points:
        - label: Tipalti
          x: 4.8
          'y': 3.2
          detail: Leader in cross-border mass payouts (196+ countries) with subledger ERP sync
        - label: Zone & Co
          x: 3.6
          'y': 4.8
          detail: NetSuite-native procure-to-pay eliminating subledger sync and pooled float
        - label: Coupa
          x: 4.5
          'y': 4.2
          detail: Enterprise business spend management with global compliance and deep ERP integrations
        - label: BILL
          x: 2.2
          'y': 2.8
          detail: Domestic-first mid-market AP with basic sync layer and growing cross-border support
        - label: Stampli
          x: 2.5
          'y': 3.4
          detail: Collaboration-first AP automation across 70+ ERPs with third-party payment rails
        - label: Yooz
          x: 2.1
          'y': 3
          detail: AI invoice processing middleware with 200+ ERP connectors but no native disbursement
        - label: Airbase
          x: 3.8
          'y': 3.3
          detail: Unified spend management combining cards, AP, and expense with global payment support
    approximationNotes: >-
      Points scored on an ordinal 1–5 scale based on documented global disbursement coverage (1=domestic only, 5=200+
      countries with local rails) and ERP architecture depth (1=isolated tool, 5=ERP-native system of record).
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP008
      - CP014
callouts:
