      Tipalti unified multi-entity infrastructure, money transmitter licenses in the US and EU, and automated W-8/W-9
      tax collection across 196+ countries create a high moat that domestic AP point solutions cannot easily replicate
      without heavy regulatory and compliance investments.
    claimRefs:
