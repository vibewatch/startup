        - FX conversion spread + transaction rail fees
        - AP-first; lightweight PO intake
        - High ROI for high-volume cross-border payouts; less cost-efficient for domestic-only SMB
      - - BILL
        - Per-user subscription + usage
        - Starts ~$45/user/month
        - Per-transaction fees for ACH, checks, cards
        - Standard invoice-to-pay
        - Predictable for small teams; per-seat pricing escalates significantly across large approval chains
      - - Zone & Co
        - NetSuite SuiteApp subscription
        - Custom annual contract
        - Partner bank execution (TransferMate live FX)
        - Full P2P (procure to bank reconciliation)
        - Eliminates sync maintenance and subledger float; premium NetSuite-locked pricing
      - - Yooz
