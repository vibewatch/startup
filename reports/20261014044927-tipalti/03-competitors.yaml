        - Starts ~$199/month (unlimited users)
        - None (disbursements executed through external banks)
        - AP capture and approval middleware
        - Low barrier to entry for invoice scanning; requires separate banking disbursement rails
      - - Stampli
        - Volume-based subscription
        - Custom tier based on invoice volume
        - Optional Stampli Direct Pay fees
        - Approval-centric AP workflows
        - Maximizes internal communication efficiency; total cost varies with ERP connectors
      - - Coupa
