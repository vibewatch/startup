callouts:
  - calloutType: insight
    title: The Payment-First Disconnect in Spend Management
    body: While accounts payable automation tools govern post-invoice processing and outbound remittances, procurement platforms like Order.co highlight that pre-purchase controls operate at the catalog and requisition stage. Tipalti's focus on international payout rails provides deep defensibility in cross-border disbursements but leaves upstream spend governance dependent on ERPs or adjacent procurement add-ons.
    claimRefs:
      - CM008
      - CM009
  - calloutType: risk
    title: Mid-Market Squeeze Between SMB Platforms and Enterprise Suites
    body: Tipalti's core sweet spot (50 to 1,000 employees) faces structural boundary pressures. Smaller businesses below $5M in revenue find Tipalti's $1,500 to $5,000 monthly total cost and multi-month implementation prohibitive compared to Bill.com or Melio, while upper-mid-market enterprises expanding into global procurement are targeted by enterprise suites like SAP Concur and Coupa.
    claimRefs:
      - CM002
      - CM007
      - CM013
