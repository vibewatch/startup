      - Primary Buyer / Payer
      - Strategic Relevance
    rows:
      - - Core Accounts Payable Automation
        - Supplier invoice capture, OCR extraction, PO 3-way matching, payment approvals, and ERP reconciliation
        - Pre-purchase requisition approvals, punch-out catalog procurement, and direct materials sourcing
        - Corporate Controller / VP Finance
        - Eliminates manual invoice data entry and accelerates monthly financial close across ERP systems
      - - Global Mass Payouts & Marketplace Remittances
        - High-velocity disbursements to creators, affiliates, freelancers, and global contractors in 190+ countries
        - Domestic payroll, executive compensation, and employee benefits administration
        - Head of Operations / VP Finance
        - Core competitive differentiator providing 50+ payment methods and multi-currency banking rails
      - - Tax Compliance & Regulatory Onboarding
        - Self-service vendor portal, W-9/W-8 collection, TIN validation, 1099/1042-S filing prep, and sanctions screening
        - Corporate income tax filings, sales tax / VAT remittance calculation, and transfer pricing audit
        - Director of Tax / Corporate Controller
        - Reduces audit exposure and regulatory penalties under US and international tax withholding rules
      - - Pre-Purchase Spend & Strategic Procurement
        - Basic purchase order generation and basic intake request workflows via add-on modules
        - Enterprise catalog sourcing, vendor contract lifecycle management, and tail-spend marketplace governance
        - Head of Procurement / Chief Procurement Officer
        - Boundary adjacency where dedicated spend platforms like Order.co or Coupa govern upstream commitments
    notes: Segmentation delineates Tipalti's operational footprint across accounts payable and global disbursements versus adjacent pre-purchase procurement categories.
