evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: covenants-and-debt-terms
    missingEvidence: >-
      Audited financial statements detailing debt covenants, repayment schedules, and interest rates for the 2023 and
      2025 Hercules Capital credit facilities.
    whyItMatters: High debt service costs could restrict R&D cash flow and impair underwriting resilience in down markets.
    diligencePath: >-
      Request confidential credit facility agreements and debt amortization schedules during confirmatory management
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-secondary-marks
    missingEvidence: >-
      Recent 409A valuation appraisals, board-approved secondary transactions, or tender offer records establishing
      current common share fair value.
    whyItMatters: >-
      The $8.3 billion valuation dates to December 2021 and likely overstates fair equity value given macro multiple
      compression.
    diligencePath: Obtain latest independent 409A appraisal reports and secondary trading logs directly from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-composition
    missingEvidence: >-
      Audited financial breakdown between fixed SaaS subscription fees and variable payment processing / foreign
      exchange revenue spreads.
    whyItMatters: >-
      Without disclosure of software ARR versus payment transaction margins, underwriting Tipalti's revenue quality and
      software multiple durability remains uncertain.
    diligencePath: >-
      Request management presentation or confidential information memorandum detailing 2024–2026 revenue bridges by
      product line (AP SaaS, Mass Payouts, FX take-rate, Treasury).
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: procurement-adjacency
    missingEvidence: >-
      Independent quantitative benchmark evaluating customer adoption rates for Tipalti's procurement add-on module
      versus specialized procure-to-pay suites.
    whyItMatters: >-
      Clarifies whether Tipalti successfully captures pre-purchase spend or remains primarily confined to downstream
      disbursement workflows.
    diligencePath: >-
      Conduct customer reference interviews across mid-market finance teams that evaluated or adopted Tipalti
      Procurement alongside core AP automation.
  - type: private-evidence-only
    severity: material
    topic: competitor-benchmarks
    missingEvidence: >-
      Audited cohort retention rates, customer churn metrics, and segmented cross-border payment volume comparison data
      for Tipalti versus direct AP competitors.
    whyItMatters: >-
      Without verified net revenue retention and competitor churn metrics, underwriting cannot definitively establish
      whether Tipalti multi-entity capabilities prevent customer leakage to ERP-native or spend-card rivals.
    diligencePath: >-
      Request customer cohort retention reports, gross retention by ERP tier (NetSuite vs Sage vs QuickBooks), and
      competitive win/loss reviews during management diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Audited GAAP financial statements detailing gross margins and cost of goods sold separated between software
      hosting and payment execution fees.
    whyItMatters: >-
      Understanding the gross margin split is essential to determine whether Tipalti should be underwritten as an 80%
      gross margin enterprise software business or a lower-margin payments processor.
    diligencePath: Request management's audited income statements and revenue segment margins for fiscal years 2024 through 2026.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-burn
    missingEvidence: >-
      Complete credit agreement documentation for the $350 million in growth facilities from Hercules Capital and
      JPMorgan Chase, including interest rate terms, minimum liquidity covenants, and repayment amortization.
    whyItMatters: >-
      Substantial debt obligations create fixed payment overhead that could impair ongoing software R&D or force
      restrictive cash management if net burn expands.
    diligencePath: Request full loan and security agreements, compliance certificates, and latest covenant testing reports.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: Public practitioner-community metrics, developer API latency benchmarks, and webhook error telemetry.
    whyItMatters: >-
      As a proprietary enterprise fintech platform, Tipalti provides private developer hub APIs but lacks an open-source
      public repository footprint, limiting independent evaluation of integration ergonomics.
    diligencePath: >-
      Request sandbox API test environments, webhook failure rate logs, and integration partner references during
      technical evaluation.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Disclosure of individual customer contract values, multi-year commitment lengths, and renewal terms for marquee
      customers such as Calm, Udemy, and AppLovin.
    whyItMatters: >-
      Without contract duration and ACV data, it is difficult to determine whether enterprise logos represent minor
      departmental pilots or mission-critical corporate commitments.
    diligencePath: >-
      Request customer cohort ACV distribution, average contract length, and top-20 customer revenue contribution during
      management diligence.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR) and gross revenue retention (GRR) cohorts across mid-market corporate accounts
      versus creator-economy platforms.
    whyItMatters: >-
      Reported headline 99% retention may mask underlying gross churn or contraction in volatile creator and ad-tech
      verticals where payout volumes fluctuate.
    diligencePath: >-
      Request audited revenue retention schedules segmented by customer tier and vertical for fiscal years 2023 through
      2026.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: debt-facility-terms
    missingEvidence: >-
      Complete credit agreement disclosure for the $200 million Hercules Capital growth facility, including interest
      margins, financial covenants, debt service coverage ratios, and maturity dates.
    whyItMatters: >-
      Growth debt creates structural subordination for equity holders and can trigger acceleration or forced refinancing
      if growth slows or operating margins compress.
    diligencePath: >-
      Request the credit facility agreement and covenant compliance certificates from management during confirmatory
      diligence.
    relatedQuestionRefs:
      - QR009
  - type: conflicting-data
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Jurisdiction-by-jurisdiction license audit and regulatory examination findings across US state money transmitter
      authorities and European regulators.
    whyItMatters: >-
      Understanding unresolved examination items or consent orders is critical to evaluating whether cross-border payout
      operations face regulatory enforcement risk.
    diligencePath: >-
      Request regulatory examination reports, state supervisory ratings, and AML audit results from Tipalti's chief
      legal and compliance officer.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: 409A and secondary marks
    missingEvidence: >-
      Audited common stock 409A valuation reports and verified secondary market transaction clearing prices from 2024
      through 2026.
    whyItMatters: >-
      Without observable equity marks, investors cannot determine whether current equity grants and secondary trades
      reflect the $8.3 billion headline price or realistic multiples.
    diligencePath: Request company 409A valuation summary letters and cap-table waterfall models under NDA.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: gross margin split
    missingEvidence: >-
      Audited gross margin and net revenue retention breakdowns by software subscriptions versus payments transaction
      revenue.
    whyItMatters: >-
      Payment volume processing typically carries lower gross margins (20%-40%) than pure SaaS software (75%-80%),
      fundamentally altering the justifiable enterprise value multiple.
    diligencePath: Request management's audited revenue and margin bridge by revenue stream.
    relatedQuestionRefs:
      - QV001
      - QV006
    relatedTableRefs:
      - TV003
