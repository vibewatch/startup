        - 已通过一手新闻稿验证已报告的运营 KPI；利润率和留存率尚未验证
        - 需要直接查阅经审计财务报表和高级债务契约
      - - 风险评级
        - 高
        - $350M 债务额度带来的杠杆、受监管的跨境资金转移及合作伙伴争议
        - 高级债务负担会威胁下轮重组中普通股的回收价值
      - - 估值立场
        - 昂贵
        - 历史 $8.3B 估值相当于 41.5x ARR，而公开金融科技可比公司交易倍数为 3x-6x
        - 基于基本面的公允价值较 Series F 峰值低 65% 至 85%
      - - 目标行动
        - 监测
        - 跟踪智能代理 AI 产品的采用情况，以及潜在 IPO 或二级市场价格发现
        - 就债务偿还计划和经审计的毛利率桥接表与管理层沟通
    notes: 截至 2026-10-14 评估，依据为已验证的 $200M ARR 运营规模和累计 $350M 债务额度。
