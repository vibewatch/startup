            body: >-
              对 Tipalti 的财务投资判断是：这是一个已实现超过 $200M 年经常性收入、规模化且关键的金融科技平台。不过，机构投资判断受到三个仅凭公开披露无法解决的主要尽调阻碍限制。第一，缺少经审计的 GAAP
              毛利率桥接，投资人无法判断当前规模究竟由高毛利软件订阅还是低毛利支付费率驱动。第二，高度依赖 $350M 增长债务额度，需要严格审查利息覆盖、债务契约和到期结构。第三，Better Business Bureau
              的公开投诉记录显示，收款人入驻和跨境付款在敏感国际通道中反复出现冻结摩擦，说明若不加以管理，运营和监管合规成本可能影响交易量增长和客户支持利润率。
