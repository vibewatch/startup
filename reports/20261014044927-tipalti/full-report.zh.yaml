chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营版图
        blocks:
          - type: paragraph
            body: >-
              Tipalti（法律实体为 Tipalti Payments, Inc.）由 CEO Chen Amit 和董事长 Oren Zeev 于 2010
              年创立。公司的起点是一个尖锐的运营痛点：数字企业向在线广告出版商进行跨境汇款时，国际供应商付款低效且货币兑换摩擦严重。Tipalti 总部位于加州 Foster City 的 1051 E. Hillsdale
              Boulevard，并已在 Tel Aviv、London、Vancouver、Toronto、Tbilisi、Amsterdam、Plano 和 Medellín 建立分布式国际运营网络。Tipalti
              在美国以持牌 Money Services Business（MSB）运营，在英国和欧盟受监管为 Electronic Money Institution（EMI），通过云架构连接中型市场财务团队与覆盖 200
              多个国家和地区的银行通道，支持 120 种货币和 50 多种支付方式。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
