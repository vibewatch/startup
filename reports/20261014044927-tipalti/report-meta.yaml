companyProfile:
  summary: >-
    Tipalti is a late-stage private finance-automation company serving mid-market and global businesses that need
    accounts payable, mass payouts, tax compliance, procurement intake, expenses, cards, and treasury workflows in a
    single operating layer. The company has verified scale with more than $200 million in ARR, more than 5,000
    customers, and $75 billion in annualized payment volume, but it remains hard to underwrite because the mix of SaaS
    revenue versus payment take-rate economics is still opaque and the latest equity price discovery is stale.
