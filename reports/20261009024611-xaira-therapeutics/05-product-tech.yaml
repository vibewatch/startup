callouts:
  - calloutType: "insight"
    title: "The Strategic Imperative of Drug-Ready Molecular Generation"
    body: "Xaira's technical differentiation relies heavily on producing macromolecule leads that are drug-ready from the start rather than crude structural scaffolds requiring iterative rounds of laboratory affinity maturation. If validated experimentally, de novo antibody design could significantly compress the preclinical timeline from target discovery to candidate nomination. However, achieving reliable in vivo developability and low immunogenicity directly from computational generative models represents an unsolved industry-wide challenge that requires continuous closed-loop wet-lab feedback."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE014"
  - calloutType: "risk"
    title: "Capital Intensity and High Infrastructure Dependency"
    body: "Training massive multimodal biological models alongside de novo structural algorithms requires substantial sustained supercomputing power. Xaira's strategic reliance on the OCI Supercluster provides immediate access to high-density GPU capacity but ties platform velocity to cloud infrastructure availability and high ongoing operational cash burn. Furthermore, because AI-generated drug candidates face standard regulatory and clinical hurdles, computational efficiency cannot substitute for clinical safety and efficacy data."
    claimRefs:
      - "CE011"
      - "CE013"
      - "CE015"
