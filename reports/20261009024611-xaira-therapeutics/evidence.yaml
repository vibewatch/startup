evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: Primary incorporation or formation record resolving whether the operative founding date is in 2023 or 2024.
    whyItMatters: A canonical founding date anchors the company's operating history and milestone chronology.
    diligencePath: Request the certificate of incorporation and formation timeline from company counsel.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: financing-terms-gap
    missingEvidence: >-
      Fully diluted capitalization table, security purchase agreements, funded-versus-committed schedule, liquidation
      preferences, tranches, debt, and credit terms.
    whyItMatters: >-
      The $1 billion headline cannot establish cash availability, investor ownership, dilution, preference overhang, or
      effective entry valuation.
    diligencePath: >-
      Request the cap table, financing documents, bank statements, debt schedule, and board-approved sources-and-uses
      plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale-metrics-gap
    missingEvidence: >-
      Audited revenue, contracted customer or collaboration schedule, company-wide headcount roster, burn, and cash
      balance.
    whyItMatters: >-
      These metrics are necessary to distinguish organizational build-out from commercial traction and to calculate
      runway.
    diligencePath: >-
      Request management accounts, customer and collaboration contracts, HR roster, cash statements, and monthly burn
      bridge.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Complete founder, officer, director, committee, succession, and key-person-retention roster.
    whyItMatters: >-
      The public sample cannot establish governance independence, control allocation, succession resilience, or full
      functional coverage.
    diligencePath: >-
      Request the current board and officer register, committee charters, organization chart, employment agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: Complete investor syndicate, ownership percentages, board designation rights, and secondary-transfer history.
    whyItMatters: The sample cannot establish control, concentration, follow-on reserves, or actual secondary pricing.
    diligencePath: >-
      Reconcile the cap table, investor rights agreement, board consents, transfer ledger, and any brokered secondary
      confirmations.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events-and-clinical-progress
    missingEvidence: >-
      Primary clinical, regulatory, litigation, incident, partnership, and program-stage disclosures current to the run
      date.
    whyItMatters: >-
      The absence of such evidence in the assigned pool cannot prove that no adverse event exists or establish
      therapeutic progress.
    diligencePath: >-
      Obtain company program records and conduct regulator, court, trial-registry, and partner diligence outside this
      constrained chapter pool.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: commercial-contracts
    missingEvidence: Disclosed biopharma co-development agreements, upfront licensing revenue, and pipeline milestone structures.
    whyItMatters: >-
      Without contractual commercial evidence, valuation must be modeled purely on capital commitments rather than
      commercial market traction.
    diligencePath: Review future partnership announcements, biotech conference disclosures, or confidential offering memoranda.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: pipeline-targets
    missingEvidence: Formal pipeline catalog detailing designated oncology, immunology, or rare disease target nominations.
    whyItMatters: >-
      Determines the precise epidemiology and indication-specific serviceable addressable market (SAM) accessible to
      Xaira.
    diligencePath: Track scientific presentations, patent applications, and clinical trial registry filings (ClinicalTrials.gov).
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-licensing
    missingEvidence: >-
      Public disclosure of collaboration contract structures, milestone fees, royalty tiers, or pricing models for
      pharmaceutical co-development partnerships.
    whyItMatters: >-
      Without public contract terms or pricing models, evaluating Xaira's commercial revenue potential and partnership
      bargaining power relative to tech-bio peers remains impossible.
    diligencePath: >-
      Review future partnership press releases, SEC partner filings (e.g., 8-K or 10-Q collaboration disclosures), or
      confidential partner term sheets.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: valuation-benchmarks
    missingEvidence: Audited post-money valuation, term sheet liquidation preferences, and secondary pricing benchmarks.
    whyItMatters: >-
      Without verified post-money valuation data, institutional investors cannot establish an accurate cost basis or
      underwrite risk-adjusted returns.
    diligencePath: Request confidential cap table and Series A stock purchase agreement disclosures under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Monthly cash burn rate, net cash reserves, and runway duration to the next clinical milestone.
    whyItMatters: >-
      High capital intensity in wet-lab automation and compute infrastructure creates severe financing dependency before
      IND filing.
    diligencePath: Obtain quarterly unaudited financial statements, budget versus actual variances, and cash flow projections.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: commercial-model
    missingEvidence: Contract terms, upfront licensing fees, and milestone payment schedules for biopharma partnerships.
    whyItMatters: >-
      Monetization quality and gross margin realization cannot be confirmed without executed commercial partnership
      agreements.
    diligencePath: Review pipeline partnership term sheets, co-development letters of intent, and target licensing frameworks.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: preclinical-pipeline-disclosure
    missingEvidence: >-
      Disclosure of specific lead drug candidate molecules, target biological receptors, indication areas, and targeted
      IND filing dates.
    whyItMatters: >-
      Without disclosure of specific lead assets and target validation data, underwriters cannot assess pipeline
      advancement, clinical probability of success, or commercial market opportunity.
    diligencePath: >-
      Request confidential pipeline status reports, target disease briefs, and preclinical pharmacokinetic data during
      private data-room diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: commercial-partnerships
    missingEvidence: >-
      Verification of active confidential research collaboration agreements, material transfer agreements, or
      exploratory pilot terms with pharmaceutical sponsors.
    whyItMatters: >-
      External partnership validation and upfront/milestone economics are critical to evaluating the long-term
      commercialization and non-dilutive financing capacity of the platform.
    diligencePath: >-
      Request confidential partnering pipeline disclosure, executed term sheets, or alliance management governance
      charters during management diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: gcp-audit-compliance
    missingEvidence: >-
      Internal audit results, Quality Assurance SOP certifications, and vendor qualification audit reports under ICH
      GCP.
    whyItMatters: >-
      Validating clinical operations readiness is essential before first-in-human trial initiation to prevent regulatory
      holds or inspection remediation delays.
    diligencePath: >-
      Request clinical operations quality manual, vendor audit summary reports, and mock inspection records under mutual
      NDA.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: post-money-valuation
    missingEvidence: >-
      Audited cap table, post-money valuation, per-share pricing, and liquidation preference waterfall from Series A
      financing.
    whyItMatters: >-
      Without exact valuation and share terms, investors cannot determine entry multiples, dilution risk, or downside
      preference overhang.
    diligencePath: >-
      Request confidential investor deck, fully diluted capitalization table, and Series A certificate of incorporation
      from company management.
    relatedQuestionRefs:
      - QV003
  - type: missing-source
    severity: material
    topic: clinical-pipeline-disclosure
    missingEvidence: Specific therapeutic program names, target biology, disease indications, and IND filing timelines.
    whyItMatters: Valuation underwriting requires tangible asset progression rather than purely theoretical platform potential.
    diligencePath: Obtain pipeline review under non-disclosure agreement to assess lead candidate progression and target validity.
    relatedQuestionRefs:
      - QV001
      - QV004
