  evidenceGaps:
    - type: "conflicting-data"
      severity: "material"
      topic: "founding-date"
      missingEvidence: "Primary incorporation or formation record resolving whether the operative founding date is in 2023 or 2024."
      whyItMatters: "A canonical founding date anchors the company's operating history and milestone chronology."
      diligencePath: "Request the certificate of incorporation and formation timeline from company counsel."
      relatedQuestionRefs:
        - "QO001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "financing-terms-gap"
      missingEvidence: "Fully diluted capitalization table, security purchase agreements, funded-versus-committed schedule, liquidation preferences, tranches, debt, and credit terms."
      whyItMatters: "The $1 billion headline cannot establish cash availability, investor ownership, dilution, preference overhang, or effective entry valuation."
      diligencePath: "Request the cap table, financing documents, bank statements, debt schedule, and board-approved sources-and-uses plan."
      relatedQuestionRefs:
        - "QO005"
      relatedTableRefs:
        - "TO001"
        - "TO003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "scale-metrics-gap"
      missingEvidence: "Audited revenue, contracted customer or collaboration schedule, company-wide headcount roster, burn, and cash balance."
      whyItMatters: "These metrics are necessary to distinguish organizational build-out from commercial traction and to calculate runway."
      diligencePath: "Request management accounts, customer and collaboration contracts, HR roster, cash statements, and monthly burn bridge."
      relatedQuestionRefs:
        - "QO006"
      relatedTableRefs:
