  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模式与收入来源
        blocks:
          - type: paragraph
            body: >-
              Xaira Therapeutics 是一家 AI
              原生生物科技企业，成立目的在于重构药物发现和开发全流程。公司的商业架构围绕两条互补的变现路径：通过内部管线开发推进全资治疗资产，以及与全球制药企业合作开发精选发现项目。不同于通过订阅产生经常性收入的软件即服务平台，Xaira
              未来的收入取决于技术接入费、研究合作付款、临床前和临床开发里程碑付款，以及获批疗法的长期商业特许权使用费。由于 Xaira 仍处于商业化前的临床前开发阶段，管线候选物预计要到 2026 年才进入 IND
              申报准备研究，公司当前产生的商业确认收入、ARR 或商业客户现金流均为零。近期组织变化（包括招聘业务开发和联盟管理高管）表明，公司正在积极准备与在合作经济条款中拥有较强议价权的制药伙伴接洽。
