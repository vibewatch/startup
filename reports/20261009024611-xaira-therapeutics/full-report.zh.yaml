        title: 里程碑、规模缺口与不利边界
        blocks:
          - type: paragraph
            body: >-
              可辩护的里程碑主要集中在 2024 年启动，以及 2026 年观察到的公开证据。当前 Greenhouse
              看板显示公司正在招聘生物学、AI、临床运营、蛋白质工程、软件、自动化、财务、采购和业务拓展岗位，但职位空缺不等于员工，也不能据此确定员工人数
              [CO010]。在留存的八个来源中，没有出现可审计的公司整体收入、客户数量或员工人数 [CO014]。Fortune 还提醒，AI 不能解决药物开发的全部问题，因为湿实验室测试、临床试验和 FDA 批准仍不可缺少
              [CO016]。              这让融资标题需要打折：来源证明了野心和组织建设，却没有证明临床疗效、监管成功、商业进展或没有不利事件。
