              Xaira
              的技术差异化很大程度上依赖于从一开始就产出可成药的大分子先导，而不是需要多轮实验室亲和力成熟的粗略结构骨架。若经实验验证，从头抗体设计可能显著压缩从靶点发现到候选物提名的临床前周期。但依靠计算生成模型直接实现可靠的体内可开发性和低免疫原性，仍是全行业尚未解决的挑战，需要持续的闭环湿实验室反馈。
