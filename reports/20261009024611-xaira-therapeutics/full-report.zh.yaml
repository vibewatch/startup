        title: 资本结构与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              独立报道一致把 Xaira 的公开启动锚定在 2024 年 4 月及 $1 billion 风投资金 [CO005]。Fortune 称公司由 Foresite Labs 和 ARCH Venture
              Partners 孵化，并援引 ARCH 的说法称这是其 30 年来最大的初始资金承诺 [CO006]。C&EN 另称该融资是生物科技史上最大的风投交易之一，这提供了规模背景，但不包含投资条款
              [CO007]。UpMarket 报道没有可信媒体公布估值；留存证据也未披露每股价格、投后估值、分期、清算优先权、债务或信贷额度 [CO013, CO015]。因此，募集资金不能视为可用现金，也不能作为估值代理。
