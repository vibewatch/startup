      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 临床转化缺口
            body: Xaira 的计算模型在细胞基准上展现出显著的架构扩展能力和预测精度，但由于尚未见公开披露的临床管线资产，平台尚未跨过人体疗效这一决定性的监管门槛。
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Xaira Therapeutics 的科学基础颇具吸引力：一端是源自 David Baker 实验室的生成式蛋白质设计，另一端是通过 X-Cell
              虚拟细胞平台开展的基因组尺度因果生物学建模。核心论点认为，把高通量因果扰动数据（X-Atlas/Pisces）与基于扩散的从头分子设计结合，可以消除传统试错瓶颈，打造能够交付同类首创生物制剂的一体化制药引擎。但可观察证据同样支持反论点：尽管已承诺超过
              $1 billion 资本，Xaira
              仍是完全处于临床前阶段的组织，没有披露临床阶段管线候选物、商业伙伴或经验证药物资产。资本可以买时间和计算基础设施，却绕不过人体转化医学固有的物理与生物风险，因此应保持克制的继续研究立场，而不是在未经验证的情况下作投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
      - number: '8.2'
        title: 建议框架与融资背景
        blocks:
          - type: paragraph
            body: >-
              评估 Xaira 要看价格和证据敏感度，不能被创始人或融资标题带动情绪。Xaira 于 2024 年 4 月结束隐身状态，由 ARCH Venture Partners 和 Foresite Capital
              支持，F-Prime、NEA、Sequoia 和 Lightspeed 等顶级风投联盟共同参与。二级市场平台 UpMarket 确认，Xaira 是一家私人、IPO
              前公司，没有任何可信媒体公开报道估值，也没有活跃的公开股票代码。由于投后估值、优先股堆叠、清算顺位和股价均未披露，没有投机性假设就不可能判断进入估值。因此，估值立场被归类为未知，整体风险仍高，机构尽调应转向经核实的私人条款清单、管线转化指标和治理结构。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
