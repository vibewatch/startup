      - number: '5.2'
        title: 核心技术模块与计算管线
        blocks:
          - type: paragraph
            body: >-
              Xaira 的核心技术栈分为两大机器学习支柱，并由可扩展的数据和工作流工程支撑。第一大支柱是用于分子设计的生成式基础模型，重点覆盖蛋白质和治疗性抗体的结构建模、序列生成和构象优化。2026 年 10
              月，管理层确认技术重点是开发能从起点直接输出可成药抗体的生成模型，绕过漫长的经验亲和力成熟周期。第二大支柱是生物基础模型，用多组学、生物物理和临床数据实现更准确的靶点识别和患者分层。这些计算能力由专门的平台团队强化，包括
              X-Scientist 项目，以及覆盖 South San Francisco 和 Seattle 的 ML Platform 团队；它们把模型落地为自动化发现工作流。
