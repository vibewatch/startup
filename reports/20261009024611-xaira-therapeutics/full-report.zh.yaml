      - number: '4.2'
        title: 成本结构与运营支出
        blocks:
          - type: paragraph
            body: >-
              Xaira Therapeutics 的运营支出反映出把计算人工智能与高通量实验生物学结合所需的极高资本密集度。主要成本来自专业科学和工程人员、湿实验室自动化及耗材试剂，以及高性能云计算基础设施。员工人数估计为
              51 至 200 名，分布在 South San Francisco、Seattle 和 London。公开薪酬资料显示，抗体表征 Senior Scientists 等关键技术人员的年基本工资区间为
              $136,000 至 $170,000，不包括绩效奖金、福利和股权授予。同时，运行 X-Cell
              等大规模细胞扰动模型并生成专有结构生物学数据集，需要持续的云计算投入。独立战略评估强调，这种成本结构带来较高的月度现金 burn，需要严格分配资源并快速完成生物验证，以免在里程碑转折前耗尽资本。
