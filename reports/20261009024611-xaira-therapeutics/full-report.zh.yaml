          detail: 围绕肿瘤学和神经退行性疾病靶点生成内部管线
          touchpoints:
            - 计算蛋白质设计和分子筛选
            - 在 South San Francisco 开展临床前实验室表征
        - label: 阶段 3：联盟构建
          detail: 招聘业务开发和联盟管理负责人
          touchpoints:
            - 建立企业发展与合作框架
            - 启动保密的药企共同开发谈判
        - label: 阶段 4：临床共同开发
          detail: 推动先导候选药物项目进入临床试验
          touchpoints:
            - 在肿瘤学 VP 领导下搭建临床运营团队
            - 通过预付款、bio-bucks 里程碑和特许权使用费实现变现
        - label: 阶段 5：商业化对外许可
          detail: 由药企合作伙伴负责全球分销和商业执行
          touchpoints:
            - 将商业化权利转交全球药企合作伙伴
            - 实现后续疗法销售特许权使用费
        - label: 阶段 6：平台再投资
          detail: 将合作收益再投入下一代基础模型
          touchpoints:
            - 扩大实验室自动化和湿实验筛选能力
            - 扩展计算集群，推进多模态患者转化
    approximationNotes: 代表基于可观察的组织招聘和行业标准生物科技合作框架，推断出的 Xaira 客户变现路径。
