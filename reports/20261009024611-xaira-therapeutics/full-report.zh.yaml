  summary: >-
    Xaira Therapeutics 是一家 AI 原生生物科技公司，将机器学习研究、大规模生物数据生成和治疗药物开发整合进同一套发现引擎。公司于 2024 年 4 月公开启动，获得 $1 billion
    风投资金并组建了高规格领导团队，但公开记录仍未披露估值、定价、客户商业进展或临床阶段产出。
