      - number: '7.3'
        title: 伙伴依赖、平台集中与财务 burn 风险
        blocks:
          - type: paragraph
            body: >-
              Xaira 于 2024 年 4 月启动，由 ARCH Venture Partners 和 Foresite Capital 联合牵头，F-Prime Capital、Lightspeed
              及其他顶级生命科学投资者共同参与，承诺资金 $1 billion。这笔承诺使 Xaira 成为历史上资金最充足的生物制药初创企业之一，可与 Altos Labs（$3.0B）、Resilience（$2.5B）和
              Grail（$2.0B）等巨额融资相比；但建设一体化制药发现引擎的资本密集度带来显著长期财务风险。运营高通量湿实验室、数千节点 GPU 计算集群和临床试验开发，每年会消耗数千万至数亿美元。二级市场平台
              UpMarket 指出，公开资料没有可信媒体正式确认投后估值，私人估值倍数尚未经过公开生物科技基准检验。此外，Xaira
              高度依赖第三方合同研究组织（CRO）、中心实验室和专业实验室，以及云计算供应商来执行早期研究和大规模训练，形成单点供应商和伙伴依赖；一旦受扰，可能影响开发时间表。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
