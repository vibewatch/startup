  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与临床转化风险
        blocks:
          - type: paragraph
            body: >-
              Xaira Therapeutics 处于 AI 原生药物发现和从头大分子设计这一高不确定性前沿。公司公布的计算基础模型（如 X-Cell 扩散语言模型）已扩展至 4.9 billion 参数，覆盖 25.6
              million 单细胞转录组，并在 cell-eval 指标和 zero-shot 扰动任务上展示领先预测基准；但计算预测尚未转化为人体患者中已证明的临床疗效。截至 2026 年 10
              月，公开生物制药和管线数据库（Synapse PatSnap）没有记录 Xaira 已发布的临床药物管线资产或正在进行的 Phase 1 试验。主要监管风险在于，公司能否将首批临床前项目推进到
              Investigational New Drug（IND）和 Clinical Trial Authorisation（CTA）申报，以证明人体安全性、药代动力学和治疗获益。此外，FDA 和 EMA
              等卫生机构针对 AI 设计分子和生物标志物定义患者分层的新规仍处于不断变化的验证标准下，可能遭遇检查阻力和 Good Clinical Practice（GCP）审计审查。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
