        title: 身份、运营模式与业务足迹
        blocks:
          - type: paragraph
            body: >-
              Xaira 将自己定位为一体化生物科技公司，而不是独立软件供应商：公司所述模式把机器学习研究、大规模生物数据生成和治疗产品开发放进同一个发现与开发组织 [CO004]。Foresite
              将总部定位在旧金山湾区；当前招聘信息显示岗位位于 South San Francisco 和 Seattle；Built In 转发的公司描述还提到 London [CO003, CO010,
              CO011]。公开资料对公司成立于 2023 年还是 2024 年意见不一，因此法定成立日期仍需企业一手文件确认，不能靠综合估算得出 [CO001, CO002]。
