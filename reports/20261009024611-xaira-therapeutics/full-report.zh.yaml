      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Xaira 以空前的资金支持启动，并于 2024 年 4 月完成由 ARCH Venture Partners 和 Foresite Labs 联合牵头的 $1 billion Series A
              融资。这笔历史性资本承诺相较早期生物科技同行提供了充足资金续航，使近期发现工作免受公开资本市场波动影响。公司资产负债表的债务义务极少或为零，保持由股权出资的资本结构，从而压低固定财务持有成本。但资本充足性必须结合生物转化和临床试验固有的长期周期评估。在商业收入现金流为零、多个地点持续大量消耗运营现金的情况下，Xaira
              对未来融资有明显依赖。长期资本可持续性取决于达成非稀释性制药授权合作，或取得可验证的临床前里程碑，以便在宏观或竞争压力削弱投资者耐心前完成后续股权融资。
            claimRefs:
