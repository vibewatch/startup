              Xaira Therapeutics 采用闭环三部分架构推进治疗开发，而不是单纯做 AI
              软件供应商或传统湿实验室生物制药公司。该模式把用于理解疾病生物学的机器学习研究、用于训练和优化专有算法的大规模内部实验室数据生成，以及把计算候选物转化为受监管生物资产的治疗产品开发紧密结合。早期计算生物科技公司主要聚焦虚拟筛选或模块化点工具，而
              Xaira 的平台论点是为历来难以攻克的疾病靶点从头设计大分子。通过在高通量基因组学、功能筛选和机器人自动化中结合计算预测与实验室验证，Xaira
              希望压缩先导生成周期，并在人类试验前系统性降低临床候选物选择风险。
