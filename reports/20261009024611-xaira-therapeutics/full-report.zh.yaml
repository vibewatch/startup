      - number: '7.2'
        title: 运营、质量与技术基础设施风险
        blocks:
          - type: paragraph
            body: >-
              作为把实验室湿筛选与高性能计算（HPC）结合的一体化生物科技组织，Xaira 在专业生物实验室和云基础设施两端都存在运营脆弱性。生成大规模扰动数据集（如 X-Atlas/Pisces 汇编中的 25.6
              million 个受扰动单细胞转录组）需要在 South San Francisco、Seattle 和 London 多地密集执行实验，涉及复杂的 FiCS 和 Flex Perturb-seq 流程及
              FACS 细胞分选。随着项目推进临床，在 ICH GCP 标准下维护试验主文件（TMF）、电子数据采集（EDC）、临床试验管理系统（CTMS）和实验室数据完整性，需要建立新的质量管理框架。在技术端，Xaira 的
              IT 基础设施由高管 IT 与安全领导层管理，横跨混合云环境；为保护专有模型权重、筛选数据集和靶点 IP，需要严格的漏洞管理、事件响应复盘，以及遵守数据保护和网络安全框架（SOC 2、ISO 27001、GDPR
              和 CCPA）。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
