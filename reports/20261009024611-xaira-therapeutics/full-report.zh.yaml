        title: 超算基础设施、技术依赖与临床转化风险
        blocks:
          - type: paragraph
            body: >-
              为支持大规模基础模型训练和高通量计算生物学，Xaira 依赖高性能云超算基础设施。公司选择 Oracle Cloud Infrastructure（OCI），部署由裸机 GPU 集群、超低延迟 RoCE
              网络和高性能计算存储驱动的 AI 超级计算机。专用计算能力可加速复杂结构数据集训练，但也带来基础设施集中风险和持续的高运营支出。除计算依赖外，Xaira 技术平台的主要风险在于转化有效性：从头设计的抗体和 AI
              选出的靶点能否在人类试验中展现可接受的药代动力学、低免疫原性和临床疗效。由于监管机构无论算法来源如何都要求同等的临床证明，Xaira 的最终产品成熟度仍受物理湿实验室验证和正式临床开发制约。
