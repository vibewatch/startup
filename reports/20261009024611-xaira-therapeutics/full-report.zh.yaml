              - CP012
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 战略模式：拥有药物管线 vs. 平台服务授权
            body: Xaira 的目标是拥有并推进自有治疗管线，而不是像合同研究和计算软件供应商那样按服务收费或运营发现平台；这使其区别于后者，在承担全部临床开发风险的同时争取最大的潜在经济上行空间。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
          - type: callout
            title: 临床前转化与模型商品化压力
            body: 尽管拥有 $1 billion 启动承诺和先进的多模态生物建模项目，Xaira 仍处于临床前阶段，没有人体疗效数据，因此暴露于成熟生物制药企业的临床优势，以及竞争科技生物企业快速算法商品化带来的压力。
            calloutType: risk
            claimRefs:
              - CP010
