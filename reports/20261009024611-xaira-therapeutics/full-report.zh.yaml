      - number: '1.2'
        title: 领导层、创始人与治理覆盖
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据不多，但影响重大。Fortune 称公司由 Genentech 前首席科学官领导，UpMarket 列 Marc Tessier-Lavigne 为首席执行官 [CO008]。C&EN 指出
              Hetu Kamisetty 是创始人及高级管理人员，并报道称他在公司公开启动前一直负责 Xaira 的 AI 和机器学习工作
              [CO009]。当前的信息技术副总裁招聘信息显示，新高级招聘者预计将负责战略、基础设施、安全、合规和董事会风险报告；这说明公司计划覆盖这些职能，并不证明岗位已经有人任职
              [CO012]。留存来源没有列出完整董事会、高管名单、继任计划或创始人持股。
            claimRefs:
