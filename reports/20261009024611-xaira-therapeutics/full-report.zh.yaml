      - number: '4.4'
        title: 财务结论与投资判断尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从私募市场投资判断角度看，Xaira Therapeutics 是雄心勃勃、资本充足的研究项目，而非已经完成商业去风险的运营企业。尽管第三方目录曾引用成立时名义 $4 billion
              估值，获授权的二级市场经纪商确认，没有可信媒体核实正式投后估值，因此二级交易仍取决于流动性差的私人谈判。缺少审计财务报表、未披露的月度 burn
              率和未公布的商业合作条款，都是关键的投资判断障碍。若没有关于现金储备、靶点发现单位经济性和管线项目权利的一手文件，机构投资者无法可靠建模风险调整后净现值或回报分配。尽调应优先取得股权结构表
              清算优先权、历史现金流量表和已签署的合作框架，以判断平台长期企业估值能否支撑其庞大的初始资本基础。
