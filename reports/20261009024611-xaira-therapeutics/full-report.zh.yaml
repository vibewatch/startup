              - CV006
              - CV007
      - number: '8.3'
        title: 情景分析、同行估值倍数与尽调请求
        blocks:
          - type: paragraph
            body: >-
              为框定潜在的风险调整后结果，我们构建乐观、基准和悲观情景，将平台商业化路径与 Altos Labs（募资 $3.0B）、Resilience（募资 $2.5B）、Tempus（募资 $1.35B）和
              Insitro（募资 $643M）等大额融资生物科技同行比较。在 bull 情景中，Xaira 验证 X-Cell 和
              RFdiffusion，将临床前可推进的结合剂转化为临床候选物提名，并取得非稀释性生物制药共同开发里程碑。在基准情景中，平台整合耗时超过预期，达到临床概念验证前需要消耗大量资本。在 bear
              情景中，虚拟细胞预测无法泛化到复杂人体病理的体内环境，临床转化停滞，沉重的组织管理费用迫使公司大幅 down-round 或结构化资本重组。眼下尽调必须要求完整股权结构表披露、净 burn 率和实证 IND
              准备安全性资料包。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议立场：定价未披露，继续研究
            body: >-
              Xaira Therapeutics
              把蛋白质工程和因果细胞建模进行了雄心勃勃的技术整合。但在临床资产零披露、体内转化未经证明且私人市场估值未披露的情况下，机构资本应避免在没有价格的条件下作投资判断。在经核实的条款经济性和 IND
              申报出现前，投资者应维持 research-more 立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
          - type: callout
            title: 资本密集与临床前转化风险
            body: >-
              $1 billion 虽然属于生物科技史上规模最大的首次融资之一，但运营大规模自动化湿实验室和训练数十亿参数的生物基础模型会带来极高现金 burn。没有商业收入或近期临床资产时，如果生物转化停滞，资本耗尽或结构化
              down-round 的风险仍然很高。
            calloutType: risk
            claimRefs:
              - CV005
              - CV009
              - CV011
