  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Model and Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Xaira Therapeutics operates as an AI-native biotechnology enterprise established to fundamentally
              re-engineer the drug discovery and development lifecycle. The company's commercial architecture is
              structured around two complementary monetization pathways: advancing wholly owned therapeutic assets
              through internal pipeline development and partnering select discovery programs with global pharmaceutical
              corporations. Unlike software-as-a-service platforms that generate recurring subscription revenue, Xaira's
              prospective revenue generation depends upon upfront technology access fees, research collaboration
              payments, milestone disbursements upon preclinical and clinical development achievements, and long-dated
              commercial royalties on approved therapies. Because Xaira remains in a pre-commercial preclinical
              development stage with pipeline candidates not anticipated to enter IND-enabling studies until 2026, the
              company currently generates zero recognized commercial revenue, ARR, or commercial customer cash inflows.
              Recent organizational developments, including recruitment for executive leadership in business development
              and alliance management, confirm active preparations to interface with pharmaceutical partners who hold
              substantial bargaining leverage in structuring collaboration economics.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI010
