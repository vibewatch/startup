              - CP004
              - CP007
              - CP014
      - number: '3.3'
        title: Capability Comparisons, GTM Moats, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Xaira's technical differentiation centers on unifying representation learning and generative modeling
              across multimodal biological data, including cellular imaging and high-dimensional omics measurements, to
              design proteins and antibodies against historically hard-to-drug molecular targets. However, the barrier
              to biological model development is shifting rapidly as foundation models commoditize and academic or
              open-source architectures propagate across industry. Furthermore, incumbent pharmaceutical developers
              possess massive proprietary clinical datasets and entrenched clinical development capabilities that
              computational startups lack. The primary risk confronting Xaira is the translation gap: computational
              predictions and virtual cell simulations must demonstrate superior clinical candidate survival and
              efficacy in human trials. Until Xaira delivers validated clinical candidates, its competitive advantage
              remains theoretical rather than commercially proven.
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
