              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Strategic Model: Drug Pipeline Ownership vs. Platform Service Licensing'
            body: >-
              Xaira distinguishes itself from contract research and computational software providers by aiming to own
              and advance its own therapeutic pipeline rather than operating as a fee-for-service or discovery platform,
              maximizing potential economic upside while absorbing complete clinical development risk.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
          - type: callout
            title: Preclinical Translation and Model Commoditization Pressures
            body: >-
              Despite $1 billion in launch commitments and advanced multimodal biological modeling initiatives, Xaira
              remains at a preclinical stage without human efficacy data, leaving it exposed to incumbent biopharma
              clinical dominance and rapid algorithm commoditization across competing tech-bio firms.
            calloutType: risk
            claimRefs:
