callouts:
  - calloutType: "insight"
    title: "The Zero-Customer Paradox in AI Biotech"
    body: "Evaluating Xaira through traditional SaaS enterprise metrics (such as customer count, logo churn, or Net Revenue Retention) mischaracterizes its economic model. Xaira is built as an integrated biotech developer rather than an enterprise software vendor. Consequently, the absence of commercial software customers is not an adoption failure but an intentional capital allocation strategy prioritizing proprietary therapeutic pipeline equity over contract services."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
  - calloutType: "risk"
    title: "Dependency on Unproven Pharmaceutical Alliance Monetization"
    body: "Without established pharmaceutical licensing agreements or commercial co-development contracts, Xaira bears the entirety of early preclinical and clinical development risk. While peers have validated their models through upfront partner cash infusions, Xaira relies solely on its $1 billion launch commitment, creating substantial downside exposure if internal assets fail to achieve partner-ready milestones before capital depletion."
    claimRefs:
      - "CU003"
      - "CU007"
      - "CU013"
