          description: 全球 VPP 平台、DER 聚合和电网服务收入；Wood Mackenzie / energy-solutions.co 估算聚合容量为 75 GW。
        - label: TAM（美国住宅储能）：$3.5B（2024）→ $15.2B（2034）
          value: $3.5B–$15.2B (10-year window)
          description: 美国住宅电池储能硬件、软件和服务；Emergen Research 的估算包含 VPP 电网服务部分。更窄的仅硬件口径为 $174M–$604M（P&S Intelligence，2025–2030 年窗口）。
        - label: SAM：美国电力零售放开市场的住宅储能 + VPP
          value: ~$1–5B (2026 estimate)
          description: ERCOT、CAISO、NYISO、PJM 覆盖的住宅业主，拥有电力零售选择权，也能接入 VPP 变现。这是 TAM 中电池订阅模式财务上跑得通的子集。
        - label: SOM：ERCOT Texas 住宅市场（Base Power 当前范围）
          value: $42M–$84M/yr (at 1% penetration)
          description: ERCOT 约 12M 住宅电表 × 1–2% 年渗透率目标（Base Power 披露）× $19–$29/月订阅费。电网服务收入另计；未经独立核验。
