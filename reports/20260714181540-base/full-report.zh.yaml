      - number: '7.4'
        title: 附录
        blocks:
          - type: callout
            title: ERCOT 收入压缩是近期商业模式威胁
            body: >-
              2023 至 2025 年，ERCOT 的 BESS 辅助服务收入下滑 90%，多数运营商盈利能力低于 2.2%。Base Power 低于市场价的客户定价依赖持续的电网交易收入。若 RTC+B
              与市场饱和继续压缩利润率，靠电池套利补贴客户电价的经济性会明显变弱。RTC+B 下未来 12–18 个月的运营数据，对验证模型至关重要。
