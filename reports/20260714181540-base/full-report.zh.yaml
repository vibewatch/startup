      - number: '5.3'
        title: 控制架构、软件栈与 VPP 调度
        blocks:
          - type: paragraph
            body: >
              Base Power 自建了名为 BaseOS 的专有端到端软件和控制系统。系统覆盖固件（管理电芯级 BMS、传感器、电力电子和 OTA
              更新）、后端服务（协调电池集群调度、能源交易、计费和运营物流），以及公用事业伙伴用于管理聚合资源的原生 SCADA 层。后端主要用 Golang 和 Python 编写，运行在 AWS
              上，采用容器化服务（Kubernetes）和 Terraform 管理基础设施，并用 Temporal 编排现实世界部署和设备控制流程。固件用 C、C++ 或 Rust 编写，运行在嵌入式 Linux
              或微控制器目标上。软件负责人 Jared Greene 曾在 SpaceX Starlink 软件团队任职；工程团队很大一部分来自 Anduril、SpaceX 和 Tesla。

              现场连接采用三重冗余：（1）客户 WiFi 作为主链路；（2）4G 虚拟蜂窝芯片作为备用；（3）若公用事业已铺设光纤，则使用电表处的光纤连接。这一架构让 Base 能把连接加硬件导致的强制停机率归类在 5%
              以下——这是公用事业级可靠性主张。ERCOT 调度命令可在亚秒级响应时间内执行；实际交付功率与指令功率偏差在 1% 以内。公用事业伙伴可通过网页版仪表盘控制电池聚合，也可通过 API 直接接入自身能源管理系统。

              在 ERCOT 放松管制市场中，Base 的交易算法实时监控批发价格，价格低时（高风电 / 太阳能时段经常为负）给电池充电，价格见顶时向电网放电。Base 已取得 Texas
              聚合分布式能源资源（ADER）试点项目资格，可将分布式电池集群作为单一虚拟电厂投标进入 ERCOT 批发市场。截至 2025 年 10 月，Base 已用满 ADER 试点可投标的 20 MW
              容量，并在推动提高上限。ERCOT 于 2026 年 4 月与 Base Power 举行工作会议，处理节点调度、结算处理、计量和配电服务商协调等设计问题——这说明该项目监管框架仍在成熟。
