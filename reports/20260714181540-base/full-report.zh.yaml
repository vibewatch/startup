chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Base Power Company 于 2023 年注册成立，总部位于德州 Austin 的 305 S. Congress Avenue。公司在德州放松管制的 ERCOT 市场以持牌 REP
              身份运营，并自称是美国首个同类垂直整合分布式能源平台。其商业网站为 basepowercompany.com。

              这套商业模式有时被称为「gentailer」结构，把硬件所有权、零售电力供应、软件运营和批发电网交易放在同一家公司里。 Base 以 $595–$995 的一次性安装费，在房主住宅安装 25 kWh（Gen
              1：11.4 kW 连续功率）或 50 kWh 电池系统； 公司保留电池所有权，收取 $19–$29 月费，并以约 8.0–8.5 ¢/kWh（另加输配电转嫁费用）的固定价格成为房主的电力供应商。
              公司为停电保留备用电量，同时调度电池捕捉 ERCOT 批发价差——夜间低价买电，早晚高峰向住宅和电网放电。客户签三年电力合同。 Base 约一半客户装有屋顶太阳能；对任何回售电力，Base 按实时批发价再加 3
              ¢/kWh 补偿。

              公司先打德州，因为约 85% 德州居民住在放松管制的电力区域，零售商可直接签客户。德州批发电价在北美波动性最高之一， 留出很宽的套利窗口。在受监管市场（其他州），Base
              计划通过公用事业合作扩张，而不是建立直接面向消费者的 REP 关系。 截至 2026 年 5 月，公司称其已为德州和 Illinois 超过 20,000 户家庭供电；直接零售可用范围仍集中在德州，
              早期非德州扩张已延伸到 Chicagoland 地区。
