  - id: FR001
    title: 风险热力图——Base Power 风险宇宙（按可能性与影响）
    type: matrix
    layout: standard
    summary: 按可能性（低 / 中 / 高）和业务影响（中等 / 高 / 关键）映射 10 项已识别风险，并显示现有缓释后的剩余严重度。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - 电池起火 / 热失控；电池集群管理遭网络攻击
            - ADER 试点容量冻结或取消
            - ERCOT 收入压缩 / 饱和
        - label: 高影响
          values:
            - 并网成本超支；关键高管离职
            - 电池衰减 / 质保成本；软件误调度；Factory One 爬坡失败
            - 客户利益冲突（SOC 消耗与备用电源需求）
        - label: 中等影响
          values:
            - ''
            - 安装人员短缺拖慢部署
            - ''
    approximationNotes: 可能性和影响评估为分析师基于公开证据的判断；未获得专有运营或财务数据。
