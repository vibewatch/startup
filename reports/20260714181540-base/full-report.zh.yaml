      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              多家分析机构对美国住宅储能市场给出的区间差异很大，取决于它们统计硬件收入、生命周期服务收入，还是更广义的能源服务。 P&S Intelligence 估计美国住宅储能市场 2025 年为 $174M，到 2030
              年增长至 $604M（CAGR 约 28%），口径较窄，覆盖硬件和服务。 Emergen Research 采用更宽口径——包括电网服务合同和软件——估计美国住宅板块 2024 年为 $3.5B，并预计到
              2034 年达到 $15.2B， CAGR 为 15.9%。各估算差异主要来自是否计入 VPP 电网服务收入和订阅变现路径。据 SEIA/Benchmark Mineral Intelligence Energy
              Storage Market Outlook Q1 2026，截至 2026 年初，美国累计住宅电池储能装机约 9 GWh，仅 2025 年就部署 3.1 GWh， 同比增长 51%。

              具体到 ERCOT，德州正有望在 2026 年超过 California，成为美国最大电池储能市场；进入 2026 年时，电网级 BESS 容量达到 14 GW， 为 2025
              年的两倍。住宅和分布式储能是更小但增长很快的子集。Base Power 已取得资格的 ERCOT ADER 试点，在 2025 年中将系统总上限从 80 MW 扩大到能量 160 MW、non-spin 和
              ECRS 各 80 MW。在德州家庭层面，电池价格已降至约 $117/kWh——约为 2023 年成本的三分之一—— 扩大了潜在可服务基数。

              对 Base Power 德州 SOM 的自下而上估算：ERCOT 服务约 12M 住宅电表。按 1–2% 年渗透率（Base Power 公开目标），对应 120,000–240,000 户家庭。 按平均系统
              20 kW（两块 11.4 kW/25 kWh 电池）和 $29/month 订阅计，在不含电网服务收入前，每年新增渗透可带来约 $42M–$84M 年化订阅收入。ERCOT 1% 渗透率对应的 ADER
              容量约为 2.4 GW 聚合住宅电池群，远超当前试点上限；这说明市场获取的约束在监管扩容空间， 而非需求或硬件成本。

              全球 VPP 市场——Base Power 的参照同业群——2026 年估值约 $6–7B；据 GMInsights，单美国市场预计到 2035 年达到 $11.5B， 住宅板块 CAGR 为
              22.5%。相互矛盾的估算保留：各分析报告对 2026 年全球市场的估计从 $4.1B 到 $6.7B 分散很大，反映的是方法论差异确实存在， 核心在于「市场规模」是否统计 VPP 平台收入、DER
              硬件，或电网服务交易量。
