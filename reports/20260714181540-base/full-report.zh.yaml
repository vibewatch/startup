          - type: callout
            title: 电池调度中的客户利益冲突带来诉讼与监管敞口
            body: >-
              Base Power 可以合法地为电网交易把客户电池放电至 20% SOC。社区论坛记录了客户在停电时无法获得完整备电后的惊讶与不满。若一场严重天气事件（可比 Winter Storm Uri）让 Base
              Power 客户失去预期备用电力，而电池此前又被调度去赚电网收入，声誉损害可能很严重，PUCT 投诉或集体诉讼也可能随之而来。这是最清晰的不利客户影响场景，应成为尽调重点。
