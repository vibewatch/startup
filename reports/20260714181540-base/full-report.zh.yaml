      - number: '5.5'
        title: 技术差异化与产品风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的差异化建立在四个叠加因素上；单独复制已不容易，同时复制几乎不可能：（1）垂直整合的硬件设计，让 Base 不依赖第三方电池产品品牌，也能控制成本和路线图；（2）专有 BaseOS
              软件栈，从固件延伸到云端和 SCADA，支持住宅规模下的公用事业级调度；（3）专门打造的部署运营引擎（许可、物流、安装），可扩展到每周数百套系统；（4）新型发售一体化业务模式，Base 同时作为发电方（ADER
              聚合商）和零售电力供应商，从电网服务、能源套利和客户订阅中同步捕获收入。

              80/20 的公用事业调度 / 房主备用分配，是产品最核心的张力。合同允许 Base Power 将电池放电至 20%
              荷电状态，以履行电网交易义务。若高峰价格调度刚结束就发生电网停电，房主可用备用容量可能远低于满电。这是商业模式的结构性特征，不是 bug；CleanTechnica 和独立电气承包商 Epic
              Electrical 都公开提示过这一被客户低估的风险。对于希望在连续多日停电期间获得全屋确定性备用的房主，20% 下限叠加最坏情形下重度 HVAC 负载，会让单电池备用时间降至不到一小时。

              电芯目前从 China 进口，形成关税风险。Austin 工厂将于 2026 年 Q1 开始制造模块、电池包和电力电子，但在 Base 找到本土或非 China 电芯供应商之前，电芯仍是 China
              来源投入。ERCOT ADER 试点 80 MW 上限（拟扩至 160 MW）仍是 Base 在 ERCOT 电网服务收入的监管天花板；截至 2026 年 5
              月，包括节点调度规则和结算框架在内的上限解决方案仍处于 ERCOT 内部审查。Texas
              以外地理扩张需要两条路之一：放松管制市场（承载完整发售一体化模式）或公用事业伙伴关系（承载受监管公用事业的电池即服务模式）；Base FAQ 提到 Illinois 的 ComEd 计费，说明早期扩张已经启动。
            claimRefs:
              - CE031
