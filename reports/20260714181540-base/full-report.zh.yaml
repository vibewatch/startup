      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Base Power 当前客户集中度极高：收入基本 100% 来自 ERCOT 内 Texas
              房主。其中，放松管制的发售一体化模式（叠加租赁、零售和套利收入）仅在五个放松管制公用事业区域可用（Oncor、CenterPoint、TNMP、AEP Central、AEP
              North）。公用事业伙伴渠道触达不同客户池——无法使用零售 REP 产品的合作社成员——但这些容量托管或仅批发交易对 Base 的经济性明显薄于完整发售一体化栈。


              2026 年 4 月推出的无电池 “Base Energy” 计划，把可触达客户池扩大到租户和公寓住户——这是公司从独栋房主原型向外分层扩张的第一个信号。Texas 以外地理扩张已包括 Illinois
              初始上线，但关键问题是 Base 能否在 ERCOT 之外复制其放松管制客户获取和电池经济性打法。El Paso Electric 受监管区域试点，是公用事业容量托管经济性的一个现场测试；2026 年 6 月
              Chicagoland 上线，是第二个零售地理市场的首次现场测试；结果尚未披露。


              合作社层面的头部客户风险为中等：CoServ（330,000 块电表）代表一项 100 MW 单一协议，若丢失或表现不佳，可能明显损害 2026 年部署目标。同样，Austin Energy 每年 $4.08M
              的 40 MW 容量托管协议，是依赖年度预算批准的集中机构收入承诺。进入 Texas 新区域的扩张部分依赖 ERCOT Strategic Transmission Expansion
              Plan（STEP），而该计划需要多年执行。
