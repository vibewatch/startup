      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >-
              Base Power 所在市场有三类不同的买方—用户—付款方关系，各自的采用触发点和预算归属不同。

              第一类、也是核心细分，是处于放松管制 ERCOT 市场的德州住宅房主。这类客户既是用户（获得停电保护和账单平滑），也是付款方（在 PowerToChoose.org
              上从竞争性零售电力供应商中选择）。关键采用触发点是停电焦虑——Winter Storm Uri（2021）和反复出现的夏季高峰加剧了这种焦虑——叠加电费波动。 2026 年初，德州住宅平均电费达到
              $174/month，电价 15.41 cents/kWh，同比上涨 6.4%。面向这一细分，Base Power 的 $19–$29/month
              订阅加一次性安装费（$695–$995），定位为同时对冲停电和夏季高电费的保险产品。

              第二类是与 Base Power 合作部署公用事业控制住宅 BESS 的电力公用事业公司或合作社。这里付款方是公用事业公司（获得容量递延价值），
              用户是房主（获得备用电力），买方决策者是负责资源规划的公用事业高管。负荷增长、基础设施约束和 ERCOT 夏季可靠性要求触发采用。 CoServ（北德州 330,000+ 电表）和 El Paso
              Electric（465,000 客户）代表这一细分；El Paso Electric 10 MW 试点和 CoServ 100 MW
              项目是目前最大的两个运行案例。该细分的预算归属在公用事业公司的资本规划团队，经济逻辑是用容量递延对比新建发电或输电投资。

              第三类尚处早期，由 Lennar 等住宅开发商构成；它们希望把具备电网韧性的住宅作为新房差异化卖点。这里开发商是分销渠道伙伴， 房主是最终用户和长期付款方，采用触发点是住宅销售市场中的竞争差异化。该渠道降低
              Base Power 的获客成本，并扩大其地理触达。
