      - number: '5.4'
        title: 信任、安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 电池系统已完成完整 UL 认证栈：UL 1973（固定应用电池模块安全）、UL 1741（分布式能源资源逆变器和互联设备安全）、UL
              9540（集成组件层面的系统级储能安全）和 UL 9540A（热失控火灾传播测试证据）。这四项标准组合满足北美市场 AHJ 接受、公用事业并网和房主保险的主要要求。地方安装许可遵循 NEC（National
              Electrical Code）规则，由各个 AHJ 执行；Base 的 Deployment Factory 软件将跨辖区许可流程做了简化。

              Base Power 的运营可靠性指标均由公司自报，尚未经过独立审计：强制停机率 <5%（含连接和硬件）、停电切换亚秒级、MW 交付与指令功率偏差在 1% 以内。公司称其系统可防护 97%
              的常见电网停电；这个数字来自一项观察：即使在电池最低可降至 20% 荷电状态时，仍有 3 小时备用，可覆盖 97% 的停电时长。该数字假设家庭负载适中；Texas 夏季重度使用 HVAC 时，一块 25 kWh
              电池可能在 3–4 小时内耗尽。

              Base 电池集群的网络安全攻击面不可忽视：数千套联网电池系统，每套都可通过 API 控制，可能成为聚合型电网扰动向量。NFPA 855 和 NEC 安装标准适用于安装层面。UL 2900 系列和 IEC
              62443 标准与连接栈相关，但 Base 公开披露中未具体提及。截至 2026 年 5 月，公开记录中未发现监管或执法行动、召回通知或安全事故。
