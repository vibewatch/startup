      - number: '6.3'
        title: 渠道伙伴与安装商生态
        blocks:
          - type: paragraph
            body: >
              Base Power 将市场进入设计成两类渠道：公用事业 / 合作社伙伴关系（B2B2C）和住宅开发商集成（B2B2C 新建住宅）。到 2026 年 3 月，公司已在 Texas 宣布五项公用事业合作，并在
              2026 年 5 月新增第六项 Austin Energy。


              公用事业伙伴模式各不相同：CoServ 和 GVEC 保留电池调度控制权，Base 负责安装和维护；El Paso Electric 是受监管公用事业试点，房主零前置成本获得电池，另有 $250
              付款；Austin Energy 采用容量托管模式，每年最高向 Base 支付 $4.08M，以锁定 40 MW 预留容量。Bandera Electric 和 Farmers Electric
              等合作社伙伴的成员支付象征性前置费用（GVEC 为 $295）和低月费。CoServ 的 100 MW 协议（2026 年 3 月）是迄今最大协议，目标是在 CoServ 北 Texas 330,000
              块电表覆盖区内新增约 5,000 户。


              安装侧，Charge Pro 等第三方承包商执行实体电池支架和摆放，Base 持牌电工负责配电盘连接——这种劳动力解耦策略旨在压低单台安装成本。客户评价中具名安装商包括 Ben 及其 Charge Pro
