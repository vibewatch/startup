      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Base Power 由 Zach Dell（CEO）和 Justin Lopas（COO）于 2023 年 8 月共同创立。Dell 当时 29 岁，是 Dell Technologies 创始人
              Michael Dell 之子。他在 University of Southern California 学习社会科学、心理学和经济学（2019 届）， 之后先后在 Blackstone 和 Thrive
              Capital 做投资，并形成了对分布式能源的投资判断。Lopas 曾任 Anduril Industries 制造负责人，也曾是 SpaceX
              项目的首席制造工程师。多位投资人把两人的互补能力视为关键降险因素：Dell 强在金融和战略， Lopas 强在硬件运营。

              扩展领导层高度集中在高精度制造和软件密集型消费硬件背景。Dino Sasaridis（硬件负责人）曾领导 Tesla 的 Powerwall 工程团队。Jared Greene（软件负责人）开发过 SpaceX
              Starlink 的激光网状通信系统。Cole Jones（增长负责人） 曾负责 Starlink 的商业化推进。Dana Paz（部署负责人）曾领导 Anduril 制造工程团队。Travis
              Kavulla（政策负责人） 曾任 R Street Institute 能源与环境政策总监，也曾任 Montana 公用事业委员。Zina Bash（首席法务官）曾是 Keller Postman 高级合伙人。

              高管经验集中来自 SpaceX、Tesla、Anduril、Blackstone 和 Thrive，也形成了清晰的关键人物依赖：Dell 或 Lopas
              若离开，既会冲击投资人关系，也会削弱支撑快速制造爬坡的运营执行力。
