          - type: callout
            title: 对 ADER 试点的依赖，是集中度最高的单一监管风险
            body: >-
              Base Power 参与批发市场，取决于 ERCOT ADER 试点项目。该项目由 PUCT 授权，但没有永久法定地位。PUCT 或 ERCOT 可以修改参与规则、冻结容量，或终止试点。50% 的 QSE
              集中度上限意味着，随着 Base Power 资产增长，它会在 100 MW ADER 容量处触顶（200 MW 总量的 50%）。若 ADER
              解散或容量永久冻结，公司主要的差异化收入机制就会消失；在本风险图谱中，这是最大的一票否决风险。
