      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: ERCOT 辅助服务收入崩塌重塑 VPP 经济性
            body: >-
              ERCOT 电网级电池收入从 $149/kW（2023）降至 2025 年预计约 $17/kW（Enverus），跌幅约 90%。同期，辅助服务占 BESS 收入的比例从 84% 降至 48%。住宅 VPP
              受益于客户账单平滑价值，这部分独立于批发电价；但在当前 ERCOT 环境下，Base Power 的电网服务收入上行空间被实质压缩。稀缺事件高度不稳定；2026 年夏季高峰将成为收入模型的关键测试。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
          - type: callout
            title: 相互矛盾的市场规模估算显示高度不确定
            body: >-
              各分析报告对美国住宅储能 TAM 的估计相差两个数量级——从 $174M（P&S Intelligence，2025，仅硬件）到 $3.5B（Emergen Research，2024，
              更宽口径）——取决于是否计入 VPP 电网服务收入、订阅变现和公用事业容量合同。投资人不应只引用一个「大市场」估算； 对 Base Power 当前模式更相关的可服务市场，更接近 ERCOT SOM（1%
              渗透率下 $42M–$84M/yr），而不是 $3.5B 的美国头部数字。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM031
          - type: callout
            title: IRA 30% ITC 提供持续到 2032 年的顺风
            body: >-
              Inflation Reduction Act 的 30% 住宅电池 Investment Tax Credit 适用于 2023 年至至少 2032 年安装的独立电池系统（≥3 kWh），
              不论是否搭配太阳能。这显著降低住宅电池部署的有效硬件成本，并支撑 Base Power 所安装系统的经济性。本土制造（Base Power 规划的 Austin 工厂）也可能符合额外 IRA
              制造抵免条件，进而进一步改善利润率。
            calloutType: strength
            claimRefs:
              - CM023
              - CM024
          - type: callout
            title: ERCOT 2026 年夏季稀缺事件是实质收入变量
            body: >-
              Base Power 的订阅模式部分依赖 ERCOT 批发市场的电网服务收入，用以补贴较低客户价格。历史上，极端夏季高温事件（2023：$5,000/MWh 峰值价格）在短短数日内创造了超额 BESS 收入。如果
              2026 年夏季温和，电网服务收入会很少，进而测试该模式独立订阅经济性。 这是一个开放尽调问题，需要 2026 年夏季事后复盘。
            calloutType: assumption
            claimRefs:
              - CM026
              - CM027
              - CM029
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              Base Power 在住宅储能市场的位置很特殊：它同时是资产所有者、零售电力供应商（REP）、软件平台和公用事业服务公司。
              这种垂直整合意味着，其竞争格局横跨四个不同集群。

              **直接 VPP 聚合商和电池即服务供应商**是最近的替代品，因为它们追求同一类住宅：部署电池来捕捉电网套利收入，
              同时以较低自付成本为房主提供备用价值。Sonnen（Shell 子公司）及其德州零售伙伴 SOLRITE Energy 于 2026 年 2 月在 ERCOT
              推出纯电池 VPP，提供 60 kWh 储能，月费 $20，「全包」零售电价 12¢/kWh——直接重叠 Base 的 $19–$29/month 会员模式。
              Sunrun（NASDAQ: RUN）是美国最大的住宅太阳能加储能公司，正通过与 NRG/Reliant 的多年合作在德州建设 1 GW VPP，
              并与 Vistra/TXU Energy 另有电池聚合项目。截至 2026 年，Sunrun 已在全美部署超过 116,000 套储能系统；CalReady VPP
              向 California 电网提供 51 MW 峰值出力——验证了住宅聚合模式，也让 Sunrun 成为争夺德州公用事业合作社带宽和房主入网的直接竞争对手。

              **争夺同一安装位置的硬件 OEM**包括 Tesla（Powerwall 3）、Enphase（IQ Battery 5P）、Generac（PWRcell）、
              LG Energy Solution（RESU Prime）和 FranklinWH（aPower 2）。这些公司通过第三方安装商销售，而不是直接持有和运营资产。
              Tesla 还通过 Tesla Electric 以 REP 身份运营，并通过 Autobidder 运营自己的 VPP，因此在 ERCOT 是 OEM+聚合商混合竞争者。
              Tesla Powerwall 3 每台 13.5 kWh，而 Base 每台 25 kWh；Tesla 在德州的安装成本为每台 $10,000–$13,500，
              对比 Base 的 $695 安装费，Base 拥有有意义的消费者经济性优势。

              **需求响应和智能恒温器替代品**不部署电池，却争夺电网服务价值栈。Renew Home（由 Google 的 Nest Renew 与 OhmConnect 合并而来）
              是北美按入网家庭数计最大的住宅 VPP，依赖智能恒温器、智能插头、热水器和 EV。截至 2026 年 5 月，OhmConnect 已将德州客户迁移至 Direct Energy，
              并以 Renew Home 品牌运营。这些平台争夺同一 ERCOT ADER 试点容量上限（总计 200 MW）和房主注意力，但无法在停电时提供全屋备用——这是 Base 的核心差异点。

              **现状替代品和既有电网**仍是主导替代方案。多数德州房主没有任何备用电源，接受停电风险。丙烷或天然气备用发电机（来自 Generac 和 Kohler）
              是传统韧性选项，安装成本超过 $15,000；Base 用 $695 入门价撬开这一价格差。NRG/Reliant 和 TXU/Vistra 等既有企业通过 130+
              REP 服务 31M 德州居民；理论上它们可以在内部打包电池项目，但目前更愿意与聚合商（Sunrun、Renew Home、Base）合作，而不是直接持有分布式硬件。
