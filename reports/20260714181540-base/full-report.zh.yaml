      - number: '6.4'
        title: 留存、耐久性与合同条款
        blocks:
          - type: paragraph
            body: >
              流失率据报接近零：Sacra 记录，截至 2025 年 8 月只有一名客户流失；对任何处在这一增长阶段的订阅服务来说，这都是异常低的数字。结构性驱动来自双合同锁定：10 年电池服务协议和 3
              年电力供应商协议（36 个月）。能源合同保证注册和续约时价格低于市场——Base 服务条款写明，续约时公司将在 powertochoose.org 上匹配或优于市场平均价格，否则允许客户免费退出电池协议。


              搬家的房主可将电池协议转给下一任房主，降低房屋出售造成的流失。拆除需要支付 $500 人工移除费。Base
              始终持有硬件，并承担维护和保修。备用电明确不得用于生命关键医疗设备，也不保证覆盖长时间事件。公用事业合作社项目条款不同：GVEC 成员支付固定 $295 购买费（无持续电池订阅），El Paso Electric
              参与者无需付款——没有直接电力协议，也可获得电池接入和备用。


              截至 2026 年 5 月，除近零流失轶事外，未公开披露 NRR、GRR 或分群留存百分比。独立评价聚合平台（TrustBurn）显示，自选择回复者情绪一致正面，没有记录到退款或法律纠纷模式。本轮未检索 PUCT
              正式投诉数据库；Base Power 提供自己的 PUCT 升级联系页面，说明公司意识到消费者保护义务。
