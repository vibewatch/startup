      - number: '4.2'
        title: 硬件成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Base Power 的单位经济性由每块已安装电池的一次性高资本开支决定，后续靠 36 个月或更长服务期内的混合收入回收。Sacra 估算，在 $3,000 联邦投资税收抵免前，Base Power
              每块电池的全包安装成本约为 $10,000；扣除抵免后，公司侧净成本约 $7,000。面向消费者的安装费（$695–$995）覆盖公司净硬件成本不到 15%，意味着 Base Power 每次安装都前置补贴约
              $6,000–$6,300。这种补贴融资模式类似 SolarCity 开创的太阳能租赁打法：规模和长期合约是经济可持续的前提。


              NREL 2024 Annual Technology Baseline（ATB）将 2023 年款、采用 LFP 化学体系的住宅储能电池包成本基准定在 $283/kWh
              DC；计入逆变器、系统平衡、人工、许可和销售成本后，全安装口径升至约 $1,300/kWh。对 25 kWh 系统而言，这意味着市场化安装成本约 $32,500，远高于 Base Power
              面向消费者的价格。Base Power 的垂直整合策略——内部设计、制造（Austin Factory One 的 Gen 3）和安装——意在把硬件成本压到市场基准之下；但 Gen 3 到 2026
              年中仍在爬坡，制造执行风险随之上升。


              Sacra 估算回本周期约 3.5 年，主要由零售电力价差和批发套利驱动，而不是单靠租赁费。这个 3.5 年假设建立在 ERCOT 批发电价波动稳定、客户留存持续、ADER
              市场监管准入延续，以及电池衰减不出现重大短板之上。报告流失率接近零（截至 2025 年 8 月仅流失 1 名客户）是正向前置信号，但毛利率、EBITDA
              和单台贡献利润仍未披露，外部无法独立验证回本模型。系统为房主备用保留 20% 电池容量（每 25 kWh 单元约 5 kWh），其余 80%
              可用于日常电网交易——这一结构性承诺限制备用深度，但最大化可变现调度容量。
