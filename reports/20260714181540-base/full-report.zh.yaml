      - number: '1.5'
        title: 不利因素与关键风险
        blocks:
          - type: paragraph
            body: >
              独立评论和分析师观点指出了几项实质风险。最突出的是，Base Power 的客户合同赋予公司法律权利：在高需求时段为向电网售电， 可把电池放电至低至 20%
              荷电状态。实际结果是，依赖电池防停电的房主，可能在电网故障那一刻只剩部分电量——而这恰恰是最可能停电的高需求场景。 DFW 承包商 Epic Electrical 详细审阅 Base
              条款后，将其称为「大多数人漏看的那件事」，并建议真正追求全屋保护的房主， 将 Base 电池与补充发电机和互锁套件（$300–$700）搭配。

              单位经济性的可持续性是第二个担忧。Green Car Future 的独立分析按 25 kWh 系统建模，估计单台年收入约 $2,075， 按当前定价意味着简单回本期为八到九年；只有电池循环假设成立、ERCOT
              市场波动持续、资本成本不上升时，这个回本期才可接受。 分析师指出，100 多名员工按约 $150,000 全包成本计，意味着每年 $15 M+ 劳动力开销，而这些未计入单台模型。收入预测高度依赖 ERCOT
              波动较大的辅助服务和能源套利收入；随着更多分布式储能入场，这些收入可能压缩。

              关税和供应链暴露是第三个风险：CNBC 于 2025 年 4 月报道，Base Power 的电池在中国制造，公司预期美国关税会带来实质影响。 本土工厂明确是为解决这一点，但制造爬坡时间线尚未得到独立来源验证。

              最后，Base 运行在 ERCOT ADER 试点之下，该试点受 PUCT 监管审查；项目的市场上限（160 MW 能量、80 MW non-spin/ECRS）和资格规则，
              可能被委员会命令收紧、修改或终止。本轮研究未发现针对 Base Power 的诉讼、制裁或消费者保护执法行动。
            claimRefs:
