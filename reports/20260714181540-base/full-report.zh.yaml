        - 审查取消率和合同期限；多年锁定为生命周期价值托底
      - - ERCOT ADER 遥测和互操作要求（2 秒遥测强制要求）
        - 采用约束
        - 当前
        - 技术门槛抬高运营复杂度；规模化时可能成为瓶颈
        - 确认 Base Power 的 ADER 资质状态，以及是否有遥测合规缺口
      - - 来自 Tesla Powerwall / Tesla Electric VPP、Sunrun、Bandera ADER 的竞争
        - 采用约束
