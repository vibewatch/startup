              value: 4.5
        - name: 当前远期 57x（隐含 $4B 入场）
          points:
            - label: $40M 收入
              value: 2.3
            - label: $70M 收入
              value: 4
            - label: $100M 收入
              value: 5.7
            - label: $150M 收入
              value: 8.6
    approximationNotes: >-
      收入情景为分析师估计，基于 Sacra 披露的 2025 年实际收入（$12M）和公司预测的 2026 年收入（$70M）。倍数参考
      Sunrun（5.6x）、Fluence（1.5–2.5x）和高溢价私营增长可比公司（20–30x）校准。$4B 入场参考线对应 $70M 的 57x。
    claimRefs:
