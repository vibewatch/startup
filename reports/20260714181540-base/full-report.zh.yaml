      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Base Power 站在户用太阳能 + 储能、VPP/DER 软件和能源零售商的交叉点上，因此很难挑出干净可比公司。最相关的上市可比是 Sunrun（RUN）、Fluence Energy（FLNC）和
              Stem（STEM）。Sunrun 是美国最大的户用太阳能加储能公司，市值约 $3.5B，企业价值 $17.7B，收入 $2.96B（LTM），对应 EV/revenue 约 5.6×。Fluence
              Energy 是公用事业级电池软件与服务平台，FY2025 收入 $2.3B，并指引 FY2026 收入 $3.4B；其交易倍数约为未来收入 1.5–2.5×。Stem（STEM）是最具警示意义的可比：2025
              年收入 $156M、股东权益为负，按 Macroaxis 截至 2026 年中估计破产概率 >80%。Stem 的轨迹说明，若资本密集度高却没有黏性经常性收入模型，后果会很严峻；Base Power
              的零售电力订阅部分缓解了这一风险，但没有消除。

              私有市场可比中，Uplight（整合 AutoGrid 的 DER 软件平台）2021 年最后估值约 $1.5B；随后在一次据报道寻求约 $1B 估值的出售流程后，多数股权归 Octopus Energy
              所有。这意味着 2021–2026 年间，纯 DER 软件估值被压缩。Renew Home（OhmConnect + Google Nest 合并）控制约 3 GW 户用 VPP 容量，由 Sidewalk
              Infrastructure Partners 支持，但未披露合并后估值。私有市场可比给出的隐含结论是：没有嵌入式硬件资产时，VPP 软件公司交易估值显著低于 $1B。Base Power
              以硬件为主导的模型有理由相对软件同行享受溢价，但也必须承受资本密集型业务固有的倍数压缩风险。

              Base Power 2025 年隐含收入倍数（333×）在任何阶段的能源可比公司中都没有先例；即便早期纯软件 SaaS 公司，也很少能在短暂炒作窗口之外维持 50–100× 以上倍数。2026
              年未来收入倍数（57×）对超高速增长平台更能解释，但仍意味着 Base Power 退出时要以其上市可比组中位数的 5–10×
              交易。更合适的理解是平台期权溢价：投资人不是在买当前收入，而是在定价美国放开管制市场中一个赢家通吃大半的户用电池网络。只有当网络效应（客户数据、优化算法、规模化低成本制造）被证明能真正抵御 Tesla
              Energy、Sunrun Battery 以及潜在公用事业支持项目等资本雄厚的进入者时，这一溢价才站得住。
            claimRefs:
