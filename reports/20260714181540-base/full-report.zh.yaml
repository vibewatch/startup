      - number: '1.4'
        title: 里程碑、牵引力与规模
        blocks:
          - type: paragraph
            body: >
              Base Power 以很快速度做出可观规模。公司 2023 年 8 月创立，当年即进入首批部署；2024 年初拿下 Hill Country 公用事业合作伙伴 Bandera Electric
              Cooperative，作为首个公用事业交易；2024 年 12 月宣布与住宅开发商 Lennar 的标志性合作，在 Firefly Pointe（Hutto）、Rancho del
              Cielo（Jarrell）和 Rancho Canyon（Haslet）社区试点。 到 2025 年 4 月，公司完成 $200 M Series B，并以「每天最多 20 块电池」的速度部署。公司于 2025
              年 8 月完成进入 Dallas-Fort Worth 核心区域，在 Grapevine 开设仓库和办公室，覆盖 Fort Worth、Arlington、Plano 和 Irving。

              2025 年夏，Base 取得 ERCOT Aggregated Distributed Energy Resource（ADER）试点资格；该试点正式允许分布式电池汇聚成一个可调度资源，
              投标进入批发市场。公司预计到 2025 年秋将成为 ADER 项目最大贡献方。Series C 和工厂公告在 2025 年 10 月发布； 位于前 Austin American-Statesman
              印刷楼的工厂开始改造为储能和电力电子制造线，目标在 2026 年初全面投产。

              随后的公用事业合作公告密集落地：GVEC（Guadalupe Valley Electric Cooperative）于 2025 年 6 月启动公用事业管理的电池群； Farmers Electric
              Cooperative 于 2025 年 12 月签约，目标部署 20 MW 住宅储能；El Paso Electric Company（EPE）于 2026 年 2 月宣布最高 10 MW
              试点，赶在夏季高峰前落地；CoServ（Denton County Electric Cooperative）于 2026 年 3 月宣布签署 100 MW 协议——这是 Base
              迄今最大交易，也被称为德州最大的分布式储能项目之一。到 2025 年中，客户数超过 10,000 户，总部署容量超过 100 MWh。 2026 年预计收入约 $70M。
