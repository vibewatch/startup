      - CV006
      - CV007
      - CV008
      - CV020
      - CV021
  - id: FV003
    title: 各情景下的估值与回报区间
    type: range
    layout: standard
    summary: 以 2027 年收入和退出倍数假设为锚，推导从熊市到牛市情形的退出估值区间，并与 $4B Series C 入场价比较。
    data:
      items:
        - label: 熊市情形退出（35% 概率）
          low: 0.24
          mid: 0.37
          high: 0.5
          unit: $B
        - label: 基准情形退出（45% 概率）
          low: 1.5
          mid: 2.05
          high: 2.6
          unit: $B
        - label: 牛市情形退出（20% 概率）
          low: 5
          mid: 5.63
          high: 6.25
          unit: $B
        - label: 概率加权预期价值
          low: 1.8
          mid: 2.3
          high: 2.7
          unit: $B
        - label: $4B Series C 入场（参考）
          low: 4
          mid: 4
          high: 4
          unit: $B
    approximationNotes: >-
      退出倍数：熊市情形为 2027E 收入 $30–50M 的 8–10x；基准情形为 $100–130M 的 15–20x；牛市情形为 $250M 的 20–25x。概率权重：牛市 20%，基准 45%，熊市
      35%。优先权栈和清算条款未公开披露；高级优先股悬垂可能进一步削弱回报。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV033
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向投委会的八维评分，覆盖市场机会、执行证明、竞争护城河、单位经济、监管风险、估值、资本强度和证据质量。
    data:
      items:
        - label: 市场机会
          note: 强：住宅 DER/VPP 市场年增 21%；2025 年住宅电池入网量 +153%；AI 数据中心需求顺风进一步放大 ERCOT 电网压力
        - label: 部署执行
          note: 强：两年内覆盖 10,000+ 户住宅 / 100+ MWh；2025 年末运行速度约 20 MW/月；接近零流失；ADER 计划资格已确认
        - label: 商业模式新颖性
          note: 好：垂直整合的发电零售一体化模式具备结构差异；叠加收入（零售利润 + 电网服务 + 租赁）提供部分底部支撑；零售合同形成持久收入
        - label: 单位经济
          note: 弱–中等：Gen 1 回本期随 ERCOT 收入假设在 3.5–8.5 年之间；估算互相冲突；电网服务收入较 2023 年峰值下降 90%；规模化后未经独立验证
        - label: 竞争护城河
          note: 中等：聚合电池群带来的网络效应和数据真实存在，但仍早期；Tesla Powerwall、Sunrun Battery 和公用事业赞助项目构成可信威胁；3 年电力合同内嵌切换成本
        - label: 监管与市场风险
          note: 偏高：ERCOT 辅助服务收入结构性坍塌；RTC+B 改革是不确定上行；全国扩张需要不同监管关系；迄今未发生反向监管事件，但敞口高
        - label: 估值与证据
          note: 弱：2025 年收入 333x；2026E 收入 57x；概率加权 EV 为 $2.2–2.5B，低于 $4B 入场价；无审计财务；公开可比公司为 1.5–5.6x；当前倍数只有在赢家拿走大部分市场的情形下才说得通
        - label: 资本强度与融资风险
          note: 高风险：已投入 $1.3B；全国规模化需要数十亿美元 CapEx；城市激励协议告吹；Gen 3 工厂时间表未确认；普通股前面压着 $1.3B 优先权悬垂
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
