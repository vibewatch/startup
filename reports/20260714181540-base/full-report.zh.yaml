  - id: TV005
    title: 投资逻辑破裂与止损触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ERCOT 电网服务收入坍塌
        - 到 Q4 2026，收入降至 $20/kW/year 以下
        - 单台回本期超过电池可用寿命（约 10 年）；叠加收入模型破裂；2026 预测无法达成
        - 退出或减仓；视为悲观情景被证实
      - - Gen 3 制造成本超支
        - 到 2026 年底，单台电池净成本仍高于 $10,000
        - 表明工厂执行失败；全国扩张会放大资本密集度；已投入的 $1.3B 可能不够
        - 暂停跟投；任何后续投资前要求制造审计
      - - 全国扩张停滞
        - 到 Q4 2026，ERCOT 以外仍无确认的商业部署
        - 乐观情景收入增长需要多州扩张；按当前安装速度，仅 ERCOT 会把 2027 收入限制在 $50M 以下
        - 将建议从观察降为放弃
      - - 流失加速
        - 任一 12 个月队列的客户流失超过 5%
        - 收入耐久性受到质疑；零售电力合约执行存在风险；竞争替代品侵蚀模式
        - 深入做客户级尽调；可能指向结构性产品市场匹配上限
      - - 降价轮或困境融资
        - 新股权融资估值低于 $3B，或债务融资票息 >15%
        - 优先权结构被侵蚀；表明投资人对近期路径失去信心；高管人才留存风险
        - 从头重估投资逻辑；即使恢复，优先权结构也可能损害回报
      - - ERCOT ADER 或 VPP 补偿规则逆转
        - PUCT 修改规则，降低 ADER 计划参与资格或补偿费率
        - 直接冲击主要电网服务收入层；影响所有客户的 ERCOT 经济模型
        - 必须重跑情景分析；折现率需要加入监管风险溢价
    notes: 阈值基于判断，来自 GreenCarFuture 单位经济性分析、Modo Energy ERCOT 收入预测和可比资本密集度研究。监控需要持续访问 ERCOT 市场数据和公司财务数据。
