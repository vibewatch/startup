  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - ADER 试点终止或容量冻结
        - PUCT Project 53911 申报；ERCOT 市场通知
        - 试点终止通知，或容量上限连续 2+ 个季度低于 Base Power 注册容量
        - 投资逻辑破裂 — 批发收入机制消失；重新评估商业模式可行性
      - - ERCOT 辅助服务收入压缩到低于零售成本基准
        - ERCOT 月度 BESS 收入指数（Enverus / Modo Energy）
        - BESS 平均收入连续 2 个季度 < $10/kW-year
        - 重大 — 监控套利或 RTC+B 收入能否补足；需要利润率分析
      - - PUCT REP 牌照执法或客户投诉升级
        - PUCT 案卷中搜索 Base Power 案件；BBB 投诉数量
        - PUCT 启动正式投诉程序或发出违规通知
        - 投资逻辑破裂风险 — REP 牌照暂停会叫停客户增长；立即尽调
      - - 客户家中电池起火事件
        - 新闻监控；CPSC Saferproducts.gov 申报；NFPA 报告
        - 任何确认发生在 Base Power 安装站点的热失控事件
        - 重大触发项 — 立即调查；评估产品责任和召回风险
      - - 机群管理平台网络安全事件
        - SOC 2 审计状态；NERC 合规接触；公开事件披露
        - 确认发生机群管理系统未授权访问或大规模调度事件
        - 严重 — 电网可靠性事件；ERCOT 罚款；声誉受损；监管调查
      - - Factory One 未达到部署产能目标
        - 月度设备部署率（已部署 MWh）与计划对比
        - 工厂投产后连续 3 个月部署速度 < 10 MWh/month
        - 重大——影响供应链独立性逻辑；退回进口硬件采购
      - - 关键高管离职（CEO 或 COO）
        - LinkedIn / PR 监测；投资人沟通
        - CEO 或 COO 离任且没有既定继任安排
        - 投资逻辑风险——评估继任者质量和组织知识交接
      - - 固定费率合约亏损超过储备缓冲
        - 季度财务披露或投资人报告（如有）
        - REP 利润率连续 2+ 个季度转负
        - 投资逻辑破裂——当前批发电价环境下，固定费率模式不可持续
    notes: 止损标准指会迫使团队立即重估投资逻辑的事件。行动含义从「监控」（低严重性）到「投资逻辑破裂」（高严重性，需要考虑退出）。
