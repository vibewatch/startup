      - number: '7.3'
        title: 运营、安全、网络与执行风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的租赁模式天然带来客户利益冲突：公司可以合法地把客户电池调度至 20% 荷电状态，将电力卖入 ERCOT
              批发市场；也就是说，电网停电时，电池可能并非满电。消费者论坛和电工咨询网站明确记录了这一风险：在全屋交流负载下，一块 25 kWh 电池满电也只能提供 2–5
              小时备电；若电池近期被调度，时长会更短。社区论坛讨论显示，部分客户认为自己被误导，原以为有备电时长保障，而 20%
              底线实质上大幅压低了有效备电上限。若未来极端天气事件中，客户原以为有覆盖却仍失去备用电力，声誉风险和监管投诉风险会急剧升级。

              电池火灾安全是真实但可管理的风险。Base Power 使用 LFP（Lithium Iron Phosphate）化学体系，热失控风险显著低于 NMC 锂离子电芯，但并非不会起火。2026 年，CPSC
              因第三方电芯缺陷导致过热、火灾和灼伤风险，对约 10,500 套 Tesla Powerwall 2 系统发布召回。这说明即便工程质量较高的户用电池系统，也可能需要召回。Texas
              各县火灾安全许可要求不一，形成分散的合规负担。Clean Energy Group 指出，正确安装的电池储能是安全的，但热失控会产生强烈火灾和有毒气体，扑救困难。Base Power
              若扩张到数万户并每天循环，产品责任敞口也会按比例增加。

              云端管理的户用电池资产带来更高网络安全风险。NERC 的 Howard Gugel 指出，对逆变器型资源进行大规模软件更新有双重问题：它提供运营灵活性，但若更新通道被攻破，也可能对电网造成灾难性影响。EPRI
              研究员 Sai Ram Ganti 警告，带有双向云连接的电池可由供应商远程操作；一旦云服务器被攻破，威胁会很大。Base Power 的资产管理模式依赖这种双向云连接来实时管理 SOC 并参与 ERCOT
              调度。若 Base Power 资产管理平台遭遇协调性网络攻击，数千块客户电池可能同时失效，足以构成重大电网可靠性事件和声誉灾难。Brattle/Dragos BESS 网络安全报告（2025 年 12
              月）发现，美国 BESS 部署每年增长 30%，但网络安全标准和监管要求没有跟上。

              Base Power 全国扩张时，安装商与供应链风险很实质。美国户用电池安装能力承压：专业工人供不应求，中国电芯关税压缩库存可得性并推高成本。2026 年美国户用电池储能部署预计下降
              12%，显示短期逆风。Base Power 的本土制造策略（位于原 Austin American-Statesman 场地的 Factory
              One）从结构上缓解供应链风险，但也给一家此前没有工厂运营经验的公司增加了制造执行风险。

              Base Power 成立时间短（2023 年 8 月）、目标范围大（全国扩张、本土制造、ERCOT 市场参与、REP 运营），且管理层缺少运营大型能源公用事业或工厂的完整履历，执行风险偏高。CEO Zach
              Dell 有金融和风投背景；COO Justin Lopas 在 Anduril 与 SpaceX 有制造经验，但两人此前都没有带过这种规模的公用事业级电池资产穿越完整市场周期。
