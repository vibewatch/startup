      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: |
              相比硬件 OEM 阵营，Base Power 的竞争定位建立在三项结构性优势上：资产所有权（Base 承担资本开支，而非消费者）、电池超配（25 kWh，
              对比 Tesla 13.5 kWh 或 Enphase 5 kWh 模块单元），以及与公用事业伙伴的直接集成。

              **价格差：** Base 收取 $695（单电池）或 $995（双电池）安装费，外加 $19/month（双电池 $29）持续费用。GVEC 会员支付更低——$295 或 $445——
              且 Base 完全免收月度会员费。竞争性的硬件购买模式要求 Tesla Powerwall 3 前期支付 $7,500–$13,500、FranklinWH aPower 2 支付 $6,500–$8,500，
              或 Sonnen 零售购买路径支付 $8,000–$11,000。即便扣除 Oncor $4,500 rebate（Oncor 区域可用），硬件购买竞争者仍要求消费者投入比 Base
              入门价高 5–10×。联邦住宅 ITC 25D 税收抵免于 2025 年底到期，使 2026 年这一差距进一步扩大。

              **容量和电网价值：** Base 的 25 kWh / 11.4 kW 电池提供的储能约为 Tesla Powerwall 3（13.5 kWh）的两倍，是 Enphase IQ Battery 5P
              模块容量的五倍。更大电池容量带来每台更多能源套利、ERCOT 每节点更多收入，以及更长备用时长。Base 双电池安装（50 kWh）可为普通 GVEC
              客户提供最长约 12 小时备用，对比单台 Powerwall 3 约 3–4 小时。

              **公用事业集成 vs. 消费者控制模式：** Base 模式默认保留 80% 电池容量给公用事业调度，20% 留给房主备用。竞争性的硬件购买模式给房主完全控制权，
              公用事业公司认为这是一种不那么可靠的电网资产。GVEC 特别指出，表后资产（Base 模式）能提供输电成本降低收益，而注册为发电资产的公用事业规模电池不能提供。
              Sonnen/Solrite 与 Base 类似，提供 10–20% 备用保留，反映同样权衡。Tesla VPP 在停电期间让房主可选择退出，降低了电网运营商的调度可靠性。

              **软件和控制栈：** Base 声称其自有自营电池群具备亚秒级遥测和 three nines 正常运行时间。依赖房主覆盖控制的竞争者（智能恒温器、Sunrun
              客户控制系统）面临 Base CEO Zach Dell 在投资人评论中明确提到的「DR 1.0」可靠性批评：「我们的资产归我们所有，由我们控制。我们有三个 9 的正常运行时间。」
              AutoGrid 和 Fluence 向公用事业公司提供可比的软件成熟度，但它们本身不持有硬件资产，在房主入网层面产生执行风险。
