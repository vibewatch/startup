  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与市场规则风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 夹在三套监管制度之间：ERCOT 市场规则、PUCT 零售电力供应商（REP）认证，以及 ADER 试点。任何一套规则都可能单方面改写公司的经济账，或收紧其运营许可。

              ERCOT NPRR 1186 于 2024 年 4 月 11 日获批，并于 2024 年 6 月 27 日生效，要求提供辅助服务的 Energy Storage Resources
              保持足够荷电状态，撑满一小时义务期。电池运营商若未维持规定 SOC，每 5 分钟间隔最高可被罚 $25,000。批评者认为这套罚则有歧视性，因为热电机组只有在实际交付失败时才面临处罚。2024 年 1
              月，PUCT 起初将 NPRR 1186 发回重审，理由是执法条款会让即便完全履行调度义务的电池也被罚，从而抑制储能投资；委员会随后在 2024 年 4 月批准了放宽版规则。Eolian
              等行业参与者警告，NPRR 1186 将「显著减少储能参与辅助服务市场，并削弱竞争」。随后，RTC+B（Real-Time Co-optimization plus Batteries）于 2025 年 12
              月上线，用协同优化调度取代这一过渡框架，但也提高了算法能力门槛，并压缩了原本依赖市场设计缝隙的结构性 alpha 收入。

              Base Power 通过 ADER（Aggregated Distributed Energy Resource）试点汇聚户用电池、参与批发市场。该项目仍只是由 PUCT Project No. 53911
              监管的试点。截至 2025 年 10 月，ERCOT 将全系统 ADER 总容量上限从 160 MW 提至 200 MW，并把 QSE 集中度上限从 20% 提至 50%。但 ADER 仍是试点，ERCOT 与
              PUCT 保留在较短通知期内修改参与规则、调整容量上限或终止试点的权力；这直接威胁 Base Power 的主要收入生成机制。已有报道提到 Base Power 参与 ADER 试点，但尚未找到 PUCT
              Project No. 53911 文件中的公开确认。

              作为 Texas 持牌 REP，Base Power 必须在 3 月 5 日前提交年度报告、在 8 月 15 日前提交半年度报告，维持信用证（少于 50,000 个 ESI ID 为
              $750,000，高于该规模为 $1.5 million），并在 15 天内回应提交至 PUCT 的客户投诉。若违反 Public Utility Regulatory Act 或委员会规则，PUCT
              有权暂停或吊销 REP 牌照。Uri 之后的立法改革（SB 6、SB 7、SB 1287 及相关法案）也让 PUCT 监管更主动，ERCOT Protocol Revisions 现在需要 PUCT 批准。

              并网成本风险也在上升：PUCT 修订后的 16 TAC §25.195（2026 年 1 月 1 日生效）规定，超过 $14 million（≤138 kV）或 $20 million（138 kV
              以上）的并网成本由接入发电资源直接承担。Base Power 扩大工厂直出硬件资产时，这会带来成本敞口。NERC 的 Texas RE 已将逆变器型资源合规（包括电池）列为 2026
              年重点审计领域，进一步增加合规成本和文档负担。
