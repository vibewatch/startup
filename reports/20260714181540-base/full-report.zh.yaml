      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >
              Base Power 的融资历史显示轮次间隔被快速压缩：Seed（$7.8M，2023 年 8 月）、Series A（$68M，推定 2024 年）、Series B（$200M，2025 年 4
              月）、Series C（$1B，2025 年 10 月），不到两年半累计融资 $1.3B。Series C 由 Addition 的 Lee Fixel 领投；他在 Series B 加入董事会。B 到 C
              间隔仅 6 个月，融资额从 $200M 跳到 $1B，是美国能源创业史上最快的加注周期之一，也显示投资人强烈相信短期部署动能。Series C 投前估值为 $3B（TechCrunch 援引 The New
              York Times），意味着 $1B 投资在未稀释口径下买入约 25% 股权；但实际经济权益取决于未公开的优先权条款。

              与 $4B 投后估值相比，累计投入资本 $1.3B，意味着总融资额与估值之间约 3.1× 的轮次间加价；对这一阶段的高增长风投项目来说，并不异常夸张。但从 LP 回报看，关键约束在于，任何低于 $5–6B 的
              IPO 或 M&A 退出（约为投入资本 4–5×）都可能让后期投资人失望，特别是在四轮优先清算权叠加之后，标准门槛回报为 2–3×。累计资本 $1.3B 带来的优先权压力（假设 1×
              清算优先权）意味着，普通股股东要等前 $1.3B 返还后才有分配，后期优先股投资人也很可能持有参与型或高级优先权结构。这些条款未公开，是重大尽调缺口。

              二级市场信号只能提供有限价格发现：截至 2026 年 5 月，Notice.co 挂出的 Base Power 股份约为每股 $10.65–$11.04。若不知道股权结构表中的每股数量，就无法直接反推出总估值；但
              Forge、Hiive 和 EquityZen 上存在活跃二级交易，确认投资人有流动性需求，也说明当前一级轮次估值在二级市场没有明显压缩。Forge Global 将 Base Power 标为「保密提交」IPO
              状态里程碑；若收入扩张至 $150–300M，2026–2028 年 IPO 窗口具备合理性。

              在 $4B 标记上保持入场纪律，要求投资人相信 Base Power 退出时能维持 5–10× 收入倍数，也就是终局收入 $400M–$800M。到 2027–2028
              年实现这一点，只有在以下条件同时成立时才可行：(1) ERCOT 每 kW 收入稳定在 $40/kW 以上；(2) Gen 3 制造项目将电池成本降低 30–40%；(3) 全国扩张在 2027
              年前新增至少两个市场；(4) Texas 以外客户客群批次经济性跑通且流失率接近零。每一项单独看都合理；四项同时成立才是核心判断。
