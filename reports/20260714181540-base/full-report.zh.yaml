      - number: '4.5'
        title: 附录
        blocks:
          - type: callout
            title: 资本强度与收入规模错配，使公司结构性依赖持续股权融资
            body: >-
              Base Power 已融资约 $1.3B，而 2025 年收入只有 $12M，资本效率比约为 108:1——即每 $1 年收入背后，公司已投入超过 $100
              投资人资本。这一比例符合早期硬件平台特征，本身并非否决项；但它意味着短期生存的前提，是能继续以有利估值获得股权资金。投资人风险偏好若因利率变化、政策风险（ITC 退坡或 FEOC
              限制）或收入目标落空而恶化，电池集群实现现金流盈亏平衡之前，公司就可能触发融资危机。
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
              - CI017
              - CI032
          - type: callout
            title: 批发套利收入是回本引擎，但仍未验证且依赖市场
            body: >-
              Base Power 单位经济性所称的 3.5 年回本，依赖批发套利成为主导收入贡献。这一收入流在单台层面尚未验证，并取决于 ERCOT 价格波动持续、ADER 项目成熟，以及 QSE 成本结构。截至 2025
              年中，全体参与者实际调度的 ADER 容量只有 15 MW；单一聚合的盈亏平衡规模约 15–20 MW。若新增输电或发电资源让 ERCOT 电网条件波动下降，或监管变化限制 ADER 参与，套利层可能大幅压缩。
            calloutType: risk
            claimRefs:
              - CI007
              - CI027
              - CI028
              - CI029
          - type: callout
            title: 公用事业容量托管协议形成第四层收入，可能改善电池集群经济性
            body: >-
              Austin Energy 交易提供了战略模板：同一套硬件上，Base Power 在既有零售和套利收入之外，获得稳定、低波动的容量付款。40 MW 每年 $4.08M，对应隐含价格
              $8.50/kW-month，带来温和但稳定的增量收益。如果能在 ERCOT 复制给更多市政公用事业和合作社，容量托管协议在 200–400 MW 签约容量下可贡献每年 $20M–$40M
              收入，不增加额外硬件部署也能显著改善混合资本回本。
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI036
          - type: callout
            title: $70M 2026 年收入预测假设 Gen 3 制造爬坡成功
            body: >-
              公司 2026 年 $70M 收入预测，取决于 Factory One 的 Gen 3 电池生产规模化。CEO 已公开承认，制造爬坡到 2026 年中都会“困难”。若 Gen 3 产量不达标，每月 20 MW
              部署节奏就无法靠进口或签约硬件维持，除非承受显著成本影响。若 2026 年安装量短缺 50%，收入将约为 $40M–$45M，而不是 $70M 目标，并可能迫使公司早于 Series C
              资金续航原本支持的时间再次股权融资。
            calloutType: assumption
            claimRefs:
