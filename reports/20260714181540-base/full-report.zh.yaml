      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Base Power 市场最强的增长驱动，是德州结构性需求增长与住宅 VPP 变现监管支持叠加。人口增长、数据中心建设和电气化推动 ERCOT 用电需求快速上升，促使州监管机构既简化住宅电池许可，也扩大 ADER
              试点。IRA 对独立住宅电池储能提供 30% 联邦 Investment Tax Credit （至少持续到 2032 年），把电池采购的有效成本降低近三分之一，并直接改善 Base Power
              的硬件单位经济性。

              FERC Order 2222 于 2020 年最终定稿，到 2026 年进入高级实施阶段，消除了聚合 DER 参与 FERC 管辖 ISO 批发市场的障碍（不包括州级管辖的 ERCOT）。 Base Power
              当前德州市场不受 FERC 管辖，但 Order 2222 为 Base Power 计划进入的扩张市场建立了全国模板。在 ERCOT 内部， Texas 公用事业委员会（PUCT）监督的 ADER
              试点发挥同样功能，Phase 3 于 2025 年中把上限扩至 160/80/80 MW。

              关键约束包括：（1）ERCOT 电网级 BESS 收入压缩——平均电池收入从 2023 年 $149/kW 降至 2025 年预计约 $17/kW， 压低住宅 VPP
              可获取的电网服务收入池；（2）房主的转换成本和入网摩擦，客户必须签多年电池生命周期协议；（3）联邦政府更迭下的 IRA 政策风险，可能削减 30% ITC
              或对上游电池组件加征关税；（4）快速部署的资本强度——部署 100 MW 住宅储能需要规模化硬件、劳动力和资产负债表融资； （5）ERCOT 2 秒 ADER
              遥测要求下的互操作性和遥测门槛，抬高了聚合商技术门槛。

              一个实质不利信号：ESS News 和 Enverus 于 2025 年末报道，ERCOT BESS 运营商年初至今盈利率低于 2.2%，且能源套利未能抵消辅助服务价格崩塌。 这直接限制 Base Power
              可用来抵扣客户账单、维持竞争性订阅价格的电网服务收入部分。如果 2026 年夏季高峰没有出现稀缺事件， Base Power 的收入模型将承受利润率压力。
