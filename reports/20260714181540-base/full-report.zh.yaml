      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: |
              Base Power 的持久竞争优势集中在五个会相互强化的因素：公用事业合作社伙伴合同（转换成本）、ADER 资格（监管护城河）、
              专有硬件 + 软件垂直栈、本土制造（Austin 工厂）和部署速度。不过，几项替代风险需要认真加权。

              **锁定和转换成本：** 一旦 Base 电池安装在合作社会员电表之后，由公用事业调度电池群、房主获得备用服务，切换供应商就需要物理拆除并更换硬件——
              摩擦很高。三年最低合同进一步锚定客户。公用事业合作（CoServ 100 MW、GVEC 50 MW、Bandera、Farmers Electric）也创造 B2B 转换成本：
              合作社需要重新认证并把新的 DERMS 供应商接入自身运营和 ERCOT 注册。不过，这些合同有期限，续约没有保证。

              **ADER 监管护城河：** Base 取得 ERCOT Aggregated Distributed Energy Resource 试点资格，允许其把聚合住宅储能直接投标进入 ERCOT
              批发和辅助服务市场。这一监管资格并不容易复制——ADER 试点有 200 MW 总容量上限，遥测和合规要求会劝退小运营商，还有互操作性壁垒，
              连 ERCOT ADER Task Force 都将其称为「需要解决的关键方面」。Sonnen/Solrite 正瞄准同一 200 MW 上限中的 144 MW，
              因此这条监管通道上的竞争压力已经加剧。

              **商品化电池替代风险：** ERCOT 电池收入已经崩塌——Enverus 数据显示，平均年收入从 2023 年 $149/kW 降至 2025 年预计 $17/kW，
              降幅 89%，原因是市场饱和（进入 2026 年装机 14 GW）。能源套利策略已经普及，但未能抵消收益下滑，主要运营商年初至今盈利率低于 2.2%。
              如果辅助服务和套利收入继续受压，Base 的单位经济性（估计每套 25 kWh 系统年总收入约 $2,075）可能只是勉强成立，
              尤其当 100+ 员工带来的人员开销超过 $15M/year。批评者指出，Base 在基准收入情景下回本期为「8–9 年」，
              只有在高波动年份才缩短到 5–6 年。

              **Tesla 和 Sunrun 价格战风险：** Tesla 和 Sunrun 都有内部电池制造资源（CATL/Panasonic 合作）和既有安装商 / 房主渠道，
              规模远超 Base 当前足迹。一名批评者特别警告称，「Tesla 或 Sunrun 复制他们的成功不需要太多。这些公司，尤其 Tesla，
              已经能接入内部电池制造，并会在任何价格战中赢过 Base。」Base 2025 年 10 月的 $1 B Series C 和规划中的本土 Austin 工厂，
              正是对这一风险的明确回应。

              **监管和政策逆风：** 联邦住宅 ITC 25D 于 2025 年底到期，削弱了竞争性太阳能加储能安装的经济性，也可能降低消费者对任何家庭能源投资的需求。
              2025 年的「One Big Beautiful Bill Act」压缩了开发商时间线，并提高了合规负担。Deloitte 2026 Power and Utilities Outlook 指出，
              容量采购、电价设计不确定性和并网延误仍是电力公用事业行业的顶级风险——这些都会影响 Base 在德州之外签下新的受监管市场公用事业合同。
