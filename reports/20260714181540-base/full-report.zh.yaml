      - number: '4.4'
        title: 财务缺口与承销阻断项
        blocks:
          - type: paragraph
            body: >-
              Base Power 公开呈现出明显的信息不对称：投资人似乎掌握的内容，远多于外部可验证的信息。收入估算、部署速度、客户数、已部署 MWh
              等顶线牵引指标，可从分析师来源和新闻稿获得；但能证明商业模式的所有单位经济性指标——毛利率、EBITDA、电池利用率、每 MWh 实际套利收入、单客贡献利润、CAC /
              回本数据——均为私有且未验证。这形成了一类“公司声称”的单位经济性：3.5 年回本、近零流失。这些说法与结构模型一致、也有合理性，但尚无独立佐证。


              几个具体财务风险在承销时需要重点看。第一，ERCOT 批发收入依赖市场结构持续有利：ADER 项目仍在成熟期（截至 2025 年中，全体参与者实际调度仅 15 MW），QSE
              费用、充电环节的配电费和遥测成本共同形成门槛，聚合规模约 15–20 MW 后经济性才有吸引力。第二，受监管市场扩张路径（El Paso Electric
              试点、Illinois）会剥离零售利润和批发套利两层，只剩公用事业容量付款；这一层尚未证明足以支撑 4 年回本。第三，电池制造爬坡有运营风险：CEO 称 Factory One 的 Gen 3 生产到 2026
              年中都会“困难”，成本超支或延期会直接压缩支持大规模电池集群部署的利润空间。


              80%/20% 的电网调度 / 备用电分配已写入合同条款，但仍会带来持续的声誉和监管风险：如果数小时前刚发生电网交易，真正停电时，原本期待全屋备用的房主可能发现只有 20% 电量可用。营销价值主张（“48
              小时备用”）与正常运营条件下实际可用备用之间的错配，是独立房主评价中最常被提及的负面担忧；若 PUCT 重新审视分布式能源资源聚合商的消费者保护规则，也可能引发监管审查。
