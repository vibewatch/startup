  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现栈
        blocks:
          - type: paragraph
            body: >-
              Base Power 的收入架构刻意叠成四层，每层承担不同财务功能。第一层也是最薄的一层，是房主租赁费：25 kWh 一次性安装费 $695，50 kWh 为 $995；月费则按电池大小收 $19 或
              $29，带来可预测但不高的经常性现金流。每户每年订阅收入只有 $228–$348；若只靠这笔费用，约 $7,000 的单台净资本投入要 20 年以上才能回本，租赁层单独撑不起模型。


              第二层更关键，是零售电力价差。Base Power 作为客户的零售电力供应商（REP），按 8.5 cents/kWh 的固定电价加标准本地输配电费收费（Oncor 区域约 5.8 cents，合计约 13.8
              cents）。截至 2026 年 4 月，公司通过新的 “Base Energy” 计划把这一价值主张扩展到无电池客户，36 个月合约电价为 13.2–15.7
              cents/kWh，把可触达群体扩大到公寓住户和不愿安装硬件的人群。Base 从 ERCOT 购买批发电力，并赚取客户固定零售电价之上的价差。


              第三层也可能是毛利最高的一层，是批发电网套利。Base Power 的软件在 ERCOT
              现货价格低或为负时给分布式电池集群充电，再在高价窗口释放聚合容量。零售业务和批发业务在结构上互相对冲：日内现货价格飙升会压缩零售利润（固定电价客户仍按 8.5 cents 付费，而 Base
              要支付升高的批发价），但同一波价格尖峰也会同步抬高电池放电收入。Base Power 已取得 ERCOT
              聚合分布式能源资源（ADER）项目资格，可把聚合电池集群作为单一虚拟电厂投标进入批发市场。第四层正在出现：公用事业容量托管。2026 年 5 月，Austin Energy 签约 40 MW
              电池容量，按固定且不递增的每千瓦月价付款，最高价值每年 $4.08M、十年 $40.8M。这类容量托管协议可叠加在同一批已安装电池集群的零售和套利收入之上，不增加边际硬件成本就改善电池集群经济性。在 ERCOT
              以外的受监管市场，只有容量托管层可用，回本算法因此根本改变。
