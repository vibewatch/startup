      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >
              **Tesla（Powerwall + Autobidder + Tesla Electric）**是 Base Power 最可信的多维度对手。Tesla 的 Powerwall 3 拥有 13.5 kWh
              容量和 11.5 kW

              连续输出，在德州每台安装价 $10,000–$13,500（不含 Oncor $4,500 rebate）。Tesla 在 ERCOT 以 Tesla Electric 运营 REP，

              其 Autobidder 软件把住宅 Powerwall 聚合成电网服务资产——与 Base 是同一商业模式。Tesla 德州 VPP 项目向房主补偿约 $33/Powerwall/month

              账单抵扣，另加约 $0.05/kWh 外送电量收益，意味着典型参与者每年总补偿约 $786。Tesla 的优势是品牌认知、内部电芯制造、EV 集成和深厚 Autobidder

              市场经验。劣势是前期成本高、市场进入以太阳能为中心，以及 13.5 kWh 电池小于 Base 的 25 kWh 单元——这对 ERCOT 4CP 输电成本管理和单台电网收入很重要。

              Tesla 架构也要求房主购买（对消费者是重资产），而不是 Base 提供的轻资产订阅。


              **Sunrun（NASDAQ: RUN）**是美国最大的住宅太阳能加储能供应商，拥有超过 1M 太阳能客户和 116,000+ 已安装储能系统。在德州，

              Sunrun 已与 NRG/Reliant（目标到 2035 年建设 1 GW VPP，首期 150 MW）和 Vistra/TXU Energy 建立合作。Sunrun 的 California

              CalReady 项目在 16,000 户住宅中实现平均 48 MW 峰值调度，是住宅聚合规模化的有力证明。Sunrun 的竞争弱点是高债务（$14 B+ 负债）、

              每客户约 $7,000 的获客成本，以及据称较低的净推荐值，反映安装延误和售后服务问题。Sunrun 要求房主已有或安装太阳能，

              因而结构上无法服务非太阳能住宅；Base 的纯电池模式覆盖两类细分。


              **Sonnen（SOLRITE VPP）**于 2026 年 2 月与 SOLRITE Energy 在 ERCOT 启动，目标到 2026 年底覆盖 10,000 名客户，形成 600 MWh/144 MW
              容量。

              Sonnen 的方案——60 kWh 储能，月费 $20，全包零售电价 12¢/kWh——在每 kWh 备用电量价格上直接竞争 Base 的会员方案。

              Sonnen 由 Shell 持有（2019 年收购），资产负债表支持很深。Sonnen 电池（ecoLinx 世代）对零售购买者提供 15,000 次循环 / 15 年质保，

              安装成本 $1,200–$1,500/kWh；这是高端硬件在订阅 VPP 场景中的重新定位。Sonnen 第 11 代电池正与 Solrite 一起部署，

              根据堆叠数量提供 6/12/18 kW 输出。200 MW ADER 试点上限是共同约束；Sonnen 的 144 MW 目标直接与 Base 争夺这部分监管空间。


              **Generac（PWRcell + Enbala/Concerto DERMS）**是美国备用发电机主导品牌（约 75% 市占率），并通过 PWRcell 住宅储能和 Enbala/Concerto

              DERMS 平台转向清洁能源。截至 2026 年初，Generac 清洁能源板块约占总收入 60%。Generac 住宅电池拥有 9–18+ kWh 可扩展容量、

              强浪涌能力，以及面向太阳能的 DC 耦合。不同于 Base，Generac 通过经销商网络销售，而不是直接持有资产；它争夺相同的德州安装商心智和房主注意力。

              Generac Power Systems 也销售丙烷 / 天然气备用发电机（安装价 $10,000–$20,000+），这是 Base 正在替代的主要既有现状方案。


              **Fluence/AutoGrid（软件层竞争者）**瞄准公用事业 DERMS 和 VPP 软件市场。Fluence（NASDAQ: FLNC）雇佣约 1,670 人，

              运营成熟的公用事业规模和电网服务软件栈；AutoGrid 被 Schneider Electric 收购后，目前在 Fluence 内运营，向公用事业公司提供 VPP

              编排和 DERMS 软件。这些公司争夺的不是房主，而是 Base 在受监管市场扩张中同样想拿下的公用事业合同——如果公用事业采购 AutoGrid

              作为自己的 DERMS，就可能内化电池群管理，而不是外包给 Base。
