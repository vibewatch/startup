        - 由 Austin 工厂自研生产；供应商特定风险未披露
      - - 嵌入式固件（BMS）
        - 电芯监控、保护、OTA 更新、安全联锁
        - 嵌入式 Linux 或 MCU 上的 C/C++/Rust；实时控制
        - 专有；无公开代码仓库；固件缺陷可能影响全车队安全或可用性
      - - BaseOS 后端
        - 车队编排、能源交易、计费、部署物流
        - Golang/Python；AWS 云；Kubernetes；Terraform IaC；Temporal 工作流
        - 单一云服务商集中（AWS）；故障可能削弱远程调度
      - - 原生 SCADA / 公用事业 API
        - 实时公用事业调度控制；仪表盘 + API 集成
        - 专有 SCADA；网页仪表盘；REST/API；可选接入公用事业 EMS
        - 监管风险：ERCOT ADER 节点结算规则在审；调度规则未定
      - - 连接层
        - 向每台电池下发指令
        - 三重冗余：WiFi（主用）、4G 蜂窝（备用）、光纤（可用处）
        - <5% 强制停运率（公司口径）；灾害中依赖蜂窝网络
      - - 客户应用
        - 停电通知；SOC 监控；账单查看
        - 移动 / 网页应用；客户可监控但不能控制电池
        - 客户不能手动接管；调度时 SOC 透明度是用户体验风险
    notes: 技术栈根据招聘信息（Built In、Ashby HQ）和公司公用事业页面推断；并非所有组件均有官方技术文档确认。Austin Factory 产能目标为公司口径。
