      - number: '3.5'
        title: 现状与替代方案
        blocks:
          - type: paragraph
            body: >
              最大的竞争集合不是其他 VPP 公司，而是德州房主在遇到 Base 前会选择的现状方案：没有备用电源（接受停电风险）、丙烷 / 天然气备用发电机、

              与电网互动的智能恒温器，以及完全不带储能的零售电力计划。


              **无备份现状：** 多数德州住宅客户经历过一次或多次重大停电事件（Winter Storm Uri 2021、Summer 2023 heat events、Winter Storm Fern 2024），

              但没有安装备用电源。硬件购买的经济门槛是主要阻碍——Base 用 $695 入门价直接解决这一点，对比可比发电机或电池替代方案的 $15,000+。


              **丙烷 / 天然气备用发电机（Generac、Kohler）：** Generac 在美国家用备用发电机市场约占 75% 份额。安装成本 $10,000–$20,000+，

              停电期间还有持续燃料成本和维护要求。发电机只要有燃料就能无限期运行，但会排放 CO，且需要户外安装。Base 面向 GVEC 会员将其方案营销为比发电机等「类似备用解决方案便宜 95%」。

              在持续多日的长时间停电中，发电机续航胜过电池；但对典型德州停电（按 Base 电池群数据，97%+ 低于 3 小时），Base 的 25 kWh 电池几乎覆盖全部事件。


              **需求响应项目（Renew Home/OhmConnect、Voltus、Leap）：** Renew Home——由 Google 的 Nest Renew 和 OhmConnect
              合并而来——如今是北美按入网家庭数计最大的住宅 VPP，

              使用智能恒温器和可控负荷，而不是电池。这些项目提供电网价值（削峰、移峰），不需要安装硬件，但无法在电网停电时提供全屋备用；

              而这正是 Base 最强的消费者价值主张。截至 2026 年 5 月，OhmConnect 已将德州客户迁移到 Direct Energy，并以 Renew Home 平台运营。


              **带分时电价的零售电力计划：** 德州放松管制市场（130+ REP）提供分时、免费夜间和太阳能回购计划，让房主不装电池也能部分套利电网价格波动。

              随着太阳能回购价值下降（「solar orphans」），这些计划吸引力下降，为 Sonnen/Solrite 的 VPP 明确打开机会。Base 作为 REP

              直接与其他德州 REP 争夺电费账单关系，其竞争性费率取决于电网条件和电池调度收入分享。


              **既有公用事业公司扩张电池项目：** 当前作为 Base 伙伴的合作社和 IOU，理论上可以利用公用事业规模电池采购加 AutoGrid 等 DERMS

              供应商，把分布式电池项目内化。GVEC CEO 指出，该合作社评估过「公用事业规模、接入配电网的电池」，并认定表后资产能提供更优的输电成本降低价值——

              这暂时验证了 Base 模式，但也说明公用事业公司正在主动评估所有选项。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: ERCOT 收入压缩对单位经济性构成实质威胁
            body: >
              2023 至 2025 年，ERCOT 电池辅助服务和套利收入下滑 89%（Enverus 数据）。Base 每块 25 kWh 电池的估算单位收入约为每年 $2,075，基准情形下对应 8–9
              年回本；对一个每年员工开支超过 $15M 的资本密集型业务来说，这只够勉强成立。若 ERCOT 长期处在低波动环境，Base
              可能被迫更多依赖固定的公用事业容量托管合约，而不是现货市场收入；这会加速其转向受监管公用事业模式，但合约期限也必须长于当前 3 年最低要求。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP028
              - CP029
          - type: callout
            title: 公用事业合作社伙伴模式筑起耐久分销护城河
            body: >
              Base 在 Texas 已有五个公用事业合作社伙伴（CoServ 100 MW、GVEC 50 MW、Bandera、Farmers Electric 等），拿到一条硬件 OEM 很难复制的 B2B
              获客通道。GVEC CEO 称，表后资产相比公用事业级电池更能降低输电成本——这从监管和运营两端验证了 Base 模式在技术上不同于纯硬件打法。目前 ERCOT 内还没有竞争对手拥有同等规模的合作社合约。
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP024
          - type: callout
            title: 价格战情境下，Tesla 和 Sunrun 是规模型威胁
            body: >
              Tesla 和 Sunrun 都已有房主渠道、内部或签约电池供给，以及监管准入（ERCOT REP 牌照、ADER 资格）。若 VPP 经济性足以支撑激进定价，它们有能力压低价格打击
              Base。一位行业分析师指出，Tesla 或 Sunrun 复制 Base 成功“并不需要太多”，这些公司“会在任何价格战中赢过 Base”。Base 的 $1B Series C 和 Austin
              制造策略正是对冲这一场景，但对一家 2023 年才成立的公司，制造执行风险真实存在。
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP027
          - type: callout
            title: Sonnen/Solrite VPP 是最接近的结构类比，也是近期最直接对手
            body: >
              Sonnen 2026 年 2 月推出的 SOLRITE VPP，在结构上最接近 Base：电池由平台持有，消费者无前置成本，并在 ERCOT 进行 VPP
              调度，同时对备用电量设置上限。主要差异在规模（10,000 户 vs. Base 更大的覆盖）、Sonnen 的公用事业支撑（Shell 资产负债表 vs. Base VC 资本），以及容量（60 kWh vs.
              25 kWh）。两个项目都瞄准同一个 200 MW ADER 上限，Sonnen 明确计划拿下其中 144 MW。这是 Base 在 ERCOT 扩张 ADER 的最直接竞争约束。
            calloutType: insight
