      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Base Power 最可能的退出路径，是在 2027–2029 年上市（IPO）。前提是公司证明年收入达到 $150–300M，并在多个市场持续实现正向单元经济。Forge Global
              的二级市场挂牌显示「保密提交」状态，与 IPO 准备工作一致，但截至 2026 年 5 月，并不能确认已提交 S-1。2026 年气候科技 IPO 窗口正在打开——X-energy 的 $1B IPO（首日上涨
              25%）和 Fervo Energy 约 $3B IPO 申请显示机构投资人仍愿意买能源基础设施故事——但市场呈 K 型分化：核能和地热更受青睐，硬件较重的气候科技则弱一些。因此，Base Power
              必须证明盈利或接近盈利，公开市场才会维持其增长溢价。

              战略收购是次要退出路径。潜在买家包括：寻求 DER/VPP 资产的大型美国公用事业公司（NRG、Exelon、Dominion）；希望用能源即便利设施做差异化的全国性住宅开发商（Lennar
              已是渠道伙伴）；或希望搭建户用能源平台的能源巨头（Shell、BP）。Uplight/Octopus 交易和 OhmConnect/Nest 合并，为 VPP 相邻收购在 $1–2B
              区间提供了私有市场先例；这说明，若想让收购方支付高于当前 $4B 标记的溢价，Base 需要非常大的规模或独特战略契合度。

              任何投资决定前，关键尽调缺口包括：(1) 覆盖完整客户客群批次的经审计单元经济，包括按当前市场价格计算的每块电池 ERCOT 电网服务收入；(2) 四轮融资的股权结构表与优先权栈细节；(3) Gen 3
              制造项目状态——时间表、单位成本和计划产能；(4) 非 ERCOT 市场的全国扩张计划，包括监管与市场进入打法细节；(5) 除单个已披露案例外的客户级流失率数据，包括 12 个月和 24 个月客群批次留存曲线。

              打破投资假设的触发条件包括：ERCOT 电网服务收入跌破 $20/kW/year（此阈值下单位回本期超过电池可用寿命）；到 2026 年底单位制造净成本仍高于 $10,000（说明 Gen 3
              未按轨道推进）；18 个月以上客群批次的流失率加速至 5% 以上；以及到 2026 年 Q4 仍未拿下任何非 ERCOT 市场。任一触发都会大幅降低牛市情景概率；两个或以上同时发生，则熊市情景会成为基准情景。
