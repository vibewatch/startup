      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 垂直整合栈形成可防守护城河
            body: >
              Base Power 把硬件设计、本土制造、专有固件和软件（BaseOS）、内部部署运营，以及零售电力供应放在同一家公司。这种整合在 VPP
              或电池即服务供应商中少见；多数同类公司依赖第三方硬件（Tesla、Enphase）和第三方软件（AutoGrid、Itron）。该栈让 Base 不受供应商依赖地迭代成本、可靠性和调度速度，并在每一层捕获利润。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE031
          - type: callout
            title: 20% SOC 下限意味着备用电不保证满额
            body: >
              合同允许 Base Power 将房主电池放电至 20% 荷电状态，以服务 ERCOT 电网交易义务。若重大停电开始时，房主电池正处于 20% SOC——这种场景最可能发生在峰值需求热浪事件中——可用电量约
              4.5 kWh，相当于重度空调负载下约 1–2 小时全屋备用。这是产品核心的结构性张力：支撑经济性的机制（电网套利），也是降低备用可靠性的机制。独立电气承包商 Epic Electrical
              已公开指出这一缺口，并建议用补充发电机互锁来补齐。
            calloutType: risk
            claimRefs:
              - CE032
              - CE037
          - type: callout
            title: China 电芯来源带来关税和供应链敞口
            body: >
              电芯目前来自 China。截至 2025 年 4 月，Base Power CEO 已直接承认关税敞口。Austin 工厂在本土制造模块、电池包和电力电子，可缓解部分成本敞口；但在建立非 China
              供应链之前，电芯仍是 China 来源投入。US–China 关税升级（Section 301 及相关措施）可能显著推高电芯成本、压缩利润率，或迫使公司在锁定本土电芯来源之前调整电池定价。
            calloutType: risk
            claimRefs:
              - CE033
              - CE038
          - type: callout
            title: ERCOT ADER 监管成熟是关键路径事项
            body: >
              Base Power 已用满可通过 ERCOT ADER 试点投标的 20 MW。ERCOT 正在审查扩容至 160 MW，仍待 2026 年 6 月董事会批准；但节点调度和结算规则——Base
              变现电池集群的主要机制——截至 2026 年 5 月仍在 ERCOT 内部审查。上限和结算框架是 Base 在 Texas 电网服务收入天花板上的硬约束；二者如何落定，将决定 ADER 渠道能否放大到支撑
              Base 的增长雄心。
            calloutType: insight
            claimRefs:
              - CE023
              - CE024
              - CE035
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与服务区域
        blocks:
          - type: paragraph
            body: >
              Base Power 目前服务一个主要客户原型：ERCOT 放松管制区域内的 Texas
              房主，他们希望获得停电保护和更低电费，但不愿为全屋发电机或自有电池承担资本开支。公司进一步按获客渠道划分客户：直接零售注册（Oncor、CenterPoint、TNMP、AEP Central 和 AEP
              North 区域可用）和公用事业伙伴推荐（Bandera Electric、GVEC、Farmers Electric、CoServ、El Paso Electric 和 Austin Energy 成员）。


              第三条渠道是 Lennar 住宅开发商集成，面向 Austin 和 Dallas-Fort Worth 的新房买家：截至 2025 年中，约 20 个 Lennar 社区在建房过程中安装电池，包括 Firefly
              Pointe（Hutto）、Rancho del Cielo（Jarrell）和 Rancho Canyon（Haslet）。这些买家把电池作为房屋套装的一部分获得，并自动加入 Base 电力服务。


              完整发售一体化模式在地理上高度绑定 ERCOT。El Paso Electric（ERCOT 以外的受监管公用事业）和 Austin Energy（ERCOT 内的市政公用事业，但不属于放松管制 REP
              市场）需要另一套只做容量托管的模式：房主不从 Base 获得零售电力服务，且通常无需前置付款。据 CNBC 报道，Base Power 直接零售客户约 50%
              已安装太阳能板，使光伏加储能房主成为关键子群体。2026 年 4 月，Base 推出无电池 “Base Energy” 电力计划，面向租户和共管公寓住户——这是首个非房主群体——覆盖同样五个放松管制公用事业区域。
