  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 电池硬件与产品组合
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 住宅电池采用 LFP（磷酸铁锂）体系，连续输出功率 11.4 kW，总容量 25 kWh（可用 22.5 kWh）。两台可并联安装，形成 22.8 kW / 50
              kWh（可用 44 kWh）配置。Base 有意选择 LFP，而不是 NMC 或 NCA：发售一体化业务模式天然要求高频日循环——夜间从低价电网充电，高峰价格时放电——LFP
              比其他化学体系更能承受这一工况。系统采用地面安装的一体化户外外壳；工作温度范围 14°F 至 122°F，噪声 ≤40 dB（相当于家用冰箱），电网停电切换时间记录低于 0.5
              秒——快到多数房主感知不到。设备可承受最高 88–100 A 堵转电流（LRA），无需改造即可覆盖大多数住宅 HVAC 系统；更大机组可加装软启动套件。设计寿命为 15 年。

              Base 面向客户销售三类产品：（1）Backup + Energy——公司旗舰计划，把电池安装与 Base 作为零售电力供应商合在一起；（2）Backup
              Only——房主保留现有公用事业关系，只使用电池备用服务，在部分区域可用；（3）Base Energy——2026 年 4 月在 Texas 所有主要 TDU 区域（Oncor、CenterPoint、AEP
              Central、AEP North、TNMP）推出的无电池、由 VPP 支撑的零售电力计划，面向无法安装硬件的公寓和共管公寓住户。电池系统由 Base Power 持有，而非房主所有；服务协议期限 10
              年，拆除费 $500，五年后或 Base 将费率提高到市场之上时免收。公司正在 90,000 平方英尺的前 Austin American-Statesman 地块建设第一座内部制造设施，目标产能爬升至 4
              GWh/年；电芯目前来自 China，形成关税风险，而本土工厂只能部分抵消模块、电池包和电力电子环节的风险。
