            body: >
              客户增长很快。Sacra 研究显示，2025 年 7 月至 12 月，Base 新增约 5,500 户；到 2026 年 6–7 月，Base 官网和 Illinois 发布材料称公司已为超过 20,000
              户供电，TechCrunch 也佐证其已部署住宅电池容量超过 100 MWh。截至 2025 年 8 月，App 月安装量约 5,000 次，夏季有季节性峰值。到 2025 年末，部署速度达到每月 20 MW。


              具名客户评价覆盖多个 Texas 市场。在 Base Power 官方评价页，Michael O. 称自己从 Reliant 切换后，账单下降 39%（全包价格从 $0.22/kWh 降至 Base
              的透明定价）。David C. 称从 Green Mountain Energy 切换后下降 40%。在 Magnolia, TX，Zac 表示最近一场风暴中，电池让他家持续供电超过 18
              小时且没有中断。Matt M. 称邻居停电 7 小时，而他“甚至不知道”，因为 Base 已经接管。早期用户 Venkata（太阳能集成）称该系统让个人“微电网”成为可能，并称赞包括 HVAC
              软启动安装在内的主动系统测试。Houston 的 Thomas 说他让同事注册了，也不再为春季雷暴紧张。Waxahachie 的 Bob A. 说，在发现 Base 之前，他已经准备买“最大、最吵的发电机”。


