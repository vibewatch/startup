      - number: '4.3'
        title: 资本充足性与融资架构
        blocks:
          - type: paragraph
            body: >-
              Base Power 在运营最初两年半已累计募集约 $1.3B 股权融资，使其成为美国资本最充足的早期分布式能源平台之一。2025 年 4 月 Series B 融资 $200M，由
              Addition、Andreessen Horowitz、Lightspeed Venture Partners 和 Valor Equity Partners 共同领投，Thrive
              Capital、Altimeter 等参投。六个月后，2025 年 10 月 Series C 融资 $1B，由 Addition 领投，投前估值 $3B、投后估值 $4B；新投资方包括
              CapitalG、Ribbit、Spark、BOND 和 Lowercarbon，原有投资方全员回归。当前披露融资总额约
              $1.3B。公司尚未披露项目融资或债务额度；但这种重资产电池集群模型在结构上适合类似太阳能租赁证券化的资产支持融资，一旦接入，可显著拉长资金续航。


              资本投放速度很高。按 2025 年末每月 20 MW 的节奏——25 kWh 档约每月 800 块电池——以及每台 $7,000 净成本计算，Base Power 仅硬件就在运营费用前每月消耗约
              $5M–$8M。拿到新一轮 $1B Series C 资金、而 2025 年收入估算仅 $12M 之后，即便部署目标激进，公司仍有可观资金续航，但还不能自我供血。Series C
              资金的主要已披露用途包括：Texas 以外全国扩张、建设 Factory One（前 Austin American-Statesman 地块）、规划第二座工厂，以及扩大 Gen 3 电池生产。Austin
              Energy 容量托管协议（$4.08M/年）和 CoServ 伙伴关系（Denton County 100 MW）提供部分收入可见度，但相对已投资本仍只占很小一部分。


              当前融资架构仍是纯股权，因此资本结构的首要风险是稀释，而不是债务契约或再融资触发条款。不过，模型长期可扩展性取决于三条路之一：（a）现有 Texas
              电池集群实现现金流盈亏平衡；（b）接入项目融资或证券化资本，把电池集群增长转移到表外融资；或（c）继续以有利估值融资。选项（c）依赖公司守住 $4B 投后估值轨迹，这要求 2026 年 $70M
              收入目标兑现，且毛利率显著改善。
