  - id: FV001
    title: 投资建议逻辑流
    type: flow
    layout: standard
    summary: 从证据支柱到有条件正面建议的决策链，串联市场、产品、单位经济和估值输入。
    data:
      nodes:
        - id: n1
          label: 部署速度（强）
          description: 截至 2026 年 5 月，10,000+ 户住宅、100+ MWh；到 2025 年末接近零流失；2025 年末运行速度约 20 MW/月
        - id: n2
          label: 电网服务收入（反向）
          description: 2025 年 ERCOT 电池收入下降 90%，至约 $29/kW；结构性饱和很可能持续到 2026 年
        - id: n3
          label: 垂直整合模式（有潜力）
          description: 自有并运营电池，同时零售电力；若制造规模化，CapEx 有结构性优势
        - id: n4
          label: 制造执行（未验证）
          description: 城市激励协议于 2026 年 3 月告吹；Gen 3 工厂无已确认租约；本土成本曲线未验证
        - id: n5
          label: 全国扩张（未证明）
          description: ERCOT 特有的放松管制；未确认非德州市场上线；PJM/NY 监管复杂度高
        - id: n6
          label: 估值信号（偏贵）
          description: $4B 对应 2025 年收入 $12M（333x）；概率加权 EV 约 $2.2–2.5B，低于当前入场价；基准情形意味着亏损
        - id: n7
          label: 有条件观察名单 / 跟投
          description: 入场估值 ≤$3B、且 2026 年收入获验证并至少上线一个非 ERCOT 市场；若高于 $4B 且无法进入 data room，则放弃
        - id: n8
          label: 必要证据门槛
          description: 经审计的单位经济；股权结构和优先权栈；Gen 3 成本曲线；非 ERCOT 市场计划
      edges:
        - from: n1
          to: n7
          label: 支撑
        - from: n2
          to: n6
          label: 施压
        - from: n3
          to: n7
          label: 有条件支撑
        - from: n4
          to: n6
          label: 引发疑问
        - from: n5
          to: n6
          label: 限制牛市情形
        - from: n6
          to: n7
          label: 约束入场价
        - from: n8
          to: n7
          label: 决定入场门槛
    claimRefs:
      - CV007
      - CV008
      - CV014
      - CV015
      - CV017
      - CV018
      - CV033
  - id: FV002
    title: 估值对收入倍数和 2026 年收入的敏感性
    type: bar
    layout: standard
    summary: 在不同 2026 年收入情景和退出倍数假设下推导 Base Power 估值，并以 $4B Series C 轮估值为锚。
