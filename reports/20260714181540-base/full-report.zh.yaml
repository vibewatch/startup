  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 全量客户队列的单位经济性
        - 在当前（非峰值）市场费率下，经审计的每块电池每 kW ERCOT 收入、每客户月度零售利润，以及每已部署 MWh 的混合全口径成本
        - 当前公开估算（Sacra、GreenCarFuture）差异很大；8.5 年与 3.5 年的回本区间让估值完全无法确定
        - 申请数据室访问；用 ERCOT 结算数据和公用事业账单记录交叉核对
      - - 股权结构表和优先权结构
        - Series C 后完整股权结构表，包括优先股类别、清算优先权倍数（1x 与 2x）、参与权和反稀释条款
        - $4B 入场且有 $1.3B 优先股存量时，普通股现金瀑布在结构上居后；没有这些条款就无法分析回报
        - 法律审查 COI 和投资人权利协议；Wilson Sonsini 参与了所有轮次
      - - Gen 3 制造计划
        - 已签署的设施租约或建设合同、设备采购时间表、目标产能（MWh/year），以及到 2027 年的单台成本曲线
        - 整个乐观情景和降本逻辑都靠它支撑；城市激励流产且截至 May 2026 仍无确认工厂，是重大反向信号
        - 实地走访；独立制造顾问评审；TDLR 注册数据
      - - 全国扩张监管地图
        - 至少两个非 ERCOT 零售可选择州的市场进入计划，包括监管要求、并网规则和公用事业合作状态
        - ERCOT 放开有其特殊性；PJM、ComEd 和 NY 市场规则差异很大，可能需要不同模式或更长获客周期
        - 目标州监管顾问；市场进入可行性研究
      - - 队列留存曲线
        - 按地域、安装队列和客户细分（新建与既有住宅改造）拆分的客户级流失和留存数据
        - 单一上报客户流失（August 2025）不足以做统计评估；全国扩张后，队列留存会成为 LTV 的核心指标
        - 数据室中的 CRM 和账单数据；对跨队列的 50+ 名客户做独立调研
      - - 竞争响应准备度
        - 对 Tesla Powerwall+、Sunrun Battery，以及潜在公用事业赞助电池租赁计划的防御力证据
        - $4B 市值下，任何大型竞争者进入 Texas 住宅电池即服务市场，都会立即带来价格压力
        - 竞争情报报告；围绕切换成本和 NPS 做客户访谈
    notes: 高于 $50M 的任何投资都必须先完成全部尽调问题。第 1 和第 2 项（单位经济性和股权结构表）是门槛项——无论轮次估值如何，缺少它们就不应投资。
