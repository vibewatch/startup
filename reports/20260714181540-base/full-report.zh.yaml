      - number: '5.2'
        title: 安装流程与部署运营
        blocks:
          - type: paragraph
            body: >
              Base Power 的部署运营被组织成一套 “Deployment Factory”——可重复、内部化的流程，按单个
              AHJ（主管辖权机构）辖区协调许可、物流、排期和电气安装。流程从虚拟现场勘察开始，评估配电盘配置、可用户外空间和 HVAC 负载；多个主配电盘或配置异常的房屋可能被拒。合格房屋由 Base
              内部电工团队排期安装；截至 2025 年 10 月，该团队每天完成约 20 套系统，是 2025 年 3 月速度的两倍。公司披露的部署速度是已进入都会区每年 1–2% 的独栋住宅；按每次部署平均 20 kW
              计算，在拥有 500,000+ 独栋住宅的市场（规模类似 Denver、Charlotte 或 San Diego），Base 理论上一年内可达到 100 MW 容量。这比传统公用事业级并网时间线快 10 倍。

              对于 Lennar 等住宅开发商渠道伙伴，Base 将电池安装直接嵌入建房流程，让电池从第一天起就是住宅电气系统的一部分——消除了标准渠道面临的改造许可摩擦。截至 2025 年 4 月，Base 在停电风险较高的
              Texas 市场服务约 20 个 Lennar 社区。协议期内，服务和维护由 Base Power 负责；房主不能控制电池，也不能把第三方电池或储能系统（如 Tesla Powerwall、Enphase IQ
              Battery）接入受管电池集群。

              2026 年 3 月签署的 CoServ 100 MW 项目是 Base 迄今最大项目，代表约 5,000 次部署，平均每户两块电池（50 kWh）。El Paso Electric DESPP 试点（2026
              年 2 月）采用“表前（front-of-meter）”拓扑：Base 电池接在电表的公用事业侧，而不是表后，让 EPE 能在峰值需求期间直接服务住宅和电网；这与 Base 标准表后模式有结构性差异。
