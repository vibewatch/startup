  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论与反论
        blocks:
          - type: paragraph
            body: >
              Base Power 的投资正论建立在四个结构性支柱上。第一，公司展示了 ERCOT 历史上最快的户用电池部署速度：到 2026 年 5 月已覆盖 10,000+ 户、100+ MWh，并报告截至 2025
              年底流失率接近零。在资本密集型硬件业务中，这样的执行速度很少见，也验证了运营模型。第二，垂直整合的发售电一体结构——制造、安装、持有并运营电池，同时担任零售电力供应商——相对公用事业级 BESS 形成结构性
              CapEx 优势。CEO Zach Dell 曾说明，去掉土地、并网排队等待和传统项目开发开销后，Base 可在每 kWh 部署成本上低于公用事业级项目。第三，Base 已取得 ERCOT Aggregated
              Distributed Energy
              Resource（ADER）项目资格，分布式资产可向批发市场投标容量，在零售利润之上增加一层经政策支持的经常性收入。第四，投资人联盟——Addition（领投）、a16z、Lightspeed、CapitalG（Google）、Thrive
              Capital、Ribbit、Valor、Altimeter、Spark、BOND、Lowercarbon——是美国能源创业公司中少见的高可信多行业组合，意味着尽调能力强，后续支持意愿也高。

              反论同样具体。按 $4B 投后估值、2025 年收入 $12M 计算，收入倍数为 333×；按 2026 年预计收入 $70M 计算，也有 57×。除了未来收入达到 10–20×
              的少数情形，几乎所有场景都意味着入场即亏。ERCOT 电网服务市场——主要可扩展收入层——两年内崩跌 90%（平均电池收入：2023 年 $149/kW，2025 年按 Modo Energy 为
              $29/kW，背后是 BESS 装机容量激增 70×）。Base Power Gen 1 系统净成本约 $17,500，在当前市场条件下每年总收入约 $2,053，回本期为 8.5 年，且还未计融资成本。2026
              年 3 月，City of Austin 与公司共同撤回 $265M 制造激励，为支撑 Gen 3 降本假设的本土电池工厂增加了执行不确定性。最后，全国扩张计划依赖复制 ERCOT
              的放开零售选择市场结构，而美国只有少数几个州具备这种结构；受监管的公用事业市场需要一套根本不同且尚未验证的市场进入打法。

              综合看，建议是有条件观察名单 / 共同投资姿态：模型有差异化，团队也非常强，但当前入场价格默认公司要在多个未验证维度上同时执行成功。若投资人能以 ≤$3B 估值入场，并验证 2026 年 $70M
              收入，且看到至少一个 Texas 以外市场成功启动的证据，风险回报才更站得住。按当前 $4B 轮次标记入场，只适合长周期、高信念的能源基础设施投资人；他们应把它当作平台型赌注，而不是近期回报交易。
