      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >
              Base Power 自 2023 年成立以来，已在三轮披露融资中累计募集约 $1.3B。种子轮 / Series A 阶段提供了初始营运资本； 具体细节未公开披露。公司首个大型披露轮次为 $200M
              Series B，于 2025 年 4 月完成，主要参与方包括 Thrive Capital、 Valor Equity Partners、Andreessen Horowitz（a16z）、Lightspeed
              Venture Partners、Altimeter Capital 和 Trust Ventures。 住宅开发商 Lennar 也在这一阶段投资。

              六个月后，2025 年 10 月，Base Power 宣布完成由 New York 机构 Addition 领投的 $1B Series C。跟投老股东包括 Andreessen Horowitz、
              Lightspeed、Thrive Capital、Valor Equity Partners 和 Altimeter。新投资人包括 CapitalG（Google 的独立成长基金）、 Ribbit
              Capital、Lowercarbon Capital、Elad Gil、Spark Capital、BOND、StepStone Group、137 Ventures 和 Salesforce
              Ventures。 The New York Times 报道称，该轮对公司的投前估值为 $3B；投后估值约 $4B。Dallas Innovates 称该 Series C 是「当年最大的 Series C
              融资之一」。

              累计融资约 $1.3B。资金将投向 Austin 工厂的本土电池制造、团队扩张，以及德州之外逐州扩张。二级交易或可转债安排均未公开披露； 这些仍是尽调缺口。
