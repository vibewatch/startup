      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: ERCOT 收入饱和是当前倍数的生存级威胁
            body: >
              本章最重要的不利信号，并不是 Base Power 的执行——其执行确实亮眼——而是 ERCOT 电网服务收入的结构性崩塌。年均 BESS 收入从 2023 年的 $149/kW 降至 2025 年的
              $29/kW（Modo Energy），降幅 80%，背后是装机容量增长 70×。按 $29/kW 计算，一块 25 kWh Base Power 电池每年仅赚约 $73
              电网服务收入，远低于维持盈利单元经济所需的零售利润和租赁费，回本期也会很长。除非 RTC+B 改革显著提高每 kW 补偿，或 Base 真正取得零售利润率优势，否则核心收入多元化假设目前承压严重。任何按 $4B
              入场的投资人，都必须拿出具体且有证据的观点，说明电网服务收入如何回升至 $50/kW 以上，风险才算化解。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV031
              - CV033
              - CV037
              - CV038
          - type: callout
            title: $4B 价格是平台期权溢价，不是收入倍数
            body: >
              Base Power 的 $4B
              估值，无法用传统收入倍数在任何合理可比折现率下解释。更准确的理解是：市场把公司定价为一个期权——它可能成为美国放开管制市场中占主导地位的户用电池与电力平台——类似在基础设施网络尚未形成规模前给它定价。这并非天然非理性：Sunrun
              在太阳能持有资产建成前也曾被类似定价。但这要求投资人明确给期权定价，为全国规模结果分配现实概率，并接受当前证据质量下的基准情景会在当前入场价格亏损。领投或共同领投四轮融资的五家顶级
              VC，并非看错了潜力；但他们可能已把潜力定满。
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV016
              - CV020
              - CV021
          - type: callout
            title: 任何资本承诺前的尽调关口
            body: >
              若没有以下材料，不应承诺超过 $5M 资本：(1) 数据室访问权，确认截至 2026 年 Q3 的 2026 年收入轨迹达到或超过 $50M；(2) 四轮融资的完整股权结构表和优先权栈文件；(3) 独立 Gen
              3 制造评估。只有入场价格在 $2.5B 或以下，基准情景才会产生正向期望回报。若没有上述三项数据，$3B 以上入场就是投机。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
