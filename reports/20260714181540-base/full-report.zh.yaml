      - number: '8.4'
        title: 牛 / 基准 / 熊情景分析
        blocks:
          - type: paragraph
            body: >
              情景框架以 2027 年收入为主要估值驱动，并用上市和私有可比组校准退出倍数。概率权重为：牛市 20%、基准 45%、熊市 35%。考虑执行依赖多、ERCOT 电网服务经济性有结构性逆风，权重向基准 /
              熊市倾斜。

              牛市情景下，Base Power 2027 年收入达到 $250M，靠的是进入三个额外放开管制市场（如 PJM/Pennsylvania、Illinois、New York），以 $5,000 净成本部署 Gen
              3 电池（较 Gen 1 降低 40%），并在 2025 年 12 月 RTC+B 项目创造新优化机会后，将 ERCOT 电网服务收入维持在 $50/kW/year 以上。按 20–25×
              未来收入，隐含退出估值为 $5–6.25B。对 Series C 投资人而言，这只是温和正回报（相对 $4B 投后为
              1.25–1.56×），说明即便牛市情景，在当前入场价格下也不能给后期投资人带来风险投资级回报。

              基准情景下，Base Power 2027 年收入达到 $100–130M，主要来自 Texas 扩张加一个新市场；Gen 3 电池以 $7,000–8,000 净成本部署，制造端逐步改善；ERCOT
              电网服务收入稳定在 $35–45/kW/year（与 Modo Energy 和 GreenCarFuture 预测一致）。按 15–20× 未来收入，隐含退出估值为 $1.5–2.6B，低于当前 $4B
              Series C 标记。这确认了一个事实：若没有规模或战略收购方溢价推动的显著倍数重估，当前价位无法被基准情景支撑。

              熊市情景下，ERCOT 电池收入进一步降至 $15–20/kW/year，原因是 RTC+B 项目未能明显抵消持续容量饱和；Gen 3 工厂延期；全国扩张又受非 ERCOT 市场监管复杂性限制。2027
              年收入停在 $30–50M，Base 进行降价轮融资或陷入运营压力。若以 $40M 收入基数、10× 未来收入计，隐含估值为 $400M，相对当前入场价格亏损 90%。

              跨情景的概率加权期望价值约为 $2.2–2.5B，明显低于当前 $4B 入场价格。这确认了根本投资张力：Base Power 确实是有创新性的真正平台，但 $4B
              入场价格已经打包进未来五到七年的执行成果，而这些成果尚未在全国规模上证明。
            claimRefs:
