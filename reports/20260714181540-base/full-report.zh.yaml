    title: 住宅 VPP / 储能市场规模金字塔（TAM / SAM / SOM）
    type: pyramid
    layout: standard
    summary: 三层市场金字塔展示从全球 VPP 市场 TAM，到美国住宅储能 SAM，再到基于公司披露渗透率和定价估算的 Base Power ERCOT SOM。
    data:
