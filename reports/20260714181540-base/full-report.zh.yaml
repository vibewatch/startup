      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 高波动市场中的快速规模化
            body: >
              Base Power 在首次部署后约 18 个月内，部署了 >100 MWh 住宅电池容量，取得 ERCOT ADER 批发项目资格，并在 2026 年 3 月前拿下五个德州公用事业合作。
              执行速度——由住宅许可捷径和 Lennar 住宅开发商渠道推动——构成分布式储能中的持久先发优势。
            calloutType: strength
