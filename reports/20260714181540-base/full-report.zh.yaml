              六项公用事业伙伴关系（Bandera、GVEC、Farmers、CoServ、EPE、Austin
              Energy）触达不能更换电力供应商的合作社和市政公用事业成员——扩大了可触达客户基数，但也拿掉了零售电力价差和批发套利收入流，而这些正是发售一体化模式的核心。这些伙伴关系对容量部署和品牌验证有战略价值，但单客经济性可能显著低于直接零售渠道。
