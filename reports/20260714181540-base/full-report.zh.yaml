      - number: '7.2'
        title: 财务、资本与收入风险
        blocks:
          - type: paragraph
            body: >-
              ERCOT 电池经济性已急剧恶化。ERCOT 年均 BESS 收入从 2023 年的 $149/kW 降至 2025 年估计 $17/kW，约下滑 90%。核心原因是辅助服务市场饱和：装机容量从 2023 年中约
              3.3 GW 增至 2026 年初超过 14 GW。同期，辅助服务占 BESS 总收入的比例从 84% 降至 48%。多数大型 BESS 运营商 2025 年年初至今盈利能力低于 2.2%。这些变化直接挤压
              Base Power 低于市场价客户定价所依赖的批发套利收入。

              Base Power 的商业模式在批发电价上形成结构性空头：客户签 3 年合约，按约 $0.085/kWh 加输配电费支付固定电价；Base Power 则必须持续管理固定电价与 ERCOT
              实际市场成本之间的价差，并用电网交易收入补充。若批发电价飙升——这在 ERCOT 的 energy-only 市场并不少见——且电网交易收入不足以抵消，亏损由 Base Power 承担。反过来，若批发电价跌破
              Base Power 成本结构，固定客户电价又没有相应重定价机制，利润率会直接蒸发。

              租赁模式（硬件由 Base Power 持有并部署在客户家中）要求持续投入资本：每新增一次安装，都是一笔资本承诺，必须靠资产全生命周期的未来收入收回。2025 年 10 月完成的 $1 billion
              Series C（投前估值 $3 billion）以及 2023 年以来累计融资 $1.3 billion，确实提供了可观资金余量；但 Base Power 全国扩张时，资本密集度会叠加放大。2025
              年上半年，储能公司企业融资同比下降 41%，预示未来融资轮可能面对更苛刻条件。

              不同于 CAISO 或 PJM，ERCOT 的 energy-only 市场没有容量补偿或长期资源充足性合同。因此，ERCOT 电池运营商无法用签约容量收入平滑收入，Base Power
              的经济性几乎完全取决于市场波动和稀缺事件，而这些事件受天气影响且不可预测。Ascend Analytics（2025 年 5 月）预计，负荷增长快于供给建设后，ERCOT 到 2027
              年都将走在「受天气左右的刀刃边缘」上，年份之间有繁荣也有低谷。RTC+B 于 2025 年 12 月实施后，alpha 来源也从结构性市场设计缝隙转向系统基本面的稀缺性，回报会进一步向能力更强的运营商集中。

              监管成本敞口进一步放大财务风险：并网补贴超支、PUCT 信用证要求、NERC 合规审计成本，以及潜在 ERCOT 不合规罚款，都是随资产规模上升而增加的持续固定成本。
