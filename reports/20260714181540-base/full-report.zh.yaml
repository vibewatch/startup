          - type: callout
            title: 电池放电条款削弱备用电源价值主张
            body: >
              Base Power 合同允许公司在高峰需求期将客户电池放电至 20% 电量，以向电网售电——这正是电网最可能停电的条件。DFW 一名独立电工的审阅将其称为「大多数人漏看的那件事」，并建议如要真正全屋保护，应将
              Base 与补充发电机搭配。商业 VPP 用途和客户备用电源预期之间的结构性张力，会带来声誉和流失风险，尤其是在一次高关注停电事件之后。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: 单位经济性依赖波动的 ERCOT 套利
            body: >
              第三方分析估计，按当前定价，每套 25 kWh 设备的简单回本期为八到九年，盈利取决于 ERCOT 批发电价波动能否持续。
              随着更多储能资产进入市场，套利价差可能压缩。此外，过去依赖中国制造电池带来关税暴露；Austin 工厂尚不具备完全替代能力。
            calloutType: risk
            claimRefs:
