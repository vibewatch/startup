  - id: differentiation-risks
    title: Technology Differentiation and Product Risks
    body: >
      Base Power's differentiation rests on four compounding factors that are difficult to replicate
      individually and nearly impossible to replicate simultaneously: (1) vertically integrated
      hardware design, giving Base control over both cost and roadmap without dependency on a third-
      party battery product brand; (2) proprietary BaseOS software stack spanning firmware to cloud
      to SCADA, enabling utility-grade dispatch at residential scale; (3) a purpose-built deployment
      operations engine (permitting, logistics, installation) that scales to hundreds of systems per
      week; and (4) a novel gentailer business model in which Base acts as both generator (ADER
      aggregator) and retail electricity provider, capturing revenue from grid services, energy
      arbitrage, and customer subscriptions simultaneously.

      The 80/20 utility-dispatch/homeowner-reserve split is the product's most significant tension.
      Base Power is contractually permitted to drain the battery to 20% state of charge to fulfill
      grid trading obligations. When a grid outage occurs immediately following a peak-pricing
      dispatch event, homeowners may have substantially less than full backup capacity available. This
      is a structural feature, not a bug, of the business model; CleanTechnica and independent
      electrical contractors (Epic Electrical) have raised it publicly as a risk customers underestimate.
      For homeowners seeking guaranteed whole-home backup through extended multi-day outages, the 20%
      floor combined with a worst-case heavy-HVAC load scenario reduces single-battery backup to
      under one hour.

      Battery cells are currently imported from China, creating tariff exposure. The Austin factory
      begins manufacturing modules, packs, and power electronics in Q1 2026, but cells remain a China-
      sourced input until Base secures a domestic or non-China cell supplier. The ERCOT ADER pilot cap
      of 80 MW (proposed expansion to 160 MW) remains a regulatory ceiling on Base's grid-services
      revenue in ERCOT; the cap's resolution, including nodal dispatch rules and settlement framework,
      remains under internal ERCOT review as of May 2026. Geographic expansion beyond Texas requires
      either deregulated markets (for the full gentailer model) or utility partnerships (for the
      regulated-utility battery-as-a-service model); Base's FAQ mentions ComEd billing in Illinois,
      suggesting an early-stage expansion is underway.
