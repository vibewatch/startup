  - id: installation-deployment
    title: Installation Workflow and Deployment Operations
    body: >
      Base Power's deployment operation is structured as a "Deployment Factory" — a repeatable,
      in-house process that coordinates permitting, logistics, scheduling, and electrical installation
      for individual AHJ (authority having jurisdiction) territories. The workflow begins with a
      virtual site survey to assess panel configuration, available outdoor space, and HVAC load;
      properties with multiple main panels or unusual setups may be declined. Qualified homes are
      scheduled for installation by Base's in-house electrical teams, which as of October 2025 were
      completing approximately 20 systems per day — double the March 2025 rate. The company's stated
      deployment velocity is 1–2% of single-family homes per year in a launched metro area; with an
      average of 20 kW per deployment, Base can theoretically reach 100 MW of capacity in markets
      with 500,000+ single-family homes (comparable in size to Denver, Charlotte, or San Diego) within
      a year. This is 10x faster than traditional utility-scale interconnection timelines.

      For homebuilder channel partners such as Lennar, Base integrates battery installation directly
      into the home construction process, allowing the battery to be part of the home's electrical
      system from day one — eliminating the retrofit permitting friction that affects the standard
      channel. As of April 2025, Base was serving approximately 20 Lennar communities across outage-
      prone Texas markets. Service and maintenance are handled by Base Power throughout the agreement
      term; homeowners cannot control the battery and cannot integrate third-party battery or storage
      systems (e.g., Tesla Powerwall, Enphase IQ Battery) into the managed fleet.

      The CoServ 100 MW program signed in March 2026 — Base's largest to date — represents ~5,000
      deployments averaging two batteries (50 kWh) each. The El Paso Electric DESPP pilot (February
      2026) uses a "front-of-meter" topology in which Base batteries connect on the utility side of the
      meter rather than behind it, giving EPE the ability to serve both the home and the grid directly
      during peak demand; this is structurally distinct from Base's standard behind-the-meter model.
