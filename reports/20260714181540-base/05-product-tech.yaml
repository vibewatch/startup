company:
  name: Base Power

chapter:
  number: 5
  title: Product & Technology
  summary: >
    Base Power's Gen 1 residential battery system — an LFP-chemistry, 11.4 kW / 25 kWh unit paired
    in configurations up to 50 kWh — delivers sub-half-second outage switchover, whole-home backup,
    and real-time ERCOT grid dispatch under a proprietary SCADA stack called BaseOS. The company's
    vertically integrated deployment model (hardware, firmware, installation logistics, energy trading)
    enables 100 MWh deployments in 3–6 months versus 3–6 years for traditional infrastructure. The
    battery carries UL 1973, UL 1741, UL 9540, and UL 9540A certifications, and Base qualified for
    Texas's ADER program. The 80/20 utility-dispatch / homeowner-reserve split is the core product
    tension — backup capacity is not guaranteed full — and sourcing battery cells from China creates
    tariff exposure that domestic manufacturing at the Austin factory only partially hedges.

sections:
  - id: hardware-product-portfolio
    title: Battery Hardware and Product Portfolio
    body: >
      Base Power's Gen 1 residential battery is an LFP (lithium iron phosphate) unit rated at 11.4 kW
      continuous output and 25 kWh gross capacity (22.5 kWh usable). Two units can be installed in
      parallel for a 22.8 kW / 50 kWh (44 kWh usable) configuration. LFP was deliberately chosen
      over NMC or NCA chemistry: it handles the high daily cycle count inherent in the gentailer
      business model — charging from cheap overnight grid power and discharging at peak prices — far
      better than competing chemistries. The systems are ground-mounted in a self-contained outdoor
      enclosure; operating range is 14°F to 122°F, noise is ≤40 dB (equivalent to a household
      refrigerator), and switchover during a grid outage is documented at under 0.5 seconds — fast
      enough that most homeowners do not notice the event. The units handle up to 88–100 locked rotor
      amps (LRA), covering the majority of residential HVAC systems without modification; a soft-start
      kit is available for larger units. Designed lifespan is 15 years.

      Base markets three customer-facing offerings: (1) Backup + Energy — the company's flagship plan
      combining battery installation with Base as the retail electricity provider; (2) Backup Only —
      battery backup with the homeowner retaining their current utility relationship, available in
      select areas; and (3) Base Energy — a battery-free, VPP-backed retail electricity plan launched
      in April 2026 across all major Texas TDU territories (Oncor, CenterPoint, AEP Central, AEP
      North, TNMP), open to apartment and condo residents who cannot host hardware. Battery systems
      are owned by Base Power, not the homeowner; the services agreement runs 10 years with a $500
      de-installation fee that is waived after five years or if Base raises rates above market. The
      company is building its first in-house manufacturing facility at the 90,000-square-foot former
      Austin American-Statesman site and targets manufacturing ramp to 4 GWh/year; cells are currently
      sourced from China, creating tariff exposure that the domestic factory partially offsets only for
      modules, packs, and power electronics.
