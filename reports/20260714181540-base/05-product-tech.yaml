  - id: safety-compliance-reliability
    title: Trust, Safety, Compliance, and Reliability
    body: >
      Base Power's Gen 1 battery system has completed a full UL certification stack: UL 1973
      (battery module safety for stationary applications), UL 1741 (inverter and interconnection
      equipment safety for distributed energy resources), UL 9540 (system-level energy storage
      safety as an integrated assembly), and UL 9540A (thermal runaway fire propagation test
      evidence). This four-standard package meets the primary requirements for AHJ acceptance,
      utility interconnection, and homeowner insurance in North American markets. Local installation
      permits follow NEC (National Electrical Code) rules administered by individual AHJs; Base's
      Deployment Factory software streamlines this permitting process across jurisdictions.

      Base Power's operational reliability metrics are company-claimed and have not been independently
      audited: <5% forced outage rate (including connectivity and hardware), sub-second outage
      switchover, and MW delivery within 1% of commanded power. The company states its systems protect
      against 97% of common grid outages — a figure derived from the observation that, even at the
      minimum 20% state of charge the battery can be drawn down to, 3 hours of backup is available,
      which covers 97% of outage durations. This figure assumes moderate household load; heavy HVAC
      use in Texas summer can exhaust a single 25 kWh battery in 3–4 hours.

      The cybersecurity attack surface on Base's fleet is non-trivial: thousands of internet-connected
      battery systems, each controllable via API, represent a potential aggregated grid disruption
      vector. NFPA 855 and NEC installation standards apply at the installation level. UL 2900 series
      and IEC 62443 standards are relevant for the connectivity stack but are not specifically mentioned
      in Base's public disclosures. No regulatory or enforcement actions, recall notices, or safety
      incidents have been found in public records as of May 2026.
