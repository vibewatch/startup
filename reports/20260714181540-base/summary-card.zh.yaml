summary:
  headline: Base Power 用住宅电池叠加售电的模式做出差异化，在 Texas 已有早期真实牵引；但最新 $4B 估值已经计入 ERCOT 经济性可持续和跨州复制成功，公开证据尚未证明这些前提。
