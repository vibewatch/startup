  topStrengths:
    - Base Power 扩张很快，到 2026 年中已触达 20,000+ 户家庭，部署住宅电池容量超过 100+ MWh，并开出第一个 Illinois 市场。
    - 公司把硬件、电力零售和 ERCOT 电网服务参与打包成垂直一体化模型，单层竞争者很难直接复制。
    - 一线投资人组合，以及与 Lennar 和多家 Texas 公用事业公司的渠道合作，验证了强劲早期市场入口。
  topRisks:
    - $4B 估值相对公开储能和 DER 可比公司隐含极高收入倍数，留给执行失误的空间很小。
    - 随着储能容量饱和，ERCOT 电池市场收入已大幅压缩，直接威胁 Base Power 单位经济里的电网服务层。
    - 备电承诺可能与 Base Power 为电网交易放电的权利冲突，在停电事件中带来声誉和留存风险。
    - 2026 年 6 月 Illinois 启动太新，尚不能证明 Base 能在 ERCOT 之外复刻 Texas 模型，或在其他售电制度下维持类似经济性。
  unresolvedGaps:
    - 经审计收入、毛利率和单客户单位经济尚未公开披露。
    - cap table 稀释、清算优先权和当前二级市场隐含估值还不够透明，无法支撑后期入场承销。
    - 已验证员工数、董事会构成和正式治理 / 控制权披露仍不完整。
    - Illinois 启动经济性、获客成本和留存都太新，尚无法显示 Base 能否在第二个市场复制 Texas 式结果。
