      topic: unit-economics-and-cost-structure
      missingEvidence: >-
        Hardware bill-of-materials (BOM) cost per robot, deployment and integration costs, ongoing support and field
        engineering expense, and gross margin profiles by revenue stream.
      whyItMatters: >-
        Industrial robotics profitability depends on whether hardware gross margins can absorb deployment variability and
        whether software subscription margins materialize.
      diligencePath: >-
        Review bill of materials breakdowns, pilot deployment service hour logs, and warranty/maintenance cost models in
        confidential data room.
