callouts:
  - calloutType: risk
    title: Revenue Visibility Obscured by Captive Customer Structure
    body: >-
      Mind Robotics generates no verifiable public customer revenue outside of its strategic co-development partnership
      with Rivian. While Rivian provides unmatched real-world factory data and an immediate deployment environment,
      commercial viability depends on whether Mind Robotics can monetize outside auto OEMs at market rates without parent
      subsidies.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI011
  - calloutType: insight
    title: Capital War Chest Defers Near-Term Financing Pressure
    body: >-
      With over $1.015 billion raised within its initial operating year, Mind Robotics possesses one of the deepest
      capital cushions in early-stage robotics. This substantial funding allows the company to absorb heavy compute and
      hardware industrialization burn while executive leadership scales factory deployments ahead of commercialization.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI010
