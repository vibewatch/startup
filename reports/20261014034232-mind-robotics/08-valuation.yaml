- id: exit-readiness-and-diligence-path
  title: Exit Horizons, Diligence Asks & Thesis-Break Triggers
  body: 'Mind Robotics is in the earliest phase of its commercial lifecycle and remains years away from public market exit
    readiness or liquidity. An eventual exit via initial public offering or strategic acquisition will require sustained proof
    of multi-customer diversification, defensible recurring software margins, and positive unit economics across deployed
    robotic workcells. Prospective investors evaluating secondary share transactions or future growth rounds must condition
    investment upon rigorous confirmatory diligence. Crucial diligence requests include: first, telemetry and shift-level
    reliability data demonstrating robot uptime, grasping error rates, and cycle times at Rivian''s Normal plant; second,
    an unredacted review of commercial agreements governing Rivian''s intellectual property licensing, data ownership rights,
    and preferential procurement pricing; and third, direct access to commercial pilot roadmaps involving third-party industrial
    manufacturers. Furthermore, institutional underwriting must establish unambiguous thesis-break triggers. Explicit negative
    triggers that would force an immediate avoid recommendation include: any evidence that Rivian is curbing procurement or
    funding commitments due to its own ongoing financial losses; an inability to deploy robots into active production shifts
    by late 2027; or public disclosure of onerous senior liquidation preferences that subordinate common and junior equity
    tranches.'
  claimRefs:
  - CV004
  - CV006
  - CV007
  - CV008
  - CV014
  - CV015
