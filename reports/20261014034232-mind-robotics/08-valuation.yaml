- calloutType: risk
  title: Captive-Customer Overhang and Transferability Risk
  body: Because Rivian serves simultaneously as founder, key shareholder, initial customer, and primary training environment,
    Mind Robotics faces substantial transferability risk when validating whether its physical-AI robotics platform can operate
    in disparate manufacturing environments with varied tolerances and IT architectures.
