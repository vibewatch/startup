- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Investment Dimension
  - Thesis (Bull Argument)
  - Anti-Thesis (Bear Argument)
  - What Would Change the View
  rows:
  - - Technology & Form Factor
    - Task-specific purpose-built hardware avoids humanoid locomotion liabilities, focusing computation and mechanical design
      directly on dexterous assembly
    - Lack of public demos leaves real-world grasping accuracy, cycle time, and line-speed adaptability unverified by third
      parties
    - Independent technical benchmarks or third-party audit of robot cycle times in high-volume production shifts
  - - Data & Training Access
    - Continuous access to Rivian's high-volume EV assembly line in Normal, IL provides rich multimodal physical data flywheel
      unavailable to lab-bound peers
    - Data captured exclusively on Rivian vehicle architectures may overfit to specific tooling, parts, and tolerances
    - Demonstrated robot deployment on a non-Rivian assembly line with independent validation of transfer learning speed
  - - Leadership & Industrialization
    - Doug Field brings proven track record scaling hardware from prototype to volume at Tesla and Ford, solving production
      scaling hurdles
    - Field's EV division at Ford suffered multi-billion-dollar losses and Apple Project Titan was shuttered, showing mixed
      post-Tesla outcomes
    - Sustained execution milestones including announcement of multi-plant deployment and customer delivery timelines
  - - Commercial & Customer Independence
    - Rivian launch customer relationship guarantees immediate real-world validation without protracted enterprise sales cycles
    - Captive customer dynamic risks creating a bespoke internal automation tool rather than a scalable enterprise product
      platform
    - Disclosure of binding commercial agreements or paid pilot contracts with outside manufacturing corporations
  notes: Analytical arguments evaluated against primary and independent reporting; triggers define measurable conditions that
    would overturn current stance.
