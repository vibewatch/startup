- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Assumptions & Operating Drivers
  - Implied Valuation / Return Logic
  - Key Downside Risks
  - Probability Signal
  rows:
  - - Bull Case
    - Rapid deployment across Rivian plants; commercial launch to external automakers within 12-18 months; achieves $100M+
      ARR by 2028 with 65%+ hardware/software gross margins
    - Valuation expands to $8B-$12B (2.4x-3.5x return) on physical-AI platform premium comparable to top-tier enterprise AI
      multiples
    - Tech transfer failure; hardware reliability bottlenecks; external customer reluctance to share manufacturing data
    - Low (20%) — Requires unprecedented execution speed and commercial adoption without stumble
  - - Base Case
    - Successful pilot deployment within Rivian Normal plant; modest external customer pilots by late 2027; initial commercial
      revenues emerge slowly under custom integration cycles
    - Valuation holds flat to modest accretion ($3.4B-$5.0B; 1.0x-1.5x return), with extension rounds or flat-round bridge
      financing needed
    - Extended burn rate consuming $1B war chest before non-captive revenue scales; multiple compression in private robotics
    - Moderate (55%) — Reflects realistic timeline for industrial hardware validation and auto procurement lead times
  - - Bear Case
    - Robotics fail to achieve required shift reliability in automotive assembly; Rivian remains sole user; outside automakers
      refuse adoption due to IP or competitive conflicts
    - Down-round restructuring or strategic absorption by Rivian at steep discount ($1.0B-$1.5B; 60%-70% loss from Series
      A-1 mark)
    - Rivian financial distress; cash burn acceleration; senior liquidation preferences wipe out junior equity tranches
    - Elevated (25%) — Material probability given historical mortality and down-round frequency in capital-intensive hardware
  notes: Scenario projections model illustrative return horizons and valuation multiples given unconfirmed commercial baseline
    and $3.4 billion entry mark.
