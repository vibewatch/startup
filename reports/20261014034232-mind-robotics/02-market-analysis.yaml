        - Tactile manipulation, flexible wire harness routing, parts insertion, and variable fastening in automotive and industrial lines.
        - Rigid fixturing, fixed CNC machines, and heavy structural press tooling.
        - VP of Manufacturing / Automotive OEM Operations
        - Manual assembly operators; critical target area where labor shortages constrain throughput.
      - - Material Handling & Mobile Logistics
        - Intra-factory transport, parts kitting, tote staging, and line-side replenishment via wheeled mobile bases.
        - Facility-level automated storage and retrieval systems (ASRS) and overhead gantry cranes.
        - Plant Logistics Director / Operations Budget
        - Automated guided vehicles (AGVs) and manual forklift drivers; adjacent workflow for plant logistics.
      - - Quality Inspection & Dimensional Metrology
        - Real-time visual quality verification, surface anomaly detection, and assembly confirmation during shift cycles.
        - Off-line coordinate measuring machines (CMM) and laboratory destructive testing setups.
        - Quality Assurance Director / Plant Engineering
        - Fixed 2D machine vision systems and manual visual inspection stations; validation layer for assembly.
      - - Heavy Body-in-White Automation
        - Fixed spot-welding stations, structural vehicle frame welding, and high-payload sheet metal stamping.
        - Dexterous physical AI adaptive manipulators and tactile end-effectors.
        - Tooling Engineering / Capital Projects Committee
        - Classical programmable industrial robot arms (ABB, Fanuc, KUKA); outside initial addressable boundary.
