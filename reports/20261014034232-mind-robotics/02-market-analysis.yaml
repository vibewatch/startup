callouts:
  - calloutType: insight
    title: 'The Industrial AI Transition: Task-Specific Foundation Models over Humanoid Form Factors'
    body: Mind Robotics diverges fundamentally from humanoid ventures by focusing on dedicated manipulation form factors tailored to assembly geometries. While bipedal humanoids face unresolved locomotion and high power consumption hurdles on factory floors, task-specific manipulators running physical AI foundation models provide a direct economic path to automating high-value dexterous assembly work.
    claimRefs:
      - CM001
      - CM003
      - CM006
  - calloutType: risk
    title: Single-Customer Data Flywheel and Transferability Bottlenecks
    body: Although Rivian Normal, Illinois vehicle manufacturing facility gives Mind Robotics an enviable real-world training environment from day one, it creates significant captive customer concentration risk. Foundation models trained exclusively on Rivian vehicle tolerances, parts, and cycle times may struggle to generalize to third-party manufacturing environments without costly site-specific retraining.
    claimRefs:
      - CM013
      - CM014
      - CM015
