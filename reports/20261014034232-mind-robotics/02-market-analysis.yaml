        - Chief Executive Officer / Chairman (RJ Scaringe)
        - Rivian Normal, Illinois vehicle assembly workforce
        - Joint Venture / R&D Deployment Capital
        - R1T, R1S, and R2 electric vehicle final assembly lines
        - Strategic mandate to compress EV manufacturing cost structure and generate proprietary AI data
        - Single-customer data overfitting and delayed arm's-length commercial proof
