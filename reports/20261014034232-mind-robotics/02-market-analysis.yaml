        - Executive VP of Global Manufacturing
        - Assembly line technicians and shift supervisors
        - Corporate CapEx Committee & Plant Modernization Budget
        - Final vehicle assembly, trim line fastening, wire harness insertion
        - Rising manufacturing wage rates (up 35% over decade) and chronic assembly line absenteeism
        - High line stoppage risk ($50k+/minute) requiring six-sigma operating reliability
      - - Tier-1 Automotive Component Suppliers
        - VP of Operations / Plant General Manager
        - Cell operators and robotic technicians
        - Plant Operational Capital / Automation Budgets
        - Sub-assembly kitting, bracket fastening, fastener verification
        - OEM contract requirements for zero-defect delivery and faster model line changeover
        - Fixed-price multi-year supply contracts limiting near-term integration risk tolerance
      - - General Industrial & Heavy Equipment Manufacturers
        - Chief Operating Officer / VP Manufacturing
        - Shop floor operators and manufacturing engineers
        - Enterprise Automation CapEx Allocation
        - Variable batch part handling, surface preparation, and structural kitting
        - Severe shortages of skilled manufacturing machinists and robotic programmers
        - High part variance and lower batch volume requiring rapid foundation model adaptation
