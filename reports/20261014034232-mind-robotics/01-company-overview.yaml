company:
  name: Mind Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Mind Robotics is a high-profile industrial physical-AI venture spun out of Rivian by founder RJ Scaringe in late
    2025, reaching a $3.4B valuation across $1.015B in capital within six months before appointing former Tesla and Ford
    EV executive Doug Field as president in October 2026. The startup pairs foundation models with purpose-built
    non-humanoid manipulation hardware inside Rivian production lines, but commercial traction outside its captive
    parent remains wholly unproven with no public customer revenue or pricing disclosure.
sections:
  - id: corporate-identity-and-origin
    title: Corporate Identity, Foundation, and Strategic Charter
    body: >-
      Mind Robotics is a Palo Alto-based industrial robotics company established to develop full-stack physical
      artificial intelligence systems tailored specifically for complex manufacturing environments. The venture was
      initially incubated within Rivian Automotive Inc. under the internal code name Project Synapse before being
      formally spun out as an independent standalone operating entity in November 2025. Dr. RJ Scaringe, the founder and
      chief executive officer of Rivian, established Mind Robotics with the strategic objective of automating intricate
      assembly tasks that classical fixed-motion automation cannot accommodate. Rather than pursuing bipedal humanoid
      robotics, Mind Robotics explicitly rejects human biomechanical replication in favor of task-specific robotic form
      factors optimized for tactile dexterity, force modulation, and line-speed execution. Mind operates its primary
      engineering headquarters in Palo Alto, California, while leveraging Rivian assembly operations in Normal,
      Illinois, as an active operational testbed. The corporate structure positions Mind Robotics as a venture distinct
      from Rivian balance sheet liabilities, though Rivian retained significant minority equity ownership and active
      strategic sponsorship. The core value proposition centers on combining proprietary robotics foundation models with
      purpose-built hardware to automate tactile assembly work that has historically remained dependent upon manual
      human labor.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
    figureRefs: []
  - id: executive-leadership-and-governance
    title: Executive Leadership, Key Hires, and Governance Structure
    body: >-
      Mind Robotics is governed by an executive structure designed to bridge frontier machine learning research with
      large-scale industrial manufacturing discipline. Dr. RJ Scaringe serves as Founder, Executive Chairman, and Acting
      Chief Executive Officer, retaining strategic direction and investor coordination across his dual commitments at
      Rivian and Mind Robotics. On October 13, 2026, Mind Robotics announced onstage at TechCrunch Disrupt in San
      Francisco that veteran engineering leader Doug Field had been appointed President, assuming direct executive
      oversight of day-to-day operations, product development, and manufacturing engineering. Field brings rare
      production turnaround experience across prominent hardware programs, having previously served as senior vice
      president of engineering at Tesla overseeing Model 3 production, vice president in Apple Special Projects Group
      directing autonomous vehicle development, and chief EV and digital officer at Ford Motor Company. Governance
      oversight includes institutional investor representation, with Accel partner Sameer Gandhi joining the board of
      directors following the company Series A financing. The leadership model closely mirrors Scaringe secondary
      micromobility spinoff Also Inc., relying on proven operational executives to manage day-to-day engineering and
      factory deployment while Scaringe guides broader capital formation, board priorities, and technology strategy.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
    figureRefs: []
  - id: capitalization-and-investor-syndicate
    title: Capitalization History, Valuation Progression, and Cap Table Dynamics
    body: >-
      Mind Robotics has demonstrated unprecedented fundraising velocity for an early-stage industrial robotics
      enterprise, securing $1.015 billion in cumulative equity capital across three institutional financing rounds
      within six months of incorporation. The company closed an initial $115 million seed financing round led by venture
      capital firm Eclipse in November 2025, with strategic participation from Rivian Automotive. In March 2026, Mind
      Robotics completed a $500 million Series A financing round co-led by venture firms Accel and Andreessen Horowitz,
      valuing the enterprise at a $2.0 billion post-money valuation. Accelerating its balance sheet expansion, the
      company finalized an additional $400 million Series A-1 and Series B financing round in May 2026 led by Kleiner
      Perkins at a post-money valuation of $3.4 billion, drawing follow-on capital from venture arms of Volkswagen and
      Salesforce alongside 16 institutional investors. While this capital cushion insulates Mind Robotics from near-term
      cash burn pressures associated with intensive hardware prototyping and foundation model compute training, public
      corporate disclosures reveal zero verified commercial revenue, annual recurring revenue, or gross margin
      performance as of October 2026. The multibillion-dollar valuation rests entirely upon expectations of industrial
      scale deployment rather than audited financial yields.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO003
    figureRefs: []
  - id: operational-scale-and-deployment-milestones
    title: Operational Footprint, Manufacturing Integration, and Roadmap Horizons
    body: >-
      The core operational differentiator for Mind Robotics is its proprietary data pipeline and direct access to active
      vehicle manufacturing lines at Rivian automotive plant in Normal, Illinois. By deploying multimodal video and
      sensor collection rigs alongside skilled assembly technicians, Mind captures live, high-variability manufacturing
      interactions across active production shifts to train its spatial reasoning and tactile manipulation foundation
      models. The initial manipulation applications target high-precision pick and place routines, component sorting
      under line-speed pressure, bolt and screw fastening with force feedback compensation, and flexible wire harness
      connector seating. Dr. Scaringe disclosed that Mind Robotics expects to unveil its flagship industrial
      manipulation unit, code-named Phil, within twelve months, envisioning thousands of units operating in
      collaborative manufacturing roles across automotive plants. However, rigorous third-party diligence highlights
      that customer diversification beyond Rivian remains completely unexecuted, with no non-Rivian commercial partners,
      active deployments, or verified external pilots announced to date. Mind Robotics operates effectively as a captive
      advanced automation program for Rivian, facing an unproven transition path toward arm-length commercial viability.
    claimRefs:
      - CO015
      - CO004
      - CO014
    tableRefs: []
    figureRefs:
      - FO001
