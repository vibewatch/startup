callouts:
  - calloutType: insight
    title: Strategic Divergence from Humanoid Form Factors
    body: >-
      While market competitors such as Tesla Optimus and Figure AI pursue bipedal humanoid architectures, Mind Robotics
      concentrates on purposeful robotic manipulators designed around assembly geometries. This deliberate
      specialization eliminates the power and mechanical stability challenges of walking robots while prioritizing
      high-dexterity tactile hands.
    claimRefs:
      - CO003
      - CO015
  - calloutType: risk
    title: Captive Customer Dependency and Transferability Risk
    body: >-
      Mind Robotics relies entirely on Rivian manufacturing lines for training data, operational validation, and
      commercial feedback. Without testing across heterogeneous automotive plants, there is substantial technical and
      commercial risk that its physical AI foundation models will overfit to Rivian specific parts, tools, and line
      speeds.
    claimRefs:
      - CO004
      - CO014
