callouts:
  - calloutType: risk
    title: Severe Customer Concentration in Captive Single-Customer Environment
    body: Mind Robotics currently exhibits 100% customer and data concentration in Rivian Automotive. Because Rivian is both an equity shareholder and an entity chaired by RJ Scaringe, earliest performance benchmarks reflect a sympathetic internal deployment rather than an arm-length commercial sale. Outside enterprise buyers will demand proven repeatability in non-Rivian plants before committing major automation budgets.
    claimRefs:
      - CU012
      - CU014
  - calloutType: insight
    title: Live Automotive Assembly Data Flywheel Provides Decisive Technical Lead
    body: Unlike pure-play robotics startups that rely heavily on synthetic simulations or academic manipulation datasets, Mind Robotics captures real-world variance directly from high-volume vehicle production shifts. This live factory training environment creates a self-reinforcing data flywheel that rapidly improves model adaptability on dexterous physical tasks.
    claimRefs:
      - CU002
      - CU004
