    rows:
      - - Automotive OEM (Anchor)
        - VP Manufacturing / Plant Operations / Corporate Capital
        - Chassis sub-assembly, flexible wiring harnesses, fastener installation
        - Active live deployment across Rivian assembly lines
        - Primary data engine and strategic foundation for foundation models
        - Zero arm-length commercial billing terms disclosed
      - - Tier-1 Automotive Suppliers
        - VP Operations / Tooling Directors / Engineering Teams
        - Component kitting, stamping transfer, precision sub-component joining
        - Prospective evaluation pipeline without announced contracts
        - High volume repetition across standard automotive modular architectures
        - Absence of public supplier validation or joint pilots
      - - Electronics & High-Tech
        - Director Automation / Cleanroom Supervisors / Operations VP
        - High-mix small-part sorting, connector mating, board inspection handling
        - Design-target roadmap only without disclosed live pilots
        - High margin density and rapid hardware refresh cycles
        - Unproven tactile precision on miniature flexible parts
      - - Industrial & Logistics
        - Supply Chain VP / Facility General Managers / Capex Committee
        - Bin picking, palletizing, dynamic parcel induction under variable line speed
        - Conceptual interest category without verified site trials
        - Broad addressable market beyond automotive capital cycles
        - Competition from established warehouse automation incumbents
    notes: Primary automotive OEM segment represents the sole active validation environment via Rivian; all other industrial segments remain prospective targets without public contracts.
