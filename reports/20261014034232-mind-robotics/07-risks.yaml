callouts:
- calloutType: risk
  title: 'The Captive Customer Paradox: Accelerated Feedback vs. Generalization Blindness'
  body: 'Mind Robotics derives an undeniable early advantage from its captive partnership with Rivian, gaining access to live
    EV assembly lines that most robotics startups lack. However, this same dependence poses the primary existential risk to
    its commercial thesis: algorithms optimized exclusively for Rivian''s specific tolerances, vehicle architectures, and
    shop-floor workflows may fail to generalize to outside industrial manufacturers.'
  claimRefs:
  - CR001
  - CR002
  - CR010
- calloutType: insight
  title: Operational Leadership as a De-risking Catalyst
  body: 'The recruitment of Doug Field as president directly addresses the historical failure mode of physical AI ventures:
    the chasm between functional laboratory models and shift-durable factory machinery. By placing an executive with extensive
    production turnarounds at Tesla and Ford in command of daily operations, Mind Robotics substantially mitigates executive
    bandwidth concerns stemming from RJ Scaringe''s dual commitments.'
  claimRefs:
  - CR004
  - CR005
  - CR006
