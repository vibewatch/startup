evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements detailing customer revenue, annual recurring revenue (ARR), gross margins, cash burn
      rate, and runway.
    whyItMatters: >-
      Mind Robotics is valued at $3.4B but public disclosures do not confirm any commercial revenue generation outside
      internal Rivian operations.
    diligencePath: Obtain private financial presentations or management accounts through formal secondary investor due diligence.
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Customer contracts, pilot deployment agreements, or ROI studies from manufacturing enterprises independent of
      Rivian.
    whyItMatters: >-
      Current deployments are captive to Rivian; lack of third-party customers leaves foundation model generalization
      and commercial viability unverified.
    diligencePath: >-
      Interview tier-one automotive and industrial manufacturing procurement executives regarding Mind Robotics pilot
      evaluations.
  - type: missing-source
    severity: material
    topic: commercial-pricing-and-unit-economics
    missingEvidence: >-
      Publicly verifiable commercial pricing schedule, robot-as-a-service subscription rates, hardware capital costs,
      and gross margin targets for non-Rivian deployments.
    whyItMatters: >-
      Without public pricing or unit economics, prospective buyers and investors cannot model payback periods, customer
      ROI, or long-term gross margins across diverse industrial manufacturing sectors.
    diligencePath: >-
      Request customer pilot term sheets, commercial pricing decks, and hardware cost-of-goods-sold projections during
      confidential diligence interviews.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: market-sizing-segmentation-transparency
    missingEvidence: >-
      Granular independent bottom-up SAM and SOM market sizing data isolating dexterous automotive assembly manipulation
      spend from broad industrial robotics estimates.
    whyItMatters: >-
      Broad top-down market figures often conflate heavy fixed welding automation with dexterous assembly, obscuring the
      true accessible market size for physical AI foundation models.
    diligencePath: >-
      Commission bespoke industrial engineering workload studies analyzing assembly-line station hours addressable by
      dexterous manipulators vs fixed automation.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-transferability
    missingEvidence: >-
      Audited performance data, pilot agreements, or deployment ROI metrics from automotive or industrial manufacturers
      outside Rivian.
    whyItMatters: >-
      Without independent customer deployments, it is impossible to verify whether Mind Robotics' manipulation
      foundation models generalize beyond Rivian's proprietary plant architecture.
    diligencePath: >-
      Request customer pipeline disclosures, pilot conversion metrics, and technical benchmarks from non-Rivian
      automotive evaluation trials.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
