    keyQuote: >-
      Scaringe's explicit rejection of human biomechanics as a design target puts Mind Robotics on a different side of
      one of industrial robotics' more consequential arguments this year. Tesla's Optimus, Figure's humanoid line and a
      wave of well-capitalized Chinese entrants have bet that a human-shaped, general-purpose robot is the right
      long-term form factor precisely because human factories, tools and workspaces are built for human bodies. Mind
      Robotics is making the opposite bet: that purpose-built hardware, designed around the specific geometry of
      pick-and-place, sorting, fastening and connector tasks rather than general bipedal mobility, reaches useful
      industrial reliability faster
    url: https://www.robotaigeek.com/news/rivians-mind-robotics-names-doug-field-as-president
