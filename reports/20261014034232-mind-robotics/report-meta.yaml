companyProfile:
  summary: >-
    Mind Robotics is a Rivian spinout developing full-stack physical-AI robotics for dexterous manufacturing automation.
    The company has rapidly accumulated $1.015 billion of venture equity and recruited experienced industrial operator
    Doug Field to help translate its captive Rivian testbed into a broader automation platform, but public proof remains
    limited to Rivian-controlled operations with no disclosed third-party revenue, pricing, or non-Rivian customers.
