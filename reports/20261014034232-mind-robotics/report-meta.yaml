  topStrengths:
    - Captive Rivian factory access provides a rare live training wedge for physical-AI manufacturing robotics.
    - The company has raised more than $1.0B from high-quality investors, giving it meaningful execution runway.
    - Doug Field's appointment adds proven industrialization leadership for factory-scale deployment.
  topRisks:
