callouts:
  - calloutType: insight
    title: Anti-Humanoid Form Factor Accelerates Industrial Deployment
    body: By intentionally rejecting humanoid bipedalism in favor of wheeled mobile bases and specialized high-dexterity manipulation arms, Mind Robotics bypasses the complex, unsolved challenge of bipedal balance in cluttered industrial facilities. This design choice concentrates engineering resources directly on high-value manipulation tasks such as wire harness routing and connector mating.
    claimRefs:
      - CE005
      - CE006
      - CE010
  - calloutType: risk
    title: Captive Customer Dependency and Transferability Bottlenecks
    body: While Rivian provides an invaluable production-scale training environment and captive customer validation, Mind Robotics' total dependence on Rivian's Normal factory creates substantial strategic risks. The company has not yet demonstrated that foundation models trained on Rivian's EV lines can generalize to third-party manufacturing plants with different parts, tolerances, and assembly pacing.
    claimRefs:
      - CE008
      - CE012
      - CE014
