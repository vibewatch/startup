  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance-benchmarks
      missingEvidence: Third-party verified cycle times, mean time between failures (MTBF), insertion success rates, and standardized manipulation benchmarks on manufacturing lines.
      whyItMatters: Without independent benchmark verification, underwriting cannot distinguish between lab demonstration feasibility and industrial-grade shift-level reliability.
      diligencePath: Request production-line telemetry logs, MTBF records, and task completion rates from the Rivian Normal facility pilot deployments.
      relatedQuestionRefs:
        - QE009
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public developer documentation, API specifications, SDK repositories, and developer community discussions for external system integration.
      whyItMatters: As a proprietary hardware and foundation model system operating in private pilots, Mind Robotics currently offers zero public developer surface or open telemetry, creating vendor lock-in risks.
      diligencePath: Review Mind Robotics' partner integration SDK roadmap, API documentation, and industrial protocol compatibility matrices during management diligence.
      relatedQuestionRefs:
        - QE010
    - type: conflicting-data
      severity: minor
      topic: partner-expansion
      missingEvidence: Customer deployment evidence or transfer-learning verification in non-Rivian manufacturing environments.
      whyItMatters: Foundation models trained exclusively on Rivian vehicle assembly lines may suffer from distribution shift when deployed in non-automotive or competing manufacturing settings.
      diligencePath: Audit cross-facility pilot agreements, multi-tenant data isolation architecture, and customer expansion pipelines beyond Rivian.
      relatedQuestionRefs:
        - QE008
