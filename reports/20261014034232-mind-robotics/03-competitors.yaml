callouts:
  - calloutType: insight
    title: The Anti-Humanoid Pragmatism Wedge
    body: Mind Robotics explicitly rejects human biomechanics and bipedal locomotion, betting that task-specific manipulators and wheeled bases will achieve industrial reliability far faster than general-purpose humanoids like Tesla Optimus or Figure AI.
    claimRefs:
      - CP001
      - CP002
      - CP007
  - calloutType: risk
    title: Captive Validation Masking Arm's-Length Commercial Transferability
    body: Rivian acts simultaneously as Mind Robotics' founder, equity partner, initial customer, and primary training data source. Until the company deploys robots with an independent manufacturer, it remains unproven whether its manipulation models generalize beyond Rivian's specific plant lines.
    claimRefs:
      - CP010
      - CP011
      - CP013
