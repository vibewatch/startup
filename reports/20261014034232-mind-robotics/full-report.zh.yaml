  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              制造业工业机器人部署长期集中在结构点焊、重型钣金冲压和自动码垛等刚性、尺寸稳定的流程。固定式自动化单元已经相当成熟，但复杂增值工厂装配仍存在明显结构性缺口。柔性线束布线、零件插入、连接器插接和可变紧固件对位等细腻任务，由于传统工业设备缺乏物理适应性，几乎仍完全依赖人工装配线。Mind
              Robotics 明确定义了自己的目标市场边界：用物理 AI
              基础模型和任务专用操作硬件，弥补灵巧度与物理推理不足。公司有意把双足人形行走排除在产品范围之外。管理层认为，工厂中的人形形态会带来高能耗和机械风险，并押注轮式或固定底座的专用机械臂能比通用行走机器人更快达到班次级工业可靠性，且总拥有成本更低。目标工厂单元的现状替代方案仍包括人工、专用硬自动化工装，以及每次零件变化都需要昂贵夹具和手动重编程的传统多轴机械臂。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
