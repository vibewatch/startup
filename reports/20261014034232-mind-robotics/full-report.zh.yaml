  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 工业机器人版图：人形机器人与专用任务自动化
        blocks:
          - type: paragraph
            body: >-
              新兴物理 AI 领域明显分成两派：通用双足人形开发者，以及专用任务自动化公司。Tesla Optimus、Figure AI 和 Apptronik
              等获得风投支持的人形机器人先行者认为，人形机器人可以自然适应为人类工人设计的空间；Mind Robotics 则明确采取反人形的架构理念。创始人 RJ Scaringe
              认为，在工厂自动化中复刻人体生物力学是多余负担，因此转向为汽车装配优化的轮式底座和任务专用机械臂。这种理念分歧使 Mind Robotics
              既面对屡次延期的高知名度人形项目，也挑战着无法适应真实零件差异的传统工业机器人供应商。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
