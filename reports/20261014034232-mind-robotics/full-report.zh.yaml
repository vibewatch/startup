      - number: '2.2'
        title: 可服务市场规模、经济视角与估值基准
        blocks:
          - type: paragraph
            body: >-
              评估物理 AI 机器人的可服务市场，不能只依赖一个投机性的 TAM 数字，而需要多个量化视角。离散制造的工业自动化总支出预计为全球每年
              $240B，涵盖重型机械、机器人机械臂和工厂执行软件。其中，用于汽车装配灵巧操作的具体 SAM 约为 $42B，主要由高波动装配工位的人工替代和增强驱动。市场规模还受到资本涌入支撑：2026
              年第一季度，全球投向物理 AI 和先进机器人的风险投资单季就达到 $18B，说明机构信心正在加速。私募股权投资者迅速为 Mind Robotics 注入资本以追逐这一机会，分别在 2026 年 3 月 A 轮和
              2026 年 5 月 Kleiner Perkins 领投的后续融资中建立了 $2.0B 和 $3.4B 的估值基准。关注 Rivian
              的公开市场分析师指出，这一数十亿美元的私募基准说明外部投资者正在赋予先进机器人能力显著的独立价值，而不仅仅是消费电动车制造价值。
