            body: >-
              Mind Robotics 在成立初期就以异常速度形成资本，首个运营年度约募集 $1.015B。公司先在 2025 年末完成 $115M 种子轮，随后于 2026 年 3 月完成由 Accel 和
              Andreessen Horowitz 共同领投、据估计约 $2.0B 估值的 $500M A 轮融资；2026 年 5 月又完成 Kleiner Perkins 领投的 $400M 融资，业务估值达到尚未确认的
              $3.4B 基准。这笔巨额资本缓冲提供了多年的运营跑道，推迟了短期商业变现压力。但长期融资依赖仍与 Rivian 交织：截至 2026 年 6 月 30 日，Rivian
              持有约三分之一股权。金融分析师指出，Rivian 自身仍在亏损，未来三年也没有一致预期认为其能实现盈利，因此潜在资本约束、关联方资金转移和治理动态都受到关注。
