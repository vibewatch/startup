      - number: '2.3'
        title: 工业买方细分、用户画像与采购流程
        blocks:
          - type: paragraph
            body: >-
              物理 AI
              工厂自动化的企业买方可分为多个客户层级，各层的采购动机不同。主要商业买方是汽车原始设备制造商（OEM）和一级零部件供应商，它们正承受车间劳动力流失和工资上涨。企业内部的日常用户包括制造工程负责人、工厂现场主管和机器人维护技师，他们关注班次级运行时间、标准化工具接口，以及零件错位后的快速恢复。预算则通常由制造执行副总裁、企业资本支出委员会和
              CFO 掌握；这些决策者要求按人工时薪和报废减少额严格计算回收期。采购路径往往很长：先验证数字孪生仿真，再测试离线试点单元，最后在产线旁完成分阶段试部署，之后才会签订企业级大额合同。目前，Mind
              Robotics 受益于 Rivian Automotive 这一内部封闭客户；Rivian 既是主要股东，也是其在伊利诺伊州 Normal 电动车装配线上的首发部署伙伴。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
