        - 持续接入 Rivian 位于 Normal, IL 的高产量电动车装配线，带来实验室型同行无法获得的丰富多模态物理数据飞轮
        - 只在 Rivian 车辆架构上采集的数据，可能过拟合特定工装、零件和公差
        - 在非 Rivian 装配线上展示机器人部署，并由独立机构验证迁移学习速度
      - - 领导力与产业化
        - Doug Field 曾在 Tesla 和 Ford 将硬件从原型扩展到量产，拥有经过验证的履历，可解决生产扩张难题
        - Field 在 Ford 负责的电动车部门亏损数十亿美元，Apple Project Titan 也已关闭，说明他离开 Tesla 后的结果喜忧参半
        - 持续兑现执行里程碑，包括宣布多工厂部署和客户交付时间表
      - - 商业化与客户独立性
        - Rivian 的首发客户关系无需漫长的企业销售周期，就能带来即时的现实验证
        - 受控客户关系可能催生定制化内部自动化工具，而不是可扩展的企业产品平台
        - 披露与外部制造企业签订的有约束力商业协议或付费试点合同
    notes: 分析论点结合一手资料和独立报道评估；触发条件界定足以推翻当前立场的可衡量情形。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: 看多 / 基准 / 看空情景表
    columns:
      - 情景
      - 关键假设与运营驱动因素
      - 隐含估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 看多情景
        - 快速部署至 Rivian 各工厂；12-18 个月内向外部汽车制造商商业化推出；到 2028 年实现 $100M+ ARR，硬件 / 软件毛利率达到 65%+
        - 凭借可比顶级企业 AI 倍数的实体 AI 平台溢价，估值扩张至 $8B-$12B（2.4x-3.5x 回报）
        - 技术迁移失败；硬件可靠性成为瓶颈；外部客户不愿分享制造数据
        - 低（20%）——需要前所未有的执行速度，并在商业采纳过程中不出差错
      - - 基准情景
        - 在 Rivian Normal 工厂成功试点部署；到 2027 年末开展少量外部客户试点；初始商业收入在定制集成周期下缓慢出现
        - 估值持平或小幅增长（$3.4B-$5.0B；1.0x-1.5x 回报），并需要延长轮次或平价轮过桥融资
        - 非受控收入形成规模前，持续烧钱耗尽 $1B 资金储备；私有机器人企业估值倍数压缩
        - 中等（55%）——反映工业硬件验证和汽车采购交付周期的现实时间表
      - - 看空情景
        - 机器人未能在汽车装配中达到所需的轮班可靠性；Rivian 仍是唯一用户；外部汽车制造商因知识产权或竞争冲突拒绝采用
        - 通过折价大幅下调轮次重组，或由 Rivian 战略性吸收（$1.0B-$1.5B；较 Series A-1 估值下跌 60%-70%）
        - Rivian 陷入财务困境；现金消耗加速；高级清算优先权抹去次级股权份额
        - 偏高（25%）——考虑到资本密集型硬件行业的历史夭折率和下调轮次频率，这一概率不可忽视
    notes: 情景预测基于未经确认的商业基线和 $3.4 billion 入场估值，模拟示意性的回报期限与估值倍数。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV010
      - CV013
      - CV014
