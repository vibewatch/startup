            body: >-
              Mind Robotics 与人形机器人公司的根本区别，在于它专注于适配装配几何的专用操作形态。双足人形在工厂地面仍面临未解决的行走和高功耗难题，而运行物理 AI
              基础模型的任务专用机械臂，为自动化高价值灵巧装配提供了直接的经济路径。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM006
          - type: callout
            title: 单一客户数据飞轮与可迁移性瓶颈
            body: >-
              Rivian 位于伊利诺伊州 Normal 的汽车工厂从第一天起就为 Mind Robotics 提供了难得的真实训练环境，但也带来了明显的封闭客户集中风险。只在 Rivian
              车辆公差、零件和节拍上训练的基础模型，若没有高成本的场地专项再训练，可能难以泛化到第三方制造环境。
            calloutType: risk
            claimRefs:
