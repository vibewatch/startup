      - number: '3.2'
        title: 直接、既有与邻近竞争者画像
        blocks:
          - type: paragraph
            body: >-
              2026 年机器人领域的资本集中快速加剧，多个类别都出现资金充裕的对手。在直接可比公司中，Tesla Optimus 拥有巨额内部资本和工厂使用权，但公开披露显示，截至 2026 年初，在错过最初部署 1,000
              台设备的工厂目标后，实际执行有意义生产工作的设备数量仍为零。Rhoda AI 等资金充足的初创公司已获得大量早期融资，利用互联网视频训练基础模型；Neura Robotics 和 LimX Dynamics
              则专注具身智能。相比之下，ABB 等根基深厚的老牌厂商在焊接和冲压等重复式任务上占据全球主导市场份额，却缺乏处理细腻装配的自适应基础模型。Mind Robotics 快速积累的 $1B
              资本，使其具备与这些多样化对手同量级的资源。
