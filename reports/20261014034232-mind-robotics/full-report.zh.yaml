        - 降低内饰线上的高人体工学负担和装配人工开销
        - 应对线缆刚度变化大以及卡扣安装点被遮挡的问题
      - - 柔性密封垫插入
        - 手工按压和对齐，容易出现微小缝隙及漏水缺陷
        - 带柔顺压力控制的连续路径跟随移动操作机器人
        - 确保密封珠均匀压缩，消除人工放置误差
        - 在不撕裂或过度拉伸弹性材料的情况下维持高循环速度
      - - 紧固件与螺栓就位
        - 固定式自动化需要昂贵的精密零件送料器和刚性对位夹具
        - 视觉引导动态对齐，补偿零件尺寸差异
        - 消除硬工具化夹具成本，并容忍未对齐的子组件
        - 检测螺纹错扣，并验证高扭矩最终拧紧
      - - 电气连接器插接
        - 操作员手工推入并听到咔哒声确认，容易出现部分锁扣导致保修召回
        - 灵巧夹爪通过触觉锁扣确认和声学啮合检查
        - 保证 100% 端子完全啮合，并自动完成质量检测
        - 进入仪表板和底盘纵梁后的狭窄间隙腔体
    notes: 这些工作流对应目标明确的汽车及工业制造灵巧任务；刚性自动化会因零件差异而失效。循环时间尚未公开披露。
