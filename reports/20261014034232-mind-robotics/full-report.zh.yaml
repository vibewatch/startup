      - number: '1.2'
        title: 管理层、关键招聘与治理结构
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 采用一套连接前沿机器学习研究与大规模工业制造纪律的管理架构。RJ Scaringe 担任创始人、执行董事长和代理首席执行官，在 Rivian 与 Mind Robotics
              的双重职责之间负责战略方向和投资者协调。2026 年 10 月 13 日，Mind Robotics 在旧金山 TechCrunch Disrupt 现场宣布，资深工程负责人 Doug Field
              出任总裁，直接负责日常运营、产品开发和制造工程。Field 曾任 Tesla 工程高级副总裁并负责 Model 3 生产，也曾任 Apple Special Projects Group
              副总裁、主导自动驾驶汽车开发，并担任 Ford Motor Company 首席电动汽车与数字官，带来了少见的量产扭转经验。治理层还包括机构投资者代表：Accel 合伙人 Sameer Gandhi 在公司完成
              A 轮融资后加入董事会。该领导模式与 Scaringe 旗下另一家微型出行分拆公司 Also Inc. 类似，由有实战经验的运营高管管理日常工程和工厂部署，Scaringe
              则负责更广泛的融资、董事会重点和技术战略。
