          - type: callout
            title: 与人形形态的战略分歧
            body: >-
              Tesla Optimus 和 Figure AI 等竞争者追求双足人形架构，而 Mind Robotics
              专注于围绕装配几何设计的专用机器人机械臂。这种刻意的专业化避开了行走机器人在功耗和机械稳定性上的难题，优先打造高灵巧度的触觉机械手。
