      - number: '1.3'
        title: 融资历程、估值演变与股权结构表
        blocks:
          - type: paragraph
            body: >-
              对一家早期工业机器人企业而言，Mind Robotics 的融资速度异常快：成立后六个月内完成三轮机构融资，累计获得 $1.015B 股权资本。2025 年 11 月，公司完成由风险投资机构 Eclipse
              领投的 $115M 种子轮融资，Rivian Automotive 参与战略投资。2026 年 3 月，Mind Robotics 完成由 Accel 和 Andreessen Horowitz 共同领投的
              $500M A 轮融资，投后估值达到 $2.0B。2026 年 5 月，公司又完成由 Kleiner Perkins 领投的 $400M A-1 和 B 轮融资，投后估值为 $3.4B；大众和
              Salesforce 旗下风投部门以及另外 16 家机构投资者跟投。充裕的资本缓冲了密集硬件原型开发和基础模型算力训练带来的短期现金消耗压力，但截至 2026 年 10
              月，公开公司披露显示，其可验证商业收入、ARR 和毛利率表现均为零。这个数十亿美元估值完全建立在工业规模部署预期之上，而非经审计的财务收益。
