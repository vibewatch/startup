chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与战略使命
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 是一家总部位于 Palo Alto 的工业机器人公司，专门为复杂制造环境开发全栈物理人工智能系统。公司最初由 Rivian Automotive Inc. 在内部孵化，代号为
              Project Synapse，随后于 2025 年 11 月正式分拆为独立运营实体。Rivian 创始人兼首席执行官 RJ Scaringe 创办 Mind
              Robotics，目标是自动化传统固定运动设备无法处理的复杂装配任务。Mind Robotics
              不走双足人形机器人路线，而是明确放弃人体生物力学复刻，转向针对具体任务、优化触觉灵巧度、力调节和产线速度的机器人形态。Mind 在加州 Palo Alto 运营主要工程总部，同时把 Rivian 位于伊利诺伊州
              Normal 的装配业务作为实际运营测试场。公司结构使 Mind Robotics 与 Rivian 的资产负债表风险相分离，但 Rivian
              仍保留重要少数股权并提供积极的战略支持。其核心价值主张，是把自有机器人基础模型与专用硬件结合起来，自动化过去依赖人工完成的触觉装配工作。
