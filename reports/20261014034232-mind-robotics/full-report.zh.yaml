  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与工业买方版图
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics
              把可服务商业范围锁定在资本密集型离散制造行业，这些行业的传统机器人自动化仍受刚性编程要求限制。主要目标客户是汽车原始设备制造商（OEM），其特点是装配复杂、产线速度压力大、零件公差紧。除汽车装配外，公司还把一级汽车供应商、高科技电子制造和动态工业物流设施列为次级目标。在每个细分市场，经济买方通常是制造副总裁、制造工程负责人或全球运营总监，关注吞吐稳定性、质量良率和劳动力风险缓解。但这些更广泛垂直行业的商业验证仍完全停留在预期阶段。当前，Mind
              Robotics 仅通过与 Rivian 的创始关系，在汽车装配细分市场建立了活跃运营。传统机器人供应商销售固定功能的自动化解决方案，Mind Robotics
              则瞄准需要视觉推理、自适应轨迹调整和触觉反馈的高波动操作流程。
