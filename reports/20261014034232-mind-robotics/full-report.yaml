      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics Gaps
        blocks:
          - type: paragraph
            body: >-
              The operating cost structure of physical AI spans two capital-intensive domains: high-performance
              foundation model training infrastructure and physical electro-mechanical hardware manufacturing. In
              contrast to competitors pursuing bipedal humanoid architectures, Mind Robotics has explicitly rejected
              human biomechanics in favor of task-specific, non-humanoid form factors. This design philosophy aims to
              reduce hardware fabrication costs and energy consumption while concentrating engineering resources on
              dexterous manipulation end-effectors. Under the operational leadership of President Doug Field, appointed
              in October 2026, the company emphasizes manufacturing reliability on active assembly lines. Nevertheless,
              unit economics metrics remain completely undisclosed in public surfaces. Key underwriting
              parameters—including hardware bill-of-materials cost, deployment integration overhead, field maintenance
              expense, and recurring software gross margins—represent material private-evidence gaps that cannot be
              verified without non-public financial records.
            claimRefs:
