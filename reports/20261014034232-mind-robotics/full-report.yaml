chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Strategic Charter
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics is a Palo Alto-based industrial robotics company established to develop full-stack physical
              artificial intelligence systems tailored specifically for complex manufacturing environments. The venture
              was initially incubated within Rivian Automotive Inc. under the internal code name Project Synapse before
              being formally spun out as an independent standalone operating entity in November 2025. Dr. RJ Scaringe,
              the founder and chief executive officer of Rivian, established Mind Robotics with the strategic objective
              of automating intricate assembly tasks that classical fixed-motion automation cannot accommodate. Rather
              than pursuing bipedal humanoid robotics, Mind Robotics explicitly rejects human biomechanical replication
              in favor of task-specific robotic form factors optimized for tactile dexterity, force modulation, and
              line-speed execution. Mind operates its primary engineering headquarters in Palo Alto, California, while
              leveraging Rivian assembly operations in Normal, Illinois, as an active operational testbed. The corporate
              structure positions Mind Robotics as a venture distinct from Rivian balance sheet liabilities, though
              Rivian retained significant minority equity ownership and active strategic sponsorship. The core value
              proposition centers on combining proprietary robotics foundation models with purpose-built hardware to
              automate tactile assembly work that has historically remained dependent upon manual human labor.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
