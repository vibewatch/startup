              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Monetization Mechanics, and Pricing Structure
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics develops a full-stack industrial automation platform combining proprietary physical-AI
              foundation models, purpose-built robotic manipulation hardware, and factory deployment infrastructure. The
              venture anticipates commercializing across multiple potential revenue streams, including direct robot
              hardware procurement, recurring Robotics-as-a-Service (RaaS) software subscriptions, turnkey integration
              services, and ongoing maintenance agreements. However, as of October 2026, Mind Robotics discloses zero
              commercial product pricing, list prices, or standardized contract terms. The company operates without
              publicly announced commercial revenue streams outside of its strategic co-development arrangement with
              Rivian Automotive, which serves as both a major equity shareholder and initial deployment customer. While
              Rivian provides critical access to live vehicle assembly lines and rich manufacturing training datasets,
              this structure leaves Mind Robotics without genuine commercial price discovery or third-party customer
              validation.
