              - CI002
              - CI006
              - CI007
              - CI010
      - number: '4.4'
        title: Financial Underwriting Verdict and Commercial Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              From an investment underwriting perspective, Mind Robotics represents a heavily capitalized physical-AI
              research and industrialization effort that cannot currently be valued on fundamental financial metrics.
              The company combines tier-one venture backing and deep automotive engineering talent with access to live
              vehicle production data, but commercial proof lags its multi-billion-dollar valuation benchmark. With zero
              third-party commercial customer contracts announced outside Rivian's manufacturing lines, underwriting the
              company requires accepting significant customer concentration and unproven technology transferability.
              Until Mind Robotics demonstrates verified deployment return-on-investment, arm's-length commercial pricing
              power, and transparent unit economics across non-Rivian industrial facilities, financial underwriting
              remains blocked by private-evidence opacity.
            claimRefs:
