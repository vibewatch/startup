  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Investment Dimension
      - Thesis (Bull Argument)
      - Anti-Thesis (Bear Argument)
      - What Would Change the View
    rows:
      - - Technology & Form Factor
        - >-
          Task-specific purpose-built hardware avoids humanoid locomotion liabilities, focusing computation and
          mechanical design directly on dexterous assembly
        - >-
          Lack of public demos leaves real-world grasping accuracy, cycle time, and line-speed adaptability unverified
          by third parties
        - Independent technical benchmarks or third-party audit of robot cycle times in high-volume production shifts
      - - Data & Training Access
        - >-
          Continuous access to Rivian's high-volume EV assembly line in Normal, IL provides rich multimodal physical
          data flywheel unavailable to lab-bound peers
        - >-
          Data captured exclusively on Rivian vehicle architectures may overfit to specific tooling, parts, and
          tolerances
        - >-
          Demonstrated robot deployment on a non-Rivian assembly line with independent validation of transfer learning
          speed
      - - Leadership & Industrialization
        - >-
          Doug Field brings proven track record scaling hardware from prototype to volume at Tesla and Ford, solving
          production scaling hurdles
        - >-
          Field's EV division at Ford suffered multi-billion-dollar losses and Apple Project Titan was shuttered,
          showing mixed post-Tesla outcomes
        - >-
          Sustained execution milestones including announcement of multi-plant deployment and customer delivery
          timelines
      - - Commercial & Customer Independence
        - >-
          Rivian launch customer relationship guarantees immediate real-world validation without protracted enterprise
          sales cycles
        - >-
          Captive customer dynamic risks creating a bespoke internal automation tool rather than a scalable enterprise
          product platform
        - Disclosure of binding commercial agreements or paid pilot contracts with outside manufacturing corporations
    notes: >-
      Analytical arguments evaluated against primary and independent reporting; triggers define measurable conditions
      that would overturn current stance.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions & Operating Drivers
      - Implied Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rapid deployment across Rivian plants; commercial launch to external automakers within 12-18 months; achieves
          $100M+ ARR by 2028 with 65%+ hardware/software gross margins
        - >-
          Valuation expands to $8B-$12B (2.4x-3.5x return) on physical-AI platform premium comparable to top-tier
          enterprise AI multiples
        - >-
          Tech transfer failure; hardware reliability bottlenecks; external customer reluctance to share manufacturing
          data
        - Low (20%) — Requires unprecedented execution speed and commercial adoption without stumble
      - - Base Case
        - >-
          Successful pilot deployment within Rivian Normal plant; modest external customer pilots by late 2027; initial
          commercial revenues emerge slowly under custom integration cycles
        - >-
          Valuation holds flat to modest accretion ($3.4B-$5.0B; 1.0x-1.5x return), with extension rounds or flat-round
          bridge financing needed
        - >-
          Extended burn rate consuming $1B war chest before non-captive revenue scales; multiple compression in private
          robotics
        - >-
          Moderate (55%) — Reflects realistic timeline for industrial hardware validation and auto procurement lead
          times
      - - Bear Case
        - >-
          Robotics fail to achieve required shift reliability in automotive assembly; Rivian remains sole user; outside
          automakers refuse adoption due to IP or competitive conflicts
        - >-
          Down-round restructuring or strategic absorption by Rivian at steep discount ($1.0B-$1.5B; 60%-70% loss from
          Series A-1 mark)
        - >-
          Rivian financial distress; cash burn acceleration; senior liquidation preferences wipe out junior equity
          tranches
        - >-
          Elevated (25%) — Material probability given historical mortality and down-round frequency in capital-intensive
          hardware
    notes: >-
      Scenario projections model illustrative return horizons and valuation multiples given unconfirmed commercial
      baseline and $3.4 billion entry mark.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV010
      - CV013
      - CV014
