      - number: '1.2'
        title: Executive Leadership, Key Hires, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics is governed by an executive structure designed to bridge frontier machine learning research
              with large-scale industrial manufacturing discipline. Dr. RJ Scaringe serves as Founder, Executive
              Chairman, and Acting Chief Executive Officer, retaining strategic direction and investor coordination
              across his dual commitments at Rivian and Mind Robotics. On October 13, 2026, Mind Robotics announced
              onstage at TechCrunch Disrupt in San Francisco that veteran engineering leader Doug Field had been
              appointed President, assuming direct executive oversight of day-to-day operations, product development,
              and manufacturing engineering. Field brings rare production turnaround experience across prominent
              hardware programs, having previously served as senior vice president of engineering at Tesla overseeing
              Model 3 production, vice president in Apple Special Projects Group directing autonomous vehicle
              development, and chief EV and digital officer at Ford Motor Company. Governance oversight includes
              institutional investor representation, with Accel partner Sameer Gandhi joining the board of directors
              following the company Series A financing. The leadership model closely mirrors Scaringe secondary
              micromobility spinoff Also Inc., relying on proven operational executives to manage day-to-day engineering
              and factory deployment while Scaringe guides broader capital formation, board priorities, and technology
              strategy.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
