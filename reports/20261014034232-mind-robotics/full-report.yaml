      - number: '3.2'
        title: Direct, Incumbent, and Adjacent Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Capital concentration across robotics has accelerated rapidly throughout 2026, creating heavily funded
              rivals across multiple categories. In the direct peer group, Tesla Optimus commands massive internal
              capital and factory access, yet public disclosures indicate zero units were performing meaningful
              production work by early 2026 after missing its initial 1,000-unit factory deployment target.
              Well-capitalized startups such as Rhoda AI have secured substantial early funding to train foundational
              models on internet video, while Neura Robotics and LimX Dynamics pursue embodied intelligence. In
              contrast, entrenched incumbents like ABB maintain dominant global market share in heavy repetitive tasks
              like welding and stamping, but lack adaptive foundation models for nuanced assembly. Mind Robotics' rapid
              $1 billion capital accumulation establishes peer-scale resources to challenge these diverse competitors.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
