        title: Exhibits
        blocks:
          - type: callout
            title: The Anti-Humanoid Pragmatism Wedge
            body: >-
              Mind Robotics explicitly rejects human biomechanics and bipedal locomotion, betting that task-specific
              manipulators and wheeled bases will achieve industrial reliability far faster than general-purpose
              humanoids like Tesla Optimus or Figure AI.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: Captive Validation Masking Arm's-Length Commercial Transferability
            body: >-
              Rivian acts simultaneously as Mind Robotics' founder, equity partner, initial customer, and primary
              training data source. Until the company deploys robots with an independent manufacturer, it remains
              unproven whether its manipulation models generalize beyond Rivian's specific plant lines.
            calloutType: risk
            claimRefs:
              - CP010
