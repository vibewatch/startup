        title: Product Definition and Full-Stack Operating Scope
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics was spun out of electric vehicle maker Rivian in November 2025 to develop advanced physical
              artificial intelligence for industrial manufacturing environments. Rather than supplying standalone
              software or modular robotics components, the company architectures a full-stack platform comprising
              industrial foundation models, custom robotic hardware, and factory deployment infrastructure. The primary
              focus centers on high-dexterity assembly and manipulation tasks that conventional automation cannot solve
              due to physical variance, including flexible wire harness routing, gasket insertion, and clip
              installation. Mind Robotics is currently preparing its initial robot platform, designated Phil, for
              factory deployment while operating in closed development inside active vehicle production facilities.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE006
              - CE009
              - CE010
              - CE012
      - number: '5.2'
        title: Physical-AI Architecture and Anti-Humanoid Design Philosophy
        blocks:
          - type: paragraph
            body: >-
              A central technical differentiator for Mind Robotics is its explicit rejection of humanoid biomechanics.
              While prominent robotics competitors invest heavily in bipedal locomotion, Mind Robotics prioritizes
              wheeled mobile bases and high-dexterity end effectors, treating human legs as energy-intensive liabilities
              on flat factory floors. The platform's foundation models function as the cognitive engine, learning
              closed-loop manipulation policies from multi-modal sensor streams rather than explicit task-specific
              scripting. To support real-time inference and low-latency motor control, Mind Robotics leverages
              ruggedized edge compute and plans to access custom silicon processors developed by Rivian for autonomous
              vehicles once they become available.
            claimRefs:
              - CE005
              - CE007
              - CE010
              - CE011
