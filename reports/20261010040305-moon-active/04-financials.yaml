company:
  name: Moon Active
chapter:
  number: 4
  title: Financials
  summary: Moon Active generates approximately $2 billion in annual revenue driven predominantly by Coin Master, but operates with high title concentration and opaque private-company unit economics.
sections:
  - id: revenue-streams-and-scale
    title: Revenue Model, Scale, and Portfolio Mix
    body: Moon Active has established rare commercial scale within mobile gaming, generating approximately $2 billion in annual revenue across both 2024 and 2025 according to secondary market intelligence from PitchBook and Globes. This top-line volume is overwhelmingly concentrated in Coin Master, which has accumulated more than $4 billion in lifetime player expenditure since its 2016 launch. Coin Master operates on a free-to-play social casino model that monetizes player progression through virtual slot machine spins, village upgrades, and competitive social raids. To broaden its revenue base and reduce single-title exposure, Moon Active acquired Belarusian-founded studio Melsoft in December 2020 for over $100 million, adding casual adventure titles such as Family Island and My Cafe to its active catalog. Nevertheless, the business remains fundamentally anchored to Coin Master live-ops performance, creating substantial revenue concentration risk.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: monetization-and-pricing-dynamics
    title: Monetization Architecture and Live-Ops Pricing
    body: Monetization inside Moon Active titles relies on aggressive live-ops event cadence, dynamic promotional popups, and algorithmic pricing segmentation. In-game store items range from $1.99 micro-bundles of spins to premium $99.99 coin and booster packs, with pricing dynamically personalized based on player engagement history, spend propensity, and progression friction. Moon Active employs specialized monetization artists and data scientists to continuously test and refine shop flows, banner placements, and reward pacing through multivariate A/B testing. However, this hyper-optimized monetization loop has generated substantial adverse consumer sentiment. On public review platforms including Trustpilot, players consistently criticize aggressive pay-to-win mechanics, alleging artificial win-rate throttling after in-app purchases and unresponsive customer support for failed virtual goods fulfillment. This dynamic creates persistent player churn that necessitates substantial ongoing user acquisition spend.
    claimRefs:
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI002
  - id: unit-economics-and-cost-structure
    title: Unit Economics, Margin Drivers, and Cost Structure
    body: 'Moon Active operating cost structure is dominated by platform distribution fees, user acquisition marketing, and engineering personnel. Distribution through Apple App Store and Google Play incurs standard platform commissions of up to 30%, which serve as the primary component of cost of goods sold for mobile microtransactions. With estimated headcount around 2,000 employees globally, third-party benchmarks project annual revenue per employee at roughly $712,000, signaling robust operating leverage. Fixed capital commitments include a 10-year, $110 million commercial office lease signed in June 2026 for 22,000 square meters in Tidhar Beyond Towers in Givatayim. Operating cost management has also driven workforce rationalization: the company executed two restructuring rounds, eliminating 110 positions in January 2026 following an earlier cut of dozens of roles in 2025, primarily consolidating redundant roles from the Melsoft acquisition.'
    claimRefs:
      - CI006
      - CI007
      - CI010
      - CI011
    tableRefs:
      - TI003
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy, Financing Dependency, and Diligence Blockers
    body: 'Moon Active exhibits a rare financing profile among high-growth private tech unicorns: the business has funded its operational expansion and acquisitions primarily through internal operating cash flows rather than external primary capital dilution. Public funding databases show $126 million in recorded funding, while secondary transactions totaled $425 million, led by Insight Partners with a $125 million purchase in January 2020 and a $300 million secondary transaction in November 2021 that valued the business at $5 billion. At a $5 billion to $6 billion valuation on $2 billion in annual revenue, Moon Active implied trailing EV/revenue multiple sits between 2.5x and 3.0x, in line with mature social gaming comps like Playtika. However, private ownership obscures critical underwriting inputs: audited GAAP financials, EBITDA profitability, cash balances, debt facilities, and title-level UA payback windows remain completely confidential.'
    claimRefs:
      - CI008
      - CI009
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams summary table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Coin Master IAP
        - In-game virtual slot spins and progression boosters
        - Per transaction ($1.99 - $99.99)
        - Dominant (~$1.2B-$2.0B annual)
        - High cash velocity, volatile retention
        - Title-level IAP breakdown and ARPPU curves
      - - Acquired Titles IAP (Melsoft/Family Island)
        - Casual/farm adventure consumable microtransactions
        - Per transaction ($0.99 - $49.99)
        - Active secondary contributor
        - Moderate diversification, lower scale
        - Individual studio revenue run rates post-acquisition
      - - Ad Mediation / Rewarded Video
        - Opt-in rewarded video ads for in-game currency
        - eCPM / impressions
        - Secondary monetization channel
        - Lower margin contribution vs IAP
        - Ad revenue share vs net IAP split
      - - DTC Web Store / Alternative Billing
        - Off-platform web shop bypassing 30% store fees
        - Direct payment processing
        - Emerging industry motion
        - Margin-accretive, regulatory dependent
        - Direct payment processing volume and fee structure
    notes: Data synthesized from secondary industry intelligence and gaming market analyses; audited product-level segment revenue is not publicly reported.
