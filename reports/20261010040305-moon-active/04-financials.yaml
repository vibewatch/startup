      - CI001
      - CI002
      - CI003
      - CI012
  - id: TI002
    title: Monetization and pricing structure
    columns:
      - Monetization Element
      - Pricing Model
      - List vs Realized Dynamic
      - Discounts & Promotional Mechanics
      - Source Attribution
    rows:
      - - Spin Bundles
        - Tiered microtransactions ($1.99 to $99.99)
        - Realized spend varies via dynamic live-ops offers
        - Limited-time sale events with escalating spin multipliers
        - Public game storefront listings and player reports
      - - Village Construction Packs
        - Progression gating packs for coins and shields
        - Price scales steeply with village progression level
        - Milestone discount popups triggered after raid losses
        - Player reports and monetization artist postings
      - - Event Passes / Tournament Boosters
        - Seasonal reward tracks and raid madness boosters
        - Fixed entry with repeat booster purchases
        - Progressive milestone rewards linked to cumulative spend
        - Game mechanics and review records
      - - Third-Party Ad Rewards
        - Zero-price user time exchange for virtual currency
        - Ad revenue realized per completed video impression
        - Impression frequency caps and personalized ad inventory
        - Industry standard casual game monetization model
    notes: Pricing structures reflect published consumer storefront prices and live-ops game mechanics; personalized pricing algorithms result in variable effective player price points.
    claimRefs:
      - CI003
      - CI004
      - CI005
