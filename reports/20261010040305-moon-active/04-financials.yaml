callouts:
  - calloutType: risk
    title: Concentration Risk on Single Flagship Title
    body: Moon Active reported $2 billion revenue base remains overwhelmingly reliant on Coin Master. While acquisitions like Melsoft and new titles provide modest portfolio spread, failure to sustain Coin Master live-ops engagement poses immediate top-line risk.
    claimRefs:
      - CI001
      - CI002
      - CI012
  - calloutType: insight
    title: Secondary Liquidity vs Balance Sheet Cash
    body: Moon Active headline $300 million and $125 million funding events were secondary share sales facilitating shareholder liquidity rather than primary capital injections into company treasury. Operational self-funding from operating cash flows has financed its acquisitions and facilities.
    claimRefs:
      - CI008
      - CI009
      - CI010
