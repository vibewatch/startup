    title: Unit economics and cost structure proxies
    columns:
      - Economic Metric
      - Reported / Proxy Value
      - Confidence
      - Strategic Diligence Significance
      - Diligence Verification Ask
    rows:
      - - Gross Margin (App Stores)
        - 65% - 70% estimated
        - medium
        - App store 30% commission represents largest variable cost
        - Blended platform fee rate net of DTC web store volume
      - - Revenue per Employee
        - ~$712,000 / year
        - medium
        - Indicates strong operational leverage despite large headcount
        - Audited full-time employee payroll and contractor split
      - - Long-Term Facility Lease
        - $110 million (10-year term)
        - high
        - Material fixed operating lease commitment in Givatayim
        - Tidhar Beyond Towers lease agreement and sublease options
      - - User Acquisition Cost (CAC)
        - Undisclosed private metric
        - low
        - Rising post-ATT privacy costs pressure organic acquisition
        - Cohort-level CAC, blended payback period, and ROAS targets
      - - Net Operating Margin
        - Undisclosed (estimated 20%-35%)
        - low
        - Profitability buffer against marketing spend volatility
        - Audited GAAP/IFRS EBITDA, operating profit, and net income
    notes: Proxy metrics derived from market estimates and comparable casual gaming benchmarks; audited internal margins and customer acquisition costs remain strictly confidential.
