        - "Consumer reviews highlight player frustration with fixed spin mechanics and aggressive pay-to-progress schemes"
        - "Demonstrated multi-title revenue split where non-Coin Master titles exceed 40% of total revenue"
      - - "Anti-Thesis: Information Asymmetry"
        - "Lack of audited reporting, unverified secondary clearing marks, and undisclosed cap table preferences impede institutional valuation"
        - "Audited GAAP financials for 2024-2026 and secondary clearing trade logs remain confidential"
        - "Full confidential information memorandum disclosure with audited financials in pre-IPO process"
    notes: "Thesis points contrast sustained cash generation and studio acquisitions against live-ops fatigue and franchise concentration."
