chapter:
  number: 8
  title: "Valuation"
  summary: "Moon Active demonstrates rare profitability and billion-dollar cash generation in mobile gaming, but heavy concentration in Coin Master, live-ops friction, and private disclosure opacity warrant a track recommendation and a fair valuation stance."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis and Recommendation Framework"
    body: >-
      Moon Active presents a compelling yet complex profile within the global mobile gaming sector. The company's
      flagship title, Coin Master, has achieved extraordinary commercial scale, generating over $1.5 billion in
      annual revenue at its peak and demonstrating exceptional monetization mechanics. However, institutional
      diligence requires looking beyond top-line historical performance. The investment stance for Moon Active is
      classified as track, accompanied by a valuation stance of fair. While the company's historical earnings power
      and cash generation are undisputed, the lack of recent audited financial statements and an unverified cap table
      prevent an outright buy recommendation. Moon Active's ability to maintain high average revenue per paying user
      while managing live-ops fatigue forms the core analytical tension in evaluating whether the company can sustain
      its multibillion-dollar market standing.
    claimRefs:
      - "CV004"
      - "CV012"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "capital-structure-and-valuation-history"
    title: "Capital Structure, Financing History, and Secondary Pricing"
    body: >-
      Evaluating Moon Active's financing context reveals an unusual capital trajectory. Unlike many venture-backed
      unicorns that require continuous primary equity infusions, Moon Active raised only approximately $10 million in
      early primary capital before reaching self-sustaining profitability. Subsequent liquidity events were executed
      almost entirely as secondary share sales. In January 2020, Insight Partners acquired an estimated 10% stake at
      a $1.25 billion to $1.3 billion valuation. By November 2021, Insight Partners and Andalusian Private Capital
      completed a $300 million secondary transaction that valued Moon Active at $5.0 billion, representing a 3.3x
      multiple on reported $1.5 billion revenue. In recent years, pre-IPO platforms such as EquityZen have offered
      private secondary shares from early shareholders. However, without transparent clearing trade logs or disclosed
      liquidation preferences, institutional investors must approach secondary market entry with strict price discipline.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV010"
    tableRefs:
      - "TV002"
  - id: "peer-comparables-and-multiples"
    title: "Comparable Company Multiples and Strategic Capital Allocation"
    body: >-
      Benchmarking Moon Active against public and private mobile gaming publishers highlights key multiple dynamics.
      Profitable Asian and European gaming publishers such as Kingsoft and Kingnet Network trade between 1.1x and 3.7x
      enterprise value to revenue, with EBITDA multiples clustering between 6x and 14x. Moon Active's historical
      secondary multiple of 3.3x revenue placed it near the upper quartile of public comps. To support that valuation
      premium, management pursued strategic capital allocation, acquiring Melsoft Games in December 2020 for $100
      million to gain titles like Family Island and My Cafe, and participating in Spyke Games' $50 million Series A
      round in May 2024. These inorganic moves demonstrate an effort to broaden intellectual property and technical
      capabilities beyond the core slot-and-raid mechanic, though Coin Master remains the indispensable financial engine.
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
  - id: "scenario-modeling-and-diligence-path"
    title: "Scenario Analysis, Downside Triggers, and Critical Diligence Asks"
    body: >-
      Scenario modeling for Moon Active illustrates the asymmetric distribution of returns depending on franchise
      longevity and regulatory developments. In a bull case where live-ops optimization sustains engagement and
      alternative app store payment rails expand gross margins, Moon Active could justify a $7.2 billion to $10.0
      billion valuation. Conversely, a bear scenario driven by live-ops fatigue, rising user acquisition costs, or
      tightened consumer protection regulations around social casino mechanics could depress enterprise value to
      between $1.5 billion and $2.2 billion. Consumer sentiment on public review forums reveals persistent dissatisfaction
      with aggressive monetization and perceived pay-to-win mechanics. To upgrade Moon Active from track to buy,
      prospective investors must demand audited 2024-2026 financial statements, cohort-level net revenue retention
      metrics, and clarity regarding direct-to-consumer web store transaction shares.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV003"
