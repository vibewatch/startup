callouts:
  - calloutType: "insight"
    title: "Secondary Valuation Disconnect from Current Gaming Multiples"
    body: "Moon Active's last public transaction mark of $5 billion from November 2021 reflects peak mobile gaming market multiples (3.3x revenue on $1.5B run rate). In current public markets, comparable casual peers trade closer to 1.1x to 3.7x revenue, implying that private secondary valuations without current audited disclosures carry substantive multiple compression risk."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
  - calloutType: "risk"
    title: "Social Casino Monoculture and Regulatory Exposure"
    body: "Despite acquisitions such as Melsoft Games and minority investments in studios like Spyke Games, Moon Active's financial generation remains heavily anchored to Coin Master. Player friction regarding aggressive monetization and persistent user dissatisfaction represent ongoing threats to player retention and long-term franchise durability."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV008"
