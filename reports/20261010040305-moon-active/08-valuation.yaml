        - "55% probability; reflects mature mobile gaming franchise valuation in current market"
      - - "Bear Case"
        - "Accelerated Coin Master fatigue; user acquisition costs escalate; regulatory curbs on social casino mechanics restrict monetization"
        - "$900M - $1.1B revenue run rate"
        - "1.5x - 2.0x EV/Revenue ($1.5B - $2.2B)"
        - "20% probability; triggered by store fee policy shifts or consumer spending pullback"
      - - "Stress Downside"
        - "Severe platform enforcement, major app store de-listing, or sharp player churn combined with illiquid private secondary discount"
        - "Under $800M revenue run rate"
        - "1.0x EV/Revenue ($800M or below)"
        - "5% probability; severe tail-risk scenario from regulatory prohibition of slot mechanics"
    notes: "Scenario returns assume entry at private secondary market marks and evaluate prospective multi-year exit multiples against public gaming peer medians."
