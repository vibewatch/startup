chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与运营基础
        blocks:
          - type: paragraph
            body: >-
              Moon Active 于 2011 年 4 月由 Samuel Albin 创立，并在以色列特拉维夫雅法 Maze Street 42A 设立公司总部。作为一家私营消费移动娱乐工作室，Moon Active
              专注于在 iOS、Android 和 Facebook 平台开发、扩张和运营移动休闲游戏。公司的商业模式依靠免费游戏机制，通过购买虚拟货币、旋转次数和成长道具变现。在运营期间，Moon Active
              已将实体布局扩展到以色列以外，在华沙、伦敦、布加勒斯特、基辅、曼谷和伊斯坦布尔设立技术开发中心、创意工作室及运营团队。虽然工作室拥有多款产品，但 Coin Master 是其核心运营支柱，累计玩家消费超过
              $2B，并以此规模支撑更广泛的公司计划。
            claimRefs:
              - CO001
              - CO002
              - CO003
