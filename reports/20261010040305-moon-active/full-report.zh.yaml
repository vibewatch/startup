      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 二级估值与当前游戏倍数脱节
            body: >-
              Moon Active 在 2021 年 11 月最后一笔公开交易中采用的 $5 billion 估值，反映的是移动游戏市场的峰值倍数（$1.5B 运行率收入对应
              3.3x）。当前公开市场上，可比休闲游戏公司的交易倍数更接近收入的 1.1x 至 3.7x；在缺乏最新审计披露的情况下，私人二级市场估值因此面临明显的倍数压缩风险。
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV007
          - type: callout
            title: 社交赌场单一文化与监管敞口
            body: >-
              尽管 Moon Active 收购了 Melsoft Games，也对 Spyke Games 等工作室进行了少数股权投资，但其收入创造仍高度依赖 Coin
              Master。玩家对激进变现的不满以及持续的用户不满意，都会继续威胁玩家留存和长期品牌生命力。
            calloutType: risk
            claimRefs:
