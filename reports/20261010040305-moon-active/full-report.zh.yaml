  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露：未成年人赌博挑战
        blocks:
          - type: paragraph
            body: >-
              Moon Active 的旗舰产品 Coin Master 核心变现机制面临重大法律、监管和公众审查。2025 年 2 月，原告在美国加利福尼亚北区联邦地区法院提交了一份重大的拟议集体诉讼起诉书（Williams
              v. Moon Active Ltd.，Case 4:25-cv-01626-YGR），指控公司维持并促成一个专门吸引未成年人、从其提取资金的非法虚拟赌博企业 [CR001]。诉讼称，Coin Master
              将休闲村庄建设成长与高频老虎机机制结合起来，迫使用完每日免费额度的玩家使用真钱购买数字旋转次数 [CR002]。诉讼依据加州刑法中关于老虎机和彩票设备的条款，以及《加州不正当竞争法》和普通法过失，提出了具体诉因
              [CR002]。由于公开法院记录称 Coin Master 累计玩家消费超过 $6B，其中美国贡献估计为 39%，即
              $2.4B，不利司法裁定或法定返还救济可能造成无法量化的资产负债表风险，仅凭公开监管文件无法核实 [CR003, CR014]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR014
