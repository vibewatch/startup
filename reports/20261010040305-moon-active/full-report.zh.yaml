      - number: '2.3'
        title: 需求驱动因素与市场结构
        blocks:
          - type: paragraph
            body: >-
              需求建立在全球分散的消费者注意力、免费进入、持续的在线游戏参与以及可选应用内购买之上。官网称其游戏触达数百万玩家，招聘页面则显示公司仍在持续投入打造和交付游戏体验的人才。与此同时，Tracxn 对 8,395
              家活跃竞争者的分类（其中包括 368 家已获融资公司）表明，玩家注意力和获客支出所面对的竞争场极其广阔。Coin Master 累计玩家消费据报道达到
              $2B，证明爆款产品能够实现规模化变现，但这并未披露付费转化率、地域构成、留存、用户获取回本周期或可触达玩家群体规模。这些缺失的运营分母，决定了机会能持续多久。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM012
      - number: '2.4'
        title: 采用约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              主要约束包括信任、监管解读、平台经济学、切换便利性和爆款集中度。抓取的 Trustpilot
              页面明显偏向一星评价，并反复出现关于购买交付、客服响应和付费加速机制的指控；这些是自选用户反馈，不是有代表性的满意度调查，但足以指向具体尽调测试。GamesIndustry.biz
              还报道称，德国监管机构曾审查面向未成年人的类赌博玩法，同时指出审查委员会并未禁用该游戏。Statista
              的口径进一步表明，平台费用和税费介于玩家总消费与出版商确认收入之间。因此，估值应建立在已核实的队列经济学和单款产品集中度上，而不是无依据的自上而下市场倍数。
            claimRefs:
              - CM003
