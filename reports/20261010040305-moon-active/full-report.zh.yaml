  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从规模 / 证明 / 风险 / 估值推导建议。
    data:
      nodes:
        - id: step-1
          label: 运营规模
          value: Over 100M downloads in global casual gaming with high live-ops velocity
        - id: step-2
          label: 现金流生成
          value: Reported revenue scaling from $500M in 2019 to over $1.5B in 2021
        - id: step-3
          label: 产品组合集中度
          value: Predominant dependence on Coin Master with secondary contribution from Melsoft
        - id: step-4
          label: 变现与流失风险
          value: Player friction, social casino fatigue, and consumer rating pressure (1.6/5 stars)
        - id: step-5
          label: 估值基准
          value: Last priced at $5.0B (3.3x revenue) in 2021 secondary; peer multiples range 1.1x-3.7x
        - id: step-6
          label: 尽调建议
          value: Track stance with fair valuation pending audited financials and verified cap table
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
    approximationNotes: 收入倍数和估值基准反映历史二级市场报价及第三方分析师的可比区间。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV012
