          detail: 最宽的替代集合；没有保留支出估算。
        - label: 全球移动游戏
          value: Unquantified
          detail: 相关分发类别，但没有保留全市场总量。
        - label: 免费游戏
          value: Unquantified
          detail: 核心商业模式边界得到定性支持。
        - label: 休闲及类社交赌场移动游戏
          value: Unquantified
          detail: Coin Master 的分类指向这一窄类别。
        - label: Moon Active 产品组合
          value: $1.1B-$1.5B
          unit: reported annual company revenue
          detail: 年代和方法混杂；不足以作为可用的市场估算。
        - label: Coin Master
