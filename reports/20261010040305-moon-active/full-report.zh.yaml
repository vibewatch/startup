      - number: '3.2'
        title: 核心机制、玩法差异化与在线运营执行
        blocks:
          - type: paragraph
            body: >-
              Coin Master 是 Moon Active 最主要的竞争差异化：这款混合型休闲社交产品把老虎机旋转机制、村庄建设和激进的玩家对玩家突袭结合起来。据 Calcalist CTech 报道的 Sensor
              Tower 商店情报，Coin Master 在 2024 年累计玩家消费超过 $6 billion，自 2020 年以来年收入约 $1.2 billion。Moon Active
              把人的创意能力与自研下一代人工智能结合起来，打造有吸引力的娱乐内容，这也是其竞争优势所在。运营上，Moon Active
              配备专门的变现团队，招聘负责设计高转化报价页面、商店流程和促销活动横幅的变现艺术家，并根据细粒度 A/B 测试数据和玩家表现指标持续迭代。这套系统化在线运营执行，使 Moon Active
              相比传统休闲益智游戏，能从每位付费用户获得更高平均收入。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: 战略定位、规模差距与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              尽管 Coin Master 的财务规模巨大，但与多元化既有企业相比，Moon Active 的竞争护城河存在明显不对称。Moon Active 几乎没有筹集新股风险资本，而是依靠二级交易，包括 2021 年
              11 月以 $5B 至 $6B 估值完成的 $300M 老股出售。为保持运营效率，Moon Active 于 2026 年 1 月在两个部门裁减 110 名员工，约占 2,200 名员工的 5%，此前 2025
              年也进行了类似精简。在 Tracxn 的全球基准排名中，Moon Active 以 100 分中的 60 分排名竞争者第 53 位，落后于得分超过 80 分的 Tripledot、Nazara 和
              King。Playtika 和 Supercell 等同业拥有多产品组合，可缓冲品类轮换；Moon Active 则高度依赖 Coin Master 这台现金引擎来支撑更广泛的工作室运营。
            claimRefs:
              - CP009
