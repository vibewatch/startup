  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与经济买方
        blocks:
          - type: paragraph
            body: >-
              可投资边界比整个数字娱乐市场更窄。Moon Active 将自身描述为服务数百万玩家的移动游戏公司；Statista 则将其可测活动归入全球移动应用内购买收入，扣除平台费用并含税。Coin Master
              被明确归类为免费休闲赌场老虎机游戏。综合这些事实，核心类别是由消费者付费的免费移动游戏，且更集中于休闲 / 社交博彩类。主机和 PC
              软件、真钱赌博、仅靠广告变现的产品以及非游戏娱乐均被排除，因为留存来源没有显示这些支出流向 Moon Active。用户是玩家；经济买方和预算所有者，是进行自主应用内购买的玩家群体。
