      - number: '2.2'
        title: 规模证据及其局限
        blocks:
          - type: paragraph
            body: >-
              公开量化证据足以证明商业规模，但口径过于异质，无法据此测算市场。GetLatka 报告 2024 年 12 月年收入为 $1.1B，同时明确显示没有记录来源。Prospeo 显示年收入
              $1.5B，但未说明期间；GamesIndustry.biz 在 2021 年文章中报道上一年度收入为 $1.25B，并预计出版当年收入为 $1.5B。据报道，Coin Master
              在该文发表时累计用户消费已超过 $2B。这些数字分别代表公司收入、预期收入和产品累计消费，期间和分母都不同；没有一个是 TAM。Statista 确认了相关指标口径，但精确的 2025
              年数字设有付费墙。因此得到的是受证据约束的规模阶梯，而不是数值化 TAM/SAM/SOM。
