          unit: lifetime user spending
          detail: 截至 2021 年有报道；是产品累计支出，不是年度市场收入。
    approximationNotes: $1.1B-$1.5B 的展示值来自不可直接比较的第三方公司收入报告区间，并非计算所得的估算值。由于没有合格的保留来源提供可辩护的数值，更宽的各层均刻意不作量化。
    claimRefs:
