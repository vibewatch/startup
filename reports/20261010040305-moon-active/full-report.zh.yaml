  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局架构与同业分类
        blocks:
          - type: paragraph
            body: >-
              Moon Active 在全球移动休闲游戏和社交博彩生态中竞争，面对广泛的竞争者。Tracxn 的风险投资情报跟踪移动游戏领域 8,395 家活跃竞争者，其中 368 家获得风险投资、299
              家完成流动性退出。在这个拥挤市场中，startuphub.ai 根据直接品类和功能重合度，将 Playtika、Supercell 和 Sneaky Panda 列为 Moon Active
              最接近的替代者。Tracxn 的竞争排名突出显示了头部既有企业，包括 Tripledot（融资 $202M）、Nazara（融资 $128M）、King、Zynga（融资 $526M）和
              Playtika（早期融资 $1.5M）。竞争者的资本状况仍在变化：Nazara 于 2025 年 1 月获得 $60M
              融资便是例证。这些同业覆盖多种战略类型，从多元化上市集团到灵活的风险投资支持型休闲游戏发行商，加剧了对玩家参与度和应用商店自然曝光的争夺。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
