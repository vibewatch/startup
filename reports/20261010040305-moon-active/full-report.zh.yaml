              - CO005
              - CO008
      - number: '1.4'
        title: 战略增长里程碑、产品组合扩张与重组
        blocks:
          - type: paragraph
            body: >-
              Moon Active 在 2011 至 2026 年间通过重大战略交易和运营调整，从单一爆款社交博彩开发商逐步发展为多元化休闲游戏工作室。公司凭借 Coin Master 建立全球市场主导地位后，于 2020
              年 12 月以超过 $100M 收购白俄罗斯休闲游戏开发商 Melsoft，将 Family Island 和 My Cafe 纳入产品组合。2022 年 12 月，Moon Active 以估计 $100M 至
              $150M 的价格从 Good Job Games 收购益智消除游戏 Zen Match 及其伊斯坦布尔团队。2024 年 5 月，Moon Active 以 $50M 投资土耳其开发商 Spyke
              Games，取得 15.9% 股份，进一步扩大休闲游戏布局。尽管实现了这些扩张里程碑，公司仍于 2025 年 1 月和 2026 年 1 月启动组织重组，第二轮裁减 110 名员工以优化成本。与此同时，Moon
              Active 于 2026 年 6 月签署 Givatayim Beyond Towers 的 10 年租约，租用 22,000 平方米，推进长期实体办公整合。
