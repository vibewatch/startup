  - id: FI001
    title: 玩家变现与现金转化流程
    type: flow
    summary: 以连续流程展示玩家获取、免费游戏参与、应用内变现门槛、平台费用扣除和净现金生成。
    approximationNotes: 流程展示的是简化的休闲游戏变现经济学；各阶段的确切转化率和产品层面利润率属于非公开信息。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI006
      - CI007
    data:
      nodes:
        - id: acquisition
          label: 1. 玩家获取
          detail: 通过应用商店自然发现和付费效果广告活动获取全球移动玩家
        - id: free-play
          label: 2. 免费游戏进程
          detail: 每日转盘额度和社交突袭机制在无需预付费的情况下驱动核心参与
        - id: monetization-gate
          label: 3. Live-ops 变现门槛
          detail: 转盘耗尽和竞技突袭活动触发动态应用内购买弹窗
        - id: iap-conversion
          label: 4. 应用内购买转化
          detail: 付费玩家购买可消耗虚拟货币礼包（$1.99 至 $99.99）
        - id: platform-split
          label: 5. 平台佣金扣除
          detail: Apple 和 Google 从移动应用商店交易中抽取最高 30% 的平台费用
        - id: net-cash
          label: 6. 工作室净现金生成
          detail: 剩余经营现金流用于用户获取再投资、管理费用和资本承诺
  - id: FE001
    title: Moon Active 端到端游戏制作与实时运营技术栈
    type: stack
    summary: 通过六层架构图展示移动运行时、资产管线、核心平台微服务、云数据层、开发者加速和治理。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE009
      - CE014
    data:
      layers:
        - label: 客户端应用与呈现层
          detail: 基于 Unity、使用 C# 脚本构建的跨平台移动客户端，负责 iOS 和 Android 设备上的 2D 图形渲染、本地动画及玩家触控交互。
          items:
            - Unity 2D 游戏运行时引擎
            - 跨平台移动封装（Apple iOS / Android）
            - 本地触控控制器与事件处理器
        - label: 创意制作与设计系统管线
          detail: 协作式资产创建管线，统一 2D 图形资产、UI 组件和变现线框图。
          items:
            - Figma 设计系统组件库
            - Adobe Photoshop 2D 资产工具链
            - 技术美术集成脚本
        - label: 核心平台微服务层
          detail: 核心平台工程团队搭建的集中式实时游戏服务网格，为所有工作室产品提供服务。
          items:
            - 高并发 Golang 微服务
            - 实时游戏状态同步器
            - 社交进度与事件匹配引擎
        - label: 数据持久化与云基础设施
          detail: 覆盖 AWS 和 GCP 的多云托管布局，配备专用关系型数据库和内存缓存层。
          items:
            - Redis 内存会话缓存
            - MySQL 与 PostgreSQL 集群数据库
            - AWS 与 GCP 多区域云计算
        - label: AI 加速与开发者生产力
          detail: AI 优先的开发者和设计师工作流，提升工程产出并加速原型验证。
          items:
            - LLM 编码助手（Claude Code、Cursor）
            - 生成式 AI 艺术与原型脚本
            - 自动化 CI/CD 交付（GitLab、Jenkins）
        - label: 可观测性、遥测与玩家反馈
          detail: 应用性能监控、崩溃诊断和经过身份验证的玩家反馈运营。
          items:
            - Firebase Crashlytics 与错误日志
            - New Relic APM 性能监控
            - SurveySparrow 单点登录门户
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示玩家从初始获取、核心留存循环、变现摩擦点到客户满意度结果的完整生命周期。
    data:
      items:
        - label: 1. 发现与用户获取
          detail: 社交媒体上的效果广告活动和应用商店自然搜索，推动玩家首次下载游戏。
          touchpoints:
            - App Store 与 Google Play 推荐列表
            - 付费效果营销视频广告
            - 社交媒体病毒式推荐链接
        - label: 2. 新手引导与首次会话
          detail: 新玩家获得免费初始转盘，并快速完成早期村庄，以建立心理投入。
          touchpoints:
            - 入门转盘奖励
            - 教程村庄进度
            - 即时正向奖励反馈
        - label: 3. 核心玩法与社交习惯
          detail: 每日转盘上限制造定时回访机制，促使朋友突袭和攻击村庄。
          touchpoints:
            - 每日转盘补充计时器
            - 社交突袭通知
            - 收藏卡牌交易活动
        - label: 4. 变现触发与付费墙
          detail: 定时活动期间免费转盘耗尽，会触发激进的微交易购买提示。
          touchpoints:
            - 限时转盘礼包弹窗
            - 经过 A/B 测试的商店优惠界面
            - 活动里程碑完成门槛
        - label: 5. VIP 付费者习惯化
          detail: 付费群体转入高额付费者赛事层级，为专注付费玩家带来较高生命周期价值。
          touchpoints:
            - 个性化 live-ops 套餐优惠
            - 高风险突袭倍数
            - 赛事排行榜状态
        - label: 6. 疲劳、流失与投诉
          detail: 激进的付费获胜门槛和交易故障让玩家失望，并带来公开负面评价。
          touchpoints:
            - 不购买真钱商品就会卡住进度
            - 账单差异与未兑现的商品
            - 提交 Trustpilot 一星评价
    approximationNotes: 旅程阶段依据有记录的游戏设计循环、变现岗位描述以及公开评价库中的用户投诉模式建模。
    claimRefs:
      - CU005
      - CU006
      - CU011
      - CU012
