figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 记录 Moon Active 2011—2026 年的公司发展、关键融资交易、主要工作室收购和运营里程碑。
    approximationNotes: null
    data:
      items:
        - date: '2011'
          label: 在特拉维夫成立
          detail: Samuel Albin 创立 Moon Active，打造社交和移动游戏体验。
          tone: neutral
        - date: '2015'
          label: Coin Master 上线
          detail: Moon Active 推出 Coin Master，随后成长为收入数十亿美元的社交赌场爆款。
          tone: positive
        - date: 2016-07
          label: 种子轮
          detail: Fastforward Innovations 领投早期投资轮，支持工作室扩张。
          tone: positive
        - date: 2020-01
          label: Insight Partners $125M 投资
          detail: Insight Partners 领投 $125M 二级投资，将公司估值定为 $1.25B。
          tone: positive
        - date: 2020-12
          label: 收购 Melsoft
          detail: Moon Active 以超过 $100M 的交易金额收购 Melsoft（Family Island、My Cafe）。
          tone: positive
        - date: 2021-11
          label: $5B 估值二级轮
          detail: Insight Partners 领投 $300M 二级交易，将 Moon Active 估值定为 $5B。
          tone: positive
        - date: 2022-12
          label: 收购 Zen Match
          detail: 据估计，从 Good Job Games 收购 Zen Match 和伊斯坦布尔工作室的价格为 $100M-$150M。
          tone: positive
        - date: 2024-05
          label: 投资 Spyke Games
          detail: 投资 $50M，获得土耳其益智游戏开发商 Spyke Games 15.9% 的股权。
          tone: positive
        - date: 2026-01
          label: 员工重组
          detail: 在两个部门裁撤 110 名员工，约占员工总数的 5%。
          tone: adverse
        - date: 2026-06
          label: Beyond Towers 总部租约
          detail: 在 Givatayim 签署 10 年租约，面积 22,000 平方米，年成本 NIS 33M。
          tone: positive
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
