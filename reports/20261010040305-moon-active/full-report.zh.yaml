      - number: '1.2'
        title: 执行领导层与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Moon Active 由创始人兼 CEO Samuel Albin 集中领导；自 2011 年以来，他一直掌舵公司发展、产品规模化以及并购。执行管理团队包括 CTO Eran
              Koren，负责在线运营游戏架构、分布式服务器基础设施和新兴人工智能项目；CFO Hadas Gazit 负责资本结构、财务风险和资金管理。CMO Rony Teitelbaum
              领导营销及效果型用户获取。Albin 从早期初创公司一路带领 Moon Active 成为数十亿美元企业，始终兼任执行和运营领导，因此公司对其战略判断的关键人物依赖仍然很高。此外，作为一家以色列私营实体，Moon
              Active 的董事会构成和投票协议仍高度不透明。
            claimRefs:
              - CO001
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
      - number: '1.3'
        title: 资本结构、融资历史与二级流动性
        blocks:
          - type: paragraph
            body: >-
              Moon Active 的已披露融资路径不同于传统风险投资支持的软件公司：公司主要依靠后期老股交易，而不是反复注入新股资本。2016 年 7 月由 Fastforward Innovations
              牵头完成早期种子投资后，Moon Active 直到 2020 年 1 月才披露定价风险投资轮；当时成长型股权投资公司 Insight Partners 牵头，以投后估值 $1.25B 完成 $125M
              二级投资。2021 年 11 月，Insight Partners 又在 Andalusian Private Capital 参与下牵头完成 $300M 二级交易，将 Moon Active 定价为 $5.0B
              估值。公开记录中的累计融资约为 $425M，但这些后期交易为早期股东和员工提供了流动性，而非为资产负债表增加现金。已披露的少数股东包括天使投资人 Gigi Levy-Weiss、Guy Gamzu 和 David
              Alliance，详细股权结构表权利仍属机密。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
