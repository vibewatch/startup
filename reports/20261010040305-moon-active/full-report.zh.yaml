      - number: '3.4'
        title: 切换成本、分发瓶颈与负面情绪
        blocks:
          - type: paragraph
            body: >-
              Moon Active 竞争结构中的根本脆弱点，是缺乏经济切换壁垒。休闲移动玩家切换产品无需付出任何金钱成本，并且经常在 iOS 和 Android 上同时使用多个竞品，包括益智、三消和社交老虎机游戏。Moon
              Active 保持着显著运营规模，于 2026 年 6 月承诺租用 Givatayim Beyond Towers 的 22,000 平方米办公空间，租约价值 $110M。但负面消费者情绪凸显了留存摩擦：Moon
              Active 在 Trustpilot 上评分仅为 1.6 /
              5，用户抱怨激进的付费取胜机制和算法限制旋转次数。此外，私营公司信息不透明，使关键尽调参数仍无答案：产品层面贡献利润率、用户获取回本周期以及面向消费者的网页商店销售占比，相比公开披露的同业均未公开。
