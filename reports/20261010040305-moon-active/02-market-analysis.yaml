schemaVersion: "report-v2"
artifact: market-analysis
slug: moon-active
runDate: 2026-10-10
company:
  name: Moon Active
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Moon Active participates in global free-to-play mobile gaming, with its clearest
    evidenced exposure in casual, social-casino-like in-app-purchase entertainment.
    The retained evidence demonstrates substantial company and title scale, but it does
    not establish a market-wide TAM, a serviceable segment, or a defensible obtainable
    share; those quantities remain diligence gaps rather than modeled precision.
sections:
  - id: market-boundary
    title: Market boundary and economic buyer
    body: >-
      The investable boundary is narrower than digital entertainment as a whole. Moon
      Active describes itself as a mobile-game company serving millions of players, and
      Statista places its measured activity in worldwide mobile in-app-purchase revenue,
      net of platform fees and inclusive taxes. Coin Master is specifically identified
      as a free-to-play casual casino slot title. Together, those facts support a core
      category of consumer-funded, free-to-play mobile games, with a narrower
      casual/social-casino-like exposure. Console and PC software, real-money gambling,
      advertising-only monetization, and non-game entertainment are excluded because the
      retained sources do not show that spend flowing to Moon Active. The user is the
      player; the economic buyer and budget owner is the subset of players making
      discretionary in-app purchases.
    claimRefs: [CM001, CM003, CM004, CM015]
    tableRefs: [TM001, TM003]
  - id: sizing-evidence
    title: Sizing evidence and its limits
    body: >-
      Public quantitative evidence is strong enough to show commercial scale but too
      heterogeneous to size the market. GetLatka reports $1.1 billion of December 2024
      annual revenue while explicitly showing no recorded source. Prospeo displays $1.5
      billion of annual revenue without a stated period, and GamesIndustry.biz reported
      $1.25 billion for the prior year plus a $1.5 billion publication-year expectation
      in a 2021 article. Separately, Coin Master had reportedly exceeded $2 billion of
      lifetime user spending by that article's publication. These are company revenue,
      an expectation, and cumulative title spending with different periods and
      denominators; none is TAM. Statista confirms the relevant metric convention but
      paywalls the exact 2025 figure. The result is an evidence-constrained sizing ladder,
      not a numerical TAM/SAM/SOM.
    claimRefs: [CM003, CM005, CM006, CM011, CM012, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: demand-and-structure
    title: Demand drivers and market structure
    body: >-
      Demand rests on globally distributed consumer attention, free entry, recurring
      live-game engagement, and optional in-app purchases. The official site says its
      games reach millions of players, while the recruiting surface shows continued
      investment in people who create and deliver game experiences. At the same time,
      Tracxn's classification of 8,395 active competitors, including 368 funded
      companies, signals an exceptionally broad field for player attention and
      acquisition spend. The reported $2 billion of Coin Master lifetime user spending
      demonstrates that a breakout title can monetize at scale, but it does not reveal
      payer conversion, geographic mix, retention, user-acquisition payback, or the size
      of the addressable player population. Those missing operating denominators govern
      how durable the opportunity is.
    claimRefs: [CM001, CM002, CM007, CM012]
  - id: constraints-and-implications
    title: Adoption constraints and valuation implications
    body: >-
      The main constraints are trust, regulatory interpretation, platform economics,
      switching ease, and hit concentration. The captured Trustpilot page was heavily
      skewed to one-star reviews and included recurring allegations about purchase
      fulfillment, support responsiveness, and pay-to-progress mechanics; these are
      self-selected user reports rather than a representative satisfaction survey, but
      they identify specific diligence tests. GamesIndustry.biz also reported prior
      German regulatory scrutiny over gambling-like gameplay aimed at minors, while
      noting that the review board did not ban the game. Statista's convention further
      shows that platform fees and taxes sit between gross player spend and measured
      publisher revenue. Valuation should therefore be tied to verified cohort economics
      and title-level concentration, not to an unsupported top-down market multiple.
    claimRefs: [CM003, CM008, CM009, CM013, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns:
      - Segment or category
      - Included spend or activity
      - Explicit exclusions
      - Buyer or payer
      - Relevance to Moon Active
    rows:
      - - Global free-to-play mobile games
        - Optional mobile in-app purchases for game content, progression, or events
        - Console and PC software; non-game digital entertainment
        - Individual mobile-game players who choose to purchase
        - Core evidenced category
      - - Casual and social-casino-like mobile games
        - In-app purchases associated with casual casino-slot-style play
        - Real-money wagering and cash-out gambling
        - Consumer player and in-app purchaser
        - Narrower evidenced exposure through Coin Master
      - - Broader mobile-game monetization
        - Consumer attention and possible mixed monetization models
        - Advertising-only revenue and subscriptions not evidenced for Moon Active
        - Player; payer varies by monetization model
        - Adjacency, not included in the constrained core
      - - Status-quo substitutes
        - Free entertainment time and competing mobile games
        - No assumption that substitute attention converts to addressable spend
        - Consumer controls both time and discretionary budget
        - Raises switching and acquisition pressure
    notes: >-
      Boundary is inferred from the official company description, Statista's worldwide
      mobile-IAP convention, and Coin Master's free-to-play casual-casino classification;
      it is not a publisher-supplied market taxonomy.
    claimRefs: [CM001, CM003, CM004, CM015]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns:
      - Publisher and evidence date
      - Geography
      - Metric and value
      - Period and denominator
      - Method or source status
      - Confidence and limitation
    rows:
      - - Statista / AppMagic; released July 2025
        - Worldwide
        - Moon Active annual mobile IAP revenue; exact value paywalled
        - 2015 to 2025 YTD; net of platform fees and inclusive taxes
        - AppMagic cooperation; exact series inaccessible in retained page
        - Medium on metric definition; unusable for numerical sizing
      - - GetLatka; updated November 2025
        - Not stated
        - $1.1B annual revenue
        - December 2024 company revenue
        - Page explicitly shows source not recorded
        - Low; company revenue is not market size
      - - Prospeo; access date October 2026
        - Not stated
        - $1.5B annual revenue
        - Period not stated; company-level denominator
        - Publisher-displayed estimate with no underlying revenue source shown
        - Low; period and methodology are missing
      - - GamesIndustry.biz citing Calcalist; 2021 article
        - Not stated
        - $1.25B prior-year revenue and $1.5B publication-year expectation
        - Company revenue; historical actual plus expectation
        - Secondary reporting of Calcalist figures
        - Medium for historical scale; not current and not TAM
      - - GamesIndustry.biz citing Sensor Tower; 2021 article
        - Worldwide not established in retained text
        - Coin Master passed $2B in lifetime user spending
        - Cumulative title spend through the report date
        - Secondary reporting of Sensor Tower
        - Medium; title-level cumulative spend is not annual market revenue
    notes: >-
      Values preserve each source's metric, period, and denominator. They are not summed
      or converted into TAM/SAM/SOM because they mix company revenue, an expectation,
      cumulative user spending, and a paywalled series.
    claimRefs: [CM003, CM005, CM006, CM011, CM012, CM016]
  - id: TM003
    title: Segment, user, payer, and adoption map
    columns:
      - Segment
      - User
      - Economic buyer or payer
      - Budget owner
      - Adoption path and trigger
      - Principal constraint
    rows:
      - - Free player
        - Mobile-game participant
        - None until an optional purchase
        - Individual consumer
        - App discovery, free entry, and continued engagement
        - Abundant substitutes and near-zero switching cost
      - - In-app purchaser
        - Engaged player
        - Same individual consumer
        - Individual discretionary-entertainment wallet
        - Progression, events, convenience, or virtual-goods offer
        - Trust in fulfillment, fairness, and support
      - - Retained live-game participant
        - Returning player
        - May remain non-paying or convert later
        - Individual consumer
        - Repeated content and event cadence
        - Content fatigue and competing games
      - - Mobile platform intermediary
        - Distribution and payment platform, not the end user
        - Collects fees rather than buying the game
        - Platform operator
        - Store distribution and in-app payment processing
        - Fees, policy control, and tax treatment separate spend from publisher revenue
    notes: >-
      This is a mechanism map inferred from the free-to-play and in-app-purchase evidence,
      not a measured segmentation study; payer conversion, cohort size, geography, and
      budget allocation are unavailable.
    claimRefs: [CM001, CM003, CM004, CM008, CM009, CM015]
figures:
  - id: FM001
    title: Evidence-constrained addressability ladder
    type: pyramid
    summary: >-
      The evidence narrows from broad attention markets to Moon Active and Coin Master,
      but only the two narrowest layers have quantitative company- or title-scale proxies.
    data:
      items:
        - label: Global digital entertainment attention
          value: Unquantified
          detail: Broadest substitute set; no retained spend estimate.
        - label: Global mobile games
          value: Unquantified
          detail: Relevant distribution category, but no market-wide total was retained.
        - label: Free-to-play mobile games
          value: Unquantified
          detail: Core business-model boundary supported qualitatively.
        - label: Casual and social-casino-like mobile games
          value: Unquantified
          detail: Narrow category indicated by Coin Master's classification.
        - label: Moon Active portfolio
          value: "$1.1B-$1.5B"
          unit: reported annual company revenue
          detail: Mixed vintages and methodologies; not a serviceable market estimate.
        - label: Coin Master
          value: "$2B+"
          unit: lifetime user spending
          detail: Reported by 2021; cumulative title spending, not annual market revenue.
    approximationNotes: >-
      The $1.1B-$1.5B display is a range across non-comparable third-party company-revenue
      reports, not a calculated estimate. All broader layers remain deliberately
      unquantified because no eligible retained source supplied defensible values.
    claimRefs: [CM001, CM007, CM010, CM012, CM013, CM016]
callouts:
  - calloutType: insight
    title: Scale is evidenced; addressability is not
    body: >-
      Company revenue and title lifetime spending demonstrate commercial relevance, but
      they cannot be divided or multiplied into TAM, SAM, or SOM without market totals,
      payer cohorts, geography, and comparable period definitions.
    claimRefs: [CM005, CM006, CM011, CM012, CM016]
  - calloutType: risk
    title: Trust and regulatory friction can shorten monetization duration
    body: >-
      Self-selected review complaints and historical gambling-like-gameplay scrutiny are
      not incidence estimates, but they point to diligence on purchase fulfillment,
      support outcomes, age protections, and monetization fairness.
    claimRefs: [CM008, CM009, CM013]
