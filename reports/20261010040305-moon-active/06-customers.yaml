callouts:
  - calloutType: "risk"
    title: "Aggressive Monetization Creates Reputational and Retention Headwinds"
    body: "Moon Active's reliance on slot-machine progression loops and aggressive in-app purchase triggers has generated substantial consumer backlash, evidenced by an aggregate 1.6 out of 5 rating on Trustpilot with 88% 1-star reviews. Player complaints center on alleged unfair odds, pay-to-win barriers, and unfulfilled transactions, posing regulatory scrutiny and player churn risks."
    claimRefs:
      - "CU005"
      - "CU011"
  - calloutType: "insight"
    title: "Portfolio Diversification Mitigates Single-Title Concentration"
    body: "While Coin Master remains Moon Active's flagship engine having crossed $6 billion in lifetime revenue, secondary titles notably Travel Town ($500M lifetime spending) and Melsoft acquisitions (Family Island, My Cafe) demonstrate an expanding casual portfolio that broadens user demographics beyond social casino mechanics."
    claimRefs:
