  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic buyer
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than digital entertainment as a whole. Moon Active describes itself as
              a mobile-game company serving millions of players, and Statista places its measured activity in worldwide
              mobile in-app-purchase revenue, net of platform fees and inclusive taxes. Coin Master is specifically
              identified as a free-to-play casual casino slot title. Together, those facts support a core category of
              consumer-funded, free-to-play mobile games, with a narrower casual/social-casino-like exposure. Console
              and PC software, real-money gambling, advertising-only monetization, and non-game entertainment are
              excluded because the retained sources do not show that spend flowing to Moon Active. The user is the
              player; the economic buyer and budget owner is the subset of players making discretionary in-app
              purchases.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
              - CM009
              - CM015
      - number: '2.2'
        title: Sizing evidence and its limits
        blocks:
          - type: paragraph
            body: >-
              Public quantitative evidence is strong enough to show commercial scale but too heterogeneous to size the
              market. GetLatka reports $1.1 billion of December 2024 annual revenue while explicitly showing no recorded
              source. Prospeo displays $1.5 billion of annual revenue without a stated period, and GamesIndustry.biz
              reported $1.25 billion for the prior year plus a $1.5 billion publication-year expectation in a 2021
              article. Separately, Coin Master had reportedly exceeded $2 billion of lifetime user spending by that
              article's publication. These are company revenue, an expectation, and cumulative title spending with
              different periods and denominators; none is TAM. Statista confirms the relevant metric convention but
              paywalls the exact 2025 figure. The result is an evidence-constrained sizing ladder, not a numerical
              TAM/SAM/SOM.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.3'
        title: Demand drivers and market structure
        blocks:
          - type: paragraph
            body: >-
              Demand rests on globally distributed consumer attention, free entry, recurring live-game engagement, and
              optional in-app purchases. The official site says its games reach millions of players, while the
              recruiting surface shows continued investment in people who create and deliver game experiences. At the
              same time, Tracxn's classification of 8,395 active competitors, including 368 funded companies, signals an
              exceptionally broad field for player attention and acquisition spend. The reported $2 billion of Coin
              Master lifetime user spending demonstrates that a breakout title can monetize at scale, but it does not
              reveal payer conversion, geographic mix, retention, user-acquisition payback, or the size of the
              addressable player population. Those missing operating denominators govern how durable the opportunity is.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM012
      - number: '2.4'
        title: Adoption constraints and valuation implications
        blocks:
          - type: paragraph
            body: >-
              The main constraints are trust, regulatory interpretation, platform economics, switching ease, and hit
              concentration. The captured Trustpilot page was heavily skewed to one-star reviews and included recurring
              allegations about purchase fulfillment, support responsiveness, and pay-to-progress mechanics; these are
              self-selected user reports rather than a representative satisfaction survey, but they identify specific
              diligence tests. GamesIndustry.biz also reported prior German regulatory scrutiny over gambling-like
              gameplay aimed at minors, while noting that the review board did not ban the game. Statista's convention
              further shows that platform fees and taxes sit between gross player spend and measured publisher revenue.
              Valuation should therefore be tied to verified cohort economics and title-level concentration, not to an
              unsupported top-down market multiple.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is evidenced; addressability is not
            body: >-
              Company revenue and title lifetime spending demonstrate commercial relevance, but they cannot be divided
              or multiplied into TAM, SAM, or SOM without market totals, payer cohorts, geography, and comparable period
              definitions.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM016
          - type: callout
            title: Trust and regulatory friction can shorten monetization duration
            body: >-
              Self-selected review complaints and historical gambling-like-gameplay scrutiny are not incidence
              estimates, but they point to diligence on purchase fulfillment, support outcomes, age protections, and
              monetization fairness.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Architecture and Peer Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Moon Active competes across the global mobile casual gaming and social casino ecosystem against an
              expansive competitive field. Venture intelligence from Tracxn tracks 8,395 active competitors in the
              mobile gaming domain, of which 368 are venture-funded and 299 have executed liquidity exits. Within this
              crowded market, startuphub.ai identifies Playtika, Supercell, and Sneaky Panda as Moon Active's closest
              alternatives based on direct category and feature overlap. Tracxn's competitive ranking highlights
              top-tier incumbents including Tripledot ($202 million in funding), Nazara ($128 million in funding), King,
              Zynga ($526 million in funding), and Playtika ($1.5 million in early funding). Competitor capitalization
              continues to evolve, as seen when Nazara secured a $60 million funding round in January 2025. These peers
              span diverse strategic archetypes, from diversified public conglomerates to agile venture-backed casual
              publishers, intensifying competition for player engagement and organic store visibility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
              - CP013
      - number: '3.2'
        title: Core Mechanics, Gameplay Differentiation, and Live-Ops Execution
        blocks:
          - type: paragraph
            body: >-
              Moon Active's primary competitive differentiation centers on Coin Master, a hybrid casual social title
              that blends slot machine spin mechanics with village-building and aggressive player-versus-player raids.
              According to Sensor Tower store intelligence reported by Calcalist CTech, Coin Master surpassed $6 billion
              in lifetime player spending in 2024 and has generated approximately $1.2 billion annually since 2020. The
              company positions its competitive edge on combining human creative talent with proprietary next-generation
              artificial intelligence to produce engaging entertainment. Operationally, Moon Active deploys specialized
              monetization teams, recruiting monetization artists responsible for designing high-conversion offer
              screens, shop flows, and promotional event banners iterated against granular A/B test data and player
              performance metrics. This systematic live-ops execution allows Moon Active to extract high average revenue
              per paying user compared to conventional casual puzzle alternatives.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: Strategic Positioning, Scale Disparities, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Despite Coin Master's massive financial scale, Moon Active's competitive moat displays notable asymmetries
              when benchmarked against diversified incumbents. Moon Active has raised minimal primary venture capital,
              relying on secondary transactions including a $300 million secondary sale at a $5 billion to $6 billion
              valuation in November 2021. To maintain operational efficiency, Moon Active trimmed 110 employees
              (approximately 5% of its 2,200 workforce) in January 2026 across two units, following similar streamlining
              in 2025. In Tracxn's global benchmarking, Moon Active ranks 53rd among competitors with a score of 60 out
              of 100, trailing market leaders like Tripledot, Nazara, and King who hold scores above 80. While peers
              like Playtika and Supercell maintain diversified multi-title portfolios that cushion against genre
              rotation, Moon Active remains highly dependent on Coin Master's cash engine to fund broader studio
              operations.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: Switching Costs, Distribution Bottlenecks, and Adverse Sentiment
        blocks:
          - type: paragraph
            body: >-
              A fundamental vulnerability in Moon Active's competitive structure is the absence of economic switching
              barriers. Casual mobile gamers incur zero monetary cost when switching titles and routinely multi-home
              across competing puzzle, match-three, and social slot games on iOS and Android. Moon Active maintains
              significant operational scale, committing in June 2026 to a 10-year lease for 22,000 square meters in
              Givatayim's Beyond Towers valued at $110 million. However, adverse consumer sentiment highlights retention
              friction: on Trustpilot, Moon Active holds a 1.6 out of 5 rating, with user reviews complaining of
              aggressive pay-to-win mechanics and algorithmic spin throttling. Furthermore, private-company opacity
              leaves critical diligence parameters unanswered, as title-level contribution margins, user acquisition
              payback periods, and direct-to-consumer web store sales shares remain undisclosed relative to publicly
              reporting peers.
            claimRefs:
              - CP011
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP011
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration Risk and Player Multi-Homing
            body: >-
              While Moon Active has demonstrated exceptional monetization through Coin Master, its portfolio lacks the
              multi-franchise depth of incumbents like Playtika, Zynga, or Supercell. With zero consumer switching costs
              and aggressive live-ops competition across thousands of mobile titles, Moon Active remains exposed to
              player fatigue and platform policy shifts.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Scale, and Portfolio Mix
        blocks:
          - type: paragraph
            body: >-
              Moon Active has established rare commercial scale within mobile gaming, generating approximately $2
              billion in annual revenue across both 2024 and 2025 according to secondary market intelligence from
              PitchBook and Globes. This top-line volume is overwhelmingly concentrated in Coin Master, which has
              accumulated more than $4 billion in lifetime player expenditure since its 2016 launch. Coin Master
              operates on a free-to-play social casino model that monetizes player progression through virtual slot
              machine spins, village upgrades, and competitive social raids. To broaden its revenue base and reduce
              single-title exposure, Moon Active acquired Belarusian-founded studio Melsoft in December 2020 for over
              $100 million, adding casual adventure titles such as Family Island and My Cafe to its active catalog.
              Nevertheless, the business remains fundamentally anchored to Coin Master live-ops performance, creating
              substantial revenue concentration risk.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI007
      - number: '4.2'
        title: Monetization Architecture and Live-Ops Pricing
        blocks:
          - type: paragraph
            body: >-
              Monetization inside Moon Active titles relies on aggressive live-ops event cadence, dynamic promotional
              popups, and algorithmic pricing segmentation. In-game store items range from $1.99 micro-bundles of spins
              to premium $99.99 coin and booster packs, with pricing dynamically personalized based on player engagement
              history, spend propensity, and progression friction. Moon Active employs specialized monetization artists
              and data scientists to continuously test and refine shop flows, banner placements, and reward pacing
              through multivariate A/B testing. However, this hyper-optimized monetization loop has generated
              substantial adverse consumer sentiment. On public review platforms including Trustpilot, players
              consistently criticize aggressive pay-to-win mechanics, alleging artificial win-rate throttling after
              in-app purchases and unresponsive customer support for failed virtual goods fulfillment. This dynamic
              creates persistent player churn that necessitates substantial ongoing user acquisition spend.
            claimRefs:
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: Unit Economics, Margin Drivers, and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Moon Active operating cost structure is dominated by platform distribution fees, user acquisition
              marketing, and engineering personnel. Distribution through Apple App Store and Google Play incurs standard
              platform commissions of up to 30%, which serve as the primary component of cost of goods sold for mobile
              microtransactions. With estimated headcount around 2,000 employees globally, third-party benchmarks
              project annual revenue per employee at roughly $712,000, signaling robust operating leverage. Fixed
              capital commitments include a 10-year, $110 million commercial office lease signed in June 2026 for 22,000
              square meters in Tidhar Beyond Towers in Givatayim. Operating cost management has also driven workforce
              rationalization: the company executed two restructuring rounds, eliminating 110 positions in January 2026
              following an earlier cut of dozens of roles in 2025, primarily consolidating redundant roles from the
              Melsoft acquisition.
            claimRefs:
              - CI006
              - CI007
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Moon Active exhibits a rare financing profile among high-growth private tech unicorns: the business has
              funded its operational expansion and acquisitions primarily through internal operating cash flows rather
              than external primary capital dilution. Public funding databases show $126 million in recorded funding,
              while secondary transactions totaled $425 million, led by Insight Partners with a $125 million purchase in
              January 2020 and a $300 million secondary transaction in November 2021 that valued the business at $5
              billion. At a $5 billion to $6 billion valuation on $2 billion in annual revenue, Moon Active implied
              trailing EV/revenue multiple sits between 2.5x and 3.0x, in line with mature social gaming comps like
              Playtika. However, private ownership obscures critical underwriting inputs: audited GAAP financials,
              EBITDA profitability, cash balances, debt facilities, and title-level UA payback windows remain completely
              confidential.
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration Risk on Single Flagship Title
            body: >-
              Moon Active reported $2 billion revenue base remains overwhelmingly reliant on Coin Master. While
              acquisitions like Melsoft and new titles provide modest portfolio spread, failure to sustain Coin Master
              live-ops engagement poses immediate top-line risk.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: callout
            title: Secondary Liquidity vs Balance Sheet Cash
            body: >-
              Moon Active headline $300 million and $125 million funding events were secondary share sales facilitating
              shareholder liquidity rather than primary capital injections into company treasury. Operational
              self-funding from operating cash flows has financed its acquisitions and facilities.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Core Gameplay Loop Mechanics
        blocks:
          - type: paragraph
            body: >-
              Moon Active operates as a premier mobile gaming studio best recognized for its global flagship title Coin
              Master, alongside an expanding portfolio of casual and social mobile games. The core product experience
              pairs accessible casual slot-machine spinning mechanics with meta-game village construction, base raiding,
              and card collection mechanics. Players expend limited spin allowances to earn virtual currency, shield
              defensive structures, or initiate competitive raids against connected social friends. This hybrid gameplay
              loop transforms traditional single-player casual entertainment into an emotionally charged social
              competition. The underlying game clients are engineered on the Unity engine, providing responsive 2D
              rendering and rapid cross-platform deployment across iOS and Android ecosystems. By standardizing
              technical art asset delivery pipelines and maintaining an enterprise design system, Moon Active rapidly
              updates game assets, limited-time seasonal themes, and localized live events without requiring full binary
              client rebuilds.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
      - number: '5.2'
        title: Live Operations, Player Experience, and Monetization Workflows
        blocks:
          - type: paragraph
            body: >-
              The commercial durability of Moon Active's titles rests on an intensive live operations (live-ops)
              workflow executed by interdisciplinary squads of product managers, game designers, and UI/UX specialists.
              Using Figma-based design systems and technical art pipeline automation, product teams design and test
              promotional offer flows, dynamic monetization events, and customized player progression tracks. Live-ops
              cadence is accelerated by deploying generative artificial intelligence tooling to automate 2D variations
              and prototype interactive game features rapidly. User experience workflows balance aggressive monetization
              prompts with core player enjoyment, continuously calibrating spin recharge cadences, event milestones, and
              tournament leaderboards against key performance indicators. The company collects player sentiment and
              qualitative usability feedback through dedicated survey infrastructure secured via enterprise single
              sign-on, ensuring that product iteration is informed by both telemetry and player feedback.
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE011
      - number: '5.3'
        title: Core Platform Architecture, Cloud Infrastructure, and Technical Stack
        blocks:
          - type: paragraph
            body: >-
              Underpinning Moon Active's multi-studio operations is a centralized Core Platform engineering organization
              responsible for shared infrastructure, high-concurrency real-time networking, and backend game services.
              The backend architecture is built primarily in Golang as a distributed microservice topology designed to
              support millions of concurrent active users with minimal latency. Data persistence is organized across a
              multi-tier database infrastructure featuring MySQL and PostgreSQL for relational user records and Redis
              in-memory clusters for high-speed session management and live event state tracking. Infrastructure is
              hosted across leading public cloud providers, utilizing both Amazon Web Services and Google Cloud Platform
              compute instances. Engineering teams incorporate advanced developer workflows, integrating automated CI/CD
              pipelines via GitLab and Jenkins alongside AI-assisted development tools like Claude Code and Cursor to
              accelerate development velocity while enforcing rigorous code quality across studios.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
