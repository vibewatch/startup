    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronology of Moon Active's corporate development, key funding transactions, major studio acquisitions, and
      operational milestones from 2011 to 2026.
    approximationNotes: null
    data:
      items:
        - date: '2011'
          label: Founding in Tel Aviv
          detail: Samuel Albin establishes Moon Active to build social and mobile gaming experiences.
          tone: neutral
        - date: '2015'
          label: Coin Master Launch
          detail: Moon Active launches Coin Master, which grows into a multi-billion dollar social casino hit.
          tone: positive
        - date: 2016-07
          label: Seed Round
          detail: Fastforward Innovations leads early-stage investment round to support studio expansion.
          tone: positive
        - date: 2020-01
          label: Insight Partners $125M Investment
          detail: Insight Partners leads $125 million secondary investment valuing the company at $1.25 billion.
          tone: positive
        - date: 2020-12
          label: Melsoft Acquisition
          detail: Moon Active acquires Melsoft (Family Island, My Cafe) in a deal valued over $100 million.
          tone: positive
        - date: 2021-11
          label: $5B Valuation Secondary Round
          detail: Insight Partners leads $300 million secondary transaction valuing Moon Active at $5 billion.
          tone: positive
        - date: 2022-12
          label: Zen Match Acquisition
          detail: Acquires Zen Match and Istanbul studio from Good Job Games for an estimated $100M-$150M.
          tone: positive
        - date: 2024-05
          label: Investment in Spyke Games
          detail: Invests $50 million for a 15.9% equity stake in Turkish puzzle developer Spyke Games.
          tone: positive
        - date: 2026-01
          label: Workforce Restructuring
          detail: Implements organizational layoffs of 110 employees (about 5% of staff) across two units.
