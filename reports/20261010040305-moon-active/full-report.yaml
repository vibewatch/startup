      - CI003
      - CI004
      - CI006
      - CI007
    data:
      nodes:
        - id: acquisition
          label: 1. Player Acquisition
          detail: Organic app store discovery and paid performance ad campaigns acquiring global mobile players
        - id: free-play
          label: 2. Free-to-Play Progression
          detail: Daily spin allowances and social raid mechanics driving core engagement without upfront payment
        - id: monetization-gate
          label: 3. Live-Ops Monetization Gate
          detail: Spin depletion and competitive raid events triggering dynamic in-app purchase offer popups
        - id: iap-conversion
          label: 4. In-App Purchase Conversion
          detail: Payer conversion purchasing consumable virtual currency bundles ($1.99 to $99.99)
        - id: platform-split
          label: 5. Platform Commission Deduction
          detail: Apple and Google retain up to 30% platform fee on mobile app store transactions
        - id: net-cash
          label: 6. Studio Net Cash Generation
          detail: Residual operating cash flow funding user acquisition reinvestment, overhead, and capital commitments
  - id: FE001
    title: Moon Active End-to-End Game Production and Live Operations Stack
    type: stack
    summary: >-
      Six-layer architectural map illustrating mobile runtime, asset pipelines, core platform microservices, cloud data
      tier, developer acceleration, and governance.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE009
      - CE014
    data:
      layers:
        - label: Client Application & Presentation Layer
          detail: >-
            Cross-platform mobile client built on Unity with C# scripting, handling 2D graphics rendering, local
            animations, and player touch interactions on iOS and Android devices.
          items:
            - Unity 2D Game Runtime Engine
            - Cross-Platform Mobile Wrapper (Apple iOS / Android)
            - Local Touch Controller & Event Handler
        - label: Creative Production & Design Systems Pipeline
          detail: >-
            Collaborative asset creation pipeline standardizing 2D graphic assets, UI components, and monetization
            wireframes.
          items:
            - Figma Design System Component Library
            - Adobe Photoshop 2D Asset Toolchain
            - Technical Art Integration Scripts
        - label: Core Platform Microservices Tier
          detail: >-
            Centralized real-time game service mesh constructed by the Core Platform engineering team to serve all
            studio titles.
          items:
            - High-Concurrency Golang Microservices
            - Real-Time Game State Synchronizer
            - Social Progression & Event Matching Engine
        - label: Data Persistence & Cloud Infrastructure
          detail: Multi-cloud hosting footprint spanning AWS and GCP with dedicated relational and in-memory caching tiers.
          items:
            - Redis In-Memory Session Cache
            - MySQL & PostgreSQL Clustered Databases
            - AWS & GCP Multi-Region Cloud Compute
        - label: AI Acceleration & Developer Productivity
          detail: AI-first developer and designer workflows augmenting engineering throughput and rapid prototype validation.
          items:
            - LLM Coding Assistants (Claude Code, Cursor)
            - Generative AI Art & Prototyping Scripts
            - Automated CI/CD Delivery (GitLab, Jenkins)
        - label: Observability, Telemetry & Player Feedback
          detail: Application performance monitoring, crash diagnostics, and authenticated player feedback operations.
          items:
            - Firebase Crashlytics & Error Logging
            - New Relic APM Performance Monitoring
            - SurveySparrow Single Sign-On Portal
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Player lifecycle from initial acquisition through core retention loops, monetization friction points, and customer
      satisfaction outcomes.
    data:
      items:
        - label: 1. Discovery & User Acquisition
          detail: Performance ad campaigns across social media and organic app store search drive initial game downloads.
          touchpoints:
            - App Store & Google Play featured listings
            - Paid performance marketing video ads
            - Social media viral referral links
        - label: 2. Onboarding & First Session
          detail: New players receive free starter spins and rapid early village completion to build psychological investment.
          touchpoints:
            - Introductory spin bonuses
            - Tutorial village progression
            - Immediate positive reward feedback
        - label: 3. Core Gameplay & Social Habituation
          detail: Daily spin limits create appointment mechanics, prompting friends to raid and attack villages.
          touchpoints:
            - Daily spin replenishment timer
            - Social raiding notifications
            - Collectible card trade events
        - label: 4. Monetization Trigger & Paywall
          detail: Exhaustion of free spins during timed events triggers aggressive microtransaction purchase prompts.
          touchpoints:
            - Time-limited spin bundle popups
            - A/B tested shop offer screens
            - Event milestone completion gates
        - label: 5. VIP Spender Habituation
          detail: Paying cohorts convert to high-roller tournament tiers, driving high lifetime value for dedicated spenders.
          touchpoints:
            - Personalized live-ops package offers
            - High-stakes raid multipliers
            - Tournament leaderboard status
        - label: 6. Fatigue, Churn & Complaints
          detail: >-
            Aggressive pay-to-win barriers and transaction glitches lead to player disillusionment and public negative
            reviews.
          touchpoints:
            - Progress stalling without real-money purchases
            - Billing discrepancies and unfulfilled items
            - Trustpilot 1-star review submissions
    approximationNotes: >-
      Journey stages modeled on documented game design loops, monetization job descriptions, and user complaint patterns
      across public review repositories.
    claimRefs:
