    summary: >-
      Sequential flow illustrating player acquisition, free-to-play engagement, in-app monetization gating, platform fee
      deduction, and net cash generation.
    approximationNotes: >-
      Flow illustrates stylized casual gaming monetization economics; exact stage conversion percentages and title-level
      margins are private.
    claimRefs:
