chapter:
  number: 1
  title: "Company Overview"
  summary: "Moon Active is a Tel Aviv-headquartered mobile gaming studio founded in 2011 by CEO Samuel Albin, globally recognized for its multi-billion-dollar social casino hit Coin Master. The company expanded into casual puzzles through acquisitions of Melsoft and Zen Match alongside minority investments in Spyke Games, achieving a $5.0 billion private valuation in late 2021 before implementing organizational restructurings in 2025 and 2026."
sections:
  - id: "corporate-identity-and-foundations"
    title: "Corporate Identity and Operational Foundations"
    body: "Moon Active was founded in April 2011 by Samuel Albin and has established its corporate headquarters at 42A Maze Street in Tel Aviv-Yafo, Israel. Operating as a private consumer mobile entertainment studio, Moon Active focuses on developing, scaling, and operating mobile casual games across iOS, Android, and Facebook platforms. The company's business model relies on free-to-play mechanics driven by in-app purchases of virtual currency, spins, and progression items. Across its operating history, Moon Active has expanded its physical presence beyond Israel, establishing technical development hubs, creative studios, and live-operations offices across Warsaw, London, Bucharest, Kyiv, Bangkok, and Istanbul. While the studio's portfolio includes multiple titles, Coin Master represents its primary operational cornerstone, generating over $2 billion in lifetime player spending and driving the scale that funds broader corporate initiatives."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Executive Leadership and Key-Person Structure"
    body: "Moon Active operates under the centralized executive direction of founder and Chief Executive Officer Samuel Albin, who has steered corporate development, title scaling, and mergers and acquisitions since 2011. The executive management team includes Chief Technology Officer Eran Koren, who directs live-operations game architecture, distributed server infrastructure, and emerging artificial intelligence initiatives, alongside Chief Financial Officer Hadas Gazit, who oversees capitalization, financial risk, and treasury management. Marketing and performance user acquisition efforts are led by Chief Marketing Officer Rony Teitelbaum. Because Albin has maintained executive and operational leadership throughout the company's evolution from an early startup to a multi-billion-dollar enterprise, key-person dependency on his strategic vision remains substantial. Furthermore, as a private Israeli entity, Moon Active maintains high opacity regarding its board of directors composition and voting agreements."
    claimRefs:
      - "CO001"
      - "CO007"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-investor-base"
    title: "Capitalization, Financing History, and Secondary Liquidity"
    body: "Moon Active's disclosed financing trajectory differs from traditional venture-backed software companies by relying predominantly on late-stage secondary share transactions rather than repetitive primary capital injections. Following an early seed investment led by Fastforward Innovations in July 2016, Moon Active did not disclose priced venture rounds until January 2020, when growth equity firm Insight Partners led a $125 million secondary investment at a $1.25 billion post-money valuation. In November 2021, Insight Partners led an additional $300 million secondary transaction with participation from Andalusian Private Capital, pricing Moon Active at a $5.0 billion valuation. Cumulative funding on record totals approximately $425 million, though these late-stage transactions provided liquidity to early shareholders and employees rather than balance sheet cash. Disclosed minority shareholders include angel investors Gigi Levy-Weiss, Guy Gamzu, and David Alliance, while detailed cap table rights remain confidential."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO008"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "strategic-milestones-and-restructuring"
    title: "Strategic Growth Milestones, Portfolio Expansion, and Restructuring"
    body: "Moon Active's evolution from a single-hit social casino developer into a diversified casual studio has progressed through major strategic transactions and operational realignments between 2011 and 2026. After establishing global market dominance with Coin Master, the company acquired Belarusian casual developer Melsoft in December 2020 for over $100 million, adding Family Island and My Cafe to its roster. In December 2022, Moon Active acquired tile puzzle game Zen Match and its Istanbul team from Good Job Games for an estimated $100 million to $150 million. In May 2024, Moon Active broadened its casual footprint by investing $50 million for a 15.9% stake in Turkish developer Spyke Games. Despite these expansionary milestones, the company initiated organizational restructurings in January 2025 and January 2026, cutting 110 employees in the second wave to optimize costs. Concurrently, Moon Active committed to long-term physical consolidation in June 2026 by signing a 10-year lease for 22,000 square meters in Givatayim's Beyond Towers."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
