    diligencePath: Request secondary transfer logs, shareholder register, and option pool sizing directly from management under NDA.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: audited-financial-performance
    missingEvidence: >-
      Audited 2024-2026 financial statements disclosing verified GAAP revenue, EBITDA, operating cash flow, and tax
