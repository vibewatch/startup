evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary-clearing
    missingEvidence: >-
      Fully verified current capitalization table, share class liquidation preferences, and private secondary market
      clearing prices.
    whyItMatters: >-
      Moon Active's last major disclosed valuation of $5 billion dates from a November 2021 secondary round, leaving
      current market pricing and net investor liquidation overhang unverified.
    diligencePath: >-
      Obtain Moon Active's private shareholder register, latest 409A valuation appraisal, or secondary trading
      transaction logs under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount-and-workforce-reconciliation
    missingEvidence: >-
      Audited employer payroll figures reconciling divergent estimates ranging between 1,869 (Tracxn), 1,993 (Revelio
      Labs), and over 2,070 (GetLatka) employees.
    whyItMatters: >-
      Two rounds of restructuring in 2025 and 2026 created varying workforce snapshots across market intelligence
      trackers.
    diligencePath: Review official corporate HR census filings or certified payroll records as of Q3 2026.
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements for FY2024 through FY2026 detailing GAAP revenue, operating margins, EBITDA, and
      balance sheet cash reserves.
    whyItMatters: >-
      Public revenue figures rely on third-party estimates and press statements, obscuring title-level gross margins and
      user acquisition spend.
    diligencePath: Request audited financial statements or Israel Tax Authority statutory filings directly from company management.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current, source-transparent mobile-games and casual/social-casino market series with geography, revenue
      definition, period, and publisher methodology.
    whyItMatters: >-
      Without a comparable market denominator, company and title metrics cannot support TAM, SAM, share, or a
      market-growth valuation multiple.
    diligencePath: >-
      License the underlying AppMagic or equivalent dataset and reconcile gross consumer spend, platform fees, taxes,
      advertising, and publisher net revenue by geography.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Title-level payer conversion, cohort retention, ARPDAU, user-acquisition payback, contribution margin, geography,
      and platform mix.
    whyItMatters: >-
      These denominators determine serviceable demand, monetization durability, and whether reported scale reflects
      repeatable economics or concentrated spend.
    diligencePath: >-
      Obtain management cohort exports by title, geography, platform, acquisition channel, payer status, and monthly
      vintage, then reconcile them to store receipts.
    relatedQuestionRefs:
      - QM006
      - QM009
  - type: conflicting-data
    severity: material
    topic: company-revenue
    missingEvidence: >-
      Audited current revenue with an explicit accounting period and reconciliation to gross bookings, taxes, platform
      fees, and title-level contribution.
    whyItMatters: >-
      Public figures range from $1.1 billion to $1.5 billion and differ in vintage, sourcing, and whether they are
      actual, expected, or estimated.
    diligencePath: >-
      Review audited financial statements and monthly management accounts, then trace store and direct-payment receipts
      to recognized revenue by title.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM009
  - type: private-evidence-only
    severity: material
    topic: title-level-economics
    missingEvidence: >-
      Audited breakdown of title-level contribution margins, user acquisition payback periods, and direct-to-consumer
      web store revenue share for Moon Active versus public peers.
    whyItMatters: >-
      Without title-level unit economics, underwriting cannot confirm whether Coin Master's cash generation can durably
      fund new title development or offset rising mobile acquisition costs.
    diligencePath: >-
      Request title-level financial disclosures, cohort retention curves, and payment processing fee schedules in
      management diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited income statements, EBITDA margins, cash balances, and debt obligations for FY2024-FY2025.
    whyItMatters: >-
      Without audited figures, net cash generation, operating leverage, and capital adequacy cannot be independently
      verified.
    diligencePath: >-
      Request audited financial statements and board management accounts from company management or lead investor
      Insight Partners under NDA.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: title-unit-economics
    missingEvidence: >-
      Per-title user acquisition costs, day-30 and day-180 ROAS payback curves, and direct-to-consumer web store revenue
      share.
    whyItMatters: >-
      High reliance on paid user acquisition and app store platform fees directly impacts gross margin and cash flow
      sustainability.
    diligencePath: Obtain cohort-level LTV/CAC data, marketing channel spend attribution, and third-party attribution reports.
    relatedQuestionRefs:
      - QI004
  - type: conflicting-data
    severity: minor
    topic: total-capital-raised
    missingEvidence: >-
      Reconciliation of total primary capital paid into the company versus secondary liquidity cashed out by founders
      and early shareholders.
    whyItMatters: >-
      Tracxn reports $126M total funding while other aggregators cite $425M, reflecting conflation of secondary
      transfers with company balance sheet cash.
    diligencePath: >-
      Review company cap table, historical share issuance records, and articles of association at Israeli Companies
      Registrar.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: rng-certification
    missingEvidence: >-
      Public third-party audit certificates (e.g., eCOGRA, iTech Labs, or GLI) verifying the algorithmic fairness and
      unmanipulated payout frequencies of Moon Active's core slot and reward math.
    whyItMatters: >-
      Without independent mathematical certification, monetization mechanics remain vulnerable to regulatory
      classification as predatory or unlicensed gambling, presenting material regulatory and compliance risk.
    diligencePath: >-
      Request confidential technical audit reports, RNG certification filings, and game-math source documentation during
      prospective investor technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: server-infrastructure-sla
    missingEvidence: >-
      Internal server infrastructure deployment schematics, real-time latency telemetry, multi-region failover
      benchmarks, and direct-to-consumer payment gateway processing ratios.
    whyItMatters: >-
      High concurrency live-ops scale requires resilient server topologies; private microservice telemetry is necessary
      to evaluate operational resilience against mobile app store de-platforming.
    diligencePath: >-
      Review internal cloud infrastructure bills, AWS/GCP architecture reviews, and payment processing service
      agreements under NDA.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Disclosed longitudinal player retention curves, 30-day/90-day churn rates, and organic versus paid user
      acquisition payback economics.
    whyItMatters: >-
      Without granular cohort durability and retention metrics, long-term player lifetime value cannot be independently
      verified against heavy user acquisition expenditures.
    diligencePath: >-
      Request confidential cohort analysis and title-by-title user acquisition efficiency decks in management diligence
      sessions.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: enterprise-distribution-and-named-partnerships
    missingEvidence: >-
      Complete contract terms, revenue-sharing agreements, and direct-to-consumer store penetration metrics across
      distribution channels.
    whyItMatters: >-
      Platform fee exposure to Apple and Google 30% take rates significantly compresses gross margins unless alternative
      web shop channels achieve scale.
    diligencePath: Review platform distribution agreements and web store transaction volumes during formal commercial diligence.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Non-public litigation settlement reserves, legal defense expense forecasts, and potential regulatory inquiry
      records regarding minor gambling allegations.
    whyItMatters: >-
      Material class-action claims under California gambling statutes could lead to substantial restitution orders,
      statutory penalties, or forced alteration of core slot-spin monetization mechanics.
    diligencePath: >-
      Review litigation disclosures, formal responses in Case 4:25-cv-01626-YGR, insurance coverage for class actions,
      and any correspondence with state attorneys general or the FTC.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: secondary-pricing-and-cap-table
