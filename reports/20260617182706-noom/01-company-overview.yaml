company:
  name: Noom
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Noom is a New York-headquartered digital health company founded in 2008 by Saeju Jeong and
    Artem Petakov that reached a peak $3.7B valuation in its May 2021 Series F ($540M led by
    Silver Lake), but has since experienced ~20% layoffs, a CEO transition, a pivot toward GLP-1
    telehealth, and a secondary-market valuation decline to ~$720M by Q2 2026.
sections:
  - id: identity-and-business-model
    title: Identity & Business Model
    body: >-
      Noom, Inc. (originally WorkSmart Labs, Inc.) is a consumer-first digital health company
      headquartered in New York, NY. Founded in 2008, the company employs a psychology-based
      approach to weight management, combining cognitive behavioral therapy (CBT) techniques with
      food logging, daily lessons, and human/AI coaching delivered through a mobile application.
      The company's revenue model is predominantly B2C subscription-based, with plans ranging from
      approximately $17–$70 per month depending on subscription length. Noom has expanded beyond
      its flagship Noom Weight product to include Noom Med (telehealth GLP-1 prescriptions plus
      coaching, launched May 2023), Noom Mood (stress/anxiety CBT program), and Noom DPP (CDC-
      recognized diabetes prevention program). The company also monetizes through Noom for Work, a
      B2B2C channel targeting employers and health plans. Noom was the first mobile application
      recognized by the CDC as a certified diabetes prevention program and has received multiple
      NIH grants validating its behavior-change methodology. A 2026 randomized clinical trial
      showed 4.1% body weight loss sustained at 68 weeks post-enrollment.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: founders-and-leadership
    title: Founders & Leadership
    body: >-
      Noom was co-founded in 2008 by Saeju Jeong and Artem Petakov. Jeong, born in South Korea
      to a family of physicians, was inspired by his father's vision of transforming sick care
      into preventive care. He served as CEO from founding through July 2023, when he transitioned
      to Executive Chairman as part of a planned succession. Artem Petakov, the technical co-
      founder, serves as President and oversees product and engineering. In July 2023, Geoff Cook
      was appointed CEO; Cook previously founded and led The Meet Group through its IPO and
      subsequent acquisition, bringing consumer-tech scaling experience. The leadership transition
      signaled a shift from founder-led growth to professional operational management at a time
      when the company was navigating post-COVID subscriber declines and the GLP-1 market
      disruption. Public governance disclosure remains limited—no complete board roster or
      ownership breakdown has been published in reviewed sources, leaving key-person concentration
      and governance structure as open diligence issues.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002]
    figureRefs: [FO002]
  - id: funding-and-capital-formation
    title: Funding & Capital Formation
    body: >-
      Noom's largest fundraise was its May 2021 Series F round of $540M led by Silver Lake,
      which valued the company at $3.7B post-money. Other Series F participants included Oak HC/FT,
      Temasek, Novo Holdings, Sequoia Capital, RRE Ventures, and Samsung Ventures. Earlier rounds
      include a ~$58M Series E in 2019 (Sequoia, Samsung, RRE) and multiple earlier seed through
      Series D rounds. Total disclosed capital raised is approximately $643M (range $578M–$669M
      across trackers like Crunchbase, Tracxn, and Sacra). No debt facilities or credit lines have
      been identified in reviewed public sources. As of Q2 2026, secondary-market implied valuation
      has dropped to approximately $720M—a ~77% discount to the 2021 peak—reflecting post-COVID
      subscriber declines, the GLP-1 market disruption, and broader late-stage private market
      corrections. Over $272M in secondary bids and offers were logged in the 90 days prior to
      April 2026, suggesting ongoing liquidity interest despite the markdown.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO003]
  - id: scale-and-key-metrics
    title: Scale & Key Metrics
    body: >-
      Noom reports 50M+ cumulative registered users since founding. Peak paying subscribers
      reached approximately 5M during the 2020–2021 COVID-driven digital health surge, but have
      declined since; recent estimates suggest low single-digit millions of active subscribers.
      Revenue peaked at an estimated ~$400M in 2021, coinciding with maximum subscriber density.
      Headcount reached ~3,400 at peak and currently stands at approximately 2,500 after multiple
      restructuring rounds. The company has undergone at least four rounds of layoffs between 2022
      and 2025, primarily affecting its human coaching staff as the model shifted toward AI-
      augmented and medication-focused offerings. Material metrics that remain undisclosed in public
      sources include exact current revenue, ARR, gross margin, net revenue retention, and customer
      acquisition cost—leaving an incomplete picture of unit economics and financial trajectory.
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]
    figureRefs: [FO001]
  - id: adverse-events-and-risk-flags
    title: Adverse Events & Risk Flags
    body: >-
      In 2022, Noom agreed to a $62M class-action settlement ($56M cash plus $6M in subscription
      credits) resolving allegations of deceptive auto-renewal practices and dark-pattern
      cancellation barriers. The settlement required Noom to implement self-service cancellation,
      explicit consent checkboxes for auto-renewal, and clearer disclosure of subscription terms.
      This aligns with the FTC's broader "Click-to-Cancel" enforcement trend. Between 2022 and
      2025, the company executed approximately 20% workforce reductions, with coaching staff
      disproportionately affected as the business model shifted away from human-intensive coaching
      toward AI and medication management. The GLP-1 market disruption (Wegovy, Ozempic, Zepbound)
      simultaneously cannibalized traditional behavioral weight-loss demand and created a new
      opportunity that Noom is pursuing through Noom Med. High B2C subscription churn remains a
      structural risk inherent to the weight-loss category. In April 2026, Noom acquired Tailor
      Made Compounding as its first major M&A, expanding into healthy aging and compounded peptides—
      a segment facing FDA regulatory scrutiny.
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040]
    tableRefs: [TO004]
