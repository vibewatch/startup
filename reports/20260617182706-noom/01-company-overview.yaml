callouts:
  - calloutType: strength
    title: Psychology-first approach with clinical validation
    body: >-
      Noom's CBT-based methodology is backed by NIH grants, CDC diabetes-prevention certification,
      and a 2026 randomized clinical trial showing sustained weight loss at 68 weeks. This
      differentiates it from pure calorie-tracking competitors.
    claimRefs: [CO005, CO006, CO008]
  - calloutType: risk
    title: Severe valuation compression and revenue decline
    body: >-
      Secondary-market valuation has collapsed ~77% from the $3.7B Series F peak to ~$720M,
      reflecting post-COVID subscriber loss, GLP-1 disruption of traditional behavioral weight-
      loss, and four rounds of layoffs between 2022-2025.
    claimRefs: [CO019, CO028, CO030, CO035]
  - calloutType: risk
    title: Regulatory and legal exposure from subscription practices
    body: >-
      The $62M class-action settlement for dark-pattern auto-renewal practices signals ongoing
      consumer-protection risk. As the FTC intensifies Click-to-Cancel enforcement, any recurrence
      could trigger regulatory action beyond private litigation.
    claimRefs: [CO033, CO034]
  - calloutType: insight
    title: GLP-1 pivot is both existential threat and growth opportunity
    body: >-
      GLP-1 medications simultaneously cannibalize Noom's core behavioral offering and create a new
      addressable market via Noom Med telehealth. The April 2026 Tailor Made Compounding acquisition
      signals deepening commitment to the medication-plus-coaching model.
    claimRefs: [CO036, CO037, CO039, CO040]
