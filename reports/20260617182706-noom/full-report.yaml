      - number: '6.2'
        title: B2C Subscriber Economics and Demographics
        blocks:
          - type: paragraph
            body: >
              Noom's B2C model charges monthly subscription fees ranging from $70/month (monthly plan) to $17.42/month
              (annual plan at $209/year). The Noom Med clinical program with GLP-1 prescriptions carries additional
              costs. Pricing has increased steadily, with users reporting renewal at higher rates than initial
              promotional offers. Revenue peaked at approximately $400 million in 2021 during COVID-driven demand, with
              estimates suggesting a decline to roughly $296 million by 2025-2026. The typical Noom subscriber is a
              US-based woman aged 35-54 seeking sustainable behavior-change-based weight loss rather than restrictive
              dieting. Psychographic fit emphasizes emotional eaters, yo-yo dieters, and those seeking structured
              psychological support. Noom's published clinical data reports 78% of users lose weight and 56% achieve at
              least 5% body weight loss within six months, per a study in JMIR mHealth. The largest-ever Noom RCT (427
              adults, published June 2026 in Obesity Science & Practice) showed members lost an average 4.1% body weight
              by week 68, with weight loss continuing for a full year after the 16-week program ended. These outcome
              metrics are notable but reflect engaged completers rather than all subscribers, and the company does not
              publicly disclose churn-adjusted completion rates or lifetime value by cohort.
