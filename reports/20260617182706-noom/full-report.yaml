              The apparent market ranges from $1.3B (pure apps) to $279B (full obesity ecosystem) — a 215x spread.
              Noom's actual addressable opportunity sits in a narrow band bounded by the U.S. share of digital weight
              management apps plus telehealth obesity services and employer digital wellness, roughly $5B in aggregate.
              Valuation analysis should use this constrained SAM rather than broad market headlines.
            calloutType: insight
            claimRefs:
