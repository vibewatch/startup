      - number: '6.4'
        title: Acquisition and Retention Dynamics
        blocks:
          - type: paragraph
            body: >
              Noom's acquisition engine centers on one of consumer health's most studied conversion funnels. The
              onboarding quiz spans 40-113 screens and takes 10-15 minutes, employing progressive commitment psychology,
              personalization theater (projected weight-loss timelines and custom plans), and strategic price anchoring.
              Industry observers estimate quiz-to-paid conversion exceeds 10% of quiz completers, versus a 2.7% median
              day-zero conversion for subscription health apps. A significant portion of paid acquisition routes through
              web-based funnels rather than app stores, enabling faster iteration and avoiding platform commissions—one
              analysis estimated the DTC web portal generated 42% of new subscriptions. Paid social (Meta, TikTok,
              YouTube) is the primary channel, supplemented by affiliate/influencer marketing (e.g., partnership with
              The Independent drove top-3 partner status in UK) and Google search. Retention is the structural
              challenge. Industry benchmarks show 30-day retention for health/fitness apps averages 8-12%. Noom's GLP-1
              Companion program reports significantly higher metrics: 77.8% of Microdose GLP-1Rx users stayed engaged
              for 4+ weeks, and D30 engagement was 43.6% (10x industry average). However, a third-party study of 35,000
              Noom switchers found 62.4% churned within six months, with average prior spend of $419 before
              cancellation. The top reason for leaving was "psychology lessons feeling repetitive" (34.2%). Noom does
              not publicly disclose aggregate churn rates, NRR, or cohort retention curves.
