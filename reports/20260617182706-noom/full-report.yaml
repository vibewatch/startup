            body: >-
              Noom's financial trajectory shows a post-COVID correction that raises burn, churn, and valuation concerns.
              Revenue peaked at approximately $400M in 2021 (canonical), with Sacra estimating $1B ARR by 2023 driven by
              aggressive subscriber growth. However, post-pandemic normalization, coaching quality complaints, and GLP-1
              competition have driven subscriber declines from a peak of ~5M paying users to low single-digit millions.
              The secondary market now values Noom at approximately $720M — a 77%+ discount to the $3.7B Series F peak —
              implying a revenue multiple under 1x. This valuation compression limits fundraising optionality and makes
              IPO timing extremely challenging. The GLP-1Rx program reached $100M revenue run-rate within four months of
              its September 2024 launch, but this new revenue stream carries higher COGS (medication, clinical staff,
              pharmacy partnerships) than the legacy software subscription. Quarterly billing structures for GLP-1
              programs ($199-$299/month billed quarterly) introduce refund and chargeback exposure. High churn remains
              structural: weight-loss subscription services face 50-70% first-year attrition industry-wide. If GLP-1
              revenue growth cannot offset legacy behavioral subscription decline and margin compression, Noom faces a
              working-capital squeeze that could force additional cost restructuring or a down-round fundraise.
