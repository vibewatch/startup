      - number: '1.2'
        title: Founders & Leadership
        blocks:
          - type: paragraph
            body: >-
              Noom was co-founded in 2008 by Saeju Jeong and Artem Petakov. Jeong, born in South Korea to a family of
              physicians, was inspired by his father's vision of transforming sick care into preventive care. He served
              as CEO from founding through July 2023, when he transitioned to Executive Chairman as part of a planned
              succession. Artem Petakov, the technical co- founder, serves as President and oversees product and
              engineering. In July 2023, Geoff Cook was appointed CEO; Cook previously founded and led The Meet Group
              through its IPO and subsequent acquisition, bringing consumer-tech scaling experience. The leadership
              transition signaled a shift from founder-led growth to professional operational management at a time when
              the company was navigating post-COVID subscriber declines and the GLP-1 market disruption. Public
              governance disclosure remains limited—no complete board roster or ownership breakdown has been published
              in reviewed sources, leaving key-person concentration and governance structure as open diligence issues.
