  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Market & GLP-1 Disruption Risk
        blocks:
          - type: paragraph
            body: >-
              The rise of GLP-1 receptor agonists (semaglutide, tirzepatide) fundamentally reshapes the addressable
              market for behavioral-only weight-loss apps. Noom's pivot to Noom Med and its GLP-1 Companion attempts to
              ride this wave rather than be swept aside, but the pivot introduces new dependencies. GLP-1 medications
              now dominate consumer interest in weight management, with the global market exceeding $50B in 2025 and
              projected growth to $130B by 2030. Noom's core behavioral subscription — the legacy revenue engine — faces
              cannibalization from its own GLP-1Rx program and from well-capitalized competitors like Hims & Hers (2.5M
              subscribers, $2.35B 2025 revenue), Ro, and Found that offer similar telehealth-plus-medication bundles.
              WeightWatchers' Chapter 11 bankruptcy filing in 2025 illustrates how quickly legacy behavioral models can
              collapse when GLP-1 alternatives gain traction. A JAMA retrospective study found that 40-50% of GLP-1
              patients discontinue within 12 months, creating both a retention opportunity and a risk that Noom's
              engagement-layer value proposition proves insufficient to prevent churn once medications are paused. If
              Noom's behavioral differentiation does not demonstrably improve medication adherence and long-term
              outcomes versus generic telehealth providers, the company's premium pricing and subscription economics are
              difficult to sustain.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR040
