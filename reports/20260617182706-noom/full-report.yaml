      - number: '5.3'
        title: Noom Med & GLP-1 Telehealth Stack
        blocks:
          - type: paragraph
            body: >-
              Noom Med represents the company's strategic pivot to address the GLP-1 weight-loss medication market. The
              workflow begins with an online health assessment, followed by clinical review by a licensed physician or
              nurse practitioner. Eligible patients (BMI ≥30 or ≥27 with comorbidity) receive a prescription, and
              compounded semaglutide or tirzepatide is shipped directly within approximately 7 days. The program
              uniquely requires ongoing participation in Noom's behavioral change platform—there is no medication-only
              option. Plan tiers in 2026 include Telehealth Only ($99/month for brand-name Rx with own pharmacy),
              Microdose GLP-1Rx ($79 start then $199/month including compounded medication), and Full GLP-1Rx
              ($279-$349/month). The GLP-1 Companion app integrates medication tracking, side-effect support, Muscle
              Defense guidance for lean mass preservation, AI-powered body composition scans, glucose curve forecasting,
              and gamification. Key engagement metrics show 77.8% of Microdose users engaged for 4+ weeks and D30
              engagement above 40%—claimed to be 10x average health app retention. The legal landscape is uncertain:
              Noom sells compounded semaglutide under Section 503A exceptions after the FDA removed it from the shortage
              list, and Novo Nordisk/Eli Lilly are challenging compounders in court. This represents a material
              regulatory risk to Noom Med revenue.
            claimRefs:
              - CE004
              - CE005
              - CE020
              - CE022
