      - number: '3.3'
        title: GLP-1 Telehealth Challengers
        blocks:
          - type: paragraph
            body: >-
              The most acute competitive threat to Noom comes from medication-first telehealth platforms that have
              rapidly scaled GLP-1 weight loss programs. Hims & Hers Health is the largest by revenue, reporting $608
              million in Q1 2026 revenue (up 4% year-over-year) with 2.6 million subscribers, and raising full-year 2026
              guidance to $2.8–$3.0 billion. The company made a strategic pivot from compounded to branded GLP-1
              medications (partnering with Novo Nordisk for Wegovy), though this transition caused a $92 million Q1 2026
              net loss from restructuring charges. Ro has raised approximately $1 billion in total funding at a $7
              billion valuation (February 2022), with estimated $598 million in 2024 revenue and GLP-1 offerings
              accounting for roughly 40% of revenue. Ro's competitive advantage is its vertically integrated pharmacy
              infrastructure enabling lower medication costs. Found (joinfound.com) offers personalized GLP-1 programs
              with both branded Wegovy/Zepbound and compounded alternatives, competing on affordability and insurance
              coverage. Calibrate has raised approximately $128 million and positions itself as an outcomes-based
              metabolic health platform combining GLP-1 prescriptions with one-on-one video physician visits and
              coaching. These medication-first platforms threaten Noom because they can offer GLP-1 access at lower
              price points with simpler operational models, while Noom's behavioral coaching adds cost that
              price-sensitive consumers may not value.
