companyProfile:
  summary: >-
    Noom, Inc. (originally WorkSmart Labs) is a New York-based digital-health company founded in 2008 by Saeju Jeong and
    Artem Petakov that built a psychology-first, CBT-based weight-management app. After a COVID-era surge that took it
    to a $3.7B Series F valuation in May 2021 on ~$540M raised, Noom faced post-pandemic revenue decline, ~20% layoffs
    in 2022, a shift away from human-only coaching, and the structural disruption of GLP-1 anti-obesity drugs. The
    company has repositioned around Noom Med (telehealth GLP-1 prescriptions plus behavioral coaching) and an
    AI-assisted coaching model under CEO Geoff Cook (appointed July 2023). It reports 50M+ cumulative registered users
    and ~2,500 employees, but financials remain largely private and secondary-market pricing implies a steep ~77% reset
    from the 2021 peak.
