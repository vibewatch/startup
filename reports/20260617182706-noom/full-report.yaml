      - number: '2.5'
        title: Sizing Gaps and Contradictions
        blocks:
          - type: paragraph
            body: >-
              The most material sizing gap is Noom's own revenue trajectory. Peak revenue was estimated at $400M in 2021
              during the COVID-driven subscription surge, but current revenue is undisclosed and widely believed to have
              declined significantly alongside subscriber attrition post-2021. Without current revenue, subscriber
              count, or churn rate disclosure, SOM calculations are speculative. A second contradiction is the wide
              divergence among analyst estimates: digital health for obesity ranges from $71.67B (InsightAce) to $99.36B
              (TBRC) for 2026 depending on what hardware, wearables, and telehealth platforms are included — a 39%
              spread that reflects definitional rather than analytical disagreement. Third, the GLP-1 market's effect on
              behavioral app demand is unclear: WeightWatchers' bankruptcy (revenue fell to $811M in 2024 with
              subscription revenues declining 5.6%) demonstrates catastrophic disruption, yet the digital health for
              obesity market overall continues growing at 22–26% CAGR because GLP-1 companion digital tools and
              telehealth obesity platforms are expanding even as standalone behavioral programs shrink. This means
              Noom's pivot to Noom Med may position it in the growing subsegment rather than the declining one, but
              execution risk is high and the company competes against well-capitalized telehealth GLP-1 providers.
            claimRefs:
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: GLP-1 disruption threatens behavioral-only subscription revenue
            body: >-
              WeightWatchers' Chapter 11 bankruptcy in 2025 — driven by GLP-1 drug competition reducing subscriptions by
              5.6% annually and producing $345.7M losses — is a direct cautionary precedent for Noom's core behavioral
              subscription model. The speed of disruption is remarkable: WW's revenue fell to $811M in 2024 and its
              stock dropped from $100+ to under $1.
            calloutType: risk
            claimRefs:
