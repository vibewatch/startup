            body: >-
              Secondary market transactions value Noom at approximately $720M versus the $3.7B Series F peak — a
              markdown that reflects both sector-wide repricing and Noom-specific concerns about churn, competition, and
              business model uncertainty. This severely constrains fundraising and makes IPO timing unrealistic in the
              near term.
            calloutType: risk
            claimRefs:
              - CR025
              - CR026
              - CR030
          - type: callout
            title: Subscription model retains structural FTC exposure despite settlement
            body: >-
              The $62M class action settlement resolved historical claims, but Noom's current quarterly billing
              structures, multi-month commitments, and complex cancellation flows remain vulnerable to the FTC's
              continued ROSCA enforcement and the ~30 state auto-renewal laws in effect.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: callout
            title: Demand cohort-level retention and LTV data before underwriting
            body: >-
              The absence of disclosed NRR, churn cohorts, or LTV by product line makes it impossible to independently
              assess whether Noom's GLP-1 pivot generates durable unit economics or simply recycles subscriber
              acquisition spend. Diligence must require granular retention data before any investment decision.
            calloutType: recommendation
            claimRefs:
              - CR024
              - CR028
              - CR029
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation History and Resets
        blocks:
          - type: paragraph
            body: >-
              Noom's valuation story is one of dramatic peak-to-trough compression. The company raised approximately
              $643M cumulatively across rounds from seed through Series F. The Series F in May 2021 was the defining
              liquidity event: $540M raised at a $3.7B post-money valuation, led by Silver Lake with participation from
              Oak HC/FT, Temasek, Novo Holdings, Sequoia Capital, RRE Ventures, and Samsung Ventures. At the time,
              Noom's revenue had reportedly reached approximately $400M (FY2020), implying a roughly 9x trailing revenue
              multiple at the Series F mark. Management reportedly discussed IPO plans at valuations approaching $10B
              within a year of the raise.


              The valuation reset has been severe. By mid-2026, secondary-market transactions imply a valuation of
              approximately $720M — a roughly 77-81% discount to the Series F price. Multiple factors drove this
              compression: the post-COVID normalization of digital health engagement, aggressive cost cutting and
              layoffs (approximately 20% of staff in 2022, further restructuring in 2023-2024), FTC scrutiny over
              subscription dark patterns resulting in a $56M class-action settlement, the competitive disruption from
              GLP-1 medications (Ozempic, Wegovy, Zepbound) reshaping the weight-loss market, and declining legacy app
              subscriber counts from a peak of approximately 5M paying subscribers. The Noom SEC Form D filing (CIK
              0001595910) confirms the entity was originally incorporated as WorkSmart Labs in Delaware, providing
              statutory anchoring for the company's capital-raising history. Noom has not filed an S-1 and does not
              appear on any confirmed 2026 IPO docket, though Forge Global lists it as a "highly anticipated" watchlist
              candidate with uncertain timing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV036
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV010
              - CV016
      - number: '8.2'
        title: Secondary-Market Signals
        blocks:
          - type: paragraph
            body: >-
              The secondary market provides the most current price discovery for Noom equity. As of April-June 2026,
              multiple platforms track Noom shares actively. PM Insights reports an implied valuation of approximately
              $722M based on recent secondary transactions. Notice.co quotes a share price of approximately $11.69,
              broadly consistent with the $713-722M enterprise value range across platforms. Caplight similarly lists
              Noom with active funding round data and comparable company overlays. Forge Global shows active bids and
              asks with $272M in secondary market activity over the most recent 90-day window, indicating meaningful
              institutional interest at these reduced levels despite the steep discount.


              The ~77% discount from the Series F is severe but not unprecedented for 2021-vintage growth rounds. The
              implied revenue multiple at secondary levels depends heavily on current revenue estimates: if Noom's
              revenue has stabilized at approximately $500M+ (accounting for the GLP-1 Rx ramp offsetting legacy
              subscriber attrition), the secondary mark implies a sub-1.5x revenue multiple. If revenue has fallen below
              $400M due to faster-than-expected legacy churn, the multiple could be closer to 1.8-2.0x. This ambiguity
              is itself a key valuation issue: Noom remains private and has not disclosed audited financials, making
              revenue estimation inherently uncertain and forcing secondary buyers to price on incomplete information.
              The contrast between Sacra's estimate of $1B ARR in 2023 (growing 25% YoY) and the steep valuation
              discount suggests the market is pricing execution risk and competitive disruption rather than a pure
              revenue collapse.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV004
            claimRefs:
              - CV010
