      - number: '1.5'
        title: Adverse Events & Risk Flags
        blocks:
          - type: paragraph
            body: >-
              In 2022, Noom agreed to a $62M class-action settlement ($56M cash plus $6M in subscription credits)
              resolving allegations of deceptive auto-renewal practices and dark-pattern cancellation barriers. The
              settlement required Noom to implement self-service cancellation, explicit consent checkboxes for
              auto-renewal, and clearer disclosure of subscription terms. This aligns with the FTC's broader
              "Click-to-Cancel" enforcement trend. Between 2022 and 2025, the company executed approximately 20%
              workforce reductions, with coaching staff disproportionately affected as the business model shifted away
              from human-intensive coaching toward AI and medication management. The GLP-1 market disruption (Wegovy,
              Ozempic, Zepbound) simultaneously cannibalized traditional behavioral weight-loss demand and created a new
              opportunity that Noom is pursuing through Noom Med. High B2C subscription churn remains a structural risk
              inherent to the weight-loss category. In April 2026, Noom acquired Tailor Made Compounding as its first
              major M&A, expanding into healthy aging and compounded peptides— a segment facing FDA regulatory scrutiny.
