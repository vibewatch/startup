      - number: '5.5'
        title: Data Security, Compliance & Product Risks
        blocks:
          - type: paragraph
            body: >-
              Noom handles protected health information (PHI) through its coaching, telehealth, and medication programs,
              requiring HIPAA compliance. The company operates under Business Associate Agreements with vendors,
              encrypts data at rest (AES-256 via AWS KMS) and in transit (TLS 1.2+), and implements role-based access
              controls. Noom received multiple NIH grants and was the first mobile app to achieve CDC recognition as a
              certified Diabetes Prevention Program—a meaningful quality signal. However, public security documentation
              is notably thin: no SOC 2 report, no public security whitepaper, no status page, and no penetration
              testing disclosure have been identified in the reviewed evidence. Product risks are material and
              multi-dimensional. Coaching quality is a persistent complaint—Trustpilot and app reviews cite bot-like
              responses, impersonal coaching, and gap between marketing promise and delivered experience. The $56
              million class-action settlement (February 2022) for dark-pattern auto-renewal practices damaged trust and
              required enhanced cancellation disclosures. GLP-1 compounding faces legal challenge from Novo Nordisk and
              Eli Lilly, threatening Noom Med's supply chain. High churn is structurally inherent in B2C weight-loss
              subscriptions. The shift from human coaches to AI (following 2022-2023 layoffs reducing headcount from
              ~3,400 to ~2,500) represents both an efficiency gain and a quality risk that reviewers consistently flag.
              App store ratings remain strong (4.7 iOS from 730K+ reviews; 4.1 Android from 315K+ reviews), but the gap
              between aggregate scores and vocal complaint patterns suggests polarized user experiences.
