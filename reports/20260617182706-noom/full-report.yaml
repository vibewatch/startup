      - number: '4.2'
        title: Subscription Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Noom's unit economics are partially inferrable from public pricing and industry benchmarks but
              fundamentally undisclosed. List pricing for Noom Weight ranges from $17.42/month on a 12-month commitment
              to $70/month on a rolling monthly plan. Noom Med GLP-1 programs command significantly higher prices: the
              Microdose GLP-1Rx plan is $199/month and the Full-Dose plan is $279/month, both inclusive of compounded
              medication. This pricing shift implies materially higher ARPU but also higher COGS given medication
              fulfillment costs. Sacra reports that Noom employs an LLM-powered chatbot for initial interactions,
              creating leverage for human coaches paid $19–$24/hour who manage 300–400 users each. Industry subscription
              benchmarks suggest average monthly churn of ~5.3% for wellness subscriptions, implying average subscriber
              lifetimes of roughly 19 months. Noom's own engagement data shows 40% D30 retention for Microdose GLP-1Rx
              members—10x the digital health app average—and 77% still engaged at week four. Ad spend scaled from $5M in
              2017 to an estimated $330M in 2023, suggesting CAC has been extremely high relative to subscription LTV
              unless retention substantially exceeds industry norms. The $56M dark-pattern class-action settlement in
              2022 hints that a meaningful portion of historical revenue may have been generated through friction-based
              retention rather than genuine product engagement. Without disclosed CAC, LTV, gross margin, or net revenue
              retention, the true unit economics remain a material evidence gap.
