      - number: '2.2'
        title: Market Sizing (TAM/SAM/SOM)
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses produce dramatically different market sizes depending on boundary choices. The
              broadest framing is the global weight loss and obesity management market at approximately $279 billion in
              2026 (Research and Markets), which includes pharma, surgery, services, and digital tools. The digital
              health for obesity segment ranges from $78 billion (VPA Research, Fortune Business Insights) to $99
              billion (The Business Research Company), reflecting different inclusion of hardware, wearables, and
              telehealth platforms. Noom's most direct competitive segment — exercise and weight loss apps — is far
              narrower at $1.29 billion (Mordor Intelligence) to $1.39 billion (Coherent Market Insights) in 2026. A
              reasonable SAM for Noom would combine the U.S. share of weight loss apps (approximately $500M given North
              America's 40% share) plus the addressable U.S. telehealth obesity slice and employer wellness digital
              spending. The SOM remains unclear because Noom does not disclose current revenue; its peak revenue was
              estimated at approximately $400 million in 2021 but has declined since. This boundary sensitivity — from
              $1.3B to $99B depending on scope — is the core sizing lesson for diligence. The GLP-1 pharmaceutical
              market ($73.4B in 2026, projected to exceed $100B by 2030 per Goldman Sachs estimates cited in Becker's)
              is adjacent rather than directly addressable by Noom, but Noom Med's telehealth prescribing model captures
              a medication-management and coaching overlay fee on that pharmaceutical spend.
