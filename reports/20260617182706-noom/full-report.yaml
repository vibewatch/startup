  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue & Growth
        blocks:
          - type: paragraph
            body: >-
              Noom's revenue trajectory reflects an aggressive consumer subscription growth story punctuated by a
              COVID-era surge and a subsequent pivot to GLP-1 telehealth. Third-party analyst Sacra estimates Noom hit
              $1B in ARR by end-2023, growing 25% year-over-year with approximately 1.5 million paying subscribers.
              Earlier estimates from MobileMarketingReads placed 2020 revenue at approximately $400M (nearly double
              2019's ~$237M) and 2021 revenue at ~$600M. Other trackers such as GrowJo and TechList cite a 2026 revenue
              estimate of ~$296M, while IncFact estimates over $500M—illustrating the wide confidence intervals around a
              private company with no audited disclosures. Noom's revenue is primarily subscription-based: the core Noom
              Weight app charges $17–$70 per month depending on plan length, while the newer Noom Med GLP-1 programs
              range from $99 to $279 per month inclusive of medication. In February 2025, Noom disclosed that its GLP-1
              Rx and pill-based medication programs together reached a $100M revenue run-rate within four months of
              their September 2024 launch. This suggests a rapid revenue mix shift toward higher-ARPU medical products,
              though the sustainability of that growth rate and its margin profile remain undisclosed. The discrepancy
              between the Sacra $1B ARR estimate and the canonical $400M peak figure likely reflects different
              measurement periods, methodologies, and product scope; we use the canonical ~$400M (2021 peak) as the
              conservative anchor and note the Sacra figure as a higher-bound third-party estimate.
