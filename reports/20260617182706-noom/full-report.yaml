      - number: '2.3'
        title: Buyer/User/Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Noom serves three distinct buyer-payer configurations. In the B2C channel, the individual consumer is both
              buyer and payer, purchasing monthly or annual subscriptions typically ranging from $17–$59 per month. The
              user is the individual seeking weight loss or health behavior change, motivated by personal health goals,
              physician recommendation, or GLP-1 medication support. In the B2B2C employer channel (Noom for Work), the
              buyer is the HR/benefits decision-maker, the payer is the employer or health plan, and users are enrolled
              employees and dependents. Corporate wellness budgets are the funding source, with adoption triggered by
              rising healthcare costs, chronic disease prevalence, and productivity goals. In the Noom Med telehealth
              channel, the buyer-user is the individual patient seeking GLP-1 prescriptions and coaching support, with
              payment split between the consumer (subscription fee) and potentially insurance or employer coverage for
              the medication itself. The U.S. dominates Noom's market given North America's 40% share of both the
              exercise/weight loss app and corporate wellness markets. Large employers (500+ employees) are the primary
              B2B targets, as 76% of employees at such organizations have access to wellness programs according to the
              U.S. Department of Labor.
