      - number: '7.2'
        title: Regulatory & Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Noom operates at the intersection of three high-enforcement regulatory domains: FTC
              subscription/negative-option practices, FDA telehealth and compounded drug oversight, and state consumer
              protection laws. The company settled a $62M class action (Wittels McInturff Palikovic v. Noom Inc.,
              S.D.N.Y., final approval July 2022) over auto-renewal dark patterns, agreeing to business-practice changes
              including explicit opt-in consent, easier cancellation, and renewal reminders. Though that litigation is
              resolved, the FTC continues aggressive enforcement under ROSCA and Section 5, and in March 2026 launched a
              new ANPRM to revive its vacated Click-to-Cancel rule. Noom's subscription model — which still involves
              multi-month commitments, quarterly billing for GLP-1 programs, and complex cancellation flows — remains
              exposed to future FTC actions or state AG enforcement in the ~30 states with auto-renewal laws.
              Separately, the FDA issued 30 warning letters to telehealth companies in March 2026 for misleading
              marketing of compounded GLP-1 products. Noom Med currently sells compounded semaglutide under Section 503A
              exceptions, and pharmaphorum reports that Novo Nordisk and Eli Lilly are suing to challenge the
              compounding framework. If courts or regulators restrict 503A compounding or determine Noom's offerings are
              "essentially a copy" of approved drugs, the entire Noom Med supply chain is at risk of disruption.
            claimRefs:
