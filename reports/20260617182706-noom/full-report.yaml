              - CV042
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue opacity prevents precise valuation
            body: >-
              Noom has not disclosed audited financials since the Series F. The range of third-party revenue estimates
              ($400M to $1B+) creates fundamental valuation uncertainty that secondary buyers must price as risk
              premium.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
              - CV030
          - type: callout
            title: GLP-1 pivot is the primary re-rating catalyst
            body: >-
              The $100M run-rate achieved within four months of Noom Med launch (disclosed February 2025) is the single
              strongest data point for potential value recovery. If Noom Med scales to $300-500M annually with
              reasonable unit economics, the stock should rerate toward the 2.5-3.5x multiple band.
            calloutType: insight
            claimRefs:
              - CV008
              - CV031
              - CV032
          - type: callout
            title: Track at current secondary levels
            body: >-
              The ~$720M secondary mark looks roughly fair given comparable multiples and revenue uncertainty. There is
              insufficient margin of safety for a buy recommendation without better visibility into audited financials,
              GLP-1 unit economics, and regulatory risk resolution. Upgrade path requires confirmed revenue
              reacceleration and IPO filing.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV027
              - CV034
              - CV041
          - type: callout
            title: Revenue assumed at $500-700M for 2025/2026
            body: >-
              This analysis assumes Noom's current revenue sits in the $500-700M range, reflecting Sacra's $1B ARR
              estimate for 2023 partially offset by legacy subscriber churn but supported by GLP-1 program growth. The
              actual figure is unconfirmed and represents a material evidence gap.
            calloutType: assumption
            claimRefs:
              - CV015
              - CV016
              - CV030
