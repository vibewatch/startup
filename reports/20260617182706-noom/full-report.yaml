            title: Noom Med positions the company in the growing GLP-1 companion segment
            body: >-
              While standalone behavioral programs are shrinking, digital health for obesity overall grows at 22–26%
              CAGR because GLP-1 companion platforms (telehealth prescribing + coaching) are expanding. Noom Med's
              combination of medication management and psychology-based coaching could capture this growth if execution
              matches the pivot speed required.
            calloutType: strength
            claimRefs:
              - CM006
              - CM029
              - CM039
