    type: flow
    layout: wide
    summary: The GLP-1 telehealth workflow from assessment through ongoing behavioral support and medication management.
    data:
      nodes:
        - id: n1
          label: Online health assessment
          detail: User completes weight history, medical conditions, and goals questionnaire
        - id: n2
          label: Clinical review & eligibility
          detail: Licensed clinician reviews case; determines GLP-1 eligibility (BMI ≥30 or ≥27 with comorbidity)
        - id: n3
          label: Prescription & plan selection
          detail: Patient selects tier (Microdose $199/mo, Full GLP-1Rx $279-$349/mo, or Telehealth-only $99/mo)
        - id: n4
          label: Medication fulfillment
          detail: Compounded semaglutide/tirzepatide shipped within ~7 days via Noom pharmacy
        - id: n5
          label: Behavioral program activation
          detail: Mandatory enrollment in Noom GLP-1 Companion (lessons, food logging, Muscle Defense)
        - id: n6
          label: Ongoing monitoring & coaching
          detail: AI coaching via Welli, medication tracking, side-effect support, body scans, clinician check-ins
