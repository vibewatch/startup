            title: Market growth rates assume continued GLP-1 supply expansion and coverage broadening
            body: >-
              The 22–26% CAGR for digital health for obesity and the projected $73B+ GLP-1 market assume that drug
              supply constraints ease, Medicare coverage holds after the December 2027 bridge expiration, and oral GLP-1
              pills further expand the treatable population. Any disruption to these assumptions (regulatory reversal,
              supply shortage, safety signal) would compress growth.
            calloutType: assumption
            claimRefs:
