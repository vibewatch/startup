  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Noom competes across four overlapping competitor clusters rather than a single peer set. First are direct
              behavioral and calorie-tracking app competitors—MyFitnessPal, Lose It!, and Lifesum—which compete on food
              logging, database breadth, and freemium pricing without behavioral coaching depth. Second are GLP-1
              telehealth challengers—Hims & Hers (NYSE: HIMS), Ro, Found, and Calibrate—that offer medication-first
              weight loss with telehealth prescriptions and pharmacy-integrated delivery, increasingly encroaching on
              Noom's GLP-1 hybrid positioning. Third are enterprise-grade digital therapeutics platforms—Omada Health
              and Teladoc/Livongo—that sell B2B2C chronic condition management programs to employers and health plans.
              Fourth is the legacy incumbent WeightWatchers, which emerged from Chapter 11 bankruptcy in June 2025 after
              eliminating $1.15 billion in debt and is now aggressively expanding its own telehealth clinical business
              with 57% year-over-year clinical revenue growth. The competitive pressure is asymmetric: medication-first
              platforms can replicate behavioral features more easily than Noom can replicate vertically integrated
              pharmacy economics.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
