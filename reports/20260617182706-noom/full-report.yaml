              - CV036
      - number: '8.4'
        title: Scenario Valuation Bands
        blocks:
          - type: paragraph
            body: >-
              The bear case values Noom at approximately $400-600M. This scenario assumes legacy subscription revenue
              continues its decline to below $300M annually, Noom Med's GLP-1 revenue stalls at sub-$150M as FDA
              enforcement on compounded GLP-1s and branded competition from Lilly/Novo squeezes margins, and the company
              burns cash without reaching profitability. At 1.0-1.5x revenue on a $300-400M revenue base, the implied
              value sits meaningfully below the current secondary mark and would represent a further 20-45% downside
              from today's ~$720M implied level. This scenario also incorporates multiple compression toward the
              Teladoc/WW valuation band.


              The base case values Noom at approximately $700M-1.1B. This assumes revenue stabilizes at $500-600M driven
              by the GLP-1 program reaching $200-300M in annualized revenue (consistent with the disclosed $100M
              run-rate within four months of launch, extrapolated with moderate growth), partial offset of legacy
              subscriber attrition, and cost restructuring achieving near-breakeven EBITDA. A 1.5-2.0x multiple on
              $500-600M revenue yields the range. The bull case reaches $1.5-2.5B and requires Noom Med to scale
              aggressively to $500M+ in revenue (leveraging partnerships with five of the top 20 US health plans), the
              Noom Weight legacy base to stabilize, successful B2B2C enterprise expansion, and eventual IPO readiness.
              At 2.5-3.5x on $600-800M revenue, this scenario would imply 100-250% upside from current secondary levels
              and approach the multiples commanded by HIMS and Omada.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
          - type: table
