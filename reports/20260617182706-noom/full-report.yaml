  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio & Core Experience
        blocks:
          - type: paragraph
            body: >-
              Noom operates a multi-product digital health platform serving consumers directly (B2C) and through
              employers and health plans (B2B2C). The flagship product, Noom Weight, delivers a psychology-based weight
              management program through daily CBT-informed lessons, AI-powered food logging with a database of over one
              million items, color-coded calorie-density guidance (green, yellow, orange), step tracking with
              gamification rewards, personalized coaching, and peer support communities called Circles. The platform has
              served over 50 million registered users since launch. Noom Med, launched in May 2023, adds telehealth
              GLP-1 prescribing (semaglutide and tirzepatide) with integrated behavioral support, requiring
              participation in the behavioral program alongside medication. Noom expanded to a Microdose GLP-1Rx Program
              in 2025, offering compounded lower-dose semaglutide at $79 initial plus $199/month. Additional products
              include Noom Mood for stress and anxiety management using CBT, Noom Diabetes Prevention Program (first
              CDC-recognized mobile DPP), Noom + HRT for menopause management, and Noom Move with over 1,000 fitness
              classes. The enterprise arm, Noom for Work (launched 2022), provides employer and health-plan access to
              these programs, with Highmark deploying to nearly 2 million eligible members beginning January 2026.
              Pricing ranges from $17.42/month for annual Noom Weight plans to $349/month for full-dose GLP-1Rx programs
              including medication, all FSA/HSA eligible.
