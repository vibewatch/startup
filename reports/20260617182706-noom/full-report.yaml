      - number: '3.5'
        title: Threats and Disadvantages
        blocks:
          - type: paragraph
            body: >-
              Noom faces three structural competitive disadvantages. First, high churn: B2C weight-loss subscriptions
              suffer inherently high attrition, and GLP-1 discontinuation data shows 64–84% of non-diabetic patients
              stop medication within two years, creating risk that app engagement drops when medication stops. Second,
              pharmacy economics disadvantage: vertically integrated competitors like Ro control their medication supply
              chain, enabling lower per-unit costs that Noom cannot match without building or acquiring pharmacy
              infrastructure. Third, pricing pressure: Noom Med's Microdose GLP-1Rx starts at $79 then $199/month, while
              pure medication-first competitors offer compounded semaglutide from $99/month. The broader market is also
              experiencing rapid commoditization as generic and compounded GLP-1s proliferate, squeezing margins for all
              players. Additionally, Noom's secondary- market valuation has declined approximately 77% from its 2021
              peak of $3.7 billion to roughly $720 million in Q2 2026, reflecting investor skepticism about its
              competitive positioning relative to medication-first platforms with clearer pharmacy economics and faster
              revenue scaling.
            claimRefs:
              - CP040
