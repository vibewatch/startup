      - number: '3.2'
        title: Direct Behavioral and App Competitors
        blocks:
          - type: paragraph
            body: >-
              MyFitnessPal remains the largest competitor by registered user base with over 220 million accounts and 30
              million monthly active users, generating approximately $310 million in revenue under Francisco Partners
              ownership. Its strength is the world's largest food database and calorie-tracking simplicity, but it lacks
              Noom's behavioral coaching depth and has no GLP-1 clinical offering. Lifesum competes on AI-powered meal
              planning and personalized nutrition with a freemium model that undercuts Noom's premium pricing. Lose It!
              offers straightforward calorie counting with barcode scanning and AI photo recognition at lower price
              points. WeightWatchers, despite its Chapter 11 filing in May 2025, continues to serve over 3 million
              members globally and reported 57% clinical revenue growth in Q1 2025 through its WeightWatchers Clinic
              telehealth offering. After exiting bankruptcy in June 2025 with only $465 million in remaining debt (down
              from $1.6 billion), WW is investing in digital transformation and GLP-1 prescriptions. These app-based
              competitors generally lack Noom's psychology-driven coaching methodology but compete effectively on price,
              simplicity, and database breadth—and several are now adding GLP-1 access or AI-powered features.
