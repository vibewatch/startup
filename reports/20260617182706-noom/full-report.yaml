      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful growth driver is the global obesity epidemic: 40.3% of U.S. adults have obesity
              (CDC/NHANES 2021–2023 data), and WHO reports over 1 billion people globally living with obesity as of
              2022, with prevalence rising in nearly every country. This structural demand floor ensures sustained need
              for weight management solutions. The GLP-1 revolution simultaneously creates both opportunity and threat:
              GLP-1 drugs like Wegovy and Zepbound deliver 15–22% mean weight loss in trials, far exceeding
              behavioral-only programs, which drove approximately 12 million U.S. adults onto GLP-1 medications by end
              of 2026. For Noom, this creates opportunity through Noom Med (medication management plus coaching) but
              also devastating substitution risk for the core behavioral subscription product. Additional drivers
              include rising smartphone penetration, employer demand for preventive digital health solutions, AI-powered
              personalization, and expanded Medicare GLP-1 coverage beginning July 2026 at $245/month with $50 copay.
              Key constraints include high consumer churn typical of weight-loss subscriptions, the perception that
              medication makes behavioral apps obsolete, intense competition from telehealth-first GLP-1 providers
              (Hims, Ro, Found), FTC regulatory scrutiny over subscription practices, and price sensitivity in the
              consumer health app market where freemium models dominate (67% market share per Mordor Intelligence).
