      - number: '5.2'
        title: Behavioral/Coaching Methodology & Clinical Evidence
        blocks:
          - type: paragraph
            body: >-
              Noom's differentiation rests on a psychology-first methodology drawn from cognitive behavioral therapy
              (CBT), motivational interviewing, and habit formation science. The curriculum delivers daily 10-minute
              bite-sized lessons through articles and quizzes, targeting the psychological drivers of eating behavior
              rather than imposing food restrictions. The coaching model operates as a human-plus-AI hybrid: Welli, the
              AI chatbot launched in June 2024, provides 24/7 on-demand guidance while human goal specialists handle
              accountability and relationship building via direct messaging. Clinical evidence supports the approach
              across multiple studies. The 2016 Scientific Reports retrospective study (n=35,921) showed 77.9% of users
              achieved weight loss, with engagement frequency as the strongest predictor. The 2026 randomized controlled
              trial published in Obesity Science & Practice (n=427) demonstrated sustained weight loss of 4.1% body
              weight at 68 weeks—continuing to deepen for a full year after the 16-week active program ended—compared
              with 1.5% weight gain in the control group (p<0.001). Noom members were more than twice as likely to
              achieve clinically significant weight loss of at least 5% (41% vs 19.5%). For GLP-1 users, a January 2026
              analysis of 14,210 subscribers showed the most-engaged quartile lost 25.2% more weight (8.3 additional
              lbs) at week 40 than the least-engaged, and persisted 2.2x longer on their medication program. However,
              independent reviewers note that most Noom studies are observational or company-funded, long-term data
              beyond 68 weeks remains limited, and dropout rates are high—typical of B2C weight-loss apps.
