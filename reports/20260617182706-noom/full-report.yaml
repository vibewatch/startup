  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Noom's addressable market straddles several overlapping spending categories. The core market is
              consumer-facing digital weight management and behavior-change apps — a segment Mordor Intelligence sizes
              at $1.29 billion globally in 2026, growing at 16.9% CAGR to $2.83 billion by 2031. The broader digital
              health for obesity ecosystem, which includes wearable devices, telehealth platforms, AI coaching tools,
              and digital therapeutics, is valued between $78 billion and $99 billion in 2026 depending on the source
              and scope definition. Noom's expansion into Noom Med (telehealth-based GLP-1 prescriptions) places it
              partly in the U.S. telehealth market ($64–65B in 2026) and adjacent to the massive GLP-1 pharmaceutical
              market ($73B+ in 2026). The corporate wellness and employer health benefits channel ($66–72B in 2026)
              represents Noom's B2B2C opportunity through Noom for Work. Excluded spend includes purely pharmaceutical
              manufacturing, hospital-based bariatric surgery, in-person gym memberships without digital integration,
              and pure-play medical device companies. The market boundary matters because Noom's revenue model — B2C
              subscription plus B2B employer licensing plus telehealth medication management — means its addressable
              slice is meaningfully smaller than any single headline market figure.
            claimRefs:
              - CM001
              - CM002
