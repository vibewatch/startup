chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Business Model
        blocks:
          - type: paragraph
            body: >-
              Noom, Inc. (originally WorkSmart Labs, Inc.) is a consumer-first digital health company headquartered in
              New York, NY. Founded in 2008, the company employs a psychology-based approach to weight management,
              combining cognitive behavioral therapy (CBT) techniques with food logging, daily lessons, and human/AI
              coaching delivered through a mobile application. The company's revenue model is predominantly B2C
              subscription-based, with plans ranging from approximately $17–$70 per month depending on subscription
              length. Noom has expanded beyond its flagship Noom Weight product to include Noom Med (telehealth GLP-1
              prescriptions plus coaching, launched May 2023), Noom Mood (stress/anxiety CBT program), and Noom DPP
              (CDC- recognized diabetes prevention program). The company also monetizes through Noom for Work, a B2B2C
              channel targeting employers and health plans. Noom was the first mobile application recognized by the CDC
              as a certified diabetes prevention program and has received multiple NIH grants validating its
              behavior-change methodology. A 2026 randomized clinical trial showed 4.1% body weight loss sustained at 68
              weeks post-enrollment.
