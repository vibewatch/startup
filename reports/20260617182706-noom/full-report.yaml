      - number: '5.4'
        title: AI/ML & Technology Architecture
        blocks:
          - type: paragraph
            body: >-
              Noom's technology platform is built on a microservices architecture deployed on AWS, with native mobile
              apps for iOS (Swift) and Android (Kotlin), and a React.js web interface. The backend uses Python (Django)
              with PostgreSQL as the primary database, Redis for caching, and Kubernetes (EKS) for container
              orchestration. The AI/ML layer includes several customer-facing features: AI food logging via photo
              recognition, text, and voice input (launched June 2024); Welli, the GPT-powered personal health assistant
              trained on Noom-specific data; AI-powered body composition face and body scans (launched 2025); glucose
              curve forecasting; and algorithmic personalization of lesson content and coaching interventions. On the
              data engineering side, the platform processes engagement, weight, nutrition, and activity data through
              pipelines feeding analytics and ML model training. Noom's GitHub organization shows 41 public
              repositories—primarily forks, workflow actions (branch-cleanup-action), and utility tools rather than
              substantial open-source frameworks, indicating an engineering organization that is internal-facing. Job
              postings reveal use of GraphQL, RabbitMQ/SQS message queues, Terraform infrastructure-as-code, and CI/CD
              via GitHub Actions. The company maintains offices in New York City and Princeton, NJ, with a remote-first
              engineering culture. The AI team was built by data scientists and ML engineers specifically versed in
              digital healthcare, according to CPO Aaron Severs.
