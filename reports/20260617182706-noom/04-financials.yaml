- id: capital-structure-funding
  title: Capital Structure & Funding
  body: >-
    Noom has raised approximately $643M in cumulative funding, though tracker estimates range from $578M (Tracxn's
    earlier figure of $624M) to $669M (TechStackIPO) and $670M (FormBlends). The company's funding history spans
    at least 10–15 rounds since founding in 2008, with the transformative event being the May 2021 Series F of
    approximately $540M led by Silver Lake at a $3.7B post-money valuation. Other Series F participants included
    Oak HC/FT, Temasek, Novo Holdings, Sequoia Capital, RRE Ventures, and Samsung Ventures. Silver Lake's press
    release noted that a portion of capital was used for share repurchases. PremierAlts reports a Later Stage VC
    round in April 2025 (amount undisclosed) and total funding of $668.8M. On the secondary market, PM Insights
    data shows Noom's implied valuation fell to approximately $720M by Q2 2026—a 77%+ discount to the 2021 peak.
    The SEC EDGAR records confirm Noom (formerly WorkSmart Labs, Inc.) filed a Form D notice of exempt offering in
    January 2015, with CIK 0001595910. UK Companies House records for Noom Health UK Limited (company 13453588)
    show accounts filed as a small company through January 2025, indicating limited UK subsidiary scale. The wide
    range in total-raised figures ($578M–$669M) constitutes a data conflict that cannot be resolved without cap-table
    access; the canonical figure of ~$643M represents a mid-range consensus.
  claimRefs:
