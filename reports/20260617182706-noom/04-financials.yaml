- id: profitability-burn-runway
  title: Profitability, Burn & Runway
  body: >-
    Noom has never publicly disclosed profitability, operating margins, burn rate, or cash position. However,
    several signals suggest the company has undergone significant cost restructuring. In 2022, Noom executed
    at least two rounds of layoffs: first cutting approximately 25% of its coaching staff in April 2022 as part
    of an AI-coaching model shift, then reducing a further ~10% of total workforce (roughly 500 employees) in
    October 2022. MobiHealthNews reported in early 2025 that additional layoffs occurred as part of a "revenue mix
    shift" toward GLP-1 products. The company's stated rationale—building "a more efficient business"—implies that
    prior unit economics were unsustainable at the existing cost structure. The 2022 leadership transition from
    founder-CEO Saeju Jeong to Geoff Cook (a CEO with a track record of driving profitability at The Meet Group)
    further signals a board-level pivot from growth-at-all-costs to unit-economics discipline. Ad spend of $330M
    in 2023 against even $1B ARR implies a 33% sales-and-marketing-to-revenue ratio before accounting for coaching
    staff, technology, and G&A—making profitability unlikely without the restructuring. The acquisition of Tailor
    Made Compounding pharmacy in April 2026 adds vertical integration but also capital intensity. Without audited
    financials, the path to profitability remains a thesis rather than a demonstrated fact.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
