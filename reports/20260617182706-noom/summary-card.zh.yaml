summary:
  headline: Noom 是真实且规模很大的消费者健康品牌，但 2021 年 $3.7B 估值已难站住，二级市场已暗示约 $720M；现在是否值得投，取决于 GLP-1 Noom Med 转向能否抵消行为应用收入下滑和结构性冲击。
