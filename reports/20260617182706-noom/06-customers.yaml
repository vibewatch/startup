company:
  name: Noom
chapter:
  number: 6
  title: Customers
  summary: Noom has amassed 50M+ registered users but peak paying subscribers (~5M) have declined post-COVID. The customer base skews ~70% female, aged 35-54, primarily US-based. B2B employer/payer partnerships (Highmark, Collective Health, Navitus, Personify Health) are expanding but remain a small share of revenue. Acquisition relies on a high-converting psychology-driven quiz funnel via paid social, while retention faces structural headwinds including a $62M class-action settlement over dark-pattern cancellation practices and persistent consumer complaints.
sections:
- id: customer-base-segmentation
  title: Customer Base and Segmentation
  body: >
    Noom's customer base divides into two principal channels. The dominant B2C direct-to-consumer segment
    comprises individual subscribers who discover Noom through paid social ads (primarily Meta, TikTok, YouTube)
    and convert through the company's signature 40-100 question onboarding quiz funnel. The smaller but
    growing B2B2C channel, branded Noom Health (formerly Noom for Work), distributes Noom Weight, Noom Med,
    Noom Diabetes Prevention, and GLP-1 Companion programs through employer health plans and benefits
    administrators. Noom claims to offer programs to "millions of covered lives" through this enterprise arm.
    Within B2C, demographic data from SimilarWeb and Noom's own company overview documents indicate the
    audience skews approximately 70% female and 30% male, with the largest age cohort being 45-54 years old.
    Noom has stated it has welcomed over 8 million women ages 40-60 into its programs. Geographic concentration
    is heavily US-centric, with roughly 80% of web traffic originating domestically, followed by Canada, UK,
    and Australia. The cumulative registered user base exceeds 50 million, but the paying subscriber count
    peaked at approximately 5 million during the 2020-2021 COVID surge and has since declined to low
    single-digit millions. This gap between registered and paying users reflects both the free-trial funnel
    architecture and the high churn inherent to consumer weight-loss subscriptions.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
