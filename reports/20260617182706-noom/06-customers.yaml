- id: b2c-subscriber-economics
  title: B2C Subscriber Economics and Demographics
  body: >
    Noom's B2C model charges monthly subscription fees ranging from $70/month (monthly plan) to $17.42/month
    (annual plan at $209/year). The Noom Med clinical program with GLP-1 prescriptions carries additional
    costs. Pricing has increased steadily, with users reporting renewal at higher rates than initial promotional
    offers. Revenue peaked at approximately $400 million in 2021 during COVID-driven demand, with estimates
    suggesting a decline to roughly $296 million by 2025-2026. The typical Noom subscriber is a US-based woman
    aged 35-54 seeking sustainable behavior-change-based weight loss rather than restrictive dieting.
    Psychographic fit emphasizes emotional eaters, yo-yo dieters, and those seeking structured psychological
    support. Noom's published clinical data reports 78% of users lose weight and 56% achieve at least 5% body
    weight loss within six months, per a study in JMIR mHealth. The largest-ever Noom RCT (427 adults,
    published June 2026 in Obesity Science & Practice) showed members lost an average 4.1% body weight by
    week 68, with weight loss continuing for a full year after the 16-week program ended. These outcome
    metrics are notable but reflect engaged completers rather than all subscribers, and the company does not
    publicly disclose churn-adjusted completion rates or lifetime value by cohort.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: b2b-employer-payer
  title: B2B Employer and Payer Channel
  body: >
    Noom Health, the enterprise division, has accelerated B2B partnerships since 2023. The most significant
    announced partnership is with Highmark Health, which beginning January 2026 offers customized Noom Weight
    Management journeys to nearly 2 million eligible commercial plan members across Pennsylvania, West Virginia,
    Delaware, and New York. Highmark described the launch as "one of the most successful new solutions we've ever
    offered." Other verified B2B partners include Collective Health (joint Noom Med with SmartRx offering for
    employers, announced March 2025), Waltz Health (GLP-1 affordability and fulfillment for employers), Navitus
    Health Solutions (Noom Weight, DPP, and Mood programs for 11M+ covered lives, October 2023), Castlight Health
    (navigation platform integration), and Personify Health (enterprise marketplace certification). Noom's
    Personify Health listing claims 25% average employee enrollment rate and 40% of engaged users losing 5%+ body
    weight. Collective Health estimates 28% potential savings for employers covering GLP-1 drugs through the joint
    program. The B2B channel addresses employer demand for cost-effective obesity management amid soaring GLP-1
    medication costs, but revenue contribution from B2B relative to B2C remains undisclosed. The channel is
    strategically critical as it provides more predictable multi-year contract revenue versus volatile consumer
    subscriptions.
  claimRefs:
  - CU015
  - CU016
