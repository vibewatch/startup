- id: satisfaction-reviews-complaints
  title: Satisfaction, Reviews, and Complaints
  body: >
    Noom receives mixed but generally positive app store ratings: 4.7/5 on the Apple App Store (860,000+ ratings)
    and 4.1/5 on Google Play (314,000+ reviews, 10M+ downloads). Professional review scores range from 7.2/10
    to 9/10 in 2026 evaluations. However, consumer complaint platforms reveal persistent issues. Trustpilot hosts
    66,000+ reviews with significant negative sentiment around billing and cancellation. The Better Business Bureau
    received 1,200+ complaints leading to a past "D" rating, though the company has since improved some practices.
    ComplaintsBoard and PissedConsumer show recurring patterns: surprise charges, difficult cancellations,
    unresponsive customer service, and bot-like coaching. The most significant adverse event was the 2022 $62M
    class-action settlement ($56M cash + $6M credits) covering approximately 2 million users who purchased
    auto-renewing subscriptions between May 2016 and October 2020. The lawsuit alleged Noom made cancellation
    "difficult by design," with a former engineer quoted confirming intentional friction. Settlement reforms
    required clearer auto-renewal disclosures, explicit opt-in checkboxes, and easier cancellation buttons.
    Post-settlement, some complaints persist around pricing opacity and aggressive retention flows, but
    the company has materially improved its cancellation process. Reddit r/noom communities in 2026 cite repetitive
    content, low calorie recommendations, and poor coaching personalization as ongoing frustrations, though many
    users report successful weight loss outcomes.
  claimRefs:
