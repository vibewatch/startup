- id: investor-returns-and-exit-path
  title: Investor Returns, Exit Readiness, and Re-rating Path
  body: >-
    For Series F investors who entered at the $3.7B valuation, the current ~$720M secondary implied value represents approximately 81% unrealized loss before accounting for liquidation preferences and secondary transaction discounts. Silver Lake's $540M investment now implies roughly $105M in common-equivalent value (though preference stack details are not publicly disclosed and likely provide some downside protection). Earlier-stage investors fare better: Series E investors at the 2019 valuation likely still carry modest positive returns, and seed/Series A-C investors retain significant multiples on invested capital despite the markdown.


    The path to re-rating depends primarily on the GLP-1 revenue trajectory. If Noom Med demonstrates sustained growth from its $100M run-rate (disclosed February 2025) toward $300-500M in annual revenue, combined with evidence of strong unit economics and subscriber retention, the market would likely rerate Noom toward the Omada/HIMS multiple band of 2.5-3.5x. IPO readiness requires demonstrating revenue growth reacceleration, margin expansion, and reduced regulatory risk from FTC subscription enforcement and FDA compounding scrutiny. The thesis-break triggers are measurable: continued revenue decline below $400M, GLP-1 program stalling or regulatory forced withdrawal of compounded medications, inability to demonstrate path to profitability, or another round of material layoffs indicating structural rather than cyclical distress. The recommendation is to track rather than invest at current levels: the secondary mark looks roughly fair given uncertainty, but does not offer sufficient margin of safety without better visibility into audited financials and GLP-1 revenue sustainability.
