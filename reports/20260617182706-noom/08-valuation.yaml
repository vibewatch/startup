company:
  name: Noom
chapter:
  number: 8
  title: Valuation
  summary: Noom's valuation has collapsed from a $3.7B peak at its May 2021 Series F to an implied ~$720M on secondary markets in Q2 2026, representing a ~77% discount. Revenue-multiple analysis against public comparables (Hims & Hers at ~3.2x, Omada Health at ~3.6x, Teladoc at ~0.55x, WW post-bankruptcy) suggests the secondary mark implies a sub-1x revenue multiple on estimated peak revenue, which could be fair-to-cheap if GLP-1 revenue inflects but stretched if legacy subscription continues to erode. The appropriate stance is track with medium confidence and high risk, pending confirmation of Noom Med's revenue trajectory.
sections:
- id: valuation-history-and-resets
  title: Valuation History and Resets
  body: >-
    Noom's valuation story is one of dramatic peak-to-trough compression. The company raised approximately $643M cumulatively across rounds from seed through Series F. The Series F in May 2021 was the defining liquidity event: $540M raised at a $3.7B post-money valuation, led by Silver Lake with participation from Oak HC/FT, Temasek, Novo Holdings, Sequoia Capital, RRE Ventures, and Samsung Ventures. At the time, Noom's revenue had reportedly reached approximately $400M (FY2020), implying a roughly 9x trailing revenue multiple at the Series F mark. Management reportedly discussed IPO plans at valuations approaching $10B within a year of the raise.


    The valuation reset has been severe. By mid-2026, secondary-market transactions imply a valuation of approximately $720M — a roughly 77-81% discount to the Series F price. Multiple factors drove this compression: the post-COVID normalization of digital health engagement, aggressive cost cutting and layoffs (approximately 20% of staff in 2022, further restructuring in 2023-2024), FTC scrutiny over subscription dark patterns resulting in a $56M class-action settlement, the competitive disruption from GLP-1 medications (Ozempic, Wegovy, Zepbound) reshaping the weight-loss market, and declining legacy app subscriber counts from a peak of approximately 5M paying subscribers. The Noom SEC Form D filing (CIK 0001595910) confirms the entity was originally incorporated as WorkSmart Labs in Delaware, providing statutory anchoring for the company's capital-raising history. Noom has not filed an S-1 and does not appear on any confirmed 2026 IPO docket, though Forge Global lists it as a "highly anticipated" watchlist candidate with uncertain timing.
