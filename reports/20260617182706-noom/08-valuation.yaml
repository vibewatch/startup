- id: secondary-market-signals
  title: Secondary-Market Signals
  body: >-
    The secondary market provides the most current price discovery for Noom equity. As of April-June 2026, multiple platforms track Noom shares actively. PM Insights reports an implied valuation of approximately $722M based on recent secondary transactions. Notice.co quotes a share price of approximately $11.69, broadly consistent with the $713-722M enterprise value range across platforms. Caplight similarly lists Noom with active funding round data and comparable company overlays. Forge Global shows active bids and asks with $272M in secondary market activity over the most recent 90-day window, indicating meaningful institutional interest at these reduced levels despite the steep discount.


    The ~77% discount from the Series F is severe but not unprecedented for 2021-vintage growth rounds. The implied revenue multiple at secondary levels depends heavily on current revenue estimates: if Noom's revenue has stabilized at approximately $500M+ (accounting for the GLP-1 Rx ramp offsetting legacy subscriber attrition), the secondary mark implies a sub-1.5x revenue multiple. If revenue has fallen below $400M due to faster-than-expected legacy churn, the multiple could be closer to 1.8-2.0x. This ambiguity is itself a key valuation issue: Noom remains private and has not disclosed audited financials, making revenue estimation inherently uncertain and forcing secondary buyers to price on incomplete information. The contrast between Sacra's estimate of $1B ARR in 2023 (growing 25% YoY) and the steep valuation discount suggests the market is pricing execution risk and competitive disruption rather than a pure revenue collapse.
