- id: comparable-company-analysis
  title: Comparable-Company and Multiple Analysis
  body: >-
    The public comparable set for Noom spans telehealth, consumer digital health, and weight-loss companies. Hims & Hers Health (NYSE: HIMS) is the most relevant public analog as a D2C telehealth platform with major GLP-1 exposure. HIMS trades at approximately $6.2-7.4B market cap on $2.8-3.0B guided 2026 revenue, implying a P/S ratio of approximately 2.6-3.2x on a trailing basis. HIMS demonstrates what premium multiples look like for a high-growth consumer health platform with direct GLP-1 revenue.


    Omada Health (NASDAQ: OMDA), which IPO'd in June 2025, reported Q1 2026 revenue of $78M (42% YoY growth) and trades at approximately $1.03B market cap with a P/S of roughly 3.6x on forward revenue guidance of $322-330M. Omada represents the B2B digital health comp with employer/payer distribution analogous to Noom for Work. Teladoc Health (NYSE: TDOC) trades at a deeply discounted P/S of approximately 0.55x on ~$2.5B revenue, reflecting flat-to-declining growth and the market's severe punishment of post-COVID telehealth platforms. WeightWatchers (WW) emerged from Chapter 11 bankruptcy in June 2025 after eliminating $1.15B of debt, with Q4 2025 revenue of $163M (down 12% YoY) and clinical revenue growing 32% — the closest analog for what legacy behavioral weight-loss looks like during GLP-1 disruption. The Noom secondary-market implied multiple of ~1.0-1.5x revenue sits between the Teladoc discount floor and the Omada/HIMS growth premium, consistent with a business facing near-term headwinds but with upside optionality from Noom Med.
