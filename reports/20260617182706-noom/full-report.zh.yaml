      - number: '6.5'
        title: 满意度、评论与投诉
        blocks:
          - type: paragraph
            body: >
              Noom 的应用商店评分褒贬不一但总体偏正面：Apple App Store 为 4.7/5（860,000+ 条评分），Google Play 为 4.1/5（314,000+ 条评论、10M+
              下载）。2026 年专业评测分数在 7.2/10 到 9/10 之间。不过，消费者投诉平台暴露出持续问题。Trustpilot 有 66,000+ 条评论，围绕计费和取消订阅的负面情绪显著。Better
              Business Bureau 曾收到 1,200+ 起投诉，并导致过去出现 “D” 评级，尽管公司后来改善了部分做法。ComplaintsBoard 和 PissedConsumer
              显示反复出现的模式：意外扣费、取消困难、客服无响应、教练像机器人。最重大的负面事件是 2022 年 $62M 集体诉讼和解（$56M 现金 + $6M 额度），覆盖约 200 万名在 2016 年 5 月至
              2020 年 10 月购买自动续费订阅的用户。诉讼称 Noom
              把取消订阅设计得“故意困难”，并引用一名前工程师的话确认公司有意增加摩擦。和解改革要求更清晰的自动续费披露、明确的选择加入复选框，以及更容易找到的取消按钮。和解后，围绕价格不透明和激进留存流程的投诉仍然存在，但公司取消流程已有实质改善。2026
              年 Reddit r/noom 社区仍提到内容重复、热量建议偏低、教练个性化不足等持续痛点，尽管许多用户也报告了成功减重结果。
