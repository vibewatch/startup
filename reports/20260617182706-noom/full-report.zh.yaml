      - number: '7.3'
        title: 数据隐私与合规风险
        blocks:
          - type: paragraph
            body: >-
              作为收集敏感体重、用药和行为数据的数字健康平台，Noom 暴露在不断演变的隐私执法中。HHS Office for Civil Rights 在 2022 年 12 月发布指导（2024 年 6
              月对未认证页面部分撤销），明确当受覆盖实体页面上的跟踪技术传输受保护健康信息时，HIPAA 义务适用。虽然 Noom 本身在所有场景下未必都是 HIPAA 受覆盖实体，但 Meta Pixel 集体诉讼（John
              Doe v. Meta Platforms, N.D. Cal.）已经越过驳回阶段，并牵涉 664+ 家医院系统，显示使用第三方跟踪像素的健康平台面临全行业法律风险。Legacy Health 和 Garnet
              Health 均在 2026 年 2 月就像素相关集体诉讼达成和解。Noom 自身隐私政策（noom.com/about-us）披露使用分析和广告技术。如果 Noom Med
              开具药物处方，其运营更接近受覆盖实体领域，HIPAA 合规义务也会提高。CCPA/CPRA、Washington My Health My Data Act 和 Connecticut
              健康数据法规等州隐私法律，也独立为收集敏感健康信息的数字健康公司创造诉讼面。Noom 拥有 50M+ 注册用户，任何数据泄露或不当披露事件中的单次事件敞口都会被放大。
