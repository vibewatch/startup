      - number: '6.3'
        title: B2B 雇主与支付方渠道
        blocks:
          - type: paragraph
            body: >
              企业部门 Noom Health 自 2023 年以来加速推进 B2B 合作。最重要的已宣布合作方是 Highmark Health；从 2026 年 1 月起，Highmark 将向
              Pennsylvania、West Virginia、Delaware 和 New York 近 200 万名符合资格的商业计划会员提供定制化 Noom Weight Management 路径。Highmark
              称这次上线是“我们提供过的最成功的新方案之一”。其他已验证 B2B 合作伙伴包括 Collective Health（2025 年 3 月宣布，与 SmartRx 联合向雇主提供 Noom Med）、Waltz
              Health（面向雇主的 GLP-1 可负担性和履约）、Navitus Health Solutions（面向 1,100 万+ 被保障人群提供 Noom Weight、DPP 和 Mood 项目，2023 年
              10 月）、Castlight Health（导航平台集成）和 Personify Health（企业市场认证）。Noom 在 Personify Health 的页面称，员工平均注册率为 25%，参与用户中
              40% 减掉 5%+ 体重。Collective Health 估计，雇主若通过联合项目覆盖 GLP-1 药物，可节省 28% 潜在成本。在 GLP-1 药物成本飙升的背景下，B2B
              渠道回应了雇主对高性价比肥胖管理的需求，但 B2B 相对 B2C 的收入贡献尚未披露。该渠道在战略上很关键，因为它能带来比波动的消费者订阅更可预测的多年合同收入。
