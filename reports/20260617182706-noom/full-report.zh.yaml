      - 阈值 / 事件
      - 对投资论点的传导
      - 操作含义
    rows:
      - - 收入下滑坐实
        - 审计或泄露收入低于 $400M（FY2025/2026）
        - 证实峰值后侵蚀超过 GLP-1 抵消；进入悲观情形
        - 退出二级市场持仓；降至回避
      - - GLP-1 监管扰动
        - FDA 针对复方 GLP-1 开方方的执法实质影响 Noom Med
        - 拿掉主要增长引擎；临床基础设施投入被套住
        - 按悲观情形重新测算；跟踪 FDA 警告信
      - - 持续裁员或现金危机
        - 第三轮重大重组，或以低于 $500M 估值紧急融资
        - 显示结构性困境，而非周期性调整
        - 将信心降至低；考虑核销情景
      - - IPO 申报或战略收购
        - S-1 申报，或 M&A 价格高于二级市场标记
        - 验证重估论点；提供流动性和披露
        - 若价格留有安全边际，上调至买入
