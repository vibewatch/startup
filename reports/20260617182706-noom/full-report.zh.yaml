      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动是全球肥胖流行：美国 40.3% 成年人患有肥胖（CDC/NHANES 2021–2023 数据），WHO 报告称截至 2022 年全球超过 1B
              人患有肥胖，且几乎所有国家患病率都在上升。这一结构性需求底部保证体重管理方案长期有需求。GLP-1 革命同时创造机会和威胁： Wegovy、Zepbound 等 GLP-1 药物在试验中实现 15–22%
              平均减重，远超纯行为项目，并推动到 2026 年底约 12M 美国成年人使用 GLP-1 药物。对 Noom 来说，Noom
              Med（药物管理加教练）带来机会，但核心行为订阅产品也面临毁灭性替代风险。其他驱动包括智能手机渗透率上升、 雇主对预防性数字健康方案的需求、AI 驱动个性化，以及 2026 年 7 月起扩大 Medicare
              GLP-1 覆盖，价格为每月 $245、共付 $50。 关键约束包括减重订阅常见的高消费者流失率、药物让行为应用过时的认知、来自远程医疗优先 GLP-1 提供商（Hims、Ro、Found）的激烈竞争、 FTC
              对订阅做法的监管审查，以及消费者健康应用市场的价格敏感性，在该市场免费增值模式占主导（Mordor Intelligence 称市场份额 67%）。
