      - number: '6.2'
        title: B2C 订阅经济性与人口特征
        blocks:
          - type: paragraph
            body: >
              Noom 的 B2C 模式按月收订阅费，从 $70/月（月度方案）到 $17.42/月（年度方案，$209/年）不等。带 GLP-1 处方的 Noom Med
              临床项目另行收费。定价持续上行，用户反馈续费价格高于首次促销价。收入在 COVID 需求推动下于 2021 年约达到 $400 million 峰值，估计到 2025-2026 年降至约 $296
              million。典型 Noom 订阅者是 35-54 岁、居住在美国的女性，寻求基于可持续行为改变的减重，而不是限制性节食。心理画像更契合情绪性进食者、反复减重者，以及希望获得结构化心理支持的人群。Noom
              发表的临床数据显示，78% 用户体重下降，56% 用户在六个月内减掉至少 5% 体重，来源为 JMIR mHealth 的一项研究。Noom 迄今最大规模 RCT（427 名成人，2026 年 6 月发表于
              Obesity Science & Practice）显示，会员到第 68 周平均减掉 4.1% 体重；16
              周项目结束后，减重仍持续整整一年。这些结果指标值得关注，但反映的是参与度较高的完成者，而不是全部订阅者；公司也没有公开披露按流失调整后的完成率或按 cohort 划分的生命周期价值。
