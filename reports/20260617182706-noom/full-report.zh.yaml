      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Noom 处在三类高执法强度监管领域的交汇处：FTC 订阅 / 负选择实践、FDA 对远程医疗和复方药的监管，以及州消费者保护法。公司曾就自动续费暗黑模式达成 $62M 集体诉讼和解（Wittels
              McInturff Palikovic v. Noom Inc., S.D.N.Y.，2022 年 7 月最终批准），同意修改商业做法，包括明确选择加入同意、更容易取消订阅和续费提醒。尽管该诉讼已经解决，FTC
              仍在 ROSCA 和 Section 5 下积极执法，并于 2026 年 3 月启动新的 ANPRM，试图恢复已被撤销的 Click-to-Cancel 规则。Noom 的订阅模式仍包含多年期承诺、GLP-1
              项目按季度计费和复杂取消流程，因此仍暴露于未来 FTC 行动或约 30 个拥有自动续费法律的州总检察长执法风险。另一方面，FDA 在 2026 年 3 月向 30 家远程医疗公司发出警告信，原因是其对复方
              GLP-1 产品进行误导性营销。Noom Med 目前依据 Section 503A 例外销售复方 semaglutide；pharmaphorum 报道，Novo Nordisk 和 Eli Lilly
              正在起诉挑战复方药框架。如果法院或监管机构限制 503A 复方，或认定 Noom 的产品“本质上是已获批药物的复制品”，整个 Noom Med 供应链都会面临中断风险。
