  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分群
        blocks:
          - type: paragraph
            body: >
              Noom 的客户基础分为两个主要渠道。占主导的 B2C 直面消费者板块由个人订阅者构成，他们主要通过付费社交广告（Meta、TikTok、YouTube）发现 Noom，并经过公司标志性的 40-100
              题入门测验漏斗转化。规模较小但在增长的 B2B2C 渠道名为 Noom Health（原 Noom for Work），通过雇主健康计划和福利管理机构分发 Noom Weight、Noom Med、Noom
              Diabetes Prevention 和 GLP-1 Companion 项目。Noom 称，企业业务覆盖“数百万被保障人群”。B2C 内部，SimilarWeb 和 Noom 自身公司概览文件显示，受众约
              70% 为女性、30% 为男性，最大年龄组为 45-54 岁。Noom 曾表示，已有超过 800 万名 40-60 岁女性加入其项目。地域分布高度以美国为中心，约 80%
              网站流量来自美国，其后是加拿大、英国和澳大利亚。累计注册用户超过 5,000 万，但付费订阅者在 2020-2021 年 COVID 高峰期约达到 500
              万峰值，此后降至低个位数百万。注册用户和付费用户之间的落差，既反映免费试用漏斗结构，也反映消费级减重订阅天然高流失。
