      - number: '8.2'
        title: 二级市场信号
        blocks:
          - type: paragraph
            body: >-
              二级市场为 Noom 股权提供了最新价格发现。截至 2026 年 4-6 月，多家平台在活跃跟踪 Noom 股票。PM Insights 基于近期二级交易报告约 $722M 的隐含估值。Notice.co 报价约
              $11.69/股，与各平台 $713-722M 企业价值区间大体一致。Caplight 同样列出 Noom 的活跃融资轮数据和可比公司叠加信息。Forge Global 显示活跃买卖报价，最近 90
              天二级市场活动为 $272M，说明即便折价很深，机构在这些降低后的价位仍有实质兴趣。


              Series F 以来约 77% 的折价很严厉，但对于 2021 年成长轮并非没有先例。二级价位对应的隐含收入倍数高度取决于当前收入估计：如果 Noom 收入稳定在约 $500M+（GLP-1 Rx
              放量抵消传统订阅者流失），二级标记意味着低于 1.5x 的收入倍数。如果传统业务流失快于预期，收入已跌破 $400M，倍数可能更接近 1.8-2.0x。这种模糊性本身就是关键估值问题：Noom
              仍是私营公司，未披露经审计财务，收入估计天然不确定，迫使二级买家在信息不完整的情况下定价。Sacra 估计 2023 年 ARR 为 $1B（同比增长
              25%），而估值却大幅折价；两者反差说明，市场定价的更可能是执行风险和竞争颠覆，而不是单纯收入崩塌。
