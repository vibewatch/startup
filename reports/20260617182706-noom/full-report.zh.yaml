      - number: '5.2'
        title: 行为 / 教练方法与临床证据
        blocks:
          - type: paragraph
            body: >-
              Noom 的差异化来自以心理学为先的方法，吸收认知行为疗法（CBT）、动机式访谈和习惯形成科学。课程通过文章和测验交付每日 10 分钟碎片化内容，
              目标是影响进食行为的心理驱动因素，而不是强加饮食限制。教练模型采用「人工加 AI」混合：2024 年 6 月推出的 AI 聊天机器人 Welli 提供 24/7
              按需指导，人工目标专家通过直接消息负责问责和关系建设。多项研究支持该方法。2016 年 Scientific Reports 回顾性研究（n=35,921） 显示 77.9%
              用户实现减重，互动频率是最强预测因子。2026 年发表于 Obesity Science & Practice 的随机对照试验（n=427）显示， 68 周时维持 4.1% 体重下降——在 16
              周主动项目结束后整整一年仍继续加深——对照组则体重增加 1.5%（p<0.001）。Noom 会员达到至少 5% 临床显著减重的可能性超过两倍（41% vs 19.5%）。对 GLP-1 用户，2026 年 1
              月一项覆盖 14,210 名订阅用户的分析显示，互动最高四分位在 第 40 周比互动最低组多减重 25.2%（多 8.3 lbs），并在用药项目上坚持 2.2 倍更久。不过，独立评审指出，大多数 Noom
              研究是观察性或公司资助， 超过 68 周的长期数据仍有限，退出率较高——这也是 B2C 减重应用的典型问题。
