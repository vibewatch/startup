companyProfile:
  summary: >-
    Noom, Inc.（原名 WorkSmart Labs）是一家总部位于纽约的数字健康公司，由 Saeju Jeong 和 Artem Petakov 于 2008 年创立，打造了一个以心理学为先、基于 CBT
    的体重管理应用。COVID 期间需求激增，公司在 2021 年 5 月以约 $540M 融资拿到 $3.7B Series F 估值；随后 Noom 遭遇疫情后收入下滑、2022 年约 20% 裁员、从纯人工教练转向新模式， 以及
    GLP-1 抗肥胖药带来的结构性冲击。公司已围绕 Noom Med（远程医疗 GLP-1 处方加行为教练）和 AI 辅助教练模式重新定位， 由 2023 年 7 月上任的 CEO Geoff Cook 领导。Noom
    披露累计注册用户超过 50M、员工约 2,500 人，但财务数据仍大多不公开； 二级市场定价显示，估值已较 2021 年峰值大幅重置约 77%。
