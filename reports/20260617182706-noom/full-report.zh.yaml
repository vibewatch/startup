      - number: '3.5'
        title: 威胁与劣势
        blocks:
          - type: paragraph
            body: >-
              Noom 面临三项结构性竞争劣势。第一，高流失：B2C 减重订阅天生流失率高，GLP-1 停药数据显示 64–84% 的非糖尿病患者会在两年内停药；
              如果应用互动与用药依从性高度绑定，停药后参与度下滑就是风险。第二，药房经济劣势：Ro 等垂直整合竞争者控制药物供应链，能降低单位成本； Noom 不自建或收购药房基础设施，就很难匹配。第三，价格压力：Noom
              Med 的 Microdose GLP-1Rx 起价 $79，随后 $199/月； 纯药物优先竞争者的复方 semaglutide 从 $99/月起。更广泛市场也在快速商品化，仿制和复方 GLP-1
              扩散，挤压所有玩家利润率。此外， Noom 二级市场估值已从 2021 年 $3.7B 峰值下降约 77%，至 2026 年 Q2 约 $720M，反映投资者对其相对于药物优先平台竞争定位的怀疑；
              后者药房经济更清晰，收入放大更快。
            claimRefs:
