      - number: '7.5'
        title: 运营、关键人物与执行风险
        blocks:
          - type: paragraph
            body: >-
              Noom 在 2022 年裁员约 20%；MobiHealthNews 确认，2024-2025 年还有与“收入组合转向”GLP-1 产品有关的额外裁员。员工数已从约 3,400 人峰值降至约 2,500
              人。这轮重组与 2023 年 7 月 CEO 交接重叠：联合创始人 Saeju Jeong 转任执行董事长，Geoff Cook（前 MeetMe/The Meet Group CEO）接任
              CEO。领导层交接带来执行风险，因为 Noom 一边把核心商业模式从行为教练转向药物加教练，一边处理反复重组带来的士气挑战。Glassdoor
              和员工评论显示，成本削减和战略不确定性已经造成文化压力。关键人物风险中等：联合创始人 Artem Petakov 仍任 President，提供连续性，但新领导层之下，公司公开叙事已显著变化。运营上，Noom
              现在管理双轨复杂业务——传统软件订阅（Noom Weight、Noom Mood）与临床远程医疗业务（Noom
              Med）并行，后者需要医生网络、药房合作、冷链药物物流和临床合规。运营复杂度带来整合风险，尤其当监管变化迫使 GLP-1 供应模式快速调整时。
