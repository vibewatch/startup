chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Noom, Inc.（原名 WorkSmart Labs, Inc.）是一家总部位于纽约州纽约市、以消费者为先的数字健康公司。公司成立于 2008
              年，用基于心理学的方法做体重管理：把认知行为疗法（CBT）技巧、饮食记录、每日课程，以及通过移动应用交付的人工 / AI 教练结合起来。收入模式以 B2C 订阅为主，计划价格约每月
              $17–$70，取决于订阅时长。Noom 已从旗舰产品 Noom Weight 扩展到 Noom Med（远程医疗 GLP-1 处方加教练，2023 年 5 月推出）、Noom Mood（压力 / 焦虑 CBT
              项目）和 Noom DPP （CDC 认证的糖尿病预防项目）。公司还通过 Noom for Work 变现，这是面向雇主和健康计划的 B2B2C 渠道。Noom 是首个被 CDC
              认定为认证糖尿病预防项目的移动应用，也获得多项 NIH 资助来验证其行为改变方法。2026 年一项随机临床试验显示，入组后 68 周仍维持 4.1% 的体重下降。
