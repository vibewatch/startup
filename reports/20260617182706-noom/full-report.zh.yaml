  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与重置
        blocks:
          - type: paragraph
            body: >-
              Noom 的估值故事，是一次从峰值到谷底的剧烈压缩。公司从种子轮到 Series F 累计融资约 $643M。2021 年 5 月 Series F 是决定性流动性事件：由 Silver Lake 领投，Oak
              HC/FT、Temasek、Novo Holdings、Sequoia Capital、RRE Ventures 和 Samsung Ventures 参投，公司以 $3.7B 投后估值融资 $540M。当时
              Noom 收入据称已达到约 $400M（FY2020），意味着 Series F 标记下约 9x 的往绩收入倍数。管理层据称曾在融资后一年内讨论以接近 $10B 估值 IPO 的计划。


              估值重置非常严厉。到 2026 年中，二级市场交易暗示估值约 $720M，较 Series F 价格折价约 77-81%。多重因素推动了压缩：COVID 后数字健康参与度常态化、激进成本削减和裁员（2022 年约
              20% 员工，2023-2024 年进一步重组）、FTC 对订阅暗黑模式的审查并导致 $56M 集体诉讼和解、GLP-1
              药物（Ozempic、Wegovy、Zepbound）重塑减重市场带来的竞争颠覆，以及传统应用付费订阅者从约 5M 峰值下降。Noom SEC Form D 申报（CIK 0001595910）确认该实体最初在
              Delaware 以 WorkSmart Labs 名义注册，为公司的融资历史提供了法定锚点。Noom 尚未提交 S-1，也没有出现在任何已确认的 2026 年 IPO 日程上，尽管 Forge Global
              将其列为“备受期待”的观察名单候选，时间仍不确定。
