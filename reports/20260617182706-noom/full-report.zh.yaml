      - number: '1.5'
        title: 不利事件与风险信号
        blocks:
          - type: paragraph
            body: >-
              2022 年，Noom 同意以 $62M 达成集体诉讼和解（$56M 现金加 $6M 订阅积分），解决其被指控使用欺骗性自动续费做法和暗黑模式取消障碍的问题。 和解要求 Noom
              推出自助取消、自动续费明确同意复选框，并更清晰披露订阅条款。这与 FTC 更广泛的「Click-to-Cancel」执法趋势一致。 2022 至 2025 年间，公司裁员约 20%；随着商业模式从高人工教练转向
              AI 和药物管理，教练人员受到的影响不成比例。GLP-1 市场冲击 （Wegovy、Ozempic、Zepbound）一边蚕食传统行为减重需求，一边创造出 Noom 正通过 Noom Med 追逐的新机会。高
              B2C 订阅流失率仍是减重品类内生的结构性风险。 2026 年 4 月，Noom 收购 Tailor Made Compounding，这是其首个重大 M&A，业务扩展到健康老龄化和复方肽——这一细分正面临
              FDA 监管审查。
