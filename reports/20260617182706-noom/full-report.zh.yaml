      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Noom 由 Saeju Jeong 和 Artem Petakov 于 2008 年联合创立。Jeong 出生于韩国医师家庭，受父亲「把疾病治疗转向预防护理」 愿景启发。他自创立起担任 CEO 至 2023 年
              7 月，随后按计划接任执行董事长。技术联合创始人 Artem Petakov 担任总裁，负责产品和工程。 2023 年 7 月，Geoff Cook 出任 CEO；Cook 曾创立并领导 The Meet
              Group 完成 IPO 和后续出售，带来消费者科技规模化经验。 这次领导层交接释放出信号：在公司应对疫情后订阅用户下滑和 GLP-1 市场冲击时，Noom 从创始人驱动增长转向专业化运营管理。
              公开治理披露仍有限——审阅来源中没有完整董事会名单或所有权拆分，关键人物集中度和治理结构仍是待尽调问题。
