      - number: '2.3'
        title: 买方 / 用户 / 支付方分层
        blocks:
          - type: paragraph
            body: >-
              Noom 服务三种不同的买方—支付方配置。B2C 渠道中，个人消费者既是买方也是支付方，通常购买每月 $17–$59 的月度或年度订阅。 用户是寻求减重或健康行为改变的个人，动机来自个人健康目标、医生建议或
              GLP-1 用药支持。B2B2C 雇主渠道（Noom for Work）中， 买方是 HR /
              福利决策者，支付方是雇主或健康计划，用户是参保员工及其家属。资金来自企业健康预算，采用动力来自医疗成本上升、慢病患病率和生产力目标。 Noom Med 远程医疗渠道中，买方—用户是寻求 GLP-1
              处方和教练支持的个人患者，支付由消费者（订阅费）和潜在的保险或雇主药物覆盖共同承担。 鉴于北美在运动 / 减重应用和企业健康市场中均占 40% 份额，美国主导 Noom 的市场。大型雇主（500+ 员工）是主要
              B2B 目标； 美国劳工部数据显示，这类组织中 76% 员工可获得健康计划。
