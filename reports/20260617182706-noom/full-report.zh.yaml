      - number: '1.4'
        title: 规模与关键指标
        blocks:
          - type: paragraph
            body: >-
              Noom 披露自成立以来累计注册用户超过 50M。疫情带来的 2020–2021 年数字健康热潮中，峰值付费订阅用户约 5M，但此后下滑； 近期估算显示活跃订阅用户为低个位数百万。收入在 2021 年估算达到约
              $400M 峰值，与订阅用户密度最高时期重合。员工人数峰值约 3,400 人，经过多轮重组后目前约 2,500 人。2022 至 2025 年间，公司至少经历四轮裁员，主要影响人工教练团队，因为模式转向 AI
              增强和药物聚焦产品。公开来源中仍未披露的关键指标包括当前准确收入、ARR、毛利率、净收入留存和获客成本，因此单位经济和财务轨迹仍不完整。
