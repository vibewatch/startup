      - number: '5.4'
        title: AI/ML 与技术架构
        blocks:
          - type: paragraph
            body: >-
              Noom 的技术平台跑在 AWS 上，底层是微服务架构，前端包括 iOS（Swift）和 Android（Kotlin）原生移动应用，以及 React.js 网页界面。后端用
              Python（Django），主数据库是 PostgreSQL，Redis 负责缓存，Kubernetes（EKS）负责容器编排。AI/ML 层已经落到多项面向用户的功能：2024 年 6 月上线的 AI
              食物记录，支持照片识别、文本和语音输入；基于 GPT、用 Noom 专有数据训练的个人健康助手 Welli；2025 年上线的 AI
              驱动面部和身体扫描，用于身体成分分析；葡萄糖曲线预测；以及用算法个性化课程内容和教练干预。数据工程侧，平台处理参与度、体重、营养和活动数据，经由管道进入分析系统和 ML 模型训练。Noom 的 GitHub
              组织有 41 个公开仓库，主要是 fork、工作流 action（branch-cleanup-action）和工具类项目，而不是大型开源框架，说明工程组织更多面向内部。招聘信息显示，公司使用
              GraphQL、RabbitMQ/SQS 消息队列、Terraform 基础设施即代码，并通过 GitHub Actions 做 CI/CD。公司在纽约市和新泽西州 Princeton
              设有办公室，工程文化以远程优先为主。CPO Aaron Severs 称，AI 团队由熟悉数字医疗的数据科学家和 ML 工程师搭建。
