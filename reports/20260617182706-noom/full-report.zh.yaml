      - number: '4.5'
        title: 财务风险与披露缺口
        blocks:
          - type: paragraph
            body: >-
              对任何潜在投资者或收购方来说，最大的单一财务风险是几乎完全没有审计财务披露。Noom 是一家后期私人公司，峰值估值 $3.7B，员工数千人，
              估算收入基数达数亿美元，但公开不披露收入、利润率、现金、烧钱、留存或单位经济。二级市场估值较峰值折价约 77%，说明机构投资者已大幅重定价股权—— 这可能反映真实业务恶化，也可能只是 2022–2024
              年后期私募市场普遍下调。其他风险包括：（1）$56M 暗黑模式和解以及 B2C 减重订阅常见高流失率， 带来收入质量不确定性；（2）GLP-1 药物转向在提高 ARPU
              的同时引入药房履约和监管复杂性；（3）Hims & Hers、Ro 和垂直 GLP-1 新进入者可能用价格压制； （4）尽管已达到规模，公司仍没有任何 IPO
              申报（S-1），暗示财务状况要么无法承受公开市场审查，要么尚未盈利。TechStackIPO 64/100（Grade C）的就绪评分， 也印证 IPO
              准备度中等而非高。尽调层面，每一项重大财务指标仍是只能靠管理层 data room 获取的私人证据缺口。
