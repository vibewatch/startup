      - number: '4.3'
        title: 盈利能力、烧钱与 runway
        blocks:
          - type: paragraph
            body: >-
              Noom 从未公开披露盈利能力、经营利润率、烧钱速度或现金头寸。不过，多个信号显示公司已大幅重组成本。2022 年，Noom 至少执行两轮裁员： 先是在 2022 年 4 月削减约 25% 教练人员，作为转向
              AI 教练模型的一部分；随后在 2022 年 10 月进一步裁减约 10% 总员工（约 500 人）。 MobiHealthNews 报道称，2025 年初公司还因向 GLP-1
              产品「收入组合转移」再次裁员。公司给出的理由——打造「更高效的业务」——暗示旧成本结构下的单位经济不可持续。 2022 年领导层从创始人 CEO Saeju Jeong 交接给 Geoff Cook（曾在 The
              Meet Group 推动盈利的 CEO），也释放出董事会层面从不惜代价增长转向单位经济纪律的信号。 2023 年 $330M 广告支出对照即便 $1B ARR，也意味着销售与营销占收入比达
              33%，尚未计入教练人员、技术和 G&A，因此若无重组，盈利可能性不高。 2026 年 4 月收购 Tailor Made Compounding
              药房增加了垂直整合，也增加了资本强度。没有经审计财务，盈利路径仍是论点，而不是已证明事实。
