              的高端定价。Lose It! 以更低价格提供直接的卡路里计数、条码扫描和 AI 照片识别。 WeightWatchers 尽管在 2025 年 5 月申请 Chapter 11，仍服务全球超过 3M 会员，并通过
              WeightWatchers Clinic 远程医疗产品在 2025 年 Q1 报告 57% 临床收入增长。2025 年 6 月退出破产后，WW 剩余债务仅 $465M（低于此前
              $1.6B），正在投资数字化转型和 GLP-1 处方。这些应用型竞争者通常缺少 Noom 由心理学驱动的教练方法，但在价格、简单性和数据库广度上有效竞争；其中数家也在加入 GLP-1 获取或 AI 功能。
