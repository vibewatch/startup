      - number: '6.4'
        title: 获客与留存动态
        blocks:
          - type: paragraph
            body: >
              Noom 的获客引擎围绕消费健康领域最常被研究的转化漏斗之一展开。入门测验覆盖 40-113 个页面，耗时 10-15
              分钟，使用渐进承诺心理学、个性化剧场（预测减重时间线和定制计划）以及战略性价格锚定。行业观察者估计，完成测验用户中的付费转化率超过 10%，而订阅型健康应用第 0 天转化率中位数为
              2.7%。大量付费获客通过网页漏斗而非应用商店完成，这让公司迭代更快，也绕开平台抽成——一项分析估计，DTC 网页门户贡献了 42% 的新订阅。付费社交（Meta、TikTok、YouTube）是主渠道，辅以联盟
              / 网红营销（例如与 The Independent 的合作推动其成为英国前三合作伙伴）和 Google 搜索。留存才是结构性难题。行业基准显示，健康 / 健身应用 30 日留存平均为 8-12%。Noom 的
              GLP-1 Companion 项目报告的指标显著更高：77.8% 的 Microdose GLP-1Rx 用户保持 4 周以上参与，D30 参与度为 43.6%（行业平均的 10 倍）。但一项针对 35,000
              名 Noom 流失转用者的第三方研究发现，62.4% 在六个月内流失，取消前平均已花费 $419。离开的首要原因是“心理学课程感觉重复”（34.2%）。Noom 没有公开披露整体流失率、NRR 或 cohort
              留存曲线。
