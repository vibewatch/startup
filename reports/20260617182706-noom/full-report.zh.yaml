  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入与增长
        blocks:
          - type: paragraph
            body: >-
              Noom 的收入轨迹是一段激进消费者订阅增长故事，中间经历 COVID 期间激增，随后转向 GLP-1 远程医疗。第三方分析机构 Sacra 估计， Noom 到 2023 年底 ARR 达到 $1B，同比增长
              25%，付费订阅用户约 1.5M。MobileMarketingReads 的早期估计将 2020 年收入放在约 $400M（接近 2019 年约 $237M 的两倍），2021 年收入约
              $600M。GrowJo 和 TechList 等其他追踪器给出 2026 年收入约 $296M 的估算， IncFact 则估计超过
              $500M——这说明一家没有审计披露的私人公司，第三方估算置信区间很宽。Noom 收入主要来自订阅：核心 Noom Weight 应用按计划时长每月收费 $17–$70；较新的 Noom Med GLP-1
              项目每月 $99 至 $279，包含药物。2025 年 2 月，Noom 披露其 GLP-1 Rx 和药片型用药项目自 2024 年 9 月推出后四个月内合计达到 $100M 收入
              run-rate。这说明收入组合正快速转向更高 ARPU 的医疗产品， 但该增长率的可持续性和利润率画像仍未披露。Sacra 的 $1B ARR 估计与常用的 $400M
              峰值数字之间差异，可能来自计量期间、方法和产品范围不同； 我们以保守的常用锚点约 $400M（2021 年峰值）为基准，并把 Sacra 数字作为上沿第三方估计注明。
