      - number: '2.5'
        title: 规模测算缺口与矛盾
        blocks:
          - type: paragraph
            body: >-
              最大的规模测算缺口是 Noom 自身收入轨迹。疫情驱动订阅激增期间，2021 年峰值收入估计为 $400M，但当前收入未披露，市场普遍认为随着 2021
              年后订阅用户流失已显著下滑。没有当前收入、订阅用户数或流失率披露，SOM 计算只能停留在推测。第二个矛盾是分析师估算分歧很大： 2026 年肥胖数字健康市场从 $71.67B（InsightAce）到
              $99.36B（TBRC）不等，取决于纳入哪些硬件、可穿戴和远程医疗平台—— 39% 的差距反映的是定义差异，而非分析分歧。第三，GLP-1 市场对行为应用需求的影响仍不清楚：WeightWatchers 破产
              （2024 年收入降至 $811M，订阅收入下滑 5.6%）证明冲击具有灾难性，但肥胖数字健康市场整体仍以 22–26% CAGR 增长， 因为 GLP-1
              伴随数字工具和肥胖远程医疗平台在扩张，即便独立行为项目在收缩。这意味着 Noom 转向 Noom Med 可能让公司进入增长子细分而非衰退子细分， 但执行风险高，且公司要与资本充足的远程医疗 GLP-1
              提供商竞争。
            claimRefs:
              - CM039
              - CM040
              - CM041
