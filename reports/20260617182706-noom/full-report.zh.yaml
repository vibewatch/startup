  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场与 GLP-1 颠覆风险
        blocks:
          - type: paragraph
            body: >-
              GLP-1 受体激动剂（semaglutide、tirzepatide）的兴起，从根本上重塑了纯行为减重应用的可服务市场。Noom 转向 Noom Med 和 GLP-1
              Companion，是试图顺势而上，而不是被浪潮冲走，但这次转向也引入了新的依赖。GLP-1 药物现在主导消费者对体重管理的兴趣，全球市场在 2025 年超过 $50B，并预计到 2030 年增至
              $130B。Noom 的核心行为订阅——传统收入引擎——面临来自自身 GLP-1Rx 项目，以及 Hims & Hers（2.5M 订阅者、2025 年收入 $2.35B）、Ro、Found
              等资金充足竞争对手的蚕食，这些对手提供类似的远程医疗加药物组合。WeightWatchers 在 2025 年申请 Chapter 11 破产，说明当 GLP-1
              替代方案获得牵引后，传统行为模型可能多快崩塌。一项 JAMA 回顾性研究发现，40-50% 的 GLP-1 患者会在 12 个月内停药；这既带来留存机会，也带来风险：药物暂停后，Noom
              的参与层价值主张可能不足以阻止流失。如果 Noom 无法证明其行为差异化相较普通远程医疗提供商能改善用药依从性和长期结果，公司的溢价定价和订阅经济性就难以维持。
