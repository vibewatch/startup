  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Noom 并非面对单一同业，而是在四组重叠竞争者中竞争。第一组是直接行为和卡路里追踪应用竞争者——MyFitnessPal、Lose It! 和 Lifesum；
              它们拼的是饮食记录、数据库广度和免费增值定价，但缺少行为教练深度。第二组是 GLP-1 远程医疗挑战者——Hims & Hers（NYSE: HIMS）、 Ro、Found 和
              Calibrate；它们以药物优先的减重方案、远程医疗处方和药房整合配送切入，正越来越多侵入 Noom 的 GLP-1 混合定位。 第三组是企业级数字疗法平台——Omada Health 和
              Teladoc/Livongo；它们向雇主和健康计划销售 B2B2C 慢病管理项目。第四组是老牌在位者 WeightWatchers；它在 2025 年 6 月摆脱 Chapter 11 破产、消除 $1.15B
              债务后，正积极扩张自己的远程医疗临床业务，临床收入同比增长 57%。竞争压力是不对称的：药物优先平台复制行为功能，比 Noom 复制垂直整合药房经济要容易得多。
