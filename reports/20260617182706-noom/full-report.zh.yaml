      - number: '2.2'
        title: 市场规模（TAM/SAM/SOM）
        blocks:
          - type: paragraph
            body: >-
              边界选择不同，多个分析口径会得出差异巨大的市场规模。最宽口径是全球减重与肥胖管理市场，2026 年约 $279B（Research and Markets）， 包括药品、手术、服务和数字工具。肥胖数字健康细分介于
              $78B（VPA Research、Fortune Business Insights）至 $99B （The Business Research
              Company），差异来自硬件、可穿戴和远程医疗平台纳入范围不同。Noom 最直接竞争的细分——运动和减重应用——要窄得多， 2026 年为 $1.29B（Mordor Intelligence）至
              $1.39B（Coherent Market Insights）。一个合理的 Noom SAM 应结合减重应用的美国份额 （按北美 40% 份额约
              $500M），再加上美国远程医疗肥胖服务切片和雇主数字健康支出。SOM 仍不清楚，因为 Noom 不披露当前收入；其峰值收入估计为 2021 年约 $400M，但此后已下滑。范围不同，市场从 $1.3B 到
              $99B 不等——这是尽调中最核心的规模测算教训。GLP-1 药品市场 （2026 年 $73.4B，按 Becker's 引用的 Goldman Sachs 估计，2030 年将超过 $100B）对 Noom
              来说是邻近市场而非直接可触达市场， 但 Noom Med 的远程医疗处方模式能在这部分药品支出上获取药物管理和教练覆盖层费用。
