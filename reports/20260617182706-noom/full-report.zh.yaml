      - number: '4.2'
        title: 订阅单位经济
        blocks:
          - type: paragraph
            body: >-
              Noom 的单位经济可以从公开定价和行业基准中部分推断，但本质上未披露。Noom Weight 标价从 12 个月承诺的 $17.42/月，到滚动月付的 $70/月不等。Noom Med GLP-1
              项目价格显著更高：Microdose GLP-1Rx 计划 $199/月，Full-Dose 计划 $279/月，均包含复方药物。 这次定价转移暗示 ARPU 明显提高，但药物履约成本也带来更高
              COGS。Sacra 称 Noom 使用 LLM 驱动聊天机器人处理初始互动，为时薪 $19–$24、每人管理 300–400 名用户的人工教练提供杠杆。行业订阅基准显示，健康订阅平均月流失率约
              5.3%，意味着平均订阅生命周期约 19 个月。 Noom 自身互动数据显示，Microdose GLP-1Rx 会员 D30 留存为 40%，是数字健康应用平均值的 10 倍；77% 在第 4 周仍保持互动。
              广告支出从 2017 年 $5M 扩大到 2023 年估算 $330M，说明除非留存显著超过行业常态，否则 CAC 相对于订阅 LTV 极高。2022 年 $56M
              暗黑模式集体诉讼和解暗示，历史收入中相当一部分可能来自摩擦型留存，而非真实产品互动。没有披露 CAC、LTV、毛利率或净收入留存，真实单位经济仍是重大证据缺口。
