            body: >-
              Noom 的差异化建立在基于心理学的行为改变方法上——根植于认知行为疗法——并通过 Noom Med 叠加 GLP-1 药物获取。公司最大的一项内部分析显示， GLP-1 会员中互动最高的四分位用户，在 40
              周时减重超过 25%；Microdose GLP-1Rx Program 用户四周留存率为 77.8%，据称比平均健康应用留存高 10 倍。Noom 累计 50M 注册用户提供了庞大的 AI
              个性化数据集，B2B2C 渠道（Noom for Work）也带来纯 DTC 竞争者缺少的雇主和健康计划分发。 但 Noom 的护城河在变窄。行为教练模型扩张成本高（即便 AI 替代部分人工教练），而 Omada
