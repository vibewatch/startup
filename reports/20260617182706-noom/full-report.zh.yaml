      - number: '8.4'
        title: 情景估值区间
        blocks:
          - type: paragraph
            body: >-
              熊市情景给 Noom 估值约 $400-600M。该情景假设传统订阅收入继续降至每年 $300M 以下，随着 FDA 对复方 GLP-1 加强执法、Lilly/Novo 品牌竞争挤压利润率，Noom Med 的
              GLP-1 收入停滞在低于 $150M，同时公司烧钱且无法盈利。在 $300-400M 收入基础上用 1.0-1.5x 收入倍数，隐含价值明显低于当前二级标记，并较当前约 $720M 隐含水平进一步下行
              20-45%。该情景也纳入倍数向 Teladoc/WW 估值区间压缩。


              基准情景给 Noom 估值约 $700M-1.1B。这假设收入在 $500-600M 稳定，由 GLP-1 项目达到 $200-300M 年化收入驱动（与上线四个月内披露 $100M run-rate
              一致，并外推温和增长），部分抵消传统订阅者流失，且成本重组让 EBITDA 接近盈亏平衡。对 $500-600M 收入采用 1.5-2.0x 倍数，得到该区间。牛市情景达到 $1.5-2.5B，要求 Noom
              Med 激进扩张至 $500M+ 收入（借助与美国前 20 大健康计划中 5 家的合作），Noom Weight 传统基盘稳定，B2B2C 企业扩张成功，并最终具备 IPO 准备度。在 $600-800M
              收入上按 2.5-3.5x 计算，该情景较当前二级水平隐含 100-250% 上行，并接近 HIMS 和 Omada 获得的倍数。
