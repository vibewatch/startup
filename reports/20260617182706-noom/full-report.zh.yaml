      - number: '8.3'
        title: 可比公司与倍数分析
        blocks:
          - type: paragraph
            body: >-
              Noom 的公开可比公司横跨远程医疗、消费级数字健康和减重公司。Hims & Hers Health（NYSE: HIMS）是最相关的公开参照，因为它是具有重大 GLP-1 敞口的 D2C 远程医疗平台。HIMS
              市值约 $6.2-7.4B，对应 $2.8-3.0B 的 2026 年收入指引，按往绩口径 P/S 约 2.6-3.2x。HIMS 展示了一个高增长、直接拥有 GLP-1 收入的消费健康平台能获得怎样的溢价倍数。


              Omada Health（NASDAQ: OMDA）于 2025 年 6 月 IPO，报告 2026 年 Q1 收入 $78M（同比增长 42%），市值约 $1.03B，按 $322-330M 前瞻收入指引计算
              P/S 约 3.6x。Omada 代表 B2B 数字健康可比公司，其雇主 / 支付方分发模式与 Noom for Work 类似。Teladoc Health（NYSE: TDOC）在约 $2.5B
              收入上交易，P/S 深度折价至约 0.55x，反映增长持平到下滑，以及市场对 COVID 后远程医疗平台的严厉惩罚。WeightWatchers（WW）在 2025 年 6 月摆脱 Chapter 11
              破产，削减 $1.15B 债务，2025 年 Q4 收入 $163M（同比下降 12%），临床收入增长 32%；它是 GLP-1 颠覆中传统行为减重业务最接近的参照。Noom 二级市场隐含的约 1.0-1.5x
              收入倍数，落在 Teladoc 折价地板和 Omada/HIMS 成长溢价之间，符合一家短期面临逆风、但仍有 Noom Med 上行可选性的企业状态。
