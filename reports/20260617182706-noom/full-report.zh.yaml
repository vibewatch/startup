      - number: '5.3'
        title: Noom Med 与 GLP-1 远程医疗栈
        blocks:
          - type: paragraph
            body: >-
              Noom Med 代表公司针对 GLP-1 减重药市场的战略转向。流程从在线健康评估开始，随后由持照医生或执业护士进行临床审查。符合条件的患者 （BMI ≥30，或 BMI ≥27 且有合并症）获得处方，复方
              semaglutide 或 tirzepatide 会在约 7 天内直接寄送。该项目的独特之处在于， 用户必须持续参与 Noom 的行为改变平台——没有纯用药选项。2026 年计划层级包括 Telehealth
              Only（品牌药 Rx，每月 $99，使用自有药房）、 Microdose GLP-1Rx（起始 $79，随后 $199/月，包含复方药物）和 Full GLP-1Rx（$279-$349/月）。GLP-1
              Companion 应用整合用药追踪、 副作用支持、用于瘦体重保持的 Muscle Defense 指引、AI 驱动身体成分扫描、葡萄糖曲线预测和游戏化。关键互动指标显示，77.8% 的 Microdose
              用户互动超过 4 周，D30 互动超过 40%——公司称是平均健康应用留存的 10 倍。法律环境不确定：FDA 将 semaglutide 移出短缺名单后， Noom 根据 Section 503A 例外销售复方
              semaglutide，而 Novo Nordisk/Eli Lilly 正在法院挑战复方药商。这对 Noom Med 收入构成重大监管风险。
