        title: 资本结构与融资
        blocks:
          - type: paragraph
            body: >-
              Noom 累计融资约 $643M，但追踪器估计从 $578M（Tracxn 较早数字为 $624M）到 $669M（TechStackIPO）和 $670M（FormBlends）不等。 公司融资历史自 2008
              年成立以来跨越至少 10–15 轮，关键转折是 2021 年 5 月由 Silver Lake 领投的约 $540M Series F，投后估值 $3.7B。其他 Series F 参与方包括 Oak
              HC/FT、Temasek、Novo Holdings、Sequoia Capital、RRE Ventures 和 Samsung Ventures。 Silver Lake
              新闻稿提到，一部分资本用于股票回购。PremierAlts 报告 2025 年 4 月有一轮 Later Stage VC（金额未披露），总融资 $668.8M。二级市场上，PM Insights 数据显示
              Noom 隐含估值到 2026 年 Q2 降至约 $720M，较 2021 年峰值折价 77%+。SEC EDGAR 记录确认 Noom（前 WorkSmart Labs, Inc.）在 2015 年 1
              月提交过豁免发行 Form D 通知，CIK 为 0001595910。Noom Health UK Limited （公司编号 13453588）的 UK Companies House 记录显示，截至
              2025 年 1 月，该公司按小公司提交账目，说明英国子公司规模有限。 总融资数字区间很宽（$578M–$669M），这是一个无法在没有 cap table 访问权时解决的数据冲突；约 $643M
              的常用数字代表中位共识。
