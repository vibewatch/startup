      - number: '1.3'
        title: 融资与资本形成
        blocks:
          - type: paragraph
            body: >-
              Noom 最大的一轮融资是 2021 年 5 月由 Silver Lake 领投的 $540M Series F，投后估值 $3.7B。其他 Series F 参与方包括 Oak
              HC/FT、Temasek、Novo Holdings、Sequoia Capital、RRE Ventures 和 Samsung Ventures。更早轮次包括 2019 年约 $58M 的 Series
              E（Sequoia、Samsung、RRE），以及此前从种子轮到 Series D 的多轮融资。已披露融资总额约 $643M （Crunchbase、Tracxn、Sacra 等追踪器区间为
              $578M–$669M）。审阅公开来源中未发现债务融资或授信额度。截至 2026 年 Q2， 二级市场隐含估值已降至约 $720M，较 2021 年峰值折价约 77%，反映疫情后订阅用户下滑、GLP-1
              市场冲击，以及后期私募市场整体修正。 2026 年 4 月前 90 天内记录到超过 $272M 的二级买卖报价，说明尽管估值下调，市场仍有持续流动性兴趣。
