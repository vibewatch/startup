  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Noom 的可触达市场横跨多个重叠支出类别。核心市场是面向消费者的数字体重管理和行为改变应用——Mordor Intelligence 估算该细分 2026 年全球规模为 $1.29B，并以 16.9% CAGR
              增至 2031 年 $2.83B。更广义的肥胖数字健康生态包括可穿戴设备、远程医疗平台、 AI 教练工具和数字疗法，2026 年价值介于 $78B 至 $99B，取决于来源和范围定义。Noom 扩展到 Noom
              Med（基于远程医疗的 GLP-1 处方）后，部分进入美国远程医疗市场（2026 年 $64–65B），并邻近庞大的 GLP-1 药品市场（2026 年 $73B+）。 企业健康和雇主健康福利渠道（2026 年
              $66–72B）则对应 Noom 通过 Noom for Work 的 B2B2C 机会。排除的支出包括纯药品制造、 医院减重手术、没有数字整合的线下健身会员，以及纯医疗器械公司。市场边界很关键：Noom
              的收入模式是 B2C 订阅加 B2B 雇主授权加远程医疗药物管理， 因此其可触达切片明显小于任何单一 headline 市场数字。
