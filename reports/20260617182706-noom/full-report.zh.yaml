      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Noom 的财务轨迹显示出 COVID 后修正，并引发 burn、流失和估值担忧。收入在 2021 年约达到 $400M 峰值（基准口径），Sacra 则估计，在激进订阅者增长推动下，到 2023 年 ARR
              达到 $1B。然而，疫情后常态化、教练质量投诉和 GLP-1 竞争推动订阅者从约 5M 付费用户峰值降至低个位数百万。二级市场现在给 Noom 的估值约为 $720M，较 $3.7B Series F 峰值折价
              77%+ ，意味着收入倍数低于 1x。估值压缩限制了融资选择，也让 IPO 时机极具挑战。GLP-1Rx 项目在 2024 年 9 月上线后四个月内达到 $100M 收入 run-rate，但这条新收入流的
              COGS（药物、临床人员、药房合作）高于传统软件订阅。GLP-1 项目按季度计费（$199-$299/月，按季度收取），带来退款和拒付敞口。高流失仍是结构性问题：减重订阅服务全行业第一年流失率为
              50-70%。如果 GLP-1 收入增长无法抵消传统行为订阅下滑和利润率压缩，Noom 会面临营运资本挤压，可能被迫进一步成本重组或下调估值融资。
