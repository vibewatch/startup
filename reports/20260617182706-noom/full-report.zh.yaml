      - number: '8.5'
        title: 投资者回报、退出准备度与重估路径
        blocks:
          - type: paragraph
            body: >-
              对于以 $3.7B 估值进入的 Series F 投资者，当前约 $720M 的二级隐含价值，在计入清算优先权和二级交易折价前，代表约 81% 未实现损失。Silver Lake 的 $540M 投资如今意味着约
              $105M 的普通股等价价值（尽管优先权结构细节未公开，且很可能提供一定下行保护）。更早期投资者情况更好：按 2019 年估值进入的 Series E 投资者可能仍有温和正回报，种子轮 / Series A-C
              投资者即便经历折价，投入资本倍数仍然可观。


              重估路径主要取决于 GLP-1 收入轨迹。如果 Noom Med 能证明其 $100M run-rate（2025 年 2 月披露）可持续增长至 $300-500M
              年收入，并同时拿出强劲单位经济性和订阅者留存证据，市场很可能把 Noom 重估至 Omada/HIMS 的 2.5-3.5x 倍数区间。IPO 准备度要求公司证明收入重新加速、利润率扩张，并降低 FTC
              订阅执法和 FDA 复方药审查带来的监管风险。打破投资逻辑的触发点可以量化：收入继续降至 $400M 以下、GLP-1
              项目停滞或复方药被监管强制退出、无法证明盈利路径，或再次出现重大裁员并显示压力是结构性而非周期性。建议是在当前价位跟踪而不是投资：考虑到不确定性，二级标记大致公允；但在经审计财务和 GLP-1
              收入可持续性更清晰之前，安全边际不足。
