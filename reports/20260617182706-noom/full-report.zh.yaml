      - number: '3.3'
        title: GLP-1 远程医疗挑战者
        blocks:
          - type: paragraph
            body: >-
              Noom 最尖锐的竞争威胁来自药物优先的远程医疗平台，这些平台已快速放大 GLP-1 减重项目。Hims & Hers Health 按收入规模最大， 2026 年 Q1 收入 $608M（同比增长
              4%），订阅用户 2.6M，并将 2026 全年指引上调至 $2.8–$3.0B。公司从复方 GLP-1 药物战略转向品牌 GLP-1 药物（与 Novo Nordisk 合作
              Wegovy），但这次转型因重组费用导致 2026 年 Q1 净亏损 $92M。 Ro 累计融资约 $1B，估值 $7B（2022 年 2 月），2024 年收入估计 $598M，GLP-1 产品约占收入
              40%。Ro 的竞争优势是垂直整合药房基础设施， 能压低药物成本。Found（joinfound.com）提供个性化 GLP-1 项目，既有品牌
              Wegovy/Zepbound，也有复方替代品，靠可负担性和保险覆盖竞争。 Calibrate 已融资约 $128M，定位为基于结果的代谢健康平台，把 GLP-1
              处方、一对一视频医生问诊和教练结合起来。这些药物优先平台威胁 Noom， 因为它们能以更低价格、更简单运营模型提供 GLP-1 获取；Noom 的行为教练会增加成本，而价格敏感消费者未必愿意为此付费。
