  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与核心体验
        blocks:
          - type: paragraph
            body: >-
              Noom 运营一个多产品数字健康平台，既直接服务消费者（B2C），也通过雇主和健康计划服务用户（B2B2C）。旗舰产品 Noom Weight 通过每日 CBT 课程、AI 驱动饮食记录（数据库超过 1M
              条目）、用颜色标记的卡路里密度指引（绿色、黄色、橙色）、带游戏化奖励的步数追踪、个性化教练， 以及名为 Circles 的同伴支持社区，提供基于心理学的体重管理项目。平台自推出以来已服务超过 50M
              注册用户。Noom Med 于 2023 年 5 月推出， 加入远程医疗 GLP-1 处方（semaglutide 和 tirzepatide）和整合行为支持，并要求用户在用药同时参加行为项目。2025
              年，Noom 扩展到 Microdose GLP-1Rx Program，以 $79 初始费用加 $199/月提供较低剂量复方 semaglutide。其他产品包括用 CBT 管理压力和焦虑的 Noom
              Mood、Noom Diabetes Prevention Program（首个 CDC 认证移动 DPP）、面向更年期管理的 Noom + HRT，以及包含超过 1,000 节健身课程的 Noom
              Move。企业端 Noom for Work（2022 年推出）向雇主和健康计划提供这些项目，Highmark 将从 2026 年 1 月起部署给近 2M 名合格会员。 定价从年度 Noom Weight 计划的
              $17.42/月，到包含药物的全剂量 GLP-1Rx 项目 $349/月不等，均符合 FSA/HSA 支付资格。
