      - number: '5.5'
        title: 数据安全、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              Noom 的教练、远程医疗和用药项目会处理受保护健康信息（PHI），因此必须满足 HIPAA 合规。公司与供应商签署业务伙伴协议，使用 AWS KMS 提供的 AES-256 加密静态数据，用 TLS 1.2+
              加密传输数据，并实行基于角色的访问控制。Noom 获得过多项 NIH 资助，也是首个获 CDC 认证为 Diabetes Prevention Program
              的移动应用，这是有分量的质量信号。但公开安全资料明显不足：审阅证据中没有发现 SOC 2 报告、公开安全白皮书、状态页或渗透测试披露。产品风险也很实质，而且维度很多。教练质量是长期投诉点——Trustpilot
              和应用评论提到回复像机器人、教练缺乏人味、营销承诺与实际体验有落差。2022 年 2 月，公司因暗黑模式自动续费达成 $56 million 集体诉讼和解，信任受损，也被要求强化取消订阅披露。GLP-1
              复方药面临 Novo Nordisk 和 Eli Lilly 的法律挑战，威胁 Noom Med 的供应链。B2C 减重订阅天然高流失。2022-2023 年裁员后，员工数从约 3,400 人降至约 2,500
              人，公司从真人教练转向 AI；这既提升效率，也带来评论者持续指出的质量风险。应用商店评分仍然强劲（iOS 4.7，730K+ 条评论；Android 4.1，315K+
              条评论），但总评分和高声量投诉模式之间的落差，说明用户体验两极化。
