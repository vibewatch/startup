companyProfile:
  summary: >-
    Noom, Inc. (originally WorkSmart Labs) is a New York-based digital-health company founded in
    2008 by Saeju Jeong and Artem Petakov that built a psychology-first, CBT-based weight-management
    app. After a COVID-era surge that took it to a $3.7B Series F valuation in May 2021 on ~$540M
    raised, Noom faced post-pandemic revenue decline, ~20% layoffs in 2022, a shift away from
    human-only coaching, and the structural disruption of GLP-1 anti-obesity drugs. The company has
    repositioned around Noom Med (telehealth GLP-1 prescriptions plus behavioral coaching) and an
    AI-assisted coaching model under CEO Geoff Cook (appointed July 2023). It reports 50M+ cumulative
    registered users and ~2,500 employees, but financials remain largely private and secondary-market
    pricing implies a steep ~77% reset from the 2021 peak.
  foundedDate: "2008-01-01"
  founders:
    - name: Saeju Jeong
      role: Co-Founder & Executive Chairman (former CEO)
      background: Korea-born entrepreneur from a family of physicians; co-founded Noom in 2008 and led it as CEO until 2022.
      claimRefs: [CO009]
    - name: Artem Petakov
      role: Co-Founder & President
      background: Engineer (ex-Google) who co-founded Noom in 2008 and leads product and operations.
      claimRefs: [CO009]
  foundingLocation: New York, New York, US
  headquarters: New York, New York, US
  productSummary: >-
    Noom sells consumer subscriptions to a psychology-based weight-loss app (Noom Weight) built on
    cognitive behavioral therapy, plus Noom Med (telehealth access to GLP-1 medications such as
    semaglutide with coaching), Noom Mood (stress/anxiety CBT), and a B2B Noom for Work channel
    sold to employers and health plans. Coaching blends human coaches with AI-driven personalization.
  customerFocus: >-
    Primarily US adult consumers seeking weight loss (skewing ~70% female), acquired largely through
    paid-social quiz funnels, plus employer and health-plan benefit buyers via the B2B2C channel.
  businessModel: >-
    Direct-to-consumer subscription (monthly/annual app plans), telehealth medication revenue through
    Noom Med, and B2B2C contracts with employers and payers. Heavy paid-acquisition spend and
    subscription churn are central economic variables.
  stage: Late-stage private (last priced round Series F, 2021); no IPO
  fundingStatus: >-
    Last priced round was the $540M Series F in May 2021 at a $3.7B post-money valuation led by
    Silver Lake. Total disclosed capital raised is ~$643M (tracker range $578M–$669M). No subsequent
    priced primary round has been announced; 2025-2026 activity has been secondary-market trading at
    a steep discount to the 2021 mark.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO009, CO012, CO016, CO019, CO020, CO025, CO028]
summary:
  headline: >-
    Noom is a real, large-scale consumer-health brand whose 2021 $3.7B mark is no longer credible —
    secondary markets already imply ~$720M — and whose investability now hinges on whether the GLP-1
    Noom Med pivot can offset behavioral-app revenue decline and structural disruption.
