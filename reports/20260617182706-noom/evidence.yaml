evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board roster, investor control rights, and ownership breakdown
    whyItMatters: Cannot assess governance concentration, investor influence, or board independence without this data
    diligencePath: Request board composition and governance documents directly from the company or lead investors
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Exact current revenue, ARR, gross margin, net revenue retention, and unit economics
    whyItMatters: Without financial transparency, cannot assess business health, runway, or sustainability of the GLP-1 pivot
    diligencePath: Request P&L summary and unit economics from management; cross-reference with secondary-market research reports
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-acquisition
    missingEvidence: Customer acquisition cost (CAC), marketing spend efficiency, and LTV/CAC ratios
    whyItMatters: B2C subscription businesses depend heavily on efficient customer acquisition; high CAC kills unit economics
    diligencePath: Analyze app-store spend data, review third-party estimates (e.g., Apptopia), or request from management
    relatedQuestionRefs:
      - QO027
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: Verified current headcount figure from official source (not third-party estimate)
    whyItMatters: >-
      Layoff coverage provides direction but not an exact current number; LinkedIn data is unreliable for private
      companies
    diligencePath: Check Noom careers page job count or request headcount directly
    relatedQuestionRefs:
      - QO014
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Full C-suite roster, VP-level leaders, and complete board of directors
    whyItMatters: >-
      Cannot assess governance quality, board independence, or key-person risk depth without complete leadership
      enumeration
    diligencePath: Request organizational chart and board roster from the company or cross-reference with LinkedIn/SEC filings
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Full cap table, ownership percentages, board seats held by investors, and historical round amounts pre-Series E
    whyItMatters: Cannot determine investor control, dilution history, or governance influence without complete capitalization data
    diligencePath: Request cap table from management or review Delaware corporate filings if available
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: noom-revenue
    missingEvidence: Current Noom revenue, subscriber count, and trajectory post-2021 peak
    whyItMatters: Without current revenue data, SOM calculation is impossible and market share assessment is speculative
    diligencePath: Request audited financials or subscription metrics directly from Noom management
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: material
    topic: noom-churn
    missingEvidence: Noom's 12-month subscriber retention rate and cohort LTV data
    whyItMatters: Churn rate determines whether subscription revenue model is sustainable against GLP-1 disruption
    diligencePath: Request cohort retention curves and LTV/CAC metrics from management or conduct customer surveys
    relatedQuestionRefs:
