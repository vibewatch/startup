company:
  name: Noom
chapter:
  number: 3
  title: Competitors
  summary: >-
    Noom faces intensifying competition from GLP-1 telehealth platforms (Hims & Hers, Ro, Found, Calibrate),
    legacy weight-management incumbents (WeightWatchers post-bankruptcy, MyFitnessPal), and digital
    therapeutics providers (Omada Health). The GLP-1 medication wave has both commoditized behavioral-only
    weight loss and created a new competitive axis where Noom's hybrid behavioral-plus-clinical model must
    prove superior retention and outcomes versus medication-first rivals with lower price points and
    vertically integrated pharmacy infrastructure.
sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Noom competes across four overlapping competitor clusters rather than a single peer set. First are
      direct behavioral and calorie-tracking app competitors—MyFitnessPal, Lose It!, and Lifesum—which
      compete on food logging, database breadth, and freemium pricing without behavioral coaching depth.
      Second are GLP-1 telehealth challengers—Hims & Hers (NYSE: HIMS), Ro, Found, and Calibrate—that
      offer medication-first weight loss with telehealth prescriptions and pharmacy-integrated delivery,
      increasingly encroaching on Noom's GLP-1 hybrid positioning. Third are enterprise-grade digital
      therapeutics platforms—Omada Health and Teladoc/Livongo—that sell B2B2C chronic condition management
      programs to employers and health plans. Fourth is the legacy incumbent WeightWatchers, which emerged
      from Chapter 11 bankruptcy in June 2025 after eliminating $1.15 billion in debt and is now
      aggressively expanding its own telehealth clinical business with 57% year-over-year clinical revenue
      growth. The competitive pressure is asymmetric: medication-first platforms can replicate behavioral
      features more easily than Noom can replicate vertically integrated pharmacy economics.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: direct-behavioral-app-competitors
    title: Direct Behavioral and App Competitors
    body: >-
      MyFitnessPal remains the largest competitor by registered user base with over 220 million accounts
      and 30 million monthly active users, generating approximately $310 million in revenue under Francisco
      Partners ownership. Its strength is the world's largest food database and calorie-tracking
      simplicity, but it lacks Noom's behavioral coaching depth and has no GLP-1 clinical offering.
      Lifesum competes on AI-powered meal planning and personalized nutrition with a freemium model that
      undercuts Noom's premium pricing. Lose It! offers straightforward calorie counting with barcode
      scanning and AI photo recognition at lower price points. WeightWatchers, despite its Chapter 11
      filing in May 2025, continues to serve over 3 million members globally and reported 57% clinical
      revenue growth in Q1 2025 through its WeightWatchers Clinic telehealth offering. After exiting
      bankruptcy in June 2025 with only $465 million in remaining debt (down from $1.6 billion), WW is
      investing in digital transformation and GLP-1 prescriptions. These app-based competitors generally
      lack Noom's psychology-driven coaching methodology but compete effectively on price, simplicity,
      and database breadth—and several are now adding GLP-1 access or AI-powered features.
    claimRefs: [CP011, CP012, CP013, CP014, CP015, CP016, CP017, CP018, CP019]
    tableRefs: [TP002]
  - id: glp1-telehealth-challengers
    title: GLP-1 Telehealth Challengers
    body: >-
      The most acute competitive threat to Noom comes from medication-first telehealth platforms that have
      rapidly scaled GLP-1 weight loss programs. Hims & Hers Health is the largest by revenue, reporting
      $608 million in Q1 2026 revenue (up 4% year-over-year) with 2.6 million subscribers, and raising
      full-year 2026 guidance to $2.8–$3.0 billion. The company made a strategic pivot from compounded to
      branded GLP-1 medications (partnering with Novo Nordisk for Wegovy), though this transition caused a
      $92 million Q1 2026 net loss from restructuring charges. Ro has raised approximately $1 billion in
      total funding at a $7 billion valuation (February 2022), with estimated $598 million in 2024 revenue
      and GLP-1 offerings accounting for roughly 40% of revenue. Ro's competitive advantage is its
      vertically integrated pharmacy infrastructure enabling lower medication costs. Found (joinfound.com)
      offers personalized GLP-1 programs with both branded Wegovy/Zepbound and compounded alternatives,
      competing on affordability and insurance coverage. Calibrate has raised approximately $128 million
      and positions itself as an outcomes-based metabolic health platform combining GLP-1 prescriptions
      with one-on-one video physician visits and coaching. These medication-first platforms threaten Noom
      because they can offer GLP-1 access at lower price points with simpler operational models, while
      Noom's behavioral coaching adds cost that price-sensitive consumers may not value.
    claimRefs: [CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP029, CP030]
    tableRefs: [TP003]
    figureRefs: [FP002]
  - id: competitive-positioning-and-moat
    title: Competitive Positioning and Moat
    body: >-
      Noom's differentiation rests on its psychology-based behavioral change methodology—rooted in
      cognitive behavioral therapy—combined with GLP-1 medication access through Noom Med. The company's
      largest internal analysis showed that GLP-1 members in the top engagement quartile achieved over 25%
      more weight loss at 40 weeks, and members on the Microdose GLP-1Rx Program showed 77.8% four-week
      retention rates—reportedly 10 times higher than average health app retention. Noom's 50 million
      cumulative registered users provide a massive dataset for AI personalization, and its B2B2C channel
      (Noom for Work) gives it employer and health plan distribution that pure DTC competitors lack. However,
      Noom's moat is narrowing. The behavioral coaching model is costly to scale (even with AI replacing
      some human coaches), and competitors like Omada Health—which reported $78 million Q1 2026 revenue
      (up 42% year-over-year) with 1.02 million members and partnerships with all three major PBMs—are
      building similar hybrid clinical-plus-behavioral offerings with stronger payer infrastructure. Omada's
      new partnership with Eli Lilly's Employer Connect program gives it a direct employer GLP-1 channel
      that Noom does not yet match.
    claimRefs: [CP031, CP032, CP033, CP034, CP035, CP036, CP037, CP038, CP039]
    tableRefs: [TP004]
    figureRefs: [FP003]
  - id: threats-and-disadvantages
    title: Threats and Disadvantages
    body: >-
      Noom faces three structural competitive disadvantages. First, high churn: B2C weight-loss
      subscriptions suffer inherently high attrition, and GLP-1 discontinuation data shows 64–84% of
      non-diabetic patients stop medication within two years, creating risk that app engagement drops when
      medication stops. Second, pharmacy economics disadvantage: vertically integrated competitors like Ro
      control their medication supply chain, enabling lower per-unit costs that Noom cannot match without
      building or acquiring pharmacy infrastructure. Third, pricing pressure: Noom Med's Microdose GLP-1Rx
      starts at $79 then $199/month, while pure medication-first competitors offer compounded semaglutide
      from $99/month. The broader market is also experiencing rapid commoditization as generic and
      compounded GLP-1s proliferate, squeezing margins for all players. Additionally, Noom's secondary-
      market valuation has declined approximately 77% from its 2021 peak of $3.7 billion to roughly $720
      million in Q2 2026, reflecting investor skepticism about its competitive positioning relative to
      medication-first platforms with clearer pharmacy economics and faster revenue scaling.
    claimRefs: [CP040, CP041, CP042, CP043, CP044, CP045]
