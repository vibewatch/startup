callouts:
  - calloutType: risk
    title: "GLP-1 pharmacy economics create structural competitive disadvantage"
    body: >-
      Ro's vertically integrated pharmacy and Hims & Hers' branded medication pivot create unit economics
      advantages that Noom cannot replicate through its third-party pharmacy model. As GLP-1 medications
      commoditize, the behavioral coaching premium becomes harder to justify at current price points.
    claimRefs: [CP022, CP040, CP041, CP042]
  - calloutType: risk
    title: "High churn compounds competitive pressure from medication-first alternatives"
    body: >-
      JAMA data shows 64–84% of non-diabetic GLP-1 users discontinue within two years. If app engagement
      is tightly coupled to medication adherence, structural churn is unavoidable regardless of coaching
      quality—and simpler, cheaper alternatives may recapture users at each re-entry point.
    claimRefs: [CP040, CP043, CP044]
  - calloutType: strength
    title: "Behavioral science plus clinical evidence provides retention differentiation"
    body: >-
      Noom's internal data showing top-quartile engaged GLP-1 members lose 25%+ more weight at 40 weeks,
      and 77.8% four-week retention (reportedly 10x health app average), gives it a defensible argument
      for why coaching matters alongside medication—particularly for payers evaluating long-term outcomes.
    claimRefs: [CP031, CP032, CP036, CP038]
  - calloutType: insight
    title: "Enterprise channel may be Noom's most defensible competitive position"
    body: >-
      While DTC GLP-1 platforms compete on price and pharmacy, Noom's B2B2C employer channel (Noom for
      Work) faces less direct price competition from Ro and Hims. However, Omada Health's deeper PBM
      relationships and Lilly Employer Connect partnership represent an accelerating threat in this segment.
    claimRefs: [CP033, CP034, CP035, CP039]
