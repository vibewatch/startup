- id: data-privacy-compliance
  title: Data Privacy & Compliance Risk
  body: >-
    As a digital health platform collecting sensitive weight, medication, and behavioral data, Noom is exposed to evolving privacy enforcement. The HHS Office for Civil Rights issued December 2022 guidance (partially vacated June 2024 for unauthenticated pages) clarifying that HIPAA obligations apply when tracking technologies on covered-entity pages transmit protected health information. While Noom itself may not be a HIPAA-covered entity in all contexts, the Meta Pixel class action litigation (John Doe v. Meta Platforms, N.D. Cal.) — now proceeding past dismissal with 664+ hospital systems implicated — demonstrates the industry-wide legal exposure for health platforms using third-party tracking pixels. Legacy Health and Garnet Health both settled pixel-related class actions in February 2026. Noom's own privacy policy (noom.com/about-us) discloses use of analytics and advertising technologies. If Noom Med prescribes medications, it operates closer to covered-entity territory and faces heightened HIPAA compliance obligations. State privacy laws including CCPA/CPRA, the Washington My Health My Data Act, and Connecticut health data statutes independently create litigation surface for digital health companies collecting sensitive health information. Noom's large user base of 50M+ registered users amplifies per-incident exposure in any data breach or improper disclosure scenario.
  claimRefs:
  - CR016
  - CR017
  - CR018
