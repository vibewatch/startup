- id: operational-people-execution
  title: Operational, Key-Person & Execution Risk
  body: >-
    Noom executed ~20% workforce layoffs in 2022, with MobiHealthNews confirming additional layoffs in 2024-2025 tied to a "revenue mix shift" toward GLP-1 products. Headcount has declined from a peak of ~3,400 to approximately 2,500. This restructuring coincided with a CEO transition in July 2023, when co-founder Saeju Jeong stepped to Executive Chairman and Geoff Cook (former MeetMe/The Meet Group CEO) took the CEO role. The leadership transition introduces execution risk as Noom simultaneously pivots its core business model from behavioral coaching to medication-plus-coaching while managing morale challenges from repeated restructuring. Glassdoor and employee reviews indicate cultural strain from cost-cutting and strategic uncertainty. Key-person risk is moderate: co-founder Artem Petakov remains as President, providing continuity, but the company's public-facing narrative has shifted significantly under new leadership. Operationally, Noom now manages a complex dual-track business — a legacy software subscription (Noom Weight, Noom Mood) alongside a clinical telehealth operation (Noom Med) requiring physician networks, pharmacy partnerships, cold-chain medication logistics, and clinical compliance. This operational complexity creates integration risk, particularly if regulatory changes force rapid adaptation of the GLP-1 supply model.
