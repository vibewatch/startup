  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: churn and retention
    missingEvidence: Noom does not publicly disclose monthly or annual cohort retention rates, NRR, or LTV by product line (behavioral vs GLP-1).
    whyItMatters: Without retention data, it is impossible to assess whether the GLP-1 pivot generates durable unit economics or simply recycles acquisition spend.
    diligencePath: Request cohort retention curves and LTV analysis by product line under NDA.
    relatedQuestionRefs:
    - QR023
    - QR029
  - type: missing-source
    severity: material
    topic: Noom-specific pixel tracking
    missingEvidence: No public source confirms or denies whether Noom specifically uses Meta Pixel or similar tracking tools that transmit health data to third parties.
    whyItMatters: If Noom uses such tools, it faces direct litigation risk similar to the 664+ hospitals in the Meta Pixel class action.
    diligencePath: Inspect Noom's website/app source code for tracking pixels; request data processing agreements and subprocessor list under NDA.
    relatedQuestionRefs:
    - QR026
  - type: stale
    severity: minor
    topic: Glassdoor morale data
    missingEvidence: No 2026-dated Glassdoor reviews or employee sentiment analysis for Noom was found in public searches.
    whyItMatters: Post-restructuring morale indicators are relevant to execution risk assessment but cannot be confirmed with current public data.
    diligencePath: Monitor Glassdoor/Blind reviews; request employee engagement scores under NDA.
    relatedQuestionRefs:
    - QR019
  - type: private-evidence-only
    severity: material
    topic: Noom Med regulatory compliance
    missingEvidence: No public evidence of how Noom Med ensures 503A compliance, manages pharmacy partnerships, or maintains clinical governance post-FDA crackdown.
    whyItMatters: FDA enforcement is actively targeting the exact model Noom Med uses; compliance posture is critical to business continuity.
    diligencePath: Request pharmacy partner audit status, FDA correspondence, and clinical governance documentation under NDA.
    relatedQuestionRefs:
    - QR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory and legal risk register
    missingEvidence: Additional state AG enforcement actions, pending consumer complaints, and non-public regulatory correspondence likely exist beyond the publicly documented cases in TR002.
    whyItMatters: The table covers only publicly visible legal and regulatory actions; undisclosed enforcement or investigation activity could materially change the risk profile.
    diligencePath: Request under NDA any pending regulatory inquiries, state AG correspondence, or undisclosed litigation against Noom.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR002
  - type: missing-source
