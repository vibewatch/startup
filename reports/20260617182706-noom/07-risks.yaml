company:
  name: Noom
chapter:
  number: 7
  title: Risks
  summary: >-
    Noom faces a layered risk profile dominated by GLP-1 market disruption, FTC/regulatory exposure from its subscription model, FDA enforcement on compounded semaglutide, data-privacy litigation risk tied to tracking pixels, post-COVID revenue and churn pressure, a ~77% valuation markdown on secondary markets, and key-person/governance transitions. The $62M auto-renewal class action settlement and ongoing FTC Click-to-Cancel rulemaking signal structural legal exposure, while the FDA's March 2026 warning letters to telehealth compounders directly threaten Noom Med's GLP-1 supply model.
sections:
- id: market-glp1-disruption
  title: Market & GLP-1 Disruption Risk
  body: >-
    The rise of GLP-1 receptor agonists (semaglutide, tirzepatide) fundamentally reshapes the addressable market for behavioral-only weight-loss apps. Noom's pivot to Noom Med and its GLP-1 Companion attempts to ride this wave rather than be swept aside, but the pivot introduces new dependencies. GLP-1 medications now dominate consumer interest in weight management, with the global market exceeding $50B in 2025 and projected growth to $130B by 2030. Noom's core behavioral subscription — the legacy revenue engine — faces cannibalization from its own GLP-1Rx program and from well-capitalized competitors like Hims & Hers (2.5M subscribers, $2.35B 2025 revenue), Ro, and Found that offer similar telehealth-plus-medication bundles. WeightWatchers' Chapter 11 bankruptcy filing in 2025 illustrates how quickly legacy behavioral models can collapse when GLP-1 alternatives gain traction. A JAMA retrospective study found that 40-50% of GLP-1 patients discontinue within 12 months, creating both a retention opportunity and a risk that Noom's engagement-layer value proposition proves insufficient to prevent churn once medications are paused. If Noom's behavioral differentiation does not demonstrably improve medication adherence and long-term outcomes versus generic telehealth providers, the company's premium pricing and subscription economics are difficult to sustain.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR040
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-legal-risk
  title: Regulatory & Legal Risk
  body: >-
    Noom operates at the intersection of three high-enforcement regulatory domains: FTC subscription/negative-option practices, FDA telehealth and compounded drug oversight, and state consumer protection laws. The company settled a $62M class action (Wittels McInturff Palikovic v. Noom Inc., S.D.N.Y., final approval July 2022) over auto-renewal dark patterns, agreeing to business-practice changes including explicit opt-in consent, easier cancellation, and renewal reminders. Though that litigation is resolved, the FTC continues aggressive enforcement under ROSCA and Section 5, and in March 2026 launched a new ANPRM to revive its vacated Click-to-Cancel rule. Noom's subscription model — which still involves multi-month commitments, quarterly billing for GLP-1 programs, and complex cancellation flows — remains exposed to future FTC actions or state AG enforcement in the ~30 states with auto-renewal laws. Separately, the FDA issued 30 warning letters to telehealth companies in March 2026 for misleading marketing of compounded GLP-1 products. Noom Med currently sells compounded semaglutide under Section 503A exceptions, and pharmaphorum reports that Novo Nordisk and Eli Lilly are suing to challenge the compounding framework. If courts or regulators restrict 503A compounding or determine Noom's offerings are "essentially a copy" of approved drugs, the entire Noom Med supply chain is at risk of disruption.
  claimRefs:
