    topic: competitive margin comparison
    missingEvidence: No public source provides comparable gross margin or contribution margin data for Noom vs Hims & Hers vs Ro in the GLP-1 telehealth segment.
    whyItMatters: Margin comparison would clarify whether Noom's differentiated approach justifies premium pricing versus lower-cost competitors.
    diligencePath: Request unit economics under NDA; compare against Hims public filings for margin benchmarks.
