callouts:
- calloutType: risk
  title: FDA compounding enforcement is an existential threat to Noom Med
  body: >-
    The FDA's March 2026 warning letters to 30 telehealth companies, combined with Novo Nordisk and Eli Lilly lawsuits challenging 503A compounding, create a realistic scenario where Noom's GLP-1Rx medication supply is legally restricted. Noom Med's $100M run-rate revenue stream depends on continued access to compounded semaglutide.
  claimRefs:
  - CR011
  - CR012
  - CR013
- calloutType: risk
  title: Valuation has reset 77%+ with no clear path to recovery
  body: >-
    Secondary market transactions value Noom at approximately $720M versus the $3.7B Series F peak — a markdown that reflects both sector-wide repricing and Noom-specific concerns about churn, competition, and business model uncertainty. This severely constrains fundraising and makes IPO timing unrealistic in the near term.
  claimRefs:
  - CR025
  - CR026
  - CR030
- calloutType: risk
  title: Subscription model retains structural FTC exposure despite settlement
  body: >-
    The $62M class action settlement resolved historical claims, but Noom's current quarterly billing structures, multi-month commitments, and complex cancellation flows remain vulnerable to the FTC's continued ROSCA enforcement and the ~30 state auto-renewal laws in effect.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
- calloutType: recommendation
  title: Demand cohort-level retention and LTV data before underwriting
  body: >-
    The absence of disclosed NRR, churn cohorts, or LTV by product line makes it impossible to independently assess whether Noom's GLP-1 pivot generates durable unit economics or simply recycles subscriber acquisition spend. Diligence must require granular retention data before any investment decision.
  claimRefs:
  - CR024
  - CR028
  - CR029
