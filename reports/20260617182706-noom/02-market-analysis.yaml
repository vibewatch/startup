runDate: "2026-06-17"
company:
  name: Noom
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Noom operates at the intersection of multiple expanding markets — digital weight management
    apps ($1.29B in 2026), broader digital health for obesity ($78–99B), corporate wellness ($66–72B),
    telehealth ($64–65B), and the adjacent GLP-1 pharmaceutical market ($73B+). However, the explosive
    growth of anti-obesity medications is simultaneously the sector's greatest growth driver and its
    most acute disruption risk for behavioral-only platforms, as evidenced by WeightWatchers' 2025
    bankruptcy and declining subscriptions industry-wide.
sections:
  - id: market-boundary-and-definition
    title: Market Boundary and Definition
    body: >-
      Noom's addressable market straddles several overlapping spending categories. The core market is
      consumer-facing digital weight management and behavior-change apps — a segment Mordor Intelligence
      sizes at $1.29 billion globally in 2026, growing at 16.9% CAGR to $2.83 billion by 2031. The broader
      digital health for obesity ecosystem, which includes wearable devices, telehealth platforms, AI
      coaching tools, and digital therapeutics, is valued between $78 billion and $99 billion in 2026
      depending on the source and scope definition. Noom's expansion into Noom Med (telehealth-based GLP-1
      prescriptions) places it partly in the U.S. telehealth market ($64–65B in 2026) and adjacent to the
      massive GLP-1 pharmaceutical market ($73B+ in 2026). The corporate wellness and employer health
      benefits channel ($66–72B in 2026) represents Noom's B2B2C opportunity through Noom for Work.
      Excluded spend includes purely pharmaceutical manufacturing, hospital-based bariatric surgery,
      in-person gym memberships without digital integration, and pure-play medical device companies.
      The market boundary matters because Noom's revenue model — B2C subscription plus B2B employer
      licensing plus telehealth medication management — means its addressable slice is meaningfully
      smaller than any single headline market figure.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM001]
  - id: market-sizing-tam-sam-som
    title: Market Sizing (TAM/SAM/SOM)
    body: >-
      Multiple analyst lenses produce dramatically different market sizes depending on boundary choices.
      The broadest framing is the global weight loss and obesity management market at approximately $279
      billion in 2026 (Research and Markets), which includes pharma, surgery, services, and digital tools.
      The digital health for obesity segment ranges from $78 billion (VPA Research, Fortune Business Insights)
      to $99 billion (The Business Research Company), reflecting different inclusion of hardware, wearables,
      and telehealth platforms. Noom's most direct competitive segment — exercise and weight loss apps — is
      far narrower at $1.29 billion (Mordor Intelligence) to $1.39 billion (Coherent Market Insights) in 2026.
      A reasonable SAM for Noom would combine the U.S. share of weight loss apps (approximately $500M given
      North America's 40% share) plus the addressable U.S. telehealth obesity slice and employer wellness
      digital spending. The SOM remains unclear because Noom does not disclose current revenue; its peak
      revenue was estimated at approximately $400 million in 2021 but has declined since. This boundary
      sensitivity — from $1.3B to $99B depending on scope — is the core sizing lesson for diligence.
      The GLP-1 pharmaceutical market ($73.4B in 2026, projected to exceed $100B by 2030 per Goldman Sachs
      estimates cited in Becker's) is adjacent rather than directly addressable by Noom, but Noom Med's
      telehealth prescribing model captures a medication-management and coaching overlay fee on that
      pharmaceutical spend.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM018, CM019]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyer-user-payer-segmentation
    title: Buyer/User/Payer Segmentation
    body: >-
      Noom serves three distinct buyer-payer configurations. In the B2C channel, the individual consumer is
      both buyer and payer, purchasing monthly or annual subscriptions typically ranging from $17–$59 per month.
      The user is the individual seeking weight loss or health behavior change, motivated by personal health
      goals, physician recommendation, or GLP-1 medication support. In the B2B2C employer channel (Noom for
      Work), the buyer is the HR/benefits decision-maker, the payer is the employer or health plan, and users
      are enrolled employees and dependents. Corporate wellness budgets are the funding source, with adoption
      triggered by rising healthcare costs, chronic disease prevalence, and productivity goals. In the Noom Med
      telehealth channel, the buyer-user is the individual patient seeking GLP-1 prescriptions and coaching
      support, with payment split between the consumer (subscription fee) and potentially insurance or employer
      coverage for the medication itself. The U.S. dominates Noom's market given North America's 40% share of
      both the exercise/weight loss app and corporate wellness markets. Large employers (500+ employees) are
      the primary B2B targets, as 76% of employees at such organizations have access to wellness programs
      according to the U.S. Department of Labor.
    claimRefs: [CM020, CM021, CM022, CM023, CM024, CM025, CM026]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The most powerful growth driver is the global obesity epidemic: 40.3% of U.S. adults have obesity
      (CDC/NHANES 2021–2023 data), and WHO reports over 1 billion people globally living with obesity as of
      2022, with prevalence rising in nearly every country. This structural demand floor ensures sustained
      need for weight management solutions. The GLP-1 revolution simultaneously creates both opportunity
      and threat: GLP-1 drugs like Wegovy and Zepbound deliver 15–22% mean weight loss in trials, far
      exceeding behavioral-only programs, which drove approximately 12 million U.S. adults onto GLP-1
      medications by end of 2026. For Noom, this creates opportunity through Noom Med (medication management
      plus coaching) but also devastating substitution risk for the core behavioral subscription product.
      Additional drivers include rising smartphone penetration, employer demand for preventive digital
      health solutions, AI-powered personalization, and expanded Medicare GLP-1 coverage beginning July 2026
      at $245/month with $50 copay. Key constraints include high consumer churn typical of weight-loss
      subscriptions, the perception that medication makes behavioral apps obsolete, intense competition
      from telehealth-first GLP-1 providers (Hims, Ro, Found), FTC regulatory scrutiny over subscription
      practices, and price sensitivity in the consumer health app market where freemium models dominate
      (67% market share per Mordor Intelligence).
    claimRefs: [CM027, CM028, CM029, CM030, CM031, CM032, CM033, CM034, CM035, CM036, CM037, CM038]
    tableRefs: [TM004]
    figureRefs: [FM004]
  - id: sizing-gaps-and-contradictions
    title: Sizing Gaps and Contradictions
    body: >-
      The most material sizing gap is Noom's own revenue trajectory. Peak revenue was estimated at $400M
      in 2021 during the COVID-driven subscription surge, but current revenue is undisclosed and widely
      believed to have declined significantly alongside subscriber attrition post-2021. Without current
      revenue, subscriber count, or churn rate disclosure, SOM calculations are speculative. A second
      contradiction is the wide divergence among analyst estimates: digital health for obesity ranges from
      $71.67B (InsightAce) to $99.36B (TBRC) for 2026 depending on what hardware, wearables, and
      telehealth platforms are included — a 39% spread that reflects definitional rather than analytical
      disagreement. Third, the GLP-1 market's effect on behavioral app demand is unclear: WeightWatchers'
      bankruptcy (revenue fell to $811M in 2024 with subscription revenues declining 5.6%) demonstrates
      catastrophic disruption, yet the digital health for obesity market overall continues growing at
      22–26% CAGR because GLP-1 companion digital tools and telehealth obesity platforms are expanding
      even as standalone behavioral programs shrink. This means Noom's pivot to Noom Med may position it
      in the growing subsegment rather than the declining one, but execution risk is high and the company
      competes against well-capitalized telehealth GLP-1 providers.
    claimRefs: [CM039, CM040, CM041, CM042, CM043, CM044, CM045]
