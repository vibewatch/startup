callouts:
  - calloutType: risk
    title: GLP-1 disruption threatens behavioral-only subscription revenue
    body: >-
      WeightWatchers' Chapter 11 bankruptcy in 2025 — driven by GLP-1 drug competition reducing
      subscriptions by 5.6% annually and producing $345.7M losses — is a direct cautionary precedent
      for Noom's core behavioral subscription model. The speed of disruption is remarkable: WW's
      revenue fell to $811M in 2024 and its stock dropped from $100+ to under $1.
    claimRefs: [CM030, CM031, CM032, CM040, CM041]
  - calloutType: strength
    title: Noom Med positions the company in the growing GLP-1 companion segment
    body: >-
      While standalone behavioral programs are shrinking, digital health for obesity overall grows at
      22–26% CAGR because GLP-1 companion platforms (telehealth prescribing + coaching) are expanding.
      Noom Med's combination of medication management and psychology-based coaching could capture this
      growth if execution matches the pivot speed required.
    claimRefs: [CM006, CM029, CM039, CM042]
  - calloutType: insight
    title: Boundary sensitivity renders headline TAM figures misleading for diligence
    body: >-
      The apparent market ranges from $1.3B (pure apps) to $279B (full obesity ecosystem) — a 215x
      spread. Noom's actual addressable opportunity sits in a narrow band bounded by the U.S. share
      of digital weight management apps plus telehealth obesity services and employer digital wellness,
      roughly $5B in aggregate. Valuation analysis should use this constrained SAM rather than broad
      market headlines.
    claimRefs: [CM010, CM011, CM012, CM014, CM016, CM017, CM043]
  - calloutType: assumption
    title: Market growth rates assume continued GLP-1 supply expansion and coverage broadening
    body: >-
      The 22–26% CAGR for digital health for obesity and the projected $73B+ GLP-1 market assume that
      drug supply constraints ease, Medicare coverage holds after the December 2027 bridge expiration,
      and oral GLP-1 pills further expand the treatable population. Any disruption to these assumptions
      (regulatory reversal, supply shortage, safety signal) would compress growth.
    claimRefs: [CM018, CM019, CM029, CM034, CM044]
