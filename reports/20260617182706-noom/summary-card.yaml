summary:
  headline: >-
    Noom is a real, large-scale consumer-health brand whose 2021 $3.7B mark is no longer credible — secondary markets
    already imply ~$720M — and whose investability now hinges on whether the GLP-1 Noom Med pivot can offset
    behavioral-app revenue decline and structural disruption.
