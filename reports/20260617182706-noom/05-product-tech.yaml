company:
  name: Noom
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Noom delivers a multi-product digital health platform combining psychology-based behavioral
    coaching (Noom Weight), GLP-1 telehealth prescribing (Noom Med), stress management (Noom Mood),
    and enterprise B2B2C solutions (Noom for Work). The technology stack leverages AI/ML for food
    logging, an AI chatbot (Welli), body composition scanning, and personalization, built on AWS
    microservices with native iOS/Android apps. Clinical evidence from the largest-ever Noom RCT
    (2026, n=427) shows sustained 4.1% weight loss at 68 weeks. Key risks include coaching quality
    complaints, GLP-1 compounding legal uncertainty, high churn, and limited public security
    disclosure despite handling PHI.
sections:
  - id: product-portfolio-and-core-experience
    title: Product Portfolio & Core Experience
    body: >-
      Noom operates a multi-product digital health platform serving consumers directly (B2C) and
      through employers and health plans (B2B2C). The flagship product, Noom Weight, delivers a
      psychology-based weight management program through daily CBT-informed lessons, AI-powered food
      logging with a database of over one million items, color-coded calorie-density guidance (green,
      yellow, orange), step tracking with gamification rewards, personalized coaching, and peer
      support communities called Circles. The platform has served over 50 million registered users
      since launch. Noom Med, launched in May 2023, adds telehealth GLP-1 prescribing (semaglutide
      and tirzepatide) with integrated behavioral support, requiring participation in the behavioral
      program alongside medication. Noom expanded to a Microdose GLP-1Rx Program in 2025, offering
      compounded lower-dose semaglutide at $79 initial plus $199/month. Additional products include
      Noom Mood for stress and anxiety management using CBT, Noom Diabetes Prevention Program
      (first CDC-recognized mobile DPP), Noom + HRT for menopause management, and Noom Move with
      over 1,000 fitness classes. The enterprise arm, Noom for Work (launched 2022), provides
      employer and health-plan access to these programs, with Highmark deploying to nearly 2 million
      eligible members beginning January 2026. Pricing ranges from $17.42/month for annual Noom
      Weight plans to $349/month for full-dose GLP-1Rx programs including medication, all FSA/HSA
      eligible.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE036, CE037, CE038]
    tableRefs: [TE001]
    figureRefs: [FE003]
  - id: behavioral-coaching-methodology-and-clinical-evidence
    title: Behavioral/Coaching Methodology & Clinical Evidence
    body: >-
      Noom's differentiation rests on a psychology-first methodology drawn from cognitive behavioral
      therapy (CBT), motivational interviewing, and habit formation science. The curriculum delivers
      daily 10-minute bite-sized lessons through articles and quizzes, targeting the psychological
      drivers of eating behavior rather than imposing food restrictions. The coaching model operates
      as a human-plus-AI hybrid: Welli, the AI chatbot launched in June 2024, provides 24/7
      on-demand guidance while human goal specialists handle accountability and relationship building
      via direct messaging. Clinical evidence supports the approach across multiple studies. The
      2016 Scientific Reports retrospective study (n=35,921) showed 77.9% of users achieved weight
      loss, with engagement frequency as the strongest predictor. The 2026 randomized controlled
      trial published in Obesity Science & Practice (n=427) demonstrated sustained weight loss of
      4.1% body weight at 68 weeks—continuing to deepen for a full year after the 16-week active
      program ended—compared with 1.5% weight gain in the control group (p<0.001). Noom members
      were more than twice as likely to achieve clinically significant weight loss of at least 5%
      (41% vs 19.5%). For GLP-1 users, a January 2026 analysis of 14,210 subscribers showed the
      most-engaged quartile lost 25.2% more weight (8.3 additional lbs) at week 40 than the
      least-engaged, and persisted 2.2x longer on their medication program. However, independent
      reviewers note that most Noom studies are observational or company-funded, long-term data
      beyond 68 weeks remains limited, and dropout rates are high—typical of B2C weight-loss apps.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE039]
    tableRefs: [TE003]
    figureRefs: [FE002]
  - id: noom-med-glp1-telehealth-stack
    title: Noom Med & GLP-1 Telehealth Stack
    body: >-
      Noom Med represents the company's strategic pivot to address the GLP-1 weight-loss medication
      market. The workflow begins with an online health assessment, followed by clinical review by a
      licensed physician or nurse practitioner. Eligible patients (BMI ≥30 or ≥27 with comorbidity)
      receive a prescription, and compounded semaglutide or tirzepatide is shipped directly within
      approximately 7 days. The program uniquely requires ongoing participation in Noom's behavioral
      change platform—there is no medication-only option. Plan tiers in 2026 include Telehealth
      Only ($99/month for brand-name Rx with own pharmacy), Microdose GLP-1Rx ($79 start then
      $199/month including compounded medication), and Full GLP-1Rx ($279-$349/month). The GLP-1
      Companion app integrates medication tracking, side-effect support, Muscle Defense guidance
      for lean mass preservation, AI-powered body composition scans, glucose curve forecasting,
      and gamification. Key engagement metrics show 77.8% of Microdose users engaged for 4+ weeks
      and D30 engagement above 40%—claimed to be 10x average health app retention. The legal
      landscape is uncertain: Noom sells compounded semaglutide under Section 503A exceptions after
      the FDA removed it from the shortage list, and Novo Nordisk/Eli Lilly are challenging
      compounders in court. This represents a material regulatory risk to Noom Med revenue.
    claimRefs: [CE004, CE005, CE020, CE022, CE023, CE024, CE025, CE026, CE027, CE028, CE040]
    tableRefs: [TE004]
    figureRefs: [FE001]
  - id: ai-ml-technology-architecture
    title: AI/ML & Technology Architecture
    body: >-
      Noom's technology platform is built on a microservices architecture deployed on AWS, with
      native mobile apps for iOS (Swift) and Android (Kotlin), and a React.js web interface.
      The backend uses Python (Django) with PostgreSQL as the primary database, Redis for caching,
      and Kubernetes (EKS) for container orchestration. The AI/ML layer includes several
      customer-facing features: AI food logging via photo recognition, text, and voice input
      (launched June 2024); Welli, the GPT-powered personal health assistant trained on
      Noom-specific data; AI-powered body composition face and body scans (launched 2025); glucose
      curve forecasting; and algorithmic personalization of lesson content and coaching interventions.
      On the data engineering side, the platform processes engagement, weight, nutrition, and activity
      data through pipelines feeding analytics and ML model training. Noom's GitHub organization
      shows 41 public repositories—primarily forks, workflow actions (branch-cleanup-action), and
      utility tools rather than substantial open-source frameworks, indicating an engineering
      organization that is internal-facing. Job postings reveal use of GraphQL, RabbitMQ/SQS
      message queues, Terraform infrastructure-as-code, and CI/CD via GitHub Actions. The company
      maintains offices in New York City and Princeton, NJ, with a remote-first engineering
      culture. The AI team was built by data scientists and ML engineers specifically versed in
      digital healthcare, according to CPO Aaron Severs.
    claimRefs: [CE029, CE030, CE031, CE032, CE033, CE034, CE035, CE041]
    tableRefs: [TE002]
    figureRefs: [FE004]
  - id: data-security-compliance-and-product-risks
    title: Data Security, Compliance & Product Risks
    body: >-
      Noom handles protected health information (PHI) through its coaching, telehealth, and
      medication programs, requiring HIPAA compliance. The company operates under Business Associate
      Agreements with vendors, encrypts data at rest (AES-256 via AWS KMS) and in transit
      (TLS 1.2+), and implements role-based access controls. Noom received multiple NIH grants
      and was the first mobile app to achieve CDC recognition as a certified Diabetes Prevention
      Program—a meaningful quality signal. However, public security documentation is notably thin:
      no SOC 2 report, no public security whitepaper, no status page, and no penetration testing
      disclosure have been identified in the reviewed evidence. Product risks are material and
      multi-dimensional. Coaching quality is a persistent complaint—Trustpilot and app reviews cite
      bot-like responses, impersonal coaching, and gap between marketing promise and delivered
      experience. The $56 million class-action settlement (February 2022) for dark-pattern
      auto-renewal practices damaged trust and required enhanced cancellation disclosures. GLP-1
      compounding faces legal challenge from Novo Nordisk and Eli Lilly, threatening Noom Med's
      supply chain. High churn is structurally inherent in B2C weight-loss subscriptions. The
      shift from human coaches to AI (following 2022-2023 layoffs reducing headcount from ~3,400
      to ~2,500) represents both an efficiency gain and a quality risk that reviewers consistently
      flag. App store ratings remain strong (4.7 iOS from 730K+ reviews; 4.1 Android from 315K+
      reviews), but the gap between aggregate scores and vocal complaint patterns suggests
      polarized user experiences.
    claimRefs: [CE036, CE037, CE038, CE039, CE040, CE041, CE042, CE043, CE044, CE045, CE046, CE047]
    tableRefs: [TE005]
