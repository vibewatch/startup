callouts:
  - calloutType: strength
    title: Strongest clinical evidence in digital weight-loss category
    body: >-
      The 2026 RCT showing sustained weight loss one year post-program is the strongest
      published evidence for any commercial digital weight-loss app and directly addresses
      the durability question that plagues the category.
    claimRefs: [CE015, CE016, CE017, CE018]
  - calloutType: risk
    title: GLP-1 compounding faces material legal and regulatory risk
    body: >-
      Noom Med's compounded semaglutide supply chain relies on Section 503A exceptions that
      Novo Nordisk and Eli Lilly are actively challenging in court. An adverse ruling could
      eliminate Noom's fastest-growing revenue segment.
    claimRefs: [CE027, CE028, CE040]
  - calloutType: insight
    title: AI coaching substitution improves unit economics but degrades perceived quality
    body: >-
      The shift from human coaches to AI (Welli) after 2022-2023 layoffs enables scale and
      reduces headcount costs, but reviewer complaints about impersonal coaching represent
      a tension between margin optimization and user satisfaction.
    claimRefs: [CE033, CE034, CE043, CE044, CE046]
  - calloutType: recommendation
    title: Request independent security audit documentation before enterprise deployment
    body: >-
      The absence of public SOC 2, penetration testing, or security whitepaper is a gap for
      enterprise and health-plan buyers handling PHI. Diligence should require current
      independent audit documentation.
    claimRefs: [CE038, CE039, CE045]
