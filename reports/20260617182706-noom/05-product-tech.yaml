  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: "Independent security audit (SOC 2 Type II or equivalent) confirming HIPAA controls and platform security posture"
      whyItMatters: "Enterprise buyers and health plans handling PHI require independent verification of security controls beyond company claims"
      diligencePath: "Request SOC 2 Type II report and most recent penetration testing results during due diligence"
      relatedQuestionRefs: [QE007, QE021]
    - type: missing-source
      severity: material
      topic: long-term-efficacy
      missingEvidence: "Independent RCT with active comparator (not just educational control) and 2+ year follow-up"
      whyItMatters: "Current evidence is company-funded with self-reported outcomes; long-term independent validation would strengthen the clinical thesis"
      diligencePath: "Review ongoing registered clinical trials on ClinicalTrials.gov; request pipeline of planned studies"
      relatedQuestionRefs: [QE025]
    - type: conflicting-data
      severity: material
      topic: regulatory-risk
      missingEvidence: "Definitive court ruling on GLP-1 compounding legality under Section 503A post-shortage"
      whyItMatters: "An adverse ruling could eliminate Noom Med's compounded medication supply and its fastest-growing product line"
      diligencePath: "Monitor ongoing litigation by Novo Nordisk/Eli Lilly against compounders; assess Noom Med revenue exposure"
      relatedQuestionRefs: [QE012]
    - type: private-evidence-only
      severity: minor
      topic: tech-architecture
      missingEvidence: "Formal technology architecture documentation, system uptime metrics, and deployment cadence data"
      whyItMatters: "Tech stack details are inferred from job postings and GitHub signals rather than official documentation, limiting architecture confidence"
      diligencePath: "Request engineering architecture documentation and SLA/uptime metrics during technical due diligence"
      relatedQuestionRefs: [QE006]
    - type: enumeration-incomplete
      severity: minor
      topic: clinical-evidence
      missingEvidence: "Complete listing of all Noom-funded or Noom-referenced clinical studies with their ClinicalTrials.gov registration numbers"
      whyItMatters: "Publicly cited studies are selective; a complete registry would reveal study publication bias or unpublished negative results"
