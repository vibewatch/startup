evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      A management-confirmed statement reconciling the El Segundo corporate-office address with third-party descriptions
      of Cosm as Los Angeles-based or Playa Vista-based.
    whyItMatters: Later chapters should not propagate a false headquarters label into market, hiring, or competitive analysis.
    diligencePath: >-
      Request legal-entity filings, lease details, and management confirmation of the canonical headquarters label used
      in board materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A refreshed valuation source after the July 2024 round, such as a 409A, board deck, term sheet, or secondary
      transaction summary.
    whyItMatters: The only public valuation mark is a reported 2024 unicorn valuation, which may not reflect June 2026 fair value.
    diligencePath: Request the most recent financing documents, 409A, and any marked-to-market investor letters.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Revenue, ARR, attendance, repeat visitation, venue utilization, and contribution-margin data for Los Angeles,
      Dallas, and Atlanta.
    whyItMatters: >-
      Without core operating metrics, it is impossible to underwrite the economics of the venue rollout or benchmark
      public skepticism.
    diligencePath: Request a KPI pack, board materials, and venue-level P&Ls for the last twelve months.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full board roster, committee structure, and disclosure on debt facilities or secondary-share activity.
    whyItMatters: Governance depth and financing complexity affect control risk, future dilution, and downside protection.
    diligencePath: Request capitalization tables, debt schedules, board lists, and investor-rights summaries.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: partnership-roster
    missingEvidence: >-
      A canonical partner roster from Cosm or counterparties that reconciles which league, broadcaster, and brand
      relationships are active, announced, or expired.
    whyItMatters: Seed facts referenced a broader partner set than could be directly verified from retained sources.
    diligencePath: Request current partner one-pagers or rights summaries from business development leadership.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table public chronology coverage
    missingEvidence: >-
      A management-supplied milestone list covering private governance changes, any undisclosed financings, and
      venue-level commercial milestones not captured in public reporting.
    whyItMatters: >-
      The published chronology is strong on public announcements but may miss private milestones that shaped execution
      and capital planning.
    diligencePath: >-
      Request an internal company timeline and board-approved milestone tracker to reconcile against the public
      chronology.
    relatedQuestionRefs:
      - QO014
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: venue-unit-economics
    missingEvidence: Public venue-level pricing, occupancy, repeat visitation, and F&B attach-rate data for each Cosm location.
    whyItMatters: Without unit economics, a public SOM is only illustrative and investors cannot test payback assumptions.
    diligencePath: >-
      Request mature-venue monthly cohort data, ticket-price ladders, occupancy by event type, and four-wall
      contribution margins from management.
    relatedQuestionRefs:
      - QM010
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sponsorship-and-private-event-mix
    missingEvidence: >-
      Breakout of revenue and gross margin from sponsorships, brand activations, and private events versus consumer
      ticketing.
    whyItMatters: >-
      The buyer map is credible, but the monetization mix determines whether the business behaves like a venue operator,
      media platform, or experiential agency.
    diligencePath: >-
      Ask for signed sponsor inventory packages, private-event utilization, and revenue mix by payer class for Los
      Angeles and Dallas.
    relatedQuestionRefs:
      - QM012
      - QM015
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: tam-definition-gap
    missingEvidence: >-
      A management-approved market-definition bridge reconciling direct venue LBE, immersive LBE, and broader
      immersive-entertainment categories.
    whyItMatters: >-
      Headline TAM can shift by more than 20x depending on scope, which can distort valuation framing and strategic
      comparisons.
    diligencePath: >-
      Build a bottoms-up bridge that starts with disclosed venue categories, then explicitly adds or excludes theme
      parks, at-home tech, and rights pools.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: repeat-demand-economics
    missingEvidence: Mature-venue repeat-visit, occupancy, and contribution-margin data for Cosm after launch novelty fades.
    whyItMatters: >-
      Pricing power is central to the underwriting case, and public venue excitement does not prove durable unit
      economics.
    diligencePath: >-
      Request monthly cohort retention, utilization, food-and-beverage attach rates, and contribution margin by mature
      venue.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: rights-exclusivity
    missingEvidence: Contract-level detail on exclusivity, renewal, and termination rights for major league and broadcaster agreements.
    whyItMatters: If rights are non-exclusive or short-term, a core competitive edge could be reproduced by other premium venues.
    diligencePath: >-
      Review executed NBA, FIFA/FOX, and other flagship rights agreements or management summaries with term and
      exclusivity language.
    relatedQuestionRefs:
      - QP022
  - type: stale
    severity: material
    topic: expansion-realism
    missingEvidence: >-
      Current city-by-city development timelines, committed capital, and expected returns for the broader pipeline
      beyond the next two openings.
    whyItMatters: The more-than-100-site narrative could overstate practical rollout speed in a capital-intensive venue format.
    diligencePath: >-
      Request approved development schedule, capex per site, and payback thresholds for Atlanta, Detroit, Cleveland, and
      the next tranche.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      A clean split between ticket, sponsorship, food-and-beverage, and private-event revenue at Cosm and the closest
      direct peers.
    whyItMatters: >-
      Different revenue mixes imply very different sensitivity to rights costs, attendance volatility, and local
      competition.
    diligencePath: Ask management for venue-level revenue mix and compare against event, sponsorship, and hospitality attach rates.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: standalone-dome-vendors
    missingEvidence: >-
      Independent evidence on current standalone dome-theater vendors winning consumer venue deployments large enough to
      threaten Cosm directly.
    whyItMatters: >-
      Without that evidence, vendor competition should be treated as build-vs-buy pressure rather than a confirmed
      direct venue rival set.
    diligencePath: >-
      Run a dedicated vendor deployment sweep across trade press, museum contracts, and entertainment-development
      announcements.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: blocking
    topic: cash-balance
    missingEvidence: Current unrestricted cash, revolver availability, and any venue-level debt or lease obligations.
    whyItMatters: >-
      Without treasury disclosure, investors cannot size runway or determine whether another raise is discretionary or
      urgent.
    diligencePath: >-
      Request management financial statements, debt schedules, and covenant summaries for the parent and each venue
      entity.
    relatedQuestionRefs:
      - QI021
  - type: missing-source
    severity: blocking
    topic: burn-rate
    missingEvidence: Monthly cash burn, EBITDA, and contribution margin by venue and by content category.
