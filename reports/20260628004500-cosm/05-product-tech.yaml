- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Cosm solution
  - Measurable benefit
  - Limitation
  rows:
  - - Watch a major live game without traveling
    - Fan buys a ticket to a venue, watches television, or uses a personal headset
    - Shared Reality event in The Dome with supporting Hall and Deck surfaces
    - Communal 180-degree, no-headset event experience with hospitality layered in
    - Still requires a physical venue and rights-cleared programming slate
  - - Extend a premium sports broadcast into a new monetization surface
    - Rights holder sells linear or streaming rights only
    - Cosm captures, produces, and redistributes an immersive venue version
    - Creates a new location-based rights surface rather than only another stream
    - Depends on partner approvals, capture access, and venue economics
  - - Review a play or create social clips from more angles
    - League or broadcaster relies on conventional replay and camera archives
    - C360 capture plus CX Video Hub cloud workflow
    - Ultra-high-resolution multi-angle review and clipping at league scale
    - Public use cases are strongest in marquee sports rather than across every format
  - - Run an immersive science or planetarium program
    - Institution buys projection or dome software from multiple vendors
    - CX System plus Digistar and packaged content libraries
    - One vendor can provide dome hardware, rendering software, and reusable science content
    - Public pricing, migration costs, and support scope are not disclosed
  - - Launch a branded immersive experience or attraction
    - Creator or operator assembles screen, content, and control vendors separately
    - Cosm provides technology stack plus partner content or creator program paths
    - Reduces system integration burden and offers live, original, or licensed content options
    - Content economics and exclusivity terms stay largely private
  notes: Benefits are directional and product-structure based; public sources do not disclose conversion, occupancy, or per-event economics.
