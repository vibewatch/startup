- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Shared Reality venues
    - Fans, groups, corporate hosts
    - Live in Los Angeles, Dallas, and Atlanta; Detroit and Cleveland planned
    - Turns immersive media into a hospitality-led, communal destination instead of a solo device
    - No public venue-level uptime, occupancy, or attachment-rate metrics
  - - CX System
    - Planetariums, science centers, attractions, third-party venue operators
    - Commercial platform with active marketing and installed-base references
    - Bundles dome hardware, software, content, and design into one stack
    - No public contract structure or third-party implementation timelines
  - - CX Display / Black Dome
    - Venue operators and technology partners
    - Mature core hardware layer
    - Matte-black LED dome aims to beat projection on contrast, brightness, and reflections
    - No independent benchmark across multiple deployed venue generations
  - - CX Engine / Digistar / CX Pro
    - Operators, producers, and technical teams
    - Live and proven, with legacy Digistar lineage
    - Combines real-time rendering, Unreal integration, content mapping, and venue compositing
    - Limited public documentation on release cadence, tooling governance, or fault recovery
  - - C360 capture + CX Video Hub
    - Leagues, broadcasters, officiating and content teams
    - Operating at league scale in NHL and sports partner workflows
    - High-resolution immersive capture plus cloud workflows reuse Cosm know-how outside dome venues
    - Economics, latency envelopes, and customer segmentation outside marquee leagues remain opaque
  - - Cosm Immersive / LiveLikeVR distribution
    - Rights holders and digital audiences
    - Continuing inherited capability
    - Preserves headset and mobile distribution options even as venue brand stresses no-headset attendance
    - Public product surface is less visible than venues, so current revenue contribution is unclear
  - - Cosm Studios + premium library
    - Science centers, arts programming, venue operators
    - Live and expanding
    - Blends proprietary productions with reusable fulldome libraries and partner IP
    - Split between proprietary and licensed content rights is not publicly quantified
  notes: Rows distinguish the consumer-facing venue offer from the deployable technology and media assets that make the system repeatable.
