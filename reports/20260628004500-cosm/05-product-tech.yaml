- id: stack-and-live-production-workflow
  title: Dome, LED, audio, and live production stack
  body: 'The technical stack is deeper than a venue AV install. CX System combines the matte-black CX Display dome, CX Engine and Digistar software, Unreal integration, and multi-channel venue playback. Partner materials show the live sports pipeline starting with Cosm’s own high-resolution capture kits, then flowing through AWS-based REMI production, MediaConnect transport, and CX Pro compositing before distributed Dell and NVIDIA render nodes drive the dome and supporting LED surfaces. This is why Cosm can layer a broadcaster’s conventional feed onto a more immersive 180-degree venue view rather than simply mirror television on a bigger screen. The same architecture also explains the operational burden: high-resolution ingest, synchronization, GPU headroom, audio mapping, and broadcast-rights timing all have to work together in real time for the illusion to hold.'
