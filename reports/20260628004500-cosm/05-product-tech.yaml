chapter:
  number: 5
  title: Product & Technology
  summary: Cosm’s product is a no-headset Shared Reality stack that combines venue operations, LED dome hardware, immersive software, and live or licensed content into one repeatable system. The strongest evidence is around dome display quality, REMI and cloud production, and the inherited E&S/Spitz/LiveLikeVR/C360 asset base; the weakest public areas are venue reliability disclosure, content-right economics, and the capital intensity of nationwide rollout.
sections:
- id: shared-reality-product-definition
  title: Shared Reality product definition and no-headset positioning
  body: 'Cosm’s product is better understood as a repeatable Shared Reality operating model than as a single dome screen. On the consumer side, each venue bundles The Dome, The Hall, and The Deck, with ticketed seating, food-and-beverage service, and social viewing wrapped around a 12K x 10K LED display. On the B2B side, the same company sells CX System hardware and software plus Cosm Media production. That matters because the customer workflow is two-sided: fans buy a communal ‘best seat in the house’ alternative to traveling to a game or show, while rights holders, institutions, and partners buy a way to package premium immersive programming. The central thesis is no-headset immersion. Cosm repeatedly distinguishes Shared Reality from VR by keeping everyone in one room, and it distinguishes itself from theaters by making crowd energy, wraparound sightlines, and hospitality part of the product rather than just the content being projected.'
