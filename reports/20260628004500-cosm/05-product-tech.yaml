  evidenceGaps:
  - type: missing-source
    severity: material
    topic: venue-reliability-metrics
    missingEvidence: Public venue-level uptime targets, incident history, and subsystem failure-rate metrics for dome, hall, audio, and ordering systems.
    whyItMatters: Without reliability disclosure it is hard to separate impressive demos from repeatable daily operations at scale.
    diligencePath: Request venue incident logs, uptime dashboards, and postmortem summaries for Los Angeles, Dallas, and Atlanta.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: content-rights-mix
    missingEvidence: A breakdown of proprietary programming versus licensed or partner-controlled content, including renewal terms and exclusivity windows.
    whyItMatters: Programming breadth is central to utilization and differentiation, but the public record does not show how defensible or recurring each content stream is.
    diligencePath: Request a rights inventory by category with contract term, exclusivity, revenue share, and renewal risk.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: venue-scale-economics
    missingEvidence: Per-venue capex, backhaul assumptions, render-node cost, and operating support model for the next five openings.
    whyItMatters: The rollout thesis depends on whether the infrastructure can be replicated economically, not merely technically.
    diligencePath: Request venue build budgets, infrastructure BOMs, and payback assumptions for Los Angeles, Dallas, Atlanta, Detroit, and Cleveland.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: consumer-security-disclosure
    missingEvidence: A public-facing security, privacy, or compliance summary for venue apps, ordering flows, guest data, and building operations.
    whyItMatters: Trust controls may exist, but their absence from the public surface leaves diligence guessing about consumer-data governance.
    diligencePath: Request public trust-center materials or internal control summaries covering payment, ordering, guest accounts, and venue-network operations.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
