- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Five-layer view of how Cosm turns capture, software, and venue hardware into a repeatable Shared Reality platform.
  data:
    layers:
    - label: Audience and venue surface
      detail: The Dome, Hall, Deck, ticketing, in-seat service, and social attendance model form the user-facing product shell.
    - label: Display and audio layer
      detail: CX Display / Black Dome hardware, panel calibration, and spatial-audio control deliver the sensory envelope.
    - label: Real-time software layer
      detail: CX Engine, Digistar, Unreal integration, and CX Pro map, render, and composite immersive media.
    - label: Cloud production and distribution layer
      detail: AWS REMI, SRT, MediaConnect, S3 or Glacier, and Direct Connect move and stage high-resolution content.
    - label: Capture and content layer
      detail: C360 systems, live event feeds, Cosm Studios output, and partner IP provide the raw media inventory.
  approximationNotes: Layering is logical rather than code-architectural; some layers operate concurrently during live events.
