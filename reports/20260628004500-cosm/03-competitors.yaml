- id: switching-costs-and-distribution
  title: Switching costs, lock-in, and distribution power
  body: Public evidence suggests Cosm’s real switching costs sit upstream with rights holders, media partners, and venue-development partners more than downstream with consumers. Consumers can multi-home between Cosm, Topgolf, IMAX, Meow Wolf, or ARTECHOUSE because the outings solve adjacent but not identical leisure jobs. Corporate and group-event buyers also face low structural switching costs because Sphere, Topgolf, and ARTECHOUSE all advertise group or private-event packages publicly. By contrast, the harder-to-copy layer is the combination of venue siting near major sports districts, league and broadcaster relationships, and capture/distribution workflows that make live events feel additive rather than merely “projected bigger.” That is why the most relevant competitive benchmark is not raw screen size alone. Sphere proves there is willingness to pay for premium immersion, but IMAX’s PLF wars show that premium-viewing hardware can commoditize once exhibitors or developers assemble
    enough off-the-shelf components. DisplayDaily’s description of Cosm’s 2020 acquisitions of Evans & Sutherland and Spitz reinforces that the tech stack is at least partly buy-build-integrate rather than an untouchable organic moat.
