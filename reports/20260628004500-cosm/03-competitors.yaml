  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: repeat-demand-economics
    missingEvidence: Mature-venue repeat-visit, occupancy, and contribution-margin data for Cosm after launch novelty fades.
    whyItMatters: Pricing power is central to the underwriting case, and public venue excitement does not prove durable unit economics.
    diligencePath: Request monthly cohort retention, utilization, food-and-beverage attach rates, and contribution margin by mature venue.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: rights-exclusivity
    missingEvidence: Contract-level detail on exclusivity, renewal, and termination rights for major league and broadcaster agreements.
    whyItMatters: If rights are non-exclusive or short-term, a core competitive edge could be reproduced by other premium venues.
    diligencePath: Review executed NBA, FIFA/FOX, and other flagship rights agreements or management summaries with term and exclusivity language.
    relatedQuestionRefs:
    - QP022
  - type: stale
    severity: material
    topic: expansion-realism
    missingEvidence: Current city-by-city development timelines, committed capital, and expected returns for the broader pipeline beyond the next two openings.
    whyItMatters: The more-than-100-site narrative could overstate practical rollout speed in a capital-intensive venue format.
    diligencePath: Request approved development schedule, capex per site, and payback thresholds for Atlanta, Detroit, Cleveland, and the next tranche.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: A clean split between ticket, sponsorship, food-and-beverage, and private-event revenue at Cosm and the closest direct peers.
    whyItMatters: Different revenue mixes imply very different sensitivity to rights costs, attendance volatility, and local competition.
    diligencePath: Ask management for venue-level revenue mix and compare against event, sponsorship, and hospitality attach rates.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: standalone-dome-vendors
    missingEvidence: Independent evidence on current standalone dome-theater vendors winning consumer venue deployments large enough to threaten Cosm directly.
    whyItMatters: Without that evidence, vendor competition should be treated as build-vs-buy pressure rather than a confirmed direct venue rival set.
    diligencePath: Run a dedicated vendor deployment sweep across trade press, museum contracts, and entertainment-development announcements.
    relatedQuestionRefs:
    - QP025
