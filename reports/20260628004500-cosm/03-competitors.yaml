- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - League and broadcaster rights pipeline
    - Rights can be non-exclusive, expensive, or re-sold to other premium venues
    - high
    - Request detail on exclusivity, term, renewal mechanics, and revenue-share obligations for major sports packages.
  - - Destination siting near sports/entertainment districts
    - Competing districts can lure similar venues with incentives and traffic anchors
    - medium
    - Track whether upcoming sites continue to cluster near anchor stadiums and mixed-use districts.
  - - Dome hardware and rendering stack
    - Screen spectacle can commoditize as developers or exhibitors assemble enough off-the-shelf components
    - high
    - Separate proprietary workflow advantages from acquired or integratable hardware modules.
  - - Premium pricing power
    - Sphere backlash shows immersive venues can overshoot willingness to pay
    - high
    - Watch repeat-visit behavior, not just launch demand or marquee-event sellouts.
  - - Hospitality and group-event model
    - Topgolf, Sphere, and ARTECHOUSE all market group packages, limiting structural lock-in
    - medium
    - Measure corporate rebooking and attach-rate evidence versus one-off bookings.
  - - Experiential-category novelty
    - Consumers can multi-home across Topgolf, Meow Wolf, ARTECHOUSE and teamLab without abandoning Cosm
    - medium
    - Underwrite Cosm as one premium outing in a broader leisure basket, not the only immersive option.
  - - Expansion narrative (>100 sites aspirational)
    - Fast rollout can create overbuild risk before unit economics are proven publicly
    - high
    - Request mature-venue occupancy, margin, and payback data before underwriting aggressive footprint assumptions.
  notes: Severity is an underwriting judgment based on retained public evidence; the table pairs each visible moat argument with the most plausible competitor or substitute-based erosion path.
