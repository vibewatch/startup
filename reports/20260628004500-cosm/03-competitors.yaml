tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Scale / funding
  - Target customer
  - Product scope
  - Strategic direction
  - Limitation vs. Cosm
  rows:
  - - Sphere
    - Public Sphere Entertainment venue platform; premium ticketed Las Vegas flagship
    - Tourists, premium live-entertainment buyers, group and corporate events
    - Immersive film, concerts, eventized venue experiences
    - Push spectacle and premium pricing across concerts, films, and group sales
    - Closest direct analog, but public sports-rights depth is thinner than Cosm’s current league/broadcaster disclosures.
  - - IMAX / PLF exhibitors
    - Global premium-cinema ecosystem with growing in-house rival brands
    - Moviegoers and event viewers seeking a premium-screen upgrade
    - Large-format theatrical viewing, special events, branded premium auditoriums
    - Defend premium-screen economics while exhibitors add their own PLF formats
    - Far wider distribution than Cosm, but weaker communal “shared reality” immersion and hospitality bundle.
  - - Meow Wolf
    - Multi-city private immersive-art operator with pass/ticket products
    - Leisure, tourist, and nightlife audiences seeking exploratory immersion
    - Walk-through narrative art worlds, daytime family visits, 21+ nighttime variants
    - Expand repeatable immersive IP and membership-like products
    - Strong on experiential spend, weak on live sports realism and broadcaster-rights depth.
  - - Topgolf
    - Large social-entertainment venue chain with F&B and memberships
    - Group outings, casual sports fans, corporate events, repeat local users
    - Participatory golf bays, watch-party overlays, food and beverage, events
    - Drive frequency with low entry pricing, subscriptions, and match-day traffic
    - Competes for social dollars and events, not for “best seat in the stadium” simulation.
  - - ARTECHOUSE
    - Multi-city digital-art venue footprint
    - Tourists, date-night, culture and premium-group buyers
    - Tech-enabled art exhibitions, private events, timed tickets
    - Own the art-tech destination niche in dense urban markets
    - Competes for premium outing spend, not live-rights-led appointment viewing.
  - - teamLab Borderless
    - Destination museum-style immersive art draw
    - Tourists and culture travelers seeking landmark immersion
    - Boundaryless digital-art museum experience
    - Use global-art brand and location draw rather than recurring sports cadence
    - A strong tourism substitute, but not a U.S. group sports-viewing venue.
  - - Institutional dome-stack / internal build path
    - Buy-build-integrate path visible through dome-technology heritage and acquired assets
    - Planetariums, museums, developers, and venue builders
    - Dome display, rendering, domecasting, and immersive-education tooling
    - Assemble dome capability without matching Cosm venue operations end-to-end
    - Demonstrates hardware is not the only moat; rights, programming, and siting still matter.
  notes: Scale/funding is kept qualitative where public disclosures are venue- or category-level rather than perfectly comparable across private and public operators.
