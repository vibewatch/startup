callouts:
- calloutType: strength
  title: Sports rights make Cosm more defensible than most immersive venues
  body: Many experiential venues can sell awe; far fewer can publicly show long-term NBA distribution and a 40-match FIFA World Cup 2026 package on custom domes in multiple cities.
  claimRefs:
  - CP004
  - CP005
  - CP035
- calloutType: risk
  title: The dome is necessary, but it is not a complete moat
  body: Sphere proves premium spectacle can scale, and PLF exhibitor behavior shows that operators keep looking for cheaper ways to approximate premium viewing once the demand pool is visible.
  claimRefs:
  - CP012
  - CP019
  - CP020
  - CP040
- calloutType: insight
  title: Most substitutes are imperfect, so multi-homing is more likely than hard switching
  body: Consumers can pair Cosm with Topgolf, Meow Wolf, ARTECHOUSE or even Sphere because each outlet solves a different leisure job; the real competitive battle is share of premium-outing budget, not one-for-one replacement.
