- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Price / unit
  - Contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Cosm
    - Dynamic ticketing; retained reporting says some tickets can exceed $200
    - Per-event ticketing plus group/private-event packages
    - 87-foot 12K+ dome presentation, premium seating tiers, elevated food and beverage
    - Exact rights economics and realized average ticket price are undisclosed
    - High-ARPU upside if demand holds, but repeatability is not yet publicly proven.
  - - Sphere
    - Event-specific Ticketmaster pricing; company signaled higher future ticket prices
    - Per-event mobile ticketing with group rates for 9+
    - 16K venue experiences, hospitality, group-event packaging, sensory effects
    - Public group-rate structure exists, but exact realized pricing varies by event and resale market
    - Shows ceiling pricing power for immersive venues, but also price-backlash risk.
  - - IMAX / PLF
    - Premium-ticket surcharge over standard cinema pricing
    - Per-show theatrical admission
    - Large-format screen and audio inside existing theatre networks
    - Installed-base economics differ by exhibitor and many rival PLF brands are in-house
    - Broad reach keeps IMAX relevant, but the format is easier to comparison-shop.
  - - Meow Wolf
    - Denver general admission starts at $37; anytime at $51; annual pass at $84
    - Timed-entry tickets, passes, add-ons, group visits
    - Narrative art immersion, nighttime variants, merchandise/F&B discounts via pass
    - Pricing varies by city and date; retained pricing is from Denver only
    - Clear repeat-visit pricing creates a lower-spend but more frequent alternative to Cosm.
  - - Topgolf
    - Sunday pricing from $20/hr per bay for up to six players; $20/month membership advertised
    - Hourly bay rental, memberships, events
    - Gameplay, Toptracer, TVs, F&B, group-event packaging
    - Walk-in prices can be higher than app/online pricing
    - Much lower trial price makes Topgolf a frequent social substitute for casual watch-party spend.
  - - ARTECHOUSE / teamLab
    - Timed tickets and private-event packages; best availability often online
    - Per-visit admission with event upsells
    - Digital-art immersion, destination draw, private events
    - Exact ticket levels vary by city/date and are not uniformly disclosed in retained evidence
    - These venues compete for premium night-out budgets without requiring sports fandom.
  notes: Public pricing is not apples-to-apples across venue classes, so the table emphasizes purchase mechanics and what the buyer receives rather than pretending to normalize unlike experiences.
