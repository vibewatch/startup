- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Interpretation
  - Diligence ask
  rows:
  - - 2024 growth round
    - Over 250m USD announced
    - Large equity base, but not enough to infer current liquidity
    - Provide use-of-proceeds bridge and remaining cash from this round
  - - Raised to date by Feb 2025
    - 300m USD reported by CNBC
    - Indicates material cumulative funding before Sony round
    - Reconcile cumulative capital raised by round and by instrument
  - - Sony Series C investment
    - 100m USD in Jun 2026
    - Fresh strategic capital and board-level validation
    - Provide post-money valuation, terms, and liquidation preferences
  - - Disclosed capital by mid-2026 (inferred floor)
    - At least ~400m USD
    - Suggests ongoing financing needs at platform scale
    - Provide current capitalization table and debt schedule
  - - Dallas filed construction cost
    - 42.5m USD for Grandscape shell/project record
    - One hard venue cost marker in public record
    - Provide all-in venue cost including technology and pre-opening spend
  - - Pipeline after Atlanta
    - Detroit this September; Cleveland early next year
    - Expansion implies more capex before steady-state proof is public
    - Provide committed capex and opening budgets by future site
  - - Management financing posture
    - Company says it may raise again depending on pace
    - Signals capital adequacy is linked to rollout speed
    - Provide base / upside / downside fundraising plan
  - - Current cash / runway
    - Not publicly disclosed in fetched sources
    - Core blocker for underwriting
    - Provide unrestricted cash, burn, debt, and covenant headroom
  notes: This table separates what is directly disclosed from what is inferred; no fetched source this run disclosed current cash, debt, or runway.
