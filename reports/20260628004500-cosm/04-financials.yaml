      - label: low
        tone: warning
        detail: Construction spend precedes revenue and no offsetting financing detail is public.
      - label: high
        tone: positive
        detail: Filing data is specific on cost, square footage, and private funding.
      - label: medium
        tone: neutral
        detail: One venue cost is clear, but all-in network capex remains undisclosed.
    - label: Deposits and group pre-sales
      values:
      - label: low
        tone: neutral
        detail: They do not reduce build cost, only timing pressure.
      - label: medium
        tone: positive
        detail: 50 percent deposits and pre-sold group events pull cash forward.
      - label: medium
        tone: neutral
        detail: Terms are public, dollar magnitude is not.
      - label: medium
        tone: neutral
        detail: Helpful for working capital, insufficient for full capex recovery alone.
    - label: Strategic capital base
      values:
      - label: high
        tone: positive
        detail: Public disclosures point to 300m raised by Feb 2025 plus 100m from Sony in Jun 2026.
      - label: medium
        tone: neutral
        detail: Fresh equity can fund rollout, but remaining cash is unknown.
      - label: medium
        tone: neutral
        detail: Round size is public; post-money valuation and dilution terms are not.
      - label: medium
        tone: neutral
        detail: Supportive but not sufficient to prove runway.
    - label: Expansion pipeline
      values:
      - label: high
        tone: warning
        detail: Detroit and Cleveland add more venue obligations after Atlanta.
      - label: low
        tone: warning
        detail: No public budget, lease, or opening-cost schedule is fetched for those sites.
      - label: medium
        tone: neutral
        detail: Cities and timing are public, economics are not.
      - label: low
        tone: warning
        detail: Pipeline scale is visible, but payback remains opaque.
    - label: Venue operating economics
      values:
      - label: medium
        tone: warning
        detail: Premium pricing and hospitality suggest strong revenue potential, but fixed service costs are likely meaningful.
      - label: low
        tone: warning
        detail: No public cash burn, EBITDA, or attendance makes timing impossible to model.
      - label: low
        tone: warning
        detail: Core operating metrics are private.
      - label: low
        tone: warning
        detail: This is the main blocker to full underwriting.
