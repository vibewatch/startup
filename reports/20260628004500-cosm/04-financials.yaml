  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: cash-balance
    missingEvidence: Current unrestricted cash, revolver availability, and any venue-level debt or lease obligations.
    whyItMatters: Without treasury disclosure, investors cannot size runway or determine whether another raise is discretionary or urgent.
    diligencePath: Request management financial statements, debt schedules, and covenant summaries for the parent and each venue entity.
    relatedQuestionRefs:
    - QI021
  - type: missing-source
    severity: blocking
    topic: burn-rate
    missingEvidence: Monthly cash burn, EBITDA, and contribution margin by venue and by content category.
    whyItMatters: Runway, payback, and capital efficiency cannot be underwritten from topline fundraising announcements alone.
    diligencePath: Request monthly management accounts with venue P&Ls, central overhead allocation, and rolling cash forecast.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Attendance, seat occupancy, repeat visitation, event frequency, and per-cap food-and-beverage attachment by venue.
    whyItMatters: Observed ticket tiers are not enough to translate venue capacity into realized revenue throughput or margin.
    diligencePath: Request venue dashboards covering paid attendance, occupancy by tier, sell-through by event type, and repeat-customer cohorts.
    relatedQuestionRefs:
    - QI016
    - QI023
  - type: private-evidence-only
    severity: material
    topic: content-rights-cost
    missingEvidence: League, studio, and broadcaster economics including revenue shares, minimum guarantees, and rights costs per event.
    whyItMatters: Content costs likely shape gross margin more than ticket sticker price, especially for premium live sports inventory.
    diligencePath: Request major rights agreements or at least summarized economics by partner and programming category.
    relatedQuestionRefs:
    - QI024
  - type: missing-source
    severity: material
    topic: valuation-marker
    missingEvidence: A directly fetched priced-round valuation, cap table update, or secondary transaction marker after the 2026 Series C.
    whyItMatters: Without a current valuation anchor, dilution math and relative attractiveness versus cash needs remain speculative.
    diligencePath: Request term-sheet economics, post-money valuation, option pool size, and any recent secondary pricing.
    relatedQuestionRefs:
    - QI026
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: Audited or management revenue mix across tickets, suites/booths, group sales, private events, food and beverage, sponsorship, and licensing.
    whyItMatters: The business appears diversified, but the absence of mix disclosure prevents assessing durability, seasonality, and margin quality.
    diligencePath: Request trailing-twelve-month revenue by stream and venue plus gross-margin by stream.
    relatedQuestionRefs:
    - QI016
