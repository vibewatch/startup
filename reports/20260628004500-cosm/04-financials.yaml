- id: throughput-and-unit-economics
  title: Throughput, pricing power, and unit-economics proxies
  body: 'Because Cosm is private and does not publish revenue or margin, the most defensible financial work is bounding what one venue could plausibly monetize from visible inputs. The official private-event pages disclose the capacity envelope: over 30,000 square feet and more than 1,500 total guests for a full venue, with the Dome itself marketed around 364 seats in Los Angeles and roughly 364 to 400 seats in Dallas depending on configuration. Dallas Observer provides the cleanest public ticket examples, showing $39 general admission, $77 reserved seats, and a $759 six-seat booth for one college-football event. Those inputs are enough to derive a narrow admissions-only floor of roughly $14 thousand to $28 thousand for a sold-out 364-seat Dome event before booths, sponsorship, or food and beverage. Secondary-market pages imply higher high-demand price points, but those are low-confidence because reseller prices do not equal primary revenue. The good news is that ancillary revenue is clearly
    designed into the venue format through in-seat ordering, alcohol service, private-event catering, and bundled hospitality. The bad news is that public evidence stops before realized per-cap spend, occupancy, repeat visitation, or contribution margin.'
  claimRefs:
