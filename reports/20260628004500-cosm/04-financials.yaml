- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current cash balance
    - Determines whether another raise is optional or necessary
    - Blocking
    - Request latest balance sheet and treasury schedule
  - - Monthly burn and EBITDA
    - Sets runway, margin trend, and raise timing
    - Blocking
    - Request monthly management accounts and rolling forecast
  - - Attendance / occupancy by tier
    - Translates capacity into realized revenue throughput
    - Material
    - Request ticketing dashboards by event and section
  - - Food and beverage per cap
    - Determines whether hospitality offsets rights and labor cost
    - Material
    - Request POS reporting by venue and event type
  - - Content-rights economics
    - Critical to gross margin on premium sports and film inventory
    - Material
    - Request summarized economics for major league and studio contracts
  - - Sponsor revenue by campaign
    - Tests whether brand partnerships are meaningful or merely marketing support
    - Material
    - Request sponsor bookings, fees, and renewal cadence
  - - Venue-level P&Ls
    - Needed for payback, maturity curve, and cross-site comparability
    - Blocking
    - Request trailing-twelve-month P&Ls for LA, Dallas, and Atlanta
  - - Post-Series C valuation and dilution terms
    - Needed for ownership math and return underwriting
    - Material
    - Request term sheet, cap table, and any secondary pricing markers
  notes: Each gap is specific and action-oriented because the main financial problem is not too little narrative but too little disclosed operating data.
  claimRefs:
  - CI027
  - CI040
  - CI043
