  - TI005
  figureRefs: []
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Observable mechanism
  - Unit / trigger
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Public ticketed events
    - Direct event ticket sales through venue/event pages
    - Per seat / per event
    - Observable and active in LA and Dallas
    - 'Medium: demand visible, realized yield undisclosed'
    - Provide primary sell-through, occupancy, and net ticket yield by event type
  - - Premium reserved seating
    - Dome booths and Hall reserved tables
    - Per booth / table / seat
    - Officially marketed; Dallas Observer shows $759 six-seat booth example
    - 'Medium-high: premium upsell exists, mix undisclosed'
    - Share tier mix, attachment by event, and booth utilization
  - - Group packages
    - All-inclusive bundles for 20-100 guests, plus 10-plus group sales
    - Per guest / per group event
    - Officially marketed in both venues
    - 'Medium: packaging visible, realized discounts undisclosed'
    - Provide package pricing, gross margin, and conversion from inquiries
  - - Private events / buyouts
    - Single-space rentals and full-venue events with deposits
    - Per event contract
    - Officially marketed with inquiry workflow
    - 'Potentially high but opaque: custom quoted'
    - Provide contract values, close rates, repeat corporate accounts
  - - Food and beverage
    - In-seat ordering, full bar, gastropub menu, custom catering
    - Per cap / per check
    - Observable across venue, group, and help pages
    - Potentially attractive but unquantified
    - Provide F&B per cap, mix, labor, and margin by venue
  - - Brand sponsorships
    - World Cup sponsor activations, offers, uniforms, sweepstakes
    - Per campaign / season
    - Confirmed with adidas for FIFA World Cup 2026
    - High if recurring, but no disclosed rates
    - Provide sponsor revenue, term length, and category exclusivity
  - - Technology / platform licensing
    - CX System hardware + software + content into other sites
    - Per install / license / service contract
    - Strategically described, not monetized publicly
    - 'Unknown: likely capital-light relative to venues'
    - Break out external licensing revenue and backlog
  - - Shared Reality entertainment programming
    - Premium dome-native film and special-event content
    - Per title / per screening
    - Live in market, but content economics opaque
    - 'Unknown: event exists, rights cost undisclosed'
    - Provide title-level rights costs and contribution margin
  notes: Observable streams are public; realized revenue mix, margins, and seasonality remain undisclosed and require management data.
