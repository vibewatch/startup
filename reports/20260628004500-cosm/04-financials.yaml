- id: capital-needs-and-financing
  title: Capital intensity and financing dependency
  body: 'The strongest public underwriting signal is not revenue but capital intensity. Texas filing records put the Grandscape project at 65,000 square feet and an estimated $42.5 million of privately funded construction cost, which implies about $654 per square foot before later upgrades, replacement capex, or central overhead. Dallas Innovates and Grandscape frame the dome as the core draw, reinforcing that the hardware-heavy venue is the product, not merely the shell around it. On the balance-sheet side, Cosm publicly announced over $250 million of funding in 2024, CNBC later reported $300 million raised to date by February 2025, and Sony added another $100 million in Series C capital in June 2026. CNBC also reported management was already considering another round depending on construction pace. That matters because Sony, Variety, and Sports Video Group each described an expansion pipeline that extends from Los Angeles and Dallas to Atlanta, Detroit, and Cleveland. Public evidence therefore
    supports a straightforward conclusion: Cosm has raised a lot of money, but the venue rollout still appears financing dependent, and the fetched record does not disclose current cash, debt, or burn.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI037
  - CI040
  - CI041
  - CI042
