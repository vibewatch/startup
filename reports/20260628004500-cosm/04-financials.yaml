callouts:
- calloutType: insight
  title: Observable upside is diversified, not single-stream
  body: Public evidence suggests Cosm is not relying on one monetization lever. The company can sell tickets, premium seating, group packages, private events, food and beverage, sponsorships, and potentially technology installs, which is strategically attractive if execution holds.
  claimRefs:
  - CI004
  - CI007
  - CI019
  - CI030
  - CI032
  - CI043
- calloutType: risk
  title: Capital adequacy is still the core diligence question
  body: Even after large fundraising rounds, the public record still lacks current cash, burn, debt, and venue-level profitability. That makes another raise easy to imagine but hard to price.
  claimRefs:
  - CI027
  - CI028
  - CI040
  - CI042
