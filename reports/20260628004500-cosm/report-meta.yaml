companyProfile:
  summary: Cosm is a Los Angeles-area private immersive entertainment, media, and technology company built from legacy dome and immersive-video businesses and now operating Shared Reality venues in Los Angeles, Dallas, and Atlanta. The company combines venue development, LED-dome presentation technology, media programming, and partner distribution around a communal no-headset format for live sports, film, and branded events. Public evidence shows meaningful strategic traction through a reported 2024 unicorn financing, a 2026 Sony-led strategic round, and major sports/media partnerships, but it still does not show the revenue, margin, attendance, or cap-table detail needed for full underwriting.
  foundedDate: '2020-01-01'
  founders:
    - name: Current-company founder roster not clearly disclosed in retained public sources
      role: Consolidation-era founding team not cleanly named
      background: Retained sources support a 2020 current-company founding narrative layered on top of older Evans & Sutherland, Spitz, LiveLikeVR, and C360 heritage, but they do not surface a clean founder roster for the present legal entity.
      claimRefs: [CO020, CO021]
  foundingLocation: Los Angeles area, California, US
  headquarters: Los Angeles metro area, California, US
  productSummary: Shared Reality immersive dome venues and the underlying CX System media/venue stack for live sports, entertainment, and branded experiences.
  customerFocus: Consumers attending premium shared-viewing events, leagues and media partners supplying programming, sponsors/brands activating around marquee events, and enterprise buyers booking private events.
  businessModel: Monetizes ticket sales, premium seating, food and beverage, sponsorship/activation packages, private events, and longer-term technology/media platform expansion tied to additional venues and partner distribution.
  stage: growth-stage private company
  fundingStatus: Reported July 2024 financing of more than $250 million at an approximately $1 billion mark was followed by Sony's $100 million Series C lead investment in June 2026, but the 2026 post-money valuation and ownership terms remain undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO011, CO020, CO021, CO022, CO025, CO036, CI040, CV007, CV035]
summary:
  headline: Cosm has enough strategic traction to stay on the watchlist, but the company is not yet publicly underwritable at a clean price because venue economics and Series C terms remain opaque.
