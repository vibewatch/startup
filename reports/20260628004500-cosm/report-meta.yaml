  topStrengths:
    - Real venue proof with three open sites by late June 2026 and two more publicly queued.
    - Strong partner and investor validation across Sony, FOX Sports/FIFA, the NBA, ESPN, adidas, and other marquee rights holders and sponsors.
    - Differentiated communal no-headset format backed by inherited dome, immersive-video, and venue-operations capabilities.
  topRisks:
    - Venue rollout is capital-intensive while site-level EBITDA, utilization, and rights-cost economics remain undisclosed.
    - Premium ticketing and mixed service reviews create uncertainty around repeat visitation and mass-market demand durability.
    - The 2026 Series C price, cap-table waterfall, and financing terms remain private, limiting valuation discipline.
  unresolvedGaps:
    - Exact 2026 Series C post-money valuation, ownership sold, and preference stack are not publicly disclosed.
    - Venue-level attendance, repeat visitation, food-and-beverage contribution, and EBITDA by site remain unverified.
    - Current headcount, audited revenue, debt facilities, and cash-burn profile are not publicly disclosed.
    - The exact legal headquarters / founding-entity history remains slightly messy across El Segundo, Los Angeles, and predecessor-company narratives.
appendices:
  - id: A
    title: Decision rules
    blocks:
      - type: list
        title: What would upgrade the call
        items:
          - Public disclosure of Series C pricing, dilution, and liquidation preference terms.
          - Site-level evidence that Los Angeles, Dallas, and Atlanta can sustain attractive utilization and EBITDA after rights and operating costs.
          - Clear proof that new venues and sponsor/media monetization are scaling faster than capex and operating complexity.
        claimRefs: [CV035, CV037, CV043]
      - type: list
        title: What would downgrade the call
        items:
          - A material undisclosed 2026 valuation step-up without matching revenue disclosure.
          - Evidence that premium pricing and operational friction are suppressing repeat demand.
          - Delays or economics slippage across Detroit, Cleveland, or later venue launches.
        claimRefs: [CV041, CV044, CR035]
disclaimer: This report synthesizes public sources for diligence triage only and is not investment advice. Cosm is privately held, several financial and governance details remain undisclosed, and volatile facts were refreshed against the canonical run date 2026-06-28.
