companyProfile:
  summary: >-
    Cosm is a Los Angeles-area private immersive entertainment, media, and technology company built from legacy dome and
    immersive-video businesses and now operating Shared Reality venues in Los Angeles, Dallas, and Atlanta. The company
    combines venue development, LED-dome presentation technology, media programming, and partner distribution around a
    communal no-headset format for live sports, film, and branded events. Public evidence shows meaningful strategic
    traction through a reported 2024 unicorn financing, a 2026 Sony-led strategic round, and major sports/media
    partnerships, but it still does not show the revenue, margin, attendance, or cap-table detail needed for full
    underwriting.
