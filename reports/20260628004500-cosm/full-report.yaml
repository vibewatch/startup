      - number: '3.2'
        title: Who wins on which job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              For a buyer seeking the most faithful communal simulation of a marquee sports or entertainment event,
              Cosm’s strongest public edge is that it already combines 87-foot, 12K+ domes with announced long-term NBA
              distribution and a 40-match FIFA World Cup 2026 package via FOX Sports. Sphere is formidable on venue
              spectacle and hospitality, but its public positioning is broader live entertainment and film eventization
              rather than sports-rights depth. IMAX and the PLF field remain mass-market “premium viewing” substitutes
              with huge installed distribution, yet their public evidence is still movie-theatre-centric and the sector
              is fragmenting as exhibitors roll out in-house formats to avoid paying IMAX economics. Meow Wolf wins on
              narrative walk-through immersion, all-ages and 21+ programming, and visible pass structures for repeat
              visitation. Topgolf wins on lower entry price, higher frequency, active participation, and free
              sports-viewing overlays. ARTECHOUSE and teamLab compete most for date-night, tourist, and premium-outing
              budgets. None of those adjacencies fully replicate the “best seat in the stadium without being there”
              promise, but each can siphon off a different slice of the same discretionary spend.
