      - number: '6.4'
        title: Experience Reception and Retention Proxies
        blocks:
          - type: paragraph
            body: >-
              Public reception is directionally positive on immersion and mixed on operating execution. CNET's
              first-person Harry Potter preview called the Shared Reality format captivating, enveloping, and communal,
              which is meaningful because it validates Cosm's thesis that the venue can monetize film fandom without
              relying on VR headsets or pure live sports. The app surfaces are another positive proxy: Apple's App Store
              listing highlights event discovery, seamless ticketing, and in-seat ordering, and carried a 4.9 out of 5
              rating from 124 reviews as of the May 2026 version. But the public complaint signal is real. TripAdvisor
              reviewers for Cosm Dallas repeatedly frame the concept as strong and the economics or operations as
              weaker, citing very high ticket prices, expensive food and beverage, seat-assignment confusion, slow water
              and food service, and poor follow-through from staff. That mix suggests Cosm's main risk to repeat
              visitation is not the core spectacle but whether premium pricing and service standards stay aligned.
              Publicly, there is no disclosed loyalty program, return-visit rate, season-pass product, or venue-level
              retention data, so app ratings and recurring programming are only weak proxies for real customer
              durability.
