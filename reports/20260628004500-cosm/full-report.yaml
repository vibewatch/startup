  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what public data still does not show
        blocks:
          - type: paragraph
            body: |2-
                              Public valuation evidence for Cosm is unusual because the company has two strong headline financing events but only one disclosed valuation anchor. In July 2024, Cosm and multiple third-party outlets converged on a strategic growth round of more than $250 million, with Reuters/Yahoo and the Los Angeles Business Journal putting the company at roughly a $1 billion valuation. Tracxn reinforced that framing by listing a July 31, 2024 Series B of $250 million at $1 billion post-money. That is enough to treat the 2024 unicorn mark as real public evidence rather than rumor.

                              The June 2026 Sony round is both stronger and weaker evidence. Stronger, because it is current, strategic, and came with governance: Sony led the Series C, wrote a $100 million check, took a minority stake, and placed Ravi Ahuja on the board. Weaker, because the retained sources still do not disclose the Series C post-money valuation, the percent ownership sold, the security type, or whether any secondary component sat inside the round. That means public evidence validates institutional appetite and strategic relevance, but it still does not let an outside investor underwrite the actual 2026 entry price.

                              The right conclusion is price-sensitive. A flat or near-flat continuation of the 2024 unicorn mark could be defensible. A meaningful 2026 step-up might still be possible, but it is not publicly underwritable today because the round mechanics remain opaque.
                          
            claimRefs:
