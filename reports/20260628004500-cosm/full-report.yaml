      - number: '6.3'
        title: Named Commercial Proof and Partner Proxies
        blocks:
          - type: paragraph
            body: >-
              Because Cosm does not publish a roster of named repeat corporate customers or venue-level consumer
              cohorts, the best public proof comes from partner and activation proxies. Those proxies are still useful
              because they reveal who is willing to pay to use the venue, supply content to it, or associate their brand
              with it. On the content side, Cosm's partnership surfaces and press releases tie the experience to FOX
              Sports and FIFA for World Cup coverage, the NBA for long-term live-game distribution, and Cirque du Soleil
              plus Warner/TNT-affiliated entertainment partnerships for non-sports programming. On the commercial side,
