      - number: '5.4'
        title: Differentiation, quality controls, and scalability risks
        blocks:
          - type: paragraph
            body: >-
              Cosm’s clearest differentiation is that it sits between theaters and VR rather than inside either
              category. Compared with theaters, it offers a 180-degree wraparound canvas, live-event capture tuned for
              courtside or pitch-side perspective, and a venue program built around group energy, hospitality, and
              branded merchandising. Compared with VR, it removes headsets, isolation, and single-user friction while
              still using immersive-capture tools behind the scenes. The main bottlenecks are therefore mostly systems
              and scale risks, not concept risk: venue rollout requires capital, construction, rights deals, GPU-heavy
              playback infrastructure, and resilient network paths; live sports programming depends on capture kits,
              synchronization, and partner feeds; and public disclosures are still thin on venue uptime, failure rates,
              and security or compliance detail. In short, the product is compelling and technically differentiated, but
              scaling it nationally or globally is closer to building a new broadcast-and-venue stack than opening
              another cinema chain. The rollout challenge is amplified by operator training needs and by the fact that
              every new venue has to coordinate content rights, building systems, and high-bandwidth live workflows at
              once.
