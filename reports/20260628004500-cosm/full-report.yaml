      - number: '5.3'
        title: Content capture, distribution, and inherited technology assets
        blocks:
          - type: paragraph
            body: >-
              Cosm’s current product set inherits real assets from four precursor businesses. Evans & Sutherland and
              Spitz contribute decades of dome structures, Digistar software, science-center relationships, and
              full-dome content libraries. LiveLikeVR, now Cosm Immersive, adds immersive distribution know-how that
              still reaches VR headsets and mobile apps even as the venue brand emphasizes no-headset attendance. C360
              adds ultra-high-resolution camera systems, computer vision, and CX Video Hub workflows that now operate in
              league-scale environments such as the NHL. That lineage matters strategically because Cosm is not starting
              from a clean slate: it can sell to planetariums and science centers, license prebuilt content, and reuse
              broadcast-grade capture and cloud workflows across sports, entertainment, and education. The trade-off is
              that the company must coordinate more businesses and content models than a simple theater operator or a
              pure software vendor. It also means the company can reuse engineering knowledge across planetariums,
              broadcast partners, and public venues instead of reinventing each workflow from scratch.
