        - Installed-base economics differ by exhibitor and many rival PLF brands are in-house
        - Broad reach keeps IMAX relevant, but the format is easier to comparison-shop.
      - - Meow Wolf
        - Denver general admission starts at $37; anytime at $51; annual pass at $84
        - Timed-entry tickets, passes, add-ons, group visits
        - Narrative art immersion, nighttime variants, merchandise/F&B discounts via pass
        - Pricing varies by city and date; retained pricing is from Denver only
        - Clear repeat-visit pricing creates a lower-spend but more frequent alternative to Cosm.
