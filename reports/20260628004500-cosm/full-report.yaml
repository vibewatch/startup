  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Shared Reality product definition and no-headset positioning
        blocks:
          - type: paragraph
            body: >-
              Cosm’s product is better understood as a repeatable Shared Reality operating model than as a single dome
              screen. On the consumer side, each venue bundles The Dome, The Hall, and The Deck, with ticketed seating,
              food-and-beverage service, and social viewing wrapped around a 12K x 10K LED display. On the B2B side, the
              same company sells CX System hardware and software plus Cosm Media production. That matters because the
              customer workflow is two-sided: fans buy a communal ‘best seat in the house’ alternative to traveling to a
              game or show, while rights holders, institutions, and partners buy a way to package premium immersive
              programming. The central thesis is no-headset immersion. Cosm repeatedly distinguishes Shared Reality from
              VR by keeping everyone in one room, and it distinguishes itself from theaters by making crowd energy,
              wraparound sightlines, and hospitality part of the product rather than just the content being projected.
