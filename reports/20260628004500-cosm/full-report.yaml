      - number: '2.4'
        title: Growth Drivers and Adoption Catalysts
        blocks:
          - type: paragraph
            body: >-
              Three demand drivers stand out. First, shared sports viewing remains a large behavior pool: Nielsen says
              Americans co-view television 47% of the time on average and sports co-viewing moves toward 50% around
              tentpole events, which supports the social occasion that Cosm is selling. Second, sponsors and rights
              holders want new monetization surfaces. Stats Perform reports that 70% of sports-media executives say
              sponsors now demand more digital content, while Mordor expects sponsorship and brand partnerships to
              outgrow the broader immersive market. Third, landlords and district developers increasingly want
              entertainment anchors that lift dwell time, cross-spend, and relevance outside game day. Deloitte's 2026
              sports outlook and CRE Daily's real-estate survey both point to year-round entertainment districts and a
              large pipeline of experiential space. That combination helps explain why Cosm is opening near major sports
              and mixed-use nodes rather than as a standalone technology showroom.
            claimRefs:
