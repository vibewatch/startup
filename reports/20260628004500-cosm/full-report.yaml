  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: The investment call runs from real strategic validation through disclosure gaps to a track-not-buy conclusion.
    data:
      nodes:
        - id: n1
          label: Real financing validation
          detail: 2024 $250M+ round and 2026 Sony $100M Series C confirm sponsor appetite.
          tone: positive
        - id: n2
          label: Strategic platform value
          detail: Sony board seat plus Fox/FIFA/adidas relationships create content-distribution optionality.
          tone: positive
        - id: n3
          label: Premium venue economics still private
          detail: Series C price, utilization, EBITDA, and waterfall terms remain undisclosed.
          tone: warning
        - id: n4
          label: Comp support is conditional
          detail: A flat $1B mark can be argued only if the lone public revenue estimate is directionally right.
          tone: warning
        - id: n5
          label: Step-up risk
          detail: Any hidden 2026 price step-up likely outruns the retained public-venue comp band.
          tone: negative
        - id: n6
          label: Recommendation
          detail: 'Track: interesting company, stretched price, more diligence required.'
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: supports
        - from: n2
          to: n3
          label: but does not replace
        - from: n3
          to: n4
          label: which makes
        - from: n4
          to: n5
          label: and increases
        - from: n5
          to: n6
          label: driving
    approximationNotes: >-
      This figure is a decision chain rather than a quantitative model; it emphasizes which missing disclosures block a
      higher-conviction buy call.
