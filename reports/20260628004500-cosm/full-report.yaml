  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Landscape and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Cosm is trying to scale a venue format that sits somewhere between cinema, sports bar, broadcast
              production facility, and themed attraction. Public sources show the company raised more than $250 million
              in 2024 at a $1 billion valuation and then added a $100 million Sony-led Series C in June 2026, but those
              rounds are being spent against a rollout model that independent coverage estimates at $50 million to $100
              million per venue. That matters because Cosm is no longer proving a single flagship concept: it already
              has three operating U.S. venues and is layering Detroit and Cleveland on top of a still-young operating
              base. Every new dome adds construction, food-and-beverage staffing, programming, broadcast operations,
              marketing, and local demand risk at the same time. The risk is not a short cash runway in the near term;
              it is capital efficiency. If individual venues take longer than expected to stabilize utilization, the
              company can still burn investor capital quickly while reporting visually impressive but economically
              incomplete growth. The risk register therefore starts with capital intensity, developer-timed opening
              schedules, and the need for premium ticketing plus high-margin hospitality to absorb fixed venue costs
              before the novelty curve fades.
            claimRefs:
