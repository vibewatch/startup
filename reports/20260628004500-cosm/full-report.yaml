            body: >-
              The cleanest public demand proof is the 2026 FIFA World Cup package. Cosm's World Cup landing pages market
              40 matches in each of Atlanta, Dallas, and Los Angeles, presale access for later-round inventory, and
              dedicated group booking with premium food and beverage. For the June 28, 2026 South Africa vs. Canada
              Round of 32 listing, the Los Angeles venue exposed Hall general admission at $12 and Dome reserved seating
              from $104 to $230, while Dallas exposed Hall general admission at $11 and Dome reserved seating from $110
              to $220. Both event pages cap self-serve purchase size at 15 seats, which reinforces Cosm's split between
              ordinary ticketing and higher-touch group or private-event sales. The buyer journey is explicit: discover
              the event through the homepage, venue page, or partner announcement; choose between Dome reserved seating,
              Hall reserved seating, or general admission; handle parking or access logistics; and then upsell into
              food, beverages, and seat-delivery through the app or table service. That combination is important because
              Cosm is not only selling the screen. It is bundling premium positioning, onsite spend, and occasion-based
              booking into a single visit. Cross-city programming also matters as a repeat-demand proxy: Atlanta opened
              in June 2026 around NBA Finals viewing and immediately layered in World Cup inventory, while the same
              network continues to market Los Angeles and Dallas as premium sports destinations.
