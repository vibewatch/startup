      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Cosm looks more like a capital-intensive venue network with software and sponsorship upside
              than a lightly capitalized content startup. The upside case is visible: multiple revenue levers, premium
              price positioning, hospitality attach, pre-sold deposits, strategic investors, and a platform that may
              eventually monetize outside company-owned venues. The challenge is that nearly every underwriting-critical
              metric is still missing from public evidence. We do not have current cash, monthly burn, venue-level
              attendance, realized ARPU, per-cap food and beverage, sponsor economics, rights costs, or a directly
              fetched post-Series C valuation marker. Even some official capacity disclosures vary by page section,
              which is manageable for strategy work but weak for precise financial modeling. The adverse customer review
              does not disprove product-market fit, yet it is a reminder that premium-ticket economics are fragile if
              service, lines, or sightlines disappoint. Netting it out, public evidence supports a premium-experience
              thesis and a heavy capital-needs thesis, but not a full underwriting thesis. The next diligence step is to
              obtain venue-level P&Ls and treasury data before taking valuation comfort from brand momentum alone.
