chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Corporate Footprint
        blocks:
          - type: paragraph
            body: >-
              Cosm is best described as a private immersive-entertainment platform that sells both fan-facing venue
              experiences and the technology stack that makes those experiences possible. Its own materials describe the
              company as an immersive entertainment, media, and technology business whose Shared Reality format gives
              audiences a communal, headset-free way to feel courtside, pitchside, or inside a film or art experience.
              The operating model is therefore broader than a dome venue alone: Cosm says it handles physical design,
              engineering, manufacturing, software, audiovisual systems, operations, media, and venue programming.


              The company also leans heavily on inherited technical depth. Official history pages say the current
              platform fuses Evans & Sutherland, Spitz, LiveLikeVR, and C360, which together provide legacy dome
              hardware, planetarium software, immersive capture, and live-event distribution capabilities. That helps
              reconcile two otherwise different identity narratives in public sources: some coverage calls Cosm a
              2020-founded startup, while Cosm itself frames the business as a newer operating company built on roughly
              75 years of predecessor know-how. Both statements can be true if the modern company emerged in 2020 while
              its component businesses are much older.


              Location language is less tidy. Cosm’s own companies page lists a corporate office in El Segundo,
              California, while third-party profiles call it Los Angeles-based and July 2024 local business coverage
              called it Playa Vista-based. The safest synthesis for later chapters is that Cosm is headquartered in the
              Los Angeles metro area, with an official corporate office at 888 N Douglas Street in El Segundo and some
              older or shorthand sources using broader Los Angeles or Playa Vista labels. That discrepancy is material
              enough to keep as an explicit diligence gap rather than forcing a single unsupported label.
