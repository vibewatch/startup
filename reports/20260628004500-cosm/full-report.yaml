  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Cosm’s observable financial model is venue-led and multi-stream rather than purely ticket-led. Official
              pages show public ticketed events in Los Angeles and Dallas, with additional monetization from group
              packages, private screenings, full private events, food and beverage, and brand sponsorships. The official
              group pages are especially useful because they expose the packaging logic: general admission, reserved
              Dome booths, reserved Hall tables, all-inclusive bundles for 20 to 100 guests, field-trip discounts, and
              private screenings for up to 400 attendees. Private-event pages then widen the revenue ladder to
              full-space rentals and full-venue buyouts, with a 50% nonrefundable deposit that likely helps near-term
              working capital. The sponsorship layer is no longer theoretical: the adidas World Cup 2026 deal explicitly
              ties ticket-linked offers, branded activations, employee uniforms, and sweepstakes to venue traffic.
              Finally, WIRED and Cosm Technology suggest a second business line around platform licensing or managed
              installations, but public revenue mix across venue operations versus technology remains undisclosed.
