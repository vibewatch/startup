  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Cosm's direct market is not all immersive entertainment and it is not generic sports media. The closest
              boundary is premium out-of-home shared-reality viewing and event venues that monetize ticketed attendance,
              food and beverage, merchandise, sponsorship activation, and group/private-event demand around marquee live
              sports and entertainment. Cosm's own surface area shows that its venues package major sports, films, art,
              and group events inside large LED domes and adjacent social spaces, with explicit pathways for ticket
              purchases and event planning. What should be excluded is equally important: home viewing subscriptions,
              standard movie exhibition, ordinary sports bars without immersive infrastructure, and the full global pool
              of sports rights spending. Those categories influence demand and partner economics, but they are not
              Cosm's direct revenue boundary. The practical substitute set is therefore premium communal viewing at
              theaters, sports bars, family entertainment centers, and other experiential venues competing for the same
              night-out wallet and time allocation.
            claimRefs:
              - CM001
