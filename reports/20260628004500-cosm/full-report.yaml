  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Typical Cosm path from event discovery to premium upsell and the point where repeat-visit evidence currently goes
      dark.
    data:
      items:
        - label: Discovery
          detail: >-
            Fans or planners discover Cosm through marquee IP, league partnerships, venue pages, brand activations, or
            local destination partners such as Hollywood Park and Grandscape.
          touchpoints:
            - World Cup / NBA / Harry Potter announcements
            - Homepage and venue calendars
            - FOX Sports and partner press
            - Grandscape / Hollywood Park venue context
        - label: Qualification
          detail: >-
            Buyers decide whether they want a premium Dome experience, a Hall table, general admission, a 10+ group
            package, or a private event inquiry.
          touchpoints:
            - Dome reserved vs Hall reserved vs GA
            - Group threshold at 10+
            - Private-event inquiry path
        - label: Purchase
          detail: >-
            Single-event buyers use self-serve checkout; larger parties are redirected toward group sales; later-round
            World Cup inventory also uses presale capture.
          touchpoints:
            - Self-serve event checkout
            - Presale signup for later rounds
            - Group-sales contact form
        - label: Arrival
          detail: >-
            Parking and access logistics vary by venue, with Dallas offering free Grandscape parking and Los Angeles
            relying on validated Hollywood Park parking.
          touchpoints:
            - Free Dallas parking
            - LA validation policy
            - Destination-district arrival near stadiums and retail
        - label: On-site monetization
          detail: >-
            Once inside, Cosm tries to convert the visit into a broader spend moment through F&B, in-seat ordering,
            premium tables, merchandise, and branded activations.
          touchpoints:
            - In-seat ordering via app
            - Premium catering and group packages
            - Sponsor and activation surfaces in Dome/Hall/Deck
        - label: Post-event outcome
          detail: >-
            Positive immersion can drive sharing and a second visit, but public retention evidence stops here and
            adverse review risk can interrupt the loop.
          touchpoints:
            - App rating and customer reviews
            - TripAdvisor complaints on price/service
            - No public repeat-visit or loyalty data
    approximationNotes: >-
      Journey stages are synthesized from official event, group-sales, private-event, app, and review surfaces fetched
      on 2026-06-28; Cosm does not publish a formal funnel.
    claimRefs:
      - CU006
      - CU007
      - CU013
      - CU014
      - CU019
      - CU020
      - CU025
      - CU038
      - CU039
      - CU041
