      - number: '2.5'
        title: Constraints, Contradictions, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption risk is that experiential demand does not automatically translate into attractive venue
              economics. Industry sources repeatedly flag high upfront cost, limited scalability, regulation, content
              refresh burden, and safety or privacy compliance as structural friction for LBE. McKinsey also notes that
              smaller location-based projects tend to run at slimmer margins than destination parks or mature family
              entertainment centers. The substitute base is formidable: scaled incumbents such as AMC, IMAX, and Dave &
              Buster's already serve premium out-of-home occasions through thousands of screens or hundreds of venues,
              while home streaming, high-end TVs, and social highlights absorb part of the same demand. Public
              comparables are also messy; for example, Topgolf is no longer a clean listed venue comp after Callaway
              re-centered around golf equipment. The largest remaining gap is private: Cosm does not publicly disclose
              venue-level pricing, utilization, F&B mix, or sponsorship contract values, so any public SOM model is
              necessarily illustrative rather than underwritten.
            claimRefs:
              - CM019
              - CM020
              - CM024
              - CM033
              - CM034
              - CM035
              - CM039
              - CM040
              - CM041
