  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Cosm scores well on strategic proof and partner traction but poorly on disclosure completeness and valuation
      clarity.
    data:
      items:
        - label: Strategic capital quality
          value: 8/10
          detail: Sony, Mirasol, Baillie Gifford, and sports-owner capital are meaningful signals.
          tone: positive
        - label: Footprint proof
          value: 7/10
          detail: Three open venues by run date with more expansion queued.
          tone: positive
        - label: Partner traction
          value: 7/10
          detail: FOX/FIFA/adidas and earlier ESPN/NBA-style relationships are visible.
          tone: positive
        - label: Revenue visibility
          value: 3/10
          detail: Only one low-transparency public revenue estimate was retained.
          tone: warning
        - label: Unit economics visibility
          value: 2/10
          detail: No public venue-level EBITDA, utilization, or rights-cost disclosures.
          tone: warning
        - label: Cap-table visibility
          value: 1/10
          detail: Series C price, waterfall, and preference stack remain private.
          tone: warning
        - label: Valuation support at entry
          value: 4/10
          detail: Flat 2024 unicorn pricing may be arguable; a 2026 step-up would likely look stretched.
          tone: warning
    approximationNotes: >-
      These are IC-facing judgment scores synthesized from retained evidence; they are not a statistical model and
      should not be mistaken for management guidance.
