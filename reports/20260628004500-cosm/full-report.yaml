      - number: '3.4'
        title: Durability verdict
        blocks:
          - type: paragraph
            body: >-
              The durability call is therefore mixed but not bearish. Cosm has a more defensible position than
              art-installation venues or social-play chains when the buyer specifically wants premium live-event
              realism, and the NBA plus FIFA/FOX disclosures show that the company already has proof points that many
              immersive-adjacent venues do not. At the same time, adverse evidence matters. Sphere’s pricing backlash
              shows the upper bound of how quickly premium spectacle can start to feel exclusionary, while Screendaily’s
              reporting on PLF fragmentation suggests venue operators and exhibitors keep hunting lower-cost ways to
              approximate “premium” without sharing economics with a dominant provider. Cosm can still win if it keeps
              rights, programming, and location selection ahead of the field, but public evidence is thinner on
              repeat-demand economics, exact content-rights exclusivity, and whether the >100-site ambition translates
              into disciplined expansion rather than category overbuild. For underwriting, that means treating Cosm as a
              differentiated premium-viewing platform today, but not yet a company whose hardware layer alone creates
              winner-take-most protection.
