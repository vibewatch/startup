  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment Mix and Buyer Types
        blocks:
          - type: paragraph
            body: >-
              Cosm's direct customers are attendees and event buyers rather than enterprise software accounts. Official
              surfaces and venue pages show a broad but clearly premium-leaning mix: sports fans buying Shared Reality
              tickets for marquee live events; film and entertainment fans buying immersive screenings such as Harry
              Potter; social buyers organizing birthdays, field trips, and family outings; corporate and private-event
              planners booking full or partial venue takeovers; and brands or rights-holders using the venue for
              activations and content distribution. The Dallas and Los Angeles audience base is not identical.
              Placer.ai's 2026 venue-level audience analysis says Cosm Dallas over-indexes on Ultra Wealthy Families and
              Young Professionals, while Cosm Los Angeles pulls more Educated Urbanites and Ultra Wealthy Families
              within a region whose broader entertainment demand is anchored by Near-Urban Diverse Families. That makes
              Cosm look less like a mass-market theater and more like a premium out-of-home entertainment product whose
              buyer mix depends on affluent households, destination-entertainment traffic, and monetizable group
              occasions. Importantly, the same public pages that market tickets also market group sales and private
              events, implying Cosm treats B2C attendance and B2B venue monetization as parallel customer channels
              rather than separate businesses.
            claimRefs:
