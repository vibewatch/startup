          label: Cosm operating core
          type: hub
        - id: d2
          label: Rights holders and leagues
          type: partner
          risk: Without rights access, capture and venue hardware have nothing premium to show.
        - id: d3
          label: Capture kits and C360 workflows
          type: technology
          risk: High-resolution capture and synchronization are essential for the courtside illusion.
        - id: d4
          label: AWS and network transport
          type: infrastructure
          risk: Bandwidth, failover, and venue backhaul determine whether live events stay synchronized.
        - id: d5
          label: Dell and NVIDIA render stack
          type: infrastructure
          risk: GPU-heavy playback raises cost, supply, and operational complexity.
        - id: d6
          label: Construction and venue power / HVAC
          type: physical
          risk: Each new site is a building project, not merely a software deployment.
        - id: d7
          label: Studios, creators, and licensed IP
          type: content
          risk: Entertainment breadth depends on partner willingness to adapt content to the dome.
