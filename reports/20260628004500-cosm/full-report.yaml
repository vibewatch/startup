  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacent venues, and imperfect substitutes'
        blocks:
          - type: paragraph
            body: >-
              Cosm should be underwritten against several different competitor classes rather than a single “immersive
              venue” bucket. The closest direct peer is Sphere: both sell premium, reserved, ticketed experiences inside
              purpose-built immersive venues and position the screen environment itself as the product. IMAX and other
              premium large-format cinema brands are the next most important substitute because they train audiences to
              pay more for better sightlines and audio, but they do not recreate Cosm’s shared-reality bowl,
              league-specific capture angles, or hospitality-heavy dwell model. Meow Wolf, ARTECHOUSE, and teamLab
              compete for experiential leisure spend, tourism time, and social-media-friendly group outings, yet their
              core product is exploratory art immersion rather than live sports or appointment viewing. Topgolf sits in
              another adjacent lane: it is a lower-price, high-frequency social venue with food, drink, private events,
              and free match-day viewing, so it competes for watch-party and group-event dollars even though it is
              participatory rather than cinematic. The net effect is that many substitutes are imperfect, which helps
              Cosm, but also increases multi-homing: consumers can visit Sphere, Topgolf, and Meow Wolf in the same year
              without “switching” permanently away from Cosm.
