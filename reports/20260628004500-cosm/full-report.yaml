    rows:
      - - Immersive capture layer
        - Captures high-resolution, multi-angle event footage through Cosm kits and C360 systems
        - Venue access, camera placement, tracking data, and operator crews
        - Capture quality or installation variance can break the illusion before production starts
      - - Cloud ingest and transport layer
        - Moves live feeds through SRT, MediaConnect, S3, and Direct Connect-backed delivery paths
        - AWS services, bandwidth, region failover, and network timing
        - High-resolution workflows create heavy transport and storage demands
      - - REMI production and compositing layer
        - Builds the 180-degree show and combines immersive feed with broadcast storytelling elements
        - Playa Vista production rooms, CX Pro, and rights-cleared broadcast elements
        - More moving parts than ordinary arena or cinema playback
      - - Render and control layer
        - Uses Dell and NVIDIA infrastructure to decode, render, and synchronize dome and hall outputs
        - GPU availability, driver stability, distributed-render orchestration, and operator tooling
        - Performance headroom and recovery complexity rise as venues and content formats expand
      - - Display and audio layer
        - Turns synchronized media into a matte-black LED dome and spatial-audio experience
        - Panel calibration, pixel mapping, audio tuning, and venue maintenance
        - Hardware faults or drift are hard to hide at dome scale
      - - Rights and content operations layer
        - Determines what can be shown, where, and in what format
        - Leagues, studios, creators, licensors, and venue programming teams
        - Technical readiness does not matter if rights windows or partner approvals fail
    notes: >-
      This table focuses on the hot-path architecture for live and recurring immersive programming rather than every
      corporate system at Cosm.
