  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: venue-unit-economics
    missingEvidence: Per-venue payback period, same-store margin, occupancy, repeat-visit rate, and hospitality attach-rate disclosures.
    whyItMatters: Capital intensity is the dominant risk; without site-level economics, expansion pace can look strong while returns degrade.
    diligencePath: Request site-level operating dashboards for Los Angeles, Dallas, and Atlanta plus underwriting assumptions for Detroit and Cleveland.
    relatedQuestionRefs:
    - QR008
    - QR019
    - QR020
  - type: missing-source
    severity: material
    topic: rights-economics
    missingEvidence: Minimum guarantees, renewal timing, exclusivity scope, and revenue-share terms for top league and studio partnerships.
    whyItMatters: Premium demand depends on marquee content, but the public record does not reveal whether rights costs scale faster than ticket yield.
    diligencePath: Review major rights contracts or management summaries covering World Cup, NBA, and top studio partnerships.
    relatedQuestionRefs:
    - QR011
    - QR012
  - type: enumeration-incomplete
    severity: material
    topic: venue-compliance-matrix
    missingEvidence: A venue-by-venue matrix of permits, liquor licenses, accessibility audits, complaint counts, and local operating conditions.
    whyItMatters: The public legal risk picture is only partial; site-specific issues can disrupt openings or premium customer trust.
    diligencePath: Compile local compliance packages for LA, Dallas, Atlanta, Detroit, and Cleveland before approving further rollout capital.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: lease-and-development-terms
    missingEvidence: Lease duration, rent escalators, landlord revenue shares, build-out obligations, termination rights, and milestone remedies for major sites.
    whyItMatters: Developer concentration is visible publicly, but the contractual downside if a district underperforms or a site slips is not.
    diligencePath: Review core real-estate agreements and change-order exposure for Bedrock, Centennial Yards, Hollywood Park, and Grandscape.
    relatedQuestionRefs:
    - QR004
    - QR023
    - QR024
