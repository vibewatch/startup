- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Venue capex outruns demand
    - New-site opening cadence versus disclosed repeat visitation or membership traction
    - Detroit or Cleveland opens without any public same-store retention / repeat-visit evidence from existing domes
    - Treat expansion as capital consumption, not proof of scale; require unit-economics diligence before underwriting more growth
  - - Rights-cost squeeze
    - Major rights renewal or new premium-event expansion
    - Cosm adds more marquee rights without showing higher ticket yield or hospitality attach rates
    - Assume gross-margin pressure and stress-test financing needs
  - - Developer / landlord slippage
    - Construction and planning milestones in Detroit and Cleveland
    - Opening slips by more than two quarters or key approvals are re-opened
    - Reduce confidence in rollout model and re-underwrite site-level payback
  - - Price resistance / novelty fade
    - Review mix, visible discounting, or premium-seat sell-through
    - Persistent review complaints on price-value mismatch or a shift toward cheaper hall inventory
    - Downgrade repeatability of the premium dome thesis
  - - Operational reliability erosion
    - Public glitch/service complaints or event disruptions
    - Multiple well-documented service or sync failures around tentpole events
    - Assume premium pricing ceiling falls before venue count can scale
  - - Consumer-protection or accessibility action
    - Refund disputes, hidden-fee scrutiny, or ADA complaints
    - Formal complaint pattern or enforcement inquiry tied to a venue or presale
    - Escalate legal diligence and treat brand trust as a gating risk for new-city launches
  notes: Kill criteria are investor-authored monitoring thresholds derived from public evidence; Cosm has not disclosed these thresholds itself.
