company:
  name: Cosm
chapter:
  number: 7
  title: Risks
  summary: 'Cosm''s risk profile is dominated by capital-intensive venue rollout layered on top of heavy dependence on premium content rights, developer-controlled real estate, and operationally complex proprietary technology. Three themes stand out: each new venue appears to require tens of millions of dollars of capex and local-developer execution; the marquee programming that justifies premium pricing depends on leagues, broadcasters, and studios that can renegotiate terms; and customer reviews already show price sensitivity, service disruption, and immersion trade-offs that could cap repeat visits before venue density improves. None of these risks make the concept unworkable, but together they create a narrow path in which rollout speed, rights economics, and consumer conversion must all hold at once.'
sections:
- id: ranked-risk-landscape
  title: Severity-Ranked Risk Landscape and Capital Intensity
  body: 'Cosm is trying to scale a venue format that sits somewhere between cinema, sports bar, broadcast production facility, and themed attraction. Public sources show the company raised more than $250 million in 2024 at a $1 billion valuation and then added a $100 million Sony-led Series C in June 2026, but those rounds are being spent against a rollout model that independent coverage estimates at $50 million to $100 million per venue. That matters because Cosm is no longer proving a single flagship concept: it already has three operating U.S. venues and is layering Detroit and Cleveland on top of a still-young operating base. Every new dome adds construction, food-and-beverage staffing, programming, broadcast operations, marketing, and local demand risk at the same time. The risk is not a short cash runway in the near term; it is capital efficiency. If individual venues take longer than expected to stabilize utilization, the company can still burn investor capital quickly while reporting
    visually impressive but economically incomplete growth. The risk register therefore starts with capital intensity, developer-timed opening schedules, and the need for premium ticketing plus high-margin hospitality to absorb fixed venue costs before the novelty curve fades.'
