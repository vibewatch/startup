- id: technical-and-operational-risk
  title: Technology Reliability and Operating-Complexity Risk
  body: 'Cosm markets itself as a full-stack immersive platform, not a lightweight content reseller. The careers page says the company handles physical design, engineering, manufacturing, software, display engines, and content, while the companies page shows that key technical capabilities were assembled through Evans & Sutherland, Spitz, LiveLikeVR, and C360. Vertical integration gives Cosm differentiation, but it also creates a large operational surface area. SiliconANGLE''s interview with the company''s technology chief describes Dell infrastructure, Nvidia GPUs, and roughly 50 machines driving a single giant dome, with resiliency described as mission-critical for live events. Sports Video Group shows that C360 can run reliably at league scale for the NHL, which is a real positive signal, but the same source highlights just how data-heavy and coordination-intensive the workflow is. Customer evidence suggests the public venue experience is not yet frictionless: one favorable Archer review
    still noted occasional glitches and delayed sound, and multiple Tripadvisor complaints focus on service interruptions that break immersion. Operationally, the risk is not only a catastrophic outage. It is the accumulated effect of latency, seat service, staffing mistakes, and content-switching complexity eroding the premium feel that the pricing architecture depends on.'
