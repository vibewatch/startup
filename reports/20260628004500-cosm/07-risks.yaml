callouts:
- calloutType: risk
  title: Capital Intensity Is the Core Risk, Not Near-Term Liquidity
  body: Public funding has been abundant, but independent coverage still implies a $50 million to $100 million venue build cost and a premium-service operating model. The key question is whether each dome becomes cash-efficient before the next wave of sites opens.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR007
  - CR008
  - CR041
- calloutType: risk
  title: The Product Is Only as Defensible as Its Rights Calendar
  body: World Cup, NBA, and film/studio partnerships create real differentiation, but they also mean Cosm must keep renewing scarce programming on workable economics. If the rights stack becomes more expensive before repeat visitation is proven, margin pressure will surface quickly.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR044
- calloutType: risk
  title: Customer Reviews Already Show the Novelty Premium Has Limits
  body: Reviews praise the spectacle but also document service lapses, interruptions, and price-value objections. Those signals matter because the model needs guests to pay premium prices more than once, not merely sample the concept once for curiosity.
  claimRefs:
