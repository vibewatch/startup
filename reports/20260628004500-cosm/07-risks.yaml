- id: mitigations-and-thesis-breaks
  title: Mitigations, Monitoring, and Thesis-Break Criteria
  body: 'The encouraging part of Cosm''s risk profile is that several of the highest-value uncertainties are monitorable. Investors do not need to guess whether the rollout is healthy: new venue opening dates, pricing depth for tentpole events, repeat-visit and membership disclosures, developer timelines, and the cadence of new rights deals all provide observable signals. Likewise, the technical stack can be judged through the mix of live-event partners, the stability of public reviews, and whether the company keeps extending shared-reality distribution into league-standardized workflows rather than one-off showpieces. The difficult part is that several thesis-break conditions interact. If rights costs rise while ticket resistance hardens and a developer-tied opening slips, the company can face margin compression and delayed payback simultaneously. The right mitigation posture is therefore conservative: treat new rights, new cities, and new capex as needing evidence of repeatable unit economics,
    not just proof of demand at launch. The investment case improves meaningfully if Cosm starts disclosing repeat visitation, demonstrates stable service quality under premium pricing, and opens Detroit/Cleveland on time without visibly diluting content quality or operational standards.'
