- id: regulatory-landlord-and-execution-risk
  title: Regulatory, Landlord/Developer, and Execution Risk
  body: 'Cosm currently appears to have less direct public litigation or enforcement baggage than many consumer startups, but that should not be mistaken for low regulatory exposure. The company operates venues that mix ticketing, alcohol service, hospitality, accessibility obligations, data capture, and nationally marketed events. DOJ guidance confirms ADA Title III applies to businesses open to the public, including restaurants, hotels, and movie theaters, all of which overlap with venue functions that Cosm advertises. Wilson Sonsini''s 2026 consumer-protection outlook also indicates the FTC is expected to enforce the hidden-fee rule that already took effect for live-event ticketing, making checkout, refund, and price-presentation discipline more important as Cosm leans into presales and premium event packages. The real estate side adds another layer: Atlanta depends on Centennial Yards'' district buildout, while Detroit and Cleveland rely on Bedrock-controlled sites tied to Dan Gilbert''s
    broader sports-and-real-estate ecosystem. That overlap can be helpful when aligned, but it concentrates schedule risk, site-design risk, and local political risk in a handful of counterparties. If any developer phase slips, the content calendar and staffing plan have to adjust around assets Cosm does not fully control.'
