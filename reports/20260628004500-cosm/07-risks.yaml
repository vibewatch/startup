- id: content-demand-and-substitute-risk
  title: Content Licensing, Demand Quality, and Substitute Risk
  body: 'The commercial proposition works only if Cosm keeps winning scarce, premium programming that consumers cannot replicate at home or in a conventional venue. Official and partner sources show real traction: World Cup 2026 coverage across three cities, NBA rights through 2030 and beyond, and a broad programming slate spanning sports, experiential cinema, Cirque du Soleil, and creator-led content. But those same sources make clear that the business is rights-dependent. Front Office Sports reports that deals already use a mix of fee-based and revenue-sharing structures, meaning rights costs can rise before attendance is fully proven. At the consumer layer, the pricing envelope is wide: entry points can be single digits for standing-room experiences, while premium events can exceed $200 and some independent reviews cite much higher World Cup asks. Customer reviews show that the experience can still be compared against pubs, home viewing, IMAX, or Sphere-style spectacle instead of being
    treated as a category of one. That is a classic novelty risk: Cosm must keep the content calendar exclusive enough to justify premium pricing while also delivering an operational experience strong enough that visitors choose to come back rather than merely trying it once.'
