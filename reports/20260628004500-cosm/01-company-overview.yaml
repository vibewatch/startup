- id: venue-rollout-milestones
  title: Venue Rollout, Partnerships, and Public-Market Feedback
  body: >-
    By the canonical 2026-06-28 run date, Cosm has moved beyond concept status into an operating venue
    network. Los Angeles opened first at Hollywood Park in Inglewood in mid-2024, followed by Dallas at
    Grandscape in The Colony in late August 2024. Atlanta opened on June 10, 2026 at Centennial Yards,
    giving Cosm a third operating site just ahead of FIFA World Cup activity. Detroit is the fourth venue
    in development near Cadillac Square and Campus Martius, while Cleveland is officially marketed for
    a 2027 opening across from Rocket Arena. The operational footprint is therefore three live public
    venues with two additional U.S. sites in the announced pipeline.


    Partnership evidence is now broad enough to matter strategically. Official and partner-issued materials
    verify a 40-match FIFA World Cup 2026 program with FOX Sports across Los Angeles, Dallas, and Atlanta,
    an adidas venue-sponsorship program for the same World Cup presentation, a long-term NBA partnership
    announced in 2025, an ESPN package covering NBA/NHL/CFP/U.S. Open/select UFC, and an NBC Sports tie-up
    referenced by CNBC-branded Cosm content. Programming pages also show breadth beyond one league or
    one sport, with NBA Finals, UFC, MLB All-Star, Harry Potter, The Matrix, Cirque du Soleil, and other
    shared-reality experiences in the mix.


    The main adverse signal in reviewed public coverage is not legal or regulatory; it is market-proof
    opacity. Dallas Observer’s early review called the Dallas venue a “huge hit” but still “more a triple
    than a home run,” suggesting the consumer wow factor is proven while repeatability, pricing power,
    and mainstream habit formation remain open. Without disclosed attendance, utilization, or profitability
    metrics, that skepticism cannot yet be resolved quantitatively.
