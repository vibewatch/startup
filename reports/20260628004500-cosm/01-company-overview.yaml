company:
  name: Cosm
chapter:
  number: 1
  title: Company Overview
  summary: Cosm is a Los Angeles-area private immersive entertainment, media, and technology company built
    from legacy dome and immersive-video businesses, now operating public venues in Los Angeles, Dallas,
    and Atlanta. The strongest public evidence is the July 2024 >$250M financing round at a reported $1B
    valuation and the rapid rollout of World Cup-, NBA-, and broadcaster-backed programming; the weakest
    evidence is on economics, with revenue, headcount, customer metrics, and current valuation still undisclosed.
sections:
- id: identity-business-model
  title: Identity, Product, and Corporate Footprint
  body: >-
    Cosm is best described as a private immersive-entertainment platform that sells both fan-facing venue
    experiences and the technology stack that makes those experiences possible. Its own materials describe
    the company as an immersive entertainment, media, and technology business whose Shared Reality format
    gives audiences a communal, headset-free way to feel courtside, pitchside, or inside a film or art
    experience. The operating model is therefore broader than a dome venue alone: Cosm says it handles
    physical design, engineering, manufacturing, software, audiovisual systems, operations, media, and
    venue programming.


    The company also leans heavily on inherited technical depth. Official history pages say the current
    platform fuses Evans & Sutherland, Spitz, LiveLikeVR, and C360, which together provide legacy dome
    hardware, planetarium software, immersive capture, and live-event distribution capabilities. That
    helps reconcile two otherwise different identity narratives in public sources: some coverage calls
    Cosm a 2020-founded startup, while Cosm itself frames the business as a newer operating company built
    on roughly 75 years of predecessor know-how. Both statements can be true if the modern company emerged
    in 2020 while its component businesses are much older.


    Location language is less tidy. Cosm’s own companies page lists a corporate office in El Segundo,
    California, while third-party profiles call it Los Angeles-based and July 2024 local business coverage
    called it Playa Vista-based. The safest synthesis for later chapters is that Cosm is headquartered
    in the Los Angeles metro area, with an official corporate office at 888 N Douglas Street in El Segundo
    and some older or shorthand sources using broader Los Angeles or Playa Vista labels. That discrepancy
    is material enough to keep as an explicit diligence gap rather than forcing a single unsupported label.
  claimRefs:
  - CO001
  - CO002
  - CO003
