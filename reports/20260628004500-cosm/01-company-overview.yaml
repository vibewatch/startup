- id: leadership-governance
  title: Leadership Team, Board Signals, and Key-Person Dependence
  body: >-
    Leadership is one of the more supportable parts of the public record because Cosm’s official team
    payload exposes a named executive roster. Jeb Terry Jr. is President and CEO, and independent biography
    material from the Milken Institute corroborates both his current role and his background as a former
    NFL player and former FOX Sports executive. The same official payload names Peter McPhee as CFO, Devin
    Poolman as Chief Product & Technology Officer, Kirk Johnson as COO and GM of Evans & Sutherland, Katie
    Laclette as Chief People Officer, Jeff Hughes as President of Sports & Entertainment, David Ho as
    Chief Legal Officer, and Stephen T. Winn as board chairman. Dallas Innovates independently corroborated
    Winn’s chairmanship at the Dallas preview event.


    That said, governance disclosure is still thinner than the executive roster suggests. Reviewed sources
    did not surface a fuller board list, committee structure, or independent-director lineup beyond Winn,
    and no public debt or secondary-share disclosures turned up alongside the funding coverage. For diligence
    purposes, Terry appears to be the central operating spokesperson and commercialization lead, while
    Winn represents the most visible board-level figure. The combination of a public leadership roster
    and limited broader governance detail creates a meaningful key-person dependency risk: investors can
    see who runs the company day to day, but not yet how deep the board bench or institutional control
    structure is.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
