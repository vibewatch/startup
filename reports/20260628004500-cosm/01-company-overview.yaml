  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: A management-confirmed statement reconciling the El Segundo corporate-office address
      with third-party descriptions of Cosm as Los Angeles-based or Playa Vista-based.
    whyItMatters: Later chapters should not propagate a false headquarters label into market, hiring,
      or competitive analysis.
    diligencePath: Request legal-entity filings, lease details, and management confirmation of the canonical
      headquarters label used in board materials.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A refreshed valuation source after the July 2024 round, such as a 409A, board deck,
      term sheet, or secondary transaction summary.
    whyItMatters: The only public valuation mark is a reported 2024 unicorn valuation, which may not reflect
      June 2026 fair value.
    diligencePath: Request the most recent financing documents, 409A, and any marked-to-market investor
      letters.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, ARR, attendance, repeat visitation, venue utilization, and contribution-margin
      data for Los Angeles, Dallas, and Atlanta.
    whyItMatters: Without core operating metrics, it is impossible to underwrite the economics of the
      venue rollout or benchmark public skepticism.
    diligencePath: Request a KPI pack, board materials, and venue-level P&Ls for the last twelve months.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full board roster, committee structure, and disclosure on debt facilities or secondary-share
      activity.
    whyItMatters: Governance depth and financing complexity affect control risk, future dilution, and
      downside protection.
    diligencePath: Request capitalization tables, debt schedules, board lists, and investor-rights summaries.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: partnership-roster
    missingEvidence: A canonical partner roster from Cosm or counterparties that reconciles which league,
      broadcaster, and brand relationships are active, announced, or expired.
    whyItMatters: Seed facts referenced a broader partner set than could be directly verified from retained
      sources.
    diligencePath: Request current partner one-pagers or rights summaries from business development leadership.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table public chronology coverage
    missingEvidence: A management-supplied milestone list covering private governance changes, any undisclosed
      financings, and venue-level commercial milestones not captured in public reporting.
    whyItMatters: The published chronology is strong on public announcements but may miss private milestones
      that shaped execution and capital planning.
    diligencePath: Request an internal company timeline and board-approved milestone tracker to reconcile
      against the public chronology.
    relatedQuestionRefs:
    - QO014
    - QO026
    relatedTableRefs:
    - TO004
