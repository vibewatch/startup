- calloutType: strength
  title: Three operating venues make Cosm more than a concept
  body: By June 2026 Cosm has operating venues in Los Angeles, Dallas, and Atlanta, with Detroit and Cleveland
    in the announced pipeline. That matters because the company is no longer pitching only technology
    or prototypes; it has real public sites, recurring programming, and named partners across sports,
    media, and brand sponsorship.
