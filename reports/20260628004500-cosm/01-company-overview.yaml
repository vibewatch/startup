- id: funding-stakeholders
  title: Funding History, Reported Valuation, and Strategic Stakeholders
  body: >-
    The single best-supported capital event in the record is Cosm’s July 31, 2024 financing announcement.
    Cosm said it raised over $250 million to expand its Shared Reality venues and to grow its technology
    and media units. Independent coverage in PR Newswire, Deadline, and Los Angeles Business Journal corroborated
    the round and consistently named Steve Winn and Mirasol Capital, Avenue Sports Fund, Dan Gilbert’s
    ROCK, Baillie Gifford, and David Blitzer’s Bolt Ventures among the backers. This mix matters strategically:
    the investor group is unusually rich in sports, venue, and media adjacency rather than pure software
    venture capital.


    Valuation support is weaker than round-size support. The company itself did not publish a valuation
    figure in the official raise announcement, but Los Angeles Business Journal reported that the financing
    valued Cosm at $1 billion. That is the best public mark available in reviewed sources, yet it is still
    a July 2024 point estimate rather than a refreshed 2026 valuation. Because no later public re-mark,
    debt package, or secondary transaction was surfaced, later chapters should treat the $1 billion figure
    as a reported historical mark rather than a current fair-value fact.


    The broader disclosure profile remains notably thin for a company of this scale. No reviewed public
    sources disclosed revenue, ARR, headcount, customer count, venue utilization, debt facilities, or
    secondary-share terms. The overview therefore supports a later-stage private growth story with significant
    external validation, but it does not yet support an underwritten view on economics.
  claimRefs:
