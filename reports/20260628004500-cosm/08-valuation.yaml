  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: series-c-pricing
    missingEvidence: Exact Series C post-money valuation, security type, and ownership percentage sold to Sony.
    whyItMatters: Without this, the 2026 entry price cannot be compared cleanly with the 2024 unicorn mark or with public venue comps.
    diligencePath: Request board-approved financing summary, term sheet, and cap-table update from management.
    relatedQuestionRefs:
    - QV007
    - QV022
  - type: private-evidence-only
    severity: material
    topic: cap-table-waterfall
    missingEvidence: Full cap table, liquidation preferences, participation rights, anti-dilution terms, and any secondary sale component.
    whyItMatters: Return underwriting depends on where new money sits in the stack and whether the headline valuation overstates common-equity economics.
    diligencePath: Obtain financing docs or counsel-prepared waterfall model from the company or lead investor.
    relatedQuestionRefs:
    - QV023
  - type: private-evidence-only
    severity: material
    topic: venue-unit-economics
    missingEvidence: Venue-level revenue, attendance, utilization, EBITDA, food-and-beverage mix, and content-rights cost by site.
    whyItMatters: Public comps are only useful if Cosm’s unit economics can eventually support comparable venue-network margins and asset turns.
    diligencePath: Request site-level operating model for Los Angeles, Dallas, and Atlanta plus same-store trend deck.
    relatedQuestionRefs:
    - QV024
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Primary-source revenue disclosure or audited financial statements that corroborate the $216.9 million third-party estimate.
    whyItMatters: The public valuation sensitivity currently rests on a single low-transparency aggregator rather than on audited company disclosure.
    diligencePath: Request audited 2024 financials or lender/investor reporting package; if unavailable, rebuild top-down revenue from attendance and spend cohorts.
    relatedQuestionRefs:
    - QV014
    - QV027
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A company-confirmed employee count and current organizational footprint.
    whyItMatters: Headcount is only a soft scale signal here, but conflicting aggregator estimates reduce confidence in using it as evidence of operating maturity.
    diligencePath: Request a current org snapshot or use LinkedIn/Carta triangulation in a later refresh.
    relatedQuestionRefs:
    - QV016
