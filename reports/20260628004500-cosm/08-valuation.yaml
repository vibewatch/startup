- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current view
  - What would change the view
  rows:
  - - Strategic-capital thesis
    - Sony’s $100M lead check and board seat validate that Cosm is becoming a real strategic distribution platform, not just a novelty venue.
    - A disclosed Series C valuation that implies an extreme multiple without better economics would weaken the benefit of that strategic validation.
  - - Footprint thesis
    - Three open venues plus queued Detroit/Cleveland expansion suggest real rollout capability.
    - Evidence of weak utilization or negative same-store trends would quickly challenge the expansion case.
  - - Premium-experience thesis
    - Published ticket ranges and sponsor/World Cup partnerships show willingness to pay for marquee events.
    - Persistent evidence that premium pricing limits attendance or repeat demand would weaken monetization confidence.
  - - Comp anti-thesis
    - A flat ~$1B mark only works if retained revenue estimates are directionally right and growth continues.
    - Audited revenue materially above the public estimate would improve support; a higher undisclosed Series C mark would worsen it.
  - - Disclosure anti-thesis
    - The exact Series C price, ownership sold, and preference stack are still private.
    - Full financing terms and waterfall disclosure are the shortest path to changing the call.
  - - Unit-economics anti-thesis
    - Public sources do not show venue-level EBITDA, utilization, or rights-cost structure.
    - A site-level operating model that proves attractive cash generation would materially improve valuation support.
  notes: Rows pair the positive strategic story with the exact disclosure or economics that would need to show up before the valuation can be upgraded.
