- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Series C price shock
    - The undisclosed 2026 post-money turns out to be materially above the 2024 unicorn mark without matching audited revenue growth.
    - Pushes Cosm beyond retained public comp support and makes even strategic validation insufficient for new-money entry.
    - Move from Track to Avoid until a lower entry or better economics appear.
  - - Utilization miss
    - New venues open but management cannot show healthy attendance, premium occupancy, or repeat event demand.
    - Breaks the multi-city rollout logic that underpins any premium multiple.
    - Rebuild value on lower venue comps and defer investment.
  - - Economics opacity persists
    - Management still will not disclose venue-level EBITDA, media-rights costs, or sponsor monetization in the next diligence cycle.
    - Keeps the valuation debate anchored to marketing headlines instead of cash generation.
    - Do not advance beyond monitor mode.
  - - Price elasticity shows up
    - Premium-ticket demand softens or discounting becomes necessary to fill newer sites.
    - Undermines the willingness-to-pay thesis and increases downside to physical-site returns.
    - Lower acceptable multiple and widen downside case.
  - - Strategic partner value proves cosmetic
    - Sony’s board seat and content optionality do not translate into measurable monetization or differentiated programming.
    - Removes the strongest rationale for paying above ordinary venue multiples.
    - Re-rate toward lower experiential comps.
  notes: Triggers are framed in monitorable financing or operating terms so the investment committee can react before a valuation reset becomes obvious in the next round.
  claimRefs:
  - CV017
  - CV035
  - CV037
  - CV041
  - CV043
  - CV044
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Exact Series C pricing
    - Post-money valuation, ownership sold, security type, and whether any secondary was included.
    - The current chapter cannot underwrite the 2026 entry price without these terms.
    - Management, Sony, or lead counsel financing memo.
  - - Waterfall and preferences
    - Liquidation stack, participation rights, anti-dilution, and option-pool refresh.
    - Headline private valuations can overstate what new money actually buys.
    - Cap-table export plus counsel-prepared waterfall model.
  - - Venue economics
    - Site-level revenue, utilization, ticket mix, F&B margin, sponsor revenue, and EBITDA by venue.
    - Comp-based valuation is only credible if unit economics can support those comp ranges.
    - Operator data room and monthly site reporting.
  - - Revenue corroboration
    - Audited 2024 revenue or lender/investor reporting that validates or refutes the $216.9M public estimate.
    - The current sensitivity uses a low-transparency aggregator rather than audited company disclosure.
    - Audited financial statements or investor update deck.
  - - Attendance quality
    - Repeat visitation, corporate events mix, and premium-seat sell-through by event type.
    - Premium-price demand can look strong on launch headlines and weak in repeatability.
    - CRM cohort analysis and venue-level booking history.
  notes: Each ask maps to a specific valuation blind spot rather than to generic curiosity; clearing them would materially change the recommendation faster than another partnership headline would.
