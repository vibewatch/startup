- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric used
  - Multiple / valuation
  - Relevance to Cosm
  - Main limitation
  rows:
  - - Sphere Entertainment
    - June 2026 market cap / revenue and EV / sales
    - ~$6.08B market cap; ~$1.33B revenue; ~4.6x P/S; ~4.8x EV/Sales
    - Closest premium immersive-venue reference because the market pays up for spectacle and differentiated presentation.
    - Public, scaled, and more mature than Cosm; not a private rollout story.
  - - Live Nation
    - June 2026 EV / sales
    - ~$43.27B EV on ~$25.61B revenue = ~1.69x EV/Sales
    - Useful lower-multiple benchmark for live-event scale without the same immersive-tech premium.
    - Ticketing and promoter mix are much broader than Cosm’s venue model.
  - - Topgolf Callaway
    - June 2026 EV / sales
    - ~$3.64B EV on ~$2.12B revenue = ~1.72x EV/Sales
    - Relevant experience-led comp for venue operations, food-and-beverage, and discretionary demand.
    - Golf hardware and broader brand portfolio make it only a partial venue analog.
  - - Dave & Buster’s
    - June 2026 market cap / sales and EV context
    - ~$411M market cap on ~$2.09B revenue = ~0.20x P/S; EV materially above equity due to leverage
    - Useful cautionary comp for discretionary entertainment with physical-site intensity.
    - Lower-end entertainment positioning and leverage distort direct comparison.
  - - Cosm at 2024 unicorn mark
    - Implied value / retained public revenue estimate
    - ~$1.0B valuation on ~$216.9M estimated revenue = ~4.6x value/revenue
    - Shows why the 2024 mark already sits near the high end of public-venue comps.
    - Revenue comes from a low-transparency aggregator, not audited company disclosure.
  notes: This enumeration intentionally mixes premium and lower-multiple venue references to show the band a private buyer must think through; the Cosm row is a derived sensitivity, not a disclosed market quote.
  enumerationScope:
    coverage: partial
    basis: 'Five valuation reference sets were retained for this chapter: one premium immersive venue comp, three broader experiential venue comps, and Cosm''s own implied multiple from the only public revenue estimate.'
