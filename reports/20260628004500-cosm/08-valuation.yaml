  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Real strategic validation, but the 2026 price and economics are still not publicly underwritable.
    - Keep active coverage and diligence, but do not underwrite upside from headlines alone.
  - - Confidence
    - medium
    - Multiple independent sources agree on funding headlines, but key pricing and economics remain private.
    - Use ranges and conditions, not a single-point mark.
  - - Risk rating
    - high
    - Venue rollout is capex-heavy and unit economics remain undisclosed.
    - Require explicit kill triggers around pricing, utilization, and financing terms.
  - - Valuation stance
    - stretched
    - A flat 2024 unicorn mark only looks fair if the lone revenue estimate is directionally right; any 2026 step-up would likely outrun retained comp support.
    - Entry discipline matters more than brand momentum.
  - - What would improve the call
    - price and disclosure
    - Exact Series C pricing, waterfall terms, and site-level economics could move the stance toward fair.
    - Re-open underwriting only after those items are disclosed.
  notes: 'This table is intentionally price-sensitive: it reflects the disclosed 2024 mark, the undisclosed 2026 price, and the retained public comp band rather than company-quality admiration alone.'
