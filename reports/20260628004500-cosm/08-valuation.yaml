- id: comparable-framing-and-scenario-underwriting
  title: Comparable framing and scenario underwriting
  body: "                The cleanest public comp frame for Cosm is not pure cinema and not pure live events. It sits somewhere between Sphere’s immersive-premium venue thesis and the lower-multiple eatertainment or ticketing operators such as Live Nation, Topgolf Callaway, and Dave & Buster’s. Sphere is the closest high-end reference: about $6.08 billion of market cap, $1.33 billion of trailing revenue, and roughly 4.6x to 4.8x sales as of late June 2026. Live Nation screens closer to 1.7x EV-to-sales, Topgolf Callaway around 1.7x, and Dave & Buster’s far lower on price-to-sales.\n\n                That comp set makes the only retained company-level revenue estimate extremely important. If GetLatka’s $216.9 million 2024 revenue estimate is directionally right, then a $1 billion valuation implies roughly 4.6x revenue—close to Sphere and above the rest of the public venue set. That is not obviously impossible, but it is already a premium. If the estimate is wrong on the high side, or if the\
    \ 2026 round priced meaningfully above $1 billion, the multiple would move beyond the retained public range quickly.\n\n                That is why the base case cannot lean on headline momentum alone. The bull case requires strong multi-city utilization, sponsor and rights monetization, and continued strategic distribution leverage. The bear case starts with premium-price elasticity, underused new venues, and capex outrunning disclosed economics.\n            "
