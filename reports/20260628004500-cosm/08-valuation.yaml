- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - Los Angeles, Dallas, and Atlanta fill premium events consistently; Detroit/Cleveland open on plan; sponsor/media monetization scales; Sony creates repeatable strategic content leverage.
    - A 5x-6x revenue framing can work only if verified revenue scales above the public estimate and the Series C did not already pre-price that upside.
    - Possible but needs hard disclosure upgrades.
    - Rollout capex and rights costs eat the upside before cash flow proves out.
  - - Base
    - The 2024 unicorn mark roughly holds, World Cup and partner momentum help demand, but public economics remain incomplete and growth is uneven across sites.
    - A 4x-5x revenue frame is barely supportable versus Sphere-like premium comps if the $216.9M estimate is directionally right.
    - Most consistent with retained evidence.
    - A hidden step-up in 2026 pricing would make even this base case too generous.
  - - Bear
    - Premium-ticket elasticity shows up, newer venues underutilize capacity, and investors keep funding rollout before public margins are proven.
    - Value compresses toward the 1.5x-3x venue-comp range rather than the premium Sphere-like range.
    - Easy to imagine because the economics are still private.
    - An opaque cap table could make downside for new money worse than the headline valuation suggests.
  - - What the market still cannot price
    - Series C terms, waterfall, site-level EBITDA, and attendance quality remain undisclosed.
    - Any scenario analysis is therefore a range discipline exercise, not a mark-to-market valuation.
    - High uncertainty is structural, not cosmetic.
    - False precision can produce a bad entry even if the company itself succeeds.
  notes: Scenarios are underwriting ranges rather than company forecasts; they are designed to show how much of the outcome hinges on undisclosed pricing and unit economics.
