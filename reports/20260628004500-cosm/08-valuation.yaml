- id: ownership-mix-footprint-and-demand-signals
  title: Ownership mix, footprint, and demand signals
  body: "                Ownership quality has clearly improved, even if ownership percentages remain private. The 2024 round was backed by a family-office and sports-owner cohort—Mirasol/Steve Winn, Avenue Sports, ROCK, Baillie Gifford, and Bolt Ventures—which is useful growth capital but not, by itself, proof of strategic content leverage. The 2026 Sony investment changes that mix. Sony is not just another financial sponsor; it is a strategic media owner with board representation and obvious IP-distribution incentives. That shift matters because Cosm’s business model depends on a hybrid of venue demand, premium content relationships, and proprietary presentation technology.\n\n                Footprint expansion also looks real rather than aspirational. By late June 2026, retained official sources said Cosm had open venues in Los Angeles, Dallas, and Atlanta, with Detroit and then Cleveland queued next. BizBash and Reuters-sized reporting suggest the venues can hold roughly 1,700 guests\
    \ at full capacity, while World Cup match presentations are framed around about 1,200 dome viewers. Those numbers are enough to show real physical scale, but not enough to infer venue-level profitability.\n\n                Demand evidence is mixed. Premium ticket ranges and the adverse SFGate review both suggest visitors will pay for the experience, yet that same evidence highlights accessibility and price-elasticity risk. Public sources support the existence of demand; they do not yet prove repeatable, mass-market utilization at attractive margins.\n            "
