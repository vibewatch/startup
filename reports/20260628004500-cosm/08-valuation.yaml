- id: decision-discipline-and-final-diligence
  title: Decision discipline and final diligence asks
  body: "                The recommendation is Track rather than Buy or Avoid. Buy is too aggressive because the 2026 price is still private, the cap-table waterfall is undisclosed, and the venue-level economics that would justify a premium multiple are missing from public view. Avoid is too harsh because Cosm clearly has strategic momentum: a real venue footprint, a strong content-partnership stack, a strategic lead investor in Sony, and evidence that consumers will pay premium prices for marquee experiences.\n\n                What that leaves is a valuation stance best summarized as stretched. Public evidence can support “fair” only under a narrow interpretation: the 2024 unicorn mark remains roughly intact and the lone retained revenue estimate is directionally correct. The moment the 2026 Series C turns out to be a material step-up, the company likely outruns the retained public venue comp band absent correspondingly higher, verified revenue. The chapter therefore should not be read\
    \ as a company-quality dismissal. It is a disclosure and entry-discipline judgment.\n\n                A later refresh could move the stance meaningfully if management or investors disclose the exact Series C price, the preference stack, and site-level economics for Los Angeles, Dallas, and Atlanta. Those are the diligence items most likely to change the recommendation, not another generic brand or partnership announcement.\n            "
