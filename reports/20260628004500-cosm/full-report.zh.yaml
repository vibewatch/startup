            body: >-
              Cosm 可观察到的财务模型是场馆主导、多收入流，而不是纯门票驱动。官方页面显示 Los Angeles 和 Dallas
              有公开售票活动，并通过团体套餐、私人放映、整场私人活动、餐饮和品牌赞助进一步变现。官方团体页面尤其有用，因为它暴露了包装逻辑：普通入场、预订 Dome 包厢、预订 Hall 桌位、面向 20 到 100
              位客人的全包套餐、校外活动折扣，以及最多 400 人的私人放映。私人活动页面随后把收入阶梯扩展到全空间租赁和整场包场，并设置 50% 不可退押金，可能有助于短期营运资金。赞助层已不再是理论：adidas
              World Cup 2026 交易明确把票务联动优惠、品牌激活、员工制服和抽奖活动与场馆客流绑定。最后，WIRED 和 Cosm Technology
