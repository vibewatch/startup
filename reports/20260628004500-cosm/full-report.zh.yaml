      - number: '6.2'
        title: 需求、票务与买方旅程
        blocks:
          - type: paragraph
            body: >-
              最干净的公开需求证明，是 2026 FIFA World Cup 套餐。Cosm 的 World Cup 落地页营销 Atlanta、Dallas 和 Los Angeles 各 40
              场比赛、后续轮次库存的预售权限，以及带高端餐饮的专属团体预订。针对 2026 年 6 月 28 日 South Africa vs. Canada Round of 32 条目，Los Angeles 场馆露出
              Hall 普通入场 $12、Dome 预订座位 $104 到 $230；Dallas 露出 Hall 普通入场 $11、Dome 预订座位 $110 到 $220。两个活动页面都把自助购买上限定为 15
              个座位，强化了 Cosm 在普通票务和更高触达度团体 / 私人活动销售之间的分工。买方旅程很明确：通过首页、场馆页或合作伙伴公告发现活动；在 Dome 预订座位、Hall
              预订座位或普通入场之间选择；处理停车或到达动线；然后通过 app 或桌边服务追加销售餐饮和座位配送。这个组合很重要，因为 Cosm
              不只在卖屏幕。它把高端定位、现场消费和基于场景的预订打包进一次到访。跨城市节目编排也可作为复购需求代理：Atlanta 于 2026 年 6 月围绕 NBA Finals 观看开业，并立即叠加 World Cup
              库存；同一网络继续把 Los Angeles 和 Dallas 营销为高端体育目的地。
