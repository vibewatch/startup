      - number: '7.4'
        title: 监管、房东 / 开发商与执行风险
        blocks:
          - type: paragraph
            body: >-
              相比许多消费创业公司，Cosm 目前公开诉讼或执法包袱似乎更少，但这不等于监管暴露低。公司运营的场馆混合了票务、酒类服务、接待服务、无障碍义务、数据采集和全国营销活动。DOJ 指引确认，ADA Title III
              适用于面向公众开放的企业，包括餐厅、酒店和电影院，而这些功能都与 Cosm 宣传的场馆功能重叠。Wilson Sonsini 的 2026 年消费者保护展望也指出，FTC
              预计会执行已经对现场活动票务生效的隐藏费用规则；随着 Cosm 转向预售和高端活动套餐，结账、退款和价格展示纪律会更重要。房地产侧还多一层风险：Atlanta 依赖 Centennial Yards
              的片区建设，Detroit 和 Cleveland 则依赖 Bedrock 控制、并与 Dan Gilbert
              更大的体育和房地产生态绑定的地块。目标一致时，这种重叠有帮助；但它也把排期风险、场地设计风险和地方政治风险集中到少数交易对手身上。任何开发阶段延期，内容日历和人员计划都必须围绕 Cosm 无法完全控制的资产调整。
