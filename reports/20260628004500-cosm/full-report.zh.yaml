  - id: FR001
    title: 风险热力图 — 可能性 vs. 影响
    type: matrix
    layout: standard
    summary: 截至 2026-06-28，Cosm 主要风险按估计可能性和影响的位置。
    data:
      columns:
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 价格阻力 / 新鲜感消退
            - 跨场馆服务不一致
            - 资本强度 + 回本延迟
        - label: 中等可能性
          values:
            - ADA / 票务合规失误
            - 版权成本挤压
            - 开业时间被开发商节奏拖延
        - label: 中低可能性
          values:
            - 单一技术栈硬件瓶颈
            - 高端活动争议损害品牌
            - 多站点执行过度拉伸
    approximationNotes: 可能性和影响是作者基于公开融资、铺开、评论和合作伙伴证据作出的判断，而非公司披露的风险评分。
