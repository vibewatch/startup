      - number: '7.2'
        title: 内容授权、需求质量与替代品风险
        blocks:
          - type: paragraph
            body: >-
              这套商业主张只有在 Cosm 持续拿到稀缺、高端、消费者无法在家或传统场馆复刻的节目时才成立。官方和合作伙伴来源显示已有真实进展：三城覆盖 2026 World Cup，NBA 权利延伸到 2030
              年及以后，节目单横跨体育、体验式影院、Cirque du Soleil 和创作者内容。但同样的来源也说明，这门生意依赖权利。Front Office Sports
              报道称，交易已经混用固定费用和收入分成结构，意味着上座率充分验证前，权利成本可能先涨。消费者端的价格带很宽：站席体验的入门价可以是个位数美元，高端活动可超过 $200，一些独立评论还提到更高的 World Cup
              要价。用户评论显示，消费者仍会把体验拿来同酒吧、居家观赛、IMAX 或 Sphere 式奇观比较，而不是把它视为独一类。这是典型的新鲜感风险：Cosm
              必须让内容日历足够独家，撑住高端定价；同时运营体验也要足够强，让访客愿意复访，而不只是尝鲜一次。
