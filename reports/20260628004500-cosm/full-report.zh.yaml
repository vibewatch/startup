            body: >-
              客户故事只有在复访引擎被证明强于当前公开记录时才具备可投资性。今天可见优势是产品化团体销售、高端私人活动库存、多城市体育节目编排，以及不断增长的赞助商或激活合作伙伴名单。可见弱点同样清楚：没有公开复访或忠诚度披露，没有门票
              - F&B - 赞助收入组合，没有分群经济性，也没有私人活动复订率披露。边缘处还存在运营不一致证据。Los Angeles World Cup 活动页面宣传最多四小时停车验证，而 Hollywood Park
              页面称验证只覆盖前三小时，此后开始付费停车。这种错配不会单独改变 thesis，但它凸显了买方摩擦多么容易出现在高价格式中。综合来看，Cosm
              对高端场景和合作伙伴驱动变现有可信需求证明，但仍缺少以高信心承销持久性所需的复购消费者和分群证据。
