      - number: '2.5'
        title: 约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要采用风险在于，体验式需求不会自动转化为有吸引力的场馆经济性。行业来源反复提示，LBE 存在前期成本高、可扩展性有限、监管、内容更新负担，以及安全或隐私合规等结构性摩擦。McKinsey 也指出，小型
              location-based 项目的利润率往往低于目的地公园或成熟家庭娱乐中心。替代品基础很强：AMC、IMAX、Dave & Buster's
              等规模化既有巨头已经通过数千块银幕或数百个场馆服务高端线下场景；家庭流媒体、高端电视和社交短视频集锦也吸收了同一需求的一部分。公开可比公司也很混乱；例如 Callaway 重新聚焦高尔夫装备后，Topgolf
              不再是干净的上市场馆可比。最大的剩余缺口仍是私有信息：Cosm 不公开披露单场馆定价、利用率、F&B 组合或赞助合同金额，因此任何公开 SOM 模型都只能是示意，而非已承销。
