      - number: '1.2'
        title: 领导团队、董事会信号与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层是公开记录里相对可支撑的一块，因为 Cosm 官方团队数据给出了具名高管名单。Jeb Terry Jr. 是 President and CEO；Milken Institute
              的独立传记材料也印证了他的现任角色，以及他曾是 NFL 球员、FOX Sports 高管的背景。同一官方数据还列出 Peter McPhee 担任 CFO，Devin Poolman 担任 Chief
              Product & Technology Officer，Kirk Johnson 担任 COO and GM of Evans & Sutherland，Katie Laclette 担任 Chief
              People Officer，Jeff Hughes 担任 President of Sports & Entertainment，David Ho 担任 Chief Legal Officer，Stephen
              T. Winn 担任董事会主席。Dallas Innovates 在 Dallas 预览活动报道中独立印证了 Winn 的主席身份。


              不过，治理披露仍比高管名单暗示的更薄。已审阅来源没有找到 Winn 之外更完整的董事会名单、委员会结构或独立董事阵容；融资报道旁也没有出现公开债务或二级股转让披露。尽调视角下，Terry
              似乎是核心运营发言人和商业化负责人，Winn 则是最可见的董事会层面人物。公开领导层名单与有限治理细节并存，带来有意义的关键人依赖风险：投资人能看到谁在日常运营公司，却还看不到董事会梯队或机构控制结构有多深。
