      - number: '4.3'
        title: 资本强度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开承销信号不是收入，而是资本强度。Texas 备案记录显示，Grandscape 项目为 65,000 平方英尺，估计私人出资建设成本 $42.5
              million；在后续升级、替换资本开支或中央开销之前，约合每平方英尺 $654。Dallas Innovates 和 Grandscape
              都把穹幕描述为核心吸引物，进一步说明重硬件场馆就是产品，而不只是产品外壳。资产负债表一侧，Cosm 公开宣布 2024 年融资超过 $250 million；CNBC 后来报道截至 2025 年 2 月已累计融资
              $300 million；Sony 又在 2026 年 6 月追加 $100 million Series C 资本。CNBC 还报道称，管理层已经在根据建设节奏考虑另一轮融资。这很重要，因为
              Sony、Variety 和 Sports Video Group 都描述了一条从 Los Angeles、Dallas 延伸到 Atlanta、Detroit、Cleveland
              的扩张管线。因此，公开证据支持一个直接结论：Cosm 已经融了很多钱，但场馆铺开似乎仍依赖融资；已抓取记录没有披露当前现金、债务或现金消耗。
