      - number: '8.2'
        title: 股权结构、场馆足迹与需求信号
        blocks:
          - type: paragraph
            body: |2-
                              即便持股比例仍未公开，股东质量已经明显改善。2024 年那轮由一批家族办公室和体育资产所有者支持——Mirasol / Steve Winn、Avenue Sports、ROCK、Baillie Gifford 和 Bolt Ventures。这是有用的增长资本，但本身不能证明战略内容杠杆。2026 年 Sony 投资改变了组合。Sony 不只是另一个财务赞助方；它是战略媒体资产所有者，有董事会席位，也有明显的 IP 分发激励。这一变化重要，因为 Cosm 的商业模型依赖场馆需求、高端内容关系和自有呈现技术的混合体。

                              场馆扩张也更像真实落地，而非愿景口号。截至 2026 年 6 月下旬，保留的官方来源称 Cosm 已在 Los Angeles、Dallas 和 Atlanta 开业，Detroit 随后排队，Cleveland 再下一站。BizBash 和 Reuters 量级报道显示，场馆满员可容纳约 1,700 名客人，而 World Cup 比赛呈现围绕约 1,200 名穹顶观众设计。这些数字足以证明真实物理规模，但不足以推断单店盈利能力。

                              需求证据是混合的。高端票价区间和 SFGate 的负面评论都显示访客愿意为体验付费，但同一证据也凸显了可及性和价格弹性风险。公开来源支持需求存在；它们尚未证明在有吸引力利润率下，利用率能可重复地触达大众市场。
                          
            claimRefs:
