  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Cosm 在战略背书和合作伙伴牵引上得分较高，但披露完整度和估值清晰度偏弱。
    data:
      items:
        - label: 战略资本质量
          value: 8/10
          detail: Sony、Mirasol、Baillie Gifford 以及体育老板资本都是有分量的信号。
          tone: positive
        - label: 网点验证
          value: 7/10
          detail: 截至运行日已有三座场馆开业，后续扩张也已排队。
          tone: positive
        - label: 合作伙伴牵引
          value: 7/10
          detail: FOX/FIFA/adidas 以及更早的 ESPN/NBA 式关系已经可见。
          tone: positive
        - label: 收入可见度
          value: 3/10
          detail: 仅纳入了一项透明度较低的公开收入估算。
          tone: warning
        - label: 单店经济性可见度
          value: 2/10
          detail: 未公开披露场馆层面的 EBITDA、利用率或版权成本。
          tone: warning
        - label: 股权结构可见度
          value: 1/10
          detail: Series C 价格、瀑布条款和优先权堆栈仍未公开。
          tone: warning
        - label: 入场估值支撑
          value: 4/10
          detail: 2024 年独角兽估值持平或许还能解释；若 2026 年估值上调，价格很可能显得偏高。
          tone: warning
    approximationNotes: 这些面向投委会的判断分数综合自已纳入证据；它们不是统计模型，也不应误读为管理层指引。
    claimRefs:
      - CV007
      - CV012
      - CV019
      - CV023
      - CV035
      - CV037
      - CV040
      - CV041
      - CV045
      - CV046
appendices:
  - id: A
    title: 决策规则
    blocks:
      - type: list
        title: 哪些因素会提高判断
        items:
          - 公开披露 Series C 定价、稀释和清算优先权条款。
          - 洛杉矶、达拉斯和亚特兰大的场馆层面证据显示，扣除版权和运营成本后，利用率与 EBITDA 仍有吸引力。
          - 有清晰证据证明，新场馆以及赞助 / 媒体变现的扩张速度快于资本开支和运营复杂度。
        claimRefs:
          - CV035
          - CV037
          - CV043
      - type: list
        title: 哪些因素会下调判断
        items:
          - 2026 年存在重大但未披露的估值上调，且没有匹配的收入披露。
          - 有证据表明，高端定价和运营摩擦正在压制复购需求。
          - Detroit、Cleveland 或后续场馆开业延期，或经济性下滑。
        claimRefs:
          - CV041
          - CV044
          - CR035
