      - number: '8.3'
        title: 可比公司框架与情景承销
        blocks:
          - type: paragraph
            body: |2-
                              Cosm 最干净的公开可比框架既不是纯影院，也不是纯现场活动。它位于 Sphere 的沉浸式高端场馆论证，与 Live Nation、Topgolf Callaway、Dave & Buster's 等估值倍数更低的餐饮娱乐或票务运营商之间。Sphere 是最接近的高端参照：截至 2026 年 6 月下旬，市值约 $6.08B，过去 12 个月收入 $1.33B，销售额倍数约 4.6x 至 4.8x。Live Nation 更接近 1.7x EV / sales，Topgolf Callaway 约 1.7x，Dave & Buster's 的 P/S 更低得多。

                              这组可比让唯一保留下来的公司级收入估算极其重要。如果 GetLatka 对 2024 年收入 $216.9M 的估算方向正确，那么 $1B 估值意味着约 4.6x 收入——接近 Sphere，并高于其余公开场馆公司。这并非明显不可能，但已经是溢价。如果该估算偏高，或者 2026 年轮次定价显著高于 $1B，倍数会很快越过保留的公开可比区间。

                              因此，基准情景不能只靠标志性事件动能。乐观情景需要强劲的多城利用率、赞助和权利变现，以及持续的战略分发杠杆。悲观情景则从高端价格弹性、新场馆利用不足、资本开支跑在披露经济性前面开始。
                          
