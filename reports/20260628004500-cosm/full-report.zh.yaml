      - number: '6.4'
        title: 体验反馈与留存代理
        blocks:
          - type: paragraph
            body: >-
              公开反馈对沉浸感方向性积极，对运营执行则更混合。CNET 第一人称 Harry Potter 预览称 Shared Reality 格式令人着迷、包裹感强且有群体感；这很有意义，因为它验证了 Cosm 的
              thesis：场馆可以在不依赖 VR 头显或纯现场体育的情况下变现电影粉丝。App 界面是另一个正向代理：Apple App Store 条目突出活动发现、顺畅票务和座位点餐；截至 2026 年 5 月版本，该
              app 在 124 条评价中获得 4.9 / 5 评分。但公开投诉信号真实存在。Cosm Dallas 的 TripAdvisor
              评论者反复把概念描述为强，而经济性或运营较弱，提到票价很高、餐饮昂贵、座位分配混乱、取水和上餐服务缓慢，以及员工后续跟进差。这个组合说明，Cosm
              复访的主要风险不是核心奇观，而是高端定价与服务标准能否保持一致。公开层面，公司没有披露会员忠诚计划、复访率、季票产品或单场馆留存数据，因此 app 评分和持续节目编排只能弱代理真实客户持久性。
