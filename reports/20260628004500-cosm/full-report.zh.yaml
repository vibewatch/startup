        title: 持久性判断
        blocks:
          - type: paragraph
            body: >-
              因此，持久性判断是混合的，但并不悲观。当买家明确需要高端现场活动真实感时，Cosm 比艺术装置场馆或社交游乐连锁更有防守性；NBA 加 FIFA/FOX 披露也说明，公司已经拿到许多沉浸式相邻场馆没有的
              proof points。与此同时，反向证据也重要。Sphere 的定价反弹显示，高端奇观很快就可能触到排他感上限；Screendaily 关于 PLF
              碎片化的报道则说明，场馆运营商和放映商一直在寻找更低成本方式去近似「高端」，同时不与主导供应商分享经济性。只要 Cosm
              继续让版权、节目编排和选址领先，它仍能赢；但公开证据对复购需求经济性、内容版权排他性细节，以及 >100 个站点野心会转化为纪律性扩张还是品类过度建设，都更薄。承销上，这意味着今天应把 Cosm
              视为差异化高端观看平台，而不是硬件层本身就能创造 winner-take-most 保护的公司。
