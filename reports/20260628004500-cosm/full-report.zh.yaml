  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 按客户或代理 cohort 划分证据质量，突出哪里证明强、哪里留存能见度弱。
    data:
      columns:
        - 具名证明深度
        - 变现表面
        - 复访能见度
        - 主要注意点
      rows:
        - label: 体育观众
          values:
            - 高
            - 门票 + F&B + 团体
            - 低
            - 需求证明很强，但缺少场馆层面的复访数据
        - label: 电影 / IP 观众
          values:
            - 中
            - 门票 + 主题 F&B
            - 低
            - 有正向预览，但没有公开售罄率或重复片名数据
        - label: 团体 / 私人活动买家
          values:
            - 中
            - 套餐消费 + 包场 + 餐饮
            - 低
            - 产品可见，但预订频率和赢单率未披露
        - label: 品牌活动
          values:
            - 高
            - 赞助 + 活动费用
            - 中
            - 有具名案例研究，但合作伙伴集中度不清楚
        - label: 内容 / 权利合作伙伴
          values:
            - 高
            - 版权驱动流量 + 场馆相关性
            - 低
            - 公开证明依赖高端外部 IP 和广播方访问
    approximationNotes: 矩阵评分是基于具名证明质量和已披露持久性数据的分析判断，不是公司发布的评分卡。
    claimRefs:
      - CU024
