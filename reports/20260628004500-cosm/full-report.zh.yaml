      - - Dave & Buster’s 娱乐餐饮
        - 2026 年 6 月市值 / 销售额和 EV 语境
        - 约 $411M 市值，对应约 $2.09B 收入 = 约 0.20x P/S；由于杠杆，EV 显著高于股权价值
        - 对具有实体场地强度的可选娱乐，是有用的警示性可比公司。
        - 低端娱乐定位和杠杆会扭曲直接比较。
      - - Cosm 2024 年独角兽标记
        - 隐含价值 / 保留的公开收入估算
        - 估值约 ~$1.0B，估算收入约 ~$216.9M，对应约 4.6x 价值 / 收入
        - 说明为什么 2024 年估值标记已接近公开场馆可比公司的高端。
        - 收入来自透明度低的聚合方，不是经审计的公司披露。
    notes: 这组列举有意同时放入高端和低倍数场馆参照，展示私人买家必须想清楚的区间；Cosm 这一行是推导敏感性，不是已披露的市场报价。
    enumerationScope:
      coverage: partial
      basis: >-
        Five valuation reference sets were retained for this chapter: one premium immersive venue comp, three broader
        experiential venue comps, and Cosm's own implied multiple from the only public revenue estimate.
    claimRefs:
      - CV023
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV005
    title: 论点失效与叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Series C 价格冲击
        - 未披露的 2026 年投后估值若显著高于 2024 年独角兽标记，且没有匹配的经审计收入增长。
        - Cosm 将超出保留的公开可比支撑，即便有战略验证，也不足以支持新资金入场。
        - 从跟踪转为回避，直到出现更低入场价或更好经济性。
      - - 利用率未达预期
        - 新场馆开业后，管理层仍无法证明健康的到场率、高端席位占用率或重复活动需求。
        - 多城市扩张逻辑被打断，而这一逻辑支撑任何高端倍数。
        - 按更低场馆可比重建估值，并推迟投资。
      - - 经济性继续不透明
        - 下一个尽调周期里，管理层仍不披露场馆级 EBITDA、媒体版权成本或赞助变现。
        - 估值讨论会继续被营销头条牵着走，而不是锚定现金生成能力。
        - 不推进到监控模式之外。
      - - 价格弹性显现
        - 高价票需求走弱，或新场馆需要打折才能填满。
        - 愿付价格论点被削弱，实体场馆回报的下行风险上升。
        - 下调可接受倍数，并拉宽下行情景。
      - - 战略伙伴价值被证明只是装饰
        - Sony 的董事席位和内容选择权未转化为可衡量变现或差异化节目。
        - 支付高于普通场馆倍数的最强理由消失。
        - 向更低的体验业态可比公司重新定价。
    notes: 这些触发因素用可监测的融资或运营口径表述，投资委员会可在下一轮估值重置变得明显之前反应。
    claimRefs:
      - CV017
      - CV035
      - CV037
      - CV041
      - CV043
      - CV044
      - CV047
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series C 精确定价
        - 投后估值、出售股权比例、证券类型，以及是否包含任何老股出售。
        - 没有这些条款，本章无法承保 2026 年入场价格。
        - 管理层、Sony 或主承销律师融资备忘录。
      - - 清算瀑布与优先权
        - 清算顺位、参与权、反稀释和期权池刷新。
        - 私募估值头条可能夸大新资金实际买到的权益。
        - 股权结构表导出，加上律师准备的清算瀑布模型。
      - - 场馆经济性
        - 按场馆拆分的场馆级收入、利用率、票种结构、F&B 利润率、赞助收入和 EBITDA。
        - 只有单位经济性能支撑这些可比区间，基于可比公司的估值才可信。
        - 运营商数据室和月度场馆报告。
      - - 收入佐证
        - 经审计的 2024 年收入，或验证 / 反驳 $216.9M 公开估算的贷款方 / 投资者报告。
        - 当前敏感性使用透明度低的聚合方，而不是经审计的公司披露。
        - 经审计财务报表或投资者更新材料。
      - - 到场质量
        - 重复到访、企业活动组合，以及按活动类型拆分的高端席位售罄率。
        - 高价需求在开业头条里可能显得强劲，但复购时可能走弱。
        - CRM 队列分析和场馆级预订历史。
    notes: 每个问题都对应一个具体估值盲点，而不是泛泛好奇；解决这些问题，对推荐结论的改变会比又一条合作伙伴头条更快。
    claimRefs:
      - CV018
      - CV023
      - CV027
      - CV035
      - CV036
      - CV037
      - CV045
      - CV046
