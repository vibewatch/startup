      - number: '5.4'
        title: 差异化、质量控制与可扩展性风险
        blocks:
          - type: paragraph
            body: >-
              Cosm 最清晰的差异化，在于它位于影院和 VR 之间，而不是落在其中任何一类内部。相比影院，它提供 180
              度环绕画布、为场边或球场边视角调校的现场活动采集，以及围绕群体能量、接待服务和品牌商品构建的场馆节目。相比
              VR，它去掉头显、隔离感和单用户摩擦，同时仍在幕后使用沉浸式采集工具。因此，主要瓶颈大多是系统和规模风险，而不是概念风险：场馆铺开需要资本、建设、版权交易、GPU
              密集型播放基础设施和韧性网络路径；现场体育节目依赖采集套件、同步和合作伙伴信号；公开披露对场馆在线率、故障率，以及安全或合规细节仍然偏薄。简言之，产品有吸引力且技术差异化明确，但把它在全国或全球扩张，更接近搭建一套新的广播
              - 场馆栈，而不是再开一家影院连锁。运营人员培训需求，以及每个新场馆都要同时协调内容版权、楼宇系统和高带宽现场工作流，进一步放大了铺开挑战。
