companyProfile:
  summary: >-
    Cosm 是一家位于洛杉矶地区的私营沉浸式娱乐、媒体与技术公司，由传统穹幕和沉浸式视频业务整合而来，目前在 Los Angeles、Dallas 和 Atlanta 运营 Shared Reality
    场馆。公司围绕无头显、多人共享的现场体育、电影和品牌活动体验，把场馆开发、LED 穹幕呈现技术、媒体节目编排和合作伙伴分发打包在一起。公开证据显示，公司通过 2024 年传闻中的独角兽融资、2026 年 Sony
    领投的战略轮，以及大型体育 / 媒体合作，拿到了有意义的战略牵引力；但收入、利润率、到场人数和股权结构细节仍未披露，尚不足以完成完整承销。
