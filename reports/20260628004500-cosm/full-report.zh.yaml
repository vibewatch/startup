  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开数据仍未说明的部分
        blocks:
          - type: paragraph
            body: |2-
                              Cosm 的公开估值证据有些特殊：公司有两次强标志性融资事件，但只有一个披露过的估值锚。2024 年 7 月，Cosm 与多家第三方媒体都指向一轮超过 $250M 的战略增长融资；Reuters / Yahoo 和 Los Angeles Business Journal 将公司估值写成约 $1B。Tracxn 也强化了这一框架，列出 2024 年 7 月 31 日 Series B 融资 $250M，投后估值 $1B。这足以把 2024 年独角兽标记视为真实公开证据，而不是传言。

                              2026 年 6 月的 Sony 轮既是更强证据，也是更弱证据。更强，是因为它更新、更具战略性，还带有治理安排：Sony 领投 Series C，出资 $100M，取得少数股权，并让 Ravi Ahuja 进入董事会。更弱，是因为保留来源仍未披露 Series C 投后估值、出售股权比例、证券类型，或轮次中是否包含任何老股成分。这意味着公开证据验证了机构兴趣和战略相关性，但仍无法让外部投资人承销真实的 2026 年进入价格。

                              正确结论必须对价格敏感。如果 2024 年独角兽标记保持持平或接近持平，可能说得通。2026 年出现有意义的估值上调也仍有可能，但今天无法用公开信息承销，因为轮次机制仍不透明。
                          
