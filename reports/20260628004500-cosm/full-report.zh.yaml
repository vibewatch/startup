  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群组合与买方类型
        blocks:
          - type: paragraph
            body: >-
              Cosm 的直接客户是到场观众和活动买家，而不是企业软件账户。官方界面和场馆页面显示，客群广泛但明显偏高端：体育粉丝为头部现场活动购买 Shared Reality 门票；电影和娱乐粉丝购买 Harry
              Potter 等沉浸式放映；社交买家组织生日、校外活动和家庭出游；企业和私人活动策划者预订整场或部分场馆包场；品牌或版权方则用场馆做激活和内容分发。Dallas 和 Los Angeles
              的受众基础并不相同。Placer.ai 2026 年单场馆受众分析称，Cosm Dallas 在 Ultra Wealthy Families 和 Young Professionals 上
              over-index；Cosm Los Angeles 则在一个由 Near-Urban Diverse Families 支撑更广娱乐需求的区域里，吸引更多 Educated Urbanites 和 Ultra
              Wealthy Families。这让 Cosm
              看起来不像大众市场影院，更像高端线下娱乐产品；其买方组合依赖富裕家庭、目的地娱乐客流和可变现的团体场景。重要的是，同一批营销门票的公开页面也营销团体销售和私人活动，意味着 Cosm 把 B2C 到场和 B2B
              场馆变现视为并行客户渠道，而不是两门独立生意。
