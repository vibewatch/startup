      - number: '7.3'
        title: 技术可靠性与运营复杂度风险
        blocks:
          - type: paragraph
            body: >-
              Cosm 把自己定位为全栈沉浸式平台，而不是轻量内容转售商。招聘页称，公司覆盖实体设计、工程、制造、软件、显示引擎和内容；公司页面则显示，关键技术能力来自 Evans &
              Sutherland、Spitz、LiveLikeVR 和 C360。垂直整合让 Cosm 有差异化，但也拉大了运营面。SiliconANGLE 采访其技术负责人时提到，单个巨型穹顶由 Dell
              基础设施、Nvidia GPU 和约 50 台机器驱动，且现场活动的韧性是 mission-critical。Sports Video Group 显示，C360 能在 NHL
              的联盟规模下稳定运行，这是实质利好信号；但同一来源也凸显了这套工作流多么吃数据、多么依赖协同。消费者证据显示，公开场馆体验还不顺滑：一篇正面的 Archer 评论仍提到偶发故障和声音延迟，多条
              Tripadvisor 投诉则集中在打断沉浸感的服务中断。运营风险不只是灾难性宕机，而是延迟、座位服务、人手失误和切换内容的复杂度叠加，逐步侵蚀定价体系所依赖的高端感。
