      - number: '1.3'
        title: 融资历史、已披露估值与战略股东
        blocks:
          - type: paragraph
            body: >-
              记录中证据最扎实的单一资本事件，是 Cosm 在 2024 年 7 月 31 日宣布的融资。Cosm 称其募集超过 $250 million，用于扩张 Shared Reality 场馆并发展技术和媒体部门。PR
              Newswire、Deadline 和 Los Angeles Business Journal 的独立报道印证了该轮融资，并一致把 Steve Winn and Mirasol Capital、Avenue
              Sports Fund、Dan Gilbert 的 ROCK、Baillie Gifford，以及 David Blitzer 的 Bolt Ventures
              列为支持方。这个组合在战略上重要：投资人群体异常集中在体育、场馆和媒体相邻领域，而不是纯软件风投。


              估值支撑弱于融资规模支撑。公司本身没有在官方融资公告中公布估值，但 Los Angeles Business Journal 报道称该融资把 Cosm 估值定在 $1
              billion。这是已审阅来源里最好的公开标记，但仍只是 2024 年 7 月的点估计，不是 2026 年更新估值。由于没有找到后续公开重估、债务包或二级交易，后文应把 $1 billion
              视为已报道的历史标记，而不是当前公允价值事实。


              对这样体量的公司而言，更广的披露画像仍明显偏薄。已审阅公开来源没有披露收入、ARR、员工数、客户数、场馆利用率、债务工具或二级股条款。因此，公司概览能支撑一个获得重要外部验证的后期私营增长故事，但还不能支撑对经济性的承销判断。
