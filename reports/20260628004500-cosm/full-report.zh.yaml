      - number: '3.3'
        title: 切换成本、锁定与分发权力
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Cosm 真正的切换成本更多在上游版权方、媒体合作伙伴和场馆开发伙伴，而不是下游消费者。消费者可以在 Cosm、Topgolf、IMAX、Meow Wolf 或 ARTECHOUSE
              之间多栖，因为这些出游满足相邻但不完全相同的休闲任务。企业和团体活动买家也面临较低结构性切换成本，因为 Sphere、Topgolf 和 ARTECHOUSE
              都公开宣传团体或私人活动套餐。相比之下，更难复制的一层，是靠近大型体育街区的场馆选址、联盟和广播商关系，以及让现场活动感觉是增量体验而不只是「投得更大」的采集 /
              分发工作流。因此，最相关的竞争基准不是单纯屏幕尺寸。Sphere 证明高端沉浸有人愿意付费，但 IMAX 的 PLF
              战争表明，一旦放映商或开发商能拼出足够的现成组件，高端观看硬件就可能商品化。DisplayDaily 对 Cosm 2020 年收购 Evans & Sutherland 和 Spitz
              的描述也强化了一点：技术栈至少部分是买入 - 自建 - 整合，而不是不可触碰的有机护城河。
