  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 投资判断从真实战略验证出发，穿过披露缺口，落到跟踪而非买入的结论。
    data:
      nodes:
        - id: n1
          label: 真实融资验证
          detail: 2024 年 $250M+ 轮次和 2026 年 Sony $100M Series C 证实赞助方有兴趣。
          tone: positive
        - id: n2
          label: 战略平台价值
          detail: Sony 董事席位，加上 Fox/FIFA/adidas 关系，创造内容分发可选性。
          tone: positive
        - id: n3
          label: 高端场馆经济性仍不透明
          detail: Series C 价格、利用率、EBITDA 和瀑布条款仍未披露。
          tone: warning
        - id: n4
          label: 可比公司支撑有条件
          detail: 只有那一项公开收入估算方向正确，$1B 的持平估值才说得通。
          tone: warning
        - id: n5
          label: 估值上调风险
          detail: 2026 年若存在未披露的价格上调，很可能跑出已纳入的公开场馆可比区间。
          tone: negative
        - id: n6
          label: 建议
          detail: 跟踪：公司有意思，价格偏高，还需更多尽调。
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 支撑
        - from: n2
          to: n3
          label: 但不能替代
        - from: n3
          to: n4
          label: 使得
        - from: n4
          to: n5
          label: 并提高
        - from: n5
          to: n6
          label: 推动
    approximationNotes: 这张图是决策链，不是定量模型；重点标出哪些缺失披露卡住了更高信心的买入判断。
    claimRefs:
      - CV007
      - CV010
      - CV019
      - CV035
      - CV040
      - CV041
      - CV045
      - CV046
