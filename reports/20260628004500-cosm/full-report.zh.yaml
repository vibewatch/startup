      - number: '1.4'
        title: 场馆铺开、合作伙伴与公开市场反馈
        blocks:
          - type: paragraph
            body: >-
              到标准运行日期 2026-06-28，Cosm 已经不再停留在概念阶段，而是进入运营场馆网络。Los Angeles 场馆于 2024 年中率先在 Inglewood 的 Hollywood Park 开业，随后
              Dallas 场馆于 2024 年 8 月下旬在 The Colony 的 Grandscape 开业。Atlanta 于 2026 年 6 月 10 日在 Centennial Yards 开业，使 Cosm
              在 FIFA World Cup 活动前夕拥有第三个运营站点。Detroit 是第四个开发中场馆，位置靠近 Cadillac Square 和 Campus Martius；Cleveland 则正式宣传将在
              Rocket Arena 对面于 2027 年开业。运营足迹因此是三个已公开营业场馆，加上两个已宣布的美国储备站点。


              合作伙伴证据已经广到足以产生战略意义。官方和合作伙伴发布材料验证了：Cosm 与 FOX Sports 在 Los Angeles、Dallas 和 Atlanta 推出 40 场 FIFA World Cup
              2026 节目；adidas 为同一 World Cup 呈现提供场馆赞助；公司在 2025 年宣布长期 NBA 合作；ESPN 套餐覆盖 NBA/NHL/CFP/U.S. Open/部分 UFC；CNBC
              品牌的 Cosm 内容还提到 NBC Sports 合作。节目页也显示，公司不只依赖单一联盟或单一运动，NBA Finals、UFC、MLB All-Star、Harry Potter、The
              Matrix、Cirque du Soleil 以及其他 Shared Reality 体验都在组合中。


              已审阅公开报道里的主要反向信号不是法律或监管，而是市场验证不透明。Dallas Observer 的早期评论称 Dallas 场馆是「huge hit」，但仍「more a triple than a home
              run」；这说明消费者惊艳感已经被证明，但复购性、定价权和主流习惯养成仍未定论。没有已披露到场人数、利用率或盈利指标，这种怀疑还无法被量化消除。
