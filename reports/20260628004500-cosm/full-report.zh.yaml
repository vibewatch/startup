      - number: '2.4'
        title: 增长驱动因素与采用催化剂
        blocks:
          - type: paragraph
            body: >-
              三个需求驱动因素最突出。第一，共同观看体育仍是一个大行为池：Nielsen 称，美国人平均 47% 的电视观看时间是共同观看，体育在重磅活动前后共同观看比例接近 50%，这支撑了 Cosm
              正在销售的社交场景。第二，赞助商和版权方想要新的变现界面。Stats Perform 报告称，70% 的体育媒体高管表示赞助商现在要求更多数字内容；Mordor
              也预计赞助和品牌合作增速将超过更广沉浸式市场。第三，房东和街区开发商越来越需要能提升停留时间、交叉消费和非比赛日相关性的娱乐锚点。Deloitte 2026 年体育展望和 CRE Daily
              房地产调查都指向全年运营的娱乐街区和大量体验式空间储备。这个组合有助于解释，Cosm 为什么选择靠近大型体育和综合用途节点开店，而不是做孤立的技术展示厅。
