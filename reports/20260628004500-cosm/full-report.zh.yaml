              由于 Cosm 是私营公司且不公布收入或利润率，最可防守的财务工作，是用可见输入约束单个场馆可能实现的变现规模。官方私人活动页面披露了容量范围：整场馆超过 30,000 平方英尺、总客容量超过 1,500
              人；Dome 本身在 Los Angeles 宣传约 364 个座位，在 Dallas 则视配置约 364 到 400 个座位。Dallas Observer 给出最干净的公开票价样本：某场大学橄榄球活动普通入场
              $39，预订座位 $77，六座包厢 $759。这些输入足以推导出一个狭窄的、仅含入场费的下限：364 座 Dome 活动售罄时，排除包厢、赞助或餐饮之前，约为 $14 thousand 到 $28
              thousand。二级市场页面暗示高需求活动价格点更高，但这些置信度低，因为转售价格不等于一手收入。好消息是，场馆格式明确把辅助收入设计进去，包括座位点餐、酒水服务、私人活动餐饮和打包接待服务。坏消息是，公开证据在实际人均消费、上座率、复访或贡献利润率之前就停止了。
