            body: 按唯一保留的公开收入估算，2024 年估值已经接近 Sphere 式销售额倍数，并高于多数其他场馆可比。如果 2026 年轮次定价显著高于这一水平，在没有更高已验证收入的情况下，可比支持很可能消失。
