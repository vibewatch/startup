      - number: '8.4'
        title: 决策纪律与最终尽调问题
        blocks:
          - type: paragraph
            body: |2-
                              建议是跟踪，而不是买入或回避。买入过于激进，因为 2026 年价格仍是私有信息，股本结构的瀑布未披露，能够支撑溢价倍数的单店经济性也没有进入公众视野。回避又太严厉，因为 Cosm 明显有战略动能：真实的场馆足迹、强内容合作栈、Sony 这个战略领投方，以及消费者愿意为头部体验支付高端价格的证据。

                              剩下的估值立场可以概括为偏紧。公开证据只有在狭窄解释下才能支持「合理」：2024 年独角兽标记大致维持不变，且唯一保留的收入估算方向正确。一旦 2026 年 Series C 被证明有实质估值上调，在没有对应更高、且经验证收入的情况下，公司很可能跑出保留的公开场馆可比区间。因此，本章不应被解读为否定公司质量。它是一个披露和进入纪律判断。

                              如果管理层或投资人后续披露 Series C 的准确价格、优先权栈，以及 Los Angeles、Dallas 和 Atlanta 的单店经济性，立场可能明显改变。最可能改变建议的是这些尽调项，而不是又一个泛泛的品牌或合作公告。
                          
