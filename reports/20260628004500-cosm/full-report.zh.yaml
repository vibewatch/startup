        title: Shared Reality 产品定义与无头显定位
        blocks:
          - type: paragraph
            body: >-
              与其把 Cosm 的产品理解成单块穹幕屏幕，不如把它看成可复制的 Shared Reality 运营模型。消费者侧，每个场馆把 The Dome、The Hall 和 The Deck 打包在一起，围绕 12K
              x 10K LED 显示屏提供售票座位、餐饮服务和社交观看。B2B 侧，同一家公司销售 CX System 硬件和软件，以及 Cosm Media
              制作能力。这很重要，因为客户工作流是双边的：粉丝购买一种替代亲赴比赛或演出的群体「最佳座位」体验；版权方、机构和合作伙伴则购买一种包装高端沉浸式节目的方式。核心 thesis 是无头显沉浸。Cosm 反复把
              Shared Reality 与 VR 区分开来：所有人都留在同一个房间里；它也把自己与影院区分开来：人群能量、环绕视线和接待服务是产品的一部分，不只是被投影的内容。
