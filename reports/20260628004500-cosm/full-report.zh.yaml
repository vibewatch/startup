  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻场馆与不完美替代品
        blocks:
          - type: paragraph
            body: >-
              承销 Cosm 时，不应把它只放进单一「沉浸式场馆」桶里，而要对照几类不同竞争者。最接近的直接同行是 Sphere：两者都在专门打造的沉浸式场馆里销售高端、预订座位、售票体验，并把屏幕环境本身定位为产品。IMAX
              和其他高端巨幕影院品牌是下一层最重要替代品，因为它们训练观众为更好视线和音频支付溢价；但它们无法复现 Cosm 的 Shared Reality 碗形空间、联盟特定采集角度或重接待服务的停留模型。Meow
              Wolf、ARTECHOUSE 和 teamLab 争夺体验式休闲支出、旅游时间和适合社交媒体传播的团体出游，但核心产品是探索式艺术沉浸，而不是现场体育或预约式观看。Topgolf
              处在另一条相邻赛道：它是更低价、高频的社交场馆，带餐饮、私人活动和免费比赛日观看，因此即便它是参与式而非电影式，也会争夺观赛聚会和团体活动预算。净结果是，许多替代品都不完美，这对 Cosm
              有利；但也提高了多栖消费的可能：消费者同一年可以去 Sphere、Topgolf 和 Meow Wolf，而不需要永久「切换」离开 Cosm。
