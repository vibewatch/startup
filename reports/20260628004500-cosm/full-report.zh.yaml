      - number: '2.2'
        title: 规模测算视角：直接 LBE、更广沉浸式市场与上游版权
        blocks:
          - type: paragraph
            body: >-
              出版方估算显示，Cosm 的市场必须用多重视角测算，不能只抓一个标题式 TAM。直接 location-based entertainment 方面，Grand View Research 估计全球市场 2025
              年为 $7.39B，2030 年达到 $25.90B；其更窄的 immersive-LBE 切口从 2025 年 $3.70B 起步，2033 年达到 $29.97B。MarketsandMarkets
              落在两者之间，2024 年为 $5.47B、2029 年为 $15.33B；Precedence 则把美国市场 2026 年规模定为 $2.39B。相比之下，Mordor 更广的沉浸式娱乐宇宙在 2026 年达到
              $146.92B，因为它包含主题公园、pop-up 和其他远超 Cosm 当前场馆足迹的格式。这个口径差异是必须保留的关键矛盾，而不是拿平均数抹平。第二个相邻视角也重要：S&P 估计 2026
              年全球体育媒体版权超过 $67B，这说明场馆体验从中切分的上游内容价值池有多大，但它不等于 Cosm 可直接销售的市场。公开数据因此支持的是美国场馆型 LBE 中受约束的滩头 SAM，而非精确公开 SOM。
