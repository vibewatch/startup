          detail: 没有披露复访率、忠诚度、收入结构或 CAC 回收期
      edges:
        - from: content
          to: demand
          label: 带动兴趣
        - from: demand
          to: ticket
          label: 转成购票或询价
        - from: ticket
          to: onsite
          label: 促成消费
        - from: onsite
          to: proof
          label: 产生评论和案例研究
        - from: proof
          to: demand
          label: 反哺未来认知
        - from: proof
          to: unknown
          label: 持久性公开数据缺口
    approximationNotes: 该流程是概念性的，但由来源牵引；它描述可观察的商业化路径，而不是已披露的内部漏斗。
