        title: 穹幕、LED、音频与现场制作技术栈
        blocks:
          - type: paragraph
            body: >-
              技术栈比场馆 AV 安装更深。CX System 结合了哑黑色 CX Display 穹幕、CX Engine 和 Digistar 软件、Unreal 集成，以及多通道场馆播放。合作伙伴材料显示，现场体育管线从
              Cosm 自有高分辨率采集套件开始，经过基于 AWS 的 REMI 制作、MediaConnect 传输和 CX Pro 合成，再由分布式 Dell 与 NVIDIA 渲染节点驱动穹幕和辅助 LED
              表面。这就是为什么 Cosm 可以把广播商的传统信号叠加到更沉浸的 180 度场馆视图上，而不是简单把电视画面镜像到更大屏幕。相同架构也解释了运营负担：高分辨率 ingest、同步、GPU
              余量、音频映射和转播版权时序都必须实时协同，幻觉才能成立。
