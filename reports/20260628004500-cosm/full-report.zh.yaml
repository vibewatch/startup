      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Cosm 不是只靠一个同质化门票市场变现，而是经营多条买方 - 付款方路径。第一条是消费者票务：个人粉丝和小团体购买 FIFA World Cup 比赛、NBA 比赛、电影、沉浸式艺术等头部 Shared
              Reality
              活动。第二条是赞助与品牌激活：现场用户是粉丝，预算所有者则是追求可衡量互动的营销、赞助或合作团队。第三条是私人和团体活动：雇主、代理机构、学校或社交组织者付款，场馆变成招待或客户娱乐产品。第四层来自联盟、广播商和内容合作伙伴，它们把
              Cosm 当作增量分发和呈现格式，而非大众媒体替代品。最后，房东和综合开发商不是日常购票者，但它们很重要，因为场馆选址、客流和停留时间经济性能决定该格式能否扩张到更多街区。
