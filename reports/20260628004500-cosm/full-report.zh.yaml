  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图谱与资本强度
        blocks:
          - type: paragraph
            body: >-
              Cosm 想扩张的场馆形态，介于影院、运动酒吧、转播制作设施和主题景点之间。公开来源显示，公司 2024 年以 $1B 估值融资超过 $250M，随后在 2026 年 6 月又拿到 Sony 领投的 $100M
              Series C；但这些资金要投向的铺店模型，在独立报道里估算为单店 $50M 至 $100M。关键在于，Cosm 不再只是在验证一个旗舰概念：它已经有三家美国场馆在运营，还要在尚年轻的运营底盘上叠加
              Detroit 和
              Cleveland。每新增一个穹顶，建设、餐饮人员、节目编排、转播运营、营销和本地需求风险会同时出现。近期风险不是现金跑道短，而是资本效率。如果单店利用率稳定下来慢于预期，公司即便报出视觉上亮眼、但经济性不完整的增长，仍可能快速消耗投资人资本。因此，风险登记册首先要看资本强度、由开发商节奏决定的开业排期，以及新鲜感曲线消退前，靠高端票务和高毛利接待服务吸收场馆固定成本的能力。
