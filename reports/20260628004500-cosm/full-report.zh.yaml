chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与公司足迹
        blocks:
          - type: paragraph
            body: >-
              Cosm 最准确的定位，是一家私营沉浸式娱乐平台：它既卖面向粉丝的场馆体验，也卖支撑这些体验的技术栈。公司材料把自己描述为沉浸式娱乐、媒体与技术企业；Shared Reality
              格式让观众不用戴头显，也能以群体方式感到自己在场边、球场边，或进入电影 / 艺术体验。运营模型因此不止一个穹幕场馆。Cosm 称，公司覆盖实体设计、工程、制造、软件、视听系统、运营、媒体和场馆节目编排。


              公司也大量依赖继承而来的技术厚度。官方历史页称，当前平台融合了 Evans & Sutherland、Spitz、LiveLikeVR 和
              C360；这些资产分别带来传统穹幕硬件、天文馆软件、沉浸式采集和现场活动分发能力。这也解释了公开来源里两套看似不同的身份叙事：有些报道称 Cosm 是 2020 年成立的创业公司，而 Cosm
              自己则把业务描述成建立在约 75 年前身 know-how 之上的新运营公司。如果现代公司在 2020 年成形、组件业务则更早，两种说法可以同时成立。


              地点表述没有那么整齐。Cosm 自己的公司页列出加州 El Segundo 的公司办公室；第三方资料称其总部在 Los Angeles；2024 年 7 月本地商业报道又称其位于 Playa
              Vista。后续章节最稳妥的综合表述是：Cosm 总部在洛杉矶都会区，官方公司办公室位于 El Segundo 的 888 N Douglas Street；部分较早或简写来源使用更宽泛的 Los Angeles
              或 Playa Vista 标签。这个差异足够重要，应保留为明确尽调缺口，而不是强行选择一个缺乏支撑的标签。
