      - number: '4.4'
        title: 财务判断与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务上，Cosm
              更像一个资本密集型场馆网络，外加软件和赞助上行空间，而不是轻资本内容创业公司。上行情景可见：多重收入杠杆、高端定价定位、接待服务附加收入、预售押金、战略投资人，以及一个未来可能在自营场馆之外变现的平台。挑战在于，几乎所有承销关键指标仍缺席公开证据。我们没有当前现金、月度现金消耗、单场馆到场人数、实际
              ARPU、人均餐饮、赞助经济性、版权成本，或直接抓取到的 Series C 后估值标记。甚至部分官方容量披露也会随页面区块变化；这对战略工作尚可管理，但对精确财务建模很弱。反向客户评论没有证伪
              product-market fit，却提醒人们：如果服务、排队或视线令人失望，高端票价经济性很脆弱。综合来看，公开证据支持高端体验 thesis 和重资本需求 thesis，但还不支持完整承销
              thesis。下一步尽调应先取得单场馆 P&L 和资金数据，再从品牌动能中获得估值安慰。
