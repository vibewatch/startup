  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Cosm 的直接市场不是所有沉浸式娱乐，也不是泛体育媒体。最贴近的边界，是高端线下 Shared Reality 共享观赛和活动场馆：围绕头部现场体育与娱乐，通过售票到场、餐饮、商品、赞助激活，以及团体 /
              私人活动需求变现。Cosm 自己的业务面显示，其场馆把大型体育、电影、艺术和团体活动装进大型 LED
              穹幕与相邻社交空间，并给出明确购票和活动策划路径。同样重要的是应排除什么：家庭观看订阅、标准影院放映、没有沉浸式基础设施的普通运动酒吧，以及全球体育版权支出的完整池子。这些类别会影响需求和合作伙伴经济性，但不是
              Cosm 的直接收入边界。因此，实际替代集合是剧院、运动酒吧、家庭娱乐中心和其他体验式场馆里的高端共同观赛，它们争夺的是同一个夜间外出钱包和时间分配。
