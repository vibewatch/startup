    {
      "id": "durability-concentration-and-missing-cohort-data",
      "title": "Durability, Concentration, and Missing Cohort Data",
      "body": "The customer story is investable only if the repeat-visit engine proves stronger than the public record currently shows. Today, the visible strengths are productized group sales, premium private-event inventory, multi-city sports programming, and a growing roster of sponsor or activation partners. The visible weaknesses are equally clear: no public repeat-visitation or loyalty disclosures, no ticket-to-F&B-to-sponsorship revenue mix, no cohort economics, and no disclosed repeat-booking rate for private events. There is also evidence of operational inconsistency at the edges. The Los Angeles World Cup event page advertises up to four hours of validated parking, while the Hollywood Park page says validation covers only the first three hours before paid parking begins. That kind of mismatch will not change the thesis on its own, but it underlines how easily buyer friction can show up in a premium-priced format. Netting it out, Cosm has credible demand proof for premium occasions and partner-led monetization, but still lacks the repeat-consumer and cohort evidence needed to underwrite durability with high conviction.",
