    {
      "id": "named-commercial-proof-and-partner-proxies",
      "title": "Named Commercial Proof and Partner Proxies",
      "body": "Because Cosm does not publish a roster of named repeat corporate customers or venue-level consumer cohorts, the best public proof comes from partner and activation proxies. Those proxies are still useful because they reveal who is willing to pay to use the venue, supply content to it, or associate their brand with it. On the content side, Cosm's partnership surfaces and press releases tie the experience to FOX Sports and FIFA for World Cup coverage, the NBA for long-term live-game distribution, and Cirque du Soleil plus Warner/TNT-affiliated entertainment partnerships for non-sports programming. On the commercial side, adidas became the official venue sponsor for World Cup 2026 events across Atlanta, Dallas, and Los Angeles; Monster Energy signed a multi-year venue sponsorship that includes full-dome UFC creative; and BizBash documents Toyota and NBA 2K using Cosm venues for a vehicle launch and the House of 2K All-Star activation. These are not perfect substitutes for recurring consumer retention data, but they do prove that large brands and rights-holders view Cosm as a differentiated experiential channel. The pattern also implies supplier concentration risk: if rights, sponsors, or premium IP weaken, the most visible public customer proof weakens with them.",
