  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Cosm sells immersive sports, film, and private-event experiences to a premium, experience-seeking audience rather than to a conventional SaaS-style account base. Public evidence shows four monetized customer paths: individual sports and film attendees, group buyers of 10 or more, private-event and corporate bookers, and brand or content partners such as adidas, FOX Sports, Monster Energy, Toyota, and NBA 2K. Official pages show productized group sales, private-event inventory, presale capture, mobile ticketing, in-seat ordering, and observable price bands from roughly $11-$12 Hall general admission to $104-$230 Dome reserved seating for a June 2026 World Cup match. Demand proof is strongest for premium sports inventory and branded activations, while durability proof is weakest on repeat visitation, cohort economics, and channel mix. Independent customer signal is mixed: CNET describes the Harry Potter Shared Reality format as captivating and communal, but TripAdvisor reviewers criticize Cosm Dallas for expensive tickets, high food costs, and poor service execution."
