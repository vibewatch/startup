  - FM002
- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'Cosm monetizes multiple buyer-payer paths instead of one homogeneous ticket market. The first is consumer ticketing: individual fans and small groups buy access to marquee shared-reality events such as FIFA World Cup matches, NBA games, films, and immersive art. The second is sponsorship and brand activation, where the user is the fan on site but the budget owner sits with marketing, sponsorship, or partnership teams seeking measurable engagement. The third is private and group events, where the employer, agency, school, or social organizer is the payer and the venue becomes a hospitality or client-entertainment product. A fourth layer comes from leagues, broadcasters, and content partners that use Cosm as an incremental distribution and presentation format rather than as a mass-media replacement. Finally, landlords and mixed-use developers are not everyday ticket buyers but they matter because venue placement, footfall, and dwell-time economics can determine whether the format
    scales into additional districts.'
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM042
  - CM043
