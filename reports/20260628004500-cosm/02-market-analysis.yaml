company:
  name: Cosm
chapter:
  number: 2
  title: Market Analysis
  summary: Cosm's direct market is best framed as premium out-of-home shared-reality venues for live sports, entertainment, and group events rather than the entire immersive-entertainment universe. Near-term direct market estimates diverge from roughly $3.7B to $7.4B globally and about $2.4B in the U.S., while a much broader immersive-entertainment framing exceeds $146B in 2026 because it includes theme parks and other formats Cosm does not directly serve. Demand is supported by communal sports viewing, sponsor appetite for measurable activations, and landlord interest in experiential anchors, but public data is still too thin on Cosm's pricing, occupancy, and venue-level economics to defend a precise public SOM.
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Substitutes
  body: 'Cosm''s direct market is not all immersive entertainment and it is not generic sports media. The closest boundary is premium out-of-home shared-reality viewing and event venues that monetize ticketed attendance, food and beverage, merchandise, sponsorship activation, and group/private-event demand around marquee live sports and entertainment. Cosm''s own surface area shows that its venues package major sports, films, art, and group events inside large LED domes and adjacent social spaces, with explicit pathways for ticket purchases and event planning. What should be excluded is equally important: home viewing subscriptions, standard movie exhibition, ordinary sports bars without immersive infrastructure, and the full global pool of sports rights spending. Those categories influence demand and partner economics, but they are not Cosm''s direct revenue boundary. The practical substitute set is therefore premium communal viewing at theaters, sports bars, family entertainment centers,
    and other experiential venues competing for the same night-out wallet and time allocation.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM026
  - CM042
  - CM043
  tableRefs:
  - TM001
  figureRefs:
