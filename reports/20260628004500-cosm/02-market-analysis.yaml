- id: market-sizing
  title: 'Sizing Lenses: Direct LBE, Broader Immersive, and Upstream Rights'
  body: 'Publisher estimates show why Cosm''s market must be sized with multiple lenses rather than one headline TAM. For direct location-based entertainment, Grand View Research places the global market at $7.39B in 2025 and $25.90B by 2030, while its narrower immersive-LBE cut starts at $3.70B in 2025 and reaches $29.97B by 2033. MarketsandMarkets lands between those frames at $5.47B in 2024 and $15.33B by 2029, and Precedence sizes the U.S. market at $2.39B in 2026. By contrast, Mordor''s broader immersive-entertainment universe is $146.92B in 2026 because it includes theme parks, pop-ups, and other formats far outside Cosm''s current venue footprint. That scope gap is the key contradiction to preserve rather than average away. A second adjacency lens matters too: S&P estimates global sports media rights above $67B in 2026, which shows the upstream content value pool from which venue experiences are carved, but it is not equivalent to Cosm''s direct sellable market. Public data therefore
    supports a constrained beachhead SAM in U.S. venue-based LBE, not a precise public SOM.'
  claimRefs:
  - CM006
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
