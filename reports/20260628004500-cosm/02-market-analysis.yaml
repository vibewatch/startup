  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Shared social sports viewing
    - Positive
    - Current
    - Supports ticket demand for tentpole sports where group viewing matters
    - What repeat-rate and ticket-price uplift does Cosm see on marquee sports versus films?
  - - Sponsor shift toward measurable activations
    - Positive
    - Current to medium term
    - Creates non-ticket payer pool tied to engagement and content
