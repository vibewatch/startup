- id: growth-drivers
  title: Growth Drivers and Adoption Catalysts
  body: 'Three demand drivers stand out. First, shared sports viewing remains a large behavior pool: Nielsen says Americans co-view television 47% of the time on average and sports co-viewing moves toward 50% around tentpole events, which supports the social occasion that Cosm is selling. Second, sponsors and rights holders want new monetization surfaces. Stats Perform reports that 70% of sports-media executives say sponsors now demand more digital content, while Mordor expects sponsorship and brand partnerships to outgrow the broader immersive market. Third, landlords and district developers increasingly want entertainment anchors that lift dwell time, cross-spend, and relevance outside game day. Deloitte''s 2026 sports outlook and CRE Daily''s real-estate survey both point to year-round entertainment districts and a large pipeline of experiential space. That combination helps explain why Cosm is opening near major sports and mixed-use nodes rather than as a standalone technology showroom.'
  claimRefs:
  - CM017
  - CM018
  - CM021
  - CM022
  - CM025
  - CM030
  - CM031
  - CM036
  - CM037
  - CM038
  tableRefs:
  - TM004
- id: constraints-and-gaps
  title: Constraints, Contradictions, and Diligence Gaps
  body: 'The main adoption risk is that experiential demand does not automatically translate into attractive venue economics. Industry sources repeatedly flag high upfront cost, limited scalability, regulation, content refresh burden, and safety or privacy compliance as structural friction for LBE. McKinsey also notes that smaller location-based projects tend to run at slimmer margins than destination parks or mature family entertainment centers. The substitute base is formidable: scaled incumbents such as AMC, IMAX, and Dave & Buster''s already serve premium out-of-home occasions through thousands of screens or hundreds of venues, while home streaming, high-end TVs, and social highlights absorb part of the same demand. Public comparables are also messy; for example, Topgolf is no longer a clean listed venue comp after Callaway re-centered around golf equipment. The largest remaining gap is private: Cosm does not publicly disclose venue-level pricing, utilization, F&B mix, or sponsorship
    contract values, so any public SOM model is necessarily illustrative rather than underwritten.'
  claimRefs:
  - CM019
  - CM020
  - CM024
  - CM033
  - CM034
  - CM035
  - CM039
  - CM040
  - CM041
