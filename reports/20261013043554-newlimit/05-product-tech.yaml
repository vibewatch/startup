- id: TE003
  title: Technology / operating architecture table
  columns:
  - Architecture Layer
  - Functional Role
  - Core Technical Dependency
  - Primary Failure / Risk Mode
  rows:
  - - Molecular Foundation Models
    - In silico exploration of 10^16 transcription factor combinations
    - Transfer learning from large-scale protein and genomic sequence models
    - Poor generalizability to rare non-canonical transcription factor combinations
  - - Ambrosia Multi-Task AI Engine
    - Simultaneous prediction of cell age, cell type, and biological function
    - Dense single-cell RNA perturbation training sets
    - Algorithmic hallucination or over-optimization on in vitro surrogate features
  - - Single-Cell Screening Lab
    - Wet-lab validation and active learning data generation
    - Automated high-throughput single-cell RNA sequencing infrastructure
    - Reagent batch variation and primary donor cell heterogeneity
  - - mRNA-LNP Delivery Platform
    - Encapsulation and tissue-specific in vivo delivery of reprogramming factors
    - Proprietary ionizable lipid nanoparticle chemistry and mRNA manufacturing
    - Hepatic clearance saturation and failure to achieve extrahepatic delivery
  notes: Technical infrastructure stack spanning generative machine learning models through wet-lab single-cell validation and RNA delivery.
