- id: TE002
  title: Workflow / use-case table
  columns:
  - Target Disease / User Job
  - Current Standard of Care
  - NewLimit Reprogramming Solution
  - Measurable Biological Benefit
  - Key Implementation Limitation
  rows:
  - - Alcohol-Related Liver Disease
    - Supportive abstinence therapy and corticosteroid administration
    - mRNA-LNP delivery of epigenetic reprogramming transcription factors
    - Accelerated cellular regeneration and resistance to toxic ethanol insults
    - Requires efficient non-viral delivery across fibrotic liver tissue
  - - Acute Surgical Liver Injury
    - Partial resection and passive liver regeneration monitoring
    - Pre-injury or perioperative transient transcription factor pulses
    - Statistically significant increase in postoperative hepatocyte proliferation
    - Timing window and duration of mRNA translation tightly constrained
  - - Age-Related T Cell Senescence
    - Prophylactic vaccines and supportive immuno-oncology adjuvants
    - Epigenetic reprogramming of exhausted immune effector subsets
    - Rescued regulatory activity and restored immune signaling repertoire
    - Systemic immunogenicity and potential off-target autoimmune triggers
  - - Renal Endothelial Microvascular Decline
    - Angiotensin blockade and dialysis intervention
    - Endothelial-targeted RNA therapeutic payload formulation
    - Restored glomerular filtration rate and improved animal survival in mice
    - Kidney endothelium delivery efficiency represents known biophysical hurdle
  notes: Preclinical disease models and therapeutic benchmarks evaluated across acute injury and chronic cellular aging indications.
