callouts:
  - calloutType: "insight"
    title: "Capital Compression vs. Unproven Clinical Translation"
    body: "NewLimit has aggregated over $682 million in paid-in equity in under five years, granting it an exceptionally deep balance sheet and multi-year operating runway rare among preclinical biotech startups. However, this massive capital accumulation reflects investor appetite for platform optionality and high-risk longevity science rather than derisked clinical validation, as partial epigenetic reprogramming has never been tested in humans nor approved as a therapeutic modality."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO016"
  - calloutType: "risk"
    title: "Biological Oncogenicity and Reprogramming Safety Margins"
    body: "The central biological hazard facing NewLimit's translational pipeline is the narrow margin between restorative partial epigenetic reprogramming and loss of somatic cellular identity. Complete reprogramming via classical transcription factors is known to induce teratomas and oncogenic transformation; NewLimit's proprietary mRNA-LNP formulations must demonstrate strict dosage control and transient factor expression in upcoming clinical trials to ensure tissue rejuvenation without neoplastic risk."
    claimRefs:
      - "CO004"
      - "CO014"
      - "CO016"
