company:
  name: "NewLimit"
chapter:
  number: 1
  title: "Company Overview"
  summary: "NewLimit is a preclinical biotechnology company co-founded in 2021 by Jacob Kimmel, Brian Armstrong, and Blake Byers to develop epigenetic reprogramming therapies that restore youthful cellular function. In June 2026, the company announced a $435 million Series C financing led by Founders Fund at a $3.1 billion valuation, bringing cumulative private financing to approximately $682 million to accelerate its lead liver-directed prototype candidate into first-in-human clinical testing planned for 2027."
sections:
  - id: "corporate-identity-and-foundational-mission"
    title: "Corporate Identity and Foundational Mission"
    body: "NewLimit was founded in 2021 as a private biotechnology corporation based in South San Francisco, California, operating from headquarters at 901 Gateway Boulevard with supplementary offices in Berkeley. The company was conceived around the biological thesis that organismal aging is plastic at the cellular level and driven by degradation of epigenetic regulatory marks rather than irreversible nuclear genomic loss. Rather than applying traditional symptomatic interventions after diseases manifest, NewLimit focuses on partial epigenetic reprogramming using targeted combinations of transcription factors delivered via lipid nanoparticles (LNPs) to restore youthful gene expression patterns without inducing full dedifferentiation into pluripotent stem cells. The corporate mission targets extending healthy human lifespan by developing therapeutics that directly address age-associated functional decline across metabolic, vascular, and immune tissues. Preclinical validation to date centers on proprietary computational screening and in vitro assays that have generated early prototype medicines designed to rejuvenate metabolic activity and resilience in aged human hepatocytes."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Scientific Direction, and Governance"
    body: "NewLimit's founding leadership marries computational biology, commercial technology scaling, and life sciences venture capital. Chief Executive Officer and President Jacob Kimmel, a computational stem cell biologist formerly with Calico Life Sciences, directs corporate management, computational platform architecture, and translational drug discovery pipelines. Co-founder Brian Armstrong, best known as Chief Executive Officer of Coinbase, brings major entrepreneurial capital-raising reach and executive visibility to the company's long-term financing strategy. Co-founder Blake Byers, a bioengineer and former partner at GV (Google Ventures) who also leads Byers Capital, contributes extensive early-stage biotechnology incubation experience and governance perspective. The company's advisory structure includes an assembled Scientific Advisory Board with specialized academic domain expertise in aging biology, cellular senescence, and nephrology. However, formal fiduciary board of directors composition, independent director appointments, voting control allocations, and investor committee rights remain strictly undisclosed in public registries, creating key-person governance dependence on the founding triumvirate."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-valuation-and-investor-syndicate"
    title: "Capitalization History, Valuation Trajectory, and Syndicate"
    body: "NewLimit has executed an aggressive private capitalization strategy, securing approximately $682 million in cumulative paid-in equity capital across five discrete financing events since inception. The company launched in December 2021 with roughly $100 million to $110 million in initial seed-stage commitments, followed by a $40 million Series A in May 2023 and a $130 million Series B in May 2025 led by Kleiner Perkins at an $810 million post-money valuation. In October 2025, NewLimit secured a $45 million Series B extension round that brought its valuation to $1.6 billion. Most recently, in June 2026, NewLimit announced a $435 million Series C financing round led by Founders Fund alongside new crossover and institutional participants Thrive Capital, Greenoaks, and Quiet Capital, with participation from strategic pharmaceutical venture arm Eli Lilly Ventures and returning backers Kleiner Perkins, Valor Equity Partners, and Abstract. The Series C priced the company at a post-money valuation of $3.1 billion, nearly quadrupling its capitalization baseline within fourteen months. Despite elite capitalization, NewLimit remains entirely pre-revenue, burn rates are private, and commercial revenues remain distant."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "preclinical-pipeline-and-development-milestones"
    title: "Preclinical Pipeline, Mechanistic Milestones, and Translational Timeline"
    body: "The core engine powering NewLimit's discovery pipeline is Ambrosia, an artificial intelligence platform paired with single-cell functional genomics assays and high-throughput screening to identify novel, tissue-specific transcription factor combinations. Unlike full somatic cell reprogramming using classical Yamanaka factors (Oct4, Sox2, Klf4, c-Myc) which carries severe oncogenic and teratoma formation risks, NewLimit's partial reprogramming paradigm aims to reset aged epigenetic states while strictly preserving specialized somatic cell identity. The company's lead preclinical program targets liver tissue, where an mRNA-LNP prototype formulation utilizing fewer than ten transcription factors demonstrated reversal of cellular aging signatures, improved fat and alcohol metabolism, and accelerated injury recovery in human cell models and rodents. While early corporate roadmaps projected a decade-long runway before entering the clinic, management substantially accelerated its timeline in mid-2026, targeting initial human Phase 1 safety trials in fatty liver disease and alcohol-related liver disease for 2027, with exploratory pipelines advancing in vascular and immune cells."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
