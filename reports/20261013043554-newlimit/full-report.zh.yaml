      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本充裕，但临床转化仍未经验证
            body: >-
              NewLimit 在不到五年内累计获得超过 $682 million
              的实缴股权资本，因此拥有临床前生物科技初创公司少见的深厚资产负债表和多年运营资金。然而，这种大规模资本积累反映的是投资人对平台选择权和高风险长寿科学的偏好，而不是已经去风险的临床验证，因为部分表观遗传重编程从未在人体中测试，也未获批成为治疗方式。
            calloutType: insight
            claimRefs:
              - CO009
              - CO010
              - CO016
          - type: callout
            title: 生物致癌性与重编程安全边界
            body: >-
              NewLimit 转化管线面临的核心生物学风险，是恢复性部分表观遗传重编程与体细胞身份丧失之间的狭窄安全边界。已知经典转录因子进行完整重编程会诱发畸胎瘤和致癌转化；NewLimit 的专有 mRNA-LNP
              配方必须在即将开展的临床试验中证明剂量控制严格、因子表达具有短暂性，才能确保组织年轻化而不带来肿瘤风险。
            calloutType: risk
            claimRefs:
              - CO004
              - CO014
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 治疗范围、监管边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              表观遗传重编程疗法的商业边界，取决于无限制的生物学愿景与成熟临床监管路径之间的巨大运营差异。包括 FDA
              在内的卫生监管机构并不承认生物衰老或细胞衰老是可治疗的首要疾病适应症，因此不能把市场规模简单按全球长寿干预这一未区分的大类来评估。药物开发商必须在具体、带诊断编码的疾病标签下推进候选药物，这些标签需要具备经过验证的替代终点、符合
              FDA 21 CFR Part 312 的清晰试验设计，以及被认可的报销机制。对 NewLimit
              而言，这一结构性要求将近期商业范围限制在高未满足需求的器官特异性病理上，主要包括代谢功能障碍相关脂肪性肝炎（MASH）、代谢功能障碍相关脂肪性肝病（MASLD）和酒精相关肝病（ARLD），并辅以血管内皮和 T
              细胞免疫学方向的探索项目。这些核心适应症的现有治疗主要依靠标准诊疗干预，包括生活方式调整、代谢调节剂、GLP-1
              受体激动剂、免疫抑制方案和器官移植。表观遗传重编程希望直接重置基因表达标记，恢复患病组织年轻时的再生和代谢能力，从而替代姑息性或控制症状的药物。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模框架：TAM、SAM 与可触达患者群体
        blocks:
          - type: paragraph
            body: >-
              评估表观遗传细胞年轻化的商业潜力，需要用多重视角建立严谨的规模框架，把推测性平台机会与临床可触达市场分开。总可触达市场（TAM）这一层，管理层评论经常声称，能够逆转细胞年龄的疗法所对应的机会，比传统疗法大几个数量级，因为细胞功能衰退是几乎所有慢性退行性疾病的底层原因。此外，流行病学估计显示，脂肪肝影响全球成年人口约
              25%，而 60
              岁以上成年人中约一半会出现代谢综合征。但要把庞大的流行病学人群转化为可触达的治疗市场，仍需严格的临床筛选。可服务市场（SAM）这一层，商业支出受限于已确诊且病情进展、正在接受临床治疗的纤维化肝病患者亚群；对他们而言，每三周一次的静脉脂质纳米颗粒
              mRNA 输注，才可能同时具备经济可行性和临床紧迫性。可服务可获得市场（SOM）还会受到临床试验筛选、研究性新药许可、Altos Labs
              等资本充足的长寿同行进入，以及专科肝病科和三级学术医疗中心渗透率的进一步限制。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
