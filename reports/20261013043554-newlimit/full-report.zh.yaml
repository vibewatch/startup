              - CR006
              - CR007
              - CR010
      - number: '7.2'
        title: 递送物理学、LNP 知识产权与平台依赖
        blocks:
          - type: paragraph
            body: >-
              肝脏项目与整个技术平台承担的递送风险并不相同。MenFem
              将肝外递送认定为最脆弱的环节，并称四个项目中有三个依赖它；其引用的肾内皮结果来自体外实验，不能证明在动物或患者体内实现了功能性递送。同一来源称，NewLimit 已实现 LNP-mRNA 配方内部化，并在
              2026 年 3 月完成首个大规模批次的 20%。这一里程碑说明公司在积极降低风险，但不代表已经具备 GMP 就绪度、放行收率、灌装产能或临床供应可靠性。Fierce Biotech 独立描述了主力资产的
              LNP-mRNA 转录因子设计，确认递送和生产是核心依赖，而不是外围工具。MenFem 还指出 LNP 专利丛林；但已审阅来源没有披露 NewLimit
              特有的自由实施意见。因此，非肝脏拓展的剩余风险很高，主力项目的 CMC 时间表也面临实质风险。
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.3'
        title: 估值速度、报销架构与治理集中
        blocks:
          - type: paragraph
            body: >-
              资本可得性是优势，但不等于已披露的现金跑道。独立来源报告 NewLimit 完成 $435 million Series C、估值 $3.1 billion，累计融资则从 $682 million 到约 $750
              million 不等；但已募集资金不等于可用现金。已审阅记录没有提供经审计现金、现金消耗、融资条款，或撑到 Phase 1 读出的现金跑道。之所以重要，是因为 2027 年首次人体试验目标，相比早先认为可能等到
              2030 年才测试的预期明显提前。商业风险同样未解：MenFem 将 NewLimit 描述为尚无收入且没有客户，Excedr 则解释衰老本身不是 FDA 适应症。包括 Eli Lilly Ventures
              在内的投资人参与，提供资本和选择权，但不能证明存在授权或开发合作。MenFem 还报告机器学习负责人于 2025 年离职，这给一家平台论点依赖计算筛选的公司带来可持续监测的关键人风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
