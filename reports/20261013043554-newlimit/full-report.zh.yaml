              NewLimit 的商业轨迹呈现出鲜明反差：私人资本积累异常雄厚，却完全没有传统收入增长。公司由 Brian Armstrong、Blake Byers 和 Jacob Kimmel 于 2021
              年创立，2026 年 6 月完成由 Founders Fund 领投的 $435 million Series C，使投后估值升至 $3.1 billion。种子轮、Series A、Series B 和
              Series C 累计融资已超过 $682 million。尽管资本支持顶级，NewLimit 的商业收入严格为零，付费客户也为零。公司本质上仍是研发平台，利用专有 Ambrosia
              机器学习筛选模型寻找能够恢复年轻表观遗传调控的转录因子组合。管理层在人体细胞中观察到肝细胞年轻化的临床前结果后，加快了预计的临床开发时间表，承诺在 2027 年启动首次人体 Phase 1
              临床试验。在临床安全性和疗效数据出现前，商业采用指标完全不存在。
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU011
