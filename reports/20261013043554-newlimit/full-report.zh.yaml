      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 致癌性重编程风险与靶点特异性
            body: 细胞年轻化的首要生物学瓶颈，是在重置表观遗传年龄的同时保留细胞身份。完整重编程有形成畸胎瘤的风险，因此必须把部分重置方案严格限制在安全边界内。
