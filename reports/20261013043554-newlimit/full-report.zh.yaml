      - number: '6.3'
        title: 具名合作伙伴证明与临床部署架构
        blocks:
          - type: paragraph
            body: >-
              公开申报和商业目录显示，NewLimit 尚没有生产部署、签署的客户合同或与医院系统达成的商业试点协议。对早期治疗企业而言，最初的客户证明通常来自战略性企业生物制药合作和潜在临床试验队列。Eli Lilly
              Ventures 参与 NewLimit 的 Series C，是其细胞重编程技术获得外部企业验证的主要来源。战略制药投资为 NewLimit 带来有价值的转化洞察，也让 Eli Lilly
              得以提前了解候选疗法，为未来的引进授权或共同开发创造机会。在患者端，NewLimit 的首次临床部署将发生在计划于 2027 年开展、面向脂肪肝患者的 Phase 1 安全性试验中，随后在酒精相关肝病中开展
              Phase 2 项目。临床前模型表明，NewLimit 的主力原型能增强肝脏再生能力和代谢应激韧性，但具体的机构客户采用仍取决于临床执行成功。
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
