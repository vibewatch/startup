  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从计算机模拟预测建模到大规模 mRNA-LNP 治疗配方的多层技术与运营栈。
    approximationNotes: 平台软件、生物发现和生物工艺制造层的概念性表示。
    claimRefs:
      - CE014
      - CE015
    data:
      layers:
        - label: 第 1 层：基因组与表观基因组筛选
          detail: 对老年人原代肝细胞、T 细胞和肾内皮细胞进行单细胞 RNA 测序和扰动筛选。
        - label: 第 2 层：分子基础模型
          detail: 从蛋白质和分子基础模型迁移学习，评估约 10^16 种可能的转录因子组合。
        - label: 第 3 层：Ambrosia 计算机模拟发现引擎
          detail: 多任务主动学习系统，在计算机模拟中预测细胞年龄、细胞身份保持情况和功能性表型恢复。
        - label: 第 4 层：实验室闭环迭代验证
          detail: 迭代筛选周期产生生物学扩展规律：随着观测到的筛选命中增加，载荷质量按对数线性提升。
        - label: 第 5 层：载荷优化与选择
          detail: 组合式先导选择，确保完全避免致癌性多能性和类似 Yamanaka 的去分化。
        - label: 第 6 层：mRNA 与 LNP 配方工程
          detail: 将识别出的转录因子 mRNA 配制成靶向脂质纳米颗粒，以实现组织特异性的体内递送。
        - label: 第 7 层：试点生物工艺制造
          detail: 在正式开展 IND 支持性安全性研究前，转入临床候选药物的试点和大规模制造。
