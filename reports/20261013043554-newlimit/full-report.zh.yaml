      - number: '1.2'
        title: 管理层、科学方向与治理
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的创始团队将计算生物学、商业技术规模化和生命科学创投结合起来。CEO 兼总裁 Jacob Kimmel 是计算干细胞生物学家，曾任职于 Calico Life
              Sciences，负责公司管理、计算平台架构和转化药物发现管线。联合创始人 Brian Armstrong 以 Coinbase CEO
              身份最为人熟知，为公司的长期融资策略带来强大的企业家融资能力和高管影响力。联合创始人 Blake Byers 是生物工程师、前 GV（Google Ventures）合伙人，同时领导 Byers
              Capital，为公司带来丰富的早期生物科技孵化经验和治理视角。公司的顾问体系包括一支组建完成的科学顾问委员会，成员具备衰老生物学、细胞衰老和肾脏病学专业背景。不过，正式的受托董事会构成、独立董事任命、投票控制分配以及投资人委员会权利，在公开登记资料中均严格未披露，公司的治理因此依赖三位创始人组成的核心团队。
            claimRefs:
