      - number: '1.3'
        title: 资本化历程、估值轨迹与投资人组合
        blocks:
          - type: paragraph
            body: >-
              NewLimit 采取激进的私募资本化策略，自成立以来通过五次独立融资累计获得约 $682 million 的实缴股权资本。公司于 2021 年 12 月启动，初始种子承诺约为 $100 million 至
              $110 million；随后于 2023 年 5 月完成 $40 million 的 Series A，并于 2025 年 5 月完成由 Kleiner Perkins 领投的 $130 million
              Series B，投后估值为 $810 million。2025 年 10 月，NewLimit 又完成 $45 million 的 Series B 延长轮，估值升至 $1.6 billion。最近，公司于
              2026 年 6 月宣布完成由 Founders Fund 领投的 $435 million Series C，新加入的跨阶段和机构投资人包括 Thrive Capital、Greenoaks 和 Quiet
              Capital；战略制药投资部门 Eli Lilly Ventures，以及老股东 Kleiner Perkins、Valor Equity Partners 和 Abstract 也参与其中。Series C
              将公司投后估值定为 $3.1 billion，十四个月内几乎将资本化基线提高了四倍。尽管资本实力突出，NewLimit 仍完全没有收入，现金消耗率属于私人信息，商业收入也仍很遥远。
