  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 立场 / 评级
      - 关键证据与理由
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 在 Series C 阶段，临床前人体肝细胞中的突破已证明生物活性，但仍没有任何人体临床安全性数据。
        - 在 IND 申报和 I 期试验获批公开记录前，暂缓直接投入资本。
      - - 信心
        - 中
        - Founders Fund 和 Kleiner Perkins 的机构支持确认了融资渠道，但不透明的私营财务信息限制了判断精度。
        - 持续跟踪技术进展，并与投资者联盟接洽以获取主要试验方案。
      - - 风险评级
        - 高
        - 人体转化有效性尚未验证，脱靶转录因子激活还可能带来致癌风险。
        - 任何二级市场进入都应设置严格的里程碑闸门和下行清算优先权保护。
      - - 估值立场
        - 昂贵
        - Series C 的 $3.1B 投后估值，在尚无商业证明的情况下计入了大额长期平台溢价。
        - 严格控制进入估值；若没有临床读出，拒绝无定价认股权证或无上限的后续轮次。
    notes: 评级综合了 Series C 定价、机构投资者联盟的信念，以及公开披露的临床前开发阶段。
    claimRefs:
      - CV001
      - CV004
      - CV005
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 论点
      - 反论点
      - 哪些变化会改变判断
    rows:
      - - 生物学机制
        - 部分表观遗传重编程能恢复多种组织类型的年轻细胞功能，同时不诱发致癌性去分化。
        - 重编程机制可能存在保真度不足、基因组不稳定，以及体内潜在致瘤风险。
        - 在非人灵长类中证明组织持续体内年轻化，且不形成畸胎瘤。
      - - 市场机会
        - 以 GLP-1 类似的方式靶向上游衰老生物学，可覆盖代谢、血管和免疫疾病等广泛多病种适应症。
        - 生物衰老尚无成熟的 FDA 监管审批路径，因此必须依赖狭窄的单器官适应症。
        - FDA 正式接受衰老生物标志物替代终点，或接受肝病加速试验设计。
      - - 资本与续航
        - 深科技和制药投资者联盟累计募集 $682M，可提供多年续航，以应对早期研发失败。
        - 40+ 人团队和多资产筛选带来的异常高资本强度，可能在临床里程碑前迅速消耗现金。
        - 收到经审计现金余额证明，显示续航 36+ 个月；或获得大型非稀释性制药授权预付款。
      - - 执行与递送
        - 脂质纳米颗粒 mRNA 递送借助 mRNA 疫苗这一临床验证过的模式，实现靶向肝细胞摄取。
        - 系统性递送至肝脏之外的血管和免疫细胞，在技术上仍未经验证，并具有免疫原性。
        - 公布药代动力学数据，证明非肝组织能高效分布，且没有系统性毒性。
    notes: 论点框架将核心科学和商业支柱与技术尽调反论点进行对照。
    claimRefs:
      - CV003
      - CV006
      - CV007
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - I 期试验于 2027 年进入临床；肝脏候选药物显示安全性良好，并带来可量化的功能性生物标志物恢复；签署制药公司期权协议。
        - 估值扩张至 $6.0B-$8.0B（2.0x-2.6x MOIC）；为高价值交叉轮融资或 IPO 窗口铺路。
        - 监管暂停试验或 IND 审批延迟，使首次人体数据推迟到 2028 年以后。
        - 25%（要求临床前到临床转化毫无瑕疵）
      - - 基准情景
        - I 期安全性研究于 2027 年启动但推进谨慎；生物学读出含义不明；需要追加融资。
        - 估值持平于 $3.1B-$3.5B（1.0x-1.1x MOIC）；小幅上调取决于临床队列扩展。
        - 资本强度要求在生物科技市场环境趋紧时进行 Series D 轮融资。
        - 50%（反映早期生物科技的标准淘汰率）
      - - 悲观情景
        - IND 支持性毒理学中出现脱靶毒性或严重递送限制；肝病试验延迟或暂停；现金消耗很高。
        - 估值收缩至 $1.0B-$1.5B（下降 -50% 至 -68%）；可能进行下轮重组融资。
        - 平台溢价完全消失；投资者联盟执行激进的清算优先权。
        - 25%（生物学未经验证，且转录因子载荷复杂）
    notes: 情景基于 I 期 IND 执行和私募市场条件，对未来 24 至 36 个月的结果进行预测。
    claimRefs:
      - CV008
      - CV009
      - CV010
