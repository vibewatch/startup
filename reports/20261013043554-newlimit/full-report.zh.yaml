      - - LNP / mRNA 生态
        - 脂质、mRNA、灌装、许可和制造供应商
        - 制造和递送主资产所需的投入与权利
        - 扩产延迟、供应短缺或不利的自由实施结论
        - 高
        - 内部 LNP-mRNA 配方能力
        - 大规模批次完成情况和 NewLimit 特有的自由实施仍未经验证
    notes: 按分析师评估的严重性排序。已募集资金不等于可用现金，投资者参与也不等于商业合作。
