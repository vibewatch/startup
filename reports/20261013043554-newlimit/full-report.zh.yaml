  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的技术架构建立在这样的生物学前提上：细胞衰老由表观遗传标记的可逆性退化驱动，包括 DNA 甲基化模式和染色质结构改变，而非不可逆的基因突变。为寻找能够重置细胞年龄、又不会诱发 Yamanaka
              因子介导的完全去分化的转录因子组合，公司开发了专有的计算机模拟平台 Ambrosia。Ambrosia 在约 2,000 个人类基因产生的约 10^16
              种转录因子组合这一庞大理论组合空间中运行，利用分子基础模型的迁移学习和高通量单细胞扰动筛选。系统采用多任务学习配置，同时预测细胞年龄、细胞类型保真度和特定功能表型恢复情况，相比基线湿实验筛选活动将发现效率提高一倍。计算机模拟筛选得到的发现，会通过实验室闭环实验直接验证，并建立对数线性的生物学规模规律：随着筛选数据累计，主力递送载荷的效力可预测地提升。
            claimRefs:
