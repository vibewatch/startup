              的靶向脂质纳米颗粒配方，把细胞重编程发现转化为器官特异性候选药物。主力开发项目聚焦人体肝细胞，目标适应症包括酒精相关肝病和急性手术性肝损伤；在这些情况下，组织再生能力会随生物年龄显著下降。NewLimit
              在临床前模型中证明，其主力肝脏重编程载荷具有功能多效性：既能在手术损伤后恢复加速的再生修复，也能赋予细胞抵抗酒精诱发代谢毒性的韧性。除主力肝脏资产外，平台还包含免疫项目，该项目已筛出十九种能够挽救老年 T
              细胞调控活性的载荷；另有血管项目，在受损的老年小鼠模型中评估肾内皮屏障完整性和肾小球滤过率。每种候选配方都使用组织趋向性脂质纳米颗粒，实现转录因子的短暂表达，避免永久性基因组整合或持续暴露于病毒载体。
