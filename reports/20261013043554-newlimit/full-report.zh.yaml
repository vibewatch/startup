              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 论点失效触发条件与终止标准
            body: >-
              建议的终止标准包括：人体试验中出现任何与治疗相关的致瘤性，或细胞身份出现具有临床意义的丧失；在向血管或免疫项目投入大量资本前，未能建立体内功能性肝外递送；或者错过既定的 2027
              年首次人体试验目标后，无法在惩罚性条款下为人体安全性读出融资。监测指标包括 IND 获受理、首位患者给药、剂量限制性毒性、持久的细胞身份标志物、批次放行成功，以及披露到下一次临床读出的现金跑道。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与尽调建议
        blocks:
          - type: paragraph
            body: >-
              NewLimit 是长寿科学领域资本最充足的私人生命科学平台型公司之一。在 2026 年 6 月由 Founders Fund 领投 $435 million 的 C 轮融资后，公司累计股权融资达到 $682
              million。此轮融资将公司投后估值定在 $3.1 billion，较 12 个月前的 B 轮估值大幅提升三倍。公司的核心科学论点——部分表观遗传重编程能够
              在不诱发致癌性去分化的情况下恢复年轻时的再生能力——在机制上颇具说服力，但 NewLimit 仍是一家 完全处于临床前阶段的公司。目前没有人体试验数据来验证体内疗效或治疗指数，当前估值反映的是技术
              跨界叙事溢价，而不是商业风险已经解除。因此，我们给出“继续研究”建议，风险评估为高、估值判断为 昂贵，并建议潜在投资者坚持严格的定价门槛，等正式监管里程碑获批后再投入新资本。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
      - number: '8.2'
        title: 科学论点、反论点与转化障碍
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的核心投资论点是：与不可逆的体细胞突变相比，年龄相关的生理衰退更多由可塑的表观遗传 退化驱动。NewLimit 计划将包裹在脂质纳米颗粒中的 mRNA 递送至细胞，携带专有转录因子载荷，
              部分重置细胞基因表达模式，从而恢复肝脏等目标组织的代谢活力和再生能力。在临床前模型中，公司 证明原型 payload 能增强老年人肝细胞的肝脏再生和损伤韧性。不过，投资反论点指出了显著的生物学
              和监管阻力：把转录因子重编程转化到活体人体，存在表型保真度不完整、脱靶表观遗传改变，以及细胞 退回不受约束的多能状态后发生致癌性转化的固有风险。此外，FDA 不承认衰老本身为疾病适应症， NewLimit
              只能转向酒精相关性肝病、代谢功能障碍等更窄的器官特异性适应症，这会拉长临床开发周期，也会增加适应症执行风险。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
      - number: '8.3'
        title: 估值背景、可比公司与情景分析
        blocks:
          - type: paragraph
            body: >-
              在 $3.1 billion 投后估值下，NewLimit 的估值画像可与 Altos Labs（$3.0 billion 实缴资本）相比，也远高于传统风险投资支持的临床前生物科技公司；后者在 A 轮或 B
              轮通常定价在 $150 million 至 $400 million 之间。这个倍数包含了异常高的平台溢价，背后有知名科技创始人和 Kleiner Perkins、Thrive Capital、Eli Lilly
              Ventures 等跨界风险基金的资金支持。为评估未来回报的不对称性，我们以 24 至 36 个月为期设定三种运营情景。乐观情景下，NewLimit 于 2027 年成功启动人体 1 期试验且
              安全性良好，平台得到验证，估值扩大至 $6.0 至 $8.0 billion。基准情景下，试验启动较为谨慎，替代终点读数存在歧义，估值基本持平在 $3.1 至 $3.5
              billion。悲观情景下，递送障碍或意外的免疫原性毒性迫使试验延迟，后续资本重组期间估值大幅收缩至 $1.0 至 $1.5 billion。
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: 退出准备度、尽调要求与决策逻辑
        blocks:
          - type: paragraph
            body: >-
              鉴于 NewLimit 仍为私人公司且处于临床前阶段，其最终流动性路径主要有两种：在生物科技市场周期 有利时公开上市，或被寻求前沿再生资产的全球大型制药公司整体收购。不过，近期退出准备度很低：
              公司没有商业收入，人体疗效尚未测试；没有临床 1 期药代动力学和安全性读数，IPO 也无法可信定价。 具备确认作用的尽调必须聚焦三项关键内容：第一，核实 2027 年肝脏试验的正式 IND 申报前安全性资料
              和临床方案细节；第二，审计 C 轮融资后的现金储备和月度净现金消耗，确认公司拥有经过核实的多年 运营周期；第三，厘清专有转录因子载荷以及脂质纳米颗粒制剂递送专利的知识产权边界。在这些
              参数得到解决前，坚持严格的“继续研究”立场，能够保护资本免受估值下行压缩。
            claimRefs:
              - CV004
              - CV007
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV013
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 审慎立场：C 轮入场时继续研究
            body: 鉴于 $3.1 billion 的估值以及缺乏人体临床数据，投资者应抵制 FOMO 驱动的跨界融资轮，在投入资本 前要求取得 IND 受理并拿到肝脏 1 期试验的初步安全性证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
          - type: callout
            title: 未经验证的生物学带来的下行脆弱性
            body: 在投向推测性部分重编程生物学的资金超过 $682 million 的情况下，任何临床暂停或肝脏 1 期试验 失败，都可能在后续资本重组中触发 50% 至 70% 的估值倍数压缩。
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
              - CV010
