              FDA 等成熟监管机构可以评估的可测临床终点，为机构医疗报销建立清晰路径。未来管线计划瞄准慢性肾病中的微血管内皮衰退，以及自身免疫疾病中的 T 细胞耗竭，从而把潜在的机构客户基础扩展到肾脏病学和临床免疫学领域。
