      - number: '3.2'
        title: 平台能力与差异化持续性
        blocks:
          - type: paragraph
            body: >-
              细胞重编程领域的核心科学分界，在于完整去分化与部分表观遗传重置的区别。经典 Yamanaka 因子重编程会把体细胞倒推回类似胚胎的诱导多能干细胞状态，由此带来畸胎瘤和恶性肿瘤形成等严重致癌风险。NewLimit
              的技术差异化在于部分重编程：通过装载 mRNA 的脂质纳米颗粒递送少于十种转录因子的特定组合，在严格保留体细胞身份的同时，恢复年轻的代谢基因调控。为发现这些因子组合，NewLimit
              开发了专有的多任务计算筛选引擎 Ambrosia，用计算机模拟重编程结果。NewLimit 将 Ambrosia 与高通量单细胞实验结合，据称在包含 10^16
              种可能转录因子组合的搜索空间中，把发现命中率提高了一倍。Altos Labs 等直接同行拥有相当的科学人才，但 NewLimit 已将主力肝细胞候选药物推进至大规模生产，领先于计划中的 2027 年 Phase
              1 临床试验，同时把发现范围扩展到肾血管内皮细胞和免疫 T 细胞，形成了不同的开发速度。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
