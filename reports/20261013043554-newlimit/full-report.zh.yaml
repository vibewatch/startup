        - id: capital-scale
          label: 资本规模与投资者联盟
          detail: 5 轮累计募集超过 $682M，其中包括 Founders Fund 领投的 $435M Series C。
        - id: preclinical-proof
          label: 临床前突破
          detail: 原型 mRNA 载荷逆转老年人肝细胞中的细胞年龄标志物。
        - id: clinical-gap
          label: 转化现实缺口
          detail: 尚未完成任何人体临床试验；计划于 2027 年进入 I 期试验。
        - id: valuation-premium
          label: $3.1B 估值标记
          detail: Series C 定价为前一年估值的 3 倍，计入了较高的平台期权价值。
        - id: downside-asymmetry
          label: 下行风险不对称
          detail: 高现金消耗和未经验证的临床安全性带来显著的估值倍数压缩风险。
        - id: final-recommendation
          label: 继续研究立场
          detail: 保持跟踪；在投入资本前等待 IND 申报获批和临床安全性数据。
    approximationNotes: 逻辑流程构建的是定性决策阈值，而非连续数学函数。
