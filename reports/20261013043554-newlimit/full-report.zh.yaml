chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与基本使命
        blocks:
          - type: paragraph
            body: >-
              NewLimit 于 2021 年成立，是一家总部位于加州 South San Francisco 的私营生物科技公司，主址在 901 Gateway Boulevard，并在 Berkeley
              设有补充办公室。公司基于这样的生物学判断起步：机体衰老具有细胞层面的可塑性，主要由表观遗传调控标记退化驱动，而非不可逆的细胞核基因组损失。NewLimit
              不在疾病出现后再做传统的对症干预，而是通过脂质纳米颗粒（LNP）递送定向转录因子组合，进行部分表观遗传重编程，恢复年轻的基因表达模式，同时避免细胞完全去分化为多能干细胞。公司使命是开发直接应对代谢、血管和免疫组织年龄相关功能衰退的疗法，延长人类健康寿命。截至目前，临床前验证主要依托专有计算筛选和体外实验，已产生旨在恢复老年人肝细胞代谢活性与韧性的早期候选药物。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
