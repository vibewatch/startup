            body: >-
              NewLimit
              面临的首要技术和临床风险，是对细胞身份的精准控制。部分重编程处于狭窄的治疗窗口内：转录因子激活不足，无法恢复年轻的再生功能；激活过度或不受控制，则可能造成体细胞去分化、畸胎瘤形成和致癌。由于美国食品药品监督管理局不正式承认衰老是疾病适应症，公司必须先在酒精相关肝病等明确认可的病理中证明安全性和治疗效果，才能测试更广泛的长寿主张。外部尽调缺口也进一步阻碍临床前转化：详细的方案级文档、已完成的
              IND 支持安全资料包、非人灵长类的毒理学安全边际以及具体试验地点选择，仍严格保密。证明短暂的 mRNA-LNP 递送能够在人体患者中安全复现小鼠模型观察到的功能性细胞年轻化，是评估该平台时的关键障碍。
