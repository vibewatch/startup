      - number: '6.4'
        title: 持久性、监管障碍与客户旅程扩展
        blocks:
          - type: paragraph
            body: >-
              表观遗传医学从临床前发现走向可持续商业采用，必须跨过严峻的科学、监管和采购障碍。细胞重编程的根本风险在于生物学精准度：转录因子暴露过度会剥离体细胞谱系身份，带来严重的肿瘤发生和致癌转化风险。证明通过脂质纳米颗粒递送的短暂
              mRNA 能带来持久的表观遗传年轻化，同时不诱发恶性去分化，是机构医疗服务方接受该疗法的首要障碍。此外，监管机构不承认生物衰老是可治疗疾病，NewLimit
              必须应对严格的疾病特异性审批流程、复杂的卫生经济学审查，以及正式的药事与治疗委员会评估。长期商业持久性取决于证明疗效能维持数月，以支持可管理的静脉给药间隔。如果 Phase 1
              试验显示人体安全性可接受，NewLimit 就可以通过授权其筛选平台，并与全球制药合作伙伴共同开发更广泛的代谢和自身免疫项目，打开扩张路径。
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU011
              - CU012
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 临床前现实：$3.1B 估值背后没有商业牵引
            body: >-
              NewLimit 融资 $682 million、估值达到 $3.1 billion，却没有一个付费客户、商业合同或已完成的临床试验。公司未来收入完全取决于在计划于 2027
              年开展的人体试验中证明安全性和治疗效果。
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU008
          - type: callout
            title: 适应症特异的排序是商业入口
            body: NewLimit 不追求无法分类的“抗衰老”终点，而是瞄准具体的急性和慢性肝病，由此为 FDA 评估、医院处方集采用和机构支付方报销建立清晰的临床路径。
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 转化生物学、致癌性与目标适应症不确定性
        blocks:
          - type: paragraph
            body: >-
              最大风险在于能否把细胞和动物中的结果转化到患者身上。Biotech Insider 将精准控制称为核心问题：过度重编程可能抹去细胞身份，而 Excedr 指出完整重编程可能导致肿瘤形成。NewLimit 2026
              年 3 月的更新称老年动物的再生能力改善、肝损伤减轻，但这份公司发布的证据不是人体安全性或疗效证据。根据已审阅记录，监管切入点也尚未完全确定。Yahoo Finance 报道 Phase 1
              招募脂肪肝患者、Phase 2 针对酒精相关肝病，而另一份公司简介则把酒精相关肝病列为首次试验目标。衰老本身不是获批疾病适应症，因此常规疾病终点、可接受的毒理学资料包和一致的方案披露，都是必须跨过的门槛。在
              IND 获受理、人体安全性数据建立治疗窗口之前，剩余风险仍然很高。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
