      - number: '1.4'
        title: 临床前管线、机制里程碑与转化时间表
        blocks:
          - type: paragraph
            body: >-
              NewLimit 发现管线的核心引擎是 Ambrosia：一个结合单细胞功能基因组学实验和高通量筛选的人工智能平台，用于识别新型、组织特异性的转录因子组合。经典 Yamanaka
              因子（Oct4、Sox2、Klf4、c-Myc）进行完整体细胞重编程时，存在严重的致癌和畸胎瘤形成风险；NewLimit
              的部分重编程路径则希望重置老化的表观遗传状态，同时严格保留专门化体细胞身份。公司的主力临床前项目聚焦肝组织，一种使用少于十种转录因子的 mRNA-LNP
              原型配方，已在人体细胞模型和啮齿动物中显示出逆转细胞衰老特征、改善脂肪与酒精代谢并加速损伤恢复的结果。公司早期路线图原本预计十年后才进入临床，但管理层在 2026 年年中大幅加快时间表，目标是在 2027
              年针对脂肪肝和酒精相关肝病启动首次人体 Phase 1 安全性试验，同时推进血管和免疫细胞方向的探索性管线。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
