    title: "Oncogenic Reprogramming Risk and Target Specificity"
    body: "The primary biological bottleneck in cellular rejuvenation is preserving cell identity while resetting epigenetic age. Full reprogramming risks teratoma formation, necessitating tightly bounded partial reset protocols."
    claimRefs:
      - "CP004"
      - "CP006"
  - calloutType: "insight"
    title: "Indications-First Regulatory Navigation"
    body: "Because FDA frameworks do not recognize biological aging as a treatable disease, commercial viability requires demonstrating efficacy in defined metabolic or organ-specific clinical indications."
    claimRefs:
      - "CP009"
      - "CP010"
