        title: Exhibits
        blocks:
          - type: callout
            title: 'The Preclinical Reality: Zero Commercial Traction Behind a $3.1B Valuation'
            body: >-
              NewLimit has raised $682 million and achieved a $3.1 billion valuation without a single paying customer,
              commercial contract, or completed clinical trial. The company's future revenue is entirely dependent on
              proving safety and therapeutic efficacy in human trials planned for 2027.
            calloutType: risk
