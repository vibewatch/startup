      - number: '6.2'
        title: Capitalization Trajectory Versus Commercial Pre-Revenue Reality
        blocks:
          - type: paragraph
            body: >-
              NewLimit's commercial trajectory presents a sharp contrast between extraordinary private capital
              accumulation and the complete absence of traditional revenue traction. Founded in 2021 by Brian Armstrong,
              Blake Byers, and Jacob Kimmel, the venture closed a massive $435 million Series C financing round in June
              2026 led by Founders Fund, driving its post-money valuation to $3.1 billion. Lifetime funding now exceeds
              $682 million across seed, Series A, Series B, and Series C investments. Despite this elite capital
              backing, NewLimit records exactly zero dollars in commercial revenue and zero paying customers. The
              company operates strictly as a research and development platform deploying its proprietary Ambrosia
              machine learning screening model to identify transcription factor combinations capable of restoring
              youthful epigenetic regulation. Management accelerated its projected clinical development timeline
              following preclinical demonstrations of hepatocyte rejuvenation in human cells, committing to initiate
              first-in-human Phase 1 clinical trials in 2027. Until clinical safety and efficacy data emerge, commercial
              adoption metrics remain entirely non-existent.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU011
