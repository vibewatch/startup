      - number: '5.2'
        title: Pipeline Assets & Delivery Mechanisms
        blocks:
          - type: paragraph
            body: >-
              The company therapeutic pipeline translates cellular reprogramming discoveries into organ-specific drug
              candidates through targeted lipid nanoparticle formulations delivering modified messenger RNA. The lead
              development program focuses on human hepatocytes, targeting indications such as alcohol-related liver
              disease and acute surgical hepatic injury where regenerative capacity declines sharply with biological
              age. In preclinical models, NewLimit demonstrated that its lead liver reprogramming payloads exhibit
              functional pleiotropy, concurrently restoring accelerated regenerative healing following surgical injury
              and conferring cellular resilience against alcohol-induced metabolic toxicity. In addition to the primary
              liver asset, the platform encompasses an immune program that has isolated nineteen payloads capable of
              rescuing regulatory activity in aged T cells, as well as a vascular initiative evaluating renal
              endothelial barrier integrity and glomerular filtration rates in injured aged murine models. Each
              candidate formulation utilizes tissue-tropic lipid nanoparticles to achieve transient transcription factor
              expression, avoiding permanent genomic integration or sustained viral vector exposure.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE011
      - number: '5.3'
        title: Technological Differentiation & Bioprocess Scaling
        blocks:
          - type: paragraph
            body: >-
              NewLimit technological differentiation resides in its active-learning computational funnel, proprietary
              humanized primary cell screening assays, and scalable chemistry for non-integrating RNA delivery. While
              classical cellular reprogramming protocols rely on continuous expression of Yamanaka factors (Oct4, Sox2,
              Klf4, and c-Myc) that erase cellular identity and generate pluripotent stem cells, NewLimit engineers
              transient transcription factor pulses that preserve somatic lineage while erasing age-associated
              epigenetic drift. In early 2026, the company progressed its lead hepatocyte candidate medicine into
              large-scale pilot manufacturing, completing approximately twenty percent of its initial bulk drug
              substance batch. To monitor biological activity during development, NewLimit established four candidate
              pharmacodynamic biomarkers designed to track in vivo epigenetic clock reversal and hepatocyte function.
              Scaled screening campaigns have isolated over fifty payloads demonstrating youthful morphological and
              transcriptomic recovery in human liver cells, supporting an active pipeline expansion strategy reminiscent
              of GLP-1 therapeutic development pathways across adjacent metabolic indications.
            claimRefs:
              - CE005
              - CE008
              - CE010
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE009
              - CE012
              - CE013
      - number: '5.4'
        title: Safety Controls, Regulatory Barriers & Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The paramount technical and clinical risk confronting NewLimit is precision control over cellular
              identity. Partial reprogramming operates within a delicate therapeutic window: insufficient transcription
              factor activation fails to restore youthful regenerative function, whereas excessive or unconstrained
              activation risks somatic dedifferentiation, teratoma formation, and oncogenesis. Furthermore, because
              aging is not formally recognized as a disease indication by the United States Food and Drug
              Administration, clinical progression requires demonstrating safety and therapeutic efficacy in discrete
              recognized pathologies, such as alcohol-related liver disease, before broader longevity claims can be
              tested. Preclinical translation is further hindered by external diligence gaps: detailed protocol-level
              documentation, completed IND-enabling safety packages, toxicology margins in non-human primates, and
              specific trial site selection remain strictly confidential. Proving that transient mRNA-LNP delivery can
              safely replicate in human patients the functional cellular rejuvenation observed in mouse models
              represents the critical hurdle for platform underwriting.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Technical Strength: Multi-Task In Silico Screen Efficiency'
            body: >-
              NewLimit proprietary Ambrosia platform achieves a >2X acceleration in discovery throughput by coupling
              molecular foundation models with iterative single-cell genomic screens, establishing log-linear scaling
              laws that prioritize high-performing transcription factor combinations without testing 10^16 permutations
              exhaustively.
            calloutType: strength
            claimRefs:
              - CE001
              - CE009
          - type: callout
            title: 'Technical Risk: On-Target Cellular Identity Loss and Translation Gaps'
            body: >-
              The core biological risk in cellular rejuvenation is oncogenic dedifferentiation: excessive reprogramming
              driving cells into an uncontrolled pluripotent state. Without published human protocol data or completed
              IND packages, the therapeutic window between functional age reset and tumorigenesis remains unproven in
              clinical settings.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Prospective Payer Landscape
        blocks:
          - type: paragraph
            body: >-
              In the biotechnology therapeutics sector, the definition of a customer spans multiple commercial
              constituencies: prescribing clinicians who select therapies, institutional health systems that stock
              specialized biologics, third-party payers that determine formulary reimbursement, and the ultimate patient
              population receiving treatment. Because NewLimit remains an early-stage preclinical drug developer with
              zero commercial sales, its customer landscape is entirely prospective. The company has structured its
              market entry around well-defined clinical indications rather than unregulatable broad healthspan
              extension. The initial target market comprises patients suffering from metabolic dysfunction-associated
              steatohepatitis (fatty liver disease) and alcohol-related liver disease. These target populations provide
              measurable clinical endpoints that established regulatory bodies like the FDA can evaluate, establishing a
              clear pathway toward institutional healthcare reimbursement. Future pipeline expansion contemplates
              targeting microvascular endothelial decay in chronic kidney disease and T cell exhaustion in autoimmune
              disorders, broadening the eventual institutional customer base across nephrology and clinical immunology
              practices.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU012
              - CU013
