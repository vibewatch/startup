      - number: '6.4'
        title: Durability, Regulatory Roadblocks & Customer Journey Expansion
        blocks:
          - type: paragraph
            body: >-
              The path from preclinical discovery to sustainable commercial adoption in epigenetic medicine involves
              severe scientific, regulatory, and procurement barriers. The fundamental risk in cellular reprogramming
              centers on biological precision: excessive transcription factor exposure strips somatic cells of their
              lineage identity, creating severe risks of tumorigenesis and oncogenic transformation. Demonstrating that
              transient mRNA delivered via lipid nanoparticles can achieve durable epigenetic rejuvenation without
              inducing malignant dedifferentiation represents the primary hurdle for institutional provider acceptance.
              Furthermore, because regulatory agencies do not recognize biological aging as a treatable disease,
              NewLimit must navigate strict disease-specific approval processes, complex health economics reviews, and
              formal pharmacy and therapeutics committee evaluations. Long-term commercial durability will depend on
              demonstrating multi-month therapeutic persistence to support manageable intravenous dosing intervals. If
              Phase 1 trials demonstrate acceptable human safety profiles, NewLimit can unlock expansion loops by
              licensing its screening platform and co-developing broader metabolic and autoimmune programs with global
              pharmaceutical partners.
            claimRefs:
              - CU005
              - CU009
