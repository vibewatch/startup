        title: Capital Adequacy, Financing Structure, and Cash Runway
        blocks:
          - type: paragraph
            body: >-
              NewLimit’s capital structure is characterized by rapid, large-scale venture equity capital formation
              without the support of clinical or commercial milestones. Across its corporate trajectory, the company has
              raised $682.2 million in total disclosed equity funding across five distinct financing events: $110
              million in initial founding/seed capital in 2021 (anchored by Coinbase CEO Brian Armstrong), a $40 million
              Series A in 2023 led by Kleiner Perkins, a $130 million Series B in May 2025 at an $810 million post-money
              valuation, a $45 million Series B extension in October 2025 at a $1.62 billion valuation featuring Eli
              Lilly Ventures, and a $435 million Series C in June 2026 led by Founders Fund that valued the firm at $3.1
