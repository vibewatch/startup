      - number: '7.3'
        title: Valuation Velocity, Reimbursement Architecture, and Governance Concentration
        blocks:
          - type: paragraph
            body: >-
              Capital availability is a strength but not a disclosed runway. Independent sources report a $435 million
              Series C at a $3.1 billion valuation and cumulative funding figures from $682 million to roughly $750
              million, yet funding raised is not cash available. The reviewed record does not provide audited cash,
              burn, financing terms, or runway through a Phase 1 readout. This matters because the 2027 first-human
              target is a sharp acceleration from earlier expectations that testing could wait until 2030. Commercial
              risk is equally unresolved: MenFem characterizes NewLimit as pre-revenue and without customers, while
              Excedr explains that aging is not itself an FDA indication. Investor participation, including Eli Lilly
              Ventures, supplies capital and optionality but is not evidence of a licensing or development partnership.
              MenFem also reports the 2025 departure of the machine-learning lead, creating a monitorable key-person
              risk for a company whose platform thesis depends on computational screening.
            claimRefs:
