      - number: '6.3'
        title: Named Partner Proof & Clinical Deployment Architecture
        blocks:
          - type: paragraph
            body: >-
              Public filings and commercial directories verify that NewLimit has zero production deployments, signed
              customer contracts, or commercial pilot agreements with hospital systems. In an early-stage therapeutic
              enterprise, initial customer proof surfaces through strategic corporate biopharma partnerships and
              prospective clinical trial cohorts. The participation of Eli Lilly Ventures in NewLimit's Series C round
              represents the primary external corporate validation of its cellular reprogramming technology. Strategic
              pharmaceutical investment provides NewLimit with valuable translational insight while granting Eli Lilly
              early visibility into therapeutic candidates for future in-licensing or co-development opportunities. On
              the patient front, NewLimit's first clinical deployment will occur within the planned 2027 Phase 1 safety
              trial in patients diagnosed with fatty liver disease, followed by a Phase 2 program in alcohol-related
              liver disease. Preclinical models indicate that NewLimit's lead prototype enhances liver regenerative
              capacity and metabolic stress resilience, but concrete institutional customer adoption remains gated
              behind successful clinical execution.
            claimRefs:
              - CU005
