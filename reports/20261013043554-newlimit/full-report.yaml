chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Foundational Mission
        blocks:
          - type: paragraph
            body: >-
              NewLimit was founded in 2021 as a private biotechnology corporation based in South San Francisco,
              California, operating from headquarters at 901 Gateway Boulevard with supplementary offices in Berkeley.
              The company was conceived around the biological thesis that organismal aging is plastic at the cellular
              level and driven by degradation of epigenetic regulatory marks rather than irreversible nuclear genomic
              loss. Rather than applying traditional symptomatic interventions after diseases manifest, NewLimit focuses
              on partial epigenetic reprogramming using targeted combinations of transcription factors delivered via
              lipid nanoparticles (LNPs) to restore youthful gene expression patterns without inducing full
              dedifferentiation into pluripotent stem cells. The corporate mission targets extending healthy human
              lifespan by developing therapeutics that directly address age-associated functional decline across
              metabolic, vascular, and immune tissues. Preclinical validation to date centers on proprietary
              computational screening and in vitro assays that have generated early prototype medicines designed to
              rejuvenate metabolic activity and resilience in aged human hepatocytes.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
