      - number: '4.3'
        title: Unit Economics, Cost Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Evaluating unit economics for NewLimit requires separating speculative future per-patient pricing
              analogies from the current cost structure of high-throughput biotechnology R&D. The company’s direct
              operational expenses are dominated by high-throughput single-cell sequencing screens, machine learning
              compute clusters supporting its proprietary Ambrosia platform, synthetic mRNA chemistry, customized LNP
              formulation, and preclinical animal models. In vitro and in vivo screening campaigns conducted multiple
              times per month generate substantial consumable and wet-lab overhead. Although media commentary speculates
              on potential chronic therapy price points of $50,000 per year or compares ultimate pricing to seven-figure
              orphan gene therapies, such figures represent unvalidated conjectures rather than supportable unit
              economics. From an investment diligence standpoint, NewLimit’s financial profile represents high-risk
              platform discovery: the company boasts elite capital access and multi-year runway, but institutional
              underwriters face an insurmountable barrier in lack of visibility into burn rates, unknown
              cost-of-goods-sold (COGS) for complex multi-factor mRNA-LNPs, and complete dependency on external equity
              syndicates until human clinical proof-of-concept is achieved.
