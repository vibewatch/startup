  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Multi-layer technological and operating stack from in silico predictive modeling through large-scale mRNA-LNP
      therapeutic formulation.
    approximationNotes: Conceptual representation of platform software, biological discovery, and bioprocess manufacturing layers.
    claimRefs:
      - CE014
      - CE015
    data:
      layers:
        - label: 'Layer 1: Genomic & Epigenomic Screening'
          detail: >-
            Single-cell RNA sequencing and perturbation screening across aged human primary hepatocytes, T cells, and
            renal endothelial cells.
        - label: 'Layer 2: Molecular Foundation Models'
          detail: >-
            Transfer learning from protein and molecular foundation models to evaluate ~10^16 possible transcription
            factor combinations.
        - label: 'Layer 3: Ambrosia In Silico Discovery Engine'
          detail: >-
            Multi-task active learning system predicting cell age, cell identity preservation, and functional phenotypic
            restoration in silico.
        - label: 'Layer 4: Lab-in-the-Loop Iterative Validation'
          detail: >-
            Iterative screening cycles yielding biological scaling laws where payload quality improves log-linearly with
            observed screening hits.
        - label: 'Layer 5: Payload Optimization & Selection'
          detail: >-
            Combinatorial lead selection ensuring complete avoidance of oncogenic pluripotency and Yamanaka-like
            dedifferentiation.
        - label: 'Layer 6: mRNA & LNP Formulation Engineering'
          detail: >-
            Formulation of identified transcription factor mRNAs into targeted lipid nanoparticles for tissue-specific
            in vivo delivery.
        - label: 'Layer 7: Pilot Bioprocess Manufacturing'
          detail: >-
            Transition into pilot and large-scale manufacturing of lead clinical candidates ahead of formal IND-enabling
            safety studies.
