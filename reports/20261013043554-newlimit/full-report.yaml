              Practice (GLP) toxicology, contract manufacturing organization (CMO) scale-up, and Phase 1 clinical
              initiation for its lead liver program in 2027. Assuming an estimated preclinical-to-early-clinical monthly
              cash burn between $6.0 million and $10.0 million across its 50-person core team and external wet-lab
              screening operations, NewLimit holds an estimated 36 to 48 months of forward cash runway. However, because
              NewLimit is a private entity that does not publish audited balance sheets, its exact post-Series-C cash
              reserves, net burn rate, and capital expenditure obligations remain undisclosed private-evidence gaps.
