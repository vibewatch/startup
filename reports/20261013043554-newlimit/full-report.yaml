              - CO010
              - CO012
              - CO015
      - number: '1.2'
        title: Executive Leadership, Scientific Direction, and Governance
        blocks:
          - type: paragraph
            body: >-
              NewLimit's founding leadership marries computational biology, commercial technology scaling, and life
              sciences venture capital. Chief Executive Officer and President Jacob Kimmel, a computational stem cell
              biologist formerly with Calico Life Sciences, directs corporate management, computational platform
              architecture, and translational drug discovery pipelines. Co-founder Brian Armstrong, best known as Chief
              Executive Officer of Coinbase, brings major entrepreneurial capital-raising reach and executive visibility
              to the company's long-term financing strategy. Co-founder Blake Byers, a bioengineer and former partner at
              GV (Google Ventures) who also leads Byers Capital, contributes extensive early-stage biotechnology
              incubation experience and governance perspective. The company's advisory structure includes an assembled
              Scientific Advisory Board with specialized academic domain expertise in aging biology, cellular
              senescence, and nephrology. However, formal fiduciary board of directors composition, independent director
              appointments, voting control allocations, and investor committee rights remain strictly undisclosed in
              public registries, creating key-person governance dependence on the founding triumvirate.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Syndicate
        blocks:
          - type: paragraph
            body: >-
              NewLimit has executed an aggressive private capitalization strategy, securing approximately $682 million
              in cumulative paid-in equity capital across five discrete financing events since inception. The company
              launched in December 2021 with roughly $100 million to $110 million in initial seed-stage commitments,
              followed by a $40 million Series A in May 2023 and a $130 million Series B in May 2025 led by Kleiner
              Perkins at an $810 million post-money valuation. In October 2025, NewLimit secured a $45 million Series B
              extension round that brought its valuation to $1.6 billion. Most recently, in June 2026, NewLimit
              announced a $435 million Series C financing round led by Founders Fund alongside new crossover and
              institutional participants Thrive Capital, Greenoaks, and Quiet Capital, with participation from strategic
              pharmaceutical venture arm Eli Lilly Ventures and returning backers Kleiner Perkins, Valor Equity
              Partners, and Abstract. The Series C priced the company at a post-money valuation of $3.1 billion, nearly
              quadrupling its capitalization baseline within fourteen months. Despite elite capitalization, NewLimit
              remains entirely pre-revenue, burn rates are private, and commercial revenues remain distant.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Preclinical Pipeline, Mechanistic Milestones, and Translational Timeline
        blocks:
          - type: paragraph
            body: >-
              The core engine powering NewLimit's discovery pipeline is Ambrosia, an artificial intelligence platform
              paired with single-cell functional genomics assays and high-throughput screening to identify novel,
              tissue-specific transcription factor combinations. Unlike full somatic cell reprogramming using classical
              Yamanaka factors (Oct4, Sox2, Klf4, c-Myc) which carries severe oncogenic and teratoma formation risks,
              NewLimit's partial reprogramming paradigm aims to reset aged epigenetic states while strictly preserving
              specialized somatic cell identity. The company's lead preclinical program targets liver tissue, where an
              mRNA-LNP prototype formulation utilizing fewer than ten transcription factors demonstrated reversal of
              cellular aging signatures, improved fat and alcohol metabolism, and accelerated injury recovery in human
              cell models and rodents. While early corporate roadmaps projected a decade-long runway before entering the
              clinic, management substantially accelerated its timeline in mid-2026, targeting initial human Phase 1
              safety trials in fatty liver disease and alcohol-related liver disease for 2027, with exploratory
              pipelines advancing in vascular and immune cells.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Compression vs. Unproven Clinical Translation
            body: >-
              NewLimit has aggregated over $682 million in paid-in equity in under five years, granting it an
              exceptionally deep balance sheet and multi-year operating runway rare among preclinical biotech startups.
              However, this massive capital accumulation reflects investor appetite for platform optionality and
              high-risk longevity science rather than derisked clinical validation, as partial epigenetic reprogramming
              has never been tested in humans nor approved as a therapeutic modality.
            calloutType: insight
            claimRefs:
              - CO009
              - CO010
              - CO016
          - type: callout
            title: Biological Oncogenicity and Reprogramming Safety Margins
            body: >-
              The central biological hazard facing NewLimit's translational pipeline is the narrow margin between
              restorative partial epigenetic reprogramming and loss of somatic cellular identity. Complete reprogramming
              via classical transcription factors is known to induce teratomas and oncogenic transformation; NewLimit's
              proprietary mRNA-LNP formulations must demonstrate strict dosage control and transient factor expression
              in upcoming clinical trials to ensure tissue rejuvenation without neoplastic risk.
            calloutType: risk
            claimRefs:
              - CO004
              - CO014
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Therapeutic Scope, Regulatory Boundaries, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial boundary for epigenetic reprogramming therapeutics is defined by the stark operational
              divergence between an unconstrained biological vision and established clinical regulatory pathways.
              Because health authorities including the FDA do not recognize biological aging or cellular senescence as
              treatable primary disease indications, market sizing cannot be underwritten as an undifferentiated global
              longevity intervention. Instead, drug developers must advance candidates under concrete, diagnostic-coded
              disease labels that possess validated surrogate endpoints, clear trial designs under FDA 21 CFR Part 312,
              and recognized reimbursement mechanisms. For NewLimit, this structural requirement constrains immediate
              commercial scope to high-unmet-need organ-specific pathologies, principally hepatic diseases such as
              metabolic dysfunction-associated steatohepatitis (MASH), metabolic dysfunction-associated steatotic liver
              disease (MASLD), and alcohol-related liver disease (ARLD), alongside secondary discovery programs in
              vascular endothelia and T-cell immunology. The therapeutic status quo across these primary indications
              relies on standard-of-care disease-management interventions, including lifestyle modification, metabolic
              modulators, GLP-1 receptor agonists, immunosuppressive regimens, and organ transplantation. Epigenetic
              reprogramming seeks to substitute for palliative or symptom-managing pharmaceuticals by directly resetting
              gene-expression marks to restore youthful regenerative and metabolic competence in diseased tissue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 'Market Sizing Frameworks: TAM, SAM, and Addressable Patient Populations'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial potential of epigenetic cellular rejuvenation requires a disciplined multi-lens
              sizing framework that isolates speculative platform opportunity from clinical addressability. At the total
              addressable market (TAM) layer, executive commentary frequently asserts that therapeutics capable of
              reversing cellular age address an opportunity orders of magnitude larger than traditional therapeutics,
              given that cellular functional decline underlies nearly all chronic degenerative conditions. Furthermore,
              epidemiological estimates show that fatty liver disease affects roughly 25 percent of the global adult
              population, while approximately half of adults over age 60 develop metabolic syndrome. However,
              translating vast epidemiological populations into an addressable therapeutic market requires rigorous
              clinical gating. At the serviceable addressable market (SAM) layer, commercial spend is bounded by
              diagnosed, advanced patient sub-populations undergoing active clinical care for progressive fibrotic liver
              disease, where intravenous lipid-nanoparticle mRNA infusions administered on three-week intervals
              represent an economically viable and clinically urgent intervention. The serviceable obtainable market
              (SOM) is further constrained by clinical trial gating, investigational new drug clearance, competitive
              entry from well-capitalized longevity peers like Altos Labs, and market penetration among specialized
              hepatology and tertiary academic medical centers.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
