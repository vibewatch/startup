  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Translational Biology, Oncogenesis, and Target Indication Ambiguity
        blocks:
          - type: paragraph
            body: >-
              The lead risk is translation from cells and animals into patients. Biotech Insider describes precision as
              the central problem: excessive reprogramming can erase cell identity, while Excedr notes that complete
              reprogramming can cause tumor formation. NewLimit's March 2026 update reports improved regeneration and
              less liver damage in old animals, but that company-issued evidence is not human safety or efficacy
              evidence. The regulatory wedge is also not fully settled in the reviewed record. Yahoo Finance reports
              fatty-liver enrollment for Phase 1 and alcohol-related liver disease for Phase 2, while another company
              profile labels alcohol-related liver disease as the first trial target. Aging itself is not an approved
              disease indication, so a conventional disease endpoint, an acceptable toxicology package, and consistent
              protocol disclosure are gating items. Residual exposure remains high until an IND is accepted and human
              safety data establish a therapeutic window.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
