      - number: '3.2'
        title: Platform Capabilities and Differentiation Durability
        blocks:
          - type: paragraph
            body: >-
              The core scientific dividing line in cellular reprogramming separates full dedifferentiation from partial
              epigenetic reset. Classical Yamanaka factor reprogramming rewinds somatic cells back to embryonic-like
              induced pluripotent stem cells, an outcome that carries severe oncogenic hazards, including teratoma and
              malignant tumor formation. NewLimit's technological differentiation rests on partial reprogramming:
              delivering specific combinations of fewer than ten transcription factors via mRNA-loaded lipid
              nanoparticles to restore youthful metabolic gene regulation while rigorously preserving somatic cell
              identity. To discover these factor combinations, NewLimit developed Ambrosia, a proprietary multi-task
              computational screening engine that models reprogramming outcomes in silico. By combining Ambrosia with
              high-throughput single-cell assays, NewLimit reports doubling its discovery hit rate across a search space
              comprising ten to the sixteenth possible transcription factor sets. While direct peers such as Altos Labs
              possess comparable scientific talent, NewLimit has established a distinct development velocity by
              advancing a lead hepatocyte candidate into large-scale manufacturing ahead of planned 2027 Phase 1
              clinical trials, while expanding discovery into renal vascular endothelial cells and immune T cells.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
      - number: '3.3'
        title: Commercialization Models, Regulatory Barriers, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Preclinical longevity biotechnology platform developers currently generate negligible or unverified
              commercial revenue, relying on deep venture capital reserves rather than product sales. Commercialization
              in this category faces a foundational regulatory hurdle: the United States Food and Drug Administration
              does not classify biological aging as a disease indication. Consequently, NewLimit and its competitors
              cannot seek approval for generalized healthspan extension. Instead, developers must establish clinical
              proof of concept by targeting discrete, measurable age-related diseases with conventional endpoints, such
              as metabolic dysfunction-associated steatohepatitis or alcohol-related liver disease. Distribution power
              and long-term moat durability in this market will depend on proprietary lipid nanoparticle delivery
              formulations, intellectual property protection around specific transcription factor combinations, and
              clinical safety profiles. Furthermore, the longevity sector contends with widespread skepticism due to
              over-salesmanship and unproven consumer wellness offerings. Participation from established pharmaceutical
              players, exemplified by Eli Lilly Ventures joining NewLimit's syndicate, provides critical translational
              validation, clinical trial governance, and prospective co-development optionality that strengthens
              long-term defensive moats against potential fast followers.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Oncogenic Reprogramming Risk and Target Specificity
            body: >-
              The primary biological bottleneck in cellular rejuvenation is preserving cell identity while resetting
              epigenetic age. Full reprogramming risks teratoma formation, necessitating tightly bounded partial reset
              protocols.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
          - type: callout
            title: Indications-First Regulatory Navigation
            body: >-
              Because FDA frameworks do not recognize biological aging as a treatable disease, commercial viability
              requires demonstrating efficacy in defined metabolic or organ-specific clinical indications.
            calloutType: insight
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanisms, and Commercial Status
        blocks:
          - type: paragraph
            body: >-
              NewLimit is a preclinical biotechnology company with zero commercial revenue, zero product sales, and zero
              active licensing or upfront milestone receipts recorded to date. The company’s long-term monetization
              hypothesis relies on developing proprietary cellular age reprogramming therapies delivered via lipid
              nanoparticles (LNPs) encoding mRNA transcription factor combinations. While early corporate commentary
              draws strategic analogies to multi-indication pharmaceutical franchises such as GLP-1 receptor agonists,
              NewLimit has established no commercial list pricing, has entered no pharmaceutical licensing
              co-development transactions, and generates no operational cash inflows. Independent biopharma analysis
              highlights that the entire enterprise rests on speculative forward optionality: commercialization remains
              an estimated seven to ten years away, requiring full progression through Phase 1 safety, Phase 2
              proof-of-concept, and Phase 3 pivotal trials. Any underwriting framework that attempts to model
              software-style recurring revenue, annual recurring revenue (ARR), or near-term product gross margins is
              fundamentally mismatched to NewLimit’s pre-clinical biotechnology operating reality.
