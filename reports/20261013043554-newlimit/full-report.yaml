      - number: '7.2'
        title: Delivery Physics, LNP Intellectual Property, and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              The liver program and the broader platform do not carry the same delivery risk. MenFem identifies
              extra-hepatic delivery as the most fragile link and reports that three of four programs depend on it; its
              cited kidney-endothelial result is in vitro, not proof of functional delivery in an animal or patient. The
              same source reports that NewLimit internalized LNP-mRNA formulation and had completed 20% of its first
              large-scale batch by March 2026. That milestone shows active mitigation but not GMP readiness, release
              yield, fill-finish capacity, or clinical-supply reliability. Fierce Biotech independently describes the
              lead asset's LNP-mRNA transcription-factor design, confirming that delivery and manufacturing are core
              dependencies rather than peripheral tooling. MenFem also flags an LNP patent thicket, while the reviewed
              sources do not disclose a NewLimit-specific freedom-to-operate opinion. The residual risk is therefore
              high for non-liver expansion and material for the lead program's CMC timeline.
            claimRefs:
              - CR004
