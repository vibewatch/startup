  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Stance / Rating
      - Key Evidence & Rationale
      - Decision Implication
    rows:
      - - Recommendation
        - Research-More
        - >-
          Preclinical breakthrough in human liver cells demonstrates biological activity, but zero human clinical safety
          data exists at Series C.
        - Defer direct capital commitment until IND filing and Phase 1 trial clearance are publicly documented.
      - - Confidence
        - Medium
        - >-
          Institutional backing from Founders Fund and Kleiner Perkins confirms capital access, but opaque private
          financials limit precision.
        - Maintain ongoing technical monitoring and engage syndicate for primary trial protocol access.
      - - Risk Rating
        - High
        - >-
          Unproven translational validity in humans and potential oncogenic hazards from off-target transcription factor
          activation.
        - Require strict milestone gates and downside liquidation preference protections for any secondary entry.
      - - Valuation Stance
        - Expensive
        - >-
          $3.1B post-money valuation at Series C incorporates substantial long-term platform premium without commercial
          proof.
        - Discipline entry valuation; reject unpriced warrants or uncapped follow-on rounds lacking clinical readouts.
    notes: >-
      Ratings synthesize Series C pricing, institutional syndicate conviction, and preclinical development stage from
      public disclosures.
    claimRefs:
      - CV001
      - CV004
      - CV005
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Biological Mechanism
        - >-
          Partial epigenetic reprogramming restores youthful cellular function across multiple tissue types without
          inducing oncogenic dedifferentiation.
        - >-
          Reprogramming machinery carries risk of incomplete fidelity, genomic instability, and potential tumorigenesis
          in vivo.
        - Demonstration of sustained in vivo tissue rejuvenation without teratoma formation in non-human primates.
      - - Market Opportunity
        - >-
          Targeting upstream aging biology addresses broad multi-disease indications spanning metabolic, vascular, and
          immune diseases like GLP-1s.
        - >-
          No established FDA regulatory approval pathway exists for biological aging, forcing reliance on narrow
          single-organ indications.
        - Formal FDA acceptance of an aging biomarker surrogate endpoint or accelerated trial design in liver disease.
      - - Capital & Runway
        - >-
          Deep tech and pharma syndicate ($682M cumulative raised) provides multi-year runway to navigate early
          discovery failure.
        - >-
          Unusually high capital intensity with 40+ headcount and multi-asset screening risks rapid burn prior to
          clinical milestones.
        - Receipt of audited cash balance showing 36+ months runway or major non-dilutive pharma licensing upfront.
      - - Execution & Delivery
        - >-
          Lipid nanoparticle mRNA delivery leverages clinically validated modality (mRNA vaccines) for targeted
          hepatocyte uptake.
        - Systemic delivery beyond liver to vasculature and immune cells remains technically unproven and immunogenic.
        - Published pharmacokinetic data showing efficient non-hepatic tissue biodistribution without systemic toxicity.
    notes: Thesis framework evaluates Core Scientific and Commercial Pillars against technical diligence counterarguments.
    claimRefs:
      - CV003
      - CV006
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Phase 1 trial enters clinic in 2027; lead liver candidate shows clean safety and measurable functional
          biomarker recovery; pharma option deal signed.
        - Valuation expands to $6.0B-$8.0B (2.0x-2.6x MOIC); sets up high-value crossover round or IPO window.
        - Regulatory trial hold or delayed IND acceptance pushing first-in-human data beyond 2028.
        - 25% (requires flawless preclinical-to-clinical translation)
      - - Base Case
        - >-
          Phase 1 safety study initiated in 2027 but progresses cautiously; biological readouts are ambiguous; requires
          extension financing.
        - Valuation holds flat at $3.1B-$3.5B (1.0x-1.1x MOIC); modest step-up dependent on clinical cohort expansion.
        - Capital intensity requires Series D round under tighter biotech market conditions.
        - 50% (reflects standard early-stage biotechnology attrition)
      - - Bear Case
        - >-
          Off-target toxicity or severe delivery constraints emerge in IND-enabling toxicology; liver trial delayed or
          suspended; high cash burn.
        - Valuation contracts to $1.0B-$1.5B (-50% to -68% decline); potential down-round recapitalization.
        - Total loss of platform premium; investor syndicates enforce aggressive liquidation preferences.
        - 25% (untested biology with complex transcription factor payloads)
    notes: >-
      Scenarios project outcomes over a 24- to 36-month horizon based on Phase 1 IND execution and private market
      conditions.
    claimRefs:
      - CV008
      - CV009
      - CV010
