callouts:
  - calloutType: "risk"
    title: "Thesis-Break Triggers and Kill Criteria"
    body: "Proposed kill criteria are: any treatment-related tumorigenicity or clinically meaningful loss of cell identity in human testing; failure to establish functional in-vivo extra-hepatic delivery before committing material capital to the vascular or immune programs; or inability to finance a human safety readout without punitive terms after missing the stated 2027 first-human target. Monitoring indicators are IND acceptance, first-patient dosing, dose-limiting toxicities, durable cell-identity markers, batch-release success, and disclosed runway to the next clinical readout."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
