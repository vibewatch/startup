      role: CEO and President
      background: Computational stem cell biologist and former Calico Life Sciences leader.
      claimRefs:
        - CO005
    - name: Brian Armstrong
      role: Co-founder
      background: Coinbase co-founder and chief executive with major financing visibility.
      claimRefs:
        - CO006
    - name: Blake Byers
      role: Co-founder
      background: Former GV partner and bioengineer with biotechnology venture experience.
      claimRefs:
        - CO007
  headquarters: South San Francisco, California, United States
  productSummary: >-
    Partial epigenetic reprogramming therapeutics delivered via mRNA-lipid nanoparticles, starting with liver
    indications and expanding into vascular and immune programs.
  customerFocus: >-
    Institutional hepatology and specialty-care patients with fatty liver disease and alcohol-related liver disease,
    with longer-term expansion into nephrology and immunology.
  businessModel: >-
