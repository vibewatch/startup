  topStrengths:
    - Exceptional private capital access and high-quality syndicate support.
    - Clear liver-focused translational wedge with measurable clinical endpoints.
    - Credible preclinical platform activity across discovery, manufacturing, and candidate optimization.
  topRisks:
    - No human clinical data yet, so translational safety and efficacy remain unproven.
    - Biological and delivery risks around reprogramming, identity loss, and oncogenesis stay material.
    - Valuation is already aggressive relative to the absence of commercial revenue or audited private operating data.
  unresolvedGaps:
    - Post-Series-C cash balance, monthly burn, and runway remain undisclosed.
    - Protocol-level IND-enabling package and trial site plan have not been publicly disclosed.
    - Commercial customer, reimbursement, and in-human adoption evidence is still absent.
