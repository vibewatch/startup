companyProfile:
  summary: >-
    NewLimit is a private, preclinical longevity biotechnology company focused on partial epigenetic reprogramming
    therapeutics delivered through mRNA-lipid nanoparticle systems. The company is anchored by a liver-first
    translational strategy, a proprietary Ambrosia discovery platform, and an unusually large private capital base, but
    it still lacks human clinical data and disclosed commercial revenue.
  founders:
