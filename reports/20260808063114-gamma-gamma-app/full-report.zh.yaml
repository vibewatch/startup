  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全与平台滥用风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 的受信任域名地位原本是用户信任上的竞争优势，如今却成为实质性安全负债。威胁行为者把 Gamma 平台武器化，创建可信的钓鱼跳转页，冒充 Microsoft SharePoint 登录门户，并利用
              gamma.app 域名的高声誉绕过企业邮件安全过滤器。攻击使用 adversary-in-the-middle（AiTM）框架，可实时收集凭证并窃取 session
              cookie，从而绕过多因素认证。Cloudflare Turnstile CAPTCHA 被插入链路中段以阻止自动化安全扫描，进一步增加检测难度。由于 gamma.app
              相对较新，且经常被企业安全团队列入白名单，钓鱼链获得异常高的投递率。面对有记录的 Gamma 托管钓鱼活动，企业 IT 部门可能选择在防火墙层面拦截 gamma.app 链接，从而给 Gamma
              最需要增长的企业细分市场设置采用天花板。Gamma 的 Privacy Policy 管理包括演示文稿及其关联元数据在内的用户生成内容；国际传输按标准合同条款处理，但考虑到 Gamma 的 EU
              用户基础，GDPR 执行风险仍有缺口。Gamma 的 Terms of Use
              按行业标准限制公司对第三方滥用平台造成损害的赔偿义务，但企业采购团队会在安全审查中仔细审视平台滥用历史。运营安全登记表按剩余敞口对这些失效模式排序。
