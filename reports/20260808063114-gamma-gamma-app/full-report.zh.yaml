          - type: callout
            title: Trustpilot 1.6/5 与账单投诉提示客户留存风险
            body: >-
              Gamma 在 Trustpilot 上 88 条评测给出 1.6/5，其中超过 70% 给一星，记录了自动续费意外、严苛的 3-day 退款窗口、取消请求后仍扣费和客服无响应等模式。尽管 Trustpilot
              偏向账单投诉者，但投诉数量和一致性代表实质性信任风险，可能压制企业采购决策，并加快价格敏感个人订阅者流失。
