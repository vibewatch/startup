  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 十二项头部估值与投资 KPI，综合 Gamma Series B 定价、可比基准和情景回报。
    data:
      items:
        - label: Series B 投后估值
          value: $2.1B
          detail: November 2025；Andreessen Horowitz 领投。公司确认。
          tone: neutral
        - label: Series B 隐含 ARR 倍数
          value: ~21×
          detail: 基于公司披露 $100M+ ARR；Sacra 估计 $102M ARR。
          tone: neutral
        - label: AI-Native SaaS VC 中位倍数（Q1 2026）
          value: 21.2×
          detail: saasrise.com 对 575+ 家私营 AI-native SaaS 公司的分析。
          tone: positive
        - label: Figma IPO 倍数（Apr 2026）
          value: ~22× ARR
          detail: 约 $24B 完全稀释 / 约 $1.1B ARR；130%+ NDR；88-91% 毛利率。
          tone: positive
        - label: 可比公允价值区间
          value: $1.6B–$2.4B
          detail: 分析师根据可比公司分析估计；不是 DCF。
          tone: neutral
        - label: 建议进入价格
          value: ≤$1.75B pre-money
          detail: 较 Series B 折让 15–20%，取决于 NDR 确认。
          tone: neutral
        - label: 基准情景退出（2028）
          value: $2.1B–$2.8B
          detail: $175M ARR 上 12–16×；成本基础上 0× 至 +0.3×。
          tone: neutral
        - label: 乐观情景退出（2028）
          value: $4.5B–$5.5B
          detail: $250M ARR 上 18–22×；成本基础上 +2.1× 至 +2.6×。需要 NDR >120%。
          tone: positive
        - label: 悲观情景退出（2028）
          value: $720M–$1.1B
          detail: $120M ARR 上 6–9×；成本基础上 -50% 至 -65%。倍数压缩风险。
          tone: negative
        - label: 盈利底部
          value: ~$500M
          detail: 自 2023 年起运营盈利；约 5× ARR 的硬底限制灾难性亏损。
          tone: positive
        - label: 净新增分析师来源
          value: '14'
          detail: 本章从 11 个新域名抓取 14 个净新增 URL。
          tone: neutral
        - label: AI VC 融资占比（2025）
          value: 61% / $258B
          detail: 2025 年 AI 占全球 VC 的 61%（whitepage.studio 引 PitchBook/OECD）。
          tone: positive
