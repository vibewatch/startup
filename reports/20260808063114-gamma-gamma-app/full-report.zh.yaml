  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与输出格式
        blocks:
          - type: paragraph
            body: >-
              Gamma 覆盖四类输出：演示文稿、交互式文档、网页和社交图形，全部由 AI
              生成引擎根据自然语言提示生成。平台最底层的设计选择是卡片式、可滚动格式，用它替代线性幻灯片范式，并支持在内容中嵌入视频、实时数据、投票和分支路径等 PowerPoint 或 Keynote 无法实现的元素。截至
              March 2026，平台全球注册用户接近 100 million，超过 80 percent 位于美国以外，显示其从一开始就具备国际化牵引力。内容库包含 100 多个专业设计、AI
              原生、可重混的模板，只需一个命令即可适配用户提供的内容，消除传统工具的空白页摩擦。2025 年推出的 Gamma Agent 是直接嵌在编辑界面里的对话式 AI
              设计伙伴，用户可用自然语言指令重组、压缩或重新设计整套演示文稿。平台通过多个图像模型支持 AI
              生成图片，并在付费计划中集成品牌套件，让团队无需专职设计职能也能执行视觉识别。输出可作为实时网页链接分享，并内置浏览分析，也可导出为 PDF 和 PowerPoint；但评测者持续指出，PowerPoint
              导出会把文字压平成静态图片并丢失交互元素，因此在以 PPT 为先的企业工作流中效用受限。
            claimRefs:
              - CE001
