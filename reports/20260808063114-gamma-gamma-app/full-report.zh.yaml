      - number: '8.3'
        title: 可比公司估值分析
        blocks:
          - type: paragraph
            body: >-
              2026 年上半年，AI-enabled SaaS 市场为 Gamma 估值提供了多个锚点。Figma 于 April 2026 以约 $42/share IPO，在约 $1.1B ARR 上对应约 $24B
              完全稀释估值，把 22× ARR 倍数树立为设计类工作流软件的公开市场基准；这类软件具备强企业留存（S-1 文件显示 130%+ NDR、88-91% 毛利率）。Canva 基于估计 $3.3B ARR 的
              $42B 老股估值隐含约 12.7×，倍数更低，反映其收入规模稀释了增长溢价。Notion 2026 年在估计 $500-600M ARR 上的隐含估值约 $18.5B，意味着
              30-37×，高溢价反映更深的工作流锁定和企业多产品敞口。放到私募市场队列中，saasrise.com 的 AI Software Valuation Report 2026 分析 575+ 家私营公司，发现
              AI-native SaaS 的 VC 中位倍数为 21.2×，直接验证 Gamma Series B 定价与同类队列一致。AI-enabled（非原生）SaaS 的 VC 倍数为 8.5×、M&A 倍数为
              7.0×；传统 SaaS 分别为 5.5× 和 3.8×。iMerge Advisors 的 Q1 2026 报告把非 AI 公司公开 SaaS 倍数定在 4.0–5.5× ARR。含义是：Gamma 当前
              21× 既不异常，也不是人为吹高；它是有 $100M ARR 记录的 AI-native SaaS 的市场出清价。风险在于，这一倍数借用了品类溢价，而不是靠企业工作流深度挣来；如果企业渗透停滞，估值会变脆。
