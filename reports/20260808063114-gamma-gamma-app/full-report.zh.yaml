      - number: '8.5'
        title: 投资建议与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              证据支持有条件投资建议，价格应较 $2.1B Series B 投后估值折让 15–20%。这一折让用于补偿三项未解决估值风险：未公开披露按队列拆分的
              NDR、缺少毛利率验证，以及老股部分之后股权结构稀释的不确定性。相对 AI-native SaaS 同类公司，Gamma 当前估值不是泡沫——21× ARR 倍数位于品类中位数，并由 Figma 和 Canva
              公开可比公司验证。不过，乐观情景需要企业工作流深度，必须在尽调中确认。主要投资风险是竞争替代（Microsoft Copilot、Google Gemini），以及 Gamma 若从 AI-native SaaS
              被重估为 AI-enabled SaaS 造成的倍数压缩——合理倍数会从 21× 降至 8.5×，在当前 ARR 上意味着估值下降 60%。Gamma 的运营盈利为灾难性下行提供了实质底部：一家现金流为正、ARR
              超过 $100M 的公司，即便在不利条件下也不太可能低于 5× ARR 交易，形成约 $500M 的硬底。六项最终尽调要求（TV006）按决策关键性排序；NDR 要求是在落实投资建议前优先级最高的单项。AI 在
              2025 年占全球 VC 的 61%（总额 $258B），形成结构性顺风，降低未来资本获取风险，并支持溢价倍数制度延续到 2026 年。
