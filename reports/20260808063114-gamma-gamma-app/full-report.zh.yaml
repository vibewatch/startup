              Gamma 以 50–52 名员工和仅 $23M 初始融资做到 $100M ARR，人均 ARR 约 $2M，是 SaaS 人均 $200K–$500K 中位数的 4–10x。这种效率来自 PLG
              免费增值飞轮：自然获客几乎不需要付费 CAC，按积分设门槛的模型又能高效转化重度用户。公司自 early 2024 起盈利，说明增长率不是靠补贴堆出来的，使其成为 AI SaaS 里质量最高的一类收入画像。
