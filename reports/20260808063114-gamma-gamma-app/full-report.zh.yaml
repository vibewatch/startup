  - id: TM005
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 Gamma 的含义
      - 尽调问题
    rows:
      - - 远程与混合办公采用（自 2020 年以来 +61%）
        - 驱动因素
        - 结构性；持续中
        - 支撑云原生协作工具需求；同等利好 Gamma 和既有厂商
        - Gamma 付费增长中，有多少直接来自远程办公，而不是 AI 新鲜感？
      - - 营销人员采用 AI（2026 年 85% 用 AI 做内容）
        - 驱动因素
        - 到 2027 年持续加速
        - 直接扩大 Gamma 的主要用户细分；降低用户对 AI 生成幻灯片的心理门槛
        - 在 AI 内容工具与 ChatGPT 原生工作流中，Gamma 的声量份额是多少？
      - - 病毒式免费增值分发（70% 自然增长）
        - 驱动因素
        - 活跃；基础扩大后减速
        - 低 CAC 支撑盈利；自然闭环是 Asia 和 LatAm 的主要获客引擎
        - 用户基础达到什么规模后，自然增长会实质性减速？
      - - 教育数字化（72% 学校采用数字演示工具）
        - 驱动因素
        - 结构性；多年期
        - 提供庞大且粘性的免费层用户基础，并有机构增购潜力
        - 免费 K-12 向付费授权的机构转化率是多少？
      - - AI 投资浪潮作为宏观顺风（AI = S&P 500 财报提及的 21%）
        - 驱动因素
        - 2026–2028 投资周期峰值
        - 企业为 AI 生产力工具付费的意愿处于多年高位
        - 初始热情过后，AI 预算分配有多持久？
      - - PowerPoint PPTX 生态锁定（1.5B 用户，M365 捆绑）
        - 约束
        - 结构性；多年期
        - 在实现 PPTX 导出平价前，为企业 TAM 设置硬上限
        - Gamma 改善 PPTX 导出保真度的路线图是什么？
      - - 数据安全与合规（38–52% 企业关注）
        - 约束
        - 监管压力上升
        - 拖慢企业采购；SOC 2 Type II 只能部分解决，HIPAA/GDPR 需要更多认证
        - Gamma 计划新增哪些受监管行业合规认证？
      - - 企业 AI ROI 不确定（只有 15% 看到实质盈利影响）
        - 约束
        - 近期；2026–2027
        - 若不能证明节省时间 / 成本，会限制企业支付溢价的意愿
        - Gamma 是否有可发布的企业客户 ROI 案例研究？
      - - 2026 年 90+ 个 AI 演示工具竞争对手
        - 约束
        - 加剧中
        - 压缩定价空间，并抬高付费渠道获客成本
        - Gamma 按细分拆分的净收入留存率（NRR）是多少，用以评估竞争粘性？
    notes: >-
      驱动因素量化来自 Business Research Insights、Affinco、Wearetenet 和 Morgan Stanley 2026 报告。约束严重性根据 Swellpulse ICP 分析、Artisan
      Growth Strategies 免费增值研究和 2Slides AI 演示市场报告估算。所有数字均为第三方估计；Gamma 未发布按细分拆分的留存或转化数据。
    claimRefs:
