      - number: '4.6'
        title: 财务风险与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              需要重点核查几项实质性财务风险。第一，Gamma 平台被用于钓鱼攻击，带来声誉和责任敞口：威胁行为者利用受信任的 gamma.app 域名托管钓鱼跳转页，冒充 Microsoft SharePoint
              登录页；安全研究人员指出，平台本身的合法性让攻击者能绕过标准邮件安全过滤器。如果 Gamma 被迫执行更严格的内容审核，或其域名被列入黑名单，驱动自然获客的病毒式分享闭环可能受冲击。第二，Microsoft
              Copilot、Google Duet AI 和 Canva 免费层 AI 功能带来竞争压力，可能把 Gamma
              核心的「从文本生成幻灯片」能力商品化，压缩定价权，并加快轻度用户流失。第三，严谨承销需要的核心财务指标——毛利率、NRR、CAC
              回本周期、月度烧钱速度和准确的订阅用户队列数据——均为私有且未披露。缺少这些指标，就无法验证业务是否在高效扩张，也无法判断员工数上升后盈利说法是否可持续。公司员工数似乎增长很快（截至 early 2026，估计为
              52 至 318 人），扩张阶段可能压缩利润率。
