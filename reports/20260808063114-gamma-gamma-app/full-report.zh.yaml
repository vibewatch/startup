  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Gamma 采用基于 credit 的免费增值模型，本质上把消费者定价与 B2B SaaS 价值交付连接起来。用户从免费层开始，获得 400 个终身 AI credits——足够生成约 8–10
              个完整演示稿——随后撞上硬付费墙并作出升级决定。这个终身 credit 上限在 2024 年末推出，取代了此前按月重置的做法，更严格，也更能迫使转化。个人付费层从
              $8–10/月（Plus）、$18–25/月（Pro）到 $100/月（Ultra）；团队层从 $20/seat/月（Team）和 $40/seat/月（Business）起。Credit
              系统按功能计量使用：生成标准 10 页演示稿需要 40 credits，AI 图像生成按质量消耗 2–40 credits，内容润色每次消耗 5–10 credits。收入来源包括个人计划订阅收入、Team 和
              Business 计划的按席位收入，以及 Pro 及以上层级刚起步的 API 访问收入。Gamma 未披露按细分的收入拆分，但 Sacra 估计 B 轮交割时平台拥有超过 60 万付费订阅者，其中多数在 Plus
              或 Pro 个人计划。通过 Team 和 Business 计划做企业向上销售，是进入 2026 年的最高优先级增长向量；SOC 2 Type II 合规和 SSO 解锁更大合同规模。
