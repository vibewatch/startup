      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              Gamma 不公开披露净收入留存率（NRR）、总收入留存率（GRR）或明确流失率，形成重大证据缺口。缺少这些指标时，可用信号包括五个渠道的评测平台评分、账单投诉模式，以及每日 1 million
              次内容创建隐含的参与度代理。评测平台评分显示客户基础分化：G2（23 条评测给出 4.1/5）和 FeaturedCustomers（422 个参考点给出 4.8/5）上的商业与专业用户，对速度、AI
              质量和模板多样性满意度高；Trustpilot（88 条评测给出 1.6/5）则偏向账单不满用户，暴露出自动续费意外、严格的 3-day 退款窗口、取消请求后仍扣费以及客服无响应等投诉模式。ChatSlide
              面向 Gamma 用户的取消指南记录，Gamma 要求用户经过多个步骤才能取消，且不提供暂停选项，强化了靠摩擦留存、而非靠满意度留存的动态。Plisio 的 2026 独立评测给 Gamma 在
              Trustpilot 上约 2.0/5、在 Microsoft Store 上 4.3/5，说明 Trustpilot 人群更偏向账单投诉者，而非活跃产品用户。Knoji 汇总 31 条评测，截至 June
              2026 总分为 3.9/5。每日高频创建指标（1M items/day）作为粘性代理值得鼓励，但不能替代队列留存数据。Capterra Canada 一名学生用户的评测（November 2024）和
              Capterra US 评测（4 条评测给出 3.8/5）都表明，在账单不是因素时，Gamma 对个人和教育用户主要是正向体验。面向 SMB 工具的行业 SaaS 基准显示，年总留存 80–90% 较为常见；没有
              Gamma 自身数据，我们无法判断其达到、超过还是低于这一下限。
