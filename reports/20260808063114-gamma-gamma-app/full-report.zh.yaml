              - CE002
      - number: '5.3'
        title: 技术架构与基础设施
        blocks:
          - type: paragraph
            body: >-
              Gamma 的网页应用建立在 React 前端之上，并用 Yjs——一个 CRDT（Conflict-free Replicated Data Type）库——支撑 Multiplayer
              服务中的无冲突实时协同编辑。其 GitHub 组织公开约 26 个代码库，包括 ProseMirror、Tiptap、Chakra UI 和 dnd-kit 的
              fork，共同构成编辑器层的开源基础。这反映了公司的策略：搭在维护良好的开源原语上，而不是自建专有编辑器核心；好处是降低长期维护负担，代价是对外部项目维护形成依赖风险。AI 层面，Gamma
              通过多模型架构路由请求，根据任务类型和用户层级，在大语言模型（包括 API changelog 确认的 GPT 系列和 Claude 集成）以及
              recraft-v4、gemini-3.1-flash-image、flux-2-max 等图像生成模型之间选择。基础设施托管在 Google Cloud Platform
              云平台，提供企业级网络和数据中心基础。状态页报告五个独立监控的服务组件：Website、Web Application、API、Multiplayer、Site Hosting 和 AI。所有传输中数据均用
              TLS 1.2 或更高版本加密；静态数据使用 AES-256 加密并定期轮换密钥。零信任访问控制按用户身份和设备上下文授权，而不是按网络边界授权；平台只存储可撤销的 OAuth 2.0
              token，不存储用户凭证。
