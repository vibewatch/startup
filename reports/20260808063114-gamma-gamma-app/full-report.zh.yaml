      - number: '1.4'
        title: 规模、指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 11 月，Gamma 披露 $100M ARR、7000 万总用户，以及超过 60 万付费订阅用户。公司自 2023 年起盈利，并在 2025 年 5 月突破 $50M ARR
              时已经盈利，当时约有 30 名员工。Sacra 估计 2025 年 10 月 ARR 约为 $102M，2024 年同比增长 365%，基数约为 $30.5M。ARR 曲线明显加速：2024 年 12 月为
              $32.5M，2025 年 5 月为 $50M，2025 年 11 月为 $100M——六个月翻倍。用户已在平台上累计创建超过 4 亿份演示文稿、文档和网站，每天新增内容超过 100
              万份。印度是增长最快的市场，在没有直接营销支出的情况下达到 950 万用户；公司计划 2026 年在亚太建立本地布局。按约 52 名员工、$100M ARR 计算，人均收入约 $1.9M。以 $2.1B 估值和约
              $102M ARR 计算，隐含收入倍数约为 21× ARR。2022 年末，Gamma 总用户约 60,000，现金续航约一年，随后全面转向 AI，改写了公司轨迹。
