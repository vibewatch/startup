      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Gamma 由 Grant Lee（CEO）、James Fox（President）和 Jon Noronha（CPO）共同创立，三人此前都在 B2B 实验软件公司 Optimizely 共事。Grant
              Lee 拥有 Stanford University 机械工程学位，加入 Optimizely 并创立 Gamma 前曾从事投资银行和咨询。创始洞察来自 Lee 2020 年做顾问时的经历：他发现自己约 90%
              的时间都耗在排版演示文稿上，而不是打磨实质内容。COVID-19 居家令期间，三位创始人在旧金山一套改造过的两居室公寓里做出了最初产品。共同的 Optimizely
              背景塑造了以实验驱动的文化，公司将快速产品迭代归因于此。截至 2025 年 11 月，Gamma 约 52 名全职员工创造 $100M ARR，人均收入约 $1.9M，位居生产力 SaaS
              品类最高水平之一。除三位创始人外，官方发布并未公开列出完整领导团队；剩余团队构成由证据缺口覆盖。B 轮之后，公司治理采用标准私营公司结构，董事会包括 Andreessen Horowitz、Accel
              和创始团队。
