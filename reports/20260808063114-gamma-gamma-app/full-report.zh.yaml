      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              Gamma 在三轮已披露融资中累计获得约 $87–91M 一手和二手资本。2021 年 10 月，公司完成 $7M 种子轮，Accel 领投，知名天使包括 Zoom CEO Eric Yuan、前
              LinkedIn CEO Jeff Weiner，以及 Airtable、Patreon、Segment 和 Honey 的创始人。机构种子轮共同投资方包括 Script Capital、South Park
              Commons、LocalGlobe、Afore Capital 和 Hustle Fund。2024 年 5 月，公司完成 $12M A 轮，仍由 Accel 领投，Script Capital、Lorimer
              Ventures、South Park Commons 和 Fellows Fund 参投。最关键事件是 2025 年 11 月 B 轮：Andreessen Horowitz 以 $2.1B 估值领投
              $68M，Accel、Uncork Capital、South Park Commons 和 Script Capital 参投。该轮包括 $20M 二手部分，为早期员工提供流动性。a16z General
              Partner Sarah Wang 主导投资，并公开称自己是 Gamma 重度用户。Gamma 历史上最重要的资本效率信号，是一手融资额与已实现 ARR 的比例：B 轮前，公司仅募集约 $23M
              一手资本，却增长到 $100M ARR；在任何 B 轮稀释前，投入业务的资本产生了约 4.3x 回报。
