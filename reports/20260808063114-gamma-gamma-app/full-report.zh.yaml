      - number: '1.5'
        title: 风险、批评与竞争威胁
        blocks:
          - type: paragraph
            body: >-
              Gamma 面临来自 Microsoft PowerPoint 和 Google Slides 的商品化风险；两者合计服务约 15 亿用户，并在买方已经付费的企业生态中集成自有生成式 AI
              功能（Microsoft Copilot for PowerPoint、Google Gemini for Slides）。在 AI 原生竞争者中，Tome 展示了品类风险：尽管融资 $81M、积累 2500
              万用户，Tome 在仅实现 $3.5M ARR 后退出演示文稿方向，说明单纯获客并不保证变现。2025 年，网络犯罪分子利用 Gamma 的 gamma.app 域名和免费网站发布能力，托管钓鱼跳转页，目标是
              Microsoft 账户凭据。该攻击并非平台安全漏洞，但带来声誉暴露，也揭示了任何允许轻松创建公共链接的平台都内含双重用途风险。Trustpilot 上的用户评价明显负面，约
              1.7/5，反复投诉自动续费计费、客服响应差，以及 PowerPoint 导出不兼容。卡片化 Web 格式无法干净导出为标准 16:9 PPTX 尺寸，限制了必须交付客户级演示文稿的用户吸引力。2023
              年初，Silicon Valley Bank 倒闭期间，Gamma 在转到 JP Morgan 前险些错过发薪；这提醒投资人，早期公司的运营资金管理风险并非为零，值得单独披露。
