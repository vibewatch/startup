      - number: '3.3'
        title: 切换成本、分发能力与锁定
        blocks:
          - type: paragraph
            body: >-
              这个品类最强的竞争护城河属于既有巨头，而不是任何 AI 原生初创公司。Microsoft 和 Google
              已经掌握文档库、管理员控制台、身份层和训练出来的使用习惯，这些因素决定许多企业如何创建和审批演示文稿。Canva 增加了另一条分发向量：一个全用途视觉内容套件，可吸收轻量演示任务，而无需再买一个订阅。Gamma
              的 Web 原生格式降低了链接分享摩擦，但对标准化使用 PPTX、Slides、模板或内部审批流程的买方，也提出了治理问题。导出支持有帮助，却无法完全消除买方担忧：Gamma
              演示稿在用于董事会、客户或受监管场景前可能仍需修补。因此，切换成本是不对称的：Gamma 易于试用，既有巨头难以替代。这种不对称让自下而上的病毒式分发有价值，但不足以支撑企业持久性。
