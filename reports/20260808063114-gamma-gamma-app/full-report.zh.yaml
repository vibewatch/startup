      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 的扩张策略依赖三套机制：AI 积分耗尽推动个人用户进入付费层；团队协作需求触发 workspace/Teams 升级；企业自动化买家的 API 需求。Gamma for Teams 计划和带 API
              访问的 Ultra 层级是主要增购向量。扩张收入高度取决于企业内部个人用户采用能否转化为集中式 IT 采购；这一步需要 SOC 2 合规、SSO 和品牌控制功能，而 Gamma
              较低层级尚不能完全满足。集中度风险是多维的：India 占用户基础 14%，但因用户画像价格敏感，收入贡献不成比例地低；United States
              的收入占比可能相对于用户占比不成比例地高。免费增值漏斗高度集中：约 99% 注册用户不付费，意味着整个 ARR 基础落在不到 1% 的账户里。公司未披露前 10 大客户收入集中度，也未披露是否有单一账户贡献超过
              1% ARR。目前渠道依赖较低——Gamma 主要依靠直销和自助销售，JPMorgan
              的合作伙伴折扣是唯一公开已知渠道安排。病毒式驱动的自然增长模型降低获客成本，但也造成地域集中（US、India、Brazil）和细分群体集中（prosumer/初创公司偏重），可能限制企业 ARR
