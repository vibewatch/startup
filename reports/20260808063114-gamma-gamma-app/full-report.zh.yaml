      - number: '5.6'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Gamma 公开的安全姿态以 Google Cloud Platform 云平台 托管、零信任访问控制、TLS 1.2 以上传输加密、带定期密钥轮换的 AES-256 静态加密，以及 OAuth 2.0 可撤销
              token 认证为中心。公司正积极推进覆盖五项 Trust Service Criteria——Security、Availability、Processing Integrity、Confidentiality
              和 Privacy——的 SOC 2 认证，但截至报告日尚未完成。Gamma Help Center 将已发布合规文档分为三类：Privacy Policies、数据保护实践，以及 DMCA
              和版权合规。另据开发者门户，MCP 服务器通过带 Dynamic Client Registration 的 OAuth 为 AI 工具访问认证，为第三方 AI 集成提供标准化、可审计的访问路径。SOC 2
              Type II 认证尚未完成，是实质性采购风险：许多企业和受监管行业客户在批准供应商前都要求最新审计报告。Gamma 的隐私文档也尚未确认面向 EU 用户的 GDPR 特定数据驻留控制；Help Center
              关于 EU 上线状态未说明的注记，也给欧洲交易留下疑问。Gamma 状态页公开记录 Website、Web Application、API、Multiplayer、Site Hosting 和 AI
              组件的服务可用性，提供基本正常运行时间透明度，但缺少 SLA 承诺。若能提供结构化事故复盘，并为企业合同定义 RTO/RPO 目标，事故透明度还可增强。
