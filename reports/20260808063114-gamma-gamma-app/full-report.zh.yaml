companyProfile:
  summary: >-
    Gamma 是一家位于旧金山的 AI 演示文稿、文档和网页创作平台，由 Grant Lee（CEO）、James Fox（President）和 Jon Noronha（CPO）于 2020 年 11 月创立，三人此前都在
    Optimizely 共事。产品用提示词驱动的生成流程取代手工排版幻灯片，输出响应式、Web 原生的视觉内容，并可用链接分享。免费增值的 credit
    模型拉动获客；付费套餐（Plus、Pro、Ultra、Team、Business）把活跃用户转化为订阅用户。公司在 2025 年 11 月以约 $23M 一手资本做到 $100M ARR，跻身 SaaS
    史上资本效率最高的增长曲线之一，并自 2023 年起盈利。2025 年 11 月，Andreessen Horowitz 领投 $68M B 轮，估值 $2.1B，累计融资约 $90M。Gamma Agent、Gamma
    Imagine 和公共 API 将产品从最初的幻灯片生成器扩展成完整的 AI 视觉叙事套件。
