            title: 病毒式 PLG 以近零 CAC 带来 70M 用户
            body: >-
              Gamma 的病毒式分享模型——演示文稿以公开链接分发，并露出 Gamma 品牌——用极少营销支出带来了 70 million 注册用户。India 的 9.5 million
              用户没有任何广告预算投入，是价格敏感市场产品市场匹配的有力证明。每日 1 million 次内容创建事件，说明活跃队列存在习惯性参与。
