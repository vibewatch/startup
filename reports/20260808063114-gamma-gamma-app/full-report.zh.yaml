          - type: callout
            title: Gamma Imagine 重塑平台竞争框架
            body: >-
              March 2026 推出的 Gamma Imagine 把 Gamma 从 PowerPoint 替代品重新定义为完整视觉沟通平台。新增 AI 原生 logo、信息图、图表和社交帖创建后，Gamma
              不再只与演示工具竞争，而是进入与 Canva、Adobe Express 和 Figma 并列的更大市场。这扩大了总可用市场，也降低了演示文稿导出瓶颈的战略重要性；但 Gamma
