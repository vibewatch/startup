      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              Gamma 的用户增长是产品驱动病毒式采用的典型案例。平台在 2022 年公开 beta 上线时约有 60,000 名用户；March 2023 的 AI 重新发布引爆增长，随后九个月新增 10 million
              用户。到 November 2025，Gamma 报告全球注册用户 70 million，累计内容创建超过 400 million 项，每日新增超过 1 million
              项——这是习惯性参与度的频率代理指标。平台在盈利状态下达到 $100 million 年经常性收入，约 600,000 名付费订阅者对应估计 0.86% 的免费转付费率，低于 SaaS 行业通常 2–5%
              的基准。低于平均的转化率，与消费级、低摩擦免费层在结构上相符：用户不升级也能获得显著价值。India 到 April 2025 拥有 9.5 million 用户，成为 Gamma
              增长最快的市场，完全由自然和病毒式分享驱动，而非付费营销；这说明其在价格敏感的新兴市场有强产品市场匹配。Brazil 和 Australia 是次级国际增长市场，Asia 合计约占用户基础的
              25%。JPMorgan 的 startup banking 部门向其初创客户提供 Gamma 折扣，验证了 Gamma 临近企业场景的轨迹，说明成熟金融机构把 Gamma
              视为初创工具栈中的可信工具。Harvard Business School 在 2026 年制作了 24 页 Gamma 案例研究，进一步确认公司作为被研究的市场颠覆者的相关性。每日高创建率（1M
              items/day）意味着有一批高度活跃用户，但 Gamma 不披露月活、日活或队列级留存数据，因此无法区分自然粘性，还是持续获客在填补漏水桶。
