      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: AI 生成速度是核心护城河
            body: >-
              Gamma 能在 60 秒内把自然语言变成精修的多卡片 deck，这是其近期最可守的护城河。React/Yjs 架构让实时协同叠加在 AI 优先的生成闭环之上，传统工具若不彻底重构，很难复制。接近 100
              million 的用户基础形成数据和网络优势，并通过模板流行度信号与品牌套件采用持续复利。
            calloutType: strength
            claimRefs:
              - CE003
              - CE011
          - type: callout
            title: PowerPoint 导出保真度反复卡住企业采用
            body: >-
              G2、Trustpilot、Deckary 和 AiWithIt 的独立评测一致把 PowerPoint
              导出列为产品最主要限制。文字会被压平成静态图片，动画丢失，格式不一致还需要人工清理。在咨询、金融、法律和企业环境中，可编辑 PPTX 交付常是合同要求；此时速度优势会变成工作流阻塞。Gamma
              尚未公开承诺在路线图中解决导出保真度。
            calloutType: risk
            claimRefs:
              - CE007
              - CE037
              - CE038
          - type: callout
            title: 缺少 SOC 2 限制受监管行业企业销售
            body: >-
              Gamma 的 SOC 2 Type II 认证正在推进，但尚未完成。许多受监管行业和企业采购流程把最新审计报告列为供应商必备资格。在 Gamma 完成并发布 SOC 2
              报告前，医疗、金融服务和政府市场的销售周期会遇到合规闸门摩擦，而认证更完整的竞争对手（Salesforce、Microsoft 和 Notion）无需面对这种摩擦。
            calloutType: risk
            claimRefs:
