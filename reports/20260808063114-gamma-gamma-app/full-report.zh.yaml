      - number: '8.4'
        title: 情景分析与回报建模
        blocks:
          - type: paragraph
            body: >-
              三种情景刻画 Gamma 到 2028 年最可能企业化路径下的投资回报区间。乐观情景下，企业席位扩张推动 Gamma 到 2028 年达到 $250M ARR，NDR 高于 120%，以 18–22× ARR 融
              Series C 或 IPO，退出价值为 $4.5B–$5.5B。这要求 Gamma 证明 Figma 级企业留存指标，并替代大量 Microsoft PowerPoint
              企业使用；可以实现，但尚未在规模上被证明。基准情景下，Gamma 到 2028 年达到 $175M ARR，企业牵引力中等，NDR 为 105–115%，以 12–16× ARR 退出，退出价值
              $2.1B–$2.8B，意味着相对 $2.1B Series B 成本基础大致持平到小幅回报。基准情景取决于 Gamma 在 Microsoft Copilot 实现完全功能平价前，成功把 SMB
              偏重客户基础转成企业账户。悲观情景下，竞争替代加速，ARR 增长到 2028 年放缓至 $120M；随着市场把 AI 内容工具按非 AI-native SaaS 可比公司重估，估值倍数压缩至 6–9×，隐含
              $720M–$1.1B 退出，并相对成本基础亏损 50–65%。乐观与悲观之间的关键分水岭是 NDR 阈值：如果企业 NDR 超过 120%，溢价倍数可能维持；如果低于 100%，倍数压缩几乎确定。正如
              Daily Moss 和其他反向分析师指出，late 2025 的 AI 巨额融资估值，如果公司无法在 12–18 个月内证明企业耐久性，会带来显著 down-round 风险。
