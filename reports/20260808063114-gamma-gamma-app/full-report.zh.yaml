            body: >-
              Gamma 最突出的财务特征是资本效率。B 轮交割时，公司约有 52 名全职员工，创造约 $2M ARR/员工，是 SaaS $200K–$500K/员工中位数的 4–10 倍，也可与
              Datadog（$895K/员工）等顶级上市 SaaS 公司相比，只是员工基数小得多。CAC 回收期未披露；不过 Gamma 的 PLG 打法（通过免费增值实现产品驱动增长）意味着付费获客支出极低。公司确认，在
              B 轮融资时尚未动用 $12M A 轮资金，说明 A 轮资金被留作储备，而业务靠订阅收入自我供血。这使 Gamma 的烧钱倍数实质为负（或接近零），远低于 SaaS 1.5× 中位数。免费到付费转化由终身
              credit 上限和去水印激励推动，但具体转化率未公开。Sacra 估计 7000 万注册用户中有超过 60 万付费订阅者，意味着 0.86–0.9% 付费转化率，低于典型 B2C
