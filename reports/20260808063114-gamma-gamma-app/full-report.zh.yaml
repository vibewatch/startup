  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Gamma 的相关市场横跨三个嵌套品类。最宽的是全球演示软件市场——所有用于在商业、教育和个人场景中创建结构化、视觉化沟通文档的工具——2025 年规模约 $8.23B，预计 2026 年达到
              $8.91–9.65B。这个 TAM 包括 Microsoft PowerPoint 和 Apple Keynote 的本地授权、Google Slides 和 Canva 的 SaaS
              订阅、Prezi、Zoho Show，以及长尾垂直工具。不纳入这一边界的包括通用文字处理器（Microsoft Word、Google Docs）、项目管理工具（Asana、列表模式下的
              Notion）和数据可视化平台（Tableau、Power BI），因为这些工具的主要输出不是可展示的幻灯片或文档成品。在该 TAM 内，是基于云的协作演示细分市场；到 2026 年，它占部署偏好的约
              59–72%，反映远程和混合办公的持续迁移。Gamma 完全在这一云原生子赛道竞争。再往内，是 AI 原生演示生成市场——AI 根据提示词生成初始结构、设计和内容，而不是仅辅助选择模板。按窄口径，该 AI
              原生切口估计为 $0.73B；按更宽的商业口径，包括自主演示代理、API-first 架构和 MCP 集成工作流，则为 $4.7B。主要现状替代品是手工 PowerPoint，它在全球服务约 15 亿用户，并通过
              Microsoft 365 深嵌企业沟通流程。Google Slides 是第二替代品，在教育场景占优。Canva 处在设计驱动的相邻市场，按产品使用指标在更宽的演示品类中约有 60% 市占率。Gamma
              排除的视频优先演示格式（Loom、Vidyard）和沉浸式 AR/VR 演示工具服务的是不同受众和工作流。
