      - number: '2.4'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              远程和混合办公是演示软件市场的首要结构性驱动。2020–2024 年，远程办公工具采用率提高 61%，直接推高对云原生、协作式演示平台的需求。到 2026 年，27.5%
              的美国雇员至少部分时间远程工作（Bureau of Labor Statistics），继续支撑虚拟会议内容的高位需求。该驱动同时利好既有巨头（Microsoft 365 Copilot for
              PowerPoint、Google Workspace Gemini for Slides）和 Gamma 这样的 AI 原生新进入者。知识工作者采用 AI 是第二大驱动。2026 年，85% 的营销人员使用
              AI 创作内容，高于 2023 年的 61%；82% 的企业以某种形式使用 AI 写作工具。演示工具中的 AI 功能采用率也增长了 47%。这一趋势与 Gamma 的 ARR 加速直接相关：2023 年 3
              月集成 GPT-3.5 后，每日注册从数百人变为约 10,000 人，ARR 从 2024 年底的 $30.5M 增长到 2025 年末的 $102M。病毒式免费增值采用是 Gamma 的自有增长驱动。Gamma
              约 70% 用户增长来自有机推荐，可分享链接模式让每份创建出的文档都成为分发渠道。印度 950
              万用户没有任何营销支出；美国、巴西、俄罗斯和德国也通过同一机制成为主要市场。教育数字化提供长期结构性顺风，尤其在亚太和新兴市场。UNESCO 报告称，疫情期间远程学习推动 72%
              学校采用数字演示工具，并且这种采用延续了下来。Morgan Stanley 2026 年 AI 市场分析认为，AI 已成为“an industrial buildout”和“a key driver of
              GDP”，目前 21% 的 S&P 500 公司提到 AI 驱动现金流利润率扩张。这轮宏观 AI 投资浪潮为 Gamma 这样的 AI 原生生产力工具创造了有利环境，使其能够吸引此前难以获得的企业预算。
