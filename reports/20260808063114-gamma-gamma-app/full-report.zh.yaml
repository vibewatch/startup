      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Gamma 的 7000 万用户可按职业角色、公司规模和使用场景切分。企业专业人士约占用户 35%，其中营销和销售是最大单一细分，占 30%。教育工作者和培训师占全球用户 20–25%，反映 Gamma 在
              K-12 和高等教育市场渗透强，因为免费层访问和便捷链接分享契合度高。咨询和金融专业人士占 15%，创业公司创始人再占 10%。Gamma 的理想客户画像——无论按公司自身定位还是第三方 ICP
              分析——都是“高节奏个人知识工作者”：创始人、营销人员、教育工作者或顾问，他们需要频繁产出专业视觉内容，但没有正式设计训练，也愿意采用 Web 原生、基于链接的交付方式，而不是 PPTX 附件。这个人群画像推动
              Gamma 的免费到付费转化漏斗；对个人用户而言，去掉品牌标识（“Made with Gamma”
              水印）是最主要升级触发点。预算归属因细分而异。在企业和中端市场部署中，预算负责人通常是团队负责人、营销总监，或批准 SaaS 预算项的 CFO；在教育场景中，可能是自掏腰包的教师，也可能是学区或大学 IT
              预算下的机构授权。自由职业者和创业公司创始人则完全自费。采用路径遵循病毒循环：免费用户创建可分享的 Gamma 链接，接收者点击并发现工具，从而在没有营销支出的情况下带来有机获客。印度 950
              万用户完全通过该机制积累。从免费到付费的推进力来自使用摩擦（credit 限制）、专业需求（去品牌、分析）和团队扩张（集中计费、管理员控制）。Team 计划 $240/seat（至少 2 席）和 Business
              计划 $480/seat（至少 10 席）构成企业变现路径。AI 原生 SaaS 工具的免费增值转化基准在 2026 年为 15–20%，明显高于传统 SaaS 的 8% 中位数；但 Gamma 60
              万付费订阅者对 7000 万总用户，意味着总转化率低于 1%，显示免费用户基数庞大但低参与度用户很多。
