        - 驱动混合 ARPU 计算；关键转化漏斗指标
        - 确认定义（月活付费 vs. 累计）；流失率
      - - ARPU（混合估计）
        - 隐含约 ~$167/年（$100M ARR / 600K subscribers）
        - 低——推导估计；实际值可能随企业组合不同
        - 反映 LTV 和商业化效率
        - 要求按层级（Plus、Pro、Ultra、Team、Business）分别提供 ARPU
      - - 每 FTE 收入
        - 每员工约 ~$1.9–2.0M ARR（50–52 FTE）
        - 高——多个独立来源一致
        - 效率异常值；是 SaaS $200–500K/FTE 中位数的 4–10x
        - 随员工数扩张跟踪；关键风险是利润率压缩
      - - 毛利率
        - 未披露；基于 AI-SaaS 成本画像估计 70–85%
        - 低——仅为估计；实际取决于模型 API 成本和基础设施
        - 对 LTV/CAC 比率和长期盈利能力重要
        - 要求提供经审计毛利率；COGS 组成拆分
      - - CAC / CAC 回本周期
        - 未披露；PLG 自然模型暗示付费 CAC 很低
        - 低——未披露支出；无法计算回本
        - 随付费销售加入，用于评估企业 motion 可扩展性的关键指标
        - 企业 motion 扩张后，要求按渠道提供 CAC（自然 PLG vs. 付费销售）
      - - 净收入留存率（NRR）
        - 未披露
        - 低——无公开数据；团队计划席位扩张暗示 NRR 为正
        - 决定现有客户收入是在扩张还是收缩
        - 要求提供过去 4 个季度按队列拆分的 NRR（个人 vs. 团队 / 企业）
    notes: >-
      ARPU 是推导估计，不应孤立使用。毛利率、CAC 和 NRR 是 Gamma 未披露的私有指标；标记为「estimated」或「not
      disclosed」的值，应在数据室访问时验证。置信度反映来源层级和佐证数量，不代表统计精度。
