      - number: '5.4'
        title: 集成生态与开发者平台
        blocks:
          - type: paragraph
            body: >-
              Gamma 于 November 2025 在 https://public-api.gamma.app/v1.0/ 推出公开 REST API v1.0 正式版，替代 January 2026 已弃用并停用的
              v0.2 beta。API 支持从文本程序化生成、从模板生成、异步状态轮询、主题和文件夹列表、gamma 归档与删除。认证使用自定义 X-API-KEY header；API 访问需要
              Pro、Ultra、Teams 或 Business 计划。开发者文档还描述了一个 MCP（Model Context Protocol）服务器，可让 AI 工具通过带 Dynamic Client
              Registration 的 OAuth 创建和读取 gammas，使任何兼容 MCP 的 AI 助手都能访问 Gamma，无需传统 API key 设置。无代码和低代码侧，2026 年带来了
              Zapier、Make 和 n8n 的原生自动化集成（均与 v1.0 API 完全对齐），以及 ChatGPT（March 6, 2026）、Claude（January 2026）、Grok（May
              2026）、Atlassian Rovo、Superhuman Go 和 Profound 内的连接器。官方 npm 包 @gammatech/n8n-nodes-gamma 让自托管 n8n 部署能够程序化生成
              Gamma 内容。广泛的集成面降低了主要生产力平台既有用户的工作流切换成本，也借 ChatGPT 和 Claude 的庞大用户群提供分发渠道。
