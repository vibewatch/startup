      - number: '4.5'
        title: 资本充足性与 B 轮部署
        blocks:
          - type: paragraph
            body: >-
              Gamma 于 2025 年 11 月完成 $68M B 轮融资，估值 $2.1B，Andreessen Horowitz 领投，Accel 和 Uncork Capital 参投。该轮包括 $20M
              二手部分，为早期员工提供流动性。三轮（种子轮、A 轮、B 轮）累计融资约 $87–91M。由于公司在 B 轮交割前尚未花掉 $12M A 轮资金，且已确认盈利，Gamma 进入 2026
              年时拥有充足现金储备。公司表示计划把新资本用于 AI 工程招聘、加速产品开发和拓展企业市场，但未披露具体资本配置。公司未披露下一轮融资触发条件或计划 IPO 时间表。盈利能力使公司运营不依赖外部资本，B
              轮提供的是战略选择权，而非生存现金期。Gamma 未披露债务、典型 SAFE 结构之外的可转债，或项目融资义务。以 $2.1B 估值、约 $102M ARR 计算，隐含 21× ARR
              倍数，反映市场给一家资本效率高、已盈利、超高速增长的 AI 平台以溢价定价；但这也意味着 2026 年及以后存在显著执行预期。
