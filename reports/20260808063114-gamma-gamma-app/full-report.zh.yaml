  - id: TV006
    title: 最终尽调要求表
    columns:
      - 优先级
      - 尽调要求
      - 对估值为何重要
      - 决策影响
      - 询问对象
    rows:
      - - 1 – 关键
        - 按队列拆分的净美元留存（NDR）：企业（>$10K ACV）、中端市场、SMB 和免费转付费
        - NDR 是 SaaS 溢价倍数最重要的单一预测指标；Figma 130%+ NDR 支撑 IPO 时 22× ARR；没有 NDR 数据，Gamma 的 21× 倍数未被验证
        - 若企业 NDR <100%，投资逻辑破裂；若 NDR >120%，乐观情景确认
        - Gamma CFO 或 VP Finance；要求按客户细分和获客年份提供队列分析
      - - 2 – 关键
        - 按细分拆分的毛利率：整体、AI 推理成本占 COGS 百分比，以及 2023–2026 趋势
        - AI 推理成本轨迹决定 Gamma 盈利是可持续还是在被侵蚀；从 OpenAI 转向自托管模型会改善利润率，但尚未确认
        - 若毛利率低于 65%，倍数压缩；若 AI 推理成本占 COGS 百分比下降，支持乐观情景
        - Gamma CFO；要求提供经审计或管理层审阅的按细分 P&L
      - - 3 – 高
        - Series B 股权结构表：交割后所有权表，包括全部老股转让、创始人和关键员工归属计划、期权池规模和使用情况
        - Series B 中 $20M 老股部分暗示早期投资人部分变现；清晰股权结构可防止逆向选择和隐藏抛压
        - 对任何退出情景下建模稀释对投资人回报的影响至关重要
        - Gamma 法务顾问或 CFO；标准 VC 数据室项目
      - - 4 – 高
        - AI 模型 fallback 架构和提供商合同条款：使用哪些模型、哪些定价层级，以及主模型弃用或重定价时的 fallback 逻辑
        - Gamma 声称使用 20+ AI 模型；没有公开文档确认模型切换或成本管理架构；API 定价变化会直接传导至毛利率
        - 如果没有 fallback 架构，OpenAI 或 Anthropic 提价时毛利率风险会很尖锐
        - Gamma CTO 或 VP Engineering；要求技术架构概览和模型提供商合同
      - - 5 – 重要
        - 面向 EU 用户的 EU AI Act 合规路线图和 GDPR 处理方协议
        - EU AI Act GPAI 义务自 August 2025 起生效；违规罚款可达全球营业额 7%；Gamma 的 EU 用户基础带来监管敞口
        - 潜在监管责任可能削弱欧洲市场扩张，并造成投资人责任
        - Gamma General Counsel；要求 EU AI Act 准备度评估和 DPA 模板
    notes: 优先级（关键、高、重要）反映对投资逻辑的决策关键性。关键项目若为反向结果，会改变投 / 不投建议；重要项目影响定价和风险调整。所有要求都是后期私营 SaaS 投资的标准机构尽调项目。
