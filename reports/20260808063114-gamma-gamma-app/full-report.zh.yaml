      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 缺失 NDR 数据是最大的单一估值风险
            body: >-
              Gamma 尚未公开披露按队列拆分的净美元留存。2026 年每一个 SaaS 溢价倍数——Figma 的 22×（130%+ NDR）、Notion 的 30–37×（工作流锁定）、AI-native SaaS
              的 21.2× 中位数——都由有记录的留存耐久性支撑。Gamma 当前 21× 倍数借用的是品类基准，而不是由已披露队列数据验证。如果企业 NDR 低于 100%，倍数压缩到 8.5×（AI-enabled
              SaaS 中位数）会意味着相对当前定价估值下降 60%。因此，TV006 中的 NDR 要求不是常规尽调项，而是验证或推翻投资逻辑的数据点。
            calloutType: risk
            claimRefs:
              - CV021
              - CV029
              - CV030
              - CV043
          - type: callout
            title: Gamma 的 21× 倍数适合品类，并不异常
            body: >-
              关于 Gamma 估值的常见误解，是 21× ARR 代表过热定价。saasrise.com 对 575+ 家 AI-native 私营公司的 2026 分析把 VC 中位数定在 21.2×，意味着 Gamma
              的 Series B 价格位于同类队列的数学中位数，而不是尾部。Figma April 2026 以 22×
              IPO，提供了公开市场验证：具备企业留存的设计和创意工作流软件可以维持溢价倍数。关键区别在于，同类品类验证不能替代公司自身留存数据。Gamma 的 21× 在当前 AI 市场制度下可辩护；如果尽调发现公司企业
              NDR 低于 100%，这一倍数就不可辩护。
            calloutType: insight
            claimRefs:
              - CV024
              - CV021
              - CV030
          - type: callout
            title: 盈利给悲观情景提供硬底
            body: >-
              不同于估值水平相近的大多数 AI 初创公司，Gamma 自 2023 年以来的运营盈利创造了投资底部，实质性约束悲观情景。一家现金流为正、ARR 超过 $100M 且债务很少的公司，不面临归零风险。按传统
              SaaS M&A 底部倍数（5× ARR）计算，Gamma 的硬下行约为 $500M，相对 $2.1B 成本基础亏损 75%；这很严重，但不灾难性。这个底部意味着，该投资更像一家成熟 SaaS
              企业中的可转换股权，而不是对未经验证 AI 初创公司的二元下注。因此，以较 Series B 折让 15–20% 投资的建议，是一个按风险调整后、合理计入倍数压缩尾部风险的机会。
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV045
              - CV009
              - CV034
          - type: callout
            title: 反向分析师警告：AI 巨额融资估值在 2026 年带来 down-round 风险
            body: >-
              Daily Moss（2026）及类似反向评论指出，late 2025 以 20×+ ARR 倍数融资的 AI 公司，如果在巨额融资交割后 12–18 个月内无法证明企业耐久性，会面临显著 down-round
              风险。这个论点是结构性的：20×+ 的 VC 倍数需要 AI 板块持续溢价定价，而这取决于市场能否维持 AI-native 与传统 SaaS 之间的清晰区分。如果 Microsoft Copilot 和
              Google Gemini 通过在既有平台内提供 AI-native 功能成功模糊这一区分，独立 AI-native 工具的溢价倍数制度就会崩塌。Gamma 用于证明企业 NDR 的 February 2026
              窗口（Series B 后 12 个月）是观察这一风险的关键时期。
            calloutType: risk
            claimRefs:
              - CV036
              - CV014
              - CV035
