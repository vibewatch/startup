      - number: '7.4'
        title: 财务与运营风险
        blocks:
          - type: paragraph
            body: >-
              截至 late 2025，Gamma 的运营盈利缓和了近期烧钱风险，但结构性因素仍让公司财务风险画像偏高。驱动 70 million 用户的免费增值漏斗，主要服务免费层或低 ARPU 的 SMB
              账户；行业数据显示，SMB SaaS 年流失率为 40%（月度 4.2%），而 ACV 超过 $100K 的企业账户为 8.1%。Gamma 收入集中在这一高流失细分中，带来脆弱性：AI
              工具偏好出现实质性变化，或竞争对手提供更低门槛免费层，都可能触发免费用户快速流失。2026 Grip Security SaaS AI governance 报告指出，AI 集成 SaaS 环境存在治理缺口，包括
              Gamma 的集成面：AI 风险会通过连接的工作流传播，却缺少清晰供应商问责边界。January 2026 的 Trustpilot
              数据显示，基于用户对订阅计费失败、账户可迁移性问题和客服无响应的投诉，Gamma 评分为「Bad」、1.7/5；这些面向客户的运营缺口信号可能加快企业拒绝。状态页显示，截至 June 2026
              所有监控组件服务正常运行时间为 100%，但企业 SLA 要求有文档化灾难恢复和业务连续性计划，而 Gamma 尚未公开披露。G2 评测指出 AI 生成图片有时嵌入文字不可读，需要手工纠正，指向 AI
              输出质量波动风险。财务估值风险还受到公开市场压缩「AI wrapper」类 SaaS 倍数的影响；如果企业渗透停滞，Gamma 在 November 2025 融资时的 21× ARR 倍数容易被重估。
