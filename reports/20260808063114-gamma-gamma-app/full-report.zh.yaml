  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方任务
        blocks:
          - type: paragraph
            body: >-
              Gamma 的竞争集合比“AI 演示制作工具”这个说法更宽。直接同业包括 Beautiful.ai、Presentations.AI、Plus AI、SlidesAI 以及其他提示词生成演示稿产品；既有巨头组是
              Microsoft PowerPoint 和 Google Slides；相邻设计组是 Canva、Figma Slides 和 Adobe Express；替代组包括 Prezi 的空间化格式、Pitch
              的协作工作区，以及内部模板 / 制作流程。Gamma 最强的切入点是快速生成初稿和 Web
              原生分享，但多数买方仍会拿输出结果对照熟悉的文件、套件和品牌治理约束。因此，品类竞争边界由任务定义——把一个想法变成有说服力的视觉成品——而不是由工具分类定义。相应的尽调视角应是买方工作流契合度：个人创作者奖励速度，团队奖励品牌纪律，企业奖励治理，已嵌入套件的用户奖励与
              IT 已采购工具的连续性。这个框架也能区分当前替代方案和历史案例，避免过度加权已不再服务演示任务的产品。Tome 退出活跃演示竞争，是一个有用提醒：品类热度不保证持久变现。
