        title: 路线图与发布速度
        blocks:
          - type: paragraph
            body: >-
              Gamma 在 2026 年上半年展现出显著产品速度。旗舰发布是 March 17, 2026 的 Gamma Imagine，这是公司迄今最重要的产品扩展，新增面向 logo、信息图、图表和社交帖的 AI
              原生设计资产创建，把平台推入非演示文稿营销工作流，与 Canva 和 Adobe Express 直接竞争。Gamma Imagine 推出了 Smart Charts（继承品牌样式的交互式数据可视化）、AI
              Illustrations（用自然语言生成 logo 和营销资产）以及 AI Infographics（独立图表创建）。图像模型组合扩展至
              recraft-v4、recraft-v4-pro、recraft-v4-svg、gemini-3.1-flash-image、gemini-3.1-flash-image-hd、flux-2-max 和
