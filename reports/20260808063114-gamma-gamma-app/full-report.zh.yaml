      - - ARR 同比增长（2024→2025）
        - ~365% ($30.5M→$102M)
        - 高——Sacra 估计由多个来源佐证
        - 用于设定估值预期的表层增长率
        - 确认底层队列增长 vs. 新 logo 获客
