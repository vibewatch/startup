      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互冲突的估计
        blocks:
          - type: paragraph
            body: >-
              多份分析师报告对演示软件市场给出了相对一致的高层估计，但在 AI 原生子市场上分歧很大，反映出市场对什么算作“AI 演示工具”存在定义争议。The Business Research Company 和
              Business Research Insights 对 2026 年全球 TAM 的估计都接近 $8.9B，并预计 2030–2035 年增长到 $16.6–27.8B，CAGR 为
              13.5–17.2%。Coherent Market Insights 研究机构 使用略有不同的 2026 年基线 $8.6B，但同样给出 2033 年 $21.4B 终点和 13.9% CAGR。Global
              Growth Insights 研究机构 估计 2025 年市场为 $7.85B、2026 年为 $8.91B。这些估计总体一致，说明演示软件市场处在快速增长阶段，主要由 AI 功能集成和云采用驱动。AI
              原生子市场的估计分歧更大。Intel Market Research 估计 AI 演示生成市场 2026 年为 $0.73B，到 2034 年增长至 $1.45B（CAGR 9.3%）——这是保守口径，排除了带
              AI 功能的通用云工具。相比之下，市场参与者 2Slides 报告更宽口径的 AI 优先演示市场在 2026 年达到 $4.7B，较 2025 年 $3.1B 同比增长 52%。该宽口径包括自主演示代理、API
              生成演示稿，以及 Gamma、Beautiful.ai、SlidesAI 等平台。生成式 AI 的大市场背景也相关：GMInsights 估计 2026 年全球生成式 AI 市场为 $83.3B，并以 31.6%
              CAGR 增长至 2035 年 $988.4B，其中 OpenAI 占 23.6% 份额。这个宏观背景意味着，Gamma 是全球增长最快的软件品类之一中规模较小但增长很快的玩家。对于 Gamma
              的可服务市场（SAM），合理边界是云端、可免费增值触达、Web 原生的 AI 演示细分市场：2026 年约 $1–4.7B，取决于定义。以 Gamma $102M ARR 对应该 SAM，当前渗透率为
              2–10%。未来 3 年可获取市场（SOM）取决于企业向上销售速度和地域扩张；目前没有公开预测。
