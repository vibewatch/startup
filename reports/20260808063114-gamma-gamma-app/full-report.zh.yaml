chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Gamma 是一家 AI 驱动的演示文稿、文档和网页创作平台，成立于 2020 年 11 月，总部位于加州旧金山。产品用提示词驱动的生成流程取代手工排版幻灯片：用户描述想要什么，Gamma
              在数秒内产出专业级视觉内容。其卡片化输出格式有意跳出传统 16:9 PowerPoint 规范，把演示文稿渲染为响应式 Web 文档，用链接而非文件附件分享。商业模式是免费增值：免费层用有限 AI credits
              获客，付费计划（Plus 约 $8/月，Pro 约 $15–18，Ultra 约 $90–100）解锁更多 credits、高级导出选项、分析和协作功能。Gamma 托管在 Google Cloud
              Platform 云平台，并持有 SOC 2 Type II 认证，支撑企业采购。2025 年 9 月，3.0 版本与 Gamma Agent 同步发布；这个 AI
              助手可浏览网页、润色内容，并通过对话重设演示稿风格，把产品从 AI 幻灯片生成器重新定位为完整的视觉叙事平台。2026 年 3 月，Gamma 推出面向营销素材创作的 AI 图像生成工具 Gamma
              Imagine。2025 年 11 月发布的 API 把 Gamma 接入 Zapier、Make.com 等外部自动化工具。公司于 2023 年 3 月集成 GPT-3.5，使每日注册从数百人跃升至约
              10,000 人，验证了核心产品市场契合。这次 AI 拐点仍是 Gamma 产品史的关键章节，也是后续 ARR 增长的主要驱动。
