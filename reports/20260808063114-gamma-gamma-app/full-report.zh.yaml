          - type: callout
            title: 平台被滥用于钓鱼——声誉与域名信任风险
            body: >-
              网络安全研究人员已记录 Gamma 平台被武器化用于钓鱼攻击：威胁行为者在 gamma.app 域名上托管 Microsoft SharePoint 凭证收集页面，利用平台受信任的域名和合法 HTTPS
              绕过邮件安全过滤器。如果企业安全厂商把 gamma.app 加入域名黑名单，支撑 Gamma 自然获客引擎的病毒式分享闭环会被打断，公司还要投入高成本修复品牌。任何公开 AI 内容托管平台都有这种结构性风险，但
