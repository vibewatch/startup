      - number: '4.2'
        title: 公开业务势能与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Gamma 的收入轨迹是企业 SaaS 中最快的有机增长曲线之一。公司从 2023 年 6 月约 $7M ARR，增长到 2024 年 9 月 $24M ARR、2025 年 8 月 $50M ARR，并在
              2025 年 11 月达到 $100M ARR；2024 年底至 2025 年底同比增长率为 365%。这一增长没有依赖任何付费营销：70% 用户增长由有机推荐驱动，来源是免费层导出的“Made with
              Gamma”品牌水印和演示稿病毒式分享。B 轮交割时，平台披露全球注册用户 7000 万；但 60 万+ 付费订阅用户意味着从注册到付费的总转化率约 0.9%，与高节奏工具的免费增值 PLG
              基准一致。自上线以来，平台已创建超过 4 亿份内容；到 B 轮公告时，每天生成新增资产超过 100 万份。公司自 2024 年 1 月起盈利，在通常需要于增长阶段承受重亏的 AI
              初创公司同批样本中属于异类。Sacra 估计 2025 年 10 月 ARR 约为 $102M，意味着 2025 年第四季度继续加速。公司未公开披露 2026 年 ARR 目标。
