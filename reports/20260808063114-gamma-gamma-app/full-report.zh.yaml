      - number: '2.5'
        title: 采用约束与市场风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 渗透 TAM 的最大约束是 PowerPoint 生态锁定。Microsoft PowerPoint 全球服务约 15 亿用户，并通过 Microsoft 365 和 SharePoint 深嵌企业
              IT 栈。Gamma 的卡片化、Web 原生输出格式无法干净导出为标准 16:9 PPTX 尺寸，给必须用 PowerPoint 格式交付最终成品的用户制造兼容性摩擦。第三方 ICP
              分析确认，PowerPoint 不兼容是购买的主要障碍，也是 Gamma 企业潜在客户流失的领先原因。数据安全和合规担忧限制企业采用。约 38–52%
              企业用户在使用云端演示平台时担心数据泄露风险和未授权访问。EU GDPR、美国州隐私法（CCPA）和行业特定监管（医疗的 HIPAA、金融服务的 SOC 2）要求云厂商保持有文档支撑的合规姿态。Gamma 持有
              SOC 2 Type II 认证，部分缓解了这一担忧，但受监管行业仍需额外尽调，拉长采购周期。企业采购摩擦是任何 PLG 优先公司上行进入大客户时的内在约束。Gamma
              迄今增长主要靠自助和免费增值；大型企业交易需要 IT 安全审查、法务批准和采购签字，周期可延长至 3–6 个月。按分析师预测，约 25% 计划中的企业 AI 支出因 ROI 不清晰和基础设施瓶颈被推迟到 2027
              年。市场碎片化会限制定价权。到 2026 年，AI 演示市场已有 90+ 活跃工具提供商，高于 2024 年的 40+。这种激增压缩价格，并推高付费获客渠道的客户获取成本。受访企业中只有 15% 因采用 AI
              工具获得实质性 AI 相关盈利提升，说明 AI 演示工具的 ROI
              证明案例仍有限，从而约束企业为其支付溢价。免费增值模式本身也有结构性风险。当免费用户支持成本超过转化收入时，就会出现“免费增值死亡螺旋”；2026 年，AI 推理和基础设施成本上升，正在抬高生成式 AI
              工具的单用户运营成本。Gamma 60 万付费订阅者对应 7000 万免费用户，使其高度依赖转化率维持。
            claimRefs:
              - CM035
              - CM036
              - CM037
