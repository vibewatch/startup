      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 面对的是分层且快速演变的监管与法律风险栈。EU AI Act 于 July 12, 2024 发布在 Official Journal，对广泛部署的通用 AI 系统设定义务；Gamma 的 AI
              生成演示平台可被认为属于通用 AI 系统，需遵守透明度、文档和事故报告要求。最关键条款下，违规罚款可达全球年营业额的 7%。截至 June 2026，Gamma 关于 EU AI Act 通用 AI
              义务的公开合规文档很少，而 Gamma 已披露 EU 市场有显著用户增长，因此存在执法敞口。GDPR 合规义务适用于 Gamma 的欧洲用户，包括跨境数据传输要求；Gamma 的 Privacy Policy
              承认国际传输，但除标准合同条款外未详细说明传输机制。AI 版权方面，US Supreme Court 在 March 2026 拒绝受理 Thaler v. Perlmutter，确认 AI
              生成内容需要人类作者身份才能获得版权保护；这缩窄了 Gamma 代表用户主张 AI 生成输出版权的能力。2026 年 Bartz v. Anthropic 以 $1.5 billion 和解，显示 AI
              训练数据来源存在生存级责任敞口；虽然 Gamma 的主要敞口在内容生成层（不是模型训练），其上游 AI
              提供商仍面临持续的数十亿美元版权诉讼，可能影响服务连续性和定价。下方监管风险登记表按严重性列出主要许可、诉讼和执法风险项。
