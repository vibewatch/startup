      - number: '3.2'
        title: 能力、定价与包装对比
        blocks:
          - type: paragraph
            body: >-
              Gamma 在快速创作上具备可信功能集：有限免费提示词生成、从 PDF/PPTX 导入、导出到 PDF/PPTX/PNG/Google Slides、付费去品牌、高级模型、API
              访问和团队包装。它的弱点不是缺功能，而是这些功能所处的竞争语境。Beautiful.ai 主打品牌一致的团队和安全姿态；Canva 通过宽泛创意套件和 Magic Design 竞争；Microsoft 和
              Google 把 AI 嵌入客户已经购买的套件；Plus AI 和 SlidesAI 则让用户继续留在 Slides 或 PowerPoint 工作流里。因此，定价比较有两面性。Gamma
              的免费层和创作者价位升级有助获客，但套件竞争者可让演示 AI 显得像增量功能或打包功能，工作流插件也能降低迁移摩擦。实际含义是，在采购把 Gamma 与既有巨头的打包预算项对比前，Gamma
