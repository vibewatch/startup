              IPO 的情况下实现部分流动性，这种结构在后期私募轮中越来越常见。交割时，Gamma ARR 已超过 $100M，并由公司确认；Sacra Research 估计截至 October 2025 为
              $102M。这意味着 Series B 价格对应约 21× ARR 收入倍数。公司自 2023 年起运营盈利，说明新股资金是可选项，不是生存需要；这强化了未来投资人的谈判位置，也为估值创造了隐含底部。Gamma
