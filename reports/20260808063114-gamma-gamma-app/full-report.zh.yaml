      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 定义分歧制造估值模糊性
            body: >-
              2026 年 AI 演示市场窄口径（$0.73B）与宽口径（$4.7B）估计相差六倍，这不是噪音，而是方法论分歧：PowerPoint 和 Canva 中的 AI 辅助排版功能是否应算作“AI
              演示工具”。投资人以 21× ARR 支撑 Gamma $2.1B 估值时，SAM 叙事很关键：$4.7B 市场意味着约 2% 渗透率（增长空间充足），而 $0.73B 窄市场意味着 14%
              渗透率（增长空间更少）。Gamma 在融资材料中如何选择 SAM 叙事，值得审查。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
          - type: callout
            title: 零 CAC 地域扩张是稀缺资产
            body: >-
              Gamma 在印度市场以零营销支出触达 950 万用户，证明产品的病毒式链接分享机制可在高增长、移动优先、价格敏感市场中成为自我维持的分发引擎。对 Gamma 这一 ARR 规模的 SaaS
              公司而言，这种动态在结构上很少见：多数 $100M ARR 生产力 SaaS 公司都有显著付费获客成本。如果印度的病毒模式能在巴西（9.78% 流量）和东南亚复现，即便北美有机增长趋于成熟，Gamma
              仍可能维持低 CAC。
            calloutType: strength
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM031
          - type: callout
            title: PowerPoint 锁定是结构性天花板，不只是产品缺口
            body: >-
              Microsoft PowerPoint 的 15 亿用户基数不只是竞争对手，而是企业沟通事实上的输出格式标准。PPTX 导出兼容性是采购门槛，Gamma
              目前在许多企业交易中无法跨过这一关。这不是一个产品迭代周期就能解决的技术缺口；差异是架构性的（卡片化响应式 Web vs. 幻灯片网格式 PPTX）。在 Gamma 达到接近原生 PowerPoint 的
              PPTX 导出保真度前，其企业 SAM 会受到实质约束，中端市场交易也需要内部拥护者推动，而不是顺滑的自助采用。
            calloutType: risk
            claimRefs:
              - CM035
              - CM041
          - type: callout
            title: 规模扩大后，免费增值成本动态可能挤压利润率
            body: >-
              Gamma 有 7000 万用户，但只有 60 万付费订阅者（总转化率 <1%），因此需要为庞大免费用户群承担 AI 推理和存储成本。2026 年，模型复杂度上升推高 AI 基础设施成本，带来 SaaS
              基准中所说的“免费增值死亡螺旋”风险——免费用户支持成本增速超过付费转化收入。Gamma 自 2023 年起盈利，说明当前单位经济可行；但当免费用户基数增长到 100M+
              后，盈利能否持续，需要审查边际活跃用户成本趋势。
            calloutType: risk
            claimRefs:
              - CM042
              - CM043
              - CM044
              - CM045
          - type: callout
            title: AI 采用浪潮提供多年市场顺风
            body: >-
              短短三年（2023–2026），营销人员 AI 工具采用率从 61% 跳升至 85%，这是生产力软件史上记录在案的最快采用曲线之一。这一结构性迁移意味着，Gamma 面对的不是一个被更多竞争者瓜分的固定
              TAM；随着更多专业人士接受 AI 生成内容，TAM 本身也在扩张。Gamma 的问题在于，在既有巨头（Copilot for PowerPoint、Gemini for
              Slides）补齐功能缺口前，其病毒式、免费增值主导的模式能否把这个扩张市场中的足够一部分转化为付费。
            calloutType: insight
            claimRefs:
              - CM028
