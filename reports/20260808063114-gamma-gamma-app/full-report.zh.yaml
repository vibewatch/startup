  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Gamma 服务五类清晰客户群，它们在买方画像、使用场景、升级倾向和收入贡献上不同。教育群体覆盖学生、教师和 EdTech 管理员，带来高用户量但偏向免费层；教育者看重 Gamma
              能消除设计摩擦，让没有技术技能的人也能在几分钟内产出精修授课幻灯片或课程材料。营销和销售团队估计约占用户基础的 30%，用 Gamma 制作活动
              deck、绩效报告和客户提案；这类用户有更强升级倾向，因为经常性内容创建会持续耗尽 AI 积分。企业用户约占用户基础的 35%，包括咨询公司、内部沟通团队和项目经理，他们用 Gamma
              制作高管简报、入职材料和全球协作内容。初创公司和创始人是战略上重要的一类：创始人制作投资人 pitch deck 时，Gamma 常是第一个打开的工具，因为它能把数小时设计任务压缩到两分钟以内。最后，普通
              prosumer——自由职业者、咨询顾问和独立创作者——按人数是最大群体，但 ARPU 中等，主要落在 Plus 和 Pro 层级。Gamma 的免费增值模型意味着五类客户以相同方式进入产品；分化来自 AI
              积分耗尽、团队管理需求和品牌要求，这些因素把用户导向付费层。用户基础集中在免费层（70 million 注册账户中约 99%）意味着收入高度依赖少数高参与度或高需求账户，既是增长杠杆，也是对流失敏感的风险。
