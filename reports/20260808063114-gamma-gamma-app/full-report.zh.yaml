      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 规模化后的极致资本效率
            body: >-
              Gamma 用约 $23M 一手资本做到 $100M ARR；与典型 SaaS 基准相比，每 1 美元 ARR 所需资本不到四分之一。公司自 2023 年起盈利，意味着 B
              轮并非生存所需，而是在强势位置上加速扩张。约 52 名员工对应人均收入约 $1.9M，位居生产力软件品类最高水平之一。对 Gamma 单位经济和长期回报潜力的任何分析，都应把这一资本效率画像作为核心尽调信号。
            calloutType: strength
            claimRefs:
              - CO015
              - CO017
              - CO019
              - CO023
          - type: callout
            title: 钓鱼滥用与双重用途平台风险
            body: >-
              2025 年，网络犯罪分子利用 Gamma 的 gamma.app 域名和免费网站发布功能，托管针对 Microsoft 账户凭据的钓鱼页面。攻击利用了 Gamma 的品牌可信度：把 gamma.app
              加入白名单用于合法演示的组织，也无意中信任了钓鱼页面。事件不是 Gamma
              基础设施的数据泄露，但暴露出结构性双重用途风险——任何让用户轻松创建公共链接、却缺少滥用检测护栏的平台都会面临这一问题。对企业评估者而言，该事件要求审查 Gamma 的内容政策执行机制。
            calloutType: risk
            claimRefs:
              - CO032
          - type: callout
            title: 2023 年 3 月的 AI 拐点是创始级证明点
            body: >-
              Gamma 的整个增长故事都可追溯到一个产品决策：2023 年 3 月集成 GPT-3.5，用于 AI 演示文稿生成。集成前，Gamma 约有 60,000
              名用户，现金续航约一年。集成后，每日注册从数百人跃升至约 10,000 人。九个月内，公司新增 1000 万用户。这种前后对比格外清晰，是产品市场契合的证据，也把 Gamma 与更晚采用 AI、转化更低的 AI
              幻灯片竞争者区分开。2023 年拐点是本报告后续所有 ARR 和用户预测的分析锚点。
            calloutType: insight
            claimRefs:
