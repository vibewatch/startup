        - 中——数据飞轮逻辑成立，但没有披露 AI 专有训练数据
        - 中性；验证 Gamma 模型路由是否创造持久差异化，还是可被基于 GPT 的 wrapper 替代品取代
      - - 免费增值漏斗顶部规模
        - 70M 用户相对付费基础提供 116× 漏斗乘数；教育和 SMB 中的病毒式增长创造难以复制的低成本分发
        - 600K 付费 / 70M 注册 = 0.86% 转化；SMB 年流失 40%，带来年度收入替换负担
        - 高——用户和付费订阅者数量由公司确认；转化率由分析师推导
        - 谨慎；高量免费增值模型需要企业增购来支撑溢价倍数；尽调中要求按队列提供 NDR
      - - 时点与市场动能
        - AI VC 占 2025 年全球 VC 的 61%（$258B）；Gamma 有望受益于持续 AI 基础设施投资和企业 AI 采用顺风
        - Microsoft Copilot 和 Google Gemini AI Slides 在 2026 年积极发布竞争功能；时点优势正在侵蚀
        - 高——多个市场数据来源确认 VC 配置数字和竞争对手功能发布
        - 中性；时点优势真实但窗口在关闭；竞争护城河必须靠企业深度证明，而不是靠产品相似性
      - - 投资人质量信号
        - Andreessen Horowitz 领投是强质量信号；a16z 的 AI 投资逻辑和企业 SaaS 组合提供超越资本的战略价值
        - a16z 参与不保证退出；如果 a16z 持有多个相互竞争的 AI SaaS 仓位，存在组合拥挤风险
        - 高——a16z 投资由公司新闻稿和投资人公告确认
        - 正向；具备 AI 专长的机构领投降低尽调风险，但不能替代基本面估值工作
    notes: 证据质量评级为分析师评估。投资含义不是投资建议；它们是面向机构投资人的结构化尽调提示。
