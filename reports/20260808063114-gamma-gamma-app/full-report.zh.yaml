  productSummary: >-
    Gamma 销售一套 AI 原生视觉内容创作平台，覆盖演示文稿、文档和网页。用户用自然语言描述需求，平台在数秒内生成专业、响应式、卡片化的输出。核心模块包括 AI 演示稿构建器、Gamma
    Agent（可浏览、润色并通过对话重设演示稿风格的 AI 助手）、Gamma Imagine（面向营销素材的 AI 图像生成），以及把 Gamma 接入 Zapier、Make.com 和下游自动化流程的公共 API。产品与
    PowerPoint、Google Slides 竞争，同时切入这些工具并非为之设计的非线性、链接分享型使用场景。
  customerFocus: 全球 SMB 和中端市场的营销人员、创业公司创始人、教育工作者和知识工作者；正借助 SOC 2 Type II、SSO 和团队层席位授权进入企业采购。
  businessModel: >-
