company:
  name: Gamma
chapter:
  number: 7
  title: Risks
  summary: >-
    Gamma's risk profile is defined by three compounding forces: active exploitation of its platform
    by phishing threat actors that threatens enterprise adoption, competitive displacement pressure
    from Microsoft Copilot and Google Gemini embedded natively in incumbent productivity suites, and
    deep dependency on upstream AI model providers whose pricing and policy shifts directly compress
    margins. The company's operational profitability and $2.1B valuation provide a buffer, but a
    freemium-heavy user base prone to SMB-level churn, a lean 50-person team anchored by a single
    founder-CEO, and mounting AI copyright and EU AI Act regulatory exposure make this a
    risk-elevated stage for investors.

sections:
  - id: security-and-platform-abuse
    title: Security and Platform Abuse Risks
    body: >-
      Gamma's trusted domain status—a competitive advantage for user trust—has become a material
      security liability. Threat actors have weaponized Gamma's platform to create convincing
      phishing redirect pages that impersonate Microsoft SharePoint login portals, exploiting the
      gamma.app domain's high reputation to bypass enterprise email security filters. The attacks
      use an adversary-in-the-middle (AiTM) framework that allows real-time credential harvesting
      and session-cookie theft, enabling bypass of multi-factor authentication. Cloudflare Turnstile
      CAPTCHA is inserted mid-chain to prevent automated security scanning, further complicating
      detection. Because gamma.app is relatively new and often whitelisted by corporate security
      teams, the phishing chain enjoys unusually high delivery rates. Enterprise IT departments
      confronted with documented Gamma-hosted phishing campaigns may choose to block gamma.app
      links at the firewall level, creating an adoption ceiling for the enterprise segment Gamma
      most needs to grow. Gamma's Privacy Policy governs user-generated content including
      presentations and associated metadata; international transfers are processed under standard
      contractual clauses, but gaps in GDPR enforcement risk remain given Gamma's EU user base.
      Gamma's Terms of Use limit the company's indemnification obligations for harms caused by
      third-party misuse of its platform, but enterprise procurement teams will scrutinize platform
      abuse history in security reviews. The operational security register captures these failure
      modes, ranked by residual exposure.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
    tableRefs:
      - TR002
    figureRefs:
      - FR001

  - id: regulatory-and-legal-risks
    title: Regulatory and Legal Risks
    body: >-
      Gamma faces a layered and rapidly evolving regulatory and legal risk stack. The EU AI Act,
      published in the Official Journal on July 12, 2024, classifies general-purpose AI systems
      with widespread deployment obligations; Gamma's AI-generated presentation platform arguably
      qualifies as a general-purpose AI system subject to transparency, documentation, and incident
      reporting requirements. Non-compliance fines can reach 7% of global annual turnover for the
      most critical provisions. As of June 2026, Gamma's public compliance documentation with the
      EU AI Act's general-purpose AI obligations is minimal, creating enforcement exposure in the
      EU market where Gamma has disclosed meaningful user growth. GDPR compliance obligations
      apply to Gamma's European users including cross-border data transfer requirements; Gamma's
      Privacy Policy acknowledges international transfers but does not detail transfer mechanisms
      beyond standard contractual clauses. On AI copyright, the US Supreme Court's March 2026
      denial of certiorari in Thaler v. Perlmutter confirmed that AI-generated content requires
      human authorship to qualify for copyright protection; this narrows Gamma's ability to assert
      copyright in AI-generated outputs on behalf of users. The 2026 Bartz v. Anthropic settlement
      for $1.5 billion demonstrated existential liability exposure for AI training data
      provenance, and while Gamma's primary exposure is at the content-generation layer (not model
      training), its upstream AI providers face ongoing multi-billion-dollar copyright litigation
      that could affect their service continuity and pricing. The regulatory risk register below
      covers the primary licensing, litigation, and enforcement risk items, ordered by severity.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR031
    tableRefs:
      - TR001

  - id: competitive-displacement-and-dependency
    title: Competitive Displacement and Partner Dependency Risks
    body: >-
      Gamma's core value proposition—AI-powered presentation creation—sits in a product category
      that Microsoft and Google are actively integrating natively into their incumbent productivity
      suites at no incremental cost to subscribers. Microsoft Copilot is now embedded in
      PowerPoint for Microsoft 365 subscribers, replicating many of Gamma's AI content-generation
      features within the tool that already dominates enterprise presentations globally. Google
      Slides with Gemini integration provides a parallel competitive threat. Bain's 2025
      technology report identifies AI tools operating in low-proprietary-data, low-workflow-embedded
      categories as facing AI cannibalization; Gamma's Avataar Ventures displacement framework
      score places it in the "basic wrapper" quadrant (high AI penetration potential, limited
      proprietary data moat), where comparable companies trade at 1–2× EV/NTM revenue versus the
      6–8× that data-moated, workflow-embedded SaaS companies command. Gamma's stated use of
      "20+ AI models for highest-quality output" creates multi-vendor dependency; pricing changes,
      API deprecations, or model quality drift from providers like OpenAI or Anthropic flow
      directly into Gamma's product quality and cost structure. The dependency map (FR003) and
      risk transmission map (FR002) illustrate how these upstream risks propagate through Gamma's
      business model to revenue and valuation outcomes. The partner and dependency risk register
      quantifies these exposures.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR029
      - CR030
    tableRefs:
      - TR003
    figureRefs:
      - FR002

  - id: financial-and-operational-risks
    title: Financial and Operational Risks
    body: >-
      Gamma's operational profitability as of late 2025 mitigates near-term burn risk, but the
      company's financial risk profile remains elevated by structural factors. The freemium funnel
      that drove 70 million users serves predominantly free-tier or low-ARPU SMB accounts;
      industry data shows SMB SaaS churn rates of 40% annually (4.2% monthly) versus 8.1% for
      enterprise accounts above $100K ACV. Gamma's revenue concentration in this high-churn
      segment creates fragility: a meaningful shift in AI tool preference or a competitor offering
      a lower free tier could trigger rapid free-user defection. The 2026 Grip Security SaaS AI
      governance report identifies governance gaps in AI-integrated SaaS environments, including
      Gamma's integration surface, where AI risk propagates through connected workflows without
      clear vendor accountability boundaries. Trustpilot data from January 2026 shows Gamma rated
      "Bad" at 1.7/5 based on user complaints about subscription billing failures, account
      portability issues, and unresponsive customer support—signals of customer-facing operational
      gaps that could accelerate enterprise rejection. Service uptime has been 100% across all
      monitored components as of June 2026 per the status page, but enterprise SLAs demand
      documented disaster recovery and business continuity plans that Gamma has not publicly
      disclosed. G2 reviews highlight that AI-generated images sometimes have illegible embedded
      text requiring manual correction, pointing to AI output quality variability risk. Financial
      valuation risk is compounded by public-market compression of SaaS multiples for companies
      perceived as AI wrappers; Gamma's 21× ARR multiple at its November 2025 raise is
      vulnerable to repricing if enterprise penetration stalls.
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR028
      - CR032
      - CR033
    tableRefs:
      - TR004

  - id: people-execution-and-kill-criteria
    title: People, Execution, and Kill Criteria
    body: >-
      Gamma's execution risk is concentrated along two axes: key person dependency and team-size
      constraints. Grant Lee is the co-founder, CEO, and sole prominent public figure of Gamma;
      the company's product strategy, investor narrative, and growth model are publicly articulated
      through his leadership. A Stanford-trained engineer whose prior roles were COO at ClearBrain
      and CFO at Optimizely, Lee brings product and finance excellence but has limited track record
      in enterprise sales leadership—a gap that matters as Gamma pursues upmarket enterprise
      growth. With approximately 50 employees at $100M+ ARR, Gamma's per-capita productivity is
      exceptional but leaves the company operationally fragile: hiring freezes, turnover in the
      small engineering team, or the loss of key AI/ML engineers would materially slow product
      velocity. Gamma has no publicly disclosed patent portfolio, creating IP exposure relative to
      Microsoft, Google, and Adobe, which hold extensive AI and design IP assets. The Gamma Terms
      of Use cap vendor liability following industry-standard patterns, but this provides limited
      downside protection for enterprise customers relying on Gamma for mission-critical
      communications. The mitigation and kill criteria table below defines the monitorable triggers
      and threshold events that would indicate thesis-break risk, translating each major risk
      category into a concrete investment action implication.
    claimRefs:
      - CR026
      - CR027
      - CR034
      - CR035
      - CR036
    tableRefs:
      - TR005
    figureRefs:
      - FR003

