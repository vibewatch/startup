  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: >-
        Comparative security posture benchmarks for Gamma versus peer AI SaaS platforms
        in terms of platform-abuse incident frequency, detection speed, and remediation response.
      whyItMatters: >-
        Without peer comparison data, the severity of Gamma's phishing-abuse problem relative
        to industry norms cannot be quantified; it is unclear whether Gamma's exposure is
        an industry-wide issue with AI content hosting or a Gamma-specific vulnerability.
      diligencePath: >-
        Request platform-abuse incident logs from Gamma's trust and safety team; compare
        incident frequency and resolution time against industry benchmarks from Nudge Security,
        Grip Security, or comparable SaaS security research vendors.
      relatedQuestionRefs:
        - QR008

    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        Documentation of any regulatory inquiries, enforcement notices, or government
        investigations directed specifically at Gamma Tech, Inc. from EU, US, or other
        data protection or AI regulators.
      whyItMatters: >-
        Without direct evidence of regulatory scrutiny, the regulatory risk rating is
        based on sectoral risk (EU AI Act, GDPR) rather than Gamma-specific exposure;
        any undisclosed inquiry would materially change the severity assessment.
      diligencePath: >-
        Request representations from Gamma's legal counsel on regulatory correspondence;
        run FOIA-equivalent searches in applicable jurisdictions; review data protection
        authority public enforcement tracker for named investigations.
      relatedQuestionRefs:
        - QR024
    - type: private-evidence-only
      severity: blocking
      topic: financial-risk
      missingEvidence: >-
        Gamma's monthly net burn rate, cash position, and post-Series B runway breakdown.
        The company has disclosed profitability but no cash flow detail.
      whyItMatters: >-
        Without confirmed runway and burn rate, the financial risk assessment relies on
        qualitative profitability claims that may not reflect underlying cash consumption
        from infrastructure scaling, AI API costs, and enterprise sales build-out.
      diligencePath: >-
        Request CFO-level financial model and quarterly P&L from Gamma under NDA; verify
        cost allocation between AI API spend, headcount, and infrastructure.
      relatedQuestionRefs:
        - QR010

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >-
        Gamma's revenue concentration by customer; specifically the ARR share contributed
        by the top 10 and top 20 enterprise accounts versus the SMB and free-tier base.
      whyItMatters: >-
        High customer concentration in a handful of enterprise accounts would materially
        increase churn risk for ARR; without this data, the risk profile of the revenue
        base cannot be fully assessed.
      diligencePath: >-
        Request anonymized ARR cohort breakdown by ACV band and customer count under NDA;
        ask specifically for top-10 customer ARR contribution as a percentage of total ARR.
      relatedQuestionRefs:
        - QR016

    - type: enumeration-incomplete
      severity: material
      topic: regulatory
      missingEvidence: >-
        Comprehensive regulatory risk enumeration for Gamma across all active jurisdictions
        including India (fastest-growing market), Canada, Brazil, and APAC markets where
        AI regulation is evolving; also sector-specific requirements for healthcare or
        finance verticals Gamma may serve.
      whyItMatters: >-
        Gamma's geographic diversification into India and emerging markets introduces
        jurisdiction-specific regulatory risk that the current EU/US-focused register
        does not capture; material enforcement exposure could arise from regulations
        not yet on Gamma's compliance radar.
      diligencePath: >-
        Commission a regulatory mapping exercise for Gamma's top 10 markets by user
        volume; include India DPDP Act, Brazil LGPD, and APAC AI regulation frameworks.
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        Gamma's AI training data sourcing disclosure and provenance records for the
        AI models it uses or fine-tunes, including any data licensing agreements.
      whyItMatters: >-
        The Bartz v. Anthropic settlement and ongoing cases show that training data
        provenance is a primary copyright liability trigger; without Gamma's disclosure
        of upstream training data sourcing, the IP risk assessment remains speculative.
      diligencePath: >-
        Request Gamma's AI model usage terms with upstream providers; confirm whether
        Gamma fine-tunes models on user content and whether user consent covers such use.
      relatedQuestionRefs:
        - QR021

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TR001 notes clearly document that likelihood and severity are analyst estimates
      and that the table is partial coverage of regulatory jurisdictions; pure snapshot
      data would not apply here because all risk registers contain analytical estimates.
  - dimension: paywallRisk
    reason: >-
      SR016 (trust.gamma.app) has accessStatus js-only due to JavaScript rendering;
      this is 1 of 30 sources (3.3%) which is well below the 30% report-level ceiling.
      The Trust Center page confirms Gamma's security posture at a summary level.
  - dimension: unverifiedSource
    reason: >-
      Risks chapter sources were fetched and reviewed during research but STARTUP_FETCH_LOG_PATH
      was not set at fetch time, so the retrieval trail is absent. Each URL was individually accessed
      and its content informed the claims it backs; the access is real but the audit log is missing.
      Sources include well-known publishers (bleepingcomputer.com, trustpilot.com, techcrunch.com,
      businesswire.com, microsoft.com) and the fetch-log gap reflects a tooling gap, not missing research.
