callouts:
  - calloutType: risk
    title: Platform Abuse Is an Enterprise Adoption Ceiling
    body: >-
      Documented adversary-in-the-middle phishing campaigns hosted on gamma.app have been covered
      by major security publications and may trigger enterprise-wide domain blocking by IT security
      teams. If Gamma's domain is added to a default block list by any major enterprise email
      security vendor, the company faces a structural ceiling on enterprise seat expansion — not
      from product failure, but from security policy. Investors should request Gamma's trust and
      safety roadmap and abuse response SLA commitments before enterprise growth projections are
      taken at face value.
    claimRefs:
      - CR001
      - CR004
      - CR030

  - calloutType: risk
    title: Competitive Displacement Risk Is Existential at the Valuation Multiple
    body: >-
      Gamma is priced at approximately 21× ARR, a premium that requires sustained enterprise
      penetration and pricing power. Avataar Ventures' displacement framework places content
      creation tools with limited proprietary data moats in the "basic wrapper" quadrant where
      comparable companies trade at 1–2× EV/NTM revenue. If Microsoft Copilot and Google Gemini
      achieve feature parity in AI presentation creation — already underway in 2026 — Gamma's
      valuation multiple faces compression risk before enterprise penetration can justify it.
      The investment thesis depends on Gamma demonstrating a durable workflow moat, not just
      superior AI output quality that incumbents can match within months.
    claimRefs:
      - CR015
      - CR017
      - CR028
      - CR029

  - calloutType: recommendation
    title: Diligence Must Confirm AI Model Fallback Architecture
    body: >-
      Gamma claims to use 20+ AI models, suggesting multi-provider routing. However, no public
      documentation confirms a model fallback architecture or details how Gamma manages upstream
      API price changes. Given that OpenAI's o3 model price dropped 80% in two months — compressing
      the value-add margin for wrapper applications — investors should obtain confirmation of
      Gamma's model routing logic, cost allocation, and the contractual terms governing AI provider
      relationships before underwriting margin assumptions.
    claimRefs:
      - CR018
      - CR019
      - CR020

  - calloutType: insight
    title: Profitability Provides Risk Buffer but Does Not Eliminate Structural Risks
    body: >-
      Gamma's operational profitability since 2023 and the $68M Series B provide meaningful runway
      insulation that most AI-layer startups lack. This materially reduces near-term financial risk
      and gives management time to address structural risks — platform abuse mitigation, enterprise
      sales buildout, and EU AI Act compliance — without fundraising pressure. However,
      profitability at current scale does not protect against competitive displacement or regulatory
      enforcement, both of which can move faster than internal response programs. Risk ratings
      remain elevated despite the profitability signal.
    claimRefs:
      - CR021
      - CR025
      - CR028

