  topStrengths:
    - 用 $23M 新股资本做到 $100M ARR——每 1 美元新股融资大约撬动 4.3× ARR，Gamma 跻身有记录以来资本效率最高的 SaaS 增长案例。
    - 2023 年起盈利，并在 $100M ARR 里程碑时仍保持盈利：经营现金流为正压住了悲观情景，也说明 Series B 是主动选择，不是生存融资。
    - 有机 PLG 飞轮：靠病毒式 'Made with Gamma' 水印、零付费营销获得 70M 用户；每天生成 1M+ 内容，形成持久获客护城河。
    - 21× ARR 倍数正好落在 AI-native SaaS VC 中位数上（saasrise.com，575+ 家公司，Q1 2026），Series B 价格更像市场价，而不是异常高点。
    - 产品迭代很快：Series B 后六个月内，Gamma Agent、Gamma Imagine、public API 和 v3.0 全部发布，体现出强工程执行力，也在扩张 TAM。
  topRisks:
    - 未披露按队列划分的净美元留存：这是最大的承销缺口，因为所有高溢价 SaaS 倍数都依赖耐久性证据，而 Gamma 还没有公开。
    - Microsoft Copilot for PowerPoint 和 Google Gemini for Slides 正把 AI 生成能力原生嵌入企业买家已经采购的生产力套件。
    - 钓鱼攻击者正在利用 gamma.app 托管窃取 Microsoft 凭据的跳转页面，带来品牌和企业信任敞口，可能拖慢采购。
    - 依赖 AI 模型供应商：依靠 OpenAI 和 Anthropic API，使毛利率和产品可靠性暴露于第三方定价变化和模型政策调整。
    - Freemium SMB 用户基础总转化率约 ~0.9%，流失率未知；如果 Series B 后企业增购不提速，收入结构会显得脆弱。
  unresolvedGaps:
    - 按队列划分的净美元留存——这是按 21× ARR 承销耐久性的核心指标，目前未公开披露。
    - 毛利率、CAC 回本周期和运营费用结构——均无公开数据，无法完整承销单位经济性。
    - 企业 vs. SMB ARR 拆分和平均合同价值——没有分层数据，就无法评估收入质量和增购轨迹。
    - EU AI Act 合规路线图和数据驻留姿态——这些会实质影响欧洲企业采购决策。
    - Series B 后员工增长计划及预期利润率影响——关键风险是从 52 人扩张到数百人，会压缩支撑乐观情景的盈利能力。
