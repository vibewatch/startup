summary:
  headline: Gamma 是 AI SaaS 里通往 $100M ARR 最省资本的一条路径；如果私有尽调能确认净美元留存、毛利率和企业收入耐久性，就值得在 Series B 价格基础上打 15–20% 折价后有条件买入。
