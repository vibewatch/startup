      verification, ARR definitions (bookings vs. recognized revenue vs. run rate) and geographic distribution cannot be
      validated.
    diligencePath: >-
      Request audited financial statements or a data room from Gamma investor relations; obtain Sacra's full
      subscriber-level methodology; review any regulatory filings if the company has disclosed financials publicly.
    relatedTableRefs:
