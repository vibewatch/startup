callouts:
  - calloutType: insight
    title: The competitor set is workflow-defined, not category-defined
    body: >-
      Gamma competes simultaneously against AI-native peers, suite incumbents, design bundles and internal build
      workflows because buyers care about producing credible visual communication, not about tool taxonomy.
    claimRefs:
      - CP001
      - CP010
      - CP011
      - CP014
      - CP035
  - calloutType: risk
    title: Incumbent bundling is the hardest displacement problem
    body: >-
      Microsoft, Google and Canva can turn presentation AI into a bundled feature, forcing Gamma to prove standalone
      value through speed, polish, web-native sharing and enterprise conversion.
    claimRefs:
      - CP020
      - CP021
      - CP029
      - CP037
  - calloutType: recommendation
    title: Underwrite Gamma on retention and interoperability
    body: >-
      The diligence priority is not whether Gamma can generate a deck; it is whether teams keep using Gamma after
      export, brand, security and suite-standardization constraints appear.
    claimRefs:
      - CP022
      - CP036
      - CP040
