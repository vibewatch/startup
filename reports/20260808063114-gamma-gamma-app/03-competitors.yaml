  - id: switching-costs-and-distribution-power
    title: Switching Costs, Distribution Power, and Lock-in
    body: >-
      The strongest competitive moat in the category belongs to incumbents, not to any AI-native startup. Microsoft and
      Google already own the document repositories, admin consoles, identity layers and training muscle memory that
      determine how many enterprises create and approve presentations. Canva adds a different distribution vector: an
      all-purpose visual content suite that can absorb light presentation jobs without requiring another subscription.
      Gamma's web-native format reduces friction for link sharing, but it also creates a governance question for buyers
      that standardize on PPTX, Slides, templates or internal approval workflows. Export support helps, yet it does not
      fully erase the buyer's fear that a Gamma deck will need repair before board, client or regulated use. Switching
      costs are therefore asymmetric: Gamma is easy to try, while incumbents are hard to displace. That asymmetry makes
      bottoms-up viral distribution valuable but not sufficient for enterprise durability.
    claimRefs:
      - CP010
      - CP011
      - CP020
      - CP021
      - CP022
      - CP028
      - CP029
      - CP036
      - CP040
    tableRefs:
      - TP004
  - id: moat-durability-and-risks
    title: Moat Durability and Competitive Risks
    body: >-
      Gamma's competitive durability is medium. The product has a clear wedge—speed, attractive defaults and shareable
      web outputs—but direct AI peers can imitate prompt-to-deck workflows, and the largest incumbents can subsidize AI
      presentation features through broader productivity suites. The most important moat candidates are distribution,
      user habit, a polished editing model, trust documentation, collaborative workflows and differentiated web
      publishing, not the generation act itself. Adverse evidence reinforces the point. Competitor-authored and
      independent review surfaces praise Gamma's speed while flagging team brand-control gaps, export-quality concerns
      and alternatives for business-critical workflows. Tome's migration narrative shows that a once-prominent
      AI-presentation product can stop serving the job if strategy or monetization breaks. Gamma should therefore be
      underwritten as a strong fast-growing product with real category pull, but not as a winner-take-all platform
      unless it demonstrates enterprise retention, brand governance and workflow interoperability at scale.
    claimRefs:
      - CP015
      - CP023
      - CP024
      - CP025
      - CP026
      - CP027
      - CP031
      - CP032
      - CP033
      - CP037
