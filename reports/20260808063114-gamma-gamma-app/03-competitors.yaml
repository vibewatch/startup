company:
  name: Gamma
chapter:
  number: 3
  title: Competitors
  summary: >-
    Gamma competes across direct AI-native presentation tools, incumbent suites, design bundles, workflow add-ons and
    status-quo internal build. Its strongest wedge is fast web-native generation, but durable differentiation depends on
    enterprise trust, export fidelity, brand governance and distribution against Microsoft, Google, Canva and direct AI
    peers.
sections:
  - id: landscape-and-buyer-jobs
    title: Landscape and Buyer Jobs
    body: >-
      Gamma's competitor set is wider than the phrase "AI presentation maker" implies. The direct peer group includes
      Beautiful.ai, Presentations.AI, Plus AI, SlidesAI and other prompt-to-deck products; the incumbent group is
      Microsoft PowerPoint and Google Slides; the adjacent design group is Canva, Figma Slides and Adobe Express; the
      substitute group includes Prezi's spatial format, Pitch's collaborative workspace, and internal template/build
      workflows. Gamma's strongest wedge is rapid first-draft creation and web-native sharing, but most buyers still
      evaluate the output against familiar file, suite and brand-governance constraints. That means the category's
      competitive boundaries are defined by the job—turn an idea into a persuasive visual artifact—rather than by tool
      taxonomy. The relevant diligence lens is therefore buyer workflow fit: individual creators reward speed, teams
      reward brand discipline, enterprises reward governance, and embedded-suite users reward continuity with tools
      already procured by IT. This framing also separates current alternatives from historical examples and prevents
      over-weighting products that no longer serve the presentation job. Tome's exit from active presentation
      competition is a useful caution that category excitement does not guarantee durable monetization.
    claimRefs:
      - CP001
      - CP005
      - CP007
      - CP010
      - CP011
      - CP012
      - CP013
      - CP014
      - CP016
      - CP017
      - CP028
      - CP039
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capabilities-and-packaging
    title: Capability, Pricing, and Packaging Comparison
    body: >-
      Gamma has a credible feature set for fast creation: limited free prompt generation, imports from PDF/PPTX, exports
      to PDF/PPTX/PNG/Google Slides, paid branding removal, premium models, API access and team packaging. Its weakness
      is not the absence of features but the competitive context around those features. Beautiful.ai competes on
      brand-consistent teams and security posture; Canva competes through a broad creative bundle and Magic Design;
      Microsoft and Google compete by embedding AI into suites customers already buy; Plus AI and SlidesAI compete by
      letting users remain in Slides or PowerPoint workflows. Pricing comparison therefore cuts two ways. Gamma's free
      tier and creator-priced upgrades help acquisition, but suite competitors can make presentation AI feel incremental
      or bundled, and workflow add-ons can undercut migration friction. The practical implication is that Gamma must win
      on generation speed, output quality, web-native polish and user delight before procurement compares it against a
      bundled incumbent line item.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
      - CP008
      - CP009
      - CP012
      - CP018
      - CP019
      - CP020
