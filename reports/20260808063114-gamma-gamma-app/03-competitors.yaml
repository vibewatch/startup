  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor revenue scale
      missingEvidence: >-
        Comparable current ARR, paying seat counts and enterprise penetration for Beautiful.ai, Canva presentations,
        Plus AI, SlidesAI and Presentations.AI.
      whyItMatters: Without private competitor scale data, competitive share and displacement claims remain qualitative.
      diligencePath: >-
        Request customer-loss logs, win/loss analysis and paid third-party market datasets covering presentation AI
        revenue by vendor.
      relatedQuestionRefs:
        - QP005
        - QP013
      relatedTableRefs:
        - TP001
    - type: missing-source
      severity: material
      topic: export fidelity
      missingEvidence: >-
        Side-by-side export quality tests from Gamma to PPTX/Google Slides compared with Plus AI, SlidesAI, PowerPoint
        and Beautiful.ai.
      whyItMatters: >-
        Export fidelity is a core switching-cost risk but official pages only prove that export exists, not that it
        preserves customer-critical formatting.
      diligencePath: >-
        Run a scripted benchmark using identical prompts, brand templates and customer sample decks; score repair time
        and formatting defects.
      relatedQuestionRefs:
        - QP022
      relatedTableRefs:
        - TP004
        - TP005
    - type: missing-source
      severity: minor
      topic: enterprise security parity
      missingEvidence: >-
        Detailed security questionnaire responses and SSO/admin feature parity across Gamma, Beautiful.ai, Microsoft,
        Google and Canva.
      whyItMatters: >-
        Public trust pages are enough to prove posture but not enough to conclude procurement parity for regulated
        enterprises.
      diligencePath: Collect vendor SOC reports under NDA and compare admin, retention, data-processing and model-training controls.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP002
        - TP005
    - type: conflicting-data
      severity: minor
      topic: Tome status
      missingEvidence: Primary Tome or acquirer communication confirming the exact shutdown and current product scope.
      whyItMatters: >-
        Tome is treated as historical rather than active, but direct primary confirmation would sharpen migration
        analysis.
      diligencePath: >-
        Fetch archived Tome product notices, AngelList/Tome corporate announcements, or customer migration emails if
        available.
      relatedQuestionRefs:
        - QP016
      relatedTableRefs:
        - TP001

