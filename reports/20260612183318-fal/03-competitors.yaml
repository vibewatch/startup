callouts:
- calloutType: strength
  title: Fal’s clearest public wedge is media-specific production proof
  body: The Pika partnership is not just a logo. It demonstrates that a demanding video application is willing to route a core model through fal’s infrastructure, which is a better signal than generic “fast inference” copy alone.
  claimRefs:
  - CP013
  - CP014
  - CP037
- calloutType: risk
  title: Distribution is the hardest competitive gap to close
  body: Hyperscalers can use existing cloud commitments, while Cloudflare gives Replicate a powerful new channel. If fal cannot keep translating media-specialization into sticky partner wins, pricing pressure could rise quickly.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP031
  - CP045
- calloutType: insight
  title: The market is more multi-homing-prone than hard-locking
  body: OpenAI-compatible endpoints, overlapping model catalogs, and transparent self-serve pricing make it easier for sophisticated customers to route traffic across vendors. Fal therefore needs to win on workflow performance and trust, not just model access.
  claimRefs:
  - CP028
  - CP029
  - CP039
  - CP040
