    - High
    - Request realized price cards, discounting trends, and churn reasons
  - - Distribution via partners
    - Cloudflare-Replicate and hyperscaler channels can out-distribute fal
    - High
    - Track whether fal’s partner wins cluster in niches where hyperscalers remain weak
  notes: The risk register focuses on structural threats rather than short-term feature gaps. Most risks are addressable, but none are trivial because the field is crowded and fast-moving.
