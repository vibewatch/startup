- id: peer-profiles-and-pricing
  title: Peer Profiles and Pricing Models
  body: 'The direct peers all sell “inference,” but they package it differently. Modal is a code-first AI cloud that monetizes through team tiers plus compute, making it attractive to Python-native builders who want cloud primitives and minimal operational ceremony. Baseten looks more enterprise-inference-centric, combining model APIs, deployments, training, compliance signals, and uptime promises in a package meant for production teams. Fireworks emphasizes speed, cost, and open-source model lifecycle management, while Replicate leans into ease of use, catalog breadth, and simple API access. Together spans the widest stack, combining inference, model shaping, pre-training, and infrastructure economics. Those packaging choices matter because they create different hidden costs: Replicate charges for private-model idle time, Baseten adds enterprise controls and priority access, Modal gates GPU concurrency by plan, and Fireworks exposes both serverless token pricing and training-token pricing.
    Fal therefore competes inside a market where headline pricing rarely tells the full story of buyer economics.'
  claimRefs:
  - CP002
  - CP003
  - CP005
  - CP008
