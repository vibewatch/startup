- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor
  - Public entry point
  - Unit / contract model
  - Included capabilities
  - Unknowns / hidden costs
  - Implication
  rows:
  - - Modal
    - $0 starter; $250 team; enterprise custom
    - Seat tier plus compute
    - Cloud primitives, GPU concurrency, logs, scaling
    - Actual compute bill and enterprise discounting
    - Friendly for builders, but full economics depend on runtime profile
  - - Baseten
    - $0 Basic; Pro and Enterprise quoted
    - Platform tier plus GPU or token pricing
    - Deployments, Model APIs, training, compliance, support
    - Reserved-capacity economics and discounting
    - Enterprise fit can justify higher spend if uptime and controls matter
  - - Fireworks
    - Self-serve plus enterprise
    - Serverless token pricing plus training-token pricing
    - Inference, deployments, fine-tuning
    - Model-specific rates and enterprise concessions
    - Strong economics story but requires careful workload matching
  - - Replicate
    - Usage pricing plus dedicated private-model time
    - Private models pay for setup, idle, and active time
    - Model catalog, custom deployment, training
    - Idle-time burden for private workloads
    - Can be cheap for experimentation, less obvious for always-on serving
  - - Azure OpenAI
    - PAYG or provisioned throughput
    - Consumption or reserved throughput
    - Direct model access with enterprise controls
    - Provisioned-unit sizing, discounts, cloud lock-in
    - Very strong for buyers already inside Azure procurement
  - - Hyperscaler / suite substitutes
    - Often bundled or custom
    - Cloud contract or app subscription
    - Model access embedded in larger stack
    - True incremental AI cost may be hard to isolate
    - Bundling can blunt price-based differentiation from independent vendors
  notes: Headline prices are only part of the decision. Procurement path, idle-capacity exposure, and support levels often matter more than nominal entry price.
