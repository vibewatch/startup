chapter:
  number: 3
  title: Competitors
  summary: Fal competes in a crowded field that spans code-first AI clouds, inference platforms, model marketplaces, hyperscalers, and application-layer substitutes. Public evidence suggests its clearest wedge is media-specific infrastructure proof—especially around video—yet the broader field is pushing hard on overlapping model access, enterprise procurement, and increasingly transparent pricing, which keeps switching costs moderate and commoditization risk real.
sections:
- id: landscape-categories
  title: 'Landscape: Direct Peers, Incumbents, and Substitutes'
  body: 'Fal’s competitor set is broader than a simple “model-hosting” peer list. The most direct infrastructure peers are Modal, Baseten, Fireworks, Replicate, and Together, all of which promise fast deployment, autoscaling, or simplified access to large AI-model catalogs. But real competitive pressure also comes from two adjacent groups. First are hyperscalers such as AWS, Microsoft, and Google, which can bundle generative-AI access into existing cloud relationships and enterprise commitments. Second are application or suite substitutes like Adobe Firefly, Runway, Midjourney, and increasingly Stability AI’s branded production offering, which can bypass fal entirely for customers who want outputs rather than developer-controlled APIs. This category structure matters because different rivals threaten different parts of fal’s value chain: hyperscalers attack distribution and procurement, infrastructure peers attack latency and tooling, and applications attack the need for a neutral API layer
    at all. They also shape buyer expectations about where value should accrue.'
