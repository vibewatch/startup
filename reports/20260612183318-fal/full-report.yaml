  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Category position
        - >-
          Fal is emerging as the pure-play leader in generative-media inference, with strong customer proof and repeated
          investor validation.
        - >-
          The moat is still mostly convenience, speed, and curation rather than exclusive models or locked-in
          distribution.
        - >-
          Evidence that customer retention, workflow lock-in, and model-supply access are improving faster than
          competitors can copy them.
      - - Scale proof
        - >-
          Reported revenue and developer growth suggest Fal has already crossed the threshold where premium
          infrastructure multiples are plausible.
        - >-
          Most of the revenue evidence is still third-party-reported or estimated rather than fully disclosed by the
          company.
        - Audited or board-level revenue, margin, and cohort disclosure that confirms the proxy band.
      - - Round trajectory
        - >-
          Fast markups can be rational if the category is repricing around video-heavy AI demand and Fal is the
          best-positioned media abstraction.
        - >-
          The step-ups may have compressed diligence and pre-paid several years of execution before governance detail
          caught up.
        - >-
          Clear round terms, modest preference overhang, and evidence that the latest mark was supported by durable
          enterprise contracts.
      - - Operational resilience
        - AWS alignment and large-customer usage suggest enterprise relevance is becoming real.
        - >-
          Queue, billing, and cost-visibility complaints show that operational friction could still compress a premium
          multiple.
        - A longer record of reliability metrics, postmortems, and enterprise SLA evidence through the 2026 migration.
    notes: >-
      Rows pair the strongest underwriting argument with the sharpest public counterargument so the recommendation
      remains evidence-sensitive.
