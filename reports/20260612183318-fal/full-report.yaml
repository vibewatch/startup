      - number: '5.2'
        title: Architecture, Deployment, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The most important architectural point is that fal is not publicly split into unrelated products. The
              Serverless documentation says every marketplace model is itself a fal.App running on the same substrate
              that customers can use for their own deployments, which means the company’s hosted catalog and
              custom-deployment businesses share a common control plane. That control plane is described in unusually
              operational terms for a private company: existing HTTP servers can be migrated through exposed_port
              direct-server mode, custom containers can be brought in from Dockerfiles or registries, and newly built
              apps can be defined natively in Python and deployed with fal’s CLI. Observability is also surfaced as a
              product feature rather than a buried support artifact. Public docs mention request-volume analytics,
              latency percentiles, runner utilization, startup duration, error analytics with stack traces,
              Prometheus-compatible export, and log drains. Underneath, fal exposes a broad hardware pool that spans CPU
              instances and multiple GPU classes including RTX 4090, RTX 5090, A100, L40, H100, H200, and B200, plus
              multiple-machine-type fallback and multi-GPU configurations. That breadth matters because it shows fal is
              optimizing for heterogeneous media and model workloads instead of a single inference profile. The risk is
              that the whole product still depends on capacity orchestration, cloud economics, and outside
              model/provider access that are not publicly quantified.
