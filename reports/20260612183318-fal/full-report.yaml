  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Prioritization
        blocks:
          - type: paragraph
            body: >-
              Fal’s risk stack is concentrated around one thesis: the same infrastructure abstraction that makes the
              product attractive also creates clustered operational, commercial, and legal exposures. The platform sits
              between developers, frontier-model owners, GPU supply, and large clouds, so any weakness in trust,
              reliability, or dependency management can move quickly into customer hesitation and valuation pressure.
              Public evidence points to six primary categories. First, trust and reliability risk is high because the
              current-state status page is positive but independent and customer-side signals still show outages, queue
              stalls, and account friction. Second, cloud and supply dependency risk is high because AWS is now the
              preferred cloud provider while the technical stack still leans on scarce high-end NVIDIA GPUs. Third,
              competitive compression risk is high because Replicate, Modal, and Fireworks all market overlapping
              developer-infrastructure value, and Replicate now has Cloudflare distribution behind it. Fourth, legal and
              policy risk is material because fal’s terms explicitly shift output and indemnity risk to customers while
              the EU AI Act is tightening transparency and prohibited-content duties. Fifth, governance and disclosure
              risk is material because public product detail outpaces public management, assurance, and postmortem
              detail. Sixth, model risk remains material because fal’s valuation step-ups imply very little tolerance
              for execution misses.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR014
              - CR019
              - CR023
              - CR027
              - CR032
              - CR038
              - CR039
              - CR049
