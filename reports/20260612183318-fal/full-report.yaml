  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth versus price disconnect
        - A new round clears near $8B without new disclosure on revenue durability, margin, or concentration
        - The market would be asking investors to pay a higher multiple on a still-opaque earnings base
        - Do not chase the round; wait for terms or evidence to improve
      - - Reliability regression
        - Queue or billing friction becomes recurring during the AWS migration or at higher enterprise load
        - Operational volatility would undermine the premium-multiple narrative
        - Lower valuation tolerance and require hard SLA evidence
      - - Customer quality disappointment
        - Retention or concentration turns out materially weaker than public logo lists imply
        - The strongest support for the current mark would weaken quickly
        - Re-underwrite to a lower multiple band
      - - Capital-structure overhang
        - Preferences, secondaries, or option refresh needs are materially worse than the headline valuation suggests
        - Common-equity upside can disappear even if the business keeps growing
        - Pass unless pricing resets or terms are cleaned up
    notes: >-
      These are practical investment stop-signs rather than abstract risks, designed to force price discipline during
      private-round excitement.
