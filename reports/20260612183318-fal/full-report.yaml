      - number: '1.4'
        title: Partnerships, Trust Posture, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest 2026 partnership signal is fal’s preferred-cloud relationship with AWS. Company and press
              sources position that agreement as a scale enabler for enterprise media workloads and as a proof point
              that fal is becoming infrastructure for larger creative and commerce deployments rather than a developer
              toy. At the same time, trust and reliability remain central diligence axes. Fal’s homepage, trust center,
              and trust-focused blog emphasize SOC 2, SSO, private endpoints, usage analytics, content authenticity,
              privacy, and intellectual-property concerns, which shows active procurement readiness. Yet independent
              outage trackers also matter: IsDown has logged repeated incidents since 2025, and Downdetector keeps a
              live user-report surface for fal.ai. Those sources do not imply existential risk, but they do show that
              production inference at fal’s scale still carries real operational sensitivity and that public disclosure
              quality remains much weaker than public growth signaling. That combination is consistent with a
              fast-scaling infrastructure company whose commercial readiness has improved faster than its public
              disclosure depth.
