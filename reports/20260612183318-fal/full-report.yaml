  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Fal is not selling a single creative app; it is selling access, inference, and deployment for
              generative-media workflows. The retained source set repeatedly places the company in the layer between
              frontier model labs and end-user applications: fal’s own launch posts emphasize API access to models such
              as Veo 3, Sora 2, and GPT Image 1, while cloud competitors like Bedrock, Together, Replicate, Fireworks,
              Baseten, Azure OpenAI, and Google Cloud all compete for the same developer and product-owner budget. That
              means the relevant spend pool includes model API calls, hosted inference, workflow orchestration, and
              dedicated compute for image, video, audio, and multimodal creation. It excludes most generic cloud spend,
              frontier-model R&D, and pure consumer-subscription revenue at the app layer. The substitute set is also
              broad. Developers can build directly on OpenAI or Azure, creators can default to Firefly, Runway, or
              Midjourney, and platform teams can multi-home across several API vendors.
