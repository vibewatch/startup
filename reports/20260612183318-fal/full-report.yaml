  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Entry View and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The public record supports a strong company-quality view and only a conditional entry view. Fal has clear
              product-market pull in a real category, credible customer logos, accelerating round support, and enough
              third-party reporting to believe the company is scaling unusually fast. But public evidence on the price
              is still much thinner than public evidence on the product. The cleanest closed mark is the $4.5B Series D
              announced in December 2025. That can be argued as defensible if the revenue band really moved from roughly
              $95M in mid-2025 to more than $200M by October and toward $400M annualized by early 2026. Even then, the
              gap between what is reported and what is disclosed matters. There is still no retained public evidence on
              gross margin, net retention, customer concentration, or round economics such as preferences and secondary
              mix. That keeps the right recommendation in a price-sensitive middle: track or research-more, not buy,
              unless new diligence closes the economics gap or the entry price improves.
            claimRefs:
