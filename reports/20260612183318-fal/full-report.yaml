      - number: '1.2'
        title: Founders, Leadership, and Governance Surface
        blocks:
          - type: paragraph
            body: >-
              The public company profile is still heavily founder-linked, but governance is no longer a founder-only
              story. Third-party profiles identify Burkay Gur and Gorkem Yurtseven as the 2021 cofounders and tie the
              origin story to infrastructure pain they encountered while working at Coinbase and Amazon. Forbes lists
              Burkay Gur as CEO, while the broader public narrative keeps both founders associated with the technical
              architecture and product direction. Governance visibility improves during fundraising: the Series B
              announcement named Jennifer Li and Glenn Solomon as board additions, and the Series C post added Arsham
              Memarzadeh. Those facts are enough to show that investor influence is formalized, but they are not enough
              to reconstruct current seat allocation, ownership, or veto rights. That omission matters because fal’s
              financing pace suggests fast-changing control dynamics even as its public storytelling remains
              founder-centric. It also means governance diligence will need private-company materials, not just
              marketing pages and financing blogs, before anyone can underwrite true control risk.
