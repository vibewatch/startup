  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer map: fal sells to developers directly, but many users meet it through partner products'
        blocks:
          - type: paragraph
            body: >-
              fal’s public customer evidence does not look like a classic SaaS logo wall with contract values and
              renewal data. Instead, the retained set points to several overlapping buyer patterns. One surface is
              self-serve developers who discover a model, take an API key, and start shipping against a unified endpoint
              and queueing layer. A second is AI-native media applications and model labs that treat fal as production
              infrastructure under their own brand, with Pika the clearest current example. A third is creative-software
              and workflow partners such as IMG.LY and the Adobe ecosystem, where fal is part of a broader creation
              stack rather than the visible destination product. A fourth is larger enterprise or brand accounts named
              in secondary sources — Canva, Perplexity, Shopify, Adobe, Amazon MGM Studios, and others — but with uneven
              customer-side corroboration. The commercial implication is important: fal appears to win not only when an
              enterprise consciously buys fal, but also when another platform embeds fal as the media runtime beneath
              its own workflow. That broadens reach, yet it also makes customer quality harder to judge from public
              sources because branded end-user demand and fal-specific revenue can diverge.
