  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Fal’s revenue model is best described as usage-based infrastructure with layered monetization. The public
              docs and model-API overview show one layer: customers call hosted image, video, audio, speech, and
              multimodal models through a unified API and pay based on usage. A second layer comes from serverless
              deployment, where customers run custom models on fal’s managed stack. A third layer comes from dedicated
              compute, which the docs position as fixed-rate, continuously running GPU infrastructure for training,
              fine-tuning, and long-running jobs. This three-part structure matters because it means fal is not only
              monetizing end inference volume; it is also trying to capture larger infrastructure spend from customers
              who move from experimentation into production. Public pages also signal enterprise monetization beyond
              list pricing through contact-sales flows, applied ML support, and procurement-friendly trust features.
              That suggests a hybrid between self-serve usage revenue and larger negotiated contracts, even though
              realized pricing is not disclosed publicly.
