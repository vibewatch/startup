      - number: '3.3'
        title: Distribution Power, Switching Costs, and Partner Access
        blocks:
          - type: paragraph
            body: >-
              Distribution is where the field separates most clearly. AWS Bedrock, Azure OpenAI, and Google Cloud can
              all ride existing procurement relationships and committed cloud spend, giving them obvious advantages with
              larger enterprises. Replicate’s joining Cloudflare is notable for the same reason: it pairs a model-access
              platform with a large-scale edge and developer-distribution network. By contrast, most independent
              infrastructure vendors need to win on product and economics first. Switching costs are also meaningful but
              not absolute. Several vendors offer low-friction APIs or OpenAI-compatible endpoints, which makes
              multi-homing practical when customers are comparing latency, output quality, or price. Durable switching
              friction tends to come from deployment pipelines, observability, dedicated capacity, compliance work, and
              customer-specific billing or gateway logic. In that context, fal’s Pika partnership matters less as a logo
              and more as evidence that media-specific integrations can be sticky when the infrastructure is tuned for
              the workflow and renewed under production pressure.
