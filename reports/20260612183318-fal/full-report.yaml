  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Revenue proxy is real and grows toward $700M+ annualized, AWS migration improves reliability, and enterprise
          contracts sustain a premium multiple.
        - A $7.0B-$9.0B valuation range can work if investors keep paying high-teens multiples for category leadership.
        - Moat erosion, supplier concentration, and round-term overhang still matter.
        - Possible but requires multiple new proofs, not just continued hype.
      - - Base
        - >-
          Fal grows into the $500M-$650M annualized band, keeps customer proof strong, and closes disclosure gaps only
          partially.
        - >-
          A $4.5B-$6.5B range is defendable, making the closed Series D understandable but leaving limited margin of
          safety above it.
        - Economics remain partly opaque and reliability incidents keep upside capped.
        - Most consistent with the retained evidence set.
      - - Bear
        - >-
          Growth slows, reliability or billing friction recurs, and new money demands better terms or a lower effective
          multiple.
        - >-
          A $2.5B-$4.0B range becomes more appropriate if investors compress the business toward lower-double-digit or
          single-digit sales multiples.
        - Video-heavy costs, competitive pricing pressure, and weak disclosure amplify downside.
        - Still plausible because the public record is thin on margin and retention.
    notes: >-
      Ranges are judgmental underwriting bands anchored on reported revenue proxies and comparable signals, not
      management-verified forecasts.
