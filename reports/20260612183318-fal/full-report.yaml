      - number: '3.4'
        title: Moat Durability, Commoditization Risk, and Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              The competitive picture argues for a real but moderate moat rather than a hard lock. Fal looks more
              specialized in media-first infrastructure than Modal or Together and has clearer public video-application
              proof than many direct peers. But that specialization sits inside a market where model access is
              increasingly widespread, applications can absorb user demand upstream, and hyperscalers can compress
              distribution advantages quickly. The most durable levers are likely speed, reliability, observability,
              security posture, and partner relationships with media-native customers—not exclusive model ownership. The
              adverse case is straightforward: if direct model APIs improve quickly, suites keep bundling generation,
              and procurement consolidates around hyperscalers or cloud-edge combinations, independent infrastructure
              platforms may face both pricing compression and narrower share capture. Public evidence does not yet prove
              that outcome, but it makes it impossible to treat any current partner win as permanent. That is why churn,
              renewal, and real enterprise-price realization data would matter more here than another public marketing
              launch.
