  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-control
    missingEvidence: A current board roster, board-observer list, ownership stakes, and voting/control rights for the founders and lead investors.
    whyItMatters: Control and follow-on financing dynamics cannot be underwritten from round announcements alone.
    diligencePath: Request the latest cap table, board consents, and investor-rights summary from management.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: developer-monetization
    missingEvidence: A breakdown of active developers, paying developers, enterprise accounts, and cohort retention.
    whyItMatters: Developer count alone does not reveal monetization efficiency or product stickiness.
    diligencePath: Request paid-account counts, enterprise logo list, and developer-to-paying conversion funnels.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: series-d-structure
    missingEvidence: Primary-versus-secondary allocation and participant-by-participant check sizes for the Series D event.
    whyItMatters: Gross financing headlines overstate fresh operating cash when secondaries are mixed in.
    diligencePath: Obtain the Series D term sheet, closing memo, and capitalization table bridge.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, ARR, gross margin, and customer-concentration disclosures.
    whyItMatters: Current public revenue figures are analyst estimates and do not establish quality of earnings.
    diligencePath: Request monthly recurring revenue, GAAP/non-GAAP revenue detail, gross margin, and top-customer concentration schedules.
    relatedQuestionRefs:
    - QO022
