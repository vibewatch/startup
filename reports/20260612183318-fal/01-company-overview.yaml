company:
  name: Fal
chapter:
  number: 1
  title: Company Overview
  summary: Fal is a San Francisco-based generative-media infrastructure company founded in 2021 that sells usage-based AI inference, serverless deployment, and dedicated compute to developers building image, video, audio, and 3D applications. Public evidence supports a rapid financing arc from $23M seed-plus-Series A in 2024 to $49M Series B, $125M Series C, and $140M Series D in 2025, but it also leaves material diligence gaps around board control, audited financial disclosure, and the exact mix of primary versus secondary capital.
sections:
- id: identity-platform-model
  title: Identity, Platform Scope, and Business Model
  body: 'Fal presents itself as a generative media platform for developers rather than a general-purpose model lab. The official site, docs, and model-API overview consistently describe a common stack that lets customers call hosted image, video, audio, speech, music, 3D, and multimodal models through a unified API, deploy custom models on a serverless runtime, or rent dedicated compute when steady-state GPU access matters more than autoscaling. That product framing matters because it puts the company in the infrastructure layer of the AI stack: revenue is tied to model usage, queue throughput, and compute consumption rather than to a single consumer application. The mission language is similarly explicit. Fal says it wants to amplify human creativity by making generative AI fast, responsive, and affordable enough for real products, which helps explain why speed, queue reliability, and pricing transparency appear in nearly every retained company source.'
  claimRefs:
  - CO001
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
