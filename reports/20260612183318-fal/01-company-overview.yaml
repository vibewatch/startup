callouts:
- calloutType: strength
  title: Fal already looks like infrastructure, not an experimental wrapper
  body: The retained source set consistently shows a three-layer platform—model APIs, serverless deployment, and dedicated compute—with explicit billing, trust, and scaling surfaces. That is a stronger company-overview signal than a single viral model or app would be.
  claimRefs:
  - CO006
  - CO009
  - CO010
  - CO019
  - CO022
  - CO024
- calloutType: risk
  title: Public scale metrics are impressive but still weakly normalized
  body: Developer counts, revenue estimates, and even total capital raised are directionally strong yet not fully standardized across sources. For underwriting, the missing bridge between raw usage, enterprise accounts, and audited revenue quality is a real diligence blocker.
  claimRefs:
  - CO027
  - CO028
  - CO043
  - CO044
  - CO045
  - CO050
- calloutType: insight
  title: The AWS announcement is both a scale signal and a customer-acquisition signal
  body: Preferred-cloud language matters beyond infrastructure cost. It suggests fal is crossing from developer enthusiasm into enterprise procurement and capacity planning, especially for media workloads where inference speed and reliability directly affect end-user experience.
  claimRefs:
  - CO014
  - CO036
  - CO037
