- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reliability trust gap
    - Recurring public outage / queue complaints after AWS rollout
    - Two or more material customer-facing incident clusters in a quarter or clear rise in IsDown / GitHub complaint volume
    - Re-cut reliability assumptions and downgrade enterprise-conversion confidence
  - - Cloud concentration
    - AWS partnership reduces resilience instead of improving it
    - Public reports of migration friction, pricing pressure, or degraded continuity attributable to AWS transition
    - Treat single-supplier dependence as thesis-threatening rather than manageable
  - - IP / moderation liability
    - Customer or regulator challenges fal output-risk posture
    - Public dispute, enforcement action, or disclosed contract change around indemnity / prohibited-content handling
    - Assume higher legal reserve needs and slower enterprise adoption
  - - Competitive compression
    - Rivals match fal convenience while bundling broader cloud or enterprise controls
    - Evidence that Replicate / Cloudflare, Modal, or Fireworks win media workloads on trust, cost, or distribution
    - Lower durability assumptions on take rate and long-term pricing power
  - - Valuation / execution mismatch
    - Growth narrative weakens before disclosure quality improves
    - Material slowdown in reported revenue/developer trajectory without new transparency on churn, margins, or concentration
    - Assume multiple compression and harder follow-on financing conditions
  notes: The goal is to convert narrative risk into observable tripwires so underwriting can respond before a qualitative concern becomes a valuation surprise.
