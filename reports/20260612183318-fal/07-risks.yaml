  evidenceGaps:
  - type: missing-source
    severity: material
    topic: assurance-gap
    missingEvidence: Public SOC 2 report scope, control ownership, and any architecture or incident-assurance material behind the Trust Center.
    whyItMatters: Without control scope and public audit detail, outside diligence cannot tell whether marketed enterprise posture matches actual implementation breadth.
    diligencePath: Request the latest SOC 2 report, bridge letter, control matrix, and any public-facing incident / security overview memo.
    relatedQuestionRefs:
    - QR002
    - QR022
    - QR027
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer concentration, workload mix, and gross margin by modality or cloud supplier.
    whyItMatters: Fal’s valuation and dependency risk cannot be priced well without knowing whether a small number of heavy video or enterprise accounts drive usage.
    diligencePath: Request top-customer concentration, cloud-spend mix, gross-margin bridge by workload, and revenue retention by cohort.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR032
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: governance-depth
    missingEvidence: Board composition, executive bench depth, and named ownership of reliability, security, legal, and procurement controls.
    whyItMatters: Public product detail is strong, but governance depth is still too opaque for a company already priced as a category leader.
    diligencePath: Request org chart, board list, committee structure, and role-level accountability for uptime, trust, and enterprise assurance.
    relatedQuestionRefs:
    - QR023
    - QR029
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: incident-postmortems
    missingEvidence: Historical postmortems, customer communications, and remediation metrics for meaningful outages or queue incidents.
    whyItMatters: Current status snapshots do not reveal whether fal handles degraded service with the maturity expected by enterprise customers.
    diligencePath: Request incident history, severity taxonomy, postmortem templates, and time-to-detect / time-to-resolve distributions.
    relatedQuestionRefs:
    - QR004
    - QR027
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
