- id: trust-reliability-and-legal-exposure
  title: Trust, Reliability, and Legal Exposure
  body: Fal’s public trust posture is directionally real but still lighter than what its enterprise ambition implies. The company now has a named Head of Trust & Safety and has publicly described integrating Thorn for CSAM handling and partnering with StopNCII for non-consensual intimate imagery. Those are meaningful control signals, as is the privacy policy’s processor framing for enterprise users. But the assurance surface remains uneven. The retained Trust Center fetch exposed almost no substantive detail, while the stronger public artifacts are scattered across a trust essay, privacy policy, terms page, status page, and press copy. Reliability evidence is similarly mixed. On the one hand, the official status page was fully green on the fetch date and company-issued materials cite 99.99% uptime. On the other hand, IsDown logged 16 incidents since March 2025, and GitHub issues from 2025–2026 describe requests stuck in queue, locked paid accounts, and missing cost visibility. The legal
    angle sharpens the risk. Fal’s March 2026 terms say customers indemnify the company, outputs are not warranted to be original or non-infringing, and third-party providers may affect reliability. That combination does not prove a present failure, but it does mean enterprise buyers carry more diligence burden than the product narrative alone would suggest.
