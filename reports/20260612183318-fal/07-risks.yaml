chapter:
  number: 7
  title: Risks
summary: Fal’s key downside is not lack of product momentum but the way several risks compound around the same operating core. Public evidence supports a fast-growing, media-focused infrastructure platform, yet the same evidence also shows thin public assurance disclosure, real reliability complaints, explicit customer-side IP risk transfer, rising dependence on AWS and NVIDIA-era GPU supply, and a competitive set that is getting stronger rather than weaker. The highest-residual risks are trust/reliability gaps that could slow enterprise procurement, cloud and model-supplier dependency that can hit margin or continuity, and execution risk from a valuation path that moved from roughly $1.5B to $4.5B within months.
sections:
- id: risk-overview-and-prioritization
  title: Risk Overview and Prioritization
  body: 'Fal’s risk stack is concentrated around one thesis: the same infrastructure abstraction that makes the product attractive also creates clustered operational, commercial, and legal exposures. The platform sits between developers, frontier-model owners, GPU supply, and large clouds, so any weakness in trust, reliability, or dependency management can move quickly into customer hesitation and valuation pressure. Public evidence points to six primary categories. First, trust and reliability risk is high because the current-state status page is positive but independent and customer-side signals still show outages, queue stalls, and account friction. Second, cloud and supply dependency risk is high because AWS is now the preferred cloud provider while the technical stack still leans on scarce high-end NVIDIA GPUs. Third, competitive compression risk is high because Replicate, Modal, and Fireworks all market overlapping developer-infrastructure value, and Replicate now has Cloudflare distribution
    behind it. Fourth, legal and policy risk is material because fal’s terms explicitly shift output and indemnity risk to customers while the EU AI Act is tightening transparency and prohibited-content duties. Fifth, governance and disclosure risk is material because public product detail outpaces public management, assurance, and postmortem detail. Sixth, model risk remains material because fal’s valuation step-ups imply very little tolerance for execution misses.'
