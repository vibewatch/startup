tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Hosted model APIs
    - Customers call pre-optimized image, video, audio, and multimodal endpoints
    - Per request / output / usage
    - Core, active, and heavily marketed
    - High strategic fit; realized ASP unknown
    - Request revenue mix by modality and top models
  - - Serverless deployment
    - Customers deploy their own models on fal-managed infrastructure
    - Per-second execution or usage-based service fees
    - Core product surface
    - Potentially high quality if deployment sticks; no public revenue split
    - Request deployment ARR and renewal rates
  - - Dedicated compute
    - Customers rent always-on GPU capacity for training or long-running jobs
    - Fixed hourly GPU rates
    - Clearly documented product line
    - Could improve predictability but may be margin-sensitive to capacity costs
    - Request compute utilization and gross margin by cluster type
  - - Enterprise support / procurement
    - Sales-led engagement, applied ML support, trust features, marketplace channels
    - Negotiated contract / committed spend
    - Implied but not disclosed in detail
    - Potentially highest-quality revenue; least transparent publicly
    - Request enterprise contract sizes, support attachment, and commit terms
  - - Channel-driven marketplace sales
    - Google Cloud billing / governance and cloud-partner alignment
    - Cloud-commit or marketplace-billed usage
    - New and strategically important
    - Could improve conversion and stickiness if customers buy through existing cloud budgets
    - Request marketplace GMV, take-rates, and cohort retention
  notes: Revenue streams are supportable from product and channel surfaces, but none of the retained public sources break out revenue mix or margin by stream.
  claimRefs:
