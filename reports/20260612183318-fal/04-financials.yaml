- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue model
    - Usage-based infrastructure with API, serverless, and compute layers
    - Medium
    - Usage models can scale quickly but can also be volatile by workload mix
    - Request monthly revenue by product line and customer cohort
  - - Gross margin
    - Not publicly disclosed
    - Low
    - Core input to valuation and pricing durability
    - Request gross-margin bridge by stream and modality
  - - Customer acquisition cost
    - Not publicly disclosed
    - Low
    - Needed to judge growth efficiency
    - Request CAC, payback, and paid-vs-organic mix
  - - Retention / NRR
    - Not publicly disclosed
    - Low
    - Usage spikes can mask weak retention
