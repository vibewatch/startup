  - CI003
  - CI004
  - CI007
  - CI018
  - CI030
  - CI031
  - CI037
  - CI038
  - CI045
- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Product / channel
  - Public pricing model
  - List vs realized pricing
  - Source-backed detail
  - Unknowns
  - Implication
  rows:
  - - Model APIs
    - Usage based / pay-per-use
    - List visible only at high level
    - Pricing page and analysts both describe variable pricing by model and output complexity
    - No realized discounts or enterprise minimums
    - Good self-serve story, but weak underwriting visibility
  - - Serverless
    - Per-second execution
    - List concept visible; realized price unknown
    - Docs contrast per-second serverless with dedicated compute
    - Cold-start tradeoffs, support burden, and commit structures are private
    - Highly scalable economics if utilization is efficient
  - - Compute
    - Fixed hourly GPU pricing
    - List concept visible; realized price unknown
    - Compute docs describe fixed hourly billing on dedicated instances
    - No data on reserved discounts or utilization
    - Better cost predictability for some customers, but can hide idle-cost risk
  - - Enterprise direct
    - Negotiated
    - Realized price unknown
    - Homepage and pricing page push contact sales and support
    - No public contract or commit disclosures
    - Could materially raise ARPU but adds pricing opacity
  - - Google Cloud marketplace
    - Marketplace-billed usage
    - Realized price and take-rate unknown
    - Official blog says teams can buy through Google Cloud billing and governance
    - Unknown marketplace fees and commit offsets
    - Potentially improves procurement velocity and revenue quality
  notes: Public pricing is enough to identify the units of monetization, but not enough to infer realized net revenue or gross margin.
  claimRefs:
