- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed primary capital
    - ~$337M across announced rounds
    - Medium
    - Sets the upper bound for capital raised before secondaries and fees
    - Request full cap-table bridge and closing statements
  - - Latest reported valuation
    - $4.5B
    - Medium
    - Critical anchor for current capital-market context
    - Request board-approved fair value and share-price bridge
  - - Cash on hand
    - Not publicly disclosed
    - Low
    - Without cash, burn and runway cannot be computed
    - Request latest cash balance and restricted cash details
  - - Monthly burn
    - Not publicly disclosed
    - Low
    - Needed to understand financing dependency
    - Request monthly cash burn and quarterly spend plan
  - - Runway months
    - Not publicly disclosed
    - Low
    - The single best public adequacy gap
    - Request runway math under base, downside, and growth cases
  - - Primary vs secondary mix
    - Series D included secondary element per TechCrunch
    - Medium
    - Determines how much fresh operating cash came from the raise
    - Request transaction breakdown by primary and secondary seller
  - - Debt / credit obligations
    - No public disclosure retained
    - Low
    - Hidden leverage or guarantees would change risk materially
    - Request debt schedule, cloud commitments, and any vendor financing
  notes: Public capital signals are strong enough to show financing access, but not enough to support runway underwriting.
