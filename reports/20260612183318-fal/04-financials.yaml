callouts:
- calloutType: strength
  title: The business model is coherent and multi-layered
  body: Fal is not dependent on one monetization path. Hosted APIs, serverless deployment, dedicated compute, and cloud-marketplace channels together create multiple ways to monetize the same developer and enterprise relationships.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI018
  - CI031
- calloutType: risk
  title: Revenue growth is more visible than revenue quality
  body: Public evidence supports rapid growth and strong funding access, but margin, burn, discounting, retention, and concentration remain undisclosed. That gap is large enough to keep a full underwriting call from public data alone.
  claimRefs:
  - CI025
  - CI026
  - CI033
  - CI034
  - CI046
- calloutType: insight
  title: Cloud-channel expansion may matter more than list pricing
  body: Preferred-cloud alignment with AWS and marketplace availability on Google Cloud can be financially important because they reduce procurement friction and let fal capture enterprise spend already allocated to major cloud budgets.
  claimRefs:
  - CI017
  - CI018
  - CI037
  - CI038
  - CI045
