    - Medium
    - Operational instability can raise support cost and churn
    - Request incident cost, SLA credits, and support ticket impact
  - - Headcount scale
    - 70 in Dec 2025, 80 on current careers page
    - Medium
    - Useful proxy for operating-expense growth and organizational intensity
    - Request payroll and headcount plan by function
  notes: This table intentionally mixes known and unknown metrics to show how much of the underwriting stack is still hidden.
