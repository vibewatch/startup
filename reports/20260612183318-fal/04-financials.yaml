  - FI002
  - FI003
- id: capital-adequacy-and-underwriting-verdict
  title: Capital Adequacy, Filing Visibility, and Underwriting Verdict
  body: 'Fundraising headlines make fal look well capitalized. The company publicly disclosed $23 million across seed and Series A, then $49 million, $125 million, and $140 million in successive 2025 rounds. That primary capital alone totals roughly $337 million, and Business Wire later rounded the tally to $300 million while TechCrunch added the critical nuance that the Series D also included a secondary component. This is enough to lower immediate solvency concern, but not enough to answer the real diligence questions around cash, runway, or dilution. No public cash balance, burn, debt facility, or project-finance obligation appears in the retained set, and even legal-entity verification is incomplete because the accessible registry link returned a challenge page during this run. The underwriting verdict from public sources alone is therefore mixed: the revenue model is credible, the growth narrative is plausible, and the cloud-channel strategy is promising, but the margin path and capital
    adequacy still require private-company evidence before they can be underwritten with confidence.'
