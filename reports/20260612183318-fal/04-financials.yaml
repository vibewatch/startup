- id: unit-economics-and-cost-structure
  title: Unit Economics, Cost Structure, and Revenue Quality Caveats
  body: 'Public evidence strongly suggests that fal’s cost structure is dominated by GPU capacity, engineering talent, trust-and-safety operations, and support rather than by inventory or physical hardware ownership. The compute docs show why: fal markets dedicated H100 infrastructure, multi-GPU clustering, and a serverless engine that can scale automatically for bursty inference. That model can be attractive if utilization is managed well, because scale-to-zero serverless execution and differentiated routing can keep idle cost lower for spiky demand. But the same public evidence also exposes why certainty is limited. Sacra’s revenue estimates are useful directional signals, not company disclosures. Public pages do not disclose gross margin, CAC, NRR, refunds, or support load by workload. IsDown’s incident record adds another financial caution, because reliability issues can create both support cost and churn pressure in a usage-based model. The result is a business that looks operationally
    leveraged on paper but remains only partially underwritable from public evidence.'
  claimRefs:
  - CI021
  - CI022
  - CI025
  - CI026
  - CI033
  - CI036
  - CI041
  - CI043
  - CI044
