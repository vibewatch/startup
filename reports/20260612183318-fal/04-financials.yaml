- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash, burn, and runway
    - Blocks capital-adequacy underwriting
    - Obtain current board deck, cash report, and scenario plan
  - - Gross margin by stream
    - Blocks valuation and cost-to-serve analysis
    - Request gross-margin bridge for APIs, serverless, compute, and channel sales
  - - Developer-to-paying conversion
    - Blocks monetization quality assessment
    - Request active developers, paying developers, and enterprise account counts
  - - Marketplace take-rates and discounts
    - Blocks channel-economics analysis
    - Request Google Cloud / partner commercial terms and realized discount data
  - - Debt, vendor commitments, and customer concentration
    - Blocks downside-risk analysis
    - Request debt schedule, committed cloud spend, and top-customer concentration
  - - Clean filing / entity extract
    - Blocks standard legal-entity verification
    - Pull authorized Delaware or secretary-of-state records without a challenge page
  notes: These gaps are the minimum financial data package needed to move from an informed narrative to a true underwriting view.
