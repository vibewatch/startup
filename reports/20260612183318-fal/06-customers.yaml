- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Current evidence
  - Impact on customer quality
  - Current read
  - Diligence path
  rows:
  - - Partner-embedded expansion
    - Pika, IMG.LY, Adobe ecosystem, Freepik, ByteDance, and cloud marketplaces widen reach
    - Positive for top-of-funnel and enterprise credibility
    - Real expansion vector, but customer ownership can sit with partners
    - Request revenue mix by direct customers vs partner/channel accounts
  - - Creative-media vertical concentration
    - Most named proof clusters around video, design, commerce imagery, and media workflows
    - A downturn in one creative category could affect usage concentration
    - Meaningful thematic concentration risk
    - Request vertical mix of inference revenue and top use cases
  - - Brand-name proof quality
    - Several marquee names appear only in TechCrunch, BusinessWire, or Sacra rather than customer-side case studies
    - Weakens confidence in exact enterprise depth
    - Useful but not underwriting-grade on its own
    - Request customer references from named brands
  - - Procurement friction reduction
    - Google marketplace billing and AWS partner posture lower buying friction
    - Helps enterprise acquisition and expansion
    - Clear commercial positive
    - Measure how much spend already comes through cloud-marketplace channels
  - - Reliability and pricing-transparency noise
    - Queue stalls, account-lock complaints, and cost-visibility requests are public
    - Can hurt expansion inside production accounts
    - Moderate risk that matters most for high-volume buyers
    - Request queue SLOs, outage postmortems, and billing-dispute rates
  notes: Impact is qualitative because public sources do not disclose customer-level revenue concentration, partner revenue share, or renewal cohorts.
