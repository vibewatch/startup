tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Primary use case
  - Strategic value
  - Public gap
  rows:
  - - Self-serve developers and indie builders
    - Developer is buyer, user, and often payer
    - Homepage, docs, JS/Python clients
    - Prototype and launch media features through a unified API
    - Fast top-of-funnel expansion and long-tail usage
    - No public conversion rate from sign-up to paid production
  - - AI-native media apps and model labs
    - Product team buys; app end users consume outputs
    - Pika, Perplexity, Photoroom, PlayHT, Freepik
    - Embed image, video, audio, or multimodal generation into consumer or prosumer apps
    - High-usage workloads can scale quickly if the app wins
    - Most names are second-hand and contract size is undisclosed
  - - Creative tooling and design-workflow partners
    - Platform operator buys; creators are end users
    - IMG.LY, Adobe ecosystem, Freepik collaboration
    - Bring fal generation into editors, boards, and asset workflows
    - Partner distribution expands reach without fal owning the UI
    - Revenue share, attach rate, and customer ownership are not public
  - - Large enterprise and brand accounts
    - Enterprise team or business unit buys; internal teams use
    - Canva, Shopify, Adobe, Amazon MGM Studios
    - Advertising, e-commerce imagery, media, and content operations
    - Brand-name references help procurement and credibility
    - Customer-side case studies are sparse in the retained set
  - - Procurement-sensitive cloud buyers
    - Enterprise finance / IT buys; product teams use
    - Google Cloud Marketplace, AWS partner motion
    - Route spend through existing cloud commitments and governance
    - Removes purchasing friction for larger accounts
    - Marketplace usage does not reveal underlying retention or concentration
  notes: Rows distinguish direct API customers from embedded-channel relationships so brand names are not automatically treated as equal revenue-quality proof.
