- id: durability-concentration-and-adverse-signals
  title: Durability remains the main open question because growth proof is much stronger than retention proof
  body: 'The biggest public customer gap is not acquisition but durability. Across the retained pack, fal does not disclose customer count, NRR, GRR, churn, renewal rates, contract lengths, or top-customer concentration. Instead, durability has to be inferred from proxies: recurring partner expansion, marketplace procurement access, and a steady developer-tooling surface. Those signals are useful, but they are not substitutes for cohort evidence. The adverse record matters for the same reason. GitHub issues document requests stuck in queue, locked accounts even after credit purchases, and a request for clearer cost visibility in API responses. IsDown says it has tracked 16 incidents since March 2025 and identifies Elevated API error rates as the latest outage in May 2026. None of that negates the growth story, yet it does change how a buyer should weight it. Fal’s public customer chapter is strong on reach, ecosystem positioning, and production intent, but weaker on retention accounting
    and concentration transparency. Investors should treat the biggest unresolved risk as hidden dependence on a relatively small set of heavy-usage brands, creative partners, or model-lab relationships that public materials do not quantify.'
