    - Request active paying customer count by segment and geography
  - - NRR / GRR / churn
    - Not disclosed
    - All segments
    - Low
    - Public pack does not prove recurring economics or stickiness
    - Request cohort retention, renewal, and churn by top segment
  - - Repeat usage proxy
    - Pika routes API demand through fal; IMG.LY embeds fal in CE.SDK; cloud-marketplace routes remain active
    - AI-native apps, partners, enterprise buyers
    - Medium
    - Suggests fal is becoming part of repeated workflows, not one-off demos
    - Request expansion and renewal history for top partner/customer accounts
  - - Enterprise satisfaction proxy
    - SOC 2, SSO, private endpoints, analytics, and priority support are highlighted repeatedly
    - Larger enterprise buyers
    - Medium
    - Supports procurement readiness for serious accounts
