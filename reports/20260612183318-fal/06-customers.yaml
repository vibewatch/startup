  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-enterprise-confirmation
    missingEvidence: Customer-side case studies or partner pages from Adobe, Canva, Perplexity, and Shopify that explicitly confirm active fal usage and scope.
    whyItMatters: Repeated secondary naming is directionally useful, but direct customer confirmation would materially improve confidence in enterprise-proof quality.
    diligencePath: Ask management for customer-reference calls or public customer-side materials for the largest named enterprise accounts.
    relatedQuestionRefs:
    - QU006
    - QU011
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: public-scale-denominators
    missingEvidence: A reconciled explanation for why public surfaces cite 200+, 600+, and 1,000+ models and 500k, 2M+, 2.5M+, and 3M developer counts.
    whyItMatters: The growth direction is clear, but exact scale metrics should not be over-precisioned in underwriting without a consistent denominator.
    diligencePath: Request a dated metric bridge showing the current active-developer definition and current live model-count definition used in sales materials.
    relatedQuestionRefs:
    - QU009
    - QU010
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, churn, renewal, contract-length, and segment retention data for direct and partner-embedded customers.
    whyItMatters: Without cohort and renewal data, the public pack cannot separate fast acquisition from durable recurring economics.
    diligencePath: Request cohort retention tables and renewal history for the top customer segments and for marketplace-billed vs direct-contract accounts.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-partner revenue mix, usage concentration, and exposure to a small number of heavy-usage brands or channels.
    whyItMatters: The public evidence set is concentrated in a handful of recognizable names, but it does not show whether that concentration is merely narrative or economically material.
    diligencePath: Request top-10 customer revenue share, top-partner channel share, and usage concentration by workload class.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: public-customer-roster
    missingEvidence: An exhaustive public roster separated into direct customers, embedded partners, model labs, and marketplace buyers.
    whyItMatters: The current chapter can rank visible proof quality, but it cannot claim to enumerate fal’s full customer base from public sources alone.
    diligencePath: Request a segmented customer reference list with permission status for direct citation in a refresh run.
    relatedQuestionRefs:
    - QU001
    - QU011
    relatedTableRefs:
    - TU003
