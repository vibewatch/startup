- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: standard
  summary: Fal’s public adoption flow moves from model discovery and queue-based API use into either embedded partner products or enterprise marketplace procurement.
  data:
    nodes:
    - id: n1
      label: Model discovery
      description: Customer compares image, video, audio, and 3D options inside fal’s catalog.
    - id: n2
      label: API key + SDK setup
      description: JS/Python clients and docs reduce first integration friction.
    - id: n3
      label: Queue / async production pattern
      description: Webhook and queue flows become the default for real production jobs.
    - id: n4
      label: Embedded product launch
      description: Customer ships fal inside a branded product such as an AI app or editor.
    - id: n5
      label: Marketplace procurement
      description: Larger accounts move billing into Google Cloud or pursue AWS-backed enterprise scaling.
    - id: n6
      label: Expansion / dedicated controls
      description: High-volume teams add private endpoints, reserved pricing, or custom deployments.
    edges:
    - from: n1
      to: n2
      label: choose endpoint + authenticate
    - from: n2
      to: n3
      label: move from quick call to queue/webhook flow
    - from: n3
      to: n4
      label: ship user-facing media feature
    - from: n4
      to: n5
      label: procurement / compliance / budget review
    - from: n5
      to: n6
      label: scale usage or customize infrastructure
