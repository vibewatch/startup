  - - Negative service proxy
    - Public GitHub issues and third-party incident trackers show queue, billing, and outage complaints
    - Production developers and operators
    - Medium
    - Reliability friction can weaken repeat usage even if top-line demand is strong
    - Request incident history, severity distribution, and support-resolution metrics
  notes: Because formal retention metrics are absent, this table relies on public proxies and explicitly separates positive procurement signals from reliability negatives.
