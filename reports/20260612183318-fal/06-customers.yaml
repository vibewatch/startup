figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Most public journeys begin with self-serve experimentation but become commercially meaningful when fal disappears into a partner or enterprise workflow.
  data:
    items:
    - id: discover
      label: Discover a model need
      actor: Developer, creative team, or platform PM
      description: A buyer starts with a need for image, video, audio, or multimodal generation and encounters fal through the homepage, docs, or ecosystem references.
      channels:
      - fal homepage
      - fal docs
      - conference / ecosystem content
    - id: prototype
      label: Prototype via API / SDK
      actor: Developer or ML engineer
      description: The customer gets an API key, chooses a model, and tests queue or direct patterns through JS, Python, or HTTP.
      channels:
      - Model APIs docs
      - npm client
      - PyPI client
    - id: embed
      label: Embed inside product workflow
      actor: AI-native app or partner platform team
      description: The buyer integrates fal into a live application, editor, or product workflow where end users may never see fal branding directly.
      channels:
      - Pika API
      - IMG.LY CE.SDK
      - customer app backends
    - id: procure
      label: Procure for production
      actor: Enterprise IT / finance / product owner
      description: Larger teams move spend through marketplace billing, compliance review, and support commitments before production scale-up.
      channels:
      - Google Cloud Marketplace
      - enterprise support
      - AWS partner motion
    - id: expand
      label: Expand volume or control
      actor: High-usage product or enterprise platform team
      description: Customers increase usage through reserved capacity, private endpoints, custom deployments, or deeper partner integrations.
      channels:
      - Reserved pricing
      - private endpoints
      - custom model / compute surfaces
  claimRefs:
