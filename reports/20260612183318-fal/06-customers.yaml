- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric / proxy
  - Public value
  - Segment
  - Confidence
  - What it means
  - Diligence ask
  rows:
  - - Customer count
    - Not disclosed
    - All segments
