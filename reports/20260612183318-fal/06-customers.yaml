- id: TU003
  title: Named customer proof table
  columns:
  - Customer / partner
  - Segment
  - Public proof
  - Production vs pilot
  - Outcome / strategic value
  - Limitation
  rows:
  - - Pika
    - AI video application / model lab
    - Pika API page says to use Fal AI; fal blog says Pika Model 2.2 runs on fal
    - Production API surface
    - Strongest direct proof that a visible app routes external developer demand through fal
    - No disclosed usage volume or contract value
  - - IMG.LY
    - Creative tooling platform
    - IMG.LY partners page says AI features are powered by fal.ai; fal explains CE.SDK integration
    - Production integration
    - Clear embedded-channel distribution into an editor workflow
    - No disclosed number of shared customers or revenue contribution
  - - Adobe ecosystem
    - Creative suite / partner-model channel
    - fal says its models will appear in Adobe Express and Project Concept; Adobe confirms a partner-model surface
    - Rollout / channel availability rather than fully documented bilateral case study
    - Strategically valuable distribution into mainstream creative workflows
    - Reviewed Adobe pages do not explicitly name fal
  - - Canva
    - Design and marketing platform
    - Named by BusinessWire, TechCrunch 2025, and Sacra as a fal customer reference
    - Likely production, based on repeated naming
    - High-value enterprise reference if accurate
    - No customer-side confirmation in retained set
  - - Perplexity
    - AI search and consumer app
    - Named as a paying customer in TechCrunch 2024 and again in 2025/Sacra
    - Likely production
    - Supports fal’s fit for high-volume AI-native products
    - Still secondary-source proof only
  - - Shopify
    - Commerce platform
    - Named by TechCrunch 2025, Sacra, and discussed in fal conference coverage as a generative-media use case
    - Likely production or active enterprise workflow
    - Extends proof into commerce and product-visual workflows
    - No direct Shopify case study in the retained set
  - - Freepik
    - Creative content platform
    - TechCrunch 2024 names Freepik as paying customer; F Lite repo shows co-developed model with Fal
    - Production partnership / co-development
    - Suggests deeper partner economics than a simple one-off logo
    - Exact split between customer usage and co-development is unclear
  notes: This is a partial enumeration of the best publicly visible proof points, weighted toward sources with bilateral acknowledgement or repeated independent naming.
