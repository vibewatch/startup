companyProfile:
  summary: >
    Fal is a generative media inference platform founded in 2021 by Burkay Gur and Gorkem
    Yurtseven. It provides a developer-focused cloud infrastructure layer for deploying and
    serving AI models — primarily image, video, audio, and 3D generation — at scale. The
    platform hosts 1,000+ production-ready models, offers serverless and dedicated GPU
    deployment, and operates a model-API marketplace. Fal has grown from $23M in seed/Series A
    funding to a $4.5B valuation in December 2025, raised $300M in total, and serves 2.5
    million developers including enterprise customers such as Adobe, Pika, Canva, and Perplexity.
    In May 2026, Fal announced AWS as its preferred cloud provider in a strategic partnership.
  foundedDate: "2021-01-01"
  founders:
    - name: Burkay Gur
      role: Co-founder & CEO
      background: Previously at Coinbase; computer science background
      claimRefs: [CO002, CO003]
    - name: Gorkem Yurtseven
      role: Co-founder & CTO
      background: Previously at Coinbase; infrastructure engineering background
      claimRefs: [CO002, CO003]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >
    Developer-facing inference platform for generative media (image, video, audio, 3D,
    real-time models). Products include hosted model APIs with 1,000+ production-ready
    models, serverless GPU deployment (custom model hosting), a model marketplace, dedicated
    GPU endpoints, and proprietary infrastructure technology including FlashPack (model
    loading acceleration) and Patina (orchestration framework). An MCP server enables LLM
    tool-calling access to the full model catalog.
  customerFocus: >
    AI-native developers, creative applications builders, and enterprises deploying generative
    media workflows. Notable customers include Adobe (ecosystem integration), Pika (video
    generation API), Canva, Perplexity, and enterprise customers accessed through AWS, Google
    Cloud Marketplace, and Vercel.
  businessModel: >
    Usage-based pricing: pay-per-use model API calls and fixed-rate reserved GPU deployments.
    Revenue from API consumption (compute time, tokens) plus enterprise contracts for
    dedicated infrastructure. Secondary revenue through cloud marketplace listings (AWS,
    Google Cloud) and platform integrations.
  stage: Series D
  fundingStatus: >
    $300M total raised. Rounds: $9M seed (2024), $14M Series A (2024), $49M Series B (early
    2025), $125M Series C (July 2025, $1.5B valuation), $140M Series D (December 2025, $4.5B
    valuation). Sequoia Capital led Series D; Kleiner Perkins and NVIDIA also participated.
    AWS preferred-cloud partnership announced May 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO014, CO025, CO026, CO027, CO036]
