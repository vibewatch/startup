- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Current metric
  - Valuation / multiple / status
  - Relevance to fal
  - Limitation
  rows:
  - - Fal
    - Reported >$200M revenue by Oct 2025; Sacra estimate of ~$400M annualized by early 2026
    - Private; closed at $4.5B in Dec 2025 and reportedly discussed ~$8B in 2026
    - Direct subject and best anchor for price discipline
    - Revenue and future round terms are not fully company-disclosed
  - - Modal
    - '>$300M annualized revenue in May 2026'
    - Private; $4.65B post-money Series C
    - Closest private AI-infrastructure peer with disclosed valuation plus revenue
    - Different workload mix, broader general AI cloud, and more explicit compute features
  - - CoreWeave
    - LTM revenue $6.23B and EV/Sales 14.3x on Jun 12 2026
    - Public; $55.39B market cap and $89.07B enterprise value
    - Shows public-market appetite for scaled AI infrastructure
    - Capital intensity, debt load, and customer profile are materially different
  - - Fireworks AI
    - Inference PaaS with token and GPU pricing visible on public pages
    - Private; $250M Series C at $4B post-money in Nov 2025
    - Relevant inference-platform comp for private-market appetite
    - LLM-centric mix differs from fal’s media-heavy specialization
  - - Replicate
    - Usage-based pricing with dedicated hardware for private models and broad developer mission
    - Private; valuation not retained in this source set
    - Useful for pricing and feature overlap in developer inference
    - Lacks a retained public valuation anchor here
  - - Cloudflare
    - Q1 2026 revenue $639.8M; FY26 guide $2.805B-$2.813B
    - Public; large developer cloud with transparent tiered pricing
    - Helpful broader cloud / developer-platform comp for disclosure quality and pricing transparency
    - Not a pure-play generative-media inference company
  notes: Selected comp set is intentionally partial and optimized for valuation framing rather than exhaustive market mapping; rows mix private rounds and public references because fal itself remains private.
