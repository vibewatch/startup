- id: diligence-asks-and-kill-triggers
  title: Diligence Asks and Kill Triggers
  body: 'The final judgment is therefore conditional. Fal does not need more product storytelling; it needs decision-grade economics and round detail. The first diligence bucket is unit economics: gross margin by model class, GPU-cost pass-through, cloud commitments, and whether video-heavy mix changes profitability. The second is quality of revenue: net retention, concentration, enterprise contract duration, and how much of the current scale comes from bursty experimentation versus repeat production usage. The third is capital structure: preferences, secondary allocation, option refresh needs, and any terms that make a seemingly fair headline valuation unattractive for a new buyer. The fourth is reliability and billing transparency. Public GitHub issues show enough queue, billing, and cost-visibility friction to matter if the company wants to hold a premium multiple. The thesis breaks if growth normalizes before disclosure quality catches up, or if a new round clears at a much higher mark
    without corresponding evidence that enterprise economics and operating discipline improved.'
