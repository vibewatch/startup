- id: round-cadence-and-step-ups
  title: Round Cadence and Step-Ups
  body: Fal’s financing path is the core valuation fact pattern. The company moved from a 2024 two-tranche $23M seed plus Series A financing at an $80M Series A valuation to a $125M Series C in July 2025, an over-$4B reported October 2025 financing, and a $140M Series D at $4.5B in December 2025. That is not normal compounding; it is step-function repricing inside a single year. The speed matters because it reduces the amount of public operating evidence investors can digest between marks. The bullish interpretation is that the company surfaced into a suddenly strategic category and revenue scaled almost as fast as valuation. The bearish interpretation is that investors pre-paid several years of execution before public disclosure matured. Both can be true at once. What underwriting cannot do is treat the latest round as if it were supported by the same disclosure set a public market buyer would get from a similarly valued software or infrastructure company.
