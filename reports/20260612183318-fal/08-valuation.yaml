- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue bridge
    - Audited revenue by quarter plus management bridge from $95M to $200M+ to current run rate
    - The central valuation debate is whether public revenue proxies are real and durable
    - Finance diligence with board-approved KPI pack
  - - Unit economics
    - Gross margin by workload, GPU utilization, cloud commitment structure, and contribution margin by product class
    - Premium multiples are only durable if media-heavy growth does not erode economics
    - Finance + infrastructure diligence
  - - Retention and concentration
    - NRR, gross churn, top-customer concentration, and enterprise contract terms
    - Logo proof is not enough if usage is bursty or concentrated
    - Commercial diligence with customer cohort cuts
  - - Round terms
    - Preference stack, secondary mix, liquidation terms, and option-pool refresh needs
    - Headline valuation can misstate real entry economics for new investors
    - Legal and financing diligence
  - - Reliability discipline
    - SLA history, incident archive, postmortems, and queue / billing complaint resolution metrics
    - Operational trust is part of valuation support at this scale
    - Engineering and customer-success diligence
  notes: These asks are the minimum package required to move from admiration of fal’s trajectory to a fully underwritten investment decision.
