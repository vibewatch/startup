- id: scale-proxies-and-comparable-positioning
  title: Scale Proxies and Comparable Positioning
  body: 'The best support for Fal’s mark comes from scale proxies rather than audited disclosure. Sacra’s company page and valuation model place Fal at roughly $400M annualized revenue in early 2026 after an estimated $285M end-2025 run rate, while TechCrunch reported that Bloomberg pegged revenue above $200M by October 2025. Official posts add customer and developer proof: more than 2.5M developers in the AWS announcement, a reported 70-person team in the Series D post, and named production customers such as Adobe, Canva, Shopify, Quora, and Amazon MGM Studios across retained sources. On comparables, Modal is the cleanest private peer because it publicly paired a $4.65B valuation with more than $300M annualized revenue in May 2026. CoreWeave is the cleanest public AI-infrastructure reference because it trades with a disclosed revenue base and still commands a rich EV/Sales multiple, albeit with a very different capital structure. Fireworks, Replicate, and Cloudflare help frame market structure
    and pricing pressure more than they anchor a precise multiple.'
