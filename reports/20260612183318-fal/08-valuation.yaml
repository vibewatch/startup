  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: round-terms
    missingEvidence: Full financing documents or management disclosure covering preferences, liquidation stack, secondaries, and option-pool refresh needs.
    whyItMatters: Headline valuation can materially overstate the attractiveness of a new entry if the capital structure is investor-favorable or dilution-heavy.
    diligencePath: Request the latest term sheet, cap table, and any secondary-sale summary from counsel and the lead investor.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by workload, contribution margin by product line, GPU cost commitments, and utilization data.
    whyItMatters: The justified multiple depends not just on revenue growth but on whether media-heavy workloads preserve software-like economics.
    diligencePath: Request a board KPI pack or finance model that splits image, video, audio, and custom deployment economics.
    relatedQuestionRefs:
    - QV009
    - QV022
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, churn, top-customer share, contract duration, and revenue concentration by sector or customer.
    whyItMatters: Customer quality determines whether fal deserves a premium private multiple or should be underwritten as bursty usage revenue.
    diligencePath: Review cohort tables, top-20 customer schedules, and enterprise contract summaries.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: conflicting-data
    severity: material
    topic: revenue-proxy-confidence
    missingEvidence: Independent confirmation that reconciles the $95M, >$200M, $285M, and ~$400M revenue proxies into a consistent timeline.
    whyItMatters: Implied multiples move materially depending on which revenue proxy an investor treats as current and durable.
    diligencePath: Obtain a revenue bridge by quarter and compare it against each third-party report cited in this chapter.
    relatedQuestionRefs:
    - QV004
    - QV021
    relatedTableRefs:
    - TV003
    - TV004
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A broader set of private AI-infrastructure comparables with consistently retained revenue and valuation metrics.
    whyItMatters: The current comp table is decision-useful but intentionally partial because private peers disclose unevenly.
    diligencePath: Expand the comp set with additional retained direct sources for Together, RunPod, Lambda, and any 2026 public-market marks.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV004
