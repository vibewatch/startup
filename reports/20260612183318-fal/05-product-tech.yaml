- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Public role
  - Key dependency
  - Operational risk
  rows:
  - - Access surfaces
    - Playground, HTTP, Python client, JavaScript client, MCP, and partner integrations expose the platform
    - SDK maintenance and partner UX surfaces
    - Fragmentation or stale packages can raise support burden
  - - Control plane
    - Queueing, retries, async execution, streaming, realtime, and endpoint lifecycle management
    - Scheduler / runner orchestration inside fal runtime
    - Reliability regressions directly affect all higher-level product surfaces
  - - Deployment substrate
    - Marketplace models and user apps run as fal.Apps on Serverless
    - Runtime packaging, container builds, and app registration
    - Cold starts, runner health, and config drift can degrade UX
  - - Hardware pool
    - CPU plus RTX 4090/5090, A100, L40, H100, H200, and B200 options
    - GPU availability and underlying cloud economics
    - Capacity shortages or wrong machine selection can compress margins or latency
  - - Observability stack
    - App Analytics, Error Analytics, Prometheus export, and Log Drains
    - Metrics collection and log forwarding
    - Thin public detail on retention, SLA mapping, and compliance scope
  - - Migration / packaging tooling
    - Direct server mode, Dockerfile ingest, and multi-machine-type fallback ease adoption
    - Developer tooling and CLI quality
    - Migration promises are strong, but public customer proof on large migrations is limited
  notes: The architecture table is assembled from product docs and public repo surfaces; exact cloud vendors, regional topology, and internal service boundaries are not disclosed.
