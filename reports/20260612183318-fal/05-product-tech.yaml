  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: trust-disclosure
    missingEvidence: Detailed public trust-center pages or downloadable assurance artifacts covering certifications, control scope, and incident/governance practices.
    whyItMatters: Enterprise product-tech diligence needs more than a status page and shell trust center to underwrite security and compliance readiness.
    diligencePath: Retrieve live trust-center detail pages, security questionnaires, and any SOC/ISO attestations directly from fal or in a management data room.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-history
    missingEvidence: Historical uptime, incident counts, severity distribution, and any contractual SLA language for Model APIs and Serverless.
    whyItMatters: Current operational status is helpful but insufficient to judge production reliability and support exposure over time.
    diligencePath: Request historical incident logs, SLA commitments, and postmortem summaries tied to the main product surfaces.
    relatedQuestionRefs:
    - QE011
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: partner-dependence
    missingEvidence: Commercial terms, exclusivity limits, and economics for upstream model suppliers, cloud capacity, and partner channels.
    whyItMatters: Fal’s product breadth and go-to-market freshness appear partly dependent on outside model providers and distribution partners, which can materially affect margins and product continuity.
    diligencePath: Review partner contracts, cloud commitments, and any model-provider licensing or rev-share agreements under NDA.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
  - type: access-blocked
    severity: minor
    topic: partner-distribution
    missingEvidence: A text-accessible current Vercel integration page or partner brief that specifies feature depth, billing path, and operational ownership.
    whyItMatters: The integration exists, but the fetched marketplace page is too thin to independently verify implementation scope.
    diligencePath: Collect current partner documentation or a live product demo from fal and Vercel covering install flow, billing, and supported models.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE002
