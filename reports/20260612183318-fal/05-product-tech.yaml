chapter:
  number: 5
  title: Product & Technology
  summary: 'Fal’s product is best understood as a unified generative-media infrastructure stack: developers can call a large hosted model catalog, deploy their own apps on the same serverless substrate, or move heavier workloads onto dedicated compute. The strongest public differentiation is not exclusive model ownership but a combination of media-focused systems engineering, rapid frontier-model launches, and multi-surface developer distribution, while trust/compliance disclosure remains materially thinner than the product surface itself.'
sections:
- id: product-surface-and-customer-workflow
  title: Product Surface and Customer Workflow
  body: 'Fal’s public product map starts with a simple user promise and then widens quickly. The documentation frames the company as a generative-media platform where developers can call more than 1,000 optimized models through a unified API or deploy their own models on the same infrastructure. In practical workflow terms, that creates three primary entry points. A builder can start with hosted Model APIs for immediate experimentation; a more advanced team can shift to Serverless when it wants control over code, weights, and the container environment; and a workload with steadier utilization can move to dedicated Compute. The workflow is intentionally low-friction: the hosted API exposes direct, queued, async, streaming, and realtime patterns under a common interface, while each model page includes playgrounds, schemas, pricing, and code snippets. Fal has also widened access beyond classic SDK usage. The MCP Server turns the catalog into a conversational tool surface, while the Vercel integration
    and blog launch language show an effort to meet developers inside existing deployment and billing workflows rather than forcing a bespoke platform motion. Public 2026 launch posts for Veo 3, Sora 2, and GPT Image 1 reinforce that the catalog is being refreshed fast enough to matter for media-native builders, not just archived as a static marketplace.'
