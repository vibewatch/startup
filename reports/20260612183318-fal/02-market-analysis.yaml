callouts:
- calloutType: insight
  title: The right market frame is narrower than generic generative AI
  body: Fal’s value proposition is strongest in media-first inference and deployment, not in the full universe of chatbots, agents, or foundational-model training. That narrower frame makes the market more defensible and more measurable.
  claimRefs:
  - CM001
  - CM002
  - CM041
  - CM043
- calloutType: risk
  title: Headline TAM numbers are not precise enough to anchor valuation alone
  body: The retained research pages disagree widely on market size and CAGR. Any underwriting model should therefore prioritize bottom-up usage, modality mix, and enterprise-spend evidence over a single top-down TAM headline.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM042
- calloutType: strength
  title: Fast access to frontier models is a real buyer job
  body: Fal’s Veo 3 and Sora 2 launch posts show that developers care about being able to use the newest models immediately, with usable APIs and production economics. That is a legitimate market wedge even in a crowded platform field.
  claimRefs:
  - CM032
  - CM033
  - CM046
  - CM049
