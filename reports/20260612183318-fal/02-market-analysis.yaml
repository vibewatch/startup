tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to fal
  rows:
  - - Managed media-model APIs
    - Per-call or per-second inference for image, video, audio, and multimodal outputs
    - Pure research spend and consumer subscriptions with no API layer
    - Developers, product teams, infrastructure owners
    - Core revenue pool
  - - Serverless model deployment
    - Hosted deployment of custom or fine-tuned media models
    - Generic VM spend with no orchestration or autoscaling layer
    - ML/platform teams
    - Core adjacent revenue pool
  - - Dedicated AI compute for media workloads
    - Reserved GPU capacity, predictable throughput, and long-running jobs
    - Commodity non-AI cloud services
    - Infrastructure owners and advanced ML teams
    - Important upmarket expansion area
  - - Creative-suite generation apps
    - Image, audio, and video generation bundled into design tools
    - Standalone API revenue not captured by the suite
    - Creative teams and marketers
    - Substitute / channel pressure
  - - General-purpose genAI platforms
    - Broad agent, chatbot, and workflow platforms
    - Pure media-generation specialization
    - IT, app-platform, and business teams
    - Adjacent ceiling, not direct SAM
  - - Frontier model lab R&D
    - Model-training and foundational research budgets
    - Inference resale or hosted tooling
    - Model labs and hyperscalers
    - Outside fal’s direct market boundary
  notes: The table narrows fal’s real market to inference, deployment, and compute attached to media generation. It intentionally excludes broad enterprise-AI and foundational-research spend.
