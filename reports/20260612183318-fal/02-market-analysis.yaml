chapter:
  number: 2
  title: Market Analysis
  summary: 'Fal sits inside a fast-growing but noisy market best described as generative-media inference and model-access infrastructure. Public evidence supports strong demand signals—rapid frontier-model launches, 100,000-plus Bedrock customers, survey evidence that image adoption is already mature, and cloud-centric deployment dominance—but it also shows why underwriting needs caution: top-down market estimates diverge sharply, hyperscalers and suites are crowding the stack, and upstream model availability can change abruptly.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Fal is not selling a single creative app; it is selling access, inference, and deployment for generative-media workflows. The retained source set repeatedly places the company in the layer between frontier model labs and end-user applications: fal’s own launch posts emphasize API access to models such as Veo 3, Sora 2, and GPT Image 1, while cloud competitors like Bedrock, Together, Replicate, Fireworks, Baseten, Azure OpenAI, and Google Cloud all compete for the same developer and product-owner budget. That means the relevant spend pool includes model API calls, hosted inference, workflow orchestration, and dedicated compute for image, video, audio, and multimodal creation. It excludes most generic cloud spend, frontier-model R&D, and pure consumer-subscription revenue at the app layer. The substitute set is also broad. Developers can build directly on OpenAI or Azure, creators can default to Firefly, Runway, or Midjourney, and platform teams can multi-home across several API vendors.'
