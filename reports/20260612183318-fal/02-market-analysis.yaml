- id: TM002
  title: TAM / SAM / SOM or Sizing Lens Table
  columns:
  - Source
  - Year basis
  - Scope
  - Value / growth
  - Why it matters
  - Limitation
  rows:
  - - Global Market Insights
    - 2025-2035
    - Global generative AI market
    - $53.7B in 2025; $83.3B in 2026; $988.4B by 2035; 31.6% CAGR
    - Useful high-growth ceiling and challenge framing
    - Too broad for fal-specific SAM
  - - Grand View Research
    - 2025-2033
    - Global generative AI market
    - $22.21B in 2025; $324.68B by 2033; 40.8% CAGR
    - Shows how aggressive forecasts can be even on narrower base values
    - Methodology differs sharply from other reports
  - - Fortune Business Insights
    - 2025-2034
    - Global generative AI market
    - $103.58B in 2025; $161B in 2026; $1.26T by 2034; 29.3% CAGR
    - Highlights how much TAM varies by category definition
    - Not media-specific
  - - MarketsandMarkets
    - 2025-2032
    - Generative AI by modality and application
    - $71.36B in 2025; $890.59B by 2032; 43.4% CAGR
    - Most relevant retained report because it explicitly breaks out image, video, and multimodal modalities
    - Still not a fal-specific media-infrastructure SAM
  - - Coherent Market Insights
    - 2026-2033
    - Global generative AI market by deployment and application
    - $121.10B in 2026; cloud 76.9%; content creation 35.7%
    - Useful for narrowing toward cloud content-creation spend
    - Still broad and report-methodology driven
  - - Artificial Analysis survey
    - '2025'
    - Generative media adoption maturity
    - Image adoption ahead of video; Gemini and OpenAI lead image usage
    - Best retained lens for actual generative-media behavior
    - Survey sample is smaller than market-report universes
  notes: This chapter intentionally uses several lenses because no single report cleanly isolates media-first inference platforms. The right underwriting move is triangulation, not blind acceptance of any one headline TAM.
