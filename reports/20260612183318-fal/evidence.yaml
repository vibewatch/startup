evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-control
    missingEvidence: >-
      A current board roster, board-observer list, ownership stakes, and voting/control rights for the founders and lead
      investors.
    whyItMatters: Control and follow-on financing dynamics cannot be underwritten from round announcements alone.
    diligencePath: Request the latest cap table, board consents, and investor-rights summary from management.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: developer-monetization
    missingEvidence: A breakdown of active developers, paying developers, enterprise accounts, and cohort retention.
    whyItMatters: Developer count alone does not reveal monetization efficiency or product stickiness.
    diligencePath: Request paid-account counts, enterprise logo list, and developer-to-paying conversion funnels.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: series-d-structure
    missingEvidence: Primary-versus-secondary allocation and participant-by-participant check sizes for the Series D event.
    whyItMatters: Gross financing headlines overstate fresh operating cash when secondaries are mixed in.
    diligencePath: Obtain the Series D term sheet, closing memo, and capitalization table bridge.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, ARR, gross margin, and customer-concentration disclosures.
    whyItMatters: Current public revenue figures are analyst estimates and do not establish quality of earnings.
    diligencePath: >-
      Request monthly recurring revenue, GAAP/non-GAAP revenue detail, gross margin, and top-customer concentration
      schedules.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: fal-sam
    missingEvidence: >-
      A management-approved serviceable-market definition showing which media workflows, geographies, and customer
      segments fal actively targets.
    whyItMatters: >-
      Broad generative-AI TAM estimates are too noisy to support underwriting without a company-specific narrowing
      logic.
    diligencePath: Request internal TAM/SAM/SOM materials, pipeline segmentation, and booked-revenue mix by workflow.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Average spend, retention, and margin by modality, customer segment, and deployment pattern.
    whyItMatters: Public pricing surfaces do not show realized revenue quality or which buyer cohorts matter most.
    diligencePath: >-
      Request cohort ARR, gross margin by modality, and customer spend distribution across image, video, audio, and
      compute.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-size-dispersion
    missingEvidence: A reconciled methodology for why top-down market reports differ so widely on 2025-2026 market size and CAGR.
    whyItMatters: Valuation comps can be distorted if the wrong category definition is applied to fal.
    diligencePath: Normalize reports to a media-centric software scope and triangulate with pipeline and usage data.
    relatedQuestionRefs:
      - QM005
      - QM020
      - QM026
  - type: stale
    severity: minor
    topic: upstream-model-roadmaps
    missingEvidence: Stable long-term roadmap visibility from frontier model providers whose APIs or terms can change quickly.
    whyItMatters: Sudden product sunsets or exclusivity changes can reshape fal’s integration value proposition.
    diligencePath: Track provider roadmaps, deprecation notices, and contract terms for major upstream models quarterly.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: peer-economics
    missingEvidence: Comparable retention, gross margin, uptime, and net revenue retention metrics across fal and key peers.
    whyItMatters: Public marketing pages are strong on positioning but weak on unit economics or customer stickiness.
    diligencePath: >-
      Request customer win-loss analysis, retention metrics, and margin benchmarks from fal plus third-party channel
      checks.
    relatedQuestionRefs:
      - QP025
      - QP026
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      Independent market-share data for media-first inference workloads across fal, Replicate, Baseten, Fireworks, and
      Modal.
    whyItMatters: Without share data, moat judgments remain qualitative.
    diligencePath: >-
      Commission customer interviews, usage telemetry studies, or procurement channel checks focused on media-generation
      APIs.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: price-realization
    missingEvidence: Realized discounts, committed-spend terms, and reserved-capacity agreements across vendors.
    whyItMatters: Headline pricing can materially misstate competitive economics in enterprise deals.
    diligencePath: Request anonymized competitor price cards from prospects, enterprise contracts, and fal win-loss notes.
    relatedQuestionRefs:
      - QP011
      - QP017
  - type: conflicting-data
    severity: minor
    topic: moat-durability
    missingEvidence: Longitudinal evidence on whether customers stick with one vendor or multi-home as new frontier models launch.
    whyItMatters: The answer determines whether fal’s partner wins translate into durable share or temporary routing volume.
    diligencePath: Track customer migrations and partner renewals over multiple model cycles.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, runway months, and board-approved financing plan.
    whyItMatters: >-
      Public fundraising headlines do not reveal how much operating cash remains after secondaries, capacity
      commitments, or growth spend.
    diligencePath: Request the latest board deck with cash, burn, runway, and next-round trigger assumptions.
    relatedQuestionRefs:
      - QI014
      - QI017
      - QI023
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, and revenue concentration by modality and customer segment.
    whyItMatters: Usage growth alone does not prove durable, efficient revenue.
    diligencePath: Request margin bridge, cohort retention, CAC/payback, and top-customer concentration analysis.
    relatedQuestionRefs:
      - QI011
      - QI022
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Realized enterprise pricing, marketplace take-rates, discounting, and reserved-capacity economics.
    whyItMatters: List pricing can materially overstate realized ASP and revenue quality.
    diligencePath: Request anonymized enterprise contracts, channel terms, and sales compensation assumptions.
    relatedQuestionRefs:
      - QI006
      - QI021
      - QI025
    relatedTableRefs:
      - TI002
      - TI004
      - TI005
  - type: access-blocked
    severity: minor
    topic: corporate-filing
    missingEvidence: >-
      A clean registry extract or charter filing that confirms the current legal entity details without a challenge
      page.
    whyItMatters: Entity verification is a standard diligence control even when operating analysis is otherwise strong.
    diligencePath: Pull Delaware or secretary-of-state records through an authorized corporate-registry workflow.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: access-blocked
    severity: material
    topic: trust-disclosure
    missingEvidence: >-
      Detailed public trust-center pages or downloadable assurance artifacts covering certifications, control scope, and
      incident/governance practices.
    whyItMatters: >-
      Enterprise product-tech diligence needs more than a status page and shell trust center to underwrite security and
      compliance readiness.
    diligencePath: >-
      Retrieve live trust-center detail pages, security questionnaires, and any SOC/ISO attestations directly from fal
      or in a management data room.
    relatedQuestionRefs:
      - QE012
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: reliability-history
    missingEvidence: >-
      Historical uptime, incident counts, severity distribution, and any contractual SLA language for Model APIs and
      Serverless.
    whyItMatters: >-
      Current operational status is helpful but insufficient to judge production reliability and support exposure over
      time.
    diligencePath: Request historical incident logs, SLA commitments, and postmortem summaries tied to the main product surfaces.
    relatedQuestionRefs:
      - QE011
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: partner-dependence
    missingEvidence: >-
      Commercial terms, exclusivity limits, and economics for upstream model suppliers, cloud capacity, and partner
      channels.
    whyItMatters: >-
      Fal’s product breadth and go-to-market freshness appear partly dependent on outside model providers and
      distribution partners, which can materially affect margins and product continuity.
    diligencePath: Review partner contracts, cloud commitments, and any model-provider licensing or rev-share agreements under NDA.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE001
  - type: access-blocked
    severity: minor
    topic: partner-distribution
    missingEvidence: >-
      A text-accessible current Vercel integration page or partner brief that specifies feature depth, billing path, and
      operational ownership.
    whyItMatters: The integration exists, but the fetched marketplace page is too thin to independently verify implementation scope.
    diligencePath: >-
      Collect current partner documentation or a live product demo from fal and Vercel covering install flow, billing,
      and supported models.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: named-enterprise-confirmation
    missingEvidence: >-
      Customer-side case studies or partner pages from Adobe, Canva, Perplexity, and Shopify that explicitly confirm
      active fal usage and scope.
    whyItMatters: >-
      Repeated secondary naming is directionally useful, but direct customer confirmation would materially improve
      confidence in enterprise-proof quality.
    diligencePath: >-
      Ask management for customer-reference calls or public customer-side materials for the largest named enterprise
      accounts.
    relatedQuestionRefs:
      - QU006
      - QU011
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: public-scale-denominators
    missingEvidence: >-
      A reconciled explanation for why public surfaces cite 200+, 600+, and 1,000+ models and 500k, 2M+, 2.5M+, and 3M
      developer counts.
    whyItMatters: >-
      The growth direction is clear, but exact scale metrics should not be over-precisioned in underwriting without a
      consistent denominator.
    diligencePath: >-
      Request a dated metric bridge showing the current active-developer definition and current live model-count
      definition used in sales materials.
    relatedQuestionRefs:
      - QU009
      - QU010
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, churn, renewal, contract-length, and segment retention data for direct and partner-embedded customers.
    whyItMatters: >-
      Without cohort and renewal data, the public pack cannot separate fast acquisition from durable recurring
      economics.
    diligencePath: >-
      Request cohort retention tables and renewal history for the top customer segments and for marketplace-billed vs
      direct-contract accounts.
    relatedQuestionRefs:
      - QU015
      - QU016
      - QU025
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer and top-partner revenue mix, usage concentration, and exposure to a small number of heavy-usage
      brands or channels.
    whyItMatters: >-
      The public evidence set is concentrated in a handful of recognizable names, but it does not show whether that
      concentration is merely narrative or economically material.
    diligencePath: Request top-10 customer revenue share, top-partner channel share, and usage concentration by workload class.
    relatedQuestionRefs:
      - QU017
      - QU025
    relatedTableRefs:
      - TU005
