companyProfile:
  summary: >
    Fal 是一个生成式媒体推理平台，由 Burkay Gur 和 Gorkem Yurtseven 于 2021 年创立。公司提供面向开发者的云基础设施层，用于大规模部署和服务 AI 模型——主要覆盖图像、视频、音频和 3D
    生成。平台托管 1,000+ 个可投产模型，提供 serverless 和专用 GPU 部署，并运营模型 API 市场。Fal 从 $23M 的种子轮 / Series A 融资起步，到 December 2025 估值达到
    $4.5B，累计融资 $300M，服务 2.5 million 名开发者，企业客户包括 Adobe、Pika、Canva 和 Perplexity。May 2026，Fal 宣布 AWS 成为其战略合作中的首选云服务商。
  foundedDate: '2021-01-01'
  founders:
    - name: Burkay Gur
      role: 联合创始人兼 CEO
      background: 曾任职 Coinbase；计算机科学背景
      claimRefs:
        - CO002
        - CO003
    - name: Gorkem Yurtseven
      role: 联合创始人兼 CTO
      background: 曾任职 Coinbase；基础设施工程背景
      claimRefs:
        - CO002
        - CO003
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >
    面向开发者的生成式媒体推理平台（图像、视频、音频、3D、实时模型）。产品包括托管模型 API（含 1,000+ 个可投产模型）、serverless GPU 部署（自定义模型托管）、模型市场、专用 GPU 端点，以及
    FlashPack（模型加载加速）和 Patina（编排框架）等自有基础设施技术。MCP server 让 LLM 能以工具调用方式访问完整模型目录。
  customerFocus: >
    AI-native 开发者、创意应用构建者，以及部署生成式媒体工作流的企业。知名客户包括 Adobe（生态集成）、Pika（视频生成 API）、Canva、Perplexity，以及通过 AWS、Google Cloud
    Marketplace 和 Vercel 触达的企业客户。
  businessModel: |
    按用量计价：模型 API 调用按次付费，预留 GPU 部署按固定费率收费。收入来自 API 消耗（计算时间、token）以及面向专用基础设施的企业合同。云市场上架（AWS、Google Cloud）和平台集成带来次级收入。
  stage: Series D
  fundingStatus: >
    累计融资 $300M。轮次：$9M 种子轮（2024）、$14M Series A（2024）、$49M Series B（early 2025）、$125M Series C（July 2025，估值 $1.5B）、$140M
    Series D（December 2025，估值 $4.5B）。Sequoia Capital 领投 Series D；Kleiner Perkins 和 NVIDIA 也参投。AWS 首选云合作伙伴关系于 May 2026
    宣布。
