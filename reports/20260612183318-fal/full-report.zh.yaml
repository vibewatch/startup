            body: >-
              支撑 Fal 估值的最好证据，不是审计披露，而是规模代理。Sacra 的公司页面和估值模型显示，Fal 在 2025 年末估计 $285M 运行率之后，到 2026 年初约为 $400M
              年化收入；TechCrunch 则报道 Bloomberg 认为其 2025 年 10 月收入已超过 $200M。官方文章补充了客户和开发者证明：AWS 公告中的 2.5M 多开发者、Series D
              文章中报道的 70 人团队，以及留存来源中点名的 Adobe、Canva、Shopify、Quora、Amazon MGM Studios 等生产客户。可比公司里，Modal 是最干净的私营同业，因为它在
              2026 年 5 月公开把 $4.65B 估值与超过 $300M 年化收入放在一起。CoreWeave 是最干净的公开 AI 基础设施参照，因为它有披露的收入基础，仍享有较高的 EV/Sales
