  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与优先级
        blocks:
          - type: paragraph
            body: >-
              Fal 的风险栈集中在一个判断上：让产品有吸引力的同一套基础设施抽象，也聚集了运营、商业和法律暴露。平台位于开发者、前沿模型所有者、GPU
              供应和大型云之间，因此信任、可靠性或依赖管理的任何弱点，都可能迅速传导为客户犹豫和估值压力。公开证据指向六个主要类别。第一，信任和可靠性风险高，因为当前状态页积极，但独立和客户侧信号仍显示宕机、队列停滞和账户摩擦。第二，云和供应依赖风险高，因为
              AWS 现在是首选云服务商，而技术栈仍依赖稀缺高端 NVIDIA GPU。第三，竞争压缩风险高，因为 Replicate、Modal 和 Fireworks 都在营销重叠的开发者基础设施价值，且
              Replicate 背后现在有 Cloudflare 分发。第四，法律和政策风险具有实质性，因为 fal 条款明确把输出和赔偿风险转移给客户，同时 EU AI Act
              正在收紧透明度和禁止内容义务。第五，治理和披露风险具有实质性，因为公开产品细节跑在公开管理、保障和事后复盘细节前面。第六，模型风险仍然具有实质性，因为 fal 的估值跃升意味着对执行失误的容忍度很低。
