            body: >-
              Fal 的公开信任姿态方向上是真的，但相较其企业级野心，仍显得偏薄。公司现在已有具名的 Head of Trust & Safety，并公开说明已接入 Thorn 处理 CSAM，也与 StopNCII
              合作处理非自愿亲密影像。隐私政策把企业用户置于处理方框架下，也释放了有意义的控制信号。但保证层面仍不均衡。留存的 Trust Center
              抓取几乎没有实质细节；更强的公开材料分散在信任文章、隐私政策、条款页、状态页和新闻稿文案里。可靠性证据同样混杂。一方面，官方状态页在抓取日全绿，公司材料也称 99.99% uptime。另一方面，IsDown
              记录了自 2025 年 3 月以来的 16 起事件，2025–2026 年的 GitHub issue 也提到请求卡在队列、付费账户被锁、成本可见性缺失。法律角度把风险进一步放大。Fal 2026 年 3
              月条款称，客户需赔偿公司，输出不保证原创或不侵权，第三方提供商也可能影响可靠性。这组事实不能证明眼下已经失灵，但意味着企业买家要承担的尽调负担，比产品叙事本身暗示的更重。
