        - 运行时打包、容器构建和 app 注册
        - 冷启动、runner 健康度和配置漂移会伤害 UX
      - - 硬件池
        - CPU 加 RTX 4090/5090、A100、L40、H100、H200 和 B200 选项
        - GPU 可用性和底层云经济性
        - 容量短缺或机器选择错误会挤压毛利率或延迟
      - - 可观测性栈
        - App Analytics、Error Analytics、Prometheus export 和 Log Drains
        - 指标采集和日志转发
        - 留存、SLA 映射和合规范围的公开细节很薄
      - - 迁移 / 打包工具
        - Direct server mode、Dockerfile ingest 和多机型 fallback 降低采用门槛
        - 开发者工具和 CLI 质量
        - 迁移承诺很强，但大型迁移的公开客户证据有限
    notes: 架构表来自产品文档和公开仓库界面；具体云供应商、区域拓扑和内部服务边界未披露。
