        title: 资本形成、估值与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Fal 的融资历史压缩得异常紧。公司称其在 2024 年种子轮和 Series A 共融资 $23 million，随后在 2025 年完成 $49 million Series B、$125 million
              Series C 和 $140 million Series D。官方与独立来源在各轮知名投资人上基本一致，TechCrunch 的 Series D 报道还补上关键估值背景：$4.5 billion，并包含
              secondary element。但融资叙事并不完全干净：Business Wire 后来称 fal 迄今融资 $300 million，而已披露的 primary rounds 合计约 $337
              million。差异可能来自四舍五入或时间点，但仍是尽调点，因为它影响现金余额假设。公开规模信号同样强，但未经审计：公司和外部分析师引用开发者数量、标杆客户、团队规模上升和大型模型库存，却没有披露经审计收入、毛利率或留存指标。
