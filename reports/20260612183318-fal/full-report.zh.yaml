  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 入场视角与建议
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对公司质量给出强判断，但只支持有条件的入场视角。Fal 在一个真实类别里有清晰的产品市场拉力、可信的客户
              logo、加速的融资支持，也有足够第三方报道让人相信公司正在异常快速地放大规模。但价格层面的公开证据，仍远比产品层面的公开证据薄。最干净的已关闭标记，是 2025 年 12 月宣布的 $4.5B Series
              D。如果收入区间确实从 2025 年中约 $95M，推进到 10 月超过 $200M，并在 2026 年初接近 $400M
              年化，这个估值可以说得通。即便如此，报道内容与已披露内容之间的差距仍然重要。关于毛利率、净留存率（NRR）、客户集中度，或清算优先权、老股占比等轮次经济条款，仍没有留存的公开证据。因此，正确建议应停在价格敏感的中间地带：观察或继续研究，而不是买入；除非新尽调补上经济性缺口，或入场价格改善。
