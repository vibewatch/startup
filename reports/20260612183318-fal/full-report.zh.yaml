      - number: '5.2'
        title: 架构、部署与运营模型
        blocks:
          - type: paragraph
            body: >-
              最重要的架构点是，fal 并未公开拆成一组互不相关的产品。Serverless 文档称，每个 marketplace 模型本身都是运行在同一 substrate 上的 fal.App，客户也可以用这套
              substrate 部署自己的模型；这意味着公司的托管目录和自定义部署业务共享同一个 control plane。对一家私营公司而言，这个 control plane 的描述异常偏运营：现有 HTTP
              servers 可以通过 exposed_port direct-server mode 迁移，custom containers 可以从 Dockerfiles 或 registries 带入，新构建的
              apps 可以用 Python 原生定义，并通过 fal 的 CLI 部署。可观测性也作为产品功能浮出水面，而不是藏在支持材料中。公开文档提到 request-volume analytics、latency
              percentiles、runner utilization、startup duration、带 stack traces 的 error analytics、Prometheus-compatible
              export 和 log drains。底层，fal 暴露了宽硬件池，覆盖 CPU instances 和多类 GPU，包括 RTX 4090、RTX 5090、A100、L40、H100、H200 和
              B200，并支持 multiple-machine-type fallback 和 multi-GPU configurations。这种广度重要，因为它显示 fal
              在为异构媒体和模型工作负载优化，而不是只服务单一推理画像。风险在于，整个产品仍依赖容量编排、云经济性和外部模型 / provider 访问，而这些并未公开量化。
