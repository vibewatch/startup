      - number: '8.2'
        title: 融资节奏与估值跳升
        blocks:
          - type: paragraph
            body: >-
              Fal 的融资路径是估值判断的核心事实模式。公司从 2024 年两批次 $23M 的种子轮加 Series A 融资、$80M 的 Series A 估值，走到 2025 年 7 月 $125M Series
              C、2025 年 10 月据报道超过 $4B 的融资，再到 2025 年 12 月 $4.5B 估值的 $140M Series
              D。这不是正常复利，而是一年内阶跃式重定价。速度重要，因为投资者在两个估值标记之间能够消化的公开运营证据变少了。乐观解读是，公司进入了一个突然具备战略意义的类别，收入放大几乎和估值一样快。悲观解读是，在公开披露成熟之前，投资者已经预付了好几年的执行。两者可以同时成立。承销不能做的是，把最新一轮当作有同等披露支撑来处理——那种披露通常是公开市场买家从一家估值相近的软件或基础设施公司那里才会拿到的。
