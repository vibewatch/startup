  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fal 的竞争集合比简单的“模型托管”同业清单更宽。最直接的基础设施同业是 Modal、Baseten、Fireworks、Replicate 和 Together，它们都承诺快速部署、自动扩缩容，或简化对大型
              AI 模型目录的访问。但真正的竞争压力还来自两个相邻群体。第一类是 AWS、Microsoft 和 Google 等超大规模云厂商，它们能把生成式 AI 访问打包进既有云关系和企业承诺。第二类是 Adobe
              Firefly、Runway、Midjourney，以及 Stability AI 日益品牌化的生产产品等应用或套件替代品；对只想要输出而非开发者可控 API 的客户，它们可以完全绕过
              fal。这个类别结构很重要，因为不同对手威胁 fal 价值链的不同环节：超大规模云厂商攻击分发和采购，基础设施同业攻击延迟和工具，应用则攻击中立 API 层本身是否必要。它们也塑造买方对价值归属位置的预期。
