      - number: '8.4'
        title: 情景承销与估值区间
        blocks:
          - type: paragraph
            body: >-
              这里正确的估值方法，不是制造虚假精确的 DCF，而是围绕收入耐久性和倍数容忍度做情景承销。在已关闭的 $4.5B 标记下，如果收入代理已经处在数亿美元高位年化区间，且媒体推理仍是一个结构性有利的利基，Fal
              看起来偏紧，但并非明显破裂。但如果下一轮传闻估值约 ~$8B，举证责任会陡然上升。那会把 Fal
              推入一个区间：投资者需要承销非常快的增长、有限的竞争侵蚀，以及足够强的运营执行，以免可靠性或采购摩擦压缩倍数。因此，估值取决于一小组变量：报道收入区间是否真实且可持续；在视频负载占比高、首选云迁移的情况下，利润率是否仍有吸引力；企业合同是否证明足够粘；融资条款是保留普通股上行，还是侵蚀普通股上行。公开记录足以搭建乐观、基准和悲观情景，但还不足以把它们压缩成一个狭窄的公允价值点。
