  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fal 卖的不是单一创意应用，而是生成式媒体工作流的访问、推理和部署。保留来源反复把公司放在前沿模型实验室与终端用户应用之间：fal 自己的发布文章强调可通过 API 访问 Veo 3、Sora 2 和 GPT
              Image 1 等模型；Bedrock、Together、Replicate、Fireworks、Baseten、Azure OpenAI 和 Google Cloud
              等云端竞争者也在争夺同一批开发者和产品负责人的预算。因此，相关支出池包括模型 API 调用、托管推理、工作流编排，以及用于图像、视频、音频和多模态创作的专用算力。它不包括大部分通用云支出、前沿模型
              R&D，以及应用层纯消费者订阅收入。替代集合也很宽。开发者可以直接基于 OpenAI 或 Azure 构建，创作者可以默认使用 Firefly、Runway 或 Midjourney，平台团队也可以在多个 API
              vendor 之间多宿主。
