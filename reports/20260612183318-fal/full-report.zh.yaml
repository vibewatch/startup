      - number: '5.4'
        title: 信任、可靠性与未解缺口
        blocks:
          - type: paragraph
            body: >-
              公开信任和可靠性证据方向上积极，但相对 fal 的产品雄心仍不完整。文档首页宣传 99.99%+ uptime，状态页在抓取日期显示核心界面 operational，这作为当前状态信号有用。SDK
              页面也展示了基本 credential-handling 指引，以及用于更安全客户端使用的 proxy package reference。但披露栈明显薄于大型企业买方通常需要的水平。保留的 Trust
              Center 抓取只暴露一个 shell title，Vercel marketplace 页面在文本模式下大多由 JS 渲染，公开语料也没有提供详细 certification
              scope、incident-history depth 或 architecture-assurance material，足以让外部人完整尽调安全、隐私和合规姿态。还有一些更小的生态卫生警示。较旧的
              JavaScript serverless client 明确被弃用，转向官方 @fal-ai/client package；本次运行中，公开 Hugging Face fal-ai URL 返回
              404。两件事都不削弱核心平台，但都强化了更广泛结论：fal 产品丰富、工程导向明显，但部分信任和生态界面仍落后于运行时本身的成熟度。
