      - number: '2.4'
        title: 驱动因素、约束与可服务市场
        blocks:
          - type: paragraph
            body: >-
              最强市场驱动来自能力迭代和企业拉动。新前沿模型持续提升真实感、原生音频、prompt adherence
              和控制能力；内容自动化需求不断把这些能力拉进产品路线图；超大规模云厂商已经验证，大企业今天就在购买托管生成式 AI 平台。但同一批来源也把逆风讲清楚了。计算成本仍是结构性问题，安全和负责任使用筛查仍会卡住
              onboarding，上游模型供应商可以通过 sunset 或独家安排快速重塑市场。Sora 停用是保留来源中最清楚的波动案例。这些事实收窄了 fal 的现实可服务市场。公司并不是争夺生成式 AI
              软件支出的每一美元，而是在争夺与媒体中心推理、创作工作流以及重视快速访问前沿模型且不想管理基础设施的开发者相关的那部分支出。这是一个庞大且有吸引力的市场，但供应商集中，切换成本中等，并非硬锁定。
