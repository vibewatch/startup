      - number: '2.2'
        title: 规模测算视角、采用证据与市场分散度
        blocks:
          - type: paragraph
            body: >-
              市场显然很大且在增长，但公开规模测算噪音足够大，用单一 TAM 数字会误导。保留的 2026 年研究页显示，2025 年全球市场规模从 $22.21 billion 到 $103.58 billion
              不等，2026 年规模从 $83.3 billion 到 $161 billion 不等，预测 CAGR 从 29.3% 到 43.4%
              不等。这些差异反映出类别定义漂移——有些报告纳入广义企业软件转型，另一些更偏内容创作、多模态模型或平台工具。更有用的需求证据来自更窄视角。Artificial Analysis
              显示，图像生成已经比视频生成更成熟，且少数前沿供应商主导当前使用。Coherent Market Insights 认为内容创作和云部署是主要生成式 AI 细分市场，MarketsandMarkets
              则明确拆分图像、视频和多模态类别。实际含义是，fal 的市场应通过多个受约束视角估值，而不是看一个自上而下的标题数字。
