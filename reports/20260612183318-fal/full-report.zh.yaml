        - 商业尽调，拆客户 cohort
      - - 轮次条款
        - 优先权堆栈、老股出售比例、清算条款和期权池刷新需求
        - headline valuation 可能误导新投资人的真实入场经济性
        - 法务和融资尽调
      - - 可靠性纪律
        - SLA 历史、事故档案、事后复盘，以及排队 / 计费投诉解决指标
        - 在这个规模上，运营信任是估值支撑的一部分
        - 工程和客户成功尽调
    notes: 这些问题是从欣赏 fal 轨迹走向完整承销投资决策所需的最低材料包。
