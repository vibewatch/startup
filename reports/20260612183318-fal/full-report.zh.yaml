        - $0 入门；$250 团队；企业定制
        - 席位档位加算力
        - 云基础能力、GPU 并发、日志、扩缩
        - 实际算力账单和企业折扣
        - 对构建者友好，但完整经济性取决于运行时画像
      - - Baseten
        - $0 Basic；Pro 和 Enterprise 报价
        - 平台档位加 GPU 或 token 定价
        - 部署、模型 API、训练、合规、支持
        - 预留容量经济性和折扣
        - 如果可用性和控制很重要，企业适配可以支撑更高支出
      - - Fireworks
        - 自助服务加企业版
        - 无服务器 token 定价加训练 token 定价
        - 推理、部署、微调
        - 模型专属费率和企业让利
        - 经济性故事强，但需要仔细匹配工作负载
      - - Replicate
        - 用量定价加专用私有模型时间
        - 私有模型按设置、空闲和活跃时间付费
        - 模型目录、定制部署、训练
        - 私有工作负载有空闲时间负担
        - 实验可能便宜，常驻服务的优势没那么明显
      - - Azure OpenAI
        - PAYG 或预置吞吐
        - 消费量或预留吞吐
        - 带企业控制的直接模型访问
        - 预置单元规模、折扣、云锁定
        - 对已经在 Azure 采购体系内的买方很强
      - - 超大规模云厂商 / 套件替代品
        - 通常打包或定制
        - 云合同或应用订阅
        - 模型访问嵌在更大的栈里
        - 真实增量 AI 成本可能很难剥离
        - 打包会削弱独立供应商基于价格的差异化
    notes: 标价只是决策的一部分。采购路径、空闲容量暴露和支持层级，往往比名义入门价更重要。
