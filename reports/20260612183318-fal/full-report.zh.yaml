      - number: '8.5'
        title: 尽调问题与否决触发点
        blocks:
          - type: paragraph
            body: >-
              最终判断因此是有条件的。Fal 不需要更多产品故事；它需要可用于决策的经济性和轮次细节。第一组尽调是单位经济：按模型类别拆分的毛利率、GPU
              成本转嫁、云承诺，以及视频负载占比上升是否改变盈利能力。第二组是收入质量：净留存率（NRR）、集中度、企业合同期限，以及当前规模有多少来自脉冲式实验、多少来自重复生产使用。第三组是资本结构：清算优先权、老股分配、期权池刷新需求，以及任何会让看似合理的名义估值对新买家失去吸引力的条款。第四组是可靠性和计费透明度。公开
              GitHub issue
              已经显示出足够多队列、计费和成本可见性摩擦；如果公司想守住溢价倍数，这些问题就值得重视。如果增长在披露质量追上之前正常化，或新一轮在大幅更高估值成交，却没有相应证据证明企业经济性和运营纪律已经改善，投资逻辑就会失效。
