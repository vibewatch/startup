  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户地图：fal 直接卖给开发者，但许多用户通过合作伙伴产品接触它
        blocks:
          - type: paragraph
            body: >-
              fal 的公开客户证据不像传统 SaaS logo wall 那样列出合同金额和续约数据。保留来源反而指向几种重叠的买方模式。第一层是自助开发者，他们发现某个模型，拿到 API key，然后基于统一
              endpoint 和 queueing layer 开始发货。第二层是 AI-native 媒体应用和模型实验室，它们把 fal 当作自有品牌下的生产基础设施，Pika 是当前最清楚的例子。第三层是 IMG.LY
              和 Adobe 生态等创意软件与工作流伙伴，fal
              是更广泛创作栈的一部分，而非可见的目的地产品。第四层是二级来源点名的更大企业或品牌账户——Canva、Perplexity、Shopify、Adobe、Amazon MGM Studios
              等——但客户侧佐证不均。商业含义很重要：fal 似乎不仅在企业有意识购买 fal 时取胜，也在另一个平台把 fal 嵌入为自身工作流下方媒体运行时时取胜。这扩大了触达，但也让公开来源更难判断客户质量，因为
              branded end-user demand 和 fal-specific revenue 可能分离。
