      - number: '1.2'
        title: 创始人、领导层与治理可见性
        blocks:
          - type: paragraph
            body: >-
              公开公司画像仍然高度绑定创始人，但治理已不再只是创始人叙事。第三方资料将 Burkay Gur 和 Gorkem Yurtseven 识别为 2021 年联合创始人，并把创业起点追溯到他们在 Coinbase 和
              Amazon 工作时遇到的基础设施痛点。Forbes 将 Burkay Gur 列为 CEO，而更广泛的公开叙事仍把两位创始人与技术架构和产品方向联系在一起。融资期间，治理可见性有所提高：Series B
              公告披露 Jennifer Li 和 Glenn Solomon 加入董事会，Series C 文章又加入 Arsham
              Memarzadeh。这些事实足以说明投资人影响已经制度化，但还不足以还原当前席位分配、所有权或否决权。这个缺口重要，因为 fal
              的融资节奏显示控制权动态可能快速变化，尽管公开叙事仍以创始人为中心。也就是说，要判断真实控制风险，治理尽调需要私营公司材料，不能只看营销页和融资博客。
