callouts:
  - calloutType: "insight"
    title: "Asset-Light Community Model Distinguishes Strava from Hardware Fitness Collapses"
    body: "While the 2021-2024 fitness technology market was defined by the collapse of capital-intensive connected hardware providers like Peloton and Tonal, Strava's valuation reflects its resilient subscription software foundation. Its asset-light infrastructure, community network effects, and proprietary behavioral data asset position it uniquely within digital sports technology."
    claimRefs:
      - "CV001"
      - "CV003"
  - calloutType: "risk"
    title: "Valuation Sensitivity to Unaudited Subscription Unit Economics"
    body: "At a $2.2 billion valuation and ~4.4x revenue multiple, Strava trades at a premium to broader consumer internet benchmarks. Without audited disclosures confirming customer acquisition costs, gross margins, and net revenue retention, the current valuation remains vulnerable to multiple compression if growth slows."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV014"
      - "CV016"
