            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.3'
        title: Operational, security, and integrity risks
        blocks:
          - type: paragraph
            body: >-
              Strava spans mobile, web, GPS tracking, route planning, social features, safety tooling, and device
              synchronization. That breadth creates a broad reliability and data-quality surface even though no current
              outage frequency or service-level evidence was allocated. The help center documents dedicated security and
              privacy support, while the terms disclaim uninterrupted or error-free operation. Historical reporting also
              describes leaderboard manipulation, and the terms require authentic activities and permit account
              suspension. A third-party developer issue illustrates a separate integration-quality hazard: its own
              client trusted parsed Strava responses without adequate validation. That is not evidence of a Strava-side
              vulnerability, but it supports diligence on SDK contracts, payload bounds, and partner test discipline.
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Dependencies, model risk, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Device and application connectivity is central to the experience: Strava's support page names Garmin and
              Apple Watch, its terms place connected services under third parties' own policies, and even the
              company-issued app-install link depends on an SMS delivery flow. Public evidence does not quantify
              concentration by device maker, app store, payment rail, cloud provider, data partner, or sponsor.
              Financial resilience is similarly under-disclosed. One independent analyst describes free-to-premium
              conversion as a persistent structural concern, but the pool does not contain audited subscriber cohorts,
              churn, margin, cash, burn, or runway. Thesis breaks should therefore be tied to a material repeat privacy
              event, sustained sync degradation, weakening paid conversion or retention, or evidence that liquidity
              cannot fund remediation and public-company readiness.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause or reject the investment if diligence shows a material repeat location-data exposure without
              verified remediation, sustained device-sync degradation without recoverability, deteriorating paid
              conversion or retention, or insufficient liquidity to fund privacy, reliability, and public-company
              controls.
            calloutType: risk
            claimRefs:
              - CR004
              - CR014
              - CR015
          - type: callout
            title: Immediate diligence priority
            body: >-
              Require an incident chronology, privacy-control test results, third-party dependency map, subscriber
              cohorts, and a cash-and-runway bridge before relying on reported profitability or contractual risk
              allocation.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR010
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Strava centers on its position as the preeminent global digital community
              and subscription platform for active endurance athletes. Unlike hardware-centric connected fitness
              businesses that suffered sharp post-pandemic writedowns and restructuring cycles, Strava operates an
              asset-light, freemium digital model underpinned by deep community network effects and more than a decade
              of proprietary athletic behavioral telemetry. With registered athlete accounts scaling from over 150
              million in 2025 to upwards of 200 million across 185 countries in 2026, and annual recurring revenue
              reported to approach $500 million, the platform demonstrates sustained top-line momentum. Recent strategic
              acquisitions, including training applications Runna and The Breakaway, further reinforce Strava's
              capability to expand subscription average revenue per user through personalized coaching and structured
              training plans. Conversely, the anti-thesis reflects critical structural uncertainties. Strava's
              monetization relies on converting a modest fraction of its massive freemium base into paying subscribers,
              leaving it exposed to price sensitivity, churn, and macroeconomic consumer discretionary pressure.
              Furthermore, while secondary markets and venture rounds price Strava at $2.2 billion, the absence of
              public financial statements obscures operating burn, gross margins, platform infrastructure costs, and
              third-party app store take-rates. Without audited visibility into cash flow generation, equity investors
              face substantial multiple compression risk if growth moderates post-IPO.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV013
      - number: '8.2'
        title: Financing History, Cap Table Context, and Secondary Marks
        blocks:
          - type: paragraph
            body: >-
              Strava's institutional financing history spans more than a decade of venture and growth capital backing.
              The company's capitalization history records foundational early-stage rounds led by Sigma Partners and
              Madrone Capital Partners, followed by Series D expansion from Sequoia Capital in 2014 and a $110 million
              Series F financing in November 2020 led by TCV and Sequoia Capital at a $1.5 billion valuation. In May
              2025, Strava completed a Series G round led by Sequoia Capital, with participation from existing backers
              including TCV, Jackson Square Ventures, and Go4it Capital, securing a post-money valuation of $2.2
              billion. Supplementary debt tracking from Tracxn indicates conventional debt financing was also arranged
              in June 2025 involving existing institutional sponsors. In secondary private markets, trading platforms
              reflect stable pricing: Forge Global reported a derived Forge Price of $13.99 as of August 2026, implying
              an ongoing $2.2 billion valuation, while Nasdaq Private Market recorded an indicative price of $14.35 as
              of September 2026, reflecting a 30.2% increase from September 2024 benchmarks. However, the precise
              seniority, liquidation preferences, and potential dilution mechanics governing the 2025 equity and debt
              instruments remain private, representing an overhang for prospective public market equity participants.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: Valuation Scenarios, Comparable Analysis, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Strava's $2.2 billion private mark requires balancing its high-margin software network profile
              against public and private comparable multiples across consumer technology and fitness ecosystems. On a
              reported run-rate revenue approaching $500 million, the $2.2 billion valuation implies an enterprise value
              multiple of approximately 4.4x to 4.5x trailing ARR. Under a base-case scenario, Strava sustains 15% to
              20% annual subscription growth, deepens Runna and coaching integration, and achieves a public listing
              valuation in line with top-tier consumer subscription platforms at 4.0x to 5.0x revenue. In a bull-case
              scenario, rapid adoption of AI-powered personalized training, expansion of corporate Metro partnerships,
              and accelerated international premium conversions propel revenue beyond $650 million, supporting multiple
              expansion toward 6.0x revenue and a market valuation exceeding $3.2 billion. In a bear-case scenario,
              subscriber churn accelerates following price adjustments, growth slows below 10%, and public market
              scrutiny on net income margins contracts trading multiples toward 2.0x to 2.5x revenue, implying a
              downside valuation of $1.1 billion to $1.3 billion. Given that draft S-1 registration statements remain
              confidential and executive leadership transitions—including CFO Matt Anderson—were finalized in mid-2025,
              investors should maintain a research-more stance until audited financials confirm sustainable free cash
              flow.
            claimRefs:
              - CV002
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV010
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset-Light Community Model Distinguishes Strava from Hardware Fitness Collapses
            body: >-
              While the 2021-2024 fitness technology market was defined by the collapse of capital-intensive connected
              hardware providers like Peloton and Tonal, Strava's valuation reflects its resilient subscription software
              foundation. Its asset-light infrastructure, community network effects, and proprietary behavioral data
              asset position it uniquely within digital sports technology.
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
          - type: callout
            title: Valuation Sensitivity to Unaudited Subscription Unit Economics
            body: >-
              At a $2.2 billion valuation and ~4.4x revenue multiple, Strava trades at a premium to broader consumer
              internet benchmarks. Without audited disclosures confirming customer acquisition costs, gross margins, and
              net revenue retention, the current valuation remains vulnerable to multiple compression if growth slows.
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV016
