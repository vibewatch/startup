              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity, Reliability, and Roadmap Boundaries
        blocks:
          - type: paragraph
            body: >-
              Public evidence indicates production maturity for the core product and API, but it does not establish
              operating performance. The developer portal calls V3 stable and says Strava mobile applications use it,
              while also warning that major changes may occur and that API tokens may be revoked for agreement
              violations. The terms state that beta features may be unsupported, may contain errors or design flaws, and
              may be changed or removed. They also disclaim any warranty that the service will be uninterrupted, timely,
              secure, error-free, accurate, or reliable. Those legal statements define customer risk allocation rather
              than proving poor reliability. No assigned independent status history, uptime target, latency benchmark,
              recovery objective, or current roadmap was available, leaving operational maturity a material
              technical-diligence gap.
            claimRefs:
              - CE006
              - CE008
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, Safety, Privacy, and AI Controls
        blocks:
          - type: paragraph
            body: >-
              Location and behavioral data make trust controls part of the product architecture rather than a peripheral
              policy issue. Strava's terms say adult user content is public by default, while available controls can
              make content private or limit it to a smaller group. The same terms describe personalization using sport
              type, location, social connections, clubs, and engagement to rank feeds and recommend routes, challenges,
              and accounts. Strava also says it may use AI and machine learning for training-related features,
              acknowledges that those technologies can make mistakes, and directs users to exercise judgment. Beacon
              provides a concrete safety control, but the assigned evidence does not verify encryption design, security
              certifications, moderation performance, privacy-control adoption, or independent testing of AI
              recommendations.
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE012
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The integration surface is verified; the internal stack is not
            body: >-
              Strava substantiates a broad product and API boundary, but the assigned sources do not disclose its
              production topology. Technical underwriting should therefore focus on requested architecture artifacts
              rather than treating vendor build guides as a description of Strava.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
          - type: callout
            title: Location data concentrates product and governance risk
            body: >-
              Default-public adult content, location-based personalization, third-party connections, and AI-enabled
              features expand utility while increasing the importance of privacy controls, integration governance,
              recommendation testing, and operational evidence.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
