      - number: '1.3'
        title: Milestones, readiness, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a mature private platform preparing for public-market scrutiny rather than an
              early-stage application. A $110 million financing in 2020, the 2023 CEO transition, a reported $2.2
              billion May 2025 financing valuation, later finance and board appointments, and a confidential draft S-1
              in February 2026 form a coherent readiness arc. It is not an IPO timetable: Forge notes that Strava had
              not announced offering size or timing and that the reported spring 2026 window passed. The evidence also
              preserves a material adverse thread. Independent summaries document repeated location-data exposure
              concerns, including a 2025 investigation involving French submariners. Strava's own terms warn that
              geolocation use carries safety and security risks. Audited revenue, paid subscribers, margins, burn,
              current headcount, complete financing terms, and governance rights therefore remain priority diligence
