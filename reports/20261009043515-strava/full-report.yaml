  - id: TV001
    title: Strava Recommendation Summary
    columns:
      - Dimension
      - Status / Stance
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Draft S-1 confidentially filed; audited financial statements and unit economics remain undisclosed
        - Defer primary commitment until S-1 prospectus becomes publicly available
      - - Confidence
        - medium
        - Corroborated valuation mark ($2.2B) and revenue scale (~$500M ARR), but private margin profile
        - Size exposure cautiously; verify secondary market transfer restrictions and ROFR
      - - Risk Rating
        - high
