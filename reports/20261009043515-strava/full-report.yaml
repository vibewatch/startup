        - Require downside protection and review liquidation preferences in late-stage series
      - - Valuation Stance
        - stretched
        - 4.4x reported revenue multiple amidst fitness tech multiple compression and uncertain net margins
        - Avoid bidding above secondary trading marks ($13.99-$14.35) without audited financials
