        title: Leadership, governance, and capital
        blocks:
          - type: paragraph
            body: >-
              Michael Martin has led Strava since December 2023 after the second departure of co-founder Michael
              Horvath, making the current operating model less founder-dependent than its earlier leadership cycles.
              Third-party reporting identifies Matt Anderson as chief financial officer from September 2025 and Barry
              McCarthy as a board addition in January 2026; both appointments add public-company experience, although
              the assigned evidence does not disclose the full board, voting control, or executive succession plan.
              Capital history is less settled than headline precision suggests. The 2020 Series F is reported at $110
              million, while one database totals disclosed funding at $180 million through 2020 and Forge reports
              roughly $230 million after a May 2025 financing. The discrepancy likely reflects different round coverage,
