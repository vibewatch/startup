  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Demographic Profile
        blocks:
          - type: paragraph
            body: >-
              Strava segments its addressable active audience across three primary customer categories: free community
              athletes, paid premium subscribers, and commercial enterprise brand partners. The broad consumer base
              spans over 180 million registered athletes globally in more than 185 countries, representing a diverse
              athletic pyramid ranging from casual daily walkers to competitive endurance athletes. In the United
              States, user demographic research reveals broad ethnic representation across active participants, led by
              white users at 42%, Black athletes at 32%, Hispanic users at 20%, and other demographic groups at 6%. The
              company's historical foundation in core endurance cycling has progressively diversified into running,
              hiking, walking, and multi-sport training routines. Strava's consumer engagement strategy leverages
              motivational profiles—spanning progress-oriented individuals, social community seekers, and competitive
              athletes—to personalize onboarding flows and drive platform habituation. Meanwhile, commercial enterprise
              customers engage via Strava for Business to tap into targeted, athletic-minded audiences through sponsored
              challenges, verified clubs, and branded segment activations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
