  - id: FU001
    title: Strava customer lifecycle and expansion journey map
    type: journey-map
    summary: >-
      Visual map tracing the progression of athletes and commercial partners through acquisition, daily habituation,
      premium conversion, and enterprise brand loops.
    data:
      items:
        - label: Organic Acquisition & Social Onboarding
          stage: Organic Acquisition & Social Onboarding
          touchpoints:
            - Free mobile app download via app stores
            - Social referral from active peer or club invite
            - Hardware device sync onboarding (Garmin, Apple Watch, Polar)
          actors:
            - Casual Runners & Cyclists
            - Everyday Walkers
          challenges:
            - Friction in connecting external GPS hardware
            - Initial empty social feed before connecting friends
        - label: Daily Activity Habituation & Social Feedback
          stage: Daily Activity Habituation & Social Feedback
          touchpoints:
            - Activity recording and GPS tracking
            - Kudos and comments from local club members
            - Participation in open brand challenges (e.g., Mars IAMS Pet Tag)
          actors:
            - Active Free Athletes
            - Local Club Organizers
          challenges:
            - Maintaining workout consistency
            - Avoiding leaderboard fatigue from vehicle or GPS errors
        - label: Subscriber Conversion & Performance Analytics
          stage: Subscriber Conversion & Performance Analytics
          touchpoints:
            - Paywall prompt for deep segment leaderboards
            - Free trial activation for Athlete Intelligence AI insights
            - Power Insights and custom route planning tools
          actors:
            - Performance-Oriented Athletes
            - Endurance Competitors
          challenges:
            - Justifying annual subscription fee against free alternatives
            - Subscription price increases and auto-renewal policies
        - label: Commercial Brand Activation & Partner Flywheel
          stage: Commercial Brand Activation & Partner Flywheel
          touchpoints:
            - Strava for Business sponsored challenge gallery
            - Brand club creation and community messaging
            - Segment-based rewards and physical store visits (Chipotle)
          actors:
            - Brand Marketing Executives
            - Enterprise Sponsors
          challenges:
            - Attributing direct ROI from sponsored challenges
            - Navigating community backlash against overly intrusive advertising
        - label: Enterprise Municipal & Civic Integration
          stage: Enterprise Municipal & Civic Integration
          touchpoints:
            - Strava Metro public dataset onboarding
            - City transportation department commute analysis
            - Active transit infrastructure advocacy and bike lane planning
          actors:
            - Urban Transportation Planners
            - Municipal Transit Authorities
          challenges:
            - Integrating proprietary GPS telemetry with city GIS systems
            - Addressing data representativeness across casual non-enthusiast commuters
        - label: Long-Term Retention & Ecosystem Lock-In
          stage: Long-Term Retention & Ecosystem Lock-In
          touchpoints:
            - Multi-year historical activity record archive
            - Annual Year in Sport personalized recap delivery
            - Cumulative club memberships and trophy case achievements
          actors:
            - Long-Term Core Subscribers
            - Veteran Athletes
          challenges:
            - Switching costs when changing GPS hardware ecosystems
            - Managing subscription price hikes over multi-year cycles
    approximationNotes: >-
      Journey touchpoints and stage progressions synthesized from Strava onboarding flows, published product terms, and
      Strava for Business partner architecture.
