  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Matrix
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis / Downside Risk
      - Thesis-Break Trigger
    rows:
      - - Network Scale & Moat
        - Over 150M-200M athletes across 185 countries create unmatched behavioral data asset and community moat
        - Low active-to-paid conversion leaves core infrastructure vulnerable to escalating hosting costs
        - Growth in active users stalling or MAU contraction in core running/cycling segments
      - - Revenue Quality & Growth
        - Approaching $500M ARR with premium expansion into Runna coaching and corporate Metro data
        - Top-line figures are unaudited management estimates; recurring retention rates remain unverified
        - YoY revenue growth deceleration below 10% or reported contraction in subscription ARR
      - - Market Positioning
        - Asset-light digital software avoids post-pandemic hardware collapse suffered by Peloton and connected fitness
        - Consumer fitness app market faces intense platform competition from Apple Fitness+ and Garmin
        - Ecosystem restrictions trigger widespread athlete defection to alternative platforms
      - - Capital Structure & Exit
        - Backed by Sequoia and TCV at $2.2B with experienced IPO leadership bench and confidential S-1 filing
        - Subordinated common stock holders face potential overhang from undisclosed debt and liquidation preferences
        - Formal withdrawal of confidential IPO registration or significant down-round secondary pricing
    notes: Synthesis of investment arguments and risk triggers based on private market evaluations and competitor dynamics.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV013
  - id: TV003
    title: Strava Valuation Scenario Analysis
    columns:
      - Scenario
      - Revenue Assumption
      - Implied Multiple
      - Valuation Range
      - Key Drivers & Catalysts
      - Probability Signal
    rows:
      - - Bull Case
        - $650M+ ARR
        - 5.0x - 6.0x
        - $3.2B - $3.9B
        - Accelerated premium AI training tier adoption, international ARPU expansion, successful IPO execution
        - 25%
      - - Base Case
        - $500M - $550M ARR
        - 4.0x - 4.5x
        - $2.0B - $2.4B
