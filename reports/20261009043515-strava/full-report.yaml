chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and scale
        blocks:
          - type: paragraph
            body: >-
              Strava began in 2009 and is consistently identified as a San Francisco company founded by Mark Gainey and
              Michael Horvath. The product combines exercise tracking with a social network: users record activities
              from phones or connected devices, share them, and interact through features such as kudos, clubs, routes,
              segments, and performance analysis. The commercial structure is freemium rather than enterprise SaaS;
              Strava's terms distinguish free from subscription-only features and permit prices and feature availability
              to change. Scale is substantial but company-issued: the December 2025 Year in Sport release said the
              service had over 180 million users in more than 185 countries, generated 14 billion kudos during 2025, and
              reached one million clubs. These are registered-community and engagement measures, not paying-customer,
              subscription-revenue, or retention disclosures.
