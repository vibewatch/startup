              - CU006
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption Trajectory and Engagement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum on Strava reflects both organic network effects and systematic feature rollouts that
              deepen athlete engagement. Platform telemetry demonstrates high participation in performance analysis,
              with 29% of tracked rides and runs utilizing the Power Insights analytical tool as of September 2025.
              Group fitness activities grew 13% year-over-year in 2024, supported by active club interactions and over
              14 billion kudos exchanged annually across the network. Furthermore, 43% of active athletes surveyed
              stated plans to complete a major endurance event or race, demonstrating durable engagement among
              goal-oriented users. Strava's deployment of proprietary machine learning mechanisms, including Athlete
              Intelligence analyzing 57 distinct behavioral factors to eliminate vehicle-flagged activities, reduced
              disputed segment results by 38% and vehicle-tagged anomalies by 72%. These platform integrity investments
              protect competitive value for subscribers. However, while total registrations and top-line activity
              volumes are heavily publicized, exact figures for daily active users, monthly active users, and paying
              subscriber conversion percentages remain undisclosed.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Commercial Partnerships, Contract Durability, and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial brand monetization operates via Strava for Business, which offers corporate sponsors
              non-intrusive, engagement-driven marketing channels. Major consumer brands including Mars IAMS and
              Chipotle execute branded challenges and segment competitions that reward physical participation with
              digital badges or physical incentives. For instance, the 2026 Mars IAMS collaboration introduced dedicated
              Pet Tag logging for dog-walking athletes, bridging commercial brand objectives with community activity
              tracking. Device manufacturers like Polar and Garmin integrate hardware data into user uploads, driving
              passive brand exposure through gear lists. On the consumer subscription front, Strava's terms of service
              establish auto-renewing periodic billing with strict no-refund policies, unilateral pricing modification
              rights, and mandatory arbitration waivers with class action bans. Despite high self-reported satisfaction
              with premium capabilities like Athlete Intelligence, Strava does not publicly disclose cohort churn rates,
              annual contract values for enterprise partners, or net revenue retention, creating a key diligence void
              ahead of public market scrutiny.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demographic and Motivational Breadth
            body: >-
              Strava's expansion beyond elite cyclists into casual runners and daily pet walkers has expanded its
              top-of-funnel reach to over 180 million athletes, yet this broad demographic creates distinct motivational
              tiers that require careful product personalization.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: The Private Retention Black Box
            body: >-
              While Strava reports accelerating user growth and approaching $500M in ARR, the company strictly withholds
              core SaaS metrics such as net revenue retention, subscriber cohort churn, and paying user conversion
              rates, leaving commercial durability unverified.
            calloutType: risk
            claimRefs:
              - CU003
              - CU007
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk hierarchy and residual exposure
        blocks:
          - type: paragraph
            body: >-
              Location-data exposure is the clearest high-severity risk in the allocated evidence. A secondary
              chronology records multiple episodes involving military sites, security personnel, public figures, and
              remote-area home-location inference, while Strava's own terms say adult content is public by default
              unless a user changes privacy controls. That combination makes user configuration part of the control
              environment rather than a complete platform-level safeguard. The risk is amplified by Strava's
              company-reported scale of more than 100 million active people. The heatmap therefore ranks privacy above
              availability, ecosystem, integrity, monetization, and AI-safety exposures; these ordinal ratings are
              analyst judgments, not measured incident probabilities.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
