        - 50%
      - - Bear Case
        - <$450M ARR
        - 2.0x - 2.5x
        - $0.9B - $1.1B
        - Subscriber churn following price increases, macroeconomic discretionary pullback, IPO window delay
        - 25%
    notes: Scenario multiples benchmarked against late-stage software and consumer subscription technology multiples.
