      - number: '5.2'
        title: Integration Surface and Architecture Evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest technical evidence is at the boundary, not inside Strava's production environment. Strava
              describes V3 as a public, stable API used by its own mobile apps and says thousands of developers build
              applications with Strava data. Its terms separately identify connections to services such as Apple Health
              and Garmin Connect, along with sponsor, media-streaming, and tracking-device integrations. Independent
              development vendors consistently identify GPS accuracy, sensor ingestion, social interaction, privacy, and
              scale as important requirements for a Strava-like product. Those guides are useful for framing diligence
              questions, but they are not evidence that Strava itself uses the databases, queues, microservices, cloud
              providers, or deployment patterns those vendors recommend.
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
