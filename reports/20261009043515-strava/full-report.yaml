              - CR016
      - number: '7.2'
        title: Legal, regulatory, and user-safety exposure
        blocks:
          - type: paragraph
            body: >-
              Strava's terms establish a multi-jurisdiction posture: Strava Ireland serves EU and EEA users, adult
              content is public by default, users retain responsibility for geolocation choices, and the company directs
              EU users to Digital Services Act information. The same terms frame AI outputs as fallible and preserve
              pricing and auto-renewal discretion. These provisions identify relevant privacy, platform, consumer, and
              product-safety obligations, but contractual allocation of risk is not evidence that controls are effective
              or that regulators accept the posture. The assigned pool contains no regulator order, court docket,
              independent compliance audit, or current litigation inventory; the register is therefore explicitly
              partial and requires counsel-led confirmation.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
