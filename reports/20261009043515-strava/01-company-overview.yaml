company:
  name: Strava
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Strava is a San Francisco-based, freemium social-fitness platform founded in 2009 whose
    company-issued 2025 materials report more than 180 million users across more than 185
    countries. Its leadership and IPO preparation are visible, but audited economics,
    current headcount, ownership, and even cumulative funding remain private or disputed.
sections:
  - id: identity-product-and-scale
    title: Identity, product, and scale
    body: >-
      Strava began in 2009 and is consistently identified as a San Francisco company founded
      by Mark Gainey and Michael Horvath. The product combines exercise tracking with a social
      network: users record activities from phones or connected devices, share them, and
      interact through features such as kudos, clubs, routes, segments, and performance
      analysis. The commercial structure is freemium rather than enterprise SaaS; Strava's
      terms distinguish free from subscription-only features and permit prices and feature
      availability to change. Scale is substantial but company-issued: the December 2025
      Year in Sport release said the service had over 180 million users in more than 185
      countries, generated 14 billion kudos during 2025, and reached one million clubs.
      These are registered-community and engagement measures, not paying-customer,
      subscription-revenue, or retention disclosures.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-governance-and-capital
    title: Leadership, governance, and capital
    body: >-
      Michael Martin has led Strava since December 2023 after the second departure of
      co-founder Michael Horvath, making the current operating model less founder-dependent
      than its earlier leadership cycles. Third-party reporting identifies Matt Anderson as
      chief financial officer from September 2025 and Barry McCarthy as a board addition in
      January 2026; both appointments add public-company experience, although the assigned
      evidence does not disclose the full board, voting control, or executive succession
      plan. Capital history is less settled than headline precision suggests. The 2020
      Series F is reported at $110 million, while one database totals disclosed funding at
      $180 million through 2020 and Forge reports roughly $230 million after a May 2025
      financing. The discrepancy likely reflects different round coverage, so neither total
      should be treated as definitive without a company cap table.
    claimRefs: [CO002, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002, TO003]
  - id: milestones-readiness-and-diligence
    title: Milestones, readiness, and diligence implications
    body: >-
      The milestone sequence shows a mature private platform preparing for public-market
      scrutiny rather than an early-stage application. A $110 million financing in 2020,
      the 2023 CEO transition, a reported $2.2 billion May 2025 financing valuation, later
      finance and board appointments, and a confidential draft S-1 in February 2026 form a
      coherent readiness arc. It is not an IPO timetable: Forge notes that Strava had not
      announced offering size or timing and that the reported spring 2026 window passed.
      The evidence also preserves a material adverse thread. Independent summaries document
      repeated location-data exposure concerns, including a 2025 investigation involving
      French submariners. Strava's own terms warn that geolocation use carries safety and
      security risks. Audited revenue, paid subscribers, margins, burn, current headcount,
      complete financing terms, and governance rights therefore remain priority diligence
      requests before valuation work treats the public scale narrative as investable
      financial proof.
    claimRefs: [CO001, CO008, CO009, CO010, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
