callouts:
  - calloutType: risk
    title: Scale is not audited monetization
    body: >-
      More than 180 million users and 14 billion annual kudos demonstrate reach and
      engagement, but they do not disclose paid subscribers, revenue, margins, retention,
      cash generation, or runway. The confidential filing is the most credible path to
      reconciling those missing economics.
    claimRefs: [CO005, CO006, CO015]
