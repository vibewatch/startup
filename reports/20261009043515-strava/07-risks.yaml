        Audited revenue, paid-subscriber cohorts, conversion, churn, gross margin, cash,
        operating cash flow, burn, debt service, and runway as of the run date.
      whyItMatters: >-
        Reported profitability is not cash availability, and financial capacity determines
        whether Strava can fund remediation, integrations, acquisitions, and listing readiness.
      diligencePath: >-
        Obtain audited statements, monthly cohort tables, bank and debt schedules, a
        24-month cash bridge, and board-approved operating plan; reconcile each to the cap table.
