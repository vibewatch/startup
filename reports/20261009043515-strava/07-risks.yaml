      - Evidence
      - Likelihood
      - Impact
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Sensitive location inference
        - Multiple historical cases in secondary chronology
        - High
        - High
        - Developing
        - High
        - Current incident rate, detection coverage, and default-control effectiveness
      - - Platform or feature interruption
        - Terms do not warrant uninterrupted, secure, or error-free service
        - Medium
        - High
        - Unknown
        - Medium to high
        - Availability history, recovery objectives, status metrics, and disaster-recovery tests
      - - Activity and leaderboard manipulation
        - Historical reports of fake or motorized activities; authenticity rules permit suspension
        - High
        - Medium
        - Developing
        - Medium
        - Fraud prevalence, review latency, false-positive rate, and appeals outcomes
      - - Third-party client mishandles API data
        - One external project documented unsafe trust in its own parsed response handling
        - Medium
        - Medium
        - Limited outside Strava's direct control
        - Medium
