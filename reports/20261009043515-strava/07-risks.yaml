      - - AI-assisted training and health-adjacent representations
        - Global
        - Terms state AI can make mistakes and place use risk on the user
        - Medium
        - High
        - Contractual warnings and user-judgment language
        - Medium to high because model validation evidence is absent
        - Review model cards, safety testing, escalation policy, claim review, and adverse-event process
    notes: >-
      Partial register based only on allocated public terms and secondary reporting; likelihood,
      impact, and residual labels are qualitative analyst assessments, not quantified probabilities
      or confirmed enforcement outcomes.
    enumerationScope:
