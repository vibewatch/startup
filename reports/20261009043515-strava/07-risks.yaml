artifact: risks
slug: strava
runDate: 2026-10-09
company:
  name: Strava
chapter:
  number: 7
  title: Risks
  summary: >-
    Location privacy is the leading residual risk because the evidence records repeated
    exposure episodes while Strava's principal public mitigations remain user-controlled
    privacy settings and guidance. Subscription conversion, third-party ecosystem
    dependence, service reliability, activity integrity, and AI-assisted training safety
    are material but less evidenced, so the investment decision still requires private
    control, incident, retention, concentration, and liquidity data.
sections:
  - id: risk-hierarchy
    title: Risk hierarchy and residual exposure
    body: >-
      Location-data exposure is the clearest high-severity risk in the allocated evidence.
      A secondary chronology records multiple episodes involving military sites, security
      personnel, public figures, and remote-area home-location inference, while Strava's
      own terms say adult content is public by default unless a user changes privacy
      controls. That combination makes user configuration part of the control environment
      rather than a complete platform-level safeguard. The risk is amplified by Strava's
      company-reported scale of more than 100 million active people. The heatmap therefore
      ranks privacy above availability, ecosystem, integrity, monetization, and AI-safety
      exposures; these ordinal ratings are analyst judgments, not measured incident
      probabilities.
    claimRefs: [CR002, CR003, CR004, CR015, CR016]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and user-safety exposure
    body: >-
      Strava's terms establish a multi-jurisdiction posture: Strava Ireland serves EU and
      EEA users, adult content is public by default, users retain responsibility for
      geolocation choices, and the company directs EU users to Digital Services Act
      information. The same terms frame AI outputs as fallible and preserve pricing and
      auto-renewal discretion. These provisions identify relevant privacy, platform,
      consumer, and product-safety obligations, but contractual allocation of risk is not
      evidence that controls are effective or that regulators accept the posture. The
      assigned pool contains no regulator order, court docket, independent compliance
      audit, or current litigation inventory; the register is therefore explicitly
      partial and requires counsel-led confirmation.
    claimRefs: [CR002, CR003, CR010, CR011, CR012]
    tableRefs: [TR001]
  - id: operations-security-integrity
    title: Operational, security, and integrity risks
    body: >-
      Strava spans mobile, web, GPS tracking, route planning, social features, safety
      tooling, and device synchronization. That breadth creates a broad reliability and
      data-quality surface even though no current outage frequency or service-level
      evidence was allocated. The help center documents dedicated security and privacy
      support, while the terms disclaim uninterrupted or error-free operation. Historical
      reporting also describes leaderboard manipulation, and the terms require authentic
      activities and permit account suspension. A third-party developer issue illustrates
      a separate integration-quality hazard: its own client trusted parsed Strava responses
      without adequate validation. That is not evidence of a Strava-side vulnerability,
      but it supports diligence on SDK contracts, payload bounds, and partner test
      discipline.
    claimRefs: [CR005, CR009, CR010, CR013]
    tableRefs: [TR002]
  - id: dependencies-financial-kill-criteria
    title: Dependencies, model risk, and thesis-break triggers
    body: >-
      Device and application connectivity is central to the experience: Strava's support
      page names Garmin and Apple Watch, its terms place connected services under third
      parties' own policies, and even the company-issued app-install link depends on an
      SMS delivery flow. Public evidence does not quantify concentration by device maker,
      app store, payment rail, cloud provider, data partner, or sponsor. Financial
      resilience is similarly under-disclosed. One independent analyst describes
      free-to-premium conversion as a persistent structural concern, but the pool does not
      contain audited subscriber cohorts, churn, margin, cash, burn, or runway. Thesis
      breaks should therefore be tied to a material repeat privacy event, sustained sync
      degradation, weakening paid conversion or retention, or evidence that liquidity
      cannot fund remediation and public-company readiness.
    claimRefs: [CR006, CR007, CR008, CR014, CR015]
    tableRefs: [TR003]
