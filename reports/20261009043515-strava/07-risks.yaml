    claimRefs: [CR004, CR005, CR009, CR010, CR013, CR015]
  - id: TR003
    title: Partner, dependency, and financial-model risk register
    columns:
      - Dependency
      - Counterparty or surface
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - Activity-device synchronization
        - Garmin, Apple Watch, and other connected devices
        - Activity capture and data import
        - Not disclosed
        - Sync degradation reduces product utility and trust
        - High
        - Troubleshooting and support content
        - Medium to high
      - - Third-party applications and policies
        - Connected apps, plugins, sponsors, and tracking devices
        - Login, data exchange, and integrated features
        - Not disclosed
        - Policy, API, or privacy changes impair integrations
        - High
        - Contractual allocation to third-party terms
        - High
      - - Mobile distribution and messaging
        - App stores and SMS delivery
        - Installation, authentication, and subscription access
        - Not disclosed
        - Store-policy, fee, or message-delivery changes add friction
        - Medium
        - Alternative web presence; no quantified contingency disclosed
        - Medium
      - - Paid conversion and liquidity
        - Free users, subscribers, and prospective public investors
        - Funds product investment, remediation, and listing readiness
        - Subscriber cohorts, burn, cash, and runway not disclosed in the pool
        - Weak conversion or retention constrains remediation and valuation support
        - High
        - Analyst reports profitability, but audited support is absent
        - High pending private financial evidence
    notes: >-
      Dependency concentration and financial resilience are unquantified in the assigned evidence;
      severity is qualitative and reported profitability is not treated as cash availability.
    claimRefs: [CR006, CR007, CR008, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Ordinal comparison of six risk families using observed exposure, disclosed controls,
      and evidence gaps rather than numerical loss probabilities.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
      rows:
        - label: Location privacy and sensitive-person exposure
          values: [High, High, Developing]
        - label: Platform reliability and feature continuity
          values: [High, Medium, Unknown]
        - label: Third-party ecosystem dependence
          values: [High, Medium, Limited]
        - label: Activity integrity and moderation
          values: [Medium, High, Developing]
        - label: Paid conversion and IPO execution
          values: [High, Medium, Limited]
        - label: AI-assisted training safety
          values: [High, Medium, Contractual]
    approximationNotes: >-
      Qualitative analyst ratings only; no allocated source supplies normalized incident,
      loss, uptime, churn, or control-effectiveness denominators.
    claimRefs: [CR003, CR004, CR006, CR010, CR011, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Pause or reject the investment if diligence shows a material repeat location-data
      exposure without verified remediation, sustained device-sync degradation without
      recoverability, deteriorating paid conversion or retention, or insufficient liquidity
      to fund privacy, reliability, and public-company controls.
    claimRefs: [CR004, CR014, CR015]
  - calloutType: recommendation
    title: Immediate diligence priority
    body: >-
      Require an incident chronology, privacy-control test results, third-party dependency
      map, subscriber cohorts, and a cash-and-runway bridge before relying on reported
      profitability or contractual risk allocation.
    claimRefs: [CR006, CR010, CR014]
