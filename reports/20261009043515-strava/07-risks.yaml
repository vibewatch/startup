      - Diligence path
    rows:
      - - Location privacy and sensitive-person exposure
        - Global
        - Repeated historical exposure reporting; current enforcement status not established
        - High
        - High
        - User privacy controls and explicit geolocation warnings
        - High because protection depends partly on user configuration
        - Obtain privacy impact assessments, incident log, default-setting tests, and regulator correspondence
      - - EU platform and content-governance duties
        - EU and EEA
        - Terms identify Strava Ireland and point users to Digital Services Act information
        - Medium
        - High
        - Published terms and reporting/appeal mechanisms
        - Unknown without independent compliance testing
        - Review DSA transparency reports, legal memos, moderation metrics, and Irish regulator correspondence
      - - Subscription pricing and renewal conduct
        - Multi-jurisdiction
        - Terms allow price changes after notice and describe automatic renewal
        - Medium
        - Medium
        - Notice, cancellation, and some cooling-off language
        - Medium; complaint and refund rates are not public
