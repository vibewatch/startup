  topStrengths:
    - Large global user network with 180M+ registered athletes and strong engagement signals
    - Clear premium monetization surface through subscriptions, family-style plans, and adjacent bundles
    - >-
      Broad ecosystem depth across devices, training apps, and developer integrations that reinforces product utility
      and habit formation
    - >-
      Strategic optionality from training-led expansion, international growth, and potential future public-market
      outcomes
  topRisks:
    - >-
      Privacy and location-data exposure remain structurally tied to the product's core sharing model and could trigger
      regulatory or trust damage
    - >-
      Partner and platform dependence on sync rails, API governance, and device ecosystems can disrupt user experience
      or downstream ecosystem value
    - >-
      Public disclosures still omit paid-subscriber quality, churn, gross margin, cash generation, and capital-stack
      seniority, limiting underwriting confidence
    - >-
      The last reported $2.2B valuation already implies premium consumer-subscription multiples with limited room for
      execution error
  unresolvedGaps:
