companyProfile:
  summary: >-
    Strava is a San Francisco-based social fitness platform founded in 2009 by Michael Horvath and Mark Gainey. The
    company has evolved from activity tracking into a broad social fitness network spanning activity capture, analysis,
    route planning, clubs, challenges, premium analytics, and integrations with a large device and developer ecosystem.
    Public disclosures show the platform reaching more than 180 million registered athletes and roughly 195 million by
    the current evidence pool's upper bound, while management positions the company as a premium subscription and
    training platform rather than a pure tracking app.
  foundedDate: '2009-01-01'
  founders:
    - name: Michael Horvath
      role: Co-founder
      background: Former Strava chief executive who stepped back after the 2023 leadership transition.
      claimRefs:
        - CO002
    - name: Mark Gainey
      role: Co-founder
      background: Co-founded Strava with Horvath around a social and competitive fitness thesis.
      claimRefs:
        - CO002
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Strava sells a freemium mobile and web fitness platform centered on activity tracking, social sharing, clubs,
    leaderboards, route discovery, training analysis, and premium coaching-adjacent features. Paid plans add deeper
    analytics, route tools, AI-enabled insights, family-style or adjacent bundles, and a sizable third-party API
    ecosystem.
  customerFocus: >-
    Consumers who run, ride, hike, walk, and train across endurance and active-lifestyle categories, plus adjacent
    partners such as brand marketers and device/app ecosystem partners.
  businessModel: >-
    Primarily consumer subscription revenue, supplemented by sponsored challenges, ecosystem partnerships, and adjacent
    commercial offerings.
  stage: Late-stage private platform business with a reported 2025 financing valuation of $2.2B and later debt financing.
  fundingStatus: >-
    Reported May 2025 Series F-1 at a $2.2B valuation led by Sequoia, followed by a June 2025 debt round of undisclosed
    size.
