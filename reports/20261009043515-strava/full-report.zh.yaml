        - 聚合且去标识化的地理空间移动模式、通勤流量分析（原为付费 Strava Metro）
        - 实时车辆 GPS 遥测、个人私密行程追踪、专有调查研究
        - 市交通部门、区域城市规划委员会、倡议组织
