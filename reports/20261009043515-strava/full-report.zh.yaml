      - number: '7.2'
        title: 法律、监管与用户安全暴露
        blocks:
          - type: paragraph
            body: >-
              Strava 条款建立了多司法辖区运营框架：Strava Ireland 服务欧盟和欧洲经济区用户，成年内容默认公开，用户自行负责地理定位选择，公司引导欧盟用户查看《数字服务法》信息。相同条款把 AI
              输出描述为可能出错，并保留定价与自动续期裁量。这些条款指出相关的隐私、平台、消费者和产品安全义务，但合同中的风险分配并不能证明控制有效，也不能证明监管机构接受该做法。现有证据池没有监管命令、法院案卷、独立合规审计或当前诉讼清单，因此登记表明确不完整，需要律师主导确认。
