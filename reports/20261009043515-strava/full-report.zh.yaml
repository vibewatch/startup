  - id: FU001
    title: Strava 客户生命周期与扩张旅程图
    type: journey-map
    summary: 可视化展示运动者和商业伙伴从获客、日常习惯养成、升级付费到企业品牌循环的推进路径。
    data:
      items:
        - label: 自然获客与社交引导
          stage: 自然获客与社交引导
          touchpoints:
            - 通过应用商店免费下载移动应用
            - 活跃同伴推荐或俱乐部邀请带来的社交引荐
            - 硬件设备同步引导（Garmin、Apple Watch、Polar）
          actors:
            - 休闲跑者与骑行者
            - 日常步行者
          challenges:
            - Friction in connecting external GPS hardware
            - Initial empty social feed before connecting friends
        - label: 日常活动习惯养成与社交反馈
          stage: 日常活动习惯养成与社交反馈
          touchpoints:
            - 活动记录与 GPS 追踪
            - 本地俱乐部成员的 kudos 和评论
            - 参加公开品牌挑战（例如 Mars IAMS Pet Tag）
          actors:
            - 活跃免费运动者
            - 本地俱乐部组织者
          challenges:
            - Maintaining workout consistency
            - Avoiding leaderboard fatigue from vehicle or GPS errors
        - label: 订阅转化与表现分析
          stage: 订阅转化与表现分析
          touchpoints:
            - 深度分段排行榜的付费墙提示
            - 激活 Athlete Intelligence AI 洞察免费试用
            - Power Insights 和自定义路线规划工具
          actors:
            - 追求表现的运动者
            - 耐力项目参赛者
          challenges:
            - Justifying annual subscription fee against free alternatives
            - Subscription price increases and auto-renewal policies
        - label: 商业品牌激活与伙伴飞轮
          stage: 商业品牌激活与伙伴飞轮
          touchpoints:
            - Strava for Business 赞助挑战展示库
            - 创建品牌俱乐部并进行社区消息互动
            - 基于分段的奖励与实体门店到访（Chipotle）
          actors:
            - 品牌营销高管
            - 企业赞助商
          challenges:
            - Attributing direct ROI from sponsored challenges
            - Navigating community backlash against overly intrusive advertising
        - label: 企业、市政与公民事务整合
          stage: 企业、市政与公民事务整合
          touchpoints:
            - 接入 Strava Metro 公共数据集
            - 城市交通部门通勤分析
            - 倡导活跃交通基础设施并规划自行车道
          actors:
            - 城市交通规划者
            - 市政交通管理机构
          challenges:
            - Integrating proprietary GPS telemetry with city GIS systems
            - Addressing data representativeness across casual non-enthusiast commuters
        - label: 长期留存与生态锁定
          stage: 长期留存与生态锁定
          touchpoints:
            - 多年历史活动记录存档
            - 每年发送个性化 Year in Sport 回顾
            - 累计俱乐部会员资格与奖杯柜成就
          actors:
            - 长期核心订阅用户
            - 资深运动者
          challenges:
            - Switching costs when changing GPS hardware ecosystems
            - Managing subscription price hikes over multi-year cycles
    approximationNotes: 旅程触点和阶段推进综合自 Strava 引导流程、公开产品条款及 Strava for Business 合作伙伴架构。
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU009
      - CU010
      - CU011
