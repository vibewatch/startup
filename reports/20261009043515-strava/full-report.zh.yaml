  - id: FE001
    title: 有公开证据支持的产品架构
    type: stack
    summary: 该架构将已验证的接口和控制，与其背后尚未验证的内部实现分开。
    data:
      layers:
        - label: 移动端与网页接口
          detail: 记录活动，并提供规划、分析、分享和发现工作流
        - label: 活动分析与安全
          detail: 生成训练指标，并支持 Beacon 与最多三个联系人共享位置
        - label: 社交与发现界面
          detail: 展示分段、路线、地图、俱乐部、挑战和赛事路线
        - label: V3 API 边界
          detail: 提供 Strava 移动应用和外部开发者使用的公开稳定接口
        - label: 第三方生态
          detail: 按各自条款连接外部健身、媒体、赞助商和追踪设备服务
        - label: 数据与治理控制
          detail: 应用隐私选择、个性化输入、API 限制及 AI 相关用户警告
    approximationNotes: 概念性证据栈由公开产品、开发者和法律界面组成；有意不对数据库、服务、云基础设施或数据流作推断。
