    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与规模
        blocks:
          - type: paragraph
            body: >-
              Strava 于 2009 年成立，一贯被认定为由 Mark Gainey 和 Michael Horvath
              创立的旧金山公司。产品把运动记录与社交网络结合起来：用户从手机或联网设备记录活动，分享内容，并通过鼓励、俱乐部、路线、分段和表现分析等功能互动。商业模式是免费增值，而不是企业 SaaS；Strava
              的条款区分免费功能与仅限订阅的功能，并允许调整价格和功能可用性。规模很大，但数据来自公司自身：2025 年 12 月的 Year in Sport 发布称，服务已覆盖超过 185 个国家的 1.8 180m
              多用户，2025 年产生 14b kudos，并达到 100 万个俱乐部。这些是注册社区和参与度指标，不是付费客户、订阅收入或留存披露。
