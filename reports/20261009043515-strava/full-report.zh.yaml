      - number: '7.4'
        title: 依赖、模型风险与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              设备和应用连接是体验核心：Strava 支持页点名 Garmin 和 Apple
              Watch，条款把联网服务置于第三方自身政策之下，甚至公司提供的应用安装链接也依赖短信发送流程。公开证据没有量化设备制造商、应用商店、支付渠道、云服务商、数据伙伴或赞助商的集中度。财务韧性同样披露不足。一名独立分析师把免费转高级转化描述为持续的结构性担忧，但证据池没有经审计的订阅者群组、流失、利润率、现金、消耗或
              runway 数据。因此，论点失效应与重大且重复的位置隐私事件、同步持续恶化、付费转化或留存走弱，或流动性不足以资助整改和上市准备的证据挂钩。
