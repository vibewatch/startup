      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 轻资产社区模式，让 Strava 与硬件健身平台的崩塌区分开来
            body: >-
              2021-2024 年，资本密集型联网硬件厂商 Peloton、Tonal 等相继崩塌，成为健身科技市场的主旋律；Strava
              的估值则建立在韧性更强的订阅软件基础上。轻资产基础设施、社区网络效应和专有行为数据资产，让 Strava 在数字体育科技中占据独特位置。
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
          - type: callout
            title: 未经审计的订阅单元经济学，使估值对假设高度敏感
            body: Strava 估值 $2.2B、收入倍数约 4.4 倍，较整体消费互联网基准有溢价。由于没有经审计的披露来确认获客成本、毛利率和净收入留存率，一旦增长放缓，当前估值就可能面临倍数压缩。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV016
