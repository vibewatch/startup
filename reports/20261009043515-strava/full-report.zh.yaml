  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从全球数字健身逐层收窄至 Strava 核心付费订阅用户的市场规模金字塔。
    data:
      items:
        - label: 全球联网健康与可穿戴设备 TAM
          value: 238
          unit: USD B
          detail: Nelson Advisors / 行业对全球可穿戴科技和联网健康生态的估计（2026 年）。
          tone: neutral
        - label: 全球活跃运动人口
          value: 500
          unit: M athletes
          detail: 覆盖 190 多个国家的经常耐力运动及户外活跃生活方式参与者总体规模。
          tone: neutral
        - label: Strava 全球注册网络
          value: 200
          unit: M registered
          detail: 截至 2026 年，全球 185 多个国家累计注册用户账户的报道规模。
          tone: positive
        - label: 月活跃网络（MAU）
          value: 50
          unit: M MAU
          detail: Sensor Tower / FT 估计的月活跃运动用户群，他们使用活动追踪和信息流。
          tone: positive
        - label: Strava 目标付费订阅用户（SAM）
          value: 10
          unit: M potential
          detail: 估计可触达的高频核心运动者群体，他们对高级分析有较高支付意愿。
          tone: neutral
        - label: 当前核心付费订阅用户群（SOM）
          value: 5
          unit: M paid
          detail: 估计的活跃付费订阅用户，支撑 Strava 接近 $500M 的年度经常性收入运行率。
          tone: positive
    approximationNotes: >-
      全球市场数据源自 Nelson Advisors 对可穿戴健康市场的估计；注册用户规模反映 Strava 披露；MAU 反映 Financial Times/Sensor Tower 的估计；SOM/SAM 是分析师根据报道的
      $500M ARR 和 $79.99/year 订阅定价推导的估计。
    claimRefs:
