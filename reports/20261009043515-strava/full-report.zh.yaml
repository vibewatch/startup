      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Strava 的竞争持久性表现为完全取代的门槛高，但实现功能性多平台使用的门槛低。其主要护城河不是技术架构或算法优势，而是扎根于本地分段排行榜和团体俱乐部动态的双边社交网络效应。KOM/QOM
              排行榜只有在社区同伴和本地竞争者记录同一路段成绩时才有意义，独立竞争者很难复制历史分段深度。此外，Strava 支持通过 GPX、TCX 和 FIT
              文件批量导出数据，避免技术锁定，同时保留关系锁定。不过，Strava 在教练产品上存在结构性弱点：它主要是活动日志和社交展示界面，而不是处方型教练平台；它记录运动员做了什么，却不负责开具适应性训练或恢复方案。随着
              AI 原生教练引擎获得关注，Strava 必须对抗能提供直接训练效用的专业替代方案，守住高级订阅价值。
            claimRefs:
              - CP014
              - CP015
              - CP016
