              功能可能不受支持、可能含错误或设计缺陷，也可能被更改或删除；条款还不保证服务不间断、及时、安全、无错误、准确或可靠。这些法律声明界定客户风险分配，并不能证明可靠性差。现有证据没有独立状态历史、可用性目标、延迟基准、恢复目标或当前路线图，因此运营成熟度仍是重大技术尽调缺口。
