      - number: '2.3'
        title: 买方画像与细分经济
        blocks:
          - type: paragraph
            body: >
              Strava 的多边平台架构服务三个不同的买方和用户群体，每类都有不同的采购触发点、预算归属和价值实现路径。最大的消费者群体是随意运动、关注健康的用户，他们把 Strava
              当作开放的数字社区和社交运动动态，不直接付费。在这层免费消费者之上，是核心经济贡献者：高级运动爱好者。这个个人买方以每年 $79.99
              的订阅个性化训练，动机来自高级表现分析、相对努力评分、路线发现工具和结构化教练计划。

              在消费者核心业务之外，Strava 通过 Strava Business 将企业品牌和组织关系商业化。Chipotle、CLIF Bar
              等消费生活方式和运动营养品牌，拿出数字营销和体验式赞助预算，部署赞助挑战赛和赞助分段，在目标运动人群中推动参与。与此同时，企业雇主和运动俱乐部购买机构团体订阅，为员工福利补贴高级会员。这些层级的预算覆盖个人健身自由支出、企业营销池和人力资源健康福利拨款，为整个网络提供多元化变现渠道。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM003
