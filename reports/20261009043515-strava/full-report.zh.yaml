          - type: callout
            title: 社交图谱与分段深度构成核心防线
            body: 竞争者虽然提供出色的训练工具，但很少能同时拥有 Strava 的本地分段历史、社区排行榜和双向运动员连接，因此用户迁移成本高，多平台使用反而被固化，而不是被彻底取代。
            calloutType: insight
