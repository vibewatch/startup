            body: 如果尽调发现重大且重复的位置数据暴露却没有验证过的整改、设备同步持续恶化且无法恢复、付费转化或留存下滑，或流动性不足以资助隐私、可靠性和上市公司控制措施，应暂停或拒绝投资。
