            body: >-
              Strava 每年 $79.99 的订阅面临两个方向的结构性替代：Garmin Connect 等零边际成本设备平台免费提供更强的生理分析，以及 Nike Run Club
              等企业引流产品不设付费墙却提供指导式教练。
            calloutType: risk
            claimRefs:
              - CP002
