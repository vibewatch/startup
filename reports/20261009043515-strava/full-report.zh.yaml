      - number: '4.2'
        title: 定价架构与市场进入效率
        blocks:
          - type: paragraph
            body: >-
              Strava 的消费者定价采用年度和月度订阅并行的双轨安排，标价已稳定超过五年。在美国，运动员可以每年 $79.99 或按月 $11.99 订阅；月度承诺的有效价格溢价为
              80%，强烈鼓励用户预先支付年度费用。这笔预收现金带来可预测营运资金，并压低年内流失。分发方面，Strava 依靠社交病毒式循环、同伴鼓励和 Z
              世代团体跑步俱乐部的采用，拥有异常高效的自然市场进入能力。由于运动上传和同伴邀请会自然填充漏斗顶部，获客成本远低于传统 SaaS 企业。然而，订阅主要通过移动设备交易，使 Strava 结构性暴露于 Apple
              App Store 和 Google Play 15% 至 30% 的平台佣金，这构成从消费者总账单中扣除的主要可变分销费用。
            claimRefs:
              - CI001
              - CI005
              - CI006
