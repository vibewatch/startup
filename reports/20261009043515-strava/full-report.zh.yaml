  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别定义
        blocks:
          - type: paragraph
            body: >
              Strava 位于消费者运动记录、数字健身社区和联网软件平台的交汇处，形成独特的类别边界。它不制造 GPS 智能手表或生物识别戒指等专有硬件，而是一个与设备无关的软件网络，采集、汇总并丰富来自 200
              多个合作设备生态的数据，包括 Garmin、Apple、Wahoo 和 Coros。平台边界涵盖消费者订阅软件、分段和鼓励等互动社交激励，以及企业 B2B
              品牌营销集成。相反，资本密集型硬件制造、医疗诊断监测和临床康复流程明确不属于 Strava 的核心运营支出。

              这个类别已从零散的桌面训练日志和单设备工具应用，演变为全球跨运动项目的社交图谱。Strava 的战略邻接领域包括结构化运动教练平台、市政地理空间城市规划和企业社区健康赞助。通过 2025 年收购数字骑行平台
              The Breakaway 和 AI 驱动的跑步教练平台 Runna，Strava
              系统性地把功能边界从事后活动记录扩展到主动、个性化运动训练。平台持续在数字健身服务商基准中位居前列，形成了单一用途的工具型追踪器难以复制的高参与度护城河。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角与可寻址机会
        blocks:
          - type: paragraph
            body: >
              评估 Strava 的可寻址市场，需要用多个分析视角区分消费者健康支出的总盘子与现实可获得的软件订阅收入。宏观上，全球可穿戴技术和联网数字健康生态在 2026 年约值 $238B，研究预测到 2035 年将以
              16.35% 的复合年增长率扩大至 $931B。但由于硬件设备销售占据这一总额的主体，把更广义的可穿戴市场直接视作总可寻址市场（TAM），会误导人们对软件变现规模的判断。

              更受约束、也更有运营意义的服务可寻址市场（SAM），聚焦于通过移动应用积极参与户外和室内运动的全球耐力运动员及健身爱好者。Strava 已建立庞大的漏斗顶部资产，在 185 个国家把累计注册会员网络扩展到超过 2
              亿，行业情报估计月活用户为 5,000 万运动员。商业变现仍以付费高级订阅为锚，据报道 Strava 的收入运行率（ARR）接近 $500M，并由 2025 年约 $415M
              的实际收入支撑。服务可获得市场（SOM）显示出结构性转化上限：历史上只有约 1% 至 3% 的注册用户转为付费订阅，说明网络总量增长远快于核心付费会员增长。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
