  - id: FV001
    title: Strava 投资建议决策流程
    type: flow
    summary: 决策树展示了从运营表现验证和估值倍数评估，走向“继续研究”判断的路径。
    data:
      nodes:
        - id: athlete-scale
          label: 运动员规模：185 个国家的注册运动员达 150M-200M
        - id: recurring-revenue
          label: 运行速率指标：年度经常性收入接近 $500M
        - id: private-valuation
          label: 融资背景：2025 年 5 月 Series G，估值 $2.2B（约 4.4x ARR）
        - id: secondary-trading
          label: 二级市场定价：$13.99-$14.35 意味着稳定的 $2.2B 企业价值
        - id: financial-opacity
          label: 尽调缺口：未经审计的毛利率、流失率与债务受偿顺序条款
        - id: recommendation-gate
          label: 最终判断：建议继续研究，估值评级偏高
      edges:
        - from: athlete-scale
          to: recurring-revenue
        - from: recurring-revenue
          to: private-valuation
        - from: private-valuation
          to: secondary-trading
        - from: secondary-trading
          to: financial-opacity
        - from: financial-opacity
          to: recommendation-gate
    approximationNotes: 按运营指标和缺失的财务披露，逐步推导最终建议。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
      - CV014
