      - number: '4.3'
        title: 成本结构、毛利率与转化摩擦
        blocks:
          - type: paragraph
            body: >-
              Strava 的底层成本结构类似高毛利消费者互联网平台，估计毛利率在 75% 至 85% 之间。销售成本主要包括云基础设施、第三方地图瓦片 API，以及支持超过 12b 条累计活动记录的 AWS 环境遥测处理。但
              Strava 单位经济性的核心弱点是订阅转化漏斗狭窄：180M+ 注册运动员中估计只有 10% 至 15% 支付 Premium，超过 125m
              名运动员消耗服务器、数据采集和地图资源，却没有贡献直接软件收入。管理层在 2025 年收购 Runna 和 The
              Breakaway，以增强个性化教练价值并加速免费转付费；但外部关于可能推出应用内广告的财务猜测，威胁运动员好感。通过横幅广告或赞助算法推荐变现免费用户，会造成严重品牌摩擦，可能疏远核心耐力社区并损害平台留存。
            claimRefs:
              - CI006
