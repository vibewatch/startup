  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Strava 的核心投资论点在于，它是全球活跃耐力运动员首要的数字社区和订阅平台。不同于经历疫情后大幅减值和重组周期的硬件型联网健身企业，Strava
              采用轻资产免费增值数字模式，背靠深厚的社区网络效应和十多年积累的专有运动行为遥测。注册运动员账户从 2025 年超过 1.5 亿增至 2026 年覆盖 185 个国家、超过 2 亿，ARR 据报道接近
              $500M，平台展现出持续的收入顶部动能。近期收购 Runna 和 The Breakaway 等训练应用，进一步强化了 Strava 通过个性化教练和结构化训练计划提升订阅 ARPU
              的能力。反论点则指向关键的结构性不确定性：Strava 依靠把庞大免费增值用户中的一小部分转成付费订阅者，因而暴露于价格敏感度、流失和宏观消费可选支出压力。尽管二级市场和风险投资轮次给 Strava 定价
              $2.2B，缺少公开财务报表使运营消耗、毛利率、平台基础设施成本和第三方应用商店抽成变得不透明。如果没有经审计的现金流创造情况，若 IPO 后增长放缓，股权投资者将面临倍数大幅压缩风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV013
      - number: '8.2'
        title: 融资历史、股权结构表背景与二级市场价格
        blocks:
          - type: paragraph
            body: >-
              Strava 的机构融资历史横跨十多年风险资本和成长资本支持。公司资本化历史记录了由 Sigma Partners 和 Madrone Capital Partners 领投的早期基础轮次，随后 Sequoia
              Capital 于 2014 年领投 D 轮扩张；2020 年 11 月，TCV 和 Sequoia Capital 领投 $110M 的 F 轮融资，对应 $1.5B 估值。2025 年 5 月，Strava
              完成由 Sequoia Capital 领投的 G 轮融资，TCV、Jackson Square Ventures 和 Go4it Capital 等现有支持者参与，投后估值达到 $2.2B。Tracxn
              的补充债务追踪显示，2025 年 6 月公司还与现有机构赞助者安排了传统债务融资。在私募二级市场，交易平台反映价格稳定：Forge Global 报告截至 2026 年 8 月的推导 Forge Price 为
              $13.99，意味着估值仍为 $2.2B；Nasdaq Private Market 记录截至 2026 年 9 月的指示性价格为 $14.35，较 2024 年 9 月基准上涨 30.2%。但 2025
              年股权和债务工具的确切优先级、清算优先权和潜在稀释机制仍属私有信息，对潜在公开市场股权参与者构成悬置风险。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: 估值情景、可比分析与尽调要求
        blocks:
          - type: paragraph
            body: >-
              评估 Strava $2.2B 的私募估值，需要把高毛利软件网络画像与消费者科技和健身生态中的公开、私募可比倍数放在一起权衡。按接近 $500M 的报告运行率收入计算，$2.2B 估值意味着约 4.4x 至
              4.5x 的 ARR 追踪企业价值倍数。基准情景下，Strava 保持每年 15% 至 20% 的订阅增长，深化 Runna 和教练功能集成，并以 4.0x 至 5.0x
              收入倍数达到与头部消费者订阅平台相当的上市估值。乐观情景下，AI 个性化训练快速采用、企业 Metro 合作扩展、国际高级订阅转化加速，使收入超过 $650M，倍数扩大至约 6.0x 收入，市场估值超过
              $3.2B。悲观情景下，调价后订阅者流失加速，增长降至 10% 以下，公开市场对净利润率的审视使交易倍数收缩至 2.0x 至 2.5x 收入，对应 $1.1B 至 $1.3B 的下行情景估值。鉴于 S-1
              注册声明草案仍处于保密状态，且包括 CFO Matt Anderson 在内的领导层交接于 2025 年年中才完成，在经审计财务报表确认可持续自由现金流前，投资者应继续保持“继续研究”的判断。
            claimRefs:
              - CV002
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
