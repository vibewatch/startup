  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险层级与剩余暴露
        blocks:
          - type: paragraph
            body: >-
              在现有证据中，位置数据暴露是最明确的高严重性风险。次级时间线记录了涉及军事设施、安保人员、公众人物和偏远地区住址推断的多起事件；Strava
              自身条款称成年内容默认公开，除非用户更改隐私控制。这种组合意味着用户配置只是控制环境的一部分，并非完整的平台级防护。Strava 自报的超过 1
              亿活跃用户规模进一步放大风险。因此，热力图把隐私风险排在可用性、生态、完整性、变现和 AI 安全风险之上；这些序数评级是分析师判断，不是测量出的事件概率。
            claimRefs:
