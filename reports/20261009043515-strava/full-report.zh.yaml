              Strava 的采用势头同时反映自然网络效应和不断加深运动员参与度的系统性功能发布。截至 2025 年 9 月，平台遥测显示 29% 的已追踪骑行和跑步使用 Power Insights 分析工具。2024
              年团体健身活动同比增长 13%，由活跃的俱乐部互动和网络每年超过 140 亿次的鼓励推动。此外，43% 的受访活跃运动员表示计划完成重大耐力活动或比赛，说明目标导向用户的参与具有持续性。Strava
