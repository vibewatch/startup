      - number: '4.4'
        title: 资本充足性、债务义务与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              Strava 的资本充足性较好，基础是据报道的运营盈利能力和有纪律的多轮机构支持。2025 年 5 月，Strava 完成由 Sequoia Capital 领投的 $50M F-1 股权融资，形成 $2.2B
              投后估值基准。公司随后于 2025 年 6 月 13 日从 Sequoia、TCV、Jackson Square Ventures 和 Go4it Capital
              等现有机构伙伴取得传统债务工具，迅速补强流动性。截至 2026 年 8 月，Forge Global 的 IPO 前二级交易维持 $13.99 的 Forge Price，强化了 $2.2B 估值底线。2026
              年初，Strava 向 SEC 保密提交 S-1 注册声明草案，并聘请 Goldman Sachs 与 JPMorgan、Morgan Stanley 共同牵头，目标公开估值为 $2.0B 至 $3.0B。包括
              CFO Matt Anderson 和 CMO Louisa Wee 在内的关键任命，显示公司已接近上市准备完成；但要评估长期资本充足性，仍需审计债务契约和 2025 年 GAAP 现金创造情况。
            claimRefs:
              - CI003
