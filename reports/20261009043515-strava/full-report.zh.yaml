  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业变现渠道
        blocks:
          - type: paragraph
            body: >-
              Strava 运营一个消费者免费增值与 B2B 商业混合平台，2025 年净收入约 $415M，同比增长约 18.5%，ARR 接近 $500M。财务引擎主要由个人运动员订阅 Strava Premium
              驱动，订阅者可获得高级路线、AI 训练分析和竞争性分段排行榜。除核心消费者订阅外，Strava 还通过与 Chipotle、Lululemon
              等企业广告主开展赞助运动挑战和地理定向赞助分段，变现商业品牌合作。这些 B2B 活动利用原生运动员活动带来高毛利，不引入打断式展示广告。此外，Strava Metro 过去曾测试商业化市政数据服务，公司后来把
              Metro 转为公共和学术数据访问项目，以强化品牌、推动公民参与，并把 Strava 建立为人力驱动出行的全球数字基础设施。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
