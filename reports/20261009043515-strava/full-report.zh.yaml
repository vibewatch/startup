      - number: '7.3'
        title: 运营、安全与完整性风险
        blocks:
          - type: paragraph
            body: >-
              Strava 覆盖移动端、网页、GPS
              追踪、路线规划、社交功能、安全工具和设备同步。虽然没有分配当前故障频率或服务等级证据，这种广度仍暴露出广泛的可靠性和数据质量风险。帮助中心记录了专门的安全和隐私支持，而条款不保证不间断或无错误运行。历史报道还描述过排行榜操纵；条款要求活动真实，并允许暂停账户。一名第三方开发者的问题暴露出另一种集成质量风险：其客户端在缺少充分验证的情况下信任解析后的
              Strava 响应。这不是 Strava 一侧存在漏洞的证据，但支持对 SDK 合同、载荷边界和合作伙伴测试纪律进行尽调。
            claimRefs:
