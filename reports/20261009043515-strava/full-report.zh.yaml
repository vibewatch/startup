      - number: '2.4'
        title: 结构性增长动力与采用约束
        blocks:
          - type: paragraph
            body: >
              Strava 的扩张既受长期需求增长推动，也受到明显的采用和变现约束。需求侧，年轻人群尤其是 Z 世代已成为关键扩张催化剂，带动有组织社区跑步活动、越野赛和辅助力量训练加速参与。Runna
              等收购来的训练资产进一步提供结构化教练价值，帮助留住用户并支撑高级订阅收费。此外，Strava 的国际网络密度创造自我强化的地域网络效应，本地俱乐部和分段排行榜推动 185 个国家的病毒式传播。

              另一方面，采用限制和结构性逆风给收入加速设定了现实边界。早期健身科技的宏观风险投资已从 2021 年 $6.27B 的峰值大幅下降至 2024 年的
              $1.26B，使整个健身科技行业更受关注单位盈利和有机现金流。更关键的是，消费者对价格仍然敏感：爱好者社区经常抱怨每年 $80
              的订阅门槛，以及历史免费功能（如分段排行榜）被移到付费墙后。数字运动追踪可能造成追踪疲劳，也可能被 Apple Health、Garmin Connect
              等原生设备生态商品化，因此在扩大订阅转化的同时守住社区好感，是决定估值持久性的核心运营挑战。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 社交健身的免费增值困境
            body: >-
              Strava 2 亿用户的庞大规模构成非凡的竞争护城河，但历史变现显示，转为付费订阅的用户不到 3%。长期 ARR 增长取决于通过 Runna 等收购，把教练智能和 AI
              洞察打包起来，而不是单纯限制基础社区功能。
            calloutType: insight
            claimRefs:
              - CM004
              - CM009
              - CM011
          - type: callout
            title: 消费者价格敏感度与流失风险
            body: 随着健身初创企业风险投资从疫情高点回落，Strava 面临保护毛利率、同时测试订阅价格阈值的挑战。社区对每年 $80 价格和付费墙排行榜的反弹，凸显股东回报与草根社区情绪之间的微妙平衡。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Strava 在消费者健身软件市场的地位具有不对称性：GPS 记录在移动操作系统和可穿戴硬件中已成为同质化商品，但 Strava
              的社交与分段网络图谱仍是行业默认的活动中心。竞争替代方案分为五类。第一，Garmin Connect、Apple Health/Fitness+
              等硬件捆绑平台，以设备所有者无需额外软件成本的方式提供基础活动记录、生物识别追踪和生理恢复评分。第二，Nike Run Club
              等品牌补贴的引流产品完全取消订阅门槛，用企业服装营销预算资助结构化教练和音频指导训练。第三，TrainingPeaks、Runna、intervals.icu 等专业耐力教练和分析平台，提供远超 Strava
              高层级 Relative Effort 和健身趋势指标的生理建模、周期化计划和训练构建器。第四，Motera、Atlas 等游戏化空间和领地挑战者，试图把路线变成现实世界的领地占领和滚动排行榜，以取代
              Strava 的分段机制。最后，Komoot 和 Ride with GPS 等路线规划平台直接在骑行导航、地表地图和逐向指引上竞争。
