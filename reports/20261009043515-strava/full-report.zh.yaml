      - CM006
      - CM009
  - id: FP001
    title: 竞争定位象限：社交参与度对比分析深度
    type: quadrant
    summary: 将消费健身平台按社交参与度和分析深度绘图，显示 Strava 在社交互动上的主导地位，以及专业表现功能的拆分趋势。
    data:
      xAxis: 分析与教练深度
      yAxis: 社交与网络连接度
      points:
        - label: Strava
          x: 4
          'y': 9
          note: 社交图谱和分段市场的领先者，分析深度中等
        - label: Garmin Connect
          x: 8
          'y': 4
          note: 生理追踪深入，但社交功能受硬件绑定限制
        - label: Nike Run Club
          x: 3
