  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与人口画像
        blocks:
          - type: paragraph
            body: >-
              Strava 把可寻址的活跃受众分成三类主要客户：免费社区运动员、付费高级订阅者和商业企业品牌伙伴。广泛的消费者基础覆盖 185 个以上国家的 1.8
              亿多注册运动员，形成从日常随意步行者到竞技耐力运动员的多层运动金字塔。在美国，用户人口研究显示活跃参与者具有广泛的族群代表性：白人用户 42%、黑人运动员 32%、西语裔用户 20%、其他群体
              6%。公司的历史基础是耐力骑行，后来逐步扩展到跑步、徒步、步行和多项训练。Strava
              的消费者参与策略利用进步导向、社交社区寻求者和竞技运动员等动机画像，个性化新用户流程并推动平台习惯化。与此同时，商业企业客户通过 Strava for Business
              接触目标明确、重视运动的受众，开展赞助挑战、认证俱乐部和品牌分段活动。
