              2026 年春季窗口也已过去。证据还保留一条重大不利线索：独立摘要记录了多次位置数据暴露担忧，包括 2025 年涉及法国潜艇人员的调查。Strava
              自身条款警告，地理定位使用会带来安全和安保风险。因此，在估值分析把公开规模叙事当作可投资的财务证据之前，经审计收入、付费订阅用户、利润率、现金消耗、当前员工数、完整融资条款和治理权利仍是优先尽调事项。
