      - number: '3.2'
        title: 定价压力与拆分动态
        blocks:
          - type: paragraph
            body: >-
              Strava 当前独立零售价为每月 $11.99 或每年 $79.99，处于大众消费者健身应用的高价位。历史上多次涨价，尤其是 2023 年 2 月从月费 $7.99 调至 $11.99 后，Strava
              逐步把完整分段排行榜、带热力图的路线规划、匹配跑步和高级训练日志等功能从免费层移到付费墙后。这种变现节奏加速了耐力运动员的多平台使用。由于免费层仍支持基础 GPS 记录、社交动态发布、鼓励，以及通过 Garmin
              Connect 和 Apple Health 同步第三方设备，价格敏感的运动员越来越多地采用多平台工作流：用免费或低价工具做结构化训练和生理追踪，同时只保留一个不付费的 Strava
              资料作为社交分发渠道。Runify（每月 $4.99 或每年 $39.99）和 intervals.icu（核心层免费，可选 $4
              支持者层）等平台以显著更低的价格提供高级距离排名和功率曲线分析，正好利用了这一缺口。
