callouts:
  - calloutType: risk
    title: "The Freemium Conversion Ceiling"
    body: "With only approximately 10% to 15% of Strava's 180M+ registered athletes paying for Premium, over 125 million users generate zero direct software revenue. While this scale creates formidable network effects, it burdens Strava with ongoing cloud hosting and GPS ingestion costs, forcing leadership to weigh in-app advertising against potential community alienation."
    claimRefs:
      - "CI007"
      - "CI008"
  - calloutType: insight
    title: "Capital Structure and Conventional Debt"
    body: "In addition to its $50M Series F-1 equity financing at a $2.2B valuation in May 2025, Strava secured a conventional debt facility in June 2025 from existing institutional backers. While strengthening cash reserves ahead of a planned IPO, undisclosed debt covenants and repayment schedules represent a key private underwriting variable."
    claimRefs:
      - "CI011"
      - "CI012"
