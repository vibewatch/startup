chapter:
  number: 5
  title: "Product & Technology"
  summary: "Strava's publicly verified product is a mobile-and-web activity, analysis, and social platform connected to a stable public V3 API and third-party fitness services. The evidence supports the user-facing workflow and governance boundaries, but not Strava's internal production topology, service levels, security certifications, or incident record."
sections:
  - id: "athlete-workflow-and-product-surface"
    title: "Athlete Workflow and Product Surface"
    body: >-
      Strava's verified workflow begins with activity capture on a phone or GPS device and
      continues through post-workout analysis and social sharing. The official product page
      identifies speed, pace, distance, comparison with prior attempts, and Relative Effort as
      analysis outputs; the desktop surface adds training plans, route planning, and activity
      breakdowns. Discovery and engagement span segments, routes, maps, clubs, challenges, and
      race courses rather than a standalone tracking utility. Beacon adds a distinct safety
      workflow by sharing an athlete's real-time location with as many as three contacts. These
      surfaces establish a mature, multi-step customer experience, while public evidence does
      not quantify feature usage, accuracy, conversion, or retention by module.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "integration-and-architecture-evidence"
    title: "Integration Surface and Architecture Evidence"
    body: >-
      The strongest technical evidence is at the boundary, not inside Strava's production
      environment. Strava describes V3 as a public, stable API used by its own mobile apps and
      says thousands of developers build applications with Strava data. Its terms separately
      identify connections to services such as Apple Health and Garmin Connect, along with
      sponsor, media-streaming, and tracking-device integrations. Independent development
      vendors consistently identify GPS accuracy, sensor ingestion, social interaction, privacy,
      and scale as important requirements for a Strava-like product. Those guides are useful for
      framing diligence questions, but they are not evidence that Strava itself uses the
      databases, queues, microservices, cloud providers, or deployment patterns those vendors
      recommend.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-reliability-and-roadmap"
    title: "Maturity, Reliability, and Roadmap Boundaries"
    body: >-
      Public evidence indicates production maturity for the core product and API, but it does
      not establish operating performance. The developer portal calls V3 stable and says Strava
      mobile applications use it, while also warning that major changes may occur and that API
      tokens may be revoked for agreement violations. The terms state that beta features may be
      unsupported, may contain errors or design flaws, and may be changed or removed. They also
      disclaim any warranty that the service will be uninterrupted, timely, secure, error-free,
      accurate, or reliable. Those legal statements define customer risk allocation rather than
      proving poor reliability. No assigned independent status history, uptime target, latency
      benchmark, recovery objective, or current roadmap was available, leaving operational
      maturity a material technical-diligence gap.
    claimRefs:
      - "CE006"
      - "CE008"
      - "CE015"
      - "CE016"
  - id: "trust-safety-privacy-and-ai"
    title: "Trust, Safety, Privacy, and AI Controls"
    body: >-
      Location and behavioral data make trust controls part of the product architecture rather
      than a peripheral policy issue. Strava's terms say adult user content is public by default,
      while available controls can make content private or limit it to a smaller group. The same
      terms describe personalization using sport type, location, social connections, clubs, and
      engagement to rank feeds and recommend routes, challenges, and accounts. Strava also says
      it may use AI and machine learning for training-related features, acknowledges that those
      technologies can make mistakes, and directs users to exercise judgment. Beacon provides a
      concrete safety control, but the assigned evidence does not verify encryption design,
      security certifications, moderation performance, privacy-control adoption, or independent
      testing of AI recommendations.
    claimRefs:
      - "CE005"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE016"
