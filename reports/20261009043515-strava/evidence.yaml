evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited revenue, paid-subscriber count, gross margin, retention, cash balance, burn, and runway.
    whyItMatters: Registered-user and engagement scale cannot establish monetization quality, profitability, or financing need.
    diligencePath: Obtain audited statements, subscription cohort schedules, and cash-flow detail from the data room or public S-1.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A complete financing schedule reconciling the $180 million disclosed-round total with Forge's approximately $230
      million history.
    whyItMatters: Round coverage affects dilution, liquidation preference, debt, and valuation analysis.
    diligencePath: Reconcile the cap table, stock-purchase agreements, debt schedules, and cash proceeds by round.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current executive, board, committee, ownership, voting-rights, and succession records.
    whyItMatters: A partial public roster cannot establish control, independence, key-person exposure, or stakeholder economics.
    diligencePath: Obtain the board book, charter documents, cap table, investor-rights agreements, and current organization chart.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: b2b-segment-financials
    missingEvidence: >-
      Audited financial breakdown of enterprise revenue contributions from Strava Business sponsored challenges, brand
      partnerships, and municipal Metro data licensing.
    whyItMatters: >-
      Without segmented financial reporting, analysts cannot isolate high-margin enterprise data and ad licensing from
      consumer subscription ARR, limiting valuation precision across B2B monetization paths.
    diligencePath: >-
      Inspect S-1 disclosure exhibits upon public filing or request segmented commercial contract summaries during
      pre-IPO management diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: material
    topic: subscription-conversion-rates
    missingEvidence: >-
      Audited paid subscriber counts, net revenue retention (NRR), and annual churn rates across global consumer
      cohorts.
    whyItMatters: >-
      Third-party estimates of Strava's paid subscriber base range from 1% to over 3% of registered users, creating
      substantial uncertainty regarding actual customer lifetime value and organic conversion ceilings.
    diligencePath: >-
      Review S-1 cohort retention curves, churn by vintage, and gross addition numbers across iOS and Android app store
      billing channels.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-metrics
    missingEvidence: >-
      Private competitor retention, paid subscriber counts, churn rates, and unit economics across specialized endurance
      platforms.
    whyItMatters: >-
      Without private subscriber economics, the exact displacement velocity of Strava paid subscribers toward niche
      training apps cannot be audited.
    diligencePath: >-
      Review vendor management presentations, private funding disclosures, or third-party app-store intelligence
      datasets.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-churn
    missingEvidence: >-
      Audited paid-subscriber counts, annual churn rates, subscriber retention cohorts, and exact gross margin splits
      between mobile app store billing and web direct billing.
    whyItMatters: >-
      Without audited retention curves and cohort LTV metrics, underwriting long-term subscription revenue durability
      and post-IPO earnings multiple expansion remains speculative.
    diligencePath: >-
      Request confidential S-1 disclosure exhibits or audited management reporting detailing cohort retention, gross
      churn, and App Store fee amortization.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: financing-and-debt-terms
    missingEvidence: >-
      Detailed terms, interest covenants, maturity dates, and repayment obligations for the June 13, 2025 conventional
      debt facility.
    whyItMatters: >-
      Debt service requirements and senior liquidation covenants affect equity value and cash runway in the event of an
      extended IPO delay or macroeconomic tightening.
    diligencePath: >-
      Review credit agreement covenants, lender compliance certificates, and senior debt facilities during pre-IPO
      financial diligence.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: >-
      Current production topology, data stores, cloud dependencies, deployment model, observability controls, and
      scaling benchmarks.
    whyItMatters: Public boundary documentation cannot establish resilience, concentration risk, technical debt, or cost-to-serve.
    diligencePath: >-
      Request a current architecture diagram, service inventory, cloud-spend breakdown, capacity model, and engineering
      design review.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent status history plus uptime, latency, synchronization-success, recovery-time, and recovery-point
      performance.
    whyItMatters: >-
      Legal warranty disclaimers do not establish actual operating reliability or the severity and frequency of
      incidents.
    diligencePath: >-
      Review the status-page history, incident postmortems, SLO dashboards, support tickets, and major integration
      failure logs.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: security-and-privacy
    missingEvidence: >-
      Current security certifications, penetration-test findings, encryption and key-management design, privacy-control
      adoption, and moderation metrics.
    whyItMatters: >-
      The product processes sensitive health, behavioral, and location information across user and third-party
      boundaries.
    diligencePath: >-
      Request security audit reports, data-flow diagrams, privacy-impact assessments, access-control tests, and
      moderation effectiveness metrics.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: >-
      Active API token count, request volume, rate-limit policy, developer retention, integration quality, and current
      changelog history.
    whyItMatters: A broad developer claim does not quantify ecosystem health, dependency, or the cost of platform-policy changes.
    diligencePath: >-
      Review API telemetry, partner concentration, developer support queues, deprecation notices, and the complete
      changelog.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: subscriber-retention
    missingEvidence: >-
      Audited paid subscriber counts, cohort retention curves, gross churn rate, and Net Revenue Retention (NRR)
      percentages.
    whyItMatters: >-
      Without verified retention metrics, assessing the durability and lifetime value of Strava's approaching $500M
      subscription revenue base is speculative.
    diligencePath: Inspect confidential S-1 IPO registration filings or request audited management financial cohorts under NDA.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: minor
    topic: enterprise-b2b-arr
    missingEvidence: >-
      Breakdown of Strava for Business advertising, sponsored challenge, and Strava Metro licensing revenue
      contribution.
    whyItMatters: >-
      Determines whether enterprise B2B sponsorships represent a scalable high-margin growth driver or an immaterial
      sideline to consumer subscriptions.
    diligencePath: Obtain corporate sponsor rate cards and enterprise segment revenue breakdowns during financial diligence.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: commercial-partner-roster
    missingEvidence: >-
      Complete enterprise advertiser and sponsored challenge partner list with annual spend tiers and repeat sponsorship
      rates.
    whyItMatters: >-
      Validates customer concentration risk among brand advertisers and whether sponsorship revenue is project-based or
      contractually recurring.
    diligencePath: Review Strava Business commercial partner client lists and historical renewal rates.
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: user-base-headcount
    missingEvidence: >-
      Reconciliation of disparate public athlete counts ranging between 100M, 135M, 150M, 180M, and 195M across press
      materials and marketing copy.
    whyItMatters: Distinguishes cumulative lifetime account creations from active monthly athletes (MAU) and engaged users.
    diligencePath: Request verified monthly active user (MAU) and daily active user (DAU) disclosures for the trailing twelve months.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: >-
      Audited revenue, paid-subscriber cohorts, conversion, churn, gross margin, cash, operating cash flow, burn, debt
      service, and runway as of the run date.
    whyItMatters: >-
      Reported profitability is not cash availability, and financial capacity determines whether Strava can fund
      remediation, integrations, acquisitions, and listing readiness.
    diligencePath: >-
      Obtain audited statements, monthly cohort tables, bank and debt schedules, a 24-month cash bridge, and
      board-approved operating plan; reconcile each to the cap table.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: risk-register-completeness
    missingEvidence: >-
      A complete current inventory of litigation, regulator inquiries, privacy incidents, outages, security events,
      counterparties, insurance claims, and remediation status.
    whyItMatters: >-
      The allocated public pool cannot establish the absence, frequency, financial effect, or closure of incidents and
      proceedings.
    diligencePath: >-
      Require counsel and management certificates, regulator and court searches, incident and outage exports,
      cyber-insurance loss runs, and an owner-and-deadline remediation log.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited 2025 and trailing-twelve-month GAAP income statement, gross margin, operating margin, free cash flow, and
      paid subscriber churn disclosures.
    whyItMatters: >-
      Without audited financial statements, the sustainability of Strava's reported ~$500M ARR and cash flow generation
      cannot be independently confirmed.
    diligencePath: >-
      Review public Form S-1 registration statement upon confidential review conclusion or request audited financial
      statements directly via pre-IPO transaction data rooms.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: missing-source
    severity: material
    topic: capital-structure-details
    missingEvidence: >-
      Detailed 2025 Series G and debt financing terms, liquidation preference order, and dilution schedules across
      preferred share classes.
    whyItMatters: >-
      Senior liquidation preferences or debt covenants could substantially affect the net economic recovery of common
      shareholders in downside acquisition or restructuring scenarios.
    diligencePath: >-
      Request Strava's complete capitalization table, Series G stock purchase agreement, and debt credit agreement
      through pre-IPO diligence channels.
    relatedQuestionRefs:
      - QV008
