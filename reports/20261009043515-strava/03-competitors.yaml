callouts:
  - calloutType: "risk"
    title: "Unbundling Risk from Free Hardware and Loss-Leader Software"
    body: "Strava's $79.99 annual subscription faces structural substitution from two directions: zero-marginal-cost device platforms like Garmin Connect that provide superior physiological analytics for free, and corporate loss leaders like Nike Run Club that provide guided coaching without paywalls."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP008"
      - "CP013"
  - calloutType: "insight"
    title: "Social Graph and Segment Depth Form the Core Defense"
    body: "While competitors provide superior training analytics or lower prices, Strava's historical accumulation of segment leaderboards and bilateral athlete connections creates high coordination costs for user migration, entrenching multi-homing rather than outright displacement."
    claimRefs:
      - "CP001"
      - "CP014"
      - "CP015"
