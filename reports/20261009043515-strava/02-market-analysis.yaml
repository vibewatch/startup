callouts:
  - calloutType: insight
    title: The Freemium Dilemma in Social Fitness
    body: Strava's massive 200 million user base represents an extraordinary competitive moat, yet historical monetization reveals that less than 3% of users transition into paid subscribers. Sustaining long-term ARR expansion hinges on packaging coaching intelligence and AI-driven insights via acquisitions like Runna rather than merely restricting baseline community features.
    claimRefs:
      - CM004
      - CM009
      - CM011
  - calloutType: risk
    title: Consumer Price Sensitivity and Churn Risk
    body: As fitness startup venture capital retreats from pandemic highs, Strava faces the challenge of protecting gross margins while testing subscription pricing thresholds. Community pushback against $80 annual price points and paywalled leaderboards underscores the delicate balance between shareholder return and grassroots community sentiment.
    claimRefs:
      - CM012
      - CM013
