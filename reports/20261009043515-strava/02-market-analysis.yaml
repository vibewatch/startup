      - - Enterprise Brand Activation & Challenges
        - Sponsored brand challenges, digital badges, branded segments, corporate community activation programs
        - Programmatic open-web display advertising, native video ad networks, pop-up affiliate links
        - Consumer sports apparel brands (e.g., Lululemon, Chipotle, CLIF Bar)
