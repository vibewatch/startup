      - - Civic Data & Infrastructure Planning
        - Aggregated de-identified geospatial mobility patterns, commute flow analytics (formerly paid Strava Metro)
        - Real-time vehicular GPS telematics, private individual trip tracking, proprietary survey research
        - Municipal departments of transportation, regional urban planning councils, advocacy groups
