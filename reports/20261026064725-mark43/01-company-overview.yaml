company:
  name: Mark43
chapter:
  number: 1
  title: Company Overview
  summary: Mark43 sells an integrated public-safety software platform spanning CAD, RMS, mobile workflows, and analytics. Public sources describe a New York-based company founded by three Harvard classmates, but disagree on its founding year and report agency counts with unresolved dates and definitions; current financial performance, valuation, financing terms, and governance remain opaque.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Mark43 is a public-safety software vendor whose described product set combines
      computer-aided dispatch (CAD), records management (RMS), mobile tools, and
      analytics. Inc. Magazine's republished article and Mark43's own product
      announcement describe workflows spanning dispatch, reporting, investigations,
      and case summarization; AUVSI's 2025 article describes an open API and integrated
      systems. Gartner's vendor page and a public-safety technology directory also
      describe the product category, but those listings are not comparative performance
      benchmarks. EquityZen and Inc. place the company in New York. The available
      evidence supports a software platform serving public-safety agencies; it does
      not establish pricing, contract mix, recurring-revenue composition, or whether
      every listed module is deployed at every customer. The company profile table
      separates reported figures from metrics that remain unavailable.
    claimRefs:
      - CO001
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The allocated reporting identifies co-founders Scott Crouch, Matt Polega, and
      Florian Mayr as Harvard classmates; Polega is also described as Head of External
      Affairs. EquityZen's profile and Mark43's 2026 survey release identify Bob Hughes
      as CEO. These sources establish a small set of visible senior figures, not a
      complete current leadership roster. The source pool provides no board composition,
      director independence, ownership, voting rights, executive tenure, succession
      planning, or key-person retention terms. Founder continuity is discussed in
      Polega's interview, but it does not substitute for governance evidence. The
      leadership exhibit is therefore a partial enumeration, and diligence should
      establish who controls the company and how product, security, and customer
      commitments are governed.
    claimRefs:
      - CO002
      - CO009
    tableRefs:
      - TO002
  - id: financing-and-stakeholders
    title: Financing, stakeholders, and operating scale
    body: >-
      EquityZen lists $370 million as Mark43's total funding, and names General
      Catalyst, Spark Capital, Breyer Capital, Bezos Expeditions, and Tiger Global
      Management as notable investors. Inc. separately reports an early $78 million
      funding figure that included General Catalyst, Spark Capital, and Bezos
      Expeditions; because its article date is not established in the fetched copy,
      that figure is historical context rather than a current total. Neither source
      supplies a round-by-round schedule or current ownership terms. Agency counts
      also vary: EquityZen says over 120, Pulse 2.0 says over 200, and Dealroom reports
      more than 300 agencies as customers in acquisition coverage. Their dates,
      definitions, and active-customer denominators are not reconciled. These are
      reported counts, not independently verified active deployments. ARR, GAAP
      revenue, growth, margins, valuation, debt, and current headcount are not
      established by the assigned evidence.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO003
  - id: milestones-and-diligence
    title: Milestones, execution, and diligence
    body: >-
      The available chronology shows a product-led expansion from a Washington, D.C.
      Metropolitan Police Department project to AI-assisted case summarization and
      report writing, followed by a 2026 ForceMetrics partnership and acquisition.
      Dates and descriptions are retained at the precision supplied by the sources;
      the reported founding year remains inconsistent between EquityZen and Inc.
      Mark43's announcements describe human review before AI-assisted reports are
      submitted, while company-issued survey releases report broad interest in AI and
      sector-wide cyber concerns. Neither kind of company-issued evidence demonstrates
      product accuracy, customer outcomes, security effectiveness, or a company-specific
      incident history. EquityZen flags cybersecurity and data-breach exposure as a
      potential cost and trust risk, but does not document a Mark43 breach. The
      timeline records dated claims; financing terms, operating metrics, independent
      controls, and production-scale AI evidence remain diligence priorities.
    claimRefs:
      - CO003
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
