  - id: TV002
    title: Investment thesis and anti-thesis
    columns:
      - Argument
      - Evidence and limitation
      - What would change the view
    rows:
      - - Thesis — integrated public-safety workflows may deepen product value.
        - Dealroom describes Mark43's CAD/RMS/analytics platform and ForceMetrics' data-linking rationale; AUVSI describes an open API, but the latter is company-focused editorial evidence.
        - Demonstrate cross-sell, adoption, renewal, and implementation economics by acquired and legacy cohorts.
      - - Thesis — deployments show ability to operate at meaningful agency scale.
        - HSToday reports a DOI deployment across six programs, approximately 3,000 officers, and over 855 locations; it attributes the account to a press release.
        - Verify contract value, delivery milestones, customer reference, renewal, and realized support burden.
      - - Anti-thesis — strategic expansion may not translate into value per share.
        - Dealroom says acquisition terms were not disclosed; no retained source establishes revenue, margins, dilution, or preferences.
        - Obtain acquisition consideration, audited financials, fully diluted cap table, debt, and preference waterfall.
      - - Anti-thesis — public-sector adoption faces funding and execution constraints.
        - 911.gov describes assistance programs but reports no 911 Grants open; CISA and FCC describe transition, readiness, and cyber context, not Mark43 bookings.
        - Validate procurement pipeline, grant eligibility, security reviews, deployment duration, and cash conversion.
    notes: Company-reported and press-release-based operating claims are not independent financial verification; no comparable multiple is inferred.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV014
      - CV015
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and trigger
    rows:
      - - Bull
        - ForceMetrics integration succeeds; agencies adopt more modules; retention and margins remain strong.
        - No numeric range is supportable without verified revenue, margins, capitalization, and transaction consideration; upside would require evidence of durable recurring economics.
        - Conditional, not estimated; upgrade only after cohort-level revenue and integration results are verified.
      - - Base
        - Product and deployment footprint persist, but procurement cycles and financial disclosure remain opaque.
        - No numeric range or target return; hold price discipline until normalized revenue and dilution are known.
        - Current evidence favors further diligence over a calibrated probability or price.
      - - Bear
        - Procurement or funding conversion slows, security/integration burdens rise, or acquisition spending fails to improve customer economics.
        - Downside cannot be quantified without the capital structure, fixed obligations, cash position, and preference stack.
        - Material downside path; test with renewal, implementation-cost, cyber-control, and liquidity evidence.
      - - Required valuation inputs
        - ARR and GAAP revenue bridge, growth, gross margin, retention, customer concentration, cash/debt, fully diluted shares, and financing preferences.
        - Obtain company records and transaction documents before selecting a method or peer set.
        - Blocking for any numeric target; no unsupported probability or range is substituted.
    notes: Scenarios are conditional diligence cases, not forecasts; no price, probability, multiple, or return is estimated where inputs are absent.
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV011
      - CV014
      - CV015
