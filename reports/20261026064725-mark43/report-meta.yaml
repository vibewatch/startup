  topRisks:
    - >-
      Public evidence does not establish current ARR, GAAP revenue, growth, margins, retention, cash, debt, or
      implementation economics.
    - >-
      Agency counts vary across sources and do not define active deployments, module penetration, renewals, or customer
      concentration.
    - >-
      Cybersecurity, availability, privacy, and AI-governance failures could have outsized consequences in
      mission-critical public-safety systems; company-specific operating metrics are unavailable.
