  topStrengths:
    - >-
      The platform spans core CAD, RMS, mobile, and analytics workflows that public-safety agencies use in
      mission-critical operations.
    - >-
      Public disclosures report more than 300 agency customers, while a federal deployment reference spans six programs,
      approximately 3,000 sworn officers, and more than 855 locations.
