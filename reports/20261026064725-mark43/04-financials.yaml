schemaVersion: "report-v2"
artifact: financials
slug: mark43
runDate: "2026-10-26"
company:
  name: Mark43
chapter:
  number: 4
  title: Financials
  summary: >-
    Mark43's public materials and partner pages show a multi-product public-safety
    software offer and commercial relationships, but the assigned evidence does
    not disclose pricing, recognized revenue, unit economics, or liquidity.
    Reported agency reach is a company claim rather than a revenue proxy, leaving
    capital adequacy unassessable from this source set.
sections:
  - id: product-and-monetization
    title: Product scope is visible; monetization is not
    body: >-
      Mark43's own company page presents its platform as core operating software
      for public-safety agencies [CI001], and its company and CAD pages describe
      CAD and RMS capabilities [CI002]. A public-safety technology directory also
      lists mobile field tools and analytics [CI003], but these descriptions
      establish product scope, not a bundle purchased by any one agency. The
      assigned pages disclose neither list prices, realized discounts, contract
      values, billing units, nor revenue-recognition policy [CI012]. The
      ForceMetrics announcement describes a product integration, not contracted
      revenue or customer economics [CI005]. The revenue table separates
      identifiable product streams from unavailable monetization inputs; the
      flow is an underwriting path, not a verified Mark43 transaction.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: public-sector-go-to-market
    title: Public-sector routes do not establish sales efficiency
    body: >-
      Public-sector distribution can involve procurement and grant-supported
      customer budgets, but the sources do not establish Mark43's sales cycle,
      win rates, or sales efficiency. SAM.gov provides access to opportunity,
      award, and subcontract data [CI008]; the assigned page itself identifies
      no Mark43 award [CI015]. 911.gov describes federal programs potentially
      applicable to emergency-communications projects [CI009] and, as captured
      on 2026-10-26, says no 911 Grants were open for applications [CI010]. A
      Mark43-issued survey release says 40% of UK respondents cited budget and
      funding constraints [CI011]. Treat that company-issued finding as a
      directional demand headwind, not an independent benchmark or a Mark43-
      specific lost-deal rate. Mark43's May 2026 announcement reported more
      than 300 agencies [CI006], while Axon describes a product integration
      [CI007]; neither supplies price, contract, or channel economics. Agency
      scale is not revenue.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI015
    tableRefs:
      - TI002
  - id: operating-economics
    title: Unit economics and service-delivery costs remain unquantified
    body: >-
      LeadIQ lists Mark43 in a 201-500 employee band without an as-of date
      [CI004]; Gartner's profile, updated on 2025-02-26, shows zero ratings in
      a retired category [CI016]. These are limited scale and public-validation
      signals, not evidence of revenue per employee, customer concentration,
      satisfaction, or retention. The assigned source set contains no current
      GAAP revenue, ARR, growth, or renewal metrics [CI012], and it does not
      quantify customer price, contract duration, gross margin, CAC, sales
      payback, hosting expense, implementation, support, working capital, or
      capex [CI014]. Product breadth, an integration, and a company-reported
      agency count cannot substitute for contribution margin or cohort
      retention. The unit-economics table leaves unknown values null and gives
      a specific data request for each.
    claimRefs:
      - CI004
      - CI006
      - CI012
      - CI014
      - CI016
    tableRefs:
      - TI003
  - id: capital-adequacy-verdict
    title: Public evidence cannot establish capital adequacy
    body: >-
      None of the reviewed assigned sources states current cash, monthly burn,
      runway, debt or project-finance obligations, use of funds, or a next-round
      trigger [CI013]. The SAM.gov and 911.gov pages describe buyer-side
      contracting and grant routes, not money received by Mark43 or proof of a
      customer contract [CI015]. The evidence supports product scope and
      commercial relationships, but not cash available to fund implementation,
      support, or future growth. This is a material underwriting limitation,
      not evidence that cash is exhausted or that a financing is imminent.
      Obtain audited statements, cash forecasts, debt and commitment schedules,
      and customer-level revenue and implementation cohorts before underwriting.
    claimRefs:
      - CI013
      - CI015
