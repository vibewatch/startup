artifact: market-analysis
slug: mark43
runDate: 2026-10-26
company:
  name: Mark43
chapter:
  number: 2
  title: Market Analysis
  summary: Mark43 competes in public-safety agency software spanning CAD, RMS, analytics, and mobile workflows, but the available market estimates do not isolate its addressable spend. Company-reported surveys show modernization interest alongside material system reliability and cyber concerns; procurement, implementation, and public-budget evidence remains incomplete.
sections:
  - id: market-boundary
    title: Market boundary and buying context
    body: >-
      The defensible core boundary is software sold to public-safety agencies for
      computer-aided dispatch, records management, and connected analytics and
      mobile workflows; Mark43's procurement listing also describes digital
      evidence and implementation services. Those bundled modules should not be
      conflated with physical devices, an emergency communications network, or
      the full cost of an agency's technology stack. EdgeMarket lists a
      competitive RFP procurement route, while Mark43's own announcements
      describe deployments across Florida agencies. These establish public
      agency demand and a route to purchase, not a universal procurement model
      or the identity of each agency's final budget approver. The incumbent
      alternative is continued use of legacy or fragmented systems; replacement
      therefore depends on agency readiness, integration needs, and a funded
      procurement cycle.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: sizing-limits
    title: "Market sizing: distinct lenses, not a company TAM"
    body: >-
      The two public numerical lenses are not additive or interchangeable. An
      Inc article reposted by Mark43 cites an estimated global police-software
      market of $11.6 billion, but the fetched copy provides neither a base year
      nor methodology. Frost & Sullivan's dated estimate concerns U.S.
      Next-Generation 911 systems, a narrower adjacent infrastructure category;
      its $1.19 billion 2026 value was a forecast published in 2022, not a
      current realized market measure. Neither figure isolates CAD/RMS
      procurement that Mark43 can serve, and neither provides a defensible SAM
      or SOM. A 2026 public-facing market estimate, source methodology, and
      agency-level spending denominator remain unavailable, so this chapter
      does not manufacture a bottom-up total from agency counts or survey
      interest.
    claimRefs: [CM005, CM006, CM007, CM016]
    tableRefs: [TM002]
  - id: demand-and-constraints
    title: Buyer demand, adoption drivers, and constraints
    body: >-
      The strongest demand evidence is directional rather than a measure of
      purchasing: Mark43-sponsored surveys report interest in AI, consolidated
      CAD/RMS, and fewer application silos. The 2025 survey's disclosed
      methodology describes 538 opt-in online respondents overall; the article
      does not give the subgroup denominators for its law-enforcement
      percentages. A separate 2026 report gives additional percentages but this
      article does not disclose its sample size, so the two survey vintages
      should not be treated as a trend series or market penetration. Reliability
      and cyber concerns may increase modernization urgency while also raising
      security review, integration, and continuity requirements. NG911 is a
      relevant adjacent modernization cycle, but the cited regulatory and
      grant commentary concerns 911 network transition, not general CAD/RMS
      budgets. Public contract terms and current agency budget allocations are
      too sparse to quantify adoption velocity or revenue opportunity.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM016]
    tableRefs: [TM003]
    figureRefs: [FM001]
tables:
  - id: TM001
    title: Market definition and spend boundary
    columns: [Segment/category, Included spend, Excluded spend or substitute, Buyer/payer, Relevance]
    rows:
      - [Core agency operations software, "CAD dispatch and incident workflows; RMS, case and evidence records; connected analytics and mobile applications", "Physical devices and general IT infrastructure are not quantified here", "Public-safety agency; appropriation and budget owner vary by jurisdiction", "Direct product category described in Mark43 listings"]
      - [Vendor implementation and services, "Implementation, migration, training, project oversight, and optional modules when sold with the platform", "Not evidence of recurring software revenue or a standalone market total", "Purchasing agency, subject to contract scope", "EdgeMarket lists professional services and add-ons"]
      - [NG911 infrastructure, "IP-based 911 network transition and related PSAP modernization", "Not equivalent to police CAD/RMS software; broader network and call-delivery spend excluded from core boundary", "911 authority and state/local grant recipients", "Adjacent regulatory and modernization cycle only"]
      - [Status quo and substitutes, "Retained legacy CAD/RMS, fragmented applications, or agency-selected alternatives", "No unsupported value assigned to internal build or incumbent spend", "Agency and its government budget authority", "Replacement timing depends on procurement, integration, and readiness"]
    notes: Scope is based on described product and procurement categories, not a measured spend taxonomy. NG911 is kept separate from core CAD/RMS spend; budget-owner detail and category-level expenditure are not disclosed in the assigned sources.
    claimRefs: [CM001, CM002, CM007, CM013, CM014]
  - id: TM002
    title: Public sizing lenses and unresolved addressable market
    columns: [Lens, Publisher, Period and geography, Reported value or rate, Methodology and limitation, Confidence]
    rows:
      - [Police software, "Inc. article reposted by Mark43", "Global; publication date not present in fetched copy", "$11.6 billion estimated market", "Base year, segmentation, and method are not provided in the fetched article; historical estimate, not current TAM", Low]
      - [NG911 systems, "Frost & Sullivan", "United States; 2021 estimate and 2026 forecast, published June 2022", "$888.1 million in 2021; $1.19 billion forecast for 2026; 6.1% CAGR", "Adjacent NG911 systems category; release does not expose detailed methodology and forecast is not a realized 2026 value", Medium-low]
      - [Mark43 addressable CAD/RMS spend, "No qualifying source in assigned evidence", "Current geography, buyer segment, and period not isolated", "TAM/SAM/SOM not established", "Requires current category spend, product eligibility, procurement, and implementation data", Low]
      - [Agency contract pricing, "Inc. article reposted by Mark43", "Historical example; article date not present in fetched copy", "Article describes contracts as generally six to seven figures annually and cites a $5 million, five-year San Antonio deal", "One undated historical article; not a current price card, ARR, or representative agency budget", Low]
    notes: Values retain each source's category, geography, period, and forecast status. The $11.6 billion global police-software estimate and U.S. NG911 forecast are different markets and must not be summed or used as nested TAM/SAM/SOM layers.
    claimRefs: [CM005, CM006, CM007, CM015, CM016]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns: [Segment, Buyer, User/workflow, Payer and budget owner, Adoption trigger or path]
    rows:
      - [Municipal or county law enforcement, "Police department or local government; examples are described in company materials", "Dispatchers, officers, records staff, and investigators using CAD/RMS/mobile workflows", "Agency or local-government funds; exact appropriation owner is not disclosed", "Competitive RFP is one documented EdgeMarket route; Mark43 announced Florida deployments"]
      - [State and federal public-safety agencies, "Agency procurement organization; Mark43 materials describe state, local, and federal agency reach", "Dispatch, records, and operational personnel", "Government agency budget; allocation by software module is unknown", "Agency-specific procurement and implementation; no current segment spend denominator"]
      - [PSAPs and 911 authorities, "911 authority or public-safety answering point", "Call takers and emergency communications personnel", "State/local 911 budgets and potentially restricted NG911 grant funding", "Separate NG911 network transition, readiness, and request-based milestones; not a proxy for Mark43 CAD/RMS demand"]
      - [Agency-wide platform procurement, "Agency leadership and procurement stakeholders; final budget approver not established", "Multiple functions across dispatch, field response, records, and analytics", "Contract-specific public agency funds; historical pricing is not representative", "Integration, security, continuity, and migration needs can motivate purchase but also extend evaluation"]
    notes: Segment roles are evidence-constrained. Public sources identify agency types and one competitive RFP route, but do not establish a universal budget owner, current appropriation, procurement cycle, or implementation cost.
    claimRefs: [CM002, CM003, CM004, CM013, CM014, CM015]
figures:
  - id: FM001
    title: Survey signals on modernization needs
    type: kpi
    summary: Mark43-published survey results indicate interest in modernization and operational concerns, but are not market-size or purchasing measures.
    data:
      items:
        - label: Law enforcement respondents supporting agency AI use (2025)
          value: 90
          unit: "%"
          detail: Mark43's 2025 U.S. Public Safety Trends survey; law-enforcement subgroup denominator not stated in the article.
          note: 538 opt-in online public-safety professionals overall; not a measure of procurement or deployment.
        - label: First responders reporting RMS unavailable over 10 hours a year (2025)
          value: 57
          unit: "%"
          detail: Respondents' reported RMS availability, as summarized by Mark43.
          note: Law-enforcement/first-responder denominator is not stated in the article.
        - label: First responders reporting CAD unavailable over 10 hours a year (2025)
          value: 54
          unit: "%"
          detail: Respondents' reported CAD availability, as summarized by Mark43.
          note: Law-enforcement/first-responder denominator is not stated in the article.
        - label: Law enforcement respondents finding a consolidated CAD/RMS platform helpful (2025)
          value: 99
          unit: "%"
          detail: Mark43's 2025 survey reports this share for law enforcement respondents.
          note: Subgroup denominator is not stated; stated helpfulness is not adoption intent.
        - label: U.S. first responders supporting agency AI use (2026)
          value: 93
          unit: "%"
          detail: Mark43's 2026 Public Safety Trends report as summarized by Security Today.
          note: The article does not state sample size; not directly comparable with the 2025 survey.
        - label: First responders saying multiple applications affect efficiency (2026)
          value: 89
          unit: "%"
          detail: Mark43's 2026 report result as summarized by Security Today.
          note: The article does not state sample size or subgroup denominator.
    approximationNotes: Survey response shares from different Mark43-published report vintages are kept as distinct observations; they are not market shares, customer adoption rates, or a time-series comparison.
    claimRefs: [CM009, CM010, CM011, CM012]
callouts:
  - calloutType: insight
    title: Do not underwrite from headline market estimates
    body: The $11.6 billion police-software estimate and $1.19 billion NG911 forecast describe different scopes and vintages; neither establishes Mark43's current addressable CAD/RMS spend.
    claimRefs: [CM005, CM006, CM007, CM016]
