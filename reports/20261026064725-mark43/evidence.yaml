evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-company-metrics
    missingEvidence: >-
      Current ARR, GAAP revenue, growth, gross margin, services mix, NRR, churn, customer concentration, headcount,
      cash, and debt with definitions and reporting periods.
    whyItMatters: >-
      Without current operating and financial data, diligence cannot assess growth quality, profitability, customer
      concentration, or financing needs.
    diligencePath: >-
      Request audited financial statements and a monthly operating model with metric definitions, customer cohorts,
      services mix, and cash/debt schedules.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: >-
      Round-by-round financing dates, amounts, security classes, valuation, liquidation preferences, secondary
      components, debt or credit, and current ownership.
    whyItMatters: >-
      The $370 million EquityZen total is undated and cannot establish proceeds available, fully diluted ownership, or
      investor control rights.
    diligencePath: >-
      Request the financing history, cap table, debt schedule, and executed preferred-stock and secondary transaction
      documents.
    relatedQuestionRefs:
      - QO003
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Complete current executive and board roster, director independence, decision rights, executive tenure, succession
      planning, and founder retention terms.
    whyItMatters: >-
      Leadership coverage and governance affect product execution, public-sector accountability, and continuity across
      mission-critical deployments.
    diligencePath: >-
      Request the current organization chart, board materials, governance documents, and key-person succession and
      retention plans.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A dated customer roster defining signed, deployed, and active agencies, plus renewal status, module penetration,
      contract value, and concentration.
    whyItMatters: >-
      Public agency counts range from over 120 to more than 300 and cannot establish recurring customer scale or
      retention.
    diligencePath: >-
      Request a dated customer cohort schedule reconciled to signed contracts, production deployments, renewals, and
      recognized revenue.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: cybersecurity-risk
    missingEvidence: >-
      Independent security attestations, incident and outage history, service-level performance, penetration-test
      summaries, and AI accuracy, oversight, and deployment controls.
    whyItMatters: >-
      The product supports mission-critical public-safety workflows, while the available security and AI evidence is
      largely company or sector reporting rather than independent operating evidence.
    diligencePath: >-
      Review current FedRAMP/StateRAMP authorizations and scope, SOC reports, incident register, uptime data, customer
      references, and AI evaluation and human-oversight documentation.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: minor
    topic: founding-date
