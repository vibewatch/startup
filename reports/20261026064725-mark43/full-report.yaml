  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and trigger
    rows:
      - - Bull
        - ForceMetrics integration succeeds; agencies adopt more modules; retention and margins remain strong.
        - >-
          No numeric range is supportable without verified revenue, margins, capitalization, and transaction
          consideration; upside would require evidence of durable recurring economics.
        - Conditional, not estimated; upgrade only after cohort-level revenue and integration results are verified.
      - - Base
        - Product and deployment footprint persist, but procurement cycles and financial disclosure remain opaque.
        - No numeric range or target return; hold price discipline until normalized revenue and dilution are known.
        - Current evidence favors further diligence over a calibrated probability or price.
      - - Bear
        - >-
          Procurement or funding conversion slows, security/integration burdens rise, or acquisition spending fails to
          improve customer economics.
        - >-
          Downside cannot be quantified without the capital structure, fixed obligations, cash position, and preference
          stack.
        - Material downside path; test with renewal, implementation-cost, cyber-control, and liquidity evidence.
      - - Required valuation inputs
        - >-
          ARR and GAAP revenue bridge, growth, gross margin, retention, customer concentration, cash/debt, fully diluted
          shares, and financing preferences.
        - Obtain company records and transaction documents before selecting a method or peer set.
        - Blocking for any numeric target; no unsupported probability or range is substituted.
    notes: >-
