              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Commercial evidence and what it does not price
        blocks:
          - type: paragraph
            body: >-
              The strongest deployment evidence here is HSToday's account of the Department of the Interior rollout
              across six law-enforcement programs, roughly 3,000 sworn officers, and more than 855 locations; HSToday
              attributes the account to a press release. This is meaningful implementation proof, but no contract value,
              recurring revenue, renewal, margin, or customer concentration is disclosed. Dealroom's acquisition
              coverage and Fundz's acquisition listing add a strategic expansion signal, not a transaction multiple:
              deal terms remain undisclosed. AWS Marketplace labels Mark43 "Private Offer only," which is a purchasing
              route, not a public list price. The public record thus offers no directly comparable price-to-ARR or
              price-to-revenue calculation, and a per-share indication without security class, share count, and transfer
              terms would not establish enterprise or equity value.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Demand signals and underwriting constraints
        blocks:
          - type: paragraph
            body: >-
              Mark43's own 2026 survey reports support for AI use among U.S. law-enforcement respondents, but the
              article does not provide survey sample size or methodology in the fetched text; it is company-issued
              evidence of stated interest, not a willingness-to-pay benchmark. Federal materials describe a real
              modernization agenda: CISA discusses IP-based NG911 interconnection and associated cybersecurity
              resources, while FCC rules set phased obligations for originating service providers after valid
              911-authority requests. These rules do not establish a Mark43 contract or a purchase mandate for its
              software. 911.gov lists federal assistance programs relevant to emergency communications and says no 911
              Grants are open for application on the page reviewed. CISA's warnings about cyber threats to emergency
              communications are sector-level diligence context, not evidence of a Mark43 incident. Procurement timing,
              funding eligibility, security review, and integration costs can therefore interrupt the path from category
              need to company revenue.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.4'
        title: Scenario discipline and next evidence
        blocks:
          - type: paragraph
            body: >-
              A bull case requires proof that the ForceMetrics acquisition and integrated CAD/RMS, analytics, and AI
              capabilities expand wallet share while preserving implementation quality, gross margin, and retention. The
              base case is continued product adoption without enough public financial disclosure to convert agency reach
              into a price. The bear case is slower procurement or grant conversion, security and integration burdens,
              or acquisition costs that do not translate into durable customer economics. These are conditional
              operating paths, not probability-weighted forecasts: assigned sources do not support numeric valuation
              ranges or target returns. Before investment, request audited revenue and ARR reconciliations, growth and
              gross-margin history, retention and cohort data, customer concentration, contract and implementation
              economics, acquisition consideration and integration costs, fully diluted capitalization, debt, and
              liquidation preferences. Revisit the call only after those inputs can support a model and comparable set;
              until then, no numeric entry price is defensible.
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV004
              - CV008
              - CV014
              - CV015
