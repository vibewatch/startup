      - number: '5.2'
        title: Architecture, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a workflow-level architecture rather than a verified technical design: field and
              dispatch applications feed records workflows, and company or partner materials describe shared data, APIs,
              analytics, and AI-assisted reporting. Mark43's ReportAI page says the RMS feature drafts reports from CAD
              data, body-camera transcripts, officer notes, and event context, with configurable roles for generation,
              editing, review, and approval. AUVSI also describes analytics and mobile CAD features, but its examples
              are narrative rather than measured tests. A third-party product directory lists additional names such as
              Evidence, Compliance, and Data Exchange; that listing is not proof of current availability or deployment.
              The product stack is therefore broader than the independently verifiable implementation record.
            claimRefs:
              - CE002
