              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Implementation and ecosystem dependencies
        blocks:
          - type: paragraph
            body: >-
              A connected CAD/RMS platform can reduce disconnected workflows, but it also makes reliable interfaces,
              external data sources, and customer-side operations important to service quality. CISA describes NG911
              interconnection across a wide range of public and private networks (CR007); an AUVSI feature based on
              Mark43 personnel describes an open API and integrations as product capabilities, not as independently
              tested reliability results (CR011). The DOI deployment is evidence of scale at one federal customer, not
              evidence of customer concentration across Mark43's portfolio or of contracted service performance (CR002,
              CR014). Diligence should therefore test interface failure modes, agency and supplier responsibilities,
              data portability, disaster recovery, and customer references across more than one large deployment.
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR011
              - CR012
      - number: '7.4'
        title: Financial resilience and public procurement
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient to underwrite working-capital resilience or customer funding dependence.
              Tracxn's fetched profile reports $219 million raised and a March 2024 latest-round date, but its displayed
              valuation is obscured; neither funding raised nor a secondary profile establishes cash available, burn,
              runway, or current valuation (CR013). 911.gov lists federal assistance programs relevant to emergency
              communications and states that no 911 Grants are currently open on the fetched page (CR012). That is a
              time-bound program observation, not evidence that Mark43 customers depend on grants or that all other
              funding is unavailable. Procurement timing, implementation cost, contract renewal terms, and the company's
              own liquidity remain unquantified and should be treated as diligence gaps.
            claimRefs:
              - CR012
              - CR013
      - number: '7.5'
        title: Monitoring indicators and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The evidence supports monitoring measurable service and governance outcomes, not assigning a precise
              probability to a Mark43-specific failure. The cited surveys report sector-level cyber incidents and system
              unavailability, while the retained material contains no Mark43-specific incident counts, uptime series,
              service-level agreement, or recovery-test results (CR003, CR004, CR006, CR014, CR015). Escalate diligence
              if the company cannot provide independently reviewable security attestations, incident disclosure
              procedures, recovery-time and recovery-point commitments, or customer references for severe disruptions.
              For AI products, require error and correction rates, audit-log samples, retention and access controls, and
              evidence that agency controls work in production. Any sustained outage, material breach, failed legal
              review, or inability to meet contracted recovery obligations would challenge the operating thesis; public
              evidence does not establish that any such event has occurred.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive conclusion
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with low confidence and high underwriting risk; valuation stance:
              unpriceable from the assigned public record. Dealroom reports a September 2026 ForceMetrics acquisition
              but says its terms were not disclosed, while its article reports more than 300 agency customers without
              providing revenue per agency, retention, or implementation economics. A federal deployment described by
              HSToday supports operating reach, not a revenue multiple. The current evidence therefore supports a
              plausible product-and-market thesis, but not a buy decision, a target return, or a defensible equity
              value. This is not an assertion that Mark43 lacks those metrics; they are not established by the sources
              retained for this chapter. Entry discipline should require verified financials and fully diluted
              capitalization before comparing any proposed price with an intrinsic-value range.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
