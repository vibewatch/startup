              - CE007
      - number: '5.3'
        title: Deployment evidence and operating limits
        blocks:
          - type: paragraph
            body: >-
              The clearest named implementation in the assigned evidence is New Mexico DPS: Mark43's 2024 release
              describes a statewide CAD launch with mobile dispatch, analytics, and interfaces, following earlier RMS
              use. The release quotes agency personnel on field messaging, responder visibility, and a smooth
              transition, but it supplies no deployment-duration, uptime, recovery-time, or quantified productivity
              measure. AUVSI recounts a Fort Myers hurricane scenario in which operations continued during a local
              communications outage; that account is useful as a customer-story lead, not as independently tested
              resilience evidence. The public record also does not specify offline behavior, integration test coverage,
              migration burden, or support service levels. Buyers should validate those items against a live deployment
              and contract-level service commitments.
            claimRefs:
              - CE003
              - CE004
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, cybersecurity, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public-safety workflows handle sensitive operational data, and the assigned government sources describe
              sector-level risks rather than Mark43-specific incidents or validated controls. CISA identifies
              ransomware, telephony denial-of-service, and malware as relevant 911 threats; the National 911 Program
              notes that IP-based data sharing expands cyber exposure. FCC NG911 requirements describe dependencies on
              IP-based delivery and coordination among 911 authorities and originating service providers; they do not
              establish Mark43's compliance status. The retrieved Mark43 2025 U.S. Public Safety Trends report says 84%
              of law-enforcement respondents reported that their organization experienced a cybersecurity issue in the
              last year. Its methodology describes an opt-in online survey of 538 public-safety professionals conducted
              October 2–23, 2024, with a maximum sampling error of four percentage points at 95% confidence; it does not
              state the law-enforcement subgroup denominator, and the figure is not a Mark43 product incident rate. No
              independent security assessment, AI error study, privacy-control evidence, or public developer-activity
              signal is present in the allocated text. These are material diligence requests, not evidence that a
              control or incident is absent.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              The public materials position Mark43 primarily for public-sector public-safety agencies, with police
              departments as the clearest named buyer and police/fire organizations as an adjacent deployment segment.
              Mark43 describes its platform across dispatch, records, mobile, analytics, and booking workflows. The
              strongest current scale figure is Mark43's own statement that it is trusted by over 300 agencies globally.
              That is a company-reported agency count, not an audited active-customer count, revenue measure, or
              retention statistic. Federal funding may be another purchasing route: 911.gov lists assistance that may
              apply to 911 and NG911 projects, but does not connect programs to Mark43 deployments. A Nassau County
              announcement describes four neighboring police departments moving from legacy on-premises systems, with
              three live and one scheduled to follow. In Massachusetts, Mark43 reports more than a dozen launches over
              the prior 18 months and separately names police, fire, university, and sheriff organizations. These
              announcements suggest regional, multi-agency deployments, but disclose neither the full customer mix nor
              deployment-level contract value.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU018
          - type: table
            tableRef: TU001
            claimRefs:
