  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cybersecurity and service continuity
        blocks:
          - type: paragraph
            body: >-
              Cybersecurity and availability are the most consequential evidenced risk categories because public-safety
              systems support dispatch, records, and investigations. CISA describes emergency communications centers as
              targets for attacks intended to disrupt operations, and its materials identify ransomware, telephony
              denial-of-service, and malware as relevant threats (CR003). A Mark43-sponsored survey reported
              sector-level cyber and availability problems, including RMS and CAD downtime, but those results are not
              Mark43 incident or service-level data (CR004, CR005, CR006). The 2025 DOI deployment spans six
              law-enforcement programs and about 3,000 officers across more than 850 locations; a failure in such an
              operational footprint could have broad impact within that deployment, although no Mark43 uptime or
              recovery performance is quantified in the retained evidence (CR001, CR002, CR014).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, data, and AI governance
        blocks:
          - type: paragraph
            body: >-
              The regulatory exposure is jurisdiction-specific rather than a single disclosed license question. CISA
              says emergency communications center operators should verify that intended AI uses comply with applicable
              legal and policy requirements (CR009). Mark43's April 2026 release describes configurable agency
              permissions, human oversight, audit logs, and controls for its AI products; these are company statements,
              not independent tests of model accuracy, data handling, or legal compliance (CR010). CISA also describes
              NG911 as an IP-based environment connecting public and private networks, which makes integration, access
              controls, and continuity relevant diligence topics (CR007). The available sources do not establish the
              jurisdiction-by-jurisdiction requirements applicable to each deployment or any current litigation or
              enforcement status; those remain explicit gaps rather than assumed clean records.
            claimRefs:
              - CR007
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
