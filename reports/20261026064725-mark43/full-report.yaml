              - CI006
              - CI012
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Public evidence cannot establish capital adequacy
        blocks:
          - type: paragraph
            body: >-
              None of the reviewed assigned sources states current cash, monthly burn, runway, debt or project-finance
              obligations, use of funds, or a next-round trigger [CI013]. The SAM.gov and 911.gov pages describe
              buyer-side contracting and grant routes, not money received by Mark43 or proof of a customer contract
              [CI015]. The evidence supports product scope and commercial relationships, but not cash available to fund
              implementation, support, or future growth. This is a material underwriting limitation, not evidence that
              cash is exhausted or that a financing is imminent. Obtain audited statements, cash forecasts, debt and
              commitment schedules, and customer-level revenue and implementation cohorts before underwriting.
            claimRefs:
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and agency workflows
        blocks:
          - type: paragraph
            body: >-
              Mark43 sells a public-safety operations platform organized around computer-aided dispatch (CAD), records
              management (RMS), mobile access, and analytics. AWS describes the suite as mobile-first and cloud-native;
              AUVSI describes CAD, RMS, and analytics within a unified environment, and the AWS Marketplace seller
              listing places those functions across dispatch, response, reporting, investigation, and operational
              management. These are product descriptions, not comparative performance results. Mark43's May 2024 release
              says New Mexico DPS added CAD, mobile dispatch, analytics, and interfaces to an RMS relationship that
              began in March 2023. It attributes to agency users the ability to prioritize calls, see responder status
              and location, and receive field messages on multiple device types.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
