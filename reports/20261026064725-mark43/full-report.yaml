  - id: FR001
    title: Risk evidence and mitigation maturity
    type: matrix
    summary: >-
      Qualitative comparison of documented sector exposure with Mark43-specific evidence and the remaining diligence
      burden.
    data:
      columns:
        - Impact evidence
        - Likelihood evidence
        - Mitigation evidence
        - Residual exposure / diligence
      rows:
        - label: Cybersecurity
          values:
            - CISA identifies attacks intended to disrupt emergency operations
            - Sector survey evidence; Mark43 incident rate unknown
            - Mark43 describes controls; independent tests are unavailable
            - Request current attestations, incident history, and response exercises
        - label: Availability
          values:
            - CAD/RMS downtime can affect dispatch and records workflows
            - Survey evidence is sector-level; Mark43 uptime is unknown
            - No Mark43 SLA or recovery-test result is in the assigned evidence
            - Obtain uptime history, recovery commitments, and customer references
        - label: AI governance
          values:
            - Potential legal and evidentiary effects depend on agency use
            - Mark43-specific error and correction rates are unavailable
            - Mark43 describes human oversight and audit logs
            - Review production evaluations, overrides, retention, and audit samples
        - label: Integration
          values:
            - Interconnected systems create deployment-specific failure exposure
            - Interface failure probability is unquantified
            - CISA guidance and an open-API description; no reliability testing
            - Map critical integrations, ownership, portability, and fallback tests
        - label: Procurement / grants
          values:
            - Delayed awards could defer agency procurement; company impact unknown
            - Customer grant dependence is not established
            - 911.gov lists assistance programs; no 911 Grants are currently open
            - Request customer funding mix, backlog, renewal timing, and termination terms
        - label: Financial resilience
          values:
            - Liquidity or working-capital exposure cannot be quantified publicly
            - Tracxn reports funding raised, not current cash or runway
            - No current cash, debt, or burn evidence is in the assigned sources
            - Obtain current financial statements, debt schedules, and runway scenarios
    approximationNotes: >-
      Qualitative evidence map only; it does not assign numeric probability, rank zones, or imply that an incident has
      occurred at Mark43.
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operating and demand evidence supports diligence, while missing financial and transaction inputs prevent a
      defensible price.
    data:
      nodes:
        - id: operating-proof
          label: Deployment and product evidence
          detail: Federal deployment and product integration support further diligence, not revenue estimates.
        - id: acquisition-expansion
          label: ForceMetrics expansion
          detail: The acquisition rationale is strategic; undisclosed terms prevent a transaction multiple.
        - id: market-conditions
          label: Public-sector demand with execution constraints
          detail: Modernization, funding, procurement, cybersecurity, and integration shape conversion.
        - id: procurement-boundary
          label: Conversion is not guaranteed
          detail: Funding programs and transition rules do not establish Mark43 bookings or a purchase mandate.
        - id: valuation-gap
          label: Missing price-setting inputs
          detail: Revenue, margins, cap table, deal terms, and preferences are not established in assigned evidence.
        - id: decision
          label: Research-more; no numeric entry price
          detail: Reassess after private financial and capitalization diligence.
      edges:
        - from: operating-proof
          to: acquisition-expansion
        - from: acquisition-expansion
          to: market-conditions
        - from: market-conditions
          to: procurement-boundary
        - from: procurement-boundary
          to: valuation-gap
        - from: valuation-gap
          to: decision
    claimRefs:
      - CV003
      - CV006
      - CV004
      - CV008
      - CV014
      - CV015
