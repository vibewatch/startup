      - number: '6.2'
        title: Adoption evidence and customer proof
        blocks:
          - type: paragraph
            body: >-
              The available adoption evidence consists mainly of named deployments and customer quotations carried in
              Mark43 releases or company-oriented coverage. The Nassau release identifies four agencies and reports
              three as live at publication, while Mark43's Massachusetts announcement names new agency relationships and
              reports launch activity. These are useful evidence of selected implementations, but the issuer controls
              the release and the materials provide no contract records, customer-side implementation measures, or
              independent confirmation of the aggregate footprint. Quoted agency officials describe legacy-system
              limitations, mobility, data sharing, and modernization needs; those statements establish the stated
              rationale, not measured savings or realized outcomes. AUVSI's article recounts a Fort Myers Police
              Department resilience example, but it is not a customer-authored evaluation. A 2026 Mark43-issued survey
              article reports that 90% of law-enforcement respondents said their organization had experienced a cyber
              issue in the prior year, up from 84%; its fetched text does not state sample size or methodology. This is
              company-reported survey evidence, not proof that respondents use Mark43 or that adoption improves agency
              performance.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU014
