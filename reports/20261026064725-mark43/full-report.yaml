      - number: '3.3'
        title: Commercial access and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              The only concrete channel evidence is EdgeMarket: Edge and Mark43 announced that member institutions could
              procure Mark43 through Edge's cooperative platform, with the announcement describing relief from
              individual RFP processes. This is partner-issued distribution evidence, not proof of contract conversion,
              sales efficiency, or lower realized prices. The reviewed product and comparison pages do not supply
              comparable license prices, implementation fees, discounts, renewal terms, or total cost of ownership for
              Mark43 and the named alternatives. Agency procurement documents and redacted proposals are therefore
              needed before inferring price advantage or a durable commercial moat.
            claimRefs:
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Durability, buyer friction and disconfirming signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a plausible value proposition around integrated workflows, mobility and data
              exchange, but not a demonstrated moat. Gartner Peer Insights showed zero Mark43 ratings on a page for a
              market marked retired; this is a thin review signal, not evidence of poor satisfaction or product failure.
              GINA's critique of Mark43's law-enforcement focus is competitor-authored and should be treated as a claim
              to test in multi-discipline procurements. Mark43's own 2026 survey reports widespread cyber issues and
              manual data transfer among respondents, which describes sector pain rather than incidents at Mark43 or a
              comparison of vendor outcomes. Dealroom's report on ForceMetrics and Axon's earlier Prepared agreement
              indicate strategic activity around consolidating data and call workflows, but do not prove that Mark43
              wins or loses against those offerings. The pool contains no customer win/loss evidence, switching-cost
              data, customer-built alternatives, or independent feature benchmark; these remain diligence priorities.
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Product scope is visible; monetization is not
        blocks:
          - type: paragraph
            body: >-
              Mark43's own company page presents its platform as core operating software for public-safety agencies
              [CI001], and its company and CAD pages describe CAD and RMS capabilities [CI002]. A public-safety
              technology directory also lists mobile field tools and analytics [CI003], but these descriptions establish
              product scope, not a bundle purchased by any one agency. The assigned pages disclose neither list prices,
              realized discounts, contract values, billing units, nor revenue-recognition policy [CI012]. The
              ForceMetrics announcement describes a product integration, not contracted revenue or customer economics
              [CI005]. The revenue table separates identifiable product streams from unavailable monetization inputs;
              the flow is an underwriting path, not a verified Mark43 transaction.
