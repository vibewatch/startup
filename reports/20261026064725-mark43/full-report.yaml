      - number: '4.2'
        title: Public-sector routes do not establish sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Public-sector distribution can involve procurement and grant-supported customer budgets, but the sources
              do not establish Mark43's sales cycle, win rates, or sales efficiency. SAM.gov provides access to
              opportunity, award, and subcontract data [CI008]; the assigned page itself identifies no Mark43 award
              [CI015]. 911.gov describes federal programs potentially applicable to emergency-communications projects
              [CI009] and, as captured on 2026-10-26, says no 911 Grants were open for applications [CI010]. A
              Mark43-issued survey release says 40% of UK respondents cited budget and funding constraints [CI011].
              Treat that company-issued finding as a directional demand headwind, not an independent benchmark or a
              Mark43- specific lost-deal rate. Mark43's May 2026 announcement reported more than 300 agencies [CI006],
              while Axon describes a product integration [CI007]; neither supplies price, contract, or channel
              economics. Agency scale is not revenue.
