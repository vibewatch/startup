              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Expansion signals are present but narrow: Mark43 says Boston Police Department expanded its existing
              relationship to Booking, and it announced a partnership with Mi-Case to connect its
              CAD/RMS/mobile/analytics suite with a jail management system. The partnership describes an intended
              combined offering, not evidence that a customer has deployed it. Mark43 also reports over 300 agencies in
              two company releases, but those repeated statements share the same issuer and do not independently
              corroborate the total. On Gartner Peer Insights, the fetched Mark43 vendor page showed zero ratings; that
              is a bounded absence of reviews on that page, not evidence that Mark43 has no customers or dissatisfied
              users. GovWare Reviews calls pricing non-public and positions the product as premium, without providing an
              underlying quote or customer evidence. The reviewed materials disclose no NRR, GRR, churn, renewal, cohort
              usage, or top-customer share. Consequently, adoption durability, customer economics, and concentration
              remain open diligence items rather than conclusions inferred from logos or aggregate agency claims.
              Motorola Solutions' own command-center page describes an adjacent public-safety software offering, but it
              does not establish customer overlap, Mark43 displacement, or comparative performance.
            claimRefs:
              - CU002
              - CU011
              - CU012
              - CU013
              - CU015
              - CU016
              - CU017
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is not yet durability
            body: >-
              Company-reported agency counts and selected launch stories demonstrate reach, but do not establish active
              usage, renewal, retention, customer concentration, or independently measured outcomes.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
