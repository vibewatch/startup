      - number: '4.3'
        title: Unit economics and service-delivery costs remain unquantified
        blocks:
          - type: paragraph
            body: >-
              LeadIQ lists Mark43 in a 201-500 employee band without an as-of date [CI004]; Gartner's profile, updated
              on 2025-02-26, shows zero ratings in a retired category [CI016]. These are limited scale and
              public-validation signals, not evidence of revenue per employee, customer concentration, satisfaction, or
              retention. The assigned source set contains no current GAAP revenue, ARR, growth, or renewal metrics
              [CI012], and it does not quantify customer price, contract duration, gross margin, CAC, sales payback,
              hosting expense, implementation, support, working capital, or capex [CI014]. Product breadth, an
              integration, and a company-reported agency count cannot substitute for contribution margin or cohort
              retention. The unit-economics table leaves unknown values null and gives a specific data request for each.
            claimRefs:
