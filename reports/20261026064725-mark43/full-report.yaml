  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The clearest direct comparisons are CAD and public-safety operating suites: Mark43, Tyler, GINA Smart CAD,
              Octave and CentralSquare. GINA's May 2026 competitor-authored comparison presents its own Smart CAD as a
              multi-sector, on-premises alternative, and characterizes Mark43 as more law-enforcement-focused; that
              characterization is an interested vendor's view, not an independent benchmark. Tyler's own public-safety
              page describes multi-agency dispatch alongside Fire & EMS, mobile, records and analytics offerings.
              Motorola's cited page is a narrower substitute at the emergency-call-handling layer, while Prepared is an
              adjacent call-intelligence product whose 2025 acquisition announcement does not establish its present
              ownership or product status. Mark43's 2026 acquisition of ForceMetrics points to a further
              data-orchestration adjacency. Across these profiles, company-reported user or agency counts are not
              directly comparable: the units, populations, and reporting dates differ, and most vendors disclose no
              scale in this pool.
