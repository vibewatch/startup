      - number: '3.2'
        title: Capability, deployment and trust posture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a product-scope comparison, not a measured performance ranking.       Public Safety
              Tech Source describes Mark43 as a cloud-native, integrated public-safety platform, and Gartner's profile
              lists CAD, RMS, analytics, and property and evidence based on public information updated in 2023. AUVSI's
              2025 feature describes an open API and unified environment through Mark43 executives, and reports an
              executive's FedRAMP High certification statement. Tyler's official page documents multi-agency dispatch,
              Fire & EMS, mobile operations, records and analytics. Motorola presents cloud-native VESTA NXT and
              on-premises VESTA 911, plus mapping and analytics, but the assigned page does not establish equivalent
              CAD/RMS coverage. GINA's comparison describes Octave and CentralSquare deployment choices, but provides no
              independent validation. No source in the pool compares implementation time, uptime, AI accuracy,
              interoperability outcomes, security incidents by vendor, or switching effort on a common basis.
