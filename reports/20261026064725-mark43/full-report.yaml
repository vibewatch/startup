  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying context
        blocks:
          - type: paragraph
            body: >-
              The defensible core boundary is software sold to public-safety agencies for computer-aided dispatch,
              records management, and connected analytics and mobile workflows; Mark43's procurement listing also
              describes digital evidence and implementation services. Those bundled modules should not be conflated with
              physical devices, an emergency communications network, or the full cost of an agency's technology stack.
              EdgeMarket lists a competitive RFP procurement route, while Mark43's own announcements describe
              deployments across Florida agencies. These establish public agency demand and a route to purchase, not a
              universal procurement model or the identity of each agency's final budget approver. The incumbent
              alternative is continued use of legacy or fragmented systems; replacement therefore depends on agency
              readiness, integration needs, and a funded procurement cycle.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
              - CM014
      - number: '2.2'
        title: 'Market sizing: distinct lenses, not a company TAM'
        blocks:
          - type: paragraph
            body: >-
              The two public numerical lenses are not additive or interchangeable. An Inc article reposted by Mark43
              cites an estimated global police-software market of $11.6 billion, but the fetched copy provides neither a
              base year nor methodology. Frost & Sullivan's dated estimate concerns U.S. Next-Generation 911 systems, a
              narrower adjacent infrastructure category; its $1.19 billion 2026 value was a forecast published in 2022,
              not a current realized market measure. Neither figure isolates CAD/RMS procurement that Mark43 can serve,
              and neither provides a defensible SAM or SOM. A 2026 public-facing market estimate, source methodology,
              and agency-level spending denominator remain unavailable, so this chapter does not manufacture a bottom-up
              total from agency counts or survey interest.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
      - number: '2.3'
        title: Buyer demand, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand evidence is directional rather than a measure of purchasing: Mark43-sponsored surveys
              report interest in AI, consolidated CAD/RMS, and fewer application silos. The 2025 survey's disclosed
              methodology describes 538 opt-in online respondents overall; the article does not give the subgroup
              denominators for its law-enforcement percentages. A separate 2026 report gives additional percentages but
              this article does not disclose its sample size, so the two survey vintages should not be treated as a
              trend series or market penetration. Reliability and cyber concerns may increase modernization urgency
              while also raising security review, integration, and continuity requirements. NG911 is a relevant adjacent
              modernization cycle, but the cited regulatory and grant commentary concerns 911 network transition, not
              general CAD/RMS budgets. Public contract terms and current agency budget allocations are too sparse to
              quantify adoption velocity or revenue opportunity.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM013
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite from headline market estimates
            body: >-
              The $11.6 billion police-software estimate and $1.19 billion NG911 forecast describe different scopes and
              vintages; neither establishes Mark43's current addressable CAD/RMS spend.
            calloutType: insight
