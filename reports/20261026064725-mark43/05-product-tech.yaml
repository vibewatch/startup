  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-ai-governance
      missingEvidence: Independent current evidence for security assessments, incident response, privacy/data-retention controls, AI accuracy, error handling, and human-override effectiveness in production deployments.
      whyItMatters: CAD/RMS deployments process sensitive public-safety information and can affect time-critical dispatch and reporting; vendor descriptions and sector-level threat guidance do not establish control effectiveness.
      diligencePath: Request current independent security assessment materials, deployment-specific control mappings, incident-response and notification terms, AI evaluation results, data-retention schedules, and customer references able to validate production controls.
