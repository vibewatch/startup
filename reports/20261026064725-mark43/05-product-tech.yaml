chapter:
  number: 5
  title: Product & Technology
  summary: Mark43's public product evidence describes a cloud-native public-safety suite connecting CAD, RMS, mobile workflows, analytics, and AI-assisted reporting; one named 2024 deployment documents these capabilities in use, while an announced 2026 acquisition expands the integration ambition. Public materials do not independently establish uptime, AI accuracy, security-control effectiveness, or implementation economics, so technical diligence should focus on production evidence and data governance.
sections:
  - id: product-workflow
    title: Product scope and agency workflows
    body: >-
      Mark43 sells a public-safety operations platform organized around computer-aided
      dispatch (CAD), records management (RMS), mobile access, and analytics. AWS describes
      the suite as mobile-first and cloud-native; AUVSI describes CAD, RMS, and analytics
      within a unified environment, and the AWS Marketplace seller listing places those
      functions across dispatch, response, reporting, investigation, and operational
      management. These are product descriptions, not comparative performance results.
      Mark43's May 2024 release says New Mexico DPS added CAD, mobile dispatch, analytics,
      and interfaces to an RMS relationship that began in March 2023. It attributes to
      agency users the ability to prioritize calls, see responder status and location,
      and receive field messages on multiple device types.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, integration, and maturity
    body: >-
      The evidence supports a workflow-level architecture rather than a verified technical
      design: field and dispatch applications feed records workflows, and company or
      partner materials describe shared data, APIs, analytics, and AI-assisted reporting.
      Mark43's ReportAI page says the RMS feature drafts reports from CAD data, body-camera
      transcripts, officer notes, and event context, with configurable roles for generation,
      editing, review, and approval. AUVSI also describes analytics and mobile CAD features,
      but its examples are narrative rather than measured tests. A third-party product
      directory lists additional names such as Evidence, Compliance, and Data Exchange;
      that listing is not proof of current availability or deployment. The product stack
      is therefore broader than the independently verifiable implementation record.
    claimRefs: [CE002, CE005, CE006, CE007]
    figureRefs: [FE001]
    tableRefs: [TE003]
  - id: deployment-and-implementation
    title: Deployment evidence and operating limits
    body: >-
      The clearest named implementation in the assigned evidence is New Mexico DPS:
      Mark43's 2024 release describes a statewide CAD launch with mobile dispatch,
      analytics, and interfaces, following earlier RMS use. The release quotes agency
      personnel on field messaging, responder visibility, and a smooth transition, but it
      supplies no deployment-duration, uptime, recovery-time, or quantified productivity
      measure. AUVSI recounts a Fort Myers hurricane scenario in which operations continued
      during a local communications outage; that account is useful as a customer-story
      lead, not as independently tested resilience evidence. The public record also does
      not specify offline behavior, integration test coverage, migration burden, or support
      service levels. Buyers should validate those items against a live deployment and
      contract-level service commitments.
    claimRefs: [CE003, CE004, CE014, CE015]
  - id: trust-and-validation
    title: Trust, cybersecurity, and diligence gaps
    body: >-
      Public-safety workflows handle sensitive operational data, and the assigned
      government sources describe sector-level risks rather than Mark43-specific incidents
      or validated controls. CISA identifies ransomware, telephony denial-of-service, and
      malware as relevant 911 threats; the National 911 Program notes that IP-based data
      sharing expands cyber exposure. FCC NG911 requirements describe dependencies on
      IP-based delivery and coordination among 911 authorities and originating service
      providers; they do not establish Mark43's compliance status. The retrieved Mark43
      2025 U.S. Public Safety Trends report says 84% of law-enforcement respondents
      reported that their organization experienced a cybersecurity issue in the last
      year. Its methodology describes an opt-in online survey of 538 public-safety
      professionals conducted October 2–23, 2024, with a maximum sampling error of four
      percentage points at 95% confidence; it does not state the law-enforcement subgroup
      denominator, and the figure is not a Mark43 product incident rate. No independent
      security assessment, AI error study, privacy-control evidence, or public
      developer-activity signal is present in the allocated text. These are material
      diligence requests, not evidence that a control or incident is absent.
    claimRefs: [CE010, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module and maturity matrix
    columns: [Module or asset, User, Public maturity signal, Differentiation evidenced, Diligence gap]
    rows:
      - [CAD, Dispatchers and call takers, "New Mexico DPS launch described in May 2024 company release", "Call prioritization, unit status/location, and field messaging described for one implementation", "Request live uptime, failover, interface inventory, and jurisdiction-specific deployment references"]
      - [RMS, "Officers, records staff, and investigators", "New Mexico DPS reported RMS use beginning March 2023", "Connected reporting and records workflow with CAD in company materials", "Validate migration effort, record integrity, retention, export, and records-sealing workflows"]
      - [Mobile / OnScene, Field responders, "Mobile CAD and field tools described; New Mexico deployment is a named example", "Access to incident context and field messaging across devices", "Test offline behavior, device support, mobile security, and synchronization conflicts"]
      - [Analytics / Insights / Data Lake, Agency analysts and managers, "Product functions described by AWS and AUVSI; no independent performance benchmark supplied", "Operational reporting and analytics positioned alongside CAD/RMS", "Request data model, refresh latency, export paths, and tested analytical use cases"]
      - [ReportAI, Officers and supervisors, "Product page describes RMS-embedded AI-assisted report drafting and role controls", "Uses CAD, body-camera transcript, officer-note, and event context per company description", "Validate accuracy, source attribution, retention, human review, and measured time savings"]
      - [ForceMetrics, "Dispatchers, investigators, and agency users", "Dealroom reports acquisition announced September 28, 2026; integration status is not specified", "Acquired capability is described as linking fragmented systems and making data available to AI", "Request integration roadmap, customer migration plan, data-rights terms, and product availability"]
      - [Evidence / Compliance / Data Exchange, Agency personnel and system administrators, "Names appear in a third-party vendor-directory listing only", "Directory descriptions suggest adjacent records, compliance, and connectivity functions", "Confirm current SKUs, release status, supported interfaces, and customer deployments"]
    notes: >-
      Product descriptions and maturity signals are attributed to the cited company,
      partner, or directory source. The New Mexico deployment is one named example;
      the directory listing does not establish availability, customer adoption, or
      technical performance. Missing fields are diligence requests, not negative findings.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009]
  - id: TE002
    title: Workflow and use-case evidence
    columns: [User job, Publicly described workflow, Measurable benefit evidence, Limitation]
    rows:
      - [Dispatcher, "Prioritize calls, view responder status/location, and send field messages in the New Mexico DPS account", "No response-time or dispatch-efficiency measure in the release", "One company-published deployment account; validate actual operational metrics"]
      - [Field officer, "Use mobile CAD/RMS context and draft reports with CAD, body-camera transcript, notes, and event context", "AUVSI describes less repetitive work as an intended benefit; no measured time study is supplied", "Product and customer-story claims require workflow observation and error review"]
      - [Supervisor or analyst, "Use analytics and AI-assisted reporting to review operational data and reports", "No independent accuracy, completeness, or decision-quality outcome is provided", "Request role-level permissions, data lineage, correction rates, and production evaluations"]
    notes: >-
      This table separates described workflows from measured outcomes. Company and
      third-party narrative examples do not establish causal productivity or public-safety
      impact.
    claimRefs: [CE003, CE004, CE005, CE006, CE014]
  - id: TE003
    title: Technology dependencies and risk register
    columns: [Layer or process, Role, Dependency or interface, Technical risk and diligence test]
    rows:
      - [Field and mobile access, "Carry CAD/RMS workflows to responders", "Agency devices, wireless connectivity, and synchronization with dispatch/records", "Test degraded-connectivity operation, data conflicts, supported devices, and recovery behavior"]
      - [CAD/RMS integration, "Connect dispatch, incident, reporting, and investigation workflows", "Agency records, maps, radios, and third-party interfaces; product materials describe APIs/shared data", "Obtain interface specifications, versioning policy, integration test coverage, and data ownership terms"]
      - [NG911 ecosystem, "Support emergency communications workflows where agencies transition to IP-based systems", "911 authority readiness, originating-service-provider delivery, standards, and connectivity testing", "Map Mark43's actual contractual role per deployment; FCC requirements cited here are not a Mark43 certification"]
      - [AI-assisted reporting, "Draft and review report narratives", "CAD, body-camera transcripts, officer notes, event context, and role-based controls", "Measure hallucination/error rates, traceability, retention, access permissions, and human override behavior"]
      - [Cybersecurity and resilience, "Protect sensitive emergency-response operations and data", "Agency networks, cloud service boundaries, identity controls, and incident-response processes", "Request independent assessments, incident history, uptime/SLA, RTO/RPO, and tested recovery evidence"]
      - [ForceMetrics integration, "Link data across fragmented agency systems", "Acquired product, customer data rights, and interfaces across jurisdictions and technology generations", "Confirm integration sequence, supported sources, migration scope, security boundary, and production status"]
    notes: >-
      FCC and government cybersecurity references describe sector dependencies and threats,
      not Mark43 obligations or control effectiveness in a particular deployment. Validate
      each interface and service commitment with the agency and vendor.
    claimRefs: [CE003, CE005, CE006, CE008, CE009, CE010, CE011, CE012]
