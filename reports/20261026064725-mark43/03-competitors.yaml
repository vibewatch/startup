  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor-pricing
      missingEvidence: Comparable dated quotes and contracts showing license units, realized prices, discounts, implementation, support, renewal and termination terms for Mark43 and relevant alternatives.
      whyItMatters: Without comparable total-cost evidence, agencies' willingness to pay, price positioning and switching economics cannot be underwritten.
      diligencePath: Obtain redacted proposals and executed contracts from comparable agencies, then normalize module scope, agency size, term and implementation obligations.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: competitor-scale
      missingEvidence: Comparable active-agency counts, user definitions, geography, product penetration, renewal rates and customer concentration for each named platform.
      whyItMatters: Company-reported users, agencies and multi-product claims use different denominators and cannot establish relative market position or retention.
      diligencePath: Request vendor-defined customer cohorts and validate a sample through public procurement awards, agency references and renewal records.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP001]
    - type: private-evidence-only
      severity: material
      topic: switching-costs-and-lock-in
      missingEvidence: Customer evidence on migration duration, implementation burden, data portability, multi-homing, contract exclusivity and switching or renewal rates.
      whyItMatters: Integration and platform breadth can create value but do not, by themselves, demonstrate durable lock-in or lower churn.
      diligencePath: Interview recent adopters and agencies that switched or evaluated multiple platforms; review anonymized migration plans and renewal cohorts.
      relatedTableRefs: [TP002]
    - type: missing-source
      severity: material
      topic: internal-build-and-incumbent-substitutes
      missingEvidence: Procurement records or customer interviews documenting in-house builds, incumbent-system retention, replacement decisions and failed or delayed implementations.
      whyItMatters: Vendor comparison pages omit the status quo and may overstate the addressable set of agencies actively replacing systems.
      diligencePath: Sample public RFPs, award notices and canceled procurements across agencies of different sizes and disciplines.
      relatedTableRefs: [TP001]
    - type: stale
      severity: material
      topic: prepared-transaction-status
      missingEvidence: Current confirmation of whether Axon's announced acquisition of Prepared closed and what products, customers and contracts are currently available.
      whyItMatters: The September 2025 agreement announcement is not evidence of present ownership, integration or product availability.
      diligencePath: Verify transaction completion and current product terms from an eligible current official source before treating Prepared as an active independent vendor.
      relatedQuestionRefs: [QP009]
