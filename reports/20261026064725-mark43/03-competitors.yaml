schemaVersion: "report-v2"
artifact: competitors
slug: mark43
runDate: 2026-10-26
company:
  name: Mark43
chapter:
  number: 3
  title: Competitors
  summary: >-
    The documented field spans integrated CAD/RMS platforms (Mark43, Tyler, GINA,
    Octave and CentralSquare), emergency call-handling portfolios, and adjacent
    data-orchestration products. Mark43's feature and channel statements are
    mostly company- or partner-issued; the assigned pool does not establish
    comparable pricing, independent adoption benchmarks, or durable switching
    costs.
sections:
  - id: landscape
    title: Competitive set and disclosed scale
    body: >-
      The clearest direct comparisons are CAD and public-safety operating suites:
      Mark43, Tyler, GINA Smart CAD, Octave and CentralSquare. GINA's May 2026
      competitor-authored comparison presents its own Smart CAD as a
      multi-sector, on-premises alternative, and characterizes Mark43 as more
      law-enforcement-focused; that characterization is an interested vendor's
      view, not an independent benchmark. Tyler's own public-safety page
      describes multi-agency dispatch alongside Fire & EMS, mobile, records and
      analytics offerings. Motorola's cited page is a narrower substitute at
      the emergency-call-handling layer, while Prepared is an adjacent
      call-intelligence product whose 2025 acquisition announcement does not
      establish its present ownership or product status. Mark43's 2026
      acquisition of ForceMetrics points to a further data-orchestration
      adjacency. Across these profiles, company-reported user or agency counts
      are not directly comparable: the units, populations, and reporting dates
      differ, and most vendors disclose no scale in this pool.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP012, CP013, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-deployment
    title: Capability, deployment and trust posture
    body: >-
      The evidence supports a product-scope comparison, not a measured
      performance ranking.       Public Safety Tech Source describes Mark43 as a cloud-native, integrated
      public-safety platform, and Gartner's profile lists CAD, RMS, analytics,
      and property and evidence based on public information updated in 2023.
      AUVSI's 2025 feature describes an open API and unified environment
      through Mark43 executives, and reports an executive's FedRAMP High
      certification statement. Tyler's official page
      documents multi-agency dispatch, Fire & EMS, mobile operations, records
      and analytics. Motorola presents cloud-native VESTA NXT and on-premises
      VESTA 911, plus mapping and analytics, but the assigned page does not
      establish equivalent CAD/RMS coverage. GINA's comparison describes
      Octave and CentralSquare deployment choices, but provides no independent
      validation. No source in the pool compares implementation time, uptime,
      AI accuracy, interoperability outcomes, security incidents by vendor,
      or switching effort on a common basis.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP009, CP010]
    tableRefs: [TP002]
  - id: commercial-access
    title: Commercial access and pricing evidence
    body: >-
      The only concrete channel evidence is EdgeMarket: Edge and Mark43
      announced that member institutions could procure Mark43 through Edge's
      cooperative platform, with the announcement describing relief from
      individual RFP processes. This is partner-issued distribution evidence,
      not proof of contract conversion, sales efficiency, or lower realized
      prices. The reviewed product and comparison pages do not supply
      comparable license prices, implementation fees, discounts, renewal
      terms, or total cost of ownership for Mark43 and the named alternatives.
      Agency procurement documents and redacted proposals are therefore needed
      before inferring price advantage or a durable commercial moat.
    claimRefs: [CP011]
    tableRefs: [TP003]
  - id: durability-and-gaps
    title: Durability, buyer friction and disconfirming signals
    body: >-
      Public evidence supports a plausible value proposition around integrated
      workflows, mobility and data exchange, but not a demonstrated moat.
      Gartner Peer Insights showed zero Mark43 ratings on a page for a market
      marked retired; this is a thin review signal, not evidence of poor
      satisfaction or product failure. GINA's critique of Mark43's
      law-enforcement focus is competitor-authored and should be treated as a
      claim to test in multi-discipline procurements. Mark43's own 2026 survey
      reports widespread cyber issues and manual data transfer among
      respondents, which describes sector pain rather than incidents at
      Mark43 or a comparison of vendor outcomes. Dealroom's report on
      ForceMetrics and Axon's earlier Prepared agreement indicate strategic
      activity around consolidating data and call workflows, but do not prove
      that Mark43 wins or loses against those offerings. The pool contains no
      customer win/loss evidence, switching-cost data, customer-built
      alternatives, or independent feature benchmark; these remain diligence
      priorities.
    claimRefs: [CP003, CP004, CP012, CP013, CP014, CP015, CP016]
tables:
  - id: TP001
    title: Competitor and substitute profiles
    columns: [Offering, Category and target, Public scale in assigned sources, Disclosed scope or differentiation, Limitation or evidence boundary]
    rows:
      - [Mark43, "Direct: public-safety agencies; GINA characterizes its focus as law enforcement", "Over 300 agencies, per a March 2026 partner announcement; company statement, not independently verified", "Cloud-native CAD, RMS, mobile, reporting and analytics platform", "No comparable public pricing; Gartner page displayed zero ratings in a market marked retired; neither establishes product quality"]
      - [GINA Smart CAD, "Direct/adjacent: fire, EMS, law enforcement, search and rescue, utilities and humanitarian response", "GINA's May 2026 article claims 250,000+ users across 50+ countries", "On-premises dispatch; multi-sector workflows, resource management and field capabilities described by GINA", "GINA says its North American installed base is smaller; all comparisons are vendor-authored"]
      - [Tyler Technologies, "Direct incumbent: law enforcement, fire, EMS and multi-agency dispatch", "Not disclosed in assigned sources", "Official page lists CAD, Fire & EMS, mobile operations, records and analytics", "The GINA comparison's concerns about implementation and ecosystem flexibility are not independent findings"]
      - [Motorola Solutions, "Adjacent substitute: public-safety answering points and emergency call handling", "Not disclosed in assigned sources", "VESTA NXT cloud-native and VESTA 911 on-premises; mapping and analytics products", "The reviewed page does not establish a like-for-like CAD/RMS suite or comparable pricing"]
      - [Octave, "Direct/adjacent: fire, EMS, law enforcement and emergency communications, per GINA's comparison", "Not disclosed in assigned sources", "GINA describes a CAD/RMS/field-operations suite and on-premises or cloud/SaaS options", "Deployment and product descriptions come from a competitor-authored comparison"]
      - [CentralSquare, "Direct incumbent: law enforcement, fire and EMS, per GINA's comparison", "Not disclosed in assigned sources", "GINA describes multi-jurisdiction CAD and on-premises, cloud or hybrid options", "No official CentralSquare page or independent evaluation is in the assigned pool"]
      - [Prepared / Axon, "Adjacent entrant: emergency call intelligence and communications", "Axon's September 2025 announcement said Prepared supported 1,000+ agencies in 49 states", "Prepared described a single view of call audio, text, video, GPS and translation", "Axon announced an agreement to acquire Prepared; the assigned evidence does not establish closing or current product status"]
      - [ForceMetrics, "Adjacent data-orchestration product acquired by Mark43, as reported by Dealroom", "Not disclosed in assigned sources", "Dealroom says it connects fragmented agency data across systems and jurisdictions", "Dealroom reports terms were not disclosed; no independent customer or integration outcomes are supplied"]
    notes: >-
      Scale figures are publisher- or company-attributed, use different units
      and dates, and are not comparable market shares. GINA's competitive
      assessments are interested-party claims; gaps marked as undisclosed mean
      only that the assigned sources did not provide the metric.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP012, CP013, CP014]
  - id: TP002
    title: Capability and deployment comparison
    columns: [Buying criterion, Mark43, GINA Smart CAD, Tyler Technologies, Motorola Solutions, Evidence limitation]
    rows:
      - ["CAD / RMS coverage", "CAD, RMS and analytics are described as one cloud-native platform", "On-premises CAD is described; equivalent RMS scope is not established here", "CAD, records and related public-safety offerings are listed", "Call handling and analytics are listed; equivalent CAD/RMS coverage is not established", "Vendor pages and GINA's competitor comparison are not a common product test"]
      - ["Discipline breadth", "GINA characterizes Mark43 as primarily law-enforcement-focused", "GINA says it serves fire, EMS, law enforcement and other sectors", "Tyler lists law enforcement, fire and EMS solutions", "The reviewed page is oriented to PSAP call handling", "Target segments are publisher claims, not deployment-weighted customer data"]
      - ["Deployment choice", "Cloud-native platform in the reviewed listing", "On-premises in GINA's own description", "Cloud-hosted and cloud-native options are described", "VESTA NXT is cloud-native; VESTA 911 is on-premises with cloud backup", "The entries do not establish equivalent hosting, migration or service-level terms"]
      - ["Integration / data exchange", "AWS listing and AUVSI feature describe integrated workflows; AUVSI reports an open API", "GINA describes integrations and resource/field workflows", "Tyler describes information sharing across agencies and jurisdictions", "Motorola describes digital incident-data exchange and mapping", "No independent compatibility, throughput or interoperability benchmark is supplied"]
      - ["AI / automation and trust", "AUVSI's 2025 feature describes Mark43 AI tools and reports an executive's FedRAMP High certification statement", "GINA describes automated unit recommendations, not independently tested AI outcomes", "The reviewed Tyler page does not establish equivalent AI performance", "Motorola describes purpose-built AI in VESTA NXT", "No accuracy, human-oversight, security-audit or incident-response comparison is available"]
    notes: >-
      Capability cells report what the cited pages disclose, not validated
      performance. “Not established” is an evidence boundary, not proof that a
      vendor lacks a capability.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP010]
  - id: TP003
    title: Pricing and packaging evidence
    columns: [Offering, Disclosed packaging / deployment, Comparable public price, Realized price / implementation / renewal evidence, Diligence implication]
    rows:
      - [Mark43, "Cloud-native CAD/RMS/analytics; EdgeMarket cooperative procurement route", "Not disclosed in reviewed sources", "Not disclosed in reviewed sources", "Request a dated agency quote and redacted contract, including implementation and support"]
      - [GINA Smart CAD, "On-premises multi-sector CAD; product and deployment claims from GINA", "Not disclosed in reviewed sources", "Not disclosed in reviewed sources", "Test total cost by hosting, integration, training and support scope"]
      - [Tyler Technologies, "Public-safety CAD, Fire & EMS, mobile, records and analytics offerings", "Not disclosed in reviewed sources", "Not disclosed in reviewed sources", "Request comparable quote and implementation schedule for the relevant product tier"]
      - [Motorola Solutions, "VESTA NXT cloud-native and VESTA 911 on-premises product lines", "Not disclosed in reviewed sources", "Not disclosed in reviewed sources", "Separate call-handling, mapping and analytics components in a like-for-like quote"]
      - [Prepared / Axon, "Prepared call-intelligence platform; acquisition agreement announced in 2025", "Not disclosed in reviewed sources", "Not disclosed in reviewed sources", "Confirm present availability, contracting entity and package after transaction status is verified"]
    notes: >-
      This is a bounded review of the assigned prefetched pages, not evidence
      that vendors never publish prices. No comparable list price, realized
      price, discount, implementation fee or renewal term was available in
      those pages.
    claimRefs: [CP001, CP005, CP007, CP008, CP011, CP013, CP014]
figures:
  - id: FP001
    title: Ordinal view of disclosed workflow breadth and deployment choice
    type: quadrant
    summary: >-
      Analyst-coded ordinal placements from disclosed product descriptions:
      Mark43, GINA and Tyler show broad operating scope; Octave and CentralSquare
      deployment descriptions come only from GINA's competitor comparison;
      Motorola's portfolio spans cloud and on-premises product lines.
    data:
      points:
        - {label: Mark43, x: 4, y: 2}
        - {label: GINA Smart CAD, x: 4, y: 2}
        - {label: Tyler Technologies, x: 4, y: 2}
        - {label: Motorola Solutions, x: 2, y: 3}
        - {label: Octave, x: 4, y: 4}
        - {label: CentralSquare, x: 4, y: 4}
    approximationNotes: >-
      Analyst-coded 1–5 ordinal scores, not vendor metrics or an independent
      benchmark. Workflow breadth: 1=single function, 2=adjacent functions,
      3=multi-module, 4=CAD plus adjacent workflows or disciplines, 5=the
      reviewed sources do not establish a higher tier. Deployment choice:
      1=not established, 2=one primary model (cloud or on-premises), 3=vendor
      portfolio spans cloud and on-premises products, 4=both cloud and
      on-premises/hybrid options described for the offering. Scores are
      approximate analyst interpretations of cited descriptions; “higher” is
      not a quality, market-share or outcome ranking.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP009]
