schemaVersion: "report-v2"
artifact: risks
slug: mark43
runDate: 2026-10-26
company:
  name: Mark43
chapter:
  number: 7
  title: Risks
  summary: >-
    Public evidence supports material sector-level cyber, continuity, AI-governance,
    and integration exposures for software used in public safety, while it does not
    establish Mark43-specific incident rates, uptime, customer concentration, or
    current financial resilience. The strongest mitigants are company-described
    controls and a large federal deployment; independent operating evidence and
    contract-level diligence remain necessary.
sections:
  - id: cyber-continuity
    title: Cybersecurity and service continuity
    body: >-
      Cybersecurity and availability are the most consequential evidenced risk
      categories because public-safety systems support dispatch, records, and
      investigations. CISA describes emergency communications centers as targets
      for attacks intended to disrupt operations, and its materials identify
      ransomware, telephony denial-of-service, and malware as relevant threats
      (CR003). A Mark43-sponsored survey reported sector-level cyber and availability
      problems, including RMS and CAD downtime, but those results are not Mark43
      incident or service-level data (CR004, CR005, CR006). The 2025 DOI deployment
      spans six law-enforcement programs and about 3,000 officers across more than
      850 locations; a failure in such an operational footprint could have broad
      impact within that deployment, although no Mark43 uptime or recovery
      performance is quantified in the retained evidence (CR001, CR002, CR014).
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR014
    tableRefs:
      - TR002
  - id: legal-ai-governance
    title: Legal, data, and AI governance
    body: >-
      The regulatory exposure is jurisdiction-specific rather than a single
      disclosed license question. CISA says emergency communications center
      operators should verify that intended AI uses comply with applicable legal
      and policy requirements (CR009). Mark43's April 2026 release describes
      configurable agency permissions, human oversight, audit logs, and controls
      for its AI products; these are company statements, not independent tests of
      model accuracy, data handling, or legal compliance (CR010). CISA also
      describes NG911 as an IP-based environment connecting public and private
      networks, which makes integration, access controls, and continuity relevant
      diligence topics (CR007). The available sources do not establish the
      jurisdiction-by-jurisdiction requirements applicable to each deployment or
      any current litigation or enforcement status; those remain explicit gaps
      rather than assumed clean records.
    claimRefs:
      - CR007
      - CR009
      - CR010
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: implementation-dependencies
    title: Implementation and ecosystem dependencies
    body: >-
      A connected CAD/RMS platform can reduce disconnected workflows, but it also
      makes reliable interfaces, external data sources, and customer-side
      operations important to service quality. CISA describes NG911
      interconnection across a wide range of public and private networks (CR007);
      an AUVSI feature based on Mark43 personnel describes an open API and
      integrations as product capabilities, not as independently tested
      reliability results (CR011). The DOI deployment is evidence of scale at one
      federal customer, not evidence of customer concentration across Mark43's
      portfolio or of contracted service performance (CR002, CR014). Diligence
      should therefore test interface failure modes, agency and supplier
      responsibilities, data portability, disaster recovery, and customer
      references across more than one large deployment.
    claimRefs:
      - CR002
      - CR007
      - CR011
      - CR014
    tableRefs:
      - TR003
  - id: financial-and-procurement
    title: Financial resilience and public procurement
    body: >-
      Public evidence is insufficient to underwrite working-capital resilience or
      customer funding dependence. Tracxn's fetched profile reports $219 million
      raised and a March 2024 latest-round date, but its displayed valuation is
      obscured; neither funding raised nor a secondary profile establishes cash
      available, burn, runway, or current valuation (CR013). 911.gov lists federal
      assistance programs relevant to emergency communications and states that no
      911 Grants are currently open on the fetched page (CR012). That is a
      time-bound program observation, not evidence that Mark43 customers depend
      on grants or that all other funding is unavailable. Procurement timing,
      implementation cost, contract renewal terms, and the company's own liquidity
      remain unquantified and should be treated as diligence gaps.
    claimRefs:
      - CR012
      - CR013
    tableRefs: []
  - id: monitoring-and-thesis-breaks
    title: Monitoring indicators and thesis-break conditions
    body: >-
      The evidence supports monitoring measurable service and governance outcomes,
      not assigning a precise probability to a Mark43-specific failure. The
      cited surveys report sector-level cyber incidents and system unavailability,
      while the retained material contains no Mark43-specific incident counts,
      uptime series, service-level agreement, or recovery-test results (CR003,
      CR004, CR006, CR014, CR015). Escalate diligence if the company cannot provide
      independently reviewable security attestations, incident disclosure
      procedures, recovery-time and recovery-point commitments, or customer
      references for severe disruptions. For AI products, require error and
      correction rates, audit-log samples, retention and access controls, and
      evidence that agency controls work in production. Any sustained outage,
      material breach, failed legal review, or inability to meet contracted
      recovery obligations would challenge the operating thesis; public evidence
      does not establish that any such event has occurred.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR014
      - CR015
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Exposure
      - Jurisdiction / scope
      - Evidence and status
      - Likelihood
      - Potential severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - AI use, records, and agency policy
        - U.S. jurisdictions; requirements vary by agency and use
        - CISA says ECCs should verify AI use against applicable legal and policy requirements; Mark43 describes agency-configurable AI permissions and audit logging
        - Not quantified
        - High potential impact if outputs or records are mishandled; no company-specific event established
        - Company-described controls only; no independent test in the assigned evidence
        - Obtain a jurisdictional legal matrix, model-use approvals, audit samples, and agency counsel sign-off
      - - Criminal-justice information security and access
        - Public-safety agency deployments
        - CISA identifies cyber disruption as a threat to emergency operations; Mark43's AI release claims data remains in a CJIS-compliant environment
        - Sector exposure evidenced; Mark43-specific probability unknown
        - High potential impact because affected systems support public-safety operations
        - Vendor statement; independent current certification and control evidence not present
        - Request current audit/authorization documents, incident history, access reviews, and subprocessor controls
      - - NG911 interoperability and data governance
        - U.S. emergency communications and connected agency systems
        - CISA describes NG911 as IP-based and interconnected; applicability and contractual allocation for Mark43 deployments are not established
        - Customer- and deployment-specific; not quantified
        - Material potential impact from data, interface, or continuity failure
        - General CISA guidance exists; no deployment-specific compliance evidence in the pool
        - Map each deployment's requirements, data flows, responsibilities, and tested fallback procedures
    notes: >-
      Sample of legal and policy exposures raised by the assigned sources, not an
      exhaustive review of laws, litigation, or enforcement records. Likelihood
      and impact are qualitative; company-specific event rates were not supplied.
    enumerationScope:
      coverage: sample
      basis: >-
        Selected AI, information-security, and NG911 exposures documented in the
        assigned sources; this is not a jurisdiction-by-jurisdiction matter inventory.
    claimRefs:
      - CR003
      - CR007
      - CR009
      - CR010
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood evidence
      - Severity / impact
      - Mitigation maturity
      - Residual exposure
      - Monitor or diligence
    rows:
      - - Cyberattack disrupting CAD, RMS, or emergency communications
        - CISA identifies attacks on emergency communications; company-sponsored surveys report sector-level cyber incidents
        - High potential impact on dispatch, investigations, and responder access; not a Mark43-specific incident finding
        - Company describes security controls; independent control tests are absent from the pool
        - Mark43-specific incidence, breach history, and recovery performance remain unknown
        - Obtain incident disclosures, current independent attestations, penetration-test summaries, and response exercises
      - - Service outage or failed disaster recovery
        - Mark43-sponsored survey reports sector-level RMS/CAD unavailability; no Mark43 uptime series is available
        - High potential impact given the DOI deployment's scale and public-safety use
        - Cloud-native and resilience claims are not independently tested in the assigned sources
        - No Mark43-specific SLA, recovery-time objective, or recovery-point objective is documented here
        - Review contract SLAs, uptime by module, failover tests, and customer-confirmed disruption history
      - - Interface, data exchange, or third-party integration failure
        - CISA describes NG911 interconnection; Mark43 feature material describes an open API
        - Material, deployment-specific impact; probability is unquantified
        - Product capability is described, but interface-level reliability evidence is not supplied
        - Supplier concentration, data portability, and fallback ownership are unknown
        - Map critical integrations, dependencies, change controls, and end-to-end recovery tests
      - - AI-generated report or summary error
        - AI adoption and governance concerns appear in company material; no Mark43 error-rate evidence is provided
        - Potentially high evidentiary and operational impact; frequency is unknown
        - Mark43 says outputs are human-reviewed, configurable, and logged
        - Accuracy, correction rates, auditability in production, and retention controls are unverified
        - Request evaluation results, sampled audit trails, human override rates, and customer references
    notes: >-
      Likelihood is not quantified for Mark43. Sector survey percentages are
      attributed to their publishers and are not treated as company incident rates.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
      - CR015
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Evidence and concentration
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure / diligence path
    rows:
      - - External data and agency-system integrations
        - Public/private networks and customer-selected systems; named suppliers not disclosed in the assigned evidence
        - CISA describes NG911 interconnection; AUVSI reports Mark43's open-API positioning; dependency concentration is unknown
        - Interface outage, data mismatch, or access failure could impair connected workflows
        - Material; probability and affected deployments are not quantified
        - Open API is a company-described capability, not proof of tested fallback
        - Obtain integration inventory, named critical suppliers, portability terms, and test records
      - - Federal and local procurement / grant cycles
        - Public agencies, appropriators, and grant programs
        - 911.gov lists assistance programs but says no 911 Grants are currently open on the fetched page; Mark43 customer grant dependence is unknown
        - Delayed awards or budget cycles could defer procurement or renewal
        - Material commercial timing exposure; Mark43-specific impact not quantified
        - No customer-level funding mix or contract backlog is available in the assigned evidence
        - Review contract pipeline, funding source by customer, renewal timing, and termination rights
      - - Large federal deployment and customer concentration
        - U.S. Department of the Interior deployment; six programs, about 3,000 officers, and over 850 locations
        - ExecutiveGov reports deployment scale; companywide customer revenue concentration is not disclosed
        - A severe deployment or relationship failure could have significant operational consequences at the affected programs
        - High potential customer-level impact; probability and revenue exposure unknown
        - Deployment itself is documented; no independent service-level outcomes are supplied
        - Obtain DOI acceptance, service reviews, renewal terms, and top-customer revenue / usage concentration
    notes: >-
      Dependency boundaries and companywide concentration are not enumerated by the
      available sources; rows identify diligence areas, not confirmed supplier failures.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR011
      - CR012
figures:
  - id: FR001
    title: Risk evidence and mitigation maturity
    type: matrix
    summary: >-
      Qualitative comparison of documented sector exposure with Mark43-specific
      evidence and the remaining diligence burden.
    data:
      columns:
        - Impact evidence
        - Likelihood evidence
        - Mitigation evidence
        - Residual exposure / diligence
      rows:
        - label: Cybersecurity
          values:
            - CISA identifies attacks intended to disrupt emergency operations
            - Sector survey evidence; Mark43 incident rate unknown
            - Mark43 describes controls; independent tests are unavailable
            - Request current attestations, incident history, and response exercises
        - label: Availability
          values:
            - CAD/RMS downtime can affect dispatch and records workflows
            - Survey evidence is sector-level; Mark43 uptime is unknown
            - No Mark43 SLA or recovery-test result is in the assigned evidence
            - Obtain uptime history, recovery commitments, and customer references
        - label: AI governance
          values:
            - Potential legal and evidentiary effects depend on agency use
            - Mark43-specific error and correction rates are unavailable
            - Mark43 describes human oversight and audit logs
            - Review production evaluations, overrides, retention, and audit samples
        - label: Integration
          values:
            - Interconnected systems create deployment-specific failure exposure
            - Interface failure probability is unquantified
            - CISA guidance and an open-API description; no reliability testing
            - Map critical integrations, ownership, portability, and fallback tests
        - label: Procurement / grants
          values:
            - Delayed awards could defer agency procurement; company impact unknown
            - Customer grant dependence is not established
            - 911.gov lists assistance programs; no 911 Grants are currently open
            - Request customer funding mix, backlog, renewal timing, and termination terms
        - label: Financial resilience
          values:
            - Liquidity or working-capital exposure cannot be quantified publicly
            - Tracxn reports funding raised, not current cash or runway
            - No current cash, debt, or burn evidence is in the assigned sources
            - Obtain current financial statements, debt schedules, and runway scenarios
    approximationNotes: >-
      Qualitative evidence map only; it does not assign numeric probability, rank
      zones, or imply that an incident has occurred at Mark43.
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
