  evidenceGaps:
    - type: missing-source
      severity: material
      topic: company-specific-availability
      missingEvidence: >-
        Mark43-specific uptime by product, contractual SLAs, outage disclosures,
        recovery-time and recovery-point commitments, and independent recovery-test
        results.
      whyItMatters: >-
        Sector-level survey results cannot establish the reliability or recovery
        performance of Mark43's systems serving public-safety workflows.
      diligencePath: >-
        Request multi-year uptime and incident logs, current customer SLAs, disaster
        recovery test reports, and customer references covering material events.
      relatedQuestionRefs:
        - QR003
        - QR009
      relatedTableRefs:
        - TR002
    - type: missing-source
      severity: material
      topic: legal-and-regulatory-status
      missingEvidence: >-
        A current jurisdiction-by-jurisdiction legal and regulatory matrix,
        litigation/enforcement search, and independently reviewable security and
        privacy attestations for Mark43 deployments.
      whyItMatters: >-
        The assigned evidence identifies applicable public-safety and AI concerns
        but does not establish Mark43's complete compliance posture or legal
        history.
      diligencePath: >-
        Obtain company counsel's current matter list, agency-specific compliance
        mapping, audit reports, authorization status, and customer contract
        obligations.
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: ai-output-quality
      missingEvidence: >-
        Production accuracy, correction and override rates, model evaluation
        results, retention settings, and audit-trail samples for ReportAI and
        BriefAI.
      whyItMatters: >-
        Company-described human oversight and audit controls do not independently
        establish output quality or defensibility in agency workflows.
      diligencePath: >-
        Review model evaluations, sampled case records, error and correction
        metrics, data-retention controls, and agency approval records.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR001
        - TR002
    - type: missing-source
      severity: material
      topic: grant-and-procurement-dependence
      missingEvidence: >-
        Customer-level procurement funding mix, grant dependence, contract backlog,
        renewal timing, implementation costs, and termination rights.
      whyItMatters: >-
        Federal funding programs are only one possible procurement path, and the
        evidence does not show how changes affect Mark43 sales or renewals.
      diligencePath: >-
        Request customer cohort funding sources, contract and renewal schedules,
        backlog conversion, and implementation economics.
      relatedQuestionRefs:
        - QR007
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: material
      topic: capital-and-liquidity
      missingEvidence: >-
        Current cash, debt, burn, runway, revenue quality, and financing terms,
        including any restrictions or preferences that affect available capital.
      whyItMatters: >-
        Funding raised is not cash available, and the secondary Tracxn profile does
        not provide a current valuation or operating liquidity measure.
      diligencePath: >-
        Obtain current financial statements, cash and debt schedules, revenue
        composition, financing documents, and management runway scenarios.
      relatedQuestionRefs:
        - QR008
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        An exhaustive inventory of applicable legal regimes, regulatory matters,
        and litigation by deployment jurisdiction.
      whyItMatters: >-
        The legal register is a source-bounded sample and cannot establish that no
        additional obligations or proceedings exist.
      diligencePath: >-
        Reconcile a company legal inventory with agency counsel and independently
        reviewable court and regulator records.
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR001
