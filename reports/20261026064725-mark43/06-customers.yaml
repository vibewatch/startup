    columns: [Metric, Reported value, Date or period, Source and confidence, Interpretation / missing denominator]
    rows:
      - ["Agencies described as trusting Mark43", "Over 300 globally", "2026-03-03 company announcement", "Mark43 release; company-claimed", "No definition of agency, active status, or prior-period comparison"]
      - ["Nassau County police departments in announced transition", "4 total; 3 live and 1 scheduled", "At publication; undated release", "Police1 press release; company-issued", "Deployment status is a point-in-time announcement and no utilization metric is supplied"]
      - ["Massachusetts launches", "More than a dozen in the prior 18 months; some reportedly in as little as 90 days", "2026-02-03 company announcement", "Mark43 release; company-claimed", "No complete launch list, independent verification, or comparable time series"]
    notes: >-
      Values and periods retain the wording and attribution in their sources. The
      global agency count and launch totals are company claims; the Nassau status is
      reported in a press release. None is ARR, revenue, or a measure of retention.
    claimRefs: [CU002, CU003, CU006]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / segment, Deployment or relationship, Reported status, Reported outcome or rationale, Limitation]
    rows:
      - ["Hempstead, Garden City, Lynbrook, and Old Westbury Police Departments", "Nassau County CAD, RMS, mobile, and analytics transition", "Three agencies live; Old Westbury expected in the coming weeks", "Agency officials cited modernization, mobile access, data sharing, and cloud capabilities", "Company-issued press release; no customer-side operating metrics"]
      - ["Methuen Police Department", "Massachusetts RMS relationship", "Announced as a 2025 partnership / implementation", "Chief said the department would implement RMS to streamline operations and data access", "Announcement does not establish production deployment or measured outcomes"]
      - ["Fort Myers Police Department", "CAD and RMS use", "AUVSI article describes an operating deployment", "Article recounts continued operations and assistance to neighboring agencies during a hurricane", "Narrative is not a customer-authored evaluation and supplies no quantified service level"]
    enumerationScope:
      coverage: sample
      basis: Selected named agency examples reported in assigned customer and company materials; not a complete census of Mark43 customers or deployments.
    notes: >-
      The table samples named proof points rather than enumerating all customers.
      Announced relationships, live deployment, and retrospective use are distinct
      statuses; all reported outcomes remain attributed to the source.
    claimRefs: [CU003, CU005, CU006, CU007, CU014]
