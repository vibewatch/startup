  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer-level renewal and active-use cohorts, NRR or GRR, churn, contract duration, and revenue concentration by customer or agency group.
      whyItMatters: Agency counts and selected launch stories cannot establish recurring revenue durability, expansion economics, or exposure to a small number of large public-sector buyers.
      diligencePath: Request anonymized customer-cohort data and top-customer revenue bands, then interview current and former agency buyers about renewal, usage, implementation burden, and referenceability.
      relatedQuestionRefs: [QU005, QU008]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: Independently verified customer-side operating outcomes for named deployments, including implementation dates, adoption levels, service availability, and measured time or cost savings.
      whyItMatters: Company announcements and attributed testimonials describe rationale and selected outcomes but do not establish comparable realized benefits across customers.
      diligencePath: Obtain public procurement / acceptance records where available and conduct reference calls with named agency users using consistent implementation, utilization, and outcome questions.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
