company:
  name: Mark43
chapter:
  number: 6
  title: Customers
  summary: Mark43's 2026 company disclosures claim adoption by more than 300 agencies and describe deployments across multi-agency public-sector groups, including Nassau County and Massachusetts. The available evidence is weighted toward company-issued announcements and does not establish independently verified active usage, retention, customer concentration, or customer-level outcomes.
sections:
  - id: customer-base
    title: Customer base and segmentation
    body: >-
      The public materials position Mark43 primarily for public-sector public-safety
      agencies, with police departments as the clearest named buyer and police/fire
      organizations as an adjacent deployment segment. Mark43 describes its platform
      across dispatch, records, mobile, analytics, and booking workflows. The
      strongest current scale figure is Mark43's own statement that it is trusted by
      over 300 agencies globally. That is a company-reported agency count, not an
      audited active-customer count, revenue measure, or retention statistic. Federal
      funding may be another purchasing route: 911.gov lists assistance that may
      apply to 911 and NG911 projects, but does not connect programs to Mark43
      deployments.
      A Nassau County announcement describes four neighboring police departments
      moving from legacy on-premises systems, with three live and one scheduled to
      follow. In Massachusetts, Mark43 reports more than a dozen launches over the
      prior 18 months and separately names police, fire, university, and sheriff
      organizations. These announcements suggest regional, multi-agency deployments,
      but disclose neither the full customer mix nor deployment-level contract value.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU007, CU018]
    tableRefs: [TU001, TU002]
  - id: adoption-and-proof
    title: Adoption evidence and customer proof
    body: >-
      The available adoption evidence consists mainly of named deployments and
      customer quotations carried in Mark43 releases or company-oriented coverage.
      The Nassau release identifies four agencies and reports three as live at
      publication, while Mark43's Massachusetts announcement names new agency
      relationships and reports launch activity. These are useful evidence of
      selected implementations, but the issuer controls the release and the materials
      provide no contract records, customer-side implementation measures, or
      independent confirmation of the aggregate footprint. Quoted agency officials
      describe legacy-system limitations, mobility, data sharing, and modernization
      needs; those statements establish the stated rationale, not measured savings or
      realized outcomes. AUVSI's article recounts a Fort Myers Police Department
      resilience example, but it is not a customer-authored evaluation. A 2026
      Mark43-issued survey article reports that 90% of law-enforcement respondents
      said their organization had experienced a cyber issue in the prior year, up
      from 84%; its fetched text does not state sample size or methodology. This is
      company-reported survey evidence, not proof that respondents use Mark43 or that
      adoption improves agency performance.
    claimRefs: [CU003, CU004, CU005, CU010, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      Expansion signals are present but narrow: Mark43 says Boston Police Department
      expanded its existing relationship to Booking, and it announced a partnership
      with Mi-Case to connect its CAD/RMS/mobile/analytics suite with a jail management
      system. The partnership describes an intended combined offering, not evidence
      that a customer has deployed it. Mark43 also reports over 300 agencies in two
      company releases, but those repeated statements share the same issuer and do
      not independently corroborate the total. On Gartner Peer Insights, the fetched
      Mark43 vendor page showed zero ratings; that is a bounded absence of reviews on
      that page, not evidence that Mark43 has no customers or dissatisfied users.
      GovWare Reviews calls pricing non-public and positions the product as premium,
      without providing an underlying quote or customer evidence. The reviewed
      materials disclose no NRR, GRR, churn, renewal, cohort usage, or top-customer
      share. Consequently, adoption durability, customer economics, and concentration
      remain open diligence items rather than conclusions inferred from logos or
      aggregate agency claims. Motorola Solutions' own command-center page describes
      an adjacent public-safety software offering, but it does not establish customer
      overlap, Mark43 displacement, or comparative performance.
    claimRefs: [CU002, CU011, CU012, CU013, CU015, CU016, CU017]
callouts:
  - calloutType: risk
    title: Adoption is not yet durability
    body: Company-reported agency counts and selected launch stories demonstrate reach, but do not establish active usage, renewal, retention, customer concentration, or independently measured outcomes.
    claimRefs: [CU002, CU003, CU006, CU013]
