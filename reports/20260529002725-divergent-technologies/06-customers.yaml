  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table public sample only
    missingEvidence: A management-approved list of named aerospace and defense accounts, their program names, and current deployment status.
    whyItMatters: The public proof set is compelling but clearly curated; without the full list, concentration and repeatability are still partially inferential.
    diligencePath: Request top-20 customer list by revenue and program stage, then reconcile against public announcements and partner pages.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention and contract economics
    missingEvidence: Renewal rates, contract length, margin by account, option structure, and repeat-order metrics for named programs.
    whyItMatters: Without contract and renewal data, it is impossible to distinguish one-off prototype wins from durable recurring customer relationships.
    diligencePath: Request contract term sheets, option schedules, and last-twelve-month expansion history for the top aerospace and defense accounts.
    relatedQuestionRefs:
    - QU017
    - QU024
  - type: missing-source
    severity: minor
    topic: hermeus-direct-relationship
    missingEvidence: A direct Hermeus-Divergent announcement, supplier statement, or procurement record naming the relationship.
    whyItMatters: Hermeus is strategically relevant to the buyer profile, but using it as named customer proof without direct evidence would overstate the public record.
    diligencePath: Ask management whether Hermeus is a customer or prospect and request an approved reference or a no-comment statement for the file.
    relatedQuestionRefs:
    - QU016
