- id: sales-cycle-retention-and-concentration
  title: Sales cycle, retention visibility, and concentration risk
  body: 'The customer motion here is not SaaS-like. EWAAC, DIU, and qualification-heavy aerospace programs all point to a long cycle in which vendor inclusion, testing, certification, and prototype success must happen before scaled production dollars follow. That can create deep, sticky relationships, but it also means revenue timing is exposed to government budgets, award cadence, and program shifts. Public durability evidence is much weaker than public adoption evidence. Divergent discloses fast growth and more part numbers, yet it does not publish renewal rates, repeat-order data, contract duration, or margin by account. As a result, customer concentration risk is better framed qualitatively than quantitatively: the named public set is concentrated in defense primes, aerospace programs, and adjacent warfighter applications, and the absence of portfolio-level revenue disclosure means investors cannot tell whether the book is diversified or simply diversified in anecdotes. The expansion
    path is clear; the durability of that path is not fully disclosed.'
