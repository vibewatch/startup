- id: hermeus-and-adjacent-buyer-profile
  title: Hermeus as adjacent buyer profile and why the direct proof gap matters
  body: 'Hermeus deserves chapter space not because it is a confirmed Divergent customer, but because it is one of the clearest public examples of the buyer profile Divergent appears to be moving toward: high-speed, defense-aligned aircraft programs that prioritize rapid iteration, payload integration, manufacturing speed, and test cadence over traditional tooling-heavy development. Hermeus’ own materials show a company scaling toward fleets of aircraft, customer payload integration, DIU-backed flight testing, and production footprint expansion between California and Georgia. That is exactly the sort of demand environment in which DAPS could be useful. But the direct proof gap still matters. Across Hermeus’ homepage, newsroom, and Series C release, there is no named Divergent relationship. Even the adverse, low-reputation Built In profile is valuable mainly because it highlights the risk structure of this buyer set—defense concentration, milestone pressure, and long-dated commercial upside—not
    because it proves a customer link. The correct diligence stance is therefore: strategic adjacency, not named proof.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  sourceRefs:
  - SU014
  - SU015
  - SU016
  - SU017
  - SU018
  - SU019
  - SU020
  tableRefs: []
  figureRefs: []
  paragraphs:
  - text: 'Hermeus shows why Divergent’s target segment is attractive: it combines warfighter urgency, payload integration, repeated flight-test loops, and production scaling.'
    claimRefs:
    - CU024
    - CU025
    - CU026
    - CU027
    - CU029
    sourceRefs:
    - SU014
    - SU015
    - SU016
    - SU018
    - SU019
