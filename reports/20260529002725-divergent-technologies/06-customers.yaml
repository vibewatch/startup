- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / constraint
  - Impact
  - Diligence path
  rows:
  - - Land with one part family, expand to more structures
    - Public proof does not show revenue share by account
    - Could create real wallet-share growth but is impossible to size today
    - Request part-family count and revenue by top 10 accounts
  - - Move from sustainment or component work to full airframe systems
    - Qualification and certification cycles are long
    - Expansion can be deep but lumpy and program-dependent
    - Request conversion funnel from prototype / qual to production
  - - Use procurement vehicles like EWAAC to reach more programs
    - Vehicle access is not the same as funded production orders
    - Can overstate commercial certainty if task orders lag
    - Request task-order history and weighted pipeline by vehicle
  - - Defense-prime concentration
    - Visible book is heavily defense oriented
    - Budget shifts or program cancellations could hit growth quickly
    - Request revenue split by defense, aerospace commercial, and automotive
  - - Hermeus-like adjacent buyer set
    - Relevant archetype but no direct account proof
    - Helpful for TAM thinking, not for current customer quality
    - Ask management for approved reference or explicit no-comment
  - - High program complexity per account
    - Sticky relationships may require expensive field support and qualification work
    - Customer count can overstate actual diversification
    - Request gross margin and engineering-hours-to-revenue by account
  notes: Expansion logic is credible, but concentration scoring remains constrained by absent account-level revenue and renewal disclosure.
