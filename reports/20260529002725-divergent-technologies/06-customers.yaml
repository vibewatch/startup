- id: named-customer-proof-and-program-evidence
  title: 'Named customer proof: GA-ASI, Raytheon, Triumph, Saab, and Mach'
  body: 'Public proof is materially stronger than a simple logo wall. General Atomics provides the clearest end-to-end evidence: a syndicated press release says Divergent supported GA-ASI on a hybrid ground- and air-launched SUAS, manufactured the metallic core structure with DAPS, and met payload and integration requirements. Raytheon proof is also substantive. 3D ADEPT reports a collaboration that modernized a decades-old naval design in under five months and cut airframe part count by 80% on a legacy effector while preserving performance and survivability. Triumph is particularly important because it shifts the story from prototype coolness into qualification-heavy manned-aircraft production: MarketScreener reports multiple critical components, regulatory certification for high-performance aircraft, and about 100 units over two years. Saab and Mach extend the range. Saab’s 2026 flight-test fuselage points to large-structure airframe relevance, while Venom shows concept-to-flight hardware
    in 71 days. Together these are not perfect cohort data, but they are strong named-program evidence.'
