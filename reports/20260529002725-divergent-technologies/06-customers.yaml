tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public proof
  - Strategic value / gap
  rows:
  - - Luxury automotive OEMs
    - 'Buyer: performance OEM; User: engineering/manufacturing; Payer: OEM'
    - Early lightweight structures and frames
    - Aston Martin, Bugatti, McLaren named in Series E
    - Historic proof, not the current growth center
  - - Defense primes / naval systems
    - 'Buyer: prime contractor program team; User: engineering + manufacturing; Payer: prime / government program'
    - Legacy-system redesign, sustainment, and rapid production
    - Raytheon collaboration and prime-contractor missile proof
    - Program names and contract values remain limited
  - - Unmanned aircraft developers
    - 'Buyer: UAS program team; User: airframe / payload engineering; Payer: OEM or DoD-backed customer'
    - Complex flight hardware and low-cost attritable airframes
    - GA-ASI SUAS and Mach Venom evidence
    - Still more program-centric than portfolio-like
  - - Manned aircraft component suppliers
    - 'Buyer: aerostructures or component manufacturer; User: qualification / production teams; Payer: supplier / OEM program'
    - Qualification of safety-critical aircraft components
    - Triumph qualification work
    - Aircraft platform not named publicly
  - - High-speed defense aircraft developers
    - 'Buyer: national-security aircraft company; User: prototyping and production teams; Payer: defense customer or investor-backed program'
    - Rapid iteration, payload integration, and production scale-up
    - Hermeus materials and buyer-profile proxy
    - Direct Divergent customer proof absent
  - - Sustainment and obsolescence relief
    - 'Buyer: operator, depot, or prime'
    - Replacement of tooling-starved hardware
    - Legacy military transport example on sustainment page
    - Named account and economics are undisclosed
  notes: Segmentation is based on named accounts, public program examples, and adjacent buyer-profile evidence rather than on disclosed customer-count data.
