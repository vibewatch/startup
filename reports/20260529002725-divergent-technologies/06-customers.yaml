- id: visible-customer-base-and-segmentation
  title: Visible customer base, buyer segmentation, and where the public proof is strongest
  body: 'The visible customer mix has shifted decisively away from a luxury-automotive origin toward aerospace and defense buyers that value speed, tooling avoidance, and qualification-enabled production. Public Series E coverage is the clearest top-down map: Divergent says it moved into aerospace and defense in 2022 with General Atomics and now has contracts with General Atomics, Lockheed Martin, Raytheon, and Triumph Group. The work spans a surprisingly broad use-case range—from sustainment parts to full airframe systems—which matters because it suggests DAPS can land at multiple levels of a program rather than only in a narrow prototype niche. What is still missing is breadth on the long tail of customers. The public record highlights a handful of named accounts and a growing defense orientation, but it does not disclose top-account mix, customer count by vertical, or revenue share by buyer type. That makes the chapter’s customer segmentation credible but still incomplete.'
