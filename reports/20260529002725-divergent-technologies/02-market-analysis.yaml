callouts:
- calloutType: strength
  title: Defense sustainment makes AM more than a prototyping story
  body: The strongest evidence in this chapter is not a market-study CAGR. It is the DoD’s own sustainment evidence and the defense-focused trade reporting showing additive manufacturing used to localize production, replace obsolete parts, and compress lead times for mission-critical hardware. That creates a real buyer problem for Divergent to solve.
  claimRefs:
  - CM026
  - CM027
  - CM040
- calloutType: risk
  title: Certification friction keeps a wide gap between TAM and deployable revenue
  body: 'America Makes, AIA, EASA, FAA, and Nadcap all point to the same reality: qualification of metal AM parts remains laborious. A supplier can have compelling technology and still lose time, margin, or program access if its materials, monitoring, fatigue evidence, and process controls are not accepted by the customer or regulator.'
  claimRefs:
  - CM018
  - CM019
  - CM022
  - CM023
  - CM024
  - CM025
  - CM036
  - CM037
- calloutType: insight
  title: The real market is the narrow wedge where complexity and urgency overpower tooling economics
  body: 'Broad additive-manufacturing market estimates are useful orientation, but the investable market for Divergent-like platforms is much narrower: certified, end-use, low-volume or high-mix structures where lightweighting, integration, or sustainment urgency justify abandoning conventional tooling-heavy workflows.'
