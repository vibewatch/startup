  - type: private-evidence-only
    severity: minor
    topic: public pricing and unit economics for software-defined manufacturing contracts
    missingEvidence: Program-level pricing, gross margin, and volume thresholds for Divergent or comparable qualified AM suppliers.
    whyItMatters: Without pricing, the market chapter can describe buyer logic and TAM proxies but cannot estimate profit pool or contract value with precision.
    diligencePath: Request anonymized quotes or benchmark customer contracts from management or expert calls with procurement officers and certified suppliers.
