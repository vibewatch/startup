    topic: sam isolation for divergent-like production platforms
    missingEvidence: A public dataset that isolates certified end-use metal AM spend in aerospace, defense, and low-volume automotive for North America.
    whyItMatters: Broad AM TAM figures overstate the revenue pool Divergent can realistically attack in the near term.
    diligencePath: Request management’s internal SAM model or triangulate using program-level part demand, certified supplier counts, and end-use part mix.
