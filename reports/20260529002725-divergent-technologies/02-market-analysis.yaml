  - type: missing-source
    severity: material
    topic: fy2026 defense budget additive manufacturing line item
    missingEvidence: A specific FY2026 budget line or justification book page that isolates additive manufacturing procurement rather than broad industrial-base or S&T funding.
    whyItMatters: Budget specificity would strengthen claims about near-term public spending support for AM adoption.
    diligencePath: Search FY2026 DoD budget justification books, Air Force and Navy advanced-manufacturing program lines, and congressional report language.
    relatedQuestionRefs:
