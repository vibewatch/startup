  rows:
  - - Software-defined production platforms
    - Generative design, metal printing, assembly automation, quality workflow
    - Standalone desktop printers and prototyping-only shops
    - OEM engineering, advanced manufacturing, defense programs
    - Core category that best fits DAPS.
  - - Aerospace end-use AM
    - Flight or mission hardware, tooling, low-rate production, sustainment parts
    - Traditional machining-only parts with no AM element
    - Aerospace OEMs, primes, MROs
    - Highest-fit market due qualification-sensitive complex parts.
  - - Defense sustainment and industrial-base AM
    - Obsolescence response, depot tooling, localized replacement parts
    - General logistics software and unrelated maintenance spend
    - DoD depots, DLA, primes, sustainment programs
    - Strong fit for responsiveness and supply-chain resilience.
  - - Automotive performance and low-volume AM
    - Lightweight structures, tooling-light programs, premium performance parts
    - Mass-market stamped high-volume body-in-white production
    - OEM advanced engineering and specialty vehicle programs
    - Important heritage market but narrower than full automotive manufacturing.
  - - Industrial casting replacement
    - Heat exchangers, gearboxes, casings, build-to-print complex structures
    - Commodity fasteners and simple machined parts
    - Industrial OEMs and specialty manufacturers
    - Adjacent opportunity that extends plant utilization but is not the main thesis.
  notes: Boundary logic excludes generic printing and broad factory automation so the market stays centered on end-use, qualification-sensitive digital manufacturing.
