    {
      "id": "software-and-vertical-integration",
      "title": "Software-led and vertically integrated challengers",
      "heading": "Software-led and vertically integrated challengers",
      "paragraphs": [
        "The clearest software-led challenge comes from nTop. It does not print parts or automate assembly, but it can capture the engineer\u2019s workflow early by owning geometry optimization, manufacturability logic, and performance iteration. That matters because whoever shapes the design envelope can indirectly influence which manufacturing route is feasible later. In that sense, nTop is strategically important even though its monetization model is different from Divergent\u2019s.",
        "Relativity Space is the opposite kind of adjacent rival. It uses additive manufacturing inside a vertically integrated industrial product and therefore proves that end-to-end AM systems can be strategically meaningful. But Relativity mainly consumes its manufacturing capability internally for rockets. Its 2025 restructuring is still relevant to Divergent because it highlights how capital intensity can overwhelm ambitious vertically integrated additive strategies when commercialization and financing timelines stretch."
      ],
