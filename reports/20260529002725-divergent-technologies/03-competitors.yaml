  "sections": [
    {
      "id": "landscape-and-buyer-overlap",
      "title": "Landscape and buyer overlap",
      "heading": "Landscape and buyer overlap",
      "paragraphs": [
        "Divergent does not compete in one clean additive-manufacturing box. A buyer trying to reduce weight, shorten qualification cycles, or industrialize a new structure can buy a design tool such as nTop, a machine from Nikon SLM Solutions, EOS, Velo3D, or DMG MORI, a broader printer portfolio from 3D Systems or Desktop Metal, or an internally managed production stack stitched together from several suppliers. Divergent is unusual because it asks the buyer to adopt a software-defined production system rather than a single machine or point tool.",
        "That framing matters. The relevant alternatives are not only direct hardware vendors, but every route by which an aerospace, defense, or performance-vehicle customer can move from design intent to qualified metal parts. In practice, the most important competition is stack decomposition: if the customer believes best-of-breed software, printing, and assembly engineering can be sourced separately without much integration penalty, Divergent\u2019s full-system premium gets harder to defend."
      ],
      "body": "Divergent does not compete in one clean additive-manufacturing box. A buyer trying to reduce weight, shorten qualification cycles, or industrialize a new structure can buy a design tool such as nTop, a machine from Nikon SLM Solutions, EOS, Velo3D, or DMG MORI, a broader printer portfolio from 3D Systems or Desktop Metal, or an internally managed production stack stitched together from several suppliers. Divergent is unusual because it asks the buyer to adopt a software-defined production system rather than a single machine or point tool.\n\nThat framing matters. The relevant alternatives are not only direct hardware vendors, but every route by which an aerospace, defense, or performance-vehicle customer can move from design intent to qualified metal parts. In practice, the most important competition is stack decomposition: if the customer believes best-of-breed software, printing, and assembly engineering can be sourced separately without much integration penalty, Divergent\u2019s full-system premium gets harder to defend.",
