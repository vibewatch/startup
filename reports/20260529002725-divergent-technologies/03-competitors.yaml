    {
      "id": "pricing-switching-costs-and-substitutes",
      "title": "Pricing, switching costs, and substitute paths",
      "heading": "Pricing, switching costs, and substitute paths",
      "paragraphs": [
        "Public pricing transparency is low across this entire category. That opacity favors incumbents with relationship-driven selling and hurts outside analysts trying to understand where Divergent\u2019s economics truly sit relative to point software or machine sales. What can be said is that Divergent\u2019s pricing logic is probably least comparable to commodity hardware. It is selling a production system and therefore benefits if customers value faster iteration, lower part count, and integrated assembly enough to accept program-style pricing.",
        "The risk is that buyers may still multi-home. A customer can adopt nTop for design, buy a Nikon or EOS machine for production, qualify a DMG MORI route through an existing factory, or use internal engineering to avoid a platform dependency. That makes switching costs uneven. Divergent\u2019s lock-in is strongest once the buyer relies on the combined software-manufacturing-assembly loop; it is much weaker before that operational integration is demonstrated."
      ],
