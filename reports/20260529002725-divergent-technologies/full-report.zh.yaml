      - number: '7.6'
        title: 缓释、监测项与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              承销 Divergent 的正确方式不是否认风险，而是把风险转成可监测的关口。积极面是，公司已有的缓释证据强于许多风投支持的制造同行：AS9100D 和 Nadcap AM LPBF 已到位，TRIUMPH
              愿意认证安全关键的载人飞机零件，DAPS 宣称具备周期和工装优势，公司也吸引到重复战略资本。 这些都有分量。但它们还不足以让风险清单静止。投资者应监测认证节奏、工厂利用率、网络 /
              合规准备度、披露客户广度，以及后续资本形成是否仍以建设性条款到位。
              如果安全关键认证失败，如果一两个大型国防项目似乎主导可见需求，如果工厂扩张跑在已签工作前面，或者公司寻求下一轮估值台阶时债务和治理条款仍过于不透明，投资逻辑就会失效。 缓释是真实的；监测负担也同样真实。
