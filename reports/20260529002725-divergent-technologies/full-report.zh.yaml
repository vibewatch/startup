      - number: '8.3'
        title: 情景逻辑与价格纪律
        blocks:
          - type: paragraph
            body: >-
              乐观情景并不复杂。如果 Divergent
              能把今天的技术和客户证明转化为持续工厂利用率，突破少数主承包商相关项目的窄集合，并展示出更像制造平台、而不是高级定制作坊的经济性，那么当前估值就可能像早期战略溢价，而不是最终价格。
              悲观情景也容易成立。如果认证延迟、采购节奏或客户集中让利用率持续不均，并且资本结构仍是债务 / 股权混合、披露没有改善，那么公开可比纪律会把注意力拉回硬件式和 A&D 交易倍数。
              由于收入未披露，审慎投资者应反过来问：在不同可比倍数体系下，需要多高收入才能支撑 $2.3 billion 估值？这会得到一个简单门槛框架。 按行业中位数 A&D
              收入倍数，隐含收入门槛远高于当前公开证据能支持的水平。按 10x-15x 平台式倍数，所需收入更可行，但仍需要证明。 因此，价格纪律应放在里程碑里，而不是放在对公司的泛泛欣赏里。
