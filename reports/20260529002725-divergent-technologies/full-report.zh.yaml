      - number: '8.4'
        title: 退出路径与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Divergent 有多条看似可行的退出路径，但每条有吸引力的路径都要求比公开投资者目前掌握的信息更好的披露。出售给国防主承包商、航空航天供应商，或工业软件 /
              计量合作伙伴是可行的，因为公司站在任务关键制造、数字工装和本土工业基础紧迫性的交汇处。 如果收入和利润率数据可得，并且公司能展示多项目利用率，而不只是少数旗舰胜利，那么后续 crossover 轮也可行。IPO
              只有在治理和经济性明显更清晰时才可想象；今天还做不到。
              实际含义是，投资者不应把当前估值视为盲目买入，也不应视为破碎幻想。更好的读法是条件性溢价：如果收入、利用率和治理证据改善，它可以成立；如果这些证明继续留在私下，溢价也会压缩。
              这使最终判断保持在继续研究，也让尽调清单成为估值的一部分，而不是估值脚注。
