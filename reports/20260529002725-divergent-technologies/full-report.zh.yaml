            body: >-
              最重要的问题不是 Divergent 有没有认证——它有——而是公开证据是否足够强，能支撑其在不断扩大的安全关键项目中反复成功。 Divergent 公开称自己是完全合格的 Tier 1 供应商，并列出
              AS9100D、ISO 9001 和 Nadcap AM LPBF。这些是真实的风险缓释，不是营销点缀。 TRIUMPH
              也宣布正在推进多项载人飞机部件的资质认证工作，流程包括严格测试和最终主管机构认证。但监管门槛仍然高，而且会持续存在。 FAA 关于增材制造航空航天零件的指引明确点出质量体系、材料与工艺控制、结构论证。EASA
              的增材制造备忘录同样把认证预期覆盖到多个飞机类别。 简单说：Divergent
              已经证明资质认证能做成，但其公开证据也显示，认证仍然昂贵、反复迭代，并且绑定具体项目。剩余风险因此仍高，直到更广的一组量产项目证明可重复性，而不只是标志性胜利。
