      - number: '7.5'
        title: 资本强度与治理不透明
        blocks:
          - type: paragraph
            body: >-
              Divergent 不是披着制造外衣的软件公司。它之所以融资规模大、资本结构混合，是因为公司在建设工业产能，而不只是卖代码。 2023 Series D 融入 $230 million，其中包括 Hexagon
              的 $100 million 投资；2025 Series E 又增加 $290 million，并带有债务部分。公开报道把这些资金直接连到新工厂、厂房扩张和产能放大。
              这在战略上自洽，但也意味着一旦利用率滞后，下行压力会很快收紧。治理无法充分化解这一点，因为公开记录对董事会构成、委员会监督和股东控制机制披露很薄。
              官方材料在产品愿景、客户和累计融资上信息丰富，但独立治理细节很少。对于一家后期公司，资本结构里有债务、前方还有重工厂扩张，这种不透明并不致命——但足够重要，使它无法被筛成低剩余风险的工业平台。
