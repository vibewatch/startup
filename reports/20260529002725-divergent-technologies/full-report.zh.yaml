      - number: '2.2'
        title: 规模测算视角与证据受限的 SAM 代理指标
        blocks:
          - type: paragraph
            body: >-
              公开市场研究一致显示，增材制造行业规模大、增长快，但它们无法干净隔离 Divergent 真正可触达的市场。Grand View Research 估计，2025 年广义增材制造市场为 $30.55
              billion；Precedence Research 则把同年广义 3D 打印市场估为 $29.29 billion。这些数字方向一致，也有助于定位，但仍是宽口径 TAM。更相关的垂直视角更小：Grand
              View 估计 2023 年航空航天 3D 打印市场为 $3.13 billion，Precedence 估计 2025 年金属 3D 打印市场为 $12.04 billion。这些数字更有用，因为
              Divergent 的目标零件是金属、终端使用且受认证约束。即便如此，精确的可服务市场（SAM）仍是缺口。公开来源没有按航空航天、国防和低批量汽车场景切出已认证终端金属增材生产，无法与 Divergent
              业务完全匹配。因此，最稳妥的做法是保留失败的测算路径，而不是假装已经算清：广义 AM TAM 很大，航空航天和金属 AM 子集明显更小，Divergent 近期可触达的楔形市场还要更窄。
