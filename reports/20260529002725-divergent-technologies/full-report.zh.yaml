      - number: '3.2'
        title: 软件主导和垂直整合挑战者
        blocks:
          - type: paragraph
            body: >-
              最清晰的软件主导挑战来自
              nTop。它不打印零件，也不自动化装配，但能通过掌握几何优化、可制造性逻辑和性能迭代，在工程师工作流早期取得位置。这很重要，因为谁塑造了设计边界，谁就能间接影响后续哪条制造路径可行。从这个意义上看，nTop
              战略重要性高，尽管它的变现模式不同于 Divergent。


              Relativity Space 是另一类相邻竞争者。它把增材制造用于垂直整合工业产品内部，因此证明端到端 AM 系统可以具备战略意义。但 Relativity 主要为火箭内部消耗其制造能力。其 2025
              年重组仍与 Divergent 相关，因为它凸显了一个风险：当商业化和融资时间线拉长时，资本强度会压垮雄心很大的垂直整合增材战略。
