companyProfile:
  summary: >-
    Divergent Technologies 是一家由创始人主导的先进制造平台，向客户销售 Divergent Adaptive Production
    System；这些客户为航空航天、国防、航天和先进车辆打造复杂、轻量化结构。公司把 AI 引导设计、金属增材制造、计量感知过程控制和自动化装配结合起来，让客户在传统制造缓慢或脆弱的项目中减少工装、零件数量和进度风险。
