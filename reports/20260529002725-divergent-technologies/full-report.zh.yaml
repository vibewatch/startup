      - number: '2.5'
        title: 约束、竞争压力与未解决的规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              主要约束和驱动因素一样重要。认证仍然困难：标准缺口尚未关闭，金属 AM 的疲劳和损伤容限方法仍是工作组活跃议题，Nadcap
              式审计预期要求材料、监测、可追溯性和后处理都受到严密控制。这些要求拉长采用周期，并偏向能够证明可重复性的供应商，而不是只宣传速度的供应商。竞争结构又增加了一层约束。Boeing 和 GE
              证明大型既有企业正在内部建设 AM 能力，Materialise 等认证服务商也显示外部服务机构可以满足严格航空航天标准。Divergent
              进入的不是空白市场。最后一项约束是市场规模纪律。现有公开数字支持增材制造规模大且在增长，但没有给出干净的 Divergent SAM，也没有显示 FY2026
              预算中专门用于增材制造的可见科目。这对估值工作很重要。正确结论不是机会小，而是必须用狭窄、用例驱动的采用逻辑来框定，而不是依赖一个泛化 TAM 头条。
