  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Divergent 证明平台经济性，拓宽客户组合，新产能顺利爬坡，并支撑类似软件的 15x-20x 收入认知。
        - $3.5B-$5.0B，时间维度 3-5 年；上行来自披露的收入增长和战略稀缺性溢价。
        - 资质认证受挫或利用率不达预期，会迅速打破乐观情景。
        - 有意义但有条件；需要比当前更好的披露。
      - - 基准
        - Divergent 执行足以守住品类领导力，但披露只部分改善，估值落在公开增材制造与平台可比公司之间。
        - $2.0B-$2.8B；当前进入可行，但缺少更清晰经济性时，安全边际有限。
        - 客户集中、债务不透明和采购时点不均，会让回报保持中等。
        - 仅凭公开信息最站得住的情景。
      - - 悲观
        - Divergent 仍是强技术公司，但经济性像资本密集型专业制造商，利用率不均。
        - $1.0B-$1.5B；收入端需求崩塌前，倍数压缩先占主导。
        - 资质认证延迟、项目滑坡或昂贵后续资本。
        - 如果披露没有改善，这一情景很容易成立。
    notes: 情景值是供投委会讨论的研究估计，不是目标价或管理层指引。
