        title: 供应链、产能吞吐与工厂爬坡风险
        blocks:
          - type: paragraph
            body: >-
              Divergent 自己的说法是，DAPS 压缩周期、减少零件数量，并把复杂结构制造中的工装摩擦剥掉。航空航天应用页面和 America Makes 资料把 DAPS
              描述为一套从设计到装配的集成系统，方向上支持这些说法，也让它们显得可信。 但同一组证据也说明吞吐风险转移到了哪里。当公司在六个月内导入 200 多个新的 A&D
              零件号、开设或规划新工厂，并从工程验证转向重复生产时，瓶颈会移到工厂内部：合格设备机时、粉末批次、维护窗口、检测吞吐和熟练工。 GAO 警告 DoD
              仍缺乏对原材料和零件供应商的全链路可见性，这进一步放大问题，因为 Divergent 即使工作流更数字化，仍处在更大的国防工业基础之内。 结果是典型的规模化张力：DAPS
              很可能缓解工装和传统铸造摩擦，但无法取消严格工业执行、供应商韧性和产能利用率管理的要求。
