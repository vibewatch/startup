        title: 上市公司行业基准
        blocks:
          - type: paragraph
            body: >-
              上市增材制造公司能给私人市场乐观预期提供有用的纪律校验。3D Systems 报告 2025 年收入 $386.9 million，但调整后 EBITDA 仍为负。Stratasys 实现超过 $551
              million 收入、正经营现金流、无债务，但 EBITDA 利润率只是温和水平。Velo3D 的画像仍更脆弱。Desktop Metal 出售给 Nano Dimension，以及之后的 Markforged
              交易，进一步说明行业结构仍在被整合和估值压力重置。


              这些可比公司合在一起，反对只因技术故事有吸引力就让 Divergent 免考经济性。正确解读更窄：如果 Divergent 比上市 OEM
              更深地嵌入客户生产项目，它或许应享有溢价；但公开市场证据表明，资本强度、利润率拖累和资产负债表质量仍决定谁能活到兑现承诺。
