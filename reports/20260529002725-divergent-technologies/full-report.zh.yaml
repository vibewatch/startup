  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方重叠
        blocks:
          - type: paragraph
            body: >-
              Divergent 并不在一个边界清晰的增材制造盒子里竞争。想减重、缩短认证周期或工业化新结构的买方，可以购买 nTop 这样的设计工具，也可以购买 Nikon SLM Solutions、EOS、Velo3D
              或 DMG MORI 的机器，选择 3D Systems 或 Desktop Metal 的更宽打印机组合，或把多家供应商拼成内部管理的生产栈。Divergent
              的特殊之处在于，它要求买方采用一套软件定义生产系统，而不是单台机器或一个点工具。


              这个框架很重要。相关替代方案不只是直接硬件供应商，而是航空航天、国防或性能车客户从设计意图走向合格金属零件的所有路径。实践中，最重要的竞争是栈拆解：如果客户相信最佳单点软件、打印和装配工程可以分别采购，且集成代价不高，Divergent
              的全系统溢价就更难守住。
            claimRefs:
              - CP001
              - CP002
              - CP019
              - CP027
              - CP037
