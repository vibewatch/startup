chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Divergent Technologies 是一家私营先进制造公司，2014 年成立，如今把自己定位成数字制造平台，而不是小众 3D 打印供应商。公司公开材料将 DAPS（Divergent Adaptive
              Production System）描述为端到端工作流：用 AI 工程软件优化结构，用增材制造生产金属节点和其他部件，再用软件定义的机器人装配把这些元素连接起来，不需要针对单一设计定制工装。这个组合很关键，因为
              Divergent 卖的不是一台打印机，而是把一套集成栈定位成传统“设计 + 工装 +
              装配”链条的替代方案。官方历史页面把公司起点放在汽车制造变革上，但当前页面和融资新闻稿显示，公司已采取更宽的多市场姿态，覆盖汽车、航空航天、国防，以及铸造替代、热交换器等精选工业场景。同一历史页面还称，Divergent
              同时经营 Tier 1 汽车供应商业务、航空航天供应商业务和 Czinger Vehicles。公开产品页面强化了软件定义、无工装、快速迭代的叙事；后续融资轮又把这套叙事放大成更大的工业基础逻辑。
