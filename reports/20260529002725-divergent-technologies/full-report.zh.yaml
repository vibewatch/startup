  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Divergent 时，市场边界应比泛泛的“3D
              打印”标签更窄。它真正的类别是面向终端结构的软件定义制造：把设计优化、金属增材制造、质量和认证工作流、自动化装配合成一个生产系统。这比独立打印机硬件、原型服务商或宽泛工厂自动化更具体。因此，实际竞争框架不只是打印机供应商，也包括今天仍在交付大量复杂零件的既有工艺和供应链。这些替代方案仍然强大。铸造、锻造、机加工、焊接和特定设计工装仍主导大多数工业生产，因为它们经过验证、认证深、且在极高批量下通常更便宜。Divergent
              最适合传统方法最弱的场景：复杂几何、轻量化、低批量或高混合生产、过时零件响应，以及交期与单位成本同样重要的项目。这个边界逻辑很关键，否则 AM 总可用市场（TAM）头条数字很容易被误读成可立即触达的需求。
