      - number: '3.4'
        title: 定价、切换成本与替代路径
        blocks:
          - type: paragraph
            body: >-
              整个品类公开定价透明度都低。这种不透明有利于依赖关系销售的既有企业，也让外部分析师更难判断 Divergent 的经济性相对单点软件或机器销售究竟落在哪里。可以判断的是，Divergent
              的定价逻辑大概率最不像商品化硬件。它销售的是生产系统，因此如果客户足够重视更快迭代、更低零件数量和集成装配，愿意接受项目式定价，公司就会受益。


              风险在于买方仍可能多归属。客户可以采用 nTop 做设计，购买 Nikon 或 EOS 机器生产，通过现有工厂认证 DMG MORI
              路线，或用内部工程避免平台依赖。这让切换成本很不均匀。一旦买方依赖软件、制造和装配合在一起的闭环，Divergent 的锁定效应最强；在这种运营集成被证明之前，锁定效应要弱得多。
