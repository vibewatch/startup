      - number: '3.5'
        title: 战略解读
        blocks:
          - type: paragraph
            body: >-
              对证据最强的解读是，Divergent 处在有利但要求很高的位置。保留的公开来源中，没有任何一项显示存在 DAPS 的一比一克隆。相反，Divergent
              站在计算设计、合格金属打印和自动化装配的交叉点。这创造了差异化空间，也意味着公司必须不断证明：客户为什么应购买整条闭环，而不是只买其中一个环节。


              对投资者而言，核心竞争问题不是增材制造是否拥挤，而是 Divergent 能否让工作流保持足够集成，使拆解始终代价高昂。最值得跟踪的外部信号包括 AM OEM
              之间的整合、既有机器供应商的国防导向表述，以及任何公开证据显示大客户要么把 DAPS 标准化，要么只把它视为多个供应商中的一个。
            claimRefs:
              - CP028
              - CP030
              - CP032
              - CP038
              - CP039
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 公开披露基线
        blocks:
          - type: paragraph
            body: >-
              Divergent 2025 年融资规模足够大，能形成可用的公开基线，但这个基线只覆盖已融资本和战略雄心。公司和多家新闻媒体称，$290 million E
              轮用于扩展数字制造产能，以满足国防和航空航天需求；据报道估值超过 $2.3 billion。这足以说明，投资者承销的是一个可定义品类的制造平台，而不是小型工装供应商。


              但这不足以承销近期财务表现。公开记录仍未披露收入、毛利率、烧钱速度、账上现金、积压订单质量或客户集中度。换句话说，融资轮是公开的；支撑该估值的运营模型基本不是公开的。这种不对称应决定本章阅读方式：资本获取和战略叙事有强证据，但真实承销缺口仍主要落在私有指标上。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI017
              - CI039
              - CI040
      - number: '4.2'
        title: 收入模型与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              对 Divergent 变现最稳妥的理解是项目制。公开材料描述的是软件定义生产系统，而不是打印机目录。这强烈暗示，收入可能来自工程或设计工作、合格零件生产，以及 DAPS
              比一次性机器销售更深入客户工作流的持续生产项目。如果属实，项目成熟后 Divergent 的收入质量可能好于纯硬件 OEM，因为公司参与了价值链更多环节。


              反面是收入确认不平滑，真实定价不透明。没有公开定价页或公开客户合同能让外部分析师拆分软件经济性和生产经济性。因此，投资者可以合理推断其战略位置优于机器销售商，但还不能证明公司财务上更像高粘性平台、专业合同制造商，还是两者的混合体。
