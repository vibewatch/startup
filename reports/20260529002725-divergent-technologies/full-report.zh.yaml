  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: DAPS 工作流与客户实际购买的东西
        blocks:
          - type: paragraph
            body: >-
              Divergent 的产品不是单台打印机，也不是单点检测工具；它是 Divergent Adaptive Production
              System，一套软件定义制造工作流，公司持续把它压缩成三个动词：设计、打印、装配。公开材料显示，工作流从需求捕获和 AI 工程软件开始，随后进入用特定应用合金增材制造打印
              Nodes，最后以不需要特定设计工装的自动化机器人装配收尾。商业含义很重要：买方购买的不只是单个零件，也是在购买速度、迭代和规避工装。Divergent 的
              R&D、生产和保障页面都描述同一核心栈服务客户生命周期的不同节点，因此公司有理由把一个平台同时营销给原型开发、低速率生产和紧急保障工作。
