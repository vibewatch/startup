        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2025 年融资显著改善了 Divergent
              的融资位置，但没有结束资本充足性讨论。股权与债务的组合、对产能扩张的强调，以及终端市场结构，都指向一个扩张时仍会消耗大量资本的业务。航空航天和国防制造要先投入认证、设备、设施建设和营运资本，之后才可能产生清晰的经常性经济性。这不是对战略的批评，而是该战略的财务形态。


              实际问题是，什么里程碑能避免下一次融资需求。公开层面，管理层给出的证据足以让人相信，利用率爬坡、生产吞吐和利润率证明才是真正的下一轮触发点。公开层面，管理层还没有给出足够证据来精确建模现金跑道。因此，投资者应把
              2025 年融资视为强缓冲，而不是资本依赖已经消失的证明。
