      - number: '2.3'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              对 Divergent 这类平台最重要的买方，是面对复杂度、认证负担和供应链压力的航空航天
              OEM、国防主承包商和保障组织。在这些环境里，工程团队和先进制造团队通常先识别用例，但他们不能单独推动采购。质量组织、认证专家和项目办公室往往决定一个数字制造零件能否从概念走到量产。这意味着“买方”在结构上是多线程的：只有用户热情不够，认证和项目资金也必须对齐。Boeing
              和 GE 的公开买方证据在这里有参考价值。Boeing 的 Auburn 增材中心专门用于提高工艺可重复性，并满足飞行件的认证要求。GE 的 Auburn
              运营则显示，在合适用例中，航空航天客户会从原型走向真实生产量。这些例子也说明，Divergent 的机会有吸引力但要求高：买方存在、预算存在、真实生产也存在，但采用路径靠的是认证和运营证明，而不是简单硬件销售。
