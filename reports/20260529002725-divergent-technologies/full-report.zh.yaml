      nodes:
        - id: proof
          label: 战略验证
          detail: $2.3B 估值、具名国防客户、600+ 个零件，以及持续融资能力。
          tone: positive
        - id: publicam
          label: 纯 AM 可比公司检验
          detail: Divergent 的估值高于公开增材制造组合的合计水平。
          tone: warning
        - id: platform
          label: 平台上行空间
          detail: 若经济性接近系统平台，溢价或许站得住。
          tone: positive
        - id: opacity
          label: 披露缺口
          detail: 收入、利润率、产能利用率和优先权条款仍未公开。
          tone: negative
        - id: risk
          label: 执行风险
          detail: 认证、客户集中度和资本开支都可能压缩倍数。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 保持跟踪，但不要把当前估值视为仅凭公开信息即可买入。
          tone: neutral
      edges:
        - from: proof
          to: platform
        - from: publicam
          to: decision
        - from: platform
          to: decision
        - from: opacity
          to: decision
        - from: risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV007
      - CV014
      - CV021
      - CV024
      - CV035
      - CV038
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 没有公开收入数据时，最清晰的敏感性口径，是在不同收入倍数下支撑 $2.3B 估值所需的收入门槛。
    data:
      items:
        - label: 1.6x 下所需收入
          value: 1438
          unit: USD million
          note: Microcap 给出的公开航空航天板块收入倍数中位数。
        - label: 3.74x 下所需收入
          value: 615
          unit: USD million
          note: PCE 给出的 2026 年 Q1 A&D 交易收入倍数中位数。
        - label: 10x 下所需收入
          value: 230
          unit: USD million
          note: 激进的平台型私人市场倍数。
        - label: 15x 下所需收入
          value: 153
          unit: USD million
          note: 极强的软件化或稀缺性私人市场倍数。
    approximationNotes: 所有数值都是基于 $2.3B Series E 轮估值做的简单估值 / 收入门槛计算。
    claimRefs:
      - CV001
      - CV022
      - CV023
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅凭公开信息，最站得住的区间覆盖下行倍数压缩到上行平台逻辑被验证。
    data:
      items:
        - label: 悲观情景
          low: 1
          mid: 1.25
          high: 1.5
          displayValue: $1.0B-$1.5B
          detail: 硬件化经济性、客户集中度或产能利用率不达预期，会把估值拉到当前水平之下。
          tone: negative
        - label: 基准情景
          low: 2
          mid: 2.4
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: 平台领先地位守住，但披露只部分改善。
          tone: warning
        - label: 乐观情景
          low: 3.5
          mid: 4.2
          high: 5
          displayValue: $3.5B-$5.0B
          detail: 收入、产能利用率和软件化经济性变得可见且可信。
          tone: positive
    approximationNotes: 区间是供投资委员会讨论的情景估计，不是管理层指引，也不是贴现现金流模型输出。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Divergent 的市场顺风和产品契合度得分高，但当前价格下，披露质量和入场纪律得分低。
    data:
      items:
        - label: 市场顺风
          score: 8
          detail: 国防与工业基础的需求紧迫性确实存在。
          tone: positive
        - label: 客户 / 产品验证
          score: 7
          detail: 具名客户、600+ 个零件和一体化 DAPS 逻辑都是实打实的加分项。
          tone: positive
        - label: 平台差异化
          score: 7
          detail: 软件 + 增材制造 + 组装的混合逻辑具备差异化。
          tone: positive
        - label: 财务透明度
          score: 3
          detail: 收入、毛利率、产能利用率和订单积压仍未公开。
          tone: negative
        - label: 治理清晰度
          score: 4
          detail: 后期阶段的董事会构成和权利安排公开透明度仍弱。
          tone: warning
        - label: 估值纪律
          score: 4
          detail: 当前价格要有更好的经济性支撑，才会变得有吸引力。
          tone: warning
        - label: 退出可见度
          score: 6
          detail: 战略买家和 crossover 路径有可能，IPO 路径仍需打磨。
          tone: neutral
        - label: 证据质量
          score: 5
          detail: 证据足够让团队继续跟踪，但还不够支撑激进投资判断。
          tone: warning
    approximationNotes: 评分是投资委员会的序位判断，锚定已引用的公开证据。
    claimRefs:
      - CV006
      - CV007
      - CV024
      - CV029
      - CV035
      - CV041
      - CV045
