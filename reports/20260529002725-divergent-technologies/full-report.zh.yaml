  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与剩余风险排序
        blocks:
          - type: paragraph
            body: >-
              理解 Divergent 的风险栈，最好把它看成传导问题，而不是清单问题。公司已经走过原型阶段承诺：公开来源确认了 $2.3 billion E 轮、2025 年上半年 200
              多个新的航空航天和国防零件号、生产中超过 600
              个独特零件，以及国防和航空航天领域的具名客户。这些进展抬高了“现在还能出什么问题”的门槛。第一且最高的剩余风险是资质和认证。一旦产品组合包含安全关键有人驾驶飞机零件和陆军认证部件，文档、过程控制或重新认证失败，就可能同时拖延收入并侵蚀客户信任。第二层是吞吐和供应执行：新设施和更广的项目负载，会提高公司对机器正常运行时间、粉末可得性、人员配置和内部产线平衡的敏感度。第三层是国防集中度——少数公开具名主承包商和机构，加上持续决议的时间摩擦，可能造成利用率大幅波动。资本强度和治理不透明也严肃，但目前相较运营和认证栈属于次级风险。
