      - number: '7.4'
        title: 国防采购与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              公开牵引力很亮眼，但被点名的客户集合仍然窄。现有最佳外部来源反复提到 General Atomics、Lockheed Martin、Raytheon / RTX、Triumph、General
              Dynamics，以及 Army 相关工作。 这一点重要，因为这类项目中，资金画像、里程碑节奏和网络合规都可能改变订单和生产节拍，而长期需求未必变化。PCE 的 Q1 2026 A&D
              更新明确指出，即使买方意愿仍强，持续决议也会带来时间摩擦。 Acquisition.gov 和 GAO 从合规侧给出同样结论：对接触受控国防信息的供应商来说，CMMC 和 DFARS 义务已经是运营闸门。 对
              Divergent 来说，核心客户集在战略上有吸引力，但运营上没有容错。一个导弹、飞机或地面车辆项目延迟，就能打击产能利用率；一次网络或认证失误，就能压窄未来项目入口。
              风险不是需求消失，而是需求到来得不均匀，并且受严格合规条件约束。
