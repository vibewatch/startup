            title: 国防保障让 AM 不只是原型故事
            body: 本章最强证据不是市场研究 CAGR，而是 DoD 自身保障证据和聚焦国防的行业报道：增材制造被用于本地化生产、替代过时零件，并压缩任务关键硬件的交期。这给 Divergent 创造了真实买方问题。
