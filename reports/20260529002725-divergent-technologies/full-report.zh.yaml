      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开可见的领导层主要集中在 Czinger 家族。公司官方历史称 Kevin Czinger 为创始人兼执行董事长，Lukas Czinger 为联合创始人、总裁兼
              CEO。融资记录补充了一个重要时间细节：2023 年 D 轮新闻稿仍称 Kevin 是创始人、首席发明人兼 CEO，Lukas 是总裁兼 COO；而 2025 年 E 轮新闻稿则称 Lukas 是 CEO
              兼联合创始人。这说明两次发布之间确实发生了公开领导权交接，尽管可获取的公开材料没有解释董事会流程，也没有说明背后是否伴随更广泛的管理层重组。除这两位高管外，治理透明度仍然偏低。已获取的公司和融资公开材料没有披露完整董事会名单、委员会结构或控制权框架。这不等于治理薄弱，但意味着关键人物依赖仍是活跃尽调问题。公司的故事、产品逻辑和融资仍与创始人叙事紧密绑定，后期投资者材料也不能替代一套当前治理资料包。
