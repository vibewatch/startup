  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：战略溢价可以理解，但公开证据不足以完成承销
        blocks:
          - type: paragraph
            body: >-
              Divergent 不像一个随机的后周期深科技估值标的。公司有可见的国防相关性、真实客户名称、一套软件加工厂的集成叙事，也从 2023 Series D 到 2025 Series E 获得重复资本支持。
              因此，公开来源支持认真看待它的品类领导者地位。问题在于，公开记录仍不足以支撑投资级定价。Series E 的融资规模和估值标题很清楚，但经济性不清楚：收入、毛利率、利用率、积压订单结构和优先股堆叠都未披露。
              这迫使投资者用间接可比逻辑，而不是直接单位经济来锚定判断。从这个视角看，Divergent 已经高于成熟上市增材制造专门公司，这既显示野心，也显示风险。
              它仍可能跑通——但前提是公司证明自己是平台型国防制造系统，而不只是更好的专业零件生产商。因此建议仍是继续研究，而不是买入。
