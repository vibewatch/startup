        - 如果收入和利润率仍不披露，仅有品类相关性不足以支撑价格。
      - - 当前价格已经超过几家成熟增材制造公司的公开市值合计。
        - 反向逻辑
        - 更清晰的收入衔接证据，或已披露增长显著更快，可能支撑高于公开增材制造可比公司的价格。
      - - 本轮含债务且未披露优先权，下行情境更难建模。
        - 反向逻辑
        - 看清债务条款和股权结构瀑布后，承销判断可能大幅改善或恶化。
      - - 资质认证、采购时点和客户集中度都可能在市场需求变化前打击利用率。
        - 反向逻辑
        - 更广客户组合和可见积压订单多样性会降低这一担忧。
