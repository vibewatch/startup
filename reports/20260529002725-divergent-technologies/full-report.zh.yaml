              公开融资披露显示，公司在很短时间内从战略验证走向超大规模成长融资。Hexagon 在 2022 年 12 月宣布投资 $100 million，随后公司 2023 年 11 月 D 轮新闻稿披露，该轮 $230
              million 由这笔 Hexagon 支票领投。2025 年 9 月，Divergent 宣布规模更大的 $290 million E 轮，其中 $250 million 为股权、$40 million
              为债务，估值 $2.3 billion，由 Rochefort Asset Management 领投。这些融资把 Divergent
              定位成重资本化的先进制造平台，而不是轻资金零部件供应商。相较融资总额，股权数据透明度更低。最清晰的非一级市场信号来自 2024 年 Apollo Future Mobility 老股交易：公开报道和 HKEX
              材料显示，Apollo Future Mobility 以约 $101.5 million 向 Lateralus 出售了约 12.87% 的 Divergent
              已发行股份。这笔交易值得关注，因为它说明股东基础在变化，也因为带有国防属性的制造资产可能对谁能持有股权较敏感。但公开记录仍没有给出完整的当前股权结构表或权利摘要。
