      - number: '8.2'
        title: 可比背景：定价高于纯增材制造公司，低于已披露的平台领导者
        blocks:
          - type: paragraph
            body: >-
              给 Divergent 定位，最清晰的方式是把它放在三个桶之间。第一桶是纯增材制造公司——Stratasys、3D Systems 和 Materialise——三者合计价值低于 Divergent 2026 年
              5 月的私募估值。 这说明公开市场仍对资本密集型增材制造专门公司保持怀疑。第二桶是 Xometry，其估值约 $5.0 billion，高于 Divergent，但也披露了 $687 million 的 2025
              收入，并且市场模型已经明显规模化。 第三桶是 Symbotic 和 PTC 这类更高阶的自动化与工业软件公司，它们更大的市值由更广商业触达和远好于 Divergent 的披露支撑。 因此，Divergent
              当前价格隐含的判断是，它不应被当作大宗 AM 供应商，而是按带有国防紧迫性的系统平台定价。这个方向可能是对的。 但在公开数据给出更接近 Xometry
              的收入和利润率证据，或显示类似软件的平台行为之前，相对公开增材制造篮子的溢价需要纪律，而不是热情。
