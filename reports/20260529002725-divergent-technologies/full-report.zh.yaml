      - number: '4.5'
        title: 承销观点与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              从财务上看，最清晰的承销结论是：Divergent 战略位置看起来强于许多上市增材制造同行，但仍无法基于公开自由现金流承销。上行情景可信：如果 DAPS
              在一个闭环里捕获工程、零件生产和装配经济性，Divergent
              可能获得比打印机销售商更高的客户粘性，并最终获得更好利润率。下行情景也可信：如果业务表现更像资本密集的先进制造商，且利用率不透明，估值可能比投资者预期更久地跑在基本面前面。


              因此，缺失指标才如此关键。收入结构、毛利率、按项目计算的贡献利润率、现金余额、烧钱速度、客户集中度和每个生产单元的 capex 不是例行项目；它们是判断 Divergent
              是在复合平台经济性，还是只是在复合工业复杂度所需的证据。在这些数字被分享之前，本章支持战略正面观点，但财务信心分数刻意保持不完整。
