            body: >-
              最强公开技术细节来自 America Makes 和 D 轮材料。这些来源把 DAPS 描述为 AI 驱动的生成式设计，配合粉末床金属增材制造和无夹具自动化装配。America Makes 进一步点名一个 GPU
              驱动的拓扑优化引擎，它从避让区、接口点和载荷路径出发，并描述了与 SLM Solutions 共建的自研 LPBF
              打印机。航空航天应用页面随后展示了这套栈如何落在具体几何中：一体化机身段、多节点油箱、进气和排气结构、载荷挂架。公开引用的结果仍由公司报告，但足够具体，值得尽调关注：周期时间缩短 10x、新项目开发速度快
              2-5x、零件数量减少 45x，以及航空航天参考概念的可变成本降低 2-3x。合起来看，这些来源支持一个判断：Divergent 的差异化来自过程集成，而不是某个单一零件或机器。
