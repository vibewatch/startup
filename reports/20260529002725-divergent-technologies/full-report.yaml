        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is concentrated in the Czinger family. Official company history names Kevin
              Czinger as founder and executive chairman and Lukas Czinger as co-founder, president, and CEO. The
              financing record adds an important timing nuance: the 2023 Series D release still described Kevin as
              founder, lead inventor, and CEO while Lukas was president and COO, whereas the 2025 Series E release
              describes Lukas as CEO and co-founder. That suggests a real public leadership transition occurred between
              those releases even though fetched public materials do not explain the board process or any broader
              management reorganization behind it. Governance transparency remains thin beyond those two executives.
              Publicly fetched company and financing materials do not disclose a full board roster, committee structure,
              or control-rights framework. That does not mean governance is weak, but it does mean key-person dependence
              is still a live diligence issue. The company’s story, product logic, and capital raises remain closely
              tied to founder narratives, and later-stage investor materials do not substitute for a current governance
              package.
