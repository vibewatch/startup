            body: >-
              Divergent’s public scale story is stronger on product, customers, and throughput markers than on
              conventional operating metrics. On the automotive side, the 2023 Series D release said the company had
              seven blue-chip automotive customers including Aston Martin and Mercedes-AMG, while the 2025 Series E
