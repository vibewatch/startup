      - number: '1.3'
        title: Funding History, Capital, and Ownership Signals
        blocks:
          - type: paragraph
            body: >-
              Public financing disclosures show a company that moved from strategic validation to very large growth
              funding in a short period. Hexagon announced a $100 million investment in December 2022, then the
              company’s November 2023 Series D release disclosed a $230 million round led by that Hexagon check. In
              September 2025 Divergent announced a much larger $290 million Series E composed of $250 million of equity
              and $40 million of debt at a $2.3 billion valuation, led by Rochefort Asset Management. Those rounds frame
              Divergent as a heavily capitalized advanced-manufacturing platform rather than a lightly funded component
              supplier. Ownership data are less transparent than financing totals. The clearest non-primary signal is
              the 2024 Apollo Future Mobility secondary transaction, where public reporting and HKEX materials exposed a
              sale of roughly 12.87 percent of Divergent’s issued shares to Lateralus for about $101.5 million. That
              transaction is relevant because it shows the shareholder base is dynamic and because a defense-linked
              manufacturing asset may be sensitive to who can own it. But the public record still stops short of a full
              current cap-table or rights summary.
