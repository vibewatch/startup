      inspection, and delivery.
    data:
      nodes:
        - id: req
          label: Requirements
          detail: Customer mission, load paths, interfaces, and manufacturability constraints are defined.
        - id: design
          label: AI design
          detail: In-house software and topology optimization generate structural geometry.
        - id: print
          label: Print Nodes
          detail: Metal structures are additively manufactured using LPBF / PBF-LB methods.
        - id: assembly
          label: Robotic assembly
          detail: Nodes and structures are assembled without design-specific tooling.
        - id: qual
          label: Inspection and qualification
          detail: Quality systems and customer / defense qualification gates are applied.
        - id: deliver
          label: Delivery and iteration
          detail: Hardware is delivered and the digital workflow can restart quickly for redesign or scale-up.
