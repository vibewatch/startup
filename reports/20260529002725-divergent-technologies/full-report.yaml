  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue and backlog
        - Current revenue run-rate, backlog by customer/program, and recurring vs project mix
        - Needed to anchor any direct revenue-multiple underwrite
        - Management finance team / diligence data room.
      - - Margins and utilization
        - Plant utilization, scrap / rework, and gross-margin bridge
        - Determines whether Divergent behaves like a platform or a specialty manufacturer
        - Operations review plus plant KPI pack.
      - - Capital structure
        - Preference stack, lender covenants, debt maturity, collateral, and liquidation waterfall
        - Changes downside materially even if topline story is strong
        - Legal counsel and financing documents.
      - - Customer concentration
        - Top-10 customers, top programs, and contract duration
        - A few large programs can dominate factory economics
        - Commercial leadership and backlog schedule.
      - - Governance
        - Board composition, committees, and approval rights
        - Late-stage valuation and IPO path require governance legibility
        - Corporate secretary / investor materials.
    notes: These asks are not housekeeping; they are valuation inputs.
