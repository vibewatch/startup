chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Divergent Technologies is a privately held advanced-manufacturing company founded in 2014 that now
              presents itself as a digital-manufacturing platform rather than a niche 3D-printing vendor. The company’s
              public materials describe DAPS, the Divergent Adaptive Production System, as an end-to-end workflow that
              uses AI-enabled engineering software to optimize structures, additive manufacturing to produce metal nodes
              and other components, and software-defined robotic assembly to join those elements without design-specific
              tooling. That combination matters because Divergent is not selling a printer alone: it is positioning one
              integrated stack as a substitute for legacy design-plus-tooling-plus-assembly chains. The official history
              page roots the company in automotive disruption, but current pages and financing releases show a broader
              multi-market posture spanning automotive, aerospace, defense, and selected industrial use cases such as
              casting replacement and heat exchangers. The same history page also says Divergent operates across a Tier
              1 automotive supplier business, an aerospace supplier business, and Czinger Vehicles. Public product pages
              reinforce a software-defined, tool-less, rapid-iteration narrative that later financing rounds convert
              into a larger industrial-base thesis.
