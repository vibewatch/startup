              Financially, the clearest underwriting conclusion is that Divergent looks strategically stronger than many
              public additive-manufacturing peers but still cannot be underwritten on a public free-cash-flow basis. The
              upside case is plausible: if DAPS captures engineering, part production, and assembly economics in one
              loop, Divergent could earn better customer stickiness and eventually better margins than a printer seller.
              The downside case is also plausible: if the business behaves more like a capital-intensive advanced
              manufacturer with opaque utilization, the valuation could prove ahead of fundamentals for longer than
              investors expect.


