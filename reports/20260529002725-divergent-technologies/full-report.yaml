  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Qualification / production miss
        - A flagship aerospace or defense program slips because Divergent cannot certify or industrialize on schedule
        - Breaks the platform-like execution premium
        - Re-rate toward public AM / manufacturing multiples.
      - - Utilization shortfall
        - New plant capacity comes online without visible backlog support
        - Converts strategic growth spend into capital-intensity drag
        - Assume lower future valuation support and harder financing terms.
      - - Customer concentration revealed
        - A handful of programs account for most revenue or backlog
        - Turns category leadership into concentrated project risk
        - Demand a lower price or broader contract evidence before investing.
      - - Capital structure worsens
        - Additional debt or aggressive terms appear before disclosure improves
        - Reduces value of headline private mark for new money
        - Keep stance at research-more or avoid.
      - - Governance remains opaque
        - Next financing still lacks board, committee, and rights transparency
        - Blocks IPO-quality or crossover-quality underwrite
        - Limit the company to watchlist / diligence status.
    notes: These triggers convert a fascinating strategic story into explicit IC guardrails.
