  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Divergent should be analyzed inside a narrower market than the generic “3D printing” label implies. Its
              relevant category is software-defined manufacturing for end-use structures: design optimization, metal
              additive manufacturing, quality and qualification workflow, and automated assembly brought together as one
              production system. That is a more specific market than standalone printer hardware, prototyping bureaus,
              or broad factory automation. The practical competitive frame is therefore not only printer vendors, but
              also the incumbent processes and supply chains that still deliver many complex parts today. Those
              substitutes remain powerful. Casting, forging, machining, welding, and design-specific tooling still
              dominate most industrial production because they are proven, deeply qualified, and often cheaper at very
              high volumes. Divergent’s strongest fit is where those legacy methods are weakest: complex geometries,
              lightweighting, low-volume or high-mix production, obsolescence response, and programs where lead time
              matters as much as unit cost. That boundary logic is essential because otherwise headline AM TAM figures
              can be mistaken for immediately reachable demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM047
