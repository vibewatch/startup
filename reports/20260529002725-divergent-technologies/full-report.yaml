  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      DAPS is best understood as a four-layer stack linking computational design, metal printing, robotic assembly, and
      qualification-enabled delivery.
    data:
      layers:
        - id: design
          label: Computational Design
          modules:
            - Requirements capture
            - AI-enabled engineering software
            - GPU topology optimization
        - id: print
          label: Metal Additive Manufacturing
          modules:
            - Printed Nodes
            - LPBF / PBF-LB processes
            - Application-specific alloys
        - id: assembly
          label: Software-Defined Assembly
          modules:
            - Fixtureless robotic assembly
            - Functionally integrated structures
            - Large multi-part assemblies
        - id: assurance
          label: Quality & Qualification
          modules:
            - AS9100D / ISO 9001
            - Nadcap AM LPBF
            - Army / DAWGS qualification pathways
    approximationNotes: >-
      Layering is synthesized from public product pages, America Makes, and qualification coverage; exact control
      software remains undisclosed.
