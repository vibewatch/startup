  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and residual ranking
        blocks:
          - type: paragraph
            body: >-
              Divergent’s risk stack is best understood as a transmission problem rather than a checklist. The company
              has already moved beyond prototype-stage promise: public sources confirm a $2.3 billion Series E, 200-plus
              new aerospace and defense part numbers in the first half of 2025, more than 600 total unique parts in
              production, and named customers across defense and aerospace. That progress raises the bar for what can
              now go wrong. The first and highest residual risk is qualification and certification. Once the product mix
              includes safety-critical manned-aircraft parts and Army-qualified components, failures in documentation,
              process control, or requalification can delay revenue and erode customer trust simultaneously. The second
              tier is throughput and supply execution: new facilities and broader program load increase sensitivity to
              machine uptime, powder availability, staffing, and internal line-balance. The third tier is defense
              concentration — a small set of publicly named primes and agencies, combined with continuing-resolution
              timing friction, can create outsized utilization swings. Capital intensity and governance opacity are
              serious but currently secondary to the operating and qualification stack.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR022
              - CR031
