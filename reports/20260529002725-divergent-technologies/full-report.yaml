      - number: '2.2'
        title: Sizing Lenses and Evidence-Constrained SAM Proxies
        blocks:
          - type: paragraph
            body: >-
              Public market studies consistently show a large and fast-growing additive-manufacturing sector, but they
              do not isolate Divergent’s actual reachable market cleanly. Grand View Research estimated the broad
              additive manufacturing market at $30.55 billion in 2025, while Precedence Research put the broad
              3D-printing market at $29.29 billion in the same year. Those numbers are directionally consistent and
              helpful for orientation, but they are still broad TAMs. More relevant vertical lenses are smaller: Grand
              View estimated aerospace 3D printing at $3.13 billion in 2023, and Precedence estimated metal 3D printing
              at $12.04 billion in 2025. Those figures are more useful because Divergent’s target parts are metallic,
              end-use, and qualification-sensitive. Even so, a precise SAM remains a gap. Public sources do not carve
              out certified end-use metal additive production across aerospace, defense, and low-volume automotive in a
              way that matches Divergent’s business. The defensible approach is therefore to preserve the failed sizing
              path rather than pretend otherwise: broad AM TAM is large, aerospace and metal-AM subsets are meaningfully
              smaller, and Divergent’s near-term reachable wedge is narrower still.
            claimRefs:
