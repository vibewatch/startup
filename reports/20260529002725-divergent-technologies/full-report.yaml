      - number: '8.2'
        title: 'Comp context: priced above pure-play additive, below disclosed platform leaders'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame Divergent is as a hybrid between three buckets. First are pure-play additive
              names — Stratasys, 3D Systems, and Materialise — which together are worth less than Divergent’s private
              mark in May 2026. That tells you public markets remain skeptical of capital-intensive additive
              specialists. Second is Xometry, which sits above Divergent at roughly $5.0 billion but also discloses $687
              million of 2025 revenue and a visibly scaled marketplace model. Third are higher-order automation and
              industrial-software names like Symbotic and PTC, whose much larger market caps are backed by broader
              commercial reach and vastly better disclosure. Divergent’s current price therefore implies it should not
              be thought of as a commodity AM vendor. It is being priced as a system platform with defense urgency. That
              may be directionally right. But until public data shows revenue and margin proof closer to Xometry or
              software-like platform behavior, the premium over the public additive basket deserves discipline rather
              than enthusiasm.
