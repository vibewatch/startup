      - number: '7.2'
        title: Qualification, certification, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              The most important question is not whether Divergent has any certifications — it does — but whether public
              evidence is strong enough to underwrite repeated success across expanding safety-critical programs.
              Divergent publicly states that it is a fully-qualified Tier 1 supplier and lists AS9100D, ISO 9001, and
              Nadcap AM LPBF. Those are real mitigants, not marketing decoration. TRIUMPH also announced qualification
              work on multiple manned-aircraft components, with rigorous testing and eventual authority certification.
              Yet the regulatory bar remains high and ongoing. FAA guidance for additive-manufactured aerospace parts
              explicitly calls out quality systems, material and process control, and structural substantiation. EASA’s
              additive-manufacturing memorandum likewise frames certification expectations across multiple aircraft
              classes. Put simply: Divergent has proof that qualification is achievable, but the company’s public
              evidence also shows that qualification remains expensive, iterative, and program-specific. Residual risk
              therefore stays high until a broader set of serial production programs shows repeatability, not just
              landmark wins.
            claimRefs:
