      - number: '7.4'
        title: Defense procurement and customer concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public traction is impressive, but the named set is still narrow. The best available external sources
              repeatedly cite General Atomics, Lockheed Martin, Raytheon / RTX, Triumph, General Dynamics, and
              Army-related work. That matters because these are exactly the kinds of programs where funding profile,
              milestone timing, and cyber compliance can alter booking and production cadence without changing long-term
              demand. PCE’s Q1 2026 A&D update is explicit that continuing resolutions introduce timing friction even
              when buyer appetite remains strong. Acquisition.gov and GAO make the same point from the compliance side:
              CMMC and DFARS obligations are now operational gating items for suppliers touching controlled defense
              information. For Divergent, this means the core customer set is strategically attractive but operationally
              unforgiving. One delayed missile, aircraft, or ground-vehicle program can hit utilization, and one cyber
              or certification miss can narrow access to future work. The risk is not that demand disappears; it is that
              demand arrives unevenly and under strict compliance conditions.
