  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: understandable strategic premium, incomplete public underwriting'
        blocks:
          - type: paragraph
            body: >-
              Divergent does not look like a random late-cycle deep-tech mark. The company has visible defense
              relevance, real customer names, an integrated software-plus-factory narrative, and repeat capital support
              from the 2023 Series D to the 2025 Series E. Public sources therefore support taking the company seriously
              as a category leader. The problem is that the public record still stops short of investment-grade price
              support. The Series E headline is clean on size and valuation, but not on economics: revenue, gross
              margin, utilization, backlog mix, and preference stack remain undisclosed. That forces investors to anchor
              on indirect comp logic instead of direct unit economics. On that lens, Divergent already sits above mature
              public additive specialists, which is a sign of ambition and of risk. It can still work — but only if the
              company proves it is a platform-like defense manufacturing system rather than simply a better
              specialty-parts producer. That is why the recommendation remains research-more rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV021
              - CV024
              - CV035
              - CV038
              - CV045
