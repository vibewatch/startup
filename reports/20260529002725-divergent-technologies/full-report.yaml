  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public disclosure baseline
        blocks:
          - type: paragraph
            body: >-
              Divergent’s 2025 financing is large enough that it creates a usable public baseline, but only for capital
              raised and strategic ambition. The company and multiple news outlets describe a $290 million Series E tied
              to scaling digital manufacturing capacity for defense and aerospace demand, with reported valuation above
              $2.3 billion. That is enough to say investors are underwriting a category-forming manufacturing platform
              rather than a small tooling vendor.


              It is not enough to underwrite near-term financial performance. The public record still does not disclose
              revenue, gross margin, burn, cash on hand, backlog quality, or customer concentration. In other words, the
              financing round is public; the operating model behind that valuation mostly is not. That asymmetry should
              shape how this chapter is read: strong evidence exists on capital access and strategic narrative, but
              private metrics still dominate the actual underwriting gap.
