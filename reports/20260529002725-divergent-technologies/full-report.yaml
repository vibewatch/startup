      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense sustainment makes AM more than a prototyping story
            body: >-
              The strongest evidence in this chapter is not a market-study CAGR. It is the DoD’s own sustainment
              evidence and the defense-focused trade reporting showing additive manufacturing used to localize
              production, replace obsolete parts, and compress lead times for mission-critical hardware. That creates a
              real buyer problem for Divergent to solve.
            calloutType: strength
            claimRefs:
              - CM026
              - CM027
              - CM040
          - type: callout
            title: Certification friction keeps a wide gap between TAM and deployable revenue
            body: >-
              America Makes, AIA, EASA, FAA, and Nadcap all point to the same reality: qualification of metal AM parts
              remains laborious. A supplier can have compelling technology and still lose time, margin, or program
              access if its materials, monitoring, fatigue evidence, and process controls are not accepted by the
              customer or regulator.
            calloutType: risk
            claimRefs:
              - CM018
              - CM019
