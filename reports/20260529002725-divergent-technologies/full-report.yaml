      - number: '7.5'
        title: Capital intensity and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Divergent is not a software company wearing a manufacturing costume. The company is raising large
              mixed-capital rounds because it is building industrial capacity, not just selling code. The 2023 Series D
              brought in $230 million, including a $100 million Hexagon investment, and the 2025 Series E added another
              $290 million with a debt component. Public reporting ties that money directly to new factories, plant
              expansion, and capacity scaling. That is strategically coherent, but it also means the downside can
              tighten quickly if utilization lags. Governance does not fully de-risk that picture because the public
              record is thin on board composition, committee oversight, and shareholder-control mechanics. The official
              materials are rich on product vision, customers, and capital raised, but poor on independent-governance
              detail. For a late-stage company with debt in the stack and heavy factory scaling ahead, that opacity is
              not fatal — but it is material enough to keep this from screening as a low-residual-risk industrial
              platform.
            claimRefs:
