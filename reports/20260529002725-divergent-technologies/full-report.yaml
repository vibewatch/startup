      - number: '2.5'
        title: Constraints, Competitive Pressure, and Open Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraints are just as important as the drivers. Qualification remains hard: standards gaps are
              still open, fatigue and damage-tolerance methods for metal AM remain active working-group topics, and
              Nadcap-style audit expectations demand tight control of materials, monitoring, traceability, and
              post-processing. These requirements lengthen adoption cycles and favor suppliers that can prove
              repeatability rather than simply advertise speed. Competitive structure adds another constraint. Boeing
              and GE demonstrate that large incumbents are building AM capability internally, while certified providers
              such as Materialise show that external service bureaus can also meet demanding aerospace standards.
              Divergent is not entering an empty field. Market sizing discipline is the final constraint. Available
              public numbers support the case that additive manufacturing is large and growing, but they do not give a
              clean Divergent SAM or a visible FY2026 budget line dedicated solely to additive manufacturing. That
              matters for valuation work. The right conclusion is not that the opportunity is small; it is that it must
              be framed through narrow, use-case-specific adoption logic rather than through a single generic TAM
              headline.
