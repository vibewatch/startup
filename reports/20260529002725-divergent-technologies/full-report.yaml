      - number: '7.6'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The right way to underwrite Divergent is not to deny the risks, but to convert them into monitorable
              gates. On the positive side, the company already has stronger mitigation evidence than many venture-backed
              manufacturing peers: AS9100D and Nadcap AM LPBF are in place, TRIUMPH is willing to qualify
              safety-critical manned-aircraft parts, DAPS claims cycle-time and tooling advantages, and the company has
              attracted repeat strategic capital. Those are meaningful. But they are not enough to make the risk
              register static. Investors should monitor qualification cadence, plant utilization, cyber/compliance
              readiness, disclosed customer breadth, and whether capital formation continues to arrive on constructive
              terms. A thesis break occurs if a safety-critical qualification fails, if one or two large defense
              programs appear to dominate visible demand, if factory expansion outruns booked work, or if debt and
              governance terms remain too opaque once the company seeks the next step-up in valuation. The mitigations
              are real; the monitoring burden is real too.
            claimRefs:
