      - number: '8.4'
        title: Exit paths and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Divergent has multiple plausible exit routes, but every attractive route demands better disclosure than
              public investors currently have. A strategic sale to a defense prime, aerospace supplier, or
              industrial-software / metrology partner is plausible because the company sits at the junction of
              mission-critical manufacturing, digital tooling, and domestic industrial-base urgency. A later crossover
              round is plausible if revenue and margin data become available and the company can show multi-program
              utilization rather than a small number of flagship wins. An IPO is imaginable only if governance and
              economics become much more legible; today they do not. The practical implication is that investors should
              not treat the current mark as a blind buy or as a broken fantasy. It is better read as a conditional
              premium: one that can work if revenue, utilization, and governance evidence improve, and one that can
              compress if those proofs remain private. That keeps the final call at research-more and makes the
              diligence list part of the valuation, not a footnote to it.
            claimRefs:
