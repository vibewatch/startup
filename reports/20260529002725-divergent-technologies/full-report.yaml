              - CM023
              - CM024
              - CM025
              - CM036
              - CM037
          - type: callout
            title: The real market is the narrow wedge where complexity and urgency overpower tooling economics
            body: >-
              Broad additive-manufacturing market estimates are useful orientation, but the investable market for
              Divergent-like platforms is much narrower: certified, end-use, low-volume or high-mix structures where
              lightweighting, integration, or sustainment urgency justify abandoning conventional tooling-heavy
              workflows.
            calloutType: insight
            claimRefs:
