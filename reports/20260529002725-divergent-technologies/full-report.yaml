      - number: '7.3'
        title: Supply chain, throughput, and factory-ramp risk
        blocks:
          - type: paragraph
            body: >-
              Divergent’s own pitch is that DAPS compresses cycle time, reduces part count, and strips tooling friction
              out of complex-structure manufacturing. Those claims are plausible and directionally supported by the
              aerospace application page and by the America Makes profile, which describes DAPS as an integrated
              design-to-assembly system. But the same evidence shows where throughput risk migrates. Once the company is
              introducing 200-plus new A&D part numbers in six months, opening or planning new plants, and shifting from
              engineering proof to repeat production, bottlenecks move inside the factory: qualified machine time,
              powder lots, maintenance windows, inspection throughput, and skilled labor. GAO’s warning that DoD still
              lacks visibility across raw-material and part suppliers compounds the problem, because Divergent still
              operates inside the broader defense industrial base even if its workflow is more digital. The result is a
              classic scaling tension: DAPS likely mitigates tooling and legacy-casting friction, but it does not
              eliminate the need for disciplined industrial execution, supplier resilience, and utilization management.
