  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Divergent proves platform economics, broadens customer mix, ramps new capacity smoothly, and supports a
          software-like 15x-20x revenue perception.
        - >-
          $3.5B-$5.0B over a 3-5 year horizon; upside comes from disclosed revenue growth and strategic scarcity
          premium.
        - Qualification stumbles or utilization misses break the bull case quickly.
        - Meaningful but conditional; requires better disclosure than exists today.
      - - Base
        - >-
          Divergent executes well enough to defend category leadership, but disclosure improves only partially and
          valuation settles between public AM and platform comps.
        - $2.0B-$2.8B; current entry can work but offers limited margin of safety without cleaner economics.
        - Customer concentration, debt opacity, and uneven procurement timing keep returns moderate.
        - Most defensible public-only case.
      - - Bear
        - >-
          Divergent remains a strong technology company but operates economically like a capital-intensive specialty
          manufacturer with uneven utilization.
        - $1.0B-$1.5B; multiple compression dominates before topline demand collapses.
        - Qualification delay, program slips, or expensive follow-on capital.
        - Easy to defend if disclosure does not improve.
