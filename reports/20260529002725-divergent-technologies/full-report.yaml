        title: Machine OEMs and industrial channels
        blocks:
          - type: paragraph
            body: >-
              Velo3D, EOS, Nikon SLM Solutions, Markforged, DMG MORI, and 3D Systems all attack pieces of the same buyer
              budget. Some compete through throughput and print capability, some through installed machine channels, and
              some through broader portfolio breadth. Nikon’s NXG XII 600 plus aerospace and defense positioning is
              especially relevant because it moves beyond generic machine marketing into the same regulated end markets
              that support Divergent’s narrative. DMG MORI matters for a different reason: it can enter through
              machine-tool trust and manufacturing relationships that long predate the current wave of startup
              platforms.


              The consequence is that Divergent cannot assume technical novelty is enough. Conservative customers often
              prefer vendors that already sit inside their procurement, validation, or maintenance ecosystems. EOS and
              3D Systems still benefit from long public reference histories, while Markforged’s route through sector
              consolidation suggests that hardware portfolios can be rebundled under larger owners rather than
              disappearing. That broadens the channel challenge even when no single OEM replicates DAPS end to end.
