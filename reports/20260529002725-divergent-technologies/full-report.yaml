              The 2025 round materially improved Divergent’s financing position, but it does not end the
              capital-adequacy conversation. The mix of equity and debt, the emphasis on production expansion, and the
              structure of the end markets all point to a business that still consumes meaningful capital as it scales.
              Aerospace and defense manufacturing require qualification, equipment, facility buildout, and working
              capital before they yield clean recurring economics. That is not a criticism of the strategy; it is the
              financial shape of the strategy.


