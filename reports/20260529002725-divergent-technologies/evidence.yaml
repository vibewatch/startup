evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table public-governance coverage
    missingEvidence: A current board roster, committee structure, and disclosed governance rights from company or investor documents.
    whyItMatters: Governance quality and key-person dependence cannot be fully underwritten from founder titles alone.
    diligencePath: >-
      Request an org chart, board list, and financing governance summary in diligence materials or a management data
      room.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map cap-table coverage
    missingEvidence: >-
      A current cap table showing ownership percentages, board rights, preferences, and any remaining strategic investor
      restrictions.
    whyItMatters: >-
      Without a cap table the report cannot assess dilution, control, liquidation preference burden, or secondary
      overhang.
    diligencePath: >-
      Request the current capitalization table, voting agreements, and any side letters related to Apollo or Lateralus
      transactions.
    relatedQuestionRefs:
      - QO019
      - QO021
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: snapshot kpi table undisclosed operating metrics
    missingEvidence: Current headcount, current annual revenue dollars, backlog, and plant utilization metrics.
    whyItMatters: Scale and capital efficiency cannot be assessed from fundraising and product claims alone.
    diligencePath: Request monthly management reporting with revenue, gross margin, backlog, headcount, and capacity utilization.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: hyperganic acquisition corroboration
    missingEvidence: An authoritative press release or filing showing Divergent acquired Hyperganic.
    whyItMatters: The requested milestone may be material if true, but no fetched public source corroborated it.
    diligencePath: >-
      Search German commercial filings, Hyperganic liquidation records, or direct company disclosures before repeating
      the claim.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: material
    topic: sam isolation for divergent-like production platforms
    missingEvidence: >-
      A public dataset that isolates certified end-use metal AM spend in aerospace, defense, and low-volume automotive
      for North America.
    whyItMatters: Broad AM TAM figures overstate the revenue pool Divergent can realistically attack in the near term.
    diligencePath: >-
      Request management’s internal SAM model or triangulate using program-level part demand, certified supplier counts,
      and end-use part mix.
    relatedQuestionRefs:
      - QM007
      - QM021
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: fy2026 defense budget additive manufacturing line item
    missingEvidence: >-
      A specific FY2026 budget line or justification book page that isolates additive manufacturing procurement rather
      than broad industrial-base or S&T funding.
    whyItMatters: Budget specificity would strengthen claims about near-term public spending support for AM adoption.
    diligencePath: >-
      Search FY2026 DoD budget justification books, Air Force and Navy advanced-manufacturing program lines, and
      congressional report language.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: minor
    topic: public pricing and unit economics for software-defined manufacturing contracts
    missingEvidence: Program-level pricing, gross margin, and volume thresholds for Divergent or comparable qualified AM suppliers.
    whyItMatters: >-
      Without pricing, the market chapter can describe buyer logic and TAM proxies but cannot estimate profit pool or
      contract value with precision.
    diligencePath: >-
      Request anonymized quotes or benchmark customer contracts from management or expert calls with procurement
      officers and certified suppliers.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: competitor pricing transparency
    missingEvidence: Realized pricing, discounting, and contract economics for rival software and machine offers.
    whyItMatters: Without real-world pricing, it is hard to quantify how much premium Divergent is asking buyers to accept.
    diligencePath: Request actual proposals, renewal terms, and discount structures from current or lost opportunities.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: installed-base disclosure
    missingEvidence: Installed machine counts, utilization, and deployed-account density across Nikon, EOS, and Markforged.
    whyItMatters: Installed-base depth is a major proxy for service reach and procurement trust.
    diligencePath: Ask management for known installed-base comparisons used in competitive selling.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: multi-homing behavior
    missingEvidence: Customer-level evidence on whether accounts standardize on DAPS or multi-home across vendors.
    whyItMatters: Switching-cost and moat analysis is weaker without real usage patterns.
    diligencePath: Interview customers and review expansion versus pilot scopes across current programs.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: minor
    topic: public win-loss evidence
    missingEvidence: Documented public examples of Divergent directly displacing incumbents or machine OEMs at scale.
    whyItMatters: Greenfield wins are helpful, but displacement evidence is stronger for moat underwriting.
    diligencePath: Ask for named competitive win stories and procurement alternatives evaluated.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: revenue mix
    missingEvidence: Actual revenue split across software, engineering, produced structures, and assembly.
    whyItMatters: Without revenue mix, the company cannot be valued confidently as platform, manufacturer, or hybrid.
    diligencePath: Request audited segment or stream mix plus cohort evolution.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: gross margin and unit economics
    missingEvidence: Company-level and program-level gross margin, contribution margin, and utilization data.
    whyItMatters: These metrics decide whether the integrated thesis produces superior economics or only superior complexity.
    diligencePath: Request margin bridge by program maturity and utilization.
    relatedQuestionRefs:
      - QI022
      - QI025
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash and runway
    missingEvidence: Post-close cash balance, current burn, and runway sensitivity.
    whyItMatters: Capital adequacy cannot be underwritten from the headline raise alone.
    diligencePath: Request treasury snapshot and base / downside runway cases.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: Customer concentration, backlog, contract duration, and renewal / expansion structure.
    whyItMatters: Revenue durability matters more than headline market size for a capital-intensive manufacturer.
    diligencePath: Request top-customer exposure and backlog roll-forward.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: free-cash-flow bridge
    missingEvidence: Bridge from bookings to cash generation once new capacity comes online.
    whyItMatters: This is the missing proof point between strategic narrative and sustainable finance.
    diligencePath: Request management bridge from volume, yield, and margin assumptions to cash generation.
    relatedQuestionRefs:
      - QI019
  - type: private-evidence-only
    severity: material
    topic: hexagon-integration-depth
    missingEvidence: >-
      Specific Hexagon software, metrology, or digital-thread modules embedded in DAPS, plus who owns the resulting data
      interfaces.
    whyItMatters: >-
