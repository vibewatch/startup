    {
      "id": "section-3",
      "title": "Scenario logic and price discipline",
      "body": "The bull case is not complicated. If Divergent can convert today’s technical and customer proof into sustained plant utilization, broaden beyond a narrow set of prime-linked programs, and show economics more like a manufacturing platform than an advanced job shop, then the current mark can look like an early strategic premium rather than a final price. The bear case is also easy to defend. If qualification delays, procurement timing, or customer concentration keep utilization uneven — and if capital remains mixed debt/equity without better disclosure — then public comp discipline will pull attention back toward hardware-like and A&D transaction multiples. Because revenue is undisclosed, a prudent investor should reverse the question: what level of revenue would be needed to support a $2.3 billion mark under different comp regimes? That yields a simple hurdle framework. At sector-median A&D revenue multiples, the implied revenue bar is far higher than public evidence currently supports. At 10x-15x platform-style multiples, the required revenue becomes more plausible but still needs proof. Price discipline therefore belongs in milestones, not in generic admiration for the company.",
