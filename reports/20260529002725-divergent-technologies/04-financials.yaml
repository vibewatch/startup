    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue model and pricing logic",
      "heading": "Revenue model and pricing logic",
      "paragraphs": [
        "The most defensible reading of Divergent\u2019s monetization is that it is program based. Public materials describe a software-defined production system, not a printer catalog. That strongly suggests revenue can come from a combination of engineering or design work, qualified part production, and recurring production programs where DAPS sits deeper inside the customer workflow than a one-time machine sale would. If true, Divergent\u2019s revenue quality could be better than a pure hardware OEM\u2019s once programs mature because the company participates in more of the value chain.",
        "The flip side is lumpy revenue recognition and opaque realized pricing. No public pricing page or public customer contract lets an outside analyst separate software economics from production economics. That means an investor can reasonably infer a better strategic position than a machine seller, but cannot yet prove whether the company behaves financially like a sticky platform, a specialized contract manufacturer, or some hybrid of both."
      ],
