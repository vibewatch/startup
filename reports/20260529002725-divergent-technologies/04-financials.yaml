    {
      "id": "public-company-sector-benchmarks",
      "title": "Public-company sector benchmarks",
      "heading": "Public-company sector benchmarks",
      "paragraphs": [
        "Public additive-manufacturing companies provide a useful discipline check on private optimism. 3D Systems reported 2025 revenue of $386.9 million but still negative adjusted EBITDA. Stratasys delivered more than $551 million of revenue, positive operating cash flow, no debt, and only modest EBITDA margins. Velo3D\u2019s profile remains more fragile. Desktop Metal\u2019s sale to Nano Dimension and the later Markforged transaction further reinforce that sector structure is still being reset by consolidation and valuation pressure.",
        "Taken together, those comps argue against giving Divergent a free pass on economics simply because the technology story is compelling. The right read is narrower: Divergent may deserve a premium if it sits deeper in customer production programs than public OEMs do, but the public market evidence says capital intensity, margin drag, and balance-sheet quality still determine who survives long enough to realize that promise."
      ],
