    {
      "id": "capital-adequacy-and-financing-dependency",
      "title": "Capital adequacy and financing dependency",
      "heading": "Capital adequacy and financing dependency",
      "paragraphs": [
        "The 2025 round materially improved Divergent\u2019s financing position, but it does not end the capital-adequacy conversation. The mix of equity and debt, the emphasis on production expansion, and the structure of the end markets all point to a business that still consumes meaningful capital as it scales. Aerospace and defense manufacturing require qualification, equipment, facility buildout, and working capital before they yield clean recurring economics. That is not a criticism of the strategy; it is the financial shape of the strategy.",
        "The practical question is what milestone prevents another financing need. Publicly, management has given enough evidence to believe that utilization ramp, production throughput, and margin proof are the real next-round triggers. Publicly, management has not given enough evidence to model exact runway. Investors should therefore treat the 2025 financing as a strong buffer, not as proof that capital dependence has disappeared."
      ],
