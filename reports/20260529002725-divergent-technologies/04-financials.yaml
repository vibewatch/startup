    "number": 4,
    "title": "Financials",
    "summary": "Divergent\u2019s public financial record is strongest on capital raised and weakest on operating metrics. The 2025 $290 million Series E and >$2.3 billion valuation show real investor appetite for a digitally integrated production platform, but the absence of disclosed revenue mix, margins, burn, and utilization means the company still cannot be underwritten like a transparent software or public-manufacturing issuer. Public AM comps suggest the right financial prior is strategic upside paired with high capital-intensity risk."
