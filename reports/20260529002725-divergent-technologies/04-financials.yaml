    {
      "id": "underwriting-view-and-diligence-blockers",
      "title": "Underwriting view and diligence blockers",
      "heading": "Underwriting view and diligence blockers",
      "paragraphs": [
        "Financially, the clearest underwriting conclusion is that Divergent looks strategically stronger than many public additive-manufacturing peers but still cannot be underwritten on a public free-cash-flow basis. The upside case is plausible: if DAPS captures engineering, part production, and assembly economics in one loop, Divergent could earn better customer stickiness and eventually better margins than a printer seller. The downside case is also plausible: if the business behaves more like a capital-intensive advanced manufacturer with opaque utilization, the valuation could prove ahead of fundamentals for longer than investors expect.",
        "That is why the missing metrics matter so much. Revenue mix, gross margin, contribution margin by program, cash balance, burn, customer concentration, and capex per cell are not housekeeping items; they are the evidence needed to decide whether Divergent is compounding platform economics or simply compounding industrial complexity. Until those numbers are shared, this chapter supports a strategic positive view with a deliberately incomplete financial conviction score."
      ],
