- id: generative-design-print-and-assembly-stack
  title: Generative design, metal AM, and automated assembly stack
  body: 'The strongest public technical detail comes from America Makes and the Series D materials. Those sources describe
    DAPS as AI-driven generative design paired with powder-bed metal additive manufacturing and fixtureless automated assembly.
    America Makes goes further, naming a GPU-driven topology-optimization engine that works from keep-out zones, interface
    points, and load paths, and describing proprietary LPBF printers built with SLM Solutions. The aerospace application page
    then shows how that stack is expressed in concrete geometry: integrated fuselage sections, multi-node tanks, intake and
    exhaust structures, and payload mounts. Publicly quoted outcomes remain company-reported, but they are specific enough
    to matter in diligence: 10x cycle-time reduction, 2-5x faster new-program development, 45x part-count reduction, and 2-3x
    lower variable cost on the aerospace reference concept. Together, these sources support the view that Divergent’s differentiation
    is process integration rather than any single part or machine.'
  claimRefs:
  - CE006
  - CE009
  - CE010
  - CE011
  - CE012
  - CE019
  - CE020
  - CE028
  - CE029
  - CE030
