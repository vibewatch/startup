- id: quality-hexagon-ip-and-developer-signal
  title: Quality systems, Hexagon tie-in, IP, and public engineering signal
  body: 'Public trust evidence is better than average for a private manufacturing platform. Divergent’s certifications page
    lists AS9100D, ISO 9001, IATF 16949, ISO 14001, ISO 45001, and Nadcap AM LPBF, and the company explicitly calls itself
    a Tier 1 supplier for safety-critical structures. That quality posture is one reason the Hexagon relationship matters.
    In public articles, Hexagon is more than a passive investor: it frames the partnership around digital reality, software,
    autonomous technologies, and quality assurance across Divergent’s new process. What remains opaque is the exact software
    or metrology loop embedded in DAPS; public sources stop at the strategic level. IP visibility is similarly directional
    rather than complete. A public Google Patents assignee-search surface exists, but not an easily extracted patent-family
    schedule. Engineering signal is also present but light: careers and Built In listings explicitly tie DAPS to machine learning,
    3D printing, and robotic assembly, which is the right kind of signal for a proprietary hard-tech platform even though
    open-source code is not public.'
  claimRefs:
