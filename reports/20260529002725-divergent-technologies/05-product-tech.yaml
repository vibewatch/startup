- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current / legacy workflow
  - Divergent solution
  - Measured benefit / proof
  - Limitation
  rows:
  - - Rapid structure redesign
    - Iterative CAD, tooling, and supplier loops over many months
    - Design-print-assemble workflow with AI-enabled optimization
    - Company says >50% lower development time and cost; 21C redesign completed in 3 months
    - Outcome is company-reported and anchored on selected examples
  - - Aerospace integrated fuselage development
    - Multi-part, tooling-heavy airframe development
    - Topology-optimized integrated fuselage and mounts
    - 10x cycle-time reduction; 45x fewer parts; zero design-specific tooling on reference concept
    - Metrics are from a public concept page, not a named production program
  - - Production surge under uncertain demand
    - Dedicated tooling and slow line changeovers
    - Program-agnostic software-defined cells
    - Company says instant product shifts and thousands of structures per year
    - No third-party plant throughput audit is public
  - - Legacy aircraft sustainment
    - Obsolete tooling and missing bidders
    - Deployable print and robotic-assembly modules
    - Critical hardware delivered in under 3 days after multi-year supplier gap
    - Single anecdote; unit economics not disclosed
  - - Defense qualification for AM parts
    - Long qualification cycles and fragmented standards
    - DAWGS and Army qualification efforts
    - Formal Army ground-vehicle qualification and airworthiness standards work
    - Program-level qualification packages are not public
  - - Modular digital factory rollout
    - Separate vendors for software, printing, and assembly
    - Hexagon-backed integrated manufacturing stack
    - Strategic funding plus quality framing support scale-out thesis
    - Specific Hexagon product integration remains undisclosed
  notes: Benefits mix company-claimed metrics and third-party summaries; most are not independently audited.
