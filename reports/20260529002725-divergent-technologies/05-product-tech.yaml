sections:
- id: daps-core-workflow
  title: DAPS workflow and what customers are actually buying
  body: 'Divergent’s product is not a single printer or a point inspection tool; it is the Divergent Adaptive Production System,
    a software-defined manufacturing workflow that the company consistently reduces to three verbs: design, print, and assemble.
    Public materials show the workflow starting with requirements capture and AI-enabled engineering software, then moving
    into additive manufacture of printed Nodes using application-specific alloys, and finally ending in automated robotic
    assembly that does not require design-specific tooling. The commercial implication is important: buyers are purchasing
    speed, iteration, and tooling avoidance as much as they are purchasing individual parts. Divergent’s R&D, production,
    and sustainment pages all describe the same core stack serving different moments in the customer lifecycle, which is why
    the company can credibly market one platform across prototype development, low-rate production, and urgent sustainment
    work.'
  claimRefs:
