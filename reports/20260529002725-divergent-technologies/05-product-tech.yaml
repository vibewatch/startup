  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hexagon-integration-depth
    missingEvidence: Specific Hexagon software, metrology, or digital-thread modules embedded in DAPS, plus who owns the resulting
      data interfaces.
    whyItMatters: The public record confirms a strategic relationship but not whether Hexagon is a deep operating dependency
      or a lighter-weight quality partner.
    diligencePath: Request architecture diagrams, integration owners, and any joint validation or customer deployment references
      that name Hexagon software products.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: daps-bom-and-materials
    missingEvidence: Printer count, exact alloy mix, critical suppliers, and unit economics for print and robotic assembly
      cells.
    whyItMatters: Without the hardware and materials bill of materials, it is difficult to underwrite scale-up speed, margin
      durability, or supply concentration risk.
    diligencePath: Request current installed-base count by printer generation, critical material suppliers, sole-source exposures,
      and per-cell throughput assumptions.
    relatedQuestionRefs:
    - QE024
  - type: enumeration-incomplete
    severity: minor
    topic: patent-estate-enumeration
    missingEvidence: A clean list of granted patents, pending applications, jurisdictions, and claims families tied to DAPS,
      nodes, joints, and assembly methods.
    whyItMatters: The patent moat is directionally visible but still too opaque to score defensibility claim by claim.
    diligencePath: Request counsel-prepared patent schedule and compare it with Google Patents or USPTO assignee search results.
    relatedQuestionRefs:
    - QE015
    - QE025
