- id: qualification-roadmap-and-scale-readiness
  title: Aerospace qualification path, defense alignment, and scale readiness
  body: Divergent’s most persuasive public progress marker is not another funding round but the growing overlap between quality
    certifications, defense procurement alignment, and formal qualification work. Metal AM reports formal qualification for
    U.S. Army ground-vehicle parts through the DEVCOM GVSC pilot CRADA, while America Makes places Divergent inside the DAWGS
    airworthiness effort with input from the Armed Services, defense primes, and NASA. EWAAC does not prove a Divergent award
    on its own, but it does show the kind of digital-engineering and production environment the company is targeting in defense
    procurement through 2031. On scale, the public record is consistent but still incomplete. Series E sources quantify more
    than 5x revenue growth in 2025 and more than 200 new aerospace-and-defense part numbers in the first half of the year,
    while market reports show additive manufacturing demand continuing to expand. What is still missing are printer counts,
    alloy sourcing, and per-cell economics—exactly the data needed to move from “credible platform” to “fully underwritten
    manufacturing system.” Publicly, that is enough to show momentum but not enough to close manufacturing diligence.
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE031
  - CE032
  - CE033
  - CE037
