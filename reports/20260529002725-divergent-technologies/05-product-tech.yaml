- calloutType: strength
  title: DAPS is a closed design-to-assembly workflow, not a one-point tool
  body: Public sources repeatedly describe one coherent loop from requirements to printed structures to robotic assembly,
    which is a stronger moat than a standalone software or printer claim.
  claimRefs:
  - CE001
  - CE019
  - CE026
- calloutType: strength
  title: Quality posture is unusually concrete for a private hard-tech company
  body: AS9100D, ISO 9001, Nadcap AM LPBF, and Army qualification evidence give Divergent more process credibility than many
    private manufacturing startups can show publicly.
  claimRefs:
  - CE014
  - CE015
  - CE032
- calloutType: risk
  title: Public evidence still does not underwrite printer economics or supply concentration
  body: The company shows real technical progress, but not the printer count, alloy sourcing, or cost-per-cell information
    needed for a full manufacturing-model underwrite.
  claimRefs:
  - CE024
  - CE025
  - CE040
- calloutType: risk
  title: Hexagon integration is strategically promising but technically underspecified
  body: Public articles confirm strategic intent and quality framing, yet they do not show which Hexagon products, sensors,
    or digital-twin loops are embedded in day-to-day operations.
  claimRefs:
  - CE018
  - CE034
  - CE036
