- id: milestones-and-strategic-trajectory
  title: Milestones and Strategic Trajectory
  body: The public milestone record shows a company that started with an automotive-manufacturing critique and then repositioned itself as software-defined infrastructure for aerospace and defense production. The 2022 Hexagon investment provided strategic validation for DAPS as a modular digital factory model. The October 2023 Sigma acquisition tightened the quality-control and in-process-monitoring layer, which matters because qualification and certification become more demanding as the company pursues safety-critical aerospace and defense work. The 2023 Series D then funded commercial scale-up, while the 2025 Series E reframed Divergent more explicitly as industrial-base infrastructure. That trajectory also exposes the core diligence tension. Product claims, certification signals, and customer names all improved, but they were accompanied by more capital intensity, greater defense sensitivity, and continuing opacity on internal operating metrics and governance detail. Public sources are
    sufficient to see a strong pivot and a meaningful market position; they are not sufficient to fully underwrite execution quality, plant economics, or ownership control.
  claimRefs:
