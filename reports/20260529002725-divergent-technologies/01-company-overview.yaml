callouts:
- calloutType: strength
  title: Qualified production claims give Divergent more credibility than a concept-only AM startup
  body: Official pages do not just describe prototypes. They claim Tier 1 qualification for safety-critical structures, list multiple quality certifications, describe current production across defense and automotive partners, and tie Sigma’s monitoring software to certification readiness. That does not prove flawless execution, but it does place the company beyond early-stage concept positioning.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO028
- calloutType: risk
  title: Public governance and operating disclosure still lag the capital narrative
  body: The company has now crossed into multi-hundred-million-dollar financing and billion-dollar valuation territory, yet public materials still do not disclose headcount, absolute revenue, board composition, or cap-table rights. That leaves a real diligence gap between the strength of the story and the amount of auditable operating detail available externally.
  claimRefs:
  - CO030
  - CO040
  - CO041
- calloutType: insight
  title: The strategic center of gravity moved from automotive disruption to defense-industrial urgency
  body: Divergent’s origin story is automotive, but the latest financing and policy-adjacent messaging are unmistakably defense focused. Named contractors, sustainment-speed claims, and alignment with industrial-base financing rhetoric suggest aerospace and defense are now the most strategically important growth vectors in the public narrative.
  claimRefs:
  - CO014
  - CO036
  - CO037
  - CO042
  - CO043
