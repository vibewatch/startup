companyProfile:
  summary: Divergent Technologies is a founder-led advanced-manufacturing platform that sells the Divergent Adaptive Production System to customers building complex, lightweight structures for aerospace, defense, space, and advanced vehicles. The company combines AI-guided design, metal additive manufacturing, metrology-aware process control, and automated assembly so customers can reduce tooling, part count, and schedule risk on programs where conventional manufacturing is slow or brittle.
  foundedDate: '2014-01-01'
  founders:
    - name: Kevin Czinger
      role: Founder, CEO
      background: Entrepreneur behind Divergent and affiliated Czinger Vehicles, focused on software-defined structural manufacturing.
      claimRefs:
