        - CO002
  foundingLocation: Southern California, USA
  headquarters: Torrance / El Segundo, California, USA
  productSummary: Divergent sells DAPS-enabled design, engineering, and structural-component manufacturing for high-complexity programs requiring lightweight, consolidated structures.
  customerFocus: Aerospace, defense, space, and advanced-mobility OEMs or primes with qualification-heavy, low-volume, high-performance programs.
  businessModel: Mixed software-plus-manufacturing model blending engineering work, prototype and production parts, and platform/deployment economics around DAPS.
