disclaimer: >-
  This report-meta artifact is derived only from public evidence reviewed in the Neo Fusion chapter YAMLs as of 2026-07-19. Neo Fusion remains a private company with materially incomplete disclosure, and several headline figures refer to registration capital rather than clean market-priced equity or proven deployable cash. Recommendation and valuation judgments are therefore highly sensitive to undisclosed cap-table terms, budget cadence, safety planning, and first-plant economics.
