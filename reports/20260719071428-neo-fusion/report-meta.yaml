  topStrengths:
    - >-
      Neo Fusion sits inside one of the deepest public fusion ecosystems in the world, linked to EAST, CRAFT, Science Island, and the Hefei Comprehensive National Science Centre.
    - >-
      The company's public capital story is unusually large for a fusion startup, with roughly US$2.03 billion of headline registered capital after the 2024 step-up.
    - >-
      BEST is framed as a concrete reactor program with a 2027 first-plasma target and a 2030-era electricity-demonstration ambition rather than as a vague research concept.
    - >-
      State and strategic backers including CNPC, HFIPS-linked capital, Anhui entities, and NIO provide stronger sponsor resilience than a typical venture-only cap table.
    - >-
      The long-run option value could be substantial if BEST successfully bridges from experimental tokamak heritage into financeable fusion-power infrastructure.
  topRisks:
    - >-
      The core thesis still depends on unproven burning-plasma, schedule, and engineering milestones that have not yet been delivered by Neo Fusion.
    - >-
      Registration capital is not the same as a priced valuation or proven deployable cash, and public sources do not disclose the paid-in capital bridge.
    - >-
      Neo Fusion has no public PPA, anchor-host agreement, tariff model, or customer economics comparable to better-packaged peers such as CFS or Helion.
    - >-
      Fusion remains highly capital intensive while alternative power sources keep improving on cost and deployment speed.
    - >-
      Regulatory, safety, tritium, and plant-level commercialization details remain materially under-disclosed.
  unresolvedGaps:
    - >-
      A cap-table and paid-in-capital schedule showing what portion of the headline registration-capital base is real deployable runway.
    - >-
      An integrated milestone budget bridging today through 2027 first plasma and then through the 2030-era demonstration narrative.
    - >-
      A Neo Fusion-specific host-site, offtake, tariff, or plant-economics model.
    - >-
      A machine-level safety, tritium, waste, and regulatory package for BEST.
    - >-
      Governance, investor-rights, and financing-structure details sufficient to judge true entry economics for outside capital.
