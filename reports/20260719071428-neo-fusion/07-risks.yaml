company:
  name: Neo Fusion
chapter:
  number: 7
  title: Risks
  summary: Neo Fusion’s residual risk remains high because the company still depends on unproven burning-plasma milestones, compressed timelines, incomplete machine-level safety disclosure, and a capital-intensive commercialization path. State backing and ecosystem depth help, but they do not eliminate the core science, schedule, customer, and policy dependencies.
sections:
- id: headline-risk-stack
  title: The headline risk stack is physics first, then schedule, then financing and customers
  body: 'Neo Fusion’s risk profile is unusually front-loaded on questions that cannot be solved by marketing or ordinary software iteration. The company’s core machine, BEST, still has to prove burning deuterium-tritium plasma, sustain performance long enough to matter for power generation, and turn 2027 first-plasma targets into a 2030 electricity-demonstration narrative. Public sources show that even the broader fusion sector still treats Q>1 and practical net electricity as future milestones, not current facts. That means the most serious risk is still scientific and engineering execution. Once that is acknowledged, the rest of the stack follows mechanically: schedule slips create financing gaps, financing gaps delay customer confidence, and customer delay reduces valuation leverage. Neo Fusion’s state-backed ecosystem gives it more resilience than a normal startup, but it does not change the causal hierarchy. The risk chapter therefore begins with the simple point that the company’s
    thesis still depends on milestone delivery rather than on operating output.'
  claimRefs:
  - CR001
  - CR003
  - CR004
  - CR005
  - CR046
  figureRefs:
  - FR001
  - FR002
- id: regulatory-legal-and-environmental
  title: Regulatory, legal, and environmental risk are real even for a cleaner form of nuclear energy
  body: 'Fusion is often marketed as inherently safer and cleaner than fission, but public law and regulatory surfaces show that this does not mean a free pass. China’s Nuclear Safety Law covers nuclear facilities, nuclear materials, and radioactive waste, places responsibility on operators and relevant suppliers, and embeds nuclear safety inside a formal oversight framework. NNSA’s public resources reinforce that there is an institutional monitoring and reporting apparatus behind that framework. For Neo Fusion, the problem is not the absence of regulation but the absence of a public machine-level package proving how BEST will handle tritium, radioactive by-products, waste, emergency response, and quality assurance once it matures into a burning-plasma system. IP and freedom-to-operate questions add another layer: global and Chinese patent systems exist, but the public record reviewed here does not make Neo Fusion’s own patent position legible. Regulatory risk is therefore partly known at
    the framework level and still unresolved at the company-operating-plan level.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR011
  - CR012
  - CR016
  tableRefs:
  - TR001
- id: execution-and-dependency-risks
  title: Execution risk sits inside heat loads, fuel-cycle complexity, talent, and institutional dependence
  body: 'The visible hardware stack makes the operational risks concrete. BEST depends on superconducting magnets, cryogenics, long-duration plasma control, high-heat-flux materials, divertor performance, and eventually fuel-cycle learning. CRAFT’s divertor result is encouraging, but it is still a subsystem result under controlled conditions, not proof of continuous plant-level durability. DOE’s 2026 roadmap reaches the same broad conclusion from another angle: breeding and handling fusion fuels, materials, supply chains, workforce, and practical commercialization all remain active challenge areas for the sector. Neo Fusion also carries a concentrated institutional dependency because ASIPP/HFIPS and the broader Hefei ecosystem supply much of the underlying expertise. Public calls for legislation, standards, and talent development are not just policy rhetoric; they are evidence that the human and organizational systems around fusion remain under active construction. The net effect is that
    Neo Fusion’s ecosystem is both its strongest mitigant and one of its clearest concentration risks.'
  claimRefs:
  - CR014
  - CR015
  - CR013
  - CR018
  - CR019
  - CR020
  - CR045
  tableRefs:
  - TR002
  - TR003
  - TR004
  figureRefs:
  - FR003
- id: capital-competition-and-kill-criteria
  title: Capital intensity, alternative-power competition, and kill criteria define the downside
  body: 'Even if the physics path holds, Neo Fusion still faces a brutal economic and competitive environment. Fusion-sector funding has grown, but the disclosed totals remain small relative to the infrastructure ambition of first plants, and the top private companies still absorb much of the available capital. Funding volatility is real: some peers can raise hundreds of millions, while others close far smaller rounds, and AI capital now dwarfs the entire fusion sector. At the same time, renewables have become much cheaper over the past decade, forcing fusion to compete not only against theoretical energy scarcity but against rapidly improving real alternatives. Customer risk follows from that pressure. If utilities and industrial buyers can wait for cheaper or less risky solutions, every delay at BEST makes commercialization harder. The important point for investors is that the kill criteria are monitorable. Miss 2027 without a credible recovery path, fail to surface a real safety and regulatory
    package, or fail to show a financing bridge toward post-2027 demonstration, and the thesis should be downgraded quickly.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR029
  - CR031
  - CR033
  - CR042
  - CR043
  - CR044
