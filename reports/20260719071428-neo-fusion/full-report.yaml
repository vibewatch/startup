chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mandate, and why the company exists
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion is best understood as the commercialization and engineering vehicle wrapped around China's BEST
              tokamak program rather than as a typical venture-backed startup. Public profiles consistently place the
              company in Hefei, Anhui and tie its origin to 19 May 2023, when the entity was formed to move
              controlled-fusion work closer to an industrial buildout path. Its one-line mission is straightforward:
              develop and ultimately commercialize tokamak-based fusion energy systems. What makes the company unusual
              is the magnitude and composition of its capital base. Instead of a traditional seed-to-Series progression,
              Neo Fusion emerged with state-linked registration capital, then scaled that base sharply in 2024 as CNPC
              and Science Island-linked investors joined. The result is a company whose identity is inseparable from
              Chinese national fusion ambitions, the Hefei Comprehensive National Science Centre, and the physical build
              schedule of BEST itself.
