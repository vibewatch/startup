      - number: '8.3'
        title: A wide option-value range is more honest than a point estimate
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion’s valuation is best framed as a milestone option rather than as a present-value model built on
              visible revenue. BEST is still targeting a 2027 completion or first-plasma milestone and a 2030-era
              power-demonstration ambition. If those milestones are hit, the upside could be substantial because firm
              clean power would be strategically valuable in any energy transition. But present value must discount hard
              for the things still missing today: no priced round, no paid-in capital bridge, no Neo-specific host-site
              economics, no disclosed customer structure, and no public plant-cost model that can be compared cleanly
              with rapidly improving alternatives. Sector context reinforces that caution. Fusion has raised real money,
              but capital remains concentrated among a few leaders, and AI now absorbs vastly more investor attention.
              Meanwhile, renewables remain the cheapest new-build benchmark in Lazard’s 2026 summary and have continued
              to decline sharply over the last decade. The right numeric posture is therefore a broad synthetic range,
              not a falsely precise single mark.
            claimRefs:
              - CV009
