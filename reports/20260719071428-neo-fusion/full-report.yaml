  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: who actually competes with Neo Fusion'
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion competes in two overlapping arenas. The first is the private-fusion race dominated by CFS,
              Helion, TAE, Zap, and Tokamak Energy, each of which is trying to convert a distinct physics thesis into a
              financeable plant story. The second is the public-program arena where tokamak prestige, scientific
              learning, and engineering credibility are shaped by institutions such as ITER and the broader tokamak
              ecosystem. BEST sits between those worlds: it is more startup-shaped than a pure national lab, but more
              state-backed and infrastructure-heavy than a conventional private startup. That hybrid identity means Neo
              Fusion competes not only on technology, but also on access to policy support, supply chains, and the
              ability to claim the next big milestone for China. Future buyers and strategic backers may weigh
              national-program credibility almost as closely as startup execution speed. That makes the competitor set
              broader than a simple list of VC-backed startups and forces Neo Fusion to compete on symbolism,
              engineering legitimacy, and eventual bankability all at once.
            claimRefs:
              - CP001
              - CP002
              - CP033
