      - number: '8.4'
        title: The recommendation can improve, but only when private economics become legible
        blocks:
          - type: paragraph
            body: >-
              What would actually change the call is straightforward. First, public or diligence-room evidence needs to
              show what portion of the headline capital base is paid in and how it bridges to 2027 and then to the 2030
              demonstration narrative. Second, Neo Fusion needs some equivalent of the commercialization proofs peers
              now use: a real host-site logic, a first customer or offtake structure, or at minimum a better-defined
              route from BEST into a plant that can be financed and operated. Third, governance and regulatory packaging
              need to become legible enough for outsiders to believe the company can move from strategic science program
              into financeable infrastructure. Until that happens, the range stays wide and confidence stays capped. The
              downgrade triggers are just as clear: material 2027 slippage, weaker-than-assumed capital availability, or
              continued opacity while alternative clean-power options keep getting cheaper. Investors should not confuse
              national importance with immediate investability; those are related but not identical ideas.
            claimRefs:
              - CV044
