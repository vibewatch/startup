      - number: '4.2'
        title: Monetization remains future-tense
        blocks:
          - type: paragraph
            body: >-
              No public evidence shows Neo Fusion earning revenue today. The implied end-state is obvious enough —
              future electricity sales once a fusion demonstration or commercial plant exists — but the monetization
              bridge is still mostly conceptual. Public sources do not disclose tariffs, customer terms, power-pricing
              targets, or paid engineering work. Comparator PPAs from Helion and CFS confirm that fusion customers can
              sign up before commercial delivery, yet they do not solve Neo Fusion’s own pricing gap. For now the
              business should be viewed as an engineering program with a future commercial option, not as a company with
              a legible revenue model. This distinction matters because investors can easily overread the sheer size of
              the capital stack and assume commercial readiness. Neo Fusion’s disclosures do not support that
              conclusion: BEST is still a milestone bridge, not a revenue machine, and every major monetization input
              remains deferred into a later phase.
            claimRefs:
