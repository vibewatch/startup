  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The headline risk stack is physics first, then schedule, then financing and customers
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion’s risk profile is unusually front-loaded on questions that cannot be solved by marketing or
              ordinary software iteration. The company’s core machine, BEST, still has to prove burning
              deuterium-tritium plasma, sustain performance long enough to matter for power generation, and turn 2027
              first-plasma targets into a 2030 electricity-demonstration narrative. Public sources show that even the
              broader fusion sector still treats Q>1 and practical net electricity as future milestones, not current
              facts. That means the most serious risk is still scientific and engineering execution. Once that is
              acknowledged, the rest of the stack follows mechanically: schedule slips create financing gaps, financing
              gaps delay customer confidence, and customer delay reduces valuation leverage. Neo Fusion’s state-backed
              ecosystem gives it more resilience than a normal startup, but it does not change the causal hierarchy. The
              risk chapter therefore begins with the simple point that the company’s thesis still depends on milestone
              delivery rather than on operating output.
