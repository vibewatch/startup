      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Third-party market reports place the long-run fusion opportunity in the hundreds of billions of dollars by
              2030 to 2040, but these numbers are better treated as directional than as underwriting inputs. They depend
              on highly optimistic assumptions about technology readiness, licensing, and plant deployment at a pace
              that no fusion company has yet demonstrated. A more useful diligence lens is to identify who will pay
              first: governments and state-backed utilities for demonstrations, then regulated utilities and selected
              industrial buyers for early offtake. That sequence fits Neo Fusion especially well because the company is
              deeply embedded in China’s state-backed fusion ecosystem. The first market is therefore institutional and
              negotiated, not mass-market and price-transparent. Even if global demand is immense, only a very small
              subset of counterparties can currently absorb first-of-a-kind technology, licensing, construction, and
              uptime risk.
