  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: firm clean power, not scientific spending'
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion does not compete in the small market for laboratory experiments; it is trying to enter the
              vastly larger market for firm low-carbon electricity and the infrastructure required to build
              first-of-a-kind fusion plants. That distinction matters because many published fusion market reports jump
              immediately to multi-hundred-billion-dollar outcomes without separating demonstration spending from
              bankable power sales. ITER and other official sources make clear why the prize is so large: fusion
              promises dense, dispatchable, fuel-abundant electricity with far lower carbon intensity than fossil
              generation. At the same time, the rise in data-center electricity demand and broader clean-energy demand
              growth supports the idea that grids will keep needing new firm generation options. For Neo Fusion, the
              practical market starts with proving that BEST can be a bridge from science to a financeable demonstration
              asset. In other words, market analysis has to be staged: first a market for validated engineering
              capability, then a market for demonstration plants, and only much later a mature market for delivered
              fusion electricity.
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
              - CM032
