      - number: '8.2'
        title: >-
          Peer context says Neo Fusion deserves a discount until it shows commercialization proof comparable to CFS,
          Helion, or TAE
        blocks:
          - type: paragraph
            body: >-
              The peer set is useful not because any company is a perfect comparable, but because it shows what
              investors reward when they assign premium fusion valuations. CFS pairs enormous funding with a named
              Google offtake, a 400 MW ARC plant concept, and a disclosed private-contract ownership model in Virginia.
              Helion pairs explicit multi-billion-dollar valuation marks with a Microsoft agreement and an Orion plant
              already moving through site development. TAE sits at a smaller capital scale than Neo Fusion’s headline
              base, yet it discloses more governance depth, capital-markets packaging, and partner-backed supply-chain
              work than Neo currently does. Even at the lower end of the sector, First Light’s smaller round shows how
              quickly valuations compress when commercialization packaging is thinner. Neo Fusion, by contrast, still
              looks more like a strategically funded national project node than a market-priced private company. That
              difference does not make it worthless; it explains why any valuation today should sit at a discount to
              peers with clearer customer, governance, and plant-development proof.
