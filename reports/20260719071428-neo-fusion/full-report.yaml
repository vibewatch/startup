            body: >-
              The visible hardware stack makes the operational risks concrete. BEST depends on superconducting magnets,
              cryogenics, long-duration plasma control, high-heat-flux materials, divertor performance, and eventually
              fuel-cycle learning. CRAFT’s divertor result is encouraging, but it is still a subsystem result under
              controlled conditions, not proof of continuous plant-level durability. DOE’s 2026 roadmap reaches the same
              broad conclusion from another angle: breeding and handling fusion fuels, materials, supply chains,
              workforce, and practical commercialization all remain active challenge areas for the sector. Neo Fusion
              also carries a concentrated institutional dependency because ASIPP/HFIPS and the broader Hefei ecosystem
              supply much of the underlying expertise. Public calls for legislation, standards, and talent development
              are not just policy rhetoric; they are evidence that the human and organizational systems around fusion
