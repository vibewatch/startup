      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The biggest number in the file is not a clean valuation
            body: >-
              Neo Fusion’s headline capital base is important, but until public evidence shows what is paid in, what is
              priced, and how commercialization gets financed, it is not enough for a buy-grade call.
            calloutType: recommendation
            claimRefs:
