      - number: '1.2'
        title: Ownership structure, leadership, and governance quality
        blocks:
          - type: paragraph
            body: >-
              Ownership is the clearest differentiator in Neo Fusion's company story. Accessible public summaries
              describe a cap table dominated by state-backed capital, including CNPC's Kunlun Capital, Science
              Island-linked institutional capital, Hefei municipal funds, Anhui provincial energy capital, and a smaller
              NIO-linked stake. That mix gives Neo Fusion unusually deep strategic support for a fusion startup, but it
              also means external investors get far less of the standardized disclosure they would expect from a Western
              hard-tech financing round. Yan Jianwen is the most visible named leader and public spokesperson, while
              Baidu Baike identifies Huang Suzhen as legal representative and accessible media quote vice general
              manager Liu Zhihong on the commercialization model. Beyond those names, however, public governance detail
              remains sparse, making leadership continuity and internal decision-rights harder to diligence than the
              funding stack itself. That opacity matters because the project is too large and too policy-adjacent to
              underwrite on narrative alone; investors need clearer evidence on board oversight, delegated authorities,
              and who owns the commercial handoff from research to power-plant execution.
