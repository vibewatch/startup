      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion’s moat is strongest where state capacity matters: capital depth, access to national labs, and
              integration with a concentrated fusion ecosystem in Hefei. Its moat is weakest where customers and
              investors need transparency: public technical detail, customer-development proof, and explicit packaging
              of what the company will sell after BEST. Near-term commoditization risk is low because the field is still
              fragmented across tokamak, FRC, and Z-pinch pathways. Over time, however, parts of the magnetic-fusion
              supply chain could standardize, shrinking the advantage of any one tokamak developer. The strategic
              question is therefore whether Neo Fusion can convert contextual advantages into a durable commercial edge
              before better-disclosed peers lock in the first serious buyers. If not, the company risks becoming
              technically important but commercially second in line. That would still matter strategically for China,
              but it would reduce the company’s standalone attractiveness for outside capital.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP023
              - CP030
              - CP031
              - CP037
