      - number: '7.2'
        title: Regulatory, legal, and environmental risk are real even for a cleaner form of nuclear energy
        blocks:
          - type: paragraph
            body: >-
              Fusion is often marketed as inherently safer and cleaner than fission, but public law and regulatory
              surfaces show that this does not mean a free pass. China’s Nuclear Safety Law covers nuclear facilities,
              nuclear materials, and radioactive waste, places responsibility on operators and relevant suppliers, and
              embeds nuclear safety inside a formal oversight framework. NNSA’s public resources reinforce that there is
              an institutional monitoring and reporting apparatus behind that framework. For Neo Fusion, the problem is
              not the absence of regulation but the absence of a public machine-level package proving how BEST will
              handle tritium, radioactive by-products, waste, emergency response, and quality assurance once it matures
              into a burning-plasma system. IP and freedom-to-operate questions add another layer: global and Chinese
              patent systems exist, but the public record reviewed here does not make Neo Fusion’s own patent position
              legible. Regulatory risk is therefore partly known at the framework level and still unresolved at the
              company-operating-plan level.
            claimRefs:
