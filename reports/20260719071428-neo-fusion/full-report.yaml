        blocks:
          - type: paragraph
            body: >-
              Even if the physics path holds, Neo Fusion still faces a brutal economic and competitive environment.
              Fusion-sector funding has grown, but the disclosed totals remain small relative to the infrastructure
              ambition of first plants, and the top private companies still absorb much of the available capital.
              Funding volatility is real: some peers can raise hundreds of millions, while others close far smaller
              rounds, and AI capital now dwarfs the entire fusion sector. At the same time, renewables have become much
              cheaper over the past decade, forcing fusion to compete not only against theoretical energy scarcity but
              against rapidly improving real alternatives. Customer risk follows from that pressure. If utilities and
              industrial buyers can wait for cheaper or less risky solutions, every delay at BEST makes
              commercialization harder. The important point for investors is that the kill criteria are monitorable.
              Miss 2027 without a credible recovery path, fail to surface a real safety and regulatory package, or fail
