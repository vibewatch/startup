      - number: '4.4'
        title: 'Public underwriting verdict: strategically funded, conventionally opaque'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. Neo Fusion looks better funded than many private peers and
              benefits from state-backed sponsorship that should lower the odds of a near-term financing crisis. Yet
              public disclosure is far too thin to support conventional underwriting. Investors still lack the minimum
              package needed to judge sufficiency: paid-in cash, detailed project budgets, burn, pricing assumptions,
              customer pipeline, and debt or subsidy structure. Until those appear, Neo Fusion’s financial case is best
              understood as a strategic option on China’s fusion roadmap rather than a transparently modeled venture
              investment. The peer lesson from SPARC, ITER, and other leading programs is not that Neo Fusion cannot
              work; it is that long-duration, capital-hungry development is normal in fusion, and therefore opaque
