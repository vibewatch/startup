      - number: '2.3'
        title: China-specific adoption path
        blocks:
          - type: paragraph
            body: >-
              China offers Neo Fusion an unusually supportive early market because demonstration value itself is
              strategically important. Official reporting around BEST says the project is targeting a 2030
              electricity-generation demonstration, while CAS ecosystem reporting describes Hefei as a city
              intentionally concentrating EAST, CRAFT, BEST, suppliers, and new talent pipelines. That means Neo Fusion
              does not need a conventional commercial market to justify the next stage of spending; it needs to remain
              central to a national engineering roadmap. If BEST performs well, the most likely next customer is some
              form of state-backed demonstration or utility-linked project rather than a pure private merchant plant.
              This path is a strength domestically but could also limit the company’s international portability if
              geopolitics tightens. The company may therefore enjoy a privileged home market before it has anything
              resembling a globally open export market, and that sequencing may ultimately define its first decade.
            claimRefs:
