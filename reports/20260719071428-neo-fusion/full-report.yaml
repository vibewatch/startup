        title: Stakeholders are the current customer base in everything but name
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion does not yet sell electricity, so its present “customers” are better described as strategic
              payers and future host-side stakeholders. The clearest direct proofs are equity and project-support
              relationships: NIO and NIO Capital bought stakes at founding, Anhui government-linked energy entities held
              major control, and the 2024 recapitalization added CNPC- and HFIPS-linked capital. This matters because it
              defines the buyer/user/payer split at the current stage. Neo Fusion’s engineers and scientific partners
              build the machine; public institutions and strategic investors pay for that buildout; and future utilities
              or industrial hosts are the intended downstream users if BEST succeeds. In short, the company already has
              demand-side alignment, but not yet commercial customer adoption. That still is not customer revenue. That
              distinction is essential for diligence because stakeholder commitment can finance a demonstration program
              without proving there is a bankable electricity product today.
