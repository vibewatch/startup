            body: >-
              Neo Fusion does not look trivial. It has one of the most striking headline capital stacks in fusion, with
              public materials pointing to roughly RMB 14.5 billion or about $2.03 billion of registered capital after
              the 2024 step-up. That scale alone is enough to make the company strategically important inside China’s
              fusion roadmap. But valuation discipline begins with a distinction: registration capital is not the same
              thing as a priced round, a post-money valuation, or proven cash that can be spent against a verified
              program budget. Public sources still do not show how much of the capital base is fully paid in, how it is
              released against milestones, or what economics outside investors would actually own. Because those gaps
              are fundamental rather than cosmetic, the best evidence-constrained posture is research-more with medium
              confidence and an unknown valuation stance. Neo Fusion may ultimately be worth much more than today’s
              evidence can prove, but the current public record does not support precision.
