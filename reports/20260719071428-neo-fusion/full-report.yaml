      - number: '2.4'
        title: Constraints and contradictory signals
        blocks:
          - type: paragraph
            body: >-
              The core contradiction in the fusion market is that valuation narratives and market-size reports are
              already talking in utility-scale numbers while the industry is still proving hardware milestones.
              Crunchbase’s funding reality check from 2024 showed how quickly investor enthusiasm can cool when large
              raises stop arriving, and the same structural problem remains in 2026 even after funding rebounds. Capital
              intensity, evolving licensing frameworks, geopolitical sensitivity, and substitute technologies all slow
              adoption. For Neo Fusion, the implication is that a strong macro market does not automatically translate
              into a financeable company outcome. The company still needs to prove performance, define economics, and
              show that a Chinese demonstration asset can convert into repeatable commercial demand. Until then, market
              enthusiasm should be read as option value around a future category, not as evidence that a bankable
              customer market already exists. That distinction is central to any disciplined diligence process for
              fusion and especially for Neo Fusion today.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM018
              - CM027
              - CM037
              - CM038
          - type: table
            tableRef: TM005
