      - number: '3.2'
        title: Peer profiles and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              Among direct peers, CFS is the closest tokamak analog because it has paired high-field magnet advances
              with a grid-plant story around ARC. Helion, TAE, and Zap are more important as architecture threats than
              as direct copies: they promise different cost, complexity, and operational profiles if their non-tokamak
              systems work. Tokamak Energy matters because it shows another path for magnetic-confinement
              commercialization outside the U.S. Neo Fusion’s differentiation is less about a unique plasma concept than
              about combining China’s EAST-to-BEST engineering lineage with unusually strong state-backed capital. Its
              disadvantage is that much of this differentiation is contextual rather than yet proven in a
              customer-facing product. Investors can see the ecosystem advantage, but they still cannot see how that
              advantage converts into customer preference. By contrast, several Western peers already package their
              differentiation in explicitly commercial language aimed at host sites, utilities, and strategic offtakers.
            claimRefs:
              - CP003
              - CP008
              - CP012
              - CP015
              - CP019
              - CP021
              - CP028
