companyProfile:
  summary: >-
    Neo Fusion is a private Chinese fusion developer founded in May 2023 and centered on building the BEST compact
    high-field tokamak in Hefei. Public sources frame BEST as a burning-plasma, deuterium-tritium platform intended to
    bridge EAST and a future Chinese fusion engineering demonstration reactor while targeting a 2027 first-plasma
    milestone and a 2030-era electricity demonstration. The company's current "customers" are better understood as
    strategic sponsors and future utility stakeholders rather than active power buyers today. Neo Fusion's funding story
    is unusually large on paper, but its disclosure profile remains thin enough that outside investors still cannot
    cleanly underwrite paid-in capital, plant economics, or customer monetization.
  foundedDate: '2023-05-19'
  foundingLocation: Hefei, Anhui, China
  headquarters: Hefei, Anhui, China
  productSummary: >-
    Neo Fusion is building BEST, a compact high-field superconducting tokamak intended to study burning
    deuterium-tritium plasma, test materials and blanket systems, and eventually support future fusion-electricity
    generation.
  customerFocus: >-
    Current stakeholders are state and strategic sponsors; future customers are most plausibly Chinese utilities, grid
    operators, and large industrial or digital-load buyers after a state-backed first plant de-risks the technology.
  businessModel: >-
