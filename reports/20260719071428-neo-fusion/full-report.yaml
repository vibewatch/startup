      - number: '3.3'
        title: Commercial traction, packaging, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              CFS and Helion currently lead the peer group on public commercial signaling because they have disclosed
              prospective customer relationships and, in CFS’s case, visible grid and licensing progress. Zap and TAE
              remain more technology-first in the public record, while Tokamak Energy still presents a hybrid
              fusion-plus-magnet platform story. Neo Fusion trails this group on customer proof because no public PPA,
              host-site offtake, or equivalent commercialization agreement has been disclosed. At the same time, no peer
              is truly publishing mature pricing; most are still selling milestone credibility rather than a standard
              product package. For future buyers, therefore, comparative selection will likely hinge on trust,
              milestones, regulatory clarity, and who can underwrite first-of-a-kind risk. Neo Fusion can stay
              competitive without current pricing, but not indefinitely without a visible customer-development path. The
              longer this gap persists, the more peers with disclosed counterparties will shape buyer expectations for
              what a credible fusion vendor should look like.
            claimRefs:
              - CP005
              - CP010
              - CP024
              - CP032
              - CP029
              - CP036
