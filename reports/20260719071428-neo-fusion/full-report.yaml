  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - illustrative valuation range (USD billions)
      - key assumptions
      - what breaks the scenario
    rows:
      - - Bear
        - 0.8 - 1.8
        - Headline capital proves less available than implied; 2027 slips; no customer or host-site proof arrives.
        - Any further opacity on paid-in cash or milestone slippage beyond the current roadmap.
      - - Base
        - 1.8 - 3.0
        - >-
          Strategic support remains real and BEST progresses, but Neo Fusion still lacks clean commercialization and
          disclosure proof.
        - Failure to translate state backing into a clearer budget, customer, or regulatory package.
      - - Bull
        - 3.0 - 6.0
        - >-
          BEST hits key milestones, a paid-in capital bridge becomes visible, and Neo begins to resemble better-packaged
          peers on commercialization.
        - Missed milestones or inability to show first-plant economics.
    notes: >-
      These are synthetic option-value ranges, not observed market prices or DCF outputs. The ranges are bounded by the
      strategic-capital anchor below Helion-like premium cases and above pure research-program downside.
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: TV005
    title: What would change the view table
    columns:
      - diligence item
      - current public status
      - why it matters
      - valuation effect
    rows:
      - - Paid-in capital and contribution schedule
        - Not proven publicly
        - Separates headline registration capital from real runway.
        - Would tighten the range and raise confidence if disclosed.
      - - Integrated milestone budget to 2027 and 2030
        - Not public
        - Shows whether current support can bridge to value-creating milestones.
        - Would reduce scenario uncertainty materially.
      - - First host-site / offtake / tariff logic
        - No Neo Fusion proof yet
        - Commercial proof is what most clearly differentiates Helion and CFS.
        - Could justify a premium versus a pure research-program discount.
      - - Machine-level safety and regulatory package
        - Framework visible; company package not public
        - Needed for customer, host, and financing confidence.
        - Would improve commercialization credibility.
      - - Plant economics and alternative-power sensitivity
        - No public model
        - Necessary to compete with cheap renewables and other firm power.
        - Could either support or compress valuation sharply.
      - - Cap table, governance, and investor-rights structure
        - Opaque
        - Determines whether the headline anchor reflects investable economics.
        - Directly affects entry attractiveness and downside protection.
    notes: >-
      Most of the remaining valuation uncertainty is not about whether fusion could matter, but about whether Neo
      Fusion’s specific economics and control rights can be underwritten.
    claimRefs:
      - CV007
      - CV044
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: Commercial-readiness discount table
    columns:
      - factor
      - supportive evidence
      - missing proof
      - valuation effect
    rows:
      - - Strategic sponsorship
        - Headline capital base and public-market-linked backer
        - Paid-in cash and ownership economics
        - Supports downside resilience but not point valuation.
      - - Technical roadmap
        - 2027 BEST and ~2030 power ambition
        - Proof of milestone delivery and contingency budget
        - Creates option value but also a large timing discount.
      - - Customer / host model
        - Peers show offtake and plant-siting precedents
        - No Neo Fusion equivalent disclosed
        - Main reason Neo trades below premium peer context.
      - - Governance / finance packaging
        - Sector peers show CFO, IR, plant ownership, and partner structures
        - Neo Fusion public record remains thin
        - Caps confidence and likely compresses outside-investor pricing.
    notes: >-
      This table isolates why Neo Fusion can look strategically important and still deserve a present-tense valuation
      discount.
    claimRefs:
