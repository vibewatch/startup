      - number: '4.3'
        title: Capital intensity is the core financial variable
        blocks:
          - type: paragraph
            body: >-
              Even without a public project budget, the cost profile is easy to characterize qualitatively: Neo Fusion
              is building a first-of-a-kind compact burning-plasma platform that aims not only to hit physics milestones
              but also to test materials, blanket modules, and fuel-cycle systems. That implies high capex, long lead
              times, and specialist labor before any commercial revenue arrives. Public cost benchmarks such as Lazard’s
              power-cost work are useful for reminding investors that the broader power market is unforgiving, but they
              do not substitute for a Neo-specific LCOE or plant-cost model. The absence of burn, gross-margin, or
              per-plant economics means the real financial question is not whether fusion could become valuable, but
              whether this company can reach the next milestone without diluting or delaying excessively. Broader sector
              sources strengthen that caution. Peer materials from Helion and Zap increasingly package fusion around
              named programs, milestones, and customer-facing narratives, which only makes Neo Fusion’s still-limited
              commercialization disclosure more conspicuous.
            claimRefs:
