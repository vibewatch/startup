  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital structure is large on paper but hard to underwrite
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion’s financial story begins with scale, but not with clarity. Public profiles and Chinese business
              media point to an initial 2023 registration-capital event and a much larger 2024 step-up that together
              imply roughly RMB 14.5 billion or about US$2.03 billion of registered capital. That is extraordinary for a
              fusion startup and gives the company a strategic-cash narrative that most peers would envy. The problem is
              that registration capital is not the same thing as priced equity, cash on hand, or a fully transparent
              use-of-funds schedule. Accessible public materials do not show how much of this capital is fully paid in,
              what milestones govern deployment, or how long the current capital base can fund BEST before another
              financing event is needed. The presence of NIO as an early disclosed shareholder adds one useful
              contextual signal: at least part of the founding syndicate came from an issuer that files public annual
              reports and accesses public capital markets, which is different from a small venture-only cap table. But
              even that does not answer the more important question of how much cash Neo Fusion can actually spend
              today.
            claimRefs:
