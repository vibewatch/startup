        title: BEST is the product today, and it is still an engineering asset
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion’s “product” is best understood as a next-step fusion machine rather than as a commercial
              electricity offer. Public materials describe the company as one of the principal organizations building
              BEST in Hefei, a compact high-field tokamak intended to move beyond long-pulse experimental work into
              burning deuterium-tritium plasma and eventually a net-gain electricity demonstration. That framing matters
              because it clarifies what investors are really underwriting today: machine assembly, subsystem
              integration, and physics execution. The company has not yet disclosed the kind of commercial surface
              associated with a utility technology vendor, such as uptime guarantees, maintenance commitments, tariff
              frameworks, or a grid-delivery package. The visible stack is instead asset-driven: EAST provides operating
              pedigree, CRAFT validates subsystems, and BEST becomes the integrated proving ground. Neo Fusion therefore
              looks less like a packaged power company and more like the commercialization vehicle wrapped around
              China’s next major tokamak build.
