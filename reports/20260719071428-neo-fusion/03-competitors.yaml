  evidenceGaps:
  - type: missing-source
    severity: material
    topic: neo-commercial-comparison
    missingEvidence: A public or private Neo Fusion commercialization document that names customer segments, siting logic, or offtake strategy.
    whyItMatters: Without a commercialization roadmap, competitor comparison mechanically favors better-disclosed peers such as CFS and Helion.
    diligencePath: Request internal customer-development and siting materials, or wait for public conference disclosures naming future buyers or hosts.
    relatedQuestionRefs:
    - QP022
    - QP024
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: Any credible price, tariff, or cost-per-MWh framework for Neo Fusion or its closest peers.
    whyItMatters: Pricing is central to competition, yet the sector still competes almost entirely on milestones and narrative rather than quoted economics.
    diligencePath: Collect techno-economic models or internal pricing assumptions from management teams and customer counterparties.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: stale
    severity: minor
    topic: competitive-refresh
    missingEvidence: A refreshed cross-company milestone table after each major 2026-2027 prototype update.
    whyItMatters: The competitive order can change quickly with each successful plasma, licensing, or financing milestone.
    diligencePath: Re-run this chapter after every major milestone from CFS, Helion, TAE, Zap, Tokamak Energy, and BEST.
    relatedQuestionRefs:
    - QP025
