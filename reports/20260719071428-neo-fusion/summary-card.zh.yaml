  topStrengths:
    - Neo Fusion 嵌在全球最深的公共聚变生态之一里，与 EAST、CRAFT、Science Island 和 Hefei Comprehensive National Science Centre 相连。
    - 以聚变初创公司看，公司公开资本故事异常大：2024 年增资后，名义注册资本约 US$2.03 billion。
    - BEST 被包装成具体反应堆项目：目标 2027 年首次等离子体、2030 年代前后做发电示范，而不是一个模糊研究概念。
    - CNPC、HFIPS 相关资本、安徽国资实体、NIO 等国有和战略支持方，比典型纯 VC 股权结构更能提供 sponsor 韧性。
    - 如果 BEST 能把实验托卡马克积累接到可融资的聚变电力基础设施上，长期期权价值可能相当可观。
  topRisks:
    - 核心逻辑仍依赖 Neo Fusion 尚未交付的燃烧等离子体、进度和工程里程碑。
    - 注册资本不等于定价估值，也不等于已经到账、可部署的现金；公开资料没有披露实缴资本桥。
    - Neo Fusion 没有公开 PPA、锚定场址协议、电价模型，或可与 CFS、Helion 等包装更成熟同行相比的客户经济性。
    - 聚变仍然极其资本密集，而替代电源还在成本和部署速度上继续进步。
    - 监管、安全、氚和电站级商业化细节仍明显披露不足。
  unresolvedGaps:
    - 一份股权结构表和实缴资本时间表，说明名义注册资本中有多少是真正可部署的现金跑道。
    - 一份整合里程碑预算，把当前状态接到 2027 年首次等离子体，再接到 2030 年代前后的示范叙事。
    - Neo Fusion 专属的场址、购电、电价或电站经济性模型。
    - BEST 的装置级安全、氚、废料和监管文件包。
    - 足以判断外部资本真实入场经济性的治理、投资者权利和融资结构细节。
