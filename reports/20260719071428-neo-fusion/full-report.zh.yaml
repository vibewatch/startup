        - 带来期权价值，也带来很大的时间折价。
      - - 客户 / 场址方模式
        - 同业已有购电和电站选址先例
        - Neo Fusion 尚未披露同等安排
        - 这是 Neo 应低于高溢价同业语境定价的主因。
