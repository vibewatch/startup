  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 示意性估值区间（十亿美元）
      - 核心假设
      - 情景失效条件
    rows:
      - - 悲观
        - 0.8 - 1.8
        - 公开口径资本实际可用性低于暗示；2027 年延误；没有客户或落地场址证明出现。
        - 实缴现金进一步不透明，或里程碑延误超出当前路线图。
      - - 基准
        - 1.8 - 3.0
        - 战略支持仍是真实的，BEST 继续推进，但 Neo Fusion 仍缺少干净商业化和披露证明。
        - 国家支持如果不能转化成更清楚的预算、客户或监管包，基准情景就失效。
      - - 乐观
        - 3.0 - 6.0
        - BEST 击中关键里程碑，实缴资本桥开始可见，Neo 在商业化包装上开始接近更成熟的同业。
        - 里程碑落空，或拿不出首座电站经济性。
    notes: 这些是合成的期权价值区间，不是观测到的市场价格，也不是 DCF 输出。区间被战略资本锚框住：低于 Helion 式溢价案例，高于纯研究项目下行。
