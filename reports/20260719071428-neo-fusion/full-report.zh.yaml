  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: BEST 是今天的产品，但仍是工程资产
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 的「产品」更应理解为下一步核聚变机器，而不是商业售电方案。公开材料把公司描述为在合肥建设 BEST 的主要组织之一；BEST
              是一台紧凑型高场托卡马克，目标是从长脉冲实验工作走向燃烧氘氚等离子体，并最终走向净增益发电验证。这个定位很重要，因为它说明投资人今天真正承销的是什么：机器总装、子系统集成和物理执行。公司尚未披露电力技术供应商通常会拥有的商业界面，例如可用率保证、维护承诺、电价框架或并网交付包。可见技术栈反而是资产驱动的：EAST
              提供运行履历，CRAFT 验证子系统，BEST 成为一体化验证场。因此，Neo Fusion 看起来不像一家已打包的电力公司，更像包裹在中国下一座重大托卡马克建设外层的商业化载体。
