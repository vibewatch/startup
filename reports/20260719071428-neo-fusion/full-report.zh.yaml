      - number: '8.4'
        title: 建议可以改善，但要等公司经济账变得可读
        blocks:
          - type: paragraph
            body: >-
              真正会改变判断的东西很直接。第一，公开材料或尽调资料室要说明，披露的资本底座有多少已经实缴，以及这笔钱如何接上 2027 年，再接上 2030 示范叙事。第二，Neo Fusion
              需要拿出同业现在使用的某种商业化证据：真实的场址逻辑、首个客户或购电结构，至少也要把从 BEST
              走向一座可融资、可运营电站的路线定义得更清楚。第三，治理和监管包装必须清楚到足以让外部人相信，公司能从战略科研项目转成可融资基础设施。在此之前，区间会继续很宽，置信度也会被封顶。下调触发因素同样清楚：2027
              明显延误、可用资本弱于假设，或替代清洁电力选择持续变便宜时，公司仍然不透明。投资者不应把国家重要性和即时可投资性混为一谈；二者有关联，但不是同一个概念。
