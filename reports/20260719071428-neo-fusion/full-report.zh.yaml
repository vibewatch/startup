  - id: TV005
    title: 哪些信息会改变判断表
    columns:
      - 尽调事项
      - 当前公开状态
      - 重要性
      - 估值影响
    rows:
      - - 实缴资本和出资节奏
        - 公开资料未证实
        - 把名义注册资本和真实现金跑道区分开。
        - 若披露，可收窄区间并提高信心。
      - - 通往 2027 和 2030 的整合里程碑预算
        - 未公开
        - 检验当前支持能否接到创造价值的里程碑。
        - 会显著降低情景不确定性。
      - - 首个落地场址 / 承购 / 电价逻辑
        - Neo Fusion 尚无证明
        - 商业化证明最能把 Helion、CFS 与其他项目拉开。
        - 相对纯研究项目折价，可支撑一定溢价。
      - - 机器级安全和监管包
        - 框架可见；公司包未公开
        - 客户、场址方和融资方的信心都需要它。
        - 会提升商业化可信度。
      - - 电站经济性和替代电源敏感性
        - 无公开模型
        - 要同低价可再生能源和其他稳定电源竞争，这一项不可缺。
        - 既可能支撑估值，也可能大幅压缩估值。
      - - 股权结构表、治理和投资者权利结构
        - 不透明
        - 决定表面锚点是否反映可投资经济性。
        - 直接影响入场吸引力和下行保护。
    notes: 剩余大部分估值不确定性，并不在于核聚变是否可能重要，而在于 Neo Fusion 的具体经济性和控制权能否经得起投资尽调。
