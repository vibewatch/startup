            body: >-
              CFS 和 Helion 目前在同行组中公开商业信号最强，因为它们披露了潜在客户关系；CFS 还展示出可见的并网和许可进展。Zap 和 TAE 在公开记录里仍更偏技术优先；Tokamak Energy
              则继续呈现核聚变加磁体平台的混合叙事。Neo Fusion 在客户证明上落后于这一组，因为公开资料没有披露
              PPA、场址承购或同等商业化协议。与此同时，没有任何同行真正发布成熟定价；多数公司仍在销售里程碑可信度，而不是标准产品包。因此，未来买家的比较选择很可能取决于信任、里程碑、监管清晰度，以及谁能承接首台套风险。Neo
              Fusion 可以在没有当前定价的情况下保持竞争力，但不能无限期缺少可见客户开发路径。这个缺口拖得越久，披露交易对手的同行就越会塑造买家对可信核聚变供应商的预期。
