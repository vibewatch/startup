  - id: TV003
    title: 可比估值表
    columns:
      - 公司 / 锚点
      - 最新披露资本 / 估值
      - 商业化证明
      - 估值含义
      - 限制
    rows:
      - - Neo Fusion
        - RMB 14.5B / ~$2.03B 公开口径资本基础；无公开定价轮
        - BEST 目标 2027 年；约 2030 年电力示范目标；未公开承购
        - 战略意义可能很大，但公开证据太不透明，难以给出有把握的定价。
        - 注册资本不等于估值，也不等于实缴现金。
      - - CFS
        - 累计私人融资 ~$2.923B；$863M Series B2 轮
        - Google 200 MW 承购；Virginia ARC 400 MW 电站计划
        - 把托卡马克商业化包装的门槛拉得很高。
        - 融资额不等于股权估值，SPARC 仍要交付。
      - - Helion
        - 2025 年投后 $5.425B；2026 年分析师更新口径投后 $15.5B
        - Microsoft 承购；Orion 电站在建
        - 说明市场愿意为明确商业化证明付溢价。
        - 估值标记仍是私人口径，且偏激进。
      - - TAE
        - '>$1.3B 累计私人融资；最新一轮 >$150M'
        - Copernicus / Da Vinci 路线图；CFO、CRO、IR 以及 UKAEA 供应链信号
        - 即便周期很长，治理和伙伴深度也能支撑估值。
        - 物理路线不同，且仍处商业化前。
      - - First Light Fusion
        - 2026 年首关 £25M
        - 替代路线技术野心强，但融资规模更小
        - 说明不同聚变平台之间分化可以很大。
        - 它不是托卡马克，也不能直接对标中国国家支持口径。
    notes: 可比组有意筛得很窄：重点是最能服务决策的清晰锚点，而不是数据集里的每一家聚变公司。
    enumerationScope:
      coverage: partial
      basis: >-
        This set captures the most decision-useful fusion comparables with clear public capital or commercialization
        signals, not the full global universe of fusion ventures.
