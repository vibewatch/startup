      - number: '2.3'
        title: 中国特定的采用路径
        blocks:
          - type: paragraph
            body: >-
              中国给 Neo Fusion 提供了异常友好的早期市场，因为示范价值本身就有战略重要性。围绕 BEST 的官方报道称项目目标是在 2030 年进行发电验证；CAS 生态报道则描述合肥有意集中
              EAST、CRAFT、BEST、供应商和新人才管线。这意味着 Neo Fusion 不需要一个常规商业市场来证明下一阶段支出合理；它需要继续站在国家工程路线图中心。如果 BEST
              表现良好，最可能的下一个客户不是纯私营市场化电站，而是某种国资支持的示范项目或电力公司关联项目。这条路径在国内是优势，但如果地缘政治收紧，也可能限制公司的国际可移植性。因此，公司可能先享有特权本土市场，之后才出现类似全球开放出口市场的东西；这个先后顺序最终可能定义它的第一个十年。
