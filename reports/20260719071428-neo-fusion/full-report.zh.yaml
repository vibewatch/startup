        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 最强的技术边，不是单项已披露专利或软件秘密，而是 BEST 背后的生态。EAST 1,066 秒高约束脉冲给了项目少有同行能主张的长脉冲托卡马克传承；HFIPS
              明确表示，千秒级稳定性是未来发电的先决条件。CRAFT 则补上部件层：它的存在就是为了建设并测试与反应堆相关的硬件；2025 年 CAS 称其偏滤器原型承受了每平方米 20
              兆瓦，同时甚至改善了理论氚增殖性能。换句话说，BEST 并不是被要求从零发明每个子系统。它可以调用本地链条上的等离子体运行、反应堆部件测试，以及 ASIPP 围绕 EAST 和 ITER
              积累的机构经验。这不能消除执行风险，但确实意味着公司的技术故事锚定在物理基础设施和人，而不只是资本或品牌。
