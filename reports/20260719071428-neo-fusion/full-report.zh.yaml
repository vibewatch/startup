      - number: '7.4'
        title: 资本强度、替代电力竞争和淘汰标准定义下行空间
        blocks:
          - type: paragraph
            body: >-
              即便物理路径成立，Neo Fusion
              仍面对残酷的经济和竞争环境。核聚变行业融资已经增长，但相对于首批电站的基础设施雄心，已披露总额仍然很小，头部民营公司还吸走了大量可得资本。融资波动是真实的：一些同行能融资数亿美元，另一些只能完成小得多的轮次，而
              AI
              资本如今让整个核聚变行业显得很小。与此同时，过去十年可再生能源成本大幅下降，迫使核聚变竞争的不只是理论能源稀缺，还包括快速改善的现实替代方案。客户风险也从这种压力中传导出来。如果电力公司和工业买家可以等待更便宜或风险更低的方案，BEST
              的每一次延迟都会让商业化更难。投资人需要抓住的一点是，淘汰标准可以监测：如果 2027 年节点错过且没有可信恢复路径，如果真实安全和监管方案迟迟不出现，或如果无法展示通往 2027
              年后示范的融资桥梁，投资逻辑就应迅速下调。
