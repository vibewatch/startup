      - number: '1.4'
        title: 反向信号与未解尽调问题
        blocks:
          - type: paragraph
            body: >-
              主要反向读数不是 Neo Fusion 缺少战略支持，而是公开记录相对于其声称的资本规模和雄心仍然偏薄。可获取资料没有披露收入、客户、员工数，也没有披露 RMB 14.5 billion
              注册资本基础对应的现金使用。公司官网从国际网络访问时并不是可靠研究界面，甚至完整的 2024 年后股东表、现任法定代表人等基础治理信息，也更容易从二级镜像而不是主要公司备案中拼出。行业层面，Crunchbase
              的 2024 年融资现实检查显示，如果项目离商业化仍有多年，核聚变资本周期可以很快降温。Neo Fusion
              可能受国资支持保护，但其未来仍取决于能否在极压缩的时间表里，把国家项目声望转化为可重复的工程执行，再转化为可信商业运营模式。
