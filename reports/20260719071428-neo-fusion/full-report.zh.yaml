            body: >-
              BEST 的公开技术描述足够具体，能勾勒出真实硬件路线图。HFIPS 和 CAS 描述了一台紧凑型高场托卡马克，Dewar 包裹的超导磁体在接近零下 269 摄氏度下运行，等离子体核心则超过 1
              亿摄氏度。EUROfusion 补上关键物理框架：BEST 将研究 Q>5 以上的燃烧等离子体行为，同时支持对未来试点电站重要的材料、包层模块和燃料循环测试。这些说法仍是目标，不是已交付结果，但远比泛泛的「核聚变
              AI」或「清洁能源」口号具体。2025 年 Dewar 底座安装、2026 年主厂房完工报道，以及反复出现的 2027
              年首次等离子体或完工目标，共同说明项目已经进入精密总装。首次等离子体之后的路线图也很明确：中文公开来源称 BEST 寻求在 2030 年前后实现净增益和核聚变发电。因此，核心技术问题是进度执行，而不是使命定义。
