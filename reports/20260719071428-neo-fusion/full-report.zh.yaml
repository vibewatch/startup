            body: >-
              Neo Fusion 的估值更适合被看作里程碑期权，而不是建立在可见收入上的现值模型。BEST 仍在瞄准 2027 年建成或首次等离子体里程碑，以及 2030
              年前后的电力示范目标。如果这些节点兑现，上行空间可能很大，因为稳定清洁电力在任何能源转型中都有战略价值。但当前现值必须为仍然缺失的东西大幅折价：没有已定价融资轮、没有实缴资本桥接、没有 Neo Fusion
              特定的场址经济性、没有已披露客户结构，也没有可与快速改善的替代方案清楚对比的公开电站成本模型。行业背景也强化了这种谨慎。聚变行业确实融到真金白银，但资本仍集中在少数头部公司，AI
              现在吸走的投资者注意力也大得多。与此同时，Lazard 2026 年摘要中，可再生能源仍是新建电源里最便宜的基准，过去十年还在继续大幅降本。因此，数字上应采用宽的合成区间，而不是装作精准的单点标记。
