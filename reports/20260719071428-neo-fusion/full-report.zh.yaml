      - number: '1.3'
        title: 项目里程碑与合肥核聚变生态
        blocks:
          - type: paragraph
            body: >-
              支持 Neo Fusion 的最强证据不是客户名单或收入基础，而是周边技术生态。BEST 已从土建进入最终总装，2025 年 10 月完成大型 Dewar 底座安装，并在 2025 年 11 月与
              EUROfusion 发布研究计划。材料称目标是 2027 年首次等离子体，机器预计将在 Q>5 下研究燃烧等离子体物理，同时作为氘氚运行、材料、包层模块和燃料循环系统的测试平台。战略上，BEST 被定位为
              EAST 与未来中国示范堆之间的桥梁；合肥也已拥有 EAST、CRAFT，以及正在扩张的供应商和高校网络。资产集中给了 Neo Fusion 罕见的国家项目光环，但也制造了进度压力：从首次等离子体到 2030
              年发电验证，窗口按核聚变标准看异常紧。
