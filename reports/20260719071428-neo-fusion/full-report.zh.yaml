      - number: '3.2'
        title: 同行画像与技术差异化
        blocks:
          - type: paragraph
            body: >-
              直接同行中，CFS 是最接近的托卡马克类比对象，因为它把高场磁体进展与 ARC 的并网电站叙事绑在一起。Helion、TAE 和 Zap
              更像架构威胁，而不是直接复制者：如果它们的非托卡马克系统跑通，可能给出不同成本、复杂度和运行曲线。Tokamak Energy 重要，是因为它展示了美国之外磁约束商业化的另一条路。Neo Fusion
              的差异化，不在于独特等离子体概念，而在于把中国 EAST 到 BEST
              的工程传承，与异常强的国资资本结合起来。劣势是，这种差异化很大程度还只是上下文优势，尚未在面向客户的产品中得到证明。投资人能看见生态优势，却仍看不见该优势如何转化为客户偏好。相比之下，若干西方同行已经把差异化包装成明确面向场址方、电力公司和战略承购方的商业语言。
