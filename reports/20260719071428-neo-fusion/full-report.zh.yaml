              自己的定价缺口。现阶段，公司应被视为带有未来商业期权的工程项目，而不是已有可读收入模式的公司。这个区分很重要，因为投资人很容易过度解读资本堆栈的绝对规模，并假设商业化已经就绪。Neo Fusion
