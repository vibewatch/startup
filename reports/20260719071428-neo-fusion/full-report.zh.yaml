    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、使命与成立理由
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 与其说是典型风投支持的初创公司，不如说是中国 BEST 托卡马克项目外层的商业化和工程化载体。公开资料一致将公司放在安徽合肥，并把其源头追溯到 2023 年 5 月 19
              日：该实体成立，是为了把受控核聚变工作推向更接近产业建设的路径。它的一句话使命很直接：开发并最终商业化基于托卡马克的聚变能源系统。真正特殊的是资本基础的规模和构成。Neo Fusion
              没有走传统种子轮到后续轮次的路径，而是带着国资关联注册资本起步；2024 年，随着 CNPC 和 Science Island
              相关投资人加入，资本基础又迅速放大。因此，公司的身份与中国国家核聚变雄心、合肥综合性国家科学中心，以及 BEST 本身的实物建设进度绑在一起。
