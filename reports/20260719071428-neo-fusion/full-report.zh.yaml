  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：谁真正与 Neo Fusion 竞争
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 同时在两个相互重叠的赛场竞争。第一是民营核聚变竞赛，CFS、Helion、TAE、Zap 和 Tokamak Energy
              占据主导，每家公司都试图把不同物理路线转化为可融资的电站故事。第二是公共项目赛场，托卡马克声望、科学学习和工程可信度由 ITER 以及更广泛的托卡马克生态塑造。BEST
              夹在两者之间：它比纯国家实验室更像初创公司，却比传统民营初创公司更依赖国资支持、也更重基础设施。这种混合身份意味着 Neo Fusion
              竞争的不只是技术，还包括政策支持、供应链准入，以及为中国拿下下一个重大里程碑的能力。未来买家和战略背书方可能会把国家项目可信度看得几乎和初创公司执行速度一样重。因此，竞争者集合比简单的风投支持初创公司名单更宽，Neo
              Fusion 必须同时争夺象征意义、工程可信度和最终可融资性。
            claimRefs:
