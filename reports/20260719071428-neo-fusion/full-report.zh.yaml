              Neo Fusion 没有公开的经常性客户基础，因此 NRR、流失率、合同期限等经典耐久性指标尚不可用。唯一公开耐久性代理指标是出资方连续性：公司创始利益相关方组合在 2024 年再资本化和 2026
              年公开表述中仍然可见。这有用，但不完整。它很少说明电力公司是否会真正签约、首个场址合同会持续多久，或第一个锚定买家会制造集中度风险而不是解决它。事实上，集中度正是今天的核心客户风险。Neo Fusion
              依赖少数国家和战略主体，首个外部买家很可能也会是大型电力公司或场址主体，而不是分散长尾。采购摩擦同样很高，因为电力公司必须等待物理证明、监管清晰度、场址准备和可融资成本假设。行业报道看起来仍更像投资人记分牌，而不是客户记分牌。因此，客户结论是战略上对齐，商业上未证明。
