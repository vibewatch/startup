      - number: '8.5'
        title: 图表材料
        blocks:
          - type: callout
            title: 文件里最大的数字不是干净估值
            body: Neo Fusion 披露的资本底座很重要，但在公开证据说明哪些已实缴、哪些有定价、商业化如何融资之前，它还不足以支撑买入级判断。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV048
          - type: callout
            title: 上行情景先是战略性的，然后才是财务性的
            body: 如果 BEST 跑通，Neo Fusion 的价值可能远高于当前证据所能证明的水平；正因如此，当前估值需要宽的期权价值框架，而不是单点精确。
            calloutType: insight
