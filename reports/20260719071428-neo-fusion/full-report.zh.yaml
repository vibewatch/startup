  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：稳定清洁电力，而不是科研经费
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion
              竞争的不是实验室实验小市场；它想进入的是大得多的稳定低碳电力市场，以及建设首批核聚变电站所需的基础设施市场。这个区分很重要，因为许多已发布的核聚变市场报告会直接跳到数千亿美元结局，却没有分清示范支出和可融资售电。ITER
              和其他官方来源解释了为什么奖品如此巨大：核聚变承诺提供高密度、可调度、燃料充足的电力，碳强度远低于化石发电。与此同时，数据中心用电需求上升、更广泛清洁能源需求增长，也支撑电网会持续需要新的稳定发电选项。Neo
              Fusion 的现实市场始于证明 BEST 能把科学推进为可融资的示范资产。换句话说，市场分析必须分阶段：先是经验证工程能力市场，再是示范电站市场，最后很久以后才是成熟的核聚变交付电力市场。
