  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 利益相关方才是当前事实上的客户基础
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 尚未销售电力，所以当前「客户」更适合称为战略付款方和未来场址侧利益相关方。最清楚的直接证据是股权和项目支持关系：NIO 和 NIO Capital
              在创立时入股，安徽政府相关能源实体持有主要控制权，2024 年再资本化又加入 CNPC 和 HFIPS 相关资本。这一点很重要，因为它界定了当前阶段买方 / 用户 / 付款方的分工。Neo Fusion
              的工程师和科研伙伴造机器；公共机构和战略投资人支付建设资金；如果 BEST
              成功，未来电力公司或工业场址方才是预期下游用户。简言之，公司已经有需求侧协同，但还没有商业客户采用。那仍然不是客户收入。这个区分是尽调核心，因为利益相关方承诺可以资助示范项目，却不能证明今天已有可融资的电力产品。
