      - number: '2.4'
        title: 约束与矛盾信号
        blocks:
          - type: paragraph
            body: >-
              核聚变市场的核心矛盾在于，估值叙事和市场规模报告已经按公用事业级数字讲故事，而行业仍在证明硬件里程碑。Crunchbase 2024 年的融资现实检查显示，大额融资一旦停下，投资人热情会很快降温；2026
              年即便融资反弹，同一个结构性问题仍在。资本强度、变化中的许可框架、地缘敏感性和替代技术都会拖慢采用。落到 Neo
              Fusion，强劲宏观市场不会自动变成可融资的公司结果。公司仍要证明性能、定义经济性，并说明一个中国示范资产如何转化为可重复的商业需求。在此之前，市场热情应被读成未来品类的期权价值，而不是可融资客户市场已经存在的证据。这个区分是任何严肃核聚变尽调的核心，今天的
              Neo Fusion 尤其如此。
