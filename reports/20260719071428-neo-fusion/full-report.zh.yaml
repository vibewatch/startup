        - 当前价值很大程度取决于里程碑能否兑现。
      - - 同业商业化证明
        - Helion 和 CFS 披露了电站和承购结构
        - 官方同业来源
        - 类似证明出现前，Neo Fusion 应打折。
      - - 行业资本环境
        - 不含中国的私人聚变融资 $11.52B；更广口径披露融资约 $14.24B
        - 分析师 + 行业新闻
        - 聚变已经能吸引大额资本，但阶段仍早、成本仍高。
    notes: 这张表把最干净的公开锚点，与噪声大或不可比的数据点分开。
    claimRefs:
