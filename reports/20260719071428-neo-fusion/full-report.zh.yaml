        title: 规模测算视角与买方分层
        blocks:
          - type: paragraph
            body: >-
              第三方市场报告把长期核聚变机会放在 2030 至 2040
              年的数千亿美元级别，但这些数字更适合作为方向感，而不是承销输入。它们依赖高度乐观的假设：技术成熟度、许可审批和电站部署都要以尚无任何核聚变公司证明过的速度推进。更有用的尽调视角是先识别谁会最早付款：先是政府和国资支持的电力公司为示范项目买单，再是受监管电力公司和部分工业买家购买早期电力。这个顺序尤其适合
              Neo Fusion，因为公司深嵌于中国国资支持的核聚变生态。第一个市场因此是机构化、谈判型市场，不是大众市场，也没有透明价格。即便全球需求巨大，目前也只有极少数交易对手能吸收首台套技术、许可、建设和可用率风险。
