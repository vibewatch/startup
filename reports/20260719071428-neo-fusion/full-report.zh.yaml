          detail: 托卡马克核心瞄准氘氚燃烧等离子体和 Q>5 运行场景。
        - label: 排热与材料
          detail: 偏滤器、面向等离子体材料和高热负荷处理通过 CRAFT 工作降低风险。
        - label: 燃料循环与未来电站学习
          detail: 包层模块和燃料循环实验，目标是把 BEST 转化为试点电站学习。
    approximationNotes: 分层简化了一台复杂得多的机器，但保留了公开资料中可见的主要工程依赖。
    claimRefs:
      - CE017
      - CE011
      - CE006
      - CE021
      - CE007
