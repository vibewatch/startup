  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本结构账面庞大，但难以承销
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 的财务故事从规模开始，却不是从清晰度开始。公开资料和中国商业媒体指向 2023 年初始注册资本事件，以及 2024 年更大的增资；两者合计意味着约 RMB 14.5 billion，或约
              US$2.03 billion
              的注册资本。对于核聚变初创公司，这个规模非常罕见，也给了公司多数同行艳羡的战略现金叙事。问题在于，注册资本不等于定价股权、账上现金或完全透明的资金用途表。可获取公开材料没有说明其中多少已经实缴、哪些里程碑控制资金投放，也没有说明现有资本基础能让
              BEST 撑多久，才需要下一次融资。NIO 作为早期披露股东的存在，提供了一个有用背景信号：创始财团至少有一部分来自一家提交公开年报并进入公开资本市场的发行人，这不同于小型纯风投股权结构。但即便如此，Neo
              Fusion 今天到底能实际花多少钱这个更重要的问题仍未回答。
