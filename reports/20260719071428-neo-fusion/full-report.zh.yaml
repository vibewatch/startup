              没有公开证据显示 Neo Fusion
              今天已有收入。隐含终局足够清楚——等核聚变示范或商业电站出现后销售电力——但变现桥梁仍大多停留在概念层面。公开资料没有披露电价、客户条款、售电定价目标或付费工程工作。Helion 和 CFS 的可比 PPA
