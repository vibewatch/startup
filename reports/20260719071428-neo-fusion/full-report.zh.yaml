      - number: '6.3'
        title: 未来买方地图从电力公司开始，之后才扩展到工业或数字负载买家
        blocks:
          - type: paragraph
            body: >-
              公开证据指向分阶段买方地图。首先是能吸收资本开支、许可复杂度和首台套风险的电力公司、电网和国资场址主体。SASAC 对 State Grid 的描述凸显了这个机会的规模；China Southern Power
              Grid 网站则显示，如果核聚变真正进入电网，它可能需要智能电网、储能、EV
              和集成能力。中国新型能源体系规划进一步强化了机构优先逻辑：它把能源定位为战略基础设施，并强调源网荷储一体化和灵活性。只有经过这轮降险后，工业用户、氢项目或数据中心负载才会成为现实的第二波客户。Gartner 和
              S&P/IEA 关于电力需求增长的数据让长期稳定清洁电力需求显而易见，但不会缩短首次采用路径。因此，Neo Fusion 的潜在客户理论上非常有吸引力，实践中却会高度滞后。
