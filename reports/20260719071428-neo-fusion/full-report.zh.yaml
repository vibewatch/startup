      - number: '6.2'
        title: 真实需求证明主要来自基准案例，而不是 Neo Fusion 合同
        blocks:
          - type: paragraph
            body: >-
              公开资料里最强的 Neo Fusion 专属需求证明，是利益相关方承诺，而不是客户部署。NIO 明确称核聚变具有战略意义，并承诺分阶段出资；安徽电力公司相关主体已经与 NIO
              在电网灵活性和充电基础设施上合作；官方 BEST 报道也表明，国资支持的示范环境就是预期第一市场。但这些都不等同于承购协议。最近的高质量基准来自其他核聚变公司。CFS 公开披露了 200 MW Google
              承购协议，Helion 则宣布 Microsoft 是其计划电站的首位客户。这些案例重要，因为它们展示了核聚变商业交付前可信客户证明可以长什么样。对照这个基准，Neo Fusion 仍处早期：没有披露
              PPA、没有场址合同，也没有具名外部买家愿意在 BEST 之后承接输出。本章结论因此不是需求不存在，而是需求仍是隐含的、由政策居间的，并非合同化表达。
