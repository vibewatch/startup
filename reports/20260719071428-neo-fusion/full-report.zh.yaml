      - number: '7.3'
        title: 执行风险嵌在热负载、燃料循环复杂度、人才和机构依赖里
        blocks:
          - type: paragraph
            body: >-
              可见硬件栈让运营风险变得具体。BEST 依赖超导磁体、低温工程、长时等离子体控制、高热流材料、偏滤器性能，并最终依赖燃料循环学习。CRAFT
              的偏滤器结果令人鼓舞，但它仍是受控条件下的子系统结果，不是连续电站级耐久性的证明。DOE 2026
              年路线图从另一个角度得出同样的大结论：聚变燃料增殖和处理、材料、供应链、劳动力以及现实商业化，仍是行业的活跃挑战区。Neo Fusion 还带着集中的机构依赖，因为 ASIPP/HFIPS
              和更广泛合肥生态提供了大量底层专业能力。公开呼吁立法、标准和人才发展，不只是政策修辞；它们说明核聚变周围的人和组织系统仍在建设。净结果是，Neo Fusion 的生态既是最强缓释项，也是最清晰的集中风险之一。
