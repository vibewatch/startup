  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 由于 Neo Fusion 有战略资本但没有清晰市场价格，建议仍是继续研究
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 并不轻量。它拥有核聚变领域最醒目的账面资本堆栈之一；公开材料显示，2024 年增资后注册资本约 RMB 14.5 billion，或约 $2.03
              billion。单凭这个规模，公司就足以在中国核聚变路线图中具有战略重要性。但估值纪律始于一个区分：注册资本不等于定价轮次、投后估值，也不等于可以按已核验项目预算支出的已证明现金。公开来源仍没有说明资本基础中多少已经实缴、如何按里程碑释放，或外部投资人实际拥有的经济权益是什么。这些缺口是根本性的，不是装饰性的；在证据约束下，最佳姿态是继续研究，置信度中等，估值立场未知。Neo
              Fusion 最终可能远比今天证据能证明的更有价值，但当前公开记录不支持精确估值。
