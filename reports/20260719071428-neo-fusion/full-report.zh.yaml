            body: >-
              同业组有价值，不是因为哪家公司能完美对标，而是因为它说明投资者给聚变公司高估值时究竟奖励什么。CFS 把巨额融资、明确点名的 Google 购电、400 MW ARC 电站概念，以及 Virginia
              私人合同所有权模型放在一起。Helion 则有清楚的数十亿美元估值标记、Microsoft 协议，以及已进入场址开发的 Orion 电站。TAE 的资本规模小于 Neo Fusion
              披露的资本底座，但它披露的治理深度、资本市场包装和伙伴支持的供应链工作都比 Neo Fusion 更多。即便在行业低位，First Light
              较小一轮融资也说明，商业化包装一旦变薄，估值会多快被压缩。相比之下，Neo Fusion
              现在更像一个由战略资金推动的国家项目节点，而不是市场定价的私营公司。这个差异不代表它没有价值；它说明今天任何估值都应低于那些客户、治理和电站开发证据更清楚的同业。
