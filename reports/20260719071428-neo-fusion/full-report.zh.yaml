      - number: '1.2'
        title: 所有权结构、领导层与治理质量
        blocks:
          - type: paragraph
            body: >-
              所有权是 Neo Fusion 故事里最清晰的差异点。可获取的公开摘要显示，公司股权结构由国资背景资本主导，包括 CNPC 的 Kunlun Capital、Science Island
              相关机构资本、合肥市级基金、安徽省能源资本，以及较小的 NIO 相关持股。这种组合给了 Neo Fusion
              在核聚变初创公司中罕见的深层战略支持，但也意味着外部投资人拿不到西方硬科技融资轮里常见的标准化披露。Yan Jianwen 是最常见的具名领导者和公开发言人；Baidu Baike 将 Huang Suzhen
              标为法定代表人，可访问媒体则引用副总经理 Liu Zhihong
              对商业化模式的说法。除这些名字之外，公开治理细节仍很稀疏，领导层延续性和内部分权比融资堆栈本身更难尽调。该不透明度很关键，因为项目规模太大、离政策太近，不能只靠叙事承销；投资人需要看到更清楚的董事会监督、授权机制，以及谁负责把研究交接到电站执行。
