            body: >-
              全球比较让图景更清晰。ITER 更大、更国际化，但它作为科学优先托卡马克的角色，解释了为什么 BEST 被定位成通往后续示范堆的更紧凑桥梁。JET 最后的氘氚实验，以及 W7-X
              的长脉冲仿星器工作都表明，领先项目仍要花多年时间，才能把物理和材料学习转化为与反应堆相关的运行能力。商业同行还给出另一课：MIT/CFS 和 CFS 自身会发布详细磁体里程碑，TAE 和 Zap
              则维持公开研究资料库，让外部人能检查技术学习速度。Neo Fusion 在机构深度和机器雄心上表现不错，但公开透明度较弱。可获取来源仍未披露 BEST
              的氚运行计划、公开质量框架或可靠性指标。即便董事长呼吁立法和标准，也最好被读作聚变治理层仍在建设中的证据。因此，产品技术结论是：物理谱系和总装动能很强，但运行包的可信度仍不完整。
