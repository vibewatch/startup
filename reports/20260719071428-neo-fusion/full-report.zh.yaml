companyProfile:
  summary: >-
    Neo Fusion 是一家中国民营核聚变开发商，成立于 2023 年 5 月，核心任务是在合肥建设 BEST 紧凑型高场托卡马克。公开资料把 BEST 描述为燃烧等离子体、氘氚平台，目标是在 EAST
    与未来中国聚变工程示范堆之间架桥，同时冲刺 2027 年首次等离子体里程碑和 2030 年前后的发电验证。公司当下的「客户」更应理解为战略出资方和未来电力侧利益方，而不是正在买电的客户。Neo Fusion
    的融资故事账面规模异常大，但披露仍然偏薄，外部投资人还无法扎实核验实缴资本、电站经济性或客户变现。
  foundedDate: '2023-05-19'
  foundingLocation: Hefei, Anhui, China
  headquarters: Hefei, Anhui, China
  productSummary: Neo Fusion 在建设 BEST，这是一台紧凑型高场超导托卡马克，用来研究燃烧氘氚等离子体、测试材料和包层系统，并最终支撑未来聚变发电。
  customerFocus: 当前利益相关方是国家与战略出资方；等国家支持的首台装置为技术降险后，未来客户最可能是中国电力公司、电网运营商，以及大型工业或数字负载买家。
  businessModel: 先靠出资方支持的资本建设并运行 BEST，把它作为里程碑桥梁；如果商业化成功，再通过未来聚变电站、场址合作伙伴关系，以及长期电力或基础设施合同变现。
