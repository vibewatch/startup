      - number: '7.2'
        title: 即便核聚变更清洁，监管、法律和环境风险仍然真实
        blocks:
          - type: paragraph
            body: >-
              核聚变常被包装成比裂变天然更安全、更清洁，但公开法律和监管界面显示，这不等于可以免审。中国《核安全法》覆盖核设施、核材料和放射性废物，把责任放在运营者和相关供应商身上，并将核安全纳入正式监督框架。NNSA
              的公开资源也强化了这一点：框架背后有机构化监测和报告体系。Neo Fusion 面临的问题不是缺少监管，而是缺少公开的机器级方案，证明 BEST
              成熟为燃烧等离子体系统后，将如何处理氚、放射性副产物、废物、应急响应和质量保证。IP 和自由实施问题又加一层：全球和中国专利体系都存在，但本次审阅的公开记录没有让 Neo Fusion
              自身专利位置变得可读。因此，监管风险在框架层面部分已知，在公司运行计划层面仍未解决。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR016
