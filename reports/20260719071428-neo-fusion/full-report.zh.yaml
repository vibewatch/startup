  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 首要风险栈先是物理，其次是进度，最后才是融资和客户
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion 的风险画像异常前置，集中在营销或普通软件迭代无法解决的问题上。公司的核心机器 BEST 仍要证明燃烧氘氚等离子体，维持足够久、足以支撑发电的性能，并把 2027 年首次等离子体目标变成
              2030 年发电验证叙事。公开资料显示，即便更广泛核聚变行业也仍把 Q>1
              和实用净发电视为未来里程碑，而不是当前事实。这意味着最严重风险仍是科学和工程执行。承认这一点后，其他风险会机械传导：进度滑坡制造融资缺口，融资缺口拖延客户信心，客户延迟削弱估值杠杆。Neo Fusion
              的国资支持生态让它比普通初创公司更有韧性，但没有改变因果层级。因此，风险章节从一个简单判断开始：公司投资逻辑仍取决于里程碑交付，而不是运行输出。
