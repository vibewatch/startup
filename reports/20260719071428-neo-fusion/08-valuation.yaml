- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - illustrative valuation range (USD billions)
  - key assumptions
  - what breaks the scenario
  rows:
  - - Bear
    - 0.8 - 1.8
    - Headline capital proves less available than implied; 2027 slips; no customer or host-site proof arrives.
    - Any further opacity on paid-in cash or milestone slippage beyond the current roadmap.
  - - Base
    - 1.8 - 3.0
    - Strategic support remains real and BEST progresses, but Neo Fusion still lacks clean commercialization and disclosure proof.
    - Failure to translate state backing into a clearer budget, customer, or regulatory package.
  - - Bull
    - 3.0 - 6.0
    - BEST hits key milestones, a paid-in capital bridge becomes visible, and Neo begins to resemble better-packaged peers on commercialization.
    - Missed milestones or inability to show first-plant economics.
  notes: These are synthetic option-value ranges, not observed market prices or DCF outputs. The ranges are bounded by the strategic-capital anchor below Helion-like premium cases and above pure research-program downside.
