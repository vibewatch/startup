    - Helion and CFS disclose plants plus offtake structures
    - Official peer sources
    - Neo Fusion deserves a discount until similar proof appears.
  - - Sector capital context
    - $11.52B private fusion funding ex-China; ~$14.24B broader disclosed funding
    - Analyst + sector news
    - Fusion is investable at scale, but still early and expensive.
