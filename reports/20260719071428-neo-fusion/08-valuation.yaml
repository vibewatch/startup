- id: TV003
  title: Comparable valuation table
  columns:
  - company / anchor
  - latest disclosed capital / valuation
  - commercial proof
  - valuation implication
  - limitation
  rows:
  - - Neo Fusion
    - RMB 14.5B / ~$2.03B headline capital base; no public priced round
    - BEST targeted for 2027; ~2030 power-demonstration ambition; no public offtake
    - Could be strategically significant, but public evidence is too opaque for conviction pricing.
    - Registration capital is not the same as valuation or paid-in cash.
  - - CFS
    - ~$2.923B lifetime private funding; $863M Series B2
    - Google 200 MW offtake; ARC 400 MW plant plan in Virginia
    - Sets a high bar for tokamak commercialization packaging.
    - Funding is not the same as equity valuation and SPARC still must execute.
  - - Helion
    - $5.425B post-money in 2025; $15.5B post-money in 2026 analyst update
    - Microsoft offtake; Orion plant under construction
    - Shows the premium markets assign to explicit commercialization proof.
    - Valuation marks remain private and aggressive.
  - - TAE
    - '>$1.3B lifetime private funding; latest round >$150M'
    - Copernicus / Da Vinci roadmap; CFO, CRO, IR and UKAEA supply-chain signals
    - Governance and partner depth can support valuation despite long timelines.
    - Different physics path and still pre-commercial.
  - - First Light Fusion
    - £25M first close in 2026
    - Alternative path with strong technical ambition but smaller financing
    - Shows how wide the dispersion can be across fusion platforms.
    - Not a tokamak and not a direct comparable on Chinese state sponsorship.
  notes: 'The comparable set is intentionally selective: it focuses on the clearest decision-useful anchors rather than every fusion company in the dataset.'
  enumerationScope:
    coverage: partial
    basis: This set captures the most decision-useful fusion comparables with clear public capital or commercialization signals, not the full global universe of fusion ventures.
