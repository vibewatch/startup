evidenceGaps:
  - type: missing-source
    severity: material
    topic: shareholder-breakdown
    missingEvidence: >-
      A primary shareholder schedule or official annual filing showing each post-2024 shareholder percentage and board
      rights.
    whyItMatters: >-
      Without a primary cap-table document, control rights, dilution mechanics, and strategic veto positions remain
      inferred rather than proven.
    diligencePath: Obtain the latest official SAIC / QCC corporate-shareholder extract or a company-provided cap-table summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-deployment
    missingEvidence: >-
      A project-budget bridge showing how much of the RMB 14.5 billion registered capital is paid in, ring-fenced, and
      spent on BEST.
    whyItMatters: >-
      Registration capital overstates funding certainty if the underlying cash has not yet been deployed to the project
      entity on the expected schedule.
    diligencePath: >-
      Request audited capital-contribution schedules, project budgets, and use-of-funds documentation from the company
      or sponsoring institutions.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: commercialization-timing
    missingEvidence: >-
      Any disclosed revenue model, offtake plan, or internal milestone linking 2027 first plasma to 2030
      power-demonstration monetization.
    whyItMatters: >-
      Investors cannot assess business-model timing or capital needs without a bridge from research milestones to first
      revenue.
    diligencePath: >-
      Ask management for the internal commercialization roadmap, customer-development plan, and expected revenue trigger
      events.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: leadership-disclosure
    missingEvidence: >-
      A current official leadership page that reconciles legal representative, chairman, general manager, and technical
      leadership roles.
    whyItMatters: Leadership ambiguity complicates governance diligence and key-person risk analysis.
    diligencePath: >-
      Re-check the company website or corporate registry once a stable public source is accessible, and compare against
      official procurement or hiring notices.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A bottoms-up demand model separating demonstration spend, supply-chain value, and eventual electricity sales for
      China specifically.
    whyItMatters: >-
      Top-down global TAMs are too dispersed to support a confident underwriting case for Neo Fusion’s actual
      addressable market.
    diligencePath: >-
      Build a bottoms-up model from plausible demonstration-plant counts, utility demand, industrial offtake, and
      Chinese energy-policy milestones.
    relatedQuestionRefs:
      - QM022
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: neo-unit-economics
    missingEvidence: Any project-specific cost, uptime, or LCOE assumptions for Neo Fusion’s post-BEST commercial plant concept.
    whyItMatters: >-
      Without unit economics, the market can only be described qualitatively and cannot be translated into valuation or
      financing assumptions.
    diligencePath: Request management’s internal techno-economic model or a staged cost roadmap linked to BEST milestones.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: china-demand-forecast
    missingEvidence: A public Chinese government forecast quantifying future fusion electricity demand or planned deployment volumes.
    whyItMatters: Neo Fusion’s strongest early market may be domestic, yet public sources rarely quantify that market precisely.
    diligencePath: Review future NDRC, provincial energy-plan, or BEST program documents for deployment assumptions once published.
    relatedQuestionRefs:
      - QM022
  - type: stale
    severity: minor
    topic: export-markets
    missingEvidence: >-
      A recent public policy statement on whether Chinese fusion demonstration projects will target overseas customers
      or remain domestically prioritized.
    whyItMatters: Export restrictions or strategic prioritization could materially narrow Neo Fusion’s long-run market access.
    diligencePath: >-
      Track future collaboration agreements, export-control developments, and official conference statements on
      international commercialization.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: neo-commercial-comparison
    missingEvidence: >-
      A public or private Neo Fusion commercialization document that names customer segments, siting logic, or offtake
      strategy.
    whyItMatters: >-
      Without a commercialization roadmap, competitor comparison mechanically favors better-disclosed peers such as CFS
      and Helion.
    diligencePath: >-
      Request internal customer-development and siting materials, or wait for public conference disclosures naming
      future buyers or hosts.
    relatedQuestionRefs:
      - QP022
      - QP024
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: Any credible price, tariff, or cost-per-MWh framework for Neo Fusion or its closest peers.
    whyItMatters: >-
      Pricing is central to competition, yet the sector still competes almost entirely on milestones and narrative
      rather than quoted economics.
    diligencePath: Collect techno-economic models or internal pricing assumptions from management teams and customer counterparties.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: stale
    severity: minor
    topic: competitive-refresh
    missingEvidence: A refreshed cross-company milestone table after each major 2026-2027 prototype update.
    whyItMatters: The competitive order can change quickly with each successful plasma, licensing, or financing milestone.
    diligencePath: Re-run this chapter after every major milestone from CFS, Helion, TAE, Zap, Tokamak Energy, and BEST.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: paid-in-capital-and-burn
    missingEvidence: Audited paid-in capital, cash on hand, and burn-rate data.
    whyItMatters: These figures are the minimum required to judge runway and capital adequacy.
    diligencePath: Obtain audited financial statements or monthly management accounts.
    relatedQuestionRefs:
      - QI012
      - QI013
      - QI014
      - QI024
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: A techno-economic model showing capex, opex, tariff assumptions, and a route to plant-level gross margin.
    whyItMatters: Without a unit-economics model, Neo Fusion cannot be compared credibly against other firm-power options.
    diligencePath: Request internal cost and tariff models linked to BEST and any post-BEST commercial concept.
    relatedQuestionRefs:
      - QI007
      - QI025
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: capital-plan
    missingEvidence: >-
      A milestone budget from 2026 through 2030 showing when further equity, project finance, or public support is
      expected.
    whyItMatters: Headline capital amounts do not prove sufficiency through first power demonstration.
    diligencePath: Ask management or sponsoring institutions for a capital-plan bridge tied to 2027 and 2030 milestones.
    relatedQuestionRefs:
      - QI018
  - type: private-evidence-only
    severity: material
    topic: best-fuel-cycle-operating-plan
    missingEvidence: A detailed public or diligence-room plan for blanket, tritium, and fuel-cycle operations on BEST.
    whyItMatters: Burning-plasma ambition is credible only if supporting fuel-cycle systems are practical and safe.
    diligencePath: Request the BEST subsystem architecture package or technical management plan covering fuel-cycle scope.
    relatedQuestionRefs:
      - QE023
      - QE024
  - type: private-evidence-only
    severity: material
    topic: best-reliability-metrics
    missingEvidence: Availability, maintenance-cycle, downtime, and support-model assumptions for BEST and any follow-on pilot plant.
    whyItMatters: >-
      A machine can hit plasma milestones yet still fail as an operating energy asset without credible uptime
      assumptions.
    diligencePath: Ask management for RAM (reliability, availability, maintainability) assumptions and service staffing plans.
    relatedQuestionRefs:
      - QE020
      - QE025
