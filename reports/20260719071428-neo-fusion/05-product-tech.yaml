  - FE004
- id: peer-context-and-trust-gaps
  title: Peer context highlights both the sophistication and the disclosure gaps of Neo Fusion’s technology story
  body: 'Global comparisons sharpen the picture. ITER is larger and more international, but its role as a science-first tokamak helps explain why BEST is framed as a more compact bridge to a later demonstration reactor. JET’s final deuterium-tritium campaign and W7-X’s long-pulse stellarator work show that leading programs still spend years turning physics and materials learning into reactor-relevant operations. Commercial peers add another lesson: MIT/CFS and CFS itself publish detailed magnet milestones, while TAE and Zap maintain public research libraries that let outsiders inspect the pace of technical learning. Neo Fusion compares well on institutional depth and machine ambition, but less well on public transparency. Accessible sources still do not disclose a tritium operating plan, public quality framework, or reliability metrics for BEST. Even the chairman’s call for legislation and standards is best read as evidence that the governance layer around fusion is still under construction.
    The product-technology verdict is therefore strong on physics pedigree and assembly momentum, but incomplete on operating-package trust.'
