  title: Product architecture map
  type: stack
  layout: wide
  summary: BEST stacks institutional pedigree, superconducting hardware, and future fuel-cycle learning into one compact tokamak program.
  data:
    layers:
    - label: Institutional base
      detail: ASIPP, HFIPS, EAST operations, and ITER participation provide the program base for BEST.
    - label: Magnet and cryogenic systems
      detail: Superconducting magnets and the Dewar establish the high-field, ultra-cold confinement layer.
    - label: Plasma core and control
      detail: The tokamak core targets burning deuterium-tritium plasma and Q>5 operating scenarios.
    - label: Power exhaust and materials
      detail: Divertor, plasma-facing materials, and high-heat-flux handling are de-risked through CRAFT work.
    - label: Fuel cycle and future plant learning
      detail: Blanket-module and fuel-cycle experiments are meant to translate BEST into pilot-plant learning.
