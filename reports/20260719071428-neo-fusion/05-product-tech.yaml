- id: why-east-and-craft-matter
  title: EAST and CRAFT are the real moat around BEST’s technical ambition
  body: 'Neo Fusion’s strongest technical edge is not a single disclosed patent or software secret; it is the ecosystem that sits behind BEST. EAST’s 1,066-second high-confinement pulse gives the project a long-pulse tokamak lineage that few peers can claim, and HFIPS explicitly says thousand-second stability is a prerequisite for future power generation. CRAFT then adds the component layer: it exists to build and test reactor-relevant hardware, and in 2025 CAS said its divertor prototype handled 20 megawatts per square meter while even improving theoretical tritium-breeding performance. In other words, BEST is not being asked to invent every subsystem from scratch. It can draw on a local chain of plasma operations, reactor-component testing, and institutional experience built through ASIPP’s work on EAST and ITER. This does not remove execution risk, but it does mean the company’s technical story is anchored in physical infrastructure and people rather than only in capital or branding.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE019
  - CE021
