chapter:
  number: 5
  title: Product & Technology
  summary: Neo Fusion’s product is the BEST compact burning-plasma tokamak, not yet a commercial power offering. Public evidence supports real assembly momentum, strong EAST/CRAFT pedigree, and explicit 2027/2030 technical targets, but trust-critical operating details such as fuel-cycle execution, reliability, and quality systems remain thin.
sections:
- id: best-as-the-product
  title: BEST is the product today, and it is still an engineering asset
  body: 'Neo Fusion’s “product” is best understood as a next-step fusion machine rather than as a commercial electricity offer. Public materials describe the company as one of the principal organizations building BEST in Hefei, a compact high-field tokamak intended to move beyond long-pulse experimental work into burning deuterium-tritium plasma and eventually a net-gain electricity demonstration. That framing matters because it clarifies what investors are really underwriting today: machine assembly, subsystem integration, and physics execution. The company has not yet disclosed the kind of commercial surface associated with a utility technology vendor, such as uptime guarantees, maintenance commitments, tariff frameworks, or a grid-delivery package. The visible stack is instead asset-driven: EAST provides operating pedigree, CRAFT validates subsystems, and BEST becomes the integrated proving ground. Neo Fusion therefore looks less like a packaged power company and more like the commercialization
    vehicle wrapped around China’s next major tokamak build.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE019
  - CE047
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: machine-architecture-and-roadmap
  title: The machine architecture is ambitious but unusually concrete for a pre-commercial fusion company
  body: 'BEST’s public technical description is specific enough to establish a real hardware roadmap. HFIPS and CAS describe a compact high-field tokamak whose Dewar encloses superconducting magnets operating near minus 269 degrees Celsius while the plasma core runs above 100 million degrees. EUROfusion adds the key physics frame: BEST is meant to study burning-plasma behavior above Q>5 while enabling materials, blanket-module, and fuel-cycle tests that matter for future pilot plants. Those claims are still targets, not delivered outputs, but they are far more concrete than generic “fusion AI” or “clean energy” slogans. The 2025 Dewar-base installation, the 2026 report that the main building is complete, and the repeated 2027 first-plasma or completion target together show a project already in precision assembly. The roadmap beyond first plasma is also explicit: public Chinese sources say BEST seeks net gain and fusion-based electricity generation around 2030. That makes schedule execution,
    not mission definition, the central technology question.'
