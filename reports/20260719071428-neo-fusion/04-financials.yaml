company:
  name: Neo Fusion
chapter:
  number: 4
  title: Financials
  summary: Neo Fusion’s public financial profile is defined by unusually large strategic registration capital and unusually thin conventional disclosure. The company appears pre-revenue, highly capital intensive, and reliant on state-backed sponsorship until at least a 2030-era demonstration, which means the public verdict is “strategically funded but not conventionally underwritable.”
sections:
- id: capital-and-structure
  title: Capital structure is large on paper but hard to underwrite
  body: 'Neo Fusion’s financial story begins with scale, but not with clarity. Public profiles and Chinese business media point to an initial 2023 registration-capital event and a much larger 2024 step-up that together imply roughly RMB 14.5 billion or about US$2.03 billion of registered capital. That is extraordinary for a fusion startup and gives the company a strategic-cash narrative that most peers would envy. The problem is that registration capital is not the same thing as priced equity, cash on hand, or a fully transparent use-of-funds schedule. Accessible public materials do not show how much of this capital is fully paid in, what milestones govern deployment, or how long the current capital base can fund BEST before another financing event is needed. The presence of NIO as an early disclosed shareholder adds one useful contextual signal: at least part of the founding syndicate came from an issuer that files public annual reports and accesses public capital markets, which is different
    from a small venture-only cap table. But even that does not answer the more important question of how much cash Neo Fusion can actually spend today.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI017
  - CI029
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: revenue-and-monetization
  title: Monetization remains future-tense
  body: 'No public evidence shows Neo Fusion earning revenue today. The implied end-state is obvious enough — future electricity sales once a fusion demonstration or commercial plant exists — but the monetization bridge is still mostly conceptual. Public sources do not disclose tariffs, customer terms, power-pricing targets, or paid engineering work. Comparator PPAs from Helion and CFS confirm that fusion customers can sign up before commercial delivery, yet they do not solve Neo Fusion’s own pricing gap. For now the business should be viewed as an engineering program with a future commercial option, not as a company with a legible revenue model. This distinction matters because investors can easily overread the sheer size of the capital stack and assume commercial readiness. Neo Fusion’s disclosures do not support that conclusion: BEST is still a milestone bridge, not a revenue machine, and every major monetization input remains deferred into a later phase.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI026
  - CI033
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: costs-and-capital-intensity
  title: Capital intensity is the core financial variable
  body: 'Even without a public project budget, the cost profile is easy to characterize qualitatively: Neo Fusion is building a first-of-a-kind compact burning-plasma platform that aims not only to hit physics milestones but also to test materials, blanket modules, and fuel-cycle systems. That implies high capex, long lead times, and specialist labor before any commercial revenue arrives. Public cost benchmarks such as Lazard’s power-cost work are useful for reminding investors that the broader power market is unforgiving, but they do not substitute for a Neo-specific LCOE or plant-cost model. The absence of burn, gross-margin, or per-plant economics means the real financial question is not whether fusion could become valuable, but whether this company can reach the next milestone without diluting or delaying excessively. Broader sector sources strengthen that caution. Peer materials from Helion and Zap increasingly package fusion around named programs, milestones, and customer-facing narratives,
    which only makes Neo Fusion’s still-limited commercialization disclosure more conspicuous.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI032
  - CI030
  - CI037
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: verdict-and-underwriting-blockers
  title: 'Public underwriting verdict: strategically funded, conventionally opaque'
  body: 'The financial verdict is therefore mixed. Neo Fusion looks better funded than many private peers and benefits from state-backed sponsorship that should lower the odds of a near-term financing crisis. Yet public disclosure is far too thin to support conventional underwriting. Investors still lack the minimum package needed to judge sufficiency: paid-in cash, detailed project budgets, burn, pricing assumptions, customer pipeline, and debt or subsidy structure. Until those appear, Neo Fusion’s financial case is best understood as a strategic option on China’s fusion roadmap rather than a transparently modeled venture investment. The peer lesson from SPARC, ITER, and other leading programs is not that Neo Fusion cannot work; it is that long-duration, capital-hungry development is normal in fusion, and therefore opaque funding structures deserve extra skepticism rather than a free pass.'
  claimRefs:
  - CI028
  - CI031
  - CI034
  - CI035
  - CI020
  - CI038
