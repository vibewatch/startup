- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - State-backed demonstration first
    - Positive near-term / negative concentration
    - BEST 2030 target and sponsor base
    - Request host-site, utility, and policy roadmap
  - - Utility / grid buyer concentration
    - High concentration risk
    - State Grid and CSG are logical but very large anchor channels
    - Request buyer-development strategy and multi-host pipeline
  - - Industrial and data-center expansion
    - Potential upside
    - WRI, Gartner, and S&P show long-run demand growth
    - Request segment-specific commercialization plan
  - - Procurement friction and licensing
    - Negative
    - ITER-like timelines and benchmark PPAs still rely on major proof steps
    - Request expected procurement cycle and regulatory milestones
  - - International customer access
    - Negative near-term
    - Chinese program positioning plus opaque funding context
    - Request export / collaboration strategy after domestic proof
  - - No customer metrics today
    - Negative for diligence clarity
    - Public sources stop at stakeholder and benchmark evidence
    - Request pipeline, partner, and deployment KPIs
  notes: The expansion path is visible at the segment level, but concentration and procurement frictions remain the dominant customer-side risks.
