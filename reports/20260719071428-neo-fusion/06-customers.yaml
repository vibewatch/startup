  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-offtaker-list
    missingEvidence: Any signed or draft offtake, host-site, or utility engagement document tied specifically to Neo Fusion output.
    whyItMatters: Without it, the customer story remains strategic and inferential rather than commercial.
    diligencePath: Request memoranda of understanding, utility diligence letters, or host-site term sheets.
    relatedQuestionRefs:
    - QU022
    - QU008
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewals
    missingEvidence: Contract length, renewal terms, NRR/GRR logic, and any service-quality or buyer-satisfaction measurements.
    whyItMatters: Durability cannot be assessed from sponsor continuity alone.
    diligencePath: Request host-site commercial model, draft PPA terms, and any sponsor governance agreements.
    relatedQuestionRefs:
    - QU015
    - QU023
    - QU024
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: future-buyer-roster
    missingEvidence: A ranked list of actual utility, industrial, or international buyer conversations.
    whyItMatters: The named proof table can only show sponsor proxies and sector benchmarks today.
    diligencePath: Request active pipeline, counterparties, and stage-by-stage buyer map.
    relatedQuestionRefs:
    - QU009
    - QU022
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: active-customer-kpis
    missingEvidence: Any public KPI set for deployments, host sites, utilization, or customer count.
    whyItMatters: Without KPIs, public adoption trajectory is mostly inferred from funding and policy context.
    diligencePath: Ask management for milestone dashboard and customer-development KPIs.
    relatedQuestionRefs:
    - QU014
    - QU025
    relatedTableRefs:
    - TU002
