chapter:
  number: 6
  title: Customers
  summary: Neo Fusion’s present “customers” are strategic sponsors and future host-side stakeholders rather than revenue-bearing electricity buyers. Public evidence strongly supports state and industrial alignment around BEST, but there is still no disclosed Neo Fusion PPA, host-site contract, or retention data, so the chapter verdict is “strong strategic demand signal, weak commercial proof.”
sections:
- id: stakeholders-are-the-current-customer-base
  title: Stakeholders are the current customer base in everything but name
  body: 'Neo Fusion does not yet sell electricity, so its present “customers” are better described as strategic payers and future host-side stakeholders. The clearest direct proofs are equity and project-support relationships: NIO and NIO Capital bought stakes at founding, Anhui government-linked energy entities held major control, and the 2024 recapitalization added CNPC- and HFIPS-linked capital. This matters because it defines the buyer/user/payer split at the current stage. Neo Fusion’s engineers and scientific partners build the machine; public institutions and strategic investors pay for that buildout; and future utilities or industrial hosts are the intended downstream users if BEST succeeds. In short, the company already has demand-side alignment, but not yet commercial customer adoption. That still is not customer revenue. That distinction is essential for diligence because stakeholder commitment can finance a demonstration program without proving there is a bankable electricity
    product today.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: what-real-demand-proof-looks-like
  title: Real demand proof exists mostly as benchmarks, not as Neo Fusion contracts
  body: 'The strongest public Neo Fusion-specific demand proof is stakeholder commitment, not customer deployment. NIO explicitly called fusion strategically significant and committed phased funding; Anhui utility-linked actors already cooperate with NIO on grid-flex and charging infrastructure; and official BEST reporting makes clear that a state-backed demonstration environment is the intended first market. But none of that is equivalent to an offtake agreement. The nearest high-quality benchmarks come from other fusion companies. CFS publicly disclosed a 200 MW Google offtake agreement, while Helion announced Microsoft as the first customer for its planned plant. Those examples matter because they show what credible pre-delivery customer proof can look like in fusion. Against that benchmark, Neo Fusion remains early: there is no disclosed PPA, no host-site contract, and no named external buyer willing to take output after BEST. The chapter’s conclusion is therefore not that demand is
    absent, but that demand is still implicit and policy-mediated rather than contractually expressed.'
  claimRefs:
  - CU005
  - CU009
  - CU015
  - CU021
  - CU022
  - CU023
  - CU024
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: future-buyer-map-and-demand-context
  title: The future buyer map starts with utilities and only later widens to industrial or digital-load buyers
  body: 'Public evidence points to a staged buyer map. First come utilities, grids, and state-backed host entities that can absorb capex, licensing complexity, and first-of-a-kind risk. SASAC’s description of State Grid underscores the scale of that opportunity, while China Southern Power Grid’s site shows the kinds of smart-grid, storage, EV, and integration capabilities that could matter if fusion reaches grid relevance. China’s new-type energy-system plan further reinforces this institutional-first logic: it frames energy as strategic infrastructure and emphasizes integrated generation, transmission, storage, and flexibility. Only after that de-risking phase do industrial users, hydrogen projects, or data-center loads become realistic second-wave customers. Gartner and S&P/IEA data on power-demand growth make the long-run need for firm clean power obvious, but they do not shorten the path to first adoption. Neo Fusion’s likely customers are therefore highly attractive in theory and highly
    delayed in practice.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU017
  - CU018
  - CU019
  figureRefs:
  - FU004
- id: durability-and-concentration-risks
  title: Durability is visible only at the sponsor layer, while concentration and procurement risks are high
  body: 'Because Neo Fusion has no public recurring customer base, classic durability metrics like NRR, churn, and contract lengths are not yet available. The only public durability proxy is sponsor continuity: the company’s founding stakeholder set remained visible through the 2024 recapitalization and into 2026 public remarks. That is useful but incomplete. It says little about whether utilities will actually sign, how long a first host-site contract would run, or whether a first anchor buyer would create concentration risk rather than solve it. Indeed, concentration is the core customer risk today. Neo Fusion depends on a small number of state and strategic actors, and its first external buyer will likely also be a large utility or host entity, not a diversified long tail. Procurement friction is similarly high because utilities must wait for physics proof, regulatory clarity, site preparation, and bankable cost assumptions. Sector coverage still reads more like an investor scoreboard
    than a customer scoreboard. The customer verdict is therefore strategically aligned but commercially unproven.'
  claimRefs:
