company:
  name: Neo Fusion
chapter:
  number: 1
  title: Company Overview
  summary: Neo Fusion is a 2023-founded Hefei fusion company built around the BEST compact high-field tokamak and capitalized primarily through strategic registration-capital contributions from Chinese state-linked investors and NIO-linked industrial capital. The company's strongest asset is its integration into the EAST–CRAFT–BEST fusion ecosystem and a 2027 first-plasma / 2030 power-demonstration roadmap; its weakest point is thin commercial and governance disclosure relative to its roughly US$2.03B registered-capital base.
sections:
- id: identity-and-mandate
  title: Identity, mandate, and why the company exists
  body: 'Neo Fusion is best understood as the commercialization and engineering vehicle wrapped around China''s BEST tokamak program rather than as a typical venture-backed startup. Public profiles consistently place the company in Hefei, Anhui and tie its origin to 19 May 2023, when the entity was formed to move controlled-fusion work closer to an industrial buildout path. Its one-line mission is straightforward: develop and ultimately commercialize tokamak-based fusion energy systems. What makes the company unusual is the magnitude and composition of its capital base. Instead of a traditional seed-to-Series progression, Neo Fusion emerged with state-linked registration capital, then scaled that base sharply in 2024 as CNPC and Science Island-linked investors joined. The result is a company whose identity is inseparable from Chinese national fusion ambitions, the Hefei Comprehensive National Science Centre, and the physical build schedule of BEST itself.'
  claimRefs:
