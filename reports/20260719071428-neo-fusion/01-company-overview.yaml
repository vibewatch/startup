- id: program-milestones-and-ecosystem
  title: Program milestones and the Hefei fusion ecosystem
  body: 'The strongest evidence in Neo Fusion''s favor is not a customer roster or revenue base but the surrounding technical ecosystem. BEST has moved from civil construction into final assembly, with a major Dewar-base installation completed in October 2025 and a research plan released with EUROfusion in November 2025. Those materials say first plasma is targeted for 2027 and that the machine is expected to pursue burning-plasma physics at Q>5 while serving as a testbed for deuterium-tritium operations, materials, blanket modules, and fuel-cycle systems. In strategic terms, BEST is framed as the bridge between EAST and a future Chinese demo reactor, while Hefei already hosts EAST and CRAFT along with an expanding supplier and university network. That concentration of assets gives Neo Fusion a rare national-program halo, but it also creates schedule pressure: the window from first plasma to a 2030 electricity demonstration is exceptionally tight by fusion standards.'
