  evidenceGaps:
  - type: missing-source
    severity: material
    topic: shareholder-breakdown
    missingEvidence: A primary shareholder schedule or official annual filing showing each post-2024 shareholder percentage and board rights.
    whyItMatters: Without a primary cap-table document, control rights, dilution mechanics, and strategic veto positions remain inferred rather than proven.
    diligencePath: Obtain the latest official SAIC / QCC corporate-shareholder extract or a company-provided cap-table summary.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-deployment
    missingEvidence: A project-budget bridge showing how much of the RMB 14.5 billion registered capital is paid in, ring-fenced, and spent on BEST.
    whyItMatters: Registration capital overstates funding certainty if the underlying cash has not yet been deployed to the project entity on the expected schedule.
    diligencePath: Request audited capital-contribution schedules, project budgets, and use-of-funds documentation from the company or sponsoring institutions.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: commercialization-timing
    missingEvidence: Any disclosed revenue model, offtake plan, or internal milestone linking 2027 first plasma to 2030 power-demonstration monetization.
    whyItMatters: Investors cannot assess business-model timing or capital needs without a bridge from research milestones to first revenue.
    diligencePath: Ask management for the internal commercialization roadmap, customer-development plan, and expected revenue trigger events.
    relatedQuestionRefs:
    - QO025
  - type: stale
    severity: minor
    topic: leadership-disclosure
    missingEvidence: A current official leadership page that reconciles legal representative, chairman, general manager, and technical leadership roles.
    whyItMatters: Leadership ambiguity complicates governance diligence and key-person risk analysis.
    diligencePath: Re-check the company website or corporate registry once a stable public source is accessible, and compare against official procurement or hiring notices.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO003
