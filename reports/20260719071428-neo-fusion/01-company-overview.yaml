- id: adverse-signals-and-open-questions
  title: Adverse signals and open diligence questions
  body: The main adverse read-through is not that Neo Fusion lacks strategic support, but that the public record remains thin relative to the scale of capital and ambition being claimed. Accessible sources do not disclose revenue, customers, headcount, or cash deployment against the RMB 14.5 billion registered-capital base. The company's public website is not a dependable research surface from an international network, and even basic governance details such as the complete post-2024 shareholder schedule or the current legal representative are easier to reconstruct from secondary mirrors than from a primary corporate filing. At the sector level, Crunchbase's 2024 funding reality check shows how quickly fusion capital cycles can cool when projects remain years from commercialization. Neo Fusion may be insulated by state support, but its future still depends on translating national-program prestige into repeatable engineering execution on a very compressed timetable and then into a credible
    commercial operating model.
  claimRefs:
