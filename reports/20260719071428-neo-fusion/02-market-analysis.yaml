company:
  name: Neo Fusion
chapter:
  number: 2
  title: Market Analysis
  summary: The addressable market for Neo Fusion is potentially enormous, but only if one distinguishes between long-run firm-power demand and the much narrower near-term market for demonstration assets and fusion supply-chain spending. Published TAM estimates run from roughly $472B by 2030 to $840B by 2040, yet the realistic first customers remain state-backed utilities, public programs, and selected industrial offtakers that can absorb first-of-a-kind project risk.
sections:
- id: boundary-and-demand
  title: 'Market boundary: firm clean power, not scientific spending'
  body: 'Neo Fusion does not compete in the small market for laboratory experiments; it is trying to enter the vastly larger market for firm low-carbon electricity and the infrastructure required to build first-of-a-kind fusion plants. That distinction matters because many published fusion market reports jump immediately to multi-hundred-billion-dollar outcomes without separating demonstration spending from bankable power sales. ITER and other official sources make clear why the prize is so large: fusion promises dense, dispatchable, fuel-abundant electricity with far lower carbon intensity than fossil generation. At the same time, the rise in data-center electricity demand and broader clean-energy demand growth supports the idea that grids will keep needing new firm generation options. For Neo Fusion, the practical market starts with proving that BEST can be a bridge from science to a financeable demonstration asset. In other words, market analysis has to be staged: first a market for validated
    engineering capability, then a market for demonstration plants, and only much later a mature market for delivered fusion electricity.'
  claimRefs:
  - CM001
  - CM002
  - CM013
  - CM014
  - CM032
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-and-buyer-segments
  title: Sizing lenses and buyer segmentation
  body: 'Third-party market reports place the long-run fusion opportunity in the hundreds of billions of dollars by 2030 to 2040, but these numbers are better treated as directional than as underwriting inputs. They depend on highly optimistic assumptions about technology readiness, licensing, and plant deployment at a pace that no fusion company has yet demonstrated. A more useful diligence lens is to identify who will pay first: governments and state-backed utilities for demonstrations, then regulated utilities and selected industrial buyers for early offtake. That sequence fits Neo Fusion especially well because the company is deeply embedded in China’s state-backed fusion ecosystem. The first market is therefore institutional and negotiated, not mass-market and price-transparent. Even if global demand is immense, only a very small subset of counterparties can currently absorb first-of-a-kind technology, licensing, construction, and uptime risk.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM010
