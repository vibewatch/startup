- id: china-path-and-adoption
  title: China-specific adoption path
  body: China offers Neo Fusion an unusually supportive early market because demonstration value itself is strategically important. Official reporting around BEST says the project is targeting a 2030 electricity-generation demonstration, while CAS ecosystem reporting describes Hefei as a city intentionally concentrating EAST, CRAFT, BEST, suppliers, and new talent pipelines. That means Neo Fusion does not need a conventional commercial market to justify the next stage of spending; it needs to remain central to a national engineering roadmap. If BEST performs well, the most likely next customer is some form of state-backed demonstration or utility-linked project rather than a pure private merchant plant. This path is a strength domestically but could also limit the company’s international portability if geopolitics tightens. The company may therefore enjoy a privileged home market before it has anything resembling a globally open export market, and that sequencing may ultimately define its
    first decade.
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM024
  - CM031
  - CM034
  tableRefs:
  - TM004
- id: constraints-and-contradictions
  title: Constraints and contradictory signals
  body: The core contradiction in the fusion market is that valuation narratives and market-size reports are already talking in utility-scale numbers while the industry is still proving hardware milestones. Crunchbase’s funding reality check from 2024 showed how quickly investor enthusiasm can cool when large raises stop arriving, and the same structural problem remains in 2026 even after funding rebounds. Capital intensity, evolving licensing frameworks, geopolitical sensitivity, and substitute technologies all slow adoption. For Neo Fusion, the implication is that a strong macro market does not automatically translate into a financeable company outcome. The company still needs to prove performance, define economics, and show that a Chinese demonstration asset can convert into repeatable commercial demand. Until then, market enthusiasm should be read as option value around a future category, not as evidence that a bankable customer market already exists. That distinction is central to any
    disciplined diligence process for fusion and especially for Neo Fusion today.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM018
  - CM027
  - CM037
  - CM038
