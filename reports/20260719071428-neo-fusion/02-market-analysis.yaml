- id: TM004
  title: China-specific adoption enablers for Neo Fusion
  columns:
  - Enabler
  - Evidence
  - Why it matters
  - Remaining gap
  rows:
  - - BEST 2030 demonstration ambition
    - Official Chinese reporting
    - Creates a domestic milestone-led market window
    - Needs first plasma on schedule
  - - Hefei fusion cluster
    - CAS ecosystem reporting
    - Concentrates talent, suppliers, and infrastructure
    - Cluster depth does not equal revenue certainty
  - - EAST and CRAFT heritage
    - HFIPS / CAS reporting
    - Transfers operating and component experience into BEST
    - Commercial plant design still separate
  - - State-backed capital
    - Neo Fusion profiles and media
    - Supports capex-heavy pre-revenue execution
    - Capital efficiency and deployment remain opaque
  - - International research links
    - EUROfusion / CAS
    - Improves scientific legitimacy and technical learning
    - Does not guarantee market access abroad
  notes: China offers a uniquely supportive demonstration environment, but the path from state-backed engineering to market-priced electricity remains unproven.
