figures:
- id: FM001
  title: Illustrative fusion market adoption staircase
  type: timeline
  layout: wide
  summary: Fusion market formation should progress from R&D infrastructure to demonstrations, then to utility and industrial offtake, not directly to mass power sales.
  data:
    items:
    - label: Public R&D and prototypes
      date: today
      value: Labs, test assets, enabling infrastructure
    - label: Burning-plasma proof
      date: late 2020s
      value: BEST / SPARC / Polaris-type milestones
    - label: State-backed demo plants
      date: around 2030
      value: First electricity demonstrations
    - label: Utility and industrial pilots
      date: early 2030s
      value: PPAs, site-hosting, regulated procurement
    - label: Fleet deployment
      date: mid / late 2030s
      value: Repeatable power-plant orders
    - label: Broader market normalization
      date: 2040s
      value: Competition on cost and uptime rather than novelty
  approximationNotes: Dates are directional because the entire sector remains precommercial and milestone timing is uncertain.
  claimRefs:
  - CM017
  - CM034
  - CM038
