  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A bottoms-up demand model separating demonstration spend, supply-chain value, and eventual electricity sales for China specifically.
    whyItMatters: Top-down global TAMs are too dispersed to support a confident underwriting case for Neo Fusion’s actual addressable market.
    diligencePath: Build a bottoms-up model from plausible demonstration-plant counts, utility demand, industrial offtake, and Chinese energy-policy milestones.
    relatedQuestionRefs:
    - QM022
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: neo-unit-economics
    missingEvidence: Any project-specific cost, uptime, or LCOE assumptions for Neo Fusion’s post-BEST commercial plant concept.
    whyItMatters: Without unit economics, the market can only be described qualitatively and cannot be translated into valuation or financing assumptions.
    diligencePath: Request management’s internal techno-economic model or a staged cost roadmap linked to BEST milestones.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: minor
    topic: china-demand-forecast
    missingEvidence: A public Chinese government forecast quantifying future fusion electricity demand or planned deployment volumes.
    whyItMatters: Neo Fusion’s strongest early market may be domestic, yet public sources rarely quantify that market precisely.
    diligencePath: Review future NDRC, provincial energy-plan, or BEST program documents for deployment assumptions once published.
    relatedQuestionRefs:
    - QM022
  - type: stale
    severity: minor
    topic: export-markets
    missingEvidence: A recent public policy statement on whether Chinese fusion demonstration projects will target overseas customers or remain domestically prioritized.
    whyItMatters: Export restrictions or strategic prioritization could materially narrow Neo Fusion’s long-run market access.
    diligencePath: Track future collaboration agreements, export-control developments, and official conference statements on international commercialization.
    relatedQuestionRefs:
    - QM025
