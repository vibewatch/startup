- id: TM005
  title: Adoption constraints and contradictory signals
  columns:
  - Constraint
  - What the evidence says
  - Why it slows adoption
  - Monitoring indicator
  rows:
  - - Capital intensity
    - Sector has raised billions but still needs repeated mega-rounds
    - First plants remain too expensive for normal project finance
    - Additional state or strategic capital commitments
  - - Licensing and standards
    - Regulatory frameworks are still evolving
    - Unclear licensing slows utility procurement
    - Formal fusion-specific rulemaking
  - - Timeline mismatch
    - Commercial demand narratives outpace hardware readiness
    - Buyer contracts can outrun engineering proof
    - First-plasma and Q milestones achieved on time
  - - Substitute technologies
    - Fission, storage, and grid buildout keep advancing
    - Utilities may solve firm-power needs sooner elsewhere
    - Relative LCOE and permitting comparisons
  - - Geopolitics
    - International collaboration is increasing but sensitive
    - Cross-border customer markets may narrow for Chinese programs
    - Export controls, partner-program restrictions
  notes: The market opportunity is real, but every major constraint sits on the critical path between BEST and any financeable commercial plant.
