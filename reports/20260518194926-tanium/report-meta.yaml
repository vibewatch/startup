companyProfile:
  summary: >
    Tanium is a U.S. cybersecurity and endpoint-management company founded in 2007 by David and Orion Hindawi.
    The platform spans real-time endpoint visibility, patching, risk and compliance, incident response, and a newer
    AI-led workflow layer marketed as Atlas and Tanium Ask. Public customer proof remains strongest in very large,
    regulated environments, including Fortune 100 companies, top U.S. banks, and multiple U.S. federal and military
    organizations. Public evidence supports a business at roughly $700 million revenue or ARR scale and still well
    above the $1 billion valuation floor, but entry underwriting remains limited by sparse disclosure on current
    growth, margins, retention, burn, and the preference stack.
  foundedDate: "2007-01-01"
  founders:
    - name: "David Hindawi"
      role: "Co-founder & Chairman Emeritus"
      background: "Previously founded BigFix and remained in senior governance roles after Tanium's 2023 CEO transition."
      claimRefs: [CO001, CO012, CO014]
    - name: "Orion Hindawi"
      role: "Co-founder & Executive Chairman"
      background: "Longtime Tanium operator who handed the CEO role to Dan Streetman in 2023 while remaining deeply involved in strategy and governance."
      claimRefs: [CO001, CO012, CO013, CO048]
  foundingLocation: "Emeryville, CA, USA"
  headquarters: "Kirkland, WA, USA"
  productSummary: >
    Unified endpoint management and security platform covering asset visibility, patch and configuration control,
    risk and compliance, incident response, workflow automation, and newer AI-assisted operations modules.
  customerFocus: >
    Large enterprises, regulated industries, and U.S. federal agencies with complex endpoint estates and strong
    requirements for real-time visibility, remediation, and compliance operations.
  businessModel: >
    Multi-module endpoint software sold primarily on a per-endpoint basis across core platform, endpoint management,
    risk/compliance, and incident-response offerings, with hybrid cloud and on-prem deployment paths and channel /
    public-sector procurement support.
  stage: "Series H / late-stage private"
  fundingStatus: >
    Last disclosed primary financing was a $150 million Series H at a $9 billion post-money valuation in June 2020;
    later third-party profiles still place Tanium above the unicorn threshold and commonly cite roughly $1.1 billion
    to $1.174 billion of cumulative capital raised.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO012, CO014, CO048, CO049, CI011, CV006, CV007, CV009, CV011]

