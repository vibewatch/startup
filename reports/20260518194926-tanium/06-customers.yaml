chapter:
  number: 6
  title: Customers
  summary: 'Public customer proof shows Tanium concentrated in very large, regulated, and public-sector endpoint estates: the company claims 50% of the Fortune 100, 4 of 5 top U.S. banks, and all 6 U.S. Armed Forces branches, while named deployments include AstraZeneca, JLL, Zurich, City of Phoenix, Whirlpool, ABB, Colgate-Palmolive, and Metropolitan Water District. Outcome evidence is concrete on operating leverage—Phoenix reports a 75% shorter patch cycle, Zurich up to 100 resource hours saved per month, JLL a 20% cut in cybersecurity spend, and ABB a 14x estimated ROI—but durability still rests on proxies because Tanium does not publicly disclose exact active customer count, NRR, GRR, or top-customer concentration. Independent review and marketplace sources are directionally positive on renewal intent but consistently flag price, implementation effort, and learning-curve risk.'
sections:
- id: customer-reach-and-segments
  title: Customer reach, buyer fit, and proof of scale
  body: 'Tanium’s public customer proof points to a narrowly valuable but defensible customer base: very large enterprises and public institutions that care more about real-time control, compliance, and operational scale than about low-friction mid-market deployment. The company’s current customer page says Tanium serves 50% of the Fortune 100, 4 of 5 top U.S. banks, and all 6 U.S. Armed Forces branches. The same public surface pairs those concentration markers with operating-outcome data, including 95% patching-efficiency improvement, 70% productivity improvement, and 75% MTTR reduction from cited studies. Named proofs also cluster around very large fleets—AstraZeneca at roughly 125,000 endpoints, Zurich at more than 100,000, JLL at nearly 90,000, and the City of Phoenix at more than 20,000—implying Tanium’s sweet spot is the high-value estate where security, IT operations, and compliance teams all share the same endpoint data plane. What is still missing is denominator disclosure: Tanium
    publicly markets concentration markers and marquee logos, but not exact active customer count or segment revenue mix.'
