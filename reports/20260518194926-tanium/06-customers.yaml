figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How large enterprise and public-sector buyers move from compliance or visibility pain into deployment, operations, and expansion with Tanium.
  data:
    items:
    - label: Awareness
      detail: 'A CISO, CIO, or federal security lead starts from a mandate, incident, or visibility gap: Fortune 100-grade hygiene expectations, KEV pressure, modernization programs, or dissatisfaction with fragmented tooling.'
      touchpoints:
      - Federal compliance mandates
      - Customer stories and reference pages
      - Peer reviews and marketplace feedback
    - label: Evaluation
      detail: Security engineering and endpoint teams test whether Tanium can answer live questions across very large estates while integrating with Microsoft, ServiceNow, or existing patching and response workflows.
      touchpoints:
      - AstraZeneca, Zurich, and Phoenix references
      - Microsoft integration stories
      - PeerSpot / TrustRadius / Gartner review research
    - label: Purchase
      detail: Procurement adds ROI and buyability screens. Public-sector buyers lean on FedRAMP, GSA, DIR, and channel vehicles; commercial buyers weigh vendor consolidation and total-cost-of-ownership arguments.
      touchpoints:
      - Forrester TEI / Business Wire ROI proof
      - Carahsoft contract vehicles
      - Texas DIR cooperative contract
    - label: Deployment
      detail: Endpoint and security operations teams deploy Tanium where fleet scale, patch cadence, or response latency create value, then operationalize automations and dashboards.
      touchpoints:
      - Patching-cycle reduction
      - Real-time visibility across 20K–125K endpoints
      - Unified IT/security workflows
    - label: Expansion / renewal
      detail: The best public examples show Tanium staying in the account by becoming the action layer for broader operations or Microsoft-aligned security programs, but this stage is where price and complexity objections reappear.
      touchpoints:
      - Partner-led module expansion
      - Operational automation gains
      - Review-platform complaints on complexity and pricing
  approximationNotes: This map is reconstructed from fetched customer stories, procurement pages, and independent review surfaces. Tanium does not publish average sales-cycle or deployment-time data, so stage timing is inferred from public evidence.
  claimRefs:
  - CU035
  - CU045
  - CU046
  - CU048
  - CU050
