- id: expansion-loops-and-concentration-risk
  title: Expansion loops and concentration risk
  body: The clearest expansion pattern in public evidence is not horizontal logo count; it is deeper standardization inside already large estates. AstraZeneca, JLL, and Metropolitan Water District all frame Tanium in combination with Microsoft tooling, while Colgate, Whirlpool, Zurich, and Phoenix highlight unified workflows across security and IT operations rather than one-off modules. That suggests Tanium expands by becoming the live data and action layer that other security and service-management tools rely on. The same pattern, however, creates concentration risk. If customer proof is disproportionately drawn from Fortune 100 firms, top banks, armed forces branches, and other large regulated accounts, then growth depends on relatively few high-value buying centers with long procurement cycles and heavy implementation work. The public record also does not disclose top-customer concentration, segment ARR mix, renewal cohorts, or contract-length distribution. In practice, that leaves Tanium
    with an attractive land-and-expand narrative, but one whose durability still depends on management evidence rather than public proof alone.
