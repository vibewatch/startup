- id: named-deployments-and-outcomes
  title: Named deployments and measured outcomes
  body: 'The strongest part of Tanium’s customer evidence is that several named references disclose real deployment scale or measurable operational outcomes instead of just listing logos. AstraZeneca says Tanium supports IT systems and research operations across about 125,000 endpoints, cutting one patching process from a week to 10 minutes and helping detect Log4j exposures without disruption. City of Phoenix reports more than 20,000 managed endpoints and a 75% reduction in patching-cycle time. Zurich says Tanium helps secure more than 100,000 endpoints and saves up to 100 resource hours each month through automated patching. Whirlpool describes a move from fragmented tooling to a unified control plane, while ABB estimates 14x ROI and hundreds of thousands of person-hours saved. JLL is especially valuable as cross-domain proof because Microsoft independently states that JLL used Tanium alongside Defender for Endpoint across nearly 90,000 endpoints in more than 80 countries and cut cybersecurity
    spending by 20%. The limitation is that these are still curated references: they prove production value at important accounts, but they do not reveal whether the broader base renews or expands at similar rates.'
