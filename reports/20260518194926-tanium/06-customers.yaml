  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, gross churn, logo churn, and cohort-retention tables by product and segment.
    whyItMatters: Without revenue-retention disclosure, public review scores and case-study outcomes cannot establish economic durability.
    diligencePath: Request renewal cohorts, gross retention, and churn schedules in the data room and reconcile them to major customer segments.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU024
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-concentration
    missingEvidence: Exact active customer count, top-10 customer concentration, segment ARR mix, and contract-length distribution.
    whyItMatters: The public story points to large-account concentration, but underwriting concentration risk requires actual revenue distribution and renewal timing.
    diligencePath: Request active-customer count by segment, top-customer ARR concentration, and an expiry calendar for the largest accounts.
    relatedQuestionRefs:
    - QU011
    - QU017
    - QU024
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Independent validation and current subscription status for named reference customers beyond the curated case-study set.
    whyItMatters: Publicly named accounts prove real deployments, but they do not show whether the references are still live, representative, or expanding.
    diligencePath: Ask for at least three current customer reference calls across commercial, federal, and state/local segments plus evidence that named public references remain active.
    relatedQuestionRefs:
    - QU004
    - QU018
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: public-sector-award-volume
    missingEvidence: Award-by-award spend, seat counts, and renewal visibility for federal and state/local contracts.
    whyItMatters: FedRAMP and contract vehicles prove buyability, but they do not prove the scale or durability of public-sector bookings.
    diligencePath: Pull direct award data from the company or reseller pipeline and reconcile it to current public-sector ARR and installed endpoints.
    relatedQuestionRefs:
    - QU005
    - QU006
    - QU021
    relatedTableRefs:
    - TU004
