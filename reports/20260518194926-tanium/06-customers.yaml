callouts:
- calloutType: strength
  title: Public proof is unusually concrete for a private infrastructure vendor
  body: 'Tanium’s customer surface is stronger than a logo wall: it pairs concentration markers, named deployments, endpoint counts, procurement vehicles, and outcome metrics. That is enough to underwrite real adoption in large and public-sector estates even before private data-room access.'
  claimRefs:
  - CU003
  - CU007
  - CU015
  - CU023
  - CU031
  - CU033
- calloutType: risk
  title: Durability is still a proxy judgment
  body: No fetched public source disclosed Tanium’s total active customer count, NRR, GRR, churn, top-customer concentration, or renewal-cohort detail. Review and procurement signals point in the right direction, but the real retention question remains a management diligence item.
  claimRefs:
  - CU041
  - CU043
  - CU044
  - CU049
- calloutType: insight
  title: The expansion wedge is standardization, not volume
  body: The best public evidence shows Tanium expanding when customers standardize on a live control layer across very large estates or Microsoft-adjacent security programs. That favors premium enterprise and government accounts, but it also narrows the addressable buyer profile and raises concentration risk.
  claimRefs:
  - CU045
  - CU046
  - CU047
  - CU050
