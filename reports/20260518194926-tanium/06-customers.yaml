- id: satisfaction-retention-and-durability
  title: Satisfaction signals and durability gaps
  body: 'Tanium’s durability story is credible but still incomplete. On the positive side, independent review platforms are better than one would expect for a complex endpoint platform: TrustRadius shows a 9.2/10 score from 30 reviews, PeerSpot shows 3.9/5 with 80% willing to recommend, and SoftwareReviews reports 93 for likelihood to recommend and 99 for plan to renew. Those are meaningful proxies that customers who invested in the platform often stay engaged. The negative side is consistent too. Review and marketplace sources repeatedly flag price, implementation effort, support friction, and the need for experienced operators; PeerSpot specifically notes integrations that are not simple and policies that can take three or four days to reflect, while AWS Marketplace reviews mention complexity and expense. Gartner’s product page also captures both favorable and critical reviews. The central diligence problem is that Tanium still provides no public NRR, GRR, churn, cohort-retention, or exact
    active customer count disclosure, so public durability remains a proxy judgment rather than a directly measured revenue-retention fact.'
