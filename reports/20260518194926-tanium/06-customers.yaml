- id: federal-and-public-sector-proof
  title: Federal and public-sector procurement proof
  body: 'Public-sector evidence is unusually important for Tanium because it separates mere federal-adjacent marketing from an actually buyable and deployable posture. Tanium’s federal solutions page explicitly says the platform is deployed across the U.S. Armed Forces and major federal agencies, and ties the offering to EO 14028, CISA’s KEV-driven remediation mandates, asset-visibility requirements, NIST 800-53, CMMC 2.0, and CDM workflows. Business Wire’s FedRAMP announcement adds historical context: Tanium said its technology already supported five Department of Defense branches and civilian agencies when Tanium Cloud for U.S. Government was authorized. That posture is reinforced by today’s FedRAMP Marketplace listing, Carahsoft’s current contract-vehicle catalog, Texas DIR’s active cooperative contract, and Carahsoft’s public-sector case-study roster naming the State of Arizona, Navy cyber defenders, and a government agency replacing BigFix. Together these sources imply that Tanium’s
    public-sector motion is as much procurement-and-compliance enabled as it is feature enabled.'
