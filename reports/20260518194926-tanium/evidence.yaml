evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: A complete 2026 board roster including all independent and investor-designated directors.
    whyItMatters: >-
      Board composition determines governance quality, control checks, and investor influence, but retained public bios
      only identify a subset of directors.
    diligencePath: Request the latest board roster, committee assignments, and observer rights from management or the data room.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: An exact current customer-count disclosure or another auditable public metric for total accounts.
    whyItMatters: >-
      Customer count is a core cover metric and a key input for evaluating distribution breadth, revenue concentration,
      and market maturity.
    diligencePath: >-
      Ask management for the current customer count and top-20 customer concentration, then reconcile it with CRM or
      billing-system extracts.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, revenue run-rate, growth, and retention figures from management or audited financial materials.
    whyItMatters: >-
      Later financial and valuation chapters need a current revenue anchor, but retained public sources only provide
      third-party estimates and no authoritative run-rate.
    diligencePath: Request the latest board deck or audited/management financial statements with ARR, revenue, gross margin, and NRR.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A current cap table showing founder, employee, and investor ownership percentages plus board-designation rights.
    whyItMatters: >-
      Ownership concentration drives governance, exit alignment, and dilution analysis, but public sources stop at
      investor names and round history.
    diligencePath: >-
      Request the cap table and side-letter summary under NDA, then reconcile ownership rights with board
      representation.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: master-data-conflicts
    missingEvidence: >-
      A single management-confirmed statement of current headquarters, operating center, and CEO title for all public
      properties.
    whyItMatters: >-
      Public inconsistencies across leadership and location surfaces create avoidable diligence friction and weaken
      confidence in other current-state claims.
    diligencePath: >-
      Ask management to identify the canonical headquarters and CEO title, then confirm those labels across the website,
      data providers, and any prospectus drafts.
    relatedQuestionRefs:
      - QO005
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A current management-confirmed employee count and definition of who is included (full-time only, contractors,
      subsidiaries).
    whyItMatters: >-
      Forbes, Yahoo Finance, and ZoomInfo all imply different headcount ranges, so even simple maturity comparisons
      remain noisy.
    diligencePath: Ask management for the current employee count and reconcile it to payroll or HRIS data.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004-public-milestones-only
    missingEvidence: >-
      A full internal chronology covering undisclosed financings, leadership changes, product releases, and any other
      material adverse events not captured in public sources.
    whyItMatters: >-
      The milestone table is the chronology of record for the chapter, but it is necessarily limited to publicly visible
      events and may omit private but material inflections.
    diligencePath: >-
      Request a management-prepared corporate timeline and reconcile it against board materials, financing documents,
      and internal release histories.
    relatedQuestionRefs:
      - QO009
      - QO018
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Current Tanium revenue, endpoint count, and segment share by product line or buyer segment.
    whyItMatters: >-
      Without a disclosed revenue or installed-base denominator, public evidence can bound TAM and SAM but cannot
      produce a reliable SOM or market-share view.
    diligencePath: >-
      Request current ARR or revenue, managed endpoint counts, and win-loss share by enterprise, healthcare, and
      public-sector segments from management.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: public-sector-sam
    missingEvidence: Public-sector contract volume, federal mix, and agency-by-agency spend attributable to Tanium.
    whyItMatters: >-
      Public-sector relevance is clear, but the size of the reachable government wedge cannot be isolated from public
      materials alone.
    diligencePath: >-
      Review public procurement data, schedule contracts, and management-provided public-sector revenue mix to build a
      government-specific SAM.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: product-mix
    missingEvidence: Revenue split between endpoint management, exposure management, and any other Tanium modules.
    whyItMatters: >-
      Valuation and market-penetration work depends on knowing whether growth is coming from the core control plane or
      from newer adjacent modules.
    diligencePath: Request module-level bookings or ARR, attach rates, and cross-sell metrics by customer cohort.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: material
    topic: sizing-conflict
    missingEvidence: >-
      A harmonized mapping of which analyst market definitions include mobile management, endpoint protection, exposure
      management, or workflow layers.
    whyItMatters: >-
      Public market estimates are directionally useful but not directly comparable, so valuation work can be distorted
      if the broadest figure is treated as canonical.
    diligencePath: >-
      Rebuild the market map with management using one chosen perimeter, then reconcile each retained analyst source
      back to that perimeter.
    relatedQuestionRefs:
      - QM006
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: tanium-pricing
    missingEvidence: Current Tanium list-to-net pricing bands, discount structure, and module-level packaging for enterprise customers.
    whyItMatters: >-
      Without current contracted pricing, the chapter can compare only public rival price signals and quote-led posture,
      not true TCO or price-performance.
    diligencePath: >-
      Request recent Tanium proposals or redlined order forms by segment and compare them with actual Intune, BigFix,
      NinjaOne, and Automox proposals in the same account sizes.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Public or management-supplied win-loss data showing how often Tanium wins or loses against Intune, BigFix,
      CrowdStrike, SentinelOne, NinjaOne, and Workspace ONE by deal type.
    whyItMatters: >-
      The current analysis identifies likely competitive pressure points, but it cannot quantify how often each rival
      actually displaces Tanium or fails to do so.
    diligencePath: >-
      Request rolling 12-month competitive win-loss reports segmented by deal size, Microsoft 365 penetration,
      public-sector status, and primary use case.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: workspace-one-commercial-trajectory
    missingEvidence: >-
      Independent 2025-2026 evidence on Workspace ONE churn, pricing changes, or support outcomes after Broadcom
      ownership changes.
    whyItMatters: >-
      Retained sources clearly support Workspace ONE product breadth, but independent evidence on commercial disruption
      is thinner, so competitive risk versus Tanium could be overstated or understated.
    diligencePath: >-
      Pull recent customer-review trend data, renewal commentary, or channel feedback specific to Workspace ONE pricing
      and support changes after Broadcom integration.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: margin-and-retention
    missingEvidence: >-
      Current gross margin by cloud, on-prem, hardware, and services delivery line, plus NRR, GRR, and logo churn by
      cohort.
    whyItMatters: >-
      Without margin and retention data, it is impossible to judge whether Tanium deserves infrastructure-software
      multiples or whether hybrid delivery drags profitability.
    diligencePath: >-
      Request board KPI pack, cohort retention tables, and a product-line gross-margin bridge covering cloud, on-prem,
      hardware, and services.
    relatedQuestionRefs:
      - QI017
      - QI018
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, free-cash-flow bridge, and any debt or covenant schedule as of 2026.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from valuation marks alone; liquidity and covenant visibility are required
      to judge downside protection.
    diligencePath: >-
      Obtain the latest management balance sheet, cash-flow statement, debt schedule, and base-case or downside runway
      analysis.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
      - TI005
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      An authoritative cap table and round-by-round proceeds schedule reconciling Yahoo or Forge total raised with
      Forbes and Latka totals.
    whyItMatters: >-
      Ownership, liquidation preferences, and dilution cannot be modeled accurately while public funding totals remain
      inconsistent.
    diligencePath: >-
      Request cap table, board consents, closing memos, and any tender or secondary transaction history; reconcile
      against each public data vendor.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: federal-revenue-mix
    missingEvidence: Federal or public-sector ARR, direct versus partner mix, and channel take-rate economics by contract vehicle.
    whyItMatters: >-
      Contract vehicles and compliance readiness show distribution access, but not how much high-quality recurring
      revenue is actually coming from the public sector.
    diligencePath: >-
      Request ARR, bookings, gross margin, and renewal metrics split by federal, SLED, and commercial segments, with
      partner margin waterfalls.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI001
      - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP after discounts, services attach, module attach, and renewal pricing across top customer cohorts.
    whyItMatters: >-
      Public procurement prices establish only a ceiling or floor; underwriting CAC, payback, and gross margin requires
      net realized pricing and attachment behavior.
    diligencePath: Review quote-to-cash exports, top-50 account pricing schedules, and renewal cohorts by module and delivery model.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: commercial-certification-scope
    missingEvidence: >-
      Current public documentation that clearly enumerates Tanium commercial-cloud certifications and control scope (for
      example SOC 2, ISO, FIPS, regional boundaries, and service inclusions).
    whyItMatters: >-
      The chapter can confirm FedRAMP Moderate for TC-USG, but buyers still need readable evidence for the broader trust
