    relatedQuestionRefs:
      - QE014
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: independent-performance-benchmarks
    missingEvidence: >-
      Independent benchmark data for patch-success uplift, CPU impact during scanning or patching, and query latency at
