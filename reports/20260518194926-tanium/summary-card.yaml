  topStrengths:
    - >-
      Tanium has durable fit in very large enterprise and public-sector environments, with public proof across Fortune
      100 accounts, major U.S. banks, and all six U.S. Armed Forces branches.
    - >-
      The platform still differentiates on real-time endpoint visibility, deep remediation workflows, hybrid deployment
      support, and growing AI-assisted operations modules.
    - >-
      Multiple post-May-2024 signals — including Forbes' 2025 profile and Yahoo/Forge's 2026 estimate — confirm Tanium
      remains well above the $1 billion private-company valuation threshold.
  topRisks:
    - >-
      Core underwriting inputs remain private: current ARR, growth rate, gross margin, net retention, burn, runway, and
      the preference waterfall are not publicly disclosed.
    - >-
      Public valuation signals span roughly $4.26 billion to $9 billion, so entry price discipline matters and the
      legacy $9 billion frame looks stretched without fresh financial disclosure.
    - >-
      Governance-history noise, product-complexity complaints, and concentration in large enterprise and federal buying
      motions can all widen downside if execution slips.
  unresolvedGaps:
    - >-
      Current ARR, revenue growth, gross margin, free cash flow, and net retention are not publicly disclosed and remain
      the biggest blockers to clean underwriting.
    - >-
      Common-equity value cannot be pinned down without the latest 409A or tender data and the full
      liquidation-preference stack.
    - Exact active-customer count, renewal cohorts, and top-customer concentration remain undisclosed.
    - >-
      Public sources conflict on current headcount, total raised, and primary headquarters labeling, so management
      confirmation is still needed.
