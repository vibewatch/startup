summary:
  headline: >
    Tanium remains a scaled, strategically relevant endpoint-security platform with credible post-2024 unicorn valuation
    support, but investment underwriting still needs refreshed ARR, margin, retention, and cap-table disclosure before
    the legacy $9 billion narrative can be treated as fully durable.
