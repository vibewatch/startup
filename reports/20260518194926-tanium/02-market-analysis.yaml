- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Federal zero-trust programs (OMB + CISA)
    - Driver
    - Current / multi-year
    - Keeps asset, device, and control programs on funded public-sector roadmaps
    - Request federal pipeline mix, deal stages, and renewal rates by agency
  - - Cyber hygiene and KEV-driven vulnerability prioritization
    - Driver
    - Current / continuous
    - Validates inventory-plus-remediation workflows and faster patch prioritization
    - Ask how often Tanium data is mapped to KEV or similar exploitability frameworks in live deployments
  - - HIPAA and regulated-sector asset-inventory pressure
    - Driver
    - Current / near-term
    - Raises the compliance value of endpoint visibility, asset maps, and risk management in healthcare
    - Request healthcare customer references tied to compliance use cases, not just security outcomes
  - - Cloud-delivered control planes and services-heavy implementation
    - Driver
    - Current / structural
    - Supports platforms that can unify management, analytics, and remediation while providing operating help
    - Measure services attachment, partner utilization, and time-to-value by deployment type
  - - Incumbent Microsoft bundle
    - Constraint
    - Current / structural
    - Raises the threshold for displacing a baseline cloud endpoint stack in mainstream enterprises
    - Quantify win rates when Intune is already installed and identify the modules that unlock displacement
  - - Category confusion across UEM, EPP, SVM, and ITSM
    - Constraint
    - Current
    - Can slow deal ownership because no single budget line clearly owns the whole platform story
    - Ask which executive persona becomes the durable economic buyer in multi-module deals
  - - Inflated or inconsistent analyst TAM baselines
    - Constraint
    - Current
    - Can overstate valuation upside if diligence uses the highest published market number without exclusions
    - Rebuild TAM with management using disclosed segment mix, endpoint counts, and current module attach
  - - Undisclosed public SOM and product-line revenue mix
    - Constraint
    - Current
    - Prevents precise public share analysis and makes bottom-up valuation calibration harder
    - Request module revenue, exposure-management attach, public-sector mix, and retention by buyer segment
  notes: Drivers are strongest where mandates, cyber hygiene, and workflow consolidation overlap. The main diligence challenge is converting broad market convergence into a budget owner and a measurable Tanium share thesis.
