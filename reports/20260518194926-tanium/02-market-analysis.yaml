figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: Layered sizing uses overlapping market lenses rather than a single inflated cybersecurity TAM.
  data:
    nodes:
    - id: n1
      label: Broad UEM lens
      description: Public 2026 UEM baselines range from $8.85B (Mordor) to $22.75B (TBRC), showing how wide the control-plane market can look depending on category boundary.
    - id: n2
      label: Adjacent exposure / SVM lens
      description: Exposure management is $5.08B in 2026 and security-vulnerability management is $15.93B in 2026; these are adjacent pools, not additive TAM.
    - id: n3
      label: Enterprise-heavy serviceable floor
      description: Using Mordor's 71.62% large-enterprise share on its 2026 UEM base implies a ~$6.34B enterprise-heavy floor before adding public-sector or exposure adjacencies.
    - id: n4
      label: Public SOM gap
      description: Tanium does not publicly disclose 2026 segment share or module revenue, so public evidence supports a bounded wedge, not a precise SOM.
  approximationNotes: The enterprise-heavy floor is a derived estimate using Mordor's published large-enterprise share; no attempt is made to add overlapping UEM and exposure markets.
  claimRefs:
  - CM011
  - CM016
  - CM017
  - CM018
  - CM019
