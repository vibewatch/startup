tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Enterprise endpoint management / UEM
    - Endpoint configuration, software deployment, patching, compliance reporting, endpoint analytics, device policy orchestration
    - Pure mobile-only MDM/MAM or BYOD app containment with no broader control plane
    - CIO, endpoint operations, EUC; central IT budget
    - Core control-plane market where Tanium competes against Microsoft Intune and other endpoint suites
  - - Asset discovery and inventory
    - Real-time endpoint inventory, asset awareness, software and hardware visibility, CMDB-enabling telemetry
    - Static CMDB-only record systems without live endpoint telemetry
    - IT operations, infrastructure, configuration-management owners
    - Critical foundation for Tanium because inventory quality determines control, compliance, and remediation accuracy
  - - Exposure / vulnerability management
    - Continuous vulnerability monitoring, prioritization, exploitability context, remediation orchestration
    - Standalone scanning with no operational workflow or endpoint action layer
    - CISO, vulnerability management, risk and compliance budgets
    - Fast-growing adjacent budget that Tanium can enter with the same endpoint data plane
  - - Workflow automation / autonomous operations
    - ServiceNow-linked remediation, policy workflows, AI-assisted operational actions, cross-team orchestration
    - ITSM ticketing without endpoint execution or isolated RPA with no asset context
    - ITSM owners, CIO office, platform engineering
    - Important expansion layer because Tanium is positioning toward autonomous operations, not just visibility
  - - Public-sector cyber hygiene / zero-trust programs
    - Agency zero-trust migrations, cyber hygiene scanning, vulnerability reduction, regulated endpoint control
    - Network-only zero-trust, advisory-only programs, one-off compliance consulting
    - Federal, state/local, education, defense procurement and modernization budgets
    - Credible serviceable wedge because Tanium already markets government-specific packaging and readiness
  - - Standalone substitutes and excluded categories
    - N/A
    - Pure EDR/XDR, network-only zero-trust, point MDM, or isolated endpoint protection when buyers do not consolidate control and remediation
    - Security or IT line-item budgets already satisfied by incumbents
    - These are real substitutes but should not be counted as included Tanium TAM unless consolidation occurs
  notes: 'Boundary is intentionally convergence-based: the table includes budgets Tanium explicitly links through endpoint telemetry and workflows, and excludes adjacent security or management spend that does not share the same control/remediation thesis.'
