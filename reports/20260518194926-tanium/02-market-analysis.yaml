  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Current Tanium revenue, endpoint count, and segment share by product line or buyer segment.
    whyItMatters: Without a disclosed revenue or installed-base denominator, public evidence can bound TAM and SAM but cannot produce a reliable SOM or market-share view.
    diligencePath: Request current ARR or revenue, managed endpoint counts, and win-loss share by enterprise, healthcare, and public-sector segments from management.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: public-sector-sam
    missingEvidence: Public-sector contract volume, federal mix, and agency-by-agency spend attributable to Tanium.
    whyItMatters: Public-sector relevance is clear, but the size of the reachable government wedge cannot be isolated from public materials alone.
    diligencePath: Review public procurement data, schedule contracts, and management-provided public-sector revenue mix to build a government-specific SAM.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: product-mix
    missingEvidence: Revenue split between endpoint management, exposure management, and any other Tanium modules.
    whyItMatters: Valuation and market-penetration work depends on knowing whether growth is coming from the core control plane or from newer adjacent modules.
    diligencePath: Request module-level bookings or ARR, attach rates, and cross-sell metrics by customer cohort.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: material
    topic: sizing-conflict
    missingEvidence: A harmonized mapping of which analyst market definitions include mobile management, endpoint protection, exposure management, or workflow layers.
    whyItMatters: Public market estimates are directionally useful but not directly comparable, so valuation work can be distorted if the broadest figure is treated as canonical.
    diligencePath: Rebuild the market map with management using one chosen perimeter, then reconcile each retained analyst source back to that perimeter.
    relatedQuestionRefs:
    - QM006
    - QM009
    relatedTableRefs:
    - TM002
