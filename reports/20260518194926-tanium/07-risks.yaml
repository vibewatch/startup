    "title": "Risks",
    "summary": "Tanium's residual risk profile is concentrated in three linked areas: recurring product and patch-management burden across a broad endpoint stack, dependence on large enterprise and public-sector buying motions that are slower and less transparent than SMB software demand, and an AI-led expansion story that must prove it actually simplifies deployments before competitors use price and bundle advantage against it. Public legal exposure is not existential today, but live court history, patent assertions, and unresolved disclosure gaps keep governance and concentration diligence squarely in scope."
