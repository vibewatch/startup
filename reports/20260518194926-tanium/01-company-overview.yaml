  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: A complete 2026 board roster including all independent and investor-designated directors.
    whyItMatters: Board composition determines governance quality, control checks, and investor influence, but retained public bios only identify a subset of directors.
    diligencePath: Request the latest board roster, committee assignments, and observer rights from management or the data room.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: An exact current customer-count disclosure or another auditable public metric for total accounts.
    whyItMatters: Customer count is a core cover metric and a key input for evaluating distribution breadth, revenue concentration, and market maturity.
    diligencePath: Ask management for the current customer count and top-20 customer concentration, then reconcile it with CRM or billing-system extracts.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, revenue run-rate, growth, and retention figures from management or audited financial materials.
    whyItMatters: Later financial and valuation chapters need a current revenue anchor, but retained public sources only provide third-party estimates and no authoritative run-rate.
    diligencePath: Request the latest board deck or audited/management financial statements with ARR, revenue, gross margin, and NRR.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A current cap table showing founder, employee, and investor ownership percentages plus board-designation rights.
    whyItMatters: Ownership concentration drives governance, exit alignment, and dilution analysis, but public sources stop at investor names and round history.
    diligencePath: Request the cap table and side-letter summary under NDA, then reconcile ownership rights with board representation.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: master-data-conflicts
    missingEvidence: A single management-confirmed statement of current headquarters, operating center, and CEO title for all public properties.
    whyItMatters: Public inconsistencies across leadership and location surfaces create avoidable diligence friction and weaken confidence in other current-state claims.
    diligencePath: Ask management to identify the canonical headquarters and CEO title, then confirm those labels across the website, data providers, and any prospectus drafts.
    relatedQuestionRefs:
    - QO005
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current management-confirmed employee count and definition of who is included (full-time only, contractors, subsidiaries).
    whyItMatters: Forbes, Yahoo Finance, and ZoomInfo all imply different headcount ranges, so even simple maturity comparisons remain noisy.
    diligencePath: Ask management for the current employee count and reconcile it to payroll or HRIS data.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004-public-milestones-only
    missingEvidence: A full internal chronology covering undisclosed financings, leadership changes, product releases, and any other material adverse events not captured in public sources.
    whyItMatters: The milestone table is the chronology of record for the chapter, but it is necessarily limited to publicly visible events and may omit private but material inflections.
    diligencePath: Request a management-prepared corporate timeline and reconcile it against board materials, financing documents, and internal release histories.
    relatedQuestionRefs:
    - QO009
    - QO018
    - QO019
    relatedTableRefs:
    - TO004
