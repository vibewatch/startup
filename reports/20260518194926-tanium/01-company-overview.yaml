- id: capitalization-and-scale-signals
  title: Capitalization, valuation, and scale signals
  body: Tanium’s capital history is clearer than its current private-market metrics. The company announced an additional $150 million stock sale in October 2020, and Business Insider reported that the round valued Tanium at more than $9 billion after an earlier June 2020 Salesforce Ventures investment that the same reporting sized at $100 million. Tanium said in 2020 that total capital raised had exceeded $900 million, while CB Insights now estimates a larger $1.174 billion cumulative total and lists the company as a live secondary-market name. SEC search results also show a long Form D trail dating back to 2009, which is consistent with a heavily financed, long-duration private company. Current scale signals are directionally strong but not clean enough for precision. Forbes’ September 2025 profile lists 2,000 employees and a $9 billion valuation; Yahoo’s private-company page shows 1,001 employees and a Forge price of $5.40 as of 2026-05-15; ZoomInfo says 1K-5K employees and estimates $378.1
    million of revenue. The prudent reading is that Tanium is large, mature, and liquid enough for secondary pricing, but not transparent enough to support exact current metrics without management materials.
