    - Public NC price and AWS bundle inclusion
    - Recurring security module with regulatory tailwind
    - Show attach by vertical and renewal rate
  - - Incident / Threat Response
    - Security response module
    - Per endpoint / annual
    - Public NC prices for Incident Response and Threat Response
    - Recurring but usage-sensitive expansion path
