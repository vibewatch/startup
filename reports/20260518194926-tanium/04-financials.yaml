- id: unit-economics-and-capital-intensity
  title: Unit-economics proxies, labor base, and cost structure signals
  body: 'Tanium provides unusually good pricing clues for a private infrastructure software company but still poor direct unit-economics disclosure. The public NC module prices and AWS packaging are enough to infer premium enterprise ASPs and to compute a directional four-module software stack of about $78.30 per endpoint-year before services, cloud infrastructure, or partner margins. The 2026 Forrester TEI release adds customer-economics color: a composite 48,000-endpoint enterprise saw payback in under six months, 235% ROI, faster patching, lower MTTR, and strong software reclamation. That supports the idea that Tanium can defend premium pricing where buyers value labor savings and operational speed. The labor base also remains large. Public headcount proxies put Tanium above 2,000 employees by late 2025, with Revelio estimating 2,539 and continued job-posting growth, while Unify shows substantial Sales & Support and Engineering footprints. Against the public ~$700 million scale marker,
    that implies roughly $276,000-$350,000 in revenue per employee. The main cost-side caution is that the company is still hybrid and support-heavy rather than pure cloud, and user reviews continue to cite cost and implementation complexity.'
