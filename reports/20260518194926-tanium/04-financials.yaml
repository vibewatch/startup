- id: scale-and-valuation
  title: Revenue scale, growth markers, and valuation evidence
  body: The most important post-May-2024 evidence is that Tanium still screens as a multi-billion private company with substantial revenue scale, even though no current audited financial statements are public. Forbes reported in August 2024 that Tanium had about $700 million in sales, more than 10% free cash flow margins, EBITDA profitability, and roughly $300 million of cloud ARR growing 40% year over year. Forbes' company profile still described the business at a $9 billion valuation as of September 2025. Yahoo Finance's Forge-backed private markets page, accessed on May 15, 2026, cut that current estimate to $4.26 billion, but that still leaves a very large cushion above the user's requested $1 billion valuation floor. The problem is not whether Tanium remains a unicorn; the problem is that public datasets disagree materially on total capital raised and even on current revenue scale. That conflict does not break the valuation case, but it does reduce precision for underwriting and makes
    management-confirmed cap-table and KPI materials mandatory.
