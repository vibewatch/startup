  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: margin-and-retention
    missingEvidence: Current gross margin by cloud, on-prem, hardware, and services delivery line, plus NRR, GRR, and logo churn by cohort.
    whyItMatters: Without margin and retention data, it is impossible to judge whether Tanium deserves infrastructure-software multiples or whether hybrid delivery drags profitability.
    diligencePath: Request board KPI pack, cohort retention tables, and a product-line gross-margin bridge covering cloud, on-prem, hardware, and services.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, free-cash-flow bridge, and any debt or covenant schedule as of 2026.
    whyItMatters: Capital adequacy cannot be underwritten from valuation marks alone; liquidity and covenant visibility are required to judge downside protection.
    diligencePath: Obtain the latest management balance sheet, cash-flow statement, debt schedule, and base-case or downside runway analysis.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: An authoritative cap table and round-by-round proceeds schedule reconciling Yahoo or Forge total raised with Forbes and Latka totals.
    whyItMatters: Ownership, liquidation preferences, and dilution cannot be modeled accurately while public funding totals remain inconsistent.
    diligencePath: Request cap table, board consents, closing memos, and any tender or secondary transaction history; reconcile against each public data vendor.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: federal-revenue-mix
    missingEvidence: Federal or public-sector ARR, direct versus partner mix, and channel take-rate economics by contract vehicle.
    whyItMatters: Contract vehicles and compliance readiness show distribution access, but not how much high-quality recurring revenue is actually coming from the public sector.
    diligencePath: Request ARR, bookings, gross margin, and renewal metrics split by federal, SLED, and commercial segments, with partner margin waterfalls.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP after discounts, services attach, module attach, and renewal pricing across top customer cohorts.
    whyItMatters: Public procurement prices establish only a ceiling or floor; underwriting CAC, payback, and gross margin requires net realized pricing and attachment behavior.
    diligencePath: Review quote-to-cash exports, top-50 account pricing schedules, and renewal cohorts by module and delivery model.
    relatedQuestionRefs:
    - QI002
    - QI003
    relatedTableRefs:
    - TI001
    - TI002
