company:
  name: Tanium
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports Tanium as a late-stage, multi-product endpoint management company with roughly $700 million revenue/ARR scale, visible per-endpoint pricing in a 2025 North Carolina procurement filing, and durable federal distribution through FedRAMP and long-dated contract vehicles. Post-May-2024 valuation evidence still sits well above the user's $1 billion floor, from Forbes' $9 billion September 2025 company profile to Yahoo/Forge's $4.26 billion May 2026 secondary-market estimate. But public data remains inconsistent on revenue, total capital raised, and headcount, while gross margin, retention, cash, burn, and runway remain undisclosed, so underwriting still depends on management data-room access.
sections:
- id: revenue-model-and-pricing
  title: Revenue model, packaging, and public pricing clues
  body: 'Tanium''s monetization is visibly modular rather than monolithic. Public packaging on AWS Marketplace and the North Carolina statewide procurement filing both show a four-part structure built around Core, Endpoint Management, Risk & Compliance, and Incident Response, with additional attach modules such as Threat Response, Patch, Asset, Reveal, Deploy, and Benchmark. The strongest public price evidence is the April 1, 2025 NCDIT price list, which discloses per-endpoint NC prices for multiple modules and applies a 2,000-endpoint minimum to most software and appliance SKUs. That matters because it turns Tanium from an opaque “contact sales” SaaS into a partially observable enterprise pricing model. It also shows the company still sells hardware appliances and maintenance renewals, so the delivery model is hybrid: cloud subscriptions exist, but on-prem and hardware-backed deployments remain commercial. AWS reinforces the same structure by advertising an annual 1,500-endpoint bundle
    and contract-duration pricing, while TrustRadius'' channel scrape should be treated only as a low-confidence edge clue, not as underwriteable realized pricing.'
