- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Best public proxy today
  - Impact
  - Exact diligence path
  rows:
  - - Gross margin by cloud / on-prem / services
    - No direct disclosure
    - Cannot test quality of revenue or justify software multiple
    - Request product-line P&L and gross-margin bridge
  - - NRR, GRR, and churn
    - No direct disclosure
    - Cannot judge revenue durability or land-and-expand economics
    - Request cohort retention tables and renewal waterfalls
  - - Realized net pricing after discounting
    - NC list prices and AWS packaging only
    - Public list prices may overstate ASPs and understate services burden
    - Export quote-to-cash data and discount schedules by segment
  - - Federal / public-sector revenue mix
    - FedRAMP + contract vehicles + military/customer evidence
    - Cannot determine public-sector concentration or margin mix
    - Provide ARR, bookings, and channel margin by public-sector program
  - - Cash / burn / runway
    - No direct disclosure
    - Capital-dependency judgment remains impossible
    - Provide last twelve months of cash flow and current runway plan
  - - Total raised / cap-table reconciliation
    - $470.94M vs ~$1.1B conflict
    - Ownership and liquidation preference analysis is incomplete
    - Provide cap table, board consents, and round closing memos
  - - Customer concentration
    - Logo prestige is public; revenue share is not
    - Cannot judge account risk from marquee logos alone
    - Provide top-20 customer ARR and renewal concentration
  - - Cloud vs on-prem gross profit mix
    - ~$300M cloud ARR and still-visible appliance SKUs
    - Margin path depends on mix shift but public evidence is incomplete
    - Provide ARR, bookings, and gross profit by delivery model
  notes: Each row is a concrete underwriting blocker or uncertainty vector; the exact diligence path is deliberately operational so management can answer it with a data-room export rather than a narrative answer.
