- id: federal-and-public-sector
  title: Federal contract scale and public-sector delivery model
  body: 'Federal and broader public-sector exposure is one of Tanium''s strongest revenue-quality proxies, even though actual federal ARR is not disclosed. Carahsoft lists Tanium on NASA SEWP V through September 2026, Army ITES-SW2 through August 2030, and several state, local, and education vehicles extending into 2027-2028, which materially expands procurement reach without requiring a fresh solicitation every time. Tanium''s own cloud and defense materials add a second layer of evidence: the company markets a fully managed FedRAMP Moderate cloud for U.S. government, describes the platform as available cloud or on-prem, and says it is trusted by six branches of the U.S. Armed Forces. Those facts do not equal recognized federal revenue, but they do suggest sticky public-sector distribution, real compliance investment, and a go-to-market motion that can support long-duration contracts and partner-mediated expansion. The financial implication is favorable for retention and ASPs, but still
    incomplete until Tanium discloses what share of bookings or ARR is actually public sector, how much flows through channels, and what gross margins those deployments carry.'
