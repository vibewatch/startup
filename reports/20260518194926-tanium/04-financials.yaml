callouts:
- calloutType: strength
  title: Multiple post-2024 markers still support a multi-billion valuation
  body: The valuation debate is about where within a multi-billion range Tanium should trade, not whether it is still above the unicorn threshold. Forbes kept the company at $9 billion as of September 2025, while Yahoo/Forge still estimated $4.26 billion in May 2026.
  claimRefs:
  - CI015
  - CI016
  - CI020
- calloutType: risk
  title: Public financial datasets disagree too much for clean underwriting
  body: Revenue proxies range from $378.1 million to $700 million and total-raised figures range from $470.94 million to roughly $1.1 billion. Those conflicts do not negate scale, but they do block precise valuation work without management-confirmed materials.
  claimRefs:
  - CI033
  - CI043
  - CI048
- calloutType: risk
  title: Security and governance overhang can affect cost of scale
