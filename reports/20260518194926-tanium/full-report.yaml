            Security engineering and endpoint teams test whether Tanium can answer live questions across very large
            estates while integrating with Microsoft, ServiceNow, or existing patching and response workflows.
          touchpoints:
            - AstraZeneca, Zurich, and Phoenix references
            - Microsoft integration stories
            - PeerSpot / TrustRadius / Gartner review research
        - label: Purchase
          detail: >-
            Procurement adds ROI and buyability screens. Public-sector buyers lean on FedRAMP, GSA, DIR, and channel
            vehicles; commercial buyers weigh vendor consolidation and total-cost-of-ownership arguments.
          touchpoints:
            - Forrester TEI / Business Wire ROI proof
            - Carahsoft contract vehicles
            - Texas DIR cooperative contract
        - label: Deployment
          detail: >-
            Endpoint and security operations teams deploy Tanium where fleet scale, patch cadence, or response latency
            create value, then operationalize automations and dashboards.
