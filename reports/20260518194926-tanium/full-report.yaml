        - Standalone scanning with no operational workflow or endpoint action layer
        - CISO, vulnerability management, risk and compliance budgets
        - Fast-growing adjacent budget that Tanium can enter with the same endpoint data plane
      - - Workflow automation / autonomous operations
        - ServiceNow-linked remediation, policy workflows, AI-assisted operational actions, cross-team orchestration
        - ITSM ticketing without endpoint execution or isolated RPA with no asset context
