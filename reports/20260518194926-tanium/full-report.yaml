companyProfile:
  summary: >
    Tanium is a U.S. cybersecurity and endpoint-management company founded in 2007 by David and Orion Hindawi. The
    platform spans real-time endpoint visibility, patching, risk and compliance, incident response, and a newer AI-led
    workflow layer marketed as Atlas and Tanium Ask. Public customer proof remains strongest in very large, regulated
    environments, including Fortune 100 companies, top U.S. banks, and multiple U.S. federal and military organizations.
    Public evidence supports a business at roughly $700 million revenue or ARR scale and still well above the $1 billion
    valuation floor, but entry underwriting remains limited by sparse disclosure on current growth, margins, retention,
    burn, and the preference stack.
