        title: Platform definition and module map
        blocks:
          - type: paragraph
            body: >-
              Tanium's public product story has consolidated around Autonomous IT and Autonomous Endpoint Management
              rather than a loose menu of point tools. The common thread across official pages, AWS Marketplace
              listings, and review coverage is a workflow promise: give IT, security, and risk operators one place to
              see endpoint state, decide what matters, and take action without waiting for stale scans or a handoff to a
              separate operations console. The most concrete public packaging evidence comes from the AWS Marketplace,
              which describes the AEM stack as four solution areas—Core, Endpoint Management, Risk & Compliance, and
              Incident Response—and then details what each is supposed to do. In practice, this means Tanium is selling
              live asset visibility, patch and software execution, risk/compliance prioritization, and incident closure
              as one operational loop. The positive read is reduced tool sprawl and better coordination between IT and
              security. The caution is that the public category narrative is broader than the public module
              documentation, so diligence should distinguish marketed scope from what reference customers actually
