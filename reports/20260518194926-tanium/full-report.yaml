  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and footprint
        blocks:
          - type: paragraph
            body: >-
              Tanium presents itself in 2026 as the "Autonomous IT" company: a private platform vendor that ties
              endpoint management, exposure management, and security operations together with real-time endpoint
              telemetry and AI-led workflows. Third-party profiles and the company’s own material align on the 2007
              founding by David and Orion Hindawi, but Tanium’s geographic identity is less clean. The company’s current
              locations page labels Washington as headquarters, while SEC search results and CB Insights still surface
              Emeryville, California business or mailing addresses, and Wikipedia preserves an older Kirkland-Emeryville
              split. Product messaging is more coherent than master data. Tanium Atlas launched on 2026-05-05 as a new
              autonomous operating system on top of the broader platform, and Morningstar’s republication of the launch
              release repeated Tanium’s claim that the platform now captures signals across more than 36 million
              endpoints. Customer proof is strong in names rather than count: Best Buy and the U.S. Navy have public
              case-study pages, and the company also markets directly to federal agencies.
