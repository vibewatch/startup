              shows only four repositories and one clearly non-core workflow tool, octobot. That combination implies
              Tanium is integration-friendly but not open-source-led. The deeper proof comes from partner documentation.
              Microsoft's Azure Sentinel connector depends on Tanium Connect and Azure Logs Ingestion Workspaces, so the
