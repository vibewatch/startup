      - number: '8.3'
        title: Comparable set and entry-discipline logic
        blocks:
          - type: paragraph
            body: >-
              The public comparable set argues for discipline, not disbelief. Mature security names such as Tenable and
              Qualys trade around 2.5x to 5.2x market cap to revenue, while SentinelOne sits near 6.0x. Hypergrowth
              platform names such as CrowdStrike and Palo Alto Networks command far richer multiples because they have
              cleaner disclosure, larger scale, or both. Private comparables sit even higher when growth is exceptional:
              NinjaOne’s disclosed numbers imply about 10x ARR, Axonius around 13x on its 2025 ARR projection, and Wiz
              less than 24x on a still-hypergrowth cloud-security profile.


              Against that backdrop, Tanium’s current 6.1x proxy on the stale Forbes 2024 ARR anchor looks much closer
              to the mature-public range than to hypergrowth private or public premiums. That is why the current
              secondary-style mark is easier to defend than the legacy $9 billion framing. A 12.9x proxy is not
              impossible for a sticky, profitable, enterprise platform with government exposure and AI leverage, but it
              requires proof that Tanium’s growth, margins, and product momentum have held up since the 2024 Forbes
              article. Without that proof, investors should not underwrite Tanium like CrowdStrike, Wiz, or a
              fresh-growth private round.
