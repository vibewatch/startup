      - number: '1.4'
        title: Milestones, federal posture, and adverse history
        blocks:
          - type: paragraph
            body: >-
              Tanium’s milestone record mixes durable product relevance with real governance and reputational scar
              tissue. The company paired a Salesforce partnership with 2020 fundraising, added former Ford CEO Mark
              Fields to the board in September 2020, and completed the Streetman CEO transition in February 2023. Its
              federal posture strengthened materially in November 2023 when Tanium Cloud for U.S. Government received
              FedRAMP Moderate authorization; the related Business Wire release also claimed support across five
              Department of Defense branches, civilian agencies, and more than 70% of the Fortune 100. In May 2026,
              Tanium used ServiceNow Knowledge to launch a joint autonomous IT solution and then introduced Tanium Atlas
              as the flagship AI operating layer. Those positives sit beside older adverse history that still matters in
              diligence. Bloomberg-syndicated 2017 reporting said Tanium used El Camino Hospital’s network in live demos
              without permission, and separate syndicated reporting alleged pre-vesting terminations under Orion
              Hindawi, which Tanium denied. More recently, the Ninth Circuit revived an employee stock-value
              misrepresentation case in 2024, showing that governance and equity-treatment scrutiny has not disappeared.
