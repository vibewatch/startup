  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Tanium should not be analyzed as a pure mobile-device-management vendor or as a pure endpoint-protection
              vendor. Its own platform, endpoint-management, exposure-management, and autonomous-endpoint-management
              materials describe a unified control plane that combines endpoint management, asset discovery and
              inventory, vulnerability prioritization, remediation, and workflow automation. The most defensible market
              boundary therefore starts with enterprise endpoint control and asset visibility, then extends into
              exposure management where the same endpoint telemetry is used to score and remediate risk. That boundary
              is reinforced by Tanium’s ServiceNow integration, which explicitly ties endpoint data into CMDB and
              workflow automation, and by Carahsoft’s public-sector packaging, which presents asset inventory, endpoint
              management, incident response, and exposure management as one government control stack. The main excluded
              spend buckets are pure MDM or MAM deployments, network-only zero-trust tools, and standalone
              endpoint-protection suites when buyers are not trying to consolidate control and remediation. Microsoft
              Intune remains the clearest status-quo substitute on the endpoint-management side, while EPP and
              vulnerability-management incumbents own adjacent budgets that Tanium is trying to collapse into a broader
              autonomous-operations story.
            claimRefs:
