      - number: '7.2'
        title: >-
          Legal and regulatory posture: no visible existential case, but public litigation and compliance burden remain
          decision-relevant
        blocks:
          - type: paragraph
            body: >-
              The legal picture is not catastrophic, but it is far from empty. The Howard matter shows that Tanium's
              historical equity and recruiting communications produced a live fraud dispute that survived appeal,
              remained headed toward jury trial in 2025, and only later ended through dismissal. That history does not
              prove current misconduct, but it does mean governance around offer communications and equity-value
              language is a real diligence topic rather than a hypothetical one. The QuickVault patent action matters
              for a different reason: it directly targeted Tanium's XEM platform and also swept in enterprise users,
              which is exactly the kind of customer-adjacent IP exposure that can complicate commercial relationships
              even when cases end without a merits ruling. Regulatory exposure is subtler. Tanium is visibly active in
              public-sector channels and increasingly pushing AI-led operations into regulated environments. No retained
              source shows a current enforcement action, yet the combination of federal procurement exposure,
              regulated-customer mix, and new automated workflows means compliance maintenance should be treated as a
              continuing operating burden rather than as a box already checked.
