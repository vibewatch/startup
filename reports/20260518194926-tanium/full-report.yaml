  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Refreshed ARR disappointment
        - 2025-2026 ARR materially below the 2024 ~$700M public anchor
        - Breaks the current multiple framework and makes even the secondary estimate look too generous.
        - Downgrade to avoid or demand a much lower entry price.
      - - Weak unit economics
        - NRR or gross margin materially below best-in-class software norms
        - Removes the case for any premium versus mature public-security comps.
        - Shift valuation toward the bear range.
      - - Preference overhang
        - Cap-table waterfall leaves limited common-equity value near ~$4B-$5B exits
        - Turns a fair enterprise value into poor equity returns.
        - Require structure change or walk away.
      - - Governance / litigation escalation
        - Howard-like governance issues expand or new equity disputes emerge
        - Widens discounting, hurts recruiting, and reduces confidence in internal controls.
        - Pause investment until legal / governance remediation is clear.
      - - Operational / security overhang
        - Material product-security issue or slow remediation on core modules
        - Undercuts the platform-premium thesis and harms public-sector trust.
        - Reduce target multiple and tighten downside assumptions.
    notes: >-
      Triggers are monitorable diligence thresholds rather than generic risks; each one links directly to valuation
      compression or common-equity impairment.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV057
      - CV061
      - CV062
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue quality
        - 2025-2026 ARR, growth, NRR, and gross margin by major product family
        - Separates fair-secondary from stretched-premium outcomes.
        - CFO data room, board pack, or audited management accounts.
      - - Capital structure
        - Fully diluted cap table, preference stack, any ratchets, and secondary terms
        - Determines whether common-equity value survives at plausible exit prices.
        - Legal + finance review of financing docs and 409A materials.
      - - Cash sufficiency
        - Cash balance, monthly burn, and hiring / cloud-infrastructure cost plan
        - Prevents overpaying for a business that may still need dilutive capital.
        - Controller cash-bridge and operating-plan review.
      - - Customer durability
        - Top-customer concentration, public-sector mix, and renewal / expansion by cohort
        - Tests whether government and large-enterprise stickiness really supports a premium multiple.
        - Sales / FP&A cohort cuts and procurement concentration review.
      - - Liquidity path
        - Tender history, current secondary-clearing evidence, and IPO / sale readiness materials
        - Recommendation strength depends on how capital can realistically be returned.
        - Board / banker materials plus brokered-secondary data.
    notes: >-
      These asks are the minimum package required before paying above current secondary-style levels. Missing items are
      not cosmetic; they determine whether a multi-billion headline value is actually investable.
    claimRefs:
      - CV057
      - CV059
      - CV061
      - CV063
