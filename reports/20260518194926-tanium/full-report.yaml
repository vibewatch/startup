        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public case for Tanium is directionally strong: the company appears large, enterprise-focused, and
              still worth several billion dollars on every usable post-May-2024 valuation marker. Public procurement
              documents show real monetization detail; federal artifacts show durable public-sector relevance; and
              customer-value studies plus hiring data suggest Tanium is still investing for scale rather than harvesting
              a shrinking franchise. The investment problem is precision, not existence. Revenue proxies disagree,
              total-raised figures disagree, and there is no public visibility into gross margin, NRR, customer
              concentration, cash, burn, or runway. Recent security advisories and the Howard litigation also mean
              investors cannot treat Tanium as a purely clean software comp with no governance or product-risk overhang.
              My financial verdict is therefore positive on scale, revenue quality, and long-term valuation floor, but
              incomplete on true margin path and capital sufficiency. The correct next step is not to debate whether
