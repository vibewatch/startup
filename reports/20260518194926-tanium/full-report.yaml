  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment thesis
        blocks:
          - type: paragraph
            body: >-
              Tanium is no longer a valuation mystery in one narrow sense: post-May-2024 public evidence clearly says it
              remains far above the unicorn threshold. Forbes still described the company at $9 billion in September
              2025, while Yahoo Finance’s Forge-backed private-market page estimated $4.26 billion as of May 15, 2026.
              Those marks are far apart, but they point in the same direction on the user’s key question: Tanium is
              still a multi-billion-dollar private company. The real debate is therefore not whether Tanium clears $1
              billion, but which price band is supportable without fresh management disclosure.


              The recommendation is track / research-more with conditional interest at current secondary-style levels
              rather than legacy round nostalgia. Public evidence supports a fair reading if an investor can enter near
              the current secondary estimate and confirm that the 2024 Forbes operating profile still broadly holds.
              Public evidence does not support paying the old $9 billion framing as if it were still a clean clearing
              price. The anti-thesis is opacity: the public record still lacks a refreshed ARR bridge, retention, gross
              margin, cash-burn detail, and the preference waterfall that determines whether common-equity returns are
              actually attractive.
            claimRefs:
              - CV006
