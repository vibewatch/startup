        - Important expansion layer because Tanium is positioning toward autonomous operations, not just visibility
      - - Public-sector cyber hygiene / zero-trust programs
        - Agency zero-trust migrations, cyber hygiene scanning, vulnerability reduction, regulated endpoint control
        - Network-only zero-trust, advisory-only programs, one-off compliance consulting
