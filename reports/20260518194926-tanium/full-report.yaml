  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Tanium's public product stack layers patented endpoint communications beneath module workflows, integrations, and
      the 2026 AI surface.
    approximationNotes: >-
      Layers are functional, not literal deployment boundaries. Partner systems such as ServiceNow and Sentinel appear
      where they materially alter workflow or data movement.
