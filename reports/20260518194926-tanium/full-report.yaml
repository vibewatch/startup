      - number: '8.2'
        title: Why the valuation floor still sits well above $1 billion
        blocks:
          - type: paragraph
            body: >-
              The strongest floor evidence is the combination of late-stage operating scale, public pricing, and
              continued secondary-market support. Forbes’ August 2024 reporting painted a company that had already
              passed $700 million of ARR, achieved free-cash-flow margins north of 10%, turned EBITDA-profitable, and
              built a $300 million cloud ARR stream that was growing 40% year over year. That is not sub-unicorn
              operating scale. The same article said Tanium secured 32 million employee devices; by the May 2026 Atlas
              launch, the company was claiming more than 36 million endpoints. North Carolina’s 2025 price list and AWS
              Marketplace bundle show that Tanium still sells premium, multi-module enterprise offerings at scale, while
              Carahsoft’s contract catalog shows durable government procurement reach into 2026 and 2030 windows.


              Taken together, those signals matter more than the absence of a fresh priced round. A company with
              multi-hundred-million recurring revenue, positive cash generation, deep public-sector access, and real
              secondary-market quoting does not need a 2025 primary financing event to prove it is still a unicorn. The
              public record does, however, show that the old $9 billion mark and the current $4.26 billion estimate
              should be treated as different valuation regimes rather than interchangeable facts.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
