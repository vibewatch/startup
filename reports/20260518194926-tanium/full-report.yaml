      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Tanium’s leadership story is strong on founder continuity but messy on current-state consistency. Dan
              Streetman’s current biography and Yahoo Finance’s private-company profile both identify him as CEO, and
              the February 2023 transition announcement clearly said that Streetman would become CEO while Orion Hindawi
              would move to executive chairman and David Hindawi would become chairman emeritus. Yet Orion Hindawi’s own
              current bio still says he serves as CEO, creating an avoidable governance-data inconsistency on the
              company’s own site. Founder influence remains material regardless of which title is canonical: David and
              Orion both remain in senior governance roles, and investor or independent directors such as Mark Fields,
              Tim Millikin, and Maggie Wilderotter add operating and capital-markets experience around them. Marc
              Levine’s current CFO role also matters because Tanium is still private, metrics are sparsely disclosed,
              and the company’s next financing or liquidity event would likely depend heavily on financial discipline
              and board alignment.
