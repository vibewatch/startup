  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold/event
      - action implication
    rows:
      - - Security defect cadence
        - Repeated multi-module advisories affecting privilege, tokens, or core server functions
        - Two or more material advisories in a quarter or a defect requiring broad credential rotation
        - >-
          Treat platform-risk assumptions as worsening and ask for patch adoption, incident counts, and customer
          exposure by module before underwriting upside.
      - - Large-estate deployment friction
        - Implementation timelines stretch and policy or patch complaints persist in large environments
        - >-
          A new flagship deployment takes more than six months to stabilize or review signals show recurring
          policy-latency and support issues
        - Cut operating-leverage assumptions and require services burden, support SLA, and customer-reference evidence.
      - - Public-sector concentration
        - Federal vehicle lapse or visible budget squeeze
        - Loss of a key procurement path, delayed appropriations, or an abrupt slowdown in public-sector bookings
        - Reduce conviction on growth durability unless commercial diversification and renewal breadth are demonstrated.
      - - Competitive bundle and pricing pressure
        - Repeated losses or discounting against Microsoft, CrowdStrike, or BigFix
        - Evidence that bundled rivals win on easier deployment, lower TCO, or deeper platform coverage
        - Lower expected close rates and gross margin, and re-test the case against a more conservative pricing curve.
      - - AI and autonomous-operations execution
        - New AI features fail to simplify real deployments
        - Low adoption, heavy services requirements, or customer skepticism that AI capabilities reduce manual work
        - Move AI upside into the watchlist rather than the base case until adoption and monetization data improve.
    notes: >-
      These triggers are designed to be monitorable from future advisories, procurement records, reviews, product
      announcements, and management diligence responses rather than from intuition.
