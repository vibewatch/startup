    data:
      layers:
        - id: L1
          label: Endpoint estate and clients
          detail: >-
            Managed laptops, servers, cloud workloads, and other endpoints provide the raw state that Tanium wants to
            query, patch, and remediate. The public story assumes broad endpoint coverage as the starting point for
            every other module.
          tone: neutral
        - id: L2
          label: Patented communications layer
          detail: >-
            Tanium's linear-chain communications model moves questions, packages, and actions across peer chains to
            reduce WAN pressure and improve distribution speed relative to hub-and-spoke designs.
          tone: positive
        - id: L3
          label: Core data and control plane
          detail: >-
            Core maintains the real-time state, policy coordination, and single-source-of-truth narrative that powers
            visibility, orchestration, and integrations across cloud and on-prem deployments.
          tone: positive
        - id: L4
          label: Operational solution areas
          detail: >-
            Public AEM packaging groups capabilities into Endpoint Management, Risk & Compliance, and Incident Response
            on top of Core, with Patch remaining a visible named workflow inside the broader endpoint-management layer.
          tone: positive
        - id: L5
          label: Integration and AI action layer
          detail: >-
            ServiceNow, Microsoft Sentinel, APIs, MCP exposure, Tanium Ask, and Atlas sit above the control plane to
            move context into CMDB, SIEM, and AI-guided remediation workflows.
          tone: neutral
