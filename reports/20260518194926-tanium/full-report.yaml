      - number: '2.2'
        title: Market Sizing With Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The public market data does not support one single Tanium TAM number. Analyst baselines for unified
              endpoint management alone range from Mordor Intelligence’s $8.85B 2026 market to The Business Research
              Company’s $22.75B 2026 market, while Technavio frames the same category as $11.365B of added revenue from
              2026 to 2030 and Grand View’s older series starts from a much smaller 2022 base. Adjacent categories are
              also large: Fortune Business Insights places endpoint protection at $21.64B in 2026, exposure management
              at $5.08B in 2026, and attack-surface management at $1.25B in 2026; TBRC puts security and vulnerability
              management at $15.93B in 2026. Those lenses cannot simply be added because the same enterprise account may
              buy overlapping control, inventory, and remediation capabilities from one platform budget. A more
              evidence-constrained serviceable wedge is the large-enterprise-heavy portion of UEM: applying Mordor’s
              71.62% large-enterprise share to its 2026 UEM baseline yields a floor of about $6.34B, while the same
              logic on TBRC’s 2026 UEM baseline yields a high-case ceiling of about $16.29B. That still excludes any
              clean public SOM because Tanium does not disclose segment revenue or share by product line in public
              sources.
