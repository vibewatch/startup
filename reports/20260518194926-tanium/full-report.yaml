      - number: '8.4'
        title: Bull, base, and bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be anchored to public evidence and explicit about what is still missing. The
              bear case assumes the 2024 Forbes revenue profile has not grown much, the market applies a mature-public
              multiple closer to Tenable or Qualys, and governance or security overhang widens the discount. That gets
              Tanium toward roughly $3 billion to $4 billion, which still clears the unicorn floor but offers limited
              upside from today’s secondary-style pricing.


              The base case assumes Tanium broadly maintained its 2024 scale, kept the business profitable enough to
              avoid distress, and harvested some value from Atlas, ServiceNow, and government stickiness without proving
              a full reacceleration. That points to about $4.5 billion to $6.0 billion, which is close enough to the
              Yahoo / Forge estimate to support a fair stance. The bull case requires more than narrative. To defend
              $7.5 billion to $9.5 billion, Tanium must show refreshed ARR growth, durable margins, and evidence that
              customers still pay a platform premium instead of treating endpoint management as a bundleable cost
              center. In other words, the old $9 billion framing is a conditional upside case, not the default base
              case.
            claimRefs:
              - CV023
              - CV024
