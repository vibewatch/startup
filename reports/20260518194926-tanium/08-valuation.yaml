  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: private-cyber-comparable-set
    missingEvidence: A fuller refreshed set of private cybersecurity comparables with disclosed 2025-2026 ARR and valuation marks, especially for other endpoint-management and cyber-asset platforms.
    whyItMatters: The comparable valuation table is intentionally partial because most late-stage private peers still disclose valuation more often than current revenue, which limits clean multiple matching.
    diligencePath: Request current management-bank or broker screens covering secondary trades, recent late-stage marks, and ARR ranges for the closest private peers before final IC pricing.
    relatedQuestionRefs:
    - QV019
    - QV020
    - QV021
    - QV022
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-margins
    missingEvidence: Current 2025-2026 ARR, growth, NRR, gross margin, and cash-flow bridge from management or audited materials.
    whyItMatters: The public multiple framework rests on a stale 2024 Forbes anchor; without refreshed KPIs the difference between fair and stretched could be multiple billions of dollars.
    diligencePath: Obtain the latest board package, operating plan, and CFO KPI dashboard with revenue, cohort retention, gross margin, and cash-burn detail.
    relatedQuestionRefs:
    - QV027
    - QV031
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Fully diluted cap table, preference terms, employee common dilution, and any recent secondary or tender terms.
    whyItMatters: A headline enterprise value does not tell investors what common equity is worth if senior preferences, ratchets, or structured secondary terms absorb exit proceeds.
    diligencePath: Review the current cap table, financing documents, 409A materials, and any 2024-2026 secondary transaction summaries with counsel and finance leads.
    relatedQuestionRefs:
    - QV030
    - QV031
    - QV032
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-exit-timing
    missingEvidence: Board-approved exit timeline, actual IPO readiness metrics, and current secondary liquidity data beyond platform estimates.
    whyItMatters: Recommendation quality depends on whether the next realistic liquidity event is a broad tender, continued secondary trading, a strategic sale, or a delayed IPO.
    diligencePath: Request board minutes or banker materials on IPO timing, tender plans, and contingency sale scenarios; compare them against actual secondary-clearing activity.
    relatedQuestionRefs:
    - QV032
