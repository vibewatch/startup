- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue quality
    - 2025-2026 ARR, growth, NRR, and gross margin by major product family
    - Separates fair-secondary from stretched-premium outcomes.
    - CFO data room, board pack, or audited management accounts.
  - - Capital structure
    - Fully diluted cap table, preference stack, any ratchets, and secondary terms
    - Determines whether common-equity value survives at plausible exit prices.
    - Legal + finance review of financing docs and 409A materials.
  - - Cash sufficiency
    - Cash balance, monthly burn, and hiring / cloud-infrastructure cost plan
    - Prevents overpaying for a business that may still need dilutive capital.
    - Controller cash-bridge and operating-plan review.
  - - Customer durability
    - Top-customer concentration, public-sector mix, and renewal / expansion by cohort
    - Tests whether government and large-enterprise stickiness really supports a premium multiple.
    - Sales / FP&A cohort cuts and procurement concentration review.
  - - Liquidity path
    - Tender history, current secondary-clearing evidence, and IPO / sale readiness materials
    - Recommendation strength depends on how capital can realistically be returned.
    - Board / banker materials plus brokered-secondary data.
  notes: These asks are the minimum package required before paying above current secondary-style levels. Missing items are not cosmetic; they determine whether a multi-billion headline value is actually investable.
