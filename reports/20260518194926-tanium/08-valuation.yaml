- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Refreshed ARR disappointment
    - 2025-2026 ARR materially below the 2024 ~$700M public anchor
    - Breaks the current multiple framework and makes even the secondary estimate look too generous.
    - Downgrade to avoid or demand a much lower entry price.
  - - Weak unit economics
    - NRR or gross margin materially below best-in-class software norms
    - Removes the case for any premium versus mature public-security comps.
    - Shift valuation toward the bear range.
  - - Preference overhang
    - Cap-table waterfall leaves limited common-equity value near ~$4B-$5B exits
    - Turns a fair enterprise value into poor equity returns.
    - Require structure change or walk away.
  - - Governance / litigation escalation
    - Howard-like governance issues expand or new equity disputes emerge
    - Widens discounting, hurts recruiting, and reduces confidence in internal controls.
    - Pause investment until legal / governance remediation is clear.
  - - Operational / security overhang
    - Material product-security issue or slow remediation on core modules
    - Undercuts the platform-premium thesis and harms public-sector trust.
    - Reduce target multiple and tighten downside assumptions.
  notes: Triggers are monitorable diligence thresholds rather than generic risks; each one links directly to valuation compression or common-equity impairment.
