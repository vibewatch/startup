- id: thesis-breaks-and-final-diligence
  title: Thesis-breaks, exit readiness, and final diligence asks
  body: |-
    The biggest valuation risks are not market-category risks alone; they are also disclosure and governance risks. Howard v. Tanium keeps employee-equity valuation practices in the diligence file, and the 2026 product advisory reminds investors that execution risk still matters even for a scaled platform. More importantly, the public record does not yet answer the questions that determine common-equity value: current ARR and NRR, gross margins, cash burn, the preference stack, and whether any 2024-2026 secondary transactions actually clear near the published estimates.

    That uncertainty also limits exit underwriting. Forbes reported in August 2024 that Tanium felt comfortable staying private and did not treat an IPO as top of mind, so investors should not assume near-term liquidity. A constructive view therefore has explicit kill triggers: materially lower refreshed ARR than the 2024 anchor, a preference stack that absorbs value near the current secondary range, or further governance/security issues that widen the discount. Until those issues are resolved, the right stance is to keep Tanium on the board, not to pay the legacy mark as if public-quality disclosure already existed.
