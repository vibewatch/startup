- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Operating scale
    - Forbes’ 2024 profile shows ~$700M ARR, EBITDA profitability, and >10% FCF margin.
    - Those figures are not refreshed in audited 2025-2026 public materials.
    - Release a current ARR / margin bridge and audited operating metrics.
  - - Market relevance
    - 36M+ endpoint telemetry, public-sector contracts, and ServiceNow / Microsoft-adjacent positioning support platform relevance.
    - Endpoint management can still be treated as a bundled or lower-multiple category if growth cools.
    - Show durable expansion, large-enterprise win rates, and attach-rate evidence for Atlas / AEM.
  - - Valuation floor
    - Forbes 2025 and Yahoo / Forge 2026 both keep Tanium well above $1B.
    - The range between ~$4.26B and $9B is too wide to ignore.
    - Provide management-approved valuation materials or fresh secondary-clearing evidence.
  - - Governance / risk
    - The business looks mature enough to absorb ordinary execution risk.
    - Howard v. Tanium and the 2026 advisory keep governance and product risk in the file.
    - Close the litigation cleanly and demonstrate a stable control environment.
  - - Liquidity
    - Secondary-market support and scale imply that liquidity paths exist.
    - No fresh IPO file, tender disclosure, or detailed cap-table waterfall is public.
    - Share banker, tender, or board materials on realistic liquidity timing.
  notes: Thesis and anti-thesis are framed only from retained public evidence; missing private-company disclosures are treated as explicit diligence asks rather than guessed away.
