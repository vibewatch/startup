  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-certification-scope
    missingEvidence: Current public documentation that clearly enumerates Tanium commercial-cloud certifications and control scope (for example SOC 2, ISO, FIPS, regional boundaries, and service inclusions).
    whyItMatters: The chapter can confirm FedRAMP Moderate for TC-USG, but buyers still need readable evidence for the broader trust posture of the commercial platform they are more likely to deploy.
    diligencePath: Request the Tanium trust package or current security one-pager, then map named controls and certificates to the exact commercial services in scope.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: independent-performance-benchmarks
    missingEvidence: Independent benchmark data for patch-success uplift, CPU impact during scanning or patching, and query latency at large fleet sizes.
    whyItMatters: Vendor and marketplace claims are directionally strong, but independent load-testing is required before underwriting Tanium as the automation control plane for very large estates.
    diligencePath: Ask for recent benchmark decks, reference-customer metrics, and representative fleet telemetry segmented by endpoint count, package size, and scan intensity.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE002
    - TE003
  - type: access-blocked
    severity: material
    topic: atlas-and-ask-guardrails
    missingEvidence: Publicly readable technical documentation for Tanium Atlas and Tanium Ask permissions, model routing, auditability, and workflow guardrails.
    whyItMatters: The AI narrative is central to the roadmap, but investors still need to know what actions are gated, what data leaves the platform, and how human approval works before treating Atlas as production-ready autonomy.
    diligencePath: Request customer documentation or product demos that show Atlas and Tanium Ask permissioning, approval workflows, audit logs, and data-retention settings.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: microsoft-action-matrix
    missingEvidence: A public Microsoft-authored action matrix that goes beyond Sentinel ingestion to show what Tanium can read, write, or automate across the broader Microsoft ecosystem.
    whyItMatters: Current public evidence confirms log ingestion and ecosystem alignment, but it does not fully answer how much of the Microsoft workflow is native versus connector-based.
    diligencePath: Ask for current Microsoft integration documentation, supported actions by module, and licensing prerequisites for any Secure Exchange or Now Assist-style workflows.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: customer-time-to-value
    missingEvidence: Recent named customer evidence that quantifies deployment time, patch-success gains, or MTTR improvements at Tanium's largest endpoint scales.
    whyItMatters: Public reviews show both strong value and meaningful complexity, so quantified customer outcomes are needed to separate enterprise-scale fit from enterprise-scale burden.
    diligencePath: Request 2025-2026 reference calls or case studies segmented by endpoint count, module mix, and deployment model.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
