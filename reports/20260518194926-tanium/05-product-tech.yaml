  - FE001
  - FE003
- id: ecosystem-developer-surface
  title: Integrations and developer surface
  body: 'Tanium''s ecosystem is more real than its modest open-source footprint might suggest. The company exposes a public developer portal, API onboarding, and a developer community, while its public GitHub organization shows only four repositories and one clearly non-core workflow tool, octobot. That combination implies Tanium is integration-friendly but not open-source-led. The deeper proof comes from partner documentation. Microsoft''s Azure Sentinel connector depends on Tanium Connect and Azure Logs Ingestion Workspaces, so the integration is operationally meaningful but still connector-based. ServiceNow goes further: the Tanium Service Graph Connector expects Tanium Cloud asset views, writes CMDB and software-install records, and manages its own token-authentication and rotation logic. A dedicated Tanium SDK listing in the ServiceNow Store reinforces that these workflows are productized. The key diligence nuance is that many high-value actions still depend on partner systems—CMDB,
    SIEM, Now Assist, or ticketing layers—rather than on native Tanium enforcement alone.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE040
  tableRefs: []
  figureRefs: []
- id: ai-roadmap
  title: AI features and roadmap surface
  body: 'Tanium''s 2026 product roadmap pushes beyond autonomous endpoint management into a broader autonomous-IT operating model. Public press and independent coverage describe Atlas as an autonomous operating system that turns one operator''s intent into guided action inside a governed experience. The important technical details are not the marketing adjectives but the architecture claims attached to Atlas: dynamic page generation, ambient agents, an ensemble of frontier models, and a data layer that Tanium says covers more than 36 million endpoints and is exposed through open APIs and MCP. Channel Insider adds a more practical lens by describing Tanium Ask as the first agentic AI layer for data discovery, software management, summarization, documentation, and security triage, plus a Tanium AI Agent for ServiceNow that can pull endpoint context into Now Assist and trigger actions from chat. The roadmap is directionally compelling, but the public technical documentation for guardrails,
    permissions, and approval boundaries is still thinner than the launch narrative.'
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
