- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Key dependency
  - Technical risk
  rows:
  - - Tanium clients plus linear-chain communications
    - Gather current endpoint state and propagate questions, packages, and actions through peer chains
    - Endpoint reachability, local network topology, and chain health
    - Heavy reliance on communications efficiency means misconfigured networks can erode the value proposition
  - - Tanium Server / Cloud control plane
    - Coordinates policies, connections, integrations, and user workflows
    - Cloud or on-prem control-plane availability; outbound client connectivity to Tanium Cloud port 17472
    - Operational failures at the control plane affect multiple solution areas at once
  - - Core data layer
    - Maintains the real-time state and single-source-of-truth narrative used by other modules
    - Telemetry completeness from managed endpoints and permissioned access to asset views
    - Independent public proof for state freshness and accuracy is limited
  - - Endpoint Management workflow layer
    - Runs provisioning, patching, software deployment, policy enforcement, and performance workflows
    - Module entitlements, package quality, and chain bandwidth behavior
    - Marketplace and review evidence shows learning-curve and performance-risk tradeoffs during intensive operations
  - - Risk & Compliance layer
    - Aggregates vulnerability, compliance, and sensitive-data findings and claims runtime SBOM
    - Finding quality, rules content, and downstream remediation processes
    - Public docs do not fully expose model logic, commercial trust scope, or benchmarked remediation outcomes
  - - Integration layer (Connect, ServiceNow, Sentinel)
    - Moves data and actions into CMDB, SIEM, ITSM, and chat-based workflows
    - Partner APIs, token auth, custom views, and connector maintenance
    - High-value automations are often connector-dependent rather than fully native
  - - AI / Atlas layer
    - Adds Tanium Ask, ambient agents, model ensemble routing, and AI-guided action orchestration
    - Open APIs, MCP exposure, model providers, and governance controls
    - Launch narrative is strong, but public docs on permissions and guardrails are still limited
  notes: Risk language separates direct evidence from analyst inference. Dependencies listed here are only those directly visible in public docs and partner setup guides.
