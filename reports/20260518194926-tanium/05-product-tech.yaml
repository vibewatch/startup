- id: trust-risks
  title: Trust, compliance, and technical risks
  body: Tanium's public trust signal is strongest in federal deployment evidence and weakest in readable commercial-cloud control detail. The company can point to a live FedRAMP Marketplace listing for TC-USG at Class C Moderate, and the federal authorization is corroborated by Tanium's own announcement. The product-risk picture, however, is more mixed. Tanium maintains a public advisory portal and disclosed a steady stream of 2026 issues across multiple modules, including Asset, Interact, Discover, Threat Response, TanOS, and Patch Endpoint Tools. The specific SQL-injection issue in Asset (CVE-2026-2435) was medium severity and required authenticated permissions, so it is not existential, but it is a reminder that Tanium's increasingly broad control plane expands the attack and maintenance surface. Independent users also repeatedly flag UI complexity, integration friction, deployment burden, and price. That does not negate Tanium's value at enterprise scale, but it does mean the product
    can be operationally demanding even when the technical vision is sound.
  claimRefs:
  - CE021
  - CE022
  - CE024
  - CE025
  - CE026
