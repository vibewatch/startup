- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Core
    - IT operations, security operations, risk teams
    - Established public packaging inside AEM
    - Patented real-time data layer and single-source-of-truth positioning for endpoint state
    - Need independent latency and resource-usage benchmarks at large fleet sizes
  - - Endpoint Management
    - Endpoint engineering, workplace IT
    - Established public packaging inside AEM
    - Cross-platform provisioning, patching, third-party software deployment, policy enforcement, and performance monitoring from one console
    - Public evidence is still stronger on breadth than on comparative depth versus specialist UEM tools
  - - Risk & Compliance
    - CISO, GRC, vulnerability teams
    - Established public packaging inside AEM
    - Real-time risk scoring, compliance configuration, sensitive-data findings, and runtime SBOM claims
    - Commercial-cloud certification scope and independent validation of risk-prioritization accuracy remain thin
  - - Incident Response
    - SOC, IR teams
    - Established public packaging inside AEM
    - Single-tool journey from incident detection to remediation that augments existing EDR and SIEM
    - Need clearer public documentation on where native action ends and partner tooling begins
  - - Atlas / Tanium Ask / AI Agent for ServiceNow
    - Platform admins, security operators, service desk
    - New 2026 launch surface
    - Agentic workflows, dynamic pages, ambient agents, Now Assist embedding, and model-agnostic endpoint context
    - Guardrails, approval boundaries, and production-readiness evidence are not yet well documented publicly
  notes: Status labels are based on public packaging and launch evidence, not private usage data. AI rows represent 2026 launch surface rather than long-running GA maturity.
