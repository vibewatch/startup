- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Tanium moat / risk
  - Why it matters
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Real-time live-query architecture
    - Differentiates Tanium from scheduled-scan and lighter UEM tooling in incident response, compliance, and large-fleet remediation
    - BigFix narrows the gap on enterprise patching; security-first platforms add real-time remediation around a different center of gravity
    - high
    - Validate how often live-state workflows directly drive win rates, renewal, or tool consolidation in large accounts
  - - Unified IT + security control plane
    - Lets Tanium compete as a replacement for multiple tools rather than just another UEM product
    - CrowdStrike, SentinelOne, and Qualys are moving enough remediation and exposure management into security platforms to steal budget
    - high
    - Obtain product-usage and module-attach data showing whether customers actually consolidate onto Tanium
  - - Federal and regulated-enterprise credibility
    - Supports access to agencies and tightly controlled estates that do not buy purely on SMB-style friction
    - Microsoft and SentinelOne have strong government deployment stories; Ivanti also markets FedRAMP-certified federal delivery
    - medium
    - Check recent federal pipeline quality, competitive mix, and whether FedRAMP meaningfully changes close rates
  - - Pricing opacity
    - Opaque pricing weakens Tanium against public price anchors such as Intune and Automox
    - Buyers can solve part of the job with lower-friction and more transparent alternatives
    - high
    - Request current list-to-net pricing bands and discount discipline by segment
  - - Deployment and admin complexity
    - Retained reviews consistently present Tanium as powerful but heavier to deploy and staff than cloud-native challengers
    - NinjaOne, Automox, and Atera win by promising fast onboarding and simpler day-2 operations
    - high
    - Measure time-to-value, admin headcount, and professional-services dependence versus peers
  - - Microsoft bundle floor
    - Bundled Intune constrains Tanium in accounts already committed to Microsoft 365
    - Even if Tanium is technically stronger, bundle economics can prevent displacement
    - high
    - Review win/loss by Microsoft 365 penetration, especially in accounts led by workplace or endpoint teams
  notes: Severity reflects the likelihood that the named threat can erode Tanium’s value capture or displacement rate in the next 12-24 months based on retained public evidence. It is not a statement about current customer churn.
