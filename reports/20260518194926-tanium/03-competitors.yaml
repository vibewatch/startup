  rows:
  - - Tanium
    - Custom enterprise quote
    - No retained public list price
    - Broad endpoint management, live query, exposure and remediation workflows
    - Independent sources consistently cite higher setup cost and heavier operating model; retained source set lacks public price card
    - Strong fit where buyers value real-time control enough to tolerate opaque pricing
  - - Microsoft Intune
    - Per user / suite bundle
    - $8 Plan 1; $4 Plan 2 add-on; $10 Intune Suite add-on
    - Core UEM plus add-on advanced endpoint/security capabilities
    - Pricing is public and often already embedded in Microsoft 365 subscriptions
    - Sets the category price floor in Microsoft-standardized accounts
  - - Ivanti Neurons for UEM
    - Quote-based enterprise pricing
    - No retained public list price
    - Broad UEM plus automation and federal deployment options
    - Pricing likely negotiated account by account; retained sources emphasize capability over public packaging
    - Competes on breadth and deployment flexibility rather than price transparency
  - - HCL BigFix
    - Quote-based enterprise pricing
    - No retained public list price
    - Endpoint management, compliance, remediation, and AI-backed automation
    - Retained public evidence emphasizes scale and performance, not list pricing
    - Supports premium enterprise replacement decisions where patch depth matters
  - - Workspace ONE
    - Edition-based enterprise pricing
    - Pricing exists but retained sources do not provide a clean public list table
    - UEM, app lifecycle, identity-adjacent access, patching and automation
    - Buyers should diligence post-Broadcom licensing and support model impacts
    - Commercial structure may matter as much as product fit in new deals
  - - NinjaOne
    - Quote-led SaaS with trial/no forced commitments
    - No retained public list price
    - Endpoint management, autonomous patching, backup, remote access
    - Vendor emphasizes no hidden fees and simpler packaging; exact price still quote-led
    - Undercuts Tanium on simplicity even without full list-price transparency
  - - Automox
    - Per endpoint SaaS
    - $1 per endpoint/month annually for OS patching; higher tiers quote-led
    - OS patching, then automation, third-party patching, multi-org management, remote control
    - Most transparent public entry price in retained set
    - A strong wedge into cost-sensitive or cloud-first estates
  - - Atera
    - Per technician SaaS
    - $149-$219 per technician/month for IT departments in retained competitor blog
    - RMM, helpdesk, ticketing, patching, remote access, AI agents
    - Competitor-authored pricing should be treated as directional; enterprise tier quote-led
    - Shows how far down-market the transparency benchmark has moved versus Tanium
