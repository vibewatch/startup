      - number: '8.4'
        title: 乐观、基准和悲观估值区间
        blocks:
          - type: paragraph
            body: >-
              情景框架应锚定公开证据，并明确缺什么。悲观情景假设 2024 年 Forbes 描述的收入画像增长不多，市场套用更接近 Tenable 或 Qualys
              的成熟公开市场倍数，治理或安全悬置进一步扩大折扣。Tanium 因而落向约 $3 billion 到 $4 billion；这仍高于独角兽底线，但相对今天的二级市场式定价，上行有限。


              基准情景假设 Tanium 大体维持 2024 年规模，盈利能力足以避免困境，并从 Atlas、ServiceNow 和政府粘性中收获一部分价值，但没有证明全面再加速。对应约 $4.5 billion 到
              $6.0 billion，足够接近 Yahoo / Forge 估计，可以支持“合理”立场。乐观情景需要的不只是叙事。要支撑 $7.5 billion 到 $9.5 billion，Tanium 必须拿出更新后的
              ARR 增长、可持续利润率，以及客户仍愿为平台支付溢价、而不是把端点管理视为可打包成本中心的证据。换句话说，旧的 $9 billion 框架是有条件上行情景，不是默认基准情景。
