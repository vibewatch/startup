      - number: '8.3'
        title: 可比公司组与入场纪律逻辑
        blocks:
          - type: paragraph
            body: >-
              公开可比公司组支持的是纪律，不是否定。Tenable、Qualys 等成熟安全公司市值 / 收入约在 2.5x 到 5.2x，SentinelOne 接近 6.0x。CrowdStrike、Palo Alto
              Networks 等高增长平台公司倍数高得多，因为披露更干净、规模更大，或两者都有。私募可比在增长异常强时还会更高：NinjaOne 披露数据意味着约 10x ARR，Axonius 按其 2025 年 ARR
              预测约 13x，Wiz 在仍处超高增长的云安全画像上低于 24x。


              在这个背景下，Tanium 当前以滞后的 Forbes 2024 年 ARR 锚点计算，6.1x 代理倍数更接近成熟公开市场区间，而不是高增长私募或公开市场溢价。因此，当前二级市场式标记比旧的 $9
              billion 框架更容易辩护。对于一家粘性强、盈利、面向企业、带政府暴露和 AI 杠杆的平台，12.9x 代理倍数不是不可能，但需要证明 Tanium 自 2024 年 Forbes
              文章以来，增长、利润率和产品动能都守住了。没有这份证据，投资人不应像承销 CrowdStrike、Wiz 或新一轮高增长私募轮那样承销 Tanium。
