  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              不应把 Tanium 分析成纯移动设备管理厂商，也不应把它看作纯端点防护厂商。Tanium
              自有平台、端点管理、暴露面管理和自主端点管理材料描述的是一个统一控制平面：把端点管理、资产发现与盘点、漏洞优先级排序、修复和工作流自动化合在一起。因此，最可辩护的市场边界从企业端点控制和资产可见性起步，再延伸到暴露面管理，因为同一套端点遥测被用来给风险打分并完成修复。Tanium
              的 ServiceNow 集成强化了这个边界；该集成明确把端点数据接入 CMDB 和工作流自动化。Carahsoft
              的公共部门打包也强化了这一点，它把资产盘点、端点管理、事件响应和暴露面管理作为一套政府控制栈来呈现。主要排除的支出桶包括纯 MDM 或 MAM
              部署、仅面向网络的零信任工具，以及买方并不打算整合控制和修复时的独立端点防护套件。在端点管理侧，Microsoft Intune 仍是最清楚的现状替代品；EPP 和漏洞管理既有厂商则掌握相邻预算，Tanium
              正试图把这些预算压进更宽的自主运营叙事。
