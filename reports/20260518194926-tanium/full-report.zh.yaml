chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与覆盖范围
        blocks:
          - type: paragraph
            body: >-
              2026 年的 Tanium 把自己定位为「Autonomous IT」公司：一家私营平台厂商，靠实时端点遥测和 AI 驱动工作流，把端点管理、暴露面管理和安全运营串在一起。第三方资料和公司自有材料都指向
              2007 年由 David 和 Orion Hindawi 创立，但 Tanium 的地理身份并不干净。公司当前地点页把 Washington 标为总部，SEC 搜索结果和 CB Insights 仍显示
              Emeryville, California 的经营或邮寄地址，Wikipedia 也保留了较早的 Kirkland-Emeryville 双地表述。产品叙事比主数据更一致。Tanium Atlas 于
              2026-05-05 推出，作为覆盖更广平台之上的新自主操作系统；Morningstar 转发的发布稿也重复了 Tanium 的说法，即平台现在捕捉超过 36 million
              个端点的信号。客户证据强在名称而不是数量：Best Buy 和美国海军都有公开案例研究页面，公司也直接面向联邦机构营销。
