  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、打包与公开定价线索
        blocks:
          - type: paragraph
            body: >-
              Tanium 的变现明显是模块化，而不是单体式。AWS Marketplace 上的公开打包和 North Carolina 全州采购文件都显示一套四部分结构：Core、Endpoint
              Management、Risk & Compliance、Incident Response，并附加 Threat Response、Patch、Asset、Reveal、Deploy、Benchmark
              等模块。最强的公开价格证据是 2025 年 4 月 1 日 NCDIT 价格表，它披露了多个模块的每端点 NC 价格，并对多数软件和硬件设备 SKU 施加 2,000 端点最低门槛。这一点重要，因为它把
              Tanium 从不透明的「联系销售」SaaS，变成部分可观察的企业定价模型。该价格表也显示公司仍销售硬件设备和维护续约，因此交付模型是混合式：云订阅存在，但本地部署和硬件支撑部署仍有商业意义。AWS 用年度
              1,500 端点套装和合同时长定价强化了同一结构；TrustRadius 的渠道抓取只能作为低置信度边缘线索，不能当成可承销的已实现价格。
