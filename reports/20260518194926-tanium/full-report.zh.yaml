  - id: TV005
    title: 投资逻辑破裂与叫停触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 刷新后 ARR 令人失望
        - 2025-2026 ARR 明显低于 2024 年公开 ~$700M 锚点
        - 打破当前倍数框架，让老股交易估算看起来也过于慷慨。
        - 下调至回避，或要求低得多的入场价格。
      - - 单位经济性偏弱
        - NRR 或毛利率明显低于一流软件标准
        - 拿掉相对成熟公开安全可比公司的所有溢价理由。
        - 把估值转向悲观区间。
      - - 优先权包袱
        - 股权结构瀑布显示，在 ~$4B-$5B 退出价位附近，普通股价值有限
        - 把合理企业价值变成糟糕股权回报。
        - 要求结构调整，或放弃。
      - - 治理 / 诉讼升级
        - Howard 类治理问题扩大，或出现新的股权争议
        - 扩大折价、伤害招聘，并削弱对内控的信心。
        - 暂停投资，直到法律 / 治理补救清晰。
      - - 运营 / 安全包袱
        - 核心模块出现重大产品安全问题，或修复缓慢
        - 削弱平台溢价逻辑，伤害公共部门信任。
        - 下调目标倍数，并收紧下行假设。
    notes: 触发因素是可监控的尽调阈值，而不是泛泛风险；每一项都直接连到估值压缩或普通股受损。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV057
      - CV061
      - CV062
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入质量
        - 按主要产品家族拆分的 2025-2026 ARR、增长、NRR 和毛利率
        - 区分合理老股交易与偏高溢价结果。
        - CFO 数据室、董事会材料包，或经审计管理账。
      - - 资本结构
        - 完全稀释股权结构表、优先股堆叠、任何反稀释棘轮条款和老股交易条款
        - 决定在合理退出价格下，普通股价值能否存活。
        - 法律 + 财务审查融资文件和 409A 材料。
      - - 现金充足性
        - 现金余额、月度烧钱速度，以及招聘 / 云基础设施成本计划
        - 避免为仍可能需要稀释性资本的业务付出高价。
        - 财务控制团队现金桥接和运营计划审查。
      - - 客户耐久性
        - 头部客户集中度、公共部门组合，以及按队列拆分的续约 / 扩张
        - 检验政府和大型企业粘性是否真的支撑溢价倍数。
        - 销售 / FP&A 队列切片和采购集中度审查。
      - - 流动性路径
        - 要约历史、当前老股清算证据，以及 IPO / 出售准备材料
        - 建议强度取决于资本如何现实回流。
        - 董事会 / 银行材料，加上经纪老股交易数据。
    notes: 这些要求是在高于当前老股交易式水平付价前的最低材料包。缺失项不是装饰；它们决定数十亿美元的标题估值是否真正可投。
    claimRefs:
      - CV057
      - CV059
      - CV061
      - CV063
