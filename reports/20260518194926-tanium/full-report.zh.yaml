      - number: '8.2'
        title: 为什么估值底部仍远高于 $1 billion
        blocks:
          - type: paragraph
            body: >-
              最强的底部证据，是后期经营规模、公开价格和二级市场持续支持三者叠加。Forbes 2024 年 8 月报道描绘的是一家已经超过 $700 million ARR、自由现金流率超过 10%、EBITDA
              转正，并建立了 $300 million 云 ARR 流、同比增长 40% 的公司。这不是低于独角兽的经营规模。同一篇文章称 Tanium 覆盖 32 million 台员工设备；到 2026 年 5 月
              Atlas 发布时，公司声称覆盖超过 36 million 个端点。North Carolina 2025 年价目表和 AWS Marketplace 套餐显示，Tanium
              仍在规模化销售高价、多模块企业产品；Carahsoft 合同目录则显示，政府采购触达延续到 2026 年和 2030 年窗口。


              合起来看，这些信号比缺少新一轮定价融资更重要。一家公司如果有数亿美元级经常性收入、正向现金生成、深度公共部门触达和真实二级市场报价，不需要 2025 年一级融资事件来证明自己仍是独角兽。公开记录也确实显示，旧的
              $9 billion 标记和当前 $4.26 billion 估计应被视为不同估值制度，而不是可互换的事实。
