            body: >-
              2024 年 5 月之后最重要的证据是，Tanium 仍被筛选为一家有可观收入规模的数十亿美元级私营公司，尽管当前没有公开经审计财务报表。Forbes 在 2024 年 8 月报道，Tanium 销售额约
              $700 million，自由现金流率超过 10%，EBITDA 盈利，云 ARR 约 $300 million 且同比增长 40%。Forbes 公司资料截至 2025 年 9 月仍把该业务描述为 $9
              billion 估值。Yahoo Finance 的 Forge 支撑私募市场页面于 2026 年 5 月 15 日访问时，把当前估计下调至 $4.26 billion，但这仍比用户要求的 $1 billion
              估值门槛高出很大缓冲。问题不是 Tanium 是否仍是独角兽；问题是公开数据集在累计融资甚至当前收入规模上存在实质分歧。分歧没有推翻估值逻辑，但会降低承销精度，也让管理层确认的股权结构表和 KPI 材料成为必需。
