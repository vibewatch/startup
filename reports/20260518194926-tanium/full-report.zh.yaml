companyProfile:
  summary: >
    Tanium 是一家美国网络安全和端点管理公司，2007 年由 David Hindawi 和 Orion Hindawi 创立。平台覆盖实时端点可见性、补丁、风险与合规、事件响应，以及以 Atlas 和 Tanium Ask
    包装的较新 AI 工作流层。公开客户证据最集中在超大型、强监管环境，包括 Fortune 100 公司、美国头部银行，以及多个美国联邦和军事组织。公开证据支持其收入或 ARR 规模约 $700 million，估值仍远高于 $1
    billion 门槛，但由于当前增长、利润率、留存、烧钱速度和优先股堆叠披露稀少，入场承销仍受限制。
