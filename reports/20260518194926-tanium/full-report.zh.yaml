      - number: '8.5'
        title: 投资逻辑破裂、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最大的估值风险不只是市场品类风险，也包括披露和治理风险。Howard v. Tanium 让员工股权估值做法继续留在尽调文件中，2026
              年产品安全公告提醒投资人，即便平台已经规模化，执行风险仍重要。更关键的是，公开记录仍未回答决定普通股价值的问题：当前 ARR 和 NRR、毛利率、现金消耗、优先股堆叠，以及 2024-2026
              年是否有任何二级交易实际接近公布估计成交。


              这种不确定性也限制退出承销。Forbes 2024 年 8 月报道称，Tanium
              对继续保持私有状态感到从容，并未把首次公开募股（IPO）放在优先事项，因此投资人不应假设近期流动性。建设性观点因此需要明确否决触发项：更新后 ARR 明显低于 2024
              年锚点、优先股堆叠在当前二级区间附近吃掉价值，或更多治理 / 安全问题扩大折扣。在这些问题解决前，合理立场是把 Tanium 留在观察名单上，而不是把旧估值当作已有公开公司级披露那样支付。
