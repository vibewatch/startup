        title: 满意度信号与持久性缺口
        blocks:
          - type: paragraph
            body: >-
              Tanium 的持久性叙事可信，但仍不完整。正面看，独立评论平台表现好于人们对复杂端点平台的预期：TrustRadius 在 30 条评论中得分 9.2/10，PeerSpot 显示 3.9/5 且 80%
              愿意推荐，SoftwareReviews 报告推荐可能性 93、续约计划
              99。这些都是有意义的代理，说明已经投入平台的客户通常仍保持参与。负面也一致。评论和应用市场来源反复指出价格、实施工作量、支持摩擦，以及对有经验运营者的需求；PeerSpot
              特别提到集成并不简单，策略可能需要三到四天才反映出来，AWS Marketplace 评论也提到复杂和昂贵。Gartner 产品页同时捕捉到正面和批评性评论。核心尽调问题是，Tanium 仍未公开披露
              NRR、GRR、流失率、队列留存或准确活跃客户数，因此公开持久性仍是代理判断，而不是直接测量的收入留存事实。
