      - number: '1.4'
        title: 里程碑、联邦姿态与负面历史
        blocks:
          - type: paragraph
            body: >-
              Tanium 的里程碑记录把持久产品相关性和真实治理、声誉伤痕混在一起。公司在 2020 年融资时搭配 Salesforce 合作，2020 年 9 月把前 Ford CEO Mark Fields
              加入董事会，并在 2023 年 2 月完成 Streetman 的 CEO 交接。2023 年 11 月，Tanium Cloud for U.S. Government 获得 FedRAMP Moderate
              授权，联邦姿态明显增强；Business Wire 发布稿还称其支持美国国防部五个军种、民用机构和超过 70% 的 Fortune 100。2026 年 5 月，Tanium 借 ServiceNow
              Knowledge 发布联合 Autonomous IT 方案，随后推出 Tanium Atlas 作为旗舰 AI 操作层。这些正面因素旁边，是尽调仍不能忽视的旧负面历史。Bloomberg 联合发布的 2017
              年报道称，Tanium 未经许可在现场演示中使用 El Camino Hospital 网络；另一篇联合报道指称 Orion Hindawi 任内存在员工归属期前解雇，Tanium
              否认该说法。更近期，第九巡回法院在 2024 年恢复了一起员工股票价值虚假陈述案，说明治理和股权处理审视并未消失。
