  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 厂商
      - 定价模式
      - 公开标价信号
      - 已包含能力
      - 合同态势 / 未知项
      - 战略含义
    rows:
      - - Tanium
        - 定制企业报价
        - 无保留公开标价
        - 广泛端点管理、实时查询、暴露和修复工作流
        - 独立来源持续提到设置成本更高、运营模型更重；保留来源集缺少公开价目卡
        - 买方足够重视实时控制、能接受不透明定价时，契合度强
      - - Microsoft Intune
        - 按用户 / 套件捆绑
        - $8 Plan 1；$4 Plan 2 附加项；$10 Intune Suite 附加项
        - 核心 UEM，加高级端点 / 安全能力附加项
        - 定价公开，且常已嵌入 Microsoft 365 订阅
        - 在以 Microsoft 为标准栈的账户中设定品类价格地板
      - - Ivanti Neurons for UEM（统一端点管理）
        - 基于报价的企业定价
        - 无保留公开标价
        - 广泛 UEM，加自动化和联邦部署选项
        - 定价可能逐账户谈判；保留来源强调能力，而非公开打包
        - 竞争点是广度和部署灵活性，而非价格透明度
      - - HCL BigFix
        - 基于报价的企业定价
        - 无保留公开标价
        - 端点管理、合规、修复和 AI 支持的自动化
        - 保留公开证据强调规模和性能，而非标价
        - 补丁深度重要时，可支撑高端企业替换决策
      - - Workspace ONE
        - 按版本的企业定价
        - 存在定价，但保留来源没有提供清晰公开价目表
        - UEM、应用生命周期、身份相邻访问、补丁和自动化
        - 买方应尽调 Broadcom 之后授权和支持模型的影响
        - 新交易中，商业结构的重要性可能不亚于产品契合度
      - - NinjaOne
        - 报价牵引的 SaaS，提供试用 / 无强制承诺
        - 无保留公开标价
        - 端点管理、自主补丁、备份、远程访问
        - 厂商强调无隐藏费用、打包更简单；精确价格仍由报价驱动
        - 即便没有完整标价透明度，也在简洁性上压低 Tanium
      - - Automox
        - 按端点计费的 SaaS
        - OS 补丁年付价为 $1 per endpoint/month；更高层级报价制
        - OS 补丁，随后是自动化、第三方补丁、多组织管理、远程控制
        - 保留集合中最透明的公开入门价
        - 切入成本敏感或云优先环境的强楔子
      - - Atera
        - 按技术员计费的 SaaS
        - 保留竞品博客显示，IT 部门为 $149-$219 per technician/month
        - RMM、服务台、工单、补丁、远程访问、AI 智能体
        - 竞品撰写的定价只能作方向性参考；企业层级仍报价驱动
        - 显示相较 Tanium，透明度基准已经下探得很深
    notes: 本表刻意把公开标价和报价牵引的企业销售动作拆开。只有保留来源披露时才使用公开数字；缺失的 Tanium、Ivanti、BigFix 以及大多数 Workspace ONE 企业经济性，仍是尽调事项，不能直接进模型。
