  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流问题
      - Tanium 工作流
      - 可衡量收益 / 证据
      - 已知限制
    rows:
      - - 实时资产可见性
        - 团队依赖过期扫描、割裂工具和手工验证
        - Core 和 Endpoint Management 查询当前端点状态，呈现共享运营视图
        - 官方和评测来源都强调大型资产群的实时可见性与控制力
        - 公开证明更偏叙事，独立延迟基准不足
      - - 补丁和软件上线
        - 在大型中心辐射式环境里，传统补丁可能耗时数天或数周
        - 线性链式分发叠加 Endpoint Management，目标是在大规模下更快推送包和动作
        - AWS Marketplace 称首轮补丁成功率可从 60-80% 提升到 99% 以上
        - 99% 主张以及重负载下 CPU 影响的独立验证并未公开
      - - 风险和合规优先级排序
        - 漏洞、合规和敏感数据发现常分散在不同工具里
        - Risk & Compliance 汇总端点发现，并声称提供运行时 SBOM 和集成修复
        - Marketplace 文案称 Tanium 在一个平台收集数百万资产的风险数据
        - 公开材料中的商业认证范围和第三方审计细节仍有限
      - - ITSM 和 CMDB 同步
        - ServiceNow 中的资产数据常常到得晚、上下文不一致
        - Service Graph Connector 拉取 Tanium 资产视图，写入 CMDB 和软件安装记录
        - ServiceNow 文档展示了具体的 CMDB 和发现来源记录创建流程
        - 连接器设置依赖 token 管理、自定义视图和网络前置条件
      - - SOC 和 IR 提速
        - 分析师在 SIEM、EDR、工单和端点工具之间来回切换
        - Incident Response、Tanium Ask 和 ServiceNow AI 智能体旨在缩短从调查到动作的闭环
        - Channel Insider 描述了 Now Assist 工作流中的引导式分诊，以及重启或卸载动作
        - 已发布证明偏路线图，缺少广泛客户结果数据
      - - 大规模企业运营
        - 大型买方需要一个平台覆盖数千到数百万个端点
        - Tanium 向端点工程和安全团队销售一套统一运营模型
        - GetApp 称该平台适合从数千到数百万端点的部署
        - PeerSpot 和 AWS 内嵌评测仍提到复杂度、价格和 UI 学习曲线
    notes: 收益单元格混合官方、伙伴和评测证据。除非明确标为评测反馈，量化性能主张均来自厂商或 Marketplace。
