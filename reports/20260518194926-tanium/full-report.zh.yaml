  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 大型企业和公共部门买家如何从合规或可视性痛点出发，进入 Tanium 部署、运营和扩张。
    data:
      items:
        - label: 认知
          detail: CISO、CIO 或联邦安全负责人往往从一个硬性要求、事件或可视性缺口切入：Fortune 100 级安全卫生预期、 KEV 压力、现代化项目，或对碎片化工具不满。
          touchpoints:
            - 联邦合规强制要求
            - 客户案例和参考页面
            - 同行评论和市场平台反馈
        - label: 评估
          detail: 安全工程和端点团队会测试 Tanium 能否在超大规模资产中实时回答问题，同时接入 Microsoft、ServiceNow 或既有补丁与响应流程。
          touchpoints:
            - AstraZeneca、Zurich 和 Phoenix 参考案例
            - Microsoft 集成案例
            - PeerSpot / TrustRadius / Gartner 评论研究
        - label: 采购
          detail: 采购环节会加上 ROI 和可采购性筛查。公共部门买家依赖 FedRAMP、GSA、DIR 和渠道合同载体；商业买家权衡供应商整合和总拥有成本论证。
          touchpoints:
            - Forrester TEI / Business Wire ROI 证据
            - Carahsoft 合同载体
            - Texas DIR 合作合同
        - label: 部署
          detail: 端点和安全运营团队会在设备规模、补丁节奏或响应延迟能带来价值的场景部署 Tanium，再把自动化和仪表盘纳入日常运营。
          touchpoints:
            - 缩短补丁周期
            - 覆盖 20K–125K 个端点的实时可视性
            - 统一 IT / 安全工作流
        - label: 扩张 / 续约
          detail: 最强的公开案例显示，Tanium 通过成为更广泛运营或 Microsoft 对齐安全项目的行动层留在客户账户里；但到了这个阶段，价格和复杂度异议会重新出现。
          touchpoints:
            - 伙伴主导的模块扩张
            - 运营自动化收益
            - 评论平台对复杂度和定价的投诉
    approximationNotes: 这张图基于抓取的客户案例、采购页面和独立评论平台重建。Tanium 未披露平均销售周期或部署时间数据，因此各阶段节奏由公开证据推断。
    claimRefs:
      - CU035
      - CU045
      - CU046
      - CU048
      - CU050
