        - 独立验证
        - 路线图波动
      rows:
        - label: Core
          values:
            - label: 高
              tone: positive
              detail: 反复被打包成可信数据和自动化基础。
            - label: 高
              tone: positive
              detail: Core 可视性和控制在官方、AWS 和评论来源中持续出现。
            - label: 中
              tone: neutral
              detail: Core 仍依赖端点可达性，也依赖下游系统完成部分动作。
            - label: 中
              tone: neutral
              detail: 独立评论佐证了价值，但不是所有性能主张都得到验证。
            - label: 低
              tone: positive
              detail: 这是公开产品叙事中波动最小的部分。
        - label: Endpoint Management
          values:
            - label: 高
              tone: positive
              detail: 生命周期工作流在公开打包中描述清楚。
            - label: 中
              tone: neutral
              detail: 补丁、软件和策略功能是公开的，但大规模证明仍参差不齐。
            - label: 中
              tone: neutral
              detail: 部分结果仍依赖合作伙伴工单或工作流系统。
            - label: 中
              tone: warning
              detail: 评论验证了实用性，也提到复杂度和成本。
            - label: 低
              tone: positive
              detail: 功能看起来已经成熟，不像新推出的东西。
        - label: Risk & Compliance
          values:
            - label: 高
              tone: positive
              detail: Marketplace 打包和官方页面清楚地把它定位为一个解决方案区。
            - label: 中
              tone: neutral
              detail: 运行时 SBOM 和集成修复可信，但仍主要由供应商叙事支撑。
            - label: 中
              tone: neutral
              detail: 下游修复往往依赖其他工作流系统。
            - label: 低
              tone: warning
              detail: 对评分质量和信任控制的独立验证有限。
            - label: 中
              tone: warning
              detail: 商业控制范围的证据仍不完整。
        - label: 集成界面
          values:
            - label: 高
              tone: positive
