  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Tanium 在一个狭窄意义上已经不再是估值谜题：2024 年 5 月之后的公开证据清楚表明，它仍远高于独角兽门槛。Forbes 2025 年 9 月仍把公司描述为 $9 billion，而 Yahoo
              Finance 的 Forge 支持私募市场页面估计，截至 2026 年 5 月 15 日为 $4.26 billion。这两个标记相差很远，但在用户核心问题上指向同一方向：Tanium
              仍是一家数十亿美元级私营公司。真正的争论因此不是 Tanium 是否超过 $1 billion，而是在没有管理层新披露的情况下，哪个价格区间站得住。


              建议是观察 / 继续研究；在当前二级市场式价格附近有条件兴趣，而不是怀念旧轮次估值。公开证据支持一种合理读法：如果投资人能在当前二级估值附近进入，并确认 2024 年 Forbes
              描述的经营画像大体仍成立，就可以继续研究。公开证据不支持把旧的 $9 billion 框架当作干净成交价来支付。反向逻辑是不透明：公开记录仍缺少更新后的 ARR
              桥、留存、毛利率、现金消耗细节，以及决定普通股回报是否真正有吸引力的优先股堆叠。
