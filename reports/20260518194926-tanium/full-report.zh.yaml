      - number: '2.2'
        title: 多口径市场规模测算
        blocks:
          - type: paragraph
            body: >-
              公开市场数据无法支撑一个单一的 Tanium TAM 数字。仅统一端点管理，分析师基线就从 Mordor Intelligence 的 2026 年 $8.85B 市场，到 The Business
              Research Company 的 2026 年 $22.75B 市场；Technavio 则把同一品类表述为 2026 至 2030 年新增收入 $11.365B，Grand View 的较早序列又从小得多的
              2022 年基数起步。相邻品类同样庞大：Fortune Business Insights 把 2026 年端点防护定为 $21.64B、暴露面管理定为 $5.08B、攻击面管理定为 $1.25B；TBRC 把
              2026 年安全与漏洞管理定为 $15.93B。这些口径不能简单相加，因为同一个企业账户可能用一个平台预算购买相互重叠的控制、盘点和修复能力。更受证据约束的可服务切口，是 UEM 中偏大型企业的部分：把
              Mordor 的 71.62% 大型企业占比套到其 2026 年 UEM 基线，可得到约 $6.34B 的底部；同样逻辑套到 TBRC 的 2026 年 UEM 基线，则给出约 $16.29B
              的高情景上限。即便如此，公开资料仍没有干净的 SOM，因为 Tanium 不披露分产品线收入或份额。
