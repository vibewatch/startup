  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Tanium 最高的剩余风险集中在安全缺陷节奏、部署复杂度、采购集中度和 AI 相关定价压力，而不是某个单一生死事件。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 安全缺陷节奏
          values:
            - label: 高
              tone: negative
              detail: 2026 年多份安全公告已经覆盖服务器、客户端和管理模块。
            - label: 高
              tone: negative
              detail: 凭证、令牌和访问控制缺陷会对控制平面厂商造成不成比例冲击。
            - label: 中
              tone: warning
              detail: Tanium 会发布修复版本和补救指引。
            - label: 高
              tone: negative
              detail: 缺少公开补丁采纳证据时，剩余风险仍然高。
        - label: 部署和支持复杂度
          values:
            - label: 高
              tone: warning
              detail: 评论平台反复提到复杂度和专业知识要求。
            - label: 中高
              tone: warning
              detail: 部署周期长、支持摩擦大，会拖慢价值兑现和续约。
            - label: 中
              tone: neutral
              detail: ROI 清楚时，大客户可能接受服务投入重的上线方式。
            - label: 高
              tone: warning
              detail: 在超大规模或自管资产环境里，剩余暴露仍有分量。
        - label: 公共部门和大客户集中度
          values:
            - label: 中
              tone: warning
              detail: 联邦合同载体和标杆客户可见，但具体结构不透明。
            - label: 高
              tone: warning
              detail: 预算冲击或合同中断可能影响订单和投资人信心。
            - label: 中
              tone: neutral
              detail: 多个合同载体和客户广度提供部分分散。
            - label: 中高
              tone: warning
              detail: 集中度披露缺失放大了剩余暴露。
        - label: AI 执行和定价压力
          values:
            - label: 中高
              tone: warning
              detail: Tanium 正大举扩张到 AI、移动和 OT；同业已经把部署更容易讲成卖点。
            - label: 高
              tone: warning
              detail: 如果 AI 主导的简化没有跑通，定价和成交率压力会很快压缩价值。
            - label: 中低
              tone: neutral
              detail: 分阶段上线、置信分数和集成是预设缓释手段。
            - label: 中高
              tone: warning
              detail: 在采用和变现数据公开前，剩余严重度仍然偏高。
    approximationNotes: 标签只反映公开证据；它们不是事件频率或损失幅度的定量模型。
    claimRefs:
      - CR017
