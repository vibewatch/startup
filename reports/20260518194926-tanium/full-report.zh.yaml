      - - 网络卫生与 KEV 驱动的漏洞优先级排序
        - 驱动
        - 当前 / 持续
        - 验证“盘点 + 修复”工作流，以及更快的补丁优先级排序
        - 询问实际部署中 Tanium 数据多常映射到 KEV 或类似可利用性框架
      - - HIPAA 与受监管行业的资产盘点压力
        - 驱动
        - 当前 / 近期
        - 抬高医疗健康场景里端点可见性、资产图谱和风险管理的合规价值
        - 索取与合规用例绑定的医疗客户背书，而不只是安全结果
      - - 云交付控制平面与服务占比较高的实施
        - 驱动
        - 当前 / 结构性
        - 利好能统一管理、分析和修复，同时提供运营支持的平台
        - 按部署类型衡量服务附加率、伙伴使用率和价值达成时间
      - - 既有 Microsoft 捆绑包
        - 约束
        - 当前 / 结构性
        - 主流企业已有基础云端点栈，替换门槛被抬高
        - 量化已安装 Intune 账户中的胜率，并找出能撬动替换的模块
      - - UEM、EPP、SVM 和 ITSM 之间的品类混淆
        - 约束
        - 当前
        - 没有单一预算科目清楚承接整个平台叙事，交易归属可能变慢
        - 询问多模块交易里哪类高管会成为稳定的经济买方
      - - 分析师 TAM 基线膨胀或不一致
        - 约束
        - 当前
        - 若尽调不做排除、直接采用最高公开市场数，估值上行会被夸大
        - 用已披露的细分结构、端点数量和当前模块附加率，与管理层重建 TAM
      - - 未披露的公开 SOM 与产品线收入结构
        - 约束
        - 当前
        - 公开份额难以精确分析，自下而上校准估值也更难
        - 索取模块收入、暴露管理附加率、公共部门占比，以及按买方细分的留存
    notes: 授权要求、网络卫生和工作流整合重叠时，驱动力最强。尽调的核心难点，是把宽泛的市场收敛转成明确预算负责人和可衡量的 Tanium 份额假设。
