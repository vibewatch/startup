      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Tanium 的领导层叙事强在创始人延续，弱在当前状态的一致性。Dan Streetman 当前履历和 Yahoo Finance 私营公司资料都把他列为 CEO；2023 年 2 月的交接公告也明确说
              Streetman 将出任 CEO，Orion Hindawi 转任执行董事长，David Hindawi 成为荣誉董事长。但 Orion Hindawi 自己的当前简介仍称其担任
              CEO，在公司官网上制造了一个本可避免的治理数据不一致。无论哪个头衔才是规范说法，创始人影响力仍然重要：David 和 Orion 都留在高级治理职位，Mark Fields、Tim
              Millikin、Maggie Wilderotter 等投资人或独立董事在旁提供运营和资本市场经验。Marc Levine 当前 CFO 角色也很关键，因为 Tanium
              仍是私营公司，指标披露稀少，下一次融资或流动性事件很可能高度依赖财务纪律和董事会一致性。
