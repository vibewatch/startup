      - number: '1.3'
        title: 资本结构、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              Tanium 的融资历史比当前私募市场指标清楚。公司 2020 年 10 月宣布追加 $150 million 股票出售，Business Insider 报道称该轮在同年 6 月 Salesforce
              Ventures 较早投资之后把 Tanium 估到超过 $9 billion；同一报道将 Salesforce Ventures 那笔投资规模写为 $100 million。Tanium 在 2020
              年称累计融资已超过 $900 million，而 CB Insights 现在估计累计融资更高，为 $1.174 billion，并把公司列为活跃老股交易标的。SEC 搜索结果还显示自 2009 年以来长期存在
              Form D 轨迹，这与一家融资密集、周期很长的私营公司相吻合。当前规模信号方向上强，但不够干净，无法精确。Forbes 2025 年 9 月资料列出 2,000 名员工和 $9 billion 估值；Yahoo
              的私营公司页面显示 1,001 名员工，并给出截至 2026-05-15 的 Forge 价格 $5.40；ZoomInfo 称员工数 1K-5K，收入估计 $378.1 million。审慎读法是：Tanium
              规模大、成熟，也足够有流动性可以形成老股交易定价，但没有管理层材料，公开透明度不足以支撑当前指标的精确测算。
