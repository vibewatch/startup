      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 运营规模
        - Forbes 2024 年报道显示 ARR 约 $700M、EBITDA 已盈利，FCF 利润率 >10%。
        - 这些数据没有在经审计的 2025-2026 公开材料中更新。
        - 发布当前 ARR / 利润率桥接和经审计的运营指标。
      - - 市场相关性
        - 36M+ 端点遥测、公共部门合同，以及 ServiceNow / Microsoft 相邻定位支撑平台相关性。
        - 如果增长降温，端点管理仍可能被市场归入捆绑型或低倍数品类。
        - 拿出持久扩张、大型企业胜率，以及 Atlas / AEM 附加率证据。
      - - 估值底部
        - Forbes 2025 和 Yahoo / Forge 2026 都显示 Tanium 仍远高于 $1B。
        - ~$4.26B 到 $9B 的区间太宽，不能忽略。
        - 提供管理层认可的估值材料，或新的老股清算证据。
      - - 治理 / 风险
        - 业务看起来足够成熟，能够吸收普通执行风险。
        - Howard v. Tanium 和 2026 年公告让治理与产品风险仍留在档案中。
        - 干净结束诉讼，并证明控制环境稳定。
      - - 流动性
        - 老股市场支持和规模意味着存在流动性路径。
