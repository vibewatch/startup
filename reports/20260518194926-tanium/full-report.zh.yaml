  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 企业端点管理 / UEM
        - 端点配置、软件部署、补丁、合规报告、端点分析、设备策略编排
        - 纯移动端 MDM/MAM，或没有更广控制平面的 BYOD 应用容器
        - CIO、端点运营、EUC；中央 IT 预算
        - Tanium 与 Microsoft Intune 和其他端点套件竞争的核心控制平面市场
      - - 资产发现和盘点
        - 实时端点清单、资产感知、软件和硬件可见性、支撑 CMDB 的遥测
        - 没有实时端点遥测的仅 CMDB 静态记录系统
        - IT 运营、基础设施、配置管理负责人
        - 对 Tanium 至关重要，因为盘点质量决定控制、合规和修复准确性
      - - 暴露 / 漏洞管理
        - 持续漏洞监控、优先级排序、可利用性上下文、修复编排
        - 没有运营工作流或端点动作层的独立扫描
        - CISO、漏洞管理、风险与合规预算
        - 快速增长的相邻预算，Tanium 可用同一端点数据平面切入
      - - 工作流自动化 / 自主运营
        - 与 ServiceNow 连接的修复、策略工作流、AI 辅助运营动作、跨团队编排
        - 没有端点执行的 ITSM 工单，或没有资产上下文的孤立 RPA
        - ITSM 负责人、CIO 办公室、平台工程
        - 重要扩张层，因为 Tanium 正定位自主运营，而不只是可见性
      - - 公共部门网络卫生 / 零信任项目
        - 机构零信任迁移、网络卫生扫描、漏洞减少、受监管端点控制
        - 仅网络的零信任、只做咨询的项目、一次性合规咨询
        - 联邦、州 / 地方、教育、国防采购和现代化预算
        - 可信的可服务切入口，因为 Tanium 已在推广面向政府的专用打包方案和就绪能力
      - - 独立替代品和排除类别
        - N/A
        - 当买方不整合控制和修复时，纯 EDR/XDR、仅网络零信任、单点 MDM 或孤立端点保护
        - 已被既有厂商满足的安全或 IT 预算项目
        - 这些是真实替代品，但除非发生整合，否则不应计入 Tanium 纳入的 TAM
    notes: 边界有意按“融合”来划分：表中纳入 Tanium 明确通过端点遥测和工作流连接的预算，排除不共享同一控制 / 修复逻辑的相邻安全或管理支出。
