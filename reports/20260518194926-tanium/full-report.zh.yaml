  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - Tanium 护城河 / 风险
      - 为什么重要
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 实时查询架构
        - 实时查询架构让 Tanium 在事件响应、合规和大规模终端补救中区别于定期扫描工具和更轻量的 UEM 工具
        - BigFix 在企业补丁管理上缩小差距；以安全为核心的平台也在围绕另一套重心加入实时补救能力
        - 高
        - 验证在大型客户中，实时状态工作流多频繁地直接拉动赢单率、续约或工具整合
      - - 统一 IT + 安全控制平面
        - Tanium 可以作为多套工具的替代品竞争，而不是又一个 UEM 产品
        - CrowdStrike、SentinelOne 和 Qualys 正把足够多的补救和暴露面管理放进安全平台，足以抢走预算
        - 高
        - 获取产品使用和模块附加数据，验证客户是否真的整合到 Tanium 上
      - - 联邦和强监管企业信誉
        - 帮助进入政府机构和管控严格的资产环境，这类客户不会只因 SMB 式低摩擦就采购
        - Microsoft 和 SentinelOne 都有强政府部署叙事；Ivanti 也在营销 FedRAMP 认证的联邦交付能力
        - 中
        - 检查近期联邦管线质量、竞争组合，以及 FedRAMP 是否显著改变成交率
      - - 定价不透明
        - 相比 Intune 和 Automox 这类公开价格锚，定价不透明会削弱 Tanium
        - 买方可以用摩擦更低、价格更透明的替代方案解决部分工作
        - 高
        - 索取按细分市场划分的当前标价到净价区间和折扣纪律
      - - 部署和管理复杂度
        - 公开评价一再把 Tanium 描述为能力强，但比云原生挑战者更难部署、更吃运维人手
        - NinjaOne、Automox 和 Atera 靠快速上线和更简单的上线后运维取胜
        - 高
        - 衡量相较同业的价值实现时间、管理员人手和专业服务依赖
      - - Microsoft 套餐价格底板
        - 捆绑的 Intune 会在已押注 Microsoft 365 的客户中限制 Tanium
        - 即便 Tanium 技术更强，套餐经济性也可能挡住替换
        - 高
        - 按 Microsoft 365 渗透率复盘赢单 / 输单，尤其是由办公技术或终端团队主导的客户
    notes: 严重性反映的是：基于已保留公开证据，某一威胁在未来 12-24 个月侵蚀 Tanium 价值捕获或替换率的可能性。该严重性不是对当前客户流失率的判断。
