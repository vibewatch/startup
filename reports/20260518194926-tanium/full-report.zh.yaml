      - number: '4.4'
        title: 单位经济代理、员工基数与成本结构信号
        blocks:
          - type: paragraph
            body: >-
              作为一家私营基础设施软件公司，Tanium 给出了异乎寻常多的定价线索，但直接单位经济披露仍很差。公开 NC 模块价格和 AWS 打包足以推断高端企业
              ASP，并可计算出服务、云基础设施或伙伴毛利之前，每端点每年约 $78.30 的四模块软件栈。2026 年 Forrester TEI 发布稿提供了客户经济性补充：一个 48,000
              端点的综合企业在不到六个月内回本，ROI 235%，补丁更快，MTTR 更低，软件回收效果强。这支持一个判断：当买方重视节省人力和运营速度时，Tanium 可以守住高端定价。员工基数也仍然大。公开员工数代理显示
              Tanium 到 2025 年末超过 2,000 人，Revelio 估计为 2,539，招聘岗位继续增长；Unify 显示销售与支持、工程均有可观规模。对照公开约 $700 million
              的规模标记，这意味着每名员工收入约 $276,000-$350,000。成本侧主要提醒是：公司仍是混合式且支持负担重，而不是纯云；用户评论也持续提到成本和实施复杂度。
