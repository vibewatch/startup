  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Tanium 的公开产品栈以专利端点通信打底，上面叠加模块工作流、集成以及 2026 年 AI 界面。
    approximationNotes: 这些层是功能层，不是字面部署边界。ServiceNow、Sentinel 等伙伴系统出现在会实质改变工作流或数据流的位置。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE014
      - CE017
      - CE021
      - CE029
    data:
      layers:
        - id: L1
          label: 端点资产环境与客户端
          detail: 托管笔记本、服务器、云工作负载和其他端点提供原始状态；Tanium 要查询这些状态，并据此打补丁、做修复。公开叙事把广泛端点覆盖作为所有其他模块的起点。
          tone: neutral
        - id: L2
          label: 专利通信层
          detail: Tanium 的线性链通信模型沿点对点链路传递问题、包和动作，相比中心辐射式设计，可降低 WAN 压力并提升分发速度。
          tone: positive
        - id: L3
          label: Core 数据与控制平面
          detail: Core 维护实时状态、策略协调和单一可信数据源叙事，支撑云端和本地部署中的可视性、编排和集成。
          tone: positive
        - id: L4
          label: 运营解决方案区
          detail: 公开 AEM 打包把能力归入 Core 之上的 Endpoint Management、Risk & Compliance 和 Incident Response；Patch 仍是更大端点管理层里的可见命名工作流。
          tone: positive
        - id: L5
          label: 集成与 AI 动作层
          detail: ServiceNow、Microsoft Sentinel、API、MCP 暴露面、Tanium Ask 和 Atlas 位于控制平面之上，把上下文送入 CMDB、SIEM 和 AI 引导的修复工作流。
          tone: neutral
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开运营流程从实时端点状态开始，经过优先级排序和伙伴系统，最后回到同一控制平面验证结果。
    approximationNotes: 该流程抽象了 IT 运营和安全用例。图中不声称每一步的时间，只聚焦顺序和依赖。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
      - CE018
      - CE020
      - CE033
    data:
      nodes:
        - id: N1
          label: 1. 端点接入
          detail: 由 Tanium 管理的端点或 Tanium 客户端加入环境，并参与通信层。
          tone: neutral
        - id: N2
          label: 2. 捕获当前状态
          detail: Core 收集当前端点状态，并转成下游模块使用的可信运营视图。
          tone: positive
        - id: N3
          label: 3. 发出查询或策略
          detail: 运营人员通过同一控制平面提出实时问题、部署软件、打补丁或执行策略。
          tone: positive
        - id: N4
          label: 4. 设定风险和优先级
          detail: Risk & Compliance 及相关工作流对漏洞、配置缺口或敏感数据发现项排序。
          tone: positive
        - id: N5
          label: 5. 接入伙伴系统
          detail: 当工作流需要 CMDB、事件或日志集成时，ServiceNow、Sentinel、SIEM 或聊天工作流接收数据或动作。
          tone: neutral
        - id: N6
          label: 6. 执行动作
          detail: 管理员根据模块和集成路径，打补丁、卸载软件、创建工单，或跟随 AI 引导动作。
          tone: positive
        - id: N7
          label: 7. 复验结果
          detail: 团队再次查询同一端点数据平面，验证修复结果，而不是等待下一次计划扫描。
          tone: positive
      edges:
