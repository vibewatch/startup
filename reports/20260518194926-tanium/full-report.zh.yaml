      - number: '4.5'
        title: 财务结论与承销阻塞点
        blocks:
          - type: paragraph
            body: >-
              Tanium 的公开案例方向上强：在所有可用的 2024 年 5
              月之后估值标记上，公司看起来规模大、聚焦企业，并且仍值数十亿美元。公开采购文件给出真实变现细节；联邦材料显示持久公共部门相关性；客户价值研究和招聘数据也表明 Tanium
              仍在为规模投入，而不是榨取一个萎缩的业务。投资问题在精度，不在存在性。收入代理彼此矛盾，累计融资数字彼此矛盾，公开市场看不到毛利率、NRR、客户集中度、现金、烧钱速度或现金跑道。近期安全公告和 Howard
              诉讼也意味着投资人不能把 Tanium 当作没有治理或产品风险阴影的纯净软件可比公司。我的财务结论因此是：规模、收入质量和长期估值底线为正，但真实利润率路径和资本充足性仍不完整。正确下一步不是争论 Tanium
              是否高于 $1 billion；而是在从这里承销估值上行前，拿到董事会材料、股权结构表、队列留存切片和产品线 P&L。
