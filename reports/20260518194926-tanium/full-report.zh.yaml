        - 始终在线可见性、内置优先级排序和补丁、灵活传感器 / 设备
        - 完整端点管理广度的证据少于 Tanium
    notes: 规模和市场信号单元格只使用已保留的公开证据；在保留来源未披露精确收入或客户数量时，本表用心智份额、受管端点、政府或部署信号替代，避免编造财务数据。
