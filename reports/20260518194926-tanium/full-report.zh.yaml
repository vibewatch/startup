              联邦和更广公共部门敞口是 Tanium 最强的收入质量代理指标之一，尽管实际联邦 ARR 未披露。Carahsoft 列示 Tanium 覆盖 NASA SEWP V 至 2026 年 9 月、Army
              ITES-SW2 至 2030 年 8 月，以及若干延伸到 2027-2028 年的州、地方和教育采购工具，这显著扩大了采购触达，无需每次都重新招标。Tanium
              自有云和国防材料又增加第二层证据：公司营销面向美国政府的全托管 FedRAMP Moderate
              云，称平台可云端或本地部署，并表示受到美国武装部队六个军种信任。这些事实不等于已确认联邦收入，但确实指向粘性公共部门分发、真实合规投入，以及能够支撑长期合同和伙伴中介扩张的 go-to-market
              动作。财务含义对留存和 ASP 有利，但在 Tanium 披露订单或 ARR 中公共部门占比、通过渠道流动的比例，以及这些部署贡献的毛利率之前，判断仍不完整。
