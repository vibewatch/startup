      - number: '5.3'
        title: 集成与开发者界面
        blocks:
          - type: paragraph
            body: >-
              Tanium 的生态比其不大的开源足迹看起来更真实。公司开放了公共开发者门户、API 接入和开发者社区，而其公开 GitHub 组织只显示四个仓库和一个明显非核心的工作流工具 octobot。这个组合意味着
              Tanium 对集成友好，但不是开源驱动。更深的证据来自伙伴文档。Microsoft 的 Azure Sentinel 连接器依赖 Tanium Connect 和 Azure Logs Ingestion
              Workspaces，因此集成在运营上有意义，但仍是基于连接器。ServiceNow 更进一步：Tanium Service Graph Connector 要求 Tanium Cloud 资产视图，写入
              CMDB 和软件安装记录，并管理自己的令牌认证和轮换逻辑。ServiceNow Store 中专门的 Tanium SDK
              列表进一步说明这些工作流已经产品化。关键尽调细节是，许多高价值动作仍依赖伙伴系统——CMDB、SIEM、Now Assist 或工单层——而不是只靠 Tanium 原生执行。
