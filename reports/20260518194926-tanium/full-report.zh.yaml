  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户覆盖、买方匹配与规模证据
        blocks:
          - type: paragraph
            body: >-
              Tanium 的公开客户证据指向一个窄但可防守的客户基础：超大型企业和公共机构，它们更在意实时控制、合规和运营规模，而不是中端市场的低摩擦部署。公司当前客户页称，Tanium 服务 50% 的 Fortune
              100、美国前五大银行中的四家，以及美国武装部队全部六个军种。同一公开表面把这些集中度标记与运营结果数据配在一起，包括引用研究中的补丁效率提升 95%、生产率提升 70%、MTTR 降低
              75%。具名证据也集中在超大型端点群：AstraZeneca 约 125,000 个端点，Zurich 超过 100,000 个，JLL 接近 90,000 个，City of Phoenix 超过 20,000
              个。这意味着 Tanium 的甜蜜点是高价值资产场景，在那里安全、IT 运营和合规团队共享同一端点数据平面。仍缺失的是分母披露：Tanium
              公开营销集中度标记和旗舰客户标识，但不披露准确活跃客户数或分部收入组合。
