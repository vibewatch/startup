      - number: '5.2'
        title: 架构与部署模型
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开技术差异点仍是 Tanium 获专利的线性链式端点通信模型。在公司自己的架构简报中，传统中心辐射式工具会压垮 WAN 网段，在数万端点以上性能下降，并可能把紧急补丁拉长到数天或数周。Tanium
              主张其线性链式方法把大部分流量转移到本地网络路径上，并大幅压缩大型软件分发任务所需的链外连接数量。这个架构主张很重要，因为当前产品表面依赖近实时遥测：AWS Marketplace 列表和 Tanium
              架构材料都把 Core、生命周期管理和风险工作流描述为基于当前端点状态运行，而不是周期性扫描。公开伙伴文档也显示 Tanium 横跨多种部署形态。已发布证据支持 Tanium
              Cloud、本地打包和联邦政府云姿态；ServiceNow 指南则展示管理员在集成可靠运转前必须满足的具体网络和令牌依赖。
