        - 反复出现影响权限、令牌或核心服务器功能的多模块公告
        - 一个季度内出现两个或更多重大公告，或某个缺陷需要大范围轮换凭证
        - 将平台风险假设调差，并在给上行情景定价前，要求按模块披露补丁采用率、事件数量和客户暴露面。
