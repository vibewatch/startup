      - - Automox
        - 云原生补丁与控制平台
        - 公开 $1/endpoint/month 的 OS 补丁入门价
        - 优先考虑补丁卫生的云优先和混合团队
        - 透明定价、轻量部署、跨平台补丁
        - 复杂企业环境中的运维深度窄于 Tanium
      - - CrowdStrike Falcon for IT / Exposure Management（IT 与暴露面管理）
        - 安全牵引的修复和暴露平台
        - 单 Agent 暴露管理和 IT 自动化扩张
        - 把 Falcon 延伸到修复和 IT 自动化的安全团队
        - 自然语言查询、基于风险的补丁、广泛攻击面发现
