companyProfile:
  summary: >-
    EnerVenue commercializes NASA-heritage aqueous nickel-hydrogen batteries for stationary storage, targeting utility,
    commercial, and industrial projects that value long cycle life and improved safety posture over lithium-ion
    alternatives. The company is headquartered in Fremont, California, has shifted leadership under CEO Henning Rath,
    and is building high-volume manufacturing in Changzhou, China after earlier California automation setbacks.
  foundedDate: '2020-04-13'
