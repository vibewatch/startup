  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Legal and Regulatory Exposure: Contract Spoliation and Trade Headwinds'
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's operational execution is severely compromised by adversarial legal proceedings and emerging
              trade barriers. In the Southern District of Ohio, equipment manufacturer ATS Ohio initiated breach of
              contract litigation against EnerVenue in December 2023, claiming over $5.7 million in damages regarding an
              automated 100 MWh battery assembly line. The litigation escalated dramatically in September 2025 when
              District Judge Algenon L. Marbley issued an order finding that EnerVenue engaged in bad-faith spoliation
              by intentionally dismantling and destroying the central manufacturing line during active discovery.
              Consequently, the court dismissed EnerVenue's multi-million-dollar counterclaim, ordered a mandatory
              adverse inference instruction at trial, and assessed attorneys' fees against EnerVenue. Compounding this
              legal setback, EnerVenue's strategic transition of high-volume manufacturing to Changzhou, China forfeits
              lucrative Inflation Reduction Act domestic content adder subsidies in the United States while exposing its
              imported Energy Storage Vessels to escalating Section 301 tariffs and geopolitical supply chain
              restrictions.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
