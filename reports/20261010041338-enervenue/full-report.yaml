      - number: '1.4'
        title: Operational Milestones and Manufacturing Trajectory
        blocks:
          - type: paragraph
            body: >
              EnerVenue's commercial journey reflects rapid financing contrasted with difficult domestic manufacturing
              realities [CO005, CO012]. In late 2021, the company contracted ATS Ohio to construct an automated 100 MWh
              battery production line in California [CO012]. However, the relationship fractured over missed milestones
              and component failures, resulting in a December 2023 federal lawsuit by ATS seeking $5.7 million in unpaid
              fees [CO012]. EnerVenue admitted in discovery that the California line operated at only 20 MWh
              annually—20% of nameplate capacity—due to manual stacking constraints [CO013]. During litigation discovery
              in July 2024, EnerVenue disassembled and destroyed the assembly line, leading to severe sanctions in
              September 2025 when a federal judge dismissed EnerVenue's counterclaim for bad-faith spoliation and
              ordered adverse inference jury instructions [CO013, CO014]. Consequently, EnerVenue has shifted its
              primary manufacturing strategy to Changzhou, China, funding a 250 MWh production line in 2026 to target 1
              GWh capacity [CO010].
