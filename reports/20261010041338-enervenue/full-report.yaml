      - number: '5.4'
        title: Manufacturing Scale-Up and Factory Automation
        blocks:
          - type: paragraph
            body: >-
              Scaling alternative battery chemistries requires transitioning from manual laboratory assembly to highly
              automated industrial manufacturing [CE007, CE011]. On September 24, 2026, EnerVenue officially commenced
              commercial production at its first high-volume manufacturing facility in Wujin, Changzhou, Jiangsu
              Province, China [CE007]. The initial manufacturing line provides 250 MWh of annual production capacity,
              designed to produce approximately 300 fourth-generation AMC units per day [CE007, CE008]. According to
              Reuters, the plant is approximately 95% automated and was built for an estimated US$20 million to US$50
              million, substantially below the US$264 million expenditure previously projected for an abandoned factory
              proposal in Kentucky [CE008, CE010]. Because the AMC architecture differs fundamentally from lithium pouch
              or prismatic cells, EnerVenue developed custom manufacturing machinery [CE008]. The connected flow
              utilizes automated guided vehicles for inter-station transfers, machine-vision systems for electrode-stack
              alignment, automated tension-controlled fiberglass structural winding, and an integrated manufacturing
              execution system (MES) [CE008]. Every cell passes through 41 distinct quality checks across 11 test
              stations to verify weld integrity, leak tightness, and electrical performance before release [CE008].
              EnerVenue plans to expand the facility to 1 GWh in 2027 and multi-gigawatt-hour scale by 2028, supported
              by its US$300 million Series B extension [CE009, CE015].
