  - id: FM001
    title: Long-duration energy storage addressable opportunity layers
    type: pyramid
    summary: Hierarchical sizing lens from global stationary storage demand down to EnerVenue's verified pilot deployment base.
    data:
      items:
        - label: Total Stationary Grid Storage Demand
          value: Global renewable shifting and grid infrastructure requiring multi-hour energy storage
          detail: Macro market driven by clean energy mandates, solar/wind variability, and grid modernization.
          tone: neutral
        - label: Long-Duration Storage Segment (4-12+ Hours)
          value: Multi-hour daily cycling where lithium-ion degradation and fire suppression impose major costs
          detail: Primary addressable category including 48 GWh Saudi 2030 target and Dubai 8.4 GWh procurement.
          tone: neutral
        - label: High-Temperature & High-Cycle Niche
          value: Harsh operating environments (>45°C) and heavy daily duty (2-3 cycles/day)
          detail: Aqueous metal chemistry eliminates active HVAC and auxiliary fire suppression needs.
          tone: positive
        - label: Reported Commercial Pipeline
          value: 56 GWh prospective deals
          detail: EnerVenue-disclosed commercial interest pipeline representing an 8x expansion over 2023.
          tone: neutral
        - label: Announced Order Backlog
          value: $2.3 billion in orders
          detail: Customer commitments across utility and C&I buyers, though unverified by third-party audit.
          tone: neutral
        - label: Delivered Commercial Pilot Scale
          value: <100 MWh deployed base
          detail: Early pilot units and initial manufacturing lines; gigawatt-scale delivery remains unproven.
          tone: risk
    approximationNotes: >-
      Sizing layers represent qualitative and reported quantitative thresholds; order backlog reflects company-announced
      figures rather than audited GAAP commitments.
