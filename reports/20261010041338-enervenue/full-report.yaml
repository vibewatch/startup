      - number: '6.3'
        title: Empirical Customer Deployments and Field Pilot Verification
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer deployments remain limited in count but demonstrate expansion across
              demanding industrial applications. In September 2026, EnerVenue announced a commercial contract with a
              Chinese oil and gas producer to deploy 11 MWh of advanced nickel-hydrogen battery storage at an active oil
              field in northern China. This deployment serves as a major commercial proof point for high-capacity
              industrial electrification in extreme operating conditions. Earlier in May 2026, EnerVenue commissioned
              its first field pilot utilizing fourth-generation Aqueous Metal Cell technology at a Towngas-operated
              commercial site near Changzhou, China. The Towngas installation integrates on-site renewable energy
              generation with electric bus charging stations, subjecting the battery vessels to continuous deep cycling
              over two- to four-hour periods to match transit charging loads and reduce demand charges. Beyond direct
              owner deployments, EnerVenue maintains a multi-year investment and commercial collaboration agreement with
              Schlumberger New Energy to distribute stationary storage systems across global energy transition projects.
              These deployments validate operational safety and multi-hour discharge capabilities, though commercial
              conversion details and repeat purchasing commitments remain unverified.
