      - number: '6.4'
        title: Channel Concentration, Procurement Friction, and Assembly Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              EnerVenue faces structural procurement and channel concentration risks as it scales commercial
              distribution. The company relies extensively on large strategic intermediaries such as Schlumberger New
              Energy and municipal utility partners like Towngas to access international utility and industrial
              projects. This intermediary dependence limits direct account control and subjects deal velocity to partner
              capital deployment priorities. Procurement friction is further exacerbated by customer diligence
              requirements surrounding long-duration chemistry bankability, where lack of decades-long grid field
              operating history forces reliance on laboratory cycle models. Furthermore, historical manufacturing
              vulnerabilities continue to introduce delivery uncertainty into customer negotiations. In the ATS Ohio
              dispute, the federal district court dismissed EnerVenue's breach of contract counterclaim and ordered a
              mandatory adverse inference instruction regarding assembly line quality after finding EnerVenue engaged in
              bad faith spoliation by destroying the California line during active litigation. Demonstrating reliable
              shipment execution from Changzhou will be essential to overcoming customer procurement hesitation and
              securing binding utility offtake commitments.
