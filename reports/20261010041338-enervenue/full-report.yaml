  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer architectural hierarchy of EnerVenue's Aqueous Metal Cell platform from molecular electrochemistry
      through containerized utility integration.
    data:
      layers:
        - label: Electrochemistry & Core Cell Layer
          detail: >-
            Sealed Aqueous Metal Cell (AMC) utilizing nickel-hydroxide cathode, nickel-alloy anode, and alkaline
            water-based electrolyte
          modules:
            - Nickel-hydroxide cathode
            - Nickel-alloy anode
            - Water-based alkaline electrolyte
            - Sealed hydrogen pressure boundary
        - label: Cell Vessel & Mechanical Containment Layer
          detail: High-strength composite pressure vessel formed by automated tension-controlled fiberglass winding
          modules:
            - Automated fiberglass winding
            - Pressure-tight end caps
            - Weld integrity seals
            - Passive thermal conductive casing
        - label: Automated Manufacturing & Quality Layer
          detail: Wujin, Changzhou 250 MWh production line operating at 95% automation with 41 inline inspection gates
          modules:
            - Machine-vision electrode stacking
            - AGV automated transfer
            - 11 test and measurement stations
            - MES unified tracking
        - label: Rack & Enclosure Integration Layer
          detail: Modular enclosures (Energy Core 30 kWh, Energy Cube 108 kWh, Energy Rack 150 kWh) with native DC busing
          modules:
            - DC bus interconnects
            - Structural rack framework
            - Non-HVAC ambient thermal dissipation
            - String overcurrent protection
        - label: Containerized Utility Architecture Layer
          detail: >-
            Energy Prism containerized platform combining multiple racks for multi-MWh utility and industrial
            deployments
          modules:
            - Energy Prism 20ft/40ft containers
            - Balance-of-plant power wiring
            - External inverter interface
            - Zero fire-suppression footprint
        - label: Grid Management & Control Layer
          detail: Battery Management System (BMS) and SCADA integration supporting continuous 3-cycle/day utility dispatch
          modules:
            - Individual cell voltage/pressure telemetry
            - State-of-charge calculation
            - Utility SCADA / EMS interface
            - Multi-duration dispatch logic
    approximationNotes: >-
      Architecture represents functional subsystems of the 4th-generation AMC platform based on factory specifications
      and technical disclosures; proprietary internal circuit designs are omitted.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
