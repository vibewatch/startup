      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              EnerVenue was founded by Stanford University materials science professor Dr. Yi Cui, whose research into
              low-cost metal-hydrogen catalysts forms the scientific bedrock of the enterprise [CO001]. Dr. Cui chairs
              the board of directors, providing technological continuity and academic credibility [CO004]. Technological
              execution is stewarded by Chief Technology Officer Dr. Majid Keshavarz, a veteran battery scientist with
              over 25 years of storage development experience across multiple non-lithium chemistries [CO004]. In March
              2026, the company executed a significant leadership transition by appointing Henning Rath as Chief
              Executive Officer [CO003]. Rath previously served as Chief Supply Chain Officer at European greentech
              unicorn Enpal and founded micro-mobility startup CIRC [CO003]. His appointment marks a deliberate shift
              from early scientific validation toward industrial manufacturing scale and international deployment
              [CO003].
