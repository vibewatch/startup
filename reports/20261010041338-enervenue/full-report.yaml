      - number: '5.5'
        title: Field Deployment Traction and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's commercial transition is validated by early field deployments and utility evaluations, but
              remains exposed to manufacturing ramp and yield risks [CE009, CE011, CE012]. In September 2026, the
              company secured its first multi-megawatt-hour commercial contract, comprising 26 Energy Prism
              containerized storage units totaling 11 MWh for a solar-powered oilfield microgrid in northern China, with
              deliveries commencing in December 2026 [CE012]. This follows an operating pilot deployed with Towngas in
              Jintan, Changzhou, where 50 fourth-generation cells in an Energy Rack configuration have cycled
              continuously since late 2025 pairing solar generation with electric bus charging [CE013]. Meanwhile, RWE
              Clean Energy continues pilot evaluation of EnerVenue's Energy Storage Vessels in Milwaukee to assess
              operational endurance under real-world cycling [CE014]. Despite these milestones, historical execution
              reveals critical scaling vulnerabilities [CE011]. In federal litigation with automation supplier ATS Ohio,
              EnerVenue disclosed that its prior California pilot line achieved only 20 MWh annually (20% of nameplate
              100 MWh capacity) due to a missing automated stacking module that forced manual cell stacking, before
              EnerVenue decommissioned the assembly line in July 2024 [CE011]. Successfully scaling the Changzhou
              facility to 1 GWh will require sustained manufacturing yields, reliable supplier execution, and long-term
              third-party verification of real-world degradation rates [CE008, CE009].
