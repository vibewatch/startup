            Federal court finds EnerVenue destroyed the assembly line in bad faith during discovery, dismissing
            EnerVenue's counterclaim.
          tone: negative
        - label: Series B+ Financing & Leadership Pivot
          date: 2026-03
          detail: >-
            EnerVenue secures $300 million Series B+ led by Full Vision Capital, names Henning Rath as CEO, and plans
            Changzhou factory.
