      - number: '5.2'
        title: Product Portfolio and Modularity
        blocks:
          - type: paragraph
            body: >-
              To address varied customer operational profiles, EnerVenue standardizes its fourth-generation Aqueous
              Metal Cell across four modular hardware configurations [CE006]. The Energy Core provides a 30 kWh building
              block designed for distributed, off-grid, and remote infrastructure deployments [CE006]. The Energy Cube
              packages 108 kWh of storage for commercial buildings, urban substations, and power-dense data centers
              where fire safety is a critical procurement requirement [CE003, CE006]. The Energy Rack scales capacity to
              150 kWh for commercial and industrial solar-plus-storage projects, microgrids, and electric vehicle fleet
              charging depots, enabling high-utilization continuous cycling across two-to-four-hour windows [CE004,
              CE006, CE013]. For utility-scale renewable shifting and transmission-level grid support, EnerVenue offers
              Energy Prism, a containerized platform combining multiple rack modules into multi-megawatt-hour
              installations [CE006, CE012]. Standardizing on a single core cell chemistry across all four product lines
              simplifies testing, factory tooling, and supply chain management while allowing flexible field scaling
              [CE005, CE006].
