              EnerVenue's decision to abandon its $264 million Kentucky gigafactory after securing $30M in state
              incentives highlights unresolved manufacturing economics. Pivoting high-volume production of its
              fourth-generation cell to Changzhou, China forfeits U.S. domestic content bonuses under the IRA while
              creating tariff and supply-chain vulnerabilities.
            calloutType: risk
            claimRefs:
