      - number: '8.4'
        title: Diligence Roadblocks & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Institutional underwriters evaluating EnerVenue face three non-negotiable diligence roadblocks that cannot
              be resolved through public marketing releases or technical whitepapers. First, underwriters require
              certified GAAP financial statements, detailed trailing cash burn schedules, and the full capitalization
              table to evaluate liquidation preference seniority across Series A, Series B, and subsequent debt
              tranches. Second, investors must conduct an independent engineering review of the Changzhou production
              facility, inspecting certified cell degradation curves, module yields, and environmental health
              compliance. Third, legal diligence must audit unresolved contract claims and exposure stemming from the
              ATS Ohio litigation, where Judge Marbley dismissed EnerVenue's counterclaims and ordered mandatory adverse
              inferences regarding line quality and performance. Immediate thesis-break triggers that would convert our
              research-more rating into an outright negative recommendation include a final monetary judgment exceeding
              $5 million in the ATS lawsuit, unmitigated supply chain delays exceeding six months at the Changzhou
              plant, or documented cell field failures in utility customer pilot installations.
            claimRefs:
              - CV005
              - CV006
