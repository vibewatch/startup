      Chronological development of EnerVenue from Stanford research and Delaware incorporation to California litigation
      and 2026 Series B+ expansion.
    data:
      items:
        - label: Incorporation & Research Genesis
          date: 2020-04
          detail: >-
            EnerVenue is incorporated in Delaware on April 13, 2020, to adapt Dr. Yi Cui's NASA-heritage metal-hydrogen
            battery research.
          tone: positive
        - label: Seed Financing
          date: 2020-08
          detail: >-
            EnerVenue raises a $12 million seed round to build laboratory prototypes and establish California
            headquarters.
          tone: positive
        - label: Series A Capital Infusion
          date: 2021-09
          detail: >-
            EnerVenue secures $100 million Series A round from strategic and financial investors to accelerate
            productization.
          tone: positive
        - label: Manufacturing Automation Contract
          date: 2021-12
          detail: EnerVenue contracts ATS Ohio to build an automated 100 MWh battery assembly line in California.
          tone: neutral
        - label: Manufacturing Breach & Litigation
          date: 2023-12
          detail: >-
            ATS Ohio sues EnerVenue in Ohio federal court for $5.7M in unpaid fees after EnerVenue stops payment amidst
            technical disputes.
