      - number: '7.2'
        title: 'Operational and Manufacturing Bottlenecks: Factory Scrapping and Facility Downsizing'
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's manufacturing history is marked by repeated technical resets and abandoned infrastructure
              commitments. During the week of July 7, 2024, the company decommissioned and completely dismantled its
              primary 100 MWh battery assembly line at its Fremont, California facility, scattering modular hardware
              between California, China, and third-party liquidation channels. This equipment destruction coincided with
              acute operational contraction, culminating in a September 2024 WARN notice that terminated 65 workers in
              Fremont. Two months later, in November 2024, EnerVenue formally cancelled its flagship $264 million
              gigafactory project in Shelby County, Kentucky, surrendering approximately $30 million in state and
              municipal tax incentives. Management defended abandoning the Kentucky facility by citing the need to
              leapfrog directly to its fourth-generation aqueous-metal cell architecture rather than commercializing an
              uneconomic prior design. However, the surrender of the site to lithium competitor Canadian Solar
              underscores persistent difficulties in translating laboratory-scale nickel-hydrogen chemistry into
              cost-effective terrestrial manufacturing.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR010
