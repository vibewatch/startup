  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Market Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              EnerVenue targets stationary energy storage across utility-scale grid infrastructure, commercial and
              industrial microgrids, and heavy industrial operations. The company's value proposition addresses four
              distinct customer personas: regulated electric utilities seeking long-duration grid firming and peaker
              plant replacement; independent power producers optimizing renewable integration and power arbitrage;
              energy extraction and industrial facilities requiring durable off-grid microgrids; and municipal fleet
              operators deploying high-throughput electric bus charging hubs. Because nickel-hydrogen chemistry operates
              with a water-based electrolyte without risk of thermal runaway, EnerVenue positions its Energy Storage
              Vessels for installation in remote or harsh industrial operating environments where lithium-ion safety
              risks and fire suppression overhead present significant operational barriers. In the United States,
              commercial sales infrastructure remains in early formation, as EnerVenue has actively recruited its first
              dedicated domestic sales director to initiate outbound pipeline generation, lead qualification, and
              complex contract negotiation with utilities and EPC developers. Prospective buyers interact primarily with
              technical datasheets, whitepapers, and market briefings distributed via EnerVenue's Industry Hub to model
              project economics and evaluate cycle life claims prior to commercial commitment.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU013
