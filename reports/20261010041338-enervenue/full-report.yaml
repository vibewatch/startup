chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Mission
        blocks:
          - type: paragraph
            body: >
              EnerVenue, Inc. was incorporated in Delaware on April 13, 2020, to commercialize metal-hydrogen battery
              technology originally engineered for aerospace applications [CO002]. Operating from headquarters in
              Fremont, California, the company adapts NASA-proven aqueous nickel-hydrogen chemistry into durable
              stationary energy storage systems designed for utility-scale grids, commercial facilities, and high-demand
              compute infrastructure [CO001, CO011]. EnerVenue claims its battery architecture delivers up to 30,000
              cycles across a 30-year operational life with minimal degradation, presenting an alternative to
              lithium-ion chemistry [CO011]. Cumulative funding estimates range from $412 million to over $700 million
              across venture rounds, though private commercial databases suggest funding totals reaching $1.08 billion
              [CO006]. Audited revenue, commercial ARR, and gross margins remain undisclosed [CO015], while workforce
              estimates place active headcount at approximately 102 personnel [CO009].
