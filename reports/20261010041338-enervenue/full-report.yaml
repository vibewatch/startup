              - CV007
              - CV008
              - CV011
              - CV013
      - number: '8.3'
        title: Valuation Scenarios & Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Because EnerVenue discloses neither operating revenue nor EBITDA margins, traditional comparative
              multiples (such as EV/ARR or EV/EBITDA) cannot be quantitatively underwritten from public disclosures.
              Instead, valuation outcomes depend entirely on manufacturing ramp success in Changzhou and legal liability
              management in the United States. In our 20% probability bull case, the Changzhou 250 MWh facility achieves
              target electrochemical yields during 2026, enabling utility pilots to transition into binding
              multi-gigawatt-hour supply agreements that justify an enterprise valuation exceeding $1.5 billion based on
              peer hardware multiples. In our 55% probability base case, commissioning milestones encounter modest
              logistical delays and margin compression from initial ramp inefficiencies, keeping valuation anchored
              between $700 million and $900 million while requiring subsequent equity tranches. In our 25% probability
              bear case, offshore cell manufacturing faces severe cost overruns or quality defects, while adverse court
              inferences in the ATS Ohio lawsuit produce substantial damages liabilities, prompting an inside-led down
              round or punitive recapitalization below cumulative invested capital. Critical downside triggers include
              adverse court judgments exceeding existing escrow reserves, export-control restrictions on battery
              components manufactured in China, and customer cancellations following missed utility delivery windows.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV013
