      - number: '1.3'
        title: Capitalization and Strategic Stakeholder Structure
        blocks:
          - type: paragraph
            body: >
              EnerVenue's capital structure combines venture backing, strategic industrial partners, and sovereign
              patient capital [CO006, CO008]. In March 2026, the company secured a $300 million Series B+ preferred
              stock financing extension led by green investment firm Full Vision Capital [CO005]. Full Vision Capital,
              which incubated the business and whose managing partner Alan Chan serves as co-founder, has taken a
              central governance role alongside the new executive slate [CO005]. The financing also introduced the Hong
              Kong Investment Corporation (HKIC) as a strategic government-backed investor [CO007]. HKIC's participation
              is tied to establishing a regional headquarters and materials innovation center in Hong Kong [CO007].
              Earlier corporate syndicates included strategic energy investors such as Schlumberger (SLB) and Aramco
              Ventures, reflecting global interest in long-duration grid storage [CO008].
