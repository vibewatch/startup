      - number: '7.3'
        title: 'Partner and Commercial Dependencies: Framework Backlog and Supply Chain Exposure'
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's commercial pathway exhibits acute counterparty concentration and unverified backlog
              durability. While the company frequently promotes 5 GWh in cumulative customer commitments, public
              disclosures indicate that this volume consists predominantly of non-binding memorandums of understanding
              and multi-year framework arrangements—such as the 2.4 GWh Pine Gate Renewables agreement and Puerto Rico
              microgrid pacts—rather than enforceable, revenue-recognized purchase orders. No audited conversion metrics
              or milestone-based delivery schedules have been disclosed to corroborate that these framework agreements
              will convert to firm billing. Furthermore, the company's operational restructuring led to the November
              2024 departure of founding Chief Executive Officer Jorg Heinemann. While EnerVenue appointed former Enpal
              supply-chain executive Henning Rath in March 2026 and secured a $300 million Series B extension led by
              Full Vision Capital and Aramco Ventures, its operational viability remains heavily reliant on concentrated
              capital providers and a nascent municipal manufacturing partnership in Changzhou, China.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
