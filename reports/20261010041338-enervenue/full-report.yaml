        title: Exhibits
        blocks:
          - type: callout
            title: Federal Court Spoliation Sanctions and Equipment Destruction
            body: >-
              EnerVenue faces severe legal and operational headwinds following the September 2025 federal court ruling
              in ATS Ohio v. EnerVenue. The court found that EnerVenue acted in bad faith by dismantling and destroying
              its 100 MWh automated battery assembly line during ongoing litigation, resulting in the complete dismissal
              of EnerVenue's counterclaim and mandatory adverse inferences at trial.
