  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation & Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              EnerVenue presents a sharp dichotomy between impressive strategic capital formation and acute execution
              opacity. The company has accumulated $1.08 billion in aggregate financing across seven funding rounds,
              highlighted by a $300 million Series B equity round closed in spring 2026 led by Full Vision Capital. This
              financing package was positioned to fund the construction of a high-volume manufacturing complex in
              Changzhou, China, targeting 250 MWh of initial capacity and an eventual 1 GWh run rate. However, public
              records reveal zero audited revenue, undisclosed commercial gross margins, and no verifiable customer cash
              collections. Furthermore, ongoing federal contract litigation in Ohio resulted in judicial findings that
              EnerVenue acted in bad faith by intentionally destroying its California battery assembly line. In the
              absence of audited financial statements, customer concentration data, or verified manufacturing yields,
              committing growth equity at prevailing venture benchmarks carries unquantifiable downside. We assign a
              research-more recommendation paired with a high risk rating and a stretched valuation stance, advising
              prospective investors to withhold equity capital until proprietary plant yields and audited offtake
              revenues are independently corroborated under non-disclosure review.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
