      - number: '6.2'
        title: Commercial Adoption Trajectory and Manufacturing Alignment
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's commercial adoption trajectory is fundamentally gated by factory manufacturing capacity rather
              than top-of-funnel customer interest. The company requires prospective commercial buyers to execute
              manufacturing reservations to secure allocation ahead of high-volume production schedules. EnerVenue has
              centralized its volume manufacturing strategy at its production hub in Changzhou, China, where it is
              scaling an initial 250 MWh production line while engineering a broader 1 GWh facility expansion. This
              pivot toward centralized Chinese manufacturing followed severe domestic assembly line setbacks in Fremont,
              California. In federal litigation with automated equipment vendor ATS Ohio, court records revealed that
              EnerVenue's California assembly line achieved a maximum throughput of only 20 MWh annually, representing
              just 20% of its planned 100 MWh nameplate capacity due to absent stacking automation. EnerVenue
              subsequently dismantled the California line in July 2024. Consequently, customer adoption schedules depend
              directly on Changzhou production yield and cross-border equipment delivery, while total dollar backlog,
              customer retention rates, and net revenue retention figures remain entirely undisclosed.
            claimRefs:
              - CU001
              - CU003
