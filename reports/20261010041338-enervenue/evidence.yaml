evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-financial-performance
    missingEvidence: Audited financial statements showing annual revenue, commercial ARR, gross margins, and operational cash burn.
    whyItMatters: >-
      Without financial disclosures, valuation and commercial viability cannot be verified against claimed manufacturing
      scale.
    diligencePath: Request audited financial statements, historical income statements, and management accounts under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: executive-and-board-governance
    missingEvidence: >-
      Complete roster of EnerVenue's executive leadership, vice presidents, independent board directors, and committee
      assignments.
    whyItMatters: >-
      Identifies key-person dependencies, governance oversight rigor, and potential executive turnover beyond public
      C-suite disclosures.
    diligencePath: Obtain company organizational chart and board composition disclosures during management diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-investor-rights
    missingEvidence: >-
      Full capitalization table, liquidation preferences, voting control agreements, and debt covenants across all
      funding rounds.
    whyItMatters: >-
      Determines minority shareholder protections, waterfall distribution economics, and Full Vision Capital / HKIC
      governance control.
    diligencePath: Review detailed capitalization table, investor rights agreements, and preferred stock voting covenants.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-backlog-verification
    missingEvidence: >-
      Audited customer-level order book disclosing firm prepayment deposits, cancellation rights, and contract delivery
      schedules.
    whyItMatters: >-
      EnerVenue cites $2.3 billion in orders and 56 GWh in sales pipeline, but private-company status obscures what
      percentage represents legally binding take-or-pay agreements versus non-binding letters of intent.
    diligencePath: >-
      Request customer-by-customer backlog schedule during formal sponsor diligence, cross-checking contract terms,
      liquidated damages, and customer pilot test reports.
    relatedQuestionRefs:
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: named-competitor-profiles
    missingEvidence: >-
      Named direct and adjacent competitor profiles with current funding, installed scale, target segments, strategic
      direction, and comparable field performance.
    whyItMatters: >-
      Category-level alternatives cannot establish whether EnerVenue is gaining or losing ground against specific
      vendors in active procurement.
    diligencePath: >-
      Obtain a live bid list from management and customers, then collect primary product, financing, deployment, and
      certification records for each named vendor.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-switching
    missingEvidence: >-
      Comparable project quotes, realized contract prices, warranty terms, discounts, switching costs, multi-homing
      terms, and internal-build cost models.
    whyItMatters: >-
      Without like-for-like commercial terms, the claimed lifetime-cost advantage and buyer lock-in cannot be tested
      against incumbent alternatives.
    diligencePath: >-
      Request anonymized customer bids and executed order schedules, including equipment, EPC, warranty, service,
      augmentation, and performance-guarantee terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-reporting-and-revenue-recognition
    missingEvidence: >-
      Audited financial statements, historical GAAP revenue, recognized hardware gross margins, and annual operating
      cash burn rates.
    whyItMatters: >-
      Without audited financial disclosures or recognized revenue metrics, investors cannot evaluate unit-level
      profitability, manufacturing conversion efficiency, or true cash consumption.
    diligencePath: >-
      Request audited financial statements, historical balance sheets, cash flow statements, and customer contract
      accounting schedules in virtual data room.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: manufacturing-capex-and-warranty-liabilities
    missingEvidence: >-
      Changzhou factory build-out capex audit, line yield metrics, and detailed warranty reserve provisions for 30-year
      equipment guarantees.
    whyItMatters: >-
      Given past automated assembly line failure and spoliation litigation in California, manufacturing execution in
      China and long-term warranty liabilities represent the primary threats to future cash solvency.
    diligencePath: >-
      Review independent engineer technical audits of the Changzhou production facility, automated yield logs, and
      contractual warranty liability indemnity terms.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: field-degradation-and-efficiency
    missingEvidence: >-
      Multi-year metered operational data from independent third-party utility deployments verifying real-world
      round-trip efficiency (AC-AC) and degradation slopes across 10,000+ continuous cycles.
    whyItMatters: >-
      While EnerVenue rates its AMC chemistry for 30,000 cycles and >90% peak efficiency, laboratory accelerated testing
      and initial pilot deployments (e.g. Towngas, RWE) have not yet accumulated multi-year continuous utility operating
      history to prove long-term warranty and bankability assumptions.
    diligencePath: >-
      Obtain independent engineering reports (e.g., DNV, UL) and operational performance telemetry from RWE Clean Energy
      or Towngas pilot installations under heavy continuous cycling.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: Customer backlog and binding contract terms
    missingEvidence: >-
      Audited customer-level backlog detailing binding purchase orders, cancellation rights, liquidated damages, and
      delivery milestones for grid storage projects.
    whyItMatters: >-
      Distinguishing non-binding memorandums of understanding and reservations from irrevocable offtake commitments is
      critical to evaluating revenue runway.
    diligencePath: >-
      Review customer master service agreements, letters of credit, and offtake schedules during confidential data-room
      review.
    relatedQuestionRefs:
      - QU002
      - QU009
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: material
    topic: Field degradation and multi-year customer retention rates
    missingEvidence: >-
      Third-party customer operational logs showing round-trip efficiency, degradation, and cycle performance under
      utility-scale field operating conditions.
    whyItMatters: >-
      Validating the company's 30,000-cycle claim in real customer deployments is necessary to confirm customer lifetime
      value and warranty liability exposure.
    diligencePath: Obtain independent engineering reports from pilot operators such as Towngas and active oil field deployment sites.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: litigation
    missingEvidence: Comprehensive docket inspection of ongoing claims and post-sanctions fee awards in ATS Ohio v. EnerVenue.
    whyItMatters: >-
      Final fee awards and trial outcome under adverse inferences will establish cash liabilities and confirm
      manufacturing equipment provenance.
    diligencePath: >-
      Inspect updated PACER docket filings in the Southern District of Ohio and subpoena trial exhibits regarding
      equipment status.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: commercial-risk
    missingEvidence: >-
      Customer-by-customer backlog audit disclosing binding purchase orders, cancellation clauses, and revenue
      recognition schedules.
    whyItMatters: >-
      EnerVenue claims 5 GWh of orders, but lack of revenue disclosure prevents underwriting commercial conversion and
      cash runway.
    diligencePath: >-
      Request customer master service agreements, escrow terms, and milestone delivery schedules during investment
      diligence.
  - type: missing-source
    severity: material
    topic: warranty-risk
    missingEvidence: >-
      Multi-year third-party degradation and operating field data from utility deployments supporting the 20-year and
      30,000-cycle warranty.
    whyItMatters: >-
      Warranty liabilities could produce severe unmodeled cash drain if real-world degradation or self-discharge exceeds
      lab projections.
    diligencePath: Obtain independent engineering reports from DNV, Black & Veatch, or pilot customers such as RWE and Towngas.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements showing revenue, gross margin, operating expenses, cash burn, and balance sheet cash
      reserves.
    whyItMatters: >-
      Without revenue and cash burn data, investors cannot calculate enterprise value multiples or model runway to
      commercial self-sufficiency.
    diligencePath: >-
      Request audited GAAP financials, current capitalization table with liquidation preferences, and trailing
      twelve-month cash flow statements under NDA.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: manufacturing-backlog
    missingEvidence: >-
      Independent engineering audit of Changzhou factory construction milestones, cell yield rates, and customer
      purchase order binding terms.
    whyItMatters: >-
      Following California assembly line spoliation sanctions, commercial delivery depends entirely on unverified
      offshore ramp execution.
    diligencePath: >-
      Review EPC construction contracts, factory commissioning audit reports, and customer master service agreements
      with cancellation terms.
    relatedQuestionRefs:
      - QV004
      - QV007
