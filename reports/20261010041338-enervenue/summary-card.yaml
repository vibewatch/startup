  topStrengths:
    - Differentiated nickel-hydrogen chemistry with long-life and safety claims that remain commercially interesting.
    - Material 2026 capital backing and leadership reset support factory buildout and commercialization.
    - Evidence of early pilots, a disclosed 11 MWh order, and a 250 MWh Changzhou line show real operating progress.
  topRisks:
    - Audited revenue, margin, burn, and pricing disclosure are still missing, so economics remain hard to underwrite.
    - Prior manufacturing execution failure and litigation history raise credibility questions around scale-up quality.
    - Customer conversion, order quality, and project-level switching economics remain only partially evidenced.
  unresolvedGaps:
    - >-
      Need audited revenue, gross margin, burn, and cap-table or liquidation-preference materials before underwriting
      downside.
    - >-
      Need independent verification of Changzhou ramp timing, Gen 4 certification or recertification status, and
      manufacturing yield quality.
    - >-
      Need a customer-by-customer backlog quality review showing binding orders, concentration, cancellation rights, and
      pilot-to-production conversion rates.
