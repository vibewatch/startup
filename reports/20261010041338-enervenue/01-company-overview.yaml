callouts:
  - calloutType: "risk"
    title: "Domestic Manufacturing Setback & Judicial Sanctions"
    body: "EnerVenue's early effort to establish automated high-volume production in Fremont suffered severe execution setbacks. The company's contracted 100 MWh line reached only 20 MWh of annual throughput before being dismantled in July 2024. In September 2025, a federal court dismissed EnerVenue's counterclaim and ordered adverse inference jury instructions due to bad-faith evidence spoliation, creating ongoing legal liabilities and forcing a strategic reliance on overseas manufacturing in Changzhou, China."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
  - calloutType: "insight"
    title: "Strategic Reset via Series B+ and Leadership Transition"
    body: "The March 2026 closing of a $300 million Series B+ preferred stock extension led by Full Vision Capital and backed by HKIC provides essential capital runway for EnerVenue. By appointing Henning Rath—an executive seasoned in European clean-tech scaling—the company is shifting from academic founder stewardship toward disciplined industrialization, targeting 250 MWh and 1 GWh production milestones while expanding commercial reach across Asian and European storage markets."
    claimRefs:
      - "CO003"
      - "CO005"
      - "CO007"
      - "CO010"
