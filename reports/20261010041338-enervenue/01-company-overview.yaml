company:
  name: "EnerVenue"
chapter:
  number: 1
  title: "Company Overview"
  summary: "EnerVenue commercializes NASA-heritage nickel-hydrogen battery technology for stationary energy storage, having secured over $400 million in venture funding, including a $300 million Series B+ extension in 2026. Following early California automation setbacks and federal spoliation sanctions, the company appointed former Enpal CSCO Henning Rath as CEO and pivoted manufacturing toward Changzhou, China, to scale 250 MWh and 1 GWh capacity."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity and Mission"
    body: |
      EnerVenue, Inc. was incorporated in Delaware on April 13, 2020, to commercialize metal-hydrogen battery technology originally engineered for aerospace applications [CO002]. Operating from headquarters in Fremont, California, the company adapts NASA-proven aqueous nickel-hydrogen chemistry into durable stationary energy storage systems designed for utility-scale grids, commercial facilities, and high-demand compute infrastructure [CO001, CO011]. EnerVenue claims its battery architecture delivers up to 30,000 cycles across a 30-year operational life with minimal degradation, presenting an alternative to lithium-ion chemistry [CO011]. Cumulative funding estimates range from $412 million to over $700 million across venture rounds, though private commercial databases suggest funding totals reaching $1.08 billion [CO006]. Audited revenue, commercial ARR, and gross margins remain undisclosed [CO015], while workforce estimates place active headcount at approximately 102 personnel [CO009].
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO006"
      - "CO009"
      - "CO011"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance"
    body: |
      EnerVenue was founded by Stanford University materials science professor Dr. Yi Cui, whose research into low-cost metal-hydrogen catalysts forms the scientific bedrock of the enterprise [CO001]. Dr. Cui chairs the board of directors, providing technological continuity and academic credibility [CO004]. Technological execution is stewarded by Chief Technology Officer Dr. Majid Keshavarz, a veteran battery scientist with over 25 years of storage development experience across multiple non-lithium chemistries [CO004]. In March 2026, the company executed a significant leadership transition by appointing Henning Rath as Chief Executive Officer [CO003]. Rath previously served as Chief Supply Chain Officer at European greentech unicorn Enpal and founded micro-mobility startup CIRC [CO003]. His appointment marks a deliberate shift from early scientific validation toward industrial manufacturing scale and international deployment [CO003].
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-structure"
    title: "Capitalization and Strategic Stakeholder Structure"
    body: |
      EnerVenue's capital structure combines venture backing, strategic industrial partners, and sovereign patient capital [CO006, CO008]. In March 2026, the company secured a $300 million Series B+ preferred stock financing extension led by green investment firm Full Vision Capital [CO005]. Full Vision Capital, which incubated the business and whose managing partner Alan Chan serves as co-founder, has taken a central governance role alongside the new executive slate [CO005]. The financing also introduced the Hong Kong Investment Corporation (HKIC) as a strategic government-backed investor [CO007]. HKIC's participation is tied to establishing a regional headquarters and materials innovation center in Hong Kong [CO007]. Earlier corporate syndicates included strategic energy investors such as Schlumberger (SLB) and Aramco Ventures, reflecting global interest in long-duration grid storage [CO008].
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-manufacturing-evolution"
    title: "Operational Milestones and Manufacturing Trajectory"
    body: |
      EnerVenue's commercial journey reflects rapid financing contrasted with difficult domestic manufacturing realities [CO005, CO012]. In late 2021, the company contracted ATS Ohio to construct an automated 100 MWh battery production line in California [CO012]. However, the relationship fractured over missed milestones and component failures, resulting in a December 2023 federal lawsuit by ATS seeking $5.7 million in unpaid fees [CO012]. EnerVenue admitted in discovery that the California line operated at only 20 MWh annually—20% of nameplate capacity—due to manual stacking constraints [CO013]. During litigation discovery in July 2024, EnerVenue disassembled and destroyed the assembly line, leading to severe sanctions in September 2025 when a federal judge dismissed EnerVenue's counterclaim for bad-faith spoliation and ordered adverse inference jury instructions [CO013, CO014]. Consequently, EnerVenue has shifted its primary manufacturing strategy to Changzhou, China, funding a 250 MWh production line in 2026 to target 1 GWh capacity [CO010].
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
