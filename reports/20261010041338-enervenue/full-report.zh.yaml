        blocks:
          - type: paragraph
            body: >
              EnerVenue 的资本结构由风险投资、战略工业伙伴和主权耐心资本构成。2026 年 3 月，公司获得 Full Vision Capital 领投的 $300 million Series B+
              优先股扩展融资；Full Vision Capital 曾孵化公司，管理合伙人 Alan Chan 兼任联合创始人。融资引入政府支持的 HKIC，参与条件包括在 Hong Kong
              建立区域总部和材料创新中心。此前投资者还包括 Schlumberger（SLB）和 Aramco Ventures。
