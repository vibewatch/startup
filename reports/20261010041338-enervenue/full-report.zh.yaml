            body: >-
              EnerVenue 的商业路径存在严重对手方集中和积压耐久性未核实问题。公司经常宣传累计客户承诺 5 GWh，但公开披露显示主要是无约束力谅解备忘录和多年框架安排，如 2.4 GWh Pine Gate
