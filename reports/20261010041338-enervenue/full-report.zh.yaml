              于 2024 年 11 月离任。尽管 2026 年 3 月任命前 Enpal 供应链高管 Henning Rath，并由 Full Vision Capital 和 Aramco Ventures 领投 $300
              million Series B 扩展轮，运营可行性仍高度依赖集中资本提供者和 Changzhou 尚处早期的市政制造合作。
