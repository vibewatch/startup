  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与固定式储能范围
        blocks:
          - type: paragraph
            body: >-
              长时储能是清洁电网转型中的独立运营类别。固定式电网储能吸收大规模发电盈余，并在 4 至 12
              小时甚至更长的放电区间提供稳定容量；市场包括公用事业级可再生能源平滑、输电拥堵缓解和工业微电网。移动交通及消费电子排除在外，因为其要求水系金属体系难以经济提供的高体积能量密度。EnerVenue
              聚焦固定式基础设施，强调运营韧性、低辅助制冷负担和无灾难性热失控风险。
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
      - number: '2.2'
        title: 可服务市场规模与区域需求驱动
        blocks:
          - type: paragraph
            body: >-
              评估长时储能市场需结合多种采购视角，而非单一宏观预测。Saudi Power Procurement Company 要求 2030 年前配套 130 GW 可再生能源建设 48 GWh 电网储能；Dubai
              第七期招标规定 6 小时放电周期内配置 8,400 MWh。EnerVenue 据报道截至 2024 年中拥有 56 GWh 潜在销售管线和约 $2.3 billion 订单，较 2023
              年扩大八倍。但公司尚未交付可运行的 gigawatt 级项目，自动化产线计划还因设备里程碑与 ATS Ohio 发生争议。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
              - CM009
      - number: '2.3'
        title: 买方分层与采购动态
        blocks:
          - type: paragraph
            body: >-
              长时电网储能买方群体的回报门槛和合同要求各不相同。独立电力生产商关注 15 至 20 年内的购电协议可用性和容量衰减；受监管电力公司关注容量稳固、变电站延期和黑启动。AI
              数据中心及孤立工业设施为高温下的安全和系统存活支付溢价，借此降低保险和土建成本。15 至 30 年建造—拥有—运营结构把技术风险转给资产所有者，采购也从首日价格转向累计可用能源。
            claimRefs:
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM013
              - CM014
      - number: '2.4'
        title: 采用约束、权衡与尽调现实
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 虽有循环寿命和安全优势，采用仍受约束。镍氢每千瓦时初始成本高于磷酸铁锂，20 至 30 年平准化成本依赖尚未在现场验证的寿命；两小时放电往返效率约 85%，快速调频竞争力较弱。2023 年
              12 月，ATS Ohio 就超过 $5.7 million 未付发票起诉 EnerVenue，暴露自动化设备调试摩擦。私营公司不透明也使 $2.3 billion
              订单管线的现金预付款、取消罚金和客户集中度无法核实。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 采购转向全生命周期储能吞吐量
            body: 新兴建造—拥有—运营采购越来越按 20 至 30 年累计可用吞吐量，而非首日每千瓦时成本评估，为不衰减化学体系打开机会。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: callout
            title: 资本密集度与商业验证瓶颈
            body: EnerVenue 虽报告数十亿美元销售管线，却尚未证明 gigawatt 级现场可靠性；试点装配自动化诉讼凸显量产的资本密集型摩擦。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：现有厂商、邻近方案、替代品与空白
        blocks:
          - type: paragraph
            body: >-
              相关竞争范围不止于电池初创公司。EnerVenue
              与成熟锂离子系统争夺固定式储能项目，液流电池和抽水蓄能则是长时场景替代方案。买方还可自行集成或延迟部署，但公开证据未量化这两条路径。资料未找到具备可比规模、融资、定价或现场历史的镍氢同业，因此直接同业比较仍是明确证据缺口。EnerVenue
              的公开证明尚处早期：150 kWh Towngas 试点、额定 250 MWh 的 Changzhou 产线和披露的 11 MWh 油田订单，只证明进入市场，并不等于现有制造网络或可融资运营历史。
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP011
              - CP016
