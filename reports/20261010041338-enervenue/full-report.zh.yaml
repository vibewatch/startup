      - number: '4.3'
        title: 制造运营、资本开支受阻与合同诉讼
        blocks:
          - type: paragraph
            body: >-
              从试点实验室装配转向自动化量产遭遇运营和法律摩擦。2023 年 12 月，ATS Ohio 在 Ohio 南区联邦法院起诉，称 EnerVenue 拖欠与 California 100 MWh
              自动化产线相关的超过 $5.7 million 发票。宣誓证据显示产线年最大能力约 20 MWh，仅为额定 20%。2024 年 7 月，公司单方面退役并拆解产线，称设备基本在亏损。2025 年 9
              月，法官认定公司在诉讼期间恶意毁损证据，驳回反诉并命令不利推定，形成严重未决或有负债，也说明早期制造执行困难。
