      - number: '3.2'
        title: 能力差异化仍由规格主导
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 声称的核心差异化是生命周期表现：技术材料描述水系电解液、30 年和 30,000+ 次循环；独立报道称磷酸铁锂通常为 3,000 至 6,000 次，并指出 30,000
              次尚未在商业规模独立审计。安全性同样有限定：公司称化学体系消除热失控风险，但独立报道指出完整安装仍需认证、消防规范和场地要求。只有现场结果验证规格，频繁循环和安全敏感应用才具吸引力；该序位图区分商业成熟度与宣称的高循环、安全价值，并非实测基准。
            claimRefs:
              - CP005
              - CP006
