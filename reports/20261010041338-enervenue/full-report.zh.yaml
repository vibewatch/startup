              和 Forge Global 等二级 IPO 前市场流动性有限、交易估值未披露。就投资判断而言，公司财务画像仍未经验证：缺少经审计收入、毛利率、现金消耗和保修损失准备，构成重大判断障碍，投资状态为需继续研究。
