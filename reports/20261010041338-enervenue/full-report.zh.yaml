      - number: '7.4'
        title: 财务模型与执行风险：成本缺口与保修敞口
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的长期竞争逻辑不在初始资本支出，而在全生命周期总拥有成本；这使公司暴露于激进锂电定价带来的严重商业压力。EnerVenue 的目标是把大批量电芯制造成本降到每千瓦时
              $80–$100，但公用事业级磷酸铁锂（LFP）电芯在 2024 年和 2025 年已降至每千瓦时 $60 以下。EnerVenue 虽称其 Energy Storage Vessels
              无需承担电池系统级消防抑制支出，并能在 30 年内承受最高 30,000 次循环且不发生热衰减，但这些性能指标尚未得到独立公用事业运营项目的验证。公司给出激进的 20 年、20,000
              次循环质保；对于一家尚未产生收入、且六年内已迭代四代电芯的创业公司，这会带来规模尚未量化的资产负债表风险。在缺少透明的现场衰减数据和 Changzhou
              已验证的单位制造经济性之前，投资判断中的下行风险仍是潜在投资者必须正视的核心难题。
