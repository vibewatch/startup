      - number: '3.3'
        title: 分销与定价削弱近期采购信心
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 追求垂直整合，却没有披露分销中心，而是以 FOB China 向项目现场发运集装箱。这能保持制造和部署控制，但也让履约集中依赖新扩建的 Changzhou
              工厂。公开材料没有可比标价、成交价、折扣、保修经济性或安装成本桥接。MGrid 称当前产量下镍氢每千瓦时资本成本高于磷酸铁锂，Changzhou
              规模的成本竞争力尚无公开证明。没有项目级定价和切换成本证据，无法将更低生命周期成本计入对现有方案的投资判断。
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP011
              - CP015
              - CP016
      - number: '3.4'
        title: 护城河能否持久取决于可复制制造与第三方验证
        blocks:
          - type: paragraph
            body: >-
              单有专有化学体系尚不足以形成持久护城河。Environment + Energy Leader 提醒，250 MWh
              是潜在产量而非已确认产出或签约销售，良率、生产成本和客户采用才是规模化测试。缺少分销中心增加了对直接执行的依赖；2025 年联邦命令还因证据毁损制裁驳回公司反诉，并对部分抗辩施加不利推定。这不能证明当前
              Changzhou 表现，却是此前制造项目治理的反向证据。公司资源中心和产品页仍由公司维护；在安全与生命周期优势转化为可融资性或定价权前，还需独立现场数据、系统认证、订单转化和客户切换经济性。
            claimRefs:
              - CP003
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 额定产能不等于交付规模
            body: 250 MWh Changzhou 额定值只是潜在产能，不代表产出、良率、合同需求或实际单位成本；披露的 11 MWh 订单是早期商业证明，不是满负荷利用。
            calloutType: risk
            claimRefs:
              - CP002
              - CP010
              - CP011
          - type: callout
            title: 比较的关键在证据质量
            body: EnerVenue 的生命周期和安全主张可能有价值，但现有证据支持的是公司规格和早期部署，而非经独立审计、项目级的成本优势。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业收入架构与变现模式
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 是能源基础设施硬件供应商，通过直接销售模块化 150 kWh Energy Rack 和单体 Energy Storage Vessel
              获得收入，面向公用事业、商业及工业可再生能源项目。商业牵引来自多年框架供货协议，最突出的是与 Pine Gate Renewables 的 2,400 MWh
              主协议。但主协议是有条件的项目承诺，不是不可撤销的硬件采购；收入实现仍取决于融资批准、EPC 工期和安装安排。
            claimRefs:
              - CI001
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
