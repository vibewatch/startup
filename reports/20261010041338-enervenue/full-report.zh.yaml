        title: 工作流集成与运营差异化
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的技术差异化在耐久性、高利用率和运营经济性，而非能量密度。第四代 AMC 设计寿命 30 年、30,000 次循环，每日最多循环三次且无需计划停机。公司文件称峰值往返效率超过 90%、100%
              放电深度，并承诺 30 年无需计划性扩容。相比之下，磷酸铁锂通常在每日循环下每 7 至 10 年需扩容或更换。无热失控可减少 HVAC
              寄生功耗和安全间距，但镍氢体积能量密度较低、占地更大，不适合电动交通而适合固定式基础设施。RWE Clean Energy 正在专门测试设施评估其充放电动力学、温度边界和往返效率。
