      - number: '1.4'
        title: 运营里程碑与制造轨迹
        blocks:
          - type: paragraph
            body: >
              EnerVenue 的商业历程体现快速融资与艰难本土制造现实的反差。2021 年末，公司委托 ATS Ohio 在 California 建设 100 MWh 自动化产线；因里程碑延误和部件故障，ATS 于
              2023 年 12 月起诉追索 $5.7 million。EnerVenue 承认产线年运行能力仅 20 MWh，即额定产能 20%。2024 年 7 月，公司在诉讼证据开示期间拆解并销毁产线；2025 年 9
              月，联邦法官因恶意毁损证据驳回反诉并命令不利推定指示。公司遂转向 Changzhou，2026 年建设 250 MWh 产线，目标 1 GWh。
