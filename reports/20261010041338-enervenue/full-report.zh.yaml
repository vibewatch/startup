              - CI006
              - CI007
              - CI014
      - number: '4.2'
        title: 硬件定价结构、成本目标与生产经济性
        blocks:
          - type: paragraph
            body: >-
              变现依赖生产成本追平锂离子，同时凭更长寿命获取溢价。150 kWh Energy Rack 最高 1,500 Vdc、约 5,000 kg，25°C 下机架往返效率 85% 至 87%。公司称 AMC 可实现
              30,000 次循环和 30 年寿命，无需复杂 HVAC 或专用消防，目标是商业规模下电池包成本低于每千瓦时
              $80。该目标需要去除贵金属催化剂、优化自动化装配并利用低成本供应链；实际定价受保密协议保护，模型经济性与出厂成本之间仍有明显缺口。
            claimRefs:
