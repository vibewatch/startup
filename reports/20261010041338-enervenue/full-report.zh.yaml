        title: 电化学机制与电芯架构
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 将 NASA 为极端航天环境开发的镍氢化学体系商业化为 AMC 固定式储能电池。2020 年由 Stanford 教授 Yi Cui
              创立，公司以低成本材料替代昂贵航天级材料，同时保留耐久性。电芯含氢氧化镍正极、镍合金负极和不可燃水系碱性电解液，摆脱锂、钴和稀土供应依赖。充电时生成的氢气密封在圆柱压力容器内，放电时反向反应。水系电解液使其无热失控或火焰传播风险，减少传统锂离子储能所需消防和
              HVAC；自动化玻纤缠绕维持压力循环下的结构完整性。
