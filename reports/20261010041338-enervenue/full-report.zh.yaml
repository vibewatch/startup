            body: >
              EnerVenue 由 Stanford University 材料科学教授 Dr. Yi Cui 创立，其低成本金属氢催化剂研究构成科学基础。Dr. Cui 任董事会主席，CTO Dr. Majid
              Keshavarz 负责技术执行。2026 年 3 月，公司任命 Henning Rath 为 CEO；他曾任 Enpal 首席供应链官并创办 CIRC。这一任命把公司从科学验证推向工业制造规模化与国际部署。
