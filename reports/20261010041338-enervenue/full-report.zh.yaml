              月，公司拿下首份多兆瓦时商业合同：为中国北部一座太阳能油田微电网提供 26 个 Energy Prism 集装箱储能单元，总计 11 MWh，交付将于 2026 年 12 月开始 [CE012]。此前，公司已在
              Changzhou 的 Jintan 与 Towngas 部署运营试点：Energy Rack 配置中的 50 个第四代电芯自 2025 年末起持续循环，将太阳能发电与电动公交充电结合
              [CE013]。与此同时，RWE Clean Energy 继续在 Milwaukee 对 EnerVenue 的 Energy Storage Vessel 进行试点评估，以考察其在真实循环条件下的运营耐久性
              [CE014]。尽管取得这些里程碑，历史执行情况仍暴露出关键的规模化脆弱性 [CE011]。在与自动化供应商 ATS Ohio 的联邦诉讼中，EnerVenue 披露，其此前的 California
