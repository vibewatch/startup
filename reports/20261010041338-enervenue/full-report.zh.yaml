figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 EnerVenue 从斯坦福研究和特拉华州注册成立，到加州诉讼及 2026 年 Series B+ 扩张的发展历程。
    data:
      items:
        - label: 注册成立与研究起源
          date: 2020-04
          detail: EnerVenue 于 2020 年 4 月 13 日在特拉华州注册成立，用于改造 Dr. Yi Cui 继承自 NASA 的金属氢电池研究。
          tone: positive
        - label: 种子轮融资
          date: 2020-08
          detail: EnerVenue 融资 $12 million 种子轮，用于制造实验室原型并设立加州总部。
          tone: positive
        - label: Series A 资本注入
          date: 2021-09
          detail: EnerVenue 从战略及财务投资者处获得 $100 million Series A 融资，加速产品化。
          tone: positive
        - label: 制造自动化合同
          date: 2021-12
          detail: EnerVenue 与 ATS Ohio 签约，在加州建设自动化 100 MWh 电池装配线。
          tone: neutral
        - label: 制造违约与诉讼
          date: 2023-12
          detail: 技术争议期间 EnerVenue 停止付款后，ATS Ohio 在俄亥俄州联邦法院起诉 EnerVenue，追讨 $5.7M 未付费用。
          tone: negative
        - label: 加州产线退役
          date: 2024-07
          detail: 由于手工堆叠导致最大产能仅为 20 MWh，EnerVenue 拆除了其加州 100 MWh 装配线。
          tone: negative
        - label: 司法证据毁损制裁
          date: 2025-09
          detail: 联邦法院认定 EnerVenue 在证据开示期间恶意毁坏装配线，并驳回 EnerVenue 的反诉。
          tone: negative
        - label: Series B+ 融资与领导层转向
          date: 2026-03
          detail: EnerVenue 获得 Full Vision Capital 领投的 $300 million Series B+，任命 Henning Rath 为 CEO，并计划在常州建厂。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO010
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: 长时储能可触达机会分层
    type: pyramid
    summary: 从全球固定式储能需求到 EnerVenue 已核实试点部署基础的分层规模视角。
    data:
      items:
        - label: 固定式电网储能总需求
          value: Global renewable shifting and grid infrastructure requiring multi-hour energy storage
          detail: 宏观市场由清洁能源要求、太阳能 / 风能波动和电网现代化驱动。
          tone: neutral
        - label: 长时储能细分市场（4-12+ 小时）
          value: Multi-hour daily cycling where lithium-ion degradation and fire suppression impose major costs
          detail: 主要可触达类别，包括沙特 2030 年 48 GWh 目标和迪拜 8.4 GWh 采购。
          tone: neutral
        - label: 高温高循环利基市场
          value: Harsh operating environments (>45°C) and heavy daily duty (2-3 cycles/day)
          detail: 水系金属化学体系无需主动 HVAC 和辅助消防抑制。
          tone: positive
        - label: 已报告商业管线
          value: 56 GWh prospective deals
          detail: EnerVenue 披露的商业兴趣管线，相比 2023 年扩大 8 倍。
          tone: neutral
        - label: 已公布订单积压
          value: $2.3 billion in orders
          detail: 来自公用事业和 C&I 买方的客户承诺，但未经第三方审计核实。
          tone: neutral
        - label: 已交付商业试点规模
          value: <100 MWh deployed base
          detail: 早期试点单元和初始制造线；GWh 级交付仍未经验证。
          tone: risk
    approximationNotes: 规模分层代表定性及已报告的量化阈值；订单积压反映公司公布的数字，而非经审计的 GAAP 承诺。
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM007
      - CM009
  - id: FP001
    title: 序数竞争地位：商业成熟度与已披露的高循环和安全价值
    type: quadrant
    summary: 透明的 1-5 分析师序数图将商业证据与已披露的寿命、时长和安全价值分开；中点分数表示证据稀疏，而非测得的同等水平。
    data:
      points:
        - label: EnerVenue AMC
          x: 2
          'y': 5
          detail: 早期商业证据（试点、额定产线、一个订单）；已披露的寿命和安全主张最高，但未经独立审计。
        - label: 锂离子 / LFP
          x: 5
          'y': 3
          detail: 制造和运营历史成熟；MGrid 指出其典型循环寿命较低，且存在消防安全取舍。
        - label: 液流电池
          x: 3
          'y': 4
          detail: 公认的长时替代方案；中点成熟度反映缺少指定供应商的规模证据。
        - label: 抽水蓄能
          x: 3
          'y': 4
          detail: 公认的长时替代方案；中点位置反映缺少项目层面证据。
        - label: 内部建设
          x: 1
          'y': 1
          detail: 没有公开证据量化内部建设的成熟度或表现。
        - label: 不建设 / 延后
          x: 1
          'y': 1
          detail: 没有新增储能能力；未量化买方特定机会和可靠性成本。
    approximationNotes: 分析师序数分数从 1（低或不受支持）到 5（披露证据高），不代表实测表现。中点分数标记比较数据稀疏；EnerVenue 的寿命和安全价值仍是公司主张。
    claimRefs:
