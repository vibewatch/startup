chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >
              EnerVenue, Inc. 于 2020 年 4 月 13 日在 Delaware 注册成立，旨在将最初为航空航天应用研发的金属氢电池技术商业化 [CO002]。公司总部位于 California 州
              Fremont，并将 NASA 验证过的水系镍氢化学体系改造成耐用的固定式储能系统，面向公用事业级电网、商业设施和高负荷计算基础设施 [CO001, CO011]。EnerVenue 声称，其电池架构在 30
              年运营寿命内最多可实现 30,000 次循环，且衰减极小，为锂离子化学体系提供替代方案 [CO011]。按各轮风险融资计算，累计融资估计在 $412 million 至超过 $700 million
              之间；不过，私营商业数据库显示，融资总额可能达到 $1.08 billion [CO006]。经审计收入、商业 ARR 和毛利率仍未披露 [CO015]；员工规模估计显示，公司目前约有 102 名员工
              [CO009]。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO009
              - CO011
              - CO015
