      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 联邦法院证据毁损制裁与设备销毁
            body: >-
              继 2025 年 9 月 ATS Ohio v. EnerVenue 联邦法院裁决后，EnerVenue 面临严重的法律与运营阻力。法院认定，诉讼期间 EnerVenue 恶意拆除并销毁了其 100 MWh
              自动化电池装配线，因此其反诉被全部驳回，审判中还将强制作出不利推定。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 运营急转：从 Kentucky 取消到 Changzhou 转向
            body: >-
              EnerVenue 在拿到 $30M 州级激励后仍决定放弃 $264 million 的 Kentucky 超级工厂，凸显制造经济性尚未解决。公司把第四代电芯的大批量生产转移到中国 Changzhou，将失去
              IRA 下的美国本土含量奖励，同时暴露于关税和供应链风险。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值判断
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 一面完成了可观的战略融资，另一面却严重缺乏执行透明度。公司七轮融资累计 $1.08 billion，其中最引人注目的是由 Full Vision Capital 领投、于 2026
              年春季完成的 $300 million Series B 股权融资。公司称这笔资金将用于在中国 Changzhou 建设大批量制造基地，初始产能目标为 250 MWh，最终达到 1 GWh
              的运行速率。然而，公开记录显示公司没有经过审计的收入，商业毛利率未披露，也没有可验证的客户现金回款。与此同时，俄亥俄州联邦合同诉讼的司法认定显示，EnerVenue 曾故意销毁其 California
              电池装配线并因此被认定为恶意行为。在缺少经审计财务报表、客户集中度数据和已验证制造良率的情况下，按当前创投估值基准投入成长股权，意味着无法量化的下行风险。我们给出“继续研究”建议、高风险评级和偏高估值判断；潜在投资者应等到专有工厂良率和经审计的承购收入在保密审查下得到独立佐证后，再投入股权资本。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
