  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 从技术基础、制造现实一路推演至估值判断和最终投资立场的连续分析链。
    data:
      nodes:
        - id: node-1
          label: 核心技术验证
          detail: NASA 衍生的镍氢化学体系在航空航天应用中展现出卓越的循环寿命。
        - id: node-2
          label: 试产线障碍
          detail: 由于自动化瓶颈，加州装配线仅实现 20 MWh（产能的 20%）。
        - id: node-3
          label: 诉讼与证据毁损
          detail: 与 ATS Ohio 发生争议期间产线被毁；法院以恶意毁损证据为由施加制裁。
        - id: node-4
          label: 制造转向
          detail: 公司完成 $300M Series B 融资，用于在中国常州建设 250 MWh 生产设施。
        - id: node-5
          label: 财务与收入不透明
          detail: 尽管公司历经 7 轮融资累计筹得 $1.08B，却没有任何经审计的收入或利润率披露。
        - id: node-6
          label: 继续研究立场
          detail: 在生产能力得到证明前，高风险评级和偏高估值意味着应暂缓投入增长资本。
      edges:
        - from: node-1
          to: node-2
          label: 转入试产
        - from: node-2
          to: node-3
          label: 合同违约期间产线退役
        - from: node-3
          to: node-4
          label: 资本注入资助海外迁移
        - from: node-4
          to: node-5
          label: 在缺乏收入证明的情况下推进资本建设
        - from: node-5
          to: node-6
          label: 投资判断需要私人尽调
    approximationNotes: 定性呈现分析依赖关系的顺序流。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV013
      - CV014
