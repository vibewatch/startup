  - id: FI001
    title: 收入模型桥接
    summary: 成本构成演进展示目标制造降本，以及商业规模下迈向低于 $80/kWh 经济性的毛利率桥接。
    type: waterfall
    approximationNotes: 部件成本拆分和目标节省基于行业长时储能估算及公司设定的规模里程碑建模。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI011
    data:
      items:
        - label: 原材料与活性化学体系
          value: 42
          unit: USD/kWh
          detail: 镍、钢制压力容器、水系电解液和隔膜部件。
          category: cost
        - label: 电芯制造与堆叠
          value: 28
          unit: USD/kWh
          detail: 自动化管式电芯装配和压力容器密封。
          category: cost
        - label: 电池架集成与电力电子
          value: 22
          unit: USD/kWh
          detail: 150 kWh 模块化电池架集成、内部布线和电池管理系统。
          category: cost
        - label: 自动化超级工厂规模节省
          value: -18
          unit: USD/kWh
          detail: 常州设施的目标制造效率和供应链优化。
          category: reduction
        - label: 规模化目标制造成本
          value: 74
          unit: USD/kWh
          detail: 目标制造电池包成本低于 $80/kWh 商业可行性基准。
          category: cost
        - label: 预计毛利率贡献
          value: 26
          unit: USD/kWh
          detail: 按预期商业公用事业定价预计的毛利润率贡献。
          category: margin
  - id: FE001
    title: 产品架构图
    type: stack
    summary: EnerVenue 水系金属电芯平台的六层架构，从分子电化学延伸至集装箱式公用事业集成。
    data:
      layers:
        - label: 电化学与核心电芯层
          detail: 采用氢氧化镍正极、镍合金负极和水基碱性电解液的密封水系金属电芯（AMC）
          modules:
            - 氢氧化镍正极
            - 镍合金负极
            - 水基碱性电解液
            - 密封氢气压力边界
        - label: 电芯容器与机械约束层
          detail: 由自动化张力控制玻璃纤维缠绕形成的高强度复合压力容器
          modules:
            - 自动化玻璃纤维缠绕
            - 气密端盖
            - 焊缝完整性密封
            - 被动导热外壳
        - label: 自动化制造与质量层
          detail: 常州武进 250 MWh 产线自动化率 95%，设有 41 个在线检测关卡
          modules:
            - 机器视觉电极堆叠
            - AGV 自动转运
            - 11 个测试和测量工位
            - MES 统一追踪
        - label: 电池架与外壳集成层
          detail: 配备原生直流母线的模块化外壳（Energy Core 30 kWh、Energy Cube 108 kWh、Energy Rack 150 kWh）
          modules:
            - 直流母线互连
            - 结构化电池架框架
            - 无需 HVAC 的环境散热
            - 组串过流保护
        - label: 集装箱式公用事业架构层
          detail: Energy Prism 集装箱式平台组合多个电池架，用于多 MWh 公用事业和工业部署
          modules:
            - Energy Prism 20ft / 40ft 集装箱
            - 辅助系统电力布线
            - 外部逆变器接口
            - 零消防抑制占用
        - label: 电网管理与控制层
          detail: 电池管理系统（BMS）与 SCADA 集成，支持公用事业每天连续 3 次调度
          modules:
            - 单体电芯电压 / 压力遥测
            - 荷电状态计算
            - 公用事业 SCADA / EMS 接口
            - 多时长调度逻辑
    approximationNotes: 该架构根据工厂规格和技术披露，代表第四代 AMC 平台的功能子系统；未包含专有内部电路设计。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初始技术评估到多年部署的端到端客户采用生命周期。
    approximationNotes: 生命周期阶段和扩展机制综合自公司评估材料、职位描述和合作伙伴公告。
    claimRefs:
      - CU003
      - CU008
      - CU009
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 技术评估
          tone: neutral
          detail: 项目团队通过 EnerVenue Industry Hub 分析数据表、循环建模和安全规格。
          touchpoints:
            - 数据表审阅
            - 用例模拟
        - label: 管线资格评估
          tone: neutral
          detail: 销售管理层与公用事业及 IPP 开发商接洽，评估特定场址的电力市场费率。
          touchpoints:
            - 直销咨询
            - 并网规模测算
        - label: 制造预留
          tone: warning
          detail: 潜在买方签署预留协议，在批量制造前排队获取工厂产能分配。
          touchpoints:
            - 产能定金
            - 分配排期
        - label: 试点调试投运
          tone: positive
          detail: 部署 Towngas 公交充电站等初始试点设施，以展示循环性能。
          touchpoints:
            - 现场集成
            - 调试验收签字
        - label: 商业签约
          tone: positive
          detail: 签署面向工业或油田电网级基础设施的兆瓦级商业合同。
          touchpoints:
            - 有约束力的 EPC 协议
            - 交付计划
        - label: 车队扩张
          tone: warning
          detail: 长期车队扩张取决于已证明的 30,000 次循环耐久性和常州供应连续性。
          touchpoints:
            - 重复采购订单
            - 质保核验
