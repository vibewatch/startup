              - CV014
      - number: '8.2'
        title: 核心投资逻辑与反方逻辑
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的核心投资逻辑建立在独特的电化学价值主张和强大的战略支持之上。公司源自 Stanford University Yi Cui
              教授主导的研究，将航空航天级镍氢电池化学体系用于固定式电网基础设施。该技术的理论画像颇具吸引力：30 年运营周期内最高可循环 30,000
              次，且不存在热失控风险，有望大幅压低长时储能和人工智能数据中心的锂电增容成本。为推动产业化，董事会聘请了来自德国清洁能源龙头 Enpal、经验丰富的供应链高管 Henning Rath 担任
              CEO。反方逻辑则来自严重的制造执行失误、治理红旗和离岸迁移风险。联邦法院证据开示显示，EnerVenue 在 California 建设的国内自动化 100 MWh 装配系统因组件和堆叠问题长期未解，年运行量仅
              20 MWh（铭牌产能的 20%）。EnerVenue
              没有协同解决缺陷；证据开示期间，公司单方面停用并报废这条价值数百万美元的产线，遭受严厉的证据毁损制裁，反诉也被驳回。商业良率尚未得到证明；若此时把主要制造转到
              Changzhou，西方电网项目就会暴露于地缘政治摩擦、贸易壁垒和海外供应链脆弱性之下。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV013
      - number: '8.3'
        title: 估值情景与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              由于 EnerVenue 既未披露经营收入，也未披露 EBITDA 利润率，传统可比倍数（如 EV/ARR 或 EV/EBITDA）无法依据公开披露进行量化评估。估值结果完全取决于 Changzhou
              的制造爬坡能否成功，以及公司在美国的法律责任管理。在我们 20% 概率的乐观情景中，Changzhou 的 250 MWh 工厂在 2026 年达到目标电化学良率，使公用事业试点转化为具有约束力的数 GWh
              供货协议；按可比硬件公司倍数，企业估值可超过 $1.5 billion。在我们 55% 概率的基准情景中，投产里程碑出现小幅物流延误，初始爬坡低效压缩利润率，估值维持在 $700 million–$900
              million，同时仍需后续股权分批注资。在我们 25% 概率的悲观情景中，离岸电芯制造遭遇严重成本超支或质量缺陷，ATS Ohio
              诉讼中的不利法院推定又带来大额损害赔偿责任，最终可能触发内部领投的下调轮融资，或在累计投入资本以下进行惩罚性资本重组。关键下行触发因素包括超过现有托管准备金的不利法院判决、针对中国制造电池部件的出口管制，以及错过公用事业交付窗口后客户取消订单。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: 尽调障碍与逻辑破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              评估 EnerVenue 的机构投资者面临三道无法妥协、也无法靠公开营销材料或技术白皮书解决的尽调障碍。第一，投资者需要经认证的 GAAP 财务报表、详细的历史现金消耗表和完整资本化表，以评估 Series
              A、Series B 及后续债务分层之间的清算优先权。第二，投资者必须对 Changzhou 生产基地进行独立工程审查，核查经认证的电芯衰减曲线、模组良率和环境健康合规情况。第三，法律尽调必须审计未决合同
              claims（索赔请求）及 ATS Ohio 诉讼带来的风险；Marbley 法官已驳回 EnerVenue 的反诉，并就产线质量与性能下令作出强制性不利推定。若 ATS 诉讼最终金钱判决超过 $5
              million、Changzhou 工厂供应链延误超过六个月且未得到缓解，或公用事业客户试点安装出现有记录的电芯现场故障，我们的“继续研究”评级将立即转为明确负面建议。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 制造与披露缺口决定的继续研究立场
            body: EnerVenue 的 $300 million Series B 融资验证了投资者对长时储能的兴趣，但财务完全不透明，加上联邦法院的证据毁损认定，使无对冲股权投资面临不可接受的执行风险。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV013
              - CV014
          - type: callout
            title: 国内司法制裁下的海外工厂迁移
            body: >-
              EnerVenue 销毁 California 装配线、导致其针对 ATS Ohio 的数百万美元反诉被驳回，凸显出严重的运营脆弱性。在国内产线良率尚未被证明之前，把主要制造迁往中国
              Changzhou，就已引入地缘政治、供应链和关税风险。
            calloutType: risk
