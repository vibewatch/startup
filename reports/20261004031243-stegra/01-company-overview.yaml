company:
  name: "Stegra"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Stegra (formerly H2 Green Steel) is developing Europe's first large-scale green-hydrogen-based DRI and EAF steel manufacturing plant in Boden, Sweden, having secured approximately €7.9 billion in cumulative funding including a €1.4 billion round closed in June 2026 led by a Wallenberg Investments-led consortium. Commercial production timing has been shifted to 2027 as project scheduling remains under review amid heavy first-of-a-kind engineering execution."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity and Industrial Mission"
    body: "Stegra was established in 2020 under its original legal name H2 Green Steel, headquartered jointly in Stockholm and Boden, Sweden. The venture was conceived to address carbon abatement across heavy commodity manufacturing by substituting fossil coal with electrolytic green hydrogen in iron reduction. In September 2024, the enterprise executed a corporate rebrand to Stegra, articulating an expanded industrial purpose across green hydrogen, direct reduced iron, and near-zero emission metallurgy. The company's initial commercial flagship under development is sited in Boden, Norrbotten, designed to integrate an on-site giga-scale electrolyzer with high-temperature direct reduction shafts and modern electric arc furnaces."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Corporate Governance"
    body: "Stegra's operational strategy and industrial execution are led by Chief Executive Officer Henrik Henriksson, formerly President and CEO of commercial vehicle manufacturer Scania Group, alongside co-founder and Board Chairman Harald Mix, founder of industrial private equity firm Altor and venture platform Vargas Holding. The leadership team reflects deep institutional alignment between Swedish industrial syndicates and clean-technology venture development. In February 2026, the company announced the appointment of Markus Holm as Chief Financial Officer starting March 1, 2026, succeeding founding CFO Otto Gernandt who transitioned to a senior advisory role dedicated to capital-raising initiatives. Corporate governance is further expanding through the planned nomination of former Volvo Group CEO and Ericsson Chairman Leif Johansson as independent Board Chair following the 2026 equity consortium round."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-structure"
    title: "Capitalization Structure and Stakeholder Syndicate"
    body: "Stegra represents one of the most heavily financed private industrial climate technology ventures globally, having secured approximately €7.9 billion in cumulative financing commitments across equity, project debt, and sovereign subsidies. In January 2024, the company established an initial €6.5 billion project financing package comprising €3.5 billion in senior debt from major European commercial banks, €600 million in junior mezzanine facilities, direct equity, and a €265 million grant from the European Commission Recovery and Resilience Facility via the EU Innovation Fund. In June 2026, Stegra announced the formal closing of an additional €1.4 billion ($1.7 billion) growth financing round led by a Wallenberg Investments-led consortium. Wallenberg Investments committed €250 million in direct equity alongside consortium partners Temasek, IMAS Foundation, Bolero, and SEB-Stiftelsen, with continuing equity support from Altor, Hy24, and Just Climate. The comprehensive lender group reaffirmed total backing, preserving access to previously negotiated credit facilities."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-execution-headwinds"
    title: "Operational Scale, Offtake Agreements, and Execution Headwinds"
    body: "Despite substantial capitalization, Stegra faces material delivery and market execution challenges characteristic of first-of-a-kind heavy manufacturing projects. In early 2026, corporate management placed the commercial commissioning timeline under review, acknowledging that commercial steel production has shifted from late 2026 into 2027 to accommodate extensive equipment installations and electrical infrastructure ramp-up. On the commercial offtake front, Stegra has secured customer agreements with industrial buyers and entered into an agreement with Google for environmental attribute certificates covering up to 91,000 metric tons of steel output in its first operating year. However, detailed contractual pricing mechanisms, take-or-pay structures, and unit-level hydrogen production economics remain undisclosed, representing critical diligence gaps for underwriters tracking commercial break-even."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO008"
      - "CO013"
      - "CO014"
