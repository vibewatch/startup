company:
  name: Stegra
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a completed €1.4 billion financing and continued construction, but it does not disclose Stegra's current equity valuation, fully diluted capitalization, investor preferences, or audited operating economics. The resulting recommendation is track and research more, with high risk and an indeterminate valuation stance rather than a price-independent endorsement.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and Price Discipline
    body: |
      The appropriate public-evidence recommendation is track and research more, not buy. Stegra has cleared an important financing hurdle: Reuters reporting and Stegra's own timeline indicate that the €1.4 billion round closed on June 24, 2026. That event improves near-term completion funding, but it does not establish the value of the equity offered to a new investor. The assigned materials disclose neither a current post-money valuation nor a fully diluted capitalization, preference waterfall, or audited project cash-flow model. Confidence is therefore medium on the financing event and operating-risk direction, but low on price. Risk remains high because the plant is still tracked as under construction and the timeline was under review after slower activity. Entry discipline should be based on private-document verification, not a funding-total proxy.
    claimRefs:
      - CV003
      - CV005
      - CV010
      - CV015
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-commercial-proof-and-antithesis
    title: Financing Context, Commercial Proof, and Anti-Thesis
    body: |
      The April financing announcement said the new capital would complete construction, absorb selected infrastructure insourcing and increased project costs, and provide a buffer. Independent coverage also reported that construction had slowed while financing was pending. Those facts make the round both a de-risking event and evidence that capital needs had risen. Commercial signals are real but not equivalent to revenue: Google agreed to receive environmental attribute certificates tied to up to 91,000 metric tons of first-year steel, while Stegra's timeline says more than 1.5 million tonnes had been pre-sold by May 2022. Neither source discloses realized pricing, cash collection, margin, or take-or-pay protection. The thesis is credible demand for lower-emissions steel; the anti-thesis is a capital-intensive commissioning path whose economics remain private.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
    tableRefs:
      - TV002
  - id: scenarios-and-thesis-breaks
    title: Bull, Base, and Bear Underwriting Framework
    body: |
      Scenario analysis should remain conditional because the assigned evidence cannot support numeric probabilities, target returns, or valuation ranges. In the bull case, the financing converts into uninterrupted construction, the tracked 2027 start is achieved, and customer signals translate into contracted cash flow. In the base case, completion proceeds but timing and ramp economics remain uncertain, requiring additional disclosure before a price can be underwritten. In the bear case, further cost escalation, hydrogen scale-up difficulty, or schedule slippage causes another capital raise, dilution, or lender-led restructuring. The clearest thesis-break signals are a renewed construction slowdown, a start-date reset beyond the currently tracked year, loss or weakening of customer commitments, and new financing that fails to disclose its seniority or dilution. These are observable signals, not assigned probabilities.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV012
      - CV015
    tableRefs:
      - TV003
  - id: ownership-exit-readiness-and-diligence
    title: Ownership, Exit Readiness, and Final Diligence
    body: |
      The April terms contemplated a Wallenberg-led consortium taking a leading ownership position and new board nominations, which can strengthen industrial oversight but may also reshape minority-investor rights. Public funding totals cannot resolve the cap table: Indexed.vc reports $4.6 billion across seven rounds, whereas Stegra's own timeline reports close to €6.5 billion secured in January 2024 and a separate €1.4 billion round closing in June 2026. The currencies, dates, and financing definitions differ, so these figures should not be summed or treated as cash available. Exit readiness is not established by the assigned sources; no IPO timetable, comparable transaction set, or audited steady-state earnings base is disclosed. Final diligence should obtain the current capitalization, financing waterfall, remaining cost-to-complete, commissioning schedule, customer contract economics, and lender covenants before setting a valuation range or return target.
    claimRefs:
      - CV001
      - CV003
      - CV013
      - CV014
      - CV015
      - CV016
callouts:
  - calloutType: recommendation
    title: Financing Is Not Valuation
    body: |
      Treat the completed €1.4 billion round as evidence of financing support, not as evidence that a new equity entry price is attractive. A valuation judgment requires the fully diluted cap table, security rights, remaining cost-to-complete, and a cash-flow bridge from commissioning to steady-state production.
    claimRefs:
      - CV003
      - CV004
      - CV015
