company:
  name: Stegra
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Stegra is building an integrated renewable-power, hydrogen-DRI, and electric-arc-furnace system in Boden, but the available evidence still describes a construction-stage plant rather than demonstrated commercial production. The product includes physical near-zero-emission steel and a separate environmental-attribute certificate mechanism; diligence should focus on commissioning, product qualification, exact electrolyser capacity, operating reliability, and independent verification."
sections:
  - id: product-and-commercial-form
    title: "Product Definition and Commercial Form"
    body: >-
      Stegra's intended deliverable is near-zero-emission steel made at Boden with
      renewable electricity, green hydrogen, and green iron. The company's stated
      emissions advantage is up to 95% versus conventional European steelmaking, but
      that figure remains a company claim rather than a disclosed operating result from
      a commissioned plant. Public sources describe an initial 2.5 million tonnes per
      year of steel and a later 5 million-tonne ambition. The commercial system also
      separates environmental value from physical metal through environmental
      attribute certificates (EACs). Stegra says one EAC represents one tonne of
      near-zero steel; Google says its agreement covers certificates associated with up
      to 91,000 metric tons from the first production year. Non-prime steel is a distinct
      ramp-up output: Thyssenkrupp Materials Services agreed to buy tonnage in the
      high-six-digit range, while the related green attribute can be sold separately.
      This creates a route to monetize startup yield, but neither the certificate price
      nor realized non-prime share is public.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
      - CE010
      - CE011
    tableRefs:
      - TE001
  - id: integrated-process-and-scale
    title: "Integrated Process Architecture and Scale"
    body: >-
      The process chain begins with renewable electricity and water electrolysis,
      followed by hydrogen-based direct reduction of iron ore, electric-arc-furnace
      melting, continuous casting, and rolling. CINEA says integration avoids cooling,
      transport, and reheating between ironmaking and finishing, while Global Energy
      Monitor independently classifies the project as a construction-stage DRI and EAF
      plant. The exact electrolyser nameplate is not reconciled across public materials:
      CINEA states 690 MW, Global Energy Monitor displays both 700 MW and 800 MW in
      different project fields, and a KTH thesis describes 740 MW. Those values should
      be treated as a disclosure gap, not averaged into a synthetic capacity. Stegra's
      own timeline reports the final electrolyser module installed in April 2026 and the
      DRI tower reaching 145 meters in July 2026. These are installation milestones,
      not evidence of stable hydrogen output, steel quality, yield, or commercial
      availability.
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE015
    tableRefs:
      - TE002
    figureRefs:
      - FE001
  - id: maturity-controls-and-risks
    title: "Maturity, Controls, and Technical Risks"
    body: >-
      Independent reporting in January 2026 said construction was 60% complete as of
      late October 2025 and then expected operations in 2027; the same report cited
      higher project costs, delays, and a search for more than $1 billion of additional
      financing. That evidence makes schedule, integrated commissioning, and startup
      yield the central product risks. Stegra says its EAC system uses a certified
      book-and-claim chain of custody with independent external auditors, and its
      timeline records a full environmental permit in June 2023. The assigned evidence
      does not identify the EAC auditor, publish an audit opinion, document automotive
      qualification, disclose plant uptime, or provide incident and cyber-control
      records. A KTH thesis offers a useful practitioner proxy for future hydrogen
      technology choices, but its SOEC model concerns a planned Portugal project, not
      measured Boden performance. It finds SOEC attractive only with high uptime and
      thermal integration, while AWE is more robust under low utilization or uncertain
      capital cost.
    claimRefs:
      - CE007
      - CE009
      - CE012
      - CE013
      - CE014
      - CE016
    tableRefs:
      - TE003
