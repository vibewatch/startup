chapter:
  number: 4
  title: "Financials"
  summary: "Stegra has secured approximately €7.9 billion in cumulative equity, debt, and grant commitments—including an agreed €1.4 billion round in 2026—to finance the construction of Europe's first large-scale green-hydrogen DRI and EAF steelmaking complex in Boden, Sweden. Commercial de-risking relies on long-term offtake contracts with premium automotive and industrial buyers covering 1.5 Mtpa (approx. 60% of phase 1 capacity) alongside novel environmental attribute certificates (EACs), but the venture remains pre-revenue and faces severe first-of-kind capex escalation, project timeline reviews, and persistent unit-cost opacity."

sections:
  - id: "revenue-model-and-monetization"
    title: "Commercial Model, Offtake Structure, and Pricing Dynamics"
    body: >
      Stegra operates as a primary industrial metal manufacturer aiming to decarbonize hard-to-abate steelmaking by replacing metallurgical coking coal with captive green hydrogen produced from renewable electricity. Because the company is constructing a greenfield plant in Boden with first production targeted for 2026, it currently generates no commercial steel sales revenue. Instead, its forward commercial foundation relies on long-term, binding offtake agreements of up to seven years that mirror Power Purchase Agreements (PPAs) in renewable energy project finance. As of late 2024, Stegra had locked in binding offtake commitments for approximately 1.5 million tonnes per annum (Mtpa) of near-zero-emission steel, representing around 60% of its initial 2.5 Mtpa nominal crude steel production capacity. Its customer roster includes premium automotive and consumer durable manufacturers such as Mercedes-Benz, Porsche, Volvo Group, Scania, and IKEA.


      Monetization hinges on securing a structural green premium over conventional fossil-based steel benchmarks. Offtakers in premium automotive segments accept green premiums in the range of 25%, calculated as an incremental component cost of approximately €500 per luxury vehicle—a surcharge readily absorbed on vehicles retailing between €100,000 and €250,000. Furthermore, Stegra has augmented its direct physical steel supply contracts with innovative environmental attribute certificates (EACs) and book-and-claim mechanisms. In September 2026, Google entered into an EAC agreement to purchase the decarbonization attributes of up to 91,000 metric tons of Stegra's first-year steel production, providing a secondary revenue mechanism to monetize emissions-abatement value for buyers facing Scope 3 emissions constraints. However, realized volume delivery and pricing enforcement remain dependent on plant commissioning and operational ramp-up.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
