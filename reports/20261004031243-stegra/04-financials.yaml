callouts:
  - calloutType: "risk"
    title: "Execution and Capex Inflation Risk in First-of-a-Kind Industrial Assets"
    body: >
      Stegra's financial plan exhibits classic first-of-a-kind (FOAK) megaproject escalation dynamics. The original €6.5 billion financing closed in early 2024 required a subsequent €1.4 billion add-on in 2026 to cover infrastructure insourcing, scope changes, and project cost increases. With several months of slowed construction, project timelines under review, and management restructured under Wallenberg Investments leadership, any further commissioning delay beyond 2026 directly compounds interest charges on €3.5 billion in senior debt while pushing cash flow generation into 2027.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI014"

  - calloutType: "insight"
    title: "Offtake Contracts as Synthetic Project Finance Collateral"
    body: >
      By securing 1.5 Mtpa in multi-year offtake agreements with blue-chip OEMs (Mercedes-Benz, Porsche, Volvo Group, IKEA) before completing construction, Stegra transformed traditional volatile commodity steel exposure into predictable, utility-like forward cash flows. Structuring these contracts with ~25% green premiums functioned as essential bankable collateral, enabling a pre-revenue startup to unlock €3.5 billion in senior commercial bank debt.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI009"

