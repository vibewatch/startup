  - id: "capital-adequacy-and-financing-structure"
    title: "Capital Structure, Financing Dependency, and Capex Execution"
    body: >
      Developing Europe's first large-scale greenfield steel mill in 50 years requires massive, front-loaded capital investments that make Stegra heavily dependent on syndicated project finance and sovereign support. Phase 1 of the Boden facility represents a total project investment estimated at €6.5 billion (approximately $7.08 billion), encompassing a 700 MW on-site green hydrogen electrolyzer, a 2.1 Mtpa direct reduced iron (DRI) shaft furnace, and a 2.5 Mtpa electric arc furnace (EAF) melt shop. As of January 2024, the initial €6.5 billion financing package comprised €3.5 billion in senior debt, up to €600 million in junior mezzanine debt, approximately €300 million in initial equity, and a €265 million direct grant approved by the European Commission under the Recovery and Resilience Facility, with debt facilities backstopped by commercial bank consortia and the Swedish National Debt Office.


      Despite this monumental initial package, extreme capital intensity, scope expansions, and insourcing of key infrastructure necessitated substantial add-on funding before initial commissioning. In April 2026, Stegra agreed in principle on an additional €1.4 billion ($1.65 billion) financing round led by a Wallenberg Investments-led consortium including Temasek, IMAS Foundation, Bolero, and SEB-Stiftelsen, with continuation support from existing lead sponsor Altor, Hy24, and Just Climate. Formally completed in June 2026, the €1.4 billion round increased project equity, but management acknowledged that construction had experienced several slower months during fundraising and placed the project timeline under review. By September 2026, independent reporting and company announcements highlighted that new owners implemented a 100-day review appointing Håkan Buskhe as CEO to manage continued capital requirements, underscoring ongoing financing exposure and execution overhang.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
    tableRefs:
