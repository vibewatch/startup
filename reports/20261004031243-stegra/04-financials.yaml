  - id: "unit-economics-and-underwriting-verdict"
    title: "Cost Structure, Unit Economics, and Underwriting Dilemmas"
    body: >
      From an investment diligence and underwriting perspective, Stegra represents a first-of-a-kind (FOAK) industrial megaproject whose long-term financial viability depends on unit-cost parity against both incumbent blast furnace-basic oxygen furnace (BF-BOF) steelmakers and natural gas-based DRI producers. The plant's operational cost structure is dominated by electricity input costs for the 700 MW water electrolysis system, feedstock costs for imported direct-reduction grade iron ore pellets, capital depreciation on the €7.9 billion asset base, and transport logistics across Baltic maritime and rail corridors. While Stegra derisked power supply through long-term agreements for 8 TWh of renewable power with Uniper and Axpo alongside partnerships with Fortum, the delivered levelized cost of green hydrogen ($/kg H2) and total conversion cost per tonne of hot rolled coil (HRC) remain completely undisclosed private metrics.


      The financial verdict for institutional investors is that Stegra possesses extraordinary commercial backing through guaranteed multi-year volume offtake and sovereign derisking, but its near-term risk-return profile is constrained by FOAK execution vulnerabilities. Pre-revenue operating losses, capex inflation leading to mid-construction add-on financing rounds, insourcing of logistical infrastructure, and leadership turnover following the 100-day review mean financial models cannot yet verify steady-state gross margins. Without audited financial statements, unit conversion metrics, and confirmed hot-commissioning dates, Stegra remains unbankable under standard growth equity covenants and must be underwritten strictly as a high-capex infrastructure project exposed to commissioning slippage and macro steel price fluctuations.
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI009"
      - "CI010"
      - "CI014"
      - "CI016"

