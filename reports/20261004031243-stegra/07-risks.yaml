    title: "Timeline Review and First-of-a-Kind Execution Exposure"
    body: "Although the successful closing of the €1.4 billion financing package relieves immediate cash flow pressure, Stegra's confirmation that its Boden project timeline remains under review underscores continuing delivery challenges [CR002, CR005]. Completing complex hydrogen direct reduction facilities requires synchronizing giga-scale electrolyzer commissioning with high-temperature ironmaking, where unforeseen commissioning bottlenecks could defer first commercial revenues and heighten carrying costs [CR001, CR002]."
