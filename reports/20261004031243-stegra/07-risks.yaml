chapter:
  number: 7
  title: "Risks"
  summary: "Stegra's development of Europe's first large-scale green hydrogen direct reduced iron (DRI) and electric arc furnace (EAF) plant in Boden, Sweden, involves substantial execution, operational, counterparty, and financial risks. While closing a €1.4 billion rescue financing round in June 2026 led by a Wallenberg Investments consortium restored project liquidity and established a higher equity ratio, ongoing project timeline reviews, complex multi-tier supply chain dependencies, and exposure to fluctuating power and hydrogen economics keep Stegra's underwriting risk profile in the high band."
sections:
  - id: "executive-risk-assessment"
    title: "Executive Risk Summary and Severity Ranking"
    body: "Industrial decarbonization megaprojects face compound execution risks where first-of-a-kind (FOAK) technology integration intersects with multi-billion euro capital intensity [CR001, CR005]. Stegra's flagship facility in Boden, northern Sweden, integrates giga-scale water electrolysis powered by renewable electricity with direct reduced iron (DRI) and electric arc furnace (EAF) steelmaking to cut emissions by up to 95% compared to blast furnace routes [CR001, CR003, CR011]. However, the scale and complexity of this first-of-a-kind deployment have generated schedule friction and capital pressure, leading the company to review its delivery milestones during construction ramp-up [CR002, CR005]. Headcount scaling across Stockholm and Boden to over 500-800 personnel reflects accelerating organizational commitments amid tough industrial operating environments [CR007, CR008, CR010]. The principal risks facing Stegra fall across operational delivery, supply chain and counterparty compliance, technological integration, and capital structure leverage [CR002, CR004, CR006, CR012]. The June 2026 closing of a €1.4 billion financing package provides a vital liquidity bridge, yet execution milestones remain under rigorous review by industrial sponsors and lenders [CR002, CR005, CR009]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR007"
      - "CR008"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-environmental-risks"
    title: "Regulatory, Environmental, and Supply Chain Governance"
    body: "Operating at the nexus of European energy transition and heavy industry exposes Stegra to stringent regulatory frameworks, environmental monitoring mandates, and trade compliance controls [CR003, CR004]. To maintain compliance across complex cross-border procurement networks, Stegra enforces a comprehensive Supplier Code of Conduct approved by its Board of Directors in May 2026 [CR004]. The framework mandates strict adherence to international labor standards, environmental management systems certified to ISO 14001 or EMAS, and comprehensive Scope 1, 2, and upstream Scope 3 greenhouse gas reporting [CR004]. Furthermore, Stegra prohibits conflict minerals from conflict-affected and high-risk areas (CAHRAs) under EU Regulation 2017/821, restricts sub-contracting to a maximum of two tiers, enforces zero tolerance for sanctions circumvention, and subjects suppliers to unannounced on-site compliance audits [CR004]. Breaches of these provisions are classified as material contractual defaults, mitigating regulatory and reputational liabilities while imposing operational overhead on supplier onboarding [CR004]."
    claimRefs:
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR002"
  - id: "operational-partner-financial-dependencies"
    title: "Operational Logistics, Counterparty Dependencies, and Financial Exposure"
    body: "Stegra's integrated manufacturing flows depend upon tightly synchronized logistics corridors, utility contracts, and long-term customer partnerships [CR001, CR003, CR007]. Inbound raw materials and outbound finished steel rely on dedicated maritime shipping partnerships with ESL Shipping, Royal Wagenborg, Pangaea Logistics Solutions, and Clarksons, as well as rail freight agreements with Green Cargo and port logistics through Skellefteå and Umeå [CR001, CR007]. On the customer side, commercial offtake commitments from industrial buyers such as Thyssenkrupp Materials Services, Scania, and Schaeffler, alongside innovative environmental attribute certificate (EAC) contracts with Google covering up to 91,000 metric tons, underwrite revenue bankability [CR001, CR002, CR003]. Nevertheless, rising CapEx requirements and scope adjustments previously required securing €1.4 billion in additional equity to cover remaining construction outlays, establish buffers against cost volatility, and insulate €3.5 billion in senior debt commitments [CR005, CR006, CR009]. Monitoring indicators and kill criteria remain anchored to commissioning timetable adherence, electrolyzer performance verification, and debt-service coverage [CR002, CR005, CR009]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
    tableRefs:
      - "TR003"
