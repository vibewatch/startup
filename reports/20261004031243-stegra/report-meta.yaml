  topStrengths:
    - Large disclosed financing stack and lender support, including the June 2026 add-on round.
    - Real demand signals from premium industrial customers and Google's EAC agreement.
    - Clear decarbonization thesis anchored by a first-of-its-kind European green-steel asset.
  topRisks:
    - First-of-a-kind commissioning and schedule risk, with commercial start pushed into 2027.
    - Opaque unit economics, pricing terms, and current valuation.
    - Continued dependence on capital markets, project sponsors, and complex supply-chain execution.
    - Heavy regulatory, logistics, and hydrogen-power integration complexity.
  unresolvedGaps:
    - Detailed equity-versus-debt tranche breakdown of the €6.5 billion and €1.4 billion financings.
    - Exact offtake volumes and pricing terms under each customer agreement.
    - Audited financial statements, headcount, and unit economics at the entity level.
    - Final commissioning and first-steel date confirmation for 2026 versus 2027.
    - Realised green-hydrogen production cost at commercial scale on the Boden site.
