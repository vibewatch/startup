    keyQuote: >-
      Subsequent developments highlight ongoing funding challenges for the project, originally estimated lower but now
      requiring over €2 billion more as of March 2026 to complete construction amid cost overruns, missing state grants,
      and higher material/infrastructure expenses, doubling prior needs from €975 million announced in October 2025.
      Stegra has issued 850 million new shares, increasing total shares by 23%, with new shareholders like Koc Group
      taking 2%, and received Swedish state grants of SEK 390 million in November 2025 and €41 million recently,
      conditional on securing full funding by spring 2026. The company reports over 60% project progress with a
      three-month timeline extension, focusing on insourcing railway and port infrastructure previously expected from
      external parties. Leadership changes including a new CFO and board reshuffle accompany these efforts, while
      experts question the project's risk, transparency, cost estimates exceeding €7 billion, and further public funding
      needs, comparing it unfavorably to established players like SSAB.
