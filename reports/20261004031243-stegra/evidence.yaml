evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization-structure
    missingEvidence: >-
      Detailed entity-level balance sheet, audited debt tranche covenants, and exact senior-versus-junior debt
      amortization schedules for the €6.5B and €1.4B facilities.
    whyItMatters: >-
      Without audited financial disclosures, liquidity runway, interest burdens, and potential debt covenant breach
      risks cannot be independently underwritten.
    diligencePath: >-
      Request audited annual financial statements, facility agreements, and intercreditor deeds under NDA during
      confirmatory sponsor diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: customer-offtake-pricing
    missingEvidence: >-
      Commercial offtake contract details specifying firm take-or-pay volumes, green premium pricing mechanisms, and
      indexation formulas across industrial buyers.
    whyItMatters: >-
      Revenue projections and cash flow break-even depend directly on real-world realized green steel premiums over
      conventional blast-furnace commodity prices.
    diligencePath: >-
      Review redacted bilateral customer contracts with automotive and technology offtakers to verify minimum volume
      commitments and price floors.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: commercial-operations-date
    missingEvidence: >-
      Independent engineering audit report confirming revised commissioning milestones and commercial hot commissioning
      date for the Boden DRI tower and melt shop.
    whyItMatters: >-
      Public sources diverge between late 2026 and 2027 operational startup, introducing construction interest
      capitalization and pre-operating burn variance.
    diligencePath: >-
      Commission or review independent owner's engineer progress reports and equipment supplier delivery certifications
      for the Boden site.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: spot-market-green-premium
    missingEvidence: >-
      Empirical spot market transaction pricing data for commercial green steel volumes once the Boden facility enters
      full production.
    whyItMatters: >-
      Validates whether merchant volumes outside pre-sold bilateral contracts can command the targeted 20% to 30% green
      premium during broader macroeconomic cycles.
    diligencePath: Track European steel spot indexes and bilateral trade disclosures post-commissioning in 2027.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: offtake-contract-pricing
    missingEvidence: >-
      Disclosed pricing formula, take-or-pay volume penalties, and indexing terms for long-term supply agreements with
      automotive and industrial offtakers.
    whyItMatters: >-
      Without contractual price floors and indexation formulas, Stegra's margin protection against power and iron ore
      price volatility cannot be validated.
    diligencePath: Review redacted customer agreements or confidential project finance syndicate disclosure packs.
    relatedQuestionRefs:
      - QP004
  - id: GP002
    type: missing-source
    severity: material
    topic: incumbent-green-cost-parity
    missingEvidence: >-
      Audited per-tonne cash production cost comparisons between Stegra's green hydrogen DRI-EAF route and incumbent
      blast furnace relining or natural gas DRI routes under varying EU ETS carbon price scenarios.
    whyItMatters: >-
      Competitor switching dynamics depend directly on whether Stegra's green premium remains competitive against
      incumbent blast furnace operations facing escalating EU carbon allowance costs.
    diligencePath: >-
      Analyze industry benchmark studies from European steel associations or technical diligence reports assessing
      delivered hydrogen cost curves.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited site-level levelized cost of hydrogen ($/kg H2) and conversion cost per metric tonne of liquid steel at
      the Boden facility.
    whyItMatters: >-
      Without primary plant conversion cost benchmarks, long-term gross margin viability and sensitivity to European
      electricity tariff volatility cannot be verified.
    diligencePath: >-
      Obtain the lender technical advisor financial model and long-term renewable PPA rate schedules during confidential
      data room access.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: project-timeline
    missingEvidence: Updated official construction schedule and first hot-metal commissioning target following the 2026 100-day review.
    whyItMatters: >-
      Any timeline slippage from 2026 into 2027 increases debt service burn and risks customer contract delivery
      penalties under binding offtake terms.
    diligencePath: Request the revised master project schedule (EPC progress curves) approved by the new board of directors.
    relatedQuestionRefs:
      - QI006
  - type: conflicting-data
    severity: material
    topic: electrolyser-capacity
    missingEvidence: >-
      A current engineering schedule that reconciles the 690 MW, 700 MW, 740 MW, and 800 MW public descriptions into
      installed, commissioned, and expansion capacities.
    whyItMatters: >-
      Electrolyser nameplate and commissioning scope determine hydrogen availability, integration risk, and achievable
      steel throughput.
    diligencePath: >-
      Obtain the as-built equipment list, grid-connection capacity, module acceptance records, and commissioning
      certificate from Stegra and the electrolyser supplier.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: commissioning-and-quality
    missingEvidence: >-
      Integrated commissioning results, plant availability, hydrogen output, DRI metallization, steel yield, grade
      qualification, and support-service metrics.
    whyItMatters: Construction completion does not establish reliable operation or customer-qualified steel at economic yield.
    diligencePath: >-
      Review monthly commissioning dashboards, acceptance-test protocols, customer qualification records, warranty
      terms, and the ramp-to-nameplate plan.
    relatedQuestionRefs:
      - QE004
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: eac-and-environmental-controls
    missingEvidence: >-
      The underlying environmental permit, EAC methodology, named registry and auditor, latest audit opinion, and
      controls preventing double claims.
    whyItMatters: >-
      Company descriptions alone do not independently verify regulatory compliance, certificate integrity, or acceptance
      in customer emissions accounting.
    diligencePath: >-
      Request the permit docket and amendments, EAC methodology and registry rules, auditor engagement, assurance
      statement, and sample certificate retirement record.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-and-practitioner-signal
    missingEvidence: >-
      Public practitioner evidence of long-duration plant reliability, maintenance response, control-system resilience,
      cybersecurity, and incident handling; the assigned pool contains a thesis proxy but no operating community or
      developer surface.
    whyItMatters: >-
      The absence of public incidents or developer discussion does not prove reliability, security, or adequate
      operational support for a first-of-a-kind integrated plant.
    diligencePath: >-
      Interview commissioning engineers and integration partners; review maintenance logs, control-system architecture,
      cyber assessments, incident registers, and supplier service-level commitments.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: contract-terms-and-pricing
    missingEvidence: >-
      Disclosed pricing formulas, penalty clauses for delayed plant delivery, and precise multi-year renewal terms in
      bilateral customer offtake contracts.
    whyItMatters: >-
      Without visibility into volume take-or-pay commitments or price premium indexation, customer revenue durability
      and margin stability cannot be independently verified.
    diligencePath: >-
      Review confidential commercial annexes and offtake contracts under non-disclosure agreement during formal
      underwriting diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-enumeration
    missingEvidence: >-
      Full customer offtake registry detailing all commercial partners, contracted annual tonnages, and specific steel
      grade specifications across automotive and industrial sectors.
    whyItMatters: >-
      Partial public announcements omit secondary customers and distribution quotas, obscuring true customer
      concentration and revenue diversification.
    diligencePath: Request customer order books and audited offtake allocation schedules from Stegra management.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: valuation-inputs
    missingEvidence: >-
      Current post-money equity valuation, fully diluted capitalization, share price, security rights, liquidation
      preferences, and investor ownership percentages.
    whyItMatters: >-
      Without these fields, dilution, downside priority, and the price paid for a minority interest cannot be
      calculated.
    diligencePath: >-
      Obtain the signed June 2026 financing documents, current cap table, shareholder agreement, and articles from
      management and legal counsel.
    relatedQuestionRefs:
      - QV003
      - QV005
  - type: private-evidence-only
    severity: material
    topic: project-economics
    missingEvidence: >-
      Audited cost incurred, remaining cost-to-complete, contingency, liquidity, debt-draw schedule, covenants,
      commissioning spend, and steady-state cash-flow model.
    whyItMatters: >-
      These inputs determine whether the financing is sufficient and whether enterprise value accrues to equity after
      debt and completion risk.
    diligencePath: >-
      Review the latest independent engineer report, lender model, audited accounts, board-approved budget, and covenant
      compliance certificate.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV007
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Binding customer volumes, steel prices, EAC prices, duration, termination rights, take-or-pay protection, and
      cash-collection schedule.
    whyItMatters: >-
      Demand announcements cannot support revenue, margin, or debt-service estimates without contract economics and
      enforceability.
    diligencePath: Inspect executed customer contracts and reconcile committed deliveries to the commissioning and production ramp.
    relatedQuestionRefs:
      - QV004
      - QV005
  - type: missing-source
    severity: material
    topic: comparable-valuations
    missingEvidence: >-
      Stage- and technology-comparable public-company, private-round, M&A, project-finance, or secondary-market
      valuation observations.
    whyItMatters: >-
      A valuation range and target return cannot be triangulated without comparable security values or a verified
      cash-flow model.
    diligencePath: >-
      Commission a transaction-comparable study after normalizing project stage, leverage, subsidies, capacity, product
      mix, and commissioning risk.
    relatedQuestionRefs:
      - QV005
  - type: conflicting-data
    severity: material
    topic: financing-scope
    missingEvidence: >-
      A reconciliation of reported funding totals by currency, date, instrument, drawn versus undrawn amount, grant, and
      project versus corporate scope.
    whyItMatters: >-
      Funding raised is not cash available, and unreconciled totals can materially overstate liquidity or understate
      leverage.
    diligencePath: >-
      Reconcile management's sources-and-uses schedule to bank confirmations, grant awards, and audited balance-sheet
      cash and debt.
    relatedQuestionRefs:
      - QV003
      - QV005
