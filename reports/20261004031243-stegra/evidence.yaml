    keyQuote: >-
      The added financing of €1.4 billion will be used to complete the construction of the plant in Boden. This includes
      previously communicated scope expansions, such as the insourcing of selected infrastructure components, coverage
      of increased project costs, and the establishment of a prudent financial buffer. At the completion of the
      financing round, a higher equity ratio results in a stronger and more resilient financial position for Stegra.
      After several slower months during the funding activities, Stegra will now ramp up construction activities. The
      project timeline is under review.
