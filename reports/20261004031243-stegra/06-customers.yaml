chapter:
  number: 6
  title: "Customers"
  summary: "Stegra's customer strategy relies on high-volume commercial commitments from automotive, industrial, and technology leaders, including physical offtake relationships and first-of-a-kind Environmental Attribute Certificate (EAC) book-and-claim contracts. However, pre-revenue operations, first-of-a-kind commercial plant commissioning milestones, and stringent public financing conditions underscore customer delivery and timeline sensitivity across its key partnerships."
sections:
  - id: "customer-segmentation-and-buyer-structure"
    title: "Customer Base Segmentation and Industrial Purchasing Channels"
    body: "Stegra's commercial strategy targets four distinct customer categories facing decarbonization mandates across the European industrial landscape: premium passenger automotive manufacturers, commercial heavy transport fleets, industrial materials processing and distribution networks, and digital technology hyperscalers [CU001, CU014]. Automotive manufacturers and industrial equipment producers require near-zero emission flat steel to satisfy Scope 3 supply chain reduction requirements established by European sustainability regulations [CU004]. Commercial procurement models differ substantially by segment: automotive original equipment manufacturers (OEMs) structure direct multi-year offtake allocations for hot-rolled and cold-rolled coils, whereas materials service centers manage secondary distribution quotas and processing [CU001, CU003]. Stegra employs between 501 and 1000 personnel across Stockholm and Boden to manage commercial contracting and technical customer engineering workflows [CU013]."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "commercial-commitments-and-adoption-trajectory"
    title: "Commercial Commitments, Plant Milestones, and Adoption Trajectory"
    body: "Commercial adoption of Stegra's green steel output is tightly linked to the construction and commissioning schedule of its flagship manufacturing complex in Boden, Sweden [CU001, CU007]. Stegra has established bilateral supply and certificate agreements with global enterprise customers, but the venture remains pre-revenue as giga-scale electrolyzer modules and direct reduction towers undergo structural installation [CU002, CU005, CU007]. The operational timeline has shifted from initial late-2026 targets toward commissioning in 2027, making customer delivery schedules dependent on successful equipment qualification and electrical integration [CU007, CU010]. To support outbound shipping logistics once steel production commences, Stegra has contracted rail traffic with Green Cargo and maritime transport partnerships with regional Baltic shipping carriers, establishing physical transit corridors connecting northern Sweden to central European industrial buyers [CU009]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU007"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof-and-eac-mechanisms"
    title: "Named Customer Proof, Partner Relationships, and EAC Instruments"
    body: "Stegra has validated customer demand through high-profile bilateral agreements across both physical steel offtake and book-and-claim environmental certificate structures [CU002, CU003, CU005]. In September 2026, Google announced a landmark agreement to procure environmental attribute certificates (EACs) tied to up to 91,000 metric tons of steel output produced in Stegra's inaugural production year [CU002]. This book-and-claim mechanism enables technology companies to mitigate data center embodied carbon emissions by up to 40% without taking physical custody of heavy steel coils, establishing an innovative commercial revenue stream during facility ramp-up [CU002, CU006]. Complementing certificate sales, Stegra signed an agreement with thyssenkrupp Materials Services to process and distribute non-prime steel output, securing downstream channel placement for early production runs alongside partnerships with major automaker accounts [CU003, CU005]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU003"
  - id: "retention-concentration-and-procurement-risks"
    title: "Customer Retention, Anchor Concentration, and Financing Contingencies"
    body: "While announced customer relationships demonstrate strong market pull for near-zero emissions steel, Stegra confronts substantial customer concentration and project execution risks [CU010, CU011]. Commercial agreements are concentrated among a small cadre of early corporate champions such as Google, Microsoft, and leading European automotive groups [CU002, CU005, CU011]. Stegra's public disclosures omit specific multi-year volume pricing formulas, take-or-pay penalty clauses, and contract renewal mechanisms, leaving revenue durability unverified by independent auditors [CU012]. Furthermore, execution delays directly interact with capital availability: the Swedish Energy Agency conditioned its $41 million funding award on Stegra demonstrating by spring 2026 that it has secured all remaining capital needed to complete the project, illustrating how customer commercial timelines depend on project solvency and timely delivery execution [CU008, CU010]."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU012"
