  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 核心风险概要与等级排序
        blocks:
          - type: paragraph
            body: >-
              工业脱碳超级项目面临复合交付风险，首创型技术整合与数十亿欧元的资金强度在此高度交织 [CR001, CR005]。Stegra 位于瑞典北部的 Boden
              旗舰工厂融合了绿电电解水制氢、直接还原铁（DRI）和电弧炉（EAF）炼钢，设计目标比高炉路线减排最多 95% [CR001, CR003,
              CR011]。然而，这一前所未有的部署规模和复杂性造成了工期阻滞与资金压力，促使公司在工程施工攻坚期重新复核交付里程碑 [CR002, CR005]。Stockholm 和 Boden 两地员工规模扩充至
              500-800 人以上，体现出在严峻工业环境下组织投入的加速膨胀 [CR007, CR008, CR010]。Stegra 面临的核心风险主要分布在运营交付、供应链与交易对手合规、技术整合以及资本结构杠杆四方面
              [CR002, CR004, CR006, CR012]。2026 年 6 月交割的 €1.4 billion 融资虽然提供了关键流动性过渡，但交付节点依然处于工业股东和银团的严密复核之下 [CR002,
              CR005, CR009]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
