            body: >
              在工程完工前，Stegra 与头部 OEM 厂商（Mercedes-Benz、Porsche、Volvo Group、IKEA）敲定了 1.5 Mtpa
              的多年期包销协议，将传统大宗钢铁的高波动风险转化为公用事业般可预测的远期现金流。这些包含约 25% 绿色溢价的合同结构充当了关键的可融资抵押物，让一家尚无营收的初创企业撬动了 €3.5 billion
              的商业银行优先贷款。
