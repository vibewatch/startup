              [CU004]。不同客群的采购机制存在明显分野：汽车整车厂（OEM）直接针对冷热轧卷板锁定多年期包销配额，材料加工中心则负责统筹二级分销与加工配送 [CU001, CU003]。Stegra 在
              Stockholm 与 Boden 共雇佣了 501 至 1000 名员工，推进商业商务洽谈与客户工程技术流程 [CU013]。
