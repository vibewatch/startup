      - number: '4.2'
        title: 资本结构、融资依赖与资本开支落地
        blocks:
          - type: paragraph
            body: >
              建设欧洲 50 年来首座大型绿地钢厂需要极大的前置资本投入，这使得 Stegra 高度依赖银团项目贷款与主权资金支持。Boden 基地一期预计总投资达 €6.5 billion（约 $7.08
              billion），涵盖 700 MW 场内绿氢电解槽、2.1 Mtpa 直接还原铁（DRI）竖炉与 2.5 Mtpa 电弧炉（EAF）炼钢车间。截至 2024 年 1 月，初期的 €6.5 billion
              融资组合包含 €3.5 billion 优先贷款、最多 €600 million 次级夹层债务、约 €300 million 初始股权，以及欧盟委员会通过复苏与韧性基金批准的 €265 million
              直接赠款，贷款由商业银行财团与瑞典国家债务局提供兜底担保。


              尽管初始融资规模庞大，但极高的资本强度、工程范围扩充与核心基建自主建设，迫使公司在投产前必须获得大额追加资金。2026 年 4 月，Stegra 就 €1.4 billion（$1.65
              billion）的追加轮融资达成原则一致，由 Wallenberg Investments 牵头财团主导，成员涵盖 Temasek、IMAS Foundation、Bolero 与
              SEB-Stiftelsen，既有领投方 Altor、Hy24 和 Just Climate 继续跟投。该轮 €1.4 billion 融资于 2026 年 6
              月正式交割，补充了项目资本金，但管理层承认在融资期间施工进度放缓了数月，且整个项目工期已被重新评估。到了 2026 年 9 月，独立报道与公司公告显示新股东启动了百日复核，并任命 Håkan Buskhe 出任
              CEO 来统筹后续资金缺口，进一步印证了资金敞口与工程交付风险依然高企。
            claimRefs:
