      - number: '7.2'
        title: 监管、环境与供应链治理
        blocks:
          - type: paragraph
            body: >-
              立足欧洲能源转型与重工业的交汇点，Stegra 直面严苛的监管体系、环境监测指令和贸易合规审查 [CR003, CR004]。为保障复杂跨境采购网络的合规性，Stegra 推行了董事会于 2026 年 5
              月审议通过的完整《供应商行为准则》[CR004]。该框架强制要求严格遵守国际劳工准则、持有经 ISO 14001 或 EMAS 认证的环境管理体系，并全面申报 Scope 1、Scope 2 及上游 Scope
              3 温室气体排放 [CR004]。此外，Stegra 依据欧盟法规 2017/821
              严禁来自受冲突影响和高风险区域（CAHRAs）的冲突矿产，规定转包最多不超过两层，对规避制裁零容忍，并对供应商保留突击现场审计权限
              [CR004]。违反条款被定性为重大合同违约，此举压降了监管与声誉风险，但也增加了供应商准入的管理成本 [CR004]。
            claimRefs:
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
      - number: '7.3'
        title: 运营物流、交易对手依赖与财务风险敞口
        blocks:
          - type: paragraph
            body: >-
              Stegra 的一体化制造闭环仰赖高度协同的物流通道、公用事业长协与长期客户联盟 [CR001, CR003, CR007]。进厂原料与出厂成品钢依托与 ESL Shipping、Royal
              Wagenborg、Pangaea Logistics Solutions 和 Clarksons 的专属航运合作，以及与 Green Cargo 的铁路协议、Skellefteå 和 Umeå 的港口集疏运
              [CR001, CR007]。在客户端，来自 Thyssenkrupp Materials Services、Scania 和 Schaeffler 等工业客户的包销承诺，加上与 Google 签订的覆盖最多
              91,000 metric tons 的环境属性凭证（EAC）创新协议，构成了收入端的可贷性支撑 [CR001, CR002, CR003]。然而，资本开支预算攀升与工程范围变动，此前迫使其募集 €1.4
              billion 追加股权，用以覆盖后续建设支出、对冲成本波动风险并为 €3.5 billion 优先债务提供保护垫 [CR005, CR006, CR009]。关键监控指标与叫停止损红线（kill
              criteria）依然严格挂钩试车节点兑现率、电解槽性能实证与偿债覆盖水平 [CR002, CR005, CR009]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
      - number: '7.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 工期复核与首创工程落地风险
            body: >-
              尽管 €1.4 billion 融资方案顺利交割缓解了当期现金流压力，但 Stegra 确认其 Boden 项目时间表仍处于复核之中，凸显出后续交付的严峻挑战 [CR002,
              CR005]。建设复杂的氢基直接还原设施需要将吉瓦级电解槽试车与高温炼铁流程精确协同，一旦出现未预见的调试卡点，将进一步推迟首笔商业营收进账并推高资金持有成本 [CR001, CR002]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
  - number: 8
    title: 估值与投资研判
    sections:
      - number: '8.1'
        title: 投资建议与定价纪律
        blocks:
          - type: paragraph
            body: >
              基于现有公开信息的审慎投资建议是“持续跟踪、深入研究”，而非买入。Stegra 跨过了一道重要资金门槛：路透社报道与 Stegra 官方时间线均显示，€1.4 billion 轮次已于 2026 年 6 月 24
              日完成交割。这一节点充实了近期工程竣工的资金池，但这并不确立向新投资人开放的股权入场公允价值。尽调资料既未公开当前的投后估值，也未披露完全稀释的股权结构表（cap
              table）、清算优先权分配顺序（preference
              waterfall）或经审计的项目现金流模型。因此，对融资完成与运营风险走势的置信度为中，但对定价估值的置信度为低。风险依然高企，因为工厂仍处于施工监测中，且在前期进度放缓后工期已被重新评估。投资入场纪律应严格基于非公开文件的实质核验，而非简单以累计融资总额代替估值测算。
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV015
      - number: '8.2'
        title: 融资背景、商业实证与反向逻辑
        blocks:
          - type: paragraph
            body: >
              4
              月份的融资公告称，新注入的资金将用于完成工厂建设、承担部分基础设施自营投入与超支成本，并提供安全垫。独立报道也提到，在融资悬而未决期间施工进度放慢。这些事实说明本轮融资既是流动性排雷动作，也是资金缺口扩大的实证。商业化信号真实存在，但不等于已实现营收：Google
              签约认购首年最多 91,000 metric tons 产量的环境属性凭证，Stegra 时间线也显示截至 2022 年 5 月预售量已超 1.5 million
              tonnes。但两处信息源均未披露真实成交价格、现金回款节点、利润率或照付不议条款保障。投资正面逻辑在于低碳钢铁的刚性需求确实存在；反面逻辑则是资本高度密集的试车爬坡路径，其底层经济性至今仍属于非公开范畴。
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 乐观、基准与悲观情景研判框架
        blocks:
          - type: paragraph
            body: >
              情景分析应当保持审慎预判，因为现有事实依据无法支撑精细的概率分布、目标回报率或估值区间测算。在乐观情景下，融资到位转化为不间断施工，顺利实现监测中的 2027
              年投产，客户需求信号顺利转变为已签约的现金流。在基准情景下，工程建设持续推进，但工期节点与产能爬坡经济性仍不明朗，在投资定价前需要更多信息披露支撑。在悲观情景下，成本进一步超支、绿氢扩容遇阻或工期延误，将迫使公司再次融资稀释股权，甚至触发银团主导的债务重组。投资逻辑被推翻的最直接预警信号包括：施工再度放缓、投产日期推迟至当前年份之后、客户意向订单流失或削弱，以及在未披露偿还顺位和稀释比例的情况下启动新一轮融资。这些属于客观可跟踪的信号，而非人为赋予的概率数值。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.4'
        title: 股权结构、退出就绪度与终审尽调
        blocks:
          - type: paragraph
            body: >
              4 月达成的条款涉及 Wallenberg 牵头财团获取领跑所有权份额并提名新董事，这一安排虽然能强化产业监督，但也可能重塑少数股东权益。仅凭公开融资总额无法还原股权结构表：Indexed.vc 报道 7
              轮融资累计 $4.6 billion，而 Stegra 自身时间线记录 2024 年 1 月敲定接近 €6.5 billion，另有 €1.4 billion 轮次于 2026 年 6
              月交割。由于币种、日期和融资统计口径差异显著，这些数字不能简单加总，也不应等同于账面可用现金。现有材料无法证实退出就绪度；既无公开 IPO
              时间表，也未披露可比并购交易或经审计的稳态盈利数据。在设定估值区间或回报预期前，终极尽调必须调阅最新的股本结构、资金偿还顺序、剩余完工成本、试车时间表、客户订单单价条款以及银行贷款限制性契约。
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 融资规模不等于估值定价
            body: |
              完成交割的 €1.4 billion 融资应被视为资金端支持的实证，而非新股权入场价格具备吸引力的依据。估值判断必须掌握完全稀释后的股权结构表、证券权益条款、剩余完工成本，以及从试车到稳态生产的现金流测算模型。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV015
