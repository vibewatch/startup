      - number: '1.3'
        title: 资本结构与股东财团
        blocks:
          - type: paragraph
            body: >-
              Stegra 是全球融资规模最大的未上市工业气候技术企业之一，涵盖股权、项目债务与主权补贴，累计锁定约 €7.9 billion 融资承诺。2024 年 1 月，公司敲定首期 €6.5 billion
              项目融资方案，包含来自欧洲主要商业银行的 €3.5 billion 优先债、€600 million 次级夹层贷款、直接股权，以及欧盟委员会借助欧盟创新基金从复苏与韧性基金拨付的 €265 million
              赠款。2026 年 6 月，Stegra 宣布正式完成 €1.4 billion（$1.7 billion）追加成长型融资，由 Wallenberg Investments 领投的财团主导。Wallenberg
              Investments 认缴 €250 million 直接股权，联合投资方包括 Temasek、IMAS Foundation、Bolero 与 SEB-Stiftelsen，既有股东 Altor、Hy24 和
              Just Climate 继续跟投。全体贷款银行团重申全面支持，维持了此前约定的信贷额度。
            claimRefs:
