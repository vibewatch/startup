      - number: '5.2'
        title: 一体化工艺架构与规模
        blocks:
          - type: paragraph
            body: >-
              工艺全流程始于可再生电力与电解水制氢，随后接续铁矿石氢基直接还原、电弧炉熔炼、连铸与轧制。CINEA 表示，一体化设计省去了炼铁与精轧之间的冷却、转运及二次加热；Global Energy Monitor
              则独立将该工程归类为在建 DRI 与 EAF 钢厂。公开资料中关于电解槽的具体名义产能尚未统一：CINEA 称其为 690 MW，Global Energy Monitor 在不同数据项中分别标注为 700 MW
              与 800 MW，KTH 论文记录为 740 MW。这些数值应当被视为披露差异，不可简单取平均值拼凑产能。Stegra 自身披露的时间表显示最后一批电解槽模块于 2026 年 4 月吊装到位，DRI 塔架于
              2026 年 7 月达到 145 米。这些属于工程安装节点，并非绿氢稳定产出、钢材品质、成材率或商业可交付的实证。
