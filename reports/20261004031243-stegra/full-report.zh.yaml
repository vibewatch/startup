companyProfile:
  summary: >-
    Stegra 是一家处于后期阶段的非上市工业气候企业，正在瑞典 Boden 建设欧洲首座大型绿氢 DRI 与 EAF 钢厂。公司于 2020 年以 H2 Green Steel 之名成立，在 Stockholm 和 Boden
    开展运营，核心管理团队由 Henrik Henriksson 与 Harald Mix 领衔。公司累计获得约 €7.9 billion 已披露融资承诺，其中包括 2026 年 6 月完成交割的 €1.4 billion
    融资。公司目前仍未产生营收，商业化投产已推迟至 2027 年；当前的尽调重点因而更多取决于项目工程交付与资金支持，而非已披露的运营经济数据。
