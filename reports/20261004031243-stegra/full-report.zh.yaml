              - CP011
      - number: '3.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 资本开支强度与交付敏感度对比传统钢企
            body: >-
              Stegra 自建港口与铁路基建的决策，叠加累计超过 70 亿欧元（exceeding 7 billion
              euros）的项目融资，使其对工程延期和资本市场环境极为敏感；相比之下，传统钢企在行业下行期仍可灵活调度既有高炉产能。
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 商业模式、包销结构与定价动态
        blocks:
          - type: paragraph
            body: >
              Stegra 是一家原生工业金属制造企业，旨在用可再生绿电制取的场内绿氢替代冶金焦煤，推动难以减排的钢铁制造脱碳。由于公司目前仍在 Boden 建设全新工厂，初期目标投产年份定在 2026
              年，现阶段尚未产生商业化钢铁销售收入。其远期商业根基建立在期限最长达 7 年的约束性长期包销协议上，模式类似于新能源项目融资中的购电协议（PPA）。截至 2024 年底，Stegra 已锁定每年约 1.5
              million tonnes per annum（Mtpa）近零排放钢的约束性包销承诺，约占其初期 2.5 Mtpa 名义粗钢产能的 60%。客户名单囊括 Mercedes-Benz、Porsche、Volvo
              Group、Scania 和 IKEA 等高端车企与耐用消费品巨头。


              商业变现的关键在于能否在传统化石基准钢价之上获得结构性绿色溢价。高端汽车采购方能够接受 25% 左右的绿色溢价，折算到每辆豪华乘用车上的零部件增量成本约 €500——对于终端售价在 €100,000 到
              €250,000 之间的车型而言，该溢价极易被消化。此外，Stegra 在实物供货合同之外，引入了环境属性凭证（EAC）与预订与声明机制。2026 年 9 月，Google 达成 EAC 采购协议，认购
              Stegra 首年产出中最多 91,000 metric tons 钢材的脱碳属性，为面临 Scope 3
              减排刚性约束的买家提供了减排价值变现的第二收入渠道。但最终交付量与价格执行仍取决于工厂调试试车与产能爬坡。
