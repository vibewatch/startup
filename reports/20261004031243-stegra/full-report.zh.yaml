      - number: '1.4'
        title: 运营规模、包销协议与交付阻力
        blocks:
          - type: paragraph
            body: >-
              尽管资本储备雄厚，Stegra 仍面临首创型重工业项目典型的工程交付与落地挑战。2026 年初，管理层对商业化试车时间表启动复核，承认因设备安装规模庞大且电力基础设施需要爬坡，商业化钢铁投产时间已从 2026
              年底延后至 2027 年。商业包销上，Stegra 已锁定多家工业买家的客户协议，并与 Google 签署环境属性凭证协议，覆盖首个运营年最多 91,000 metric tons
              钢材产量。然而，具体合同定价机制、照付不议（take-or-pay）结构以及单位制氢成本均未公开披露，是投资方测算商业盈亏平衡时的关键尽调盲区。
            claimRefs:
              - CO003
              - CO004
              - CO008
              - CO013
              - CO014
