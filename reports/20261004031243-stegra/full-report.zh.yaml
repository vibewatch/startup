  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业交付形式
        blocks:
          - type: paragraph
            body: >-
              Stegra 的目标交付产品是在 Boden 采用可再生电力、绿氢和绿铁生产的近零排放钢。公司自述其减排优势比欧洲传统炼钢工艺最多高出
              95%，但该数据仍属公司宣称，并非已投产工厂披露的实际运营结果。公开资料显示其一期钢产能为每年 2.5 million tonnes，远期规划为 5
              million-tonne。其商业模式还借助环境属性凭证（EAC）将环境价值与实物钢材剥离。Stegra 称每份 EAC 代表 1 吨近零排放钢；Google 称双方协议覆盖了首个生产年份最多 91,000
              metric tons 产量对应的凭证。非一级品钢材是产能爬坡期的特殊产出：Thyssenkrupp Materials Services 同意采购数十万吨级（high-six-digit
              range）钢材，而附带的绿色属性可单独出售。这为开工初期的收得率提供了变现途径，但凭证价格与实际非一级品占比均未公开。
