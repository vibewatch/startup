      - number: '5.3'
        title: 成熟度、控制体系与技术风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月的独立报道称，截至 2025 年 10 月底工程完成度为 60%，当时预计在 2027 年投产；该报道同时指出项目成本攀升、工期延误，并且公司在寻求超 $1 billion
              追加资金。这些迹象表明工期、一体化调试试车和投产成材率构成了核心产品风险。Stegra 称其 EAC 体系采用经独立外部审计师认证的预订与声明溯源链，其时间线记载于 2023 年 6
              月取得了完整环境许可。既有资料未指明 EAC 审计机构、未出具审计意见、未证明车规级认证、未披露工厂开工率，也未提供事故记录与网络安全内控档案。KTH 的一篇论文可作为未来氢能技术路径的参考，但其 SOEC
              模型针对的是规划中的葡萄牙项目，并非 Boden 的实测数据。该研究认为 SOEC 仅在高开工率与热耦合条件下才具经济性，而碱性水电解（AWE）在低利用率或资本开支不确定的情况下表现更为稳健。
