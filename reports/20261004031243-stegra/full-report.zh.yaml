        - label: 项目债再融资与杠杆率
          values:
            - label: 低
              tone: positive
            - label: 极高
              tone: negative
            - label: 成熟
              tone: positive
            - label: 中
              tone: warning
        - label: 供应链与制裁违规
          values:
            - label: 低
              tone: positive
            - label: 高
              tone: negative
            - label: 成熟
              tone: positive
            - label: 低
              tone: positive
        - label: 电网消纳与可再生电力供应
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 成熟
              tone: positive
            - label: 中
              tone: warning
        - label: 商业承购与 EAC 定价
          values:
            - label: 低
              tone: positive
            - label: 中
              tone: warning
            - label: 成熟
              tone: positive
            - label: 低
              tone: positive
    notes: 评估综合考量了公司披露的里程碑节点、债务融资契约及工程规模化要求。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
  - id: FV001
    title: 投资建议逻辑推演链
    type: flow
    summary: 区分融资进展与对股权价值做出投资判断所需信息的有序证据链。
    data:
      nodes:
        - id: financing-close
          label: €1.4B 融资交割
          detail: 2026 年 6 月近期完工资金状况得到改善。
        - id: proceeds
          label: 资金专项用于完工
          detail: 4 月规划涵盖工程建设、范围扩展、成本增加及财务缓冲。
        - id: execution
          label: 执行风险依然未解
          detail: 施工此前有所放缓，且项目工期处于复核中。
        - id: commercial-proof
          label: 需求信号初现
          detail: Google EAC 协议与报道提及的预售数据均未披露实际商业条款与经济效益。
        - id: valuation-gap
          label: 股权条款缺失
          detail: 现有公开证据未披露当前估值、稀释比例、优先权及回报相关参数。
        - id: recommendation
          label: 保持跟踪 / 深入研究
          detail: 在非公开交易文件尽调补全证据链前，暂不设定估值区间或目标回报。
    approximationNotes: 本序列仅供定性推演，未赋予发生概率、权重比例、隐含估值或转化率。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV015
