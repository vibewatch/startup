    title: 企业概览
    sections:
      - number: '1.1'
        title: 企业定位与工业使命
        blocks:
          - type: paragraph
            body: >-
              Stegra 于 2020 年以法定原名 H2 Green Steel 成立，总部设在瑞典 Stockholm 和
              Boden。创立初衷是在重工业大宗商品制造中推动碳减排，在铁还原环节用电解绿氢替代化石煤炭。2024 年 9 月，企业更名为
              Stegra，明确将工业使命拓展至绿氢、直接还原铁及近零排放冶金。公司在建的首个商业旗舰项目坐落于 Norrbotten 的 Boden，集成了场内吉瓦级电解槽、高温直接还原竖炉与现代电弧炉。
