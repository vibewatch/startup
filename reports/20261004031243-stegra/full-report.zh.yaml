  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达支出与产品范围
        blocks:
          - type: paragraph
            body: >-
              全球钢铁行业约占全球二氧化碳排放量的 8%，年产量近 2 billion metric tons [CM003]。欧洲每年钢铁总产量约 150 million tonnes，其中扁平材是最大的单一产品类别
              [CM004]。Stegra 明确聚焦以冷轧卷板和热轧卷板形式交付的原生扁平材，专供汽车、家电、建筑制品、能源系统与重型运输等高规格制造领域，而非大宗长材建筑螺纹钢 [CM004, CM008]。传统高炉炼钢每产
              1 吨钢约排放 2 吨二氧化碳 [CM003]。Stegra 在还原环节用瑞典 Boden 700-megawatt
              电解水制氢设施产出的绿氢替代高碳冶金煤，生产直接还原铁（DRI）并在电弧炉（EAF）中熔炼，最多可削减 95% 的运营碳排放 [CM003, CM005,
              CM007]。相比之下，使用天然气的传统直接还原工艺仅能减排 40%，每吨产出仍会产生超过 1 吨二氧化碳，在不断收紧的碳价机制下面临严峻的合规风险 [CM003]。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
      - number: '2.2'
        title: 市场规模测算视角与受限产能释放
        blocks:
          - type: paragraph
            body: >-
              评估近零排放钢的潜在市场空间，必须将宏观工业需求与近期商业可触达、可交付的产能层次区分开来 [CM003, CM004, CM006]。尽管全球粗钢年消费量超过 1,800 million
              tonnes，欧洲钢铁年需求总量约 150 million tonnes，但 Stegra 眼前直接可触达的受众完全取决于欧洲扁平材消费规模，以及愿意承受 20% 至 30% 绿色溢价的工业买家群体
              [CM001, CM003, CM004]。Stegra 在 Boden 的一期规划名义年产能为 2.5 million metric tons，远期扩产目标为 4.5 million metric tons
              [CM003, CM006]。公司已通过合同锁定了初期产能中每年超 1.5 million tonnes 的包销协议，涵盖 Mercedes-Benz、BMW、Porsche、Volvo Group 和
              Scania 等高端车企的多年采购承诺 [CM001, CM003]。在 2026–2028 年初始运营窗口内，业务规模严格受制于产能瓶颈，欧洲绿钢需求明显超过了合规认证供给 [CM004]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
      - number: '2.3'
        title: 买家画像、预算归属与签约机制
        blocks:
          - type: paragraph
            body: >-
              近零排放扁平材的核心需求动能来自欧洲汽车行业，该行业每年消耗约 15 million tonnes 高规格钢材 [CM001]。车企面临严苛的整车厂 Scope 3
              脱碳目标，但钢铁采购占整车物料清单（BOM）的比重有限；支付 20% 至 30% 的绿色溢价，预计折合每辆乘用车的边际增量成本仅数百美元甚至更低 [CM003]。除汽车采购方外，Ikea、Bilstein
              Group 和 Kingspan 等家电与商用建筑制造商也达成了商业合作协议 [CM003, CM007]。在直接实物包销之外，Stegra
              首创了“预订与声明”（book-and-claim）环境属性凭证（EAC）机制，与 Google 签约在第一年覆盖最多 91,000 tonnes 钢铁产量，使科技企业无需实物交割即可对冲数据中心隐含碳排放
              [CM002, CM006]。凭证机制盘活了产能爬坡期的非级品产出，带来了早期补充现金流 [CM002]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
      - number: '2.4'
        title: 政策红利、能源经济性与采纳约束
        blocks:
          - type: paragraph
            body: >-
              支撑绿钢定价的核心底层经济驱动力是欧盟碳边境调节机制（CBAM）。该机制于 2026 年进入申报过渡期，设立进口碳关税以防止高碳海外厂商以低价削弱欧洲本土制造企业 [CM001,
              CM003]。在瑞典北部，Stegra 依托丰沛的水电与风电基荷电力运行 700 MW 电解槽，满足每年 10 TWh 的用电需求，并与 Uniper 和 Axpo 等公用事业公司签订了长期供电合同
              [CM003, CM005, CM007]。然而，严峻的市场制约仍然存在：涵盖吉瓦级电解、高温氢基竖炉还原与电弧熔炼的首创型工程集成带来落地风险，初期工厂建设经历时间表调整，炼钢爬坡推迟至 2026/2027
              年之交 [CM001, CM004]。从长期贸易格局看，竞争压力不容小觑：预计到 2030 年，中东和北非（MENA）等绿电富集地区的绿钢生产成本可能比欧洲低最多 17% [CM001, CM004]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
      - number: '2.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 作为融资抵押品的包销协议
            body: >-
              Stegra 将其 Boden 初期 2.5 Mtpa 产能中的 1.5 Mtpa 以上预售给 Mercedes-Benz 等高端买家并签署多年期协议，把技术与价格风险转化为具备可融资性的优质企业交易对手方信用
              [CM001]。这一合同锁定的需求构成了关键的银行端评估抵押支撑，撬动了超 €4.2 billion 优先项目贷款与 €1.4 billion 股权融资 [CM001]。
            calloutType: insight
            claimRefs:
              - CM001
          - type: callout
            title: 区域能源成本差异与 CBAM 依赖
            body: >-
              尽管瑞典北部具备低成本的北欧可再生电力，且欧盟 CBAM 关税阻隔了未计入碳成本的化石能源进口钢材，但预测显示，到 2030 年中东及北非（MENA）生产商的绿钢成本可能比欧洲工厂低 17%
              [CM001]。欧洲的长期竞争力完全取决于关税机制的持续性以及本地溢价的维系 [CM001]。
            calloutType: risk
            claimRefs:
              - CM001
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 脱碳原生钢格局与竞争对手分层
        blocks:
          - type: paragraph
            body: >-
              欧洲低碳及绿色原生钢铁的竞争格局分为三类：首创新建绿氢 DRI 厂商、分步实施 DRI 转型的传统高炉龙头，以及替代脱碳或尾气/废钢循环服务商。Stegra 卡位新建氢能一体化路线，正在建设欧洲 50
              年来首座新建一体化钢厂，包含场内 700 MW 电解槽与直接还原铁竖炉。相比 SSAB（推进 HYBRIT 无化石计划）、ArcelorMittal、Salzgitter 与 Thyssenkrupp
              等老牌钢企，Stegra 没有高炉资产搁浅包袱，也避免了棕地改造对生产的干扰。然而，传统钢企坐拥现成的客户分销网络、成熟的港口铁路基建以及数十亿欧元的资产负债表。业内常将 Stegra
              单体超级工程的执行风险与资本开支，同 SSAB 等巨头对比：后者的渐进改造策略既控制了前期施工风险，又能抢占车企采购订单。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP012
      - number: '3.2'
        title: 技术能力、原材料采购与成本差异化
        blocks:
          - type: paragraph
            body: >-
              Stegra 的核心竞争优势在于端到端全流程一体化，打通了绿电电解制氢、Paul Wurth/Midrex 氢基竖炉还原以及 SMS EDGE 电弧炉三大环节。Boden
              工厂用场内电解氢替代煤炭还原剂，设计目标是比传统高炉-转炉路线减排最多 95%。为确保生产连续性，Stegra 将关键物流基础设施转为自主统筹，涵盖铁路网以及 Lulea、Skelleftea 和 Umea
              的港口码头。垂直整合虽然规避了第三方物流卡脖子，却令总资金需求增加了 10 亿多欧元（over 1 billion
              euros），并推后了调试投产节点。相比之下，老牌对手依托传统供应链并采用化石天然气向氢气逐步过渡的温和路线，牺牲了一定的减排深度，换取了更低的前期资本开支与技术风险。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 包销绑定、转换成本与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Stegra 商业护城河能否持久，高度取决于长期供货协议以及与企业买家的预订与声明环境属性机制。公司与 Microsoft、Google 和 Thyssenkrupp Materials Services
              等标杆终端用户达成的包销承诺与合作协议，锁定了投产初期的基本采购量。Google 签署的最多 91,000 metric tons
              环境属性凭证协议，证实了高端数据中心算力基建对认证近零排放属性的明确需求。然而，商业扁平材的标准牌号属性限制了客户转换成本，欧洲车企与工业企业对 Stegra
              和传统钢厂普遍采取多渠道采购策略。资本重构、高管交接（历经百日评估后任命 Hakan Buskhe 为 CEO）以及项目成本攀升超 70 亿欧元（past 7 billion
              euros），均反映出持续的资金与交付压力，可能拖累商业交付节点。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
