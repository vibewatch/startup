      - number: '1.2'
        title: 高管团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              Stegra 的运营战略与工业交付由首席执行官 Henrik Henriksson 与联合创始人兼董事会主席 Harald Mix 共同牵头。Henriksson 曾任商用车巨头 Scania Group 总裁兼
              CEO；Mix 则是工业私募股权机构 Altor 和创投平台 Vargas Holding 的创始人。这支管理团队把瑞典工业财团与清洁技术创投力量紧密结合。2026 年 2 月，公司宣布任命 Markus
              Holm 自 2026 年 3 月 1 日起接任首席财务官，创始 CFO Otto Gernandt 则转任专注融资事务的高级顾问。在 2026 年股权财团轮融资落地后，公司还计划提名 Volvo Group 前
              CEO 兼 Ericsson 前董事长 Leif Johansson 出任独立董事会主席，进一步扩充治理架构。
            claimRefs:
