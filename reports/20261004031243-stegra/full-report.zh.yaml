      - number: '4.3'
        title: 成本结构、单体经济性与投资研判困境
        blocks:
          - type: paragraph
            body: >
              从投资尽调与价值研判视角看，Stegra 属于典型的首创型重工业项目，长期商业可持续性取决于能否在单位成本上抗衡传统高炉-转炉（BF-BOF）钢企和天然气 DRI 生产商。工厂运营成本的大头在于 700 MW
              水电解系统的电力采购开支、进口直接还原级铁矿球团原料成本、基于 €7.9 billion 资产盘子的折旧开支，以及波罗的海海运与铁路物流通道运费。尽管 Stegra 借助与 Uniper 和 Axpo 签订 8
              TWh 绿电长协并与 Fortum 合作锁定了供电确定性，但绿氢平准化到厂成本（$/kg H2）以及每吨热轧卷板（HRC）的完整加工成本依然属于未公开的非公开数据。


              机构投资者的财务研判结论是：Stegra
              凭借多年期保底包销和主权增信获得了极为罕见的商业背书，但近期风险收益比仍受制于首创型落地执行的脆弱性。投产前运营亏损、资本开支超支引发工期中途追加股权融资、物流基建转由自身承接，以及百日审查引发的高管换血，意味着财务模型目前还无法测算验证稳态毛利率。在缺少审计财务报表、单吨加工经济性指标与明确热试车节点的情况下，Stegra
              难以满足常规成长型股权条款，必须严格按照承担试车延误与大宗钢价波动敞口的高资本开支基建工程进行审慎估值与测算。
            claimRefs:
              - CI001
              - CI004
              - CI009
              - CI010
              - CI014
              - CI016
      - number: '4.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 首创型工业资产的交付延期与资本开支膨胀风险
            body: >
              Stegra 的财务规划暴露出首创型超级工程的典型成本膨胀。2024 年初完成的 €6.5 billion 初始融资，在 2026 年不得不追加 €1.4
              billion，用以应对基建自主承接、工程范围变更与项目成本上升。鉴于此前施工放缓数月、项目时间表重估，且管理层在 Wallenberg Investments 主导下改组，试车若进一步推迟至 2026
              年以后，将直接加剧 €3.5 billion 优先贷款的利息负担，同时将现金流回收推迟至 2027 年。
