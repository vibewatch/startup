figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 记录公司自 2020 年创立至 2026 年的运营、融资、工程与客户关键节点。
    data:
      items:
        - label: 公司创立
          date: '2020'
          detail: Stegra 最初由 Vargas Holding 与 Altor 以 H2 Green Steel 为名创立，旨在推动钢铁脱碳生产。
          tone: neutral
        - label: Boden 基地开工建设
          date: '2022'
          detail: 在瑞典北部 Boden 为欧洲 50 年来首座新建绿地钢铁厂破土动工。
          tone: positive
        - label: €6.5B 初始融资方案
          date: 2024-01
          detail: 敲定 €3.5B 优先债、€600M 次级债及股权融资，为 Boden 绿地项目建设提供资金。
          tone: positive
        - label: 品牌更名为 Stegra
          date: 2024-09
          detail: 公司品牌更名为 Stegra，体现更广泛的工业脱碳业务范畴。
          tone: neutral
        - label: 首席财务官交接
          date: 2026-02
          detail: 任命 Markus Holm 接任首席财务官，接替初创高管 Otto Gernandt。
          tone: neutral
        - label: 商业化爬坡推迟至 2027 年
          date: 2026-04
          detail: 项目工期进入复核，商业化投产时间由 2026 年推迟至 2027 年。
          tone: negative
        - label: 完成 €1.4B 融资轮交割
          date: 2026-06
          detail: 在借款银团全员支持下，完成由 Wallenberg Investments 财团领投的 €1.4B 融资交割。
          tone: positive
        - label: Google 绿钢 EAC 协议
          date: 2026-09
          detail: 与 Google 签署客户协议，采购对应最多 91,000 吨钢铁的环境属性证书（EAC）。
          tone: positive
    approximationNotes: 里程碑日期汇总自公司新闻公告、监管披露文件及 Reuters 报道。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO006
      - CO008
      - CO009
      - CO013
  - id: FM001
    title: Stegra 绿钢市场规模与产能漏斗
    type: pyramid
    summary: 从全球粗钢产量自上而下细分至 Stegra 已签约承购产能的层级化市场规模漏斗。
    approximationNotes: 全球与欧洲产量指标对应公开行业总量数据；Stegra 产能数据对应已公布的工厂规划参数。
    data:
      items:
        - label: 全球粗钢产量（1,880 Mtpa）
          value: 1880
          note: 涵盖所有技术与钢种的全球宏观粗钢产能格局
        - label: 欧洲粗钢产量（150 Mtpa）
          value: 150
          note: 受 EU ETS 与 CBAM 碳关税规则约束的欧洲粗钢总产量
        - label: 欧洲汽车用钢需求（15 Mtpa）
          value: 15
          note: 构成绿钢核心需求驱动力的欧洲汽车目标市场
        - label: Stegra 远期扩产目标（4.5 Mtpa）
          value: 4.5
          note: Stegra Boden 制造基地的最终规划工业产能
        - label: Stegra 一期标称产能（2.5 Mtpa）
          value: 2.5
          note: 依托 700 MW 绿氢电解槽的一期初始产能
        - label: Stegra 已签约承购承诺（1.5 Mtpa）
          value: 1.5
          note: 支撑项目商业可融资性的已预售具约束力承购量
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM006
  - id: FP001
    title: 竞争定位：生产脱碳深度 vs 资本执行风险
    type: quadrant
    summary: 衡量主要钢铁竞争对手在生产减排深度与资本执行风险两个维度的象限图。
    data:
      xAxis:
        label: CO2 减排深度（较高炉减排比例 %）
        min: 0
        max: 100
      yAxis:
        label: 资本密集度与工程执行风险（1-10 分）
        min: 0
        max: 10
      points:
        - label: Stegra (Boden)
          x: 95
          'y': 8.5
          tone: neutral
        - label: SSAB HYBRIT 转型
          x: 85
          'y': 5.5
          tone: positive
        - label: ArcelorMittal DRI/EAF
          x: 65
          'y': 4
          tone: neutral
        - label: 废钢电炉（EAF）回收钢厂
          x: 75
          'y': 3
          tone: positive
        - label: 传统高炉产线
          x: 10
          'y': 2
          tone: negative
        - label: Thyssenkrupp tkH2Steel
          x: 70
          'y': 6.5
          tone: neutral
    approximationNotes: CO2 减排比例反映申报文件中披露的技术设计上限；资本执行风险采用基于项目规模与融资复杂度的序数评分。
    claimRefs:
      - CP002
      - CP005
      - CP012
  - id: FI001
    title: Stegra 商业收入转化与毛利率瀑布图
    type: waterfall
    summary: 示意性单吨经济模型瀑布图，展示客户钢铁承购总收入在扣除可再生电力、铁矿球团原料及工厂运营成本后如何转化为营业利润。
    approximationNotes: 指标为基于行业基准、长期 PPA 电价及公开项目披露推算的标准化结构估算。实际达成的单吨经济效益在工厂全面商业化投产前仍属保密信息。
    data:
      items:
        - label: 基础钢铁承购总价值
          value: 800
          unit: EUR/t
          note: 假设的大宗商品热轧卷板（HRC）基准参考价
        - label: 绿色溢价加成
          value: 200
          unit: EUR/t
          note: 来自汽车及高端承购客户约 25% 的签约绿色溢价
        - label: 铁矿球团原料成本
          value: -260
          unit: EUR/t
          note: 到厂直接还原级铁矿球团（Vale / Rio Tinto）
        - label: 可再生电力与电解制氢用电
          value: -240
          unit: EUR/t
          note: 供应 700 MW 自备电解槽制氢所需电力
        - label: 工厂运营、废钢与物流
          value: -180
          unit: EUR/t
          note: 电炉炼钢耗材、废钢添加、人工及港口海运
        - label: 项目预估现金边际贡献
          value: 320
          unit: EUR/t
          note: 扣除公司债务还本付息与资本开支折旧前的每吨剩余现金边际
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI009
      - CI016
  - id: FE001
    title: Boden 产品与工艺流程架构
    type: stack
    summary: 六个关联层级展现从可再生投入要素到实体钢铁，以及可独立转让环境属性的规划路径。
    data:
      layers:
        - label: 可再生电力与水
          detail: 现场制氢与电炉炼钢的投入要素；公开材料中未留存实际运行工况数据。
        - label: 水电解制氢
          detail: 用于生产绿氢；公开描述中的标称产能介于 690 MW 至 800 MW 之间。
        - label: 氢基直接还原
          detail: 计划替代煤炭作为还原剂，用于生产海绵铁。
        - label: 电弧炉
          detail: 使用可再生电力熔化海绵铁。
        - label: 连铸连轧
          detail: 无需跨厂区冷却与二次加热，直接将粗钢加工为成品材。
        - label: 实体钢铁与 EAC 商业化变现
          detail: 销售高品质实体钢材或次级钢材，并在特定情景下借助 EAC 单独转让绿色环境价值。
    approximationNotes: 仅展示功能架构；层级流转顺序有据可查，但图表并不意味已达成投产产出、存在唯一定论的电解槽标称产能，或已验证商业化成品率。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE008
      - CE015
  - id: FU001
    title: 客户采购旅程全景图
    type: journey-map
    summary: Stegra 绿钢客户分阶段采纳生命周期，涵盖双边意向承诺、EAC 凭证交易（book-and-claim）至实体投产承购全流程。
    approximationNotes: 采纳阶段与采购触点基于已公布的客户协议、证书合同及物流合作安排梳理。
    data:
      items:
        - label: 初期商业接洽
          stage: 初期商业接洽
          actor: 企业可持续发展与采购部门
          action: Letter of intent and alignment on Scope 3 carbon reduction criteria
          touchpoints:
            - 双边会议
            - 碳核算研讨
        - label: 长期协议架构设计
          stage: 长期协议架构设计
          actor: 首席采购官与法务团队
          action: Multi-year binding offtake contracts with indexed green premium pricing
          touchpoints:
            - 承购条款清单
            - 价格挂钩机制复核
        - label: 投产前环境属性交易
          stage: 投产前环境属性交易
          actor: 科技头部云厂商与数据中心
          action: Book-and-claim Environmental Attribute Certificates (EAC) contracting
          touchpoints:
            - EAC 合同
            - Scope 3 证书平台
        - label: 物流与航运对接整合
          stage: 物流与航运对接整合
          actor: 供应链与物流合作伙伴
          action: Rail and maritime freight agreements for raw material and finished coil transit
          touchpoints:
            - 港口服务协议
            - Green Cargo 铁路货运
        - label: 试点测试与产线资质认证
          stage: 试点测试与产线资质认证
          actor: 冶金技术与质量工程团队
          action: First-year non-prime and prime coil qualification and production test lots
          touchpoints:
            - thyssenkrupp 加工
            - 钢铁技术规格审计
        - label: 全面商业承购放量
          stage: 全面商业承购放量
          actor: 汽车 OEM 与工业制造厂商
          action: Industrial volume manufacturing delivery across cold-rolled and hot-rolled grades
          touchpoints:
            - 汽车冲压试制
            - 年度供货配额审计
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU009
  - id: FR001
    title: Stegra 风险敞口与缓释措施评估矩阵
    type: matrix
    summary: 围绕发生概率、影响严重度、缓释成熟度及残余风险评级四个维度评估核心项目风险的矩阵。
    data:
      columns:
        - 发生概率
        - 影响严重度
        - 缓释成熟度
        - 残余评级
      rows:
