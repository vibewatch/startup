          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中等
              tone: warning
            - label: 高
              tone: negative
        - label: FOAK 氢基直接还原铁系统集成
          values:
            - label: 中
              tone: warning
            - label: 极高
              tone: negative
            - label: 中等
              tone: warning
            - label: 高
