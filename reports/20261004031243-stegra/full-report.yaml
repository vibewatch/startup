    title: Company Milestone Timeline
    type: timeline
    summary: Key corporate, financing, engineering, and customer milestones from founding in 2020 through 2026.
    data:
      items:
        - label: Company Founded
          date: '2020'
          detail: Stegra founded as H2 Green Steel by Vargas Holding and Altor to decarbonize steel production.
          tone: neutral
        - label: Boden Site Construction Started
          date: '2022'
          detail: Broke ground on Europe's first greenfield steel plant in 50 years in Boden, northern Sweden.
          tone: positive
        - label: Initial €6.5B Financing Package
          date: 2024-01
          detail: Secured €3.5B senior debt, €600M junior debt, and equity to finance Boden greenfield construction.
          tone: positive
        - label: Rebrand from H2 Green Steel to Stegra
          date: 2024-09
          detail: Rebranded corporate identity to Stegra reflecting wider industrial decarbonization scope.
          tone: neutral
        - label: Executive CFO Transition
