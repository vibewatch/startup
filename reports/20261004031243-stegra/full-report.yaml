companyProfile:
  summary: >-
    Stegra is a late-stage private industrial climate company building Europe's first large-scale green-hydrogen-based
    DRI and EAF steel plant in Boden, Sweden. Founded in 2020 as H2 Green Steel, it operates from Stockholm and Boden,
    has a leadership team anchored by Henrik Henriksson and Harald Mix, and has amassed about €7.9 billion of disclosed
    financing commitments including a €1.4 billion round closed in June 2026. The company is still pre-revenue, with
    commercial production pushed into 2027, so the current diligence picture is defined more by project execution and
    financing support than by reported operating economics.
