chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Industrial Mission
        blocks:
          - type: paragraph
            body: >-
              Stegra was established in 2020 under its original legal name H2 Green Steel, headquartered jointly in
              Stockholm and Boden, Sweden. The venture was conceived to address carbon abatement across heavy commodity
              manufacturing by substituting fossil coal with electrolytic green hydrogen in iron reduction. In September
              2024, the enterprise executed a corporate rebrand to Stegra, articulating an expanded industrial purpose
              across green hydrogen, direct reduced iron, and near-zero emission metallurgy. The company's initial
              commercial flagship under development is sited in Boden, Norrbotten, designed to integrate an on-site
              giga-scale electrolyzer with high-temperature direct reduction shafts and modern electric arc furnaces.
            claimRefs:
