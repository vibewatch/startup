              - CE006
              - CE008
              - CE010
              - CE011
      - number: '5.2'
        title: Integrated Process Architecture and Scale
        blocks:
          - type: paragraph
            body: >-
              The process chain begins with renewable electricity and water electrolysis, followed by hydrogen-based
              direct reduction of iron ore, electric-arc-furnace melting, continuous casting, and rolling. CINEA says
              integration avoids cooling, transport, and reheating between ironmaking and finishing, while Global Energy
              Monitor independently classifies the project as a construction-stage DRI and EAF plant. The exact
              electrolyser nameplate is not reconciled across public materials: CINEA states 690 MW, Global Energy
              Monitor displays both 700 MW and 800 MW in different project fields, and a KTH thesis describes 740 MW.
              Those values should be treated as a disclosure gap, not averaged into a synthetic capacity. Stegra's own
              timeline reports the final electrolyser module installed in April 2026 and the DRI tower reaching 145
              meters in July 2026. These are installation milestones, not evidence of stable hydrogen output, steel
              quality, yield, or commercial availability.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE008
              - CE015
      - number: '5.3'
        title: Maturity, Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Independent reporting in January 2026 said construction was 60% complete as of late October 2025 and then
              expected operations in 2027; the same report cited higher project costs, delays, and a search for more
              than $1 billion of additional financing. That evidence makes schedule, integrated commissioning, and
              startup yield the central product risks. Stegra says its EAC system uses a certified book-and-claim chain
              of custody with independent external auditors, and its timeline records a full environmental permit in
              June 2023. The assigned evidence does not identify the EAC auditor, publish an audit opinion, document
              automotive qualification, disclose plant uptime, or provide incident and cyber-control records. A KTH
              thesis offers a useful practitioner proxy for future hydrogen technology choices, but its SOEC model
              concerns a planned Portugal project, not measured Boden performance. It finds SOEC attractive only with
              high uptime and thermal integration, while AWE is more robust under low utilization or uncertain capital
              cost.
            claimRefs:
              - CE007
              - CE009
              - CE012
              - CE013
              - CE014
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Installation milestones are not operating proof
            body: >-
              Module installation and tower completion reduce construction uncertainty, but the retained sources provide
              no commissioned throughput, availability, steel-yield, product-qualification, or audited
              lifecycle-emissions dataset for Boden.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Industrial Purchasing Channels
        blocks:
          - type: paragraph
            body: >-
              Stegra's commercial strategy targets four distinct customer categories facing decarbonization mandates
              across the European industrial landscape: premium passenger automotive manufacturers, commercial heavy
              transport fleets, industrial materials processing and distribution networks, and digital technology
              hyperscalers [CU001, CU014]. Automotive manufacturers and industrial equipment producers require near-zero
              emission flat steel to satisfy Scope 3 supply chain reduction requirements established by European
              sustainability regulations [CU004]. Commercial procurement models differ substantially by segment:
              automotive original equipment manufacturers (OEMs) structure direct multi-year offtake allocations for
              hot-rolled and cold-rolled coils, whereas materials service centers manage secondary distribution quotas
              and processing [CU001, CU003]. Stegra employs between 501 and 1000 personnel across Stockholm and Boden to
              manage commercial contracting and technical customer engineering workflows [CU013].
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Commercial Commitments, Plant Milestones, and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of Stegra's green steel output is tightly linked to the construction and commissioning
              schedule of its flagship manufacturing complex in Boden, Sweden [CU001, CU007]. Stegra has established
              bilateral supply and certificate agreements with global enterprise customers, but the venture remains
              pre-revenue as giga-scale electrolyzer modules and direct reduction towers undergo structural installation
              [CU002, CU005, CU007]. The operational timeline has shifted from initial late-2026 targets toward
              commissioning in 2027, making customer delivery schedules dependent on successful equipment qualification
              and electrical integration [CU007, CU010]. To support outbound shipping logistics once steel production
              commences, Stegra has contracted rail traffic with Green Cargo and maritime transport partnerships with
              regional Baltic shipping carriers, establishing physical transit corridors connecting northern Sweden to
              central European industrial buyers [CU009].
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU009
      - number: '6.3'
        title: Named Customer Proof, Partner Relationships, and EAC Instruments
        blocks:
          - type: paragraph
            body: >-
              Stegra has validated customer demand through high-profile bilateral agreements across both physical steel
              offtake and book-and-claim environmental certificate structures [CU002, CU003, CU005]. In September 2026,
              Google announced a landmark agreement to procure environmental attribute certificates (EACs) tied to up to
              91,000 metric tons of steel output produced in Stegra's inaugural production year [CU002]. This
              book-and-claim mechanism enables technology companies to mitigate data center embodied carbon emissions by
              up to 40% without taking physical custody of heavy steel coils, establishing an innovative commercial
              revenue stream during facility ramp-up [CU002, CU006]. Complementing certificate sales, Stegra signed an
              agreement with thyssenkrupp Materials Services to process and distribute non-prime steel output, securing
              downstream channel placement for early production runs alongside partnerships with major automaker
              accounts [CU003, CU005].
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU008
      - number: '6.4'
        title: Customer Retention, Anchor Concentration, and Financing Contingencies
        blocks:
          - type: paragraph
            body: >-
              While announced customer relationships demonstrate strong market pull for near-zero emissions steel,
              Stegra confronts substantial customer concentration and project execution risks [CU010, CU011]. Commercial
              agreements are concentrated among a small cadre of early corporate champions such as Google, Microsoft,
              and leading European automotive groups [CU002, CU005, CU011]. Stegra's public disclosures omit specific
              multi-year volume pricing formulas, take-or-pay penalty clauses, and contract renewal mechanisms, leaving
              revenue durability unverified by independent auditors [CU012]. Furthermore, execution delays directly
              interact with capital availability: the Swedish Energy Agency conditioned its $41 million funding award on
              Stegra demonstrating by spring 2026 that it has secured all remaining capital needed to complete the
              project, illustrating how customer commercial timelines depend on project solvency and timely delivery
              execution [CU008, CU010].
            claimRefs:
              - CU002
              - CU005
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Offtake Execution and Pre-Revenue First-of-a-Kind Plant Risk
            body: >-
              While Stegra has announced bilateral agreements with prominent multinational customers such as Google and
              thyssenkrupp Materials Services, the project remains pre-revenue and under construction in Boden. Delays
              in completing electrolyzer or direct reduction infrastructure directly expose customer delivery
              commitments to operational and financing execution risk.
            calloutType: risk
            claimRefs:
              - CU002
              - CU007
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Summary and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Industrial decarbonization megaprojects face compound execution risks where first-of-a-kind (FOAK)
              technology integration intersects with multi-billion euro capital intensity [CR001, CR005]. Stegra's
              flagship facility in Boden, northern Sweden, integrates giga-scale water electrolysis powered by renewable
              electricity with direct reduced iron (DRI) and electric arc furnace (EAF) steelmaking to cut emissions by
              up to 95% compared to blast furnace routes [CR001, CR003, CR011]. However, the scale and complexity of
              this first-of-a-kind deployment have generated schedule friction and capital pressure, leading the company
              to review its delivery milestones during construction ramp-up [CR002, CR005]. Headcount scaling across
              Stockholm and Boden to over 500-800 personnel reflects accelerating organizational commitments amid tough
              industrial operating environments [CR007, CR008, CR010]. The principal risks facing Stegra fall across
              operational delivery, supply chain and counterparty compliance, technological integration, and capital
              structure leverage [CR002, CR004, CR006, CR012]. The June 2026 closing of a €1.4 billion financing package
              provides a vital liquidity bridge, yet execution milestones remain under rigorous review by industrial
              sponsors and lenders [CR002, CR005, CR009].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Regulatory, Environmental, and Supply Chain Governance
        blocks:
          - type: paragraph
            body: >-
              Operating at the nexus of European energy transition and heavy industry exposes Stegra to stringent
              regulatory frameworks, environmental monitoring mandates, and trade compliance controls [CR003, CR004]. To
              maintain compliance across complex cross-border procurement networks, Stegra enforces a comprehensive
              Supplier Code of Conduct approved by its Board of Directors in May 2026 [CR004]. The framework mandates
              strict adherence to international labor standards, environmental management systems certified to ISO 14001
              or EMAS, and comprehensive Scope 1, 2, and upstream Scope 3 greenhouse gas reporting [CR004]. Furthermore,
              Stegra prohibits conflict minerals from conflict-affected and high-risk areas (CAHRAs) under EU Regulation
              2017/821, restricts sub-contracting to a maximum of two tiers, enforces zero tolerance for sanctions
              circumvention, and subjects suppliers to unannounced on-site compliance audits [CR004]. Breaches of these
              provisions are classified as material contractual defaults, mitigating regulatory and reputational
              liabilities while imposing operational overhead on supplier onboarding [CR004].
            claimRefs:
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
      - number: '7.3'
        title: Operational Logistics, Counterparty Dependencies, and Financial Exposure
        blocks:
          - type: paragraph
            body: >-
              Stegra's integrated manufacturing flows depend upon tightly synchronized logistics corridors, utility
              contracts, and long-term customer partnerships [CR001, CR003, CR007]. Inbound raw materials and outbound
              finished steel rely on dedicated maritime shipping partnerships with ESL Shipping, Royal Wagenborg,
              Pangaea Logistics Solutions, and Clarksons, as well as rail freight agreements with Green Cargo and port
              logistics through Skellefteå and Umeå [CR001, CR007]. On the customer side, commercial offtake commitments
              from industrial buyers such as Thyssenkrupp Materials Services, Scania, and Schaeffler, alongside
              innovative environmental attribute certificate (EAC) contracts with Google covering up to 91,000 metric
              tons, underwrite revenue bankability [CR001, CR002, CR003]. Nevertheless, rising CapEx requirements and
              scope adjustments previously required securing €1.4 billion in additional equity to cover remaining
              construction outlays, establish buffers against cost volatility, and insulate €3.5 billion in senior debt
              commitments [CR005, CR006, CR009]. Monitoring indicators and kill criteria remain anchored to
              commissioning timetable adherence, electrolyzer performance verification, and debt-service coverage
              [CR002, CR005, CR009].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Timeline Review and First-of-a-Kind Execution Exposure
            body: >-
              Although the successful closing of the €1.4 billion financing package relieves immediate cash flow
              pressure, Stegra's confirmation that its Boden project timeline remains under review underscores
              continuing delivery challenges [CR002, CR005]. Completing complex hydrogen direct reduction facilities
              requires synchronizing giga-scale electrolyzer commissioning with high-temperature ironmaking, where
              unforeseen commissioning bottlenecks could defer first commercial revenues and heighten carrying costs
              [CR001, CR002].
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >
              The appropriate public-evidence recommendation is track and research more, not buy. Stegra has cleared an
              important financing hurdle: Reuters reporting and Stegra's own timeline indicate that the €1.4 billion
              round closed on June 24, 2026. That event improves near-term completion funding, but it does not establish
              the value of the equity offered to a new investor. The assigned materials disclose neither a current
              post-money valuation nor a fully diluted capitalization, preference waterfall, or audited project
              cash-flow model. Confidence is therefore medium on the financing event and operating-risk direction, but
              low on price. Risk remains high because the plant is still tracked as under construction and the timeline
              was under review after slower activity. Entry discipline should be based on private-document verification,
              not a funding-total proxy.
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV015
      - number: '8.2'
        title: Financing Context, Commercial Proof, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The April financing announcement said the new capital would complete construction, absorb selected
              infrastructure insourcing and increased project costs, and provide a buffer. Independent coverage also
              reported that construction had slowed while financing was pending. Those facts make the round both a
              de-risking event and evidence that capital needs had risen. Commercial signals are real but not equivalent
              to revenue: Google agreed to receive environmental attribute certificates tied to up to 91,000 metric tons
              of first-year steel, while Stegra's timeline says more than 1.5 million tonnes had been pre-sold by May
              2022. Neither source discloses realized pricing, cash collection, margin, or take-or-pay protection. The
              thesis is credible demand for lower-emissions steel; the anti-thesis is a capital-intensive commissioning
              path whose economics remain private.
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Bull, Base, and Bear Underwriting Framework
        blocks:
          - type: paragraph
            body: >
              Scenario analysis should remain conditional because the assigned evidence cannot support numeric
              probabilities, target returns, or valuation ranges. In the bull case, the financing converts into
              uninterrupted construction, the tracked 2027 start is achieved, and customer signals translate into
              contracted cash flow. In the base case, completion proceeds but timing and ramp economics remain
              uncertain, requiring additional disclosure before a price can be underwritten. In the bear case, further
              cost escalation, hydrogen scale-up difficulty, or schedule slippage causes another capital raise,
              dilution, or lender-led restructuring. The clearest thesis-break signals are a renewed construction
              slowdown, a start-date reset beyond the currently tracked year, loss or weakening of customer commitments,
              and new financing that fails to disclose its seniority or dilution. These are observable signals, not
              assigned probabilities.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.4'
        title: Ownership, Exit Readiness, and Final Diligence
        blocks:
          - type: paragraph
            body: >
              The April terms contemplated a Wallenberg-led consortium taking a leading ownership position and new board
              nominations, which can strengthen industrial oversight but may also reshape minority-investor rights.
              Public funding totals cannot resolve the cap table: Indexed.vc reports $4.6 billion across seven rounds,
              whereas Stegra's own timeline reports close to €6.5 billion secured in January 2024 and a separate €1.4
              billion round closing in June 2026. The currencies, dates, and financing definitions differ, so these
              figures should not be summed or treated as cash available. Exit readiness is not established by the
              assigned sources; no IPO timetable, comparable transaction set, or audited steady-state earnings base is
              disclosed. Final diligence should obtain the current capitalization, financing waterfall, remaining
              cost-to-complete, commissioning schedule, customer contract economics, and lender covenants before setting
              a valuation range or return target.
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing Is Not Valuation
            body: >
              Treat the completed €1.4 billion round as evidence of financing support, not as evidence that a new equity
              entry price is attractive. A valuation judgment requires the fully diluted cap table, security rights,
              remaining cost-to-complete, and a cash-flow bridge from commissioning to steady-state production.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV015
