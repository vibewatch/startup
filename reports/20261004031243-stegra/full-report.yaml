        - Google agreed to EACs tied to up to 91,000 metric tons of first-year steel
        - EAC volume is not disclosed revenue, steel price, margin, or cash collection
        - Binding price, volume, duration, and take-or-pay terms
      - - Broader commercialization
        - Stegra says more than 1.5 million tonnes had been pre-sold by May 2022
        - Contract mix, current enforceability, delivery schedule, and realized pricing are not public here
        - Current contract schedule reconciled to commissioned output
      - - Project execution
        - Independent tracking lists the plant under construction with a 2027 start date
        - Construction slowed during financing and the timeline was under review
        - Independent confirmation of commissioning milestones and stable budget
    notes: >-
      Customer and company statements are demand signals only; the table does not treat EACs, pre-sales, or financing as
      revenue, ARR, cash available, or independently verified margin.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Construction remains funded; the tracked 2027 start holds; customer signals convert to contracted cash flow
        - Range withheld until audited ramp volume, price, margin, capex, debt, and dilution inputs are available
        - Positive signals are milestone delivery and binding sales economics; no numeric probability is supportable
      - - Base
        - Construction continues, but schedule and production ramp remain uncertain
        - Price ceiling must be solved from the fully diluted cap table and a verified commissioning-to-cash-flow model
        - Continued timeline review or incomplete contract disclosure keeps the recommendation at track
      - - Bear
        - Further cost escalation, hydrogen scale-up difficulty, or schedule slippage requires new capital
        - Downside range is not quantifiable without lender priority, liquidation preferences, and recovery values
        - A renewed slowdown, start-date reset, covenant stress, or dilutive rescue raise is a thesis-break signal
    notes: >-
      Scenarios are conditional operating paths, not forecasts; assigned evidence does not support numeric
      probabilities, valuation ranges, target returns, or recovery values.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV012
