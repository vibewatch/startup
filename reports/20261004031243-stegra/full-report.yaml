      - number: '1.2'
        title: Executive Leadership and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Stegra's operational strategy and industrial execution are led by Chief Executive Officer Henrik
              Henriksson, formerly President and CEO of commercial vehicle manufacturer Scania Group, alongside
              co-founder and Board Chairman Harald Mix, founder of industrial private equity firm Altor and venture
              platform Vargas Holding. The leadership team reflects deep institutional alignment between Swedish
              industrial syndicates and clean-technology venture development. In February 2026, the company announced
              the appointment of Markus Holm as Chief Financial Officer starting March 1, 2026, succeeding founding CFO
              Otto Gernandt who transitioned to a senior advisory role dedicated to capital-raising initiatives.
              Corporate governance is further expanding through the planned nomination of former Volvo Group CEO and
              Ericsson Chairman Leif Johansson as independent Board Chair following the 2026 equity consortium round.
            claimRefs:
