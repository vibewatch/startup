      - number: '1.3'
        title: Capitalization Structure and Stakeholder Syndicate
        blocks:
          - type: paragraph
            body: >-
              Stegra represents one of the most heavily financed private industrial climate technology ventures
              globally, having secured approximately €7.9 billion in cumulative financing commitments across equity,
              project debt, and sovereign subsidies. In January 2024, the company established an initial €6.5 billion
              project financing package comprising €3.5 billion in senior debt from major European commercial banks,
              €600 million in junior mezzanine facilities, direct equity, and a €265 million grant from the European
              Commission Recovery and Resilience Facility via the EU Innovation Fund. In June 2026, Stegra announced the
              formal closing of an additional €1.4 billion ($1.7 billion) growth financing round led by a Wallenberg
              Investments-led consortium. Wallenberg Investments committed €250 million in direct equity alongside
              consortium partners Temasek, IMAS Foundation, Bolero, and SEB-Stiftelsen, with continuing equity support
              from Altor, Hy24, and Just Climate. The comprehensive lender group reaffirmed total backing, preserving
              access to previously negotiated credit facilities.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
