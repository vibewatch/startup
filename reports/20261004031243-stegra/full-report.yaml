            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Operational Scale, Offtake Agreements, and Execution Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite substantial capitalization, Stegra faces material delivery and market execution challenges
              characteristic of first-of-a-kind heavy manufacturing projects. In early 2026, corporate management placed
              the commercial commissioning timeline under review, acknowledging that commercial steel production has
              shifted from late 2026 into 2027 to accommodate extensive equipment installations and electrical
              infrastructure ramp-up. On the commercial offtake front, Stegra has secured customer agreements with
              industrial buyers and entered into an agreement with Google for environmental attribute certificates
              covering up to 91,000 metric tons of steel output in its first operating year. However, detailed
              contractual pricing mechanisms, take-or-pay structures, and unit-level hydrogen production economics
              remain undisclosed, representing critical diligence gaps for underwriters tracking commercial break-even.
            claimRefs:
              - CO003
              - CO004
              - CO008
              - CO013
              - CO014
