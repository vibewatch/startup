  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              The global steel sector accounts for roughly 8% of global carbon dioxide emissions and manufactures nearly
              2 billion metric tons of steel annually [CM003]. In Europe, total annual steel production stands at
              approximately 150 million tonnes, with flat steel representing the single largest product category
              [CM004]. Stegra explicitly focuses on primary flat steel delivered in cold-rolled and hot-rolled coils,
              targeting high-specification manufacturing sectors such as automotive, appliances, building products,
              energy systems, and heavy transportation rather than commodity long construction rebar [CM004, CM008].
              Conventional blast furnace manufacturing emits approximately two tonnes of carbon dioxide per tonne of
              steel produced [CM003]. Stegra replaces carbon-intensive metallurgical coal in the reduction phase with
              green hydrogen produced via a 700-megawatt water electrolysis facility located in Boden, Sweden, yielding
              direct reduced iron (DRI) melted in electric arc furnaces (EAF) to eliminate up to 95% of operational
              emissions [CM003, CM005, CM007]. Traditional direct reduction utilizing natural gas reduces emissions by
              only 40%, generating over one tonne of carbon dioxide per tonne of output and leaving substantial
              compliance exposure under accelerating carbon pricing [CM003].
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
      - number: '2.2'
        title: Market Sizing Lenses and Constrained Capacity Realization
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for near-zero emissions steel requires separating macro industrial
              demand from near-term commercially addressable and serviceable capacity layers [CM003, CM004, CM006].
              While global crude steel consumption exceeds 1,800 million tonnes per annum and European steel demand
              totals approximately 150 million tonnes annually, Stegra's immediate addressable universe is dictated by
              European flat steel consumption and the subset of industrial buyers willing to absorb a 20% to 30% green
              premium [CM001, CM003, CM004]. Stegra's initial phase in Boden provides a planned nameplate capacity of
              2.5 million metric tons per annum, with long-term expansion targeting 4.5 million metric tons [CM003,
              CM006]. The company has contractually secured offtake agreements covering over 1.5 million tonnes per
              annum of this initial output, including multi-year commitments with premium automakers such as
              Mercedes-Benz, BMW, Porsche, Volvo Group, and Scania [CM001, CM003]. Sizing is strictly
              capacity-constrained in the initial 2026–2028 operating window, as European green steel demand
              significantly outpaces certified supply [CM004].
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Contracting Mechanisms
        blocks:
          - type: paragraph
            body: >-
              The primary demand driver for near-zero emission flat steel is the European automotive sector, which
              consumes roughly 15 million tonnes of high-specification steel annually [CM001]. Automakers face
              aggressive OEM Scope 3 decarbonization targets, yet steel procurement represents a modest share of the
              final vehicle bill-of-materials; paying a 20% to 30% green premium equates to an estimated incremental
              cost of several hundred dollars or less per passenger vehicle [CM003]. Alongside automotive procurement
              heads, appliance and commercial building fabricators such as Ikea, Bilstein Group, and Kingspan have
              entered commercial arrangements [CM003, CM007]. Beyond direct physical offtake, Stegra has pioneered
              book-and-claim environmental attribute certificates (EACs), signing an agreement with Google covering up
              to 91,000 tonnes of steel in year one to mitigate data center embodied carbon emissions without requiring
              direct physical delivery [CM002, CM006]. This certificate model generates supplemental early-stage cash
              flow by monetizing non-prime ramp-up production [CM002].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
      - number: '2.4'
        title: Regulatory Tailwinds, Energy Economics, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The fundamental economic driver supporting green steel pricing is the European Union Carbon Border
              Adjustment Mechanism (CBAM), which entered its reporting transitional phase in 2026 and establishes import
              carbon levies to prevent high-carbon foreign producers from undercutting European manufacturers [CM001,
              CM003]. In northern Sweden, Stegra leverages abundant baseload hydropower and wind resources to run its
              700 MW electrolyzer and 10 TWh annual electricity requirements, contracting long-term power with utilities
              such as Uniper and Axpo [CM003, CM005, CM007]. However, severe market constraints persist: first-of-a-kind
              (FOAK) engineering integration across giga-scale electrolysis, high-temperature hydrogen shaft reduction,
              and electric melting introduces execution risk, while initial plant construction has experienced timetable
              revisions shifting steel production ramp-up to the turn of year 2026/2027 [CM001, CM004]. Furthermore,
              long-term trade dynamics present competitive risks, as renewable-rich regions such as the Middle East and
              North Africa (MENA) are projected to achieve green steel production costs up to 17% below European levels
              by 2030 [CM001, CM004].
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Offtake Contracts as Financing Collateral
            body: >-
              Stegra transformed technology and price risk into bankable corporate counterparty exposure by pre-selling
              over 1.5 Mtpa of its initial 2.5 Mtpa Boden capacity under multi-year agreements with premium buyers such
              as Mercedes-Benz [CM001]. This contractually secured demand served as essential underwriting collateral
              for securing over €4.2 billion in senior project debt and €1.4 billion in equity financing [CM001].
            calloutType: insight
            claimRefs:
              - CM001
          - type: callout
            title: Geographic Energy Cost Disparities and CBAM Dependency
            body: >-
              Although northern Sweden provides low-cost Nordic renewable power and EU CBAM tariffs shield the market
              from unpriced fossil-fuel steel imports, projections indicate that Middle East and North Africa (MENA)
              producers could achieve green steel production costs 17% lower than European facilities by 2030 [CM001].
              Long-term European competitiveness relies strictly on tariff durability and sustained local renewable
              premiums [CM001].
            calloutType: risk
            claimRefs:
              - CM001
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Primary Decarbonized Steel Landscape and Competitor Segmentation
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for low-carbon and green primary steel in Europe divides across three distinct
              categories: first-of-a-kind greenfield hydrogen-DRI operators, legacy blast-furnace incumbents executing
              phased DRI transitions, and alternative decarbonization or off-gas scrap recycling providers. Stegra
              occupies the greenfield hydrogen-integrated position, constructing Europe's first new integrated steel
              mill in 50 years with an on-site 700 MW electrolyzer and direct reduced iron shaft furnace. Unlike
              incumbent producers such as SSAB (advancing the HYBRIT fossil-free initiative), ArcelorMittal, Salzgitter,
              and Thyssenkrupp, Stegra avoids stranded blast-furnace capital assets and brownfield operational
              disruptions. However, incumbent steelmakers possess established customer distribution networks, mature
              port and rail infrastructure, and multi-billion-euro industrial balance sheets. Industry observers
              frequently contrast Stegra's standalone mega-project execution risk and capital intensity with incumbent
              operators like SSAB, whose staged conversion strategy limits upfront construction exposure while capturing
              automotive procurement demand.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP012
      - number: '3.2'
        title: Technological Capabilities, Sourcing, and Cost Differentiation
        blocks:
          - type: paragraph
            body: >-
              Stegra's core competitive differentiation rests on full operational integration spanning dedicated
              renewable-powered hydrogen electrolysis, Paul Wurth/Midrex H2 shaft reduction, and SMS EDGE electric arc
              furnaces. By replacing coal reductants with electrolytic hydrogen produced on-site, the Boden plant is
              designed to reduce steel production carbon dioxide emissions by up to 95 percent compared to conventional
              blast furnace-basic oxygen furnace routes. To safeguard production continuity, Stegra insourced critical
              logistics infrastructure, including railway networks and port facilities in Lulea, Skelleftea, and Umea.
              While this vertical integration insulates operations from third-party logistics bottlenecks, it expanded
              total capital requirements by over 1 billion euros and pushed commissioning timelines back. Meanwhile,
              incumbent competitors leverage traditional supply agreements and gradual fossil gas-to-hydrogen transition
              steps, trading emission reduction depth for lower initial capital intensity and lower technology risk.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Offtake Lock-In, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Durability of Stegra's commercial moat relies heavily on long-term supply agreements and book-and-claim
              environmental attribute systems with corporate buyers. Offtake commitments and partnership agreements with
              high-profile commercial end-users including Microsoft, Google, and Thyssenkrupp Materials Services
              establish initial volume demand for early production years. Google's agreement for environmental attribute
              certificates covering up to 91,000 metric tons validates demand for certified near-zero emissions
              attributes from premium data center infrastructure builders. Nevertheless, switching costs in commercial
              flat steel remain constrained by commodity grade standardization, and European automakers and industrials
              maintain multi-sourcing strategies across both Stegra and established European mills. Capital
              restructuring events, executive leadership transitions including the appointment of Hakan Buskhe as CEO
              following a 100-day review, and project cost escalations past 7 billion euros highlight ongoing financial
              and execution pressures that could impair commercial delivery timelines.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Execution Sensitivity vs Incumbent Fleets
            body: >-
              Stegra's decision to insource port and railway infrastructure, coupled with cumulative project financing
              exceeding 7 billion euros, introduces acute sensitivity to construction delays and capital market
              conditions, contrasting with incumbent players who can flex existing blast-furnace operations during
              market softness.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Model, Offtake Structure, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >
              Stegra operates as a primary industrial metal manufacturer aiming to decarbonize hard-to-abate steelmaking
              by replacing metallurgical coking coal with captive green hydrogen produced from renewable electricity.
              Because the company is constructing a greenfield plant in Boden with first production targeted for 2026,
              it currently generates no commercial steel sales revenue. Instead, its forward commercial foundation
              relies on long-term, binding offtake agreements of up to seven years that mirror Power Purchase Agreements
              (PPAs) in renewable energy project finance. As of late 2024, Stegra had locked in binding offtake
              commitments for approximately 1.5 million tonnes per annum (Mtpa) of near-zero-emission steel,
              representing around 60% of its initial 2.5 Mtpa nominal crude steel production capacity. Its customer
              roster includes premium automotive and consumer durable manufacturers such as Mercedes-Benz, Porsche,
              Volvo Group, Scania, and IKEA.


              Monetization hinges on securing a structural green premium over conventional fossil-based steel
              benchmarks. Offtakers in premium automotive segments accept green premiums in the range of 25%, calculated
              as an incremental component cost of approximately €500 per luxury vehicle—a surcharge readily absorbed on
              vehicles retailing between €100,000 and €250,000. Furthermore, Stegra has augmented its direct physical
              steel supply contracts with innovative environmental attribute certificates (EACs) and book-and-claim
              mechanisms. In September 2026, Google entered into an EAC agreement to purchase the decarbonization
              attributes of up to 91,000 metric tons of Stegra's first-year steel production, providing a secondary
              revenue mechanism to monetize emissions-abatement value for buyers facing Scope 3 emissions constraints.
              However, realized volume delivery and pricing enforcement remain dependent on plant commissioning and
              operational ramp-up.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
