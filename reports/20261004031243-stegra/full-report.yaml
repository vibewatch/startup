  - id: FE001
    title: Boden Product and Process Stack
    type: stack
    summary: >-
      Six linked layers show the intended path from renewable inputs to physical steel and separately transferable
      environmental attributes.
    data:
      layers:
        - label: Renewable electricity and water
          detail: Inputs to on-site hydrogen production and electric steelmaking; no retained operating profile is available.
        - label: Water electrolysis
          detail: Produces green hydrogen; public descriptions of nameplate capacity range from 690 MW to 800 MW.
        - label: Hydrogen direct reduction
          detail: Replaces coal as the intended reducing agent and produces sponge iron.
        - label: Electric arc furnace
          detail: Melts the sponge iron using renewable electricity.
        - label: Continuous casting and rolling
          detail: Converts crude steel into finished material without inter-site cooling and reheating.
        - label: Physical steel and EAC commercialization
          detail: >-
