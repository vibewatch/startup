      - number: '4.2'
        title: Capital Structure, Financing Dependency, and Capex Execution
        blocks:
          - type: paragraph
            body: >
              Developing Europe's first large-scale greenfield steel mill in 50 years requires massive, front-loaded
              capital investments that make Stegra heavily dependent on syndicated project finance and sovereign
              support. Phase 1 of the Boden facility represents a total project investment estimated at €6.5 billion
              (approximately $7.08 billion), encompassing a 700 MW on-site green hydrogen electrolyzer, a 2.1 Mtpa
              direct reduced iron (DRI) shaft furnace, and a 2.5 Mtpa electric arc furnace (EAF) melt shop. As of
              January 2024, the initial €6.5 billion financing package comprised €3.5 billion in senior debt, up to €600
              million in junior mezzanine debt, approximately €300 million in initial equity, and a €265 million direct
              grant approved by the European Commission under the Recovery and Resilience Facility, with debt facilities
              backstopped by commercial bank consortia and the Swedish National Debt Office.


              Despite this monumental initial package, extreme capital intensity, scope expansions, and insourcing of
              key infrastructure necessitated substantial add-on funding before initial commissioning. In April 2026,
              Stegra agreed in principle on an additional €1.4 billion ($1.65 billion) financing round led by a
              Wallenberg Investments-led consortium including Temasek, IMAS Foundation, Bolero, and SEB-Stiftelsen, with
              continuation support from existing lead sponsor Altor, Hy24, and Just Climate. Formally completed in June
              2026, the €1.4 billion round increased project equity, but management acknowledged that construction had
              experienced several slower months during fundraising and placed the project timeline under review. By
              September 2026, independent reporting and company announcements highlighted that new owners implemented a
              100-day review appointing Håkan Buskhe as CEO to manage continued capital requirements, underscoring
              ongoing financing exposure and execution overhang.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Cost Structure, Unit Economics, and Underwriting Dilemmas
        blocks:
          - type: paragraph
            body: >
              From an investment diligence and underwriting perspective, Stegra represents a first-of-a-kind (FOAK)
              industrial megaproject whose long-term financial viability depends on unit-cost parity against both
              incumbent blast furnace-basic oxygen furnace (BF-BOF) steelmakers and natural gas-based DRI producers. The
              plant's operational cost structure is dominated by electricity input costs for the 700 MW water
              electrolysis system, feedstock costs for imported direct-reduction grade iron ore pellets, capital
              depreciation on the €7.9 billion asset base, and transport logistics across Baltic maritime and rail
              corridors. While Stegra derisked power supply through long-term agreements for 8 TWh of renewable power
              with Uniper and Axpo alongside partnerships with Fortum, the delivered levelized cost of green hydrogen
              ($/kg H2) and total conversion cost per tonne of hot rolled coil (HRC) remain completely undisclosed
              private metrics.


              The financial verdict for institutional investors is that Stegra possesses extraordinary commercial
              backing through guaranteed multi-year volume offtake and sovereign derisking, but its near-term
              risk-return profile is constrained by FOAK execution vulnerabilities. Pre-revenue operating losses, capex
              inflation leading to mid-construction add-on financing rounds, insourcing of logistical infrastructure,
              and leadership turnover following the 100-day review mean financial models cannot yet verify steady-state
              gross margins. Without audited financial statements, unit conversion metrics, and confirmed
              hot-commissioning dates, Stegra remains unbankable under standard growth equity covenants and must be
              underwritten strictly as a high-capex infrastructure project exposed to commissioning slippage and macro
              steel price fluctuations.
            claimRefs:
              - CI001
              - CI004
              - CI009
              - CI010
              - CI014
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution and Capex Inflation Risk in First-of-a-Kind Industrial Assets
            body: >
              Stegra's financial plan exhibits classic first-of-a-kind (FOAK) megaproject escalation dynamics. The
              original €6.5 billion financing closed in early 2024 required a subsequent €1.4 billion add-on in 2026 to
              cover infrastructure insourcing, scope changes, and project cost increases. With several months of slowed
              construction, project timelines under review, and management restructured under Wallenberg Investments
              leadership, any further commissioning delay beyond 2026 directly compounds interest charges on €3.5
              billion in senior debt while pushing cash flow generation into 2027.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI014
          - type: callout
            title: Offtake Contracts as Synthetic Project Finance Collateral
            body: >
              By securing 1.5 Mtpa in multi-year offtake agreements with blue-chip OEMs (Mercedes-Benz, Porsche, Volvo
              Group, IKEA) before completing construction, Stegra transformed traditional volatile commodity steel
              exposure into predictable, utility-like forward cash flows. Structuring these contracts with ~25% green
              premiums functioned as essential bankable collateral, enabling a pre-revenue startup to unlock €3.5
              billion in senior commercial bank debt.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Commercial Form
        blocks:
          - type: paragraph
            body: >-
              Stegra's intended deliverable is near-zero-emission steel made at Boden with renewable electricity, green
              hydrogen, and green iron. The company's stated emissions advantage is up to 95% versus conventional
              European steelmaking, but that figure remains a company claim rather than a disclosed operating result
              from a commissioned plant. Public sources describe an initial 2.5 million tonnes per year of steel and a
              later 5 million-tonne ambition. The commercial system also separates environmental value from physical
              metal through environmental attribute certificates (EACs). Stegra says one EAC represents one tonne of
              near-zero steel; Google says its agreement covers certificates associated with up to 91,000 metric tons
              from the first production year. Non-prime steel is a distinct ramp-up output: Thyssenkrupp Materials
              Services agreed to buy tonnage in the high-six-digit range, while the related green attribute can be sold
              separately. This creates a route to monetize startup yield, but neither the certificate price nor realized
              non-prime share is public.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE010
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
