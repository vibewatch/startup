      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              SKIMS maintains a scalable apparel cost structure where variable product costs, international inbound
              freight, and third-party logistics fulfillment are balanced against robust DTC gross margins. Sourcing
              operations have expanded beyond historical single-country dependencies to include established textile
              mills and garment manufacturing partners in Turkey, Europe, and the Americas. Secondary analyst estimates
              suggest gross margins hover around 65 percent, supporting internal management projections of an adjusted
              EBITDA margin above 23 percent on 58 million in 2023 sales. Furthermore, a reported 14 percent customer
              retention rate at 15 months validates strong multi-category basket building. However, rapid store
              buildouts, higher inventory holding costs, and rising retail labor expenses present potential margin
              compression risks that require careful underwriting.
            claimRefs:
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.4'
        title: Capital Adequacy, Cash Runway, and Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              SKIMS maintains substantial capital adequacy following its 25 million Series D financing round in November
              2025 led by Goldman Sachs Alternatives, which pegged the company's post-money valuation at  billion.
              Co-founder Jens Grede has repeatedly stated that SKIMS generates positive operating cash flow, indicating
              that external equity proceeds are earmarked for international flagship expansion and supply chain
              modernization rather than funding operating losses. Projecting net sales to surpass  billion implies a
              forward revenue multiple of roughly 5x, reflecting strong private market valuation support. Nonetheless,
              the complete lack of public audited GAAP financial statements, unknown working capital obligations, and
              intensifying competition from incumbent athletic brands like Lululemon represent critical diligence gaps
              that prevent unhedged institutional underwriting.
            claimRefs:
              - CI003
              - CI009
              - CI010
              - CI013
              - CI014
