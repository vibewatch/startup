chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              SKIMS Body, Inc. is an American direct-to-consumer apparel and lifestyle brand founded in 2019 and
              headquartered at 1601 Vine Street in Hollywood, Los Angeles, California. Originally incorporated in April
              2018, the company established a distinctive market identity by redefining traditional shapewear as modern
              solutionwear engineered around body inclusivity, technical fabric innovation, and an expansive spectrum of
              skin-tone shades spanning sizes XXS through 5X. Rather than positioning its garments as restrictive
              corrective undergarments, SKIMS approached the category as an everyday wardrobe essential, combining
              digital-first scarcity drops with high-visibility cultural storytelling. While the business originated as
              a digital direct-to-consumer e-commerce platform, management has accelerated a transition toward an
              omnichannel model, deploying wholesale partnerships with retailers such as Nordstrom alongside an
              expanding fleet of 18 domestic standalone retail boutiques and international franchise outposts in Mexico.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The governance and operational hierarchy of SKIMS reflects a deliberate partnership between celebrity
              brand equity and seasoned fashion industry operators. Kim Kardashian functions as Co-Founder, Chief Brand
              Officer, and Chief Creative Officer, serving as the aesthetic visionary, product tester, and central
              marketing engine across global media channels. Operational leadership is directed by Co-Founder and Chief
              Executive Officer Jens Grede, who previously built Swedish premium denim label FRAME and brought
              institutional apparel supply chain experience. They are supported by founding partner Emma Grede as Chief
              Product Officer, Chief Operating Officer Mehmet Dokumcu overseeing digital fulfillment infrastructure,
              Chief Financial Officer Andy Muir managing capital planning, and Chief Technology Officer Devin K. Miller
              directing e-commerce architecture. However, this structure entails severe key-person concentration risk:
              brand loyalty and customer acquisition economics remain inextricably linked to Kardashian’s public
              persona, creating organizational vulnerability should consumer sentiment shift or external controversies
              arise.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              SKIMS has executed an aggressive capital-raising strategy, accumulating approximately $952.6 million
              across six primary equity funding rounds between 2019 and late 2025. Following an initial seed financing
              round of approximately $4 million led by Imaginary Ventures at a $16.8 million post-money valuation in
              2019, the company achieved unicorn status in April 2021 when Thrive Capital led a $154 million Series A at
              a $1.6 billion valuation. Subsequent rounds marked dramatic step-ups in private market pricing: a $240
              million Series B led by Lone Pine Capital in January 2022 valued SKIMS at $3.2 billion, followed by a $270
              million Series C led by Wellington Management in July 2023 at $4.0 billion. In November 2025, SKIMS
              completed a $225 million Series D financing led by Goldman Sachs Alternatives with participation from BDT
              & MSD Partners at a $5.0 billion post-money valuation. Despite this top-tier institutional syndicate,
              complete capitalization table details, founder voting control, liquidation preferences, and secondary
              transaction pricing remain closely guarded private information.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Scale Trajectory, Category Expansion, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              The corporate evolution of SKIMS has navigated high-profile brand crises, rapid category diversification,
              and organizational headcount growth. Prior to its commercial launch in September 2019, the brand faced
              severe public backlash over its original trademark name, Kimono, prompting an emergency rebranding to
              SKIMS within months. Since that launch, the company has methodically expanded beyond foundational
              shapewear into loungewear, sleepwear, swimwear, activewear, and a dedicated menswear collection launched
              in late 2023. Strategic cultural authority was reinforced through commercial sports partnerships with the
              NBA, WNBA, USA Basketball, and Team USA Olympic uniforms. In 2024, SKIMS absorbed Coty’s 20% stake in
              beauty label Skkn by Kim, consolidating Kardashian’s cosmetic, skincare, and fragrance assets under
              unified brand management. To support this multi-category retail infrastructure, workforce intelligence
              records show headcount expanding from 159 employees in late 2022 to 1,314 personnel by March 2026 as
              annual net sales approached $1.0 billion.
            claimRefs:
              - CO003
              - CO004
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Founder Concentration and Private Financial Opacity
            body: >-
              While SKIMS has demonstrated exceptional cultural resonance and brand velocity, reaching a $5 billion
              valuation and over $750 million in annual sales, its brand equity remains tightly coupled to Kim
              Kardashian’s personal celebrity persona. Furthermore, absent audited disclosures regarding EBITDA
              profitability, return rates, and true gross margins, private market valuations reflect aggressive top-line
              growth assumptions rather than verified cash flow generation.
            calloutType: risk
            claimRefs:
              - CO006
              - CO008
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Category Expansion
        blocks:
          - type: paragraph
            body: >-
              SKIMS entered the apparel industry in 2019 by redefining shapewear as everyday solutionwear, offering
              engineered fabrics and body-positive silhouettes designed to enhance natural shapes rather than restrict
              them. While foundational shapewear established the brand's identity and pricing power, management quickly
              expanded the assortment into high-frequency replenishment categories. Core everyday intimates, including
              seamless bralettes and microfiber briefs, rapidly surpassed shapewear as the brand's largest revenue
              contributor. Subsequent extensions introduced loungewear, sleepwear, swimwear, and menswear basics,
              alongside co-branded athletic collaborations like NikeSkims. By deliberately excluding orthotics and
              medical compression while capturing mainstream casualwear spend, SKIMS broadened its operational
              boundaries from a specialized undergarment niche into an expansive modern lifestyle apparel platform.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market for SKIMS requires multiple sizing lenses rather than a single
              aggregated metric. The specialized global shapewear market is valued at approximately $4 billion,
              representing a steady but mature category historically dominated by legacy players like Spanx. By
              contrast, the global women's intimates, underwear, and sleepwear sector represents an $85 billion market,
              characterized by higher purchase frequency and substantial replacement demand. Expanding further into
              casual loungewear, athletic apparel, and menswear positions SKIMS within a global casualwear and
              athleisure universe exceeding $350 billion. SKIMS reached $500 million in valuation by Series A and closed
              late 2025 at a $5 billion valuation with net sales projected to surpass $1 billion, capturing meaningful
              share in its target serviceable market of premium accessible essentials.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
