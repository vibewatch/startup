      - number: '4.2'
        title: Go-to-Market Channels, Sales Efficiency, and Marketing Economics
        blocks:
          - type: paragraph
            body: >-
              The company's go-to-market engine relies on an asymmetric marketing model where founder visibility and
              culturally resonant brand campaigns substitute for heavy performance advertising. Management allocates
              over half of its marketing budget to high-impact brand creative, marquee billboards, and organic
              influencer seeding rather than transactional search ads, generating massive top-of-funnel reach at
              relatively low paid media costs. Retail tracking data indicates SKIMS achieves a remarkable 32 percent
              sell-out rate and a 68 percent replenishment rate, dramatically outperforming competitors in the lingerie
              and shapewear categories. In 2024, the digital platform skims.com alone generated approximately 27 million
              in gross merchandise volume, proving that brand-first customer acquisition drives exceptional organic
              conversion and repeat purchasing velocity.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
          - type: figure
