  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio Definition and Category Expansion
        blocks:
          - type: paragraph
            body: >-
              SKIMS defines its core product value proposition through the lens of solutionwear—engineered underwear,
              shapewear, and foundational garments designed to eliminate physical discomfort and provide contouring
              without the rigid hardware of legacy compression apparel. Founded on a philosophy of radical inclusivity,
              the brand launched with an extensive sizing scale spanning XXS through 5X and nine skin-tone shades
              designed to disappear beneath outer garments. Over its operating history, SKIMS has leveraged this
              foundational brand trust to expand aggressively beyond women's shapewear into high-velocity consumer
              categories, including loungewear, sleepwear, swimwear, men's basics, and athleisure collaborations. This
              multi-category diversification transforms what began as a niche direct-to-consumer shapewear business into
              a comprehensive apparel enterprise that positions its product modules across daily consumer wear
              occasions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Customer Workflows, Sizing Architecture, and Fabric Engineering
        blocks:
          - type: paragraph
            body: >-
              Customer adoption of SKIMS is anchored in everyday functional workflows where traditional foundation
              garments historically introduced friction through pinching waistbands, fabric rolling, visible seam lines,
              or restrictive boning. To resolve these friction points, SKIMS engineered proprietary textile blends such
              as Fits Everybody and Seamless Sculpt, which prioritize high stretch recovery, moisture breathability, and
              second-skin compression. In parallel, the brand eliminated plus-size price discrimination by maintaining
              uniform price points across its entire XXS to 5X size gradient. By engineering garments around adaptive
              elasticity rather than fixed compression panels, SKIMS provides functional smoothing across diverse body
              silhouettes while simultaneously reducing sizing guesswork and return friction in direct-to-consumer
              purchasing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE014
