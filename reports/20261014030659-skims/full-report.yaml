    title: Customer journey map
    type: journey-map
    summary: >-
      Customer journey mapping from initial social discovery and waitlist drops through core category replenishment and
      lifestyle expansion.
    data:
      items:
        - label: 'Phase 1: Viral Discovery & Social Top-Funnel'
          summary: Awareness driven by Kim Kardashian's 360M+ organic social reach, creator seeding, and cultural moments.
          touchpoints:
            - TikTok try-on clips
            - Instagram Stories and Reels
            - Pop-up experiential stores
        - label: 'Phase 2: Waitlist Engagement & Drop-Day Urgency'
          summary: Urgency generated by timed capsule countdowns, SMS/email alerts, and limited initial inventory runs.
          touchpoints:
            - Waitlist email subscriptions
            - SMS drop countdown alerts
            - Launch-day site releases
        - label: 'Phase 3: Sizing Confidence & First Purchase'
          summary: Conversion facilitated by XXS-5X inclusive sizing, 9 skin-tone shades, and UGC sizing guides.
          touchpoints:
            - Online size calculator
            - Fabric and stretch explainers
            - UGC try-on video hauls
        - label: 'Phase 4: Replenishment & Core Habit Formation'
          summary: Recurring purchasing centered on everyday essentials like Fits Everybody underwear and bralettes.
          touchpoints:
            - Back-in-stock notifications
            - Automated replenishment reminders
            - Multi-pack bundle discounts
        - label: 'Phase 5: Cross-Category Expansion'
          summary: Expansion of customer share-of-wallet into loungewear, slip dresses, swimwear, and performance menswear.
          touchpoints:
            - Curated cross-category emails
            - Seasonal capsule drops
            - Gifting and holiday bundles
        - label: 'Phase 6: Omnichannel & Physical Store Touchpoints'
          summary: >-
            In-person touchpoints through permanent retail stores, luxury wholesale concessions, and sports league
            tie-ins.
          touchpoints:
            - 18 US permanent retail stores
            - Nordstrom and Saks concessions
            - Global retail pop-ups
