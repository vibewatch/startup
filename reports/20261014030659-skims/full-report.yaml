              - CR008
              - CR011
              - CR012
              - CR014
      - number: '7.2'
        title: Operational and financial execution
        blocks:
          - type: paragraph
            body: >-
              The physical-retail pivot increases fixed-cost and working-capital sensitivity at the same time that SKIMS
              is broadening categories and markets. In 2025 the company reported 18 owned US stores and two franchise
              doors in Mexico and said it was laying the groundwork to become predominantly physical. A separate June
              2025 report described launches across the United States, Mexico, London, and Dubai. Earlier Business of
              Fashion reporting documented stockouts, disrupted deliveries, and seasonal inventory arriving months late
              across a global manufacturing network. The recent capital raise is a buffer, not proof that new stores
              will earn acceptable returns, and the retained sources do not disclose audited margins, burn, or
              working-capital needs.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
