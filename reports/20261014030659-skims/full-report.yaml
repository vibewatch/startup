        - 5.0x revenue multiple leaves narrow safety margin against execution shocks
      - - Confidence Level
        - Moderate confidence based on cross-validated disclosures
        - medium
        - Public disclosures cross-validate scale but conceal internal cash burn and margins
      - - Risk Rating
        - High operational, key-person, and retail expansion risk
        - high
        - High celebrity concentration and aggressive retail capex require downside protections
    notes: >-
      Assessment synthesized from cross-referenced financing disclosures, analyst reports, and commercial expansion
      data.
    claimRefs:
      - CV001
      - CV002
      - CV003
  - id: TV002
    title: SKIMS Investment Thesis and Anti-Thesis Framework
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Brand Equity
        - Kim Kardashian and viral social positioning generate low-CAC category leadership
        - Extreme key-person dependency creates severe headline and brand-fatigue vulnerability
        - Diversification of brand equity into athletic partnerships like Nike and independent executive leadership
      - - Product & TAM
        - Expansion into loungewear, swimwear, menswear, and NikeSKIMS multiplies addressable market
        - Product proliferation dilutes core solutionwear identity and escalates inventory complexity
        - Sustained high sell-through and repeat order rates across non-shapewear lines
      - - Distribution
        - Omnichannel expansion across 18+ owned stores and prime global flagships drives high LTV
        - >-
          Heavy brick-and-mortar leases and overseas flagships significantly increase fixed overhead and working capital
          burn
        - Demonstrated four-wall profitability and fast payback across opened retail locations
      - - Financials & Margin
        - Reported profitability and rapid scaling toward $1B+ net sales support premium valuation
        - Lack of audited gross margins, return rates, and cash flow masks true unit economics
        - Independent audit verifying gross margins above 55% and positive operating cash flow
    notes: Contrasts core drivers of enterprise value against critical operational, celebrity, and capital-intensity risks.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 'SKIMS Scenario Analysis: Bull, Base, and Bear Cases'
    columns:
      - Scenario
      - Revenue & Growth Assumptions
      - Valuation Multiple & Target
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Net sales reach $1.4B+ with international expansion, retail maturation, and NikeSKIMS
        - 6.5x revenue multiple ($9.1B valuation) on successful IPO trajectory
        - Execution delays in London/Dubai flagships, supply chain bottlenecks
        - 25% - requires flawless physical retail transition
      - - Base Case
        - Net sales stabilize at $1.0B-$1.1B with moderate growth in core shapewear and intimates
        - 4.5x-5.0x revenue multiple ($4.5B-$5.5B valuation) reflecting mature consumer apparel scale
        - Growth deceleration, increasing customer acquisition costs, modest retail margin drag
        - 50% - aligns with current Series D pricing and reported sales
      - - Bear Case
        - Sales plateau below $850M due to celebrity fatigue and intensifying competition from Spanx/basics
        - 2.0x-2.5x revenue multiple ($1.7B-$2.1B valuation) on down-round or distressed secondary marks
        - Brand damage, key-person scandal, heavy store lease liabilities, margin collapse
        - 25% - driven by macro consumer slowdown and high fixed commitments
    notes: >-
      Scenario projections evaluate enterprise value across plausible operating trajectories from the 2025 Series D
      baseline.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
