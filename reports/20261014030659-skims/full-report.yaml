              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.3'
        title: Partner and founder dependencies
        blocks:
          - type: paragraph
            body: >-
              SKIMS is expanding through owned stores, franchise doors, wholesale points, and the NikeSKIMS
              collaboration, so execution quality is partly distributed across counterparties. The 2025 retail profile
              reported 57 global distribution points and additional franchise and wholesale relationships; it also
              reported that NikeSKIMS had been delayed because of production issues. Founder concentration is separate
              from partner concentration. Coverage says Kim Kardashian remains involved in every major creative decision
              while Jens Grede leads business and distribution, creating a strong division of labor but also a dual
              key-person dependency. Third-party directories identify a broader operating bench, yet their performance
              claims are not primary evidence and should not be treated as validated mitigation.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.4'
        title: Residual risk and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are a store rollout that does not generate incremental demand, renewed
              inventory delays during category expansion, and weakening differentiation against larger apparel
              incumbents. Monitor same-store productivity, store-level contribution margin, inventory aging, in-stock
              rates, launch slippage, wholesale sell-through, and founder engagement. A sustained decline in store
              productivity, repeated launch delays, or inventory growth materially ahead of sales would break the
              execution thesis. A material founder departure without demonstrated succession would break the
              brand-governance thesis. Because audited profitability and cash-conversion data are unavailable in the
              assigned evidence, any investment decision should remain conditional on monthly cash flow, inventory
              reserves, lease commitments, supplier concentration, incident history, and legal representations.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR012
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital does not validate store economics
            body: >-
              The $225 million raise funds expansion, but it does not disclose store contribution margins, lease
              exposure, or cash conversion; investment approval should remain conditional on those operating data.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: Treat unknown legal and security posture as a diligence condition
            body: >-
              Do not infer a clean incident or regulatory record from the absence of relevant primary sources; require
              direct legal, product-safety, privacy, and security evidence before closing.
            calloutType: recommendation
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation History and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              SKIMS completed a $225 million Series D financing round in November 2025 at a $5.0 billion post-money
              valuation, led by Goldman Sachs Alternatives with participation from funds affiliated with BDT and MSD
              Partners. This transaction elevated cumulative capital raised to approximately $953 million across six
              equity rounds, following a $270 million Series C round in July 2023 at a $4.0 billion valuation and a $240
              million Series B round in January 2022 at $3.2 billion. Based on projected net sales surpassing $1.0
              billion for 2025, the Series D valuation represents an implied enterprise-value-to-sales multiple of
              roughly 5.0x. By comparison, mature publicly traded apparel and intimates competitors trade at
              substantially lower revenue multiples: Victoria's Secret and Under Armour maintain a combined market
              capitalization that SKIMS now exceeds, while Spanx was acquired by Blackstone at a $1.2 billion valuation
              in 2021. The 5.0x multiple demands sustained hypergrowth and flawless execution across retail expansion,
              leaving minimal margin of safety for new growth-equity allocations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: Core Investment Thesis and Anti-Thesis Balance
        blocks:
          - type: paragraph
            body: >-
              The positive investment thesis rests on SKIMS' demonstrated category leadership, rapid top-line
              trajectory, and organic customer acquisition efficiency powered by co-founder Kim Kardashian's cultural
              reach. Having scaled from an initial shapewear focus in 2019 to over $750 million in 2023 revenue, SKIMS
              successfully expanded into loungewear, swimwear, menswear, and the NikeSKIMS athletic partnership.
              Management reported positive operating earnings of approximately $190 million for 2023, indicating healthy
              underlying cash generation in its direct-to-consumer core. However, the anti-thesis highlights critical
              structural vulnerabilities that offset these achievements. Growth remains heavily dependent on Kim
              Kardashian's personal celebrity equity and social media distribution, creating acute key-person risk where
              brand sentiment shifts could immediately impair demand. Furthermore, the company's aggressive transition
              toward physical storefronts and international flagships in London and Dubai significantly increases fixed
              lease obligations, operating overhead, and fulfillment complexity.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Projections and Return Sensitivities
        blocks:
          - type: paragraph
            body: >-
              A rigorous scenario framework models three distinct operating trajectories from the late 2025 Series D
              baseline. In the bull case, probability-weighted at 25%, SKIMS accelerates net sales to $1.4 billion by
              2027 as standalone retail flagships and international distribution channels in Europe and the Middle East
              mature, supporting a 6.5x exit multiple and a $9.1 billion valuation upon a public offering. The base
              case, probability-weighted at 50%, models revenue stabilizing between $1.0 billion and $1.1 billion with
              modest margin compression as physical retail overhead grows, resulting in a 4.5x to 5.0x revenue multiple
              and an enterprise valuation between $4.5 billion and $5.5 billion. In the bear case, probability-weighted
              at 25%, market saturation in core shapewear, intensified competition from incumbent apparel brands, and
              supply chain bottlenecks drag net sales below $850 million, compressing multiples to 2.0x to 2.5x and
              reducing valuation to $1.7 billion to $2.1 billion.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit Readiness and Diligence Framework
        blocks:
          - type: paragraph
            body: >-
              SKIMS possesses several foundational attributes required for an eventual initial public offering,
              including institutional governance support from Goldman Sachs Alternatives and Wellington Management, a
              veteran executive team led by CEO Jens Grede and CFO Andy Muir, and expanding global distribution.
              Nevertheless, immediate equity commitment is unadvisable prior to comprehensive confirmatory diligence.
              Public information provides only unaudited top-line assertions and directional margin claims, omitting
              audited GAAP financial statements, return rates, inventory reserves, and free cash flow conversion.
              Furthermore, liquidation preference structures and senior participation rights attached to the Series D
              preferred stock remain undisclosed, leaving common equity recovery vulnerable in downside outcomes.
              Investors should maintain a research-more stance, tracking four-wall retail unit economics and insisting
              on complete financial disclosure before endorsing entry at the current $5.0 billion valuation mark.
            claimRefs:
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment Decision Implication
            body: >-
              Maintain a research-more stance on SKIMS equity at the current five billion dollar valuation mark. While
              the brand has established genuine category leadership and achieved rapid top-line expansion toward one
              billion dollars, the valuation implies a five-times revenue multiple that leaves minimal margin of safety
              without audited financial statements, verified gross margins, and clear liquidation preference terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: Downside Thesis Triggers
            body: >-
              Downside triggers that would prompt an immediate avoid recommendation include celebrity fatigue or
              controversy surrounding Kim Kardashian, margin compression resulting from high-cost standalone retail
              leases in prime metropolitan markets, and supply-chain bottlenecks during accelerated international
              rollouts.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
