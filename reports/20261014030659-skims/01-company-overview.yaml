callouts:
  - calloutType: risk
    title: Founder Concentration and Private Financial Opacity
    body: While SKIMS has demonstrated exceptional cultural resonance and brand velocity, reaching a $5 billion valuation and over $750 million in annual sales, its brand equity remains tightly coupled to Kim Kardashian’s personal celebrity persona. Furthermore, absent audited disclosures regarding EBITDA profitability, return rates, and true gross margins, private market valuations reflect aggressive top-line growth assumptions rather than verified cash flow generation.
    claimRefs:
      - CO006
      - CO008
      - CO010
