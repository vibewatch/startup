company:
  name: SKIMS
chapter:
  number: 1
  title: Company Overview
  summary: SKIMS is a Los Angeles-based solutions-oriented shapewear, intimates, and lifestyle apparel brand co-founded in 2019 by Kim Kardashian and Jens Grede. Supported by $952.6 million in total equity funding and valued at $5 billion following its November 2025 Series D led by Goldman Sachs Alternatives, SKIMS has expanded from digital shapewear drops into physical retail, menswear, and beauty, while remaining exposed to key-person concentration and opaque audited unit economics.
sections:
  - id: corporate-identity-and-business-model
    title: Corporate Identity and Business Model
    body: SKIMS Body, Inc. is an American direct-to-consumer apparel and lifestyle brand founded in 2019 and headquartered at 1601 Vine Street in Hollywood, Los Angeles, California. Originally incorporated in April 2018, the company established a distinctive market identity by redefining traditional shapewear as modern solutionwear engineered around body inclusivity, technical fabric innovation, and an expansive spectrum of skin-tone shades spanning sizes XXS through 5X. Rather than positioning its garments as restrictive corrective undergarments, SKIMS approached the category as an everyday wardrobe essential, combining digital-first scarcity drops with high-visibility cultural storytelling. While the business originated as a digital direct-to-consumer e-commerce platform, management has accelerated a transition toward an omnichannel model, deploying wholesale partnerships with retailers such as Nordstrom alongside an expanding fleet of 18 domestic standalone retail boutiques and international franchise outposts in Mexico.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
    figureRefs: []
  - id: leadership-governance-and-key-person-exposure
    title: Executive Leadership, Governance, and Key-Person Exposure
    body: 'The governance and operational hierarchy of SKIMS reflects a deliberate partnership between celebrity brand equity and seasoned fashion industry operators. Kim Kardashian functions as Co-Founder, Chief Brand Officer, and Chief Creative Officer, serving as the aesthetic visionary, product tester, and central marketing engine across global media channels. Operational leadership is directed by Co-Founder and Chief Executive Officer Jens Grede, who previously built Swedish premium denim label FRAME and brought institutional apparel supply chain experience. They are supported by founding partner Emma Grede as Chief Product Officer, Chief Operating Officer Mehmet Dokumcu overseeing digital fulfillment infrastructure, Chief Financial Officer Andy Muir managing capital planning, and Chief Technology Officer Devin K. Miller directing e-commerce architecture. However, this structure entails severe key-person concentration risk: brand loyalty and customer acquisition economics remain inextricably linked to Kardashian’s public persona, creating organizational vulnerability should consumer sentiment shift or external controversies arise.'
    claimRefs:
      - CO002
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002
    figureRefs: []
  - id: capitalization-and-investor-syndicate
    title: Financing History and Capital Structure
    body: 'SKIMS has executed an aggressive capital-raising strategy, accumulating approximately $952.6 million across six primary equity funding rounds between 2019 and late 2025. Following an initial seed financing round of approximately $4 million led by Imaginary Ventures at a $16.8 million post-money valuation in 2019, the company achieved unicorn status in April 2021 when Thrive Capital led a $154 million Series A at a $1.6 billion valuation. Subsequent rounds marked dramatic step-ups in private market pricing: a $240 million Series B led by Lone Pine Capital in January 2022 valued SKIMS at $3.2 billion, followed by a $270 million Series C led by Wellington Management in July 2023 at $4.0 billion. In November 2025, SKIMS completed a $225 million Series D financing led by Goldman Sachs Alternatives with participation from BDT & MSD Partners at a $5.0 billion post-money valuation. Despite this top-tier institutional syndicate, complete capitalization table details, founder voting control, liquidation preferences, and secondary transaction pricing remain closely guarded private information.'
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO003
    figureRefs: []
  - id: operational-scale-and-milestone-evolution
    title: Scale Trajectory, Category Expansion, and Strategic Milestones
    body: The corporate evolution of SKIMS has navigated high-profile brand crises, rapid category diversification, and organizational headcount growth. Prior to its commercial launch in September 2019, the brand faced severe public backlash over its original trademark name, Kimono, prompting an emergency rebranding to SKIMS within months. Since that launch, the company has methodically expanded beyond foundational shapewear into loungewear, sleepwear, swimwear, activewear, and a dedicated menswear collection launched in late 2023. Strategic cultural authority was reinforced through commercial sports partnerships with the NBA, WNBA, USA Basketball, and Team USA Olympic uniforms. In 2024, SKIMS absorbed Coty’s 20% stake in beauty label Skkn by Kim, consolidating Kardashian’s cosmetic, skincare, and fragrance assets under unified brand management. To support this multi-category retail infrastructure, workforce intelligence records show headcount expanding from 159 employees in late 2022 to 1,314 personnel by March 2026 as annual net sales approached $1.0 billion.
    claimRefs:
      - CO003
      - CO004
      - CO013
      - CO014
      - CO015
    tableRefs: []
    figureRefs:
      - FO001
