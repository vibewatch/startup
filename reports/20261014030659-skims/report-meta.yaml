companyProfile:
  summary: >-
    SKIMS is a Los Angeles-based apparel and lifestyle company founded in 2019 by Kim Kardashian and Jens Grede. The
    business combines a direct-to-consumer core with owned retail, wholesale, and franchise distribution, and it has
    scaled to a $5.0 billion valuation, roughly $952.6 million of cumulative equity funding, 18 owned U.S. stores, two
    franchise doors in Mexico, and 1,314 employees as of March 2026.
