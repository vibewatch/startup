callouts:
  - calloutType: "insight"
    title: "The Replenishment Engine Behind Drop Culture"
    body: "While SKIMS' public visibility is propelled by high-heat limited drops and celebrity endorsement, the company's operational durability relies on a 68% replenishment rate for core fabric lines like Fits Everybody and Seamless Sculpt. By transitioning viral waitlist registrants into recurring underwear and loungewear replenishments, SKIMS overcomes the churn typical of direct-to-consumer apparel."
    claimRefs:
      - "CU007"
      - "CU011"
  - calloutType: "risk"
    title: "Celebrity Concentration & Operational Delays"
    body: "SKIMS faces acute operational and brand vulnerabilities. Best-seller inventory shortages have historically delayed customer deliveries by months, generating buyer frustration. Furthermore, brand equity is deeply intertwined with Kim Kardashian's personal social presence, and labor controversies in Southeast Asian supply chains expose the business to reputational backlash."
    claimRefs:
      - "CU009"
      - "CU010"
