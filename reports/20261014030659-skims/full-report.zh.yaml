              - CR013
          - type: callout
            title: 把未知的法律与安全状况作为尽调条件
            body: 不要因为缺少相关一手来源，就推断公司没有事故或监管记录；交割前必须直接取得法律、产品安全、隐私和安全证据。
            calloutType: recommendation
            claimRefs:
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与入场纪律
        blocks:
          - type: paragraph
            body: >-
              SKIMS 于 2025 年 11 月完成 $225 million Series D 融资，投后估值 $5.0 billion，由 Goldman Sachs Alternatives 领投，BDT 和 MSD
              Partners 关联基金参与。本轮将六轮股权融资累计金额推升至约 $953 million；此前公司于 2023 年 7 月完成 $270 million Series C，估值 $4.0 billion，并于
              2022 年 1 月完成 $240 million Series B，估值 $3.2 billion。按 2025 年预计净销售额超过 $1.0 billion 计算，Series D 估值隐含的企业价值 /
              销售额倍数约为 5.0x。相比之下，成熟上市服装和贴身衣物竞争者的收入倍数明显更低：Victoria's Secret 和 Under Armour 的合计市值如今低于 SKIMS，而 Spanx 于 2021
              年被 Blackstone 以 $1.2 billion 估值收购。5.0x 倍数要求零售扩张持续高速增长且执行无瑕，为新的成长型股权投资留下的安全边际很小。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: 核心投资论点与反论点平衡
        blocks:
          - type: paragraph
            body: >-
              正向投资论点建立在 SKIMS 已证明的品类领导力、快速收入增长，以及由联合创始人 Kim Kardashian 文化影响力驱动的自然获客效率之上。公司从 2019 年最初聚焦塑身衣，扩展到 2023 年收入超过
              $750 million，并成功进入家居服、泳装、男装和 NikeSKIMS 运动合作。管理层报告 2023 年经营收益约 $190 million 为正，说明 DTC
              核心具备健康的底层现金创造能力。但反论点指出了抵消这些成绩的关键结构性弱点。增长仍高度依赖 Kim Kardashian
              的个人名人资产和社交媒体分发，形成严重关键人物风险；一旦品牌情绪变化，需求可能立即受损。此外，公司激进转向实体店和伦敦、迪拜国际旗舰店，会显著增加固定租赁义务、运营开支和履约复杂度。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 情景预测与回报敏感性
        blocks:
          - type: paragraph
            body: >-
              严谨的情景框架以 2025 年底 Series D 为基准，模拟三种不同的运营轨迹。乐观情景概率加权 25%：随着独立旗舰店以及欧洲、中东国际分销渠道成熟，SKIMS 到 2027 年净销售额加速至 $1.4
              billion，支撑 6.5x 退出倍数，并在上市时达到 $9.1 billion 估值。基准情景概率加权 50%：随着实体零售开支上升，收入稳定在 $1.0 billion 至 $1.1
              billion，利润率小幅压缩，收入倍数为 4.5x 至 5.0x，企业估值为 $4.5 billion 至 $5.5 billion。悲观情景概率加权
              25%：核心塑身衣市场饱和、服装巨头竞争加剧、供应链瓶颈拖累净销售额跌破 $850 million，倍数压缩至 2.0x 至 2.5x，估值降至 $1.7 billion 至 $2.1 billion。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出准备度与尽调框架
        blocks:
          - type: paragraph
            body: >-
              SKIMS 已具备最终走向首次公开募股所需的几项基础条件：Goldman Sachs Alternatives 和 Wellington Management 提供机构治理支持，CEO Jens Grede 与
              CFO Andy Muir 领衔的管理团队经验丰富，全球分销也在扩张。不过，在完成全面的确认性尽调前，不宜立即投入股权资金。公开信息只有未经审计的收入端口径和方向性的利润率说法，缺少经审计的 GAAP
              财务报表、退货率、库存准备金及自由现金流转化率。此外，Series D 优先股附带的清算优先权结构和高级参与权仍未披露，导致下行情景下普通股的回收存在脆弱性。
              投资者应继续保持“继续研究”的立场，跟踪四墙零售单店经济模型，并要求完整财务披露，再考虑以当前 $5.0 billion 的估值入场。
            claimRefs:
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资决策含义
            body: >-
              在当前 50 亿美元估值下，对 SKIMS 股权继续保持“继续研究”的立场。品牌已经确立真实的品类领先地位，收入端也快速增长至接近 10 亿美元；但按该估值计算，收入倍数达到五倍。在没有
              经审计财务报表、经过核实的毛利率和明确清算优先权条款的情况下，安全边际很小。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: 下行逻辑触发因素
            body: 可能触发立即“回避”建议的下行因素包括 Kim Kardashian 的明星效应疲软或相关争议、核心大都市高成本 独立门店租约导致的利润率压缩，以及国际扩张加速期间的供应链瓶颈。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
