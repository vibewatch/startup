              SKIMS 还通过高影响力体育合作取得文化验证。品牌为代表 Team USA 参加东京 2021 年奥运会的全部 626 名女运动员提供服装，并在巴黎 2024 年奥运会续签家居服合作。2023 年底成为
              NBA、WNBA 和 USA Basketball 官方内衣合作伙伴后，解决型服装和运动基础款进入大众体育受众。最近发布的 NikeSKIMS，是一个于 2025 年底推出、拥有 58
              种廓形的专门运动服品牌，显示出顶级商业背书，并打开巨大的全球运动服分销渠道。
