  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类扩张
        blocks:
          - type: paragraph
            body: >-
              SKIMS 于 2019
              年进入服装行业，把塑身衣重新定义为日常解决型服装，以工程面料和强调身体正向的廓形提升自然曲线，而非束缚身体。基础塑身衣建立了品牌认知和定价能力后，管理层迅速把产品组合扩展到高频补购品类。无缝文胸、超细纤维内裤等核心日常贴身衣物，很快超过塑身衣，成为品牌最大的收入来源。后续扩展加入家居服、睡衣、泳装和男装基础款，并推出
              NikeSkims 等联名运动合作。SKIMS 有意避开矫形器和医疗压缩服，同时捕捉大众休闲服饰消费，把运营边界从专业内衣细分市场拓展成广阔的现代生活方式服装平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可服务市场规模与测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 SKIMS 的总可服务市场，需要多个测算视角，而不是一个汇总指标。全球专业塑身衣市场约 $4 billion，属于稳定但成熟的品类，历史上由 Spanx
              等老牌玩家主导。相比之下，全球女性贴身衣物、内衣和睡衣市场规模为 $85 billion，购买频次更高，替换需求也更强。继续拓展家居休闲服、运动服和男装后，SKIMS 所处的全球休闲服和运动休闲市场超过 $350
              billion。SKIMS 在 Series A 时估值达到 $500 million，2025 年底估值升至 $5 billion，预计净销售额超过 $1
              billion，已在高端大众必需品这一目标可服务市场中取得有意义的份额。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
