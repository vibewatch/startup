  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 用金字塔展示 SKIMS 从全球生活方式服饰到可服务全渠道需求的可触达市场层级。
    data:
      items:
        - label: 全球服饰市场总额
          value: 1500
          unit: $B
          notes: 覆盖外套、正装和鞋类的最广义服饰市场
        - label: 全球运动休闲与休闲服饰（更宽 TAM）
          value: 350
          unit: $B
          notes: 可通过品牌延伸触达的运动服、家居服和生活方式服饰
        - label: 全球内衣与睡衣（核心 TAM）
          value: 85
          unit: $B
          notes: 全球内裤、文胸、内衣和睡衣品类
        - label: 高端可负担基础款（可服务市场 / SAM）
          value: 25
          unit: $B
          notes: 核心市场的高端 DTC 及专业零售内衣和家居服
        - label: 全渠道塑身衣与基础款（近期 SOM）
          value: 15
          unit: $B
          notes: 美国、欧洲及部分国际大都市近期可直接争取的目标需求
        - label: SKIMS FY2025 预计净销售额
          value: 1
          unit: $B
          notes: 公司对电商和零售门店合计净收入门槛的指引
    approximationNotes: 市场规模各层综合第三方行业数据与 SKIMS 已披露的净销售额预测；数值已四舍五入，仅用于对比展示。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按品类广度和品牌文化影响力，对比内衣及生活方式服饰品牌的竞争定位。
    data:
      xAxis:
        label: 品类广度（核心塑身衣至多品类生活方式）
        min: 0
        max: 10
      yAxis:
        label: 品牌文化影响力与社交互动
        min: 0
        max: 10
      points:
        - label: SKIMS
          x: 8.5
          'y': 9.5
          description: 覆盖塑身衣、家居服、泳装、男装和 NikeSKIMS 运动服，品类布局广且社交影响力巨大。
        - label: Spanx
          x: 4.5
          'y': 5
          description: 塑身衣领域的先行者，拥有积累的品牌资产，但生活方式扩张较窄，营销方式也较传统。
        - label: Savage X Fenty
          x: 6
          'y': 7.5
          description: 名人背书带来强大的内衣和家居服品牌影响力，重点采用订阅模式。
        - label: Lululemon
          x: 8
          'y': 8
          description: 全球运动生活方式巨头，技术服饰能力深厚，但核心塑身衣布局有限。
        - label: Maidenform
          x: 2.5
          'y': 2.5
          description: 传统百货渠道基础品牌，定位大众化且产品趋于商品化，文化影响力有限。
        - label: Victoria's Secret
          x: 6.5
          'y': 6
          description: 老牌内衣巨头，正在推进品牌重新定位和多品类复苏。
    approximationNotes: 坐标评分是有证据支持的序数评估（0-10 分制），依据公开品牌影响力、社交粉丝规模和产品品类广度。
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP011
      - CP012
  - id: FI001
    title: 收入模型桥接图
    type: waterfall
    summary: 用瀑布图展示客户商品总额扣除折扣、商品成本和运营费用后如何形成经营利润。
    data:
      items:
        - label: 商品交易总额
          value: 100
          tone: positive
          notes: 数字 DTC 门店和合作伙伴渠道产生的客户基础总需求。
        - label: 退货与折扣
          value: -12
          tone: negative
          notes: 商品退货、尺码换货和选择性套装促销。
        - label: 净销售额
          value: 88
          tone: neutral
          notes: 扣除折让和客户抵扣后的确认净收入。
        - label: 销售成本
          value: -31
          tone: negative
          notes: 面料采购、裁剪缝制和进货运费。
        - label: 毛利
          value: 57
          tone: positive
          notes: 毛利率约保留净确认收入的 65%。
        - label: 履约与物流
          value: -16
          tone: negative
          notes: 仓储、拣货打包物流、3PL 合作伙伴和支付处理费。
        - label: 营销与管理费用
          value: -18
          tone: negative
          notes: 品牌营销活动、创意制作和公司一般及行政费用。
    approximationNotes: 以商品交易总额 100 个基准指数点进行标准化，依据行业 DTC 服饰基准、Sacra 估算和 Fashionbi 预测；经审计的利润表仍未公开。
