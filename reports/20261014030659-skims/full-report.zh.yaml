              - CR015
      - number: '7.4'
        title: 剩余风险与论点失效点
        blocks:
          - type: paragraph
            body: >-
              最大的剩余风险是门店扩张无法带来新增需求、品类扩张期间库存延误再现，以及相较更大型服装巨头的差异化减弱。应监测同店生产率、门店层面贡献利润率、库存库龄、现货率、发布延期、批发售罄率和创始人参与度。若门店生产率持续下滑、发布反复延期，或库存增长显著领先销售额，执行论点就会失效。若核心创始人离开且没有得到证明的继任安排，品牌治理论点也会失效。由于现有证据没有经审计的盈利和现金转化数据，任何投资决定都应以月度现金流、库存准备金、租赁承诺、供应商集中度、事故历史和法律陈述为前提。
            claimRefs:
