chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              SKIMS Body, Inc. 是一家美国 DTC 服装与生活方式品牌，2019 年创立，总部位于加利福尼亚州洛杉矶好莱坞 Vine Street 1601 号。公司最初于 2018 年 4
              月注册成立，通过把传统塑身衣重新定义为现代解决型服装，建立了鲜明的市场定位：强调身体包容、面料技术创新，以及覆盖 XXS 至 5X 的广泛肤色选择。SKIMS
              没有把产品定位成束缚身体的矫正内衣，而是把这一品类做成日常衣橱必需品，结合数字优先的限量发售和高曝光文化叙事。公司最初是数字化 DTC 电商平台，如今管理层正加速转向全渠道模式，在与 Nordstrom
              等零售商开展批发合作的同时，扩张美国 18 家独立门店及墨西哥国际特许门店网络。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: 管理层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 的治理和运营层级，是名人品牌资产与成熟时尚行业经营者的有意结合。Kim Kardashian
              担任联合创始人、首席品牌官和首席创意官，负责审美方向、产品试穿，并在全球媒体渠道中充当核心营销引擎。联合创始人兼首席执行官 Jens Grede 负责运营；他曾打造瑞典高端牛仔品牌
              FRAME，并带来成熟服装供应链经验。创始合伙人 Emma Grede 任首席产品官，Mehmet Dokumcu 任首席运营官并负责数字履约基础设施，Andy Muir 任首席财务官并管理资本规划，Devin
              K. Miller 任首席技术官并负责电商架构。但这一结构也带来严重的关键人物集中风险：品牌忠诚度和获客经济性与 Kardashian
              的公众形象牢牢绑定，一旦消费者情绪转向或出现外部争议，组织就会暴露在脆弱性之下。
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >-
              SKIMS 执行了激进的融资策略，在 2019 年至 2025 年底期间完成六轮主要股权融资，累计约 $952.6 million。2019 年，公司先完成约 $4 million 种子轮融资，由
              Imaginary Ventures 领投，投后估值 $16.8 million；2021 年 4 月，Thrive Capital 领投 $154 million 的 Series A，估值升至 $1.6
              billion，公司成为独角兽。随后私募市场定价大幅跃升：Lone Pine Capital 于 2022 年 1 月领投 $240 million 的 Series B，估值 $3.2
              billion；Wellington Management 于 2023 年 7 月领投 $270 million 的 Series C，估值 $4.0 billion。2025 年 11 月，SKIMS 完成由
              Goldman Sachs Alternatives 领投、BDT & MSD Partners 参与的 $225 million Series D，投后估值 $5.0
              billion。尽管机构投资者阵容强大，完整资本表、创始人投票控制权、清算优先权和二级交易定价仍是高度保密的私有信息。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 规模演进、品类扩张与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              SKIMS 的公司演进经历了高曝光品牌危机、快速品类多元化和组织规模增长。商业发布前的 2019 年 9 月，品牌原商标名 Kimono 遭遇强烈公众反弹，数月内紧急更名为
              SKIMS。发布以来，公司有序从基础塑身衣扩展到家居服、睡衣、泳装、运动服，以及 2023 年底推出的男装系列。公司通过与 NBA、WNBA、USA Basketball 合作，并参与 Team USA
              奥运制服，强化了文化影响力。2024 年，SKIMS 吸收 Coty 持有的美容品牌 Skkn by Kim 20% 股权，把 Kardashian
              的彩妆、护肤和香水资产纳入统一品牌管理。为支撑多品类零售基础设施，员工数据记录显示，公司员工从 2022 年底的 159 人增至 2026 年 3 月的 1,314 人，同期年度净销售额接近 $1.0
              billion。
            claimRefs:
              - CO003
              - CO004
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
