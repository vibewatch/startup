  - id: FV001
    title: SKIMS 投资建议逻辑流程
    type: flow
    summary: 五阶段决策框架将商业规模、品牌资产和扩张举措与风险及估值门槛相对照，最终得出继续研究的建议。
    approximationNotes: 按逻辑顺序将定性尽调关口映射到最终股权立场。
    claimRefs:
      - CV003
      - CV013
      - CV014
    data:
      nodes:
        - id: commercial-scale
          label: 商业规模（销售额 $1B+）
          note: 已验证的品类增长势头和多品类扩张
        - id: brand-equity
          label: 品牌资产与病毒传播
          note: 借助名人影响力实现较低的自然获客成本
        - id: retail-expansion
          label: 全球全渠道布局
          note: 积极在伦敦、迪拜和美国旗舰店开店
        - id: operational-risks
          label: 执行与关键人物风险
          note: 沉重的租赁开支和高度的名人依赖
        - id: valuation-multiple
          label: 估值立场：偏高（5.0x EV/Rev）
          note: 定价高于上市可比公司，安全边际极小
        - id: final-recommendation
          label: 建议：继续研究
          note: 等待经审计的 GAAP 财务审计完成后再分配股权资本
      edges:
        - from: commercial-scale
          to: brand-equity
        - from: brand-equity
          to: retail-expansion
        - from: retail-expansion
          to: operational-risks
        - from: operational-risks
          to: valuation-multiple
        - from: valuation-multiple
          to: final-recommendation
