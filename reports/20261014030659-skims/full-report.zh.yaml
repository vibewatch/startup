          - type: callout
            title: 名人集中与运营延误
            body: SKIMS 面临明显的运营和品牌脆弱性。畅销品库存短缺过去曾使客户交付延误数月，造成买家挫败感；品牌资产又与 Kim Kardashian 的个人社交影响力深度绑定，东南亚供应链的劳工争议进一步暴露声誉反弹风险。
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与法律未知项
        blocks:
          - type: paragraph
            body: >-
              证据最充分的风险是执行风险，而不是已有记录的法律危机。SKIMS 表示 2025 年 11
              月融资将支持实体零售、国际增长、产品创新和品类扩张；独立报道则描述了激烈的运动休闲竞争，以及越来越标准化的产品品类。因此，在基于证据的排序中，门店生产率、库存可得性和差异化优先于法律暴露。不过，现有材料没有监管机构、法院、召回、认证或事故记录，所以无法验证法律、产品安全、广告、隐私和安全风险的严重程度。法律登记表因此记录风险暴露和明确的尽调路径，但不暗示已发生违规或事故。
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR008
              - CR011
              - CR012
              - CR014
      - number: '7.2'
        title: 运营与财务执行
        blocks:
          - type: paragraph
            body: >-
              SKIMS 扩大品类和市场的同时转向实体零售，使固定成本和营运资金敏感性上升。公司在 2025 年报告拥有 18 家美国自营门店和墨西哥两家特许门店，并表示正在为转向以实体渠道为主打基础。另一份 2025 年 6
              月报道提到公司在美国、墨西哥、伦敦和迪拜推出业务。Business of Fashion
              早期报道记录了全球制造网络中的缺货、交付中断和季节库存延迟数月。近期融资是缓冲，不是新店能够获得可接受回报的证明；保留的来源也没有披露经审计利润率、现金消耗或营运资金需求。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR013
              - CR016
