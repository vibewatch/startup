              - CR013
              - CR016
      - number: '7.3'
        title: 合作伙伴与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              SKIMS 通过自营门店、特许门店、批发网点和 NikeSKIMS 联名扩张，因此执行质量部分分散在交易对手之间。2025 年零售概况报告称，公司拥有 57 个全球分销点，以及更多特许和批发关系；报告还称
              NikeSKIMS 因生产问题延期。创始人集中度不同于合作伙伴集中度。报道显示 Kim Kardashian 仍参与每项重大创意决策，而 Jens Grede
              负责业务与分销；这种分工明确，但也形成双重关键人物依赖。第三方目录显示公司拥有更广泛的运营团队，但其中的业绩说法并非一手证据，不应视为已验证的缓释措施。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
