      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 创始人集中度与私人财务不透明
            body: >-
              SKIMS 已展现出非凡的文化共鸣和品牌增速，估值达到 $5 billion、年销售额超过 $750 million，但品牌资产仍与 Kim Kardashian 的个人名人形象高度绑定。此外，由于缺乏关于
              EBITDA 盈利能力、退货率和真实毛利率的经审计披露，私募市场估值更多反映激进的收入增长假设，而不是经过验证的现金流创造能力。
            calloutType: risk
