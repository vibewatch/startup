figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理公司 2018 至 2026 年的成立、主要融资轮次、品类扩张和战略重新定位。
    approximationNotes: null
    data:
      items:
        - label: 注册成立与法律设立
          date: '2018-04-20'
          detail: SKIMS Body, Inc. 在加利福尼亚州依法注册成立，定位为解决方案型内衣公司。
          tone: neutral
        - label: Kimono 命名风波与品牌重塑
          date: '2019-07-01'
          detail: 因公众消费者反对文化挪用，公司放弃原品牌名 Kimono，改名为 SKIMS。
          tone: warning
        - label: DTC 商业上线
          date: '2019-09-01'
          detail: 核心塑身衣产品线正式电商上线；Imaginary Ventures 提供种子轮融资。
          tone: positive
        - label: Series A 独角兽融资（投后 $1.6B）
          date: '2021-04-01'
          detail: 在 Thrive Capital 领投下完成 $154M Series A，投后估值 $1.6B。
          tone: positive
        - label: Series B 成长融资（投后 $3.2B）
          date: '2022-01-01'
          detail: 在 Lone Pine Capital 领投下完成 $240M Series B，估值升至 $3.2B。
          tone: positive
        - label: Series C 融资（$4.0B 投后）与男装
          date: '2023-07-01'
          detail: 在 Wellington Management 领投下完成 $270M Series C，估值 $4.0B；2023 年末推出男装。
          tone: positive
        - label: 收购并整合 Skkn by Kim
          date: '2024-04-01'
          detail: 收购 Coty 持有的 20% 股份，将美妆、护肤和香水业务统一纳入 SKIMS 品牌旗下。
          tone: opportunity
        - label: Series D 融资（投后 $5.0B）与门店扩张
          date: '2025-11-01'
          detail: 在 Goldman Sachs Alternatives 与 BDT & MSD Partners 领投下完成 $225M Series D，已覆盖 18 个美国零售网点。
          tone: positive
