        blocks:
          - type: paragraph
            body: >
              尽管收入增长亮眼，SKIMS 仍面临结构性客户集中与满意度风险。首先，营销高度集中于联合创始人 Kim Kardashian 的个人媒体影响力：她拥有超过 360 million Instagram
              粉丝，是不可替代的漏斗上层放大器；但任何个人声誉受损或消费者情绪变化，都会形成未对冲的品牌风险。虽然公司将超过一半营销预算投向由第三方创作者和运动员参与的品牌建设活动，品牌叙事仍与创始人曝光度牢牢相连。


              运营执行也造成了有记录的客户不满。持续旺盛的需求叠加供应链中断，历史上曾造成严重缺货，畅销品数月无法购买，原定秋季家居服甚至拖到晚春才到货。此外，劳工权利组织的调查报道揭示了严重供应链脆弱性，包括 2021
              年政变后缅甸工厂被指支付低于最低工资，以及泰国工厂缅甸移民工人每周工作超过 60 小时。这些供应链伦理风险会损害有社会意识的 Z 世代和千禧一代消费者的信任。
            claimRefs:
              - CU009
              - CU010
              - CU012
