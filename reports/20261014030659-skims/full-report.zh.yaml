              - CM013
      - number: '2.3'
        title: 买方细分与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              SKIMS 的客户基础以重视合身度稳定、肤色匹配和现代审美呈现的女性千禧一代与 Z 世代为主。品牌从 XXS 到 5X
              的延展尺码采用统一价格，消除了曲线及大码消费者长期面临的购买摩擦，建立了此前服务不足群体的品牌忠诚度。作为数字原生 DTC 品牌，SKIMS
              通过用户生成的社交评价和严格控制的发售节奏，制造病毒式自然传播、紧迫感和全价售罄。为了在在线渠道之外维持高速增长，公司激进推进全渠道转型，已扩展至 18
              家美国自营门店和国际特许门店，并希望未来几年实体零售成为主要收入来源。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、竞争与市场约束
        blocks:
          - type: paragraph
            body: >-
              SKIMS
              的增长动力来自面料创新、创始人驱动的社交曝光，以及把日常舒适与向往型奢华审美结合起来的严谨品牌运营。但全渠道服装企业扩张也会带来明显的运营瓶颈和竞争挑战。从高毛利数字化限量发售转向资本密集型实体门店，会增加租赁承诺、营运资金需求和区域库存敞口。进一步进军运动休闲市场后，SKIMS
              将直接面对 Lululemon、Alo Yoga 等成熟全球运动品牌。品牌还会遭遇消费者分化，以及对实验性生活方式新品的批评，体现出快速品类多元化固有的声誉风险。
            claimRefs:
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从专业塑身衣迁移到日常基础款
            body: SKIMS 的核心结构性洞察是：塑身衣属于高毛利、低频购买，而日常内衣和家居服能带来可预测、持续的补购订单。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 全渠道资本密度与库存敞口
            body: 从数字优先的限量发售模式转向覆盖数十家永久门店的实体零售网络，会带来更高的固定租赁义务和营运资金库存风险。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局、同业群体与现状替代品
        blocks:
          - type: paragraph
            body: >-
              贴身衣物和塑身衣市场长期分为传统功能型塑身衣与大众基础内衣两端。Spanx 在二十多年前建立了现代塑身衣品类，但其定位仍偏向实用的问题解决方案；Maidenform
              等传统百货品牌提供低价基础款，却缺乏现代审美。SKIMS 于 2019 年进入市场，并非只是另一个 DTC 品牌，而是把塑身衣重新定义为应当被看见、而非被隐藏的解决型服装。Savage X Fenty
              等直接的风投支持同业利用名人文化影响力和身体正向理念，但更依赖会员订阅和时尚内衣秀，而非技术型日常塑身基础款。同时，Lululemon
              等运动品牌巨头承接了相邻的日常舒适消费，却没有解决针对性塑形和结构化塑身。SKIMS 将技术塑形与受 Nike、Apple 等全球品类领导者启发的生活方式品牌叙事结合，建立了差异化市场地位，迫使传统巨头和现代
              DTC 新进入者重新审视产品架构与营销策略。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
