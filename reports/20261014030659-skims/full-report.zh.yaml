              - CP002
              - CP007
              - CP011
              - CP012
      - number: '3.2'
        title: 能力差异、包装与定价模型
        blocks:
          - type: paragraph
            body: >-
              塑身衣和贴身衣物的核心产品差异，集中在尺码广度、肤色分级、定价公平和上新节奏。传统竞争者过去通常将尺码封顶在 2X 或 3X，并只提供少量通用裸色；SKIMS 则以九种肤色、XXS 至 5X
              的尺码建立竞争标准。更重要的是，SKIMS 在全尺码范围内保持统一价格，避开传统服装厂商常见的大码加价。按价格架构看，SKIMS 将日常内衣和塑身衣核心款定在 $16 至
              $98，保持高端大众定位；专业塑形服装和外套的价格上限可达 $180。不同于依赖持续打折、多件促销或 Savage X Fenty 式 VIP 会员循环计费的传统零售品牌，SKIMS
              采用小批量限量发售。该模式制造病毒式期待，提高全价售罄率，并相较百货竞争者减少促销对利润的侵蚀。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP014
      - number: '3.3'
        title: 分销能力、转换成本与护城河韧性
        blocks:
          - type: paragraph
            body: >-
              评估消费服装护城河的持久性，需要看客户留存、渠道分销控制和抵御快时尚复制的防御壁垒。消费服装本身名义转换成本低、消费者多平台购买倾向高，但 SKIMS
              依靠机构分销合作、高重复补购率和后端履约规模化，建立了防御优势。运营数据显示，SKIMS 的售罄率为 32%，补购率为 68%，明显高于直接同业 Savage X Fenty 的 15%
              补购率，说明自然复购忠诚度较高。运营技术投入和自动化仓储物流还把履约周期缩短了 20%，支撑订单量增长五倍。分销已从数字优先渠道有序扩展到 Nordstrom、Selfridges、Harrods
              等高端百货的批发合作，并增至 18 家永久美国门店。包括 NBA、WNBA、USA Basketball 官方内衣合作，以及多年期 NikeSKIMS
              运动联名在内的高曝光机构合作，构筑了普通塑身衣仿品难以复制的品牌可信度壁垒。
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 商品化、补货瓶颈与竞争风险
        blocks:
          - type: paragraph
            body: >-
              尽管品牌共鸣强劲，SKIMS
              仍面临供应链复杂、库存交付滞后和自有品牌商品化带来的实际竞争弱点。快时尚厂商和大众零售商会迅速复制走红的设计廓形和面料组合，并以入门价格销售，考验价格敏感客户的品牌忠诚度。更严重的是，泳装、男装、家居服和户外服装等产品目录快速扩张，造成严重的库存预测风险。公司过去曾遭遇顽固的供应链中断，季节系列延迟数月，错过核心季节购买窗口。由于
              Spanx、Savage X Fenty 等私营竞争者不公布经审计的单位经济性或渠道层面利润表，面对批发合作方要求时，SKIMS
              的相对盈利韧性仍无法完成基准比较。长期保持竞争距离，取决于产品线超越核心塑身衣后，SKIMS 能否继续维持面料创新和零售生产率。
