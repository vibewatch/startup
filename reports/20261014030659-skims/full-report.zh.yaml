  - id: FE001
    title: 产品架构图
    type: stack
    summary: 支撑 SKIMS 数字优先和零售运营的六层技术、供应链及线下分销架构。
    data:
      layers:
        - label: 消费者触点与数字互动
          detail: 无头电商门店（skims.com）、移动端自适应网站、TikTok Shop 渠道，以及店内 QR 码虚拟排队。
        - label: 商业引擎与交易服务
          detail: 云原生电商基础设施，在高流量发售活动期间保持 99.9% 的平台可用性。
        - label: 履约与仓库自动化
          detail: 自动化物流设施可应对 5x 订单激增，配有自动传送带分拣和 2 小时配送路径规划。
        - label: 数据智能与 CRM 系统
          detail: 数据分析和忠诚度平台推动 35% 的复购率，并持续建立库存补货模型。
        - label: 全球采购与制造网络
          detail: 分散式生产网络覆盖土耳其、斯里兰卡、意大利和美国的 100+ 家经审核供应商。
        - label: 纺织研发与材料工程
          detail: 专有弹性纤维和聚酰胺纺织混纺（Fits Everybody、Seamless Sculpt），以及专门的色号匹配染色配方。
    approximationNotes: null
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE009
      - CE011
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 梳理客户从社交媒体初次发现、候补名单发售，到核心品类补货和生活方式扩张的旅程。
    data:
      items:
        - label: 阶段 1：病毒式发现与社交漏斗顶端
          summary: Awareness driven by Kim Kardashian's 360M+ organic social reach, creator seeding, and cultural moments.
          touchpoints:
            - TikTok 试穿短片
            - Instagram Stories 和 Reels
            - 快闪体验店
        - label: 阶段 2：候补名单互动与发售日紧迫感
          summary: Urgency generated by timed capsule countdowns, SMS/email alerts, and limited initial inventory runs.
          touchpoints:
            - 候补名单邮件订阅
            - SMS 发售倒计时提醒
            - 上线日网站发售
        - label: 阶段 3：尺码信心与首次购买
          summary: Conversion facilitated by XXS-5X inclusive sizing, 9 skin-tone shades, and UGC sizing guides.
          touchpoints:
            - 在线尺码计算器
            - 面料和弹性说明
            - UGC 试穿视频合集
        - label: 阶段 4：补货与核心购买习惯形成
          summary: Recurring purchasing centered on everyday essentials like Fits Everybody underwear and bralettes.
          touchpoints:
            - 到货提醒
            - 自动补货提醒
            - 多件套装折扣
        - label: 阶段 5：跨品类扩张
          summary: Expansion of customer share-of-wallet into loungewear, slip dresses, swimwear, and performance menswear.
          touchpoints:
            - 精选跨品类邮件
            - 季节性胶囊系列发售
            - 送礼及节日套装
        - label: 阶段 6：全渠道与线下门店触点
          summary: >-
            In-person touchpoints through permanent retail stores, luxury wholesale concessions, and sports league
            tie-ins.
          touchpoints:
            - 18 家美国永久零售门店
            - Nordstrom 和 Saks 专柜
            - 全球零售快闪店
    claimRefs:
      - CU007
      - CU008
      - CU013
