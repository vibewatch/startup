  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与买方画像
        blocks:
          - type: paragraph
            body: >
              SKIMS 按不同使用场景构建客户架构，而非沿用传统人口统计边界，因此覆盖 Z 世代、千禧一代和 X 世代消费者。核心客户最初来自女性解决型服装；品牌以九种不同裸色和 XXS 至 5X
              的包容尺码、严格统一定价形成差异化。这一定位消除了长期存在的合身焦虑，让品牌成为普适工具，而不是束缚性服装。随着时间推移，采用迅速转向日常舒适和家居服；Soft Lounge Long Slip
              Dress、Fits Everybody 内衣系列等产品，把场景型买家转化为高频补购客户。


              2023 年底正式推出男装后，客户版图明显扩大。在此之前，男性已占现有买家超过 10%，主要购买礼品或中性家居服。SKIMS
              推出专门的弹力棉平角裤、背心和运动打底层，并借助高曝光体育联赛合作，扩大了家庭钱包份额。同时，Nordstrom、Saks Fifth Avenue、Selfridges 和 Galeries Lafayette
              的实体批发专柜吸引了希望先触摸面料再购买的高收入及客流消费者，成功降低对数字获客的依赖。
