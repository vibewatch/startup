      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本不能验证门店经济性
            body: $225 million 融资为扩张提供资金，但没有披露门店贡献利润率、租赁敞口或现金转化；投资批准仍应以这些运营数据为前提。
            calloutType: risk
            claimRefs:
              - CR001
