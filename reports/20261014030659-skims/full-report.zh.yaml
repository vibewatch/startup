        blocks:
          - type: paragraph
            body: >
              SKIMS 的客户采用轨迹，把名人带来的漏斗顶层分发与严谨的限量发售机制结合起来。2019 年 9 月首发当天，超过 600,000 名客户涌入数字店铺，品牌在十分钟内创造 $2 million
              收入。疫情期间舒适家居服需求增长，进一步推动获客；仅 2021 年第四季度就新增 400,000 名净客户，活跃买家到 2022 年底已超过 200 万。


              客户持久性的关键引擎，是从一次性炒作发售转向常青补购。每周限量新品制造社交热度，累计候补名单报名超过 11 million；Edited 的零售分析显示，SKIMS 的补购率为 68%，售罄率为
              32%。这一指标明显高于 Savage X Fenty（15% 补购）和 Aerie（43% 补购）。通过持续经营 Seamless Sculpt、Fits Everybody 等稳定面料平台，SKIMS
              培养了规律复购习惯，推动年收入运行率迈向 $1 billion，并支撑 $5 billion 私募估值。
