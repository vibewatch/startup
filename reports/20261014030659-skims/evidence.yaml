evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Audited capitalization table detailing equity ownership percentages, voting share classes, liquidation
      preferences, and secondary transaction history across founders and institutional investors.
    whyItMatters: >-
      Understanding economic returns, control rights, and potential valuation ratchets is essential to evaluate the
      risk-reward profile of the $5 billion Series D valuation.
    diligencePath: >-
      Request the complete corporate cap table and shareholder rights agreement from company counsel or lead investor
      Goldman Sachs Alternatives under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: executive-roster-and-board-composition
    missingEvidence: >-
      Official verified roster of board of directors members, independent committee chairs, and comprehensive executive
      compensation structure.
    whyItMatters: >-
      Independent governance oversight is critical to mitigate key-person dependence on celebrity co-founders as the
      company prepares for a potential public offering.
    diligencePath: Review formal corporate board minutes and governance disclosures during pre-IPO confirmatory diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-breakdown
    missingEvidence: >-
      Audited breakout of net sales and gross margins by individual product category (shapewear vs underwear vs
      loungewear vs menswear).
    whyItMatters: >-
      Without product-level revenue and contribution margin data, exact TAM penetration and category-level unit
      economics cannot be verified independently.
    diligencePath: Request audited management accounts or pre-IPO S-1 filing segment disclosures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: international-store-economics
    missingEvidence: >-
      Four-wall retail store economics, lease obligations, and sales per square foot across new permanent
      brick-and-mortar locations.
    whyItMatters: >-
      As the company shifts toward becoming a predominantly physical retail business, store-level profitability will
      govern long-term margin durability.
    diligencePath: Review retail lease filings, commercial real estate tracking reports, and partner disclosures.
    relatedQuestionRefs: []
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Audited competitor gross margin benchmarks and wholesale unit economics comparing SKIMS wholesale margins with
      department store incumbents like Spanx and Maidenform.
    whyItMatters: >-
      Prevents conclusive underwriting of long-term operating margin resilience when wholesale and physical retail store
      count expand.
    diligencePath: >-
      Request audited channel-level margin breakdowns, wholesale discount schedules, and store-level contribution margin
      data during management diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP income statements, cash flow statements, and balance sheets disclosing SKU-level margins, operating
      cash burn, and store buildout lease commitments.
    whyItMatters: >-
      Without audited financial disclosures, EBITDA margins and profitability assertions rely on management commentary
      and secondary analyst estimates that cannot be independently audited for institutional underwriting.
    diligencePath: >-
      Request confidential Phase-2 financial diligence data room access, including audited annual financial reports from
      independent auditors and store-level 4-wall margin contribution models.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-testing-certifications
    missingEvidence: >-
      Independent textile performance test reports, fabric breathability ratings, tensile stretch durability
      certifications, and audited toxic chemical compliance documentation (such as OEKO-TEX Standard 100).
    whyItMatters: >-
      SKIMS markets advanced proprietary textile blends (Fits Everybody, Seamless Sculpt), but technical claims rest
      entirely on company marketing and consumer perception without independent lab corroboration.
    diligencePath: >-
      Request OEKO-TEX certifications, supplier audit reports, and technical laboratory tensile/wash test results from
      SKIMS sourcing team.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public developer-signal metrics, open-source repositories, or developer API documentation for e-commerce and
      retail systems.
    whyItMatters: >-
      As a private consumer apparel enterprise, SKIMS does not maintain a public software developer portal or
      third-party developer ecosystem, relying on closed enterprise SaaS solutions.
    diligencePath: >-
      Inspect enterprise vendor deployment case studies (e.g. cloud hosting, headless e-commerce, and logistics
      automation partners) during management interviews.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-retention-cohorts
    missingEvidence: >-
      Audited cohort-level repeat purchase rates, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and
      customer lifetime value across DTC and retail channels.
    whyItMatters: >-
      Without verified cohort retention metrics, customer durability and repeat-purchase habituation cannot be audited
      independently from top-of-funnel celebrity marketing spend.
    diligencePath: >-
      Request audited customer cohort retention tables, repeat purchase frequencies by product category, and customer
      acquisition cost (CAC) payback periods during pre-IPO financial diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: >-
      Complete catalog of wholesale distribution concessions, specialty boutique accounts, and corporate co-branding
      contracts worldwide.
    whyItMatters: >-
      While flagship department stores and major sports leagues are documented, the full breakdown of international
      retail accounts and franchise economics remains private.
    diligencePath: Obtain master wholesale accounts ledger and international distributor agreements in physical retail audit.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-security
    missingEvidence: >-
      Primary regulator, court, recall, certification, claims-substantiation, privacy, security, outage, and incident
      records.
    whyItMatters: >-
      Without primary records, likelihood, mitigation maturity, and residual exposure cannot be verified and absence of
      a cited incident cannot be treated as proof of a clean record.
    diligencePath: >-
      Obtain counsel memoranda, litigation and claims schedules, product test files, recall history, privacy
      assessments, penetration tests, incident logs, and cyber-insurance materials.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-and-store-economics
    missingEvidence: >-
      Audited financial statements, store-level contribution margins, lease commitments, inventory reserves, cash burn,
      and working-capital schedules.
    whyItMatters: >-
      The physical-retail strategy can destroy value despite strong reported sales if stores, inventory, and leases
      consume cash faster than expansion generates contribution.
    diligencePath: >-
      Review monthly financials, cash conversion, store cohorts, lease abstracts, inventory aging, markdowns, supplier
      terms, and the board-approved downside plan.
    relatedQuestionRefs:
      - QR006
      - QR008
      - QR010
  - type: private-evidence-only
    severity: material
    topic: partner-and-founder-mitigation
    missingEvidence: >-
      Succession plans, founder commitment terms, franchise agreements, wholesale economics, and NikeSKIMS licensing and
      launch-governance provisions.
    whyItMatters: >-
      Public evidence identifies counterparties and roles but does not establish termination rights, economics, control
      mechanisms, or continuity if a founder or partner disengages.
    diligencePath: >-
      Review founder employment and IP agreements, succession plans, franchise and wholesale contracts, licensing terms,
      launch acceptance criteria, and partner concentration.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR010
  - type: private-evidence-only
    severity: material
    topic: financial-auditing
    missingEvidence: Audited financial statements confirming revenue recognition, true gross margins, cash burn, and net profitability.
    whyItMatters: >-
      Without audited financial statements, investors cannot verify whether reported top-line figures reflect
      sustainable unit economics or one-time inventory and marketing effects.
    diligencePath: >-
      Request audited GAAP financial statements and auditor management letters under non-disclosure agreement during
      formal confirmatory diligence.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Detailed capitalization table detailing liquidation preferences, senior participation rights, and secondary
      transaction discounts.
    whyItMatters: >-
      Senior liquidation preferences from late-stage investors such as Goldman Sachs Alternatives could compress common
      and early equity returns in downside or flat-exit scenarios.
    diligencePath: Obtain the fully diluted cap table and investor rights agreement directly from company counsel.
