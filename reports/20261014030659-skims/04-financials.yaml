    - 5 - 10 estimated
    - medium
    - Determines shipping leverage and contribution margin per customer shipment
    - Request full unaggregated transaction logs from e-commerce checkout
  - - Customer Retention (15-month)
    - 14% reported
    - medium
    - Validates repeat purchase cadence across product category expansions
    - Audit cohort-based retention matrices and repeat purchase frequency curves
  - - Adjusted EBITDA Margin
    - '>23% projected (2023)'
    - medium
    - Indicates operating profitability prior to physical store lease ramp
    - Request audited historical financial statements and EBITDA bridge reconciliations
  - - Store 4-Wall Payback Period
    - Undisclosed / null
    - low
    - Crucial for assessing capital risk in 18+ store retail expansion plan
    - Obtain individual lease agreements, capex buildout audits, and 4-wall store P&Ls
  notes: Unit economics metrics reflect disclosures in trade reports and financial press; null store payback figures highlight lack of public 4-wall store data.
