callouts:
- calloutType: insight
  title: Direct-to-Consumer Core Enables Full-Price Sell-Through and Marketing Leverage
  body: SKIMS achieves exceptional marketing leverage by directing over half of its marketing budget into high-impact brand campaigns and cultural moments rather than transactional performance ads. This brand equity drives a 32 percent sell-out rate and 68 percent replenishment rate, enabling the company to maintain high full-price realization while scaling digital gross merchandise value past 27 million.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI011
- calloutType: risk
  title: Physical Retail Buildouts and Channel Expansion Expose Margins to Fixed Overheads
  body: As SKIMS expands its retail footprint across 18 company-owned stores and international doors, its operating cost structure shifts toward fixed store leases, retail staffing, and inventory commitments. Combined with fierce competition from incumbents like Lululemon, physical retail expansion introduces execution and margin compression risks that cannot be audited from public sources alone.
  claimRefs:
  - CI003
  - CI012
  - CI014
