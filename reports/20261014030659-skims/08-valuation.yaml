callouts:
  - calloutType: "recommendation"
    title: "Investment Decision Implication"
    body: "Maintain a research-more stance on SKIMS equity at the current five billion dollar valuation mark. While the brand has established genuine category leadership and achieved rapid top-line expansion toward one billion dollars, the valuation implies a five-times revenue multiple that leaves minimal margin of safety without audited financial statements, verified gross margins, and clear liquidation preference terms."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
  - calloutType: "risk"
    title: "Downside Thesis Triggers"
    body: "Downside triggers that would prompt an immediate avoid recommendation include celebrity fatigue or controversy surrounding Kim Kardashian, margin compression resulting from high-cost standalone retail leases in prime metropolitan markets, and supply-chain bottlenecks during accelerated international rollouts."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
