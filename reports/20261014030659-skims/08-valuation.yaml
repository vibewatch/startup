company:
  name: "SKIMS"
chapter:
  number: 8
  title: "Valuation"
  summary: "SKIMS reached a $5.0 billion valuation in its November 2025 Series D round, representing an implied 5.0x revenue multiple against projected 2025 net sales exceeding $1.0 billion. While category leadership and DTC customer acquisition efficiency remain formidable, an investment recommendation of research-more is warranted due to stretched valuation multiples, high celebrity key-person concentration, escalating retail lease obligations, and the absence of audited financial statements."
sections:
  - id: "valuation-history-and-benchmark"
    title: "Valuation History and Entry Discipline"
    body: "SKIMS completed a $225 million Series D financing round in November 2025 at a $5.0 billion post-money valuation, led by Goldman Sachs Alternatives with participation from funds affiliated with BDT and MSD Partners. This transaction elevated cumulative capital raised to approximately $953 million across six equity rounds, following a $270 million Series C round in July 2023 at a $4.0 billion valuation and a $240 million Series B round in January 2022 at $3.2 billion. Based on projected net sales surpassing $1.0 billion for 2025, the Series D valuation represents an implied enterprise-value-to-sales multiple of roughly 5.0x. By comparison, mature publicly traded apparel and intimates competitors trade at substantially lower revenue multiples: Victoria's Secret and Under Armour maintain a combined market capitalization that SKIMS now exceeds, while Spanx was acquired by Blackstone at a $1.2 billion valuation in 2021. The 5.0x multiple demands sustained hypergrowth and flawless execution across retail expansion, leaving minimal margin of safety for new growth-equity allocations."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
    tableRefs:
      - "TV001"
  - id: "thesis-and-antithesis"
    title: "Core Investment Thesis and Anti-Thesis Balance"
    body: "The positive investment thesis rests on SKIMS' demonstrated category leadership, rapid top-line trajectory, and organic customer acquisition efficiency powered by co-founder Kim Kardashian's cultural reach. Having scaled from an initial shapewear focus in 2019 to over $750 million in 2023 revenue, SKIMS successfully expanded into loungewear, swimwear, menswear, and the NikeSKIMS athletic partnership. Management reported positive operating earnings of approximately $190 million for 2023, indicating healthy underlying cash generation in its direct-to-consumer core. However, the anti-thesis highlights critical structural vulnerabilities that offset these achievements. Growth remains heavily dependent on Kim Kardashian's personal celebrity equity and social media distribution, creating acute key-person risk where brand sentiment shifts could immediately impair demand. Furthermore, the company's aggressive transition toward physical storefronts and international flagships in London and Dubai significantly increases fixed lease obligations, operating overhead, and fulfillment complexity."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
  - id: "scenario-projections"
    title: "Scenario Projections and Return Sensitivities"
    body: "A rigorous scenario framework models three distinct operating trajectories from the late 2025 Series D baseline. In the bull case, probability-weighted at 25%, SKIMS accelerates net sales to $1.4 billion by 2027 as standalone retail flagships and international distribution channels in Europe and the Middle East mature, supporting a 6.5x exit multiple and a $9.1 billion valuation upon a public offering. The base case, probability-weighted at 50%, models revenue stabilizing between $1.0 billion and $1.1 billion with modest margin compression as physical retail overhead grows, resulting in a 4.5x to 5.0x revenue multiple and an enterprise valuation between $4.5 billion and $5.5 billion. In the bear case, probability-weighted at 25%, market saturation in core shapewear, intensified competition from incumbent apparel brands, and supply chain bottlenecks drag net sales below $850 million, compressing multiples to 2.0x to 2.5x and reducing valuation to $1.7 billion to $2.1 billion."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Diligence Framework"
    body: "SKIMS possesses several foundational attributes required for an eventual initial public offering, including institutional governance support from Goldman Sachs Alternatives and Wellington Management, a veteran executive team led by CEO Jens Grede and CFO Andy Muir, and expanding global distribution. Nevertheless, immediate equity commitment is unadvisable prior to comprehensive confirmatory diligence. Public information provides only unaudited top-line assertions and directional margin claims, omitting audited GAAP financial statements, return rates, inventory reserves, and free cash flow conversion. Furthermore, liquidation preference structures and senior participation rights attached to the Series D preferred stock remain undisclosed, leaving common equity recovery vulnerable in downside outcomes. Investors should maintain a research-more stance, tracking four-wall retail unit economics and insisting on complete financial disclosure before endorsing entry at the current $5.0 billion valuation mark."
    claimRefs:
      - "CV013"
      - "CV014"
    figureRefs:
      - "FV001"
