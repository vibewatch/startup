company:
  name: "SKIMS"
chapter:
  number: 7
  title: "Risks"
  summary: "SKIMS has ample recently raised capital and strong reported growth, but its planned shift toward a predominantly physical business compounds store-productivity, inventory, partner, and founder-execution exposure. Public evidence supports those operating risks; it does not establish the company's legal, security, margin, cash-burn, or working-capital position, so those areas remain diligence gaps rather than recorded incidents."
sections:
  - id: "risk-ranking-and-legal-unknowns"
    title: "Risk ranking and legal unknowns"
    body: >-
      The most evidenced risks are execution risks, not a documented legal crisis. SKIMS said the November 2025 financing would support physical retail, international growth, product innovation, and category expansion, while independent coverage described intense athleisure competition and categories that are increasingly standard offerings. That combination puts store productivity, inventory availability, and differentiation above legal exposure in the evidence-based ranking. The assigned pool contains no regulator, court, recall, certification, or incident record, however, so legal, product-safety, advertising, privacy, and security severity cannot be verified. The legal register therefore records exposure and an exact diligence path without implying that a violation or incident occurred.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR011"
      - "CR012"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-and-financial-execution"
    title: "Operational and financial execution"
    body: >-
      The physical-retail pivot increases fixed-cost and working-capital sensitivity at the same time that SKIMS is broadening categories and markets. In 2025 the company reported 18 owned US stores and two franchise doors in Mexico and said it was laying the groundwork to become predominantly physical. A separate June 2025 report described launches across the United States, Mexico, London, and Dubai. Earlier Business of Fashion reporting documented stockouts, disrupted deliveries, and seasonal inventory arriving months late across a global manufacturing network. The recent capital raise is a buffer, not proof that new stores will earn acceptable returns, and the retained sources do not disclose audited margins, burn, or working-capital needs.
    claimRefs:
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR010"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "partner-and-founder-dependencies"
    title: "Partner and founder dependencies"
    body: >-
      SKIMS is expanding through owned stores, franchise doors, wholesale points, and the NikeSKIMS collaboration, so execution quality is partly distributed across counterparties. The 2025 retail profile reported 57 global distribution points and additional franchise and wholesale relationships; it also reported that NikeSKIMS had been delayed because of production issues. Founder concentration is separate from partner concentration. Coverage says Kim Kardashian remains involved in every major creative decision while Jens Grede leads business and distribution, creating a strong division of labor but also a dual key-person dependency. Third-party directories identify a broader operating bench, yet their performance claims are not primary evidence and should not be treated as validated mitigation.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "residual-risk-and-thesis-breaks"
    title: "Residual risk and thesis-breaks"
    body: >-
      The highest residual exposures are a store rollout that does not generate incremental demand, renewed inventory delays during category expansion, and weakening differentiation against larger apparel incumbents. Monitor same-store productivity, store-level contribution margin, inventory aging, in-stock rates, launch slippage, wholesale sell-through, and founder engagement. A sustained decline in store productivity, repeated launch delays, or inventory growth materially ahead of sales would break the execution thesis. A material founder departure without demonstrated succession would break the brand-governance thesis. Because audited profitability and cash-conversion data are unavailable in the assigned evidence, any investment decision should remain conditional on monthly cash flow, inventory reserves, lease commitments, supplier concentration, incident history, and legal representations.
    claimRefs:
      - "CR003"
      - "CR008"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    figureRefs:
      - "FR001"
