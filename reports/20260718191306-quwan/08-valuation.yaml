- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Quwan (implied stale mark)
    - 2023 revenue / profit anchors
    - ≈US$1.05B value; ≈2.3x sales
    - Reference case; scaled China gamer-social platform with positive profit signals
    - Private, stale mark, and under-disclosed versus public peers
  - - Discord
    - Private valuation + user scale
    - ≈US$15B private mark; 200M+ monthly users
    - Best global narrative analog for persistent community + voice
    - Global, much larger, and not a clean China pricing analog
  - - JOYY
    - Public market cap / FY2024 revenue
    - ≈US$3.53B market cap; ≈1.6x revenue
    - Closest listed broader social-entertainment quality benchmark
    - Global multi-product mix and much deeper disclosure
  - - HUYA
    - Public market cap / FY2024 revenue
    - ≈US$0.55B market cap; ≈0.7x revenue
    - Relevant China gaming and live-streaming boundary marker
    - Business mix and profit profile differ; more mature public-market discount
  - - DouYu
    - Public market cap / FY2024 revenue
    - ≈US$0.13B market cap; ≈0.2x revenue
    - Useful lower-end social-gaming boundary marker
    - Loss-making and structurally weaker, so more a floor guardrail than a direct twin
  notes: This comparable set mixes a narrative ceiling, the most relevant listed China social-entertainment comps, and Quwan itself. It is intentionally selective rather than exhaustive.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful private and public social-community comparables for Quwan rather than every global gaming, chat, or livestream platform.
