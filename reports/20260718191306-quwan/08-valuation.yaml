  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current audited financials
    missingEvidence: FY2025 and FY2026 YTD audited or auditor-reviewed financial statements plus current cash, debt, and obligations.
    whyItMatters: The stale unicorn mark cannot be refreshed without current operating and treasury evidence.
    diligencePath: Request management accounts, auditor bridge, treasury pack, and debt schedules.
    relatedQuestionRefs:
    - QV003
    - QV010
    - QV022
  - type: private-evidence-only
    severity: material
    topic: cap-table economics
    missingEvidence: Preference stack, ratchets, liquidation waterfall, employee option dilution, and any primary-secondary split since the failed de-SPAC.
    whyItMatters: Headline valuation may not map cleanly to common-equity returns.
    diligencePath: Review financing documents, updated cap table, and waterfall model.
    relatedQuestionRefs:
    - QV016
    - QV022
  - type: missing-source
    severity: material
    topic: AI commercialization
    missingEvidence: Segmented AI revenue, gross margin, customer logos, and repeat-usage evidence for digital-human, AI voice, AI music, and 3D lines.
    whyItMatters: AI optionality supports only narrative premium today unless monetization is proven.
    diligencePath: Request product-line P&L, bookings data, and enterprise customer proof.
