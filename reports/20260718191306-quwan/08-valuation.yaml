- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  - blocking?
  rows:
  - - Current audited financials
    - FY2025 and FY2026 YTD audited or auditor-reviewed statements
    - The stale mark cannot be refreshed without current revenue, earnings, and cash evidence.
    - Request management accounts, auditor bridge, and board reporting pack.
    - 'Yes'
  - - Treasury and obligations
    - Current cash, debt, guarantees, and off-balance-sheet commitments
    - The failed de-SPAC makes self-funding durability central.
    - Request treasury memo, debt schedules, and covenant summaries.
    - 'Yes'
  - - Cap-table economics
    - Preferences, liquidation stack, ratchets, and secondary/primary split
    - Headline valuation may overstate common-equity economics.
    - Review financing documents and waterfall analysis.
    - 'Yes'
  - - AI commercialization
    - Revenue, margin, and customer mix by AI line
    - Optionality only deserves value if it is economically real.
    - Request segment P&L and customer proof by product.
    - 'Yes'
  - - Listing readiness
    - Current HK listing workstreams, sponsor path, and governance uplift
    - Exit timing is part of the value case for a late-stage private investor.
    - Request banker materials and governance roadmap.
    - Important
  notes: Each item listed here is directly tied to why the current public file supports discipline more than enthusiasm.
