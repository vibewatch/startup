- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - key assumptions
  - indicative value range
  - probability signal
  - what would move it
  rows:
  - - Bull
    - Growth stabilizes or re-accelerates, normalized profitability holds, AI starts contributing economically, and HK listing readiness returns.
    - US$1.25B-US$1.60B
    - Low-medium
    - Needs fresh audited proof plus visible financing momentum.
  - - Base
    - 2023 economics broadly hold, growth is modest, and disclosure improves only partially.
    - US$0.80B-US$1.05B
    - Medium
    - This roughly brackets the stale unicorn mark rather than creating obvious upside.
  - - Bear
    - Traffic or monetization weakens, trust or regulatory costs rise, and the market re-rates Quwan toward HUYA or DouYu-style public bands.
    - US$0.35B-US$0.55B
    - Medium
    - One more failed capital-markets path or visible operating deterioration would likely push value here.
  notes: Ranges are intentionally broad. Public evidence does not support false precision on FX, preferences, or exit timing.
