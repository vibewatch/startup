company:
  name: Quwan
chapter:
  number: 8
  title: Valuation
  summary: 'Quwan’s old HK$8.215 billion de-SPAC mark is not obviously absurd given 2023 revenue of about RMB 3.225 billion, reported net profit of about RMB 947 million, and an adjusted profit anchor around RMB 607 million. The problem is not historical scale; it is freshness and comparability. The financing path that supported the mark failed, current audited disclosure is stale, and listed China social-gaming peers still trade at materially lower revenue multiples. The best public-evidence call is therefore track or research-more: Quwan looks like a real scaled asset with underappreciated profitability, but not yet like a clearly attractive late-stage entry at the stale unicorn mark.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation stays track because the stale unicorn mark is supportable but not yet attractive
  body: 'Quwan does not look obviously broken or obviously overvalued in the way some private social stories did at their peaks. The retained public file supports real product scale, real monetization, and a 2023 profit profile that is stronger than many China-listed live-streaming or social-gaming peers. The old HK$8.215 billion de-SPAC anchor therefore deserves to be treated seriously rather than dismissed. But seriousness is not the same as investability. That price is now stale, the financing route that supported it failed, and current audited 2025-2026 evidence is still missing. The result is a price-sensitive call: at the old unicorn mark, the best recommendation is track or research-more rather than buy. Investors are not being asked to believe in a feature-stage app; they are being asked to accept a private-market premium without enough fresh proof on current revenue durability, current cash, or cap-table terms.'
