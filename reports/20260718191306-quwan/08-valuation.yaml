- id: TV003
  title: Thesis / anti-thesis table
  columns:
  - dimension
  - thesis
  - anti-thesis
  - what would change the view
  rows:
  - - Core asset
    - TT Voice shows scaled gamer-social proof with large registrations, meaningful MAU, and strong payer evidence.
    - Those metrics do not erase concentration risk or guarantee future growth.
    - Show 2024-2026 cohort retention, payer trend, and monetization by room type.
  - - Economics
    - 2023 public evidence shows unusual profitability for a private consumer-social platform.
    - Accounting noise and stale financial disclosure weaken clean underwriting.
    - Provide audited 2025-2026 bridge from revenue to adjusted earnings and cash flow.
  - - AI optionality
    - AI voice, digital-human, music, and 3D products can justify a narrative premium.
    - Commercialization proof still trails product breadth.
    - Disclose bookings, revenue, and gross margin by AI line.
  - - Comp positioning
    - A premium to HUYA and DouYu can be rational if Quwan really is a higher-quality private asset.
    - The old mark already asks investors to pay above listed China social-audio multiples without similar disclosure depth.
    - Close the disclosure gap or price closer to public comps.
  - - Financing path
    - A reopened HK path could restore liquidity and re-validate the old mark.
    - The failed de-SPAC means investors currently rely on a stale mark and unclear financing plan.
    - Show updated listing readiness, banker engagement, and current treasury durability.
  notes: The anti-thesis here is about price, proof, and downside protection rather than denial that Quwan built a real business.
