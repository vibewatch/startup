    - Do not treat the stale unicorn mark as a clear buy on public evidence alone.
  - - Confidence
    - Medium
    - Valuation anchors and comp bands are usable, but current audited disclosure is thin.
  - - Risk rating
    - High
    - Regulation, concentration, platform dependency, and financing opacity can compress the range quickly.
  - - Valuation stance
    - Fair-to-full at HK$8.215B
    - The old mark is defensible, but not obviously cheap relative to listed China peer risk.
  - - Entry discipline
    - Prefer lower price or fresher audited proof
    - Upside at the stale mark is not obviously asymmetric without a stronger diligence package.
  notes: 'This summary is intentionally price-sensitive: the call could improve with either better proof or better entry terms.'
