evidenceGaps:
  - type: missing-source
    severity: material
    topic: 2023 financials
    missingEvidence: A clean working copy of the June 2024 updated HKEX application proof with the full 2023 audited financial tables.
    whyItMatters: >-
      The report can anchor valuation and 2022 history, but later financial underwriting is weaker without the exact
      updated filing text.
    diligencePath: >-
      Obtain the live or archived June 2024 HKEX application proof or a company-provided copy from counsel or sponsor
      records.
    relatedQuestionRefs:
      - QO009
      - QO010
      - QO013
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, investor-rights package, and any surviving preference stack after the failed de-SPAC.
    whyItMatters: Founder control is visible, but governance quality cannot be fully judged without board and rights detail.
    diligencePath: Request the latest cap table, board list, constitutional documents, and any investor side letters.
    relatedQuestionRefs:
      - QO005
      - QO014
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: current user scale
    missingEvidence: A 2025-2026 independent MAU or DAU disclosure for TT Voice.
    whyItMatters: Cumulative registrations overstate live engagement if not paired with active-user metrics.
    diligencePath: Request internal monthly KPI dashboards or more recent filing-grade user metrics.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: conflicting-data
    severity: material
    topic: current valuation status
    missingEvidence: >-
      A definitive company explanation for why the Vision Deal path failed and what financing or listing alternative
      replaced it.
    whyItMatters: >-
      The difference between timing slippage, valuation disagreement, and regulatory friction changes how investors read
      the company today.
    diligencePath: Request management commentary, sponsor correspondence, and post-cancellation financing plans.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO022
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: current market share
    missingEvidence: A 2025-2026 filing-grade statement of Quwan’s MAU, payer count, and share within the mobile voice-social category.
    whyItMatters: Without current share data, market growth cannot be translated into company-specific momentum.
    diligencePath: Request internal KPI dashboards or updated listing materials with current user and payer metrics.
    relatedQuestionRefs:
      - QM015
      - QM025
  - type: private-evidence-only
    severity: material
    topic: serviceable obtainable market
    missingEvidence: Management’s own cohort, genre, and region breakdowns for active users and monetization.
    whyItMatters: >-
      Public TAM and SAM figures overstate what Quwan can actually capture if engagement clusters in a few titles or
      communities.
    diligencePath: Request cohort-level revenue and retention by genre, room type, and payer segment.
    relatedQuestionRefs:
      - QM022
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-model provenance
    missingEvidence: The underlying Frost & Sullivan methodology used in the retained prospectus-style market estimates.
    whyItMatters: The figures are directionally useful but not fully auditable from the retained excerpts alone.
    diligencePath: Obtain the original market-study pages or sponsor deck appendix.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: minor
    topic: non-gaming adoption
    missingEvidence: Independent evidence on how much Quwan’s user base extends beyond gaming into broader interest communities.
    whyItMatters: The broader the use case, the less constrained Quwan is by gaming-cycle maturity.
    diligencePath: Request current room-category mix, time spent, and monetization by community type.
    relatedQuestionRefs:
      - QM017
      - QM018
  - type: missing-source
    severity: material
    topic: peer pricing
    missingEvidence: Stable public pricing grids for Fanbook, KOOK, Bixin, and YY/JOYY relevant to gaming-social community workflows.
    whyItMatters: Without cleaner price cards, it is difficult to compare monetization pressure or buyer ROI across substitutes.
    diligencePath: Request current consumer and creator pricing, room-service fees, and promotional packages from each peer.
    relatedQuestionRefs:
      - QP013
      - QP024
  - type: missing-source
    severity: material
    topic: switching data
    missingEvidence: >-
      Empirical cohort or survey evidence on how often users multi-home across TT Voice, WeChat, Discord-like products,
      and native game voice.
    whyItMatters: Competitive intensity depends on whether community density actually lowers churn.
    diligencePath: Request survey, cohort retention, and friend-graph migration data.
    relatedQuestionRefs:
      - QP009
      - QP022
  - type: private-evidence-only
    severity: minor
    topic: peer economics
    missingEvidence: Comparable payer, ARPPU, and retention data for private Chinese community peers.
    whyItMatters: Scale alone does not show who monetizes best.
    diligencePath: Request channel checks, internal market research, or management benchmarking decks.
    relatedQuestionRefs:
      - QP017
      - QP025
  - type: missing-source
    severity: minor
    topic: Discord feature benchmarking
    missingEvidence: A cleaner retained official Discord feature inventory for this run.
    whyItMatters: Discord is the closest global analog, but the retained feature page was not as descriptive as expected.
    diligencePath: Re-fetch Discord docs/help pages or product posts with better feature granularity.
    relatedQuestionRefs:
      - QP002
      - QP015
  - type: missing-source
    severity: material
