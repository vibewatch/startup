        title: 资本充足性与成本结构：历史上现金足够偏正，但失败的 de-SPAC 拿走了可见缓冲
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开记录显示，截至 2022 年底，Quwan 并不是一家缺现金的消费初创公司。Eastmoney 和 36Kr 都指向约 RMB 935 million 的现金及现金等价物，应收款仅约 RMB 99
              million。这与偏消费者的模型一致：收现快，不深度依赖长应收周期。问题在于新鲜度。de-SPAC 路径本会增加约 HK$576 million 至 HK$610 million 的 PIPE 资本，但
              HKEX 后来披露交易不会推进。因此，当前资本充足性比 2022 年历史快照更不透明。成本结构也在变化。传统 TT Voice 变现显然不是硬件资本开支很重的业务，但 Quwan 披露的研发强度、AI
              模型工作、审核负担，以及 TemPolor 这类 AI 硬件实验，都意味着未来成本需求会比纯语音房业务更复杂。
