      - number: '1.3'
        title: AI 扩张、电竞邻近性与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Quwan 后期身份已不只是「TT Voice 加变现语音房」。公司材料现在主推更宽的 AI 平台叙事，横跨语音、音乐、数字人和 3D 生成。部分说法仍偏营销，但几项产品发布已经足够具体。Tunee 在 2025
              年作为对话式音乐创作智能体上线；TemPolor 作为生成式 AI 吉他硬件产品发布；公司也把 MaskGCT 和 All Voice Lab 定位成带商业意图的真实 AI 语音资产。与此同时，Quwan
              的电竞战略依然重要，因为电竞把社区变成分发。TT Esports 2020 年正式化，TT Voice 成为 LPL、PEL 等中国头部联赛官方合作伙伴，Guangzhou TTG 赢得 2023 年 KPL
              夏季赛冠军。最干净的读法是：Quwan 用游戏语音攒注意力，用电竞加深忠诚度，现在试图借已安装用户基础、内部语音和内容生成能力积累，把自己重新定位为 AI 公司。
