          - type: paragraph
            body: >-
              最可能的上行路径仍是重新上市，或另一轮后期私募融资，并且要受益于更干净的披露；它不是随手发生的战略出售。也就是说，投资者应少谈抽象的品牌喜爱，多看今天哪些材料能让这案子可承销。不可退让的要求包括当前审计财务、当前现金和债务、股权结构表及优先权条款，以及
              AI 在 TT Voice
              之外贡献多少的分部视图。这些不是锦上添花：它们决定旧独角兽标记是还留下上行空间，还是主要在补偿前期投资者。投资逻辑击穿点也很实际。监管或平台访问冲击、变现侵蚀快于预期，或又一条融资路径失败，都会迅速压缩估值区间。反过来，如果管理层证明
              2023 年盈利能力守住了、AI 有真实经济贡献、香港上市准备重回正轨，建议就可以转向更建设性的观察名单姿态。
            claimRefs:
              - CV036
              - CV037
              - CV047
              - CV048
              - CV049
              - CV050
              - CV046
              - CV051
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV036
              - CV050
              - CV018
              - CV046
      - number: '8.5'
        title: 证据展示
        blocks:
          - type: callout
            title: 仅看历史数字，这个估值标记并不虚幻
            body: Quwan 的旧独角兽价值隐含低到中个位数的销售额倍数和低十几倍调整后盈利倍数；它高于中国上市同业，但如果盈利能力和游戏玩家社区质量守住，并不明显失去理性。
            calloutType: strength
            claimRefs:
              - CV030
              - CV031
              - CV032
          - type: callout
            title: 最大问题是证据不够新，而不是没有证据
            body: 投资者能看出 Quwan 做成了一门真实业务。但他们仍看不到足够新的审计细节，无法判断失败 de-SPAC 后的估值标记今天是否仍值得投资。
            calloutType: risk
            claimRefs:
              - CV009
              - CV035
              - CV050
