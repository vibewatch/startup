      - number: '7.2'
        title: 运营、伙伴和商业模式风险会迅速传导到收入
        blocks:
          - type: paragraph
            body: >-
              核心运营风险在于 Quwan 的产品社区属性重，并且始终在线。数千个房间、青年用户暴露、打赏和社交互动，意味着持续的审核、支持和滥用响应需求。公司自己的治理报告称，TT Voice 在 1H24 处理了超过 98
              million 条风险内容，这进一步说明负担已经很大。伙伴和渠道风险同样核心。Tencent 的规模让它成为默认替代品，也构成 Quwan
              无法匹配的周边身份护城河；游戏原生语音或联赛访问变化也会削弱相关性。财务侧，TT Voice 集中意味着冲击没有被充分分散。MAU
              走软、利润率压缩、娱乐线高分成经济性，以及亏损的电竞业务，都说明规模本身不能消除风险。Quwan 的客户基础和收入引擎是真实的，但仍暴露在一组狭窄的平台、习惯和变现循环之下。
