        title: 展示项
        blocks:
          - type: callout
            title: 目标市场小于游戏 TAM，但仍足够大
            body: Quwan 不必赢下「所有社交」才重要。只要变现和留存保持健康，中国游戏和语音社交支出的一个聚焦切片，已经足以支撑一家十亿美元级私营公司。
            calloutType: strength
            claimRefs:
              - CM008
              - CM012
              - CM039
          - type: callout
            title: 最容易的替代风险，是留在 Tencent 或游戏原生语音里
            body: 如果 TT Voice 只是通用语音传输，任何关于 Quwan 的市场论点都会失效。产品必须持续证明，社区、发现和身份比 WeChat 或游戏原生语音里的基础通话更有价值。
            calloutType: risk
