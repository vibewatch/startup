    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、旗舰产品与规模锚点
        blocks:
          - type: paragraph
            body: >-
              Quwan 最适合理解为一家创立于广州的消费科技公司，最初重心是 TT Voice——围绕多人游戏和青年娱乐设计的移动语音社交层。官网如今把平台描述得更宽，覆盖兴趣社交、电竞和 AI 互动产品，但 TT
              Voice 仍是入口资产：它解释了公司的用户图谱、变现习惯和品牌认知。公开证据最扎实的是 2014 年创立、广州运营基地、TT Voice
              在应用商店里作为游戏互动社交平台的定位，以及产品长期累积极大用户数的能力。规模口径需要拆开看：App Store 目前称年轻用户超过 100 million，而 Quwan 2021 年 LPL
              合作文章引用累计注册用户超过 200 million。两者不是同一指标，但合在一起足以支撑判断：TT Voice 成了真正大众化的中国游戏社交资产，而不是小众语音工具。
