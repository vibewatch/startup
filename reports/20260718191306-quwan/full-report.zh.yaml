      - number: '2.3'
        title: 市场为何仍然开放：游戏深度、社区常驻与平台经济
        blocks:
          - type: paragraph
            body: >-
              三股力量让这个市场仍有吸引力。第一，中国移动游戏依然巨大，手机仍是主导游戏形态。光这一点就创造了深厚玩家池，他们需要不离开手机就能完成语音协同和社交发现。第二，电竞和主播式游戏社区把一次性开黑变成反复出现的身份系统；一旦玩家用同一个语音社交平台组队、追战队、社交，网络就能在比赛之间延续。第三，专用社区平台能叠加比一个通话按钮更多的变现场景：打赏、高级身份、创作者工具、房间管理和付费社区权益都可以成立。Discord
              的 Nitro 套餐是这个逻辑的有用全球验证点，尽管 Quwan 自身变现更偏虚拟物品和音频娱乐。Quwan 的 AI 投入还可以靠降低审核和内容生产成本来强化市场，这对一个语音重、UGC 多的环境很关键。
            claimRefs:
