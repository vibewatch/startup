        blocks:
          - type: paragraph
            body: >-
              正面案例很直接。TT Voice 仍展示了少见的消费社交证明：累计注册超过 200 million，在线站点披露的强参与度，约 12.8 million MAU 和 2023 年约 1 million
              付费用户的公开证据，以及超过 RMB 3 billion 的收入基础。Quwan 也不只是纯聊天工具。它有电竞分发可信度，也有覆盖语音、音乐、数字人和 3D 工具的扩展 AI 叙事。反论点同样清楚。收入仍集中在
              TT Voice 相关线，会计噪音扭曲简单利润读数，AI 商业化的公开证据仍落后于产品宽度。最重要的是，旧估值已经要求投资者支付高于 HUYA、DouYu 甚至 JOYY
              式公开倍数的价格，但公司仍没有按上市公司深度披露。问题不是 Quwan 有没有实质；问题是当前价格是否已经资本化了大部分好消息，却把尽调负担留给新投资者，尤其是在资本市场时点不确定之后。
