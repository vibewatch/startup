    title: 客户工作流 / 扩张图
    type: flow
    layout: wide
    summary: Quwan 的客户路径从游戏玩家获客，延伸到公会密度、粉丝圈和选定企业 AI 用例。
    data:
      nodes:
        - id: n1
          label: 获取游戏玩家
          detail: 用户因游戏需求、组队或社交发现进入。
        - id: n2
          label: 加入房间或公会
          detail: 用户进入持续社交场景。
        - id: n3
          label: 变现互动
          detail: 虚拟商品、会员或房主主导服务把参与度转成收入。
        - id: n4
          label: 粉丝圈 / 电竞循环
          detail: 联赛和战队身份加深留存。
        - id: n5
          label: 创作者 / 房主运营层
          detail: 房间运营者带来额外的聚集用户。
        - id: n6
          label: 企业 AI 用例
          detail: 向配音、数字人和 3D 工作流做单独扩张。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n2
          to: n4
        - from: n2
          to: n5
        - from: n5
          to: n3
        - from: n3
          to: n6
