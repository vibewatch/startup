              支出，也会构成同样风险。实际风险姿态因此是中高，而非灾难性：公司可以跑通，但前提是持续在一个很窄区间内执行，让产品信任、监管和变现保持一致。相较投资者通常给宽泛消费互联网叙事的容错带，这个区间紧得多，尤其是对一家仍试图重启资本市场路径的公司。
