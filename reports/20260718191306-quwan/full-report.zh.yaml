      - number: '1.4'
        title: 当前状态、外部认可，以及仍未干净解决的问题
        blocks:
          - type: paragraph
            body: >-
              从外部观感看，Quwan 有几个很强的公开标记。官方帖子称它 2025 年进入 Hurun Global Unicorn Index，2026 年继续留在榜单，并入选 Forbes China 2025 AI
              Technology Top 50。问题不是没有可见度，而是认可与可承销透明度之间有落差。Vision Deal 流程给出了隐含独角兽估值和部分融资叙事，但路径最终失败，HKEX 之后披露交易不会继续。这使
              Quwan 成为一家有真实规模、也有真实盈利历史的私营公司，但公开形象仍由上市申请尝试、自我描述和中国财经二级报道过滤。后续尽调最主要未解问题是：2023 年之后当前财务轨迹到底如何，董事会和控制权具体安排，AI
              业务相对 TT Voice 的经济性，以及公司能否把周期性的资本市场可见度，变成持久、更干净的披露画像。
