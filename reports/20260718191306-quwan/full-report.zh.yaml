  - id: TV003
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 核心资产
        - TT Voice 用大规模注册、可观 MAU 和强付费证据，证明玩家社交已经跑出规模。
        - 这些指标抹不掉集中度风险，也不保证未来增长。
        - 拿出 2024-2026 年队列留存、付费用户趋势，以及按房间类型拆分的变现数据。
      - - 经济性
        - 2023 年公开证据显示，一个私人消费社交平台具备少见的盈利能力。
        - 会计噪音和过期财务披露削弱了干净投资判断。
        - 提供 2025-2026 年经审计的收入到调整后盈利、现金流桥接。
      - - AI 期权
        - AI 语音、数字人、音乐和 3D 产品可以支撑叙事溢价。
        - 商业化证据仍落后于产品宽度。
        - 按 AI 业务线披露订单、收入和毛利率。
      - - 可比定位
        - 如果 Quwan 确实是质量更高的私人资产，相对 HUYA 和 DouYu 溢价可以成立。
        - 旧估值已经要求投资者在披露深度不及上市公司的情况下，支付高于中国上市社交音频倍数的价格。
        - 补上披露缺口，或把价格贴近公开可比公司。
      - - 融资路径
        - 如果香港路径重启，流动性可能恢复，旧估值也能重新被验证。
        - de-SPAC 失败后，投资者目前只能依赖过期估值和不清晰的融资计划。
        - 拿出最新上市准备度、投行推进情况和当前资金耐久度。
    notes: 这里的反向逻辑关注价格、证据和下行保护，并不是否认 Quwan 已经做出真实业务。
