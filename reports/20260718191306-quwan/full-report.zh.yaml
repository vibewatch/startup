      - number: '2.4'
        title: 约束：替代品、监管、成熟度，以及对估值的含义
        blocks:
          - type: paragraph
            body: >-
              让 Quwan 市场成立的同一组事实，也让这个市场难做。专用游戏社交平台要和 Tencent 的身份栈、游戏内语音，以及最简单的替代方案竞争：用户什么都不多做，继续待在 WeChat 或
              Weixin。监管也重要。游戏相邻社区暴露在中国未成年人规则、内容审核负担，以及对 UGC 社交空间的更广泛监管之下。同时，更大的游戏市场并非全面繁荣；CADPA 自己的 2024
              年拆分显示，部分细分市场下滑，这反驳了「所有游戏永远增长」的天真假设。对投资者的读法是平衡的：市场足够大，可以支撑一个独角兽规模运营商，但 Quwan 能拿到的份额远窄于自上而下的游戏 TAM
              数字。最大未解问题是，de-SPAC 失败之后，Quwan
              当前市场份额和用户质量是否跟上品类增长。这种不确定性重要，因为即使品类自上而下增长，如果最好的用户迁往替代品、付费转化走弱，或监管把社交时长推向低价值形态，平台经济性也可能持平甚至变差。
