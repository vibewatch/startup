      - - 悲观
        - 流量或变现转弱，信任或监管成本上升，市场把 Quwan 重估到 HUYA 或 DouYu 式公开市场区间。
        - US$0.35B-US$0.55B
        - 中
        - 资本市场路径再失败一次，或经营明显恶化，估值大概率会落到这里。
