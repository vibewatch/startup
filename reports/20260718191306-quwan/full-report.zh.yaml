      - number: '2.2'
        title: 买方、用户与付费方：主要是消费者钱包，不是企业预算
        blocks:
          - type: paragraph
            body: >-
              Quwan
              的市场特殊，因为同一个社区里可以同时存在几种经济角色。核心用户是游戏玩家，他们想要比通用聊天应用更低摩擦的组队、协同和陪伴。围绕用户的是第二组角色：房主、公会组织者和娱乐型达人，他们制造可重复到访的场景，从而拉高留存。核心闭环里的主要付费方仍是为虚拟物品和娱乐互动花钱的个人消费者，所以
              Quwan 的收入组合更偏增值服务，而不是软件订阅。品牌和电竞关系重要，但主要是分发、赞助和内容合作，不是经典按席位采购的软件交易。这会影响市场测算：Quwan 的 SAM 不受 CIO
              预算限制，却受消费者付费意愿、审核质量，以及平台在快速变化的游戏社区中保持文化相关性的能力约束。
