  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Quwan（隐含过期估值）
        - 2023 年收入 / 利润锚
        - ≈US$1.05B 估值；≈2.3x 销售额
        - 参照案例；中国玩家社交平台已具规模，并释放正向利润信号
        - 私人公司、估值过期，披露深度不及公开同业
      - - Discord
        - 私人估值 + 用户规模
        - ≈US$15B 私人估值；200M+ 月活用户
        - 持久在线社区 + 语音叙事的最佳全球参照
        - 全球化、规模大得多，也不是中国定价的干净参照
      - - JOYY
        - 公开市值 / FY2024 收入
        - ≈US$3.53B 市值；≈1.6x 收入
        - 更广义社交娱乐赛道里最接近的上市质量基准
        - 全球多产品组合，披露深度也高得多
      - - HUYA
        - 公开市值 / FY2024 收入
        - ≈US$0.55B 市值；≈0.7x 收入
        - 中国游戏和直播边界标尺，参考价值高
        - 业务组合和利润画像不同；成熟公开市场折价更重
      - - DouYu
        - 公开市值 / FY2024 收入
        - ≈US$0.13B 市值；≈0.2x 收入
        - 有用的低端社交游戏边界标尺
        - 亏损且结构更弱，因此更像估值地板护栏，而不是直接孪生样本
    notes: 这个可比组把叙事天花板、最相关的中国上市社交娱乐可比公司和 Quwan 自身放在一起。选择有意取舍，不追求穷尽。
    enumerationScope:
