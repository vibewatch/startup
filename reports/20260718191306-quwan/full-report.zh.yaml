            body: >-
              可比对象给出的信息是要克制。Discord 可以作为叙事上限：它是规模大得多的全球社区平台，月活超过 2 亿，据报道私募估值为 US$15 billion。它能解释投资者为何可能愿意为 Quwan
              的游戏玩家社交定位付费，但不能作为公平定价可比。更重要的是中国上市同业的映射。2026 年 7 月，JOYY 约为往绩收入的 1.6x，HUYA 约 0.7x，DouYu 约 0.2x。用保留下来的 2023
              年收入数据测算，Quwan 过时的私募估值标记约等于销售额的 2.3x，高于中国上市同业；但如果相信利润线和游戏玩家社区定位值得溢价，也不算荒唐。因此场景框架有边界，不是英雄式上行：Quwan
              若向直播同业重新定价，就是悲观价值；2023 年经济性大体守住，就是基准价值；只有增长、AI 商业化和上市准备度一起回归，才有乐观价值。
