companyProfile:
  summary: >-
    Quwan 是一家创立于广州的民营消费科技公司，核心资产是 TT Voice：一个游戏玩家语音社交平台，后来延伸到电竞和不断扩大的 AI 产品栈。公开证据支持 200M+ 累计注册、数十亿 RMB 收入和 2023
    年盈利；香港上市尝试提供了最清晰的外部估值锚。公司在中国游戏社交基础设施里具备战略相关性，但围绕当前审计财务、股权结构经济性以及 AI 在 TT Voice 之外贡献多少，公开承销证据仍不完整。
