  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 相关竞争集比「其他社交应用」更宽
        blocks:
          - type: paragraph
            body: >-
              Quwan 面对的不是一个整齐的同业组。直接要完成的任务 横跨专用游戏社交社区、常驻语音服务器、直播音频娱乐，以及根本不采用专用应用的默认替代。实际中，现状替代从 Tencent
              场景和游戏原生语音开始，因为它们已经拥有身份、联系人图谱和用户注意力。专用替代再至少分成三类：Fanbook 这类社区管理平台，KOOK 这类常驻游戏语音工具，以及 Bixin
              这类游戏相邻陪玩或教练产品。YY、Lizhi 和 JOYY 产品家族这类更宽的音频或娱乐平台也重要，因为它们争夺用户时长、创作者和可变现语音行为，即便功能并不逐项复制 TT Voice。实际含义是，评估
              Quwan 护城河时，要看替代路径，而不只是看一个最接近的对手。也就是说，不同威胁攻击价值链的不同部位：Tencent 攻击身份和便利性，KOOK 与 Discord 攻击社区结构，YY
              类产品攻击可变现语音注意力。
