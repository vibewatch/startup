      - number: '4.2'
        title: 利润率路径与盈利质量：已经盈利，但表观利润需要归一化
        blocks:
          - type: paragraph
            body: >-
              Quwan 的盈利故事真实，但不能天真读取表观利润。公司从 2020 年 RMB 154 million 净亏损、2021 年 RMB 2.496 billion 净亏损，转为 2022 年 RMB 509
              million 盈利和 2023 年约 RMB 947 million 报告利润。不过，2021 年和 2023
              年都包含与优先股或估值变化相关的大额公允价值变动，这意味着某些时点的报告净利润高估了干净经营趋势。更新的 2024 年文章明确称，2023 年调整后净利润约 RMB 607
              million，明显低于报告数。毛利率也从 2020 年 65.0% 压缩到 2022 年 54.2%，即便规模在扩大，说明变现增长不会自动转化为更高的增量盈利能力。正确结论是，Quwan
              已证明模型能产生利润，但投资者应承销归一化利润，而不是只看法定口径的表观线。
