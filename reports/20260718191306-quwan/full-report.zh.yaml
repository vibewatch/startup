  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先划边界：Quwan 不是整个社交互联网
        blocks:
          - type: paragraph
            body: >-
              给 Quwan
              估市场，最错误的做法是把它叫作「社交网络」，然后继承整个中国社交媒体支出池。更紧、更有用的市场定义，是以游戏和相邻娱乐行为为中心的消费级移动语音社交网络。这个边界包括多人协作、常驻语音房、公会或队伍式社区、房内打赏，以及创作者带动的社交娱乐。它排除大多数企业协作、WeChat
              的全通用消息场景，以及大部分纯视频直播——在这些场景里，语音房身份不是互动中心。边界定好之后，市场仍然很大。CADPA 2024 年报告显示，中国广义游戏市场为 RMB 325.8 billion，移动游戏为
              RMB 238.2 billion，电竞游戏为 RMB 142.9 billion。保留下来的招股书报道进一步收窄相关邻近市场，估算 2022 年中国移动语音社交市场为 RMB 25.2
              billion，同年移动游戏用户社交网络细分为 RMB 16.8 billion。
