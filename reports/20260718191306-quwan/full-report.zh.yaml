    title: 客户
    sections:
      - number: '6.1'
        title: 核心客户基础：中国年轻玩家和房间型社区
        blocks:
          - type: paragraph
            body: >-
              Quwan 的客户证明在核心消费者基础上最强。TT Voice 明确瞄准中国玩家：他们想要更快组队、常驻语音房，以及一层在赛前赛后延续的社交关系。当前 52tt 网站称累计注册用户超过 200
              million，超过 90% 用户属于新世代人群，平均日使用时长达到 181 minutes，并围绕主流游戏和 24 小时房间优化。独立招股书式报道补充了更具体的用户群组细节：截至 2022
              年底，服务据称拥有超过 21.7 million 注册用户、13.8 million 平均 MAU、约 1.0 million 平均月付费用户，且用户基础中超过 90% 年龄不超过 30 岁。这足以说明 TT
              Voice 不是偶发的边缘社区，而是一个有规模的青年游戏社交网络，拥有清晰习惯和变现行为。
