              公开耐久性数据仍弱，但有几个有用线索。最说明问题的是：2023 年 MAU 据称降至约 12.8 million，而平均月付费用户保持在约 1 million。这个模式可能意味着核心变现用户群组
              比边缘流量更有韧性，也可能意味着平台更依赖一个更小的付费基础。扩张更像飞轮扩张，而非合同扩张：Quwan 从消费者扩到公会和粉丝社区，再选择性进入 AI 企业工作流。集中风险高。公开收入绝大多数仍来自 TT
