  - id: FU002
    title: 采用漏斗 / 参与度区间
    type: range
    layout: wide
    summary: 公开用户证据在累计注册、MAU、付费用户和日均使用时长上最强。
    data:
      items:
        - label: 注册
          low: 21.7
          mid: 100
          high: 200
          unit: M users
          detail: 独立 2022 年文章、App Store「100M+ 年轻用户」式说法， 以及当前官方 200M+ 说法，共同给注册规模设定边界。
        - label: 平均 MAU
          low: 12.8
          mid: 13.3
          high: 13.8
          unit: M users
