            body: >-
              Quwan 并不明显是一家困境公司，但 Vision Deal 交易失败后，风险画像变了。公司失去了一个可见的 PIPE 缓冲和预期中的公开市场融资路径，而最新保留下来的现金余额仍是 2022
              年底数据。这让当前现金跑道 比历史业务轨迹暗示的更不透明。人员风险也重要，因为公司仍由创始人牵引，反复上市尝试意味着财务职能和资本市场执行承压。除此之外，AI 路线图很宽：数字人、配音、AI 音乐、硬件和 3D
              生成都在争夺管理层注意力和技术资源。产品叙事令人兴奋，但公开商业化证据仍落后于产品宽度。风险不只是「AI 可能失败」，而是 Quwan 可能在证明相邻赌注能持续补充 TT Voice
