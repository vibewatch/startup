            body: >-
              主要竞争问题在于，语音传输和社区基础能力已经不稀缺。Discord、KOOK 和 Fanbook 都展示了常驻空间、社区分层或多层互动的某种组合。用户也可以多栖：把 WeChat
              留作身份和协同工具，同时在其他地方加入专门社区。这降低了基础设施层的切换成本，也把防御性向上推到社区密度、创作者供给、重复房间和粉丝文化。定价对锁定帮助不大，因为大多数公开页面以发现为导向，难以直接比较。Tencent
              仍是周边最大的分发力量，游戏发行商或相邻平台也可能持续改进自己的社区工具。因此，Quwan 有真实的细分领先，但护城河在结构上可被挑战。如果用户身份或创作者忠诚度迁移，平台不能依赖价格或协议级锁定把他们留住。
