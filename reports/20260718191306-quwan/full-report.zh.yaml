  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 未成年人 / 隐私执法
        - 正式监管通知或执法行动
        - 任何已确认且涉及未成年人保护、违法内容或非法收集个人信息的处罚
        - 暂停或重置投资判断，直到审阅整改证据。
      - - 平台访问风险
        - 应用商店限制或重大分发中断
        - 在关键平台被移除、暂停，或搜索 / 发现被实质压制
        - 立即下调增长和估值假设。
      - - 流量和变现侵蚀
        - MAU 下滑且付费用户下降
        - MAU 下滑后，付费用户连续两个或以上周期收缩
        - 把集中度风险视为打破投资逻辑，而不是可管理问题。
      - - de-SPAC 失败后的资本压力
        - 需要外部资本，但路径不清
        - 用户或利润率指标走弱时仍需要新融资
        - 提高要求回报，或等待融资路径明朗。
      - - AI 执行过度扩张
        - AI 收入贡献未被证明，支出却上升
        - AI 投入不小，但没有可衡量的订单、使用量或续约
        - 只把 AI 当作期权价值，不计入核心上行空间。
    notes: 这些否决标准把抽象风险落成可跟踪的投前判断检查点。
