  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：围绕 TT Voice 的消费者市场，不是经典订阅 SaaS
        blocks:
          - type: paragraph
            body: >-
              Quwan 的财务模型最好理解为建立在 TT Voice 房间上的消费者变现引擎，而不是干净的 SaaS 订阅业务。最重要的收入线仍是用户付费虚拟物品，以及由房主带动的互动服务。2022
              年这点很清楚：增值服务和音频娱乐分别贡献 74.8% 和 23.6% 收入；2023 年仍很清楚，更新报道称两条与 TT Voice 相连的收入线贡献了 97.7% 收入。这种集中度重要，因为它让 Quwan
              更容易理解，也更容易被压力测试：如果付费转化、房间活跃或虚拟物品需求走软，可公开看到的抵消收入线并不多。公开牵引力仍有意义。收入从 2020 年 RMB 1.49 billion 增至 2022 年 RMB
              3.40 billion，2023 年回落至 RMB 3.225 billion；平均 MAU 从 2022 年 13.8 million 降至 2023 年约 12.8
              million，平均月付费用户据称维持在约 1 million。
