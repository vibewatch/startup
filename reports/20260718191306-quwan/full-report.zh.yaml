    title: 建议逻辑
    type: flow
    layout: wide
    summary: 规模和盈利已有证据支撑，但融资标记老旧、披露不足，因此建议仍偏谨慎。
    data:
      nodes:
        - label: 真实规模：注册量 200M+；数十亿元人民币收入
        - label: 2023 年利润信号为正
        - label: 过时的 HK$8.215B 独角兽估值标记
