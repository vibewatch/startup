            body: >-
              客户图谱比「玩家」更宽。公会和房间运营者在经济上重要，因为他们带来成簇社区和房主带动的互动；官网还明确宣传，为新入驻公会提供 6 个月保护期和 1:1 运营支持。电竞粉丝是另一类用户群体，因为 LPL、PEL 和
              TTG 关系让 Quwan 不仅靠直接游戏协同获得需求，也靠粉丝文化获得需求。公司也有早期证据显示客户扩张超出 TT Voice。官方 AI 和业务页面显示，AI 配音、数字人和 3D
              生成存在企业或机构用例。最强的具名证明仍有限但有意义：Quwan 称其数字人技术已在 Meituan 和 Douyin 场景中活跃，公共部门 AI 助手已用于广州产业政策服务，All Voice Lab 已服务
              30 多个国家的 100 多个影视动画客户。这些规模还不能与 TT Voice 相比，但足以算作生产客户证据，而不是纯概念叙事。
