            body: >-
              公开证据足以勾勒经济性，但不足以闭合。若 2023 年平均月付费用户约 1 million，虚拟物品销售为 RMB 3.107 billion，则按年化计算，平均月付费用户的虚拟物品收入约 RMB
              3,107，或每付费用户每月约 RMB
              259；这还未考虑总额到净额的机制，也未考虑所有付费活动是否在全年均匀分布。这个数字指向一个有意义的消费者支出模型，不是低客单价的休闲社区应用。但关键细节仍缺失：当前现金余额、债务或担保、房主分成率、渠道成本、按用户群组的实际
              ARPPU，以及 AI 产品的真实收入贡献。因此，最佳财务结论是平衡的。Quwan
              看起来像一个已具规模、靠消费者变现、如今盈利的平台，具备真实变现能力。但它也高度集中、部分受会计噪音干扰，并且在前瞻承销最需要的指标上仍披露不足。
