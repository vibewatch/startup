        - FY2025 和 FY2026 YTD 经审计或审计师审阅报表
        - 没有当前收入、盈利和现金证据，过期估值无法刷新。
        - 索取管理账、审计师桥接表和董事会汇报包。
        - 是
      - - 资金与义务
        - 当前现金、债务、担保和表外承诺
        - de-SPAC 失败后，自筹资金耐久度成了核心。
        - 索取资金备忘录、债务明细和财务约束条款摘要。
        - 是
      - - 股权结构经济性
        - 优先权、清算顺序、反稀释调整条款，以及老股 / 新股拆分
        - 名义估值可能夸大普通股经济性。
        - 审阅融资文件和收益分配瀑布分析。
        - 是
      - - AI 商业化
        - 按 AI 业务线拆分的收入、利润率和客户组合
        - 只有经济上真实，期权价值才值得计价。
        - 按产品索取分部 P&L 和客户证据。
        - 是
      - - 上市准备度
        - 当前香港上市工作流、保荐人路径和治理提升
        - 退出时间是后期私人投资者估值逻辑的一部分。
        - 索取投行材料和治理路线图。
        - 重要
    notes: 这里列出的每一项，都直接对应为什么当前公开资料更支持纪律，而不是热情。
