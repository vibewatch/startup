  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议维持跟踪：过期独角兽估值锚有支撑，但还不够有吸引力
        blocks:
          - type: paragraph
            body: >-
              Quwan 并不像某些民营社交故事在高峰期那样明显破裂或明显高估。保留下来的公开文件支持真实产品规模、真实变现，以及一个强于许多中国上市直播或社交游戏同业的 2023 年利润画像。因此，旧的 HK$8.215
              billion de-SPAC 锚点值得认真对待，而不是直接丢开。但认真不等于可投。这个价格现在已经过期，支撑它的融资路径失败，当前经审计的 2025-2026
              证据仍缺失。结果是一个对价格敏感的判断：在旧独角兽估值处，最佳建议是跟踪或继续研究，而不是买入。投资者面对的不是一个功能阶段
              应用；他们被要求接受民营市场溢价，却没有足够新证据证明当前收入耐久性、当前现金或股权结构条款。
