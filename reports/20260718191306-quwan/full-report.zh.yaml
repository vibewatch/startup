  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是第一层风险类别
        blocks:
          - type: paragraph
            body: >-
              Quwan 处在几个高风险交叉点：青年用户占比高的社交互动、游戏相邻使用、UGC、支付和个人信息处理。这一组合在中国带来第一层监管暴露。2021 年防沉迷通知限制未成年人游戏时间并要求实名注册，2024
              年未成年人网络保护条例又对有显著未成年人影响的平台增加了未成年人保护、网络欺凌预防、报告和社会责任等更广泛义务。PIPL 则在合法、必要、透明的个人信息处理上再加一层。这些规则不会自动让 Quwan
              不可行，但会把合规门槛抬得远高于通用工具应用。风险也不只是理论上的。负面报道称 TT Voice
              曾因非法收集个人信息被点名，也曾围绕未成年人消费、退款和账号问题出现投诉集群。对一个语音房产品来说，如果控制失效，这会带来真实的执法、应用商店压力或声誉损害风险。
