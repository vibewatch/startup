- id: where-the-moat-breaks
  title: 'Where the moat breaks: multi-homing, weak price transparency, and incumbent distribution'
  body: The main competitive problem is that voice transport and community basics are no longer rare. Discord, KOOK, and Fanbook all show some combination of persistent spaces, community segmentation, or layered interaction. Users can also multi-home, keeping WeChat for identity and coordination while joining specialized communities elsewhere. That lowers switching cost at the infrastructure layer and pushes defensibility upward into community density, creator supply, repeat rooms, and fandom. Pricing does little to create lock-in because most public pages are discovery-led and not directly comparable. Tencent remains the largest surrounding distribution force, while game publishers or adjacent platforms could keep improving their own community tooling. Quwan therefore has a real niche lead but a structurally contestable moat. If user identity or creator loyalty migrates, the platform cannot rely on pricing or protocol-level lock-in to hold them in place.
  claimRefs:
