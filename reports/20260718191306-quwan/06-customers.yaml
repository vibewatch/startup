- id: beyond-end-users
  title: 'Beyond end users: guilds, esports fans, and early enterprise AI customers'
  body: 'The customer picture is broader than “gamers.” Guilds and room operators are economically important because they bring clustered communities and host-led interaction, and the official site explicitly advertises a six-month protection period with 1:1 operating support for newly onboarded guilds. Esports fans are another cohort because LPL, PEL, and TTG affiliations give Quwan demand through fandom as well as through direct gameplay coordination. The company also has early evidence of customer expansion beyond TT Voice. Official AI and business pages suggest enterprise or institutional use cases in AI dubbing, digital humans, and 3D generation. The strongest named proofs are still limited but meaningful: Quwan says its digital-human technology is already active in Meituan and Douyin scenarios, its public-sector AI assistant has been used for Guangzhou industrial-policy service, and All Voice Lab has served more than 100 film and animation customers across 30-plus countries. These
    do not yet rival TT Voice in scale, but they are real enough to count as production customer evidence rather than pure concept narrative.'
  claimRefs:
  - CU013
  - CU015
  - CU016
  - CU017
