- id: TU005
  title: Customer concentration / channel risk table
  columns:
  - Risk
  - Why it matters
  - Evidence
  - Exact diligence ask
  rows:
  - - TT Voice revenue concentration
    - Most customer monetization still lives inside one product family
    - 2023 revenue-mix disclosure
    - Request stream-level retention and churn by service line.
  - - China geography concentration
    - Macro, policy, or gaming-cycle shocks would hit a concentrated user base
    - Distribution and partnership evidence is China-centric
    - Request overseas user and revenue breakdown, if any.
  - - App-store and platform dependency
    - Mobile access and policy enforcement can shape growth or disruption
    - App stores plus Apple policy evidence
    - Request app-takedown history and platform-policy incident logs.
  - - Complaint / trust escalation
    - Consumer-social products can degrade fast if complaint volume spikes
    - MIIT platform and moderation context
    - Request complaint rates, issue taxonomy, and resolution metrics.
  - - Brand-surface fragmentation
    - Multiple domains can confuse acquisition or trust
    - ttvoice.com parked; 52tt active
    - Request current brand architecture and web-traffic split.
  notes: These risks matter because Quwan’s customer base is community-heavy, mobile-distributed, and not protected by long enterprise contracts.
