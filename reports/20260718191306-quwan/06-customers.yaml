  - FU004
- id: channel-and-trust-risks
  title: Channel and trust risks matter because customer access is mobile and community dependent
  body: 'Quwan’s customers are reachable through multiple surfaces, but the access path is still fragile in a few important ways. The product spans iOS, Android, and Windows, and the 52tt site shows live support operations, which is a positive sign for serviceability. At the same time, app-store dependency and consumer-protection channels matter more here than in enterprise SaaS because customer acquisition depends on mobile distribution and ongoing trust in community quality. Apple’s transparency materials remind investors that app removal is a real governance mechanism, while the MIIT complaint platform shows that Chinese users have formal escalation channels. Even brand-surface fragmentation matters: the current ttvoice.com domain resolves to a parked sale page, while 52tt remains the live product site. None of these facts alone break the customer thesis, but they reinforce the idea that Quwan’s customer base is tightly coupled to platform access, moderation quality, and brand trust.
    That coupling is precisely why customer-quality diligence and platform-risk diligence should be read together, not separately.'
