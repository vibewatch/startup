chapter:
  number: 6
  title: Customers
  summary: 'Quwan’s customer proof is strongest in its core base of young Chinese gamers and room-based communities using TT Voice. Public sources support real scale, meaningful engagement, and a payer base that appears more stable than total traffic. The company also has early enterprise-style customer proof in AI dubbing, digital humans, and public-sector assistants. The main weakness is durability visibility: churn, cohort retention, top-customer concentration, and enterprise contract quality are still largely private.'
sections:
- id: core-consumer-base
  title: 'Core customer base: young Chinese gamers and room-based communities'
  body: 'Quwan’s customer proof is strongest on its core consumer base. TT Voice is clearly aimed at Chinese gamers who want faster team formation, persistent voice rooms, and a social layer that continues before and after the match. The current 52tt site says cumulative registered users exceed 200 million, more than 90% of users belong to the new-generation cohort, average daily use time reaches 181 minutes, and the product is optimized around mainstream game titles and 24-hour rooms. Independent prospectus-style coverage adds more concrete cohort detail: by end-2022, the service reportedly had over 21.7 million registered users, 13.8 million average MAU, about 1.0 million average monthly payers, and a user base where more than 90% were 30 or younger. That is enough to say TT Voice is not an incidental side community, but a scaled youth gaming-social network with distinct habits and monetizing behavior.'
