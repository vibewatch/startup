- id: durability-expansion-and-concentration
  title: 'Durability, expansion, and concentration: enough to bound quality, not enough to close it'
  body: 'Public durability data remain weak, but there are useful hints. The most telling one is that 2023 MAU reportedly fell to about 12.8 million while average monthly payers stayed around 1 million. That pattern can mean the core monetizing cohort is more resilient than marginal traffic, though it could also mean the platform is leaning more heavily on a smaller paying base. Expansion looks more like flywheel expansion than contract expansion: Quwan grows from consumers to guilds and fandom communities, then selectively into AI enterprise workflows. Concentration risk is high. The vast majority of public revenue still comes from TT Voice-linked monetization, the customer evidence is overwhelmingly China-centered, and none of the retained sources disclose churn, NRR, GRR, contract duration, or top-customer concentration. That makes the customer base credible but under-specified for underwriting.'
  claimRefs:
  - CU007
  - CU009
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU034
  - CU033
