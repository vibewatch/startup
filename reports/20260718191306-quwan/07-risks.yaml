- id: mitigation-and-thesis-breaks
  title: Mitigations exist, but several thesis-break triggers remain clearly identifiable
  body: 'There are mitigating facts. Quwan has a real product, meaningful monetization, an active moderation system, and more technical depth than a casual feature clone. But the company still relies on internal discipline more than on external transparency. That means investors should focus on monitorable kill criteria rather than generic caution, and should assume that several seemingly separate issues can stack together quickly rather than appearing one at a time. A formal enforcement action tied to minors protection, illegal content, or personal-information handling would likely be thesis-breaking. So would app-store or channel restrictions that damage growth, or a combination of weaker traffic and the need for higher moderation or AI spend after the failed de-SPAC. The practical risk posture is therefore high-moderate rather than catastrophic: the company can work, but only if it continues to execute within a narrow band where product trust, regulation, and monetization stay aligned.
    That is a much tighter tolerance band than investors usually grant a broad consumer-internet narrative, especially for a company still trying to re-open its capital-markets path.'
