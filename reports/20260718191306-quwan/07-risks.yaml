- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Minors / privacy enforcement
    - Formal regulator notice or enforcement action
    - Any confirmed sanction tied to minors protection, illegal content, or illegal personal-information collection
    - Pause or reset underwriting until remediation evidence is reviewed.
  - - Platform access risk
    - App-store restriction or major distribution interruption
    - Removal, suspension, or material search/discovery suppression on a key platform
    - Rebase growth and valuation assumptions downward immediately.
  - - Traffic and monetization erosion
    - Falling MAU with payer decline
    - Two or more periods of payer shrinkage following MAU decline
    - Treat concentration risk as thesis-breaking rather than manageable.
  - - Capital stress after failed de-SPAC
    - Need for external capital without clear access path
    - New financing needed while user or margin metrics are weakening
    - Increase required return or wait for financing clarity.
  - - AI execution overreach
    - Rising spend without proof of AI revenue contribution
    - Meaningful AI investment but no measurable bookings, usage, or renewals
    - Value AI as option value only, not core upside.
  notes: These kill criteria convert abstract risk into monitorable underwriting checkpoints.
