- id: capital-people-and-execution-risk
  title: Capital, people, and execution risks are elevated by the failed de-SPAC and broad AI ambition
  body: 'Quwan is not obviously a distressed company, but the risk profile changed when the Vision Deal transaction failed. The business lost a visible PIPE buffer and an intended public-markets financing route, while the freshest retained cash balance is still the 2022 year-end figure. That makes current runway more opaque than the historical business trajectory might suggest. People risk also matters because the company remains founder-led and repeated listing attempts imply finance-function and capital-markets execution pressure. On top of that, the AI roadmap is broad: digital humans, dubbing, AI music, hardware, and 3D generation all compete for management attention and technical resources. The product narrative is exciting, but public commercialization evidence still trails product breadth. The risk is not simply “AI may fail”; it is that Quwan could overinvest in adjacent bets before proving that they can sustainably complement TT Voice’s economics.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR025
