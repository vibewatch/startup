- id: leadership-capital-and-corporate-structure
  title: Leadership bench, corporate structure, and capital story
  body: 'The public company story is still founder-led. Media and prospectus-style coverage consistently place Song Ke at the center of strategy, control, and external financing, while Chen Guangyao appears as the operational co-founder-level executive with deep product and TT Voice responsibility. That concentration is not automatically negative, but it means Quwan’s outside-in governance picture is materially weaker than its product or user story. The corporate wrapper is also clearer than many Chinese private tech companies: QCC shows Quwan Holding Limited as a Cayman vehicle registered in Hong Kong in 2021, which aligns with the later Hong Kong listing attempts. Capital-market visibility improves sharply from 2023 onward. Quwan first pursued a traditional Hong Kong IPO, then signed a Vision Deal de-SPAC in December 2023, and refiled the updated application in June 2024. The retained coverage is enough to anchor valuation, PIPE size, and major shareholder names, even if it still leaves
    board rights, preference terms, and cap-table economics largely opaque.'
