- id: status-awards-and-overview-risks
  title: Current status, external recognition, and what still does not resolve cleanly
  body: On headline optics, Quwan has several strong public markers. Official posts say it entered the Hurun Global Unicorn Index in 2025, remained on the list in 2026, and made Forbes China’s 2025 AI Technology Top 50. The problem is not the existence of visibility; it is the gap between recognition and underwriteable transparency. The Vision Deal process supplied an implied unicorn valuation and a partial financing narrative, but the path ultimately failed, with HKEX later disclosing that the transaction would not proceed. That makes Quwan a private company with real scale and real profitability history, yet one whose public profile is still filtered through filing attempts, self-description, and secondary Chinese finance coverage. The main unresolved questions for later diligence are the exact current financial trajectory after 2023, board and control-right specifics, the economics of the AI businesses relative to TT Voice, and whether the company can turn periodic capital-markets visibility
    into a durable, cleaner disclosure profile.
  claimRefs:
