company:
  name: Quwan
chapter:
  number: 1
  title: Company Overview
  summary: Quwan is a Guangzhou-founded private consumer-technology company whose core asset is TT Voice, a large gaming-social voice platform that later expanded into esports and AI products. The strongest retained evidence anchors the 2014 founding, TT Voice user footprint, 2022 financial trajectory, Vision Deal de-SPAC valuation markers, and a 2025-2026 AI repositioning backed by Hurun and Forbes recognition. The key remaining gaps are clean updated 2023 filing access, current board and cap-table rights, and clearer current operating metrics after the failed de-SPAC path.
sections:
- id: identity-platform-footprint
  title: Identity, flagship product, and scale anchors
  body: 'Quwan is best understood as a Guangzhou-founded consumer-technology company whose original center of gravity was TT Voice, a mobile voice-social layer designed around multiplayer gaming and youth entertainment. The official site now describes a broader platform spanning interest-based social networking, esports, and AI interaction products, but TT Voice remains the gateway asset that explains the company’s user graph, monetization habits, and brand recognition. Public evidence is strongest on the company’s 2014 founding, its Guangzhou operating base, the TT Voice app-store positioning as a game-interaction social platform, and the product’s long-running ability to accumulate very large user counts. Scale claims do require nuance: the App Store currently says more than 100 million young users, while Quwan’s 2021 LPL partnership article cited more than 200 million cumulative registered users. Those are not the same metric, but together they support the judgment that TT Voice became
    a genuine mass-market Chinese gaming-social property rather than a niche voice utility.'
