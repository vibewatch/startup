callouts:
- calloutType: strength
  title: The relevant market is smaller than gaming TAM but still large enough
  body: Quwan does not need to win “all social” to matter. A focused slice of China gaming and voice-social spend is already large enough to support a billion-dollar private company if monetization and retention remain healthy.
  claimRefs:
  - CM008
  - CM012
  - CM039
- calloutType: risk
  title: The easiest substitution risk is to stay inside Tencent or native game voice
  body: Any market thesis for Quwan breaks if TT Voice offers only generic voice transport. The product has to keep proving that community, discovery, and identity add more value than basic calls inside WeChat or game-native voice.
