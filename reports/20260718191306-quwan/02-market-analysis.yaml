chapter:
  number: 2
  title: Market Analysis
  summary: 'Quwan operates in a narrower but still meaningful slice of China consumer internet spend: gaming-centered mobile voice-social networking. Broad gaming TAM in China is very large, but the more relevant retained category estimates are a RMB 25.2 billion mobile voice-social market and a RMB 16.8 billion gaming-social market in 2022, both projected to grow materially. The bull case is sustained mobile-gaming and esports intensity plus consumer community monetization; the bear case is substitution by Tencent or native game voice, regulatory drag, and limited public evidence on Quwan’s current category share.'
sections:
- id: market-boundary-and-size
  title: 'Boundary first: Quwan is not the whole social internet'
  body: The wrong way to size Quwan is to call it “social networking” and inherit the entire China social-media spend pool. The tighter and more useful market definition is consumer mobile voice-social networking centered on gaming and adjacent entertainment behavior. That boundary includes multiplayer coordination, persistent voice rooms, guild- or team-like communities, in-room gifting, and creator-led social entertainment. It excludes most enterprise collaboration, the full general-purpose messaging surface of WeChat, and large parts of pure video livestreaming where voice-room identity is not the center of engagement. Once that boundary is set, the market is still large. CADPA’s 2024 report shows China’s broader game market at RMB 325.8 billion, with mobile games at RMB 238.2 billion and esports games at RMB 142.9 billion. Retained prospectus coverage narrows the relevant adjacency further by estimating a RMB 25.2 billion China mobile voice-social market in 2022 and a RMB 16.8 billion
    mobile-game-user social-network segment in the same year.
  claimRefs:
