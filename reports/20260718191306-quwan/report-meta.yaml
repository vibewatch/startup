  foundingLocation: Guangzhou, China
  headquarters: Guangzhou, China
  productSummary: Quwan sells a community-centric consumer platform anchored by TT Voice voice rooms, gamer-social groups, virtual-goods monetization, esports assets under TTG, and adjacent AI products spanning voice, music, digital humans, and 3D generation.
  customerFocus: Primarily Chinese mobile gamers and gaming-adjacent youth communities, plus partners or enterprise users reached through esports and AI product lines.
  businessModel: Consumer monetization through TT Voice virtual goods and host-led interaction services, supplemented by esports partnerships and early-stage AI commercialization.
  stage: Growth-stage private / unicorn
  fundingStatus: The clearest public valuation anchor is the 2024 Vision Deal de-SPAC package at about HK$8.215B implied equity value, but HKEX disclosed in June 2025 that the transaction would not proceed.
