  topStrengths:
    - TT Voice has real scale, strong engagement signals, and durable gamer-social positioning.
    - 2023 public evidence points to multi-billion-RMB revenue and positive normalized profitability.
    - Quwan retains a credible private-market narrative through esports relevance and AI adjacency.
    - A premium to weaker China-listed voice or livestream peers is defensible if current economics still hold.
  topRisks:
    - The stale HK$8.215B mark no longer benefits from an open listing path and may already embed most of the good public news.
    - Revenue remains concentrated in TT Voice-linked monetization lines.
    - China regulatory, platform, and trust-safety risk can impair user access and valuation quickly.
    - Public evidence on current cash, obligations, and AI commercialization remains too thin.
  unresolvedGaps:
    - FY2025 and FY2026 YTD audited financials, including current cash, debt, and obligations.
    - Cap-table preferences, liquidation waterfall, and any post-de-SPAC financing or secondary terms.
    - Product-line economics showing how much AI contributes to revenue and margin today.
    - Current cohort retention, payer quality, and updated MAU / paying-user trajectory.
    - Concrete Hong Kong listing readiness, sponsor path, and governance uplift after the cancelled transaction.
disclaimer: This report is an evidence-constrained public-materials diligence view, not investment advice; private data-room evidence could materially change the valuation call.
