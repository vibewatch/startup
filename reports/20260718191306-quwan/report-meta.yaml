companyProfile:
  summary: Quwan is a Guangzhou-founded private consumer-technology company whose core asset is TT Voice, a gamer-social voice platform that expanded into esports and a widening AI product stack. Public evidence supports 200M+ cumulative registrations, multi-billion-RMB revenue, and a profitable 2023, while Hong Kong listing attempts provide the clearest outside-in valuation anchor. The company looks strategically relevant in China gaming-social infrastructure, but public underwriting evidence remains incomplete on current audited financials, cap-table economics, and how much AI contributes beyond TT Voice.
  foundedDate: '2014-01-01'
  founders:
