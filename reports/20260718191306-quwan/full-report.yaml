      - number: '8.4'
        title: The call can improve, but only if current diligence closes the financing and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The most plausible upside path is still a relisting or another late-stage private financing that benefits
              from cleaner disclosure, not a casual strategic sale. That means investors should focus less on abstract
              brand admiration and more on what would make the file underwriteable today. The non-negotiable asks are
              current audited financials, current cash and obligations, cap-table and preference terms, and a segmented
              view of how much AI contributes beyond TT Voice. Those are not nice-to-haves: they determine whether the
              old unicorn mark leaves room for upside or mainly compensates prior investors. The thesis-break triggers
              are also practical. A regulatory or platform-access shock, faster-than-expected monetization erosion, or
              another failed financing path would compress the valuation range quickly. Conversely, if management proves
              that 2023 profitability held up, AI is economically real, and Hong Kong listing readiness is back on
              track, the recommendation can move toward a more constructive watchlist posture.
            claimRefs:
