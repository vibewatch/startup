      - number: '2.2'
        title: 'Buyers, users, and payers: mostly consumer wallets, not enterprise budgets'
        blocks:
          - type: paragraph
            body: >-
              Quwan’s market is unusual because the same community can contain several economic roles at once. The core
              user is a gamer who wants lower-friction team formation, coordination, and companionship than general chat
              apps provide. Around that user sits a second group of room hosts, guild organizers, and entertainment
              personalities who create repeat destinations and therefore raise user retention. The primary payer in the
              core loop is still the individual consumer spending on virtual goods and entertainment interactions, which
              is why Quwan’s revenue mix skews toward value-added services rather than software subscriptions. Brand and
              esports relationships matter, but mainly as distribution, sponsorship, and content partnerships instead of
              classic seat-based software procurement. This matters for market sizing: Quwan’s SAM is not limited by CIO
              budgets, but it is constrained by consumer willingness to pay, moderation quality, and the platform’s
              ability to remain culturally relevant inside fast-moving game communities.
