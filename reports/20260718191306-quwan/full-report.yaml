  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the first-order risk category
        blocks:
          - type: paragraph
            body: >-
              Quwan operates at the intersection of youth-heavy social interaction, gaming-adjacent usage,
              user-generated content, payments, and personal information handling. That combination creates first-order
              regulatory exposure in China. The 2021 anti-addiction notice limits minors’ gaming time and requires
              real-name registration, while the 2024 minors cyberspace regulation adds broader duties around minors
              protection, cyberbullying prevention, reporting, and social responsibility for platforms with significant
              minor impact. PIPL adds a separate layer around lawful, necessary, and transparent personal-information
              handling. These rules do not automatically make Quwan nonviable, but they raise the compliance bar
              materially higher than for a generic utility app. The risk is not just theoretical. Adverse reporting says
              TT Voice was previously named over illegal personal-information collection and has faced complaint
              clusters around minors spending, refunds, and account issues. For a voice-room product, that creates a
              real risk of enforcement, app-store pressure, or reputational damage if controls fail.
            claimRefs:
