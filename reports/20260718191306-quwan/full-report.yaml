      - number: '4.2'
        title: 'Margin path and earnings quality: profitable, but headline earnings need normalization'
        blocks:
          - type: paragraph
            body: >-
              Quwan’s profitability story is real, but headline earnings cannot be read naively. The company moved from
              a RMB 154 million net loss in 2020 and a RMB 2.496 billion net loss in 2021 to a RMB 509 million profit in
              2022 and an approximately RMB 947 million reported profit in 2023. However, 2021 and 2023 both contain
              large fair-value movements tied to preferred shares or valuation changes, which means reported net income
              overstates the clean operating trend at certain points. The updated 2024 article explicitly said adjusted
              2023 net profit was about RMB 607 million, notably below the reported number. Gross margin also compressed
              from 65.0% in 2020 to 54.2% in 2022 even as scale increased, suggesting that monetization growth did not
              automatically translate into expanding incremental profitability. The right conclusion is that Quwan has
              demonstrated that the model can generate profit, but investors should underwrite normalized earnings, not
              simply the headline statutory line.
