      - number: '4.4'
        title: 'Unit economics and verdict: enough data to bound the model, not enough to underwrite it cleanly'
        blocks:
          - type: paragraph
            body: >-
              Public evidence is enough to sketch the economics but not enough to close them. If 2023 average monthly
              paying users were around 1 million and virtual-goods sales were RMB 3.107 billion, then annualized
              virtual-goods revenue per average monthly payer was roughly RMB 3,107, or about RMB 259 per payer-month,
              before considering gross-to-net mechanics or whether all payer activity was evenly distributed across the
              year. That points to a meaningful consumer-spend model, not a low-ticket casual community app. Yet crucial
              details remain missing: current cash balance, debt or guarantees, room-host take rates, channel costs,
              realized ARPPU by cohort, and the actual revenue contribution of AI products. The best financial verdict
              is therefore balanced. Quwan looks like a scaled, consumer-monetized, now-profitable platform with real
              monetization power. But it also looks concentrated, partly accounting-noisy, and still under-disclosed on
              the metrics most needed for forward underwriting.
