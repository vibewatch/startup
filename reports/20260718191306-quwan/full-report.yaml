      - number: '8.2'
        title: >-
          The thesis is profitable scaled gamer-social proof; the anti-thesis is stale disclosure and too much reliance
          on optionality
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward. TT Voice still shows unusual consumer-social proof: cumulative
              registrations above 200 million, strong engagement claims on the live site, public evidence of about 12.8
              million MAU and around 1 million payers in 2023, and a revenue base above RMB 3 billion. Quwan is also not
              just a pure chat utility. It has esports distribution credibility and a widening AI narrative across
              voice, music, digital-human, and 3D tools. The anti-thesis is equally clear. Revenue remains concentrated
              in TT Voice-linked lines, accounting noise distorts simple profit reads, and public evidence on AI
              commercialization still trails product breadth. Most importantly, the old mark already asked investors to
              pay above HUYA, DouYu, and even JOYY-style public multiples, yet the company still does not disclose with
              public-company depth. The issue is not whether Quwan has substance; it is whether the current price
              already capitalizes most of the good news while leaving the diligence burden with new investors,
              especially once capital-markets timing is uncertain.
            claimRefs:
              - CV010
