      - number: '3.4'
        title: 'Underwriting readthrough: credible leadership inside a niche, not winner-take-all dominance'
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence points to a balanced conclusion. Quwan looks stronger than a small feature
              clone because it has documented scale, league partnerships, and a product identity rooted in China gaming
              culture. At the same time, the market does not exhibit the kind of hard lock-in or exclusive distribution
              that would make competitive displacement remote. Rival platforms show substitute capabilities, JOYY’s
              disclosures show the broader category still wrestles with compliance and monetization quality, and even
              the Discord benchmark is difficult to score precisely with the retained public feature pages. The result
              is a company that appears competitively credible enough to justify a category-leader narrative, but not
              insulated enough to underwrite on monopoly-style assumptions. For investment work, that usually argues for
              valuing Quwan on execution, retention, and monetization quality rather than on a presumed platform
              inevitability. The competitive question is therefore dynamic rather than binary: can Quwan keep deepening
              community behavior faster than substitutes flatten it?
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP028
              - CP029
              - CP032
              - CP033
              - CP036
              - CP037
