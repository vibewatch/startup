      - number: '1.3'
        title: AI expansion, esports adjacency, and milestone record
        blocks:
          - type: paragraph
            body: >-
              Quwan’s later-stage identity is no longer just “TT Voice plus monetized voice rooms.” The company’s own
              materials now push a broader AI platform narrative across voice, music, digital humans, and 3D generation.
              Some of those claims are still marketing-heavy, but several product launches are concrete enough to
              matter. Tunee launched in 2025 as a conversational music-creation agent; TemPolor launched as a
              generative-AI guitar hardware product; the company also positions MaskGCT and All Voice Lab as real AI
              voice assets with commercial intent. At the same time, Quwan’s esports strategy remains important because
              it turns community into distribution. TT Esports was formalized in 2020, TT Voice became an official
              partner of top Chinese leagues such as LPL and PEL, and Guangzhou TTG won the 2023 KPL Summer title. The
              cleanest reading is that Quwan used gaming voice to build attention, used esports to deepen loyalty, and
              is now trying to use that installed base plus internal speech and content-generation know-how to
              reposition itself as an AI company.
