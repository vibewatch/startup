      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The mark is not fantasy-priced on historical numbers alone
            body: >-
              Quwan’s old unicorn value implied a low-to-mid single-digit sales multiple and low-teens adjusted earnings
              multiple, which is richer than listed China peers but not obviously irrational if profitability and
              gamer-community quality hold.
            calloutType: strength
            claimRefs:
