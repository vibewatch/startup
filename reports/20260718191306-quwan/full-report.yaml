      - number: '2.4'
        title: 'Constraints: substitutes, regulation, maturity, and what that means for valuation'
        blocks:
          - type: paragraph
            body: >-
              The same facts that make Quwan’s market real also keep it difficult. Dedicated gaming-social platforms
              compete against Tencent’s identity stack, in-game voice, and the simplest possible substitute: doing
              nothing more than staying on WeChat or Weixin. Regulation matters too. Gaming-adjacent communities are
              exposed to China’s minors rules, content moderation burdens, and broader oversight of user-generated
              social spaces. Meanwhile, the wider games market is not uniformly booming; CADPA’s own 2024 breakdown
              shows some subsegments declined, which argues against naive “all gaming grows forever” assumptions. For
              investors, the readthrough is balanced: the market is large enough to support a unicorn-scale operator,
              but Quwan’s obtainable share is much narrower than top-down gaming TAM figures imply. The biggest
              unresolved question is whether Quwan’s current market share and user quality have kept pace with category
              growth after the failed de-SPAC path. That uncertainty matters because top-down category growth can
              coexist with flat or deteriorating platform economics if the best users migrate to substitutes, if payer
              conversion weakens, or if regulation pushes social time into lower-value formats.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM039
              - CM040
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The relevant market is smaller than gaming TAM but still large enough
            body: >-
              Quwan does not need to win “all social” to matter. A focused slice of China gaming and voice-social spend
              is already large enough to support a billion-dollar private company if monetization and retention remain
              healthy.
            calloutType: strength
            claimRefs:
              - CM008
              - CM012
              - CM039
          - type: callout
            title: The easiest substitution risk is to stay inside Tencent or native game voice
            body: >-
              Any market thesis for Quwan breaks if TT Voice offers only generic voice transport. The product has to
              keep proving that community, discovery, and identity add more value than basic calls inside WeChat or
              game-native voice.
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
              - CM034
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The relevant competitive set is broader than “other social apps”
        blocks:
          - type: paragraph
            body: >-
              Quwan does not face one neat peer group. The direct job-to-be-done spans dedicated gaming-social
              communities, persistent voice servers, live-audio entertainment, and the default substitute of not
              adopting a dedicated app at all. In practice, the status quo starts with Tencent surfaces and game-native
              voice because those already own identity, contact graphs, and user attention. Dedicated alternatives then
              split into at least three classes: community-management platforms such as Fanbook, persistent gaming-voice
              tools such as KOOK, and gaming-adjacent companionship or coaching products such as Bixin. Broader audio or
              entertainment platforms such as YY, Lizhi, and JOYY’s product family matter because they compete for user
              time, creators, and monetized voice behavior even when they do not mirror TT Voice feature-for-feature.
              The practical implication is that Quwan’s moat has to be evaluated against substitute pathways, not just
              against a single closest rival. It also means that different threats attack different parts of the value
              chain: Tencent attacks identity and convenience, KOOK and Discord attack community structure, and YY-like
              products attack monetized voice attention.
            claimRefs:
