chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, flagship product, and scale anchors
        blocks:
          - type: paragraph
            body: >-
              Quwan is best understood as a Guangzhou-founded consumer-technology company whose original center of
              gravity was TT Voice, a mobile voice-social layer designed around multiplayer gaming and youth
              entertainment. The official site now describes a broader platform spanning interest-based social
              networking, esports, and AI interaction products, but TT Voice remains the gateway asset that explains the
              company’s user graph, monetization habits, and brand recognition. Public evidence is strongest on the
              company’s 2014 founding, its Guangzhou operating base, the TT Voice app-store positioning as a
              game-interaction social platform, and the product’s long-running ability to accumulate very large user
              counts. Scale claims do require nuance: the App Store currently says more than 100 million young users,
              while Quwan’s 2021 LPL partnership article cited more than 200 million cumulative registered users. Those
              are not the same metric, but together they support the judgment that TT Voice became a genuine mass-market
              Chinese gaming-social property rather than a niche voice utility.
