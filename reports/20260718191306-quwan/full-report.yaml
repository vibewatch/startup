            body: >-
              The core operating risk is that Quwan’s product is community-heavy and always on. Thousands of rooms,
              youth exposure, gifting, and social interaction imply continuous moderation, support, and abuse-response
              demands. The company’s own governance report, which says TT Voice handled over 98 million risky content
              items in 1H24, reinforces how large that burden already is. Partner and channel risk are also central.
              Tencent’s scale makes it the default substitute and a surrounding identity moat Quwan cannot match;
              game-native voice or changing league access can also chip away at relevance. On the financial side,
              concentration in TT Voice means shocks are not well diversified. MAU softness, margin compression, heavy
              sharing economics in entertainment lines, and a loss-making esports business all show that scale alone
              does not eliminate risk. Quwan’s customer base and revenue engine are real, but they remain exposed to a
