        - Show 2024-2026 cohort retention, payer trend, and monetization by room type.
      - - Economics
        - 2023 public evidence shows unusual profitability for a private consumer-social platform.
        - Accounting noise and stale financial disclosure weaken clean underwriting.
        - Provide audited 2025-2026 bridge from revenue to adjusted earnings and cash flow.
      - - AI optionality
        - AI voice, digital-human, music, and 3D products can justify a narrative premium.
        - Commercialization proof still trails product breadth.
        - Disclose bookings, revenue, and gross margin by AI line.
      - - Comp positioning
        - A premium to HUYA and DouYu can be rational if Quwan really is a higher-quality private asset.
