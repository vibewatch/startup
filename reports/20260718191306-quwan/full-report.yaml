              Quwan does not look obviously broken or obviously overvalued in the way some private social stories did at
              their peaks. The retained public file supports real product scale, real monetization, and a 2023 profit
              profile that is stronger than many China-listed live-streaming or social-gaming peers. The old HK$8.215
              billion de-SPAC anchor therefore deserves to be treated seriously rather than dismissed. But seriousness
              is not the same as investability. That price is now stale, the financing route that supported it failed,
              and current audited 2025-2026 evidence is still missing. The result is a price-sensitive call: at the old
              unicorn mark, the best recommendation is track or research-more rather than buy. Investors are not being
              asked to believe in a feature-stage app; they are being asked to accept a private-market premium without
              enough fresh proof on current revenue durability, current cash, or cap-table terms.
            claimRefs:
