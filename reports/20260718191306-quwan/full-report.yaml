      - number: '2.3'
        title: 'Why the market remains open: gaming depth, community persistence, and platform economics'
        blocks:
          - type: paragraph
            body: >-
              Three drivers keep the market attractive. First, China mobile gaming is still enormous, and mobile remains
              the dominant gaming form factor. That alone creates a deep pool of players who need voice coordination and
              social discovery without leaving their phones. Second, esports and streamer-style game communities turn
              one-off game sessions into recurring identity systems; once players use the same voice-social platform to
              squad up, follow teams, and socialize, the network can persist between matches. Third, dedicated community
              platforms can stack more monetization surfaces than a simple call button: gifting, premium identity,
              creator tools, room management, and paid community perks all become possible. Discord’s Nitro offering is
              a useful global proof point for that logic even though Quwan’s own monetization has skewed more toward
              virtual items and audio entertainment. Quwan’s AI investment can reinforce the market by lowering
              moderation and content-production costs, which matters in a voice-heavy, user-generated environment.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM029
              - CM030
              - CM031
              - CM024
              - CM032
          - type: table
            tableRef: TM004
            claimRefs:
