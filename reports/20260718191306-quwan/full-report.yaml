      - number: '8.3'
        title: Public comps and scenario work bound the range more tightly than the unicorn label does
        blocks:
          - type: paragraph
            body: >-
              The comparable set argues for discipline. Discord is useful as a narrative ceiling: a much larger global
              community platform with over 200 million monthly users and a reported US$15 billion private valuation. It
              helps explain why investors might pay for Quwan’s gamer-social identity, but it is not a fair pricing
              comp. The China-listed read-through matters more. JOYY traded around 1.6x trailing revenue in July 2026,
              HUYA around 0.7x, and DouYu around 0.2x. Quwan’s stale private mark works out to roughly 2.3x sales using
              retained 2023 revenue, which is above the listed China peer set but not absurd if one believes the profit
              line and gamer-community positioning deserve a premium. That creates a bounded scenario frame rather than
              a heroic one: bear value if Quwan re-rates toward streaming peers, base value if 2023 economics broadly
              hold, and bull value only if growth, AI commercialization, and listing readiness all reappear together.
