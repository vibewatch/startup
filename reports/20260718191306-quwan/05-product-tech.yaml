company:
  name: Quwan
chapter:
  number: 5
  title: Product & Technology
  summary: 'TT Voice is still Quwan’s one clearly proven product: a scaled gaming-social voice platform with app-store distribution, esports-linked identity, and established consumer monetization. What makes the company more unusual is the breadth and visibility of its newer AI stack, including public technical artifacts around MaskGCT and a growing set of AI music, dubbing, digital-human, and 3D products. The opportunity is that Quwan may be evolving from one app into a broader interaction platform; the risk is that public proof of commercial maturity, reliability, and security lags the breadth of the roadmap.'
sections:
- id: ttvoice-core-workflow
  title: TT Voice remains the proven core product
  body: 'The product foundation is still TT Voice: a gaming-centered mobile voice-social platform built around rooms, team-up behavior, and identity-rich communities rather than one-off calls. That is the one product with clear mass-market proof, app-store distribution, historical monetization, and esports-linked brand reach. The user workflow is straightforward but economically rich: enter a room, find teammates or companions, talk, socialize, and then spend on status or interaction goods. Distribution across mobile and Windows suggests the company wants TT Voice to follow users across the environments where game coordination happens, but the product remains consumer-led rather than enterprise-led. The importance of LPL, PEL, and TTG to product understanding is that they reinforce the use case: TT Voice is not a generic chat utility, but a gaming-native social layer where community and competition feed each other.'
