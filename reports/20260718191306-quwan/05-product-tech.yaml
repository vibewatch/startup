- id: trust-safety-and-technical-verdict
  title: Trust, safety, and quality controls are visible but not enterprise-grade transparent
  body: 'The strongest visible control surface is content governance. TT Voice published a governance report saying it processed more than 98 million risky information items in the first half of 2024, which at minimum proves that moderation is an active operating system rather than an afterthought. That matters because voice rooms, youth-heavy communities, and user-generated social interactions are especially exposed to abuse, gambling, fraud, and privacy risk. The weaker side of the record is classic external technical assurance. Retained public sources do not show a mature trust center, hard uptime evidence, or detailed latency and reliability reporting for TT Voice or the new AI tools. The best product-tech verdict is therefore balanced: Quwan has one clearly proven core product, credible AI engineering artifacts, and a broad roadmap, but it still lacks the external reliability and security transparency that would make the newer stack easy to diligence at institutional quality. That asymmetry
    between technical ambition and operating proof should stay central in later customer and risk analysis.'
