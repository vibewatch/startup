  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - TT Voice
    - Mass-market gamers and social users
    - Mature
    - Large installed base and gaming-native rooms
    - Need current DAU, retention, and latency metrics.
  - - TTG / esports layer
    - Fans, leagues, and gaming community
    - Mature-adjacent
    - Adds esports credibility and community density
    - Need product-to-engagement and monetization uplift data.
  - - All Voice Lab / AI dubbing
    - Media and enterprise customers
    - Early-commercial
    - Cross-border dubbing and translation workflow
    - Need customer count, revenue, and gross margin.
  - - Digital-human platform
    - Government, ecommerce, and media customers
    - Early-commercial
    - Fast generation plus Huawei Ascend adaptation
    - Need deployment scale and retention data.
  - - Tunee / AI music agent
    - Creators and consumers
    - Beta / recent launch
    - Conversational music creation
    - Need active-user and paid-conversion evidence.
  - - TemPolor AI guitar
    - Consumers and creators
    - Recent launch
    - Hardware plus generative music workflow
    - Need unit volumes, returns, and margin data.
  - - AI 3D / deep-mesh line
    - Creators and manufacturing-adjacent users
    - Experimental to early-commercial
    - Printable-model workflow and 3D generation
    - Need customer proof and revenue contribution.
  notes: The matrix distinguishes proven core products from newer AI bets that are visible but still less financially evidenced.
