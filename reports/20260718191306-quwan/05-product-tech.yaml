- id: roadmap-differentiation-and-dependencies
  title: Roadmap breadth is high, but so are dependency and execution questions
  body: 'The public roadmap suggests Quwan is expanding fast across several AI surfaces at once. Tunee, TemPolor, multimodal music generation, digital humans, and 3D content generation point to a strategy that treats audio interaction as a platform, not a single app feature. The upside is differentiation: Quwan can tell a story that connects gaming voice, speech generation, music creation, and digital humans. The downside is dependency and focus. Huawei Cloud matters for parts of the AI stack, app stores remain critical for TT Voice distribution, and esports leagues still provide important demand-side context. Because the roadmap is broad, investors should ask whether the company is deepening one commercial flywheel or simply shipping many technically interesting products in parallel. Official awards and R&D claims help the technical credibility case, but they are not substitutes for module-level retention, usage, or revenue proof. The core diligence question is whether Quwan is building
    one reusable interaction stack or several loosely connected experiments.'
  claimRefs:
  - CE011
  - CE012
  - CE021
  - CE022
