- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Current cash, debt, and guarantee position
    - Runway and downside protection cannot be underwritten cleanly
    - Request latest management accounts, cash balance, credit lines, guarantees, and any related-party funding.
  - - Room-host economics and take rates
    - Core margin and revenue quality remain partly opaque
    - Request host payout ratios, creator concentration, and take-rate history by service line.
  - - 2024-2026 MAU, DAU, and payer trend
    - It is impossible to know whether 2023 softness continued or stabilized
    - Request monthly KPI dashboard and cohort retention by game/community type.
  - - AI product revenue contribution
    - New-business upside cannot be separated from narrative
    - Request revenue, bookings, pilots, and gross margin by AI product line.
  - - Segment P&L for esports and AI
    - Loss-making adjacencies could be masked by TT Voice profits
    - Request standalone P&Ls for TTG, AI voice, AI music, and digital-human units.
  notes: These are the highest-value missing metrics because each one would materially change forward underwriting.
