company:
  name: Quwan
chapter:
  number: 4
  title: Financials
  summary: 'Quwan has the outline of a real, scaled consumer-social business: revenue grew from RMB 1.49 billion in 2020 to RMB 3.40 billion in 2022, and updated 2024 coverage said 2023 revenue was still about RMB 3.225 billion with reported net profit of RMB 947 million. The catch is earnings quality. Profit is materially affected by fair-value changes, revenue remains heavily concentrated in TT Voice-linked monetization, and the freshest public balance-sheet picture is stale after the failed de-SPAC removed a visible external capital buffer. Investors can bound the model from public data, but not fully underwrite it without current cash, cohort, and segment disclosures.'
sections:
- id: revenue-model-and-traction
  title: 'Revenue model: a consumer marketplace around TT Voice, not a classic subscription SaaS'
  body: 'Quwan’s financial model is best understood as a consumer monetization engine built on TT Voice rooms, not as a clean SaaS subscription business. The most important revenue lines are still user-paid virtual goods and room-host-led interaction services. That was visible in 2022, when value-added services and audio entertainment contributed 74.8% and 23.6% of revenue, and it remained visible in 2023, when updated coverage said two TT Voice-linked lines contributed 97.7% of revenue. This concentration matters because it makes Quwan easier to understand but also easier to stress-test: if payer conversion, room activity, or virtual-goods demand softens, there are not many public revenue lines to offset it. Public traction still looks meaningful. Revenue rose from RMB 1.49 billion in 2020 to RMB 3.40 billion in 2022 before slipping to RMB 3.225 billion in 2023, while average MAU moved from 13.8 million in 2022 to about 12.8 million in 2023 and average monthly paying users reportedly held
    near 1 million.'
