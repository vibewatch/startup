- id: capital-adequacy-and-cost-structure
  title: 'Capital adequacy and cost structure: historically cash-positive enough, but the failed de-SPAC removed a visible buffer'
  body: The retained public record suggests Quwan was not a cash-starved consumer startup by the end of 2022. Eastmoney and 36Kr both pointed to about RMB 935 million of cash and cash equivalents, with only about RMB 99 million of receivables. That is consistent with a consumer-heavy model that collects cash quickly and is not deeply dependent on long receivables cycles. The problem is freshness. The de-SPAC route would have added roughly HK$576 million to HK$610 million of PIPE capital, but HKEX later disclosed that the transaction would not proceed. As a result, current capital adequacy is materially less transparent than the 2022 historical snapshot. Cost structure is also evolving. Legacy TT Voice monetization is not obviously hardware-capex heavy, yet Quwan’s stated R&D intensity, AI-model work, moderation burden, and AI hardware experiments such as TemPolor all imply more complex future cost demands than a pure voice-room business would have faced.
  claimRefs:
  - CI026
  - CI027
  - CI033
  - CI034
  - CI028
  - CI029
  - CI035
