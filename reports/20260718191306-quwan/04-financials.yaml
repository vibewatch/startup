- id: TI004
  title: Capital adequacy table
  columns:
  - Cash on hand / capital item
  - Monthly burn / inflow proxy
  - Runway / status
  - Planned use of funds
  - Next-round trigger
  - Debt / obligation note
  rows:
  - - RMB 935M cash and cash equivalents at 2022 year-end
    - Historical positive cash position; no public burn figure retained
    - Freshness gap after 2022
    - Would support ongoing platform operations, R&D, and compliance needs
    - Need updated cash data if AI investment or listing delay raised spend
    - No retained debt schedule in public source pack.
  - - HK$576M-HK$610M planned PIPE
    - External capital that would have supplemented the balance sheet
    - Cancelled with failed de-SPAC path
    - Would likely have supported listing transaction, shareholder transfer, and operating flexibility
    - Failure increases reliance on internal cash generation or private financing
    - Transaction-related rather than debt capital.
  - - Consumer cash conversion
    - Fast cash collection implied by low receivables
    - Positive working-capital trait
    - Supports self-funded operation better than invoice-heavy enterprise models
    - Need refunds, reserve, and payout timing detail
    - Receivables were ~RMB 99M at 2022 year-end.
  - - AI and moderation investment needs
    - Likely rising cost demand, not clearly quantified
    - Unknown
    - Model training, content moderation, AI commercialization, and some hardware work
    - Need segment budgets and AI capital plan
    - Could increase cost complexity even if legacy business is cash generative.
  notes: The retained record is good enough to show historical adequacy but not current runway.
