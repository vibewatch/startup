- id: capital-competition-and-market-timing-risk
  title: Capital, Competition, and Market-Timing Risk
  body: |-
    The current financing is huge for Europe, but it does not remove the capital-risk story. Proxima has raised more than €650 million and can plausibly fund Alpha-related progress, hiring, and manufacturing buildout for several years. It almost certainly cannot self-fund a full commercial stellarator program to sustained grid deployment. Fusion Industry Association data and World Nuclear News coverage both emphasize that access to funding remains a major industry issue because timelines are long and hardware programs are capital intensive. Proxima therefore remains dependent on future private rounds, public support, and eventually project-style capital for first plants.

    Competition compounds the problem. Better-capitalized or commercially further-advanced peers have already shown stronger customer proof: Google signed a 200 MW PPA with CFS, Microsoft signed with Helion, and TVA issued a LOI to Type One Energy. Those deals do not prove those companies will succeed, but they do show that competing teams can convert strategic credibility into commercial paperwork sooner. If CFS, Helion, or another approach demonstrates decisive technical proof earlier, Proxima may face a harsher fundraising environment and a lower valuation tolerance. Even if fusion works technically, market-timing risk remains substantial because solar, wind, storage, advanced fission, and gas-backed capacity continue to evolve while Proxima's revenue horizon stays far out in the 2030s or later.
  claimRefs:
  - CR028
  - CR029
  - CR030
  - CR031
