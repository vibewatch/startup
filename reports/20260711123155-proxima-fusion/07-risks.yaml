company:
  name: Proxima Fusion
chapter:
  number: 7
  title: Risks
  summary: >-
    Proxima Fusion carries a classic deep-tech fusion risk stack: binary physics and
    engineering risk, massive capital needs beyond the current balance sheet, a long path
    through still-forming German and EU regulatory frameworks, dependence on a small set of
    strategic partners, and a commercialization horizon that may collide with
    faster-improving alternatives such as renewables, storage, fission, and better-funded
    fusion peers. The strongest mitigating factors are the W7-X scientific lineage, RWE’s
    site and utility participation, Bavaria’s policy support, and unusually strong private
    financing for a European fusion startup. The bottom line is that Proxima is
    scientifically credible but still exposed to multiple failure modes that could impair
    valuation long before any commercial plant exists.
sections:
- id: scientific-and-technology-risk
  title: Scientific and Technology Risk
  body: |-
    Proxima's dominant risk remains scientific and engineering execution. The company is building on credible stellarator science rather than an empty concept, but that is not the same thing as proving a bankable reactor. Wendelstein 7-X, the QI literature, and Proxima's own public materials all support the view that stellarators can offer steady-state operation with lower disruption exposure than tokamaks. They do not prove that Proxima can integrate HTS magnets, precise coil manufacturing, plasma heating, neutron-tolerant materials, tritium management, and maintainable plant architecture into a commercial machine on the timetable implied by its narrative.

    The adverse literature is blunt about the remaining gap. EPRS still describes fusion broadly as low-TRL and flags uncertainty around plasma control, fuel cycle, materials, regulation, and economics. Belfer argues that even after decades of work and tens of billions of dollars, practical fusion has not crossed the true electricity-breakeven threshold and that tritium, neutron damage, and plant economics remain underappreciated barriers. Even optimistic stellarator-specific papers frame improved QI geometries as reactor candidates rather than solved products. In practice, Alpha is a necessary milestone, not a sufficient one: failure to hit its key performance targets or delays in the Stellarator Model Coil and magnet program would weaken the whole investment case.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
