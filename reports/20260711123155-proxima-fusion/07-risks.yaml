- id: manufacturing-dependency-and-supply-chain-risk
  title: Manufacturing, Dependency, and Supply-Chain Risk
  body: |-
    Stellarators push a difficult manufacturing problem into the foreground. Proxima's architecture depends on precise, high-field superconducting coils, tight geometry control, advanced cryogenic and support systems, and a growing industrial base around Alpha. The public roadmap acknowledges that the company is expanding HTS cable and magnet production capability, while the Alpha Alliance and PSI relationship imply that manufacturing is an active de-risking area rather than a solved procurement exercise. That is encouraging, but it also means schedule risk can emerge from supply-chain immaturity, low production yield, or integration shortfalls before plasma performance is even tested.

    The deeper concern is concentration. A handful of strategic actors matter disproportionately: IPP for scientific legitimacy, RWE for site and utility-operating relevance, Bavaria and Berlin for public support, and European industrial partners for equipment and systems delivery. If any of those parties slow-walk commitments or if key materials, magnet components, or engineering talent become bottlenecks, Proxima could face cascading delays. EPRS specifically highlights critical-material competition, skills constraints, and the need to build a durable supply chain; those are not abstract sector risks but immediate execution constraints for a company trying to move from design optimization into hardware industrialization.
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
