          type: decision
        - id: n5
          label: Buy / Accumulate
          type: end
        - id: n6
          label: Track
          type: end
        - id: n7
          label: Avoid at current price
          type: end
      edges:
        - from: n1
          to: n2
          label: Science quality is real
        - from: n2
          to: n3
          label: Capital and partners reduce isolation
        - from: n3
          to: n4
          label: Yes
        - from: n3
          to: n6
          label: No — proof still incomplete
        - from: n4
          to: n5
          label: Yes — if valuation support improves
        - from: n4
          to: n7
          label: No — if premium persists
    approximationNotes: 'The decision tree compresses the chapter into two gating questions: proof quality and price support.'
    claimRefs: [CV005, CV008, CV016, CV018, CV038, CV039, CV040]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Proxima’s value is most sensitive to milestone attainment and financing quality rather than to a conventional revenue multiple.
    data:
      items:
        - label: Alpha schedule credibility
          value: 10
          detail: Biggest mover of current value because it changes commercialization timing
        - label: Follow-on capital access
          value: 9
          detail: Determines whether technical progress compounds or dilutes away
        - label: First hard customer economics
          value: 8
          detail: Offtake or reservation rights would tighten underwriting dramatically
        - label: HTS manufacturing proof
          value: 8
          detail: Coil yield and tolerance data could de-risk cost and schedule assumptions
        - label: Peer lead / lag signal
          value: 7
          detail: Relative progress by Helion, CFS, and Type One will influence scarcity premium
    approximationNotes: Ordinal 0-10 scores summarize which new evidence would most change today’s investment view.
    claimRefs: [CV020, CV021, CV022, CV032, CV033, CV034, CV035, CV036, CV037]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull current-value bands supported by today’s public evidence.
    data:
      items:
        - label: Bear
