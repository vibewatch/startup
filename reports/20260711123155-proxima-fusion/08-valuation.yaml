    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [track, medium, high, stretched, 'Follow closely; wait for Alpha, financing, or customer-proof evidence before treating the current price as clearly attractive']
    notes: >-
      Recommendation is price-sensitive. This is not a judgment that Proxima is weak; it is a judgment that current proof and current price are not yet comfortably matched.
    claimRefs: [CV005, CV006, CV007, CV008, CV038, CV039, CV040]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Supports which side
      - Why it matters
      - What would change the view
    rows:
      - ['W7-X pedigree plus AI-optimized stellarator design create real technical differentiation', thesis, 'Supports a non-generic premium over ordinary European climate tech', 'Alpha and model-coil results need to show the design advantage survives hardware reality']
      - ['Strategic investors RWE and Google improve credibility and reduce isolation risk', thesis, 'Signal matters in capital-intensive sectors that need patient buyers and partners', 'Named commercial rights, option structures, or deeper project commitments would strengthen this materially']
      - ['Pre-revenue status and absent plant economics make precision valuation weak', anti-thesis, 'Without LCOE, capex, or burn, investors can underwrite only broad ranges', 'Disclosure of plant-economics assumptions and financing plan would tighten the range']
      - ['Fusion timelines remain long and binary even for top companies', anti-thesis, 'Long delays destroy present value and can force expensive dilution', 'Independent evidence that Alpha meaningfully pulls commercialization forward would help']
      - ['Peer leaders have stronger capital bases or clearer offtake proof today', anti-thesis, 'Proxima is good, but not yet the best-proved private fusion equity in the market', 'If Proxima secures harder commercial proof or outperforms peers on milestones, the discount can narrow']
    notes: >-
      The round can be exciting and still deserve discipline. The anti-thesis is about proof timing, not about absence of scientific merit.
    claimRefs: [CV010, CV015, CV016, CV017, CV018, CV019, CV026, CV030, CV031, CV035]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Indicative current value (USD M)
      - Long-run platform logic
      - Probability signal
    rows:
      - ['Bull', 'Alpha lands near early-2030s target path; HTS manufacturing de-risks; partner set expands into real utility demand', '3500-8000', 'Could compound toward a $50B-$100B platform if stellarators become bankable baseload assets', medium]
      - ['Base', 'Technical progress continues but slips; funding remains available; commercialization shifts toward mid-2040s', '1600-3000', 'Could still become a major European fusion company, but equity uplift arrives slower than round enthusiasm implies', high]
      - ['Bear', 'Alpha slips materially, financing becomes more dilutive, or rival approaches win customer mindshare first', '500-1500', 'Value falls back toward technology, team, and strategic-option asset value rather than platform leadership', medium]
    notes: >-
      Values are analytical current-value bands rather than management guidance. They are meant to reflect milestone probability, dilution risk, and evidence quality.
    claimRefs: [CV020, CV021, CV022, CV023, CV024, CV025, CV034, CV035]
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: This sample focuses on the five most decision-useful private fusion comparables with public 2025-2026 financing or customer-proof signals, not the entire global fusion field.
    columns:
      - Comparable
      - Current valuation / capital signal
      - Commercial proof signal
      - Relevance to Proxima
      - Limitation
    rows:
      - ['Proxima Fusion', '€2.4B valuation; >€650M total funding', 'Strategic investors and site pathway, but no paying customers', 'Direct subject and best current round anchor', 'Pre-revenue and pre-demonstrator']
      - ['Commonwealth Fusion Systems', '$3B+ raised; latest $863M round; sector capital leader', 'Google 200 MW PPA and SPARC/ARC roadmap', 'Best-capitalized magnetic-confinement peer', 'Tokamak path is more established than Proxima''s stellarator path']
      - ['Helion Energy', '$15.5B valuation; $1.5B total capital after Series G', 'Microsoft PPA and Orion site, but still heavily debated technically', 'Upper-bound proof-plus-premium reference for private fusion', 'Different pulsed architecture and more aggressive commercialization narrative']
      - ['Type One Energy', '$269M disclosed capital according to TechCrunch; TVA and Bull Run siting path', 'LOI / utility siting and U.S. public-private ecosystem', 'Closest stellarator commercial analogue', 'Earlier financing scale and different geography']
      - ['TAE Technologies', '>$1.3B raised; latest $150M round', 'Strong investor backing and long technical history, but still pre-commercial', 'Shows investor appetite for differentiated non-tokamak paths', 'Different FRC physics and unclear present private mark']
    notes: >-
      The point of the table is not to force a single multiple. It is to show which peers have already converted capital into harder forms of proof than Proxima has today.
    claimRefs: [CV001, CV002, CV010, CV011, CV012, CV013, CV014, CV015, CV026, CV027, CV028, CV029, CV030, CV031]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - ['Alpha / model-coil delay', '>24 months versus current public path', 'Reduces confidence that Proxima can keep pace with better-funded peers', 'Move from track to avoid unless price resets sharply']
      - ['Follow-on capital stress', 'New money arrives only on punitive or insider-led rescue terms', 'Signals that even supporters see weaker risk-adjusted upside', 'Re-underwrite downside first, not upside']
      - ['Commercial-economics disappointment', 'Internal capex or LCOE looks structurally uncompetitive', 'Breaks the steady-state stellarator economics thesis', 'Treat the company as science-rich but equity-poor']
      - ['Peer grid-proof leapfrogs Proxima', 'Helion, CFS, or another rival achieves clearly superior commercial proof while Proxima remains pre-demo', 'Compresses relative scarcity value and partner urgency', 'Raise required return hurdle or step aside']
    notes: >-
      These triggers are intentionally operational. A long-duration science company should be judged by milestone transmission, not by quarterly vanity metrics.
    claimRefs: [CV022, CV034, CV036, CV038, CV040]
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - ['Alpha budget', 'Subsystem capex, contingency, and schedule critical path', 'Needed to test whether current capital is enough for the next proof gate', 'CFO, project controls, and board materials']
      - ['Commercial plant economics', 'Internal capex, LCOE, uptime, and maintenance assumptions', 'Core determinant of whether stellarator economics can beat alternatives', 'Engineering lead and finance lead']
      - ['Cap table and preferences', 'Liquidation stack, anti-dilution, ratchets, and partner rights', 'Headline valuation can overstate common-equity value', 'Counsel and data room']
      - ['Partner economics', 'Any reservation rights, option rights, or pre-development economics with RWE / Google / utilities', 'Hard customer proof would materially improve underwriting', 'Business development and commercial lead']
      - ['HTS manufacturing readiness', 'Yield, tolerance, vendor concentration, and learning curve data', 'Manufacturing reality may dominate schedule and cost more than plasma theory', 'CTO, magnet team, and suppliers']
      - ['Regulatory roadmap', 'Authority mapping, permitting sequence, and legal opinions for Alpha and later plant', 'A soft policy narrative is not the same as a project-specific route to approval', 'External counsel and regulatory workstream']
    notes: >-
      Without these asks, investors are mostly underwriting narrative, pedigree, and category momentum.
    claimRefs: [CV019, CV020, CV032, CV033, CV035, CV037]

