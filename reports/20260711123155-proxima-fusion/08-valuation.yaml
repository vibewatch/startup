slug: proxima-fusion
runDate: '2026-07-11'
company:
  name: Proxima Fusion
chapter:
  number: 8
  title: Valuation
  summary: >-
    Proxima Fusion is a high-quality European fusion platform, but today’s public evidence supports a price-sensitive
    watch posture rather than a conviction Buy. The July 2026 round set a clean anchor at roughly €2.4 billion
    ($2.7 billion) post-money after a €411 million raise, yet the company remains pre-revenue, pre-demonstrator, and
    years away from any disclosed plant-level economics. That combination makes DCF or revenue-multiple math false
    precision. The more defensible method is a milestone-adjusted scenario framework anchored on Alpha execution,
    follow-on capital access, commercial-partner proof, and relative progress versus Helion, CFS, TAE, and Type One.

    On that basis, Proxima screens as strategically important and technically credible, but still stretched at the
    current mark. The upside case is real if Alpha, HTS manufacturing, and utility partnerships convert into a bankable
    path to commercial stellarators. The downside case is equally real if timelines slip, capital markets cool, or a
    better-funded fusion approach reaches grid proof first. Final verdict: track, with medium confidence, high risk,
    and a stretched valuation stance.
sections:
  - id: recommendation-and-method
    title: Recommendation and Valuation Method
    body: >-
      Proxima’s round should be judged with a venture infrastructure lens, not a software lens. There is no current
      revenue base, no public gross-margin profile, no disclosed LCOE target, and no visible cap-table structure that
      would support precision discounting. That means conventional DCF or revenue-multiple outputs would look rigorous
      while resting on assumptions the public record does not actually disclose. A milestone-adjusted scenario approach
      is more honest because it values the business as a sequence of physics, manufacturing, regulatory, and customer-
      proof gates rather than as an already-commercialized power company.

      Within that framework, Proxima still looks investable enough to follow closely. The science pedigree is elite,
      the European strategic backing is unusually strong, and the July 2026 round materially improved runway and
      signaling power. But the market-clearing price already assumes continued technical progress and continuing access
      to large-scale capital. For that reason the right call is track, not buy: the company can be strong while the
      entry price still demands more proof than public evidence currently offers.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV032, CV033, CV038, CV039, CV040]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: round-context-and-peer-signal
    title: Round Context and Peer Signal
    body: >-
      The July 2026 financing gave Proxima one of the cleanest new private marks in fusion: €411 million raised at a
      €2.4 billion valuation, total funding above €650 million, and strategic participation from RWE and Google. That
      is a major achievement by European standards and helps explain why Proxima matters geopolitically as well as
      technically. Alpha and Gundremmingen also reduce the risk that the company remains a purely academic spinout with
      no visible path to industrial siting.

      Relative valuation context is less flattering. CFS has raised roughly $3 billion and converted that capital into
      SPARC construction, magnet manufacturing, and a 200 MW Google PPA. Helion has gone even further in financing and
      headline commercial signaling, reaching a $15.5 billion valuation after a $465 million Series G while still
      carrying major execution skepticism. Type One and TAE sit on different proof curves, but they also show how much
      investor appetite now rewards site access, utility relationships, and repeat financing. Against that backdrop,
      Proxima deserves a premium to generic European deep tech, but not yet a proof-equivalent premium to the best-
      financed U.S. fusion leaders.
    claimRefs: [CV002, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV026, CV027, CV028, CV029, CV030, CV031]
    tableRefs: [TV004]
    figureRefs: [FV004]
  - id: scenario-ranges-and-sensitivity
    title: Scenario Ranges and Sensitivity
    body: >-
      The central underwriting question is not whether fusion could someday be enormous; it is what today’s private
      equity should be worth before Alpha, before commercial offtake, and before plant economics are public. In the
      bull case, Proxima proves Alpha on a commercially relevant timetable, turns AI-optimized stellarator design into a
      defensible engineering moat, and converts RWE / Google / IPP credibility into broader utility and sovereign
      support. In that path, the current mark can look merely early. In the base case, progress continues but slips in
      time, capital intensity remains heavy, and valuation appreciation lags the magnitude of technical ambition. In the
      bear case, delays or better peer execution compress sector multiples and leave Proxima trading more like a highly
      regarded technology asset than a future platform winner.

      Sensitivity is therefore dominated by milestone probability, not by a neat multiple. Alpha schedule, HTS coil
      manufacturability, follow-on capital availability, and first hard customer commitments will move value more than
      broad energy narratives alone. The current round sits near the top of a defensible base-case range and below a
      genuine breakthrough-bull case, which is why the stance is stretched rather than absurd.
    claimRefs: [CV020, CV021, CV022, CV023, CV024, CV025, CV027, CV028, CV034, CV035]
    tableRefs: [TV003]
    figureRefs: [FV002, FV003]
  - id: diligence-asks-and-thesis-breakers
    title: Diligence Asks and Thesis-Break Triggers
    body: >-
      The public record still leaves too much invisible to underwrite the round like a conventional late-stage company.
      The biggest missing items are the Alpha budget and contingency plan, expected spend through the next financing,
      commercial plant capex and LCOE assumptions, any cap-table preferences or investor protections, and the exact
      structure of partner rights with RWE, Google, IPP, and public funders. Those gaps matter because even a correct
      scientific thesis can produce weak equity outcomes if dilution, delay, or financing terms turn adverse.

      The main thesis-break triggers are concrete. A 24-plus month slip in Alpha or the model-coil stack would weaken
      the premise that Proxima is moving on a credible commercial clock. Evidence that commercial stellarator economics
      are worse than public alternatives, or that utilities prefer tokamak or non-fusion substitutes, would hurt the
      long-run multiple. A hard funding window shut for fusion, or clear grid-delivery leadership by Helion or CFS,
      would also compress Proxima’s optionality. Until those questions are answered, the right posture is continued
      tracking with disciplined curiosity rather than aggressive entry.
    claimRefs: [CV019, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
    tableRefs: [TV005, TV006]


tables:
