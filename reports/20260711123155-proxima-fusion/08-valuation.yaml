          mid: 900
          high: 1500
          detail: Financing stress or major timeline slippage
        - label: Base
          low: 1600
          mid: 2200
          high: 3000
          detail: Credible progress, but still long-dated commercialization
        - label: Bull
          low: 3500
          mid: 5000
          high: 8000
          detail: Alpha success, stronger utility proof, and sustained capital appetite
    approximationNotes: Values are USD millions and represent analytical current-value bands, not future exit values or management guidance.
    claimRefs: [CV001, CV008, CV023, CV024, CV025, CV035, CV040]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Proxima scores well on strategic importance and scientific quality, but much lower on present proof and valuation support.
    data:
      items:
        - label: Market need
          score: 8
          detail: Data-center and industrial baseload demand support the category
        - label: Technical pedigree
          score: 8
          detail: IPP and W7-X lineage are unusually credible
        - label: Customer proof
          score: 4
          detail: Strategic partners exist, but no paying customers yet
        - label: Manufacturing readiness
          score: 4
          detail: HTS coil industrialization remains largely ahead
        - label: Financing depth
          score: 6
          detail: Strong for Europe, lighter than top U.S. leaders
        - label: Regulatory clarity
          score: 3
          detail: Legal path is improving but still incomplete
        - label: Evidence quality
          score: 5
          detail: Funding facts are clear; economics and cap table are not
        - label: Valuation support
          score: 4
          detail: Current mark is near the top of a defensible base range
    approximationNotes: Scores are ordinal 0-10 judgments for investment-committee framing. Higher is better.
    claimRefs: [CV010, CV011, CV012, CV017, CV018, CV019, CV027, CV028, CV040]

