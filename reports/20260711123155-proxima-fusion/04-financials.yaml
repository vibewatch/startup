schemaVersion: "report-v2"
artifact: financials
slug: proxima-fusion
runDate: '2026-07-11'
company:
  name: Proxima Fusion
chapter:
  number: 4
  title: Financials
  summary: >-
    Proxima Fusion is still a pre-revenue fusion developer, so conventional underwriting metrics are largely absent.
    Public evidence supports a strong capital position by European standards — €411 million raised in July 2026 at a
    €2.4 billion valuation and more than €650 million total funding including €95 million of grants — but not an
    auditable view of cash on hand, monthly burn, unit economics, or project-finance readiness. The visible cost
    structure is heavily front-loaded into scientific talent, HTS magnet development, manufacturing systems, and
    the Alpha / Model Coil roadmap. The financial verdict is therefore two-sided: Proxima appears unusually well
    funded for a European private fusion company, yet it remains a deeply capital-intensive, pre-commercial business
    that will likely require substantial additional capital before any commercial plant can produce revenue.
sections:
  - id: revenue-model-and-current-status
    title: Revenue Model and Current Status
    body: >-
      Proxima does not disclose current product revenue, ARR, GMV, or customer payments in any retained public source.
      Its present-stage outputs are engineering milestones, magnet development, plant design, and public-private project
      formation rather than sold electricity. The company frames itself as a builder of fusion power plants, which implies
      that the eventual primary revenue stream is electricity sales from commercial stellarator assets, likely via long-
      term power agreements or project-company structures. RWE's role and the Gundremmingen pathway reinforce that utility-
      grade commercialization framing, but they do not provide revenue today.

      A secondary monetization question is whether Proxima ultimately sells complete plants, licenses technology, co-develops
      projects, or remains a power producer. Public sources do not resolve that question. The company clearly discusses Alpha,
      Stellaris, HTS cables, model coils, AI-enabled engineering, and industrial partnerships, but it does not publish a list
      price, a per-megawatt economics model, or a disclosed contract form comparable to Helion's Microsoft PPA or CFS's Google
      PPA. In practice, the current business is financed R&D plus industrialization, not commercial energy delivery.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI023, CI024, CI029]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit-Economics Reality
    body: >-
      The public cost structure is easy to describe qualitatively and hard to quantify precisely. Proxima is running a
      150+-to-200-person deep-tech organization spread across Munich, Zurich, and Oxford while simultaneously funding HTS
      magnet work, model-coil manufacturing, cloud-based design systems, labs, and an eventual net-energy demonstrator.
      Those are not software-style costs; they are personnel-heavy R&D costs layered on top of hardware and facility spend.
      The July 2026 financing announcement specifically earmarked capital for the Stellarator Model Coil, HTS cable and magnet
      production, and engineering and manufacturing systems, which is strong evidence that capex and manufacturing-readiness
      spend are central to the financial profile.

      Yet unit economics remain almost entirely unobservable. No public source discloses Proxima's target LCOE, plant capex,
      gross margin, maintenance cost, working-capital cycle, or expected realized price per megawatt-hour. Because no
      commercial kilowatt-hour has been sold, standard metrics such as gross margin, CAC payback, or cash-conversion cycle are
      not simply private — they are structurally premature. The most defensible conclusion is that Proxima's eventual economics
      will depend far more on plant-level capital efficiency, reliability, financing cost, and fuel-cycle assumptions than on
      any metric visible in startup-style software reporting.
    claimRefs: [CI006, CI007, CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI025]
    tableRefs: [TI003]
    figureRefs: [FI002, FI004]
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy, Runway Logic, and Financing Dependency
    body: >-
      Proxima's financing trajectory has been unusually steep: €7 million pre-seed in 2023, €20 million seed in 2024,
      €130 million Series A in 2025, and €411 million Series A2 in July 2026. By the run date, company and investor sources
      said total funding exceeded €650 million including €95 million in public grants. That is a very strong capital base for
      a European private fusion company and plausibly enough to fund the next stage of magnet and demonstrator preparation. It
      is not, however, proof that Proxima is financed all the way to a commercial plant.

      The core limitation is disclosure. Proxima does not publicly disclose current cash on hand, monthly burn, runway months,
      debt facilities, or project-finance commitments. Public sources do not reveal the budget for Alpha, the cash cost of the
      Model Coil program, or how much capital will be required after Alpha to reach a commercial plant. Sector evidence matters
      here: FIA reporting says 83% of fusion companies still view investment as a major challenge and that the median company
      expects to need about $700 million more to bring a first pilot plant online. Proxima is clearly better funded than the
      median, but it is also pursuing one of the most capital-intensive technology programs in Europe.
    claimRefs: [CI008, CI009, CI010, CI018, CI019, CI020, CI021, CI022, CI026, CI027, CI030]
    figureRefs: [FI003]
  - id: benchmarking-and-capital-intensity-context
    title: Benchmarking Against the Fusion Peer Set
    body: >-
      Relative benchmarking matters more than absolute valuation multiples because Proxima has no current revenue. Against the
      European field, Proxima is unusually well capitalized and likely the strongest private fusion financing story to date.
      Against the global leaders, the picture is more mixed. CFS, Helion, and TAE all operate with either larger disclosed
      capital bases, stronger public customer commitments, longer operating histories, or broader public-private support
      mechanisms. DOE's Milestone Program also highlights that several U.S. peers are embedded in a commercialization ecosystem
      designed to crowd in non-dilutive funding and later project capital.

      That leaves Proxima in a strong-but-still-dependent financial position. It has enough capital to be taken seriously,
      enough partner backing to reduce near-term financing stigma, and enough momentum to attract further capital if technical
      milestones are met. But it does not yet have the de-risked customer cash flows, public loan structures, or project-finance
      pathways that would make the commercialization path financially self-evident. Financially, Proxima is closer to a well-
      funded infrastructure R&D company than to a business with a near-term margin profile.
    claimRefs: [CI019, CI020, CI021, CI026, CI027, CI028, CI030, CI031, CI032]
    tableRefs: [TI004]
  - id: disclosure-gaps-and-verdict
    title: Disclosure Gaps and Financial Verdict
    body: >-
      The biggest financial diligence blockers are not subtle. There is no public cash balance, no audited burn rate, no Alpha
      capex budget, no disclosed plant-level LCOE, no power-pricing framework, no debt or project-finance stack, and no signed
      Proxima offtake contract that would let an investor underwrite revenue quality. Even the legal and ownership picture is only
      partially visible through the legal imprint and financing announcements; there is no public cap table, liquidation-preference
      structure, or board-rights map. These are normal gaps for a private fusion company, but they still block any conventional
      underwriting exercise.

      The right financial conclusion is therefore qualitative. Proxima looks sufficiently capitalized to remain one of Europe's
      leading private fusion contenders through the next technical phase, and the 2026 round materially improves its runway and
      credibility. But the company is still pre-revenue, hardware-heavy, and likely many financing events away from commercial
      operation. Without internal budget, burn, and cost-of-energy data, the prudent view is that Proxima is capital-advantaged
      for its stage, not capital-complete for its mission.
    claimRefs: [CI016, CI017, CI022, CI023, CI024, CI031, CI032, CI033, CI034, CI035]
    tableRefs: [TI005]
