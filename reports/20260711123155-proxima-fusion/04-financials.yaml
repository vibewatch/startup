      - ['Post-money valuation', '€2.4B', high, 'Frames dilution, investor confidence, and expectations', 'Request full round structure and liquidation preferences']
      - ['Total funding', '>€650M including €95M grants', high, 'Best public proxy for capital available to reach next milestones', 'Break down equity, grants, and strategic capital by source']
      - ['Public grants', '€95M disclosed cumulatively', medium, 'Non-dilutive support matters in capital-intensive deep tech', 'Identify grant timing, restrictions, and milestone obligations']
      - ['Current cash on hand', null, low, 'Necessary to underwrite runway', 'Request actual cash balance at most recent month-end']
      - ['Monthly burn', null, low, 'Necessary to estimate runway and financing timing', 'Request actual monthly burn and forecast 18-24 month burn curve']
      - ['Runway months', null, low, 'Core liquidity metric', 'Request base / stress-case runway through Model Coil and Alpha milestones']
      - ['Debt / project finance', 'No public debt or project-finance disclosure found', medium, 'Shows whether commercialization already has non-equity backing', 'Request all debt, guarantees, and project-finance discussions']
      - ['Next-round trigger', 'Likely tied to Alpha / later plant financing rather than general corporate operations', medium, 'Shows when dilution or project risk returns', 'Ask management for explicit financing milestones through commercial plant FID']
    notes: >-
      Historical round chronology is used only as capital-adequacy context; the economic meaning now is whether Proxima can fund Alpha-class execution without a forced financing.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI018, CI019, CI020, CI021, CI022, CI026, CI030]
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Exact diligence path
    rows:
      - ['Cash on hand and monthly burn', 'Cannot underwrite runway or timing of next round', 'Request monthly cash waterfall and board liquidity dashboard']
      - ['Alpha capex budget and contingency', 'Cannot estimate capital sufficiency to next hardware milestone', 'Request project budget by subsystem, vendor, and contingency reserve']
      - ['Commercial plant LCOE and capex assumptions', 'Cannot compare economics to SMRs, gas, or renewables', 'Request management model with sensitivity cases']
      - ['Any customer or option economics', 'Cannot evaluate revenue quality or buyer commitment', 'Review partner agreements for prepayment, reservation, or option rights']
      - ['Debt, guarantees, or project-finance stack', 'Cannot assess off-balance-sheet risk or financing structure', 'Request all financing documents and project SPV plans']
      - ['Cap table, governance rights, and liquidation preferences', 'Cannot assess dilution, investor control, or future financing friction', 'Review latest charter, investor rights agreement, and board materials']
    notes: >-
      These are the minimum disclosures needed to turn a narrative financial view into an underwritable model.
