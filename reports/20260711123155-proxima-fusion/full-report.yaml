      - number: '6.5'
        title: Chapter Verdict
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is therefore straightforward: Proxima has attractive strategic counterparties but not
              yet customer proof in the strict commercial sense. RWE is the most important relationship because it
              compresses site access, utility credibility, and future buyer logic into one counterpart. Google matters
              because it validates the long-run demand story for clean firm power in an AI-heavy electricity market. Yet
              neither relationship currently substitutes for a disclosed PPA, LOI, or revenue contract.


              Compared with the best-publicized fusion peers, Proxima is one stage earlier. CFS can point to Google as
              both investor and PPA counterparty, Helion can point to Microsoft, and Type One can point to TVA’s LOI.
              Proxima can point to investor/partner alignment and a plausible first-site thesis. That is valuable, but
              it means commercial traction still has to be earned through Alpha, permitting progress, and a future
              anchor-offtaker agreement.
