      - number: '4.2'
        title: Cost Structure and Unit-Economics Reality
        blocks:
          - type: paragraph
            body: >-
              The public cost structure is easy to describe qualitatively and hard to quantify precisely. Proxima is
              running a 150+-to-200-person deep-tech organization spread across Munich, Zurich, and Oxford while
              simultaneously funding HTS magnet work, model-coil manufacturing, cloud-based design systems, labs, and an
              eventual net-energy demonstrator. Those are not software-style costs; they are personnel-heavy R&D costs
              layered on top of hardware and facility spend. The July 2026 financing announcement specifically earmarked
              capital for the Stellarator Model Coil, HTS cable and magnet production, and engineering and manufacturing
              systems, which is strong evidence that capex and manufacturing-readiness spend are central to the
              financial profile.

              Yet unit economics remain almost entirely unobservable. No public source discloses Proxima's target LCOE,
              plant capex, gross margin, maintenance cost, working-capital cycle, or expected realized price per
              megawatt-hour. Because no commercial kilowatt-hour has been sold, standard metrics such as gross margin,
              CAC payback, or cash-conversion cycle are not simply private — they are structurally premature. The most
              defensible conclusion is that Proxima's eventual economics will depend far more on plant-level capital
              efficiency, reliability, financing cost, and fuel-cycle assumptions than on any metric visible in
              startup-style software reporting.
