  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Current Status
        blocks:
          - type: paragraph
            body: >-
              Proxima does not disclose current product revenue, ARR, GMV, or customer payments in any retained public
              source. Its present-stage outputs are engineering milestones, magnet development, plant design, and
              public-private project formation rather than sold electricity. The company frames itself as a builder of
              fusion power plants, which implies that the eventual primary revenue stream is electricity sales from
              commercial stellarator assets, likely via long- term power agreements or project-company structures. RWE's
              role and the Gundremmingen pathway reinforce that utility- grade commercialization framing, but they do
              not provide revenue today.

              A secondary monetization question is whether Proxima ultimately sells complete plants, licenses
              technology, co-develops projects, or remains a power producer. Public sources do not resolve that
              question. The company clearly discusses Alpha, Stellaris, HTS cables, model coils, AI-enabled engineering,
              and industrial partnerships, but it does not publish a list price, a per-megawatt economics model, or a
              disclosed contract form comparable to Helion's Microsoft PPA or CFS's Google PPA. In practice, the current
              business is financed R&D plus industrialization, not commercial energy delivery.
