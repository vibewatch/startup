      - number: '3.3'
        title: Substitutes, Multi-Homing, and Channel Power
        blocks:
          - type: paragraph
            body: >-
              Proxima's competitive set extends beyond fusion. Utilities and hyperscalers that might eventually buy
              Proxima's power can also sign with advanced fission SMRs, renewables paired with storage, geothermal, or
              even gas-backed capacity where decarbonization requirements are flexible. Those substitutes matter because
              the first generation of fusion contracts will almost certainly be scarce and relationship-driven. Buyers
              can multi-home by backing several options at once, especially when agreements are strategic or conditional
              rather than near-term merchant purchases. Google's behavior across fusion and advanced-energy options
              illustrates that point clearly.

              This means there is little real lock-in today. Proxima does not yet have a disclosed PPA, no visible
              option on future power volumes, and no proof that utilities must choose its stellarator pathway over
              tokamaks, FRC, or SMRs. On the other hand, Proxima's European public-private network — Bavaria, IPP, RWE,
              the Alpha Alliance, and later-stage growth investors — does create a distribution advantage in the
              specific context of European siting, industrial partnerships, and policy attention. The question is
              whether that regional channel advantage matures faster than competing U.S. customer and financing
              channels.
