      - number: '2.5'
        title: Sizing Uncertainty and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main diligence error to avoid is confusing a gigantic eventual electricity market with a directly
              measurable near-term SAM or SOM for Proxima. Public sources support the existence of a vast long-run clean
              firm-power market and rising buyer anxiety around compute and reliability, but they do not yet support a
              hard estimate for Proxima's addressable contract volume in the early 2030s. There is no public Proxima
              LCOE range, no disclosed pricing architecture, no signed offtake contract, and no verified customer
              willingness-to-pay benchmark specific to a QI stellarator.

              A disciplined underwriting approach should therefore preserve the contradictions instead of hiding them.
              Germany's electricity-demand planning range varies meaningfully by scenario; fusion-capital datasets
              differ by cutoff date and methodology; and the sector is still proving whether early customer partnerships
              will convert into bankable project finance. The chapter conclusion is not that the market is small, but
              that Proxima's real commercial opportunity is best framed as a staged option on future firm-power
              procurement rather than a near- term revenue market.
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM034
              - CM035
              - CM036
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Fusion Landscape and Tiering
        blocks:
          - type: paragraph
            body: >-
              The fusion landscape is no longer a monolithic science race. FIA and F4E data show a rapidly growing field
              of private ventures with capital concentrated in a small number of leaders. Within that set, Proxima sits
              in a serious but not dominant tier: well ahead of most European peers on funding and visibility, but still
              behind the largest U.S.-led fusion programs on absolute capital, public customer proof, and
              commercial-readiness signals. The direct peer set breaks into three clusters. First are the large tokamak
              and alternative- confinement leaders — Commonwealth Fusion Systems, Helion, and TAE — that command the
              most capital and buyer attention. Second are the stellarator specialists — Type One Energy, Renaissance
              Fusion, and Proxima — that all sell the promise of steady-state operation and modern computational
              optimization. Third are other novel- approach challengers such as General Fusion, Zap Energy, and Tokamak
              Energy that can still capture the same clean firm-power buyers if they reach credible commercialization
              first.

              Proxima's position inside this field is unusual. It is one of very few private companies explicitly trying
              to turn stellarator science into a utility-grade power-plant company, and it does so with stronger public
              links to W7-X than any private peer. That gives the company real differentiation but not a clean moat,
              because Type One Energy and Renaissance Fusion are also framing stellarators as the stable,
              continuous-operation answer to tokamak disruption risk.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
              - CP019
