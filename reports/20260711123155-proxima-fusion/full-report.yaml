      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory clarity in Germany and the European Union is improving, but it is not finished. Germany has
              moved fusion into mainstream industrial-policy discussions through the Fusion Action Plan, the planned
              Fusion Hubs, and public statements about building a first fusion power plant domestically. At the same
              time, policy and legal commentary still describe the framework as emergent. Noerr notes calls for a
              dedicated legal framework outside traditional nuclear law, while the new ENSREG Task Force exists
              precisely because EU authorities are still assessing whether fusion-specific legal rules, engineering
              codes, and standards are needed.


              For Proxima, that means permitting risk is real even if the political tone is supportive. Gundremmingen
              benefits from existing nuclear infrastructure and an experienced utility partner, but reuse of a former
              fission site does not eliminate the need for approvals, safety cases, environmental review, and
              institutional learning. Legal issues also extend beyond siting: public-funding conditions, IP ownership in
              public-private projects, export-control exposure on strategic technologies, and future classification of
              fusion infrastructure as critical infrastructure could all shape cost, timing, or partner flexibility.
              None of these issues looks fatal today, but they introduce schedule and compliance uncertainty that a
              pre-revenue company cannot easily absorb.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
