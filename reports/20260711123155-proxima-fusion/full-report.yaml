  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Current Customer Landscape: Strategic Counterparties, Not Paying Customers'
        blocks:
          - type: paragraph
            body: >-
              Proxima does not yet have the kind of customer evidence a software or hardware company would normally show
              at this stage. No public source discloses signed electricity purchase agreements, pilot users paying for
              delivered output, recurring revenue, or contracted megawatt-hours. The company is still pre-commercial:
              its external relationships are best understood as a mix of strategic investors, prospective utility
              counterparts, scientific partners, and public-sector enablers. That distinction matters because the
              existence of a future market for firm, carbon-free electricity is not the same thing as proof that Proxima
              itself has converted that demand into enforceable commercial commitments.


              The named counterparties that matter most today are RWE, Google, the Max Planck Institute for Plasma
              Physics, Bavaria, and the broader Alpha Alliance ecosystem. RWE is the closest thing to a proto-customer
              because it invested capital, offered the Gundremmingen site pathway, and will contribute power-plant
              development experience. Google is meaningful as a strategic signal that hyperscalers care about
              long-duration clean power, but public evidence still frames Google as an investor in Proxima rather than
              an offtaker. IPP and Bavaria add science and public support, not recurring customer revenue.
