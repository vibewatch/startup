      - number: '8.3'
        title: Scenario Ranges and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              The central underwriting question is not whether fusion could someday be enormous; it is what today’s
              private equity should be worth before Alpha, before commercial offtake, and before plant economics are
              public. In the bull case, Proxima proves Alpha on a commercially relevant timetable, turns AI-optimized
              stellarator design into a defensible engineering moat, and converts RWE / Google / IPP credibility into
              broader utility and sovereign support. In that path, the current mark can look merely early. In the base
              case, progress continues but slips in time, capital intensity remains heavy, and valuation appreciation
              lags the magnitude of technical ambition. In the bear case, delays or better peer execution compress
              sector multiples and leave Proxima trading more like a highly regarded technology asset than a future
              platform winner.

              Sensitivity is therefore dominated by milestone probability, not by a neat multiple. Alpha schedule, HTS
              coil manufacturability, follow-on capital availability, and first hard customer commitments will move
              value more than broad energy narratives alone. The current round sits near the top of a defensible
              base-case range and below a genuine breakthrough-bull case, which is why the stance is stretched rather
              than absurd.
