      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Three buyer archetypes dominate Proxima's eventual commercialization path. First are utilities and public-
              interest power developers such as RWE, which care about dispatchable clean capacity, siting, permitting,
              system integration, and long-asset-life economics. Second are hyperscalers and other large compute
              operators, where Google's investment in Proxima and Google's separate 200 MW fusion power purchase
              commitment with CFS signal strategic interest in future firm zero-carbon electricity. Third are large
              industrial buyers, which are not yet contracting with Proxima but appear in sector narratives as future
              off-takers for high-load, round-the-clock clean power.

              Adoption timing differs by segment. Hyperscalers can sign long-dated strategic agreements before
              commercial operation if they believe the technology path is differentiated and power scarcity is
              worsening. Utilities move more slowly because they need confidence on licensing, construction risk,
              interconnection, and cost recovery. Industrial users often follow only after a utility or flagship
              developer has proven bankability. That makes Proxima's RWE relationship the clearest customer-adjacent
              signal today, while Google's participation is a valuable but less direct indicator of future demand. No
              public source yet shows signed Proxima PPAs, utility procurement wins, or disclosed price points.
            claimRefs:
