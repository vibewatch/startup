      - number: '8.4'
        title: Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The public record still leaves too much invisible to underwrite the round like a conventional late-stage
              company. The biggest missing items are the Alpha budget and contingency plan, expected spend through the
              next financing, commercial plant capex and LCOE assumptions, any cap-table preferences or investor
              protections, and the exact structure of partner rights with RWE, Google, IPP, and public funders. Those
              gaps matter because even a correct scientific thesis can produce weak equity outcomes if dilution, delay,
              or financing terms turn adverse.

              The main thesis-break triggers are concrete. A 24-plus month slip in Alpha or the model-coil stack would
              weaken the premise that Proxima is moving on a credible commercial clock. Evidence that commercial
              stellarator economics are worse than public alternatives, or that utilities prefer tokamak or non-fusion
              substitutes, would hurt the long-run multiple. A hard funding window shut for fusion, or clear
              grid-delivery leadership by Helion or CFS, would also compress Proxima’s optionality. Until those
              questions are answered, the right posture is continued tracking with disciplined curiosity rather than
              aggressive entry.
