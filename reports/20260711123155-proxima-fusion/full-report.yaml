              proxies: number of strategic counterparties, whether a site pathway exists, whether a demonstrator has
              government and partner support, and whether the company has progressed from generic market demand to named
              commercial negotiations.


              That also means durability is almost impossible to assess directly. There is no contract term to analyze,
              no renewal rate to inspect, and no product usage curve to observe. The durable signal is instead whether
              counterparties keep deepening involvement while the technical milestone stack remains open. RWE’s move
              from MoU partner to investor is positive on that front, but Proxima still lacks the binding commercial
              proof visible at Helion or the utility-backed LOI visible at Type One. Investors should therefore read the
              current chapter not as evidence of customer stickiness, but as evidence of which stakeholders might become
              first customers if Alpha succeeds.
