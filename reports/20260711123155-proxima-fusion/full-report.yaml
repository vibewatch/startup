      - number: '3.2'
        title: Proxima Versus Stellarator Peers and the Capital Leaders
        blocks:
          - type: paragraph
            body: >-
              Proxima's most direct conceptual competition is not every fusion company equally; it is the subset that
              can make a similar claim to stable, steady-state stellarator operation. Type One Energy is the sharpest
              direct comparator because it also targets a commercial stellarator plant for utility deployment and has an
              explicit relationship with TVA around the Infinity Two concept. Renaissance Fusion is smaller but
              important because it is the other visible continental-European stellarator startup and highlights that the
              stellarator narrative is no longer unique to Proxima. IEEE Spectrum's side-by-side treatment of Proxima
              and Type One captures the core trade-off: stellarators may offer operational simplicity once running, but
              they are notoriously difficult to design and manufacture.

              Against the sector's best-funded companies, Proxima competes on a different axis. CFS dominates on
              capital, customer visibility, and construction momentum; Helion dominates on disclosed commercial offtake;
              TAE dominates on longevity, team size, and non-power spinoff breadth. Proxima's counter-position is a more
              conservative, grid-oriented European story: leverage W7-X physics, use QI geometry plus HTS magnets, and
              pair with industrial and utility partners rather than promise an entirely new direct-conversion
              architecture or an aneutronic fuel breakthrough. That is strategically credible, but it also means Proxima
              must execute before its more mature or more commercial peers pre-empt the first generation of firm-power
              buyers.
