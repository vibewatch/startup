      - number: '8.2'
        title: Round Context and Peer Signal
        blocks:
          - type: paragraph
            body: >-
              The July 2026 financing gave Proxima one of the cleanest new private marks in fusion: €411 million raised
              at a €2.4 billion valuation, total funding above €650 million, and strategic participation from RWE and
              Google. That is a major achievement by European standards and helps explain why Proxima matters
              geopolitically as well as technically. Alpha and Gundremmingen also reduce the risk that the company
              remains a purely academic spinout with no visible path to industrial siting.

              Relative valuation context is less flattering. CFS has raised roughly $3 billion and converted that
              capital into SPARC construction, magnet manufacturing, and a 200 MW Google PPA. Helion has gone even
              further in financing and headline commercial signaling, reaching a $15.5 billion valuation after a $465
              million Series G while still carrying major execution skepticism. Type One and TAE sit on different proof
              curves, but they also show how much investor appetite now rewards site access, utility relationships, and
              repeat financing. Against that backdrop, Proxima deserves a premium to generic European deep tech, but not
              yet a proof-equivalent premium to the best- financed U.S. fusion leaders.
