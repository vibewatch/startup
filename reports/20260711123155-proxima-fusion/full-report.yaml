chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Product Thesis
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion presents itself as a commercialization vehicle for Europe’s stellarator research base
              rather than as a generic energy startup chasing a trend. Official materials say the company spun out of
              the Max Planck Institute for Plasma Physics in 2023 and was founded in April 2023 by former IPP, MIT, and
              Google X scientists and engineers. The legal imprint identifies Munich as the registered base and names
              Francesco Sciortino and Lucio Milanese as managing directors, while the public site places the operating
              footprint across Munich, Zurich, and Oxford. The core business proposition is narrow and capital
              intensive: Proxima wants to design and industrialize commercial fusion power plants built around
              quasi-isodynamic high-temperature-superconducting stellarators rather than sell near-term software,
              services, or reactor components as a standalone business.

              The product story is therefore really a reactor-platform story. Proxima’s website and 2025-2026 technical
              announcements frame Stellaris as the first integrated commercial stellarator power-plant concept and Alpha
              as the intermediate net-energy demonstrator that should validate the machine architecture before any
              commercial deployment. That makes the company’s current “product” a mix of engineering design, magnet
              development, procurement, and systems integration capabilities. The underlying thesis is that recent
              advances in stellarator optimization, high-temperature superconducting magnets, and simulation-driven
              engineering make it possible to move faster than the decades-long cadence of public fusion programs.
              Public sources support the technical coherence of this identity, but they also imply that the company
              remains pre-revenue and pre-product in the conventional commercial sense.
