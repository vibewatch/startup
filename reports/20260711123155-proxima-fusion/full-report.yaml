      - number: '1.3'
        title: Funding History, Stakeholders, and Capital Position
        blocks:
          - type: paragraph
            body: >-
              Proxima’s capital-formation story has accelerated unusually quickly for a pre-revenue fusion company. The
              official 2023 launch announcement disclosed a €7 million pre-seed round backed by Plural, UVC Partners,
              HTGF, and Wilbe. Less than a year later, the company announced a €20 million seed round led by redalpine
              with support from Bayern Kapital, DeepTech & Climate Fonds, the Max Planck Foundation, and existing
              investors. In June 2025 Proxima raised a €130 million Series A, then in July 2026 closed a €411 million
              Series A2 at a €2.4 billion valuation. By the run date, official and investor sources said total funding
              exceeded €650 million including €95 million in public grants.

              The strategic character of the syndicate matters as much as the headline amount. RWE’s €25 million
              investment came only months after the Bavaria-IPP-RWE memorandum on Alpha and Gundremmingen, making it
              more than passive financial participation. Google’s entry is an indirect customer signal, linking fusion
              to long-horizon hyperscaler power demand. KfW Capital and SPRIND add German public innovation backing,
              while Balderton, Cherry, Lightspeed, DST Global Partners, Burda, DTCF, redalpine, Leitmotif, Elaia, and
              the EIC Fund broaden private and quasi-public support. The main blind spots are still typical for private
              deep tech: there is no public cap table, no detailed governance-rights disclosure, and no externally
              verifiable return bridge from a €2.4 billion post-money valuation to commercially delivered electricity.
