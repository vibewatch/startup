      - number: '2.4'
        title: Growth Drivers, Constraints, and the European Context
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers for Proxima's target wedge are electricity-load growth, AI infrastructure,
              industrial electrification, and security-of-supply concerns. IEA demand work shows renewed electricity
              growth in advanced economies after a long stagnation period, with the EU expected to add roughly 300 TWh
              of demand through 2030. Clean Energy Wire's Germany-focused 2026 preview makes the same point from the
              opposite angle: Germany is still pushing renewables, storage, and decarbonization, but policymakers and
              analysts also expect additional firm capacity and flexibility to be necessary as coal exits and
              electrification proceeds. For a German stellarator company, that is a more relevant market signal than
              broad global climate rhetoric.

              The constraints are just as material. Fusion remains pre-commercial; most companies still target the end
              of the 2030s for first electricity to the grid, capital needs remain very high, and no fusion buyer can
              yet price the product from operating fleet data. Grid bottlenecks, supply-chain scaling, tritium
              fuel-cycle issues, and competition from cheaper renewables-plus-storage or advanced fission can all shrink
              the premium that utilities are willing to pay for first-generation fusion. Proxima's market narrative is
              therefore credible on direction but still unproven on timing and unit economics.
            claimRefs:
