  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Valuation Method
        blocks:
          - type: paragraph
            body: >-
              Proxima’s round should be judged with a venture infrastructure lens, not a software lens. There is no
              current revenue base, no public gross-margin profile, no disclosed LCOE target, and no visible cap-table
              structure that would support precision discounting. That means conventional DCF or revenue-multiple
              outputs would look rigorous while resting on assumptions the public record does not actually disclose. A
              milestone-adjusted scenario approach is more honest because it values the business as a sequence of
              physics, manufacturing, regulatory, and customer- proof gates rather than as an already-commercialized
              power company.

              Within that framework, Proxima still looks investable enough to follow closely. The science pedigree is
              elite, the European strategic backing is unusually strong, and the July 2026 round materially improved
              runway and signaling power. But the market-clearing price already assumes continued technical progress and
              continuing access to large-scale capital. For that reason the right call is track, not buy: the company
              can be strong while the entry price still demands more proof than public evidence currently offers.
            claimRefs:
              - CV001
