      - number: '3.4'
        title: Moat Durability, Displacement Risk, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              Proxima's moat claim rests on three pillars: first, W7-X-linked scientific credibility and a specific
              quasi-isodynamic stellarator thesis; second, one of the largest private capital bases in European fusion;
              third, strategic alignment with RWE, Bavaria, and a growing industrial partner network. Those are
              meaningful advantages, especially in Europe. But none of them is unassailable. Type One Energy is also
              selling stellarator steadiness to a utility. CFS and Helion may secure the category-defining early
              commercial reference points long before Proxima reaches Alpha. TAE, Tokamak Energy, and Zap offer
              alternative technical narratives that could win talent, suppliers, and investor mindshare even without
              matching Proxima's exact design path.

              The most likely adverse competitive outcome is schedule displacement rather than technological
              irrelevance. If Proxima slips on magnets, Alpha, or plant integration, buyers can sign with rival fusion
              companies or with non-fusion firm-power substitutes and still meet their reliability goals. Because public
              pricing is absent across most of the field, the near-term contest is about credibility, milestone
              velocity, and partner capture more than about product-level feature superiority. Proxima remains one of
              the strongest European contenders, but it has not yet earned a durable right to be the default fusion
              supplier.
