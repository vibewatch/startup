      - number: '1.2'
        title: Founders, Leadership, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is strong at the founder layer and thinner below it. Multiple official and
              investor-facing sources identify Francesco Sciortino as co-founder and CEO, Jorrit Lion as co-founder and
              chief scientist, Jonathan Schilling as co-founder and head of labs, Martin Kubie as co-founder and
              engineering leader, and Lucio Milanese as co-founder and senior operating executive. Burda’s July 2026
              investor note explicitly labels those five as the Proxima founders, while the company’s own legal imprint
              confirms Sciortino and Milanese as managing directors. The founder mix is notable because it combines
              plasma-physics depth with industrial and software talent recruited from McLaren, Google X, Tesla, SpaceX,
              and other engineering-heavy organizations. That is a useful pattern for a company trying to turn
              stellarator science into manufacturable hardware.

              The footprint has scaled quickly. Company materials moved from “more than 30 employees” in April 2024 to
              an “80+-strong team” in June 2025, then to “150+ world-class scientists, engineers, and operators” on the
              about page, and finally to “around 200 people” in July 2026 financing coverage. The sources are consistent
              on the direction of travel even if they are not perfectly aligned on the exact count. Geographically,
              Munich is clearly the anchor, but the Zurich and Oxford outposts matter because they sit next to the Paul
              Scherrer Institute magnet collaboration and the Culham fusion campus. The diligence implication is
              two-sided: Proxima appears able to attract scarce fusion and hardware talent across Europe, yet key-person
              dependence remains high because the public leadership bench outside the founders and managing directors is
              not fully disclosed.
