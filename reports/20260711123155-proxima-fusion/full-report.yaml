      - number: '4.4'
        title: Benchmarking Against the Fusion Peer Set
        blocks:
          - type: paragraph
            body: >-
              Relative benchmarking matters more than absolute valuation multiples because Proxima has no current
              revenue. Against the European field, Proxima is unusually well capitalized and likely the strongest
              private fusion financing story to date. Against the global leaders, the picture is more mixed. CFS,
              Helion, and TAE all operate with either larger disclosed capital bases, stronger public customer
              commitments, longer operating histories, or broader public-private support mechanisms. DOE's Milestone
              Program also highlights that several U.S. peers are embedded in a commercialization ecosystem designed to
              crowd in non-dilutive funding and later project capital.

              That leaves Proxima in a strong-but-still-dependent financial position. It has enough capital to be taken
              seriously, enough partner backing to reduce near-term financing stigma, and enough momentum to attract
              further capital if technical milestones are met. But it does not yet have the de-risked customer cash
              flows, public loan structures, or project-finance pathways that would make the commercialization path
              financially self-evident. Financially, Proxima is closer to a well- funded infrastructure R&D company than
              to a business with a near-term margin profile.
