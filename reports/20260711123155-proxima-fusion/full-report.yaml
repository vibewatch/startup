      - number: '4.3'
        title: Capital Adequacy, Runway Logic, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Proxima's financing trajectory has been unusually steep: €7 million pre-seed in 2023, €20 million seed in
              2024, €130 million Series A in 2025, and €411 million Series A2 in July 2026. By the run date, company and
              investor sources said total funding exceeded €650 million including €95 million in public grants. That is
              a very strong capital base for a European private fusion company and plausibly enough to fund the next
              stage of magnet and demonstrator preparation. It is not, however, proof that Proxima is financed all the
              way to a commercial plant.

              The core limitation is disclosure. Proxima does not publicly disclose current cash on hand, monthly burn,
              runway months, debt facilities, or project-finance commitments. Public sources do not reveal the budget
              for Alpha, the cash cost of the Model Coil program, or how much capital will be required after Alpha to
              reach a commercial plant. Sector evidence matters here: FIA reporting says 83% of fusion companies still
              view investment as a major challenge and that the median company expects to need about $700 million more
              to bring a first pilot plant online. Proxima is clearly better funded than the median, but it is also
              pursuing one of the most capital-intensive technology programs in Europe.
