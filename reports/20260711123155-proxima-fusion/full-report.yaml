      - number: '5.3'
        title: AI, Software, and the Engineering Stack
        blocks:
          - type: paragraph
            body: >-
              Proxima’s software story is substantive enough to count as a real technology layer, not just fundraising
              decoration. The company’s public technical pages describe StarFinder as a cloud design framework for
              rapidly iterating stellarator geometries, while its AI engineering write-up says the internal goal has
              moved from simulation-driven engineering toward a data-driven design loop. That loop matters because
              stellarator design is a high-dimensional search problem where the practical bottleneck is the cost of
              exploring design space quickly enough to trade off physics, manufacturability, and cost.


              The evidence of execution is unusually concrete for a hardware startup. Proxima says it trains surrogate
              models to stand in for expensive physics simulators, evaluates millions of candidate designs instead of
              hundreds, and has broadened software creation across the engineering org. The open ConStellaration dataset
              and GitHub tooling reinforce that claim: Proxima is putting QI-like boundary data, equilibria, and
              optimization benchmarks into an external ML-friendly format to attract broader algorithmic work. That does
              not eliminate the core physics risk, but it does make the company’s "AI advantage" more credible than the
              generic AI branding seen in many deep-tech pitches.
