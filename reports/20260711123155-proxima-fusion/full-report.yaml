      - number: '4.5'
        title: Disclosure Gaps and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The biggest financial diligence blockers are not subtle. There is no public cash balance, no audited burn
              rate, no Alpha capex budget, no disclosed plant-level LCOE, no power-pricing framework, no debt or
              project-finance stack, and no signed Proxima offtake contract that would let an investor underwrite
              revenue quality. Even the legal and ownership picture is only partially visible through the legal imprint
              and financing announcements; there is no public cap table, liquidation-preference structure, or
              board-rights map. These are normal gaps for a private fusion company, but they still block any
              conventional underwriting exercise.

              The right financial conclusion is therefore qualitative. Proxima looks sufficiently capitalized to remain
              one of Europe's leading private fusion contenders through the next technical phase, and the 2026 round
              materially improves its runway and credibility. But the company is still pre-revenue, hardware-heavy, and
              likely many financing events away from commercial operation. Without internal budget, burn, and
              cost-of-energy data, the prudent view is that Proxima is capital-advantaged for its stage, not
              capital-complete for its mission.
