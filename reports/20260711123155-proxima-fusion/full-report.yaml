  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Proxima's relevant market is not "all energy" and not today's private fusion financing market. The real
              boundary is long-duration, dispatchable, low-carbon electricity and associated project development
              spending for applications where intermittency is costly: regulated utilities replacing coal and gas
              baseload, hyperscale data-center operators seeking 24/7 clean power, and industrial buyers with very large
              continuous loads. Proxima's own materials and the RWE/Bavaria project framing reinforce that
              interpretation: the company is building toward Alpha and then a commercial stellarator plant, not toward
              licensing consumer software or selling laboratory equipment as the primary revenue line.

              This boundary matters because the substitutes are strong. Solar, wind, and batteries are already scaling
              quickly and will remain the default solution where intermittency can be tolerated or shifted. Advanced
              fission, gas-backed capacity, geothermal, and long-duration storage compete more directly for the
              firm-power wedge. That means Proxima only participates in the high-value slice of the market where
              dispatchability, land footprint, reliability, and carbon intensity all matter simultaneously. The broad
              electricity system may be measured in tens of thousands of terawatt-hours, but Proxima's realistic
              near-term market is a much narrower first-of-a-kind project and offtake market.
            claimRefs:
              - CM001
              - CM002
              - CM003
