      - number: '7.5'
        title: People, Execution, and Valuation Risk
        blocks:
          - type: paragraph
            body: >-
              Proxima's team is a strength, but it is also a concentration risk. Francesco Sciortino is the public face
              of the commercialization thesis, Lucio Milanese anchors the engineering narrative, and Ian Goodfellow
              makes the AI differentiation legible to investors. A company of roughly 200 people is not a one-person
              story, yet departures or visible fractures among this small set of leaders would matter materially to
              counterparties and future funders. The recruiting push itself also creates execution pressure: Proxima is
              scaling from research-intensive startup to a program that must coordinate manufacturing, operations,
              permitting, and industrial partnerships without losing design discipline.


              This people risk feeds directly into valuation risk. A €2.4 billion mark for a pre-revenue fusion company
              is defensible only while investors believe the company can continue clearing technical and partnership
              milestones faster than its risks compound. Because there is no revenue anchor, no project-finance cash
              flow, and no public cap-table detail, the valuation can re-rate sharply on either positive or negative
              milestones. A missed Alpha milestone, slower public-funding support, or stronger competing proof from
              peers could all compress the current mark long before Proxima has the chance to demonstrate a commercial
              plant. The prudent posture is therefore to treat today's valuation as milestone-contingent rather than
              durable.
            claimRefs:
              - CR037
              - CR038
              - CR039
