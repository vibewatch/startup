      - number: '2.2'
        title: Market Sizing and Demand Lenses
        blocks:
          - type: paragraph
            body: >-
              A single fusion TAM number would be misleading at this stage, so the right approach is to triangulate from
              several more observable lenses. The IEA projects global electricity demand to reach 33,600 TWh in 2030, up
              from 28,200 TWh in 2025, with average annual growth of 3.6% over 2026-2030. The same IEA work says data
              centers are among the fastest-growing drivers of load, while its energy-and-AI analysis projects
              data-center electricity consumption to double from around 415 TWh in 2024 to roughly 945 TWh by 2030.
              Gartner's 2026 point estimate of 565 TWh and 31% AI-server share offers a more near-term confirmation that
              compute load is already moving from a narrative to a budgeting issue.

              Fusion-specific market sizing is better viewed as capital mobilization and buyer behavior rather than
              present revenue. The FIA says fusion companies raised $2.64 billion in the 12 months to July 2025 and have
              drawn almost $9.8 billion cumulatively, while F4E's September 2025 observatory update puts global private
              fusion investment around €13 billion and highlights how concentrated that funding remains in the US and
              China. Europe's private ecosystem is materially smaller even though EU public fusion infrastructure is
              extensive. For Proxima, that means market size is clearly not the bottleneck in the abstract; conversion
              from research credibility into project capital and offtake timing is the real bottleneck.
