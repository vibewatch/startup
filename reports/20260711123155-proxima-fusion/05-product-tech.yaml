- id: roadmap-readiness-and-peer-context
  title: Roadmap, Readiness, and Peer Context
  body: |-
    The public roadmap places Proxima in a serious but still pre-demonstrator stage. The sequence visible across company pages, the MoU, and independent coverage runs from the peer-reviewed Stellaris concept in early 2025 to the Stellarator Model Coil checkpoint, then to Alpha in the early 2030s, and only after that to a commercial plant at Gundremmingen. That is exactly why the most defensible readiness framing is roughly TRL 3-4: the scientific basis has meaningful experimental precedent at W7-X and supporting literature, but the integrated product still lacks an operating high-field demonstrator, fuel-cycle proof, and maintainable plant hardware.

    Peer comparison sharpens the point. CFS’s tokamak path looks magnetically simpler and further along in build-out, while Type One shows Proxima is not the only team trying to commercialize a steady-state stellarator. Proxima’s edge is the combination of W7-X lineage, QI optimization, HTS compactness, and AI-heavy engineering; its weakness is that each of those advantages still has to survive hardware execution. The roadmap is therefore credible enough to justify technical diligence, but not mature enough to support project-finance style confidence.
