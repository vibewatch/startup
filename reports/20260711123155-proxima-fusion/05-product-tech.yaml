chapter:
  number: 5
  title: Product & Technology
  summary: Proxima Fusion is not selling a commercial power plant yet; its present product stack is a sequence of physics and engineering assets that must de-risk a quasi-isodynamic stellarator before revenue can exist. The strongest evidence is that Wendelstein 7-X and Proxima’s peer-reviewed Stellaris concept make the physics thesis scientifically credible, while the company’s StarFinder and ConStellaration software stack adds a genuine AI-enabled design edge. The main caution is that Alpha, the Stellarator Model Coil, tritium-breeding hardware, neutron-handling systems, and coil-manufacturing precision all remain pre-commercial hurdles, so the program looks like a TRL 3-4 technology platform rather than a bankable power product.
sections:
- id: product-surface-and-physics-thesis
  title: Product Surface and Physics Thesis
  body: |-
    Proxima’s actual product surface is a staircase rather than a finished plant. In public materials, the company sells a commercialization path built around a quasi-isodynamic stellarator family: the Stellarator Model Coil as a magnet and manufacturability checkpoint, Alpha as a net-energy demonstrator in Garching, and Stellaris as the eventual utility-scale power-plant concept. That framing matters because Proxima is not merely running physics experiments; it is trying to convert an academic stellarator lineage into a buildable industrial asset sequence that utilities, regulators, and infrastructure investors could eventually underwrite.

    The underlying physics proposition is clear and differentiated. Proxima argues that a quasi-isodynamic stellarator can run in steady state without depending on a strong toroidal plasma current, which lowers exposure to current-driven disruptions that are central to tokamak risk. The company’s case is not that stellarators are simpler than tokamaks—they are not—but that modern computing and optimization have finally made a previously intractable magnetic geometry engineerable. Wendelstein 7-X is the empirical bridge: it validated that optimized stellarators can reach world-class confinement metrics over long pulses, and Proxima’s product story is explicitly that Alpha and later Stellaris industrialize those lessons with stronger magnets and more integration discipline.
