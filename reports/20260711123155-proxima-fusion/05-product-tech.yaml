  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: alpha-specification
    missingEvidence: Detailed Alpha subsystem specifications covering heating, fueling, exhaust, shielding, and maintenance intervals.
    whyItMatters: Without subsystem detail, outside investors cannot test whether Alpha is a realistic bridge from W7-X science to commercial plant engineering.
    diligencePath: Request the latest Alpha system architecture deck, subsystem owners, and current design-review packages.
    relatedQuestionRefs:
