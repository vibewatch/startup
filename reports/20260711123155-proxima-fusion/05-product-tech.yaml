callouts:
- calloutType: strength
  title: W7-X is a real scientific anchor, not just a branding reference
  body: Proxima’s product claim is stronger than a generic fusion startup pitch because it inherits a concrete stellarator evidence base from W7-X, including long-pulse confinement records and proven modular-coil tolerances. That does not solve commercialization, but it materially upgrades the credibility of the physics thesis.
  claimRefs:
  - CE011
  - CE012
  - CE013
- calloutType: insight
  title: The most credible AI edge is design-speed compression
  body: Proxima’s AI story is persuasive when it is framed as surrogate modeling, simulation-to-data loops, and broad internal code creation—not when it is framed as generic “AI for fusion.” The GitHub and Hugging Face artifacts make that distinction visible.
  claimRefs:
  - CE017
  - CE018
  - CE020
  - CE021
  - CE022
- calloutType: risk
  title: Breeding blanket and neutron-handling risk sits outside the beautiful geometry
  body: Even a successful Alpha does not remove the need for tritium breeding, shielding, materials durability, and maintainable plant hardware. Those constraints remain the hardest bridge from stellarator science to bankable electricity infrastructure.
