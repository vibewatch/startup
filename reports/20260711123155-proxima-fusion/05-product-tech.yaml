- id: technical-risks-ip-and-defensibility
  title: Technical Risks, IP, and Defensibility
  body: |-
    The core technical risks are not obscure. Even if Alpha works, a commercial D-T plant will still need tritium breeding, neutron shielding, robust materials, maintainable blankets, and tightly controlled manufacturing quality. The strongest skeptical sources in this pack argue that commercial-fusion hype often understates those realities, especially the burden created by tritium inventories and 14-MeV neutron damage. Proxima’s own public materials rarely contest that risk directly; instead, they emphasize design progress and future milestones.

    Defensibility is therefore real but incomplete. Proxima appears to own differentiated know-how in QI optimization, datasets, and design software, and IEEE Spectrum reports that the company has applied for liquid-metal breeding-blanket IP. But public patent visibility is still thin enough that investors cannot yet map the estate the way they would in a mature semiconductor or biotech business. For now, the moat looks more like a bundle of W7-X-trained talent, proprietary design loops, academic partnerships, and first-mover European industrial positioning than a clearly legible issued-patent fortress.
