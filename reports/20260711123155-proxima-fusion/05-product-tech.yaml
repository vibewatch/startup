- id: magnets-architecture-and-buildability
  title: Magnets, Architecture, and Buildability
  body: |-
    The most important engineering bet in Proxima’s stack is the combination of QI geometry with high-temperature-superconducting magnets. Proxima’s official materials consistently argue that HTS fields allow a much smaller stellarator than prior generations, which matters because the historical knock on stellarators has been machine size and coil complexity. The company is therefore trying to win both on plasma configuration and on magnet intensity: stronger fields shrink the reactor envelope, while optimized coils preserve confinement quality.

    That does not mean the magnets are a solved procurement exercise. Proxima’s PSI agreement shows that the company is co-developing HTS know-how and a Stellarator Model Coil rather than simply buying an off-the-shelf magnet package. The published W7-X lineage also shows why this is hard: modular-coil tolerances were themselves a milestone for the research machine, and Alpha still has to prove that comparable precision can be repeated economically in a higher-field, more commercial architecture. In other words, the architecture is coherent, but its hardest buildability assumptions sit in magnets, coil winding, supports, neutron-facing systems, and maintenance concepts that the company has only partially disclosed publicly.
