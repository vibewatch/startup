  - type: private-evidence-only
    severity: material
    topic: magnet-manufacturing
    missingEvidence: Model Coil acceptance criteria, manufacturing yields, tolerances, supplier map, and quench-management plan.
    whyItMatters: The main hardware risk sits in coils and supports; public milestones do not yet show whether Proxima can manufacture them repeatedly and economically.
    diligencePath: Request model-coil test plans, key suppliers, QA protocols, and the latest FMEA for HTS coil production.
