evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, ownership concentration, liquidation preferences, and governance rights by financing round.
    whyItMatters: >-
      Capital intensity and long timelines make control rights and follow-on financing dynamics important to
      underwriting downside and dilution.
    diligencePath: Request the post-Series A2 cap table, shareholder agreement summary, and current board observer / voting map.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Any customer LOIs, utility memoranda, hyperscaler demand studies, or revenue-bearing engineering contracts.
    whyItMatters: >-
      Without customer evidence, valuation is driven almost entirely by technology and capital formation rather than
      market pull.
    diligencePath: >-
      Ask management for signed counterparties, commercial dialogues, and the planned go-to-market split between
      licensing, plant delivery, and operator partnerships.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A precise run-date employee count reconciling the 150+ and ~200 public disclosures.
    whyItMatters: Headcount is a proxy for burn, recruiting momentum, and execution capacity in deep-tech scale-up.
    diligencePath: Obtain the current HR census by location and function, plus historical monthly headcount since the 2025 Series A.
    relatedQuestionRefs:
      - QO006
      - QO024
  - type: missing-source
    severity: material
    topic: public-grants
    missingEvidence: An itemized schedule of the €95 million of public grants and the terms attached to Bavaria's planned co-financing.
    whyItMatters: >-
      Public capital may carry milestone conditions, procurement rules, or site-selection dependencies that alter the
      true runway.
    diligencePath: >-
      Request grant award letters, milestone disbursement schedules, and the specific public-funding commitments
      embedded in the Alpha roadmap.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO004
  - id: GM001
    question: What internal LCOE, capex, and pricing assumptions does Proxima use for Alpha and a commercial stellarator plant?
    impact: high
    whyUnresolved: No retained public source discloses Proxima-specific power pricing, unit economics, or bankability assumptions.
    nextStep: >-
      Request management model outputs, plant-level capex stack, and pricing sensitivity by utilization and financing
      cost.
