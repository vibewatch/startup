- id: named-proof-and-what-it-really-proves
  title: Named Proof and What It Really Proves
  body: |-
    RWE is the only named counterparty that credibly resembles a future commercial buyer or operator in Proxima’s own ecosystem. Its 2026 press release makes clear that the relationship goes beyond cap-table support: RWE had already signed the cooperation agreement, invested €25 million, and reaffirmed collaboration toward a commercial magnetic-fusion plant at Gundremmingen. That combination of site, utility experience, and capital is stronger than generic corporate venture participation. Even so, it is still not the same as a public PPA, option agreement, or disclosed delivery obligation.

    Google’s role is weaker as customer proof but stronger as demand signal. Coverage of the 2026 round consistently ties Google’s investment to long-term needs for abundant, firm, carbon-free energy—exactly the sort of demand profile created by data centers and AI infrastructure. But unlike Google’s separate 200 MW PPA with Commonwealth Fusion Systems, Proxima has not disclosed any offtake document, option to buy power, or capacity reservation with Google. That contrast is central to the chapter: Proxima has strategic credibility with the right counterparties, but not yet the public commercial paperwork that leading peers have shown.
