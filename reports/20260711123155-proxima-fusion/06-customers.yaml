- id: future-buyer-segments-and-expansion-logic
  title: Future Buyer Segments and Expansion Logic
  body: |-
    The future buyer map is conceptually attractive even if the current proof is thin. Utilities and grid operators want clean firm power that can complement intermittent renewables; hyperscalers want large, politically visible volumes of 24/7 carbon-free power; heavy industry wants reliable electricity and, eventually, possibly process heat. Public market signals show those buyer groups are already signing large nuclear and advanced-energy agreements to secure capacity for AI and industrial growth. Fusion benefits from that macro demand backdrop, especially in Europe where security of supply and industrial policy are major themes.

    But first-plant sales will almost certainly be bespoke, concentrated, and slow. A fusion plant is not a repeatable SaaS deployment; it is a site-specific infrastructure project with permitting, financing, and construction complexity. That makes expansion dependent on a successful reference project and one or two anchor buyers willing to tolerate technology risk. In practice, Proxima’s likely path is RWE-style utility partnership first, hyperscaler or industrial interest second, and only later a broader customer portfolio. The upside is large if the first relationship converts; the concentration risk is equally large if it does not.
