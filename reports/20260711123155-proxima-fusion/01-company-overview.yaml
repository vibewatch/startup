company:
  name: Proxima Fusion
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Proxima Fusion is a Munich-headquartered 2023 spinout from the Max Planck Institute for Plasma
    Physics building commercial fusion power plants around quasi-isodynamic high-temperature-
    superconducting stellarators. By July 2026 the company had raised a €411 million Series A2 at a
    €2.4 billion valuation, pushing total disclosed funding above €650 million, expanding the team to
    around 200 people across Munich, Zurich, and Oxford, and formalizing a Bavaria-RWE-IPP plan to
    build Alpha near Munich and a later Stellaris plant at Gundremmingen. The strongest caution is
    still sectoral rather than company-specific: public sources support the seriousness of the team,
    capital base, and roadmap, but they do not yet provide revenue, customer contracts, full governance
    disclosure, or proof that a stellarator company can compress fusion commercialization into the
    2030s without major schedule risk.
sections:
  - id: identity-origin-and-product
    title: Identity, Origin, and Product Thesis
    body: >-
      Proxima Fusion presents itself as a commercialization vehicle for Europe’s stellarator research base
      rather than as a generic energy startup chasing a trend. Official materials say the company spun out
      of the Max Planck Institute for Plasma Physics in 2023 and was founded in April 2023 by former IPP,
      MIT, and Google X scientists and engineers. The legal imprint identifies Munich as the registered
      base and names Francesco Sciortino and Lucio Milanese as managing directors, while the public site
      places the operating footprint across Munich, Zurich, and Oxford. The core business proposition is
      narrow and capital intensive: Proxima wants to design and industrialize commercial fusion power
      plants built around quasi-isodynamic high-temperature-superconducting stellarators rather than sell
      near-term software, services, or reactor components as a standalone business.

      The product story is therefore really a reactor-platform story. Proxima’s website and 2025-2026
      technical announcements frame Stellaris as the first integrated commercial stellarator power-plant
      concept and Alpha as the intermediate net-energy demonstrator that should validate the machine
      architecture before any commercial deployment. That makes the company’s current “product” a mix of
      engineering design, magnet development, procurement, and systems integration capabilities. The
      underlying thesis is that recent advances in stellarator optimization, high-temperature
      superconducting magnets, and simulation-driven engineering make it possible to move faster than the
      decades-long cadence of public fusion programs. Public sources support the technical coherence of
      this identity, but they also imply that the company remains pre-revenue and pre-product in the
      conventional commercial sense.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO017
      - CO027
    tableRefs:
      - TO001
