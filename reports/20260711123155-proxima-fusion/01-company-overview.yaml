  - id: roadmap-partnerships-and-milestones
    title: Roadmap, Partnerships, and Major Milestones
    body: >-
      The current roadmap is ambitious but unusually well specified in public compared with many fusion
      startups. Proxima’s own timeline points to completion of the Stellarator Model Coil in 2027,
      Alpha in the early 2030s, and a commercial Stellaris plant later in the 2030s. The February 2025
      Stellaris announcement described Alpha as a 2031 net-energy demonstration capable of continuous
      operation, while the July 2026 fundraising release shifted emphasis to building Alpha near Munich as
      the bridge between decades of research and a later commercial plant. That sequence gives investors a
      concrete de-risking ladder: model coil, integrated demonstrator, then commercial plant.

      Partnerships are central to whether that ladder is realistic. Proxima’s public-private tie-up with
      IPP grounds the plasma physics and W7-X inheritance. The Paul Scherrer Institute collaboration is
      aimed specifically at high-temperature-superconducting magnet development, which is one of the
      hardest enabling technologies in the whole stack. On the industrial side, RWE offers site,
      permitting, nuclear-infrastructure reuse, and power-plant execution experience. By July 2026 the
      company also described an Alpha Alliance of more than 50 industrial partners. The milestone logic is
      coherent: prove the magnet and engineering stack, validate Alpha, then industrialize around
      Gundremmingen. The open question is whether manufacturing, licensing, and financing can advance at
      the same pace as the design narrative.
    claimRefs:
      - CO005
