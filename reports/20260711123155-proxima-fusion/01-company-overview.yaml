  - id: critical-perspectives-and-open-gaps
    title: Critical Perspectives and Open Diligence Gaps
    body: >-
      The strongest public caution on Proxima is not an allegation of misconduct or a broken financing
      story; it is that stellarator commercialization still sits inside fusion’s long history of timeline
      slippage. Max Planck’s own feature on Proxima states that skepticism remains warranted because no
      research team has yet built a magnetic-confinement fusion reactor with net energy gain, and it
      explicitly notes the “fusion constant” critique that commercial fusion is always decades away.
      Energy Solutions Intelligence makes the same argument at the sector level: physics risk is shrinking,
      but most commercial pilots still point to 2035-2040 and stellarators remain exposed to complex coils,
      manufacturing precision, tritium breeding, and materials challenges. IEEE Spectrum’s stellarator
      comparison is more constructive, but it still emphasizes that stellarators are notoriously difficult
      to design and build even as AI and HTS magnets improve the toolset.

      Those warnings matter because Proxima’s public story is already transitioning from research novelty
      to industrial execution. The company has real capital, named partners, and a specific site pathway,
      but its public materials still do not disclose revenue, customer contracts, board composition,
      ownership concentration, or a full plant economics model. Headcount disclosures also show the usual
      fast-growth ambiguity, moving from 150+ to around 200 depending on source date. The right Chapter 1
      judgment is therefore cautiously constructive. Proxima looks like one of Europe’s most serious
      private fusion companies, yet investors still need to underwrite schedule risk, governance opacity,
      and the gap between a peer-reviewed concept and an operating net-energy demonstrator.
    claimRefs:
      - CO015
      - CO016
      - CO037
