      - number: '4.5'
        title: 披露缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              最大的财务尽调阻塞点并不微妙。公开信息没有现金余额、经审计烧钱率、Alpha 资本开支预算、电站层面 LCOE、电价框架、债务或项目融资栈，也没有 Proxima
              已签购电合同可供投资人承保收入质量。即便法律和所有权图景，也只能通过法律页和融资公告看到一部分；没有公开 股权结构表、清算优先权结构或董事会权利图。这些是私营聚变公司的正常缺口，但仍会阻断任何传统投资判断。

              因此，正确的财务结论是定性的。Proxima 看起来有足够资本，在下一技术阶段继续作为欧洲领先私营聚变竞争者之一；2026 年融资也显著改善了
              现金续航和可信度。但公司仍处于收入前，硬件很重，距离商业运行可能还需要多轮融资事件。没有内部预算、烧钱和能源成本数据，审慎观点应是：Proxima 在当前阶段拥有资本优势，但距离完成使命所需资金还未闭环。
