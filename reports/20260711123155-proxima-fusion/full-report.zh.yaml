      - number: '5.4'
        title: 路线图、就绪度与同业语境
        blocks:
          - type: paragraph
            body: >-
              公开路线图显示，Proxima 处在严肃但仍未进入验证装置的阶段。跨公司页面、MoU 和独立报道可见的序列，是从 2025 年初同行评议的 Stellaris 概念，到 Stellarator Model
              Coil 检查点，再到 2030 年代初 Alpha，之后才是 Gundremmingen 的商业电站。因此，最可辩护的就绪度框架约为 TRL 3-4：科学基础在 W7-X
              和支持文献中有有意义的实验先例，但集成产品仍缺少运行中的高场验证装置、燃料循环证明和可维护电站硬件。


              同业比较让这一点更清楚。CFS 的托卡马克路径在磁体上看起来更简单，建设进度也更靠前；Type One 则说明 Proxima 不是唯一想商业化稳态仿星器的团队。Proxima 的边缘优势是 W7-X 传承、QI
              优化、HTS 紧凑性和重 AI 工程的组合；弱点是每一项优势都还必须经受硬件执行。路线图因此足以支撑技术尽调，但还不足以支撑项目融资式信心。
