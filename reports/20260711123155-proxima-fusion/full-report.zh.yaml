      - number: '7.5'
        title: 团队、执行与估值风险
        blocks:
          - type: paragraph
            body: >-
              Proxima 的团队是优势，也是集中度风险。Francesco Sciortino 是商业化论点的公众面孔，Lucio Milanese 支撑工程叙事，Ian Goodfellow 让 AI
              差异化对投资人可读。一家约 200 人的公司不是单人故事，但这一小组领导者中若有人离开，或出现可见裂痕，都会对交易对手和未来出资方产生实质影响。招聘扩张本身也制造执行压力：Proxima
              正从研究密集型创业公司，扩成一个必须协调制造、运营、许可和工业伙伴，同时不丢失设计纪律的项目组织。


              团队风险会直接传导到估值风险。收入前聚变公司打到 €2.4B
              估值，只有在投资人相信它能持续跨过技术和伙伴里程碑、且速度快于风险累积时才站得住。没有收入锚点，没有项目融资现金流，也没有公开股权结构细节，估值可能随正面或负面里程碑急剧重估。Alpha
              里程碑落空、公共资金支持放慢，或同行拿出更强证明，都可能在 Proxima 有机会展示商业电站前很久，就压缩当前估值。审慎姿态因此是把今天的估值视为取决于里程碑，而不是稳定可持续。
