  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Proxima
              的相关市场既不是“所有能源”，也不是今天的私营聚变融资市场。真正边界是长时、可调度、低碳电力，以及相关项目开发支出，适用于间歇性代价高的应用：受监管公用事业替换煤电和燃气基荷、超大规模数据中心运营商寻找 24/7
              清洁电力，以及负荷极高且连续的工业买家。Proxima 自身材料和 RWE/Bavaria 项目框架强化了这一理解：公司在建设通向 Alpha
              和商业仿星器电站的路径，而不是把授权消费软件或出售实验室设备作为主收入线。

              边界重要，是因为替代品很强。太阳能、风电和电池已经快速规模化，在可以容忍或转移间歇性的场景，仍会是默认方案。先进裂变、燃气托底容量、地热和长时储能更直接争夺稳定电力缺口。这意味着 Proxima
              只参与其中高价值切片：可调度性、土地占用、可靠性和碳强度必须同时重要。广义电力系统可以用数万 TWh 衡量，但 Proxima 现实的近期市场要窄得多，是首创型项目和购电市场。
