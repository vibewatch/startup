  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Alpha / 模型线圈延误
        - 相比当前公开路径 >24 个月
        - 降低对 Proxima 跟上资本更充足同业的信心
        - 除非价格大幅重置，否则从观察转为回避
      - - 后续资本压力
        - 新资金只有在惩罚性条款或内部人主导救助条款下才进入
        - 表明连支持者也认为风险调整后上行减弱
        - 先重核下行，而不是上行
      - - 商业经济性不达预期
        - 内部 capex 或 LCOE 看起来结构性缺乏竞争力
        - 打破稳态仿星器经济性逻辑
        - 将公司视为科学资产丰厚、股权吸引力不足
      - - 同业电网级证明跨越 Proxima
        - Helion、CFS 或其他竞争者在 Proxima 仍处于示范前时拿到明显更强商业证明
        - 压缩相对稀缺价值和伙伴紧迫感
        - 提高要求回报门槛，或退出观望
    notes: 这些触发项有意设为运营性指标。长周期科学公司应按里程碑传导来判断，而不是按季度虚荣指标。
    claimRefs:
      - CV022
      - CV034
      - CV036
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Alpha 预算
        - 子系统 capex、预备金和进度关键路径
        - 需要用来检验当前资本是否足够跨过下一道证明门槛
        - CFO、项目控制和董事会材料
      - - 商业电站经济性
        - 内部 capex、LCOE、可用时间和维护假设
        - 判断仿星器经济性能否胜过替代方案的核心因素
        - 工程负责人和财务负责人
      - - 股权结构表和优先权
        - 清算顺位、反稀释、棘轮条款和伙伴权利
        - 名义估值可能高估普通股价值
        - 律师和资料室
      - - 伙伴经济安排
        - 与 RWE / Google / 公用事业方的任何预留权、期权权利或开发前经济安排
        - 硬客户证明会显著改善投资核算
        - BD 和商务负责人
      - - HTS 制造准备度
        - 良率、公差、供应商集中度和学习曲线数据
        - 制造现实对进度和成本的影响可能超过等离子体理论
        - CTO、磁体团队和供应商
      - - 监管路线图
        - 面向 Alpha 和后续电站的主管机关映射、许可顺序和法律意见
        - 宽泛政策叙事不等于项目专属审批路径
        - 外部律师和监管工作流
    notes: 没有这些问题的答案，投资者主要只能基于叙事、资历和品类动能来核算。
    claimRefs:
      - CV019
      - CV020
      - CV032
      - CV033
      - CV035
      - CV037
