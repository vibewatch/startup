      - number: '3.3'
        title: 替代品、多方下注与渠道力量
        blocks:
          - type: paragraph
            body: >-
              Proxima 的竞争集超出聚变。最终可能购买 Proxima 电力的公用事业和超大规模云厂商，也可以与先进裂变
              SMR、配储可再生能源、地热甚至燃气托底容量签约，只要脱碳要求有弹性。这些替代品重要，因为第一代聚变合同几乎必然稀缺且关系驱动。买方可以多方下注，一次支持多个选项，尤其是在协议属于战略性或有条件、而不是近期现货购买时。Google
              在聚变和先进能源选项上的行为清楚说明了这一点。

              这意味着今天几乎没有真正锁定。Proxima 尚未披露 PPA，没有可见的未来电力量选择权，也没有证据表明公用事业必须选择其仿星器路径而不是 托卡马克、FRC 或 SMR。另一方面，Proxima
              的欧洲公私网络——Bavaria、IPP、RWE、Alpha Alliance
              和后期成长投资人——确实在欧洲选址、工业合作和政策关注的特定语境下形成分发优势。问题是，这种区域渠道优势能否比美国竞争者的客户和融资渠道更快成熟。
