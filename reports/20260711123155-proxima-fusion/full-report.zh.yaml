        title: 与聚变同业集的基准比较
        blocks:
          - type: paragraph
            body: >-
              相对基准比绝对估值倍数更重要，因为 Proxima 当前没有收入。放在欧洲领域，Proxima 资本化水平异常高，很可能是迄今最强的私营聚变融资故事。放到全球龙头中，图景更复杂。CFS、Helion 和 TAE
              要么披露了更大的资本基础，要么有更强的公开客户承诺、更长运营历史，或更广泛的公私支持机制。DOE Milestone Program 也显示，几家美国同行已经嵌入一个旨在撬动非稀释资金和后续项目资本的商业化生态。

              这让 Proxima
              处在强但仍依赖外部融资的位置。它有足够资本让市场认真对待，有足够伙伴背书来降低近期融资污名，也有足够动能在技术里程碑达成时吸引后续资本。但它还没有去风险后的客户现金流、公共贷款结构或项目融资路径，无法让商业化路径在财务上自证。财务上，Proxima
              更接近资金充足的基础设施 R&D 公司，而不是一个近期已有利润率画像的业务。
