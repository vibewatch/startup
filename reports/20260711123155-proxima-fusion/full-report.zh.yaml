      - number: '8.2'
        title: 本轮融资背景与同业信号
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月融资给了 Proxima 一个聚变领域最干净的新私募标记之一：融资 €411M，估值 €2.4B，累计融资超过 €650M，且 RWE 和 Google
              参与战略投资。按欧洲标准，这是重大成就，也解释了为什么 Proxima 不只在技术上重要，在地缘政治上也重要。Alpha 和 Gundremmingen 还降低了公司停留在纯学术分拆、没有清晰工业选址路径的风险。

              相对估值背景没有那么好看。CFS 已融资约 $3B，并把资金转化为 SPARC 建设、磁体制造和一份 200 MW Google PPA。Helion 在融资和头部商业信号上走得更远，完成 $465M
              Series G 后估值达到 $15.5B，同时仍背负重大执行质疑。Type One 和 TAE
              处在不同证明曲线上，但它们同样说明，投资人现在多么奖励场址准入、公用事业关系和连续融资。在这种背景下，Proxima 相比普通欧洲深科技应享有溢价，但还不应享有与证据最强的美国聚变龙头等价的证明溢价。
