  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 科学与技术风险
        blocks:
          - type: paragraph
            body: >-
              Proxima 的主导风险仍是科学和工程执行。公司建立在可信的仿星器科学上，而不是空洞概念上，但这不等于已经证明出一个可融资的反应堆。Wendelstein 7-X、QI 文献和 Proxima
              自己的公开材料，都支持这样一种判断：仿星器相较托卡马克，有望提供稳态运行并降低破裂暴露。它们没有证明 Proxima 能在其叙事暗示的时间表内，把 HTS
              磁体、精密线圈制造、等离子体加热、耐中子材料、氚管理和可维护电站架构整合成一台商业机器。


              反向文献对剩余缺口说得很直白。EPRS 仍把聚变整体描述为低 TRL，并提示等离子体控制、燃料循环、材料、监管和经济性存在不确定性。Belfer
              认为，即便经过数十年投入和数百亿美元资金，实用聚变仍未跨过真正的发电盈亏平衡门槛，氚、中子损伤和电站经济性仍是被低估的障碍。即便乐观的仿星器专项论文，也把改进后的 QI
              几何形状表述为反应堆候选，而不是已解决产品。现实中，Alpha 是必要里程碑，不是充分条件：如果关键性能目标落空，或 Stellarator Model Coil 和磁体计划延误，整套投资逻辑都会变弱。
