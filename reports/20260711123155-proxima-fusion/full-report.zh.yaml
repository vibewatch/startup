      - number: '3.2'
        title: Proxima 与仿星器同行及资本龙头对比
        blocks:
          - type: paragraph
            body: >-
              Proxima 最直接的概念竞争，不是每一家聚变公司，而是能提出类似稳定、稳态仿星器运行主张的子集。Type One Energy 是最尖锐的直接参照，因为它也瞄准公用事业部署的商业仿星器电站，并围绕
              Infinity Two 概念与 TVA 建立明确关系。Renaissance Fusion 规模更小但重要，因为它是另一个可见的欧洲大陆仿星器创业公司，也说明仿星器叙事不再由 Proxima 独占。IEEE
              Spectrum 对 Proxima 和 Type One 的并列讨论抓住了核心权衡：仿星器运行后可能更简单，但设计和制造出了名地困难。

              面对行业融资最充足的公司，Proxima 在另一条轴线上竞争。CFS 在资本、客户能见度和建设动能上占优；Helion 在已披露商业购电上占优；TAE
              在存续时间、团队规模和非电力衍生业务广度上占优。Proxima 的反向定位，是一个更保守、面向电网的欧洲故事：借用 W7-X 物理基础，结合 QI 几何和 HTS
              磁体，并与工业和公用事业伙伴配对，而不是承诺全新的直接转换架构或无中子燃料突破。这一战略可信，但也意味着 Proxima 必须在更成熟或更商业化的同行预占第一代稳定电力买家之前执行到位。
