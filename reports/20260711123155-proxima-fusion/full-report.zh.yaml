        - 中
      - - 基准
        - 技术继续推进但出现延误；资金仍可获得；商业化推迟到 2040 年代中期
        - 1600-3000
        - 仍可能成为欧洲主要聚变公司，但股权上行兑现速度慢于本轮热度暗示
        - 高
      - - 悲观
        - Alpha 大幅延误，融资稀释加重，或竞争路线先赢得客户心智
        - 500-1500
        - 价值回落到技术、团队和战略期权资产，而非平台领导地位
        - 中
    notes: 这些数值是分析性的当前价值区间，不是管理层指引；它们反映里程碑概率、稀释风险和证据质量。
