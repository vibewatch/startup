      - number: '7.3'
        title: 制造、依赖与供应链风险
        blocks:
          - type: paragraph
            body: >-
              仿星器把一个困难的制造问题推到台前。Proxima 的架构依赖精密高场超导线圈、严格几何控制、先进低温与支撑系统，以及围绕 Alpha 扩大的工业基础。公开路线图承认，公司正在扩充 HTS
              电缆和磁体生产能力；Alpha Alliance 与 PSI
              关系也意味着，制造仍在去风险，而不是已经解决的采购事项。信号偏正面，但也意味着，在等离子体性能真正测试前，供应链不成熟、生产良率低或集成短板都可能带来进度风险。


              更深的担忧是集中度。少数战略参与方权重过高：IPP 提供科学合法性，RWE 提供场址和公用事业运营相关性，Bavaria 与 Berlin
              提供公共支持，欧洲工业伙伴负责设备和系统交付。任何一方放慢承诺，或关键材料、磁体组件、工程人才形成瓶颈，Proxima 都可能遭遇连锁延误。EPRS
              特别提示关键材料竞争、技能约束和建设可持续供应链的必要性；这些不是抽象行业风险，而是 Proxima 从设计优化走向硬件工业化时的即时执行约束。
