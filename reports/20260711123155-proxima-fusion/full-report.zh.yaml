  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This sample focuses on the five most decision-useful private fusion comparables with public 2025-2026 financing
        or customer-proof signals, not the entire global fusion field.
    columns:
      - 可比公司
      - 当前估值 / 资本信号
      - 商业证明信号
      - 与 Proxima 的关系
      - 局限
    rows:
      - - Proxima Fusion
        - €2.4B 估值；累计融资 >€650M
        - 有战略投资方和场址路径，但没有付费客户
        - 直接标的，也是当前轮次的最佳锚点
        - 收入前、示范装置前
      - - Commonwealth Fusion Systems
        - 已融资 $3B+；最新一轮 $863M；行业资本领导者
        - Google 200 MW PPA 和 SPARC/ARC 路线图
        - 资本最充足的磁约束同业
        - 托卡马克路径比 Proxima 的仿星器路径更成熟
      - - Helion Energy
        - $15.5B 估值；Series G 后累计资本 $1.5B
        - Microsoft PPA 和 Orion 场址，但技术上仍有大量争议
        - 私人聚变领域“证明 + 溢价”的上限参照
        - 脉冲架构不同，商业化叙事更激进
      - - Type One Energy
        - 据 TechCrunch 披露资本 $269M；TVA 和 Bull Run 场址路径
        - LOI / 公用事业选址和美国公私生态
        - 最接近的仿星器商业化参照
        - 融资规模仍处早期，地理区域不同
      - - TAE Technologies
        - 已融资 >$1.3B；最新一轮 $150M
        - 投资方支持强、技术历史长，但仍未商业化
        - 显示投资者愿意下注差异化非托卡马克路径
        - FRC 物理路线不同，当前私人估值不清晰
    notes: 这张表不是为了硬套单一倍数，而是显示哪些同业已经把资本转化为比 Proxima 当前更硬的证明。
