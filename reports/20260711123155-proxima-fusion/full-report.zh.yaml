  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值方法
        blocks:
          - type: paragraph
            body: >-
              评估 Proxima 本轮，应使用风险投资式基础设施视角，而不是软件公司视角。公司目前没有收入基础，没有公开毛利率画像，没有披露 LCOE 目标，也没有可支撑精确折现的可见股权结构。换句话说，传统 DCF
              或收入倍数输出会显得严谨，却建立在公开记录并未披露的假设上。更诚实的做法是用里程碑调整后的情景法：把业务估成一串物理、制造、监管和客户证明关口，而不是一家已经商业化的电力公司。

              在这个框架下，Proxima 仍值得投资人密切跟踪。科学血统顶级，欧洲战略背书异常强，2026 年 7
              月融资显著改善了现金跑道和信号力。但本轮成交价格已经假设技术继续推进，并且公司能持续获得大规模资本。因此，正确判断是观察，而不是买入：公司可以很强，但入场价仍要求比当前公开证据更多的证明。
