      - number: '4.3'
        title: 资本充足性、现金续航逻辑与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Proxima 的融资轨迹异常陡峭：2023 年 €7 million pre-seed，2024 年 €20 million seed，2025 年 €130 million Series A，以及 2026
              年 7 月 €411 million Series A2。截至报告生成日，公司和投资人来源称，包含 €95 million 公共补助在内的累计融资超过 €650
              million。对欧洲私营聚变公司来说，这是一块很强的资本底座，也有可能足以资助下一阶段的磁体和验证装置准备。但它并不证明 Proxima 已经拿到通往商业电站的全程资金。

              核心限制在披露。Proxima 没有公开披露当前手头现金、月度烧钱、现金续航月数、债务额度或项目融资承诺。公开来源没有揭示 Alpha 预算、Model Coil 项目的现金成本，或 Alpha
              之后抵达商业电站还需要多少资本。行业证据在这里重要：FIA 报告称，83% 的聚变公司仍把投资视为重大挑战，中位数公司预计还需要约 $700 million 才能让首座试点电站上线。Proxima
              显然比中位数资金更充足，但它也在推进欧洲最资本密集的技术项目之一。
