      - number: '1.4'
        title: 路线图、合作伙伴与重大里程碑
        blocks:
          - type: paragraph
            body: >-
              当前路线图雄心很大，但与许多聚变创业公司相比，公开信息异常具体。Proxima 自己的时间线指向 2027 年完成 Stellarator Model Coil、2030 年代初 Alpha，以及 2030
              年代后期商业 Stellaris 电站。2025 年 2 月 Stellaris 公告把 Alpha 描述为 2031 年可连续运行的净能量验证；2026 年 7 月融资稿则把重点转向在 Munich 附近建设
              Alpha，作为数十年研究和后续商业电站之间的桥梁。这一序列给投资人一条具体的去风险阶梯：模型线圈、一体化验证装置，然后是商业电站。

              合作是这条阶梯能否成立的核心。Proxima 与 IPP 的公私合作把等离子体物理和 W7-X 传承落到实处。与 Paul Scherrer Institute
              的合作专门瞄准高温超导磁体开发，这是整个技术栈最难的使能技术之一。工业侧，RWE 提供场址、许可、核基础设施复用和电站执行经验。到 2026 年 7 月，公司还描述了一个由 50 多家工业伙伴组成的 Alpha
              Alliance。里程碑逻辑是连贯的：证明磁体和工程技术栈，验证 Alpha，再围绕 Gundremmingen 工业化。开放问题是制造、许可和融资能否跟上设计叙事的速度。
