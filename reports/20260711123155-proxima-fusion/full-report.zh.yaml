    summary: Proxima 估值最敏感的是里程碑兑现和融资质量，而不是传统收入倍数。
    data:
      items:
        - label: Alpha 进度可信度
          value: 10
          detail: 当前价值最大的变量，因为它会改写商业化时间
        - label: 后续资本获取能力
          value: 9
          detail: 决定技术进展是复利累积，还是被稀释吃掉
        - label: 首个硬客户经济性
          value: 8
          detail: 承购或预留权会让投资测算大幅收紧
        - label: HTS 制造证明
          value: 8
          detail: 线圈良率和公差数据可降低成本与进度假设风险
        - label: 同业领先 / 落后信号
          value: 7
          detail: Helion、CFS 和 Type One 的相对进展会影响稀缺性溢价
    approximationNotes: 0-10 的序数评分概括哪些新证据最可能改变今天的投资判断。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于当前公开证据的熊、基准、牛三档当前价值区间。
    data:
      items:
        - label: 熊
          low: 500
          mid: 900
          high: 1500
          detail: 融资压力或重大时间表滑坡
        - label: 基准
          low: 1600
          mid: 2200
          high: 3000
          detail: 进展可信，但商业化仍很遥远
        - label: 牛
          low: 3500
          mid: 5000
          high: 8000
          detail: Alpha 成功、公用事业证明更强、资本胃口持续
    approximationNotes: 数值单位为百万美元，代表分析性的当前价值区间，不是未来退出价值或管理层指引。
    claimRefs:
      - CV001
      - CV008
      - CV023
      - CV024
      - CV025
      - CV035
