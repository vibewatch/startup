      - number: '1.5'
        title: 批判视角与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开材料中对 Proxima 最有力的警示，不是指控不当行为或融资故事破裂，而是仿星器商业化仍在聚变长期延误史之内。Max Planck 关于 Proxima
              的专题称，谨慎怀疑仍有必要，因为还没有任何研究团队造出实现净能量增益的磁约束聚变反应堆；它还明确提到“聚变常数”批评，即商业聚变总是在几十年之后。Energy Solutions Intelligence
              在行业层面给出相同论点：物理风险在下降，但多数商业试点仍指向 2035-2040 年，仿星器也仍暴露于复杂线圈、制造精度、氚增殖和材料挑战。IEEE Spectrum 的仿星器对比更具建设性，但仍强调，即便 AI
              和 HTS 磁体改善了工具箱，仿星器的设计和建造仍出了名地困难。

              这些警示重要，因为 Proxima
              的公开叙事已经从研究新颖性转向工业执行。公司有真实资本、具名伙伴和明确场址路径，但公开材料仍没有披露收入、客户合同、董事会构成、所有权集中度或完整电站经济模型。员工数披露也呈现高速增长常见的模糊性，随来源日期在
              150+ 到约 200 之间变化。因此，第一章的判断应当是谨慎建设性。Proxima
              看起来是欧洲最严肃的私营聚变公司之一，但投资人仍需要把进度风险、治理不透明，以及同行评议概念和运行中的净能量验证装置之间的差距纳入判断。
