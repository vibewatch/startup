      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              三个买方原型主导 Proxima 的最终商业化路径。第一类是 RWE
              这类公用事业和公共利益电力开发商，关心可调度清洁容量、选址、许可、系统集成和长寿命资产经济性。第二类是超大规模云厂商和其他大型计算运营商；Google 投资 Proxima，以及 Google 另行与 CFS
              签下 200 MW 聚变购电承诺，都显示其对未来稳定零碳电力的战略兴趣。第三类是大型工业买家；它们尚未与 Proxima 签约，但在行业叙事中会成为未来高负荷、全天候清洁电力的承购方。

              各细分采用时间不同。若相信技术路径差异化且电力稀缺加剧，超大规模云厂商可以在商业运行前签长期战略协议。公用事业推进更慢，因为它们需要许可、建设风险、并网和成本回收方面的信心。工业用户通常等公用事业或旗舰开发商证明可融资性后才跟进。因此，Proxima
              与 RWE 的关系是今天最清晰的准客户信号；Google 参与则有价值，但对未来需求的指示更间接。尚无公开来源显示 Proxima 签署 PPA、赢得公用事业采购，或披露价格点。
