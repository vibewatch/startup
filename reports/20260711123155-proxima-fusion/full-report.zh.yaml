      - number: '5.3'
        title: AI、软件与工程技术栈
        blocks:
          - type: paragraph
            body: >-
              Proxima 的软件故事足够实质，可以算作真正的技术层，而不只是融资装饰。公司公开技术页面把 StarFinder 描述为一个云端设计框架，用于快速迭代仿星器几何；AI
              工程文章则称，内部目标已经从仿真驱动工程转向数据驱动设计循环。这个循环重要，因为仿星器设计是高维搜索问题，实践瓶颈在于能否足够快地探索设计空间，在物理、可制造性和成本之间取舍。


              执行证据对硬件创业公司来说异常具体。Proxima 称，公司训练代理模型来替代昂贵的物理仿真器，评估数百万个候选设计而不是数百个，并把软件创建扩展到整个工程组织。开放的 ConStellaration 数据集和
              GitHub 工具进一步支撑这一说法：Proxima 正在把类似 QI 的边界数据、平衡态和优化基准放进外部 ML 友好格式，吸引更广泛的算法工作。这不能消除核心物理风险，但确实让公司的“AI 优势”比许多深科技
              pitch 中泛泛的 AI 品牌更可信。
