      - number: '6.4'
        title: 未来买方分层与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              即便当前证据仍薄，未来买方地图在概念上很有吸引力。公用事业公司和电网运营商想要能补足间歇性可再生能源的稳定清洁电力；超大规模云厂商想要大体量、政治可见度高的 24/7
              零碳电力；重工业需要可靠电力，未来还可能需要工艺热。公开市场信号显示，这些买方群体已经在签大型核能和先进能源协议，为 AI 和工业增长锁定容量。聚变受益于这层宏观需求背景，尤其在欧洲，供给安全和产业政策都是主线。


              但首座电站销售几乎必然是定制化、集中且缓慢的。聚变电站不是可复制的 SaaS
              部署，而是带有许可、融资和建设复杂度的场址型基础设施项目。扩张因此取决于一个成功的参考项目，以及一两个愿意承受技术风险的锚定买方。现实路径大概率是：先走 RWE
              式公用事业合作，再吸引超大规模云厂商或工业客户兴趣，最后才形成更宽的客户组合。首个关系转化后，上行空间很大；若不能转化，集中度风险同样很大。
