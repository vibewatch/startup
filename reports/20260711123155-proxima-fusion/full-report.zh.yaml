      - number: '4.2'
        title: 成本结构与单位经济性现实
        blocks:
          - type: paragraph
            body: >-
              公开成本结构容易定性描述，却很难精确定量。Proxima 正在 Munich、Zurich 和 Oxford 运营一个 150+ 到 200 人的深科技组织，同时投入 HTS
              磁体、模型线圈制造、云端设计系统、实验室，以及最终的净能量验证装置。这些不是软件式成本，而是以人员为重的 R&D 成本叠加硬件和设施开支。2026 年 7 月融资公告明确把资金投向 Stellarator
              Model Coil、HTS 电缆和磁体生产、工程与制造系统，有力说明资本开支和制造就绪支出是财务画像的核心。

              但单位经济性几乎完全不可观察。没有公开来源披露 Proxima 的目标 LCOE、电站资本开支、毛利率、维护成本、营运资本周期或每 MWh 预期实现价格。由于还没有售出任何商业 kWh，毛利率、CAC
              回收期、现金转换周期等标准指标不只是未公开——而是在结构上过早。最可辩护的结论是，Proxima 的最终经济性将远比创业软件报告中可见的任何指标，更依赖电站层面的资本效率、可靠性、融资成本和燃料循环假设。
