chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与产品命题
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion 把自己定位为欧洲仿星器研究基础的商业化载体，而不是追逐风口的普通能源创业公司。官方材料称，公司于 2023 年从 Max Planck Institute for Plasma
              Physics 拆分出来，由前 IPP、MIT 和 Google X 科学家与工程师在 2023 年 4 月创立。法律页把 Munich 列为注册地，并列明 Francesco Sciortino 和 Lucio
              Milanese 为董事总经理；公开网站则显示运营足迹覆盖 Munich、Zurich 和 Oxford。核心商业主张很窄，也很重资本：Proxima
              要设计并工业化以准等动力学高温超导仿星器为核心的商业聚变电站，而不是把近期软件、服务或反应堆部件作为独立业务来卖。

              因此，产品故事本质上是反应堆平台故事。Proxima 网站和 2025-2026 年技术公告把 Stellaris 定义为首个一体化商业仿星器电站概念，把 Alpha
              定义为中间的净能量验证装置，用来在任何商业部署前验证机器架构。因此，公司当前的“产品”更像工程设计、磁体开发、采购和系统集成能力的组合。底层论点是：仿星器优化、高温超导磁体和仿真驱动工程的近期进展，让行业有机会快过公共聚变项目几十年一轮的节奏。公开来源支撑这一身份的技术一致性，但也意味着公司按传统商业标准仍处于收入前、产品前阶段。
