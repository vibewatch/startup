      - number: '2.5'
        title: 规模不确定性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需要避免的主要尽调错误，是把巨大的最终电力市场误认为 Proxima 可直接测量的近期 SAM 或 SOM。公开来源支持一个长期庞大的清洁稳定电力市场，也支持买方围绕算力和可靠性的焦虑上升；但它们还不足以给出
              Proxima 在 2030 年代初可服务合同量的硬估计。公开信息没有 Proxima 的 LCOE 区间、定价架构、已签购电合同，也没有针对 QI 仿星器的、已验证客户支付意愿基准。

              有纪律的投资判断应保留这些矛盾，而不是掩盖。德国电力需求规划区间随情景显著变化；聚变资本数据集因截止日期和方法不同而不一致；行业仍在证明早期客户合作能否转化为可融资的项目融资。本章结论不是市场小，而是
              Proxima 的真实商业机会更适合被定义为未来稳定电力采购的分阶段期权，而不是近期收入市场。
