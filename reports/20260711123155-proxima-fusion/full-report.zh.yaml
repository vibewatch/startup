      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              德国和欧盟的监管清晰度在提高，但还没有完成。德国通过 Fusion Action Plan、计划中的 Fusion
              Hubs，以及关于在本国建设首座聚变电站的公开表态，把聚变纳入主流产业政策讨论。与此同时，政策和法律评论仍把框架描述为正在形成。Noerr 记录了要求在传统核能法律之外建立专门法律框架的呼声；新的 ENSREG
              Task Force 之所以存在，正是因为欧盟主管机构仍在评估是否需要聚变专属法律规则、工程规范和标准。


              对 Proxima 而言，即便政治口径支持，许可风险也是真实的。Gundremmingen
              受益于既有核设施和经验丰富的公用事业伙伴，但复用前裂变场址并不能免除审批、安全论证、环境评估和机构学习。法律问题还不止于选址：公共资金条件、公私合作项目中的 IP
              所有权、战略技术的出口管制暴露，以及未来把聚变基础设施归类为关键基础设施，都可能影响成本、时间或伙伴灵活性。今天看，上述问题都不像致命项，但它们带来的进度和合规不确定性，是一家收入前公司很难轻松吸收的。
