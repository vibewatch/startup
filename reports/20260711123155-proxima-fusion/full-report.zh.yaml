      - number: '8.4'
        title: 尽调追问与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              公开记录仍留下太多不可见内容，无法像传统后期公司那样承销本轮。最大的缺项包括 Alpha 预算和应急方案、到下一轮融资前的预计支出、商业电站 capex 和 LCOE 假设、任何股权结构优先权或投资人保护，以及
              RWE、Google、IPP 和公共资金方伙伴权利的具体结构。缺口之所以重要，是因为即便科学论点正确，一旦稀释、延误或融资条款恶化，股权结果仍可能很弱。

              主要投资逻辑破裂触发点很具体。Alpha 或模型线圈栈延误 24 个月以上，会削弱 Proxima
              正按可信商业时钟推进的前提。如果证据显示商业仿星器经济性差于公开替代方案，或公用事业公司更偏好托卡马克或非聚变替代品，长期倍数会受损。聚变融资窗口硬关闭，或 Helion / CFS
              在并网交付上明显领先，也会压缩 Proxima 的可选性。在上述问题得到回答前，正确姿态是带纪律的好奇和持续跟踪，而不是激进入场。
