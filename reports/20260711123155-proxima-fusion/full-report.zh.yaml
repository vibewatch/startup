      - number: '8.3'
        title: 情景区间与敏感性
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是聚变有朝一日是否可能很大，而是 Alpha 之前、商业承购之前、电站经济性公开之前，今天的私人股权值多少钱。乐观情景下，Proxima 按商业相关时间表证明 Alpha，把 AI
              优化的仿星器设计变成可防守的工程护城河，并把 RWE / Google / IPP
              可信度转化为更广泛的公用事业和主权支持。沿这条路径，当前估值可能只是显得早。基准情景下，进展继续但时间滑坡，资本强度仍重，估值升值落后于技术雄心的量级。悲观情景下，延误或同行执行更好会压缩行业倍数，让
              Proxima 更像一项备受认可的技术资产，而不是未来平台赢家。

              因此，敏感性主要由里程碑概率主导，而不是一个整齐的倍数。Alpha 进度、HTS
              线圈可制造性、后续资本可得性，以及首批硬客户承诺，会比宽泛能源叙事更能推动价值。当前轮次位于可辩护基准情景区间的上沿，低于真正突破式乐观情景，所以姿态是偏高，而不是荒唐。
