      - number: '5.5'
        title: 技术风险、IP 与防御性
        blocks:
          - type: paragraph
            body: >-
              核心技术风险并不隐晦。即便 Alpha 成功，商业 D-T 电站仍需要氚增殖、中子屏蔽、坚固材料、可维护包层，以及严格受控的制造质量。本材料包中最强的怀疑来源认为，商业聚变炒作 常常低估这些现实，尤其是氚库存和
              14-MeV 中子损伤带来的负担。Proxima 自身公开材料很少直接反驳这种风险；相反，它强调设计进展和未来里程碑。


              因此，防御性真实存在但不完整。Proxima 看起来拥有 QI 优化、数据集和设计软件方面的差异化技术诀窍；IEEE Spectrum 报道称，公司已申请液态金属增殖包层
              IP。但公开专利能见度仍然很薄，投资人还无法像在成熟半导体或生物技术企业中那样绘制专利资产。眼下，护城河更像一组 W7-X 训练出的人才、专有设计循环、学术伙伴和欧洲先发工业定位，而不是清晰可读的已授权专利堡垒。
