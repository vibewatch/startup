  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接聚变格局与分层
        blocks:
          - type: paragraph
            body: >-
              聚变格局不再是一场单一科学竞赛。FIA 和 F4E 数据显示，私营公司快速增多，资本集中在少数头部公司。在这一群体中，Proxima
              处在严肃但并非主导的层级：在欧洲多数同行中，融资和能见度明显领先；但在绝对资本、公开客户证据和商业就绪信号上，仍落后于美国主导的最大聚变项目。直接可比公司分成三组。第一组是大型
              托卡马克和替代约束路线龙头——Commonwealth Fusion Systems、Helion 和 TAE——它们拿到最多资本和买方注意力。第二组是仿星器专注公司——Type One
              Energy、Renaissance Fusion 和 Proxima——都在出售稳态运行和现代计算优化的承诺。第三组是其他新路线挑战者，如 General Fusion、Zap Energy 和 Tokamak
              Energy；如果率先实现可信商业化，它们也能争夺同一批清洁稳定电力买家。

              Proxima 在这个领域的位置很特别。它是少数明确想把仿星器科学变成公用事业级电站公司的私营公司之一，并且与 W7-X 的公开联系强于任何私营同行。这给了公司真实差异化，但不是干净护城河，因为 Type One
              Energy 和 Renaissance Fusion 也把仿星器包装成针对 托卡马克扰动风险的稳定、连续运行答案。
