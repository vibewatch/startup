            title: RWE 不只是一个标志性投资方
            body: RWE 是唯一一个把公用事业可信度、场址准入和融资一致性压缩到同一关系里的具名交易对手。因此，它远比普通战略投资方条目重要，尽管它距离已披露购电合同仍有差距。
