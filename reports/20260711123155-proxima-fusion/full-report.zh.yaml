  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Proxima 在战略重要性和科学质量上得分较高，但当前证明和估值支撑明显弱得多。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: 数据中心和工业基荷需求支撑这一品类
        - label: 技术谱系
          score: 8
          detail: IPP 和 W7-X 传承异常可信
        - label: 客户证明
          score: 4
          detail: 存在战略伙伴，但尚无付费客户
        - label: 制造就绪度
          score: 4
          detail: HTS 线圈工业化大多还没跑通
        - label: 融资深度
          score: 6
          detail: 在欧洲很强，但厚度不及美国头部玩家
        - label: 监管清晰度
          score: 3
          detail: 法律路径在改善，但仍不完整
        - label: 证据质量
          score: 5
          detail: 融资事实清楚；经济性和股权结构不清楚
        - label: 估值支撑
          score: 4
          detail: 当前估值接近可辩护基准区间上沿
    approximationNotes: 评分为投资委员会框架下的 0-10 序数判断。分数越高越好。
    claimRefs:
      - CV010
