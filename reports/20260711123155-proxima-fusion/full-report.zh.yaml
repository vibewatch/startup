      - number: '5.2'
        title: 磁体、架构与可建造性
        blocks:
          - type: paragraph
            body: >-
              Proxima 技术栈里最重要的工程赌注，是把 QI 几何与高温超导磁体结合。Proxima 官方材料一贯认为，HTS
              场强可以让仿星器比前几代小得多；这很关键，因为历史上仿星器被诟病的正是机器尺寸和线圈复杂度。因此，公司试图在等离子体构型和磁场强度两端同时取胜：更强场让反应堆包络缩小，优化线圈则保住约束质量。


              但这并不意味着磁体已变成一个可直接采购的已解问题。Proxima 与 PSI 的协议显示，公司在共同开发 HTS 技术诀窍和 Stellarator Model Coil，而不是简单购买现成磁体包。已发表的
              W7-X 传承也说明难点所在：模块化线圈公差本身就是这台研究机器的里程碑，Alpha
              还必须证明，在更高场强、更商业化的架构中，类似精度可以经济地重复。换句话说，架构是连贯的，但最难的可建造性假设落在磁体、线圈绕制、支撑、面向中子的系统和维护概念上，而公司只公开披露了一部分。
