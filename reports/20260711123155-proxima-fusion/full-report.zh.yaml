      - - Helion Energy
        - 直接竞争——替代约束
        - 多轮大额私募融资基础；最新公开融资包括 2026 年 $465M Series G
        - 超大规模云厂商、工业客户、稳定清洁电力买方
        - 全球首个公开聚变 PPA 绑定 Microsoft，叠加直接转换叙事
        - 物理路径不同，执行有风险，也没有稳态仿星器主张
      - - TAE Technologies
        - 直接竞争——替代约束
