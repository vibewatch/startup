      - number: '2.4'
        title: 增长驱动、约束与欧洲语境
        blocks:
          - type: paragraph
            body: >-
              Proxima 目标切片最强需求驱动来自电力负荷增长、AI 基础设施、工业电气化和能源安全担忧。IEA 需求研究显示，发达经济体经历长期停滞后电力需求重新增长，EU 预计到 2030 年将增加约 300 TWh
              需求。Clean Energy Wire 面向德国的 2026
              年前瞻从相反角度给出同一结论：德国仍在推进可再生能源、储能和脱碳，但政策制定者和分析师也预期，随着煤电退出、电气化推进，额外稳定容量和灵活性将成为必要。对一家德国仿星器公司来说，这比宽泛的全球气候修辞更有市场意义。

              约束同样实质。聚变仍未商业化；大多数公司仍把首次并网发电瞄准 2030
              年代末；资本需求仍很高；没有聚变买家能基于运行机组数据给产品定价。电网瓶颈、供应链扩张、氚燃料循环问题，以及更便宜的可再生能源加储能或先进裂变竞争，都可能压缩公用事业愿为第一代聚变支付的溢价。Proxima
              的市场叙事在方向上可信，但在时间和单位经济性上仍未验证。
