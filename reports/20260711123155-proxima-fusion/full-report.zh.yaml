      - number: '1.3'
        title: 融资历史、利益相关方与资本位置
        blocks:
          - type: paragraph
            body: >-
              对一家未产生收入的聚变公司来说，Proxima 的资本形成速度异常快。2023 年官方发布披露了 €7 million pre-seed 轮，投资方包括 Plural、UVC Partners、HTGF 和
              Wilbe。不到一年后，公司宣布由 redalpine 领投的 €20 million seed 轮，Bayern Kapital、DeepTech & Climate Fonds、Max Planck
              Foundation 和既有投资人参与。2025 年 6 月，Proxima 完成 €130 million Series A；2026 年 7 月，又以 €2.4 billion 估值完成 €411
              million Series A2。截至报告生成日，官方和投资人来源称，包含 €95 million 公共补助在内的累计融资超过 €650 million。

              投资方组合的战略属性不亚于融资金额本身。RWE 的 €25 million 投资发生在 Bavaria-IPP-RWE 关于 Alpha 和 Gundremmingen
              的备忘录之后仅数月，因此不只是被动财务参与。Google 入局是间接客户信号，把聚变和超大规模云厂商的长期电力需求连接起来。KfW Capital 和 SPRIND
              带来德国公共创新背书，Balderton、Cherry、Lightspeed、DST Global Partners、Burda、DTCF、redalpine、Leitmotif、Elaia 和 EIC Fund
              扩大了私营与准公共支持。主要盲点仍是私营深科技常见问题：没有公开股权结构表，没有详细治理权利披露，也没有外部可验证的回报桥，把 €2.4 billion 投后估值连到商业交付的电力。
