      - number: '6.5'
        title: 本章结论
        blocks:
          - type: paragraph
            body: >-
              客户结论很直接：Proxima 拥有吸引人的战略交易对手，但严格商业意义上的客户证明还没有出现。RWE 是最重要的关系，因为它把场址准入、公用事业可信度和未来买方逻辑压缩到一个交易对手身上。Google
              重要，是因为它验证了 AI 重负荷电力市场里对稳定清洁电力的长期需求叙事。但当前两段关系都不能替代已披露的 PPA、LOI 或收入合同。


              和公开声量最高的聚变同行相比，Proxima 早了一个阶段。CFS 可以指向同时作为投资方和 PPA 交易对手的 Google，Helion 可以指向 Microsoft，Type One 可以指向 TVA 的
              LOI。Proxima 能指向投资方 / 伙伴的一致性，以及一个可信的首个场址论点。这种一致性有价值，但也意味着商业牵引仍必须靠 Alpha、许可进展和未来锚定承购协议来兑现。
            claimRefs:
              - CU005
              - CU007
              - CU014
