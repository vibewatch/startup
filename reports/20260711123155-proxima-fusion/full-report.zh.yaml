      - number: '2.2'
        title: 市场规模与需求观察口径
        blocks:
          - type: paragraph
            body: >-
              现阶段给一个单一聚变 TAM 数字会误导，正确做法是从几个更可观察的口径交叉验证。IEA 预计全球电力需求将从 2025 年 28,200 TWh 增至 2030 年 33,600 TWh，2026-2030
              年平均年增长率为 3.6%。同一份 IEA 工作称，数据中心是负荷增长最快的驱动因素之一；其能源与 AI 分析预计，数据中心用电量将从 2024 年约 415 TWh 翻倍至 2030 年约 945
              TWh。Gartner 对 2026 年 565 TWh 和 AI 服务器占比 31% 的点估计，更近距离地确认了计算负荷已经从叙事变成预算问题。

              聚变专属市场规模更应看作资本动员和买方行为，而不是当前收入。FIA 称，聚变公司在截至 2025 年 7 月的 12 个月内融资 $2.64 billion，累计吸引近 $9.8 billion；F4E 2025
              年 9 月观测更新则把全球私营聚变投资放在约 €13 billion，并强调资金仍高度集中于美国和中国。欧洲私营生态规模明显更小，尽管 EU 公共聚变基础设施很丰富。对 Proxima
              来说，这意味着抽象意义上的市场规模显然不是瓶颈；真正瓶颈是把研究可信度转化为项目资本和购电时点。
