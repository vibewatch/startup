      - number: '3.4'
        title: 护城河耐久性、被替代风险与开放问题
        blocks:
          - type: paragraph
            body: >-
              Proxima 的护城河主张立在三根支柱上：第一，与 W7-X 相连的科学可信度，以及明确的准等动力学仿星器论点；第二，欧洲聚变领域最大的私营资本基础之一；第三，与 RWE、Bavaria
              和不断扩大的工业伙伴网络形成战略对齐。这些优势有意义，尤其在欧洲。但没有一项牢不可破。Type One Energy 也在向公用事业出售仿星器稳定性。CFS 和 Helion 可能早在 Proxima 抵达
              Alpha 前，就拿下定义品类的早期商业参考点。TAE、Tokamak Energy 和 Zap 提供替代技术叙事，即使不复制 Proxima 的具体设计路径，也可能赢走人才、供应商和投资人心智。

              最可能的不利竞争结果不是技术无关化，而是进度被挤出。如果 Proxima 在磁体、Alpha
              或电站集成上滑期，买方可以与竞争聚变公司或非聚变稳定电力替代品签约，仍然满足可靠性目标。由于行业大多数公司都缺少公开定价，近期竞争重点不是产品级功能优劣，而是可信度、里程碑速度和伙伴锁定。Proxima
              仍是欧洲最强竞争者之一，但尚未赢得成为默认聚变供应商的持久权利。
