        - 公用事业、工业客户、电力管理相邻市场
        - 运营历史长，FRC 差异化，衍生业务，团队大
        - p-B11 路径和非仿星器设计带来完全不同的技术风险
      - - General Fusion
        - 直接竞争——替代约束
        - 20 多年研发；LM26 瞄准 2030 年代中期电站路线图
        - 公用事业和电网级基荷
        - 磁化靶聚变和长期原型历史
        - 商业拉动可见度较低，披露势头弱于头部公司
      - - Zap Energy
        - 直接竞争——替代约束
        - FIA 2025 画像披露融资 $338M；150 名员工
        - 模块化电力开发商和电网级能源
        - 不用超导磁体或激光；低成本紧凑叙事
        - 仍需证明从等离子体进展到商业电站设计的路径
      - - Tokamak Energy
        - 直接竞争——托卡马克
        - FIA 2025 画像披露融资 $335M；280 名员工
        - 电网、政府、HTS 磁体客户
        - 球形托卡马克，加 HTS 磁体业务线和长期运营历史
        - 撇开 Cloudflare 式网站封锁，公开证据仍未显示已披露 PPA
      - - ITER
        - 相邻基准 / 公共项目
        - €20B+ 多国公共项目规模；数十年公共基础设施
        - 提供研究和行业可信度，而非客户
        - 最大的公共聚变基准和供应链锚点
        - 不是商业竞争者，节奏也远慢于私营公司时间表
