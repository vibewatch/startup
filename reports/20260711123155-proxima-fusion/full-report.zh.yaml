  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与当前状态
        blocks:
          - type: paragraph
            body: >-
              Proxima 在任何保留的公开来源中都没有披露当前产品收入、ARR、GMV
              或客户付款。公司现阶段的产出是工程里程碑、磁体开发、电站设计和公私项目形成，而不是已售电力。公司把自己定位为聚变电站建造者，这意味着最终主要收入流很可能来自商业仿星器资产的售电，路径可能是长期购电协议或项目公司结构。RWE
              角色和 Gundremmingen 路径强化了这种公用事业级商业化框架，但今天不提供收入。

              第二个变现问题是，Proxima 最终会出售整座电站、授权技术、共同开发项目，还是自己做发电商。公开来源没有回答。公司明确讨论 Alpha、Stellaris、HTS 电缆、模型线圈、AI
              赋能工程和工业伙伴关系，但没有发布标价、每兆瓦经济模型，也没有披露可与 Helion-Microsoft PPA 或 CFS-Google PPA 对比的合同形式。现实中，当前业务是被融资支持的 R&D
              加工业化，不是商业能源交付。
