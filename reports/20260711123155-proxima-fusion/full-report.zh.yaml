      - number: '1.2'
        title: 创始人、领导层与运营足迹
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息在创始人层面很强，往下就变薄。多份官方和面向投资人的来源显示，Francesco Sciortino 为联合创始人兼 CEO，Jorrit Lion 为联合创始人兼首席科学家，Jonathan
              Schilling 为联合创始人兼实验室负责人，Martin Kubie 为联合创始人兼工程负责人，Lucio Milanese 为联合创始人兼高级运营高管。Burda 2026 年 7
              月投资人说明明确将这五人列为 Proxima 创始人，公司法律页也确认 Sciortino 和 Milanese 为董事总经理。创始团队组合值得注意：既有等离子体物理深度，也有来自 McLaren、Google
              X、Tesla、SpaceX 等重工程组织的工业和软件人才。对一家想把仿星器科学变成可制造硬件的公司来说，这是有用配置。

              运营足迹扩张很快。公司材料从 2024 年 4 月的“超过 30 名员工”，到 2025 年 6 月的“80+ 人团队”，再到官网介绍 页面上的“150+ 名世界级科学家、工程师和运营人员”，最后到 2026 年
              7 月融资报道中的“约 200 人”。这些来源对趋势一致，虽然具体人数并不完全对齐。地理上，Munich 显然是锚点，但 Zurich 和 Oxford 网点也重要，因为它们贴近 Paul Scherrer
              Institute 磁体合作和 Culham 聚变园区。尽调含义是双向的：Proxima 看起来能在欧洲吸引稀缺的聚变和硬件人才，但关键人依赖仍高，因为创始人和董事总经理之外的公开领导梯队尚未完整披露。
