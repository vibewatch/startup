              Proxima 还没有软件或硬件公司在这个阶段通常会展示的客户证据。没有公开来源披露已签购电协议、为交付产出付费的试点用户、经常性收入或已签约
              MWh。公司仍处于商业化前：其外部关系最好理解为战略投资人、潜在公用事业交易对手、科学伙伴和公共部门推动者的组合。这个区分重要，因为未来稳定无碳电力市场存在，不等于 Proxima
              自身已经把这种需求转化成可执行商业承诺。


              今天最重要的具名交易对手是 RWE、Google、Max Planck Institute for Plasma Physics、Bavaria，以及更广泛的 Alpha Alliance 生态。RWE
              最接近原型客户，因为它投入资本、提供 Gundremmingen 场址路径，并将贡献电站开发经验。Google 作为战略信号有意义，说明超大规模云厂商关心长时清洁电力；但公开证据仍把 Google 定位为
