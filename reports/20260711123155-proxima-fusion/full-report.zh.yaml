      - number: '7.4'
        title: 资本、竞争与市场时点风险
        blocks:
          - type: paragraph
            body: >-
              当前融资对欧洲来说规模巨大，但没有消除资本风险。Proxima 已融资超过 €650M，大概率足以为 Alpha
              相关进展、招聘和制造扩建提供数年资金。但它几乎肯定无法独自资助完整商业仿星器项目，直到持续并网部署。Fusion Industry Association 数据和 World Nuclear News
              报道都强调，融资可得性仍是行业主要问题，因为周期长，硬件项目资本密集。因此，Proxima 仍依赖未来私募轮、公共支持，以及最终用于首批电站的项目式资本。


              竞争会放大问题。资本更厚或商业推进更靠前的同行已经拿出更强客户证明：Google 与 CFS 签了 200 MW PPA，Microsoft 与 Helion 签约，TVA 向 Type One Energy
              出具 LOI。上述交易不能证明那些公司会成功，但它们确实说明，竞争团队可以更早把战略可信度转化为商业文件。如果 CFS、Helion 或另一种路线更早给出决定性技术证明，Proxima
              可能面对更严苛的融资环境和更低的估值容忍度。即便聚变在技术上可行，市场时点风险仍很大，因为太阳能、风电、储能、先进裂变和燃气兜底容量都在继续演进，而 Proxima 的收入窗口仍远在 2030 年代或更晚。
