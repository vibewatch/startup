  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与物理论点
        blocks:
          - type: paragraph
            body: >-
              Proxima 的真实产品形态是一段阶梯，而不是一座完工电站。在公开材料中，公司出售的是围绕准等动力学仿星器家族搭建的商业化路径：Stellarator Model Coil 作为磁体和可制造性检查点，Alpha
              作为 Garching 的净能量验证装置，Stellaris 则是最终公用事业级电站概念。这一框架重要，因为 Proxima
              不只是做物理实验；它试图把学术仿星器谱系转化为一串可建造的工业资产，让公用事业、监管方和基础设施投资人最终可以纳入投资判断。


              底层物理主张清晰且有差异。Proxima 认为，准等动力学仿星器可以在稳态运行，不依赖强环向等离子体电流，从而降低托卡马克 风险中核心的电流驱动扰动暴露。公司的论点不是仿星器比托卡马克
              更简单——并不是——而是现代计算和优化终于让过去难以处理的磁几何具备工程可行性。Wendelstein 7-X 是经验证据桥梁：它证明优化仿星器可以在长脉冲下达到世界级约束指标；Proxima
              的产品故事则明确表示，Alpha 和后续 Stellaris 将用更强磁体和更强集成纪律把这些经验工业化。
