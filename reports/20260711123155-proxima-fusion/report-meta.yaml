companyProfile:
  summary: >
    Proxima Fusion is a Munich-based private fusion company founded in 2023 as the first spin-out
    from the Max Planck Institute for Plasma Physics. The company is developing quasi-isodynamic
    high-temperature-superconducting stellarators, with a public roadmap spanning a Stellarator
    Model Coil in 2027, the Alpha demonstrator in the early 2030s, and later commercial plants.
    The July 2026 Series A2 round brought in €411 million at a €2.4 billion valuation and lifted
    total disclosed funding above €650 million, with strategic participation from RWE and Google.
  foundedDate: '2023-04-01'
