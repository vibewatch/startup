  productSummary: >
    Proxima is building commercial fusion power plants based on quasi-isodynamic HTS stellarators.
    Public roadmap materials point to a Stellarator Model Coil milestone in 2027, Alpha in the
    early 2030s, and Stellaris later in the 2030s, with Alpha serving as the key net-energy and
    engineering proof gate before commercial deployment.
  customerFocus: >
