chapter:
  number: 5
  title: Product & Technology
  summary: Atoms presents a multi-vertical physical-AI platform spanning food, mining, and transport, but the strongest public technical evidence is concentrated in Pronto's autonomous haulage deployments and the hiring surface for controls engineering. The food robotics concept has disclosed operating specifications, while transport remains less mature and cross-division reliability, security, and unit economics are not publicly demonstrated.
sections:
  - id: product-portfolio
    title: Product portfolio and customer workflow
    body: >-
      Atoms is positioned as a portfolio of specialized physical systems rather than a
      general-purpose humanoid product. Its public positioning names food, mining, and
      transport as the initial verticals, with food infrastructure and kitchen
      automation alongside Pronto's mining autonomy. The clearest customer workflow is
      quarry haulage: autonomous trucks operate within an existing mixed fleet, allowing
      a mine operator to add autonomy without replacing every vehicle. In food, Lab37's
      Bowl Builder is described as a production machine for delivery-intensive bowl
      operations, with a staged commercial availability plan rather than a broadly
      deployed product. The portfolio therefore combines operating businesses,
      product-in-test systems, and a transport division whose public product detail is
      still limited.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001]
  - id: operating-architecture
    title: Technical and operating architecture
    body: >-
      The evidence supports a layered operating model: physical equipment and
      sensors, real-time control and state estimation, perception and planning
      integration, field deployment, and operating infrastructure. Atoms' controls
      recruiting materials identify localization, path following, longitudinal and
      lateral control, sensor fusion, simulation, log replay, and field testing on
      heavy vehicles. The same material names Python and C++ software, NVIDIA Jetson,
      GPS/RTK, IMUs, CAN interfaces, and ROS or similar middleware. Pronto's customer
      release adds an OEM-agnostic integration layer across Caterpillar and Komatsu
      trucks. This is credible evidence of an engineering stack and deployment
      workflow, not proof of a fully standardized platform across food, mining, and
      transport or of production-grade security and reliability controls.
    claimRefs: [CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-risks
    title: Maturity, differentiation, and diligence risks
    body: >-
      Pronto has the strongest public maturity signal: a company release reports more
      than two million tons moved autonomously over eight months at Heidelberg
      Materials' Lake Bridgeport quarry and plans for two additional sites in 2026.
      That is meaningful deployment evidence, but it is company-issued and does not
      disclose uptime, incidents, economics, intervention rates, or independently
      verified safety outcomes. Bowl Builder has concrete throughput and footprint
      specifications, yet the public account describes testing and future production
      slots rather than scaled customer adoption. The controls job posting indicates
      active investment in the technical capability needed to operate heavy vehicles,
      while also exposing operational complexity: field travel, simulation, log
      replay, sensor fusion, and real-time code. Investors still need division-level
      deployment, reliability, cybersecurity, compliance, and payback evidence.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
