      - ["Engineering capability", "Controls role names sensor fusion, MPC, Python/C++, Jetson, GPS/RTK, IMUs, and CAN", "Technical hiring and intended stack", "Team size, shipped version, and operational results"]
    notes: "Signals mix company-issued announcements, an independent industry report, and a company job posting; they are not a substitute for audited reliability, security, or unit-economics data."
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
