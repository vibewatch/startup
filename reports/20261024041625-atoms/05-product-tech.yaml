callouts:
  - calloutType: strength
    title: Strongest technical proof
    body: Pronto's reported mixed-fleet quarry deployment is the most concrete public evidence of Atoms technology operating in a customer environment.
    claimRefs: [CE010, CE011]
  - calloutType: risk
    title: Evidence concentration
    body: Public technical proof is concentrated in one mining workflow; food robotics is at test or planned-commercial stage and transport remains lightly specified.
    claimRefs: [CE003, CE004, CE005, CE012]
  - calloutType: assumption
    title: Diligence boundary
    body: The disclosed controls stack establishes engineering intent and system components, not a verified security program, safety case, uptime record, or cross-division platform reuse.
    claimRefs: [CE006, CE007, CE008, CE014]
