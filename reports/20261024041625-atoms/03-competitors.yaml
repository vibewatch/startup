    columns: [alternative, price_or_contract_model, included_capabilities, discount_or_unknowns, competitive_implication]
    rows:
      - [Atoms Food, unknown, "food infrastructure and related hardware projects are described", "realized price, contract length, discounts, and margin are unknown", "cannot yet compare customer payback"]
      - [CloudKitchens, "Get price / quote-led", "private kitchens, delivery/takeout infrastructure, location access", "list prices and realized rent/software economics are unknown", "quote-led sales may support location-specific packaging"]
      - [Kitchen United Mix, "site and restaurant participation model not publicly priced", "turnkey kitchen and multi-restaurant takeout/delivery location", "pricing, occupancy, and restaurant economics are unknown", "substitute is visible but not financially comparable"]
      - [Mining autonomy incumbents, "equipment, autonomy, service, and project contracts vary", "fleet, site integration, maintenance, and service ecosystem", "customer-specific pricing and payback are unknown", "installed-base bundling can raise switching costs"]
      - [Internal build / status quo, "labor, conventional equipment, or internal engineering budget", "existing workflow and control over operations", "cost, safety, and productivity baseline must be measured", "often the real hurdle for a new deployment"]
    notes: "No assigned source publishes comparable Atoms pricing or realized contract economics; unknowns are retained rather than estimated."
    claimRefs: [CP003, CP006, CP010, CP013, CP015]
