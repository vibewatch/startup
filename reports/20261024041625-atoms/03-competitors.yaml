    approximationNotes: "Ordinal scores are analyst judgments anchored to the assigned public evidence, not audited market-share or performance measurements."
    claimRefs: [CP001, CP004, CP005, CP007, CP009, CP012]
callouts:
  - calloutType: insight
    title: Portfolio breadth is not yet a moat
    body: Cross-vertical scope may create shared infrastructure, but public evidence does not yet prove transfer of technology, data, or economics between food, mining, and transport.
    claimRefs: [CP003, CP011, CP014]
  - calloutType: risk
    title: Incumbent distribution raises the proof burden
    body: Established equipment and kitchen operators can compete through installed assets, service, procurement trust, or existing customer relationships even when their products are not identical.
    claimRefs: [CP007, CP008, CP012]
