  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Existing operating base can accelerate learning, CloudKitchens and Pronto are described as operating assets rather than a pure prototype, Verified division-level utilization and contribution margins.]
      - [Specialized robots may target paid industrial work, Atoms is described as focused on food mining and transport tasks, Customer contracts repeat deployments and independently measured uptime.]
      - [Financing provides capacity, A $1.7B equity investment is reported with named investors, Reconciled use of proceeds runway and ownership terms.]
      - [Opacity may conceal execution or pricing risk, Valuation revenue and financing terms are not fully disclosed, Audited financials cap table preferences and independent customer references.]
    notes: Qualitative thesis matrix; supporting evidence is not a comparable valuation multiple and missing proof remains a diligence gap.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, Repeatable deployments across food and mining with positive unit economics, Upside could justify a premium private-market multiple once revenue and margins are verified, Scale may expose integration and service costs, Low until deployment and financial data are disclosed.]
      - [Base, Continued financing-supported development with uneven division traction and limited disclosure, Track rather than pay for an unverified valuation; reassess after terms and denominators are known, Burn dilution and preference overhang may rise, Most defensible current posture.]
      - [Bear, Utilization misses plan and capital intensity or customer adoption delays commercialization, Downside includes multiple compression and additional dilution before proof, Site constraints regulatory hurdles and weak demand, Material downside cannot be quantified from public data.]
    notes: Directional scenario logic, not a computed valuation; no probability-weighted price is shown because the financing valuation, revenue, margins, and capital structure are unavailable.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV016, CV017]
