evidenceGaps:
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: Audited consolidated and segment revenue, gross margin, cash burn, runway, and current headcount.
    whyItMatters: >-
      The financing headline cannot be translated into operating scale or financial sustainability without current
      segment economics.
    diligencePath: Request management accounts, segment KPIs, cash-flow statements, and a current employee census under NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete cap table, board roster, voting rights, financing terms, and related-party arrangements.
    whyItMatters: Founder control and investor rights may materially affect governance, dilution, and downside protection.
    diligencePath: Obtain the latest capitalization table, charter, investor rights agreement, board roster, and financing documents.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: execution-risk
    missingEvidence: >-
      Named customer contracts, deployments, uptime, safety outcomes, payback, and pilot-to-production conversion by
      division.
    whyItMatters: The multi-sector thesis depends on repeatable industrial deployments rather than strategic positioning alone.
    diligencePath: >-
      Request anonymized customer references, deployment cohorts, safety records, uptime logs, and unit-economics
      cohorts for Food and Mining.
    relatedQuestionRefs:
      - QO002
      - QO006
      - QO007
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Atoms-specific segment revenue, pricing, customer counts, retention, deployment payback, and serviceable market
      definitions by division.
    whyItMatters: Generic sector forecasts cannot establish Atoms' addressable revenue or support a valuation tied to execution.
    diligencePath: >-
      Request a divisional KPI pack, customer cohort data, pricing schedules, backlog, deployment economics, and
      management's SAM/SOM methodology.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: sizing
    missingEvidence: A reconciled market definition and denominator across the published online-delivery estimates.
    whyItMatters: >-
      The retained estimates range materially in 2026 values and forecast horizons, so selecting one without
      reconciliation would create false precision.
    diligencePath: >-
      Obtain publisher methodologies or normalize each estimate to a common geography, category, currency, and
      GMV/revenue basis.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
