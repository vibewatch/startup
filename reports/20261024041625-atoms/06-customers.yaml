    notes: "Values mix company/customer-reported footprint, plans, and operating claims; they are not comparable customer-count measures and do not establish retention."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / partner, Segment, Deployment or use case, Production vs pilot, Outcome or signal, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer, operator, and partner examples found in the assigned 2026 refresh source pool; no complete customer register is disclosed."
    rows:
      - [Fuku Sushi, Food operator, Delivery-first kitchen expansion, "Reported operating use", "Operator said the business expanded from one kitchen to two more cities", "Selected testimonial; no contract, revenue, or retention data"]
      - [Coffee Q, Food operator, Delivery ordering and repeat demand, "Reported operating use", "Operator described reaching a different market and seeing repeat and new orders", "Selected testimonial; no order denominator or cohort data"]
      - [Florentine, Food operator, Relaunch without a traditional storefront, "Reported operating use", "Operator described CloudKitchens as a low-cost route back to market", "No production volume, margin, or renewal evidence"]
      - [Heidelberg Materials, Mining operator, Lake Bridgeport mixed-fleet haulage and broader rollout, "Commercial deployment plus planned expansion", "Pronto system reported working on Caterpillar and Komatsu trucks; more than 100 trucks described for more than a dozen sites", "Rollout status, pricing, uptime, and renewal are not disclosed"]
    notes: "Enumeration is partial and intentionally excludes unnamed logos; production/pilot labels reflect the source wording and should not be read as audited customer status."
    claimRefs: [CU009, CU010, CU011, CU012]

