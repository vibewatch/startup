callouts:
  - calloutType: strength
    title: The best proof is operational, not logo-based
    body: "Pronto's named mixed-fleet deployment and reported multi-site Heidelberg rollout provide stronger customer evidence than an undifferentiated logo list, because the sources identify equipment, sites, and deployment scope."
    claimRefs: [CU006, CU011]
  - calloutType: risk
    title: Retention and concentration remain unmeasured
    body: "Atoms does not publicly disclose active accounts, churn, renewal, NRR, customer-level revenue, or division-level concentration, so broad footprint and testimonial evidence cannot support a durable recurring-revenue conclusion."
    claimRefs: [CU005, CU013, CU014]

