chapter:
  number: 6
  title: Customers
  summary: Atoms has identifiable customer pathways in delivery kitchens and autonomous mining, but public evidence is concentrated in named deployments and promotional operator stories rather than cohort, retention, or consolidated customer-count disclosure. The strongest proof is Pronto's reported commercial mixed-fleet work, while Atoms Transport remains a stated platform rather than a demonstrated customer business.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Atoms serves several distinct customer systems rather than one homogeneous
      account base. In food, CloudKitchens targets independent chefs, established
      brands, food-truck owners, franchises, and legacy restaurants that need
      delivery-first space; the operator supplies equipment and staff while the
      facility supplies kitchen infrastructure and delivery workflow. Otter adds
      a software buyer and daily user inside that same restaurant segment by
      consolidating marketplace orders and operational data. In mining, the buyer
      is an operator or equipment ecosystem seeking autonomous haulage across
      existing fleets, with Pronto positioned as an OEM-agnostic retrofit layer.
      The July 2026 Hitachi partnership is explicitly framed around giving mining
      customers more options, but it is an MoU and not proof of a scaled combined
      product. Atoms Transport is described publicly as a wheelbase for robots,
      without named customers or public production deployments.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      Public adoption evidence is strongest where a customer, site, fleet, or
      operating use case is named. CloudKitchens promotional material describes
      more than 5,000 kitchens in over 400 locations across 110-plus cities, but
      the page does not provide an independently audited active-account
      denominator, cohort history, churn, or renewal rate. Its operator
      testimonials describe expansion to additional cities, repeat ordering, and
      reduced owner workload, yet they remain selected testimonials and cannot
      establish representative retention. Pronto evidence is more operational:
      International Mining reports a mixed-fleet Lake Bridgeport deployment and
      plans for more than 100 trucks across more than a dozen Heidelberg sites,
      while also noting that the Hitachi-machine project was not yet running.
      The customer durability thesis therefore depends on deployment conversion,
      uptime, renewal, and economics that Atoms has not publicly disclosed.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: >-
      Named proof spans food operators, quarry and mining customers, and strategic
      equipment partners, but the evidentiary quality differs by use case. Fuku
      Sushi, Coffee Q, Craft Burger, Florentine, and three Atlanta delivery
      brands are quoted as CloudKitchens operators; the available page describes
      benefits and anecdotes, not contract terms, production quality metrics, or
      retention. In mining, Heidelberg Materials is identified at Lake Bridgeport
      and across a prospective multi-site rollout, with Brazil and Saudi Arabia
      also described as production or deployment contexts. Hitachi Construction
      Machinery contributes a global customer base to a development partnership,
      while the cited combined project was not yet operating. This supports
      customer access and expansion potential, not a verified recurring-revenue
      base. Concentration is opaque because Atoms does not disclose revenue by
      customer, division, geography, or partner.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: diligence-implications
    title: What must be verified
    body: >-
      The customer case is investable only if Atoms can convert broad platform
      positioning into repeatable, measurable deployments. The next diligence
      request should separate food occupancy and active restaurant accounts from
      kitchen capacity, then provide gross retention, churn, cohort expansion,
      average revenue per account, and customer-level concentration. For Pronto,
      request signed customer contracts, live truck counts by site, production
      versus pilot status, safety and uptime logs, implementation duration,
      pricing, and renewal economics. The Hitachi relationship should be tracked
      as a channel and product-development signal until a combined system is
      running. Public evidence does not support a single customer-count,
      utilization, NRR, or concentration number, so those metrics remain gaps
      rather than estimates.
    claimRefs: [CU013, CU014]

