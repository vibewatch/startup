chapter:
  number: 1
  title: Company Overview
  summary: Atoms is a private industrial-automation group that rebranded the City Storage Systems and CloudKitchens operating base in March 2026 and now combines food infrastructure, mining autonomy, and a still-early transport platform. The public record supports a well-capitalized, founder-led expansion, but consolidated revenue, profitability, cap table, and detailed governance remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Atoms is the March 2026 identity for the City Storage Systems business associated
      with CloudKitchens. Recent reporting describes three operating areas: Atoms Food,
      Atoms Mining, and Atoms Transport. The Food base combines delivery-oriented kitchen
      infrastructure, restaurant software, and food robotics; Mining is anchored by the
      Pronto autonomous-haulage acquisition; and Transport is described publicly as a
      robot wheelbase or foundational platform rather than a disclosed product with
      named customers. This makes Atoms an operating-company expansion, not a newly
      formed venture with no physical assets. The same breadth is strategically useful
      because it gives the company multiple industrial workflows in which to deploy
      software, sensors, robotics, and infrastructure, but it also creates a material
      execution and integration burden. Public sources do not establish consolidated
      revenue, segment margins, customer concentration, or the commercial maturity of
      Transport, so those remain diligence gaps rather than inferred scale metrics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance
    body: >-
      Travis Kalanick is the controlling public face and CEO of Atoms, carrying the
      founder history, operating ambition, and reputational baggage of the post-Uber
      City Storage Systems period. Diego Berdakin and Sky Dayton are identified in
      company-profile reporting as founders of the predecessor business, while Anthony
      Levandowski is associated with Pronto, the mining technology engine. The July 2026
      financing was reported at $1.7 billion and led by Andreessen Horowitz; coverage
      also says Ben Horowitz joined the board. Earlier CloudKitchens financing was
      reported at approximately $1.25 billion across two rounds and a roughly $15
      billion late-2021 valuation. These figures are financing and press-reported
      valuation markers, not evidence of current cash, ARR, or enterprise value. The
      cap table, board composition beyond the reported Ben Horowitz appointment, debt
      terms, ownership concentration, and use-of-proceeds detail are not publicly
      disclosed in the retained evidence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence-gaps
    title: Milestones and unresolved diligence
    body: >-
      The milestone sequence shows a business moving from food infrastructure into a
      multi-sector physical-automation thesis. The rebrand and Pronto combination give
      Atoms a credible operational bridge from CloudKitchens into mining, while the
      Bowl Builder test demonstrates an early productization effort in food. The
      financing announcement says the operating businesses were merged into a single
      Atoms equity structure and that capital is intended for more machines and
      deployments. However, the retained adverse and independent coverage also points
      to the issues an investor must test: commercialization proof, customer adoption,
      reliability, safety, payback, and whether cross-industry expansion dilutes
      execution. Historical CloudKitchens operating controversies and the founder's
      prior Uber-related reputation are relevant context, but they do not by themselves
      establish current Atoms misconduct. The most decision-relevant missing evidence
      is audited segment economics, current headcount, named customer contracts, board
      minutes or controls, and a current valuation basis.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
