callouts:
  - calloutType: strength
    title: "Operating base is more substantial than a launch-stage pitch"
    body: "Atoms inherits a food-infrastructure operating base and adds Pronto's industrial-autonomy capability, giving the new brand real deployment surfaces rather than only a concept narrative."
    claimRefs: [CO002, CO004, CO010]
  - calloutType: risk
    title: "Capital disclosure is not operating disclosure"
    body: "The $1.7B financing and historical valuation markers establish capital-market interest, not current cash available, revenue, margin, runway, or a confirmed valuation for the refreshed company."
    claimRefs: [CO006, CO007, CO008, CO015]
  - calloutType: recommendation
    title: "Make segment economics the next diligence gate"
    body: "Before underwriting the multi-sector thesis, require current segment revenue, deployment counts, customer contracts, safety and uptime evidence, and the governance terms attached to the latest financing."
    claimRefs: [CO011, CO012, CO013, CO015]
