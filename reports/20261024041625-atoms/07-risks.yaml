      - ["Food-site demand, tenant, or utilization weakness", medium, high, "Operating footprint described; retention and utilization not evidenced", "Medium-high", "Site-level occupancy, tenant churn, customer cohorts, and contribution margin by facility."]
    notes: "Qualitative likelihood and severity are investment-risk judgments anchored to source-described operating complexity; they are not incident rates or audited probabilities."
    claimRefs: [CR001, CR002, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
