chapter:
  number: 7
  title: Risks
  summary: Atoms combines food infrastructure, mining autonomy, and an announced transport platform, so its principal risks are execution breadth, physical-system safety, regulatory compliance, and opaque economics. Public evidence confirms the breadth of the bet and the existence of relevant regulatory obligations, but does not establish Atoms-specific incident, certification, customer-concentration, or cash-runway outcomes.
sections:
  - id: risk-priorities
    title: Risk priorities and evidence boundary
    body: >-
      The highest-priority risk is not a single disclosed lawsuit or outage; it is the
      difficulty of proving repeatable economics across three physically different
      businesses. A fetched company-oriented investment article describes Atoms as
      combining CloudKitchens, Pronto, and Lab37 and explicitly identifies hardware
      capital intensity, three-sector execution complexity, regulatory exposure, and
      undisclosed valuation as risks. A separate industry article describes Food as the
      operating division, Mining as early, and Transport as not yet announced. Those
      sources are useful for framing, but they are not audited operating evidence.
      The chapter therefore ranks opacity and execution as material residual exposures
      and sets measurable diligence triggers rather than inferring a loss, incident,
      or compliance failure that the assigned sources do not prove.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Atoms' mining and transport ambitions place it in domains where compliance
      evidence must be specific to the operating design and jurisdiction. The
      Electronic Code of Federal Regulations states that Part 56 sets mandatory
      safety and health standards for surface metal and nonmetal mines, including
      open-pit mines, and defines mobile equipment broadly. That is a concrete
      regulatory baseline for any Pronto deployment in a covered mine, not evidence
      that Atoms has breached it. NHTSA's automated-driving reporting guidance also
      requires named entities to report specified crashes and warns that incident
      data are not normalized for exposure. The assigned Federal Register URL,
      however, fetched as an unrelated NIH closed-meeting notice, and the assigned
      CourtListener URL fetched as an unrelated case. These retrieval mismatches
      make Atoms-specific litigation and transport-rule conclusions unresolved.
    claimRefs: [CR005, CR006, CR007, CR008, CR016]
    tableRefs: [TR002]
  - id: operational-quality-security
    title: Operational, quality, and security risk
    body: >-
      Physical automation creates failure modes that software diligence alone cannot
      close: installation quality, sensor and telemetry reliability, safe human
      interaction, maintenance, uptime, and site-level economics. The assigned
      coverage says Atoms must manufacture, ship, install, and maintain physical
      systems, while its three divisions have different technical and operating
      cadences. A partner-oriented page describes the strategy as tying labor, land,
      fleets, kitchens, mines, robotics, and operations together, which increases
      potential integration value but also creates coupled failure modes. NHTSA's
      caution that crash data may be incomplete or unrepresentative reinforces the
      need for denominator-based monitoring. No assigned source provides Atoms-wide
      uptime, incident counts, safety certification, cybersecurity controls, recall
      history, or validated payback; each remains a diligence item rather than a
      negative finding.
    claimRefs: [CR010, CR011, CR012, CR013]
  - id: dependencies-and-kill-criteria
    title: Dependencies, financial opacity, and thesis-break triggers
    body: >-
      The capital structure is a dependency as well as a strength. The assigned
      coverage reports a $1.7 billion equity round and additional debt facilities,
      but terms, post-money valuation, company-wide revenue, margins, burn, and
      runway are not disclosed in the retained evidence. That prevents a reliable
      conclusion about liquidity or whether hardware deployment can be financed
      without dilution or asset-level leverage. The company also depends on
      customers accepting specialized systems in food, mining, and transport, yet
      the pool does not establish production-customer counts or pilot conversion.
      Monitoring should focus on disclosed deployment contracts, safety and
      compliance findings, uptime and incident rates, contribution margin by
      division, cash runway, debt covenants, and customer concentration. A thesis
      break would be repeated reportable safety events, a material regulatory stop,
      inability to demonstrate site-level payback, or financing that materially
      increases dilution or fixed obligations without corresponding contracted
      revenue.
    claimRefs: [CR014, CR015, CR016, CR017]
    tableRefs: [TR003]
