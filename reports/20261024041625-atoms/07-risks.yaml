      - [Mine operators and site approvals, "Mining customers, mine owners, and regulators", "Customer count and contract concentration undisclosed", "Pilot fails to convert or site approval delays deployment", high, "Verify signed production contracts, renewal terms, site permissions, and customer payback", high]
      - [Food facilities and restaurant operators, "CloudKitchens / ProKitchens sites and operators", "Utilization and churn denominators undisclosed", "Empty or underutilized sites impair fixed-cost absorption", high, "Review occupancy, tenant churn, location economics, and division-level cash contribution", medium-high]
    notes: "Counterparties and concentrations are only reported where the assigned sources identify the relationship; undisclosed concentration is a gap, not a zero."
    claimRefs: [CR003, CR004, CR014, CR015, CR016, CR017]
