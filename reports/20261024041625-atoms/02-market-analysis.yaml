    title: "Generic TAMs cannot establish Atoms' SOM"
    body: "Published estimates use different scopes and denominators, and no retained source isolates Atoms' serviceable segment, pricing, conversion, or divisional economics."
    claimRefs: [CM008, CM009, CM010, CM016]
