company:
  name: Atoms
chapter:
  number: 2
  title: Market Analysis
  summary: "Atoms is positioned across three different adoption markets rather than one homogeneous robotics category: delivery-first food infrastructure, autonomous mining, and an early transport platform. External sizing supports large and growing adjacent markets, but the public evidence does not isolate Atoms' SAM, SOM, pricing, or consolidated commercial traction."
sections:
  - id: boundary-and-market-logic
    title: Market boundary and portfolio logic
    body: >-
      The defensible market boundary is the spend Atoms could capture through specialized
      physical infrastructure and automation, not the entire robotics economy. The public
      positioning spans Atoms Food, Atoms Mining, and Atoms Transport, while the available
      descriptions distinguish delivery-first kitchens and restaurant software from
      autonomous haulage and a proposed robotic wheelbase. That means the relevant market
      is a portfolio of adjacent workflows with different buyers, budgets, procurement
      cycles, and proof requirements. Food infrastructure monetizes kitchen capacity and
      software around online orders; mining automation sells productivity and safety into
      industrial sites; transport remains less specified. A single top-down robotics TAM
      would therefore overstate near-term opportunity unless it is decomposed into these
      operating markets. The public evidence also does not establish that the divisions
      share a common customer, purchasing process, or revenue model.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: >-
      Published estimates show substantial demand around online food delivery and cloud
      kitchens, but they are not interchangeable and should not be added together. Mordor
      Intelligence estimates online food delivery at USD 284.73 billion in 2026 and USD
      468.51 billion in 2031, while IMARC estimates USD 180.2 billion in 2026 and USD 357.3
      billion in 2034. Precedence Research gives a third lens of USD 284.72 billion in 2026
      and USD 694.65 billion in 2035. The divergence reflects different definitions,
      geographies, and modeling choices. Market.us separately estimates the cloud-kitchen
      market at USD 71.6 billion in 2023 and USD 194.6 billion in 2032. Statista's
      methodology says its figures cover B2C GMV, while Mordor says its forecasts use a
      proprietary framework; these denominators make the figures useful as bounds and
      direction, not as an Atoms-specific TAM. No retained source isolates mining
      autonomy, transport robotics, Atoms' addressable geographies, or a serviceable
      segment for the company.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The buyer map is segment-specific. Food brands and restaurant operators care about
      access to delivery capacity, software integration, order economics, and the ability
      to test concepts without a full storefront. Mining and quarry operators are more
      likely to buy against measurable productivity, safety, uptime, and fleet-integration
      requirements. Logistics and transport operators would require a clearer product,
      reliability record, and deployment economics before a budget can be assigned. Market
      sources consistently identify smartphones, urban density, digital payments, and
      delivery-platform reach as demand drivers, while also flagging commissions,
      last-mile dependence, price inflation, regulation, and quality control as
      constraints. For Atoms, these constraints translate into different adoption gates:
      food depends on repeat order density and margin after platform costs; mining depends
      on site validation and long procurement cycles; transport remains a product-clarity
      and commercialization risk. The portfolio can address large workflows, but the
      evidence does not yet show a common go-to-market motion or quantified customer ROI.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: diligence-implications
    title: Diligence implications
    body: >-
      The market case is credible as an option set, not as a quantified consolidated
      revenue opportunity. The strongest public evidence is for food-delivery and
      cloud-kitchen demand; the weakest is for Atoms Transport and for converting sector
      growth into Atoms revenue. The main valuation-relevant diligence questions are
      divisional revenue and gross margin, customer counts and retention by division,
      deployment payback, mining fleet uptime and contracted backlog, food-platform
      economics after commissions, and a defined transport product. Until those data are
      disclosed, market growth should support a monitoring thesis rather than a precise
      SOM or a revenue multiple derived from generic sector estimates.
    claimRefs: [CM003, CM004, CM008, CM014, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns: [segment, included_spend, excluded_spend, buyer_or_payer, relevance]
    rows:
      - [Atoms Food, delivery-first kitchen capacity and restaurant/order-management software, dine-in restaurant real estate and unrelated consumer food spend, restaurant brands and food operators, "Most evidenced operating market; tied to online delivery and cloud-kitchen lenses"]
      - [Atoms Mining, autonomous haulage and site automation purchased for industrial productivity and safety, general-purpose consumer robotics and unrelated mining equipment, mine and quarry operators, "Relevant only where autonomy is deployed into a defined industrial workflow"]
      - [Atoms Transport, specialized robotic movement infrastructure and future deployment services, broad logistics revenue and unannounced product categories, logistics and fleet operators, "Potential adjacency; product and budget owner remain under-specified"]
      - [Portfolio exclusions, generic robotics TAMs that do not identify a target workflow, all global automation spend, not applicable, "Avoids treating unrelated hardware and software categories as immediately addressable"]
    notes: "Boundary is an analytical decomposition of the retained company and market descriptions; public sources do not disclose Atoms-specific segment revenue or SAM."
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Published sizing lenses
    columns: [publisher, market_lens, geography, value_and_period, cagr, methodology_or_denominator, confidence, limitation]
    rows:
      - [Precedence Research, online food delivery, global, "USD 284.72B (2026); USD 694.65B (2035)", "10.44% (2026-2035)", not stated in retained excerpt, medium, "Different forecast endpoint and definition from other online-delivery estimates"]
      - [Mordor Intelligence, online food delivery, global, "USD 284.73B (2026); USD 468.51B (2031)", "10.47% (2026-2031)", "Proprietary estimation framework updated January 2026", medium, "Not Atoms-specific and includes multiple business models and geographies"]
      - [IMARC Group, online food delivery, global, "USD 180.2B (2026); USD 357.3B (2034)", "8.93% (2026-2034)", "Market report with platform, business-model, payment, and regional segmentation", medium, "Lower base than other lenses; scope and modeled assumptions differ"]
      - [Market.us, cloud kitchens, global, "USD 71.6B (2023); USD 194.6B (2032)", "12.1% (2023-2032)", "Cloud-kitchen market segmented by type, product, and nature", medium, "Cloud-kitchen subset is not the same as online-delivery GMV"]
    notes: "Values are publisher estimates with different scopes, vintages, denominators, and forecast horizons; they are comparison lenses, not additive TAM/SAM/SOM evidence."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM016]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [segment, buyer, user, payer_or_budget_owner, workflow, adoption_trigger]
    rows:
      - [Food brands and restaurant operators, brand or operations lead, kitchen and order-management staff, restaurant operating budget, "Prepare and fulfill delivery orders without a conventional storefront", "Order density, lower fixed cost, and reliable platform integration"]
      - [Mining and quarry operators, mine general manager or automation lead, fleet and site operators, mine capital or operating budget, "Autonomous haulage in structured industrial environments", "Validated productivity, safety, uptime, and integration with existing trucks"]
      - [Logistics and transport operators, fleet or network operations lead, dispatchers and drivers, fleet modernization budget, "Deploy specialized robotic movement systems", "Clear product scope, reliability evidence, and payback against labor or utilization"]
      - [Delivery platforms and ecosystem partners, platform or partnership executive, merchants and end customers, platform product or partnership budget, "Route orders, payments, and delivery capacity through digital channels", "Reach, digital payments, data integration, and lower delivery friction"]
    notes: "Buyer and workflow rows synthesize the retained market descriptions; no source provides a complete Atoms-specific procurement map, pricing, or budget allocation."
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
