chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Atoms is the March 2026 identity for the City Storage Systems business associated with CloudKitchens.
              Recent reporting describes three operating areas: Atoms Food, Atoms Mining, and Atoms Transport. The Food
              base combines delivery-oriented kitchen infrastructure, restaurant software, and food robotics; Mining is
              anchored by the Pronto autonomous-haulage acquisition; and Transport is described publicly as a robot
              wheelbase or foundational platform rather than a disclosed product with named customers. This makes Atoms
              an operating-company expansion, not a newly formed venture with no physical assets. The same breadth is
              strategically useful because it gives the company multiple industrial workflows in which to deploy
              software, sensors, robotics, and infrastructure, but it also creates a material execution and integration
              burden. Public sources do not establish consolidated revenue, segment margins, customer concentration, or
              the commercial maturity of Transport, so those remain diligence gaps rather than inferred scale metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
              - CO015
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              Travis Kalanick is the controlling public face and CEO of Atoms, carrying the founder history, operating
              ambition, and reputational baggage of the post-Uber City Storage Systems period. Diego Berdakin and Sky
              Dayton are identified in company-profile reporting as founders of the predecessor business, while Anthony
              Levandowski is associated with Pronto, the mining technology engine. The July 2026 financing was reported
              at $1.7 billion and led by Andreessen Horowitz; coverage also says Ben Horowitz joined the board. Earlier
              CloudKitchens financing was reported at approximately $1.25 billion across two rounds and a roughly $15
              billion late-2021 valuation. These figures are financing and press-reported valuation markers, not
              evidence of current cash, ARR, or enterprise value. The cap table, board composition beyond the reported
              Ben Horowitz appointment, debt terms, ownership concentration, and use-of-proceeds detail are not publicly
              disclosed in the retained evidence.
