              - CO007
              - CO008
      - number: '1.3'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a business moving from food infrastructure into a multi-sector
              physical-automation thesis. The rebrand and Pronto combination give Atoms a credible operational bridge
              from CloudKitchens into mining, while the Bowl Builder test demonstrates an early productization effort in
              food. The financing announcement says the operating businesses were merged into a single Atoms equity
              structure and that capital is intended for more machines and deployments. However, the retained adverse
              and independent coverage also points to the issues an investor must test: commercialization proof,
              customer adoption, reliability, safety, payback, and whether cross-industry expansion dilutes execution.
              Historical CloudKitchens operating controversies and the founder's prior Uber-related reputation are
              relevant context, but they do not by themselves establish current Atoms misconduct. The most
              decision-relevant missing evidence is audited segment economics, current headcount, named customer
