  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and portfolio logic
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is the spend Atoms could capture through specialized physical
              infrastructure and automation, not the entire robotics economy. The public positioning spans Atoms Food,
              Atoms Mining, and Atoms Transport, while the available descriptions distinguish delivery-first kitchens
              and restaurant software from autonomous haulage and a proposed robotic wheelbase. That means the relevant
              market is a portfolio of adjacent workflows with different buyers, budgets, procurement cycles, and proof
              requirements. Food infrastructure monetizes kitchen capacity and software around online orders; mining
              automation sells productivity and safety into industrial sites; transport remains less specified. A single
              top-down robotics TAM would therefore overstate near-term opportunity unless it is decomposed into these
              operating markets. The public evidence also does not establish that the divisions share a common customer,
              purchasing process, or revenue model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              Published estimates show substantial demand around online food delivery and cloud kitchens, but they are
              not interchangeable and should not be added together. Mordor Intelligence estimates online food delivery
              at USD 284.73 billion in 2026 and USD 468.51 billion in 2031, while IMARC estimates USD 180.2 billion in
              2026 and USD 357.3 billion in 2034. Precedence Research gives a third lens of USD 284.72 billion in 2026
              and USD 694.65 billion in 2035. The divergence reflects different definitions, geographies, and modeling
              choices. Market.us separately estimates the cloud-kitchen market at USD 71.6 billion in 2023 and USD 194.6
              billion in 2032. Statista's methodology says its figures cover B2C GMV, while Mordor says its forecasts
              use a proprietary framework; these denominators make the figures useful as bounds and direction, not as an
              Atoms-specific TAM. No retained source isolates mining autonomy, transport robotics, Atoms' addressable
              geographies, or a serviceable segment for the company.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is segment-specific. Food brands and restaurant operators care about access to delivery
              capacity, software integration, order economics, and the ability to test concepts without a full
              storefront. Mining and quarry operators are more likely to buy against measurable productivity, safety,
              uptime, and fleet-integration requirements. Logistics and transport operators would require a clearer
              product, reliability record, and deployment economics before a budget can be assigned. Market sources
              consistently identify smartphones, urban density, digital payments, and delivery-platform reach as demand
              drivers, while also flagging commissions, last-mile dependence, price inflation, regulation, and quality
              control as constraints. For Atoms, these constraints translate into different adoption gates: food depends
              on repeat order density and margin after platform costs; mining depends on site validation and long
              procurement cycles; transport remains a product-clarity and commercialization risk. The portfolio can
              address large workflows, but the evidence does not yet show a common go-to-market motion or quantified
              customer ROI.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The market case is credible as an option set, not as a quantified consolidated revenue opportunity. The
              strongest public evidence is for food-delivery and cloud-kitchen demand; the weakest is for Atoms
              Transport and for converting sector growth into Atoms revenue. The main valuation-relevant diligence
              questions are divisional revenue and gross margin, customer counts and retention by division, deployment
              payback, mining fleet uptime and contracted backlog, food-platform economics after commissions, and a
              defined transport product. Until those data are disclosed, market growth should support a monitoring
              thesis rather than a precise SOM or a revenue multiple derived from generic sector estimates.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market opportunity is real but portfolio-specific
            body: >-
              The retained evidence supports large adjacent food-delivery and cloud-kitchen markets, while Atoms' mining
              and transport opportunities require separate workflow, buyer, and deployment evidence.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM014
          - type: callout
            title: Generic TAMs cannot establish Atoms' SOM
            body: >-
              Published estimates use different scopes and denominators, and no retained source isolates Atoms'
              serviceable segment, pricing, conversion, or divisional economics.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and categories
        blocks:
          - type: paragraph
            body: >-
              Atoms spans three different competitive jobs rather than one homogeneous market. Its food activities
              overlap with delivery-first commercial kitchens, restaurant operating software, and kitchen automation;
              its mining activity overlaps with autonomous haulage and fleet-orchestration vendors; and its transport
              ambition remains a prospective platform rather than a publicly specified product. The company describes
              the model as specialized machines with productive jobs, not general-purpose humanoids. That positioning
              can avoid the complexity of human-form robots, but it also places Atoms against entrenched equipment
              makers, industrial automation suppliers, and focused software providers in each vertical. The relevant
              status quo is often manual labor, conventional equipment, or an internal operating team, so winning
              requires measurable uptime, throughput, safety, and payback rather than a compelling demonstration alone.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Buyer-facing capability and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Buyers appear to purchase outcomes at the workflow level: restaurant operators need a compliant kitchen
              footprint and dependable order operations; mines need safe autonomous movement across existing equipment
              and sites; and industrial operators need integration into fleets, facilities, and maintenance routines.
              CloudKitchens markets private kitchens, logistics-first architecture, and lower upfront investment, while
              Kitchen United markets a turnkey, capital-light route to off-premise demand. These are substitutes for
              parts of Atoms Food's operating model, but neither public page establishes comparable robotics performance
              or customer economics. In mining and transport, an OEM-agnostic approach could reduce replacement
              friction, yet incumbents retain distribution, service networks, installed equipment, and procurement
              trust. Atoms' cross-vertical portfolio may create shared software and capital advantages, but it also
              increases the number of deployment environments that must be supported.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The durable moat case is operational integration: specialized hardware, software, real estate, fleet data,
              and site-level know-how could compound if Atoms converts deployments into repeatable systems. The weaker
              case is that much of the public evidence is positioning language, company-issued announcements, or
              directory summaries rather than independent benchmark data. A competing autonomy platform, established
              mining OEM, restaurant software vendor, or better-capitalized kitchen operator could match an individual
              feature while using a stronger channel. The announced capital base may fund long industrial sales cycles,
              but capital alone does not demonstrate product-market fit. The most material displacement test is whether
              Atoms can show repeatable production deployments with customer-retained economics across more than one
              division.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP013
              - CP015
      - number: '3.4'
        title: Competitive implications and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Atoms should be underwritten as a portfolio of competitive positions, not as a single robotics company
              with one comparable set. Food has the clearest public operating surface and identifiable substitutes;
              mining has a plausible specialized-autonomy thesis but requires independent proof of deployments, safety,
              uptime, and fleet economics; transport is an entrant option with limited public product evidence. The
              decisive diligence package is a segment-by-segment win-loss record, named customer references, contract
              and pricing structure, deployment and maintenance cost, competitor replacement rates, and evidence that
              software or data learned in one division transfers to another. Until those records are available,
              differentiation is plausible but not yet demonstrated as durable.
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Portfolio breadth is not yet a moat
            body: >-
              Cross-vertical scope may create shared infrastructure, but public evidence does not yet prove transfer of
              technology, data, or economics between food, mining, and transport.
            calloutType: insight
            claimRefs:
              - CP003
              - CP011
              - CP014
          - type: callout
            title: Incumbent distribution raises the proof burden
            body: >-
              Established equipment and kitchen operators can compete through installed assets, service, procurement
              trust, or existing customer relationships even when their products are not identical.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is diversified but not financially segmented
        blocks:
          - type: paragraph
            body: >-
              The clearest monetization evidence sits inside Atoms Food. CloudKitchens is described as charging for
              kitchen space, while Otter sells restaurant operations software; Sacra also describes variable processing
              fees and ancillary services. That creates recurring, usage-linked, and service revenue streams, but the
              public record does not provide mix, realized pricing, retention, or contribution margin. The wider
              portfolio adds food real estate, kitchen automation, autonomous mining, and a still-emerging transport
              business. Those activities likely carry very different capital, deployment, and gross-margin profiles, so
              treating Atoms as a single SaaS or marketplace model would be misleading. Public evidence supports the
              architecture of the model, not its consolidated economics.
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI014
      - number: '4.2'
        title: Public pricing is fragmentary and cost pressure is material
        blocks:
          - type: paragraph
            body: >-
              Sacra reports CloudKitchens license terms of six to twelve months with deposits around $30,000, but this
              is third-party reporting rather than a current Atoms price sheet and does not reveal rent, discounts,
              occupancy, bad debt, or realized revenue per kitchen. The model also inherits costs that software-only
              comparisons miss: leased real estate, facility operations, food workflow support, hardware, deployment,
              and maintenance. Forbes reports that delivery platforms can consume 15% to 30% of an order and that
              delivery-only operators face high digital acquisition costs and weak loyalty. These are sector risks
              rather than Atoms results, but they identify the customer-level margin pressure that can constrain rent,
              software, and processing-fee monetization.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
      - number: '4.3'
        title: Financing capacity is visible; liquidity and runway are not
        blocks:
          - type: paragraph
            body: >-
              Multiple sources report a $1.7 billion equity financing led by Andreessen Horowitz in July 2026, while the
              round's post-money valuation was not disclosed. This is evidence of financing access, not evidence of cash
              on hand: the sources reviewed do not provide the amount funded at close, capital already deployed,
              restricted cash, debt, project-finance obligations, burn, or runway. An Atoms and ProKitchens release says
              the financing strengthens European kitchen infrastructure, while investor Machine Spirit argues that
              physical automation requires time and balance sheet. Both are interested-party statements, so the
              underwriting need is a current consolidated cash bridge and division-level uses of funds rather than
              another funding headline.
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.4'
        title: The underwriting case remains blocked by private operating data
        blocks:
          - type: paragraph
            body: >-
              Public-company comparables show what scaled delivery economics can look like, not what Atoms currently
              earns. DoorDash reported a 12.8% net revenue margin and 4.4% contribution profit as a share of marketplace
              GOV in Q1 2026; Uber reported $5.068 billion of Delivery revenue and $961 million of Delivery segment
              operating income for the same quarter. Their scale, accounting definitions, and business mixes differ
              materially from Atoms, so these figures are directional benchmarks only. The financial verdict is
              therefore cautious: Atoms has credible avenues to monetize and substantial financing access, but revenue
              quality, gross-margin durability, capital intensity, sales efficiency, working capital, and runway cannot
              be underwritten without consolidated statements and division-level cohorts.
            claimRefs:
              - CI003
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The $1.7 billion financing is not a substitute for a current cash balance, burn-rate bridge,
              committed-capex schedule, or debt and project-finance detail.
            calloutType: risk
            claimRefs:
              - CI001
              - CI015
          - type: callout
            title: Require a division-level financial data room
            body: >-
              Underwriting should require revenue, gross margin, working capital, capex, retention, sales efficiency,
              and cash runway by Food, Mining, and Transport.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Atoms is positioned as a portfolio of specialized physical systems rather than a general-purpose humanoid
              product. Its public positioning names food, mining, and transport as the initial verticals, with food
              infrastructure and kitchen automation alongside Pronto's mining autonomy. The clearest customer workflow
              is quarry haulage: autonomous trucks operate within an existing mixed fleet, allowing a mine operator to
              add autonomy without replacing every vehicle. In food, Lab37's Bowl Builder is described as a production
              machine for delivery-intensive bowl operations, with a staged commercial availability plan rather than a
              broadly deployed product. The portfolio therefore combines operating businesses, product-in-test systems,
              and a transport division whose public product detail is still limited.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Technical and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a layered operating model: physical equipment and sensors, real-time control and
              state estimation, perception and planning integration, field deployment, and operating infrastructure.
              Atoms' controls recruiting materials identify localization, path following, longitudinal and lateral
              control, sensor fusion, simulation, log replay, and field testing on heavy vehicles. The same material
              names Python and C++ software, NVIDIA Jetson, GPS/RTK, IMUs, CAN interfaces, and ROS or similar
              middleware. Pronto's customer release adds an OEM-agnostic integration layer across Caterpillar and
              Komatsu trucks. This is credible evidence of an engineering stack and deployment workflow, not proof of a
              fully standardized platform across food, mining, and transport or of production-grade security and
              reliability controls.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Maturity, differentiation, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Pronto has the strongest public maturity signal: a company release reports more than two million tons
              moved autonomously over eight months at Heidelberg Materials' Lake Bridgeport quarry and plans for two
              additional sites in 2026. That is meaningful deployment evidence, but it is company-issued and does not
              disclose uptime, incidents, economics, intervention rates, or independently verified safety outcomes. Bowl
              Builder has concrete throughput and footprint specifications, yet the public account describes testing and
              future production slots rather than scaled customer adoption. The controls job posting indicates active
              investment in the technical capability needed to operate heavy vehicles, while also exposing operational
              complexity: field travel, simulation, log replay, sensor fusion, and real-time code. Investors still need
              division-level deployment, reliability, cybersecurity, compliance, and payback evidence.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strongest technical proof
            body: >-
              Pronto's reported mixed-fleet quarry deployment is the most concrete public evidence of Atoms technology
              operating in a customer environment.
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
          - type: callout
            title: Evidence concentration
            body: >-
              Public technical proof is concentrated in one mining workflow; food robotics is at test or
              planned-commercial stage and transport remains lightly specified.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE012
          - type: callout
            title: Diligence boundary
            body: >-
              The disclosed controls stack establishes engineering intent and system components, not a verified security
              program, safety case, uptime record, or cross-division platform reuse.
            calloutType: assumption
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Atoms serves several distinct customer systems rather than one homogeneous account base. In food,
              CloudKitchens targets independent chefs, established brands, food-truck owners, franchises, and legacy
              restaurants that need delivery-first space; the operator supplies equipment and staff while the facility
              supplies kitchen infrastructure and delivery workflow. Otter adds a software buyer and daily user inside
              that same restaurant segment by consolidating marketplace orders and operational data. In mining, the
              buyer is an operator or equipment ecosystem seeking autonomous haulage across existing fleets, with Pronto
              positioned as an OEM-agnostic retrofit layer. The July 2026 Hitachi partnership is explicitly framed
              around giving mining customers more options, but it is an MoU and not proof of a scaled combined product.
              Atoms Transport is described publicly as a wheelbase for robots, without named customers or public
              production deployments.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest where a customer, site, fleet, or operating use case is named.
              CloudKitchens promotional material describes more than 5,000 kitchens in over 400 locations across
              110-plus cities, but the page does not provide an independently audited active-account denominator, cohort
              history, churn, or renewal rate. Its operator testimonials describe expansion to additional cities, repeat
              ordering, and reduced owner workload, yet they remain selected testimonials and cannot establish
              representative retention. Pronto evidence is more operational: International Mining reports a mixed-fleet
              Lake Bridgeport deployment and plans for more than 100 trucks across more than a dozen Heidelberg sites,
              while also noting that the Hitachi-machine project was not yet running. The customer durability thesis
              therefore depends on deployment conversion, uptime, renewal, and economics that Atoms has not publicly
              disclosed.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named proof spans food operators, quarry and mining customers, and strategic equipment partners, but the
              evidentiary quality differs by use case. Fuku Sushi, Coffee Q, Craft Burger, Florentine, and three Atlanta
              delivery brands are quoted as CloudKitchens operators; the available page describes benefits and
              anecdotes, not contract terms, production quality metrics, or retention. In mining, Heidelberg Materials
              is identified at Lake Bridgeport and across a prospective multi-site rollout, with Brazil and Saudi Arabia
              also described as production or deployment contexts. Hitachi Construction Machinery contributes a global
              customer base to a development partnership, while the cited combined project was not yet operating. This
              supports customer access and expansion potential, not a verified recurring-revenue base. Concentration is
              opaque because Atoms does not disclose revenue by customer, division, geography, or partner.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU009
              - CU011
              - CU013
      - number: '6.4'
        title: What must be verified
        blocks:
          - type: paragraph
            body: >-
              The customer case is investable only if Atoms can convert broad platform positioning into repeatable,
              measurable deployments. The next diligence request should separate food occupancy and active restaurant
              accounts from kitchen capacity, then provide gross retention, churn, cohort expansion, average revenue per
              account, and customer-level concentration. For Pronto, request signed customer contracts, live truck
              counts by site, production versus pilot status, safety and uptime logs, implementation duration, pricing,
              and renewal economics. The Hitachi relationship should be tracked as a channel and product-development
              signal until a combined system is running. Public evidence does not support a single customer-count,
              utilization, NRR, or concentration number, so those metrics remain gaps rather than estimates.
            claimRefs:
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The best proof is operational, not logo-based
            body: >-
              Pronto's named mixed-fleet deployment and reported multi-site Heidelberg rollout provide stronger customer
              evidence than an undifferentiated logo list, because the sources identify equipment, sites, and deployment
              scope.
            calloutType: strength
            claimRefs:
              - CU006
              - CU011
          - type: callout
            title: Retention and concentration remain unmeasured
            body: >-
              Atoms does not publicly disclose active accounts, churn, renewal, NRR, customer-level revenue, or
              division-level concentration, so broad footprint and testimonial evidence cannot support a durable
              recurring-revenue conclusion.
            calloutType: risk
            claimRefs:
              - CU005
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is not a single disclosed lawsuit or outage; it is the difficulty of proving
              repeatable economics across three physically different businesses. A fetched company-oriented investment
              article describes Atoms as combining CloudKitchens, Pronto, and Lab37 and explicitly identifies hardware
              capital intensity, three-sector execution complexity, regulatory exposure, and undisclosed valuation as
              risks. A separate industry article describes Food as the operating division, Mining as early, and
              Transport as not yet announced. Those sources are useful for framing, but they are not audited operating
              evidence. The chapter therefore ranks opacity and execution as material residual exposures and sets
              measurable diligence triggers rather than inferring a loss, incident, or compliance failure that the
              assigned sources do not prove.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Atoms' mining and transport ambitions place it in domains where compliance evidence must be specific to
              the operating design and jurisdiction. The Electronic Code of Federal Regulations states that Part 56 sets
              mandatory safety and health standards for surface metal and nonmetal mines, including open-pit mines, and
              defines mobile equipment broadly. That is a concrete regulatory baseline for any Pronto deployment in a
              covered mine, not evidence that Atoms has breached it. NHTSA's automated-driving reporting guidance also
              requires named entities to report specified crashes and warns that incident data are not normalized for
              exposure. The assigned Federal Register URL, however, fetched as an unrelated NIH closed-meeting notice,
              and the assigned CourtListener URL fetched as an unrelated case. These retrieval mismatches make
              Atoms-specific litigation and transport-rule conclusions unresolved.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Physical automation creates failure modes that software diligence alone cannot close: installation
              quality, sensor and telemetry reliability, safe human interaction, maintenance, uptime, and site-level
              economics. The assigned coverage says Atoms must manufacture, ship, install, and maintain physical
              systems, while its three divisions have different technical and operating cadences. A partner-oriented
              page describes the strategy as tying labor, land, fleets, kitchens, mines, robotics, and operations
              together, which increases potential integration value but also creates coupled failure modes. NHTSA's
              caution that crash data may be incomplete or unrepresentative reinforces the need for denominator-based
              monitoring. No assigned source provides Atoms-wide uptime, incident counts, safety certification,
              cybersecurity controls, recall history, or validated payback; each remains a diligence item rather than a
              negative finding.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Dependencies, financial opacity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The capital structure is a dependency as well as a strength. The assigned coverage reports a $1.7 billion
              equity round and additional debt facilities, but terms, post-money valuation, company-wide revenue,
              margins, burn, and runway are not disclosed in the retained evidence. That prevents a reliable conclusion
              about liquidity or whether hardware deployment can be financed without dilution or asset-level leverage.
              The company also depends on customers accepting specialized systems in food, mining, and transport, yet
              the pool does not establish production-customer counts or pilot conversion. Monitoring should focus on
              disclosed deployment contracts, safety and compliance findings, uptime and incident rates, contribution
              margin by division, cash runway, debt covenants, and customer concentration. A thesis break would be
              repeated reportable safety events, a material regulatory stop, inability to demonstrate site-level
              payback, or financing that materially increases dilution or fixed obligations without corresponding
              contracted revenue.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned evidence supports exposure categories and regulatory obligations, but it does not establish
              an Atoms-specific safety incident, litigation outcome, uptime rate, customer concentration, or cash-burn
              figure.
            calloutType: risk
            claimRefs:
              - CR008
              - CR012
              - CR015
              - CR016
          - type: callout
            title: Immediate diligence gate
            body: >-
              Do not underwrite transport or mining scale-up until Atoms provides jurisdiction-specific safety
              documentation, production-customer contracts, incident and uptime denominators, and division-level cash
              and margin evidence.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports tracking Atoms rather than issuing a buy. SiliconANGLE reports a $1.7 billion
              equity investment led by Andreessen Horowitz, while also stating that the company did not disclose the
              valuation attached to the investment. The financing is therefore evidence of investor backing and capital
              availability, not evidence of a $1.7 billion valuation or of a specific ownership percentage. Restaurant
              Technology News separately describes debt partners but says their facility sizes and terms were not
              disclosed. Without revenue, margin, cash-burn, cap-table, liquidation-preference, or share-price data, a
              price-sensitive recommendation cannot be defended with a point estimate. Entry discipline should require
              verified valuation, security terms, consolidated revenue, divisional contribution, and commercial
              deployment metrics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Atoms combines an existing operating base with specialized automation rather than
              relying only on a laboratory demonstration. Startup Fortune describes the business as spanning food,
              mining, and transport, and Restaurant Technology News identifies CloudKitchens, Otter, Lab37, Picnic,
              ProFood, Pronto, and an undeveloped transport business. This breadth may create shared testing and
              deployment advantages, but it also creates a difficult underwriting problem because the public record does
              not show how the assets are integrated or which division generates cash. The anti-thesis is strengthened
              by the disclosed-information gap: Awesome Agents says the only disclosed revenue figure is approximately
              $2 million a year from one kitchen, while the broader company valuation remains undisclosed. The thesis
              becomes investable only when deployment, retention, contribution margin, and capital-allocation evidence
              are independently reviewable.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario framework
        blocks:
          - type: paragraph
            body: >-
              A scenario range is more honest than a single valuation because the key denominators are missing. The
              upside case requires Atoms to convert its financing into repeatable machine deployments, demonstrate
              attractive economics in food and mining, and show that the divisions reinforce rather than subsidize one
              another. The base case assumes continued private-company opacity, meaningful development spending, and
              uneven commercialization; under that case, the appropriate action is to track milestones rather than pay
              for an unverified future multiple. The downside case is that capital intensity, integration complexity,
              customer adoption, or regulatory and site constraints prevent sufficient utilization, while the financing
              terms create dilution or preference overhang. Mining-market growth is supportive context, not proof of
              Atoms revenue: ResearchAndMarkets material carried by Yahoo Finance estimates the market rising from $4.21
              billion in 2025 to $4.56 billion in 2026, but that is an industry forecast.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
              - CV017
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Atoms is not exit-ready on public evidence. The current record lacks a confirmed valuation, share class
              and preference schedule, consolidated financial statements, divisional revenue, deployment counts,
              customer contracts, retention, cash runway, and a demonstrated path to liquidity. Comparable context also
              needs care: Wonder is reported by Restaurant Technology News at a $9 billion pre-money valuation after a
              $650 million raise, but it is a different operating model and should not be treated as a direct multiple
              benchmark. Mining-market reports point to demand and incumbent competition, yet they do not establish
              Atoms' win rate or pricing power. The investment thesis should break if management cannot produce a
              reconciled cap table and financing terms, if live deployments fail to reach contracted utilization, if
              gross margins remain structurally negative after deployment scale, or if new capital is required before
              unit economics are independently validated.
            claimRefs:
              - CV014
              - CV016
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price discovery
            body: >-
              The financing is a strong signal of investor support, but the absence of a disclosed valuation and
              operating denominators makes a buy recommendation unsupported.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: Capital structure is unresolved
            body: >-
              Equity size is reported, while debt-partner terms, ownership, dilution, and preferences remain
              undisclosed.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
          - type: callout
            title: Market growth is not company traction
            body: >-
              Mining automation forecasts describe a growing addressable market, but they do not prove Atoms' revenue,
              deployment, or share.
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
