company:
  name: Atoms
chapter:
  number: 4
  title: Financials
  summary: >-
    Atoms has several plausible revenue mechanisms across kitchen infrastructure,
    software, transaction-linked fees, and industrial automation, but public evidence
    does not disclose consolidated revenue, gross margin, cash, burn, or runway. The
    $1.7 billion July 2026 financing adds capacity to invest, yet it does not by itself
    establish cash availability, capital efficiency, or a defensible margin path.
sections:
  - id: revenue-architecture
    title: Revenue architecture is diversified but not financially segmented
    body: >-
      The clearest monetization evidence sits inside Atoms Food. CloudKitchens is
      described as charging for kitchen space, while Otter sells restaurant operations
      software; Sacra also describes variable processing fees and ancillary services.
      That creates recurring, usage-linked, and service revenue streams, but the public
      record does not provide mix, realized pricing, retention, or contribution margin.
      The wider portfolio adds food real estate, kitchen automation, autonomous mining,
      and a still-emerging transport business. Those activities likely carry very
      different capital, deployment, and gross-margin profiles, so treating Atoms as a
      single SaaS or marketplace model would be misleading. Public evidence supports
      the architecture of the model, not its consolidated economics.
    claimRefs: [CI004, CI005, CI011, CI012, CI013]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Public pricing is fragmentary and cost pressure is material
    body: >-
      Sacra reports CloudKitchens license terms of six to twelve months with deposits
      around $30,000, but this is third-party reporting rather than a current Atoms
      price sheet and does not reveal rent, discounts, occupancy, bad debt, or realized
      revenue per kitchen. The model also inherits costs that software-only comparisons
      miss: leased real estate, facility operations, food workflow support, hardware,
      deployment, and maintenance. Forbes reports that delivery platforms can consume
      15% to 30% of an order and that delivery-only operators face high digital
      acquisition costs and weak loyalty. These are sector risks rather than Atoms
      results, but they identify the customer-level margin pressure that can constrain
      rent, software, and processing-fee monetization.
    claimRefs: [CI006, CI007, CI008, CI011]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Financing capacity is visible; liquidity and runway are not
    body: >-
      Multiple sources report a $1.7 billion equity financing led by Andreessen
      Horowitz in July 2026, while the round's post-money valuation was not disclosed.
      This is evidence of financing access, not evidence of cash on hand: the sources
      reviewed do not provide the amount funded at close, capital already deployed,
      restricted cash, debt, project-finance obligations, burn, or runway. An Atoms and
      ProKitchens release says the financing strengthens European kitchen
      infrastructure, while investor Machine Spirit argues that physical automation
      requires time and balance sheet. Both are interested-party statements, so the
      underwriting need is a current consolidated cash bridge and division-level uses
      of funds rather than another funding headline.
    claimRefs: [CI001, CI002, CI012, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: The underwriting case remains blocked by private operating data
    body: >-
      Public-company comparables show what scaled delivery economics can look like, not
      what Atoms currently earns. DoorDash reported a 12.8% net revenue margin and 4.4%
      contribution profit as a share of marketplace GOV in Q1 2026; Uber reported
      $5.068 billion of Delivery revenue and $961 million of Delivery segment operating
      income for the same quarter. Their scale, accounting definitions, and business
      mixes differ materially from Atoms, so these figures are directional benchmarks
      only. The financial verdict is therefore cautious: Atoms has credible avenues to
      monetize and substantial financing access, but revenue quality, gross-margin
      durability, capital intensity, sales efficiency, working capital, and runway
      cannot be underwritten without consolidated statements and division-level cohorts.
    claimRefs: [CI003, CI009, CI010, CI015, CI016]
