callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $1.7 billion financing is not a substitute for a current cash balance,
      burn-rate bridge, committed-capex schedule, or debt and project-finance detail.
    claimRefs: [CI001, CI015]
  - calloutType: recommendation
    title: Require a division-level financial data room
    body: >-
      Underwriting should require revenue, gross margin, working capital, capex,
      retention, sales efficiency, and cash runway by Food, Mining, and Transport.
    claimRefs: [CI011, CI015, CI016]
