      - [Otter software, "Not publicly disclosed", "Neither list nor realized price available", "Packaging, discounting, attach rate, and churn unknown", "Software margin and sales efficiency remain unverified"]
      - [Processing fees, "Rate not publicly disclosed", "Realized take rate unavailable", "Refunds, platform fees, and tenant mix unknown", "Volume growth cannot be translated into net revenue"]
      - [Mining / transport, "Commercial model not publicly disclosed", "Contract value and billing basis unavailable", "Hardware, deployment, maintenance, and financing terms unknown", "Backlog quality and lifetime margin cannot be assessed"]
    notes: "The only quantified term is a Sacra-reported deposit; it is not revenue and should not be treated as current Atoms list pricing."
    claimRefs: [CI004, CI005, CI006, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Consolidated revenue / ARR, "Unavailable", "Low", "Defines scale and recurring-revenue quality", "Audited monthly revenue bridge by division, product, and geography"]
      - [Gross margin, "Unavailable", "Low", "Separates software leverage from real-estate, service, and hardware costs", "Gross margin by division with hosting, labor, occupancy, hardware, warranty, and support allocation"]
      - [CAC and payback, "Unavailable", "Low", "Tests whether multi-vertical GTM can scale efficiently", "Cohort CAC, sales cycle, implementation cost, churn, and payback by product"]
      - [Cash burn and runway, "Unavailable", "Low", "Determines financing dependency and next-round timing", "Current cash, monthly net burn, restricted cash, committed capex, and downside runway"]
      - [Latest financing, "$1.7B equity round reported in July 2026", "High for announced amount; low for cash availability", "Shows capital access but not liquidity or efficiency", "Closing statement, funded amount, primary versus secondary mix, and use-of-funds budget"]
      - [DoorDash benchmark, "Q1 2026: 12.8% net revenue margin; 4.4% contribution profit / GOV", "High for DoorDash; non-comparable to Atoms", "Illustrates mature delivery-platform monetization and cost burden", "Use only as a directional benchmark after reconciling definitions"]
      - [Uber Delivery benchmark, "Q1 2026: $5.068B revenue; $961M segment operating income", "High for Uber; non-comparable to Atoms", "Illustrates scaled delivery segment economics", "Use only after isolating Atoms Food revenue and direct costs"]
    notes: "Unavailable means the assigned public evidence did not disclose the metric; comparator figures retain issuer definitions and do not estimate Atoms results."
    claimRefs: [CI001, CI003, CI009, CI010, CI015, CI016]
