  topStrengths:
    - Reported $1.7 billion financing provides substantial capacity for hardware-heavy deployment.
    - Existing food infrastructure and Pronto-linked mining operations offer more than a laboratory-only starting point.
    - Multi-vertical exposure could create shared automation and operating-system advantages if integration works.
  topRisks:
    - Consolidated revenue, margins, cash burn, runway, and segment economics are undisclosed.
    - Transport remains commercially early while mining and food deployment economics are not independently verified.
    - Capital intensity, integration complexity, safety, regulatory, and customer-adoption risks could delay payback.
  unresolvedGaps:
    - Confirm the post-money valuation, cap table, security terms, and liquidation preferences for the 2026 financing.
    - >-
      Obtain consolidated and division-level revenue, gross margin, burn, runway, deployment, retention, and utilization
      data.
    - Verify customer contracts, safety and uptime denominators, and the commercial maturity of Atoms Transport.
