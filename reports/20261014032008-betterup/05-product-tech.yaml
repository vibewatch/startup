callouts:
  - calloutType: strength
    title: "Modern API Architecture and Agentic MCP Integration"
    body: "BetterUp demonstrates forward-looking developer and enterprise integration capabilities by offering an official Model Context Protocol (MCP) server at mcp.betterup.co. This allows Claude desktop and enterprise users to initiate conversational coaching and manage coach bookings directly from their agentic workflow environment via OAuth 2.1 authentication."
    claimRefs:
      - "CE006"
  - calloutType: risk
    title: "Third-Party Foundation Model Dependency and Data Perimeter"
    body: "While BetterUp emphasizes over five million proprietary historical coaching sessions, its real-time conversational AI coaching relies on external foundation models accessed via the OpenAI API. Enterprise buyers in regulated industries face vendor lock-in and must verify that sensitive employee behavioral data remains strictly partitioned within dedicated enterprise tenant boundaries."
    claimRefs:
      - "CE008"
      - "CE011"
      - "CE012"
