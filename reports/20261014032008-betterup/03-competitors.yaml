callouts:
  - calloutType: insight
    title: The Enterprise Delivery Moat vs. Frontline Coverage Gap
    body: BetterUp’s deep coach network, scientific validation, and enterprise governance create a defensible barrier to entry at the Fortune 500 executive layer. However, its high seat costs leave frontline and mid-level managers underserved, creating a fertile market for usage-based and AI-native challengers.
    claimRefs:
      - CP001
      - CP006
      - CP014
  - calloutType: risk
    title: Contract Pricing Scrutiny and Secondary Valuation Pressure
    body: As enterprise budgets tighten, human-coaching contract minimums face intense ROI scrutiny. The emergence of self-serve AI platforms combined with secondary-market implied valuation discounts suggests multiple contraction across the broader digital coaching category.
    claimRefs:
      - CP010
      - CP015
      - CP016
