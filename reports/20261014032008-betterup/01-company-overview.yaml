figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Chronological evolution of BetterUp from 2013 founding through major funding rounds, platform launches, and AI integration.
    data:
      items:
        - label: '2013: Company Founding'
          date: '2013'
          detail: Alexi Robichaux and Eduardo Medina establish BetterUp to create a mobile-first digital coaching platform.
        - label: '2016: Platform Launch & Series A'
          date: '2016'
          detail: BetterUp raises $12.9M across seed and Series A rounds and officially launches its enterprise mobile coaching app.
        - label: '2018: BetterUp Labs Established'
          date: '2018'
          detail: Launches BetterUp Labs to pursue research in organizational psychology, behavioral neuroscience, and human performance.
        - label: '2019: Series C Growth Round'
          date: '2019'
          detail: Raises $103M in Series C financing to accelerate enterprise client acquisition and international presence.
        - label: '2021: Series D Unicorn Valuation'
          date: 2021-02
          detail: Closes $125M Series D at a $1.7B valuation during workplace disruption and remote work transitions.
        - label: '2021: Series E & Global Scale'
          date: 2021-10
          detail: Raises $300M Series E at a $4.7B valuation and acquires Motive and Impraise to expand sentiment and performance analytics.
        - label: '2023: Targeted Acquisitions & Defense Win'
          date: '2023'
          detail: Acquires sleep coaching company Crescent and secures a $99M coaching contract with the United States Air Force.
        - label: '2025: Dedicated AI Coaching Product'
          date: '2025'
          detail: Releases pure AI coaching application following acquisitions of Heyday and Practica to deliver scalable workforce coaching.
    approximationNotes: Milestones assembled from verified corporate announcements, press releases, and reputable industry reporting.
    claimRefs:
      - CO010
      - CO011
      - CO012
