company:
  name: BetterUp
chapter:
  number: 1
  title: Company Overview
  summary: BetterUp is an enterprise digital coaching and human transformation platform founded in 2013 and last valued at $4.7 billion in its October 2021 Series E round. The company combines 1-on-1 coaching, behavioral science, and generative AI tools to serve over 600 enterprise organizations worldwide. While BetterUp demonstrated strong historical revenue growth reaching $100 million ARR in 2021, current revenue, profitability, and unit economics remain undisclosed private figures.
sections:
  - id: corporate-identity-and-foundation
    title: Corporate Identity and Foundation
    body: BetterUp, Inc. is a private enterprise software and workforce development company founded in 2013 by Alexi Robichaux and Eduardo Medina. The company is legally organized as a Delaware corporation and maintains its corporate headquarters at 3100 E 5th St in Austin, Texas, having expanded from its original base in San Francisco, California. BetterUp pioneered the category of virtual professional coaching, positioning its core offering as a comprehensive Human Transformation Platform that integrates personalized 1-on-1 human coaching, evidence-based behavioral psychology, and real-time performance analytics. Through software integrations embedded into enterprise workflow environments such as Slack, Microsoft Teams, and Workday, BetterUp delivers customized coaching interventions directly into daily employee routines. The company commercial business model operates as an enterprise software-as-a-service subscription, charging corporate employers for access to tiered coaching programs, specialized AI modules, and organizational wellness analytics across leadership, management, and individual contributor populations.
    claimRefs:
      - CO001
      - CO010
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership and Governance Structure
    body: BetterUp continues to be led by its original co-founders, Chief Executive Officer Alexi Robichaux and Chief Operating Officer Eduardo Medina, both of whom have guided the business through multiple technology iterations and institutional funding rounds since 2013. Robichaux brings product and category creation experience from his prior tenure at VMware and Socialcast, serving as the company public voice and strategic driver. Medina oversees organizational operations, technology infrastructure, and the international coach network. In March 2021, the company expanded its executive bench by appointing Prince Harry, Duke of Sussex, as Chief Impact Officer to advocate for workplace mental fitness and champion social impact initiatives. To anchor its commercial credibility in rigorous academic research, BetterUp established an executive Science Board comprised of renowned behavioral scientists and psychologists, including Adam Grant and Quinetta Roberson. Governance remains private, with board control concentrated among the founders and early venture representatives, creating key-person reliance on the founding pair.
    claimRefs:
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO002
  - id: capitalization-and-investor-syndicate
    title: Capitalization History and Investor Syndicate
    body: BetterUp capitalization reflects an aggressive growth trajectory financed by premier institutional and crossover technology investors. The company achieved unicorn status in February 2021 by raising a $125 million Series D financing round at a $1.7 billion valuation. Just eight months later, in October 2021, BetterUp closed a massive $300 million Series E round that lifted its post-money valuation to $4.7 billion and pushed cumulative equity capital raised to approximately $600 million. The Series E round was co-led by Wellington Management, ICONIQ Growth, and Lightspeed Venture Partners, alongside participation from strategic corporate partners Salesforce Ventures and Mubadala Capital. Both Salesforce and Mubadala serve dual roles as capital backers and enterprise enterprise customers of the platform. Despite this substantial institutional capitalization, BetterUp has kept its detailed capitalization table, secondary transaction history, and shareholder voting thresholds confidential, requiring investors to treat current equity value as an unverified private marker pending updated primary disclosures.
    claimRefs:
      - CO002
      - CO003
      - CO008
      - CO009
      - CO013
    tableRefs:
      - TO003
  - id: operational-scale-and-corporate-milestones
    title: Operational Scale and Strategic Milestones
    body: 'BetterUp has demonstrated significant enterprise commercial traction since its initial beta testing with corporations such as Logitech, Capital One, and Deloitte. By 2021, the organization reported surpassing $100 million in annual recurring revenue with a net revenue retention rate exceeding 170%. Operationally, BetterUp has expanded its customer base to serve more than 600 global enterprise organizations, supported by a network of over 3,000 certified professional coaches delivering guidance in dozens of languages across 70 countries. Strategic mergers and acquisitions have broadened the product footprint beyond traditional executive coaching: the company acquired Motive and Impraise in 2021 to add sentiment analysis and performance management capabilities, acquired sleep coach Crescent in 2023, and acquired Heyday and Practica in 2025 to launch an autonomous AI coaching suite. However, because BetterUp has withheld current revenue and margin data since 2021, long-term unit economics and ongoing operational profitability remain essential diligence questions.'
    claimRefs:
      - CO004
      - CO011
      - CO012
    figureRefs:
      - FO001
