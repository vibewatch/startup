chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Foundation
        blocks:
          - type: paragraph
            body: >-
              BetterUp, Inc. is a private enterprise software and workforce development company founded in 2013 by Alexi
              Robichaux and Eduardo Medina. The company is legally organized as a Delaware corporation and maintains its
              corporate headquarters at 3100 E 5th St in Austin, Texas, having expanded from its original base in San
              Francisco, California. BetterUp pioneered the category of virtual professional coaching, positioning its
              core offering as a comprehensive Human Transformation Platform that integrates personalized 1-on-1 human
              coaching, evidence-based behavioral psychology, and real-time performance analytics. Through software
              integrations embedded into enterprise workflow environments such as Slack, Microsoft Teams, and Workday,
              BetterUp delivers customized coaching interventions directly into daily employee routines. The company
              commercial business model operates as an enterprise software-as-a-service subscription, charging corporate
              employers for access to tiered coaching programs, specialized AI modules, and organizational wellness
              analytics across leadership, management, and individual contributor populations.
            claimRefs:
              - CO001
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
      - number: '1.2'
        title: Executive Leadership and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              BetterUp continues to be led by its original co-founders, Chief Executive Officer Alexi Robichaux and
              Chief Operating Officer Eduardo Medina, both of whom have guided the business through multiple technology
              iterations and institutional funding rounds since 2013. Robichaux brings product and category creation
              experience from his prior tenure at VMware and Socialcast, serving as the company public voice and
              strategic driver. Medina oversees organizational operations, technology infrastructure, and the
              international coach network. In March 2021, the company expanded its executive bench by appointing Prince
              Harry, Duke of Sussex, as Chief Impact Officer to advocate for workplace mental fitness and champion
              social impact initiatives. To anchor its commercial credibility in rigorous academic research, BetterUp
              established an executive Science Board comprised of renowned behavioral scientists and psychologists,
              including Adam Grant and Quinetta Roberson. Governance remains private, with board control concentrated
              among the founders and early venture representatives, creating key-person reliance on the founding pair.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              BetterUp capitalization reflects an aggressive growth trajectory financed by premier institutional and
              crossover technology investors. The company achieved unicorn status in February 2021 by raising a $125
              million Series D financing round at a $1.7 billion valuation. Just eight months later, in October 2021,
              BetterUp closed a massive $300 million Series E round that lifted its post-money valuation to $4.7 billion
              and pushed cumulative equity capital raised to approximately $600 million. The Series E round was co-led
              by Wellington Management, ICONIQ Growth, and Lightspeed Venture Partners, alongside participation from
              strategic corporate partners Salesforce Ventures and Mubadala Capital. Both Salesforce and Mubadala serve
              dual roles as capital backers and enterprise enterprise customers of the platform. Despite this
              substantial institutional capitalization, BetterUp has kept its detailed capitalization table, secondary
              transaction history, and shareholder voting thresholds confidential, requiring investors to treat current
              equity value as an unverified private marker pending updated primary disclosures.
            claimRefs:
              - CO002
              - CO003
              - CO008
              - CO009
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO008
              - CO009
      - number: '1.4'
        title: Operational Scale and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              BetterUp has demonstrated significant enterprise commercial traction since its initial beta testing with
              corporations such as Logitech, Capital One, and Deloitte. By 2021, the organization reported surpassing
              $100 million in annual recurring revenue with a net revenue retention rate exceeding 170%. Operationally,
              BetterUp has expanded its customer base to serve more than 600 global enterprise organizations, supported
              by a network of over 3,000 certified professional coaches delivering guidance in dozens of languages
              across 70 countries. Strategic mergers and acquisitions have broadened the product footprint beyond
              traditional executive coaching: the company acquired Motive and Impraise in 2021 to add sentiment analysis
              and performance management capabilities, acquired sleep coach Crescent in 2023, and acquired Heyday and
              Practica in 2025 to launch an autonomous AI coaching suite. However, because BetterUp has withheld current
              revenue and margin data since 2021, long-term unit economics and ongoing operational profitability remain
              essential diligence questions.
            claimRefs:
              - CO004
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO010
              - CO011
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Benchmark Stagnation Since 2021 Peak
            body: >-
              BetterUp last disclosed primary valuation of $4.7 billion dates to October 2021. With financial
              disclosures remaining private since then, evaluating current enterprise worth requires rigorous scrutiny
              of growth rates and post-pandemic enterprise software multiple compressions.
            calloutType: insight
            claimRefs:
              - CO002
              - CO004
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Spend Categorization
        blocks:
          - type: paragraph
            body: >-
              The addressable market for BetterUp sits at the convergence of corporate training, executive leadership
              coaching, and preventative employee wellbeing. Historically, corporate coaching functioned as a highly
              fragmented cottage industry reserved for senior executive remediation or bespoke retreat events, creating
              steep cost and logistical barriers to organizational scale. BetterUp delineates its addressable boundary
              by capturing recurring software and coaching budgets across four integrated platform pillars: Lead for
              executive and leadership development, Manage for frontline people managers, Grow for workforce-wide AI
              coaching, and Ready for organizational change resilience. This structure deliberately excludes ad-hoc
              physical consulting travel, static compliance learning management modules, and acute psychiatric
              healthcare claims, focusing squarely on repeatable enterprise performance improvement.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the enterprise digital coaching opportunity requires disaggregating broad industry estimates into
              operational software and service layers. Industry analyst Josh Bersin estimates that the broader corporate
              training, education, and employee wellbeing market exceeds $250 billion worldwide, characterized by high
              fragmentation and recession-resilient spending. Within this broader universe, enterprise professional
              development and leadership education represent approximately $60 billion in global spend, while the
              scalable virtual coaching and wellbeing addressable market (TAM) reaches approximately $20 billion.
              BetterUp's serviceable addressable market (SAM) focuses on subscription-based digital coaching platforms
              serving enterprises with over 500 knowledge workers, estimated at $5.0 billion globally. The serviceable
              obtainable market (SOM) of approximately $1.5 billion reflects near-term enterprise commitments adopting
              integrated human and AI coaching in the workflow.
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
      - number: '2.3'
        title: Buyer Personas, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              BetterUp's commercial traction relies on multi-threaded budget ownership across enterprise human capital
              leadership. The primary economic buyer is typically the Chief Human Resources Officer (CHRO), Chief People
              Officer, or Head of Learning and Development (L&D), who purchases enterprise-wide licenses to address
              executive retention, management effectiveness, and digital transformation readiness. For specialized
              deployments such as BetterUp Ready or Grow, procurement often pulls from decentralized business unit
              budgets or Total Rewards pools. With reported scale exceeding 750 enterprise customers and more than 4,000
              coaches across 70 countries, BetterUp justifies premium platform licensing by proving quantifiable
              organizational return on investment, including reported 41 percent productivity gains and 50 percent
              reductions in voluntary turnover among active participants.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM012
              - CM014
      - number: '2.4'
        title: Adoption Drivers, Friction Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Enterprise demand for digital coaching is propelled by distributed workforce management challenges, rapid
              technological shifts, and the proliferation of AI-generated work outputs that require higher managerial
              judgment. However, adoption velocity encounters several material friction points. Third-party buyer data
              from Vendr indicates that BetterUp contracts carry a high median annual commitment of $145,650, with
              per-member fees spanning $1,800 to $4,500, creating procurement resistance for budget-constrained
              mid-market teams. Furthermore, enterprise rollouts typically require two to three months of
              implementation, and the competitive landscape includes over 2,290 active professional development
              entities. Crucially, because BetterUp remains privately held following its $4.7 billion valuation Series E
              round, net revenue retention, gross margins, and seat-level renewal rates remain private, representing
              essential diligence gaps.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Remedial Intervention to Preventative Workforce Scaling
            body: >-
              Historically, corporate coaching operated as a reactive, remedial intervention for struggling executives
              due to prohibitive per-hour psychologist rates. BetterUp's platform architecture repositions coaching as a
              proactive workforce development vitamin delivered across all organizational tiers, expanding addressable
              budget pools from isolated executive line items into recurring enterprise software allocations.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
          - type: callout
            title: Enterprise Contract Concentration and Procurement Hurdle Rates
            body: >-
              Third-party transaction intelligence reveals a median enterprise contract value of approximately $145,650
              with two- to three-month deployment cycles. While these metrics substantiate substantial enterprise
              willingness to pay, they also expose BetterUp to protracted procurement scrutiny and budget vulnerability
              during corporate cost-containment cycles.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Direct Peers
        blocks:
          - type: paragraph
            body: >-
              The enterprise professional development and digital coaching sector has evolved from an executive-only
              luxury into a competitive enterprise software category. BetterUp faces formidable direct competition from
              well-funded peers, most notably CoachHub and Ezra Coaching. CoachHub matches BetterUp’s international
              breadth with thousands of certified coaches across more than ninety countries, providing multinational
              corporations with a viable direct substitute. Ezra leverages the global distribution and corporate
              relationships of its parent company, Adecco Group, to capture enterprise executive development budgets.
              Meanwhile, adjacent vendors like Torch merge 1:1 coaching with internal mentoring workflows, and
              mid-market providers like Boon Health offer streamlined alternatives for mid-sized employers.
              Additionally, self-hosted software platforms like EzyCourse represent an internal-build alternative for
              organizations seeking to bypass recurring per-seat vendor licensing entirely.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability, AI Integration & Trust Differentiation
        blocks:
          - type: paragraph
            body: >-
              BetterUp maintains differentiation through its proprietary Whole Person Model and an extensive behavioral
              science research foundation refined across more than five million sessions. The platform combines 1:1
              certified human coaching with enterprise AI capabilities like BetterUp Manage and conversational
              integrations in Slack and Microsoft Teams. While BetterUp highlights measurable outcomes, including a
              forty-one percent lift in perceived employee value creation, its core human delivery model shares an
              underlying constraint with peers: the vast majority of commercial coaching platforms recruit from the same
              broader ecosystem of independent, contract-based certified coaches. At the other end of the spectrum,
              emerging AI-native platforms like Risely decouple developmental coaching from human labor entirely,
              deploying automated coaching bots across dozens of manager competencies at a fraction of traditional
              enterprise costs.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Pricing Models & Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Procurement friction remains a defining structural fault line across the competitive landscape. BetterUp
              sells primarily through sales-gated annual enterprise commitments, typically costing between $3,000 and
              $5,000 per user per year with median enterprise commitments exceeding $145,000. These contracts entail
              lengthy two-to-three-month implementation cycles involving security audits, HRIS integrations, and
              administrative onboarding. In contrast, alternative platforms are pioneering more flexible commercial
              models. Boon Health utilizes usage-based pricing where employers pay exclusively for completed coaching
              sessions, eliminating shelfware risk and permitting rapid one-week launches. Meanwhile, self-serve AI
              tools like Risely offer transparent monthly subscriptions at $59 per seat with free trials, significantly
              lowering adoption barriers and allowing decentralized department-level purchasing.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability & Strategic Positioning
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s moat rests on its high-touch enterprise sales engine, Fortune 500 customer footprint, and
              multi-year data advantage rather than exclusive ownership of human coaching talent. High annual price
              commitments and extensive organizational workflows establish strong switching costs that protect
              BetterUp’s installed base from casual replacement. Nonetheless, the company faces growing displacement
              risk at the margins. As enterprise buyers seek to democratize coaching beyond executive suites without
              exploding training budgets, AI-native platforms and usage-based providers threaten to siphon off
              incremental budget expansion. This dynamic is reinforced by secondary-market prints and valuation marks
              indicating substantial multiple compression from BetterUp’s 2021 peak valuation of $4.7 billion down to
              approximately $1.2 billion in 2026.
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Enterprise Delivery Moat vs. Frontline Coverage Gap
            body: >-
              BetterUp’s deep coach network, scientific validation, and enterprise governance create a defensible
              barrier to entry at the Fortune 500 executive layer. However, its high seat costs leave frontline and
              mid-level managers underserved, creating a fertile market for usage-based and AI-native challengers.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP014
          - type: callout
            title: Contract Pricing Scrutiny and Secondary Valuation Pressure
            body: >-
              As enterprise budgets tighten, human-coaching contract minimums face intense ROI scrutiny. The emergence
              of self-serve AI platforms combined with secondary-market implied valuation discounts suggests multiple
              contraction across the broader digital coaching category.
            calloutType: risk
            claimRefs:
              - CP010
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              BetterUp monetizes primarily through enterprise business-to-business subscription contracts structured
              across three core product tiers: BetterUp Care, Coaching (Lead), and Enterprise. The Care tier addresses
              employee mental wellbeing, stress management, and organizational resilience as a corporate benefits
              product, typically licensed on a per-employee basis. The Coaching tier introduces one-on-one professional
              coaching, leadership development journeys, and tailored career growth paths for managers and
              high-potential employees. At the Enterprise level, organizations access comprehensive executive coaching,
              team coaching modules, real-time people analytics, and automated integrations with enterprise Human
              Capital Management systems including Workday, SAP SuccessFactors, Slack, and Microsoft Teams. Across all
              published tiers, list pricing is strictly withheld from public channels and quoted on request, reflecting
              custom pricing tailored to enterprise headcount, coaching modality mix, and service commitments.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI008
              - CI010
              - CI013
      - number: '4.2'
        title: Go-To-Market Motion and Customer Value Realization
        blocks:
          - type: paragraph
            body: >-
              BetterUp's go-to-market motion relies on direct enterprise sales targeting Chief Human Resources Officers,
              Chief Learning Officers, and corporate benefits buyers. Commercial messaging centers on quantifiable
              workforce return on investment, asserting that employee coaching yields a 41% increase in top-tier
              performance ratings, an average 14x return on program investment, and a 50% decrease in voluntary
              turnover. For sales leadership and commercial teams, BetterUp claims an average 14% improvement in quota
              attainment and customer satisfaction scores. Customer adoption has reached more than 750 global
              enterprises, including high-profile logos such as Google, Salesforce, and Hilton, alongside sizable
              public-sector awards such as a $99 million multi-year leadership development contract with the United
              States Air Force. However, realized average contract values, enterprise sales cycle durations, customer
              acquisition costs, and contract renewal economics remain undisclosed private data points that require
              confidential verification.
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.3'
        title: Cost Structure and Delivery Labor Economics
        blocks:
          - type: paragraph
            body: >-
              A central determinant of BetterUp's unit economics is its hybrid delivery architecture, which combines
              human coaching with artificial intelligence automation. Human coaching sessions are delivered through a
              global network of over 4,000 coaches operating in more than 70 countries and 75 languages. Crucially,
              these coaches are retained as independent contractor professionals rather than permanent salaried
              employees, with admission governed by a selective screening process that historically accepted
              approximately 8% of coach applicants. The contractor model provides operating flexibility by converting
              fixed coaching payroll into variable service-delivery expenses. In January 2025, BetterUp expanded its
              platform with standalone AI coaching applications designed to deliver always-on, role-specific coaching at
              near-zero marginal software cost. While AI delivery has the potential to expand gross margins, the blended
              cost of human coach payouts per session and platform compute expenses is not publicly disclosed.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Forward Runway, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              BetterUp's historical balance sheet capitalization was anchored by aggressive late-stage funding, notably
              raising $125 million in Series D capital at a $1.7 billion valuation in February 2021, followed by a $300
              million Series E round in October 2021 that valued the business at nearly $4.7 billion, bringing
              cumulative funding to $570 million. While historical funding chronology is documented in corporate
              background records, forward underwriting requires assessing whether BetterUp's operating cash flow
              currently sustains self-funded operations or remains dependent on external financing. Public disclosures
              confirm substantial enterprise scale and marquee client relationships, but provide zero visibility into
              GAAP gross margins, net revenue retention rates, operating cash burn, or available cash reserves. In the
              absence of audited financial statements, institutional underwriters cannot verify whether the business
              achieves software-grade gross margins or operates with services-heavy cost structures, making private
              financial disclosure a non-negotiable prerequisite for investment.
            claimRefs:
              - CI011
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Financial Opacity and Margin Uncertainty
            body: >-
              BetterUp's total withholding of gross margin, net revenue retention, and realized pricing creates a severe
              diligence blind spot. Because coaching sessions rely heavily on a network of 4,000+ contractor coaches who
              are paid per session rather than salaried, gross margin could range from low tech-enabled services levels
              (40-50%) to software-like levels (70%+) depending on AI substitution and session utilization.
            calloutType: risk
            claimRefs:
              - CI006
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Packaging and Commercial Modules (Lead, Manage, Grow, Ready)
        blocks:
          - type: paragraph
            body: >-
              BetterUp structures its commercial offerings around four core product lines designed to span
              organizational seniority: BetterUp Lead for executive leadership, BetterUp Manage for people managers,
              BetterUp Grow for workforce-wide AI coaching, and BetterUp Ready for organizational transformation and
              change resilience. Rather than selling a single undifferentiated coaching bundle, each product packages
              specialized assessments, coaching modalities, and analytics. BetterUp Lead and BetterUp Manage center on
              live 1:1 human coaching sessions delivered by a curated network of certified coaches, reinforced by
              digital micro-learning recommendations between conversations. BetterUp Grow provides 24/7 conversational
              AI coaching accessible inside daily collaboration tools. BetterUp Ready targets transitional cohorts
              navigating corporate restructuring or strategic pivots. Commercial agreements are sales-quoted enterprise
              contracts, following the discontinuation of flexible session credit packages in February 2026.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE013
      - number: '5.2'
        title: Technical Architecture, AI Orchestration, and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >-
              The BetterUp platform operates as a multi-tenant SaaS architecture connecting end-user communication
              channels, AI orchestration services, and human coaching logistics. For conversational AI coaching,
              BetterUp Grow deploys conversational agents directly into enterprise environments such as Slack and
              Microsoft Teams, supporting voice and text interactions in over 200 languages. In addition to standard
              workplace messaging bots, BetterUp operates an official Model Context Protocol (MCP) server at
              mcp.betterup.co, enabling Claude users to invoke AI coaching tools and manage live coaching bookings via
              OAuth 2.1 authentication without storing server-side state. The underlying AI stack leverages OpenAI
              foundation model APIs for dialogue generation and session transcript processing, integrated alongside
              proprietary behavioral algorithms and historical interaction datasets claiming over five million sessions
              since 2013.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
