      - number: '4.3'
        title: 成本结构与交付劳动经济学
        blocks:
          - type: paragraph
            body: >-
              BetterUp 单位经济模型的核心决定因素之一，是把人工教练与人工智能自动化结合起来的混合交付架构。人工教练会话由全球超过 4,000 名教练提供，覆盖 70 多个国家和 75
              种语言。关键在于，这些教练是独立合同制专业人士，而非领取固定工资的永久员工；公司采用严格筛选流程，历史上约 8% 的教练申请者能被录取。合同制模式把固定教练薪酬转为可变交付费用，从而提供运营灵活性。2025 年
              1 月，BetterUp 以独立 AI 教练应用扩展平台，力求以接近零边际软件成本提供全天候、按角色定制的教练服务。AI 交付有望提升毛利率，但人工教练每次会话的混合支付成本和平台计算费用尚未公开。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI014
      - number: '4.4'
        title: 资本充足性、未来现金跑道与投资判断
        blocks:
          - type: paragraph
            body: >-
              BetterUp 历史上的资产负债表资本化由激进的后期融资支撑，尤其是 2021 年 2 月以 $1.7 billion 估值完成 $125 million 的 D 轮融资，随后在 2021 年 10 月完成
              $300 million 的 E 轮融资，估值接近 $4.7 billion，累计融资达到 $570 million。尽管企业背景资料记录了历史融资时间线，前瞻性投资判断仍需评估 BetterUp
              当前经营现金流能否支撑自营，还是仍依赖外部融资。公开披露确认了相当大的企业规模和知名客户关系，但对 GAAP
              毛利率、净收入留存率、运营现金消耗或可用现金储备完全没有可见性。在缺乏经审计财务报表的情况下，机构投资者无法核实公司能否实现软件级毛利率，或是否采用服务密集型成本结构，因此私营财务披露是投资决策不可妥协的前提。
            claimRefs:
              - CI011
              - CI012
              - CI014
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 严重的财务不透明与利润率不确定性
            body: >-
              BetterUp 完全不披露毛利率、净收入留存率和实际定价，造成严重的尽调盲区。由于教练会话高度依赖 4,000+
              名按次付费而非领取薪资的合同制教练，毛利率可能从低技术赋能服务的水平（40-50%）到软件般的水平（70%+）不等，取决于 AI 替代程度和会话利用率。
            calloutType: risk
            claimRefs:
              - CI006
              - CI014
  - number: 5
