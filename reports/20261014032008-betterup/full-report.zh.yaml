figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: BetterUp 从 2013 年成立，到完成主要融资轮次、推出平台并接入 AI 的发展历程。
    data:
      items:
        - label: 2013：公司成立
          date: '2013'
          detail: Alexi Robichaux 和 Eduardo Medina 创立 BetterUp，打造移动优先的数字教练平台。
        - label: 2016：平台上线与 Series A
          date: '2016'
          detail: BetterUp 在种子轮和 Series A 中合计融资 $12.9M，并正式推出企业移动教练应用。
        - label: 2018：BetterUp Labs 成立
          date: '2018'
          detail: 推出 BetterUp Labs，开展组织心理学、行为神经科学和人类表现研究。
        - label: 2019：Series C 增长轮
          date: '2019'
          detail: 完成 $103M Series C 融资，加速获取企业客户并拓展国际业务。
        - label: 2021：Series D 独角兽估值
          date: 2021-02
          detail: 在职场动荡和远程办公转型期间，以 $1.7B 估值完成 $125M Series D。
        - label: 2021：Series E 与全球扩张
          date: 2021-10
          detail: 以 $4.7B 估值完成 $300M Series E，并收购 Motive 和 Impraise，拓展情绪与绩效分析能力。
        - label: 2023：定向收购与国防合同
          date: '2023'
          detail: 收购睡眠教练公司 Crescent，并获得美国空军 $99M 教练服务合同。
        - label: 2025：专用 AI 教练产品
          date: '2025'
          detail: 收购 Heyday 和 Practica 后推出纯 AI 教练应用，提供可扩展的员工教练服务。
    approximationNotes: 里程碑整理自已核实的公司公告、新闻稿和可信的行业报道。
