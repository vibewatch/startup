      - number: '8.2'
        title: 资本化历史与二级市场现实
        blocks:
          - type: paragraph
            body: >-
              BetterUp 于 2021 年末完成标志性的 $300M E 轮融资，隐含投后估值接近 $4.7B；包括 Lightspeed、Iconiq 和 Wellington
              在内的机构支持者，使公司累计一级股权及增长融资超过 $628M。然而，私募市场二级交易反映出相较 2021 年峰值市场环境的严重倍数压缩。到 2026 年 8 月，二级股份交易对应的隐含估值标记为
              $553.9M，每股 $0.68；活跃卖方报价为 $1.3B，混合报价达到 $2.0B。一级融资标记与实际二级交易之间的巨大脱节，说明存在显著的优先权悬置，也要求严格控制入场纪律。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景分析、退出路径与投资判断
        blocks:
          - type: paragraph
            body: >-
              评估 BetterUp 的未来情景，需要在其 AI 产品演进与市场逆风之间取得平衡。乐观情景下，BetterUp Manage 和 Grow 等自动化 AI
              教练平台提升毛利率，并推动企业范围内的席位渗透，使退出估值有望恢复至 $2.5B–$3.2B。基准情景下，企业学习与发展（L&D）预算持续受到审视，竞争压力不减，增长保持稳定但倍数扩张有限， 估值落在
              $1.2B–$1.8B 区间。悲观情景下，独立 AI 教练替代方案将教练互动商品化，二级市场估值压缩持续， 企业价值被锚定在 $700M
              以下。因此，在经核实的审计披露到位前，我们维持「继续研究」建议，认为估值偏高， 风险评级为高。
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
