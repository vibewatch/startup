        - label: 1. 高管采购与范围界定
          touchpoints:
            - C-suite 赞助人围绕组织绩效重点达成一致
            - Salesforce CPQ 定制交易结构和地域要求
            - 通过 Workday、Okta 或 SCIM 配置企业 SSO 和目录
        - label: 2. 基线评估与教练匹配
          touchpoints:
            - Whole Person Model 先评估心理状态基线
            - 专有 Identify AI 将用户匹配给认证人工教练
            - 制定个性化职业发展和领导力目标
        - label: 3. 一对一实时视频人工教练
          touchpoints:
            - 每两周与持证教练进行保密视频教练会谈
            - 提供沟通、心理健康和营养方面的专项教练服务
            - 在移动端和桌面端仪表盘跟踪个性化进展
        - label: 4. 会谈间 AI 教练（BetterUp Grow）
          touchpoints:
            - 通过 Slack 和 Microsoft Teams 全天候访问对话式 AI 教练
            - 100+ 个针对困难对话的沉浸式模拟练习模块
            - 自动准备会谈，并与人工教练共享上下文
        - label: 5. 组织绩效分析
          touchpoints:
            - 企业仪表盘跟踪技能整体变化和参与度
            - 在不暴露私密会谈内容的情况下进行队列级进展分析
            - 由专属客户成功经理主持季度业务回顾
        - label: 6. 合同续签与落地扩张
          touchpoints:
            - 评估管理者效能、团队绩效和人员流失
            - 席位许可从高管队列扩展至管理者和员工层级
            - 续签年度订阅合同并扩大多年期承诺
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按六大风险领域评估企业风险发生可能性、影响严重程度和缓释成熟度的矩阵。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 监管与隐私合规
          values:
            - label: 常规 GDPR 审计
            - label: 新出现的 AI 披露强制要求
            - label: 跨境数据传输审查
        - label: 承包商教练用工模式
          values:
            - label: 个别承包商申诉
            - label: 州级工人分类审计
            - label: 教练协调费率争议
        - label: AI 可靠性与模型安全
          values:
            - label: 轻微的建议提示词漂移
            - label: 工作流中 Workslop 泛滥
            - label: 高风险教练幻觉
        - label: 企业平台依赖
          values:
            - label: 云服务商短暂停机
            - label: HRIS 连接器架构弃用
            - label: 协作消息客户端遭 IT 拦截
        - label: 客户流失与定价摩擦
          values:
            - label: 中端市场客户流失
            - label: 企业续约缩减
            - label: 转向低成本竞争者
        - label: 估值与资本结构
          values:
            - label: 二级股份流动性冻结
            - label: 历史独角兽估值下调重估
            - label: 下轮融资稀释
    notes: 风险严重程度映射根据市场数据、竞争替代方案和运营披露校准。
    claimRefs:
      - CR004
      - CR005
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 连接企业市场规模、平台执行、二级市场定价错位和最终继续研究投资判断的逻辑链。
    data:
      nodes:
        - id: node-enterprise-scale
          label: 企业规模
          detail: 已确立的行业领导者，累计融资 $628M，企业客户包括 Hilton、Salesforce 和美国空军。
        - id: node-ai-transition
          label: 产品转型
          detail: 从高接触度人工教练服务扩展至 BetterUp Manage、Grow 等 AI 驱动产品，覆盖更广泛的员工群体。
        - id: node-market-crowding
          label: 竞争拥挤
          detail: 教练市场竞争拥挤，替代方案包括 Torch、CoachHub、Growthspace 和自动化 LLM 工具。
        - id: node-secondary-discount
          label: 估值错位
          detail: 二级市场交易对应 $553.9M 估值，较 $4.7B 的 Series E 高峰估值折价 88%。
        - id: node-verdict
          label: 继续研究立场
          detail: 在直接审计利润率和留存情况前，维持继续研究的建议，并认为估值偏高。
        - id: node-diligence-gate
          label: 确认性尽调
          detail: 投资判断以核实经审计的毛利率、单位交付成本和队列净留存为条件。
      edges:
        - from: node-enterprise-scale
          to: node-ai-transition
        - from: node-ai-transition
          to: node-market-crowding
        - from: node-market-crowding
          to: node-secondary-discount
        - from: node-secondary-discount
          to: node-verdict
        - from: node-verdict
          to: node-diligence-gate
    approximationNotes: 流程顺序对应根据一级融资记录、分析师评估和二级市场数据综合得出的决策标准。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
