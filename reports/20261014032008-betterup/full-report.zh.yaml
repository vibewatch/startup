              教练，BetterUp Ready 面向组织转型和变革韧性。公司没有销售一个不加区分的教练套餐，而是让每个产品分别组合专业评估、教练模式和分析能力。BetterUp Lead 和 BetterUp Manage
              以精选认证教练提供的实时一对一人工教练会话为核心，并在对话之间提供数字微学习建议。BetterUp Grow 在日常协作工具内提供全天候对话式 AI 教练。BetterUp Ready
              面向正在经历企业重组或战略转向的过渡期人群。商业协议是按销售报价的企业合同；2026 年 2 月起，灵活的会话额度套餐已停止销售。
