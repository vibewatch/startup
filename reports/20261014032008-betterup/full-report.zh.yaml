      - number: '6.4'
        title: 留存韧性、成本壁垒与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管获得了知名客户，BetterUp 仍面临合同韧性、经济可及性和客户集中度方面的关键结构性障碍。独立行业评价估计，BetterUp 的一对一人工教练每位用户每年收费 $3,000 至
              $5,000。由于公司不公布标准化企业定价，采购团队必须面对定制谈判合同，以及不透明的最低承诺门槛和续约条件。这种溢价定价让高级总监以下员工难以经济地全面部署席位；当企业培训支出收缩时，平台也更容易受到预算削减影响。此外，依赖人工教练匹配会带来纯软件竞争者可以避开的履约摩擦和产能约束。就留存韧性看，BetterUp
              尚未公开披露经审计的净收入留存率（NRR）、毛收入留存率（GRR）或群组流失指标，因此企业账户究竟会随时间扩大支出还是减少席位，仍存在重大尽调盲区。最后，$99 million
              的空军合同等大型公共部门项目，引入了主权客户集中度和政治性采购续约风险。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU013
              - CU014
