        blocks:
          - type: paragraph
            body: >-
              BetterUp 按四个不同客户群和组织买家画像组织商业方案。高管层，BetterUp Lead 通过专门的人工高管教练和战略行为评估，面向企业 C-suite 领导者和高级总监。中层管理者和运营团队领导则使用
              BetterUp Manage，获得聚焦管理者效率、团队协同和执行的结构化教练。更广泛的劳动力层由 BetterUp Grow 覆盖，这是一款 AI
              优先的对话式教练应用，旨在不承担全职人工教练的高昂费用，也能规模化提供职业发展。最后，BetterUp Ready
              面向正在经历企业重组、并购或业务中断的组织，提供韧性教练。企业买家通常包括首席人力资源官、首席学习官和企业人才发展副总裁。虽然多层架构让 BetterUp
