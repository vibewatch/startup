      - number: '4.2'
        title: 市场拓展动作与客户价值实现
        blocks:
          - type: paragraph
            body: >-
              BetterUp 的市场拓展依靠直销企业客户，目标对象包括首席人力资源官、首席学习官和企业福利买家。商业信息聚焦可量化的劳动力投资回报，并声称员工教练能带来顶级绩效评级提升 41%、项目投资回报平均 14
              倍以及自愿离职率下降 50%。BetterUp 还声称，对销售领导和商业团队而言，配额达成率和客户满意度平均提升 14%。客户采用规模已超过 750 家全球企业，包括 Google、Salesforce 和
              Hilton 等知名客户，以及美国空军 $99 million 的多年期领导力发展合同等大型公共部门订单。然而，实际平均合同价值、企业销售周期、获客成本和合同续约经济性仍未披露，属于需要保密核实的私有数据点。
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI011
