            body: >-
              BetterUp 的商业轨迹体现出企业账户稳步增长和平台使用深度提升。公司从 Logitech、Capital One 和 Deloitte 等企业伙伴的早期 beta 测试起步，到 2023
              年将企业覆盖扩展至超过 600 家客户，并于 2026 年 8 月突破 750 家企业客户。这一客户基础由国际化网络支撑，网络拥有超过 4,000 名具备资质的教练，在 70 个国家提供 64 种语言的会话。自
