evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance-disclosure
    missingEvidence: Current 2025-2026 GAAP revenue, ARR, gross margin, and cash burn metrics are not publicly disclosed.
    whyItMatters: >-
      Without audited financial statements or primary ARR disclosure since 2021, assessing operating efficiency and
      valuation support is constrained.
    diligencePath: >-
      Request confidential management financial package, income statement, and updated ARR bridge during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-register-completeness
    missingEvidence: Complete cap table and exact equity ownership percentages by founder and institution.
    whyItMatters: Exact voting control and secondary liquidity terms remain private.
    diligencePath: Review certified capitalization table and voting agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: contract-pricing-and-gross-margins
    missingEvidence: >-
      Audited cohort-level contract sizes, pricing tier break-downs, and net revenue retention across enterprise
      accounts.
    whyItMatters: >-
      Public data relies on third-party broker estimates (Vendr median contract ~$145k); true unit economics and renewal
      durability cannot be verified without internal cohort disclosures.
    diligencePath: Request anonymized enterprise customer contract distributions and cohort-based NRR / GRR schedules under NDA.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: market-sizing-and-competitive-headcount
    missingEvidence: >-
      Standardized headcount and independent digital coaching market share figures reconciling conflicting database
      numbers.
    whyItMatters: >-
      Tracxn reports employee estimates that conflict with observed platform scale and earlier filings, making market
      share and productivity calculations uncertain.
    diligencePath: >-
      Reconcile corporate filings against internal payroll summaries and audit certified coach platform engagement
      hours.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-win-loss-rates
    missingEvidence: >-
      Audited head-to-head enterprise procurement win-loss data and competitive displacement rates between BetterUp and
      CoachHub in 2026.
    whyItMatters: >-
      Direct win rates would confirm whether BetterUp maintains its price premium against global peers or is losing RFPs
      to lower-priced alternatives.
    diligencePath: >-
      Request customer references from enterprise HR procurement teams and review third-party contract negotiation
      benchmarks.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cash-burn
    missingEvidence: >-
      Audited income statements, gross margin breakdown between coach contractor fees and software, and current
      operating cash burn rate.
    whyItMatters: >-
      Without gross margin and burn disclosure, investors cannot determine whether BetterUp operates as a high-margin
      software platform or a capital-intensive tech-enabled service business.
    diligencePath: >-
      Request private financial statements, management accounts, and trailing-twelve-month GAAP reconciliation under
      NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-unit-economics
    missingEvidence: Net revenue retention (NRR), gross logo churn, and customer cohort expansion data.
    whyItMatters: >-
      Enterprise valuation multiples depend heavily on whether existing accounts expand contract value over time to
      offset high enterprise acquisition costs.
    diligencePath: Request net retention cohort schedules by annual customer vintage and enterprise employee band.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: ai-model-governance
    missingEvidence: >-
      Granular technical documentation detailing whether customer coaching transcripts processed by OpenAI APIs are
      segregated into dedicated enterprise model instances or retained for cross-tenant fine-tuning.
    whyItMatters: >-
      Enterprise security and compliance teams require verifiable audit trails regarding AI data provenance, model
      isolation boundaries, and third-party LLM retention policies.
    diligencePath: >-
      Request BetterUp's Data Processing Addendum (DPA), SOC 2 Type II Section III system description, and OpenAI
      enterprise contract terms under non-disclosure agreement.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: coach-quality-variance
    missingEvidence: >-
      Audited coach retention rates, session satisfaction standard deviations, and coach performance evaluation
      benchmarks across geographies.
    whyItMatters: >-
