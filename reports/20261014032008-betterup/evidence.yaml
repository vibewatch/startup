      self-reported marketing aggregates.
    diligencePath: >-
      Request cohort-level coach NPS, coach turnover statistics, and quality calibration scorecards during technical
      vendor diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
