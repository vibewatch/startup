callouts:
  - calloutType: "insight"
    title: "The Shift from Remedial Intervention to Preventative Workforce Scaling"
    body: "Historically, corporate coaching operated as a reactive, remedial intervention for struggling executives due to prohibitive per-hour psychologist rates. BetterUp's platform architecture repositions coaching as a proactive workforce development vitamin delivered across all organizational tiers, expanding addressable budget pools from isolated executive line items into recurring enterprise software allocations."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM012"
  - calloutType: "risk"
    title: "Enterprise Contract Concentration and Procurement Hurdle Rates"
    body: "Third-party transaction intelligence reveals a median enterprise contract value of approximately $145,650 with two- to three-month deployment cycles. While these metrics substantiate substantial enterprise willingness to pay, they also expose BetterUp to protracted procurement scrutiny and budget vulnerability during corporate cost-containment cycles."
    claimRefs:
      - "CM006"
      - "CM007"
