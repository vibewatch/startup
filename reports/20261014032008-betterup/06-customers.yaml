  name: BetterUp
chapter:
  number: 6
  title: Customers
  summary: BetterUp has established a defensible enterprise customer footprint with over 750 accounts and Fortune 1000 references
    including Google, Hilton, and the U.S. Air Force, but steep per-seat pricing and reliance on human coaches restrict organization-wide
    penetration and elevate renewal friction.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation & Target Buyers
  body: BetterUp structures its commercial offerings across four distinct customer segments and organizational buyer personas.
    At the executive tier, BetterUp Lead targets enterprise C-suite leaders and senior directors through dedicated human executive
    coaching paired with strategic behavioral assessments. For middle management and operational team leaders, BetterUp Manage
    delivers structured coaching focused on manager effectiveness, team alignment, and execution. The broader workforce tier
    is addressed through BetterUp Grow, an AI-first conversational coaching application designed to provide scalable professional
    development without the prohibitive expense of full-time human coaching. Finally, BetterUp Ready targets organizations
    navigating corporate restructuring, mergers, or disruptions by providing resilience coaching. Enterprise buyers typically
    include Chief Human Resources Officers, Chief Learning Officers, and corporate Vice Presidents of Talent Development.
    While this multi-tiered architecture allows BetterUp to pitch enterprise-wide coverage, third-party market evaluations
    reveal that commercial contract adoption remains heavily weighted toward senior executive cohorts due to premium price
    points, leaving workforce-wide frontline deployments predominantly aspirational.
  claimRefs:
  - CU001
  - CU002
  - CU008
  - CU009
  - CU010
  tableRefs:
  - TU001
- id: enterprise-adoption-and-scale
  title: Adoption Trajectory & Scaled Deployments
  body: BetterUp's commercial trajectory demonstrates steady enterprise account growth alongside substantial platform usage
    depth. From early beta testing with corporate partners such as Logitech, Capital One, and Deloitte, the company expanded
    its enterprise footprint to more than 600 client organizations by 2023 and surpassed 750 enterprise customers by August
    2026. This customer base is supported by an international network of over 4,000 credentialed coaches delivering sessions
    in 64 languages across 70 countries. Cumulative coaching volume exceeds 5 million completed sessions since 2013, creating
    a proprietary behavioral dataset that trains the company's Whole Person Model and algorithmic coach matching systems.
    Enterprise sales execution relies on Salesforce Sales Cloud and CPQ to configure complex multi-national contracts, manage
    coach recruiting pipelines when launching new geographic cohorts, and track account health metrics. Typical enterprise
    expansion follows a land-and-expand cadence, where an employer initially funds coaching for a discrete cohort of high-potential
    managers before expanding seat licenses across adjacent business divisions based on documented engagement and productivity
    metrics.
  claimRefs:
  - CU001
  - CU003
  - CU011
  - CU012
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-customer-evidence
  title: Named Enterprise Proof & Measured Outcomes
  body: BetterUp's commercial credibility is anchored by verified production deployments across leading multinational corporations
    and public sector institutions. In the technology vertical, Google deployed BetterUp across multiple international business
    units, with its Chief Learning Officer reporting that participating managers demonstrated greater operational effectiveness
    across diverse geographies and teams. In consumer and hospitality, Hilton and Salesforce utilize BetterUp for employee
    leadership and wellbeing programs. In professional sports, the Mercedes-AMG PETRONAS Formula One team publicly cited a
    21% productivity gain among team members following platform integration. In healthcare, John Muir Health utilizes the
    platform as an institutional anchor for developing resilient leadership among healthcare administrators. In the public
    sector, BetterUp secured a landmark multi-year $99 million leadership coaching contract with the United States Air Force.
    Company-sponsored comparison studies claim substantial quantitative outcomes, including a 41% lift in employees rated
    top-tier, an 86% increase in top-performing managers, and a 50% reduction in voluntary turnover among active participants,
    though these findings reflect self-reported internal study methodology rather than independent clinical audits.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU003
- id: retention-durability-and-expansion
  title: Retention Durability, Cost Barriers & Concentration Risk
  body: Despite high-profile logo acquisition, BetterUp faces critical structural hurdles regarding contract durability, economic
    accessibility, and customer concentration. Independent industry reviews estimate that BetterUp's 1:1 human coaching costs
    between $3,000 and $5,000 per user annually. Because BetterUp does not publish standardized enterprise pricing, procurement
    teams must navigate custom negotiated contracts with opaque minimum commitment thresholds and renewal conditions. This
    premium pricing structure makes enterprise-wide seat deployment economically impractical for workers below senior director
    levels, leaving the platform vulnerable to budget cuts when corporate training spending contracts. Furthermore, reliance
    on human coach matching creates fulfillment friction and capacity constraints that pure software competitors avoid. On
    retention durability, BetterUp has not publicly disclosed audited net revenue retention (NRR), gross revenue retention
    (GRR), or cohort churn metrics, creating a material diligence blind spot regarding whether enterprise accounts expand
    their spend over time or experience seat reductions. Finally, major public sector engagements like the $99 million Air
    Force award introduce sovereign customer concentration and political procurement renewal risk.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU013
  - CU014
