  data:
    items:
    - label: 1. Executive Procurement & Scoping
      touchpoints:
      - C-suite sponsor alignment on organizational performance priorities
      - Salesforce CPQ custom deal structuring and geographic requirements
      - Enterprise SSO and directory provisioning via Workday, Okta, or SCIM
    - label: 2. Baseline Assessment & Coach Matching
      touchpoints:
      - Whole Person Model baseline assessment of psychological mindsets
      - Proprietary Identify AI matching users to certified human coaches
      - Establishing personalized professional development and leadership goals
    - label: 3. 1:1 Live Video Human Coaching
      touchpoints:
      - Bi-weekly confidential video coaching sessions with credentialed coaches
      - Specialist coaching in communication, mental fitness, and nutrition
      - Personalized progress tracking on mobile and desktop dashboards
    - label: 4. Between-Session AI Coaching (BetterUp Grow)
      touchpoints:
      - 24/7 conversational AI coaching accessible via Slack and Microsoft Teams
      - Over 100 immersive simulated practice modules for difficult conversations
      - Automated session preparation and context sharing with human coaches
    - label: 5. Organizational Performance Analytics
      touchpoints:
      - Enterprise dashboard tracking aggregate skill shifts and engagement
      - Cohort-level progress analytics without exposing private session content
      - Quarterly business reviews with dedicated Customer Success Managers
    - label: 6. Contract Renewal & Land-and-Expand
      touchpoints:
      - Evaluation of manager effectiveness, team performance, and attrition
      - Seat license expansion from executive cohorts to manager and workforce tiers
      - Annual subscription contract renewal and expanded multi-year commitment
