- id: FU001
  title: Customer journey map
  type: journey-map
  summary: End-to-end enterprise customer lifecycle from executive procurement and coach matching to between-session AI engagement
    and contract renewal.
  approximationNotes: Journey stages and touchpoints synthesize disclosed platform capabilities, integration workflows, and
    enterprise customer expansion paths.
