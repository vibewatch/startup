schemaVersion: report-v2
artifact: financials
slug: betterup
runDate: '2026-10-14'
company:
  name: BetterUp
chapter:
  number: 4
  title: Financials
  summary: >-
    BetterUp operates an enterprise subscription model spanning digital mental health, human executive coaching, and
    AI-driven skill development across 750+ corporate clients. While the business demonstrates commercial traction and
    enterprise contract scale, complete withholding of gross margins, retention metrics, and realized pricing creates
    substantial private underwriting blind spots.
sections:
  - id: sec-revenue-streams-pricing
    title: Revenue Streams and Monetization Architecture
    body: >-
      BetterUp monetizes primarily through enterprise business-to-business subscription contracts structured across
      three core product tiers: BetterUp Care, Coaching (Lead), and Enterprise. The Care tier addresses employee mental
      wellbeing, stress management, and organizational resilience as a corporate benefits product, typically licensed on
      a per-employee basis. The Coaching tier introduces one-on-one professional coaching, leadership development
      journeys, and tailored career growth paths for managers and high-potential employees. At the Enterprise level,
      organizations access comprehensive executive coaching, team coaching modules, real-time people analytics, and
      automated integrations with enterprise Human Capital Management systems including Workday, SAP SuccessFactors,
      Slack, and Microsoft Teams. Across all published tiers, list pricing is strictly withheld from public channels and
      quoted on request, reflecting custom pricing tailored to enterprise headcount, coaching modality mix, and service
      commitments.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: sec-gtm-sales-efficiency
    title: Go-To-Market Motion and Customer Value Realization
    body: >-
      BetterUp's go-to-market motion relies on direct enterprise sales targeting Chief Human Resources Officers, Chief
      Learning Officers, and corporate benefits buyers. Commercial messaging centers on quantifiable workforce return on
      investment, asserting that employee coaching yields a 41% increase in top-tier performance ratings, an average 14x
      return on program investment, and a 50% decrease in voluntary turnover. For sales leadership and commercial teams,
      BetterUp claims an average 14% improvement in quota attainment and customer satisfaction scores. Customer adoption
      has reached more than 750 global enterprises, including high-profile logos such as Google, Salesforce, and Hilton,
      alongside sizable public-sector awards such as a $99 million multi-year leadership development contract with the
      United States Air Force. However, realized average contract values, enterprise sales cycle durations, customer
      acquisition costs, and contract renewal economics remain undisclosed private data points that require confidential
      verification.
    claimRefs:
      - CI004
      - CI005
      - CI009
      - CI011
    tableRefs:
      - TI002
  - id: sec-cost-structure-unit-economics
    title: Cost Structure and Delivery Labor Economics
    body: >-
      A central determinant of BetterUp's unit economics is its hybrid delivery architecture, which combines human
      coaching with artificial intelligence automation. Human coaching sessions are delivered through a global network
      of over 4,000 coaches operating in more than 70 countries and 75 languages. Crucially, these coaches are retained
      as independent contractor professionals rather than permanent salaried employees, with admission governed by a
      selective screening process that historically accepted approximately 8% of coach applicants. The contractor model
      provides operating flexibility by converting fixed coaching payroll into variable service-delivery expenses. In
      January 2025, BetterUp expanded its platform with standalone AI coaching applications designed to deliver
      always-on, role-specific coaching at near-zero marginal software cost. While AI delivery has the potential to
      expand gross margins, the blended cost of human coach payouts per session and platform compute expenses is not
      publicly disclosed.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI010
    tableRefs:
      - TI003
  - id: sec-capital-adequacy-verdict
    title: Capital Adequacy, Forward Runway, and Underwriting Verdict
    body: >-
      BetterUp's historical balance sheet capitalization was anchored by aggressive late-stage funding, notably raising
      $125 million in Series D capital at a $1.7 billion valuation in February 2021, followed by a $300 million Series E
      round in October 2021 that valued the business at nearly $4.7 billion, bringing cumulative funding to $570
      million. While historical funding chronology is documented in corporate background records, forward underwriting
      requires assessing whether BetterUp's operating cash flow currently sustains self-funded operations or remains
      dependent on external financing. Public disclosures confirm substantial enterprise scale and marquee client
      relationships, but provide zero visibility into GAAP gross margins, net revenue retention rates, operating cash
      burn, or available cash reserves. In the absence of audited financial statements, institutional underwriters
      cannot verify whether the business achieves software-grade gross margins or operates with services-heavy cost
      structures, making private financial disclosure a non-negotiable prerequisite for investment.
    claimRefs:
      - CI011
      - CI012
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Monetization Mechanism
      - Unit Basis
      - Disclosed Status / Value
      - Revenue Quality Stance
      - Diligence Ask
    rows:
      - - Enterprise Human Coaching (Lead / Executive)
        - Annual subscription per seat
        - Per licensed employee or executive seat
        - Multi-tier corporate contract (pricing on request)
        - High recurring potential, but constrained by coach labor availability
        - Realized average contract value (ACV) and expansion rates
      - - Hybrid & AI Coaching (Grow / Manage)
        - Subscription per licensed worker
        - Per user per month or annual license
        - Commercialized across 750+ enterprise customer accounts
        - High software operating leverage with minimal incremental labor cost
        - Gross margin comparison between AI-only and hybrid tiers
      - - Mental Health & Wellbeing (Care)
        - Corporate benefits subscription
        - Per employee per month (PEPM)
        - Commercialized benefits tier (pricing on request)
        - Vulnerable to benefits budget rationalization if adoption lags
        - Active monthly utilization and PEPM contract retention rates
      - - Public Sector & Government Programs
        - Multi-year services and SaaS contract
        - Program milestone and agency ceiling basis
        - $99M contract awarded by United States Air Force
        - Substantial contract scale, but subject to procurement and budget renewal cycles
        - Contract gross margin, billing schedules, and option period terms
    notes: >-
      Revenue stream mechanics and unit bases reflect BetterUp enterprise and public-sector contract disclosures;
      pricing amounts are withheld by the company and quoted strictly on request.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Plan / Tier
      - List Price
      - Realized Pricing Status
      - Key Capabilities Included
      - Commercial Implication
    rows:
      - - Care
        - On request
        - Private / PEPM negotiated
        - Mental health coaching, stress management, resilience, self-service resources
        - Entry tier targeting corporate wellbeing budgets; high churn risk if utilization lags
      - - Coaching (Lead)
        - On request
        - Private / annual seat contracts
        - 1-on-1 coaching, leadership development, personalized growth plans, mobile access
        - Core enterprise offering; pricing opacity prevents independent benchmarking against competitors
      - - Enterprise (All-Tiers)
        - On request
        - Custom multi-year agreements
        - Executive coaching, team coaching, workforce analytics, HCM/HRIS integrations
        - Maximum ACV potential; requires dedicated high-touch sales and custom customer success support
    notes: >-
      List pricing across all tiers is withheld and available only on request as of 2026; commercial terms, volume
      discounts, and realized seat prices require private diligence disclosure.
    claimRefs:
      - CI001
      - CI002
      - CI003
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Disclosed Value
      - Confidence
      - Strategic Significance
      - Diligence Ask
    rows:
      - - Gross Margin (%)
        - null
        - null
        - Critical proxy for labor intensity (contractor coach fees vs platform software revenue)
        - Request COGS breakdown between third-party coach payments, cloud/AI compute, and customer operations
      - - Customer Acquisition Cost (CAC) & Payback
        - null
        - null
        - Measures sales efficiency across enterprise GTM and field sales teams
        - Provide fully loaded sales and marketing expense per new enterprise logo and expansion payback period
      - - Net Revenue Retention (NRR)
        - null
        - null
        - Determines whether seat expansion within existing 750+ accounts offsets customer logo churn
        - Request historical NRR and gross logo retention cohorts by enterprise customer size
      - - Coach Delivery Costs (Cost per Session)
        - null
        - null
        - Defines operating leverage as coaches are 1099/contractor professionals rather than salaried staff
        - Disclose average coach payout per 1-on-1 session and hourly utilization rates across the 4,000+ coach network
    notes: >-
      Key unit economics metrics are undisclosed private data; all null values represent material underwriting blind
      spots requiring access to confidential management accounts.
    claimRefs:
      - CI006
      - CI014
