        - label: Tier Licensing & Seat Scoping
          detail: Scoping employee coverage across Care, Coaching (Lead), and AI Grow tiers
        - label: Platform Contracting & Integration
          detail: Annual or multi-year subscription agreements with Workday, SAP, and Teams integration
        - label: Hybrid Coaching Delivery
          detail: Blending 4,000+ contractor human coaches with 24/7 on-demand AI coaching sessions
        - label: Outcome Measurement & ROI Tracking
          detail: People analytics tracking manager effectiveness, turnover reduction, and productivity
        - label: Contract Renewal & Seat Expansion
          detail: Converting proven behavioral outcomes into annual contract renewals and broader seat expansion
    approximationNotes: >-
      Flow architecture illustrates the enterprise monetization cycle based on public GTM disclosures; seat conversion
      rates and renewal percentages are private.
    claimRefs:
      - CI008
      - CI010
      - CI013
callouts:
  - calloutType: risk
    title: Severe Financial Opacity and Margin Uncertainty
    body: >-
      BetterUp's total withholding of gross margin, net revenue retention, and realized pricing creates a severe
      diligence blind spot. Because coaching sessions rely heavily on a network of 4,000+ contractor coaches who are
      paid per session rather than salaried, gross margin could range from low tech-enabled services levels (40-50%) to
      software-like levels (70%+) depending on AI substitution and session utilization.
    claimRefs:
      - CI006
      - CI014
