callouts:
  - calloutType: risk
    title: Contractor Labor Model Exposure
    body: BetterUp's reliance on a global network of over 4,000 independent contractor coaches creates ongoing legal classification and quality governance exposure. While contractor arrangements keep operating fixed costs lower, any adverse regulatory ruling on employee classification in key jurisdictions could materially disrupt gross margins and service continuity.
    claimRefs:
      - CR003
      - CR004
  - calloutType: insight
    title: Enterprise Pricing Resistance Amid Market Overcrowding
    body: With competitor reports indicating per-user pricing near $499 per month and an influx of scalable coaching alternatives like CoachHub and Meditopia, BetterUp faces procurement friction and renewal scrutiny during corporate belt-tightening cycles. Proving measurable return on investment through performance intelligence remains the central defense against cheaper digital-only substitutes.
    claimRefs:
      - CR005
      - CR006
