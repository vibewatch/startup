- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  enumerationScope:
    coverage: partial
    basis: Open-web sources reviewed through 20 June 2026, including filings, databases, and peer comparator disclosures; this is the minimum missing set for financial diligence.
  rows:
  - - Revenue mix by hardware vs recurring services
    - Cannot judge durability or margin profile of the top line
    - Request audited segment revenue bridge and monthly mix since Dec 2024
  - - Realized pricing and discounting
    - List prices may overstate actual monetization and gross margin
    - Request top-20 contracts with list price, discount, term, and support obligations
  - - Customer concentration and backlog
    - Cannot gauge order visibility or exposure to a few counterparties
    - Request signed backlog by stage and top-customer revenue schedule
  - - Current cash and monthly burn
    - Runway is not calculable despite large financing claims
    - Request treasury dashboard and 12-month cash bridge
  - - Investor roster and rights package
    - Cannot model liquidation waterfall, governance, or dilution risk
    - Request subscription agreements, shareholder agreement, and cap table by class
  - - Gross margin by product line
    - Negative aggregate gross profit could hide divergent economics by stream
    - Request hardware, service, and data gross-margin bridge
  - - CAC / payback / channel economics
    - No way to test sales efficiency or distributor economics
    - Request pipeline conversion, CAC, and payback by sales motion
  - - AR aging and inventory turns
    - Receivables and stock levels may imply stressed working capital or milestone billing
    - Request aging buckets, bad-debt history, and inventory aging schedule
  notes: These gaps are the key blockers preventing open-web evidence from becoming a full financial underwriting package.
