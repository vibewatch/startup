  name: Roark Aerospace
chapter:
  number: 4
  title: Financials
  summary: Roark Aerospace's filings prove the business generated real 2024 revenue and raised meaningful capital, but they do not yet support conventional underwriting metrics such as backlog, burn, CAC, payback, or current runway. The strongest public evidence is a 2024 accounts filing with £36.9 million of turnover, negative gross profit, significant receivables and inventory, and later share-allotment filings that corroborate substantial late-2025 financing activity without fully validating the claimed $1.6 billion valuation or investor roster.
sections:
- id: revenue-model-pricing-and-public-traction
  title: Revenue Model, Pricing, and Public Traction
  body: 'The public record supports a hybrid monetization model, but not a clean revenue mix. Roark''s own archived homepage used the label "Drone Detection as a Service | C-UAS as a Service," while trade coverage described both hardware sales and recurring service offers. sUAS News published list pricing for Aero-Ark CRI from £2,150 ex VAT, Aero-Ark WiRED from £3,200 ex VAT, a combined unit from £4,450 ex VAT, Detection as a Service from £95 ex VAT per user per month, and Rapid Deploy from £185 per day. DroneXL separately reported OTC systems starting at £4,500 excluding taxes and tied them to Plexus platform access, while DroneLife said Roark also offered installed coverage as a service. That is enough to conclude Roark was selling a blended hardware-plus-service package into the market by early 2025, but not enough to infer realized ASPs, discounting behavior, subscription penetration, renewal profile, or contract duration. The only official revenue disclosure remains the 2024 accounts,
    which report £36.9 million of turnover and explicitly define turnover as total group sales across both UK and US entities. That accounting policy matters: it indicates real sales activity, but it also means the filing does not let an outside investor separate UK legal-entity revenue from broader group activity or distinguish hardware, subscription, deployment, and data-service contributions.'
