  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Signed backlog, top-customer concentration, contract duration, and renewal data.
    whyItMatters: These are necessary to judge revenue durability and sales-efficiency proxies.
    diligencePath: Request a booked backlog schedule by customer, contract term, and deployment status plus renewal cohorts for any recurring service base.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: late-2025-investor-roster
    missingEvidence: Investor names, subscription agreements, shareholder agreement, and liquidation waterfall terms for the late-2025 financing.
    whyItMatters: Without them, investors cannot underwrite governance, dilution, or downside protection.
    diligencePath: Request the full post-round cap table by class, executed subscription documents, and any side letters or board-rights agreements.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: Current cash balance, monthly burn, debt-service schedule, and runway scenarios after the late-2025 financing.
    whyItMatters: Capital adequacy is the central unanswered underwriting question in this chapter.
    diligencePath: Request treasury dashboard, monthly cash bridge, covenant schedule, and 12- to 18-month base/downside budget.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by stream, CAC, payback, churn, utilization, and service-delivery cost detail.
    whyItMatters: The filed accounts prove revenue but do not support any confident view on margin path or sales efficiency.
    diligencePath: Request monthly KPI pack with gross margin by product, CAC/payback, churn, deployment utilization, and customer-support burden.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A clean reconciliation from filed share-allotment cash amounts to the externally reported $210 million round and $260 million to $287 million funding totals.
    whyItMatters: Valuation and dilution analysis depend on understanding whether public database totals refer to the same round perimeter.
    diligencePath: Request investor presentation, round-close memo, FX assumptions, and a financing chronology tied to each filed allotment.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI004
