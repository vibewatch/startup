- id: cost-structure-working-capital-and-unit-economics
  title: Cost Structure, Working Capital, and Unit Economics
  body: 'The 2024 filing is unusually valuable because it reveals that Roark''s reported top line was not yet translating into public-quality unit economics. The company reported £36.9 million of turnover, £49.3 million of cost of sales, and therefore negative gross profit of £12.4 million, followed by £3.1 million of administrative expense and £1.07 million of interest cost. On the balance sheet, cash was only £6.1 million at year-end, while stocks were £13.6 million and debtors reached £87.1 million, including £36.1 million due after more than one year. Those figures imply a business with material fulfillment, deployment, and collection burdens rather than a clean software-only model. They also mean that publicly visible working-capital consumption exceeded liquid cash by a wide margin. A conventional SaaS-style CAC/payback discussion is therefore impossible from open sources and would likely be misleading anyway: Roark appears to combine hardware, field deployment, and ongoing monitoring
    services. The best evidence-backed judgment is narrower. Roark had real commercial activity, but the only disclosed year shows negative gross margin, meaningful receivable build, inventory exposure, and a financing need that likely extended beyond ordinary operating cash generation. Any investor memo that assumes attractive software-like margins would be projecting far beyond the evidence.'
