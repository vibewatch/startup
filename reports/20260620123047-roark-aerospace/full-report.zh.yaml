      - number: '7.2'
        title: 权限、出口管制和资质门槛压缩了可用市场
        blocks:
          - type: paragraph
            body: >-
              官方政策材料显示，counter-UAS 买方环境只对满足权限、安全和资质规则的供应商变得更容易。FAA 公共安全指引仍把处置非法无人机界定为依赖权限的活动。JIATF-401 称，指挥官在 10 U.S.C.
              Code § 130i 下拥有更多灵活性，但这份灵活性同时要求训练合格的操作员、指定设施、跨机构数据共享，以及经过测试和验证的装备。DHS 和 CISA
              又加了一道筛选：机构采购前应比较任务特定需求、场地条件和分层安全整合。OMB 和 BIS 再次抬高门槛，把无人系统采购同安全供应和本土能力逻辑绑定；FAA ARC
              则建议先有性能标准、获批测试和供应商名单，再做大规模部署。这些规则都不是专门针对 Roark，但它们定义了 Roark 必须穿过的闸门。Roark
              没有公开说明出口管制姿态、安全数据控制或资质状态，因此政策扩张并不会自动转化为公司的开放市场准入。
