      - number: '2.2'
        title: 规模口径与需求背景
        blocks:
          - type: paragraph
            body: >-
              需求背景很强，但每个公开规模口径用的分母都不同。DefenseScoop 报道称，Pentagon FY26 预算请求包含 $13.4 billion 的自主与自主系统支出，其中 $3.1 billion
              专门用于跨军种 counter-UAS。这立即说明，如果把广义自主系统数字当作 TAM，会高估 Roark 的直接市场。国际侧，Unmanned Airspace 称 2026 年前几个月公开宣布的政府
              C-UAS 合同超过 $29 billion，但这是一个滚动合同总额，而不是干净的年度市场定义。Defense News 给出另一个视角：NATO 正在九个用例中筛选 18
              个经审查方案，并提供购买和租赁选项，这更应理解为近期资质瓶颈，而不是支出总额。供应侧数量也显示同样的模糊性。Unmanned Airspace 目录称其跟踪 550+ 家公司和 1,000+
              个项目，而其支出文章称拦截无人机制造商已超过 70 家。正确结论不是某一个数字为真、其他为假，而是公开证据指向一个庞大且迫切的市场；真正可买的切片更窄、经过筛选，也比单一通用 TAM 标题暗示的更拥挤。
