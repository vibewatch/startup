  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 不透明与资本可信度是首要风险
        blocks:
          - type: paragraph
            body: >-
              现有证据足以说明 Roark 是一家真实运营的公司，但仅靠披露质量，还撑不起后期投资人的信心。Companies House 证明 Roark 仍处于 active
              状态，给出了下一次申报节点，也显示了真实的股本申报序列和 2024 年账目。问题也在这些申报里：2024 年账目把英国和美国集团销售合并披露，申报链条没有给出清晰投资人名册，2026 年 4 月的 SH01
              又增加了一层对普通股持有人重要的流动性优先权，却没有解释更完整的权利包。Resilience 和 Nordic9 从不同角度强化了同一个问题：$210 million Series B 和 $1.6
              billion 估值的标题已经公开流传，但验证没有一起流传。Roark
              留存的一手网页材料提供的是识别信息和地址，不是防务相邻后期融资通常需要的管理层级信任材料。因此，第一项风险的重点不在公司是否存在，而在外部投资人能否仅凭公开证据，可信地承销价格、治理杠杆和下行风险。
