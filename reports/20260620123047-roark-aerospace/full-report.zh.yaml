      - number: '3.2'
        title: 能力、定价与买家匹配
        blocks:
          - type: paragraph
            body: >-
              同行能力分化出清晰的控制点。Roark 的公开材料强调易接入探测、模块化部署和服务化覆盖；2023 年 DRONELIFE 与 sUAS News 文章对入门价格披露得异常明确，包括 £2,150 到
              £4,450 的硬件型号、每用户每月 £95 的 DDaaS，以及每天 £185 的快速部署。相比之下，大多数披露更充分的同行不会在官方表面发布标价，而是销售一体化或报价制系统。D-Fend 的
              EnforceAir 页面强调 RF-cyber 探测、跟踪、识别、安全降落和开放 API 集成。Dedrone 营销一套硬件无关、AI 驱动的空域安全平台，拥有超过 30 个已验证集成；Fortem
              则认为，多供应商部署常因组件无法干净集成而失败，因此销售端到端 SkyDome 套件。DroneShield 为政府客户打包固定场站、单兵、移动中和软件选项。Leonardo DRS、DZYNE 和 SRC
              把问题描述为跨军事、关键基础设施、机场、海上或远征场景的分层防护。商业含义是，Roark
              的公开价格透明度和托管服务叙事，可能会吸引需要快速探测覆盖、活动部署或低资本开支试用路径的客户；但主承包商级采购买家会把这套供给与那些已经发布更深集成、部署和任务验证性能证据的供应商相比较。
