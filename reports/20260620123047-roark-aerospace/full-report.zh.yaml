            body: >-
              能把判断从偏紧绷、继续研究推向合理的，不是又一篇摘要文章，而是管理层会议室里的证据。最快打开局面的材料，是签署版 cap table、清晰的权利摘要，以及当前收入质量证明，用来判断 Roark
              是否已经长进了自己的叙事，还是只是设计出一个解释很薄的估值上调。客户引用、部署数量、续约行为和 backlog
              质量同样重要，因为这家公司被按防务科技平台估值，而不是按一次性硬件转售商估值。如果融资总额漂移无法调和、优先权让新投资人的受偿顺位低于预期，或 2026 年经济性仍接近 2024
              年申报中可见的负毛利图景，论点也会很快失效。对新投资人而言，决策规则很直接：只有公司补上这些证据缺口后才加价进入；否则，要么要求相对流传标题价有实质折扣，要么等下一次定价事件倒逼更高透明度。
