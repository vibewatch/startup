  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 论点
      - 支撑证据
      - 什么会改变判断
    rows:
      - - 多头论点
        - Roark 可能已经完成一次合法的第三方估值跃升；其服务驱动的 C-UAS 平台扩张速度，也可能快于最近申报账目显示的水平
        - 2025 年 12 月申报、Nordic9 标题、Tracxn 融资总额和大型网络叙事，都指向真实动能
        - 需要当前收入结构、客户证明和已签署 cap table 披露来验证叙事
      - - 基准论点
        - 融资确实发生了，但公开证据目前只支持低于流传标题的折价区间
        - 一手申报证明现金和 cap table 有变动，但经济性和权利披露仍偏薄
        - 如果能把 SH01 申报干净衔接到当前完全摊薄所有权，区间可能上修收窄
      - - 反论点
        - 公开标题可能高估当前可投资价值，因为优先权条款、偏弱毛利率和不透明证明会压低普通股价值
        - 2025 年 3 月反稀释条款、后续优先权层级和已申报毛利为负，都支持保持怀疑
        - 更强利润率、具名客户和已核对权利栈会削弱反论点
      - - 证伪信号
        - 如果管理层无法核对公开融资总额，或拿不出客户级验证，下一次定价可能低于叙事区间
        - 公开数字漂移、数据库设门槛，目前留下太多未解问题
        - 由第三方领投且文件透明的融资，可能正向重置信心
    notes: 各论点刻意保持价格敏感：同一个运营故事，在一个价格可投，换一个价格就可能没有吸引力。
