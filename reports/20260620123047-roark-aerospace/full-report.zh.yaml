      - number: '1.3'
        title: 商业模式与产品定位
        blocks:
          - type: paragraph
            body: >-
              Roark 自有材料和第三方材料都持续把它描述为一张一体化空域防御网络，而不是单一探测器或效应器。归档首页使用了 “Drone Detection as a Service | C-UAS as a
              Service” 标签；2024 年账目称，公司主要从事无人机探测系统、反无人机系统和无人载具的制造与服务部署。DroneXL 在 2025 年 1 月补充了运营细节，称 Aero-Ark 系统结合
              ADS-B、Remote ID、DJI 数据包收集和解密、被动雷达以及边缘 AI 分类；同一报道还称 Roark 通过 Plexus 平台扩展 WAMI 和高光谱成像覆盖。Global Defense Tech
              News
              也把它描述为跨陆地、空中和海上环境部署的统一传感器、反无人机工具和决策支持。共同主线是一套服务主导架构，把感知、地图、分析和指挥软件打包在一起。在一个越来越奖励一体化指挥控制和经常性监测合同的市场里，这个策略说得通。问题在于，大部分技术细节仍停留在二级报道，而不是第一方工程文档。
