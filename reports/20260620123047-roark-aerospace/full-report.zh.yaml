  - id: TV006
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 门槛或事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - Cap table 不透明持续
        - 管理层无法在尽调中提供已签署 cap table 和权利摘要
        - 价格支撑仍过度依赖叙事，无法描绘下行保护
        - 不按流传标题推进
      - - 融资总额仍未核对
        - 尽调后，公开口径和管理层口径的募资金额仍冲突
        - 削弱对稀释测算和治理纪律的信心
        - 重置跟踪，或在核对前回避
      - - 当前经济性类似 2024 年申报画像
        - 2026 年数据中毛利率和现金转化仍然较差
        - 削弱高倍数逻辑，并推向空头区间
        - 要求实质低价，或停止
      - - 客户证明缺失
        - 没有具名参考、续约数据或已验证部署数量
        - 多头情景失去支撑高估值所需的运营证明
        - 只假设基准或空头
      - - 权利栈优先级高于预期
        - 优先权瀑布或附函实质损害普通股结果
        - 即便企业价值正确，也可能高估新股权买到的东西
        - 重新定价，或设计保护性条款
    notes: 这些是投资流程否决标准，不是运营预测；每个触发项都设计成可在尽调中监测。
