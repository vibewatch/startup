        - 具名客户证明偏薄，公开部署验证弱于同业
      - - Shield AI
        - 相邻自主平台
        - 2025 年 3 月融资 $240M，估值 $5.3B
        - OEM、政府、机器人和国防集成商
        - 争议环境中的任务自主软件和开发者工具
        - 更接近自主基础设施，而非低成本探测服务
      - - Epirus
        - 定向能专家
        - 2025 年 3 月 $250M Series D；风险融资总额超过 $550M
        - 分层近程防空、关键资产、军事编队
        - 高功率微波效应器和空域感知
        - 控制点不同；对 Roark 探测服务的直接替代性较弱
      - - D-Fend Solutions
        - 直接专业厂商
        - 2024 年 12 月 $31M 成长融资；Motorola 于 2026 年同意以 $1.5B 收购
        - 政府、公共安全、机场、关键基础设施
        - RF 网络接管并安全降落，强调开放 API 和连续性
        - 企业销售以报价为主，而非透明低端入门定价
      - - Dedrone / Axon
        - 有生态背书的直接专业厂商
        - 数百家客户；现已进入 Axon 公共安全平台
        - 公共安全、机场、公用事业、军方、惩教、关键基础设施
        - AI 驱动的空域 C2、30+ 项集成、硬件无关技术栈
        - 公开定价不够明确；取决于平台和集成范围
      - - Fortem Technologies
        - 集成型专业厂商
        - Lockheed 2026 年投资 $25M；拥有盟友订单和关键基础设施合同验证
        - 军方、基础设施、机场、世界级场馆、政府
        - 集成雷达、拦截器和软件套件，并有实战捕获证明
        - 可能比 Roark 入门级方案更重，也更偏项目制
      - - DroneShield
        - 公开市场专业厂商
        - 上市纯玩家；官网称获得 34+ 个政府机构信任
        - 政府、军方、固定站点和移动防护买家
        - Counter-UxS 产品覆盖软件、固定站点和移动套件
        - 公开市场 IR 有助于可信度，但官方目录价仍不透明
      - - Leonardo DRS
        - 既有厂商 / 主承包商级集成商
        - 收入 $3.6B，积压订单 $8.7B，员工 7,300 人
        - DoD、盟军、海事、机动和基地防御买家
        - 项目级规模、分层压制能力和更广的国防关系
        - 业务范围远大于 Roark；并非为超低摩擦试用优化
      - - DZYNE / SRC
        - 既有厂商式替代方案
        - DZYNE 称已在 50+ 个国家部署；SRC 称自 2005 年以来开发 C-UAS
        - 军方、机场、VIP、基础设施、固定 / 移动部署
        - 分层、任务就绪系统，已建立国防相关性
        - Roark 式托管服务或城市覆盖打包的证据较少
