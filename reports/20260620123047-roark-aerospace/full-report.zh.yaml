      - number: '8.3'
        title: 可比组与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比证据支持谨慎，而不是亢奋。Shield AI 和 Epirus 说明，防务自主和反无人机平台可以获得很大规模的私募融资，但两家公司披露的产品证明和战略支持方细节都比 Roark
              目前更深。本组最清晰可用的定价可比，是 Motorola 收购 D-Fend：一家预计 2026 年收入 $185 million 的公司卖出 $1.5 billion，约等于 8.1x
              前瞻收入。这个倍数已经计入了可观增长和战略稀缺性，但 D-Fend 同时有披露部署和具名买方。DroneShield 在 2026 年 6 月给出少见的公开纯标的参照，公开市值约 $1.77
              billion；Leonardo DRS 和大型防务主承包商则提醒读者，公开市场对防务的胃口健康，但集中在规模更大、披露更充分的运营商身上。在这一背景下，接近流传 Roark
              标题价的牛市情景只有在管理层能证明当前经济性和客户证据远超最后申报账目时才说得通。更可辩护的纯公开信息姿态，是把基准区间放在标题价下方，并设置明确计入不确定性的宽熊牛价差。
