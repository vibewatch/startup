      - number: '7.3'
        title: 产品军备竞赛抬高了整合和执行脆弱性
        blocks:
          - type: paragraph
            body: >-
              Roark 公开讲述的产品故事很宽，但在证据很薄时，宽本身就是风险。Defense Tech News 和 DroneXL 描述的技术栈横跨 RF 与被动探测、边缘 AI、反无人机工具、WAMI
              与高光谱覆盖，以及向 Plexus
              供给数据的第三方飞手网络。战略上这很有野心，但也意味着许多依赖：传感器融合、数据治理纪律、外部操作员质量、现场支持、云或平台韧性，以及足够的工程深度来维持整条链路运转。留存记录中唯一硬性的员工数据，是 2024
              年账目里的英国平均 49 名员工，不含承包商和国际员工。与此同时，披露更充分的同行正在发布更强的规模、捕获性能、部署数量、平台整合、融资深度和治理界面证据。Motorola 收购 D-Fend、Axon 整合
              Dedrone 平台、Fortem 的部署主张、Shield AI 的自主能力证明、Epirus 的量产扩张，以及 DroneShield
              的公开投资人界面，都说明这一品类正在走向更大、更经验证、更资本充足的技术栈。Roark 可能仍有切入口，但剩余风险在于，它的复杂度可能跑在公开证据所能证明的运营成熟度前面。
