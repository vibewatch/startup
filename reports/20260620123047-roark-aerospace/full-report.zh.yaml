      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 申报文件部分印证了融资规模，但投资者权利和当前运营质量披露仍不足
        - 只有明确价格纪律并要求文件时，才继续尽调
      - - 信心
        - 中
        - 核心申报文件扎实，但估值叙事很大一部分仍依赖稀薄或设门槛的信息源
        - 把判断用于方向参考，不用于精确定价
      - - 风险评级
        - 高
        - Cap table 不透明、优先权悬置和已申报毛利为负，都可能削弱下行保护
        - 不要跳过治理或财务尽调
      - - 估值立场
        - 偏高
        - 一手证据支持大额融资确有发生，但公开证据还不足以支撑干净的后期成长溢价
        - 要求折价，或拿到更强尽调证据
      - - 最佳下一步
        - 已签署尽调包
        - 承销新一轮前，需要 cap table、权利、当前利润率和客户证明
        - 后续工作以管理层资料室材料为闸门
    notes: 本表把业务质量与价格支撑拆开；建议有意跟随证据变化，而不是给出泛泛判断。
    claimRefs:
      - CV021
      - CV023
      - CV025
