  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              最强证据显示，Roark 销售的是服务主导的 counter-UAS 套餐，而不是单一探测器 SKU。归档首页把公司定位为 "Drone Detection as a Service | C-UAS as a
              Service"；两家独立无人机行业媒体描述了 Aero-Ark 硬件、DDaaS 席位和 Rapid Deploy 项目，并给出明确公开价格。跨这些来源看，核心商业动作一致：客户要么购买或临时部署
              Aero-Ark 硬件，要么购买监测覆盖服务，然后通过 Plexus 平台接收空域警报。同一批来源还把 WAMI 和高光谱成像放在空域产品旁边，说明 Roark 想销售的是更广的监测技术栈，而不是纯 RF
              探测。薄弱处仍是部署证明。证据能显示产品包装、形态和商业意图，但还没有显示具名运营场站、实时 DDaaS 城市列表，或足以确认网络中多少处于生产、多少处于市场化路线图的客户结果。
