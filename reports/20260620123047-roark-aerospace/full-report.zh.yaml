      - number: '5.4'
        title: 信任控制与产品技术结论
        blocks:
          - type: paragraph
            body: >-
              Roark 已跨过真实、可识别、运营中且面向防务的公司最低门槛，也有连贯产品叙事，但尚未跨过许多防务和关键基础设施买家现在期待的公开信任门槛。归档官方表面展示了 NCAGE、UEID、DUNS、VAT
              和法律地址；行业报道声称支持 Remote ID、授权反制选项，以及便携、哨兵和服务部署组合。同样重要的是缺失项：已检索到的 Roark 来源没有发布产品安全控制、Plexus 或 WAMI/HSI
              数据的隐私处理、现场可靠性指标、正式认证，或严谨的公开集成指南。NATO 和更广 C-UAS 采购在 2026 年正转向互操作、机动部署、标准化测试，以及租赁或服务化购买模式，因此 Roark
              的包装可能契合买家需求。但在管理层提供客户引用、测试报告、信任文档和硬可靠性数据之前，基于证据的结论仍是：Roark 有可信概念和产品外壳，但在运营成熟度和技术防御性上缺少足够公开证明。
