  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅基于公开信息的承销区间很宽，因为精确下行保护和当前收入质量都仍未解决。
    approximationNotes: 区间表示分析师在各情景下的投后估值带，单位为十亿美元。
    data:
      items:
        - label: 悲观
          low: 0.3
          high: 0.6
          unit: USD bn
          detail: 当前经济数据弱、客户证明单薄，权利悬而未决的压力更大
        - label: 基准
          low: 0.8
          high: 1.2
