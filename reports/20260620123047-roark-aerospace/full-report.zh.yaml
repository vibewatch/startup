  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Roark 面对的不是一组干净的同类公司。它自己的归档首页和早期行业报道把公司定位为 “Drone Detection as a Service | C-UAS as a Service”，配有便携或固定
              Aero-Ark 硬件和服务层，降低客户前期支出。这使最接近的直接竞争来自 counter-UAS 中服务主导、软件中心的部分，而不是整个防务自主市场。围绕这条直接赛道，还有更广的专家公司和既有厂商。Shield
              AI 销售任务自主基础设施，Epirus 开发用于分层短程防空的高功率微波效应器，D-Fend 围绕 RF 网络接管，Dedrone 和 Fortem 强调一体化
              detect-track-identify-mitigate 技术栈，DroneShield 是公开市场中的模块化 counter-UxS 专家，Leonardo DRS、DZYNE 和 SRC
              则代表成熟集成商或既有厂商替代方案。Unmanned Airspace 2026 年目录跟踪 550 多家公司和 1,000 多个项目或系统，强调 Roark
              进入的是一个拥挤品类，买家可以混合专家传感器、效应器和指挥层，而不必押注一个新创业故事。美国陆军 2026 年 marketplace
              语言在这里也重要，因为它暗示买家越来越偏好能嵌入盟国资质和互操作体系的已验证供应商。在这种环境下，Roark
              的故事最容易被理解为一枚低摩擦探测和托管服务楔子，切入一个高端越来越由资本更雄厚的一体化供应商掌控的市场。
