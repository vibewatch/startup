  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分层逻辑
        blocks:
          - type: paragraph
            body: >-
              Roark 自己的公开表述很重要，因为该赛道的头部数字宽到容易误导。归档首页把公司定位为 "Drone Detection as a Service | C-UAS as a Service"；DroneXL 和
              Defense Tech News 描述的组合则包括 OTC 探测设备、广域感知、反无人机工具和 Plexus 数据层。这意味着最接近的市场不是整个自主系统技术栈，也不是所有无人系统支出，而是分层的
              counter-UAS 任务链：探测、跟踪、识别、压制和作战指挥支持。NATO AIRCOM 2026 年 focus day 强化了这个边界，它强调从探测到 neutralisation 的全链条；美国陆军 /
              NATO 的 marketplace 工作同样先从反无人机系统切入，再扩展到相邻雷达和传感器。落到实际口径，纳入的支出包括分层战场和场站防御项目、可部署 / 机动 C-UAS
              套件、机场或关键基础设施空域保护，以及经常性监测或托管服务叠加层。排除的支出包括广义自主软件、通用无人机，以及不解决同一反无人机任务的相邻防空品类。这个更窄的边界更适合承销，因为它匹配 Roark
              声称服务的买家问题，也凸显现有企业已经发布了比 Roark 更强的部署证明。
