    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - Cap table 与权利
        - 已签署完全摊薄 cap table、SPA、附函和清算瀑布
        - 需要把标题估值转换成真实下行保护和所有权经济性
        - 公司律师和领投方文件
      - - 当前运营质量
        - 2025-2026 年管理账、收入结构、毛利率桥接和现金续航
        - 需要判断 2024 年毛利为负的画像是否已结构性修复
        - CFO 资料包和董事会报告
      - - 客户证明
        - 具名客户、部署数量、续约率和按细分列示的订单积压
        - 需要验证网络和服务规模主张是否能支撑价格
        - 销售负责人推荐加客户访谈
      - - 融资历史核对
        - 按轮次融资历史逐项匹配每份 SH01 和数据库数字
        - 需要核对 $210M、$260M、$287M 和 €57.6M 公开引用
        - 财务团队核对备忘录
      - - 治理表面
        - 董事会构成、保留事项，以及任何 SPV 治理特征
        - 需要评估控制权、汇报纪律和后续融资流程质量
        - 法律尽调加治理文件
    notes: 每项要求都必须满足，才足以实质上调建议；没有一项只是装饰。
