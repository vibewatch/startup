            body: >-
              申报序列比新闻稿更重要，因为它是唯一不能被轻易当作宣传文案挥掉的一手证据。2025 年 3 月已经引入了保护投资人的优先权条款，包括反稀释。随后，2025 年 12 月的 SH01 显示，131 股 B
              普通股实缴 £156.96 million；数日后又发生一次资本重组，实际上把该类别从 131 股重计为 131,000 股，同时保留名义价值。这个序列并不常见，但分析上有用：它隐含的每股价格指向约 £1.36
              billion 的投后估值，发生在后续优先权和 2026 年 4 月发行之前，方向上与公开的 $1.6 billion
              叙事一致。问题不在规模，而在缺失的桥接。外部人仍看不到哪些投资人买了哪些证券、精确的清算瀑布，或后续优先权层级如何影响普通股持有人。因此，本章把申报数学视作三角定位，而不是当前标记清晰无误的证明。
