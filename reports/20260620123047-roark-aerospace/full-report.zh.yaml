  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Roark 的估值最敏感于投资者如何权衡当前证明与 2025 年末融资信号。
    approximationNotes: 数值是各情景中点，单位为十亿美元，不是可观察交易标记。
    data:
      items:
        - label: 悲观情景中点
          value: 0.45
          note: 当前经济数据和权利仍缺少有力文档时使用
        - label: 基准情景中点
          value: 1
          note: 融资量级真实、但披露仍需要显著折价时使用
        - label: 乐观情景中点
          value: 1.6
          note: 只有管理层用当前 KPI 和清晰权利文件支撑头部估值时才使用
