companyProfile:
  summary: >-
    Roark Aerospace 是一家英国反无人机公司，2023 年 11 月 30 日注册成立。公司把自己定位为无人机探测和 C-UAS-as-a-service 平台，覆盖 Aero-Ark 传感器、Plexus
    指挥软件，以及快速部署 / 监测服务。官方备案显示，这家公司不只是幻灯片故事：FY2024 账目披露营业额 £36.9 million、净资产 £79.3 million、英国平均员工 49
    人，并采用覆盖英国和美国实体的集团销售模式。公开产品证据支持其确有多模态探测、成像和决策支持供给；2025 年 3 月至 2026 年 4
    月的股权备案也显示重大融资活动和一套复杂演进的资本结构。核心尽调问题不是公司是否存在，而是透明度：客户、投资人名单、安全与合规状态，以及从备案到流传的独角兽级估值之间的桥梁，对一家声称后期规模的公司来说都明显偏薄。
  foundedDate: '2023-11-30'
  headquarters: London, England, UK
  productSummary: >-
    Roark 销售 Aero-Ark 探测设备和 Plexus 软件，供给覆盖直接硬件销售、Detection as a Service、Rapid Deploy 现场服务，以及更广的 WAMI/HSI
    监测数据流。公开材料称，其分层技术栈在陆地、空中和海上环境中使用 RF 感知、数据包捕获、被动雷达、边缘处理和指挥控制流程。
  customerFocus: 表面上的目标客户包括政府和军方用户、公共安全与安保运营方、关键基础设施业主、临时活动买家和私人监测客户，但公开来源没有点名任何生产级客户。
  businessModel: 混合硬件与服务模式，把设备销售、经常性 detection-as-a-service、快速部署费用和平台访问捆在一起，而不是纯软件订阅业务。
  stage: Private company; Series B claimed by third parties in late 2025
  fundingStatus: >-
    官方备案显示，2025 年 3 月有重大股权活动，2025 年 12 月有一笔 £156.96 million 的实缴配股；第三方来源流传的则是 $210 million Series B、投后估值 $1.6
    billion，但公开层面仍只得到部分验证。
