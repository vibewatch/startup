chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与足迹
        blocks:
          - type: paragraph
            body: >-
              对一家声称达到十亿美元规模的公司而言，Roark Aerospace 的公开身份异常压缩，但官方记录把法律壳体说得很清楚。Companies House 将 RO-ARK AEROSPACE LIMITED
              列为活跃的私人有限公司，2023 年 11 月 30 日注册，注册地址为 Monomark House, 27 Old Gloucester Street, London, WC1N
              3AX。归档的法律页面还增加了 Cambridge Science Park 地址和纽约办公室，说明其运营足迹可能比单一英国备案显示的更分散；归档首页则展示 NATO NCAGE、UEID、DUNS 和 VAT
              标识。合起来看，官方和归档记录支持一个结论：Roark 很快就围绕防务相邻商业活动完成组织搭建，至少在营销材料中维持了英国—剑桥—美国足迹，并在生命周期很早就向盟国政府买家释放采购就绪信号。Cushman &
              Wakefield 2026 年一季度 marketbeat 提到 Cambridge 一处 13,650 平方英尺租约，这是 Cambridge 存在不只是门面地址的最强独立佐证。
