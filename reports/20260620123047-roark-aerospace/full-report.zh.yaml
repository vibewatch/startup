      - number: '2.4'
        title: 增长驱动、约束与 Roark 匹配度
        blocks:
          - type: paragraph
            body: >-
              三股力量同时把市场往前拉：战场迫切性、采购改革和成本交换压力。Defense News 对拦截无人机的报道说明了买家为什么如此关注价格不对称；Fortem 和 Lockheed
              也从供应商侧提出同一点，认为低成本、软件中心的拦截能显著降低交战成本。与此同时，这个市场并不空。Shield
              AI、Epirus、D-Fend、Dedrone、Fortem、DroneShield、Leonardo DRS、DZYNE 和 SRC 都拿出了证据，表明严肃资本、具名部署或战略收购方已经进入该品类。这给
              Roark 带来采用约束。第一，市场拥挤且越来越整合，分销伙伴、客户背书和渠道信任的门槛更高。第二，NATO 和陆军采购改革让互操作性和测试验证更重要，而不是更不重要。第三，Roark
              的公司级披露相对那些会点名客户、用例或地域的同行仍然偏薄。因此，Resilience 的批评即便放在市场章节也相关：赛道热度不会自动转化为公司可信度。最有证据支撑的工作判断是，Roark
              瞄准的确是一个真实且扩张中的细分市场，尤其是服务主导或固定场站项目；但投资人仍需要客户名称、资质证据和管线转化数据，才能把通用市场增长转成公司级份额假设。
