            body: >-
              最强公开证据显示，Roark 销售给的是买家问题，而不是可公开引用的账户。归档首页和法律页确立了英国和美国运营表面，并把公司定位在 Drone Detection as a Service 和 C-UAS as
              a Service 周围。行业报道随后补上商业动作：Aero-Ark 硬件可直接购买，Detection as a Service 提供月度覆盖，Rapid Deploy
              为临时需求提供短期使用。这种组合支持几个可能付费群体，包括政府或军方用户、公共安全和安保运营方、关键基础设施业主、临时活动买家，以及更广的监测客户。它也显示公司有意通过定价和服务打包降低接入摩擦。记录仍没有做到的是，点名一个今天明确向
              Roark 付费的部委、机场、警局、场馆或企业账户。因此，分层图景在类型层面可信，但在投资人通常需要用来承销耐久性的具名客户层面偏薄。
