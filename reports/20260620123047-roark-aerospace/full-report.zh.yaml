        - 在网络协同之前或同时运行分类和本地处理
        - 专用硬件、模型维护和软件更新纪律
        - 没有延迟、吞吐或模型准确率的公开基准
      - - Plexus 平台
        - 暴露警报、数据融合和操作员工作流
        - 可靠网络、UI/UX、存储和集成模式
        - 检索来源中没有公开安全、API 或韧性文档
      - - 可选干扰 / 反制路径
        - 支持获许可的击败动作和手动或自动响应
