  - id: FM004
    title: C-UAS 从需求到规模部署的采用流程
    type: flow
    layout: standard
    summary: 2026 年采购改革把采用过程变成分阶段证明引擎：先有紧迫需求，再资格筛选、反馈、签约，最后才规模列装。
    data:
      nodes:
        - id: threat
          label: 威胁紧迫性
          detail: 无人机入侵或战场适应制造即时防护缺口。
        - id: search
          label: 买方搜索 / 挑战
          detail: 买方定义用例，而不是写一份耗时数年的定制规格。
        - id: test
          label: 测试与资格筛选
          detail: 供应商证明互操作性、部署可行性和性能。
        - id: feedback
          label: 操作员反馈闭环
          detail: 陆军和盟军用户比较系统，把有效方案放大。
        - id: contract
          label: 购买 / 租赁 / 服务合同
          detail: 买方选择框架、试点、租赁或托管部署路径。
        - id: scale
          label: 规模列装
          detail: 胜出系统扩展到场地、部队或盟军客户。
      edges:
        - from: threat
          to: search
          label: 需求变成用例
        - from: search
          to: test
          label: 提交并评估
        - from: test
          to: feedback
          label: 生成用户证据
        - from: feedback
          to: contract
          label: 选择最契合路径
        - from: contract
          to: scale
          label: 放大有效方案
    approximationNotes: 这是工作流地图，不是已披露的转化漏斗；公开来源描述了阶段和资格逻辑，但没有通过率统计。
