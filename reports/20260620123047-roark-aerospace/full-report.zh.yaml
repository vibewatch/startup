      - CE053
      - CE054
      - CE056
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 勾勒 Roark 似乎瞄准的买方问题，从事件驱动部署到持续联网覆盖。
    data:
      items:
        - label: 政府 / 军方
          detail: 部队防护威胁 -> 评估可互操作的 C-UAS 选项 -> 寻找已验证的市场采购路径 -> 只有标准和测试清楚后才部署
        - label: 公共安全
          detail: 未授权无人机或活动安保顾虑 -> 审查法律授权和拨款路径 -> 比较供应商能力 -> 购买检测或承包商辅助覆盖
        - label: 关键基础设施
          detail: 持续场站监测需求 -> 比较低摩擦托管覆盖与自有硬件 -> 运营和授权匹配后部署
        - label: 临时活动安保
          detail: 短期安保需求 -> 倾向 Rapid Deploy 按日计费服务 -> 用于活动或事件窗口 -> 决定是否复购
        - label: 城市监测 / 数据网络
          detail: 需要更广的城市覆盖或影像 -> 增加飞手或传感器支持 -> 使用接入 Plexus 的数据界面 -> 寻求持续使用
    approximationNotes: 这张旅程图综合了公开来源可支撑的买方问题；它不是 Roark 披露的内部销售流程。
