      - number: '1.5'
        title: 验证缺口与尽调风险
        blocks:
          - type: paragraph
            body: >-
              主要尽调问题不是 Roark 毫无证据，而是最强证据和最大胆主张分属记录的不同层。官方备案支撑了注册、创始人控制、运营收入、债务和多次注册后资本事件。但头部风险叙事——55,000 台已部署设备、3,000
              名最终用户、244 名员工、$210 million Series B 和 $1.6 billion 估值——主要由
              Tracxn、行业媒体和一篇部分付费墙的批评文章支撑，而不是由开放的投资人或客户披露支撑。Resilience 明确把 Roark 描述为一个“无人能验证的防务独角兽”，归档官网也只露出极少营销文案和标识。在
              DroneShield、Shield AI 等成熟同行会定期发布投资者材料和更完整产品叙事的行业里，Roark 的披露水平明显低于后期防务科技投资人希望看到的标准。后续章节应以一个工作假设展开：Roark
              是真实存在、商业活跃且资金充足的公司，但许多规模和客户主张必须在管理层会议室验证后，才应进入承销判断。
