              55,000 台设备、拥有超过 3,000 名最终用户。这些数据点暗示商业野心和某种运营足迹，但不等同于具名生产证明。保留下来的 Roark
              来源没有一个点名客户，也没有区分试点、试用和生产部署。竞争对手页面凸显了差异：Dedrone 披露具名案例研究和广泛受保护场站数量，Fortem
              则点名具体政府和活动部署。因此，基于证据的结论很窄但重要：Roark 可能有真实用户，但开放网络没有提供足够强的公开客户引用集，无法像对照来源那样验证账户质量、成熟度或可重复性。
