        title: 技术架构与差异化主张
        blocks:
          - type: paragraph
            body: >-
              Roark 的架构故事是可信的，但仍主要停留在营销和行业媒体层面，而不是文档级技术证明。Dronelife、sUAS News 和 DroneXL 独立指向同一个宽泛模式：WiRED
              被描述为前向散射或卫星辅助感知层；CRI 被描述为 RF 扫描和数据包分析层；DroneXL 又加入 ADS-B、Remote ID、DJI
              数据包解密和被动雷达；多家媒体称分类或协调在设备端或网络边缘完成，再通过 Plexus 暴露数据。这套多模态技术栈与成熟 C-UAS 供应商描述分层探测的方式方向一致，但 Roark
              的公开证据明显薄于同行文档。SRC、Leonardo DRS、D-Fend、DZYNE、Dedrone 和 Fortem 都给出更清晰的传感器融合、部署套件、开放集成或完整 detect-track-defeat
              链条说明。Roark 仍可能有差异化的低成本楔子，尤其如果其服务价格真实；但开放记录没有用测试数据、专利或客户验证支撑前向散射性能、数据包解密覆盖、可编程超表面有效性，或任何专有大语言模型优势。
