        - 中高
        - Fortem、D-Fend、Dedrone 和 DroneShield 发布的部署或渠道证明都强于 Roark
        - 提供具名试点转合同案例，以及快速部署的毛利数据
      - - 叙事差异化
        - 即使产品可用，围绕 Roark 规模和融资的负面审视也会削弱买家信任
        - 高
        - Resilience 质疑验证情况，而同业交易和采购证明更强
        - 为尽调室准备客户推荐、部署文件和融资 / 估值证据
