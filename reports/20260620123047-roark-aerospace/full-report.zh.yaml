      - number: '1.4'
        title: 融资、财务画像与里程碑
        blocks:
          - type: paragraph
            body: >-
              Roark 的备案在一个关键点上比媒体报道更有力：到 2024 年底，公司不是空壳。其提交的账目披露，截至 2024 年 11 月 30 日的年度营业额为 £36.9 million、净资产 £79.3
              million、英国平均员工 49 人、税前亏损 £16.6 million，同时披露一笔 2029 年 3 月到期的 £16.42 million 债券。与此同时，备案历史显示融资节奏很快：2025 年 3 月
              13 日大额配股，2025 年 12 月 15 日 B 普通股备案显示 £156.96 million 现金实缴，随后在 2025 年 12 月、2026 年 1 月、2026 年 4
              月又有资本表调整。这些官方备案本身不能证明 $1.6 billion 估值，但确实确认第三方媒体讨论的日期附近发生了实质性资本形成。Nordic9 和 Resilience 都报道了 2025 年末 $210
              million Series B 及 $1.6 billion 隐含估值，但 Nordic9 明确标注该交易待验证，Resilience 则强调投资人披露不透明。最干净的结论是：Roark 几乎肯定在 2025
              年末完成了一次重大融资事件，但准确投资人名单、轮次结构和估值计算在公开领域仍缺少文档支撑。
