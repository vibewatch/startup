      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              证据最多指向一条混合型、偏弱的护城河。Roark
              最有支撑的优势是进入门槛低：公开价位、便携硬件和服务打包比许多同行更清晰。这有助于赢得试点、活动覆盖，或不想购买全栈的客户。但同一组证据也显示，低端探测和托管监测是技术栈中最容易商品化的部分。资本更雄厚的供应商已经拥有更难复制的护城河：Shield
              AI 在自主基础设施，Epirus 在定向能效应器，D-Fend 在 RF 接管，Fortem 在已验证拦截运营和一体化雷达，Dedrone 在 AI 指挥控制及生态杠杆，DroneShield
              在公开市场融资渠道和政府专业化，Leonardo DRS 或 SRC 则在项目级信任。Roark
              还面临内部或主承包商主导集成的替代风险：买家可以组合专家传感器、干扰器和指挥软件，而不是标准化采用一家年轻托管服务供应商。因此，本章承销结论偏谨慎：Roark
              有可能切出一个探测主导的服务细分，但除非管理层能证明具名客户、续约行为、集成防御性，以及从低成本探测走向更高价值指挥或效应层的路径，否则公司仍会同时暴露在来自下方的商品化和来自上方的一体化既有厂商替代之下。
