      - number: '3.3'
        title: 分销、切换成本与信任
        blocks:
          - type: paragraph
            body: >-
              counter-UAS 的竞争耐久性越来越取决于渠道和证据，而不只是传感器。Motorola 计划以 $1.5 billion 收购 D-Fend，Axon 收购
              Dedrone，把两家专家公司拉入更大的公共安全生态。Lockheed Martin 投资 Fortem，以及 Fortem
              相关的关键基础设施和盟国订单公告，显示主承包关系如何加快部署、验证和制造规模。Leonardo DRS 起点大得多——收入 $3.6 billion、积压订单 $8.7 billion、员工 7,300
              人——再把 counter-UAS 叠进更广的防务项目。这些事实重要，因为这个市场的切换成本真实存在，但并非绝对。D-Fend 和 Dedrone 都强调开放 API
              或硬件无关集成，意味着买家可以组装多供应商技术栈；与此同时，Fortem 声称部署失败常源于兼容性缺口，也说明一旦端到端系统经过验证并落地，就会变得黏性很强。对 Roark
              来说，现实问题是公开证据中具名客户、重复部署或采购胜利仍远少于这些竞争对手披露的内容。因此，Resilience 的怀疑正好落在竞争章节内部：即便 Roark
              有聪明的服务模式，防务、公共安全、机场和关键基础设施买家也更可能信任有部署文档、交易验证和更广渠道支持的供应商。
