  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 分层军事 C-UAS 项目
        - 面向战场或基地防御的探测、跟踪、压制、C2、训练和可部署系统
        - 不解决反无人机任务的一般导弹防御或广义自主项目
        - 国防部、军种、盟军联盟项目
        - 核心目标市场，因为 Army、NATO 和供应商页面都把问题定义为分层探测-跟踪-压制
      - - 固定场地关键基础设施保护
        - 围绕公用事业、港口、园区和战略场地的持续监测、缓解和响应
        - 没有空域防御需求的一般物理安防或摄像头预算
        - 基础设施所有者 / 运营方、安全集成商、国家监管机构
        - 与 Roark 相关，因为服务主导的监测和低附带损害缓解可适配连续场地防御
      - - 机场 / 飞行场空域安全
        - 保护飞行运行的无人机探测、分类和安全缓解
        - 一般机场 IT 或无关周界安防支出
        - 机场运营方、航空主管机关、公共安全伙伴
        - 重要相邻细分，因为同行明确把机场列为核心终端市场
      - - 公共安全 / 活动 / VIP 保护
        - 面向大型活动、公共场馆、监狱和 VIP 行动的临时或持续保护
        - 没有无人机拦截功能的通用警务软件或人群管理工具
        - 执法机构、国土安全、活动安保预算负责人
        - 对快速部署系统有吸引力，但证明和法律 / 监管适配极其重要
      - - 广义自主和无人系统相邻领域
        - 软件、自主工厂、边缘自主和一般无人系统预算
        - 把所有自主或所有 UAS 支出都视为直接 C-UAS 收入机会
        - 混合：国防实验室、OEM、平台项目、软件买方
        - 可作为背景，但若不收窄，太宽，不能作为 Roark TAM
    notes: 纳入 / 排除逻辑基于反无人机待完成任务，而不是泛防务科技标签。
