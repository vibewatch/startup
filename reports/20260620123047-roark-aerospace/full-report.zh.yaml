        title: 领导层、创始人控制与治理
        blocks:
          - type: paragraph
            body: >-
              公开治理披露集中在一个人身上。Companies House 显示，Patton Atkinson-French 是唯一在任董事，注册当日获任；他也是唯一的 significant control
              person，持有超过 75% 的股份和投票权，并有权任免董事。高管和任职页面还显示身份验证已完成、英国国籍、居住在英格兰、出生日期为 1985 年 2 月。Roark
              因此不像一家成熟的风险资本支持防务主承包商，更像一个由创始人紧控的运营载体，在搭起广泛公开治理表面之前，就快速做大收入和融资。这本身不构成否决项，但会抬出典型尽调问题：董事会构成、投资人保护、授权机制和关键人依赖。考虑到外部来源报道的融资规模，公开可见董事会名单缺失尤其值得注意。
