      - number: '5.3'
        title: 部署成熟度、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              Roark 有足够公开信号证明产品已越过概念阶段，但不足以证明成熟现场执行。带日期的里程碑从 2023 年末发布文章开始，随后是 2023 年 12 月价格发布，再到 2025 年 1 月 OTC
              扩展文章，后者拓宽了技术故事，并把所有探测系统接入 Plexus。DroneXL 还描述了 30 个美国和 12 个英国 WAMI/HSI
              城市，以及一个招募具备认证、相机和平台访问权限的第三方无人机操作员的试点项目。这些都是有意义的商业化信号，因为它们暗示运营、支持和某种伙伴或承包商网络。即便如此，公开成熟度证明远弱于路线图宽度。已检索到的
              Roark 来源没有发布 uptime、误报率、探测成功率、具名部署引用，或客户运营的集成故事。已检索证据集中唯一劳动力数据点是 2024 年账目备案显示英国平均员工 49
              人；这不能排除承包商或美国团队，但会让全球服务覆盖、WAMI 扩张和复杂技术支持的组合更难仅凭开放来源承销。
