    summary: Roark 公开的产品论点靠信号接入、协议维护、边缘硬件、集成、合法缓解权利和支持组织撑着，但公开材料对这些环节的记录仍不充分。
    data:
      nodes:
        - id: signals
          label: RF / 卫星信号环境
          detail: 前向散射和 RF 输入必须能在现场使用
        - id: protocols
          label: 无人机协议库
          detail: 数据包检测和解密需要持续维护
        - id: edge
          label: 边缘计算硬件
          detail: 端侧 AI 和 FPGA 主张依赖坚固硬件供应
        - id: plexus
          label: Plexus 平台
          detail: 告警和更广泛监测的中央协调点
        - id: imaging
          label: WAMI / HSI 和飞手网络
          detail: 拓宽数据面，但也增加隐私和 QA 负担
        - id: permits
          label: 缓解许可
          detail: 干扰或接管只能在法律授权场景下奏效
        - id: support
          label: 现场服务和操作员支持
          detail: DDaaS、Rapid Deploy 和集成都需要它来维持
      edges:
        - from: signals
          to: edge
        - from: protocols
          to: edge
        - from: edge
          to: plexus
        - from: imaging
          to: plexus
        - from: permits
          to: plexus
        - from: plexus
          to: support
        - from: edge
          to: support
    claimRefs:
      - CE008
      - CE009
      - CE020
      - CE026
      - CE028
      - CE029
      - CE030
      - CE035
      - CE038
      - CE042
      - CE051
      - CE053
      - CE054
      - CE057
      - CE058
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: Roark 在产品打包和定价上最成熟；独立验证性能、信任控制和支持披露的公开成熟度则低得多。
    data:
      columns:
        - 公开成熟度
        - 主要证据
        - 主要限制
      rows:
        - label: WiRED / CRI 硬件界面
          values:
            - 商业上可见
            - 发布、定价和 OTC 交易报道
            - 性能和覆盖距离仍主要来自公司主张
        - label: DDaaS / Rapid Deploy 打包
          values:
            - 商业上可见
            - 公开价格和工作流描述
            - 没有具名客户或 SLA 证据
        - label: Plexus 监测层
          values:
            - 部分可见
            - 行业报道描述实时融合监测
            - 没有公开产品手册、API 或安全文档
        - label: WAMI / HSI 网络
          values:
            - 声称处于扩张阶段
            - DroneXL 报道城市数量和飞手计划
            - 没有公开城市清单、客户清单或 QA 模型
        - label: 集成 / 缓解姿态
          values:
            - 概念上说得通
            - Remote ID、ADS-B、开放架构和获准缓解表述
            - 缺少 Roark 专属测试和授权证据
        - label: 信任 / 合规披露
          values:
            - 单薄
            - 只有官方身份标识和法律页面
            - 看不到隐私、可靠性或认证包
    claimRefs:
      - CE002
      - CE014
      - CE017
      - CE020
      - CE021
      - CE029
      - CE030
