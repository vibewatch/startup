            body: >-
              主要风险并非无法监控，但大多数风险需要管理层会议室里的证据，而不是更多叙事。因此，缓释路径很具体。Roark 可以拿出签署版 cap
              table、投资人文件，以及从已申报配股到所称融资轮次的清晰桥接，来降低披露风险。它可以展示获批测试结果、部署参考、安全数据控制，以及任何资质或供应商池进展，来降低采购和权限风险。它可以说明关键供应商、记录承包商或飞手控制，并证明
              Plexus 与 WAMI/HSI 处理满足隐私和安全预期，来降低整合风险。它只有把这些运营证明同当前流动性、runway
              和权利包披露结合起来，才能降低估值风险。关键投资人姿态是把时间视作风险放大器：如果下一次账目截止日、客户证明或政策资质里程碑过去后仍没有实证，公司就会从披露不足，变成在当前叙事价格下结构性不可承销。
