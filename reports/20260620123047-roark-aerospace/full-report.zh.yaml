      - number: '4.3'
        title: 资本形成与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2025 年末和 2026 年初备案确认，Roark 在首份账目之后没有停留在一个小型、资本单薄的壳里。Companies House 显示，2025 年 3 月 SH01 配发 81 million 股普通股和
              19 million 股优先股，每股 £1.25，现金认购；优先股带有 full-ratchet 反稀释和优先分红权。随后，2025 年 12 月 15 日备案显示 131 股 B 普通股，现金实缴
              £156,963,450；接着 12 月 23 日和 12 月 28 日的资本重组备案大幅改变股份数量和面值；2026 年 4 月备案又以极低的 USD 1,390 增发 20,079 股 B
              普通股。这些都是真实融资活动加资本表工程的强信号，但不等同于完全透明的轮次公告。Nordic9 报道了 $210 million Series B、$1.6 billion 估值和 $260 million
              累计投资，但标注交易待验证。Tracxn 将 Roark 列为 Series B 公司，已融资 $287 million。Resilience 调查称，公司流传了同样的 $210 million 和 $1.6
              billion 标题，但唯一披露的具名交易对手是一个 “US-based investment bank via an SPV”。承销结论是：资本形成显然真实，但当前在手现金、月度
              burn、资金用途计划，以及精确投资人权利包仍明显披露不足。
