      - number: '4.4'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              Roark 的财务证据集在方向上强于其公开叙事，但仍低于后期防务科技承销所需标准。多家数据库跟踪该公司，但 PitchBook 基本被门禁挡住，Crunchbase
              在抓取时被阻断，两条路径都没有在开放网络暴露可用投资人名单或当前运营指标。roark-aerospace.com
              根域也不再提供可工作的页面，让归档快照和第三方报道承担了过多尽调负担。这很重要，因为披露更充分的同行展示了更强披露应是什么样子。Shield AI 公开宣布一轮 $240 million 融资、估值 $5.3
              billion；Motorola 称 D-Fend 将以 $1.5 billion 被收购，预计 2026 年收入 $185 million；Fortem 点名了一笔由 Lockheed 领投的 $25
              million tranche，以及具体后续订单和合同；Axon 和 Dedrone 描述了具体部署和最终用户类别。相比之下，Roark
              仍缺少具名客户、披露积压订单、按产品线拆分的毛利、CAC/payback、当前现金、当前
              burn，以及从备案配股到独角兽标题的透明桥梁。因此，财务结论是混合的，但只有拿到管理层会议室证据才具备可投性：收入质量已足以支持继续工作，利润率路径仍属推测，2025
              年末融资后的资本充足性无法仅凭公开证据评估。
