      - - 模块化、可互操作架构
        - 开放 API 和硬件无关竞争技术栈会削弱硬锁定
        - 中
        - D-Fend 和 Dedrone 公开强调集成，Fortem 则主张集成质量才是真正护城河
        - 验证 Roark API 深度、伙伴生态，以及客户更换传感器时会坏掉什么
      - - 可负担的便携硬件
        - 相比已验证的压制或指挥层，便携探测更容易商品化
        - 高
        - 专业厂商和既有厂商已经覆盖便携、固定、移动和软件主导方案
        - 展示从探测设备走向更高价值数据、C2 或缓解收入的路线图
      - - 进入试点和活动的速度
