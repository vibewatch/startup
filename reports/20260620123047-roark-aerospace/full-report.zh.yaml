  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一套混合变现模式，但不能给出干净收入结构。Roark 自己的归档首页使用 "Drone Detection as a Service | C-UAS as a Service"
              标签，行业报道则同时描述硬件销售和经常性服务供给。sUAS News 发布了标价：Aero-Ark CRI 从 £2,150 ex VAT 起，Aero-Ark WiRED 为 £3,200 ex
              VAT，组合设备 £4,450 ex VAT，Detection as a Service 从每用户每月 £95 ex VAT 起，Rapid Deploy 每天 £185。DroneXL 另称 OTC
              系统税前起价 £4,500，并将其与 Plexus 平台访问绑定；DroneLife 称 Roark 也提供已安装覆盖作为服务。这足以说明，到 2025 年初 Roark
              已在市场销售硬件加服务的混合包，但不足以推断实际 ASP、折扣行为、订阅渗透率、续约画像或合同期限。唯一官方收入披露仍是 2024 年账目，披露营业额 £36.9 million，并明确把 turnover
              定义为英国和美国实体的集团总销售额。这项会计政策很关键：它指向真实销售活动，但也意味着外部投资人无法通过备案拆分英国法律实体收入与更广集团活动，也无法区分硬件、订阅、部署和数据服务各自的贡献。
