      - number: '2.3'
        title: 买家、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              2026 年的采购路径不像缓慢定制的防务采购周期，更像筛选型 marketplace 加验证引擎。美国陆军和 DVIDS 对 Eurosatory
              意向书的报道显示，盟国买家正在明确试图缩短采购和训练周期，把供应商放到士兵反馈面前，并放大有效方案。Defense News 还称，NATO 希望合同能让各国在共同资质流程之后购买或租赁预审系统。AIRCOM 和
              Counter-UAS Europe
              显示了资质流程强调的内容：互操作性、机动与可部署架构、低附带损害的压制手段，以及来自乌克兰实战和公共空间安保的经验。公开供应商材料也把买家地图勾得更清楚。D-Fend、Dedrone/Axon、SRC、Fortem、Leonardo
              DRS 和 DZYNE 都指向反复出现的细分场景：机动力量和军事基地、机场和飞行场、关键基础设施、公共安全组织，以及高关注活动或 VIP
              保护。因此，预算归属按细分场景移动，而不是落在一个泛化防务买家身上：部委和军种掌握战场支出，基础设施运营方掌握场站安保，机场和航空主管机构掌握机场连续性，公共安全组织掌握活动和城市空域风险。Roark
              的服务叙事可能会打动需要持续监测或灵活部署的客户，但它仍必须跨过这些渠道正在制度化的互操作、测试和证明门槛。
