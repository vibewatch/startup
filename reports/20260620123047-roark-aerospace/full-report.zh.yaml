        title: 采购路径正在打开，但更偏向已验证、可互操作的供应商
        blocks:
          - type: paragraph
            body: >-
              对任何可信 C-UAS 供应商来说，2026 年需求侧环境是建设性的。美国陆军和 JIATF-401 正在打造 marketplace，让用户比较已验证系统并放大表现良好的方案；NATO
              正在建立一个既可购买也可租赁的审查池；官方政策文件强调可互操作、开放、能快速测试的解决方案。DHS 给一线响应者和安全机构提供采购工具，并指向世界杯相关拨款支持；FAA 和国土政策材料显示，counter-UAS
              购买和使用仍被法律授权和运营模式严格塑形。对 Roark 而言，这意味着可服务市场可能真实且扩张，但采购成功不应与营销可见度混为一谈。因此，本章结论是平衡的：Roark 的低摩擦 DDaaS 和 Rapid
              Deploy 包装契合新兴买家需求形态，尤其是客户想要可试用或类似租赁覆盖时；但公司缺少具名公开引用，相较那些可能赢得最高要求项目、已验证、可互操作且文档更充分的供应商，仍处于证明不足状态。
