  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录足以否定 Roark 是虚构公司，或 2025 年末融资标题毫无来源的说法；但它还不足以让外部投资人有信心承销标题价格。Companies House 申报显示了真实的资本形成，2025 年 12
              月的实缴条目规模也足够大，使所称融资轮规模具备合理性。与此同时，同一套公开材料仍缺少签署版 cap
              table、完整投资人名册，以及能把合理性转化为价格确定性的权利包。因此，正确判断是继续研究，而不是买入。估值姿态是偏紧绷，但并非自动荒谬：申报链条把 2025 年末标记三角定位到与公开流传的 $1.6
              billion 叙事同一数量级；但唯一已申报运营年度显示毛利为负，当前收入质量仍不透明。落到 IC 层面，Roark 只有在进入纪律明确、治理和稀释条款迅速浮出水面、管理层能证明 2026
              年运营质量明显好于最后一份申报账目所暗示的水平时，才值得继续尽调。
