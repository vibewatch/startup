      - number: '4.2'
        title: 成本结构、营运资本与单位经济
        blocks:
          - type: paragraph
            body: >-
              2024 年备案异常有价值，因为它显示 Roark 报告的收入规模尚未转化为可公开验证的优质单位经济。公司披露营业额 £36.9 million、销售成本 £49.3 million，因此毛利为负 £12.4
              million，随后还有 £3.1 million 管理费用和 £1.07 million 利息成本。资产负债表上，年末现金只有 £6.1 million，存货为 £13.6 million，应收款达到
              £87.1 million，其中 £36.1 million
              在一年以上到期。这些数字指向一家承担实质履约、部署和回款负担的企业，而不是干净的软件单一模式。它们也意味着，公开可见的营运资本消耗大幅超过流动现金。因此，按传统 SaaS 口径讨论 CAC/payback
              不可能，甚至可能误导：Roark 看起来把硬件、现场部署和持续监测服务组合在一起。证据能支持的最佳判断更窄。Roark
              确有真实商业活动，但唯一披露年度显示负毛利、显著应收款堆积、存货敞口，以及很可能超出普通经营现金生成能力的融资需求。任何假设其具备有吸引力的软件式利润率的投资备忘录，都在远远超出证据投射。
