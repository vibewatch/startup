evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-b-investors
    missingEvidence: A cap table, investor announcement, or named participant list for the December 2025 Series B.
    whyItMatters: >-
      Unnamed investors and SPV usage limit confidence in who validated the round and what strategic support came with
      the capital.
    diligencePath: Request the financing data room, signed subscription documents, and board approvals for the December 2025 round.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A reconciled 2025-2026 operating dashboard covering employee count, deployed devices, end users, and countries
      served.
    whyItMatters: >-
      Tracxn, DefenseTech News, and the company's own marketing claims use different founding dates and scale metrics,
      weakening confidence in growth narratives.
    diligencePath: Obtain monthly operating KPIs, customer-install base export, and HR headcount reports by legal entity.
    relatedQuestionRefs:
      - QO019
      - QO020
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A complete board roster, committee structure, and investor governance rights.
    whyItMatters: >-
      Public records show one director and one PSC, but venture rounds of this size usually create board and
      consent-right complexity that affects control and exit.
    diligencePath: Request the latest shareholders' agreement, board consents, and board observer list.
    relatedQuestionRefs:
      - QO008
      - QO017
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: minor
    topic: database-triangulation
    missingEvidence: >-
      Direct licensed access to PitchBook and Crunchbase profile details that may contain investor naming and
      funding-history cross-checks.
    whyItMatters: >-
      Open-web views of major databases were blocked or gated, preventing independent confirmation of valuation and
      investor fields.
    diligencePath: >-
      Use licensed database access or obtain screenshots from the company or investors to validate private-market
      database entries.
    relatedQuestionRefs:
      - QO015
      - QO017
  - type: stale
    severity: minor
    topic: website-disclosure
    missingEvidence: A functioning live corporate website with current leadership, product, and customer disclosure.
    whyItMatters: >-
      The archived site is sparse and the live site was not readily retrievable, which raises diligence friction for
      customers, regulators, and investors.
    diligencePath: Request the latest corporate deck and check the live domain, DNS, and SSL configuration directly with management.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: roark-sam-som
    missingEvidence: >-
      A management-level pipeline model that breaks Roarks addressable spend by segment, geography, deployment model,
      and expected share of recurring service revenue.
    whyItMatters: >-
      Public sources establish that the category is large, but they do not show how much of that spend is realistically
      reachable by Roark rather than by primes or better-documented peers.
    diligencePath: >-
      Request the companys bottom-up pipeline by segment, contract value assumptions, renewal rates, and proof of
      qualified opportunities in 2026 procurement channels.
    relatedQuestionRefs:
      - QM022
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: roark-customer-proof
    missingEvidence: >-
      Named customer references, procurement notices, or case studies that show Roark winning or deploying in the buyer
      segments described here.
    whyItMatters: >-
      Without named proof, it is difficult to convert generic market heat into confidence that Roark can clear the same
      trust and qualification thresholds its peers already advertise.
    diligencePath: >-
      Request customer references, contract award notices, pilot-to-production conversion data, and any trial results
      from allied, airport, infrastructure, or public-safety buyers.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: conflicting-data
    severity: minor
    topic: market-size-denominators
    missingEvidence: >-
      A reconciled market model that separates budget lines, public contract totals, curated system counts, and vendor
      projections into one apples-to-apples framework.
    whyItMatters: >-
      The public numbers all point in the same strategic direction, but they are not directly comparable enough to
      support a single defendable TAM or share forecast on their own.
    diligencePath: >-
      Normalize each sizing source by year, geography, and included spend, then tie the companys specific offering to
      the subset that matches its deployment model.
    relatedQuestionRefs:
      - QM020
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-opacity
    missingEvidence: >-
      Realized contract values, discounting norms, and recurring ASPs for Fortem, Dedrone, D-Fend, DroneShield, and
      Leonardo DRS.
    whyItMatters: >-
      Without realized pricing or contract-value data, it is hard to judge whether Roark is genuinely cost disruptive or
      simply cheaper because it sells a narrower scope.
    diligencePath: >-
      Request anonymized quotes, reseller decks, or procurement awards that reveal scope-adjusted pricing for comparable
      deployments.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: roark-customer-proof
    missingEvidence: Named Roark customers, repeat deployments, renewal behavior, and pilot-to-contract conversion data.
    whyItMatters: >-
      Competitive durability depends on proof that buyers choose and keep Roark in the face of better-capitalized
      alternatives.
    diligencePath: >-
      Obtain customer reference list, deployment map with contract values, and cohort retention or renewal metrics from
      management.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: minor
    topic: switching-cost-quantification
    missingEvidence: Implementation timelines, integration effort, and replacement costs for swapping Roark out of a deployed stack.
    whyItMatters: >-
      The chapter can infer moderate switching costs, but not quantify whether Roark becomes sticky enough to resist
      incumbent displacement.
    diligencePath: >-
      Interview technical operators and integrators on onboarding time, data migration burden, and hardware/API
      dependencies.
    relatedQuestionRefs:
      - QP020
      - QP021
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Signed backlog, top-customer concentration, contract duration, and renewal data.
    whyItMatters: These are necessary to judge revenue durability and sales-efficiency proxies.
    diligencePath: >-
      Request a booked backlog schedule by customer, contract term, and deployment status plus renewal cohorts for any
      recurring service base.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: late-2025-investor-roster
    missingEvidence: >-
      Investor names, subscription agreements, shareholder agreement, and liquidation waterfall terms for the late-2025
      financing.
    whyItMatters: Without them, investors cannot underwrite governance, dilution, or downside protection.
    diligencePath: >-
      Request the full post-round cap table by class, executed subscription documents, and any side letters or
      board-rights agreements.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: Current cash balance, monthly burn, debt-service schedule, and runway scenarios after the late-2025 financing.
    whyItMatters: Capital adequacy is the central unanswered underwriting question in this chapter.
    diligencePath: Request treasury dashboard, monthly cash bridge, covenant schedule, and 12- to 18-month base/downside budget.
    relatedQuestionRefs:
      - QI017
      - QI018
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by stream, CAC, payback, churn, utilization, and service-delivery cost detail.
    whyItMatters: The filed accounts prove revenue but do not support any confident view on margin path or sales efficiency.
    diligencePath: >-
      Request monthly KPI pack with gross margin by product, CAC/payback, churn, deployment utilization, and
      customer-support burden.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A clean reconciliation from filed share-allotment cash amounts to the externally reported $210 million round and
      $260 million to $287 million funding totals.
    whyItMatters: >-
      Valuation and dilution analysis depend on understanding whether public database totals refer to the same round
      perimeter.
    diligencePath: >-
      Request investor presentation, round-close memo, FX assumptions, and a financing chronology tied to each filed
      allotment.
    relatedQuestionRefs:
      - QI013
      - QI014
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: deployment-proof-gap
    missingEvidence: Named DDaaS, Rapid Deploy, Plexus, or WAMI customer references plus a city-by-city coverage list.
    whyItMatters: >-
      Without production references, investors cannot tell whether Roark's service network is broadly deployed,
      selectively active, or still mostly a marketed footprint.
    diligencePath: >-
      Request the top ten live DDaaS or WAMI deployments with site type, start date, contract model, uptime history, and
      customer reference contacts.
    relatedQuestionRefs:
      - QE013
    relatedTableRefs:
      - TE002
      - TE005
  - type: private-evidence-only
    severity: material
    topic: trust-gap
    missingEvidence: >-
      Product-security controls, privacy or data-retention policy, access-control model, and any certification package
      for Plexus or imaging data.
    whyItMatters: >-
      Defense and critical-infrastructure buyers care not only about detection performance but also about who can access
      telemetry and imagery and how the platform is secured.
    diligencePath: >-
      Request trust-center materials, security architecture diagrams, penetration-test summaries, data-retention policy,
      and any ISO, SOC, or export-control documentation.
    relatedQuestionRefs:
      - QE017
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      Detection accuracy, false-positive rates, uptime, MTBF, mean time to deploy, and operator-support KPIs by product
      surface.
    whyItMatters: >-
      A service-led C-UAS product can look compelling in marketing yet fail buyer diligence if reliability and support
      metrics are not measurable.
    diligencePath: >-
      Request independent field-test data, support dashboards, incident logs, and deployment readiness metrics for
      WiRED, CRI, DDaaS, and Rapid Deploy.
    relatedQuestionRefs:
      - QE020
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: architecture-validation
    missingEvidence: >-
      Patents, technical white papers, or customer-accepted test reports validating forward scatter, programmable
      metasurfaces, packet decryption, or edge-LLM claims.
    whyItMatters: >-
      Roark's differentiation narrative rests on technical methods that are only thinly described in public trade
      coverage, making it hard to separate novelty from marketing language.
    diligencePath: >-
      Request patent filings, internal validation decks, red-team results, and third-party lab or government test
      reports for each claimed sensing mode.
    relatedQuestionRefs:
      - QE005
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: mitigation-authority
    missingEvidence: >-
      Jurisdiction-specific legal approvals, partner structure, and safety doctrine for any disruption, takeover, or
      active countermeasure workflow.
    whyItMatters: >-
      Countermeasure authority is highly regulated; without it, marketed detect-track-defeat language may overstate
      where Roark can operate end to end.
    diligencePath: >-
      Request legal memos, operating procedures, partner agreements, and customer examples showing where Roark performs
      only detection versus full mitigation.
    relatedQuestionRefs:
      - QE015
      - QE021
    relatedTableRefs:
      - TE003
      - TE004
