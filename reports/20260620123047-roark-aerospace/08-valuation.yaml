- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Bull thesis
    - Roark may have already cleared a legitimate third-party valuation step-up and could be scaling a service-led C-UAS platform faster than the last filed accounts show
    - December 2025 filings, Nordic9 headline, Tracxn funding total, and large-network narrative all point to real momentum
    - Current revenue mix, customer proof, and signed cap-table disclosure would need to validate the narrative
  - - Base thesis
    - A real financing happened, but public evidence still supports only a discounted range below the circulated headline
    - Primary filings prove cash and cap-table movement, while economics and rights remain thinly disclosed
    - A clean bridge from SH01 filings to current fully diluted ownership could tighten the range upward
  - - Anti-thesis
    - The public headline may overstate current investable value because preference terms, weak gross margin, and opaque proof reduce what common equity is worth
    - March 2025 anti-dilution terms, later preference layers, and negative filed gross profit all argue for skepticism
    - Stronger margin, named customers, and a reconciled rights stack would soften the anti-thesis
  - - Disconfirming signal
    - If management cannot reconcile public funding totals or produce customer-grade validation, the next mark could clear below the narrative range
    - Public figure drift and gated databases leave too much unresolved today
    - A third-party led financing with transparent docs could reset confidence positively
  notes: 'Arguments are deliberately price-sensitive: the same operating story can be investable at one price and unattractive at another.'
