- id: diligence-asks-and-thesis-breakers
  title: Diligence Asks and Thesis-Breakers
  body: 'What moves the call from stretched and research-more toward fair is not another summary article. It is management-room evidence. The fastest unlocks are a signed cap table, a clean rights summary, and current revenue-quality proof showing whether Roark has grown into its narrative or simply engineered a thinly explained valuation step-up. Customer references, deployment counts, renewal behavior, and backlog quality are equally important because this business is being valued as a defense-tech platform rather than as a one-off hardware reseller. The thesis also breaks quickly if the funding-total drift cannot be reconciled, if preference rights subordinate a new investor more than expected, or if 2026 economics remain close to the negative-gross-profit picture visible in the 2024 filing. For a new investor, the decision rule is straightforward: pay up only after the company closes these evidence gaps; otherwise require a material discount to the circulated headline or wait for the
    next priced event to force greater transparency.'
