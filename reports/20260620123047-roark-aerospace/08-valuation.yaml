- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Visible metric
  - Valuation or status
  - Why relevant
  - Limitation vs Roark
  enumerationScope:
    coverage: partial
    basis: Rows cover the best public valuation references retrievable through 20 June 2026 across pure-play counter-UAS, adjacent defense-autonomy startups, strategic M&A, and listed defense companies; they are intentionally mixed because Roark lacks enough direct disclosed peers.
  rows:
  - - Shield AI
    - March 2025 financing
    - $5.3B valuation after $240M round
    - Upper-bound private defense-autonomy benchmark with strategic investors
    - Far stronger autonomy proof and product disclosure than Roark
  - - Epirus
    - March 2025 financing
    - $250M Series D; >$550M total funding
    - Shows counter-drone capital intensity and investor appetite
    - No hard public valuation in cited release
  - - D-Fend Solutions
    - June 2026 M&A
    - Motorola agreed $1.5B acquisition; expected 2026 revenue $185M
    - Best disclosed strategic transaction for a direct category comp
    - Exit price reflects named buyer, deployments, and known revenue base
  - - Dedrone
    - May 2024 M&A
    - Acquired by Axon; price undisclosed
    - Validates strategic buyer appetite for airspace-security platforms
    - No public price multiple
  - - Fortem Technologies
    - April 2026 strategic funding
    - Lockheed invested $25M as initial Series B tranche
    - Signals prime-backed platforms still attract strategic capital
    - No disclosed company valuation
  - - DroneShield
    - June 2026 public market
    - ~$1.77B market capitalization
    - Rare public pure-play counter-UAS valuation reference
    - Public liquidity and disclosure differ sharply from a private UK startup
  - - Leonardo DRS
    - June 2026 public market
    - ~$12.29B market capitalization
    - Shows how much scale and disclosure incumbents bring into the category
    - Not a startup or direct valuation comp
  - - BAE / Northrop / Thales / SAAB / Rheinmetall
    - June 2026 public markets
    - ~$28B to ~$74B market capitalizations, with Lockheed at ~$117.8B and Motorola at ~$65.6B
    - Demonstrate healthy defense-equity appetite in 2026
    - These are broad prime or diversified defense comps, not price anchors for Roark
  notes: Mixed comparables are unavoidable because Roark does not disclose enough current operating data for a tight like-for-like set; strategic M&A and public comps are therefore used mainly as boundary markers.
