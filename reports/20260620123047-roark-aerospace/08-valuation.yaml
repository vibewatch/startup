- id: TV003
  title: Financing context / dilution overhang table
  columns:
  - Event
  - Public fact
  - Why it matters for valuation
  - Residual uncertainty
  rows:
  - - March 2025 SH01
    - 81.0M ordinary plus 19.0M preference shares at £1.25 nominal; preference class includes anti-dilution and preferential dividend status
    - Shows protective investor terms existed before the claimed Series B and can affect effective common-equity value
    - No public bridge from these rights into the later round documents
  - - 15 Dec 2025 SH01
    - 131 B ordinary shares allotted for £156.96M cash
    - Primary evidence that a very large financing event occurred
    - No investor names or round memorandum attached
  - - 23 Dec 2025 SH01
    - Capital base reset to 1.131M shares while preserving £1,131 aggregate nominal value
    - Enables triangulation of implied B-share pricing and post-money order of magnitude
    - Does not alone prove a clean fully diluted cap table
  - - 28 Dec 2025 SH01
    - 221,339 preference shares added with dividend and liquidity preference rights
    - Suggests common-equity downside may differ materially from headline enterprise narrative
    - No public liquidation waterfall or seniority map
  - - 4 Apr 2026 SH01
    - 20,079 B ordinary shares added; total shares rise to 1.372M
    - Confirms further cap-table movement after the headline round window
    - Economic purpose of this issuance is not explained publicly
  - - Databases / media
    - Nordic9 says $210M at $1.6B; Tracxn says $287M total; Resilience highlights the verification gap
    - Shows that the round narrative is widespread but not yet fully management-grade
    - Funding totals and investor identity still drift across sources
  notes: The table emphasizes why dilution, security class, and rights disclosure matter as much as the headline round amount.
