- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Valuation range (USD bn)
  - Core assumptions
  - Probability signal
  - Key downside / upside trigger
  rows:
  - - Bear
    - $0.3-$0.6
    - 2024 filed economics remain directionally current, customer proof stays thin, and preference rights materially subordinate common-equity value
    - Plausible if diligence cannot reconcile funding totals or show margin repair
    - Next mark or secondary clears materially below the late-2025 narrative
  - - Base
    - $0.8-$1.2
    - Late-2025 financing was real and strategic, but current revenue quality, retention, and rights still justify a substantial transparency discount
    - Most defensible public-only range today
