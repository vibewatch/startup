  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-transparency
    missingEvidence: Signed cap table, investor roster, and definitive rights documents for the late-2025 financing.
    whyItMatters: Without them, the headline valuation cannot be underwritten as a clean new-money price or mapped to a new investor's downside protection.
    diligencePath: Request the latest fully diluted cap table, stock purchase agreement, side letters, and liquidation waterfall model from management counsel.
    relatedQuestionRefs:
    - QV006
    - QV028
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: material
    topic: current-operating-quality
    missingEvidence: Current 2026 revenue mix, gross margin bridge, customer retention, and backlog.
    whyItMatters: The only filed revenue year shows negative gross profit, so price support depends on proving a materially improved current operating profile.
    diligencePath: Request 2025 and 2026 monthly management accounts, cohort gross margin by product line, top-customer revenue concentration, and backlog or pipeline conversion data.
    relatedQuestionRefs:
    - QV008
    - QV023
    - QV024
    relatedTableRefs:
    - TV005
    - TV007
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references, deployment counts, and renewal evidence tied to Roark's claimed network scale.
    whyItMatters: A valuation near the circulated headline requires proof that demand quality and deployment repeatability are real rather than purely narrative.
    diligencePath: Request a customer reference list, signed reference calls, deployment volumes, and churn or renewal metrics by product and geography.
    relatedQuestionRefs:
    - QV013
    - QV023
    - QV029
    relatedTableRefs:
    - TV007
  - type: conflicting-data
    severity: material
    topic: funding-total-drift
    missingEvidence: Reconciliation of the €57.6M, $210M, $260M, and $287M public funding figures.
    whyItMatters: Funding totals anchor valuation history and dilution math; unresolved drift makes scenario analysis noisier and can hide structure changes.
    diligencePath: Request a round-by-round financing history with dates, securities issued, proceeds received, and post-money values reconciled to every Companies House SH01.
    relatedQuestionRefs:
    - QV010
    - QV028
    - QV011
    relatedTableRefs:
    - TV003
    - TV004
