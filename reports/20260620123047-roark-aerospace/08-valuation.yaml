  - - Bull
    - $1.4-$1.8
    - December 2025 mark was legitimate, current 2026 economics improved sharply, and named customers plus repeat deployments validate network claims
    - Requires multiple diligence items to turn from speculative to credible
    - Signed cap table, margin proof, and customer validation shift the call materially upward
  notes: Scenario values are analyst ranges, not observable marks. They are anchored to filing math, disclosed economics, strategic-transaction context, and public counter-UAS valuation references.
