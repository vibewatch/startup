- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and rights
    - Signed fully diluted cap table, SPA, side letters, and liquidation waterfall
    - Needed to translate a headline valuation into actual downside protection and ownership economics
    - Company counsel and lead investor documents
  - - Current operating quality
    - 2025-2026 management accounts, revenue mix, gross margin bridge, and cash runway
    - Needed to know whether the 2024 negative gross-profit profile has been structurally repaired
    - CFO package and board reporting
  - - Customer proof
    - Named customers, deployment counts, renewal rates, and backlog by segment
    - Needed to validate that network and service-scale claims support the price
    - Sales leadership references plus customer calls
  - - Funding history reconciliation
    - Round-by-round financing history matched to every SH01 and database figure
    - Needed to reconcile $210M, $260M, $287M, and €57.6M public references
    - Finance team reconciliation memo
  - - Governance surface
    - Board composition, reserved matters, and any SPV governance features
    - Needed to assess control, reporting discipline, and follow-on process quality
    - Legal diligence plus governance documents
  notes: Each ask is required to move the recommendation materially upward; none is cosmetic.
