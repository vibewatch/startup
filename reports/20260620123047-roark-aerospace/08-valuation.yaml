- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Cap-table opacity persists
    - Management cannot provide signed cap table and rights summary in diligence
    - Price support remains narrative-heavy and downside protection cannot be mapped
    - Do not advance at the circulated headline
  - - Funding totals stay unreconciled
    - Public and management figures on capital raised still conflict after diligence
    - Weakens confidence in dilution math and governance discipline
    - Reset to track or avoid until reconciled
  - - Current economics resemble filed 2024 profile
    - Gross margin and cash conversion remain poor in 2026 data
    - Undercuts premium-multiple logic and pushes toward bear range
    - Require a materially lower price or stop
  - - Customer proof is absent
    - No named references, renewal data, or validated deployment counts
    - Bull case loses the operating proof needed to justify high valuation
    - Assume base or bear only
  - - Rights stack is more senior than expected
    - Preference waterfall or side letters materially impair common-equity outcomes
    - Even correct enterprise value could overstate what new equity is buying
    - Reprice or structure protective terms
  notes: These are investment-process kill criteria, not operating forecasts; each trigger is designed to be monitorable within diligence.
