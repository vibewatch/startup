- id: comparable-set-and-scenario-range
  title: Comparable Set and Scenario Range
  body: 'Comparable evidence supports caution rather than exuberance. Shield AI and Epirus show that defense-autonomy and counter-drone platforms can command very large private financings, but both companies disclose deeper product proof and strategic-backer detail than Roark does today. The sharpest usable pricing comp in the set is Motorola''s acquisition of D-Fend: a $1.5 billion price for a business expected to produce $185 million of 2026 revenue, or about 8.1x forward revenue. That multiple already prices meaningful growth and strategic scarcity, yet D-Fend comes with disclosed deployments and a named buyer. DroneShield gives a rare public pure-play read-through at about $1.77 billion of public market capitalization in June 2026, while Leonardo DRS and the large defense primes remind the reader that public defense appetite is healthy but concentrated in much larger, better-disclosed operators. On that backdrop, a bull case near the circulated Roark headline is conceivable only if management
    can prove that today''s economics and customer proof are far ahead of the last filed accounts. The more defensible public-only posture is a base range centered below the headline and a wide bear-to-bull spread that explicitly prices uncertainty.'
