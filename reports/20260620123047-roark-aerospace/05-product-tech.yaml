  name: Roark Aerospace
chapter:
  number: 5
  title: Product & Technology
  summary: Roark's public product surface supports a real multi-modal counter-UAS offer built around Aero-Ark sensors, DDaaS/Rapid Deploy service models, and the Plexus monitoring platform. Trade coverage and archived first-party pages show a layered RF, edge-compute, and imaging story, but the deepest technical claims around range, protocol coverage, autonomous response, city-scale coverage, and trust controls remain company-claimed or only thinly corroborated. Against better-documented peers, Roark looks differentiated on low-friction service packaging more than on publicly validated reliability, integration depth, or compliance disclosure.
sections:
- id: product-surface-and-customer-workflow
  title: Product Surface and Customer Workflow
  body: 'The strongest evidence says Roark is selling a service-led counter-UAS package rather than a single detector SKU. The archived homepage positioned the company as "Drone Detection as a Service | C-UAS as a Service," and two independent drone-trade outlets described Aero-Ark hardware, DDaaS seats, and Rapid Deploy engagements with explicit public pricing. Across those sources, the core commercial motion is consistent: a customer either buys or temporarily deploys Aero-Ark hardware, or buys monitoring coverage as a service, and then receives airspace alerts through the Plexus platform. The same sources also place WAMI and hyperspectral imaging beside the airspace product, which implies Roark wants to sell a broader monitoring stack rather than pure RF detection. What remains thin is deployment proof. The evidence shows product packaging, form factors, and commercial intent, but it does not yet show named operating sites, live DDaaS city lists, or customer outcomes that would confirm
    how much of the network is production versus market-facing roadmap.'
