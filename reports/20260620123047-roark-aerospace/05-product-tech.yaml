  rows:
  - - Aero-Ark WiRED
    - Base / site security operator
    - Publicly marketed and priced
    - Forward-scatter sensing, satellite-informed signal inputs, FPGA-backed edge AI claims
    - Need independent field tests, false-positive data, and BOM/supplier detail
  - - Aero-Ark CRI
    - Security / airspace operator
    - Publicly marketed and priced
    - RF scan plus packet analysis across 2.4/5.8 GHz and claimed SATCOM/LTE/LoRa coverage
    - Need validation of protocol coverage, decryption breadth, and real-world range
  - - Combined WiRED + CRI
    - Integrated buyer needing wider coverage
    - Publicly priced bundle
    - Combines sensing modes in one package and supports portable or fixed setups
    - Need install model, attach rates, and support burden
  - - Detection as a Service
    - Customer wanting coverage without owned hardware
    - Commercially offered, scope still opaque
    - Low-friction monthly entry point and network-based coverage story
    - Need named covered cities, SLA terms, and active customer count
  - - Rapid Deploy
    - Event, incident, or temporary-site user
    - Commercially offered service
    - Day-rate deployment reduces upfront capex and supports short-notice missions
    - Need crew model, utilization proof, and mobilization economics
  - - Plexus + WAMI / HSI
    - Operator needing broader surveillance context
    - Capability claimed; pricing and proof thin
    - Combines airspace alerts with ground imagery and partner-pilot network claims
    - Need product documentation, data-rights model, retention policy, and named use cases
