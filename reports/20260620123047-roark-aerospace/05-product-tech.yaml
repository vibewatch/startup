- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Forward-scatter / satellite-informed sensing
    - Claims long-range or topology-resilient detection for WiRED
    - Access to consistent RF environment, satellite signal inputs, and tuned models
    - No public validation of range, clutter handling, or repeatability
  - - RF scan + packet analysis
    - Detects and identifies drone-control signals and packets
    - Protocol libraries, decryption capability, and evolving drone firmware knowledge
    - Coverage and decryption claims may age quickly without continuous updates
  - - ADS-B / Remote ID / passive radar inputs
    - Adds broader situational picture beyond one RF method
    - Third-party broadcasts, remote-ID adoption, and passive-sensing quality
    - Performance is environment dependent and mostly described by trade press
  - - On-device compute / FPGA edge layer
    - Runs classification and local processing before or alongside network coordination
    - Specialized hardware, model maintenance, and software update discipline
    - No public benchmark on latency, throughput, or model accuracy
  - - Plexus platform
    - Exposes alerts, data fusion, and operator workflow
    - Reliable networking, UI/UX, storage, and integration model
    - No public security, API, or resilience documentation in retrieved sources
  - - Optional disruption / countermeasure path
    - Supports permitted defeat actions and manual or automated response
    - Legal authorizations, safe-operating doctrine, and partner or hardware effectors
    - No public evidence showing where Roark is licensed or tested to perform mitigations
  notes: Architecture rows blend company-claimed layers with inferred operating dependencies; unsupported technical proof is flagged as risk rather than treated as fact.
