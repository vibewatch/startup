  evidenceGaps:
  - type: missing-source
    severity: material
    topic: deployment-proof-gap
    missingEvidence: Named DDaaS, Rapid Deploy, Plexus, or WAMI customer references plus a city-by-city coverage list.
    whyItMatters: Without production references, investors cannot tell whether Roark's service network is broadly deployed, selectively active, or still mostly a marketed footprint.
    diligencePath: Request the top ten live DDaaS or WAMI deployments with site type, start date, contract model, uptime history, and customer reference contacts.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE002
    - TE005
  - type: private-evidence-only
    severity: material
    topic: trust-gap
    missingEvidence: Product-security controls, privacy or data-retention policy, access-control model, and any certification package for Plexus or imaging data.
    whyItMatters: Defense and critical-infrastructure buyers care not only about detection performance but also about who can access telemetry and imagery and how the platform is secured.
    diligencePath: Request trust-center materials, security architecture diagrams, penetration-test summaries, data-retention policy, and any ISO, SOC, or export-control documentation.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Detection accuracy, false-positive rates, uptime, MTBF, mean time to deploy, and operator-support KPIs by product surface.
    whyItMatters: A service-led C-UAS product can look compelling in marketing yet fail buyer diligence if reliability and support metrics are not measurable.
    diligencePath: Request independent field-test data, support dashboards, incident logs, and deployment readiness metrics for WiRED, CRI, DDaaS, and Rapid Deploy.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: architecture-validation
    missingEvidence: Patents, technical white papers, or customer-accepted test reports validating forward scatter, programmable metasurfaces, packet decryption, or edge-LLM claims.
    whyItMatters: Roark's differentiation narrative rests on technical methods that are only thinly described in public trade coverage, making it hard to separate novelty from marketing language.
    diligencePath: Request patent filings, internal validation decks, red-team results, and third-party lab or government test reports for each claimed sensing mode.
    relatedQuestionRefs:
    - QE005
    - QE008
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: mitigation-authority
    missingEvidence: Jurisdiction-specific legal approvals, partner structure, and safety doctrine for any disruption, takeover, or active countermeasure workflow.
    whyItMatters: Countermeasure authority is highly regulated; without it, marketed detect-track-defeat language may overstate where Roark can operate end to end.
    diligencePath: Request legal memos, operating procedures, partner agreements, and customer examples showing where Roark performs only detection versus full mitigation.
    relatedQuestionRefs:
    - QE015
    - QE021
    relatedTableRefs:
    - TE003
    - TE004
