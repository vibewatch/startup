  title: Roark's clearest wedge is service packaging around a layered detection story
  body: Public evidence consistently shows Roark wrapping Aero-Ark hardware, Plexus monitoring, and optional deployment services into low-friction commercial offers such as DDaaS and Rapid Deploy. That packaging is more distinctive than any currently verified breakthrough in raw technical performance.
  claimRefs:
