  - CE014
  - CE019
  - CE020
  - CE024
- calloutType: risk
  title: The technical narrative is broader than the public proof set
  body: Range, protocol coverage, city-scale footprint, autonomous response, privacy controls, and reliability metrics are all central to Roark's product story, yet the retrieved evidence set does not publish the test reports, named deployments, or trust artifacts that would let an investor treat those claims as independently verified operating proof.
