- id: deployment-maturity-support-and-roadmap
  title: Deployment Maturity, Support, and Roadmap
  body: Roark has enough public signals to argue that the product moved beyond concept stage, but not enough to prove mature field execution. The dated milestone trail starts with a late-2023 launch article, then a December 2023 price release, then a January 2025 OTC expansion article that broadened the technical story and tied all detection systems into Plexus. DroneXL also described 30 U.S. and 12 U.K. WAMI/HSI cities and a pilot program that recruits third-party drone operators with certifications, cameras, and platform access. Those are meaningful commercialization signals because they imply operations, support, and some form of partner or contractor network. Still, public maturity proof is much weaker than the roadmap breadth. No retrieved Roark source published uptime, false-positive rates, detection success rates, named deployment references, or a customer-operated integration story. The only workforce datapoint in the retrieved evidence set is the 2024 accounts filing showing 49
    average UK employees, which does not rule out contractors or a U.S. team but does make the combination of global service coverage, WAMI expansion, and complex technical support harder to underwrite from open sources alone.
