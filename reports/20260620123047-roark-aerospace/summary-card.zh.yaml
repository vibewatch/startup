  topStrengths:
    - 官方文件支撑其真实运营质地，包括成立仅一年后 FY2024 £36.9M 营业额和 £79.3M 净资产。
    - 产品证据支持 Aero-Ark 加 Plexus counter-UAS 栈真实存在，并通过硬件和服务两种包装销售。
    - 2025 年 3 月至 2026 年 4 月的文件证明公司完成了实质资本形成并仍能获得融资，而不是纯宣传式融资故事。
    - 2026 年，防务、安保和关键基础设施领域的 counter-UAS 需求和采购活动都在扩张。
  topRisks:
    - 所称 $1.6B 估值和 $210M Series B 缺少清晰公开投资者名单、签署版股权结构桥和完整透明权利包。
    - 公开证据仍没有指向具名量产客户或强独立部署验证。
    - FY2024 账目显示毛利为负、应收账款高、库存可观，且相对于复杂资产负债表，披露现金有限。
    - 在准入受管制的防务市场，买方越来越要求可验证信任信号；Roark 的治理、合规、供应商和安全披露仍偏薄。
  unresolvedGaps:
    - 2025 年末融资的签署版股权结构表、投资者名单和完整优先权桥。
    - 具名客户引用、量产部署证据，以及集中度 / 留存指标。
    - 截至 2025 年 11 月 30 日的账目、当前现金跑道，以及 FY2024 后毛利质量改善的证明。
    - 适用于防务和公共安全采购的出口管制、安全供应和数据安全文件。
