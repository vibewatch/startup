callouts:
- calloutType: strength
  title: Official filings establish substance even where marketing transparency is weak
  body: Roark's open-web narrative is thin, but Companies House filings provide hard evidence of a real operating business with meaningful 2024 turnover, significant assets, debt, and repeated share allotments around the alleged Series B window. That is materially stronger than a pure slideware startup profile.
  claimRefs:
  - CO012
  - CO014
  - CO016
  - CO017
  - CO018
  - CO020
- calloutType: risk
  title: The unicorn story outruns the public proof set
  body: The biggest problem is not whether Roark exists; it clearly does. The problem is that investor identities, customer names, board composition, and the exact bridge from filed share allotments to a $1.6 billion post-money valuation remain under-explained in the public record, leaving late-stage underwriting dependent on management-only evidence.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO035
  - CO039
