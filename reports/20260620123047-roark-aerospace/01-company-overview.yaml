- id: verification-gaps-and-diligence-risks
  title: Verification Gaps and Diligence Risks
  body: The main diligence problem is not that Roark lacks any evidence; it is that the strongest evidence and the boldest claims live in different layers of the record. Official filings substantiate incorporation, founder control, operating revenue, debt, and multiple post-incorporation capital events. But the headline venture narrative — 55,000 deployed devices, 3,000 end users, 244 employees, a $210 million Series B, and a $1.6 billion valuation — is supported primarily by Tracxn, trade press, and a partially paywalled critical article rather than by open investor or customer disclosure. Resilience explicitly framed Roark as a “defence unicorn no one can verify,” while the archived site exposed only minimal marketing copy and identifiers. In a sector where sophisticated peers like DroneShield and Shield AI publish regular investor materials and more complete product narratives, Roark's disclosure profile remains materially below what a late-stage defense-tech investor would prefer. For
    later chapters, the working assumption should be that Roark is real, commercially active, and well-funded, but that many scale and customer claims require management-room verification before they should influence underwriting.
  claimRefs:
  - CO023
