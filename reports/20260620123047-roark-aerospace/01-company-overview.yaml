company:
  name: Roark Aerospace
chapter:
  number: 1
  title: Company Overview
  summary: 'Roark Aerospace is a very young UK counter-drone company whose filings nonetheless show real operating activity: a November 2023 incorporation, £36.9 million of 2024 turnover, and rapid capital-structure changes around late 2025 and early 2026. The core diligence tension is that official filings substantiate meaningful revenue, assets, and financing activity, while the company''s largest public scale and valuation claims remain thinly disclosed and only partially independently verified.'
sections:
- id: identity-and-footprint
  title: Identity and Footprint
  body: Roark Aerospace's public identity is unusually compressed for a company claiming billion-dollar scale, but the official record is clear on the legal shell. Companies House lists RO-ARK AEROSPACE LIMITED as an active private limited company incorporated on 30 November 2023, with registered office at Monomark House, 27 Old Gloucester Street, London, WC1N 3AX. The archived legal page adds a Cambridge Science Park address and a New York office, implying a more distributed operating footprint than the single UK filing might suggest, while the archived homepage advertises NATO NCAGE, UEID, DUNS, and VAT identifiers. Taken together, the official and archived records support the conclusion that Roark was organized quickly for defense-adjacent commercial activity, maintained at least a UK-Cambridge-U.S. footprint in marketing materials, and wanted to signal procurement readiness to allied government buyers very early in its life cycle. Cushman & Wakefield's Q1 2026 marketbeat reference to
    a 13,650-square-foot Cambridge lease is the strongest independent corroboration that the Cambridge presence was more than a vanity address.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO007
  - CO030
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: leadership-and-control
  title: Leadership, Founder Control, and Governance
  body: Public governance disclosure is concentrated around a single individual. Companies House shows Patton Atkinson-French as the only active director, appointed on incorporation day, and the sole person with significant control through more than 75% ownership of shares and voting rights plus the right to appoint or remove directors. The officer and appointments pages also show identity verification complete, British nationality, England residence, and February 1985 date of birth. This makes Roark look less like a mature venture-backed defense prime and more like a tightly founder-controlled operating vehicle that scaled revenue and financing rapidly before building a broad public governance surface. That is not disqualifying by itself, but it raises classic diligence questions around board composition, investor protections, delegated authority, and key-person dependence. The absence of a publicly visible board roster is especially notable given the size of the financing claims reported
    by external sources.
  claimRefs:
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO002
  - TO003
- id: business-model-and-product-positioning
  title: Business Model and Product Positioning
  body: Roark's own and third-party materials consistently describe an integrated airspace-defense network rather than a single detector or effector. The archived homepage used the label “Drone Detection as a Service | C-UAS as a Service,” while the 2024 accounts said the company was principally engaged in the manufacture and service deployment of drone detection systems, counter-drone systems, and unmanned vehicles. DroneXL added operational texture in January 2025, saying Aero-Ark systems combined ADS-B, Remote ID, DJI packet collection and decryption, passive radar, and edge-AI classification; the same report said Roark was extending WAMI and hyperspectral-imaging coverage via a Plexus platform. Global Defense Tech News similarly described unified sensors, counter-drone tools, and decision support deployed across land, air, and maritime environments. The common thread is a services-led architecture that bundles sensing, mapping, analytics, and command software, which is strategically
    sensible in a market increasingly rewarding integrated command-and-control and recurring monitoring contracts. The challenge is that most of the technical specificity still sits in secondary writeups rather than in first-party engineering documentation.
  claimRefs:
  - CO006
  - CO011
  - CO027
  - CO028
  - CO029
  - CO040
  figureRefs:
  - FO002
- id: funding-financial-profile-and-milestones
  title: Funding, Financial Profile, and Milestones
  body: 'Roark''s filings are stronger than its press coverage on one crucial point: the company was not a shell at the end of 2024. Its filed accounts reported £36.9 million of turnover, £79.3 million of net assets, 49 average UK-based employees, and a £16.6 million pre-tax loss for the year ended 30 November 2024, while also disclosing a £16.42 million bond due in March 2029. Meanwhile, the filing history shows a rapid financing arc: a large 13 March 2025 share allotment, a 15 December 2025 B-ordinary filing with £156.96 million paid for cash, and subsequent December 2025-January 2026-April 2026 cap-table adjustments. Those official filings do not themselves prove a $1.6 billion valuation, but they do confirm material capital formation around the dates third-party outlets discussed. Nordic9 and Resilience both reported a $210 million late-2025 Series B and a $1.6 billion implied valuation, but Nordic9 explicitly marked the deal as pending verification and Resilience emphasized the absence
    of transparent investor disclosure. The cleanest conclusion is that Roark almost certainly closed a significant financing event in late 2025, yet the precise investor roster, round structure, and valuation math remain under-documented in the public domain.'
