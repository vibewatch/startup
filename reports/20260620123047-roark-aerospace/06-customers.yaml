- id: procurement-pathways-and-verdict
  title: Procurement Pathways Are Opening, but They Favor Validated and Interoperable Vendors
  body: 'Demand-side context is constructive for any credible C-UAS vendor in 2026. The U.S. Army and JIATF-401 are building marketplaces that let users compare validated systems and scale the ones that perform, NATO is creating a vetted pool with both purchase and lease options, and official policy documents emphasize interoperable, open, and rapidly testable solutions. DHS is giving first responders and security agencies a purchasing tool and pointing to World Cup-related grant support, while FAA and homeland-policy materials show that counter-UAS buying and use remain tightly shaped by legal authorities and operating models. For Roark, that means the addressable market may be real and expanding, but procurement success should not be confused with marketing visibility. The chapter verdict is therefore balanced: Roark''s low-friction DDaaS and Rapid Deploy packaging fit the shape of emerging buyer demand, especially where customers want trialable or lease-like coverage, yet the company''s
    lack of named public references leaves it under-proven relative to the validated, interoperable, and better-documented vendors likely to win the most demanding programs.'
