- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Government / military
    - Installation or unit operators / security staff / defense budget owner
    - Base or operational-area detection and response
    - Supported by positioning and 2026 marketplace context, but no named Roark account
    - Potentially highest-value segment because validated procurement channels are scaling
    - No named buyer or program-of-record evidence
  - - Public safety / homeland security
    - Police or first responders / operators / grant or agency budget owner
    - Unauthorized-drone detection around civic assets, incidents, or events
    - Supportable from DHS/FAA buyer materials and Roark service packaging
    - Could benefit from grants and low-friction service adoption
    - No named police, airport, or public-safety deployment
  - - Critical infrastructure
    - Security or operations leaders / monitoring staff / facility budget owner
    - Persistent monitoring of ports, utilities, industrial assets, or campuses
    - Supportable from the product narrative, but not by named accounts
    - Recurring monitoring can be strategically valuable if contracts renew
    - No public infrastructure reference customer or SLA evidence
  - - Temporary event security
    - Venue or incident-security lead / contracted operators / event budget owner
    - Short-term rapid deployment during events or temporary threats
    - Directly supported by the Rapid Deploy model
    - Could shorten sales cycles and create referenceable short-duration wins
    - No named event deployment or repeat-booking evidence
  - - Urban monitoring / wider surveillance
    - Coverage-network managers / pilots and analysts / service or data budget owner
    - DDaaS plus WAMI/HSI coverage in cities with third-party pilot support
    - Supported by city-count claims and pilot-program reporting
    - Could create a broad surface for managed-service upsell if real
    - No city roster, named paying-customer list, or utilization metrics
  notes: Rows describe supportable buyer archetypes rather than named customers because the public record does not identify a confirmed Roark account.
