  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, reseller/channel mix, and concentration covenants.
    whyItMatters: A small number of opaque accounts could drive outsized revenue or policy risk, but concentration cannot be quantified from public evidence.
    diligencePath: Request customer revenue concentration table, channel contribution by partner, and any material-customer disclosures from board or lender packages.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: adoption-counts
    missingEvidence: A reconciled operating dashboard that explains 70-city, 100-city, 30-plus-12-city, 3,000-end-user, and 55,000-device claims.
    whyItMatters: Different footprint claims may reflect different products or time frames, but without reconciliation they cannot be used as hard operating metrics.
    diligencePath: Request a dated bridge from public footprint claims to active paying accounts, active sites, mapped cities, and deployed devices.
