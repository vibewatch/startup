  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, churn, renewal-rate, contract-term, and SLA data by segment.
    whyItMatters: Customer durability drives valuation far more than top-of-funnel reach, and the public record does not show whether Roark renews or expands profitably.
    diligencePath: Request cohort tables, renewal waterfalls, standard contract templates, and redacted renewal notices.
    relatedQuestionRefs:
    - QU012
    - QU013
