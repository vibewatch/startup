- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - DDaaS and Rapid Deploy lower entry friction
    - Low-friction entry may create many small pilots without durable renewals
    - Can inflate surface-level adoption claims without proving long-lived revenue
    - Review pipeline by stage, renewal conversion, and pilot-to-production rates
  - - Validated U.S. and NATO marketplaces could widen buyer access
    - Validated marketplaces may also concentrate demand in vendors with better proof and interoperability credentials
    - Roark could face qualification friction despite real demand growth
    - Request Roark test results, interoperability mappings, and marketplace status
  - - Public-safety grants and homeland-security tooling expand the buyer set
    - Authorities and legal constraints can limit who may actually use mitigation capabilities
    - Some apparent customers may only buy detection or may need contractors
    - Map each target segment to legal authority and approved operating model
  - - Urban monitoring and pilot-network expansion could broaden footprint
    - No public data shows which cities or users convert into recurring contracts
    - Coverage claims may overstate monetized adoption
    - Request paying-account counts, active sites, and revenue by use case
  - - Opaque customer mix hides top-account dependence
    - No public disclosure quantifies top-customer or channel concentration
    - A small number of accounts could drive outsized revenue or policy risk
    - Request top-10 customer revenue share, reseller mix, and concentration covenants
  notes: The chapter can identify plausible expansion paths, but public evidence is not strong enough to quantify customer concentration or repeat economics.
