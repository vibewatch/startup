chapter:
  number: 6
  title: Customers
  summary: Roark's public customer evidence supports several plausible buyer archetypes—government and military users, public-safety and security operators, critical-infrastructure owners, temporary-event buyers, and broader monitoring users—but it does not identify a named production customer. Demand-side procurement conditions for counter-UAS are improving in 2026, yet Roark's disclosure on named accounts, retention, and concentration remains materially weaker than better-documented peers.
sections:
- id: buyer-archetypes-and-segmentation
  title: Buyer Archetypes Are Visible Even Though Named Accounts Are Not
  body: 'The strongest public evidence says Roark is selling into buyer problems, not publicly referenceable accounts. The archived homepage and legal page establish a UK and US operating surface and position the company around Drone Detection as a Service and C-UAS as a Service. Trade coverage then fills in the commercial motion: Aero-Ark hardware can be bought directly, Detection as a Service offers monthly coverage, and Rapid Deploy offers short-term use for temporary needs. That combination supports several likely payer groups, including government or military users, public-safety and security operators, critical-infrastructure owners, temporary-event buyers, and broader monitoring customers. It also shows a deliberate attempt to lower onboarding friction through pricing and service packaging. What the record still does not do is identify a ministry, airport, police department, venue, or enterprise account that is definitely paying Roark today. The segmentation picture is therefore credible
    at the archetype level but thin at the named-customer level that an investor would normally want before underwriting durability.'
