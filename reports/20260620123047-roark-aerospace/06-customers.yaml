  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named Roark customer references, deployment site identifiers, and contract awards or case studies.
    whyItMatters: Without named references, the chapter cannot distinguish marketing reach from production adoption quality or verify segment fit by account.
    diligencePath: Request three live customer references across government/public-safety/private segments plus underlying contract or award documents.
    relatedQuestionRefs:
