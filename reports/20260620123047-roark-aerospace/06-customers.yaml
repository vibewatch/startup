figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Maps the buyer problems Roark appears to target, from incident-driven deployment to persistent networked coverage.
  data:
    items:
    - label: Government / military
      detail: Force-protection threat -> evaluate interoperable C-UAS option -> seek validated marketplace path -> deploy only if standards and testing clear
    - label: Public safety
      detail: Unauthorized drone or event concern -> review legal authority and grant path -> compare vendor capabilities -> buy detection or contractor-assisted coverage
    - label: Critical infrastructure
      detail: Persistent site-monitoring need -> compare low-friction managed coverage versus owned hardware -> deploy if operations and authority align
    - label: Temporary event security
      detail: Short-duration security need -> favor Rapid Deploy day-rate service -> use for event or incident window -> decide whether to repeat
    - label: Urban monitoring / data network
      detail: Need wider city coverage or imagery -> add pilot or sensor support -> use Plexus-linked data surface -> seek recurring utilization
  approximationNotes: This journey map synthesizes supportable buyer problems in public sources; it is not a disclosed internal Roark sales process.
