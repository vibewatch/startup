  - Limitation vs Roark thesis
  rows:
  - - Roark Aerospace
    - Direct peer / service-led challenger
    - Public OTC hardware and service pricing; private scale claims still disputed
    - Defense, public safety, and commercial monitoring buyers seeking lower-friction entry
    - DDaaS / C-UASaaS framing with explicit entry pricing and managed-service option
    - Thin named-customer proof and weaker public deployment validation than peers
  - - Shield AI
    - Adjacent autonomy platform
    - March 2025 $240M round at $5.3B valuation
    - OEMs, governments, robotics and defense integrators
    - Mission autonomy software and developer tooling in contested environments
    - Closer to autonomy infrastructure than to low-cost detection services
  - - Epirus
    - Directed-energy specialist
    - March 2025 $250M Series D; total venture funding above $550M
    - Layered short-range air defense, critical assets, military formations
    - High-power microwave effectors and air-domain awareness
    - Different control point; less direct substitute for Roark detection services
  - - D-Fend Solutions
    - Direct specialist
    - Dec 2024 $31M growth financing; Motorola agreed $1.5B acquisition in 2026
    - Government, public safety, airports, critical infrastructure
    - RF cyber takeover with safe landing, open API, and continuity emphasis
    - Quote-based enterprise sale rather than transparent low-end entry pricing
  - - Dedrone / Axon
    - Direct specialist with ecosystem backing
    - Hundreds of customers; now inside Axon public-safety platform
    - Public safety, airports, utilities, military, correctional, critical infrastructure
    - AI-driven airspace C2, 30+ integrations, hardware-agnostic stack
    - Less explicit public pricing; depends on platform and integration scope
  - - Fortem Technologies
    - Integrated specialist
    - Lockheed $25M 2026 investment; validated orders from allies and critical-infrastructure contracts
    - Military, infrastructure, airports, world-class venues, government
    - Integrated radar, interceptor, and software suite with operational capture proof
    - Likely heavier and more programmatic than Roark's entry-level offer
  - - DroneShield
    - Public-market specialist
    - Publicly listed pure-play; trusted by 34+ government agencies per homepage
    - Government, military, fixed-site and mobile defense buyers
    - Counter-UxS product breadth across software, fixed-site, and on-the-move kits
    - Public-market IR helps credibility, but official list pricing is still opaque
  - - Leonardo DRS
    - Incumbent / prime-scale integrator
    - $3.6B revenue, $8.7B backlog, 7,300 employees
    - DoD, allied militaries, maritime, maneuver and base-defense buyers
    - Program-level scale, layered defeat, and broader defense relationships
    - Far broader enterprise than Roark; not optimized for ultra-low-friction trials
  - - DZYNE / SRC
    - Incumbent-style alternatives
    - DZYNE says fielded in 50+ countries; SRC says it has developed C-UAS since 2005
    - Military, airports, VIP, infrastructure, fixed/mobile deployments
    - Layered, mission-ready systems with established defense relevance
    - Less evidence of Roark-style managed-service or city-coverage packaging
  notes: Rows compare public proof of scale, buyer focus, and differentiation; absence of list pricing or named customers reflects what the cited sources do and do not disclose.
