  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-opacity
    missingEvidence: Realized contract values, discounting norms, and recurring ASPs for Fortem, Dedrone, D-Fend, DroneShield, and Leonardo DRS.
    whyItMatters: Without realized pricing or contract-value data, it is hard to judge whether Roark is genuinely cost disruptive or simply cheaper because it sells a narrower scope.
    diligencePath: Request anonymized quotes, reseller decks, or procurement awards that reveal scope-adjusted pricing for comparable deployments.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: material
    topic: roark-customer-proof
    missingEvidence: Named Roark customers, repeat deployments, renewal behavior, and pilot-to-contract conversion data.
    whyItMatters: Competitive durability depends on proof that buyers choose and keep Roark in the face of better-capitalized alternatives.
    diligencePath: Obtain customer reference list, deployment map with contract values, and cohort retention or renewal metrics from management.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: switching-cost-quantification
    missingEvidence: Implementation timelines, integration effort, and replacement costs for swapping Roark out of a deployed stack.
    whyItMatters: The chapter can infer moderate switching costs, but not quantify whether Roark becomes sticky enough to resist incumbent displacement.
    diligencePath: Interview technical operators and integrators on onboarding time, data migration burden, and hardware/API dependencies.
    relatedQuestionRefs:
    - QP020
    - QP021
