- id: distribution-switching-costs-and-trust
  title: Distribution, Switching Costs, and Trust
  body: 'Competitive durability in counter-UAS is increasingly about channels and proof, not just sensors. Motorola''s planned $1.5 billion acquisition of D-Fend and Axon''s acquisition of Dedrone pull two specialists into much larger public-safety ecosystems. Lockheed Martin''s investment in Fortem and Fortem''s related critical-infrastructure and allied-order announcements show how prime relationships can accelerate deployment, validation, and manufacturing scale. Leonardo DRS starts from a far larger base—$3.6 billion of revenue, $8.7 billion of backlog, and 7,300 employees—and layers counter-UAS into broader defense programs. Those facts matter because switching costs in this market are real but not absolute. D-Fend and Dedrone both stress open APIs or hardware-agnostic integration, which means buyers can assemble multi-vendor stacks; at the same time, Fortem''s claim that failed deployments often stem from compatibility gaps illustrates why validated end-to-end systems become sticky
    once fielded. For Roark, the practical problem is that public evidence of named customers, repeat deployments, or procurement wins is still much thinner than what these competitors disclose. Resilience''s skepticism therefore lands squarely inside the competitive chapter: even if Roark has a clever service model, buyers in defense, public safety, airports, and critical infrastructure are likely to trust vendors with documented deployments, transaction validation, and broader channel support.'
