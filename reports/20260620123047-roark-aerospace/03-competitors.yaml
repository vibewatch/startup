- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - Roark moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Low-friction public pricing
    - Specialist and incumbent vendors can undercut low-end detection economics or bundle detection into larger stacks
    - High
    - Roark is unusually transparent on entry prices while peers sell integrated systems
    - Request win-loss analysis showing customers choose Roark for more than low upfront cost
  - - DDaaS / managed coverage model
    - Coverage claims may not translate into defensible recurring revenue if customers can multi-home or buy quote-based solutions later
    - High
    - Official Roark and trade sources describe service packaging, but public renewal data is absent
    - Ask for retention, monitored-site counts, and utilization by city / customer type
  - - Modular, interoperable architecture
    - Open APIs and hardware-agnostic competitor stacks reduce hard lock-in
    - Medium
    - D-Fend and Dedrone openly stress integrations, while Fortem argues integration quality is the real moat
    - Verify Roark API depth, partner ecosystem, and what breaks if a customer swaps sensors
  - - Affordable portable hardware
    - Portable detection is easier to commoditize than validated defeat or command layers
    - High
    - Specialists and incumbents already span portable, fixed, mobile, and software-led offers
    - Show roadmap from detection device to higher-value data, C2, or mitigation revenue
  - - Speed into pilots and events
    - Prime-backed vendors now have their own rapid fielding pathways and proof with critical infrastructure or high-profile events
    - Medium-High
    - Fortem, D-Fend, Dedrone, and DroneShield each publish stronger deployment or channel proof than Roark
    - Provide named pilot-to-contract conversions and gross-margin data on rapid deployments
  - - Narrative differentiation
    - Adverse scrutiny over Roark scale and funding can weaken buyer trust even if products work
    - High
    - Resilience questions verification while peer transaction and procurement proofs are stronger
    - Prepare customer references, deployment documentation, and funding/valuation evidence for diligence room
  notes: Severity reflects underwriteability, not technical elegance; the biggest risks are trust, commoditization, and channel asymmetry rather than absence of any market demand.
