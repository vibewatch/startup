companyProfile:
  summary: >-
    Roark Aerospace is a UK counter-UAS company incorporated on 30 November 2023 that presents
    itself as a drone-detection and C-UAS-as-a-service platform spanning Aero-Ark sensors,
    Plexus command software, and rapid-deployment / monitoring services. Official filings show
    the business is not just a slideware story: FY2024 accounts reported £36.9 million of
    turnover, £79.3 million of net assets, 49 average UK employees, and a group-sales model
    spanning UK and US entities. Public product evidence supports a real multi-modal detection,
    imaging, and decision-support offer, while March 2025 through April 2026 equity filings show
    material financing activity and a complex evolving capital stack. The core diligence issue is
    not existence but transparency: public disclosure on customers, investor roster, security and
    compliance posture, and the bridge from filings to the circulated unicorn-scale valuation is
    materially thin for a company claiming late-stage scale.
  foundedDate: '2023-11-30'
  headquarters: London, England, UK
  productSummary: >-
    Roark sells Aero-Ark detection units plus Plexus software, with offers spanning direct
    hardware sales, Detection as a Service, Rapid Deploy field services, and broader WAMI/HSI
    monitoring feeds. Public materials describe a layered stack using RF sensing, packet capture,
    passive radar, edge processing, and command-and-control workflows across land, air, and
    maritime environments.
  customerFocus: >-
    Apparent target customers include government and military users, public-safety and security
    operators, critical-infrastructure owners, temporary-event buyers, and private monitoring
    customers, but public sources do not identify a named production customer.
  businessModel: >-
    Mixed hardware-and-services model combining device sales with recurring detection-as-a-service,
    rapid-deployment fees, and platform access rather than a pure software subscription business.
  stage: Private company; Series B claimed by third parties in late 2025
  fundingStatus: >-
    Official filings show major equity activity in March 2025 and a December 2025 paid allotment
    of £156.96 million, while third-party sources circulated a $210 million Series B at a $1.6
    billion post-money valuation that remains only partially verified in public.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO011, CO012, CO014, CO015, CO018, CO021, CO022, CO029, CO040, CI016, CI018, CI033, CI035, CE020, CE023, CE025, CU012, CU010, CR013, CR039]
summary:
  headline: >-
    Roark Aerospace appears to be a real operating counter-UAS business with material revenue and
    genuine financing activity, but it is unusually opaque relative to the late-stage valuation and
    scale narrative being circulated around it.
