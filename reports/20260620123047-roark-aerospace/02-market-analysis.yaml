callouts:
- calloutType: strength
  title: The category is real, urgent, and budgeted
  body: Roark is not inventing a market from scratch. Official U.S. and NATO-adjacent sources show that counter-UAS is now a procurement priority with explicit budget lines, common qualification channels, and operational pressure to move faster than legacy acquisition systems allow.
  claimRefs:
  - CM007
  - CM009
  - CM010
  - CM011
  - CM013
  - CM018
- calloutType: risk
  title: Hot market does not equal easy share capture
  body: The same sources that confirm demand also confirm tougher buying filters and a crowded field. Investors should treat broad market heat as necessary but insufficient until Roark can show named customers, qualification evidence, and why its service-led model beats better-documented peers in the channels that matter.
  claimRefs:
  - CM019
  - CM020
  - CM023
  - CM033
  - CM036
  - CM037
  - CM040
