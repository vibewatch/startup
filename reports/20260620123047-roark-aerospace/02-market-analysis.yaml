- id: FM004
  title: Counter-UAS Adoption Flow from Need to Scaled Deployment
  type: flow
  layout: standard
  summary: '2026 procurement reform turns adoption into a staged proof engine: urgent need, qualification, feedback, contracting, and only then scaled fielding.'
  data:
    nodes:
    - id: threat
      label: Threat urgency
      detail: Drone incursions or battlefield adaptation create an immediate protection gap.
    - id: search
      label: Buyer search / challenge
      detail: Buyer frames use case rather than writing a years-long bespoke spec.
    - id: test
      label: Testing and qualification
      detail: Vendors prove interoperability, deployment practicality, and performance.
    - id: feedback
      label: Operator feedback loop
      detail: Army and allied users compare systems and scale what works.
    - id: contract
      label: Purchase / lease / service contract
      detail: Buyer chooses framework, pilot, lease, or managed deployment path.
    - id: scale
      label: Scaled fielding
      detail: Winning systems spread across sites, units, or allied customers.
    edges:
    - from: threat
      to: search
      label: Need becomes use case
    - from: search
      to: test
      label: Submit and evaluate
    - from: test
      to: feedback
      label: Generate user evidence
    - from: feedback
      to: contract
      label: Choose best-fit path
    - from: contract
      to: scale
      label: Expand what works
  approximationNotes: This is a workflow map, not a disclosed conversion funnel; public sources describe stages and qualification logic but not pass-rate statistics.
