- id: drivers-constraints-and-roark-fit
  title: Growth Drivers, Constraints, and Roark Fit
  body: 'Three forces are pulling the market forward at the same time: battlefield urgency, procurement reform, and cost-exchange pressure. Defense News'' interceptor-drone coverage shows why buyers care so much about price asymmetry, while Fortem and Lockheed make the same point from the vendor side by arguing that lower-cost software-centric interception can cut engagement cost materially. At the same time, the market is not empty. Shield AI, Epirus, D-Fend, Dedrone, Fortem, DroneShield, Leonardo DRS, DZYNE, and SRC all provide evidence that serious capital, named deployments, or strategic acquirers are already in the category. That creates adoption constraints for Roark. First, the market is crowded and increasingly consolidated, which raises the burden for distribution partners, references, and channel trust. Second, NATO and Army procurement reforms make interoperability and test validation more important, not less. Third, Roark''s company-specific disclosure remains thin relative to
    peers that name customers, use cases, or geographies. Resilience''s criticism is therefore relevant even in a market chapter: sector heat does not automatically convert into company credibility. The best-supported working view is that Roark is pointing at a real and expanding niche, especially service-led or fixed-site programs, but investors still need customer names, qualification evidence, and pipeline conversion data before turning generic market growth into a company-specific share assumption.'
