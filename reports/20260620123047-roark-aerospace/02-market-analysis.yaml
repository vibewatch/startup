- id: FM001
  title: Constrained Market Boundary Pyramid
  type: pyramid
  layout: standard
  summary: The relevant market narrows from broad autonomy budgets to a much smaller, qualification-heavy counter-UAS slice that better matches Roarks marketed service offer.
  data:
    nodes:
    - label: Broad autonomy adjacency
      note: DefenseScoop cites a $13.4B FY26 autonomy and autonomous-systems line, but that includes many non-C-UAS programs.
    - label: Direct counter-UAS budget lanes
      note: The same FY26 briefing isolates $3.1B for counter-UAS across the services, a closer but still incomplete market lens.
    - label: Curated coalition procurement channels
      note: NATO is vetting 18 systems across 9 use cases with purchase and lease paths, making qualification a practical narrowing step.
    - label: Roark-reachable niche
      note: Best-fit opportunity appears to be service-led, deployable, or fixed-site layered defense programs rather than every autonomy dollar in defense.
  approximationNotes: This is a boundary-narrowing logic map, not an additive TAM stack; the layers use different denominators and should not be summed.
