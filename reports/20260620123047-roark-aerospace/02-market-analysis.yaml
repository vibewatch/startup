- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Allied procurement urgency and battlefield feedback loops
    - Driver
    - Current
    - Buyers want systems proven quickly and informed by operator feedback rather than slow requirements documents
    - Has Roark entered any validated marketplace, trial, or allied feedback loop yet?
  - - Interoperability, testing, and qualification gates
    - Constraint
    - Current and rising
    - Marketplace and program reforms make common interfaces and standardized testing harder to avoid
    - Which Roark systems have passed third-party tests, open-architecture integrations, or operator evaluations?
  - - Low-cost interception and cost-exchange pressure
    - Driver + Constraint
    - Current
    - Affordable defeat or monitoring can unlock demand, but buyers will compare Roark against cheaper or proven alternatives
    - What is Roarks cost per protected site, deployment, or engagement versus peer offers?
  - - Crowded supplier field and consolidation
    - Constraint
    - Current
    - 550+ listed suppliers and strategic M&A raise the burden for differentiation, distribution, and trust
    - What channel, customer, or data advantage lets Roark stand out against peers and primes?
  - - Service-led / lease-like procurement models
    - Driver
    - Emerging
    - Purchase-plus-lease options and ongoing monitoring may favor managed-service positioning
    - Can Roark contract on recurring-service terms with acceptable gross margin and retention?
  - - Roark-specific disclosure and customer-proof gap
    - Constraint
    - Current
    - Sector demand does not prove company traction when peer references are named and Roarks are not
    - Request named customers, pilot-to-production conversion data, and qualification evidence before assigning share
