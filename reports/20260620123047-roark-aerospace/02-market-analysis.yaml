tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance
  rows:
  - - Layered military C-UAS programs
    - Detection, tracking, defeat, C2, training, and deployable systems for battlefield or base defense
    - General missile-defense or broad autonomy programs not solving the counter-drone mission
    - Defense ministries, armed services, allied coalition programs
    - Core target market because Army, NATO, and vendor pages all define the problem as layered detect-track-defeat
  - - Fixed-site critical-infrastructure protection
    - Persistent monitoring, mitigation, and response around utilities, ports, campuses, and strategic sites
    - General physical security or camera budgets with no airspace-defense requirement
    - Infrastructure owner/operator, security integrator, national regulator
    - Relevant to Roark because service-led monitoring and low-collateral mitigation can fit continuous site defense
  - - Airport / airfield airspace security
    - Drone detection, classification, and safe mitigation that preserves flight operations
    - General airport IT or unrelated perimeter-security spend
    - Airport operator, aviation authority, public-safety partner
    - Important adjacent segment because peers explicitly cite airports as a core end market
  - - Public safety / event / VIP protection
    - Temporary or recurring protection for major events, public venues, prisons, and VIP operations
    - Generic policing software or crowd-management tools without drone interdiction
    - Law enforcement, homeland-security, event security budget owner
    - Attractive for fast-deploy systems, but proof and legal / regulatory fit matter heavily
  - - Broad autonomy and unmanned-systems adjacency
    - Software, autonomy factories, edge autonomy, and general unmanned-system budgets
    - Treating all autonomy or all UAS spend as direct C-UAS revenue opportunity
    - 'Mixed: defense labs, OEMs, platform programs, software buyers'
    - Useful as context, but too broad to serve as Roark TAM without a narrowing step
  notes: Included / excluded logic is based on the counter-drone job-to-be-done rather than on generic defense-tech labels.
