- id: arms-race-and-integration-fragility
  title: The Product Arms Race Raises Integration and Execution Fragility
  body: 'Roark''s public product story is broad, but broadness itself is a risk when proof is thin. Defense Tech News and DroneXL describe a stack that spans RF and passive detection, edge AI, counter-drone tooling, WAMI and hyperspectral coverage, and a third-party pilot network feeding Plexus. That is strategically ambitious, yet it implies many dependencies: sensor fusion, data-governance discipline, external operator quality, field support, cloud or platform resilience, and enough engineering depth to keep the whole chain working. The only hard workforce datapoint in the retained record is 49 average UK employees in the 2024 accounts, excluding contractors and international staff. At the same time, better-documented peers are publishing stronger evidence of scale, capture performance, deployment count, platform integration, financing depth, and governance surfaces. Motorola''s D-Fend deal, Axon''s Dedrone platform integration, Fortem''s deployment claims, Shield AI''s autonomy proof,
    Epirus'' production scaling, and DroneShield''s public-investor surface all suggest that the category is moving toward larger, validated, and better-capitalized stacks. Roark may still have a wedge, but the residual risk is that its complexity outruns its publicly evidenced operating maturity.'
