- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Valuation credibility
    - Executed financing evidence
    - No signed cap table, investor roster, or rights package despite diligence request
    - Do not underwrite price; treat valuation narrative as unverified marketing
  - - Liquidity and runway
    - Next accounts / management pack
    - No current cash, burn, backlog, or AR-aging support before investment decision
    - Pause until balance-sheet visibility exists
  - - Qualification risk
    - Test and validation proof
    - No third-party test reports, approved-vendor progress, or named validated deployment
    - Assume procurement access is narrower than TAM narrative
  - - Secure-supply and export risk
    - Compliance package
    - No item classification, screening workflow, or domestic-source explanation for sensitive buyers
    - Restrict underwriting to non-sensitive channels or walk
  - - Integration and operating scale
    - Support metrics
    - No architecture owner map, uptime evidence, or contractor QA controls while footprint claims expand
    - Discount service reliability and margin assumptions
  - - Customer-proof risk
    - Named production references
    - No named customer, renewal proof, or quantified deployment outcome by close
    - Treat commercial durability as unproven and thesis as incomplete
  notes: Each trigger is designed to be externally checkable in diligence rather than dependent on generic optimism.
