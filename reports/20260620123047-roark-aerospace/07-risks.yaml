- id: authority-export-and-procurement-gates
  title: Authority, Export Controls, and Qualification Gates Narrow the Usable Market
  body: 'Official policy sources show that the counter-UAS buyer environment is getting easier only for vendors that satisfy authority, security, and qualification rules. FAA public-safety guidance still frames unlawful-drone handling as an authority-dependent activity. JIATF-401 says commanders now have more flexibility under 10 U.S.C. Code § 130i, but that flexibility comes with trained operators, designated facilities, interagency data sharing, and tested-and-validated materiel. DHS and CISA add another filter: agencies are expected to compare mission-specific requirements, site conditions, and layered-security integration before buying. OMB and BIS raise the bar again by tying unmanned-system procurement to secure-supply and domestic-capability logic, while the FAA ARC recommends performance standards, approved testing, and vendor lists before broad deployment. None of those rules targets Roark specifically, but they define the gate through which Roark must pass. Because Roark does not
    publicly document export-control posture, secure-data controls, or qualification status, policy expansion does not automatically translate into open market access for the company.'
