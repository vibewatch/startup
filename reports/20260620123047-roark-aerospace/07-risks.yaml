  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-roster
    missingEvidence: Signed cap table, investor list, wire confirmations, and closing documents for the claimed late-2025 round.
    whyItMatters: Unverified counterparties and opaque rights prevent reliable valuation, governance, and downside analysis.
    diligencePath: Request executed financing documents, board consents, and a cap-table bridge that ties each filing to each investor.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: export-controls
    missingEvidence: Item classification memos, export-license history, denied-party screening controls, and a secure-supply policy.
    whyItMatters: Counter-drone systems can face export, end-use, and provenance constraints that directly affect accessible markets.
    diligencePath: Request EAR and UK classification outputs, shipment logs, screening workflow, and compliance ownership.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: supplier-stack
    missingEvidence: Core sensor, compute, cloud, manufacturing, and backup-supplier disclosure plus continuity planning.
    whyItMatters: Supplier opacity prevents underwriting domestic-source compliance, redundancy, and service resilience.
    diligencePath: Request BOM summary, contract manufacturers, cloud architecture, backup vendors, and business-continuity plans.
    relatedQuestionRefs:
    - QR020
    - QR023
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: validated-performance
    missingEvidence: Independent field tests, false-positive rates, range limits, approved-vendor status, and named validated deployments.
    whyItMatters: Without objective proof, Roark may stay outside the very procurement channels that are expanding in 2026.
    diligencePath: Request government or third-party test reports, customer references, and any qualification paperwork tied to major programs.
    relatedQuestionRefs:
    - QR014
    - QR024
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash, burn, AR aging, backlog, current gross-margin profile, and the full post-2025 rights package.
    whyItMatters: Valuation and downside cannot be judged responsibly without updated liquidity and capital-structure facts.
    diligencePath: Request the latest monthly reporting pack, debt and preference terms, and a bridge from FY2024 filed numbers to current cash.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR005
