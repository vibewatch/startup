chapter:
  number: 7
  title: Risks
  summary: Roark's risk stack is led by disclosure opacity and valuation credibility, then compounded by authority-gated procurement, sparse public validation, and a dependency-heavy operating model. The company may have real capability and real financing activity, but the public record still falls short of the evidence standard buyers and investors increasingly require in 2026.
sections:
- id: opacity-and-capital-credibility
  title: Opacity and Capital Credibility Are the Lead Risks
  body: 'The evidence base supports the existence of a real operating company, but it does not support late-stage investor confidence on disclosure quality alone. Companies House proves Roark is active, identifies the next filing checkpoint, and shows a real sequence of share-capital filings and 2024 accounts. Those same filings also leave large gaps. The 2024 accounts aggregate UK and U.S. group sales, the filing trail does not publish a clean investor roster, and the April 2026 SH01 adds a liquidity-preference layer that matters to common holders without explaining the broader rights package. Resilience and Nordic9 reinforce the same problem from different angles: the headline $210 million Series B and $1.6 billion valuation traveled publicly, but verification did not travel with it. Roark''s surviving first-party web materials supply identifiers and addresses, not the management-grade trust package a defense-adjacent late-stage round would usually require. That makes the first risk less
    about whether the company exists and more about whether outsiders can credibly underwrite price, governance leverage, and downside from public evidence.'
