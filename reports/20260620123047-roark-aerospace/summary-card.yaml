  topStrengths:
    - >-
      Official filings support real operating substance, including £36.9M of FY2024 turnover and £79.3M of net assets
      only one year after incorporation.
    - >-
      Product evidence supports a real Aero-Ark plus Plexus counter-UAS stack sold through both hardware and service
      packaging.
    - >-
      March 2025 through April 2026 filings prove material capital formation and continuing financing access rather than
      a purely promotional funding story.
    - >-
      Counter-UAS demand and procurement activity are expanding across defense, security, and critical-infrastructure
      segments in 2026.
  topRisks:
    - >-
      The claimed $1.6B valuation and $210M Series B lack a clean public investor roster, signed cap-table bridge, and
      fully transparent rights package.
    - Public evidence still does not identify a named production customer or strong independent deployment validation.
    - >-
      FY2024 accounts show negative gross profit, high receivables, meaningful inventory, and limited disclosed cash
      relative to balance-sheet complexity.
    - >-
      Governance, compliance, supplier, and security disclosure are thin for an authority-gated defense market where
      buyers increasingly demand validated trust signals.
  unresolvedGaps:
    - Signed cap table, investor list, and full preference-rights bridge for the late-2025 financing.
    - Named customer references, production deployment evidence, and concentration / retention metrics.
    - 30 November 2025 accounts, current cash runway, and proof that margin quality improved after FY2024.
    - Export-control, secure-supply, and data-security documentation suitable for defense and public-safety procurement.
