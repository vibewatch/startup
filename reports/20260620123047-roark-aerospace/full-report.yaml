      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a mixed moat at best. Roark's best-supported advantage is ease of entry: public
              price points, portable hardware, and service packaging are clearer than for many peers. That can help win
              pilots, event coverage, or customers who do not want to buy a full stack. But the same evidence also
              suggests that low-end detection and managed monitoring are the easiest parts of the stack to commoditize.
              Better-capitalized vendors already own harder-to-copy moats: Shield AI in autonomy infrastructure, Epirus
              in directed-energy effectors, D-Fend in RF takeover, Fortem in validated interceptor operations and
              integrated radar, Dedrone in AI-enabled command and control with ecosystem leverage, DroneShield in
              public-market funding access and government specialization, and Leonardo DRS or SRC in program-level
              trust. Roark also faces the substitute of internal or prime-led integration, where buyers combine
              specialist sensors, jammers, and command software rather than standardize on a young managed-service
              vendor. The underwriting conclusion for this chapter is therefore cautious: Roark can plausibly carve out
              a detection-led service niche, but unless management can prove named customers, renewal behavior,
              integration defensibility, and a path from low-cost detection to higher-value command or effect layers,
              the company remains exposed to both commoditization from below and displacement by integrated incumbents
              from above.
