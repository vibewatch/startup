chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Footprint
        blocks:
          - type: paragraph
            body: >-
              Roark Aerospace's public identity is unusually compressed for a company claiming billion-dollar scale, but
              the official record is clear on the legal shell. Companies House lists RO-ARK AEROSPACE LIMITED as an
              active private limited company incorporated on 30 November 2023, with registered office at Monomark House,
              27 Old Gloucester Street, London, WC1N 3AX. The archived legal page adds a Cambridge Science Park address
              and a New York office, implying a more distributed operating footprint than the single UK filing might
              suggest, while the archived homepage advertises NATO NCAGE, UEID, DUNS, and VAT identifiers. Taken
              together, the official and archived records support the conclusion that Roark was organized quickly for
              defense-adjacent commercial activity, maintained at least a UK-Cambridge-U.S. footprint in marketing
              materials, and wanted to signal procurement readiness to allied government buyers very early in its life
              cycle. Cushman & Wakefield's Q1 2026 marketbeat reference to a 13,650-square-foot Cambridge lease is the
              strongest independent corroboration that the Cambridge presence was more than a vanity address.
