      - number: '4.4'
        title: Disclosure Gaps and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Roark's financial evidence set is directionally stronger than its public narrative but still below the
              standard required for late-stage defense-tech underwriting. Several databases track the company, yet
              PitchBook is effectively gated, Crunchbase was blocked during retrieval, and neither path exposes a usable
              investor roster or current operating metrics in the open web. The direct roark-aerospace.com root also no
              longer serves a working page, leaving archived snapshots and third-party writeups to carry too much of the
              diligence burden. That matters because better-documented peers show what stronger disclosure looks like.
              Shield AI publicly announced a $240 million round at a $5.3 billion valuation; Motorola said D-Fend was
              being acquired for $1.5 billion and expected to generate $185 million of 2026 revenue; Fortem named a $25
              million Lockheed-led tranche plus specific follow-on orders and contracts; Axon and Dedrone describe
              concrete deployments and categories of end user. Roark, by contrast, still lacks named customers,
              disclosed backlog, gross margin by product line, CAC/payback, current cash, current burn, and a
              transparent bridge from filed allotments to the unicorn headline. The financial verdict is therefore mixed
              but investable only with management-room evidence: revenue quality is proven enough to merit continued
              work, margin path is still speculative, and capital adequacy after the late-2025 financing cannot be
              assessed from public evidence alone.
