      - number: '1.3'
        title: Business Model and Product Positioning
        blocks:
          - type: paragraph
            body: >-
              Roark's own and third-party materials consistently describe an integrated airspace-defense network rather
              than a single detector or effector. The archived homepage used the label “Drone Detection as a Service |
              C-UAS as a Service,” while the 2024 accounts said the company was principally engaged in the manufacture
              and service deployment of drone detection systems, counter-drone systems, and unmanned vehicles. DroneXL
              added operational texture in January 2025, saying Aero-Ark systems combined ADS-B, Remote ID, DJI packet
              collection and decryption, passive radar, and edge-AI classification; the same report said Roark was
              extending WAMI and hyperspectral-imaging coverage via a Plexus platform. Global Defense Tech News
              similarly described unified sensors, counter-drone tools, and decision support deployed across land, air,
              and maritime environments. The common thread is a services-led architecture that bundles sensing, mapping,
              analytics, and command software, which is strategically sensible in a market increasingly rewarding
              integrated command-and-control and recurring monitoring contracts. The challenge is that most of the
              technical specificity still sits in secondary writeups rather than in first-party engineering
              documentation.
