      - number: '1.2'
        title: Leadership, Founder Control, and Governance
        blocks:
          - type: paragraph
            body: >-
              Public governance disclosure is concentrated around a single individual. Companies House shows Patton
              Atkinson-French as the only active director, appointed on incorporation day, and the sole person with
              significant control through more than 75% ownership of shares and voting rights plus the right to appoint
              or remove directors. The officer and appointments pages also show identity verification complete, British
              nationality, England residence, and February 1985 date of birth. This makes Roark look less like a mature
              venture-backed defense prime and more like a tightly founder-controlled operating vehicle that scaled
              revenue and financing rapidly before building a broad public governance surface. That is not disqualifying
              by itself, but it raises classic diligence questions around board composition, investor protections,
              delegated authority, and key-person dependence. The absence of a publicly visible board roster is
              especially notable given the size of the financing claims reported by external sources.
