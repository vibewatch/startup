      - number: '6.3'
        title: Durability, Retention, and Concentration Stay Mostly Undisclosed
        blocks:
          - type: paragraph
            body: >-
              The public record is weak on the metrics that determine whether Roark's customer base is durable rather
              than merely market-facing. No retained source discloses net revenue retention, gross revenue retention,
              churn, renewal rates, contract length, SLAs, or customer-satisfaction metrics. The same is true for
              top-customer concentration and channel dependence. Investors can infer that service packaging may fit
              recurring or repeat deployments, but they cannot quantify whether revenue is diversified across many
              accounts or driven by a few opaque programs. Even the strongest adoption claims have denominator problems,
              because city counts, end-user counts, and device counts are not reconciled to active paying accounts,
              retained contracts, or revenue contribution by segment. This leaves the chapter in a common but important
              diligence posture. Roark appears to have a product configuration that could support both temporary and
              persistent monitoring use cases, yet public durability evidence is insufficient to underwrite expansion
              economics, lifetime value, or concentration risk without management-room data.
