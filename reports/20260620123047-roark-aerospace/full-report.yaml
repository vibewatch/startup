      - number: '4.3'
        title: Capital Formation and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Late-2025 and early-2026 filings confirm that Roark did not remain a small, thinly capitalized shell after
              its first filed accounts. Companies House shows a March 2025 SH01 allotting 81 million ordinary and 19
              million preference shares at £1.25 each for cash, with the preference class carrying full-ratchet
              anti-dilution and preferential dividend rights. It then shows a 15 December 2025 filing for 131 B ordinary
              shares with £156,963,450 paid in cash, followed by 23 December and 28 December recapitalization filings
              that dramatically changed share counts and nominal values, and an April 2026 filing that added 20,079 B
              ordinary shares for a de minimis USD 1,390. These are strong signals of real financing activity plus
              cap-table engineering, but they are not the same thing as a fully transparent round announcement. Nordic9
              reported a $210 million Series B at a $1.6 billion valuation and $260 million of total investments
              received, yet labeled the deal pending verification. Tracxn showed Roark as a Series B company with $287
              million raised. Resilience's investigation said the company circulated the same $210 million and $1.6
              billion headline while disclosing only a "US-based investment bank via an SPV" as the named counterparty.
              The underwriting takeaway is that capital formation is clearly real, but current cash on hand, monthly
              burn, planned use of funds, and the exact investor-rights package remain materially under-disclosed.
