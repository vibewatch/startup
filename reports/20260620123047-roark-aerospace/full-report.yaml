      - number: '1.4'
        title: Funding, Financial Profile, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Roark's filings are stronger than its press coverage on one crucial point: the company was not a shell at
              the end of 2024. Its filed accounts reported £36.9 million of turnover, £79.3 million of net assets, 49
              average UK-based employees, and a £16.6 million pre-tax loss for the year ended 30 November 2024, while
              also disclosing a £16.42 million bond due in March 2029. Meanwhile, the filing history shows a rapid
              financing arc: a large 13 March 2025 share allotment, a 15 December 2025 B-ordinary filing with £156.96
              million paid for cash, and subsequent December 2025-January 2026-April 2026 cap-table adjustments. Those
              official filings do not themselves prove a $1.6 billion valuation, but they do confirm material capital
              formation around the dates third-party outlets discussed. Nordic9 and Resilience both reported a $210
              million late-2025 Series B and a $1.6 billion implied valuation, but Nordic9 explicitly marked the deal as
              pending verification and Resilience emphasized the absence of transparent investor disclosure. The
              cleanest conclusion is that Roark almost certainly closed a significant financing event in late 2025, yet
              the precise investor roster, round structure, and valuation math remain under-documented in the public
              domain.
