      - number: '3.2'
        title: Capabilities, Pricing, and Buyer Fit
        blocks:
          - type: paragraph
            body: >-
              The peer capabilities divide into clear control points. Roark's public materials emphasize accessible
              detection, modular deployment, and service-based coverage; the 2023 DRONELIFE and sUAS News pieces are
              unusually explicit on entry pricing, including £2,150 to £4,450 hardware variants, £95-per-user monthly
              DDaaS, and £185-per-day rapid deployment. By contrast, most better-documented peers do not publish list
              pricing on their official surfaces and instead sell integrated or quote-based systems. D-Fend's EnforceAir
              page highlights RF-cyber detection, tracking, identification, safe landing, and open-API integration.
              Dedrone markets a hardware-agnostic AI-driven airspace-security platform with more than 30 proven
              integrations, while Fortem argues that multi-vendor deployments fail when components do not integrate
              cleanly and therefore sells an end-to-end SkyDome suite. DroneShield packages fixed-site, dismounted,
              on-the-move, and software options for government customers. Leonardo DRS, DZYNE, and SRC frame the problem
              as layered protection across military, critical infrastructure, airport, and maritime or expeditionary
              settings. The commercial implication is that Roark's public price transparency and managed-service framing
              may appeal to customers who want quick detection coverage, event deployments, or a lower-capex trial path,
              but prime-scale procurement buyers are comparing that offer against vendors who already publish deeper
              integration, deployment, and mission-validated performance evidence.
