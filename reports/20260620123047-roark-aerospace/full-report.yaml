  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a combination of real financing signal, weak public operating disclosure, and
      unresolved rights opacity.
    approximationNotes: This is an analyst synthesis of the evidence chain rather than a company-issued decision tree.
    data:
      nodes:
        - id: filings
          label: Primary filing support
        - id: economics
          label: Filed economics still weak
        - id: rights
          label: Rights and investor opacity
        - id: comps
          label: Mixed but demanding comp set
        - id: stance
          label: Stretched valuation stance
        - id: call
          label: Research-more recommendation
      edges:
        - from: filings
          to: stance
          label: supports magnitude but not precision
        - from: economics
          to: stance
          label: blocks premium-multiple confidence
        - from: rights
          to: stance
          label: adds discount for uncertainty
        - from: comps
          to: stance
          label: sets a harder disclosure bar
        - from: stance
          to: call
          label: requires more diligence before buy
