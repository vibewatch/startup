      - number: '7.4'
        title: Mitigation Only Works If It Produces Evidence Fast
        blocks:
          - type: paragraph
            body: >-
              None of the leading risks is unmonitorable, but most of them require management-room evidence rather than
              more narrative. The mitigation path is therefore concrete. Roark can reduce disclosure risk by producing a
              signed cap table, investor documents, and a clean bridge from filed allotments to the claimed round. It
              can reduce procurement and authority risk by showing approved test results, deployment references,
              secure-data controls, and any qualification or vendor-pool progress. It can reduce integration risk by
              naming critical suppliers, documenting contractor or pilot controls, and proving that Plexus and WAMI/HSI
              handling satisfy privacy and security expectations. It can reduce valuation risk only by combining those
              operating proofs with current liquidity, runway, and rights-package disclosure. The key investor posture
              is to treat time as a risk amplifier: if the next accounts deadline, customer proof, or
              policy-qualification milestones pass without substantiation, the company moves from under-disclosed to
              structurally non-underwritable at the current narrative price.
            claimRefs:
