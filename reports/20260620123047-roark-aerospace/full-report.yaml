      - number: '8.2'
        title: Financing Signal and Cap-Table Overhang
        blocks:
          - type: paragraph
            body: >-
              The filing sequence matters more than the press release because it is the only primary evidence set that
              cannot be waved away as promotional copy. March 2025 already introduced investor-protective preference
              terms, including anti-dilution. Then the December 2025 SH01 showed £156.96 million paid for 131 B ordinary
              shares, followed days later by a recapitalization that effectively redenominated that class from 131
              shares to 131,000 shares while preserving nominal value. That sequence is unusual, but analytically
              useful: it implies a per-share price that points to a post-money valuation around £1.36 billion before
              later preference and April 2026 issuance, which is directionally consistent with the public $1.6 billion
              narrative. The problem is not the magnitude; the problem is the missing bridge. Outsiders still cannot see
              which investors bought which securities, the exact liquidation waterfall, or how the later preference
              layers interact with common holders. That missing bridge is why the chapter treats the filing math as
              triangulation rather than proof of a clean current mark.
