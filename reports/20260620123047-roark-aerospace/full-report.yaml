      - number: '6.2'
        title: Adoption Claims Exist, but Proof Quality Falls at the Named-Customer Layer
        blocks:
          - type: paragraph
            body: >-
              Roark makes broad adoption claims in public. Dronelife described Aero-Ark as a service with units
              installed in 70 cities worldwide. sUAS News said the service was limited in scope but aimed for 100 cities
              by the end of 2024. DroneXL described WAMI and hyperspectral coverage across 30 U.S. cities and 12 U.K.
              cities, plus a program that recruits third-party drone pilots with certifications and cameras. Tracxn
              added even larger claims, describing more than 55,000 deployed devices and more than 3,000 end users.
              Those datapoints suggest commercial ambition and some operating footprint, but they are not equivalent to
              named production proof. None of the retained Roark sources identify a customer by name or distinguish
              pilot, trial, and production deployments. Competitor pages highlight the difference: Dedrone discloses
              named case studies and broad protected-site counts, while Fortem names specific government and event
              deployments. The evidence-backed conclusion is therefore narrow but important. Roark may have real users,
              but the open web does not provide a public customer reference set strong enough to validate account
              quality, maturity, or repeatability the way comparator sources do.
