      - number: '2.2'
        title: Sizing Lenses and Demand Backdrop
        blocks:
          - type: paragraph
            body: >-
              The demand backdrop is strong, but each public sizing lens uses a different denominator. DefenseScoop
              reported that the Pentagon's FY26 request includes $13.4 billion for autonomy and autonomous systems, of
              which $3.1 billion is specifically for counter-UAS across the services. That immediately tells us broad
              autonomy figures overstate Roark's direct market if used as TAM. On the international side, Unmanned
              Airspace said publicly announced government C-UAS contracts exceeded $29 billion in the first months of
              2026, but that figure is a running contract tally rather than a clean annual market definition. Defense
              News adds a different lens: NATO is curating 18 vetted solutions across nine use cases, with purchase and
              lease options, which is better interpreted as a near-term qualification bottleneck than as a spend total.
              Supplier-side counts show the same ambiguity. Unmanned Airspace's directory says it tracks 550+ companies
              and 1,000+ programs, while its spending article says there are already more than 70 interceptor-drone
              manufacturers. The right conclusion is not that one number is true and the others are false; it is that
              public evidence points to a large and urgent market whose buyable slice is narrower, curated, and more
              crowded than a single generic TAM headline would suggest.
