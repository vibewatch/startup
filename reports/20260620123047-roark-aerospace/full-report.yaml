        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence says Roark is selling a service-led counter-UAS package rather than a single
              detector SKU. The archived homepage positioned the company as "Drone Detection as a Service | C-UAS as a
              Service," and two independent drone-trade outlets described Aero-Ark hardware, DDaaS seats, and Rapid
              Deploy engagements with explicit public pricing. Across those sources, the core commercial motion is
              consistent: a customer either buys or temporarily deploys Aero-Ark hardware, or buys monitoring coverage
              as a service, and then receives airspace alerts through the Plexus platform. The same sources also place
              WAMI and hyperspectral imaging beside the airspace product, which implies Roark wants to sell a broader
              monitoring stack rather than pure RF detection. What remains thin is deployment proof. The evidence shows
              product packaging, form factors, and commercial intent, but it does not yet show named operating sites,
              live DDaaS city lists, or customer outcomes that would confirm how much of the network is production
              versus market-facing roadmap.
