  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to reject the idea that Roark is a fictional company or that the
              late-2025 financing headline came from nowhere, but it is not strong enough to let an outside investor
              underwrite the headline price with confidence. Companies House filings show real capital formation, and
              the December 2025 paid line is large enough to make the claimed round magnitude plausible. At the same
              time, the same public set still lacks the signed cap table, full investor roster, and rights package that
              would convert plausibility into price certainty. That is why the right call is research-more rather than
              buy. The valuation stance is stretched, not automatically absurd: the filing trail triangulates a
              late-2025 mark in the same order of magnitude as the reported $1.6 billion narrative, yet the only filed
              operating year shows negative gross profit and leaves current quality of revenue opaque. In practical IC
              terms, this means Roark deserves continued diligence only if entry discipline is explicit, governance and
              dilution terms are surfaced quickly, and management can prove that 2026 operating quality is materially
              better than the last filed accounts suggest.
