  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Segment Logic
        blocks:
          - type: paragraph
            body: >-
              Roark's own public framing matters because the sector's headline numbers are broad enough to mislead. The
              archived homepage positioned the company as "Drone Detection as a Service | C-UAS as a Service," while
              DroneXL and Defense Tech News described a package that combines OTC detection devices, wide-area sensing,
              counter-drone tooling, and the Plexus data layer. That means the closest market is not the whole autonomy
              stack and not all unmanned-systems spending; it is the layered counter-UAS mission chain of detection,
              tracking, identification, mitigation, and operational command support. NATO AIRCOM's 2026 focus day
              reinforces that exact boundary by emphasizing the full chain from detection to neutralisation, and U.S.
              Army / NATO marketplace work likewise starts with counter-drone systems before later expanding into
              adjacent radars and sensors. In practical terms, the included spend is layered battlefield and
              site-defense programs, deployable/mobile C-UAS packages, airport or critical-infrastructure airspace
              protection, and recurring monitoring or managed-service overlays. Excluded spend includes broad autonomy
              software, general-purpose drones, and adjacent air-defense categories that do not solve the same
              counter-drone job. That narrower boundary is more useful for underwriting because it matches the buyer
              problem Roark says it serves and highlights where incumbents already publish stronger deployment proof
              than Roark does.
