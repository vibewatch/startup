  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Roark's valuation is most sensitive to how much weight the investor gives current proof versus the late-2025
      financing signal.
    approximationNotes: Values are scenario midpoints in USD billions, not observable traded marks.
    data:
      items:
        - label: Bear midpoint
          value: 0.45
          note: Use when current economics and rights remain weakly documented
        - label: Base midpoint
          value: 1
          note: Use when financing magnitude is real but disclosure still warrants a material discount
        - label: Bull midpoint
          value: 1.6
          note: Use only if management substantiates the headline with current KPIs and clean rights docs
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV054
      - CV058
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The public-only underwriting range is wide because precise downside protection and current revenue quality are
      both still unresolved.
    approximationNotes: Ranges express analyst post-money valuation bands in USD billions under each scenario.
    data:
      items:
        - label: Bear
          low: 0.3
          high: 0.6
          unit: USD bn
          detail: Weak current economics, thin customer proof, and harsher rights overhang
        - label: Base
          low: 0.8
          high: 1.2
          unit: USD bn
          detail: Real financing signal plus a transparency discount
        - label: Bull
          low: 1.4
          high: 1.8
          unit: USD bn
          detail: Headline mark supported by current KPI and governance evidence
    claimRefs:
      - CV023
      - CV024
      - CV052
      - CV053
      - CV054
