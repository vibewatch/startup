  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitive Classes
        blocks:
          - type: paragraph
            body: >-
              Roark is not facing one clean peer set. Its own archived homepage and early trade coverage position the
              company as “Drone Detection as a Service | C-UAS as a Service,” with portable or fixed Aero-Ark hardware
              and service layers that reduce upfront customer spend. That makes the closest direct competition the
              service-led and software-centric part of counter-UAS rather than the entire defense-autonomy market.
              Around that direct lane sits a broader field of specialists and incumbents. Shield AI is selling mission
              autonomy infrastructure, Epirus is building high-power microwave effectors for layered short-range air
              defense, D-Fend is centered on RF cyber takeover, Dedrone and Fortem emphasize integrated
              detect-track-identify-mitigate stacks, DroneShield is a public-market specialist in modular counter-UxS,
              and Leonardo DRS, DZYNE, and SRC represent established integrator or incumbent-style alternatives.
              Unmanned Airspace's 2026 directory, which tracks 550-plus companies and 1,000-plus programs or systems,
              underscores that Roark enters a crowded category where buyers can mix specialist sensors, effectors, and
              command layers rather than commit to one novel startup story. The U.S. Army's 2026 marketplace language
              also matters here because it suggests buyers increasingly prefer proven vendors that can slot into allied
              qualification and interoperability schemes. In that environment, Roark's story is easiest to understand as
              a low-friction detection and managed-service wedge into a market whose upper end is increasingly owned by
              better-capitalized integrated vendors.
