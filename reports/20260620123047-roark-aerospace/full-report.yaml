            body: >-
              Roark's architecture story is plausible, but it is still mostly marketing and trade-press level rather
              than document-grade technical proof. Dronelife, sUAS News, and DroneXL independently point to the same
              broad pattern: WiRED is presented as a forward-scatter or satellite-informed sensing layer; CRI is
              presented as an RF scanning and packet-analysis layer; DroneXL adds ADS-B, Remote ID, DJI packet
              decryption, and passive radar; and multiple outlets say classification or coordination happens on-device
              or at the network edge before data is exposed through Plexus. That multi-modal stack is directionally
              consistent with how mature C-UAS vendors frame layered detection, but Roark's public evidence is
              materially thinner than peer documentation. SRC, Leonardo DRS, D-Fend, DZYNE, Dedrone, and Fortem all
              expose clearer descriptions of sensor fusion, deployment kits, open integration, or full
              detect-track-defeat chains. Roark may still have a differentiated low-cost wedge, especially if its
              service pricing is real, yet the open record does not substantiate forward-scatter performance,
              packet-decryption breadth, programmable metasurface effectiveness, or any proprietary large-language-model
              advantage with test data, patents, or customer validation.
