company:
  name: Octopus Energy
chapter:
  number: 5
  title: Product & Technology
  summary: Octopus combines the Kraken utility operating platform with customer-facing tariffs and distributed-energy products. Public evidence supports a mature operating model and meaningful scale, but independently verified security, reliability, and software-development evidence remains limited.
sections:
  - id: customer-workflow
    title: Customer workflow and product surface
    body: >-
      Octopus is delivered as an integrated energy workflow rather than a single software SKU. Customers receive supply, billing, service, and tariff choices through digital channels, while Kraken coordinates account operations and flexible consumption. The product surface extends from half-hourly or dynamic pricing to EV charging, solar, batteries, heat pumps, and home-energy orchestration. This creates a coherent customer proposition: expose price and carbon signals, then use automation or customer choice to move demand toward cheaper and cleaner periods. The trade-off is operational breadth; customer outcomes depend on hardware installation, data quality, tariff design, and the underlying utility relationship.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and scale
    body: >-
      Kraken is described by Octopus and external observers as a cloud-based, data-driven operating system for utilities. Its role spans customer accounts, billing, service automation, data, and flexibility, while Octopus uses the same operating model in its own retail business. Public disclosures indicate material scale: the 2025 OEL filing reports 6.1 million Great Britain customers and 1.7 GW of distributed power capacity under management at year end, while Kraken separately reports contracted accounts and licensing revenue. These figures are not interchangeable populations, but together they show a platform with both internal production use and external utility distribution.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation
    title: Maturity, differentiation, and deployment
    body: >-
      Evidence supports a mature production system rather than an early prototype. OEL reports repeated customer-service recognition, rapid organic customer acquisition, smart-tariff adoption, and operating profitability, while Kraken reports licensing relationships with large utilities and a spin-off intended to accelerate expansion. Differentiation appears to come from the combination of utility data, retail distribution, flexible tariffs, and a live operating environment in which Octopus can test propositions on its own customers. However, several performance assertions remain company-reported or interview-based: public sources do not provide a reproducible uptime series, migration failure rate, model-evaluation protocol, or independently audited software gross-margin bridge.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: risk-controls-gaps
    title: Trust, controls, and diligence gaps
    body: >-
      The operating model handles regulated customer accounts and physical energy assets, so reliability and controls are central product risks. The annual report describes weekly operational reporting, stress testing, board oversight, customer metrics, and capital-adequacy monitoring; that is evidence of a governance process, not proof that every technical control is effective. The assigned sources do not establish a public security architecture, incident history, penetration-testing cadence, privacy controls, or software supply-chain policy. They also do not supply a public developer repository or comparable practitioner-community activity. Before underwriting technology quality, an investor should request service-level reports, migration and outage records, security attestations, access-control evidence, model governance, and product-level retention and failure metrics.
    claimRefs: [CE013, CE014]
callouts:
  - calloutType: strength
    title: Integrated data-to-device loop
    body: Octopus links utility accounts and pricing signals to controllable devices, creating a differentiated route from software operations to measurable demand flexibility.
    claimRefs: [CE002, CE003, CE006]
  - calloutType: risk
    title: Scale claims need independent operating evidence
    body: Contracted accounts, managed capacity, and customer counts are disclosed on different bases; uptime, migration quality, security, and retention evidence is not public in the assigned pool.
    claimRefs: [CE005, CE007, CE014]
  - calloutType: recommendation
    title: Make technical diligence a gating item
    body: Require platform reliability, security, data-governance, and deployment evidence before treating Kraken scale as durable competitive advantage.
    claimRefs: [CE013, CE014]
