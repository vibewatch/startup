figures:
  - id: FM001
    title: Evidence stack for market scale and expansion
    type: pyramid
    summary: >-
      Public metrics move from a broad British retail base through Octopus
      distribution and switching to flexible-demand and renewable adjacencies.
    data:
      nodes:
        - label: "Implied British domestic meter-point base"
          value: "approximately 56.7 million"
          detail: "Derived from 14.74 million divided by a reported 26% share"
        - label: "Octopus domestic meter-point footprint"
          value: "14.74 million"
          detail: "Company-reported for August 2026"
        - label: "Recent household switching flow"
          value: "more than 500,000"
          detail: "Company-reported switches in the first seven months of 2026"
        - label: "Flexible-tariff interval"
          value: "30 minutes"
          detail: "WIRED described half-hourly pricing for Agile Octopus"
        - label: "Renewable portfolio capacity"
          value: "5.7 GW"
          detail: "Octopus Energy Generation; figures calculated May 2026"
        - label: "Homes powered annually by managed assets"
          value: "2.8 million"
          detail: "Octopus Energy Generation; figures calculated May 2026"
    approximationNotes: >-
      The layers are ordered analytical lenses, not a value-proportional funnel or
      additive TAM. The 56.7 million figure is derived and rounded; meter points,
      households, time intervals, capacity, and homes powered use different units.
    claimRefs: [CM005, CM006, CM007, CM009, CM011]
