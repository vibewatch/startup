company:
  name: Octopus Energy
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Octopus Energy's core addressable market is regulated household and business
    energy supply, with flexible tariffs, distributed hardware, utility software,
    and renewable-asset management as distinct adjacencies. Public evidence shows
    substantial British distribution scale, but it does not support one additive
    TAM or disclose a company-specific software SAM, segment margin, or attainable
    share.
sections:
  - id: market-boundary
    title: Market boundary before market size
    body: >-
      The investable market should be bounded first around regulated electricity
      and gas supply: commodity procurement, tariff design, metering, billing,
      collections, and customer service for household and business accounts.
      Ofgem's price cap applies to covered standard variable tariffs by limiting
      unit rates and standing charges, not the customer's total bill, while fixed
      tariffs, business contracts, heat networks, and heating oil sit outside that
      consumer protection. Octopus also addresses flexible demand, EV charging,
      heat pumps, solar, smart meters, renewable generation, and utility operating
      software, but those layers have different buyers, units, capital needs, and
      economics. They therefore belong in adjacent sizing lenses rather than an
      undifferentiated energy-transition TAM. Status-quo substitutes include
      remaining with an incumbent or default tariff, minimizing switching effort,
      self-generating or reducing consumption, and a utility retaining or building
      its legacy technology stack. This boundary avoids treating wholesale energy
      value, network returns, software revenue, equipment sales, and managed assets
      as if they were interchangeable spend.
    claimRefs: [CM001, CM002, CM003, CM010]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      The strongest current distribution datapoint is Octopus's August 2026
      company release: 14.74 million domestic meter points and around 26% of
      Britain's home-energy market. Dividing those figures implies roughly 56.7
      million domestic meter points in the referenced market, but that is an
      analyst calculation subject to rounding and denominator consistency rather
      than a published TAM. The same release says more than half a million
      households switched to Octopus in the first seven months of 2026. As an
      independent historical cross-check, The Guardian reported that Cornwall
      Insight placed Octopus at 23.7% of Great Britain households at the end of
      2024; households and meter points are not identical denominators, so the two
      shares indicate direction rather than a precise cohort bridge. Octopus Energy
      Generation separately reports £8.5 billion of assets under management, 5.7
      GW of capacity, and 2.8 million homes powered annually as of May 2026. Those
      are infrastructure measures, not retail revenue, Kraken ARR, or available
      cash, and they cannot be added to the retail footprint.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption mechanisms
    body: >-
      Residential supply usually combines buyer, payer, and budget owner in the
      household account holder, while occupants are the users. Business supply
      separates procurement or finance ownership from facilities and site users.
      Flexible tariffs add drivers, vehicles, heat-pump owners, and connected
      devices to the workflow; WIRED describes half-hourly prices and automated
      overnight EV charging as mechanisms that shift load toward cheaper periods.
      S&P Global's interview with Greg Jackson frames digital technology and AI as
      ways to reduce the consumer cost of decarbonization, but this remains a
      company-executive thesis rather than an independent ROI study. Utility
      software has a different buyer: utility leadership and technology or
      operations budgets, with service teams as users. Renewable funds introduce
      institutional investors as payers and portfolio managers as users. These
      segments share an energy-transition theme, yet adoption paths range from a
      low-friction supplier switch to multi-year software replacement and
      capital-intensive equipment or infrastructure decisions.
    claimRefs: [CM011, CM012, CM015]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Constraints, contrary evidence, and diligence gaps
    body: >-
      Regulation, affordability, trust, and capital intensity constrain adoption.
      Ofgem's cap calculation incorporates wholesale energy, networks, policy,
      supplier operating costs, EBIT, uncertainty headroom, levelisation, and VAT,
      so retail economics cannot be inferred from market share alone. WIRED's
      historical account called UK heat-pump adoption prohibitively expensive and
      cited an almost £18,000 installation quote against a typical £3,500 gas-boiler
      replacement, illustrating how equipment economics can slow electrification.
      The same article relayed an Octopus executive claim that cost to serve was at
      least 50% lower than most rivals, but the assigned public evidence does not
      independently audit that advantage. The Guardian's company index also records
      a £1.5 million payment over final-bill errors, demonstrating that operational
      execution can create regulatory and trust costs. The central valuation gap is
      therefore not whether the market is broad; it is the missing segmentation of
      retail gross profit, hardware contribution, renewable-management fees, and
      software recurring revenue by geography and buyer.
    claimRefs: [CM004, CM013, CM014, CM016]
callouts:
  - calloutType: insight
    title: Distribution scale is visible; segment economics are not
    body: >-
      British meter-point scale and switching momentum are public, but they do not
      reveal the mix or margin of retail supply, software, hardware, and renewable
      investment activities.
    claimRefs: [CM005, CM007, CM016]
  - calloutType: risk
    title: Market share does not remove regulatory and trust constraints
    body: >-
      Price-cap mechanics constrain retail monetization, while equipment costs and
      billing errors can slow adoption or raise the cost of serving customers.
    claimRefs: [CM002, CM004, CM013]
