evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete current board, shareholder register, voting-control map and succession plan for Octopus Energy Group.
    whyItMatters: Founder-led control and the separation of Kraken may materially affect governance, dilution and key-person risk.
    diligencePath: Obtain current Companies House filings, shareholder register, board minutes or a management cap-table package.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: scale
    missingEvidence: A 2026 group KPI pack reconciling customers, employees, revenue, ARR and account definitions.
    whyItMatters: FY24 figures and later promotional figures use different dates and denominators, limiting current underwriting.
    diligencePath: Request 2025-2026 management accounts and a metric-definition reconciliation by segment.
    relatedQuestionRefs:
      - QO003
      - QO008
      - QO009
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Standalone Kraken capitalization, ownership, cash proceeds and current ARR/churn by geography.
    whyItMatters: >-
      A Kraken transaction valuation cannot be converted into group equity value or a software multiple without those
      terms.
    diligencePath: Obtain the Kraken separation term sheet, cap table, audited segment accounts and customer-contract schedule.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO009
  - type: missing-source
    severity: material
    topic: regulation
    missingEvidence: >-
      Complete Ofgem remediation evidence and confirmation of any open billing, prepayment or customer-protection
      matters as of 2026-10-26.
    whyItMatters: >-
      The disclosed £1.5 million action establishes a control failure but not whether remediation is complete or
      recurrence risk is reduced.
    diligencePath: >-
      Request Ofgem correspondence, remediation testing, complaint trends and the company’s current regulatory-risk
      register.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Audited segment revenue, gross profit, active accounts, churn, contract value, and market denominator for retail
      supply, utility software, hardware, and renewable management.
    whyItMatters: >-
      Meter points, market share, managed assets, capacity, and homes powered cannot be converted into a defensible SAM,
      SOM, recurring-revenue base, or valuation multiple without common denominators.
    diligencePath: >-
      Request management's segment reporting, software contract ledger, account cohorts, energy volumes, gross-margin
      bridge, hardware contribution margins, and geographic pipeline.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: denominator-reconciliation
    missingEvidence: >-
      A regulator-reconciled time series connecting households, domestic meter points, gross switches, net additions,
      and market share.
    whyItMatters: >-
      The end-2024 household share and August 2026 meter-point share use different populations, while gross switches do
      not reveal churn.
    diligencePath: >-
      Obtain Cornwall Insight or Ofgem underlying market-share tables and reconcile them to monthly company account and
      meter-point records.
    relatedQuestionRefs:
      - QM002
      - QM005
      - QM006
      - QM008
  - type: stale
    severity: material
    topic: affordability-constraint
    missingEvidence: >-
      Current installed-cost and payback evidence for heat pumps, EV charging, solar, batteries, and flexible tariffs by
      customer segment.
    whyItMatters: >-
      The retained WIRED cost example is historical and anecdotal, so it establishes friction but not current adoption
      economics.
    diligencePath: >-
      Request 2026 quote distributions, subsidy-adjusted customer payback, installation lead times, financing terms, and
      conversion rates.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      A current, like-for-like tariff and contract-price benchmark for Octopus, incumbent retailers and specialist B2B
      suppliers.
    whyItMatters: The retained sources establish offer structures but not matched realized prices, discounts or margins.
    diligencePath: >-
      Collect current standard, fixed, time-of-use and business quotes for matched consumption profiles, credit terms
      and contract periods.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: Kraken
    missingEvidence: >-
      Kraken realized license price, implementation cost, migration duration, post-go-live defect rate and customer
      retention by geography.
    whyItMatters: >-
      These metrics determine whether platform integration produces repeatable economics rather than only strategic
      lock-in.
    diligencePath: >-
      Request anonymized license contracts, migration post-mortems, billing-defect cohorts, payback calculations and
      reference-customer churn data.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: peer-capabilities
    missingEvidence: >-
      Matched service, tariff, switching, customer-acquisition and platform data for major incumbent and specialist
      alternatives.
    whyItMatters: Unknown peer cells prevent a high-confidence ranking of Octopus's differentiation against the actual buying set.
    diligencePath: >-
      Run matched-customer interviews, collect competitor product documentation and commission an independent service
      and tariff benchmark.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      CAC, payback, churn, tariff-cohort contribution margin, and standalone Kraken gross margin by geography and
      customer type.
    whyItMatters: >-
      Without these inputs, revenue growth and contracted ARR cannot be translated into customer lifetime value or a
      defensible software and retail valuation.
    diligencePath: >-
      Request cohort revenue, gross margin, churn, CAC, payback, implementation cost, and allocated overhead schedules
      from management.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      A current group liquidity bridge separating unrestricted cash, ring-fenced cash, commodity collateral, credit
