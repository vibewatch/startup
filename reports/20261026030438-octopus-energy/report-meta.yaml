companyProfile:
  summary: >-
    Octopus Energy is a private energy group founded in 2015 that combines a large retail supply business with renewable
    generation, energy services and hardware, and Kraken utility-software licensing. Its public evidence shows
    meaningful operating scale and multiple monetization layers, while the parent-level economics and the post-demerger
    software value proposition remain only partly transparent.
