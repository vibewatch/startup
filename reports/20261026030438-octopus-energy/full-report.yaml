        - Kraken adoption continues but conversion, margins and parent cash flow remain partly opaque
        - Use the $8.65bn Kraken mark only as a reference point and apply an information discount to parent exposure
        - Illiquidity, preference terms, working capital
        - Most supportable current posture
      - - Bear
        - Contract renewals weaken or parent needs additional capital while controls and regulation remain pressured
        - Retained stake is marked down or diluted; downside cannot be quantified from public data
        - Down-round, dilution, remediation, customer loss
        - Material downside; trigger is monitorable
      - - Entry rule
        - No verified Octopus equity price or full capital structure in the public pool
        - Do not convert the Kraken mark into a whole-company price or target return
        - False precision and adverse selection
        - Binding diligence gate
      - - Exit rule
        - Liquidity requires a documented transaction or independently verified market
        - Reassess on a filed IPO, sale, or transparent secondary with terms
        - Locked-up minority stake
        - Event-driven
    notes: >-
      Bands are qualitative because the pool does not disclose Octopus net debt, ownership preferences, recognized
      revenue, cash burn, or a comparable-company set.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
