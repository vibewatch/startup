chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group is a private, London-based energy and technology group whose operating model spans
              the energy value chain rather than only household supply. The FY24 annual report describes four connected
              activities: renewable-generation fund management, electricity and gas retail, low-carbon hardware and
              services, and Kraken software licensing. This architecture gives the company a route to combine customer
              relationships, flexible demand, generation investment and software economics, but it also makes the group
              harder to underwrite as one homogeneous business. The company identifies Greg Jackson as CEO and founder
              and Stuart Jackson as CFO and co-founder. A third-party profile says the group was incorporated in 2014
              and began operations in 2015, while WIRED describes the retail business as founded in 2015 by Greg
              Jackson. The evidence supports a clear identity and business model; exact legal-entity boundaries and
              current governance beyond the named executives remain less transparent in the assigned public material.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership, capital and scale
        blocks:
          - type: paragraph
            body: >-
              FY24 is the strongest retained operating baseline. The audited annual report records £12.4 billion of
              revenue, £83 million of net profit, £1.7 billion of net assets and a £628 million equity investment from
              existing investors at an increased valuation. It also reports 7.95 million total customers at year end,
              including 6.7 million UK retail customers and 1.2 million international retail customers, plus 61 million
              contracted Kraken accounts as of October 2024. The same report identifies 8,500 employees and £166 million
              of external Kraken ARR at year end. These are company-reported figures for FY24, not a current 2026
              run-rate or a standalone Kraken valuation. Public coverage also records a proposed or reported Kraken
              spin-off at an $8.65 billion valuation in December 2025, but that is not equivalent to Octopus Energy
              Group valuation or cash available to the group. The leadership structure remains founder-led, while
              Kraken’s reported appointments of Amir Orad as CEO and Tim Wan as CFO indicate a parallel technology
              leadership bench.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Milestones and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Octopus’s growth has been driven by acquisitions, international expansion and software reuse. The retained
              chronology records incorporation in 2014, market launch in 2015, acquisitions or customer transfers from
              Iresa, Midcounties, ENGIE, Avro, Bulb, M&S Energy and Shell Energy, and the 2024 Lintas Green Energy and
              Exagen additions. The FY24 report says the Shell acquisition added 1.3 million customers and that the
              migration to Kraken took 89 days from ramp-up to completion. The strategic milestone is the separation of
              Kraken: coverage in the assigned pool says the software business reached $500 million of committed annual
              revenue through licensing deals and more than 70 million managed accounts, while the annual report gives
              the more conservative October 2024 figure of 61 million contracted accounts and £166 million external ARR.
              These figures have different dates and definitions and should not be merged. The principal adverse finding
              is regulatory: Ofgem identified final-billing failures affecting about 34,000 prepayment customers and
              required £1.5 million of payments. This does not establish systemic failure, but it is a material control
              and customer-protection diligence item.
