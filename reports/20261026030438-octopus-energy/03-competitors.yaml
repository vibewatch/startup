company:
  name: Octopus Energy
chapter:
  number: 3
  title: Competitors
  summary: Octopus competes simultaneously with incumbent and specialist energy retailers and with legacy utility-software stacks. Its tariff breadth, retail scale and Kraken operating model are differentiated, but peer-normalized pricing, migration outcomes and realized Kraken economics remain unavailable.
sections:
  - id: landscape
    title: Competitive landscape and scale
    body: >-
      The buying set is broader than a list of household suppliers. Direct alternatives
      include British Gas, EDF and other large retailers; specialists such as Crown Gas &
      Power and SmartestEnergy compete for complex business portfolios; customers can
      remain on conventional fixed or standard-variable tariffs; and utility buyers can
      retain SAP IS-U, Gentrack, Junifer, Oracle or internally managed legacy stacks instead
      of moving to Kraken. Octopus has already crossed incumbent scale: its April 2024
      release reported 6.8 million UK households and 22% market share, while the Guardian
      reported 23.7% of Great Britain households at end-2024 and a 2026 retail review
      estimated roughly 24% of both electricity and gas customers. Those figures use
      different dates and possibly different denominators, so they establish leadership
      rather than one interchangeable time series.
    claimRefs: [CP001, CP002, CP003, CP005, CP006]
    tableRefs: [TP001]
  - id: differentiation
    title: Capability, distribution and buyer trade-offs
    body: >-
      Retail differentiation comes from product breadth and software-enabled operation,
      not absolute price leadership. The retained review lists standard-variable, fixed,
      daily wholesale-linked, half-hourly, EV and heat-pump-oriented tariffs. WIRED
      separately describes half-hourly pricing and automated EV charging against cheaper
      overnight periods. For utility buyers, PEF describes Kraken as one cloud platform
      spanning accounts, meter data, tariffs, billing, payments, collections, customer
      contact and industry flows. That integration raises switching cost because migration
      combines data conversion, operating-model redesign and regulatory continuity. It is
      also a limitation: PEF says water requires more design than energy retail, and the
      commercial benefit depends on the licensee changing how it works. Octopus can
      distribute this model through its own retail reference base and third-party licenses,
      but the assigned evidence does not provide controlled capability scores for peers.
    claimRefs: [CP004, CP006, CP007, CP008, CP010, CP014]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability
    title: Pricing, lock-in and moat durability
    body: >-
      Public pricing evidence supports contract structure, not realized economics. The
      retail review says Octopus is usually 1–4% above the headline cheapest fixed offer
      and weaker than specialist B2B suppliers for highly tailored multi-site portfolios.
      PEF says Kraken uses long-term per-account licensing, while actual license prices and
      total migration costs are rarely published. The moat therefore rests on lower
      operating cost, repeatable migration and trust rather than a disclosed price premium.
      WIRED relays an Octopus executive's claim of at least 50% lower cost to serve than
      most rivals, but that is not an audited benchmark. The Guardian's July 2025 item on
      £1.5 million of payments after final-bill failures affecting 34,000 prepayment
      customers shows that scale and software do not eliminate operational risk. McKinsey's
      wider transition scenarios add entrant and substitution risk because infrastructure,
      affordability, permitting and supply constraints can shift which retail and
      flexibility models win.
    claimRefs: [CP005, CP009, CP011, CP012, CP013, CP015, CP016]
    tableRefs: [TP003]
