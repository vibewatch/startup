  - id: TP002
    title: Feature / capability matrix
    columns: [Buying criterion, Octopus retail or Kraken, Incumbent retailers, Specialist B2B suppliers, Legacy platform or internal build, Evidence status]
    rows:
      - [Tariff breadth, "Standard-variable, fixed, daily-linked, half-hourly, EV and heat-pump offers reported", "Unknown on a matched current basis", "Tailored half-hourly products reported as a specialist strength", "Not applicable to a software stack alone", "Octopus and specialist claims supported; incumbent cells remain unknown"]
      - [Integrated customer operations, "Accounts, meter data, billing, payments, collections and contact described in one platform", "Unknown in assigned evidence", "Unknown in assigned evidence", "Multiple legacy products or internal processes may remain", "Kraken description and named legacy estates supported; peer implementation detail absent"]
      - [Operating-model change, "Kraken expects customer-facing teams to change how they work", "Unknown in assigned evidence", "Unknown in assigned evidence", "Status quo avoids immediate transformation", "Migration burden is supported; comparative burden is not quantified"]
      - [Sector fit, "Strongest in retail energy; water requires additional design", "Retail incumbency evident", "Business-energy specialization evident", "Existing sector customization may reduce replacement urgency", "No normalized cross-sector success rate is public in the pool"]
      - [Customer experience, "Digital account access and service strengths reported", "No controlled benchmark retained", "Account management cited as a specialist advantage for complex portfolios", "Depends on the utility's processes and interfaces", "Evidence is qualitative rather than a matched survey"]
    notes: "Unknown means that the assigned pool contains no comparable evidence; it is not a negative score. Vendor and company claims are not treated as independent benchmarks."
    claimRefs: [CP004, CP005, CP006, CP008, CP010]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Offer or model, Price or contract basis, Included capability, Public unknown, Competitive implication]
    rows:
      - [Octopus Flexible, "Standard-variable tariff under the Ofgem cap", "Default household energy supply", "Exact current unit rates and realized margin not retained", "Competes primarily on service and product breadth"]
      - [Octopus 12M Fixed, "Twelve-month fixed deal, described as at or just below the cap", "Price certainty for the contract period", "Matched rival quote and discounting unavailable", "The retained review says Octopus is not usually the absolute cheapest"]
      - [Octopus Tracker and Agile, "Daily wholesale-linked or half-hourly prices", "Dynamic pricing for smart-meter customers", "Customer savings distribution and engagement costs unavailable", "Differentiates on flexibility but transfers attention and volatility risk to the customer"]
      - [Octopus Go and Cosy Octopus, "Time-window tariffs; exact rates not retained", "EV charging or heat-pump-oriented usage windows", "No standardized peer tariff comparison", "Device-specific packaging can deepen ecosystem attachment"]
      - [Kraken license, "Long-term per-account annual license", "Utility operating platform plus migration and operating-model program", "License price, migration cost, discounts and payback remain private", "Lock-in depends on operational integration and demonstrated cost takeout"]
    notes: "The table reports public pricing structures, not realized revenue or margin. Exact rates vary by time and customer profile, while Kraken economics require private contracts and implementation data."
    claimRefs: [CP004, CP005, CP009, CP010, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: "Ordinal positions separate product or operating-model flexibility from the change burden required to adopt it; coordinates are analytical judgments, not market measurements."
    data:
      points:
        - {label: "Octopus conventional tariffs", x: 3, y: 1, note: "Broad retail service with limited behavior change for Flexible or fixed customers"}
        - {label: "Octopus dynamic tariffs", x: 5, y: 4, note: "High flexibility, with smart-meter and customer-engagement requirements"}
        - {label: "Specialist B2B suppliers", x: 4, y: 4, note: "Tailored multi-site capability with more complex procurement and account needs"}
        - {label: "Incumbent retail offers", x: 2, y: 2, note: "Installed distribution is clear, but matched current capability data is unavailable"}
        - {label: "Kraken platform", x: 5, y: 5, note: "Integrated platform with substantial migration and operating-model change"}
        - {label: "Legacy stack or internal build", x: 3, y: 5, note: "Retains existing customization but preserves legacy complexity and internal ownership"}
      xAxis: "Product or operating-model flexibility (ordinal 1–5)"
      yAxis: "Adoption and organizational-change burden (ordinal 1–5)"
    approximationNotes: "Coordinates are evidence-backed ordinal judgments from retained qualitative sources; they are not market shares, prices, or audited performance scores."
    claimRefs: [CP004, CP007, CP008, CP010, CP015]
callouts:
  - calloutType: strength
    title: "Retail reference base plus software distribution"
    body: "Octopus can test operating changes in its own scaled retail business while licensing Kraken to third-party utilities, joining a customer-facing distribution advantage to a software platform."
    claimRefs: [CP002, CP006, CP014]
  - calloutType: risk
    title: "Migration and trust are the moat's failure modes"
    body: "Kraken's value requires difficult data and operating-model change, while the reported prepayment final-bill failures show that customer trust can still be damaged at scale."
    claimRefs: [CP007, CP013]
  - calloutType: recommendation
    title: "Underwrite the missing peer metrics"
    body: "Obtain matched retail quotes, Kraken contracts, migration post-mortems, defect rates, churn and peer service data before assigning a durable pricing or execution premium."
    claimRefs: [CP009, CP012, CP015]
