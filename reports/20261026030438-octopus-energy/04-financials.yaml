company:
  name: Octopus Energy
chapter:
  number: 4
  title: Financials
  summary: Octopus Energy's FY25 accounts show a large, diversified energy platform with £13.7bn of revenue, positive underlying EBITDA, but a statutory loss and materially lower cash after the Bulb facility repayment. The strongest underwriting evidence is the audited operating and liquidity disclosure; key gaps remain realized pricing, standalone Kraken economics after the planned demerger, and forward capital needs.
sections:
  - id: revenue-engine
    title: Revenue engine and monetization
    body: >-
      Octopus combines regulated energy supply with software licensing, metering, low-carbon services, EV leasing, charging, and renewable-generation management. FY25 revenue was £13,683m, up 10% year-on-year, and energy supply accounted for £13,027m, so the retail book remains the economic center of gravity even as non-retail businesses scale. Kraken provides a second monetization layer: recurring licensing revenue from non-Octopus clients reached £102m, while contracted ARR reached £422m; these are different measures and the latter is a forward contracted metric rather than recognized revenue. The accounts also identify metering, other services, EV leasing, and generation-management revenue, allowing a transparent bridge without treating customer counts, contracted accounts, or assets under management as revenue. Public evidence does not disclose realized tariff pricing, customer-level contribution margins, or standalone Kraken cost of revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-costs
    title: Margin path and operating economics
    body: >-
      The operating model has attractive scale signals but thin gross economics and substantial exposure to weather, wholesale costs, customer credit, and growth investment. Group gross margin declined from 9.0% in FY24 to 8.4% in FY25, while reported EBITDA moved to a £93m loss and underlying EBITDA remained positive at £90m after specified one-off adjustments. The FY25 net loss of £255m is not a cash-burn measure. The Guardian later reported a £1.5m customer payout after Ofgem found final-billing failures affecting 34,000 former prepayment customers. In the UK retail subsidiary, FY24 bad debt rose to 2.9% of revenue and the working-capital ratio fell to 0.80, illustrating why customer affordability and supplier settlement mechanics matter to underwriting. Public sources do not provide CAC, payback, churn, cohort gross margin, or service-level unit costs.
    claimRefs: [CI006, CI008, CI009, CI010, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      FY25 ended with £1,512m of cash and restricted cash and £1,482m of net assets, but the cash balance was down from £4,202m after repayment of the £2,838m government facility associated with the Bulb WAMA arrangements. The accounts say that repayment came from ring-fenced cash and did not affect operating liquidity, while also identifying £292m of long-term borrowings largely secured against EV fleet assets. Tracxn's reported funding total and latest round provide financing context, not evidence of cash available. The UK retail business is reported above Ofgem's capital floor and on an agreed path toward a £115 per dual-fuel-customer target, but the published narrative does not provide a full group liquidity bridge, covenant schedule, commodity-credit exposure, or the capital allocation required for the planned Kraken demerger. Liquidity is disclosed, yet runway, financing dependency, and downside headroom remain data-room questions.
    claimRefs: [CI011, CI012, CI013, CI014]
  - id: financial-verdict
    title: Financial verdict and diligence priorities
    body: >-
      The financial case is strongest as a scale-and-platform story, not as a clean standalone software multiple or a high-margin retail compounder. Energy supply generated most FY25 revenue, while Kraken's £422m contracted ARR and £102m of non-Octopus licensing revenue show a meaningful software option; however, the reported group loss, 8.4% gross margin, and sensitivity to weather demonstrate that growth is capital- and execution-intensive. The company reports liquidity protections and positive underlying EBITDA, but those disclosures are company-issued and do not replace independent verification of realized economics. Independent and syndicated coverage corroborates distribution scale, while Canary Media explains why an installed retail relationship may reduce acquisition friction for adjacent products; none supplies cohort economics. Underwriting should therefore require the latest entity-level accounts, Kraken segment P&L and demerger capitalization, tariff contribution by cohort, bad-debt and churn history, commodity collateral terms, EV-fleet debt covenants, and a 24-month downside cash plan.
    claimRefs: [CI003, CI006, CI011, CI014, CI016]
callouts:
  - calloutType: strength
    title: Scale is translating into multiple revenue layers
    body: FY25 combines £13,027m of energy-supply revenue with disclosed licensing, metering, services, leasing, and generation-management revenue, while Kraken contracted ARR doubled to £422m.
    claimRefs: [CI001, CI003, CI004]
  - calloutType: risk
    title: Statutory loss and cash reduction complicate the headline growth story
    body: FY25 reported a £255m net loss and ended with £1,512m of cash and restricted cash versus £4,202m in FY24 after the Bulb facility repayment; neither figure alone establishes cash burn or runway.
    claimRefs: [CI006, CI011, CI012]
  - calloutType: recommendation
    title: Make the next financing decision contingent on entity-level evidence
    body: Before underwriting, obtain Kraken standalone economics, group and retail liquidity schedules, tariff cohort margins, debt terms, and a downside cash plan rather than extrapolating from contracted ARR or reported revenue.
    claimRefs: [CI003, CI014, CI016]
