    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Group gross margin, 8.4, "High for reported FY25 figure", "Shows thin consolidated gross economics", "Bridge margin by retail, Kraken, services, leasing, and generation"]
      - [UK retail gross margin, null, "Unavailable publicly in assigned sources", "Retail is the largest revenue engine", "Provide entity and tariff-cohort margin bridge"]
      - [Bad debt charge as share of OEL revenue, 2.9, "High for FY24 disclosed figure", "Customer affordability directly affects cash conversion", "Provide FY25/FY26 bad-debt aging and recoveries"]
      - [Customer acquisition cost, null, "Unavailable", "Tests whether growth is value-accretive", "Provide CAC by channel, geography, and cohort"]
      - [CAC payback, null, "Unavailable", "Separates scale from economic quality", "Provide payback under current tariff and churn assumptions"]
      - [Churn or retention, null, "Unavailable in assigned evidence", "Drives lifetime value and hedge planning", "Provide cohort churn, tenure, and product-switch data"]
      - [Kraken standalone gross margin, null, "Unavailable", "Central to any software valuation", "Provide standalone P&L and allocated cost policy"]
      - [Cash and restricted cash, 1512, "High for FY25 year-end reported figure", "Liquidity buffer after Bulb facility repayment", "Reconcile unrestricted cash, restrictions, and minimum operating buffers"]
      - [Long-term borrowings, 292, "High for FY25 year-end disclosed figure", "Signals secured fleet financing obligations", "Provide debt maturities, covenants, and asset coverage"]
    notes: "Values are in £m unless otherwise stated; null means the assigned public evidence does not disclose the metric. Missing values are specific data-room requests, not zeroes or estimates."
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI013, CI014, CI015, CI016]
