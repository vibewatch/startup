company:
  name: Octopus Energy
chapter:
  number: 8
  title: Valuation
  summary: Octopus Energy has a credible strategic asset in Kraken, but the public record supports a tracking posture rather than a buy because the parent company's post-demerger economics, ownership rights, and cash generation are not disclosed.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The strongest public valuation signal is the December 2025 Kraken financing:
      investors bought about $1 billion of equity at an $8.65 billion valuation,
      while Octopus investors committed a further $320 million directly to the
      parent. Kraken was contracted to serve more than 70 million accounts and
      reported contracted annual revenue above $500 million, but those are
      company-reported contracted metrics rather than audited Octopus revenue or
      cash flow. The transaction also leaves Octopus with a 13.7% Kraken stake,
      creating a potentially valuable asset while separating the software
      platform from the retail and generation businesses. WIRED relayed an
      Octopus executive's historical claim of at least 50% lower cost to serve
      than most rivals, but that is a company assertion rather than an
      independent benchmark. The anti-thesis is sharper in the Guardian's report
      of a £260 million pre-tax accounting loss for the 12 months to April 2025,
      despite 10% revenue growth to £13.7 billion, and its current index's record
      of a £1.5 million payment over final-billing errors. I therefore rate the
      evidence-sensitive decision as track: the asset story is credible, but
      entry price and downside cannot be underwritten with precision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV014, CV016]
    tableRefs: [TV001, TV002]
  - id: scenarios
    title: Scenario valuation and entry discipline
    body: >-
      A scenario framework is more defensible than a single target because the
      observable valuation belongs to Kraken, not to the whole Octopus group.
      The bull case assumes Kraken converts its contracted-account scale and
      contracted annual revenue into independently reported recurring revenue,
      while Octopus compounds the retained minority stake and the additional
      parent financing into growth. The base case assumes continued platform
      adoption but applies a material information discount because contracted
      revenue is not the same as recognized revenue and because the parent's
      disclosed results do not isolate post-demerger segment margins, cash flow
      or capital structure. The bear case assumes weaker conversion, customer
      concentration or regulatory and billing execution pressure, with the
      retained stake illiquid and the parent needing more capital. The scenario
      values below are decision bands, not forecasts: no public source supports
      a precise Octopus equity value or probability-weighted return. A buyer
      should require a cap table, audited segment economics, debt and preference
      terms, and evidence that Kraken's commercial contracts renew before
      treating the financing mark as an investable price.
    claimRefs: [CV006, CV007, CV008, CV009, CV014]
    tableRefs: [TV003]
  - id: decision
    title: Recommendation and diligence gates
    body: >-
      Octopus has strategic optionality: the Kraken demerger can improve
      neutrality with third-party utilities, and the parent retains exposure to
      a separately financed software asset. The decision remains constrained by
      information asymmetry. Reuters says the reported IPO path could not be
      independently verified, and the company-facing announcement describes
      separate governance and cap tables without publishing the full ownership
      economics. The Guardian index shows both commercial momentum, including a
      23.7% Great Britain household share at the end of 2024, and a material
      control failure requiring a £1.5 million payment; neither is a substitute
      for audited margin, working-capital, or cash-burn data. The recommended
      monitor is therefore explicit. Tracxn's October 2026 profile records 12
      acquisitions across six sectors and five countries, but the latest deal
      price is not public; that breadth adds a capital-allocation diligence need,
      not a valuation comparable. Upgrade only after verified Kraken recognized
      revenue and retention, parent audited segment accounts, the full preference
      and dilution stack, and a documented path to liquidity. A thesis break is
      a down-round, loss of a major utility contract, material regulatory
      remediation, or capital need that dilutes the retained Kraken stake without
      commensurate value creation.
    claimRefs: [CV010, CV011, CV012, CV013, CV015]
    figureRefs: [FV001]
