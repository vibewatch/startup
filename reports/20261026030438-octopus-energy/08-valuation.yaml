    claimRefs: [CV001, CV003, CV011]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Kraken creates strategic optionality", "70m+ contracted accounts and $500m+ contracted annual revenue are reported", "Audited conversion, renewal and margin data"]
      - ["The financing mark is informative", "New and existing investors bought about $1bn of Kraken equity at $8.65bn", "Independent terms, preferences and comparable transactions"]
      - ["Parent exposure is valuable", "Octopus retains 13.7% of Kraken after demerger", "Verified stake economics and liquidity path"]
      - ["Parent profitability is not established", "The Guardian reported a £260m pre-tax accounting loss for the 12 months to April 2025 despite 10% revenue growth", "Audited post-demerger segment margins and cash flow"]
      - ["Operating execution is a valuation risk", "Guardian index records a £1.5m payment over final-billing errors", "Completed remediation and sustained control metrics"]
      - ["IPO optionality is unproven", "Reuters says the reported listing path was not independently verified", "Filed timetable, prospectus or executed transaction"]
    notes: "Arguments are evidence-linked; the final column identifies falsifiable diligence rather than assuming a catalyst."
    claimRefs: [CV002, CV004, CV010, CV012, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario bands
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Kraken converts contracted scale into durable recognized recurring revenue; Octopus grows retail and clean-tech operations", "Retained 13.7% stake appreciates and parent financing funds profitable expansion; no target value asserted", "Execution, concentration, regulatory", "Lower-probability upside; requires audited confirmation"]
      - [Base, "Kraken adoption continues but conversion, margins and parent cash flow remain partly opaque", "Use the $8.65bn Kraken mark only as a reference point and apply an information discount to parent exposure", "Illiquidity, preference terms, working capital", "Most supportable current posture"]
      - [Bear, "Contract renewals weaken or parent needs additional capital while controls and regulation remain pressured", "Retained stake is marked down or diluted; downside cannot be quantified from public data", "Down-round, dilution, remediation, customer loss", "Material downside; trigger is monitorable"]
      - [Entry rule, "No verified Octopus equity price or full capital structure in the public pool", "Do not convert the Kraken mark into a whole-company price or target return", "False precision and adverse selection", "Binding diligence gate"]
      - [Exit rule, "Liquidity requires a documented transaction or independently verified market", "Reassess on a filed IPO, sale, or transparent secondary with terms", "Locked-up minority stake", "Event-driven"]
    notes: "Bands are qualitative because the pool does not disclose Octopus net debt, ownership preferences, recognized revenue, cash burn, or a comparable-company set."
    claimRefs: [CV006, CV007, CV008, CV009, CV013]
