callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: "The $8.65bn Kraken financing mark is meaningful evidence of investor demand for the software asset, but it does not establish Octopus's equity value or a price-sensitive return."
    claimRefs: [CV001, CV006, CV011]
  - calloutType: risk
    title: Capital-structure opacity
    body: "The retained 13.7% stake, preference terms, debt and parent cash generation need primary documentation before the financing mark can support an entry price."
    claimRefs: [CV003, CV008, CV013]
