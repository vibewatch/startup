company:
  name: Octopus Energy
chapter:
  number: 6
  title: Customers
  summary: Octopus has strong evidence of UK retail scale, switching momentum, broad product surfaces and utility-partner adoption. Public evidence does not establish cohort retention, customer-level economics or concentration, and a documented final-billing failure shows that service quality must be monitored as the base expands.
sections:
  - id: customer-base
    title: Customer base and segment fit
    body: >-
      Octopus addresses two distinct customer layers. Its retail layer serves household and business bill payers buying electricity or gas, with adjacent smart tariffs, EV charging, solar, batteries and heat pumps. Its platform layer serves utility operators such as Origin Energy through Kraken. The January 2025 company release reported 12.885 million UK meters on supply at the end of 2024, while Reuters reported a 22% UK domestic electricity share at the end of 2023. Those metrics differ in date, unit and perimeter; neither should be restated as a current retained-customer count.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Acquisition and adoption trajectory
    body: >-
      The public record supports rapid acquisition but not a clean retention curve. ESG News reported more than 1.9 million net customers added since the first quarter of 2023 and more than 800,000 customers switching in 2023. Octopus later reported nearly one million 2024 switchers, expressly excluding customers acquired through corporate transactions and not deducting departures. Origin separately reported more than 400,000 retail-brand customer accounts added in the first quarter of 2024 and 7.7 million households served globally. These observations show momentum, but their different periods and denominators prevent a valid cohort or churn calculation.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof and durability signals
    body: >-
      Named proof spans a production retail user, technology integrations and a utility license. WIRED's customer account described half-hourly pricing, automated overnight EV charging and smart-meter billing. UNC reported that Ford, BYD, Mitsubishi Electric and Daikin were integrating products with Kraken at the Manchester EnTech Superhub, though the article did not quantify production adoption. Origin described licensing Kraken for retail operations with a service-and-cost objective. Octopus also cites repeated Which? recognition, but awards and testimonials do not substitute for gross retention, renewal, contract-duration or customer-level margin data.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: expansion-and-risk
    title: Expansion loop and customer risk
    body: >-
      The expansion thesis begins with the retail account and adds time-varying tariffs, connected vehicles, solar export, batteries and heat pumps. This creates more customer touchpoints and can shift consumption, but the assigned evidence does not quantify attach rates, incremental revenue, repeat usage or lifetime value. Service execution is also not uniformly positive: the Guardian's Octopus index records an Ofgem finding involving missing final bills for 34,000 former prepayment customers and a £1.5 million payout. Scale and product breadth are therefore credible; durable economics, concentration and operational consistency remain diligence questions.
    claimRefs: [CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Acquisition scale is independently visible
    body: Reuters' Ofgem-based market-share report corroborates Octopus's position as the largest UK domestic electricity supplier, while separate disclosures show continued switching momentum.
    claimRefs: [CU003, CU005, CU007]
  - calloutType: risk
    title: Durability remains unproven
    body: Public sources establish customer additions and service signals, but not churn, renewal, product attach rates, cohort economics or customer concentration.
    claimRefs: [CU012, CU015]
