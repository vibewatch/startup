callouts:
  - calloutType: risk
    title: Most material residual risk
    body: "Octopus's scale amplifies both upside and failure propagation: the public record describes millions of households, multi-country utility software, and billions of pounds of managed renewable assets, but does not provide current independent assurance on controls, uptime, liquidity, or concentration."
    claimRefs: [CR009, CR013, CR014, CR015]
  - calloutType: recommendation
    title: Diligence gate before increasing conviction
    body: Require current hedging and liquidity schedules, incident and uptime history, customer-balance remediation evidence, regulator correspondence, and top-counterparty concentration before treating operating scale as evidence of low risk.
    claimRefs: [CR002, CR007, CR010, CR016]
