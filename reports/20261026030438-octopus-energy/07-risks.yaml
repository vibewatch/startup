    notes: The table separates historical company disclosures from unverified current operating metrics; no absence-of-incident inference is made.
    claimRefs: [CR001, CR002, CR009, CR010, CR011, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, counterparty or role, failure scenario, severity, mitigation, residual exposure, monitoring indicator]
    rows:
      - [Kraken platform, "affiliated utility-software platform and licensees", "Service outage or adverse spinout governance reduces retail and licensing capability", high, "Separate governance and external utility customer base", Medium-high, "Uptime, service credits, renewal, and related-party governance disclosures"]
      - [Wholesale and balancing ecosystem, "energy markets and counterparties", "Price shock or inadequate hedging compresses margin or liquidity", high, "Hedging discipline and market reform advocacy", High, "Hedge coverage, collateral calls, and customer-balance funding"]
      - [Renewable project portfolio, "developers, grid operators, and investors", "Delay, curtailment, or underperformance reduces generation returns", medium-high, "Portfolio management and diversification", Medium-high, "Project availability, curtailment, grid-connection, and covenant data"]
      - [Government and regulator relationships, "Ofgem and UK policy makers", "Policy reversal or enforcement increases cost and limits product design", medium-high, "Ongoing policy engagement and compliance processes", Medium-high, "Consultations, enforcement notices, and licence conditions"]
    notes: Counterparty identities and mitigation descriptions are drawn from public sources; concentration, contractual protections, and service-level terms remain unverified.
    claimRefs: [CR003, CR005, CR013, CR014, CR015, CR016]
