  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rate, contract length, and cohort retention curves for AVITI and AVITI24 accounts.
    whyItMatters: Without cohort economics, repeat-order signals cannot be converted into an underwriting view of durability or net expansion.
    diligencePath: Ask management for three-year cohort tables by product family, renewal rates by segment, and a revenue walk from first system sale to consumables and expansion.
    relatedQuestionRefs:
    - QU016
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: review-density
    missingEvidence: Independent customer references, review volumes, and blind reference-call transcripts outside company-curated testimonials.
    whyItMatters: The current public corpus is too sparse to validate satisfaction or support consistency across a 450-plus placed-system installed base.
    diligencePath: Obtain third-party customer-reference lists by segment and geography, plus recent support/NPS or ticket-resolution metrics audited outside marketing.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A fuller list of named production accounts, account status, and expansion history across the public installed base.
    whyItMatters: Public named proof is good enough to establish real adoption but still too incomplete to judge breadth, concentration, or repeatability.
    diligencePath: Request a top-25 account list with deployment status, product mix, and most recent reorder date, then reconcile it to public references and partner-led accounts.
    relatedQuestionRefs:
    - QU020
    - QU027
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: material
    topic: clinical-procurement-path
    missingEvidence: Direct evidence of AVITI clinical procurement, CE-IVDR progress milestones, and customer wins outside partner-mediated workflow bundles.
    whyItMatters: Clinical and diagnostics upside is part of the expansion story, but direct regulated-market readiness is still partly outsourced to partners such as Medicover.
    diligencePath: Ask for instrument-level CE-IVDR / FDA timelines, direct clinical-customer pipeline data, and any closed wins where the instrument itself cleared procurement as the lead platform.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
    - TU006
  - type: private-evidence-only
    severity: material
    topic: concentration-and-procurement-friction
    missingEvidence: Top-customer revenue share, lost-deal logs, delayed procurements tied to litigation or exclusivity pressure, and partner-attributed pipeline conversion.
    whyItMatters: Concentration risk and procurement friction may be manageable, but public evidence does not quantify either the exposure or the cost of those frictions.
    diligencePath: Review CRM pipeline data, top-10 account concentration, competitive win/loss analysis, and any documented purchase delays tied to lawsuits, switching costs, or incumbent discounting.
    relatedQuestionRefs:
    - QU020
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
