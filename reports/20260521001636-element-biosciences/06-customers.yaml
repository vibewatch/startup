    - Switching is feasible but not frictionless
    - Need per-assay migration playbooks and failure-rate data
  - - Legal and channel uncertainty
    - Element alleged customer coercion by Illumina, while 10x/Harvard sued over AVITI24 and Teton
    - Element, incumbents, courts
    - Risk-averse procurement teams may slow purchase decisions until disputes clarify
    - No public disclosure of lost deals, delayed buys, or settlement timing
