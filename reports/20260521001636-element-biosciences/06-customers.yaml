      label: Initial commercial demand
      detail: Element publicly moved from >100 orders to >160 orders / 112 installed instruments before reaching >450 systems placed worldwide by end-2025.
    - id: validation
      label: Technical validation
      detail: Prospects validate data quality, cost, compatibility, and assay-specific fit through benchmarks, core-facility pilots, or partner workflows.
    - id: integration
      label: Workflow integration
      detail: QIAGEN, IDT, Revvity, Agilent, biomodal, and Medicover address panels, analysis, service delivery, or multiomics so the platform fits real lab operations.
    - id: deployment
