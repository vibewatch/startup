callouts:
- calloutType: strength
  title: Installed-base momentum is real, not just narrative
  body: Element's customer evidence is imperfect, but the combination of >450 systems placed, doubled consumables shipments, multi-unit orders, and repeat capacity adds shows a real commercial foothold. The data do not yet prove durable customer economics, yet they do clear the bar for genuine product-market acceptance in research sequencing.
  claimRefs:
  - CU004
  - CU010
  - CU012
  - CU031
  - CU032
- calloutType: insight
  title: Partner enablement is the main expansion wedge
  body: 'The fastest path into new customer surfaces appears to be partner-led: QIAGEN for analysis, IDT and Agilent for workflow compatibility, Revvity for service-lab reach, biomodal for multiomics, and Medicover for clinical deployment. Element is not winning purely on box economics; it is winning when surrounding workflow friction is reduced enough for a lab to switch.'
  claimRefs:
  - CU016
  - CU020
  - CU021
  - CU027
  - CU038
  - CU039
- calloutType: risk
  title: Durability and concentration remain the chapter's core unresolved risks
  body: The public record still cannot tell an investor how concentrated Element's revenue is, how many placed systems renew or expand after year one, or how legal and regulatory friction affects procurement velocity. That missing denominator is the main reason the chapter stops short of calling the customer base fully durable despite strong lighthouse references.
  claimRefs:
  - CU030
  - CU036
