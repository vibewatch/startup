- id: expansion-concentration-and-friction
  title: Expansion Motion, Concentration Risk, and Procurement Friction
  body: 'Element''s expansion motion depends heavily on workflow-enablement partners and on lowering the cost

    of switching from incumbent platforms. QIAGEN, IDT, Revvity, and biomodal all frame their AVITI

    integrations as solutions for downstream analysis, native library preparation, service-lab

    operations, or multiomic compatibility. Medicover goes one step further by packaging AVITI into an

    end-to-end clinical workflow that partner laboratories can deploy. This pattern is strategically

    helpful because it broadens the reachable customer set without Element having to solve every assay,

    software, and regulatory problem alone. It also reveals where expansion risk sits: if workflow

    partners underperform, delay integration, or fail to convert their own installed bases, Element''s

    commercial leverage into regulated and enterprise settings could slow.


    Procurement friction is real in the reviewed sources. UC Davis noted that the chemistry is different

    even though file compatibility is preserved; University of Minnesota found AVITI reverse reads

    required trimming to 160 bp for comparable 16S performance; Medicover explicitly said AVITI was not

    CE-IVDR marked when it integrated the instrument; and ongoing litigation adds a fresh layer of risk

    for customers evaluating AVITI24-based multiomics workflows. Element''s own 2025 antitrust filing

    and LegalEra''s summary of it argue that Illumina used exclusivity pressure against at least one

    Element customer, while GenEngNews reported 10x/Harvard''s suit against AVITI24 and Teton. None of

    this proves customer attrition, but it does mean public proof is still concentrated in lighthouse

    accounts and partner channels, with no disclosed top-customer share, renewal cohorts, or explicit

    safeguards against concentration.'
