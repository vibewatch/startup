  rows:
  - - Library-prep compatibility
    - Cloudbreak Freestyle claimed >95% kit compatibility; IDT launched AVITI-specific adapters and blockers; Agilent cited SureSelect compatibility
    - Element, IDT, Agilent
    - Makes incumbent-library migration less painful for existing NGS labs
    - Labs still need internal validation and SOP updates
  - - Downstream analysis and reporting
    - QIAGEN paired QIAseq panels with CLC LightSpeed and QCI Interpret workflows for AVITI users
    - QIAGEN
    - Reduces informatics burden for oncology and hereditary applications
    - No public conversion data from workflow interest to contracted accounts
  - - Hands-on operational adoption
    - Broad, NEB, FYR Diagnostics, and University of Utah all highlighted installation or support quality
    - Element field team and lighthouse users
    - Strong support can speed first deployment and referenceability
    - Public record lacks large-sample satisfaction or renewal statistics
  - - Application-specific tuning
    - UC Davis emphasized chemistry changes despite file compatibility; UMN had to trim reverse reads to 160 bp for 16S comparability
