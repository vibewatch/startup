figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: 'Shows how Element typically wins an account: researchers first surface dissatisfaction with incumbent cost or quality, then validate AVITI technically, then rely on workflow partners and field support to reach multi-system or multiomic expansion.'
  data:
    items:
    - label: Incumbent pain / discovery
      note: Prospect is usually an existing NGS user seeking lower run economics, higher quality, transparent pricing, or more flexible batching than legacy benchtop systems provide.
    - label: Side-by-side validation
      note: Customer compares AVITI against an incumbent platform on FFPE, 16S, target-enrichment, or low-depth assays; independent and customer-hosted comparisons at Gencove, UC Davis, UMN, and the AVITI utility paper fit this stage.
    - label: Workflow enablement
      note: QIAGEN, IDT, Agilent, Revvity, and biomodal reduce friction in panels, reagents, analysis, or multiomics so the customer does not need to rebuild the full stack alone.
    - label: Operational deployment
      note: Instrument install, training, and first data generation become the conversion moment; Broad, NEB, FYR Diagnostics, and University of Utah all highlighted implementation support quality.
    - label: Expansion / AVITI24 upsell
      note: Customer adds capacity, buys multiple units, or expands into AVITI24 multiomics; repeat orders, multi-unit sales, and strong pharma uptake on AVITI24 are the clearest public signals for this phase.
  claimRefs:
  - CU002
  - CU010
  - CU016
  - CU020
  - CU031
  - CU036
  - CU038
