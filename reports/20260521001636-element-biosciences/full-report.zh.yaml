      - number: '3.3'
        title: 服务商和现状替代品
        blocks:
          - type: paragraph
            body: >-
              最容易被低估的 Element 替代品不是实验室里的另一台机器，而是完全不买机器。Northwestern 的 FY26 定价页面公开并列列出 Illumina NovaSeq
              X、DNBSEQ、AVITI、PacBio Revio 和 Nanopore PromethION 服务价格，意味着买方可以比较输出经济性，而不必投入资本开支或内部人员。Azenta 旗下 GENEWIZ
              宣传基于 Illumina NovaSeq X、PacBio Revio 和 Oxford Nanopore 平台的样本到分析 NGS 服务；Novogene 则营销覆盖
              Illumina、Ultima、PacBio 和 Nanopore 的更宽组合，并声称每年最高可处理 200,000 个人类基因组。Novogene 还在 Ultima 上提供预制文库测序，并明确接受
              Ultima 和 Illumina 兼容文库，且包含转换。


              服务层改变了切换成本的计算。实验室可以保留既有文库工作流，只购买自己需要的分析，或把项目拆给多个供应商，而不是标准化在一个仪器产品族上。服务商还把多归属制度化：同一组织可以把短读长 WGS 分给 Illumina
              或 Ultima，把长读长分给 PacBio 或 ONT，把靶向或单细胞工作交给当周最便宜或最快的平台。Element 有证据显示切换到 AVITI
              可行——其早期客户群偏向有经验的升级用户，客户评价也强调管线集成容易——但降低采用门槛的开放性，也降低了离开的门槛。承销视角下，重外包买方和间歇使用的实验室，尤其容易停留在现状，而不是建立持久的内部
              Element footprint。
