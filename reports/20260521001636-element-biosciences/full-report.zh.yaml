      - number: '4.3'
        title: 资本基础和充足性
        blocks:
          - type: paragraph
            body: >-
              对一家私营测序工具公司而言，Element 的资本基础很厚，但仍难承销其充足性。2024 年 7 月，公司完成 Wellington 领投、超过 $277 million 的 Series D，使累计融资超过
              $680 million。管理层称，融资款将用于继续商业化 AVITI 和推出 AVITI24。这段历史支持一个结论：Element 已经能获得足够外部资本，用于制造仪器、资助现场支持，并吸收挑战
              Illumina 台式测序所需的商业爬坡。


              公开记录没有给出前瞻现金方程。检索到的来源没有披露 Series D 之后的账上现金、总烧钱或净烧钱、债务工具，或董事会层面的现金跑道目标。这个遗漏尤其重要，因为公司同时在为临床应用投资制造质量系统、推出
              AVITI24 等新工作流，并准备让 VITARI 在 2026 年下半年可用。所有动作在变成利润率增厚项之前都会消耗资本。因此，公开证据只能支持一个方向性结论：按私营市场标准，Element
              资金充足；但如果没有私人现金和利润率数据，无法判断这笔资金是否足以舒服穿越下一个产品周期。
