        - 在经营证据重新站稳前，退出任何按上一轮价格进入的机会。
      - - 装机基础质量
        - '>450 台已部署系统未按队列显示出持久的耗材拉动'
        - 成长故事会变成硬件铺设故事，客户终身价值更弱。
        - 用更低倍数重算估值，并要求提供队列数据。
      - - 诉讼姿态
        - 不利禁令风险、重大赔偿敞口，或不断升级的证据开示负担
        - 给模型增加直接的商业压力和现金流压力。
        - 暂停投资，拿到更新后的法律备忘录再重新接触。
      - - 监管路线图
        - IVDR / ISO 13485 / FDA 进展显著落后于管理层信号
        - 削弱临床和受监管市场扩张应享受溢价的论点。
        - 将情景从基准推向悲观，并移除临床溢价假设。
      - - 股权结构表 / 优先股堆叠
        - 高级清算条款在公开证据区间附近吸收大部分价值
        - 意味着企业价值上行无法转化为普通股上行。
        - 若不重新承销分配瀑布，不应推进。
    notes: 每个触发因素都可监控，并直接绑定估值传导，而不是泛泛的经营风险。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV044
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2026 收入桥
        - 从据报道约 $85M 的 2025 年基数出发，给出 2026 年季度收入和增长桥
        - 决定上一轮估值是在守住、继续复利，还是已经受损。
        - 要求提供 CFO 包、董事会材料和月度管理报告。
      - - 毛利率与服务经济性
        - 耗材毛利率、服务负担、保修准备金和仪器贡献利润率
        - 区分有韧性的平台经济性和单纯靠销量拉动的增长。
        - 管理层尽调会，加上审计师支持的盈利质量工作。
      - - 装机基础利用率
        - '>450 台系统装机基础的队列级复购率、利用率和耗材挂钩情况'
        - 验证装机是否在复利转化为经常性价值。
        - 按安装队列和客户细分导出商业分析数据。
      - - 客户集中度
        - 前 10 大客户收入占比、药企组合，以及续约 / 流失数据
        - 对一家仍未成规模的工具公司，集中度会迅速冲击倍数。
        - 销售运营和财务尽调，并用合同抽样支撑。
      - - 股权结构表与清算瀑布
        - 优先股堆叠、优先级、转换条款，以及任何参与型优先权特征
        - 决定各情景区间下投资人的真实回报结果。
        - 法务和财务数据室审阅，并配套瀑布模型。
      - - 诉讼风险
        - 外部律师关于禁令、赔偿、时间表和和解概率的备忘录
        - 在这个市场，法律悬顶直接影响估值。
        - 专业 IP / 反垄断律师审阅，并与管理层问答。
      - - 监管路线图
        - ISO 13485、IVDR 和 FDA 路径的项目计划、投入和里程碑
        - 若要承销任何临床或受监管市场溢价，这些材料必须先到位。
        - 质量 / 监管尽调，配套里程碑跟踪表和外部顾问审阅。
    notes: 在当前私募市场定价下，若要把公司视为不只是观察标的，至少需要完成这些尽调要求。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV052
      - CV053
