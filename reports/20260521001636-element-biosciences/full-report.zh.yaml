      - number: '1.3'
        title: 资本基础、商业规模和披露边界
        blocks:
          - type: paragraph
            body: >-
              Element 很快进入后期私营公司的规模。公开材料显示，公司 2017 年完成种子轮，2018 年完成 Series A，2019 年 A 轮后一年内又完成跟进 Series B，2021 年完成 $276
              million Series C，2024 年完成超额认购、金额超过 $277 million 的 Series D。Series D 新闻稿把累计融资推高到超过 $680 million，并引入
              Wellington Management、Samsung Electronics、Fidelity、Foresite、T. Rowe Price、Venrock
              等交叉投资者和战略方。同一新闻稿也展示商业进展：前一年 AVITI 放置量从约 40 台增至超过 190 台，客户覆盖超过 25 个国家。


              后续独立报道把规模图景又往前推了一步。GenomeWeb 报道称，2025 年收入约 $85 million，截至 2025 年底已放置超过 450 套系统，AVITI24 上市仅一年就贡献了超过 35%
              的新订单。公开记录仍未提供准确的当前估值、当前客户数或最新员工数。因此，公司看起来商业上真实、资本充足，但本章仍必须为几个封面指标保留明确的空值和尽调问题；这些指标通常是上市工具公司会默认披露的。
