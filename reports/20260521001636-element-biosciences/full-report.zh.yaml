      - number: '8.4'
        title: 最终尽调请求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍是临时性的。留存公开来源显示，公司有动能、有产品野心，也可能在测序和多组学中扮演战略角色，但它们没有展示足以支撑有信心价格发现的披露包。公开记录仍缺少经审计的 2026
              年收入和毛利率、按队列拆分的装机基础利用率、耗材复购行为、头部客户集中度、完整优先权瀑布，以及量化的诉讼风险备忘录。这些不是边角问题；它们决定上一轮估值究竟公平、偏高，还是已经受损。


              实际尽调路径因此很清楚。投资者需要一座 2026 年桥，把据报道约 $85 million 的 2025 年收入接到当前运行率收入，并拆出毛利率和服务经济性。他们需要队列级证据，证明 >450
              台系统基础带来持久耗材拉动，而不是前置硬件投放。他们需要外部律师为 Illumina
              争议划定边界。还需要股权结构表和清算条款，然后才能把任何企业价值情景当成现实的普通股结果。在这些材料到手前，正确姿态是监控，而不是追高。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
