      - number: '5.2'
        title: 可见架构把 avidity 化学、仪器控制、云端编排和生物信息工具拼在一起
        blocks:
          - type: paragraph
            body: >-
              Element 的公开架构足够具体，可以勾勒出一套运营栈。assay 层，公司把差异化锚定在 Avidite 或 avidity chemistry，以及围绕多价结合、flow
              cells、imaging、polymerases 和 primary analysis 的专利族。仪器层，产品页面和独立报道显示有双 flow-cell 系统、VITARI 的 lane
              control，以及在兼容性、输出和质量之间取舍的试剂盒族。更上一层是软件层，它比通用仪器 dashboard 更实质：ElemBio Cloud 处理计划运行、监控、存储连接和分析流程；Bases2Fastq
              及相关管线把原始运行输出转成标准下游文件。AVITI24 还通过 CytoCanvas 和公开 cytoprofiling libraries 拥有单独可视化表面。正确解读是，Element
              的护城河不只是湿实验室化学，而是化学、仪器固件、云管理和下游分析之间的编排。尽调风险在于，公开模块边界和变更管理政策仍远比整合平台的营销描述要薄。
