  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Element 的公开栈从检测化学和仪器硬件一路延伸到云端编排、FASTQ 生成，以及 AVITI24 专属下游分析。
    data:
      layers:
        - label: 样本制备与工作流选择
          detail: 用户通过标准测序、借助 Trinity 的靶向捕获，或 AVITI24 上的样本内直接多组学进入。
          modules:
            - 标准文库制备
            - Trinity 靶向捕获
            - 样本内直接多组学
        - label: 仪器与流动槽层
          detail: AVITI、AVITI LT、AVITI24 和 VITARI 提供实体测序或成像底座，双流动槽设计在这个产品族中反复出现。
          modules:
            - AVITI / AVITI LT
            - AVITI24
            - VITARI
        - label: 化学与试剂盒层
          detail: Avidity 化学加上 Cloudbreak 和 Trinity 试剂盒，决定兼容性、质量以及靶向工作流的表现。
          modules:
            - Avidity / Avidite 化学
            - Cloudbreak Freestyle / UltraQ
            - Trinity 试剂
        - label: 板载计算与一级分析
          detail: VITARI 的公开报道和 Element 专利显示，嵌入式计算、碱基识别和一级分析 IP 都属于产品系统的一部分。
          modules:
            - 板载计算
            - 碱基识别
            - 一级分析 IP
        - label: 云端编排与数据流转
          detail: ElemBio Cloud 和 Catalyst 负责运行规划、监控、存储连接以及自动化流程执行。
          modules:
            - 已规划运行
            - 存储连接
            - Catalyst 管理的分析流程
        - label: 下游分析与可视化
          detail: Bases2Fastq、Nextflow 管线、合作伙伴平台和 CytoCanvas 把原始运行数据转成可分析输出和可视化审阅结果。
          modules:
            - Bases2Fastq
            - bases2fastq-nf
            - QIAGEN / Seqera 集成
            - CytoCanvas
