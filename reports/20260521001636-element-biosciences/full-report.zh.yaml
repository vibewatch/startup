  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与商业化证据
        blocks:
          - type: paragraph
            body: >-
              Element 的估值讨论，必须从留存公开来源中唯一可见的硬性私募市场定价开始：2024 年 7 月 Series D。公司和分销来源称，该轮融资超过 $277 million，使累计融资超过 $680
              million，由 Wellington Management 领投；一份市场数据回顾把投后估值定在约 $1.03 billion。这个信息足以确立独角兽锚点，但不足以在没有运营证据的情况下承销今天的价格。


              记录中令人鼓舞的部分是，2025 年商业化确实向前推进。GenomeWeb 报道，Element 2025 年收入约 $85 million，高于 2024 年约 $60 million；年末全球投放系统超过
              450 台；装机基础同比增长超过 60%；耗材试剂盒出货量超过翻倍。AVITI24 也贡献了超过 35% 的新仪器预订，制药客户采用尤其强。警示同样清楚：管理层据报道未达到一年前释放的 2025 年 $100
              million 收入目标，所以公司在扩张，但并不完美。


              2026 年产品路线图增加了上行可选性。Element 正在预告 VITARI，宣称单次运行最高 10 billion reads、>90% Q30 和 $100 genome；同时也把 AVITI24 延伸到
              FFPE 和 fresh-frozen 组织工作流，并继续推进 ISO 13485、IVDR 和 FDA
              工作流。这些是可信的增长杠杆，但它们仍是路线图和管理层证据，而不是足以支撑在上一轮披露估值之上支付新溢价的经审计证明。
