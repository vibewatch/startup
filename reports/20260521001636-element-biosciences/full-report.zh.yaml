  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与临床转型风险
        blocks:
          - type: paragraph
            body: >-
              Element 的公开姿态本质上仍以研究用途为先。公司材料围绕研究市场定位平台，IDT 的 AVITI 工作流产品也明确标注仅供研究使用，不用于诊断程序。FDA / HHS 指引在这里很关键，因为 RUO
              标签并不能消除预期用途审查；它划出一条合规边界，而公司越深入临床工作流，这条边界越难管理。因此，Revvity 2025 年 1 月的公告在战略上重要，也释放风险信号：它先提供一个即时可用的 RUO
              新生儿测序工作流，同时称双方在共同开发 IVD 解决方案，Element 也在寻求 AVITI 监管批准。这意味着临床上行空间可见，但公开记录里还没有放行。法律堆栈进一步抬高严重性。Illumina 2025 年
              5 月的 Delaware 诉讼、Element 2025 年 9 月在 California、Delaware 和 Germany 发起的反垄断及专利行动，以及 10x Genomics 2026 年的
              Aviti24 诉讼，带来持续的禁令、版税、和解和管理层带宽压力。风险已经不再是 Element 能否吸引关注，而是它能否在没有法律摩擦或监管节奏冲击的情况下，扩展到临床和空间市场。
