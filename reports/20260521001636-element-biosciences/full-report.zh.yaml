      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计，以及 SAM 为何仍未解决
        blocks:
          - type: paragraph
            body: >-
              公开市场估计确认 Element 所处品类很大，但不足以支撑一个可承销的单一 TAM。MarketsandMarkets 预计全球 NGS 市场 2026 年为 $13.81 billion，2031 年达到
              $27.14 billion；Grand View Research 估计 2025 年为 $11.26 billion，2033 年增至 $42.25 billion。Fortune Business
              Insights 则把更宽的 DNA 测序市场框定为 2025 年 $12.31 billion，到 2032 年增至 $22.57 billion。这些数字方向上有用，但不能互换：有的混合产品和服务，有的专指
              NGS，有的纳入超出 Element 当前触达范围的更广测序技术和临床品类。最可信的结论因此是多视角，而非单数字：North America
              是最大区域市场，经常性耗材在结构上有吸引力，临床和学术需求池都重要。缺失的是一个公开来源，能够单独隔离 Element 特定的 SAM 或
              SOM，也就是研究用途、中通量短读长平台加邻近多组学工作流。这个未解决边界应被保留，而不是用一个通用 headline 估计抹平。
