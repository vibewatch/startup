chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围和商业模式
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 于 2017 年在 San Diego 创立，创始人为 Molly He、Michael Previte 和 Matthew
              Kellinger，核心判断很简单：相较既有市场给科学家的选择，测序应该质量更高、更灵活，也便宜得多。公司公开材料至今仍把 Element 描述为一家生命科学工具公司，专注于面向研究市场的颠覆性 DNA
              测序和多组学系统；但产品表面已经从单一测序仪销售，扩展到仪器、试剂和试剂盒、软件及实验室服务。


              最初的平台是 AVITI，一台围绕灵活性、可负担性和数据质量打造的台式测序仪；之后推出更低通量的 AVITI LT，再到把平台延伸进一体化多组学的 AVITI24。Element 的 2026
              年路线图显示，管理层正把同一架构推向两个相邻方向：通过 VITARI 进入更高通量测序，通过 AVITI24 深入组织 / 空间工作流。这个节奏会影响后文判断，因为它把 Element
              从单产品挑战者，重新框定为一个平台型工具供应商，试图在测序、多组学以及未来受监管工作流里搭出可持续的工具特许经营权。
