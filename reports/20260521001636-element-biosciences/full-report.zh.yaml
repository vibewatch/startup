  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和定价架构
        blocks:
          - type: paragraph
            body: >-
              Element 的公开收入模式在产品和定价层最清楚。公司销售 AVITI 系列台式测序仪，通过 AVITI 升级到 AVITI24 变现，随后随着已放置系统运行更多 assay，拉动经常性耗材收入。AVITI24
              是公司自有网站上唯一直接披露标价的产品：新系统 $424,000，现有 AVITI 升级 $150,000。第三方设备清单把原版 AVITI MSRP 标为
              $289,000，为传统硬件价格点提供了粗略下限，但置信度应低于公司自述价格。Element 还在 2024 年营销 AVITI 最低 $200 per genome，之后又把 VITARI 定位到 2026 年
              $100-genome 经济性，显示公司愿意用激进经济性主张扩大采用。


              经常性收入腿越来越重要。管理层 2026 年 deck 称，2025 年耗材试剂盒出货量增长超过一倍，同时装机基础增至超过 450
              套系统。这是最强公开证据，说明业务正在从一次性硬件放置，转向质量更高的试剂拉动模式。Cloudbreak Freestyle 与超过 95%
              文库制备试剂盒兼容，也有财务意义，因为它降低切换摩擦，并应扩大可触达试剂机会。缺失的是实际 ASP 和支持合同细节：公开材料展示标价和折扣轶事，但看不到谈判、保修或现场支持义务之后，Element
              实际能拿到多少。
