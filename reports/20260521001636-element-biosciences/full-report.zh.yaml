      - number: '3.4'
        title: 差异化耐久性和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Element 的护城河真实，但有条件。正面看，公开证据显示 AVITI 的化学方案相较 Illumina NextSeq 550 对照有更好错误表现，Trinity 降低了靶向测序工作流摩擦，AVITI24 给
              Element 带来差异化多组学邻近业务，公司也已凭超过 100 个早期订单、11 家分销商，以及包含有经验平台切换者的客户群，展示了可信商业牵引力。这些信号说明 Element
              不只是科学项目；当质量、灵活性和价格权衡有吸引力时，买方愿意试用新平台。


              耐久性问题在于，这些优势能否比市场替代方案扩散得更快。Element 自己的 $200-genome 主张依赖高试剂盒承诺和持续利用率；VITARI 的 $100-genome
              承诺，则把公司在运营上必须达到的门槛抬高到要正面对抗 Illumina、MGI 和 Ultima，而不是隔离竞争。公开来源也没有显示独家渠道控制或 sole-source
              合同；市场里反而充满服务商、转换工作流和邻近平台，让多归属成为常态。最大的负面信号不是技术，而是法律：Illumina 2025 年专利案和 Element 的反诉显示，竞争已经升级到核心 flow-cell 和
              imaging IP。这并不能证明 Element 会输，但确实意味着采购摩擦、管理层分心和渠道压力已经成为竞争格局的一部分。因此，投资者应把 Element
              的差异化视为强产品楔子，但仍需证明续约耐久性、大客户标准化和诉讼韧性。
