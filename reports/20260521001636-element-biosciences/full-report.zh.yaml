          - type: callout
            title: 确信度门槛：要求经审计经济性和完整瀑布
            body: >-
              若要在接近上一轮披露估值处形成建设性投资逻辑，最低尽调包包括：当前收入和毛利率、队列级装机基础利用率与耗材拉动、头部客户集中度、诉讼风险备忘录，以及完整优先权瀑布。没有这些文件，公司可能不错，但价格仍缺乏证据支撑。
            calloutType: recommendation
