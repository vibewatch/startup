      - number: '1.2'
        title: 创始人、管理层和治理
        blocks:
          - type: paragraph
            body: >-
              Element 的运营领导层仍高度由创始人主导。Molly He 仍任 CEO 和董事，Michael Previte 仍任 CTO 并负责高级研究，Matthew Kellinger
              仍是生物化学创始人。这种集中度有助于产品一致性，因为搭出核心化学和仪器愿景的人仍在带路线图；但它也把执行风险集中在一个小型创始团队身上。公开高管页面显示，更广泛的管理梯队如今覆盖财务、人事、法务、信息学、运营、销售和业务开发，说明即便公司仍是私营状态，也已经按更成熟的商业阶段补齐团队。


              公开记录里的治理结构更像是受风险投资影响，而不是创始人完全控制。董事会名单包括 Molly He，以及 Bryan Roberts 和 Jim Tananbaum，把董事会直接连接到 Element
              已披露融资史中的 Venrock 和 Foresite 两家投资方。公开材料较难看清的是 2024 年 Series D
              之后的控制权分配、观察员席位或特殊治理条款。因此，公开记录足以画出房间里可见的人，但不足以仅靠外部材料推断准确治理权力。
