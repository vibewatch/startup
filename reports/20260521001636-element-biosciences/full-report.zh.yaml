  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Element 现在卖的是分层测序平台，不是单一仪器 SKU
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Element Biosciences 已经越过最初 AVITI 发布阶段，形成共享化学和工作流附件的分层产品族。2026 年主页和产品矩阵把 VITARI、AVITI24、AVITI 和
              AVITI LT 放进同一组合；Cloudbreak 和 Trinity 则跨多个系统使用，更像赋能工作流的试剂盒，而不是边缘配件。从客户工作流看，AVITI 仍是核心短读长台式系统，AVITI LT
              是占地更小、通量更低的选择，AVITI24 增加直接样本内和多组学读出，VITARI 则把同一公司延伸到高通量测序。Cloudbreak 重要，因为它处理文库兼容性和输出选择；Trinity
              重要，因为它把靶向捕获压缩进更以仪器为中心的工作流。实际结论是，Element 的产品定义是仪器加化学加软件加下游分析。这种宽度有战略吸引力，因为它支持在同一账户内落地并扩张；但尽调也应把成熟的 AVITI
              基础，与更新的 VITARI 和 AVITI24 扩展层拆开看。
