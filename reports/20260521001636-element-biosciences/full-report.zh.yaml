  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域和现状替代品
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 的有用市场边界，比「所有测序」更窄，也比一个台式仪器 SKU 更宽。Element
              当前变现绑定在研究用途短读长测序系统、经常性耗材，以及让这些系统真正进入实验室的工作流模块上。公司自己的产品和化学页面把 AVITI 定位为台式平台，主打灵活性、可负担性和数据质量；2026
              年路线图则把这一主张延伸到更高通量测序和直接空间 / 多组学工作流。因此，最接近的替代品不是所有基因组学工具，而是既有短读长平台，尤其是 Illumina SBS
              系统，再加上已经围绕它们建立起来的文库制备、分析和核心实验室工作流。长读长系统、常规报销诊断检测以及无关湿实验室仪器，更多是邻近领域或背景，并不是 Element
              今天清晰的近期可服务市场。实际后果是，Element 先争夺现有基因组实验室里的替换和扩容预算；随着合作伙伴验证 AVITI 样本到结果栈，再去争取更大份额的工作流支出。
