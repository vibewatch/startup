      - number: '8.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 公开可比公司差距是核心估值问题
            body: >-
              最强的警示信号不是 Element 缺少动能；而是上一轮披露的约 $1.03 billion 估值，仍隐含约 12x 的 JPM 报道 2025 年收入水平。公开测序工具锚点低得多：PacBio 在低 2x
              左右，Illumina / 10x 在高 4x 至约 5x 区间。只有私下尽调证明增长持久性、利润率结构和股权结构清洁度远强于当前公开记录，这个差距才说得通。
            calloutType: risk
            claimRefs:
              - CV013
              - CV016
              - CV018
              - CV020
              - CV022
          - type: callout
            title: Element 2025 年有真实牵引力，但并不完美
            body: >-
              2024 年融资后，公司没有停滞。据报道，收入从 2024 年约 $60 million 增至 2025 年约 $85 million，装机基础超过 450 台，AVITI24 占新仪器预订超过
              35%。同时，管理层据报道也未达到一年前讨论过的 2025 年 $100 million 收入目标。这个组合指向的是一家有上行空间的活跃公司，而不是一个已经完全去风险的溢价估值。
            calloutType: insight
            claimRefs:
              - CV004
