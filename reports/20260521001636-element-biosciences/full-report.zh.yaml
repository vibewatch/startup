    type: journey-map
    layout: wide
    summary: 展示 Element 通常如何拿下客户：研究人员先暴露出对现有平台成本或质量的不满，再从技术上验证 AVITI，随后依靠工作流伙伴和现场支持，走向多系统或多组学扩张。
    data:
      items:
        - label: 现有平台痛点 / 发现
          note: 潜在客户通常已经在用 NGS，他们想要比传统台式系统更低的运行成本、更高质量、更透明定价，或更灵活的批处理。
        - label: 并行验证
          note: 客户会在 FFPE、16S、靶向富集或低深度 assay 上，把 AVITI 与现有平台对比；Gencove、UC Davis、UMN 的独立或客户托管对比，以及 AVITI utility 论文，都落在这个阶段。
        - label: 工作流赋能
          note: QIAGEN、IDT、Agilent、Revvity 和 biomodal 在 panel、试剂、分析或多组学上降低摩擦，客户不必独自重建整套技术栈。
        - label: 运营部署
          note: 仪器安装、培训和首次数据生成构成转化时刻；Broad、NEB、FYR Diagnostics 和 University of Utah 都强调了实施支持质量。
        - label: 扩张 / AVITI24 加购
          note: 客户增加产能、购买多台设备，或扩展到 AVITI24 多组学；复购、多台销售以及 AVITI24 在药企客户中的强劲采用，是这个阶段最清晰的公开信号。
