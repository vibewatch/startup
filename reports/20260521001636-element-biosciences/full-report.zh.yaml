      - number: '6.2'
        title: 采用轨迹和装机基础动能
        blocks:
          - type: paragraph
            body: >-
              Element 的公开采用轨迹显示了真实商业转化，尽管公司没有按队列披露活跃客户数。早期商业阶段，Element 宣布超过 100 个 AVITI 订单，客户分布于 13
              个国家，季度环比三位数增长，并在公告当季拿到估计 15% 的中通量仪器销售份额。到下一次 JPM 更新，公司称商业订单已超过 160 个，装机基础扩至 112 台仪器。GenomeWeb 的 JPM 2026
              报道进一步推进这条曲线：截至 2025 年底，全球放置超过 450 套系统，装机基础同比增长超过 60%，耗材出货量增长超过一倍。这个模式重要，因为它说明扩张来自真实使用，而不只是把盒子发进库存。


              商业结构也指向扩张，而非一次性试用需求。Element 称，超过 40% 的销售是多台订单，重复客户正在给既有 fleet 增加容量；被引用客户群中 80% 是升级到 AVITI 的有经验用户。GenomeWeb
              另报道称，AVITI24 首个客户发货一年后，已经在 pharma 客户中获得尤其强的采用。合在一起，这些信号支持一个判断：Element
              同时赢得首次放置，并向更高级工作流实现第二步扩张。缺失的仍是分母可见度：公司没有公开披露 450+ 套已放置系统中有多少按生产节奏活跃、多少属于重复账户，或耗材增长有多少来自少数高使用量站点。
