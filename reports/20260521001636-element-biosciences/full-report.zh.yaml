      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Element 的买方地图很分散，尽管底层技术用户往往相似。学术核心实验室和基因组中心关心仪器灵活性、与既有 Illumina 格式文库和文件的兼容性、读长质量，以及中等规模下的经济性；UCDavis
              的公开介绍就是一个好例子。Biopharma 和转化研究团队更像应用买家，而非纯容量买家：他们关心挑战性样本上的数据质量、更快周转，以及扩展到多组学和 FFPE
              密集工作流的能力。第三类是合作伙伴或服务实验室，相关决策不只看测序仪性能，还要看仪器能否嵌入一个端到端运营栈，覆盖文库制备、解读、LIMS 和 assay
              验证。Revvity、IDT、QIAGEN、biomodal 和 Medicover 都指向这个方向。估值含义是，Element
              不只是卖硬件；它试图成为研究和临床邻近实验室里的工作流锚点。但不同客群的预算归属差异很大，因此采购周期、切换痛感和附着率经济性，需要按买方类别拆开分析，而不能对整个市场取平均。
