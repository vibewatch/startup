      - number: '6.5'
        title: 扩张打法、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Element 的扩张打法高度依赖工作流赋能伙伴，也依赖降低客户从既有平台切换的成本。QIAGEN、IDT、Revvity 和 biomodal 都把各自的 AVITI
              集成包装成下游分析、原生文库制备、服务实验室运营或多组学兼容性的解决方案。Medicover 更进一步，把 AVITI 打包进合作实验室可部署的端到端临床工作流。这种模式在战略上有帮助，因为 Element
              不必独自解决每一种检测项目、软件和监管问题，就能触达更广的客户群。它也暴露了扩张风险的位置：如果工作流伙伴表现不佳、集成延期，或没能转化自己的装机基础，Element
              向受监管场景和企业场景渗透的商业杠杆可能放慢。


              已审阅来源显示采购摩擦确实存在。UC Davis 指出，尽管文件兼容性保留下来，化学体系仍然不同；University of Minnesota 发现，为获得可比的 16S 表现，AVITI 反向 reads
              需要修剪到 160 bp；Medicover 明确称，其集成该仪器时 AVITI 尚未获得 CE-IVDR 标志；持续诉讼又给评估 AVITI24 多组学工作流的客户加了一层新风险。Element 自己 2025
              年的反垄断诉讼文件和 LegalEra 对该文件的摘要称，Illumina 曾对至少一个 Element 客户施加排他压力；GenEngNews 则报道了 10x / Harvard 针对 AVITI24 和
              Teton 的诉讼。这些都不能证明客户流失，但意味着公开证据仍集中在灯塔客户和伙伴渠道，且没有披露头部客户收入占比、续约队列，或防范集中度的明确机制。
