      - number: '6.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 装机基础动能是真实的，不只是叙事
            body: >-
              Element 的客户证据并不完美，但 >450
              台系统投放、耗材出货翻倍、多机订单和重复扩容叠在一起，显示公司已经拿到真实商业立足点。这些数据尚未证明持久客户经济性，但已经足以说明其在研究测序市场获得了真实的产品-市场接受度。
