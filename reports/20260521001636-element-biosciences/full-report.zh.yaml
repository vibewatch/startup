  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接短读长平台竞争
        blocks:
          - type: paragraph
            body: >-
              Element 最直接的正面竞争仍是短读长测序栈，Illumina 是规模型在位者，MGI 和 Ultima 则从不同角度把成本曲线往下压。Illumina 的 NovaSeq X
              产品族锚定了买方对通量和临床研究熟悉度的预期：公司报告 2026 年 Q1 收入 $1.09 billion，并称 NovaSeq X 需求在增加；其系统对比页面把 NovaSeq X
              定位为大规模全基因组、外显子组、单细胞和液体活检工作的生产级默认选择。这种在位优势重要，因为许多买方已经熟悉工作流、信任服务生态，并且不用改变采购行为也能继续购买测序输出。


              MGI 和 Ultima 用不同叙事攻击同一市场。MGI 把 DNBSEQ 和 SEQ ALL 定位为宽谱测序加多组学组合，其 DNBSEQ-G99 强调用于靶向 panel、外显子组、转录组学和微生物工作流的
              12 小时 PE150 运行。Ultima 的卖点更直接是经济性和规模：UG100 页面宣传每张 wafer 10–12 billion reads、每百万 reads $0.24、每 Gb
              $0.80，以及每年超过 30,000 个基因组；更新的 UG200 系列则称按配置不同，每年可跑 30,000 到 60,000+ 个 30x 基因组。Element
              的回应是继续把台式体积和工作流灵活性放在中心。AVITI 被定位为灵活、可负担的台式仪器；Trinity 把靶向测序工作流压缩到短至一天；VITARI 发布则把路线图延伸到高通量台式领域，标价
              $689,000，并由公司宣称可实现 $100 genome。竞争含义是，Element 的确有产品楔子，但它同时在对抗资本更充足的在位者和价格驱动的挑战者。
