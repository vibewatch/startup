  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 商业证据和产品可选性要先扣除公开可比公司错配、诉讼以及缺失的私有尽调材料，才会进入建议结论。
    approximationNotes: 该流程是定性而非概率模型；它映射截至运行日期，保留公开证据所暗示的决策链。
    data:
      nodes:
        - id: proof
          label: 证据：2025 年收入 ~$85M；>450 套系统；AVITI24 占新预订 >35%
          type: input
        - id: roadmap
          label: 可选性：VITARI、具备组织能力的 AVITI24、监管路径
          type: input
        - id: premium
          label: 约束：上一轮公开估值隐含约 12x 2025 年收入
          type: process
        - id: legal
          label: 约束：Illumina 诉讼仍在进行，IP 仍不确定
          type: process
        - id: gaps
          label: 缺口：没有公开毛利率、优先权结构或客户集中度
          type: process
        - id: rec
          label: 建议：research-more / track；若达到或高于上一轮估值则偏紧
          type: output
      edges:
        - from: proof
          to: premium
          label: 支撑但未弥合溢价缺口
        - from: roadmap
          to: premium
          label: 增加上行可选性
        - from: premium
          to: rec
          label: 需要价格纪律
        - from: legal
          to: rec
          label: 风险折价
        - from: gaps
          to: rec
          label: 阻断确信度
    claimRefs:
      - CV022
      - CV029
      - CV033
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 若投资者按 6x 到 18x 收入倍数套用已报道的 2025 年收入基数 ~$85M，股权价值敏感性如下；上一轮公开融资接近 12x 档位。
    approximationNotes: 敏感性使用第三方报道的 2025 年收入数字 ~$85M，并为可读性将数值四舍五入到最接近的 $5M。
    data:
      items:
        - label: 6x 收入
          value: 510
        - label: 8x 收入
          value: 680
        - label: 10x 收入
          value: 850
        - label: 12x 收入（约等于上一轮）
          value: 1020
        - label: 15x 收入
          value: 1275
        - label: 18x 收入
          value: 1530
    claimRefs:
      - CV013
      - CV022
      - CV034
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊、基准、牛三档估值区间显示，公开证据仍把 Element 框在上一轮附近，而不是明确高于上一轮。
    approximationNotes: 区间是分析师估算，锚定已报道的 2025 年收入、公开可比公司倍数、路线图可选性以及法律 / 披露风险，并非正式 DCF。
    data:
      items:
        - label: 熊市情景 — 增长滑坡，诉讼延续
          low: 500
          high: 700
          unit: $M
        - label: 基准情景 — 估值轮次大体守住
          low: 800
          high: 1050
          unit: $M
        - label: 牛市情景 — 路线图转化为溢价增长
          low: 1200
          high: 1500
          unit: $M
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格打分显示，产品和市场叙事很强，但估值支撑只属中等，因为关键财务和股权结构证据仍未公开。
    approximationNotes: 分数采用 1–5 的编辑量表，基于截至运行日期保留的公开证据；它们不是管理层提供的 KPI。
    data:
      items:
        - label: 市场机会
          value: 4
          unit: /5
          note: NGS 市场在增长，引用的 2026–2031 年 CAGR 为 14.5%。
        - label: 产品差异化
          value: 4
          unit: /5
          note: AVITI24、VITARI 路线图和 $100 基因组目标支撑差异化。
        - label: 商业证据
          value: 3
          unit: /5
          note: 收入、装机和预订在改善，但规模仍小。
        - label: 证据质量
          value: 2
          unit: /5
          note: 没有公开毛利率、客户集中度或股权结构披露。
        - label: 法律悬顶
          value: 2
          unit: /5
          note: 并行的 Illumina 争议让估值折价压力持续存在。
        - label: 估值支撑
          value: 2
          unit: /5
          note: 上一轮隐含约 12x 收入，高于公开可比公司锚点。
        - label: 退出清晰度
          value: 2
          unit: /5
          note: 保留来源中没有新的定价事件、要约或 IPO 式披露。
