companyProfile:
  summary: >-
    Element Biosciences 是一家位于 San Diego 的私营生命科学工具公司，围绕 avidity sequencing 化学构建 DNA 测序和一体化多组学平台。公司由 Molly He、Michael
    Previte 和 Matthew Kellinger 于 2017 年创立，已从最初的台式 AVITI 系统扩展到 AVITI LT、AVITI24、Trinity 靶向工作流，以及已预告的更高通量 VITARI
    路线图。公开证据显示公司已有实质商业牵引力，但仍是私营公司，在利润率、股权结构条款和当前员工数上，透明度明显低于上市测序同行。
