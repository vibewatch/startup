        - 直接在位短读长平台
        - 上市公司；2026 年 Q1 收入 $1.09B
        - 运行生产规模短读长工作流的临床和研究实验室
        - NovaSeq X 通量、装机基础信任、广泛应用菜单
        - 高通量集中化模型；并非唯一可行的台式灵活性叙事
      - - MGI Tech
        - 直接全球短读长挑战者
        - 私营公司；经审阅页面未公开确切收入
        - 需要 DNBSEQ 选项、覆盖不同检测和地域的基因组实验室
        - DNBSEQ 产品组合，加上 SEQ ALL 覆盖基因组学、空间和单细胞用例
        - 西方商业牵引力在经审阅公开来源中不如 Illumina 或 Element 清晰
      - - Ultima Genomics
        - 直接高通量短读长挑战者
        - 私营公司；经审阅页面未公开确切收入
        - 人群规模基因组学、服务提供商和成本敏感的高量用户
        - 基于晶圆的经济性，配合 UG100 / UG200 规模和公开低单读成本主张
        - 定位更偏超高通量，而不是小型、间歇使用者
      - - PacBio
        - 长读长替代
        - 上市公司；2026 年 Q1 收入 $37.2M
        - 复杂基因组、结构变异、甲基化和临床研究场景
        - HiFi 长读长、天然甲基化、高完整度基因组视角
        - 成本 / 通量曲线不同于短读长台式平台
      - - Oxford Nanopore
        - 长读长替代
        - 上市公司；向投资者发布年度业绩
        - 需要实时、长读长或从便携到高输出灵活性的实验室
        - 设备从 MinION 到 PromethION，支持实时测序
        - 与标准化短读长 SBS 替代的匹配度较低
      - - GENEWIZ / Azenta
        - 外包服务替代
        - 商业服务提供商；定价通常按报价
        - 避免仪器资本开支的买方或低频用户
        - 在 Illumina、PacBio 和 ONT 平台上提供从样本到分析的服务
        - 形成服务依赖，而不是拥有院内平台
      - - Novogene
        - 外包 / 全球服务替代
        - 声称每年最高可处理 200,000 个人类基因组
        - 高量研究用户，以及希望保留平台可选性的团队
        - 覆盖 Illumina、Ultima、PacBio 和 ONT 的广泛平台菜单，部分工作流支持美国本地处理
        - 服务关系可能推迟甚至完全替代仪器采购
    notes: 选取的 2026 年竞争对手集合覆盖直接短读长平台、长读长替代和外包测序服务商。规模栏尽量使用公开收入或产能；没有数据时，明确标出公开数据缺口。
