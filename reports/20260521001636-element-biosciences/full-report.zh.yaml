      - number: '7.3'
        title: 生态、伙伴与商业依赖风险
        blocks:
          - type: paragraph
            body: >-
              Element 的增长显然受益于生态杠杆，但这种杠杆也是依赖面。IDT 供应 AVITI 专用 adapters、blockers 和 primers，并明确称这段关系应帮助 Element
              扩大原生文库制备。Revvity 把 Element 推向新生儿 IVD 工作流和未来监管批准；biomodal 兼容性以及 GenomeWeb 报道的 Alamar 和 Human Cell Atlas
              关系，则拓宽了多组学和商业化叙事。这在战略上有用，因为它降低采用摩擦、提高工作流相关性。它也意味着商业化故事的重要部分由伙伴中介完成，而不是 Element
              端到端控制。客户信号令人鼓舞——美国以外客户超过半数，临床研究占比更高，多机队列扩大，AVITI24
              早期采用出现——但公开披露仍没有给出集中度、续约或伙伴收入依赖指标。因此，依赖风险的重点不在于有没有伙伴关系，而在于这些关系可替代性多强、影响多少销量，以及如果关键伙伴、检测项目或集成发生变化，客户要承受多少切换痛感。
