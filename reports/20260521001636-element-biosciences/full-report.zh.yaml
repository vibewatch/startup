        title: 命名客户证明和独立工作流验证
        blocks:
          - type: paragraph
            body: >-
              Element 的公开客户证据，最强的部分来自具名机构、可观察的流程结果，或独立论文的方法部分。Broad Institute 披露部署三台
              AVITI，是公开记录里最干净的多机部署之一；引文谈的是运营落地，而不是抽象性能口号。Gencove、Google Health Genomics、Agilent、New England Biolabs、10x
              Genomics、FYR Diagnostics、University of Utah 和 Helixio 各自从质量、兼容性或支持角度补了一层证据。证据权重并不相同——有些是 Element
              自有渠道上的精选客户证言——但仍然有价值，因为它们显示平台被用于 FFPE 占比较高的研究、靶向富集、单细胞准备，以及生物信息学管线集成，而不只是市场演示。


              最强的独立佐证来自外部机构和论文方法部分。Revvity 称其全球服务业务采用了 AVITI；Medicover Genetics 称已把 AVITI 接入面向合作实验室的 VERACITY NIPT 和
              TarCET 工作流；University of Minnesota Genomics Center 用 1,143 个微生物组样本把 AVITI 与 NextSeq 2000 做了基准对比；2026 年 PMC
              论文则明确把 AVITI24 测序放在 MIT BioMicro Center 和 University of Michigan Advanced Genomics Core，另有一篇 2025 年 Nature
              Immunology 方法部分用 AVITI 跑 bulk 文库、用 AVITI24
              跑单细胞文库。尽调的关键分界在于具名证据和持久经济性：公开记录清楚显示真实使用和流程契合，但对合同规模、续约节奏，或每个具名客户贡献多少收入，仍几乎没有可见度。
