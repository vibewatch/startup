      - number: '7.4'
        title: 财务、人员与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Element 的回旋余地比普通硬件创业公司更大，但公开承销负担也随之上升。公司披露 2024 年 7 月完成 $277 million Series D，累计融资超过 $680
              million，随后公开描述 2024 年收入约 $60 million，耗材增速快于仪器增速，并给出 2025 年 $100 million 目标和 10
              个产品发布计划。这些都是有意义的规模信号，但也放大了失误后果。公开问题在于，2024
              年融资之后，投资者仍看不到最新烧钱速度、现金跑道、集中度或经审计的运营效率数据。与此同时，管理层要同时平衡产品扩张、全球支持体系建设和活跃诉讼。因此，风险更适合被框成可监控，而不是二元判断。如果监管里程碑没有出现，如果诉讼造成产品约束，如果支持和质量招聘持续高企却没有运营闭环证据，或如果耗材与收入目标相对当前路线图滑坡，投资逻辑就应迅速下调。若这些指标反向改善，同一份公开记录会安全得多。
