      - number: '6.4'
        title: 留存、持久性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              Element 的公开记录里有不少扩张信号，但传统留存披露很少。最好的正面指标是结构性的：在 100 笔订单队列中，多机订单贡献超过 40% 销售额；复购客户在追加产能；Broad
              公开运行三台系统；Burning Rock Dx 披露验证后多次采购 AVITI。这些点说明 Element 不只是在赢一次性的概念验证。与此同时，预订结构转向
              AVITI24，也显示部分客户正在把关系从常规测序延伸到价值更高的多组学工作流，而不是只把 AVITI 当成台式测序仪替代品。


              但已审阅来源都没有披露 NRR、GRR、流失率、续约率、合同期限，或按队列拆分的客户数。相对于装机基础，公开满意度证据也偏浅：Element 自有证言页面虽然正面引语密集，FeaturedCustomers 只有
              9 条公开评价 / 推荐，一般用户论坛活动也很稀疏。因此，本章可以支持一个判断：早期用户愿意验证、安装，有时也会扩容；但不能支持 Element
              已在大范围队列中证明持久经常性经济性的说法。尽调缺的桥，不是产品质量证据，而是留存、续约和钱包份额披露。
