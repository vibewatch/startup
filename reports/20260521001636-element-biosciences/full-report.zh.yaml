      - number: '4.5'
        title: 财务结论和尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论是：收入形成方向积极，但承销质量不完整。Element 已明显从产品发布跨入有意义商业化：披露收入从 2023 年超过 $25 million 增至 2025 年估计约 $85 million，放置系统
              footprint 超过 450 台，耗材出货增速快于装机基础。这种组合通常意味着收入质量改善，因为经常性拉动应会随时间成为更大销售占比。收入结构转向临床研究和 AVITI24
              订单，也说明公司在进入更差异化、潜在价值更高的工作流，而不是只在入门级短读长测序上竞争。


              主要谨慎点在于，规模和融资并不等于利润率路径可见。Element 仍面对一个在位者，Fierce 描述其约有 25,000 套系统放置、约 75% 市场份额；与 Illumina 的诉讼又在 Element
              扩张到临床级制造和新的高通量平台时，引入法律成本和商业摩擦。公开材料从未披露决定公司会成为持久工具业务，还是资本密集型份额争夺战的变量：现金余额、烧钱速度、按收入流拆分的毛利率、实际价格、队列利用率和销售效率。因此，本章落在「已起草但未承销」：商业模式可信且在放大，但在判断现金跑道或利润率耐久性之前，仍必须取得私人财务披露。
