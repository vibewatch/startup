        title: 商业规模和公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              2023 到 2025 年，公开牵引力从早期商业验证推进到实质规模。Element 披露 2023 年收入超过 $25 million，商业订单超过 160 个，到 2024 年 1 月安装 112 台仪器。到
              2024 年 5 月，公司累计订单已超过 200 个；Series D 材料随后称，过去十二个月 AVITI 放置量从约 40 台增至超过 190 台。2026 年 JPM deck 延续这条曲线：2024
              年收入约 $60 million，2025 年估计收入约 $85 million，已在超过 40 个国家放置超过 450 套系统，联网运行次数和耗材试剂盒出货量同比都超过两倍。


              这些数字重要，因为它们首次在公开层面把硬件放置桥接到经常性使用业务。它们也说明 Element 已不再是预规模挑战者：公司已有足够现场系统，使耗材拉动和工作流升级能够影响收入结构。同一 deck 称，临床研究超过
              2025 年总收入的 25%，AVITI24 在首个客户发货一年内推动了超过 35%
              的新仪器订单，暗示公司并非只依赖标准短读长研究需求。即便如此，规模相对在位者经济性仍偏小，公司发布的仍是快照，而不是经审计财务报表或队列级运营数据。
