      - number: '7.2'
        title: 平台规模、质量与运营风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险是运营问题，不是概念问题。Element 讲的已经不再是一台台式测序仪的故事；公司同时支持 AVITI，推进 AVITI24
              多组学，并推出直接样本内测序，还公布了一条延伸到新高通量和空间能力的创新路线图。广度令人兴奋，但也让必须同时跑通的检测项目、软件层、服务互动和质量检查点成倍增加。公开披露显示，装机基础一年内从约 40 台跃升到
              25 个以上国家的 190
              多台；招聘页面仍有客户支持、现场应用、质量、供应链、物流、运营、化学和工程岗位空缺。这本身不是红旗；快速增长的仪器公司本来就会招聘。但它确实告诉投资者，服务能力和合规成熟度仍在建设中，而装机系统、模态和地域都在增加。核心剩余风险在于，支持、物流和质量体系必须跟产品雄心同步扩张。公开来源提供了客户证言和一些具名复购，但没有提供经审计的服务指标、安装失败率或详细质量体系证据。因此，运营复杂度是否比运营控制更快增长，仍是一个有分量的尽调缺口。
