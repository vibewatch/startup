      - number: '8.2'
        title: 公开可比公司桥接与估值区间逻辑
        blocks:
          - type: paragraph
            body: >-
              核心估值问题是，Element 上一次披露的独角兽估值，能否被公开可比公司框架支撑。基于本章留存的市场数据和上市公司披露，答案只能说部分成立。Illumina 2026 年 5 月市值和指引隐含的收入倍数约在高
              4x 区间。10x Genomics 也在高 4x 左右。PacBio 低得多，接近低 2x 区间。相比之下，Element 2024 年 7 月约 $1.03 billion 的投后估值，对照 JPM 报道的约
              $85 million 2025 年收入，隐含约 12.1x 收入；对照约 $60 million 的 2024 年收入基数，则隐含约 17.2x。这比公开测序工具公司的交易水平高出很多。


              私募溢价有其理由。Element 商业化更早期，增长仍快于成熟上市同行，有差异化多组学叙事，也处在 MarketsandMarkets 预计将从 2026 年 $13.81 billion 增至 2031 年
              $27.14 billion 的下一代测序市场里。但市场增长本身不能抹平溢价差，尤其是上市同行已经向投资者提供经审计报表、当前利润率和更清晰资本结构。Element 没有。


              因此，情景区间必须对价格敏感。$0.5 billion 至 $0.7 billion 附近的悲观情景，假设增长放慢、诉讼拖累采用，投资者把 Element 拉近公开工具公司倍数。约 $0.8 billion 至
              $1.05 billion 的基准情景，假设 2024 年轮次大体守住，2025 年执行和 2026 年路线图让战略故事保持完整。约 $1.2 billion 至 $1.5 billion
              的乐观情景，不能只靠路线图热情；它需要证明 VITARI、AVITI24 和监管进展能转化为持久收入、利润率和耗材经济性。
