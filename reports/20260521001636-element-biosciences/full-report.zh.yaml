  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和终端市场结构
        blocks:
          - type: paragraph
            body: >-
              Element 的客户基础更适合理解为一组研究驱动的采用表面，而不是同质化装机基础。最初的 AVITI
              平台面向中通量基因组中心、核心实验室、学术转化团队、生物技术和制药研发团队，以及希望获得比传统台式系统更好数据质量或更灵活批量大小的服务实验室。AVITI24
              把口径扩展到空间和单细胞多组学团队，靠单次运行、无需文库制备，把 RNA、蛋白和形态学读出合在一起。公开点名用户对应这些细分：Broad Institute、Weill Cornell
              Medicine、Gencove、New England Biolabs、University of Utah 和 University of Minnesota Genomics Center
              都代表研究核心或转化实验室需求；Medicover Genetics 和 Revvity 展示进入临床或服务实验室工作流的渠道杠杆；QIAGEN、IDT、Agilent、10x Genomics 和
              biomodal 则说明合作伙伴赋能是获客的重要组成，而不只是边缘生态故事。


              地理覆盖在扩大，但仍由研究场景主导。Element 称，超过 100 个订单这一里程碑已经覆盖 13 个国家的客户，来自直销和分销商组合；GenomeWeb 则报道，截至 2025 年底，全球已放置超过 450
              套系统。含义是，客户证明并不集中在一个本土市场集群，但公开证据对灯塔学术和工作流账户的密度，仍远高于大型披露 pharma 或诊断 fleet。这个差异重要，因为付款方、用户和买方常常分离：PI
              和核心实验室经理使用平台，采购或运营部门出钱，工作流合作伙伴则可能通过移除文库制备、分析或监管摩擦来影响最终平台决定。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
