      - number: '4.4'
        title: 单位经济性、成本结构和定价压力
        blocks:
          - type: paragraph
            body: >-
              单位经济性仍缺乏可见度，因此最好的公开读数来自价格点、折扣轶事和运营信号。前端变现很直接：硬件销售或升级。经常性变现似乎来自 Cloudbreak 和相关耗材；随着装机基础扩大，2025
              年试剂盒出货量增长超过一倍。University of Minnesota 基因组核心随后提供了有用的真实世界定价信号：随着 AVITI 运行量上升，该中心拿到更深试剂折扣，并在此前约 40%
              降价之后，又传导了平均 20% 的额外费率下调。这有利于采用和利用率，但也显示，一旦大客户获得采购杠杆，经常性收入质量将取决于还剩多少定价权。


              成本结构线索指向一个仍背负重度利润率前投资的业务。Element 正在为临床应用建设制造质量系统，支撑更宽的产品栈，并与 Illumina
              打进行中诉讼。这些因素意味着工程、运营、法律支出和现场支持上的固定成本很高。公司自己的材料承认定价环境竞争激烈；诉讼文章还描述了被指控的在位者折扣和服务捆绑，可能进一步压低实际价格。由于 Element
              不公开披露毛利率、耗材附着、CAC、回本周期或服务交付成本，标准承销比率目前都无法仅靠公开证据验证。
