      - number: '3.2'
        title: 长读长和多模态替代品
        blocks:
          - type: paragraph
            body: >-
              PacBio 和 Oxford Nanopore 不是直接的短读长复制品，但当买方优先考虑结构变异、甲基化、超长读长或实时输出，而不是纯短读长经济性时，它们仍会争夺同一笔研究预算。PacBio 的 Revio
              页面强调 15–20 kb HiFi reads、每次标准运行的原生甲基化 calling，以及每年最多 2,500 个人类基因组；公司 2026 年 Q1 业绩显示放置 15 台
              Revio，并且耗材强度创纪录，背后是临床采用增长。Oxford Nanopore 做的是另一种取舍：其设备范围从便携 MinION 到高输出 PromethION；PromethION 页面强调可独立寻址的
              flow cells、Tb 级实时输出和人群规模测序，而不是 Illumina 式固定短读长运行点。


              这些替代品重要，因为 Element 今天最强的优势仍在短读长工作流内部。AVITI24 通过承诺单一样本、单次运行、无需文库制备即可完成直接细胞 profiling
              和多组学细胞分析，拓宽了故事；但这不等于提供原生长读长。换句话说，Element 可以从短读长测序扩展到邻近多组学，但具体需要长读长基因组完整性、定相或原生甲基化的买方，仍有明确理由购买或外包给 PacBio 和
              ONT。因此，替代品集合超出短读长每 Gb 价格对比：它包括任何能让实验室用更少 assay 解决生物学问题的平台，即便读长技术完全不同。
