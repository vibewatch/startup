      - number: '8.3'
        title: 投资建议、风险评级与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              建议应是继续研究 / 价格敏感跟踪，而不是买入。Element 有足够证据留在观察名单上：公司融资规模可观，装机增长，AVITI24 已进入有意义的预订结构，并在推进技术上有野心的 2026
              年路线图。但公开证据并不支持把价格付到 2024 年 7 月独角兽估值以上，仿佛该轮融资已经被经审计的 2025-2026 年经济性充分去风险。


              最大原因是，法律和披露风险正好卡在估值路径上。Element 自己 2025 年 9 月的诉讼文件称，公司就反垄断和专利主张起诉 Illumina；独立报道和法院记录显示，并行诉讼活动与 2026
              年案卷动议实践仍在继续。即便 Element
              的指控方向上正确，对投资者的实际影响也一样：禁令风险、法律开支、客户犹豫和管理层分心都会压缩倍数。公开来源也没有披露优先股堆叠、清算瀑布、当前毛利率、客户集中度，或决定谁真正受益于退出价值的服务经济性。


              因此，估值立场是：在或高于上一轮披露估值时偏高，风险评级高，确信度中等。如果 2026 年收入不能显著高于约 $85 million 的 2025
              年基数，如果诉讼带来不利禁令或重大损害赔偿敞口，或如果股权结构表显示足够多的高级清算优先权会吞掉公开证据估值区间附近的大部分上行，建设性逻辑会很快破裂。
