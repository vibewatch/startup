      - number: '2.4'
        title: 增长驱动、采用约束和保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Element 所在市场的增长逻辑清楚。公开分析师摘要指出，精准医学、测序成本下降、更高通量台式设备发布、多组学整合和更广临床采用，都是持久需求驱动。Element
              自己的路线图把叙事进一步收紧到更高通量平台、$100-genome 信息，以及 AVITI24 上的直接空间测序。与此同时，最重要的约束并非理论问题。Illumina
              的装机基础和工作流锁定仍然强大，数据分析复杂度和标准化问题仍让小型实验室却步，从研究用途成功跳到受监管临床部署，也不只是读长质量强就够。Medicover 的集成显示 AVITI 可以参与临床实验室工作流，但
              GenomeWeb 也明确表明 IVDR 和 FDA 路径仍在推进中，而非已经完成。不同测序模态之间的竞争条件也不均衡：PacBio 的 2026
              年业绩显示，耗材需求上升，同时仪器收入弱于预期，说明即便新平台采购受限，利用率也能增长。本章因此支持正面的需求展望，但保留关于精确 SAM、按买方类别拆分的工作流经济性，以及监管时间点的未决尽调问题。
