            title: 随着耗材跟随装机放大，经常性收入质量正在改善
            body: 公开记录中最清晰的正面信号不是硬件标价，而是 2025 年耗材试剂盒出货量增长超过两倍，同时已放置基础超过 450 套系统。这个模式说明 Element 正开始把硬件放置转化为经常性使用，而不只是一次性资本销售。
            calloutType: strength
            claimRefs:
              - CI018
              - CI019
              - CI029
          - type: callout
            title: 利润率公开前，定价压力已经真实存在
            body: >-
              Element 自己的 2026 年 deck 标出高度竞争的定价环境，一家客户基因组核心也报告，采购量上升后 AVITI 价格继续下调。没有披露毛利率或实际
              ASP，投资者无法判断价格驱动的采用是在扩大经济利润，还是只是在放大收入。
            calloutType: risk
            claimRefs:
              - CI009
              - CI025
              - CI028
              - CI030
              - CI031
          - type: callout
            title: 诉讼在关键扩张阶段增加成本和采用摩擦
            body: >-
              Illumina 诉讼不只是法律脚注。法院文件确认针对 Element 的专利诉讼仍在进行，而 Element 自己的起诉书指控 Illumina
              采用定价和服务策略压制竞争。这种组合可能推高法律成本，并在现金跑道公开前复杂化销售执行。
            calloutType: risk
            claimRefs:
              - CI032
              - CI033
              - CI034
              - CI035
              - CI037
          - type: callout
            title: 承销应要求私人利润率和现金跑道材料包
            body: 公开证据已经足以确认规模、产品定价和经常性使用动能，但不足以支持对资本充足性的高置信判断。严肃尽调应要求现金余额、烧钱速度、按收入流拆分的毛利率、耗材附着率和 CAC/回本周期，再做任何估值或融资建议。
            calloutType: recommendation
            claimRefs:
