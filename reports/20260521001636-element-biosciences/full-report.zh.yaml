      - number: '1.4'
        title: 里程碑、合作、监管雄心和法律阴影
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正在从核心测序扩展到靶向测序、多组学，以及早期受监管市场雄心。2022 年总部启用和 AVITI 发布之后，Element 于 2024 年开放 AVITI24 预订，同年晚些时候推出
              Trinity 靶向测序，2025 年初与 Revvity 合作开发新生儿 IVD 工作流，并通过 SOPHiA Genetics 和 Gene Solutions 扩大合作伙伴网络。2026 年 1 月 JPM
              会议上，管理层公开把下一阶段绑定到 IVDR 认证 AVITI、ISO 13485 工作和 FDA 申报；2026 年路线图还预告了 VITARI，以及 AVITI24 上的组织空间测序。


              主要负面抵消项是诉讼强度。Illumina 于 2025 年 5 月起诉 Element 侵犯专利；Element 随后于 2025 年 9 月反诉，提出美国反垄断主张，并在美国和德国提起自己的专利诉讼。2026
              年 5 月，10x Genomics 和 Harvard 又开辟另一战线，指控 AVITI24 和 Teton 侵犯四项 Harvard 授权专利，并寻求禁令和损害赔偿。尽调视角下，Element
              的公司概况同时是增长故事和 IP 战斗故事：支撑商业动能的同一轮产品扩张，也让公司持续卷入与既有竞争者的实时法律争端。
