  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-unit-economics
    missingEvidence: Current 2026 gross margin, service burden, warranty reserve, and cohort-level consumables gross-profit
      data.
    whyItMatters: These metrics determine whether installed-base growth converts into durable platform economics and whether
      the last round multiple is supportable.
    diligencePath: Obtain monthly management reporting, cohort analytics, and quality-of-earnings support from finance and
      auditors.
    relatedQuestionRefs:
    - QV035
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-stack-and-waterfall
    missingEvidence: Full cap table, liquidation preferences, seniority, conversion mechanics, and any participating-preference
      features.
    whyItMatters: Enterprise-value scenarios cannot be translated into investor returns without knowing how value is distributed
      across preferred and junior holders.
    diligencePath: Review charter documents, cap-table model, and board-approved waterfall analysis in the legal data room.
    relatedQuestionRefs:
    - QV036
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-utilization
    missingEvidence: Top-customer revenue share, regional mix, renewal behavior, and cohort-level installed-base utilization
      data.
    whyItMatters: Concentration and weak utilization can compress life-science-tools multiples quickly even when placements
      are still growing.
    diligencePath: Request sales-ops cohort exports, contract sampling, and management commentary on customer mix and reorder
      behavior.
    relatedQuestionRefs:
    - QV037
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: litigation-damages-and-remedies
    missingEvidence: A quantified view of legal spend, damages exposure, injunction probability, and settlement range across
      the Illumina disputes.
    whyItMatters: Litigation is a direct valuation variable in this chapter and cannot be reduced to a generic risk label
      without remedy-level analysis.
    diligencePath: Commission outside IP and antitrust counsel to produce a probability-weighted litigation memo before making
      a priced decision.
    relatedQuestionRefs:
    - QV038
    relatedTableRefs:
    - TV005
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-partial-coverage
    missingEvidence: A broader set of directly comparable private sequencing-platform valuations with disclosed current revenue
      bases.
    whyItMatters: The comparable table relies on public comps plus one M&A reference because private sequencing valuations
      are sparsely disclosed.
    diligencePath: Supplement public work with banker materials, private-market databases, or management-provided comp sets
      during priced diligence.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
