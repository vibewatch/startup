callouts:
- calloutType: risk
  title: The public comp gap is the core valuation problem
  body: |-
    The strongest caution signal is not that Element lacks momentum; it is that the last disclosed ~$1.03 billion valuation still
    implies roughly 12x the ~2025 revenue level reported at JPM. Public sequencing-tool anchors cluster much lower: PacBio around
    the low-2x range and Illumina / 10x around the high-4x to ~5x range. That gap can be justified only if private diligence proves
    much stronger growth durability, margin structure, and cap-table cleanliness than the public record currently shows.
  claimRefs:
  - CV013
  - CV016
  - CV018
  - CV020
  - CV022
- calloutType: insight
  title: Element has real 2025 traction, but it was not a perfect year
  body: |-
    The company did not stand still after the 2024 round. Revenue reportedly rose from about $60 million in 2024 to about $85
    million in 2025, installed base exceeded 450 systems, and AVITI24 reached more than 35 percent of new instrument bookings.
    At the same time, management also reportedly fell short of the $100 million 2025 revenue goal discussed a year earlier. That
    combination argues for a live company with upside, not a fully de-risked premium valuation.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV031
- calloutType: recommendation
  title: 'Conviction threshold: demand audited economics and the full waterfall'
  body: |-
    The minimum diligence package for a constructive investment case near the last disclosed round is: current revenue and gross
    margin, cohort-level installed-base utilization and consumables pull-through, top-customer concentration, a litigation-risk memo,
    and the full preference waterfall. Without those documents, the company may be good but the price is still under-evidenced.
  claimRefs:
  - CV041
  - CV042
  - CV043
