    - Injunction, damages, weak consumables pull-through, or cap-table overhang.
  - - Base
    - 50%
    - 2025 proof broadly holds, placements and consumables continue to grow, and the 2024 round mostly holds without clear
      premium expansion.
    - 0.8-1.05
    - Roughly 9x-12x the reported 2025 revenue base; near the last disclosed round.
    - Roadmap does not convert into audited 2026 economics.
  - - Bull
    - 20%
    - VITARI and AVITI24 visibly expand demand, regulatory milestones advance, and litigation does not block commercialization.
    - 1.2-1.5
    - Roughly 14x-18x the reported 2025 revenue base, which requires sustained premium growth proof.
    - Roadmap optimism outruns shipment, margin, or regulatory reality.
  - - Probability-weighted view
    - 100%
    - Public evidence supports upside optionality but not conviction upside underwriting yet.
    - 0.83-0.96
    - Weighted toward the base case but below an aggressive premium case.
    - Any adverse legal or cap-table surprise would skew realized value lower.
