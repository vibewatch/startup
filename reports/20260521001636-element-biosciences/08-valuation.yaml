- id: public-comps-and-valuation-bridge
  title: Public comp bridge and valuation range logic
  body: |-
    The central valuation question is whether Element's last disclosed unicorn mark is supported by the public comp frame. Using the
    market-data and public-company disclosures retained in this chapter, the answer is only partially. Illumina's May 2026 market cap
    and guidance imply a sales multiple around the high-4x range. 10x Genomics is also around the high-4x range. PacBio sits much
    lower near the low-2x range. By contrast, Element's roughly $1.03 billion July 2024 post-money valuation against the roughly
    $85 million of 2025 revenue reported at JPM implies about 12.1x revenue, and against the roughly $60 million 2024 revenue base
    it implies about 17.2x. That is a very large premium over public sequencing-tool trading levels.

    There are reasons a private premium can exist. Element is earlier in commercialization, still growing faster than mature public
    peers, has a differentiated multiomics narrative, and operates inside a next-generation sequencing market that MarketsandMarkets
    expects to grow from $13.81 billion in 2026 to $27.14 billion by 2031. But market growth alone does not erase the premium gap,
    especially because public peers already offer investors audited statements, current margins, and clearer capital structures.
    Element does not.

    The scenario ranges therefore have to be price-sensitive. A bear case near $0.5 billion to $0.7 billion assumes growth slows,
    litigation weighs on adoption, and investors normalize Element closer to public-tool multiples. A base case of about $0.8 billion
    to $1.05 billion assumes the 2024 round roughly holds as 2025 execution and the 2026 roadmap keep the strategic story intact.
    A bull case of roughly $1.2 billion to $1.5 billion requires more than roadmap enthusiasm: it needs proof that VITARI, AVITI24,
    and regulatory progress translate into durable revenue, margin, and consumables economics.
