- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-relevant public sequencing-tool trading anchors plus one recent sequencing-platform M&A
      outcome visible in retained public sources through May 2026; private comps remain partial because most peers do not
      publish current revenue or cap-table detail.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Illumina
    - May 2026 market cap and 2026 guidance
    - $21.47B market cap; ~4.7x market-cap / guidance midpoint; StockAnalysis PS 4.85
    - Largest short-read incumbent and the cleanest audited mature-market anchor.
    - Scale, margins, and market position are much stronger than Element's.
  - - 10x Genomics
    - May 2026 market cap and 2026 guidance
    - $3.04B market cap; ~5.0x market-cap / guidance midpoint; StockAnalysis PS 4.77
    - Useful innovation-premium comp for a growth life-science tools platform.
    - Single-cell and spatial mix is not a direct sequencing-platform analogue.
  - - PacBio
    - May 2026 market cap and 2026 guidance
    - $0.37B market cap; ~2.2x market-cap / guidance midpoint; StockAnalysis PS 2.32
    - Shows where a listed sequencing company trades when scale is smaller and execution is uneven.
    - Long-read focus and restructuring history make it a harsh downside anchor.
  - - Singular Genomics / Deerfield
    - Dec. 2024 take-private
    - $20/share all-cash deal valuing the company at roughly $50M
    - Provides an M&A cautionary outcome for a subscale sequencing platform.
    - Distressed strategic transaction, not a healthy growth-company multiple.
  notes: Comparable set mixes public trading anchors and one recent M&A reference because private sequencing valuations are
    not broadly disclosed in the retained public record.
