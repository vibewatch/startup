- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: 2025 revenue, placement growth, and AVITI24 mix show Element is scaling beyond a science-project story.'
    - Produce audited 2026 revenue, gross margin, and cohort pull-through proving that placements convert into durable economics.
  - - 'Thesis: VITARI and tissue-capable AVITI24 could expand the company from benchtop sequencing into broader multiomics
      workflows.'
    - Show launch conversion, regulatory progress, and customer uptake instead of roadmap-only evidence.
  - - 'Anti-thesis: The last disclosed ~$1.03B valuation implies roughly 12x 2025 revenue, well above public sequencing-tool
      comps.'
    - Demonstrate that 2026 growth and margins justify a premium multiple rather than just a venture premium.
  - - 'Anti-thesis: Illumina litigation can widen discounting through legal spend, injunction risk, and commercial hesitation.'
    - Resolve or sharply de-risk the litigation with a favorable court posture or negotiated outcome.
  - - 'Anti-thesis: >$680M of prior capital makes preference terms decisive for realized investor returns.'
    - Disclose the cap table and liquidation waterfall so downside and upside distribution can be underwritten.
  notes: The table separates company-quality arguments from price-support arguments so the investment call stays valuation-sensitive.
