- id: final-diligence-and-exit-readiness
  title: Final diligence asks and exit readiness
  body: |-
    Exit readiness is still provisional. Retained public sources show a company with momentum, product ambition, and a plausible
    strategic role in sequencing and multiomics, but they do not show the disclosure package needed for confident price discovery.
    The public record still lacks audited 2026 revenue and gross margin, installed-base utilization by cohort, consumables reorder
    behavior, top-customer concentration, the full preference waterfall, and a quantified litigation-risk memo. Those are not side
    questions; they are the variables that determine whether the last round is fair, stretched, or already impaired.

    The practical diligence path is therefore clear. Investors need a 2026 bridge from roughly $85 million of reported 2025 revenue
    to current run-rate revenue, with gross margin and service economics broken out. They need cohort-level evidence that the
    >450-system base is producing durable consumables pull-through rather than front-loaded hardware placements. They need outside
    counsel to bound the Illumina disputes. And they need the cap table and liquidation terms before treating any enterprise-value
    scenario as a realistic common-equity outcome. Until those packets are in hand, the right stance is to monitor, not chase.
