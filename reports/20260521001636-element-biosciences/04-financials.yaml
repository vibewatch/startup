callouts:
- calloutType: strength
  title: Recurring revenue quality is improving as consumables scale with placements
  body: The clearest positive signal in the public record is not the hardware list price but the more-than-twofold
    2025 increase in consumable kit shipments alongside a placed base above 450 systems. That pattern
    suggests Element is beginning to convert hardware placements into recurring usage rather than only
    one-time capital sales.
  claimRefs:
  - CI018
  - CI019
  - CI029
- calloutType: risk
  title: Pricing pressure is real before margins are publicly visible
  body: Element’s own 2026 deck flags a highly competitive pricing environment, while a customer genomics
    core reported further AVITI price cuts as purchasing volume rose. Without disclosed gross margin or
    realized ASPs, investors cannot tell whether price-led adoption is expanding economic profit or merely
    scaling revenue.
  claimRefs:
  - CI009
  - CI025
  - CI028
  - CI030
  - CI031
- calloutType: risk
  title: Litigation adds cost and adoption friction during a critical scale-up phase
  body: The Illumina litigation is not just a legal footnote. Court filings confirm active patent litigation
    against Element, while Element’s own complaint alleges pricing and services tactics designed to suppress
    competition. That combination can raise legal cost and complicate sales execution before cash runway
    is publicly known.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035
  - CI037
- calloutType: recommendation
  title: Underwriting should require a private margin and runway package
  body: Public evidence is now good enough to establish scale, product pricing, and recurring-usage momentum,
    but it is not good enough to support a conviction view on capital adequacy. A serious diligence process
    should require cash balance, burn, gross margin by stream, consumables attachment, and CAC/payback
    before any valuation or financing recommendation.
  claimRefs:
  - CI036
  - CI037
  - CI038
  - CI040
