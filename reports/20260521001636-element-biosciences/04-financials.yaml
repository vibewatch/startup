- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash on hand and monthly burn
    - Cannot bound runway or dilution risk after Series D
    - Request monthly cash balance, operating cash burn, and board-approved runway forecast
  - - Gross margin by stream
    - Cannot tell whether hardware placements are profitable or subsidized by future consumables
    - Request gross margin split across instruments, consumables, support, and upgrades
  - - Realized ASPs and support pricing
    - List prices may overstate actual monetization if discounts or bundled service terms are material
    - Request booked ASP report, discount ladders, warranty attach rates, and support contract schedule
  - - Consumables attachment and utilization by cohort
    - Installed-base growth is less valuable if placed instruments are underutilized
    - Request recurring consumables revenue per system and connected-run activity by cohort
  - - CAC, payback, and sales cycle
    - Cannot judge whether growth is capital efficient or channel leverage is improving
    - Request pipeline conversion, CAC by motion, and payback by cohort
  - - Customer concentration
    - A small number of lighthouse accounts could distort revenue quality and negotiating leverage
    - Request top-10 customer exposure and revenue by segment / geography
  notes: These are underwriting blockers, not cosmetic asks. Each gap maps to a specific question that
    public evidence could not fully answer.
