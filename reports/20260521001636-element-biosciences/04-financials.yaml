  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly gross and net burn, debt facilities, and management runway
      forecast after the July 2024 Series D.
    whyItMatters: Without cash and burn figures, capital adequacy cannot be underwritten and dilution
      risk cannot be bounded.
    diligencePath: Request monthly cash balance, burn bridge, debt schedule, and board-approved operating
      plan under NDA.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin by revenue stream, consumables attachment, CAC, payback period, average
      sales cycle, and channel mix.
    whyItMatters: The business can scale top line while still destroying value if instrument subsidies,
      support intensity, or sales efficiency are unfavorable.
    diligencePath: Request quarterly margin bridge, cohort CAC/payback analysis, and direct-versus-distributor
      pipeline conversion data.
    relatedQuestionRefs:
    - QI013
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs for AVITI and AVITI24, service-contract pricing, warranty attach rates,
      and contracted consumables discounts by cohort.
    whyItMatters: List prices overstate monetization if larger labs negotiate materially lower upfront
      or recurring prices.
    diligencePath: Request price realization report by product family, including discount ladders, upgrade
      attach rates, and support-contract mix.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-utilization
    missingEvidence: Customer concentration, system utilization by cohort, and recurring consumables revenue
      per installed system.
    whyItMatters: Installed-base growth is less valuable if usage is shallow or concentrated in a small
      number of lighthouse accounts.
    diligencePath: Request top-customer exposure, cohort utilization curves, and annual consumables revenue
      per instrument placed.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI005
