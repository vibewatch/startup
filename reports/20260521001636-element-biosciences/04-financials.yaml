- id: commercial-scale-and-traction
  title: Commercial scale and public traction proxies
  body: |-
    Public traction moved from early commercial proof to material scale between 2023 and 2025. Element disclosed more than $25 million of 2023 revenue, more than 160 commercial orders, and 112 instruments installed by January 2024. By May 2024 it had surpassed 200 cumulative orders, and Series D materials later said AVITI placements grew from roughly 40 units to more than 190 in the prior twelve months. The 2026 JPM deck extends that arc: about $60 million of 2024 revenue, about $85 million of estimated 2025 revenue, over 450 systems placed across more than 40 countries, and both connected runs and consumable kit shipments up more than two times year over year.

    Those numbers matter because they create the first public bridge from hardware placements to a recurring-usage business. They also suggest that Element is no longer a pre-scale challenger: it has enough fielded systems for consumables pull-through and workflow upgrades to affect mix. The same deck says clinical research exceeded 25 percent of total 2025 revenue and AVITI24 drove more than 35 percent of new instrument bookings within a year of first customer shipment, implying the company is not relying only on standard short-read research demand. Even so, the scale remains modest relative to incumbent economics, and the company still publishes snapshots rather than audited financial statements or cohort-level operating data.
