- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Public evidence
  - Mitigation / diligence ask
  rows:
  - - AVITI quality and affordability
    - Illumina installed base and ongoing product refresh can blunt switching
    - high
    - Element cites lower error performance and $200 genome economics, but Illumina still sets the category default
    - Ask for win/loss data against NovaSeq and NextSeq accounts by workload and region
  - - Trinity workflow simplification
    - Incumbent kit ecosystems and service providers can preserve traditional hybrid-capture paths
    - medium
    - Trinity shortens targeted workflows, but public all-in realized pricing is still limited
    - Request customer adoption, reorder, and assay-migration data for Trinity
  - - AVITI24 multiomic adjacency
    - Specialist single-cell / long-read / proteomics stacks may still win on category depth
    - medium
    - AVITI24 expands workflow breadth, but direct product-vs-product benchmarks remain sparse
    - Request competitive bakeoff results versus specialized multiomic tools
  - - Commercial traction and channel reach
    - Public evidence shows adoption, but not exclusivity or sole-source status
    - medium-high
    - Element reported 100+ orders, 13 countries, and 11 distributors; no public exclusive-channel evidence was found
    - Ask for renewal, expansion, and distributor productivity data
  - - Price narrative
    - Volume-dependent economics can compress margins or fail to clear in smaller accounts
    - high
    - The $200 genome depends on heavy kit usage and VITARI now raises expectations to $100 genomes
    - Stress-test realized economics by cohort size and utilization band
  - - Service-provider substitute
    - GENEWIZ, Novogene, and academic cores let customers buy output instead of systems
    - high
    - Public service menus span Illumina, Ultima, PacBio, ONT, and AVITI
    - Segment pipeline by customers who insource versus outsource sequencing
  - - Workflow openness
    - Library compatibility and easy pipeline integration help adoption but also reduce lock-in
    - medium
    - Novogene advertises Illumina-to-Ultima conversion and Element customers describe easy pipeline integration
    - Ask how often Element becomes system of record versus one option in a multi-platform lab
  - - Patent and competition litigation
    - Procurement caution, channel friction, and management distraction
    - high
    - Illumina sued Element in 2025 and Element countersued later that year
    - Track injunction risk, customer communications, and settlement / licensing scenarios
  notes: Severity reflects underwriting impact on win rate, expansion, or pricing durability rather than legal odds or absolute company quality. Public evidence is still thin on renewal data and realized gross-margin consequences.
