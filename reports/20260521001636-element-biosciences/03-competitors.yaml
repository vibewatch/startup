  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: instrument-list-pricing
    missingEvidence: Realized OEM instrument list prices, discount schedules, and bundled reagent commitments across Illumina, Element, MGI, Ultima, PacBio, and ONT.
    whyItMatters: Public pricing visibility is much better for service access than for outright instrument purchase, which limits clean apples-to-apples TCO comparisons.
    diligencePath: Request recent quotes, standard discount bands, and minimum reagent commitments from management and from at least two customer references.
    relatedQuestionRefs:
    - QP016
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: exclusive-channel-power
    missingEvidence: Contract evidence showing whether Element has any sole-source, exclusive-distributor, or exclusive-workflow positions inside major accounts.
    whyItMatters: Without exclusivity or system-of-record evidence, distributor count and order growth do not automatically translate into durable lock-in.
    diligencePath: Ask for top-account contract terms, renewal cohorts, and win-loss detail that distinguishes single-platform standardization from pilot deployments.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: regulated-trust-posture
    missingEvidence: Clear public evidence comparing regulated diagnostic, RUO, or compliance posture across Element and peers for the same buyer workflow.
    whyItMatters: Trust and regulatory fit can shape procurement decisions in translational and clinical-research accounts, but the public evidence reviewed here was uneven.
    diligencePath: Collect RUO / diagnostic labeling summaries, quality-system certifications, and customer validation requirements for each priority platform.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: renewal-durability
    missingEvidence: Cohort data on AVITI renewals, reagent pull-through, and share-of-wallet expansion after the first instrument lands.
    whyItMatters: The underwriting question is not whether Element can win pilots; it is whether the win compounds into standardization, higher utilization, and durable reagent revenue.
    diligencePath: Request renewal curves, reagent attach rates, and account-expansion case studies by customer segment and geography.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP004
