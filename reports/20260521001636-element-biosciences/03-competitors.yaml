- id: long-read-and-multimodal-substitutes
  title: Long-read and multimodal substitutes
  body: |-
    PacBio and Oxford Nanopore are not direct short-read clones, but they still compete for the same research budgets whenever buyers prioritize structural variation, methylation, ultra-long reads, or real-time output over pure short-read economics. PacBio's Revio page emphasizes 15–20 kb HiFi reads, native methylation calling on every standard run, and up to 2,500 human genomes per year, while the company's Q1 2026 results showed 15 Revio placements and record consumables strength tied to growing clinical adoption. Oxford Nanopore makes a different tradeoff: its device range spans portable MinION through high-output PromethION, and the PromethION page emphasizes independently addressable flow cells, terabase-scale real-time output, and population-scale sequencing rather than Illumina-style fixed short-read operating points.

    Those substitutes matter because Element's strongest advantages today are still inside the short-read workflow. AVITI24 broadens the story by promising direct cell profiling and multiomic cell analysis from a single sample, in a single run, with no library prep, but that is not the same as offering native long reads. In other words, Element can widen from short-read sequencing toward adjacent multiomics, yet buyers that specifically need long-read genome completeness, phasing, or native methylation still have established reasons to buy or outsource PacBio and ONT instead. The substitute set therefore stretches beyond short-read price-per-gigabase comparisons: it includes any platform that lets a lab solve the biological question with fewer assays, even if the read technology is fundamentally different.
