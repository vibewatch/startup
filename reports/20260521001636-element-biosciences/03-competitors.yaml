- id: service-provider-and-status-quo-substitutes
  title: Service-provider and status-quo substitutes
  body: |-
    The most underappreciated substitute for Element is not another box in the lab; it is the ability to avoid buying a box at all. Northwestern's FY26 pricing page openly lists Illumina NovaSeq X, DNBSEQ, AVITI, PacBio Revio, and Nanopore PromethION service prices side by side, which means a buyer can compare output economics without committing capex or internal staffing. GENEWIZ from Azenta advertises sample-to-analysis NGS services on Illumina NovaSeq X, PacBio Revio, and Oxford Nanopore platforms, while Novogene markets a broader umbrella spanning Illumina, Ultima, PacBio, and Nanopore and claims capacity for up to 200,000 human genomes per year. Novogene also offers pre-made library sequencing on Ultima and explicitly accepts both Ultima- and Illumina-compatible libraries, with conversion included.

    That service layer changes switching-cost math. A lab can preserve its incumbent library workflows, buy just the analysis it needs, or split projects across vendors instead of standardizing on one instrument family. Service providers also institutionalize multi-homing: the same organization can route short-read WGS to Illumina or Ultima, long reads to PacBio or ONT, and targeted or single-cell work to whichever platform is cheapest or fastest that week. Element has evidence that switching into AVITI is feasible—its early customer base skewed toward experienced upgraders, and customer quotes highlighted easy pipeline integration—but the same openness that lowers barriers to adoption also lowers barriers to leaving. For underwriting, that makes outsource-heavy buyers and intermittently used labs especially vulnerable to staying in the status quo rather than creating a durable in-house Element footprint.
