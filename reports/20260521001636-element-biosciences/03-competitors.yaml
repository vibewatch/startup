- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer
  - Public pricing signal
  - Unit / contract model
  - Included capability
  - Unknowns / caveats
  - Implication
  rows:
  - - Element AVITI economics
    - $200 genome / $2 per Gb (company-claimed)
    - High-usage reagent commitment plus instrument footprint
    - Benchtop short-read sequencing
    - Claim depends on utilization and ≥230 flow cells per quarter
    - Compelling for busy mid-throughput labs; less persuasive for intermittent users
  - - Element Trinity
    - No posted all-in system price; workflow claim is 24 exomes / flow cell and ~1 day TAT
    - Element sequencing kits plus partner panel reagents
    - On-instrument targeted sequencing workflow
    - Requires partner reagents from IDT or Twist and public realized economics are limited
    - Workflow simplification is a differentiation lever even when direct pricing is opaque
  - - Element VITARI
    - $689,000 list price; $100 whole-genome claim
    - Instrument purchase plus future reagent use
    - High-throughput benchtop short-read sequencing
    - Shipping starts in 2H 2026; realized field economics are not yet public
    - Raises the competitive ceiling but also raises execution risk
  - - Illumina NovaSeq X Plus (NUSeq FY26)
    - $3,000 internal / $3,750 external / $3,817 industrial for 25B PE150 lane
    - Service pricing by lane / flow-cell access
    - Production-scale short-read output
    - Core pricing is a service proxy, not system TCO
    - Buyers can access Illumina-scale output without owning the system
  - - MGI DNBSEQ (NUSeq FY26)
    - $1,500 internal / $1,875 external / $1,918 industrial for DNBSEQ FCS PE150
    - Service pricing by flow cell
    - Short-read alternative using DNBSEQ
    - Academic-core proxy rather than OEM list pricing
    - Shows a visible lower-price public alternative to Illumina service access
  - - Element AVITI (NUSeq FY26)
    - $1,000 internal / $1,200 external / $1,221 industrial for PE75 high-output lane
    - Service pricing by lane
    - Short-read AVITI output without platform purchase
    - Not directly comparable to every PE150 workflow
    - Public core pricing helps buyers trial Element before buying instruments
  - - PacBio Revio (NUSeq FY26)
    - $2,050 internal / $2,460 external / $2,519 industrial per flow cell
    - Service pricing by flow cell
    - HiFi long-read sequencing
    - Long-read output is not apples-to-apples with short-read lanes
    - Long-read substitute remains economically visible to buyers
  - - Oxford Nanopore PromethION (NUSeq FY26)
    - $1,750 internal / $2,187.50 external / $2,213 industrial per flow cell
    - Service pricing by flow cell
    - High-output long-read sequencing
    - Read modality differs materially from SBS short reads
    - Real-time long-read outsourcing can beat capex for episodic use
  - - Novogene on Ultima
    - Lower cost per million reads (provider-claimed)
    - Service contract; accepts Ultima- and Illumina-compatible libraries
    - UG100 wafer sequencing with conversion support
    - Exact quoted price is project-specific
    - Makes it easier to test low-cost wafer sequencing without switching internal workflows
  notes: This table mixes official company price claims with academic-core service prices because OEM instrument list pricing is rarely posted publicly. Service pricing is a substitute lens, not a full total-cost-of-ownership model.
