evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation for the 2024 Series D or any later board-approved 409A / secondary pricing evidence.
    whyItMatters: >-
      Valuation is a cover metric for chapter 1 and changes the framing of capital efficiency versus current litigation
      and regulatory risk.
    diligencePath: Request the latest financing deck, cap table, and any 409A or secondary tender documentation from management.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: customer-disclosure
    missingEvidence: >-
      A current total customer or active-account count, ideally split between research, pharma, and clinical-lab
      customers.
    whyItMatters: >-
      Installed systems and country reach are useful proxies, but customer count is a requested cover metric and helps
      separate concentration risk from broad adoption.
    diligencePath: >-
      Request current installed-base/customer cohort reporting or a sales operations export that defines active
      instrument accounts as of 2026-05-21.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A 2025 or 2026 employee count from an official source rather than a 2024 profile.
    whyItMatters: >-
      Headcount is a requested cover metric and is a useful read-through on go-to-market scale, burn, and organizational
      readiness for clinical expansion.
    diligencePath: Request a current org-size disclosure, latest payroll/headcount dashboard, or HR board slide as of run date.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-changes
    missingEvidence: A dated public record of executive additions, departures, or role changes across 2025-2026.
    whyItMatters: >-
      The current team roster is visible, but without a dated change log it is hard to assess churn or succession
      readiness from public materials alone.
    diligencePath: >-
      Request board minutes, HR leadership memos, or a management-team timeline that records executive changes over the
      last 24 months.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR, gross margin, and similar private-company operating metrics.
    whyItMatters: >-
      Chapter 1 should anchor later financial and valuation work, and the absence of unit-economics disclosure limits
      how far an external analyst can go beyond revenue and placements.
    diligencePath: >-
      Request the latest board deck or finance KPI package with ARR, gross margin, consumables mix, and instrument
      gross-profit detail.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: early-round chronology
    missingEvidence: Precise public dates and round-size detail for Series B and the exact AVITI commercial launch date.
    whyItMatters: >-
      The milestone table is directionally strong, but the earliest commercialization entries still rely on
      profile-style reporting instead of a complete first-party chronology.
    diligencePath: >-
      Request an internal company timeline or archived launch materials that pin exact dates for the 2019-2022
      milestones.
    relatedQuestionRefs:
      - QO010
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A public source that isolates an Element-specific SAM or SOM for research-use benchtop short-read sequencing plus
      adjacent multiomics workflows.
    whyItMatters: >-
      Without a narrow SAM/SOM, valuation work risks anchoring on a broad DNA sequencing TAM that materially overstates
      what Element can presently reach.
    diligencePath: >-
      Request management or investor materials that break the market into mid-throughput short-read, adjacent workflow,
      and clinical-transition buckets with explicit assumptions.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Segment-level data on how Element bookings split across academic, pharma, service-lab, and clinical-adjacent
      buyers, including who signs and who pays.
    whyItMatters: >-
      The procurement cycle and attach-rate economics differ sharply by buyer class, so an undifferentiated customer
      count does not explain revenue quality.
    diligencePath: >-
      Ask for customer segmentation by bookings, installed base, and recurring consumables revenue, plus win-loss detail
      versus Illumina by buyer type.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: realized-tco
    missingEvidence: >-
      Customer-level realized instrument utilization, reagent pricing, and payback periods by workflow rather than
      vendor headline savings claims.
    whyItMatters: >-
      Element's market share case depends on better economics for medium-scale labs, but public sources do not disclose
      actual realized TCO by customer segment.
    diligencePath: >-
      Collect reference calls and internal cohort data on utilization, consumables pull-through, and competitive
      replacement economics by lab profile.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM004
  - type: access-blocked
    severity: minor
    topic: analyst-methodology
    missingEvidence: Full methodologies and category definitions behind the major analyst reports cited here.
    whyItMatters: >-
      The range of published market estimates partly reflects scope drift, but paywalled or blocked methodologies limit
      precise apples-to-apples reconciliation.
    diligencePath: Obtain full analyst reports or internal market models before using any one estimate as a valuation anchor.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
