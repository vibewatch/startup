companyProfile:
  summary: >-
    Element Biosciences is a San Diego private life-science tools company building DNA sequencing and
    integrated multi-omics platforms around its avidity sequencing chemistry. Founded in 2017 by Molly He,
    Michael Previte, and Matthew Kellinger, the company has expanded from the original benchtop AVITI system
    into AVITI LT, AVITI24, Trinity targeted workflows, and a previewed higher-throughput VITARI roadmap.
    Public evidence shows meaningful commercial traction, but the company remains privately held and materially
    less transparent than public sequencing peers on margins, cap-table terms, and current headcount.
  foundedDate: "2017-01-01"
  founders:
    - name: Molly He
      role: CEO, co-founder, and board member
      background: Genomics operator and company public face leading product vision, fundraising, and strategy.
      claimRefs: [CO001, CO013]
    - name: Michael Previte
      role: CTO and SVP of Advanced Research, co-founder
      background: Technical co-founder still leading platform architecture and advanced research.
      claimRefs: [CO001, CO014]
    - name: Matthew Kellinger
      role: VP of Biochemistry, co-founder
      background: Scientific co-founder responsible for core biochemistry behind Element's differentiated workflows.
      claimRefs: [CO001, CO015]
  foundingLocation: San Diego, CA
  headquarters: San Diego, CA
  productSummary: >-
    Element sells the AVITI sequencing family and AVITI24 integrated multi-omics platform, plus associated
    reagents, kits, and software workflows such as Trinity; public materials also preview VITARI as a
    higher-throughput sequencing platform.
  customerFocus: >-
    Genome centers and core labs, academic translational researchers, biotech and pharma R&D teams,
    clinical workflow partners, and selected service laboratories.
  businessModel: >-
    Hardware-plus-consumables model built on instrument placements, paid upgrades, and recurring reagent and
    kit usage as installed systems scale.
