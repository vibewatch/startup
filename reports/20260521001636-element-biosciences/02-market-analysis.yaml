  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Declining sequencing costs and lower-throughput fit
        - positive
        - current / near-term
        - Supports adoption in cost-sensitive and medium-scale labs
        - Validate real customer TCO using reagent mix and utilization assumptions rather than vendor marketing alone
      - - Precision medicine and broader clinical genomics adoption
        - positive
        - mid-term
        - Expands the overall category and supports higher-value workflows
        - Separate research demand from reimbursed clinical demand when sizing Element's reachable market
      - - Multiomics and spatial sequencing expansion
        - positive
        - near-term
        - Lets Element sell into adjacent workflows rather than only standard short-read runs
        - Check attach rates and repeat consumables for AVITI24 and future VITARI users
      - - Workflow ecosystem partnerships
        - positive
        - near-term
        - Reduces switching friction and makes AVITI easier to operationalize
        - Request partner-derived pipeline adoption and win-rate data
      - - Illumina installed base and workflow lock-in
        - negative
        - current
        - Slows platform displacement and raises validation burden
        - Ask for competitive win/loss data by segment and incumbent platform
      - - High capital expense and informatics burden
        - negative
        - current
        - Can delay or block adoption in smaller labs
        - Review full instrument, storage, analytics, and staffing cost stack
      - - Standardization and regulatory validation requirements
        - negative
        - current / mid-term
        - Limits direct clinical conversion from RUO success
        - Track IVDR, ISO 13485, and FDA milestones against named assay workflows
      - - Cross-modality competition and uneven demand
        - mixed
        - current / mid-term
        - Short-read growth can coexist with weak instrument purchasing cycles or long-read substitution pressure
        - Clarify where Element complements versus competes with long-read and other multiomic modalities
    notes: >-
      This table ties each driver or constraint to adoption timing and the specific diligence work still needed.
      Positive category growth does not automatically convert into Element share capture.
