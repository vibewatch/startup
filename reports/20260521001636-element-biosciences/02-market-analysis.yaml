  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: >-
        A public source that isolates an Element-specific SAM or SOM for research-use benchtop short-read sequencing
        plus adjacent multiomics workflows.
      whyItMatters: >-
        Without a narrow SAM/SOM, valuation work risks anchoring on a broad DNA sequencing TAM that materially
        overstates what Element can presently reach.
      diligencePath: >-
        Request management or investor materials that break the market into mid-throughput short-read, adjacent
        workflow, and clinical-transition buckets with explicit assumptions.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: >-
        Segment-level data on how Element bookings split across academic, pharma, service-lab, and clinical-adjacent
        buyers, including who signs and who pays.
      whyItMatters: >-
        The procurement cycle and attach-rate economics differ sharply by buyer class, so an undifferentiated customer
        count does not explain revenue quality.
      diligencePath: >-
        Ask for customer segmentation by bookings, installed base, and recurring consumables revenue, plus win-loss
        detail versus Illumina by buyer type.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM003
    - type: private-evidence-only
      severity: material
      topic: realized-tco
      missingEvidence: >-
        Customer-level realized instrument utilization, reagent pricing, and payback periods by workflow rather than
        vendor headline savings claims.
      whyItMatters: >-
        Element's market share case depends on better economics for medium-scale labs, but public sources do not
        disclose actual realized TCO by customer segment.
      diligencePath: >-
        Collect reference calls and internal cohort data on utilization, consumables pull-through, and competitive
        replacement economics by lab profile.
      relatedQuestionRefs:
        - QM011
      relatedTableRefs:
        - TM004
    - type: access-blocked
      severity: minor
      topic: analyst-methodology
      missingEvidence: Full methodologies and category definitions behind the major analyst reports cited here.
      whyItMatters: >-
        The range of published market estimates partly reflects scope drift, but paywalled or blocked methodologies
        limit precise apples-to-apples reconciliation.
      diligencePath: Obtain full analyst reports or internal market models before using any one estimate as a valuation anchor.
      relatedQuestionRefs:
        - QM004
      relatedTableRefs:
        - TM002
