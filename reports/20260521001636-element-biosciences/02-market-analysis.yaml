      - - Service and reference labs
        - Lab operations leader or product owner
        - Lab technologists, assay developers, bioinformatics teams
        - Commercial testing revenue and operating budget
        - Sample-to-result workflow with validated reagents, analysis, and reporting
        - Lab P&L / operations budget
        - Workflow fit, easier implementation, and scalable support
      - - Clinical-adjacent prenatal / oncology labs
        - Clinical lab director or business unit lead
        - Clinical genomics staff
        - Capex budget tied to future testing volume
        - In-house NIPT or panel workflows with validation requirements
        - Laboratory capital committee
        - Regulatory-ready path and validated assay support
      - - Smaller specialist labs
        - PI or lab manager
        - A small research team
        - Grant or departmental budget
        - Lower-volume projects where forced batching is inefficient
        - Departmental or project budget
        - Affordable benchtop economics and faster turnaround
    notes: >-
      The same instrument can sell into very different procurement paths. Budget owner and adoption trigger change
