- "id": "capital-and-scale"
  "title": "Capital Base, Commercial Scale, and Disclosure Limits"
  "body": |-
    Element reached late-stage private-company scale quickly. Public materials show a seed in 2017, Series A in 2018, a follow-on Series B within a year of the 2019 A, a $276 million Series C in 2021, and an oversubscribed Series D of more than $277 million in 2024. The Series D release took cumulative funding above $680 million and added crossover and strategic names such as Wellington Management, Samsung Electronics, Fidelity, Foresite, T. Rowe Price, and Venrock. The same release also showed commercial progress, with AVITI placements growing from roughly 40 to more than 190 units in the preceding year and customers spanning more than 25 countries.

    Later independent reporting pushed the scale picture further. GenomeWeb reported roughly $85 million of 2025 revenue, more than 450 systems placed by year-end 2025, and AVITI24 contributing more than 35 percent of new bookings after just one year in market. What the public record still does not provide is an exact current valuation, a current customer count, or a fresh headcount. That means the company looks commercially real and well capitalized, but the chapter still has to carry explicit nulls and diligence asks for several cover metrics that a public tools company would ordinarily disclose by default.
