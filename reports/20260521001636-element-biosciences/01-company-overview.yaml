- "id": "leadership-and-governance"
  "title": "Founders, Leadership, and Governance"
  "body": |-
    Element's operating leadership is still founder-heavy. Molly He remains CEO and a board member, Michael Previte remains CTO and head of advanced research, and Matthew Kellinger remains the biochemistry founder. That concentration is an asset in product coherence because the people who built the core chemistry and instrument vision still lead the roadmap, but it also concentrates execution risk in a small founding group. Public roster pages show the broader executive bench now includes finance, people, legal, informatics, operations, sales, and business-development leaders, which suggests the company has staffed for a more mature commercial stage even if it is still privately held.

    Governance also appears venture-influenced rather than founder-controlled in the public record. The board roster includes Molly He plus Bryan Roberts and Jim Tananbaum, linking the board directly to Venrock and Foresite, two investors visible in Element's disclosed financing history. What remains less visible is the detailed allocation of control rights, observer seats, or special governance terms following the 2024 Series D. That means the public record is strong enough to map the visible people in the room, but not strong enough to infer exact governance power from outside materials alone.
