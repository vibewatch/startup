        - Genomics lab operator and core facility
        - Commercial core benchtop platform
        - Avidity-based sequencing in a dual-flow-cell benchtop system with broad workflow coverage
        - Public hardware and software version roadmap is limited
      - - AVITI LT
        - Smaller or cost-sensitive sequencing lab
        - Commercial lower-throughput variant of AVITI
        - Extends the AVITI workflow to lower-throughput budgets without changing the broader product family
        - Public evidence on installed-base scale and upgrade behavior is thin
      - - AVITI24
        - Single-cell, spatial, and multiomics research teams
        - Commercial expansion platform with current multiomic claims
        - >-
          Combines sequencing with direct-in-sample co-detection of RNA, protein, and morphology, with no library prep
          on cited pages
        - Public production-case depth is still lighter than for core AVITI sequencing
      - - Cloudbreak kit family
        - Lab operations and sequencing workflow owner
        - Commercial reagent layer across multiple outputs and quality tiers
        - Freestyle reduces library-conversion friction and UltraQ pushes higher-accuracy positioning
        - Realized cost and performance by application are not broken out publicly
      - - Trinity workflow
        - Targeted-sequencing and exome users
        - Commercial workflow extension launched in 2024
        - Moves capture-related workflow steps onto the instrument and reduces manual time
        - Public external benchmarking outside company and partner materials remains limited
      - - VITARI
        - High-throughput genome, exome, and oncology research lab
        - Newly launched; shipping planned for H2 2026
        - Extends Element into high-throughput sequencing with 10B-read positioning in a benchtop footprint
        - External customer run data and early-access validation were not public at launch
      - - ElemBio Cloud / Catalyst / analysis tooling
        - Bioinformatics lead and lab operations team
        - Commercial software layer with public docs and tutorials
        - Run planning, monitoring, storage connections, and automated analysis flows tie the hardware stack together
        - No public uptime SLA, status page, or external security audit was visible
      - - GitHub bioinformatics repos
        - Practitioner and workflow engineer
        - Real but narrow developer signal
        - Public Nextflow, Python, and R assets help downstream operationalization
        - Signal is concentrated in analysis tooling rather than broad open APIs or instrument control
    notes: >-
      Rows distinguish instrument SKUs, reagent/workflow layers, and software assets so the chapter does not treat the
