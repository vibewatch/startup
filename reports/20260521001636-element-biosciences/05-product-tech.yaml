  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cloud reliability disclosure
      missingEvidence: A public uptime SLA, incident history, or status page for ElemBio Cloud and software-mediated workflow services.
      whyItMatters: >-
        Enterprise labs and regulated research environments need to understand service reliability and blast radius
        before making cloud orchestration operationally central.
      diligencePath: >-
        Request internal uptime dashboards, postmortem archive, customer-facing SLA language, and support escalation
        runbooks.
      relatedQuestionRefs:
        - QE023
        - QE024
    - type: missing-source
      severity: material
      topic: software assurance gap
      missingEvidence: >-
        An external security audit, SOC-type assurance package, or secure-SDLC evidence for ElemBio Cloud, Bases2Fastq,
        and CytoCanvas.
      whyItMatters: >-
        The software layer now coordinates run planning, storage, analysis, and visualization, so weak governance there
        can undermine the value of otherwise differentiated chemistry and hardware.
      diligencePath: >-
        Request audit reports, penetration-test summaries, change-management SOPs, release validation records, and
        customer security questionnaires.
      relatedQuestionRefs:
        - QE024
    - type: missing-source
      severity: material
      topic: VITARI validation gap
      missingEvidence: Independent customer run data, beta-site references, and comparative benchmarks for VITARI at launch.
      whyItMatters: >-
        VITARI is the biggest new product step in the portfolio, but underwriting should not assume AVITI-class
        validation automatically transfers to the new high-throughput platform.
      diligencePath: >-
        Request early-access customer references, internal vs external benchmark packs, failure-rate distributions, and
        reagent-utilization assumptions behind the $100 genome claim.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE005
    - type: private-evidence-only
      severity: minor
      topic: workflow governance
      missingEvidence: >-
        A public changelog or version-history policy for cloud analysis flows, bases2fastq-nf updates, and
        AVITI24-specific analytical tooling.
      whyItMatters: >-
        Version control and release discipline affect reproducibility, validation burden, and customer support cost even
        when public docs and repos exist.
      diligencePath: >-
        Request internal release calendar, versioning conventions, deprecation policy, and validation sign-off for
        software and workflow updates.
      relatedQuestionRefs:
        - QE024
        - QE025
