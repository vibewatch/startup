      layers:
        - label: Sample prep and workflow selection
          detail: >-
            Users enter through standard sequencing, targeted capture via Trinity, or direct-in-sample multiomics on
            AVITI24.
          modules:
            - Standard library prep
            - Trinity targeted capture
            - Direct-in-sample multiomics
        - label: Instrument and flow-cell layer
          detail: >-
            AVITI, AVITI LT, AVITI24, and VITARI provide the physical sequencing or imaging substrate, with
            dual-flow-cell concepts recurring across the family.
          modules:
            - AVITI / AVITI LT
            - AVITI24
            - VITARI
        - label: Chemistry and kit layer
          detail: >-
            Avidity chemistry plus Cloudbreak and Trinity kits define compatibility, quality, and targeted-workflow
            behavior.
          modules:
            - Avidity / Avidite chemistry
            - Cloudbreak Freestyle / UltraQ
            - Trinity reagents
        - label: On-board compute and primary analysis
          detail: >-
            Public coverage for VITARI and Element patents indicates embedded compute, basecalling, and primary-analysis
            IP are part of the product system.
          modules:
            - On-board compute
            - Basecalling
            - Primary analysis IP
        - label: Cloud orchestration and data movement
          detail: >-
            ElemBio Cloud and Catalyst handle run planning, monitoring, storage connections, and automated flow
            execution.
          modules:
            - Planned runs
            - Storage connections
            - Catalyst-managed analysis flows
        - label: Downstream analysis and visualization
          detail: >-
            Bases2Fastq, Nextflow pipelines, partner platforms, and CytoCanvas convert raw runs into analysis-ready
            outputs and visual review.
          modules:
            - Bases2Fastq
            - bases2fastq-nf
            - QIAGEN / Seqera integrations
