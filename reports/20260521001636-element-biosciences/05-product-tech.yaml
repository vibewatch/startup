company:
  name: Element Biosciences
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Element Biosciences now presents a real product ladder rather than a single sequencer: AVITI and AVITI LT for core
    benchtop sequencing, AVITI24 for direct-in-sample multiomics, and VITARI for newly launched high-throughput work,
    with Cloudbreak kits, Trinity targeted-capture workflows, and ElemBio Cloud software spanning the stack. Public
    evidence also shows genuine bioinformatics and developer surface via docs, GitHub pipelines, and partner
    integrations, but the strongest third-party validation still sits with AVITI and AVITI24. The main product-tech
    diligence gap is not whether the platform exists; it is whether newly launched VITARI and the broader cloud software
    layer have enough external validation, security disclosure, and operational governance for enterprise underwriting.
sections:
  - id: product-definition-and-workflows
    title: Element now sells a layered sequencing platform, not a single instrument SKU
    body: >-
      Public evidence shows Element Biosciences has moved beyond the original AVITI launch into a tiered product family
      with shared chemistry and workflow attachments. The 2026 homepage and product matrix place VITARI, AVITI24, AVITI,
      and AVITI LT into one portfolio, while Cloudbreak and Trinity span multiple systems as workflow-enabling kits
      rather than side accessories. In customer workflow terms, AVITI remains the core short-read benchtop system, AVITI
      LT is the smaller-footprint lower-throughput option, AVITI24 adds direct-in-sample and multiomic readouts, and
      VITARI extends the same company into high-throughput sequencing. Cloudbreak matters because it addresses library
      compatibility and output choice, while Trinity matters because it compresses targeted capture into a more
      instrument-centric workflow. The practical takeaway is that Element's product definition is instrument plus
      chemistry plus software plus downstream analysis. That breadth is strategically attractive because it supports
      land-and-expand inside the same account, but it also means diligence should separate the mature AVITI base from
      the newer VITARI and AVITI24 expansion layers.
    claimRefs:
