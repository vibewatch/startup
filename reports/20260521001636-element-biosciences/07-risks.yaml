company:
  name: Element Biosciences
chapter:
  number: 7
  title: Risks
  summary: >-
    Element Biosciences has real commercial traction, but the highest-severity public risks now cluster around three areas: a still-unfinished RUO-to-IVD transition, active multi-front IP litigation, and operational stretch as the company scales AVITI, AVITI24, and a broader 2026 roadmap at the same time. The reviewed record shows capital, customers, and ecosystem partners, yet it also shows how much of the next phase depends on future approvals, litigation outcomes, support-quality execution, and partner-mediated workflows rather than already-settled infrastructure. The prudent read is that Element is past concept risk but still very much inside execution, legal, and concentration risk.
sections:
  - id: regulatory-legal-and-clinical-transition
    title: "Regulatory, legal, and clinical transition risk"
    body: >-
      Element's public posture is still fundamentally research-first. Company materials position the platform around research markets, and IDT's AVITI workflow products are explicitly labeled for research use only and not for diagnostic procedures. FDA/HHS guidance matters here because RUO labels do not eliminate intended-use scrutiny; they frame a compliance boundary that gets harder to manage as the company pushes further into clinical workflows. Revvity's January 2025 announcement is therefore strategically important but also risk-signaling: it offers an immediate RUO newborn-sequencing workflow while saying the parties are co-developing an IVD solution and that Element is seeking AVITI regulatory approval. That means the clinical upside is visible, but not yet cleared in the public record. The legal stack raises the severity further. Illumina's May 2025 Delaware suit, Element's September 2025 antitrust and patent actions in California, Delaware, and Germany, and 10x Genomics' 2026 Aviti24 suit create a live injunction, royalty, settlement, and management-bandwidth overhang. The risk is no longer whether Element can attract attention; it is whether it can expand into clinical and spatial markets without legal friction or regulatory timing shocks.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
