  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: regulatory-approval-readiness
      missingEvidence: A current filing or submission log for AVITI or any clinical workflow, including intended use, jurisdictions, and milestone dates.
      whyItMatters: Public sources show RUO status and approval-seeking language, but not a concrete regulatory timetable or clearance package.
      diligencePath: Request regulatory tracker, submission drafts, agency correspondence, and partner-specific intended-use matrices.
      relatedQuestionRefs: [QR003, QR023, QR029]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: litigation-downside
      missingEvidence: Outside-counsel assessment of Illumina and 10x exposure, including injunction risk, expected legal spend, and workaround options.
      whyItMatters: Multi-front IP litigation can impair AVITI and AVITI24 commercialization even if demand remains intact.
      diligencePath: Pull pleadings, reserve analysis, claim-construction calendar, and counsel memos for both litigation tracks.
      relatedQuestionRefs: [QR004, QR005, QR026, QR027]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: concentration-visibility
      missingEvidence: Customer concentration, partner revenue share, renewal, and churn metrics by product family and geography.
      whyItMatters: Public growth metrics look broad, but they do not show whether a small set of customers or partners drives the economics.
      diligencePath: Request cohort tables, top-customer mix, partner-influenced bookings, and renewal history.
      relatedQuestionRefs: [QR016, QR022]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: quality-and-service-metrics
      missingEvidence: Install-cycle times, uptime, complaint rates, CAPA data, field-service staffing ratios, and audited QMS evidence.
      whyItMatters: The installed base and modality mix are scaling quickly, but the public record does not show whether operating control is scaling with them.
      diligencePath: Request service dashboards, complaint logs, CAPA summaries, and recent internal or external audit findings.
      relatedQuestionRefs: [QR010, QR011, QR025, QR030]
    - type: missing-source
      severity: material
      topic: runway-and-burn
      missingEvidence: Current burn, runway, cash efficiency, and any financing activity after the 2024 Series D.
      whyItMatters: Product breadth, litigation, and global support expansion are capital-intensive, and the latest public funding disclosure is stale.
      diligencePath: Request monthly cash bridge, budget versus actuals, and board materials on financing contingencies.
      relatedQuestionRefs: [QR018, QR031]
    - type: missing-source
      severity: minor
      topic: vendor-substitutability
      missingEvidence: Dual-source policy, inventory buffers, SLA terms, and fallback options for workflow-critical partners.
      whyItMatters: IDT, Revvity, and other ecosystem partners improve adoption, but public evidence does not show how replaceable they are if relationships change.
      diligencePath: Request vendor map, backup suppliers, contract terms, and internal make-versus-buy planning.
      relatedQuestionRefs: [QR012, QR013, QR015]
