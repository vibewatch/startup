  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - RUO-to-IVD transition stalls
        - Filing or approval visibility
        - No disclosed submission, clearance milestone, or live clinical deployment evidence after continued partner announcements
        - Downgrade to research-only thesis and require direct regulatory diligence before underwriting clinical upside
      - - Illumina litigation worsens
        - Court milestones
        - Injunction request gains traction, adverse claim-construction posture appears, or settlement terms imply meaningful royalty burden
        - Shift toward avoid / research-more pending legal downside quantification
      - - 10x / Harvard suit constrains Aviti24
        - Spatial product roadmap
        - Launch timing changes, workaround messaging appears, or Aviti24 positioning narrows after the complaint
        - Mark down multiomics upside and re-cut valuation on a narrower product set
      - - Support and quality strain emerges
        - Operating proof
        - Uptime, install cycle, complaint rate, or hiring backfill metrics fail to improve while the installed base keeps growing
        - Treat growth as lower quality and require service / QMS diligence before adding conviction
      - - Model execution weakens
        - Revenue, consumables, and launch cadence
        - 2025 revenue or product-launch targets are missed materially or pull-through no longer outgrows instrument placements
        - Reframe the story from scale-up to reset and underwrite only with wider downside protection
      - - Financing visibility deteriorates
        - Capital disclosure
        - No updated runway or financing evidence emerges while litigation and launch breadth remain high-cost
        - Require current burn, runway, and contingency capital plan before underwriting aggressive expansion
    notes: Trigger thresholds are monitorable public events or diligence deliverables rather than model-only assumptions.
