  topStrengths:
    - >-
      Differentiated avidity-sequencing platform with a broadened product surface spanning AVITI, AVITI24, and Trinity
      workflows.
    - >-
      Public operating signals improved in 2025 with about $85M of revenue, >450 systems placed, and doubled
      consumables-kit shipments.
    - >-
      Blue-chip capital support and a July 2024 Series D provide balance-sheet depth to keep funding commercialization
      and roadmap expansion.
    - >-
      Customer proof spans genome centers, academic cores, biotech and pharma research teams, and emerging clinical
      workflow partners.
  topRisks:
    - >-
      Public valuation support is thin: the last disclosed ~$1.03B mark implies a premium multiple well above public
      sequencing-tool peers.
    - >-
      Active litigation with Illumina and a separate 10x/Harvard suit could create injunction, legal-cost, and
      customer-procurement risk.
    - >-
      Gross margin, cap-table preference stack, current burn, and present headcount remain opaque in reviewed public
      evidence.
    - >-
      Commercial traction is real but still early relative to Illumina's installed-base dominance and Element's
      private-company disclosure limits.
  unresolvedGaps:
    - >-
      Need audited 2026 revenue, gross margin, and cohort consumables pull-through rather than JPM-reported management
      figures alone.
    - >-
      Need the full cap table and liquidation waterfall to judge whether >$680M of prior capital meaningfully compresses
      common-equity upside.
    - >-
      Need counsel-backed assessment of Illumina and 10x/Harvard litigation paths, remedies, and potential
      commercialization impact.
    - >-
      Need fresher headcount and customer-concentration disclosure to evaluate sales efficiency and account-level
      dependence.
