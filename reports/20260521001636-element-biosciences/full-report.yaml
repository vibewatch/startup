      - number: '7.4'
        title: Financial, people, and thesis-break risk
        blocks:
          - type: paragraph
            body: >-
              Financially, Element has more room than an average hardware startup, but the public underwriting burden
              has risen with that room. The company disclosed a $277 million Series D in July 2024 and more than $680
              million raised cumulatively, then publicly described roughly $60 million of 2024 revenue, faster
              consumables growth than instrument growth, and a 2025 target of $100 million with ten product launches.
              Those are meaningful scale signals, yet they also increase the consequence of a miss. The open public
              problem is that investors still do not have current burn, runway, concentration, or audited
              operating-efficiency data after the 2024 financing. Meanwhile, management is balancing product expansion,
              global support build-out, and active litigation. The right way to frame the risk is therefore monitorable
              rather than binary. If regulatory milestones fail to appear, if litigation creates product constraints, if
              support and quality hiring remain elevated without evidence of operational closure, or if consumables and
              revenue goals slip against the current roadmap, the investment case should be marked down quickly. If
              those indicators move the other way, the same public record would look much safer.
