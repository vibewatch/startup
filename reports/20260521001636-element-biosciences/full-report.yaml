        - '>450 placed systems do not show durable consumables pull-through by cohort'
        - Turns a growth story into a hardware-placement story with weaker lifetime value.
        - Re-cut valuation on a lower multiple and demand cohort data.
      - - Litigation posture
        - Adverse injunction risk, material damages exposure, or escalating discovery burden
        - Adds direct commercial and cash-flow pressure to the model.
        - Pause investment and obtain updated legal memo before re-engaging.
      - - Regulatory roadmap
        - IVDR / ISO 13485 / FDA progress slips materially beyond management signals
        - Weakens the premium case for clinical and regulated-market expansion.
        - Move the case from base toward bear and remove clinical premium assumptions.
      - - Cap table / preference stack
        - Senior liquidation terms absorb most value near public-evidence ranges
        - Means enterprise-value upside does not translate into common-equity upside.
        - Do not proceed without re-underwriting the distribution waterfall.
    notes: Each trigger is monitorable and tied directly to valuation transmission rather than generic operating risk.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV044
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - 2026 revenue bridge
        - Quarterly 2026 revenue and growth bridge from the reported ~$85M 2025 base
        - Determines whether the last round is holding, compounding, or already impaired.
        - Request CFO pack, board materials, and monthly management reporting.
      - - Gross margin and service economics
        - Consumables gross margin, service burden, warranty reserve, and instrument contribution margin
        - Separates durable platform economics from volume-only growth.
        - Management diligence session plus auditor-backed quality-of-earnings work.
      - - Installed-base utilization
        - Cohort-level reorder rates, utilization, and consumables attachment for the >450-system base
        - Validates whether placements are compounding into recurring value.
        - Commercial analytics export by install cohort and customer segment.
      - - Customer concentration
        - Top-10 customer revenue share, pharma mix, and renewal / churn data
        - Concentration can destabilize multiples quickly in a still-subscale tools business.
        - Sales-ops and finance diligence backed by contract sampling.
      - - Cap table and liquidation waterfall
        - Preferred stack, seniority, conversion terms, and any participating preference features
        - Determines real investor return outcomes across all scenario bands.
        - Legal and finance data room review with waterfall model.
      - - Litigation risk
        - Outside-counsel memo on injunction, damages, timing, and settlement probabilities
        - Legal overhang is directly valuation-relevant in this market.
        - Specialist IP / antitrust counsel review and management Q&A.
      - - Regulatory roadmap
        - Program plan, spend, and milestones for ISO 13485, IVDR, and FDA pathways
        - Needed before underwriting any clinical or regulated-market premium.
        - Quality / regulatory diligence with milestone tracker and external advisor review.
    notes: >-
      These are minimum diligence asks before treating the company as more than a monitoring candidate at current
      private-market pricing.
