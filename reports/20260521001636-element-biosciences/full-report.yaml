      - number: '1.4'
        title: Milestones, Partnerships, Regulatory Ambition, and Legal Overhang
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company widening from core sequencing into targeted sequencing, multiomics,
              and early regulated-market ambitions. After the 2022 headquarters opening and AVITI launch, Element opened
              AVITI24 preorders in 2024, launched Trinity targeted sequencing later that year, partnered with Revvity on
              a neonatal IVD workflow in early 2025, and expanded the partner network through SOPHiA Genetics and Gene
              Solutions. At the January 2026 JPM conference, management publicly tied the next phase to an
              IVDR-certified AVITI, ISO 13485 work, and FDA pursuit, while the 2026 roadmap previewed both VITARI and
              tissue-based spatial sequencing on AVITI24.


              The main adverse offset is litigation intensity. Illumina sued Element for patent infringement in May
              2025, after which Element countersued in September 2025 with U.S. antitrust claims plus U.S. and German
              patent actions of its own. In May 2026, 10x Genomics and Harvard added another front, alleging that
              AVITI24 and Teton infringe four Harvard-licensed patents and asking for injunctions and damages. For
              diligence purposes, that makes Element's company overview simultaneously a growth story and an IP-combat
              story: the same product expansion that underpins commercial momentum is also what keeps the company in
              live legal contests with entrenched competitors.
