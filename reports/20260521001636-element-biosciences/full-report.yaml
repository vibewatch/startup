            - High — cites accuracy, coverage, and homopolymer benefits
            - Low — only company-sourced quote found
            - Medium — multi-unit signal present, retention absent
        - label: University of Minnesota Genomics Center
          values:
            - Medium — benchmarking and validation site rather than pure fleet disclosure
            - High — 1,143-sample benchmark with explicit caveat on reverse-read trimming
            - High — independent benchmark plus biomodal validation mention
            - Low — no public repeat-purchase or contract data
