  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Commercial proof and product optionality flow into the recommendation only after being netted against public-comp
      mismatch, litigation, and missing private diligence packets.
    approximationNotes: >-
      The flow is qualitative rather than probabilistic; it maps the decision chain implied by retained public evidence
      as of the run date.
    data:
      nodes:
        - id: proof
          label: 'Proof: 2025 revenue ~$85M; >450 systems; AVITI24 >35% of new bookings'
          type: input
        - id: roadmap
          label: 'Optionality: VITARI, tissue-capable AVITI24, regulatory pathways'
          type: input
        - id: premium
          label: 'Constraint: last disclosed round implies ~12x 2025 revenue'
          type: process
        - id: legal
          label: 'Constraint: ongoing Illumina litigation and IP uncertainty'
          type: process
        - id: gaps
          label: 'Gap: no public gross margin, preference stack, or customer concentration'
          type: process
        - id: rec
          label: 'Recommendation: research-more / track, stretched at or above last round'
          type: output
      edges:
        - from: proof
          to: premium
          label: supports but does not close premium gap
        - from: roadmap
          to: premium
          label: adds upside optionality
        - from: premium
          to: rec
          label: price discipline required
        - from: legal
          to: rec
          label: risk discount
        - from: gaps
          to: rec
          label: blocks conviction
    claimRefs:
      - CV022
      - CV029
      - CV033
      - CV038
      - CV039
