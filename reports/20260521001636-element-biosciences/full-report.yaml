  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and commercialization proof
        blocks:
          - type: paragraph
            body: >-
              Element's valuation discussion has to start with the only hard private-market price visible in retained
              public sources: the

              July 2024 Series D. Company and distribution sources say the round brought in more than $277 million,
              lifted cumulative capital

              to more than $680 million, and was led by Wellington Management; a market-data recap pegs the post-money
              valuation at roughly

              $1.03 billion. That is enough to establish a unicorn anchor, but not enough to underwrite today's price
              without operating proof.


              The encouraging part of the record is that commercialization did move in 2025. GenomeWeb reported that
              Element generated about

              $85 million of revenue in 2025 versus about $60 million in 2024, ended the year with more than 450 systems
              placed worldwide,

              grew installed base by more than 60 percent year over year, and saw consumables-kit shipments more than
              double. AVITI24 also

              accounted for more than 35 percent of new instrument bookings with especially strong pharma uptake. The
              caution is equally clear:

              management reportedly missed the $100 million 2025 revenue target it had signaled a year earlier, so the
              company is scaling,

              but not flawlessly.


              The 2026 product roadmap adds upside optionality. Element is previewing VITARI with up to 10 billion reads
              per run, >90% Q30,

              and a $100-genome claim, while also extending AVITI24 toward FFPE and fresh-frozen tissue workflows and
              continuing ISO 13485,

              IVDR, and FDA workstreams. Those are credible growth levers, but they remain roadmap and
              management-evidence signals rather

              than audited proof that would justify paying a fresh premium above the last disclosed round.
