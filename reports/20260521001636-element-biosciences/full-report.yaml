      - number: '7.2'
        title: Platform scale, quality, and operations risk
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster is operational rather than conceptual. Element is no longer selling a single
              benchtop sequencer story; it is simultaneously supporting AVITI, pushing AVITI24 multiomics, and rolling
              out direct-in-sample sequencing with a stated innovation roadmap that extends into new high-throughput and
              spatial capabilities. That breadth is exciting, but it multiplies the number of assays, software layers,
              service interactions, and quality checkpoints that must work at once. Public disclosures show the
              installed base jumped from about 40 to more than 190 systems across more than 25 countries in a year, and
              the careers board still showed open roles across customer support, field applications, quality, supply
              chain, logistics, operations, chemistry, and engineering. That is not a red flag by itself; fast-growing
              instrument companies hire. It does, however, tell investors that service capacity and compliance maturity
              are still being built while installed systems, modalities, and geographies are increasing. The key
              residual risk is that support, logistics, and quality systems have to scale in parallel with product
              ambition. Public sources provide customer testimonials and some named repeat purchases, but they do not
              provide audited service metrics, install failure rates, or detailed quality-system evidence. That leaves a
              meaningful diligence gap around whether operating complexity is growing faster than operational control.
