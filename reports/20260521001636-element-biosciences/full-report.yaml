  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Element’s public revenue model is clearest at the product and pricing layer. The company sells
              AVITI-family benchtop sequencing instruments, monetizes upgrades from AVITI into AVITI24, and then pulls
              recurring consumables revenue as placed systems run more assays. AVITI24 is the only list-priced product
              directly disclosed on the company’s own site: $424,000 for a new system and $150,000 to upgrade an
              existing AVITI. A third-party equipment listing pegs original AVITI MSRP at $289,000, which provides a
              rough floor for the legacy hardware price point but should be treated as lower-confidence than
              company-authored pricing. Element also marketed AVITI at as low as $200 per genome in 2024 and later
              positioned VITARI at $100-genome economics for 2026, which shows willingness to use aggressive economics
              claims to expand adoption.


              The recurring leg is increasingly important. Management’s 2026 deck says consumable kit shipments more
              than doubled in 2025 alongside installed-base growth to more than 450 systems, which is the strongest
              public evidence that the business is moving beyond one-time hardware placement into a higher-quality
              reagent pull-through model. Cloudbreak Freestyle compatibility with more than 95 percent of library-prep
              kits also matters financially because it lowers switching friction and should expand the addressable
              reagents opportunity. What remains missing is realized ASP and support-contract detail: public materials
              show list prices and discount anecdotes, but not what Element actually captures after negotiation,
              warranty, or field-support obligations.
