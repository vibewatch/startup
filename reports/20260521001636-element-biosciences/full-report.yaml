      - number: '2.4'
        title: Growth drivers, adoption constraints, and preserved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The growth case for Element's market is clear. Public analyst summaries point to precision medicine,
              declining sequencing cost, higher-throughput benchtop launches, multiomics integration, and broader
              clinical adoption as durable demand drivers. Element's own roadmap sharpens that narrative by tying future
              growth to a higher-throughput platform, $100-genome messaging, and direct spatial sequencing on AVITI24.
              At the same time, the most important constraints are not theoretical. Illumina's installed base and
              workflow lock-in remain formidable, data-analysis complexity and standardization issues still deter
              smaller labs, and the jump from research-use success to regulated clinical deployment requires more than
              strong read quality. Medicover's integration shows that AVITI can participate in clinical-lab workflows,
              but GenomeWeb also makes clear that IVDR and FDA pathways are still being pursued rather than completed.
              Competitive conditions also remain uneven across sequencing modalities: PacBio's 2026 results show rising
              consumables demand alongside weaker than expected instrument revenue, illustrating how utilization can
              grow even when new-platform purchases stay constrained. The chapter therefore supports a positive demand
              outlook but preserves unresolved diligence asks around exact SAM, workflow economics by buyer class, and
              regulatory timing.
