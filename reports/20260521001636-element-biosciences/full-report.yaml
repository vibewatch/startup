  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Shows how Element typically wins an account: researchers first surface dissatisfaction with incumbent cost or
      quality, then validate AVITI technically, then rely on workflow partners and field support to reach multi-system
      or multiomic expansion.
    data:
      items:
        - label: Incumbent pain / discovery
          note: >-
            Prospect is usually an existing NGS user seeking lower run economics, higher quality, transparent pricing,
            or more flexible batching than legacy benchtop systems provide.
        - label: Side-by-side validation
          note: >-
            Customer compares AVITI against an incumbent platform on FFPE, 16S, target-enrichment, or low-depth assays;
            independent and customer-hosted comparisons at Gencove, UC Davis, UMN, and the AVITI utility paper fit this
            stage.
        - label: Workflow enablement
          note: >-
            QIAGEN, IDT, Agilent, Revvity, and biomodal reduce friction in panels, reagents, analysis, or multiomics so
            the customer does not need to rebuild the full stack alone.
        - label: Operational deployment
          note: >-
            Instrument install, training, and first data generation become the conversion moment; Broad, NEB, FYR
            Diagnostics, and University of Utah all highlighted implementation support quality.
        - label: Expansion / AVITI24 upsell
          note: >-
            Customer adds capacity, buys multiple units, or expands into AVITI24 multiomics; repeat orders, multi-unit
            sales, and strong pharma uptake on AVITI24 are the clearest public signals for this phase.
    claimRefs:
      - CU002
      - CU010
      - CU016
      - CU020
      - CU031
      - CU036
      - CU038
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Traces the conversion logic from early orders to repeat capacity: placement growth is visible, but the biggest
      bottlenecks remain assay revalidation, regulated-workflow readiness, and procurement uncertainty.
    data:
      nodes:
        - id: orders
          label: Initial commercial demand
          detail: >-
            Element publicly moved from >100 orders to >160 orders / 112 installed instruments before reaching >450
            systems placed worldwide by end-2025.
        - id: validation
          label: Technical validation
          detail: >-
            Prospects validate data quality, cost, compatibility, and assay-specific fit through benchmarks,
            core-facility pilots, or partner workflows.
        - id: integration
          label: Workflow integration
          detail: >-
            QIAGEN, IDT, Revvity, Agilent, biomodal, and Medicover address panels, analysis, service delivery, or
            multiomics so the platform fits real lab operations.
        - id: deployment
          label: Live installed base
          detail: >-
            Placed systems, doubled consumables shipments, and named accounts such as Broad, Burning Rock Dx, and
            Medicover indicate active use rather than warehousing.
        - id: expansion
          label: Repeat expansion
          detail: >-
            The visible expansion proofs are multi-unit orders, repeat capacity additions, and early AVITI24 uptake that
            appears strongest in pharma accounts.
      edges:
        - from: orders
          to: validation
          label: labs screen alternatives
        - from: validation
          to: integration
          label: workflows adapted
        - from: integration
          to: deployment
          label: install + first data
        - from: deployment
          to: expansion
          label: multi-unit / AVITI24 upsell
    claimRefs:
      - CU004
      - CU008
      - CU010
      - CU012
      - CU020
      - CU036
      - CU039
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Scores named proof on four dimensions: deployment maturity, quantified outcome detail, independent corroboration,
      and expansion visibility; research-core deployments score best, while broader durability visibility remains weak.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Independent corroboration
        - Expansion visibility
      rows:
        - label: Broad Institute
          values:
            - High — three installed systems
            - Medium — install-speed testimonial, not usage-volume metrics
            - Medium — two official pages, no external case study
            - Medium — multi-system evidence but no later renewal data
        - label: Revvity Omics
          values:
            - High — adopted for global service business
            - Medium — cites flexibility/speed/affordability, no sample counts
            - High — corroborated by Revvity and Element order release
            - Medium — route-to-market leverage visible, economics hidden
        - label: Medicover Genetics
          values:
