  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The useful market boundary for Element Biosciences is narrower than “all sequencing” and broader than one
              benchtop instrument SKU. Element's current monetization is tied to research-use short-read sequencing
              systems, recurring consumables, and the workflow modules that make those systems usable in real labs. Its
              own product and chemistry pages position AVITI as a benchtop platform focused on flexibility,
              affordability, and data quality, while the 2026 roadmap extends that proposition into higher-throughput
              sequencing and direct spatial / multiomic workflows. That means the closest substitutes are not every
              genomics tool, but incumbent short-read platforms, especially Illumina SBS systems, plus the library-prep,
              analysis, and core-lab workflows already wrapped around them. Long-read systems, routine reimbursed
              diagnostic testing, and unrelated wet-lab instrumentation matter as adjacency or context, but they are not
              the clean near-term serviceable market for Element today. The practical consequence is that Element
              competes first for replacement and expansion budgets inside existing genomics labs, then for a larger
              share of workflow spending as partners validate AVITI-based sample-to-result stacks.
            claimRefs:
