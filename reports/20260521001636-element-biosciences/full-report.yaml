            body: >-
              Element's growth has clearly been helped by ecosystem leverage, but that leverage is also a dependency
              surface. IDT supplies AVITI-specific adapters, blockers, and primers and explicitly says the relationship
              should help Element scale native library prep. Revvity extends Element toward neonatal IVD workflows and
              eventual regulatory approvals, while biomodal compatibility and the GenomeWeb-reported Alamar and Human
              Cell Atlas relationships broaden the multiomics and go-to-market narrative. This is strategically useful
              because it lowers adoption friction and increases workflow relevance. It also means important pieces of
              the commercialization story are partner-mediated rather than controlled end to end by Element. The
              customer signals are encouraging — more than half of customers outside the U.S., a higher
              clinical-research mix, a growing multiunit cohort, and early AVITI24 uptake — but public disclosures still
              stop short of giving concentration, renewal, or partner-revenue dependence metrics. That makes dependency
              risk less about whether partnerships exist and more about how substitutable they are, how much volume they
              influence, and how much switching pain customers would face if a key partner, assay, or integration
