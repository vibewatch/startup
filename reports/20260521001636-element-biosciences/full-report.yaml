  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and clinical transition risk
        blocks:
          - type: paragraph
            body: >-
              Element's public posture is still fundamentally research-first. Company materials position the platform
              around research markets, and IDT's AVITI workflow products are explicitly labeled for research use only
              and not for diagnostic procedures. FDA/HHS guidance matters here because RUO labels do not eliminate
              intended-use scrutiny; they frame a compliance boundary that gets harder to manage as the company pushes
              further into clinical workflows. Revvity's January 2025 announcement is therefore strategically important
              but also risk-signaling: it offers an immediate RUO newborn-sequencing workflow while saying the parties
              are co-developing an IVD solution and that Element is seeking AVITI regulatory approval. That means the
              clinical upside is visible, but not yet cleared in the public record. The legal stack raises the severity
              further. Illumina's May 2025 Delaware suit, Element's September 2025 antitrust and patent actions in
              California, Delaware, and Germany, and 10x Genomics' 2026 Aviti24 suit create a live injunction, royalty,
              settlement, and management-bandwidth overhang. The risk is no longer whether Element can attract
              attention; it is whether it can expand into clinical and spatial markets without legal friction or
              regulatory timing shocks.
