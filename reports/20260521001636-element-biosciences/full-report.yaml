      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Element's buyer map is heterogeneous even though the underlying technical user often looks similar.
              Academic core labs and genome centers care about instrument flexibility, compatibility with existing
              Illumina-formatted libraries and files, read quality, and economics at medium scale; UCDavis's public
              write-up is a good example. Biopharma and translational groups are closer to application buyers than pure
              capacity buyers: they care about data quality on challenging samples, faster turnaround, and the ability
              to extend into multiomic and FFPE-heavy workflows. A third group consists of partner or service
              laboratories, where the relevant decision is not only sequencer performance but whether the instrument
              fits into an end-to-end operational stack with library prep, interpretation, LIMS, and assay validation.
              Revvity, IDT, QIAGEN, biomodal, and Medicover all point in that direction. The implication for valuation
              is that Element is not merely selling hardware; it is trying to become a workflow anchor inside research
              and clinical-adjacent labs. But budget ownership still varies sharply by segment, so procurement cycles,
              switching pain, and attach-rate economics need to be analyzed by buyer class rather than averaged across
              the whole market.
