chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences was founded in 2017 in San Diego by Molly He, Michael Previte, and Matthew Kellinger
              around a simple thesis: sequencing should be higher quality, more flexible, and materially less expensive
              for scientists than the incumbent market had made it. Public company materials still describe Element as a
              life-science tools company focused on disruptive DNA sequencing and multi-omics systems for research
              markets, while the product surface now spans instruments, reagents and kits, software, and lab services
              rather than a single sequencer sale.


              The initial platform was AVITI, a benchtop sequencer built around flexibility, affordability, and data
              quality, followed by the lower-throughput AVITI LT and then AVITI24, which extends the platform into
              integrated multiomics. Element's 2026 roadmap shows management pushing the same architecture into two
              adjacent directions: higher-throughput sequencing through VITARI and deeper tissue / spatial workflows
              through AVITI24. That cadence matters for later chapters because it frames Element less as a
              single-product disruptor and more as a platform vendor trying to build a durable tools franchise across
              sequencing, multiomics, and eventually regulated workflows.
