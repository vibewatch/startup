companyProfile:
  summary: >-
    Element Biosciences is a San Diego private life-science tools company building DNA sequencing and integrated
    multi-omics platforms around its avidity sequencing chemistry. Founded in 2017 by Molly He, Michael Previte, and
    Matthew Kellinger, the company has expanded from the original benchtop AVITI system into AVITI LT, AVITI24, Trinity
    targeted workflows, and a previewed higher-throughput VITARI roadmap. Public evidence shows meaningful commercial
    traction, but the company remains privately held and materially less transparent than public sequencing peers on
    margins, cap-table terms, and current headcount.
