    rows:
      - - Illumina
        - Direct incumbent short-read platform
        - Public company; $1.09B Q1 2026 revenue
        - Clinical and research labs running production-scale short-read workflows
        - NovaSeq X throughput, installed-base trust, broad application menu
        - High-throughput centralized model; not the only viable benchtop-flexibility story
      - - MGI Tech
        - Direct global short-read challenger
        - Private; exact revenue not public on reviewed pages
        - Genomics labs needing DNBSEQ options across assays and geographies
        - DNBSEQ portfolio plus SEQ ALL coverage across genomics, spatial, and single-cell use cases
        - Western commercial traction is less visible in reviewed public sources than Illumina or Element
      - - Ultima Genomics
        - Direct high-throughput short-read challenger
        - Private; exact revenue not public on reviewed pages
        - Population-scale genomics, service providers, and cost-sensitive high-volume users
        - Wafer-based economics with UG100 / UG200 scale and low public cost-per-read claims
        - Positioning skews toward very high throughput rather than smaller intermittent users
      - - PacBio
        - Long-read substitute
        - Public company; $37.2M Q1 2026 revenue
        - Complex genomes, structural variation, methylation, and clinical-research settings
        - HiFi long reads, native methylation, high-completeness genome lens
        - Different cost / throughput profile from short-read benchtop platforms
      - - Oxford Nanopore
        - Long-read substitute
        - Public company; annual results published to investors
        - Labs needing real-time, long-read, or portable-to-high-output flexibility
        - Device range from MinION to PromethION with real-time sequencing
        - Less direct fit for standardized short-read SBS replacement
      - - GENEWIZ / Azenta
        - Outsourced service substitute
        - Commercial service provider; pricing typically by quote
        - Buyers avoiding instrument capex or infrequent users
        - Sample-to-analysis service on Illumina, PacBio, and ONT platforms
        - Creates service dependency rather than in-house platform ownership
      - - Novogene
        - Outsourced / global service substitute
        - Claims capacity for up to 200,000 human genomes per year
        - High-volume research users and teams that want platform optionality
        - Broad platform menu across Illumina, Ultima, PacBio, and ONT plus US-local processing for some workflows
        - Service relationship can defer or replace instrument purchases entirely
