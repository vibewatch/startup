            body: |-
              Element's public adoption trajectory shows genuine commercial conversion, even if the company does
              not disclose active-customer counts by cohort. In the early commercial phase, Element announced
              more than 100 AVITI orders, customers in 13 countries, triple-digit quarter-on-quarter growth, and
              an estimated 15% share of mid-throughput instrument sales in the quarter of the announcement. By
              the following JPM update, the company said it had surpassed 160 commercial orders and expanded the
              installed base to 112 instruments. GenomeWeb's JPM 2026 coverage pushed that trajectory further:
              more than 450 systems placed worldwide by year-end 2025, installed-base growth above 60% year over
              year, and consumables shipments more than doubling. That pattern matters because it indicates live
              usage expansion, not just boxes shipped into inventory.

              The commercial mix also points to expansion rather than one-time trial demand. Element said more
              than 40% of sales were multi-unit orders and that repeat customers were adding capacity to existing
              fleets, while 80% of the referenced customer cohort consisted of experienced users upgrading onto
              AVITI. GenomeWeb separately reported that AVITI24 was already seeing particularly strong uptake among
              pharma customers one year after launch. Together these signals
              support a view that Element is winning both first-time placements and second-step expansion into
              more advanced workflows. What remains missing is denominator visibility: the company does not
              publicly disclose how many of the 450+ placed systems are active at production cadence, how many
              belong to repeat accounts, or how much of consumables growth comes from a small group of heavy-use
              sites.
