      - number: '4.3'
        title: Capital base and adequacy
        blocks:
          - type: paragraph
            body: >-
              Element’s capital base is substantial for a private sequencing-tools company but still difficult to
              underwrite for adequacy. In July 2024 the company raised more than $277 million in a Wellington-led Series
              D, bringing cumulative funding to more than $680 million. Management said the proceeds would fund
              continued AVITI commercialization and the AVITI24 launch. That history supports the conclusion that
              Element has had access to enough outside capital to manufacture instruments, fund field support, and
              absorb the commercial ramp needed to challenge Illumina in benchtop sequencing.


              What the public record does not provide is the forward cash equation. None of the retrieved sources
              disclose cash on hand after the Series D, gross or net burn, debt facilities, or a board-level runway
              target. That omission is especially important because the company is simultaneously investing in
              manufacturing quality systems for clinical applications, launching new workflows such as AVITI24, and
              preparing VITARI for second-half 2026 availability. All of those moves are capital hungry before they
              become margin accretive. Public evidence therefore supports only a directional conclusion: Element is
              well-funded by private-market standards, but whether that funding is comfortably sufficient through the
              next product cycle cannot be determined without private cash and margin data.
