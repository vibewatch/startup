      - number: '6.4'
        title: Retention, Durability, and Expansion Signals
        blocks:
          - type: paragraph
            body: |-
              Element's public record contains meaningful expansion signals but very little classic retention
              disclosure. The best positive indicators are structural: multi-unit orders accounted for more than
              40% of sales in the 100-order cohort, repeat customers were adding capacity, Broad publicly ran a
              three-system install, and Burning Rock Dx disclosed multiple AVITI purchases after validation.
              Those data points suggest Element is not merely winning isolated proofs of concept. In addition,
              the mix shift toward AVITI24 bookings shows that some customers are extending their relationship
              from conventional sequencing into higher-value multiomic workflows rather than treating AVITI as a
              standalone benchtop replacement.

              That said, none of the reviewed sources disclosed NRR, GRR, churn, renewal rates, contract length,
              or customer-count-by-cohort. Public satisfaction evidence is also shallow relative to the installed
              base: Element's owned testimonials page is dense with positive quotes, FeaturedCustomers lists only
              9 public reviews/references, and general user-forum activity remains sparse. This means the chapter
              can support the claim that early users are willing to validate, install, and sometimes expand, but
              it cannot support a claim that Element has already proven durable recurring economics across a broad
              cohort. For diligence, the missing bridge is not quality-of-product evidence; it is retention,
              renewal, and wallet-share disclosure.
