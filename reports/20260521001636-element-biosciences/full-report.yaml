      - number: '6.3'
        title: Named Customer Proof and Independent Workflow Validation
        blocks:
          - type: paragraph
            body: |-
              Public customer proof is strongest where Element can point to named institutions, observable
              workflow outcomes, or independent methods sections. Broad Institute's disclosure of three AVITI
              systems is one of the cleanest multi-unit deployments in the public record, and the quote focuses
              on operational implementation rather than abstract performance claims. Gencove, Google Health
              Genomics, Agilent, New England Biolabs, 10x Genomics, FYR Diagnostics, University of Utah, and
              Helixio all provide distinct angles on quality, compatibility, or support. Those are not all equal
              in evidentiary weight — some are curated testimonials hosted by Element — but they still matter
              because they show the platform being used for FFPE-heavy research, target enrichment, single-cell
              readiness, and bioinformatics-pipeline integration rather than just marketing demos.

              The strongest independent corroboration comes from external organizations and methods sections.
              Revvity stated it adopted AVITI for its global service business; Medicover Genetics said it
              integrated AVITI into VERACITY NIPT and TarCET workflows for partner laboratories; University of
              Minnesota Genomics Center benchmarked AVITI against NextSeq 2000 across 1,143 microbiome samples;
              and 2026 PMC papers explicitly place AVITI24 sequencing at MIT BioMicro Center and University of
              Michigan Advanced Genomics Core, with another 2025 Nature Immunology methods section running bulk
              libraries on AVITI and single-cell libraries on AVITI24. The key diligence distinction is between
              named proof and durable economics: the public record clearly shows real usage and workflow fit, but
              it still gives very little visibility into contract size, renewal cadence, or the share of revenue
              represented by each named account.
