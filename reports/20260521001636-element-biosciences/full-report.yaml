  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct short-read platform competition
        blocks:
          - type: paragraph
            body: >-
              Element's direct head-to-head competition is still the short-read sequencing stack, where Illumina remains
              the scale incumbent and MGI plus Ultima push the cost curve downward from different angles. Illumina's
              NovaSeq X family anchors buyer expectations on throughput and clinical-research familiarity: the company
              reported $1.09 billion of Q1 2026 revenue and said demand for NovaSeq X was increasing, while its systems
              comparison pages frame NovaSeq X as the production-scale default for large whole-genome, exome,
              single-cell, and liquid-biopsy work. That incumbency matters because many buyers already know the
              workflow, trust the service ecosystem, and can keep buying sequencing output without changing procurement
              behavior.


              MGI and Ultima attack the same market with different narratives. MGI positions DNBSEQ and SEQ ALL as a
              broad sequencing-plus-multiomics portfolio, and its DNBSEQ-G99 highlights 12-hour PE150 runs for targeted
              panels, exomes, transcriptomics, and microbial workflows. Ultima's pitch is more explicitly economic and
              scale-driven: the UG100 page advertises 10–12 billion reads per wafer, $0.24 per million reads, $0.80 per
              gigabase, and more than 30,000 genomes per year, while the newer UG200 series claims 30,000 to 60,000+ 30x
              genomes per year depending on configuration. Element's response is to keep the benchtop footprint and
              workflow flexibility front and center. AVITI is positioned as a flexible, affordable benchtop instrument;
              Trinity compresses targeted-sequencing workflows to as little as one day; and the VITARI launch extends
              the roadmap into high-throughput benchtop territory with a $689,000 list price and a company-claimed $100
              genome. The competitive implication is that Element has a real product wedge, but it is fighting
              better-capitalized incumbents and price-led challengers at the same time.
