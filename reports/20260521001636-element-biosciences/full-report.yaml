  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Element now sells a layered sequencing platform, not a single instrument SKU
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Element Biosciences has moved beyond the original AVITI launch into a tiered product
              family with shared chemistry and workflow attachments. The 2026 homepage and product matrix place VITARI,
              AVITI24, AVITI, and AVITI LT into one portfolio, while Cloudbreak and Trinity span multiple systems as
              workflow-enabling kits rather than side accessories. In customer workflow terms, AVITI remains the core
              short-read benchtop system, AVITI LT is the smaller-footprint lower-throughput option, AVITI24 adds
              direct-in-sample and multiomic readouts, and VITARI extends the same company into high-throughput
              sequencing. Cloudbreak matters because it addresses library compatibility and output choice, while Trinity
              matters because it compresses targeted capture into a more instrument-centric workflow. The practical
              takeaway is that Element's product definition is instrument plus chemistry plus software plus downstream
              analysis. That breadth is strategically attractive because it supports land-and-expand inside the same
              account, but it also means diligence should separate the mature AVITI base from the newer VITARI and
              AVITI24 expansion layers.
