            body: >-
              The recommendation should be research-more / price-sensitive track, not buy. Element has enough proof to
              stay on the board:

              the company has raised substantial capital, grown placements, launched AVITI24 into meaningful booking
              mix, and is pushing a

              technically ambitious 2026 roadmap. But public evidence does not support paying above the July 2024
              unicorn mark as if that

              financing had already been de-risked by audited 2025-2026 economics.


              The biggest reason is that legal and disclosure risk sit directly in the valuation path. Element's own
              September 2025 filing says

              it sued Illumina for antitrust and patent claims, while independent coverage and court records show
              parallel litigation activity

              and continuing 2026 docket motion practice. Even if Element's allegations are directionally correct, the
              practical effect for an

              investor is the same: injunction risk, legal spend, customer hesitation, and management distraction can
              all compress multiples.

              Public sources also do not disclose the preference stack, liquidation waterfall, current gross margin,
              customer concentration, or

              service economics that determine who actually benefits from exit value.


              That is why the valuation stance is stretched at or above the last disclosed round, with a high risk
              rating and medium conviction.

              The constructive thesis breaks quickly if 2026 revenue fails to rise materially above the roughly $85
              million 2025 base, if the

              litigation produces an adverse injunction or material damages exposure, or if the cap table reveals enough
              senior preference to

              absorb most upside near the public-evidence valuation band.
