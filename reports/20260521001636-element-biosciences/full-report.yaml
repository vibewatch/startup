  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and End-Market Mix
        blocks:
          - type: paragraph
            body: |-
              Element's customer base is best understood as a set of research-led adoption surfaces rather than
              a homogeneous installed base. The original AVITI platform addresses mid-throughput genome centers,
              core labs, academic translational groups, biotechnology and pharma R&D teams, and service labs that
              want better data quality or more flexible batch sizes than legacy benchtop systems. AVITI24 expands
              that aperture into spatial and single-cell multiomics teams by combining RNA, protein, and
              morphology readouts in a single run with no library prep. Publicly named users map to those
              segments: Broad Institute, Weill Cornell Medicine, Gencove, New England Biolabs, University of
              Utah, and University of Minnesota Genomics Center all represent research-core or translational-lab
              demand; Medicover Genetics and Revvity show route-to-market leverage into clinical or service-lab
              workflows; and QIAGEN, IDT, Agilent, 10x Genomics, and biomodal show that partner enablement is a
              meaningful part of customer acquisition, not just a peripheral ecosystem story.

              Geography is widening but still research-led. Element said its >100-order milestone already covered
              customers in 13 countries through a mix of direct sales and distributors, while GenomeWeb reported
              more than 450 systems placed worldwide by the end of 2025. The implication is that customer proof
              is not concentrated in one home-market cluster, but public evidence remains far denser for
              lighthouse academic and workflow accounts than for large disclosed pharma or diagnostics fleets.
              That matters because the payer, user, and buyer often diverge: principal investigators and core-lab
              managers use the platform, procurement or operations funds it, and workflow partners can shape the
              final platform decision by removing library-prep, analysis, or regulatory friction.
            claimRefs:
