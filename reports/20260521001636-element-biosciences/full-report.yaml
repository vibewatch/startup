            title: Element has real 2025 traction, but it was not a perfect year
            body: >-
              The company did not stand still after the 2024 round. Revenue reportedly rose from about $60 million in
              2024 to about $85

              million in 2025, installed base exceeded 450 systems, and AVITI24 reached more than 35 percent of new
              instrument bookings.

              At the same time, management also reportedly fell short of the $100 million 2025 revenue goal discussed a
              year earlier. That

              combination argues for a live company with upside, not a fully de-risked premium valuation.
            calloutType: insight
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV031
          - type: callout
            title: 'Conviction threshold: demand audited economics and the full waterfall'
            body: >-
              The minimum diligence package for a constructive investment case near the last disclosed round is: current
              revenue and gross

              margin, cohort-level installed-base utilization and consumables pull-through, top-customer concentration,
              a litigation-risk memo,

              and the full preference waterfall. Without those documents, the company may be good but the price is still
              under-evidenced.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV052
