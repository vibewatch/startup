      - number: '2.2'
        title: Sizing lenses, contradictory estimates, and why SAM remains unresolved
        blocks:
          - type: paragraph
            body: >-
              Public market estimates confirm that Element is operating in a large category, but they do not justify a
              single underwritten TAM. MarketsandMarkets puts the global NGS market at $13.81 billion in 2026 and $27.14
              billion by 2031, while Grand View Research estimates $11.26 billion in 2025 growing to $42.25 billion by
              2033. Fortune Business Insights, meanwhile, frames the broader DNA sequencing market at $12.31 billion in
              2025 growing to $22.57 billion by 2032. Those numbers are directionally useful, but they are not
              interchangeable: some mix products and services, some cover NGS specifically, and some include broader
              sequencing techniques and clinical categories beyond Element's current reach. The most credible conclusion
              is therefore multi-lens, not single-number: North America is the largest regional market, recurring
              consumables are structurally attractive, and both clinical and academic demand pools matter. What remains
              missing is a public source that isolates an Element-specific SAM or SOM for research-use mid-throughput
              short-read platforms plus adjacent multiomics workflows. That unresolved boundary should be preserved
              rather than papered over with one generic headline estimate.
