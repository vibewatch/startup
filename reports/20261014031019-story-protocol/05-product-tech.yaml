callouts:
  - calloutType: insight
    title: Bridging Legal Contracts and Code via Programmable IP Licenses
    body: >-
      Story Protocol's primary technical breakthrough is not simple tokenization of digital media, but the codification
      of complex legal agreements into machine-readable parameters. By enforcing automated royalty cascades and
      licensing terms directly on-chain, the network allows autonomous AI agents to interact with intellectual property
      through programmatic handshakes rather than bilateral attorney negotiations.
    claimRefs:
      - CE004
      - CE009
  - calloutType: risk
    title: The Off-Chain Jurisdictional Enforcement Gap
    body: >-
      While on-chain rules deterministically govern token transfers and smart contract state, copyright protection
      fundamentally depends on off-chain sovereign courts. The protocol lacks an automated mechanism to prevent
      fraudulent initial registrations or enforce smart contract terms against non-crypto infringers in traditional
      legal venues, exposing rights holders to significant legal friction.
    claimRefs:
      - CE012
      - CE014
