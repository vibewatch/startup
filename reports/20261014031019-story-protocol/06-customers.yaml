chapter:
  number: 6
  title: "Customers"
  summary: "Story Protocol targets creators, entertainment franchises, and AI developers with its Layer-1 intellectual property blockchain, but verifiable commercial adoption remains concentrated in marketing pilots and speculative Web3 experiments. While partnerships with Solo Leveling, Barunson Studio, and Magma demonstrate consumer IP remixing, institutional media rights-holders have resisted on-chain licensing transparency, leaving enterprise recurring revenue unproven."
sections:
  - id: "customer-segmentation"
    title: "Customer & Ecosystem Segmentation: Creators, Entertainment Franchises, and AI Developers"
    body: "Story Protocol structures its customer and ecosystem development around four distinct participant segments: independent digital creators, consumer entertainment franchises, institutional IP asset platforms, and autonomous artificial intelligence developers. Individual creators and visual artists interact with the network primarily through integrated SaaS platforms such as Magma, which abstract away blockchain transaction fees and crypto wallet setup to facilitate frictionless IP asset registration. Consumer entertainment brands and production houses, including manhwa franchises and film studios, engage through customized remix platforms that tokenize narrative elements for derivative fan fiction and merchandise. Institutional platforms and financial intermediaries explore the protocol as an infrastructure rail for tokenized real-world assets, such as unlisted securities and music royalties. Finally, AI developers and agent creators represent the protocol's theoretical frontier, intended to utilize machine-readable licensing rails to programmatically source training data and settle usage fees without human intermediary friction."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Adoption Trajectory & Network Traction: Vanity Metrics vs. On-Chain Reality"
    body: "Story Protocol's public traction narrative combines top-of-funnel partner reach figures with tokenized asset valuations to signal substantial early momentum. High-profile announcements frequently cite platform-level aggregates, such as Magma's 3.6 million registered digital artists and Solo Leveling's 14 billion global views, yet these indicators reflect the historical audience of partner platforms rather than active transacting users on Story's Layer-1 network. In the real-world asset vertical, Aria Protocol announced tokenizing $100 million in Korean music catalog rights via Aria PRIME, pushing aggregate IP total value locked past $110 million. However, secondary trading liquidity, ongoing royalty collection yields, and recurring protocol fee capture remain opaque. The network's core commercial proposition relies on the Programmable IP License (PIL) to bridge on-chain logic with off-chain legal frameworks, but verifiable enterprise adoption metrics and software recurring revenues have not yet materialized."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named Deployment Proof: Entertainment Pilots, Catalog Tokenization, and Creator Integrations"
    body: "Commercial deployments on Story Protocol have largely taken the form of strategic marketing alliances, regional tokenization pilots, and ecosystem partner integrations. In the consumer media sector, Story announced a late-2025 collaboration with Solo Leveling to tokenize manhwa assets for community-created games and merchandise. Similarly, Korean production house Barunson Studio launched nPLUG, a collaborative platform intended to allow fans to legally remix entertainment IP while programmatically sharing revenue with primary copyright holders. In the regulated financial market, the protocol secured a three-year exclusive agreement with the Seoul Exchange to provide settlement infrastructure for tokenized cultural assets and unlisted securities. Meanwhile, digital creation platform Magma integrated the network to provide gas-free IP registration for illustrators. Although these deployments demonstrate technical interoperability across ERC-721 and ERC-6551 Token Bound Account standards, production deployments remain early-stage pilots with unverified commercial transaction volumes."
    claimRefs:
      - "CU003"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "retention-expansion-risks"
    title: "Retention, Revenue Capture & Rights-Holder Concentration Risks"
    body: "The sustainability of Story Protocol's commercial model faces significant headwinds concerning customer retention, enterprise willingness-to-pay, and participant concentration. While Web3-native creator communities have readily engaged with testnet campaigns and token incentives, mainstream creators and institutional IP owners encounter severe usability friction and legal ambiguity when navigating blockchain interfaces. Crucially, adoption from major corporate rights-holders—the constituency possessing the most valuable commercial IP—has failed to materialize. Tier-one music labels, gaming publishers, and Hollywood studios remain unwilling to expose proprietary licensing terms or risk brand dilution on public smart contract registries. Following steep declines in token market capitalization and muted commercial adoption among enterprise copyright owners, protocol leadership began pivoting its messaging toward AI training data provenance, underscoring the fragile retention and uncertain durability of the original consumer IP licensing model."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
