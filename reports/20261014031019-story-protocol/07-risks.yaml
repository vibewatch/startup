callouts:
  - calloutType: "risk"
    title: "Off-Chain Legal Vacuum for Programmable Licenses"
    body: "While Story Protocol smart contracts automate on-chain attribution and royalty distribution at machine speed, on-chain execution offers zero legal standing against unauthorized off-chain model training or commercial reproduction until recognized by formal judicial courts. Creators still rely on conventional legal enforcement mechanisms when bad actors infringe rights outside the protocol."
    claimRefs:
      - "CR001"
      - "CR003"
  - calloutType: "recommendation"
    title: "Require Independent Legal Audit and Institutional Adoption Metrics"
    body: "Investors should condition any investment thesis on verifiable enterprise licensing traction rather than speculative token-market narratives. Priority diligence must confirm binding legal opinions on PIL enforceability, evaluate treasury burn rate against non-token cash balances, and monitor whether institutional rights-holders sign production contracts."
    claimRefs:
      - "CR009"
      - "CR014"
      - "CR015"
