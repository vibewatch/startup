      - number: '7.4'
        title: Financial Model, Capital Intensity, and Risk Heatmap
        blocks:
          - type: paragraph
            body: >-
              From a financial and tokenomic perspective, Story Protocol has raised substantial venture funding totaling
              $140 million across multiple rounds led by Andreessen Horowitz, achieving a peak private valuation of
              $2.25 billion in August 2024. However, capital raised does not equate to operating revenue or sustained
              network cash flow. Public evidence indicates that verifiable enterprise licensing ARR and corporate
              revenue-share capture remain unproven, leaving PIP Labs heavily reliant on venture treasury balances to
              fund protocol development and ecosystem grants. Concurrently, secondary market data reveals that the
              native IP token experienced severe market capitalization drawdowns, reportedly falling approximately 98%
              from all-time highs following mainnet launch. This depreciation constrains validator staking economics,
              diminishes community developer grant value, and dampens network participant incentives. The accompanying
