              announced tokenizing $100 million in Korean music catalog rights via Aria PRIME, pushing aggregate IP
              total value locked past $110 million. However, secondary trading liquidity, ongoing royalty collection
              yields, and recurring protocol fee capture remain opaque. The network's core commercial proposition relies
              on the Programmable IP License (PIL) to bridge on-chain logic with off-chain legal frameworks, but
