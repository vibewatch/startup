  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Value Proposition and Programmable IP Asset Model
        blocks:
          - type: paragraph
            body: >-
              Story Protocol delivers a dedicated blockchain infrastructure designed to transform static intellectual
              property into liquid, programmable digital assets. Traditional intellectual property frameworks rely on
              manual copyright registration, bilateral legal agreements, and cumbersome royalty collection mechanisms
              that are ill-equipped for fast-moving internet remixes and generative artificial intelligence systems. By
              introducing on-chain IP Assets (IPAs) anchored to ERC-6551 compatible IP Accounts, Story Protocol creates
              a unified standard where creative works carry their own ownership rules, attribution records, and
              licensing parameters directly on-chain. When creators or enterprises register works into the protocol, the
              system mints an IP Asset representing the work, linking it to modular smart contracts that govern
              derivative creation, commercial licensing rights, and revenue distributions. This structural foundation
              shifts IP management from retrospective legal dispute enforcement to proactive, deterministic code
              execution.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
