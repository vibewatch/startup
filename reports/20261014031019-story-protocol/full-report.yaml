            title: Tokenomics Volatility and Secondary Market Drawdown
            body: >-
              While PIP Labs secured $140M in venture funding at a $2.25B equity valuation, the native $IP token
              experienced a ~98% drawdown from its September 2025 all-time high of $14.74, accompanied by a six-month
              delay in initial insider token unlocks and subsequent rebranding initiatives.
            calloutType: risk
