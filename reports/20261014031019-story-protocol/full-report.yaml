      - number: '7.2'
        title: Operational, Consensus, and Technical Failure Modes
        blocks:
          - type: paragraph
            body: >-
              At the protocol layer, Story Protocol implements a specialized Proof-of-Stake consensus mechanism built on
              CometBFT combined with a dual-execution environment that bridges Cosmos SDK state with an EVM-compatible
              virtual machine. This hybrid architecture introduces distinct operational and security attack surfaces.
              First, the validator set responsible for block production and transaction finality exhibits inherent
              centralization risks typical of early-stage Layer-1 networks, where foundation delegations and early
              venture backers control substantial voting power. Second, while modular smart contracts automate licensing
              terms, royalty distribution, and decentralized dispute resolution on-chain, complex cross-contract calls
              between ERC-6551 token-bound accounts and dispute modules increase exposure to reentrancy, state
              desynchronization, and smart contract execution bugs. Finally, the protocol's planned attestation oracle
              network for creator identity verification and automated plagiarism detection introduces external
              dependency risks: oracle latency, data inaccuracies, or false attribution flags can disrupt licensing
              enforcement across downstream decentralized applications.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
