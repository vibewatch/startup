      - number: '4.2'
        title: Pricing Dynamics, Unit Economics, and Creator Splits
        blocks:
          - type: paragraph
            body: >-
              The monetization framework of Story Protocol relies on the Programmable IP License, which encodes usage
              rights, commercial terms, and royalty parameters directly into smart-contract modules. Traditional
              intellectual property registration typically costs between $5,000 and $50,000 per asset across legal
              filings, whereas Story Protocol reduces registration costs to transaction gas fees under $1. Furthermore,
              while legacy intermediaries like record labels and publishers absorb 50% to 90% of commercial revenue,
              Story Protocol's automated settlement enables creators to retain 70% to 90% of derivative revenue flows.
              Within the ecosystem, emerging protocols demonstrate this mechanism: Aria Protocol reported acquiring 48
              cultural IP assets, raising over $10.95 million, and distributing 5% to 8% annualized yields to over 4,300
              investors. Additionally, decentralized trading platforms such as PiperX have facilitated spot liquidity
              for ecosystem assets with daily volume exceeding $336,000.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
