      - number: '8.2'
        title: 'Investment Thesis vs. Anti-Thesis: The Collapse of General On-Chain IP'
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis behind Story Protocol posited that generative artificial intelligence would
              catalyze massive demand for programmable, on-chain intellectual property registration, automated
              licensing, and trustless royalty splits. Story engineered an EVM-compatible Layer-1 on the Cosmos SDK
              utilizing ERC-721 IP Assets paired with ERC-6551 token-bound accounts and Programmable IP Licenses.
              However, the anti-thesis proved decisive: major commercial rights-holders in film, music, literature, and
              gaming fundamentally resisted exposing proprietary licensing terms to transparent on-chain mechanics.
              Without adoption from premium copyright owners, network transactions remained speculative, leading to a
              catastrophic collapse of the IP token from $14.78 to $0.275. Facing terminal traction deficits on its
              sovereign chain, the team pivoted in June 2026 to DATA Network, refocusing narrowly on AI training data
              provenance, before ultimately abandoning its independent blockchain infrastructure.
            claimRefs:
