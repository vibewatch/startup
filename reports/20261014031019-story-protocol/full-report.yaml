      - number: '5.3'
        title: Modular Layer-1 Blockchain Architecture and Execution Model
        blocks:
          - type: paragraph
            body: >-
              The technical architecture of Story Protocol is built as a purpose-built Layer-1 blockchain engineered to
              handle the computational complexity of intellectual property relationships. Unlike generic blockchains
              that treat intellectual property merely as static NFT metadata pointers, Story Protocol pairs a Cosmos SDK
              consensus engine (CometBFT) with an EVM-compatible execution layer optimized for complex directed acyclic
              graph (DAG) data structures. The base consensus layer provides deterministic Byzantine fault-tolerant
              finality and high throughput necessary for micro-transactions, while the EVM execution environment ensures
              interoperability with existing Ethereum tooling, smart contracts, and developer infrastructure. Above the
              execution environment, the Proof-of-Creativity framework operates a specialized graph indexing layer that
              tracks multi-generational parent-child derivative relationships. This ensures that when a downstream
              derivative work generates revenue, royalty splits cascade backward through all ancestor IP Assets
              trustlessly without requiring manual auditing or off-chain escrow.
            claimRefs:
