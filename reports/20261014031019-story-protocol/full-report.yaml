      - number: '4.3'
        title: Commercial Traction, Token Volatility, and Enterprise Resistance
        blocks:
          - type: paragraph
            body: >-
              Despite innovative architecture, public market evidence highlights severe financial headwinds and adoption
              bottlenecks. As of mid-2026, the native $IP token traded at approximately $0.3240 with $1.3 million in
              24-hour exchange trading volume. Following its February 2025 mainnet launch, the token experienced an
              acute secondary market collapse, declining by roughly 98% from its September 2025 peak of $14.74. This
              token depreciation reflected fundamental adoption resistance: major commercial rights-holders in
              entertainment, gaming, and enterprise brands refused to expose proprietary licensing terms or valuable
              intellectual property to public, permissionless blockchain rails. In response to commercial stagnation and
              secondary market erosion, the project initiated a strategic pivot away from standalone creator IP rights
              toward AI training data provenance, culminating in a rebranding to DATA Foundation to reposition its
              infrastructure toward machine-learning datasets.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Capital Adequacy, Operating Burn, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capital adequacy perspective, Story Protocol secured substantial runway, raising $140 million in
              total venture funding across seed, Series A, and an $80 million Series B round led by Andreessen Horowitz
              that valued the company at $2.25 billion in August 2024. However, operational burn signals indicate
              aggressive spending on narrative generation, such as hiring an autonomous social media AI agent with an
              annual salary of 365,000 USDC. Crucially for financial underwriting, Story Protocol discloses no verified
              enterprise Annual Recurring Revenue, contract commitments, or treasury cash breakdowns. Because protocol
              revenue depends on speculative network transaction volume rather than contracted B2B recurring cash flow,
              the business model lacks predictable operating margins. Underwriting a venture investment at historical
              valuations remains blocked pending verified disclosure of off-chain enterprise licensing agreements and
              cash treasury reserves.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Secondary Token Reliance and Strategic Pivot Risk
            body: >-
              With the $IP token declining roughly 98% from its peak and professional rights-holders hesitating to
              deploy core IP on public blockchains, the protocol's pivot to DATA Foundation signals commercial friction
