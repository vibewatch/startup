      - number: '8.3'
        title: Valuation Scenarios and Capital Structure Impairment
        blocks:
          - type: paragraph
            body: >-
              Evaluating the surviving enterprise through probability-weighted scenarios demonstrates severe downside
              asymmetry. In the bear case (60% probability), DATA Network fails to convert AI training data receipts
              into recurring commercial software revenue, and integration into Sui yields negligible fee capture,
              resulting in protocol dissolution and complete equity write-off below venture liquidation preferences. In
              the base case (30% probability), DATA functions as a modest utility protocol within the Sui and Walrus
              ecosystems, sustaining an enterprise value between $50 million and $100 million, anchored by Sui's $30
              million entry valuation. Even under an optimistic bull case (10% probability) where enterprise AI
              compliance legislation drives widespread adoption of the Trace tool, achieving a $300 million to $500
              million network valuation would still represent an 80% haircut from the Series B peak. With $140 million
              in aggregate venture capital senior to ordinary equity, risk-adjusted returns remain decisively negative.
            claimRefs:
