            body: >-
              Faced with near-zero on-chain gas revenue and resistance from traditional IP holders, leadership
              strategically repositioned the protocol away from generic creator IP registration toward enterprise
              off-chain licensing of human datasets for generative AI models.
            calloutType: insight
            claimRefs:
