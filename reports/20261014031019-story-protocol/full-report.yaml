      - number: '7.5'
        title: Mitigation Maturity, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Navigating Story Protocol's complex risk landscape requires establishing concrete monitoring indicators
              and unambiguous thesis-break triggers. Core monitoring indicators must track independent legal precedents
              evaluating PIL enforceability in US or EU commercial courts, validator stake decentralization metrics,
              net-new commercial enterprise licensing contract announcements, and secondary market liquidity depth
              across decentralized and centralized venues. An investment thesis would break if: (1) a federal court or
              regulatory body formally rules that Programmable IP Licenses lack off-chain legal standing, rendering
              smart contract licenses unenforceable; (2) the SEC or comparable regulator classifies the IP token as an
              unregistered security, forcing exchange delistings and halting US developer engagement; (3) institutional
              creative rights-holders definitively reject on-chain registry architectures in favor of direct bilateral
              enterprise contracts; or (4) treasury cash burn depletes operating runway before verifiable recurring
              software licensing cash flows materialize. Confirmatory diligence must demand executed enterprise customer
              contracts, audited balance sheets, and independent legal enforceability opinions.
            claimRefs:
              - CR014
              - CR015
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Off-Chain Legal Vacuum for Programmable Licenses
            body: >-
              While Story Protocol smart contracts automate on-chain attribution and royalty distribution at machine
              speed, on-chain execution offers zero legal standing against unauthorized off-chain model training or
              commercial reproduction until recognized by formal judicial courts. Creators still rely on conventional
              legal enforcement mechanisms when bad actors infringe rights outside the protocol.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: Require Independent Legal Audit and Institutional Adoption Metrics
            body: >-
              Investors should condition any investment thesis on verifiable enterprise licensing traction rather than
              speculative token-market narratives. Priority diligence must confirm binding legal opinions on PIL
              enforceability, evaluate treasury burn rate against non-token cash balances, and monitor whether
              institutional rights-holders sign production contracts.
