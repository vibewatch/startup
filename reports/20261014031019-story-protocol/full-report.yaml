      - number: '8.4'
        title: Restructuring Mechanics, Sui Takeover, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The October 2026 restructuring agreement with the Sui Foundation marks the final phase of Story Protocol's
              lifecycle as an independent blockchain entity. Under the transaction terms, Sui's $30 million investment
              makes it the largest institutional holder alongside PIP Labs and DATA Foundation, while co-founder Seung
              Yoon Lee departs operational leadership to become a strategic advisor. The protocol will dismantle its
              sovereign Layer-1 validator set, migrating all state and application storage to Sui and Walrus. For
              prospective secondary investors or creditors, critical diligence must focus on the exact legal structure
              of the PIP Labs corporate entity, remaining balance sheet cash reserves, and whether preferred
              shareholders approved a formal cram-down. Key thesis-break triggers include token migration ratios falling
              below par, further departures of core engineering talent, and any regulatory enforcement regarding
              historical foundation token sales.
