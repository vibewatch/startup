  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Valuation Assessment
        blocks:
          - type: paragraph
            body: >-
              Story Protocol warrants an unequivocal Avoid recommendation paired with a stretched-to-distressed
              valuation stance and high analytical confidence. While PIP Labs initially raised $140 million across
              multiple venture rounds led by Andreessen Horowitz—reaching a peak post-money valuation mark of $2.25
              billion following its August 2024 Series B—the underlying commercial thesis of an independent Layer-1
              blockchain for intellectual property has collapsed. Market reality has de-rated the protocol's native
              assets by over 98% from their historical highs, reducing liquid network capitalization to approximately
              $75 million. The subsequent October 2026 transaction, where the Sui Foundation committed $30 million to
              acquire effective control and absorb the protocol, confirms that historical private equity marks bear no
              relationship to current realizable enterprise value. Institutional investors must treat prior equity
              valuations as severely impaired, with common and junior equity unlikely to recover value given liquidation
              preferences.
            claimRefs:
