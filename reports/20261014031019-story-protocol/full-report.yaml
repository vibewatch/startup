      - number: '5.2'
        title: Creator and Autonomous AI Licensing Workflows
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Story Protocol fundamentally alters how creators license content and how
              artificial intelligence models acquire training data. Rather than negotiating bespoke licensing contracts
              through legal intermediaries over several weeks, creators configure terms using the Programmable IP
              License (PIL). The PIL standardizes critical licensing parameters—such as commercial usage allowances,
              upfront licensing fees, attribution requirements, and derivative royalty percentages—into
              machine-executable smart contract logic. Licensees can acquire programmatic permissions immediately by
              executing on-chain transactions, enabling instant access rights. Furthermore, through the Agent TCP/IP
              framework, autonomous artificial intelligence agents can query asset terms, programmatically negotiate
              usage rights, and stream micropayments per query or dataset ingest. Validators on the network
              cryptographically verify these licensing events and maintain immutable provenance records, mitigating
              copyright infringement risks for AI developers while securing direct attribution and revenue for original
              rights holders.
            claimRefs:
