              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bilateral Big Tech Deals Undermine Protocol Network Effects
            body: >-
              The willingness of leading AI labs like OpenAI to negotiate direct, private multi-million-dollar content
              deals with major publishers creates a powerful substitute that circumvents public blockchain registries
              entirely.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
          - type: callout
            title: The Rights-Holder Disclosure Dilemma
            body: >-
              Enterprise IP owners routinely treat licensing terms and royalty rates as proprietary trade secrets.
              Mandating on-chain transparency creates friction that disincentivizes tier-one media corporations from
              adopting decentralized registries.
            calloutType: insight
            claimRefs:
              - CP007
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Protocol Value Capture
        blocks:
          - type: paragraph
            body: >-
              Story Protocol operates as a specialized Layer-1 blockchain designed to transform intellectual property
              management into programmable on-chain logic. From a financial mechanics perspective, the protocol captures
              economic value through transaction gas fees, asset registration fees, and programmatic royalty splits
              executed across smart contracts. The native utility token, $IP, serves as the economic backbone for
              network transaction settlement, network validation staking, and governance decisions. When creators
              register intellectual property as on-chain IP Assets, the protocol generates unique identifiers linked to
              dynamic smart accounts via ERC-6551 token bound accounts. While traditional IP management imposes high
              entry barriers and friction, Story Protocol enables frictionless registration for sub-dollar transaction
              gas fees. However, value capture remains primarily indirect and tied to network throughput rather than
              recurring enterprise software subscriptions.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
