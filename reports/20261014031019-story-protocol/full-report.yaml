      - number: '7.3'
        title: Partner, Platform, and Ecosystem Dependencies
        blocks:
          - type: paragraph
            body: >-
              Story Protocol's operational viability depends heavily on external infrastructure counterparties and
              ecosystem gatekeepers. Third-party developer tooling, RPC endpoint routing, and node operations rely
              heavily on centralized Web3 infrastructure providers such as Alchemy, creating single points of failure
              where provider outages can blind developer dApps and user wallet interfaces. More critically, the protocol
              faces severe partner adoption barriers from institutional creative rights-holders. Major entertainment
              studios, record labels, and gaming publishers have demonstrated widespread reluctance to expose
              proprietary catalog terms, pricing tiers, and royalty splits to transparent public blockchain ledgers.
              Without institutional rights-holder participation, network activity risks being confined to speculative
              digital collectibles, memes, and low-value user-generated assets. Additionally, secondary market liquidity
              for the native IP token remains concentrated across a limited set of centralized exchange platforms,
              leaving protocol economics vulnerable to exchange delistings, regional regulatory enforcement actions, or
              sudden order-book illiquidity.
            claimRefs:
