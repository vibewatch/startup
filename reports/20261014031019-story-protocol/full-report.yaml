chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founders, and Leadership Governance
        blocks:
          - type: paragraph
            body: >-
              Story Protocol is a specialized Layer-1 blockchain infrastructure platform developed by PIP Labs,
              headquartered in San Francisco, California. The project was established in 2022 to address the systemic
              legal and economic friction created by generative artificial intelligence ingesting copyrighted material
              without creator compensation. PIP Labs assembled a founding team with proven backgrounds in consumer
              content, artificial intelligence research, and entertainment platforms. Co-founder and Chief Executive
              Officer Seung Yoon Lee previously co-founded mobile serialized fiction platform Radish Fiction, which was
              acquired by Korean internet conglomerate Kakao for approximately $440 million in 2021. He is joined by
              co-founder Jason Zhao, who previously conducted artificial intelligence research at Google DeepMind, and
              Jason Levy, a former executive at mobile gaming studio Pocket Gems with operational background at Apple
              and Amazon. Together, this leadership team established credibility across venture capital, entertainment,
              and Web3 circles. However, the organization exhibits substantial key-person dependence on Seung Yoon Lee
              as the primary strategic architect and capital sponsor. Recent independent reporting also identifies
              Andrea Muttoni as an executive lead navigating subsequent network transitions, indicating operational
              restructuring as commercial models evolved.
            claimRefs:
              - CO001
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO014
      - number: '1.2'
        title: Financing History, Valuation, and Stakeholder Distribution
        blocks:
          - type: paragraph
            body: >-
              PIP Labs represents one of the most heavily capitalized infrastructure startups in the decentralized
              intellectual property sector, having completed three major financing rounds between 2023 and 2024. In May
              2023, the company raised a $29.3 million Seed round led by Andreessen Horowitz crypto. This was followed
              in September 2023 by a $25 million Series A round, also led by Andreessen Horowitz. In August 2024, PIP
              Labs completed an $80 million Series B funding round led by Andreessen Horowitz with participation from
              Polychain Capital and strategic angel investors including Scott Trowbridge, Senior Vice President at
              Stability AI, and digital art collector Cozomo de Medici. The Series B round valued PIP Labs at $2.25
              billion post-money and brought cumulative lifetime capital raised to approximately $140 million.
              Institutional backing from Andreessen Horowitz provides strong capital reserves and governance
              sponsorship. However, in February 2026, PIP Labs announced a six-month deferral of initial investor and
              insider token unlocks, postponing token liquidity to August 2026. This deferral highlights liquidity
              management tensions and structural misalignment between private equity valuation and public token
              performance.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Operational Scale, Network Status, and Cover Metrics
        blocks:
          - type: paragraph
            body: >-
              Story Protocol operates a dedicated Layer-1 blockchain built using the Cosmos SDK for consensus and
              modular performance while maintaining complete Ethereum Virtual Machine execution compatibility for
              developer familiarity. As of October 14, 2026, official status telemetry reports 100% operational uptime
              across all core infrastructure endpoints, including bootnodes, RPC providers, protocol APIs, network
              explorers, and staking dashboards. Despite this technical stability, commercial revenue scale exhibits
              stark gaps common to early Web3 infrastructure. In February 2026, leadership acknowledged that on-chain
              daily transaction gas revenue stood at zero. In response, PIP Labs shifted its commercial strategy away
              from reliance on on-chain gas fees toward off-chain licensing of human-created training datasets to
              artificial intelligence model developers. Crucial financial metrics, including corporate annual recurring
              revenue, enterprise licensing contract values, customer account counts, and overall employee headcount,
              remain private to PIP Labs and undisclosed in public disclosures.
            claimRefs:
              - CO002
              - CO008
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO013
      - number: '1.4'
        title: Milestone Timeline and Strategic Realignment
        blocks:
          - type: paragraph
            body: >-
              The historical trajectory of Story Protocol illustrates rapid narrative capitalization followed by acute
              secondary market and adoption reckoning. After completing foundational financing rounds between 2023 and
              2024, Story Protocol officially launched its Layer-1 mainnet on February 13, 2025. The platform introduced
              the Programmable IP License framework and on-chain IP Asset metadata structures, allowing creators to
              encode commercial licensing terms, royalty splits, and remix permissions directly into smart contract
              modules. Following mainnet deployment, the native IP token experienced enthusiastic early speculative
              trading, reaching an all-time high price of $14.74 in September 2025. However, adoption among major
              commercial rights-holders failed to materialize because traditional entertainment franchises resisted
              exposing licensing terms on public blockchains. Consequently, the token entered a sustained downward
              spiral, declining approximately 98% from its peak. Faced with these adoption barriers, PIP Labs delayed
              insider token vesting in February 2026, pivoted its commercial narrative toward AI data provenance, and
              reportedly initiated rebranding under the DATA Foundation banner.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
