  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and IP Enforceability Risks
        blocks:
          - type: paragraph
            body: >-
              Story Protocol operates under fundamental legal ambiguity regarding whether on-chain intellectual property
              registrations and Programmable IP Licenses (PIL) carry binding legal enforceability in conventional
              judicial courts. While the protocol allows creators to embed licensing parameters, royalty terms, and
              derivative rights into smart contracts, off-chain judicial systems in major jurisdictions do not
              automatically recognize token-bound accounts as legal title or formal copyright assignments. PIP Labs
              leadership has explicitly acknowledged that blockchain-based software mechanisms cannot replace
              traditional legal counsel when infringement occurs outside the protocol network. Furthermore, while the
              protocol positions its Agent TCP/IP rails to solve AI data ingestion and licensing disputes, active
              high-profile copyright litigation such as The New York Times v. OpenAI demonstrates that major media
              publishers rely on federal copyright lawsuits rather than decentralized registries to enforce claims.
              Absent statutory recognition or binding judicial precedent upholding the PIL framework, creators face
              persistent enforcement vacuums against non-compliant commercial entities and offshore AI foundation model
              developers.
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
