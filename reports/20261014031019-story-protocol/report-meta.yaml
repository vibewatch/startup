companyProfile:
  summary: >-
    Story Protocol is a San Francisco-based IP infrastructure company developed by PIP Labs that built an EVM-compatible
    Layer-1 blockchain on Cosmos SDK to register, license, and monetize intellectual property on-chain. The current
    public record shows a technically stable network and strong venture backing, but the company has also shifted
    commercial emphasis toward off-chain AI training data licensing after its original on-chain IP adoption thesis
    failed to reach major rights-holder scale.
