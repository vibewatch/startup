  topStrengths:
    - Proven founding team and strong venture sponsorship from a16z crypto.
    - Technically differentiated IP-focused Layer-1 architecture with 100% reported core network uptime.
  topRisks:
    - Enterprise adoption, ARR, and legal enforceability of programmable IP licensing remain unproven.
    - The original sovereign L1 thesis has deteriorated into a major strategic pivot with adverse token performance.
    - Private balance-sheet, governance, and customer-contract transparency remain limited.
