callouts:
  - calloutType: recommendation
    title: 'Investment Stance: Avoid and Await Complete Restructuring Terms'
    body: Institutional capital should avoid deploying new growth equity or acquiring DATA tokens. The abandonment of sovereign Layer-1 infrastructure in favor of an integration into the Sui ecosystem fundamentally alters the investment thesis, leaving legacy venture equity subordinated to liquidation preference overhang and protocol dilution.
    claimRefs:
      - CV006
      - CV010
      - CV011
  - calloutType: risk
    title: Liquidation Preference Overhang from $140M Venture Funding
    body: With $140 million raised across preferred rounds culminating in an $80 million Series B at a $2.25 billion valuation, existing preferred equity holds substantial liquidation preferences that cannot be covered by the reported $30 million Sui investment or a ~$75 million token market cap.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV010
      - CV013
