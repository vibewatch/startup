            body: >-
              Story Protocol
              提供专用区块链基础设施，旨在把静态知识产权转为流动、可编程的数字资产。传统知识产权框架依赖人工版权登记、双边法律协议和繁琐的版税收取机制，无法很好应对快速变化的互联网二创和生成式人工智能系统。Story
              Protocol 引入锚定在兼容 ERC-6551 的 IP Accounts 上的链上 IP
              Assets（IPAs），建立统一标准，让创作作品直接在链上携带所有权规则、署名记录和许可参数。当创作者或企业将作品登记到协议中，系统会铸造代表该作品的 IP
              Asset，并将其连接至管理衍生创作、商业许可权和收入分配的模块化智能合约。这一结构基础把 IP 管理从事后法律争议执行转为事前、确定性的代码执行。
