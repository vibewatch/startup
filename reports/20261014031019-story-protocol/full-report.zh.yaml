        - L1 关闭、创始人转任战略顾问，以及独立网络叙事消失
        - 对 Sui 和 Walrus 生态的运营及平台依赖仍然很高
      - - 估值立场
        - 偏高至困境状态
        - 历史 $2.25B 私募估值与约 $75M 代币市值及 Sui $30M 控制性持股形成反差
        - 早期 Series A/B 优先股的清算优先权仍带来显著下行压力
    notes: 评估综合自 2026 年 10 月交易公告和加密二级市场数据。私募股权估值仍是未经调整的历史估值。
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV010
      - CV011
  - id: TV002
    title: 正题 / 反题表
    columns:
      - 立场
      - 核心论点
      - 证据与驱动因素
      - 什么会改变判断
    rows:
      - - 正题（看涨）
        - 可编程 AI 数据溯源能够承接巨大的企业需求
        - Trace 工具记录了 250M+ 次贡献和每日 3M 条回执，用于 AI 训练审计链路
        - AI 实验室持续采购合规训练数据，并带来经验证的企业 ARR
      - - 反题（看跌）
        - 核心 IP Layer-1 失败，企业权利人拒绝链上许可
        - 通用 IP 许可未能吸引主要权利人；代币从高点下跌 98%
        - 大型娱乐 / 音乐工作室公开在链上登记并变现目录资产
      - - 反题（结构）
        - Sui 接管会稀释并压低传统股权投资人的受偿顺位
        - Sui Foundation 的 $30M 投资取得约 40% 的有效网络持股和治理控制权
        - 重组条款证明早期股东可以完整保本并享有优先顺位
      - - 反题（执行）
        - 频繁战略转向说明公司无法实现可持续变现
        - 从通用 IP 转向 DATA Network，数月内又放弃主权 L1
        - 来自非加密企业的正向净现金流和经常性订阅合同已得到证明
    notes: 这些论点将仍在运营的 AI 训练数据溯源产品 Trace，与主权 Layer-1 区块链的结构性崩塌及让渡进行权衡。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV012
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率
      - 核心运营假设
      - 估值 / 回报逻辑
      - 关键下行触发因素
    rows:
      - - 乐观情景
        - 10%
        - Trace 成为 Sui 上主导的 AI 溯源层；企业训练数据合规推动收入增长
        - 网络价值 $300M - $500M；借助 DATA 代币或 Sui 上行空间部分收回 Series A/B 资本
        - AI 实验室绕过去中心化登记系统；版权立法放宽审计要求
      - - 基准情景
        - 30%
        - DATA 成为 Sui 生态中的小众实用协议；交易手续费流量中等
        - $50M - $100M 估值区间，反映 Sui $30M 入场估值；Series B 投资人股权大幅折价
        - 代币流速持续低迷；生态激励无法留住第三方应用开发者
      - - 悲观情景
        - 60%
        - AI 数据溯源无法变现；Walrus/Sui 集成没有定价权；代币进一步走弱
        - 清算价值低于 $30M；股权价值在清算优先权以下全部损失
        - Sui 废弃 DATA 集成；监管机构审查过去的代币发行和财库出售
      - - 下行阈值
        - 高信号
        - DATA 代币价格持续低于 $0.20，迁移后每日活跃数据回执减少
        - 股权价值无法收回；清算价值全部被高级债权人或 Sui Foundation 占有
        - 核心团队离职，PIP Labs 开发实体解散
    notes: 情景反映 Sui Foundation 投资后的 2026 年 10 月后重组。估值基于隐含代币 / 协议市值，而非传统 EBITDA 倍数。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV010
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 PIP Labs 成立、a16z 种子融资，到主网发布、代币见顶及后续战略转向的时间顺序。
    data:
      items:
        - label: 公司成立
          date: '2022'
          detail: Seung Yoon Lee、Jason Zhao 和 Jason Levy 在旧金山创立 PIP Labs，目标是打造知识产权区块链。
          tone: neutral
        - label: Seed 轮融资
          date: 2023-05
          detail: 获得 Andreessen Horowitz crypto 领投的 $29.3 million Seed 轮融资，用于搭建原生 IP 的 Layer-1 网络。
          tone: positive
        - label: Series A 融资
          date: 2023-09
          detail: 完成由 a16z crypto 领投的 $25 million Series A 轮融资，加速协议开发和开发者工具包建设。
          tone: positive
        - label: Series B 独角兽融资
          date: 2024-08
          detail: 获得 a16z crypto 领投、Polychain Capital 参与的 $80 million Series B 融资，估值 $2.25 billion；累计融资达到 $140M。
          tone: positive
        - label: Layer-1 主网上线
          date: '2025-02-13'
          detail: 正式上线兼容 EVM 的 Cosmos SDK Layer-1 主网，并推出用于质押和执行的原生 IP 代币。
          tone: positive
        - label: 代币历史最高点
          date: 2025-09
          detail: 原生 IP 代币上线后达到 $14.74 的历史最高估值，随后进入严重的二级市场下跌。
          tone: neutral
        - label: 锁定期延长与 AI 转向
          date: 2026-02
          detail: 宣布将内部人士代币解锁时间延后六个月至 2026 年 8 月，并将商业定位转向 AI 数据集许可。
          tone: warning
        - label: 当前运营评估
          date: '2026-10-14'
          detail: 网络基础设施保持 100% 正常运行，但二级分析显示代币较 ATH 下跌约 98%，并更名为 DATA Foundation。
          tone: negative
