              Story Protocol 的技术架构是一条专门打造的 Layer-1 区块链，用于处理知识产权关系的计算复杂度。不同于只把知识产权当作静态 NFT 元数据指针的通用区块链，Story Protocol 将
              Cosmos SDK 共识引擎（CometBFT）与兼容 EVM 的执行层结合，用于优化复杂有向无环图（DAG）数据结构。底层共识层提供确定性的拜占庭容错最终性，以及微交易所需的高吞吐；EVM
              执行环境则确保与现有 Ethereum 工具、智能合约和开发者基础设施互操作。在执行环境之上，Proof-of-Creativity
              框架运行专用图索引层，追踪跨多代的父子衍生关系。这样，下游衍生作品产生收入时，版税分成就能无需人工审计或链下托管，以无需信任的方式沿所有祖先 IP Assets 向后级联。
