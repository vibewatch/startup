      - CP014
    data:
      points:
        - label: Story Protocol
          x: 8.5
          'y': 3.5
          detail: 依托 PIL 和 EVM/Cosmos L1，具备较高可编程性，但企业权利人采用度低，代币大幅下跌。
        - label: OpenLedger
          x: 8
          'y': 4
          detail: 面向运行时许可的合作伙伴验证和执行层，同样面临机构端的先有鸡还是先有蛋难题。
        - label: 大型科技公司双边交易（OpenAI / Condé Nast）
