  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 按时间顺序呈现从 Series B 融资高峰到商业摩擦、代币贬值和 Sui Foundation 接管的过程。
    data:
      nodes:
        - id: capital-inflow
          label: 资本流入与 Series B 高峰
          detail: 由 a16z 领投，从 Seed 到 Series B 共筹得 $140M，私募估值达到 $2.25B 高峰
        - id: technical-launch
          label: 主权 Layer-1 上线
          detail: 部署兼容 EVM 的 Cosmos SDK 链，支持 ERC-721 IP 资产和可编程 IP 许可
        - id: adoption-failure
          label: 商业采用障碍
          detail: 主要娱乐、音乐和游戏权利人拒绝让许可透明度上链
        - id: market-derating
          label: 市场重估与代币暴跌
          detail: 随着实用需求消失，原生 IP 代币从历史最高价 $14.78 暴跌 98% 至 $0.275 的低点
        - id: sui-restructuring
