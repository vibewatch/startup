        - label: 传统版权与 DMCA（登记 / 法律通知）
          x: 2
          'y': 8
          detail: 依据《伯尔尼公约》在全球具备成熟的法律可执行性，但人工执行缓慢，分成不透明。
        - label: 通用 NFT 与 Web3 平台（OpenSea / Ethereum L1）
          x: 5
