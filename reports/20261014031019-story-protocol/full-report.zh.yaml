  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与 IP 可执行性风险
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 面临根本性的法律不确定性：链上知识产权登记和 Programmable IP
              Licenses（PIL）是否能在传统司法法院产生具有约束力的法律效力。协议允许创作者把许可参数、版税条款和衍生权写入智能合约，但主要司法辖区的链下司法体系不会自动把代币绑定账户认定为法律所有权或正式版权转让。PIP
              Labs 管理层明确承认，当侵权发生在协议网络之外时，基于区块链的软件机制无法替代传统法律顾问。此外，协议虽然把 Agent TCP/IP 轨道定位为解决 AI 数据摄取和许可争议的方案，但 The New
              York Times v. OpenAI 等高关注版权诉讼表明，大型媒体出版商依靠联邦版权诉讼，而不是去中心化登记系统来执行权利。除非 PIL
              框架获得法定认可或有约束力的司法先例支持，否则创作者面对不合规商业实体和离岸 AI 基础模型开发者时，仍会持续缺乏有效执行手段。
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
      - number: '7.2'
        title: 运营、共识与技术故障模式
        blocks:
          - type: paragraph
            body: >-
              在协议层，Story Protocol 实施基于 CometBFT 的专用 Proof-of-Stake 共识机制，并结合连接 Cosmos SDK 状态与兼容 EVM
              虚拟机的双执行环境。这种混合架构带来独特的运营和安全攻击面。第一，负责出块和交易最终性的验证者集合具有早期 Layer-1
              网络典型的中心化风险：基金会委托和早期风险投资支持者控制了相当大的投票权。第二，模块化智能合约虽然在链上自动化许可条款、版税分配和去中心化争议解决，但 ERC-6551
              代币绑定账户与争议模块之间复杂的跨合约调用，提高了重入、状态不同步和智能合约执行错误的暴露度。最后，协议计划建设用于创作者身份验证和自动抄袭检测的证明预言机网络，这会引入外部依赖风险：预言机延迟、数据不准确或错误归因标记，可能扰乱下游去中心化应用的许可执行。
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 合作伙伴、平台与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的运营可行性高度依赖外部基础设施合作方和生态把关者。第三方开发者工具、RPC 端点路由和节点运营都严重依赖 Alchemy 等中心化 Web3
              基础设施供应商，由此形成单点故障：供应商宕机可能让开发者 dApp
              和用户钱包界面失去可见性。更关键的是，机构级创意权利人构成了严重的合作方采用障碍。大型娱乐制片厂、唱片公司和游戏发行商普遍不愿把专有目录条款、定价层级和版税分成公开在透明的公链账本上。没有机构权利人参与，网络活动可能局限于投机性数字收藏品、meme
              和低价值用户生成资产。此外，原生 IP 代币的二级市场流动性仍集中在少数中心化交易平台，令协议经济暴露于交易所下架、地区监管执法行动或订单簿流动性突然枯竭的风险。
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 财务模型、资本密集度与风险热力图
        blocks:
          - type: paragraph
            body: >-
              从财务和代币经济角度看，Story Protocol 在 Andreessen Horowitz 领投的多轮融资中共募集了 $140 million，2024 年 8 月达到 $2.25 billion
              的最高私募估值。但募集资本不等于经营收入或持续的网络现金流。公开证据显示，可验证的企业许可 ARR 和公司收入分成仍未得到证明，PIP Labs
              因此高度依赖风险投资金库余额来资助协议开发和生态资助。与此同时，二级市场数据表明，原生 IP 代币的市值大幅回撤；据报道，主网上线后较历史高点下跌约
              98%。这次贬值压缩了验证者质押经济性，削弱了社区开发者资助的价值，也打击了网络参与者激励。配套风险热力图按剩余严重性和缓解成熟度，综合呈现这些相互关联的法律、运营、合作方及财务风险敞口。
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: 缓解措施成熟度、论点失效触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              要应对 Story Protocol 复杂的风险图景，必须建立具体的监测指标和明确的论点失效触发器。核心监测指标必须跟踪美国或欧盟商事法院评估 PIL
              可执行性的独立法律先例、验证者质押去中心化指标、新增商业企业许可合同公告，以及去中心化和中心化场所的二级市场流动性深度。若出现以下情况，投资论点将失效：(1) 联邦法院或监管机构正式裁定 Programmable
              IP Licenses 不具备链下法律效力，使智能合约许可无法执行；(2) SEC 或同类监管机构将 IP 代币认定为未注册证券，迫使交易所下架并停止美国开发者参与；(3)
              机构创意权利人明确拒绝链上登记架构，转而采用直接双边企业合同；或 (4)
              金库现金消耗在可验证的经常性软件许可现金流实现前耗尽运营期限。确认性尽调必须要求已签署的企业客户合同、经审计的资产负债表及独立的法律可执行性意见。
            claimRefs:
              - CR014
              - CR015
      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 可编程许可的链下法律真空
            body: >-
              Story Protocol
              智能合约能以机器速度自动完成链上归属和版税分配，但在获得正式司法法院认可前，链上执行对于未经授权的链下模型训练或商业复制不具备任何法律效力。创作者在不法行为者于协议之外侵犯权利时，仍须依靠传统法律执行机制。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: 要求独立法律审计与机构采用指标
            body: 投资者应把投资论点建立在可验证的企业许可进展上，而不是投机性的代币市场叙事上。重点尽调必须确认对 PIL 可执行性的有约束力法律意见，评估金库消耗率与非代币现金余额的匹配情况，并监测机构权利人是否签署生产合同。
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值评估
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 应明确给出避免投资的建议，估值立场为从高估走向困境，分析置信度高。PIP Labs 最初在 Andreessen Horowitz 领投的多轮风险投资中募集 $140
              million，并在 2024 年 8 月 Series B 后达到 $2.25 billion 的最高投后估值；但其作为独立知识产权 Layer-1
              区块链的商业论点已经崩塌。市场现实令该协议原生资产较历史高点下跌超过 98%，流动网络市值降至约 $75 million。随后 2026 年 10 月，Sui Foundation 承诺投入 $30
              million 以取得实际控制权并吸收该协议，这进一步确认历史私募股权估值与当前可实现的企业价值毫无关系。机构投资者必须将此前的股权估值视为严重减值；鉴于清算优先权，普通股和次级股权几乎不可能收回价值。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: 投资论点 vs. 反论点：通用链上 IP 的崩塌
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的核心投资论点认为，生成式人工智能将催生对可编程链上知识产权登记、自动许可和无需信任的版税分成的巨大需求。Story 基于 Cosmos SDK 构建了兼容 EVM 的
              Layer-1，采用 ERC-721 IP Assets，并配套 ERC-6551 代币绑定账户和 Programmable IP
              Licenses。然而，反论点最终占据上风：影视、音乐、文学和游戏领域的大型商业权利人从根本上抵制将专有许可条款暴露在透明的链上机制中。没有优质版权人的采用，网络交易一直停留在投机阶段，导致 IP 代币从
              $14.78 暴跌至 $0.275。由于自主链的采用势头已出现终局性缺口，团队在 2026 年 6 月转向 DATA Network，将重点收窄到 AI 训练数据溯源，最终放弃独立区块链基础设施。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV012
      - number: '8.3'
        title: 估值情景与资本结构减值
        blocks:
          - type: paragraph
            body: >-
              用概率加权情景评估存续企业，显示下行不对称性极其严重。在悲观情景（概率 60%）下，DATA Network 无法将 AI 训练数据收据转化为经常性商业软件收入，接入 Sui
              也只能获得微不足道的费用收入，最终协议解散，股权在风险投资清算优先权之下被完全冲销。在基准情景（概率 30%）下，DATA 在 Sui 和 Walrus 生态中作为规模有限的工具型协议运营，企业价值维持在 $50
              million 至 $100 million 之间，以 Sui 的 $30 million 入场估值为锚。即使在乐观情景（牛市，概率 10%）下，企业 AI 合规立法推动 Trace 工具广泛采用，网络估值达到
              $300 million 至 $500 million，仍相当于较 Series B 峰值折价 80%。由于累计 $140 million 的风险资本优先于普通股，风险调整后回报仍明确为负。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV013
      - number: '8.4'
        title: 重组机制、Sui 接管与尽调要求
        blocks:
          - type: paragraph
            body: >-
              2026 年 10 月与 Sui Foundation 达成的重组协议，标志着 Story Protocol 作为独立区块链实体生命周期的最后阶段。按交易条款，Sui 的 $30 million 投资使其与
              PIP Labs 和 DATA Foundation 并列成为最大机构持有人；联合创始人 Seung Yoon Lee 离开运营管理，转任战略顾问。协议将拆除自主 Layer-1
              验证者集合，并把全部状态和应用存储迁移至 Sui 和 Walrus。对潜在二级投资者或债权人而言，关键尽调必须聚焦 PIP Labs
              企业实体的确切法律结构、资产负债表剩余现金储备，以及优先股股东是否批准正式的强制压缩重组。论点失效触发器包括代币迁移比例跌破面值、核心工程人才进一步离职，以及针对历史基金会代币销售的任何监管执法。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
          - type: figure
