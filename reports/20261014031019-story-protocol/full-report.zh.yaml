              Story Protocol 的公开进展叙事把漏斗前端合作伙伴触达数字与代币化资产估值结合起来，营造早期势头强劲的印象。高调公告经常引用平台级汇总数据，例如 Magma 的 3.6 million
              注册数字艺术家和 Solo Leveling 的 14 billion 全球观看量；但这些指标反映的是合作平台的历史受众，而不是 Story Layer-1 网络上的活跃交易用户。在现实世界资产领域，Aria
              Protocol 宣布通过 Aria PRIME 将价值 $100 million 的韩国音乐目录权利代币化，使 IP 总锁仓价值超过 $110
              million。然而，二级交易流动性、持续版税收收益和协议经常性费用捕获仍不透明。网络的核心商业主张依靠 Programmable IP
              License（PIL）连接链上逻辑与链下法律框架，但可验证的企业采用指标和软件经常性收入尚未出现。
            claimRefs:
