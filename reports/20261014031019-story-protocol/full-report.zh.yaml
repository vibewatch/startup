  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出与替代工作流
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 将市场边界定义在知识产权管理、数字内容许可和机器学习数据溯源的交汇处。它并不试图替代全部企业 ERP 软件或实体专利诉讼，而是专门承接数字 IP
              资产登记、许可和追踪相关支出。在传统创意行业，权利管理依赖集中式版权登记、定制化律所合同和人工下架机制，摩擦大、响应慢。借助兼容 EVM 的 Layer-1 区块链基础设施，Story Protocol
              将知识产权封装为由 ERC-721 和 ERC-6551
              代币绑定账户承载的可编程链上资产。该技术边界覆盖数字创作者版税自动化、合成数据集溯源和游戏资产许可等可寻址预算，但明确排除线下法律抗辩顾问费、实体商品制造预算以及企业内部 AI
              训练算力。协议把自己定位为自动化基础设施层，以智能合约许可模块替代人工纸面许可流程。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
