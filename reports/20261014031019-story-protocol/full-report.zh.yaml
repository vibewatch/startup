      - number: '2.3'
        title: 买方分层、预算归属与企业采用路径
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 三类主要买方的采用路径和预算归属差异很大。第一类、也是最直接的用户，是原生 Web3 创作者、数字艺术家和创作者
              DAO；他们直接控制发布钱包，希望为表情包和数字艺术衍生品实现透明、自动化的收入分成。第二类是生成式 AI 开发者和基础模型实验室，他们面临内容所有者不断上升的版权诉讼风险。对这些买方而言，预算由 AI
              基础设施负责人和企业总法律顾问掌握，他们需要合法、合规且获得许可的训练语料。Story Protocol 通过机器可读的 Programmable IP
              License（PIL）模板，帮助自动化数据集补偿。第三类、也是潜在规模最大的一类，是传统企业媒体工作室、游戏发行商和娱乐品牌所有者。在这些组织中，许可决策归企业法务部门和首席许可官所有。要走通企业采用路径，就必须把链上智能合约接入既有链下合同体系；而采购周期很长，对实验性去中心化工具的容忍度也极低。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、法律可执行性与机构采用摩擦
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的增长受强劲结构性顺风推动，尤其是生成式 AI 抓取诉讼增加，以及内容创作者要求获得公平补偿。网络的核心创新 Programmable IP
              License（PIL）把链上智能合约参数与包括《伯尔尼公约》在内的国际版权惯例对齐，试图让法律可执行性与代码执行衔接起来。然而，平台受到严重的机构采用约束。企业权利人身处根深蒂固的法律范式，许可条款、价格折扣和排他协议都被视为商业秘密。Onchain
              Atlas 的独立基础设施分析记录了专业媒体和品牌所有者对把敏感商业许可条款暴露在透明公链账本上的强烈抵触。此外，传统企业依赖既有法律先例、司法仲裁和合同生命周期软件，切换成本很高。由于没有公开披露生产级企业软件
              ARR 或付费企业客户合同金额，协议能否从投机性原生加密代币激励转向可持续的企业许可标准，仍是关键尽调不确定性。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业抵触公开链上许可条款
            body: >-
              Story Protocol 通过 Programmable IP License
              提供技术自动化，但大型娱乐公司和企业权利人仍不愿暴露专有许可条款，也不愿依赖未经验证的智能合约争议机制，限制了短期可寻址市场扩张。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案类型
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 所处的竞争环境远不止直接 Web3 同行，还包括成熟法律机构、企业双边交易和新兴 AI 基础设施。在去中心化生态中，Story Protocol 将自己定位为专用 Layer-1
              区块链，把 Cosmos SDK 共识架构与完整 EVM 执行结合起来；相较于只记录静态代币所有权的通用 NFT 协议，它的差异在于自动化许可逻辑。OpenLedger
              等相邻协议更像执行和验证合作方，而非零和竞争者：Story 负责规范化资产登记，OpenLedger 则在 AI 模型流水线中执行运行时权利。不过，协议面临的主要竞争压力来自非区块链替代方案。OpenAI
              等大型人工智能实验室越来越多地完全绕过去中心化公链，转而与 Condé Nast、Axel Springer
              等成熟媒体集团直接签署双边许可合作。同时，绝大多数企业知识产权仍依赖法定版权登记，以及由《伯尔尼公约》等国际框架支撑的法律执行。传统法律流程虽然缓慢、纸面工作繁重，却能提供明确的司法先例，机构权利人通常更偏好这种确定性，而不是算法化智能合约执行。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 能力差异与技术架构矩阵
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的核心差异化在于把被动版权登记转成动态、可编程的软件资产。网络将每项链上资产与 ERC-6551
              代币绑定账户连接，使每个创作作品都能像自主实体一样接收许可费、发放权限代币，并建立自动化的父子衍生关系。Programmable IP License
              框架进一步把传统法律合同条款翻译为机器可读参数，管理商业使用、署名要求以及 remix 网络中的版税分配。与传统版权工作流和常规 NFT 市场相比，Story Protocol
              交易更快、自动记账也更顺畅，技术优势明显。传统版权管理需要人工起草合同、第三方许可中介和定期版税审计，行政负担很重；标准 ERC-721 代币也没有原生的自动衍生追踪或跨代收入分成机制。不过，Story
              Protocol 的技术可组合性完全依赖交易对手留在兼容 EVM 的执行环境中；一旦创作资产或训练数据离开链上轨道，就必须依靠数字水印和链下法律执行机制来维持合规。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
