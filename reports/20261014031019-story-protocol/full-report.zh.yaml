      - number: '6.4'
        title: 留存、收入捕获与权利人集中风险
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 商业模式的可持续性受到客户留存、企业支付意愿和参与者集中度的明显拖累。Web3 原生创作者社群很容易参与测试网活动和代币激励，但主流创作者和机构 IP
              所有者在使用区块链界面时会遇到严重的可用性摩擦和法律不确定性。最关键的是，拥有最有价值商业 IP
              的大型企业权利人并未采用该协议。一线音乐公司、游戏发行商和好莱坞制片厂仍不愿把专有许可条款暴露在公链智能合约登记系统上，也不愿冒品牌稀释风险。代币市值大幅下跌、企业版权所有者商业采用低迷后，协议管理层开始把宣传转向
              AI 训练数据溯源，凸显原有消费 IP 许可模式留存脆弱、耐久性不明。
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业权利人抵触阻碍机构 IP 流动性
            body: >-
              Story Protocol 虽成功与 Solo Leveling、Barunson Studio 等娱乐品牌建立消费营销合作，但机构媒体集团因担心未经授权的 AI 训练、品牌稀释以及 PIL
              在多司法辖区的可执行性不明，仍抵触将一线 IP 登记到链上。
            calloutType: risk
            claimRefs:
