            title: 虚荣触达指标掩盖尚处萌芽的链上经济速度
            body: 合作伙伴公告突出 14 billion 网络漫画观看量和 3.6 million 数字艺术家等醒目数字，但这些指标衡量的是既有 Web2 平台规模，而不是活跃的链上许可交易或可验证的协议现金流。
            calloutType: insight
            claimRefs:
