            body: >-
              尽管 Story Protocol 在 Andreessen Horowitz 等机构领投的多轮融资中累计获得 $140 million，并达到 $2.25 billion
              的初始估值，其网络效应和竞争护城河仍然脆弱。协议的核心风险是权利人参与悖论：只有当一线媒体特许经营、音乐目录和企业出版商登记资产时，网络价值才会复合增长，但机构所有者强烈抵触将保密的许可条款和收入模式暴露在透明、不可篡改的公链账本上。行业分析师指出，专业权利人把定制且不透明的许可合同视为竞争优势，不愿将其商品化。这一商业摩擦造成主网上线后的严重逆风，包括
              $IP 代币较峰值交易价骤跌 98%，以及随后将战略叙事转向通用 AI 数据溯源。企业内容所有者的切换成本也不对称：传统版权法无需代币化登记即可提供默认的国际保护，而把 IP 目录迁移到 Story
              Protocol 则需要智能合约集成、法律重构和持续的代币运营管理。在没有可执行的司法先例证明非美国司法辖区认可链上许可的情况下，企业买方会把去中心化 IP 轨道视为不必要的法律风险，从而巩固现有双边交易，限制
