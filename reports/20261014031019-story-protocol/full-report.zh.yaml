  - id: FU001
    title: 客户旅程图：IP 资产从登记到变现的生命周期
    type: journey-map
    summary: 六阶段生命周期展示创作者、工作室和 AI 代理如何在 Story Protocol 上登记、许可、混编、结算并遭遇摩擦。
    data:
      nodes:
        - label: IP 资产登记
          stage: IP Asset Registration
          actor: Original Creator / Studio
          action: Mints ERC-721 NFT bound via ERC-6551 Token Bound Account containing IP metadata and proof-of-creativity
          touchpoints:
            - Story Portal
            - Magma API Integration
          friction: Requires initial metadata formatting and on-chain gas fees
        - label: 许可条款配置
          stage: License Term Configuration
          actor: Rights Holder
          action: Attaches Programmable IP License (PIL) specifying commercial use terms, attribution, and royalty rates
          touchpoints:
            - PIL Licensing Module
            - Smart Contract Templates
          friction: Standard legal templates may not cover bespoke multi-jurisdictional IP clauses
        - label: 发现与衍生品混编
          stage: Discovery & Derivative Remixing
          actor: Derivative Creator / AI Developer
          action: Discovers registered IP, negotiates automated terms via ATCP/IP, and creates child IP derivative asset
          touchpoints:
            - Verse Eight Game Engine
            - nPLUG Remix Platform
          friction: Derivative quality and brand dilution concerns for traditional rights holders
        - label: 商业结算与版税分配
          stage: Commercial Settlement & Royalty Distribution
          actor: Protocol & Liquidity Pools
          action: Royalty Module automatically splits secondary revenue and licensing fees between parent and child accounts
          touchpoints:
            - Automated Royalty Module
            - DeFi Liquidity Pools
          friction: Reliance on $IP or stablecoin settlement rather than fiat payment rails
        - label: 争议标记与法律桥接
          stage: Dispute Flagging & Legal Bridge
          actor: Disputing Rights Owner
          action: Flags unauthorized derivatives on-chain or triggers off-chain legal arbitration via PIL contract
          touchpoints:
            - Dispute Module
            - Off-chain Legal Arbitrators
          friction: Off-chain legal enforceability across non-US courts remains untested
        - label: 生态回流 / 流失
          stage: Ecosystem Re-engagement / Churn
          actor: Enterprise Rights Holder
          action: Evaluates ongoing licensing yields, secondary trading volume, and token price volatility
          touchpoints:
            - Seoul Exchange RWA Rail
            - Ecosystem Explorers
          friction: High risk of disengagement if primary enterprise revenue does not materialize
    approximationNotes: 阶段反映协议公开的架构模块和已宣布的合作伙伴工作流；阶段之间的转化率尚未公开披露。
    claimRefs:
