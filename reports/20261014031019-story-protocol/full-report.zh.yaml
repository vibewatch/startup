chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始人和领导治理
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 是由 PIP Labs 开发、总部位于美国加州旧金山的专业 Layer-1 区块链基础设施平台。项目成立于 2022
              年，旨在解决生成式人工智能在不向创作者付费的情况下摄取受版权保护材料所造成的系统性法律和经济摩擦。PIP Labs 组建了一支在消费内容、人工智能研究和娱乐平台领域拥有成熟履历的创始团队。联合创始人兼 CEO
              Seung Yoon Lee 此前共同创办移动连载小说平台 Radish Fiction；该平台于 2021 年被韩国互联网集团 Kakao 以约 $440 million 收购。联合创始人 Jason Zhao
              此前在 Google DeepMind 从事人工智能研究；Jason Levy 则曾任移动游戏工作室 Pocket Gems 高管，并在 Apple 和 Amazon
              积累了运营经验。这支领导团队由此在风险资本、娱乐和 Web3 圈层建立了信誉。不过，组织对 Seung Yoon Lee 的依赖很重，他既是主要战略设计者，也是资本支持者。近期独立报道还将 Andrea
              Muttoni 认定为负责后续网络转型的执行负责人，说明商业模式演变的同时也发生了运营重组。
            claimRefs:
              - CO001
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO014
      - number: '1.2'
        title: 融资历史、估值和利益相关者分布
        blocks:
          - type: paragraph
            body: >-
              PIP Labs 是去中心化知识产权领域资本最充足的基础设施初创公司之一，2023 至 2024 年间完成了三轮主要融资。2023 年 5 月，公司在 Andreessen Horowitz crypto
              领投下完成 $29.3 million Seed 轮融资；2023 年 9 月又由 Andreessen Horowitz 领投完成 $25 million Series A。2024 年 8 月，PIP
              Labs 在 Andreessen Horowitz 领投、Polychain Capital 及战略天使投资人跟投下完成 $80 million Series B，包括 Stability AI 高级副总裁
              Scott Trowbridge 和数字艺术收藏家 Cozomo de Medici。Series B 使 PIP Labs 的投后估值达到 $2.25 billion，累计融资约 $140
              million。Andreessen Horowitz 的机构支持提供了充足储备和治理背书。但 2026 年 2 月，PIP Labs 宣布将首批投资人和内部人士代币解锁延后六个月，把代币流动性推迟至 2026
              年 8 月。这一延期暴露出流动性管理压力，也凸显私人股权估值与公开代币表现之间的结构性错位。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 运营规模、网络状态和封面指标
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 使用 Cosmos SDK 构建专用 Layer-1 区块链，以实现共识和模块化性能，同时保持完整的 Ethereum Virtual Machine
              执行兼容性，方便开发者使用。截至 2026 年 10 月 14 日，官方状态遥测显示所有核心基础设施端点均保持 100% 运行，包括 bootnode、RPC 提供商、协议
              API、网络浏览器和质押面板。技术稳定并未消除早期 Web3 基础设施常见的商业收入缺口。2026 年 2 月，管理层承认链上每日交易 Gas 收入为零。因此，PIP Labs 将商业战略从依赖链上 Gas
              费转向为人工智能模型开发者提供人类创作训练数据集的链下许可。企业年化经常性收入、企业许可合同金额、客户账户数和员工总数等关键财务指标仍由 PIP Labs 私有持有，公开披露中没有这些数据。
            claimRefs:
              - CO002
              - CO008
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO013
      - number: '1.4'
        title: 里程碑时间线与战略重整
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 先把市场叙事迅速资本化，随后又遭遇二级市场和实际采用的严峻检验。完成 2023 至 2024 年的基础融资后，Story Protocol 于 2025 年 2 月 13 日正式启动
              Layer-1 主网。平台推出 Programmable IP License 框架和链上 IP Asset 元数据结构，让创作者可以直接在智能合约模块中写入商业许可条款、版税拆分和二次创作权限。主网上线后，原生
              IP 代币经历了热烈的早期投机交易，于 2025 年 9 月达到 $14.74 的历史最高价。但主要商业权利人并未大规模采用，因为传统娱乐特许经营方不愿把许可条款暴露在公链上。代币随后持续下跌，较峰值约下挫
              98%。面对采用障碍，PIP Labs 于 2026 年 2 月推迟内部人士代币归属，将商业叙事转向 AI 数据溯源，并据报道开始以 DATA Foundation 名义重塑品牌。
            claimRefs:
