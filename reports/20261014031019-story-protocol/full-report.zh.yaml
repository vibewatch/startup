      - number: '2.2'
        title: 市场规模视角与品类估值基准
        blocks:
          - type: paragraph
            body: >-
              评估可编程知识产权基础设施的可寻址市场，需要结合多种估值和交易量视角，而不是套用单一的自上而下推算。行业评论者常指出，全球无形知识产权构成数万亿美元级别的宏观资产池，但其中目前只有很窄的一部分能由公链承接。在私人风险市场中，领投方
              Andreessen Horowitz（a16z）在 2024 年 8 月 $80 million Series B 融资后，将 PIP Labs 估值定为 $2.25 billion，反映出市场积极押注生成式
              AI 抓取内容最终会迫使商业许可迁移到链上。与此同时，公开二级代币市场提供了另一种视角：截至 2026 年 10 月，原生 IP 功能型代币在中心化交易所的市值约为 $74 million 至 $75
              million。Web3 创作者版税和 AI 数据集许可的可寻址支出估计每年在 $10 billion 至 $25 billion 之间，而可编程 Layer-1
              协议基础设施支出目前仍处于更窄的可服务可获得市场。Agent TCP/IP（ATCP/IP）交易层等自主代理框架，目标是释放增量机器间许可交易量，但短期软件费捕获仍未经证明。
            claimRefs:
              - CM001
              - CM006
              - CM011
              - CM012
              - CM013
