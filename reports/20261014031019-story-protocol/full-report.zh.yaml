            title: 投资立场：避免投资，等待完整重组条款
            body: 机构资本应避免部署新的成长股权或购买 DATA 代币。放弃自主 Layer-1 基础设施、转而接入 Sui 生态，根本改变了投资论点，使旧有风险投资股权受制于清算优先权悬置和协议稀释。
            calloutType: recommendation
