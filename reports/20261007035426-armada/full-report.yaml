  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broader than the disclosed revenue model
        blocks:
          - type: paragraph
            body: >-
              Armada presents one platform with four products: Atlas, Galleon, Bridge, and Marketplace. That product map
              creates several plausible economic motions, but only one retained third-party source labels the overall
              model as subscription. Atlas can support recurring software revenue; Galleon may introduce equipment,
              deployment, and support economics; Bridge is positioned as GPU-as-a-Service; and Marketplace is a
              procurement surface whose commission or resale structure is not disclosed. The resulting underwriting view
              is therefore a hybrid-model hypothesis, not a verified revenue mix. No retained source supplies contract
              units, revenue-recognition policies, mix by product, or a bridge from customer activity to recognized
              revenue and gross profit.
