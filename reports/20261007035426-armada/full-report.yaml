companyProfile:
  summary: >-
    Armada is a private sovereign-edge infrastructure company that combines modular data centers, satellite connectivity
    management, and GPU orchestration software for defense, energy, telecom, mining, and public-infrastructure
    customers. The business is led by co-founders Marc Held and Jon Runyan and Chief Executive Officer Dan Wright, with
    commercial credibility supported by major funding, industrial manufacturing, and cloud-partnership announcements.
    The main diligence issue is not product existence but whether the hardware-plus-software model can scale
    economically with durable margins, transparent pricing, and predictable deployment throughput.
