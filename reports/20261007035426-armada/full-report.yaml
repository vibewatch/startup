  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Classification, and Entity Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Armada defines its core operational domain as full-stack ruggedized edge computing and distributed
              sovereign AI infrastructure designed for harsh, remote, or disconnected operating environments. The
              company packages specialized modular physical data centers under the Galleon brand, GPU orchestration via
              Bridge, and centralized fleet management through its Atlas software layer, with prominent connectivity
              enabled through enterprise Starlink management. Included addressable spend encompasses industrial edge
              compute hardware, remote connectivity orchestration, sovereign on-premise AI deployments, and specialized
              edge infrastructure for defense, oil and gas, and telecommunications. Excluded spend comprises centralized
              hyperscale public cloud compute, commodity consumer IoT edge hardware, and general enterprise data center
              construction. Crucially, market intelligence and search volume audits show acute brand collisions with
              unrelated commercial entities sharing the 'Armada' trademark—specifically Nissan Armada full-size SUV
              automotive retail, Armada Credit Bureau Limited in Uganda, Armada Supply Chain logistics, and the XRPN
              acquisition vehicle—necessitating rigorous diligence boundaries to prevent phantom market demand
              attribution [CM001] [CM002] [CM003] [CM004].
