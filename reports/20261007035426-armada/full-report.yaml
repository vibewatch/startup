  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Analytical Lens
      - Bull Investment Thesis
      - Bear Anti-Thesis
      - What Would Change View
    rows:
      - - Deployment Speed
        - Modular units deploy in days or weeks versus 24 months for traditional data centers
        - Site permitting, power interconnection, and customer preparation still create multi-month bottlenecks
        - Audited customer site activation timestamps demonstrating sub-30-day delivery
      - - Product & Moat
        - Integrated stack spanning Atlas NOC, Galleon compute, Bridge cloud, and Marketplace
        - Hardware manufacturing dominates cost profile while software monetization remains unproven
        - Disclosed contract breakdowns showing >50% gross margin from Atlas and Bridge software
      - - Manufacturing Scale
        - 400,000 sq ft Galleon Forge One facility in Arizona with Johnson Controls partnership
        - Substantial factory overhead, tooling capex, and execution yield risks in scaling production
        - Independent manufacturing audit confirming Leviathan production yield and unit costs
      - - Adverse / Cyber Threat
        - Disclosed Spirals ransomware incident in Sept 2026 targets unrelated Ugandan credit bureau
        - Austere and defense edge environments represent critical infrastructure with severe threat exposure
        - Verified third-party FedRAMP High and SOC2 Type II audit packages for edge orchestration
    notes: >-
      Contrasts structural drivers against potential execution failure modes identified across public reports and breach
      registries.
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Implied Valuation Range
      - Operational Assumptions
      - Key Execution Risks
      - Probability Signal
    rows:
      - - Bear Case
        - $1.0B - $1.5B
        - Slow bookings conversion, factory yield delays at Forge One, power friction
        - Heavy hardware working capital cash burn; margin compression to hardware norms
        - High if recognized revenue lags reported bookings expansion
      - - Base Case
        - $1.8B - $2.3B
        - Steady Galleon delivery, Johnson Controls ramp meets initial volume targets
        - Customer concentration in early government and energy sectors; moderate software attach
        - Current consensus implied by May 2026 Series B round pricing
      - - Bull Case
        - $3.0B - $4.5B
        - Rapid adoption across sovereign AI, defense, and multinational remote sites
        - Competitive entry from hyperscalers or customized containerized infrastructure vendors
        - Low until multi-vertical enterprise renewals and software margins are documented
    notes: >-
      Milestone-banded valuation scenarios based on operational conversion metrics rather than unverified revenue
      estimates.
    claimRefs:
      - CV001
      - CV004
