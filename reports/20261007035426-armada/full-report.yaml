      - number: '1.4'
        title: Chronological Milestones and Legal Entity Disambiguation
        blocks:
          - type: paragraph
            body: >-
              The chronological trajectory of Armada illustrates an accelerated transition from modular edge hardware
              prototypes to gigawatt-scale sovereign infrastructure partnerships. Material 2026 milestones include the
              integration of NVIDIA AI Grid capabilities for telecommunications carriers in March, the launch of the
              10-megawatt Orion Galleon modular data center in August, and securing a multi-unit Leviathan MDC order
              from Nordic operator Fossefall. Concurrently, diligence requires rigorous legal entity disambiguation to
              avoid conflating Armada Inc with unrelated entities sharing the corporate name. Specifically, in September
              2026, the Spirals ransomware extortion syndicate posted an unconfirmed claim targeting 'Armada Credit
              Bureau'—a licensed credit reporting firm legally distinct from Armada Inc. Similarly, public filings for
              Armada Acquisition Corp III (a NASDAQ blank-check SPAC) and Armada Hoffler (a real estate investment trust
              founded in 1979) represent separate entities whose zero-revenue SPAC disclosures or REIT property
              reorganizations must not be attributed to the private AI infrastructure company.
