  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Modular Edge Infrastructure & Product Suite Definition
        blocks:
          - type: paragraph
            body: >-
              Armada addresses the growing compute deficit at the tactical and industrial edge by packaging complete
              data center infrastructure into deployable, ruggedized modular systems. Rather than relying on multi-year
              centralized hyperscale construction, the Armada Edge Platform integrates four distinct operational
              products: Galleon modular data centers, Bridge sovereign cloud orchestration, Atlas remote fleet
              operations, and the Marketplace application ecosystem. Galleon provides the ruggedized physical compute
              hulls built for extreme environments, ranging from compact tactical units transportable by standard
              military cargo aircraft to high-density multi-megawatt facilities. Bridge operates as a sovereign AI cloud
              layer that exposes GPU-as-a-Service capabilities while strictly enforcing local perimeter data isolation.
              Complementing this core infrastructure, Atlas serves as a centralized network operations center providing
              real-time telemetry, asset monitoring, and operational observability across widely distributed edge nodes,
              while Marketplace facilitates procurement of certified edge-ready hardware and domain-specific AI models.
              Together, these products offer an integrated operational model for enterprise and defense organizations
              requiring immediate, high-performance compute in disconnected or sovereign theaters.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
