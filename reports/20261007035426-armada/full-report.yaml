      - number: '5.2'
        title: Technical Architecture, Distributed Storage & Thermal Engineering
        blocks:
          - type: paragraph
            body: >-
              Under the hood, Armada decouples compute orchestration from public hyperscaler connectivity through a
              resilient, air-gapped software and hardware stack. At the container and cluster tier, the platform
              orchestrates workloads using standard Kubernetes runtimes paired with a Rook Ceph distributed storage
              cluster. This design supplies high-performance Ceph RBD block devices and CephFS shared file storage
              locally across edge nodes without cloud round-trips. For enterprise customers requiring cloud operating
              consistency, Armada validates Microsoft Azure Local and Foundry Local directly within Galleon hulls,
              enabling local inference and analytics while maintaining strict compliance boundaries. High-density AI
              workloads are supported through specialized partnerships, including integration with the VAST DataSpace
              global namespace to synchronize training datasets across distributed edge and core data factories.
              However, operating dense GPU clusters in confined modular enclosures introduces severe thermal engineering
              challenges. To support the 2.2 MW Leviathan MDC housing 576 GPUs, Armada relies on custom liquid-first
              cooling loops, coolant distribution units (CDUs), fluid manifolds, and hydraulic controls. Engineering
              recruitment highlights ongoing development in closed-loop glycol distribution and leak-detection systems,
              representing a mission-critical failure domain where thermal or mechanical failure immediately jeopardizes
              edge node availability.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
      - number: '5.3'
        title: Operational Workflows, Mission Profiles & Tactical Deployments
        blocks:
          - type: paragraph
            body: >-
              The primary economic and operational justification for Armada is the total elimination of cloud backhaul
              bottlenecks in degraded, intermittent, and latent network environments. In conventional remote monitoring
              workflows, such as infrastructure surveying or border surveillance, high-resolution imagery and sensor
              telemetry are trapped on offline storage media or constrained by low-bandwidth satellite links, delaying
              mission-critical analysis by days. Deploying Galleon Cruiser or Triton units on-site enables local
              computer vision models to perform real-time automated feature extraction and hazard mitigation within
              seconds. For defense operators, Galleon modular units provide forward-deployed, air-gapped processing
              designed to function autonomously under full network denial without phoning home. Furthermore, while
              traditional brick-and-mortar data center construction regularly requires 24 months of permitting, utility
              interconnect delays, and civil engineering, Armada markets Galleon deployments within weeks. Nevertheless,
              deploying modular data centers in austere environments introduces distinct field limitations: units
              require reliable on-site prime power generation, fuel logistics, physical perimeter security, and
              certified heavy-lift transport access, shifting operational risk from software availability to rugged
              field logistics.
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Security Accreditation, Differentiation & Technical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Armada differentiates its product portfolio through a convergence of military-grade physical packaging,
              sovereign data isolation, and deep strategic ecosystem alliances. In the defense vertical, Armada
              positions Galleon form factors as accreditable to ICD 705 and Special Access Program Facility (SAPF)
              standards, designed to meet the rigorous physical and emanations security requirements of classified
              operations. Its validated integrations with Microsoft Azure Local and VAST Data create defensible
              ecosystem moats that pure containerized hardware manufacturers cannot easily duplicate. Despite these
              technical strengths, diligence reveals material technical and operational risks. First, while Galleon
              hardware is marketed as accreditable, public documentation does not provide definitive evidence of
              finalized program-specific authority to operate (ATO) accreditations across deployed units. Second,
              Armada's high-density Leviathan platform depends on complex liquid cooling distribution units and
              specialized component supply chains that face single-point-of-failure vulnerabilities in austere
              deployments. Third, developer access remains highly controlled, with administrative integration guides and
              documentation gated behind partner authentication, limiting independent verification of platform
              stability, API ergonomics, and third-party developer momentum.
            claimRefs:
              - CE002
              - CE004
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Validated Hybrid Cloud Architecture for Sovereign AI
            body: >-
              Strategic co-engineering with Microsoft Azure Local and VAST Data elevates Galleon from a bare modular
              container into a fully validated sovereign AI cloud platform capable of operating in air-gapped
              environments without sacrificing hyperscaler software workflows.
            calloutType: strength
            claimRefs:
              - CE002
              - CE009
              - CE010
          - type: callout
            title: Single-Point Failure Modes in Austere Liquid Cooling
            body: >-
              High-density 2.2 MW Leviathan deployments introduce complex fluid distribution, pump staging, and CDU
              reliability dependencies, where mechanical or manifold failures in remote theaters pose severe hardware
              damage and thermal outage risks.
            calloutType: risk
            claimRefs:
              - CE004
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >
              Armada positions its full-stack edge infrastructure platform across capital-intensive industries where
              operations occur beyond reliable terrestrial telecommunications and traditional hyperscale cloud data
              center reach. The company targets enterprise infrastructure buyers, operational technology leads, and
              public defense commands requiring real-time compute, satellite backhaul, and local inference capabilities
              directly where data is generated. Primary targeted sectors include oil and gas, national defense, state
              and local infrastructure, mining, manufacturing, and telecommunications.


              Buyer dynamics vary sharply across commercial and public sectors. In commercial verticals like energy and
              mining, procurement is typically championed by operational technology (OT) directors, field engineering
              leads, and enterprise CIOs aiming to reduce non-production days and automate hazardous drilling or
              extraction procedures. Conversely, defense and public-sector deployments involve complex government
              procurement channels, mission-command evaluation, and strict security compliance accreditations.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Production Deployments
        blocks:
          - type: paragraph
            body: >
              Armada has exhibited rapid commercial adoption since its founding, progressing from early proof-of-concept
              units to enterprise and defense production deployments within two years of commercialization. The platform
              reports over 2,000 enterprise users and 30,000 connected edge assets operating across more than 100
              countries globally, reflecting widespread deployment of its Commander and Atlas fleet management software
              layer.


              Operational scale is anchored by deployment of ruggedized modular Galleon edge data centers. These modular
              units, deployable in under 60 days compared to typical 24-month construction cycles for traditional
              facilities, allow customers to incrementally scale compute from single-kilowatt field configurations to
              multi-megawatt edge campuses. Notably, industrial users integrate Armada’s edge compute directly with
              Microsoft Azure Local, Azure Arc, and OpenAI frontier models to execute low-latency inferencing without
              public backhaul dependency.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
              - CU007
              - CU013
      - number: '6.3'
        title: Named Customer Proof and Reference Quality
        blocks:
          - type: paragraph
            body: >
              Verified customer deployments demonstrate multi-vertical adoption across premier enterprise and public
              sector accounts. High-profile named users include Alaska Department of Transportation and Public
              Facilities (DOT&PF), the U.S. Navy, Aramco Digital, Targa Resources, Atlas Energy, SQM, Mars, Marriott,
              Tampnet, and Vocus. These engagements demonstrate production utilization across harsh environments ranging
              from sub-arctic disaster monitoring to offshore energy rigs.


              For the Alaska DOT&PF, Armada deployed edge compute and satellite connectivity to process real-time aerial
              drone imagery for avalanche, landslide, and flood monitoring along remote transit corridors, eliminating
              historical multi-day cloud upload bottlenecks. In the defense vertical, the U.S. Navy utilizes ruggedized
              edge hardware and software for tactical situational awareness. In the energy sector, Aramco Digital
              entered an eight-month accelerated commercial agreement to deploy distributed cloud Galleon units and
              Microsoft Azure technologies across industrial facilities in Saudi Arabia.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Commercial Vulnerabilities
        blocks:
          - type: paragraph
            body: >
              Despite rapid early adoption across marquee enterprises, Armada’s commercial model exhibits significant
              structural diligence gaps. Public disclosures do not provide verified figures for Net Revenue Retention
              (NRR), Gross Revenue Retention (GRR), annual churn rates, or average contract length. Commercial expansion
              relies on land-and-expand dynamics—moving from software monitoring via Atlas to physical Galleon data
              center deployments and Bridge GPU-as-a-Service orchestration.


              Customer concentration poses a material risk. Major flagship agreements, particularly with Aramco Digital
              and the U.S. Navy, represent a substantial proportion of deployed hardware and forward revenue
              commitments. Furthermore, the company’s dependency on Starlink low-Earth orbit satellite terminals and
              Microsoft Azure ecosystem distribution creates procurement and platform co-dependence. Diligence must
              establish formal revenue breakdowns by account and verify pilot-to-production conversion rates.
              Additionally, while threat actor Spirals published unconfirmed extortion claims targeting an entity named
              Armada Credit Bureau in September 2026, verification confirms that the victim is an unrelated Ugandan
              credit analytics bureau rather than Armada the edge computing company.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Industrial Cloud Wedge
            body: >-
              Armada’s strategic success with marquee industrial and defense buyers stems from addressing operational
              physics rather than enterprise software convenience. By co-locating modular data centers (Galleons) with
              Starlink terminals and Azure Local software, Armada captures customers whose raw telemetry cannot
              physically be backhauled to centralized hyperscale clouds due to extreme bandwidth limits and national
              sovereignty laws.
            calloutType: insight
            claimRefs:
              - CU002
              - CU007
              - CU011
          - type: callout
            title: Retention Opacity and Sovereign Concentration
            body: >-
              While customer additions like Aramco Digital and the U.S. Navy validate technological performance, the
              absence of public NRR, gross churn rates, and account-level revenue shares leaves investor visibility
              impaired. A high proportion of early revenue is tied to sovereign-scale multi-unit deployments that carry
              extended procurement cycles and geopolitical dependencies.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Architecture and Heatmap
        blocks:
          - type: paragraph
            body: >-
              Evaluating Armada requires disaggregating software scalability from the heavy physical and geopolitical
              constraints of distributed edge infrastructure. The company's core value proposition—deploying ruggedized
              modular data centers such as Galleon and Leviathan across remote maritime, defense, mining, and oil
              operations—introduces physical failure modes fundamentally distinct from conventional multi-tenant
              hyperscalers. Residual risk is concentrated in capital intensity, key component access, sovereign
              regulatory fragmentation, and ambiguous corporate identity markers in public disclosure records.
              Monitoring triggers must focus on GPU allocation continuity, modular unit manufacturing yields, and formal
              third-party compliance audits rather than unverified commercial bookings.
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR013
      - number: '7.2'
        title: Regulatory, Legal, and Sovereign Jurisdictional Exposure
        blocks:
          - type: paragraph
            body: >-
              Armada operates at the intersection of sovereign data governance, telecommunications licensing, and
              defense procurement regulations. Delivering sovereign AI compute to disconnected locations necessitates
              compliance with regional data residency mandates, cross-border cryptographic controls, and national
              security procurement standards across more than 100 targeted jurisdictions. Public legal filings and
              regulatory audit reports for Armada's corporate entity remain opaque in public channels, necessitating
              comprehensive counsel-grade discovery on export control compliance, IP ownership, and defense trade
              authorizations. Diligence must rigorously separate the edge compute startup Armada from unrelated legal
              entities operating under identical trade names.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR006
      - number: '7.3'
        title: Operational, Manufacturing, and Security Failure Modes
        blocks:
          - type: paragraph
            body: >-
              The operational footprint of ruggedized edge computing entails extreme thermal, mechanical, and logistical
              vulnerability. Fielded units operating in offshore oil rigs, tactical military zones, and mining
              operations face severe environmental degradation, power volatility, and maintenance access barriers.
              Furthermore, threat intelligence feeds in September 2026 surfaced ransomware extortion listings by threat
              group Spirals referencing an entity named Armada Credit Bureau; while threat telemetry confirms that
              specific disclosure targets a distinct licensed credit bureau in Uganda rather than the edge
              infrastructure startup, it underscores the systemic reputational and reconnaissance risks arising from
              brand confusion during cyber extortion campaigns.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR010
      - number: '7.4'
        title: Critical Partner, Supplier, and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Armada exhibits structural dependencies on a concentrated set of upstream hardware, satellite networking,
              and hyperscale software partners. High-density GPU compute modules, specialized liquid cooling
              distribution, and Starlink or satellite backhaul represent critical single points of failure that can halt
              edge deployments if supply chains tighten or partner terms deteriorate. While alliance agreements in
              industrial and defense contracting illustrate strategic execution, hardware manufacturing capacity and
              balance-sheet liquidity for physical inventory buffers remain unverified in public disclosures, posing
              thesis-breaking risks if deployment milestones slip.
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
      - number: '7.5'
        title: Financial Model Vulnerabilities and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The financial profile of modular edge compute combines the working capital drag of hardware fabrication
              with the long sales cycles of sovereign defense and heavy industrial enterprise buyers. Without public
              transparency into unit-level gross margins, hardware depreciation schedules, inventory financing
              mechanisms, or warranty reserves, residual exposure remains high. Thesis-break triggers include prolonged
              regulatory export moratoriums, significant factory buildout yield delays, critical satellite bandwidth
              throttling, and persistent customer concentration where early anchor pilots fail to transition into
              cash-generative multi-unit deployments.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Supply-Chain Asymmetry Threaten Edge Economics
            body: >-
              Unlike pure-play software ventures that can scale with minimal incremental cost of goods, Armada must fund
              complex hardware engineering, thermal management, liquid cooling, and precision assembly of heavy modular
              units like Galleon and Leviathan. Hardware supply chain bottlenecks, component price volatility, and
              unhedged working capital requirements could severely constrain deployment velocity even amid strong market
              interest.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Armada's equity financing narrative centers on its May 2026 Series B round, where third-party venture
              tracking databases and news reports record a $230M raise at a $2B pre-money valuation. This pricing
              framework implies a post-money valuation of approximately $2.23B and indicates that incoming investors
              acquired roughly 10.3% of post-financing equity. Total disclosed cumulative equity funding across
              historical rounds sits between $401M and $457M depending on data aggregator coverage, reflecting
              substantial institutional capital commitment from lead investors including Overmatch, 8090 Industries, and
              BlackRock alongside strategics such as Johnson Controls.


              However, disciplined investment underwriting requires drawing a strict demarcation between headline
              financing metrics and verifiable operational economics. Cumulative funding raised measures past capital
              consumed, not liquid cash available on the balance sheet, cash runway, or operational burn rate.
              Similarly, a $2B pre-money valuation mark represents a negotiated private pricing agreement rather than
              intrinsic enterprise value validated by fundamental cash flows. In the complete absence of audited public
              disclosures regarding recognized revenue, recurring software ARR, gross margins, or factory capital
              expenditure obligations for Galleon Forge One, the reported price tag must be treated as pricing strategic
              option value on sovereign edge infrastructure rather than an economically proven business.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Investment Thesis, Anti-Thesis, and Adverse Diligence
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Armada rests on category creation in deploy-anywhere sovereign modular edge
              compute. As enterprise and defense workloads increasingly encounter grid power bottlenecks and
              communication latency in remote or austere environments, Armada's modular Galleon units and Leviathan
              megawatt-scale architectures offer deployability measured in days or weeks rather than the multi-year
              permitting cycles required for traditional hyperscale facilities. Supported by official claims of 100+
              countries, 2,000+ enterprise users, and 30,000+ connected assets managed via Atlas, bull investors
              anticipate high-margin recurring software and orchestration revenue layered atop physical ruggedized
              hardware.


              Conversely, the anti-thesis highlights severe execution and economic concentration risks. Modular edge
              data centers carry heavy industrial and working capital burdens, where revenue recognition may lag
              bookings and factory throughput at Galleon Forge One remains unproven publicly. Furthermore, adverse
              entity disambiguation reveals that third-party threat intelligence platforms (Darkfield, Recent Breaches,
              and GalaxyWarden) documented a September 2026 ransomware extortion listing by the Spirals group against
              Armada Credit Bureau Limited in Uganda. While diligence confirms this target is an unrelated African
              financial bureau sharing only the 'Armada' brand name, it demonstrates that edge infrastructure providers
              operating across defense and critical industrial verticals face heightened cyber threat surfaces requiring
              verified third-party accreditation and rigorous audit verification before capital deployment.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario Valuation Modeling and Research-More Recommendation
        blocks:
          - type: paragraph
            body: >-
              Given that recognized revenue, recurring contract ARR, and unit margins are completely undisclosed
              publicly, constructing a traditional DCF or revenue-multiple model would constitute unwarranted false
              precision. Instead, we establish a milestone-banded scenario framework evaluating fair enterprise value
              across three operating trajectories. In the Base Case ($1.8B-$2.3B fair value), Galleon and Leviathan
              deployments scale steadily, manufacturing throughput at Galleon Forge One meets initial production
              schedules, and software orchestration begins generating measurable recurring gross profit, justifying
              current post-money entry levels.


              In the Bear Case ($1.0B-$1.5B fair value), working capital requirements escalate, factory ramp schedules
              slip, power interconnection or site readiness delays customer rollouts, and lack of recurring software
              attach forces market re-rating toward lower-margin industrial equipment multiples. In the Bull Case
              ($3.0B-$4.5B fair value), sovereign defense and industrial adoption expands into standardized global
              deployments, generating high-retention software revenue and proving robust customer diversification.
              Weighing these asymmetric operating distributions against absent financial disclosures leads to a
              definitive recommendation of research-more with high risk and a stretched valuation stance, requiring
              explicit verification of the revenue-bookings bridge, gross margins, and liquidation preferences before
              investment commitment.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline and Private Diligence Prerequisite
            body: >-
              Armada's $2.0B pre-money valuation reflects aggressive capital pricing for sovereign AI edge
              infrastructure. Until prospective investors verify recognized revenue conversion from bookings, factory
              capital requirements, and liquidation preference seniority, commitments should remain paused under a
              research-more designation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
