chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              Armada develops full-stack edge computing and sovereign AI infrastructure designed to process high-compute
              workloads in remote, bandwidth-constrained, and sovereign industrial environments. Originally
              conceptualized in Boston in 2016 by co-founders Marc Held and Jon Runyan, the enterprise transitioned into
              a commercial operational entity based in San Francisco under Chief Executive Officer Dan Wright. The
              company's organizational governance exhibits pronounced key-person dependence on Wright for corporate
              capitalization, strategic technology partnerships, and commercial narrative, alongside Runyan for
              operational logistics, manufacturing coordination, and distributed edge deployment. While early
              foundational contributions are attributed to Held, active executive leadership remains concentrated in
              Wright and Runyan as the business transitions from prototype edge hardware to factory-scale production. As
              detailed in the accompanying leadership and founder mapping, institutionalizing engineering leadership and
              establishing independent board oversight remain critical governance milestones as headcount expands across
              multiple operational facilities.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: Financing History, Valuation, and Stakeholder Governance
        blocks:
          - type: paragraph
            body: >-
              Armada's capitalization trajectory reflects rapid valuation expansion driven by accelerating enterprise
              and sovereign interest in distributed AI infrastructure. In May 2026, the company announced an
              oversubscribed $230 million Series B extension round at a pre-money valuation of $2.0 billion, increasing
              cumulative equity capital raised to approximately $457 million across five funding rounds. The
              institutional investor syndicate is anchored by premier frontier technology and venture capital firms,
              including Founders Fund, Lux Capital, Shield Capital, and Microsoft's venture fund M12, which led the
              firm's Series A in July 2024. Beyond equity capitalization, Armada has established critical industrial and
              commercial alliances, most notably a landmark manufacturing framework agreement with Johnson Controls to
              construct Galleon modular data centers at a dedicated factory in Arizona. Furthermore, sovereign
              go-to-market distribution is reinforced through strategic technology collaborations with Microsoft Azure
              Local and Palantir Technologies, positioning Armada as an infrastructure layer for localized AI
              deployments.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Operating Scale, Commercial Metrics, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Armada's operating footprint has scaled aggressively in parallel with its capital intake, expanding from
              early field testing into multi-unit international deployments. Official corporate disclosures report
              platform reach across more than 100 countries, 2,000 enterprise users, and over 30,000 connected
              operational assets managed via the Atlas virtual network operations center. Headcount tracking reflects
              substantial organizational growth, expanding from 368 personnel in late 2025 to 666 employees by August
              2026. However, fundamental financial metrics remain strictly private. While third-party estimates from
              GetLatka suggest an annualized revenue run-rate of approximately $83.2 million ARR for 2025, Armada has
              not publicly disclosed audited recognized GAAP revenue, gross margins, EBITDA, operating cash burn, or its
              bookings-to-revenue conversion timeline. Rigorous investor diligence must distinguish between non-binding
              manufacturing commitments, forward pipeline bookings, and actual recognized recurring software or
              infrastructure revenue.
