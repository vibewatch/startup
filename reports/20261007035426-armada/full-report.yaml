      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Private Estimates
        blocks:
          - type: paragraph
            body: >-
              Estimating the serviceable market for sovereign edge AI requires navigating severe data asymmetry.
              Private-market SaaS data aggregators estimate Armada's annual recurring revenue at $83.2M as of September
              2025 with an estimated headcount of 368 employees, yet this revenue figure is third-party modeled rather
              than company-audited or SEC-filed. Armada's self-reported commercial milestones claim rapid operational
              expansion across more than 60 countries and management of thousands of Starlink terminals via Commander
              Connect, alongside customer commitments spanning defense, energy, and transportation. Market demand is
              driven by the operational imperative to process massive sensor and drone telemetry locally where backhaul
              latency or bandwidth costs prevent centralized cloud streaming. However, capital intensity, long
              enterprise procurement cycles, and unverified vendor scale introduce substantial sizing caveats that
              prevent standard bottom-up TAM verification [CM005] [CM006] [CM007] [CM008].
