  topStrengths:
    - Integrated sovereign-edge platform across data centers, connectivity management, and GPU orchestration.
    - Verified deployment and customer proof from major public-sector and industrial reference accounts.
    - Strong capital and partner base, including a large Series B and industrial manufacturing support.
  topRisks:
    - Recognized revenue, ARR, margins, burn, and runway remain undisclosed.
