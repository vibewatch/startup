schemaVersion: "report-v2"
artifact: "financials"
slug: "armada"
runDate: "2026-10-07"
company:
  name: "Armada"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Armada exposes several plausible monetization surfaces across software, modular
    infrastructure, managed GPU capacity, and procurement, but public evidence does
    not disclose realized pricing, recognized revenue, gross margin, burn, runway, or
    cash availability. Reported funding is substantial but inconsistent across
    third-party sources and cannot substitute for an operating or liquidity model.
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is broader than the disclosed revenue model"
    body: >-
      Armada presents one platform with four products: Atlas, Galleon, Bridge, and
      Marketplace. That product map creates several plausible economic motions, but
      only one retained third-party source labels the overall model as subscription.
      Atlas can support recurring software revenue; Galleon may introduce equipment,
      deployment, and support economics; Bridge is positioned as GPU-as-a-Service;
      and Marketplace is a procurement surface whose commission or resale structure
      is not disclosed. The resulting underwriting view is therefore a hybrid-model
      hypothesis, not a verified revenue mix. No retained source supplies contract
      units, revenue-recognition policies, mix by product, or a bridge from customer
      activity to recognized revenue and gross profit.
    claimRefs: ["CI001", "CI005", "CI006", "CI013"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "pricing-and-traction"
    title: "Free entry points reveal acquisition tactics, not realized pricing"
    body: >-
      The official site offers self-serve Atlas onboarding, a free Bridge trial on
      Armada-hosted infrastructure, and a Galleon demonstration. These are observable
      acquisition paths, but none establishes list pricing, realized contract value,
      discounts, contract duration, implementation fees, or channel economics. The
      same site claims more than 2,000 enterprise users and more than 30,000 connected
      assets. Those figures indicate platform activity, yet their denominator,
      measurement date, paying status, customer concentration, and relationship to
      revenue are not defined. They should not be treated as customer count, ARR,
      utilization, or retention evidence without a billing and cohort reconciliation.
    claimRefs: ["CI002", "CI003", "CI004", "CI007", "CI008"]
    tableRefs: ["TI002"]
  - id: "economics-and-capital"
    title: "Funding does not resolve unit economics or capital adequacy"
    body: >-
      Third-party funding totals diverge: Multiples reports $469 million across five
      rounds, while IPO CLUB says about $460 million after the May 2026 Series B.
      Both support the conclusion that Armada has raised substantial capital, but
      neither reports cash on hand, restricted cash, debt, project-finance
      obligations, monthly burn, committed capital expenditure, or runway. Armada's
      physical deployment model also creates plausible manufacturing, logistics,
      installation, power, cooling, and field-support cost exposure, but responsibility
      for those costs is not public. Funding raised is therefore neither cash
      available nor proof that future deployments are fully financed.
    claimRefs: ["CI009", "CI010", "CI012", "CI014", "CI016"]
    tableRefs: ["TI003"]
  - id: "financial-verdict"
    title: "Financial verdict: attractive surfaces, insufficient underwriting inputs"
    body: >-
      Public evidence supports a potentially diversified revenue architecture and
      shows recent financing capacity, but it does not support a judgment on revenue
      quality, contribution margin, sales efficiency, working-capital intensity, or
      runway. UpMarket's warning that Armada pre-IPO exposure is illiquid and
      speculative reinforces the information and exit-risk discount appropriate to a
      private security; it is not evidence about operating losses. Source hygiene is
      also material: four assigned results concern Armada Investment or Armada Credit
      Bureau rather than the target company and must not be used as company evidence.
      The investable conclusion remains diligence-dependent until management supplies
      financial statements, contract cohorts, deployment-level margins, cash, burn,
      and financing commitments.
    claimRefs: ["CI011", "CI012", "CI015", "CI016"]
tables:
  - id: "TI001"
    title: "Revenue streams and underwriting status"
    columns: ["Stream", "Mechanism", "Unit", "Current evidence", "Revenue quality", "Diligence ask"]
    rows:
      - ["Atlas", "Edge-fleet management software", "Undisclosed subscription or contract unit", "Free self-serve onboarding is offered", "Recurring potential; realized pricing unverified", "Provide billed accounts, ACV, renewal, retention, and support cost by cohort"]
      - ["Galleon", "Ruggedized compute infrastructure and deployment", "Sale, lease, capacity, or service unit not disclosed", "Demo-led motion; deployment in weeks is company-claimed", "Potentially project-based and capital intensive", "Provide contract form, bill of materials, installation cost, warranty, and deployment margin"]
      - ["Bridge", "Managed GPU-as-a-Service layer", "GPU-hour, capacity reservation, or managed-service unit not disclosed", "Free trial on Armada-hosted infrastructure is offered", "Recurring or consumption potential; utilization unknown", "Provide metering basis, booked capacity, utilization, cloud cost, and gross margin"]
      - ["Marketplace", "Procurement of hardware, connectivity, and AI applications", "Take rate, resale margin, or referral fee not disclosed", "Official ecosystem description only", "Asset-light potential; economics unverified", "Provide GMV, net revenue treatment, take rate, refunds, and supplier terms"]
      - ["Integrated AEP", "Cross-product platform contract", "Bundle, site, asset, user, or capacity unit not disclosed", "Third party classifies the company model as subscription", "Potential expansion revenue; mix and recognition unknown", "Provide product revenue mix, performance obligations, deferred revenue, and cross-sell cohorts"]
    notes: "Mechanisms are based on current official product descriptions and a third-party subscription classification; no row is a disclosed revenue mix, realized price, or accounting policy."
    claimRefs: ["CI001", "CI005", "CI006", "CI013"]
  - id: "TI002"
    title: "Observed acquisition offers versus missing pricing evidence"
    columns: ["Offering", "Observed offer", "List price / unit / contract", "Realized pricing", "Discounts and unknowns", "Source basis"]
    rows:
      - ["Atlas", "Free self-serve onboarding", null, null, "Paid conversion, user or asset unit, minimums, tiers, and discounting are undisclosed", "Armada official site"]
      - ["Galleon", "Book a deployment demonstration", null, null, "Equipment ownership, installation fees, services, term, financing, and warranty treatment are undisclosed", "Armada official site"]
      - ["Bridge", "Free trial on Armada-hosted infrastructure", null, null, "Trial limits, GPU type, consumption rate, reservation terms, and cloud pass-through are undisclosed", "Armada official site"]
      - ["Armada Edge Platform", "Four-product integrated platform", null, null, "Bundle rules, enterprise commitments, partner margins, and revenue allocation are undisclosed", "Armada official site and Multiples model classification"]
    notes: "Null means the successful assigned sources provide no public price, unit, contract term, realized rate, or discount schedule; free access is an acquisition offer, not evidence of paid pricing."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI006"]
  - id: "TI003"
    title: "Unit economics and capital-adequacy diligence matrix"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Specific diligence request"]
    rows:
      - ["Recognized revenue and product mix", null, "Low", "Establishes scale and the balance of recurring versus project revenue", "Provide monthly GAAP revenue for 24 months by Atlas, Galleon, Bridge, Marketplace, and services"]
      - ["ARR, bookings, and backlog conversion", null, "Low", "Tests recurrence, implementation timing, and revenue visibility", "Provide ARR definition, contracted backlog, cancellations, deployment milestones, and recognition bridge"]
      - ["Gross and contribution margin", null, "Low", "Separates software leverage from hardware, cloud, installation, and support costs", "Provide gross margin by product plus deployment-level contribution margin and allocation policy"]
      - ["CAC, sales cycle, and payback", null, "Low", "Tests whether enterprise and government acquisition costs can scale", "Provide fully loaded CAC, median sales cycle, win rate, channel fees, and cohort payback"]
      - ["Cash, burn, and runway", null, "Low", "Determines financing dependency and next-round timing", "Provide bank statements, restricted cash, monthly net burn, budget variance, and base/downside runway"]
      - ["Working capital and capex responsibility", null, "Low", "Shows who finances inventory, factories, customer deployment, and receivables", "Provide inventory turns, deposits, payment terms, capex commitments, and customer or partner financing splits"]
      - ["Debt and project-finance obligations", null, "Low", "Debt covenants or deployment financing can constrain liquidity despite equity funding", "Provide debt schedule, leases, liens, guarantees, covenants, and project-finance commitments"]
    notes: "All values are null because the successful assigned sources disclose no operating financial statements or unit-economics schedule; each null is paired with the evidence needed to close it."
    claimRefs: ["CI009", "CI010", "CI012", "CI014", "CI016"]
