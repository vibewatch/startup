        - { id: "selection", label: "Product selection", detail: "Customer selects software management, modular infrastructure, managed GPU capacity, procurement, or a bundle." }
        - { id: "deployment", label: "Deployment", detail: "Galleon deployment is company-claimed in weeks; implementation scope and cost allocation are undisclosed." }
        - { id: "activity", label: "Customer activity", detail: "Armada claims 2,000+ enterprise users and 30,000+ connected assets, without paid-user or cohort definitions." }
        - { id: "revenue", label: "Recognized revenue", detail: "Subscription is reported by one third party, but billing units, product mix, contract terms, and recognition policy are unavailable." }
        - { id: "gross-profit", label: "Gross profit and cash", detail: "Hardware, cloud, partner, installation, support, working-capital, and capex effects are not publicly quantified." }
    approximationNotes: "This is a qualitative mechanism map, not a quantified funnel or financial forecast; no conversion rate, revenue amount, margin, or cash yield is implied."
    claimRefs: ["CI002", "CI003", "CI004", "CI007", "CI008", "CI013", "CI016"]
callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: "Reported cumulative funding does not establish current cash, burn, debt, committed capex, or remaining runway; management evidence is required before underwriting capital adequacy."
    claimRefs: ["CI009", "CI010", "CI012", "CI016"]
  - calloutType: "recommendation"
    title: "Gate the next diligence step on a financial data room"
    body: "Request audited or reviewed statements, monthly management accounts, contract cohorts, deployment-level margins, cash and debt schedules, and a downside financing plan before assigning revenue or margin multiples."
    claimRefs: ["CI012", "CI014", "CI016"]
