chapter:
  number: 1
  title: "Company Overview"
  summary: "Armada is an edge computing and sovereign AI infrastructure company providing ruggedized modular data centers, satellite connectivity management, and distributed GPU orchestration software. Founded by Marc Held and Jon Runyan and operating under Chief Executive Officer Dan Wright, the company has raised over $457 million in venture funding, highlighted by an oversubscribed $230 million Series B extension in May 2026 at a $2.0 billion pre-money valuation alongside an industrial manufacturing agreement with Johnson Controls."
sections:
  - id: "corporate-identity-leadership"
    title: "Corporate Identity, Mission, and Executive Leadership"
    body: "Armada develops full-stack edge computing and sovereign AI infrastructure designed to process high-compute workloads in remote, bandwidth-constrained, and sovereign industrial environments. Originally conceptualized in Boston in 2016 by co-founders Marc Held and Jon Runyan, the enterprise transitioned into a commercial operational entity based in San Francisco under Chief Executive Officer Dan Wright. The company's organizational governance exhibits pronounced key-person dependence on Wright for corporate capitalization, strategic technology partnerships, and commercial narrative, alongside Runyan for operational logistics, manufacturing coordination, and distributed edge deployment. While early foundational contributions are attributed to Held, active executive leadership remains concentrated in Wright and Runyan as the business transitions from prototype edge hardware to factory-scale production. As detailed in the accompanying leadership and founder mapping, institutionalizing engineering leadership and establishing independent board oversight remain critical governance milestones as headcount expands across multiple operational facilities."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
  - id: "capitalization-investors"
    title: "Financing History, Valuation, and Stakeholder Governance"
    body: "Armada's capitalization trajectory reflects rapid valuation expansion driven by accelerating enterprise and sovereign interest in distributed AI infrastructure. In May 2026, the company announced an oversubscribed $230 million Series B extension round at a pre-money valuation of $2.0 billion, increasing cumulative equity capital raised to approximately $457 million across five funding rounds. The institutional investor syndicate is anchored by premier frontier technology and venture capital firms, including Founders Fund, Lux Capital, Shield Capital, and Microsoft's venture fund M12, which led the firm's Series A in July 2024. Beyond equity capitalization, Armada has established critical industrial and commercial alliances, most notably a landmark manufacturing framework agreement with Johnson Controls to construct Galleon modular data centers at a dedicated factory in Arizona. Furthermore, sovereign go-to-market distribution is reinforced through strategic technology collaborations with Microsoft Azure Local and Palantir Technologies, positioning Armada as an infrastructure layer for localized AI deployments."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "operating-scale-financials"
    title: "Operating Scale, Commercial Metrics, and Diligence Realities"
    body: "Armada's operating footprint has scaled aggressively in parallel with its capital intake, expanding from early field testing into multi-unit international deployments. Official corporate disclosures report platform reach across more than 100 countries, 2,000 enterprise users, and over 30,000 connected operational assets managed via the Atlas virtual network operations center. Headcount tracking reflects substantial organizational growth, expanding from 368 personnel in late 2025 to 666 employees by August 2026. However, fundamental financial metrics remain strictly private. While third-party estimates from GetLatka suggest an annualized revenue run-rate of approximately $83.2 million ARR for 2025, Armada has not publicly disclosed audited recognized GAAP revenue, gross margins, EBITDA, operating cash burn, or its bookings-to-revenue conversion timeline. Rigorous investor diligence must distinguish between non-binding manufacturing commitments, forward pipeline bookings, and actual recognized recurring software or infrastructure revenue."
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "milestones-risk-disambiguation"
    title: "Chronological Milestones and Legal Entity Disambiguation"
    body: "The chronological trajectory of Armada illustrates an accelerated transition from modular edge hardware prototypes to gigawatt-scale sovereign infrastructure partnerships. Material 2026 milestones include the integration of NVIDIA AI Grid capabilities for telecommunications carriers in March, the launch of the 10-megawatt Orion Galleon modular data center in August, and securing a multi-unit Leviathan MDC order from Nordic operator Fossefall. Concurrently, diligence requires rigorous legal entity disambiguation to avoid conflating Armada Inc with unrelated entities sharing the corporate name. Specifically, in September 2026, the Spirals ransomware extortion syndicate posted an unconfirmed claim targeting 'Armada Credit Bureau'—a licensed credit reporting firm legally distinct from Armada Inc. Similarly, public filings for Armada Acquisition Corp III (a NASDAQ blank-check SPAC) and Armada Hoffler (a real estate investment trust founded in 1979) represent separate entities whose zero-revenue SPAC disclosures or REIT property reorganizations must not be attributed to the private AI infrastructure company."
    claimRefs:
      - "CO005"
      - "CO008"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
