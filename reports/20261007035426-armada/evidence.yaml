evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming recognized GAAP revenue, ARR, gross margin, cash burn, and
      bookings-to-revenue conversion schedule.
    whyItMatters: >-
      Third-party estimates such as Latka's $83.2M ARR figure cannot be validated without audited financial disclosures,
      leaving fundamental valuation multiples unverified.
    diligencePath: >-
      Request company management presentation, audited financial statements for FY2024-FY2025, and trailing twelve-month
      revenue-recognition bridge under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
