      transaction records.
    whyItMatters: >-
      Public disclosure reveals key executive leaders and lead institutional investors but omits board composition,
      protective provisions, and key-person retention agreements.
    diligencePath: >-
      Review certificate of incorporation, investors' rights agreement, voting agreement, and key-person life insurance
      documentation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
