chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Armada publicly positions an integrated edge stack spanning fleet operations,
    ruggedized compute, sovereign GPU orchestration, and procurement, with deployment
    speed and control as its clearest claimed differentiators. The assigned evidence
    does not support a reliable named-peer ranking, independent capability benchmark,
    or realized-price comparison, so competitive durability remains a material
    diligence gap.
sections:
  - id: "landscape-boundary"
    title: "Landscape boundary and available proof"
    body: >-
      The defensible competitive frame is broader than a list of edge-computing
      startups. Armada presents a four-part platform that combines Atlas fleet
      operations, Galleon ruggedized infrastructure, Bridge sovereign GPU
      orchestration, and Marketplace procurement. That scope implies competition
      from integrated edge platforms, traditional data-center construction, internal
      integration, hyperscaler edge extensions, point hardware, and connectivity-only
      suppliers. However, the assigned pool contains no usable, company-specific
      evidence for named direct peers, incumbent scale, competitor funding, or
      competitor pricing. Six of the eight retained sources are unrelated Nissan
      Armada vehicle pages. The profile table therefore separates Armada's supported
      public positioning from alternative classes that still require primary or
      independent verification, rather than presenting unsupported vendors as
      measured peers.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "capability-differentiation"
    title: "Capability differentiation is broad but self-reported"
    body: >-
      Armada's strongest public differentiation claim is operational compression:
      its site contrasts a sixty-day Galleon deployment with a twenty-four-month
      traditional data-center construction average. The company also says customers
      can begin with one edge deployment, scale with operational demand, and retain
      sovereignty over where data remains and who can access it. Atlas, Galleon,
      Bridge, and Marketplace cover distinct control, infrastructure, cloud, and
      procurement functions, while Azure and Azure Local integration reduces the
      need to abandon an established enterprise cloud environment. This breadth may
      reduce integration burden, but every cited capability and timing comparison is
      company-issued. No independent test in the assigned evidence measures
      deployment time, workload performance, resilience, total cost, regulatory
      posture, or feature parity against a named alternative.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP010"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "commercial-model-and-durability"
    title: "Commercial access, distribution, and moat durability"
    body: >-
      Public packaging signals lower-friction product entry but not enterprise
      economics. Armada offers self-serve Atlas onboarding, a free Bridge experience,
      and a sales-assisted Galleon demonstration; the public site does not disclose
      realized pricing, discounting, minimum commitments, hardware ownership,
      financing, service levels, or switching terms. A company-authored CMO listing
      assigns pricing, monetization, and competitive intelligence to the role, which
      indicates these are active go-to-market priorities rather than settled,
      externally validated advantages. The assigned evidence also cannot establish
      lock-in, multi-homing behavior, supply exclusivity, channel power, or durable
      regulatory trust. Consequently, the moat case rests on an integrated product
      thesis and claimed deployment speed, while its economic durability and
      defensibility against well-funded incumbents remain unverified.
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
    tableRefs:
      - "TP003"
