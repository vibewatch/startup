  title: "Customers"
  summary: "Armada’s enterprise customer base centers on high-consequence remote industrial and sovereign operational environments spanning energy, defense, public infrastructure, and telecommunications. Verified customer proof includes deployments across the U.S. Navy, Alaska Department of Transportation and Public Facilities, Aramco Digital, Targa Resources, Atlas Energy, and Mars, while commercial durability faces key-account concentration and unverified retention metrics."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Base Segmentation and Buyer Dynamics"
    body: |
      Armada positions its full-stack edge infrastructure platform across capital-intensive industries where operations occur beyond reliable terrestrial telecommunications and traditional hyperscale cloud data center reach. The company targets enterprise infrastructure buyers, operational technology leads, and public defense commands requiring real-time compute, satellite backhaul, and local inference capabilities directly where data is generated. Primary targeted sectors include oil and gas, national defense, state and local infrastructure, mining, manufacturing, and telecommunications.

      Buyer dynamics vary sharply across commercial and public sectors. In commercial verticals like energy and mining, procurement is typically championed by operational technology (OT) directors, field engineering leads, and enterprise CIOs aiming to reduce non-production days and automate hazardous drilling or extraction procedures. Conversely, defense and public-sector deployments involve complex government procurement channels, mission-command evaluation, and strict security compliance accreditations.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory and Production Deployments"
    body: |
      Armada has exhibited rapid commercial adoption since its founding, progressing from early proof-of-concept units to enterprise and defense production deployments within two years of commercialization. The platform reports over 2,000 enterprise users and 30,000 connected edge assets operating across more than 100 countries globally, reflecting widespread deployment of its Commander and Atlas fleet management software layer.

      Operational scale is anchored by deployment of ruggedized modular Galleon edge data centers. These modular units, deployable in under 60 days compared to typical 24-month construction cycles for traditional facilities, allow customers to incrementally scale compute from single-kilowatt field configurations to multi-megawatt edge campuses. Notably, industrial users integrate Armada’s edge compute directly with Microsoft Azure Local, Azure Arc, and OpenAI frontier models to execute low-latency inferencing without public backhaul dependency.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-evidence-and-use-cases"
    title: "Named Customer Proof and Reference Quality"
    body: |
      Verified customer deployments demonstrate multi-vertical adoption across premier enterprise and public sector accounts. High-profile named users include Alaska Department of Transportation and Public Facilities (DOT&PF), the U.S. Navy, Aramco Digital, Targa Resources, Atlas Energy, SQM, Mars, Marriott, Tampnet, and Vocus. These engagements demonstrate production utilization across harsh environments ranging from sub-arctic disaster monitoring to offshore energy rigs.

      For the Alaska DOT&PF, Armada deployed edge compute and satellite connectivity to process real-time aerial drone imagery for avalanche, landslide, and flood monitoring along remote transit corridors, eliminating historical multi-day cloud upload bottlenecks. In the defense vertical, the U.S. Navy utilizes ruggedized edge hardware and software for tactical situational awareness. In the energy sector, Aramco Digital entered an eight-month accelerated commercial agreement to deploy distributed cloud Galleon units and Microsoft Azure technologies across industrial facilities in Saudi Arabia.
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Durability, Expansion Loops, and Commercial Vulnerabilities"
    body: |
      Despite rapid early adoption across marquee enterprises, Armada’s commercial model exhibits significant structural diligence gaps. Public disclosures do not provide verified figures for Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual churn rates, or average contract length. Commercial expansion relies on land-and-expand dynamics—moving from software monitoring via Atlas to physical Galleon data center deployments and Bridge GPU-as-a-Service orchestration.

      Customer concentration poses a material risk. Major flagship agreements, particularly with Aramco Digital and the U.S. Navy, represent a substantial proportion of deployed hardware and forward revenue commitments. Furthermore, the company’s dependency on Starlink low-Earth orbit satellite terminals and Microsoft Azure ecosystem distribution creates procurement and platform co-dependence. Diligence must establish formal revenue breakdowns by account and verify pilot-to-production conversion rates. Additionally, while threat actor Spirals published unconfirmed extortion claims targeting an entity named Armada Credit Bureau in September 2026, verification confirms that the victim is an unrelated Ugandan credit analytics bureau rather than Armada the edge computing company.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
