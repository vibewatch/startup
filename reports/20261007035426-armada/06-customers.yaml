callouts:
  - calloutType: "insight"
    title: "Sovereign Industrial Cloud Wedge"
    body: "Armada’s strategic success with marquee industrial and defense buyers stems from addressing operational physics rather than enterprise software convenience. By co-locating modular data centers (Galleons) with Starlink terminals and Azure Local software, Armada captures customers whose raw telemetry cannot physically be backhauled to centralized hyperscale clouds due to extreme bandwidth limits and national sovereignty laws."
    claimRefs:
      - "CU002"
      - "CU007"
      - "CU011"
  - calloutType: "risk"
    title: "Retention Opacity and Sovereign Concentration"
    body: "While customer additions like Aramco Digital and the U.S. Navy validate technological performance, the absence of public NRR, gross churn rates, and account-level revenue shares leaves investor visibility impaired. A high proportion of early revenue is tied to sovereign-scale multi-unit deployments that carry extended procurement cycles and geopolitical dependencies."
    claimRefs:
      - "CU012"
      - "CU014"
      - "CU015"
