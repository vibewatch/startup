chapter:
  number: 5
  title: "Product & Technology"
  summary: "Armada delivers modular, air-gapped edge computing infrastructure through Galleon modular data centers, combined with the Armada Edge Platform software stack for sovereign AI orchestration, remote operations, and local persistent storage. High-density deployments such as the 2.2 MW Leviathan MDC integrate custom direct liquid cooling and hybrid cloud partnerships with Microsoft Azure Local and VAST Data, while technical risks concentrate in complex thermal distribution, supply chain component availability, and gated partner-only administrative access."

sections:
  - id: platform-and-product-suite
    title: "Modular Edge Infrastructure & Product Suite Definition"
    body: "Armada addresses the growing compute deficit at the tactical and industrial edge by packaging complete data center infrastructure into deployable, ruggedized modular systems. Rather than relying on multi-year centralized hyperscale construction, the Armada Edge Platform integrates four distinct operational products: Galleon modular data centers, Bridge sovereign cloud orchestration, Atlas remote fleet operations, and the Marketplace application ecosystem. Galleon provides the ruggedized physical compute hulls built for extreme environments, ranging from compact tactical units transportable by standard military cargo aircraft to high-density multi-megawatt facilities. Bridge operates as a sovereign AI cloud layer that exposes GPU-as-a-Service capabilities while strictly enforcing local perimeter data isolation. Complementing this core infrastructure, Atlas serves as a centralized network operations center providing real-time telemetry, asset monitoring, and operational observability across widely distributed edge nodes, while Marketplace facilitates procurement of certified edge-ready hardware and domain-specific AI models. Together, these products offer an integrated operational model for enterprise and defense organizations requiring immediate, high-performance compute in disconnected or sovereign theaters."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE011
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: system-architecture-and-cooling
    title: "Technical Architecture, Distributed Storage & Thermal Engineering"
    body: "Under the hood, Armada decouples compute orchestration from public hyperscaler connectivity through a resilient, air-gapped software and hardware stack. At the container and cluster tier, the platform orchestrates workloads using standard Kubernetes runtimes paired with a Rook Ceph distributed storage cluster. This design supplies high-performance Ceph RBD block devices and CephFS shared file storage locally across edge nodes without cloud round-trips. For enterprise customers requiring cloud operating consistency, Armada validates Microsoft Azure Local and Foundry Local directly within Galleon hulls, enabling local inference and analytics while maintaining strict compliance boundaries. High-density AI workloads are supported through specialized partnerships, including integration with the VAST DataSpace global namespace to synchronize training datasets across distributed edge and core data factories. However, operating dense GPU clusters in confined modular enclosures introduces severe thermal engineering challenges. To support the 2.2 MW Leviathan MDC housing 576 GPUs, Armada relies on custom liquid-first cooling loops, coolant distribution units (CDUs), fluid manifolds, and hydraulic controls. Engineering recruitment highlights ongoing development in closed-loop glycol distribution and leak-detection systems, representing a mission-critical failure domain where thermal or mechanical failure immediately jeopardizes edge node availability."
    claimRefs:
      - CE004
      - CE007
      - CE008
      - CE009
      - CE010
      - CE013
    tableRefs:
      - TE003

  - id: operational-workflows-and-deployments
    title: "Operational Workflows, Mission Profiles & Tactical Deployments"
    body: "The primary economic and operational justification for Armada is the total elimination of cloud backhaul bottlenecks in degraded, intermittent, and latent network environments. In conventional remote monitoring workflows, such as infrastructure surveying or border surveillance, high-resolution imagery and sensor telemetry are trapped on offline storage media or constrained by low-bandwidth satellite links, delaying mission-critical analysis by days. Deploying Galleon Cruiser or Triton units on-site enables local computer vision models to perform real-time automated feature extraction and hazard mitigation within seconds. For defense operators, Galleon modular units provide forward-deployed, air-gapped processing designed to function autonomously under full network denial without phoning home. Furthermore, while traditional brick-and-mortar data center construction regularly requires 24 months of permitting, utility interconnect delays, and civil engineering, Armada markets Galleon deployments within weeks. Nevertheless, deploying modular data centers in austere environments introduces distinct field limitations: units require reliable on-site prime power generation, fuel logistics, physical perimeter security, and certified heavy-lift transport access, shifting operational risk from software availability to rugged field logistics."
    claimRefs:
      - CE002
      - CE003
      - CE009
      - CE011
    tableRefs:
      - TE002

  - id: compliance-differentiation-and-technical-risks
    title: "Security Accreditation, Differentiation & Technical Diligence Gaps"
    body: "Armada differentiates its product portfolio through a convergence of military-grade physical packaging, sovereign data isolation, and deep strategic ecosystem alliances. In the defense vertical, Armada positions Galleon form factors as accreditable to ICD 705 and Special Access Program Facility (SAPF) standards, designed to meet the rigorous physical and emanations security requirements of classified operations. Its validated integrations with Microsoft Azure Local and VAST Data create defensible ecosystem moats that pure containerized hardware manufacturers cannot easily duplicate. Despite these technical strengths, diligence reveals material technical and operational risks. First, while Galleon hardware is marketed as accreditable, public documentation does not provide definitive evidence of finalized program-specific authority to operate (ATO) accreditations across deployed units. Second, Armada's high-density Leviathan platform depends on complex liquid cooling distribution units and specialized component supply chains that face single-point-of-failure vulnerabilities in austere deployments. Third, developer access remains highly controlled, with administrative integration guides and documentation gated behind partner authentication, limiting independent verification of platform stability, API ergonomics, and third-party developer momentum."
    claimRefs:
      - CE002
      - CE004
      - CE012
      - CE013
      - CE014

