  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方动态
        blocks:
          - type: paragraph
            body: >
              Armada
              将全栈边缘基础设施平台定位于资本密集型行业，这些行业的运营超出可靠陆地电信和传统超大规模云数据中心的覆盖范围。公司面向企业基础设施买方、运营技术负责人和公共国防指挥机构，在数据产生现场提供实时算力、卫星回传和本地推理能力。目标行业主要包括石油天然气、国防、州及地方基础设施、采矿、制造和电信。


              商业部门和公共部门的买方动态差异很大。在能源、采矿等商业垂直领域，采购通常由运营技术（OT）总监、现场工程负责人和企业 CIO
              主导，目标是减少非生产日并自动化危险钻探或开采流程。相反，国防和公共部门部署涉及复杂政府采购渠道、任务指挥评估和严格的安全合规认证。
