  - id: FE001
    title: 产品架构图
    type: stack
    summary: Armada Edge Platform 的六层架构栈，从可部署的物理基础设施延伸至边缘 AI 应用服务。
    data:
      layers:
        - label: 第 6 层：边缘 AI 应用服务
          detail: Marketplace 应用、本地推理端点、态势感知引擎与自主控制管线。
          modules:
            - Marketplace 应用
            - 模型服务
            - 态势感知
        - label: 第 5 层：主权云编排
          detail: Armada Bridge 控制平面、GPU 即服务资源配置与多租户工作负载隔离。
          modules:
            - Armada Bridge
            - GPUaaS 控制平面
            - 多租户隔离
        - label: 第 4 层：混合云与全局命名空间
          detail: Microsoft Azure Local 集成、Foundry Local 运行时与 VAST DataSpace 统一存储架构。
          modules:
            - Azure Local
            - Foundry Local
            - VAST DataSpace
        - label: 第 3 层：集群与持久化存储
          detail: Kubernetes 容器调度、Rook Ceph 分布式存储集群，以及 Ceph RBD 块服务与 CephFS 文件服务。
          modules:
            - Kubernetes
            - Rook Ceph 集群
            - Ceph RBD / CephFS
        - label: 第 2 层：热管理与电力基础设施
          detail: 直接液冷回路、冷却液分配单元（CDU）、流体歧管与集成式 UPS 电源调节。
          modules:
            - 液冷 CDU
            - 流体歧管
            - 集成式 UPS
        - label: 第 1 层：加固模块化数据中心
          detail: 符合 ICD 705 / SAPF 认证要求的 Galleon 集装箱舱体（Cruiser 20 英尺、Triton 40 英尺、Leviathan 2.2 MW 核心 MDC）。
          modules:
            - Cruiser 20ft
            - Triton 40ft
            - Leviathan 2.2MW
    approximationNotes: 架构分层反映已记录的软件与硬件边界；实体集成因定制 Galleon SKU 而异。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE009
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程与扩张架构
    type: journey-map
    summary: Armada 客户生命周期，从初始边缘连接延伸至模块化数据中心扩容与主权 AI 云编排。
    data:
      items:
        - label: 阶段 1：连接评估
          stage: 评估
          detail: 在现场部署 Starlink 终端与 Atlas 虚拟 NOC
          touchpoints:
            - 现场连接审计
            - Starlink 终端配置
            - Atlas 免费试用与车队可视化
        - label: 阶段 2：本地遥测摄取
          stage: 遥测摄取
          detail: 在现场本地汇总无人机、视频与工业传感器数据
          touchpoints:
            - Armada Edge Platform 边缘代理
            - 本地无人机与传感器数据管线
        - label: 阶段 3：边缘计算试点
          stage: 试点部署
          detail: 部署加固型 Scout 或 Beacon 边缘设备，在本地处理数据
          touchpoints:
            - 本地传感器与无人机数据摄取
            - Azure Local 与 Azure Arc 集成
            - 低延迟推理验证
        - label: 阶段 4：模块化生产部署
          stage: 模块化生产
          detail: 在 60 天内完成加固型 Galleon 模块化数据中心的交钥匙投运
          touchpoints:
            - 模块化数据中心安装
            - OpenAI 领域专用模型部署
            - 不依赖云端的本地任务自主性
        - label: 阶段 5：车队扩展
          stage: 车队扩张
          detail: 全球多站点设施及远程运营中的集群扩张
          touchpoints:
            - 多站点 Galleon 集群管理
            - 集中式 Atlas NOC 策略治理
            - 跨站点工作负载故障切换
        - label: 第 6 阶段：主权云与商业化
          stage: 主权云
          detail: 支持 Bridge GPU-as-a-Service 和第三方 Marketplace 应用
          touchpoints:
            - Armada Bridge GPU-as-a-Service
            - Armada Marketplace 软件解决方案
            - 主权 AI 容量商业化
    approximationNotes: 这是根据产品架构和部署案例研究综合得出的标准企业采用流程。
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU013
