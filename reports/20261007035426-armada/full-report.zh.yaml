              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Armada 的股权融资叙事聚焦 2026 年 5 月 B 轮；第三方风投跟踪数据库和新闻报道记录了以 $2B 投前估值融资 $230M。这一价格意味着约 $2.23B 投后估值，也表示新投资者获得融资后股权约
              10.3%。根据数据聚合商覆盖范围不同，历史轮次披露的累计股权融资在 $401M 至 $457M 之间，体现出 Overmatch、8090 Industries、BlackRock 等领投方以及 Johnson
              Controls 等战略投资者投入了大量机构资本。

              但严谨的投资判断必须严格区分 headline 融资数字与可验证的运营经济性。累计融资衡量的是过去消耗的资本，不是资产负债表上的流动现金、现金跑道或运营消耗。同样，$2B
              投前估值是协商形成的私募定价，而非由基本现金流验证的内在企业价值。在完全缺少关于已确认收入、经常性软件 ARR、毛利率或 Galleon Forge One
              工厂资本支出义务的公开审计披露时，必须把该价格标签视为对主权边缘基础设施战略期权价值的定价，而非经济性已获证明的业务。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
