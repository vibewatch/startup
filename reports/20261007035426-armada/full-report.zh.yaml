  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块化边缘基础设施与产品组合定义
        blocks:
          - type: paragraph
            body: >-
              Armada 通过把完整数据中心基础设施封装进可部署的加固型模块化系统，回应战术和工业边缘日益扩大的算力缺口。它不依赖多年建设的集中式超大规模设施，而是由 Armada Edge Platform
              整合四款运营产品：Galleon 模块化数据中心、Bridge 主权云编排、Atlas 远程车队运营和 Marketplace 应用生态。Galleon
              提供面向极端环境的加固型实体算力机体，从可由标准军用运输机运输的紧凑战术单元，到高密度多兆瓦设施。Bridge 作为主权 AI 云层运行，提供 GPU-as-a-Service
              能力，同时严格执行本地边界数据隔离。Atlas 则是集中式网络运营中心，为分布广泛的边缘节点提供实时遥测、资产监控和运营可观测性；Marketplace 负责采购经认证的边缘就绪硬件和领域 AI
              模型。整体而言，这些产品为需要在断联或主权场景立即获得高性能算力的企业和国防组织提供一体化运营模式。
