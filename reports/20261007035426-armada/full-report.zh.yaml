  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Armada 自创立至 2026 年的组织、融资、产品发布、合作伙伴及公司层面关键里程碑。
    data:
      items:
        - date: '2016-10-26'
          label: 平台成立与种子资本
          detail: 由 Marc Held 与 Jon Runyan 创立；为边缘基础设施筹集初始种子资本。
          tone: neutral
        - date: '2022-01-01'
          label: 商业实体启动
          detail: 在 CEO Dan Wright 领导下于旧金山正式启动商业平台运营。
          tone: neutral
        - date: '2024-07-11'
          label: Series A 融资轮
          detail: 获得由 M12（Microsoft）领投的 Series A 融资，用于开发 Galleon 模块化数据中心。
          tone: positive
        - date: '2025-07-24'
          label: Series B 首批融资
          detail: 完成由 Veriten 与银团投资者参与的首批 Series B 融资。
          tone: positive
        - date: '2026-03-17'
          label: NVIDIA AI Grid 与电信平台
          detail: 宣布与 NVIDIA AI Grid 及 NVIDIA DSX Air 仿真软件集成。
          tone: positive
        - date: '2026-03-31'
          label: Microsoft Azure Local 联盟
          detail: 发布联合方案，将 Galleon 模块化数据中心与 Azure Local 结合，为主权私有云提供服务。
          tone: positive
        - date: '2026-05-19'
          label: Series B 扩展轮与 Forge One 工厂
          detail: 以 $2.0B 估值融资 $230M；与 Johnson Controls 签署亚利桑那州工厂协议。
          tone: positive
        - date: '2026-08-26'
          label: Orion 10MW 发布与 Fossefall 交易
          detail: 发布 10MW Orion Galleon；Fossefall 订购五台 Leviathan MDC，以满足北欧 AI 容量需求。
          tone: positive
        - date: '2026-09-24'
          label: 实体消歧与事件审计
          detail: 监测到 Spirals 将 Armada Credit Bureau 列入勒索软件名单，确认这是无关实体造成的误报。
          tone: risk
