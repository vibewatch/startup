      - number: '7.4'
        title: 关键合作伙伴、供应商与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Armada 对上游硬件、卫星网络和超大规模软件合作伙伴形成结构性依赖。高密度 GPU 计算模块、专用液冷分配以及 Starlink
              或卫星回传都是关键单点故障；一旦供应链收紧或合作伙伴条款恶化，就可能让边缘部署停摆。工业和国防合同中的联盟协议体现出战略执行力，但公开披露尚未验证实体库存缓冲所需的硬件制造能力和资产负债表流动性；若部署里程碑延误，这些不确定性可能打破投资判断。
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
          - type: table
