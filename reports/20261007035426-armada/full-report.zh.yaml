      - number: '7.3'
        title: 运营、制造与安全故障模式
        blocks:
          - type: paragraph
            body: >-
              加固型边缘计算的运营足迹带来极端的热、机械和物流脆弱性。部署在海上石油平台、战术军事区域和采矿作业中的单元，面临严重环境退化、电力波动和维护访问障碍。此外，2026 年 9 月威胁情报源出现 Spirals
              组织发布的勒索敲诈名单，指向名为 Armada Credit Bureau
              的实体；威胁遥测确认，该披露具体针对乌干达一家独立的持牌征信机构，而非边缘基础设施初创公司，但它凸显了网络敲诈活动中品牌混淆带来的系统性声誉和侦察风险。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
