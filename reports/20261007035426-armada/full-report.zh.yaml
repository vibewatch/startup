  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别归属与实体区分
        blocks:
          - type: paragraph
            body: >-
              Armada 将核心运营领域定义为全栈加固型边缘计算和分布式主权 AI 基础设施，面向严苛、偏远或断联环境。公司以 Galleon 品牌提供专用模块化实体数据中心，通过 Bridge 编排 GPU，并通过
              Atlas 软件层集中管理车队；企业级 Starlink 管理则提供重要连接能力。可服务支出包括工业边缘计算硬件、远程连接编排、主权本地 AI
              部署，以及面向国防、石油天然气和电信的专用边缘基础设施。不包括集中式超大规模公有云计算、通用消费级 IoT 边缘硬件和一般企业数据中心建设。关键是，市场情报和搜索量审计显示，Armada
              商标与多个无关商业实体严重重名，包括 Nissan Armada 全尺寸 SUV 汽车零售、乌干达 Armada Credit Bureau Limited、Armada Supply Chain 物流公司和
              XRPN 收购载体；因此必须严格划定尽调边界，避免把虚假市场需求归因于目标公司 [CM001] [CM002] [CM003] [CM004]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
