    sections:
      - number: '4.1'
        title: 收入架构比披露的收入模式更宽
        blocks:
          - type: paragraph
            body: >-
              Armada 以一个平台承载四款产品：Atlas、Galleon、Bridge 和 Marketplace。这套产品图谱带来多种合理的经济变现路径，但保留的第三方来源中只有一个将整体模式标为订阅制。Atlas
              可以支撑经常性软件收入；Galleon 可能带来设备、部署和支持经济性；Bridge 定位为 GPU-as-a-Service；Marketplace
              则是采购入口，其佣金或转售结构尚未披露。因此，投资判断只能提出混合模式假设，不能视为已验证的收入组合。没有保留来源提供合同单位、收入确认政策、按产品拆分的组合，或从客户活动到已确认收入和毛利的桥接。
