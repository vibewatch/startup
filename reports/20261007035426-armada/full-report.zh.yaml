      - number: '5.4'
        title: 安全认证、差异化与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Armada 通过军用级实体封装、主权数据隔离和深度战略生态联盟的结合来区分产品组合。在国防领域，公司将 Galleon 机型定位为可按 ICD 705 和 Special Access Program
              Facility（SAPF）标准认证，旨在满足涉密运营严格的实体和电磁泄漏安全要求。其与 Microsoft Azure Local 和 VAST Data
              的验证集成形成了纯容器硬件制造商难以复制的生态护城河。尽管技术实力突出，尽调仍发现实质性技术和运营风险。第一，Galleon
              硬件虽被宣传为可认证，但公开文件没有为已部署单元提供最终的、按具体项目划分的运行授权（ATO）认证确凿证据。第二，Armada 的高密度 Leviathan
              平台依赖复杂的液冷分配单元和专用零部件供应链，在艰苦部署环境中存在单点故障漏洞。第三，开发者访问受到高度控制，管理集成指南和文档需要合作伙伴认证，限制了对平台稳定性、API 易用性和第三方开发者活跃度的独立验证。
