companyProfile:
  summary: >-
    Armada 是一家私有主权边缘基础设施公司，将模块化数据中心、卫星连接管理和 GPU 编排软件结合起来，服务于国防、能源、电信、采矿和公共基础设施客户。公司由联合创始人 Marc Held、Jon Runyan 及首席执行官
    Dan Wright 领导；大额融资、工业制造和云合作公告为其商业可信度提供支撑。尽调的核心并非产品是否存在，而是硬件加软件模式能否在定价透明、利润率持久且部署吞吐可预测的前提下实现经济规模化。
