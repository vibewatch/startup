        - On-站点 generator fuel 供应, battery life, 和 高-voltage grid tie-ins
        - 热 runaway in 集装箱ized battery 存储 和 generator fuel exhaustion
      - - 集群与存储
        - Rook Ceph Distributed Cluster
        - Provides Ceph RBD block 和 CephFS file persistent 存储 跨edge nodes
        - Sufficient NVMe 存储 devices 和 intra-cluster 100/400GbE 网络ing
        - Split-brain partition 期间网络 degradation 和 Ceph OSD rebalancing storms
      - - 工作负载编排
