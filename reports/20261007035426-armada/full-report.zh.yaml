      - number: '6.4'
        title: 留存持久性、扩张循环与商业脆弱性
        blocks:
          - type: paragraph
            body: >
              尽管早期在知名企业中采用迅速，Armada 的商业模式仍存在明显结构性尽调缺口。公开披露没有提供经验证的净收入留存率（NRR）、毛收入留存率（GRR）、年度流失率或平均合同期限。商业扩张依赖先落地再扩张动力：从
              Atlas 软件监控扩展到实体 Galleon 数据中心部署和 Bridge GPU-as-a-Service 编排。

              客户集中度构成重大风险。主要旗舰协议，尤其是与 Aramco Digital 和美国海军的协议，占已部署硬件和前瞻性收入承诺的相当比例。此外，公司依赖 Starlink 低地球轨道卫星终端和 Microsoft
              Azure 生态分销，形成采购与平台的相互依赖。尽调必须按账户建立正式收入拆分，并核实从试点到生产的转化率。另外，虽然威胁行为者 Spirals 于 2026 年 9 月发布了声称针对 Armada Credit
              Bureau 的未经确认敲诈指控，但核实结果显示受害者是乌干达一家无关的信用分析机构，而非边缘计算公司 Armada。
