  - id: FI001
    title: 证据约束下的收入模型桥接
    type: flow
    summary: 按顺序展示可观察的客户入口与产品活动，直至尚未披露的收入和毛利润转化。
    data:
      nodes:
        - id: entry
          label: 免费试用或演示
          detail: Atlas 自助服务、Bridge 免费试用或 Galleon 演示构成可观察获客路径的起点。
        - id: selection
          label: 产品选择
