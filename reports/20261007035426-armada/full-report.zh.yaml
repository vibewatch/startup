      - number: '8.3'
        title: 情景估值建模与继续研究建议
        blocks:
          - type: paragraph
            body: >-
              由于已确认收入、经常性合同 ARR 和单位利润率在公开渠道完全未披露，构建传统 DCF 或收入倍数模型会制造不必要的虚假精确。我们改用按里程碑分段的情景框架，在三条运营轨迹下评估公允企业价值。在基准情景（公允价值
              $1.8B-$2.3B）中，Galleon 和 Leviathan 部署稳步扩大，Galleon Forge One 的制造吞吐达到初始生产计划，软件编排开始产生可量化的经常性毛利，从而支撑当前投后入场水平。

              在悲观情景（公允价值 $1.0B-$1.5B）中，营运资本需求上升，工厂爬坡延迟，电力互联或场地准备拖慢客户上线，缺乏经常性软件附着收入迫使市场按更低利润率的工业设备倍数重新定价。在乐观情景（公允价值
              $3.0B-$4.5B）中，主权国防和工业采用扩展为标准化全球部署，带来高留存软件收入并证明客户多元化稳健。将这些不对称运营分布与财务披露缺失放在一起，明确建议高风险、估值偏高，继续研究；在承诺投资前，必须明确验证收入—订单桥接、毛利率和清算优先权。
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 入场纪律与私募尽调前置条件
            body: Armada 的 $2.0B 投前估值把主权 AI 边缘基础设施的战略期权定价推得很激进。在潜在投资者验证订单到已确认收入的转化、工厂资本需求和清算优先权级别前，应以继续研究为名暂停承诺。
            calloutType: recommendation
            claimRefs:
              - CV001
