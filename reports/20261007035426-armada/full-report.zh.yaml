      - number: '1.4'
        title: 时间线里程碑与法律实体区分
        blocks:
          - type: paragraph
            body: >-
              Armada 的时间线展示了从模块化边缘硬件原型向吉瓦级主权基础设施合作的加速转型。2026 年的重要里程碑包括：3 月为电信运营商集成 NVIDIA AI Grid 能力；8 月推出 10-megawatt
              Orion Galleon 模块化数据中心；以及从北欧运营商 Fossefall 获得多单元 Leviathan MDC 订单。与此同时，尽调必须严格区分法律实体，避免将 Armada Inc
              与同名实体混为一谈。2026 年 9 月，Spirals 勒索软件敲诈组织发布了一项尚未确认、声称针对 “Armada Credit Bureau” 的指控；该机构是持牌征信公司，与 Armada Inc
              在法律上无关。同样，Armada Acquisition Corp III（纳斯达克空白支票 SPAC）和 Armada Hoffler（1979 年成立的房地产投资信托）的公开文件也属于不同实体，其 SPAC
              零收入披露或 REIT 房产重组不得归于这家私有 AI 基础设施公司。
