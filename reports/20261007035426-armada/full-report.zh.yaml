chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与高管领导层
        blocks:
          - type: paragraph
            body: >-
              Armada 开发全栈边缘计算和主权 AI 基础设施，面向远程、带宽受限及主权工业环境中的高算力工作负载。公司由联合创始人 Marc Held 和 Jon Runyan 于 2016
              年在波士顿构想，之后转型为总部位于旧金山、由首席执行官 Dan Wright 领导的商业运营实体。公司治理明显依赖 Wright 负责企业融资、战略技术合作和商业叙事，也依赖 Runyan
              负责运营物流、制造协调和分布式边缘部署。早期基础性贡献归于 Held，但业务转向工厂规模生产后，实际高管领导仍集中在 Wright 和 Runyan
              手中。正如随附的领导层与创始人映射所示，随着员工分布到多个运营设施，工程领导层制度化和独立董事会监督仍是关键治理里程碑。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: 融资历史、估值与利益相关方治理
        blocks:
          - type: paragraph
            body: >-
              Armada 的资本化轨迹反映出估值快速扩张，背后是企业和主权客户对分布式 AI 基础设施的兴趣加速。2026 年 5 月，公司宣布以 $2.0B 投前估值完成超额认购的 $230M B
              轮扩展融资，使五轮融资累计股权资本增至约 $457M。机构投资者联盟由顶级前沿科技和风险投资机构领衔，包括 Founders Fund、Lux Capital、Shield Capital，以及在 2024 年
              7 月领投公司 A 轮的 Microsoft 风投基金 M12。除股权融资外，Armada 还建立了关键工业和商业联盟，最突出的是与 Johnson Controls
              达成里程碑式制造框架协议，在亚利桑那州专用工厂建造 Galleon 模块化数据中心。此外，公司通过与 Microsoft Azure Local 和 Palantir Technologies
              的战略技术合作强化主权市场进入渠道，将 Armada 定位为本地化 AI 部署的基础设施层。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
