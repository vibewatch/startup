        blocks:
          - type: paragraph
            body: >-
              可辩护的竞争框架比边缘计算初创公司名单更宽。Armada 提供由 Atlas 车队运营、Galleon 加固基础设施、Bridge 主权 GPU 编排和 Marketplace
              采购组成的四部分平台。因此，竞争范围还包括一体化边缘平台、传统数据中心建设、内部集成、超大规模云厂商边缘扩展、单点硬件和纯连接供应商。然而，指定证据池没有关于具体直接同行、现有厂商规模、竞争对手融资或定价的可用公司级证据。保留的八个来源中有六个与
              Nissan Armada 车辆无关。因而，画像表将 Armada 获支持的公开定位与仍需一级或独立验证的替代类别分开，而不是把未经支持的供应商当作已测量同行。
