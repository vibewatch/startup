      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将融资背景、运营未知因素和可能击穿投资论点的风险串联至最终“继续研究”结论的逻辑决策流程。
    data:
      nodes:
        - id: f1
          label: Series B 融资核查
          detail: 据报道，公司融资 $230M，投前估值为 $2.0B（隐含投后入场估值 $2.23B）
        - id: f2
          label: 模块化边缘计算机会
          detail: 快速部署优势（数天而非 24 个月）与主权计算架构
        - id: f3
          label: 经济分母不透明
          detail: 没有公开的已确认收入、ARR、毛利率或工厂资本开支数据
        - id: f4
          label: 工业化执行负荷
          detail: Galleon Forge One 的制造规模、电力并网和营运资金风险
        - id: f5
          label: 不利实体核查
          detail: 确认 2026 年 9 月 Spirals 勒索软件组织声称的目标是无关的乌干达征信机构
        - id: f6
          label: 最终结论：继续研究
          detail: 估值偏高、风险评级高，等待私有审计披露
      edges:
        - from: f1
          to: f2
          label: 为增长提供资金
        - from: f2
          to: f3
          label: 要求证明
        - from: f3
          to: f4
          label: 叠加风险
        - from: f4
          to: f5
          label: 需要尽调
        - from: f5
          to: f6
          label: 支持结论
    approximationNotes: 流程图展示定性决策链；节点代表投资判断里程碑，而非量化财务产出。
    claimRefs:
      - CV001
      - CV002
