      - number: '5.2'
        title: 技术架构、分布式存储与热工程
        blocks:
          - type: paragraph
            body: >-
              在底层，Armada 通过具备韧性的气隙软硬件栈，将算力编排与公共超大规模云连接解耦。在容器和集群层，平台使用标准 Kubernetes 运行时编排工作负载，并配套 Rook Ceph
              分布式存储集群。这种设计在边缘节点本地提供高性能 Ceph RBD 块设备和 CephFS 共享文件存储，无需往返云端。对于要求云端运营一致性的企业客户，Armada 直接在 Galleon 机体内验证
              Microsoft Azure Local 和 Foundry Local，使本地推理和分析能够运行，同时守住严格的合规边界。高密度 AI 工作负载还通过专项合作得到支持，包括与 VAST DataSpace
              全局命名空间集成，以同步分布式边缘和核心数据工厂的训练数据集。然而，在狭窄模块化机箱内运行密集 GPU 集群会带来严峻的热工程挑战。为了支撑容纳 576 个 GPU 的 2.2 MW Leviathan
              MDC，Armada 依赖定制的液冷优先回路、冷却液分配单元（CDU）、流体歧管和液压控制。工程招聘信息显示，公司仍在开发闭环乙二醇分配和泄漏检测系统；热或机械故障会立即危及边缘节点可用性，这是任务关键型故障域。
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
