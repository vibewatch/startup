      - number: '1.3'
        title: 运营规模、商业指标与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Armada 的运营足迹随资本流入同步激进扩张，从早期现场测试发展到国际多单元部署。公司官方披露称，其平台覆盖超过 100 个国家、拥有 2,000 名企业用户，并通过 Atlas 虚拟网络运营中心管理超过
              30,000 项已连接运营资产。员工人数也大幅增长，从 2025 年末的 368 人增至 2026 年 8 月的 666 人。然而，基本财务指标仍完全私有。GetLatka 的第三方估算显示，Armada
              2025 年 ARR 年化收入约为 $83.2M，但公司尚未公开披露经审计的已确认 GAAP
              收入、毛利率、EBITDA、运营现金消耗或订单到收入的转化时间表。严格的投资者尽调必须区分无约束力的制造承诺、前瞻性管线订单与实际确认的经常性软件或基础设施收入。
