        - id: deployment
          label: 部署
          detail: 公司称 Galleon 可在数周内完成部署；实施范围与成本分配尚未披露。
        - id: activity
          label: 客户活动
          detail: Armada 声称拥有 2,000+ 企业用户和 30,000+ 个连接资产，但未定义付费用户或用户群。
        - id: revenue
          label: 已确认收入
