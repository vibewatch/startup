      - number: '2.2'
        title: 市场规模视角、增长驱动与私有估算
        blocks:
          - type: paragraph
            body: >-
              估算主权边缘 AI 的可服务市场，必须应对严重的数据不对称。私募市场 SaaS 数据聚合商估算，Armada 截至 2025 年 9 月的 ARR 为 $83.2M，员工数为 368
              人，但这一收入数字是第三方建模结果，并非公司审计或 SEC 备案数据。Armada 自报的商业里程碑称，公司已在超过 60 个国家扩张运营，并通过 Commander Connect 管理数千个 Starlink
              终端，客户承诺覆盖国防、能源和交通。市场需求来自运营上的迫切需要：在回传延迟或带宽成本阻碍集中式云流式传输的地方，就地处理海量传感器和无人机遥测数据。然而，资本密集度高、企业采购周期长且供应商规模未经验证，带来重大规模估算限制，无法完成标准的自下而上
              TAM 验证 [CM005] [CM006] [CM007] [CM008]。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              Armada
              的加固型边缘基础设施主要被资本密集、监管严格的行业采用；这些行业的运营停机将带来严重安全或经济成本。主要买方包括需要战术态势感知的军方和国防机构、自动化远程开采的石油天然气运营商、州级应急管理机构，以及跨国物流或电信服务商。预算通常由运营技术副总裁、首席信息安全官（CISO）或政府项目执行官掌握，而非传统企业
              IT 部门。企业部署周期面临严重结构性阻力：现场部署需要广泛的环境加固测试、定制供电、专用本地冷却和主权合规协议。此外，品牌仿冒和二级市场情报风险凸显了企业采购前严格验证供应商的必要性 [CM009]
              [CM010] [CM011] [CM012]。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
