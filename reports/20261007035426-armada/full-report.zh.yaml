      - number: '5.3'
        title: 运营工作流、任务画像与战术部署
        blocks:
          - type: paragraph
            body: >-
              Armada
              的主要经济和运营理由，是在网络受损、间歇或高延迟环境中彻底消除云回传瓶颈。在基础设施测绘或边境监视等传统远程监控工作流中，高分辨率图像和传感器遥测被困在离线存储介质中，或受低带宽卫星链路限制，使任务关键分析延迟数天。在现场部署
              Galleon Cruiser 或 Triton 单元后，本地计算机视觉模型可在数秒内完成实时自动特征提取和风险缓解。对国防运营方而言，Galleon
              模块化单元提供前沿部署的气隙处理能力，即使网络完全拒绝访问也能自主运行，不向外部回拨。此外，传统砖混数据中心建设经常需要 24 个月来办理许可、完成公用设施互联和土木工程，而 Armada 将 Galleon
              部署周期宣传为数周。不过，在偏远艰苦环境部署模块化数据中心也有现场限制：单元需要可靠的现场主电源、燃料物流、实体边界安保和经认证的重型吊装运输通道，运营风险因此从软件可用性转移到加固型现场物流。
            claimRefs:
              - CE002
