          description: 明确需要模块化数据中心舱（Galleon）与多轨道卫星路由的市场需求
        - label: 战术国防与主权基础设施机会
          value: Air-Gapped Government & Defense Mandates
          description: 由国防态势感知、边境安全与应急管理驱动的主权计算需求
        - label: 关键自然资源与工业遥测
          value: Remote Energy, Mining & Heavy Asset Monitoring
          description: 受地面光纤与高卫星延迟制约的上游钻井和采矿现场运营
        - label: 企业主权卫星车队运营
          value: Multi-Country LEO Satellite Orchestration
          description: 需要在全球资产范围统一管理 Starlink 终端车队的企业连接层
        - label: 近期可服务可获取覆盖范围
          value: Contracted Enterprise Edge Fleets
          description: 以试点规模为特征的近期企业与政府部署（数千个终端，预计员工数 368）
    approximationNotes: 反映市场细分约束的定性概念金字塔；由于缺乏经审计的公开规模共识，未列出美元金额。
