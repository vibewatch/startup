      - number: '7.5'
        title: 财务模型脆弱性与判断失效触发器
        blocks:
          - type: paragraph
            body: >-
              模块化边缘计算的财务画像，同时承受硬件制造的营运资本拖累，以及主权国防和重工业企业买方的漫长销售周期。在缺少单位级毛利率、硬件折旧计划、库存融资机制或保修准备金公开透明度的情况下，剩余敞口仍高。判断失效触发器包括长期监管出口禁令、重大工厂扩建良率延误、关键卫星带宽限流，以及客户高度集中——早期锚定试点无法转化为产生现金的多单元部署。
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 资本密集度与供应链不对称威胁边缘经济性
            body: >-
              与能以极低增量销货成本扩张的纯软件企业不同，Armada 必须为复杂硬件工程、热管理、液冷以及 Galleon 和 Leviathan
              等重型模块化单元的精密组装提供资金。即使市场兴趣强劲，硬件供应链瓶颈、零部件价格波动和未对冲的营运资本需求也可能严重限制部署速度。
            calloutType: risk
            claimRefs:
              - CR002
