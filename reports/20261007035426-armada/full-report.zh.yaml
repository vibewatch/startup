      - number: '8.2'
        title: 投资判断、反判断与不利尽调
        blocks:
          - type: paragraph
            body: >-
              Armada 的核心投资判断建立在可随处部署的主权模块化边缘计算这一品类创造之上。随着企业和国防工作负载越来越多地遭遇电网供电瓶颈，以及偏远或艰苦环境中的通信延迟，Armada 的模块化 Galleon 单元和
              Leviathan 兆瓦级架构可以在数天或数周内部署，而传统超大规模设施通常需要多年许可周期。根据公司关于覆盖 100+ 个国家、拥有 2,000+ 企业用户和通过 Atlas 管理 30,000+
              项已连接资产的官方主张，乐观投资者预期，在加固型实体硬件之上会叠加高毛利经常性软件和编排收入。

              相反，反判断强调严重的执行和经济集中风险。模块化边缘数据中心背负沉重的工业和营运资本负担，收入确认可能落后于订单，而 Galleon Forge One
              的工厂吞吐量尚无公开验证。此外，实体区分结果显示，第三方威胁情报平台 Darkfield、Recent Breaches 和 GalaxyWarden 记录了 Spirals 组织于 2026 年 9
              月针对乌干达 Armada Credit Bureau Limited 发布的勒索敲诈名单。尽调确认该目标是非洲一家无关的金融机构，只与目标公司共享 “Armada”
              品牌），也暴露出在国防和关键工业垂直领域运营的边缘基础设施提供商面临更大的网络威胁面；投入资本前需要经过验证的第三方认证和严格审计。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
