callouts:
  - calloutType: "insight"
    title: "The Luxury Resale Trilemma: Take Rate, Seller Friction, and Counterfeit Risk"
    body: "Platforms in luxury resale must balance three competing forces: maximizing seller net payouts, minimizing listing labor, and guaranteeing authenticity. The RealReal eliminates listing labor but penalizes sellers with 55% to 85% commissions. Peer-to-peer apps like Poshmark offer decent payouts but lack physical authentication rigor, exposing buyers to superfakes. Vestiaire Collective stakes its moat on the sweet spot—offering ~85% net payouts to sellers while maintaining over 100 authenticators to protect buyer trust. However, preserving this balance requires enduring customer friction from manual listing and 14-day cross-border shipping timelines."
