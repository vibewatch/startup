    rows:
      - [Value seeker, "Consumer seeking luxury at a lower price", Buyer, "Buyer pays item and applicable charges", "Discover, assess, purchase, receive", Household discretionary spend, "Affordability cited by nearly 80% of sampled users"]
      - [Assortment / uniqueness seeker, "Consumer seeking scarce or differentiated items", Buyer, "Buyer pays transaction economics", "Search, compare condition, purchase", Household discretionary spend, "Around 55% strongly agreed assortment and uniqueness mattered"]
      - [Sustainability-motivated buyer, "Consumer seeking a pre-owned substitute", Buyer, "Buyer pays transaction economics", "Choose pre-owned instead of first-hand", Household discretionary spend, "Around 40% strongly agreed sustainability mattered"]
      - [Closet monetizer, "Individual fashion owner", Seller, "Seller supplies inventory and accepts platform economics", "List, negotiate, ship, receive proceeds", Personal wardrobe / household finances, "Wardrobe detox cited by 66% of sampled sellers"]
      - [Supply-constrained luxury seller, "Owner of desirable branded goods", Seller, "Seller contributes scarce inventory", "Decide to sell, list accurately, fulfill", Personal asset decision, "Seller acquisition and process friction can constrain liquidity"]
    notes: "Percentages come from a joint BCG-company survey of Vestiaire users; roles and budget ownership are analytical interpretations of the two-sided marketplace."
    claimRefs: [CM006, CM007, CM008, CM009, CM015]
