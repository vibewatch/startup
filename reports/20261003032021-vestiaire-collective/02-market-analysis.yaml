      - ["BCG + Vestiaire Collective / market growth", "Annual rate stated in 2025", Global, "10% annual; 3x firsthand rate", "Methodology not disclosed in retained press release", Medium, "Broad category rate; no company share"]
      - ["BCG + Vestiaire Collective / wardrobe share", "2025 report", "7,800 Vestiaire users", "28% overall; 30% clothing; 40% handbags", "Survey of existing platform users", Medium, "Selected user sample, not general population"]
      - ["Vestiaire proprietary data reported by TheIndustry.fashion / supply", "Five years to April 2025", "Vestiaire platform vintage listings", "+220%", "Proprietary analytics; base not disclosed", Medium, "Supply is not sales, GMV, or revenue"]
      - ["Vestiaire proprietary data reported by TheIndustry.fashion / sales", "Five years to April 2025", "Vestiaire platform vintage sales", "+80%", "Proprietary analytics; base not disclosed", Medium, "No absolute transactions, value, or take rate"]
    notes: "Values preserve publisher scope and denominator; the rows are separate sizing signals and must not be added or converted into TAM/SAM/SOM."
    claimRefs: [CM002, CM003, CM004, CM012, CM013]
