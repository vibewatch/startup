          detail: "Handbag share within the same selected user sample."
    approximationNotes: "The six values have different units and denominators; they are ordered as evidence layers, are not additive, and do not establish Vestiaire SAM or SOM."
    claimRefs: [CM002, CM003, CM004, CM005]
callouts:
  - calloutType: insight
    title: Large category, unproven capture
    body: "The $360B forecast is relevant only as an outer boundary; company share, monetizable geography, take rate, and repeat behavior remain undisclosed."
    claimRefs: [CM002, CM005]
  - calloutType: risk
    title: Marketplace liquidity is two-sided
    body: "Demand motivation is visible, but seller acquisition and the divergence between vintage supply and sales can limit liquidity and conversion."
    claimRefs: [CM012, CM013, CM015]
