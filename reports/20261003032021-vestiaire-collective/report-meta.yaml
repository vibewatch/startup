companyProfile:
  summary: >-
    Vestiaire Collective is a Paris-founded, private-disclosed luxury resale marketplace that connects individual and
    professional sellers with fashion buyers across Europe, the US, and other international markets. It monetizes
    through seller commissions, payment processing fees, authentication services, and brand partnerships, and it
    reported roughly €200 million of 2025 revenue on just under €1 billion of goods value while moving toward full-year
    profitability.
