chapter:
  number: 8
  title: "Valuation"
  summary: "The public record supports a track/research-more stance rather than a priced investment: Vestiaire Collective's reported valuation fell to about €1.1 billion in 2024, while full-year profitability, current net debt, and the preference waterfall remain unverified. Scale and gross margin are encouraging, but the last observable mark is not a supportable current entry price."
sections:
  - id: "investment-view"
    title: "Investment View and Decision Discipline"
    body: >-
      Vestiaire Collective has meaningful marketplace scale: reporting cited nearly €1 billion of
      2024 GMV, about €200 million of turnover, and gross margin above 50%. Those indicators support
      a credible operating platform, not a valuation conclusion. The same reporting said the company
      had not completed a profitable annual financial year, while management's 2026 evidence was
      limited to a few profitable months and a target for the first annual profit. Public evidence
      therefore supports tracking the transition, not underwriting a transaction today. Confidence
      is medium-low and risk is high because audited cash conversion, current net debt, retention,
      take rate, and the full preference waterfall are unavailable. The valuation stance is
      indeterminate-to-stretched at any price anchored solely to the 2024 mark.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "financing-and-anti-thesis"
    title: "Financing Context, Thesis, and Anti-Thesis"
    body: >-
      The financing history shows both investor validation and substantial expectations embedded in
      the capital structure. Independent accounts place the March 2021 financing at $216 million and
      above a $1 billion valuation, followed by a roughly $210 million September round at roughly
      $1.7 billion. A later report put the 2024 valuation near €1.1 billion, indicating a reset rather
      than a continuously compounding private mark. Community investors were offered Series I1
      preferred shares described by the company as the most senior equity instruments, with a
      liquidation preference. That disclosure does not reveal the complete waterfall across all
      rounds. The thesis is scale plus possible margin inflection; the anti-thesis is that annual
      profitability and trust-intensive operations remain unproven while senior preferences can
      alter common-equity outcomes.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV009"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-comparable"
    title: "Scenario Framework and Comparable Reality Check"
    body: >-
      The available evidence supports relative brackets around the reported 2024 reference, not a
      precise current equity value. The RealReal illustrates why adjusted EBITDA alone is
      insufficient: reporting cited $2.13 billion of 2025 GMV, $693 million of revenue, and $42
      million of adjusted EBITDA, alongside a $42 million net loss and only $5 million of free cash
      flow. Accordingly, a bull outcome above the 2024 €1.1 billion reference requires audited
      full-year profit and durable free cash flow; a base outcome near that reference requires proof
      that the recent margin inflection survives a full year; and a bear outcome is materially below
      it if profitability reverses or trust costs rise. These are diligence brackets, not offers,
      enterprise values, or probability-weighted targets.
    claimRefs:
      - "CV003"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-and-diligence"
    title: "Exit Readiness, Thesis Breaks, and Final Diligence"
    body: >-
      The company described an IPO as an ambition in its crowdfunding materials, but those materials
      also state that private shares are illiquid until a secondary transaction, trade sale, or IPO
      and that investors can lose some or all of their investment. No retained source establishes a
      current IPO timetable, transaction price, or buyer. Before pricing an entry, diligence should
      reconcile audited 2025 and 2026 statements to GMV, turnover, gross margin, operating cash flow,
      and free cash flow; obtain net debt and cash; map every preference and conversion right; and
      examine authentication, refund, and dispute cohorts. Thesis breaks include a missed full-year
      profit target, negative free cash flow despite reported profit, a down round below the 2024
      reference, or worsening verified trust-loss indicators.
    claimRefs:
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV016"
    figureRefs:
      - "FV001"
callouts:
  - calloutType: "recommendation"
    title: "Recommendation: Track and Research More"
    body: "Do not convert a historical private-company mark into a current entry price. Reassess only after audited full-year profitability, free cash flow, net debt, and the preference waterfall are available."
    claimRefs:
      - "CV003"
      - "CV006"
      - "CV009"
      - "CV016"
  - calloutType: "risk"
    title: "Trust Evidence Is Directional, Not a Defect Rate"
    body: "The retained customer thread contains serious complaints, but it is anecdotal and self-selected. Use it to define diligence tests for authentication, refunds, and support rather than to estimate incident frequency."
    claimRefs:
      - "CV014"
