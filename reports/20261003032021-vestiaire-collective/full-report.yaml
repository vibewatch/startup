  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Marketplace Workflow and Core Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective provides a managed peer-to-peer luxury fashion resale platform connecting buyers and
              sellers across more than 80 countries [CE001, CE003]. The customer workflow distinguishes between direct
              shipping for trusted peer transactions and physical authentication routing where high-value items undergo
              inspection before delivery [CE002]. Sellers can list inventory via standard web and mobile workflows,
              including automated Smart Listing functionality that processes product photographs to streamline catalog
              creation [CE004]. To manage listings across 7,000 luxury brands, Vestiaire Collective migrated its legacy
              monolithic codebase away from Subversion into a microservices architecture hosted on AWS [CE003, CE006].
              The operational platform decouples customer-facing catalog browsing, order orchestration, and social
              community feeds, using MongoDB Atlas document databases to handle real-time inventory queries across
              550,000 new monthly listings without cluster maintenance overhead [CE003].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
