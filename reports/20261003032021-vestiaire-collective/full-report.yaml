      - number: '1.4'
        title: Milestones and Current Direction
        blocks:
          - type: paragraph
            body: >-
              The evidence shows a progression from marketplace formation to pandemic-era scale, unicorn financing, US
              expansion, and a more recent efficiency phase. Transaction volume doubled in 2020 and the platform was
              adding 140,000 listings per week, according to TechCrunch. Modaes says the 2022 Tradesy acquisition
              strengthened the US presence, while the 2024 valuation reset and 2025 leadership changes mark a shift from
              expansion toward profitability. In May 2026, Zalando made Vestiaire Collective its first pre-owned partner
              for authenticated luxury and offered the assortment in 14 European markets. That distribution partnership
              broadens reach, but the supplied evidence does not disclose economics, exclusivity, customer conversion,
