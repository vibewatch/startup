            - Promotional zero fee listings
            - Catalog search across 5M listings
        - label: Order Transaction & Anti-Fraud Screening
          description: Buyer places order and elects shipping method; seller receives prepaid dispatch voucher
          touchpoints:
            - Automated anti-fraud screening
            - Direct shipping vs hub inspection
            - Escrow payment authorization
        - label: Authentication & Logistics Dispatch
          description: Items routed to warehouse hubs for physical verification by 100+ specialists or shipped direct
          touchpoints:
