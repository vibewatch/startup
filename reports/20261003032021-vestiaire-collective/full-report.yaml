      - number: '4.2'
        title: Unit Economics, Fulfillment Costs, and Contribution Margins
        blocks:
          - type: paragraph
            body: >-
              The marketplace's unit economics reflect the specialized operational demands of second-hand luxury
              authentication, cross-border logistics, and multi-currency processing. Management reported gross margins
              exceeding fifty percent in late 2025, supported by the expansion of its Direct Shipping model which
              bypasses physical authentication hubs for qualifying lower-risk seller transactions. For authenticated
              items, Vestiaire Collective maintains dedicated physical inspection hubs in Europe, the United States, and
              Asia Pacific employing over one hundred specialized authenticators. While Direct Shipping eliminates
              intermediary handling and reduces carbon emissions, physical inspection remains an unavoidable fixed and
              variable cost for high-ticket luxury goods where counterfeit risk is acute. Marketing expenditures,
              customer acquisition costs, and seller onboarding subsidies have historically absorbed a substantial
              portion of contribution profit, though recent restructuring and workforce reductions from peak 2022 levels
              to approximately 600 employees reflect an ongoing operational efficiency pivot.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI011
              - CI013
          - type: table
            tableRef: TI003
