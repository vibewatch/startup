  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence Boundary
      - Decision Implication
    rows:
      - - Recommendation
        - Track / research more
        - Scale and a reported monthly profit inflection are visible; audited full-year cash conversion is not.
        - Do not price an investment until the financial and capital-structure gaps close.
      - - Confidence
        - Medium-low
        - Core 2024 metrics and 2026 progress come through executive statements reported by the press.
        - Require audited statements and reconciliations before raising confidence.
      - - Risk rating
        - High
        - No completed profitable year was reported, and trust-intensive marketplace operations remain material.
        - Demand downside protection and measurable operating covenants.
      - - Valuation stance
        - Indeterminate-to-stretched
        - The €1.1 billion figure is a reported 2024 reference, not a verified current transaction price.
        - Reject entry pricing justified only by the 2021 or 2024 headline marks.
    notes: >-
      Assessments use public evidence through 2026-10-03; the 2024 valuation is a historical reference, not a current
      offer or enterprise-value calculation.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Vector
      - Thesis
      - Anti-Thesis
      - What Would Change the View
    rows:
      - - Scale and monetization
        - Reported 2024 GMV approached €1 billion on about €200 million of turnover.
        - GMV is not revenue, and neither metric establishes free cash flow.
        - Audited GMV-to-revenue reconciliation, take rate, and cash conversion.
      - - Margin inflection
        - Reported gross margin exceeded 50%, and management described several profitable months in 2026.
        - The retained evidence did not establish a completed profitable annual year.
        - Audited FY2026 net income and positive free cash flow.
      - - Capital support
        - Two large 2021 rounds attracted established financial and strategic investors.
        - The reported 2024 valuation was below the 2021 peak, and senior preferred rights can reshape proceeds.
        - A current priced round plus the complete liquidation and conversion waterfall.
      - - Trust model
        - The platform combines intermediation with quality-control and authentication processes.
        - Anecdotal customer reports allege counterfeit, condition, refund, and support failures.
        - Cohort-level authentication escapes, refunds, disputes, losses, and repeat rates.
    notes: >-
      The anti-thesis uses reported and anecdotal evidence conservatively; customer complaints identify diligence topics
      but do not measure platform-wide incidence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV013
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Valuation Brackets
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation Bracket
      - Probability Signal
      - Downside Trigger
    rows:
      - - Bull
        - Audited FY2026 profit, durable positive free cash flow, and stable trust-loss indicators.
        - Above the reported 2024 €1.1 billion reference; no public evidence supports a numerical ceiling.
        - Low until audited results are available.
        - Profit does not convert to positive free cash flow.
      - - Base
        - Recent profitability persists, but cash conversion and growth remain only modestly proven.
        - Near the reported 2024 €1.1 billion reference, adjusted for net debt and preferences.
        - Medium as a diligence anchor, not as a priced outcome.
        - A current financing prices below the 2024 reference.
      - - Bear
        - Annual profitability is missed, trust costs rise, or external capital is needed on weaker terms.
        - Materially below the reported 2024 €1.1 billion reference; no public evidence supports a floor.
        - Material given the unclosed evidence gaps.
        - Negative free cash flow, down-round terms, or worsening verified dispute cohorts.
    notes: >-
      Brackets are relative to the reported 2024 company valuation and are not enterprise values, equity offers,
      forecasts, or probability-weighted price targets.
    claimRefs:
      - CV003
      - CV004
      - CV005
