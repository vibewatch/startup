              - CR009
              - CR010
              - CR013
      - number: '7.3'
        title: Partner Dependencies, Platform Concentration, and Profitability Hurdles
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective's commercial strategy increasingly depends on brand partnerships and
              Resale-as-a-Service integrations with luxury houses, including Kering, Chloé, and Mytheresa. Kering's
              strategic backing and 5% equity stake provide institutional validation, yet create strategic counterparty
              dependency where brand-level resale programs could potentially be internalized or redirected toward
              proprietary channels. From an infrastructure standpoint, Vestiaire Collective relies on single-provider
              cloud hosting through Amazon Web Services France EMEA for website and mobile application uptime. On the
              financial dimension, having operated for over fifteen years before achieving seasonal EBITDA breakeven in
              late 2025, the business targets 2026 as its first full year of net profitability on approximately €200
              million in turnover. Achieving this objective requires sustaining gross margins above 50% and expanding
              U.S. market share where average basket sizes reach $500, despite macroeconomic luxury softening, customer
              acquisition friction, and founder-level executive turnover.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Authentication Integrity vs Direct Shipping Margins
            body: >-
              Vestiaire Collective faces an inherent structural tension between profitability and authentication
              control. Direct Shipping comprises over 66% of customer orders, avoiding centralized hub processing costs
              and supporting gross margins above 50%. However, peer-to-peer delivery shifts verification to digital
              algorithms and buyer inspection, elevating counterfeit disputes and customer churn risks.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment View and Decision Discipline
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective has meaningful marketplace scale: reporting cited nearly €1 billion of 2024 GMV,
              about €200 million of turnover, and gross margin above 50%. Those indicators support a credible operating
              platform, not a valuation conclusion. The same reporting said the company had not completed a profitable
              annual financial year, while management's 2026 evidence was limited to a few profitable months and a
              target for the first annual profit. Public evidence therefore supports tracking the transition, not
              underwriting a transaction today. Confidence is medium-low and risk is high because audited cash
              conversion, current net debt, retention, take rate, and the full preference waterfall are unavailable. The
              valuation stance is indeterminate-to-stretched at any price anchored solely to the 2024 mark.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV013
              - CV016
      - number: '8.2'
        title: Financing Context, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The financing history shows both investor validation and substantial expectations embedded in the capital
              structure. Independent accounts place the March 2021 financing at $216 million and above a $1 billion
              valuation, followed by a roughly $210 million September round at roughly $1.7 billion. A later report put
              the 2024 valuation near €1.1 billion, indicating a reset rather than a continuously compounding private
              mark. Community investors were offered Series I1 preferred shares described by the company as the most
              senior equity instruments, with a liquidation preference. That disclosure does not reveal the complete
              waterfall across all rounds. The thesis is scale plus possible margin inflection; the anti-thesis is that
              annual profitability and trust-intensive operations remain unproven while senior preferences can alter
              common-equity outcomes.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario Framework and Comparable Reality Check
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports relative brackets around the reported 2024 reference, not a precise
              current equity value. The RealReal illustrates why adjusted EBITDA alone is insufficient: reporting cited
              $2.13 billion of 2025 GMV, $693 million of revenue, and $42 million of adjusted EBITDA, alongside a $42
              million net loss and only $5 million of free cash flow. Accordingly, a bull outcome above the 2024 €1.1
              billion reference requires audited full-year profit and durable free cash flow; a base outcome near that
              reference requires proof that the recent margin inflection survives a full year; and a bear outcome is
              materially below it if profitability reverses or trust costs rise. These are diligence brackets, not
              offers, enterprise values, or probability-weighted targets.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV016
      - number: '8.4'
        title: Exit Readiness, Thesis Breaks, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The company described an IPO as an ambition in its crowdfunding materials, but those materials also state
              that private shares are illiquid until a secondary transaction, trade sale, or IPO and that investors can
              lose some or all of their investment. No retained source establishes a current IPO timetable, transaction
              price, or buyer. Before pricing an entry, diligence should reconcile audited 2025 and 2026 statements to
              GMV, turnover, gross margin, operating cash flow, and free cash flow; obtain net debt and cash; map every
              preference and conversion right; and examine authentication, refund, and dispute cohorts. Thesis breaks
              include a missed full-year profit target, negative free cash flow despite reported profit, a down round
              below the 2024 reference, or worsening verified trust-loss indicators.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Track and Research More'
            body: >-
              Do not convert a historical private-company mark into a current entry price. Reassess only after audited
              full-year profitability, free cash flow, net debt, and the preference waterfall are available.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV016
          - type: callout
            title: Trust Evidence Is Directional, Not a Defect Rate
            body: >-
              The retained customer thread contains serious complaints, but it is anecdotal and self-selected. Use it to
              define diligence tests for authentication, refunds, and support rather than to estimate incident
              frequency.
            calloutType: risk
            claimRefs:
              - CV014
