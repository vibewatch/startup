        - Amazon Web Services France EMEA
        - Core website, mobile app, and API hosting provider
        - Single-provider concentration
        - Prolonged AWS cloud outage halts transaction processing and listings
        - High
        - Multi-zone AWS deployment and automated incident response protocol
        - Unavailability during peak commercial retail windows
      - - Luxury Strategic Capital & Brand Resale Integration
        - Kering SA
        - Lead strategic shareholder (5% stake) and brand resale partner
        - Moderate strategic concentration
        - Kering develops proprietary in-house resale channels or divests stake
        - Medium
        - Diversification of brand partnerships across non-Kering houses (Chloé, Isabel Marant)
        - Loss of luxury conglomerate endorsement in authentication credibility
      - - Talent Attraction and Retention
        - Internal Operations & Tech Teams
        - Platform software engineering and authentication specialists
        - High competition in tech/scale-up labor market
        - Voluntary turnover hampers continuous platform improvements
        - Medium
        - Employee free-share ownership grants, hybrid working, and 360 performance reviews
        - Wage inflation and scale-up voluntary attrition rate reaching 17%
    notes: Ordered by severity. Counterparty relationships derived from official legal filings and press announcements.
