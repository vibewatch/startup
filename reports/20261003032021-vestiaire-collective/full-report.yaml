              - CU015
      - number: '6.3'
        title: Customer Durability, Friction, and Dispute Resolution Risks
        blocks:
          - type: paragraph
            body: >-
              Platform retention and transaction durability are governed by strict contractual frameworks and distinct
              physical fulfillment paths. Under standard seller general terms and conditions, Vestiaire Collective acts
              purely as an online intermediation platform rather than a reseller or title owner, explicitly disclaiming
              liability for underlying purchase contracts. Sellers face aggregate transaction fee caps reaching up to
              30% of product value, comprising selling and processing charges deducted directly from sales proceeds. For
              delivery, buyers can choose between direct seller shipping or centralized physical inspection where items
              undergo manual verification at regional warehouse hubs. This operating model creates notable customer
              friction: dissatisfied buyers report severe disputes over suspected counterfeit items, lost transit
              parcels, and non-refundable final sales where rejected items are forcibly relisted rather than refunded.
              Operational support barriers and unresponsive dispute mechanisms represent material risks to long-term
              customer goodwill and organic retention.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Buyer Protection Deficits and Secondary Market Dispute Exposure
            body: >-
              Vestiaire Collective's legal terms strictly position the marketplace as an intermediary disclaiming
              contractual liability between buyers and sellers. When items arrive with undetected wear, damaged
              hardware, or disputed authenticity, buyers encounter limited recourse beyond being forced to relist the
              item for sale. Persistent customer reports of lost parcels and protracted credit card chargebacks
              highlight an operational friction point that threatens buyer lifetime value.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
          - type: callout
            title: US Basket Premium Offsets Transatlantic Logistics Friction
            body: >-
              With average basket values in the United States reaching approximately $500—10% higher than European
              benchmarks—Vestiaire Collective captures superior unit margins on North American transactions. This
              pricing premium is essential to absorb higher transatlantic logistics, customs clearance, and specialized
              authentication labor costs while scaling market share against domestic US competitors.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective operates as a cross-border luxury circular marketplace across more than 70
              jurisdictions, subjecting its operating subsidiaries to complex European and international trade, consumer
              protection, and environmental compliance frameworks. The platform's corporate parent, Vestiaire Collective
              SA, is registered in Paris, France, and functions under French commercial statutes, European Union Digital
              Services Act requirements, and emerging Extended Producer Responsibility (EPR) regulations for textiles.
              While European environmental initiatives such as the French Anti-Fast Fashion Bill and EU textile waste
              directives create favorable structural tailwinds for certified circular models, they introduce non-trivial
              compliance burdens and reporting obligations. Specifically, evolving EPR frameworks—such as California's
              Responsible Textile Recovery Act (SB707) and French circular economy laws—require ongoing advocacy to
              ensure resale intermediaries are distinguished from primary producers regarding fee assessments.
              Furthermore, strict digital consumer protection rules governing commercial warranties, right-of-withdrawal
              waivers on second-hand consumer sales, and platform intermediary liabilities demand rigorous cross-border
              terms and conditions enforcement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR011
      - number: '7.2'
        title: Operational Logistics, Counterfeiting, and Data Security
        blocks:
          - type: paragraph
            body: >-
              The core value proposition of Vestiaire Collective is authenticated trust in secondary luxury
              transactions. However, operational scaling across four international logistics hubs (France, the United
              Kingdom, the United States, and Hong Kong) introduces substantial execution complexity. With more than 66%
              of customer orders fulfilled via peer-to-peer Direct Shipping, the company relies heavily on automated and
              digital verification algorithms prior to shipping, while the remaining 34% of orders undergo physical
              inspection in specialized warehouses. This bifurcated operational structure creates persistent counterfeit
              leakage exposure and transit disputes. Customer dissatisfaction in independent luxury forums highlights
              recurring friction points regarding misdescribed conditions, transit losses, and customer service
              responsiveness during dispute escalations. On the technical infrastructure layer, the company maintains
              continuous vulnerability assessments and a Bug Bounty program to safeguard user payment data and platform
              availability against cyber threats, remediating dozens of vulnerabilities annually.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
