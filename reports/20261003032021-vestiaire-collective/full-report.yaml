  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is the transaction value and related marketplace services for pre-owned fashion,
              with Vestiaire concentrated on designer and luxury goods rather than all used apparel. Its own storefront
              spans bags, jewelry and watches, clothing, shoes, accessories, vintage, women, men, and children, while
              the current seller terms define the service principally as an intermediary between individual buyers and
              sellers. That model excludes first-hand luxury sales, general thrift, repair, rental, and raw
              circular-fashion infrastructure from the core market, although each is an adjacency or substitute. The
              status quo also includes keeping an item, gifting it, selling through an offline consignment shop, or
              using an unassisted peer-to-peer channel. This boundary matters because a forecast for all secondhand
              fashion and luxury overstates the spend Vestiaire can monetize without adjustments for category,
              geography, online penetration, platform share, transaction frequency, and fees.
            claimRefs:
              - CM001
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest current top-down reference is the BCG and Vestiaire Collective 2025 study, which says global
              secondhand fashion and luxury could reach up to $360 billion by 2030 while growing 10% annually, three
              times the firsthand market rate. This is a directional TAM proxy, not a validated TAM for Vestiaire: the
              release does not provide the full forecast methodology, and its consumer evidence comes from 7,800
              existing Vestiaire users. Within that selected sample, resale represented 28% of wardrobes, including 30%
              for clothing and 40% for handbags. Platform data reported by TheIndustry.fashion adds a narrower demand
              lens: over five years, Vestiaire said vintage supply rose 220% while vintage sales rose 80%. Those unequal
              rates may indicate widening selection, slower sell-through, different starting bases, or a mix shift; the
              disclosed evidence does not distinguish among them. No retained source supplies current GMV, take rate,
              active transactors, geographic mix, or category mix, so a numeric SAM or SOM would be false precision.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.3'
        title: Buyers, sellers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Demand is multi-motive but value-led. In the BCG-company sample, nearly 80% cited affordability as a top
              buying reason, around 55% strongly agreed that assortment and uniqueness mattered, and around 40% strongly
              agreed sustainability mattered. Mintel separately found in 2019 that 57% of Britons believed buying too
              many fashion items was environmentally harmful, supporting the relevance of the sustainability narrative
              beyond Vestiaire's user base, though not measuring purchase conversion. Supply has a different trigger:
              66% of sampled sellers cited wardrobe detox, while a luxury-resale competitor told Glossy that sellers
              were harder to attract than buyers. The payer is therefore two-sided. Buyers fund item price and
              applicable checkout charges; sellers contribute inventory and accept transaction economics. Adoption
              proceeds from listing and discovery through trust, payment, and fulfillment, not through a conventional
              enterprise budget owner.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Three signals support continued adoption: a large projected category, behavior that substitutes for new
              purchases, and sustained platform activity. Vestiaire's April 2025 survey of more than 3,500 active users
              reported that 87% of purchased items prevented a first-hand purchase and that 50% searched Vestiaire first
              when they wanted or needed clothes. Historically, TechCrunch reported that transaction volume doubled in
              2020 versus 2019, but pandemic-era acceleration should not be extrapolated into the current run date. The
              counterweights are material. Survey samples are drawn from existing platform users; seller acquisition is
              difficult; authentication, item condition, logistics, and cross-border friction are integral to trust; and
              category supply can grow faster than sales. Valuation should therefore be anchored to verified GMV growth,
              cohort retention, take rate, contribution margin, authentication outcomes, and sell-through, not to the
              $360 billion headline alone. These private operating metrics remain the principal market-diligence gap.
            claimRefs:
              - CM002
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large category, unproven capture
            body: >-
              The $360B forecast is relevant only as an outer boundary; company share, monetizable geography, take rate,
              and repeat behavior remain undisclosed.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: Marketplace liquidity is two-sided
            body: >-
              Demand motivation is visible, but seller acquisition and the divergence between vintage supply and sales
              can limit liquidity and conversion.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Consignment Incumbents, and Broad Marketplaces'
        blocks:
          - type: paragraph
            body: >-
              The secondary apparel and luxury resale landscape divides into four distinct structural categories based
              on custody models, authentication depth, and category focus. In the managed luxury consignment tier,
              direct peer The RealReal operates an end-to-end white-glove consignment model where the platform takes
              physical possession, photographs, catalogs, and warehouses items, capturing 55% to 85% of transaction
              value in gross take rate. In contrast, Vestiaire Collective pursues a hybrid peer-to-peer managed model:
              sellers retain physical custody until sale, take their own photographs, and ship either through
              centralized verification hubs or via Direct Shipping. In the peer-to-peer and social resale tier, broad
              generalist platforms including eBay, Poshmark, and Depop command massive global consumer reach—such as
              eBay's 134 million active global buyers—and maintain lower commission rates ranging from 10% to 20%. While
              these horizontal platforms originally catered to mass-market and contemporary mall brands, they have
              aggressively introduced Authenticity Guarantee programs for high-value watches, sneakers, and handbags,
              directly attacking Vestiaire Collective's core value proposition. Finally, professional resale flippers
              and vintage boutiques increasingly treat independent direct-to-consumer storefronts (Shopify and
              WooCommerce) as a structural substitute to bypass marketplace fee drag and algorithm volatility entirely.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 'Capability Comparison: Authentication Logistics, Monetization, and Global Reach'
        blocks:
          - type: paragraph
            body: >-
              Evaluating platform architectures across core luxury buying criteria reveals sharp structural trade-offs
              between seller take-home payouts, operational friction, and counterfeit risk mitigation. Vestiaire
              Collective charges a flat 12% seller commission on items priced between $83 and $16,667, supplemented by a
              3% payment processing fee with a $3 minimum, establishing an effective take rate of approximately 15% for
              standard luxury goods. This structure yields substantially higher net payouts for luxury sellers compared
              to The RealReal: on a $2,500 designer handbag, a seller nets approximately $2,125 on Vestiaire Collective
              versus $1,500 on The RealReal, representing a $625 net cash advantage. However, The RealReal relieves
              consignors of all listing labor, whereas Vestiaire Collective requires sellers to produce detailed
              photography, write accurate condition disclosures, and handle international shipping packaging. Compared
              to broad platforms like Poshmark (which charges a flat 20% commission) and eBay (~15% total fee),
              Vestiaire Collective maintains stricter brand acceptance standards, rejecting lower-tier fast-fashion
              items to preserve catalog curation. Trust architecture remains the platform's primary defense: Vestiaire
              deploys over 100 in-house authentication specialists across physical inspection hubs in Europe and the
              United States, backed by digital pre-listing screening and partnerships with luxury conglomerates like
              Kering, which holds an approximate 5% strategic stake.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.3'
        title: Monetization Framework and Platform Fee Economics
        blocks:
          - type: paragraph
            body: >-
              Monetization across luxury resale platforms reflects contrasting cost structures and operational
              commitments. Vestiaire Collective's contractual terms stipulate that total seller fees shall not exceed a
              30% statutory cap, with standard consumer sales subject to a 12% selling fee plus a 3% payment processing
              fee. For entry-level items priced under $83, Vestiaire levies a minimum flat fee of $10, which imposes a
              high percentage fee drag on lower-ticket goods and deliberately incentivizes sellers to list higher-value
              designer merchandise. Optional services provide additional monetization levers: buyers can elect to pay an
              additional $15 to $25 authentication fee on Direct Shipping transactions to route items through a
              verification hub. In contrast, consignment incumbents like The RealReal capture upwards of 55% to 85% of
              gross sale proceeds to cover the heavy operational expenses of physical warehousing, in-house photography,
              and professional copywriters. For high-volume professional sellers, the economic friction of marketplace
              commissions has catalyzed multi-homing workflows: pro sellers list inventory simultaneously across
              Vestiaire Collective, eBay, and Poshmark using automated cross-listing software, while directing repeat
              high-value clientele to independent DTC websites where payment processing fees drop to approximately 2.9%
              plus $0.30 per transaction.
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Disconfirming Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective's competitive moat rests on a multi-sided cross-border liquidity network,
              brand-sanctioned legitimacy, and specialized authentication infrastructure. Europe represents 70% of
              company turnover, giving Vestiaire dominant inventory supply in European vintage and heritage luxury
              houses that North American competitors struggle to replicate. Furthermore, backing from luxury
              conglomerate Kering provides institutional validation and primary-luxury alignment that purely digital
              marketplaces lack. However, diligence reveals significant competitive vulnerabilities. Switching costs for
              both buyers and sellers remain virtually non-existent: third-party software tools allow sellers to
              synchronize listings across competing platforms in seconds, eliminating catalog exclusivity. Furthermore,
              Vestiaire's managed hub logistics create severe shipping delays: cross-border transactions involving
              physical hub inspection frequently require a 14-day delivery window from Europe to North America, creating
              buyer friction compared to Amazon-style fulfillment. Additionally, the option of Direct Shipping shifts
              verification risk onto buyers, exposing them to sophisticated superfakes and tedious dispute processes. As
              horizontal giants like eBay scale specialized authentication and luxury brands experiment with internal
              resale channels, Vestiaire Collective faces sustained take-rate pressure and customer acquisition
              headwinds in its strategic US expansion.
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Luxury Resale Trilemma: Take Rate, Seller Friction, and Counterfeit Risk'
            body: >-
              Platforms in luxury resale must balance three competing forces: maximizing seller net payouts, minimizing
              listing labor, and guaranteeing authenticity. The RealReal eliminates listing labor but penalizes sellers
              with 55% to 85% commissions. Peer-to-peer apps like Poshmark offer decent payouts but lack physical
              authentication rigor, exposing buyers to superfakes. Vestiaire Collective stakes its moat on the sweet
              spot—offering ~85% net payouts to sellers while maintaining over 100 authenticators to protect buyer
              trust. However, preserving this balance requires enduring customer friction from manual listing and 14-day
              cross-border shipping timelines.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP010
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective operates a managed luxury resale marketplace connecting individual and professional
              sellers with buyers worldwide. The primary monetization engine is commission-based transaction fees
              deducted directly from product sales proceeds. Under the platform's seller terms, total seller fees are
              formally capped at thirty percent of the product price and vary by item price band, product category, and
              brand tier. In addition to core take-rate commissions, Vestiaire Collective generates ancillary revenue
              through optional digital and physical authentication services, buyer shipping and handling charges, and
              brand-direct partnerships such as its Brand Approved circular buy-back program. Historically, take rates
              have hovered near twenty percent on gross merchandise volume, creating a high-gross-margin revenue stream
              that reached roughly €200 million on just under €1 billion of marketplace GMV in 2025. However, realized
              monetization is constrained by competitive pricing pressure from peer platforms and fee discounting
              designed to incentivize high-value luxury inventory deposits.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
