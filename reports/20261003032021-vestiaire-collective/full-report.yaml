      - number: '6.2'
        title: Commercial Adoption Trajectory and Strategic Channel Expansion
        blocks:
          - type: paragraph
            body: >-
              The platform's gross merchandise volume reached just under €1 billion in 2024, converting to €200 million
              in net turnover and delivering an overall gross margin exceeding 50%. Unit economics vary substantially by
              region: in the United States, average order ticket values hover around $500, which is approximately 10%
              higher than prevailing European transaction values and helps dilute fixed authentication overhead. To
              expand customer acquisition beyond its native application, Vestiaire Collective has established
              enterprise-grade commercial distribution channels. In May 2026, the company partnered with European
              e-commerce leader Zalando, integrating curated inventory from more than 50 luxury brands across 14
              European markets. This wholesale-like B2B2C arrangement grants Zalando's 62 million active users access to
              authenticated pre-owned luxury items backed by standard 30-day return policies and direct
              re-authentication workflows, accelerating circular luxury adoption among shoppers who previously avoided
              peer-to-peer transactions.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
