      - number: '4.3'
        title: Capital Adequacy, Valuation Trajectory, and Path to Profitability
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective has raised a cumulative $667 million across ten institutional funding rounds since
              its founding in 2009, including a landmark €178 million ($216 million) Series F round in 2021 co-led by
              Kering and Tiger Global Management that established its unicorn status. The company's implied post-money
              valuation peaked above $1.7 billion (€1.4 billion) during the pandemic e-commerce boom before adjusting
              downward to approximately €1.1 billion in 2024 amid broader secondary market multiple contractions.
              Following the transition of former CFO Bernard Osta to Chief Executive Officer and the departure of
              co-founder Fanny Moizant, the company achieved positive EBITDA during the fourth-quarter 2025 holiday
              shopping season and designated 2026 as the target for its first full annual net profit. Nonetheless, the
              lack of audited public financial disclosures regarding cash reserves, monthly net burn, and debt
              obligations represents a material underwriting constraint for prospective investors.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetization Quality and Margin Expansion Path
            body: >-
              Vestiaire Collective's realization of €200M in revenue on ~€1B GMV confirms a resilient 20% aggregate take
              rate in European luxury resale. Moving from holiday EBITDA positivity to full-year 2026 profitability
              hinges on sustaining Direct Shipping adoption to keep gross margin above 50% while capping authentication
              overhead.
            calloutType: insight
            claimRefs:
              - CI002
              - CI004
              - CI012
          - type: callout
            title: Capital Adequacy and Liquidity Underwriting Blocker
            body: >-
