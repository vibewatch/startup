      - number: '5.2'
        title: Data Infrastructure, Search, and Experimentation Pipeline
        blocks:
          - type: paragraph
            body: >-
              The core technology stack relies on a multi-tier continuous delivery and experimentation engine to support
              high-velocity merchandising and transaction conversion [CE005, CE006]. The engineering organization
              shifted from third-party search solutions such as Algolia to an in-house search platform, leveraging
              LaunchDarkly feature management across iOS, Android, and web clients [CE005]. This experimentation
              framework exports granular interaction logs directly to Snowflake for deep analytics, enabling data
              science and product teams to dynamically test machine learning ranking scores, seller pricing guidance
              models, and regional local-to-local transaction incentives [CE005]. Code pipelines, container image
              registries, and developer release workflows are unified through GitLab's DevSecOps platform and Jenkins
              CI/CD, replacing fragmented local Nexus artifact storage and Amazon Elastic Container Registry deployments
              [CE006]. Engineering teams monitor production deployments and flag rollouts by correlating LaunchDarkly
              activations with Datadog service health timelines, minimizing downtime risk during catalog re-indexing
              [CE005].
            claimRefs:
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
      - number: '5.3'
        title: Authentication Moat, Regulatory Passports, and Operational Controls
        blocks:
          - type: paragraph
            body: >-
              Platform trust is anchored in physical and digital authentication workflows designed to counter luxury
              counterfeiting, which represents the primary existential barrier in secondhand commerce [CE002, CE007,
              CE008]. Vestiaire Collective reports a counterfeit error rate below 1 in 1,000 transactions, supported by
              centralized inspection facilities and proprietary verification protocols [CE008]. To institutionalize
              compliance and streamline provenance, the company is preparing for European Union Digital Product Passport
              (DPP) regulations, partnering with Boston Consulting Group to advocate for standardized digital data
              storage and instant one-click resale integration with primary brand manufacturers [CE007]. Sellers are
              contractually bound under terms that penalize non-conforming or counterfeit merchandise with a fixed
              fifteen-dollar, euro, or pound administrative handling fee, alongside mandatory seller fee deductions
              capped at 30 percent [CE002]. However, sustaining sub-0.1% authentication error rates remains an
              operational risk as the platform scales domestic fulfillment in the United States while operating with a
              reduced workforce of approximately 600 employees [CE008].
            claimRefs:
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE008
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Algorithmic Routing as a Gross Margin Lever
            body: >-
              Vestiaire Collective's migration to an in-house search engine and LaunchDarkly experimentation platform
              allows engineering teams to dynamically prioritize domestic 'local-to-local' transactions [CE005, CE008].
              By tuning search rankings, the company increased domestic transaction share in the United Kingdom from 20%
              to 80%, substantially reducing cross-border shipping friction and logistics overhead [CE008]. Replicating
              this algorithmic steering in the United States is critical to closing the gap between 20% of GMV and 10%
              of revenue [CE008].
            calloutType: insight
            claimRefs:
              - CE005
              - CE008
          - type: callout
            title: Physical Authentication Bottlenecks at Scale
            body: >-
              While software components on AWS and MongoDB scale elastically with listing volume, the physical
              authentication layer requires specialized human and optical evaluation to maintain the sub-0.1%
              counterfeit error rate [CE003, CE008]. With corporate headcount streamlined to approximately 600 employees
              since 2022, sustaining stringent inspection turnaround times during surging North American volumes poses
              an operational risk to customer satisfaction and platform unit economics [CE008].
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective operates a multi-sided luxury resale ecosystem that bridges distinct buyer, seller,
              and enterprise partner segments across more than 40 countries. On the supply side, the platform segments
              participants into private individual sellers clearing personal wardrobes and professional boutique clients
              who manage curated inventories. To incentivize early adoption among individual consignors, Vestiaire
              Collective deploys promotional listing incentives such as zero selling fees on the first three items.
              Meanwhile, professional boutiques participate under distinct contractual terms and dedicated quarterly
              business reviews focusing on return on investment and inventory throughput. On the demand side, affluent
              fashion consumers seek authenticated designer ready-to-wear, leather goods, footwear, and accessories.
              Geographically, Europe remains the company's foundational core, generating approximately 70% of total
              revenue. The United States represents the second-largest geographic market, contributing roughly 20% of
              revenue following the strategic acquisition and operational absorption of Tradesy in 2022, with the
              remaining business driven primarily by Asia-Pacific hubs in Hong Kong and Singapore.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
