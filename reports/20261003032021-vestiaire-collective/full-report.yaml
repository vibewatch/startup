chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective SA is a French public limited company registered at 53 rue de Châteaudun in Paris.
              The company was founded in 2009 by Fanny Moizant, Sophie Hersan, and Sébastien Fabre. Its seller terms
              characterize the core service as an intermediation platform through which users buy and sell second-hand
              fashion; the company generally does not become the reseller or owner of an item, although its terms allow
              exceptional direct purchases. The current US-dollar fee page shows a 12% selling charge for items priced
              from $83 to $16,667 plus a 3% payment-processing fee, subject to stated floors and caps. This evidence
              supports a transaction-fee marketplace model, not an inventory-led retailer classification.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The available evidence establishes a material management transition but not a complete current governance
              map. By February 2026, former group CFO Bernard Osta had replaced Maximilian Bittner as chief executive
              after Bittner's nearly seven-year tenure. Modaes also reported that co-founder Fanny Moizant departed and
              said the decision had not been initiated by her. The same report placed workforce at about 600 after
              reductions from the 2022 high, without quantifying the reduction. These developments make execution
              dependent on a recently installed CEO and leave open questions about board composition, the operating
              roles of the other founders, succession protections, and whether restructuring has impaired authentication
              or marketplace service levels.
            claimRefs:
              - CO002
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO015
      - number: '1.3'
        title: Capital, Scale, and Profitability
        blocks:
          - type: paragraph
            body: >-
              TechCrunch reported a $216 million (EUR 178 million) financing in March 2021 at a valuation above $1
              billion, led by Kering and Tiger Global; Kering then owned 5%. Modaes later reported an approximately EUR
              1.1 billion valuation in 2024 versus EUR 1.4 billion in 2021, so the last located mark is historical
              rather than a current price. For 2025, CEO Bernard Osta told Bloomberg that goods sold were slightly below
              EUR 1 billion, revenue was EUR 200 million, and gross margin exceeded 50%. ECDB's separate $874 million
              figure is explicitly based on GMV and must not be presented as accounting revenue. Positive EBITDA was
              reported only for the year-end shopping season; the first annual profit remained a 2026 target.
            claimRefs:
              - CO005
              - CO006
