  topStrengths:
    - Large, recognizable European luxury resale marketplace with authenticated supply and brand-backed credibility.
    - >-
      Reported near-€1B of 2025 goods value and about €200M of revenue, with gross margin above 50% and improving
      profitability.
    - Strategic distribution expansion through the Zalando partnership and a broad international footprint.
  topRisks:
    - >-
      Current valuation is stale relative to the public record, and the report still lacks a supportable current equity
      price.
    - Cash burn, net debt, and the full preference waterfall remain unverified, limiting return underwriting.
    - Customer trust and authentication execution remain hard to quantify from public evidence.
    - The business still depends on two-sided marketplace liquidity and ongoing seller acquisition.
  unresolvedGaps:
    - Audited 2025 and 2026 financial statements, especially cash flow and net debt.
    - A complete preference and conversion waterfall for the capital structure.
    - Verified active customer and cohort-retention counts.
    - Category-level GMV, take rate, and partner economics for the Zalando and Kering initiatives.
    - Audited authentication-loss, refund, and dispute-resolution metrics.
