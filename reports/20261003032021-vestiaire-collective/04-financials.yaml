        - Official Seller Terms & Conditions
      - - Direct Shipping Exemption
        - Reduced fulfillment and inspection fee for peer-to-peer delivery
        - Zero physical authentication fee for eligible items
        - Eligibility criteria based on seller reputation and item price
        - Corporate Announcements & Help Centre
