callouts:
  - calloutType: insight
    title: Monetization Quality and Margin Expansion Path
    body: Vestiaire Collective's realization of €200M in revenue on ~€1B GMV confirms a resilient 20% aggregate take rate in European luxury resale. Moving from holiday EBITDA positivity to full-year 2026 profitability hinges on sustaining Direct Shipping adoption to keep gross margin above 50% while capping authentication overhead.
    claimRefs:
      - CI002
      - CI004
      - CI012
  - calloutType: risk
    title: Capital Adequacy and Liquidity Underwriting Blocker
    body: While the company has raised $667M and retains backing from Eurazeo and Kering, the lack of disclosure around cash on hand and monthly cash burn poses an underwriting blocker. If 2026 profitability is delayed, down-round or structured financing risks could resurface following the valuation contraction from €1.4B to €1.1B.
    claimRefs:
      - CI007
      - CI008
      - CI010
      - CI014
