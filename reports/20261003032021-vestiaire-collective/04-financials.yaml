      - - Maximum Commission Cap
        - Hard ceiling of 30% on transaction price
        - Effective average take-rate realized at ~20% of GMV
        - Exemptions possible for specialized professional contracts
        - Official Seller Terms & Conditions
      - - Payment Processing & Service Fee
        - Bundled or incremental transaction fee on buyer/seller
