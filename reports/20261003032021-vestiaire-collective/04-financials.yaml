company:
  name: Vestiaire Collective
chapter:
  number: 4
  title: Financials
  summary: Vestiaire Collective operates a two-sided luxury resale marketplace generating approximately €200M in net revenue on nearly €1B in GMV in 2025 (~20% take rate). After raising $667M across 10 funding rounds and undergoing multiple executive transitions, the company targets 2026 for its first full-year net profit following positive holiday EBITDA and a 2024 valuation adjustment to €1.1B.
sections:
  - id: revenue-model-and-monetization
    title: Revenue Model and Monetization Structure
    body: Vestiaire Collective operates a managed luxury resale marketplace connecting individual and professional sellers with buyers worldwide. The primary monetization engine is commission-based transaction fees deducted directly from product sales proceeds. Under the platform's seller terms, total seller fees are formally capped at thirty percent of the product price and vary by item price band, product category, and brand tier. In addition to core take-rate commissions, Vestiaire Collective generates ancillary revenue through optional digital and physical authentication services, buyer shipping and handling charges, and brand-direct partnerships such as its Brand Approved circular buy-back program. Historically, take rates have hovered near twenty percent on gross merchandise volume, creating a high-gross-margin revenue stream that reached roughly €200 million on just under €1 billion of marketplace GMV in 2025. However, realized monetization is constrained by competitive pricing pressure from peer platforms and fee discounting designed to incentivize high-value luxury inventory deposits.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: unit-economics-and-cost-structure
    title: Unit Economics, Fulfillment Costs, and Contribution Margins
    body: The marketplace's unit economics reflect the specialized operational demands of second-hand luxury authentication, cross-border logistics, and multi-currency processing. Management reported gross margins exceeding fifty percent in late 2025, supported by the expansion of its Direct Shipping model which bypasses physical authentication hubs for qualifying lower-risk seller transactions. For authenticated items, Vestiaire Collective maintains dedicated physical inspection hubs in Europe, the United States, and Asia Pacific employing over one hundred specialized authenticators. While Direct Shipping eliminates intermediary handling and reduces carbon emissions, physical inspection remains an unavoidable fixed and variable cost for high-ticket luxury goods where counterfeit risk is acute. Marketing expenditures, customer acquisition costs, and seller onboarding subsidies have historically absorbed a substantial portion of contribution profit, though recent restructuring and workforce reductions from peak 2022 levels to approximately 600 employees reflect an ongoing operational efficiency pivot.
    claimRefs:
      - CI003
      - CI004
      - CI006
      - CI011
      - CI013
    tableRefs:
      - TI003
  - id: capital-adequacy-and-profitability-path
    title: Capital Adequacy, Valuation Trajectory, and Path to Profitability
    body: Vestiaire Collective has raised a cumulative $667 million across ten institutional funding rounds since its founding in 2009, including a landmark €178 million ($216 million) Series F round in 2021 co-led by Kering and Tiger Global Management that established its unicorn status. The company's implied post-money valuation peaked above $1.7 billion (€1.4 billion) during the pandemic e-commerce boom before adjusting downward to approximately €1.1 billion in 2024 amid broader secondary market multiple contractions. Following the transition of former CFO Bernard Osta to Chief Executive Officer and the departure of co-founder Fanny Moizant, the company achieved positive EBITDA during the fourth-quarter 2025 holiday shopping season and designated 2026 as the target for its first full annual net profit. Nonetheless, the lack of audited public financial disclosures regarding cash reserves, monthly net burn, and debt obligations represents a material underwriting constraint for prospective investors.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI012
      - CI014
    tableRefs: []
