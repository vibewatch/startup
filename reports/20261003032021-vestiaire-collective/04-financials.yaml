      - - Institutional Anchor (Eurazeo)
        - Largest shareholder with 25% equity stake
        - Medium
        - Provides financial sponsorship stability across market cycles
        - Assess fund vintage and potential liquidity horizon pressure
      - - Net Cash & Monthly Burn
        - Undisclosed / Private
        - Medium
        - Determines runway until targeted 2026 annual profitability
        - Audit latest balance sheet cash reserves and monthly operating cash burn
