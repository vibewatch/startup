        - Category breakdown across apparel, leather goods, and watches
      - - Gross Margin
        - '> 50%'
        - Medium
        - Demonstrates unit contribution after fulfillment and authentication
        - Audited cost of sales breakdown including hub authentication labor
      - - Authentication Staffing
        - 100+ authenticators (out of ~600 staff)
        - Medium
        - Fixed operational headcount overhead required for quality control
        - 'Productivity metrics: verified items per authenticator per day'
      - - Customer Service Incident Losses
        - Full refund liability on lost/disputed shipments
        - Medium
        - Erodes transaction contribution margin and buyer retention
        - Dispute, loss, and chargeback rates as percentage of GMV
      - - Cumulative Capital Raised
        - $667M across 10 rounds
        - Medium
        - Extensive equity dilution and liquidation preference stack
        - Review full capitalization table and liquidation seniorities
      - - Latest Secondary Valuation
        - €1.1B (2024 secondary/internal) vs €1.4B (2021)
