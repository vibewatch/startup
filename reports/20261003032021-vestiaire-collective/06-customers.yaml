callouts:
  - calloutType: "risk"
    title: "Buyer Protection Deficits and Secondary Market Dispute Exposure"
    body: "Vestiaire Collective's legal terms strictly position the marketplace as an intermediary disclaiming contractual liability between buyers and sellers. When items arrive with undetected wear, damaged hardware, or disputed authenticity, buyers encounter limited recourse beyond being forced to relist the item for sale. Persistent customer reports of lost parcels and protracted credit card chargebacks highlight an operational friction point that threatens buyer lifetime value."
    claimRefs:
      - "CU011"
      - "CU014"
  - calloutType: "insight"
    title: "US Basket Premium Offsets Transatlantic Logistics Friction"
    body: "With average basket values in the United States reaching approximately $500—10% higher than European benchmarks—Vestiaire Collective captures superior unit margins on North American transactions. This pricing premium is essential to absorb higher transatlantic logistics, customs clearance, and specialized authentication labor costs while scaling market share against domestic US competitors."
    claimRefs:
      - "CU005"
      - "CU007"
