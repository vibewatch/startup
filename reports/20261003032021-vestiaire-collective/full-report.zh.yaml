        title: 资金实力、业务规模与盈利表现
        blocks:
          - type: paragraph
            body: >-
              据 TechCrunch 报道，公司于 2021 年 3 月完成 $216 million（EUR 178 million）融资，估值突破 $1 billion，由 Kering 与 Tiger Global
              领投；当时 Kering 持股 5%。Modaes 后续报道称，公司 2024 年估值约为 EUR 1.1 billion，低于 2021 年的 EUR 1.4
              billion，可见最新掌握的估值标杆属于历史数据而非现行价格。对于 2025 年表现，CEO Bernard Osta 向 Bloomberg 透露，商品销售额略低于 EUR 1 billion，营收为 EUR
              200 million，毛利率超过 50%。ECDB 另行给出的 $874 million 数据明确以 GMV 为基准，不可作为会计营收列示。公司仅在年末购物季录得 EBITDA 转正；全年首度实现盈利依然是
              2026 年的目标。
