        title: 关键里程碑与发展走向
        blocks:
          - type: paragraph
            body: >-
              现有证据展现了从平台搭建、疫情期起量、独角兽轮融资、赴美扩张，到近期注重经营效率的演进轨迹。据 TechCrunch 报道，平台 2020 年交易量翻倍，每周新增挂单 140,000 件。Modaes
              指出，2022 年收购 Tradesy 巩固了美国市场布局，而 2024 年估值回调与 2025 年管理层交接，标志着战略重点从粗放扩张转向盈利导向。2026 年 5 月，Zalando 将 Vestiaire
