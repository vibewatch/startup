      - number: '3.4'
        title: 护城河持久度、迁移成本与证伪性竞争风险
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective 的竞争护城河依托于多边跨国流动性网络、品牌官方背书的合规心智以及专用质检验真基础设施。欧洲贡献了公司 70% 的营业额，使得 Vestiaire
              在欧洲古典中古与老牌奢侈品时装屋货源供给上占据统治地位，这是北美竞对难以复制的优势。此外，奢侈品巨头 Kering
              的入股背书带来了纯数字交易平台所欠缺的产业级认证与一手奢侈品生态协同。然而，尽调同时暴露出明显的竞争软肋：买卖双边的平台迁移成本几乎为零，卖家利用第三方软件可在数秒内跨平台同步货品目录，彻底瓦解了库存独占性。此外，Vestiaire
              依托中心仓质检的托管物流带来严重的履约时效延迟：从欧洲调拨至北美并经实体质检中心查验的跨境交易往往需要 14 天交付周期，相较亚马逊式的急速履约体验给买家带来不小的阻力。Direct Shipping
              直邮选项亦将辨伪风险转嫁至买家一侧，使其面临精仿高仿假货侵扰与繁琐申诉维权流程。随着 eBay 等横向巨头持续扩充专业鉴真线，同时各大奢侈品牌相继试水内部二手闭环，Vestiaire Collective
              推进美国战略扩张时，持续承受抽成率压缩与获客成本高企的双重阻力。
            claimRefs:
