            body: >-
              自 2009 年成立以来，Vestiaire Collective 历经 10 轮机构融资，累计募资 $667 million，包括 2021 年由 Kering 和 Tiger Global
              Management 领投的里程碑式 €178 million（$216 million）F 轮融资，正式确立其独角兽地位。在疫情期间电商红利推动下，公司投后估值一度突破 $1.7 billion（€1.4
              billion）；随后在二级市场估值倍数普遍回调的背景下，于 2024 年下修至约 €1.1 billion。伴随前首席财务官 Bernard Osta 接任首席执行官以及联合创始人 Fanny Moizant
