              - CM003
              - CM004
              - CM005
      - number: '2.3'
        title: 买家、卖家与采纳路径
        blocks:
          - type: paragraph
            body: >-
              需求端由多重动机驱动，但核心仍是性价比。在 BCG 联合调研样本中，近 80% 的受访者将价格划算列为首要购买动机，约 55% 高度认同商品丰富度与独特性至关重要，约 40% 高度认同可持续理念。Mintel 在
              2019 年的独立调研显示，57% 的英国受访者认为过度购买时尚单品破坏环境，印证了环保叙事在 Vestiaire 用户群之外同样具备影响力，但这并未量化为实际购买转化。供给端触发机制截然不同：66%
              的抽样卖家以“清理衣橱”为由出售闲置；某奢侈品二手竞对向 Glossy
              表示，获取卖家的难度远高于买家。因此，付费主体具备双边属性：买家支付商品价款及结账附加费，卖家贡献货源并承担平台交易费率。采纳路径沿着挂单、检索发现、建立信任、完成支付与订单履约展开，而非依赖传统企业级预算决策人。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              三项积极信号支撑业务持续渗透：预期品类体量可观、对一手消费形成替代，以及平台活跃度得以维系。Vestiaire 2025 年 4 月对 3,500 多名活跃用户所做的调研显示，87%
              的购入商品替代了一手消费，50% 的用户在产生服装需求时会优先在 Vestiaire 搜索。历史维度上，TechCrunch 曾报道 2020 年交易量较 2019
              年翻倍，但特殊时期的爆发不宜直接线性外推至当前节点。制约因素同样不容忽视：问卷样本全部取自平台现有用户；卖家端拓展难度大；真伪鉴别、品相界定、物流配送及跨境摩擦深深关乎用户信任；特定品类供给增速可能持续跑赢实际动销。因此，估值应当紧扣经证实的
              GMV 增速、用户群留存、抽成率、边际贡献率、鉴真通过率及售罄率，而非单凭 $360 billion 的宏大标题下注。上述私营运营指标依然是市场尽调中最核心的空白。
            claimRefs:
              - CM002
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 图表分析
        blocks:
          - type: callout
            title: 赛道体量可观，能否转化仍待验证
            body: $360B 的市场预测仅可作为外围边界参考；公司市场份额、可变现地域覆盖、抽成率及复购留存等关键指标依然未见披露。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: 平台双边流动性制约
            body: 买方需求动因清晰可见，但卖家获客困难，加之中古品类供需增速脱节，可能直接制约交易流动性与最终转化。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接竞对、传统寄售巨头与综合型电商平台
        blocks:
          - type: paragraph
            body: >-
              二手服装与奢侈品转售格局依据货品托管模式、鉴真深度与品类重心，划分为四类截然不同的业务架构。在全托管奢侈品寄售层级，直接竞对 The RealReal
              采取全流程白手套寄售模式：平台负责实物接收、专业拍摄、编目入库与仓储管理，由此抽取交易总额 55% 至 85% 的毛抽成率。相比之下，Vestiaire Collective 采用混合型 C2C
              托管模式：卖家在售出前自行保管实物并拍摄照片，成交后经由集中质检中心查验发货或走 Direct Shipping 直邮。在 C2C 与社交电商层级，包括 eBay、Poshmark 和 Depop
              在内的综合型大平台拥有庞大的全球用户盘子（例如 eBay 拥有 134 million 名全球活跃买家），佣金率也更低，维持在 10% 至
              20%。这些横向平台起初主要面向大众市场与商场常见轻奢品牌，但近年来针对高价值腕表、球鞋和手袋大举推出 Authenticity Guarantee（正品保障）计划，正面冲击 Vestiaire
              Collective 的核心价值主张。最后，专业二手倒手倒卖客与中古买手店日益将独立 DTC 独立站（Shopify 与 WooCommerce）视作结构性替代方案，借此彻底规避平台抽成损耗与推荐算法波动。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 核心能力对比：鉴真物流、变现机制与全球网络覆盖
        blocks:
          - type: paragraph
            body: >-
              对照奢侈品核心消费诉求评估各大平台架构，可见卖家净到手分成、运营摩擦与防伪打假能力之间存在鲜明的结构性权衡。Vestiaire Collective 对标价 $83 至 $16,667 的商品统一定价收取 12%
              卖家佣金，外加 3% 且最低 $3 的支付处理费，折合常规奢侈品实际综合抽成率约 15%。较之 The RealReal，这一结构让奢侈品卖家获得高得多的净收益：以一只标价 $2,500 的设计师手袋为例，卖家在
              Vestiaire Collective 净到手约 $2,125，而在 The RealReal 仅得 $1,500，带来 $625 的净现金优势。然而，The RealReal
              帮寄售人免除全部上架工作，Vestiaire Collective 却要求卖家自行拍摄多角度细节、撰写详尽成色说明并妥善处理跨国包装。相较 Poshmark（统一定价 20% 佣金）与 eBay（约 15%
              综合费率）等宽泛平台，Vestiaire Collective 实行更严苛的品牌准入机制，明确剔除低端快时尚单品以确保目录的高端调性。信任体系仍是平台防守的基本盘：Vestiaire
              在欧洲与美国各大实物查验中心常驻 100 多名专职鉴真师，辅以上架前数字预审，并与持有约 5% 战略股权的奢侈品巨头 Kering 等行业领军者深度合作。
