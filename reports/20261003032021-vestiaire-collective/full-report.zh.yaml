  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可供投资的市场边界限定于二手时尚的交易额及平台服务；Vestiaire
              聚焦于设计师与高端奢侈品牌，而非宽泛的二手服装。其商城陈列涵盖箱包、珠宝腕表、成衣、鞋履、配饰、古着中古，覆盖女装、男装与童装，而现行卖家条款明确将服务定位于个人买家与卖家之间的居间中介。这一模式将一手奢侈品销售、大众二手旧衣、衣物修护、服装租赁以及底层循环时尚基础设施排除在核心市场之外，尽管各项均属邻近赛道或替代路径。现存的替代选择还包括留存自用、赠予他人、送交线下寄售店，或走纯个人对接的无保障渠道。厘清该边界至关重要：若将整体二手时尚与奢侈品市场的预测规模直接套用，却不对品类、地域、线上渗透率、平台份额、交易频次及抽成费率做扣减调整，势必严重高估
              Vestiaire 实际能够商业化的支出盘子。
            claimRefs:
              - CM001
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM014
              - CM015
      - number: '2.2'
        title: 基于证据约束的市场空间测算
        blocks:
          - type: paragraph
            body: >-
              目前最有力的自上而下参考依据是 BCG 与 Vestiaire Collective 联合发布的 2025 年研究报告。报告称，全球二手时尚与奢侈品市场规模到 2030 年可达 $360
              billion，年均复合增速为 10%，相当于一手市场的三倍。但这充其量是方向性的 TAM 代标，绝非 Vestiaire 自身经过验证的真实 TAM：发布材料未公开完整测算模型，且消费者层面的证据仅来自
              7,800 名 Vestiaire 既有用户。在该特定样本中，二手商品占衣橱总量的 28%，其中服装占 30%，手袋占 40%。TheIndustry.fashion
              报道的平台数据显示出另一重需求视角：Vestiaire 表示五年内平台中古古着供给增长 220%，而同期销售仅增长
              80%。增速脱节可能源于选品扩容、动销放缓、基数差异或品类结构迁移；现有公开材料无法明确归因。鉴于保留信源均未披露当前 GMV、抽成率、活跃交易用户数、地域分布及品类结构，强行测算数值化的 SAM 或 SOM
              只会沦为伪精度。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
