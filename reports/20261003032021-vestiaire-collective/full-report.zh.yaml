      - number: '3.3'
        title: 商业化变现框架与平台收费模型
        blocks:
          - type: paragraph
            body: >-
              奢侈品转售平台的变现路径映射出各自截然不同的成本结构与运营重心。Vestiaire Collective 协议条款规定卖家综合费率法定上限不超过 30%，常规个人消费品交易按 12% 销售佣金加 3%
              支付处理费执行。对于售价低于 $83 的入门级商品，Vestiaire 设定最低 $10 的固定收费，这给低客单价商品带来极高的费率拖累，意在引导卖家上架更高价值的设计师单品。增值服务带来额外变现杠杆：买家在走
              Direct Shipping 直邮交易时，可自主选择补缴 $15 至 $25 鉴真服务费，将商品转送实物查验中心检测。相比之下，The RealReal 等寄售型老牌巨头抽取高达 55% 至 85%
              的成交额，以覆盖实体仓储、自建摄影团队与专业文案撰写的沉重履约成本。面对平台抽佣对利润的侵蚀，大体量专业卖家往往转向多平台跨栖经营：专业卖家借助自动化多挂单软件将同一批库存同步铺设在 Vestiaire
              Collective、eBay 与 Poshmark 上，同时将高客单价老客户导流至自有 DTC 独立站，使每笔交易的支付处理费骤降至约 2.9% 加 $0.30。
