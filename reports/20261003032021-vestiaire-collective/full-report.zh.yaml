      - CV014
  - id: TV003
    title: 乐观、基准与悲观估值区间
    columns:
      - 情景
      - 运营假设
      - 估值区间
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - FY2026 实现经审计的盈利、持续的正向自由现金流，以及稳定的信任损失指标。
        - 高于据报道的 2024 年 €1.1 billion 参考值；尚无公开证据支撑具体的数字上限。
        - 在经审计结果出炉前偏低。
        - 盈利未能转化为正向自由现金流。
      - - 基准情景
        - 近期盈利得以维持，但现金转化与业务增长仅得到初步证实。
        - 接近据报道的 2024 年 €1.1 billion 参考值，并根据净负债与优先股权利进行调整。
        - 作为尽调基准锚点为中，并非确定定价的结果。
        - 当前融资定价低于 2024 年参考值。
      - - 悲观情景
        - 未达年度盈利目标、信任维护成本攀升，或被迫以更严苛的条款引入外部资本。
        - 大幅低于据报道的 2024 年 €1.1 billion 参考值；尚无公开证据支撑估值底线。
        - 鉴于证据缺口尚未补齐，概率较为可观。
        - 自由现金流为负、出现低估值轮次（Down-round）条款，或经核实的纠纷队列指标恶化。
    notes: 各区间均相对于据报道的 2024 年公司估值，并不构成企业价值、股权要约、预测或经概率加权的加权目标价。
    claimRefs:
