      - number: '3.5'
        title: 图表分析
        blocks:
          - type: callout
            title: 奢侈品转售的不可能三角：抽成率、卖家摩擦与假货风险
            body: >-
              奢侈品二手平台必须在三大对立诉求之间寻找平衡：最大化卖家净收益、最小化上架操作成本与保障正品货真价实。The RealReal 免除了上架操作琐事，却向卖家开出 55% 至 85% 的严苛佣金。Poshmark
              等 C2C 应用分成相对友好，却缺乏严格的实物鉴真机制，买家面临精仿高仿假货风险。Vestiaire Collective 将护城河锚定在平衡点上——向卖家提供约 85% 的净到手收益，同时设立 100
              多名专职鉴真师维系买家信任。但维持该平衡要求买卖双方容忍手动上架操作以及长达 14 天的跨国物流耗时。
