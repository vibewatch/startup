      - CV003
      - CV005
      - CV006
      - CV013
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 分析维度
      - 投资逻辑
      - 反向逻辑
      - 何种变化会改变观点
    rows:
      - - 规模与变现
        - 据报道，2024 年 GMV 接近 €1 billion，对应营业额约 €200 million。
        - GMV 并非营业收入，且两项指标均不能证明自由现金流状况。
        - 经审计的 GMV 至营收调节表、变现率及现金转化率。
      - - 利润率拐点
        - 据报道毛利率超过 50%，且管理层表示 2026 年已有数个月实现盈利。
        - 保留的证据并未证明公司已实现完整的年度盈利。
        - 经审计的 FY2026 净利润与正向自由现金流。
      - - 资本支持
        - 2021 年的两轮大额融资吸引了成熟的财务与战略投资机构。
        - 据报道 2024 年估值已低于 2021 年峰值，且优先股的高级权利可能重新划分清算收益。
        - 当前的定价融资轮次以及完整的清算与转换分配瀑布流。
      - - 信任模型
        - 平台将居间撮合与品控及真伪鉴定流程相结合。
        - 用户偶发投诉指称存在假货、成色不符、退款受阻及客服不力等问题。
        - 队列层面的真伪鉴定漏检率、退款率、争议率、货损率及复购率。
    notes: 反向逻辑审慎参考了据报道及传闻证据；客户投诉指出了尽调关注点，但不能衡量平台整体的发生概率。
