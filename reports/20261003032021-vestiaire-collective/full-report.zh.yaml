            body: >-
              该交易平台的单体经济模型由二手奢侈品实物鉴真、跨国物流与多币种结算等特殊运营要求共同塑造。管理层披露，2025 年底毛利率已超过五成，这得益于 Direct Shipping
              直邮模式的推广——符合条件的低风险卖家交易可绕过线下实体质检中心。针对需鉴真商品，Vestiaire Collective 在欧洲、美国和亚太设有专门的实体查验中心，聘请了 100
              多名专业鉴真师。尽管直邮省去了中间仓储流转环节并降低了碳排放，但在假货风险极为敏感的高客单价奢侈品领域，实物查验依然是不可避免的固定与变动成本。历史数据表明，营销开支、获客成本及卖家入驻补贴侵蚀了大量边际贡献利润；不过，近期组织架构调整以及人员规模从
              2022 年峰值精简至约 600 人，反映出公司正持续转向追求运营效率。
