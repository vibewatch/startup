  - id: TV001
    title: 投资建议汇总
    columns:
      - 维度
      - 评估结论
      - 证据边界
      - 决策涵义
    rows:
      - - 投资建议
        - 观察 / 继续研究
        - 业务规模与据报道的月度盈利拐点清晰可见；经审计的全年现金转化则尚未证实。
        - 在财务与资本结构缺口补齐前，暂勿对投资进行定价。
      - - 置信度
        - 中低
        - 2024 年核心指标与 2026 年进展均来自媒体报道的高管声明。
        - 在上调置信度之前，须要求提供经审计的财务报表与勾稽调节表。
      - - 风险评级
        - 高
        - 据报道尚未实现完整的盈利财年，且高度依赖信任的平台运营挑战依然显著。
        - 须要求提供下行保护条款与可衡量的运营契约。
      - - 估值立场
        - 难以确定至偏高
        - €1.1 billion 这一数字属于据报道的 2024 年参考估值，并非经核实的当前实际交易价格。
        - 坚决拒绝仅凭 2021 年或 2024 年公开标杆估值支撑的入场定价。
    notes: 评估基于截至 2026-10-03 的公开证据；2024 年估值仅为历史参考，不构成当前要约或企业价值测算。
