chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务主体与商业模式
        blocks:
          - type: paragraph
            body: >-
              Vestiaire Collective SA 是一家法国股份有限公司，注册地址位于巴黎 53 rue de Châteaudun。公司由 Fanny Moizant、Sophie Hersan 与
              Sébastien Fabre 于 2009 年创立。卖家条款将核心服务界定为二手时尚买卖居间平台；除极少数例外情况下的直接采购外，公司通常不担任转售商，也不持有商品所有权。当前美元收费页面显示，对售价 $83
              至 $16,667 的商品收取 12% 的销售费，外加 3% 的支付处理费，并设有明确的保底与封顶金额。上述证据支撑其属于抽取交易佣金的平台模式，而非自营库存型零售商。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              现有证据证实管理层经历重大交接，但尚无法拼出完整的现行治理版图。截至 2026 年 2 月，执掌公司近七年的首席执行官 Maximilian Bittner 离任，由前集团 CFO Bernard Osta
              接任。Modaes 同时报道称，联合创始人 Fanny Moizant 离职，并表示该决定并非由她主动提出。该报道还提及，较 2022 年峰值裁员后员工规模约为 600
              人，但未量化裁减幅度。这些变动让执行力系于新任 CEO 身上，并留下诸多待解问题：董事会具体构成、其他创始人的运营分工、接班机制保障，以及重组是否削弱了鉴真水准或平台服务质量。
            claimRefs:
              - CO002
              - CO015
              - CO016
