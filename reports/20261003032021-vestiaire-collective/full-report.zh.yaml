        - 中
        - 拓展非开云系奢侈品牌合作以分散风险（Chloé、Isabel Marant）
        - 失去奢侈品巨头对真伪鉴定公信力的背书
      - - 人才吸引与留存
        - 内部运营与技术团队
        - 平台软件工程及真伪鉴定专业人员
        - 科技 / 成长期企业人才市场竞争激烈
        - 主动离职阻碍平台持续迭代优化
        - 中
        - 员工免费配股激励、混合办公模式与 360 度绩效考核
        - 薪资通胀，且成长期主动离职率达到 17%
    notes: 按严重程度排序。交易对手方关系源自官方法定文件及新闻公告。
