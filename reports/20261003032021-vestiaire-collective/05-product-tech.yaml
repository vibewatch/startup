chapter:
  number: 5
  title: "Product & Technology"
  summary: "Vestiaire Collective operates a managed luxury resale marketplace pairing a peer-to-peer catalog with physical authentication hubs and direct shipping, underpinned by microservices on AWS and MongoDB Atlas. Its technology stack integrates LaunchDarkly for machine-learning-driven search and pricing experimentation alongside GitLab DevSecOps, though scaling across North America tests authentication throughput and unit economics against counterfeit risks."
sections:
  - id: "product-service-definition"
    title: "Marketplace Workflow and Core Product Architecture"
    body: "Vestiaire Collective provides a managed peer-to-peer luxury fashion resale platform connecting buyers and sellers across more than 80 countries [CE001, CE003]. The customer workflow distinguishes between direct shipping for trusted peer transactions and physical authentication routing where high-value items undergo inspection before delivery [CE002]. Sellers can list inventory via standard web and mobile workflows, including automated Smart Listing functionality that processes product photographs to streamline catalog creation [CE004]. To manage listings across 7,000 luxury brands, Vestiaire Collective migrated its legacy monolithic codebase away from Subversion into a microservices architecture hosted on AWS [CE003, CE006]. The operational platform decouples customer-facing catalog browsing, order orchestration, and social community feeds, using MongoDB Atlas document databases to handle real-time inventory queries across 550,000 new monthly listings without cluster maintenance overhead [CE003]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "architecture-experimentation-data"
    title: "Data Infrastructure, Search, and Experimentation Pipeline"
    body: "The core technology stack relies on a multi-tier continuous delivery and experimentation engine to support high-velocity merchandising and transaction conversion [CE005, CE006]. The engineering organization shifted from third-party search solutions such as Algolia to an in-house search platform, leveraging LaunchDarkly feature management across iOS, Android, and web clients [CE005]. This experimentation framework exports granular interaction logs directly to Snowflake for deep analytics, enabling data science and product teams to dynamically test machine learning ranking scores, seller pricing guidance models, and regional local-to-local transaction incentives [CE005]. Code pipelines, container image registries, and developer release workflows are unified through GitLab's DevSecOps platform and Jenkins CI/CD, replacing fragmented local Nexus artifact storage and Amazon Elastic Container Registry deployments [CE006]. Engineering teams monitor production deployments and flag rollouts by correlating LaunchDarkly activations with Datadog service health timelines, minimizing downtime risk during catalog re-indexing [CE005]."
    claimRefs:
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE002"
  - id: "trust-compliance-differentiation"
    title: "Authentication Moat, Regulatory Passports, and Operational Controls"
    body: "Platform trust is anchored in physical and digital authentication workflows designed to counter luxury counterfeiting, which represents the primary existential barrier in secondhand commerce [CE002, CE007, CE008]. Vestiaire Collective reports a counterfeit error rate below 1 in 1,000 transactions, supported by centralized inspection facilities and proprietary verification protocols [CE008]. To institutionalize compliance and streamline provenance, the company is preparing for European Union Digital Product Passport (DPP) regulations, partnering with Boston Consulting Group to advocate for standardized digital data storage and instant one-click resale integration with primary brand manufacturers [CE007]. Sellers are contractually bound under terms that penalize non-conforming or counterfeit merchandise with a fixed fifteen-dollar, euro, or pound administrative handling fee, alongside mandatory seller fee deductions capped at 30 percent [CE002]. However, sustaining sub-0.1% authentication error rates remains an operational risk as the platform scales domestic fulfillment in the United States while operating with a reduced workforce of approximately 600 employees [CE008]."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
