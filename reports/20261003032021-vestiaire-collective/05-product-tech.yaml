callouts:
  - calloutType: "insight"
    title: "Algorithmic Routing as a Gross Margin Lever"
    body: "Vestiaire Collective's migration to an in-house search engine and LaunchDarkly experimentation platform allows engineering teams to dynamically prioritize domestic 'local-to-local' transactions [CE005, CE008]. By tuning search rankings, the company increased domestic transaction share in the United Kingdom from 20% to 80%, substantially reducing cross-border shipping friction and logistics overhead [CE008]. Replicating this algorithmic steering in the United States is critical to closing the gap between 20% of GMV and 10% of revenue [CE008]."
    claimRefs:
      - "CE005"
      - "CE008"
  - calloutType: "risk"
    title: "Physical Authentication Bottlenecks at Scale"
    body: "While software components on AWS and MongoDB scale elastically with listing volume, the physical authentication layer requires specialized human and optical evaluation to maintain the sub-0.1% counterfeit error rate [CE003, CE008]. With corporate headcount streamlined to approximately 600 employees since 2022, sustaining stringent inspection turnaround times during surging North American volumes poses an operational risk to customer satisfaction and platform unit economics [CE008]."
    claimRefs:
      - "CE003"
      - "CE008"
