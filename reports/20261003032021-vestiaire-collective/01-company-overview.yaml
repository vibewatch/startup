chapter:
  number: 1
  title: "Company Overview"
  summary: "Vestiaire Collective is a Paris-registered marketplace for second-hand fashion founded in 2009. Independent reporting attributes slightly less than EUR 1 billion of 2025 goods value and EUR 200 million of revenue to the business, but the current valuation, cumulative funding, customer count, cap table, and full-year profitability remain unverified."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Vestiaire Collective SA is a French public limited company registered at 53 rue de
      Châteaudun in Paris. The company was founded in 2009 by Fanny Moizant, Sophie Hersan,
      and Sébastien Fabre. Its seller terms characterize the core service as an
      intermediation platform through which users buy and sell second-hand fashion; the
      company generally does not become the reseller or owner of an item, although its
      terms allow exceptional direct purchases. The current US-dollar fee page shows a
      12% selling charge for items priced from $83 to $16,667 plus a 3% payment-processing
      fee, subject to stated floors and caps. This evidence supports a transaction-fee
      marketplace model, not an inventory-led retailer classification.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The available evidence establishes a material management transition but not a
      complete current governance map. By February 2026, former group CFO Bernard Osta
      had replaced Maximilian Bittner as chief executive after Bittner's nearly seven-year
      tenure. Modaes also reported that co-founder Fanny Moizant departed and said the
      decision had not been initiated by her. The same report placed workforce at about
      600 after reductions from the 2022 high, without quantifying the reduction. These
      developments make execution dependent on a recently installed CEO and leave open
      questions about board composition, the operating roles of the other founders,
      succession protections, and whether restructuring has impaired authentication or
      marketplace service levels.
    claimRefs:
      - "CO002"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "capital-and-operating-scale"
    title: "Capital, Scale, and Profitability"
    body: >-
      TechCrunch reported a $216 million (EUR 178 million) financing in March 2021 at a
      valuation above $1 billion, led by Kering and Tiger Global; Kering then owned 5%.
      Modaes later reported an approximately EUR 1.1 billion valuation in 2024 versus EUR
      1.4 billion in 2021, so the last located mark is historical rather than a current
      price. For 2025, CEO Bernard Osta told Bloomberg that goods sold were slightly below
      EUR 1 billion, revenue was EUR 200 million, and gross margin exceeded 50%. ECDB's
      separate $874 million figure is explicitly based on GMV and must not be presented as
      accounting revenue. Positive EBITDA was reported only for the year-end shopping
      season; the first annual profit remained a 2026 target.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO013"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "milestones-and-current-direction"
    title: "Milestones and Current Direction"
    body: >-
      The evidence shows a progression from marketplace formation to pandemic-era scale,
      unicorn financing, US expansion, and a more recent efficiency phase. Transaction
      volume doubled in 2020 and the platform was adding 140,000 listings per week,
      according to TechCrunch. Modaes says the 2022 Tradesy acquisition strengthened the
      US presence, while the 2024 valuation reset and 2025 leadership changes mark a shift
      from expansion toward profitability. In May 2026, Zalando made Vestiaire Collective
      its first pre-owned partner for authenticated luxury and offered the assortment in
      14 European markets. That distribution partnership broadens reach, but the supplied
      evidence does not disclose economics, exclusivity, customer conversion, or
      incremental GMV.
    claimRefs:
      - "CO007"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
