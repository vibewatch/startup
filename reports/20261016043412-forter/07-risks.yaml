      - ["PSD2 / SCA and payment-optimization compliance","EU / UK and card-network relevant markets","Forter explicitly markets payment optimization as helping merchants maintain PSD2 compliance.","Medium","High","Product positioning shows control ownership, but ongoing rules, issuer behavior, and exception handling are external moving parts.","Medium-High","Review compliance ownership, change-management logs, exception handling, and merchant allocation of regulatory risk."]
      - ["Chargeback restitution and dispute-liability terms","Merchant contracts / global","Wikipedia says Forter offers full restitution in the event of a chargeback, while Forter also sells dispute-management tooling.","Medium","High","Workflow maturity appears real, but reserve policy, carve-outs, and loss-sharing economics are not public here.","High","Request standard guarantee terms, reserve methodology, loss-rate history, and top merchant carve-outs."]
    notes: >-
      Ordered by residual severity using only the assigned source pool; legal exposure is framed as diligence
      risk where current third-party control evidence is missing.
