      - ["Implementation delays for enterprise custom integrations","High","Medium-High","Stork says setup and integration can take one to two months for custom deployments, which implies repeatable but heavy onboarding work.","Medium-High","Need implementation timeline distributions by merchant size and connector type."]
      - ["Support bottlenecks during merchant issues or product changes","Medium","Medium","Stork says support response times can vary, but the pool does not show current support-SLA disclosure or escalation evidence.","Medium","Need SLA metrics, escalation paths, and support staffing ratios."]
      - ["Product-sprawl risk from new AI agents and continuous release cadence","Medium","Medium-High","Forter added Agents and Prism recently, and the Radar post says R&D investment continues to expand the offering.","Medium-High","Need release-governance evidence, rollback discipline, and customer adoption quality by new module."]
    notes: >-
      Combines explicit product claims with independent deployment caveats; unavailable operating KPIs remain
      diligence asks rather than inferred incidents.
    claimRefs: [CR001, CR003, CR006, CR007, CR008, CR009]
