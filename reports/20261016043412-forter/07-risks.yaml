  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance-controls
      missingEvidence: Current trust-center evidence, certifications, DPA/subprocessor detail, and public regulator correspondence tied to Forter's identity and payments workflows.
      whyItMatters: The source pool supports material privacy, AI-decision, and PSD2-sensitive exposure, but not the exact control stack needed to underwrite compliance confidence.
      diligencePath: Request the current trust-center pack, external attestations, AI governance policy, and any open regulator or card-network issues.
      relatedQuestionRefs: [QR002, QR006]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: guarantee-economics
      missingEvidence: Reserve methodology, loss ratios, carve-outs, and cohort economics behind any chargeback restitution or dispute-liability commitments.
      whyItMatters: Liability-bearing promises can turn a growth story into a margin or cash-consumption risk if contract terms and reserves are weaker than public messaging suggests.
      diligencePath: Review standard merchant terms, guarantee schedules, reserve reports, and loss history by merchant cohort.
      relatedQuestionRefs: [QR002, QR005]
      relatedTableRefs: [TR001, TR003]
    - type: missing-source
      severity: material
      topic: partner-concentration
      missingEvidence: Current partner-attributed revenue mix, top-customer concentration, and renewal or churn detail by partner channel.
      whyItMatters: Partner-powered scale is central to Forter's go-to-market, so concentration or weak replacement optionality could magnify churn and bargaining pressure.
      diligencePath: Request channel mix, top-10 customer ARR, partner pipeline contribution, and gross-profit retention by cohort.
      relatedQuestionRefs: [QR004, QR005]
      relatedTableRefs: [TR003]
