      - ["Bank / PSP / platform relationships","Capital One, FreedomPay, Nuvei, Flutterwave, eCommerce and SI ecosystem","Distribution, authorization uplift, onboarding, and integration leverage","Meaningful, but revenue or GMV mix is not public here","Partner rule changes, API friction, or commercial churn reduce approval lift and go-to-market reach.","High","Multiple named partners help, but economics and replacement costs are opaque.","Medium-High"]
      - ["Merchant contract economics around chargebacks and disputes","Merchants using restitution or dispute tooling","Loss sharing, recovery workflow, and renewal economics","Unknown publicly","Guarantee obligations or concessions compress margin when fraud mix worsens.","Medium-High","Dispute-management tooling exists, but public reserve methodology and carve-outs are absent.","High"]
    notes: >-
      Dependency rows focus on counterparties visible in the assigned pool; concentration remains a public-data
      gap unless management supplies cohort and channel detail.
    claimRefs: [CR002, CR010, CR011, CR016]
