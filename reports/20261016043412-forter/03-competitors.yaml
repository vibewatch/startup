      - ["Payment optimization", "Official product list includes Payment Optimization", "Unknown in retained pool", "Unknown in retained pool", "Requires issuer and PSP data integration"]
      - ["Dispute management", "Toolradar and AI Central Resources describe dispute tooling", "Unknown in retained pool", "Unknown in retained pool", "Requires evidence collection and workflow automation"]
      - ["Account protection", "Toolradar and official product surfaces identify account protection", "Unknown in retained pool", "Unknown in retained pool", "Requires session and identity signals"]
      - ["Policy-abuse prevention", "Official product list includes Abuse Prevention", "Unknown in retained pool", "Unknown in retained pool", "Requires merchant-specific policy governance"]
      - ["Agentic commerce", "Official docs describe catalog, inventory, checkout, and payment orchestration", "Unknown in retained pool", "Unknown in retained pool", "Official docs say multi-platform build requires significant engineering"]
    notes: "The matrix records only capabilities visible in assigned sources; it does not score unknown competitor cells as absent."
    claimRefs: [CP004, CP007, CP008, CP009, CP013, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offer or alternative
      - Public pricing signal
      - Included scope
      - Key unknown
      - Buyer implication
    rows:
      - ["Forter covered model", "Custom quote; transaction or decision-volume signal", "Decisioning plus defined chargeback liability", "Rates, exclusions, caps, and reconciliation terms", "Compare premium with verified loss transfer and approval lift"]
      - ["Forter uncovered model", "Custom quote", "Technology decisioning while merchant retains liability", "Unit rates and module allocation", "Separates software value from insurance-like coverage"]
      - ["Forter additional modules", "No public module price card", "Payments, disputes, accounts, abuse, and integrations", "Services, implementation, and bundle discounts", "Request a module-level proposal and ramp schedule"]
      - ["Named direct peers", "No usable pricing evidence in assigned pool", "Unknown on a comparable basis", "List price, realized price, guarantees, and services", "Run a same-volume request for proposal rather than infer savings"]
    notes: "Pricing evidence is directional and quote-based; no retained source provides comparable realized contract rates."
    claimRefs: [CP005, CP011]
