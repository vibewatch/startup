callouts:
  - calloutType: risk
    title: Public pricing is not comparable
    body: >-
      Forter's covered and uncovered options create meaningful economic differences, but no retained
      source discloses unit rates, implementation fees, exclusions, or peer contract prices.
    claimRefs: [CP005, CP011]
  - calloutType: recommendation
    title: Test the moat with merchant-level evidence
    body: >-
      Underwrite differentiation only after cohort-level approval, fraud-loss, false-positive,
      multi-homing, renewal, and migration data are compared with named alternatives.
    claimRefs: [CP010, CP012, CP015]
