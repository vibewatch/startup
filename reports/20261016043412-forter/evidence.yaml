evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table completeness
    missingEvidence: Current executive roster, board composition, board observers, and control-right disclosures.
    whyItMatters: Leadership concentration and governance rights shape execution risk, succession risk, and investor control.
    diligencePath: Request the latest board deck, board list, and governance summary from management or lead investors.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map completeness
    missingEvidence: >-
      Authoritative cap table, ownership percentages, liquidation preferences, pro-rata rights, and any post-2021
      secondary transactions.
    whyItMatters: Named investors alone do not show who controls board seats, economics, or downside protection.
    diligencePath: >-
      Request the current cap table, financing documents, and board-rights summary covering Series E, Series F, and any
      later transfers.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: current scale metrics
    missingEvidence: Corroborated current figures for headcount, annual GMV or transactions, protected consumers, and customer count.
    whyItMatters: >-
      Scale is central to market position, operating leverage, and valuation, but the retained public numbers are old or
      inconsistent.
    diligencePath: >-
      Ask management for the latest KPI pack and reconcile it against board materials, data-room metrics, and customer
      concentration tables.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current independent 2025-2026 market dataset that defines category boundary, geography, spend basis, and a
      Forter-relevant TAM/SAM/SOM methodology.
    whyItMatters: >-
      Without a transparent independent sizing source, valuation work can only rely on scale proxies and contract
      economics rather than defendable market-share assumptions.
    diligencePath: >-
      Retain a current analyst, trade-association, public-company, or government source that sizes digital-commerce
      fraud, trust, or payment-optimization spend with methodology details.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Current customer-count mix, average contract scale by segment, and attach rates for account protection, abuse
      prevention, and guarantee products.
    whyItMatters: >-
      These variables determine whether Forter’s growth depends on broad category expansion, enterprise concentration,
      or wallet-share expansion inside existing customers.
    diligencePath: >-
      Seek customer segmentation, public-case-study counts by vertical, procurement records, or management disclosures
      that isolate product and vertical mix.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Merchant-level incremental approval, fraud-loss, false-positive, retention, network-overlap, and migration data
      versus named peers.
    whyItMatters: >-
      Without normalized outcomes and switching evidence, network effects and workflow breadth cannot be translated into
      durable competitive advantage.
    diligencePath: >-
      Request blinded cohort comparisons, renewal and multi-homing data, model-ablation results, and reference calls
      from merchants that evaluated or replaced named alternatives.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: displacement-risk
    missingEvidence: >-
      Independent evidence of recent displacement, bundling pressure, commoditization, or incumbent response in Forter's
      target segment.
    whyItMatters: >-
      The current pool identifies competitors but does not show win-loss direction or how quickly adjacent suites can
      close the gap.
    diligencePath: >-
      Obtain recent procurement scorecards, competitor customer references, win-loss data, and same-volume proposals
      from at least two direct peers and one incumbent.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized unit prices, implementation fees, guarantee exclusions, discount schedules, and total contract
      value across Forter and peers.
    whyItMatters: Quote-based packaging prevents a reliable public total-cost or risk-adjusted return comparison.
    diligencePath: >-
      Run a normalized request for proposal using the same transaction volume, fraud mix, modules, service levels, and
      liability allocation.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized pricing, contract structure, discounting, and revenue mix by module or customer cohort.
    whyItMatters: Without it, transaction scale cannot be converted into an underwriting-quality revenue or gross-profit model.
    diligencePath: Request current price books, standard MSA language, realized ASP by product, and revenue mix by module.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, retention, and customer concentration by revenue cohort.
    whyItMatters: These inputs determine whether historical growth translated into efficient and defensible economics.
    diligencePath: Request audited P&L extracts, board KPI packs, cohort retention, and sales-efficiency dashboards.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash on hand, monthly burn, debt or covenants, and management's next-round trigger.
    whyItMatters: The chapter cannot clear financing dependency or downside runway without a current liquidity snapshot.
    diligencePath: Request the latest balance sheet, cash-bridge, debt schedule, and 12- to 18-month operating plan.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: valuation-currentness
    missingEvidence: Post-2021 primary or secondary price discovery plus current preference-stack and dilution terms.
    whyItMatters: The last disclosed round is too old to establish today's valuation risk or financing flexibility.
    diligencePath: Request recent 409A marks, secondary trades, cap-table terms, and any post-Series-F financing updates.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner telemetry such as repos, package usage, forum traffic, or independent operator
      communities tied directly to Forter's product stack.
    whyItMatters: >-
      Product breadth claims rely heavily on company surfaces and commercial intermediaries without a matching
      operator-side adoption signal.
    diligencePath: >-
      Ask management for customer-admin communities, public SDK or integration telemetry, or named practitioner
      references that show how operators use the platform in production.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: control-governance
    missingEvidence: >-
      False-positive governance, override workflows, incident postmortems, and precision or recall reporting by module
      or merchant cohort.
    whyItMatters: >-
      Trust and safety quality depends on how decisions are governed after deployment, not just on launch cadence or
      marketing claims.
    diligencePath: >-
      Request product-control documentation, model-governance reviews, and customer-level operating metrics for
      approvals, false declines, disputes, and abuse policy tuning.
  - type: missing-source
    severity: material
    topic: implementation-economics
    missingEvidence: >-
      Customer-verified implementation timelines, staffing burden, and module-specific pricing or attachment by
      deployment model.
    whyItMatters: >-
      Independent sources suggest operating burden and coverage choices meaningfully change ROI, but the assigned pool
      does not quantify that burden.
    diligencePath: >-
      Obtain reference calls and implementation plans from direct-enterprise and PSP-channel customers, then compare
      staffing and time-to-value by module.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: retention-opacity
    missingEvidence: Forter's NRR, GRR, logo churn, average contract term, and renewal cadence by customer cohort.
    whyItMatters: >-
      Without retention and renewal evidence, it is not possible to separate sticky enterprise adoption from short-lived
      transaction-volume spikes or partner-led merchant reach.
    diligencePath: Ask management for cohort retention tables, renewal schedules, and customer-success dashboards by ARR band.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-partner concentration by ARR, GMV processed, and approval-volume dependency.
    whyItMatters: >-
      Large-logo breadth does not answer whether revenue is concentrated in a small number of merchants, PSPs, or
      platform channels.
    diligencePath: Request top-10 customer and partner concentration schedules with churn history and renewal dates.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Exhaustive list of publicly referenceable customers with deployment status, geography, and measurable outcomes.
    whyItMatters: >-
      The named-customer proof table is only a partial sample, so it cannot be used to infer full customer
      diversification or production depth.
    diligencePath: >-
      Build a complete customer-reference register from management, then reconcile it to public proof and contract
      status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: customer-outcomes
    missingEvidence: Baseline-adjusted before/after outcome studies with identifiable customers and time windows.
    whyItMatters: >-
      Outcome testimonials are directionally positive, but they do not show enough baseline detail to underwrite durable
      ROI across the installed base.
    diligencePath: >-
      Request anonymized cohort studies or customer references that disclose pre/post metrics and implementation
      timelines.
    relatedQuestionRefs:
      - QU003
      - QU004
  - type: missing-source
    severity: material
    topic: governance-controls
    missingEvidence: >-
      Current trust-center evidence, certifications, DPA/subprocessor detail, and public regulator correspondence tied
      to Forter's identity and payments workflows.
    whyItMatters: >-
      The source pool supports material privacy, AI-decision, and PSD2-sensitive exposure, but not the exact control
      stack needed to underwrite compliance confidence.
    diligencePath: >-
      Request the current trust-center pack, external attestations, AI governance policy, and any open regulator or
      card-network issues.
    relatedQuestionRefs:
      - QR002
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: guarantee-economics
    missingEvidence: >-
      Reserve methodology, loss ratios, carve-outs, and cohort economics behind any chargeback restitution or
      dispute-liability commitments.
    whyItMatters: >-
      Liability-bearing promises can turn a growth story into a margin or cash-consumption risk if contract terms and
      reserves are weaker than public messaging suggests.
    diligencePath: Review standard merchant terms, guarantee schedules, reserve reports, and loss history by merchant cohort.
    relatedQuestionRefs:
      - QR002
      - QR005
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Current partner-attributed revenue mix, top-customer concentration, and renewal or churn detail by partner
      channel.
    whyItMatters: >-
      Partner-powered scale is central to Forter's go-to-market, so concentration or weak replacement optionality could
      magnify churn and bargaining pressure.
    diligencePath: Request channel mix, top-10 customer ARR, partner pipeline contribution, and gross-profit retention by cohort.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: current-financial-profile
    missingEvidence: Current ARR or revenue, gross margin, burn, runway, and net revenue retention.
    whyItMatters: >-
      Without current operating economics, the last public valuation marker cannot be tested for durability or downside
      protection.
    diligencePath: >-
      Request the latest board deck or audited management reporting package covering 2025 and year-to-date 2026
      performance.
    relatedQuestionRefs:
      - QV007
      - QV008
  - type: missing-source
    severity: material
    topic: price-discovery
    missingEvidence: Post-2021 financing terms, secondary-market transactions, or any newer independent valuation marker.
    whyItMatters: >-
      Entry discipline depends on whether the market still clears near, above, or below the stale $3 billion round
      price.
    diligencePath: >-
      Obtain current cap-table and financing history plus any recent secondary tender, 409A, or investor-marking
      evidence.
    relatedQuestionRefs:
      - QV001
      - QV005
      - QV008
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, logo retention, expansion behavior, and loss-rate segmentation by cohort.
    whyItMatters: >-
      Scale claims are more valuable if they translate into durable, diversified monetization rather than concentrated
      transaction volume.
    diligencePath: Review cohort analytics, top-customer exposure, and churn/expansion data by merchant segment.
    relatedQuestionRefs:
      - QV002
      - QV007
