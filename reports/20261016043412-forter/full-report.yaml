      - number: '3.3'
        title: Pricing, packaging, and buying friction
        blocks:
          - type: paragraph
            body: >-
              Public evidence converges on an enterprise, quote-based sale. Toolradar describes contact-sales,
              transaction-based pricing and characterizes the product as expensive and enterprise focused. RFP.wiki
              distinguishes covered contracts, where Forter assumes chargeback liability, from uncovered technology-only
              arrangements, while noting that dollar rates, percentage-of-GMV fees, module prices, and services fees are
              not publicly disclosed. That structure gives buyers levers around risk transfer, approval guarantees,
              volume, and module scope, but prevents a defensible public total-cost comparison. Review aggregation is
              positive but thin and methodologically limited; it should be treated as a diligence lead, not proof of
              superior customer outcomes.
            claimRefs:
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence suggests three proposed defenses: a broad product surface, identity-network data, and
              commercial willingness to bear defined fraud losses. AI Central Resources reports an identity network
              exceeding two billion identities, while Forter's own materials emphasize automated decisioning and product
              expansion. Those ingredients could raise switching costs when merchants integrate decisioning, disputes,
              account protection, and payment optimization together. However, the assigned pool provides no independent
              measurement of incremental approval lift, false-positive reduction, network overlap, retention, or
              migration effort versus Riskified, Signifyd, Sift, SEON, or incumbent suites. Large payment, identity, and
              security vendors can bundle adjacent controls, while merchants can multi-home or retain internal rules.
              Durability therefore remains a testable hypothesis rather than a demonstrated moat.
            claimRefs:
              - CP010
              - CP012
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public pricing is not comparable
            body: >-
              Forter's covered and uncovered options create meaningful economic differences, but no retained source
              discloses unit rates, implementation fees, exclusions, or peer contract prices.
            calloutType: risk
            claimRefs:
              - CP005
              - CP011
          - type: callout
            title: Test the moat with merchant-level evidence
            body: >-
              Underwrite differentiation only after cohort-level approval, fraud-loss, false-positive, multi-homing,
              renewal, and migration data are compared with named alternatives.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support a sales-led B2B model aimed at large merchants, payment ecosystems, and
              adjacent partners rather than a consumer product. Forter's current platform surface spans Fraud
              Management, Payment Optimization, Dispute Management, Account Protection, Abuse Prevention, and a
              PSP-facing offering, which implies wallet-share expansion beyond single-step fraud scoring. Public scale
              signals are directionally strong but not apples-to-apples: the current platform page cites more than
              200,000 businesses and $350 billion in GMV over the past 12 months, Citi Ventures cited more than $250
              billion in GMV and more than 10,000 businesses, and older third-party profiles cite different consumer or
              transaction totals. The chapter can therefore explain the commercial engine, but not reconcile one audited
              current revenue base.
