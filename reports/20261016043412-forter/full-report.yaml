  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and commercial scope
        blocks:
          - type: paragraph
            body: >-
              The retained evidence places Forter inside the digital-commerce trust and fraud stack, not in a
              single-function fraud-screening niche. Independent category coverage and company materials describe a
              platform that spans payment fraud prevention, payment optimization, dispute automation, account
              protection, and abuse prevention. That boundary matters because the budget does not sit only with a
              chargeback team: the buying case touches conversion, authorization rates, checkout friction, account
              security, and post-purchase operations. The strongest fit is therefore larger merchants, marketplaces, and
              PSP-linked channels with enough transaction volume, operational complexity, and fraud exposure to justify
              a quote-based platform rather than lighter point tooling.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
