      - number: '6.2'
        title: Adoption proof is strongest on scale and named logos, not cohorts
        blocks:
          - type: paragraph
            body: >-
              Forter's public adoption trajectory is directionally strong but mostly company-issued. In 2021 the company
              said it had doubled revenue, doubled its merchant network, and exceeded $250 billion in annual online
              transactions; a later partner announcement said Forter decisioned more than $300 billion in 2022 and
              already served more than 200,000 merchants. The current official comparison page pushes that scale claim
              further to $350 billion over the prior 12 months and pairs it with guarantee-style messaging around
              approval and chargeback performance. Named-customer proof is real, but unevenly evidenced: some rows show
              explicit rollout context, like Wix merchants in certain countries, while other rows are logo clusters or
              testimonials without disclosed baselines, time windows, or customer names. That makes production use
              plausible across major brands, but it does not by itself establish repeatable deployment depth or outcome
              durability.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
              - CU012
