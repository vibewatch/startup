      - number: '4.2'
        title: Pricing opacity and unit economics
        blocks:
          - type: paragraph
            body: >-
              Forter's public materials are rich on outcomes and thin on monetization. The company and its ecosystem
              sources describe faster automated decisions, lower chargebacks, fewer false declines, and a growing suite
              of modules, but none of the assigned sources disclose list prices, realized pricing, take rates,
              discounting, contract length, or revenue mix by module. That means even a reasonable public observer
              cannot bridge customer activity into recognized revenue or gross profit with precision. The best public
              efficiency proxies are historical rather than current: Forter's May 2021 post said revenue doubled in the
              prior year, and the same period's sources describe large transaction throughput, but there is no public
              CAC, payback, gross-margin, or retention disclosure in this pool.
            claimRefs:
