              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain a current independent market report that cleanly defines TAM, narrows
              to a Forter-relevant SAM, and then isolates a defensible SOM with transparent methodology. What it does
              provide are usable adoption and pricing anchors: Forter-reported network scale, historical transaction
              volume, recent merchant-network claims, and third-party pricing ranges that show how contract value scales
              with GMV, module mix, and risk profile. Those lenses are enough to show that Forter plays in a large
              enterprise-commerce category where pricing is tied to transaction economics, but they are not enough to
              claim a single broad “market size” figure without overreaching.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM013
              - CM014
