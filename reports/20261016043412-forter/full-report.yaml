      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by a familiar enterprise-commerce logic: merchants want higher approval rates, fewer
              false declines, lower chargebacks, less manual-review effort, and stronger protection against account
              takeover and abuse across the customer journey. Forter’s public positioning adds a guarantee-backed
              commercial model that can resonate with merchants that prefer liability transfer over staffing more
              internal fraud operations. The same structure is also a constraint. Third-party pricing evidence says cost
              depends on GMV, vertical risk, implementation scope, add-on modules, support, and overage clauses, which
              means smaller or lower-risk buyers may find the category harder to underwrite. For valuation work, that
              makes segmentation and contract economics more important than any undifferentiated headline TAM.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise budget logic is the clearest fit
            body: >-
              Forter’s pricing and positioning tie the purchase to GMV, fraud-loss exposure, and conversion economics,
              so the most natural buyers are scaled merchants and PSP channels that already manage those variables
              centrally.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM009
          - type: callout
            title: Market size remains a real diligence gap
            body: >-
              The pool proves category relevance and commercial scale, but it does not provide a current independent
              TAM/SAM/SOM methodology. Any valuation work that leans on a generic “fraud prevention market” headline
              would be weaker than the evidence supports.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and relative scale
        blocks:
          - type: paragraph
            body: >-
              The buyer's practical choice set extends beyond a short list of fraud startups. CompWorth names Riskified,
              Signifyd, Sift, SEON, and Jumio among Forter's alternatives, while Forter's summary of the 2025 Frost &
              Sullivan Radar adds incumbent and adjacent providers such as Akamai, BioCatch, Feedzai, Ekata, LexisNexis
              Risk Solutions, Kount, and NICE Actimize. Internal rules, manual review, and PSP-native controls remain
              status-quo substitutes even though the assigned evidence does not benchmark them. Third-party scale
              estimates place Forter near Signifyd by employee count, below Riskified and Jumio on estimated revenue,
              and above Sift and SEON on estimated revenue; these are directional aggregator estimates rather than
              audited, same-period financials. Forter's 2021 financing establishes historical capital capacity, not
              current competitive performance.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP014
              - CP016
