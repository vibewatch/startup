      - number: '3.2'
        title: Capability breadth and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Forter's visible scope spans fraud management, payment optimization, dispute management, account
              protection, and abuse prevention. Its current product direction also reaches beyond conventional risk
              scoring: official documentation presents Agentic Orchestration as a layer connecting AI shopping platforms
              to merchant backends through Shopify, Salesforce Commerce Cloud, or custom integrations. This breadth can
              reduce the number of point tools a large merchant coordinates, but it also increases implementation and
              governance scope. The retained sources do not establish feature parity for named peers, so the matrix
              marks competitor cells unknown rather than assuming inferiority. Forter's vendor-hosted account of analyst
              recognition and sub-400-millisecond decisioning is useful product evidence, but it is not an independent
              comparative benchmark.
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
