companyProfile:
  summary: >-
    Forter is a New York-based private fraud-prevention and digital-commerce trust platform founded in 2013 by Michael
    Reitblat, Liron Damri, and Alon Shemesh. The company sells real-time identity-based decisioning, chargeback
    guarantees, abuse prevention, account protection, and payment optimization to large merchants, marketplaces, and
    digital-commerce platforms. Public evidence supports meaningful scale: more than 400,000 businesses in its network,
    more than two billion shopper profiles, more than $2 trillion in cumulative transaction volume, and estimated 2024
    ARR of roughly $103 million. The main underwriting tension is not market relevance but disclosure quality: Forter
    remains private, the $3 billion valuation dates back to May 2021, and core SaaS efficiency metrics such as gross
    margin, NRR, reserve ratios, and profitability remain undisclosed.
  foundedDate: '2013-01-01'
  founders:
    - name: Michael Reitblat
      role: Co-founder & CEO
    - name: Liron Damri
      role: Co-founder & President
    - name: Alon Shemesh
      role: Co-founder & Chief Analyst
  foundingLocation: New York, New York, USA
  headquarters: New York, New York, USA
  productSummary: >-
    Forter sells a trust platform for digital commerce that combines identity-graph intelligence, real-time fraud
    decisions, chargeback guarantees, account protection, payment optimization, dispute management, and abuse-prevention
    workflows delivered through APIs, SDKs, dashboards, and platform integrations.
  customerFocus: >-
    Enterprise retailers, marketplaces, travel brands, delivery and QSR platforms, and other digital-commerce merchants
    with meaningful fraud-loss and false-decline exposure.
  businessModel: >-
    Primarily SaaS and transaction-volume-indexed enterprise contracts, often paired with a chargeback guarantee that
    puts Forter at risk on approved fraudulent transactions and deepens switching costs for customers.
  stage: Late-stage private / Series F
  fundingStatus: >-
    Last disclosed primary financing was a $300 million Series F in May 2021 at a $3 billion valuation; public evidence
    indicates roughly $525 million total capital raised and no new primary equity round announced through June 2026.
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product positioning
        blocks:
          - type: paragraph
            body: >-
              Retained evidence consistently places Forter in identity-based fraud prevention for digital commerce
              rather than in a narrow point solution. Forter’s own current surfaces describe a trust and
              identity-intelligence platform spanning fraud management, payment optimization, dispute management,
              account protection, and abuse prevention, and the homepage now extends that positioning to “agentic
              commerce.” The founding record is also directionally consistent: independent sources date the company to
              2013, while the company’s own origin story says Michael Reitblat and Liron Damri built Forter after seeing
              first-hand at PayPal-era fraud operations that manual review would not scale. That combination supports a
              clear one-line model—software that automates merchant trust decisions across the commerce journey—but not
              a clean public read on current pricing or revenue model detail.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility in the retained pool remains concentrated around the founders, especially CEO
              and co-founder Michael Reitblat. That is a positive signal for founder-market fit because the core origin
              story, early fraud-domain expertise, and commercial narrative all route back to the founding team. It also
              creates diligence concentration: the retained pool does not expose a current board list, board observer
              structure, or a complete executive bench, so governance cannot be triangulated from public evidence alone.
              Forter’s 2025 public materials do show product leadership depth through chief product officer commentary,
              but the absence of a board/control view means key-person dependency still looks material until investor
              documents and current governance materials are reviewed directly.
            claimRefs:
              - CO001
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO011
