figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained public record shows a steady path from 2013 founding to 2025 category recognition, with the strongest
      dated proof around 2020-2021 financing and scale claims.
    data:
      items:
        - date: 2013-02
          label: Forter founded
          detail: >-
            Startup Nation Central dates the company to February 2013 and names Michael Reitblat and Liron Damri as
            founders.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2013'
          label: Origin thesis formed
          detail: >-
            Forter’s own origin story says the founders built the company after seeing that manual fraud review would
            not scale and after developing automated approaches during their PayPal-era work.
          tone: positive
          claimRefs:
            - CO002
        - date: '2016'
          label: Early category recognition
          detail: Startup Nation Central says Gartner named Forter a cool vendor in 2016.
          tone: positive
          claimRefs:
            - CO015
        - date: '2018'
          label: Broader fintech visibility
          detail: >-
            Startup Nation Central says Forter appeared on the Forbes Fintech 50 and Fast Company’s Top 10 Most
            Innovative Companies lists in 2018.
          tone: positive
          claimRefs:
            - CO016
        - date: 2020-11
          label: Series E announced
          detail: Bessemer publicly described leading a $125 million Series E round.
          tone: positive
          claimRefs:
            - CO005
        - date: '2020'
          label: Scale and breakeven claims
          detail: >-
            Bessemer said Forter had reached cash-flow breakeven, doubled revenue and team, and handled more than $200
            billion in annual online transactions while protecting more than 800 million shoppers.
          tone: positive
          claimRefs:
            - CO008
            - CO014
        - date: 2021-05
          label: Series F sets latest clear valuation marker
          detail: SiliconANGLE reported a $300 million Series F led by Tiger Global at a $3 billion valuation.
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-06
          label: Radar leadership claim repeated
          detail: >-
            Forter said Frost & Sullivan again placed it in the highest quadrant for Innovation and Growth and cited 25
            patents.
          tone: positive
          claimRefs:
            - CO011
        - date: '2026-10-16'
