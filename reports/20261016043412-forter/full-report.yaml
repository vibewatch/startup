        title: Operating model, integrations, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The operating model is built around identity intelligence, network effects, and automated decisioning,
              with Forter asserting that those elements support instant trust decisions across the customer journey. The
              evidence pool also shows the product stretching deeper into payment infrastructure and operator tooling:
              the 2024 release added tokenization and AI insights, the AWS Marketplace listing packages five integrated
              products for enterprise buyers, and current 2026 comparisons describe AI agents for analytics, payments,
              disputes, abuse, and integrations plus early MCP access. That makes the architecture more platform-like,
              but the public record is still stronger on feature announcements and partner surfaces than on
              independently verified deployment effort, measurable operator savings, or long-run support requirements.
            claimRefs:
