      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public capital-market evidence is still anchored to the May 2021 Series F rather than a current financing
              snapshot. SiliconANGLE reported a $300 million raise at a $3 billion valuation and said cumulative funding
              reached $525 million, while UpMarket still presents that round as the latest reported valuation datapoint
              and separately warns that pre-IPO shares are illiquid, speculative, and can result in total loss. Those
              facts are enough to frame valuation risk and private-share illiquidity, but not current liquidity. None of
              the assigned sources disclose cash on hand, burn, debt, covenants, or runway, so capital adequacy remains
              a diligence item rather than an underwritten conclusion.
            claimRefs:
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial story is attractive at the level of strategic positioning and incomplete at the level of
              underwritable metrics. Forter appears to have a broadening enterprise product set, meaningful historical
              growth, and enough ecosystem traction to justify continued commercial relevance. However, the chapter's
              evidence base still lacks realized pricing, revenue mix, gross margin, CAC/payback, customer
              concentration, and current cash or runway. That combination supports a cautious verdict: revenue quality
              may be strong, but the public record still cannot prove it, and the absence of current capital disclosures
              means financing dependency cannot be cleared from external evidence alone.
            claimRefs:
              - CI005
              - CI007
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broadening platform, narrow pricing visibility
            body: >-
              Forter's public product footprint has expanded materially beyond checkout fraud into payment optimization,
              disputes, account protection, and abuse prevention, which creates credible wallet-share upside. The same
              sources still leave pricing and product-level revenue mix private.
            calloutType: insight
            claimRefs:
              - CI001
              - CI013
              - CI016
          - type: callout
            title: Capital adequacy remains an external-evidence gap
            body: >-
              The last disclosed financing benchmark in this pool is still the May 2021 Series F, and the assigned
              sources do not provide current cash, burn, or runway. That makes financing dependency a live diligence
              blocker rather than a cleared risk.
            calloutType: risk
            claimRefs:
              - CI007
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Forter describes the Trust Platform as a workflow-wide control layer spanning account creation, checkout,
              loyalty programs, and returns rather than a narrow card-not-present screening product. Company-issued
              materials consistently group the offer into identity or account protection, fraud management, payment
              optimization, dispute or chargeback recovery, and abuse prevention, while also carving out a PSP channel
              offer through Forter Element. That breadth matters for buyers because it suggests Forter wants to own more
              of the merchant trust stack across pre-purchase, authorization, and post-transaction operations, but it
              also means implementation value depends on how many modules a merchant actually activates and governs.
            claimRefs:
