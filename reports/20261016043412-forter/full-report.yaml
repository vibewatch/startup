  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix is enterprise-heavy and channel-assisted
        blocks:
          - type: paragraph
            body: >-
              The public customer footprint in this pool is concentrated in digital commerce rather than broad
              horizontal SMB software. Independent coverage and official material both point to large retailers,
              marketplaces, and adjacent payments infrastructure as the recurring buyer set: SecurityBrief names
              customers such as Nordstrom, ASOS, Shein, Adore Beauty, and Booktopia, while company-controlled sources
              extend the picture to Fortune 500 commerce brands and to partners such as PSPs, banks, acquirers, and
              system integrators. That pattern suggests Forter is sold into scaled commerce workflows where fraud
              losses, authorization rates, and checkout friction are material P&L concerns. It also implies that partner
              channels matter to reach: the platform story is not only direct enterprise sales, but ecosystem
              distribution through commerce platforms and payments intermediaries.
            claimRefs:
              - CU001
              - CU002
              - CU007
