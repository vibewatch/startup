        title: Funding, investors, and scale snapshot
        blocks:
          - type: paragraph
            body: >-
              The financing record is the cleanest part of the public overview. SiliconANGLE reports a $300 million
              Series F in May 2021 at a $3 billion valuation, while Bessemer Venture Partners publicly described its own
              $125 million Series E lead in November 2020; other third-party references put cumulative capital above
              $500 million, with Sacra citing $525 million. Scale evidence is directionally strong but not fully
              reconciled. Bessemer described more than $200 billion in annual online transactions and more than 800
              million shoppers in 2020, while SiliconANGLE later wrote that Forter processed more than $250 billion in
              2020 and protected more than a billion consumers. Those figures all support enterprise relevance, but they
              also show why later chapters should treat current GMV, customer count, and headcount as unresolved until
              management materials or more current independent reporting close the gap.
