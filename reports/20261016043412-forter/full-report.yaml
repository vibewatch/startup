              - CU008
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.3'
        title: Durability remains the key unresolved customer diligence area
        blocks:
          - type: paragraph
            body: >-
              The gap between adoption breadth and durability evidence is the chapter's central issue. Public review
              data is positive but thin, with only nine verified reviews and limited usage depth in some comments. More
              importantly, this assigned source pool does not disclose NRR, GRR, logo churn, contract length, or
              customer concentration by ARR, so there is no public basis here to distinguish stable enterprise expansion
              from transaction-volume volatility or concentration in a small number of large accounts. That opacity
              matters because independent analysis also frames a plausible downside path in which PSD2-style liability
              shifts and data-rich payment competitors such as Stripe and Adyen increase procurement pressure and force
              more price competition. The result is a customer story with credible adoption proof, but incomplete
              evidence on how sticky and defensible that adoption remains.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real adoption, mostly marketing-shaped proof
            body: >-
              The source pool supports real enterprise adoption and partner-assisted rollout, but most named-customer
              proof is company- or partner-issued rather than independently measured deployment evidence.
            calloutType: insight
            claimRefs:
              - CU004
              - CU006
              - CU013
          - type: callout
            title: Retention and concentration are still opaque
            body: >-
              The strongest remaining customer diligence blocker is not logo count; it is the absence of public NRR,
              churn, contract-term, and ARR concentration disclosure, which leaves durability exposed to procurement and
              pricing pressure.
            calloutType: risk
            claimRefs:
