            title: Data breadth and workflow coverage are the main product moat
            body: >-
              The strongest product case is that Forter is not selling a single fraud model; it is selling a broader
              trust operating layer whose claimed network scale, workflow span, and ongoing R&D can make it sticky once
              a merchant operationalizes multiple modules.
            calloutType: strength
            claimRefs:
              - CE002
              - CE010
              - CE012
              - CE013
          - type: callout
            title: Public proof is stronger on roadmap activity than on control quality
            body: >-
              The assigned evidence is rich in launches, partner surfaces, and product claims, but comparatively light
              on independent evidence about deployment effort, false-positive governance, and how much operator staffing
              is required to keep outcomes strong after go-live.
