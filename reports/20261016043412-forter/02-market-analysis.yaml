  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: A current independent 2025-2026 market dataset that defines category boundary, geography, spend basis, and a Forter-relevant TAM/SAM/SOM methodology.
      whyItMatters: Without a transparent independent sizing source, valuation work can only rely on scale proxies and contract economics rather than defendable market-share assumptions.
      diligencePath: Retain a current analyst, trade-association, public-company, or government source that sizes digital-commerce fraud, trust, or payment-optimization spend with methodology details.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: segment-economics
      missingEvidence: Current customer-count mix, average contract scale by segment, and attach rates for account protection, abuse prevention, and guarantee products.
      whyItMatters: These variables determine whether Forter’s growth depends on broad category expansion, enterprise concentration, or wallet-share expansion inside existing customers.
      diligencePath: Seek customer segmentation, public-case-study counts by vertical, procurement records, or management disclosures that isolate product and vertical mix.
      relatedQuestionRefs: [QM003, QM004]
