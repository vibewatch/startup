artifact: company-overview
slug: forter
runDate: 2026-10-16
company:
  name: Forter
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Forter remains a founder-shaped private company in digital commerce fraud and trust,
    with retained public evidence centering on its 2013 founding, a 2020 Series E, and a
    2021 Series F at a $3 billion valuation. The strongest current signals are company-issued
    product positioning and 2025 category recognition, while headline scale, headcount,
    governance, and current valuation terms remain stale or only partially corroborated.
sections:
  - id: identity-and-positioning
    title: Identity, founding, and product positioning
    body: >-
      Retained evidence consistently places Forter in identity-based fraud prevention for
      digital commerce rather than in a narrow point solution. Forter’s own current surfaces
      describe a trust and identity-intelligence platform spanning fraud management, payment
      optimization, dispute management, account protection, and abuse prevention, and the
      homepage now extends that positioning to “agentic commerce.” The founding record is
      also directionally consistent: independent sources date the company to 2013, while the
      company’s own origin story says Michael Reitblat and Liron Damri built Forter after
      seeing first-hand at PayPal-era fraud operations that manual review would not scale.
      That combination supports a clear one-line model—software that automates merchant trust
      decisions across the commerce journey—but not a clean public read on current pricing or
      revenue model detail.
    claimRefs: [CO001, CO002, CO003, CO012]
  - id: leadership-governance-and-key-person-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      Public leadership visibility in the retained pool remains concentrated around the
      founders, especially CEO and co-founder Michael Reitblat. That is a positive signal
      for founder-market fit because the core origin story, early fraud-domain expertise, and
      commercial narrative all route back to the founding team. It also creates diligence
      concentration: the retained pool does not expose a current board list, board observer
      structure, or a complete executive bench, so governance cannot be triangulated from
      public evidence alone. Forter’s 2025 public materials do show product leadership
      depth through chief product officer commentary, but the absence of a board/control
      view means key-person dependency still looks material until investor documents and
      current governance materials are reviewed directly.
    claimRefs: [CO001, CO002, CO011]
    tableRefs: [TO002]
  - id: funding-investors-and-scale-snapshot
    title: Funding, investors, and scale snapshot
    body: >-
      The financing record is the cleanest part of the public overview. SiliconANGLE reports
      a $300 million Series F in May 2021 at a $3 billion valuation, while Bessemer Venture
      Partners publicly described its own $125 million Series E lead in November 2020; other
      third-party references put cumulative capital above $500 million, with Sacra citing
      $525 million. Scale evidence is directionally strong but not fully reconciled. Bessemer
      described more than $200 billion in annual online transactions and more than 800 million
      shoppers in 2020, while SiliconANGLE later wrote that Forter processed more than
      $250 billion in 2020 and protected more than a billion consumers. Those figures all
      support enterprise relevance, but they also show why later chapters should treat
      current GMV, customer count, and headcount as unresolved until management materials or
      more current independent reporting close the gap.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO013, CO014]
    tableRefs: [TO001, TO003]
  - id: milestones-and-current-watchpoints
    title: Milestones and current watchpoints
    body: >-
      Forter’s retained milestone arc is coherent even though some current-state metrics are
      not. Public evidence shows a 2013 founding, third-party recognition in 2016 and 2018,
      meaningful scale and breakeven claims around the 2020 Series E, and a 2021 Series F
      that fixed the company’s last clearly supported valuation marker. By 2025, Forter was
      still publicly emphasizing category leadership and product R&D depth, including a cited
      25-patent base. The main watchpoint is freshness rather than identity: current investor
      control, board composition, headcount, and a post-2021 valuation update are not
      established by this pool, so the company reads as credible and scaled but still opaque
      on several investor-critical facts.
    claimRefs: [CO004, CO005, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
