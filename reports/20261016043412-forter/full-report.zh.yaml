  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 当前推荐基于真实的产品与规模证明，但受到过时价格锚点和当前经济性缺失的制约。
    data:
      nodes:
        - label: 产品广度与相关性
          note: 欺诈、支付、争议、账户保护、滥用防范和 PSP 赋能共同支持其品类相关性。
        - label: 规模信号有意义
          note: 公开引用提到庞大的消费者、商家和处理量覆盖面。
        - label: 估值锚点已过时
          note: 可见价格标记仍围绕 2021-2022 年 $3 billion 的讨论。
        - label: 公开可比公司差距仍未解决
          note: 该工作池中最好的独立可比公司信号仍指向有意义的倍数压缩风险。
        - label: 经济性缺失限制信心
          note: 当前收入质量、利润率、留存和私募市场出清价格，在该工作池中都没有披露。
        - label: 推荐保持继续研究
          note: 只有更新后的经济性足以证明相对于公开可比公司的持续溢价时，推荐才会改善。
      edges:
        - from: Product breadth and relevance
          to: Scale signals are meaningful
          label: 支持
        - from: Scale signals are meaningful
          to: Valuation anchor is stale
          label: 受到制约
        - from: Valuation anchor is stale
          to: Public-comp gap remains unresolved
          label: 得到强化
        - from: Public-comp gap remains unresolved
          to: Missing economics limit conviction
          label: 加剧
        - from: Missing economics limit conviction
          to: Recommendation stays research-more
          label: 因此
    approximationNotes: 该序列是分析性的，并非因果精确关系；它总结了用于入场纪律的证据链。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV010
      - CV011
      - CV012
