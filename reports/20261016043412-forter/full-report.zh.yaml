              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 情景框架与可比公司
        blocks:
          - type: paragraph
            body: >-
              乐观情景建立在真实的平台广度和 Forter 仍保持类目相关性的证据之上。公司描述了覆盖欺诈管理、支付优化、争议管理、账户保护、滥用防控及 PSP 产品的广泛组合；其 2025 年 6 月博客称 Frost &
              Sullivan 再次将其置于创新与增长最高象限。Forbes 也仍将可观的网络规模归于 Forter，称自成立以来触达 18 亿消费者、处理电商交易超过
              $2T。更难的问题是这些运营信号对当前价格意味着什么。Sacra 的估值说明指出，历史上的 $3B 估值意味着显著高于上市同行 Riskified 的倍数，因此溢价情景仍取决于证据能否证明 Forter
              的增长、利润率和防御性一直是卓越，而不只是良好。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 最终尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              剩余工作与 Forter 是否真实无关，关键在于当前入场价格是否提供足够安全边际。在判断溢价结果前，投资者需要获取当前 ARR 或收入、毛利率、烧钱、留存、客户集中度，以及 2021
              年融资后股权结构表或清算顺位是否变化的最新证据。基准情景只有在近期规模指标转化为持久经济性，而不只是网络量或产品广度时才能成立。若有证据表明收入增长已回落至上市同行水平、出现降价轮或折价二级市场，或者公司声称的性能优势已不足以支撑相对同行的溢价定价，投资论点就会被打破。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
