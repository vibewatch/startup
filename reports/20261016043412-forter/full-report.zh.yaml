        title: 融资、投资者与规模概览
        blocks:
          - type: paragraph
            body: >-
              融资记录是公开概览中最清晰的一部分。SiliconANGLE 报道 Forter 于 2021 年 5 月以 $3B 估值完成 $300M F 轮，Bessemer Venture Partners 则公开称其于
              2020 年 11 月领投自己的 $125M E 轮；其他第三方来源将累计融资置于 $500M 以上，Sacra 给出 $525M。规模证据总体强劲，但尚未完全对齐。Bessemer 称 2020
              年线上交易额超过 $200B、消费者超过 800M；SiliconANGLE 后来写道，Forter 在 2020 年处理了超过 $250B 的交易并保护超过 10
              亿消费者。这些数字都支持其企业市场相关性，但也说明后续章节为何应把当前 GMV、客户数和员工数视为未解问题，直到管理层材料或更新的独立报道补上缺口。
