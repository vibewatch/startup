      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开资本市场证据仍锚定在 2021 年 5 月 F 轮，而不是当前融资快照。SiliconANGLE 报道该轮融资 $300M、估值 $3B，累计融资达到 $525M；UpMarket
              仍将这轮列为最近披露的估值数据点，并另行警告 IPO
              前股份缺乏流动性、具有投机性，可能导致全部损失。这些事实足以界定估值风险和非上市股份流动性风险，却不足以说明当前流动性。指定来源均未披露现金余额、烧钱、债务、契约或现金跑道，因此资本充足性仍是尽调事项，而非可据以投资判断的结论。
            claimRefs:
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从战略定位看，Forter 的财务故事有吸引力；从可据以投资判断的指标看，故事并不完整。Forter 似乎拥有不断扩大的企业产品组合、可观的历史增长和足够的生态
              traction，足以保持商业相关性。但本章证据仍缺少实际定价、收入结构、毛利率、CAC/回本期、客户集中度以及当前现金或跑道。综合来看，结论应保持谨慎：收入质量可能很强，但公开记录仍无法证明这一点；当前资本披露缺失，也意味着仅凭外部证据无法排除融资依赖。
