        title: 里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              Forter 的里程碑脉络连贯，尽管部分当前指标尚未明确。公开证据显示公司于 2013 年创立，2016 年和 2018 年获得第三方认可，2020 年 E 轮前后已具备可观规模并声称实现盈亏平衡，2021 年
              F 轮则确定了最后一个有充分支持的估值锚。到 2025 年，Forter 仍在公开强调类目领导力和产品研发深度，包括资料提到的 25
              项专利。主要观察点在于信息新鲜度而非公司身份：该资料池无法确认当前投资者控制权、董事会构成、员工数和 2021 年后的估值更新，因此公司看起来可信且有规模，但若干对投资者关键的事实仍不透明。
