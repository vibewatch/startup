      - number: '2.3'
        title: 采用驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用由一套熟悉的企业商业逻辑驱动：商户希望提高批准率、减少误拒、降低拒付、减少人工审核，并在客户旅程中更好地防范账户接管和滥用。Forter
              公开定位中的担保型商业模式也有吸引力，尤其适合更愿意转移责任、而非增加内部欺诈运营人手的商户。但同一结构也是约束。第三方定价证据显示，成本取决于
              GMV、垂直行业风险、实施范围、附加模块、支持和超额条款，因此规模较小或风险较低的买家可能更难承担这类产品。估值时，客户分层和合同经济性比任何未经区分的 TAM 标题数字都更重要。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 企业预算逻辑最契合
            body: Forter 的定价和定位把采购与 GMV、欺诈损失敞口和转化经济性绑定，因此最自然的买家是已经集中管理这些变量的规模化商户和 PSP 渠道。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM009
          - type: callout
            title: 市场规模仍是实质性尽调缺口
            body: 资料池证明了类目相关性和商业规模，但没有提供当前的独立 TAM/SAM/SOM 方法论。任何依赖笼统“欺诈防控市场”标题数字的估值工作，都弱于现有证据所能支持的程度。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与相对规模
        blocks:
          - type: paragraph
            body: >-
              买方实际可选范围不止一小批欺诈初创公司。CompWorth 将 Riskified、Signifyd、Sift、SEON 和 Jumio 列为 Forter 的替代方案；Forter 对 2025 年 Frost
              & Sullivan Radar 的总结还加入 Akamai、BioCatch、Feedzai、Ekata、LexisNexis Risk Solutions、Kount 和 NICE Actimize
              等既有及相邻供应商。内部规则、人工审核和 PSP 原生控制仍是现状替代方案，尽管指定证据没有对它们做基准比较。第三方规模估计显示，Forter 的员工数接近 Signifyd，估计收入低于 Riskified 和
              Jumio、高于 Sift 和 SEON；这些只是方向性聚合估计，不是同一时期的经审计财务数据。Forter 2021 年融资证明的是历史资本能力，而非当前竞争表现。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP014
              - CP016
