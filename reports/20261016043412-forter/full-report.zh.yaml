      - number: '3.2'
        title: 能力广度与战略方向
        blocks:
          - type: paragraph
            body: >-
              Forter 可见的产品范围覆盖欺诈管理、支付优化、争议管理、账户保护和滥用防控。当前产品方向也超出传统风险评分：官方文档将 Agentic Orchestration 描述为连接 AI
              购物平台与商户后台的层，可通过 Shopify、Salesforce Commerce Cloud
              或自定义集成接入。广度可以减少大型商户需要协调的单点工具数量，但也会扩大实施和治理范围。留存来源没有证明其与指定同行功能对等，因此矩阵将竞争对手单元标为未知，而不是假定其处于劣势。Forter
              托管的分析师认可和低于 400 毫秒决策速度说法是有用的产品证据，但不是独立的比较基准。
            claimRefs:
