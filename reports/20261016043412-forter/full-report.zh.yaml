  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Forter 当前的变现能力和留存明显强于公开可比公司，近期产品与生态主张也转化为持久的扩张。
        - 只有在更新后的经济性能够支撑持久的溢价倍数时，超过过时的 $3 billion 标记才有依据。
        - 如果增长已经正常化，溢价倍数永远不会重估。
        - 需要新的独立证明，而不是沿用历史轮次的估值表象。
      - - 基准
        - Forter 仍是可信的品类领导者，但当前财务披露只能部分支撑历史溢价。
        - 在旧的 $3 billion 标记附近或略低的位置，是当前单位经济性得到验证前最实际的锚点。
        - 即便经营保持稳健，私募市场的不透明也可能抹掉上行空间。
        - 与现有证据组合相符：真实规模加上定价证明不完整。
      - - 悲观
        - 如果增长和亏损表现向公开可比公司水平收敛，或二级市场将相对上一轮融资的折价计入价格，则进入这一情景。
        - 如果倍数压缩与有限披露同时发生，低于过时的私募估值标记就可能成为市场出清区间。
        - 在管理层披露完整经济性之前，可能先出现降价轮或折价二级市场证据。
        - Sacra 的同业比较已经指向倍数压缩风险。
    notes: 情景区间有意保持粗略，因为指定工作池不包含当前经审计收入、利润率或市场出清交易数据。
    claimRefs:
      - CV002
      - CV010
      - CV013
      - CV014
      - CV015
