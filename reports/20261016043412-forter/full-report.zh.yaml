              - CP009
              - CP013
              - CP015
      - number: '3.3'
        title: 定价、产品组合与购买阻力
        blocks:
          - type: paragraph
            body: >-
              公开证据一致指向企业级、报价制销售。Toolradar 称产品需联系销售、按交易计价，并将其描述为昂贵且面向企业。RFP.wiki 区分了 Forter
              承担拒付责任的有保障合同和仅提供技术服务的无保障安排，同时指出美元费率、GMV
              百分比费用、模块价格和服务费均未公开。这个结构让买方可以围绕风险转移、批准担保、交易量和模块范围谈判，但无法进行有依据的公开总成本比较。评论聚合结果偏正面，但样本少且方法有限，应视为尽调线索，而不是客户结果优于同行的证明。
            claimRefs:
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP011
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              证据指向三项潜在防御：广泛的产品覆盖、身份网络数据，以及商业上愿意承担明确的欺诈损失。AI Central Resources 报道身份网络超过 20 亿个身份，Forter
              自有材料则强调自动化决策和产品扩张。当商户把决策、争议、账户保护和支付优化整合在一起时，这些要素可能提高切换成本。但指定资料池没有独立衡量相较于 Riskified、Signifyd、Sift、SEON
              或既有套件的增量批准提升、误报减少、网络重叠、留存或迁移工作量。大型支付、身份和安全供应商可以打包相邻控制，商户也可以多家采购或保留内部规则。因此，持久性仍是可检验的假设，而不是已被证明的护城河。
            claimRefs:
              - CP010
              - CP012
              - CP015
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 公开定价不可比较
            body: Forter 的有保障和无保障方案在经济性上差异显著，但没有留存来源披露单位费率、实施费、排除项或同行合同价格。
            calloutType: risk
            claimRefs:
              - CP005
              - CP011
          - type: callout
            title: 用商户层面证据检验护城河
            body: 只有把客户群组的批准率、欺诈损失、误报、多家采购、续约和迁移数据与指定替代方案放在一起比较，才能评估差异化价值。
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP012
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开增长信号
        blocks:
          - type: paragraph
            body: >-
              指定来源支持一种面向大型商户、支付生态和相邻合作伙伴的销售驱动型 B2B 模式，而非消费产品。Forter 当前平台覆盖 Fraud Management、Payment Optimization、Dispute
              Management、Account Protection、Abuse Prevention 以及面向 PSP
              的产品，意味着钱包份额可以从单一步骤的欺诈评分向外扩张。公开规模信号总体强劲，但口径不可直接比较：当前平台页称过去 12 个月覆盖超过 200,000 家企业、GMV 为 $350B；Citi Ventures
              称 GMV 超过 $250B、企业超过 10,000 家；较早的第三方资料则给出不同消费者或交易总量。因此，本章可以解释商业引擎，但无法对齐出一个经审计的当前收入基数。
