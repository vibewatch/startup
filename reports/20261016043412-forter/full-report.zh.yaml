      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              指定资料池没有一份当前的独立市场报告，能清晰定义 TAM、收窄到与 Forter 相关的 SAM，再以透明方法拆出站得住脚的 SOM。资料能提供的是可用的采用和定价锚点：              Forter
              报告的网络规模、历史交易量、近期商户网络的公司口径，以及展示合同价值如何随 GMV、模块组合和风险画像变化的第三方定价区间。这些视角足以说明 Forter
              所在的是一个大型企业商业类目，定价与交易经济性挂钩；但不足以在不越界的情况下给出一个笼统的“市场规模”数字。
