        - label: 身份与账户信号
          detail: 基于身份的信任信号是后续欺诈与支付决策的上游基础。
          outputs:
            - label: Identity protection
            - label: Fake-account and ATO controls
        - label: 决策核心
          detail: Forter 将身份图谱、网络效应和决策引擎定义为平台核心。
          outputs:
            - label: Approve / decline decisions
            - label: Trust scoring and automation
        - label: 支付与结账控制
          detail: Payment Optimization 和令牌化功能把欺诈风险态势连接到授权与合规工作流。
          modules:
            - label: 3DS 与发卡行优化
            - label: PCI 令牌化
            - label: 网络令牌化
            - label: 账户更新器
        - label: 滥用与争议工作流
          detail: 授权后的模块把产品栈延伸到政策滥用和拒付运营。
          modules:
            - label: Abuse Prevention
            - label: Dispute Management
            - label: Chargeback Recovery
        - label: 分发与运营者层
          detail: PSP 打包、AWS Marketplace、集成和 AI 智能体让平台更易分发和运营，但也增加治理问题。
          modules:
            - label: 面向 PSP 的 Forter Element
            - label: AWS Marketplace
            - label: Analytics / Payments / Dispute / Abuse / Integration 智能体
            - label: 早期 MCP 接入
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Forter 可见的市场进入动作从合作伙伴协助的切入和商家评估开始，经过生产环境上线、模块扩展，最终接受采购持久性测试。
    data:
      nodes:
        - label: 平台与 PSP 切入点
          actor: Commerce platforms, PSPs, banks, and system integrators
          phase: Land
          touchpoints:
            - Ecosystem referrals from eCommerce platforms, PSPs, banks, agencies, and system integrators
            - PSP resale or embedded motions cited for FreedomPay, Nuvei, Flutterwave, and Wix
        - label: 商家评估
          actor: Risk and payments teams
          phase: Evaluate
          touchpoints:
            - Proof-of-value comparisons against incumbent fraud vendors
            - Approval-rate, chargeback, and false-decline economics
        - label: 初始部署
          actor: Merchant operations
          phase: Deploy
          touchpoints:
            - Live rollout to Wix merchants in certain countries
            - Decisioning across account, checkout, payment, and abuse workflows
        - label: 结果证明
          actor: Digital operations leaders
          phase: Prove value
          touchpoints:
            - Quoted gains in approvals or reduced chargebacks
            - Testimonial evidence of 'millions' in previously blocked good orders
        - label: 扩展
          actor: Merchant and partner account teams
          phase: Expand
          touchpoints:
            - Move from fraud management into payment optimization, disputes, account protection, and abuse prevention
            - Broader rollout through partner channels over time
        - label: 持久性测试
          actor: Procurement and finance
          phase: Renew
          touchpoints:
            - Retention, NRR, churn, and concentration data absent from the public pool
            - Payment-giant competition and regulatory shifts can pressure pricing and renewals
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU008
      - CU012
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的领域是治理不透明、合作伙伴依赖和过时的估值锚点。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余风险
      rows:
        - label: 数据 / 监管治理
          note: 身份图谱规模、对 PSD2 敏感的优化以及承担责任的主张，都会提高控制层面的尽调要求。
          values:
            - label: 中
              tone: high
            - label: 高
              tone: critical
            - label: 中
              tone: warning
            - label: 高
              tone: critical
        - label: 运营执行
          note: 自动化承诺很强，但企业集成与支持质量仍可能造成摩擦。
          values:
