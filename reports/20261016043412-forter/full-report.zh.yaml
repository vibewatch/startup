companyProfile:
  summary: >-
    Forter 是一家总部位于纽约的非上市欺诈防控与数字商业信任平台，由 Michael Reitblat、Liron Damri 和 Alon Shemesh 于 2013
    年创立。公司向大型商户、市场平台和数字商业平台销售基于实时身份的决策、拒付担保、滥用防控、账户保护和支付优化服务。公开证据显示其规模可观：网络覆盖超过 400,000 家企业、超过 20 亿个消费者档案，累计交易额超过
    $2T，2024 年 ARR 估计约为 $103M。投资判断的核心矛盾不在市场相关性，而在披露质量：Forter 仍是非上市公司，$3B 估值可追溯至 2021 年 5 月，毛利率、NRR、准备金率和盈利能力等核心 SaaS
    效率指标仍未披露。
  foundedDate: '2013-01-01'
  founders:
    - name: Michael Reitblat
      role: 联合创始人兼 CEO
    - name: Liron Damri
      role: 联合创始人兼总裁
    - name: Alon Shemesh
      role: 联合创始人兼首席分析师
  foundingLocation: New York, New York, USA
  headquarters: New York, New York, USA
  productSummary: Forter 面向数字商业销售一套信任平台，把身份图谱智能、实时欺诈决策、拒付担保、账户保护、支付优化、争议管理和滥用防控流程整合在一起，并通过 API、SDK、仪表盘和平台集成交付。
  customerFocus: 企业零售商、市场平台、旅行品牌、配送和 QSR 平台，以及面临显著欺诈损失和误拒风险的其他数字商业商户。
  businessModel: 主要采用 SaaS 和按交易量计价的企业合同，通常搭配拒付担保：已批准的欺诈交易会让 Forter 承担风险，也会提高客户的切换成本。
  stage: Late-stage private / Series F
  fundingStatus: 最近一次披露的一级融资是 2021 年 5 月以 $3B 估值完成的 $300M F 轮；公开证据显示累计融资约 $525M，截至 2026 年 6 月未宣布新的一级股权融资。
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品定位
        blocks:
          - type: paragraph
            body: >-
              留存证据始终将 Forter 定位为数字商业中的身份型欺诈防控，而不是狭窄的单点方案。Forter
              当前自有页面将其描述为覆盖欺诈管理、支付优化、争议管理、账户保护和滥用防控的信任与身份智能平台，官网如今还将定位延伸至“智能体商业”。创立记录也基本一致：独立来源将公司成立时间定为 2013
              年，公司自己的起源故事则称 Michael Reitblat 和 Liron Damri 在 PayPal 时代的欺诈运营中亲眼看到人工审核无法规模化，随后创立
              Forter。由此可以清楚概括其模式：用软件自动化商业旅程中的商户信任决策；但公开资料仍无法清晰说明当前定价或收入模式细节。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              留存资料中的公开领导层信息仍集中在创始人，尤其是 CEO、联合创始人 Michael Reitblat
              身上。这对创始人与市场的匹配度是正面信号：公司的起源故事、早期欺诈领域专长和商业叙事都回溯到创始团队。但这也形成尽调集中度：资料没有当前董事会名单、董事会观察员安排或完整高管梯队，因此仅凭公开证据无法交叉验证治理。Forter
              2025 年公开材料通过首席产品官的评论展现了产品领导力深度，但在直接审阅投资者文件和当前治理材料前，董事会和控制权视角的缺失意味着关键人物依赖仍然显著。
            claimRefs:
              - CO001
              - CO002
              - CO011
