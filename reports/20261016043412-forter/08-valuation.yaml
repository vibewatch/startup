  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-financial-profile
      missingEvidence: Current ARR or revenue, gross margin, burn, runway, and net revenue retention.
      whyItMatters: Without current operating economics, the last public valuation marker cannot be tested for durability or downside protection.
      diligencePath: Request the latest board deck or audited management reporting package covering 2025 and year-to-date 2026 performance.
      relatedQuestionRefs:
        - QV007
        - QV008
    - type: missing-source
      severity: material
      topic: price-discovery
      missingEvidence: Post-2021 financing terms, secondary-market transactions, or any newer independent valuation marker.
      whyItMatters: Entry discipline depends on whether the market still clears near, above, or below the stale $3 billion round price.
      diligencePath: Obtain current cap-table and financing history plus any recent secondary tender, 409A, or investor-marking evidence.
      relatedQuestionRefs:
