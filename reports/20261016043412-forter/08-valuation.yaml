      whyItMatters: Scale claims are more valuable if they translate into durable, diversified monetization rather than concentrated transaction volume.
      diligencePath: Review cohort analytics, top-customer exposure, and churn/expansion data by merchant segment.
      relatedQuestionRefs:
        - QV002
        - QV007
