      - ["Nordstrom / ASOS / Shein / Adore Beauty / Booktopia", "International retail and marketplace cohort", "Fraud-detection software used to distinguish trustworthy from suspicious transactions", "Appears production-oriented from the interview framing", "Shows cross-region brand coverage beyond a single geography", "Interview does not disclose rollout depth, tenure, or measurable outcomes per customer"]
      - ["Unnamed customer quoted by Janelle Spatz", "Enterprise digital-operations team", "Forter deployment replacing overly restrictive blocking of legitimate orders", "Production-like testimonial", "Customer says growth 'skyrocketed' while chargebacks stayed down and effort remained low", "Customer company, timeframe, and numerical baseline are omitted"]
