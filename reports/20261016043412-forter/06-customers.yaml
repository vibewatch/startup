        Without retention and renewal evidence, it is not possible to separate
        sticky enterprise adoption from short-lived transaction-volume spikes or
        partner-led merchant reach.
      diligencePath: Ask management for cohort retention tables, renewal schedules, and customer-success dashboards by ARR band.
