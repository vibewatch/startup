company:
  name: Forter
chapter:
  number: 6
  title: Customers
  summary: >-
    Forter's public customer evidence shows meaningful enterprise-commerce
    adoption and channel reach, with company-issued disclosures moving from
    more than $250 billion of annual online transactions in 2021 to more than
    $300 billion in 2022 and a current claim of $350 billion processed over the
    prior 12 months. Named-customer proof spans major retailers, marketplaces,
    and platform/PSP channels, but the durability picture is weaker: the
    assigned public-source pool does not disclose NRR, churn, contract length,
    or customer concentration by ARR.
sections:
  - id: segment-and-channel-mix
    title: Segment mix is enterprise-heavy and channel-assisted
    body: >-
      The public customer footprint in this pool is concentrated in digital
      commerce rather than broad horizontal SMB software. Independent coverage
      and official material both point to large retailers, marketplaces, and
      adjacent payments infrastructure as the recurring buyer set: SecurityBrief
      names customers such as Nordstrom, ASOS, Shein, Adore Beauty, and
      Booktopia, while company-controlled sources extend the picture to Fortune
      500 commerce brands and to partners such as PSPs, banks, acquirers, and
      system integrators. That pattern suggests Forter is sold into scaled
      commerce workflows where fraud losses, authorization rates, and checkout
      friction are material P&L concerns. It also implies that partner channels
      matter to reach: the platform story is not only direct enterprise sales,
      but ecosystem distribution through commerce platforms and payments
      intermediaries.
    claimRefs: [CU001, CU002, CU007, CU008, CU011]
    tableRefs: [TU001]
  - id: adoption-trajectory-and-proof
    title: Adoption proof is strongest on scale and named logos, not cohorts
    body: >-
      Forter's public adoption trajectory is directionally strong but mostly
      company-issued. In 2021 the company said it had doubled revenue, doubled
      its merchant network, and exceeded $250 billion in annual online
      transactions; a later partner announcement said Forter decisioned more
      than $300 billion in 2022 and already served more than 200,000 merchants.
      The current official comparison page pushes that scale claim further to
      $350 billion over the prior 12 months and pairs it with guarantee-style
      messaging around approval and chargeback performance. Named-customer proof
      is real, but unevenly evidenced: some rows show explicit rollout context,
      like Wix merchants in certain countries, while other rows are logo clusters
      or testimonials without disclosed baselines, time windows, or customer
      names. That makes production use plausible across major brands, but it does
      not by itself establish repeatable deployment depth or outcome durability.
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU010, CU012, CU013]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability remains the key unresolved customer diligence area
    body: >-
      The gap between adoption breadth and durability evidence is the chapter's
      central issue. Public review data is positive but thin, with only nine
      verified reviews and limited usage depth in some comments. More
      importantly, this assigned source pool does not disclose NRR, GRR, logo
      churn, contract length, or customer concentration by ARR, so there is no
      public basis here to distinguish stable enterprise expansion from
      transaction-volume volatility or concentration in a small number of large
      accounts. That opacity matters because independent analysis also frames a
      plausible downside path in which PSD2-style liability shifts and data-rich
      payment competitors such as Stripe and Adyen increase procurement pressure
      and force more price competition. The result is a customer story with
      credible adoption proof, but incomplete evidence on how sticky and
      defensible that adoption remains.
    claimRefs: [CU009, CU010, CU013, CU014, CU015]
callouts:
  - calloutType: insight
    title: Real adoption, mostly marketing-shaped proof
    body: >-
      The source pool supports real enterprise adoption and partner-assisted
      rollout, but most named-customer proof is company- or partner-issued
      rather than independently measured deployment evidence.
    claimRefs: [CU004, CU006, CU013]
  - calloutType: risk
    title: Retention and concentration are still opaque
    body: >-
      The strongest remaining customer diligence blocker is not logo count; it
      is the absence of public NRR, churn, contract-term, and ARR concentration
      disclosure, which leaves durability exposed to procurement and pricing
      pressure.
    claimRefs: [CU014, CU015]
