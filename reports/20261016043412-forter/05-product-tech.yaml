  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer or practitioner telemetry such as repos, package usage, forum traffic, or independent operator communities tied directly to Forter's product stack.
      whyItMatters: Product breadth claims rely heavily on company surfaces and commercial intermediaries without a matching operator-side adoption signal.
      diligencePath: Ask management for customer-admin communities, public SDK or integration telemetry, or named practitioner references that show how operators use the platform in production.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: control-governance
      missingEvidence: False-positive governance, override workflows, incident postmortems, and precision or recall reporting by module or merchant cohort.
      whyItMatters: Trust and safety quality depends on how decisions are governed after deployment, not just on launch cadence or marketing claims.
      diligencePath: Request product-control documentation, model-governance reviews, and customer-level operating metrics for approvals, false declines, disputes, and abuse policy tuning.
    - type: missing-source
      severity: material
      topic: implementation-economics
      missingEvidence: Customer-verified implementation timelines, staffing burden, and module-specific pricing or attachment by deployment model.
      whyItMatters: Independent sources suggest operating burden and coverage choices meaningfully change ROI, but the assigned pool does not quantify that burden.
      diligencePath: Obtain reference calls and implementation plans from direct-enterprise and PSP-channel customers, then compare staffing and time-to-value by module.
      relatedQuestionRefs: [QE004, QE007]
