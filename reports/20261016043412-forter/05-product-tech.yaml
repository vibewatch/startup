      - Current workflow
      - Forter solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Screen new and returning identities", "Merchant must decide whether an account, shopper, or loyalty action is trustworthy before revenue events occur", "Identity or account protection connected to the broader Trust Platform", "Company positioning says Forter can act from account creation through returns", "No independent public precision or escalation metrics in the assigned pool"]
      - ["Approve checkout while limiting fraud", "Fraud and payments teams balance conversion, false declines, and chargebacks at authorization time", "Fraud Management plus Payment Optimization", "Forter reports average 72% lower chargeback rates and 46% fewer false declines", "Outcome metrics are company-claimed and not tied to a disclosed sample frame"]
      - ["Run disputes and recover chargebacks", "Operations teams gather evidence and submit representments after fraud or payment disputes", "Dispute Management / Chargeback Recovery plus newer Dispute Agent automation", "Forter positions the workflow as automated and integrated with the same trust data", "Independent sources still describe the dispute agent as early and not a full replacement for specialist recovery tooling"]
      - ["Control policy abuse and returns", "Merchants must detect coupon misuse, returns abuse, and reseller behavior without harming legitimate users", "Abuse Prevention with alerts and broader policy controls", "Broadens the platform beyond pure fraud prevention into revenue-protection use cases", "Public evidence does not show how much merchant staffing is needed to tune policies safely"]
    notes: >-
      Benefits mix company-reported outcomes with independent commentary; limitations flag where the assigned pool
      does not provide denominator, cohort, or customer-verified operating evidence.
    claimRefs: [CE001, CE003, CE004, CE007, CE011, CE015]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key dependency
      - Risk / diligence note
    rows:
      - ["Identity graph and network layer", "Aggregates shopper and merchant trust signals across the commerce journey", "Scale of data network and feature freshness", "Need a customer-facing explanation of what data is unique to Forter versus standard merchant telemetry"]
      - ["Decisioning engine", "Turns identity and payment signals into automated approve, decline, or workflow actions", "Model quality, override logic, and merchant governance", "Public material stresses speed and automation more than governance and exception-handling detail"]
      - ["Payments and tokenization services", "Connects fraud posture to 3DS, issuer, tokenization, and account-updater workflows", "Processor integrations and multiprocessor support", "Merchants should validate whether every promoted payment feature is live in their existing stack"]
      - ["AI insights and workflow agents", "Adds natural-language analytics plus specialized agents for payments, abuse, disputes, and integrations", "Data access controls, model boundaries, and operator trust", "Assigned sources do not provide independent evidence on adoption, accuracy, or policy guardrails for agentic workflows"]
    notes: >-
      This table blends explicit company architecture descriptions with clearly labeled diligence risks where the
      assigned pool lacks independent operational proof.
    claimRefs: [CE002, CE006, CE007, CE008, CE014]
figures:
  - id: FE001
    title: Forter trust-platform architecture map
    type: stack
    summary: >-
      The visible product stack runs from customer touchpoints through identity and decisioning into payment,
      abuse, dispute, and operator tooling layers.
    data:
      layers:
        - label: Customer interaction layer
          detail: Account creation, checkout, loyalty, and returns are the trust-decision touchpoints Forter names most explicitly.
          modules:
            - label: Account creation
            - label: Checkout
            - label: Loyalty
            - label: Returns
        - label: Identity and account signals
          detail: Identity-based trust signals are the upstream substrate for later fraud and payment decisions.
          outputs:
            - label: Identity protection
            - label: Fake-account and ATO controls
        - label: Decisioning core
          detail: Forter frames identity graph, network effects, and the decision engine as the core of the platform.
          outputs:
            - label: Approve / decline decisions
            - label: Trust scoring and automation
        - label: Payment and checkout controls
          detail: Payment Optimization and tokenization features connect fraud posture to authorization and compliance workflows.
          modules:
            - label: 3DS and issuer optimization
            - label: PCI tokenization
            - label: Network tokenization
            - label: Account updater
        - label: Abuse and dispute workflows
          detail: Post-authorization modules extend the stack into policy abuse and chargeback operations.
          modules:
            - label: Abuse Prevention
            - label: Dispute Management
            - label: Chargeback Recovery
        - label: Distribution and operator layer
          detail: PSP packaging, AWS Marketplace, integrations, and AI agents make the platform easier to distribute and operate, but add governance questions.
          modules:
            - label: Forter Element for PSPs
            - label: AWS Marketplace
            - label: Analytics / Payments / Dispute / Abuse / Integration Agents
            - label: Early MCP access
    claimRefs: [CE001, CE002, CE005, CE013]
callouts:
  - calloutType: strength
    title: Data breadth and workflow coverage are the main product moat
    body: >-
      The strongest product case is that Forter is not selling a single fraud model; it is selling a broader
      trust operating layer whose claimed network scale, workflow span, and ongoing R&D can make it sticky once a
      merchant operationalizes multiple modules.
    claimRefs: [CE002, CE010, CE012, CE013]
  - calloutType: risk
    title: Public proof is stronger on roadmap activity than on control quality
    body: >-
      The assigned evidence is rich in launches, partner surfaces, and product claims, but comparatively light on
      independent evidence about deployment effort, false-positive governance, and how much operator staffing is
      required to keep outcomes strong after go-live.
    claimRefs: [CE009, CE014, CE015]
