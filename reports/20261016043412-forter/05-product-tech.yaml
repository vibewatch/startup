      - ["Payment Optimization", "Payments teams", "Core current module", "Links fraud identity to 3DS, issuer, and tokenization workflows rather than treating checkout as isolated screening", "No public unit economics for authorization uplift versus added integration work"]
      - ["Dispute Management / Chargeback Recovery", "Chargeback and operations teams", "Current module with newer AI-agent overlay", "Connects chargeback recovery to the same trust stack instead of a separate vendor", "Recovery-rate evidence in the assigned pool is company-framed rather than independently benchmarked"]
      - ["Account / Identity Protection", "Identity and account-security owners", "Core current module", "Moves trust decisions upstream to fake-account and account-takeover prevention", "Need public evidence on account-takeover false positives and override workflows"]
      - ["Abuse Prevention", "Risk and policy teams", "Current module with 2024 alerting enhancements", "Extends beyond payment fraud into promo, returns, and reseller abuse", "Need customer proof on governance and staffing load for policy tuning"]
      - ["Forter Element for PSPs", "Payment service providers and embedded-merchant channels", "Current channel-specific offer", "One-time PSP integration can broaden reach beyond direct enterprise deals", "Need evidence on attach rate, merchant activation, and support burden by PSP partner"]
    notes: >-
      Module labels come from company-issued product surfaces; maturity is inferred from whether each module is
      currently marketed in the assigned-source pool, not from audited adoption data.
