company:
  name: "Zero Hash"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Zero Hash packages trading, custody, settlement, stablecoin payouts, tokenization, and compliance infrastructure behind APIs and an embeddable developer kit. The public evidence supports a broad, modular production surface, but reliability, security-control effectiveness, per-jurisdiction availability, and product-level maturity remain largely company-reported rather than independently benchmarked."
sections:
  - id: "product-workflows"
    title: "Product surface and customer workflows"
    body: >-
      Zero Hash is an infrastructure layer rather than a consumer application: its customers embed digital-asset functions into an existing brokerage, bank, fintech, payroll, or payments experience. The current product surface spans trading, custody, settlement, stablecoin funding and payouts, tokenization, wallets, and on/off-ramps. Brokerage materials describe one integration for execution, custody, compliance, settlement, and asset movement, while the 2026 Visa Direct announcement extends the same model to stablecoin merchant prefunding and payouts for eligible clients. This breadth is strategically useful because customers can add modules without launching a separate digital-asset stack. It also complicates diligence: the public file does not distinguish generally available modules from partner-specific configurations, does not publish adoption by module, and gives no complete jurisdiction-by-asset matrix.
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "technical-architecture"
    title: "Integration and operating architecture"
    body: >-
      The observable architecture has six layers: a partner-controlled customer experience; REST APIs, SDKs, and webhooks; participant onboarding and eligibility controls; execution, account movement, settlement, and payout services; custody and compliance operations; and external blockchain, stablecoin, fiat, and payment-network rails. A third-party developer directory describes separate certification and production endpoints, HMAC-signed requests, asynchronous KYC approval, and webhook-driven status updates. Those mechanics are consistent with an enterprise integration rather than a self-serve developer product: the same directory says credentials require KYB onboarding and a signed agreement. The design reduces what partners must build, but creates operational dependency on Zero Hash's authorization, onboarding, custody, chain connectivity, and reconciliation controls.
    claimRefs:
      - "CE002"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE013"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-deployment-roadmap"
    title: "Maturity, deployment, support, and roadmap evidence"
    body: >-
      The strongest maturity signals are the breadth of published documentation, named integrations, and current product claims. Zero Hash's documentation advertises more than 80 supported assets, more than 200 countries, 99.99% uptime, integration playbooks, and round-the-clock support. These are useful operating claims, not independently audited service levels: the fetched landing page does not define the uptime window, exclusions, incident record, or contractual remedy. Recent launch evidence is concrete but selective. The August 2026 Visa Direct announcement concerns eligible-client prefunding and payouts, while the November 2025 Plasma announcement described availability through Public and planned expansion to other platforms. A current, versioned roadmap, module-level general-availability status, and implementation-time distribution are not public.
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE011"
      - "CE012"
  - id: "differentiation-controls-risks"
    title: "Differentiation, controls, and technical risk"
    body: >-
      Zero Hash's differentiation is the combination of regulated operating entities, custody and compliance responsibilities, and modular technical access across multiple asset and money-movement workflows. This can compress time to market for a partner that would otherwise assemble licensing, custody, liquidity, settlement, and chain integrations separately. The same bundling concentrates failure modes: partners depend on Zero Hash for onboarding decisions, account administration, custody, availability, and access to external chains and payment rails. Company disclosures also make clear that U.S. crypto and stablecoin accounts lack FDIC and SIPC protection. Independent market evidence adds product-context risk: J.P. Morgan notes stablecoin redemption and de-pegging uncertainty and views cross-border use as more compelling than wholesale consumer-rail replacement, while Chainalysis's historical evidence shows stablecoins were heavily used for exchange settlement and trader value storage. Security certifications, control-test results, recovery objectives, and independent uptime history remain diligence gaps.
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
