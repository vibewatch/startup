schemaVersion: "report-v2"
artifact: market-analysis
slug: zero-hash
runDate: 2026-10-21
company:
  name: Zero Hash
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zero Hash addresses the regulated infrastructure layer between financial platforms and
    crypto, stablecoin, and tokenized-asset rails, with brokerages, payment providers, banks,
    fintechs, and payroll platforms as the principal buyers. Public evidence shows strong
    adoption signals but does not isolate a comparable revenue TAM, SAM, or SOM, so payment-flow,
    network, and circulation metrics are treated as boundary markers rather than vendor revenue.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable category is narrower than crypto trading, stablecoin circulation, or global
      remittance principal. Zero Hash sells an embedded operating layer: regulated execution,
      custody, asset movement, settlement, monitoring, and integration capabilities that a bank,
      brokerage, fintech, payroll platform, or payment provider would otherwise assemble
      internally or source from several specialists. Its disclosed workflows span trading,
      cross-border payments, payroll, remittance, commerce, tokenization, wallets, and on/off
      ramps. The relevant spend boundary is therefore outsourced infrastructure and compliance,
      not the face value of assets or payments moving over those rails. Status-quo substitutes
      include internal build, incumbent bank and card rails, separate custody and liquidity
      vendors, and stablecoins operating alongside existing payment systems. This boundary avoids
      counting Circle's USDC circulation or Visa's endpoint reach as Zero Hash-addressable revenue.
    claimRefs: [CM001, CM002, CM005, CM015, CM016]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-evidence
    title: Evidence-constrained sizing
    body: >-
      The assigned public evidence offers several scale indicators but no denominator-consistent
      market forecast. Visa reported that digital remittances rose from 25.5% of total remittances
      in Q2 2016 to 56.7% in Q3 2022, while its 2022 transfer-type chart separated 27.5% as
      digitally initiated and 30.4% as digital end-to-end. Circle reported $71.9 billion of USDC
      in circulation on October 19, 2026, availability in more than 185 countries, and native
      support on 38 blockchains. Zero Hash separately announced access to Visa Direct's network of
      more than 18 billion endpoints in over 195 countries and territories. These figures show
      large underlying flows and distribution surfaces, but they measure shares, token stock,
      technical availability, and endpoints rather than infrastructure fees. They cannot be
      summed or converted into TAM, SAM, or SOM without contract pricing, addressable-volume, and
      take-rate evidence.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM016]
    tableRefs: [TM002]
  - id: buyer-map
    title: Buyers, users, payers, and adoption path
    body: >-
      Budget ownership sits with the financial institution or platform embedding the capability,
      while end users interact with the partner's branded experience. For brokerages, the economic
      buyer is likely a product, digital-assets, operations, or compliance leader seeking to add
      trading without running execution, custody, settlement, and licensing internally; the
      those functions internally; a third-party company profile says partners maintain their
      branding and customer relationships. For payment
      service providers and payroll platforms, treasury and payments teams have a working-capital
      rationale because stablecoin settlement can operate continuously and shorten settlement
      cycles. Banks and fintechs face the broadest governance path because legal, risk, compliance,
      technology, and product teams all influence approval. The typical adoption sequence is a
      partner-led product decision, technical integration through APIs or SDKs, compliance and
      custody design, corridor or asset launch, then expansion into adjacent workflows.
    claimRefs: [CM002, CM003, CM004, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by continued remittance digitization, 24/7 settlement, lower reliance on
      prefunding, and demand for embedded access rather than a separate crypto product. Visa's
      remittance analysis also found lower average Q1 2024 costs for mobile-money and card-funded
      transfers than for cash, reinforcing the incentive to migrate money movement toward digital
      channels. Zero Hash's Monad and Plasma integrations illustrate how additional chains can
      widen supported payment, payroll, commerce, and settlement workflows without each platform
      operating blockchain infrastructure itself. Adoption is not automatic: services vary by
      jurisdiction, crypto and stablecoin balances lack FDIC or SIPC protection, buyers must
      accept concentration in a multi-function provider, and existing payment rails often remain
      in place. For valuation, the opportunity should be underwritten through contracted volume,
      realized take rate, renewal, gross margin, and customer concentration rather than multiplying
      broad payment flows by an assumed fee.
    claimRefs: [CM004, CM006, CM008, CM012, CM013, CM014, CM015]
tables:
  - id: TM001
    title: Market definition and substitution boundary
    columns:
