      - Included spend
      - Excluded spend
      - Buyer or payer
      - Status-quo substitute
      - Relevance to Zero Hash
    rows:
      - [Embedded crypto trading, "Execution, custody, settlement, compliance, and integration fees", "Crypto asset value and retail trading gains or losses", "Brokerage or financial platform", "Internal build or separate execution and custody vendors", "Core Trade workflow"]
      - [Stablecoin payments, "Orchestration, custody, conversion, settlement, and payout infrastructure", "Gross payment value and stablecoin circulation", "PSP, fintech, payroll, or treasury team", "Bank, card, ACH, wire, or closed-loop rails", "Core Transact workflow"]
      - [Cross-border remittance, "Digital payout, on/off-ramp, compliance, and settlement infrastructure", "Total remittance principal and recipient income", "Remittance provider or payment platform", "Cash agent networks and conventional digital remittance apps", "Addressable only where stablecoin rails are adopted"]
      - [Tokenized assets, "Issuance support, lifecycle, custody, compliance, and settlement services", "Underlying security or fund asset value", "Asset manager, bank, or investment platform", "Traditional transfer agents, custodians, and market infrastructure", "Core Tokenize workflow"]
      - [Issuer and network layer, "Integration and connectivity services where contracted", "Stablecoin reserve income, token supply, and blockchain value", "Platform integrating an issuer or chain", "Direct issuer or chain integration", "Adjacent input, not the entire addressable market"]
      - [Internal regulated stack, "Avoided engineering, licensing, monitoring, and operations cost", "All compliance spending by the customer", "Enterprise product and compliance organization", "Build and maintain the stack in-house", "Primary build-versus-buy benchmark"]
    notes: >-
      Analyst-defined boundary based on the cited product and industry pages; payment principal,
      token circulation, network reach, and underlying asset values are explicitly excluded from
      vendor-revenue sizing.
    claimRefs: [CM001, CM002, CM005, CM014, CM015, CM016]
  - id: TM002
    title: Public sizing and adoption lenses
    columns:
      - Metric
      - Value
      - Period
      - Geography
      - Publisher
      - Denominator or methodology
      - Confidence
      - Limitation
    rows:
      - ["Digital share of remittances", "56.7%", "Q3 2022", Global, Visa, "Digitally initiated plus digital end-to-end share of total remittances", Medium, "Adoption share, not infrastructure revenue"]
      - ["Digital end-to-end remittances", "30.4%", "2022", Global, Visa, "Share of total remittances by transfer type", Medium, "Different from digitally initiated share and not a vendor SAM"]
      - ["Typical $200 remittance cost", "6.8% cash; 5.4% mobile money; 5.1% card", "Q1 2024", Global, Visa, "World Bank channel averages cited by Visa", Medium, "Cost benchmark is not Zero Hash pricing"]
      - ["USDC in circulation", "$71.9B", "2026-10-19", Global, Circle, "Issuer-reported token circulation", Medium, "Token stock is not platform revenue or addressable spend"]
      - ["USDC distribution surface", "185+ countries; 38 blockchains", "2026-10", Global, Circle, "Issuer-reported availability and native networks", Medium, "Technical availability does not equal active usage"]
      - ["Visa Direct distribution surface", "18B+ endpoints; 195+ countries and territories", "2026-08-05", Global, Zero Hash, "Company announcement describing Visa Direct's eligible network", Medium, "Endpoint reach is not Zero Hash customer count, volume, or revenue"]
    notes: >-
      Values retain each publisher's period and denominator. They are non-additive market signals,
      not a TAM/SAM/SOM series; no conversion to vendor revenue is made.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM016]
  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns:
      - Segment
      - Economic buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Brokerages, "Brokerage product and digital-assets leadership", "Retail or institutional investor", Brokerage, "Embedded trading, custody, and settlement", "Product, operations, and compliance", "Demand for digital assets without a separate stack"]
      - ["Payment service providers", "Payments and treasury leadership", Merchant or payout recipient, PSP, "Stablecoin prefunding, settlement, and payouts", "Payments, treasury, and network partnerships", "Faster settlement and cross-border liquidity"]
      - ["Banks and fintechs", "Digital banking and product leadership", Account holder, Institution, "Embedded crypto, stablecoin, or tokenized-asset product", "Product, technology, legal, risk, and compliance", "New product demand under a regulated operating model"]
      - ["Payroll and workforce platforms", "Payments or global payroll leadership", Worker or contractor, Platform, "Cross-border payout in digital dollars or assets", "Payroll operations and treasury", "Recipient demand and broader corridor coverage"]
      - ["Asset and investment platforms", "Product and market-infrastructure leadership", Investor or fund participant, Institution, "Tokenized-asset funding, custody, and settlement", "Product, operations, and compliance", "Continuous settlement and tokenized distribution"]
    notes: >-
      Buyer and budget-owner labels are analytical mappings from the cited workflow evidence, not
      disclosed Zero Hash procurement data; exact purchasing authority and contract structure
      remain private.
    claimRefs: [CM002, CM003, CM004, CM005, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Addressability filter from broad flows to the Zero Hash wedge
    type: pyramid
    summary: >-
      The opportunity narrows from global money movement to digital rails, stablecoin-enabled
      workflows, outsourced regulated infrastructure, target buyers, and contracted Zero Hash use.
    data:
      items:
        - label: Global money movement and remittances
          value: "Broad flow pool; not a revenue TAM"
          detail: "Gross principal is outside the vendor-spend boundary."
        - label: Digitally enabled remittances
          value: "56.7% of remittances in Q3 2022"
          detail: "Visa's digital-share measure is an adoption signal, not a fee pool."
        - label: Stablecoin-enabled rails
          value: "$71.9B USDC circulation on 2026-10-19"
          detail: "Issuer-reported token stock is a rail-scale proxy, not addressable revenue."
        - label: Embedded financial workflows
          value: "Trading, payments, payroll, remittance, and tokenization"
          detail: "Only workflows requiring embedded infrastructure enter the category."
        - label: Outsourced regulated stack
          value: "Execution, custody, compliance, and settlement"
          detail: "The serviceable layer is the build-versus-buy spend outsourced by platforms."
        - label: Zero Hash serviceable wedge
          value: "Brokerages, PSPs, banks, fintechs, and payroll platforms"
          detail: "Actual SOM requires contracted volumes, pricing, renewals, and take rates."
    approximationNotes: >-
      Conceptual narrowing only: labels mix sourced adoption markers with qualitative filters, so
      layer widths do not represent proportional market values or a calculable TAM/SAM/SOM.
    claimRefs: [CM001, CM005, CM006, CM009, CM014, CM016]
callouts:
  - calloutType: insight
    title: Underwrite fee pools, not payment principal
    body: >-
      The defensible sizing bridge is contracted eligible volume multiplied by realized net take
      rate, adjusted for product mix and retention; none of those inputs is available in the
      assigned public evidence.
    claimRefs: [CM016]
  - calloutType: risk
    title: Broad distribution does not prove monetization
    body: >-
      Visa endpoint reach, USDC circulation, and country or blockchain availability establish
      ecosystem scale but do not disclose Zero Hash adoption, market share, pricing, or revenue.
    claimRefs: [CM009, CM010, CM011, CM016]
