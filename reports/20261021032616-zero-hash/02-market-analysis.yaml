  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        Contracted eligible volume by product and geography, realized net take rate, pricing
        schedules, renewal data, and attributable infrastructure revenue.
      whyItMatters: >-
        These inputs are required to translate broad payment and stablecoin adoption into a
        denominator-consistent TAM, SAM, and company SOM.
      diligencePath: >-
        Request management's bottom-up market model, customer contracts, volume cohorts, product
        revenue bridge, and pricing realization by buyer segment.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        A third-party category forecast that isolates regulated embedded crypto and stablecoin
        infrastructure revenue from payment principal, stablecoin stock, and custody asset values.
      whyItMatters: >-
        Available sources use incompatible denominators, periods, and market boundaries, so their
        figures cannot be summed into a credible top-down estimate.
      diligencePath: >-
        Commission or obtain a market study with explicit category definitions, vendor revenue,
        geography, buyer segment, and methodology, then reconcile it to the bottom-up model.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: procurement
      missingEvidence: >-
        Buyer-level procurement authority, sales-cycle duration, implementation cost, renewal
        thresholds, and build-versus-buy decision records.
      whyItMatters: >-
        Public workflow pages identify users and benefits but do not establish who controls budget,
        how quickly adoption occurs, or which constraints cause losses.
      diligencePath: >-
        Interview product, treasury, compliance, and technology buyers across brokerages, PSPs,
        banks, fintechs, and payroll customers, and review won and lost deal records.
      relatedQuestionRefs: [QM003, QM004, QM006]
      relatedTableRefs: [TM003]
