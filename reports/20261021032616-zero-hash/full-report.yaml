  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, substitutes, and likely entrants
        blocks:
          - type: paragraph
            body: >-
              Zero Hash is best evaluated as embedded infrastructure rather than as a retail exchange. Independent
              profiles describe a B2B platform for brokerages, banks, fintechs, and payment providers, while Zero Hash's
              own materials place trading, stablecoin movement, custody, compliance, and tokenization behind partner
              brands. The direct comparison set is therefore fragmented: Coinbase and Circle bring vertically integrated
              networks, Fireblocks and BitGo emphasize custody infrastructure, and MoonPay, Banxa, and Sardine
              specialize in fiat on-ramps. Buyers can also retain existing rails, build internally, or use tokenized
              bank deposits. Those substitutes matter because they trade product breadth for control, incumbent
              distribution, or a more familiar regulatory treatment. Public evidence does not provide comparable scale
              or funding for every peer, so the profile table marks those fields unavailable rather than manufacturing a
              ranking.
