  - id: FE001
    title: Zero Hash product architecture map
    type: stack
    summary: >-
      A public-evidence view of the layers between a partner-owned customer experience and the external financial and
      blockchain rails on which the service depends.
    data:
      layers:
        - label: Partner experience
          detail: The customer-facing platform retains interface, pricing, and product strategy.
          items:
            - Customer application
            - Partner pricing and policy
        - label: Integration surface
          detail: REST APIs, SDKs, integration playbooks, and webhooks connect the partner to Zero Hash.
          items:
            - Authenticated API requests
            - SDK and dev-kit
            - Lifecycle webhooks
        - label: Participant controls
          detail: Onboarding and eligibility checks govern who may access which products.
          items:
            - KYB and contracting
            - KYC approval
            - Jurisdiction and asset eligibility
        - label: Core financial operations
          detail: Execution, accounts, movements, settlement, and payouts implement the customer workflow.
          items:
            - Quotes and execution
            - Accounts and movements
            - Settlement and payouts
        - label: Custody and compliance
          detail: Zero Hash-operated services administer custody and regulated control responsibilities.
          items:
