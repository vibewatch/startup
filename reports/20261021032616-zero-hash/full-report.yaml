chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Zero Hash sits behind other financial brands rather than selling a standalone consumer exchange. Its own
              materials describe one infrastructure layer through which banks, brokerages, fintechs, and payments
              companies can add crypto trading, stablecoin money movement, and tokenized products while Zero Hash
              supplies custody, liquidity, compliance, settlement, and blockchain connectivity. The company says it was
              founded in 2017; current releases identify Edward Woodford as founder and chief executive. Independent
              profiles broadly corroborate the infrastructure model, although the retained public file does not
              establish a complete executive team, board roster, voting control, or legal headquarters. CoinDesk calls
              the company Chicago-based, which is useful location evidence but is not a substitute for current corporate
              records.
            claimRefs:
              - CO001
              - CO002
              - CO004
      - number: '1.2'
        title: Scale and regulatory footprint
        blocks:
          - type: paragraph
            body: >-
              The homepage displays more than $65 billion of settled volume, more than 7 million end customers, more
              than 100 supported assets, availability in 200 jurisdictions, and 99.99% uptime. These are
              company-published operating indicators, not independently audited financial metrics; “end customers” also
              should not be read as the number of contracted enterprise customers. The latest retained headcount
              disclosure is approximately 200 employees in November 2025, with offices in New York, Chicago, North
              Carolina, and Amsterdam, so it is stale for a volatile workforce metric at the October 2026 run date.
              Regulatory disclosures describe U.S. money-transmission and virtual-currency permissions and European CASP
              and EMI licenses, while also stating that accounts lack FDIC and SIPC protection and that Zero Hash is not
              SEC- or FINRA-registered.
