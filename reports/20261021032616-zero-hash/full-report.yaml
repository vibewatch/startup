              - CI006
      - number: '4.3'
        title: The operating stack indicates real cost drivers without margin disclosure
        blocks:
          - type: paragraph
            body: >-
              Zero Hash's public product evidence places execution, custody, asset movement, compliance, and settlement
              inside the operating stack. Those functions imply a mixed cost base spanning technical infrastructure,
              liquidity and counterparty operations, safeguarding, compliance, and jurisdiction-specific licensing. The
              official disclosure also limits product availability by jurisdiction and states that Zero Hash is not
              registered with the SEC or FINRA. Customer assets are not protected by FDIC or SIPC coverage, which
              heightens the importance of controls, insurance, segregation, and loss-allocation terms. None of that
              establishes a gross margin. The reviewed evidence provides no cost per transaction, liquidity spread,
              custody cost, loss rate, reserve requirement, capex, working-capital need, or service-delivery burden, so
              public unit economics remain non-underwritable.
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI010
              - CI016
