              - CI015
              - CI016
      - number: '4.4'
        title: Funding extends capacity but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              Independent reports agree that Zero Hash raised $104 million in September 2025, and FinTech Global
              reported that the company intended to fund product expansion and workforce growth. CoinDesk reported a $1
              billion valuation and $275 million of total funding, while FundedIQ's normalized profile reports $268
              million across four rounds. The $7 million difference should be reconciled against the cap table and cash
              ledger rather than averaged. More importantly, funding raised is not cash available: no retained source
              discloses current cash, monthly net burn, debt, restricted cash, customer-asset segregation, regulatory
              capital, or runway. The financial verdict is therefore conditional. The model may support attractive
              embedded-infrastructure economics, but revenue quality, margin path, capital intensity, and next-round
              dependency remain material diligence blockers until management provides auditable operating and liquidity
              data.
