  - id: FU001
    title: Embedded-customer adoption and expansion journey
    type: journey-map
    summary: >-
      Zero Hash's public materials describe an enterprise integration path from use-case selection through embedded
      launch and modular expansion, while commercial durability remains a diligence gap.
    data:
      nodes:
        - id: need
          label: Select enterprise use case
          detail: A bank, brokerage, PSP, fintech, payroll, or tokenization platform selects a regulated workflow.
          touchpoints:
            - Trading
            - Payments
            - Payroll
            - Remittance
            - Tokenization
        - id: scope
          label: Scope compliance and services
          detail: Product and compliance teams choose custody, settlement, funding, trading, or payout modules.
          touchpoints:
            - Business verification
            - Jurisdiction review
            - Service selection
        - id: integrate
          label: Integrate and test
          detail: The platform uses APIs or SDKs and validates the workflow before launch.
          touchpoints:
            - API credentials
            - SDKs
            - Sandbox
            - Webhooks
        - id: launch
          label: Embed in partner experience
          detail: The platform controls its user experience while Zero Hash administers the underlying digital-asset services.
          touchpoints:
            - Partner application
            - End-user account
            - Custody and settlement
        - id: expand
          label: Add modules and geographies
          detail: Customers can add assets, payment rails, trading, settlement, or tokenization on the shared infrastructure.
          touchpoints:
            - Additional assets
            - New workflows
            - Cross-border coverage
        - id: prove
          label: Prove durable economics
          detail: Usage growth, renewal, cohort expansion, and concentration must be verified through private diligence.
          touchpoints:
            - NRR and GRR
            - Contract renewal
            - Product attach
            - Top-customer exposure
    approximationNotes: >-
      This is a qualitative operating journey, not a conversion funnel; node order does not imply elapsed time,
      conversion rates, or value-proportional scale.
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
      - CU011
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Analyst ranking of six evidence-backed risk categories, with public mitigation maturity separated from residual
      severity.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative likelihood based on the cited exposure surface
        - label: Impact
          detail: Potential operating or investment impact
        - label: Mitigation maturity
          detail: Strength of mitigation visible in the public record
        - label: Residual severity
          detail: Exposure remaining after visible mitigations
      rows:
        - label: Regulatory perimeter change
          note: Licenses exist, but scope and asset permissions remain jurisdiction-specific.
          values:
            - value: High
            - value: High
            - value: Medium
            - value: High
        - label: Custody and settlement concentration
          note: Zero Hash administers multiple critical functions behind partner interfaces.
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: High
        - label: Chain and smart-contract dependency
          note: Products depend on external networks and liquidity workflows.
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: Medium-high
        - label: Availability and recovery
          note: The public uptime metric lacks an independently reviewed denominator.
          values:
            - value: Unknown
            - value: High
            - value: Unknown
            - value: Medium-high
        - label: Partner rollout concentration
          note: Large announced channels can amplify both adoption and dependency.
          values:
            - value: Medium
            - value: Medium-high
            - value: Medium
            - value: Medium
        - label: Financing execution
          note: A reported withdrawn strategic process raises a diligence question, not proof of distress.
          values:
            - value: Medium
            - value: Medium-high
            - value: Unknown
            - value: Medium-high
    approximationNotes: >-
      Qualitative categories are analyst assessments, not modeled probabilities; unknown values identify missing public
      control or financial evidence.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR013
      - CR015
      - CR017
