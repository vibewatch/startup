      - number: '3.3'
        title: Pricing opacity and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pricing is the weakest public comparison surface. Sacra characterizes Zero Hash's model as transaction
              based and estimates an implied 0.146% take rate, but neither that estimate nor company marketing
              establishes realized pricing, minimum commitments, discounts, or gross margin. Competitor pricing is also
              absent from the assigned evidence, making a like-for-like price comparison impossible. Durability instead
              rests on whether regulatory operations, liquidity, custody, and multi-chain integrations remain costly for
              customers to reproduce. Sector evidence cuts both ways: Chainalysis argues that banks must understand and
              monitor crypto exposure, which supports demand for specialized controls, while J.P. Morgan notes that
              tokenized deposits and tokenized money funds may provide familiar alternatives and questions how broadly
              stablecoins displace existing consumer payment rails. The result is a plausible compliance and integration
              moat, not proof of lock-in.
            claimRefs:
