      - number: '3.2'
        title: Capability, distribution, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The central differentiation claim is integration breadth. Zero Hash says one integration can combine
              execution, custody, asset movement, compliance, and settlement while the partner retains its user
              experience, pricing, and product strategy. Its published regulatory footprint spans 51 U.S. jurisdictions
              and licensed entities in Europe, although that remains company-issued evidence and should not be mistaken
              for an independent compliance benchmark.       The Visa Direct announcement indicates that distribution
              can compound through networks and partners rather than only through direct sales. The same model creates
              channel dependence: the partner owns the customer relationship and can potentially multi-home, switch
              infrastructure vendors, or build selected capabilities. No retained source quantifies renewal rates,
              migration effort, exclusivity, or the share of volume tied to any distributor.
            claimRefs:
              - CP003
              - CP008
