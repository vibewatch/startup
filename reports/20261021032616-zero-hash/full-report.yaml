      - number: '5.3'
        title: Maturity, deployment, support, and roadmap evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity signals are the breadth of published documentation, named integrations, and current
              product claims. Zero Hash's documentation advertises more than 80 supported assets, more than 200
              countries, 99.99% uptime, integration playbooks, and round-the-clock support. These are useful operating
              claims, not independently audited service levels: the fetched landing page does not define the uptime
              window, exclusions, incident record, or contractual remedy. Recent launch evidence is concrete but
              selective. The August 2026 Visa Direct announcement concerns eligible-client prefunding and payouts, while
              the November 2025 Plasma announcement described availability through Public and planned expansion to other
              platforms. A current, versioned roadmap, module-level general-availability status, and implementation-time
              distribution are not public.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Zero Hash's differentiation is the combination of regulated operating entities, custody and compliance
              responsibilities, and modular technical access across multiple asset and money-movement workflows. This
              can compress time to market for a partner that would otherwise assemble licensing, custody, liquidity,
              settlement, and chain integrations separately. The same bundling concentrates failure modes: partners
              depend on Zero Hash for onboarding decisions, account administration, custody, availability, and access to
              external chains and payment rails. Company disclosures also make clear that U.S. crypto and stablecoin
              accounts lack FDIC and SIPC protection. Independent market evidence adds product-context risk: J.P. Morgan
              notes stablecoin redemption and de-pegging uncertainty and views cross-border use as more compelling than
              wholesale consumer-rail replacement, while Chainalysis's historical evidence shows stablecoins were
              heavily used for exchange settlement and trader value storage. Security certifications, control-test
              results, recovery objectives, and independent uptime history remain diligence gaps.
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated regulated infrastructure
            body: >-
              The product combines technical access with custody, settlement, compliance, and regulated operating
              responsibilities, reducing the number of systems a partner must assemble.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE013
          - type: callout
            title: Public reliability evidence is not audit evidence
            body: >-
              The 99.99% uptime claim lacks a disclosed measurement period and incident basis in the fetched
              documentation, while independent control reports and recovery objectives are not public.
            calloutType: risk
            claimRefs:
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Zero Hash sells infrastructure to platforms rather than directly owning the primary consumer relationship.
              Its disclosed addressable buyers span banks, brokerages, payment service providers, fintech applications,
              payroll and remittance platforms, and tokenization businesses. The platform customer generally pays for
              and integrates the service, while that customer's end users access trading, custody, settlement, payout,
              or tokenized-asset functionality inside the partner experience. Zero Hash's disclosures add an important
              operating distinction: the partner controls the front-end experience and product strategy, but Zero Hash
              administers the underlying crypto and stablecoin services, including custody. That structure creates
              multiple buying centers across product, engineering, compliance, operations, and treasury, and it makes
              the regulated service layer central to customer switching costs.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU015
      - number: '6.2'
        title: Adoption signals and metric comparability
        blocks:
          - type: paragraph
            body: >-
              The public scale indicators are meaningful but not fully comparable. Zero Hash's current documentation
              displays more than $50 billion in settled transaction volume, 8 million end customers, and support across
              more than 200 countries. Avalanche's integration directory independently repeats the country footprint and
              transaction volume, but reports 5 million end customers rather than 8 million. Neither reviewed page gives
              a measurement date, unique-user methodology, active-user definition, or reconciliation between those
              figures. Visa Direct's more than 18 billion eligible endpoints describes Visa's network reach, not Zero
              Hash customers or active users. These numbers therefore demonstrate potential distribution and
              infrastructure scale, but they cannot be combined into a customer-growth series or treated as retention.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Named relationships and deployment quality
        blocks:
          - type: paragraph
            body: >-
              Named relationship evidence is strongest for large financial and fintech platforms. CoinDesk identifies
              Morgan Stanley, Stripe, Interactive Brokers, and BlackRock's BUIDL fund as clients, and Zero Hash's own
              industry page also displays or quotes those brands. Separate company announcements describe Visa Direct
              capabilities, Plasma availability on Public with BitMart and Bolt planned, and Monad-enabled use cases for
              Kalshi, Gusto, and Public. This establishes commercial relevance across trading, payments, payroll, and
              tokenization, but production status and measured outcomes vary by relationship. Company-hosted quotes from
              Public, Gusto, Worldpay, Interactive Brokers, and MoneyLion are useful qualitative references; they do not
              disclose utilization, contract value, renewal, or cohort behavior. The allocated CaseStudies page did not
              provide a company-specific deployment narrative in its fetched text.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU016
      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The likely expansion mechanism is modular: a customer can begin with one embedded workflow and add
              trading, custody, payments, settlement, or tokenization without a separate infrastructure rebuild. A
              partner directory also describes pricing as tailored to transaction volume and services used, which would
              align vendor economics with customer usage if the description is accurate. Public evidence does not reveal
              net or gross revenue retention, churn, renewal timing, contract length, top-customer revenue
              concentration, minimum commitments, or implementation failure rates. CoinDesk's report that Mastercard
              abandoned an investment after acquiring BVNK is an adverse strategic-relationship signal, not evidence of
              customer churn, and should not be overstated. Diligence should therefore test whether recognizable logos
              translate into durable production revenue and whether the largest platforms create pricing or
              concentration leverage.
            claimRefs:
              - CU003
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad enterprise relevance
            body: >-
              Public evidence spans trading, payments, payroll, remittance, and tokenization, with independently
              reported clients including Morgan Stanley, Stripe, Interactive Brokers, and BlackRock's BUIDL fund.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU008
          - type: callout
            title: Logos do not establish durability
            body: >-
              The reviewed public file does not disclose retention, contract duration, cohort expansion, or revenue
              concentration, and the two available end-customer figures are not reconciled.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and prioritization
        blocks:
          - type: paragraph
            body: >-
              The central diligence issue is concentration of obligations rather than a single disclosed incident. Zero
              Hash says it administers custody and other digital-asset services behind partner interfaces, while its own
              materials assign the platform node operations, liquidity management, regulatory licensing, and settlement
              workflows. That architecture can reduce a customer's build burden, but it also creates a common failure
              domain: regulatory restrictions, custody-control weakness, liquidity disruption, or integration failure
              could propagate across several products and partners. The company reports 99.99% uptime and more than $50
              billion of settled volume, but those are company-published measures rather than an independently tested
              service-level record. The heatmap therefore ranks control concentration and regulatory change above
              isolated feature risk, and treats undisclosed incident, audit, and recovery evidence as a diligence gap
              rather than evidence that no incident occurred.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR013
              - CR015
              - CR017
      - number: '7.2'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Public evidence confirms meaningful authorization but not a globally uniform permission set. New York's
              regulator lists Zero Hash entities with virtual-currency and money-transmitter licenses, and Zero Hash
              states that its Dutch entity holds CASP and electronic-money authorizations. However, company disclosures
              also say products may be unavailable in some jurisdictions, accounts lack FDIC and SIPC protection, and
              Zero Hash is not registered with the SEC or FINRA. NYDFS can restrict listed assets and requires licensees
              to operate within approved listing pathways. The investment implication is that launch scope, asset
              coverage, and customer disclosures remain jurisdiction-specific. Diligence should verify every active
              legal entity, license, approved activity, safeguarding regime, and open examination rather than treating
              the public license footprint as a blanket approval.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The operating model spans custody, compliance monitoring, transaction processing, liquidity, node
              operations, and settlement. The public Monad integration places several of those functions within one
              operating stack. These are concrete control surfaces, not proof of failure, but they increase the number
              of interfaces at which errors can arise. The strongest public mitigation is architectural and
              company-reported: a governed platform, embedded controls, dedicated support, and a 99.99% uptime claim.
              Missing are independently reviewed availability calculations, incident history, recovery objectives,
              custody/key-management design, loss experience, and audit exceptions. A confirmatory diligence package
              should therefore test the controls behind the uptime number and the handoffs among Zero Hash, external
              chains, liquidity providers, and partner systems.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Partner, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Distribution and execution are intertwined with large counterparties and external networks. The Visa
              Direct announcement covers eligible clients, while the Monad integration depends on an external chain plus
              Zero Hash's operational stack. Separately, independent reporting documents both the September 2025
              financing base and CoinDesk's report that Mastercard walked away from a potential investment and that Zero
              Hash was seeking new capital above a $1.5 billion valuation. This does not establish funding distress, but
              it makes financing certainty and strategic-counterparty conversion material diligence items. Monitorable
              thesis-break triggers include loss or suspension of a core license, a material custody or settlement
              incident, sustained availability below the contracted service level, failed reconciliation at scale,
              withdrawal of a major distribution partner, or financing terms that materially impair runway or
              common-equity outcomes. The public record does not disclose burn, runway, customer concentration,
              liquidity-provider concentration, or loss reserves, so those quantities remain gaps rather than estimated
              risk values.
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
              - CR016
              - CR017
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Common failure domain
            body: >-
              The same provider layer handles several regulated and operationally critical functions, so diligence
              should test correlated failure and recovery rather than reviewing each product feature in isolation.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause an investment if core license scope cannot be reconciled to live products, if material custody or
              settlement losses are undisclosed, if tested availability materially trails contractual commitments, or if
              financing terms leave inadequate runway or impair common-equity outcomes.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence recommendation is track / research more, with medium confidence and
              medium-high underwriting risk. The case for continued attention is stronger than the case for purchase:
              third-party reporting places the September 2025 Series D-2 at $104 million and the May 2026 financing
              effort above a $1.5 billion valuation, while company-issued evidence shows a broad regulated product
              footprint. Those signals establish relevance, not fair value. The retained financing reports do not
              provide revenue, gross margin, cash burn, customer concentration, ownership, or preference terms. Without
              those denominators, neither a target return nor dilution-adjusted entry price can be calculated. Any
              transaction should therefore remain conditional on data-room economics and signed terms rather than the
              headline financing or acquisition reference points.
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Zero Hash occupies a valuable control point between regulated financial institutions
              and fragmented digital-asset rails. Its own materials describe one integration spanning trading, custody,
              compliance, settlement, and money movement; the Visa Direct announcement adds a current distribution
              signal, and the documented U.S. and European authorizations raise the cost of replication. The anti-thesis
              is equally material. These are mostly company-issued operating claims, named logos do not disclose revenue
              quality or concentration, and a reported Mastercard process did not become a transaction. Anvesan's
              register-oriented profile strengthens the licensing case but does not validate unit economics. Investment
              merit therefore turns on whether regulatory breadth converts into durable, diversified, high-margin volume
              rather than expensive compliance and integration work.
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Financing context and scenario valuation
        blocks:
          - type: paragraph
            body: >-
              Public valuation context is informative but not directly comparable. FinTech Global reported a $104
              million Series D-2 and unicorn status in September 2025. Coincub reported non-finalized acquisition
              discussions near $2 billion in October 2025, while CoinDesk later reported that Mastercard walked away and
              that Zero Hash was seeking new capital above $1.5 billion in May 2026. A private round, an asking
              valuation, and an unconsummated M&A discussion have different instruments, control rights, and outcomes;
              they should not be treated as equivalent valuation observations. The scenario framework therefore uses the
              $1.5 billion to $2.0 billion interval only as an external discussion band in the bull case, not as an
              intrinsic-value estimate. Base and bear cases remain deliberately unpriced until audited economics and
              complete financing terms are available.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but unproven. Strategic interest reported in 2025, the 2026 Visa Direct
              relationship, and participation by established financial institutions in the prior round indicate that the
              asset can attract sophisticated counterparties. The terminated Mastercard path also shows why strategic
              interest is not a dependable exit commitment. Before moving beyond track, diligence should reconcile gross
              and net revenue, take rate, gross margin, cash burn, runway, customer and partner concentration,
              regulated-entity profitability, cap-table ownership, liquidation preferences, debt, and the exact terms of
              the current raise. The view should break if institutional launches fail to produce diversified recurring
              economics, if licensing costs outpace contribution margin, or if new capital requires a down round or
              investor-protective structure that impairs common-equity returns.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              The public record supports strategic relevance, but not an investable valuation. Move from track to buy
              only after the data room supports durable economics, manageable concentration, clean terms, and a return
              case at the actual entry price.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV016
