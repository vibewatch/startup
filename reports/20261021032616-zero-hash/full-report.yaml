      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence offers several scale indicators but no denominator-consistent market
              forecast. Visa reported that digital remittances rose from 25.5% of total remittances in Q2 2016 to 56.7%
              in Q3 2022, while its 2022 transfer-type chart separated 27.5% as digitally initiated and 30.4% as digital
              end-to-end. Circle reported $71.9 billion of USDC in circulation on October 19, 2026, availability in more
              than 185 countries, and native support on 38 blockchains. Zero Hash separately announced access to Visa
              Direct's network of more than 18 billion endpoints in over 195 countries and territories. These figures
              show large underlying flows and distribution surfaces, but they measure shares, token stock, technical
              availability, and endpoints rather than infrastructure fees. They cannot be summed or converted into TAM,
              SAM, or SOM without contract pricing, addressable-volume, and take-rate evidence.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
