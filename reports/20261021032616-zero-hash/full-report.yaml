      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Budget ownership sits with the financial institution or platform embedding the capability, while end users
              interact with the partner's branded experience. For brokerages, the economic buyer is likely a product,
              digital-assets, operations, or compliance leader seeking to add trading without running execution,
              custody, settlement, and licensing internally; the those functions internally; a third-party company
              profile says partners maintain their branding and customer relationships. For payment service providers
              and payroll platforms, treasury and payments teams have a working-capital rationale because stablecoin
              settlement can operate continuously and shorten settlement cycles. Banks and fintechs face the broadest
              governance path because legal, risk, compliance, technology, and product teams all influence approval. The
              typical adoption sequence is a partner-led product decision, technical integration through APIs or SDKs,
              compliance and custody design, corridor or asset launch, then expansion into adjacent workflows.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by continued remittance digitization, 24/7 settlement, lower reliance on prefunding,
              and demand for embedded access rather than a separate crypto product. Visa's remittance analysis also
              found lower average Q1 2024 costs for mobile-money and card-funded transfers than for cash, reinforcing
              the incentive to migrate money movement toward digital channels. Zero Hash's Monad and Plasma integrations
              illustrate how additional chains can widen supported payment, payroll, commerce, and settlement workflows
              without each platform operating blockchain infrastructure itself. Adoption is not automatic: services vary
              by jurisdiction, crypto and stablecoin balances lack FDIC or SIPC protection, buyers must accept
              concentration in a multi-function provider, and existing payment rails often remain in place. For
              valuation, the opportunity should be underwritten through contracted volume, realized take rate, renewal,
              gross margin, and customer concentration rather than multiplying broad payment flows by an assumed fee.
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite fee pools, not payment principal
            body: >-
              The defensible sizing bridge is contracted eligible volume multiplied by realized net take rate, adjusted
              for product mix and retention; none of those inputs is available in the assigned public evidence.
            calloutType: insight
            claimRefs:
              - CM016
          - type: callout
            title: Broad distribution does not prove monetization
            body: >-
              Visa endpoint reach, USDC circulation, and country or blockchain availability establish ecosystem scale
              but do not disclose Zero Hash adoption, market share, pricing, or revenue.
