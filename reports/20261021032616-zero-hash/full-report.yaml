        - Valuation, financing terms, customer concentration, and profitability remain opaque.
      - - Valuation stance
        - Unproven at public reference points
        - Treat >$1.5B financing and ~$2.0B historical M&A discussion as context, not fair value.
    notes: >-
      Assessments distinguish reported financing and non-finalized M&A reference points from an intrinsic valuation; no
      target return is estimated without operating and term data.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis decision matrix
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Integrated regulated infrastructure can reduce the technical and compliance burden for brokerages and payment
          providers.
        - >-
          Audited segment economics showing durable gross margin and recurring platform revenue would strengthen the
          thesis.
      - - Thesis
        - >-
          Visa Direct distribution and a broad authorization footprint indicate strategic relevance and replication
          difficulty.
        - >-
          Production volume, renewal, and attach-rate evidence across several unrelated customers would convert
          relevance into commercial proof.
      - - Anti-thesis
        - Named relationships and geographic reach do not reveal revenue contribution, concentration, or profitability.
        - Customer-level revenue, retention, and contribution-margin cohorts would narrow this gap.
      - - Anti-thesis
        - >-
          Mastercard reportedly left the investment path after earlier acquisition discussions, so strategic interest is
          not a committed exit.
        - >-
          A signed financing or acquisition agreement with disclosed economics and limited preference overhang would
          reduce this risk.
    notes: >-
      Company-issued relationship and product evidence is treated as claimed rather than independently verified;
      requested change-of-view evidence is private diligence material.
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Visa-scale distribution converts into diversified recurring volume; audited growth and margin are strong;
          financing terms are clean.
        - >-
          Use the observed $1.5B-$2.0B external discussion band only after KPI and preference verification; require a
          credible path to venture returns above entry.
        - Execution, regulation, and multiple compression.
        - Signed enterprise expansion plus audited cohorts and an unstructured round.
      - - Base
        - Institutional adoption progresses, but economics and concentration remain only partly visible.
        - >-
          No defensible numeric fair-value range from public evidence; negotiate below the >$1.5B financing ask and
          model returns from disclosed economics.
        - Slow ramp, compliance cost, customer concentration, and dilution.
        - Renewals and volume grow while margins remain below target or undisclosed.
      - - Bear
        - Strategic conversion stalls, financing weakens, or regulated-entity costs overwhelm contribution margin.
        - >-
          No public valuation floor is supportable; assume down-round or structured-recapitalization risk rather than
          extrapolating the historical M&A discussion.
        - Failed commercialization, adverse terms, liquidity needs, and loss of a major partner.
        - Delayed launches, concentration loss, compressed margin, or investor-protective financing.
    notes: >-
      Scenarios are conditional decision rules, not forecasts; the only numeric band reproduces reported external
      discussions and is not an appraisal or transaction value.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV012
      - CV013
      - CV016
