      - number: '4.2'
        title: Enterprise distribution is visible; commercial efficiency is not
        blocks:
          - type: paragraph
            body: >-
              The public go-to-market motion appears enterprise-led and integration-heavy. Both reviewed industry pages
              route prospects to a demo rather than publishing a list price, and the brokerage page explicitly leaves
              end-customer pricing with the partner. The August 2026 Visa Direct announcement is meaningful distribution
              evidence because eligible clients can use Zero Hash-powered stablecoin prefunding and payouts. The cited
              reach of more than 18 billion endpoints across more than 195 countries and territories belongs to Visa
              Direct, however, and is not Zero Hash volume, revenue, or customer count. Likewise, the company claim that
              stablecoin settlement can compress days to minutes describes customer value, not monetization. No source
              in the assigned pool reveals sales-cycle length, implementation fees, contract duration, discounting, CAC,
              or payback.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
