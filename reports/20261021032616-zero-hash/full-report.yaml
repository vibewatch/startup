  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad, but the charging unit is private
        blocks:
          - type: paragraph
            body: >-
              Zero Hash supplies API-integrated trading, custody, settlement, and money movement capabilities to
              platforms rather than selling a stand-alone consumer application. The brokerage page says partners retain
              the user experience, pricing, and product strategy while Zero Hash manages execution, custody, asset
              movement, and compliance infrastructure. That allocation suggests several plausible revenue events,
              including execution activity, custody or account administration, settlement and payout activity, and
              implementation or platform access. The reviewed sources do not disclose which of those events is billed,
              the contract minimum, the take rate, or the contribution of each stream. The revenue bridge is therefore a
              mechanism map rather than a forecast: customer activity reaches Zero Hash's operating stack, but both the
              monetization step and gross-profit conversion remain unquantified.
