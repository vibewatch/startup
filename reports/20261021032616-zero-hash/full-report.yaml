  - id: FM001
    title: Addressability filter from broad flows to the Zero Hash wedge
    type: pyramid
    summary: >-
      The opportunity narrows from global money movement to digital rails, stablecoin-enabled workflows, outsourced
      regulated infrastructure, target buyers, and contracted Zero Hash use.
    data:
      items:
        - label: Global money movement and remittances
          value: Broad flow pool; not a revenue TAM
          detail: Gross principal is outside the vendor-spend boundary.
        - label: Digitally enabled remittances
          value: 56.7% of remittances in Q3 2022
          detail: Visa's digital-share measure is an adoption signal, not a fee pool.
        - label: Stablecoin-enabled rails
          value: $71.9B USDC circulation on 2026-10-19
          detail: Issuer-reported token stock is a rail-scale proxy, not addressable revenue.
        - label: Embedded financial workflows
          value: Trading, payments, payroll, remittance, and tokenization
          detail: Only workflows requiring embedded infrastructure enter the category.
        - label: Outsourced regulated stack
          value: Execution, custody, compliance, and settlement
          detail: The serviceable layer is the build-versus-buy spend outsourced by platforms.
        - label: Zero Hash serviceable wedge
          value: Brokerages, PSPs, banks, fintechs, and payroll platforms
          detail: Actual SOM requires contracted volumes, pricing, renewals, and take rates.
    approximationNotes: >-
      Conceptual narrowing only: labels mix sourced adoption markers with qualitative filters, so layer widths do not
      represent proportional market values or a calculable TAM/SAM/SOM.
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM009
      - CM014
      - CM016
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates product-scope breadth from the extent to which a vendor appears to externalize
      regulatory and operating complexity for buyers.
    data:
      points:
        - label: Zero Hash
          x: 5
          'y': 5
          detail: Broad trading, payments, custody, compliance, and tokenization scope.
        - label: Coinbase
          x: 4
          'y': 3
          detail: Integrated wallet, liquidity, and network model.
        - label: Circle
          x: 3
          'y': 4
          detail: Issuer-linked wallets and cross-chain infrastructure.
        - label: Fireblocks
          x: 3
          'y': 2
          detail: Custody-led MPC infrastructure with adjacent trading and staking.
        - label: BitGo
          x: 3
          'y': 3
          detail: Qualified custody and MPC with selected tokenization activity.
        - label: On-ramp specialists
          x: 2
          'y': 3
