  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Zero Hash is an infrastructure layer rather than a consumer application: its customers embed digital-asset
              functions into an existing brokerage, bank, fintech, payroll, or payments experience. The current product
              surface spans trading, custody, settlement, stablecoin funding and payouts, tokenization, wallets, and
              on/off-ramps. Brokerage materials describe one integration for execution, custody, compliance, settlement,
              and asset movement, while the 2026 Visa Direct announcement extends the same model to stablecoin merchant
              prefunding and payouts for eligible clients. This breadth is strategically useful because customers can
              add modules without launching a separate digital-asset stack. It also complicates diligence: the public
              file does not distinguish generally available modules from partner-specific configurations, does not
              publish adoption by module, and gives no complete jurisdiction-by-asset matrix.
            claimRefs:
