  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable category is narrower than crypto trading, stablecoin circulation, or global remittance
              principal. Zero Hash sells an embedded operating layer: regulated execution, custody, asset movement,
              settlement, monitoring, and integration capabilities that a bank, brokerage, fintech, payroll platform, or
              payment provider would otherwise assemble internally or source from several specialists. Its disclosed
              workflows span trading, cross-border payments, payroll, remittance, commerce, tokenization, wallets, and
              on/off ramps. The relevant spend boundary is therefore outsourced infrastructure and compliance, not the
              face value of assets or payments moving over those rails. Status-quo substitutes include internal build,
              incumbent bank and card rails, separate custody and liquidity vendors, and stablecoins operating alongside
              existing payment systems. This boundary avoids counting Circle's USDC circulation or Visa's endpoint reach
              as Zero Hash-addressable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM015
              - CM016
