      - number: '5.2'
        title: Integration and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has six layers: a partner-controlled customer experience; REST APIs, SDKs, and
              webhooks; participant onboarding and eligibility controls; execution, account movement, settlement, and
              payout services; custody and compliance operations; and external blockchain, stablecoin, fiat, and
              payment-network rails. A third-party developer directory describes separate certification and production
              endpoints, HMAC-signed requests, asynchronous KYC approval, and webhook-driven status updates. Those
              mechanics are consistent with an enterprise integration rather than a self-serve developer product: the
              same directory says credentials require KYB onboarding and a signed agreement. The design reduces what
              partners must build, but creates operational dependency on Zero Hash's authorization, onboarding, custody,
              chain connectivity, and reconciliation controls.
            claimRefs:
