schemaVersion: "report-v2"
artifact: competitors
slug: zero-hash
runDate: "2026-10-21"
company:
  name: Zero Hash
chapter:
  number: 3
  title: Competitors
  summary: >-
    Zero Hash competes across a fragmented set of vertically integrated networks,
    custody platforms, on-ramp specialists, internal builds, and bank-owned digital
    money rails. Its broad regulated infrastructure and partner-led distribution are
    differentiators, but private pricing, switching-cost, multi-homing, and
    competitor-scale data prevent a definitive durability ranking.
sections:
  - id: landscape-and-substitutes
    title: Landscape, substitutes, and likely entrants
    body: >-
      Zero Hash is best evaluated as embedded infrastructure rather than as a retail
      exchange. Independent profiles describe a B2B platform for brokerages, banks,
      fintechs, and payment providers, while Zero Hash's own materials place trading,
      stablecoin movement, custody, compliance, and tokenization behind partner
      brands. The direct comparison set is therefore fragmented: Coinbase and Circle
      bring vertically integrated networks, Fireblocks and BitGo emphasize custody
      infrastructure, and MoonPay, Banxa, and Sardine specialize in fiat on-ramps.
      Buyers can also retain existing rails, build internally, or use tokenized bank
      deposits. Those substitutes matter because they trade product breadth for
      control, incumbent distribution, or a more familiar regulatory treatment.
      Public evidence does not provide comparable scale or funding for every peer, so
      the profile table marks those fields unavailable rather than manufacturing a
      ranking.
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP007, CP012]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-distribution-and-trust
    title: Capability, distribution, and trust posture
    body: >-
      The central differentiation claim is integration breadth. Zero Hash says one
      integration can combine execution, custody, asset movement, compliance, and
      settlement while the partner retains its user experience, pricing, and product
      strategy. Its published regulatory footprint spans 51 U.S. jurisdictions and
      licensed entities in Europe, although that remains company-issued evidence and
      should not be mistaken for an independent compliance benchmark.       The Visa Direct announcement indicates that distribution can compound through
      networks and partners rather than only through direct sales. The same model
      creates channel dependence: the partner owns the customer
      relationship and can potentially multi-home, switch infrastructure vendors, or
      build selected capabilities. No retained source quantifies renewal rates,
      migration effort, exclusivity, or the share of volume tied to any distributor.
    claimRefs: [CP003, CP008, CP009, CP014]
    tableRefs: [TP002]
  - id: economics-and-moat-durability
    title: Pricing opacity and moat durability
    body: >-
      Pricing is the weakest public comparison surface. Sacra characterizes Zero
      Hash's model as transaction based and estimates an implied 0.146% take rate,
      but neither that estimate nor company marketing establishes realized pricing,
      minimum commitments, discounts, or gross margin. Competitor pricing is also
      absent from the assigned evidence, making a like-for-like price comparison
      impossible. Durability instead rests on whether regulatory operations,
      liquidity, custody, and multi-chain integrations remain costly for customers to
      reproduce. Sector evidence cuts both ways: Chainalysis argues that banks must
      understand and monitor crypto exposure, which supports demand for specialized
      controls, while J.P. Morgan notes that tokenized deposits and tokenized money
      funds may provide familiar alternatives and questions how broadly stablecoins
      displace existing consumer payment rails. The result is a plausible compliance
      and integration moat, not proof of lock-in.
    claimRefs: [CP010, CP011, CP012, CP016]
    tableRefs: [TP003]
tables:
  - id: TP001
    title: Competitive landscape and substitute profile
    columns:
      - Alternative
      - Category
      - Public scale or funding
      - Target buyer
      - Differentiation
      - Limitation or diligence caveat
    rows:
      - [Zero Hash, "B2B full-stack infrastructure", "Sacra: $275M total funding in 2025", "Brokerages, fintechs, financial institutions, PSPs", "Trading, payments, custody, compliance, and tokenization through embedded infrastructure", "Realized pricing, customer concentration, and switching data are not public"]
      - [Coinbase, "Vertically integrated network", "Not established in assigned evidence", "Platforms seeking embedded wallets and liquidity", "Wallet-as-a-service tied to Coinbase liquidity and Base", "Buyer dependence on an integrated network was not independently benchmarked"]
      - [Circle, "Stablecoin issuer and infrastructure", "Not established in assigned evidence", "Platforms building around USDC or EURC", "Programmable wallets and cross-chain transfer infrastructure", "Issuer concentration and product breadth versus Zero Hash require primary comparison"]
      - [Fireblocks, "Custody-focused infrastructure", "Not established in assigned evidence", "Institutions needing MPC wallet rails", "Non-custodial MPC wallet APIs with trading and staking capabilities", "Full-stack regulatory abstraction was not established by the retained source"]
      - [BitGo, "Custody-focused infrastructure", "Not established in assigned evidence", "Institutional custody buyers", "Qualified custody, MPC, and tokenized-equity partnerships", "Embedded payments and tokenization breadth remain unverified"]
      - ["MoonPay / Banxa / Sardine", "Specialized on-ramp providers", "Not established in assigned evidence", "Apps needing fiat-to-crypto conversion", "Potentially faster onboarding and broader payment methods", "Sacra reports less full-stack custody, trading, and tokenization coverage"]
      - ["Internal build or status quo", Substitute, "Cost not public", "Large regulated institutions", "Maximum control over product, data, and vendor exposure", "Buyer retains licensing, custody, compliance, settlement, and operating burden"]
      - ["Bank-owned tokenized deposits", "Likely entrant or substitute", "Not established in assigned evidence", "Banks and regulated financial institutions", "Familiar liability, capital, liquidity, and leverage treatment", "Interoperability, external reach, and buyer adoption remain unresolved"]
    notes: >-
      Coverage is a representative landscape from assigned independent and company
      sources, not an exhaustive market census; unavailable peer scale, pricing, and
      regulatory fields are explicitly marked rather than inferred.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP011, CP012, CP016]
  - id: TP002
    title: Capability and distribution matrix
    columns:
      - Buying criterion
      - Zero Hash
      - Coinbase / Circle
      - Fireblocks / BitGo
      - MoonPay / Banxa / Sardine
      - Internal build
    rows:
      - ["Trading and asset breadth", "Supported; Sacra reports 80+ digital assets", "Partial; integrated liquidity or issuer ecosystems", "Partial; trading capabilities reported for Fireblocks", "Narrower on-ramp focus", "Possible, but scope and cost are buyer-specific"]
      - ["Stablecoin settlement and payouts", "Supported across multiple stablecoins and chains", "Supported through integrated network or issuer rails", Unknown, "On-ramp functionality; settlement breadth unknown", "Possible; operational burden retained"]
      - ["Custody and compliance operations", "Company says custody, compliance, and settlement are built in", "Mixed and not compared consistently", "Core emphasis", "Compliance tools reported; custody depth unknown", "Buyer owns controls and execution"]
      - [Tokenization, "Supported as a platform module", "Partial or ecosystem-specific", "BitGo partnership activity reported; Fireblocks unknown", Unknown, "Possible with additional infrastructure"]
      - ["Distribution model", "Embedded behind partner brands", "Vertically integrated network distribution", "Infrastructure sold to institutions", "Embedded widgets and payment methods", "Owned distribution"]
      - ["Regulatory abstraction", "Company reports U.S. and European licensed entities", Unknown, Unknown, Partial, "No abstraction; buyer retains licensing responsibility"]
    notes: >-
      Supported and partial cells reflect only the assigned evidence. Unknown means
      the pool did not establish the capability, not that the competitor lacks it.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Reported contract model
      - Unit or price
      - Included capabilities
      - Discount or unknowns
      - Buyer implication
    rows:
      - [Zero Hash, "Sacra reports transaction-based fees", "Sacra-estimated implied take rate: 0.146%", "Trading, payments, custody, and tokenization", "List pricing, realized take rate, minimums, and discounts unknown", "Economics should scale with partner transaction volume, but margin cannot be underwritten"]
      - ["Coinbase / Circle", Unknown, Unknown, "Embedded wallets, liquidity, or issuer-linked rails", "Comparable enterprise terms unavailable", "Integrated-network economics require direct procurement"]
      - ["Fireblocks / BitGo", Unknown, Unknown, "Custody and wallet infrastructure", "Comparable enterprise terms unavailable", "Likely evaluated against a narrower custody-led scope"]
      - ["MoonPay / Banxa / Sardine", Unknown, Unknown, "Fiat on-ramp and payment-method coverage", "Comparable enterprise terms unavailable", "Potential onboarding advantage cannot be priced from public evidence"]
      - ["Internal build", "Internal fixed and variable cost", "Not quantified", "Buyer-selected stack", "Licensing, staffing, liquidity, custody, and maintenance costs unknown", "Control must be weighed against time-to-market and operating burden"]
    notes: >-
      Pricing coverage is partial. The Zero Hash take rate is a Sacra estimate, not
      disclosed list pricing or verified realized revenue; all competitor terms are
      unavailable in the assigned source pool.
    claimRefs: [CP007, CP008, CP010]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates product-scope breadth from the extent to which a
      vendor appears to externalize regulatory and operating complexity for buyers.
    data:
      points:
        - label: Zero Hash
          x: 5
          y: 5
          detail: "Broad trading, payments, custody, compliance, and tokenization scope."
        - label: Coinbase
          x: 4
          y: 3
          detail: "Integrated wallet, liquidity, and network model."
        - label: Circle
          x: 3
          y: 4
          detail: "Issuer-linked wallets and cross-chain infrastructure."
        - label: Fireblocks
          x: 3
          y: 2
          detail: "Custody-led MPC infrastructure with adjacent trading and staking."
        - label: BitGo
          x: 3
          y: 3
          detail: "Qualified custody and MPC with selected tokenization activity."
        - label: On-ramp specialists
          x: 2
          y: 3
          detail: "Focused fiat conversion and embedded payment-method coverage."
    approximationNotes: >-
      Coordinates are ordinal analyst scores from 1 (narrow or buyer-operated) to 5
      (broad or highly externalized), derived only from Sacra's category descriptions
      and Zero Hash's retained product evidence. They are not measured market
      benchmarks, price rankings, or independent product tests.
    claimRefs: [CP013]
callouts:
  - calloutType: strength
    title: Breadth is the core differentiation thesis
    body: >-
      Zero Hash combines several functions that the independent profile separates
      across integrated networks, custody vendors, and on-ramp specialists.
    claimRefs: [CP002, CP004, CP005, CP006]
  - calloutType: risk
    title: Public evidence does not prove switching costs
    body: >-
      Partner-owned customer relationships and absent renewal, exclusivity, migration,
      and realized-pricing data leave lock-in and margin durability unverified.
    claimRefs: [CP008, CP010, CP016]
