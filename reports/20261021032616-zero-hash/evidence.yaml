evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A current executive roster, board composition, committee structure, succession plan, and founder voting-control
      disclosure.
    whyItMatters: The public record is too founder-centric to assess functional coverage, independent oversight, or key-person risk.
    diligencePath: Request the current organization chart, board materials, governance documents, and fully diluted voting schedule.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Closed 2026 financing documents, total capital raised, debt and secondary activity, liquidation preferences,
      ownership, and cash availability.
    whyItMatters: A reported target valuation does not establish completed proceeds, present valuation, dilution, or runway.
    diligencePath: >-
      Obtain the capitalization table, executed financing documents, debt schedule, bank statements, and board-approved
      cash plan.
    relatedQuestionRefs:
      - QO003
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale metrics
    missingEvidence: >-
      Revenue, ARR, net take rate, gross margin, profitability, enterprise-customer count, concentration, retention, and
      cohort definitions.
    whyItMatters: Cumulative volume and end-user reach cannot be converted into recurring revenue quality or unit economics.
    diligencePath: >-
      Request audited financials, monthly KPI definitions, customer-level revenue cohorts, contracts, renewal history,
      and gross-margin bridges.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A dated 2026 employee count by function, geography, and regulated entity.
    whyItMatters: >-
      The latest retained disclosure is from November 2025 and cannot establish current operating capacity or hiring
      direction.
    diligencePath: Request a current payroll-backed headcount schedule and reconcile it with legal-entity and office records.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Contracted eligible volume by product and geography, realized net take rate, pricing schedules, renewal data, and
      attributable infrastructure revenue.
    whyItMatters: >-
      These inputs are required to translate broad payment and stablecoin adoption into a denominator-consistent TAM,
      SAM, and company SOM.
    diligencePath: >-
      Request management's bottom-up market model, customer contracts, volume cohorts, product revenue bridge, and
      pricing realization by buyer segment.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A third-party category forecast that isolates regulated embedded crypto and stablecoin infrastructure revenue from
      payment principal, stablecoin stock, and custody asset values.
    whyItMatters: >-
      Available sources use incompatible denominators, periods, and market boundaries, so their figures cannot be summed
      into a credible top-down estimate.
    diligencePath: >-
      Commission or obtain a market study with explicit category definitions, vendor revenue, geography, buyer segment,
      and methodology, then reconcile it to the bottom-up model.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement
    missingEvidence: >-
      Buyer-level procurement authority, sales-cycle duration, implementation cost, renewal thresholds, and
      build-versus-buy decision records.
    whyItMatters: >-
      Public workflow pages identify users and benefits but do not establish who controls budget, how quickly adoption
      occurs, or which constraints cause losses.
    diligencePath: >-
      Interview product, treasury, compliance, and technology buyers across brokerages, PSPs, banks, fintechs, and
      payroll customers, and review won and lost deal records.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized enterprise pricing, minimum commitments, discounts, take rates, and comparable competitor proposals.
    whyItMatters: Without comparable realized terms, relative pricing power and gross-margin durability cannot be underwritten.
    diligencePath: >-
      Obtain anonymized contracts and current proposals for Zero Hash and at least two competing infrastructure
      providers.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Renewal rates, exclusivity, multi-homing, integration effort, migration duration, and customer churn by product.
    whyItMatters: Product breadth does not establish lock-in when the partner owns the customer relationship and pricing.
    diligencePath: Review customer cohorts, renewal files, integration architecture, and lost-deal interviews.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: competitive-positioning
    missingEvidence: >-
      Independent, current buyer benchmarks comparing reliability, compliance outcomes, implementation time, and total
      cost.
    whyItMatters: The positioning map is ordinal and source-constrained rather than a measured performance comparison.
    diligencePath: Commission reference calls and collect third-party procurement scorecards across each competitor class.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-scale
    missingEvidence: >-
      Comparable revenue, transaction volume, customer count, funding, and geographic coverage for every named
      competitor.
    whyItMatters: Uneven public disclosure prevents a consistent scale and resilience ranking.
    diligencePath: Collect primary filings, funding announcements, and current corporate metrics for each named competitor.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-model
    missingEvidence: Realized price schedules, contract minimums, discounts, implementation fees, and revenue mix by product.
    whyItMatters: >-
      Without realized pricing and mix, product breadth cannot be converted into revenue quality or forecastable
      economics.
    diligencePath: >-
      Review signed contracts and invoice-level billings for the largest customer cohorts, reconciled to recognized
      revenue.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Net take rate, gross margin, CAC, payback, sales cycle, implementation cost, retention, and customer
      concentration.
    whyItMatters: >-
      These metrics determine whether enterprise expansion creates durable gross profit or increases service and
      compliance burden.
    diligencePath: >-
      Obtain monthly product-level revenue and cost cohorts, sales-spend attribution, and customer retention schedules
      for at least 24 months.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, restricted cash, debt, regulatory capital, working-capital requirements, monthly net burn, and
      runway.
    whyItMatters: >-
      A historical financing amount does not establish current liquidity, solvency, or the timing of the next external
      capital need.
    diligencePath: >-
      Reconcile bank statements, debt schedules, regulatory-capital reports, and a board-approved 24-month cash forecast
      to the general ledger.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: funding-total
    missingEvidence: A cap-table and cash-ledger reconciliation of the $268 million and $275 million reported total-funding figures.
    whyItMatters: >-
      The discrepancy is small relative to the latest round but demonstrates that aggregate funding databases are not a
      substitute for cash records.
    diligencePath: >-
      Reconcile every financing close, secondary component, fees, and cash receipt to the capitalization table and bank
      ledger.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: security and controls
    missingEvidence: >-
      Current independent security certifications, penetration-test scope, control-test exceptions, custody-control
      reports, and remediation history.
    whyItMatters: >-
      Partners entrust Zero Hash with authenticated financial instructions, customer onboarding, custody, and
      compliance-critical operations.
    diligencePath: >-
      Obtain current SOC reports or equivalent control attestations, penetration-test executive summaries, open
      findings, custody audits, and management remediation evidence under NDA.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Uptime measurement methodology, incident history, latency percentiles, recovery objectives, error rates, and
      contractual service-level remedies.
    whyItMatters: The public 99.99% figure cannot establish realized availability or the severity and duration of outages.
    diligencePath: >-
      Review 24 months of status and incident records, SLA calculations, RTO/RPO tests, API latency distributions, and
      service-credit history.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: enumeration-incomplete
    severity: material
    topic: product maturity
    missingEvidence: >-
      A current module-by-module list of general availability, beta status, customer count, implementation time, and
      planned launch dates.
    whyItMatters: >-
      Public product breadth and announcements do not show which capabilities are repeatable, widely deployed, or still
      partner-specific.
    diligencePath: >-
      Request the product catalog, release history, current roadmap, deployment cohorts, implementation-time
      distribution, and module adoption metrics.
    relatedQuestionRefs:
      - QE002
      - QE007
    relatedTableRefs:
      - TE001
  - type: enumeration-incomplete
    severity: material
    topic: asset and jurisdiction coverage
    missingEvidence: A complete asset-by-chain-by-entity-by-jurisdiction eligibility matrix with current restrictions and dependencies.
    whyItMatters: >-
      Headline asset and country counts can overstate the combinations actually available to a given partner or end
      customer.
    diligencePath: >-
      Reconcile the production market catalogue with legal-entity permissions, customer eligibility rules, chain
      support, and partner contracts.
    relatedQuestionRefs:
      - QE001
      - QE002
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal cohorts, contract duration, minimum commitments, and implementation
      failure rates by customer segment.
    whyItMatters: Named relationships and end-user reach do not establish durable recurring economics or switching costs.
    diligencePath: >-
      Review customer-level contracts and quarterly cohorts; reconcile beginning revenue, churn, downsell, upsell, and
      new revenue for at least eight quarters.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer shares of revenue, gross profit, transaction volume, receivables, and committed
      minimums.
    whyItMatters: >-
      Large platform customers may create revenue concentration, pricing leverage, and renewal risk that a broad logo
      list obscures.
    diligencePath: >-
      Obtain an anonymized customer concentration schedule tied to audited revenue and gross profit, with contract
      expiry dates and renewal status.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: >-
      A complete roster distinguishing live production customers, pilots, announced partnerships, inactive logos, and
      technology integrations.
    whyItMatters: >-
      The named proof table is a representative sample and cannot establish the size or quality distribution of the full
      customer base.
    diligencePath: >-
      Request a CRM export reconciled to billing records and sample-reference customers across brokerage, payments,
      payroll, and tokenization segments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
