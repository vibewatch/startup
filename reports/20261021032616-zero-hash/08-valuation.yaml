schemaVersion: "report-v2"
artifact: valuation
slug: zero-hash
runDate: 2026-10-21
company:
  name: Zero Hash
chapter:
  number: 8
  title: Valuation
  summary: >-
    Zero Hash has credible strategic and commercial signals, including a reported
    Series D-2, a current financing effort above $1.5 billion, and a 2026 Visa
    Direct relationship. The recommendation is track rather than buy because the
    public evidence does not disclose the economics, financing terms, ownership,
    or concentration data needed to underwrite price or target returns.
sections:
  - id: recommendation-and-underwriting-posture
    title: Recommendation and underwriting posture
    body: >-
      The appropriate public-evidence recommendation is track / research more,
      with medium confidence and medium-high underwriting risk. The case for
      continued attention is stronger than the case for purchase: third-party
      reporting places the September 2025 Series D-2 at $104 million and the May
      2026 financing effort above a $1.5 billion valuation, while company-issued
      evidence shows a broad regulated product footprint. Those signals establish
      relevance, not fair value. The retained financing reports do not provide
      revenue, gross margin, cash burn, customer concentration, ownership, or
      preference terms. Without those denominators, neither a target return nor
      dilution-adjusted entry price can be calculated. Any transaction should
      therefore remain conditional on data-room economics and signed terms rather
      than the headline financing or acquisition reference points.
    claimRefs: [CV001, CV002, CV012, CV013, CV014, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Zero Hash occupies a valuable control point between
      regulated financial institutions and fragmented digital-asset rails. Its
      own materials describe one integration spanning trading, custody,
      compliance, settlement, and money movement; the Visa Direct announcement
      adds a current distribution signal, and the documented U.S. and European
      authorizations raise the cost of replication. The anti-thesis is equally
      material. These are mostly company-issued operating claims, named logos do
      not disclose revenue quality or concentration, and a reported Mastercard
      process did not become a transaction. Anvesan's register-oriented profile
      strengthens the licensing case but does not validate unit economics.
      Investment merit therefore turns on whether regulatory breadth converts
      into durable, diversified, high-margin volume rather than expensive
      compliance and integration work.
    claimRefs: [CV003, CV005, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: financing-context-and-scenarios
    title: Financing context and scenario valuation
    body: >-
      Public valuation context is informative but not directly comparable.
      FinTech Global reported a $104 million Series D-2 and unicorn status in
      September 2025. Coincub reported non-finalized acquisition discussions near
      $2 billion in October 2025, while CoinDesk later reported that Mastercard
      walked away and that Zero Hash was seeking new capital above $1.5 billion
      in May 2026. A private round, an asking valuation, and an unconsummated M&A
      discussion have different instruments, control rights, and outcomes; they
      should not be treated as equivalent valuation observations. The scenario
      framework therefore uses the $1.5 billion to $2.0 billion interval only as
      an external discussion band in the bull case, not as an intrinsic-value
      estimate. Base and bear cases remain deliberately unpriced until audited
      economics and complete financing terms are available.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV012, CV013]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness is plausible but unproven. Strategic interest reported in
      2025, the 2026 Visa Direct relationship, and participation by established
      financial institutions in the prior round indicate that the asset can
      attract sophisticated counterparties. The terminated Mastercard path also
      shows why strategic interest is not a dependable exit commitment. Before
      moving beyond track, diligence should reconcile gross and net revenue,
      take rate, gross margin, cash burn, runway, customer and partner
      concentration, regulated-entity profitability, cap-table ownership,
      liquidation preferences, debt, and the exact terms of the current raise.
      The view should break if institutional launches fail to produce diversified
      recurring economics, if licensing costs outpace contribution margin, or if
      new capital requires a down round or investor-protective structure that
      impairs common-equity returns.
    claimRefs: [CV001, CV003, CV007, CV008, CV011, CV012, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Track / research more", "Do not buy on public evidence alone; advance only to data-room diligence."]
      - [Confidence, Medium, "Commercial and regulatory signals are visible, but operating and ownership evidence is missing."]
      - [Risk rating, Medium-high, "Valuation, financing terms, customer concentration, and profitability remain opaque."]
      - [Valuation stance, "Unproven at public reference points", "Treat >$1.5B financing and ~$2.0B historical M&A discussion as context, not fair value."]
    notes: "Assessments distinguish reported financing and non-finalized M&A reference points from an intrinsic valuation; no target return is estimated without operating and term data."
    claimRefs: [CV001, CV002, CV004, CV012, CV013, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis decision matrix
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Integrated regulated infrastructure can reduce the technical and compliance burden for brokerages and payment providers.", "Audited segment economics showing durable gross margin and recurring platform revenue would strengthen the thesis."]
      - [Thesis, "Visa Direct distribution and a broad authorization footprint indicate strategic relevance and replication difficulty.", "Production volume, renewal, and attach-rate evidence across several unrelated customers would convert relevance into commercial proof."]
      - [Anti-thesis, "Named relationships and geographic reach do not reveal revenue contribution, concentration, or profitability.", "Customer-level revenue, retention, and contribution-margin cohorts would narrow this gap."]
      - [Anti-thesis, "Mastercard reportedly left the investment path after earlier acquisition discussions, so strategic interest is not a committed exit.", "A signed financing or acquisition agreement with disclosed economics and limited preference overhang would reduce this risk."]
    notes: "Company-issued relationship and product evidence is treated as claimed rather than independently verified; requested change-of-view evidence is private diligence material."
    claimRefs: [CV003, CV005, CV007, CV008, CV009, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Visa-scale distribution converts into diversified recurring volume; audited growth and margin are strong; financing terms are clean.", "Use the observed $1.5B-$2.0B external discussion band only after KPI and preference verification; require a credible path to venture returns above entry.", "Execution, regulation, and multiple compression.", "Signed enterprise expansion plus audited cohorts and an unstructured round."]
      - [Base, "Institutional adoption progresses, but economics and concentration remain only partly visible.", "No defensible numeric fair-value range from public evidence; negotiate below the >$1.5B financing ask and model returns from disclosed economics.", "Slow ramp, compliance cost, customer concentration, and dilution.", "Renewals and volume grow while margins remain below target or undisclosed."]
      - [Bear, "Strategic conversion stalls, financing weakens, or regulated-entity costs overwhelm contribution margin.", "No public valuation floor is supportable; assume down-round or structured-recapitalization risk rather than extrapolating the historical M&A discussion.", "Failed commercialization, adverse terms, liquidity needs, and loss of a major partner.", "Delayed launches, concentration loss, compressed margin, or investor-protective financing."]
    notes: "Scenarios are conditional decision rules, not forecasts; the only numeric band reproduces reported external discussions and is not an appraisal or transaction value."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV012, CV013, CV016]
figures:
  - id: FV001
    title: Recommendation logic from proof to price discipline
    type: flow
    summary: "The ordered chain shows why strategic proof supports tracking while missing economics prevents a buy recommendation."
    data:
      nodes:
        - id: strategic-proof
          label: Strategic proof
          detail: "Visa Direct relationship and reported sophisticated investors."
        - id: platform-scope
          label: Platform breadth
          detail: "Trading, custody, compliance, settlement, and money movement."
        - id: regulatory-moat
          label: Regulatory footprint
          detail: "U.S. multi-jurisdiction coverage and European CASP and EMI licenses."
        - id: valuation-markers
          label: Valuation markers
          detail: "$104M Series D-2; >$1.5B financing effort; prior ~$2B M&A discussion."
        - id: evidence-gap
          label: Underwriting gap
          detail: "No public revenue, margin, burn, concentration, ownership, or preference data."
        - id: recommendation
          label: Track / research more
          detail: "Require verified economics and terms before setting entry price or target return."
    approximationNotes: "The flow is qualitative and ordered; it does not assign weights, probabilities, or an intrinsic valuation."
    claimRefs: [CV005, CV007, CV008, CV012, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      The public record supports strategic relevance, but not an investable
      valuation. Move from track to buy only after the data room supports durable
      economics, manageable concentration, clean terms, and a return case at the
      actual entry price.
    claimRefs: [CV012, CV013, CV014, CV016]
