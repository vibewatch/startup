schemaVersion: "report-v2"
artifact: customers
slug: zero-hash
runDate: 2026-10-21
company:
  name: Zero Hash
chapter:
  number: 6
  title: Customers
  summary: >-
    Zero Hash publicly addresses a broad set of enterprise platforms and can point to
    recognizable financial-services relationships, but the strongest available proof is
    still a mix of company-hosted quotes, partnership announcements, and a short independent
    client list. Current public materials do not disclose retention, contract duration,
    cohort expansion, or customer concentration, and even end-customer scale is reported
    inconsistently across current pages.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying centers
    body: >-
      Zero Hash sells infrastructure to platforms rather than directly owning the primary
      consumer relationship. Its disclosed addressable buyers span banks, brokerages,
      payment service providers, fintech applications, payroll and remittance platforms,
      and tokenization businesses. The platform customer generally pays for and integrates
      the service, while that customer's end users access trading, custody, settlement,
      payout, or tokenized-asset functionality inside the partner experience. Zero Hash's
      disclosures add an important operating distinction: the partner controls the front-end
      experience and product strategy, but Zero Hash administers the underlying crypto and
      stablecoin services, including custody. That structure creates multiple buying centers
      across product, engineering, compliance, operations, and treasury, and it makes the
      regulated service layer central to customer switching costs.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-scale
    title: Adoption signals and metric comparability
    body: >-
      The public scale indicators are meaningful but not fully comparable. Zero Hash's
      current documentation displays more than $50 billion in settled transaction volume,
      8 million end customers, and support across more than 200 countries. Avalanche's
      integration directory independently repeats the country footprint and transaction
      volume, but reports 5 million end customers rather than 8 million. Neither reviewed
      page gives a measurement date, unique-user methodology, active-user definition, or
      reconciliation between those figures. Visa Direct's more than 18 billion eligible
      endpoints describes Visa's network reach, not Zero Hash customers or active users.
      These numbers therefore demonstrate potential distribution and infrastructure scale,
      but they cannot be combined into a customer-growth series or treated as retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU009]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named relationships and deployment quality
    body: >-
      Named relationship evidence is strongest for large financial and fintech platforms.
      CoinDesk identifies Morgan Stanley, Stripe, Interactive Brokers, and BlackRock's BUIDL
      fund as clients, and Zero Hash's own industry page also displays or quotes those brands.
      Separate company announcements describe Visa Direct capabilities, Plasma availability
      on Public with BitMart and Bolt planned, and Monad-enabled use cases for Kalshi, Gusto,
      and Public. This establishes commercial relevance across trading, payments, payroll,
      and tokenization, but production status and measured outcomes vary by relationship.
      Company-hosted quotes from Public, Gusto, Worldpay, Interactive Brokers, and MoneyLion
      are useful qualitative references; they do not disclose utilization, contract value,
      renewal, or cohort behavior. The allocated CaseStudies page did not provide a
      company-specific deployment narrative in its fetched text.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU016]
    tableRefs: [TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The likely expansion mechanism is modular: a customer can begin with one embedded
      workflow and add trading, custody, payments, settlement, or tokenization without a
      separate infrastructure rebuild. A partner directory also describes pricing as
      tailored to transaction volume and services used, which would align vendor economics
      with customer usage if the description is accurate. Public evidence does not reveal
      net or gross revenue retention, churn, renewal timing, contract length, top-customer
      revenue concentration, minimum commitments, or implementation failure rates. CoinDesk's
      report that Mastercard abandoned an investment after acquiring BVNK is an adverse
      strategic-relationship signal, not evidence of customer churn, and should not be
      overstated. Diligence should therefore test whether recognizable logos translate into
      durable production revenue and whether the largest platforms create pricing or
      concentration leverage.
    claimRefs: [CU003, CU012, CU014, CU015]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by buyer, user, and embedded use case
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale or relationship proof
      - Strategic value
      - Evidence gap
    rows:
      - - Brokerages and trading platforms
        - Platform product, engineering, and compliance teams buy; investors use; platform pays
        - Embedded trading, custody, funding, settlement, and asset expansion
        - Public, Interactive Brokers, tastytrade, Alinea, and other brands appear in company materials
        - Multi-product expansion inside an existing investor experience
        - No segment revenue, contract value, or retention disclosure
      - - Payments and PSPs
        - Payments, treasury, and compliance teams buy; merchants and recipients use; PSP pays
        - Stablecoin settlement, prefunding, payouts, and cross-border movement
        - Visa Direct and Worldpay are publicly associated with Zero Hash capabilities
        - Network distribution and transaction-volume potential
        - Eligible-client conversion and production volume are undisclosed
      - - Fintechs and neobanks
        - Product and compliance teams buy; app customers use; platform pays
        - Embedded crypto access, account funding, wallets, and money movement
        - Public, MoneyLion, Current, OnePay, and Kalshi appear on company pages
        - One integration can support additional assets and workflows
        - Active-account, utilization, and renewal data are unavailable
      - - Payroll and remittance platforms
        - Payroll or remittance product teams buy; workers and recipients use; platform pays
        - Stablecoin payroll, remittance, and local-currency payout
        - Gusto, Félix Pago, and payroll use cases are referenced in public materials
        - Extends payout coverage and always-on settlement options
        - Launch status and measured adoption are not consistently stated
      - - Institutions and tokenization platforms
        - Digital-asset, markets, and operations teams buy; investors transact; institution pays
        - Tokenization, custody, trading, and programmable settlement
        - Morgan Stanley and BlackRock's BUIDL fund are identified in independent reporting
        - High-value regulated workflows and institutional validation
        - Product scope, economics, and customer concentration are not public
    notes: >-
      Segments synthesize reviewed Zero Hash, partner, and independent sources; brand mentions
      indicate public relationship evidence, not uniform production status, revenue, or retention.
    claimRefs: [CU001, CU002, CU003, CU008, CU015]
  - id: TU002
    title: Public adoption and scale indicators
    columns:
      - Metric
      - Reported value
      - Source and vintage
      - Confidence
      - Diligence implication
      - Missing denominator or qualification
    rows:
      - - Settled transaction volume
        - "$50 billion+"
        - Current Zero Hash documentation; no measurement date shown
        - Medium
        - Indicates meaningful cumulative infrastructure throughput
        - Period, transaction mix, and customer concentration are not stated
      - - End customers
        - "8 million"
        - Current Zero Hash documentation; no measurement date shown
        - Medium
        - Shows broad indirect reach through platform customers
        - Unique, active, cumulative, and geographic definitions are absent
      - - End customers
        - "5 million+"
        - Avalanche Builder Hub integration page; no measurement date shown
        - Medium
        - Independently hosted partner evidence supports multi-million reach
        - Does not reconcile to the current 8 million figure
      - - Countries supported
        - "200+"
        - Zero Hash documentation and Avalanche Builder Hub; dates not shown
        - High
        - Supports a geographically broad enterprise value proposition
        - Availability, active use, and licensing scope may differ by country
      - - Visa Direct network reach
        - "18 billion+ eligible endpoints in 195+ countries and territories"
        - Zero Hash partnership announcement dated 2026-08-05
        - Medium
        - Creates a large potential distribution surface for eligible clients
        - This is Visa network reach, not Zero Hash customers or active users
    notes: >-
      Values preserve the source's metric names and denominators; they are not a common cohort,
      should not be summed, and do not establish revenue, active usage, or retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Organization
      - Segment
      - Deployment or use case
      - Production versus pilot
      - Public outcome
      - Limitation
    rows:
      - - Public
        - Brokerage / investing
        - Expanded embedded crypto capabilities
        - Commercial partnership stated; exact production scope not disclosed
        - Public says the partnership improves its crypto investing experience
        - Company-hosted quote; no quantified usage or retention
      - - Interactive Brokers
        - Brokerage
        - Crypto trading and token expansion
        - CoinDesk calls it a client; company page describes collaboration
        - Qualitative flexibility and integrated trading benefits
        - No disclosed volume, economics, or renewal terms
      - - Morgan Stanley
        - Financial institution
        - Digital-asset infrastructure relationship
        - CoinDesk calls it a client; company page lists the brand
        - Independent reporting corroborates the named relationship
        - Product scope and production metrics are not stated
      - - Gusto
        - Payroll
        - Stablecoin payout optionality
        - Relationship and intended use are stated; launch status is unclear
        - Gusto describes payout reach in more than 70 countries and future extensibility
        - No measured stablecoin adoption or customer outcome
      - - Visa Direct
        - Payments network
        - Stablecoin merchant prefunding and payouts for eligible clients
        - Announced capability availability; client conversion not reported
        - Adds potential 24/7 cross-border settlement and payout functionality
        - Zero Hash-issued announcement; no eligible-client adoption count
      - - Worldpay
        - Payments / PSP
        - Stablecoins embedded into merchant-facing products
        - Company page presents an operating-use quote; scope is not specified
        - Worldpay says stablecoins add value for merchants
        - No quantified merchant outcome, volume, or contract detail
    notes: >-
      Partial sample limited to relationships named in the assigned public evidence as of
      2026-10-21; production labels are conservative and null-equivalent where sources do not
      distinguish live deployment from announced availability.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative named relationships found in the assigned official and independent
        customer evidence, not an exhaustive customer roster.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU016]
figures:
  - id: FU001
    title: Embedded-customer adoption and expansion journey
    type: journey-map
    summary: >-
      Zero Hash's public materials describe an enterprise integration path from use-case
      selection through embedded launch and modular expansion, while commercial durability
      remains a diligence gap.
    data:
      nodes:
        - id: need
          label: Select enterprise use case
          detail: A bank, brokerage, PSP, fintech, payroll, or tokenization platform selects a regulated workflow.
          touchpoints: [Trading, Payments, Payroll, Remittance, Tokenization]
        - id: scope
          label: Scope compliance and services
          detail: Product and compliance teams choose custody, settlement, funding, trading, or payout modules.
          touchpoints: [Business verification, Jurisdiction review, Service selection]
        - id: integrate
          label: Integrate and test
          detail: The platform uses APIs or SDKs and validates the workflow before launch.
          touchpoints: [API credentials, SDKs, Sandbox, Webhooks]
        - id: launch
          label: Embed in partner experience
          detail: The platform controls its user experience while Zero Hash administers the underlying digital-asset services.
          touchpoints: [Partner application, End-user account, Custody and settlement]
        - id: expand
          label: Add modules and geographies
          detail: Customers can add assets, payment rails, trading, settlement, or tokenization on the shared infrastructure.
          touchpoints: [Additional assets, New workflows, Cross-border coverage]
        - id: prove
          label: Prove durable economics
          detail: Usage growth, renewal, cohort expansion, and concentration must be verified through private diligence.
          touchpoints: [NRR and GRR, Contract renewal, Product attach, Top-customer exposure]
    approximationNotes: >-
      This is a qualitative operating journey, not a conversion funnel; node order does not
      imply elapsed time, conversion rates, or value-proportional scale.
    claimRefs: [CU002, CU003, CU009, CU010, CU011, CU015]
callouts:
  - calloutType: strength
    title: Broad enterprise relevance
    body: >-
      Public evidence spans trading, payments, payroll, remittance, and tokenization, with
      independently reported clients including Morgan Stanley, Stripe, Interactive Brokers,
      and BlackRock's BUIDL fund.
    claimRefs: [CU001, CU003, CU008]
  - calloutType: risk
    title: Logos do not establish durability
    body: >-
      The reviewed public file does not disclose retention, contract duration, cohort
      expansion, or revenue concentration, and the two available end-customer figures are
      not reconciled.
    claimRefs: [CU007, CU012]
