schemaVersion: "report-v2"
artifact: financials
slug: zero-hash
runDate: 2026-10-21
company:
  name: Zero Hash
chapter:
  number: 4
  title: Financials
  summary: >-
    Zero Hash exposes a broad embedded-infrastructure model and fresh enterprise
    distribution signals, but public evidence does not disclose pricing, revenue,
    gross margin, cash, burn, or runway. The September 2025 financing supports
    continued investment but cannot substitute for the private financial package
    required to underwrite revenue quality, unit economics, or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue architecture is broad, but the charging unit is private
    body: >-
      Zero Hash supplies API-integrated trading, custody, settlement, and money
      movement capabilities to platforms rather than selling a stand-alone consumer
      application. The brokerage page says partners retain the user experience,
      pricing, and product strategy while Zero Hash manages execution, custody,
      asset movement, and compliance infrastructure. That allocation suggests
      several plausible revenue events, including execution activity, custody or
      account administration, settlement and payout activity, and implementation
      or platform access. The reviewed sources do not disclose which of those
      events is billed, the contract minimum, the take rate, or the contribution
      of each stream. The revenue bridge is therefore a mechanism map rather than
      a forecast: customer activity reaches Zero Hash's operating stack, but both
      the monetization step and gross-profit conversion remain unquantified.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Enterprise distribution is visible; commercial efficiency is not
    body: >-
      The public go-to-market motion appears enterprise-led and integration-heavy.
      Both reviewed industry pages route prospects to a demo rather than publishing
      a list price, and the brokerage page explicitly leaves end-customer pricing
      with the partner. The August 2026 Visa Direct announcement is meaningful
      distribution evidence because eligible clients can use Zero Hash-powered
      stablecoin prefunding and payouts. The cited reach of more than 18 billion
      endpoints across more than 195 countries and territories belongs to Visa
      Direct, however, and is not Zero Hash volume, revenue, or customer count.
      Likewise, the company claim that stablecoin settlement can compress days to
      minutes describes customer value, not monetization. No source in the assigned
      pool reveals sales-cycle length, implementation fees, contract duration,
      discounting, CAC, or payback.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: The operating stack indicates real cost drivers without margin disclosure
    body: >-
      Zero Hash's public product evidence places execution, custody, asset movement,
      compliance, and settlement inside the operating stack. Those functions imply a
      mixed cost base spanning technical infrastructure, liquidity and counterparty
      operations, safeguarding, compliance, and jurisdiction-specific licensing.
      The official disclosure also
      limits product availability by jurisdiction and states that Zero Hash is not
      registered with the SEC or FINRA. Customer assets are not protected by FDIC
      or SIPC coverage, which heightens the importance of controls, insurance,
      segregation, and loss-allocation terms. None of that establishes a gross
      margin. The reviewed evidence provides no cost per transaction, liquidity
      spread, custody cost, loss rate, reserve requirement, capex, working-capital
      need, or service-delivery burden, so public unit economics remain
      non-underwritable.
    claimRefs: [CI001, CI002, CI009, CI010, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Funding extends capacity but does not establish runway
    body: >-
      Independent reports agree that Zero Hash raised $104 million in September
      2025, and FinTech Global reported that the company intended to fund product
      expansion and workforce growth. CoinDesk reported a $1 billion valuation and
      $275 million of total funding, while FundedIQ's normalized profile reports
      $268 million across four rounds. The $7 million difference should be reconciled
      against the cap table and cash ledger rather than averaged. More importantly,
      funding raised is not cash available: no retained source discloses current
      cash, monthly net burn, debt, restricted cash, customer-asset segregation,
      regulatory capital, or runway. The financial verdict is therefore conditional.
      The model may support attractive embedded-infrastructure economics, but
      revenue quality, margin path, capital intensity, and next-round dependency
      remain material diligence blockers until management provides auditable
      operating and liquidity data.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism
      - Public unit or status
      - Revenue quality assessment
      - Diligence ask
    rows:
      - - Trading and execution
        - API-enabled buying, selling, and execution infrastructure
        - Not disclosed
        - Product is evidenced; fee basis and revenue contribution are unknown
        - Provide transaction volume, gross and net take rate, rebates, and concentration
      - - Custody and account administration
        - Zero Hash administers custody behind partner experiences
        - Not disclosed
        - Recurring potential is plausible but no account, asset, or minimum fee is public
        - Provide assets under custody, funded accounts, fee schedule, and insurance costs
      - - Stablecoin settlement and payouts
        - Prefunding, payout, and cross-border settlement capabilities
        - Not disclosed
        - Current channel evidence is strong; realized volume and spread are unavailable
        - Provide payment volume, active corridors, fee per payout, and liquidity spread
      - - Tokenized assets and on/off-ramps
        - Embedded access through one regulated infrastructure stack
        - Not disclosed
        - Product breadth is evidenced, but mix and attach rate are unknown
        - Provide revenue by product, partner cohort, geography, and contract type
    notes: >-
      Mechanisms are limited to the reviewed product evidence; no row implies a
      disclosed price, recognized revenue contribution, or gross margin.
    claimRefs: [CI001, CI002, CI003, CI005, CI006]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offering or channel
      - Price, unit, or contract
      - List versus realized pricing
      - Discounts or minimums
      - Evidence status
      - Diligence ask
    rows:
      - - Brokerage infrastructure
        - null
        - null
        - null
        - Demo-led page; partner controls end-user pricing
        - Obtain platform fee, transaction schedule, minimum commitment, and term
      - - Payments and PSP infrastructure
        - null
        - null
        - null
        - Demo-led page; settlement value proposition disclosed, price absent
        - Obtain payout and prefunding fees by rail, corridor, and stablecoin
      - - Visa Direct stablecoin integration
        - null
        - null
        - null
        - Eligible-client capability announced; economics not disclosed
        - Obtain revenue share, implementation economics, launch cohort, and volumes
    notes: >-
      Null means the assigned prefetched evidence does not disclose the field; it
      does not mean the service is free or that no negotiated term exists.
    claimRefs: [CI003, CI004, CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Current value
      - Confidence
      - Why it matters
      - Specific diligence request
    rows:
      - - Net take rate by product
        - null
        - Unavailable
        - Determines monetization strength and pricing pressure
        - Reconcile gross billings, pass-through costs, rebates, and net revenue by product
      - - Gross margin by product
        - null
        - Unavailable
        - Tests whether scale offsets custody, liquidity, compliance, and infrastructure cost
        - Provide monthly revenue and cost of revenue by trading, custody, and payments
      - - CAC and payback
        - null
        - Unavailable
        - Measures enterprise GTM efficiency
        - Provide fully loaded acquisition cost, implementation cost, and cohort payback
      - - Sales and implementation cycle
        - null
        - Unavailable
        - Drives working capital and hiring needs before revenue starts
        - Provide median signed-to-live time, integration hours, and implementation revenue
      - - Customer concentration and retention
        - null
        - Unavailable
        - Determines durability and bargaining power
        - Provide top-10 revenue share, gross retention, net retention, and cohort churn
      - - Cash, net burn, and runway
        - null
        - Unavailable
        - Determines financing dependency despite the 2025 raise
        - Provide unrestricted cash, restricted cash, debt, monthly burn, regulatory capital, and runway
    notes: >-
      Every null is an evidence gap in the assigned public source pool; the table
      deliberately does not convert funding raised into cash, burn, or runway.
    claimRefs: [CI009, CI010, CI011, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge with undisclosed monetization
    type: flow
    summary: >-
      Customer activity passes through an integrated operating stack, but public
      evidence does not quantify the charging event or gross-profit conversion.
    data:
      nodes:
        - id: partner-demand
          label: Partner demand
          detail: Brokerages, payment providers, fintechs, and financial institutions seek embedded digital-asset capabilities.
        - id: integration
          label: API and SDK integration
          detail: A partner embeds Zero Hash capabilities while retaining its end-user experience and product strategy.
        - id: customer-activity
          label: Customer activity
          detail: Trading, custody, stablecoin funding, payouts, settlement, or asset movement occurs.
        - id: operating-stack
          label: Zero Hash operating stack
          detail: Execution, liquidity, node operations, custody, compliance, licensing, and settlement workflows are provided.
        - id: revenue-event
          label: Revenue event
          detail: Commercial charging unit, contractual minimums, take rates, and revenue mix are not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Revenue less liquidity, infrastructure, custody, compliance, and service-delivery costs; amount and margin are unavailable.
    approximationNotes: >-
      Conceptual sequence only; the figure assigns no conversion rate, monetary
      value, or causal magnitude to any stage.
    claimRefs: [CI001, CI002, CI003, CI005, CI016]
callouts:
  - calloutType: risk
    title: Funding raised is not runway
    body: >-
      The $104 million September 2025 financing is a historical gross capital
      event. Without current cash, restrictions, debt, regulatory capital, burn,
      and working-capital data, it cannot establish liquidity or runway.
    claimRefs: [CI011, CI013, CI014, CI015, CI016]
