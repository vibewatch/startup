company:
  name: "Zero Hash"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Zero Hash is a 2017-founded, regulated B2B infrastructure provider for embedded
    crypto trading, stablecoin payments, and tokenized assets, with company-reported
    scale of more than $65 billion settled and more than 7 million end customers.
    Product and partnership momentum continued through August 2026, but current
    financing terms, revenue, governance, and refreshed headcount remain unresolved.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Zero Hash sits behind other financial brands rather than selling a standalone
      consumer exchange. Its own materials describe one infrastructure layer through
      which banks, brokerages, fintechs, and payments companies can add crypto trading,
      stablecoin money movement, and tokenized products while Zero Hash supplies
      custody, liquidity, compliance, settlement, and blockchain connectivity. The
      company says it was founded in 2017; current releases identify Edward Woodford
      as founder and chief executive. Independent profiles broadly corroborate the
      infrastructure model, although the retained public file does not establish a
      complete executive team, board roster, voting control, or legal headquarters.
      CoinDesk calls the company Chicago-based, which is useful location evidence but
      is not a substitute for current corporate records.
    claimRefs: [CO001, CO002, CO004]
  - id: "scale-and-regulatory-footprint"
    title: "Scale and regulatory footprint"
    body: >-
      The homepage displays more than $65 billion of settled volume, more than 7
      million end customers, more than 100 supported assets, availability in 200
      jurisdictions, and 99.99% uptime. These are company-published operating
      indicators, not independently audited financial metrics; “end customers” also
      should not be read as the number of contracted enterprise customers. The latest
      retained headcount disclosure is approximately 200 employees in November 2025,
      with offices in New York, Chicago, North Carolina, and Amsterdam, so it is stale
      for a volatile workforce metric at the October 2026 run date. Regulatory
      disclosures describe U.S. money-transmission and virtual-currency permissions
      and European CASP and EMI licenses, while also stating that accounts lack FDIC
      and SIPC protection and that Zero Hash is not SEC- or FINRA-registered.
    claimRefs: [CO003, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: "leadership-capital-and-stakeholders"
    title: "Leadership, capital, and stakeholders"
    body: >-
      Public evidence supports founder-led continuity but not a complete governance
      assessment. Edward Woodford remains the visible founder-CEO; no complete board
      or senior-leadership roster was found in the assigned evidence. The latest
      completed financing identified in retained reporting is a $104 million Series
      D-2 in September 2025 at a $1 billion valuation, led by Interactive Brokers.
      CoinDesk subsequently reported in May 2026 that Zero Hash was seeking capital at
      more than $1.5 billion after Mastercard dropped investment plans following
      earlier acquisition discussions reportedly worth as much as $2 billion. Those
      figures describe a reported process, not a closed round or present valuation,
      and neither total capital raised nor preferences, debt, secondaries, ownership,
      or voting rights are supportable from this chapter’s evidence.
    claimRefs: [CO001, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: "milestones-and-current-posture"
    title: "Milestones and current posture"
    body: >-
      Zero Hash’s recent milestones show expansion across blockchains, staking, and
      payments distribution. It announced Plasma enablement in November 2025, Monad
      and USDC.Monad integration in February 2026, staking infrastructure in June
      2026, and Visa Direct stablecoin prefunding and payout capabilities in August
      2026. The staking release named Interactive Brokers, Public, and BitMart as
      initial launch partners; the Visa release said eligible Visa Direct clients
      would be able to prefund and disburse in stablecoins. The institutional strategy
      also carries execution and regulatory uncertainty: FinTech Weekly reported a
      March 2026 OCC national-trust-bank application, while noting that approval was
      not guaranteed and that a contemplated industry legal challenge could affect
      pending charter applications. These disclosures support momentum, not proof of
      adoption economics or regulatory approval.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
