  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "leadership"
      missingEvidence: "A current executive roster, board composition, committee structure, succession plan, and founder voting-control disclosure."
      whyItMatters: "The public record is too founder-centric to assess functional coverage, independent oversight, or key-person risk."
      diligencePath: "Request the current organization chart, board materials, governance documents, and fully diluted voting schedule."
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "funding"
      missingEvidence: "Closed 2026 financing documents, total capital raised, debt and secondary activity, liquidation preferences, ownership, and cash availability."
      whyItMatters: "A reported target valuation does not establish completed proceeds, present valuation, dilution, or runway."
      diligencePath: "Obtain the capitalization table, executed financing documents, debt schedule, bank statements, and board-approved cash plan."
      relatedQuestionRefs: [QO003, QO008, QO009]
      relatedTableRefs: [TO003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "scale metrics"
      missingEvidence: "Revenue, ARR, net take rate, gross margin, profitability, enterprise-customer count, concentration, retention, and cohort definitions."
      whyItMatters: "Cumulative volume and end-user reach cannot be converted into recurring revenue quality or unit economics."
      diligencePath: "Request audited financials, monthly KPI definitions, customer-level revenue cohorts, contracts, renewal history, and gross-margin bridges."
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: "stale"
      severity: "material"
      topic: "headcount"
      missingEvidence: "A dated 2026 employee count by function, geography, and regulated entity."
      whyItMatters: "The latest retained disclosure is from November 2025 and cannot establish current operating capacity or hiring direction."
