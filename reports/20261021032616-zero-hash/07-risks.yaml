  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: "regulatory perimeter"
      missingEvidence: >-
        A complete entity-by-entity matrix of active licenses, approved
        activities, examinations, restrictions, complaints, and enforcement
        matters across every operating jurisdiction.
      whyItMatters: >-
        Public disclosures confirm selected authorizations but cannot establish
        that every live product and asset is permitted in every marketed region.
      diligencePath: >-
        Reconcile regulator records to counsel-confirmed license schedules,
        product maps, examination letters, and board compliance reporting.
      relatedQuestionRefs:
        - QR001
        - QR002
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: "operational resilience"
      missingEvidence: >-
        Independent SOC or equivalent control reports, custody and key-management
        design, incident history, RTO/RPO tests, uptime calculations, service
        credits, and reconciliation exception data.
      whyItMatters: >-
        Company-published architecture and uptime claims do not quantify loss,
        recovery, or correlated-failure performance.
      diligencePath: >-
        Review under NDA the latest assurance reports, penetration tests,
        incident log, business-continuity tests, SLA series, and aged breaks.
      relatedQuestionRefs:
        - QR003
        - QR004
        - QR005
    - type: missing-source
      severity: material
      topic: "financial and concentration exposure"
      missingEvidence: >-
        Current burn, runway, working-capital needs, fraud and credit losses,
        insurance limits, customer concentration, liquidity-provider
        concentration, and committed financing terms.
      whyItMatters: >-
        These quantities determine whether operational or partner shocks can be
        absorbed and whether financing risk could impair common-equity outcomes.
      diligencePath: >-
        Obtain monthly financials, treasury and liquidity reports, loss
        triangles, insurance schedules, top-customer and provider exposures,
        capitalization tables, and signed financing documents.
      relatedQuestionRefs:
        - QR009
