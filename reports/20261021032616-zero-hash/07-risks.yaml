company:
  name: "Zero Hash"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Zero Hash's broad regulatory footprint and partner-embedded operating model
    are defensible assets, but they also concentrate licensing, custody,
    settlement, blockchain, and counterparty obligations in one platform. The
    highest residual risks are regulatory-perimeter change, operational
    concentration without independent reliability evidence, and execution or
    financing dependence across major partners.
sections:
  - id: "risk-posture"
    title: "Risk posture and prioritization"
    body: >-
      The central diligence issue is concentration of obligations rather than a
      single disclosed incident. Zero Hash says it administers custody and other
      digital-asset services behind partner interfaces, while its own materials
      assign the platform node operations, liquidity management, regulatory
      licensing, and settlement workflows. That architecture can reduce a
      customer's build burden, but it also creates a common failure domain:
      regulatory restrictions, custody-control weakness, liquidity disruption,
      or integration failure could propagate across several products and
      partners. The company reports 99.99% uptime and more than $50 billion of
      settled volume, but those are company-published measures rather than an
      independently tested service-level record. The heatmap therefore ranks
      control concentration and regulatory change above isolated feature risk,
      and treats undisclosed incident, audit, and recovery evidence as a
      diligence gap rather than evidence that no incident occurred.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR012
    figureRefs:
      - FR001
  - id: "regulatory-legal"
    title: "Regulatory and legal perimeter"
    body: >-
      Public evidence confirms meaningful authorization but not a globally
      uniform permission set. New York's regulator lists Zero Hash entities
      with virtual-currency and money-transmitter licenses, and Zero Hash states
      that its Dutch entity holds CASP and electronic-money authorizations.
      However, company disclosures also say products may be unavailable in some
      jurisdictions, accounts lack FDIC and SIPC protection, and Zero Hash is
      not registered with the SEC or FINRA. NYDFS can restrict listed assets and
      requires licensees to operate within approved listing pathways. The
      investment implication is that launch scope, asset coverage, and customer
      disclosures remain jurisdiction-specific. Diligence should verify every
      active legal entity, license, approved activity, safeguarding regime, and
      open examination rather than treating the public license footprint as a
      blanket approval.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
    tableRefs:
      - TR001
  - id: "operational-security"
    title: "Operational, quality, and security exposure"
    body: >-
      The operating model spans custody, compliance monitoring, transaction
      processing, liquidity, node operations, and settlement. The public Monad
      integration places several of those functions within one operating stack.
      These are concrete control surfaces, not proof of failure, but they increase
      the number of interfaces at which errors can arise. The strongest public mitigation is
      architectural and company-reported: a governed platform, embedded
      controls, dedicated support, and a 99.99% uptime claim. Missing are
      independently reviewed availability calculations, incident history,
      recovery objectives, custody/key-management design, loss experience, and
      audit exceptions. A confirmatory diligence package should therefore test
      the controls behind the uptime number and the handoffs among Zero Hash,
      external chains, liquidity providers, and partner systems.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR002
  - id: "dependencies-kill-criteria"
    title: "Partner, financing, and thesis-break triggers"
    body: >-
      Distribution and execution are intertwined with large counterparties and
      external networks. The Visa Direct announcement covers eligible clients,
      while the Monad integration depends on an external chain plus Zero Hash's
      operational stack. Separately, independent reporting documents both the
      September 2025 financing base and CoinDesk's report that Mastercard walked away from a
      potential investment and that Zero Hash was seeking new capital above a
      $1.5 billion valuation. This does not establish funding distress, but it
      makes financing certainty and strategic-counterparty conversion material
      diligence items. Monitorable thesis-break triggers include loss or
      suspension of a core license, a material custody or settlement incident,
      sustained availability below the contracted service level, failed
      reconciliation at scale, withdrawal of a major distribution partner, or
      financing terms that materially impair runway or common-equity outcomes.
      The public record does not disclose burn, runway, customer concentration,
      liquidity-provider concentration, or loss reserves, so those quantities
      remain gaps rather than estimated risk values.
    claimRefs:
      - CR006
      - CR008
      - CR010
      - CR013
      - CR015
      - CR016
      - CR017
    tableRefs:
      - TR003
