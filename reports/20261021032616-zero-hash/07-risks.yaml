figures:
  - id: FR001
    title: "Residual risk heatmap"
    type: matrix
    summary: >-
      Analyst ranking of six evidence-backed risk categories, with public
      mitigation maturity separated from residual severity.
    data:
      columns:
        - label: "Likelihood"
          detail: "Qualitative likelihood based on the cited exposure surface"
        - label: "Impact"
          detail: "Potential operating or investment impact"
        - label: "Mitigation maturity"
          detail: "Strength of mitigation visible in the public record"
        - label: "Residual severity"
          detail: "Exposure remaining after visible mitigations"
      rows:
        - label: "Regulatory perimeter change"
          note: "Licenses exist, but scope and asset permissions remain jurisdiction-specific."
          values:
            - value: "High"
            - value: "High"
            - value: "Medium"
            - value: "High"
        - label: "Custody and settlement concentration"
          note: "Zero Hash administers multiple critical functions behind partner interfaces."
          values:
            - value: "Medium"
            - value: "High"
            - value: "Medium"
            - value: "High"
        - label: "Chain and smart-contract dependency"
          note: "Products depend on external networks and liquidity workflows."
          values:
            - value: "Medium"
            - value: "High"
            - value: "Medium"
            - value: "Medium-high"
        - label: "Availability and recovery"
          note: "The public uptime metric lacks an independently reviewed denominator."
          values:
            - value: "Unknown"
            - value: "High"
            - value: "Unknown"
            - value: "Medium-high"
        - label: "Partner rollout concentration"
          note: "Large announced channels can amplify both adoption and dependency."
          values:
            - value: "Medium"
            - value: "Medium-high"
            - value: "Medium"
            - value: "Medium"
        - label: "Financing execution"
          note: "A reported withdrawn strategic process raises a diligence question, not proof of distress."
          values:
            - value: "Medium"
            - value: "Medium-high"
            - value: "Unknown"
            - value: "Medium-high"
    approximationNotes: >-
      Qualitative categories are analyst assessments, not modeled probabilities;
      unknown values identify missing public control or financial evidence.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR013
      - CR015
      - CR017
callouts:
  - calloutType: risk
    title: "Common failure domain"
    body: >-
      The same provider layer handles several regulated and operationally
      critical functions, so diligence should test correlated failure and
      recovery rather than reviewing each product feature in isolation.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR010
  - calloutType: recommendation
    title: "Investment kill criteria"
    body: >-
      Pause an investment if core license scope cannot be reconciled to live
      products, if material custody or settlement losses are undisclosed, if
      tested availability materially trails contractual commitments, or if
      financing terms leave inadequate runway or impair common-equity outcomes.
    claimRefs:
      - CR001
      - CR003
      - CR011
      - CR015
      - CR016
