              核心尽调问题是义务集中，而不是某一项已披露事故。Zero Hash
              称其在合作伙伴界面之后管理托管和其他数字资产服务，同时自身材料将平台节点运营、流动性管理、监管牌照和结算工作流归于公司。这种架构可以减轻客户搭建负担，但也形成共同故障域：监管限制、托管控制薄弱、流动性中断或集成失败，可能波及多个产品和合作伙伴。公司报告
              99.99% 正常运行时间和超过 $50B
              的已结算交易量，但这些是公司发布的指标，不是独立测试的服务水平记录。因此，热力图将控制集中和监管变化置于单项功能风险之上，并将未披露的事故、审计和恢复证据视为尽调缺口，而不是未发生事故的证据。
