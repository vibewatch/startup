        - 高
        - NYDFS 直接列表佐证许可证状态
        - 中；许可证范围不能消除检查或执法风险
        - 审阅检查结果、资本 / 保证金水平、投诉和变更审批
      - - 资产上架与产品限制
        - 纽约，美国
        - NYDFS 允许获批、自我认证或列入绿色名单的资产，并保留限制权
        - 中：资产与指引变更会反复发生
        - 中高
