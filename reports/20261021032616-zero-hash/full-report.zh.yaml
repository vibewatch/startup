  - id: FM001
    title: 从广义资金流到 Zero Hash 切入点的可触达性筛选
    type: pyramid
    summary: 机会从全球资金流动逐步收窄至数字轨道、稳定币驱动的工作流、外包的受监管基础设施、目标买方以及已签约使用 Zero Hash 的业务。
    data:
      items:
        - label: 全球资金流动与汇款
          value: Broad flow pool; not a revenue TAM
          detail: 本金总额不属于供应商支出边界。
        - label: 数字化汇款
          value: 56.7% of remittances in Q3 2022
          detail: Visa 的数字化占比指标是采用信号，不是费用池。
        - label: 稳定币驱动的轨道
          value: $71.9B USDC circulation on 2026-10-19
          detail: 发行方报告的代币存量是轨道规模代理指标，不是可触达收入。
        - label: 嵌入式金融工作流
          value: Trading, payments, payroll, remittance, and tokenization
          detail: 只有需要嵌入式基础设施的工作流才进入该类别。
        - label: 外包的受监管技术栈
          value: Execution, custody, compliance, and settlement
          detail: 可服务层是平台外包的自建还是购买支出。
        - label: Zero Hash 可服务切入点
          value: Brokerages, PSPs, banks, fintechs, and payroll platforms
          detail: 实际 SOM 需要已签约交易量、定价、续约和费率。
    approximationNotes: 仅作概念性收窄：这些标签混合了有来源的采用指标和定性筛选条件，因此各层宽度不代表成比例的市场价值，也无法据此计算 TAM/SAM/SOM。
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM009
      - CM014
      - CM016
  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 序数定位将产品范围广度，与供应商看起来为买方外部化监管和运营复杂度的程度区分开来。
    data:
      points:
        - label: Zero Hash
          x: 5
          'y': 5
          detail: 覆盖交易、支付、托管、合规和代币化的广泛范围。
        - label: Coinbase
          x: 4
          'y': 3
          detail: 集成钱包、流动性和网络模式。
        - label: Circle
          x: 3
          'y': 4
          detail: 与发行方关联的钱包和跨链基础设施。
        - label: Fireblocks
          x: 3
          'y': 2
          detail: 以托管为核心的 MPC 基础设施，并延伸至交易和质押。
        - label: BitGo
          x: 3
          'y': 3
          detail: 合格托管和 MPC，以及有限的代币化活动。
        - label: 入金通道专业厂商
          x: 2
          'y': 3
          detail: 聚焦法币转换和嵌入式支付方式覆盖。
    approximationNotes: 坐标是分析师从 1（范围窄或由买方运营）到 5（范围广或高度外部化）作出的序数评分，仅基于 Sacra 的类别描述和 Zero Hash 保留的产品证据。它们不是实测市场基准、价格排名或独立产品测试。
    claimRefs:
      - CP013
  - id: FI001
    title: 未披露货币化方式的收入模型桥接图
    type: flow
    summary: 客户活动经过集成式运营技术栈，但公开证据没有量化收费事件或毛利转化。
    data:
      nodes:
        - id: partner-demand
          label: 合作伙伴需求
          detail: 经纪商、支付提供商、金融科技公司和金融机构寻求嵌入式数字资产能力。
        - id: integration
          label: API 与 SDK 集成
          detail: 合作伙伴嵌入 Zero Hash 能力，同时保留终端用户体验和产品战略。
        - id: customer-activity
          label: 客户活动
          detail: 交易、托管、稳定币融资、支付、结算或资产转移发生。
        - id: operating-stack
          label: Zero Hash 运营技术栈
          detail: 提供执行、流动性、节点运营、托管、合规、牌照和结算工作流。
        - id: revenue-event
          label: 收入事件
          detail: 商业收费单位、合同最低额、费率和收入组合均未公开披露。
        - id: gross-profit
          label: 毛利
          detail: 收入减去流动性、基础设施、托管、合规和服务交付成本；金额和利润率均不可得。
    approximationNotes: 仅作概念性序列；该图没有为任何阶段赋予转化率、货币价值或因果幅度。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI016
  - id: FE001
    title: Zero Hash 产品架构图
    type: stack
    summary: 基于公开证据，展示合作伙伴拥有的客户体验与服务所依赖的外部金融及区块链轨道之间的各层。
    data:
      layers:
        - label: 合作伙伴体验
          detail: 面向客户的平台保留界面、定价和产品战略。
          items:
            - 客户应用
            - 合作伙伴定价与政策
        - label: 集成界面
          detail: REST API、SDK、集成手册和 Webhook 将合作伙伴连接至 Zero Hash。
          items:
            - 经过身份验证的 API 请求
            - SDK 与开发工具包
            - 生命周期 Webhook
        - label: 参与方控制
          detail: 开户和资格检查决定谁可以访问哪些产品。
          items:
            - KYB 与签约
            - KYC 审批
            - 司法管辖区及资产资格
        - label: 核心金融运营
          detail: 执行、账户、资金转移、结算和支付落实客户工作流。
          items:
            - 报价与执行
            - 账户与资金转移
            - 结算与支付
        - label: 托管与合规
          detail: Zero Hash 运营的服务负责托管和受监管控制职责。
          items:
            - 托管
            - 监控
            - 受监管实体
        - label: 外部轨道
          detail: 区块链、稳定币、法币账户和支付网络提供底层资金转移轨道。
          items:
            - 区块链与资产
            - 稳定币发行方
            - 法币与支付网络
    approximationNotes: 根据公开证据作出的概念性重构；层级顺序不代表公司私有的部署拓扑、数据存储或控制边界。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 嵌入式客户采用与扩张旅程
    type: journey-map
    summary: Zero Hash 的公开材料描述了从用例选择、嵌入式上线到模块化扩张的企业集成路径，但商业持久性仍是尽调缺口。
    data:
      nodes:
        - id: need
          label: 选择企业用例
          detail: 银行、经纪商、PSP、金融科技公司、薪资平台或代币化平台选择一项受监管工作流。
          touchpoints:
            - Trading
            - Payments
            - Payroll
            - Remittance
            - Tokenization
        - id: scope
          label: 界定合规与服务范围
          detail: 产品和合规团队选择托管、结算、融资、交易或支付模块。
          touchpoints:
            - Business verification
            - Jurisdiction review
            - Service selection
        - id: integrate
          label: 集成与测试
          detail: 平台使用 API 或 SDK，并在上线前验证工作流。
          touchpoints:
            - API credentials
            - SDKs
            - Sandbox
            - Webhooks
        - id: launch
          label: 嵌入合作伙伴体验
          detail: 平台控制用户体验，Zero Hash 则管理底层数字资产服务。
          touchpoints:
            - Partner application
            - End-user account
            - Custody and settlement
        - id: expand
          label: 增加模块与地理区域
          detail: 客户可以在共享基础设施上增加资产、支付轨道、交易、结算或代币化。
          touchpoints:
            - Additional assets
            - New workflows
            - Cross-border coverage
        - id: prove
          label: 验证持久经济性
          detail: 使用增长、续约、队列扩张和集中度必须通过私有尽调核验。
          touchpoints:
            - NRR and GRR
            - Contract renewal
            - Product attach
            - Top-customer exposure
    approximationNotes: 这是定性运营旅程，不是转化漏斗；节点顺序不代表经过的时间、转化率或与价值成比例的规模。
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
      - CU011
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 分析师对六类有证据支持的风险作出评级，并将公开可见的缓解措施成熟度与剩余严重性分开。
    data:
      columns:
        - label: 可能性
          detail: 基于所引用风险敞口面的定性可能性
        - label: 影响
          detail: 潜在运营或投资影响
        - label: 缓解措施成熟度
          detail: 公开记录中可见的缓解措施强度
        - label: 剩余严重性
          detail: 可见缓解措施之后仍存的风险敞口
      rows:
        - label: 监管边界变化
          note: 牌照已经存在，但范围和资产权限仍因司法管辖区而异。
          values:
            - value: High
            - value: High
            - value: Medium
            - value: High
        - label: 托管与结算集中度
          note: Zero Hash 在合作伙伴界面之后管理多个关键功能。
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: High
        - label: 链和智能合约依赖
          note: 产品依赖外部网络和流动性工作流。
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: Medium-high
        - label: 可用性与恢复
          note: 公开正常运行时间指标缺少独立审阅的分母。
          values:
            - value: Unknown
            - value: High
            - value: Unknown
            - value: Medium-high
        - label: 合作伙伴推广集中度
          note: 大型已公布渠道可能同时放大采用和依赖。
          values:
            - value: Medium
            - value: Medium-high
            - value: Medium
            - value: Medium
        - label: 融资执行
          note: 据报道已撤回的战略流程引出尽调问题，但不能证明存在困境。
          values:
            - value: Medium
            - value: Medium-high
            - value: Unknown
            - value: Medium-high
    approximationNotes: 定性类别是分析师评估，不是建模概率；未知值表示公开控制或财务证据缺失。
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR013
      - CR015
      - CR017
  - id: FV001
    title: 从验证到价格纪律的建议逻辑
    type: flow
    summary: 有序链条说明，战略验证支持继续观察，而经济性缺失使买入建议无法成立。
    data:
      nodes:
        - id: strategic-proof
          label: 战略验证
          detail: Visa Direct 关系和据报道的成熟投资者。
        - id: platform-scope
          label: 平台广度
          detail: 交易、托管、合规、结算和资金转移。
        - id: regulatory-moat
          label: 监管覆盖
          detail: 美国多司法管辖区覆盖，以及欧洲 CASP 和 EMI 牌照。
        - id: valuation-markers
          label: 估值标记
          detail: $104M D-2 轮；超过 $1.5B 的融资努力；此前约 $2B 的并购讨论。
        - id: evidence-gap
          label: 投资判断缺口
          detail: 没有公开收入、利润率、烧钱速度、集中度、所有权或优先权数据。
        - id: recommendation
          label: 观察 / 继续研究
          detail: 在确定入场价格或目标回报前，要求核验经济性和条款。
    approximationNotes: 该流程是定性且有序的；不赋予权重、概率或内在估值。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
