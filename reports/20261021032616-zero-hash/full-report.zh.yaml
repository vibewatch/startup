      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据提供了多个规模指标，但没有口径一致的市场预测。Visa 报告称，数字汇款占全部汇款的比例从 2016 年第二季度的 25.5% 升至 2022 年第三季度的 56.7%；其 2022
              年转账类型图表进一步拆分为数字发起 27.5% 和端到端数字化 30.4%。Circle 报告称，截至 2026 年 10 月 19 日，USDC 流通量为 $71.9B，覆盖超过 185 个国家，并原生支持
              38 条区块链。Zero Hash 另行宣布接入 Visa Direct 网络，该网络覆盖超过 195 个国家和地区的 18B
              多个终端。这些数字说明底层流量和分销触点庞大，但衡量的是占比、代币存量、技术可用性和终端数量，而不是基础设施费用。没有合同定价、可服务交易量和费率证据，就不能将其相加或换算为 TAM、SAM 或 SOM。
