        title: 规模与监管版图
        blocks:
          - type: paragraph
            body: >-
              官网显示已结算交易量超过 $65B、终端客户超过 700 万、支持资产超过 100 种、覆盖 200 个司法辖区，正常运行时间为
              99.99%。这些是公司发布的运营指标，并非独立审计的财务数据；“终端客户”也不能理解为签约企业客户数量。最新保留的人数披露为 2025 年 11 月约 200
              名员工，办公地点包括纽约、芝加哥、北卡罗来纳州和阿姆斯特丹；考虑到 workforce 波动，这一数据对 2026 年 10 月的报告时点已经过时。监管披露涉及美国货币传输和虚拟货币许可，以及欧洲 CASP 和
              EMI 牌照，同时说明账户不受 FDIC 和 SIPC 保护，且 Zero Hash 未在 SEC 或 FINRA 注册。
