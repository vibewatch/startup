      - number: '7.4'
        title: 合作伙伴、融资与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              分销和执行与大型交易对手及外部网络交织在一起。Visa Direct 公告覆盖符合条件的客户；Monad 集成则依赖外部链以及 Zero Hash 的运营栈。另一方面，独立报道既记录了 2025 年 9
              月的融资基础，也记录 CoinDesk 关于 Mastercard 放弃潜在投资、Zero Hash 寻求超过 15
              亿美元新资本的报道。这不能证明融资困境，但使融资确定性和战略交易对手转化成为重要尽调事项。可监测的论点失效触发器包括核心牌照丧失或暂停、重大托管或结算事故、持续可用性低于合同服务水平、大规模对账失败、主要分销合作伙伴退出，或融资条款显著削弱资金续航或普通股结果。公开记录没有披露消耗、资金续航、客户集中度、流动性提供商集中度或损失准备，因此这些数量仍是缺口，而不是估算的风险值。
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
              - CR016
              - CR017
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 共同故障域
            body: 同一供应商层处理多项受监管且运营关键的功能，因此尽调应检验相关性故障和恢复能力，而不是孤立地审查每项产品功能。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
          - type: callout
            title: 投资叫停标准
            body: 如果核心牌照范围无法与实际产品核对、重大托管或结算损失未披露、经测试的可用性明显低于合同承诺，或融资条款导致资金续航不足或损害普通股结果，就应暂停投资。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与评估姿态
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，合适的建议是跟踪 / 继续研究，信心中等，承保风险中高。继续关注的理由强于立即购买：第三方报道将 2025 年 9 月 Series D-2 记为 1.04 亿美元，并称 2026 年 5
              月的融资行动对应超过 15
              亿美元估值；公司证据则显示其受监管产品版图广泛。这些信号说明其具备相关性，但不能证明公允价值。保留的融资报道没有提供收入、毛利率、现金消耗、客户集中度、所有权或优先权条款。没有这些分母，既无法计算目标回报，也无法计算经稀释调整的入场价格。因此，任何交易都应以数据室经济数据和签署条款为前提，而不是依据
              headline 融资或收购参考点。
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
              - CV016
