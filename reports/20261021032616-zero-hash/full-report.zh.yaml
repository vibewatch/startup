      - number: '7.3'
        title: 运营、质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              运营模式覆盖托管、合规监控、交易处理、流动性、节点运营和结算。公开的 Monad
              集成将其中多项职能置于同一个运营栈内。这些是具体的控制面，并不是失败证据，但增加了可能发生错误的接口数量。最强的公开缓解措施来自架构和公司披露：受治理的平台、嵌入式控制、专门支持以及 99.99%
              正常运行时间主张。缺失的是独立审阅的可用性计算、事故历史、恢复目标、托管和密钥管理设计、损失经验及审计例外。因此，确认性尽调应检验正常运行时间数字背后的控制，以及 Zero
              Hash、外部区块链、流动性提供商和合作伙伴系统之间的交接。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
