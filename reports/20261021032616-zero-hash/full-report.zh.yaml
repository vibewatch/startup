        title: 展示项
        blocks:
          - type: callout
            title: 评估费用池，而不是支付本金
            body: 可辩护的规模桥接方法是：签约的合格交易量乘以实际净费率，再按产品组合和留存调整；指定的公开证据没有提供这些输入。
            calloutType: insight
