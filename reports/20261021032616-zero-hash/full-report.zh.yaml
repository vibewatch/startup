  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资类别比加密交易、稳定币流通或全球汇款本金更窄。Zero Hash
              销售的是嵌入式运营层：受监管的执行、托管、资产转移、结算、监控和集成能力；否则，银行、券商、金融科技公司、薪资平台或支付服务商就得自行搭建，或分别向多个专业供应商采购。其披露的工作流涵盖交易、跨境支付、薪资、汇款、商业支付、代币化、钱包和出入金通道。因此，相关支出边界是外包基础设施和合规，而不是经由这些轨道转移的资产或支付面值。现有替代方案包括内部搭建、传统银行和卡网络、独立的托管与流动性供应商，以及与现有支付系统并行运行的稳定币。这样的边界可避免把
              Circle 的 USDC 流通量或 Visa 的终端覆盖误算为 Zero Hash 可触达的收入。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM015
              - CM016
