      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，Zero Hash 位于受监管金融机构与碎片化数字资产轨道之间的一个有价值控制点。其材料描述了一次集成覆盖交易、托管、合规、结算和资金流转；Visa Direct
              公告提供了当前分销信号，已记录的美国和欧洲授权也提高了复制成本。反论点同样重要。这些大多是公司发布的运营主张，知名客户标志无法说明收入质量或集中度，而据报道的 Mastercard
              交易过程并未落地。Anvesan 面向登记的画像强化了牌照论据，但不能验证单位经济。因此，投资价值取决于监管广度能否转化为持久、分散且高毛利的交易量，而不是昂贵的合规和集成工作。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 融资背景与情景估值
        blocks:
          - type: paragraph
            body: >-
              公开估值背景有参考价值，但不能直接比较。FinTech Global 报道 2025 年 9 月完成 $104m Series D-2，并称公司已达到独角兽地位。Coincub 报道 2025 年 10
              月出现接近 $2b 的未最终确定收购讨论；CoinDesk 随后报道 Mastercard 放弃交易，Zero Hash 于 2026 年 5 月寻求超过 $1.5b
              的新资本。私募轮次、要价估值和未完成的并购讨论对应不同工具、控制权和结果，不应视为等价的估值观察。因此，情景框架只在乐观情景中将 $1.5b 至 $2.0b
              区间作为外部讨论带，而不是内在价值估计。在审计经济数据和完整融资条款可得前，基准和悲观情景仍刻意不定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度有可能，但尚未得到证明。2025 年报道的战略兴趣、2026 年 Visa Direct 关系，以及上一轮中知名金融机构的参与，都表明该资产能吸引成熟交易对手。但 Mastercard
              路径终止也说明战略兴趣不是可靠的退出承诺。在超越跟踪阶段前，尽调应核对毛收入和净收入、费率、毛利率、现金消耗、资金续航、客户和合作伙伴集中度、受监管实体盈利能力、股权结构所有权、清算优先权、债务，以及当前融资的确切条款。如果机构上线无法产生多元化的经常性经济性、牌照成本超过贡献利润，或新资本要求折价轮或损害普通股回报的投资者保护结构，投资观点就应失效。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是尚未解决的变量
            body: 公开记录支持战略相关性，但不足以支持可投资估值。只有在数据室证明经济性持久、集中度可控、条款干净，并能在实际入场价格下形成回报案例后，才应从跟踪转为买入。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV016
