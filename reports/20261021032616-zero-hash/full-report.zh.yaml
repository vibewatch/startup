  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构广泛，但计费单位不公开
        blocks:
          - type: paragraph
            body: >-
              Zero Hash 向平台提供 API 集成的交易、托管、结算和资金流转能力，而不是销售独立的消费者应用。券商页面称，合作伙伴保留用户体验、定价和产品策略，Zero Hash
              则管理执行、托管、资产转移和合规基础设施。这种分工意味着多个可能的收入事件，包括执行活动、托管或账户管理、结算和支付，以及实施或平台访问。审阅来源没有披露究竟对哪些事件收费、合同最低额、费率或各收入流的贡献。因此，收入桥接图只是机制地图而非预测：客户活动进入
              Zero Hash 的运营栈，但变现环节和毛利转化仍无法量化。
