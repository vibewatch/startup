      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              预算由嵌入该能力的金融机构或平台掌握，终端用户则在合作伙伴的品牌体验中交互。对券商而言，经济买方可能是产品、数字资产、运营或合规负责人，他们希望增加交易能力，同时不必自行运营执行、托管、结算和牌照；第三方公司简介称合作伙伴保留品牌和客户关系。对支付服务商和薪资平台而言，财资与支付团队有营运资金方面的理由，因为稳定币结算可以持续运行并缩短结算周期。银行和金融科技公司面临最广的治理流程，因为法务、风险、合规、技术和产品团队都会影响审批。典型采用顺序是合作伙伴主导产品决策、通过
              API 或 SDK 完成技术集成、设计合规和托管方案、上线通道或资产，然后扩展到相邻工作流。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              持续的汇款数字化、全天候结算、降低预充值依赖，以及对嵌入式访问而非独立加密产品的需求，都在支撑需求。Visa 的汇款分析还发现，2024
              年第一季度移动支付和银行卡支付转账的平均成本低于现金转账，进一步强化了将资金流转迁移到数字渠道的动力。Zero Hash 的 Monad 和 Plasma
              集成说明，增加链支持后，支付、薪资、商业支付和结算工作流可以扩展，而不必让每个平台自行运营区块链基础设施。采用并非自动发生：服务因司法辖区而异，加密资产和稳定币余额不受 FDIC 或 SIPC
              保护，买方必须接受对多功能供应商的集中依赖，现有支付轨道也往往仍会保留。估值应围绕签约交易量、实际费率、续约、毛利率和客户集中度来评估，而不是用假定费率乘以广义支付流量。
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
