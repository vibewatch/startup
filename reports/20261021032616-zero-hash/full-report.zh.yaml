  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境、替代方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Zero Hash 更适合被视为嵌入式基础设施，而不是零售交易所。独立简介将其描述为面向券商、银行、金融科技公司和支付服务商的 B2B 平台；Zero Hash
              自身材料则将交易、稳定币流转、托管、合规和代币化置于合作伙伴品牌之后。因此，直接可比对象较为分散：Coinbase 和 Circle 带来垂直整合网络，Fireblocks 和 BitGo
              强调托管基础设施，MoonPay、Banxa 和 Sardine
              专注法币出入金。买方也可以保留现有轨道、内部搭建，或使用代币化银行存款。这些替代方案以产品广度换取控制权、既有分销或更熟悉的监管待遇。公开证据没有提供每个同行的可比规模或融资情况，因此画像表将这些字段标为不可用，而不是制造排名。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
