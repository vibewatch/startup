      - number: '3.2'
        title: 能力、分销与信任状况
        blocks:
          - type: paragraph
            body: >-
              核心差异化主张是集成广度。Zero Hash 称，一次集成即可组合执行、托管、资产转移、合规和结算，同时合作伙伴保留用户体验、定价和产品策略。其公布的监管版图覆盖美国 51
              个司法辖区以及欧洲持牌实体，但这仍是公司提供的证据，不能当作独立合规基准。Visa Direct
              公告表明，分销可以通过网络和合作伙伴复利增长，而不只依靠直销。同一模式也带来渠道依赖：合作伙伴掌握客户关系，可能同时使用多个供应商、切换基础设施，或自行搭建部分能力。保留来源没有量化续约率、迁移成本、排他性或任何分销商贡献的交易量占比。
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 定价不透明与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              定价是公开比较中最薄弱的部分。Sacra 将 Zero Hash 的模式描述为按交易收费，并估算隐含费率为
              0.146%；但该估算和公司营销材料都无法证明实际定价、最低承诺、折扣或毛利率。指定证据也没有同行定价，因此无法进行同口径价格比较。护城河能否持久，取决于监管运营、流动性、托管和多链集成是否仍然昂贵到让客户难以复刻。行业证据有两面性：Chainalysis
              认为银行必须理解并监控加密敞口，这支撑了专业控制的需求；J.P. Morgan
              则指出，代币化存款和代币化货币基金可能提供熟悉的替代方案，并质疑稳定币能在多大范围内取代现有消费者支付轨道。结果是一个合理的合规与集成护城河，而不是已经证明的锁定效应。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
          - type: table
