    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zero Hash 藏在其他金融品牌之后，而不是销售独立的面向消费者的交易所。公司材料称，银行、券商、金融科技公司和支付企业可通过这一基础设施层增加加密交易、稳定币资金流转和代币化产品，Zero Hash
              则提供托管、流动性、合规、结算和区块链连接。公司称成立于 2017 年；近期公告将 Edward Woodford 列为创始人兼
              CEO。独立简介大体印证其基础设施模式，但保留的公开材料无法确认完整的高管团队、董事会名单、投票控制权或法定总部。CoinDesk 称公司位于芝加哥，这能作为地点证据，但不能替代当前公司登记记录。
