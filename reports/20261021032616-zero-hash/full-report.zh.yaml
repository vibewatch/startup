      - number: '4.3'
        title: 运营栈显示真实成本驱动因素，但没有利润率披露
        blocks:
          - type: paragraph
            body: >-
              Zero Hash
              的公开产品证据将执行、托管、资产转移、合规和结算置于运营栈内。这些职能意味着混合成本基础，包括技术基础设施、流动性和交易对手运营、资产保护、合规以及按司法辖区划分的牌照成本。官方披露还按司法辖区限制产品可用性，并称
              Zero Hash 未在 SEC 或 FINRA 注册。客户资产不受 FDIC 或 SIPC
              保护，因此控制、保险、隔离和损失分配条款更加重要。但这些信息不能推出毛利率。审阅证据没有提供单笔交易成本、流动性价差、托管成本、损失率、准备金要求、资本开支、营运资金需求或服务交付负担，因此公开单位经济仍不足以承保估值。
