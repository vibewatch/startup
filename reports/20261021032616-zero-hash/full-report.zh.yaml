  - id: TV002
    title: 投资逻辑与反向逻辑决策矩阵
    columns:
      - 立场
      - 基于证据的论点
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - 集成式受监管基础设施可以降低经纪商和支付提供商的技术及合规负担。
        - 经审计的分部经济性显示出持久的毛利率和经常性平台收入，将强化这一逻辑。
      - - 投资逻辑
        - Visa Direct 分发能力和广泛的授权覆盖范围，表明其具备战略相关性且难以复制。
        - 多个互不相关客户的生产交易量、续约率和附加率证据，可将相关性转化为商业验证。
      - - 反向逻辑
        - 已命名的关系和地理覆盖并不能揭示收入贡献、集中度或盈利能力。
        - 客户级收入、留存和贡献利润率队列将缩小这一缺口。
      - - 反向逻辑
        - 据报道，Mastercard 在早期并购讨论后退出了投资路径，因此战略兴趣并不等于已承诺的退出。
        - 一份披露经济性且优先权负担有限的已签署融资或收购协议，将降低这一风险。
    notes: 公司发布的关系和产品证据被视为公司自述，而非独立验证；要求改变判断的证据属于私有尽调材料。
