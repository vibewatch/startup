  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Visa 级分发转化为多元化的经常性交易量；增长和利润率经审计且表现强劲；融资条款干净。
        - 只有在核验 KPI 和优先权后，才使用观察到的 $1.5B-$2.0B 外部讨论区间；要求有可信路径实现高于入场价的风险投资回报。
        - 执行、监管和倍数压缩。
        - 已签署的企业扩张、经审计的队列和一轮非结构化融资。
      - - 基准
        - 机构采用逐步推进，但经济性和集中度仍只能部分看清。
        - 公开证据无法支持有依据的数值公允价值区间；应以低于超过 $1.5B 的融资要价谈判，并根据披露的经济性建模回报。
        - 爬坡缓慢、合规成本、客户集中度和稀释。
        - 续约和交易量增长，但利润率低于目标或仍未披露。
      - - 悲观
        - 战略转化停滞、融资转弱，或受监管实体成本吞噬贡献利润。
        - 公开信息无法支持估值下限；应假设下轮融资或结构化资本重组风险，而不是外推历史并购讨论。
        - 商业化失败、不利条款、流动性需求以及失去主要合作伙伴。
        - 发布延迟、集中度流失、利润率压缩或保护投资人的融资。
    notes: 情景是条件式决策规则，不是预测；唯一的数值区间复现了据报道的外部讨论，不是评估值或交易价值。
    claimRefs:
      - CV001
      - CV002
