  productSummary: >
    The Neara Platform is a physics-enabled digital twin for power infrastructure: it auto-ingests
    and normalises LiDAR, aerial/satellite imagery, GIS, and asset data to build 3D network models,
    then simulates wind, ice, thermal, flood, vegetation, wildfire, capacity, and new-build scenarios.
    Reported outcomes include ~9x faster risk identification and ~85% faster new-infrastructure design.
  customerFocus: "Electric transmission and distribution utilities (DSOs/TSOs) in Australia, the US, UK, and Europe."
