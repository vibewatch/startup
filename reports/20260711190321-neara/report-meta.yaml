  topStrengths:
    - "Category-leading physics-enabled digital twin with a defensible technical head start and quantified customer outcomes (9x faster risk ID, 60,000km modeled in 48hrs)."
    - "Blue-chip utility traction: ~90% of Australian utilities plus Southern California Edison, CenterPoint, ESB Networks, Scottish Power, and HEDNO across four continents."
    - "Powerful secular tailwinds: grid modernisation, data-centre load growth, extreme-weather resilience, and IEA-projected grid investment rising toward US$600B/yr by 2030."
    - "Tier-1 investor syndicate (TCV, Partners Group, EQT, Square Peg, Skip Capital) and experienced, domain-credentialled founding team and board."
  topRisks:
    - "Financial opacity: no audited financials; revenue (~A$10M est.) and headcount are third-party estimates, so growth and unit economics are unverified."
    - "Stretched valuation: A$1.1B against sub-A$20M estimated revenue implies a ~55-110x multiple, far above Bentley (~6.3x) and GE Vernova (~7.1x) public comps."
    - "Customer and geographic concentration in Australian regulated utilities with long procurement cycles and RAB frameworks that can disincentivise efficiency software."
    - "Incumbent competition from Bentley (iTwin), GE Vernova (GridOS), Siemens, and Hexagon that could bundle digital-twin capability."
  unresolvedGaps:
    - "Audited or company-confirmed revenue, ARR, gross margin, net revenue retention, and burn/runway."
