companyProfile:
  summary: >
    Neara is a Sydney-based infrastructure software company that builds AI-powered, physics-enabled
    digital twins of electricity networks. Utilities ingest LiDAR, imagery, GIS, and asset records
    into Neara's platform to create geometrically precise 3D models of their grids, then run
    simulations for wildfire and flood risk, extreme-weather resilience, outage prediction, capacity
    optimisation, and asset inspection. The company covers an estimated 90% of Australian network
    utilities and has expanded into the US, UK, and Europe. In February 2026 it raised an A$90M
    Series D led by TCV at an A$1.1 billion valuation, becoming Australia's newest unicorn in AUD terms.
