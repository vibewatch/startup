  topStrengths:
    - 物理驱动的数字孪生处在品类前列，技术先发优势有防守性，客户成效也有量化证据：风险识别快 9x，48 小时建模 60,000km。
    - >-
      一线公用事业客户已有牵引：覆盖约 90% 澳大利亚公用事业公司，并进入 Southern California Edison、CenterPoint、ESB Networks、Scottish
      Power、HEDNO，横跨四大洲。
    - 长期顺风强：电网现代化、数据中心负荷增长、极端天气韧性需求，以及 IEA 预计到 2030 年电网投资将升至每年约 US$600B。
    - 投资人阵容一线（TCV、Partners Group、EQT、Square Peg、Skip Capital），创始团队和董事会也有足够行业履历。
  topRisks:
    - 财务透明度低：没有审计财报，收入（估计约 ~A$10M）和员工数都来自第三方估计，增长和单位经济性尚未验证。
    - 估值拉得很高：A$1.1B 对应低于 A$20M 的估计收入，隐含约 ~55-110x 倍数，远高于 Bentley（约 ~6.3x）和 GE Vernova（约 ~7.1x）等上市可比公司。
    - 客户和地域集中在澳大利亚受监管公用事业；采购周期长，RAB 框架还可能削弱效率软件的采购动机。
    - Bentley（iTwin）、GE Vernova（GridOS）、Siemens、Hexagon 等存量厂商可能把数字孪生能力打包进既有产品，形成竞争挤压。
  unresolvedGaps:
    - 收入、ARR、毛利率、净留存率、烧钱速度 / 现金跑道缺少审计数据或公司确认。
    - A$1.1B 估值究竟如何按 AUD / USD 口径表述，以及 Series D 精确美元融资额，仍未确定。
    - 由于存在未具名保密客户，完整客户数、合同金额、留存 / 流失情况未披露。
    - Series B 延展轮日期（2022 年底 vs 2023 年 9 月）和成立年份（2016 vs 2019）的冲突仍需对齐。
