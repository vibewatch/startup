- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / capability
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Data ingestion and reconciliation
    - GIS / asset-data teams
    - Production-public; official pages and LiDAR release
    - Normalises LiDAR, imagery, GIS, and asset records into a physics-ready baseline
    - Request data schema, failure handling, and customer-specific QC logs
  - - Physics-enabled network twin
    - Engineers, planners, risk teams
    - Core platform; described across official and independent sources
    - Models real-world behaviour of poles, conductors, clearances, terrain, and failure propagation
    - Review validation datasets and model-calibration process
  - - Flood and disaster response
    - Control room, emergency planning
    - Production-proven at SAPN and Endeavour
    - Scenario outputs supported restoration, de-energisation, and crew prioritisation
    - Confirm repeatability across different flood models and data sources
  - - Wildfire / vegetation risk
    - Vegetation, wildfire, reliability teams
    - Production deployment with SCE
    - Combines LiDAR, satellite imagery, wind, temperature, and vegetation-strike analysis
    - Assess false-positive/false-negative rates and regulatory acceptance
  - - Capacity, DLR, reconductoring, new builds
    - Grid planners, interconnection teams
    - Publicly described; fewer quantified case details
    - Finds latent capacity and tests changes before field spend
    - Request customer examples, engineering sign-off, and cost savings
  - - Automated LiDAR classification
    - Geospatial teams, utility data owners
    - Self-service release announced; independent trade coverage
    - 30x speed claim, single logic across territory, point-cloud workflow in-house
    - Verify precision by class, recall, edge cases, and data-residency controls
  notes: Matrix is based on public product pages, case studies, and trade coverage; maturity indicates public proof, not internal
    release-stage data.
