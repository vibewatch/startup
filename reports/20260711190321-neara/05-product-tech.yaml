company:
  name: Neara
chapter:
  number: 5
  title: Product & Technology
  summary: Neara delivers a physics-enabled digital twin platform that ingests utility LiDAR, imagery, GIS, and asset records,
    turns them into a network-scale model, and supports flood, wildfire, vegetation, wind, ice, thermal, capacity, reconductoring,
    and new-build simulations. Public proof is strongest for flood response, LiDAR automation, and named utility deployments;
    diligence should focus on independent validation, data-quality dependence, standards support, cybersecurity, and compute
    economics.
sections:
- id: workflow-definition
  title: Product Definition and Customer Workflow
  body: 'Neara sells an enterprise platform for utilities that turns existing network records into a physics-enabled 3D digital
    twin and then uses that twin to make operational decisions faster. The customer job is not merely map viewing: a utility
    points Neara at LiDAR, imagery, GIS, and asset records; Neara normalises and quality-checks the data; engineers then run
    scenarios such as floods, wind, ice, vegetation encroachment, reconductoring, or new feeder design; the output becomes
    hardening plans, regulator-ready reports, condition-based inspection programs, and field-ready work orders. The workflow
    is clearest in flood and wildfire deployments. SA Power Networks used the twin to decide when lines would breach safe
    clearances during River Murray flooding, while SCE uses the platform for vegetation and wildfire-risk analytics across
    a 50,000-square-mile service area. This positions Neara as a decision-support system for asset managers, planners, risk
    teams, control rooms, and field crews rather than a generic geospatial viewer.'
