- id: performance-maturity-moat
  title: Performance Evidence, Maturity, and Moat
  body: Neara has unusually concrete product-performance proof for a private infrastructure-software company, though most
    metrics remain company- or customer-case-study reported. SA Power Networks analysed 21,000 spans in fifteen minutes and
    re-energised in five days rather than three weeks. Endeavour Energy modelled a 60,000 km network, stood up a live flood
    model in 48 hours, and eliminated 300 manual inspection hours. Enlit reports 9x faster outage-risk removal, 3x faster
    restoration after severe weather, and 85% faster new-transmission approval; LiDAR automation sources report up to 30x
    faster classification and EEPower cites 99% object-classification precision and more than 1,000 miles classified daily.
    The technical moat appears to combine domain-specific physics, AI/ML trained on over one million miles of network territory,
    customer data workflows, and accumulated utility deployments. That said, public sources do not show granted patent coverage
    or independent benchmarks that would prove the moat is legally protected rather than operationally hard to replicate.
