  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: model validation and accuracy
    missingEvidence: Independent validation reports, test datasets, error bounds, uncertainty treatment, and documented model
      recalibration history for Neara simulations.
    whyItMatters: Utilities use outputs for safety, outage, wildfire, flood, and capital-planning decisions where false precision
      can create physical and regulatory risk.
    diligencePath: Request model V&V packs, customer acceptance-test results, red-team cases, and third-party engineering
      review memos for representative deployments.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: compute cost and simulation economics
    missingEvidence: Customer-level compute spend, runtime distribution, cloud architecture, gross margin impact, and total
      cost of ownership versus manual and incumbent tooling.
    whyItMatters: Network-scale simulations may be expensive to operate; without unit cost evidence, software gross margin
      and customer ROI remain uncertain.
    diligencePath: Request cloud-cost allocation by customer, workload benchmarks, simulation concurrency limits, and pricing/usage
      correlation from the data room.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: public IP and patent protection
    missingEvidence: Patent schedule, granted or pending application numbers, trade-secret inventory, and freedom-to-operate
      analysis for the physics-enabled digital twin.
    whyItMatters: The moat appears operationally strong, but public sources do not prove legal exclusivity; competitors could
      replicate workflows if implementation know-how is not protected.
    diligencePath: Run formal AU/US/WIPO patent searches for LineSoft, Neara, founders, and prior Power Lines Pro names; request
      counsel-prepared IP schedule.
    relatedQuestionRefs:
    - QE027
  - type: missing-source
    severity: material
    topic: security and critical-infrastructure controls
    missingEvidence: SOC 2 or ISO 27001 reports, penetration-test summary, encryption/access-control architecture, incident
      response process, and data-residency commitments.
    whyItMatters: Neara handles sensitive critical-infrastructure data, so adoption risk depends on trust controls that public
      pages do not disclose.
    diligencePath: Request security package under NDA and map controls to utility procurement requirements and NIST AI RMF
      expectations.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: CIM CGMES IEC interoperability
    missingEvidence: Named import/export support for CIM, CGMES, IEC 61970/61968, GIS schemas, and customer system integrations.
    whyItMatters: Standards support reduces implementation friction and lock-in risk for regulated utilities.
    diligencePath: Request integration matrix, API/interface documentation, sample model exports, and customer references
      using standards-based exchanges.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
