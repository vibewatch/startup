- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Source data layer
    - LiDAR, satellite/high-definition imagery, GIS, CAD, inspection history, weather, operating conditions, asset records
    - Customer data rights, data recency, scan density, geospatial alignment
    - Bad inputs can create falsely precise outputs
  - - Ingestion and QC
    - Normalises, stitches, reconciles, and quality-checks data automatically
    - Connectors to utility systems and reliable point-cloud processing
    - Public docs do not disclose exception handling in detail
  - - Physics twin
    - Spatially precise network model with loads, clearances, terrain exposure, component properties, and failure likelihood
    - Engineering rules and calibrated asset libraries
    - Validation and uncertainty disclosure not public
  - - Simulation engine
    - Runs wind, ice, thermal, flood, vegetation, wildfire, capacity, reconductoring, and new-build scenarios
    - Compute capacity, weather/environmental inputs, model calibration
    - Compute cost and runtime economics not disclosed
  - - AI/ML layer
    - Improves LiDAR classification, risk assessment, image recognition, and photogrammetry roadmap
    - Training corpus, MLOps, labelled examples, domain experts
    - Black-box risk if explainability and audit trails are weak
  - - Action/output layer
    - Produces hardening plans, regulator-ready reports, inspections, work orders, and investment cases
    - Workflow integration with utility systems and field processes
    - Adoption depends on regulatory acceptance and operator trust
  notes: Architecture is inferred from public workflow evidence; it is not a code, cloud, or database architecture audit.
  claimRefs:
