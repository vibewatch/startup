  - CE032
  - CE038
- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / standard / quality topic
  - Public status
  - Scope
  - Gap / diligence ask
  rows:
  - - LiDAR/GIS reconciliation
    - Publicly described by Neara
    - Data-quality baseline and asset-record alignment
    - Request QC reports, exception queues, and customer acceptance criteria
  - - CIM / CGMES / IEC interoperability
    - Relevant industry benchmark documented by ENTSO-E, but not certified in Neara sources
    - Network-model exchange and utility interoperability
    - Ask for supported schemas, import/export maps, and conformance evidence
  - - Model verification and validation
    - General V&V guidance exists; Neara publishes case outcomes but not audit packs
    - Safety-critical simulation credibility
    - Request validation plans, test sets, error bands, and independent reviews
  - - AI trust and critical-infrastructure risk
    - NIST AI RMF provides relevant risk-management frame
    - AI-enabled capabilities in critical infrastructure
    - Ask for AI governance, human override, monitoring, and incident processes
  - - Cybersecurity / privacy certifications
    - No SOC 2, ISO 27001, penetration test, or encryption detail found in fetched public pages
    - Sensitive grid, point-cloud, and asset data
    - Require security certifications, architecture diagram, pen-test summary, and data-residency terms
  - - Point-cloud data residency
    - Self-service announcement says point-cloud data stays onshore and workflow remains in-house
    - LiDAR classification workflow
    - Confirm legal jurisdiction, cloud region, and tenant-isolation controls
  notes: 'Trust controls are deliberately conservative: absence from public evidence is treated as a diligence gap, not proof
    of absence.'
