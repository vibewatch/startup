      - number: '7.3'
        title: 商业、财务与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Neara 的公开牵引力亮眼，但集中度也高。接近 90%
              的澳大利亚网络公用事业公司与其合作，是强有力的验证点；反过来，早期客户背书、实施手册和监管熟悉度也可能集中在一个国家。国际客户胜利能降低这一风险，但还没有披露客户数、合同金额、续约率、NRR
              或流失。财务不透明进一步放大问题：公开证据只有 A$1.1 billion 估值和第三方收入估算，没有经审计 ARR、毛利率、烧钱速度或分组留存。即便 totex
              改革试图降低扭曲，受监管的公用事业买方仍可能遇到成本回收摩擦：数字孪生订阅计入 opex，实体网络升级却放在资本计划里。竞争上，Neara 必须赢过已经嵌在公用事业
              GIS、资产管理、规划或运营堆栈里的既有套件；这些对手可以打包、折价，并降低客户感知的集成风险。
