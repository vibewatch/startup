        - id: regulators
          label: 监管方 / 市场机构
          detail: AEMC、AEMO、AER、FERC/NERC 和欧盟法律设定预期。
        - id: data-sources
          label: 客户数据源
          detail: LiDAR、GIS、影像和资产记录决定模型质量。
        - id: incumbents
          label: 既有套件
          detail: Bentley、GE Vernova 和 Siemens 捆绑相邻能力。
        - id: capital
          label: 增长资本
          detail: Series D 为招聘和扩张提供资金，但也抬高执行门槛。
        - id: talent
          label: AI/ML 与实施人才
          detail: 扩展验证、安全和全球部署需要这类人才。
        - id: renewals
          label: 续约 / 扩张
          detail: 评估留存和集中度，需要私有证明。
      edges:
        - from: customers
          to: renewals
          label: 证明转化为留存
        - from: regulators
          to: customers
          label: 塑造预算和证据
        - from: data-sources
          to: customers
          label: 决定模型质量
        - from: incumbents
          to: customers
          label: 参与采购竞争
        - from: capital
          to: talent
          label: 资助招聘
        - from: talent
          to: customers
          label: 支撑部署
        - from: renewals
          to: capital
          label: 支撑估值
    approximationNotes: 基于公开来源的定性依赖关系图；客户合同条款和续约数据未公开。
    claimRefs:
      - CR015
      - CR016
      - CR022
      - CR025
      - CR026
      - CR027
      - CR033
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链说明：即使产品证明强，仍应守住价格纪律，采取继续研究立场。
    data:
      nodes:
        - id: proof
          label: 产品 / 客户证明
          detail: 建模 15M 个资产、具名公用事业客户、TCV 验证
        - id: opacity
          label: 财务不透明
          detail: 缺少经审计 ARR、毛利率、NRR、集中度或条款
        - id: stretch
          label: 隐含倍数拉伸
          detail: 基于公开估算和假设，收入倍数约 55-106x
        - id: benchmarks
          label: 基准重置
          detail: 上市和私有 SaaS 倍数大多远低于公开隐含区间
        - id: diligence
          label: 数据室关口
          detail: A$75-100M ARR、120%+ NRR、干净优先权条款、币种清晰
        - id: decision
          label: 建议
          detail: 继续研究 / 跟踪；没有证据前，不按公开估值买入
      edges:
        - from: proof
          to: diligence
          label: 给出接触理由
        - from: opacity
          to: stretch
          label: 挡住清晰投资判断
        - from: stretch
          to: benchmarks
          label: 必须做合理性校验
        - from: benchmarks
          to: decision
          label: 维持估值偏拉伸
        - from: diligence
          to: decision
          label: 可能推向公允判断
    approximationNotes: null
    claimRefs:
      - CV034
      - CV035
      - CV041
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 收入倍数对比将 Neara 的公开隐含区间放在上市可比公司和私有 SaaS 基准旁边。
    data:
      items:
        - label: Neara @ A$10.4M 收入
          value: 106
          unit: x revenue
          tone: negative
        - label: Neara @ A$20M 收入
          value: 55
          unit: x revenue
          tone: negative
        - label: 私有 AI 原生高端
          value: 20
          unit: x ARR
          tone: neutral
        - label: 私有 AI 原生中位
          value: 12
          unit: x ARR
          tone: neutral
        - label: Bentley P/S 标尺
          value: 6.4
          unit: x sales
          tone: neutral
        - label: Autodesk EV/收入
          value: 5.8
          unit: x revenue
          tone: neutral
        - label: 设计与工程组合
          value: 4.6
          unit: x NTM revenue
          tone: neutral
        - label: Trimble EV/收入
          value: 3.7
          unit: x revenue
          tone: neutral
    approximationNotes: Neara 取值使用估算或假设收入；上市可比公司倍数使用 2026 年 7 月市场数据快照，并已四舍五入。
    claimRefs:
      - CV015
      - CV036
      - CV028
      - CV029
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以同一单位（A$ 百万）呈现场景区间，从悲观降价轮到战略上行。
    data:
      items:
        - label: 悲观：A$20M 收入，8x
          low: 120
          base: 160
          high: 220
          unit: A$M
        - label: 基准：A$50M 收入，12x
          low: 450
          base: 600
          high: 750
          unit: A$M
        - label: 公开估值桥接：A$75M 收入，~14.7x
          low: 900
          base: 1100
          high: 1250
          unit: A$M
        - label: 乐观：A$100M 收入，15x
          low: 1200
          base: 1500
          high: 1800
          unit: A$M
        - label: 战略上行：A$125M 收入，16x
          low: 1600
          base: 2000
          high: 2400
          unit: A$M
    approximationNotes: 所有区间都是以澳元计的简单收入倍数场景，未计入稀释、优先权和外汇影响。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 评分卡把高产品质量与低公开估值支撑拆开看。
    data:
      items:
        - label: 市场紧迫性
          value: High
          score: 8
          note: AI / 数据中心 / 电网约束支撑需求
        - label: 产品证明
          value: High
          score: 8
          note: 具名公用事业客户和资产规模支撑品类匹配
        - label: 收入可见度
          value: Low
          score: 3
          note: 只有低置信度第三方估算
        - label: 估值支撑
          value: Weak
          score: 2
          note: 公开隐含倍数远高于基准区间
        - label: 可比公司匹配度
          value: Medium
          score: 5
          note: 存在相关上市可比公司，但它们更成熟且业务更多元
        - label: 退出准备度
          value: Incomplete
          score: 4
          note: 无 IPO 申报或经审计财务
        - label: 尽调杠杆
          value: High
          score: 7
          note: 私有指标可能显著改变立场
    approximationNotes: 评分是基于引用证据作出的 1-10 分 IC 判断，不是机械模型输出。
    claimRefs:
      - CV033
      - CV040
      - CV044
      - CV046
