      - number: '5.3'
        title: 性能证据、成熟度和护城河
        blocks:
          - type: paragraph
            body: >-
              对一家私营基础设施软件公司来说，Neara 拥有异常具体的产品性能证据，尽管多数指标仍来自公司或客户案例。SA Power Networks 15 分钟内分析 21,000
              个跨距，并在五天而不是三周内复电。Endeavour Energy 对 60,000 km 网络建模，48 小时内搭起实时洪水模型，并省掉 300 小时人工巡检。Enlit 报告称，停电风险移除快
              9x、恶劣天气后恢复快 3x、新输电审批快 85%；LiDAR 自动化来源报告分类速度最高快 30x，EEPower 称目标分类精度达 99%，每天分类超过 1,000 英里。技术护城河似乎由特定领域物理、在超过
              1 million 英里网络区域上训练的 AI/ML、客户数据工作流和累积公用事业部署共同构成。但公开来源未显示已授权专利覆盖或独立基准，无法证明护城河受法律保护，而不只是运营上难以复制。
