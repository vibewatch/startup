      - number: '2.4'
        title: 采用约束和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并不低摩擦。公用事业软件采用会被长采购周期、网络安全和可靠性审查、工程模型验证、与旧有 GIS/SCADA/ADMS
              数据整合，以及说服监管者认可软件节省可回收所拖慢。传统受监管资产基础激励也会制造资本开支偏好：电网在电杆、导线、变电站上可能获得更清晰回报，而避免或推迟这些支出的 SaaS
              不一定同样明确，除非价格控制框架奖励产出和创新。数据标准和互操作性很重要，因为孪生会嵌入规划决策，数据标准化后切换成本上升。因此核心尽调缺口不是电网问题是否真实；证据已经很强。真正的问题是，Neara
              能否在澳大利亚之外把问题转化为可重复的受监管预算，2026 年 USD 0.67-1.6 billion
              的窄口径市场中到底有多少可服务，以及试点多快能转为经常性平台收入。任何由市场驱动的估值情景都应明确折扣这个时间风险。
