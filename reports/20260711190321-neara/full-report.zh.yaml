      - - IBM Maximo
        - 企业资产管理既有厂商
        - 全球软件平台
        - 资产密集型公用事业公司和基础设施运营商
        - EAM、资产健康和可靠性工作流
        - 资产生命周期层，不是物理优先的电网拓扑仿真
        - IBM；SourceForge
      - - Hexagon
        - GIS / 网络数据既有厂商
        - 全球地理空间和公用事业软件厂商
        - 公用事业公司和通信网络
        - 地理空间网络运营和数据管理基础
        - 更多争夺记录系统控制权，而不是应力仿真
        - Hexagon；HxGN utilities
      - - Sharper Shape
        - 直接 / 相邻的公用事业巡检孪生
        - Tracxn：Series B，融资 $21.2M
        - 输配电巡检和植被团队
        - 面向公用事业公司的 Living Digital Twin + LiDAR 分类
        - 更偏巡检 / 植被，而非广义电网容量规划
        - Sharper Shape；Tracxn
      - - Trimble Vegetation Manager
        - 植被管理相邻领域
        - Trimble 企业产品线
        - 公用事业植被管理团队
        - GIS、3D、卫星、LiDAR 和现场工作流
        - 植被工作流更窄；需测试与物理仿真的集成
        - Trimble；Lidar News
      - - Esri ArcGIS Utility Network
        - GIS 记录系统既有厂商
        - 全球 GIS 平台
        - 电力、燃气、水务和电信公用事业
        - 权威公用事业网络数据模型与追踪
        - 很可能是补充或平台依赖，单独并非完整物理孪生
        - Esri 概览；Esri 2026 版发布
      - - One Concern
        - 气候韧性相邻领域
        - 非上市韧性软件公司
        - 基础设施业主、政府、保险公司
        - 灾害和气候风险数字孪生分析
        - 韧性覆盖更宽；电网工程针对性较弱
        - One Concern 主页；One Concern 发布
      - - GridData
        - 直接的配电网数字孪生创业公司
        - Tracxn：德国竞争对手，已获融资
        - 区域配电网运营商
        - 基于电网设备真实测量数据的 DigitalTwin
        - 规模和地域覆盖小于 Neara；融资细节稀少
        - GridData；Tracxn
      - - Unleash live
        - AI 巡检相邻领域
        - 悉尼计算机视觉公司
        - 公用事业、可再生能源、交通巡检
        - 面向 D&T 巡检的 AI 视频 / 图像处理
        - 巡检分析替代方案，不是完整电网仿真孪生
