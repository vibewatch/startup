  productSummary: >
    Neara Platform 是面向电力基础设施的物理驱动数字孪生：自动导入并标准化 LiDAR、航空 / 卫星影像、GIS 和资产数据，构建 3D
    网络模型，再模拟风、冰、热、洪水、植被、野火、容量和新建场景。公开结果包括风险识别速度约提升 9x，新基础设施设计速度约提升 85%。
  customerFocus: 澳大利亚、美国、英国和欧洲的输配电公用事业公司（DSO/TSO）。
