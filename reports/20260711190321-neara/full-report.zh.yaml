            body: >-
              Neara 模式有吸引力的部分在于它以软件为中心：看不出需要库存、制造爬坡或项目融资型资产负债表敞口。昂贵的部分是，每个企业部署都依赖 LiDAR、影像、GIS
              和资产记录的导入与质控，物理模型配置，面向运营团队的客户成功工作，以及机器学习和 AI 上的持续研发。公开 SaaS 基准意味着投资者会期待毛利率高于约 70-75%、烧钱倍数低于约 1.5x，并有可信的 CAC
              回收期；Neara 没有披露这些指标。尽调负担在于，把平台订阅毛利率与实施服务拆开，量化每公里建模网络的计算和支持成本，并证明同一模型能在国际市场复制，而不会让定制工程消耗毛利池。
