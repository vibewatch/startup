  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 证据支撑
      - 何种证据会改变判断
      - 方向
    rows:
      - - 正方：定义品类的电网数字孪生
        - TCV 领投 Series D、具名全球电力客户、已建模 15M 项资产
        - 数据室证明国际扩张能转化为可重复 ARR
        - 正向
      - - 正方：AI / 数据中心 / 电网瓶颈顺风
        - 公司和投资人材料把平台与能源接入、电网容量挂钩
        - 独立销售管线证据显示电力公司有紧迫且已获资金的预算
        - 正向
      - - 正方：稀缺战略资产
        - Bentley/GE/Autodesk/Trimble 可比公司显示基础设施软件有公开市场价值
        - 战略收购兴趣或伙伴经济性
        - 正向
      - - 反方：收入不透明
        - 公开收入估计可信度低且不一致
        - 经审计收入 / ARR 桥接表和递延收入计划
        - 负向
      - - 反方：倍数过高
        - A$1.1B 对 A$10.4-20M，意味着收入倍数约 55-106x
        - 经验证 ARR 达 A$75-100M，且 NRR 强
        - 负向
      - - 反方：币种混淆
        - A$1.1B 是 AUD 独角兽头条，不是 US$1.1B
        - 融资证明和投资人材料明确币种及投后条款
        - 负向
      - - 反方：非公开条款未知
        - 未公开清算优先权、老股转让或持股数据
        - 完整股权结构表、优先权栈和备考稀释表
        - 负向
    notes: 该表把公司质量与价格支撑分开；即使正方论点很强，如果进入倍数缺乏支撑，投资仍可能不具吸引力。
