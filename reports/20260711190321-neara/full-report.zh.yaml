figures:
  - id: FO001
    title: Neara 融资与里程碑时间线
    type: timeline
    layout: standard
    summary: |
      按日期梳理从创立（2016 年）到 Series D 独角兽轮（2026 年 2 月）的里程碑，覆盖融资事件、商业化发布和旗舰公用事业伙伴关系。
    data:
      items:
        - date: '2016'
          label: 创立（LineSoft Pty Ltd）
          detail: Daniel Danilatos、Karamvir Singh 和 Jack Curtis 在悉尼创立 Neara。
          tone: positive
        - date: '2018'
          label: 种子轮
          detail: Skip Capital 完成对公司五次投资中的第一次。
          tone: positive
        - date: '2019'
          label: 商业化启动
          detail: Neara 开始向公用事业公司商业化推广其数字孪生平台。
          tone: positive
        - date: '2021'
          label: Series A 轮 — A$7.25M
          detail: Square Peg 和 Skip Capital 支持早期商业化扩张。
          tone: positive
        - date: 2022-05
          label: Series B 轮 — A$20M
          detail: Prosus Ventures 领投；资金用于国际扩张。
          tone: positive
        - date: 2022/2023
          label: Series B 延展轮 — A$15.25M
          detail: Prosus 领投的延展轮支持海外计划；各来源报道时间不一致。
          tone: neutral
        - date: 2023-09
          label: Southern California Edison 合作
          detail: 多年期野火缓释合作，覆盖 SCE 50,000 平方英里辖区。
          tone: positive
        - date: 2024-10
          label: CenterPoint Energy 合作
          detail: Hurricane Beryl 后部署极端天气韧性方案。
          tone: positive
        - date: '2024'
          label: Series C 轮 — A$45M
          detail: 独角兽前增长轮，由现有投资者支持。
          tone: positive
        - date: 2026-02
          label: Series D 轮 — A$90M / A$1.1B
          detail: TCV 领投；Neara 成为澳大利亚最新独角兽；总融资约 A$180M。
          tone: positive
    approximationNotes: Series B 延展轮日期按 2022/2023 显示，因为来源互相冲突；种子轮金额未披露。
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO024
      - CO025
      - CO031
  - id: FO002
    title: Neara 公司快照逻辑
    type: flow
    layout: standard
    summary: |
      展示 Neara 的数据摄取、物理驱动数字孪生、公用事业工作流、客户结果和资本结构如何互相连接。
    data:
      nodes:
        - id: data
          label: 客户数据摄取
          detail: 摄取现有 LiDAR、影像、GIS 和资产记录；自动标准化并做质量检查。
        - id: twin
          label: 物理驱动数字孪生
          detail: 几何精确的 3D 模型，可复现真实资产在压力下的行为。
        - id: workflows
          label: 仿真与风险工作流
          detail: 风、冰、热、洪水、野火、植被、容量和新建场景。
        - id: customers
