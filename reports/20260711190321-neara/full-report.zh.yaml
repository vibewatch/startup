      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >
              Neara 由 Daniel Danilatos、Karamvir Singh 和 Jack Curtis 联合创立。Daniel Danilatos（CEO）曾任 Google
              技术负责人，参与早期网页实时协同编辑工具建设，此前创办工程咨询公司 Helix；他拥有 University of New South Wales 计算机科学学位。Jack Curtis（联合创始人兼首席商务 /
              运营官）有 15 年以上全球能源和金融经验，曾在 First Solar 担任高级副总裁，负责 US$1.1 billion P&L，也曾在 Goldman Sachs
              从事电力和公用事业投行业务；他是公司最主要的公开发声者。Karamvir Singh（联合创始人兼首席产品官）长期从事软件工程，曾创办并退出过企业。


              公司扩张后，治理逐步机构化。公开披露的董事会和投资方董事代表包括 James A. Ajello（前 Hawaiian Electric 高管）和 EQT 的 Jeff
              Lu，反映增长股权投资者已经进入股权结构。三位创始人仍处在运营核心，尤其 Jack Curtis 集中承担对外商业和融资沟通，这带来一定关键人物依赖，尽调需要深入验证。


              Neara 也设立了国际法律实体以支撑扩张——伦敦的 Neara Software Ltd（2023 年末注册）以及内华达州 Reno 的美国实体（2024
              年成立）——说明公司正有意在澳大利亚核心团队之外建设海外商业和工程存在。完整高管层深度（CFO、CTO）和完整董事会构成没有全面公开。
