      - number: '2.2'
        title: 买方细分、用户和预算归属
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方是受监管的配电网络运营商，或拥有资产数据并负责可靠性、韧性、植被管理、接入研究和网络规划的垂直一体化公用事业公司。输电运营商是相邻买方，拥堵、动态额定容量、并网队列和拓扑优化会制造即时痛点。数据中心发起方等大型负荷开发商更适合视为间接需求驱动者：它们制造接入复杂度，也可能出资做研究或升级，但通常由网络运营商和监管者决定哪类建模工具成为系统记录。公用事业公司内部，经济发起人通常是资产管理、电网规划、运营、网络战略或创新
              / 监管团队，而不只是 CIO。日常用户是规划人员、工程师、植被和野火团队、韧性分析师、接入研究团队。因此采用路径既要拿到技术信任，也要跑通监管成本回收逻辑；一个顺滑的 AI 演示还不够。
