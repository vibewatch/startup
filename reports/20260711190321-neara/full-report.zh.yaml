      - number: '1.4'
        title: 规模、封面指标和牵引力
        blocks:
          - type: paragraph
            body: >
              Neara 披露的规模指标偏运营而非财务。公司称已对四大洲超过 3 million 公里基础设施中的 15 million 多个基础设施资产建模（较早的 2023 年数字为 8 million 个资产和 1
              million 平方英里，显示增长很快）。它服务接近 90% 的澳大利亚电网公用事业公司——Essential Energy、Endeavour Energy、Ausgrid、AusNet、Powercor 和
              SA Power Networks——国际客户包括 Southern California Edison 和 CenterPoint Energy（美国）、ESB Networks（爱尔兰）、Scottish
              Power（英国）和 Hedno（希腊）。


              财务封面指标没有官方披露。第三方追踪器估算，2024 年收入约 A$10.4 million（高于 2022 年的 A$5.5 million），2026 年员工数约 114 人（高于 2022 年约 46
              人，年增长约 44%），但这些都是未经验证的低置信度估算。A$1.1 billion 估值对应估计低于 A$20 million 的收入，隐含收入倍数很高，尽调必须重点审视。


              牵引力来自有名有姓且量化的公用事业部署：Murray 河洪水期间，SA Power Networks 在 15 分钟内分析 21,000 个线路跨距，并在五天内复电，而人工估计需三周；Endeavour
              Energy 省掉 300 小时巡检，并在 48 小时内对 60,000 km 网络建模；Beryl 飓风之后，CenterPoint 将 Neara 部署到其 8,000 km2
              的休斯敦区域。这些证明点支撑了公司的品类主张。
