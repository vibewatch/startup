      - number: '8.2'
        title: 可比倍数与负向拉伸信号
        blocks:
          - type: paragraph
            body: >-
              负向估值信号很直接：Neara 披露的估值，对应的是薄弱且低置信度的收入估算。按 2024 年 A$10.4 million 收入估算，隐含过去十二个月收入倍数约 106x；即便宽松假设当前收入已经达到 A$20
              million，仍约为 55x。稀缺的 AI 基础设施平台不是不能承受这一倍数，但它远高于本次查看的大多数公开和私营软件基准。最接近的上市基础设施工程软件可比公司
              Bentley，交易倍数接近中个位数销售倍数，同时指引 2026 年收入超过 US$1.6 billion、ARR 接近 US$1.5 billion。Autodesk 和 Trimble 也把成熟设计 /
              地理空间软件锚定在约 3.7x 到 5.8x EV / revenue（截至 2026 年 7 月数据）。私营 SaaS 基准通常只把两位数 ARR 倍数留给稀缺、高增长、高留存、AI 原生企业；Neara
              可能符合，但公开来源尚未证明。
