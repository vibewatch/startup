      - number: '4.2'
        title: 商业化动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Neara
              的商业化路径集中在大型电力公用事业公司和相邻基础设施业主，已在澳大利亚、美国、爱尔兰、英国和希腊拿到具名证明点。这有价值，因为受监管公用事业公司一旦部署，会成为粘性强、可引用的客户；成本也高，因为采购、网络审查、监管论证和数据上线会拉长销售周期。公开记录给出了很强的采用轶事——Endeavour
              省掉 300 小时人工巡检，Series C 新闻稿称分析从数月或数年降到数小时或数天——但没有给出 CAC、销售人效、回收期、扩张 ARR、流失或净留存。因此对标企业 SaaS 只能保持方向性：若 ACV
              很大，18-24 个月 CAC 回收期可以接受；再长就需要证明异常强的 NRR 或战略性先落地再扩张经济性。
