      - number: '8.4'
        title: 退出准备度、假设击穿触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度在战略上有吸引力，但财务上还不完整。Neara 在基础设施工程、电网编排、地理空间数据和工业软件周边有可信的战略买家和可比对象。GE Vernova 的 GridOS 与 Visual
              Intelligence 说明既有厂商对电网运营软件有需求；Bentley、Autodesk、Trimble 和 Hexagon 则说明公开市场投资者认可设计与基础设施软件资产。可是，目前没有 IPO
              申报、经审计财务、独立 ARR 或已披露 M&A 流程。否决标准应当机械化：ARR 低于 A$20 million、NRR 低于 110%、毛利率低于 70%、第一大客户集中度高于 25%、美国 /
              欧洲销售管线转化疲弱，或新一轮融资低于 A$1.1 billion 公开口径，都会击穿当前估值故事。反过来，如果数据室证明 ARR 为 A$75-100 million、NRR 达 120%+、毛利率强、CAC
              回收高效、优先权清晰，且融资文件不存在 USD / AUD 错配，姿态可以从偏高转为合理。
