companyProfile:
  summary: >
    Neara 是一家总部位于悉尼的基础设施软件公司，为电力网络构建 AI 驱动、物理驱动的数字孪生。公用事业公司把 LiDAR、影像、GIS 和资产记录导入 Neara 平台，生成几何精度很高的电网 3D
    模型，再用它模拟野火和洪水风险、极端天气韧性、停电预测、容量优化和资产巡检。公司覆盖估计约 90% 的澳大利亚电网公用事业公司，并已进入美国、英国和欧洲。2026 年 2 月，公司完成由 TCV 领投的 A$90M Series D
    轮，估值 A$1.1 billion，按 AUD 口径成为澳大利亚最新独角兽。
  foundedDate: '2016-01-01'
  founders:
    - name: Daniel Danilatos
      role: 联合创始人兼 CEO
      background: 前 Google 技术负责人；此前创办工程咨询公司 Helix；计算机科学背景。
