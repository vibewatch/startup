  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算口径
        blocks:
          - type: paragraph
            body: >-
              不能不加过滤地按通用数字孪生市场给 Neara 定价。相关市场是电网和关键基础设施切片：这类软件构建工程级网络孪生，并支持资产建模、韧性规划、容量研究、接入评估，以及植被或野火 /
              洪水工作流。宽口径数字孪生报告把 2026 年跨行业市场放在约 USD 26-50 billion，但这些总量包含制造、产品设计、建筑、工厂和通用 IoT 孪生，与 Neara
              的买方和工作流并不匹配。更稳妥的口径更窄：公用事业数字孪生解决方案 2026 年约 USD 672 million，电网数字孪生约 USD 0.92 billion，电气数字孪生约 USD 1.5-1.6
              billion，更宽的能源与电力数字孪生口径约 USD 7.5 billion。矛盾不是噪音，而是核心规模风险。Neara 的公开材料不披露 ARR、定价、胜率或目标渗透率，因此 SOM
              必须保留为尽调缺口，而不是电子表格里的确定数字。
