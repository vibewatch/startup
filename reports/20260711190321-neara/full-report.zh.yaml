      - number: '3.2'
        title: 能力对比：Neara 赢在物理深度，既有厂商赢在套件宽度
        blocks:
          - type: paragraph
            body: >-
              Neara 最强的差异化特征，是明确基于物理来建模电网几何、环境应力和资产行为。公开竞品页面显示了许多部分重叠：GE 结合 GIS 和高分辨率视觉数据，Siemens
              提供统一电网运营平台，Schneider/ETAP 现在营销物理驱动数字孪生，Sharper Shape 和 Trimble 强调基于 LiDAR 的植被或巡检工作流，Esri
              掌握公用事业网络数据模型，IBM/Hexagon 解决资产或地理空间管理。这意味着 Neara 的优势不在于拥有每个工作流，而在于足够快地交付工程级模型，替代数月人工分析。最危险的直接对比是
              Schneider/ETAP 和 GE/Siemens，因为它们能把建模接到运营套件上。最常见的多归属模式很可能是 Neara 加既有系统，而不是立即替换：公用事业公司可以跑 Neara 模拟，同时保留
              ADMS、GIS、EAM 和巡检平台执行运营。
