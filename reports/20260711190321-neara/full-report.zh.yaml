      - number: '1.3'
        title: 融资历史、估值和资本结构
        blocks:
          - type: paragraph
            body: >
              Neara 已完成五轮以上融资。Skip Capital（Kim Jackson 和 Scott Farquhar）最早在 2018 年种子阶段投资，之后参与了五轮融资。2021 年，公司完成 A$7.25
              million Series A 轮；2022 年 5 月，完成由 Prosus Ventures 领投、Square Peg 和 Skip Capital 参投的 A$20 million Series B
              轮。之后又追加 A$15.25 million Series B 延展轮——来源对时间有分歧，StartupDaily 称在 2022 年末，SmartCompany 称在 2023 年 9 月。A$45
              million Series C 轮在 2024 年末完成。


              2026 年 2 月 10 日宣布的 A$90 million Series D 轮由 TCV 领投——TCV 曾投资 Netflix、Spotify、Revolut 以及澳大利亚公司
              Xero、SiteMinder、Employment Hero——老股东 Partners Group、EQT、Square Peg Capital 和 Skip Capital 跟投。这是 TCV
              在澳大利亚的第三笔投资。本轮给出 A$1.1 billion 估值，使 Neara 按澳元口径成为独角兽；pv magazine 将融资额报为 US$63.8 million，意味着 USD 等值估值约
              US$700-780 million。外部累计融资目前约 A$180 million；Tracxn 另称为 US$126 million。


              公司未披露公开债务融资、二级交易或详细股权结构拆分。Series D 轮指向两件事：招聘机器学习和 AI 工程师，并扩大 Neara 在美国、英国和欧洲的国际商业版图。作为私营公司，Neara
              不发布经审计财务数据，收入、烧钱速度和现金跑道仍是估算。
