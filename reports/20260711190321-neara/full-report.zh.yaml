      - number: '5.4'
        title: 集成、信任控制和技术风险
        blocks:
          - type: paragraph
            body: >-
              主要承销风险在于，Neara 最强的证据集中在输出速度和客户结果上，而正式控制的公开证据较薄。平台深度依赖 LiDAR、GIS、卫星影像和资产记录的准确性、时效性和完整性；Neara
              自己也说，运营强度取决于所依赖数据。它的标准姿态应对照 CIM、CGMES 和 IEC 61970/61968 模型交换预期做尽调测试，因为抓取到的 Neara
              来源只是笼统讨论多项国际标准，而没有点名认证。模型验证和安全同样如此。NIST 的 AI Risk Management Framework 以及 ABS 验证与确认指南说明了关键基础设施 AI
              买方应期待什么：风险管理、验证文档、可信度评估和透明不确定性。Neara 的案例研究有说服力，但没有公开误差边界、独立验证审计、云成本基准、SOC 2/ISO
              证据或详细网络安全架构。这些缺口不推翻产品；它们界定了在承销任务关键部署风险前必须完成的数据室工作。
