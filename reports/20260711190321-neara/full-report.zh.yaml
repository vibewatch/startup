      - number: '5.2'
        title: 架构、数据管线和模拟引擎
        blocks:
          - type: paragraph
            body: >-
              最适合把 Neara 的架构理解为分层的公用事业数据运营模型。底层是客户自有数据集：LiDAR 点云、卫星和高清影像、GIS、CAD 或工程规格、巡检历史、运行条件、天气和洪水数据、资产记录。Neara
              的导入层通过拼接、标准化和质检来对齐这些输入，包括从 LiDAR 中识别 GIS
              差异和未知资产。空间模型再加入物理语境，如负载、净距、地形暴露、故障概率、线路张力和组件尺寸。其上是情景引擎，覆盖风、冰、热、洪水、植被、野火、容量、换导线、动态线路额定容量和新建研究。EEPower
              的技术报道补充称，Neara 使用静态和有限元分析评估电杆和组件应力，也能绘制电杆级联故障风险。公开材料不披露云架构、模型运行时间或具体 MLOps 实现，因此本章把架构视为可观察的工作流证据，而不是源码级审计。
