              按 2024 年 A$10.4 million 收入估算，A$1.1 billion 公开口径隐含约 106x 收入；即便 Neara 已达到 A$20 million，也约为 55x。相对 2026 年
              SaaS 和公开基础设施软件基准的这一差距，是本章最主要的估值风险。
