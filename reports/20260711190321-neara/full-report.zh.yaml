  - id: TV006
    title: 最终尽调索要清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR / 收入桥
        - 月度 ARR、确认收入、递延收入，以及 2024-2026 年桥接
        - 决定 A$1.1B 估值对应 10x、20x、55x 还是 106x
        - CFO 数据室；与发票核对
      - - 留存与扩张
        - NRR、GRR、客户流失、按 cohort 拆分的扩张 ARR
        - 高溢价倍数需要公用事业客户支出既黏住、又扩张
        - CRO/CFO cohort 分析
      - - 毛利率与交付结构
        - COGS、服务占比、云 / AI 推理成本、实施人力
        - 确认 Neara 是 SaaS 经济性，还是被服务拖累
        - 财务与产品运营复核
      - - 客户集中度
        - 按客户和地区拆分的 ARR；前五大客户占比
        - 公用事业合同可能大且集中
        - 客户清单与合同审查
      - - 股权结构与优先权
        - Series D 后所有权、清算优先权、参与权、反稀释、二级出售
        - 普通股回报取决于优先权堆栈
        - 法务审查融资文件
      - - 币种与估值证明
        - 签署文件，明确 AUD 与 USD，以及投前 / 投后估值
        - 公开独角兽报道的核心歧义
        - 律师和领投方确认
      - - 管线转化
        - 美国 / 英国 / 欧盟管线、胜率、销售周期、ACV、积压订单
        - 决定澳大利亚公用事业渗透能否在海外复现
        - 商业尽调与客户访谈
      - - 退出路径
        - 战略买家对话、投行材料、IPO 准备度、审计报表
        - 退出倍数和时点必须靠它们支撑
        - 董事会材料与投行访谈对象
    notes: 尽调索要事项刻意先看财务和法律，因为公开的产品 / 客户证据强于公开估值证据。
    claimRefs:
