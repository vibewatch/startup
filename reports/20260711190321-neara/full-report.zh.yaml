  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、价格纪律与货币口径
        blocks:
          - type: paragraph
            body: >-
              Neara 是一家令人印象深刻的品类公司，但能不能投，关键不在公司质量，而在价格。按公开的 A$1.1 billion Series D 口径，本章建议继续研究 /
              跟踪；估值姿态偏高，信心为中低。正面逻辑真实存在：Neara 有差异化的物理驱动数字孪生，Series D 由 TCV
              领投并完成验证，澳大利亚公用事业渗透很深，国际客户可点名，运营证据也显示平台能释放容量、提升韧性。问题是公开财务证据还没有跟上价格。独角兽标签还藏着货币陷阱：证据最能支持的是 A$1.1 billion，而不是
              US$1.1 billion；Neara 以澳元计是独角兽，按简单汇率折算，公司价值约 US$690-770 million。即便如此，除非尽调验证 ARR
              大得多、留存强、优先权清晰且存在高溢价退出路径，公开证据还不足以支持买入结论。
            claimRefs:
