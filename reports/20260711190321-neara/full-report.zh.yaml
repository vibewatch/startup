      - number: '1.5'
        title: 里程碑和战略轨迹
        blocks:
          - type: paragraph
            body: >
              Neara 的轨迹是从小众设计工具稳步爬升为定义品类的基础设施智能平台。公司 2016 年成立、2018 年完成种子轮、2019 年商业化，此后借 2021 年 Series A 轮、2022 年 Series
              B 轮及延展轮、2024 年 Series C 轮、2026 年 Series D 独角兽轮持续推高融资势能。商业里程碑与融资同步推进：Southern California Edison 野火缓解合作（2023
              年 9 月）、CenterPoint Energy 极端天气交易（2024 年 10 月），以及通过 ESB Networks、Scottish Power 和 Hedno 扩大欧洲足迹。


              战略上，Neara 把自己放在一股宏观顺风里：AI
              计算和数据中心、电气化、老化电网推高电力需求，同时极端天气风险加剧。管理层把产品描述为公用事业公司「拉伸容量、管理风险，并把投资投向真正重要的地方」的办法，并称希望让物理优先的数字孪生成为能源、交通和通信网络的标准理解层。


              后续章节要继续回答的开放问题包括：真实收入规模和估值韧性，创始人之外的治理与高管层深度，以及 Neara
              能否把澳大利亚近乎垄断的位置复制到监管和基础设施环境各异的美国、英国和欧洲。这些问题会在市场、财务、客户、风险和估值章节中展开。
