              反向情景不是客户造假，而是公开证明可能高估可重复性、低估商业摩擦。Neara 有很多亮眼客户名单，但尽调买方仍需要按客户拆分的
              ARR、合同开始和续约日期、平均合同价值、实施工作量、前十大客户集中度、总留存，以及按模块拆分的扩张收入。澳大利亚渗透率接近
