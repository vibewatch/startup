        - 视觉巡检数据管理和 ML 分析
        - 工作流相邻；做网络仿真需要合作伙伴数据
        - Scopito；CB Insights
      - - Sheltera
        - 植被 / 野火相邻领域
        - 非上市植被软件厂商
        - 面临野火和树木致停电风险的电力公用事业公司
