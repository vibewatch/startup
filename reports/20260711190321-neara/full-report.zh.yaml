            title: 关键电网数据让网络安全尽调不可选
            body: >-
              Neara 的公开材料强调，模型基于公用事业 LiDAR、GIS、影像和资产记录构建。这些数据未必是 SCADA 控制数据，但仍属于敏感的关键基础设施信息；因此，公用事业安全审查、NERC / FERC
              预期、NIS2 / GDPR 控制和数据驻留条款都可能成为部署关卡。
