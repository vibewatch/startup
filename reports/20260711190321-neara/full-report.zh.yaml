      - number: '6.3'
        title: 留存、耐久性和扩张动作
        blocks:
          - type: paragraph
            body: >-
              留存是客户章节最大的公开证据缺口。Neara 的部署模式强烈暗示企业使用具备耐久性：SCE 被描述为多年期，CenterPoint 在 Beryl 之后把 Neara
              整合进更大的韧性项目，澳大利亚公用事业公司似乎跨多个工作流使用平台，ESB 部署针对持续的植被和气候风险管理。不过，这些信号都不能替代
              NRR、GRR、流失、续约率、模块渗透、活跃用户数、支持满意度或队列留存。最可信的扩张动作是在单个公用事业公司内部先落地再扩张：先从洪水、野火、植被或容量释放等高紧急度用例切入，再扩展到规划、设计、加固投资、新基础设施上线和应急响应。公用事业数据、LiDAR、GIS
              和运营决策一旦依赖孪生，切换成本会抬高，这有利于扩张；但它也要求长期实施支持、与旧系统整合和采购耐心。
