      - number: '7.4'
        title: 执行缓释、监控指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              Series D 给了 Neara 资金，可招聘 AI 和 ML
              工程师并推进国际扩张，但执行风险并未消失。公开记录显示公司由创始人主导，高管层厚度、董事会构成、安全认证和续约经济性披露有限。因此，正确的尽调姿态不是二选一，而是有条件推进：只有数据室能证明经审计财务、安全控制、模型验证，以及旗舰公用事业客户可背书的续约，才继续。打破投资假设的事件应当客观：严重电网数据泄露；监管方或客户否定
              Neara 的模型输出；澳大利亚或美国旗舰账户流失或不续约；ARR 明显低于估值叙事；或有证据表明既有厂商正在靠打包方案替换成功。反过来，如果 Neara 能证明 SOC / ISO
              级控制、可复制的国际部署、清晰的 RAB / totex 商业案例，以及比创始团队更厚的管理梯队，风险仍可缓释。
