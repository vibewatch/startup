      - number: '7.2'
        title: 监管、网络安全与模型准确性风险
        blocks:
          - type: paragraph
            body: >-
              监管环境是一把双刃剑。AEMC 的 Package 2 数据中心接入规则和 AEMO 的 GPSRR
              流程，会抬高对严谨网络建模的需求；同时，它们也把可审计假设、故障穿越证据和合规就绪文档的门槛抬高。在美国，FERC 与 NERC CIP
              义务为处理大电力系统网络资产的公用事业公司设定企业安全基线；在欧洲，NIS2 和 GDPR 又加重了必要服务网络控制和个人数据方面的义务。Neara 产品会摄入 LiDAR、影像、GIS
              和资产记录；即便它是规划系统，不是调度室 SCADA 工具，数据治理和网络安全姿态也必须成为尽调重点。模型准确性同样后果重大：SCE
              的野火证据显示，尾部风险模型、数据质量和可解释性会影响缓释措施和责任叙事。因此，尽调不能只看产品演示，还要索取认证、渗透测试、模型验证记录和客户签署流程。没有公开负面头条，确实降低了已知事件风险；但证据本来就不公开的领域，尽调负担不会因此下降。
