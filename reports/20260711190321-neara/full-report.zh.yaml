  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 电网投资缺口
        - 驱动因素
        - 从现在到 2030 年
        - 公用事业公司需要软件给稀缺资本开支排优先级，并释放现有资产容量
        - 量化 Neara 如何影响资本开支递延和监管申报
      - - 接入排队与可再生能源并网
        - 驱动因素
        - 当前存在且在恶化
        - 情景工具可帮助评估承载容量、非固定接入和电网增强技术
        - 获取客户缩短接入研究周期的案例
      - - 数据中心与 AI 负荷增长
        - 驱动因素
        - 2026-2030
        - 大规模、推进快的负荷会压迫本地规划，也要求更好的网络可视性
        - 核实 Neara 目标区域的销售管线敞口
      - - 极端天气与韧性
        - 驱动因素
        - 持续
        - 野火、洪水、大风、高温和停电风险支撑风险建模预算
        - 把每个用例对应到具名公用事业公司的预算科目和避免费用证据
      - - 监管与价格管制激励
        - 混合
        - 重置周期
        - RIIO/RAB 框架既可能奖励创新，也可能让公用事业公司偏向实物资本开支
        - 审查各目标辖区对 SaaS 成本回收的处理
      - - 数据质量与集成
        - 约束
        - 部署阶段
        - GIS/LiDAR/SCADA 数据差，会拖慢模型验证和信任建立
        - 索取实施时间表、失败试点和数据清洗成本
      - - 信任、网络安全与工程验证
        - 约束
        - 采购与推广
        - 关键基础设施软件投入运营前需要大量审查
        - 审查认证、安全态势和模型保证流程
      - - 既有平台与切换成本
        - 约束
        - 扩张阶段
        - GIS/ADMS/资产管理既有厂商可以守住客户，或捆绑替代品
        - 对标与 ESRI、GE、Siemens、Bentley 及内部自建竞争时的替换记录
    notes: 驱动因素很强，但约束决定落地节奏，以及能否转化为经常性软件收入。
