  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界：三大战场，而不是一个
        blocks:
          - type: paragraph
            body: >-
              Neara 的竞争集合不应被看成一张「其他澳大利亚 AI
              初创公司」清单。买方要完成的任务更宽：帮助公用事业公司理解物理网络风险、规划电网升级、优先处理植被或韧性工作，并向监管者证明决策合理。因此形成三个战场。第一类是直接的电网建模和数字孪生对手，如 GE
              Vernova GridOS Visual Intelligence、Siemens Gridscale X、Schneider/ETAP、GridData 和 Sharper
              Shape，它们主张网络模型、数据导入、模拟或风险工作流。第二类是既有厂商和邻近玩家：Esri GIS、IBM Maximo、Hexagon、ABB、Trimble、Scopito、Unleash live 和
              Sheltera 已经位于 GIS、ADMS、EAM、巡检或植被工作流中。第三类是替代方案：人工勘测 / 维持现状，以及公用事业公司发起的自建项目，如 National Grid/Atos Triton 和
              PJM/Google/Tapestry。实际尽调问题不是「谁贴了数字孪生标签？」，而是哪款产品掌握公用事业公司的系统记录、现场数据、模拟信任和采购预算。这个框架也能避免高估缺乏电网物理的宽口径数字孪生平台，同时避免低估仍能拿下买方第一笔预算的窄口径巡检工具。竞争应按工作流逐步采用来理解，而不是静态软件品类。
