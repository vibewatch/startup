      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 网络安全 / 关键电网数据敞口
        - 安全事件、渗透测试失败，或 SOC/ISO 控制缺失
        - 重大泄露，或无法满足顶级电力公司安全审查
        - 暂停投资，直到修复和客户接受得到证明
      - - 模型准确性 / 山火责任
        - 客户或监管机构拒绝模型输出
        - 在高后果韧性或山火用例中验证失败
        - 视为美国关键风险扩张的论点破坏因素
      - - 财务不透明 / 估值缺口
        - 数据室披露 ARR 和毛利率
        - ARR 明显低于公开估值叙事，或 NRR 偏弱
        - 重新定价；除非增长证据支撑该倍数，否则回避
      - - 客户集中度
        - 旗舰电力客户流失或续约停滞
        - 重大澳大利亚或美国背书客户流失 / 不续约
        - 下调建议，并重新评估 PMF 耐久性
      - - 既有厂商捆绑
        - Bentley/GE/Siemens 在正面替换中胜出
        - 因套件捆绑或集成异议反复输单
        - 需要更锋利的切入点、渠道策略或更低进入价格
      - - RAB / totex 摩擦
        - 客户无法回收软件成本，或推迟 opex 预算
        - 多个合格交易因监管成本回收处理而延迟
        - 将更慢销售周期和更低近期 ARR 转化纳入投资测算
    notes: 否决标准刻意设为可监测事件，而不是泛泛担忧；阈值应与管理层数据室证据交叉验证。
