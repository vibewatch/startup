        - 如果 ARR 低于尽调阈值，溢价过高风险很高
      - - 估值立场
        - 偏贵
        - A$1.1B 头条估值是 AUD，且相对基准可支撑规模仍有溢价
        - 需要 A$75-100M ARR 或异常强的留存，才能称为合理
      - - 决策含义
        - 价格纪律型观察名单
