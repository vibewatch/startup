      - number: '8.3'
        title: 牛 / 基准 / 熊区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              因此，情景分析把 ARR / 收入规模作为主要敏感项，而不是把 Series D 价格当作中点。熊市情景只假设远期收入 A$20 million、倍数 8x，对应 A$160 million
              估值，并带来严重降估值融资风险。基准情景假设远期收入 A$50 million、私营市场溢价倍数 12x，对应 A$600 million，仍低于公开口径。只有 ARR / 收入接近 A$75 million 到
              A$100 million，或战略收购方愿意给出稀缺电网 AI 溢价，当前 A$1.1 billion 价格在算术上才更容易防守。牛市情景按 A$100 million、15x 可达 A$1.5
              billion，提供上行，但需要公开来源没有给出的证据：净收入留存、毛利率、客户集中度、销售管线转化，以及多区域可复制性。正确的 IC
              姿态，是承销一个取决于尽调的价格，而不是承销公开口径；在律师审阅的源文件中厘清经审计收入质量、合同耐久性、续约分组、法律条款和优先权经济，并获得客户签字确认来支撑管理层增长叙事之前，任何二级市场加价都不可投。
