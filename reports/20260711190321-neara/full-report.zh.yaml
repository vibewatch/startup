chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和商业模式
        blocks:
          - type: paragraph
            body: >
              Neara 是一家总部在悉尼的基础设施软件公司，注册名为 LineSoft Pty Ltd，运营地点在新南威尔士州的 Redfern。它构建「物理驱动数字孪生」——也就是整个基础设施网络的高精度几何 3D
              模型，核心是电网，能够复现每根电杆、导线和结构在真实地形、天气、负载和植被条件下的表现。Neara
              不像启发式或统计型规划工具，而是把每次模拟都落在工程级物理上，让公用事业公司用风、冰、热、洪水和野火情景压测资产，并在不新建基础设施的情况下找出隐藏的网络容量。


              成立时间在公开来源中并不一致：Neara 自有材料、SmartCompany、Tracxn 和 Kurrant 写的是 2016 年，Forbes Australia 写的是 2019 年，TechCrunch
              则称 2019 年商业化发布。最稳妥的读法是，公司 2016 年成立，约在 2019 年商业化发布产品。起源故事是，联合创始人 Daniel Danilatos 曾是 Google
              工程师，他为解决妻子在电力线路设计中的痛点做了一个工具，后来演进成网络级建模平台。


              商业模式是企业级 SaaS：与电力公用事业公司和网络运营商签订多年订阅及平台协议。Neara 导入客户现有的 LiDAR、影像、GIS
              和资产记录，搭建数字孪生，再围绕模拟、风险、植被管理和容量工作流收费。客户付费购买分析能力，把原本数月的人工现场勘测压缩为数小时或数天内交付的建模。
