        - 全球工业软件厂商
        - 输配电公用事业公司、规划人员、运营人员
        - 统一电网运营平台，带 AI 输电规划
        - 套件覆盖面强；需要按模块和公用事业客户验证产品证据
        - Siemens 产品；Siemens 新闻稿
      - - ABB / Enline
        - 电网自动化既有厂商 + 创业公司投资
        - ABB 既有厂商；据 Tracxn，Enline 为 Series A
        - 寻求电网容量和数字孪生分析的公用事业公司
        - 通过投资路径布局 AI 驱动 / 多物理场电网数字孪生
        - 更像收购 / 合作威胁信号，而不是 ABB 独立产品已清晰
        - ABB；Enline；Tracxn
      - - Schneider Electric / ETAP
        - ADMS 和电气工程既有厂商
        - 全球能源管理厂商
        - 配电公用事业公司和关键基础设施
        - EcoStruxure ADMS + ETAP 基于物理的设计到运营孪生
        - 可能是最接近的既有物理建模捆绑方案；集成深度待验证
