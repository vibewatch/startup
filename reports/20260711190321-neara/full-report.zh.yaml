  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分和覆盖
        blocks:
          - type: paragraph
            body: >-
              Neara
              的付费受众异常集中：运营大型物理电网的受监管电力网络公用事业公司和基础设施业主。买方通常是公用事业高管、网络规划负责人、资产管理负责人、植被或韧性团队，或创新职能；用户是工程师、规划人员、应急响应团队和现场运营经理；付款方是电网公用事业公司或输电
              / 配电业主。公开证据指向深厚的澳大利亚基础，Neara 多次称自己服务接近 90% 的澳大利亚电网公用事业公司，包括 Essential Energy、Endeavour
              Energy、Ausgrid、AusNet、Powercor 和 SA Power Networks。这种渗透率是优势，因为它验证了 Neara
              本土市场的品类，并形成高密度客户背书；但它也意味着澳大利亚增量增长可能受饱和限制，更多来自账户扩张而非新增客户获取。国际基础较小但战略重要：美国的 SCE 和 CenterPoint、爱尔兰的 ESB
              Networks、英国的 Scottish Power、希腊的 Hedno 表明，这套工作流可以迁移到不同监管和气候风险环境。
