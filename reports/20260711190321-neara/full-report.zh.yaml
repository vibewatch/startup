  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Neara 向公用事业公司销售企业级平台，把现有网络记录转成物理驱动 3D 数字孪生，再用这个孪生更快做运营决策。客户任务不只是看地图：公用事业公司把 LiDAR、影像、GIS 和资产记录交给
              Neara；Neara
              标准化并质检数据；工程师随后跑洪水、风、冰、植被侵入、换导线或新馈线设计等情景；输出变成加固计划、可供监管者审阅的报告、基于状态的巡检项目和现场可执行工单。洪水和野火部署最能看清这套工作流。Murray
              河洪水期间，SA Power Networks 用孪生判断线路何时会突破安全净距；SCE 则在 50,000 平方英里服务区内用平台做植被和野火风险分析。因此 Neara
              定位不是通用地理空间查看器，而是服务资产经理、规划人员、风险团队、控制室和现场班组的决策支持系统。
            claimRefs:
