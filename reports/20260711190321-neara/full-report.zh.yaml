              融资能力是 Neara 最强的财务信号。2026 年 2 月 Series D 轮融资 A$90 million，由 TCV 领投，Partners Group、EQT、Square Peg 和 Skip
              参投，披露累计融资提高到约 A$180 million。这给公司相当现金跑道，用于招聘 AI
              工程师和商业扩张，但在没有期初现金、月度净烧钱额、营运资本时点，以及任何客户预付款或债务条款之前，无法承销实际缓冲垫。一个粗略情景显示，新一轮融资可支撑公司以每年 A$20-40 million
              的烧钱额运营数年，但这是推断，不是事实。因此结论是带数据室继续跟踪：Neara 拥有足够资本和高质量投资方去执行，但估值压在不透明收入质量、未验证单位经济，以及必须在新一轮定价前厘清的币种 / 估值歧义上。
