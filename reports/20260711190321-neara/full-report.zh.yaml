  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - Neara
      - 直接电网孪生对手
      - 既有 OT/GIS/EAM 套件
      - 巡检 / 植被相邻领域
      - 影响
    rows:
      - - 建模保真度
        - 物理驱动的 3D 电网模型
        - Schneider/ETAP 和 ABB/Enline 也主张物理或多物理场；GE/Siemens 的电网孪生更宽
        - GIS/EAM 既有厂商建模资产，但不一定建模工程应力源
        - 主要是图像 / LiDAR 分析
        - Neara 的公开物理建模证据最强，但既有厂商的物理能力缺口在收窄
      - - 数据摄取
        - LiDAR、GIS、影像和资产记录
        - GE 使用 GIS + 高分辨率视觉数据；GridData 使用测量数据
        - Esri 掌握网络 GIS；IBM/Hexagon 掌握资产记录
        - Sharper/Trimble/Sheltera/Scopito/Unleash 摄取影像 / LiDAR
        - 能否接入公用事业数据资产，才是真正的切换成本战场
      - - 仿真覆盖面
        - 风、冰、热、洪水、植被、换导线、新建工程
        - Siemens/GE/Schneider 提供规划和运营模块
        - ADMS/EAM 覆盖运营和资产健康
        - 主要覆盖植被、巡检缺陷或气候韧性
        - 相比窄工具，Neara 覆盖更宽；但套件在运营覆盖面上领先
      - - 部署速度
        - 小时 / 天级；ESB 两周，相比手工数月
        - 证据因厂商而异；项目部署往往定制化
        - 既有厂商有装机基础，但实施可能很重
        - 巡检工具在窄工作流上可能部署更快
        - Neara 必须让上线速度持续快于既有模块推广
      - - 地域
        - 澳大利亚、美国、英国 / 爱尔兰、欧洲；覆盖约 90% 澳大利亚网络公用事业
        - 既有厂商全球化；GridData/Sharper 公开足迹更窄
        - 上市既有厂商和 Esri 全球覆盖
        - 因厂商而异；许多只覆盖特定区域
        - 国际复制是守住估值的关键
      - - 定价模式
        - 企业定制定价未公开披露
        - 多为企业定制或报价制
        - 通常是套件或企业协议
        - 模块 / 项目定价普遍不透明
        - 尽调需要真实合同的单位经济性
      - - 信任 / 监管态势
        - 具名公用事业成果和物理建模依据
        - 既有厂商带来控制室和合规可信度
        - 借现有系统拿到最高采购信任
        - 巡检输出可能需要工程签署
        - Neara 必须证明决策能被监管接受，而不只是分析
      - - 合作伙伴 / 渠道触达
        - 直接企业 SaaS + 公用事业合作伙伴
        - GE/Siemens/Schneider/ABB 拥有大型渠道
        - GIS/EAM/ADMS 渠道根基很深
        - 巡检厂商依赖试点和集成
        - 面对既有厂商，分销风险很实质
