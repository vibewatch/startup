            body: >-
              公开证据不足以支持精确的按资产或按公里定价比较。已审阅的产品页面多指向企业销售动作、演示或平台定位，而不是自助式标价。这个不透明度很重要，因为买方是受监管公用事业公司，安全、整合和采购周期都很长。Bentley、GE
