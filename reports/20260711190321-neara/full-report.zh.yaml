  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象 / 基准
      - 指标
      - 倍数 / 估值状态
      - Neara 参照意义
      - 局限
    rows:
      - - Neara 头条估值
        - A$1.1B / A$10.4M（2024 年收入估算）
        - ~106x 往绩收入
        - 直接暴露估值拉伸问题
        - 收入估算来自第三方，置信度低
      - - Neara 敏感性
        - A$1.1B / A$20M（假设当前收入）
        - ~55x 收入
        - 检验 2024 年以来的增长能否修复估值问题
        - A$20M 是假设值，公司未披露
      - - Bentley Systems
        - TTM 收入 $1.56B；P/S 6.38；ARR $1.4945B
        - ~6.4x 销售倍数标尺
        - 最接近的上市基础设施工程软件可比公司
        - 规模大得多，已上市、盈利，业务更多元
      - - Autodesk
        - EV $43.43B / TTM 收入 $7.51B
        - ~5.8x EV/收入
        - 设计与工程软件上市可比公司
        - 产品套件更宽，上市公司规模更成熟
      - - Trimble
        - EV $13.49B / TTM 收入 $3.69B
        - ~3.7x EV/收入
        - 地理空间 / 基础设施技术可比公司
        - 软硬件混合，增长更慢
      - - 设计与工程软件篮子
        - 2026 年 7 月 NTM EV/收入
        - 4.6x
        - 工程软件公开品类基准
        - 样本篮并非电网专属，也未按未上市公司增长调整
      - - 未上市 AI 原生 SaaS
        - ARR 倍数区间
        - 7-20x ARR，取决于增长
        - Neara AI 基础设施溢价的最佳情形框架
        - 需要验证增长、NRR、利润率和 ARR 质量
      - - 未上市 SaaS 中位数
        - ARR 倍数区间
        - 3-7x ARR；中位数 ~4.5x
        - 对规模不足的未上市软件公司不利的基准
        - 中小型 SaaS 市场可能低估稀缺战略资产
    notes: 可比对象只是一组样本，并不穷尽。各行采用本章获取的公开数据和基准报告；Neara 收入为估算值，未经审计。
    enumerationScope:
