  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发项
      - 门槛 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 不达标
        - 当前 ARR 或收入低于 A$20M
        - 确认收入倍数达 55x+，商业化仍不到规模
        - 回避，或要求大幅重置
      - - 留存薄弱
        - NRR 低于 110%
        - 高端 SaaS 倍数撑不住
        - 没有价格保护就不买入
      - - 利润率薄弱
        - 毛利率低于 70%
        - AI / 服务成本结构削弱 SaaS 溢价
        - 按更低软件倍数重新定价
      - - 集中度风险
        - 最大客户超过 ARR 的 25%
        - 公用事业客户验证反而变成集中度风险
        - 要求折价和客户多元化计划
      - - 币种错配
        - 投资者文件暗示头条估值存在 USD 混淆
        - 头条估值和回报测算不可靠
        - 融资证明对齐前暂停
      - - 结构化 / 下调估值轮
        - 新融资低于 A$1.1B，或附带重优先权
        - 确认估值过高和优先权压力
        - 回避普通股敞口
      - - 管线延迟
        - 美国 / 欧洲管线 12 个月内未能转化
        - 澳大利亚验证无法在国际市场复现
        - 仅跟踪，直到证明可复现
    notes: 这些触发项是尽调门槛，不是公开事实；它们把估值立场转成可监控的投委会动作。
    claimRefs:
