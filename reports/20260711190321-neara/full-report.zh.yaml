          - type: callout
            title: 国际扩张是关键增长测试
            body: 澳大利亚渗透率接近 90%，验证了产品，但可能限制国内新增客户增长；价值创造问题是，SCE、CenterPoint、ESB、Scottish Power 和 Hedno 能否转化为可重复的海外扩张。
