  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和确认口径
        blocks:
          - type: paragraph
            body: >-
              Neara
              看起来是把企业级基础设施软件卖给受监管公用事业公司和基础设施业主，而不是用量型市场或硬件业务。官方平台页面要求买方预约定制演示，而不是展示标价；产品工作流从客户数据导入、数字孪生生成、情景模拟，到可供监管者审阅的行动建议。这指向定制化年度或多年平台合同，定价很可能取决于网络规模、模块和部署复杂度。公开来源不披露
              ARR、ACV、合同期限、续约率、实施费或专业服务占比。因此收入质量结论是混合的：买方痛点关键，产品能触达许多工作流；但收入确认可能包含前期模型构建或服务成分，在管理层提供合同
              ARR、递延收入和服务毛利率之前，纯 SaaS 可比性会被压低。
