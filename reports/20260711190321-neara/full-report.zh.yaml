      - number: '2.3'
        title: 增长驱动：电网瓶颈、数据中心和韧性
        blocks:
          - type: paragraph
            body: >-
              宏观拉力异常强。IEA 的 Electricity 2026 分析称，超过 2,500 GW 的可再生能源、储能和大型负荷项目卡在电网队列里，年度电网投资必须从今天约 USD 400 billion 提高约
              50%，到 2030 年达到约 USD 600
              billion。这会把公用事业公司推向能在缓慢物理升级到来之前释放现有网络容量的工具。数据中心让问题更紧，因为它们一到三年就能建成，而新电网可能要五到十五年。澳大利亚证据对 Neara 尤其相关：AEMC 提出
              2026 年大型数据中心负荷标准；Clayton Utz、pv magazine Australia、Fitch、EY、USSC 和 Modo
              都把数据中心需求视为本地电网规划挑战。极端天气、野火、洪水和韧性义务又提供了另一条持久采用驱动，因为数字孪生承诺更快做情景分析，也更准投放稀缺 资本开支。
