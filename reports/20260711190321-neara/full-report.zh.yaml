  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险登记视角和排序逻辑
        blocks:
          - type: paragraph
            body: >-
              Neara
              的风险画像不是某一个致命缺陷，而是一条从电网监管传导到采购、安全、证据质量、收入确认节奏和估值的链条。最严重的风险，是软件错误或控制缺口可能影响关键电力基础设施的环节：澳大利亚改革下的监管证据、美国和欧盟的网络安全
              / 隐私义务，以及野火或韧性决策中的模型准确性。下一层是商业风险：澳大利亚公用事业客户集中，Bentley、GE Vernova、Siemens 等既有厂商可以打包销售，公用事业销售周期长，RAB / totex
              处理也可能拖慢经常性软件预算。最后，财务不透明、AUD 与 USD 估值口径、创始人主导执行不是产品风险，却决定 Series D 估值背后证据是否足够。因此，本章不用泛泛的
              SWOT，而采用风险登记册框架：发生概率、严重性、缓释成熟度、剩余敞口，以及可监控的否决标准。这一排序有意把下行后果置于公开争议之上，因为关键基础设施软件往往很安静，直到客户安全审查、监管申报或极端天气事件暴露控制短板。
