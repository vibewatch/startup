chapter:
  number: 7
  title: Risks
  summary: 'Neara''s main risks are not demand absence but proof burden: grid-regulatory evidence, critical-data security,
    model accuracy, customer concentration, incumbent bundling, financial opacity, and valuation ambiguity. The risk posture
    is investable only if data-room diligence validates security controls, model acceptance, retention, audited financials,
    and a repeatable international execution bench.'
sections:
- id: risk-register-overview
  title: Risk Register View and Ranking Logic
  body: 'Neara''s risk profile is not a single existential flaw; it is a transmission chain from grid regulation into procurement,
    security, evidence quality, revenue timing, and valuation. The highest-severity items are those where a software error
    or missing control could affect critical electricity infrastructure: regulatory evidence under Australian reforms, US
    and EU cybersecurity/privacy obligations, and model accuracy in wildfire or resilience decisions. The next tier is commercial:
    customer concentration in Australian utilities, incumbent bundling by Bentley, GE Vernova, and Siemens, long utility sales
    cycles, and RAB/totex treatment that can slow recurring software budgets. Finally, financial opacity, AUD-versus-USD valuation
    framing, and founder-led execution are not product risks but determine whether the Series D valuation has enough proof
    behind it. The chapter therefore uses a risk-register frame: likelihood, severity, mitigation maturity, residual exposure,
    and monitorable kill criteria rather than a generic SWOT list. This ranking intentionally weights downside consequence
    more than public controversy because critical-infrastructure software can be quiet until a customer security review, regulator
    filing, or extreme-weather event exposes the weak control.'
