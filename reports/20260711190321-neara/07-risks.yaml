  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: Complete counsel-reviewed mapping of every license, data-protection, grid-security, customer-contract,
      export-control, and liability obligation across Neara's active jurisdictions.
    whyItMatters: The public risk register is a severity-ranked sample; private contracts and jurisdiction-specific deployments
      could reveal additional legal obligations or indemnities.
    diligencePath: Request outside-counsel memo, customer security addenda, DPAs, and jurisdiction-by-jurisdiction compliance
      matrix.
    relatedQuestionRefs:
    - QR001
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: security certifications and incidents
    missingEvidence: SOC 2, ISO 27001, penetration-test reports, security architecture, incident register, subprocessor list,
      and data-residency commitments.
    whyItMatters: Critical-grid-data deployments can be delayed or blocked if enterprise security controls are weaker than
      utility expectations.
    diligencePath: Run security diligence with CISO; review certification scope, pen-test remediation, and incident response
      records.
    relatedQuestionRefs:
    - QR008
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: audited financials and retention
    missingEvidence: Audited P&L, ARR, gross margin, burn, NRR/GRR, customer concentration, contract values, renewal history,
      and pipeline conversion by geography.
    whyItMatters: The A$1.1B valuation cannot be underwritten from public revenue estimates and customer logos alone.
    diligencePath: Request data-room financials, cohort retention, top-customer schedule, and board-approved operating plan.
    relatedQuestionRefs:
    - QR010
    - QR024
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: model validation evidence
    missingEvidence: Independent validation results for Neara model outputs in wildfire, flood, resilience, and large-load
      connection use cases, including false positive/negative rates and audit logs.
    whyItMatters: Model risk can transmit into safety, liability, customer trust, and regulator acceptance.
    diligencePath: Obtain validation packets from flagship utilities and interview customer engineering owners.
    relatedQuestionRefs:
    - QR016
    - QR017
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: minor
    topic: people and succession
    missingEvidence: Detailed org chart, board composition, founder succession plan, leadership hiring pipeline, and retention
      plan for AI/ML and implementation teams.
    whyItMatters: A founder-led profile can be an advantage, but global scaling requires repeatable management depth.
    diligencePath: Interview CEO, CCO/COO, CPO, CFO/finance lead, security owner, and regional commercial heads.
