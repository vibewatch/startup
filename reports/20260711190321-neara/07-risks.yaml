- id: regulatory-cyber-model-risk
  title: Regulatory, Cybersecurity, and Model-Accuracy Risks
  body: 'The regulatory environment is a two-edged sword. AEMC''s Package 2 data-centre connection rule and AEMO''s GPSRR
    process increase demand for rigorous network modelling, but they also raise the bar for auditable assumptions, disturbance
    ride-through evidence, and compliance-ready documentation. In the US, FERC and NERC CIP obligations create an enterprise-security
    baseline for utilities that handle bulk-system cyber assets, while NIS2 and GDPR increase European obligations around
    essential-service cyber controls and personal data. Neara''s product ingests LiDAR, imagery, GIS, and asset records; that
    makes its data governance and cybersecurity posture diligence-critical even if it is a planning system rather than a control-room
    SCADA tool. Model accuracy is similarly high-consequence: SCE wildfire evidence shows that tail-risk models, data quality,
    and explainability can influence mitigation and liability narratives. Diligence should therefore request certifications,
    penetration tests, model-validation records, and customer sign-off processes, not just product demos. The absence of public
    adverse headlines therefore lowers known-incident risk, but it does not lower diligence burden where evidence is private
    by design.'
  claimRefs:
