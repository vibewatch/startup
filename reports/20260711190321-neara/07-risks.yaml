callouts:
- calloutType: risk
  title: Critical-grid data makes cybersecurity diligence non-optional
  body: Neara's public materials emphasize model-building from utility LiDAR, GIS, imagery, and asset records. That data may
    not be SCADA control data, but it is still sensitive critical-infrastructure information, so utility security reviews,
    NERC/FERC expectations, NIS2/GDPR controls, and data-residency terms can become deployment gates.
  claimRefs:
  - CR007
  - CR009
  - CR010
  - CR012
  - CR013
- calloutType: insight
  title: Regulation is both catalyst and drag
  body: AEMC/AEMO reforms can increase demand for auditable grid simulation, especially around large data-centre loads and
    resilience reviews. The same reforms can slow procurement if customers must wait for final standards, connection studies,
    or regulator-acceptable evidence packages.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR037
- calloutType: assumption
  title: No public scandal is not equivalent to low risk
  body: 'Public searches did not surface a prominent Neara lawsuit, enforcement action, breach, outage, or customer complaint
    pattern. The remaining diligence gap is private: customer contracts, incident records, certifications, model-validation
    files, and audited financials are needed before treating the residual risk as low.'
  claimRefs:
  - CR014
  - CR035
  - CR040
  - CR042
