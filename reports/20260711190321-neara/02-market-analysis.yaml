- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Grid investment gap
    - Driver
    - Now through 2030
    - Utilities need software that prioritizes scarce capex and unlocks capacity from existing assets
    - Quantify how Neara affects capex deferral and regulatory filings
  - - Connection queues and renewable integration
    - Driver
    - Current and worsening
    - Scenario tools can help assess hosting capacity, non-firm connections, and grid-enhancing technologies
    - Obtain customer examples of connection-study acceleration
  - - Data-centre and AI load growth
    - Driver
    - 2026-2030
    - Large, fast-moving loads create local planning pressure and demand better network visibility
    - Verify pipeline exposure in Neara target regions
  - - Extreme weather and resilience
    - Driver
    - Persistent
    - Wildfire, flood, wind, heat, and outage risk support risk-modelling budgets
    - Tie each use case to named utility budget line and avoided-cost evidence
  - - Regulatory and price-control incentives
    - Mixed
    - Reset cycles
    - RIIO/RAB frameworks can either reward innovation or bias utilities toward physical capex
    - Review cost-recovery treatment for SaaS in each target jurisdiction
  - - Data quality and integration
    - Constraint
    - Deployment stage
    - Bad GIS/LiDAR/SCADA data slows model validation and trust
    - Request implementation timelines, failed pilots, and data-cleaning costs
  - - Trust, cybersecurity, and engineering validation
    - Constraint
    - Procurement and rollout
    - Critical infrastructure software requires extensive review before operational use
    - Review certifications, security posture, and model assurance process
  - - Incumbent platforms and switching costs
    - Constraint
    - Expansion stage
    - GIS/ADMS/asset-management incumbents can defend accounts or bundle substitutes
    - Benchmark displacement history versus ESRI, GE, Siemens, Bentley, and internal build
  notes: Drivers are strong, but constraints determine timing and conversion into recurring software revenue.
