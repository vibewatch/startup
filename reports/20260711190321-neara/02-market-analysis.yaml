callouts:
- calloutType: insight
  title: Do not value Neara on generic digital-twin TAM
  body: The broad digital-twin market is tens of billions of dollars in 2026, but Neara’s relevant lens is the much narrower
    grid, utility, electrical, and energy-power software spend. The investable question is how much of the USD 0.67-1.6B narrow
    lens can become recurring utility platform revenue.
  claimRefs:
  - CM004
  - CM007
  - CM008
  - CM009
  - CM012
  - CM013
- calloutType: strength
  title: Macro demand drivers are unusually strong
  body: IEA grid bottlenecks, 2,500 GW of queued projects, data-centre load growth, and Australia’s 2026 connection-standard
    reforms all create a credible adoption pull for grid-digital-twin tooling.
  claimRefs:
  - CM014
  - CM015
  - CM018
  - CM020
  - CM023
- calloutType: risk
  title: Regulated utility buying can still be slow
  body: Even when the grid problem is urgent, utilities need regulatory recovery, model trust, cybersecurity review, data
    integration, and engineering validation. These factors can stretch sales cycles and delay revenue conversion.
