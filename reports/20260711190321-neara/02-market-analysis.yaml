- id: growth-drivers
  title: 'Growth Drivers: Grid Bottlenecks, Data Centres, and Resilience'
  body: 'The macro pull is unusually strong. IEA’s Electricity 2026 analysis says more than 2,500 GW of renewable, storage,
    and large-load projects are stuck in grid queues, and annual grid investment must rise by about 50% from roughly USD 400
    billion today to about USD 600 billion by 2030. That pushes utilities toward tools that can unlock capacity from existing
    networks before slow physical upgrades arrive. Data centres intensify the problem because they can be built in one to
    three years while new grids may take five to fifteen years. Australian evidence is especially relevant for Neara: AEMC
    proposed 2026 standards for large data-centre loads; Clayton Utz, pv magazine Australia, Fitch, EY, USSC, and Modo all
    frame data-centre demand as a local grid-planning challenge. Extreme weather, wildfire, floods, and resilience obligations
    add another durable adoption driver because a digital twin promises faster scenario analysis and better targeting of scarce
    capex.'
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
