tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Neara
  rows:
  - - Grid digital twin
    - Network topology, asset modelling, dynamic rating, capacity and reliability simulations
    - Generic IoT dashboards and enterprise visualization not tied to grid physics
    - Distribution and transmission network operators
    - Closest category and narrowest defensible TAM lens
  - - Utilities digital twin solutions
    - Utility asset-health, outage, vegetation, resilience, and planning software
    - Water/gas-only utility twins and customer-service analytics
    - Regulated utilities and network asset managers
    - Useful SAM proxy but may include non-electric utilities
  - - Electrical digital twin
    - Electrical-system simulation, predictive maintenance, power-flow and equipment twins
    - Manufacturing product twins and mechanical plant simulation
    - Utilities, industrial power owners, OEMs
    - Adjacent lens that may include non-utility industrial spend
  - - Energy and power digital twin
    - Generation, grid, renewable, storage, and power-asset twins
    - Oil and gas production twins outside electricity workflows
    - Utilities, IPPs, grid operators, energy asset managers
    - Broad upper-bound lens for electricity-adjacent spend
  - - Status quo / substitutes
    - Manual field surveys, GIS/SCADA exports, engineering consultants, spreadsheet capacity studies
    - No software purchase or incumbent platform lock-in
    - Utility planning and operations budgets
    - Sets adoption hurdle and ROI proof burden
  notes: Boundary uses market-report categories, not Neara management guidance; excluded spend prevents broad digital-twin
    inflation.
