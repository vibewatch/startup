  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing estimate conflict
    missingEvidence: A bottom-up, utility-budget-based SAM that reconciles generic digital twin, grid digital twin, utilities
      digital twin, electrical digital twin, and energy-power digital twin definitions.
    whyItMatters: Published estimates differ by an order of magnitude depending on boundary, so using the wrong TAM can materially
      overstate Neara’s valuation support.
    diligencePath: Build a bottom-up model by region using number of regulated network operators, addressable assets, contract
      ACV, renewal assumptions, and attach-rate by workflow.
    relatedQuestionRefs:
    - QM009
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: Neara SOM and revenue conversion
    missingEvidence: Neara ARR, pricing, deployment ACV, win/loss rate, pipeline by geography, and expansion/renewal metrics.
    whyItMatters: Without company-specific commercial metrics, public market size cannot be translated into obtainable revenue
      or valuation support.
    diligencePath: Request ARR bridge, customer cohort expansion, pipeline by segment, and product/module pricing from the
      data room.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: missing-source
    severity: material
    topic: utility budget owner validation
    missingEvidence: Primary procurement documents or customer interviews confirming exact budget owners and approval committees
      for Neara-like purchases.
    whyItMatters: Buyer segmentation is inferred from workflows and regulation; misidentifying the payer would distort sales-cycle
      and GTM assumptions.
    diligencePath: Interview Australian and US utility customers; request procurement org charts and statement-of-work approval
      paths.
    relatedQuestionRefs:
    - QM011
    - QM013
  - type: missing-source
    severity: minor
    topic: data standards and interoperability
    missingEvidence: Customer-specific evidence on GIS/SCADA/ADMS interoperability, data model standards, and actual switching
      cost after deployment.
    whyItMatters: Integration friction can turn a large TAM into a slow replacement market dominated by incumbents.
    diligencePath: Review implementation post-mortems, integration architecture, and partner ecosystem references.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
