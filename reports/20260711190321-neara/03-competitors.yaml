- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence signal
  - Mitigation / diligence ask
  rows:
  - - Physics-enabled 3D simulation
    - Schneider/ETAP and ABB/Enline add physics or multi-physics twins
    - High
    - Incumbent physics announcements and investments
    - Verify model accuracy, engineering sign-off, and whether Neara has proprietary calibration data
  - - Fast deployment vs manual surveys
    - Incumbent modules or system integrators may automate similar workflows
    - Medium
    - Siemens AI planning; National Grid/Atos Triton
    - Benchmark onboarding time and services burden across three recent customers
  - - Australian utility coverage
    - International markets may be controlled by incumbents and local system integrators
    - Medium
    - Neara ~90% AU coverage versus global incumbent scale
    - Track US/Europe win rate, renewal expansion and referenceability
  - - Data network effects
    - GIS/ADMS/EAM systems remain source-of-record and can limit data access
    - High
    - Esri, Schneider, IBM and Hexagon control adjacent data layers
    - Review integration rights, exportability, and customer data ownership clauses
  - - Workflow expansion across risk, capacity and resilience
    - Narrow inspection/vegetation tools can win budget one workflow at a time
    - Medium
    - Sharper, Trimble, Unleash, Scopito and Sheltera focus on imagery/vegetation
    - Check attach rate from one use case to multi-workflow platform rollouts
  - - Utility trust and regulatory defensibility
    - Large utilities may build bespoke AI planning systems with hyperscalers
    - High
    - PJM/Google/Tapestry and National Grid/Atos Triton
    - Ask for regulatory filings, audit trails, and evidence that outputs support approved capital plans
  notes: Severity is an underwriting judgment based on public evidence; it should be recalibrated with win/loss data, contract
    terms and customer references.
