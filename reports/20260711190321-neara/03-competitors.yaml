- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Neara
  - Direct grid-twin rivals
  - Incumbent OT/GIS/EAM suites
  - Inspection / vegetation adjacencies
  - Implication
  rows:
  - - Modeling fidelity
    - Physics-enabled 3D grid model
    - Schneider/ETAP and ABB/Enline also claim physics or multi-physics; GE/Siemens broader grid twins
    - GIS/EAM incumbents model assets but not always engineering stressors
    - Mostly image/LiDAR analytics
    - Neara has strongest explicit physics proof, but incumbent physics gap is closing
  - - Data ingestion
    - LiDAR, GIS, imagery and asset records
    - GE uses GIS + high-resolution visual data; GridData uses measurement data
    - Esri owns network GIS; IBM/Hexagon asset records
    - Sharper/Trimble/Sheltera/Scopito/Unleash ingest imagery/LiDAR
    - Integration with utility data estate is the real switching-cost battleground
  - - Simulation breadth
    - Wind, ice, thermal, flood, vegetation, reconductoring, new builds
    - Siemens/GE/Schneider offer planning and operations modules
    - ADMS/EAM cover operations and asset health
    - Mostly vegetation, inspection defects or climate resilience
    - Neara leads breadth vs narrow tools, but suites lead operations breadth
  - - Deployment speed
    - Hours/days; ESB two weeks vs months manually
    - Evidence varies by vendor; project deployments often bespoke
    - Incumbents have installed base but implementations can be heavy
    - Inspection tools may deploy faster for narrow workflows
    - Neara must keep onboarding faster than incumbent module rollouts
  - - Geography
    - Australia, US, UK/Ireland, Europe; ~90% AU network utility coverage
    - Incumbents global; GridData/Sharper narrower public footprint
    - Public incumbents and Esri have global coverage
    - Mixed by vendor; many region-specific
    - International replication is key to defending valuation
  - - Pricing model
    - Enterprise custom pricing not publicly disclosed
    - Mostly enterprise custom or quote-based
    - Often suite or enterprise agreements
    - Module/project pricing generally opaque
    - Diligence needs actual contract unit economics
  - - Trust/regulatory posture
    - Named utility outcomes and physics rationale
    - Incumbents bring control-room and compliance credibility
    - Highest procurement trust through existing systems
    - Inspection outputs may need engineering sign-off
    - Neara must prove regulator-acceptable decisions, not just analytics
  - - Partner/channel access
    - Direct enterprise SaaS plus utility partners
    - GE/Siemens/Schneider/ABB have large channels
    - GIS/EAM/ADMS channels entrenched
    - Inspection vendors rely on pilots and integrations
    - Distribution risk is material against incumbents
  notes: Cells are evidence-backed ordinal comparisons, not lab benchmarks; unsupported price and performance cells are explicitly
    marked as opaque or evidence-varies.
