- id: pricing-and-distribution
  title: 'Pricing, Distribution, and Trust: Enterprise Procurement Favors Incumbents'
  body: 'Public evidence does not support a precise price-per-asset or price-per-kilometre comparison. The reviewed product
    pages mostly point to enterprise sales motions, demos or platform positioning rather than self-serve list pricing. That
    opacity matters because the buyer is a regulated utility with long security, integration and procurement cycles. Bentley,
    GE Vernova, Siemens, Schneider Electric, IBM and Hexagon can bundle grid-twin, ADMS, GIS, EAM, cybersecurity and support
    into broader enterprise agreements; they also bring balance-sheet credibility and existing procurement channels. Neara’s
    counterweight is quantified utility outcomes: hours-or-days modelling, ESB’s two-week insight cycle versus three to four
    months manually, and company-cited faster outage-risk and restoration metrics. The pricing diligence ask is to obtain
    actual Neara contract units and renewal mechanics, then compare them with the avoided field-survey, outage, vegetation
    and planning costs rather than with generic digital-twin subscription prices.'
  claimRefs:
  - CP003
  - CP004
  - CP007
  - CP033
  - CP038
  - CP040
  tableRefs:
  - TP003
- id: moat-and-adverse-risks
  title: 'Moat Durability: Strong Data-Physics Wedge, Real Bundling and Build Risks'
  body: Neara’s moat looks strongest when a utility has enough network data to build a high-fidelity twin but lacks the internal
    physics software and workflow automation to turn it into rapid decisions. The wedge compounds if Neara becomes trusted
    by planning, resilience, vegetation and regulatory teams and if customer data improves model quality over time. The adverse
    case is also concrete. Schneider/ETAP and ABB/Enline show that incumbents can partner into physics-based twins; Siemens
    and GE are adding AI planning and grid-orchestration layers; and National Grid/Atos plus PJM/Google/Tapestry show that
    major utilities can sponsor bespoke platforms with large technology partners. The resulting underwriting posture is “differentiated
    but not unassailable.” Neara needs proof that deployments expand across workflows, survive integration with incumbent
    systems, and renew on outcomes rather than novelty. Without that, the category can fragment into bundled modules, GIS
    extensions, inspection tools and internal builds.
  claimRefs:
  - CP013
  - CP026
  - CP027
  - CP035
