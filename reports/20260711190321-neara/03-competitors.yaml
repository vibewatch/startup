  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor profile table coverage
    missingEvidence: A complete census of every global utility digital-twin, inspection, GIS, ADMS and internal-build project
      active in 2026.
    whyItMatters: The table is intentionally representative; a long tail of local system integrators and niche inspection
      vendors could change win/loss dynamics in specific geographies.
    diligencePath: Request Neara win/loss lists by geography, compare with utility procurement records, and expand the vendor
      scan during customer diligence.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing and packaging comparison
    missingEvidence: Actual Neara and competitor contract values, price metrics, services components, discounts, renewal uplift
      and implementation costs.
    whyItMatters: Public pages do not disclose realized pricing, so ROI and competitive displacement risk cannot be underwritten
      from list prices.
    diligencePath: Review Neara MSAs, renewal schedules and SOWs; ask reference customers what incumbent modules or internal
      projects were displaced.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: competitive win loss evidence
    missingEvidence: Customer-verified win/loss evidence against GE, Siemens, Schneider, Esri, Bentley, IBM, Sharper Shape,
      Trimble and internal builds.
    whyItMatters: Public product pages prove overlap but not who wins competitive procurements or how often Neara displaces
      an incumbent.
    diligencePath: Interview at least five Neara customers and two lost prospects; request CRM export by competitor named
      in opportunity notes.
