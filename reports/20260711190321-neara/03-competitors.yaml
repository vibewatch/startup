- id: capability-comparison
  title: 'Capability Comparison: Neara Wins on Physics Depth, Incumbents Win on Suite Breadth'
  body: 'Neara’s strongest differentiated feature is explicit physics-based modelling of grid geometry, environmental stress
    and asset behaviour. Public competitor pages show many partial overlaps: GE combines GIS and high-resolution visual data,
    Siemens offers a unified grid operations platform, Schneider/ETAP now markets a physics-based digital twin, Sharper Shape
    and Trimble emphasize LiDAR-based vegetation or inspection workflows, Esri owns the utility network data model, and IBM/Hexagon
    solve asset or geospatial management. That means Neara’s advantage is less about owning every workflow than about delivering
    an engineering-grade model quickly enough to replace months of manual analysis. The most dangerous direct comparison is
    Schneider/ETAP and GE/Siemens, because they can connect modelling to operational suites. The most common multi-homing
    pattern is likely Neara plus incumbent systems, not immediate displacement: utilities can run Neara simulations while
    retaining ADMS, GIS, EAM and inspection platforms for operational execution.'
  claimRefs:
