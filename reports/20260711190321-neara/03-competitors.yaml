- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Package / vendor cluster
  - Public price visibility
  - Likely unit / contract model
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - Neara
    - No self-serve price found
    - Enterprise SaaS / platform agreement inferred
    - Digital twin build, simulations, risk, capacity and resilience workflows
    - Actual ACV, asset/km tiers, services mix, renewal uplift
    - Underwrite via avoided field work and outage/risk reduction, not generic SaaS seat pricing
  - - Bentley iTwin
    - No iTwin list price found on product page
    - Developer/platform and enterprise infrastructure software agreements
    - Infrastructure twin foundation, data integration, visualization, change tracking
    - Whether utility-specific applications bundle into existing Bentley spend
    - Public scale gives procurement confidence and bundling leverage
  - - GE / Siemens / Schneider / ABB
    - No module list prices found
    - Large enterprise suite, ADMS/grid software, services and support contracts
    - Grid operations, planning, AI modules, ADMS and digital-twin extensions
    - Module attach pricing, implementation services, data-migration costs
    - Can bundle Neara-like features into broader grid-modernization programs
  - - Esri / Hexagon / IBM
    - Platform or enterprise agreements; public list price incomplete
    - GIS, network data, EAM and asset-management subscriptions/services
    - Systems of record, tracing, asset health, integrations
    - Whether physics simulation is native or partner-led
    - Strong lock-in because they own records and operational workflows
  - - Inspection / vegetation startups
    - Mostly demo/quote motion
    - Workflow module, imagery/LiDAR processing, field work management
    - Defect, vegetation, visual and clearance analytics
    - Per-mile, per-asset, per-inspection pricing not public
    - Can undercut Neara for narrow budgets while leaving simulation gap
  - - Internal / partner build
    - Project-specific; no public product price
    - Utility-funded consulting/cloud/AI program
    - Custom network planning, interconnection or data-visualization workflows
    - Total cost of ownership and maintainability
    - Best for very large utilities with unique data and budget; validates build risk
  notes: Pricing is based on public-page observability only; actual Neara and competitor contract values require customer
    references, MSAs, renewal schedules and implementation statements of work.
