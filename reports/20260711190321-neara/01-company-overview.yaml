  - id: funding-capital
    title: Funding History, Valuation, and Capital Structure
    body: >
      Neara has raised across five-plus rounds. Skip Capital (Kim Jackson and Scott Farquhar) first backed the company
      at a 2018 seed stage and has since participated in five rounds. A A$7.25 million Series A followed in 2021, then a
      A$20 million Series B in May 2022 led by Prosus Ventures with Square Peg and Skip Capital. A A$15.25 million Series
      B extension was added afterwards — sources conflict on timing, with StartupDaily placing it in late 2022 and
      SmartCompany in September 2023. A A$45 million Series C closed in late 2024.


      The A$90 million Series D announced on 10 February 2026 was led by TCV — the growth-equity firm behind Netflix,
      Spotify, Revolut, and Australian names Xero, SiteMinder, and Employment Hero — with returning investors Partners
      Group, EQT, Square Peg Capital, and Skip Capital. It was TCV's third Australian investment. The round set an A$1.1
      billion valuation, making Neara a unicorn in Australian-dollar terms; pv magazine reports the raise as US$63.8
      million, implying a roughly US$700-780 million USD-equivalent valuation. Total external funding is now about A$180
      million; Tracxn separately cites US$126 million.


      No public debt facility, secondary transaction, or detailed cap-table ownership split has been disclosed. The
      Series D is earmarked for hiring machine-learning and AI engineers and expanding Neara's international commercial
      footprint in the US, UK, and Europe. As a private company Neara does not publish audited financials, so revenue,
      burn, and runway remain estimates.
