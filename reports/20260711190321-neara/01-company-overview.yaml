company:
  name: Neara
chapter:
  number: 1
  title: Company Overview
  summary: >
    Neara (legally LineSoft Pty Ltd; Sydney/Redfern, NSW; founded 2016, commercialised 2019) builds physics-enabled 3D
    digital-twin software for electricity grids and critical infrastructure. In February 2026 it raised an A$90 million
    (~US$63.8 million) Series D led by TCV at an A$1.1 billion valuation (~US$700-780 million), becoming Australia's
    newest unicorn and lifting total funding to roughly A$180 million. Founders are Daniel Danilatos (CEO), Jack Curtis
    (Chief Commercial Officer), and Karamvir Singh (Chief Product Officer). Neara serves close to 90% of Australian
    network utilities plus Southern California Edison, CenterPoint Energy, ESB Networks, Scottish Power, and Hedno, and
    has modelled 15 million+ assets across 3 million+ km. Revenue and headcount are only third-party estimated.
sections:
  - id: identity-product
    title: Identity, Product, and Business Model
    body: >
      Neara is a Sydney-headquartered infrastructure software company registered as LineSoft Pty Ltd and operating from
      Redfern, New South Wales. It builds "physics-enabled digital twins" — geometrically precise 3D models of entire
      infrastructure networks, principally electricity grids, that reproduce how each pole, conductor, and structure
      behaves under real-world terrain, weather, load, and vegetation conditions. Unlike heuristic or statistical
      planning tools, Neara grounds every simulation in engineering-grade physics, letting utilities stress-test assets
      against wind, ice, thermal, flood, and wildfire scenarios and identify hidden network capacity without building
      new infrastructure.


      The founding date is reported inconsistently: Neara's own materials, SmartCompany, Tracxn, and Kurrant cite 2016,
      while Forbes Australia says 2019 and TechCrunch describes a 2019 commercial launch. The most defensible reading is
      that the company was founded in 2016 and launched its product commercially around 2019. The origin story is that
      co-founder Daniel Danilatos, a former Google engineer, built a tool to solve his wife's power-line design
      frustrations; it grew into a network-scale modelling platform.


      The business model is enterprise SaaS: multi-year subscription and platform agreements with electric utilities and
      network operators. Neara ingests customers' existing LiDAR, imagery, GIS, and asset records, builds the digital
      twin, then charges for simulation, risk, vegetation-management, and capacity workflows. Customers pay for
      analytics that replace months of manual field surveys with modelling delivered in hours or days.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
