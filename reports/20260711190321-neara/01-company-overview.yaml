callouts:
  - calloutType: strength
    title: Category-defining product with quantified utility proof points
    body: >-
      Neara's physics-enabled digital twin has produced measurable outcomes at named utilities: SA Power Networks
      re-energised in five days versus a three-week estimate, Endeavour Energy cut 300 inspection hours, and CenterPoint
      deployed across its 8,000 km2 Houston territory. These are unusually concrete traction signals for a private
      infrastructure-software company.
    claimRefs:
      - CO026
      - CO027
      - CO025
      - CO018
  - calloutType: risk
    title: Valuation outruns disclosed financials
    body: >-
      The A$1.1 billion valuation contrasts with third-party revenue estimates near A$10.4 million (2024). Even
      allowing for strong growth, the implied revenue multiple is very high, and Neara publishes no audited financials,
      so the valuation rests heavily on category positioning and future international expansion rather than proven scale.
    claimRefs:
      - CO012
      - CO017
      - CO037
  - calloutType: assumption
    title: Financial and headcount figures are estimates
    body: >-
      Revenue (~A$10.4M in 2024), headcount (~114 in 2026), and ownership splits are third-party estimates or
      undisclosed. This report treats them as low-confidence pending a data-room review; operational metrics are
      company-stated and only partly independently verified.
    claimRefs:
      - CO017
      - CO028
      - CO029
  - calloutType: insight
    title: Founding-date and currency ambiguities need resolution
    body: >-
      Public sources disagree on the founding year (2016 vs 2019) and whether the A$1.1B valuation should be read in AUD
      or USD. The defensible reading is founded 2016 / commercialised 2019, and A$1.1B AUD (~US$700-780M). Diligence
      should confirm both from primary records.
    claimRefs:
      - CO004
      - CO012
      - CO033
