  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Audited or company-confirmed revenue, ARR, gross margin, and growth rate; only third-party estimates
        (~A$10.4M in 2024) exist.
      whyItMatters: >-
        Revenue scale is central to judging whether the A$1.1B valuation is defensible; without it the valuation
        multiple cannot be reliably computed.
      diligencePath: >-
        Request audited financials and a data-room P&L; obtain ARR and net revenue retention from management.
      relatedQuestionRefs:
        - QO006
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >-
        Confirmed employee count and functional breakdown; only tracker estimates (~114 in 2026) are available.
      whyItMatters: >-
        Headcount informs burn rate, execution capacity, and the scalability of the workforce model against revenue.
      diligencePath: >-
        Request an org chart and headcount by function; cross-reference LinkedIn and job-posting volume over time.
      relatedQuestionRefs:
        - QO007
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: >-
        Complete C-suite (CFO, CTO) and full board composition including independent directors and investor observers.
      whyItMatters: >-
        Governance depth and key-person risk cannot be fully assessed without the full leadership and board picture.
      diligencePath: >-
        Request org chart and board register; review ASIC filings for LineSoft Pty Ltd directorships.
      relatedQuestionRefs:
        - QO019
        - QO026
      relatedTableRefs:
        - TO002
    - type: conflicting-data
      severity: minor
      topic: founding
      missingEvidence: >-
        Primary confirmation of the founding year given the 2016 versus 2019 discrepancy across sources.
      whyItMatters: >-
        A three-year discrepancy affects the interpretation of the company's maturity and growth pace.
      diligencePath: >-
        Verify incorporation date of LineSoft Pty Ltd via the ASIC company register.
      relatedQuestionRefs:
        - QO011
    - type: enumeration-incomplete
      severity: minor
      topic: 'stakeholder or investor map'
      missingEvidence: >-
        Ownership percentages, board seats, and any secondary transactions across Neara's five-plus funding rounds.
      whyItMatters: >-
        Control and economic alignment depend on the cap table, which is not publicly itemised.
      diligencePath: >-
        Request the capitalisation table and shareholder register during diligence.
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: 'milestone table'
      missingEvidence: >-
        Exact Series B extension date and seed amount, plus any unreported early pre-seed activity.
      whyItMatters: >-
        Precise chronology matters for reconstructing the funding cadence and burn.
      diligencePath: >-
        Confirm round dates and amounts from investor announcements and ASIC filings.
      relatedTableRefs:
        - TO004
