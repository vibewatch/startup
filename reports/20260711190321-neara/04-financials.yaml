- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public proxy available
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR / contracted backlog
    - None; only tracker revenue estimates
    - Cannot compute ARR multiple or revenue durability
    - Request ARR waterfall by customer, product, geography, and contracted backlog
  - - Revenue recognition mix
    - No subscription vs services split
    - Services-heavy revenue would lower software multiple
    - Review revenue recognition policy and services COGS
  - - Gross margin
    - No company disclosure
    - Implementation and compute costs could depress margins
    - Request audited gross margin by SKU and deployment cohort
  - - NRR / churn
    - No public retention data
    - Sticky utility accounts are assumed, not proven
    - Request GRR, NRR, expansion ARR, churn, and top losses
  - - CAC and payback
    - No sales-efficiency data
    - Long utility procurement could consume capital
    - Review bookings by channel, sales expense, and cohort payback
  - - Customer concentration
    - Named customers but no revenue mix
    - A few utilities may dominate ARR
    - Request top-10 customer revenue, contract terms, and renewal dates
  - - Cap table and preferences
    - No ownership or liquidation terms
    - Economic outcome depends on preferences after five-plus rounds
    - Request fully diluted cap table, SAFEs/notes, preferences, and secondaries
  - - Entity filings
    - UK subsidiary shows accounts overdue; AU private accounts not public
    - Overseas filings do not close group financial gap
    - Pull ASIC filings and management accounts for LineSoft Pty Ltd
  notes: This table intentionally lists nulls where public evidence is absent; each row is a specific data-room request.
