  rows:
  - - Cash from latest round
    - A$90M Series D announced February 2026
    - high
    - Large cushion for hiring and global expansion
    - Confirm primary vs secondary proceeds and cash on balance sheet after fees
  - - Total external funding
    - ~A$180M disclosed; US trackers cite ~$123M-$126M
    - medium
    - Deep capital stack but currency and data-source differences require reconciliation
    - Build round-by-round cap table in a single currency
  - - Monthly burn
    - Not disclosed
    - low
    - Cannot calculate runway or burn multiple
    - Request trailing 18-month cash flow, burn by function, and hiring plan
  - - Indicative runway
    - ~27-54 months if annual burn were A$20-40M
    - low / inferred
    - Suggests adequate runway only under assumed burn bands
    - Replace scenario with management budget and cash balance
  - - Debt / project finance
    - No public debt facility found
    - low
    - Lower balance-sheet risk if true, but absence is not proof
    - Request debt schedule, leases, guarantees, and customer prepayment terms
  - - Next-round trigger
    - Likely international GTM scale or ARR proof, not capex
    - medium
    - Next raise should be tied to ARR and margin milestones
    - Define target ARR, NRR, burn multiple, and market-entry milestones
  notes: Runway is scenario-based because Neara discloses neither cash balance nor burn. Funding chronology is locally sourced
