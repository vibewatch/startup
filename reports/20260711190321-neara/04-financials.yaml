- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - 'null'
    - low
    - Core recurring revenue base is not disclosed
    - Request ARR by product, geography, and customer cohort
  - - Recognized revenue
    - ~$10.4M 2024 to ~$19.7M current estimates
    - low
    - Revenue estimates drive valuation multiple but conflict materially
    - Provide audited P&L and monthly revenue schedule
  - - Gross margin
    - null; SaaS benchmark healthy range >70-75%
    - medium benchmark / low company
    - Shows whether implementation and compute costs dilute software economics
    - Split subscription, services, support, and compute gross margin
  - - CAC payback
    - null; enterprise SaaS benchmark often 18-24 months
    - medium benchmark / low company
    - Utility sales cycles may consume capital if ACV is not large enough
    - Provide sales spend, new ARR, payback, and pipeline conversion
  - - Net dollar retention
    - null; benchmark top quartile >120%
    - medium benchmark / low company
    - Expansion in utility accounts is central to valuation support
    - Provide GRR/NRR by annual cohort and largest accounts
  - - Burn multiple
    - null; >1.5x needs explanation
    - medium benchmark / low company
    - Determines whether growth is capital-efficient after Series D
    - Provide monthly net burn and net new ARR over trailing 12 months
  - - Revenue per employee
    - Growjo implies ~$162,645 using $19.7M / 121 employees
    - low
    - Proxy for productivity but depends on unreliable numerator
    - Reconcile FTEs, contractors, and revenue by geography
  - - Implementation intensity
    - Qualitative high-touch ingestion and customer-success workload
    - medium
    - Bespoke deployment can cap margins and slow scaling
    - Measure hours to deploy, support tickets, and COGS per network kilometre
  notes: Company-specific unit economics are private; benchmark rows use 2026 SaaS references only as underwriting yardsticks,
    not as Neara facts.
