  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited P&L, ARR, billings, deferred revenue, recognized revenue, subscription versus services mix, and
      backlog.
    whyItMatters: Revenue quality drives whether the A$1.1B valuation is a software multiple or a services-heavy expansion
      story.
    diligencePath: Request audited financial statements and a monthly ARR-to-GAAP revenue bridge by product and customer cohort.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI019
    - QI025
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, CAC payback, NRR, GRR, churn, implementation COGS, support cost, and compute cost.
    whyItMatters: Unit economics determine whether Neara can scale internationally without consuming the Series D proceeds
      inefficiently.
    diligencePath: Request cohort-level unit economics, sales productivity, implementation hours, and gross-margin by SKU.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI011
    - QI021
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Starting cash balance, monthly net burn, hiring plan, working capital, debt schedule, and board-approved
      operating plan.
    whyItMatters: Runway and next-round timing cannot be calculated from the A$90M raise alone.
    diligencePath: Review bank balances, monthly management accounts, forecast model, debt/lease schedule, and hiring budget.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI023
    - QI024
  - type: conflicting-data
    severity: material
    topic: valuation-currency-and-methodology
    missingEvidence: Primary post-money valuation schedule and single-currency funding history reconciling AUD headlines with
      USD tracker estimates.
    whyItMatters: A$1.1B, US$585M, US$123M raised, and A$180M raised cannot all be compared without currency and methodology
      normalization.
    diligencePath: Ask management and lead investor for the Series D term sheet, capitalization table, FX assumptions, and
      post-money calculation.
    relatedQuestionRefs:
    - QI012
    - QI016
    - QI020
  - type: conflicting-data
    severity: minor
    topic: series-b-extension-date
    missingEvidence: Primary round documents confirming whether the A$15.25M extension closed in late 2022 or September 2023.
    whyItMatters: The date changes the interpretation of burn cadence and how long Series B capital lasted before Series C.
    diligencePath: Request board consents, press release originals, share issue filings, and investor closing notices.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI006
  - type: enumeration-incomplete
    severity: material
    topic: funding history enumeration table
    missingEvidence: Seed amount, ownership percentages, liquidation preferences, board rights, pro-rata participation, and
      any secondary sales.
    whyItMatters: Capital adequacy and investor economics depend on ownership and preferences, not just headline round sizes.
    diligencePath: Request the fully diluted cap table, financing documents, shareholder register, and option-pool schedule.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI006
  - type: access-blocked
    severity: minor
    topic: aggregator-access
    missingEvidence: Readable CompWorth, PitchBook, DLA Piper, and MarketScreener pages where fetch was blocked, broken, or
      JS-only.
    whyItMatters: Blocked aggregator and legal pages limit triangulation of revenue, valuation, legal advisor, and Prosus
      extension details.
    diligencePath: Use subscribed data-room access or request PDFs/screenshots directly from vendors and counsel.
    relatedQuestionRefs:
    - QI026
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public or data-room list pricing, realized pricing, discounting, implementation fees, and module packaging.
    whyItMatters: CAC payback, ACV, and gross margin cannot be evaluated without monetization detail.
    diligencePath: Request price book, order forms, top customer contracts, discount history, and SKU attach-rate reports.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI003
    - QI025
