company:
  name: Neara
chapter:
  number: 4
  title: Financials
  summary: 'Neara has raised roughly A$180 million and entered unicorn territory at a reported A$1.1 billion Series D valuation,
    but its public financial record is thin: revenue, ARR, margin, NRR, CAC, burn, and runway are undisclosed. Third-party
    trackers publish conflicting low-confidence revenue and headcount estimates, so the financial case rests on strong capital
    access and utility proof points rather than audited revenue quality.'
sections:
- id: revenue-model
  title: Revenue Model and Recognition Lens
  body: 'Neara appears to monetize as enterprise infrastructure software sold to regulated utilities and infrastructure owners,
    not as a usage-based marketplace or hardware business. The official platform page asks buyers to book a custom demo rather
    than presenting list pricing, and the product workflow begins with customer data ingestion, digital-twin generation, scenario
    simulation, and regulator-ready actions. That points to bespoke annual or multi-year platform contracts, likely priced
    by network scale, modules, and deployment complexity. Public sources do not disclose ARR, ACV, contract length, renewal
    rates, implementation fees, or professional-services mix. The revenue-quality implication is therefore mixed: the buyer
    pain is mission-critical and the product can touch many workflows, but revenue recognition may include upfront model-build
    or services components that would lower pure-SaaS comparability until management supplies contracted ARR, deferred revenue,
    and services gross margin.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI046
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-sales-efficiency
  title: GTM Motion and Sales-Efficiency Proxies
  body: 'Neara''s go-to-market is concentrated in large electric utilities and adjacent infrastructure owners, with named
    proof points in Australia, the United States, Ireland, the United Kingdom, and Greece. That is valuable because regulated
    utilities are sticky, referenceable customers once deployed; it is also expensive because procurement, cyber review, regulatory
    justification, and data onboarding can stretch sales cycles. The public record gives strong adoption anecdotes—Endeavour
    eliminated 300 manual inspection hours and the Series C press release describes analyses falling from months or years
    to hours or days—but it does not give CAC, sales headcount productivity, payback, expansion ARR, churn, or net retention.
    Benchmarking against enterprise SaaS therefore has to remain directional: 18-24 month CAC payback may be acceptable for
    very large ACVs, while anything longer needs evidence of exceptional NRR or strategic land-and-expand economics.'
  claimRefs:
  - CI027
  - CI028
  - CI032
  - CI033
  - CI040
  tableRefs: []
  figureRefs:
  - FI002
- id: cost-structure-unit-economics
  title: Cost Structure and Unit Economics
  body: 'The attractive part of Neara''s model is that it is software-centric: it does not appear to require inventory, manufacturing
    scale-up, or project-finance balance-sheet exposure. The costly part is that each enterprise deployment depends on ingestion
    and quality control of LiDAR, imagery, GIS, and asset records, physics-model configuration, customer-success work with
    operational teams, and continued R&D in machine learning and AI. Public SaaS benchmarks imply investors will expect gross
    margins above roughly 70-75%, burn multiple below about 1.5x, and credible CAC payback; Neara publishes none of these.
    The diligence burden is to separate platform subscription gross margin from implementation services, quantify compute
    and support cost per modeled network kilometre, and prove that the same model can be replicated internationally without
    bespoke engineering effort consuming the gross-margin pool.'
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI035
  - CI046
  tableRefs:
  - TI003
  figureRefs:
  - FI005
- id: public-traction-estimates
  title: Public Traction Versus Private-Metric Gaps
  body: 'Neara discloses operational traction more willingly than financial traction. Company and press materials report more
    than 15 million assets modeled, over 3 million kilometres or 2 million miles of infrastructure, and close to 90% coverage
    of Australian network utilities. Financial trackers, however, disagree sharply: GetLatka estimates 2024 revenue at $10.4
    million and 2022 revenue at $5.5 million; Growjo estimates current annual revenue at $19.7 million and 121 employees;
    CB Insights lists only $558,550 of 2022 revenue; Tracxn reports an outlier employee count of 218 as of May 2026. These
    sources are useful adverse evidence precisely because they show how little audited information is public. Until Neara
    provides ARR, recognized revenue, billings, backlog, and customer concentration, public estimates should be treated as
    low-confidence bounds rather than underwriting inputs.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI019
  - CI020
  - CI021
  - CI022
  - CI044
  - CI045
  tableRefs:
  - TI005
  figureRefs:
  - FI003
- id: capital-adequacy-verdict
  title: Capital Adequacy and Financial Verdict
  body: 'Capital access is Neara''s strongest financial signal. The February 2026 Series D raised A$90 million, was led by
    TCV, included Partners Group, EQT, Square Peg, and Skip, and lifted disclosed total funding to about A$180 million. That
    gives the company meaningful runway to hire AI engineers and expand commercially, but the exact cushion cannot be underwritten
    without starting cash, monthly net burn, working-capital timing, and any customer-prepayment or debt terms. A rough scenario
    suggests the new round could fund several years at A$20-40 million of annual burn, but this is an inference, not a fact.
    The verdict is therefore track-with-data-room: Neara has enough capital and investor quality to execute, yet the valuation
    rests on opaque revenue quality, unproven unit economics, and a currency/valuation ambiguity that must be reconciled before
    pricing a new round.'
