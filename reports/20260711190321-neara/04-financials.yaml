callouts:
- calloutType: risk
  title: 'Adverse signal: financial opacity, not customer demand, is the main blocker'
  body: Neara has strong capital access and credible utility proof points, but revenue trackers disagree by orders of magnitude
    and the company discloses no ARR, margin, CAC, or burn. Treat public revenue estimates as adverse diligence prompts rather
    than valuation inputs.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI022
  - CI044
- calloutType: insight
  title: AUD unicorn headline needs currency normalization
  body: The A$1.1B valuation is a unicorn headline in Australian dollars. USD-equivalent valuation appears closer to roughly
    US$700-780M, while PremierAlts publishes $585.2M, so any valuation comparison must specify currency and methodology.
  claimRefs:
  - CI010
  - CI011
  - CI012
- calloutType: recommendation
  title: Underwrite only after data-room ARR and burn reconciliation
  body: The right next step is not a point estimate; it is a data-room bridge from bookings to ARR, recognized revenue, gross
    margin, NRR, cash burn, and runway, reconciled to the A$180M funding history and A$1.1B valuation.
  claimRefs:
  - CI003
  - CI036
  - CI037
  - CI043
