- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Quality
  - Diligence ask
  rows:
  - - Core grid digital-twin subscription
    - Enterprise platform access for utility networks and planning workflows
    - Likely annual or multi-year contract
    - No ARR or ACV disclosed
    - Potentially recurring but unverified
    - Request ARR bridge, contract duration, renewal cohorts, and top-10 account ACV
  - - Initial data ingestion and model build
    - LiDAR, imagery, GIS, and asset records are normalized into a physics-enabled model
    - Implementation / onboarding project
    - No services revenue split disclosed
    - Could dilute SaaS gross margin
    - Separate implementation fees, services COGS, and time-to-live by customer
  - - Simulation and risk modules
    - Wind, ice, thermal, flood, vegetation, reconductoring, and new-build analyses
    - Module / seat / network-scale add-on unknown
    - No module pricing disclosed
    - Expansion potential if priced modularly
    - Request packaging, attach rates, and realized price by module
  - - Regulator-ready reporting and field actions
    - Outputs hardening plans, inspection programs, work orders, and defensible reports
    - Workflow or enterprise license
    - Value evidenced by case studies, not pricing
    - High strategic value but monetization opaque
    - Tie each workflow to contracted SKU and gross margin
  - - Adjacent infrastructure expansion
    - Telecommunications, transport, broadband, and non-electric infrastructure use cases
    - New vertical contract
    - Series C materials say expansion is planned
    - Upside but not yet quantified
    - Show pipeline, signed non-utility ARR, and vertical-specific CAC
