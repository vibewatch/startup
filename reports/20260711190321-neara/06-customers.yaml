- id: named-proof-and-outcomes
  title: Named Customer Proof and Measured Outcomes
  body: The strongest customer evidence comes from named utilities with quantified operational outcomes. Essential Energy used Neara’s span-level modelling across a very large rural and regional network and found that some parts of the network could carry twice the previously assumed capacity. Endeavour Energy used the platform during major Western Sydney floods, activating a live flood model within 48 hours, eliminating 300 manual inspection hours, and applying the model across a 60,000 km network with 430,000 poles and 207 major substations. SA Power Networks analyzed 21,000 spans in 15 minutes during River Murray flooding and re-energized in five days rather than an expected three weeks. In the US, SCE’s multi-year wildfire and vegetation analytics partnership covers 50,000 square miles and 15 million people, while CenterPoint’s post-Beryl deployment covers Greater Houston. In Europe, ESB Networks has a concrete 7,500 km deployment and two-week versus three-to-four-month reporting proof point; Scottish Power and Hedno are credible named accounts but have thinner public outcome disclosure.
