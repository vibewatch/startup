- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Australian near-saturation
    - Domestic growth depends on upsell if 90% coverage is accurate
    - Could compress new-logo growth in home market
    - Ask for Australian ARR by account and whitespace analysis
  - - US flagship accounts
    - SCE and CenterPoint are large, complex, reference-critical utilities
    - Reference success can unlock US pipeline; failure would hurt credibility
    - Review implementation milestones and customer references
  - - European early base
    - ESB has strong proof, but Scottish Power and Hedno are thinner public references
    - Europe may be less mature than logo list suggests
    - Request EU pipeline, paid status and deployment depth
  - - Multi-workflow platform
    - Land in resilience/capacity then expand into planning, design and vegetation
    - Supports NRR if modules attach to the same digital twin
    - Request module-level ARR and expansion cohorts
  - - Regulated utility procurement
    - Risk-averse, compliance-heavy buying cycles
    - Long sales cycles and high CAC can delay revenue conversion
    - Review sales-cycle history and weighted pipeline aging
  - - Legacy-system integration
    - Utility software switching costs and OT/ERP integration complexity
    - Creates stickiness after deployment but slows onboarding
    - Review implementation margin, data rights and integration backlog
  notes: Risk ratings are inferred from public evidence and sector procurement benchmarks; data-room ARR, pipeline and renewal files are required for investment-grade quantification.
