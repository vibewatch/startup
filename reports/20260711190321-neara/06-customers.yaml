- id: concentration-and-procurement-risk
  title: Concentration, Procurement Friction, and Diligence Asks
  body: 'The adverse case is not that customers are fake; it is that public proof may overstate repeatability and understate commercial friction. Neara has many impressive logos, but a diligence buyer still needs ARR by customer, contract start and renewal dates, average contract value, implementation effort, top-ten concentration, gross retention and expansion revenue by module. Australian penetration near 90% may mean a large portion of domestic revenue depends on a few regulated utilities and that future growth has to come from international sales or broader use within existing accounts. The utility software buying environment is structurally slow: procurement acts as risk management, utilities operate with regulatory oversight and long asset lifecycles, and enterprise software contracts above US$500,000 can take most of a year to close. That can be mitigated by strong references and customer-specific urgency after floods, fires and outages, but it should be modelled as a long-cycle enterprise GTM rather than fast self-serve SaaS.'
