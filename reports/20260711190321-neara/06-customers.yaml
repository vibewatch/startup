callouts:
- calloutType: strength
  title: Named utility proof is real and quantified
  body: 'Neara’s customer story is anchored by named utilities with measurable operational outcomes: Endeavour eliminated 300 manual inspection hours, SA Power Networks analyzed 21,000 spans in 15 minutes, and ESB reports two-week insights versus months of manual reporting.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU023
  - CU024
- calloutType: risk
  title: Retention and concentration are not public
  body: No public source discloses NRR, GRR, churn, renewal rate, ARR by account or top-ten customer share. A diligence buyer should treat logos as proof of adoption, not proof of durable recurring revenue.
  claimRefs:
  - CU033
  - CU039
  - CU044
  - CU045
- calloutType: insight
  title: International expansion is the key growth test
  body: Australian penetration near 90% validates the product but may limit domestic new-logo growth; the value-creation question is whether SCE, CenterPoint, ESB, Scottish Power and Hedno convert into repeatable offshore expansion.
  claimRefs:
  - CU003
  - CU006
  - CU007
  - CU037
  - CU038
- calloutType: assumption
  title: Utility GTM should be modelled as long-cycle enterprise SaaS
  body: Sector evidence shows critical-infrastructure procurement is conservative and enterprise software sales cycles can be long; Neara’s strong references can help, but forecasts should assume slow procurement and implementation gating.
  claimRefs:
  - CU040
  - CU041
  - CU042
