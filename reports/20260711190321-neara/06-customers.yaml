chapter:
  number: 6
  title: Customers
  summary: 'Neara has unusually strong named utility proof for an infrastructure-software startup: close to 90% Australian network-utility coverage, flagship US accounts SCE and CenterPoint, and European references including ESB Networks, Scottish Power and Hedno. The strongest evidence is quantified operational ROI at Essential Energy, Endeavour Energy, SA Power Networks, CenterPoint and ESB, while retention, top-customer concentration, sales-cycle length and contract economics remain private-evidence gaps.'
sections:
- id: segments-and-coverage
  title: Customer Segments and Coverage
  body: 'Neara’s paying audience is unusually focused: regulated electricity network utilities and infrastructure owners that operate large physical grids. The buyer is usually a utility executive, network planning leader, asset-management leader, vegetation or resilience team, or innovation function; the users are engineers, planners, emergency-response teams and field-operations managers; and the payer is the network utility or distribution/transmission owner. Public evidence points to a deep Australian base, with Neara repeatedly saying it works with close to 90% of Australian network utilities, including Essential Energy, Endeavour Energy, Ausgrid, AusNet, Powercor and SA Power Networks. That penetration is a strength because it validates the category in Neara’s home market and creates reference density, but it also means incremental Australian growth may be constrained by saturation and by account expansion rather than new-logo acquisition. The international base is smaller but strategically important: SCE and CenterPoint in the US, ESB Networks in Ireland, Scottish Power in the UK and Hedno in Greece show that the workflow can travel to different regulatory and climate-risk contexts.'
