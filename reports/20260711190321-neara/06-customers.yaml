figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How a utility account can progress from urgent risk modelling into broader grid-planning and resilience workflows.
  data:
    items:
    - label: Trigger event or planning need
      detail: Flood, wildfire, vegetation risk, capacity constraint, data-centre load, renewables integration or resilience mandate creates urgency.
      touchpoints:
      - River Murray flood
      - Hurricane Beryl
      - ESB weather-risk program
    - label: Data ingestion and network model
      detail: Utility provides LiDAR, geospatial, imagery and asset data to build a physics-enabled digital twin.
      touchpoints:
      - SCE LiDAR / satellite data
      - ESB LiDAR and geospatial data
      - Australian utility network data
    - label: Initial operational use case
      detail: Teams simulate risk, clearance, capacity or vegetation scenarios and prioritize field response.
      touchpoints:
      - Endeavour flood model
      - SAPN span clearance
      - SCE wildfire risk
    - label: Measured operational outcome
      detail: Proof points include 300 inspection hours avoided, 21,000 spans analyzed in 15 minutes and ESB two-week insights.
      touchpoints:
      - Endeavour
      - SA Power Networks
      - ESB Networks
    - label: Expansion into planning
      detail: The same twin can support capacity release, new infrastructure, vegetation management and grid-hardening investment planning.
      touchpoints:
      - Essential Energy
      - CenterPoint GHRI
      - Neara aggregate claims
    - label: Renewal / executive sponsorship
      detail: Durability depends on contract renewal, embedded workflows, reference calls, support quality and measured ROI.
      touchpoints:
      - Multi-year SCE
      - CenterPoint customer channel
      - Data-room renewal ask
  approximationNotes: Journey stages synthesize disclosed utility workflows; public sources do not disclose conversion rates between stages.
