  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: Complete customer census, paid status, production-versus-pilot status, contract dates and deployment scope for all utility customers, including confidential or unnamed accounts.
    whyItMatters: The named customer list is strong but partial; concentration, conversion and repeatability cannot be judged from public logos alone.
    diligencePath: Request customer master list, ARR by account, deployment status, contract dates and reference-call permission for each top account.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, logo retention, renewal rate, cohort retention and customer satisfaction scores by year and geography.
    whyItMatters: Retention is central to enterprise SaaS quality and cannot be inferred from customer case studies or named logos.
    diligencePath: Review cohort ARR bridges, churned-customer list, renewal calendar, support metrics and customer reference notes.
    relatedQuestionRefs:
    - QU014
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: top customer concentration
    missingEvidence: Top-ten customer ARR share, largest account share, Australian revenue share, offshore revenue bridge and customer-level gross margin.
    whyItMatters: Neara may depend heavily on a small number of regulated utilities; this affects downside risk and valuation durability.
    diligencePath: Request ARR by customer and module, revenue by geography, implementation cost by account and account health scores.
    relatedQuestionRefs:
    - QU019
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: Scottish Power and Hedno deployment depth
    missingEvidence: Customer-owned case studies or press releases explaining Scottish Power and Hedno use cases, production scope and measured outcomes.
    whyItMatters: Both are useful international logos, but without customer-owned detail they are weaker proof than ESB, SCE or CenterPoint.
    diligencePath: Ask management for contract status, customer references and implementation artifacts for Scottish Power and Hedno.
    relatedQuestionRefs:
    - QU011
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: sales cycle and implementation economics
    missingEvidence: Actual sales-cycle length, procurement stage conversion, implementation duration, professional-services margin and CAC payback by segment.
    whyItMatters: Utility procurement benchmarks indicate long regulated sales cycles; Neara-specific cycle data is needed to model growth efficiently.
    diligencePath: Review CRM pipeline aging, closed-won cohort data, implementation resourcing and expansion bookings by account.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
