      - number: '5.4'
        title: Integrations, Trust Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The main underwriting risk is that Neara’s strongest evidence concerns output speed and customer outcomes,
              while public evidence is thinner on formal controls. The platform is deeply dependent on the accuracy,
              recency, and completeness of LiDAR, GIS, satellite imagery, and asset records; Neara itself says
              operations are only as strong as the data relied on. Its standards posture should be diligence-tested
              against CIM, CGMES, and IEC 61970/61968 model-exchange expectations, because fetched Neara sources discuss
              multiple international standards only generally rather than naming certifications. The same caveat applies
              to model validation and security. NIST’s AI Risk Management Framework and ABS verification-and-validation
              guidance indicate what critical-infrastructure AI buyers should expect: risk management, validation
              documentation, credibility assessment, and transparent uncertainty. Neara’s case studies are compelling
              but do not publish error bounds, independent validation audits, cloud cost benchmarks, SOC 2/ISO evidence,
              or detailed cybersecurity architecture. These gaps do not invalidate the product; they define the
              data-room work needed before underwriting mission-critical deployment risk.
