      - number: '8.2'
        title: Comparable Multiples and the Adverse Stretch Signal
        blocks:
          - type: paragraph
            body: >-
              The adverse valuation signal is straightforward: Neara’s disclosed valuation is being compared against
              thin, low-confidence revenue estimates. At the A$10.4 million 2024 revenue estimate, the implied trailing
              revenue multiple is about 106x; even a generous assumption that current revenue already reached A$20
              million still implies roughly 55x. That is not impossible for a scarce AI infrastructure platform, but it
              is far outside most public and private software benchmarks reviewed. Bentley, the closest listed
              infrastructure-engineering software comp, trades near a mid-single-digit sales multiple while guiding to
              more than US$1.6 billion of 2026 revenue and nearly US$1.5 billion of ARR. Autodesk and Trimble similarly
              anchor mature design/geospatial software around roughly 3.7x to 5.8x EV/revenue on July 2026 data. Private
              SaaS benchmark sources reserve double-digit ARR multiples for rare, high-growth, high-retention, AI-native
              businesses; Neara may qualify, but public sources do not prove it.
