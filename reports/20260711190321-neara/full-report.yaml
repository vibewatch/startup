  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Boundary: Three Competitive Arenas, Not One'
        blocks:
          - type: paragraph
            body: >-
              Neara’s competitive set should not be read as a clean list of other Australian AI startups. The buying job
              is broader: help a utility understand physical network risk, plan grid upgrades, prioritize vegetation or
              resilience work, and defend decisions to regulators. That creates three arenas. First are direct
              grid-modeling and digital-twin rivals such as GE Vernova GridOS Visual Intelligence, Siemens Gridscale X,
              Schneider/ETAP, GridData and Sharper Shape, which claim network models, data ingestion and simulation or
              risk workflows. Second are incumbents and adjacencies: Esri GIS, IBM Maximo, Hexagon, ABB, Trimble,
              Scopito, Unleash live and Sheltera already sit in GIS, ADMS, EAM, inspection or vegetation workflows.
              Third are substitutes: manual survey/status quo and utility-sponsored builds such as National Grid/Atos
              Triton and PJM/Google/Tapestry. The practical diligence question is therefore not “who has a digital twin
              label?” but which product owns the utility’s system of record, field data, simulation trust and
              procurement budget. This framing also prevents over-crediting broad digital-twin platforms that lack grid
              physics, and prevents under-crediting narrow inspection tools that can still capture a buyer’s first
              budget. It treats competition as a workflow-by-workflow adoption path rather than a static software
              category.
            claimRefs:
