      - number: '6.3'
        title: Retention, Durability, and Expansion Motion
        blocks:
          - type: paragraph
            body: >-
              Retention is the biggest public-evidence gap in the customer chapter. Neara’s deployment pattern strongly
              implies durable enterprise use: SCE is described as multi-year, CenterPoint integrated Neara into a
              broader resilience program after Beryl, Australian utilities appear to use the platform across several
              workflows, and ESB’s deployment addresses ongoing vegetation and climate-risk management. However, none of
              those signals substitutes for NRR, GRR, churn, renewal rates, module penetration, active-user counts,
              support satisfaction or cohort retention. The most plausible expansion motion is land-and-expand within a
              utility: start with a high-urgency use case such as floods, wildfire, vegetation or capacity release, then
              expand into planning, design, hardening investments, new-infrastructure onboarding and emergency response.
              That motion benefits from high switching costs once utility data, LiDAR, GIS and operational decisions
              depend on the twin, but it also demands long implementation support, integration with legacy systems and
              procurement patience.
            claimRefs:
