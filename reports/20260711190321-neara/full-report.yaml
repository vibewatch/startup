      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Neara was co-founded by Daniel Danilatos, Karamvir Singh, and Jack Curtis. Daniel Danilatos (CEO) is a
              former Google tech lead who helped build early web real-time collaborative editing tools and previously
              founded the engineering consultancy Helix; he holds a computer-science degree from the University of New
              South Wales. Jack Curtis (co-founder and Chief Commercial / Operations Officer) brings 15+ years in global
              energy and finance, including a senior vice-president role at First Solar overseeing a US$1.1 billion P&L
              and earlier roles at Goldman Sachs in power and utilities investment banking; he is the company's primary
              public spokesperson. Karamvir Singh (co-founder and Chief Product Officer) is a career software engineer
              who has founded and exited prior businesses.


              Governance has institutionalised as the company scaled. Reported board and investor-director
              representation includes James A. Ajello (a former Hawaiian Electric executive) and Jeff Lu of EQT,
              reflecting the growth-equity investors that now sit on the cap table. The founding trio remains
              operationally central, and Jack Curtis in particular concentrates external-facing commercial and
              fundraising communications, creating a degree of key-person dependence that diligence should probe.


              Neara has also stood up international legal entities to support expansion — Neara Software Ltd in London
              (incorporated late 2023) and a US entity in Reno, Nevada (established 2024) — indicating a deliberate
              build-out of overseas commercial and engineering presence beyond the Australian core team. Full C-suite
              depth (CFO, CTO) and complete board composition are not comprehensively disclosed publicly.
