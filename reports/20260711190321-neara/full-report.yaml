      - number: '7.4'
        title: Execution Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The Series D gives Neara capital to hire AI and ML engineers and expand internationally, but it does not
              remove execution risk. The public record is founder-led, with limited disclosure of C-suite depth, board
              composition, security certifications, and renewal economics. That makes the right diligence posture
              conditional rather than binary: proceed only if the data room substantiates audited financials, security
              controls, model validation, and referenceable renewals from flagship utilities. A thesis-break event
              should be objective: a serious grid-data breach; a regulator or customer rejecting Neara's model outputs;
              churn or non-renewal at a flagship Australian or US account; ARR materially below the valuation narrative;
              or evidence that incumbents are winning bundled replacements. Conversely, risks are mitigable if Neara can
              prove SOC/ISO-grade controls, repeatable international deployments, clear RAB/totex business cases, and a
              management bench deeper than the founding team.
