        title: Customer Segments and Coverage
        blocks:
          - type: paragraph
            body: >-
              Neara’s paying audience is unusually focused: regulated electricity network utilities and infrastructure
              owners that operate large physical grids. The buyer is usually a utility executive, network planning
              leader, asset-management leader, vegetation or resilience team, or innovation function; the users are
              engineers, planners, emergency-response teams and field-operations managers; and the payer is the network
              utility or distribution/transmission owner. Public evidence points to a deep Australian base, with Neara
              repeatedly saying it works with close to 90% of Australian network utilities, including Essential Energy,
              Endeavour Energy, Ausgrid, AusNet, Powercor and SA Power Networks. That penetration is a strength because
              it validates the category in Neara’s home market and creates reference density, but it also means
              incremental Australian growth may be constrained by saturation and by account expansion rather than
              new-logo acquisition. The international base is smaller but strategically important: SCE and CenterPoint
              in the US, ESB Networks in Ireland, Scottish Power in the UK and Hedno in Greece show that the workflow
              can travel to different regulatory and climate-risk contexts.
