      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC scorecard separates high product quality from low public valuation support.
    data:
      items:
        - label: Market urgency
          value: High
          score: 8
          note: AI/data-center/grid constraints support demand
        - label: Product proof
          value: High
          score: 8
          note: Named utilities and asset scale support category fit
        - label: Revenue visibility
          value: Low
          score: 3
          note: Only low-confidence third-party estimates
        - label: Valuation support
          value: Weak
          score: 2
          note: Public implied multiple is far above benchmark ranges
        - label: Comp fit
          value: Medium
          score: 5
          note: Relevant public comps exist but are mature and diversified
        - label: Exit readiness
          value: Incomplete
          score: 4
          note: No IPO filing or audited financials
        - label: Diligence leverage
          value: High
          score: 7
          note: Private metrics could move stance materially
    approximationNotes: Scores are 1-10 IC judgments derived from cited evidence; they are not a mechanical model output.
    claimRefs:
      - CV033
      - CV040
      - CV044
      - CV046
