      - number: '1.4'
        title: Scale, Cover Metrics, and Traction
        blocks:
          - type: paragraph
            body: >
              Neara's disclosed scale metrics are operational rather than financial. The company reports modelling more
              than 15 million infrastructure assets across over 3 million kilometres of infrastructure spanning four
              continents (an earlier 2023 figure cited 8 million assets and 1 million square miles, showing rapid
              growth). It works with close to 90% of Australia's electricity network utilities — Essential Energy,
              Endeavour Energy, Ausgrid, AusNet, Powercor, and SA Power Networks — and internationally with Southern
              California Edison and CenterPoint Energy (US), ESB Networks (Ireland), Scottish Power (UK), and Hedno
              (Greece).


              Financial cover metrics are not officially disclosed. Third-party trackers estimate revenue near A$10.4
              million in 2024 (up from A$5.5 million in 2022) and headcount around 114 in 2026 (up from roughly 46 in
              2022, ~44% annual growth), but these are unverified estimates and should be treated as low-confidence. The
              A$1.1 billion valuation against an estimated sub-A$20 million revenue implies a very high revenue multiple
              that diligence must scrutinise.


              Traction is evidenced through named, quantified utility deployments: SA Power Networks analysed 21,000
              line spans in 15 minutes and re-energised in five days versus a three-week manual estimate during River
              Murray flooding; Endeavour Energy eliminated 300 hours of inspection and modelled 60,000 km of network in
              48 hours; CenterPoint deployed Neara across its 8,000 km2 Houston territory after Hurricane Beryl. These
              proof points anchor the company's category claim.
