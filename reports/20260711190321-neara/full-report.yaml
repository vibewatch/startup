      - number: '1.5'
        title: Milestones and Strategic Trajectory
        blocks:
          - type: paragraph
            body: >
              Neara's trajectory shows a steady climb from a niche design tool to a category-defining
              infrastructure-intelligence platform. After founding in 2016 and a 2018 seed, the company commercialised
              in 2019, then compounded funding momentum through a 2021 Series A, a 2022 Series B and extension, a 2024
              Series C, and the 2026 Series D unicorn round. Commercial milestones tracked funding: the Southern
              California Edison wildfire-mitigation partnership (September 2023), the CenterPoint Energy extreme-weather
              deal (October 2024), and expanding European footprint via ESB Networks, Scottish Power, and Hedno.


              Strategically, Neara positions itself against a macro tailwind: surging electricity demand from AI compute
              and data centres, electrification, and ageing grids, combined with intensifying extreme-weather risk.
              Management frames the product as a way for utilities to "stretch capacity, manage risk, and invest where
              it matters," and states an ambition to make the physics-first digital twin the standard layer for how
              energy, transport, and communications networks are understood.


              The main open questions carried into later chapters are the true scale of revenue and the durability of
              the valuation, the depth of governance and C-suite beyond the founders, and whether Neara can replicate
              its Australian near-monopoly position across diverse US, UK, and European regulatory and infrastructure
              environments. These are addressed in the market, financials, customers, risks, and valuation chapters.
