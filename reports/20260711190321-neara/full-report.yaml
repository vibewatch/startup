          - type: callout
            title: AUD-versus-USD framing matters
            body: >-
              The defensible reading is A$1.1 billion, equivalent to roughly US$690-770 million depending on FX. Calling
              Neara a unicorn without the currency qualifier overstates the USD valuation and can distort entry and exit
              math.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV006
