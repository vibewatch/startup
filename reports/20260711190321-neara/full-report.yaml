      - number: '3.3'
        title: 'Pricing, Distribution, and Trust: Enterprise Procurement Favors Incumbents'
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a precise price-per-asset or price-per-kilometre comparison. The reviewed
              product pages mostly point to enterprise sales motions, demos or platform positioning rather than
              self-serve list pricing. That opacity matters because the buyer is a regulated utility with long security,
              integration and procurement cycles. Bentley, GE Vernova, Siemens, Schneider Electric, IBM and Hexagon can
              bundle grid-twin, ADMS, GIS, EAM, cybersecurity and support into broader enterprise agreements; they also
              bring balance-sheet credibility and existing procurement channels. Neara’s counterweight is quantified
              utility outcomes: hours-or-days modelling, ESB’s two-week insight cycle versus three to four months
              manually, and company-cited faster outage-risk and restoration metrics. The pricing diligence ask is to
              obtain actual Neara contract units and renewal mechanics, then compare them with the avoided field-survey,
