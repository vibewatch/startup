      - number: '2.4'
        title: Adoption Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market is attractive but not frictionless. Utility software adoption is slowed by long procurement
              cycles, cybersecurity and reliability review, engineering model validation, integration with legacy
              GIS/SCADA/ADMS data, and the need to persuade regulators that software savings should be recoverable.
              Traditional regulated-asset-base incentives can also create capex bias: a network may earn clearer returns
              on poles, wires, and substations than on SaaS that avoids or defers that spend, unless the price-control
              framework rewards outputs and innovation. Data standards and interoperability matter because the twin
              becomes embedded in planning decisions and switching costs rise once data is normalised. The main
              diligence gaps are therefore not whether the grid problem is real; the evidence is strong. They are
              whether Neara can convert the problem into repeatable, regulated budgets outside Australia, what share of
              the narrow USD 0.67-1.6 billion 2026 market is actually serviceable, and how quickly pilots become
              recurring platform revenue. That timing risk should be explicitly discounted in any market-led valuation
              case.
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM040
              - CM041
              - CM042
              - CM013
