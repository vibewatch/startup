      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Central adverse point: the implied revenue multiple is extreme'
            body: >-
              The A$1.1 billion headline implies roughly 106x revenue on the A$10.4 million 2024 estimate and about 55x
              even if Neara has already reached A$20 million. That gap versus 2026 SaaS and public
              infrastructure-software benchmarks is the chapter’s main valuation risk.
            calloutType: risk
            claimRefs:
              - CV013
