chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Neara is a Sydney-headquartered infrastructure software company registered as LineSoft Pty Ltd and
              operating from Redfern, New South Wales. It builds "physics-enabled digital twins" — geometrically precise
              3D models of entire infrastructure networks, principally electricity grids, that reproduce how each pole,
              conductor, and structure behaves under real-world terrain, weather, load, and vegetation conditions.
              Unlike heuristic or statistical planning tools, Neara grounds every simulation in engineering-grade
              physics, letting utilities stress-test assets against wind, ice, thermal, flood, and wildfire scenarios
              and identify hidden network capacity without building new infrastructure.


              The founding date is reported inconsistently: Neara's own materials, SmartCompany, Tracxn, and Kurrant
              cite 2016, while Forbes Australia says 2019 and TechCrunch describes a 2019 commercial launch. The most
              defensible reading is that the company was founded in 2016 and launched its product commercially around
              2019. The origin story is that co-founder Daniel Danilatos, a former Google engineer, built a tool to
              solve his wife's power-line design frustrations; it grew into a network-scale modelling platform.


              The business model is enterprise SaaS: multi-year subscription and platform agreements with electric
              utilities and network operators. Neara ingests customers' existing LiDAR, imagery, GIS, and asset records,
              builds the digital twin, then charges for simulation, risk, vegetation-management, and capacity workflows.
              Customers pay for analytics that replace months of manual field surveys with modelling delivered in hours
              or days.
