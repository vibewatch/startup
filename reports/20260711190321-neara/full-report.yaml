      - number: '5.2'
        title: Architecture, Data Pipeline, and Simulation Engine
        blocks:
          - type: paragraph
            body: >-
              The architecture is best understood as a layered utility-data operating model. At the bottom are
              customer-owned datasets: LiDAR point clouds, satellite and high-definition imagery, GIS, CAD or
              engineering specifications, inspection history, operating conditions, weather and flood data, and asset
              records. Neara’s ingestion layer reconciles those inputs by stitching, normalising, and quality-checking
              them, including identifying GIS discrepancies and unknown assets from LiDAR. The spatial model then adds
              physics context such as loads, clearances, terrain exposure, failure likelihood, line tension, and
              component dimensions. On top of that sits a scenario engine for wind, ice, thermal, flood, vegetation,
              wildfire, capacity, reconductoring, dynamic line rating, and new-build studies. EEPower’s technical
              reporting adds that Neara uses static and finite-element analysis to evaluate pole and component stress
              and can map cascading pole-failure risk. Public materials do not disclose cloud architecture, model
              runtimes, or exact MLOps implementation, so the chapter treats architecture as observable workflow
              evidence, not a source-code-level audit.
            claimRefs:
