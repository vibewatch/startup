      - number: '8.3'
        title: Bull/Base/Bear Range and Return Logic
        blocks:
          - type: paragraph
            body: >-
              The scenario work therefore uses ARR/revenue scale as the primary sensitivity rather than treating the
              Series D price as the midpoint. A bear case assumes only A$20 million of forward revenue and an 8x
              multiple, producing a A$160 million valuation and severe down-round risk. A base case assumes A$50 million
              of forward revenue and a 12x premium private multiple, producing A$600 million — still below the headline.
              The current A$1.1 billion price becomes arithmetically easier to defend only around A$75 million to A$100
              million of ARR/revenue, or if a strategic acquirer applies a scarce grid-AI premium. The bull case at
              A$100 million and 15x reaches A$1.5 billion, offering upside but demanding evidence that public sources do
              not provide: net revenue retention, gross margin, customer concentration, pipeline conversion, and
              multi-region repeatability. The correct IC posture is to underwrite a diligence-contingent price, not the
              headline, and to treat any secondary-market markup as uninvestable until audited revenue quality, contract
              durability, renewal cohorts, legal terms, and preference economics are reconciled in source documents
              reviewed by counsel, with signed customer confirmations supporting management’s growth narrative.
            claimRefs:
              - CV034
              - CV035
              - CV036
