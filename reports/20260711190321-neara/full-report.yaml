  - id: FR001
    title: Risk Heatmap
    type: matrix
    layout: standard
    summary: Severity-by-likelihood placement of Neara's top residual risks after visible public mitigations.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
        - Watch items
      rows:
        - label: Critical severity
          values:
            - ''
            - Cyber breach / critical grid data
            - Model failure in wildfire or resilience use case
            - ''
        - label: High severity
          values:
            - EU privacy-only issue
            - Regulatory evidence not accepted
            - Customer concentration and long sales cycles
            - Incumbent bundling
        - label: Medium severity
          values:
            - Founder succession
            - RAB/totex cost-recovery friction
            - Financial opacity / valuation ambiguity
            - International execution
        - label: Lower severity
          values:
            - No public lawsuit found
            - Standards mapping work
            - Data-quality remediation
            - FX headline confusion
    approximationNotes: >-
      Qualitative matrix based on public evidence; likelihood and severity should be recalibrated with customer
      contracts, security artifacts, and audited financials.
    claimRefs:
      - CR013
      - CR015
      - CR020
      - CR023
      - CR028
      - CR032
      - CR036
  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      How regulatory, data, cyber, competition, and disclosure risks flow into revenue, margin, financing, and
      valuation.
    data:
      nodes:
        - id: regulation
          label: Regulatory reform
          detail: AEMC/AEMO, FERC/NERC, NIS2/GDPR set evidence and control expectations.
        - id: data
          label: Data and model quality
          detail: LiDAR, GIS, asset records, and tail-risk models must be accurate and auditable.
        - id: cyber
          label: Cyber/privacy controls
          detail: Critical grid data increases security-review burden.
        - id: procurement
          label: Utility procurement
          detail: Long validation, RAB/totex, and incumbent comparisons shape buying.
        - id: revenue
          label: ARR timing
          detail: Delayed production deployments defer recognised software revenue.
        - id: margin
          label: Services / compliance cost
          detail: Security, integration, and model validation can raise cost to serve.
        - id: valuation
          label: Valuation support
          detail: Revenue proof and risk controls must justify A$1.1B valuation.
      edges:
        - from: regulation
          to: procurement
          label: Raises evidence bar
        - from: data
          to: procurement
          label: Needs validation
        - from: cyber
          to: procurement
          label: Security gate
        - from: procurement
          to: revenue
          label: Controls timing
        - from: procurement
          to: margin
          label: Adds services
        - from: revenue
          to: valuation
          label: Supports or breaks multiple
        - from: margin
          to: valuation
          label: Affects scalability
    approximationNotes: Directional map; does not quantify ARR impact because Neara financials are private.
    claimRefs:
      - CR003
      - CR021
      - CR024
      - CR037
      - CR038
      - CR039
      - CR040
  - id: FR003
    title: Dependency Map
    type: dag
    layout: wide
    summary: External dependencies that can slow Neara deployment or weaken competitive position despite product-market pull.
    data:
      nodes:
        - id: customers
          label: Flagship utilities
          detail: AU network utilities plus US/EU references provide proof and concentration risk.
        - id: regulators
          label: Regulators / market bodies
          detail: AEMC, AEMO, AER, FERC/NERC, EU law set expectations.
        - id: data-sources
          label: Customer data sources
          detail: LiDAR, GIS, imagery, and asset records control model quality.
        - id: incumbents
          label: Incumbent suites
          detail: Bentley, GE Vernova, and Siemens bundle adjacent capabilities.
        - id: capital
          label: Growth capital
          detail: Series D funds hiring and expansion but raises execution bar.
        - id: talent
          label: AI/ML and implementation talent
          detail: Needed to scale validation, security, and global deployments.
        - id: renewals
          label: Renewals / expansion
          detail: Private proof needed for retention and concentration assessment.
      edges:
        - from: customers
          to: renewals
          label: Proof converts to retention
        - from: regulators
          to: customers
          label: Shapes budget and evidence
        - from: data-sources
          to: customers
          label: Determines model quality
        - from: incumbents
          to: customers
          label: Competes in procurement
        - from: capital
          to: talent
          label: Funds hiring
        - from: talent
          to: customers
          label: Supports deployment
        - from: renewals
          to: capital
          label: Supports valuation
    approximationNotes: Qualitative dependency map based on public sources; customer contract terms and renewal data are not public.
    claimRefs:
      - CR015
      - CR016
      - CR022
      - CR025
      - CR026
      - CR027
      - CR033
      - CR034
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision chain showing why strong product proof still leads to a price-disciplined research-more stance.
    data:
      nodes:
        - id: proof
          label: Product/customer proof
          detail: 15M assets modeled, named utilities, TCV validation
        - id: opacity
          label: Financial opacity
          detail: No audited ARR, gross margin, NRR, concentration, or terms
        - id: stretch
          label: Implied multiple stretch
          detail: ~55-106x revenue on public estimates and assumptions
        - id: benchmarks
          label: Benchmark reset
          detail: Public and private SaaS multiples mostly far below headline implied range
        - id: diligence
          label: Data-room gates
          detail: A$75-100M ARR, 120%+ NRR, clean preferences, currency clarity
        - id: decision
          label: Recommendation
          detail: Research-more / track; do not buy at headline without proof
      edges:
        - from: proof
          to: diligence
          label: Creates reason to engage
        - from: opacity
          to: stretch
          label: Prevents clean underwriting
        - from: stretch
          to: benchmarks
          label: Must be sanity-checked
        - from: benchmarks
          to: decision
          label: Keeps stance stretched
        - from: diligence
          to: decision
          label: Could move stance to fair
    approximationNotes: null
    claimRefs:
      - CV034
      - CV035
      - CV041
      - CV046
