      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is promising strategically but incomplete financially. Neara has credible strategic buyers
              and comparables around infrastructure engineering, grid orchestration, geospatial data, and industrial
              software. GE Vernova’s GridOS and Visual Intelligence illustrate incumbent demand for grid-operating
              software, while Bentley, Autodesk, Trimble, and Hexagon show that public investors value design and
              infrastructure software franchises. However, no IPO filing, audited financials, standalone ARR, or
              disclosed M&A process exists. The kill criteria should be mechanical: ARR below A$20 million, NRR below
              110%, gross margin below 70%, top-customer concentration above 25%, weak US/Europe pipeline conversion, or
              a new financing below the A$1.1 billion headline would break the current valuation story. Conversely, the
              stance can move from stretched to fair if the data room proves A$75-100 million ARR, 120%+ NRR, strong
              gross margin, efficient CAC payback, clean preferences, and no USD/AUD mismatch in financing documents.
            claimRefs:
              - CV027
