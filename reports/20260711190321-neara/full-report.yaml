            body: >-
              Neara’s moat looks strongest when a utility has enough network data to build a high-fidelity twin but
              lacks the internal physics software and workflow automation to turn it into rapid decisions. The wedge
              compounds if Neara becomes trusted by planning, resilience, vegetation and regulatory teams and if
              customer data improves model quality over time. The adverse case is also concrete. Schneider/ETAP and
              ABB/Enline show that incumbents can partner into physics-based twins; Siemens and GE are adding AI
              planning and grid-orchestration layers; and National Grid/Atos plus PJM/Google/Tapestry show that major
              utilities can sponsor bespoke platforms with large technology partners. The resulting underwriting posture
              is “differentiated but not unassailable.” Neara needs proof that deployments expand across workflows,
