      - number: '2.2'
        title: Buyer Segments, Users, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The cleanest buyer is a regulated distribution network operator or vertically integrated utility that owns
              asset data and is accountable for reliability, resilience, vegetation management, connection studies, and
              network planning. Transmission operators are adjacent buyers where congestion, dynamic ratings,
              interconnection queues, and topology optimization create the immediate pain. Large-load developers such as
              data-centre sponsors are better treated as indirect demand drivers: they generate connection complexity
              and may fund studies or upgrades, but the network operator and regulator usually decide which modelling
              tools become system-of-record. Inside a utility, the economic sponsor is usually asset management, grid
              planning, operations, network strategy, or an innovation/regulatory team rather than the CIO alone.
              Day-to-day users are planners, engineers, vegetation and wildfire teams, resilience analysts, and
              connection-study teams. The adoption path therefore requires both technical trust and
              regulatory-cost-recovery logic; a slick AI demo is not enough.
