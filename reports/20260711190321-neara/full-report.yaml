      - number: '7.3'
        title: Commercial, Financial, and Partner-Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Neara's public traction is impressive but concentrated. Working with close to 90% of Australian network
              utilities is a strong proof point; it also means early references, implementation playbooks, and
              regulatory familiarity may be clustered in one country. International wins reduce that risk but do not yet
              reveal customer count, contract values, renewal rates, NRR, or churn. Financial opacity compounds the
              problem: public evidence contains a A$1.1 billion valuation and third-party revenue estimates, not audited
              ARR, gross margin, burn, or cohort retention. A regulated utility buyer can also face cost-recovery
              friction if digital-twin subscriptions sit in opex while physical network upgrades sit in capital plans,
              even as totex reforms try to reduce this distortion. Competitively, Neara must win against incumbent
              suites that already sit inside utility GIS, asset-management, planning, or operations stacks, allowing
              competitors to bundle, discount, and lower perceived integration risk.
