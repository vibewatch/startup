  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Neara should not be valued against the generic digital-twin market without a hard filter. The relevant
              market is the electricity-grid and critical-infrastructure slice: software that builds engineering-grade
              network twins and supports asset modelling, resilience planning, capacity studies, connection assessment,
              and vegetation or wildfire/flood workflows. Broad digital-twin reports put the cross-sector 2026 market
              around USD 26-50 billion, but those totals include manufacturing, product design, buildings, plants, and
              generic IoT twins that do not map to Neara’s buyer or workflow. The more defensible lenses are narrower:
              utilities digital-twin solutions near USD 672 million in 2026, grid digital twin near USD 0.92 billion,
              electrical digital twin around USD 1.5-1.6 billion, and the broader energy-and-power digital twin lens
              around USD 7.5 billion. The contradiction is not noise; it is the central sizing risk. Neara’s public
              materials do not disclose ARR, pricing, win rates, or target penetration, so SOM must remain a diligence
              gap rather than a spreadsheet certainty.
