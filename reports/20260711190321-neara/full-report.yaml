        title: Revenue Model and Recognition Lens
        blocks:
          - type: paragraph
            body: >-
              Neara appears to monetize as enterprise infrastructure software sold to regulated utilities and
              infrastructure owners, not as a usage-based marketplace or hardware business. The official platform page
              asks buyers to book a custom demo rather than presenting list pricing, and the product workflow begins
              with customer data ingestion, digital-twin generation, scenario simulation, and regulator-ready actions.
              That points to bespoke annual or multi-year platform contracts, likely priced by network scale, modules,
              and deployment complexity. Public sources do not disclose ARR, ACV, contract length, renewal rates,
              implementation fees, or professional-services mix. The revenue-quality implication is therefore mixed: the
              buyer pain is mission-critical and the product can touch many workflows, but revenue recognition may
              include upfront model-build or services components that would lower pure-SaaS comparability until
