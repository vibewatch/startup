        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The attractive part of Neara's model is that it is software-centric: it does not appear to require
              inventory, manufacturing scale-up, or project-finance balance-sheet exposure. The costly part is that each
              enterprise deployment depends on ingestion and quality control of LiDAR, imagery, GIS, and asset records,
