company:
  name: Neara
chapter:
  number: 8
  title: Valuation
  summary: 'Neara’s A$90 million Series D at a reported A$1.1 billion valuation is strategically credible but publicly under-supported
    by disclosed financials. The central valuation issue is the AUD-versus-USD unicorn framing and a severe implied revenue-multiple
    stretch: roughly 55-106x on public revenue estimates or assumptions versus far lower public and private SaaS benchmarks.
    The recommendation is research-more / track, not buy at the headline, unless diligence verifies A$75-100 million ARR,
    strong retention, clean preferences, and currency clarity.'
sections:
- id: recommendation-stance
  title: Recommendation, Price Discipline, and Currency Framing
  body: 'Neara is an impressive category company, but the investability answer is price-sensitive rather than company-quality-sensitive.
    The chapter recommendation is research-more / track at the public A$1.1 billion Series D headline, with a stretched valuation
    stance and medium-low confidence. The positive case is real: Neara has a differentiated physics-enabled digital twin,
    TCV-led Series D validation, deep Australian utility penetration, international named customers, and operational proof
    that the platform can unlock capacity and resilience. The problem is that public financial evidence has not caught up
    with the price. The unicorn label is also a currency trap: the best-supported reading is A$1.1 billion, not US$1.1 billion,
    making Neara a unicorn in Australian-dollar terms and roughly a US$690-770 million company on simple FX. Even so, public
    evidence does not yet justify a buy call unless diligence verifies much larger ARR, strong retention, clean preferences,
    and a premium exit path.'
