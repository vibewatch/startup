- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  - Direction
  rows:
  - - 'Thesis: category-defining grid digital twin'
    - TCV-led Series D, named global utilities, 15M assets modeled
    - Data-room proof that international expansion converts into repeatable ARR
    - Positive
  - - 'Thesis: AI/data-center/grid bottleneck tailwind'
    - Company and investor materials tie platform to energy access and grid capacity
    - Independent pipeline evidence showing urgent funded utility budgets
    - Positive
  - - 'Thesis: scarce strategic asset'
    - Bentley/GE/Autodesk/Trimble comps show public value in infrastructure software
    - Strategic acquisition interest or partner economics
    - Positive
  - - 'Anti-thesis: revenue opacity'
    - Public revenue estimates are low-confidence and inconsistent
    - Audited revenue/ARR bridge and deferred-revenue schedule
    - Negative
  - - 'Anti-thesis: multiple stretch'
    - A$1.1B over A$10.4-20M implies roughly 55-106x revenue
    - Verified ARR at A$75-100M with strong NRR
    - Negative
  - - 'Anti-thesis: currency confusion'
    - A$1.1B is an AUD unicorn headline, not US$1.1B
    - Financing certificate and investor deck with explicit currency and post-money terms
    - Negative
  - - 'Anti-thesis: private terms unknown'
    - No public liquidation preference, secondary, or ownership data
    - Full cap table, preference stack, and pro-forma dilution schedule
    - Negative
