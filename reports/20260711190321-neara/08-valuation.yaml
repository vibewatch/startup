- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR shortfall
    - Current ARR or revenue below A$20M
    - Confirms 55x+ revenue multiple and subscale commercialization
    - Avoid or demand major reset
  - - Retention weakness
    - NRR below 110%
    - Premium SaaS multiple unsupported
    - No buy without price protection
  - - Margin weakness
    - Gross margin below 70%
    - AI/service cost structure undermines SaaS premium
    - Reprice to lower software multiple
  - - Concentration risk
    - Largest customer above 25% of ARR
    - Utility proof points become concentration risk
    - Require discount and customer diversification plan
  - - Currency mismatch
    - Investor documents imply USD headline confusion
    - Headline valuation and return math unreliable
    - Pause until financing certificate reconciles
  - - Structured/down round
    - New financing below A$1.1B or with heavy preferences
    - Confirms overvaluation and preference overhang
    - Avoid common-equity exposure
  - - Pipeline slippage
    - US/Europe pipeline fails to convert over 12 months
    - Australia proof not repeatable internationally
    - Track only until repeatability shown
  notes: Triggers are diligence thresholds, not public facts. They convert the valuation stance into monitorable IC actions.
  claimRefs:
