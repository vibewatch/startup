  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR/revenue bridge
    - Monthly ARR, recognized revenue, deferred revenue, and 2024-2026 bridge
    - Determines whether the A$1.1B valuation is 10x, 20x, 55x, or 106x
    - CFO data room; reconcile to invoices
  - - Retention and expansion
    - NRR, GRR, logo churn, expansion ARR by cohort
    - Premium multiples require sticky and expanding utility spend
    - CRO/CFO cohort analysis
  - - Gross margin and delivery mix
    - COGS, services mix, cloud/AI inference cost, implementation labor
    - Confirms whether Neara has SaaS economics or services drag
    - Finance and product operations review
  - - Customer concentration
    - ARR by customer and geography; top-5 customer share
    - Utility contracts can be large and concentrated
    - Customer schedule and contract review
  - - Cap table and preferences
    - Post-Series D ownership, liquidation preferences, participation, anti-dilution, secondary sales
    - Common-equity return depends on preference stack
    - Legal review of financing docs
  - - Currency and valuation certificate
    - Signed documents specifying AUD vs USD and pre/post-money valuation
    - Central ambiguity in public unicorn coverage
    - Counsel and lead investor confirmation
  - - Pipeline conversion
    - US/UK/EU pipeline, win rates, sales cycle, ACV, backlog
    - Determines whether Australia utility penetration repeats abroad
    - Commercial diligence and customer calls
  - - Exit path
    - Strategic buyer conversations, banker materials, IPO readiness, audited statements
    - Needed to underwrite exit multiple and timing
    - Board materials and banker references
  notes: The diligence asks are intentionally financial and legal first because public product/customer evidence is stronger
    than public valuation evidence.
