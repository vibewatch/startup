  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap table and ARR data
    missingEvidence: Audited ARR/revenue bridge, gross margin, NRR, customer concentration, cap-table ownership, preference
      stack, and secondary-sale details.
    whyItMatters: These data determine whether the A$1.1 billion valuation is a fair premium or an overvalued structured round.
    diligencePath: Request CFO data room, financing certificate, customer revenue schedule, cohort retention analysis, and
      legal review of Series D documents.
    relatedQuestionRefs:
    - QV007
    - QV021
    - QV027
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table sample boundary
    missingEvidence: Full banker-quality public comp set with FactSet or Capital IQ EV, NTM revenue, growth, margin, and rule-of-40
      data for every infrastructure software peer.
    whyItMatters: The chapter uses a representative public-source sample; a full banking comp sheet would refine exact median
      and quartile multiples.
    diligencePath: Build a banker comp set from Capital IQ or FactSet and reconcile to latest quarter filings before term-sheet
      negotiation.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV013
    - QV014
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: material
    topic: Neara revenue and valuation tracker conflict
    missingEvidence: Primary company financial statements and investor deck showing actual 2024, 2025, and 2026 ARR/revenue
      and post-money valuation currency.
    whyItMatters: Public trackers conflict or are stale; using the wrong revenue base or currency can change the implied multiple
      by several turns or by hundreds of millions of dollars.
    diligencePath: Ask Neara and TCV for signed round documents, management accounts, and a reconciliation of AUD and USD
      values used in press coverage.
