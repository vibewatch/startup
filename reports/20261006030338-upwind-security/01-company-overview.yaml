chapter:
  number: 1
  title: "Company Overview"
  summary: "Upwind Security is a runtime-first cloud and AI security startup founded in 2022 by the leadership team behind Spot.io, scaling rapidly to a reported $3.8 billion valuation on $727M+ in total capital. The platform combines eBPF-based runtime sensors with agentless scanning to prioritize exploitable risks and protect live cloud workloads across modern enterprises."
sections:
  - id: "corporate-identity-and-foundational-heritage"
    title: "Corporate Identity and Foundational Heritage"
    body: "Upwind Security Ltd. is an enterprise cybersecurity software company founded in 2022 and dual-headquartered with corporate executive leadership at 140 New Montgomery Street in San Francisco, California, alongside primary research and development operations centered in Tel Aviv, Israel. The business was established by Amiram Shachar (Chief Executive Officer) alongside co-founders Liran Polak, Lavi Ferdman, and Tal Zuri (Tal Zur). The founding quartet previously established and scaled cloud infrastructure optimization pioneer Spot.io (originally Spotinst), which was acquired by NetApp for $450 million in 2020. This shared operating heritage provides Upwind with deep, battle-tested credibility across DevOps, systems programming, and large-scale enterprise cloud infrastructure architectures. Operating as a commercial venture-backed software corporation, Upwind addresses acute operational friction within enterprise security programs where static configuration scanners generate overwhelming alert volumes without confirming runtime reachability or active workload exploitability. The company positions its runtime fabric as an inside-out operating model connecting code directly to live production environments."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance-structure"
    title: "Executive Leadership and Governance Structure"
    body: "Upwind operates under a founder-led executive management structure augmented by veteran cybersecurity and cloud infrastructure operators. Chief Executive Officer Amiram Shachar directs corporate vision and strategic capital allocation, supported by co-founders Liran Polak, Lavi Ferdman, and Tal Zuri heading engineering, product, and platform architecture. In June 2025, the company expanded its executive bench by appointing Rinki Sethi as Chief Security Officer, bringing senior security governance pedigree from prior leadership posts at Twitter, Walmart, and PayPal. Product and go-to-market execution is further supported by Senior Vice President of Platform Dan Yahav and advisory counsel including former Uber and Cloudflare Chief Security Officer Joe Sullivan. Key-person dependency centers heavily on Shachar and his core founding circle due to their foundational role in intellectual property development and multi-round venture syndication. Corporate governance reflects significant early investor representation led by Cyberstarts founder Gili Raanan alongside Bessemer Venture Partners partner Elliott Robinson, Greylock partner Saam Motamedi, and Craft Ventures partner Michael Robinson."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO015"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-history-and-commercial-scale"
    title: "Capitalization History and Commercial Scale"
    body: "Upwind's capitalization reflects rapid multi-stage valuation expansion, advancing from an initial $27.4 million Seed round in September 2022 led by Cyberstarts to a $50 million Seed extension in September 2023 led by Greylock, and a $100 million Series A in December 2024 led by Craft Ventures. In January 2026, Upwind achieved unicorn status by securing a $250 million Series B financing round led by Bessemer Venture Partners at a $1.5 billion valuation, bringing cumulative funding to $430 million. Later corporate and venture activity in 2026—including strategic backing from Salesforce Ventures and a reported $300 million venture round in September 2026—further expanded reported cumulative funding to $727M+ and elevated reported post-money valuation marks to $3.8 billion. Commercial traction scaled briskly alongside capital formation: Upwind reported 900% year-over-year revenue expansion and 200% customer logo growth entering 2026, serving more than 200 enterprise customers including Waste Management, Siemens, Peloton, Roku, ClickUp, and Nubank. Global headcount grew from approximately 150 to over 300 employees across offices in the United States, Israel, the United Kingdom, and Iceland. However, private operating metrics such as annual recurring revenue, net retention rates, and gross margins remain undisclosed."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO013"
      - "CO016"
    figureRefs:
      - "FO001"
