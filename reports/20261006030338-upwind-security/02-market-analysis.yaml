callouts:
  - calloutType: "insight"
    title: "The Runtime Context Paradigm Shift"
    body: "The central catalyst in modern cloud security is the transition from static, snapshot-based visibility to runtime intelligence. Static scanning generates extensive theoretical vulnerability inventories that overburden SecOps teams. By validating whether vulnerable packages are loaded into active memory or exposed to live network traffic via eBPF, runtime-first architectures achieve up to 98% alert reduction, transforming security from a passive compliance audit into active operational defense."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM010"
  - calloutType: "risk"
    title: "Incumbent Suite Bundling and Agent Deployment Resistance"
    body: "Despite technical advantages, runtime platforms encounter two friction points: enterprise resistance to deploying sensors in mission-critical production kernels, and aggressive pricing pressure from incumbents (such as Palo Alto Networks and Microsoft) bundling posture tools into broader enterprise licensing agreements."
    claimRefs:
      - "CM002"
      - "CM012"
