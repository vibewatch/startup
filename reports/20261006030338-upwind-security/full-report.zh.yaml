  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创始基因
        blocks:
          - type: paragraph
            body: >-
              Upwind Security Ltd. 是一家 2022 年成立的企业网络安全软件公司，公司高管办公地点位于美国加州旧金山 New Montgomery Street 140
              号，主要研发运营则集中在以色列特拉维夫，形成双总部布局。公司由 Amiram Shachar （首席执行官）与联合创始人 Liran Polak、Lavi Ferdman 和 Tal Zuri（Tal
              Zur）共同创立。四位创始人此前创办并 做大云基础设施优化先驱 Spot.io（原名 Spotinst），该公司于 2020 年以 $450 million 被 NetApp 收购。这段 共同经历让 Upwind
              在 DevOps、系统编程和大型企业云基础设施架构方面具备经过实战检验的深厚可信度。作为商业化、 获风投支持的软件公司，Upwind 解决企业安全项目中的核心运营摩擦：静态配置扫描器会制造海量告警，却无法确认
              运行时可达性或工作负载是否真的可被利用。公司将运行时技术层定位为一种由内向外的运营模式，把代码直接连接到 生产环境。
