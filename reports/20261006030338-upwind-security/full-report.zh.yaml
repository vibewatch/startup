              Upwind 采用创始人主导的管理结构，并吸纳资深网络安全和云基础设施运营者。首席执行官 Amiram Shachar 负责公司 愿景和战略资金配置；联合创始人 Liran Polak、Lavi Ferdman
              和 Tal Zuri 分别领导工程、产品和平台架构。2025 年 6 月，公司任命 Rinki Sethi 为首席安全官，进一步充实高管团队；她此前曾在 Twitter、Walmart 和 PayPal 担任
