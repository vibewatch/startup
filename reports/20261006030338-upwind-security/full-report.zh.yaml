  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              随着企业从割裂的安全单点产品转向统一的云原生应用保护平台（CNAPP），云安全可服务市场正在重构。可服务
              边界包括企业在云安全态势管理（CSPM）、云工作负载保护平台（CWPP）、云检测与响应（CDR）、云基础设施 权限管理（CIEM）、API 安全以及容器 / Kubernetes 防护上的预算。Upwind
              专门切入基础设施态势与实时执行遥测 的交叉地带，靠轻量 eBPF 传感器和无代理云集成搭建“由内向外”的运行时架构。传统无代理扫描器从“由外向内”检查
              快照，制造数千条假设性告警积压，却看不到活跃进程执行、内存威胁或实时网络连接。传统终端检测与响应（EDR）、
              广义安全信息与事件管理（SIEM）及本地网络防火墙仍是独立预算项，不属于核心工作负载安全范围。现有平台套件、 云厂商原生工具（如 Microsoft Defender for Cloud）以及 DevOps
              内部人工分诊，也继续阻碍单独采购。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
