      - number: '2.2'
        title: TAM、SAM 与多口径规模分析
        blocks:
          - type: paragraph
            body: >-
              评估 Upwind 的市场潜力，必须把广义自上而下的网络安全行业预测，与受证据约束的工作负载细分市场分开。 Frost & Sullivan 估计全球 CNAPP 市场到 2029 年将扩大至 $18.79
              billion，年复合增长约 28%。ISMG 汇总的 行业指南显示，当前估值区间为 $3.4 billion 至 $10.6 billion；在 20% 至 35% 的年复合增长率下，激进长期 预测到 2030
              年代初可达 $38 billion 至 $88 billion。自下而上估算只计算运行时工作负载代理和态势引擎的软件 许可，上限预测则把云身份治理、软件供应链安全和开发者流水线扫描也算入。对 Upwind
              而言，眼下 SAM 受限于在 AWS、Azure 和 GCP 上运行容器化、Kubernetes 及现代 API 架构的企业多云组织。更窄的 SOM 口径聚焦拥有专门
              云平台安全团队、饱受告警疲劳且优先运行时可利用性过滤而非被动审计打勾的中大型企业。Gartner 预计，到 2029 年， 在云服务商环境中实施零信任的企业里有 40% 会依赖 CNAPP
              平台获得高级可见性和运营控制，说明长期趋势仍强劲， 尽管规模估算分歧很大。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
