      - number: '5.2'
        title: 内核级架构、eBPF 遥测与跨平台工程
        blocks:
          - type: paragraph
            body: >-
              Upwind 的技术底座是 Extended Berkeley Packet Filter（eBPF），以轻量守护进程传感器部署，通常作为 Kubernetes DaemonSet
              分布在各主机节点。把沙箱程序直接挂到 Linux 内核 tracepoint 和 kprobe 上，Upwind 无需加载不稳定的 out-of-tree
              内核模块或运行沉重的用户态监控代理，就能细致观察系统执行。传感器在底层拦截 execve、connect、 accept4 和 openat
              等关键系统调用，让运行时上下文引擎实时检查进程创建、内存映射和网络套接字通信，主机开销 极低（通常 CPU 占用低于 1%）。


              除 Linux 容器环境外，Upwind 也在扩展传感器架构，支持 Windows 操作系统和跨平台企业环境。工程团队使用系统编程 语言（C、C++、C#）、Windows Kernel Drivers 和
              WMI 安全框架构建原生 Windows 传感器，在异构云环境中提供一致 的网络监控、进程跟踪和文件完整性监控。后端平台服务使用 Go，配合关系型数据库（PostgreSQL、MySQL）、gRPC
              通信和分布式消息系统，支持高并发事件摄取、幂等处理与自动重试。


              在网络和应用层，Upwind 通过挂接内核套接字函数（如 tcp_sendmsg），在传输加密前或解密后检查 HTTP 和 gRPC 请求载荷，为微服务和加密 Service Mesh（如 Istio
              mTLS）提供 Layer 7 可见性。原始内核遥测会通过内存中的 Kubernetes 元数据查找表即时丰富，把进程 ID（PID）绑定到 pod 名称、命名空间、服务账户和部署标签。平台随后 根据观测到的
              TCP、UDP 流构建动态运行时拓扑图，而不是静态基础设施即代码清单，建立行为基线，并区分活跃的外部 攻击面与仅供内部通信的通道。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
