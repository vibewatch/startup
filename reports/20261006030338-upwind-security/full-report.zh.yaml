      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 运行时上下文带来的范式转移
            body: >-
              现代云安全的核心变化，是从静态、基于快照的可见性转向运行时智能。静态扫描会生成庞大的理论漏洞清单，压垮 SecOps 团队。运行时优先架构借助 eBPF
              验证易受攻击的软件包是否载入活跃内存、是否暴露在实时网络流量中，最多 可减少 98% 的告警，把安全从被动合规审计变成主动运营防御。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM010
          - type: callout
            title: 现有套件捆绑与代理部署阻力
            body: >-
              尽管技术上有优势，运行时平台仍面对两道阻力：企业不愿在关键生产内核中部署传感器；现有厂商（如 Palo Alto Networks 和
              Microsoft）把态势工具捆绑进更广泛的企业许可协议，带来激进的价格压力。
            calloutType: risk
            claimRefs:
              - CM002
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局分类与市场动态
        blocks:
          - type: paragraph
            body: >-
              云安全市场正在激烈整合，企业希望把割裂的单点方案合并成统一的云原生应用保护平台（CNAPP）。组织饱受告警 疲劳，常被数万条静态态势告警淹没，而这些告警无法说明漏洞是否能在生产环境中被实际利用。Upwind 以
              eBPF 传感器和无代理发现为基础，直接用由内向外、运行时优先的范式对抗现状。竞争主要分四类：靠无代理快照扫描 早早占据优势的态势型 CNAPP 龙头 Wiz 和 Orca
              Security；通过多产品套件和收购进入云工作负载的传统企业网络与 终端巨头 Palo Alto Networks（Prisma Cloud）和 CrowdStrike（Falcon Cloud
              Security）；AWS、Microsoft Defender for Cloud、Google Cloud 的云厂商原生控制；以及 Prowler、Steampipe、Snyk 等开源或开发者优先工具。
              静态扫描器能发现配置错误，但 Upwind 的技术判断是依靠实时执行上下文，将运营噪声降低约 95% 至 98%。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
