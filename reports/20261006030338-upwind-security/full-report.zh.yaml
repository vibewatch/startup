      - number: '3.2'
        title: 竞争对手画像、架构与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              将 Upwind 与成熟同行比较，可以看到静态“由外向内”态势评估和持续“由内向外”内核检查之间的根本架构差异。 Wiz 等现有厂商通过无代理 API
              连接器检查磁盘快照和配置状态，因而无需工作负载代理即可快速部署并渗透市场。 但静态检查天生看不到活跃内存执行、进程谱系、实时网络连接和无服务器调用。相比之下，Upwind 把轻量 eBPF 传感器直接嵌入
              Linux 内核，并接入云厂商 API，在 Kubernetes 集群和无服务器函数中追踪精确的系统调用、文件 访问和网络套接字。它还把实时函数执行映射到 SOC 2、CIS
              等合规框架，并自动切断恶意进程。Palo Alto Networks 等传统基础设施巨头则通过连续收购拼出广泛能力，却常让企业面对割裂的代理架构、不同的用户界面和多 SKU 采购复杂度。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
