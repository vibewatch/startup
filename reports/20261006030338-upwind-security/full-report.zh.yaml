  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运行时驱动的 CNAPP 与客户安全工作流
        blocks:
          - type: paragraph
            body: >-
              Upwind Security 提供统一的云安全平台，核心是运行时驱动的安全：从传统静态态势扫描和磁盘快照，转向实时执行监控。 现代企业 DevSecOps
              和安全运营团队被传统云安全态势管理（CSPM）工具制造的告警疲劳拖垮；这些工具基于理论漏洞或 配置错误生成数千条严重告警，却不验证工作负载是否可达或确实执行。Upwind 把云安全态势管理、运行时上下文和实时
              防护结合起来，让安全团队准确排出真实攻击路径的优先级，并压制休眠或不可达软件包的告警。


              平台通过集中式 Management Console 使用，统一管理企业安全工作流，覆盖 Inventory、Configurations、Attack
              Surface、Vulnerabilities、Threats、Code、Identities、API Security、Data Security、Feed 和 AI workloads。
              开始使用时，客户需连接 AWS、Azure、Google Cloud Platform 账户，把 Upwind 传感器部署到 Kubernetes 集群和 主机环境，并配置数据源及向现有
              DevSecOps、SIEM 流水线转发事件。Upwind 在 Management Console 内提供全天候 在线聊天支持，也提供邮件支持和共享客户 Slack
              频道，让安全工程师在部署和调查事件时直接与支持团队协作。
