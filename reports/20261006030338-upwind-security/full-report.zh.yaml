      - number: '3.3'
        title: 商业包装、护城河耐久性与不利风险
        blocks:
          - type: paragraph
            body: >-
              商业进入市场的方式是企业云安全的关键战场。行业巨头通常采用分层、模块化许可和复杂的多 SKU 目录：核心态势
              能力（CSPM）还要为工作负载保护（CWPP）、身份管理（CIEM）或云检测与响应（CDR）购买昂贵增购模块。Upwind 用全包单 SKU
              企业定价直接攻打这一摩擦，提供完整套件——包括运行时威胁检测和托管检测与响应（MDR）支持—— 不做功能分级，也不收意外增购费。但它仍面临实质性的运营和架构阻力。独立服务监控在滚动 90 天内记录了 9 次
              服务降级和事件，受影响最大的是第三方集成和外部服务。Upwind 依赖 AWS、Azure、Google Cloud 的持续运行时 遥测摄取及云厂商 API
