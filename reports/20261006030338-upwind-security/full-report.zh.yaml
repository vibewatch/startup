          to: ebpf_sensors
        - from: ebpf_sensors
          to: procurement_channel
        - from: procurement_channel
          to: contracted_arr
        - from: contracted_arr
          to: cogs_infrastructure
        - from: cogs_infrastructure
          to: net_gross_profit
