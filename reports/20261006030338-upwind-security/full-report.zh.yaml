      - number: '2.3'
        title: 买方画像、增长驱动与企业约束
        blocks:
          - type: paragraph
            body: >-
              企业采购现代云安全产品是多方达成共识的过程，参与者包括首席信息安全官（CISO）、中央云安全架构师以及站点 可靠性 / DevOps 平台工程师。经济预算通常由 CISO
              或信息安全副总裁掌握，但运营决策权和否决权在平台工程团队 手中；他们要求性能开销最低，且生产工作负载绝不能中断。主要采用驱动包括严重的告警疲劳——客户称引入运行时 上下文后告警噪声最多降低 98%，无关 CVE
              减少 60%——以及关键工作负载快速迁移到短生命周期 Kubernetes 和无 服务器架构。生成式 AI 架构和 agentic 框架也带来静态态势扫描器无法检查的新型运行时攻击面。企业不愿部署工作 负载内核或
              eBPF 代理、与现有平台签订的多年协议、漫长的采购周期，以及欧美行业要求生产上线前取得大量合规认证， 都限制了采用。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
