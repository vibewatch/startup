  - id: FI001
    title: Upwind 企业收入与毛利率桥接
    type: flow
    summary: 结构化流程图示意客户基础设施部署如何转化为签约订阅收入和毛利。
    data:
      nodes:
        - id: cloud_deployment
          label: 企业工作负载：Kubernetes 集群、主机与云账户
        - id: ebpf_sensors
          label: eBPF 运行时遥测：本地系统调用拦截与过滤
        - id: procurement_channel
          label: 采购渠道：直销或 AWS Marketplace CPPO
        - id: contracted_arr
          label: 签约 ARR：年度订阅许可（$50M-$60M 运行率）
        - id: cogs_infrastructure
          label: COGS：中心云计算、数据摄取与模型推理
        - id: net_gross_profit
          label: 毛利：未披露的 SaaS 贡献利润率
      edges:
