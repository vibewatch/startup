        - SecOps 与 SOC 工程师
        - 生产环境 / 高
        - 借助 eBPF 在内核层拦截系统调用，做到亚秒级自动阻断并以 SIGKILL 隔离
        - 需要在工作节点上取得特权 DaemonSet 访问权限，给受限集群带来部署阻力
      - - 上下文感知的漏洞优先级排序
        - 安全工程师与 AppSec
        - 生产环境 / 高
        - 对未映射到活跃进程内存或已与网络入口隔离的软件包，抑制其 CVE 告警
        - 效果取决于传感器覆盖范围；未插桩的工作负载只能退回静态仓库扫描
      - - 云安全态势管理（CSPM）
        - 云安全与合规团队
        - 生产环境 / 成熟
        - 持续摄取多云 API，并与实时运行时流量和身份遥测数据关联
        - 如果云 IAM 凭证过期，复杂多云环境仍会产生配置漂移
      - - API 与 L7 应用检测和响应（ADR）
        - AppSec 与平台团队
        - 生产环境 / 中等
        - 无需 sidecar 或 TLS 终止代理，即可在内核套接字层检查未加密的 L7 gRPC/HTTP 载荷
        - 专有协议和定制二进制序列化格式需要专门开发解析器
      - - 身份与权限分析（CIEM）
        - 身份与云架构师
        - 生产环境 / 中等
        - 将有效 IAM 权限与观测到的运行时条件键及请求上下文关联
        - 自动生成最小权限策略需要大量预发布测试，以免破坏生产 API
      - - AI 安全与 MicroVM 工作负载监控
        - AI 平台与 SecOps 团队
        - 新兴 / 主动研发
        - 监控自主 AI 代理的运行时行为、MicroVM 隔离，以及流入 Snowflake/Bedrock 的数据管道
        - 自主代理的新型攻击模式缺少标准化基准评估套件
