      - number: '5.3'
        title: 竞争护城河、信任控制与技术依赖风险
        blocks:
          - type: paragraph
            body: >-
              Upwind 与 Wiz、Orca Security 等第一代 CNAPP 巨头及 Sweet Security 等运行时竞争者的差异，在于它执行自动威胁 阻断和执行事实，而不只依赖定期 API 轮询。检测到异常
              kill chain 或容器逃逸尝试时——例如非特权 Web 容器调用 nsenter 或 setns，或通过 /proc/self/exe 覆写主机 runc 二进制——运行时引擎可自动触发遏制策略，执行内核
              SIGKILL 终止，或隔离已被攻陷的 Kubernetes 节点，在微秒级阻止横向移动。


              企业信任与保障控制以 Upwind 官方 Trust Center（由 SafeBase 提供支持）为锚点，向经审核的客户和潜在客户直接 提供合规认证、安全文档和态势更新。Upwind 的安全研究团队还通过
              Upwind Feed 发布威胁情报和云研究，揭示包括 未公开 AWS IAM 条件键、AWS Organization 管理账户暴露路径、AWS Bedrock AgentCore microVM
              隔离边界和供应链 威胁在内的新型云攻击技术。


              但技术尽调也显示出明显的架构和运营取舍。部署特权 eBPF DaemonSet 或 Windows 内核驱动，会让偏好无代理快照 扫描的保守型平台工程团队产生阻力。虽然 Upwind 核心服务过去 90
              天的运营可用性为 99.95%，第三方状态跟踪显示 曾发生间歇性降级，最常影响第三方集成流水线和出站事件分发。买方还应注意，刚起步的 CDR 类别尚无公开的独立 第三方 MITRE ATT&CK
              基准审计，企业评估者必须通过内部生产环境概念验证，直接验证运行时传感器开销和检测效果。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: 展示
        blocks:
          - type: callout
            title: 运行时上下文作为告警抑制过滤器
            body: Upwind 的核心架构前提是：存在漏洞不等于能够被利用。它用 eBPF 探针检查易受攻击的共享库（.so）是否真的载入 运行中进程的内存段、是否暴露给网络入口，从而过滤静态 CSPM 工具常见的不可达风险。
            calloutType: insight
            claimRefs:
              - CE001
              - CE006
              - CE007
          - type: callout
            title: 主机代理占用与第三方运营漂移
            body: >-
              部署内核级 eBPF DaemonSet 和 Windows 内核驱动能带来深度实时可见性，但相较纯无代理扫描会引发组织阻力。此外，
              状态跟踪显示周期性事件降级主要影响第三方服务集成，必须持续监控，才能保证外部告警路由可靠。
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE016
