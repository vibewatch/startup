  - id: FE001
    title: Upwind 运行时优先云安全架构
    type: stack
    summary: 分层架构展示从主机内核遥测、上下文丰富到高管安全工作流的转变。
    data:
      layers:
        - label: 高管工作流与安全运营
          detail: 统一界面覆盖漏洞、威胁、API 安全、代码和资产清单，并支持事件响应协作
          modules:
            - 统一管理控制台
            - DevSecOps 与告警集成
        - label: 态势发现与治理
          detail: 无代理多云 API 摄取覆盖 AWS、Azure 和 GCP，追踪配置基线漂移和审计框架
          modules:
            - 云安全态势管理
            - 合规与基础设施即代码扫描
        - label: 风险分析与异常检测
          detail: 动态计算攻击路径，并以行为机器学习基线关联配置态势与实时执行
          modules:
            - 基于图的风险分析
            - 行为 AI 威胁模型
        - label: 上下文丰富与拓扑
          detail: 将原始内核 PID 执行数据绑定到 Kubernetes pod、命名空间和云 IAM 身份，同时重建实时 L4/L7 流
          modules:
            - 运行时上下文引擎
            - 动态拓扑引擎
        - label: 应用与身份精确性
          detail: 深入分析第 7 层 gRPC/HTTP 套接字载荷并评估 IAM 条件键，追踪实际资源数据流
          modules:
            - API 安全与 ADR
            - 身份与权限分析
        - label: 内核遥测与主机探针
          detail: 钩取 execve、connect 和 socket 函数的内核跟踪点，CPU 开销低于 1%，并配合跨平台 Windows 传感器
          modules:
            - Linux eBPF 传感器
            - 跨平台 Windows 传感器
    approximationNotes: 逻辑架构层根据已发布的平台技术文档和工程规格分类。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户采用与扩展旅程图
    type: journey-map
    summary: 展示企业从运行时评估到生态集成，再到自动化智能体 SecOps 扩展的五阶段旅程。
    data:
      nodes:
        - id: stage-1
          label: 初步评估
          detail: CISO 优先关注运行时可被利用性，而非告警噪声
        - id: stage-2
          label: 技术评估
          detail: 云安全团队测试 API 可见性和 eBPF 内核遥测
        - id: stage-3
          label: POC 与生产部署
          detail: 在 Kubernetes 和容器中部署轻量级 eBPF 传感器
        - id: stage-4
          label: 核心威胁检测
          detail: 运行时 API 活动、应用层可见性和漏洞优先级
        - id: stage-5
          label: 平台扩展
          detail: 增加可观测性、配置和智能体 AI 事件修复
        - id: stage-6
          label: 生态集成
          detail: 接入 SIEM/SOAR、Cisco Cloud Control MCP 和伙伴工作流
    approximationNotes: 旅程阶段综合自已发布的客户架构、案例研究工作流和 Technology Alliances 项目结构。
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 用严重性对比可能性的矩阵，映射主要运营、财务和架构风险类别。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重性：危急
          values:
            - label: 管理账户失陷
              detail: 云端特权 root 角色泄露
            - label: 供应链恶意注入
              detail: 生态软件包投毒
            - label: 超大规模云平台挤压
              detail: 激进的原生捆绑
        - label: 严重性：高
          values:
            - label: 传感器内核开销
              detail: 生产环境对 eBPF 犹豫
            - label: 估值倍数压缩
              detail: 增长落后于 $3.8B 估值节奏
            - label: 上游集成降级
              detail: 第三方云服务中断
        - label: 严重性：中
          values:
            - label: 跨境遥测摩擦
              detail: 美国与以色列双重监管合规
            - label: 云伙伴限流
              detail: 深度机群扫描的 API 速率限制
            - label: 企业支持扩展
              detail: 员工扩张压力
        - label: 严重性：低
          values:
            - label: 公共事件报告延迟
              detail: Statusfield 报告延迟
            - label: 轻微无代理同步滞后
              detail: 区域资产清单刷新滞后
            - label: 开发者门户文档缺口
              detail: API 目录参考更新
        - label: 严重性：信息性
          values:
            - label: 常规 IAM 策略漂移
              detail: 角色策略轻微变更
            - label: 非关键 CVE 噪声
              detail: 无法触达的库告警
            - label: 区域中断遥测缓冲
              detail: 本地队列缓冲
        - label: 残余严重性
          values:
            - label: 云账户重命名
              detail: 账户元数据重标记
            - label: 二次令牌失效
              detail: 标准凭据轮换
            - label: 遥测压缩开销
              detail: 边缘计算处理器周期
    approximationNotes: 概率与严重性分类综合了事件指标、融资条款和架构要求。
    claimRefs:
      - CR002
      - CR006
      - CR007
      - CR010
      - CR011
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条定性决策链将融资、运营信号，与评估本报告估值所需但尚未取得的证据分开。
    data:
      nodes:
        - id: financing-signal
          label: $300M 融资
          detail: 独立资料称，2026 年 9 月完成了一轮估值 $3.8B 的融资。
        - id: traction-signal
          label: 已报告的增长表现
          detail: 公司报告称，收入增长 900%，客户 logo 数增长 200%。
        - id: product-signal
          label: 产品动向
          detail: 官方信息流显示，公司继续拓展云、AI、数据、身份和代码领域。
        - id: financial-gap
          label: 缺失的财务分母
          detail: ARR、留存率、利润率、盈利能力和 EV/收入均未披露。
        - id: terms-gap
          label: 缺失的融资条款
          detail: 优先权、参与权、老股转让和完全摊薄后持股条款均属非公开信息。
        - id: decision
          label: 继续研究
          detail: 置信度中等、风险高；以本报告估值为准，估值立场偏激进。
      edges:
        - from: financing-signal
          to: traction-signal
        - from: traction-signal
          to: product-signal
        - from: product-signal
          to: financial-gap
        - from: financial-gap
          to: terms-gap
        - from: terms-gap
          to: decision
    approximationNotes: 这条流程是定性的，不赋予权重、转化率、估值区间或概率。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV012
      - CV015
      - CV016
