  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的经常性收入、留存率、利润率和客户证据验证所报告的增长
        - 当前 $3.8B 估值只有在有可信的高于入场价退出路径时才可纳入投资判断；没有公开数据区间可供支持
        - 独立验证的客户群数据和有利融资条款会强化该情景
        - 增长被证明集中度高、利润率低，或主要由促销驱动
      - - 基准
        - 产品采用继续推进，但财务和股东表证据仍属非公开
        - 公开证据无法支持可靠的数值区间；继续研究或寻求更低入场价
        - 与当前留存证据最一致
        - 下一轮融资前披露没有改善
      - - 悲观
        - 增长质量、续约或利润率不足以支撑非公开市场重估
        - 大幅减记或下轮融资；公开记录无法支持估值下限
        - 若融资条款更具保护性或严重事件持续，概率上升
        - 下轮融资、续约客户群疲弱，或高级优先权形成压力
    notes: 情景是有条件的分析框架，不是预测；留存证据没有提供概率、ARR 估计、倍数、目标回报或公允价值区间的地方，不作臆测。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
figures:
  - id: FO001
    title: Upwind 公司与资本化里程碑时间线
    type: timeline
    summary: 按时间梳理 Upwind 从 2022 年到 2026 年的成立、融资轮、战略收购和生态集成。
    data:
      items:
        - label: September 2022
          detail: Upwind 由 Amiram Shachar 和 Spot.io 创始团队创立；在 Cyberstarts 领投下筹得 $27.4M Seed。
          tone: positive
        - label: September 2023
          detail: 在 Greylock 领投下获得 $50M Seed 扩展轮，用于扩大 eBPF 运行时传感器平台开发。
          tone: positive
        - label: November 2024
          detail: 随着企业客户采用加速，员工规模达到约 160 人。
          tone: neutral
        - label: December 2024
          detail: 完成由 Craft Ventures 领投、TCV 和 Alta Park 参与的 $100M Series A 融资。
          tone: positive
        - label: April 2025
          detail: 收购嵌入式安全初创公司 Nyx Security，将代码级异常检测注入 CNAPP。
          tone: positive
        - label: June 2025
          detail: 任命前 Twitter、Walmart 和 PayPal 高管 Rinki Sethi 为首席安全官。
          tone: positive
        - label: January 2026
          detail: 在 $1.5B 估值下完成由 Bessemer Venture Partners 领投的 $250M Series B；报告同比增长 900%。
          tone: positive
        - label: March 2026
          detail: 获得 Salesforce Ventures 的战略投资，估值标记升至约 $1.6B。
          tone: positive
        - label: June 2026
          detail: 宣布通过 Model Context Protocol (MCP) 与 Cisco Cloud Control 原生集成运行时能力。
          tone: positive
        - label: September 2026
          detail: 运营监测记录 90 天窗口内发生 9 起服务事件；据报道估值标记为 $3.8B。
          tone: warning
    approximationNotes: 日期和里程碑反映正式公司新闻稿、投资追踪数据库和运营遥测日志。
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO010
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 云与 AI 运行时安全可服务市场规模金字塔
    type: pyramid
    summary: 从企业云支出总额逐层缩小到 Upwind 可服务、可获取机会的云安全可服务市场范围。
    data:
      items:
        - label: 总体可服务市场（TAM）：全球 CNAPP 与工作负载保护
          value: 18790
          unit: USD M
          detail: Frost & Sullivan 预计 2029 年全球 CNAPP 市场为 $18.79B；ISMG 预测 2030 年代可达 $38B-$88B。
          tone: neutral
        - label: 相邻可服务市场：云安全态势与合规
          value: 10600
          unit: USD M
          detail: 当前 CNAPP 市场指南估值的上限，纳入完整 CSPM、CIEM 和 IaC 扫描。
          tone: neutral
        - label: 核心专用 CNAPP 软件许可
          value: 3400
          unit: USD M
          detail: 当前 CNAPP 市场指南估值的下限，仅限专用云保护平台。
          tone: neutral
        - label: 可服务可触达市场（SAM）：多云与企业 Kubernetes
          value: 7000
          unit: USD M
          detail: 当前企业组织在容器化、多云和 API 密集型工作负载上的可服务支出。
          tone: neutral
        - label: 可服务可获取市场（SOM）：运行时优先与 AI 云工作负载
          value: 1200
          unit: USD M
          detail: 运行时架构近期可触达的支出，面向减少告警分诊和防护 AI 工作负载。
          tone: positive
        - label: 近期高意向细分市场：云原生与受监管企业
          value: 450
          unit: USD M
          detail: 面临严重告警疲劳、且有主动采用 eBPF 运行时传感器需求的目标层。
          tone: positive
    approximationNotes: TAM 直接锚定 Frost & Sullivan 对 2029 年 $18.79B 的预测；SAM 和 SOM 是受证据约束的估算，反映企业多云组织中可触达的子集。
    claimRefs:
      - CM005
      - CM006
      - CM014
