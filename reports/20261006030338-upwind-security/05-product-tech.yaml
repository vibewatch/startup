callouts:
  - calloutType: "insight"
    title: "Runtime Context as an Alert Suppression Filter"
    body: "Upwind's fundamental architectural premise is that vulnerability presence does not equal exploitability. By using eBPF probes to check whether a vulnerable shared library (.so) is actually loaded into a running process's memory segment and exposed to network ingress, Upwind filters out non-traversable risks that plague static CSPM tools."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE007"
  - calloutType: "risk"
    title: "Host Agent Footprint and Third-Party Operational Drift"
    body: "Deploying kernel-level eBPF DaemonSets and Windows kernel drivers delivers deep real-time visibility but introduces organizational resistance compared to pure agentless scanning. In addition, status tracking reveals periodic incident degradations primarily impacting third-party service integrations, which must be monitored to ensure reliable external alert routing."
    claimRefs:
      - "CE006"
      - "CE008"
      - "CE016"
