  title: "Product & Technology"
  summary: "Upwind delivers an eBPF-powered, runtime-first Cloud-Native Application Protection Platform (CNAPP) that pairs continuous Linux kernel syscall interception with Kubernetes context and dynamic topology mapping to reduce vulnerability noise and accelerate real-time threat interdiction."
sections:
  - id: "product-overview-and-workflow"
    title: "Runtime-Powered CNAPP and Customer Security Workflows"
    body: "Upwind Security provides a unified cloud security platform that operates on the core principle of runtime-powered security, moving away from legacy static posture scanning and disk snapshotting toward live execution monitoring. Modern enterprise DevSecOps and security operations teams face crippling alert fatigue driven by traditional Cloud Security Posture Management (CSPM) tools, which generate thousands of critical alerts based on theoretical vulnerabilities or misconfigurations without verifying actual workload reachability or execution. Upwind addresses this operational bottleneck by combining cloud security posture management with runtime context and real-time protection, allowing security teams to accurately prioritize real attack paths and suppress alerts for dormant or unreachable packages.\n\nThe platform architecture is accessed through a centralized Management Console that organizes enterprise security workflows across key operational domains: Inventory, Configurations, Attack Surface, Vulnerabilities, Threats, Code, Identities, API Security, Data Security, Feed, and AI workloads. Getting started requires connecting cloud provider accounts (AWS, Azure, Google Cloud Platform), deploying Upwind sensors directly into Kubernetes clusters and host environments, and configuring data sources and outbound event forwarding into existing DevSecOps and SIEM pipelines. Upwind provides 24/7 live chat support directly within the Management Console, along with email support and shared customer Slack channels, enabling security engineers to collaborate directly with Upwind support during deployment and incident investigations."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-operating-model"
    title: "Kernel-Level Architecture, eBPF Telemetry, and Cross-Platform Engineering"
    body: "Upwind's underlying technical foundation relies on Extended Berkeley Packet Filter (eBPF) technology deployed as lightweight daemon sensors, typically structured as Kubernetes DaemonSets across host nodes. By attaching sandboxed programs directly to Linux kernel tracepoints and kprobes, Upwind achieves granular visibility into system execution without loading unstable out-of-tree kernel modules or running heavy user-space monitoring agents. The sensors intercept critical system calls at the metal—including execve, connect, accept4, and openat—allowing the runtime context engine to inspect process creation, memory mappings, and network socket communication in real time with negligible host overhead (typically under 1% CPU utilization).\n\nBeyond Linux container environments, Upwind is actively expanding its sensor architecture to support Windows operating systems and cross-platform enterprise environments. The engineering organization builds native Windows OS sensors utilizing systems programming languages (C, C++, C#), Windows Kernel Drivers, and WMI security frameworks to deliver parity in network monitoring, process tracking, and file integrity monitoring across heterogeneous cloud estates. Backend platform services are built in Go, leveraging relational databases (PostgreSQL, MySQL), gRPC communications, and distributed messaging systems designed for high-concurrency event ingestion, idempotency, and automated retry mechanisms.\n\nAt the network and application layer, Upwind provides Layer 7 visibility into microservices and encrypted Service Meshes (such as Istio mTLS) by hooking into kernel socket functions (such as tcp_sendmsg) to inspect HTTP and gRPC request payloads before transport encryption or after decryption. This raw kernel telemetry is enriched instantly through in-memory Kubernetes metadata lookup maps, binding process IDs (PIDs) to pod names, namespaces, service accounts, and deployment labels. The platform then constructs dynamic runtime topology graphs reflecting observed TCP and UDP flows rather than static infrastructure-as-code manifests, establishing baseline behavioral profiles and distinguishing active external attack surfaces from internal-only communication channels."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "differentiation-security-and-risks"
    title: "Competitive Moats, Trust Controls, and Technical Dependency Risks"
    body: "Upwind differentiates itself against first-generation CNAPP incumbents such as Wiz and Orca Security, as well as runtime rivals like Sweet Security, by enforcing automated threat interdiction and execution truth rather than relying solely on periodic API polling. When an anomalous kill chain or container escape attempt is detected—such as a non-privileged web container invoking nsenter or setns, or attempting to overwrite host runc binaries via /proc/self/exe—Upwind's runtime engine can automatically trigger automated containment policies, executing kernel SIGKILL termination or cordoning the compromised Kubernetes node to arrest lateral movement in microseconds.\n\nEnterprise trust and assurance controls are anchored by Upwind's official Trust Center (powered by SafeBase), which provides vetted customers and prospects with direct access to compliance certifications, security documentation, and posture updates. Furthermore, Upwind's security research organization publishes threat intelligence and cloud research via the Upwind Feed, uncovering novel cloud attack techniques including undocumented AWS IAM condition keys, AWS Organization management account exposure paths, AWS Bedrock AgentCore microVM isolation boundaries, and supply chain threats.\n\nHowever, technical diligence reveals notable architectural and operational trade-offs. The requirement to deploy privileged eBPF DaemonSets or Windows kernel drivers introduces organizational friction among conservative platform engineering teams who prefer agentless snapshot scanning. Furthermore, while Upwind maintains an operational availability record of 99.95% over trailing 90-day periods across core services, third-party status tracking indicates that intermittent degradation events have occurred, most frequently impacting third-party integration pipelines and outbound event dispatch. Buyers must also note that independent third-party MITRE ATT&CK benchmark audits remain unpublished across the nascent CDR category, requiring enterprise evaluators to validate runtime sensor overhead and detection efficacy directly through internal production proof-of-concept tests."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
