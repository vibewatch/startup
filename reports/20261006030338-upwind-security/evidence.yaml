evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-and-burn
    missingEvidence: Audited current Annual Recurring Revenue (ARR), net cash burn rate, gross margin percentage, and cash runway.
    whyItMatters: >-
      Without baseline revenue figures, underwriting the reported $1.5B Series B or $3.8B secondary valuation multiples
      is speculative.
    diligencePath: >-
      Request private financial statements, audited revenue recognition schedules, and current corporate cap table
      directly from company management under NDA.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-investor-enumeration-coverage
    missingEvidence: >-
      Full statutory list of corporate directors, complete organizational reporting lines, full cap table equity stakes,
      and complete shareholder register.
    whyItMatters: >-
      TO002 leadership and TO003 stakeholder maps represent illustrative samples of senior leadership and primary
      institutional leads rather than exhaustive registers.
    diligencePath: >-
      Inspect official Israeli corporate registry (ח.פ. 516662616) filings and request company cap table and board
      member rosters under diligence NDA.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: exact-customer-count-and-churn
    missingEvidence: Exact verified customer roster, logo churn rate, and net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Evaluating customer retention quality and expansion trends is critical to validating claimed 900% top-line revenue
      momentum.
    diligencePath: Obtain cohort retention analyses and conduct blinded reference calls with enterprise security decision-makers.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financials-and-retention
    missingEvidence: >-
      Exact current Annual Recurring Revenue (ARR), Net Revenue Retention (NRR), customer churn rates, and gross margin
      profile.
    whyItMatters: >-
      Without verified ARR and retention metrics, Upwind's precise commercial market share and SOM penetration cannot be
      independently validated.
    diligencePath: >-
      Request private financial statements, audited revenue recognition schedules, and cohort retention tables during
      confidential investor diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: blocking
    topic: private-metric-gaps
    missingEvidence: >-
      Audited annual recurring revenue (ARR), quarterly GAAP revenue, gross margin breakdown, and customer acquisition
      cost payback periods.
    whyItMatters: >-
      Without audited financial statements, the sustainability of Upwind's business model and the justification for its
      $3.8 billion valuation cannot be underwritten.
    diligencePath: >-
      Obtain audited financial statements and board reporting decks under formal non-disclosure agreements during
      confirmatory investor diligence.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gaps
    missingEvidence: >-
      Monthly cash burn rate, cash on hand, debt facility obligations, and cap-table liquidation preferences across
      Series B and the $300M round.
    whyItMatters: >-
      Determines whether Upwind has achieved self-sustaining cash flow or remains dependent on external venture capital
      markets under adverse macroeconomic conditions.
    diligencePath: >-
      Review capitalization table, cash flow statements, bank statements, and investor rights agreements during
      confirmatory financial diligence.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Standard pricing schedules, discounting authority matrices, SKU rate cards, and average contract values across
      enterprise deployment sizes.
    whyItMatters: >-
      Enables independent validation of unit economics, pricing power against incumbents like Palo Alto Networks, and
      sales discounting trends.
    diligencePath: >-
      Inspect historical enterprise sales contracts, discounting logs, and customer contract renewals in the virtual
      data room.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Formal disclosures of Net Revenue Retention (NRR), Gross Revenue Retention (GRR), cohort logo churn, and renewal
      rates.
    whyItMatters: >-
      Prevents independent confirmation of post-onboarding software stickiness, expansion economics, and revenue
      durability.
    diligencePath: >-
      Request audited SaaS cohort retention tables, customer renewal rates, and expansion ARR data during confidential
      diligence.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-5 and Top-10 customer revenue concentration percentages, largest individual account ARR, and channel partner
      contract terms.
    whyItMatters: >-
      High dependence on channel partners and potentially concentrated early accounts creates vulnerability to reseller
      disruption or key client churn.
    diligencePath: Review revenue concentration schedules by customer account and channel partner agreements in financial diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: customer-proof
    missingEvidence: >-
      Comprehensive roster of all 150+ to 200+ enterprise accounts and audited production case studies with quantifiable
      MTTR metrics.
    whyItMatters: >-
      Limits the ability to evaluate whether non-public accounts have achieved full enterprise-wide rollout versus
      localized departmental pilots.
    diligencePath: >-
      Conduct blind reference interviews across enterprise accounts in diverse verticals and review production
      deployment rollouts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: litigation
    missingEvidence: >-
      Comprehensive docket search and regulatory enforcement records across federal, state, and Israeli court registries
      for active litigation.
    whyItMatters: >-
      Unresolved litigation or IP infringement claims from legacy CNAPP incumbents could disrupt go-to-market execution
      and partnership commitments.
    diligencePath: Request litigation disclosure schedule and IP freedom-to-operate representation letters in confidential data room.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited ARR, recognized revenue, net retention, gross margin, services mix, burn, runway, and customer
      concentration.
    whyItMatters: These metrics are required to test whether operating quality supports the reported $3.8 billion private valuation.
    diligencePath: Obtain audited financial statements, monthly management accounts, and customer-level cohort schedules under NDA.
    relatedQuestionRefs:
      - QV004
      - QV009
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted cap table, liquidation preferences, participation rights, anti-dilution terms, and
      primary-versus-secondary allocation for the latest round.
    whyItMatters: Headline valuation does not reveal investor downside protection or the proceeds actually reaching the company.
    diligencePath: >-
      Review the charter, stock purchase agreement, investor rights agreement, pro forma cap table, and funds-flow
      statement.
    relatedQuestionRefs:
      - QV006
      - QV010
  - type: conflicting-data
    severity: material
    topic: company-scale
    missingEvidence: >-
      A dated reconciliation of customer count, employee count, and cumulative funding across company and third-party
      profiles.
    whyItMatters: >-
      The public profiles use different counts and funding totals, weakening confidence in current scale and dilution
      assumptions.
    diligencePath: Request a dated operating KPI schedule and round-by-round capitalization reconciliation from management.
    relatedQuestionRefs:
      - QV003
      - QV010
