      - number: '8.2'
        title: Thesis, Anti-Thesis, and Comparable Evidence
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on unusually strong company-reported momentum and visible product activity. Upwind
              said revenue grew 900% year over year and customer logos grew 200% before the January financing; its
              newsroom lists more than 150 customers and more than 300 employees, while its feed shows continuing
              expansion across data, AI, identity, and code-security workflows. Those indicators support product
              relevance, but they are not substitutes for audited recurring revenue, retention, margin, or burn data.
              The anti-thesis is therefore not that demand is absent, but that a fast-growing private mark may be
              detached from durable economics. Value Add VC's peer comparison highlights Lacework's fall from an $8.3
              billion private valuation to a $152.3 million acquisition, demonstrating that a headline private mark can
              compress sharply. Upwind's reported service incidents add an operating diligence signal, while
              Statusfield's methodology also cautions that periods without recorded status are counted as available.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Bull, Base, and Bear Underwriting
        blocks:
          - type: paragraph
            body: >-
              A numeric valuation range cannot be responsibly derived from the assigned public sources because
              EV/revenue is undisclosed and no source provides current ARR, recurring gross margin, net retention, burn,
              or preference terms. The bull case would require private evidence that the reported growth converts into
              durable subscription economics and that the September price leaves a credible path to an exit above entry.
              The base case is continued operating progress but insufficient public information to underwrite $3.8
              billion, which supports tracking the company while seeking either a lower entry or stronger information
              rights. The bear case is a material markdown or down round if revenue quality, renewals, or margins fail
              to match the growth narrative. These are conditional cases and probability signals, not probability
              estimates or implied fair-value ranges.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit Readiness, Terms, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The company has credible institutional sponsorship, a repeat-founder narrative, named enterprise adoption,
              and an active product roadmap, but those attributes establish company quality rather than exit economics.
              The assigned sources do not disclose liquidation preferences, participation rights, secondary components,
              or the fully diluted ownership structure of the latest round. They also do not reconcile the official
              newsroom's customer and employee counts with third-party profile estimates. Before entry, diligence should
              obtain audited ARR and revenue recognition, renewal and expansion cohorts, gross margin and services mix,
              burn and runway, customer concentration, the fully diluted cap table, and all preference terms.
              Thesis-break triggers are a down round, growth or renewal evidence materially below the financing
              narrative, persistent severe service incidents, or terms that transfer too much downside protection to
              senior investors. A supportable exit view requires those private inputs; the public evidence alone does
              not justify a target return or exit range.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The denominator is private
            body: >-
              A $3.8 billion private mark is observable, but the assigned evidence does not disclose ARR, profitability,
              or EV/revenue. The valuation therefore cannot be underwritten from a public multiple.
            calloutType: risk
            claimRefs:
              - CV001
              - CV012
              - CV014
          - type: callout
            title: Condition any entry on private diligence
            body: >-
              Maintain research-more until audited recurring revenue, retention, margin, customer concentration, burn,
              cap-table ownership, and preference terms are available and reconcile with the financing narrative.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
