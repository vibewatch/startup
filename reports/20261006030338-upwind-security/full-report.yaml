  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Valuation, capital scaling, and competitive overhang
        blocks:
          - type: paragraph
            body: >-
              Upwind Security's valuation trajectory represents an extraordinary escalation in commercial expectations.
              Closing a $300 million funding round at a $3.8 billion valuation more than doubles the valuation it
              carried just eight months earlier following its $250 million Series B in January 2026. This aggressive
              repricing reflects market repositioning following Google's $32 billion acquisition of Wiz, which removed
              the premier independent cloud-native application protection platform from the standalone market. However,
              scaling toward a projected $100 million ARR run-rate requires flawless go-to-market execution, creating
              acute vulnerability to enterprise spending contraction, gross margin dilution, or valuation multiple
              compression across high-growth cybersecurity peers in volatile macroeconomic environments.
