  - id: FM001
    title: Addressable Market Sizing Pyramid for Cloud and AI Runtime Security
    type: pyramid
    summary: >-
      Hierarchical scoping of the addressable cloud security market from total enterprise cloud spend down to Upwind's
      serviceable obtainable opportunity.
    data:
      items:
        - label: 'Total Addressable Market (TAM): Global CNAPP & Workload Protection'
          value: 18790
          unit: USD M
          detail: >-
            Frost & Sullivan projected global CNAPP market by 2029 ($18.79B), supported by ISMG projections reaching up
            to $38B-$88B by the 2030s.
          tone: neutral
        - label: 'Adjacent Addressable Market: Cloud Security Posture & Compliance'
          value: 10600
          unit: USD M
          detail: Upper range of current CNAPP market guide valuations incorporating full CSPM, CIEM, and IaC scanning.
          tone: neutral
        - label: Core Dedicated CNAPP Software Licensing
          value: 3400
          unit: USD M
          detail: Lower range of current CNAPP guide valuations restricted strictly to dedicated cloud protection platforms.
          tone: neutral
        - label: 'Serviceable Addressable Market (SAM): Multi-Cloud & Enterprise Kubernetes'
          value: 7000
          unit: USD M
          detail: >-
            Current addressable spend across enterprise organizations running containerized, multi-cloud, and
            API-intensive workloads.
          tone: neutral
        - label: 'Serviceable Obtainable Market (SOM): Runtime-First & AI Cloud Workloads'
          value: 1200
          unit: USD M
          detail: >-
            Near-term spend accessible to runtime-centric architectures seeking alert triage reduction and AI workload
            defense.
          tone: positive
        - label: 'Immediate High-Propensity Segment: Cloud-Native & Regulated Enterprises'
          value: 450
          unit: USD M
          detail: Target tier experiencing critical alert fatigue and active eBPF runtime sensor adoption requirements.
          tone: positive
    approximationNotes: >-
      TAM is pegged directly to the Frost & Sullivan 2029 projection of $18.79B; SAM and SOM are evidence-constrained
      estimations reflecting the addressable subset of enterprise multi-cloud organizations.
