      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Runtime Context Paradigm Shift
            body: >-
              The central catalyst in modern cloud security is the transition from static, snapshot-based visibility to
              runtime intelligence. Static scanning generates extensive theoretical vulnerability inventories that
              overburden SecOps teams. By validating whether vulnerable packages are loaded into active memory or
              exposed to live network traffic via eBPF, runtime-first architectures achieve up to 98% alert reduction,
              transforming security from a passive compliance audit into active operational defense.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM010
          - type: callout
            title: Incumbent Suite Bundling and Agent Deployment Resistance
            body: >-
              Despite technical advantages, runtime platforms encounter two friction points: enterprise resistance to
              deploying sensors in mission-critical production kernels, and aggressive pricing pressure from incumbents
              (such as Palo Alto Networks and Microsoft) bundling posture tools into broader enterprise licensing
              agreements.
            calloutType: risk
            claimRefs:
              - CM002
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Taxonomy & Market Dynamics
        blocks:
          - type: paragraph
            body: >-
              The cloud security landscape is characterized by intense consolidation as enterprises seek to collapse
              fragmented point solutions into unified Cloud-Native Application Protection Platforms (CNAPP).
              Organizations face acute alert fatigue, frequently inundated by tens of thousands of static posture
              warnings that fail to indicate whether a vulnerability is actively exploitable in production. Upwind
              positions itself directly against this status quo through an inside-out, runtime-first paradigm utilizing
              eBPF sensors and agentless discovery. The competitive arena divides into four primary vectors:
              posture-centric CNAPP leaders such as Wiz and Orca Security, which established early dominance through
              agentless snapshot scanning; legacy enterprise network and endpoint titans such as Palo Alto Networks
              (Prisma Cloud) and CrowdStrike (Falcon Cloud Security), which expand into cloud workloads via
              multi-product suites and acquisitions; hyperscaler native controls across AWS, Microsoft Defender for
              Cloud, and Google Cloud; and open-source or developer-first tooling including Prowler, Steampipe, and
              Snyk. While static scanners identify misconfigurations, Upwind's technical thesis centers on filtering
              operational noise by approximately 95% to 98% through live execution context.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
