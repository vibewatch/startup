  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Price-Sensitive Decision
        blocks:
          - type: paragraph
            body: >-
              Independent profiles report that Upwind raised $300 million in September 2026 at a $3.8 billion valuation,
              roughly eight months after a $250 million Series B was reported at $1.5 billion. The January company
              release said that Series B brought cumulative funding to $430 million; current aggregators diverge between
              $700 million and about $730 million after the later financing, so funding raised should be treated as a
              range rather than as cash available. The speed of the private re-rating is the central underwriting issue.
              Existing investors, including Bessemer, appear across the January and September rounds, which validates
              continued sponsor support but does not independently establish fair value. At the reported $3.8 billion
              mark, the recommendation is research-more, confidence is medium, risk is high, and the valuation stance is
              stretched because the public record does not expose the denominator needed to assess the price.
            claimRefs:
