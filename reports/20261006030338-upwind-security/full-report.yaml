        title: Cost Structure Drivers, Delivery Costs, and Private Financial Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Upwind's underlying cost structure is governed by two primary operational expenditures: kernel-level
              telemetry processing infrastructure and enterprise go-to-market overhead. Because Upwind deploys
              lightweight eBPF sensors directly into customer Kubernetes environments to intercept system calls and
              network socket communications, initial telemetry filtering and noise reduction occur locally within the
              customer host boundary. This architecture dampens the cloud egress and ingestion bandwidth costs that
              frequently compress gross margins for traditional agentless snapshot platforms. Nevertheless, Upwind
              maintains centralized multi-tenant cloud infrastructure across hyperscalers to correlate cross-workload
              runtime signals, manage global configuration graphs, and host its AI runtime investigation models.
              Publicly, Upwind has not disclosed its cost of goods sold (COGS), gross margins, customer acquisition cost
              (CAC), or net revenue retention (NRR). While third-party monitoring establishes an operational
              availability record of 99.95% over trailing 90-day periods across core services, the lack of audited unit
              economics obscures whether gross margins achieve the 75% to 80% standard typical of mature enterprise
