        - research-more
        - Strong reported momentum, but no disclosed ARR, profitability, or revenue multiple
        - Do not underwrite a new allocation from public evidence alone
      - - Confidence
        - medium
        - Financing is multiply reported; core operating denominators remain private
        - Require primary private diligence before changing the recommendation
      - - Risk rating
        - high
        - Rapid private re-rating, incomplete financial disclosure, and adverse peer precedent
        - Use strict entry and downside-protection discipline
      - - Valuation stance
        - stretched
        - $3.8B reported valuation cannot be mapped to disclosed recurring revenue
        - Seek a lower price or verified economics that support the mark
      - - Entry discipline
        - conditional
        - Latest-round preference, participation, and secondary terms are not public
        - Review the fully diluted cap table and financing documents before entry
    notes: >-
      Assessments use only the retained October 2026 public evidence; funding totals vary by source, and no row treats
      funding raised as cash available.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV012
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Thesis evidence
      - Anti-thesis or uncertainty
      - What would change the view
    rows:
      - - Commercial momentum
        - Company reported 900% revenue growth and 200% logo growth
        - Absolute revenue, ARR, retention, and margin are not disclosed
        - Audited subscription revenue and cohort retention consistent with the growth claim
      - - Product and market
        - Official feed shows continued expansion across data, AI, identity, and code
        - Release activity does not establish monetization, adoption depth, or competitive win rates
        - Customer-level usage, renewal, and displacement evidence
      - - Scale proof
        - Official newsroom lists 150+ customers and 300+ employees
        - Third-party profiles provide inconsistent customer and employee snapshots
        - A dated customer census and reconciled headcount schedule
      - - Comparable outcomes
        - Cloud-security exits show that strategic values can be large
        - Lacework's reported $8.3B peak and $152.3M sale show severe private-mark compression
        - A revenue-based valuation bridge using current audited metrics
    notes: >-
      Company-issued growth and scale figures are presented as claims rather than independent verification; the peer
      outcome comes from one retained secondary analysis.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited recurring revenue, retention, margin, and customer evidence validate the reported growth
        - >-
          Current $3.8B mark becomes underwritable only with a credible exit above entry; no public-data range is
          supportable
        - Strengthens with independently verified cohorts and favorable financing terms
        - Growth proves concentrated, low-margin, or promotion-driven
      - - Base
        - Product adoption continues, but financial and cap-table evidence remains private
        - No defensible numeric range from public evidence; maintain research-more or seek a lower entry
        - Most consistent with the currently retained evidence
        - No improvement in disclosure before the next financing
      - - Bear
        - Growth quality, renewals, or margins fail to support the private re-rating
        - Material markdown or down round; the public record provides no supportable valuation floor
        - Rises if financing terms become more protective or severe incidents persist
        - Down round, weak renewal cohorts, or senior preference overhang
    notes: >-
      Scenarios are conditional frameworks, not forecasts; no probabilities, ARR estimates, multiples, target returns,
      or fair-value ranges are invented where the retained evidence is silent.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
figures:
  - id: FO001
    title: Upwind Corporate and Capitalization Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of Upwind's founding, funding rounds, strategic acquisitions, and ecosystem integrations
      from 2022 to 2026.
    data:
      items:
        - label: September 2022
          detail: Upwind founded by Amiram Shachar and Spot.io founding team; raises $27.4M Seed led by Cyberstarts.
          tone: positive
        - label: September 2023
          detail: Secures $50M Seed extension led by Greylock to scale eBPF runtime sensor platform development.
          tone: positive
        - label: November 2024
          detail: Workforce reaches approximately 160 employees as enterprise customer adoption accelerates.
          tone: neutral
        - label: December 2024
          detail: Closes $100M Series A financing led by Craft Ventures with participation from TCV and Alta Park.
          tone: positive
        - label: April 2025
          detail: Acquires embedded security startup Nyx Security to inject code-level anomaly detection into CNAPP.
          tone: positive
        - label: June 2025
          detail: Appoints former Twitter, Walmart, and PayPal executive Rinki Sethi as Chief Security Officer.
          tone: positive
        - label: January 2026
          detail: Raises $250M Series B led by Bessemer Venture Partners at $1.5B valuation; reports 900% YoY growth.
          tone: positive
        - label: March 2026
          detail: Secures strategic investment from Salesforce Ventures, increasing valuation marks toward $1.6B.
          tone: positive
        - label: June 2026
          detail: Announces native runtime integration with Cisco Cloud Control via Model Context Protocol (MCP).
          tone: positive
        - label: September 2026
          detail: Operational monitoring records 9 service incidents over 90-day window; $3.8B valuation mark reported.
          tone: warning
    approximationNotes: >-
      Dates and milestones reflect formal corporate press announcements, investment tracking databases, and operational
      telemetry logs.
