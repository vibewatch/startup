      - number: '6.4'
        title: Retention, Durability, and Concentration Dynamics
        blocks:
          - type: paragraph
            body: >-
              Upwind's long-term commercial durability hinges on land-and-expand mechanics and runtime infrastructure
              reliability. The company is built API-first, anchoring initial enterprise adoption on runtime visibility
              and threat detection before expanding into observability, posture management, and autonomous agentic
              SecOps remediation modules. Strategic technology alliance programs, such as "The Lineup" and integrations
              with Cisco Cloud Control via the Model Context Protocol (MCP), facilitate enterprise expansion by
              embedding Upwind's runtime telemetry directly into preexisting analyst workflows. Despite rapid land
              rates, Upwind does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR),
              cohort renewal rates, or average contract length. Moreover, operational reliability represents a material
              durability factor: third-party monitoring via Statusfield recorded 9 service incidents over a 90-day
              window ending September 2026, comprising 3 major outages and 5 degraded performance periods, primarily
              impacting third-party integrations despite an overall 99.95% uptime availability figure.
