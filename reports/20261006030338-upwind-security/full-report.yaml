      - number: '5.2'
        title: Kernel-Level Architecture, eBPF Telemetry, and Cross-Platform Engineering
        blocks:
          - type: paragraph
            body: >-
              Upwind's underlying technical foundation relies on Extended Berkeley Packet Filter (eBPF) technology
              deployed as lightweight daemon sensors, typically structured as Kubernetes DaemonSets across host nodes.
              By attaching sandboxed programs directly to Linux kernel tracepoints and kprobes, Upwind achieves granular
              visibility into system execution without loading unstable out-of-tree kernel modules or running heavy
              user-space monitoring agents. The sensors intercept critical system calls at the metal—including execve,
              connect, accept4, and openat—allowing the runtime context engine to inspect process creation, memory
              mappings, and network socket communication in real time with negligible host overhead (typically under 1%
              CPU utilization).


              Beyond Linux container environments, Upwind is actively expanding its sensor architecture to support
              Windows operating systems and cross-platform enterprise environments. The engineering organization builds
              native Windows OS sensors utilizing systems programming languages (C, C++, C#), Windows Kernel Drivers,
              and WMI security frameworks to deliver parity in network monitoring, process tracking, and file integrity
              monitoring across heterogeneous cloud estates. Backend platform services are built in Go, leveraging
              relational databases (PostgreSQL, MySQL), gRPC communications, and distributed messaging systems designed
              for high-concurrency event ingestion, idempotency, and automated retry mechanisms.


              At the network and application layer, Upwind provides Layer 7 visibility into microservices and encrypted
              Service Meshes (such as Istio mTLS) by hooking into kernel socket functions (such as tcp_sendmsg) to
              inspect HTTP and gRPC request payloads before transport encryption or after decryption. This raw kernel
              telemetry is enriched instantly through in-memory Kubernetes metadata lookup maps, binding process IDs
              (PIDs) to pod names, namespaces, service accounts, and deployment labels. The platform then constructs
              dynamic runtime topology graphs reflecting observed TCP and UDP flows rather than static
              infrastructure-as-code manifests, establishing baseline behavioral profiles and distinguishing active
              external attack surfaces from internal-only communication channels.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
