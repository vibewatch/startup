  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Foundational Heritage
        blocks:
          - type: paragraph
            body: >-
              Upwind Security Ltd. is an enterprise cybersecurity software company founded in 2022 and
              dual-headquartered with corporate executive leadership at 140 New Montgomery Street in San Francisco,
              California, alongside primary research and development operations centered in Tel Aviv, Israel. The
              business was established by Amiram Shachar (Chief Executive Officer) alongside co-founders Liran Polak,
              Lavi Ferdman, and Tal Zuri (Tal Zur). The founding quartet previously established and scaled cloud
              infrastructure optimization pioneer Spot.io (originally Spotinst), which was acquired by NetApp for $450
              million in 2020. This shared operating heritage provides Upwind with deep, battle-tested credibility
              across DevOps, systems programming, and large-scale enterprise cloud infrastructure architectures.
              Operating as a commercial venture-backed software corporation, Upwind addresses acute operational friction
              within enterprise security programs where static configuration scanners generate overwhelming alert
              volumes without confirming runtime reachability or active workload exploitability. The company positions
              its runtime fabric as an inside-out operating model connecting code directly to live production
              environments.
