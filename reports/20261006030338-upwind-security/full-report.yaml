            body: >-
              Upwind Security operates a cloud-native software subscription model centered on its Cloud-Native
              Application Protection Platform (CNAPP) and runtime threat detection capabilities. The company monetizes
              enterprise cloud environments primarily through annual subscription contracts whose pricing scales based
              on protected cloud workload volume, container footprints, virtual machine instances, and active Kubernetes
