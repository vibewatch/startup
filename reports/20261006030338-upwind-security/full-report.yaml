      - number: '5.3'
        title: Competitive Moats, Trust Controls, and Technical Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Upwind differentiates itself against first-generation CNAPP incumbents such as Wiz and Orca Security, as
              well as runtime rivals like Sweet Security, by enforcing automated threat interdiction and execution truth
              rather than relying solely on periodic API polling. When an anomalous kill chain or container escape
              attempt is detected—such as a non-privileged web container invoking nsenter or setns, or attempting to
              overwrite host runc binaries via /proc/self/exe—Upwind's runtime engine can automatically trigger
              automated containment policies, executing kernel SIGKILL termination or cordoning the compromised
              Kubernetes node to arrest lateral movement in microseconds.


              Enterprise trust and assurance controls are anchored by Upwind's official Trust Center (powered by
              SafeBase), which provides vetted customers and prospects with direct access to compliance certifications,
              security documentation, and posture updates. Furthermore, Upwind's security research organization
              publishes threat intelligence and cloud research via the Upwind Feed, uncovering novel cloud attack
              techniques including undocumented AWS IAM condition keys, AWS Organization management account exposure
              paths, AWS Bedrock AgentCore microVM isolation boundaries, and supply chain threats.


              However, technical diligence reveals notable architectural and operational trade-offs. The requirement to
              deploy privileged eBPF DaemonSets or Windows kernel drivers introduces organizational friction among
              conservative platform engineering teams who prefer agentless snapshot scanning. Furthermore, while Upwind
              maintains an operational availability record of 99.95% over trailing 90-day periods across core services,
              third-party status tracking indicates that intermittent degradation events have occurred, most frequently
              impacting third-party integration pipelines and outbound event dispatch. Buyers must also note that
              independent third-party MITRE ATT&CK benchmark audits remain unpublished across the nascent CDR category,
              requiring enterprise evaluators to validate runtime sensor overhead and detection efficacy directly
              through internal production proof-of-concept tests.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Runtime Context as an Alert Suppression Filter
            body: >-
              Upwind's fundamental architectural premise is that vulnerability presence does not equal exploitability.
              By using eBPF probes to check whether a vulnerable shared library (.so) is actually loaded into a running
              process's memory segment and exposed to network ingress, Upwind filters out non-traversable risks that
              plague static CSPM tools.
            calloutType: insight
            claimRefs:
              - CE001
              - CE006
              - CE007
          - type: callout
            title: Host Agent Footprint and Third-Party Operational Drift
            body: >-
              Deploying kernel-level eBPF DaemonSets and Windows kernel drivers delivers deep real-time visibility but
              introduces organizational resistance compared to pure agentless scanning. In addition, status tracking
              reveals periodic incident degradations primarily impacting third-party service integrations, which must be
              monitored to ensure reliable external alert routing.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Ideal Customer Profile
        blocks:
          - type: paragraph
            body: >-
              Upwind Security positions its runtime-first Cloud-Native Application Protection Platform (CNAPP) directly
              at enterprises operating complex, modern cloud infrastructure across Kubernetes, containerized services,
              and serverless architectures. The company focuses predominantly on business-to-business (B2B) enterprise
              technology buyers, specifically Chief Information Security Officers (CISOs), Chief Security Officers
              (CSOs), and dedicated product security and SecOps engineering teams. Enterprise environments experiencing
              rapid adoption of microservices and agentic AI systems represent Upwind's core target market. High-growth
              technology firms, digital-native consumer platforms, and global industrial conglomerates represent the
              principal customer verticals identified in public records. In these organizations, the primary purchasing
              driver is the urgent requirement to cut through static security alert noise by validating live runtime
              exploitability and execution pathways rather than relying on stale periodic configuration snapshots.
