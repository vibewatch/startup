  - id: FE001
    title: Upwind Runtime-First Cloud Security Architecture
    type: stack
    summary: >-
      Layered architecture showing the transition from host kernel telemetry through context enrichment to executive
      security workflows.
    data:
      layers:
        - label: Executive Workflows & Security Operations
          detail: >-
            Centralized interface spanning Vulnerabilities, Threats, API Security, Code, and Inventory with incident
            response collaboration
          modules:
            - Unified Management Console
            - DevSecOps & Alert Integrations
        - label: Posture Discovery & Governance
          detail: >-
            Agentless multi-cloud API ingestion across AWS, Azure, and GCP tracking configuration baseline drift and
            audit frameworks
          modules:
            - Cloud Security Posture Management
            - Compliance & Infrastructure as Code Scanning
        - label: Risk Analysis & Anomaly Detection
          detail: >-
            Dynamic attack path calculation and behavioral machine learning baselines correlating configuration posture
            with live execution
          modules:
