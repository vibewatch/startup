  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Runtime-Powered CNAPP and Customer Security Workflows
        blocks:
          - type: paragraph
            body: >-
              Upwind Security provides a unified cloud security platform that operates on the core principle of
              runtime-powered security, moving away from legacy static posture scanning and disk snapshotting toward
              live execution monitoring. Modern enterprise DevSecOps and security operations teams face crippling alert
              fatigue driven by traditional Cloud Security Posture Management (CSPM) tools, which generate thousands of
              critical alerts based on theoretical vulnerabilities or misconfigurations without verifying actual
              workload reachability or execution. Upwind addresses this operational bottleneck by combining cloud
              security posture management with runtime context and real-time protection, allowing security teams to
              accurately prioritize real attack paths and suppress alerts for dormant or unreachable packages.


              The platform architecture is accessed through a centralized Management Console that organizes enterprise
              security workflows across key operational domains: Inventory, Configurations, Attack Surface,
              Vulnerabilities, Threats, Code, Identities, API Security, Data Security, Feed, and AI workloads. Getting
              started requires connecting cloud provider accounts (AWS, Azure, Google Cloud Platform), deploying Upwind
              sensors directly into Kubernetes clusters and host environments, and configuring data sources and outbound
              event forwarding into existing DevSecOps and SIEM pipelines. Upwind provides 24/7 live chat support
              directly within the Management Console, along with email support and shared customer Slack channels,
              enabling security engineers to collaborate directly with Upwind support during deployment and incident
              investigations.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
