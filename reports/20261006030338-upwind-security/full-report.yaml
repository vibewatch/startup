        title: Named Customer Proof and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Public customer validation spans several marquee global enterprises, demonstrating production-grade
              applicability across diverse operational footprints. A featured production deployment is publicly
              documented with Sprinklr, an enterprise AI-native customer experience platform. Sprinklr's product
              security organization deployed Upwind's runtime sensor architecture across its multi-cloud estate to
              monitor application-layer threats, gain real-time API visibility, and correlate fragmented security
              signals into contextual threat investigations. Furthermore, financial and enterprise technology databases
              record production adoption across multinational industrial manufacturer Siemens, connected fitness
              platform Peloton, streaming provider Roku, web publishing platform Wix, neighborhood network Nextdoor, and
