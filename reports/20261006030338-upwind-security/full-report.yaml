        title: Platform ecosystem dependencies and supply chain attack vectors
        blocks:
          - type: paragraph
            body: >-
              Upwind's coverage model requires privileged onboarding at the root or management account level to
              orchestrate multi-cloud mapping and workload inspection, creating a high-value operational target for
              credential compromise. Simultaneously, as evidenced by Upwind's security research into malicious npm
              package distributions, supply chain compromises in common developer tooling can weaponize install-time
              hooks to harvest AWS credentials and cloud tokens. While Upwind has expanded its strategic alliances with
              hyperscalers including AWS, Microsoft Azure, and NVIDIA, its operational leverage remains tightly coupled
              to cloud provider APIs, undocumented IAM engine behaviors, and partner ecosystems across global
              deployments.
