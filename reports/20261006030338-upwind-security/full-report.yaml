      - number: '3.2'
        title: Competitor Profiles, Architecture & Capability Matrix
        blocks:
          - type: paragraph
            body: >-
              Evaluating Upwind against established peers reveals fundamental architectural divergences between static
              outside-in posture evaluations and continuous inside-out kernel inspection. Incumbents like Wiz achieved
              rapid market penetration by deploying agentless API connectors that inspect disk snapshots and
              configuration states, delivering rapid deployment without requiring workload agents. However, static
              inspections inherently lack runtime visibility into active memory execution, process lineage, live network
              connections, and serverless invocations. In contrast, Upwind embeds lightweight eBPF sensors directly into
              the Linux kernel alongside cloud provider API integrations, tracing exact system calls, file touches, and
              network sockets across Kubernetes clusters and serverless functions. Upwind continuously secures
              serverless workloads by mapping live function execution against compliance frameworks like SOC 2 and CIS
              benchmarks, and automatically severing malicious processes. Traditional infrastructure giants like Palo
              Alto Networks assemble broad capabilities via successive corporate acquisitions, frequently burdening
              enterprise operations with fragmented agent architectures, disparate user interfaces, and multi-SKU
              procurement complexity.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
