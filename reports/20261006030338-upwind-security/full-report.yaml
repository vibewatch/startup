  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cloud security addressable market is experiencing structural reconfiguration as enterprises move away
              from disjointed security point products toward unified Cloud-Native Application Protection Platforms
              (CNAPP). The addressable perimeter includes enterprise budgets for Cloud Security Posture Management
              (CSPM), Cloud Workload Protection Platforms (CWPP), Cloud Detection and Response (CDR), Cloud
              Infrastructure Entitlement Management (CIEM), API security, and container/Kubernetes protection. Upwind
              specifically targets the intersection of infrastructure posture and real-time execution telemetry through
              an 'inside-out' runtime architecture powered by lightweight eBPF sensors and agentless cloud integrations.
              This architectural model addresses severe operational friction in status-quo deployments: legacy agentless
              scanners inspect snapshots from the 'outside-in,' creating thousands of hypothetical alert backlogs
              without visibility into active process execution, in-memory threats, or live network connections. However,
              traditional endpoint detection and response (EDR), broad Security Information and Event Management (SIEM),
              and on-premises network firewalls remain distinct budget lines excluded from this core workload security
              scope. Furthermore, status-quo alternatives—most notably incumbent platform suites, hyperscaler-native
              tooling (such as Microsoft Defender for Cloud), and internal manual triage by DevOps—continue to serve as
              primary friction points against standalone procurement.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: TAM, SAM, and Multi-Lens Sizing Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market potential for Upwind requires separating broad top-down cybersecurity industry
              projections from evidence-constrained workload segments. Frost & Sullivan estimates the global CNAPP
              market will expand to $18.79 billion by 2029, compounding at approximately 28% annually. Industry guide
              syntheses from ISMG report a current valuation range between $3.4 billion and $10.6 billion, with
              aggressive long-term projections expanding to $38 billion to $88 billion by the early 2030s under a 20% to
              35% compound annual growth rate. However, these disparate ranges reflect contrasting scoping
              methodologies: bottom-up estimates isolate software licenses for runtime workload agents and posture
              engines, whereas upper-bound projections fold in cloud identity governance, software supply chain
              security, and developer pipeline scanning. For Upwind, the immediate Serviceable Addressable Market (SAM)
              is bounded by enterprise multi-cloud organizations operating containerized, Kubernetes, and modern API
              architectures across AWS, Azure, and GCP. A constrained Serviceable Obtainable Market (SOM) lens focuses
              on mid-to-large enterprises with dedicated cloud platform security teams that suffer from alert fatigue
              and prioritize runtime-first exploitability filtering over passive audit checkmarks. Gartner projects that
              by 2029, 40% of enterprises implementing zero trust within cloud service provider environments will rely
              on CNAPP platforms for advanced visibility and operational control, underscoring strong secular tailwinds
              despite sizing dispersion.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
