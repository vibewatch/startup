figures:
  - id: "FV001"
    title: "Recommendation Logic"
    type: "flow"
    summary: "A qualitative decision chain separates financing and operating signals from the missing evidence required to underwrite the reported valuation."
    data:
      nodes:
        - id: "financing-signal"
          label: "$300M financing"
          detail: "Independent profiles report a September 2026 round at a $3.8B valuation."
        - id: "traction-signal"
          label: "Reported traction"
          detail: "The company reported 900% revenue growth and 200% logo growth."
        - id: "product-signal"
          label: "Product activity"
          detail: "The official feed shows continued expansion across cloud, AI, data, identity, and code."
        - id: "financial-gap"
          label: "Financial denominator missing"
          detail: "ARR, retention, margin, profitability, and EV/revenue are not disclosed."
        - id: "terms-gap"
          label: "Financing terms missing"
          detail: "Preference, participation, secondary, and fully diluted ownership terms are private."
        - id: "decision"
          label: "Research more"
          detail: "Medium confidence, high risk, and a stretched valuation stance at the reported mark."
      edges:
        - from: "financing-signal"
          to: "traction-signal"
        - from: "traction-signal"
          to: "product-signal"
        - from: "product-signal"
          to: "financial-gap"
        - from: "financial-gap"
          to: "terms-gap"
        - from: "terms-gap"
          to: "decision"
    approximationNotes: "The flow is qualitative and does not assign weights, conversion rates, valuation ranges, or probabilities."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV007"
      - "CV012"
      - "CV015"
      - "CV016"
callouts:
