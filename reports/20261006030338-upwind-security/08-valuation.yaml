    title: "Bull, Base, and Bear Scenarios"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation or return logic"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "Audited recurring revenue, retention, margin, and customer evidence validate the reported growth"
        - "Current $3.8B mark becomes underwritable only with a credible exit above entry; no public-data range is supportable"
        - "Strengthens with independently verified cohorts and favorable financing terms"
        - "Growth proves concentrated, low-margin, or promotion-driven"
      - - "Base"
        - "Product adoption continues, but financial and cap-table evidence remains private"
        - "No defensible numeric range from public evidence; maintain research-more or seek a lower entry"
        - "Most consistent with the currently retained evidence"
        - "No improvement in disclosure before the next financing"
      - - "Bear"
        - "Growth quality, renewals, or margins fail to support the private re-rating"
        - "Material markdown or down round; the public record provides no supportable valuation floor"
        - "Rises if financing terms become more protective or severe incidents persist"
        - "Down round, weak renewal cohorts, or senior preference overhang"
    notes: "Scenarios are conditional frameworks, not forecasts; no probabilities, ARR estimates, multiples, target returns, or fair-value ranges are invented where the retained evidence is silent."
