company:
  name: "Upwind Security"
chapter:
  number: 8
  title: "Valuation"
  summary: "Upwind's reported September 2026 financing set a $3.8 billion private valuation after rapid company-reported growth, but the retained public evidence does not disclose ARR, profitability, or a revenue multiple. The appropriate public-evidence stance is research-more with medium confidence, high risk, and a stretched valuation assessment until financial and preference terms are verified."
sections:
  - id: "financing-context-and-decision"
    title: "Financing Context and Price-Sensitive Decision"
    body: "Independent profiles report that Upwind raised $300 million in September 2026 at a $3.8 billion valuation, roughly eight months after a $250 million Series B was reported at $1.5 billion. The January company release said that Series B brought cumulative funding to $430 million; current aggregators diverge between $700 million and about $730 million after the later financing, so funding raised should be treated as a range rather than as cash available. The speed of the private re-rating is the central underwriting issue. Existing investors, including Bessemer, appear across the January and September rounds, which validates continued sponsor support but does not independently establish fair value. At the reported $3.8 billion mark, the recommendation is research-more, confidence is medium, risk is high, and the valuation stance is stretched because the public record does not expose the denominator needed to assess the price."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV006"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis, Anti-Thesis, and Comparable Evidence"
    body: "The positive case rests on unusually strong company-reported momentum and visible product activity. Upwind said revenue grew 900% year over year and customer logos grew 200% before the January financing; its newsroom lists more than 150 customers and more than 300 employees, while its feed shows continuing expansion across data, AI, identity, and code-security workflows. Those indicators support product relevance, but they are not substitutes for audited recurring revenue, retention, margin, or burn data. The anti-thesis is therefore not that demand is absent, but that a fast-growing private mark may be detached from durable economics. Value Add VC's peer comparison highlights Lacework's fall from an $8.3 billion private valuation to a $152.3 million acquisition, demonstrating that a headline private mark can compress sharply. Upwind's reported service incidents add an operating diligence signal, while Statusfield's methodology also cautions that periods without recorded status are counted as available."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
  - id: "scenario-underwriting"
    title: "Bull, Base, and Bear Underwriting"
    body: "A numeric valuation range cannot be responsibly derived from the assigned public sources because EV/revenue is undisclosed and no source provides current ARR, recurring gross margin, net retention, burn, or preference terms. The bull case would require private evidence that the reported growth converts into durable subscription economics and that the September price leaves a credible path to an exit above entry. The base case is continued operating progress but insufficient public information to underwrite $3.8 billion, which supports tracking the company while seeking either a lower entry or stronger information rights. The bear case is a material markdown or down round if revenue quality, renewals, or margins fail to match the growth narrative. These are conditional cases and probability signals, not probability estimates or implied fair-value ranges."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV005"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness, Terms, and Thesis-Break Triggers"
    body: "The company has credible institutional sponsorship, a repeat-founder narrative, named enterprise adoption, and an active product roadmap, but those attributes establish company quality rather than exit economics. The assigned sources do not disclose liquidation preferences, participation rights, secondary components, or the fully diluted ownership structure of the latest round. They also do not reconcile the official newsroom's customer and employee counts with third-party profile estimates. Before entry, diligence should obtain audited ARR and revenue recognition, renewal and expansion cohorts, gross margin and services mix, burn and runway, customer concentration, the fully diluted cap table, and all preference terms. Thesis-break triggers are a down round, growth or renewal evidence materially below the financing narrative, persistent severe service incidents, or terms that transfer too much downside protection to senior investors. A supportable exit view requires those private inputs; the public evidence alone does not justify a target return or exit range."
    claimRefs:
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV016"
