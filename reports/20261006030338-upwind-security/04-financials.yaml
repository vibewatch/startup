  title: "Financials"
  summary: "Upwind has escalated rapidly to an estimated $50M-$60M ARR run-rate by mid-2026 backed by over $680M-$728M in cumulative venture financing, yet critical financial parameters including gross margins, net revenue retention, sales efficiency, and cap-table liquidation preferences remain strictly private."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model, Pricing Mechanics, and Commercial Distribution"
    body: "Upwind Security operates a cloud-native software subscription model centered on its Cloud-Native Application Protection Platform (CNAPP) and runtime threat detection capabilities. The company monetizes enterprise cloud environments primarily through annual subscription contracts whose pricing scales based on protected cloud workload volume, container footprints, virtual machine instances, and active Kubernetes nodes. Enterprise customers procure Upwind both through direct enterprise sales engagements and through major cloud provider marketplaces, including the AWS Marketplace where Upwind is listed as a transactable solution. Public procurement data and customer procurement reviews reveal that Upwind employs custom quotation-based enterprise pricing rather than fixed self-service tiers, requiring prospective buyers to submit infrastructure sizing requirements to sales representatives before receiving tailored annual contract values. Customer deployment accounts confirm that procurement facilitates the consolidation of redundant monitoring tools, displacing separate posture management and workload alerting tools. However, list pricing schedules, discounting matrices, workload unit metering tiers, and professional services revenue contributions are withheld from the public domain, preventing independent verification of realized contract pricing."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure Drivers, Delivery Costs, and Private Financial Metric Gaps"
    body: "Upwind's underlying cost structure is governed by two primary operational expenditures: kernel-level telemetry processing infrastructure and enterprise go-to-market overhead. Because Upwind deploys lightweight eBPF sensors directly into customer Kubernetes environments to intercept system calls and network socket communications, initial telemetry filtering and noise reduction occur locally within the customer host boundary. This architecture dampens the cloud egress and ingestion bandwidth costs that frequently compress gross margins for traditional agentless snapshot platforms. Nevertheless, Upwind maintains centralized multi-tenant cloud infrastructure across hyperscalers to correlate cross-workload runtime signals, manage global configuration graphs, and host its AI runtime investigation models. Publicly, Upwind has not disclosed its cost of goods sold (COGS), gross margins, customer acquisition cost (CAC), or net revenue retention (NRR). While third-party monitoring establishes an operational availability record of 99.95% over trailing 90-day periods across core services, the lack of audited unit economics obscures whether gross margins achieve the 75% to 80% standard typical of mature enterprise infrastructure software."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy, Cash Runway, and Enterprise Underwriting Blockers"
    body: "Upwind's balance sheet and forward capital adequacy are anchored by extensive venture capital backing. Following its $250 million Series B round announced in January 2026 led by Bessemer Venture Partners with participation from Salesforce Ventures, Upwind raised an additional $300 million funding round in September 2026 co-led by Bessemer Venture Partners and TCV at a $3.8 billion valuation. This financing sequence brought Upwind's cumulative capital raised to between $680 million and $728 million across five equity rounds since its founding in 2022. Third-party financial reporting indicates that Upwind expanded from under $20 million in ARR at year-end 2025 to an estimated $50 million to $60 million by mid-2026, with management targeting $100 million in ARR by the end of 2026. Despite substantial liquidity and rapid headline growth, Upwind's forward burn rate, cash runway, and cap-table liquidation preferences remain confidential. Institutional underwriters face material diligence blockers: the current $3.8 billion valuation represents an aggressive multiple exceeding 60x trailing revenue run-rate, creating acute valuation vulnerability if growth moderates or enterprise renewal rates diverge from insider projections."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
