figures:
  - id: FU001
    title: Customer adoption and expansion journey map
    type: journey-map
    summary: >-
      Maps the five-stage enterprise journey from runtime evaluation through ecosystem integration and automated agentic SecOps expansion.
    data:
      nodes:
        - id: stage-1
          label: Initial Assessment
          detail: CISO prioritizes runtime exploitability over alert noise
        - id: stage-2
          label: Technical Evaluation
          detail: Cloud security team tests API visibility and eBPF kernel telemetry
        - id: stage-3
          label: POC & Production Deployment
          detail: Lightweight eBPF sensor deployed across Kubernetes and containers
        - id: stage-4
          label: Core Threat Detection
          detail: Runtime API activity, application-layer visibility, and vulnerability prioritization
        - id: stage-5
          label: Platform Expansion
          detail: Adding observability, configurations, and agentic AI incident remediation
        - id: stage-6
          label: Ecosystem Integration
          detail: Ingestion into SIEM/SOAR, Cisco Cloud Control MCP, and partner workflows
    approximationNotes: Journey stages synthesized from published customer architecture, case study workflows, and Technology Alliances program structures.
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU014
