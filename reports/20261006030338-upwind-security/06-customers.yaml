  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Formal disclosures of Net Revenue Retention (NRR), Gross Revenue Retention (GRR), cohort logo churn, and renewal rates.
      whyItMatters: Prevents independent confirmation of post-onboarding software stickiness, expansion economics, and revenue durability.
      diligencePath: Request audited SaaS cohort retention tables, customer renewal rates, and expansion ARR data during confidential diligence.
      relatedQuestionRefs:
        - QU004
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-5 and Top-10 customer revenue concentration percentages, largest individual account ARR, and channel partner contract terms.
      whyItMatters: High dependence on channel partners and potentially concentrated early accounts creates vulnerability to reseller disruption or key client churn.
      diligencePath: Review revenue concentration schedules by customer account and channel partner agreements in financial diligence.
      relatedQuestionRefs:
        - QU008
    - type: enumeration-incomplete
      severity: minor
      topic: customer-proof
