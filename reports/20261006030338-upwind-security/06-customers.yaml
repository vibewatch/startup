company:
  name: Upwind Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Upwind Security reports rapid enterprise adoption, disclosing over 150 to 200 customers alongside 900% year-over-year revenue growth.
    Publicly verified production deployments include global enterprises such as Sprinklr, Siemens, Peloton, Roku, Wix, Nextdoor, and NuBank,
    with channel partnerships driving the majority of major accounts. However, critical retention metrics including NRR, GRR, churn, and
    contract length remain private, and customer concentration is obscured by limited outcome quantification.
sections:
  - id: customer-segmentation-and-icp
    title: Customer Segmentation and Ideal Customer Profile
    body: >-
      Upwind Security positions its runtime-first Cloud-Native Application Protection Platform (CNAPP) directly at enterprises operating
      complex, modern cloud infrastructure across Kubernetes, containerized services, and serverless architectures. The company focuses
      predominantly on business-to-business (B2B) enterprise technology buyers, specifically Chief Information Security Officers (CISOs),
      Chief Security Officers (CSOs), and dedicated product security and SecOps engineering teams. Enterprise environments experiencing rapid
      adoption of microservices and agentic AI systems represent Upwind's core target market. High-growth technology firms, digital-native consumer
      platforms, and global industrial conglomerates represent the principal customer verticals identified in public records. In these organizations,
      the primary purchasing driver is the urgent requirement to cut through static security alert noise by validating live runtime exploitability
      and execution pathways rather than relying on stale periodic configuration snapshots.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
  - id: enterprise-adoption-trajectory
    title: Adoption Trajectory and Scale Evidence
    body: >-
      Commercial momentum has accelerated dramatically throughout 2026 following Upwind's January 2026 $250 million Series B and subsequent $300 million
      financing rounds, which lifted valuation from $1.5 billion to $3.8 billion. Company disclosures report exceeding 150 active customers on official
      newsroom surfaces, with external venture tracking recording more than 200 enterprise customers alongside 900% year-over-year revenue expansion.
      Management reports that its customer base has doubled over recent operating cycles. Much of this top-of-funnel velocity has been catalyzed by
      a fast-expanding channel strategy, where over 100 managed service providers (MSPs), value-added resellers (VARs), and cloud marketplaces
      account for the majority of major account acquisitions. While top-line customer count expansion is well-evidenced by third-party deal summaries,
      precise active deployment utilization, workload node counts, and average annual recurring revenue (ARR) per customer remain confidential.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU002
  - id: named-customer-proof-and-case-studies
    title: Named Customer Proof and Production Deployments
    body: >-
      Public customer validation spans several marquee global enterprises, demonstrating production-grade applicability across diverse operational
      footprints. A featured production deployment is publicly documented with Sprinklr, an enterprise AI-native customer experience platform.
      Sprinklr's product security organization deployed Upwind's runtime sensor architecture across its multi-cloud estate to monitor application-layer
      threats, gain real-time API visibility, and correlate fragmented security signals into contextual threat investigations. Furthermore, financial
      and enterprise technology databases record production adoption across multinational industrial manufacturer Siemens, connected fitness platform
      Peloton, streaming provider Roku, web publishing platform Wix, neighborhood network Nextdoor, and digital banking pioneer NuBank. Strategic advisory
      appointments, notably former Facebook, Uber, and Cloudflare CSO Joe Sullivan, also serve as high-profile validation mechanisms for enterprise CISO buyers.
      Nevertheless, with the exception of qualitative workflow benefits highlighted by Sprinklr, published customer references provide few audited operational
      metrics such as quantified mean-time-to-remediate (MTTR) reductions or false-positive percentage drops.
    claimRefs:
      - CU001
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU003
  - id: retention-expansion-and-durability-risks
    title: Retention, Durability, and Concentration Dynamics
    body: >-
      Upwind's long-term commercial durability hinges on land-and-expand mechanics and runtime infrastructure reliability. The company is built API-first,
      anchoring initial enterprise adoption on runtime visibility and threat detection before expanding into observability, posture management,
      and autonomous agentic SecOps remediation modules. Strategic technology alliance programs, such as "The Lineup" and integrations with Cisco
      Cloud Control via the Model Context Protocol (MCP), facilitate enterprise expansion by embedding Upwind's runtime telemetry directly into preexisting
      analyst workflows. Despite rapid land rates, Upwind does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), cohort renewal
      rates, or average contract length. Moreover, operational reliability represents a material durability factor: third-party monitoring via Statusfield
      recorded 9 service incidents over a 90-day window ending September 2026, comprising 3 major outages and 5 degraded performance periods, primarily
      impacting third-party integrations despite an overall 99.95% uptime availability figure.
    claimRefs:
      - CU004
      - CU014
      - CU015
      - CU016
    figureRefs:
      - FU001
callouts:
  - calloutType: strength
    title: Strong Enterprise Reference Validation
    body: >-
      Upwind has established verified customer deployments across premier publicly traded enterprises and high-scale tech firms, including Sprinklr,
      Siemens, Roku, Peloton, and NuBank. This tier of reference logos provides significant credibility for enterprise CISO procurement.
    claimRefs:
      - CU001
      - CU011
      - CU012
  - calloutType: risk
    title: Private Retention Metrics and Runtime Outage Exposure
    body: >-
      While customer acquisition velocity is robust, Upwind keeps NRR, GRR, and churn metrics strictly confidential. Furthermore, third-party monitoring
      revealing 9 service incidents over 90 days underscores operational risk for mission-critical runtime security infrastructure.
    claimRefs:
      - CU014
      - CU016
