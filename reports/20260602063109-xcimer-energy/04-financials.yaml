- id: capital-intensity-and-benchmark-context
  title: Capital Intensity and Benchmark Context
  body: 'Because Xcimer does not publish plant capex, LCOE, or project-finance assumptions, the best public way to frame future financing need is through peer and sector benchmarks. Those benchmarks are directionally sobering. FIA survey data summarized by World Nuclear News says fusion companies still report a $3 million to $12.5 billion range of additional capital needed to bring first pilot plants online, with a $700 million median and more than $77 billion in aggregate. The Fusion Report goes further and argues that even companies already past the billion-dollar mark will likely need billions of dollars per plant using combinations of equity, commercial debt, and construction debt.


    Peer financings show the same escalation curve. Focused Energy raised $240 million in a Series A tied to the Biblis site, Pacific disclosed more than $900 million of milestone-unlocked Series A commitments, Helion says it has more than $1 billion invested and a $5.425 billion post-money valuation, and CFS says it is close to $3 billion in cumulative capital. General Fusion''s public-market path is a useful cautionary benchmark: public materials advertised roughly $1 billion of pro-forma equity value, yet the Form F-4 makes clear that redemptions can reduce available trust cash and that even the combined financing is insufficient to fund commercialization. That does not prove what Xcimer will need, but it does imply that a $100 million prototype round is not remotely the full capital stack for an inertial-fusion plant company.'
