callouts:
- calloutType: strength
  title: Serious early capital, serious disclosure gap
  body: Xcimer's $100 million Series A and DOE support are enough to prove the company is real and financeable at the prototype stage. They are not enough to tell an outside investor what price that capital bought, what terms it carries, or how close the company is to its next financing event.
  claimRefs:
  - CI001
  - CI004
  - CI007
  - CI015
- calloutType: risk
  title: Current underwriting is mostly about what is missing
  body: No public revenue, ARR, pricing, gross margin, burn, runway, valuation, or cap-table terms were found in the fetched record. That forces this chapter to rely on disclosure gaps and sector benchmarks rather than a true company-level model.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI030
- calloutType: risk
  title: Prototype capital is not plant capital
  body: 'Sector surveys, peer financings, and General Fusion''s filing all point the same way: first pilot plants can require hundreds of millions to billions of dollars, and even late-stage peers still need more capital. Xcimer''s current disclosed capital is meaningful, but it is likely only an early layer of a much larger eventual stack.'
