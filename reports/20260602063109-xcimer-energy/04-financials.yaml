- id: TI007
  title: Capital-intensity and peer financing benchmark table
  columns:
  - Company / benchmark
  - Public capital signal
  - What capital funds
  - Financing structure signal
  - Relevance to Xcimer
  rows:
  - - Xcimer
    - $100M Series A + $9M DOE support
    - Prototype laser, Denver facility, hiring, milestone program
    - Venture equity plus grant support
    - Real early backing, but no visible plant-finance layer
  - - Focused Energy
    - $240M Series A
    - Biblis industrial laser-fusion development
    - Strategic and public investors tied to a former plant site
    - Direct inertial-fusion peer with more disclosed industrial-site financing context
  - - Pacific Fusion
    - '>$900M committed Series A'
    - Net facility gain push and commercial-system engineering
    - Funding committed upfront and released by milestones
    - Shows how later fusion rounds can reduce interim fundraising risk
  - - Helion
    - $425M Series F; >$1B total; $5.425B post-money
    - Commercialization scale-up and first plant siting
    - Large venture round paired with named customer agreements
    - Shows valuation premium that follows customer proof and capital depth
  - - Commonwealth Fusion Systems
    - $863M Series B2; close to $3B total
    - Finish SPARC and advance ARC plant
    - Global multi-constituency syndicate plus Google-linked plant development
    - Illustrates financing scale for a fusion leader moving toward grid delivery
  - - General Fusion
    - ~$1B pro forma equity value; up to $230M trust cash subject to redemptions
    - LM26 and commercialization de-risking
    - SPAC/PIPE path with explicit redemption risk; filing says more capital still needed
    - Highlights refinancing risk even on a public-market route
  - - FIA / WNN sector benchmark
    - $3M-$12.5B additional capital per company; $700M median
    - First pilot plants
    - Sector-wide estimate rather than company-specific financing
    - Suggests Xcimer's current capital base is small relative to many commercialization cases
  - - Woodruff / F4E cost context
    - IFE cost drivers include lasers, power supplies, and non-power-core costs
    - Plant-level cost structure rather than company financing
    - Standards-aligned techno-economic benchmarking
    - Supports caution that commercial inertial-fusion plants will require large staged capital stacks
  notes: Peer rows are benchmarks, not direct forecasts for Xcimer. They are included to frame forward capital needs where Xcimer itself does not publish plant capex or financing assumptions.
