  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-cap-table
    missingEvidence: Signed Series A price, ownership sold, preference stack, option pool, and board-rights documentation.
    whyItMatters: Without pricing and shareholder-rights data, dilution history and return sensitivity cannot be underwritten.
    diligencePath: Request the cap table, executed term sheet, and board materials for the 2024 Series A.
    relatedQuestionRefs:
    - QI005
    - QI023
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Current cash balance, monthly burn, program-level spend, and runway scenario analysis.
    whyItMatters: These inputs determine financing urgency and the probability of near-term dilution.
    diligencePath: Request the latest balance sheet plus a 12-month cash bridge by program and hiring plan.
    relatedQuestionRefs:
    - QI006
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-and-customer-disclosure
    missingEvidence: Booked revenue, contracted MW, pipeline stages, customer concentration, and any deposits or prepayments.
    whyItMatters: Without counterparties and demand evidence, the company cannot be judged on revenue quality or bankability.
    diligencePath: Request customer pipeline materials, contract summaries, and any signed offtake or reservation documents.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI021
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin model, target cost stack, maintenance assumptions, target throughput, and utilization assumptions.
    whyItMatters: Architecture-level claims do not substitute for a plant-level economic model.
    diligencePath: Request the internal unit-economics model that bridges laser claims to delivered-power cost and gross margin.
    relatedQuestionRefs:
    - QI011
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: plant-capex-lcoe
    missingEvidence: FOAK and NOAK plant capex, LCOE, construction schedule, and financing-mix assumptions for Vulcan and the first commercial plant.
    whyItMatters: Capital intensity and power-price competitiveness are the core financial questions for a fusion company.
