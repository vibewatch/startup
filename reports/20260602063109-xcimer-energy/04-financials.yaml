company:
  name: Xcimer Energy
chapter:
  number: 4
  title: Financials
  summary: Xcimer has credible early financing — a $100 million Series A plus a $9 million DOE milestone award — and a strong climate-tech syndicate, but public financial visibility stops there. No public source in the fetched record discloses revenue, ARR, pricing, gross margin, burn, runway, valuation, or cap-table terms, so underwriting is dominated by disclosure gaps. Peer financings and fusion cost studies imply that prototype funding is real but still small relative to the capital likely required for pilot-plant and first-plant execution.
sections:
- id: disclosed-capital-and-syndicate-quality
  title: Disclosed Capital and Syndicate Quality
  body: 'Xcimer''s public financing story is short and credible. Official and independent coverage all converge on a $100 million Series A announced in June 2024, led by Hedosophia with participation from Breakthrough Energy Ventures, Lowercarbon Capital, Prelude Ventures, Emerson Collective, Gigascale Capital, and Starlight Ventures. The same disclosures say the money is earmarked for a Denver facility, a prototype laser system, pulse-compression hardware, and team expansion, which makes the raise look like genuine prototype capital rather than a soft marketing announcement. Xcimer also cites a $9 million 2023 DOE Milestone-Based Fusion Development Program award, giving it a visible layer of non-dilutive support and access to public-private inertial-fusion infrastructure.


    That financing stack matters, but so do the omissions. None of the fetched public sources disclose Xcimer''s post-money valuation, ownership sold, liquidation preferences, board-control terms, or option-pool structure. The syndicate quality is strong enough to support the view that sophisticated investors have done some diligence, but investor brand is not a substitute for financial disclosure. The public record therefore supports a narrow positive conclusion: Xcimer has raised credible early capital from serious backers and federal support programs. It does not support a stronger conclusion about entry price, dilution history, or current balance-sheet strength.'
