  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: xcimer-economics
    missingEvidence: Independent capex, LCOE, and maintenance model for a Xcimer plant, plus third-party validation of the claimed excimer cost advantage.
    whyItMatters: Without externally tested economics, the market case rests mainly on company-authored engineering assumptions.
    diligencePath: Request Xcimer's plant model, third-party technical diligence memos, and milestone-gated sensitivity analysis versus gas, nuclear, and renewable-plus-storage alternatives.
    relatedQuestionRefs:
    - QM016
  - type: missing-source
    severity: material
    topic: xcimer-sam
    missingEvidence: A public or diligence-only SAM that isolates AI campuses, desalination, and industrial decarbonization geographies where Xcimer is actively selling.
    whyItMatters: Broad fusion TAMs do not show whether Xcimer has a winnable near-term market segment.
    diligencePath: Ask management for prioritized verticals, target geographies, expected project sizes, and buyer pipeline by segment.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: target-manufacturing
    missingEvidence: Xcimer-specific target-production throughput, shot cadence, chamber maintenance interval, and replacement-cost assumptions.
    whyItMatters: ICF market adoption depends on repeatability and consumables economics as much as on ignition physics.
    diligencePath: Request target-factory design assumptions, consumables bill of materials, target cost curves, and maintenance cadence for Phoenix, Anvil, and Vulcan follow-ons.
    relatedQuestionRefs:
    - QM018
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer discussions, PPA drafts, site-selection criteria, or non-binding MOUs showing real Xcimer commercial traction.
    whyItMatters: Peers have already published at least some customer or siting proof; Xcimer has not.
    diligencePath: Ask for pipeline stage by customer, counterparties under NDA, site shortlist, and what milestone must be met before contracting.
    relatedQuestionRefs:
    - QM021
    - QM023
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: fuel-cycle
    missingEvidence: A public Xcimer tritium startup and breeding strategy, including dependence on outside suppliers and enriched lithium assumptions.
    whyItMatters: Fuel autonomy is a gating issue for any D-T-adjacent or tritium-dependent plant architecture and influences deployment timing and cost.
    diligencePath: Request Xcimer's fuel-cycle architecture, startup inventory assumptions, breeding pathway, and supplier map for tritium and lithium-bearing materials.
    relatedQuestionRefs:
    - QM017
    - QM025
    relatedTableRefs:
    - TM004
