- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: Commercial fusion adoption runs through a narrow sequence of technical, regulatory, and customer gates; Xcimer is still before the anchor-customer stage in the public record.
  data:
    nodes:
    - id: n1
      label: Prototype and public-private validation
      detail: Lab milestones, DOE programs, LIFT access, and architecture validation establish technical credibility.
      tone: neutral
    - id: n2
      label: Site, licensing, and supply-chain readiness
      detail: Developers must align permitting, tritium handling, component sourcing, and manufacturing capacity.
      tone: neutral
    - id: n3
      label: Anchor customer or offtake agreement
      detail: A hyperscaler, utility, or industrial buyer underwrites early plant demand and de-risks financing.
      tone: positive
    - id: n4
      label: FOAK project finance and EPC execution
      detail: Capital intensity shifts the market from science validation to real project delivery risk.
      tone: warning
    - id: n5
      label: Grid connection and first commercial operations
      detail: Only after operating performance exists can broader utility or industrial adoption accelerate.
      tone: positive
    - id: n6
      label: Repeat deployment and market broadening
      detail: Standardized supply chains, falling cost, and operating data turn a niche beachhead into a wider market.
      tone: positive
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
  approximationNotes: This flow abstracts across peer commercialization paths. Xcimer is publicly visible in stages n1-n2 but has not yet disclosed the n3 anchor-customer gate.
