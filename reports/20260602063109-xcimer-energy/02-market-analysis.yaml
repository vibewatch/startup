tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Xcimer
  rows:
  - - Hyperscaler and AI-campus firm power
    - Long-term PPAs, behind-the-meter generation, capacity reservations, interconnection-ready plant development
    - General colocation rent, software spend, and generic renewable offsets without firm-power need
    - Hyperscalers, data-center developers, infrastructure and energy-procurement teams
    - Directly matches Xcimer's AI training cluster use case and the strongest premium-firm-power demand signal
  - - Industrial decarbonization and process power
    - On-site power blocks, long-duration electricity supply, cogenerated heat, replacement of fossil-fuel baseload
    - Energy-efficiency software, carbon accounting tools, or low-duty-cycle backup power
    - Plant operations, energy procurement, sustainability leadership, project-finance sponsors
    - Matches Xcimer's industrial decarbonization use case and peers' heavy-industry customer narrative
  - - Desalination and water infrastructure
    - Co-located power plus water projects, sovereign or municipal infrastructure finance, stable high-load power supply
    - Routine water-utility O&M without new generation procurement
    - Water utilities, sovereign infrastructure vehicles, municipal sponsors
    - Matches Xcimer's desalination use case and favors compact, always-on generation
  - - Grid-scale fusion plant deployment
    - FOAK plant capex, utility or IPP development budgets, regulated capacity procurement, grid-integration spending
    - Pure research grants disconnected from commercial plant buildout
    - Utilities, IPPs, grid planners, public-private consortia
    - Likely long-run scaling path once a first Xcimer plant is financeable
  - - 'Adjacency: fusion enabling supply chain and public R&D'
    - Targets, optics, pulsed-power, fuel-cycle, and lab-partnership spending that unlocks deployment
    - Counted in Xcimer TAM only if Xcimer monetizes components or services directly
    - DOE, labs, suppliers, peer developers
    - Critical gating ecosystem, but not core end-market revenue for Xcimer today
  notes: Included spend is limited to commercial plant and firm-power budgets relevant to Xcimer's stated use cases. Fusion science, isotope businesses, and generic clean-power spending are treated as excluded or adjacent unless they directly enable a Xcimer plant sale.
