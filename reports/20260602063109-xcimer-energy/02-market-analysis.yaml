    - Central energy procurement plus campus-development budgets
    - Need for 24-7 carbon-free power where grid capacity is constrained
    - Strong peer proof via Helion and CFS analogs; Xcimer has no public deal
  - - Utilities / IPPs
    - Regulated utilities, merchant developers, grid-serving generation sponsors
    - Grid operators and load-serving entities
    - Utility development budgets, rate-base recovery, or project finance
    - Need for firm clean capacity that can complement intermittent renewables
    - CFS and General Fusion frame this path, but Xcimer has no public site or utility partner
  - - Industrial decarbonization sites
    - Steel, chemicals, fuels, and other process-heavy operators
    - Plant operations and energy-management teams
