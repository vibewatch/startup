figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The defensible market lens narrows from broad fusion ecosystem forecasts to a smaller premium-firm-power beachhead, while Xcimer's disclosed current SOM remains zero in public contracted demand.
  data:
    nodes:
    - label: 'Broad fusion ecosystem TAM: $18.0B in 2026 to $33.77B in 2031'
      detail: MarketsandMarkets counts a wide fusion market across technologies, fuels, end users, and regions.
      tone: positive
    - label: 'Longer-horizon sector scenario: $40B-$80B by 2036 and >$350B by 2050'
      detail: Future Markets frames fusion as a future energy-system market rather than just a developer ecosystem.
      tone: positive
    - label: 'Demand-pull beachhead: data-center electricity from ~415 TWh in 2024 to ~945 TWh by 2030'
      detail: AI and hyperscaler load growth creates a premium firm-power need that can support early fusion buyers.
      tone: neutral
    - label: 'Public Xcimer SOM today: 0 disclosed MW and no public PPA'
      detail: The company names end markets but has not yet disclosed the customer proof already visible at some peers.
      tone: warning
  approximationNotes: The layers are different sizing lenses, not additive arithmetic. Upper layers are market-value forecasts, the third layer is a demand proxy in TWh, and the bottom layer is disclosed contracted demand in MW.
