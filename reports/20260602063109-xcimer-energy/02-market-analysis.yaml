- id: buyer-segments-and-adoption-path
  title: Buyer, User, and Payer Segmentation
  body: 'Peer evidence shows that early fusion buyers are not abstract ''the grid'' customers; they are specific organizations with acute reliability pain and concentrated budget authority. Helion''s disclosed agreements with Microsoft and Nucor show hyperscalers and heavy industry can act as anchor buyers before utilities normalize the category. FIA and Future Markets point to CFS and Google''s direct PPA as another proof point that premium clean-firm-power buyers may underwrite early plants years ahead of broad market maturity. Xcimer''s own named use cases imply four buyer groups that matter most: hyperscaler and AI-campus operators, utilities and IPPs, industrial decarbonization sites, and water or desalination infrastructure sponsors. Budget ownership differs sharply across them. Hyperscaler demand is usually driven by energy-procurement and data-center infrastructure teams; utility demand requires development budgets, rate-base logic, or IPP financing; industrial demand sits with plant
    energy, capex, and sustainability leaders; and desalination likely requires public-infrastructure or sovereign project finance. Across peers the adoption path looks similar: public-private R&D and prototype milestones, site selection and permitting, an anchor offtaker or industrial partner, FOAK project finance, then eventual grid delivery and repeat deployment. That sequence matters because Xcimer has the buyer story but not yet the customer proof points peers have already published.'
