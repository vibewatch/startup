- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and data-center power growth
    - up
    - current to 2030
    - Creates premium willingness to pay for firm clean power and makes fusion relevant before bulk-market parity
    - Test whether Xcimer has active discussions with hyperscalers or campus developers
  - - Fusion-specific U.S. regulatory treatment
    - up
    - current
    - Lower licensing burden than fission improves project-development optionality
    - Map exact licensing path for Xcimer's planned plant architecture and tritium handling
  - - DOE / LLNL commercialization infrastructure
    - up
    - current to medium-term
    - Public-private hubs, LIFT, and roadmap funding can shorten technical bottlenecks
    - Confirm whether Xcimer has formal access to shared facilities and milestone programs
  - - Capital intensity and FOAK financing
    - down
    - current and persistent
    - Large first-plant capex can delay adoption even if physics works
    - Request plant-level capex, financing assumptions, and offtake structures
  - - Target manufacturing, shot rate, and chamber survivability
    - down
    - current to medium-term
    - ICF economics depend on repeatability, component lifetime, and target throughput
    - Request target factory throughput, cost per target, and maintenance cadence assumptions
  - - Tritium, lithium-6, and specialized supply chains
    - down
    - medium-term
    - Fuel-cycle and component bottlenecks can cap deployment speed and raise costs
    - Request Xcimer fuel-cycle plan, tritium startup strategy, and supplier dependencies
  - - Trust and timeline credibility
    - down
    - current
    - Missed milestones can erode buyer and regulator confidence before revenue arrives
    - Request milestone-based commercial plan with externally verifiable decision gates
  notes: Direction=up indicates a market tailwind; direction=down indicates a real adoption friction that can delay or shrink realized demand. Timing focuses on when the issue affects commercial adoption, not when the underlying science was discovered.
