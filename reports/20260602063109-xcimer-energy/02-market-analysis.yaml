callouts:
- calloutType: strength
  title: Peer PPAs show buyer appetite can emerge before fusion is mature
  body: Helion's disclosed Microsoft and Nucor agreements and the sector's cited Google-CFS deal show that some customers are already willing to secure future fusion capacity well before commercial operations. That does not validate Xcimer specifically, but it does validate the idea that premium firm-power buyers may contract early if a developer looks credible enough.
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM024
  - CM038
- calloutType: insight
  title: Underwrite Xcimer as premium firm-power option value, not as bulk electricity today
  body: The strongest market thesis is not that Xcimer immediately displaces all power generation, but that it could one day sell scarce, high-value, carbon-free firm capacity into reliability-constrained niches. That framing better matches buyer behavior, substitute economics, and the current absence of public customer proof.
  claimRefs:
  - CM003
  - CM023
  - CM036
  - CM040
  - CM041
- calloutType: risk
  title: No public customer proof, quantified SAM, or validated plant economics yet
  body: Xcimer names compelling end markets, but it has not disclosed a customer, PPA, siting commitment, contracted megawatts, or independently validated LCOE or capex model. Those omissions leave the market case materially less mature than the peer examples that already show offtake or site selection.
  claimRefs:
  - CM002
  - CM029
  - CM039
