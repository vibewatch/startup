callouts:
- calloutType: insight
  title: The direct inertial peer set is small, but it is real
  body: Xcimer does not own the inertial-fusion commercialization narrative. Focused Energy and Pacific Fusion are close-enough technical peers with their own capital, sites, and timelines, so Xcimer cannot assume that “laser / inertial fusion” itself is a moat.
  claimRefs:
  - CP029
  - CP036
- calloutType: risk
  title: Customer proof is the current weak flank
  body: The most material competitive gap is not a published laboratory loss to another architecture; it is the absence of public Xcimer counterparties while Helion and CFS already sell public commercial narratives to buyers and capital providers.
  claimRefs:
  - CP031
  - CP032
  - CP035
  - CP038
