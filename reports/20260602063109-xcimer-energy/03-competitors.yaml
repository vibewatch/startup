  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public tariff, capex-per-kW, or LCOE disclosures for Xcimer and the main startup rivals.
    whyItMatters: Without price disclosure, buyer economics cannot be benchmarked against gas, storage, or fission substitutes.
    diligencePath: Request plant-economics models, draft term sheets, or redacted customer pricing decks from management and compare them against substitute procurement options.
    relatedQuestionRefs:
    - QP005
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named Xcimer utility, hyperscaler, industrial, or desalination counterparties; LOIs; or siting memoranda.
    whyItMatters: Commercial-proof gaps make it impossible to tell whether Xcimer is winning real customer mindshare against Helion, CFS, or substitute portfolios.
    diligencePath: Ask management for pipeline segmentation, NDA-protected counterparties, and any signed site, offtake, or development agreements.
    relatedQuestionRefs:
    - QP020
    - QP025
    relatedTableRefs:
    - TP001
    - TP003
  - type: missing-source
    severity: material
    topic: supplier-lock-in
    missingEvidence: Exclusive or preferred supplier agreements covering optics, lasers, isotopes, chamber systems, or critical manufacturing partners.
    whyItMatters: Supplier access could become a moat or a chokepoint, but public evidence currently suggests inputs can multi-home across rivals.
    diligencePath: Obtain supplier contracts or procurement letters and compare them with disclosed rival relationships in laser, isotope, and power-electronics stacks.
    relatedQuestionRefs:
    - QP015
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: plant-economics
    missingEvidence: Independent plant-economics model for Xcimer and its direct inertial peers, including maintenance, repetition rate, and chamber replacement assumptions.
    whyItMatters: Technical differentiation is not enough if first-plant economics remain above substitute power options for too long.
    diligencePath: Commission a third-party engineering and cost review using Xcimer, Focused, and Pacific assumptions against gas, storage, and SMR benchmarks.
    relatedQuestionRefs:
    - QP014
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: minor
    topic: tae-transparency
    missingEvidence: Current TAE funding scale, named customers, and detailed deployment schedule in public sources retained for this chapter.
    whyItMatters: TAE is a meaningful alternate pathway, but public opacity limits confidence in competitive ranking versus Xcimer.
    diligencePath: Pull recent TAE financing, customer, and plant-roadmap disclosures from interviews, filings, or partner announcements before hard-ranking TAE on readiness.
