- id: capability-pricing-and-go-to-market
  title: Capability, Pricing, GTM, and Trust Comparison
  body: |-
    Xcimer's strongest public differentiation claim is technical: it argues that KrF excimer lasers, lower cost per joule, two-beam geometry, and a thick liquid wall can make laser inertial fusion more scalable and more economical than incumbent laser architectures. That claim is coherent, but the public comparison is awkward because rivals are winning on different dimensions. Helion is strongest on disclosed commercial traction, not on Xcimer-like physics. CFS is strongest on capital scale, strategic partners, and utility-grade plant planning. Pacific and Focused attack Xcimer more directly by competing for the same “inertial fusion has already crossed the science threshold, now scale the engineering” narrative. TAE and General Fusion are weaker direct comps on architecture but still compete for the same buyer willingness to believe that one fusion platform will reach bankability first.

    Pricing is the biggest public blind spot across the category. Outside of generic claims about affordable electricity, the fetched record does not show list pricing, tariff structures, or independently verified levelized-cost disclosures for Xcimer or any of the startup rivals. That pushes comparison into softer but still material areas: who has named customers, who has disclosed plant sites, who has more mature partner ecosystems, and who looks credible to regulators, industrial hosts, and lenders. On that score Helion and CFS have the clearest edge, while Xcimer still sells a technology thesis more than a commercial package.
