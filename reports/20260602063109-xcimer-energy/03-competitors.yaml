- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or competitive bet
  - Threat or displacement vector
  - Severity
  - Mitigation / diligence ask
  rows:
  - - KrF excimer lasers can cut cost per joule and scale energy faster than incumbent laser architectures
    - Focused and Pacific also sell inertial-fusion commercialization stories, reducing uniqueness
    - high
    - Require independent side-by-side cost and scale evidence, not only company-authored comparisons
  - - Two-beam geometry and thick liquid wall improve chamber practicality
    - No public plant-economics or chamber-lifetime proof yet
    - high
    - Demand third-party engineering review of chamber, maintenance, and replacement assumptions
  - - Mid-2030s roadmap is still investable
    - Helion and CFS may lock in customers, sites, and public trust earlier
    - high
    - Track named counterparties, siting progress, and interconnection milestones by rival
  - - Technical differentiation can compensate for absent public pricing
    - Buyers may choose disclosed counterparties over a better but opaque design
    - high
    - Push Xcimer to disclose price framing, contract model, or benchmark economics
  - - Fusion customers can stay non-exclusive until Xcimer is ready
    - Project-development switching costs rise sharply once siting and offtake work starts
    - high
    - Prioritize anchor buyers before rivals consume the easiest counterparties
  - - Supplier base will remain open and nonexclusive
    - Laser, isotope, and materials chokepoints can favor better-funded rivals or delay everyone
    - high
    - Test whether Xcimer has any preferred supplier terms for optics, diodes, fuel, or chambers
  - - Sector optimism helps all serious fusion players
    - Timeline slippage can damage trust across the whole category, including Xcimer
    - medium-high
    - Pressure management to separate achieved milestones from aspirational dates
  - - No public moat is acceptable at this stage because the science still matters most
    - The market may reward financing, customer access, and procurement familiarity ahead of physics elegance
    - high
    - Treat GTM proof and plant-finance readiness as co-equal with technical milestones
  notes: Severity reflects underwriting risk over the next several years, not scientific merit. Several rows are not “failures” today; they are places where the public record does not yet show durable commercial protection.
