- id: commercial-proof-execution-and-kill-criteria
  title: Commercial proof, execution risk, and downside triggers
  body: 'The third cluster is where sector enthusiasm can most easily outrun Xcimer-specific evidence. The broad market signal exists: Microsoft signed with Helion, Google signed with CFS, and investors continue to finance alternative fusion paths at very large round sizes. That proves sophisticated counterparties are willing to back long-dated fusion optionality. It does not prove Xcimer has cleared the same bar. The fetched Xcimer record still shows no named customer, no offtake, no site host, no EPC partner, and no public interconnection path. That absence matters because the company is simultaneously asking investors to believe in aggressive technical milestones and in a future project-finance or customer-conversion story that is not yet visible. Governance opacity makes the downside harder to price: Xcimer discloses funding, but not valuation, terms, or dilution path. The practical mitigant is to underwrite this chapter around leading indicators rather than promises. If Phoenix publishes
    convincing integrated metrics, if Anvil obtains a host and entrance criteria, if Xcimer names a site and an anchor commercial counterparty, and if the next round arrives after—not before—those milestones, risk severity can fall quickly. If those indicators slip, the thesis breaks not because fusion is impossible, but because this specific translation from lab proof to bankable plant is taking too long and too much capital.'
