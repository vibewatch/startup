- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Integrated laser-target risk
    - Phoenix and then Anvil acceptance metrics
    - No public evidence of integrated beam-quality, pulse-compression, or target-coupling closure by the time Anvil is funded
    - Treat the 2030 to 2031 Vulcan schedule as broken and expect more dilution.
  - - Fuel-cycle and chamber risk
    - Target-factory, salt-loop, and tritium plan disclosures
    - No credible target throughput, maintenance cadence, or breeding assumptions before final siting decisions
    - Underwrite Xcimer as a research program rather than a bankable plant developer.
  - - Financing risk
    - Round timing versus milestone closure
    - Large follow-on raise arrives before Phoenix closure, site selection, or customer proof
    - Assume negotiating leverage is weak and dilution risk is rising.
  - - Commercial risk
    - Named host / customer / offtake announcements
    - Still no named site host, utility, industrial user, or hyperscaler counterparty after next major financing event
    - Discount all demand-side upside and focus only on technical optionality.
  - - Regulatory and siting risk
    - Project-specific permitting milestones
    - State selection remains open or licensing path remains undefined as Vulcan construction window approaches
    - Expect schedule slip even if technology milestones look healthy.
  notes: These triggers are meant to be observed between 2026 and the first major plant-financing event; they convert broad risk categories into concrete stop-or-go signals.
