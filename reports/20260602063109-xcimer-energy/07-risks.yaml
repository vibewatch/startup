  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: licensing-and-jurisdiction
    missingEvidence: A siting memo that names the target state, licensing authority, radioactive-material handling basis, and the specific tritium and emergency-planning assumptions for Vulcan and Athena.
    whyItMatters: The ADVANCE Act simplifies the top-line framework, but project timing and cost still depend on which state regulates the facility and what tritium-handling obligations apply at the chosen site.
    diligencePath: Request the site-screening matrix, outside counsel memo on NRC versus Agreement State jurisdiction, draft radioactive-material licensing path, and the planned tritium inventory and transport assumptions.
    relatedQuestionRefs:
    - QR009
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: site-host-and-offtake
    missingEvidence: Named site-host discussions, interconnection studies, EPC counterparties, and any customer, utility, or hyperscaler letters of intent tied to Vulcan or Athena.
    whyItMatters: Without a host, offtaker, or interconnection path, even a technically successful program can stall before plant financing and customer conversion become real.
    diligencePath: Request the top candidate sites, queue or transmission studies, EPC workstreams, and any signed or near-signed commercial documents with anchor counterparties.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-and-dilution
    missingEvidence: Current valuation, liquidation preferences, remaining cash runway, expected round timing, and the amount of capital management believes is needed to reach Anvil, Vulcan, and Athena.
    whyItMatters: A technically ambitious hardware roadmap can destroy investor returns if future financing arrives before technical or customer proof, yet public materials do not disclose enough to model that downside.
    diligencePath: Request the cap table, board deck financing plan, milestone-linked burn forecast, and scenario analysis showing how delayed milestones would change round size and ownership dilution.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: integrated-laser-and-target-proof
    missingEvidence: Measured Phoenix beam-quality results, pulse-compression efficiency, phase-preservation data, target injector reliability, and the acceptance criteria for progressing from Phoenix to Anvil.
    whyItMatters: The public record supports subsystem progress, but not the integrated laser-target performance required to underwrite the 2030 to 2031 Vulcan timeline.
    diligencePath: Request the engineering scorecard for Phoenix, the Anvil entrance criteria, subsystem test reports, and the independent reviewers or advisors who have validated those metrics.
    relatedQuestionRefs:
    - QR002
    - QR020
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: fuel-cycle-and-chamber-operations
    missingEvidence: A detailed target-factory plan, target-cost model, salt chemistry and pump-lifetime data, tritium breeding and recovery assumptions, and expected chamber-maintenance cadence.
    whyItMatters: These subsystems determine whether Xcimer’s plant can run repetitively and economically rather than merely achieving isolated fusion milestones.
    diligencePath: Request the process flow for target manufacture and injection, salt-loop test data, tritium breeding ratio assumptions, and sensitivity analyses for downtime, maintenance, and target cost.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR024
    - QR028
    relatedTableRefs:
    - TR002
    - TR004
