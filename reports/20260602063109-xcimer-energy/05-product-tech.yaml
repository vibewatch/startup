  evidenceGaps:
  - type: missing-source
    severity: material
    topic: target-manufacturing
    missingEvidence: Pilot-line target-factory yield, per-target cost, scrap rate, and shot-ready throughput data for the capsule design Xcimer actually intends to use in Anvil, Vulcan, and Athena.
    whyItMatters: Plant economics and uptime depend on target supply being cheap, reliable, and manufacturable at much higher cadence than today's experimental campaigns.
    diligencePath: Request a target-factory process flow, partner responsibilities, and any pilot-manufacturing statistics or reliability demonstrations.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: blocking
    topic: plant-economics
    missingEvidence: Independent first-of-a-kind capex, opex, and LCOE model with sensitivities for laser cost, target cost, shot rate, chamber maintenance, and recirculating power.
    whyItMatters: Company-authored cost-per-joule estimates are not sufficient to underwrite a multibillion-dollar pilot plant or compare it with other firm-power options.
    diligencePath: Obtain a third-party engineering review or lender-style plant model that reproduces and stress-tests the whitepaper assumptions.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: chamber-chemistry
    missingEvidence: Demonstrated FLiBe or FLiNaK pump, nozzle, corrosion, redox-control, and chamber-clearing performance under repetitive thermal and neutron-relevant conditions.
    whyItMatters: The thick-liquid-wall advantage collapses if salt hydraulics, chemistry control, or component wear make the chamber unavailable or unsafe.
    diligencePath: Request long-duration fluid-loop data, materials coupons, and nozzle / vapor-clearing test results from Xcimer or its partners.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: integrated-validation
    missingEvidence: Integrated two-beam shots with representative pulse shaping, target injection, chamber recovery, and post-shot diagnostics that connect the laser thesis to plant-like operability.
    whyItMatters: Subscale component milestones do not prove that the full architecture can run repeatably enough for an energy product.
    diligencePath: Track Phoenix shot data and Anvil design reviews, then require an integrated demonstration report before treating Vulcan timing as credible.
    relatedQuestionRefs:
    - QE024
    - QE019
  - type: missing-source
    severity: material
    topic: startup-fuel-cycle
    missingEvidence: A public startup-inventory and breeding-closure plan showing how Xcimer would source initial tritium and manage breeding transitions without relying on nonexistent civilian stockpiles.
    whyItMatters: A DT plant cannot be bankable if its startup fuel and breeding assumptions are left at narrative level while external tritium remains scarce and expensive.
    diligencePath: Request a fuel-cycle mass balance, startup inventory plan, and sensitivity analysis for tritium decay, processing losses, and lithium-isotope availability.
    relatedQuestionRefs:
    - QE021
    - QE025
