- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role in system
  - Key dependency
  - Current evidence
  - Main risk
  rows:
  - - KrF excimer amplifier modules (LPK / KJC / Argos)
    - Generate microsecond 248-nm pump pulses
    - E-beam cathodes, Marx generators, capacitors, gas handling
    - Denver prototypes and Phoenix construction
    - MJ-scale efficiency and hardware lifetime are not public
  - - Raman beam combiner
    - Concentrates many low-fluence beams into one high-quality beam
    - Gas-cell stability and seed-beam control
    - Whitepaper architecture only
    - No public integrated demonstration
  - - 'SBS gas mirror #1'
    - Reflects and compresses long pulses to shorter durations
    - Phase preservation and nonlinear-threshold control
    - Phoenix objective
    - No public plant-scale proof
  - - 'SBS gas mirror #2 + vacuum shutter'
    - Final compression to a few nanoseconds and gas-to-vacuum transition
    - Fast shutter reliability and gas/vacuum interface control
    - Whitepaper architecture only
    - No public repetitive-operation life data
  - - Hybrid direct-drive target
    - Uses halfraum-assisted initial pulse plus shaped direct beams
    - Phase plates, adaptive optics, target fabrication
    - 2024 target paper and OMEGA halfraum campaign
    - Two-beam symmetry is still unproven at plant scale
  - - Target injection / alignment / diagnostics
    - Places a capsule at chamber center and verifies shot quality
    - Injector accuracy, diagnostics, and chamber clearing
    - Roadmap only plus historical IFE literature
    - No public injector prototype data
  - - Thick-liquid chamber / salt loop
    - Absorbs neutron energy, protects structure, and breeds tritium
    - FLiBe or FLiNaK hydraulics, corrosion control, heat exchange
    - Whitepaper and LLNL IFE sources
    - Pumps, nozzles, vapor clearing, and chemistry remain open
  - - Steam-cycle balance of plant
    - Converts salt heat into exportable grid electricity
    - Heat exchanger integration, tritium cleanup, and turbine systems
    - Athena concept only
    - No public EPC or licensing package
  notes: Rows mix current hardware with planned plant components because Xcimer has not yet published a single integrated architecture document beyond the whitepaper. Risks focus on what is still missing from public evidence, not on theoretical impossibility.
