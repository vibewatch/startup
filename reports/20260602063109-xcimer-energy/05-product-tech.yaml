callouts:
- calloutType: strength
  title: Plant compatibility is the real product thesis
  body: Xcimer is explicitly designing around beam-count reduction, optics survivability, and liquid-wall compatibility rather than assuming NIF-like hardware can simply be scaled into a power plant.
  claimRefs:
  - CE004
  - CE011
  - CE023
  - CE045
- calloutType: risk
  title: No public integrated breakeven proof exists yet
  body: The retained corpus supports component progress and partial target validation, but not an integrated two-beam system demonstrating engineering breakeven, target-factory throughput, or bankable plant economics.
  claimRefs:
  - CE022
  - CE029
  - CE041
  - CE043
- calloutType: assumption
  title: Economics depend on low-rate, breeding-ready operation
  body: The business case assumes low repetition rate, reliable chamber clearing, breeding-ready salt loops, and acceptable recirculating power; if any of those fail, the laser-cost thesis alone will not save the plant model.
  claimRefs:
  - CE012
  - CE021
  - CE039
  - CE040
