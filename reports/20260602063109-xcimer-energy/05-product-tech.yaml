  data:
    layers:
    - id: offtaker-layer
      label: Offtaker and plant-control interface
      detail: Dispatch, outage planning, grid interconnect, and host-site operations that define the commercial product seen by a utility, hyperscaler, or industrial host.
      modules:
      - Grid interconnect and dispatch controls
      - Maintenance and shot scheduling
      - Host-site electrical / thermal interface
    - id: driver-layer
      label: Laser-driver production layer
      detail: The pulsed-power and excimer hardware that creates long-pulse ultraviolet energy at plant-relevant scale.
      modules:
      - Marx generators
      - High-voltage capacitors
      - E-beam cathodes
      - KrF excimer amplifier modules
    - id: gas-optics-layer
      label: Gas-optics compression and beam-delivery layer
      detail: Nonlinear optical gas cells convert many long pulses into two high-quality, nanosecond target-driving beams.
      modules:
      - Raman beam combiner
      - 'SBS gas mirror #1'
      - 'SBS gas mirror #2'
      - Windowless vacuum shutter
    - id: target-layer
      label: Target supply and engagement layer
      detail: Capsule fabrication, injection, alignment, and two-sided hybrid direct-drive engagement.
      modules:
      - DT capsule and ablator
      - Target injector
      - Phase plates / adaptive optics
      - Shot diagnostics
    - id: chamber-layer
      label: Fusion chamber and salt-blanket layer
      detail: HYLIFE-style thick liquid wall absorbs neutrons and heat while shielding structure and breeding tritium.
      modules:
      - Liquid-salt jets / waterfall geometry
      - Neutron moderation and breeding
      - Vapor clearing and chamber recovery
    - id: power-layer
      label: Power-conversion and recirculating systems layer
      detail: Turns captured heat into exportable electricity and recirculating plant power while managing salt cleanup and tritium handling.
      modules:
      - Heat exchangers
      - Steam turbine / generator
      - Fuel cleanup and recirculating-power loop
