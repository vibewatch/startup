  rows:
  - - Phoenix laser bay
    - Validates long-pulse excimer operation, Marx pulsed power, and SBS gas-mirror compression
    - In build / H1 2026 stage-gate
    - Xcimer laser, controls, and pulsed-power teams
    - First internal proof that the KrF-plus-gas-optics thesis can work as one beamline
    - No public integrated two-beam target shot or repetition-rate statistics
  - - Argos module + Anvil beamlines
    - Provide full-scale excimer hardware and a 200-kJ two-sided target shooter
    - Planned 2027-2028
    - Xcimer plus target and diagnostics collaborators
    - Brings commercial-scale hardware before the multi-megajoule step
    - No disclosed lifetime, maintenance, or uptime data
  - - Vulcan facility
    - Stacks many Argos modules into a 4-MJ system with a 12-MJ upgrade path
    - Planned 2030-2031
    - Xcimer program team and future site host
    - Would be the first engineering-breakeven proof point for Xcimer's architecture
    - No public independent cost, schedule, or EPC review
  - - Athena pilot plant
    - Converts the laser-target-chamber stack into a 400-MW grid product
    - Concept / planned mid-2030s
    - Utility, hyperscaler, or industrial plant host
    - Pairs thick-liquid wall, low repetition rate, and steam-cycle power conversion
    - No public licensing package or detailed plant design review
  - - Tucson capacitor manufacturing
    - Supplies high-voltage capacitors for Marx generators and future laser systems
    - Operating today
    - Xcimer manufacturing team
    - Shows one key pulsed-power cost item is being internalized
    - Other critical hardware remains externally supplied or undeveloped
  - - Target + chamber partner ecosystem
    - Supports capsule design, target factory design, diagnostics, and chamber development
    - Early co-development
    - General Atomics, LLE, LLNL-adjacent ecosystem, industrial suppliers
    - Lets Xcimer borrow national-lab target physics while differentiating on the laser side
    - Public target-factory throughput and chamber wear data are missing
  notes: These rows describe the product as a staged asset stack rather than a set of shipped SKUs. The commercial plant does not exist yet, so maturity refers to what has been publicly validated, built, or only planned.
