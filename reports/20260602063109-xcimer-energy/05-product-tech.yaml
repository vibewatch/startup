- id: manufacturing-fuel-cycle-and-open-risks
  title: Manufacturing, Fuel Cycle, and Open Risks
  body: The whitepaper's cost story is attractive because it moves away from diode factories, precision crystals, and huge solid-optics footprints toward gas cavities, Marx generators, capacitors, steel, aluminum, and plastics. Xcimer's Tucson capacitor line is the clearest evidence that the company is trying to own one of those bottlenecks directly. But the public risk register is still long. LLNL's own inertial-fusion commercialization agenda continues to list targets, chamber materials, diagnostics, and fuel-cycle interfaces as open work; the Annual Review likewise argues that ignition did not solve efficiency or economic scale; and the tritium market remains too thin for any DT plant to rely on outside supply for long. Xcimer acknowledges open issues around FLiBe pumps, nozzle wear, corrosion control, and salt chemistry, while public sources still do not show target-factory throughput, injector reliability, or independent plant economics. Those are not side questions. They are the evidence
    gaps that separate a technically compelling architecture from an underwritable power-plant product.
