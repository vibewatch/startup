callouts:
- calloutType: recommendation
  title: The financing is public; the price is not
  body: Xcimer clears the “real company with real backers” threshold, but it does not clear the “publicly priceable startup” threshold. That is why the chapter lands on research-more / track instead of a buy-style valuation call.
  claimRefs:
  - CV001
  - CV004
  - CV010
  - CV044
- calloutType: risk
  title: Capital intensity is the main transmission channel into dilution
  body: The biggest downside is not just that fusion is hard. It is that proof, commercial conversion, and capital formation may arrive out of order, forcing Xcimer to raise expensive equity before it has earned a stronger benchmark set.
  claimRefs:
  - CV023
  - CV024
  - CV034
  - CV036
  - CV042
- calloutType: assumption
  title: Do not over-read Hurun or Tracxn
  body: Hurun defines the unicorn threshold but does not show a fetched Xcimer line item, while Tracxn exposes a hidden valuation field without revealing the number. Both are useful as gap evidence, not as proof that Xcimer is already worth a specific amount.
