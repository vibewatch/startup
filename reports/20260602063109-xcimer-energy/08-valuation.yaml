- id: scenario-ranges-capital-intensity-and-dilution
  title: Scenario ranges must be tied to milestones, financing structure, and dilution
  body: 'Because Xcimer’s current post-money is not publicly disclosed, the only honest valuation framing is scenario-based. A bear case sits below unicorn territory and assumes the next financing arrives before integrated proof, forcing investors to fund uncertainty around laser economics, target operations, chamber durability, and commercial conversion all at once. A base case can justify a mid-hundreds-of-millions band, but only if Phoenix and Anvil produce evidence that meaningfully retires subsystem risk and if the next round follows those milestones instead of preceding them. A bull case can move toward or above $1 billion only after Xcimer begins to resemble the financing patterns of the best benchmark set: larger and better-structured capital, clearer project economics, and some combination of site host, customer, or strategic industrial validation. The biggest practical risk across all three cases is dilution. Public evidence still points to an equity-heavy path, and capital-intensive
    fusion programs rarely stop at one large private round. General Fusion’s filings show how complicated the stack can become once late-stage financing mechanics appear. For Xcimer, the decisive question is not just what the next mark is; it is whether that mark comes with enough money and enough milestone proof to avoid a refinance trap later.'
