  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-a-post-money
    missingEvidence: Exact June 2024 post-money valuation, ownership sold, and board-control terms for the Series A.
    whyItMatters: Without this, the company cannot be judged as attractive, fair, stretched, or expensive on a current-price basis.
    diligencePath: Request the signed financing documents, cap table, and board materials that summarize the round mechanics.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Current SAFEs, liquidation preferences, employee option pool size, and any side-letter economics.
    whyItMatters: These terms determine the real dilution path and how much value any future mark leaves for common or new investors.
    diligencePath: Have counsel and finance diligence the complete capitalization table and preference waterfall.
    relatedQuestionRefs:
    - QV032
  - type: missing-source
    severity: material
    topic: plant-capex-model
    missingEvidence: A current plant-level capex, opex, uptime, and financing model for Vulcan and Athena.
    whyItMatters: Scenario ranges stay wide until the bridge from subsystem proof to plant economics is explicit.
    diligencePath: Request the latest internal plant model and sensitivity deck used for board or investor discussions.
    relatedQuestionRefs:
    - QV033
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A broader set of directly comparable public private-fusion valuation disclosures, especially for inertial-fusion peers.
    whyItMatters: The comparable table is intentionally partial because the public market still exposes only a thin set of usable fusion marks.
    diligencePath: Continue refreshing private-fusion funding disclosures and late-stage financing structures in future runs.
    relatedTableRefs:
    - TV004
