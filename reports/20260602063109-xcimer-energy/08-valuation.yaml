- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public funding / valuation signal
  - Why relevant
  - Why it does not transfer cleanly to Xcimer
  - Read-through for Xcimer today
  rows:
  - - Helion
    - $425M Series F in Jan-2025; >$1B invested; ~$5.425B post-money from public coverage
    - Shows how fusion can command a premium when investors believe commercialization and customer proof are real.
    - Helion has stronger disclosed customer proof and much larger capital formation than Xcimer.
    - Upper-bound context only; not a clean current comp.
  - - CFS
    - $863M Series B2 in Aug-2025; nearly $3B then ~$6.85B total in later analyst coverage
    - Shows how leaders can keep compounding capital once demonstration and plant-build narratives deepen.
    - CFS has a far larger capital base, ARC path, and public counterparties.
    - Useful for funding-scale context, not direct price transfer.
  - - Focused Energy
    - $240M Series A in May-2026; official site ties capital to Biblis and first-grid milestones
    - Closer inertial-fusion peer with laser-based architecture and explicit site milestones.
    - Still a different geography, program setup, and disclosed site narrative than Xcimer.
    - Most relevant inertial financing comp, but still not plug-and-play.
  - - Pacific Fusion
    - '>$900M Series A committed upfront with milestone unlocks'
    - Shows how investors may structure very large rounds when capital intensity is obvious from day one.
    - Pacific already disclosed a much larger and more structured financing package than Xcimer.
    - Useful on financing structure, not on current Xcimer mark.
  - - General Fusion
    - ~$1B pro-forma SPAC headline versus $600M valuation in the F-4
    - Shows how public-market headlines can diverge from the actual economic stack once PIPEs and earnouts appear.
    - Different architecture and market path; transaction mechanics distort easy comparison.
    - Best cautionary comp for dilution and headline-value risk.
  - - Xcimer
    - Publicly confirmed $100M Series A; post-money undisclosed
    - Anchor row for what is actually known today.
    - The missing price means every peer comparison must be scenario-based.
    - Current stance stays unknown until terms or proof improve.
