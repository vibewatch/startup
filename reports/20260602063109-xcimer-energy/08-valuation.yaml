- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Technical platform
    - Xcimer is one of the more credible laser-fusion programs and has real capital behind prototype work.
    - Prototype credibility is not plant economics, and integrated repetitive-operation proof is still missing.
    - Publish Phoenix or Anvil metrics that clearly retire subsystem risk.
  - - Capital formation
    - A serious investor syndicate plus sector capital appetite mean Xcimer can plausibly raise again.
    - The next financing could still be dilutive bridge capital if it arrives before proof or without project-level structure.
    - Show a milestone-sufficient round size and a path beyond pure equity.
  - - Comparable support
    - Helion, CFS, Focused, and Pacific prove that fusion can command very large financing packages.
    - Those comps sit on stronger customer, site, or capital-structure evidence than Xcimer has disclosed.
    - Close the customer/site/proof gap so the inertial peer set transfers more cleanly.
  - - Sector timing
    - AI-era firm-power demand and sector investment give fusion optionality real value.
    - Sector enthusiasm can compress quickly because benchmark values are set by a small number of rounds and structured deals.
    - Show Xcimer-specific commercial pull, not only a sector tailwind narrative.
  notes: Rows pair the strongest valuation argument with the strongest counterweight, so the reader can see why the chapter avoids a buy-style conclusion.
