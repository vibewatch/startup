  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Why it lands here
  - Decision implication
  rows:
  - - Recommendation
    - Research-more / track
    - The company is clearly financeable and technically serious, but the public record does not reveal the current price or enough commercial proof to underwrite entry.
    - Do not anchor on a point estimate; proceed only through milestone-gated diligence.
  - - Confidence
    - Medium
    - The evidence on funding and peer context is solid, but the company-specific valuation and cap-table evidence are largely absent.
    - Treat upside and downside bands as scenario tools, not conviction pricing.
  - - Risk rating
    - High
    - Technical, commercial, and financing milestones still have to line up before plant-scale bankability exists.
    - Assume future rounds and non-trivial dilution are likely.
  - - Valuation stance
    - Unknown
    - No public source discloses Xcimer’s post-money valuation, and Hurun-style unicorn inference is unsupported.
    - Avoid labeling the current mark attractive, fair, or expensive.
  - - Entry discipline
    - Only on proof-led terms
    - A better price without proof is not enough; proof without financing sufficiency is also not enough.
    - Require milestone evidence, cap-table visibility, and financing adequacy together.
  notes: This table summarizes judgment rather than public company-level KPIs because the decisive missing variable is the undisclosed current price.
