  foundingLocation: Denver, Colorado
  headquarters: Denver, Colorado
  productSummary: >-
    Xcimer is developing a staged inertial-fusion plant architecture rather than a near-
    term commercial reactor sale, centered on a 10+ MJ KrF excimer laser driver, larger
    DT fuel capsules, nonlinear gas optics, and a HYLIFE-style liquid-salt chamber.
    Public milestones run from Phoenix prototype hardware to Anvil, a 200-kJ target
    shooter, then Vulcan and an eventual Athena pilot plant.
  customerFocus: >-
    Future hyperscalers and AI training clusters, industrial decarbonization customers,
    utilities, and desalination or infrastructure buyers seeking firm carbon-free power.
  businessModel: >-
    Long-duration infrastructure and power-project model: de-risk prototypes first, then
    sell or contract output from future fusion plants rather than sell a research tool.
  stage: Series A / pre-commercial
  fundingStatus: >-
