companyProfile:
  summary: >-
    Xcimer Energy is a Denver-based laser-fusion company founded in 2022 by Conner
    Galloway and Alexander Valys, MIT and Los Alamos collaborators pursuing inertial-
    fusion power plants built around KrF excimer lasers, larger DT capsules, and a
    HYLIFE-style liquid-salt chamber. The company is pursuing a staged roadmap from the
    Phoenix prototype to Anvil, Vulcan, and ultimately an Athena pilot plant in the
    mid-2030s. Public disclosures confirm a $100M Series A led by Hedosophia in 2024,
    backing from Breakthrough Energy Ventures and other climate-tech investors, a $9M DOE
    milestone award, and a team of more than 150 employees. Public evidence also shows no
    disclosed valuation, customer contracts, or project-finance structure, leaving the
    investment case dependent on milestone execution and future commercial proof.
  foundedDate: "2022-01-01"
  founders:
    - name: Conner Galloway
      role: Co-founder and CEO
      background: >-
        MIT-trained founder who later worked with Alexander Valys at Los Alamos National
        Laboratory before launching Xcimer.
      claimRefs: [CO003, CO005]
    - name: Alexander Valys
