summary:
  headline: >-
    Xcimer pairs a differentiated laser-fusion architecture and strong early investors with
    real technical ambition, but no public valuation, no public customer proof, and very
    high technical and capital-intensity risk keep the name in research-more territory until
    milestone and commercial evidence materially improve.
