      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Three forces make the market thesis stronger than it would have been even a few years ago: U.S. fusion
              regulation is now lighter than fission regulation, DOE and LLNL are explicitly building commercialization
              infrastructure, and AI-driven power scarcity has created buyers that may pay for reliability before fusion
              reaches commodity-price parity. But the constraint stack is still heavier than the demand story. Xcimer
              itself says inertial fusion still has to solve performance, chamber survivability, and cost. Independent
              literature is blunter: Annual Review notes that ignition occurred where expected, but at
              higher-than-expected implosion energy; LLNL's IFE pathway still describes demanding target-production and
              shot-rate requirements; SCSP says tritium and lithium-6 are strategic bottlenecks; and Kleinman argues
              first plants may exceed $0.15 per kWh versus much cheaper solar and gas alternatives. Trust also matters.
              Kleinman warns that aggressive startup messaging can damage public confidence when timelines slip, and
              current peer validation is still capital raises, milestones, PPAs, and site deals rather than delivered
              commercial electricity. For Xcimer specifically, the unresolved gaps are practical: no public customer
              pipeline, no quantified SAM by vertical, no independently validated plant economics, and no public
              target-manufacturing or fuel-cycle plan. Those omissions do not negate the market opportunity, but they
              keep the underwriting case firmly in 'promising, evidence-constrained option value' territory.
