      - number: '1.4'
        title: Technology Roadmap and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              Xcimer's public milestone sequence is more detailed than that of many early-stage fusion peers. The
              company says Phoenix, its first key prototype system, derisks gas optics and pulse compression and was
              nearly complete by March 2026. December 2025 and March 2026 updates also introduced the next-stage
              roadmap: Anvil, a two-sided 200 kJ target-shooter using full-scale laser hardware; Vulcan, a 12 MJ-class
              facility targeted for construction completion by 2030 and engineering breakeven in 2031; and then a fusion
              pilot plant path beyond Vulcan. This staged architecture matters because it converts a single distant
              commercialization claim into intermediate engineering checkpoints that later chapters can test.

              The experimental record remains early but not empty. In March 2026, Xcimer reported OMEGA shots at the
              University of Rochester's Laboratory for Laser Energetics that benchmarked its two-beam halfraum modeling
              and involved collaborators including General Atomics, Los Alamos National Laboratory, and the Universidad
              Politécnica de Madrid. The company has also tied its private work to U.S. public programs: a $9 million
              DOE milestone award in 2023, participation in all three IFE-STAR hubs, and repeated rhetorical linkage to
              NIF's December 2022 ignition and subsequent higher-yield shots. The roadmap is therefore anchored to real
              experiments and public-private partnerships, but not yet to disclosed plant economics, customer contracts,
              or demonstrated engineering breakeven.
