  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Core technical and economic risk — turning ICF proof into a repeatable plant
        blocks:
          - type: paragraph
            body: >-
              Xcimer’s risk stack starts with a narrow but brutal engineering proposition: take the one fusion pathway
              with the strongest scientific proof and then compress it into a two-beam, thick-liquid-wall,
              low-repetition-rate commercial plant before better-capitalized peers or cheaper alternatives capture the
              market. The mitigating evidence is real. Phoenix is meant to retire key gas-optics and pulse-compression
              risks, OMEGA added outside target-physics data, and the whitepaper lays out a coherent logic for fewer
              chamber penetrations, in-house pulsed-power hardware, and lower nominal laser cost. But the residual
              exposure is still the dominant underwriting issue. OMEGA did not reproduce Xcimer’s final beam geometry;
              no public source shows integrated two-beam target performance, plant-grade uptime, or wall-plug breakeven;
              and LLNL plus Annual Review both make clear that ignition does not solve driver efficiency, target
              throughput, materials, or fuel-cycle closure. Xcimer’s own documents are helpful here because they openly
              admit the same thing in different language: the project still lives or dies on whether laser cost, target
              robustness, chamber survivability, and repetitive operations can move from plausible theory into measured
              system performance. That makes this a high-severity, medium-to-high-likelihood risk for the 2026 to 2031
              window, with Phoenix and Anvil acting as the first true leading indicators.
