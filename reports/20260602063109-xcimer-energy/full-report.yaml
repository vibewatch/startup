      - number: '1.3'
        title: Funding, Investor Base, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Xcimer's first major financing event was the $100 million Series A announced on June 4, 2024. The round
              was led by Hedosophia and included Breakthrough Energy Ventures, Lowercarbon Capital, Prelude Ventures,
              Emerson Collective, Gigascale Capital, and Starlight Ventures. Management positioned the round as
              sufficient to build a prototype laser system in Denver and advance milestones toward commercialization.
              Independent coverage consistently repeated the same syndicate and dollar amount, which makes the raise
              itself highly corroborated. What remains missing is the price: none of the round announcements fetched in
              this run disclosed a post-money valuation, ownership sold, preference stack, or board-control terms.

              The financing coincided with geographic consolidation and scale-up. The company said it had recently moved
              the majority of employees to Denver, and later disclosures described Xcimer as employing more than 150
              people, mostly in its Denver headquarters, with manufacturing operations in Tucson, Arizona. Careers
              materials showed 37 open roles across five departments at fetch time and stated the company planned to
              double team size over the next year. This level of hiring is meaningful evidence that the Series A capital
              is being converted into engineering capacity, but Xcimer still does not publish audited financials, burn,
              runway, or a precise headcount trend.
