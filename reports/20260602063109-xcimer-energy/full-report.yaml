              The closest public valuation context for Xcimer comes from peers, but every peer benchmark needs a
              transferability haircut. Helion’s public coverage points to a multi-billion valuation, yet that benchmark
              sits on a stronger disclosed commercialization stack: a massive financing history, official customer
              narratives, and industrial participation. Even then, MIT’s critique shows Helion’s timeline still faces
