chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy is a private laser-fusion company headquartered in Denver, Colorado and founded in 2022 by
              Conner Galloway and Alexander Valys. The company's current public positioning is unusually specific for an
              early-stage fusion startup: it says laser-driven inertial confinement fusion (ICF) is the only
              scientifically validated route to fusion gain, and that Xcimer's role is to industrialize that physics
              rather than discover a new confinement concept. Official materials repeatedly frame the product not as a
              research tool but as a power-plant platform intended to supply firm, carbon-free electricity to
              energy-hungry end markets such as AI training clusters, desalination, and industrial decarbonization.

              The business model remains pre-revenue and infrastructure-heavy. Xcimer is building large, efficient
              krypton-fluoride excimer lasers, pulse-compression hardware, target systems, and protected chamber designs
              that it believes can turn NIF-style ignition physics into a repeatable energy system. The public roadmap
              implies a plant-development model rather than a software-like licensing model: first derisk the laser and
              target architecture with Phoenix and Anvil, then demonstrate engineering breakeven with Vulcan, then
              progress to a fusion pilot plant and commercial deployment in the mid-2030s. While the company discusses
              downstream customer categories in detail, it has not announced commercial customers, a utility partner, a
              power purchase agreement, or public revenue.
