              Rather than promising a distant pilot plant with few intermediate checkpoints, Xcimer publicly names
              Phoenix, Anvil, and Vulcan as separate stages and ties OMEGA experiments to specific model-validation
              goals. That does not prove the roadmap will succeed, but it gives diligence a cleaner sequence of
              engineering tests than the category average.
            calloutType: strength
