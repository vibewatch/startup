  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to valuation
      - Action implication
    rows:
      - - Proof slips before financing
        - Next round arrives before clearer Phoenix or Anvil evidence
        - Investors fund unresolved science, engineering, and commercialization at once.
        - Move to downside framing; require deeper price protection or pause.
      - - No customer or site proof
        - Still no named counterparty, site host, or permitting path as financing size grows
        - Peer benchmarks remain non-transferable and bull-case odds fall.
        - Keep stance at unknown / high risk.
      - - Round is too small or too bridge-like
        - Capital does not clearly fund the next proof gate
        - Runway risk rises and down-round probability increases.
        - Assume future refinance pressure.
      - - Cap-table surprise
        - Preferred overhang, SAFEs, or option-pool expansion materially exceed expectation
        - Equity value available to new and existing holders compresses.
        - Re-price risk immediately once terms are visible.
      - - Sector benchmark stress
        - Leader rounds, SPACs, or follow-ons weaken materially across fusion
        - Optionality multiples compress even for executing teams.
        - Use stricter scenario weights and slower deployment assumptions.
    notes: >-
      These triggers are monitorable and intentionally tied to financing adequacy, proof timing, and transferability
      rather than to generic sector optimism.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Series A terms
        - Exact post-money valuation, ownership sold, liquidation preference, and board-control terms
        - Without this, there is no way to know current price discipline or preference stack.
        - Request the round deck, financing documents, and updated cap table from management.
      - - Current cap table
        - SAFE conversions, option-pool size, employee equity reserve, and any side-letter economics
        - These terms determine how much headline valuation reaches common equity.
        - Have counsel and finance diligence the full cap table and waterfall.
      - - Milestone budget
        - Budget by proof gate from Phoenix to Anvil to Vulcan and Athena
        - This determines whether the next round is sufficient or just a bridge.
        - Request internal milestone budgets and contingency cases.
      - - Commercial proof
        - Named customer, site host, or structured strategic partner pipeline
        - These milestones are what make peer comps transfer more credibly.
        - Request NDAs, pipeline snapshots, and evidence of serious counterparties.
      - - Plant economics
        - Internal capex, opex, target cost, shot cadence, uptime, and financing assumptions
        - This is the core bridge from credible science to bankable value.
        - Request the latest plant model and financing assumptions by scenario.
    notes: These asks are ordered by how much they reduce valuation uncertainty rather than by how easy they are to obtain.
    claimRefs:
      - CV004
      - CV006
      - CV033
      - CV037
      - CV039
      - CV040
      - CV043
