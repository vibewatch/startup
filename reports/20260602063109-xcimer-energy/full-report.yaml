  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Plant Concept
        blocks:
          - type: paragraph
            body: >-
              Xcimer is not yet selling a reactor block, turbine package, or power-purchase agreement; its current
              product is a staged engineering program intended to end in a laser-fusion plant for large buyers that need
              firm carbon-free energy. In customer-workflow terms, the company is targeting facilities such as AI
              campuses, desalination systems, and industrial sites that today stitch together grid power, gas, storage,
              and backup. The commercial promise is that a future Xcimer plant would replace that multi-asset stack with
              one on-site or grid-connected source of continuous power built around repeated fusion shots and a
              conventional steam cycle. What distinguishes the product concept is that Xcimer treats the laser, target,
              chamber, and salt loop as one tightly coupled plant architecture: if any one of those subsystems fails to
              scale, there is no product. That framing matters because the business value proposition depends as much on
              maintenance cadence, target cost, and chamber survivability as on plasma gain.
