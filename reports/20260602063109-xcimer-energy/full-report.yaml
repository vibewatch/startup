      - number: '5.2'
        title: Driver, Target, and Chamber Architecture
        blocks:
          - type: paragraph
            body: >-
              The engineering thesis is unusually specific. Xcimer wants to generate microsecond-scale 248-nm KrF pulses
              in large excimer amplifiers, concentrate them through Raman beam combining, compress them through two
              stimulated Brillouin scattering gas mirrors, and then deliver nanosecond pulses through a windowless
              gas-to-vacuum transition onto a two-sided hybrid direct-drive target. The reason for all of this
              complexity is not elegance; it is plant compatibility. NIF shows that indirect-drive ICF can ignite, but
              its 192-beam solid-state architecture carries high optical area, window damage, and chamber-penetration
              burdens. Xcimer is trying to trade those burdens for a far tighter optical-control problem: two beams mean
              fewer final penetrations and a realistic path to a thick liquid wall, but they also require convincing
              proof that beam shaping, phase preservation, adaptive optics, and target manufacture can keep implosions
              symmetric enough at much higher energies. In short, the architecture shifts difficulty from beam count to
              beam quality and systems integration.
