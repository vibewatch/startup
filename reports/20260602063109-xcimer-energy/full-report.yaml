      - number: '5.4'
        title: Alternative Architectures and Why Xcimer Differs
        blocks:
          - type: paragraph
            body: >-
              Xcimer is not simply another fusion startup with a different marketing deck; it is making a very
              particular architectural wager. Focused Energy stays closer to direct-drive laser fusion and industrial
              siting, Pacific Fusion moves toward modular pulsers, Helion pursues iterative pulsed machines and a future
              deuterium-helium-3 path, CFS concentrates manufacturing effort in high-temperature superconducting tokamak
              hardware, and General Fusion uses a liquid-metal wall but ties commercialization to LM26 milestone closure
              rather than a laser driver. TAE sits outside the inertial-fusion camp altogether. Xcimer's real
              differentiation is therefore not that it alone believes in fusion, or even that it alone believes in
              inertial fusion; it is that it is trying to combine the most experimentally validated plasma path with a
              beamline and chamber design explicitly optimized for lower beam count, lower final-optics exposure, lower
              repetition rate, and thick-liquid-wall compatibility. That could be powerful if it works, but it also
              concentrates risk in a narrow set of unproven integrations.
