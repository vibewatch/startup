        - High dilution risk; later rounds can reset terms or force structured rescue financing.
        - Do not stretch for access; wait for proof or materially better price protection.
      - - Base
        - $500-$900
        - >-
          Key subsystem proof improves, the next round follows that proof, and Xcimer begins to show commercial dialogue
          without full bankability.
        - Most supportable range from the public record today.
        - Dilution remains likely, but the round can still create option value if it is milestone-sufficient.
        - Track closely; underwrite only with term visibility and explicit milestone mapping.
      - - Bull
        - $900-$1,800
        - >-
          Integrated proof, customer or site validation, and a large structured follow-on round start to make
          Helion/Pacific-style confidence more relevant.
        - Requires evidence not yet public as of 2026-06-02.
        - Dilution can still happen, but the capital may arrive on stronger terms if milestones land first.
        - Only becomes actionable after proof, not before.
    notes: >-
      These are scenario bands for valuation framing, not a disclosed current post-money estimate. They are anchored to
      milestone sets and financing quality, not to a false-precision point value.
