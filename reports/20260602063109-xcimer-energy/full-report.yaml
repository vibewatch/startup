      - number: '2.2'
        title: 'Sizing Lenses: Broad TAM, Demand Pull, and the Missing Xcimer SOM'
        blocks:
          - type: paragraph
            body: >-
              The chapter can support only evidence-constrained sizing, not a neat Xcimer TAM-SAM-SOM stack. Published
              fusion forecasts are wide because they measure different things. MarketsandMarkets sizes a broad
              nuclear-fusion market at $18.0 billion in 2026 and $33.77 billion in 2031, while Future Markets describes
              a sector that could reach $40-80 billion by 2036 and exceed $350 billion by 2050 if technical milestones
              land. FIA's 2025 survey adds a different lens altogether: the industry had raised $9.766 billion to date
              but said it still needed more than $77 billion to get all surveyed companies to commercialization. Those
              are useful signals, but they are not Xcimer-specific revenue forecasts. The cleaner demand-side lens comes
              from the buyer problem Xcimer names. S&P Global and MarketsandMarkets cite rapid data-center electricity
              growth, with S&P pointing to a 14% global CAGR to 2029 and MarketsandMarkets citing IEA estimates that
              data-center demand could rise from nearly 415 TWh in 2024 to about 945 TWh by 2030. That supports a large
              premium-firm-power opportunity. What it does not support is a quantified Xcimer SAM or SOM. Publicly,
              Xcimer has not disclosed contracted megawatts, PPA value, or customer-backed project economics, so its
              current SOM is best treated as zero disclosed MW rather than assumed pipeline value.
