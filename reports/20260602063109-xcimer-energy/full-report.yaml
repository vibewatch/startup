      - number: '3.4'
        title: Switching Costs, Multi-Homing, Distribution Power, and Supply Access
        blocks:
          - type: paragraph
            body: >-
              Multi-homing is theoretically possible at the buyer-education stage and much harder later. A hyperscaler,
              utility, or industrial buyer can talk to multiple fusion developers in parallel today because no startup
              has shipped commercial power. But once a buyer commits real siting work, interconnection queues,
              public-affairs capital, permitting time, and project finance to one pathway, switching costs rise quickly.
              The lock-in is not a software API problem; it is a project-development problem. That favors companies that
              reach named counterparties and bankable site plans first, even if their physics are not the closest
              analogue to Xcimer's.


              Distribution power therefore sits mostly outside the startups themselves. Anchor customers, utilities,
              regulators, and incumbent procurement channels decide which concepts become real projects. Helion benefits
              from Microsoft and Nucor announcing intent in public. CFS benefits from Google-linked offtake and
              Dominion-style siting context. Pacific benefits from Sandia adjacency and a large committed financing
              structure. By contrast, Xcimer has not publicly shown exclusive suppliers, locked-in customers, or channel
              partners that would constrain buyer choice. Supply access is also not winner-take-all yet: tritium,
              lithium-6, laser-diode, and superconducting-material bottlenecks can hurt several pathways at once, while
              suppliers can still multi-home across the startup field. That makes commercial lead time and partner
              capture more important than pure novelty.
            claimRefs:
              - CP031
              - CP032
              - CP041
              - CP043
              - CP044
              - CP045
      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward: Xcimer may be right on architecture and still lose commercially.
              Public evidence does not yet show a protected customer position, a protected supply position, or
              independently verified plant economics. Helion and CFS already demonstrate that buyers and investors can
              commit to very different fusion pathways if those pathways appear nearer to execution. Focused and Pacific
              show that inertial fusion itself is not Xcimer's private category. If those peers reach credible plant
              milestones or industrial sites first, Xcimer's differentiation could compress from “category-defining” to
              “one of several inertial options.”


              The harder adverse evidence is sector-wide. Annual Review notes that inertial-fusion ignition required
              more implosion energy than once projected and still faces major research challenges. Kleinman argues that
              early fusion plants may clear the grid at prices materially above gas or solar, while also warning that
              overly optimistic startup timelines can damage public trust. SCSP adds a supply-chain layer: tritium,
              lithium-6, laser diodes, and HTS bottlenecks can all become commercial chokepoints. Those risks do not
              disprove Xcimer, but they sharply limit current moat durability. Today Xcimer owns a credible technical
              story and an evidence-backed set of differentiators; it does not yet own the commercial battlefield around
              customer proof, economics, or lock-in.
