  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation evidence is real on funding and missing on price
        blocks:
          - type: paragraph
            body: >-
              Xcimer is unusually easy to prove as a real financing event and unusually hard to price. The public record
              confirms a $100 million Series A in June 2024 and identifies a serious syndicate, but it stops short of
              the numbers an investor would need to underwrite entry price: no disclosed post-money valuation, no
              ownership sold, no liquidation preferences, no option-pool math, and no customer or revenue base that
              would let an outsider triangulate value through conventional multiples. The weak public metadata matters
              as much as the strong financing headline. Crunchbase and Tracxn both reinforce that a round happened, yet
              neither yields a usable post-money figure in the fetched corpus; Tracxn even exposes a valuation field
              while withholding the value. Hurun helps only as a caution: its unicorn definition is clear, but nothing
              fetched here ties Xcimer to a company-specific unicorn line item. That means the chapter should not
              pretend to know today’s mark. The practical conclusion is entry discipline, not false precision: treat the
              current valuation as undisclosed, assume public evidence is insufficient for a buy-style price call, and
              judge Xcimer through milestone-based scenarios instead.
