      - number: '1.5'
        title: Critical Perspectives and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is not scandal or litigation; it is physics, engineering, and
              commercialization discipline. Xcimer's own white paper admits that NIF-style ignition is insufficient for
              a commercial plant without much better laser efficiency, higher gain, lower cost per joule, and a chamber
              that survives sustained fusion conditions. The 2025 Annual Review article on inertial confinement fusion
              likewise states that ignition occurred where expected, but the energy required to reach those conditions
              was higher than earlier projections and major research challenges remain. LLNL's 2024 discussion of the
              path to inertial fusion energy makes the same point in less skeptical language: ignition is a scientific
              milestone, not a finished power-plant design.

              That framing matters for underwriting. Xcimer has credible founders, a strong investor list, and a more
              explicit staged roadmap than many fusion startups, but it has not publicly disclosed the valuation behind
              its Series A, the exact composition of its board, the economics of Phoenix or Vulcan, or any commercial
              counterparties. The public Hurun summary pages fetched in this run confirm the list's unicorn criteria,
              yet did not surface Xcimer's company-specific row, so the exact basis for any $1 billion-plus valuation
              claim remains unverified in the open record. The right current read is therefore promising but still
              evidence-constrained: Xcimer has established identity, capital, and a technical plan, while leaving price,
              governance, and customer proof as material diligence gaps.
            claimRefs:
              - CO020
              - CO021
              - CO025
              - CO034
              - CO035
              - CO036
              - CO039
