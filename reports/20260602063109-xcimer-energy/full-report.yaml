              even less transferable as a direct comp because its capital base, construction path, investor roster, and
              Google-linked commercialization story sit well ahead of Xcimer’s current public disclosures. Focused
              Energy and Pacific Fusion are more relevant inertial-fusion reference points because they show what
              capital appetite can look like for laser-based peers, but both also come with more explicit site or
              financing structure signals than Xcimer has shown publicly. General Fusion’s SPAC path is the best warning
              comp: headline value and actual economic value can diverge sharply once PIPEs, earnouts, warrants, and
              redemptions enter the picture. So the peer set is useful only as context. It says fusion leaders can
              attract very large capital and, at the high end, very large marks — but only after the market sees
