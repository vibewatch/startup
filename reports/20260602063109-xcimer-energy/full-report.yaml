      - number: '1.2'
        title: Founders, Leadership, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Xcimer's origin story is one of the clearest pieces of the public record. Conner Galloway and Alexander
              Valys met as first-year roommates at MIT, studied physics and engineering, and later worked together at
              Los Alamos National Laboratory before founding Xcimer in 2022. Official company materials and the 2026
              white paper identify Galloway as co-founder and CEO and Valys as co-founder and CTO. Galloway is also
              described in 2024 funding materials as chief science officer, underscoring the degree to which technical
              authority and executive authority are concentrated in the same individual at this stage.

              The company has begun to build a deeper leadership bench, but the public record still shows strong founder
              concentration. In June 2024, Xcimer announced the hire of Giovanni Greco, a senior vice president of
              engineering with prior aerospace systems experience at Blue Origin and Astra. The 2026 news archive also
              records a burst of senior hiring around the Vulcan buildout, including a chief engineer for Vulcan, a
              senior vice president for Vulcan, a vice president of defense, and a senior vice president of strategic
              communications. Those additions suggest the company is moving from pure science startup to
              program-management mode, yet no complete board roster, independent directors, or formal succession
              structure are publicly disclosed. That leaves material key-person dependence around Galloway, Valys, and
              the emerging Vulcan execution team.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
              - CO031
              - CO032
