      - number: '3.2'
        title: 'Competitor Profiles: Scale, Funding, Customer Focus, and Strategic Direction'
        blocks:
          - type: paragraph
            body: >-
              The profile split is stark. Xcimer has a credible but still early public commercial profile: a $100
              million Series A, more than 150 employees, and a roadmap built around excimer-laser scale-up and a
              mid-2030s deployment thesis. Focused Energy and Pacific Fusion are the most direct threats to that
              narrative because both have made inertial-fusion commercialization legible to investors and governments in
              their own way. Focused now presents itself as the laser-fusion company built by ignition veterans, with a
              $240 million Series A, 160-plus employees, and a Biblis industrial-site strategy. Pacific has gone further
              on disclosed capital scale, claiming more than $900 million of committed Series A funding, over 110
              employees, and a New Mexico campus designed around a 2030 net-facility-gain target.


              Among alternate approaches, Helion stands out for the strongest public customer proof and high valuation,
              CFS for sheer capital depth and utility-style plant planning, TAE for a long operating history plus
              adjacent monetization paths, and General Fusion for the most explicit public-market financing path. The
              common pattern is that every major rival is trying to become more than a physics program: each is
              packaging an execution story around siting, customer access, industrial partners, or financing structure.
              That means Xcimer is not compared only on laser merits. It is compared on whether its commercialization
              story looks as financeable and as customer-ready as the stories already being sold by better-funded or
              more visibly partnered peers.
