            body: >-
              Xcimer's $100 million Series A was led by Hedosophia and included a notably strong climate-tech and
              mission-driven syndicate. For a company founded in 2022 and still pre-commercial, that investor quality is
              meaningful third-party validation that the team and technical story passed a sophisticated diligence
