  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Xcimer's market boundary is easiest to misstate by treating it as today's fusion research market. The
              company is pre-commercial, does not publicly sell power, and does not disclose customer contracts. Its own
              materials instead describe a future product: firm, abundant, carbon-free power for AI training clusters,
              desalination, and industrial decarbonization. That makes the relevant market future generation assets and
              long-term offtake budgets for hard-to-abate, high-load customers, not every dollar spent on fusion
              science, weapons stewardship, or clean-tech venture funding. LLNL's ignition milestone and follow-on
              inertial-fusion work matter because they move laser ICF from pure physics toward an engineering and
              commercialization question, but LLNL, DOE, and CRS all still describe major gaps in drivers, targets,
              blankets, materials, and plant integration before a commercial plant exists. Included spend in this
              chapter therefore covers FOAK fusion plant capex, long-term PPAs or behind-the-meter power commitments,
              and system integration for high-duty-cycle electricity or heat. Excluded spend includes NIF and stockpile
              R&D, medical-isotope businesses, and generic renewables procurement that does not require fusion's
              promised combination of 24-7 output, compact footprint, and energy density. The status-quo substitutes
              remain gas, gas plus carbon controls, conventional nuclear and SMRs, geothermal, and renewables paired
              with storage, transmission, or demand response.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
