  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Alternate Fusion Races, and Non-Fusion Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Xcimer does not compete only against “fusion” as a monolith. Its closest direct peers are Focused Energy
              and Pacific Fusion, because all three are explicitly commercializing inertial-fusion pathways and publicly
              talk about mid-2030s grid outcomes rather than open-ended science programs. Helion, Commonwealth Fusion
              Systems (CFS), TAE Technologies, and General Fusion are still material competitors even though their
              physics differ, because buyers ultimately purchase the same outcome: reliable carbon-free power for
              hyperscalers, utilities, industrial sites, and other high-load customers. Helion and CFS matter most on
              near-term go-to-market pressure because they already disclose counterparties or offtake structures that
              Xcimer has not yet matched in public.


              The competitive set is broader still. Gas plants, renewables paired with storage, geothermal, grid
              upgrades, demand-response programs, and advanced-fission or SMR projects all solve the same procurement
              problem sooner than a mid-2030s fusion plant. Internal build is therefore a real “competitor”: many buyers
              can assemble a portfolio of interconnection, flexible load management, PPAs, and dispatchable backup
              before any fusion startup reaches commercial operation. In practice, Xcimer is competing for future budget
              share, interconnection priority, and buyer attention against both direct inertial rivals and procurement
