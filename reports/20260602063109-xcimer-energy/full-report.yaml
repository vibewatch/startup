      - number: '7.2'
        title: Regulatory, fuel-cycle, supply-chain, and financing bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster is less glamorous than laser physics but just as decisive: tritium, licensing,
              supply chains, and money. The legal backdrop is directionally helpful. The ADVANCE Act and the NRC’s
              fusion rulemaking give fusion a lighter-touch framework than fission, which should reduce some schedule
              drag. But that is not the same as a de-risked plant. CRS still points to Agreement State complexity,
              radioactive-material licensing, and unresolved questions about how site-specific projects will be handled
              in practice. The fuel cycle is even more constraining for Xcimer because its commercial story still runs
              through DT fuel. Independent sources consistently warn that tritium remains scarce, expensive, tightly
              governed, and dependent on breeding systems that are not yet proven at commercial scale. Xcimer’s
              thick-liquid-wall concept may help on breeding ratio and first-wall wear, but the company’s own timeline
              still assumes industrial-scale salt-system components that are not yet public. Financing then compounds
              the technical risk. Xcimer’s $100 million raise was credible for Phoenix, not for a plant. Better-funded
              peers are already raising hundreds of millions to billions, while DOE’s strategy and budget language still
              frame public support as milestone leverage rather than plant-finance replacement. The mitigation
              evidence—Tucson capacitor manufacturing, DOE support, and a friendlier federal posture—is real, but the
              residual exposure remains high because capital, isotopes, and site-ready permitting all have to show up
              before revenue does.
