evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A complete current board roster, committee structure, and any independent directors or observer rights.
    whyItMatters: Governance concentration and investor control cannot be assessed from the public record without the board map.
    diligencePath: Request the current board list, board observer rights, and governance documents in management diligence.
    relatedQuestionRefs:
      - QO005
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Post-money valuation, ownership sold, liquidation preferences, and any secondary liquidity attached to the 2024
      Series A.
    whyItMatters: Price discipline and downside protection cannot be evaluated without the financing economics.
    diligencePath: Obtain the Series A term sheet, cap table, and board consent package from the company or lead investor.
    relatedQuestionRefs:
      - QO007
      - QO022
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: unicorn-proof
    missingEvidence: A directly fetched company-specific Hurun row or equivalent primary source tying Xcimer to a $1B-plus valuation.
    whyItMatters: >-
      The report can describe strong investor validation, but not assert an exact unicorn valuation with high confidence
      from the fetched public evidence alone.
    diligencePath: Acquire the full Hurun dataset or a cap-table/term-sheet source that explicitly states the implied valuation.
    relatedQuestionRefs:
      - QO007
      - QO023
  - type: private-evidence-only
    severity: material
    topic: commercial-readiness
    missingEvidence: >-
      Signed customer commitments, utility relationships, power purchase agreements, or project-level plant economics
      for Phoenix, Anvil, or Vulcan.
    whyItMatters: >-
      Without counterparties or plant economics, the market-facing side of the business remains prospective rather than
      proven.
    diligencePath: Request customer pipeline documents, any NDA-protected counterparties, and internal LCOE / capex models.
    relatedQuestionRefs:
      - QO016
      - QO020
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: headcount-precision
    missingEvidence: A precise current employee count instead of the published floor of more than 150 plus live job postings.
    whyItMatters: >-
      Organizational scale is directionally clear, but precision matters for assessing burn, execution bandwidth, and
      hiring velocity.
    diligencePath: Request an org chart or HR headcount snapshot dated to the diligence cut-off.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: xcimer-economics
    missingEvidence: >-
      Independent capex, LCOE, and maintenance model for a Xcimer plant, plus third-party validation of the claimed
      excimer cost advantage.
    whyItMatters: Without externally tested economics, the market case rests mainly on company-authored engineering assumptions.
    diligencePath: >-
      Request Xcimer's plant model, third-party technical diligence memos, and milestone-gated sensitivity analysis
      versus gas, nuclear, and renewable-plus-storage alternatives.
    relatedQuestionRefs:
      - QM016
  - type: missing-source
    severity: material
    topic: xcimer-sam
    missingEvidence: >-
      A public or diligence-only SAM that isolates AI campuses, desalination, and industrial decarbonization geographies
      where Xcimer is actively selling.
    whyItMatters: Broad fusion TAMs do not show whether Xcimer has a winnable near-term market segment.
    diligencePath: >-
      Ask management for prioritized verticals, target geographies, expected project sizes, and buyer pipeline by
      segment.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: target-manufacturing
    missingEvidence: >-
      Xcimer-specific target-production throughput, shot cadence, chamber maintenance interval, and replacement-cost
      assumptions.
    whyItMatters: ICF market adoption depends on repeatability and consumables economics as much as on ignition physics.
    diligencePath: >-
      Request target-factory design assumptions, consumables bill of materials, target cost curves, and maintenance
      cadence for Phoenix, Anvil, and Vulcan follow-ons.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named customer discussions, PPA drafts, site-selection criteria, or non-binding MOUs showing real Xcimer
      commercial traction.
    whyItMatters: Peers have already published at least some customer or siting proof; Xcimer has not.
    diligencePath: >-
      Ask for pipeline stage by customer, counterparties under NDA, site shortlist, and what milestone must be met
      before contracting.
    relatedQuestionRefs:
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: fuel-cycle
    missingEvidence: >-
      A public Xcimer tritium startup and breeding strategy, including dependence on outside suppliers and enriched
      lithium assumptions.
    whyItMatters: >-
      Fuel autonomy is a gating issue for any D-T-adjacent or tritium-dependent plant architecture and influences
      deployment timing and cost.
    diligencePath: >-
      Request Xcimer's fuel-cycle architecture, startup inventory assumptions, breeding pathway, and supplier map for
      tritium and lithium-bearing materials.
    relatedQuestionRefs:
      - QM017
      - QM025
    relatedTableRefs:
      - TM004
