  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值证据证明融资真实，却缺少价格
        blocks:
          - type: paragraph
            body: >-
              Xcimer 有一个反常组合：融资事件很容易证明真实，价格却很难判断。公开记录确认公司在 2024 年 6 月完成 $100 million Series A
              轮，并列出一支严肃的联合投资方，但停在投资人承销入场价格所需的数字之前：没有披露投后估值、出让股权、清算优先权、期权池计算，也没有客户或收入基础，让外部人无法用常规倍数三角定位价值。薄弱的公开元数据和亮眼的融资标题同样重要。Crunchbase
              和 Tracxn 都强化了“融资发生过”这一点，但在抓取材料中都不给出可用投后数字；Tracxn 甚至露出一个估值字段，却隐藏数值。Hurun 只能作为提醒：它的独角兽定义清楚，但这里抓取到的材料没有把
              Xcimer 绑定到公司特定的独角兽条目。因此，本章不应假装知道今天的估值标记。务实结论是入场纪律，而不是虚假精确：把当前估值视为未披露，假设公开证据不足以支持买入式价格判断，并用里程碑情景来评估 Xcimer。
