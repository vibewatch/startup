  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 集成激光-靶风险
        - Phoenix 及后续 Anvil 的验收指标
        - Anvil 获得资金时，仍没有公开证据表明集成光束质量、脉冲压缩或靶耦合已经收敛
        - 将 2030 至 2031 年 Vulcan 时间表视为失效，并预期进一步稀释。
      - - 燃料循环与腔室风险
        - 靶工厂、熔盐回路和氚计划披露
        - 最终选址决定前，仍没有可信的靶产能、维护节奏或增殖假设
        - 将 Xcimer 按研究项目承销，而不是按可融资电站开发商承销。
      - - 融资风险
        - 融资轮次时点与里程碑收敛的对比
        - 大额后续融资早于 Phoenix 收敛、选址或客户证明到来
        - 假设谈判筹码偏弱，稀释风险正在上升。
      - - 商业风险
        - 具名场地主 / 客户 / 购电公告
        - 下一次重大融资事件之后，仍没有具名场地主、公用事业、工业用户或超大规模云厂商交易对手
        - 折价处理所有需求侧上行，只关注技术可选性。
      - - 监管与选址风险
        - 项目特定许可里程碑
        - Vulcan 建设窗口临近时，州选择仍未敲定，或许可路径仍未定义
        - 即便技术里程碑看起来健康，也要预期进度延误。
    notes: 这些触发项用于在 2026 年至首个重大电站融资事件之间观察；它们把宽泛风险类别转成具体的停走信号。
