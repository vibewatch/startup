  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Xcimer 的相关性
    rows:
      - - 超大规模云厂商和 AI 园区稳定电力
        - 长期 PPA、表后发电、容量预留、并网就绪的电站开发
        - 一般托管租金、软件支出，以及没有稳定电力需求的通用可再生能源抵消
        - 超大规模云厂商、数据中心开发商、基础设施和能源采购团队
        - 直接匹配 Xcimer 的 AI 训练集群用例，以及最强的高溢价稳定电力需求信号
      - - 工业脱碳和工艺用电
        - 现场电力模块、长期电力供应、热电联供、替代化石燃料基荷
        - 能效软件、碳核算工具或低占空比备用电力
        - 工厂运营、能源采购、可持续发展负责人、项目融资发起方
        - 匹配 Xcimer 的工业脱碳用例和同行的重工业客户叙事
      - - 海水淡化和水基础设施
        - 电力与水项目共址、主权或市政基础设施融资、稳定高负荷电力供应
        - 没有新增发电采购的常规水务 O&M
        - 水务公用事业公司、主权基础设施载体、市政发起方
        - 匹配 Xcimer 的海水淡化用例，并偏向紧凑、全天候发电
      - - 电网级聚变电站部署
        - FOAK 电站资本开支、公用事业或 IPP 开发预算、受监管容量采购、电网集成支出
        - 与商业电站建设脱节的纯研究补助
        - 公用事业公司、IPP、电网规划方、公私合营联盟
        - 第一座 Xcimer 电站可融资之后，可能成为长期扩张路径
      - - 邻近项：支撑聚变落地的供应链和公共研发
        - 靶丸、光学件、脉冲功率、燃料循环和实验室合作支出，能解锁部署
        - 只有 Xcimer 直接通过部件或服务变现时，才计入 Xcimer TAM
