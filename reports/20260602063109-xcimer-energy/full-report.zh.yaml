  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 技术平台
        - Xcimer 是可信度较高的激光聚变项目之一，原型工作背后也有真实资本支持。
        - 原型可信度不等于电站经济性，集成式重复运行证明仍然缺失。
        - 发布能清楚消除子系统风险的 Phoenix 或 Anvil 指标。
      - - 资本形成
        - 严肃投资者财团叠加行业资本兴趣，意味着 Xcimer 有理由再次融资。
        - 如果下一轮融资早于证明到来，或缺乏项目级结构，它仍可能只是稀释性的过桥资本。
        - 展示足以覆盖里程碑的融资规模，以及走出纯股权融资的路径。
      - - 可比公司支撑
        - Helion、CFS、Focused 和 Pacific 证明，聚变可以拿到非常大的融资包。
        - 这些可比公司的客户、场址或资本结构证据强于 Xcimer 已披露内容。
        - 补上客户 / 场址 / 证明缺口，让惯性聚变同业集更顺畅地适用。
      - - 行业时点
        - AI 时代稳定电力需求和行业投资，让聚变可选性具备真实价值。
        - 行业热度也可能快速压缩，因为基准价值由少数轮次和结构化交易设定。
        - 展示 Xcimer 专属商业拉力，而不只是行业顺风叙事。
    notes: 每行把最强估值论据与最强反向因素配对，因此读者能看到本章为何避免给出买入式结论。
    claimRefs:
