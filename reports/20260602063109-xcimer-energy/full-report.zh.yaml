  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议路径从强技术和融资信号出发；一旦检验商业验证、股权结构表可见度和融资充足性，定价信号就变弱。
    data:
      nodes:
        - id: market
          label: 聚变上行空间大
          detail: 稳定电力需求和行业资本让聚变期权有价值。
          tone: positive
        - id: science
          label: 可信技术平台
          detail: Xcimer 有真实投资人，也有连贯的惯性聚变路线图。
          tone: positive
        - id: price
          label: 当前价格未披露
          detail: 未披露公开投后估值或股权结构表条款。
          tone: warning
        - id: proof
          label: 缺客户和场地验证
          detail: 没有商业证据，同业基准很难迁移。
          tone: warning
        - id: capital
          label: 未来资本堆叠庞大
          detail: 聚变试验电站仍需要数亿美元到数十亿美元。
          tone: warning
        - id: decision
          label: 继续研究 / 观察
          detail: 用情景区间和里程碑闸门替代买入式价格判断。
          tone: neutral
      edges:
        - from: market
          to: science
        - from: science
          to: price
        - from: price
          to: proof
        - from: proof
          to: capital
        - from: capital
          to: decision
    approximationNotes: 由于公开记录没有披露当前估值，也没有足够股权结构表信息支撑确定性模型，该流程用决策闸门而不是数值输出。
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV023
      - CV025
      - CV038
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 任何 Xcimer 估值区间里，最大驱动项都是验证、客户证据、融资充足性和股权结构表清晰度，而不是泛泛的行业热度。
    data:
      xAxis: 驱动因素
      yAxis: 对估值立场的相对影响（1-5 序数）
      items:
        - label: 一体化技术验证
          value: 5
          note: 最强单一上修因素，因为它把架构主张变成里程碑证据。
          tone: positive
        - label: 具名客户或场地主
          value: 5
          note: 相比泛化市场需求，它更能提升可比案例迁移性和可融资性。
          tone: positive
        - label: 足以覆盖里程碑的融资规模
          value: 4
          note: 强融资只有在明确桥接到下一个验证闸门时才有帮助。
          tone: positive
        - label: 股权结构表透明度
          value: 4
          note: 看不到优先权、SAFE 和期权池条款，就无法守住价格纪律。
          tone: positive
        - label: 行业融资动能
          value: 2
          note: 有利背景，但没有公司级执行就很弱。
          tone: neutral
        - label: 非结构化过桥融资
          value: 5
          note: 这是最强下行驱动，因为它会在验证前叠加稀释。
          tone: negative
    approximationNotes: 数值是有序影响评分，不是统计回归系数；它们概括本章证据中最能移动投资判断的因素。
    claimRefs:
      - CV023
      - CV024
      - CV034
      - CV036
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间很宽，因为当前价值未披露，未来稀释是温和还是严重取决于里程碑时点。
    data:
      items:
        - label: 悲观情景
          low: 250
          mid: 350
          high: 500
          displayValue: $250M-$500M
          detail: 该区间假设融资先于充分验证到位，并让 Xcimer 低于独角兽叙事。
          tone: warning
        - label: 基准情景
          low: 500
          mid: 700
          high: 900
          displayValue: $500M-$900M
          detail: 该区间假设子系统验证改善，下一轮融资跟随验证，但客户和场地证据仍不完整。
          tone: neutral
        - label: 乐观情景
          low: 900
          mid: 1200
          high: 1800
          displayValue: $900M-$1.8B
          detail: 该区间需要客户或场地验证，加上一轮大型结构化融资，开始支撑独角兽级叙事。
          tone: positive
    approximationNotes: 这些是以 USD 百万美元计的情景估值区间，不是已披露的当前投后价值。由于条款未公开，它们也不建模具体优先权瀑布。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV034
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开评分最高的是技术严肃性和行业顺风；最弱的是估值可见度、商业验证和融资透明度。
    data:
      items:
        - label: 市场拉力
          value: 4
          unit: /5
        - label: 技术可信度
          value: 4
          unit: /5
        - label: 商业验证
          value: 1
          unit: /5
        - label: 资本充足性清晰度
          value: 1
          unit: /5
        - label: 估值可见度
          value: 0
          unit: /5
        - label: 同业迁移性
          value: 2
          unit: /5
        - label: 尽调完整度
          value: 1
          unit: /5
    approximationNotes: 这些是基于截至 2026-06-02 的章节证据得出的定性有序评分，不是审计后的经营指标。
    claimRefs:
      - CV004
      - CV009
      - CV023
      - CV025
      - CV038
      - CV044
