  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心技术与经济风险——把 ICF 证明变成可重复电站
        blocks:
          - type: paragraph
            body: >-
              Xcimer
              的风险堆栈从一个狭窄但残酷的工程命题开始：选用科学证明最强的聚变路径，然后在资本更充足的同行或更便宜的替代方案抢走市场前，把它压进一个双束、厚液体壁、低重复频率的商业电站。缓释证据真实存在。Phoenix
              意在消除关键气体光学和脉冲压缩风险，OMEGA 增加了外部靶物理数据，白皮书也给出了一个连贯逻辑：更少的腔室穿透、自研脉冲功率硬件、较低名义激光成本。但剩余风险仍是承销里的主问题。OMEGA 没有复现
              Xcimer 的最终光束几何；没有公开来源展示集成双束靶性能、电站级正常运行时间或墙插盈亏平衡；LLNL 和 Annual Review
              都明确指出，点火不能解决驱动器效率、靶吞吐量、材料或燃料循环闭合。Xcimer
              自己的文件在这里有帮助，因为它们用不同语言坦白了同一件事：项目成败仍取决于激光成本、靶稳健性、腔室生存能力和重复运行，能否从可信理论走到测得的系统性能。这使它在 2026 至 2031
              年窗口内成为高严重度、中高可能性的风险，Phoenix 和 Anvil 是第一批真正领先指标。
