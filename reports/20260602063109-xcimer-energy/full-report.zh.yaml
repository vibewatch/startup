      - number: '1.5'
        title: 批判视角与未决问题
        blocks:
          - type: paragraph
            body: >-
              最强的反向证据不是丑闻或诉讼，而是物理、工程和商业化纪律。Xcimer 自己的白皮书承认，NIF 式点火不足以支撑商用电厂；激光效率、增益、每焦耳成本都需要大幅改善，腔室也必须能承受持续聚变工况。2025 年
              Annual Review 关于惯性约束聚变的文章同样指出，点火出现在预期位置，但达到这些条件所需能量高于早先预测，重大研究挑战仍在。LLNL 2024
              年关于惯性聚变能源路径的讨论用更不怀疑的语气表达了同一点：点火是科学里程碑，不是完成版电厂设计。

              这种框架直接影响承销判断。Xcimer 有可信的创始人、强投资人名单，也有比许多聚变创业公司更明确的分阶段路线图，但公司没有公开披露 Series A 背后的估值、董事会具体构成、Phoenix 或 Vulcan
              的经济性，或任何商业交易对手。本次抓取到的 Hurun 公开摘要页确认了榜单的独角兽标准，却没有出现 Xcimer 的公司专属条目，因此任何 $1B
              以上估值说法在公开记录中的具体依据仍未验证。当前合理判断是：前景有吸引力，但证据仍受限。Xcimer 已建立身份、资本和技术计划，价格、治理和客户证明仍是重大尽调缺口。
