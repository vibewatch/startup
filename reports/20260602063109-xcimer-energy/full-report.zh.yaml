companyProfile:
  summary: >-
    Xcimer Energy 是一家总部在 Denver 的激光聚变公司，2022 年由 Conner Galloway 和 Alexander Valys 创立。两人出身 MIT，并曾在 Los Alamos
    合作。公司押注的惯性聚变电厂围绕 KrF 准分子激光器、更大的 DT 胶囊和 HYLIFE 式液态盐腔室搭建。路线图分阶段推进：先做 Phoenix 原型，再到 Anvil、Vulcan，最终在 2030 年代中期走向 Athena
