      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 基于情景的估值区间（USD M）
      - 假设
      - 概率信号
      - 稀释 / 下行含义
      - 决策含义
    rows:
      - - 悲观
        - $250-$500
        - Phoenix 或 Anvil 里程碑延误，没有具名客户或场址出现，下一轮融资同时覆盖未解决证明和现金跑道。
        - 在估值仍未披露、融资仍偏重股权时，这种情形有实质可能。
        - 稀释风险高；后续轮次可能重设条款，或迫使结构化救援融资。
        - 不要为了拿到份额而放宽要求；等待证明，或等待实质更好的价格保护。
      - - 基准
        - $500-$900
        - 关键子系统证明改善，下一轮融资跟随该证明而来，Xcimer 开始展现商业对话，但尚未具备完整可融资性。
        - 今天公开记录中最能支撑的区间。
        - 稀释仍然可能，但如果融资足以覆盖里程碑，该轮仍可能创造可选性价值。
        - 密切跟踪；只有在条款可见且里程碑映射明确时才承销。
      - - 乐观
        - $900-$1,800
        - 集成证明、客户或场址验证，以及大额结构化后续融资开始让 Helion/Pacific 式信心更有参考意义。
        - 需要截至 2026-06-02 尚未公开的证据。
        - 稀释仍可能发生，但如果里程碑先落地，资本可能以更强条款进入。
        - 只有证明出现之后，才具备行动性；之前不具备。
    notes: 这些是用于估值框架的情景区间，不是已披露的当前投后估值。它们锚定里程碑组合和融资质量，而不是虚假的精确单点值。
