  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻市场与现状替代品
        blocks:
          - type: paragraph
            body: >-
              最容易误判 Xcimer 市场边界的方式，是把它当成今天的聚变科研市场。公司尚未商业化，不公开销售电力，也未披露客户合同。它自己的材料描述的是未来产品：面向 AI
              训练集群、海水淡化和工业脱碳的稳定、充裕、无碳电力。因此，应看的市场不是聚变科学、武器维护或清洁科技风投支出的每一美元，而是面向难减排、高负载客户的未来发电资产和长期购电预算。LLNL
              的点火里程碑及后续惯性聚变工作很重要，因为它们把激光 ICF 从纯物理问题推向工程和商业化问题；但 LLNL、DOE 和 CRS
              仍称，在驱动器、靶、包层、材料和电厂集成上，距离商用电厂还有重大缺口。本章纳入的支出包括首座（FOAK）聚变电厂资本开支、长期 PPA 或表后供电承诺，以及面向高占空比电力或热力的系统集成。排除的支出包括 NIF
              和库存维护研发、医用同位素业务，以及不需要聚变所承诺的 24/7 出力、紧凑占地和能量密度组合的普通可再生能源采购。现状替代品仍是天然气、天然气加碳控制、常规核电和
              SMR、地热，以及搭配储能、输电或需求响应的可再生能源。
