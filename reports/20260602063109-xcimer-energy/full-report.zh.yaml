      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              三股力量让市场逻辑比几年前更强：美国聚变监管现在比裂变监管轻，DOE 和 LLNL 明确在建设商业化基础设施，AI
              驱动的电力稀缺也催生出一批可能在聚变达到大宗电价平价前就为可靠性付费的买方。但约束栈仍比需求故事更重。Xcimer 自己说，惯性聚变仍必须解决性能、腔室可存活性和成本问题。独立文献更直接：Annual
              Review 指出点火在预期位置发生，但内爆能量高于预期；LLNL 的 IFE 路径仍描述了很高的靶生产和发次频率要求；SCSP 称氚和锂-6 是战略瓶颈；Kleinman 则认为，首批电厂可能超过
              $0.15/kWh，远高于更便宜的太阳能和天然气替代方案。信任同样重要。Kleinman 警告，创业公司过于激进的对外叙事会在时间表滑坡时损害公众信心；当前同行验证仍是融资、里程碑、PPA
              和选址交易，而不是已交付的商业电力。Xcimer 的未决缺口很具体：没有公开客户管线、没有按垂直行业量化的
              SAM、没有独立验证的电厂经济性，也没有公开靶制造或燃料循环计划。这些缺口不否定市场机会，但把承销判断牢牢留在「有前景、证据受限的期权价值」区间。
