      - number: '3.3'
        title: 能力、定价、上市路径与信任对比
        blocks:
          - type: paragraph
            body: >-
              Xcimer 最强的公开差异化主张是技术：它认为 KrF
              准分子激光器、更低每焦耳成本、双束几何结构和厚液态壁，能让激光惯性聚变比既有激光架构更可扩展、更经济。这个主张自洽，但公开比较并不顺手，因为竞争对手在不同维度取胜。Helion
              最强的是已披露商业牵引力，而不是类似 Xcimer 的物理路线。CFS 最强的是资本规模、战略伙伴和公用事业级电厂规划。Pacific 和 Focused 对 Xcimer
              的攻击更直接，它们争夺的是同一套「惯性聚变已经越过科学门槛，现在该放大工程」叙事。TAE 和 General Fusion
              在架构上不是最直接可比公司，但仍在争夺同一批买方相信某个聚变平台会率先具备可融资性的意愿。


              定价是整个品类最大的公开盲点。除了关于低价电力的泛泛说法，本次抓取记录没有显示 Xcimer
              或任何创业对手的标价、费率结构，或独立验证的平准化成本披露。这把比较推向更软但仍关键的领域：谁有具名客户，谁披露了电厂场址，谁的合作伙伴生态更成熟，谁在监管者、工业场地业主和贷款人眼里更可信。按这个标准，Helion
              和 CFS 的优势最清楚，而 Xcimer 仍更像在出售技术逻辑，而不是完整商业包。
