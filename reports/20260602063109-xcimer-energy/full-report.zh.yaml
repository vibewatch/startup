        - id: gas-optics-layer
          label: 气体光学压缩与光束传输层
          detail: 非线性光学气室把多个长脉冲转换成两束高质量、纳秒级驱动靶丸的光束。
          modules:
            - Raman 光束合成器
            - 'SBS 气体镜 #1'
            - 'SBS 气体镜 #2'
            - 无窗真空快门
        - id: target-layer
          label: 靶丸供给与耦合层
          detail: 靶丸制造、注入、对准和双侧混合直接驱动耦合。
          modules:
            - DT 靶丸与烧蚀层
            - 靶丸注入器
            - 相位板 / 自适应光学
            - 发射诊断
        - id: chamber-layer
          label: 聚变腔室与盐包层
          detail: HYLIFE 式厚液壁吸收中子和热量，同时屏蔽结构并增殖氚。
          modules:
            - 液态盐射流 / 瀑布几何
            - 中子慢化与增殖
            - 蒸汽清除与腔室恢复
        - id: power-layer
          label: 电力转换与再循环系统层
          detail: 把捕获的热量转成可外送电力和电厂再循环功率，同时管理盐清理和氚处理。
          modules:
            - 换热器
            - 蒸汽轮机 / 发电机
            - 燃料清理与再循环功率回路
  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 运行流程从储存电能开始，经过激光压缩、靶丸发射、热量捕获，最终外送电力。
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE011
      - CE012
      - CE021
      - CE045
    data:
      nodes:
        - id: charge
          label: 给电容器和 Marx 级充电
          description: 每次发射前，电能先缓慢积累在高压级中。
        - id: excimer
          label: 触发 KrF 准分子模块
          description: LPK / KJC / Argos 式硬件产生长脉冲紫外泵浦光束。
        - id: compress
          label: 在气体光学中合成并压缩
          description: Raman 合成和 SBS 气体镜把脉冲集中并缩短成驱动靶丸的光。
        - id: inject
          label: 注入并对准靶丸
          description: DT 靶丸以精确时序和位置送达腔室中心。
        - id: ignite
          label: 向混合靶输送两束整形光束
          description: 半黑腔辅助直接驱动使靶丸内爆并产生聚变爆发。
        - id: capture
          label: 液态盐吸收能量并增殖氚
          description: 厚液壁捕获中子能量，保护结构，并支持燃料循环闭合。
        - id: export
          label: 将热量转为蒸汽并外送电力
          description: 换热器和涡轮机把捕获的热能转成电网电力，同时保留再循环功率。
      edges:
        - id: e1
          source: charge
          target: excimer
          label: 脉冲功率放电
        - id: e2
          source: excimer
          target: compress
          label: 长 UV 脉冲
        - id: e3
          source: compress
          target: inject
          label: 靶丸就绪发射时序
        - id: e4
          source: inject
          target: ignite
          label: 双光束耦合
        - id: e5
          source: ignite
          target: capture
          label: 聚变能与中子
        - id: e6
          source: capture
          target: export
          label: 热能传递
        - id: e7
          source: export
          target: charge
          label: 下一次发射的再循环功率
