        title: 替代架构与 Xcimer 的差异
        blocks:
          - type: paragraph
            body: >-
              Xcimer 不是又一家换了营销材料的聚变创业公司；它押注的是一个非常具体的架构。Focused Energy 更贴近直接驱动激光聚变和工业选址；Pacific Fusion 走向模块化脉冲器；Helion
              追求迭代式脉冲机器和未来氘-氦-3 路线；CFS 把制造重心放在高温超导托卡马克硬件上；General Fusion 使用液态金属壁，但把商业化同 LM26 里程碑收口绑定，而不是同激光驱动器绑定。TAE
              则完全在惯性聚变阵营之外。因此，Xcimer
              真正的差异化不在于只有它相信聚变，甚至也不在于只有它相信惯性聚变；差异在于它试图把实验验证最充分的等离子体路径，同一套明确为更低光束数量、更低末端光学暴露、更低重复频率和厚液态壁兼容性优化的束线与腔室设计结合起来。如果跑通，这可能很强；但它也把风险集中到一组狭窄且尚未验证的集成环节上。
