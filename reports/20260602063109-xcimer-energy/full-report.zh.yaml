  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 公开融资 / 估值信号
      - 相关性
      - 为什么不能直接迁移到 Xcimer
      - 对今天 Xcimer 的传导
    rows:
      - - Helion
        - 2025 年 1 月 $425M Series F；已投入 >$1B；公开报道推算投后估值约 $5.425B
        - 当投资者相信商业化和客户证明真实存在时，聚变可以获得溢价。
        - Helion 已披露的客户证明更强，资本形成规模也远大于 Xcimer。
        - 只提供上限背景；不是干净的当前可比。
      - - CFS
        - 2025 年 8 月 $863M Series B2；此后分析师报道显示先接近 $3B、后约 $6.85B 总融资
        - 当示范和建厂叙事加深时，领先者可以持续累积资本。
        - CFS 的资本基数、ARC 路径和公开交易对手都大得多。
        - 可用于融资规模背景，不能直接迁移价格。
      - - Focused Energy
        - 2026 年 5 月 $240M Series A；官网将资本与 Biblis 和首批并网里程碑绑定
        - 更接近的惯性聚变同业，采用激光架构，并披露了明确场址里程碑。
        - 地理、项目设置和已披露场址叙事仍不同于 Xcimer。
        - 最相关的惯性聚变融资可比，但仍不能即插即用。
      - - Pacific Fusion
        - '>$900M Series A 预先承诺，并按里程碑解锁'
        - 当资本强度从第一天起就显而易见，投资者可能会设计超大轮次结构。
        - Pacific 已披露的融资包比 Xcimer 大得多，也结构化得多。
        - 可用于融资结构判断，不能用于当前 Xcimer 标记。
      - - General Fusion
        - 预计 SPAC 标题估值约 $1B，而 F-4 中估值为 $600M
        - 当 PIPE 和 earnout 出现后，公开市场标题可能偏离真实经济堆栈。
        - 架构和市场路径不同；交易机制会扭曲简单比较。
        - 是稀释和标题估值风险的最佳警示可比。
      - - Xcimer
        - 公开确认 $100M Series A；投后估值未披露
        - 锚定今天真正已知的信息。
        - 价格缺失意味着所有同业比较都必须基于情景。
        - 当前立场在条款或证明改善前仍是未知。
    notes: 覆盖范围刻意不求完整：这些行是已抓取语料中对决策最相关的公开私营聚变融资基准，而不是所有聚变公司的普查。
    enumerationScope:
