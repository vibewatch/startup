              detail: 内部生产有帮助，但更广泛的供应链仍重要。
            - label: 监管路径仍按项目而定
              tone: risk
              detail: 聚变许可审批比裂变更容易，但电站细节仍会左右结果。
            - label: 资本需求跑在里程碑前面
