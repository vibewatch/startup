      - number: '1.4'
        title: 技术路线图与公司里程碑
        blocks:
          - type: paragraph
            body: >-
              Xcimer 公开的里程碑序列比许多早期聚变同行更细。公司称，第一个关键原型系统 Phoenix 负责降低气体光学和脉冲压缩风险，到 2026 年 3 月已接近完成。2025 年 12 月和 2026 年 3
              月的更新还给出下一阶段路线图：Anvil 是双侧 200 kJ 靶场装置，使用全尺寸激光硬件；Vulcan 是 12 MJ 级设施，目标在 2030 年完成建设，并在 2031 年达到工程盈亏平衡；Vulcan
              之后再走向聚变试点电厂。这种分阶段架构重要，因为它把一个遥远的商业化承诺拆成后续章节可以检验的中间工程节点。

              实验记录仍早期，但并非空白。2026 年 3 月，Xcimer 披露在 University of Rochester 的 Laboratory for Laser Energetics 进行了 OMEGA
              发次，用于对标其双束半黑腔建模；合作方包括 General Atomics、Los Alamos National Laboratory 和 Universidad Politécnica de
              Madrid。公司还把私营工作接到美国公共项目上：2023 年 $9M DOE 里程碑奖励、参与全部三个 IFE-STAR 枢纽，并反复把自身叙事同 NIF 在 2022 年 12
              月的点火及后续更高产额发次相连。因此，路线图锚定了真实实验和公私合作，但还没有锚定已披露的电厂经济性、客户合同或已证明的工程盈亏平衡。
