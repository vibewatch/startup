              - CV038
      - number: '8.4'
        title: 什么会改变估值立场，什么会击穿估值立场
        blocks:
          - type: paragraph
            body: >-
              通往更坚定估值立场的路径并不复杂，哪怕公开记录还不够。第一，Xcimer
              需要集成技术证明，让投资人能把它连接到未来电站经济性，而不只是连接到架构理论。第二，它需要商业证明：具名客户、场地主、公用事业路径或工业交易对手，让 Helion、CFS、Focused 或 Pacific
              的类比开始更可迁移。第三，它需要融资清晰度——不只是更大的融资标题，而是证明资本结构足够支撑，并且公司不是用短现金跑道换长期稀释。在这些发生之前，正确建议不是英勇买入，而是带里程碑门槛的继续研究或观察，并高度关注终止触发因素。如果
              Xcimer 在证明更多之前就必须重定价，或者行业本就集中的融资窗口变弱，投资逻辑就会破裂。因此，最终尽调必须聚焦 2024 年 6 月那轮融资背后隐藏的确切条款、Vulcan 和 Athena
              的内部资本开支与融资模型，以及交易对手从兴趣走向承诺的任何真实证据。
