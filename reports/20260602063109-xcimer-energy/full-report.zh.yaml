  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 已披露资本与投资人质量
        blocks:
          - type: paragraph
            body: >-
              Xcimer 的公开融资故事短，但可信。官方和独立报道都指向同一事实：2024 年 6 月宣布 $100M Series A 轮，由 Hedosophia 领投，Breakthrough Energy
              Ventures、Lowercarbon Capital、Prelude Ventures、Emerson Collective、Gigascale Capital 和 Starlight Ventures
              参投。同一批披露称，这笔钱用于 Denver 设施、原型激光系统、脉冲压缩硬件和团队扩张，因此这轮融资看起来是真正的原型资本，而不是软性营销公告。Xcimer 还提到 2023 年 DOE
              Milestone-Based Fusion Development Program 的 $9M 奖励，让公司有一层可见的非稀释性支持，并能接入公私合作的惯性聚变基础设施。


              这套融资栈重要，缺失项同样重要。抓取到的公开来源没有披露 Xcimer
              的投后估值、出让股权、清算优先权、董事会控制条款或期权池结构。投资人质量足够强，可以支撑一个判断：成熟投资人已经做过部分尽调。但投资人品牌不能替代财务披露。因此，公开记录只支持一个窄口径正面结论：Xcimer
              已从严肃支持者和联邦支持项目中拿到可信早期资本。它不能支持关于入场价格、稀释历史或当前资产负债表强度的更强结论。
