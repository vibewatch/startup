      - number: '3.4'
        title: 切换成本、多头接触、分销权力与供应获取
        blocks:
          - type: paragraph
            body: >-
              在买方教育阶段，多头接触理论上可行；越往后越难。今天，超大规模云厂商、公用事业公司或工业买方可以同时和多家聚变开发商沟通，因为没有哪家创业公司已经交付商业电力。但一旦买方把真实选址工作、并网排队、公共事务资本、许可时间和项目融资押到某条路径上，切换成本会迅速上升。锁定不是软件
              API 问题，而是项目开发问题。因此，先拿到具名交易对手和可融资场址计划的公司会受益，即使它们的物理路线并不是最接近 Xcimer 的类比。


              分销权力大多不在创业公司自己手里。锚定客户、公用事业公司、监管者和既有采购渠道决定哪些概念会变成真实项目。Helion 受益于 Microsoft 和 Nucor 公开宣布意向。CFS 受益于 Google
              挂钩购电和 Dominion 式选址语境。Pacific 受益于 Sandia 邻近性和大规模已承诺融资结构。相比之下，Xcimer
              尚未公开展示会限制买方选择的独家供应商、锁定客户或渠道伙伴。供应获取也还不是赢家通吃：氚、锂-6、激光二极管和超导材料瓶颈可能同时伤害多条路径，而供应商仍可在创业公司之间多方服务。这让商业提前量和伙伴捕获比单纯新颖性更重要。
            claimRefs:
              - CP031
              - CP032
              - CP041
              - CP043
              - CP044
              - CP045
      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              反向情景很直接：Xcimer 的架构可能正确，但商业上仍可能输。公开证据尚未显示它拥有受保护的客户位置、受保护的供应位置或独立验证的电厂经济性。Helion 和 CFS
              已经证明，如果其他聚变路径看起来更接近执行，买方和投资人会承诺押注完全不同的路线。Focused 和 Pacific 也说明，惯性聚变本身不是 Xcimer
              的私有品类。如果这些同行更早达成可信电厂里程碑或工业场址，Xcimer 的差异化可能从「定义品类」压缩为「几个惯性选项之一」。


              更难处理的反向证据来自整个行业。Annual Review 指出，惯性聚变点火所需内爆能量高于早先预测，仍面临重大研究挑战。Kleinman
              认为早期聚变电厂并网价格可能明显高于天然气或太阳能，同时警告过度乐观的创业公司时间表会伤害公众信任。SCSP 又加了一层供应链风险：氚、锂-6、激光二极管和 HTS 瓶颈都可能变成商业卡点。这些风险不能证伪
              Xcimer，但会大幅限制当前护城河耐久性。今天，Xcimer 拥有可信技术故事和有证据支撑的一组差异点；它还没有占住围绕客户证明、经济性或锁定效应的商业战场。
