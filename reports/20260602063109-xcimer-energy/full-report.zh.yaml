            body: >-
              公开验证存在，但还是模块级，而不是端到端。Xcimer 称自己已经建成创纪录的私营部门电子束泵浦准分子系统；Phoenix 要证明剩余的激光架构基础能力：长脉冲 KrF 运行、自研 Marx 脉冲功率和 SBS
              脉冲压缩。2026 年 3 月 OMEGA 实验又提供了外部靶物理证据：测试半黑腔，收集辐射温度和冲击速度数据，供 Xcimer 模型使用。这很重要，但不能结案，因为 OMEGA 无法复现完整系统最终的光束几何或
              F-number。因此，Anvil 会成为第一个真正的集成关口，它有两条全尺寸束线和一个 200-kJ 靶场装置。Vulcan
              是公司的成败关口：在多兆焦耳系统以可重复运行证明工程盈亏平衡之前，公开记录不能支持电厂就绪主张。Athena 仍是电厂概念，不是已证明的运营资产。
