      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 融资是公开的，价格不是
            body: Xcimer 跨过了“有真实支持者的真实公司”门槛，但没有跨过“可公开定价的创业公司”门槛。因此，本章落在继续研究 / 观察，而不是买入式估值判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV044
          - type: callout
            title: 资本强度是传导到稀释的主通道
            body: 最大的下行不只是聚变很难，而是证明、商业转化和资本形成可能错序到来，迫使 Xcimer 在还没有建立更强可比基准之前，就先进行高成本股权融资。
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV034
              - CV036
              - CV042
          - type: callout
            title: 不要过度解读 Hurun 或 Tracxn
            body: Hurun 定义了独角兽门槛，但没有显示抓取到的 Xcimer 条目；Tracxn 则露出隐藏估值字段，却不披露数字。两者都适合作为缺口证据，而不是 Xcimer 已经值某个具体金额的证明。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV032
