  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究 / 观察
        - 公司明显具备融资能力，技术上也足够严肃，但公开记录没有披露当前价格，也没有足够商业证明来支持入场承销。
        - 不要锚定单点估值；只在里程碑约束下继续尽调。
      - - 置信度
        - 中
        - 融资和同业背景证据扎实，但公司自身估值和股权结构表证据基本缺席。
        - 将上行和下行情景区间当作情景工具，而不是高确信度定价。
      - - 风险评级
        - 高
        - 技术、商业和融资里程碑仍需同时对齐，电站级可融资性才会出现。
        - 假设未来轮次和非轻微稀释大概率发生。
      - - 估值立场
        - Unknown
        - 没有公开来源披露 Xcimer 的投后估值，Hurun 式独角兽推断也缺乏支撑。
        - 避免给当前标记贴上有吸引力、合理或昂贵的标签。
      - - 入场纪律
        - 只接受证据先行的条款
        - 没有证明，价格更好也不够；证明存在但融资不足，也同样不够。
        - 同时要求里程碑证据、股权结构表可见度和融资充足性。
    notes: 这张表总结的是判断，而不是公司层面的公开 KPI，因为决定性缺失变量是未披露的当前价格。
