      - number: '6.2'
        title: 买方、用户、付款方分层与可能的采购路径
        blocks:
          - type: paragraph
            body: >-
              Xcimer 还没有卖电，分层必须从未来采购机制而不是现有客户名单入手。超大规模云厂商是最清楚的例子。用户是需要高可用电力的数据中心集群，但经济买方通常是集中能源或采购团队，它们能承接长期 PPA
              或结构化购电。工业脱碳不同：运营公司和工厂能源团队同时是用户和买方，付款方往往是企业资产负债表或专门项目载体。海水淡化在结构上更难，因为公共或主权基础设施机构、公用事业公司和运营商可能分处审批链的不同位置。跨细分看，Xcimer
              大概率会走基础设施式的慢路径：确定细分市场，扛过技术尽调，拿到锚定购电或开发 MOU，推进场址和并网工作，穿过许可审批，然后才进入建设融资和运营。McKinsey 关于 24/7 清洁 PPA
              的研究在这里有价值，因为它说清楚了一点：先进能源采购靠交易、结构设计、法律起草和风险管理，不只是有一台看起来有希望的机器设计。
