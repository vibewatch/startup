  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与电厂概念
        blocks:
          - type: paragraph
            body: >-
              Xcimer 还没有销售反应堆模块、汽轮机包或电力购买协议；它当前的产品是一套分阶段工程项目，目标最终是为需要稳定无碳能源的大买方建成激光聚变电厂。放在客户工作流里，公司瞄准的是 AI
              园区、海水淡化系统和工业场址等设施，这些设施今天把电网电力、天然气、储能和备份电源拼在一起。商业承诺是，未来 Xcimer
              电厂会用一个现场或并网的连续电源，替代这套多资产组合；它围绕重复聚变发次和常规蒸汽循环运行。这个产品概念的不同之处在于，Xcimer
              把激光器、靶、腔室和盐回路视为一套紧耦合电厂架构：任何一个子系统放大失败，就没有产品。这个框架很关键，因为商业价值主张不只取决于等离子体增益，也同样取决于维护节奏、靶成本和腔室可存活性。
