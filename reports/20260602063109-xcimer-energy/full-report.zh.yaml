  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手、替代聚变路线与非聚变替代品
        blocks:
          - type: paragraph
            body: >-
              Xcimer 面对的竞争不是一个笼统的「聚变」市场。最接近的直接同行是 Focused Energy 和 Pacific Fusion，因为三家公司都明确在商业化惯性聚变路径，并公开谈论 2030
              年代中期并网结果，而不是没有终点的科学项目。Helion、Commonwealth Fusion Systems（CFS）、TAE Technologies 和 General Fusion
              仍是重要竞争者，尽管物理路线不同；买方最终购买的是同一个结果：面向超大规模云厂商、公用事业公司、工业场址和其他高负载客户的可靠无碳电力。在近期上市路径压力上，Helion 和 CFS
              最重要，因为它们已经披露了交易对手或购电结构，而 Xcimer 公开层面还没有匹配。


              竞争集合还要更宽。天然气电厂、配储可再生能源、地热、电网升级、需求响应项目，以及先进裂变或 SMR 项目，都能比 2030
              年代中期的聚变电厂更早解决同一个采购问题。因此，内部拼装方案本身就是一个真实「竞争者」：许多买方可以在任何聚变创业公司商业运营前，先拼出并网、灵活负载管理、PPA 和可调度备份的组合。实际竞争中，Xcimer
              既要和直接惯性聚变对手争未来预算份额、并网优先级和买方注意力，也要和完全不需要聚变突破的采购既有方案竞争。
