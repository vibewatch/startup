      - number: '5.2'
        title: 驱动器、靶与腔室架构
        blocks:
          - type: paragraph
            body: >-
              工程逻辑异常具体。Xcimer 想在大型准分子放大器中产生微秒级 248-nm KrF 脉冲，用 Raman 光束合成集中能量，再用两个受激 Brillouin
              散射气体反射镜压缩脉冲，最后通过无窗口气体到真空过渡，把纳秒脉冲打到双侧混合直接驱动靶上。这一整套复杂性不是为了优雅，而是为了电厂兼容性。NIF 证明间接驱动 ICF 可以点火，但它的 192
              束固态架构带来巨大的光学面积、窗口损伤和腔室穿透负担。Xcimer
              试图把这些负担换成一个更紧的光学控制问题：双束意味着更少的最终穿透点，也让厚液态壁有现实路径；但公司必须有说服力地证明，在高得多的能量下，光束整形、相位保持、自适应光学和靶制造仍能让内爆足够对称。简言之，这套架构把难度从光束数量转移到光束质量和系统集成。
