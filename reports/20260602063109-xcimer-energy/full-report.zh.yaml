      - number: '3.2'
        title: 竞争者画像：规模、融资、客户焦点与战略方向
        blocks:
          - type: paragraph
            body: >-
              公司画像差异很大。Xcimer 的公开商业画像可信但仍早期：$100M Series A 轮、超过 150 名员工，以及围绕准分子激光放大和 2030 年代中期部署逻辑搭建的路线图。Focused Energy
              和 Pacific Fusion 对这一叙事威胁最直接，因为两家公司都以各自方式让投资人和政府读懂了惯性聚变商业化。Focused 现在把自己定位为由点火老兵打造的激光聚变公司，拥有 $240M Series A
              轮、160 多名员工和 Biblis 工业场址策略。Pacific 在已披露资本规模上更进一步，声称已承诺的 Series A 融资超过 $900M，员工超过 110 人，并在 New Mexico
              建设园区，目标是 2030 年达到净设施增益。


              在替代路线中，Helion 的公开客户证明和高估值最突出；CFS 的资本厚度和公用事业式电厂规划最强；TAE 有长运营历史和相邻变现路径；General Fusion
              则拥有最明确的公开市场融资路径。共同模式是，所有主要竞争者都试图超越物理项目本身：每家公司都围绕选址、客户触达、工业伙伴或融资结构包装执行故事。这意味着市场不会只按激光优劣比较
              Xcimer。外部会看它的商业化故事是否像资金更足、合作伙伴更显眼的同行叙事一样可融资、一样接近客户。
