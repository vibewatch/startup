      - number: '4.4'
        title: 资本充足性、稀释风险与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              正确的财务结论不是 Xcimer 今天绝对意义上资本不足，而是公开证据无法说明当前现金宽裕还是紧张，并且未来资本需求几乎肯定很大。已披露的 $100M Series A 加 DOE
              支持，看起来足以支撑原型和里程碑工作；但公司没有公布当前现金、月度烧钱速度或逐里程碑支出。这意味着外部观察者无法判断下一次融资触发点是还很远，还是已经嵌在 Phoenix-to-Anvil-to-Vulcan
              路线图里。


              这种不确定性带来明确的资产负债表和稀释风险。没有公开披露债务、客户预付款、项目融资承诺或供应商融资结构，因此可见融资路径仍偏股权。如果里程碑滑坡或资本市场收紧，Xcimer
              可能面临行业调查和同行文件已经提示的同类融资压力。同样重要的是，缺失的估值和股权结构条款让外部无法判断当前股东基础是否与未来轮次对齐，或隐藏优先权负担是否会扭曲回报。现在，Xcimer
              的财务分析更多受缺席证据主导，而不是受负面证据主导：公司披露的资本足以证明它是严肃玩家，但公开披露还不足以按常规方式承销。
