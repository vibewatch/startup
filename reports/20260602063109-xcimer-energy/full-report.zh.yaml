      - number: '2.2'
        title: 规模测算视角：宽口径 TAM、需求拉动与缺失的 Xcimer SOM
        blocks:
          - type: paragraph
            body: >-
              本章只能支持受证据约束的规模测算，不能给出整齐的 Xcimer TAM-SAM-SOM 堆栈。已发布的聚变预测跨度很大，因为它们衡量的对象不同。MarketsandMarkets 把宽口径核聚变市场测为 2026
              年 $18.0B、2031 年 $33.77B；Future Markets 则称，如果技术里程碑落地，行业到 2036 年可能达到 $40-80B，到 2050 年可能超过 $350B。FIA 2025
              年调查又提供了另一种视角：行业迄今已融资 $9.766B，但受访公司称，若要把所有受访公司推到商业化，仍需要超过 $77B。这些都是有用信号，但不是 Xcimer 专属收入预测。更干净的需求侧视角来自
              Xcimer 自己点名的买方问题。S&P Global 和 MarketsandMarkets 都提到数据中心用电快速增长，其中 S&P 指向到 2029 年全球 CAGR 为
              14%，MarketsandMarkets 引用 IEA 估计称，数据中心需求可能从 2024 年接近 415 TWh 升至 2030 年约 945
              TWh。这支撑了一个巨大的溢价稳定电力机会。它不能支撑的是量化的 Xcimer SAM 或 SOM。公开信息中，Xcimer 没有披露已签约兆瓦、PPA 价值或客户支持的项目经济性，因此当前 SOM 最好按已披露
              MW 为零处理，而不是假设管线价值。
