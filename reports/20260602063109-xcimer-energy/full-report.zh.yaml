      - number: '6.4'
        title: 留存、切换成本逻辑、集中度与仍不可知的部分
        blocks:
          - type: paragraph
            body: >-
              Xcimer 的留存分析只能前瞻，不能基于观测。公开记录里没有安装基数、续约周期、流失记录或满意度调查，标准 SaaS
              式耐久性工具箱还派不上用场。真正该替换的问题是：如果公司拿下第一个电站客户，切换成本会从哪里来。那些成本可能主要是物理和合同层面的：特定场址的并网工作、许可、脱碳核算集成、定制供电条款、项目融资文件。理论上这些成本真实存在，但还没有证据支撑。因此，集中度风险更重要。在聚变领域，第一个锚定交易对手可能主导整个商业化叙事：验证可融资性、设定合同范式，并帮助打开下一轮融资。FIA、F4E
              和 CRS 从不同角度强化同一点：商业聚变仍然重资本，参考案例很少，科学与电网集成障碍仍然重要。因此，对 Xcimer 的反向解读不是客户流失，而是稳定电力需求越来越容易说明的同时，公开商业牵引仍然不透明。在
              Xcimer 披露交易对手、条款或买方资本承诺之前，耐久性和扩张都只能按假设处理，不能当作已验证行为。
