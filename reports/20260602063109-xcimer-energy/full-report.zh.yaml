      - number: '8.3'
        title: 情景区间必须绑定里程碑、融资结构和稀释
        blocks:
          - type: paragraph
            body: >-
              由于 Xcimer
              当前投后估值没有公开披露，唯一诚实的估值框架只能是情景法。悲观情景低于独角兽区间，并假设下一轮融资早于集成证明到来，迫使投资人同时为激光经济性、靶运行、腔室耐久性和商业转化的不确定性买单。基准情景可以支撑数亿美元中段的区间，但前提是
              Phoenix 和 Anvil 拿出证据，实质性消除子系统风险，而且下一轮融资跟在这些里程碑之后，而不是跑在前面。乐观情景只有在 Xcimer 开始接近最佳基准组的融资模式后，才可能迈向或超过 $1
              billion：资本更大、结构更好，项目经济性更清晰，并出现某种场地主、客户或战略工业验证。三个情景共同的最大现实风险是稀释。公开证据仍指向重股权路径，而资本密集型聚变项目很少止步于一轮大型私募。General
              Fusion 的文件显示，后期融资机制出现后，堆栈会变得多复杂。对 Xcimer 而言，决定性问题不只是下一次标记估值是多少；而是这个标记是否同时带来足够资金和足够里程碑证明，避免之后掉入再融资陷阱。
            claimRefs:
              - CV023
              - CV024
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
