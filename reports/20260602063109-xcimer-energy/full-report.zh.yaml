      - number: '4.2'
        title: 收入与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              关于 Xcimer 运营模式，最主要的财务事实是仍有太多未披露。公司描述未来面向 AI 集群、工业脱碳和海水淡化的聚变电力，这支撑了最终通过售电或 PPA
              式路径变现的可能。但本章审阅的公开来源没有披露客户合同、已签约兆瓦、费率结构、标价、实际价格、收入、ARR、毛利率或已签订单。换句话说，Xcimer 可以被理解为未来电力开发商，而不是当前可量化的商业公司。


              公开运营规模信号存在，但只能当代理指标。Xcimer 称员工超过 150 人，并显示五个部门有 37
              个空缺岗位，其中包括财务、政府关系和业务开发。这意味着在商业收入出现前，公司已有不小的固定运营开支；但公司不公布现金余额、烧钱速度或现金跑道。Xcimer
              的经济性主张也呈现同样模式：白皮书和路线图强调激光架构层面有很大的成本和效率优势，但这些主张没有转化为公开的电厂级利润模型。用于承销时，实际判断很简单：公司可能拥有自洽的未来收入模型，但当前公开记录无法让投资人精确计算收入质量、CAC
              / 回本周期、毛利率，甚至近期融资压力。
