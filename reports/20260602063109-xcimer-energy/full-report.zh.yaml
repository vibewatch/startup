  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 商业化前的聚变客户，从识别需求到续约假设，大致要过这些关。公开记录显示，Xcimer 目前还停在锚定交易对手方之前。
    data:
      nodes:
        - id: need
          label: 需求识别
          detail: AI、脱碳和可靠性需求推高稳定电力缺口，超大规模云厂商、工业运营商和基础设施出资方都要面对。
          tone: neutral
        - id: screen
          label: 技术筛选
          detail: 买方团队会把聚变同可再生能源、储能、天然气、裂变和其他稳定清洁电力方案对比，检验科学叙事是否正在变成工程叙事。
          tone: neutral
        - id: anchor
          label: 锚定承购或 MOU
          detail: 首次商业运营前，首个交易对手方同意预留产出或共同开发项目；Helion 和 CFS 的可比案例已经在这里有公开验证。
          tone: positive
        - id: site
          label: 选址 / 并网 / 许可
          detail: 场地主选择、排队策略、输电或表后设计、监管路径，会让关系比普通能源采购黏得多。
          tone: warning
        - id: operate
          label: 运营与扩张
          detail: 只有交付正常运行时间和账单历史之后，续约、第二座电站选项和真实切换成本才看得见。
          tone: warning
    approximationNotes: 这是阶段图，不是量化转化漏斗。Xcimer 未披露各阶段流转率，因此图中展示的是工作流，而非概率。
