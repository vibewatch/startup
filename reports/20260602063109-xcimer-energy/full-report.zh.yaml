      - number: '7.2'
        title: 监管、燃料循环、供应链和融资瓶颈
        blocks:
          - type: paragraph
            body: >-
              第二组风险不如激光物理耀眼，但同样决定成败：氚、许可、供应链和钱。法律背景方向上有利。ADVANCE Act 和 NRC
              的聚变规则制定给了聚变比裂变更轻触的框架，应该能减少一部分进度拖累。但这并不等于电站已经去风险。CRS 仍然指向 Agreement State
              复杂性、放射性材料许可，以及特定场址项目在实践中如何处理的未决问题。燃料循环对 Xcimer 约束更强，因为它的商业叙事仍然走 DT
              燃料路线。独立来源持续警告，氚仍然稀缺、昂贵、受严格治理，并依赖尚未在商业规模验证的增殖系统。Xcimer
              的厚液体壁概念可能有助于增殖比和第一壁磨损，但公司自己的时间线仍假设工业规模盐系统组件，而这些组件尚未公开。融资随后放大技术风险。Xcimer 融到的 $100 million 对 Phoenix
              有可信度，但撑不起一座电站。资金更充足的同行已经在融资数亿美元到数十亿美元，而 DOE 的战略和预算措辞仍把公共支持定位为里程碑杠杆，不是电站融资替代品。缓释证据——Tucson 电容器制造、DOE
              支持和更友好的联邦姿态——真实存在，但剩余风险仍高，因为资本、同位素和场址就绪的许可都必须先于收入到位。
