      - number: '1.3'
        title: 融资、投资人基础与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Xcimer 的第一笔主要融资是 2024 年 6 月 4 日宣布的 $100M Series A 轮。该轮由 Hedosophia 领投，Breakthrough Energy
              Ventures、Lowercarbon Capital、Prelude Ventures、Emerson Collective、Gigascale Capital 和 Starlight Ventures
              参投。管理层称这笔资金足以在 Denver
              建设原型激光系统，并推动商业化里程碑。独立报道也反复确认同一批投资人和金额，因此融资本身高度可验证。缺失的是价格：本轮抓取到的公告没有披露投后估值、出让股权、优先股堆叠或董事会控制条款。

              融资与地域整合和扩张同步发生。公司称已把大多数员工迁往 Denver，后续披露又称 Xcimer 有超过 150 名员工，多数在 Denver 总部，制造业务在 Arizona 州
              Tucson。招聘材料在抓取时显示五个部门共有 37 个空缺岗位，并称公司计划在未来一年把团队规模翻倍。这样的招聘规模足以说明 Series A 资本正在转化为工程能力，但 Xcimer
              仍未发布经审计财务、烧钱速度、现金跑道或精确员工数趋势。
