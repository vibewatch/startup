      - number: '4.3'
        title: 资本强度与基准参照
        blocks:
          - type: paragraph
            body: >-
              由于 Xcimer 不公开电厂资本开支、LCOE 或项目融资假设，判断未来融资需求最好的公开方法，是参考同行和行业基准。这些基准在方向上并不轻松。World Nuclear News 摘要的 FIA
              调查数据显示，聚变公司仍报告需要 $3M 到 $12.5B 的额外资本才能让首批试点电厂上线，中位数为 $700M，合计超过 $77B。The Fusion Report
              更进一步认为，即使已经融资超过十亿美元的公司，也很可能需要把股权、商业债务和建设债务组合起来，为每座电厂投入数十亿美元。


              同行融资显示同样的升级曲线。Focused Energy 围绕 Biblis 场址完成 $240M Series A 轮；Pacific 披露超过 $900M 的按里程碑解锁 Series A 承诺；Helion
              称已投入超过 $1B，投后估值 $5.425B；CFS 称累计资本接近 $3B。General Fusion 的公开市场路径是一个有用的警示基准：公开材料曾宣传约 $1B 的备考股权价值，但 Form F-4
              明确显示，赎回会减少可用信托现金，而且即便合并融资也不足以支持商业化。这不能证明 Xcimer 最终需要多少资本，但确实意味着，惯性聚变电厂公司不能把 $100M 原型轮当作完整资本栈。
