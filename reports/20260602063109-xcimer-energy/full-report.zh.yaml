  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 向估值的传导
      - 行动含义
    rows:
      - - 融资前证明延误
        - 下一轮融资先于更清晰的 Phoenix 或 Anvil 证据到来
        - 投资者一次性为未解决的科学、工程和商业化买单。
        - 转向下行框架；要求更深价格保护，或暂停。
      - - 没有客户或场址证明
        - 融资规模扩大时，仍没有具名交易对手、场地主或许可路径
        - 同业基准仍无法迁移，乐观情景概率下降。
        - 维持未知 / 高风险立场。
      - - 轮次太小或太像过桥
        - 资本不能清晰覆盖下一个证明关口
        - 现金跑道风险上升，下轮降价概率提高。
        - 假设未来再融资压力存在。
      - - 股权结构表意外
        - 优先股悬挂、SAFE 或期权池扩张显著超过预期
        - 可供新老持有人分享的股权价值被压缩。
        - 条款可见后立即重定价风险。
      - - 行业基准承压
        - 龙头轮次、SPAC 或后续融资在整个聚变行业明显走弱
        - 即便团队执行到位，可选性倍数也会压缩。
        - 使用更严格的情景权重和更慢的部署假设。
    notes: 这些触发项可监测，并刻意绑定融资充足性、证明时点和可迁移性，而不是泛泛的行业乐观。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series A 条款
        - 精确投后估值、出让股权比例、清算优先权和董事会控制条款
        - 没有这些，就无法判断当前价格纪律或优先股堆叠。
        - 向管理层索取该轮融资材料、融资文件和更新后的股权结构表。
      - - 当前股权结构表
        - SAFE 转换、期权池规模、员工股权储备，以及任何附函经济条款
        - 这些条款决定了标题估值有多少能传导到普通股。
        - 让法律顾问和财务团队尽调完整股权结构表及清算瀑布。
      - - 里程碑预算
        - 从 Phoenix 到 Anvil、Vulcan 和 Athena 的各证明关口预算
        - 这决定下一轮融资是足够覆盖，还是只是过桥。
        - 要求披露内部里程碑预算和备用情景。
      - - 商业证明
        - 具名客户、场地主，或结构化战略合作伙伴管线
        - 这些里程碑能让同业可比更可信地迁移。
        - 要求提供 NDA、管线快照，以及严肃交易对手的证据。
      - - 电站经济性
        - 内部资本开支、运营开支、靶成本、发射节奏、可用率和融资假设
        - 这是从可信科学走向可融资价值的核心桥梁。
        - 要求按情景提供最新电站模型和融资假设。
    notes: 这些问题按降低估值不确定性的程度排序，而不是按获取难度排序。
    claimRefs:
      - CV004
      - CV006
      - CV033
      - CV037
      - CV039
      - CV040
      - CV043
