      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Xcimer 的起源故事是公开记录里最清楚的部分之一。Conner Galloway 和 Alexander Valys 在 MIT 大一做室友时相识，学习物理和工程，后来一起在 Los Alamos
              National Laboratory 工作，并于 2022 年创办 Xcimer。公司官方材料和 2026 年白皮书把 Galloway 列为联合创始人兼 CEO，把 Valys 列为联合创始人兼
              CTO。2024 年融资材料还称 Galloway 是首席科学官，说明这个阶段公司的技术权威和经营权力高度集中在同一个人身上。

              公司开始补强领导梯队，但公开记录仍显示创始人集中度很高。2024 年 6 月，Xcimer 宣布聘请 Giovanni Greco 担任工程高级副总裁；他此前在 Blue Origin 和 Astra
              有航空航天系统经验。2026 年新闻档案还记录了围绕 Vulcan 建设的一波高管招聘，包括 Vulcan 首席工程师、Vulcan
              高级副总裁、防务副总裁和战略传播高级副总裁。这些补充说明公司正从纯科学创业公司转向项目管理模式，但完整董事会名单、独立董事或正式继任结构都没有公开披露。因此，Galloway、Valys 以及成形中的
              Vulcan 执行团队仍构成实质性关键人物依赖。
