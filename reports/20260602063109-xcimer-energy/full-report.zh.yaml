      - number: '5.5'
        title: 制造、燃料循环与开放风险
        blocks:
          - type: paragraph
            body: >-
              白皮书里的成本故事很有吸引力，因为它从二极管工厂、精密晶体和巨大固态光学占地，转向气体腔、Marx 发生器、电容器、钢、铝和塑料。Xcimer 的 Tucson
              电容器产线是最清楚的证据，说明公司试图直接掌握其中一个瓶颈。但公开风险清单仍很长。LLNL 自己的惯性聚变商业化议程仍把靶、腔室材料、诊断和燃料循环接口列为开放工作；Annual Review
              同样认为，点火没有解决效率或经济规模问题；氚市场也过于稀薄，任何 DT 电厂都不能长期依赖外部供应。Xcimer 承认 FLiBe
              泵、喷嘴磨损、腐蚀控制和盐化学仍有开放问题；公开来源也仍未显示靶工厂产能、注入器可靠性或独立电厂经济性。这些不是边缘问题。它们正是把技术上有吸引力的架构和可承销电厂产品区分开的证据缺口。
