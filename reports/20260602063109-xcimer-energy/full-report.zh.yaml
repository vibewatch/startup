      - number: '7.3'
        title: 商业证明、执行风险和下行触发因素
        blocks:
          - type: paragraph
            body: >-
              第三组风险最容易让行业热情跑在 Xcimer 证据前面。广义市场信号存在：Microsoft 与 Helion 签约，Google 与 CFS
              签约，投资人继续以很大的轮次规模资助其他聚变路径。这证明成熟交易对手愿意押注长期聚变期权；它没有证明 Xcimer 已经越过同一门槛。抓取到的 Xcimer 记录仍没有具名客户、购电协议、场地主、EPC
              合作伙伴或公开并网路径。这个缺口重要，因为公司一边要求投资人相信激进技术里程碑，一边要求他们相信一个还不可见的未来项目融资或客户转化故事。治理不透明让下行更难定价：Xcimer
              披露融资，但不披露估值、条款或稀释路径。务实的缓释方法，是围绕领先指标而不是承诺来承销本章。如果 Phoenix 发布有说服力的集成指标，如果 Anvil 拿到场地主和准入标准，如果 Xcimer
              公布场址和锚定商业交易对手，并且下一轮融资发生在这些里程碑之后——而不是之前——风险严重度可以快速下降。如果这些指标滑坡，投资逻辑破裂不是因为聚变不可能，而是因为这个从实验室证明到可融资电站的具体转译耗时太久、耗资太多。
