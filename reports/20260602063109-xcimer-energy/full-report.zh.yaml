chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy 是一家私营激光聚变公司，总部在 Colorado 州 Denver，2022 年由 Conner Galloway 和 Alexander Valys
              创立。作为早期聚变创业公司，它的公开定位格外具体：公司称，激光驱动的惯性约束聚变（ICF）是唯一经过科学验证、能够产生聚变增益的路线；Xcimer
              的任务不是发现新的约束概念，而是把这套物理工业化。官方材料反复把产品描述为电厂平台，而不是科研工具，目标是向 AI 训练集群、海水淡化和工业脱碳等高耗能终端市场供应稳定无碳电力。

              商业模式仍处于收入前阶段，而且重资产。Xcimer 在搭建大型高效氟化氪准分子激光器、脉冲压缩硬件、靶系统和受保护腔室设计；公司认为，这些模块能把 NIF
              式点火物理变成可重复的能源系统。公开路线图更像电厂开发模式，而不是软件式授权模式：先用 Phoenix 和 Anvil 降低激光与靶架构风险，再用 Vulcan 证明工程盈亏平衡，最后在 2030
              年代中期走向聚变试点电厂和商业部署。公司详细讨论了下游客户类别，但尚未宣布商业客户、公用事业合作伙伴、电力购买协议或公开收入。
