      - number: '8.2'
        title: 同行基准显示资本能流向哪里，也显示多数基准为何不能迁移
        blocks:
          - type: paragraph
            body: >-
              Xcimer 最接近的公开估值语境来自同行，但每一个同行基准都需要打可迁移性折扣。Helion
              的公开报道指向数十亿美元估值，但那个基准建立在披露更充分的商业化堆栈上：庞大的融资历史、官方客户叙事和工业方参与。即便如此，MIT 的批评也显示 Helion
              时间线仍遭专家质疑，提醒我们客户证明不能抹掉聚变执行风险。CFS 更不适合作为直接可比，因为它的资本基础、建设路径、投资人名单和 Google 绑定的商业化故事，都明显领先于 Xcimer
              当前公开披露。Focused Energy 和 Pacific Fusion 作为惯性聚变参考点更相关，因为它们显示激光路线同行可能获得怎样的资本胃口，但两者也比 Xcimer
              公开给出更明确的场址或融资结构信号。General Fusion 的 SPAC
              路径是最好的警示可比：PIPE、对赌安排、权证和赎回进入结构后，名义估值和真实经济价值会急剧分叉。因此，这组同行只适合作为背景。它说明聚变领军公司可以吸引巨额资本，并在高端拿到很高估值——但前提是市场看到
              Xcimer 尚未披露的证据。
