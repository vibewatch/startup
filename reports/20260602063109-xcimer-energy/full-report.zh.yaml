      - number: '6.3'
        title: 可比聚变客户证明与稳定电力需求信号
        blocks:
          - type: paragraph
            body: >-
              如果 Xcimer 没有自己的公开客户证明，次优证据就是相邻聚变公司已经说服买家签下的东西。这个类比记录现在真实存在，只是规模仍小。Helion 公开宣布 Microsoft 是首个聚变 PPA
              交易对手，计划建设 50 MW 以上电站，后来又把 Orion 场址建设与向 Microsoft 供电绑定。Nucor 在工业具体性上更进一步，宣布为一家钢铁制造设施建设 500 MW 项目，并直接入股
              Helion。CFS 和 Google 给出了超大规模云厂商类比：CFS 称 Google 同意购买 ARC 一半的电量，独立报道把安排定在 200 MW，并指出 Google
              还增加了资本支持。这些交易重要，不是因为它们证明短期会交付电力——它们没有——而是因为它们证明成熟买家愿意在公开价格披露前签长期聚变协议。Focused Energy 提供了有用反差：它与 LLE、Bay
              Area 的公告增强了技术和生态可信度，但仍属于参考证明，而不是客户收入。把这些类比与 McKinsey、EIA、UCS、S&P 放在一起，图景很清楚：买家对稳定清洁电力的需求是真实的，AI
              负荷在快速增长，但公开证明仍集中在少数交易对手身上，而今天没有一个属于 Xcimer。
