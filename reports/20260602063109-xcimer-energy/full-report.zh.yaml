      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              同行证据显示，早期聚变买方不是抽象的「电网」客户，而是可靠性痛点尖锐、预算权集中的具体组织。Helion 披露的 Microsoft 和 Nucor
              协议显示，在公用事业公司把品类常态化之前，超大规模云厂商和重工业就可以先做锚定买方。FIA 和 Future Markets 指向 CFS 与 Google 的直接
              PPA，作为另一条证据：优质清洁稳定电力买方可能在广泛市场成熟前多年就为早期电厂承销。Xcimer 自己点名的用例意味着四类最重要买方：超大规模云厂商和 AI
              园区运营商、公用事业公司和独立发电商、工业脱碳场址，以及水务或海水淡化基础设施发起方。预算归属在这些群体之间差异很大。超大规模云厂商需求通常由能源采购和数据中心基础设施团队驱动；公用事业需求需要开发预算、费率基础逻辑或
              IPP 融资；工业需求落在工厂能源、资本开支和可持续发展负责人手里；海水淡化很可能需要公共基础设施或主权项目融资。同行的采用路径大体相似：公私研发和原型里程碑、选址和许可、锚定购电方或工业伙伴、FOAK
              项目融资，最后走向电网交付和重复部署。这条顺序很重要，因为 Xcimer 有买方故事，却还没有同行已经公布的客户证据点。
