  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pipeline-opacity
    missingEvidence: Named counterparties, meeting stage, and segment split for Xcimer's live commercial pipeline.
    whyItMatters: Without real counterparty names and stages, demand cannot be separated from management aspiration.
    diligencePath: Request CRM export or pipeline summary by segment, stage, expected MW, and named account owner.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: contract-structure
    missingEvidence: Draft contract form showing tariff logic, term length, milestone schedule, performance guarantees, and curtailment or availability terms.
    whyItMatters: Customer quality in infrastructure markets depends as much on contract bankability as on logo value.
    diligencePath: Request a redlined draft PPA, capacity reservation, or development MOU plus internal pricing assumptions.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: buyer-capital-commitment
    missingEvidence: Any deposits, reservation fees, joint-development funding, or strategic customer capital tied to Xcimer plants.
    whyItMatters: Buyer cash commitments would be the strongest available evidence that counterparties are underwriting schedule and technical risk before first power.
    diligencePath: Ask management and finance for signed LOIs, paid reservations, or side letters from strategic customers.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: retention-visibility
    missingEvidence: Observed retention, renewal, NRR, or satisfaction data from an installed Xcimer customer base.
    whyItMatters: Retention is a core customer-quality question, but for a pre-commercial energy startup it cannot be observed until a real installed base exists.
    diligencePath: Treat retention as a future diligence topic and instead request leading indicators such as repeat counterparties, referenceability, and multi-plant options.
    relatedQuestionRefs:
    - QU018
    - QU020
    relatedTableRefs:
    - TU004
