chapter:
  number: 6
  title: Customers
  summary: Xcimer has no publicly disclosed customers, pilots, PPAs, user program, or named power offtake in the fetched record, so this chapter treats customer proof as absent and relies on target-segment statements plus fusion analogs. Official materials point to AI training clusters, desalination, industrial decarbonization, and other firm-power users, while Helion-Microsoft, Nucor-Helion, and Google-CFS show real buyer willingness to sign long-dated fusion deals before price disclosure. The underwriting problem is therefore not lack of theoretical demand but lack of Xcimer-specific counterparties, contract structure, retention data, or pipeline transparency.
sections:
- id: public-proof-state
  title: Public proof state — no disclosed Xcimer customer, only target demand language
  body: 'The clearest customer conclusion is negative but important: the fetched public record does not show any named Xcimer customer, pilot user, utility counterparty, site host, user program, or power-purchase agreement. Xcimer''s own homepage and roadmap are explicit about whom it wants to serve — AI training clusters, desalination, industrial decarbonization, and other firm-power users — but they stop there. TechCrunch''s profile likewise describes a future pilot-plant pathway rather than a live commercial relationship, and the careers page shows that the company is staffing business-development and finance roles before counterparties are public. That means the right analytical split is between demand thesis and customer proof. Demand thesis exists: Xcimer is clearly positioning itself toward large, power-hungry buyers with 24/7 clean-energy needs. Customer proof does not: the strongest public customer fact today is still an absence of disclosed contracts. For a pre-commercial energy
    company that is not surprising, but it matters because it removes the usual diligence anchors of logos, deployment outcomes, references, conversion metrics, and renewal behavior.'
