callouts:
- calloutType: risk
  title: No public commercial proof exists for Xcimer yet
  body: Xcimer's target markets are legible, but the fetched record still contains no named customer, pilot user, PPA, site host, utility partner, or buyer capital commitment. That leaves the company with a credible demand narrative but no public commercial validation.
  claimRefs:
  - CU002
  - CU009
  - CU034
  - CU035
  - CU040
- calloutType: insight
  title: Buyer demand is more believable than Xcimer-specific traction
  body: Helion-Microsoft, Nucor-Helion, and Google-CFS show that sophisticated buyers are already willing to sign long-duration fusion agreements before public price disclosure. That makes Xcimer's customer question one of capture and execution, not of whether firm-power demand exists at all.
  claimRefs:
  - CU010
  - CU013
  - CU014
  - CU016
  - CU039
- calloutType: assumption
  title: Switching cost is prospective, not observed
  body: Any eventual Xcimer customer relationship would likely become sticky because of siting, permitting, interconnection, and project-finance work, but those costs are still hypothetical until a first plant customer exists. Retention analysis today is therefore a diligence placeholder, not a measured KPI.
  claimRefs:
  - CU027
  - CU028
  - CU029
acknowledgedWarnings:
- dimension: figureType
  reason: The planned retention or repeat cohort figure requires time-series retention percentages by customer vintage, but Xcimer discloses no installed-base or renewal dataset. TU004 and TU006 provide the most honest substitute by stating the absence of retention evidence and mapping the procurement path that must exist before a cohort can be observed.
