- id: analogs-and-buyer-demand
  title: Comparable fusion customer proof and firm-power demand signals
  body: 'If Xcimer has no public customer proof of its own, the next-best evidence is what adjacent fusion companies have already persuaded buyers to sign. That analog record is now real, though still small. Helion publicly announced Microsoft as the first fusion PPA counterparty, with a planned 50 MW-plus plant, and later tied its Orion site construction to delivering electricity to Microsoft. Nucor went a step further on industrial specificity, announcing a 500 MW project for a steelmaking facility and a direct equity investment in Helion. CFS and Google provided the hyperscaler analog: CFS said Google agreed to buy half of ARC''s output, while independent coverage pegged the arrangement at 200 MW and noted that Google also increased its capital support. These deals matter less because they prove near-term electricity delivery — they do not — and more because they prove that sophisticated buyers are willing to sign long-dated fusion agreements before public price disclosure. Focused Energy
    provides a useful contrast: its LLE and Bay Area announcements strengthen technical and ecosystem credibility, but they are still reference proof rather than customer revenue. Pair those analogs with McKinsey, EIA, UCS, and S&P, and the pattern becomes clear: buyer demand for firm clean power is real, AI load is growing fast, but public proof remains concentrated in a handful of counterparties and none of them belong to Xcimer today.'
