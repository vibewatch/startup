- id: durability-and-concentration
  title: Retention, switching-cost logic, concentration, and what remains unknowable
  body: 'Retention analysis for Xcimer is necessarily prospective rather than observed. There is no installed base, no renewal cycle, no churn record, and no satisfaction survey in the public record, so the standard SaaS-style durability toolkit simply does not apply yet. The right replacement question is where switching costs would come from if the company ever wins a first plant customer. Those costs would likely be physical and contractual: site-specific interconnection work, permitting, decarbonization-accounting integration, bespoke power-delivery terms, and project-finance documentation. They are real in theory, but they are not yet evidenced. That makes concentration risk more important. In fusion, the first anchor counterparty can dominate the entire commercialization story by validating bankability, setting contract norms, and helping unlock the next round of financing. FIA, F4E, and CRS all reinforce the same point from different angles: commercial fusion remains capital intensive,
    reference cases are few, and scientific plus grid-integration hurdles still matter. So the adverse read on Xcimer is not customer churn; it is that public commercial traction is still opaque even while firm-power demand is becoming easier to articulate. Until Xcimer discloses counterparties, terms, or buyer capital commitments, durability and expansion must be treated as hypotheses rather than proven behaviors.'
