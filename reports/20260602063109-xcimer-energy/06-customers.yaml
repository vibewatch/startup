figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Pre-commercial fusion customer journey from demand recognition to renewal hypothesis. The map shows why Xcimer currently sits before the anchor-counterparty stage in the public record.
  data:
    nodes:
    - id: need
      label: Need identification
      detail: Hyperscalers, industrial operators, and infrastructure sponsors confront rising firm-power needs tied to AI, decarbonization, and reliability.
      tone: neutral
    - id: screen
      label: Technology screening
      detail: Buyer teams compare fusion to renewables, storage, gas, fission, and other firm clean-power options and test whether the science story is becoming an engineering story.
      tone: neutral
    - id: anchor
      label: Anchor offtake or MOU
      detail: A first counterparty agrees to reserve output or co-develop a project before first commercial operation; this is where Helion and CFS analogs already have public proof.
      tone: positive
    - id: site
      label: Site / interconnection / permitting
      detail: Host selection, queue strategy, transmission or behind-the-meter design, and regulatory path make the relationship far stickier than a generic energy purchase.
      tone: warning
    - id: operate
      label: Operations and expansion
      detail: Only after delivered uptime and billing history can renewal, second-plant options, and real switching costs become observable.
      tone: warning
  approximationNotes: This is a stage map, not a quantified conversion funnel. Xcimer has not disclosed movement rates between stages, so the figure shows workflow rather than probabilities.
