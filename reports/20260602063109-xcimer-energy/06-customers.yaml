- id: segmentation-and-procurement
  title: Buyer, user, payer segmentation and the likely procurement path
  body: 'Because Xcimer is not yet selling electrons, segmentation has to start from future procurement mechanics rather than current account lists. Hyperscalers are the cleanest example. The user is the data-center fleet that needs high-availability power, but the economic buyer is usually a centralized energy or procurement team that can underwrite a long-duration PPA or structured offtake. Industrial decarbonization looks different: the operating company and plant energy team are both user and buyer, often with the corporate balance sheet or a special-purpose project vehicle acting as payer. Desalination is structurally harder because public or sovereign infrastructure bodies, utilities, and operators can all sit in different parts of the approval chain. Across segments, the likely Xcimer path is infrastructure-style and slow: identify the segment, survive technical diligence, secure an anchor offtake or development MOU, line up site and interconnection work, navigate permitting, and
    only then move into construction finance and operations. McKinsey''s work on 24/7 clean PPAs is useful here because it makes clear that advanced-energy procurement depends on trading, structuring, legal drafting, and risk management, not just on the existence of a promising machine design.'
