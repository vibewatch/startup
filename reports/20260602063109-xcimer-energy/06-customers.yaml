  title: Customer segmentation table
  columns:
  - segment
  - likely buyer / user / payer
  - use case
  - strategic value
  - public proof state
  - gap
  rows:
  - - Hyperscalers / AI clusters
    - 'Buyer: central energy/procurement; User: data-center operations; Payer: corporate PPA counterparty'
    - 24/7 carbon-free power for high-load compute campuses
    - Largest and fastest-rising firm-power demand signal in current corpus
    - Xcimer names AI training clusters; Helion-Microsoft and Google-CFS provide analog proof
    - No named Xcimer hyperscaler, tariff, site, or contracted MW
  - - Industrial decarbonization
    - 'Buyer/User: plant operator and corporate energy team; Payer: corporate balance sheet or project vehicle'
    - Dedicated plant or behind-the-meter supply for steel, chemicals, or other energy-intensive operations
    - Could support premium willingness to pay where uptime and carbon exposure both matter
    - Xcimer names industrial decarbonization; Nucor-Helion provides the strongest analog
    - No named Xcimer industrial customer, host site, or contract form
  - - Desalination / water infrastructure
    - 'Buyer may be public agency, utility, or concessionaire; User: plant operator; Payer can be sovereign or municipal project structure'
    - Steady power for energy-intensive water treatment and pumping
    - Fits Xcimer's firm-power narrative but with potentially long procurement cycles
    - Xcimer explicitly names desalination
    - No named geography, project archetype, or public buyer disclosed
  - - Utilities / IPPs / plant hosts
    - 'Buyer: utility or infrastructure developer; User: grid or contracted end customer; Payer: regulated utility or project-finance SPV'
    - Grid-connected fusion plant hosting and long-term offtake execution
    - Most legible route to project finance once a first plant is bankable
    - CFS ARC + Dominion / Google context shows how this can look
    - No Xcimer host utility, interconnection queue, or siting partner is public
  - - Research / public-private reference ecosystem
    - 'Buyer: sponsor or institution; User: technical teams; Payer: research budget or milestone program'
    - Experiments and collaborations that improve credibility before real power sales
    - Useful as reference proof but not a substitute for paying energy demand
    - Focused-LLE shows strong technical reference proof in inertial fusion
    - No public Xcimer user program or named commercial reference customer
  notes: Rows distinguish future buyer classes from current proof. Public proof state records what the fetched corpus actually supports as of 2026-06-02 rather than what management may be discussing privately.
