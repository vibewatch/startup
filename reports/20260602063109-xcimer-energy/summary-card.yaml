  topStrengths:
    - >-
      Differentiated KrF excimer and gas-optics architecture targets fewer beamlines and a distinct inertial-fusion path
      versus better-known magnetic-fusion peers.
    - >-
      $100M Series A led by Hedosophia plus support from Breakthrough Energy Ventures and other climate-tech investors
      provides credible early external validation.
    - >-
      Public roadmap is staged and technically specific, with Phoenix, Anvil, Vulcan, and Athena serving as successive
      proof gates rather than a single leap to commercialization.
    - >-
      Target demand from AI training clusters, industrial decarbonization, and desalination aligns with the market need
      for firm carbon-free power if the technology works.
  topRisks:
    - >-
      No public customers, pilots, PPAs, LOIs, or offtake counterparties are disclosed, so commercial validation is
      currently absent.
    - >-
      Integrated system proof is still ahead: public evidence supports subscale hardware and OMEGA validation, not
      engineering breakeven or repetitive plant operation.
    - >-
      Fusion plant capital intensity is likely far beyond the currently disclosed financing, implying substantial future
      dilution and financing risk.
    - Public valuation and cap-table opacity prevent price-sensitive underwriting today.
    - >-
      Tritium, target manufacturing, chamber operability, siting, and interconnection remain major plant-scale execution
      risks.
  unresolvedGaps:
    - >-
      Series A post-money valuation, ownership sold, liquidation preferences, option pool, and board-control terms
      remain undisclosed.
    - Current cash, monthly burn, runway, and budget by milestone from Phoenix through Athena are not public.
    - >-
      No public evidence shows customer discussions, MOUs, deposits, contracted megawatts, or a named site host and
      utility counterparty.
    - >-
      Public data does not yet show integrated target-shooting results, repetitive-operations performance,
      target-factory throughput, or per-target economics.
