chapter:
  number: 1
  title: "Company Overview"
  summary: "Newcleo completed its public listing on Nasdaq in September 2026 via a business combination with NewHold Investment Corp III, securing $247 million in gross proceeds to fund its lead-cooled fast reactors and closed mixed-oxide fuel cycle platform across Europe and the United States."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Structure, and Founding"
    body: "Newcleo (incorporated as newcleo plc) is an advanced modular reactor (AMR) and nuclear fuel manufacturing company founded in 2021 by physicist-entrepreneur Stefano Buono, Chief Scientific Officer Luciano Cinotti, and co-founders. The company develops Generation-IV Lead-Cooled Fast Reactors (LFRs) paired with mixed-oxide (MOX) fuel fabrication facilities designed to reprocess and recycle spent nuclear waste, establishing a closed nuclear fuel cycle. While originally founded in Europe with headquarters in Paris, France and operational hubs across the United Kingdom and Italy, Newcleo has expanded into the United States to accelerate commercial licensing and industrial partnerships. The operational platform integrates over 900 highly skilled personnel across Europe and the United States spanning nuclear engineering, supply-chain vertical integration, and demonstration facility development. Newcleo's core commercial model combines direct nuclear power and industrial heat generation with dedicated closed-loop fuel cycle supply, addressing both baseload clean energy demand and accumulated spent nuclear fuel liabilities."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership"
    title: "Executive Leadership, Governance Transition, and Public Board"
    body: "Following the closing of its business combination with NewHold Investment Corp III in September 2026, Newcleo transitioned its corporate governance structure from a private European entity into a U.S. public company board chaired by nuclear utility executive Jeffrey Lyash. Lyash brings more than four decades of utility operational and executive experience as the former President and Chief Executive Officer of the Tennessee Valley Authority (TVA) and Ontario Power Generation (OPG). Co-founder Stefano Buono continues as Chief Executive Officer and executive director, while former Chairman Andrea Ruben Levi transitioned to Chair of the Compensation Committee. The unified management team, including Chief Scientific Officer Luciano Cinotti and Group Chief Financial Officer Jon Stranske, remains in place with existing private shareholders rolling over 100% of their equity into the public vehicle. The public board also comprises non-executive directors Elisabeth Rizzotti, Raffaele Petrone, Manfredi Lefebvre D'Ovidio, Anne-Francois de Bourdoncle de Saint Salvy, Heinz Maeusli, and Suzy Taherian, balancing technical oversight with institutional capital markets governance."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO007"
      - "CO008"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization, Nasdaq Public Listing, and Stakeholder Profile"
    body: "Newcleo's capitalization profile reached a transformative inflection point on September 22, 2026, when its ordinary shares and warrants commenced trading on the Nasdaq Global Select Market under the ticker symbols NWCL and NWCLW. The business combination with NewHold Investment Corp III provided approximately $247 million in gross proceeds, comprising an oversubscribed $216 million private investment in public equity (PIPE) and $31 million released from NewHold's trust account, valuing Newcleo at a pre-money equity value of approximately $2.4 billion. In addition, Newcleo raised close to $20 million in supplemental private funding since the transaction announcement, bringing cumulative lifetime funding to more than $1 billion. Up to an additional $75 million in capital may become available through an existing forward purchase agreement. Key institutional stakeholders include lead financial placement agent Goldman Sachs, capital markets advisors Guggenheim Securities and BTIG, strategic industrial partners such as SHINE Technologies and Oklo Inc., and historical private venture investors who rolled over their entire equity stake."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-milestones"
    title: "Operational Scale, Regulatory Progression, and Commercial Milestones"
    body: "Newcleo's operational expansion centers on advancing its technical demonstrators, regulatory licensing, and industrial fuel partnerships across Europe and North America. The company is completing construction and preparing operations for its 10 MWth non-nuclear lead-cooled testing demonstrator in Italy, providing crucial engineering and thermal-hydraulic validation ahead of nuclear licensing. In the United States, Newcleo formally initiated pre-application engagement with the U.S. Nuclear Regulatory Commission (NRC) in February 2026 covering both its Lead-Cooled Fast Reactor design and a planned domestic MOX fuel fabrication facility developed in partnership with Oklo Inc. In parallel, Newcleo entered into a strategic collaboration with SHINE Technologies in June 2026 to evaluate spent nuclear fuel recycling, linking SHINE's extraction capabilities with Newcleo's MOX manufacturing to supply advanced fast reactors. These milestones demonstrate accelerating transatlantic regulatory and technical progress, though binding commercial offtake contracts and operational reactor deployments remain future milestones."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO014"
      - "CO016"
    figureRefs:
      - "FO001"
