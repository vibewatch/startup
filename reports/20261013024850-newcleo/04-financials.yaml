callouts:
  - calloutType: risk
    title: Extensive Forward Capital Dependency
    body: While the September 2026 Nasdaq public listing and oversubscribed PIPE infused $247 million in gross proceeds, Newcleo's projected capital expenditures for its planned MOX fuel fabrication plant alone approach $2.4 billion, ensuring that the company remains highly dependent on external debt and equity financing throughout the pre-commercial decade.
    claimRefs:
      - CI007
      - CI010
      - CI011
      - CI013
  - calloutType: insight
    title: Revenue Composition Dominated by Acquired Supply-Chain Entities
    body: Reported 2024 revenue and financial income exceeding $80 million reflects historical operating turnover from acquired nuclear pump and component suppliers rather than commercial reactor or fuel sales, underscoring the distinction between current supply-chain revenue and future proprietary reactor economics.
    claimRefs:
      - CI001
      - CI004
      - CI005
