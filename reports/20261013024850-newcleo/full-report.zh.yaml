              2026 年 9 月 21 日，Newcleo 完成与 NewHold Investment Corp III 的业务合并，筹得约 $247M 募资总额，并于 2026 年 9 月 22 日以 NWCL 和
              NWCLW 为股票代码在纳斯达克全球精选市场开始公开交易。交易对应约 $2.4B 投前股权估值， 资金来自超额认购的 $216M 上市后私募投资（PIPE）以及从 SPAC 信托账户释放的
