            title: 资本密集型示范必须先于能源承购
            body: 200 MWe LFR-AS-200 的商业采用取决于意大利 10 MWth 非核前置设施成功运行，以及在商业承购转化加速前取得法国和 美国监管机构的许可里程碑。
            calloutType: insight
