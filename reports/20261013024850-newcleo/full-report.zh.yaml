chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营结构与创立
        blocks:
          - type: paragraph
            body: >-
              Newcleo（注册实体为 newcleo plc）是一家先进模块化反应堆（AMR）和核燃料制造公司，由物理学家兼企业家 Stefano Buono、首席科学官 Luciano Cinotti 及其他联合创始人于
              2021 年创立。公司开发第四代铅冷快堆（LFR），并配套 可对乏核废料进行再处理和回收的混合氧化物（MOX）燃料制造设施，以建立闭式核燃料循环。公司最初在欧洲创立，
              总部位于法国巴黎，并在英国和意大利设有运营中心；如今已扩展至美国，以加快商业许可和工业合作。运营平台在 欧洲和美国汇集了 900 多名高技能员工，覆盖核工程、供应链纵向整合和示范设施开发。Newcleo
              的核心商业模式 将直接核电和工业供热与专门的闭环燃料循环供应结合起来，同时满足基荷清洁能源需求并处理累积的乏核燃料负担。
