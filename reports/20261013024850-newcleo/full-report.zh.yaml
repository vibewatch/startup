      - number: '3.3'
        title: 转换成本、渠道进入与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              工业场址或公用事业一旦选定反应堆架构，核能发电的客户转换成本就极高。场址评估、抗震认证、电网并网和多年的 监管许可，会形成持续 40 至 60 年运营期的深度锁定。为取得早期分销渠道并抢在竞争对手 SMR
              架构之前，Newcleo 与有国家支持的核能实体和工业龙头推进联合开发协议，最突出的是与斯洛伐克退役公司 JAVYS 成立合资企业，计划在 Bohunice 部署最多四座 200 MW
              反应堆。为守住供应链护城河，Newcleo 收购了 Fucina、Rutschi 和 S.R.S. 等专业 工程制造子公司，将关键泵、阀门和反应堆部件制造纳入内部。这种纵向整合降低了对外部核能供应链的依赖，而后者
              正成为西方先进反应堆部署的瓶颈。
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
