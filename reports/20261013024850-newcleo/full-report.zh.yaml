  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示从 2021 年成立到 2026 年 Nasdaq 上市期间，确定 Newcleo 发展轨迹的公司、融资、合作伙伴和监管里程碑。
    data:
      items:
        - label: 2021 年 9 月：公司成立
          detail: Stefano Buono 与联合创始人成立 Newcleo，开发铅冷快堆和闭式 MOX 燃料循环。
          tone: positive
        - label: 2022 年 6 月：Orano 可行性研究
          detail: 与 Orano 签约，开展建设商业 MOX 核燃料制造厂的工业可行性研究。
          tone: neutral
        - label: 2025 年 10 月：Oklo 战略合作
          detail: 与 Oklo Inc. 建立战略合作，在美国共同开发先进核燃料制造基础设施。
          tone: positive
        - label: 2026 年 2 月：NRC 预申请通知
          detail: 向美国核管理委员会提交意向书，启动预申请许可沟通。
          tone: positive
        - label: 2026 年 5 月：NewHold SPAC 协议
          detail: 宣布与 NewHold Investment Corp III 签订最终业务合并协议，并在 Nasdaq 上市。
          tone: positive
        - label: 2026 年 6 月：SHINE 回收合作
          detail: 宣布与 SHINE Technologies 合作，推进乏核燃料回收和 MOX 原料供应。
          tone: positive
        - label: 2026 年 9 月：股东批准
          detail: NewHold 股东于 2026 年 9 月 17 日特别股东大会批准业务合并。
          tone: positive
        - label: 2026 年 9 月：Nasdaq 开始交易
          detail: 以 $247M 毛募资完成业务合并，并于 2026 年 9 月 22 日以 NWCL 代码开始在 Nasdaq 交易。
          tone: positive
    approximationNotes: 里程碑日期来自经审计的交易报表和监管往来。
