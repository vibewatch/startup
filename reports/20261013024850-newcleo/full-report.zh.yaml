        title: 收入来源、商业变现与 GTM 框架
        blocks:
          - type: paragraph
            body: >-
              Newcleo 是一家商业化前先进核能技术开发商，规划中的商业模式包括三条主要变现路径：自有铅冷快堆（LFR）资本品销售、 长期反应堆运营管理合同，以及混合氧化物（MOX）核燃料制造和回收服务。尽管 30 MWe
              和 200 MWe 反应堆的完整 商业部署安排在 2031 至 2032 年，公司目前通过收购的供应链子公司创造运营收入。具体而言，Newcleo 2024 年报告 收入、其他收益和财务收益合计超过
              $80M，主要来自核泵专业企业 Rütschi Group 等运营工业业务。然而，公司尚未 建立具有约束力的商业承购合同，也未公布反应堆基荷电力或工业热能的实际单价，因此长期收入质量仍取决于未来
              公用事业和工业客户的转化。
