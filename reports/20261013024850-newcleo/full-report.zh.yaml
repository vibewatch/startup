      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 论点失效触发条件
            body: >-
              如果 Newcleo 无法证明许可基线获得资金支持并被监管机构接受；材料认证错过决策关键阈值且没有可信恢复路径；燃料或
              单一来源部件承诺在最终投资决策临近时仍不具约束力；或无法以符合投资逻辑的条款获得额外资本，则投资论点失效。
            calloutType: risk
