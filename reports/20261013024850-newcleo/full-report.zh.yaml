            body: >-
              2026 年 9 月 22 日，Newcleo 普通股和认股权证以 NWCL 和 NWCLW 为股票代码在纳斯达克全球精选市场开始交易，资本 结构迎来转折。与 NewHold Investment Corp
              III 的业务合并带来约 $247M 募资总额，包括超额认购的 $216M 上市后私募 投资（PIPE）和从 NewHold 信托账户释放的 $31M，对应 Newcleo 约 $2.4B
              投前股权估值。此外，自交易公告以来， Newcleo 又筹得接近 $20M 补充私募资金，使累计融资额超过 $1B。现有远期购买协议还可能带来最多 $75M 额外资本。 主要机构利益相关方包括首席财务配售代理
              Goldman Sachs、资本市场顾问 Guggenheim Securities 和 BTIG、SHINE Technologies 与 Oklo Inc.
