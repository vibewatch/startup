  - id: FE001
    title: Newcleo 先进反应堆与燃料循环运营栈
    type: stack
    summary: 覆盖燃料循环输入、堆芯物理、冷却剂热工水力、专用安全壳、能量转换和工业热电联产的多层技术栈。
    approximationNotes: 架构反映工程样机和计划中的示范装置规格；商业反应堆许可仍待取得。
    data:
      layers:
        - label: 第 1 层：燃料原料与回收
          detail: 从现有库存中提取乏核燃料，并利用再处理铀和钚制造 MOX 燃料。
        - label: 第 2 层：堆芯物理与中子学
          detail: 不依靠慢化水即可实现锕系元素多次回收的快中子谱反应堆。
        - label: 第 3 层：一回路冷却剂与热工水力
          detail: 液态铅冷却剂在大气压下运行，沸点高达 1,749°C，从而消除冷却剂沸腾损失风险。
        - label: 第 4 层：材料与安全壳工程
          detail: 先进耐腐蚀冶金、手套箱安全壳和专用阀门在都灵专用材料实验室中接受测试。
        - label: 第 5 层：能量转换与二回路
          detail: 与 NextChem（Next-N）成立合资企业，设计用于模块化电厂配套系统的蒸汽和能量转换岛。
        - label: 第 6 层：工业热与电网接口
          detail: 通过热电联产接口，向重工业提供有竞争力的高温工业热和基荷电力。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初次工业接触，到长达数十年的反应堆承购和闭式燃料回收的多阶段客户采纳路径。
    approximationNotes: 根据已披露的客户协议，展示分为五个不同阶段的商业化框架。
    claimRefs:
      - CU010
      - CU011
      - CU012
    data:
      items:
        - label: 第 1 阶段：战略股权与研究联盟
          actors: Industrial emitters (Danieli, Cementir) & institutional research bodies
          activities: >-
            Direct equity investment in funding rounds, joint feasibility scoping, and industrial taskforce
            participation.
          touchpoints:
            - 管理层简报与投资者联合
            - 联合技术委员会评估
          status: Active (2021-2026)
        - label: 第 2 阶段：非核原型与技术验证
          actors: Prospective plant operators, engineering partners, and safety regulators
          activities: >-
            Component qualification at the Brasimone PRECURSOR 10 MWth facility in Italy to derisk thermal-hydraulic
            systems.
          touchpoints:
            - ENEA Brasimone 测试平台接入
            - 与 ASN 及国际监管机构开展预许可研讨会
          status: Underway (2025-2027)
        - label: 第 3 阶段：主场址选择与选址协议
          actors: Host utilities (JAVYS) and regional industrial clusters (Chinon, France)
          activities: Pre-licensing filings, environmental impact assessments, and preliminary grid connection studies.
          touchpoints:
            - 市政分区和土地收购协议
            - 电网并网可行性申报
          status: Initiated (2026-2028)
        - label: 第 4 阶段：初步许可与建设许可
          actors: National nuclear safety authorities (ASN, U.S. NRC) and engineering contractors
          activities: Formal design certification submissions, safety case evaluations, and major construction permit filings.
          touchpoints:
            - 正式安全评估报告
            - 供应链制造产能分配
          status: Planned (2028-2032)
        - label: 第 5 阶段：商业部署与承购执行
          actors: Heavy industry offtakers and regional electrical power grids
          activities: >-
            Long-term power and process heat purchase agreements (PPAs/HPAs), turnkey plant construction, and
            commissioning.
          touchpoints:
            - 有约束力的 20 至 30 年照付不议能源合同
            - 设施调试和商业运营移交
          status: Targeted (2033-2037)
        - label: 第 6 阶段：闭式燃料循环与扩张
          actors: Fuel cycle partners (SHINE, Orano) and multi-unit fleet operators
          activities: >-
            Sustained MOX fuel delivery, multi-unit site expansion, and multi-recycling of discharged spent nuclear
            fuel.
          touchpoints:
            - 长期 MOX 燃料制造协议
            - 乏燃料收集与回收合同
          status: Targeted post-2035
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险的定性排序强调审批、材料、供应、需求和融资之间的耦合依赖，而不是无依据的数值概率。
