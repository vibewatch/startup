      - number: '5.2'
        title: 闭式核燃料循环与混合氧化物燃料制造
        blocks:
          - type: paragraph
            body: >-
              Newcleo 战略的核心差异化，在于将快中子反应堆堆芯与专用混合氧化物（MOX）燃料制造结合起来。              传统热中子反应堆只能提取矿产铀中不到百分之一
              的能量潜力，并产生大量长寿命超铀废料。在无慢化快中子下运行，Newcleo 反应堆可以 增殖并消耗从现有乏燃料库存中提取的再生钚和次锕系元素。为支持这一燃料战略，Newcleo 与 SHINE
              Technologies 达成合作协议，评估国内库存中再处理铀和钚的供应链。通过将回收的裂变材料转化为 MOX 燃料组件，Newcleo 希望 获得反应堆燃料独立性，同时大幅减少放射性废料体积及其长期放射毒性。
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
