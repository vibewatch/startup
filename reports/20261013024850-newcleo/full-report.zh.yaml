        - id: impact
          label: 影响
          detail: 对许可、商业化、融资或投资价值的潜在影响。
        - id: mitigation
          label: 缓解成熟度
          detail: 指定证据所披露缓解措施的成熟度。
        - id: residual
          label: 剩余严重程度
          detail: 当前披露的缓解措施实施后仍存在的风险敞口。
      rows:
        - label: 燃料与反应堆许可
          note: 初步燃料设施进展不等于建设或运行批准。
          values:
            - value: High
            - value: Critical
            - value: Early-to-intermediate
            - value: Critical
        - label: 资本充足性
          note: 毛交易募资额与已披露的未来融资需求及持续经营疑虑并存。
          values:
            - value: High
            - value: Critical
            - value: Partial
