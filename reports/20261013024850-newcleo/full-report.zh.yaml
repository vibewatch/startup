        blocks:
          - type: paragraph
            body: >-
              为在商用核许可前降低铅冷快堆工程风险，Newcleo 在欧洲大举投资实体测试基础设施。在意大利 ENEA Brasimone Research Centre，公司正在建设 Precursor，这是一座 10 MW
              热功率非核反应堆仿真装置，具备约 3 MW 发电转换能力， 计划于 2026 年底完工。Precursor 采用电加热，在没有辐射危害的情况下验证熔融铅中的一回路热工水力、自然循环
              和部件行为。与此同时，Newcleo 在都灵 Environment Park 建立专门的材料测试实验室，在真实运行温度和腐蚀性铅 化学环境下评估钢合金，从而缩短认证周期并将核心核冶金能力保留在内部。
