            body: 尽管 Newcleo 已与 JAVYS 和 SHINE Technologies 建立工业合作，并瞄准数据中心、钢铁等高需求行业，公开商业进展 仍以可行性评估和不具约束力的备忘录为主，而不是长期签约购电协议。
            calloutType: risk
            claimRefs:
