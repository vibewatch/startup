              商业运营去风险。核心投资判断阻碍有两点：第一，公司没有公开披露现金消耗速度、合并资产负债表现金储备和项目 债务结构；第二，缺少具有约束力的长期购电协议或燃料采购承诺。在看到具体场址承购条款和经验证的工程成本估算
