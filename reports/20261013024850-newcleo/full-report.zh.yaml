      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              先进模块化核反应堆的采用明显不同于标准企业能源采购，因为它涉及漫长的资本规划周期、场址许可障碍和专业监管。 Newcleo
              面向重制造、超大规模数字基础设施、主权公用事业和核废料管理四类买方。在重工业领域，目标买方是企业 能源采购联盟和工厂运营负责人，他们希望隔离设施对波动化石燃料市场和不断上升碳罚款的暴露。在数字基础设施
              领域，超大规模云服务商和 AI 数据中心运营商是日益迫切的买方，原因是计算集群电力需求激增，而长期存在的电网 并网排队会将设施投运推迟五至七年。在主权公用事业电力领域，斯洛伐克公用事业公司 JAVYS
              等国有实体评估多机组 部署，以履行国家基荷义务，并通过二次回路提供区域供热。最后，核废料管理机构和 Newcleo 的合作伙伴 SHINE Technologies 等商业运营商，是希望将商业乏燃料库存转化为
              MOX 燃料原料的战略交易对手。尽管这些领域都有积极 讨论，商业证据仍以可行性评估和初步合作为主，而非具有约束力的长期购电协议。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
