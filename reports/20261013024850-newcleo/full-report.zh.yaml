      - number: '6.4'
        title: 客户旅程、承购持久性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              第四代先进模块化反应堆的客户采用旅程超过十年，先从战略股权联合和技术可行性研究开始，再经历非核验证、场址许可 和商业投运。核能电站建成后，客户留存和生命周期价值在结构上都很高，原因是资产运营寿命达 40 至 60
              年，并配套 专用 MOX 燃料供应周期。然而，Newcleo 在建设前面临严重交易对手摩擦：工业承购方在承诺首台套反应堆技术时，
              要承担较高资产负债表风险和监管不确定性。法国、意大利、斯洛伐克、英国和美国的多司法辖区许可，带来显著的 进度集中风险；场址许可一旦延误，就会直接推迟整个合作方群体的商业采用。
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 探索性工业协议与商业收入可见度
            body: 尽管 Newcleo 成功吸引 Danieli 和 Cementir 等重工业支持，这些安排目前仍是战略股权投资和初步技术研究，而非 具有约束力、可融资的能源承购协议。
            calloutType: risk
            claimRefs:
              - CU002
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 残余风险排序
        blocks:
          - type: paragraph
            body: >-
              最大的残余暴露是监管完成度、资本充足性和技术认证，而不是某一个孤立的失败模式。法国对拟议 MOX 设施给出的正面 安全意见有意义，但仍属初步意见；Newcleo
              自身材料也指出，许可、建设、成本、供应链和融资仍存在不确定性。 这些风险会相互放大：材料认证延迟可能推迟许可证据、客户承诺，并增加所需外部资本。因此，热力图将燃料和反应堆
              批准、融资连续性及铅腐蚀认证列为高影响事项。评级是基于所引披露作出的分析判断，并非测量得到的事故频率； 风险池没有可用于计算概率的精算分母。
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: 监管与法律路径仍分多个阶段
        blocks:
          - type: paragraph
            body: >-
              据独立报道，法国监管机构认为 MOX 安全方案在当前阶段令人满意，但明确将这一意见与建设许可或运营批准区分开来。
              公司也在推进与美国和法国监管机构的沟通，并未报告已完成的反应堆许可。除核许可外，发行人披露还指出出口管制、
              放射性材料运输和处置、环境与安全合规，以及核责任保险覆盖可能存在缺口。核心尽调测试在文件上展开：取得监管机构
              按司法辖区划分的批准图、关键路径日期、保障计划和责任保险时间表。若无法证明燃料和反应堆授权路径既有资金支持 又获得监管机构认可，整合商业化论点就会失效。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
      - number: '7.3'
        title: 材料认证与规模化仍未解决
        blocks:
          - type: paragraph
            body: >-
              Newcleo 的技术演示将铅对钢材的腐蚀列为重大挑战，并称高温运行仍是持续挑战；认证和工业化工作贯穿分阶段计划。
              公司投资者演示还称，这种配置和规模的铅冷快堆几乎没有商用运行经验，首台套专用部件依赖有限供应商基础。测试 设施、氧控制工作和非核示范堆都是具体缓解措施，但不能替代辐照材料认证或商业可靠性证据。投资监控应要求提供
              测试小时数、腐蚀速率、部件寿命、供应商良率、进度和成本偏差数据，并与事先约定的阈值比较。
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR002
