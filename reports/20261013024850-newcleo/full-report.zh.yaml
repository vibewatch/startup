            title: 首台套铅冷却部署风险
            body: 除军事研究原型外，尚无商用铅冷快堆运行，这使 Newcleo 相比传统轻水替代方案面临首台套工程、材料腐蚀和监管许可 方面的逆风。
            calloutType: risk
            claimRefs:
