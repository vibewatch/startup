      - number: '1.2'
        title: 高管团队、治理转型与上市公司董事会
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月完成与 NewHold Investment Corp III 的业务合并后，Newcleo 将公司治理从欧洲私营实体转为由核电公用事业 高管 Jeffrey Lyash
              主持的美国上市公司董事会。Lyash 曾任 Tennessee Valley Authority（TVA）和 Ontario Power
              Generation（OPG）总裁兼首席执行官，拥有逾四十年的公用事业运营和管理经验。联合创始人 Stefano Buono 继续担任 首席执行官兼执行董事，前董事长 Andrea Ruben Levi
              则转任薪酬委员会主席。统一后的管理团队仍保持不变，包括 首席科学官 Luciano Cinotti 和集团首席财务官 Jon Stranske；原私有股东将其 100% 股权滚存至上市主体。上市公司
              董事会还包括非执行董事 Elisabeth Rizzotti、Raffaele Petrone、Manfredi Lefebvre D'Ovidio、Anne-Francois de Bourdoncle de
              Saint Salvy、Heinz Maeusli 和 Suzy Taherian，在技术监督与机构资本市场治理之间取得平衡。
