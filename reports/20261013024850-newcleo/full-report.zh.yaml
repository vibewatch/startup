  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Newcleo 位于先进核反应堆创新、工业流程脱碳和闭环核燃料循环管理的交汇处。公司将主要商业可寻址市场定义为面向
              高耗能行业的高温工业热能和专用基荷电力，并明确区别于仅为并网公用事业发电设计的传统轻水小型模块化反应堆 （SMR）。目标工业领域包括化工、炼钢、水泥、陶瓷、玻璃制造和超大规模数据中心基础设施；这些场景需要持续的
              高温蒸汽和稳定电力容量，间歇性可再生能源无法单独提供。可寻址支出边界包括热电联产设备资本开支、现场反应堆 运维，以及长期 MOX 燃料供应合同。相反，Newcleo
              的市场范围不包括轻型住宅零售配电、分布式屋顶光伏，以及 市政公用事业合作之外的低温区域供暖。目标行业的现状替代方案主要是未经减排处理的化石天然气和煤炭燃烧、配合
              碳抵消的传统电网电力，以及仍缺乏经济竞争力的早期绿氢技术。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、工业 SAM 与受约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Newcleo 的可寻址市场需要多个分析视角，不能只依赖宽泛、未设约束的总可寻址市场（TAM）数字。从宏观上看，
              随着主要工业化经济体立法推动净零目标并淘汰老旧化石电站，清洁稳定基荷电力和工业脱碳的全球市场每年超过 $350B。在这一更大机会中，欧洲和北美高温工业热电联产的可服务可寻址市场（SAM）约为
              $85B，反映了运行温度高于 400°C、在技术上适配 Newcleo 铅冷快堆架构的工业热负荷。从可服务可获得市场（SOM）看，Newcleo 的机会
              受到许可周期、示范项目里程碑和资本可得性的现实约束。公司管线以旗舰 LFR-AS-200 商业设计为核心——这是一座 200 MWe（480 MWth）反应堆，计划于 2034 年左右实现商业供应；此前计划于
              2032 年在美国部署首台同类装置 （FOAK）。尽管商用反应堆收入仍是未来里程碑，Newcleo 已通过有针对性的供应链收购建立运营收入基础，2024 年 创造 $80M 收入及其他收益。继 2026 年 9
              月纳斯达克业务合并筹得约 $247M 募资总额后，Newcleo 累计融资已超过 $1B，用于支撑技术开发路径。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
