        - label: 资本形成（$1B+）
          detail: NewHold SPAC 合并募集 $247 million 毛募资后，累计融资超过 $1 billion。
        - label: SPAC 交易（$2.4B）
          detail: 合并确立 $2.4 billion 的交易前股权估值，其中包括 $216 million PIPE 和 $31 million 信托资金。
        - label: 公开市场漂移（$2.25B）
          detail: 上市后股价在 Nasdaq（NWCL）降至 $7.37，市值压缩至 $2.25 billion，且同比增长为负。
        - label: 示范装置资本开支与烧钱
