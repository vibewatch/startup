  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与反应堆类型
        blocks:
          - type: paragraph
            body: >-
              先进核能领域正分为三类架构：演进型轻水小型模块化反应堆、先进钠冷快堆，以及包括铅冷和熔盐设计在内的高温 替代冷却剂系统。Newcleo
              明确定位于第四代先进模块化反应堆，采用液态铅冷却剂和源自再处理核废料的混合氧化物 （MOX）燃料。快堆领域的直接同行包括 Oklo 和 TerraPower；两者都使用快中子谱，但依靠液态钠或金属燃料，而非
              液态铅。Westinghouse、EDF 等传统核能供应商，以及 NuScale Power 和 Rolls-Royce SMR 等专业 SMR 厂商主导轻水
              领域，监管新颖性较低，但仍受标准浓缩铀燃料循环和累积放射性废料负担约束。替代方案还包括现有电网电力、公用事业 规模电池储能和工业燃气热电联产；它们都受益于成熟许可路径和即时商业可用性。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: 竞争对手画像与差异化持久性
        blocks:
          - type: paragraph
            body: >-
              Newcleo 的竞争差异化建立在一体化核废料回收模式和被动安全物理机制上。公司在常压下使用液态铅，无需巨型加压安全 壳结构，也降低了钠冷同行面临的剧烈化学反应风险。此外，Newcleo
              的闭式燃料循环战略将国内乏核燃料库存转化为 可用 MOX 燃料，使潜在客户免受原铀开采和浓缩供应链瓶颈影响。在 OECD Nuclear Energy Agency 对许可、燃料、
              融资、供应链、选址和参与度六个成熟度维度进行的独立评估中，Newcleo 在欧洲快堆中排名第一，在欧洲 SMR 总体 中排名第二。然而，NuScale 等同行已获得美国核管理委员会标准设计批准，Oklo
              正在爱达荷州申请场址许可，而 Newcleo 仍处于法国 ASNR 和美国 NRC 申请前审查的早期监管阶段。
