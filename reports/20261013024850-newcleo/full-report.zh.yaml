              - CR015
      - number: '7.4'
        title: 燃料、交易对手、需求与资本构成一条依赖链
        blocks:
          - type: paragraph
            body: >-
              SHINE 协议证明存在燃料循环合作，但其披露范围是评估材料供应、回收和联合融资机会，并非具有约束力的商业原料承诺。 Newcleo 自己 5 月的演示材料同样称，公司尚未建成 LFR 或 MOX
              工厂，也未签署具有约束力的客户运营合同，并警告 不具约束力的交易对手可能退出。9 月交易材料报告 $247M 募资总额和可能额外获得的 $75M，但风险披露仍显示未来需要
              融资。因此，募资总额不应视为可用现金续航。否决条件包括：错过有资金支持的许可基线；无法获得承诺的燃料投入或 合格供应商；未能将需求转化为具有约束力的合同；或融资计划依赖不可获得或会造成重大稀释的资本。
            claimRefs:
