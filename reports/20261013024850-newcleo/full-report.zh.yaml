      - number: '3.4'
        title: 被替代风险、商品化与战略不利因素
        blocks:
          - type: paragraph
            body: >-
              尽管 Newcleo 凭借显著技术差异化和 2026 年 9 月纳斯达克上市获得公开资本渠道，上市后仍面临明显逆风。首要风险 是技术尚未验证：全球尚无商用铅冷快堆投入运行，因此在真实公用事业
              条件下的腐蚀速率、热工水力和被动余热排出仍面临首台套执行障碍。如果轻水 SMR 厂商在 Newcleo 目标 2032 年商业化
              前实现批量生产并压低平准化成本，工业承购方可能选择风险更低的轻水方案，尽管其废料特性较差。此外，法国安全 主管部门 ASNR 或美国 NRC
              的任何许可延误，都可能压缩现金续航，迫使公司进行稀释性融资或推迟关键燃料循环示范设施。
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 燃料循环整合是核心竞争切口
            body: 轻水和钠冷 SMR 开发商优先追求单纯发电或快速模块化部署，而 Newcleo 通过自有 MOX 燃料循环和铅冷却物理机制， 处理乏核燃料处置负担，以此形成差异化。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
