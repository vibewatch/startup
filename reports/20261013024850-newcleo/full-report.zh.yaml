  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化铅冷快堆架构
        blocks:
          - type: paragraph
            body: >-
              Newcleo 将其技术平台定位为一体化方案，服务于清洁基荷电力、高温工业热能和核废料减量。不同于需要高压安全壳的 传统轻水堆配置，Newcleo 设计采用熔融铅冷却的小型模块化反应堆。液态铅沸点高达
              1,749°C，几乎消除了冷却剂 沸腾风险，并允许在常压下运行。商业产品组合以 LFR-AS-30 为核心，这是一座用于分布式热电联产的 30 MWe 模块化 反应堆，之后还有面向公用事业和重工业集群的 200
              MWe 放大机组。借助纳斯达克业务合并的募资总额，Newcleo 正将 基本设计工程推进到与欧美核安全主管部门开展正式许可沟通的阶段。
