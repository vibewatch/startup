      - number: '2.4'
        title: 增长催化剂、资本密集度与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              Newcleo 的商业采用路径由强劲的长期趋势推动，但也受到显著结构性约束。需求侧的主要催化剂包括欧洲的地缘能源
              安全诉求、企业脱碳承诺，以及人工智能工作负载带来的指数级电力需求，这些因素都推动对稳定无碳能源的需求。 公司的铅冷快堆架构在常压下运行并采用被动安全机制，因而无需轻水堆常见的巨大高压安全壳和复杂应急注入泵，
              形成了明显的竞争与经济优势。此外，Newcleo 纵向整合 MOX 燃料制造，通过回收再处理核废料，使未来反应堆运营商 免受浓缩铀商品周期波动影响。然而，商业化仍受极高资本密集度、漫长监管许可周期和 FOAK
              执行风险限制。与美国 核管理委员会（NRC）及法国核安全主管部门的许可沟通需要多年，且必须先于场址建设。尽管 Newcleo 以 NWCL 为
              股票代码登陆纳斯达克、建立了公开资本基础，工业买方在承诺长期反应堆承购的绑定资本前，仍会等待其意大利 Brasimone 10 MWth 非核示范堆给出运营证明。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
