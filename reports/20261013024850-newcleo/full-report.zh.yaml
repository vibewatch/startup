              Newcleo 将商业客户分为高耗能工业制造、区域公用事业运营商和数据中心基础设施，这些客户都需要稳定的高温热能 以及持续电力。重金属冶炼行业，包括 Danieli 等电弧炉炼钢商，以及 Cementir
