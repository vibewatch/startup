      - number: '1.2'
        title: Executive Leadership, Governance Transition, and Public Board
        blocks:
          - type: paragraph
            body: >-
              Following the closing of its business combination with NewHold Investment Corp III in September 2026,
              Newcleo transitioned its corporate governance structure from a private European entity into a U.S. public
              company board chaired by nuclear utility executive Jeffrey Lyash. Lyash brings more than four decades of
              utility operational and executive experience as the former President and Chief Executive Officer of the
              Tennessee Valley Authority (TVA) and Ontario Power Generation (OPG). Co-founder Stefano Buono continues as
              Chief Executive Officer and executive director, while former Chairman Andrea Ruben Levi transitioned to
              Chair of the Compensation Committee. The unified management team, including Chief Scientific Officer
              Luciano Cinotti and Group Chief Financial Officer Jon Stranske, remains in place with existing private
              shareholders rolling over 100% of their equity into the public vehicle. The public board also comprises
              non-executive directors Elisabeth Rizzotti, Raffaele Petrone, Manfredi Lefebvre D'Ovidio, Anne-Francois de
              Bourdoncle de Saint Salvy, Heinz Maeusli, and Suzy Taherian, balancing technical oversight with
              institutional capital markets governance.
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO008
              - CO015
