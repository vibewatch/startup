  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Lead-Cooled Fast Reactor Architecture
        blocks:
          - type: paragraph
            body: >-
              Newcleo positions its technology platform as an integrated solution addressing clean baseload power,
              high-temperature industrial heat, and nuclear waste reduction. Rather than relying on traditional
              light-water reactor configurations that require high-pressure containment vessels, Newcleo engineers small
              modular reactors cooled by molten lead. Liquid lead exhibits a high boiling point of 1,749°C, virtually
              eliminating coolant boiling risks and permitting atmospheric-pressure operation. The commercial portfolio
              centers on the LFR-AS-30, a 30 MWe modular reactor designed for distributed co-generation, followed by a
              scaled 200 MWe unit for utility and heavy industrial clusters. Supported by gross proceeds from its Nasdaq
              business combination, Newcleo is transitioning its basic design engineering toward formal licensing
              interactions with European and United States nuclear safety authorities.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
      - number: '5.2'
        title: Closed Nuclear Fuel Cycle and Mixed-Oxide Fuel Manufacturing
        blocks:
          - type: paragraph
            body: >-
              A central differentiator of Newcleo's strategy is the pairing of fast-neutron reactor cores with dedicated
              mixed-oxide (MOX) fuel fabrication. Conventional thermal reactors extract less than one percent of the
              energy potential in mined uranium, generating substantial volumes of long-lived transuranic waste.
              Operating with unmoderated fast neutrons allows Newcleo's reactors to breed and consume recycled plutonium
              and minor actinides extracted from existing spent fuel inventories. To support this fuel strategy, Newcleo
              entered a collaborative agreement with SHINE Technologies to assess supply chains for reprocessed uranium
              and plutonium from domestic stockpiles. By converting recovered fissile materials into MOX fuel
              assemblies, Newcleo aims to secure reactor fuel independence while dramatically reducing the volume and
              long-term radiotoxicity of radioactive waste.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE011
              - CE013
      - number: '5.3'
        title: Operating Infrastructure, Precursor Demonstrator, and Materials Labs
        blocks:
          - type: paragraph
            body: >-
              To de-risk lead-cooled fast reactor engineering ahead of commercial nuclear licensing, Newcleo has
              invested extensively in physical test infrastructure across Europe. At the ENEA Brasimone Research Centre
              in Italy, the company is constructing Precursor, a 10 MW thermal non-nuclear reactor mockup with
              approximately 3 MW electrical power conversion capability scheduled for completion by the end of 2026.
              Precursor utilizes electrical heating to validate primary loop thermal-hydraulics, natural circulation,
              and component behavior in molten lead without radiological hazards. In parallel, Newcleo established
              dedicated Materials Test Laboratories at Environment Park in Turin to evaluate steel alloys under real
              operating temperatures and corrosive lead chemistry, shortening qualification cycles and retaining core
              nuclear metallurgy expertise in-house.
            claimRefs:
              - CE004
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Technology Differentiation, Supply Integration, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Newcleo differentiates its operating model through strategic vertical integration and specialized
              industrial partnerships. Rather than outsourcing safety-critical fabrications, Newcleo acquired industrial
              capacity including subsidiary Fucina Italia, which manufactured the SAG-CEM glovebox system for nuclear
              waste conditioning with Sogin and Orano. Conventional island engineering is advanced through Next-N, a
              joint venture with Maire Tecnimont's NextChem. Despite strong capital momentum following its public
              listing, Newcleo faces significant technical and commercial hurdles. Liquid lead causes aggressive
              corrosion and erosion on structural steels at elevated temperatures, requiring extensive qualification.
              Furthermore, simultaneously navigating novel reactor licensing and multi-jurisdictional MOX fuel
              regulation across France, the United Kingdom, and the United States introduces considerable execution
              risk.
            claimRefs:
              - CE003
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Atmospheric Liquid Lead Eliminates Pressurized Containment Hazards
            body: >-
              Liquid lead operates with a boiling temperature of 1,749°C, virtually eliminating coolant boil-off risk
              and allowing atmospheric-pressure reactor operation without the massive pressurized vessels required by
              conventional light water reactors.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Heavy Liquid Metal Corrosion and Fuel Reprocessing Licensing Hurdles
            body: >-
              Molten lead presents aggressive corrosion and erosion challenges for structural steels at elevated
              temperatures, requiring extensive qualification in Turin materials laboratories, while commercial MOX fuel
              deployment remains dependent on multi-jurisdictional licensing across France, the UK, and the US.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Industrial Buyer Segmentation and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Newcleo segments its commercial customer base across energy-intensive industrial manufacturing, regional
              utility operators, and data center infrastructures that require firm, high-temperature heat alongside
              continuous electrical power. Heavy metallurgy, including electric arc furnace steelmakers such as Danieli,
              and building material manufacturers such as Cementir represent the primary early adopters because
              conventional intermittent renewables cannot satisfy their thermal operating thresholds. To address varying
              customer scale requirements, Newcleo has developed a dual-product architecture comprising the 200 MWe
              LFR-AS-200 demonstrator for utility-scale baseload grid replacement and the modular 30 MWe LFR-30 unit for
              localized industrial heat networks and smaller micro-grids. However, commercial conversion from conceptual
              interest to executed contracts is constrained by the lack of historical commercial operating precedents
              for lead-cooled fast reactors in Western markets.
            claimRefs:
              - CU001
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Deployment Milestones
        blocks:
          - type: paragraph
            body: >-
              Newcleo's commercial adoption trajectory is structured around progressive engineering de-risking, moving
              from non-nuclear physical testing to commercial host deployment across Europe and North America. Current
              operating revenue remains modest, reported at approximately €70 million ($80 million) for 2024, derived
              almost entirely from acquired nuclear engineering, consulting, and specialized supply-chain subsidiaries
              rather than advanced reactor commercial sales. The closing of its business combination with NewHold
              Investment Corp III in September 2026 delivered approximately $247 million in gross proceeds, expanding
              lifetime funding past $1 billion to finance its non-nuclear demonstrator, PRECURSOR, at ENEA Brasimone in
              Italy. While these milestones substantiate capitalization and engineering momentum, commercial reactor
              construction is not scheduled until 2033 to 2034, deferring meaningful reactor off-take revenues to the
              late 2030s.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named Customer Proof and Industrial Counterparties
        blocks:
          - type: paragraph
            body: >-
              Public evidence of customer commitment is currently concentrated among strategic industrial partners that
              participated in Newcleo's private financing rounds. Plant engineering giant Danieli signed an agreement to
              explore integrating lead-cooled fast reactors into steel manufacturing to pioneer green steel production,
              while Cementir Holding invested following a pact to examine process heat synergies for Italian cement
              factories. In the utility and fuel cycle segments, Newcleo established a joint venture with Slovak state
              nuclear entity JAVYS to assess siting up to four 200 MWe reactors, and entered a partnership with SHINE
              Technologies in June 2026 to evaluate spent fuel recycling and feedstock supply. Crucially, all public
              agreements remain exploratory memorandums and technical scoping studies rather than binding, multi-year
              take-or-pay power purchase or heat purchase contracts.
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
      - number: '6.4'
        title: Customer Journey, Off-Take Durability, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The customer adoption journey for Gen-IV advanced modular reactors spans more than a decade, beginning
              with strategic equity syndication and technical feasibility studies before progressing through non-nuclear
              validation, site licensing, and commercial commissioning. Customer retention and lifetime value in nuclear
              energy are structurally high once a plant is constructed, driven by 40- to 60-year asset operating
              lifespans and dedicated MOX fuel supply cycles. However, Newcleo faces severe pre-construction
              counterparty friction: industrial off-takers face high balance-sheet exposure and regulatory uncertainty
              when committing to first-of-a-kind reactor technologies. Navigating multi-jurisdictional licensing across
              France, Italy, Slovakia, the United Kingdom, and the United States creates substantial schedule
              concentration risk, where a delay in host licensing directly postpones commercial adoption across the
              entire partner cohort.
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Exploratory industrial pacts vs. commercial revenue visibility
            body: >-
              While Newcleo has successfully attracted heavy industrial backing from Danieli and Cementir, these
              arrangements currently represent strategic equity investments and preliminary technical studies rather
              than binding, bankable energy off-take agreements.
            calloutType: risk
            claimRefs:
              - CU002
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are regulatory completion, capital sufficiency, and technical qualification
              rather than a single isolated failure mode. A favorable French safety opinion on the proposed MOX facility
              is meaningful but preliminary, while Newcleo's own materials identify continuing licensing, construction,
              cost, supply-chain, and financing uncertainty. These risks compound: delayed materials qualification can
              defer licensing evidence, delay customer commitments, and increase the amount of external capital
              required. The heatmap therefore ranks fuel and reactor approvals, funding continuity, and lead-corrosion
              qualification as critical-impact items. Ratings are analytical judgments anchored to the cited
              disclosures, not measured incident frequencies; the pool provides no actuarial denominator from which to
              calculate probabilities.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and legal path remains multi-stage
        blocks:
          - type: paragraph
            body: >-
              Independent coverage reports that the French regulator found the MOX safety approach satisfactory at the
              current stage, but explicitly distinguishes that opinion from a construction permit or operating approval.
              The company is also advancing interactions with U.S. and French regulators rather than reporting completed
              reactor licenses. Beyond nuclear licensing, issuer disclosures identify export controls,
              radioactive-material transport and disposal, environmental and safety compliance, and potential gaps in
              nuclear-liability coverage. The core diligence test is documentary: obtain the regulator-issued opinion,
              jurisdiction-by-jurisdiction approval map, critical-path dates, safeguards plan, and liability-insurance
              schedule. Failure to evidence a financed and regulator-accepted path to both fuel and reactor
              authorization would break the integrated commercialization thesis.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
