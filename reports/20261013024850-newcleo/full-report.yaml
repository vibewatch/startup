              - CP012
              - CP013
      - number: '3.3'
        title: Switching Costs, Channel Access, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Nuclear power generation exhibits exceptionally high customer switching costs once an industrial host or
              utility selects a reactor architecture. Site evaluation, seismic qualification, grid interconnection, and
              multi-year regulatory licensing create deep customer lock-in lasting 40 to 60 operational years. To secure
              early distribution and preempt rival SMR architectures, Newcleo has pursued joint development agreements
              with state-backed nuclear entities and industrial leaders, most notably establishing a joint venture with
              Slovakian decommissioning company JAVYS to deploy up to four 200 MW reactors at Bohunice. To defend its
              supply chain moat, Newcleo acquired specialized engineering and manufacturing subsidiaries, including
              Fucina, Rutschi, and S.R.S., internalizing critical pump, valve, and reactor component fabrication. This
              vertical integration reduces reliance on external nuclear supply chains that currently bottleneck Western
              advanced reactor deployment.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Displacement Risks, Commoditization, and Strategic Adverse Factors
        blocks:
          - type: paragraph
            body: >-
              Despite significant technical differentiation and public capital access via its September 2026 Nasdaq
              listing, Newcleo faces substantial adverse headwinds. The primary risk is technological unprovenness: no
              commercial lead-cooled fast reactor has operated globally, meaning corrosion rates, thermal hydraulics,
              and passive decay heat removal under real-world utility conditions remain subject to first-of-a-kind
              execution hurdles. If light-water SMR incumbents achieve commercial series production and drive down
              levelized costs before Newcleo's targeted 2032 commercialization date, industrial off-takers may opt for
              lower-risk light-water solutions despite their inferior waste characteristics. Furthermore, any regulatory
              licensing delay at French safety authority ASNR or the US NRC could compress cash runway, forcing dilutive
              capital raises or delaying critical fuel-cycle demonstration facilities.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fuel-Cycle Integration as the Core Competitive Wedge
            body: >-
              While light-water and sodium-cooled SMR developers prioritize power-only generation or rapid modular
              deployment, Newcleo differentiates by addressing spent nuclear fuel disposal liabilities through its
              proprietary MOX fuel cycle and lead coolant physics.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
          - type: callout
            title: First-of-a-Kind Lead Coolant Deployment Risk
            body: >-
              No commercial lead-cooled fast reactor has operated outside military research prototypes, exposing Newcleo
              to material first-of-a-kind engineering, material corrosion, and regulatory licensing headwinds relative
              to conventional light-water alternatives.
            calloutType: risk
            claimRefs:
              - CP004
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization, and GTM Framework
        blocks:
          - type: paragraph
            body: >-
              Newcleo operates as a pre-commercial advanced nuclear technology developer whose planned commercial model
              spans three primary monetization streams: proprietary Lead-Cooled Fast Reactor (LFR) capital sales,
              long-term reactor operations management contracts, and Mixed Oxide (MOX) nuclear fuel fabrication and
              recycling services. While full commercial deployments of its 30 MWe and 200 MWe reactors are scheduled for
              the 2031 to 2032 timeframe, the company currently generates operating revenue through acquired
              supply-chain subsidiaries. Specifically, Newcleo reported over $80 million in revenue, other income, and
              financial income in 2024, anchored by operating industrial businesses such as nuclear pump specialist
              Rütschi Group. However, the company has not yet established binding commercial offtake contracts or
              published realized unit pricing for reactor baseload power or industrial heat, leaving long-term revenue
              quality dependent on future utility and industrial conversion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
