              - CR012
      - number: '7.3'
        title: Materials qualification and scale-up remain unresolved
        blocks:
          - type: paragraph
            body: >-
              Newcleo's technical presentation calls corrosion of steels by lead a major challenge and describes
              high-temperature operation as a continuing challenge, with qualification and industrialization work
              extending across a staged program. Its investor presentation adds that there is limited to no commercial
              operating experience for lead-cooled fast reactors of this configuration and scale, and that specialized
              first-of-a-kind components rely on a limited supplier base. Test facilities, oxygen-control work, and a
              non-nuclear demonstrator are concrete mitigations, but they are not substitutes for irradiated-material
              qualification or commercial reliability evidence. Investment monitoring should require test-hour,
              corrosion-rate, component-life, supplier-yield, schedule, and cost-variance data against pre-agreed
              thresholds.
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
