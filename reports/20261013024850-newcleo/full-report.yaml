            title: Revenue Composition Dominated by Acquired Supply-Chain Entities
            body: >-
              Reported 2024 revenue and financial income exceeding $80 million reflects historical operating turnover
              from acquired nuclear pump and component suppliers rather than commercial reactor or fuel sales,
