              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Break the thesis if Newcleo cannot document a funded and regulator-accepted licensing baseline, if
              materials qualification misses decision-critical thresholds without a credible recovery path, if fuel or
              sole-source component commitments remain non-binding near final investment decisions, or if additional
              capital is unavailable on terms compatible with the investment case.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR009
