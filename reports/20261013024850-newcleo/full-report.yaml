      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption of advanced modular nuclear reactors differs markedly from standard corporate energy procurement
              due to long capital planning horizons, site permitting hurdles, and specialized regulatory oversight.
              Newcleo targets four distinct buyer segments across heavy manufacturing, hyperscale digital
              infrastructure, sovereign utilities, and nuclear waste stewardship. In heavy industry, target buyers are
              corporate energy procurement consortiums and plant operating officers seeking to shield facilities from
              volatile fossil fuel markets and escalating carbon penalties. In the digital infrastructure sector,
              hyperscale cloud providers and AI data center operators represent an increasingly urgent buyer class,
              driven by surging power requirements for compute clusters and chronic electrical grid interconnection
              queues that delay facility commissioning by five to seven years. In sovereign utility power, state-owned
              entities such as Slovakian utility JAVYS evaluate multi-unit deployments to fulfill national baseload
              obligations and provide district heating via secondary loops. Finally, nuclear waste management agencies
              and commercial operators, such as Newcleo's partner SHINE Technologies, represent strategic counterparties
              seeking to draw down commercial spent fuel inventories into MOX fuel feedstock. Despite active discussions
              across these segments, commercial evidence remains characterized by feasibility assessments and
              preliminary partnerships rather than binding, long-term power purchase agreements.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM014
      - number: '2.4'
        title: Growth Catalysts, Capital Intensity, and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Newcleo's commercial adoption trajectory is governed by powerful secular drivers offset by substantial
              structural constraints. On the demand side, geopolitical energy security imperatives in Europe, corporate
              decarbonization commitments, and the exponential power demand of artificial intelligence workloads serve
              as primary catalysts for firm, carbon-free energy. The company's lead-cooled fast reactor architecture
              provides distinct competitive and economic advantages by operating at atmospheric pressure with passive
              safety mechanisms, eliminating the massive high-pressure containment vessels and complex emergency
              injection pumps typical of light-water reactors. Furthermore, Newcleo's vertical integration into
              mixed-oxide (MOX) fuel manufacturing insulates future reactor operators from volatile enriched uranium
              commodity cycles by recycling reprocessed nuclear waste. However, commercialization is constrained by
              extreme capital intensity, protracted regulatory licensing cycles, and FOAK execution risk. Licensing
              interactions with the US Nuclear Regulatory Commission (NRC) and the French nuclear safety authority
              represent multi-year processes that must precede site construction. Additionally, while Newcleo's Nasdaq
              listing under ticker NWCL establishes a public capital foundation, commercial adoption will remain gated
              by operational proof from its 10 MWth non-nuclear demonstrator in Brasimone, Italy, before industrial
              buyers commit binding capital to long-term reactor offtake.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital-Intensive Demonstration Precedes Energy Offtake
            body: >-
              Commercial adoption of the 200 MWe LFR-AS-200 hinges on successful operation of the 10 MWth non-nuclear
              precursor facility in Italy and licensing milestones with French and US regulators before commercial
              offtake conversion can accelerate.
            calloutType: insight
            claimRefs:
              - CM005
              - CM011
              - CM013
          - type: callout
            title: Commercial Offtake Remains at Pre-Binding Partnership Stage
            body: >-
              While Newcleo has established industrial partnerships with JAVYS and SHINE Technologies and targeted
              high-demand sectors like data centers and steel, public commercial traction remains characterized by
              feasibility evaluations and non-binding memorandums rather than long-term contracted power purchase
              agreements.
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Reactor Archetypes
        blocks:
          - type: paragraph
            body: >-
              The advanced nuclear landscape is dividing into three distinct architectural categories: evolutionary
              light-water small modular reactors, advanced sodium-cooled fast reactors, and high-temperature alternative
              coolant systems including lead-cooled and molten salt designs. Newcleo positions itself squarely in the
              Generation-IV advanced modular reactor segment, deploying liquid lead coolant and mixed-oxide (MOX) fuel
              derived from reprocessed nuclear waste. Direct peers in the fast reactor space include Oklo and
              TerraPower, both of which utilize fast neutron spectrums but rely on liquid sodium or metallic fuel rather
              than liquid lead. Incumbent nuclear vendors such as Westinghouse, EDF, and specialized SMR players like
              NuScale Power and Rolls-Royce SMR dominate the light-water category, offering lower regulatory novelty but
              remaining constrained by standard enriched uranium fuel cycles and accumulated radioactive waste
              liabilities. Substitutes also include status-quo grid power, utility-scale battery energy storage, and
              industrial gas cogeneration, all of which benefit from established permitting pathways and immediate
              commercial availability.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Competitor Profiles and Differentiation Durability
        blocks:
          - type: paragraph
            body: >-
              Newcleo's competitive differentiation centers on its integrated nuclear waste recycling model and passive
              safety physics. By utilizing liquid lead at atmospheric pressure, Newcleo eliminates the need for massive
              pressurized containment structures and mitigates volatile chemical reaction risks associated with
              sodium-cooled peers. Furthermore, Newcleo's closed fuel cycle strategy transforms domestic spent nuclear
              fuel stockpiles into usable MOX fuel, insulating prospective customers from raw uranium mining and
              enrichment supply chain bottlenecks. In an independent assessment conducted by the OECD Nuclear Energy
              Agency across six maturity dimensions—licensing, fuel, financing, supply chain, siting, and
              engagement—Newcleo ranked first among European fast reactors and second among European SMRs overall.
              However, while peers like NuScale have achieved standard design approval from the US Nuclear Regulatory
              Commission and Oklo pursues site permits in Idaho, Newcleo remains in early regulatory phases with
              France's ASNR and US NRC pre-application reviews.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
