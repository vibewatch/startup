chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Structure, and Founding
        blocks:
          - type: paragraph
            body: >-
              Newcleo (incorporated as newcleo plc) is an advanced modular reactor (AMR) and nuclear fuel manufacturing
              company founded in 2021 by physicist-entrepreneur Stefano Buono, Chief Scientific Officer Luciano Cinotti,
              and co-founders. The company develops Generation-IV Lead-Cooled Fast Reactors (LFRs) paired with
              mixed-oxide (MOX) fuel fabrication facilities designed to reprocess and recycle spent nuclear waste,
              establishing a closed nuclear fuel cycle. While originally founded in Europe with headquarters in Paris,
              France and operational hubs across the United Kingdom and Italy, Newcleo has expanded into the United
              States to accelerate commercial licensing and industrial partnerships. The operational platform integrates
              over 900 highly skilled personnel across Europe and the United States spanning nuclear engineering,
              supply-chain vertical integration, and demonstration facility development. Newcleo's core commercial model
              combines direct nuclear power and industrial heat generation with dedicated closed-loop fuel cycle supply,
              addressing both baseload clean energy demand and accumulated spent nuclear fuel liabilities.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO014
