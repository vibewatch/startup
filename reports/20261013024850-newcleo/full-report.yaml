              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: Capital Adequacy, Public Listing Inflow, and Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              On September 21, 2026, Newcleo finalized its business combination with NewHold Investment Corp III,
              securing approximately $247 million in gross proceeds and initiating public trading on the Nasdaq Global
              Select Market under tickers NWCL and NWCLW on September 22, 2026. The transaction was structured at a
              pre-money equity valuation of approximately $2.4 billion, funded by an oversubscribed $216 million private
              placement in public equity (PIPE) alongside $31 million released from the SPAC trust account. Coupled with
              additional pre-closing capital raises, cumulative equity and transaction financing exceeded $1 billion as
              of September 2026. Nevertheless, given the multi-billion-dollar capital requirements of planned fuel
              facilities and multi-year licensing processes with French and U.S. safety authorities, Newcleo maintains
              heavy forward financing dependency and will require repeated debt, project finance, and equity capital
              infusions before commercial revenue can self-sustain corporate operations.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial Verdict, Diligence Blockers, and Forward Underwriting Path
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, Newcleo possesses substantial capital resources relative to
              early-stage advanced nuclear peers, but its public valuation prices in significant milestone execution
              without commercial operational de-risking. The fundamental underwriting blockers are twofold: first, the
              absence of public disclosure regarding cash burn rates, consolidated balance sheet cash reserves, and
              project debt structures; and second, the lack of binding long-term power purchase agreements or fuel
              purchase commitments. Investors cannot verify whether realized electricity generation costs will remain
              competitive against traditional light-water reactors or alternative low-carbon power without seeing
              site-specific offtake terms and validated engineering cost estimates. Rigorous underwriting requires
              obtaining confidential project-level financial models, examining SPAC redemption dynamics and forward
              purchase agreements, and auditing cash runway against multi-year regulatory review milestones.
            claimRefs:
              - CI003
              - CI007
              - CI009
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Extensive Forward Capital Dependency
            body: >-
              While the September 2026 Nasdaq public listing and oversubscribed PIPE infused $247 million in gross
              proceeds, Newcleo's projected capital expenditures for its planned MOX fuel fabrication plant alone
              approach $2.4 billion, ensuring that the company remains highly dependent on external debt and equity
              financing throughout the pre-commercial decade.
            calloutType: risk
            claimRefs:
