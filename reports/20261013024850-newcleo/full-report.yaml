          advanced nuclear contenders.
        - >-
          Gross SPAC proceeds of $247 million provide limited runway against multi-billion dollar commercial reactor
          build-out costs.
        - Deployment of the $75 million forward purchase agreement and non-dilutive grant awards.
      - - Public Market Valuation
        - >-
          Nasdaq listing under NWCL provides continuous access to global deep-tech institutional and retail capital
          pools.
        - >-
          Post-merger share price contraction to $7.37 (-26.7% over 1Y) and negative YoY revenue growth (-29.9%) risk
          multiple compression.
