        - >-
          Partnership with SHINE Technologies evaluates spent nuclear fuel recovery to feed newcleo MOX fuel
          manufacturing.
        - >-
          Framework is non-binding exploratory scoping without committed volumetric offtake or commercial processing
          pricing.
        - Formalization of binding fuel supply and spent-fuel recycling agreements.
