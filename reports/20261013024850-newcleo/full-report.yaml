      - number: '4.2'
        title: Cost Structure, Prototype Development, and Fuel Facility Capex
        blocks:
          - type: paragraph
            body: >-
              The cost profile of Newcleo reflects the heavy capital expenditure and engineering intensity
              characteristic of Generation IV reactor development. Immediate capital expenditures center on the
              completion and operation of a 10 megawatt-thermal non-nuclear prototype facility at Brasimone, Italy,
              targeted for 2026. Beyond demonstrator testing, long-term capital intensity expands drastically: Newcleo's
              detailed design for a commercial MOX fuel fabrication plant in France or the United States carries an
              estimated capital cost of approximately $2.4 billion. Unit economics for the company's LFR reactors remain
              unvalidated by commercial operations and face substantial technical and industrial risks, including liquid
              lead corrosion, specialized materials procurement, licensing timelines, and supply-chain delays.
              Consequently, financial underwriting cannot rely on historical unit margins, as existing statutory
              operating turnover from entities like UK subsidiary Newcleo Ltd (£1M to £10M in 2023) primarily reflects
              niche manufacturing services rather than scalable advanced nuclear power economics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
