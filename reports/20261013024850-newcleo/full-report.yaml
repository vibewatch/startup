  - id: FE001
    title: Newcleo Advanced Reactor and Fuel-Cycle Operating Stack
    type: stack
    summary: >-
      Multi-layered technology stack spanning fuel cycle inputs, core physics, coolant thermal hydraulics, specialized
      containment, power conversion, and industrial co-generation.
    approximationNotes: >-
      Architecture reflects engineering mockups and planned demonstrator specifications; commercial reactor licensing
      remains pending.
    data:
      layers:
        - label: 'Layer 1: Fuel Feedstock & Recycling'
          detail: >-
            Spent nuclear fuel extraction and MOX fuel fabrication utilizing reprocessed uranium and plutonium from
            existing stockpiles.
        - label: 'Layer 2: Core Physics & Neutronics'
          detail: Fast-neutron spectrum reactor enabling multi-recycling of actinides without moderating water.
        - label: 'Layer 3: Primary Coolant & Thermal Hydraulics'
          detail: >-
            Liquid lead coolant operating at atmospheric pressure with high boiling point (1,749°C) eliminating coolant
            boil-off risk.
        - label: 'Layer 4: Materials & Containment Engineering'
          detail: >-
            Advanced corrosion-resistant metallurgy, glovebox containment, and specialized valves tested in dedicated
            Turin materials labs.
        - label: 'Layer 5: Power Conversion & Secondary Island'
          detail: >-
            Steam and power conversion island engineered in joint venture with NextChem (Next-N) for modular balance of
            plant.
        - label: 'Layer 6: Industrial Heat & Grid Interface'
          detail: >-
            Co-generation interface delivering competitive high-temperature industrial heat and base-load electric power
            to heavy industry.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The multi-stage customer adoption journey from initial industrial engagement to multi-decade reactor offtake and
      closed-loop fuel recycling.
    approximationNotes: >-
      Illustrates the structured commercialization framework across five distinct phases based on disclosed customer
      agreements.
    claimRefs:
      - CU010
      - CU011
      - CU012
    data:
      items:
        - label: 'Phase 1: Strategic Equity & Research Consortium'
          actors: Industrial emitters (Danieli, Cementir) & institutional research bodies
          activities: >-
            Direct equity investment in funding rounds, joint feasibility scoping, and industrial taskforce
            participation.
          touchpoints:
            - Executive briefings and investor syndication
            - Joint technical committee evaluations
          status: Active (2021-2026)
        - label: 'Phase 2: Non-Nuclear Prototyping & Technology Validation'
          actors: Prospective plant operators, engineering partners, and safety regulators
          activities: >-
            Component qualification at the Brasimone PRECURSOR 10 MWth facility in Italy to derisk thermal-hydraulic
            systems.
          touchpoints:
            - ENEA Brasimone testbed access
            - Pre-licensing workshops with ASN and international regulators
          status: Underway (2025-2027)
        - label: 'Phase 3: Host Site Selection & Siting Agreements'
          actors: Host utilities (JAVYS) and regional industrial clusters (Chinon, France)
          activities: Pre-licensing filings, environmental impact assessments, and preliminary grid connection studies.
          touchpoints:
            - Municipal zoning and land acquisition agreements
            - Grid interconnection feasibility filings
          status: Initiated (2026-2028)
        - label: 'Phase 4: Preliminary Licensing & Construction Permitting'
          actors: National nuclear safety authorities (ASN, U.S. NRC) and engineering contractors
          activities: Formal design certification submissions, safety case evaluations, and major construction permit filings.
          touchpoints:
            - Formal safety evaluation reports
            - Supply chain manufacturing allocations
          status: Planned (2028-2032)
        - label: 'Phase 5: Commercial Deployment & Off-Take Execution'
          actors: Heavy industry offtakers and regional electrical power grids
          activities: >-
            Long-term power and process heat purchase agreements (PPAs/HPAs), turnkey plant construction, and
            commissioning.
          touchpoints:
            - Binding 20- to 30-year take-or-pay energy contracts
            - Facility commissioning and commercial operation handover
          status: Targeted (2033-2037)
        - label: 'Phase 6: Closed-Loop Fuel Cycling & Expansion'
          actors: Fuel cycle partners (SHINE, Orano) and multi-unit fleet operators
          activities: >-
            Sustained MOX fuel delivery, multi-unit site expansion, and multi-recycling of discharged spent nuclear
            fuel.
          touchpoints:
            - Long-term MOX fuel fabrication agreements
            - Spent fuel collection and recycling contracts
          status: Targeted post-2035
