              - CR015
      - number: '7.4'
        title: Fuel, counterparties, demand, and capital form one dependency chain
        blocks:
          - type: paragraph
            body: >-
              The SHINE agreement is evidence of fuel-cycle collaboration, but its disclosed scope is to assess material
              supply, recycling, and joint funding opportunities; it is not a binding commercial feedstock commitment.
              Newcleo's own May presentation likewise states that it had not built an LFR or MOX plant or entered a
              binding customer operating contract, and warns that non-binding counterparties may withdraw. September
              transaction materials report $247 million of gross proceeds and a possible additional $75 million, while
              the risk disclosures still require future funding. Gross proceeds therefore should not be treated as
              available runway. Kill criteria are a missed funded licensing baseline, inability to secure committed fuel
              inputs or qualified suppliers, failure to convert demand into binding contracts, or a financing plan that
              depends on unavailable or materially dilutive capital.
            claimRefs:
