  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Newcleo operates at the intersection of advanced nuclear reactor innovation, industrial process
              decarbonization, and closed-loop nuclear fuel cycle management. The company defines its primary commercial
              addressable market around high-temperature industrial heat and dedicated baseload electricity for
              energy-intensive sectors, explicitly distinguishing its offering from conventional light-water small
              modular reactors (SMRs) designed strictly for grid-connected utility electricity. Target industrial
              segments include chemicals, steelmaking, cement, ceramics, glass manufacturing, and hyperscale data center
              infrastructure, where operational workflows require continuous high-temperature steam and firm electrical
              capacity that intermittent renewables cannot supply alone. The addressable spend boundary includes
              combined heat and power equipment capital expenditure, on-site reactor operations and maintenance, and
              long-term MOX fuel supply contracts. Conversely, Newcleo's market scope excludes light residential retail
              power distribution, decentralized rooftop solar, and low-temperature district space heating outside
              municipal utility partnerships. Incumbent status-quo substitutes in Newcleo's target sectors consist
              primarily of unabated fossil natural gas and coal combustion, conventional grid electricity coupled with
              carbon offsets, and early-stage green hydrogen technologies that remain economically uncompetitive.
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, Industrial SAM, and Constrained SOM'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for Newcleo requires multiple analytical lenses to avoid relying on
              generic, unconstrained total addressable market (TAM) figures. At the macro level, the global market for
              clean firm baseload electricity and industrial decarbonization exceeds $350 billion annually as major
              industrialized economies legislate net-zero mandates and retire aging fossil power stations. Within this
              broader opportunity, the serviceable addressable market (SAM) for high-temperature industrial cogeneration
              in Europe and North America represents approximately $85 billion, reflecting industrial heat loads
              operating above 400°C that are technically compatible with Newcleo's lead-cooled fast reactor
              architecture. At the serviceable obtainable market (SOM) level, Newcleo's opportunity is realistically
              constrained by licensing lead times, demonstration project milestones, and capital availability. The
              company's pipeline centers on its flagship LFR-AS-200 commercial design—a 200 MWe (480 MWth) reactor
              planned for commercial availability around 2034, preceded by a planned US first-of-a-kind (FOAK)
              deployment in 2032. While commercial reactor revenues remain a future milestone, Newcleo has established
              an operating revenue base through targeted supply-chain acquisitions, generating $80 million in revenue
              and other income in 2024. Following its September 2026 Nasdaq business combination, which secured
              approximately $247 million in gross proceeds, Newcleo has accumulated over $1 billion in total financing
              to capitalize its technology development path.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
