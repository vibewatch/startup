      - number: '1.3'
        title: Capitalization, Nasdaq Public Listing, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Newcleo's capitalization profile reached a transformative inflection point on September 22, 2026, when its
              ordinary shares and warrants commenced trading on the Nasdaq Global Select Market under the ticker symbols
              NWCL and NWCLW. The business combination with NewHold Investment Corp III provided approximately $247
              million in gross proceeds, comprising an oversubscribed $216 million private investment in public equity
              (PIPE) and $31 million released from NewHold's trust account, valuing Newcleo at a pre-money equity value
              of approximately $2.4 billion. In addition, Newcleo raised close to $20 million in supplemental private
              funding since the transaction announcement, bringing cumulative lifetime funding to more than $1 billion.
              Up to an additional $75 million in capital may become available through an existing forward purchase
              agreement. Key institutional stakeholders include lead financial placement agent Goldman Sachs, capital
              markets advisors Guggenheim Securities and BTIG, strategic industrial partners such as SHINE Technologies
              and Oklo Inc., and historical private venture investors who rolled over their entire equity stake.
            claimRefs:
