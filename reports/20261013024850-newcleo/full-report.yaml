    title: Investment Thesis and Anti-Thesis Evaluation
    columns:
      - Pillar / Dimension
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Pivotal Diligence Catalyst
    rows:
      - - Technology & Architecture
        - >-
          Lead-cooled fast reactor (LFR) and MOX fuel recycling provide unique closed-loop fuel cycle advantages and
          high thermal efficiency.
