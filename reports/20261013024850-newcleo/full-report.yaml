      - number: '1.4'
        title: Operational Scale, Regulatory Progression, and Commercial Milestones
        blocks:
          - type: paragraph
            body: >-
              Newcleo's operational expansion centers on advancing its technical demonstrators, regulatory licensing,
              and industrial fuel partnerships across Europe and North America. The company is completing construction
              and preparing operations for its 10 MWth non-nuclear lead-cooled testing demonstrator in Italy, providing
              crucial engineering and thermal-hydraulic validation ahead of nuclear licensing. In the United States,
              Newcleo formally initiated pre-application engagement with the U.S. Nuclear Regulatory Commission (NRC) in
              February 2026 covering both its Lead-Cooled Fast Reactor design and a planned domestic MOX fuel
              fabrication facility developed in partnership with Oklo Inc. In parallel, Newcleo entered into a strategic
              collaboration with SHINE Technologies in June 2026 to evaluate spent nuclear fuel recycling, linking
              SHINE's extraction capabilities with Newcleo's MOX manufacturing to supply advanced fast reactors. These
              milestones demonstrate accelerating transatlantic regulatory and technical progress, though binding
              commercial offtake contracts and operational reactor deployments remain future milestones.
