  title: First-of-a-Kind Lead Coolant Deployment Risk
  body: No commercial lead-cooled fast reactor has operated outside military research prototypes, exposing Newcleo to material first-of-a-kind engineering, material corrosion, and regulatory licensing headwinds relative to conventional light-water alternatives.
