- id: TV003
  title: Bull, Base, and Bear Scenario Projections
  columns:
  - Scenario
  - Core Operating Assumptions
  - Valuation & Multiples Logic
  - Downside Triggers / Key Risks
  - Probability Signal
  rows:
  - - Bull Case
    - Timely 10MWth demonstrator commissioning, swift ASN (France) and NRC (US) licensing progress, and binding MOX offtake
      contracts.
    - Equity valuation expands toward $3.5B-$4.5B as pre-commercial discount narrows and global AMR demand accelerates.
    - Unexpected licensing delays or vendor component lead-time extensions.
    - 20%
  - - Base Case (Current Posture)
    - Demonstrator operations proceed through 2027; European feasibility partners remain engaged; periodic secondary/grant
      funding secured.
    - Valuation stabilizes near $1.8B-$2.4B ($6.00-$8.00 per share) as market waits for hardware milestones.
    - Persistent quarterly net losses and reliance on dilutive equity financing.
    - 55%
  - - Bear Case
    - Technical bottlenecks in lead-coolant loop testing or licensing delays trigger severe multiple compression, driving
      market capitalization down toward $1.0B-$1.4B ($3.50-$4.50 per share) with severe multiple contraction.
    - Liquidity squeeze before commercial demonstrator proves viability; shareholder dilution.
    - Liquidity squeeze before commercial demonstrator proves viability; severe equity dilution.
    - 25%
  notes: Scenarios assume 300.7 million common shares outstanding as reported in SEC Form F-1 and Nasdaq trading data as of
    October 2026.
