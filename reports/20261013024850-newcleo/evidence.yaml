evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete directory of operational vice presidents, subsidiary managing directors, and technical leads across
      European operating units.
    whyItMatters: >-
      Current public disclosures sample C-suite and public board members without enumerating all operational business
      unit leaders.
    diligencePath: >-
      Inspect upcoming Form 20-F or statutory subsidiary annual filings in the UK, France, and Italy for full executive
      directory.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-dilution
    missingEvidence: >-
      Full post-merger share capitalization table showing exact public float, PIPE investor discount terms, and founder
      equity lock-up expiration dates.
    whyItMatters: >-
      Determines secondary market share overhang, future dilution risk, and effective voting control following the
      Nasdaq listing.
    diligencePath: Review post-closing SEC Form 8-K/A and Form F-1/F-4 registration filings once fully declared effective.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-offtake
    missingEvidence: Audited financial disclosure of binding commercial customer offtake agreements or firm reactor purchase orders.
    whyItMatters: >-
      Current commercial evidence is restricted to pre-licensing feasibility partnerships and research MOUs rather than
      guaranteed multi-year revenues.
    diligencePath: >-
      Audit forthcoming quarterly financial filings (Form 6-K or Form 20-F) for customer concentration and backlog
      disclosures.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent third-party TAM and SAM breakdown specifically separating lead-cooled fast reactor industrial heat
      demand from general light-water SMR power generation.
    whyItMatters: >-
      Without segmented industrial heat market studies, sizing relies on aggregate SMR forecasts that conflate utility
      grid replacement with private industrial off-taker deployments.
    diligencePath: >-
      Request management's proprietary market sizing models and independent market consultant reports commissioned for
      the NewHold SPAC business combination.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-offtake
    missingEvidence: >-
      Binding long-term power purchase agreements (PPAs) or heat offtake contracts with industrial users or data center
      operators.
    whyItMatters: >-
      Public evidence shows commercial discussions and memorandums of understanding with data centers and heavy
      industry, but no signed binding offtake commitments confirming pricing and volume.
    diligencePath: Review commercial pipeline data room disclosures and offtake letter-of-intent terms during customer diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: lead-coolant-commercial-operating-data
    missingEvidence: >-
      Empirical operational, corrosion, and safety data from a utility-scale commercial lead-cooled fast reactor in
      continuous power operation.
    whyItMatters: >-
      Without commercial-scale operating history, engineering assumptions regarding liquid lead circulation, thermal
      stress, and component longevity remain unverified outside demonstration loops.
    diligencePath: >-
      Review qualification test results and operational data from Newcleo's 2 MWth OTHELLO liquid-lead loop and the 10
      MWth PRECURSOR non-nuclear testing facility at ENEA Brasimone.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: binding-offtake-pricing
    missingEvidence: >-
      Fully executed, binding power purchase agreements or industrial heat offtake contracts detailing realized per-MWh
      pricing, take-or-pay terms, and escalation indices.
    whyItMatters: >-
      Public evidence confirms framework agreements and feasibility partnerships (e.g. JAVYS, Saipem, Danieli) but lacks
      binding price levels and volume commitments necessary to model project-level cash flows.
    diligencePath: >-
      Request customer term sheets and project economics for the Slovakian Bohunice project and prospective industrial
      offtakers during confirmatory diligence.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: levelized-cost-benchmarks
    missingEvidence: >-
      Audited capital expenditure breakdowns and project-finance models comparing Newcleo's LFR levelized cost of
      electricity to commercial Generation III+ and IV reactors.
    whyItMatters: >-
      Without independent levelized cost estimates and verified overnight capital costs, investors cannot underwrite
      long-term power purchase competitiveness against conventional nuclear or alternative clean baseload options.
    diligencePath: >-
      Request confidential project finance models, independent technical engineering reviews, and offtake feasibility
      studies during technical and financial due diligence.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: precursor-operational-validation
    missingEvidence: >-
      Third-party operational validation and verified telemetry from the 10 MWth Precursor non-nuclear demonstrator at
      ENEA Brasimone.
    whyItMatters: >-
      Thermal-hydraulic models and natural circulation claims in liquid lead cannot be fully validated prior to physical
      test loop operation.
    diligencePath: >-
      Review ENEA testing logs, commission reports, and lead flow telemetry once the Brasimone facility enters active
      testing.
