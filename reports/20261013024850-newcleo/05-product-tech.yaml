  - id: TE002
    title: Nuclear Energy Workflow and Industrial Use Cases
    columns:
      - Industrial User Job
      - Baseline Workflow
      - Newcleo Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - High-Temperature Industrial Process Heat
        - Fossil gas or coal combustion boilers
        - Lead-cooled fast reactor co-generation loop
        - Zero-emission high-temperature steam supply
        - Heat exchanger corrosion limits operating temperature ceiling
      - - Baseload Low-Carbon Electric Power
        - Light-water reactors or intermittent renewables with storage
        - Modular 30 MWe / 200 MWe fast neutron reactors
        - Compact footprint and passive decay heat removal
        - First-of-a-kind engineering and construction lead time
      - - Spent Nuclear Fuel Management
        - Long-term geological disposal of irradiated fuel
        - MOX fuel recycling and actinide consumption in fast spectrum
        - Drastic reduction in nuclear waste volume and radiotoxicity duration
        - Requires complex multi-step chemical reprocessing supply chain
      - - Nuclear Component Manufacturing
        - Outsourced procurement from limited tier-1 suppliers
        - Vertically integrated manufacturing via Fucina Italia
        - Proprietary quality control for radioactive material handling
        - Constrained manufacturing capacity across multiple reactor projects
    notes: Operational comparison across power generation, industrial process heat, and spent fuel management.
