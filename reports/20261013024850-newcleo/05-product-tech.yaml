  - calloutType: risk
    title: Heavy Liquid Metal Corrosion and Fuel Reprocessing Licensing Hurdles
    body: Molten lead presents aggressive corrosion and erosion challenges for structural steels at elevated temperatures, requiring extensive qualification in Turin materials laboratories, while commercial MOX fuel deployment remains dependent on multi-jurisdictional licensing across France, the UK, and the US.
