figures:
  - id: FE001
    title: Newcleo Advanced Reactor and Fuel-Cycle Operating Stack
    type: stack
    summary: Multi-layered technology stack spanning fuel cycle inputs, core physics, coolant thermal hydraulics, specialized containment, power conversion, and industrial co-generation.
    approximationNotes: Architecture reflects engineering mockups and planned demonstrator specifications; commercial reactor licensing remains pending.
    data:
      layers:
        - label: 'Layer 1: Fuel Feedstock & Recycling'
          detail: Spent nuclear fuel extraction and MOX fuel fabrication utilizing reprocessed uranium and plutonium from existing stockpiles.
        - label: 'Layer 2: Core Physics & Neutronics'
          detail: Fast-neutron spectrum reactor enabling multi-recycling of actinides without moderating water.
        - label: 'Layer 3: Primary Coolant & Thermal Hydraulics'
          detail: Liquid lead coolant operating at atmospheric pressure with high boiling point (1,749°C) eliminating coolant boil-off risk.
        - label: 'Layer 4: Materials & Containment Engineering'
          detail: Advanced corrosion-resistant metallurgy, glovebox containment, and specialized valves tested in dedicated Turin materials labs.
        - label: 'Layer 5: Power Conversion & Secondary Island'
          detail: Steam and power conversion island engineered in joint venture with NextChem (Next-N) for modular balance of plant.
        - label: 'Layer 6: Industrial Heat & Grid Interface'
          detail: Co-generation interface delivering competitive high-temperature industrial heat and base-load electric power to heavy industry.
