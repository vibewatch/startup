    title: Technology and Operating Architecture Subsystems
    columns:
      - Subsystem Layer
      - Technical Role
      - Supply & Integration Dependency
      - Key Technical Risk
    rows:
      - - Primary Coolant System
        - Liquid lead heat extraction from core to heat exchangers
        - High-purity lead suppliers and oxygen-control chemistry systems
        - Corrosion and erosion of structural steels at elevated temperatures
      - - Fast Neutron Core
        - Fission of mixed-oxide fuel without moderation
        - Supply of reprocessed uranium and plutonium materials
        - Fuel cladding integrity under high neutron fluence
      - - Power Conversion & Balance of Plant
        - Superheated steam generation and turbine-generator electricity conversion
        - Joint venture Next-N with NextChem (Maire Tecnimont group)
        - Thermal stress and vibration in compact lead-to-water steam generators
      - - Materials Qualification & Containment
        - Testing structural metallurgy and radioactive glovebox isolation
        - Materials Test Laboratories at Environment Park in Turin and Fucina Italia
        - Scalability from laboratory coupons to commercial reactor service life
    notes: Subsystem specifications, industrial supply partnerships, and licensing dependencies.
