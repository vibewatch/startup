company:
  name: Newcleo
chapter:
  number: 5
  title: Product & Technology
  summary: Newcleo is developing Generation IV lead-cooled fast reactors paired with mixed-oxide fuel manufacturing to close the nuclear fuel cycle. The company's technology roadmap progresses from the 10 MWth non-nuclear Precursor demonstrator at ENEA Brasimone to commercial 30 MWe modular units, supported by in-house materials laboratories in Turin and nuclear manufacturing through Fucina Italia.
sections:
  - id: product-definition-and-modular-lfr
    title: Product Definition and Modular Lead-Cooled Fast Reactor Architecture
    body: Newcleo positions its technology platform as an integrated solution addressing clean baseload power, high-temperature industrial heat, and nuclear waste reduction. Rather than relying on traditional light-water reactor configurations that require high-pressure containment vessels, Newcleo engineers small modular reactors cooled by molten lead. Liquid lead exhibits a high boiling point of 1,749°C, virtually eliminating coolant boiling risks and permitting atmospheric-pressure operation. The commercial portfolio centers on the LFR-AS-30, a 30 MWe modular reactor designed for distributed co-generation, followed by a scaled 200 MWe unit for utility and heavy industrial clusters. Supported by gross proceeds from its Nasdaq business combination, Newcleo is transitioning its basic design engineering toward formal licensing interactions with European and United States nuclear safety authorities.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
    tableRefs:
      - TE001
  - id: mox-fuel-cycle-and-reprocessing
    title: Closed Nuclear Fuel Cycle and Mixed-Oxide Fuel Manufacturing
    body: A central differentiator of Newcleo's strategy is the pairing of fast-neutron reactor cores with dedicated mixed-oxide (MOX) fuel fabrication. Conventional thermal reactors extract less than one percent of the energy potential in mined uranium, generating substantial volumes of long-lived transuranic waste. Operating with unmoderated fast neutrons allows Newcleo's reactors to breed and consume recycled plutonium and minor actinides extracted from existing spent fuel inventories. To support this fuel strategy, Newcleo entered a collaborative agreement with SHINE Technologies to assess supply chains for reprocessed uranium and plutonium from domestic stockpiles. By converting recovered fissile materials into MOX fuel assemblies, Newcleo aims to secure reactor fuel independence while dramatically reducing the volume and long-term radiotoxicity of radioactive waste.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE008
    figureRefs:
      - FE001
  - id: operating-infrastructure-and-prototyping
    title: Operating Infrastructure, Precursor Demonstrator, and Materials Labs
    body: To de-risk lead-cooled fast reactor engineering ahead of commercial nuclear licensing, Newcleo has invested extensively in physical test infrastructure across Europe. At the ENEA Brasimone Research Centre in Italy, the company is constructing Precursor, a 10 MW thermal non-nuclear reactor mockup with approximately 3 MW electrical power conversion capability scheduled for completion by the end of 2026. Precursor utilizes electrical heating to validate primary loop thermal-hydraulics, natural circulation, and component behavior in molten lead without radiological hazards. In parallel, Newcleo established dedicated Materials Test Laboratories at Environment Park in Turin to evaluate steel alloys under real operating temperatures and corrosive lead chemistry, shortening qualification cycles and retaining core nuclear metallurgy expertise in-house.
    claimRefs:
      - CE004
      - CE007
      - CE009
      - CE010
    tableRefs:
      - TE003
  - id: technology-differentiation-and-technical-risks
    title: Technology Differentiation, Supply Integration, and Technical Risks
    body: Newcleo differentiates its operating model through strategic vertical integration and specialized industrial partnerships. Rather than outsourcing safety-critical fabrications, Newcleo acquired industrial capacity including subsidiary Fucina Italia, which manufactured the SAG-CEM glovebox system for nuclear waste conditioning with Sogin and Orano. Conventional island engineering is advanced through Next-N, a joint venture with Maire Tecnimont's NextChem. Despite strong capital momentum following its public listing, Newcleo faces significant technical and commercial hurdles. Liquid lead causes aggressive corrosion and erosion on structural steels at elevated temperatures, requiring extensive qualification. Furthermore, simultaneously navigating novel reactor licensing and multi-jurisdictional MOX fuel regulation across France, the United Kingdom, and the United States introduces considerable execution risk.
    claimRefs:
      - CE003
      - CE011
      - CE012
      - CE013
      - CE014
    tableRefs:
      - TE002
