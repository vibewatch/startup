    - type: missing-source
      severity: material
      topic: licensing
      missingEvidence: >-
        Primary regulator dockets, issued opinions, complete open-item lists, permit dependencies,
        safeguards plans, approval dates, and funded licensing schedules for the MOX facility and
        each planned reactor jurisdiction.
      whyItMatters: >-
        Preliminary progress cannot establish the time, cost, or probability of construction and
        operating authorization for the integrated fuel and reactor program.
      diligencePath: >-
        Obtain regulator-issued records and management's jurisdiction-by-jurisdiction critical path,
        then confirm status and open items directly with nuclear regulatory counsel.
      relatedQuestionRefs:
        - QR001
      relatedTableRefs:
