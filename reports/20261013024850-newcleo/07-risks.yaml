    - type: private-evidence-only
      severity: material
      topic: capital risk
      missingEvidence: >-
        Consolidated cash, restricted cash, monthly burn, debt, committed funding, runway, project
        capex, contingency, working capital, and reactor and MOX unit-economics schedules.
      whyItMatters: >-
        Gross proceeds and total historical funding do not establish cash availability, financing
        duration, construction affordability, or dilution risk.
      diligencePath: >-
        Review audited financials, treasury balances, monthly management accounts, project budgets,
        financing agreements, covenant schedules, and a milestone-linked sources-and-uses model.
      relatedQuestionRefs:
