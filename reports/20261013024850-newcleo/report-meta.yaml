  topStrengths:
    - Public capital access and more than $1 billion in cumulative funding.
    - Differentiated lead-cooled fast reactor and closed fuel-cycle technology.
    - Large engineering and manufacturing footprint with named strategic partners.
  topRisks:
    - First-of-a-kind materials, reactor, and fuel-cycle execution risk remains high.
    - Licensing and regulatory timelines span multiple jurisdictions and remain incomplete.
    - Binding commercial offtake contracts are still absent.
    - Continued financing needs could force dilution before commercialization.
  unresolvedGaps:
    - Consolidated cash, burn, debt, and runway remain undisclosed.
    - Full cap table, redemption mechanics, and dilution terms for the public transaction remain unclear.
    - Binding reactor and fuel offtake contracts have not been published.
    - Commercial unit economics for reactors and MOX fuel remain unproven.
