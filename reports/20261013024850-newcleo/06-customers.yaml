chapter:
  number: 6
  title: "Customers"
  summary: "Newcleo targets heavy industrial off-takers and data centers seeking high-temperature clean process heat and baseload power, but commercial traction remains at exploratory feasibility agreements and strategic equity tie-ups rather than binding reactor off-take contracts."
sections:
  - id: "buyer-segmentation-and-commercial-model"
    title: "Industrial Buyer Segmentation and Commercial Model"
    body: "Newcleo segments its commercial customer base across energy-intensive industrial manufacturing, regional utility operators, and data center infrastructures that require firm, high-temperature heat alongside continuous electrical power. Heavy metallurgy, including electric arc furnace steelmakers such as Danieli, and building material manufacturers such as Cementir represent the primary early adopters because conventional intermittent renewables cannot satisfy their thermal operating thresholds. To address varying customer scale requirements, Newcleo has developed a dual-product architecture comprising the 200 MWe LFR-AS-200 demonstrator for utility-scale baseload grid replacement and the modular 30 MWe LFR-30 unit for localized industrial heat networks and smaller micro-grids. However, commercial conversion from conceptual interest to executed contracts is constrained by the lack of historical commercial operating precedents for lead-cooled fast reactors in Western markets."
    claimRefs:
      - "CU001"
      - "CU004"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-deployment-commitments"
    title: "Adoption Trajectory and Deployment Milestones"
    body: "Newcleo's commercial adoption trajectory is structured around progressive engineering de-risking, moving from non-nuclear physical testing to commercial host deployment across Europe and North America. Current operating revenue remains modest, reported at approximately €70 million ($80 million) for 2024, derived almost entirely from acquired nuclear engineering, consulting, and specialized supply-chain subsidiaries rather than advanced reactor commercial sales. The closing of its business combination with NewHold Investment Corp III in September 2026 delivered approximately $247 million in gross proceeds, expanding lifetime funding past $1 billion to finance its non-nuclear demonstrator, PRECURSOR, at ENEA Brasimone in Italy. While these milestones substantiate capitalization and engineering momentum, commercial reactor construction is not scheduled until 2033 to 2034, deferring meaningful reactor off-take revenues to the late 2030s."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU002"

  - id: "named-customer-proof-and-industrial-partnerships"
    title: "Named Customer Proof and Industrial Counterparties"
    body: "Public evidence of customer commitment is currently concentrated among strategic industrial partners that participated in Newcleo's private financing rounds. Plant engineering giant Danieli signed an agreement to explore integrating lead-cooled fast reactors into steel manufacturing to pioneer green steel production, while Cementir Holding invested following a pact to examine process heat synergies for Italian cement factories. In the utility and fuel cycle segments, Newcleo established a joint venture with Slovak state nuclear entity JAVYS to assess siting up to four 200 MWe reactors, and entered a partnership with SHINE Technologies in June 2026 to evaluate spent fuel recycling and feedstock supply. Crucially, all public agreements remain exploratory memorandums and technical scoping studies rather than binding, multi-year take-or-pay power purchase or heat purchase contracts."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"

  - id: "customer-journey-retention-and-concentration-risks"
    title: "Customer Journey, Off-Take Durability, and Concentration Risks"
    body: "The customer adoption journey for Gen-IV advanced modular reactors spans more than a decade, beginning with strategic equity syndication and technical feasibility studies before progressing through non-nuclear validation, site licensing, and commercial commissioning. Customer retention and lifetime value in nuclear energy are structurally high once a plant is constructed, driven by 40- to 60-year asset operating lifespans and dedicated MOX fuel supply cycles. However, Newcleo faces severe pre-construction counterparty friction: industrial off-takers face high balance-sheet exposure and regulatory uncertainty when committing to first-of-a-kind reactor technologies. Navigating multi-jurisdictional licensing across France, Italy, Slovakia, the United Kingdom, and the United States creates substantial schedule concentration risk, where a delay in host licensing directly postpones commercial adoption across the entire partner cohort."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
    figureRefs:
      - "FU001"

