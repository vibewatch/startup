        title: Customer Workflow and Product-Line Map
        blocks:
          - type: paragraph
            body: >-
              XAG’s products make the most sense when translated into field workflow rather than catalog labels. The
              public stack begins with aerial application and mapping, extends into ground robotics for orchards and
              greenhouses, reaches traditional machinery through APC2 automated steering, and then continues into
              irrigation and monitoring with smart-farm IoT modules. That is materially broader than a single drone
              line. Public pages show a coherent effort to cover crop management jobs across different terrain and
              different points in the agricultural cycle: mapping and scouting, route planning, spraying and spreading,
              ground application where aircraft are less suitable, and water or nutrient control after the aircraft
              leaves. This breadth is meaningful because it changes the product from a tool into an operating system
              candidate for agricultural work. The caveat is that public evidence on actual revenue and deployment
              maturity is much better for the lead drone family than for every adjacency.
