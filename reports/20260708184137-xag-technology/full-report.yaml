              - CM027
      - number: '2.5'
        title: Constraints, Regulation, and Adoption Frictions
        blocks:
          - type: paragraph
            body: >-
              The category is growing, but it is not frictionless. Regulatory approval for spraying and heavier payloads
              is uneven across jurisdictions, and privacy or data-governance rules raise compliance requirements as
              drones gather more imagery and operational data. Tariffs on key components such as batteries and sensors
              can lift system costs. Pilot shortages and training burdens still limit deployment in some markets.
              Competitive pressure is also intensifying. Yicai's reporting on falling agricultural-drone prices in China
              and ChinaBizInsider's focus on DJI pressure both point to a commoditization risk at the hardware layer.
              That is one reason why service models and software differentiation matter: they can protect adoption when
              hardware pricing becomes more aggressive. The broad implication is that agricultural drones are
              attractive, but not automatically high-margin, and market-size forecasts should be read alongside the
              category's clear cost, regulatory, and pricing headwinds.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM029
              - CM035
              - CM036
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Adjacents, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              XAG does not compete in a single neat peer set. The most direct comparison is DJI Agriculture because both
              companies sell agricultural aircraft and aim to own meaningful parts of the operator workflow. But the
              buyer can also solve similar jobs through service providers, software-led agronomy platforms, incumbent
              precision-agriculture suites, or the status quo of tractors and manual spraying. That means a real
              competitor map has to include drone-first peers such as DJI and Hylio, services-first operators like
              Rantizo, agronomic-intelligence vendors like Sentera and Taranis, and incumbent connected-farm platforms
              like PTx Trimble. The key distinction is not whether each vendor sells a drone. It is whether each vendor
              competes for the same economic decision: who owns field insight, application workflow, and the farmer
              relationship. This broader frame matters because XAG’s outcomes can be displaced by a superior channel,
              analytics layer, or service model even when its hardware is technically strong.
            claimRefs:
