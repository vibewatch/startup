              - CV026
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV020
              - CV023
              - CV024
              - CV025
              - CV026
              - CV033
      - number: '8.5'
        title: Diligence Triggers, Entry Discipline, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              The call could move positively with a relatively small set of missing data: cohort retention, partner
              economics, product-level gross margins, country-level revenue quality, and a clearer capital and dilution
              picture. Those are tractable diligence asks, which is why the right stance is not avoid forever but do
              more work before paying up. The negative side is equally clear. If those asks reveal heavy partner
              concentration, weak repeat use, renewed cash stress, or purely marketing-led adjacent products, the
              valuation case weakens materially. Exit readiness is also nuanced. A listing path exists, but a listing
              event alone does not validate valuation. The more important exit question is whether public-market
              investors would see XAG as a durable ag-automation platform or simply as a hardware name with a cyclical
              multiple ceiling. Until that is clearer, investors should keep entry discipline tight and map thesis-break
              triggers explicitly.
            claimRefs:
