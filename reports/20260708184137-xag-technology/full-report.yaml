      - number: '1.2'
        title: Founder, Leadership, and Governance Surface
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is unusually strong. Peng Bin was publicly described as a Microsoft Most Valuable
              Professional and as a long-time aviation-model and robotics enthusiast before launching XAircraft. The
              Hong Kong filing and multiple press recaps position him as founder, chairman, and president, while
              co-founder Gong Jiaqin remains a senior operating leader. The March 2026 filing disclosed a six-member
              board with three executive directors and three independent non-executive directors, plus Huang Dan in a
              combined finance and company-secretary role. That is enough to confirm a more institutional governance
              setup than earlier venture-stage companies typically disclose, but it is still not enough for a full
              governance underwrite. Public sources do not clearly spell out committee composition, voting protocols, or
              how independent directors will shape risk oversight after listing. That gap is material because XAG is
              moving from founder-led private control toward public-market accountability while still relying heavily on
              Peng Bin as the strategic narrative owner and controlling shareholder.
