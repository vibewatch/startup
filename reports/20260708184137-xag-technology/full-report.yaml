      - number: '4.3'
        title: GTM Motion, Overseas Mix, and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              XAG’s go-to-market motion appears to rely substantially on channels, distributors, and overseas market
              development. That matters financially because distributor-heavy hardware businesses can scale faster
              without building a fully direct global field force, but they also obscure realized pricing, support cost,
              and partner economics. Public evidence suggests overseas sales have become a meaningful contributor, with
              iTiger citing roughly RMB 370 million of overseas revenue in 2024 and Caixin citing 25.2% mix in
              first-half 2025. This is a double-edged signal. On one hand, it shows demand beyond China and reduces
              single-market dependence. On the other, it introduces FX, trade-policy, localization, and
              service-complexity risk. Because pricing is opaque, investors cannot cleanly separate whether overseas
              growth is adding premium mix or simply volume. Revenue quality is therefore improving, but still partly a
              channel-and-region black box.
