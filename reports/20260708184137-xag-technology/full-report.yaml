      - number: '4.5'
        title: Financial Verdict and Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, XAG looks materially improved but not fully de-risked. The bull case is
              straightforward: audited revenue and margin gains, a real swing to profit, growing overseas mix, and a
              broader portfolio that could monetize more of the farm-automation stack over time. The bear case is just
              as clear: drones still dominate revenue, pricing remains opaque, private unit economics are largely
              unavailable, and profitability could be squeezed again by competition or renewed R&D intensity. The
              practical implication is that the topline and gross-margin trend are supportable, but the underwrite is
              still blocked on core private metrics. Investors need CAC and channel economics, inventory and warranty
              data, product-level margin breakdowns, and better evidence on how resilient profits remain if XAG chooses
              to defend share aggressively. Until then, the business should be treated as financially credible and still
              capital-sensitive rather than fully proven.
