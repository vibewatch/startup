      - number: '4.4'
        title: Capital Adequacy, Working Capital, and Cash Flow
        blocks:
          - type: paragraph
            body: >-
              XAG’s capital story is better than it looked during the pre-profit years, but it is not fully settled.
              iTiger’s summary of prospectus data suggests operating cash flow recovered strongly into 2024 before
              slipping back into outflow in first-half 2025, while cash reserves remained in the mid-hundreds of
              millions of renminbi. That profile is not distressed, yet it does not prove the company has reached
              self-funding stability either. The planned use of IPO proceeds reinforces the point. Management is not
              raising capital simply to smooth timing; it wants to fund next-generation R&D, expand the global sales
              network, construct a new headquarters and R&D center, and support working capital. Those are growth
              investments, but they also confirm that the business remains capital-sensitive. Balance-sheet excerpts
              showing expanding current assets and liabilities are directionally consistent with inventory, receivables,
              and other working-capital needs that belong to a manufacturing-led model.
