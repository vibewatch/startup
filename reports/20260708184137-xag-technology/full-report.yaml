              - CM033
      - number: '2.2'
        title: Sizing Lenses and Why Published Estimates Conflict
        blocks:
          - type: paragraph
            body: >-
              No single market-size number should be treated as authoritative. Research and Markets estimated a $4.41
              billion global agriculture-drone market in 2026, Coherent Market Insights put the comparable category at
              $7.17 billion, and Global Market Insights estimated a narrower $2.9 billion precision-agriculture-drone
              segment for 2026. Those gaps are too large to ignore, but they are explainable. Some reports count only
              hardware revenue; others effectively blend software, data, and service layers. Some are agriculture-drone
              specific, while others move toward the wider precision-agriculture stack. Investors should therefore treat
              the market as a range rather than a point estimate. The strongest directional conclusion is not the exact
              dollar figure but the fact that every source expects continued growth, supported by automation demand,
              food-security pressure, and the spread of precision-farming workflows. The market is already large enough
              to support multiple scaled vendors, yet still fragmented enough that category definitions remain
              unsettled.
