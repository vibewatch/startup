      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that many of XAG’s risks are legible and monitorable. The company already shows some
              mitigation surfaces: product documentation, training pathways, regulatory proof points, partner
              enablement, and a broader portfolio that reduces pure single-SKU exposure. But mitigation maturity is
              uneven. Public evidence is strongest where the company controls the narrative—manuals, launches, selected
              partner stories—and weakest where investors need hard accountability, such as reliability, retention, or
              partner economics. That is why the kill criteria must be explicit. If margins compress sharply, if cash
              conversion breaks again, if Brazil or Southeast Asia stall as growth engines, or if regulatory tightening
              reduces deployment viability, the thesis weakens materially. The risk chapter therefore supports a “high
              but understandable” risk rating: XAG is not opaque chaos, but it is still a capital-sensitive,
              regulation-shaped, partner-dependent operator.
            claimRefs:
