  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The agricultural-drone market in 2026 is best understood as a hardware-led automation category built
              around aerial spraying, spreading, scouting, mapping, and crop-health monitoring. Most market reports
              agree on those core tasks, but they disagree on whether to include software analytics, managed services,
              and adjacent precision-agriculture systems such as tractor guidance or sensor networks. That definitional
              drift matters because it changes the size of the addressable market by billions of dollars. A
              hardware-only spraying lens produces a smaller market than a broader precision-agriculture-drone lens that
              bundles analytics and services. The adjacent ecosystem also includes software-first and guidance-first
              vendors such as Taranis, Sentera, and PTx Trimble, plus drone-service specialists like Rantizo and
              hardware-centric manufacturers like Hylio. Status-quo substitutes remain meaningful: backpack sprayers,
              tractor rigs, manned crop-dusting aircraft, and manual scouting are still economically relevant in many
              geographies. Agricultural drones win where precision, timing, access, or labor scarcity outweigh their
              aviation, training, and capex burden.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM028
              - CM033
          - type: table
            tableRef: TM001
            claimRefs:
