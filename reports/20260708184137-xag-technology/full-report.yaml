companyProfile:
  summary: >-
    XAG Technology, formerly XAircraft, is a Guangzhou-based agricultural robotics company founded in 2007 by Peng Bin.
    The company evolved from consumer and industrial drone experimentation into a full-stack smart agriculture platform
    spanning crop-spraying drones, agricultural rovers, tractor autopilot consoles, remote-sensing systems, and
    smart-farm IoT products. XAG has built a large distributor-led footprint across China and overseas markets, achieved
    profitability in 2024, and re-filed for a Hong Kong IPO in March 2026 after an earlier filing lapsed.
  foundedDate: '2007-01-01'
