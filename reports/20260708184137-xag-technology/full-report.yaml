  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              The right recommendation on the current public record is not a generic good-company verdict. It is a
              price-sensitive, evidence-sensitive stance. XAG has enough proof to justify constructive interest: audited
              revenue and profit improvement, broad product scope, real overseas deployments, and a still-large category
              opportunity. But it does not have enough public disclosure to justify high-conviction underwriting at the
              top end of the valuation marks circulating in the market. Customer durability, channel economics,
              product-level margin quality, and dilution overhang remain too incomplete. That is why the recommendation
              is best framed as track or research more rather than buy. Confidence should be medium because the company
              quality is real, but the valuation support is not yet clean. Risk rating should remain high because the
              upside case still depends on regulation, channels, hardware margins, and capital discipline rather than on
              a simple software-like recurring-revenue engine.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV038
              - CV039
              - CV040
          - type: table
