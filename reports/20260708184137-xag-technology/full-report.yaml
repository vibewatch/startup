      - number: '3.3'
        title: Adjacents, Services, and Incumbent Platform Risk
        blocks:
          - type: paragraph
            body: >-
              Several meaningful rivals do not need to beat XAG aircraft-for-aircraft. Rantizo can win when a grower
              wants aerial application outcomes without building an internal aviation capability. Sentera and Taranis
              can win when the budget owner is agronomy, seed, retail, or research and the highest-value problem is
              imagery, crop-health insight, and workflow collaboration. PTx Trimble can influence buying by embedding
              guidance, machine connectivity, and digital-farm workflows across the broader operation. These rivals
              matter because they compete for control of the same decision layers that ultimately shape drone adoption:
              data, training, channel, and repeat workflow value. In practice that means XAG can coexist with them, but
              coexistence is not always strategically favorable. Multi-homing dilutes platform control, and service-led
              or analytics-led layers can absorb margin or buyer mindshare upstream from the drone itself.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP023
              - CP024
              - CP025
              - CP028
              - CP031
              - CP034
      - number: '3.4'
        title: Pricing Transparency, Distribution Power, and Switching Cost
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is weak almost everywhere in this landscape. Most vendors route prospects to
              dealers, demos, annual-license conversations, or custom enterprise quotes. That means buyers likely
              negotiate based on geography, channel, agronomy needs, and service support, but outside observers cannot
              benchmark discounts or margin structure well from public materials alone. Distribution therefore matters
              as much as list-price visibility. XAG’s distributor recruitment and overseas reporting show that channel
              reach is a real asset; DJI’s case-study density and global report also point to scale advantages; Hylio’s
              government-friendly positioning may improve access in regulated US contexts. Switching costs are
              meaningful because operators must relearn route planning, workflow tooling, maintenance, and sometimes
              integrations. Still, they are not absolute. A grower can own hardware from one vendor, buy spraying
              services from another, and use a third analytics layer, making the category more stackable than locked.
            claimRefs:
