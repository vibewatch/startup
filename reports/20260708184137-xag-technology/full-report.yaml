      - number: '2.4'
        title: Growth Drivers and Why the Category Keeps Expanding
        blocks:
          - type: paragraph
            body: >-
              Three demand drivers repeat across nearly every source. First, labor pressure is real: farms need more
              output with fewer available workers, and drones let operators cover larger areas with less manual exposure
              to chemicals and repetitive fieldwork. Second, ROI is increasingly quantifiable. Public materials
              repeatedly cite faster field coverage, meaningful water savings, lower chemical waste, reduced soil
              compaction, and in some cases better yields when spraying is more targeted. Third, technology is widening
              what buyers think drones can do. AI analytics, multispectral imaging, RTK navigation, autonomous routing,
              and fleet management make the category more than an aerial spraying substitute. That is why market
              narratives increasingly emphasize integrated workflows rather than standalone aircraft. As these
              capabilities improve, the category becomes easier to justify not just for crisis labor replacement but as
              a broader precision-farming operating layer.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
          - type: table
            tableRef: TM004
            claimRefs:
