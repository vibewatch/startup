  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Concentration
        blocks:
          - type: paragraph
            body: >-
              XAG’s public financial story is still dominated by product revenue rather than by disclosed recurring
              software contracts. The audited numbers in the Hong Kong prospectus show strong topline growth from 2023
              through 2025, but outside coverage makes clear that agricultural drones remain the overwhelming revenue
              driver. Public sources repeatedly cite drones at roughly 88–89% of sales, which means the newer
              categories—rovers, autopilot systems, and smart-farm IoT—matter more strategically than financially at
              current scale. The product portfolio is broad enough to support multiple monetization vectors, yet the
              company has not publicly disclosed a recurring-software-like revenue mix that would materially de-risk
              concentration. In that sense, XAG looks like a scaled agricultural-hardware platform with adjacent
              modules, not like an asset-light data business. The revenue model can expand, but the present-day
              financial engine still depends on how well XAG sells and services physical equipment through its channels.
