      - number: '7.2'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, XAG carries the classic burdens of a scaled field-hardware company. The product family is
              broad, which is strategically attractive but operationally complex: more SKUs, more attachments, more
              manuals, more spare parts, and more field-service scenarios. That complexity becomes risk when reliability
              data is sparse. Public sources show manuals, training surfaces, and capability claims, but they do not
              show a robust reliability dataset, recall history, or service-resolution performance. Security and privacy
              are similar. The company clearly aspires to more connected-farm workflows, yet public trust disclosure is
              thinner than public product marketing. Add training dependence, weather-window sensitivity, and
              hardware-support intensity, and the operational risk picture becomes clear: XAG’s systems may work well in
              the field, but investors still need proof on how often they fail, how quickly they recover, and how
              support cost scales.
