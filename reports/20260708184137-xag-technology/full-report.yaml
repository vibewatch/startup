        title: Differentiation, IP, and Technical Signal
        blocks:
          - type: paragraph
            body: >-
              XAG’s differentiation case is built around system breadth and applied field automation rather than a
              single breakthrough component. Public materials repeatedly emphasize RTK navigation, autonomous flight,
              atomization, machine guidance, and smart-farm control as one connected platform. That story is stronger
              when combined with the prospectus and patent-proxy evidence showing a large authorized patent base and
              years of engineering work across multiple core domains. For a hardware-heavy company with little public
              open-source presence, the closest developer-signal proxy is not GitHub velocity but engineering output
              visible through patents, manuals, field trials, and partner deployments. This is not perfect evidence.
              Patent counts do not automatically prove product superiority, and partner trials do not prove commercial
              dominance. But together they do support the view that XAG’s technical position is substantive rather than
