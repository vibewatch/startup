              - CV005
              - CV007
              - CV009
              - CV033
      - number: '8.2'
        title: Valuation Context and What the Public Marks Imply
        blocks:
          - type: paragraph
            body: >-
              The public valuation context is messy, not definitive. Multiple sources point to a roughly RMB 7.3 billion
              unicorn-style mark, while other Chinese coverage cites a higher figure around RMB 10.5 billion. Those are
              not trivial differences. On 2025 prospectus revenue of RMB 1.166 billion, they imply trailing
              price-to-sales ratios of about 6.3x and 9.0x respectively. On 2025 net profit of RMB 123.8 million, they
              imply trailing P/E ratios of roughly 59x and 85x. That is a wide band for a hardware-led company that
              still faces margin and regulatory risk. The figures are not impossible if investors believe XAG is on the
              edge of durable global scale, but they are aggressive enough that missing retention and channel data
              matter. The valuation question is therefore not whether XAG deserves to be worth something significant; it
              is whether the public record proves enough quality to support the upper end of the mark range today.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Comparable Set and Why It Is Imperfect
        blocks:
          - type: paragraph
            body: >-
              Public comparables are helpful but structurally imperfect. Deere, AGCO, CNH, and Komatsu are larger
              agricultural or machinery incumbents with diversified revenue, established dealer networks, and much
              greater scale. Trimble and Hexagon provide precision-workflow and industrial-digital context, but they are
              not agricultural-drone businesses. EHang is closer on autonomous-aircraft narrative but not on
              agricultural economics. That mismatch matters because it prevents false precision. The comparable set is
              still useful for humility. It shows that investors do not have a clean public benchmark for a company
              exactly like XAG, which should reduce confidence in sharp private-company marks rather than increase it.
              The best use of the comp set is to triangulate how much execution and margin durability XAG would need
              before it earns a sustained premium-multiple narrative.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV031
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV031
              - CV034
              - CV035
              - CV036
              - CV037
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes that audited profitability is the beginning of a durable curve rather than a
              temporary high-water mark, that overseas growth continues to diversify the business, and that adjacent
              modules such as rover, autopilot, and IoT improve the quality of each customer relationship. In that
              world, XAG could plausibly grow into or beyond the higher end of its publicized mark range. The base case
              assumes that profitability remains real but the market still values the company as a hardware-heavy,
              regulation-shaped operator with only partial recurring economics. In that scenario, the Hurun-style range
              is more defensible than the higher figure. The bear case assumes price pressure, slower cash conversion,
              and insufficient proof that customer durability or product breadth actually improves economics. In that
              world, even the lower publicized marks could prove rich.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV003
