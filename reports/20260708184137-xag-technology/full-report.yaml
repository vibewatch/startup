        title: People, Execution, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              The execution and financial model risks are unusually central to the XAG thesis. This is still a
              founder-shaped company, with specialized technical work, a hardware-heavy operating model, and a need to
              balance R&D, support, and channel scale. Public cash-flow summaries show improvement, but not enough
              stability to call the model fully self-funding. Price competition in China and aggressive rival response
              from DJI could quickly pressure margins. Working capital, inventory, and overseas expansion all consume
              cash before they reliably return it. The risk is not simply “burn” in a generic startup sense; it is the
              combination of hardware margin sensitivity and execution-heavy growth. If XAG under-invests in technology,
              it risks losing share. If it over-invests while pricing weakens, it risks giving back profitability. That
              tension is the core financial-model risk.
