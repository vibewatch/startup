  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The most important regulatory risk is not whether XAG can obtain any approvals, but whether the company
              can repeatedly translate one-jurisdiction success into many-jurisdiction operating permission. The UK
              authorization story is helpful because it proves at least one real threshold was crossed. The IRRI context
              is equally important because it shows that regulatory and protocol constraints remain active adoption
              bottlenecks elsewhere. In other words, XAG’s addressable market is not just a demand question; it is a
              permissions-and-training question. Legal risk is harder to observe. Public evidence does not show an
              active litigation overhang, yet the prospectus and patent footprint imply a business that increasingly
              needs to protect IP and manage product-liability exposure. The absence of public legal drama is not the
              same as proof of low legal risk, especially in a global agricultural robotics business operating near
              chemical application, safety, and export-control boundaries.
