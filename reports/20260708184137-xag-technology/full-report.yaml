      - number: '4.2'
        title: Growth, Margin Expansion, and What It Likely Means
        blocks:
          - type: paragraph
            body: >-
              The public record supports a genuine financial improvement from 2023 to 2025. Revenue rose sharply, gross
              profit expanded even faster, gross margin almost doubled, and the company crossed from net loss into
              audited net profitability. That is better quality than a simple “growth at any cost” story. At the same
              time, the likely explanation is still hardware-economics improvement rather than a structural transition
              to a higher-multiple business model. Reporting from ChinaBizInsider and iTiger points to supply-chain
              optimization, standardization, operating discipline, and scaling effects as the main drivers. That
              interpretation fits the data: margin improvement arrived alongside operational tightening and a focus on
              core products. The question for investors is whether this is the beginning of a durable margin staircase
              or a temporary high-water mark reached before price wars and reinvestment intensity return.
