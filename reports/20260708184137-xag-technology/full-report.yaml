              one kind of farm. Named proofs include a Vietnamese specialty-crop grower managing a four-hectare
              durian-oriented farm, a Brazilian mixed-crop family operation with hundreds of hectares across coffee,
              grapes, soy, and corn, and the institutional rice-research ecosystem around IRRI in the Philippines.
              Public materials also show that XAG depends materially on local partners, distributors, and service
              networks to translate demand into deployment. That matters because the customer journey looks channel-led:
              awareness comes through trade shows, peer examples, and partner outreach; evaluation runs through local
              product support or training; deployment succeeds when the customer can actually learn the operating model
              quickly; and advocacy shows up via testimonials and partner case studies. This is not the same as a pure
