        title: Trust, Safety, Compliance, and the Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the public record is not product breadth; it is trust transparency. XAG can point to
              product manuals, partner validation, and at least one operational authorization story in the UK. Yet the
              reviewed public surfaces are far thinner on privacy architecture, security controls, formal reliability
              metrics, incident reporting, and global regulatory coverage. That does not prove a weakness, but it leaves
              unresolved diligence risk. Precision-agriculture hardware deployed in real fields depends on operator
              training, firmware quality, local permissions, and reliable support. XAG appears credible on field
              usefulness and engineering depth, but incomplete on the public evidence that a skeptical enterprise or
              regulator would want before calling the system broadly de-risked. The product-tech verdict is therefore
              positive on maturity and differentiation, with a clear caveat on trust, reliability, and internal-software
