        title: Scale, Global Footprint, and Operating Maturity
        blocks:
          - type: paragraph
            body: >-
              Scale is now clearly beyond the venture proof-of-concept stage. The March 2026 prospectus disclosed
              RMB1.166 billion of 2025 revenue, RMB123.8 million of 2025 net profit, and 35.7% gross margin after a
