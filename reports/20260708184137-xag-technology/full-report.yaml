      - number: '3.2'
        title: XAG Versus Direct Drone-First Rivals
        blocks:
          - type: paragraph
            body: >-
              Against drone-first rivals, XAG’s strongest public argument is breadth. The company is not only presenting
              aircraft. Its public stack now includes heavy-lift spreading and logistics capability on the P150 Max,
              ground robots such as the R200 for orchards and greenhouses, APC2 auto-steering for farm machinery, and
              smart-farm valves, injectors, and cameras. That breadth is strategically important because it lets XAG
              pitch itself as a farm-automation partner rather than as a single-SKU drone maker. DJI, however, remains
              the clearest scale benchmark. Third-party sources repeatedly position DJI and XAG among the category
              leaders, while DJI’s own annual report reinforces the perception of a large installed base and deep
              case-study coverage. Hylio sits differently: it emphasizes US design, manufacturing, security posture, and
              NDAA compliance, giving it a geopolitical and procurement wedge even if its public product narrative is
              narrower than XAG’s. The net effect is that XAG looks broader than most specialists, but not obviously
              more powerful than DJI on distribution or brand.
