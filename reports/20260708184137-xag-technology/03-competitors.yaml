- id: adjacents-and-incumbents
  title: Adjacents, Services, and Incumbent Platform Risk
  body: 'Several meaningful rivals do not need to beat XAG aircraft-for-aircraft. Rantizo can win when a grower wants aerial application outcomes without building an internal aviation capability. Sentera and Taranis can win when the budget owner is agronomy, seed, retail, or research and the highest-value problem is imagery, crop-health insight, and workflow collaboration. PTx Trimble can influence buying by embedding guidance, machine connectivity, and digital-farm workflows across the broader operation. These rivals matter because they compete for control of the same decision layers that ultimately shape drone adoption: data, training, channel, and repeat workflow value. In practice that means XAG can coexist with them, but coexistence is not always strategically favorable. Multi-homing dilutes platform control, and service-led or analytics-led layers can absorb margin or buyer mindshare upstream from the drone itself.'
