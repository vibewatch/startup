- id: pricing-distribution-and-switching
  title: Pricing Transparency, Distribution Power, and Switching Cost
  body: Public pricing evidence is weak almost everywhere in this landscape. Most vendors route prospects to dealers, demos, annual-license conversations, or custom enterprise quotes. That means buyers likely negotiate based on geography, channel, agronomy needs, and service support, but outside observers cannot benchmark discounts or margin structure well from public materials alone. Distribution therefore matters as much as list-price visibility. XAG’s distributor recruitment and overseas reporting show that channel reach is a real asset; DJI’s case-study density and global report also point to scale advantages; Hylio’s government-friendly positioning may improve access in regulated US contexts. Switching costs are meaningful because operators must relearn route planning, workflow tooling, maintenance, and sometimes integrations. Still, they are not absolute. A grower can own hardware from one vendor, buy spraying services from another, and use a third analytics layer, making the category
    more stackable than locked.
  claimRefs:
  - CP017
  - CP020
  - CP021
  - CP025
  - CP026
  - CP031
  - CP032
