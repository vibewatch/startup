  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Standardized realized pricing by drone model, software layer, and geography across XAG, DJI, Hylio, and service competitors.
    whyItMatters: Without real deal data, it is hard to distinguish premium pricing power from channel noise or temporary discounting.
    diligencePath: Collect distributor quotes, customer invoices, and product-level ASP trends by region and crop.
    relatedQuestionRefs:
    - QP022
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: Independent win-loss data showing which competitor classes beat XAG most often by crop, geography, and buyer type.
    whyItMatters: The category is multi-layered, so generic competitor mentions do not reveal where XAG is truly strong or weak.
    diligencePath: Request sales pipeline, churn, and loss-reason data segmented by DJI, service providers, and software-first adjacencies.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: market-share
    missingEvidence: A single like-for-like market-share dataset covering both China and global agricultural-drone shares with consistent definitions.
    whyItMatters: Different studies rank leaders with different category scopes, complicating moat conclusions.
    diligencePath: Reconcile filing, analyst, and company-market-share claims into one adjusted competitive-share view.
    relatedQuestionRefs:
    - QP003
