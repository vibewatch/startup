  - FE003
- id: maturity-and-roadmap
  title: Product Maturity, Release Cadence, and External Proof
  body: 'The public release cadence suggests a living product program rather than an aging installed base. XAG’s news center and AgroPages coverage show active updates across higher-payload aircraft, rovers, and ecosystem modules. That said, maturity is uneven by module. Core aircraft and control systems look commercial and well documented. Newer hardware such as the P150 Max appears more like active rollout than long-settled installed base. External proof exists, but it is selective. Harper Adams and IRRI provide credible partner evidence that XAG technology is being used in substantive agronomic contexts, and the UK authorization story shows the company can cross at least one meaningful operational-control threshold. What remains thin is the fine-grained proof: long-run fleet reliability, firmware stability, support responsiveness, and production-scale defect rates are not public.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE019
  - CE021
  - CE023
  - CE024
  - CE033
  - CE034
  tableRefs:
