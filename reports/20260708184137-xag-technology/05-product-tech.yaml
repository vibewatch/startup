- id: architecture-and-operations
  title: Architecture and Operating Model
  body: The technical picture visible from public sources is hardware-led, but not hardware-only. XAG’s operating model depends on aircraft or rover hardware, controllers, route-planning and navigation logic, sensor inputs, and task-specific modules such as spreaders, smart valves, injectors, or cameras. APC2 adds another layer by translating XAG’s automation logic into conventional farm machinery. The result is a stack that looks more like a field-automation architecture than a set of isolated devices. Still, the public record only partly exposes the internals. It shows the operating surfaces—RTK positioning, autonomous routes, imaging, video transmission, and task execution—but not the deeper software architecture or data-rights model behind them. Investors can see enough to believe there is a real system here; they cannot fully inspect how resilient, proprietary, or transferable that system is without more technical diligence.
  claimRefs:
  - CE008
  - CE010
  - CE011
  - CE012
  - CE013
  - CE025
  - CE028
  - CE032
