  evidenceGaps:
  - type: missing-source
    severity: material
    topic: software-architecture
    missingEvidence: Independent technical disclosure on firmware architecture, data rights, security design, and update process.
    whyItMatters: These layers determine reliability, lock-in, and cyber / privacy posture, but remain largely hidden behind product marketing.
    diligencePath: Request architecture reviews, update cadence, incident logs, and data-governance documentation.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Fleet-level uptime, defect rates, warranty claims, and field failure history by major SKU.
    whyItMatters: Breadth and autonomy claims matter only if systems stay reliable across seasons and conditions.
    diligencePath: Obtain service records, MTBF-style proxies, warranty reserves, and distributor service logs.
    relatedQuestionRefs:
    - QE013
    - QE018
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: A stronger practitioner-community or engineering-signal surface beyond patents and public partner posts.
    whyItMatters: Hardware-heavy companies often lack GitHub-style evidence, but investors still benefit from an external engineering signal.
    diligencePath: Look for public engineer talks, conference papers, or recruiting posts tied to autonomy, controls, and IoT subsystems.
    relatedQuestionRefs:
    - QE024
