  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: A reconciled definition set showing exactly which reports include software and services in 2026 market totals.
    whyItMatters: Without that bridge, investors can overstate or understate market size by several billion dollars and misjudge penetration rates.
    diligencePath: Obtain methodology notes from the major analyst reports and restate them into a like-for-like hardware-only and hardware-plus-software range.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: service-layer-monetization
    missingEvidence: Reliable public data on average software or service attach rates to agricultural-drone deployments.
    whyItMatters: The highest-value part of the market may sit outside hardware, but public sources do not quantify that layer cleanly.
    diligencePath: Interview distributors, service operators, and channel partners on attach rates and recurring revenue share.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: category-expansion
    missingEvidence: Independent evidence that quantifies how much value broader autonomous farm workflows add beyond spraying hardware.
    whyItMatters: The category narrative increasingly depends on ecosystem expansion, yet public revenue decomposition remains weak.
    diligencePath: Seek partner case studies and segment disclosures that break out mapping, autonomy, and software revenue separately from spray hardware.
    relatedQuestionRefs:
    - QM025
