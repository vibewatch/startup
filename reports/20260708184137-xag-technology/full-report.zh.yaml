      - number: '2.4'
        title: 增长驱动与品类持续扩张的原因
        blocks:
          - type: paragraph
            body: >-
              几乎所有来源都会反复出现三类需求驱动。第一，劳动力压力真实存在：农场需要用更少可用工人产出更多，无人机让操作者用更少人工接触化学品和重复田间劳动，覆盖更大面积。第二，ROI
              越来越可量化。公开材料反复提到更快的田间覆盖、显著节水、减少化学品浪费、降低土壤压实，以及在某些情况下，喷洒更精准后带来更好产量。第三，技术正在扩大买方对无人机能力边界的想象。AI 分析、多光谱成像、RTK
              导航、自主路线规划和机队管理，让这个品类不只是空中喷洒替代品。因此，市场叙事越来越强调一体化工作流，而非独立飞行器。随着这些能力改善，无人机不只在劳动力危机时更容易被合理化，也会成为更宽的精准农业运营层。
            claimRefs:
