      - number: '7.5'
        title: 缓释、监控与否决条件
        blocks:
          - type: paragraph
            body: >-
              好消息是，XAG 的许多风险可读、可监控。公司已经展示了一些缓释界面：产品文档、培训路径、监管证明点、伙伴赋能，以及降低纯单 SKU
              敞口的更宽产品组合。但缓释成熟度并不均衡。公开证据在公司掌握叙事的地方最强——手册、发布、精选伙伴故事；在投资者需要硬问责的地方最弱，例如可靠性、留存或伙伴经济性。因此，否决条件必须明确。如果利润率大幅压缩，如果现金转化再次断裂，如果巴西或东南亚作为增长引擎停摆，或如果监管收紧削弱部署可行性，投资论点都会显著变弱。因此，风险章节支持“高但可理解”的风险评级：XAG
              不是一团不透明的混乱，但它仍是一家对资本敏感、受监管塑形、依赖伙伴的运营商。
