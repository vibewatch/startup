      - number: '3.5'
        title: 护城河耐久性与主要竞争风险
        blocks:
          - type: paragraph
            body: >-
              XAG 的护城河看起来真实但中等。产品宽度是真差异化，果园加自动转向加 IoT 的叙事，也比多数纯软件或纯服务对手更强。但这种宽度并没有消除最重要的竞争风险。DJI
              仍在直接农业飞行器中构成规模和装机基础挑战。中国无人机价格下行显示，硬件层已经有实时商品化压力。Rantizo 等服务主导模式可以降低种植者承诺平台所有权的必要性，PTx Trimble
              等既有系统则可能把战略控制留在导航和数字农场层。可能的结论是，XAG
              最适合在买方重视一体化农场自动化和田间运营，而不只是最便宜飞行器的场景中获胜。即便如此，公开证据仍未回答这种优势在不同作物、不同地区和不同定价条件下能有多耐久。
