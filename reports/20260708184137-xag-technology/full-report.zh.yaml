      - number: '1.5'
        title: 里程碑、IPO 路径与主要未决问题
        blocks:
          - type: paragraph
            body: >-
              XAG 的里程碑曲线亮眼，但并非无风险。公司在 2015–2016 年推出第一代农业无人机，2019–2020 年扩展到自动驾驶和 IoT 系统，2021–2022 年拓宽机器人矩阵，并在 2025 年推出 R
              Series 地面机器人。它也通过英国 CAA 农业喷洒授权、中国产业政策奖项，以及官方时间线引用的 FAO 相关认可，积累了外部背书。资本市场路径上，XAG 曾先尝试登陆上海 STAR Market，2022
              年撤回；之后在 2025 年 9 月 25 日递交香港上市申请，并在首次申请失效后于 2026 年 3 月 26 日重新申报。公开估值信号并不一致：独角兽榜单引用集中在 RMB7.3 billion 到
              RMB10.5 billion 之间，而 ChinaBizInsider 引用的 2025 年 7 月老股转让只隐含约 RMB4.6 billion。这个差距并不否定 XAG
              的运营进展，但提醒投资者，公开市场进入叙事很可能不只看势头，还会围绕质量和价格展开争论。
