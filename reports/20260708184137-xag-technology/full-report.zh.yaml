      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配度异常强。公开资料称，Peng Bin 在创办 XAircraft 前就是 Microsoft
              MVP，也是长期的航模和机器人爱好者。香港申报文件和多篇媒体回顾都把他列为创始人、董事长兼总裁，联合创始人 Gong Jiaqin 仍是高级运营负责人。2026 年 3
              月申报文件披露董事会有六名成员，包括三名执行董事和三名独立非执行董事，Huang Dan 则同时负责财务和公司秘书职能。这足以确认 XAG
              的治理设置比早期风险投资阶段公司更制度化，但还不足以完成完整治理判断。公开资料没有清楚说明委员会构成、投票机制，或上市后独立董事将如何参与风险监督。这个缺口很重要，因为 XAG
              正在从创始人主导的私营控制走向公开市场问责，同时仍高度依赖 Peng Bin 作为战略叙事主导者和控股股东。
