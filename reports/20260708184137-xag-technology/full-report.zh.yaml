        title: 买方分层与客户旅程
        blocks:
          - type: paragraph
            body: >-
              XAG 的公开客户证据指向一个出乎意料多元的买方基础。公司服务的不是单一种类农场。具名证据包括一位越南特色作物种植者，管理一个 4
              公顷、以榴莲为主的农场；一个巴西混合作物家族农场，在数百公顷土地上种植咖啡、葡萄、大豆和玉米；以及菲律宾 IRRI 周边的制度化水稻研究生态。公开材料也显示，XAG
              在很大程度上依赖本地伙伴、经销商和服务网络，把需求转化为部署。这很重要，因为客户旅程看起来由渠道牵引：认知来自展会、同行案例和伙伴触达；评估依赖本地产品支持或培训；部署能否成功，取决于客户能否快速学会运营模式；拥护则体现在证言和伙伴案例研究中。这不同于纯直营销售模式，也很可能影响转化和留存行为。
