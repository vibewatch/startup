  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 如何冲击论点
      - 操作含义
    rows:
      - - 毛利率压缩
        - 持续回落至 20% 出头或更低
        - 削弱「XAG 已跨入可持续硬件盈利」的判断
        - 向熊市情景重估
      - - 现金转化回落
        - 经营现金流多次转负，现金储备收缩
        - 推高融资依赖和稀释风险
        - 收紧仓位或放弃入场
      - - 渠道集中度冲击
        - 巴西 / 东南亚伙伴表现明显不及预期
        - 打伤海外增长论点和客户质量叙事
        - 暂停为增长定价
      - - 监管受挫
        - 重点喷洒无人机市场出现实质限制
        - 缩小可落地 TAM，抬高扩张成本
        - 下调估值区间
      - - 相邻产品表现不及预期
        - 无人车 / 自动驾驶 / IoT 商业规模仍可忽略
        - 削弱平台宽度溢价
        - 更接近按单一品类硬件厂商估值
