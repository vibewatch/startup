      - number: '1.4'
        title: 规模、全球足迹与运营成熟度
        blocks:
          - type: paragraph
            body: >-
              规模已经明显越过风险投资概念验证阶段。2026 年 3 月招股书披露，2025 年收入为 RMB1.166 billion，2025 年净利润为 RMB123.8 million；在 2023
              年后毛利率强劲修复后，毛利率达到 35.7%。同一份文件称，按 2024 年收入份额，公司在全球农业机器人和农业无人机中均排名第二，并覆盖 60 多个国家和地区。XAG 的官方和第三方材料还指向累计作业面积超过
              11 billion mu、2022 年以来作业时长超过 10.5 million hours，以及深厚知识产权积累：专利申请超过 4,400 件，授权专利超过 3,300
              件。不过，公司经济重心仍集中在无人机：农业无人机仍贡献 2025 年收入的
              87.6%。这种集中度让更广泛的生态叙事具备战略意义，但尚未改变这样一个事实：无人机硬件仍为大部分企业收入提供资金。关于确切员工数、客户数和经常性软件收入占比，公开数据仍然稀薄。
