            body: >-
              总体看，XAG
              的公开客户证据好于典型只会营销的硬件公司，因为它包含具名操作者、结果细节、机构合作和地理多元案例。这是真实采用证据。但从风险投资或成长股权角度看，它仍不足以支撑客户质量判断。公司最强的公开证据回答了产品能否被真实种植者和伙伴有效使用；它没有回答这些用户是否续约、扩张、集中，或产生高质量经常性经济性。因此，投资者应把客户章节视为对采用质量有支持、对耐久性仍不完整。采用证据真实存在，留存证据仍大多缺席。
