      - number: '7.4'
        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              执行和财务模型风险对 XAG 论点异常核心。公司仍带有强烈创始人塑形，承担专业技术工作、硬件较重的运营模式，并需要平衡
              R&D、支持和渠道规模。公开现金流摘要显示改善，但稳定性还不足以把模式称为完全自我供血。中国价格竞争和 DJI
              的激进回应，可能很快压迫利润率。营运资本、库存和海外扩张都会先消耗现金，之后才有可能可靠回流。风险并不是泛泛创业公司意义上的“烧钱”，而是硬件利润率敏感与重执行增长的组合。如果 XAG
              对技术投入不足，就有丢份额风险；如果在定价走弱时过度投入，就可能把盈利吐回去。这种张力就是核心财务模型风险。
