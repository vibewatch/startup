      - number: '1.3'
        title: 融资历程、股权与 IPO 前定价信号
        blocks:
          - type: paragraph
            body: >-
              XAG 的资本历程显示战略投资方和风险投资方多次支持，但公开材料把一级融资、老股购买和独角兽榜单估值混在一起，使精确股权结构分析变得复杂。招股书及相关报道显示，上市前 Peng Bin 控制公司约 42.97%
              股权，XAG 显然仍由创始人控制。SoftBank Vision Fund II-2 是最大外部股东，持股 12.86%；Chengwei Capital、Baidu Capital、Sinovation 和
              Hillhouse 也在较知名股东之列。36Kr 提到 2014 年 Chengwei 投资、2016 年 Series B、2019 年 RMB130 million 融资、2020 年涉及 Baidu 和
              SoftBank 生态资本的战略融资潮，以及 2023 年引入 China Unicom Kaixing Investment 的 C++ 轮。但公开来源也指出，Hillhouse 是通过老股进入，Suikai
              也在 2025 年 7 月购买老股。这个区别很重要：二级市场购买会改变所有权，却不会增加资产负债表上的现金。因此，投资者评估当前价值时，必须把融资历史和后续定价信号拆开看。
