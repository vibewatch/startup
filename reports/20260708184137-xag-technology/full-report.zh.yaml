      - number: '4.4'
        title: 资本充足性、营运资本与现金流
        blocks:
          - type: paragraph
            body: >-
              XAG 的资本故事比盈利前几年更好，但尚未完全落定。iTiger 对招股书数据的摘要显示，经营现金流在 2024 年强劲恢复，2025
              年上半年又滑回流出；现金储备仍在数亿人民币中段。这个状态不算困境，但也不能证明公司已经达到自我供血稳定。IPO 募资用途进一步说明这一点。管理层并不是只为平滑时间差融资；它希望投入下一代
              R&D、扩大全球销售网络、建设新总部和 R&D
              中心，并补充营运资本。这些都是增长投资，但也确认业务仍对资本敏感。资产负债表摘录显示流动资产和流动负债扩张，方向上也符合制造业主导模式下的库存、应收款和其他营运资本需求。
