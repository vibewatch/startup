              把 XAG 的产品翻译成田间工作流，而不是目录标签，最容易理解。公开栈从空中施用和测绘开始，延伸到果园和温室里的地面机器人，再通过 APC2 自动转向触达传统农机，最后由智慧农场 IoT
              模块进入灌溉和监测。这个范围显著宽于单一无人机产品线。公开页面显示，公司在不同地形和农业周期的不同节点，系统覆盖作物管理任务：测绘和巡田、路线规划、喷洒和播撒、飞行器不太适合时的地面施用，以及飞行器离开后的水分或养分控制。这种宽度有意义，因为它把产品从工具推向农业作业操作系统候选者。需要提醒的是，关于收入和部署成熟度的公开证据，对主力无人机家族远好于每个相邻模块。
