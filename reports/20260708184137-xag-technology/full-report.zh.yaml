              - CM036
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻玩家、龙头与替代品
        blocks:
          - type: paragraph
            body: >-
              XAG 并不处在一个整齐的单一竞品集合里。最直接的对比对象是 DJI
              Agriculture，因为两家公司都销售农业飞行器，并试图掌握操作者工作流中的关键部分。但买方也可以用服务商、软件主导的农学平台、传统精准农业套件，或拖拉机和人工喷洒的现状，解决相似任务。因此，真正的竞争地图必须纳入
              DJI、Hylio 等无人机优先同行，Rantizo 这类服务优先运营商，Sentera、Taranis 等农学智能厂商，以及 PTx Trimble
              这类既有互联农场平台。关键区别不是每家厂商是否卖无人机，而是它们是否争夺同一个经济决策：谁拥有田间洞察、施用工作流和农民关系。这个更宽的框架很重要，因为即便 XAG
              硬件技术强，更强渠道、分析层或服务模式也可能把客户结果导走。
            claimRefs:
              - CP001
