  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与集中度
        blocks:
          - type: paragraph
            body: >-
              XAG 的公开财务故事仍由产品收入主导，而不是已披露的经常性软件合同。香港招股书中的经审计数字显示，2023 年到 2025
              年收入强劲增长；但外部报道也清楚表明，农业无人机仍是压倒性的收入驱动。公开来源反复引用无人机约占销售额 88–89%，这意味着地面机器人、自动驾驶系统和智慧农场 IoT
              等较新品类，在当前规模下战略意义大于财务意义。产品组合足够宽，可以支撑多条变现路径，但公司尚未公开披露类似经常性软件的收入结构，无法实质性降低集中度风险。从这个角度看，XAG
              更像一个带相邻模块的规模化农业硬件平台，而不是轻资产数据业务。收入模式可以扩展，但当下财务引擎仍取决于 XAG 通过渠道销售和服务实体设备的能力。
