      - number: '2.5'
        title: 约束、监管与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              品类在增长，但并不顺滑。各司法辖区对喷洒和更重载荷的监管批准并不均衡；随着无人机采集更多影像和运营数据，隐私或数据治理规则也提高了合规要求。电池和传感器等关键部件的关税可能抬高系统成本。飞手短缺和培训负担仍会限制一些市场的部署。竞争压力也在加剧。Yicai
              关于中国农业无人机价格下行的报道，以及 ChinaBizInsider 对 DJI
              压力的关注，都指向硬件层的商品化风险。服务模式和软件差异化因此重要：当硬件定价更激进时，它们能保护采用动力。大的含义是，农业无人机很有吸引力，但不会自动带来高利润；阅读市场规模预测时，也应同时看见品类明确的成本、监管和定价逆风。
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
