  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示关键风险如何传导到收入、毛利率、客户质量和融资需求。
    data:
      nodes:
        - id: r1
          label: 监管摩擦
          description: 审批和作业许可会延迟部署，或收窄部署范围
        - id: r2
          label: 合作伙伴失效
          description: 渠道或支持薄弱会伤害部署质量
        - id: r3
          label: 价格竞争
          description: 折扣或份额压力压缩毛利率
        - id: r4
          label: 现金流压力
          description: 营运资本或经营现金流走弱会抬高融资风险
        - id: r5
