  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              2026
              年的农业无人机市场，最好理解为一个由硬件牵引的自动化品类，核心围绕空中喷洒、播撒、巡田、测绘和作物健康监测。多数市场报告认可这些核心任务，但在是否纳入软件分析、托管服务，以及拖拉机导航或传感器网络等相邻精准农业系统上存在分歧。定义漂移很重要，因为它会让可服务市场规模相差数十亿美元。只看硬件喷洒，会得到更小的市场；若采用更宽的精准农业无人机口径，把分析和服务也打包进去，市场就更大。相邻生态还包括
              Taranis、Sentera、PTx Trimble 等软件优先或导航优先的厂商，Rantizo 这类无人机服务专家，以及 Hylio
              这类硬件中心型制造商。存量替代方案依然有意义：背负式喷雾器、拖拉机机具、有人驾驶农用喷洒飞机和人工巡田，在很多地区经济上仍成立。只有当精度、时机、地块可达性或劳动力稀缺足以压过航空、培训和资本开支负担时，农业无人机才会胜出。
