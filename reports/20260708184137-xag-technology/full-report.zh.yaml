        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，XAG 背负着规模化田间硬件公司的典型负担。产品家族很宽，战略上有吸引力，但运营上复杂：SKU
              更多、附件更多、手册更多、备件更多、田间服务场景也更多。当可靠性数据稀少时，这种复杂度就会变成风险。公开来源展示了手册、培训界面和能力主张，但没有展示扎实的可靠性数据集、召回历史或服务解决表现。安全和隐私也类似。公司显然希望推进更多互联农场工作流，但公开信任披露比公开产品营销更薄。再加上培训依赖、天气窗口敏感和硬件支持强度，运营风险图景就很清楚：XAG
              的系统可能在田间运行良好，但投资者仍需要证据，说明它们多久失败一次、多久恢复，以及支持成本如何随规模变化。
