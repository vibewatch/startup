      - number: '3.2'
        title: XAG 对比直接无人机优先对手
        blocks:
          - type: paragraph
            body: >-
              面对无人机优先对手，XAG 最强的公开论点是宽度。公司不只展示飞行器。它的公开栈如今包括 P150 Max 的重载播撒和物流能力、用于果园和温室的 R200 等地面机器人、面向农机的 APC2
              自动转向，以及智慧农场阀门、注肥器和摄像头。这种宽度具有战略意义，因为它让 XAG 可以把自己定位为农场自动化伙伴，而不是单 SKU 无人机厂商。不过，DJI 仍是最清晰的规模标杆。第三方来源反复把 DJI 和
              XAG 列为品类领导者，DJI 自身年报也强化了其大装机基础和丰富案例覆盖的感知。Hylio 的位置不同：它强调美国设计、制造、安全姿态和 NDAA 合规，即使公开产品叙事比 XAG
              更窄，也拥有地缘政治和采购切入点。净效果是，XAG 看起来比多数专业厂商更宽，但在分销或品牌上并不明显强于 DJI。
