            body: >-
              仅看公开证据，XAG
              已明显改善，但并未完全去风险。多头论点很直接：经审计收入和毛利率提升、真实转盈、海外占比增长，以及更宽的产品组合未来可能变现更多农场自动化栈。空头论点同样清晰：无人机仍主导收入，定价仍不透明，私有单位经济性大多缺失，竞争或重新加大
              R&D 投入都可能再次挤压利润。实际含义是，收入和毛利率趋势站得住，但投资判断仍被核心私有指标卡住。投资者需要 CAC 和渠道经济性、库存与保修数据、产品级利润率拆分，以及如果 XAG
              选择激进守份额，利润韧性如何的更好证据。在此之前，应把这家公司视为财务上可信但仍对资本敏感，而不是已经完全被证明。
