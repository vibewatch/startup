chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品平台
        blocks:
          - type: paragraph
            body: >-
              XAG Technology 是一家总部位于广州的农业机器人公司，源头可追溯到 Peng Bin 与其他无人机爱好者在 2007 年创立的 XAircraft
              团队。公司早年制造多旋翼飞行器，也探索过物流、巡检、科研和航拍等通用无人机场景，之后才聚焦农业。公开叙述都把 2013 年视为关键转折：Peng Bin
              在新疆棉田看到劳动力和植保痛点后，将公司转向农业自动化。今天的 XAG
              不再把自己包装成单一无人机厂商，而是全栈智慧农业平台。当前产品架构覆盖喷洒和播撒无人机、面向特色作物的农业地面机器人、拖拉机自动驾驶控制台、遥感系统，以及智慧农场 IoT
              或水肥一体化设备。这种产品宽度很关键：它让 XAG 在结构上比单 SKU 无人机创业公司更成熟，也支撑其香港 IPO 叙事中的后期私营公司定位。
