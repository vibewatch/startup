            body: >-
              公开发布节奏显示，这是一套仍在活跃迭代的产品计划，而不是老化装机基础。XAG 新闻中心和 AgroPages
              报道显示，高载荷飞行器、地面机器人和生态模块都在持续更新。即便如此，各模块成熟度并不均衡。核心飞行器和控制系统看起来已经商业化，并且文档充分。P150 Max
              等较新硬件更像处在积极推出期，而不是长期稳定装机基础。外部验证存在，但带有选择性。Harper Adams 和 IRRI 提供了可信伙伴证据，说明 XAG
              技术正在实质性农学场景中使用；英国授权故事也显示，公司至少跨过了一个有意义的运营控制门槛。仍然薄弱的是细颗粒度证据：长期机队可靠性、固件稳定性、支持响应速度和量产缺陷率并不公开。
