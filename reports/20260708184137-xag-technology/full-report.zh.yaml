    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 留存质量
        - NRR、GRR、流失率、复购队列
        - 决定客户证据是否配得上估值溢价
        - 按地域和渠道索取队列表
      - - 伙伴经济性
        - 分销商抽成率、支持负担、头部伙伴集中度
        - 直接决定规模化和利润率耐久性
        - 索取伙伴 P&L 和前 10 大伙伴结构
      - - 产品级利润率
        - 按无人机、无人车、自动驾驶、IoT 拆分毛利率
        - 检验产品宽度是在改善还是稀释经济性
        - 索取 SKU 系列利润率桥表
      - - 资本结构
        - 优先权堆栈、稀释和 IPO 后融资需求
        - 关系到真实投资人回报，而不只是企业价值
        - 索取最新股权结构表和资金用途瀑布
      - - 监管扩张
        - 重点市场审批矩阵和事故记录
        - 支撑国际化规模假设所必需
        - 索取逐市场合规矩阵
      - - 收入地域质量
        - 按国家拆分的收入、利润率和支持成本
        - 海外增长可能质量高，也可能只是冲量
        - 索取按国家拆分的 P&L 和支持经济性
