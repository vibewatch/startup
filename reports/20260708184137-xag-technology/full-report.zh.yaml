      - number: '2.3'
        title: 买方分层、采用路径与用例
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一农民画像复杂得多。大型商业农场、种植园经营者和农业企业仍是最清晰的早期采用者，因为它们能在足够大的面积上摊薄设备购买或外包空中服务成本，并更快收回投资。合作社和服务商也重要，因为它们能把成本分摊给较小种植户；经销商则常把设备、培训和田间支持打包销售。应用也随作物类型变化。喷洒主导当前经济性，但测绘、巡田和变量施用具有战略价值，因为它们把软件和服务拉进预算。特色作物、葡萄园、果园和水稻经常被列为特别有吸引力的用例，因为地形、作物价值和劳动强度让精准作业更值钱。大型大田作物经营者也会在喷洒窗口很短，或地面设备可能造成土壤压实时采用无人机。这种组合意味着，品类不是一个单一大市场，而是几个相关的采用动作，共用部分硬件和软件基础设施。
