      - number: '3.3'
        title: 相邻玩家、服务与既有平台风险
        blocks:
          - type: paragraph
            body: >-
              几个重要对手不需要在飞行器层面逐项击败 XAG。种植者如果想要空中施用结果，却不想自建航空能力，Rantizo
              可以胜出。当预算所有者是农学、种子、零售或研究部门，最高价值问题是影像、作物健康洞察和工作流协作时，Sentera 和 Taranis 可以胜出。PTx Trimble
              可以把导航、机器连接和数字农场工作流嵌入更广泛运营，从而影响购买决策。这些对手重要，是因为它们争夺最终塑造无人机采用的同一批决策层：数据、培训、渠道和重复工作流价值。实践中，XAG
              可以与它们共存，但共存并不总是战略上有利。多归属会稀释平台控制，服务主导或分析主导的层也可能在无人机上游吸走利润或买方心智。
            claimRefs:
              - CP008
