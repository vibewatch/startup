      - number: '4.3'
        title: 销售动作、海外占比与收入质量
        blocks:
          - type: paragraph
            body: >-
              XAG
              的销售动作似乎很大程度依赖渠道、经销商和海外市场开发。这在财务上很重要，因为经销商占比较高的硬件业务无需自建完整全球直营地面团队，就能更快扩张；但它也会遮蔽实际成交价、支持成本和伙伴经济性。公开证据显示，海外销售已成为有意义的贡献项：iTiger
              引用 2024 年海外收入约 RMB 370 million，Caixin 引用 2025 年上半年占比 25.2%。这是一个双刃信号。一方面，它显示中国以外存在需求，并降低单一市场依赖；另一方面，它引入
              FX、贸易政策、本地化和服务复杂度风险。由于定价不透明，投资者无法清楚区分海外增长是在增加高端组合，还是只是贡献销量。因此，收入质量在改善，但仍部分是渠道和地区黑箱。
            claimRefs:
              - CI009
