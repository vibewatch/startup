      - number: '2.2'
        title: 测算口径与公开估算为何冲突
        blocks:
          - type: paragraph
            body: >-
              不应把任何单一市场规模数字视为权威。Research and Markets 估计 2026 年全球农业无人机市场为 $4.41 billion，Coherent Market Insights
              给出的可比品类规模为 $7.17 billion，Global Market Insights 则估计 2026 年更窄的精准农业无人机细分市场为 $2.9
              billion。这些差距大到不能忽视，但可以解释。有些报告只计算硬件收入；另一些实质上混入软件、数据和服务层。有些严格聚焦农业无人机，另一些则靠近更宽的精准农业栈。因此，投资者应把市场视为区间，而不是点估计。最强的方向性结论不是某个精确美元数，而是所有来源都预期持续增长，背后由自动化需求、粮食安全压力和精准农业工作流扩散支撑。这个市场已经大到足以容纳多家规模化厂商，同时仍足够分散，品类定义尚未沉淀。
