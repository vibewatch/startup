      - number: '3.4'
        title: 定价透明度、分销权力与切换成本
        blocks:
          - type: paragraph
            body: >-
              在这个竞争格局中，公开定价证据几乎处处薄弱。大多数厂商把潜在客户导向经销商、演示、年度许可讨论或定制企业报价。这意味着买方很可能按地理、渠道、农学需求和服务支持谈判，但外部观察者仅靠公开材料很难基准化折扣或利润结构。因此，分销与标价可见度同样重要。XAG
              的经销商招募和海外报道显示，渠道触达是真实资产；DJI 的案例密度和全球报告也指向规模优势；Hylio
              的政府友好定位可能改善其在受监管美国场景中的准入。切换成本有意义，因为操作者必须重新学习路线规划、工作流工具、维护，有时还要重新做集成。即便如此，切换成本并非绝对。一个种植者可以拥有某厂商硬件、向另一家购买喷洒服务，再使用第三家的分析层，这让品类更像可叠加栈，而不是被锁死的系统。
            claimRefs:
              - CP017
