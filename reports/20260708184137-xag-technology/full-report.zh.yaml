            body: >-
              基于当前公开记录，正确建议不是泛泛判定“好公司”。更合适的是一个对价格敏感、对证据敏感的立场。XAG
              已有足够证据支撑建设性关注：经审计收入和利润改善、宽产品范围、真实海外部署，以及仍然很大的品类机会。但公开披露还不足以支撑投资者以高信心承接市场流传估值标记的上沿。客户耐久性、渠道经济性、产品级利润率质量和稀释压力仍过于不完整。因此，建议最好表述为跟踪或继续研究，而不是买入。信心应为中等，因为公司质量真实，但估值支撑尚不干净。风险评级应保持高，因为上行论点仍依赖监管、渠道、硬件利润率和资本纪律，而不是简单的软件式经常性收入引擎。
