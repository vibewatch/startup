        title: 增长、毛利率扩张及其可能含义
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 2023 年到 2025
              年出现真实财务改善。收入大幅上升，毛利增长更快，毛利率几乎翻倍，公司也从净亏损跨入经审计净盈利。这比简单的“不惜代价增长”故事质量更高。同时，可能解释仍是硬件经济性改善，而不是结构性转向更高倍数业务模式。ChinaBizInsider
              和 iTiger
              的报道把供应链优化、标准化、运营纪律和规模效应列为主要驱动。这个解释与数据相符：利润率改善与运营收紧和聚焦核心产品同步发生。投资者的问题在于，这是耐久利润率阶梯的开端，还是价格战和再投资强度回归前的临时高点。
