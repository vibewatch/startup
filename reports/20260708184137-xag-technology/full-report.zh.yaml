      - number: '5.4'
        title: 差异化、IP 与技术信号
        blocks:
          - type: paragraph
            body: >-
              XAG 的差异化论证围绕系统宽度和应用型田间自动化，而不是单一突破部件。公开材料反复强调 RTK
              导航、自主飞行、雾化、机器导航和智慧农场控制，把它们讲成一个连接平台。结合招股书和专利代理证据——授权专利基数很大，多年工程工作横跨多个核心领域——这个故事更有力度。对一家硬件较重、公开开源存在感很低的公司来说，最接近开发者信号的代理不是
              GitHub 速度，而是专利、手册、田间试验和伙伴部署中可见的工程产出。这不是完美证据。专利数量不会自动证明产品更优，伙伴试验也不会证明商业主导地位。但两者合在一起，确实支持这样一个判断：XAG
              的技术位置有实质内容，不只是营销驱动。
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE026
              - CE027
              - CE035
      - number: '5.5'
        title: 信任、安全、合规与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录中最弱的部分不是产品宽度，而是信任透明度。XAG
              可以拿出产品手册、伙伴验证，以及至少一个英国运营授权故事。但我们审阅到的公开材料，在隐私架构、安全控制、正式可靠性指标、事故报告和全球监管覆盖上要薄得多。这并不能证明存在弱点，却留下未解决的尽调风险。部署在真实田间的精准农业硬件，依赖操作者培训、固件质量、本地许可和可靠支持。XAG
              在田间有效性和工程深度上看起来可信，但面向怀疑型企业或监管者、足以称系统已广泛去风险的公开证据仍不完整。因此，产品技术判断是：成熟度和差异化为正，同时在信任、可靠性和内部软件透明度上保留明确但书。
