  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最重要的监管风险，不在于 XAG 能否拿到任何批准，而在于公司能否反复把单一司法辖区成功转化为多司法辖区运营许可。英国授权故事有帮助，因为它证明公司至少跨过了一个真实门槛。IRRI
              语境同样重要，因为它显示监管和规程约束在其他地方仍是活跃采用瓶颈。换句话说，XAG
              的可服务市场不只是需求问题，也是许可和培训问题。法律风险更难观察。公开证据没有显示活跃诉讼包袱，但招股书和专利足迹暗示，这门业务越来越需要保护
              IP，并管理产品责任敞口。没有公开法律风波，并不等于法律风险低，尤其是一家全球农业机器人公司在化学品施用、安全和出口管制边界附近运营。
