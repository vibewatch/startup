          - type: paragraph
            body: >-
              公开估值口径很乱，不能直接下结论。多家来源指向约人民币 73 亿元的独角兽式估值，另一些中文报道则给出约人民币 105 亿元的更高数字。差距不小。按 2025 年招股书收入人民币 11.662
              亿元计算，历史市销率分别约为 6.3 倍和 9.0 倍；按 2025 年净利润人民币 1.238 亿元计算，历史市盈率分别约为 59 倍和 85 倍。XAG
              仍要面对毛利率和监管风险，业务又由硬件牵引，这个区间就显得很宽。如果投资人相信 XAG 正接近可持续的全球化规模，这些数字并非完全不可能；但估值已经足够进取，留存和渠道数据的缺口就很关键。因此，估值问题不是
              XAG 是否应当值一笔可观的钱，而是公开记录今天是否足以证明其质量，支撑估值区间上沿。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 可比公司组合及其局限
        blocks:
          - type: paragraph
            body: >-
              公开市场可比公司有参考价值，但结构上并不完美。Deere、AGCO、CNH 和 Komatsu 是规模更大的农业或机械龙头，收入更多元，经销商网络更成熟，体量也大得多。Trimble 和 Hexagon
              能提供精准作业流程和工业数字化的参照，却不是农业无人机公司。EHang
              的自主航空器叙事更接近，但农业经济性并不相同。这个错位很重要，因为它能避免伪精确。可比公司组合的价值在于提醒投资人保持克制：公开市场没有一个与 XAG
              完全类似的干净标尺，因此对私人公司精确估值点位的信心应当下降，而不是上升。最合适的用法，是反推 XAG 需要交出多少执行力和毛利率韧性，才配得上持续的高倍数叙事。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV031
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV031
              - CV034
              - CV035
              - CV036
              - CV037
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设：经审计盈利不是短期高点，而是一条可持续曲线的起点；海外增长继续分散收入结构；无人车、自动驾驶和 IoT 等相邻模块能把单个客户关系做深。若这些假设成立，XAG
              有可能逐步消化、甚至超过其公开估值区间上沿。基准情景假设盈利真实存在，但市场仍把公司看作硬件占比较高、业务受监管约束的运营商，复购和服务收入只形成部分经常性经济性。在这种情景下，胡润口径的估值区间比更高数字更站得住脚。悲观情景假设价格压力、现金转换变慢，且客户耐久性或产品线宽度改善经济性的证据不足。若这些风险兑现，即便较低的公开估值也可能偏贵。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV003
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV020
              - CV023
              - CV024
              - CV025
              - CV026
              - CV033
      - number: '8.5'
        title: 尽调触发项、入场纪律与退出准备
        blocks:
          - type: paragraph
            body: >-
              只要补上一组相对有限的数据，判断就可能转向更积极：分群留存、伙伴经济性、产品级毛利率、国家层面的收入质量，以及更清楚的资本与稀释图谱。这些尽调问题可落地，所以正确姿态不是永远回避，而是在付出高估值前继续做功课。负面情形同样清楚。若这些问题揭示出伙伴高度集中、重复使用弱、现金压力重现，或相邻产品主要靠营销支撑，估值论证会明显走弱。退出准备也需要细看。上市路径存在，但上市事件本身不能验证估值。更关键的退出问题是，公开市场投资人会把
              XAG 看成耐久的农业自动化平台，还是只把它当作一家受周期性倍数天花板约束的硬件公司。在这一点更清楚之前，投资人应守住入场纪律，并明确标出打破投资假设的触发项。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
