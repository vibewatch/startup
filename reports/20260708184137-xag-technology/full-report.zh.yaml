      - CR023
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从证明和风险推导当前推荐的链条。
    data:
      nodes:
        - id: n1
          label: 真实公司质地
          detail: 收入、毛利率、产品宽度和海外证明都很重要
        - id: n2
          label: 证据缺口
          detail: 留存、合作伙伴经济性和摊薄披露仍不足
        - id: n3
          label: 估值不确定性
          detail: 公开估值标记相互冲突，隐含倍数差异很大
        - id: n4
          label: 高风险评级
          detail: 监管、利润率和资本敏感性仍是实质变量
        - id: n5
          label: 跟踪 / 继续研究
          detail: 值得建设性关注，但需要更扎实的数据或更低入场价
      edges:
        - from: n1
          to: n3
          label: 质量支撑关注
        - from: n2
          to: n3
          label: 数据缺口压低定价信心
        - from: n3
          to: n4
          label: 估值不确定性抬高风险
        - from: n4
          to: n5
          label: 导向谨慎建议
    claimRefs:
