- id: capital-and-ownership
  title: Funding History, Ownership, and Pre-IPO Pricing Signals
  body: XAG's capital history shows repeated support from strategic and venture investors, but public materials mix primary financing, old-share purchases, and unicorn-list marks in ways that complicate precise cap-table analysis. The prospectus and related coverage show Peng Bin controlling about 42.97% of the company before listing, leaving XAG clearly founder-controlled. SoftBank Vision Fund II-2 is the largest outside holder at 12.86%, with Chengwei Capital, Baidu Capital, Sinovation, and Hillhouse among the better-known backers around the cap table. 36Kr describes a 2014 Chengwei investment, a 2016 Series B, a 2019 RMB130 million round, a 2020 strategic financing wave involving Baidu and SoftBank ecosystem capital, and a 2023 C++ round that added China Unicom Kaixing Investment. But public sources also note that Hillhouse entered via old shares and that Suikai bought old shares in July 2025. That distinction matters because secondary purchases change ownership but do not improve cash
    on the balance sheet. Investors therefore have to separate fundraising history from later pricing signals when evaluating current value.
  claimRefs:
