company:
  name: XAG Technology
chapter:
  number: 1
  title: Company Overview
  summary: XAG is a Guangzhou-founded agricultural robotics company that pivoted from general drones into smart farming, reached profitability in 2024, disclosed RMB 1.166 billion of 2025 revenue and RMB 123.8 million of net profit, and re-filed for a Hong Kong IPO in March 2026 after its first 2025 application lapsed. Public evidence supports meaningful product breadth, founder control, and second-place global ag-drone/ag-robot market positions, but current fair value and governance depth remain less settled than the operating story.
sections:
- id: identity-and-platform
  title: Identity, Mission, and Product Platform
  body: XAG Technology is a Guangzhou-headquartered agricultural robotics company that traces its roots to the 2007 XAircraft team founded by Peng Bin and fellow drone enthusiasts. The company spent its early years building multi-rotor aircraft and exploring general drone applications in logistics, inspection, research, and aerial photography before concentrating on agriculture. Public accounts consistently describe a decisive turning point in 2013, when Peng Bin saw the labor and crop-protection pain points in Xinjiang cotton fields and redirected the company toward agricultural automation. XAG now presents itself as a full-stack smart-agriculture platform rather than a single-product drone maker. Its current product architecture spans crop-spraying and spreading drones, agricultural rovers for specialty crops, tractor autopilot consoles, remote-sensing systems, and smart-farm IoT or fertigation devices. This product breadth matters because it makes XAG structurally more mature than a single-SKU
    drone startup and supports the late-stage private positioning that underpins its Hong Kong IPO narrative.
  claimRefs:
