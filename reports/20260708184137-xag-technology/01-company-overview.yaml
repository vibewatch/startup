- id: scale-and-footprint
  title: Scale, Global Footprint, and Operating Maturity
  body: 'Scale is now clearly beyond the venture proof-of-concept stage. The March 2026 prospectus disclosed RMB1.166 billion of 2025 revenue, RMB123.8 million of 2025 net profit, and 35.7% gross margin after a strong margin recovery from 2023. The same filing claims second-place global positions in both agricultural robots and agricultural drones by 2024 revenue share, plus a footprint spanning more than 60 countries and regions. XAG''s official and third-party materials also point to cumulative operating area above 11 billion mu, more than 10.5 million operating hours since 2022, and substantial intellectual-property depth with over 4,400 patent applications and more than 3,300 granted patents. The company remains economically concentrated in drones, however: agricultural drones still generated 87.6% of 2025 revenue. That concentration makes the broader ecosystem story strategically important but does not yet change the fact that drone hardware still finances most of the enterprise. Public
    data on exact employee count, customer count, and recurring software mix remains thin.'
  claimRefs:
