- id: milestones-and-ipo-path
  title: Milestones, IPO Path, and Main Open Questions
  body: 'XAG''s milestone arc is impressive but not risk-free. The company launched its first-generation agricultural drone in 2015–2016, expanded into autopilot and IoT systems in 2019–2020, broadened its robotics matrix in 2021–2022, and launched the R Series rover in 2025. It also accumulated external validation through UK CAA authorization for agricultural spraying, Chinese industrial-policy awards, and FAO-linked recognition cited on the official timeline. On the capital-markets path, XAG first tried to list on Shanghai''s STAR Market before withdrawing in 2022, then filed in Hong Kong on September 25, 2025 and re-filed on March 26, 2026 after the first application lapsed. Public valuation signals are mixed: unicorn-list references cluster between RMB7.3 billion and RMB10.5 billion, while a July 2025 old-share transfer cited by ChinaBizInsider implied only about RMB4.6 billion. That gap does not negate XAG''s operating progress, but it does warn that the public-market entry story is
    likely to be debated on both quality and price rather than momentum alone.'
