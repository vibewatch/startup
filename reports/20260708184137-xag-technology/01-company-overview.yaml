callouts:
- calloutType: strength
  title: Profitability changed the IPO narrative
  body: XAG is no longer pitching only category promise. The Hong Kong filing shows a company that crossed RMB 1 billion of annual revenue, improved gross margin sharply, and turned profitable in 2024 before extending profit in 2025. That operating turn materially strengthens the late-stage private case compared with the cash-burning robotics stereotype.
  claimRefs:
  - CO018
  - CO019
  - CO020
- calloutType: risk
  title: Public value signals are inconsistent before listing
  body: 'The market has at least three different external value anchors for XAG: unicorn-list references around RMB 7.3-10.5 billion and a July 2025 share-transfer signal around RMB 4.6 billion. Until a priced IPO or new primary round clears that gap, investors should treat any single headline valuation as provisional rather than settled.'
  claimRefs:
  - CO029
  - CO030
