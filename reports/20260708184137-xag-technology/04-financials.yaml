- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Why public evidence is insufficient
  - Exact diligence path
  rows:
  - - CAC and payback
    - Cannot test GTM efficiency
    - No public spend-to-new-customer bridge
    - Request channel, direct-sales, and retention cohorts
  - - Distributor economics
    - Cannot see take rates or control points
    - Public pages show recruitment, not economics
    - Request partner margin, MDF, and service obligations
  - - Inventory turns and write-downs
    - Cannot model cash conversion or obsolescence
    - Prospectus excerpts are too coarse in text extraction
    - Request inventory aging and reserve policy
  - - Warranty / service burden
    - Cannot judge true hardware gross margin durability
    - Support cost is not broken out publicly
    - Request warranty claims, spare-parts usage, and service labor cost
  - - Product-level margin by SKU
    - Cannot tell if newer adjacencies help or dilute profit
    - Only blended margin is visible publicly
    - Request gross margin by drones, rover, autopilot, and IoT
  - - Geographic margin mix
    - Cannot tell if overseas growth is premium or merely incremental volume
    - Public sources give revenue share but not profitability by region
    - Request region-level gross margin and channel-cost split
  notes: The key blockers are classic private-company operating metrics, not the existence of topline or profit data.
