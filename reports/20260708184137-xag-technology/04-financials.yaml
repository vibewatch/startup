tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Agricultural drones
    - Equipment sales via channel / distributors
    - Per aircraft and related modules
    - Dominant stream; ~87.8% of 2024 revenue and 89% of H1 2025 sales
    - High concentration, validated by multiple secondary summaries
    - Obtain audited product-line revenue by year and geography
  - - Agricultural rover
    - Equipment sales for orchard / greenhouse tasks
    - Per rover / module
    - Commercialized but still small in public revenue mix
    - Strategically relevant, financially early
    - Request rover revenue, installed base, and gross margin
  - - Autopilot console
    - Retrofit hardware for tractors and machinery
    - Per console / install
    - Commercialized but small relative to drones
    - Potentially attractive adjacency, but no separate revenue line public
    - Request APC revenue, attach rate, and channel mix
  - - Smart-farm IoT / fertigation
    - Device and module sales, possibly project-based
    - Per valve / injector / camera / system
    - Fastest public growth signal; Caixin cited RMB 27.8M in H1 2025
    - Growing but still small
    - Request annualized revenue and recurring-service component if any
  - - Support / training / accessories
    - Likely bundled or channel embedded
    - Unknown
    - Not transparently disclosed in public filings reviewed here
    - Opaque contribution to gross profit and service cost
    - Request service revenue, warranty reserves, and accessory attach rates
  notes: The public record is good enough to identify the revenue architecture and concentration, but not to split every line item cleanly.
