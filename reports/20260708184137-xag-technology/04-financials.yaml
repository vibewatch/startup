- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value / status
  - Why it matters
  - Risk reading
  - Diligence ask
  rows:
  - - Cash reserves (mid-2025)
    - ~RMB 345M per iTiger summary
    - Primary cushion against volatility and expansion needs
    - Comfortable but not obviously excess given growth plans
    - Confirm audited cash, restricted cash, and short-term debt
  - - Operating cash generation
    - Positive in 2024, negative again in H1 2025
    - Tests whether profit is self-funding
    - Volatility means capital dependency is reduced, not removed
    - Request quarterly CFO and working-capital bridge
  - - IPO use of proceeds
    - R&D, global sales network, new HQ/R&D center, working capital
    - Signals where cash needs persist
    - Growth capex remains meaningful
    - Request detailed proceeds allocation and build schedule
  - - Working-capital intensity
    - Expanding current assets and liabilities in prospectus excerpts
    - Manufacturing and channel models usually tie up cash
    - Inventory / receivable risk can absorb cash fast
    - Request aging schedules, turns, and credit terms
  - - Next financing trigger
    - Not publicly stated
    - Critical for underwriting dilution and downside
    - Unknown if growth or competition forces fresh capital
    - Request minimum cash policy and downside runway plan
  notes: The capital picture is improved but still dependent on information not publicly broken out in sufficient detail.
