- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue growth 2023→2024
    - RMB 614.5M to RMB 1,065.5M
    - High
    - Shows breakout year and scale shift
    - Confirm growth by product line and region
  - - Revenue growth 2024→2025
    - RMB 1,065.5M to RMB 1,166.2M
    - High
    - Tests whether scale persisted after 2024 surge
    - Separate unit growth from price/mix
  - - Gross margin path
    - 18.9% → 31.9% → 35.7%
    - High
    - Key sign of improving hardware economics
    - Obtain product-level margin and warranty burden
  - - Net margin path
    - Loss in 2023; profit in 2024 and 2025
    - High
    - Shows whether growth translated into earnings
    - Bridge one-time vs recurring operating improvements
  - - R&D intensity
    - Historically high; reported down to ~10% in H1 2025
    - Medium
    - May indicate efficiency gains or underinvestment risk
    - Request audited R&D by category and capitalization policy
  - - Operating cash flow
    - Recovered by 2024, negative again in H1 2025
    - Medium
    - Best signal of whether profit converts into cash
    - Obtain full 2025 and monthly cash conversion
  - - Overseas revenue mix
    - Meaningful and rising but volatile as a share
    - Medium
    - Improves diversification but adds policy / service risk
    - Request gross margin by geography
  notes: Public figures support directional analysis but not a complete operating model.
