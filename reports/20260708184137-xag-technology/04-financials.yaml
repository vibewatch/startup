company:
  name: XAG Technology
chapter:
  number: 4
  title: Financials
  summary: 'XAG’s public financial profile improved sharply by 2025: audited revenue climbed from RMB 614.5 million in 2023 to RMB 1,166.2 million in 2025, gross margin rose from 18.9% to 35.7%, and net results swung from loss to profit. But the business still looks like a hardware-led, channel-driven, capital-sensitive model: drones remain the dominant revenue stream, pricing remains opaque, private GTM metrics are missing, and cash conversion turned volatile again in first-half 2025.'
sections:
- id: revenue-model
  title: Revenue Model and Concentration
  body: XAG’s public financial story is still dominated by product revenue rather than by disclosed recurring software contracts. The audited numbers in the Hong Kong prospectus show strong topline growth from 2023 through 2025, but outside coverage makes clear that agricultural drones remain the overwhelming revenue driver. Public sources repeatedly cite drones at roughly 88–89% of sales, which means the newer categories—rovers, autopilot systems, and smart-farm IoT—matter more strategically than financially at current scale. The product portfolio is broad enough to support multiple monetization vectors, yet the company has not publicly disclosed a recurring-software-like revenue mix that would materially de-risk concentration. In that sense, XAG looks like a scaled agricultural-hardware platform with adjacent modules, not like an asset-light data business. The revenue model can expand, but the present-day financial engine still depends on how well XAG sells and services physical equipment
    through its channels.
  claimRefs:
  - CI001
  - CI005
  - CI006
  - CI007
  - CI008
  - CI033
  - CI034
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: growth-and-margin
  title: Growth, Margin Expansion, and What It Likely Means
  body: 'The public record supports a genuine financial improvement from 2023 to 2025. Revenue rose sharply, gross profit expanded even faster, gross margin almost doubled, and the company crossed from net loss into audited net profitability. That is better quality than a simple “growth at any cost” story. At the same time, the likely explanation is still hardware-economics improvement rather than a structural transition to a higher-multiple business model. Reporting from ChinaBizInsider and iTiger points to supply-chain optimization, standardization, operating discipline, and scaling effects as the main drivers. That interpretation fits the data: margin improvement arrived alongside operational tightening and a focus on core products. The question for investors is whether this is the beginning of a durable margin staircase or a temporary high-water mark reached before price wars and reinvestment intensity return.'
