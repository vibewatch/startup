- id: go-to-market-and-overseas
  title: GTM Motion, Overseas Mix, and Revenue Quality
  body: XAG’s go-to-market motion appears to rely substantially on channels, distributors, and overseas market development. That matters financially because distributor-heavy hardware businesses can scale faster without building a fully direct global field force, but they also obscure realized pricing, support cost, and partner economics. Public evidence suggests overseas sales have become a meaningful contributor, with iTiger citing roughly RMB 370 million of overseas revenue in 2024 and Caixin citing 25.2% mix in first-half 2025. This is a double-edged signal. On one hand, it shows demand beyond China and reduces single-market dependence. On the other, it introduces FX, trade-policy, localization, and service-complexity risk. Because pricing is opaque, investors cannot cleanly separate whether overseas growth is adding premium mix or simply volume. Revenue quality is therefore improving, but still partly a channel-and-region black box.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI023
  - CI027
  - CI033
- id: capital-and-cash
  title: Capital Adequacy, Working Capital, and Cash Flow
  body: XAG’s capital story is better than it looked during the pre-profit years, but it is not fully settled. iTiger’s summary of prospectus data suggests operating cash flow recovered strongly into 2024 before slipping back into outflow in first-half 2025, while cash reserves remained in the mid-hundreds of millions of renminbi. That profile is not distressed, yet it does not prove the company has reached self-funding stability either. The planned use of IPO proceeds reinforces the point. Management is not raising capital simply to smooth timing; it wants to fund next-generation R&D, expand the global sales network, construct a new headquarters and R&D center, and support working capital. Those are growth investments, but they also confirm that the business remains capital-sensitive. Balance-sheet excerpts showing expanding current assets and liabilities are directionally consistent with inventory, receivables, and other working-capital needs that belong to a manufacturing-led model.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI026
  - CI031
