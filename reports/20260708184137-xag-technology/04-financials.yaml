    - Aircraft plus task systems and accessories
    - Regional dealer pricing, financing, discounts
    - Monetization is hardware-led, not posted self-serve
  - - R200 rover
    - Capital equipment sale
    - No reliable public price observed
    - Ground spraying / transport capability
    - ASP, service package, maintenance terms
    - Rover is commercialized but pricing opaque
  - - APC2 auto-steer
    - Equipment and retrofit solution
    - No reliable public list price observed
    - Console, steering components, app workflow
    - Install economics, payback, dealer margins
    - Adjacency likely sold through field support and channel
  - - Smart-farm IoT
    - Module / system sale
    - No reliable public list price observed
    - Valves, injectors, cameras, and related control
    - Whether recurring software or subscription exists
    - Looks like device-led monetization
  - - Distributor / channel model
    - Dealer- or partner-led selling
    - Realized price highly likely negotiated
    - Training, local support, and fulfillment may matter
    - Channel take rate and support burden
    - Public evidence favors a channel-led sales motion
  notes: Official product pages confirm monetized SKUs, but the reviewed surfaces do not offer a dependable list-price dataset for underwriting.
