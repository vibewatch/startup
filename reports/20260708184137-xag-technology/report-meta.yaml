  topStrengths:
  - Broad product stack spanning air, ground, autopilot, and smart-farm infrastructure.
  - Clear 2024 profitability turn and higher gross margins supported by the 2026 prospectus.
  - Strong China manufacturing base with expanding overseas reach and partner network.
  topRisks:
  - DJI remains the dominant rival in agricultural drones and can pressure pricing and channels.
  - Revenue concentration in drones and distributors limits resilience if adoption slows.
