  productSummary: XAG sells agricultural drones, agricultural rovers, autopilot consoles, remote-sensing drones, and smart-farm IoT/fertigation equipment coordinated through mobile software and farm-management workflows.
  customerFocus: Farmers, growers, agricultural service providers, distributors, and agribusiness partners in China and overseas markets.
  businessModel: Primarily hardware sales through a distributor and partner network, supplemented by software, smart-farm systems, accessories, and ecosystem services.
  stage: late-stage private
  fundingStatus: Backed by investors including SoftBank Vision Fund, Chengwei Capital, Baidu Capital, Sinovation Ventures, and Hillhouse; pursuing a Hong Kong IPO after the March 2026 re-filing.
