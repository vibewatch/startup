- id: people-financial
  title: People, Execution, and Financial-Model Risk
  body: The execution and financial model risks are unusually central to the XAG thesis. This is still a founder-shaped company, with specialized technical work, a hardware-heavy operating model, and a need to balance R&D, support, and channel scale. Public cash-flow summaries show improvement, but not enough stability to call the model fully self-funding. Price competition in China and aggressive rival response from DJI could quickly pressure margins. Working capital, inventory, and overseas expansion all consume cash before they reliably return it. The risk is not simply “burn” in a generic startup sense; it is the combination of hardware margin sensitivity and execution-heavy growth. If XAG under-invests in technology, it risks losing share. If it over-invests while pricing weakens, it risks giving back profitability. That tension is the core financial-model risk.
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR027
  - CR034
  - CR036
  - CR037
  tableRefs:
  - TR004
- id: mitigations-and-kill
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'The good news is that many of XAG’s risks are legible and monitorable. The company already shows some mitigation surfaces: product documentation, training pathways, regulatory proof points, partner enablement, and a broader portfolio that reduces pure single-SKU exposure. But mitigation maturity is uneven. Public evidence is strongest where the company controls the narrative—manuals, launches, selected partner stories—and weakest where investors need hard accountability, such as reliability, retention, or partner economics. That is why the kill criteria must be explicit. If margins compress sharply, if cash conversion breaks again, if Brazil or Southeast Asia stall as growth engines, or if regulatory tightening reduces deployment viability, the thesis weakens materially. The risk chapter therefore supports a “high but understandable” risk rating: XAG is not opaque chaos, but it is still a capital-sensitive, regulation-shaped, partner-dependent operator.'
  claimRefs:
  - CR028
  - CR029
  - CR030
  - CR031
  - CR039
  - CR040
