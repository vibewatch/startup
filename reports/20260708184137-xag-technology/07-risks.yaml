- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Margin compression
    - Gross margin deterioration
    - Sustained drop below mid-20s % without compensating growth quality
    - Pause / re-underwrite hardware economics
  - - Cash stress
    - Cash conversion and reserve drawdown
    - Multiple periods of negative operating cash flow plus shrinking cushion
    - Assume new financing need or down-round risk
  - - Regulatory tightening
    - Market-entry delays or permit losses
    - Material restriction in a flagship overseas market
    - Reduce international-growth confidence
  - - Channel failure
    - Brazil / SEA partner underperformance
    - Stalled deployments or support breakdown in major partner market
    - Reassess distribution moat
  - - Competitive shock
    - DJI or other rival pricing pressure intensifies
    - Evidence of aggressive discounting or share loss
    - Tighten valuation discipline and moat assumptions
  notes: 'The triggers emphasize thesis transmission: each event must matter to revenue quality, margin, or expansion viability.'
