evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Board committee charters, related-party controls, and post-IPO governance plan.
    whyItMatters: >-
      Public investors need to know whether founder control will be balanced by real independent oversight and
      financial-control discipline.
    diligencePath: >-
      Request the post-listing governance pack, committee terms of reference, and any investor-rights agreements that
      survive listing.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: headcount-gap
    missingEvidence: A current, independently corroborated employee headcount as of mid-2026.
    whyItMatters: >-
      Headcount is a key late-stage operating-scale and cost-base signal that influences margin and execution
      assessments.
    diligencePath: >-
      Ask management for current FTE count by function and geography and reconcile it against social-insurance or
      HR-system summaries.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: capital-raised-gap
    missingEvidence: A primary-round-by-primary-round capital table separating fresh money from secondary share transfers.
    whyItMatters: >-
      Without that bridge, public claims about total capital raised and pre-IPO valuation can be overstated or mixed
      with non-balance-sheet transactions.
    diligencePath: >-
      Extract the full financing history from the prospectus cap-table annex and reconcile it against investor-side
      disclosures.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: A reconciled definition set showing exactly which reports include software and services in 2026 market totals.
    whyItMatters: >-
      Without that bridge, investors can overstate or understate market size by several billion dollars and misjudge
      penetration rates.
    diligencePath: >-
      Obtain methodology notes from the major analyst reports and restate them into a like-for-like hardware-only and
      hardware-plus-software range.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: service-layer-monetization
    missingEvidence: Reliable public data on average software or service attach rates to agricultural-drone deployments.
    whyItMatters: >-
      The highest-value part of the market may sit outside hardware, but public sources do not quantify that layer
      cleanly.
    diligencePath: Interview distributors, service operators, and channel partners on attach rates and recurring revenue share.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: category-expansion
    missingEvidence: >-
      Independent evidence that quantifies how much value broader autonomous farm workflows add beyond spraying
      hardware.
    whyItMatters: The category narrative increasingly depends on ecosystem expansion, yet public revenue decomposition remains weak.
    diligencePath: >-
      Seek partner case studies and segment disclosures that break out mapping, autonomy, and software revenue
      separately from spray hardware.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Standardized realized pricing by drone model, software layer, and geography across XAG, DJI, Hylio, and service
      competitors.
    whyItMatters: >-
      Without real deal data, it is hard to distinguish premium pricing power from channel noise or temporary
      discounting.
    diligencePath: Collect distributor quotes, customer invoices, and product-level ASP trends by region and crop.
    relatedQuestionRefs:
      - QP022
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: Independent win-loss data showing which competitor classes beat XAG most often by crop, geography, and buyer type.
    whyItMatters: The category is multi-layered, so generic competitor mentions do not reveal where XAG is truly strong or weak.
    diligencePath: >-
      Request sales pipeline, churn, and loss-reason data segmented by DJI, service providers, and software-first
      adjacencies.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: market-share
    missingEvidence: >-
      A single like-for-like market-share dataset covering both China and global agricultural-drone shares with
      consistent definitions.
    whyItMatters: Different studies rank leaders with different category scopes, complicating moat conclusions.
    diligencePath: Reconcile filing, analyst, and company-market-share claims into one adjusted competitive-share view.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, sales-cycle, payback, and partner-economics data for XAG’s distributor-led motion.
    whyItMatters: >-
      Without those metrics, investors cannot assess whether revenue growth is efficient or simply supported by heavy
      channel spending and working-capital use.
    diligencePath: Request channel contracts, partner incentive schedules, and customer-acquisition cohorts segmented by region.
    relatedQuestionRefs:
      - QI019
      - QI024
      - QI010
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: product-level-margins
    missingEvidence: Product-line gross margins for drones, rovers, autopilot, and smart-farm IoT.
    whyItMatters: Blended gross margin can hide whether new adjacencies are accretive or dilutive.
    diligencePath: Request product P&Ls, warranty reserves, and support-cost allocations by SKU family.
    relatedQuestionRefs:
      - QI011
