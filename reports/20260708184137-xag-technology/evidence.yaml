    whyItMatters: >-
      One-year profitability improvement is encouraging, but unstable cash conversion can still force financing
      dependency.
    diligencePath: Obtain quarterly cash-flow bridge, inventory changes, and receivables aging through the latest close.
    relatedQuestionRefs:
