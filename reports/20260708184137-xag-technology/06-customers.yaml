  - FU002
- id: named-proof
  title: Named Customer Proof and What It Actually Shows
  body: 'The strongest public adoption proof comes from named operators rather than from anonymous scale claims. In Vietnam, Nguyễn Văn Hường’s case is specific enough to matter: crop type, farm size, learning curve, water savings, time savings, and cost claims are all articulated. In Brazil, Bruno Oliveira’s account similarly includes crop mix, operating constraints, water savings, time savings, and comments on partner support. These are useful because they are real operating narratives, not generic logo walls. The IRRI collaboration is different but also important. It is not a revenue-heavy farm account in the same sense, yet it validates that recognized agricultural institutions see enough value to integrate XAG drones into research and protocol-building work. What none of these proofs gives investors is a denominator: we know that some deployments work, but we do not know how representative they are across the broader customer base.'
  claimRefs:
