company:
  name: XAG Technology
chapter:
  number: 6
  title: Customers
  summary: 'XAG’s public customer proof is materially better than logo-only marketing: named farm operators in Vietnam and Brazil report concrete time, water, and cost outcomes, while IRRI and partners provide institutional validation in rice systems. The company’s broad international footprint and channel-led expansion are supportable. What is not supportable from public evidence is retention quality: there is no disclosed NRR, GRR, churn, contract-duration, or top-customer concentration data, so the chapter is positive on adoption and incomplete on durability.'
sections:
- id: segments-and-journey
  title: Buyer Segments and Customer Journey
  body: 'XAG’s public customer evidence points to a surprisingly varied buyer base. The company is not serving only one kind of farm. Named proofs include a Vietnamese specialty-crop grower managing a four-hectare durian-oriented farm, a Brazilian mixed-crop family operation with hundreds of hectares across coffee, grapes, soy, and corn, and the institutional rice-research ecosystem around IRRI in the Philippines. Public materials also show that XAG depends materially on local partners, distributors, and service networks to translate demand into deployment. That matters because the customer journey looks channel-led: awareness comes through trade shows, peer examples, and partner outreach; evaluation runs through local product support or training; deployment succeeds when the customer can actually learn the operating model quickly; and advocacy shows up via testimonials and partner case studies. This is not the same as a pure direct-sales model, and it likely affects both conversion and
    retention behavior.'
  claimRefs:
  - CU001
  - CU002
  - CU015
  - CU016
  - CU025
  - CU026
  - CU032
  tableRefs:
  - TU001
  figureRefs:
