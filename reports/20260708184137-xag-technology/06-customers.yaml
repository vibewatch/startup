- id: adoption-trajectory
  title: Adoption Trajectory and Geographic Shape
  body: 'The public record does support real deployment breadth. Yicai’s overseas coverage cites 64 countries and more than 100,000 UAVs sold abroad, with Brazil singled out as the largest overseas market. The company’s own materials still use more conservative language—60-plus countries—but both lenses indicate a business with substantial geographic reach. The qualitative shape of adoption is also visible: Brazil is framed as the flagship commercial market, Vietnam as a high-value specialty-crop showcase, and the Philippines as an institutional rice and protocol-building foothold. This mix is strategically relevant because it shows XAG winning in different agronomic contexts, not only in a single domestic niche. At the same time, public deployment breadth should not be mistaken for customer durability. It proves reach, not necessarily repeat revenue quality.'
  claimRefs:
  - CU003
  - CU004
  - CU014
  - CU020
  - CU028
  - CU029
  - CU032
  tableRefs:
  - TU002
- id: retention-and-risks
  title: Retention, Expansion, and Concentration Risk
  body: 'The key weakness in the customer story is the lack of public durability metrics. None of the reviewed sources provides NRR, GRR, cohort retention, churn, contract length, or top-customer exposure. That makes it impossible to distinguish a business with truly durable repeat economics from one that simply has attractive case studies and broad geographic distribution. The structure of the product does imply some repeat-use stickiness: training matters, adjacent use cases can expand over time, and local partner support appears valuable. But that is still inference, not disclosure. Concentration risk is similarly unresolved. We do not know whether a handful of partners, markets, or enterprise relationships dominate economics. We also lack a clean public adverse record on failed deployments or churn, which is better than seeing negative evidence but still not the same as proving strong retention.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU021
  - CU022
  - CU023
  - CU024
  - CU031
  - CU033
  - CU035
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer Verdict
  body: On balance, XAG’s public customer evidence is better than a typical marketing-only hardware company because it includes named operators, outcome detail, institutional collaboration, and geographically varied case studies. That is real proof of adoption. But it is still not enough to underwrite customer quality in a venture or growth-equity sense. The company’s strongest public evidence answers whether the product can be used effectively by real growers and partners; it does not answer whether those users renew, expand, concentrate, or generate high-quality recurring economics. Investors should therefore treat the customer chapter as supportive on adoption quality and incomplete on durability. The adoption proof is real. The retention proof remains mostly absent.
  claimRefs:
  - CU030
  - CU034
  - CU035
