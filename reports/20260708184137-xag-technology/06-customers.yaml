  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, contract duration, and repeat-purchase cohorts by region or channel.
    whyItMatters: Without retention metrics, adoption proof cannot be converted into durable revenue quality.
    diligencePath: Request customer cohorts, partner renewal rates, and repeat product purchases by account.
    relatedQuestionRefs:
    - QU016
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue-weighted customer or partner concentration by geography and distributor.
    whyItMatters: A seemingly broad international footprint could still hide dependence on a few markets or partners.
    diligencePath: Request top-10 partner/customer revenue share and country-level revenue mix.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU005
    - TU003
  - type: missing-source
    severity: minor
    topic: adverse-customer-evidence
    missingEvidence: Independent complaint, churn, or failed-deployment evidence tied to named XAG customer accounts.
    whyItMatters: The absence of negative public evidence is not the same as proof of strong retention.
    diligencePath: Search distributor forums, procurement records, and local-language complaints for deployment failures or service dissatisfaction.
