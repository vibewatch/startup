company:
  name: XAG Technology
chapter:
  number: 8
  title: Valuation
  summary: XAG looks like a credible late-stage ag-automation company, but the current public record supports constructive interest more than high-conviction buying. Conflicting private-company marks around RMB 7.3 billion and RMB 10.5 billion imply materially different trailing multiples on 2025 revenue and profit, while key variables—retention, channel economics, product-level margin quality, and capital-structure detail—remain under-disclosed. The most defensible stance is track / research more, with tighter entry discipline and a preference for pricing closer to the lower end of the public mark range until durability evidence improves.
sections:
- id: recommendation
  title: Recommendation, Confidence, and Risk Rating
  body: 'The right recommendation on the current public record is not a generic good-company verdict. It is a price-sensitive, evidence-sensitive stance. XAG has enough proof to justify constructive interest: audited revenue and profit improvement, broad product scope, real overseas deployments, and a still-large category opportunity. But it does not have enough public disclosure to justify high-conviction underwriting at the top end of the valuation marks circulating in the market. Customer durability, channel economics, product-level margin quality, and dilution overhang remain too incomplete. That is why the recommendation is best framed as track or research more rather than buy. Confidence should be medium because the company quality is real, but the valuation support is not yet clean. Risk rating should remain high because the upside case still depends on regulation, channels, hardware margins, and capital discipline rather than on a simple software-like recurring-revenue engine.'
