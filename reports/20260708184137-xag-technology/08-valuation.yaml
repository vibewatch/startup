- id: comparable-set
  title: Comparable Set and Why It Is Imperfect
  body: Public comparables are helpful but structurally imperfect. Deere, AGCO, CNH, and Komatsu are larger agricultural or machinery incumbents with diversified revenue, established dealer networks, and much greater scale. Trimble and Hexagon provide precision-workflow and industrial-digital context, but they are not agricultural-drone businesses. EHang is closer on autonomous-aircraft narrative but not on agricultural economics. That mismatch matters because it prevents false precision. The comparable set is still useful for humility. It shows that investors do not have a clean public benchmark for a company exactly like XAG, which should reduce confidence in sharp private-company marks rather than increase it. The best use of the comp set is to triangulate how much execution and margin durability XAG would need before it earns a sustained premium-multiple narrative.
