  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-channel-economics
    missingEvidence: NRR, GRR, repeat purchase, top-partner concentration, and distributor economics.
    whyItMatters: Those are the missing variables that most affect whether XAG deserves a premium private-company multiple.
    diligencePath: Request cohort retention, partner take rates, top-country revenue share, and repeat-product-adoption curves.
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV030
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: valuation-mark-dispersion
    missingEvidence: A current priced financing or public bookbuilding range that reconciles the RMB 7.3B and RMB 10.5B references.
    whyItMatters: The difference between the published marks is too large to ignore and materially changes implied multiples.
    diligencePath: Request latest internal mark history, secondary transactions, and IPO pre-marketing valuation guidance.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV008
    - QV023
    relatedTableRefs:
    - TV003
    - TV004
  - type: missing-source
    severity: material
    topic: capital-structure-overhang
    missingEvidence: Preference stack, liquidation terms, and actual dilution assumptions for new money at IPO or late-stage private entry.
    whyItMatters: Equity return can diverge sharply from enterprise-value optics when the cap table is opaque.
    diligencePath: Obtain the full cap table, preference stack, option pool, and expected dilution waterfall.
