- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Gross-margin compression
    - Sustained fall back toward low-20s or below
    - Undermines claim that XAG has crossed into durable hardware profitability
    - Re-rate toward bear case
  - - Cash-conversion relapse
    - Repeated negative operating cash flow with shrinking reserves
    - Raises financing dependency and dilution risk
    - Tighten position or pass on entry
  - - Channel concentration shock
    - Brazil / SEA partner underperforms materially
    - Damages overseas-growth thesis and customer-quality narrative
    - Pause growth underwriting
  - - Regulatory setback
    - Meaningful restriction in a priority spray-drone market
    - Reduces deployable TAM and raises cost of expansion
    - Cut valuation range
  - - Adjacency underperformance
    - Rover / autopilot / IoT remain commercially immaterial
    - Weakens platform-breadth premium
    - Value more like a single-category hardware vendor
  claimRefs:
  - CV022
  - CV025
  - CV027
  - CV028
  - CV032
  - CV033
  notes: Kill triggers are IC-style guardrails inferred from reported economics and market risks, not company-disclosed covenant thresholds.
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Retention quality
    - NRR, GRR, churn, repeat-purchase cohorts
    - Determines whether customer proof deserves premium valuation
    - Request cohort table by geography and channel
  - - Partner economics
    - Distributor take rates, support burden, top-partner concentration
    - Core to scaling and margin durability
    - Request partner P&L and top-10 partner mix
  - - Product-level margin
    - Gross margin by drones, rover, autopilot, IoT
    - Tests whether breadth improves or dilutes economics
    - Request SKU-family margin bridge
  - - Capital structure
    - Preference stack, dilution, and post-IPO financing need
    - Important for true investor return, not just enterprise value
    - Request latest cap table and use-of-proceeds waterfall
  - - Regulatory expansion
    - Priority-market approval matrix and incident record
    - Needed to underwrite international scale
    - Request market-by-market compliance matrix
  - - Geographic quality of revenue
    - Country-level revenue, margin, and support cost
    - Overseas growth may be high quality or merely volume
    - Request country P&L and support economics
  claimRefs:
  - CV018
  - CV027
