- id: scenarios
  title: Bull, Base, and Bear Scenarios
  body: The bull case assumes that audited profitability is the beginning of a durable curve rather than a temporary high-water mark, that overseas growth continues to diversify the business, and that adjacent modules such as rover, autopilot, and IoT improve the quality of each customer relationship. In that world, XAG could plausibly grow into or beyond the higher end of its publicized mark range. The base case assumes that profitability remains real but the market still values the company as a hardware-heavy, regulation-shaped operator with only partial recurring economics. In that scenario, the Hurun-style range is more defensible than the higher figure. The bear case assumes price pressure, slower cash conversion, and insufficient proof that customer durability or product breadth actually improves economics. In that world, even the lower publicized marks could prove rich.
  claimRefs:
