- id: valuation-context
  title: Valuation Context and What the Public Marks Imply
  body: The public valuation context is messy, not definitive. Multiple sources point to a roughly RMB 7.3 billion unicorn-style mark, while other Chinese coverage cites a higher figure around RMB 10.5 billion. Those are not trivial differences. On 2025 prospectus revenue of RMB 1.166 billion, they imply trailing price-to-sales ratios of about 6.3x and 9.0x respectively. On 2025 net profit of RMB 123.8 million, they imply trailing P/E ratios of roughly 59x and 85x. That is a wide band for a hardware-led company that still faces margin and regulatory risk. The figures are not impossible if investors believe XAG is on the edge of durable global scale, but they are aggressive enough that missing retention and channel data matter. The valuation question is therefore not whether XAG deserves to be worth something significant; it is whether the public record proves enough quality to support the upper end of the mark range today.
  claimRefs:
