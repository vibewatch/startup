      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary near-term growth driver is the expansion of NCCN clinical guidelines to include comprehensive
              biomarker testing across additional cancer types and treatment lines. NCCN guideline mentions function as
              a demand signal for oncologists: once a guideline includes a biomarker test, payer coverage tends to
              follow. CMS NCD 90.2 (effective March 16, 2018) provides the foundational Medicare coverage framework,
              requiring NGS tests to have FDA approval or clearance as a companion diagnostic for the patient's specific
              cancer. Caris's MI Cancer Seek (MCS) assay received FDA CDx approval in June 2024, creating an anchor
              reimbursement pathway. ChromoSeq's MolDX local coverage determination (LCD) in May 2026 further expanded
              Medicare reimbursement for myeloid malignancies (AML, MDS, MPN). The broader oncology drug launch cadence
              — an average of 25 new active oncology substances per year globally — expands the pool of targetable
              alterations requiring molecular companion diagnostics, directly increasing Caris's relevant case volume.


              The primary adoption constraints are reimbursement-related. The DOJ False Claims Act investigation under
              the 14-day Medicare rule (civil investigative demand received March 2025) is an active adverse signal: if
              CMS determines that Caris billed tests in violation of the date-of-service rule, the company faces
              potential recoupment, penalties, and operational changes to its billing workflow. Commercial payer
              coverage is fragmented across 90+ individually negotiated contracts, each with different prior
              authorization requirements and coverage limitations. The New York CLEP restriction excludes a major
              metropolitan market from liquid biopsy sales. Longer term, the multi-cancer early detection market
              (estimated at $100 billion by Caris) has no established CMS reimbursement pathway, making the timeline to
              monetize this opportunity highly uncertain and dependent on clinical validation study outcomes and
              regulatory decisions.
