  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current market context and IPO framing
        blocks:
          - type: paragraph
            body: >-
              By May 22, 2026, direct quote pages put CAI at about $15.94 per share, a $4.51B market cap, and 282.68M
              shares outstanding. Against March 31, 2026 cash, cash equivalents, and restricted cash of $823.4M, plus a
              $400M initial term loan under the new April refinancing, that implies roughly $4.09B of enterprise value,
              or about 4.0x FY2026 revenue guidance midpoint. That is a far more useful anchor than any single IPO
              headline because the IPO itself was framed multiple ways. The marketed range in June 2025 pointed to as
              much as $5.3B-$5.35B of valuation at $16-$18 per share, while the final prospectus priced 23.53M shares at
              $21 with a 3.53M-share over-allotment option and the FY2025 10-K later disclosed $519.5M of net IPO
              proceeds. In practice, Caris now trades below the IPO price but at an equity value that still depends
              heavily on whether one uses current quote-page shares, basic post-offering shares, or a more fully diluted
              share count. The right takeaway is not that one IPO headline was wrong; it is that share-count precision
              is an active valuation variable for Caris and should be handled as a diligence item rather than a settled
              fact.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
