  - id: FE001
    title: Product architecture map
    type: stack
    caption: >-
      Caris's product architecture is organized as a six-layer stack from raw biological sample through commercial AI
      products. The data flywheel runs vertically: every clinical case processed at the laboratory layer adds records to
      the CODEai platform layer, which in turn trains all downstream AI products. MI Cancer Seek operates as a parallel
      IVD track with stricter Illumina NovaSeq 6000 hardware constraints imposed by the FDA PMA SSED.
    data:
      layers:
        - label: Sample Acquisition Layer
          detail: >-
            Tissue (FFPE biopsy) or blood draw (peripheral blood for Assure/MI Cancer Seek/Caris Detect); sample
            logistics and chain-of-custody; Caris Assure NY unavailability pending CLEP
        - label: Laboratory Processing Layer
          detail: >-
            DNA/RNA extraction and QC; sequencing on Illumina NovaSeq 6000 (CDx/IVD) or NovaSeq X Plus (LDT); Phoenix AZ
            solid (66k sq ft) and blood (35.5k sq ft) labs; over 1T reads/day throughput
        - label: Bioinformatics Pipeline Layer
          detail: >-
            Variant calling (SNVs, indels, CNVs, fusions); WES 23,000+ genes; WTS 23,000+ transcripts; germline
            subtraction (cNAS buffy coat) for liquid assays; proprietary closed-source algorithms
        - label: CODEai Data Platform Layer
          detail: >-
            484,000+ matched patient profiles; 1M+ data points per patient; genomic plus transcriptomic plus real-world
            clinical data; AI/ML training substrate; biopharma data licensing layer
        - label: AI Products Layer
          detail: >-
            GPSai (tumor origin; 95% non-CUP / 84% CUP accuracy); FOLFIRSTai (mCRC chemo; 17.5-month OS benefit); MI
            Clarity (breast cancer recurrence; H&E input; 2026 launch); CODEai intelligence
        - label: Clinical Delivery Layer
          detail: >-
            MI Profile report (10-14d tissue; 7d blood); EHR integration (300+ orgs; 3,350+ locations); Molecular Tumor
            Board Report; MI Cancer Seek CDx report (IVD); patient and physician portals
    claimRefs:
      - CE001
      - CE007
      - CE013
      - CE014
      - CE015
