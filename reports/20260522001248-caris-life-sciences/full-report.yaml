  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences operates in a multi-segment precision oncology diagnostics market where no single
              competitor matches its breadth—simultaneous Whole Exome Sequencing (WES) and Whole Transcriptome
              Sequencing (WTS) across 23,000+ genes—but multiple well-capitalized rivals dominate individual segments.
              The competitive landscape can be organized into four tiers: (1) direct tissue-based CGP rivals,
              principally Foundation Medicine (Roche subsidiary) and Tempus AI; (2) liquid biopsy and minimal residual
              disease (MRD) specialists, led by Guardant Health and Natera; (3) adjacent hereditary cancer testing and
              colorectal screening competitors, principally Myriad Genetics and Exact Sciences; and (4) the nascent
              multi-cancer early detection (MCED) arena, where GRAIL's Galleri test is the commercial incumbent and
              Caris Detect is an unproven pipeline entrant.

              The status quo alternative for most oncologists is sending a tissue biopsy to a hospital or academic
              reference laboratory (Quest Diagnostics, LabCorp, or an institutional CLIA lab) for single-gene or
              small-panel molecular testing. Switching from this status quo to a comprehensive platform like Caris MI
              Profile involves turnaround time risk, physician education cost, and payer authorization effort—but once
              an oncology practice embeds a CGP vendor's workflow and EMR integration, switching is uncommon. Internal
              build (hospital-operated NGS labs) is a substitute in academic medical centers; however, standalone labs
              lack the data scale, regulatory CDX approvals, and pharma partnerships that differentiate the major
              pure-play platforms.

              Across all arenas, the convergent strategic battleground is the clinico-genomic database: each company's
              ability to monetize its test volume through pharma data licensing, companion diagnostic (CDX)
              partnerships, and AI-driven biomarker discovery. Caris's CODEai platform (484,000+ matched clinico-genomic
              datasets), Foundation Medicine's biopharma services division (>50% of US NGS CDX approvals), and Tempus
              AI's life-sciences data platform (8M+ de-identified research records) are competing for the same pharma
              research and CDX development budgets.
