      - number: '3.6'
        title: Moat Durability and Competitive Risk Assessment
        blocks:
          - type: paragraph
            body: >-
              Caris's primary moats against competitive displacement are: (1) data scale and matched clinico-genomic
              database (1.07M+ total profiles, 484,000+ matched datasets as of March 2026), which creates a durable
              pharma data licensing advantage that smaller competitors cannot quickly replicate; (2) WES+WTS combined
              breadth, currently unique at commercial scale—Tempus's xT CDx + xR combination is the closest substitute
              but requires separate test orders; (3) reimbursement infrastructure built on a decade of Medicare,
              Medicaid, and commercial payer negotiations; and (4) the CODEai AI/ML platform, which converts testing
              volume into pharma R&D revenue through real-world data, biomarker discovery, and clinical trial matching.

              The primary vectors of competitive displacement threatening Caris's moat are: (a) Foundation Medicine's
              FDA CDX companion diagnostic lock-in—when a drug's prescribing information specifically requires
              FoundationOne CDx for patient selection, oncologists cannot substitute Caris MI Profile, regardless of
              technical breadth; (b) Tempus AI's EHR-integrated AI platform (Tempus One) which embeds ordering workflows
              and AI-generated clinical insights directly into physician practice, increasing stickiness and switching
              cost over time; (c) Guardant Health's established liquid biopsy relationships with 12,000+ physicians,
              which may capture new liquid CGP demand before Caris Assure achieves comparable scale; and (d) GRAIL's
              first-mover advantage in the MCED screening segment, where Caris Detect has not yet launched commercially.

              Switching costs for oncologists who have deeply embedded Caris MI Profile in their workflow include:
              reporting format change, revalidation of bioinformatics pipelines, re-education of clinical staff, and
              renegotiation of billing and logistics contracts. However, switching cost is lower for oncologists who
              multi-home between vendors depending on tumor type or test indication. Multi-homing risk is highest in
              liquid biopsy, where Guardant360 and Caris Assure could be ordered from the same practice for different
              indications. The primary adverse signal for Caris's competitive position is Foundation Medicine's
              entrenched CDX footprint: more than 50% of approved US NGS CDX indications naming FoundationOne CDx as the
              required test creates a structural limit on Caris MI Profile's addressable market for companion
              diagnostic-guided therapy selection, unless Caris separately pursues CDX approval for each corresponding
              drug.
            claimRefs:
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
      - number: '3.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Foundation Medicine CDX Lock-In Is a Structural Market Ceiling for Caris
            body: >-
              Foundation Medicine holds more than 50% of all approved US NGS companion diagnostic (CDX) indications.
              When a drug's FDA-approved prescribing information names FoundationOne CDx as the required companion
              diagnostic test for patient selection, oncologists cannot substitute Caris MI Profile—regardless of
              Caris's broader genomic coverage or clinical utility claims. This structural exclusion reduces Caris's
              addressable market for each CDX-gated drug and compounds over time as more drugs receive FDA approval with
              FMI-specific CDX labels.
            calloutType: risk
            claimRefs:
              - CP008
              - CP035
          - type: callout
            title: Caris Detect Enters MCED Market Without Comparative Clinical Evidence
            body: >-
              GRAIL's Galleri test is commercially launched, backed by Lancet and Annals of Oncology publications, and
              has a 0.4% false positive rate with 93.4% cancer signal of origin accuracy. Caris Detect is planned for a
              first-half 2026 commercial launch using a whole-genome sequencing approach—but no comparative head-to-head
              clinical data against Galleri has been published. GRAIL's 10-K explicitly identifies Caris as a future
              MCED entrant, not a current commercial participant. Without published sensitivity and specificity data
              comparable to Galleri's multi-year clinical evidence package, Caris Detect will face significant payor
              coverage and physician adoption barriers.
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
              - CP033
          - type: callout
            title: Caris's Matched Clinico-Genomic Database Is a Durable Pharma Monetization Asset
            body: >-
              With 484,000+ matched clinico-genomic datasets powering the CODEai platform, Caris holds a database that
              took a decade to assemble at commercial scale and cannot be rapidly replicated by a new entrant. Pharma
              R&D services revenue of $45.3M in FY2025 already demonstrates monetization, and the data flywheel—more
              tests generate more matched data, which attracts more pharma partnerships, which cross-subsidize clinical
              testing volume—is the structural basis for long-term competitive advantage.
            calloutType: strength
            claimRefs:
              - CP003
              - CP034
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and recognition
        blocks:
          - type: paragraph
            body: >-
              Caris monetizes two streams against the same oncology data and laboratory stack. Molecular profiling
              services are the core engine: FY2025 molecular profiling revenue was $766.7M, or roughly 94% of total
              revenue, and Q1 2026 molecular profiling revenue was $210.8M. Pharma research and development services
              were much smaller at $45.3M in FY2025 and approximately $5.4M in Q1 2026, but management still guided the
              segment to $75M-$85M for FY2026. The public record therefore supports a company whose current revenue
              quality is still primarily clinical-testing driven rather than platform-licensing driven. The 10-K also
              makes the recognition mechanics clear. Molecular profiling revenue is recorded when profiling results are
              provided to ordering physicians, while the transaction price is constrained by variable consideration,
              implicit price concessions, and historical reimbursement collections across payer portfolios. That means
              reported growth is real but not identical to list pricing. Medicare-covered patients accounted for about
              39.6% of FY2025 molecular profiling revenue, Caris says it is in-network with most major commercial payers
              and over 100 health plans covering 200 million lives, and CMS fee-schedule plus LCD/NCD rules still frame
              the reimbursement ceiling. The public gap is that realized ASP by payer type remains undisclosed, so the
              strongest revenue trend is observable but not fully decomposable.
