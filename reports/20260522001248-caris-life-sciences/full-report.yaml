      - number: '3.3'
        title: Liquid Biopsy and MRD Competitors
        blocks:
          - type: paragraph
            body: >-
              Guardant Health, Inc. (NASDAQ: GH) is the commercial leader in liquid biopsy for advanced cancer, having
              performed more than 500,000 blood tests for over 12,000 physicians. The FDA recently approved a new
              version of Guardant360 Liquid CDx for comprehensive genomic profiling from blood—directly competing with
              Caris Assure. The Guardant360 CDx is a circulating cell-free DNA test that profiles solid tumor genomics
              without a tissue biopsy, offering a key workflow advantage in patients where tissue access is limited.
              Guardant Health also offers Shield, a blood test for colorectal cancer screening, and Guardant Infinity, a
              next-generation MRD and treatment response monitoring platform (InfinityAI). Guardant's core advantage
              over Caris Assure is greater commercial maturity, established physician relationships built over years of
              liquid biopsy market development, and a blood-test-only business model that may be easier to scale
              reimbursement for. Caris Assure's WES+WTS blood-based profiling is technically more comprehensive than
              Guardant360's targeted panel, but Guardant's earlier FDA approvals and broader physician adoption
              represent a meaningful distribution moat.

              Natera, Inc. (NASDAQ: NTRA) is a global leader in cell-free DNA (cfDNA) testing across oncology, women's
              health, and organ health. In oncology, Natera's product suite includes: Signatera (personalized
              tumor-informed MRD assay using whole-exome or whole-genome sequencing on primary tissue, with Medicare
              coverage as of 2025); Altera (tumor genomic profiling, ordered with or without Signatera from a single
              tissue sample); Latitude (tissue-free MRD testing); and Empower (germline hereditary cancer testing).
              Natera has more than 400 peer-reviewed publications and operates CLIA-certified, CAP-accredited
              laboratories. Signatera is specifically the "only genome-designed MRD assay" with Medicare coverage, per
              Natera's own claims, giving it a reimbursement advantage in MRD monitoring. Natera competes with Caris
              Assure in liquid biopsy tumor profiling (Altera) and with Caris MI Profile as an alternative comprehensive
              CGP approach. GRAIL's 10-K filed for fiscal year 2025 identifies Natera as a CGP competitor alongside
              Caris, Foundation Medicine, Guardant, and Tempus, indicating broad industry recognition of Natera's
              expanding oncology diagnostics footprint.
