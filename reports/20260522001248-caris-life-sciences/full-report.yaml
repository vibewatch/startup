      - number: '3.5'
        title: Multi-Cancer Early Detection Arena
        blocks:
          - type: paragraph
            body: >-
              The multi-cancer early detection (MCED) arena is a nascent segment in which GRAIL, Inc. (NASDAQ: GRAL) has
              established a commercial first-mover advantage with the Galleri test, while Caris Detect represents an
              unproven pipeline entrant with a planned commercial launch in the first half of 2026. GRAIL's Galleri test
              screens for more than 50 cancer types from a single blood draw, detects cancer signal in patients who are
              still asymptomatic, achieves a false positive rate of just 0.4% (the lowest of any available MCED test per
              GRAIL's claims), and predicts the cancer signal of origin with 93.4% accuracy. Galleri's sensitivity
              exceeds 70% for the 12 cancers responsible for two-thirds of U.S. cancer deaths. GRAIL generated total
              revenue of $147.2 million in fiscal year 2025 (up from $125.6M the prior year), though it remains
              pre-profitability and pays a high single-digit perpetual royalty to Illumina.

              Caris Detect, based on whole-genome sequencing of blood, is positioned as a comprehensive MCED alternative
              to Galleri's methylation-based approach. However, GRAIL's own 10-K filing for fiscal year 2025 identifies
              Caris Life Sciences alongside Clearnote Health and Natera as companies that "have announced intentions to
              develop or launch MCED products"—categorizing Caris Detect as a future threat rather than a current market
              participant. Guardant Health also introduced MCED products in 2025, per the GRAIL 10-K. The competitive
              risk for Caris in the MCED segment is significant: GRAIL has published results in top-tier journals
              (Lancet, Annals of Oncology), has extensive case-controlled and interventional study data, and has
              established payor and physician relationships before Caris Detect's commercial launch. An unproven Caris
              Detect entering a market with an established GRAIL Galleri, plus additional entrants from Guardant Health
              and potentially Natera, represents a material adverse risk to Caris's MCED revenue projections.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
