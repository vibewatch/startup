chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Scale
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences, Inc. is a next-generation precision medicine company headquartered at 750 W. John
              Carpenter Freeway, Suite 800, Irving, TX 75039 (phone: 866-771-8946). Founded in 2008 by David Dean
              Halbert, the company is incorporated in Texas and classified under SIC code 8071 (Services—Medical
              Laboratories). It operates additional offices in Phoenix, AZ; New York, NY; Cambridge, MA; Tokyo, Japan;
              and Basel, Switzerland, reflecting both domestic scale and nascent international presence.


              The business model is a fee-for-service precision diagnostics and data platform. Caris generates revenue
              primarily through molecular profiling services billed to Medicare, Medicaid, and commercial insurers on
              behalf of oncologists — with reimbursement rates driven by payer coverage determinations and average
              selling price (ASP) improvements. A secondary revenue stream, pharma R&D services ($45.3M in FY2025),
              monetizes the same clinico-genomic database through data licensing, companion diagnostics, and clinical
              trial support for biopharma partners. The two-sided platform dynamic — clinical testing generating data
              that fuels pharma revenue — is the central strategic flywheel and the basis for the CODEai AI/ML platform.


              Caris completed its initial public offering on the Nasdaq Global Select Market (ticker: CAI) in June 2025,
              raising approximately $519.5M in net proceeds with an additional $68.9M from the overallotment option, for
              a total of approximately $588M. The company listed at a market cap of approximately $3.87B. FY2025 total
              revenue was $812.0M (+97% YoY), with a gross margin of 66% and adjusted EBITDA of $137.7M. Management
              guided FY2026 revenue to $1.0B–$1.02B. As of December 31, 2025, Caris held $796.3M in cash and had an
              accumulated deficit of approximately $2.5B — reflecting a long pre-profitability investment phase before
              the revenue inflection that began in earnest in 2024. Total profiles surpassed 1,070,000 through March
              2026, with approximately 199,300 clinical cases completed in FY2025.
