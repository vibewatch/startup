      - number: '7.4'
        title: Governance, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Caris remains founder-centered. The proxy confirms that founder, chairman, and CEO David Dean Halbert is
              the brother of director Jon S. Halbert, creating an explicit family linkage in board governance. Public
              SEC materials reviewed for this chapter do not identify a named CEO succession plan. That does not prove
              weak governance, but it does mean the investment case still leans heavily on David Halbert's continued
              stewardship, especially while the company is absorbing public-company controls work, active product
              launches, and a DOJ inquiry. [CR040] [CR041]

              Financial risk is no longer existential, but it is not gone. The company refinanced into a facility that
              includes a $300M delayed-draw tranche usable only for permitted acquisitions, up to $500M of incremental
              capacity, and a $50M minimum qualified cash covenant, with SOFR / base-rate spreads of 5.00% / 4.00% on
              the initial and delayed-draw loans. Caris therefore has real balance-sheet flexibility, but it also still
              operates with covenanted debt and secured-capital terms that matter if reimbursement, launch timing, or
              collections slip. [CR042] [CR043]

              The historical capital burden remains large. The S-1 said Caris had accumulated deficit of $2.6B as of
              March 31, 2025, and the FY2025 10-K still carried an accumulated deficit of roughly $2.5B at year-end even
              after the recent revenue inflection. Positive free cash flow is encouraging, but the company is still
              funding commercial expansion, ongoing assay launches, and platform development rather than harvesting a
              mature steady state. [CR044] [CR045]

              The immediate execution question is whether Caris can convert today's momentum into durable, compliant
              scale. Management used the Q1 2026 release to highlight a January 2026 sales-force realignment, a
              56,000-case quarterly run-rate exiting the quarter, recent launches including ChromoSeq and MI Clarity,
              and continuing work toward Detect commercialization. The business is plainly stronger than it was pre-IPO,
              yet the combination of launch cadence, reimbursement sensitivity, controls remediation, and founder
              concentration means positive cash flow should be read as a buffer, not a proof that execution risk is
              behind the company. [CR031] [CR034] [CR042] [CR043] [CR046]
            claimRefs:
