        - from: d3
          to: d2
          label: PMA locks NovaSeq 6000 as approved sequencer for MI Cancer Seek
        - from: d4
          to: d1
          label: Coverage decisions set revenue ceiling for CGP tests
        - from: d5
          to: d1
          label: AI model performance and biopharma licensing depend on database scale
        - from: d1
