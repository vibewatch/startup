      - number: '8.4'
        title: Risk discount, dilution overhang, and verdict
        blocks:
          - type: paragraph
            body: >-
              The valuation debate is now about quality and durability, not survival. Proxy disclosures show 21.9M
              options and about 4.5M RSUs outstanding, while the prospectus left founder David Halbert with roughly
              44.6% ownership and insiders with about 66.2%. That alone means the diluted share base, governance
              discount, and likely float dynamics deserve explicit treatment. The business also still carries a genuine
              legal and reimbursement discount: the 2022 14-day-rule settlement, the live CID disclosed in later public
              filings, unresolved ICFR weakness, and payer-sensitive molecular profiling mix make a Guardant or Natera
              premium premature. Detect and ChromoSeq create upside optionality, but Detect remains early commercial and
              ChromoSeq is still incremental rather than thesis-changing. On balance, Caris deserves a fair mid-pack
              multiple, not a premium hero multiple. Our stance is HOLD / selective accumulate on pullbacks. The stock
              is not clearly expensive on current EV math, but the margin of safety is too thin for an aggressive call
              until DOJ scope, exact share count, payer-quality metrics, and post-launch Detect evidence become clearer.
