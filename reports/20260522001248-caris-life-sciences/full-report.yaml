      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital story is materially stronger than it was pre-IPO. At December 31, 2025, Caris held $796.3M of
              cash and cash equivalents plus $2.3M of short-term marketable securities, and the Q1 2026 balance sheet
              showed $821.1M of cash and cash equivalents, $2.3M of short-term marketable securities, and $823.4M of
              cash, cash equivalents, and restricted cash at period end. Positive operating cash flow and free cash flow
              in both FY2025 and Q1 2026 reduce near-term dependence on external equity financing, but they do not
              eliminate financing optionality. On April 1, 2026, Caris refinanced its prior 2023 facility with a new
              Blue Owl and Blackstone-led senior secured package comprising a $400M initial term loan, a $300M committed
              delayed-draw tranche reserved for acquisitions, and up to $500M of uncommitted incremental capacity.
              Pricing at Term SOFR plus 5.00% or Base Rate plus 4.00%, together with a $50M minimum qualified cash
              covenant, is manageable against the current cash base and recent cash generation. The accumulated deficit
              of $2.5B is still a reminder that the business consumed very large amounts of capital before the 2025
              inflection. The forward judgment is therefore moderate financing dependence rather than acute dependence:
              Caris looks operationally self-funding on the current run-rate, but still maintains a meaningful credit
              backstop for M&A, execution slippage, or reimbursement shocks.
