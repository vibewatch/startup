      - number: '7.3'
        title: Operational, data, and platform risk
        blocks:
          - type: paragraph
            body: >-
              Public disclosures support a meaningful operational-risk case even without a disclosed major incident.
              Caris's 10-K cybersecurity section says the business stores sensitive patient genomic, insurance, and
              other health information, and warns that a cybersecurity incident could lead to system unavailability,
              data loss or unauthorized disclosure, litigation, investigations, and mandatory notifications. The same
              filing says that compromising Caris or vendor systems or failing evolving privacy and data-security laws
              could trigger fines, business disruption, reputational harm, and revenue loss. For a precision-oncology
              company whose value proposition depends on trusted handling of genomic data, privacy failure would harm
              both clinical revenue and pharma-data monetization. [CR035] [CR036] [CR037]

              AI risk is also explicitly disclosed rather than merely inferable. The 10-K says Caris uses AI/ML to
              assist diagnostic and benefit-prediction decisions and acknowledges that bias or inaccuracies in model
              training, inputs, outputs, or logic could disadvantage individuals and expose the company to reputational,
              regulatory, or legal harm. Caris Detect's final Achieve 1 release positions the MCED assay as an
              AI-enabled whole-genome product, but public evidence still does not disclose subgroup performance,
              post-market calibration, or head-to-head evidence against Galleri in a real screening workflow. That makes
              model-governance quality a live diligence issue rather than an abstract ethics note. [CR032] [CR033]
              [CR038]

              Supplier concentration further narrows execution tolerance. The 10-K says Caris relies on limited or sole
              suppliers for sequencers, reagents, lab materials, and other inputs and may not be able to replace them
              quickly. This matters more than it would for a software company because Caris is simultaneously running a
              scaled clinical-testing operation, launching new assays, and defending reimbursement economics. If a
              critical sequencing or reagent input tightens, management does not have much room to absorb both
              operational disruption and reimbursement volatility at the same time. [CR039]
            claimRefs:
