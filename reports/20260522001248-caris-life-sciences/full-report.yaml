      - number: '3.4'
        title: Adjacent and Substitute Competitors
        blocks:
          - type: paragraph
            body: >-
              Myriad Genetics, Inc. (NASDAQ: MYGN) is a leader in hereditary cancer genetic testing with over 30 years
              of history, having discovered the BRCA1 and BRCA2 genes. Myriad's oncology-facing products include:
              BRACAnalysis CDx (FDA-approved companion diagnostic for germline BRCA1/2 mutations in breast, ovarian,
              pancreatic, and prostate cancer); MyChoice CDx (FDA-approved for HRD status in ovarian cancer, determining
              PARP inhibitor eligibility); MyRisk Hereditary Cancer (a 63-gene panel assessing 11 hereditary cancer
              types); and Precise Tumor (a pan-cancer comprehensive NGS laboratory test). Myriad also operates in mental
              health pharmacogenomics (GeneSight, ordered for 2M+ patients) and prenatal screening (Foresight, Prequel,
              SneakPeek). Myriad's direct competition with Caris is primarily in the germline/hereditary testing space
              and in pan-cancer tissue NGS (Precise Tumor vs. MI Profile). Myriad's CDx franchise for BRCA1/2 creates a
              durable referral pathway: oncologists ordering hereditary testing often default to Myriad's approved test
              before considering a comprehensive CGP platform.

              Exact Sciences Corporation (NASDAQ: EXAS) competes primarily in colorectal cancer screening (Cologuard
              Plus) and cancer treatment guidance genomics (Oncotype DX for early-stage breast cancer, colon cancer, and
              prostate cancer recurrence risk). Exact Sciences's Oncodetect test, a liquid biopsy MRD ctDNA test, is in
              clinical development and will compete with Caris Detect and Natera Latitude in the MRD monitoring space.
              Exact Sciences does not directly compete with Caris MI Profile in comprehensive tumor genomic profiling,
              but its Oncotype DX franchise for early-stage breast cancer treatment guidance captures a significant
              share of oncologist attention at the treatment-decision step, reducing the urgency for full CGP in
              early-stage patients.

              Illumina, Inc. (NASDAQ: ILMN) is the dominant global provider of next-generation sequencing (NGS)
              instruments and reagents that underlie most DNA/RNA sequencing conducted by Caris, its competitors, and
              hospital laboratories. Illumina's competitive relevance to Caris is primarily as a platform-level
              supplier: if Illumina raises instrument costs or restricts reagent access, Caris and all CGP competitors
              face margin pressure simultaneously. Illumina formerly owned GRAIL and divested it following regulatory
              proceedings; it now retains a high single-digit perpetual royalty on GRAIL's Galleri revenues. Hospital
              reference labs (Quest Diagnostics, LabCorp) and institutional academic CLIA labs represent the traditional
              status quo for oncology molecular testing, offering large physician install bases and established billing
              relationships but lacking the CGP depth, FDA CDX breadth, and data monetization capabilities of the
              specialized platforms. FDA's companion diagnostic approval list documents the approved CDX tests by
              competitor, confirming Foundation Medicine's and Guardant Health's leading CDX positions.
