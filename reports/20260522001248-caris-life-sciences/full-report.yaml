      where Caris interacts with or generates value for the clinical customer. EHR integration compresses step durations
      between nodes 3 and 7; the 2.2-day average TAT improvement is attributable to electronic ordering and direct
      result embedding into physician workflows.
    data:
      nodes:
        - id: n1
          label: Physician Orders Test
          description: >-
            Oncologist initiates MI Profile or CDx order electronically (over 70% electronic Q1 2026) via EHR
            integration or Caris portal; Caris Assure not available in New York
        - id: n2
          label: Sample Collection and Logistics
          description: >-
            Tissue FFPE biopsy or peripheral blood draw; Caris provides collection kits and courier logistics;
            chain-of-custody maintained to Phoenix AZ laboratory
        - id: n3
          label: Laboratory Receipt and QC
          description: >-
            Phoenix lab receives sample; QC checks on DNA/RNA yield and quality; LDT or IVD workflow routing based on
            test ordered; CLIA/CAP/ISO 15189 oversight
        - id: n4
          label: NGS Sequencing and Bioinformatics
          description: >-
            WES + WTS on Illumina NovaSeq X Plus (LDT) or NovaSeq 6000 (MI Cancer Seek IVD); variant calling, fusion
            detection, expression quantification; proprietary pipeline
        - id: n5
          label: CODEai AI Interpretation
          description: >-
            CODEai matches patient profile to 484,000+ cases; GPSai identifies tumor origin; FOLFIRSTai generates mCRC
            treatment prediction if applicable; insights embedded in report
        - id: n6
          label: Clinical Report Generation
          description: >-
            MI Profile report with therapy biomarkers, GPSai tumor-origin call, FOLFIRSTai guidance for mCRC, and
            Molecular Tumor Board Report; MI Cancer Seek CDx report if IVD pathway
        - id: n7
          label: EHR Delivery and Follow-up
          description: >-
            Report delivered to ordering physician EHR (300+ orgs; 3,350+ locations); average 2.2-day TAT reduction vs.
            non-integrated workflows; Molecular Tumor Board consultation available
    claimRefs:
      - CE001
      - CE016
      - CE017
      - CE007
  - id: FE003
    title: Critical dependency map
    type: dag
    caption: >-
      This directed acyclic graph maps the five critical dependencies that underpin Caris's ability to operate and scale
      its platform. The most dangerous single-point risk is Illumina, which is both the exclusive sequencing hardware
      supplier and the regulatory lock-in partner for MI Cancer Seek's PMA. FDA oversight affects both LDT policy and
      the CDx IVD track simultaneously.
    data:
      nodes:
        - id: d1
          label: Caris Life Sciences Platform
          description: Core clinical operations, AI products, and commercial revenue
        - id: d2
          label: Illumina (Sole Sequencing Supplier)
          description: >-
            NovaSeq 6000 (PMA-locked for MI Cancer Seek) and NovaSeq X Plus (LDT); reagents and flow cells; disclosed
            sole supplier in 10-K; material single-source concentration risk
        - id: d3
          label: FDA Regulatory Framework
          description: >-
            PMA P240010 governs MI Cancer Seek; LDT enforcement posture governs all other products; September 2025 rule
            restored pre-2024 status quo; future policy reversals are residual risk
        - id: d4
          label: CMS / MolDx Reimbursement
          description: >-
            LCD L38690 and NCD 90.2 govern Medicare coverage for CGP; approximately 39.6% of FY2025 molecular profiling
            revenue from Medicare; payer coverage decisions set revenue ceiling
        - id: d5
