      - number: '5.4'
        title: Clinical Evidence and Platform Validation
        blocks:
          - type: paragraph
            body: >-
              Caris's clinical validation program spans four domains: MCED performance (Achieve 1), tumor origin AI
              accuracy (GPSai), chemotherapy selection AI (FOLFIRSTai), and real-world EHR integration gains. The
              Achieve 1 study is the pivotal clinical data set for Caris Detect. The interim readout (published February
              2025) reported 99.1% specificity in asymptomatic individuals -- meaning roughly 1 false positive per 110
              tests -- and sensitivity varying considerably by cancer type and stage. The final Achieve 1 data release
              (May 2026) confirmed the 99.1% specificity figure in the asymptomatic cohort and added stage-specific
              sensitivity data. Sensitivity for early-stage cancers (stage I-II) in the most covered types was reported
              at approximately 49%, consistent with the biological challenge of circulating signal detection in early
              disease.


              For GPSai tumor-origin identification, Caris trained the model on 201,612 clinical cases from the CODEai
              database. Independent validation reported 95% accuracy in non-CUP cancer contexts and 84% correct
              identification in true CUP cases. An earlier published paper (Abraham et al., Translational Oncology,
              2021, PMID 33465745) using an earlier training set of 77,044 cases showed accuracy above 94% on most
              tested cases, providing a third-party validated anchor for the now-larger training set.


              FOLFIRSTai's pivotal validation was published in Cancer Research Communications (DOI:
              10.1158/1078-0432.CCR-24-3335), demonstrating that mCRC patients treated concordantly with FOLFIRSTai
              predictions experienced a 17.5-month overall survival advantage vs. discordant patients. This is the first
              published prospective-like validation of an AI tool for first-line colorectal chemotherapy selection,
              giving Caris a defensible publication record. EHR integration performance is supported by Caris's reported
              2.2-day average turnaround time improvement for health systems using integrated ordering. As of Q1 2026,
              electronic order submission exceeded 70% of total orders across 300+ organizations and 3,350+ clinical
              locations.
