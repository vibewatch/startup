      - number: '5.2'
        title: Technology Architecture and Laboratory Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Caris's technical stack is built on Illumina next-generation sequencing hardware, proprietary
              bioinformatics pipelines, and a purpose-built AI/ML platform. The sequencing backbone relies on Illumina
              NovaSeq 6000 and the newer Illumina NovaSeq X Plus instruments. The company has explicitly disclosed
              Illumina as the sole supplier of critical sequencing inputs -- reagents, flow cells, and instruments -- in
              its 10-K, characterizing this as a material concentration risk. This dependency extends to the MI Cancer
              Seek IVD, where the PMA SSED restricts the cleared test to Illumina NovaSeq 6000 only, creating a
              regulatory lock-in that cannot be resolved without a new PMA supplement.


              Laboratory operations are concentrated in two Arizona facilities. The Phoenix lab operates 66,000 sq ft
              for solid tumor profiling and 35,500 sq ft for blood-based testing (Caris Assure and MI Cancer Seek
              workflows). The Tempe facility provides 59,000 sq ft dedicated to research and development. Combined,
              Caris processes more than 1 trillion sequencing reads per day across its platform -- a throughput figure
              that positions it among the largest clinical genomics labs globally. Turnaround time benchmarks are
              approximately 10-14 days for tissue samples and approximately 7 days for blood samples, with EHR
              integration delivering an average 2.2-day reduction in TAT for connected health systems.


              The EHR integration layer connects 300+ healthcare organizations across 3,350+ clinical locations to Caris
              ordering workflows, enabling electronic order submission (above 70% of orders as of Q1 2026) and direct
              result delivery into physician workflows. On the developer-facing side, Caris maintains a minimal public
              GitHub presence under github.com/Caris-Life-Sciences with three repositories: Caris-ComBat-seq (a
              batch-correction tool for RNA-seq, Jupyter Notebook, last updated November 2025), a PureCN fork (copy
              number analysis, R language, last updated March 2025), and link-encryption (a JavaScript utility, last
              updated March 2025). This limited open-source footprint reflects a proprietary-by-design architecture --
              core WES/WTS pipelines, CODEai, and clinical algorithms are not publicly shared.
