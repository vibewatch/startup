  - id: TV006
    title: Diligence and thesis break table
    columns:
      - Topic
      - Current public read
      - What changes valuation
      - Thesis-break threshold
      - Diligence ask / monitor
    rows:
      - - DOJ / CID / 14-day-rule exposure
        - Historical settlement is known; current CID scope and reserve are not public
        - Clean resolution or immaterial reserve would support a higher multiple; an expanded reserve would compress it
        - Material reserve, adverse settlement trend, or billing practice findings that impair reimbursement trust
        - Obtain counsel memo, reserve analysis, and scope / period of review
      - - Diluted share count and float
        - Options, RSUs, and quote-page shares do not reconcile cleanly to a single current basic share count
        - Cleaner diluted-share bridge raises confidence in per-share upside
        - Surprise dilution or large unlock / sale pressure that meaningfully raises effective share count
        - Build a full diluted cap table including grant prices, vesting, and lock-up dynamics
      - - Payer ASP and collection quality
        - Revenue growth is public; payer-level realized ASP, denial, and appeal economics are not
        - Better ASP durability supports base-to-bull multiple; weak collections push Caris toward bear
        - ASP deterioration or collection reversal that undermines 2025-2026 margin gains
        - Request payer-mix ASP, denial / appeal data, and price-concession history
      - - Detect commercialization
        - Achieve 1 data are promising but commercial scaling is still early
        - Early launch traction could justify migrating toward Tempus / Veracyte-like multiples
        - Delayed launch, weak physician uptake, or poor reimbursement traction
        - Monitor launch cadence, test volume, reimbursement path, and early utilization funnel
      - - ICFR remediation
        - Public materials still leave open whether the FY2025 material weakness is fully remediated
        - Completed remediation tightens confidence in forecast quality and reserve reliability
        - Repeat control failures or restatement risk after IPO
        - Review auditor commentary and remediation-testing evidence
      - - EV reconciliation and debt usage
        - Current EV looks reasonable against net cash, but delayed-draw and incremental debt capacity remain open
        - Stable or stronger net cash supports valuation floor; debt-funded M&A changes EV quickly
        - New leverage without commensurate revenue / margin uplift
        - Track borrowings, covenant headroom, and acquisition uses of capital
    notes: >-
      These are the highest-value diligence paths for deciding whether Caris deserves a mid-pack valuation, a premium
      re-rate, or a low-quality diagnostics discount.
    claimRefs:
      - CV030
      - CV037
      - CV038
