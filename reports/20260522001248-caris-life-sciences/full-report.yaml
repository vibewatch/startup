  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Competitive Positioning
        blocks:
          - type: paragraph
            body: >-
              Caris offers a multi-layer diagnostics platform spanning six distinct commercial products and one
              near-term launch. The flagship is Caris MI Profile, a laboratory-developed test (LDT) that simultaneously
              performs Whole Exome Sequencing (WES) and Whole Transcriptome Sequencing (WTS) across 23,000+ genes in
              solid and liquid tumor tissue. MI Profile is the company's primary revenue driver and the only
              commercially scaled simultaneous WES+WTS offering for solid-tumor molecular profiling. Tissue samples
              (FFPE) achieve a reported turnaround time of approximately 10-14 days; blood-based MI Profile reports in
              approximately 7 days.


              Caris Assure is the liquid biopsy companion to MI Profile, applying WES+WTS to circulating nucleic acids
              derived from whole blood. Caris's proprietary buffy coat somatic/germline subtraction (cNAS technology)
              filters inherited germline variants from the tumor signal. Caris Assure generated approximately 29,000
              cases in FY2025 and 9,200 in Q1 2026. A key limitation: Caris Assure is not currently available in New
              York State, pending CLEP laboratory approval -- a geographic constraint that affects a major oncology
              market.


              MI Cancer Seek is Caris's FDA-cleared in vitro diagnostic (IVD): PMA P240010 was approved by the FDA on
              November 5, 2024, covering a 228-gene ctDNA blood-based panel with 14 companion diagnostic indications
              across NSCLC, breast, colorectal, and other malignancies. MI Cancer Seek is mandated to run exclusively on
              Illumina NovaSeq 6000 (not the newer NovaSeq X) per the PMA SSED, making it the company's first
              IVD-regulated product and a regulatory beachhead for broader CDx expansion.


              The AI layer comprises four distinct engines. CODEai aggregates 484,000+ matched patient genomic,
              transcriptomic, and clinical records -- each with over 1 million associated data points -- to generate
              molecular intelligence that underpins all downstream AI products and biopharma data licensing. GPSai uses
              this database to identify tumor tissue of origin, trained on 201,612 cases with 95% accuracy in non-CUP
              contexts and 84% accuracy for cancer of unknown primary (CUP) identification. FOLFIRSTai is the company's
              first clinically validated AI chemotherapy selection tool, predicting optimal first-line treatment in
              metastatic colorectal cancer; independent clinical validation published in Cancer Research Communications
              reported a 17.5-month overall survival improvement in patients whose treatment was concordant with
              FOLFIRSTai guidance. Caris includes FOLFIRSTai in its standard MI Profile report at no extra cost for
              eligible mCRC patients. MI Clarity, launched in 2026, is a computational pathology AI for breast cancer
              recurrence risk stratification that analyzes H&E slides and clinical inputs without requiring additional
              genomic sequencing.
