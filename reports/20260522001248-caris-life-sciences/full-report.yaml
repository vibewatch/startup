      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              Multiple external lenses bracket the market opportunity. For the global next-generation sequencing market
              broadly defined, Allied Market Research estimates a base of $12.98 billion in 2023, projecting growth to
              $97.81 billion by 2035 at an 18.3% CAGR. MarketsandMarkets uses a narrower definition and projects the
              global NGS market at $27.14 billion by 2031, implying a 14.5% CAGR. The comprehensive genomic profiling
              (CGP) sub-market — most directly applicable to Caris's MI Profile — is sized at $10.1 billion by 2030 with
              a 15.6% CAGR in a GlobeNewswire analyst consensus. Global cancer medicine spending (a demand-side proxy)
              reached $252 billion in 2024 and is forecast at $441 billion by 2029 per IQVIA. North America holds over
              46.5% of global NGS market share, further concentrating Caris's opportunity domestically.


              Caris's own commissioned estimate, conducted by Nephron Research LLC, sizes the total U.S. oncology TAM at
              approximately $150 billion: early detection ($100 billion), MRD/monitoring ($28 billion), data services
              ($10 billion), biopharma services ($4 billion), and therapy selection ($8 billion). A critical diligence
              note: these estimates are company-commissioned, cover largely pre-commercial markets (especially the $100B
              early detection figure), and are not independently corroborated. The implied therapy-selection TAM of $8
              billion is structurally coherent with Caris's FY2025 revenue of $767 million for molecular profiling
              services — suggesting Caris has captured approximately 9.6% of its current-focus TAM in its first year of
              rapid scale. However, the global cancer diagnostics market (all modalities) is approximately $168.6
              billion (2020) growing to $280.6 billion by 2028, highlighting that NGS/CGP is still a minority of total
              oncology diagnostic spend and faces near-term share competition from imaging, pathology, and liquid biopsy
              competitors.
