      - number: '3.2'
        title: Direct CGP and Molecular Profiling Competitors
        blocks:
          - type: paragraph
            body: >-
              Foundation Medicine, Inc. (wholly owned by Roche) is Caris's most directly comparable competitor and the
              established market leader in tissue-based CGP. FoundationOne CDx analyzes 324 genes from FFPE tissue and
              is FDA-approved as a companion diagnostic (CDX) for multiple targeted therapies and immunotherapies.
              Foundation Medicine has delivered more than 1.5 million patient CGP reports, published more than 2,400
              research articles, and holds more than 50% of all approved US CDX indications for NGS testing.
              FoundationOne Liquid CDx analyzes 324 genes from circulating cell-free DNA and is FDA-approved for 311
              short variant genes, 8 rearrangement genes, and 3 copy number alteration genes. The newly launched
              FoundationOne RNA adds DNA+RNA fusion detection as an add-on to CDx orders, partially narrowing Caris's
              WTS differentiation. Foundation Medicine's Roche parent provides global distribution, biopharma CDX
              partnership infrastructure, and financial backing that Caris cannot match as a recently public company.

              Tempus AI, Inc. (NASDAQ: TEM) is a fast-growing AI-driven precision oncology platform that reported Q1
              2026 revenue of $348.1 million (+36.1% year-over-year), with diagnostics revenue of $261.1 million (+34.7%
              YoY). Tempus's xT CDx is an FDA-approved 648-gene solid tumor plus matched normal DNA sequencing
              panel—covering more genes than Foundation Medicine's 324-gene panel. Tempus also offers xR
              (whole-transcriptome RNA sequencing, directly competing with Caris's WTS), xE (whole-exome DNA
              sequencing), xF/xF+ (105- and 523-gene cDNA panels), and a suite of algorithmic tests (HRD, PurIST, IPS).
              Tempus differentiates on AI—its Tempus One platform provides AI-enabled genomic reporting integrated into
              EHR workflows, and it has built a multimodal data platform with more than 8 million de-identified research
              records serving life-sciences partners. Tempus AI was named to TIME's 10 Most Influential Health and Life
              Science Companies of 2026 and expanded its strategic collaboration with Bristol Myers Squibb in May 2026.
              In terms of CGP breadth, Tempus's combined xT CDx + xR offering is the closest functional substitute to
              Caris MI Profile.

              NeoGenomics, Inc. (NASDAQ: NEO) is a specialized oncology diagnostics reference laboratory offering more
              than 500 tests across all major testing modalities—NGS, IHC, flow cytometry, FISH, and molecular
              testing—for both solid tumors and hematologic malignancies. NeoGenomics has 2.2 million patient profiles
              from 40,000+ unique providers across 4,000 healthcare organizations, delivers more than 1.7 million
              cancer-related tests annually including 100,000+ NGS tests, and operates 13 locations across two
              continents with approximately 2,200 employees. NeoGenomics's breadth across modalities and its established
              biopharma services division (biomarker discovery, clinical trial support) make it a credible substitute in
              non-CGP oncology testing and a potential incumbent threat as it expands its NGS offering.
