  evidenceGaps:
  - type: missing-source
    severity: moderate
    topic: Exact current fully reconciled EV and peer-set normalization
    missingEvidence: The chapter retained clean May 2026 quote-page valuation data for Caris, Tempus, Guardant, NeoGenomics, Veracyte, Natera, and GRAIL, but not a similarly clean fully adjusted EV bridge for every public peer.
    whyItMatters: Peer comparisons here are strongest on market-cap / revenue and Caris-specific EV, weaker on one-to-one peer EV / revenue normalization.
    diligencePath: Pull each peer's latest quarter-end net cash or net debt and rebuild a fully normalized EV comp sheet.
    relatedTableRefs:
    - TV001
    relatedQuestionRefs:
    - QV022
  - type: missing-source
    severity: high
    topic: Exact current diluted share count and cap-table reconciliation for Caris
    missingEvidence: Quote pages show 282.68M shares outstanding, while IPO and proxy materials do not on their own provide a single, current, fully reconciled basic-versus-diluted share bridge.
    whyItMatters: Per-share upside and downside move materially if the real diluted denominator is above or below the quote-page figure.
    diligencePath: Build a current diluted-capitalization schedule from SEC filings, transfer-agent data, and management's latest grant records before making a hard per-share target.
    relatedTableRefs:
    - TV004
    - TV005
    relatedQuestionRefs:
    - QV009
    - QV031
  - type: missing-source
    severity: high
    topic: Payer-level unit economics and retention quality
    missingEvidence: Public materials do not break out realized ASP by payer, denial / appeal dynamics, physician-cohort retention, rep productivity, or CAC / payback.
    whyItMatters: The sustainability of Caris's new margin profile cannot be fully underwritten without understanding whether margin gains are structural or reimbursement-timing driven.
    diligencePath: Request payer-level ASP, collections cohorts, denial / appeal history, retention by physician cohort, and sales productivity metrics.
    relatedTableRefs:
    - TV006
    relatedQuestionRefs:
    - QV012
    - QV032
  - type: missing-source
    severity: moderate
    topic: Detect commercialization execution and exact public-market EV reconciliation
    missingEvidence: Public sources support Detect's technical promise but not detailed launch adoption, reimbursement cadence, or early volume conversion; they also do not fully settle how market-data sites are calculating current shares outstanding.
    whyItMatters: Detect is the main upside option and share-count precision is the main per-share-model input uncertainty.
    diligencePath: Track early launch metrics, reimbursement milestones, and management commentary on diluted share count in the next quarterly filing.
    relatedFigureRefs:
    - FV002
    - FV004
    relatedQuestionRefs:
    - QV013
    - QV031
    - QV032
sections:
- id: current-market-context-and-ipo-framing
  title: Current market context and IPO framing
  body: By May 22, 2026, direct quote pages put CAI at about $15.94 per share, a $4.51B market cap, and 282.68M shares outstanding. Against March 31, 2026 cash, cash equivalents, and restricted cash of $823.4M, plus a $400M initial term loan under the new April refinancing, that implies roughly $4.09B of enterprise value, or about 4.0x FY2026 revenue guidance midpoint. That is a far more useful anchor than any single IPO headline because the IPO itself was framed multiple ways. The marketed range in June 2025 pointed to as much as $5.3B-$5.35B of valuation at $16-$18 per share, while the final prospectus priced 23.53M shares at $21 with a 3.53M-share over-allotment option and the FY2025 10-K later disclosed $519.5M of net IPO proceeds. In practice, Caris now trades below the IPO price but at an equity value that still depends heavily on whether one uses current quote-page shares, basic post-offering shares, or a more fully diluted share count. The right takeaway is not that one IPO headline
    was wrong; it is that share-count precision is an active valuation variable for Caris and should be handled as a diligence item rather than a settled fact.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV008
  - CV009
