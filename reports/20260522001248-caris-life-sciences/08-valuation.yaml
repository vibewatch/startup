- id: TV004
  title: Cap structure or dilution overhang table
  columns:
  - Item
  - Publicly disclosed figure
  - Implication
  - Why it matters for valuation
  - Main gap
  rows:
  - - Founder ownership immediately after IPO
    - ~44.6% beneficial ownership
    - Founder remains dominant control holder
    - Governance concentration can cap the multiple investors are willing to pay
    - Current economic versus voting control after subsequent grants is not fully reconciled here
  - - Insider ownership immediately after IPO
    - ~66.2% collectively
    - Public float starts constrained
    - Float and blockholder dynamics can magnify volatility and affect how market cap should be interpreted
    - Updated float after later vesting, selling, and grants needs a refreshed ownership table
  - - Options outstanding
    - 21,885,508 shares
    - Material employee-option overhang
    - Fully diluted per-share value can undershoot simple quote-page math if exercise / vesting accelerates
    - Exercise prices and vesting cadence are not fully decomposed in the public summary used here
  - - RSUs outstanding
    - 4,494,342 shares (221,290 legacy RSUs plus 4,273,052 under the 2025 plan)
    - Additional dilution beyond options
    - New public company grants can keep fully diluted share count moving higher
    - No complete future grant forecast is public
  - - Quote-page shares outstanding
    - 282.68M shares on Investing.com
    - Practical denominator for current market cap
    - Current market value depends on this count today even if SEC basic share framing differs
    - Exact reconciliation to basic post-IPO shares remains incomplete
  - - IPO issuance mechanics
    - 23.53M base shares sold plus 3.53M-share over-allotment option
    - Listing raised cash but also reset public float and dilution optics
    - IPO framing is the starting point for all later share-count debates
    - Prospectus math and quote-page share counts still do not map one-to-one in public sources
  - - Debt package
    - $400M initial term loan; $300M delayed-draw M&A tranche; up to $500M incremental capacity
    - Caris is not overlevered today but has future draw capacity
    - Enterprise value can rise if more debt is drawn without proportional revenue gains
    - Future draw timing and M&A use are not known
  notes: The table is intentionally focused on valuation-relevant capital-structure items rather than a full cap table because the public record does not provide a clean, current, fully diluted waterfall.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
