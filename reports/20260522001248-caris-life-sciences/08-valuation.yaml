- id: scenario-valuation-bridge-and-returns
  title: Scenario valuation bridge and return math
  body: Our base case values Caris on FY2026 revenue of $1.00B-$1.02B and a 4.0x-4.8x EV/revenue range, which converts to about $4.4B-$5.3B of equity value after adding back net cash. The bear case uses 3.0x-3.8x if legal, reimbursement, or execution pressure forces Caris toward a lower-quality diagnostics bucket and yields roughly $3.4B-$4.3B of equity value. The bull case uses 5.5x-6.5x if Caris can resolve the legal narrative, remediate controls, hold reimbursement, and show early Detect traction that makes investors more willing to value it like Tempus or Veracyte, producing about $5.9B-$7.4B of equity value. Using the current quote-page share count as the practical denominator, those ranges map to roughly $12-$15 per share in bear, $15.8-$18.8 in base, and $21.5-$26.3 in bull. That means today's quote is not a distressed anomaly; it already sits inside the base band. The opportunity is therefore real but not deep. Investors are being paid a modest base-case upside for taking on several
    unresolved underwriting questions.
  claimRefs:
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
