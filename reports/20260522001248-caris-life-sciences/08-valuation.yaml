- id: TV002
  title: Private or transaction comparable table
  enumerationScope:
    coverage: partial
    basis: 'Public sources support a targeted set of the most usable transaction anchors: Caris''s own marketed IPO framing, Caris''s final prospectus, Roche / Foundation Medicine, and GRAIL''s current public MCED context. Other private precision-oncology financings are either stale, thinly disclosed, or not directly comparable.'
  columns:
  - Reference point
  - Valuation anchor
  - Why it matters
  - Why it does not transfer cleanly
  - Read-through for Caris
  rows:
  - - Caris marketed IPO range (June 2025)
    - Up to ~$5.35B at $16-$18 per share according to IPO coverage
    - Shows what late-stage IPO marketers thought the market could absorb before final pricing
    - Marketing-range valuation used a different share-count framing than current quote pages
    - Useful ceiling for how aggressively public investors were initially asked to value Caris
  - - Caris final 424B4
    - 23.53M shares sold at $21 plus 3.53M-share overallotment option
    - Hard public anchor for actual offering economics and ownership concentration
    - Prospectus alone still does not settle fully diluted outstanding-share count in 2026 market-data pages
    - Best factual base for IPO mechanics, not for a single undisputed market-cap figure
  - - Roche / Foundation Medicine (2018)
    - ~$2.4B equity value; ~$5.3B total company value
    - Strategic buyer paid a material premium for scaled comprehensive genomic profiling
    - 2018 strategic M&A, not a May 2026 public-market trading multiple
    - Supports the idea that strategic oncology assets can clear above public lab multiples if quality is proven
  - - GRAIL public MCED context (May 2026)
    - $2.62B market cap on just $156.12M of revenue
    - Demonstrates how much option value public markets can attach to credible MCED exposure
    - GRAIL is much earlier-stage and structurally different from Caris's current revenue base
    - Detect can help valuation at the margin, but Caris should not be valued like a pure MCED scarcity asset yet
  notes: This table mixes marketed IPO framing, actual offering terms, historical strategic M&A, and current public MCED context because each addresses a different part of Caris's valuation debate.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV025
  - CV026
  - CV027
  - CV030
- id: TV003
  title: Scenario and valuation bridge table
  columns:
  - Scenario
  - FY2026 revenue anchor
  - EV / revenue range
  - Implied EV
  - Net cash bridge
  - Implied equity value
  - What must be true
  rows:
  - - Bear
    - $1.00B-$1.02B
    - 3.0x-3.8x
    - $3.00B-$3.88B
    - +$0.42B net cash (using Q1 cash and $400M term loan)
    - $3.42B-$4.30B
    - DOJ or reimbursement stress, multiple compression, or Detect disappointment pushes Caris toward lower-quality lab comps
  - - Base
    - $1.00B-$1.02B
    - 4.0x-4.8x
    - $4.00B-$4.90B
    - +$0.42B net cash
    - $4.42B-$5.32B
    - Guidance is met, positive EBITDA / FCF persists, and no major new legal or control shock emerges
  - - Bull
    - $1.03B-$1.08B
    - 5.5x-6.5x
    - $5.67B-$7.02B
    - +$0.25B-$0.42B net cash after allowing for some use of liquidity
    - $5.92B-$7.44B
    - Legal narrative improves, Detect launch gains credibility, and investors re-rate Caris closer to Tempus / Veracyte territory
  notes: Net cash bridge uses March 31, 2026 cash, cash equivalents, and restricted cash less the $400M initial term loan. The bull case allows for some erosion of excess cash as commercialization and growth spending continue.
