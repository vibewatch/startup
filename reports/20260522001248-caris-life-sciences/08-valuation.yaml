- id: comparable-context-and-multiple-bands
  title: Comparable context and multiple bands
  body: 'Caris screens as a mid-pack public oncology diagnostics and data-platform name rather than a premium liquid-biopsy or MCED scarcity asset. On current quote pages, Tempus and Veracyte cluster around 6.6x revenue, Guardant around 14.5x, Natera around 11.6x, GRAIL around 16.8x, and NeoGenomics around 1.6x. Caris at about 5.0x current revenue on equity value, and roughly 4.5x on an enterprise-value basis, is therefore cheaper than the high-growth liquid-biopsy and MCED leaders while still commanding a premium to lower-growth service-lab comps. That relative placement makes sense. Caris deserves a premium to NeoGenomics because its FY2025 and Q1 2026 profitability profile is materially better and its growth is faster. It also deserves a discount to Guardant, Natera, and GRAIL because it still carries DOJ and reimbursement overhang, has a fresh public-company controls issue, and is only beginning to commercialize Detect. Historical transaction context points the same way: Roche''s 2018
    Foundation Medicine deal proves strategic buyers will pay up for scaled, differentiated oncology platforms, but Caris has not yet cleared the legal and execution hurdles needed to sit in the upper tier of today''s public group.'
