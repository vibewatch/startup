company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 8
  letter: V
  title: Valuation
  summary: Caris Life Sciences screens as fairly valued to modestly stretched depending which share count the market is actually using. Direct May 2026 quote pages imply roughly $15.94 per share, $4.51B of equity value, and about $4.09B of enterprise value after netting March 31, 2026 cash against the $400M initial term loan. That is only about 4.0x FY2026 guidance midpoint, below premium liquid-biopsy and MCED peers but above slower-growth service-lab comps. Positive FY2025 and Q1 2026 adjusted EBITDA / free cash flow support a real mid-pack multiple, yet DOJ / 14-day-rule exposure, unresolved controls weakness, reimbursement dependence, Detect commercialization risk, and a visible option / RSU overhang argue against paying Guardant or Natera-like premiums today. Our base case is $4.4B-$5.3B of equity value, with limited margin of safety at the current quote and a better risk/reward only on pullbacks or after dilution / legal uncertainty tightens.
  contentRequirements:
  - Current public valuation snapshot, IPO-to-current framing, and EV bridge from quote pages plus filings.
  - Public comparable and transaction comparable analysis using current market-data sources and filing-backed context.
  - Scenario analysis with explicit bear / base / bull valuation ranges, sensitivity, and return implications.
  - Cap structure, dilution overhang, insider control, and share-count precision discussion.
  - Risk discount reflecting DOJ / 14-day-rule, reimbursement dependence, controls weakness, and Detect execution.
  - Evidence gaps and thesis-break triggers needed before underwriting a premium multiple.
