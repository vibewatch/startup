tables:
- id: TV001
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Public quote pages provide a focused but incomplete public-comp set spanning oncology AI/data, diagnostics, liquid biopsy, and MCED peers; exact EV normalization for every peer was not completed, so the table is intentionally a high-signal sample rather than an exhaustive universe.
  columns:
  - Company / ticker
  - Current market-data snapshot
  - Revenue scale
  - Market-cap / revenue
  - Read-through for Caris
  - Key caveat
  rows:
  - - Caris / CAI
    - $15.94 price; $4.51B market cap; 282.68M quote-page shares
    - $907.29M current revenue on quote page; FY2026 guide $1.00B-$1.02B
    - 5.0x equity / revenue; ~4.5x on an EV basis
    - Mid-pack public valuation for a newly profitable oncology platform
    - Exact share-count reconciliation between quote pages and SEC framing is incomplete
  - - Tempus / TEM
    - $46.82 price; $8.37B market cap
    - $1.27B current revenue; Q1 2026 revenue $348.1M, +36.1% YoY
    - 6.6x
    - Closest AI/data-heavy public comp; suggests a clean Caris can earn more than 5x
    - Tempus has stronger AI/data narrative and broader software / data monetization mix
  - - Guardant / GH
    - $118.01 price; $15.65B market cap
    - $1.08B current revenue; Q1 2026 revenue $301.7M, +48% YoY
    - 14.5x
    - Shows the premium public market gives scaled liquid-biopsy leaders
    - Guardant's product mix and narrative skew more heavily to liquid biopsy and screening
  - - Veracyte / VCYT
    - $45.19 price; $3.61B market cap
    - $541.74M current revenue
    - 6.7x
    - Useful benchmark for a profitable precision-diagnostics platform trading above Caris
    - Quote-page revenue is current, but direct May 2026 growth disclosure was not pulled into this chapter
  - - Natera / NTRA
    - $203.69 price; $29.09B market cap
    - $2.50B current revenue
    - 11.6x
    - Confirms that MRD and monitoring leaders still command premium public multiples
    - Caris lacks Natera's MRD and monitoring entrenchment today
  - - NeoGenomics / NEO
    - $9.11 price; $1.19B market cap
    - $745.97M current revenue; Q1 2026 revenue $187M, +11% YoY
    - 1.6x
    - Practical lower-end diagnostic-lab floor for a slower-growth public comp
    - Neo is a lower-growth, lower-multiple service-lab analogue rather than a perfect AI-oncology peer
  - - GRAIL / GRAL
    - $67.86 price; $2.62B market cap
    - $156.12M current revenue
    - 16.8x
    - Shows how much scarcity premium the market can attach to MCED option value
    - MCED remains earlier-stage and far less profitable than Caris's core profiling franchise
  notes: Current multiple figures are direct market-cap / revenue readings from quote pages as of accessDate, not fully adjusted enterprise-value multiples for peers. Caris EV is separately bridged from its March 31, 2026 balance sheet.
