  - id: roadmap-emerging-products-and-risks
    title: Roadmap, Emerging Products, and Technology Risks
    body: >-
      Caris's near-term product roadmap is anchored on two launches. Caris Detect (whole-genome
      sequencing MCED assay) was planned for commercial launch in H1 2026 at approximately $3,500
      per test. The Everlywell direct-to-consumer partnership, announced in late 2024, provides the
      distribution channel for consumer-facing Caris Detect ordering, positioning Caris to enter the
      DTC oncology screening market alongside Grail (Galleri) and Exact Sciences. Caris Detect's
      differentiation claim rests on whole-genome sequencing breadth vs. methylation-panel approaches
      used by competitors -- a methodological difference that remains an active area of scientific
      debate. MI Clarity, launched in 2026, extends Caris's AI portfolio into computational pathology,
      enabling breast cancer recurrence risk stratification using standard H&E slides without requiring
      molecular profiling -- widening the addressable physician audience beyond current profiling customers.


      Two structural technology risks are material for diligence. First, Illumina single-source
      dependence is a disclosed and persistent risk: Illumina supplies sequencing instruments,
      reagents, and flow cells, and the MI Cancer Seek PMA is locked to NovaSeq 6000. Pricing
      power, supply disruption, or platform transitions at Illumina directly affect Caris's
      cost structure, test quality, and ability to launch new IVD-cleared tests. Second, the
      LDT regulatory environment is in genuine flux. While the September 2025 FDA rule restored
      pre-2024 enforcement posture, future policy reversals would impose significant compliance
      costs on Caris Detect, MI Clarity, GPSai, and FOLFIRSTai -- all LDTs marketed to Medicare
      patients. The research pipeline page references MRD monitoring, expanded MCED, and
      AI-driven clinical trial matching -- but specific timelines and milestones are not publicly
      disclosed, representing a meaningful evidence gap for forward investment analysis.
