company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 5
  letter: E
  title: Product & Technology
  summary: >-
    Caris Life Sciences operates a comprehensive molecular profiling platform anchored by MI Profile
    (simultaneous WES+WTS across 23,000+ genes), complemented by Caris Assure (blood-based liquid biopsy),
    MI Cancer Seek (FDA PMA-cleared CDx, 228 genes, 14+ indications), and four AI engines (CODEai, GPSai,
    FOLFIRSTai, MI Clarity). The technology stack runs on Illumina NovaSeq 6000/X sequencers across 160,500+
    sq ft of lab space in Phoenix and Tempe, AZ, processing more than 1 trillion reads per day, certified
    under CLIA, CAP, ISO 15189, and ISO 13485. Caris Detect (WGS multi-cancer early detection) was planned
    for H1 2026 launch at approximately $3,500, partnered with Everlywell for DTC distribution. Two structural
    risks dominate: exclusive dependence on Illumina as the sole sequencing hardware supplier, and a post-IPO
    LDT regulatory environment in flux following two conflicting FDA rule actions in 2025.
