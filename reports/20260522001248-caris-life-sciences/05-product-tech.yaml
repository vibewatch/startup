  - id: regulatory-status-and-reimbursement
    title: Regulatory Status and Reimbursement Landscape
    body: >-
      Caris operates a regulatory dual-track strategy: MI Cancer Seek is a cleared IVD (PMA P240010,
      approved November 5, 2024), while MI Profile, Caris Assure, GPSai, FOLFIRSTai, and Caris Detect
      (pre-launch) are all laboratory-developed tests regulated under CLIA. This LDT strategy has been
      in regulatory flux. The FDA issued a final rule in May 2024 that would have phased LDTs under
      full medical device regulatory oversight. That rule was vacated by a federal district court on
      March 31, 2025. The FDA subsequently issued a new final rule on September 19, 2025, reverting
      to the pre-2024 enforcement posture -- effectively restoring the status quo where LDTs remain
      regulated under CLIA without IVD pre-market review. This sequence creates residual regulatory
      uncertainty: future FDA administrations could revisit the LDT policy, and Caris's LDT product
      pipeline (Caris Detect, MI Clarity) relies on this policy holding.


      For Medicare reimbursement, comprehensive genomic profiling (CGP) tests are covered under
      MolDx LCD L38690 for advanced solid-tumor oncology. Caris MI Profile has been a covered test
      for Medicare patients with advanced solid tumors where CGP is clinically indicated. Medicare
      accounted for approximately 39.6% of FY2025 molecular profiling revenue. The CMS national
      coverage determination and MolDx LCDs govern coverage policy. One specific regulatory exposure:
      Caris's involvement in two separate DOJ FCA settlements and a new DOJ civil investigative demand
      under the Medicare 14-day rule disclosed in the FY2025 10-K creates audit and compliance tail
      risk in the regulatory relationship (see Chapter 1 for full detail).
