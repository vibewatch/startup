  - id: FE003
    title: Critical dependency map
    type: dag
    caption: >-
      This directed acyclic graph maps the five critical dependencies that underpin Caris's ability
      to operate and scale its platform. The most dangerous single-point risk is Illumina, which is
      both the exclusive sequencing hardware supplier and the regulatory lock-in partner for MI Cancer
      Seek's PMA. FDA oversight affects both LDT policy and the CDx IVD track simultaneously.
    data:
      nodes:
        - id: d1
          label: Caris Life Sciences Platform
          description: Core clinical operations, AI products, and commercial revenue
        - id: d2
          label: Illumina (Sole Sequencing Supplier)
          description: >-
            NovaSeq 6000 (PMA-locked for MI Cancer Seek) and NovaSeq X Plus (LDT); reagents and
            flow cells; disclosed sole supplier in 10-K; material single-source concentration risk
        - id: d3
          label: FDA Regulatory Framework
          description: >-
            PMA P240010 governs MI Cancer Seek; LDT enforcement posture governs all other products;
            September 2025 rule restored pre-2024 status quo; future policy reversals are residual risk
        - id: d4
          label: CMS / MolDx Reimbursement
          description: >-
            LCD L38690 and NCD 90.2 govern Medicare coverage for CGP; approximately 39.6% of FY2025
            molecular profiling revenue from Medicare; payer coverage decisions set revenue ceiling
        - id: d5
          label: CODEai Database (Internal Data Asset)
          description: >-
            484,000+ matched profiles; AI training substrate; proprietary moat; powers GPSai,
            FOLFIRSTai, and biopharma data licensing; not accessible to third parties
      edges:
        - from: d2
          to: d1
          label: Hardware and reagents (single-source)
        - from: d3
          to: d1
          label: LDT policy governs all non-CDx products
        - from: d3
          to: d2
          label: PMA locks NovaSeq 6000 as approved sequencer for MI Cancer Seek
        - from: d4
          to: d1
          label: Coverage decisions set revenue ceiling for CGP tests
        - from: d5
          to: d1
          label: AI model performance and biopharma licensing depend on database scale
        - from: d1
          to: d5
          label: Each clinical case profiled adds to the CODEai database (data flywheel)
    claimRefs:
      - CE013
      - CE020
      - CE022
      - CE023
      - CE025
      - CE041

  - id: FE004
    title: Product maturity / capability map
    type: matrix
    caption: >-
      This maturity matrix scores eight Caris commercial and near-commercial products across four
      dimensions: regulatory status, clinical evidence quality, reimbursement coverage, and commercial
      scale. Scores are qualitative and sourced from public disclosures and this chapter's evidence set.
    data:
      columns:
        - Regulatory Status
        - Clinical Evidence Quality
        - Reimbursement Coverage
        - Commercial Scale
      rows:
        - label: MI Profile (WES+WTS)
          values:
            - LDT / CLIA (established)
            - Strong (multi-year, multi-study)
            - Medicare + major commercial payers
            - ~199k cases FY2025; primary revenue driver
        - label: Caris Assure (liquid biopsy)
          values:
            - LDT / CLIA (no NY)
            - Moderate (FY2025 volume data; no independent RCT)
            - Limited (emerging LCD coverage)
            - ~29k cases FY2025; accelerating
        - label: MI Cancer Seek (CDx IVD)
          values:
            - FDA PMA cleared (P240010; Nov 2024)
            - Regulatory-validated (14 CDx indications)
            - CDx indications only; coverage pathway via approved drug labels
            - Early commercial; volume not separately disclosed
        - label: CODEai platform
          values:
            - Internal LDT infrastructure
            - Strong (484k+ matched records; growing)
            - N/A (not billed directly to payers)
            - 484k+ matched profiles; core data asset
        - label: GPSai (tumor origin AI)
          values:
            - LDT (embedded in MI Profile)
            - Moderate (201k training cases; anchor peer review 2021)
            - Included in MI Profile billing; no standalone reimbursement
            - Embedded; not counted as standalone product
        - label: FOLFIRSTai (chemo selection AI)
          values:
            - LDT (embedded in MI Profile)
            - Strong (peer-reviewed CCR publication; 17.5-month OS benefit)
            - Included in MI Profile at no extra cost
            - Embedded mCRC use; not standalone
        - label: Caris Detect (MCED)
          values:
            - LDT (pre-commercial at report date)
            - Moderate (Achieve 1 final data only; Achieve 2 pending)
            - Unestablished (DTC ~$3,500; no payer coverage yet)
            - Pre-commercial; Everlywell DTC channel signed
        - label: MI Clarity (comp. pathology AI)
          values:
            - LDT (2026 launch; no IVD clearance)
            - Weak (no peer-reviewed publication at launch)
            - Unestablished (new product; no coverage determination)
            - Early launch 2026; volume not disclosed
    claimRefs:
