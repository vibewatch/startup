      The standard physician-initiated clinical workflow from ordering through report delivery, showing
      seven nodes where Caris interacts with or generates value for the clinical customer. EHR integration
      compresses step durations between nodes 3 and 7; the 2.2-day average TAT improvement is attributable
      to electronic ordering and direct result embedding into physician workflows.
    data:
      nodes:
        - id: n1
          label: Physician Orders Test
          description: >-
            Oncologist initiates MI Profile or CDx order electronically (over 70% electronic Q1 2026)
            via EHR integration or Caris portal; Caris Assure not available in New York
        - id: n2
          label: Sample Collection and Logistics
          description: >-
            Tissue FFPE biopsy or peripheral blood draw; Caris provides collection kits and courier
            logistics; chain-of-custody maintained to Phoenix AZ laboratory
        - id: n3
          label: Laboratory Receipt and QC
          description: >-
            Phoenix lab receives sample; QC checks on DNA/RNA yield and quality; LDT or IVD workflow
            routing based on test ordered; CLIA/CAP/ISO 15189 oversight
        - id: n4
          label: NGS Sequencing and Bioinformatics
          description: >-
            WES + WTS on Illumina NovaSeq X Plus (LDT) or NovaSeq 6000 (MI Cancer Seek IVD);
            variant calling, fusion detection, expression quantification; proprietary pipeline
        - id: n5
          label: CODEai AI Interpretation
          description: >-
            CODEai matches patient profile to 484,000+ cases; GPSai identifies tumor origin;
            FOLFIRSTai generates mCRC treatment prediction if applicable; insights embedded in report
        - id: n6
          label: Clinical Report Generation
          description: >-
            MI Profile report with therapy biomarkers, GPSai tumor-origin call, FOLFIRSTai guidance
            for mCRC, and Molecular Tumor Board Report; MI Cancer Seek CDx report if IVD pathway
        - id: n7
          label: EHR Delivery and Follow-up
          description: >-
            Report delivered to ordering physician EHR (300+ orgs; 3,350+ locations); average 2.2-day
            TAT reduction vs. non-integrated workflows; Molecular Tumor Board consultation available
