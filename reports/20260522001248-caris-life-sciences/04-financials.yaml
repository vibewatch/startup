- id: gtm-proxies-and-cost-structure
  title: GTM proxies, sales efficiency, and cost structure
  body: 'Caris gives unusually strong public traction for a historically private precision-oncology business, but it still withholds the core sales-efficiency math. FY2025 clinical therapy selection cases reached 199,300, Q4 2025 cases were 52,700, and Q1 2026 cases were 52,800, including 9,200 Caris Assure cases. Third-party Q1 coverage adds the most useful GTM proxies: Investing reported clinical ASP of $3,996, territory expansion from 82 to 146, a commercial team of more than 270, electronic order submission above 70% of orders, and EMR integration used by more than 3,000 physicians. Those are constructive indicators of sales-surface expansion and workflow embedding, but they are not substitutes for CAC, payback, or physician-cohort retention data. On the cost side, the public trend is favorable: FY2025 gross profit was $539.2M at 66% gross margin, Q4 2025 gross margin reached 75%, and Q1 2026 gross margin settled at 65%. Q1 2026 R&D spend of $31.3M and SG&A of $104.7M show Caris is still
    investing into the commercial pipeline even after turning free-cash-flow positive. The remaining underwrite problem is service-delivery opacity. The 10-K identifies Illumina as the sole supplier of critical sequencing inputs, yet Caris does not publish per-test COGS, capex by platform, or working-capital detail sufficient to separate structural operating leverage from reimbursement-driven margin uplift.'
