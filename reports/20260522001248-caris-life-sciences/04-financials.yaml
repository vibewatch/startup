- id: public-gaps-adverse-lens-and-verdict
  title: Public gaps, adverse lens, and financial verdict
  body: 'Public evidence is now strong enough to say Caris has real scale, positive cash generation, and improving reimbursement economics, but not strong enough to fully underwrite revenue quality and downside exposure. The biggest unresolved metrics are realized ASP by payer type, CAC and payback, physician reorder and cohort retention, and per-test COGS across tissue versus blood workflows. Those omissions matter because a large part of the FY2025 margin expansion was reimbursement-led, not purely volume-led. The adverse lens is also non-trivial. Caris disclosed a March 2025 DOJ civil investigative demand related to the Medicare 14-day rule, and Oversight/DOJ records show the company paid $2.886M in 2022 to settle prior False Claims Act allegations tied to delayed submission practices. The FY2025 10-K also says a material weakness in internal control over financial reporting remained unremediated at year-end because of insufficient qualified accounting resources. Taken together, the financial
    verdict is favorable but qualified: the business now looks like a scaled precision-oncology platform with high-quality core demand, improving gross profit conversion, and ample liquidity, yet the earnings bridge is still partly opaque and regulatory reimbursement risk remains material. A serious investor should treat the current margin and cash profile as credible but still require detailed payer-level and per-test economics before underwriting durability at face value.'
