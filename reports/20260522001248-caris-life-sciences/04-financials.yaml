- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Impact
  - Exact diligence path
  rows:
  - - Realized ASP by payer type and by assay
    - Without it, the 2025-2026 revenue surge cannot be separated into rate, mix, and volume drivers
    - Material — margin durability and reimbursement sensitivity remain partly opaque
    - Request quarterly ASP waterfall by Medicare, commercial, Medicaid, institutional, tissue, and blood tests
  - - CAC, payback, and rep productivity
    - Sales-territory expansion is visible, but growth efficiency is not measurable from public sources
    - Material — cannot tell whether growth is becoming more efficient or simply broader
    - Request rep cohorts, selling cost by channel, payback months, and ordering-physician ramp curves
  - - Per-test COGS, capex, and lab utilization
    - The public record shows margin expansion but not whether it is structural or reimbursement-led
    - Material — limits confidence in steady-state gross margin and capital intensity
    - Request product-level gross margin, reagent cost, labor cost, compute cost, and utilization by platform
  - - Physician reorder / retention and pharma backlog
    - Needed to judge recurring quality of both clinical and biopharma revenue
    - Material — current growth could still be more episodic than it appears
    - Request physician cohort retention, reorder rates, and booked pharma R&D backlog versus guidance
  - - Quantified DOJ/FCA exposure and any accrual
    - Legal overhang is disclosed, but the financial range of outcomes is not
    - Material — downside case cannot be fully sized from public evidence
    - Request counsel memo, exposure analysis, and any reserve or non-reserve rationale tied to the CID
  notes: Every row is a live underwriting blocker or material qualifier rather than a generic wish list. These gaps are the main reasons the chapter stops short of calling the current earnings profile fully underwritten.
  claimRefs:
  - CI037
  - CI038
  - CI039
