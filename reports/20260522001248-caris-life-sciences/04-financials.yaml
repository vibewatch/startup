sections:
- id: revenue-model-pricing-and-recognition
  title: Revenue model, pricing, and recognition
  body: 'Caris monetizes two streams against the same oncology data and laboratory stack. Molecular profiling services are the core engine: FY2025 molecular profiling revenue was $766.7M, or roughly 94% of total revenue, and Q1 2026 molecular profiling revenue was $210.8M. Pharma research and development services were much smaller at $45.3M in FY2025 and approximately $5.4M in Q1 2026, but management still guided the segment to $75M-$85M for FY2026. The public record therefore supports a company whose current revenue quality is still primarily clinical-testing driven rather than platform-licensing driven. The 10-K also makes the recognition mechanics clear. Molecular profiling revenue is recorded when profiling results are provided to ordering physicians, while the transaction price is constrained by variable consideration, implicit price concessions, and historical reimbursement collections across payer portfolios. That means reported growth is real but not identical to list pricing. Medicare-covered
    patients accounted for about 39.6% of FY2025 molecular profiling revenue, Caris says it is in-network with most major commercial payers and over 100 health plans covering 200 million lives, and CMS fee-schedule plus LCD/NCD rules still frame the reimbursement ceiling. The public gap is that realized ASP by payer type remains undisclosed, so the strongest revenue trend is observable but not fully decomposable.'
