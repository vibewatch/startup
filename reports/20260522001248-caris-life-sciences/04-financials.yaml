- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Amount / status
  - Evidence basis
  - Underwrite read
  - Diligence ask
  rows:
  - - FY2025 end liquidity
    - $796.3M cash and cash equivalents + $2.3M short-term marketable securities
    - FY2025 10-K
    - Strong year-end liquidity entering 2026
    - Provide monthly cash bridge from IPO close through Q1 2026
  - - Q1 2026 balance-sheet liquidity
    - $821.1M cash and cash equivalents; $2.3M short-term marketable securities; $823.4M cash, cash equivalents, and restricted cash
    - Q1 2026 earnings exhibit
    - Positive FCF plus large cash base reduces near-term equity dependence
    - Clarify unrestricted versus restricted cash usable for operations or debt service
  - - Initial term loan
    - $400M funded April 1, 2026; matures April 2031
    - Credit agreement and debt coverage
    - Adds long-duration secured capital while replacing the prior 2023 facility
    - Show amortization, mandatory prepayment triggers, and interest-rate hedging policy
  - - Committed delayed draw
    - $300M through August 2027, acquisitions only
    - Credit agreement and debt coverage
    - Useful M&A optionality rather than operating liquidity
    - Define acquisition pipeline and likely draw triggers
  - - Incremental facility
    - Up to $500M uncommitted
    - Credit agreement and debt coverage
    - Potential flexibility, but not bankable cash until lenders approve
    - Clarify lender conditions and maximum leverage tolerances
  - - Pricing and covenant
    - Term SOFR + 5.00% or Base Rate + 4.00%; minimum qualified cash $50M
    - Credit agreement
    - Current covenant headroom is very large relative to reported liquidity
    - Provide covenant calculations and downside liquidity scenarios
  - - Historical capital intensity marker
    - $2.5B accumulated deficit at Dec. 31, 2025
    - FY2025 10-K
    - Shows the business consumed substantial capital before the 2025 turn
    - Bridge accumulated deficit to current returns on incremental growth investment
  notes: The table focuses on forward capital adequacy rather than repeating the Company Overview funding chronology. Q1 2026 liquidity is reported in multiple official formats; unrestricted versus restricted availability should be confirmed in diligence.
