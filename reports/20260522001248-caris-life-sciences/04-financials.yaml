  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ASP-transparency
    missingEvidence: Official realized ASP by payer type, by assay, and by tissue-versus-blood mix, plus the bridge between reported collections and any true-up or excess-collection effects.
    whyItMatters: Without payer-level ASP evidence, current revenue acceleration cannot be separated cleanly into durable price, reimbursement, mix, and volume effects.
    diligencePath: Request quarterly ASP and reimbursement waterfall detail by payer and assay from FY2024 through Q1 2026, with supporting denial and appeal statistics.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Customer acquisition cost, payback period, rep ramp productivity, and ordering-physician retention cohorts.
    whyItMatters: Territory growth and commercial headcount are only proxies; they do not prove that incremental growth is efficient or durable.
    diligencePath: Request CAC, payback, physician cohort retention, and rep productivity dashboards by vintage and by channel.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: service-delivery-costs
    missingEvidence: Per-test COGS, capex by sequencing platform, lab utilization, and working-capital detail for tissue versus blood workflows.
    whyItMatters: Gross-margin improvement is visible, but public evidence does not show whether the gain is structural, reimbursement-led, or partially one-time.
    diligencePath: Request product-level gross margin and capex schedules, reagent and labor cost stacks, and quarterly working-capital bridges.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
