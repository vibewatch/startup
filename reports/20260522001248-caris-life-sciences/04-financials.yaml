- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - FY2025 molecular revenue per clinical case (derived)
    - ~$3,848 per case ($766.7M / 199,300)
    - Medium
    - A public proxy for blended realized clinical monetization before payer-type detail
    - Reconcile to payer-specific ASP and tissue-versus-blood mix
  - - Q1 2026 clinical ASP proxy
    - Investing reported $3,996 clinical ASP; official implied molecular revenue per case is ~$3,992
    - Medium
    - Best public read on current monetization and reimbursement improvement
    - Provide official ASP by payer and by assay rather than third-party synthesis
  - - FY2025 gross margin
    - 66%
    - High
    - Confirms material operating leverage and reimbursement improvement
    - Separate structural cost leverage from prior-period collection benefits
  - - Q1 2026 gross margin
    - 65%
    - High
    - Suggests the business largely held the FY2025 margin gains into 2026
    - Show normalized quarterly bridge excluding any one-time true-up effects
  - - Q1 2026 R&D / SG&A spend
    - $31.3M / $104.7M
    - Medium
    - Shows Caris is still funding pipeline and commercial expansion even after reaching positive cash flow
    - Provide sales-and-marketing split, rep productivity, and fixed-versus-variable opex
  - - Sales footprint proxy
    - 82 to 146 territories; 270+ commercial team; 3,000+ physicians on EMR integration
    - Medium
    - Useful leading indicators of distribution leverage and workflow stickiness
    - Provide rep ramp productivity, conversion, and reorder behavior by cohort
  - - CAC / payback
    - Null — not publicly disclosed
    - Low
    - Needed to translate territory growth into efficient growth rather than growth at any cost
    - Disclose CAC, payback months, and contribution margin by ordering physician cohort
  - - Per-test COGS / capex / working capital
    - Null — not publicly disclosed
    - Low
    - Needed to underwrite service-delivery economics and capex intensity
    - Provide tissue and blood cost stacks, lab utilization, and working-capital drivers
  notes: Derived metrics are explicitly labeled. Null means the metric could not be sourced from retained public evidence and requires management diligence.
