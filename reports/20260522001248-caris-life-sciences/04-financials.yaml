tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current disclosed scale
  - FY2026 read-through
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Molecular profiling services
    - Fee-per-test oncology profiling billed to payers and institutions; recognized when results are delivered to ordering physicians
    - $766.7M FY2025; $210.8M Q1 2026; 199,300 FY2025 cases
    - Core engine; Investing reported implied FY2026 molecular revenue guidance of $925M-$935M
    - High, but still reimbursement-sensitive and payer-mix opaque
    - Break out realized ASP and denial/appeal rates by Medicare, commercial, Medicaid, and institutional channels
  - - Pharma research and development services
    - Biopharma services, data, and development contracts recognized over the service period with milestone-related variable consideration
    - $45.3M FY2025; about $5.4M Q1 2026
    - $75M-$85M FY2026 guidance implies a sharp rebound from FY2025
    - Medium; contractual but lumpy and milestone-sensitive
    - Provide signed backlog, renewal rates, and booked-versus-pipeline split for FY2026 guidance
  - - Caris Assure within clinical mix
    - Liquid-biopsy volume contributes inside molecular profiling rather than a separately reported segment
    - 29,000 FY2025 cases; 9,200 Q1 2026 cases
    - Liquid biopsy growth is visible, but revenue and gross margin are not separately disclosed
    - Medium; growth-positive but unit economics undisclosed
    - Disclose blood-test ASP, reimbursement by payer, and gross margin versus tissue tests
  - - ChromoSeq / myeloid profiling
    - Specialized sequencing workflow supported by MolDx coverage for myeloid malignancy applications
    - Coverage expansion disclosed; no standalone revenue disclosed
    - Could widen reimbursable test menu rather than near-term materially changing mix
    - Medium; reimbursement tailwind with unknown revenue contribution
    - Quantify covered-case volume and incremental revenue contribution since launch
  - - Total company
    - Combined molecular profiling plus pharma R&D model
    - $812.0M FY2025; $292.9M Q4 2025; $216.2M Q1 2026
    - $1.0B-$1.02B FY2026 guidance with about 20% case-volume growth
    - High on observed scale; medium on normalized earnings quality
    - Reconcile guidance to payer-price assumptions, excess collections, and segment-level bridge
  notes: Clinical revenue is directly disclosed; Q1 pharma R&D revenue is derived from total less molecular profiling and should be treated as approximate. The molecular FY2026 range is third-party-reported via Investing, not directly stated in the retained SEC/official Q1 release.
