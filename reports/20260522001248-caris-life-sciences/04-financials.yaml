company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 4
  letter: I
  title: Financials
  summary: 'Caris Life Sciences reached a public-company financial inflection in FY2025 with $812.0M of revenue, 66% gross margin, $137.7M of adjusted EBITDA, and $66.9M of free cash flow, and Q1 2026 largely sustained that profile at $216.2M of revenue, 65% gross margin, and $22.5M of free cash flow. The underwriting debate has shifted from survival to quality of earnings: molecular profiling reimbursement and payer reach are clearly improving, but realized ASP by payer, per-test service cost, CAC/payback, and DOJ-related billing exposure remain the critical unresolved variables.'
  contentRequirements:
  - Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
  - GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
  - Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
  - Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
  - Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations.
  - Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
