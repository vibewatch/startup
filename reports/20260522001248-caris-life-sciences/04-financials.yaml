- id: TI002
  title: Pricing / monetization table
  columns:
  - Channel / payer
  - Pricing or reimbursement mechanism
  - Public realized pricing
  - What the retained evidence confirms
  - Main unknown
  rows:
  - - Medicare molecular profiling
    - Coverage governed by NCD/LCD rules and reimbursement via Medicare laboratory fee schedules
    - No payer-specific realized ASP disclosed publicly
    - Medicare-covered patients represented 39.6% of FY2025 molecular profiling revenue; non-covered services may require ABNs
    - Code-level rates, ASP by assay, and volume-weighted Medicare reimbursement by product
  - - Commercial payers
    - Negotiated in-network contracts and claims adjudication
    - No realized commercial ASP disclosed publicly
    - Caris says it is in-network with most major commercial payers, over 100 health plans, and about 200M covered lives
    - Net realized ASP, denial rates, prior-auth burden, and contract concentration
  - - Patients / hospitals
    - Caris bills insurers, pursues appeals, and patients may owe deductible, co-pay, or coinsurance amounts
    - No direct patient-pay mix disclosed
    - Financial assistance, secondary billing, and claim-appeal workflows are publicly described
    - Net self-pay collection rate and institutional pricing concessions
  - - Pharma R&D customers
    - Contracted service and milestone economics with variable consideration constraints
    - No contract-level price or backlog disclosure
    - Revenue is recognized over the period services are provided and milestone consideration is constrained
    - Booked backlog, renewal rates, termination rights, and mix of recurring versus one-off work
  - - Coverage-expansion products
    - Additional reimbursable tests such as ChromoSeq can add paid volume within the same lab platform
    - No standalone pricing disclosed
    - 360Dx reported MolDx coverage for ChromoSeq, supporting broader reimbursable menu depth
    - Standalone revenue, reimbursement rate, and margin contribution
  notes: This table separates reimbursement mechanism from realized economics. Public pricing evidence is strongest on rules and coverage, not on payer-specific realized ASP.
