  - id: moat-and-competitive-risk
    title: Moat Durability and Competitive Risk Assessment
    body: >-
      Caris's primary moats against competitive displacement are: (1) data scale and matched
      clinico-genomic database (1.07M+ total profiles, 484,000+ matched datasets as of March 2026),
      which creates a durable pharma data licensing advantage that smaller competitors cannot quickly
      replicate; (2) WES+WTS combined breadth, currently unique at commercial scale—Tempus's xT CDx
      + xR combination is the closest substitute but requires separate test orders; (3) reimbursement
      infrastructure built on a decade of Medicare, Medicaid, and commercial payer negotiations; and
      (4) the CODEai AI/ML platform, which converts testing volume into pharma R&D revenue through
      real-world data, biomarker discovery, and clinical trial matching.

      The primary vectors of competitive displacement threatening Caris's moat are: (a) Foundation
      Medicine's FDA CDX companion diagnostic lock-in—when a drug's prescribing information
      specifically requires FoundationOne CDx for patient selection, oncologists cannot substitute
      Caris MI Profile, regardless of technical breadth; (b) Tempus AI's EHR-integrated AI platform
      (Tempus One) which embeds ordering workflows and AI-generated clinical insights directly into
      physician practice, increasing stickiness and switching cost over time; (c) Guardant Health's
      established liquid biopsy relationships with 12,000+ physicians, which may capture new liquid
      CGP demand before Caris Assure achieves comparable scale; and (d) GRAIL's first-mover
      advantage in the MCED screening segment, where Caris Detect has not yet launched commercially.

      Switching costs for oncologists who have deeply embedded Caris MI Profile in their workflow
      include: reporting format change, revalidation of bioinformatics pipelines, re-education of
      clinical staff, and renegotiation of billing and logistics contracts. However, switching cost
      is lower for oncologists who multi-home between vendors depending on tumor type or test
      indication. Multi-homing risk is highest in liquid biopsy, where Guardant360 and Caris Assure
      could be ordered from the same practice for different indications. The primary adverse signal
      for Caris's competitive position is Foundation Medicine's entrenched CDX footprint: more than
      50% of approved US NGS CDX indications naming FoundationOne CDx as the required test creates
      a structural limit on Caris MI Profile's addressable market for companion diagnostic-guided
      therapy selection, unless Caris separately pursues CDX approval for each corresponding drug.
    claimRefs:
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038

