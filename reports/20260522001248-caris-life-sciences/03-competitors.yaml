  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - WES+WTS combined breadth (23K+ genes simultaneously) is unique at commercial scale
        - Tempus xT CDx + xR offers comparable coverage via two-step ordering; FoundationOne RNA now adds RNA fusion detection
        - Medium — functional equivalence may converge within 2–3 product cycles
        - Track competitor RNA product adoption rates; validate whether combined-order workflow parity emerges in practice
      - - Data scale (1.07M+ profiles, 484K+ matched) powers CODEai pharma monetization
        - Foundation Medicine (Roche) has access to global Roche database; Tempus claims 8M+ de-identified records
        - High — if Tempus's or FMI's dataset coverage exceeds Caris's matched-pair breadth, pharma preference shifts
        - Audit CODEai matched dataset quality vs. competitors; request pharma partner retention rates and deal flow
      - - FDA CDX approvals for treatment-guided selection
        - Foundation Medicine holds >50% of US NGS CDX approvals; new drug labels naming FoundationOne CDx structurally exclude Caris
        - High — each new CDX approval by FMI reduces Caris MI Profile's addressable market for those drugs
        - Count pending Caris CDX submissions; assess regulatory timeline risk; quantify revenue locked behind FMI-exclusive CDX
      - - Reimbursement infrastructure (Medicare, Medicaid, commercial payers)
        - Competitors with older, narrower panels (FMI, Guardant) may receive more favorable reimbursement rates due to longer CMS coverage history
        - Medium — Caris FY2025 revenue at $812M confirms reimbursement is working; DOJ FCA investigation under 14-day Medicare rule is an outstanding risk
        - Monitor Medicare coverage policy changes; track 14-day rule DOJ FCA investigation resolution
      - - Caris Detect MCED pipeline as next revenue catalyst
        - GRAIL Galleri is commercially launched, published in Lancet/Annals of Oncology, and has 0.4% FP rate; Caris Detect is unvalidated in comparative studies
        - Critical — first-mover advantage in MCED screening is structural; Caris Detect enters as a distant second
