callouts:
  - calloutType: risk
    title: Foundation Medicine CDX Lock-In Is a Structural Market Ceiling for Caris
    body: >-
      Foundation Medicine holds more than 50% of all approved US NGS companion diagnostic (CDX)
      indications. When a drug's FDA-approved prescribing information names FoundationOne CDx as
      the required companion diagnostic test for patient selection, oncologists cannot substitute
      Caris MI Profile—regardless of Caris's broader genomic coverage or clinical utility claims.
      This structural exclusion reduces Caris's addressable market for each CDX-gated drug and
      compounds over time as more drugs receive FDA approval with FMI-specific CDX labels.
    claimRefs:
      - CP008
      - CP035
  - calloutType: risk
    title: Caris Detect Enters MCED Market Without Comparative Clinical Evidence
    body: >-
      GRAIL's Galleri test is commercially launched, backed by Lancet and Annals of Oncology
      publications, and has a 0.4% false positive rate with 93.4% cancer signal of origin accuracy.
      Caris Detect is planned for a first-half 2026 commercial launch using a whole-genome
      sequencing approach—but no comparative head-to-head clinical data against Galleri has been
      published. GRAIL's 10-K explicitly identifies Caris as a future MCED entrant, not a current
      commercial participant. Without published sensitivity and specificity data comparable to
      Galleri's multi-year clinical evidence package, Caris Detect will face significant payor
      coverage and physician adoption barriers.
    claimRefs:
      - CP031
      - CP032
      - CP033
  - calloutType: strength
    title: Caris's Matched Clinico-Genomic Database Is a Durable Pharma Monetization Asset
    body: >-
      With 484,000+ matched clinico-genomic datasets powering the CODEai platform, Caris holds a
      database that took a decade to assemble at commercial scale and cannot be rapidly replicated
      by a new entrant. Pharma R&D services revenue of $45.3M in FY2025 already demonstrates
      monetization, and the data flywheel—more tests generate more matched data, which attracts more
      pharma partnerships, which cross-subsidize clinical testing volume—is the structural basis
      for long-term competitive advantage.
    claimRefs:
      - CP003
      - CP034

