  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent, peer-reviewed or third-party-validated estimate of the U.S. therapy-selection
        CGP market that can be compared against the Nephron Research $8 billion figure on consistent
        methodology and scope assumptions.
      whyItMatters: >-
        The Nephron Research study is company-commissioned and not independently validated; the gap between
        Caris's $8 billion therapy-selection TAM and the global CGP market estimate of $10.1 billion (2030)
        from GlobeNewswire raises questions about geographic, scope, and methodological comparability. If
        the true U.S. therapy-selection TAM is materially smaller, Caris's penetration story is weaker.
      diligencePath: >-
        Request or commission an independent market sizing analysis from IQVIA, Clarivate, or a specialist
        oncology market research firm (e.g., DeciBio Consulting) that uses consistent methodology across
        U.S. and global scopes and separates the current from the long-term pre-commercial segments.
      relatedQuestionRefs:
        - QM018

    - type: private-evidence-only
      severity: minor
      topic: reimbursement
      missingEvidence: >-
        A breakdown of Caris's FY2025 revenue by payer category (Medicare, Medicaid, commercial, self-pay)
        and the associated average selling price and coverage denial rate per payer channel.
      whyItMatters: >-
        Caris does not publicly disclose granular payer-mix revenue data. Without this, it is not possible
        to assess whether growth is driven by improved commercial payer coverage (better mix) or primarily
        by volume expansion within existing Medicare coverage (rate-sensitive). This affects the sustainability
        and margin quality assessment in Chapter 3 (Financial Analysis).
      diligencePath: >-
        Request payer mix disclosure from Caris investor relations, or review any supplemental earnings
        materials, S-1 risk factor disclosures, or analyst Q&A transcripts that may include directional
        commentary on Medicare vs. commercial revenue split.
      relatedQuestionRefs:
        - QM012
        - QM019

    - type: missing-source
      severity: material
      topic: early-detection
      missingEvidence: >-
        A public CMS policy statement or proposed NCD/LCD regarding reimbursement coverage for multi-cancer
        early detection (MCED) assays, as well as the timeline for a coverage determination.
      whyItMatters: >-
        The $100 billion early-detection TAM that drives Caris's $150 billion total TAM narrative is entirely
        contingent on payers establishing reimbursement coverage for MCED assays. Without a CMS coverage
        pathway, this segment cannot be commercialized at scale. GRAIL's Galleri assay provides a market
        parallel: despite years of clinical data, MCED reimbursement remains under CMS review. If coverage
        is delayed beyond 2028, the $100 billion segment will not be monetizable in the diligence horizon.
      relatedQuestionRefs:
        - QM024
        - QM026
