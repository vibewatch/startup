  - id: buyer-segmentation
    title: Buyer Segmentation and Adoption Path
    body: >
      Caris's revenue flows through two distinct buyer channels with different economic structures. The primary
      channel is clinical oncologists ordering molecular profiling for individual cancer patients. Caris bills
      Medicare, Medicaid, or commercial payers directly; the oncologist is the order initiator but not the
      payer. As of December 31, 2025, Caris had 5,550+ regularly ordering oncologists (defined as four or more
      orders in the preceding 12 months) and 90+ active commercial payer reimbursement contracts. FY2025 clinical
      profiling services contributed $766.7 million (94.4% of total revenue), heavily weighted toward tissue-based
      MI Profile (~170,300 cases) with growing Caris Assure liquid biopsy volume (~29,000 cases). The secondary
      channel is biopharma and pharma R&D partners — 100+ companies using Caris's biobank, CODEai AI platform,
      and companion diagnostic services — generating $45.3 million in FY2025. Biopharma partners are direct-pay
      (no insurer intermediary) but have longer sales cycles and contract-by-contract economics.


      Adoption path dynamics differ by segment. Community oncologists typically require: (1) NCCN guideline
      recommendation for the cancer type, (2) Medicare/payer coverage confirmation, (3) internal approval from
      the ordering institution, and (4) a Caris sales representative relationship. Academic cancer centers often
      participate through the Caris Precision Oncology Alliance (Caris POA) and have institutional procurement
      channels. Caris Assure liquid biopsy adoption is additionally constrained by the New York State CLEP
      restriction, which excludes the largest U.S. metropolitan market pending laboratory approval. Caris submitted
      its NY CLEP application and is awaiting review. For biopharma partners, adoption is triggered by a
      demonstrated need for comprehensive molecular biomarker data or a companion diagnostic regulatory submission.
      Caris Detect, the MCED assay using WGS technology with proprietary chemistry and AI/ML, is expected to launch
      in 2026 and will require an entirely new adoption pathway through primary care physicians rather than
      oncologists — a structural discontinuity that adds go-to-market complexity.
