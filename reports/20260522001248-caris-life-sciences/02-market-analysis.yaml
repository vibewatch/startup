company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Caris Life Sciences competes across four oncology-care continuum segments whose combined U.S. addressable
    market is estimated at approximately $150 billion by the company's commissioned Nephron Research study, though
    independent analyst estimates for the served NGS/CGP market range from $13 billion today to $27–98 billion by
    2031–2035 — a 3–4× spread that reflects both differing scope definitions and bullish versus conservative
    long-term assumptions. The current commercial core — therapy selection molecular profiling — is approximately an
    $8 billion U.S. market, of which Caris captured roughly $767 million in FY2025 (a ~9.6% implied share), growing
    at 97% YoY and already guiding to $1.0–$1.02 billion in FY2026. Reimbursement infrastructure (CMS NCD 90.2,
    MolDX approvals, 90+ commercial contracts) and clinical guideline adoption (NCCN) are the primary near-term
    demand drivers, while the DOJ False Claims Act investigation, New York State CLEP restriction on Caris Assure,
    and unestablished MCED reimbursement pathways are the key adoption constraints.

sections:
  - id: market-boundary
    title: Market Boundary and Definitions
    body: >
      Caris Life Sciences operates at the intersection of oncology diagnostics, precision medicine, and biopharma
      data services. The relevant market is best defined by care-continuum layer rather than a single diagnostic
      category. The four layers Caris explicitly targets are: (1) cancer therapy selection — the current commercial
      core, where physicians use molecular profiles to match patients to targeted therapies and immunotherapies;
      (2) multi-cancer early detection (MCED), a large but pre-commercial segment in which blood-based whole-genome
      sequencing screens asymptomatic individuals for cancer signals before symptoms arise; (3) minimal residual
      disease (MRD) tracking and treatment monitoring, where molecular tests assess post-treatment residual disease
      burden or monitor for recurrence; and (4) biopharma and data services, where Caris licenses its
      clinico-genomic datasets and runs companion diagnostic development and clinical trial programs for
      pharmaceutical partners.


      The U.S. incidence base is large: the SEER Program estimates 2,114,850 new cancer cases in 2026, with lung
      cancer (229,410 new cases) and colorectal cancer (158,850 new cases) together representing roughly 18% of
      total incidence. The five-year relative survival rate across all cancers is now 70.5%, partly reflecting the
      adoption of molecularly guided therapies — creating a growing pool of long-term survivors who may eventually
      need MRD monitoring. Adjacent spend categories that Caris either does not yet address commercially (early
      detection MCED) or competes in partially (traditional single-gene or hotspot panels from competitors) are
      explicitly excluded from the current serviceable addressable market but represent pipeline optionality.
      Substitutes for Caris's tissue-based MI Profile include targeted NGS gene panels from Foundation Medicine
      (Roche), Tempus, and Guardant Health; these panels are cheaper but capture less molecular information,
      representing a performance-versus-cost trade-off rather than a wholesale technology substitute.
