  - id: SU-proof-workflow
    title: Named proof, provider workflow embed, and alliance evidence
    body: |
      The strongest public customer proof is not a long roster of named hospital contracts with quantified outcomes;
      it is a mix of alliance participation, workflow embed, and a small number of named institutional references.
      Caris describes the Precision Oncology Alliance as a collaborative research network of more than 99 institutions
      and research consortia, including more than 45 NCI-designated cancer centers. The 2025 S-1/A still showed 96
      members as of March 31, 2025, while the first-quarter 2026 transcript said UC San Francisco became the 100th
      member during the quarter. BioSpace's ASCO 2025 coverage adds proof of ongoing usage inside the network, noting
      37 Caris/POA collaborator abstracts across 16 tumor types.

      Named institution proof is thinner than the size of the network would suggest. CARTI is the clearest public
      customer-proof witness in the fetched set: it said joining the Caris POA would bring advanced precision-oncology
      tools and research access to Arkansas patients without requiring them to leave the state. Workflow embed is more
      visible than customer-outcome disclosure. Caris's Epic partnership places ordering and results into Epic's ORA
      network, and Caris says Epic customers represent about 60% of U.S. oncologists. Separately, Caris says its
      OncoEMR integration makes profiling accessible to 2,000+ clinicians across 800+ cancer-care locations. Together,
      those signals show real operational deployment, but they still stop short of disclosing account-level retention,
      contract sizes, or outcome-based renewal proof for most cancer centers.
    claimRefs:
      - CU004
      - CU016
      - CU017
      - CU025
      - CU026
