  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Use Case
      - Scale / Public Signal
      - Revenue / Strategic Value
      - Key Gap
    rows:
      - - Clinical molecular profiling
        - Ordering oncologist / cancer patient / Medicare, Medicare Advantage, Medicaid, and commercial payers
        - Physician-directed therapy selection and tumor profiling
        - 199,300 FY2025 cases; 52,800 Q1 2026 cases; 6,100+ ordering oncologists
        - Core revenue engine and strongest adoption proof in public filings and earnings materials
        - No public hospital-account count, reorder cohort, or oncology-practice concentration disclosure
      - - Academic and comprehensive cancer centers via POA
        - Investigator or cancer-center leadership / research and tumor-board users / institution and Caris research budgets
        - Collaborative research, molecular testing standards, and publication output
        - 99+ institutions and 45+ NCI-designated centers on current POA page; 100th member referenced in Q1 2026 transcript
        - Extends brand credibility and data-generation flywheel for both clinical and biopharma motions
        - Named site economics, active-order counts, and renewal behavior are not public
      - - Community oncology practices via EHR and OncoEMR
        - Practice leadership and oncologist / clinicians and staff / practice plus payer reimbursement
        - Embedded test ordering, status tracking, and result review inside workflow tools
        - 3,000+ physicians using EMR integrations in Q1 2026; 2,000+ clinicians and 800+ cancer-care locations via OncoEMR
        - Lowers friction and may increase repeat ordering and operational stickiness
        - Caris does not disclose active customer logos, order volume by integration, or churn by channel
      - - Biopharma and life-sciences customers
        - Translational-research, biomarker, or trial-design lead / internal R&D teams / sponsor budgets
        - Target discovery, multimodal-data licensing, clinical-trial support, and biomarker research
        - 100+ biopharma partners disclosed in S-1/A; named examples include Genentech and Ontada
        - Non-clinical revenue stream with strategic upside for data services and therapeutics partnerships
        - Exact FY2025 segment revenue, renewal rates, and backlog are not fully public
      - - Right-In-Time clinical-trial sites
        - Treating oncologist or site PI / patient and research staff / sponsor and trial budgets
        - Local trial activation and patient matching after profiling
        - 610+ U.S. and Puerto Rico locations; activation in as little as 14 days
        - Expands Caris from testing vendor into local trial-access channel
        - Site-level conversion, sponsor mix, and revenue contribution are not disclosed
    notes: >-
      Segment boundaries reflect the public buyer / user / payer model Caris describes across clinical testing,
      research alliances, workflow integrations, and biopharma services. Public disclosures are strongest on volume and
      channel signals, not account-level economics.
