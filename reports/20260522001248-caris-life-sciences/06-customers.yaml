  - id: SU-durability-risk
    title: Durability gaps, concentration ambiguity, and reimbursement dependence
    body: |
      Public disclosure is strongest on utilization growth and channel embed, but weak on durability. The fetched
      results releases, S-1/A, payer materials, and customer pages do not disclose net revenue retention, gross
      revenue retention, churn, renewal cohorts, reorder frequency by account, or top-customer concentration. In other
      words, the public file supports the statement that Caris has demand and workflow scale; it does not support the
      stronger statement that the customer base has quantified long-term retention or low account concentration.
      Public proof also remains asymmetric by segment. The company is much more willing to discuss case volumes,
      payer access, and research-network scale than it is to disclose named clinical accounts with contract economics
      or quantified outcomes.

      The clearest disclosed dependency is reimbursement, not a single named-logo customer. Caris itself highlights
      commercial, Medicare, Medicare Advantage, and Medicaid coverage breadth, while independent and government sources
      show how important government reimbursement processes are for access and collections. DOJ, HHS OIG, and 360Dx
      all reported the approximately $2.89 million settlement tied to alleged Medicare 14-day-rule billing. 360Dx also
      reported that ChromoSeq secured MolDx coverage, reinforcing that Medicare-linked reimbursement remains a gating
      factor for new-assay uptake. GenomeWeb's JPM coverage showed management talking about pharma-business growth and
      future launches, but also waiting on MolDx review for upcoming assays. That combination makes payer policy,
      reimbursement operations, and disclosure gaps the main public customer-risk themes for diligence.
    claimRefs:
      - CU012
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
