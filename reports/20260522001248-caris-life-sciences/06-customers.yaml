  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion Driver
      - Concentration / Dependency Risk
      - Impact
      - Diligence Path
    rows:
      - - Broad payer coverage and reimbursement contracts
        - Medicare and commercial reimbursement policy shifts can alter ASP, access, and collections
        - Clinical growth is exposed to payer policy even without named-customer concentration disclosure
        - Request payer mix by revenue, denial rates, ASP by payer class, and PAMA sensitivity
      - - Epic, OncoEMR, and other EHR integrations
        - Workflow stickiness depends on third-party integration adoption and successful onboarding
        - Embedded ordering can accelerate repeat use, but channel-level churn is undisclosed
        - Request active integrated accounts, implementation backlog, and post-integration order uplift
      - - Precision Oncology Alliance and CODEai research network
        - Prestige and publication output may exceed monetized, durable revenue visibility
        - Research-network scale improves proof quality, but monetization and renewal are unclear
        - Request paid versus sponsored activity, site-level engagement, and conversion from network use to revenue
      - - Right-In-Time trial network
        - Sponsor demand and site-activation backlog are not publicly quantified
        - Trial-enablement could deepen relationships, but volume may be lumpy and partner-dependent
        - Request active sponsor count, open trials per site, enrollment conversion, and backlog by quarter
      - - Named biopharma collaborations
        - Genentech and Ontada prove relevance, but top-account concentration and renewal terms are undisclosed
        - Partner narratives can overstate visibility if contract timing shifts or milestone recognition is delayed
        - Request top five biopharma accounts, contract duration, renewal status, and deferred revenue cadence
      - - Medicare billing compliance
        - Prior 14-day-rule allegations show operational reimbursement risk beyond ordinary customer churn
        - Enforcement, recoupment, or audit issues could pressure collections and trust with provider customers
        - Request post-settlement controls, audit history, and any subsequent government inquiries or recoupments
    notes: >-
      The public evidence set makes payer dependence and workflow-channel dependence easier to analyze than named
      customer concentration. Impact language synthesizes official, filing, and adverse sources rather than reporting a
      single disclosed company metric.
