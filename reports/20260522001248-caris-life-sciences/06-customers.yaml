  - id: SU-biopharma-expansion
    title: Biopharma customers, data products, and channel expansion
    body: |
      Caris's non-clinical customer motion is built around biopharma data services, discovery collaborations, and
      trial-enablement products that sit on top of the clinical profiling engine. The June 2025 S-1/A said the
      company had 100+ biopharma partners as of March 31, 2025, while current product pages position CODEai,
      multimodal data, and Right-In-Time trials as the main monetizable interfaces. CODEai is now marketed as a
      real-world clinico-genomic platform spanning more than 484,000 patients and more than one million datapoints
      per patient; Caris says it helps researchers and biopharmaceutical companies with target identification,
      clinical-trial services, and product or commercial development work. The older launch release makes the
      intended customer segmentation explicit: POA investigators use the tool for collaborative research, while
      biopharma customers use the same data exhaust for discovery and development.

      Public named partner proof is better on the biopharma side than in the hospital-customer base. Caris disclosed a
      late-2025 Genentech collaboration to discover novel oncology targets, with $25 million of upfront and near-term
      payments and up to $1.1 billion of milestones and royalties. Caris also announced a January 2025 collaboration
      with Ontada that combines Caris's genomic and multimodal assets with Ontada's real-world oncology footprint in
      community oncology. Right-In-Time trials extend that customer journey into local trial activation: Caris says
      its network reaches 610+ locations, can activate sites in as little as 14 days, and uses Clinical Trial
      Navigators to match patients, work with oncologists, and keep patients close to home. These assets support
      expansion, but public revenue visibility for the biopharma book is still far weaker than public clinical-volume
      visibility.
    claimRefs:
