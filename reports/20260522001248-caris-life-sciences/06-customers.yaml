  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-table coverage
      missingEvidence: Full current roster of named clinical customers, active cancer-center accounts, and channel-specific account counts.
      whyItMatters: Public proof is currently a sample of named institutions and partners, which is insufficient to underwrite customer concentration or representative deployment quality.
      diligencePath: Request an account list by segment with active-order status, annual spend, and named references that can confirm production use.
      relatedQuestionRefs:
        - QU008
        - QU009
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: exact FY2025 pharma revenue and biopharma backlog
      missingEvidence: Exact FY2025 pharma and research revenue, deferred or contracted backlog, and delivery schedule by biopharma account.
      whyItMatters: Public sources provide only a Q1 2026 quarterly figure and a 2026 full-year guide, leaving customer durability and segment visibility underdetermined.
      diligencePath: Request FY2025 segment bridge, booked backlog, top-account revenue share, and contract term sheet summary from management.
      relatedQuestionRefs:
        - QU016
    - type: private-evidence-only
      severity: material
      topic: retention metrics
      missingEvidence: Net revenue retention, gross revenue retention, and renewal cohorts for clinical and biopharma customers.
      whyItMatters: Utilization growth alone cannot establish durability; retention is essential to judge the stickiness of ordering oncologists, institutions, and sponsors.
      diligencePath: Request audited NRR and GRR by segment, plus annual renewal cohorts and cohort notes for major pricing or product changes.
      relatedQuestionRefs:
        - QU018
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: churn and reorder behavior
      missingEvidence: Account-level churn, reorder frequency by physician and institution, and post-integration order lift for Epic and OncoEMR channels.
      whyItMatters: Electronic-order growth is only a proxy; without reorder and churn cohorts, workflow embed cannot be translated into durable customer economics.
      diligencePath: Request monthly active ordering physicians, repeat-order intervals, integrated-account activation curves, and lost-account analysis.
      relatedQuestionRefs:
        - QU019
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration and payer mix
      missingEvidence: Top-customer concentration, top-biopharma-account concentration, and payer mix by revenue and gross profit.
      whyItMatters: Public materials suggest payer dependence is the main disclosed risk, but the absence of concentration data prevents a clean downside analysis.
      diligencePath: Request top-10 account concentration, payer-mix waterfall, denied-claim trends, and any customer representing more than 5% of revenue.
      relatedQuestionRefs:
        - QU020
        - QU022
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: minor
      topic: quantified customer-outcome proof
      missingEvidence: Current case studies with quantified clinical, economic, or workflow outcomes from named cancer centers, health systems, or biopharma customers.
      whyItMatters: Public proof currently emphasizes membership, integrations, and collaborations more than measurable outcomes, which limits external validation quality.
      diligencePath: Request 3-5 current customer references with metrics on turnaround, order growth, treatment impact, or trial-enrollment improvement.
      relatedQuestionRefs:
        - QU023
