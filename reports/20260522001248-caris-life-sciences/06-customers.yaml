company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 6
  title: Customers
  summary: >-
    Caris's customer system is best understood as a three-sided network: oncologists and cancer centers ordering
    physician-directed molecular tests, payers reimbursing broad clinical access, and biopharma sponsors buying
    data, discovery, and trial-enablement services. Public evidence shows strong clinical utilization and workflow
    embed — approximately 199,300 FY2025 cases, 52,800 Q1 2026 cases, 6,100 ordering oncologists, and more than
    70% electronic orders — plus named partner proof via CARTI, Genentech, Ontada, Epic/OncoEMR, the Precision
    Oncology Alliance, and 610+ Right-In-Time trial locations. Durability is the weakest disclosed area: Caris does
    not publicly provide NRR, GRR, churn, top-account concentration, or biopharma backlog metrics, while
    Medicare-linked reimbursement and prior billing enforcement make payer dependence the clearest disclosed
    customer risk.
sections:
  - id: SU-clinical-mix
    title: Clinical customer mix, order flow, and payer stack
    body: |
      Caris's core commercial motion is still clinical molecular profiling ordered by oncologists for cancer patients,
      not direct-to-consumer testing. The company describes eligible patient samples as being submitted by ordering
      physicians for therapy-selection profiling, and the public operating data confirms that this physician-directed
      channel is already scaled. The S-1/A filed in June 2025 said Caris had 5,550+ regularly ordering oncologists,
      90+ payer reimbursement contracts, and roughly 60% electronic ordering as of March 31, 2025. By the first
      quarter of 2026, management said the platform was supporting more than 6,100 ordering oncologists and that more
      than 70% of orders were flowing through EHR and portal channels. Clinical volume also remained the dominant
      public adoption proof: Caris reported approximately 199,300 FY2025 therapy-selection cases and 52,800 Q1 2026
      cases.

      Economically, the public buyer / user / payer stack is split. The treating oncologist is the operational buyer
      and workflow owner, the patient is the beneficiary of the therapy-selection output, and reimbursement comes from
      a broad payer base rather than a small set of named enterprise accounts. Caris says it is in-network with most
      major commercial payers, has national Medicare and Medicare Advantage coverage, covers more than 200 million
      lives, works with more than 100 health plans, and has 12+ state Medicaid plans covering MI Cancer Seek.
      Because public disclosure emphasizes payer contracts and coverage breadth rather than named hospital-system
      revenue concentration, reimbursement exposure is more visible than single-customer exposure in the public record.
    claimRefs:
      - CU001
      - CU002
