  - id: competitive-and-market-risk
    title: Competitive and market risk
    body: >-
      Caris does not compete against one weak field; it competes against multiple scaled specialists with entrenched advantages. In its own 10-K, Caris names Foundation Medicine and Tempus in tissue profiling, Guardant / Tempus / Foundation in blood-based therapy selection, and Grail / Freenome / Guardant / Exact / Delfi in early detection. That alone is enough to conclude that Caris's growth assumptions depend on taking share in crowded categories rather than opening uncontested white space. [CR017] [CR018] [CR019]

      The tissue and data-platform rivals are formidable. Foundation Medicine says it has delivered more than 1.5 million CGP reports and holds more than 50% of approved U.S. NGS CDX indications; its FoundationOne tissue and liquid products both analyze 324 genes and now extend into RNA. Tempus layers a 648-gene xT CDx, whole-transcriptome xR, and an AI / digital-pathology stack leveraging 8M+ de-identified research records, while reporting Q1 2026 diagnostics revenue of $261.1M inside a $348.1M revenue quarter. Relative to Caris, those rivals bring either deeper CDX entrenchment, larger public-market scale, or heavier workflow software integration. [CR020] [CR021] [CR022] [CR023]

      In liquid biopsy and MRD, Caris faces competitors whose commercial positions are already established. Guardant says it has performed over 500,000 blood tests for 12,000 doctors and recently won FDA approval for a new Guardant360 Liquid CDx CGP test. Natera markets Signatera as the only genome-designed MRD assay with Medicare coverage and pairs it with Altera and Latitude, meaning reimbursement-backed liquid-biopsy competition is already strong in the monitoring continuum Caris wants to address with Assure MRD and future offerings. [CR024] [CR029]

      Caris Detect adds upside, but also concentrates forward narrative risk in the hardest commercialization category. Caris's FY2025 release framed Detect as a first-half-2026 launch, while 360Dx said the company had previously indicated a second-quarter-2026 launch. Final Achieve 1 data look directionally strong, but GRAIL already markets Galleri with a 0.4% false-positive rate and 93.4% cancer-signal-of-origin accuracy, and GRAIL's own 10-K explicitly names Caris among announced MCED entrants. Exact Sciences and NeoGenomics add adjacent oncology-testing scale, and none of these competitors require Caris to stumble badly to compress its share gains; they merely need to execute on already-established distribution, reimbursement, or published evidence advantages. [CR025] [CR026] [CR027] [CR028] [CR030] [CR031] [CR032]
