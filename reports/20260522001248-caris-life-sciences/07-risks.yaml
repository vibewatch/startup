  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Public indicator
      - Threshold / event
      - Thesis implication
      - Current public status
    rows:
      - - DOJ / 14-day-rule exposure
        - SEC or earnings disclosure on accrual, reserve, or scope expansion
        - Any quantified reserve or adverse legal update
        - Immediate re-underwrite of legal downside and reimbursement controls
        - No quantified exposure disclosed publicly
      - - Controls remediation
        - 10-Q / 10-K / proxy language on ICFR weakness
        - Weakness persists into FY2026 year-end or expands to new areas
        - Reporting-quality discount should remain in place
        - Still open publicly at FY2025 year-end; no explicit remediation statement by runDate
      - - NY CLEP approval
        - Wadsworth / company update on Caris Assure authorization
        - Approval delayed beyond 2026 or application requires major rework
        - Assure addressable-market expansion slows in New York
        - Application submitted; approval not public
      - - Coverage durability
        - MolDx / CMS / payer policy changes for core or new assays
        - Adverse coverage revision, lower payment, or failed technical assessment
        - Revenue-growth and margin assumptions need reset
        - ChromoSeq win positive; Assure MRD still pending
      - - Detect launch execution
        - Launch date, ordering channel uptake, and screening-volume disclosures
        - Launch slips materially beyond guided window or no traction metrics emerge
        - Future-growth narrative weakens and valuation multiple should compress
        - H1 / Q2 2026 window still referenced publicly
      - - Cyber / privacy posture
        - Breach notice, regulatory inquiry, or security incident disclosure
        - Any confirmed material data incident
        - Trust, pharma-data monetization, and clinical volumes all at risk
        - No material public incident disclosed
      - - Founder / succession risk
        - Board or proxy disclosure on succession and governance changes
        - Unexpected CEO transition without named successor
        - Strategic continuity and investor confidence weaken sharply
        - No public succession plan identified
      - - Debt / liquidity discipline
        - Covenant headroom, debt draw activity, and cash balance trend
        - Minimum qualified cash headroom narrows materially or delayed draw is used defensively
        - Positive-FCF thesis weakens; financing dependence rises
        - Cash profile strong, but covenanted debt remains in place
    notes: >-
      Thresholds are diligence heuristics derived from public evidence; they are monitoring triggers, not company guidance or lender forecasts.
