sections:
  - id: regulatory-legal-and-reimbursement-risk
    title: Regulatory, legal, and reimbursement risk
    body: >-
      The highest-severity public risk is the DOJ overhang around Medicare's date-of-service rule. In April 2025, the SEC explicitly told Caris to expand its S-1 disclosure around a March 2025 civil investigative demand, asking for more background on the CID, the scope of the investigation, and Caris's compliance with the 14-day rule. The FY2025 10-K later confirmed that the CID concerns Caris's compliance with Medicare's date-of-service rule under the False Claims Act. [CR001] [CR002]

      The reason this matters is not theoretical. In 2022, Caris already paid $2,886,674.86 to resolve allegations that it improperly delayed submission of certain genetic-cancer-screening tests to bill Medicare outside the 14-day bundled-payment window. The settlement agreement ties the matter to relator Samuel Caughron's qui tam action and to alleged Date-of-Service / 14-day-rule violations, while the whistleblower narrative says the challenged conduct spanned 2007-2017. Public sources do not disclose the size of the current CID's claims universe, reserves, or likely recoupment range, so the downside remains qualitatively material but quantitatively open. [CR003] [CR004] [CR005] [CR047]

      Reimbursement concentration amplifies the legal risk. Medicare-covered patients represented about 39.6% of FY2025 molecular-profiling revenue, and Caris's own payer page says the company is in-network with 100+ health plans covering 200M+ lives, including Medicare and Medicare Advantage. The 10-K warns that genomic-test coverage determinations are time-consuming, costly, and changeable, while Caris's annual physician notice stresses that it must bill Medicare consistently with federal and state rules and may need ABNs when services are expected to be non-covered. In other words, Caris's strongest margin engine still sits under a reimbursement regime where payment, medical necessity, and billing procedure are all externally governed. [CR009] [CR010] [CR011] [CR012]

      New-product coverage and state access are still gated. Caris Assure remained excluded from New York in the S-1, which said the assay was available in all U.S. states other than New York pending NY CLEP approval. GenomeWeb then reported on May 8, 2026 that Caris had only just submitted its NYSDOH / Wadsworth application, meaning the test was still in review rather than approved as of runDate. Caris also disclosed that Caris Assure MRD had merely been submitted for MolDx technical assessment with no assurance of acceptance, while ChromoSeq's new MolDx win shows how dependent incremental menu expansion remains on CMS-contractor coverage decisions. [CR013] [CR014] [CR015] [CR016]

      Governance risk belongs in the same bucket because it affects the credibility of external disclosures. Caris's FY2025 10-K said a material weakness in internal control over financial reporting remained outstanding at year-end, caused by insufficient qualified accounting resources for complex accounting judgments. The FY2026 proxy and Q1 2026 press release do not publicly state that the weakness has been fully remediated. For a newly public company facing a live DOJ billing inquiry, that combination raises the diligence bar on earnings quality and legal-reserve reliability. [CR006] [CR007] [CR008]
