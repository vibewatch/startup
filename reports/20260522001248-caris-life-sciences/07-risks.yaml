company:
  name: Caris Life Sciences, Inc.
chapter:
  number: 7
  letter: R
  title: Risks
  summary: >-
    Caris Life Sciences' risk profile is led by regulatory-reimbursement exposure rather than raw demand risk. The most acute public issue is the March 2025 DOJ civil investigative demand into Medicare's 14-day rule, which lands on top of a 2022 False Claims Act settlement over similar billing conduct. That legal overhang sits beside a still-unremediated FY2025 material weakness in financial reporting controls, meaningful Medicare and MolDx dependence in the core molecular-profiling engine, and a live New York CLEP gating item for Caris Assure. Competitive pressure is also real: Foundation Medicine, Tempus, Guardant, GRAIL, Exact Sciences, NeoGenomics, and Natera all possess scale, regulatory, or channel advantages in at least one segment where Caris is trying to grow. Positive cash flow materially reduces near-term financing stress, but it does not eliminate execution dependence on reimbursement durability, Caris Detect commercialization, supplier resilience, data-governance quality, and founder-centric governance.
  contentRequirements:
    - Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and investment implication.
    - Regulatory/legal risk — licenses, approvals, litigation, enforcement, privacy, and billing.
    - Operational risk — supplier dependence, reliability, data security, and AI/model integrity.
    - Partner/dependency risk — payer, supplier, regulator, channel, and competitor dependency.
    - Financial/model risk — deficit, debt terms, capital intensity, and margin / reimbursement compression.
    - Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
