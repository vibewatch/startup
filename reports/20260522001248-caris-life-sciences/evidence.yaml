evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      Caris Life Sciences does not publicly disclose total employee headcount in its SEC filings (10-K does not include
      a specific headcount figure in the accessible text). The careers page references a collaborative team but provides
      no number.
    whyItMatters: >-
      Headcount is a critical efficiency metric for a diagnostics company. Revenue per employee and scaling efficiency
      relative to case volume growth are standard diligence inputs that cannot be assessed without headcount data.
    diligencePath: >-
      Request employee count via Investor Relations (IR@CarisLS.com) or identify the specific section of the 10-K (Item
      1 – Human Capital) where headcount is disclosed; cross-check against LinkedIn employee counts as a proxy.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: competitive-position
    missingEvidence: >-
      No independent third-party analysis comparing Caris Life Sciences' technology, market share, or financial
      performance to Foundation Medicine (Roche), Guardant Health (Nasdaq: GH), or Tempus AI (Nasdaq: TEM) was
      successfully retrieved. Public company filings for those competitors were not fetched for this chapter.
    whyItMatters: >-
      Without a competitive comparison, it is not possible to assess whether Caris's revenue growth and margin expansion
      represent market-share gains, favorable payer dynamics, or category-wide expansion. The valuation chapter will
      require this context.
    diligencePath: >-
      Fetch 10-K and investor presentations for Foundation Medicine, Guardant Health, and Tempus AI; cross-reference
      volume, ASP, and margin data; commission or identify any published market research (Grand View Research, Mordor
      Intelligence, or equivalent) on comprehensive molecular profiling market share.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      The precise payer mix (Medicare vs. commercial vs. Medicaid share), average selling price (ASP) by payer type, and
      the methodology for recognizing prior-period true-ups under ASC 606 are not fully detailed in the accessible
      portions of the 10-K. The FY2025 10-K discloses ~$33M in prior-period true-ups included in FY2025 revenue but does
      not break down payer mix quantitatively in the accessible text.
    whyItMatters: >-
      ASP sustainability and payer mix are the key drivers of margin expansion. If the FY2025 revenue inflection was
      driven by non-recurring true-ups or favorable one-time adjustments, the FY2026 guidance of $1.0–1.02B may be
      overstated. This is a critical financial diligence item.
    diligencePath: >-
      Review the full Notes to Financial Statements in the 10-K (specifically the Revenue Recognition note and the
      segment note) for payer mix detail. Request supplemental payer mix disclosure from IR. Cross-check against the
      preliminary 8-K which disclosed ~$33M in prior-year true-ups in Q4 2025 vs. the final 10-K which reported ~$81M in
      the final Q4 numbers.
    relatedQuestionRefs:
      - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: funding
    missingEvidence: >-
      The identities of investors in Series A, B, and C preferred stock rounds (prior to Series D in 2021) are not
      publicly disclosed. Liquidation preference amounts were estimated from the S-1 and 10-K financials; actual
      investment amounts and timing for these rounds are not independently confirmed.
    whyItMatters: >-
      Understanding the pre-2021 investor syndicate and their current ownership stake is relevant for cap table
      analysis, potential insider overhang, and understanding governance dynamics prior to the Silver Lake investment.
    diligencePath: >-
      Review the detailed cap table in the S-1 registration statement or request from the company directly through
      investor relations. Cross-check Crunchbase or PitchBook for any disclosed early-round investors.
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent, peer-reviewed or third-party-validated estimate of the U.S. therapy-selection CGP market that can
      be compared against the Nephron Research $8 billion figure on consistent methodology and scope assumptions.
    whyItMatters: >-
      The Nephron Research study is company-commissioned and not independently validated; the gap between Caris's $8
      billion therapy-selection TAM and the global CGP market estimate of $10.1 billion (2030) from GlobeNewswire raises
      questions about geographic, scope, and methodological comparability. If the true U.S. therapy-selection TAM is
      materially smaller, Caris's penetration story is weaker.
    diligencePath: >-
      Request or commission an independent market sizing analysis from IQVIA, Clarivate, or a specialist oncology market
      research firm (e.g., DeciBio Consulting) that uses consistent methodology across U.S. and global scopes and
      separates the current from the long-term pre-commercial segments.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: minor
    topic: reimbursement
    missingEvidence: >-
      A breakdown of Caris's FY2025 revenue by payer category (Medicare, Medicaid, commercial, self-pay) and the
      associated average selling price and coverage denial rate per payer channel.
    whyItMatters: >-
      Caris does not publicly disclose granular payer-mix revenue data. Without this, it is not possible to assess
      whether growth is driven by improved commercial payer coverage (better mix) or primarily by volume expansion
      within existing Medicare coverage (rate-sensitive). This affects the sustainability and margin quality assessment
      in Chapter 3 (Financial Analysis).
    diligencePath: >-
      Request payer mix disclosure from Caris investor relations, or review any supplemental earnings materials, S-1
      risk factor disclosures, or analyst Q&A transcripts that may include directional commentary on Medicare vs.
      commercial revenue split.
    relatedQuestionRefs:
      - QM012
      - QM019
  - type: missing-source
    severity: material
    topic: early-detection
    missingEvidence: >-
      A public CMS policy statement or proposed NCD/LCD regarding reimbursement coverage for multi-cancer early
      detection (MCED) assays, as well as the timeline for a coverage determination.
    whyItMatters: >-
      The $100 billion early-detection TAM that drives Caris's $150 billion total TAM narrative is entirely contingent
      on payers establishing reimbursement coverage for MCED assays. Without a CMS coverage pathway, this segment cannot
      be commercialized at scale. GRAIL's Galleri assay provides a market parallel: despite years of clinical data, MCED
      reimbursement remains under CMS review. If coverage is delayed beyond 2028, the $100 billion segment will not be
      monetizable in the diligence horizon.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: missing-source
    severity: material
    topic: Caris Detect clinical validation data
    missingEvidence: >-
      Published peer-reviewed clinical performance data for Caris Detect MCED test (sensitivity, specificity, cancer
      signal of origin accuracy, false positive rate) comparable to GRAIL Galleri's Lancet/Annals of Oncology
      publications.
    whyItMatters: >-
      Without comparative published data, it is impossible to assess whether Caris Detect's performance is competitive
      with GRAIL Galleri; this directly affects valuation of the MCED pipeline and Caris Detect revenue projections.
    diligencePath: >-
      Request clinical validation study data from Caris management; check ClinicalTrials.gov for registered Caris Detect
      studies; review any early-phase results presented at ASCO or AACR conference abstracts.
    relatedQuestionRefs:
      - QP006
      - QP021
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: competitor pricing
    missingEvidence: >-
      Publicly disclosed list prices for Foundation Medicine, Tempus AI, Guardant Health, and Natera's primary oncology
      tests; actual average selling prices (ASP) and volume-based discounting structures.
    whyItMatters: >-
      Without competitor pricing data, it is difficult to assess whether Caris's ASP is sustainable or whether pricing
      pressure from competitors will compress Caris's gross margins over the next 2–3 years.
    diligencePath: >-
      Request pricing data from oncology billing consultants; review CMS LCD/NCD reimbursement rates as a proxy; analyze
      competitor gross margin disclosures in SEC filings to infer ASP.
    relatedQuestionRefs:
      - QP016
  - type: missing-source
    severity: material
