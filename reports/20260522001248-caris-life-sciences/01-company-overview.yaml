  - id: risks-and-adverse-signals
    title: Risks, Adverse Signals, and Diligence Gaps
    body: >
      Caris Life Sciences disclosed a material weakness in internal controls over financial reporting in its FY2025
      Annual Report on Form 10-K, filed March 3, 2026. This is a significant governance and operational risk that
      indicates the company's financial reporting infrastructure did not keep pace with its growth, and it creates
      uncertainty about the reliability of historical financial data. The material weakness is particularly noteworthy
      for a company that is now public and subject to SOX 302/404 requirements.


      More acutely, in March 2025 Caris received a civil investigative demand (CID) from the U.S. Department of
      Justice under the False Claims Act, related to the company's compliance with Medicare's date of service (14-day)
      rule. The 14-day rule governs when a laboratory test is separately billable versus bundled with a hospital
      admission. Violation of this rule could lead to recoupment demands, penalties, and reputational damage. The SEC
      itself flagged this risk in an April 2025 comment letter to the company, noting insufficient disclosure about the
      scope of the investigation and requesting enhanced disclosure in the S-1.


      Additional material risks include: (1) Key-person and family concentration risk — David Halbert is the sole
      founder and CEO, his brother Jon Halbert is a non-independent director, and there is no disclosed succession plan;
      (2) Caris Assure's geographic restriction in New York State pending CLEP approval, which limits market access in
      the most densely populated U.S. market; (3) Revenue concentration (~94% molecular profiling in FY2025),
      creating exposure to Medicare reimbursement rate changes; and (4) The $2.5B accumulated deficit reflecting
      the heavy capital investment required to build clinical-scale molecular profiling — now turning positive but
      with ongoing free cash flow scrutiny. Diligence on the DOJ CID, reimbursement trajectory, and ASP sustainability
      should be prioritized in subsequent chapters.
    claimRefs:
      - CO038
      - CO039
      - CO040
      - CO041
      - CO028

