  - id: capital-formation
    title: Capital Formation, Investors, and Debt
    body: >
      Caris Life Sciences accumulated substantial private capital before its 2025 IPO. The company raised multiple
      preferred equity rounds over its 17-year private history, with aggregate liquidation preferences across Series A
      through F of approximately $1.79 billion. The largest round was Series D (~$830M investment, led by Silver Lake
      Partners, announced September 2021), which was the single largest private institutional investment in the
      company's history and provided the scale capital for the clinical build-out that drove the 2024–2025 revenue
      inflection.


      In 2023, Caris entered into a $400M term loan with Sixth Street Specialty Lending. In June 2025, the company
      completed its Nasdaq IPO, raising approximately $519.5M in net proceeds plus $68.9M from the overallotment
      option, totaling approximately $588.4M in IPO capital — one of the largest precision medicine IPOs on record.
      Cash as of December 31, 2025, was $796.3M (including the IPO proceeds). In Q1 2026, Caris refinanced the $400M
      term loan with a new facility led by Blue Owl Capital and Blackstone, extending duration and improving terms. Cash
      as of Q1 2026 end was approximately $821M.


      The overall capital picture reflects a company that invested heavily across a long pre-profitability phase
      (accumulated deficit $2.5B as of December 31, 2025), reached operating leverage in 2024–2025, and is now
      generating positive adjusted EBITDA and free cash flow. The path from private to public included no disclosed
      secondary sales by founders, and the company's debt position ($400M) is manageable at the current revenue scale
      ($812M FY2025 revenue, $137.7M adj. EBITDA).
