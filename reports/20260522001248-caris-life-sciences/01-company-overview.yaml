callouts:
  - calloutType: strength
    title: Exceptional revenue inflection with expanding margins
    body: >-
      FY2025 revenue of $812M (+97% YoY) combined with a 66% gross margin (+2,300 bps vs. FY2024) and
      $137.7M adjusted EBITDA demonstrates that Caris has crossed the operating leverage threshold. Q1 2026
      continued the trajectory: $216.2M revenue (+79% YoY), 65% gross margin, and $26.2M adj. EBITDA — with
      management guiding the company toward its first $1B revenue year (FY2026 guidance: $1.0B–$1.02B).
      This margin expansion profile is rare in the diagnostics sector and reflects sustainable ASP improvements
      rather than one-time favorable items.
    claimRefs:
      - CO019
      - CO021
      - CO022
      - CO024
      - CO025
      - CO027

  - calloutType: risk
    title: DOJ False Claims Act CID and material weakness in internal controls
    body: >-
      Two material adverse signals require immediate flagging. First, in March 2025 Caris received a DOJ civil
      investigative demand (CID) under the False Claims Act regarding its compliance with Medicare's 14-day date
      of service rule. The SEC staff explicitly noted in its April 2025 comment letter that Caris provided
      insufficient disclosure about the scope of this investigation. False Claims Act violations can lead to
      recoupment demands, treble damages, and exclusion from federal healthcare programs — existential risks for a
      company whose core revenue comes from Medicare reimbursement. Second, the FY2025 10-K disclosed a material
      weakness in internal controls over financial reporting, indicating that the company's financial infrastructure
      has not yet matured to match its rapid revenue growth. Both issues must be tracked as live diligence items
      through subsequent chapters.
    claimRefs:
      - CO038
      - CO039

  - calloutType: insight
    title: Comprehensive WES+WTS at scale is a defensible moat — but reimbursement is the ceiling
    body: >-
      Caris's competitive position rests on being the only commercial provider that sequences the full exome and
      transcriptome simultaneously for tumor profiling at scale. With 1,070,000+ profiles, 484,000+ matched
      datasets, and CODEai as the data flywheel, the company has a compounding informatics advantage that cannot
      be replicated quickly. However, the key strategic variable is not technology — it is payer coverage and ASP.
      CMS local coverage determinations (MolDX) and commercial payer contracts set the reimbursement ceiling.
      Any adverse change to Medicare LCDs, a material audit finding under the 14-day rule, or a slowdown in
      commercial payer adoption could rapidly compress revenue and reverse the margin trajectory. Downstream
      chapters should stress-test ASP assumptions and the reimbursement pipeline.
    claimRefs:
      - CO013
      - CO015
      - CO031

