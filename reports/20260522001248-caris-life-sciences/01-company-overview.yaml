  evidenceGaps:
    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: >-
        Caris Life Sciences does not publicly disclose total employee headcount in its SEC filings
        (10-K does not include a specific headcount figure in the accessible text). The careers page
        references a collaborative team but provides no number.
      whyItMatters: >-
        Headcount is a critical efficiency metric for a diagnostics company. Revenue per employee and
        scaling efficiency relative to case volume growth are standard diligence inputs that cannot
        be assessed without headcount data.
      diligencePath: >-
        Request employee count via Investor Relations (IR@CarisLS.com) or identify the specific
        section of the 10-K (Item 1 – Human Capital) where headcount is disclosed; cross-check
        against LinkedIn employee counts as a proxy.
      relatedQuestionRefs:
        - QO025

    - type: missing-source
      severity: material
      topic: competitive-position
      missingEvidence: >-
        No independent third-party analysis comparing Caris Life Sciences' technology, market share,
        or financial performance to Foundation Medicine (Roche), Guardant Health (Nasdaq: GH), or
        Tempus AI (Nasdaq: TEM) was successfully retrieved. Public company filings for those
        competitors were not fetched for this chapter.
      whyItMatters: >-
        Without a competitive comparison, it is not possible to assess whether Caris's revenue growth
        and margin expansion represent market-share gains, favorable payer dynamics, or category-wide
        expansion. The valuation chapter will require this context.
      diligencePath: >-
        Fetch 10-K and investor presentations for Foundation Medicine, Guardant Health, and Tempus AI;
        cross-reference volume, ASP, and margin data; commission or identify any published market
        research (Grand View Research, Mordor Intelligence, or equivalent) on comprehensive molecular
        profiling market share.
      relatedQuestionRefs:
        - QO026

    - type: private-evidence-only
      severity: material
      topic: revenue-recognition
      missingEvidence: >-
        The precise payer mix (Medicare vs. commercial vs. Medicaid share), average selling price (ASP)
        by payer type, and the methodology for recognizing prior-period true-ups under ASC 606 are
        not fully detailed in the accessible portions of the 10-K. The FY2025 10-K discloses ~$33M in
        prior-period true-ups included in FY2025 revenue but does not break down payer mix quantitatively
        in the accessible text.
      whyItMatters: >-
        ASP sustainability and payer mix are the key drivers of margin expansion. If the FY2025 revenue
        inflection was driven by non-recurring true-ups or favorable one-time adjustments, the FY2026
        guidance of $1.0–1.02B may be overstated. This is a critical financial diligence item.
      diligencePath: >-
        Review the full Notes to Financial Statements in the 10-K (specifically the Revenue Recognition
        note and the segment note) for payer mix detail. Request supplemental payer mix disclosure from
        IR. Cross-check against the preliminary 8-K which disclosed ~$33M in prior-year true-ups in Q4
        2025 vs. the final 10-K which reported ~$81M in the final Q4 numbers.
      relatedQuestionRefs:
        - QO027

    - type: enumeration-incomplete
      severity: minor
      topic: funding
      missingEvidence: >-
        The identities of investors in Series A, B, and C preferred stock rounds (prior to Series D
        in 2021) are not publicly disclosed. Liquidation preference amounts were estimated from the
        S-1 and 10-K financials; actual investment amounts and timing for these rounds are not
        independently confirmed.
      whyItMatters: >-
        Understanding the pre-2021 investor syndicate and their current ownership stake is relevant
        for cap table analysis, potential insider overhang, and understanding governance dynamics
        prior to the Silver Lake investment.
      diligencePath: >-
        Review the detailed cap table in the S-1 registration statement or request from the company
        directly through investor relations. Cross-check Crunchbase or PitchBook for any disclosed
        early-round investors.
      relatedTableRefs:
        - TO003
        - TO004
