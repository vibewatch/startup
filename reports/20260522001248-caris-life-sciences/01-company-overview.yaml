  - id: product-portfolio
    title: Product Portfolio and Clinical Scale
    body: >
      The core commercial product is Caris MI Profile, a comprehensive molecular profiling test leveraging Whole
      Exome Sequencing (WES) and Whole Transcriptome Sequencing (WTS) across 23,000+ genes in solid and liquid
      tumor tissue. MI Profile is the company's primary revenue driver and positions Caris as the only commercially
      scaled provider of simultaneous WES+WTS across the full exome and transcriptome for tumor profiling.
      Oncologists use MI Profile for therapy selection in advanced cancers, and its breadth of biomarker coverage
      differentiates it from gene-panel competitors.


      The second key commercial product is Caris Assure, a blood-based liquid biopsy using the proprietary cNAS
      (circulating nucleic acid sequencing) technology that extends WES+WTS to cell-free DNA and RNA in blood. Caris
      Assure generated approximately 29,000 cases in FY2025 and 9,200 in Q1 2026, showing accelerating adoption.
      One geographic constraint: Caris Assure is not available in New York State pending New York CLEP laboratory
      approval. Caris ChromoSeq, a comprehensive whole-genome profiling test for myeloid malignancies (e.g., AML,
      MDS), received MolDX local coverage determination (LCD) approval in 2026, authorizing Medicare reimbursement.
      Caris MI Clarity, an AI-powered prognostic test for early-stage breast cancer recurrence risk, was also
      launched commercially in 2026, leveraging the same data platform.


      CODEai is the company's AI and machine learning platform aggregating 484,000+ matched clinico-genomic datasets,
      enabling real-world data analytics, biomarker discovery, and AI model development for biopharma partners. Caris
      Detect, a multi-cancer early detection (MCED) test using whole-genome sequencing on blood, is in development with
      a planned commercial launch in the first half of 2026, representing the company's next major revenue catalyst.
      As of March 31, 2026, Caris had completed 1,070,000+ total profiles (790,000+ matched), and approximately
      52,800 clinical cases in Q1 2026 alone.
