  - id: leadership-governance
    title: Leadership, Board, and Governance
    body: >
      David Dean Halbert (age 70, D.Sc. honoris causa) is the Founder, Chairman, and CEO of Caris Life Sciences, a
      position he has held since the company's inception in 2008. Halbert is a serial healthcare entrepreneur whose
      track record anchors a significant portion of the company's credibility: he founded AdvancePCS (a pharmacy
      benefit management company) in 1987, built it into a multi-billion-dollar business, and sold it to CareMark in
      2004 for approximately $7.5 billion. He later served as CEO of Caris Diagnostics (2005–2011), which was sold to
      Miraca Holdings for $725M, freeing up capital and focus for the molecular profiling company he built next. Halbert
      brings founder-market fit in healthcare services and reimbursement, which is central to Caris's go-to-market
      strategy. Key-person risk is elevated: there is no publicly designated CEO succession plan, and Halbert's
      brother Jon S. Halbert sits on the board, reflecting family governance dynamics that warrant diligence.


      The senior executive team adds institutional depth. Brian J. Brille (age 65), Vice Chairman and EVP since
      January 2018, brings deep capital markets experience from BofA Merrill Lynch (1999–2013), where he served as
      Chairman/President of Asia Pacific and Head of Healthcare Investment Banking. David Spetzler, Ph.D.
      (age 50), President since November 2016, is the scientific co-architect of the platform; he joined as a
      Senior Scientist in August 2009 and holds MS, PhD, and MBA degrees in molecular biology and business from
      Arizona State University. Luke Power (age 44), SVP, CFO, and CAO since February 2023, joined Caris in
      December 2011 and is a Fellow of Chartered Accountants Ireland with a prior career at PricewaterhouseCoopers
      (2002–2011). J. Russel Denton, SVP and General Counsel since September 2022, is a Stanford Law graduate and
      former Shearman & Sterling LLP partner (2018–2022).


      The board comprises 10 directors as of the April 2026 DEF 14A proxy, with Peter M. Castleman (former Chairman
      and Managing Partner of J.H. Whitney & Co.) serving as Lead Independent Director. Other notable directors include
      Lloyd B. Minor, M.D. (Dean of Stanford School of Medicine), David Fredrickson (EVP Oncology, AstraZeneca), and
      Jeffrey Vacirca, M.D. (CEO, New York Cancer & Blood Specialists; Co-Founder, OneOncology). The concentration of
      Halbert family members (David as CEO, Jon on the board) and AdvancePCS alumni (Brian Brille, Laura Johansen,
      Danny Phillips) is notable and represents a tightly networked governance circle.
