  - id: milestones-and-growth
    title: Milestones, Operational Growth, and Financial Trajectory
    body: >
      Caris Life Sciences' corporate history spans four decades of related activity, beginning with David Halbert's
      1987 founding of AdvancePCS, through the 2025 IPO, and into a near-profitable Q1 2026. The company's financial
      trajectory shows a step-change in 2024–2025 driven by reimbursement improvements, ASP gains, and clinical case
      volume growth: FY2023 revenue was approximately $306M, FY2024 was $412.3M (+35% YoY), and FY2025 reached
      $812M (+97% YoY). Gross margin expanded from 43% in FY2024 to 66% in FY2025 (+2,300 bps), reflecting both
      operating leverage and favorable payer mix shifts. Net loss improved from $341.4M (FY2023) to $281.9M (FY2024)
      to $68.1M (FY2025), and Q1 2026 near-breakeven ($0.5M net loss), with positive free cash flow of $22.5M and
      adj. EBITDA of $26.2M.


      Clinical scale metrics reinforce the operational momentum: approximately 199,300 therapy selection cases in
      FY2025 (up 22% YoY), and approximately 52,800 cases in Q1 2026. Total profiles surpassed 1,070,000 through
      March 2026, with 790,000+ matched profiles — the foundation of CODEai and pharma R&D services. The milestone
      table provides a complete dated chronology covering founding, financing, product, scale, regulatory, and adverse
      events. Key regulatory milestones in 2026 include ChromoSeq receiving MolDX LCD approval and MI Clarity's
      commercial launch. Management's FY2026 guidance of $1.0B–$1.02B implies first-time $1B revenue and sustainable
      scale, though execution risk from Q1 2026 sales force re-alignment and the DOJ CID adds complexity.
