companyProfile:
  summary: >
    Caris Life Sciences, Inc. is an Irving, Texas-based public precision-oncology company founded in 2008 by David Dean
    Halbert. The company sells physician-ordered molecular profiling, centered on MI Profile and Caris Assure, and uses
    the resulting clinico-genomic dataset to support biopharma analytics and clinical-development work through CODEai.
    Caris reached meaningful scale by FY2025 with $812.0 million of revenue, more than 1.07 million cumulative profiles,
    and a public-market listing on Nasdaq under ticker CAI. The business model is primarily reimbursed clinical testing,
    supplemented by data, discovery, and trial-enablement revenue for biopharma customers.
  foundedDate: "2008-01-01"
  founders:
    - name: "David Dean Halbert"
      role: "Founder, Chairman & CEO"
      background: "Healthcare entrepreneur who previously founded AdvancePCS and later led Caris Diagnostics before launching Caris Life Sciences in 2008."
      claimRefs: [CO006, CO007]
  foundingLocation: "Irving, Texas"
  headquarters: "Irving, TX"
  productSummary: >
    Caris offers comprehensive oncology molecular profiling led by MI Profile, a simultaneous WES+WTS laboratory-developed
    test, plus Caris Assure liquid biopsy, CODEai clinico-genomic analytics, and newer products including Detect,
    ChromoSeq, and MI Clarity.
  customerFocus: "Oncologists, cancer centers, and biopharma research organizations buying reimbursed profiling and data-enabled R&D services"
  businessModel: "Clinical molecular-profiling revenue reimbursed by Medicare, Medicare Advantage, Medicaid, and commercial payers, plus biopharma data, discovery, and clinical-development services"
  stage: "Public"
  fundingStatus: >
    Public since the June 2025 Nasdaq IPO, which contributed roughly $588.4 million of gross proceeds. Historical private
    financing included an approximately $830 million Series D led by Silver Lake, but the public record does not cleanly
    disclose additive lifetime gross capital raised across every earlier round.
  disclosureProfile: public
  claimRefs: [CO001, CO002, CO031, CO034, CE001, CE002, CU001, CU015, CI001, CI008]
