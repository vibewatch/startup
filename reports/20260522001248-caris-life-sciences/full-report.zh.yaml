      - number: '5.4'
        title: 临床证据与平台验证
        blocks:
          - type: paragraph
            body: >-
              Caris 的临床验证项目覆盖四个领域：MCED 表现（Achieve 1）、肿瘤起源 AI 准确率（GPSai）、化疗选择 AI（FOLFIRSTai）， 以及真实世界 EHR 集成收益。Achieve 1
              研究是 Caris Detect 的关键临床数据集。中期读出（发表于 February 2025）报告无症状个体特异性 99.1%——约每 110 次检测出现 1 个假阳性——敏感性则因癌种和分期大幅不同。最终
              Achieve 1 数据发布（May 2026）确认无症状队列 99.1% 特异性，并补充分期敏感性数据。覆盖最多类型的早期癌症（I-II 期）敏感性约 49%，符合早期疾病中循环信号检测的生物学难度。


              GPSai 肿瘤起源识别方面，Caris 用 CODEai 数据库中的 201,612 个临床病例训练模型。独立验证报告，非 CUP 癌症场景准确率 95%，真实 CUP 病例正确识别率
              84%。较早发表的一篇论文（Abraham et al., Translational Oncology, 2021, PMID 33465745）使用 77,044 例的早期训练集，在大多数测试病例上准确率超过
              94%，为如今更大的训练集提供第三方验证锚点。


              FOLFIRSTai 的关键验证发表于 Cancer Research Communications（DOI: 10.1158/1078-0432.CCR-24-3335），显示按 FOLFIRSTai
              预测一致治疗的 mCRC 患者，相比不一致治疗患者，总生存期多 17.5 个月。这是首个发表的、针对一线结直肠癌化疗选择 AI 工具的类前瞻验证，使 Caris 拥有可防御的发表记录。Caris
              披露，使用集成下单的医疗系统平均周转时间改善 2.2 天，支持其 EHR 集成表现。截至 Q1 2026，电子下单超过总订单 70%，覆盖 300+ 家机构和 3,350+ 个临床地点。
