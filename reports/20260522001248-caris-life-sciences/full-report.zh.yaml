      - number: '5.2'
        title: 技术架构与实验室基础设施
        blocks:
          - type: paragraph
            body: >-
              Caris 的技术栈建立在 Illumina 下一代测序硬件、自研生物信息学管线和专门打造的 AI/ML 平台之上。测序骨干依赖 Illumina NovaSeq 6000 和更新的 Illumina
              NovaSeq X Plus 仪器。公司在 10-K 中明确披露，Illumina 是关键测序投入——试剂、流动槽和仪器——的唯一供应商，并把这一点描述为重大集中风险。依赖还延伸到 MI Cancer Seek
              IVD；PMA SSED 将获准检测限制为只能使用 Illumina NovaSeq 6000，形成监管锁定，除非提交新的 PMA 补充申请，否则无法解决。


              实验室运营集中在 Arizona 两处设施。Phoenix 实验室有 66,000 sq ft 用于实体瘤检测，35,500 sq ft 用于血液检测（Caris Assure 和 MI Cancer Seek
              流程）。Tempe 设施提供 59,000 sq ft，专供研发。合计来看，Caris 平台每天处理超过 1 trillion 条测序读段；这一吞吐量使其跻身全球最大临床基因组实验室之列。周转时间基准为组织样本约
              10-14 天、血液样本约 7 天；对已连接医疗系统，EHR 集成平均把 TAT 缩短 2.2 天。


              EHR 集成层把 300+ 家医疗机构、3,350+ 个临床地点接入 Caris 下单工作流，支持电子下单（截至 Q1 2026，超过订单量 70%）并把结果直接送入医生工作流。开发者侧，Caris 在
              github.com/Caris-Life-Sciences 下只有极少公开 GitHub 资产，共三个仓库：Caris-ComBat-seq（RNA-seq 批次校正工具，Jupyter
              Notebook，最后更新 November 2025）、一个 PureCN 分叉（拷贝数分析，R 语言，最后更新 March 2025），以及 link-encryption（JavaScript
              工具，最后更新 March 2025）。有限的开源足迹反映其架构从设计上就是自研封闭：核心 WES/WTS 管线、CODEai 和临床算法均未公开共享。
