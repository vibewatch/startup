              - CO039
          - type: callout
            title: 规模化综合 WES+WTS 构成可防守护城河——但报销决定天花板
            body: >-
              Caris 的竞争位置建立在一个事实之上：它是唯一一家在商业规模上为肿瘤分析同步测序全外显子组和全转录组的提供商。凭借 1,070,000+ 份分子画像、484,000+ 份匹配数据集，以及作为数据飞轮的
              CODEai，公司具备会复利的生物信息学优势，短期内很难复制。但关键战略变量不是技术，而是支付方覆盖和 ASP。CMS 地方覆盖决定（MolDX）和商业支付方合同设定了报销天花板。Medicare LCD
              的任何负面变化、14 天规则下的重大审计发现，或商业支付方采用放缓，都可能迅速压缩收入并逆转利润率轨迹。后续章节应压力测试 ASP 假设和报销管线。
