          - type: callout
            title: DOJ False Claims Act CID 与内部控制重大缺陷
            body: >-
              两个重大负面信号需要立即标出。第一，2025 年 3 月，Caris 收到 DOJ 根据 False Claims Act 发出的民事调查要求（CID），调查其是否遵守 Medicare 14
              天服务日期规则。SEC 工作人员在 2025 年 4 月评论信中明确指出，Caris 对该调查范围披露不足。False Claims Act 违规可能带来追偿、三倍赔偿和被排除出联邦医疗项目——对一家核心收入来自
              Medicare 报销的公司，这是生存级风险。第二，FY2025 10-K 披露财务报告内部控制存在重大缺陷，说明公司的财务基础设施还没有成熟到足以匹配快速收入增长。两个问题都必须作为后续章节的实时尽调事项跟踪。
            calloutType: risk
            claimRefs:
