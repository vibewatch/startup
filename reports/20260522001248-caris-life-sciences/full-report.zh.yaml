      - number: '4.3'
        title: 资本充足度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事比 IPO 前明显更强。截至 December 31, 2025，Caris 持有 $796.3M 现金及现金等价物，以及 $2.3M 短期可出售证券；Q1 2026 资产负债表显示期末现金及现金等价物
              $821.1M、短期可出售证券 $2.3M，现金、现金等价物及受限现金合计 $823.4M。FY2025 和 Q1 2026
              均录得正经营现金流和自由现金流，降低了近期对外部股权融资的依赖，但没有抹掉融资可选性。April 1, 2026，Caris 用 Blue Owl 和 Blackstone 牵头的新高级担保融资包，替换了原
              2023 年融资安排：包括 $400M 初始定期贷款、为收购预留的 $300M 已承诺延迟提款分期，以及最高 $500M 未承诺增量额度。定价为 Term SOFR + 5.00% 或 Base Rate +
              4.00%，加上 $50M 最低合格现金约束条款；以当前现金底座和近期现金生成看可控。$2.5B 累计亏损仍提醒投资者，业务在 2025
              年拐点前消耗过巨额资本。前瞻判断因此是中等融资依赖，而不是急性依赖：按当前运行率，Caris 看起来能靠运营自我供血，但仍保留有意义的信贷后盾，应对 M&A、执行滑坡或报销冲击。
