      - number: '8.2'
        title: 可比公司语境与倍数区间
        blocks:
          - type: paragraph
            body: >-
              筛选来看，Caris 更像一家位于中游的上市肿瘤诊断和数据平台公司，而不是溢价液体活检或 MCED 稀缺资产。按当前报价页，Tempus 和 Veracyte 聚在约 6.6x 收入，Guardant 约
              14.5x，Natera 约 11.6x，GRAIL 约 16.8x，NeoGenomics 约 1.6x。Caris 按股权价值约 5.0x 当前收入、按企业价值约 4.5x，因此低于高增长液体活检和 MCED
              龙头，但仍较低增长服务实验室可比公司有溢价。 这个相对位置合理。Caris 应该较 NeoGenomics 有溢价，因为 FY2025 和 Q1 2026 盈利状况明显更好、增长更快。它也应该较
              Guardant、Natera 和 GRAIL 有折价，因为仍有 DOJ 和报销悬念、上市公司控制问题新鲜存在，且 Detect 刚开始商业化。历史交易语境指向同一方向： Roche 2018 年收购
              Foundation Medicine 证明，战略买家会为已具规模、差异化的肿瘤平台付高价；但 Caris 尚未跨过法律和执行门槛，不能进入当今公开可比组的上层。
