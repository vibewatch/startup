        - id: n5
          label: CODEai AI 解读
          description: CODEai 将患者分型与 484,000+ 病例匹配；GPSai 识别肿瘤起源；适用时 FOLFIRSTai 生成 mCRC 治疗预测；洞察嵌入报告
