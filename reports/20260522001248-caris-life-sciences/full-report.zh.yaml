    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、商业模式与规模
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences, Inc. 是一家下一代精准医疗公司，总部位于 750 W. John Carpenter Freeway, Suite 800, Irving, TX
              75039（电话：866-771-8946）。公司由 David Dean Halbert 于 2008 年创立，在 Texas 注册，归入 SIC code 8071（服务—医学实验室）。公司还在
              Phoenix, AZ、New York, NY、Cambridge, MA、Tokyo, Japan 和 Basel, Switzerland 设有办公室，既体现美国本土规模，也显示国际业务仍处早期。


              商业模式是一套按服务收费的精准诊断与数据平台。Caris 主要替肿瘤医生向 Medicare、Medicaid
              和商业保险方结算分子分析服务，收入受支付方覆盖决定和平均销售价格（ASP）改善驱动。第二条收入线是药企 R&D 服务（FY2025 为
              $45.3M），通过数据授权、伴随诊断和临床试验支持，把同一套临床-基因组数据库卖给生物制药伙伴。临床检测产出数据、数据再撬动药企收入，这个双边平台飞轮就是核心战略逻辑，也是 CODEai AI/ML
              平台的基础。


              Caris 于 2025 年 6 月在 Nasdaq Global Select Market 完成 IPO（股票代码：CAI），净募资约 $519.5M，另通过超额配售权获得 $68.9M，合计约
              $588M。上市时公司市值约 $3.87B。FY2025 总收入为 $812.0M（同比 +97%），毛利率 66%，调整后 EBITDA $137.7M。管理层指引 FY2026 收入为
              $1.0B–$1.02B。截至 2025 年 12 月 31 日，Caris 持有现金 $796.3M，累计亏损约 $2.5B——说明在 2024 年真正出现收入拐点之前，公司经历了很长的盈利前投入期。截至
              2026 年 3 月，累计分子画像超过 1,070,000；FY2025 完成约 199,300 个临床病例。
