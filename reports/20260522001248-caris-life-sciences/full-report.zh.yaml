      - number: '7.2'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              Caris 不是在对抗一个弱赛道；它面对的是多类已具规模且优势根深蒂固的专业玩家。在自己的 10-K 中，Caris 点名 Foundation Medicine 和 Tempus
              参与组织检测竞争，Guardant / Tempus / Foundation 参与血液治疗选择竞争，Grail / Freenome / Guardant / Exact / Delfi
              参与早筛竞争。单凭这一点就足以得出结论：Caris 的增长假设依赖在拥挤品类中夺份额，而不是开辟无人竞争的空白市场。 [CR017] [CR018] [CR019]

              组织和数据平台对手很强。Foundation Medicine 称其已交付超过 1.5 million 份 CGP 报告，并持有超过 50% 获批美国 NGS CDX 适应症；其 FoundationOne
              组织和液体产品均分析 324 个基因，现在还扩展到 RNA。Tempus 叠加 648 基因 xT CDx、全转录组 xR，以及利用 8M+ 去标识化研究记录的 AI / 数字病理栈；同时报告 Q1 2026
              诊断收入 $261.1M，当季总收入 $348.1M。相比 Caris，这些对手要么 CDX 根基更深，要么公开市场规模更大，要么工作流软件集成更重。 [CR020] [CR021] [CR022]
              [CR023]

              液体活检和 MRD 领域，Caris 面对的是商业位置已经确立的竞争者。Guardant 称其已为 12,000 名医生完成超过 500,000 次血液检测，并近期获得 FDA 对新 Guardant360
              Liquid CDx CGP 检测的批准。Natera 将 Signatera 营销为唯一基因组设计 且有 Medicare 覆盖的 MRD 检测，并与 Altera 和 Latitude 组合；这意味着在
              Caris 希望用 Assure MRD 和未来产品切入的监测连续体上， 已有强劲且受报销支持的液体活检竞争。 [CR024] [CR029]

              Caris Detect 带来上行，但也把前瞻叙事风险集中到最难商业化的品类。Caris FY2025 新闻稿将 Detect 描述为 2026 上半年发布；360Dx 则称公司此前暗示 2026
              第二季度发布。最终 Achieve 1 数据方向上强劲，但 GRAIL 已经在营销 Galleri，其假阳性率 0.4%、癌症信号起源准确率 93.4%；GRAIL 自己的 10-K 明确把 Caris
              列为已宣布的 MCED 进入者之一。Exact Sciences 和 NeoGenomics 增加了相邻肿瘤检测规模；这些竞争者不需要 Caris 明显失手就能压缩其份额增益，
              只要执行好既有分发、报销或已发表证据优势即可。 [CR025] [CR026] [CR027] [CR028] [CR030] [CR031] [CR032]
