      - number: '3.5'
        title: 多癌种早筛战场
        blocks:
          - type: paragraph
            body: >-
              多癌种早筛（MCED）仍是早期市场。GRAIL, Inc.（NASDAQ: GRAL）已凭 Galleri 检测建立商业先发优势；Caris Detect 则是计划在 2026
              年上半年商业化发布、但尚未验证的管线进入者。GRAIL 的 Galleri 检测用一次抽血筛查 50 多种癌症，在患者仍无症状时检测癌症信号，假阳性率仅 0.4%（按 GRAIL 说法，是现有 MCED
              检测中最低），并能以 93.4% 准确率预测癌症信号来源。对造成美国三分之二癌症死亡的 12 类癌症，Galleri 的敏感性超过 70%。GRAIL 2025 财年总收入为 $147.2
              million（上一年为 $125.6M），但仍未盈利，并向 Illumina 支付高个位数永久特许权使用费。

              Caris Detect 基于血液全基因组测序，被定位为 Galleri 甲基化路径之外的综合 MCED 替代方案。不过，GRAIL 针对 2025 财年的 10-K 将 Caris Life Sciences
              与 Clearnote Health、Natera 一并列为「已宣布有意开发或推出 MCED 产品」的公司——也就是把 Caris Detect 归为未来威胁，而不是当前市场参与者。根据 GRAIL
              10-K，Guardant Health 也在 2025 年推出 MCED 产品。Caris 在 MCED 领域的竞争风险很高：GRAIL 已在 Lancet、Annals of Oncology
              等顶级期刊发表结果，拥有大量病例对照和干预研究数据，并在 Caris Detect 商业化前就建立了支付方和医生关系。未经验证的 Caris Detect 进入一个已有 GRAIL Galleri、又有
              Guardant Health 和潜在 Natera 进入者的市场，对 Caris 的 MCED 收入预测构成重大负面风险。
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
