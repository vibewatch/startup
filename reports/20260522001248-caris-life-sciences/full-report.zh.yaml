      - number: '1.7'
        title: 展品
        blocks:
          - type: callout
            title: 收入拐点突出，利润率同步扩张
            body: >-
              FY2025 收入 $812M（同比 +97%）、毛利率 66%（较 FY2024 +2,300 bps）和调整后 EBITDA $137.7M 叠加在一起，说明 Caris 已跨过经营杠杆临界点。Q1 2026
              延续这一轨迹：收入 $216.2M（同比 +79%）、毛利率 65%、调整后 EBITDA $26.2M——管理层指引公司迈向第一个 $1B 收入年度（FY2026
              指引：$1.0B–$1.02B）。这种利润率扩张在诊断行业并不常见，反映的是可持续的 ASP 改善，而不是一次性有利项。
            calloutType: strength
            claimRefs:
              - CO019
              - CO021
              - CO022
              - CO024
              - CO025
