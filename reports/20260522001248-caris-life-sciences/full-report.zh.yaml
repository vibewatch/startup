      - number: '5.3'
        title: 监管状态与报销格局
        blocks:
          - type: paragraph
            body: >-
              Caris 采用双轨监管策略：MI Cancer Seek 是获准 IVD（PMA P240010，批准日期 November 5, 2024），而 MI Profile、Caris
              Assure、GPSai、FOLFIRSTai 和 Caris Detect（上市前）均为 CLIA 监管下的实验室开发检测。LDT 策略一直处于监管摇摆中。FDA 在 May 2024 发布最终规则，原本会把
              LDT 分阶段纳入完整医疗器械监管。该规则在 March 31, 2025 被联邦地区法院撤销。随后 FDA 在 September 19, 2025 发布新的最终规则，回到 2024 年前的执法姿态——实际恢复
              LDT 仍由 CLIA 监管、无需 IVD 上市前审查的现状。这一序列留下监管不确定性：未来 FDA 行政班子可能重启 LDT 政策，Caris 的 LDT 产品管线（Caris Detect、MI
              Clarity）依赖该政策维持。


              Medicare 报销方面，综合基因组检测（CGP）在 MolDx LCD L38690 下覆盖晚期实体瘤肿瘤学。Caris MI Profile 已成为 Medicare 对晚期实体瘤患者在临床适用 CGP
              时覆盖的检测。Medicare 贡献了 FY2025 分子检测收入约 39.6%。CMS 全国覆盖决定和 MolDx LCD 共同管理覆盖政策。一个具体监管暴露是：Caris 卷入两起 DOJ FCA 和解，并在
              FY2025 10-K 中披露 Medicare 14-day rule 下新的 DOJ 民事调查要求；这给监管关系留下审计和合规尾部风险（详见第 1 章）。
