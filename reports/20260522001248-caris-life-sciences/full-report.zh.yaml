  - id: TV004
    title: 资本结构或稀释压力表
    columns:
      - 项目
      - 公开披露数字
      - 含义
      - 为什么影响估值
      - 主要缺口
    rows:
      - - IPO 后创始人即时持股
        - ~44.6% 受益所有权
        - 创始人仍是主导控制人
        - 治理集中度可能压低投资者愿意支付的倍数
        - 后续授予后，当前经济权益与投票控制权未在此完全对齐
      - - IPO 后内部人即时持股
        - 合计 ~66.2%
        - 上市流通盘起点受限
        - 流通盘和大股东动态会放大波动，并影响市值解读
        - 后续归属、出售和授予后的最新流通盘，需要更新后的持股表
      - - 未行权期权
        - 21,885,508 股
        - 员工期权稀释压力明显
        - 若行权 / 归属加速，完全稀释每股价值可能低于简单行情页计算
        - 本文使用的公开摘要未完全拆解行权价和归属节奏
      - - 未归属 RSU
        - 4,494,342 股（221,290 个遗留 RSU，加上 2025 计划下 4,273,052 个）
        - 期权之外还有额外稀释
        - 上市公司新增授予可能继续推高完全稀释股数
        - 未来授予的完整预测未公开
      - - 行情页在外股数
        - Investing.com 显示 282.68M 股在外
        - 当前市值的实用分母
        - 即使 SEC 基本股数口径不同，当前市值今天也取决于这个股数
        - 与 IPO 后基本股数的精确对齐仍未完成
      - - IPO 发行机制
        - 出售 23.53M 股基础股份，另有 3.53M 股超额配售权
        - 上市带来现金，也重置了公开流通盘和稀释观感
        - IPO 口径是后续所有股数争论的起点
        - 招股书计算与行情页股数在公开来源中仍无法一一对应
      - - 债务组合
        - $400M 初始定期贷款；$300M 延迟提款 M&A 额度；最高 $500M 增量额度
        - Caris 目前杠杆不高，但未来仍有提款能力
        - 若新增提款没有带来相应收入增长，企业价值会抬升
        - 未来提款时间和 M&A 用途未知
    notes: 本表有意聚焦与估值相关的资本结构项目，而非完整股权结构表，因为公开记录没有给出清晰、当前、完全稀释后的瀑布表。
