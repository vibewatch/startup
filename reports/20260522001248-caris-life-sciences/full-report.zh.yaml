      - number: '1.2'
        title: 产品组合与临床规模
        blocks:
          - type: paragraph
            body: >
              核心商业产品是 Caris MI Profile，这是一项综合分子分析检测，在实体瘤和血液肿瘤组织中，对 23,000+ 基因同步做全外显子组测序（WES）和全转录组测序（WTS）。MI Profile
              是公司的主要收入引擎，也让 Caris 成为唯一一家在商业规模上为肿瘤分析同步覆盖全外显子组和全转录组的提供商。肿瘤医生用 MI Profile
              为晚期癌症选择疗法；生物标志物覆盖更宽，也让它区别于基因面板竞争对手。


              第二个关键商业产品是 Caris Assure，这是一项血液液体活检，使用自研 cNAS（循环核酸测序）技术，把 WES+WTS 扩展到血液中的游离 DNA 和 RNA。Caris Assure 在 FY2025
              产生约 29,000 个病例，Q1 2026 为 9,200 个，采用速度正在加快。一个地域限制是：在 New York State CLEP 实验室批准前，Caris Assure 不能在 New York
              State 销售。Caris ChromoSeq 是面向髓系恶性肿瘤（如 AML、MDS）的综合全基因组分析检测，2026 年获得 MolDX 地方覆盖决定（LCD）批准，Medicare 可报销。Caris
              MI Clarity 是面向早期乳腺癌复发风险的 AI 预后检测，也在 2026 年商业化推出，并复用同一数据平台。


              CODEai 是公司的 AI 和机器学习平台，汇总 484,000+ 份匹配的临床-基因组数据集，支持真实世界数据分析、生物标志物发现和面向生物制药伙伴的 AI 模型开发。Caris Detect
              是一项使用血液全基因组测序的多癌种早筛（MCED）检测，仍在开发中，计划于 2026 年上半年商业化发布，代表公司下一条主要收入催化线。截至 2026 年 3 月 31 日，Caris 已完成
              1,070,000+ 份总分子画像（790,000+ 份匹配画像），仅 Q1 2026 就完成约 52,800 个临床病例。
