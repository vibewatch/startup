      - number: '4.4'
        title: 公开缺口、反向视角与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开证据已经足以说明 Caris 有真实规模、正向现金生成和改善中的报销经济性，但不足以完全承销收入质量和下行暴露。未解决的最大指标是按支付方类型划分的实际 ASP、CAC
              与回本周期、医生复购和队列留存，以及组织与血液流程下的单次检测 COGS。这些省略重要，因为 FY2025 利润率扩张很大一部分由报销推动，而非纯靠量拉动。反向视角也不轻。Caris 披露 March 2025
              DOJ 针对 Medicare 14-day rule 的民事调查要求；Oversight/DOJ 记录显示，公司在 2022 年支付 $2.886M，了结此前与延迟提交做法有关的 False Claims
              Act 指控。FY2025 10-K 还称，截至年末，财务报告内部控制仍存在重大缺陷，原因是复杂会计判断所需合格会计资源不足。合并来看，财务结论正面但带限定：
              业务现在像一个已具规模的精准肿瘤学平台，核心需求质量高，毛利转化改善，流动性充足；但盈利桥仍有一部分不透明，监管和报销风险仍然重要。严肃投资者可以把当前利润率和现金状况视为可信，
              但在按表面值承销耐久性前，仍应要求细化到支付方层面和单次检测的经济性。
