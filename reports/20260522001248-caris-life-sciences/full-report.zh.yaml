  - id: FV001
    title: 多重区间图
    type: range
    layout: wide
    summary: 区间图展示 Caris 当前估值位置：一边是低端诊断可比公司，一边是自身承销区间和更高溢价的液体活检 / MCED 同行。
    data:
      items:
        - label: 低增长诊断下限
          low: 1.6
          mid: 1.8
          high: 2.5
          unit: x
          note: 类似 NeoGenomics 的收入倍数区间
        - label: Caris 悲观区间
          low: 3
          mid: 3.4
          high: 3.8
          unit: x
          note: 若法律或报销压力加剧，下行情景承销区间
        - label: Caris 基准区间
          low: 4
          mid: 4.4
          high: 4.8
          unit: x
          note: 基于 FY2026 收入的当前公允价值承销区间
        - label: Tempus / Veracyte 区间
          low: 6.6
          mid: 6.6
          high: 6.7
          unit: x
          note: AI 赋能或高质量精准诊断上市可比公司群
        - label: 高溢价液体活检 / MCED 区间
          low: 11.6
          mid: 14.5
          high: 16.8
          unit: x
          note: Natera、Guardant 和 GRAIL 当前市值 / 收入区间
