  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与竞争定位
        blocks:
          - type: paragraph
            body: >-
              Caris 提供一个多层诊断平台，覆盖六个已商业化产品和一个近期发布产品。旗舰产品是 Caris MI Profile，这是一项实验室开发检测（LDT），可在实体和液体肿瘤组织中， 对 23,000+
              个基因同步跑全外显子测序（WES）和全转录组测序（WTS）。MI Profile 是公司的主要收入驱动，也是唯一已商业规模化、面向实体瘤分子检测的同步 WES+WTS 产品。组织样本（FFPE）披露周转时间约
              10-14 天；基于血液的 MI Profile 约 7 天出报告。


              Caris Assure 是 MI Profile 的液体活检配套产品，把 WES+WTS 应用于全血来源的循环核酸。Caris 自研白细胞层体细胞 / 生殖系扣除方法（cNAS
              技术）从肿瘤信号中过滤遗传性生殖系变异。Caris Assure 在 FY2025 产生约 29,000 例，Q1 2026 为 9,200 例。关键限制在于：Caris Assure 目前尚未在 New
              York State 提供，仍待 CLEP 实验室批准；这个地域约束影响一个重要肿瘤市场。


              MI Cancer Seek 是 Caris 获 FDA 准入的体外诊断（IVD）：PMA P240010 于 November 5, 2024 获 FDA 批准，覆盖 228 基因 ctDNA
              血液面板，配套诊断适应症 14 项，横跨 NSCLC、乳腺癌、结直肠癌和其他恶性肿瘤。根据 PMA SSED，MI Cancer Seek 必须只在 Illumina NovaSeq 6000（不是更新的
              NovaSeq X）上运行，使其成为公司第一个受 IVD 监管的产品，也为更广泛 CDx 扩张打下监管滩头阵地。


              AI 层包括四个独立引擎。CODEai 汇聚 484,000+ 份匹配患者基因组、转录组和临床记录，每份记录带有超过 1 million 个关联数据点， 用于生成支撑所有下游 AI
              产品和生物制药数据授权的分子智能。GPSai 用该数据库识别肿瘤组织起源，训练集为 201,612 例；在非 CUP 场景准确率 95%，对癌症原发灶不明（CUP）识别准确率 84%。FOLFIRSTai
              是公司第一个经临床验证的 AI 化疗选择工具，用于预测转移性结直肠癌的一线最优治疗； Cancer Research Communications 发表的独立临床验证显示，治疗与 FOLFIRSTai
              指导一致的患者，总生存期提高 17.5 个月。Caris 将 FOLFIRSTai 纳入标准 MI Profile 报告，对符合条件的 mCRC 患者不额外收费。MI Clarity 于 2026
              年推出，是一款针对乳腺癌复发风险分层的计算病理 AI，分析 H&E 切片和临床输入，不需要额外基因组测序。
