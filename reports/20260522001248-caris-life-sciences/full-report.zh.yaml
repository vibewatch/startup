  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences 处在一个多细分市场的精准肿瘤诊断市场。没有单一竞争对手能匹配它的覆盖宽度——在 23,000+
              基因上同步做全外显子组测序（WES）和全转录组测序（WTS）——但多个资本充足的对手在各自细分市场占据主导。竞争格局可分为四层：（1）直接的组织型 CGP 对手，主要是 Foundation
              Medicine（Roche 子公司）和 Tempus AI；（2）液体活检和微小残留病灶（MRD）专家，以 Guardant Health 和 Natera
              为代表；（3）相邻的遗传性癌症检测和结直肠筛查竞争对手，主要是 Myriad Genetics 和 Exact Sciences；（4）仍处早期的多癌种早筛（MCED）战场，GRAIL 的 Galleri
              检测是商业化先行者，Caris Detect 则是尚未验证的管线进入者。

              对多数肿瘤医生来说，现状替代方案是把组织活检送到医院或学术参考实验室（Quest Diagnostics、LabCorp 或机构 CLIA 实验室），做单基因或小面板分子检测。从这种现状切换到 Caris MI
              Profile 这样的综合平台，会带来周转时间风险、医生教育成本和支付方授权工作量；但一旦肿瘤科把某个 CGP 供应商的流程和 EMR 集成嵌入日常，切换并不常见。内部自建（医院运营的 NGS
              实验室）是学术医学中心的替代方案；不过，独立实验室缺少数据规模、监管 CDX 批准和药企合作，难以复制主要纯平台公司的差异化。

              所有战场最终汇聚到同一个战略高地：临床-基因组数据库。每家公司都在尝试把检测量变现为药企数据授权、伴随诊断（CDX）合作和 AI 驱动的生物标志物发现。Caris 的 CODEai 平台（484,000+
              份匹配临床-基因组数据集）、Foundation Medicine 的生物制药服务部门（占美国 NGS CDX 批准超过 50%）和 Tempus AI 的生命科学数据平台（8M+
              份去标识化研究记录），争夺的是同一批药企研究和 CDX 开发预算。
