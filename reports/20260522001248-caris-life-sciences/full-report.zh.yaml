      - number: '6.3'
        title: 生物制药客户、数据产品与渠道扩张
        blocks:
          - type: paragraph
            body: >
              Caris 的非临床客户动作建立在生物制药数据服务、发现合作和临床试验赋能产品之上，这些产品叠在临床检测引擎上。June 2025 S-1/A 称，截至 March 31, 2025，公司有 100+
              个生物制药合作伙伴；当前产品页则把 CODEai、多模态数据和 Right-In-Time trials 定位为主要可变现接口。CODEai 现在被营销为一个真实世界临床-基因组平台，覆盖超过 484,000
              名患者，每名患者超过 1 million 个数据点；Caris 称它帮助研究人员和生物制药公司做靶点识别、临床试验服务，以及产品或商业开发。较早的发布稿明确了目标客户切分：POA
              研究者将该工具用于协作研究，生物制药客户则使用同一数据尾流做发现和开发。


              生物制药侧的公开具名合作伙伴证明强于医院客户基础。Caris 披露 2025 年末与 Genentech 合作发现新型肿瘤靶点，包含 $25 million 前期及近期付款，以及最高 $1.1 billion
              里程碑和权利金。Caris 还在 January 2025 宣布与 Ontada 合作，把 Caris 的基因组和多模态资产，与 Ontada 在社区肿瘤中的真实世界足迹结合起来。Right-In-Time
              trials 将客户旅程延伸到本地试验启动：Caris 称其网络覆盖 610+ 个地点，可在短至 14 天内启动站点，并用临床试验导航员匹配患者、协同肿瘤医生，让患者留在离家近的地方。
              这些资产支持扩张，但生物制药账本的公开收入可见度仍远弱于临床量可见度。
