            sq ft）实验室；吞吐量超过 1T reads/day
        - label: 生物信息管线层
          detail: 变异检出（SNV、indel、CNV、融合）；WES 23,000+ 基因；WTS 23,000+ 转录本；液体检测用 cNAS buffy coat 做胚系扣除；自研闭源算法
        - label: CODEai 数据平台层
          detail: 484,000+ 匹配患者分型资料；每名患者 1M+ 数据点；基因组 + 转录组 + 现实世界临床数据；AI/ML 训练底座； 生物制药数据授权层
        - label: AI 产品层
          detail: >-
            GPSai（肿瘤起源；非 CUP 准确率 95% / CUP 准确率 84%）；FOLFIRSTai（mCRC 化疗；OS 获益 17.5 个月）； MI Clarity（乳腺癌复发；H&E 输入；2026
            推出）；CODEai intelligence
        - label: 临床交付层
          detail: >-
