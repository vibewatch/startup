      - number: '5.5'
        title: 路线图、新产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              Caris 的近期产品路线图锚定两个发布。Caris Detect（全基因组测序 MCED 检测）计划在 H1 2026 商业推出，单次检测约 $3,500。Everlywell 直接面向消费者（DTC）合作在
              2024 年末宣布，为面向消费者的 Caris Detect 下单提供分发渠道，使 Caris 能与 Grail（Galleri）和 Exact Sciences 一起进入 DTC 肿瘤筛查市场。Caris
              Detect 的差异化主张建立在全基因组测序广度上，相比竞争对手使用的甲基化面板方法更宽； 但这种方法差异仍是科学界活跃争论点。MI Clarity 于 2026 年推出，把 Caris 的 AI
              组合延伸到计算病理；它用标准 H&E 切片进行乳腺癌复发风险分层，不需要分子检测，从而把可触达医生群体扩到现有检测客户之外。


              两项结构性技术风险对尽调很关键。第一，Illumina 单一来源依赖是已披露且持续的风险：Illumina 供应测序仪、试剂和流动槽，MI Cancer Seek PMA 锁定 NovaSeq
              6000。Illumina 的定价权、供应中断或平台切换，都会直接影响 Caris 的成本结构、检测质量和推出新 IVD 获准检测的能力。第二，LDT 监管环境确实在摇摆。虽然 September 2025
              FDA 规则恢复了 2024 年前执法姿态，未来政策反转仍会给 Caris Detect、MI Clarity、GPSai 和 FOLFIRSTai 带来显著合规成本——它们都是面向 Medicare 患者营销的
              LDT。研究管线页面提到 MRD 监测、扩展 MCED 和 AI 驱动临床试验匹配，但没有公开具体时间表和里程碑；这给前瞻投资分析留下重要证据缺口。
