      - number: '3.2'
        title: 直接 CGP 与分子分析竞争对手
        blocks:
          - type: paragraph
            body: >-
              Foundation Medicine, Inc.（Roche 全资拥有）是 Caris 最直接可比的竞争对手，也是组织型 CGP 的既有市场领导者。FoundationOne CDx 从 FFPE 组织分析
              324 个基因，并获 FDA 批准，可作为多种靶向疗法和免疫疗法的伴随诊断（CDX）。Foundation Medicine 已交付超过 1.5 million 份患者 CGP 报告，发表超过 2,400
              篇研究文章，并持有美国 NGS 检测所有获批 CDX 适应证的 50% 以上。FoundationOne Liquid CDx 从循环游离 DNA 分析 324 个基因，获 FDA 批准覆盖 311
              个短变异基因、8 个重排基因和 3 个拷贝数改变基因。新推出的 FoundationOne RNA 为 CDx 订单增加 DNA+RNA 融合检测，部分收窄了 Caris 的 WTS 差异化。Foundation
              Medicine 的母公司 Roche 提供全球分销、生物制药 CDX 合作基础设施和资金背书，这是刚上市的 Caris 难以匹配的。

              Tempus AI, Inc.（NASDAQ: TEM）是一家快速增长、AI 驱动的精准肿瘤平台，报告 Q1 2026 收入 $348.1 million（同比 +36.1%），其中诊断收入 $261.1
              million（同比 +34.7%）。Tempus 的 xT CDx 是获 FDA 批准的 648 基因实体瘤加配对正常 DNA 测序面板，覆盖基因数超过 Foundation Medicine 的 324
              基因面板。Tempus 还提供 xR（全转录组 RNA 测序，直接竞争 Caris 的 WTS）、xE（全外显子 DNA 测序）、xF/xF+（105 和 523 基因 cDNA
              面板），以及一组算法检测（HRD、PurIST、IPS）。Tempus 的差异化在 AI：Tempus One 平台把 AI 生成的基因组报告嵌入 EHR 工作流；公司还搭建了多模态数据平台，拥有超过 8
              million 份去标识化研究记录，服务生命科学伙伴。Tempus AI 入选 TIME 2026 年 10 家最具影响力健康与生命科学公司，并于 2026 年 5 月扩大与 Bristol Myers
              Squibb 的战略合作。在 CGP 覆盖宽度上，Tempus 的 xT CDx + xR 组合是最接近 Caris MI Profile 的功能替代方案。

              NeoGenomics, Inc.（NASDAQ: NEO）是一家专业肿瘤诊断参考实验室，提供 500+ 项检测，覆盖 NGS、IHC、流式细胞术、FISH
              和分子检测等主要模态，面向实体瘤和血液恶性肿瘤。NeoGenomics 拥有来自 40,000+ 名独立服务提供者、覆盖 4,000 家医疗机构的 2.2 million 份患者画像，每年交付超过 1.7
              million 项癌症相关检测，其中包括 100,000+ 项 NGS 检测，并在两大洲运营 13 个地点，员工约 2,200 人。NeoGenomics
              跨模态覆盖宽，加上成熟的生物制药服务部门（生物标志物发现、临床试验支持），使其在非 CGP 肿瘤检测中成为可信替代方案；随着其扩大 NGS 产品，也可能成为既有渠道威胁。
