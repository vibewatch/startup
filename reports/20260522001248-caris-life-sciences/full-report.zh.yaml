          - type: paragraph
            body: >
              公开披露在使用量增长和渠道嵌入上最强，在持续性上较弱。抓取到的业绩稿、S-1/A、支付方材料和客户页面，没有披露净收入留存、总收入留存、流失率、续约队列、
              按账户划分的复购频率或头部客户集中度。换句话说，公开文件支持「Caris 拥有需求和工作流规模」这个判断；但不支持「客户基础已有量化长期留存或低账户集中度」这个更强判断。
              公开证明在不同板块之间也不对称。公司更愿意讨论病例量、支付方准入和研究网络规模，而不是披露带合同经济性或量化结果的具名临床账户。


              最清晰的披露依赖不是某个单一具名大客户，而是报销。Caris 自身强调商业、Medicare、Medicare Advantage 和 Medicaid 覆盖广度；
              独立和政府来源则显示，政府报销流程对准入和回款多么关键。DOJ、HHS OIG 和 360Dx 都报道了约 $2.89 million 的和解，涉及被指 Medicare 14-day-rule 计费。360Dx
              还报道 ChromoSeq 获得 MolDx 覆盖，进一步说明 Medicare 相关报销仍是新检测采用的关口。 GenomeWeb 的 JPM 报道显示管理层谈到制药业务增长和未来发布，但也在等待 MolDx
              对即将推出检测的审查。组合来看，支付方政策、报销运营和披露缺口，是尽调中主要的公开客户风险主题。
