      - number: '1.5'
        title: 里程碑、运营增长与财务轨迹
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 的公司历史横跨四十年的相关活动，从 David Halbert 于 1987 年创立 AdvancePCS，到 2025 年 IPO，再到 Q1 2026
              接近盈利。公司的财务轨迹在 2024–2025 年出现台阶式变化，驱动因素是报销改善、ASP 提升和临床病例量增长：FY2023 收入约 $306M，FY2024 为 $412.3M（同比
              +35%），FY2025 达到 $812M（同比 +97%）。毛利率从 FY2024 的 43% 扩至 FY2025 的 66%（+2,300 bps），既体现经营杠杆，也反映支付方组合改善。净亏损从
              $341.4M（FY2023）收窄到 $281.9M（FY2024），再到 $68.1M（FY2025）；Q1 2026 接近盈亏平衡（净亏损 $0.5M），自由现金流为正 $22.5M，调整后 EBITDA 为
              $26.2M。


              临床规模指标进一步印证运营动能：FY2025 约 199,300 个治疗选择病例（同比 +22%），Q1 2026 约 52,800 个病例。截至 2026 年 3 月，累计分子画像超过
              1,070,000，匹配画像超过 790,000，这是 CODEai 和药企 R&D 服务的基础。里程碑表按日期完整覆盖创立、融资、产品、规模、监管和负面事件。2026 年关键监管里程碑包括 ChromoSeq
              获得 MolDX LCD 批准，以及 MI Clarity 商业化发布。管理层 FY2026 收入指引为 $1.0B–$1.02B，意味着首次跨过 $1B 收入并具备可持续规模；但 Q1 2026 销售团队重组和
              DOJ CID 带来的执行风险，让路径更复杂。
