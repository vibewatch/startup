  - id: TV002
    title: 私募或交易可比表
    enumerationScope:
      coverage: partial
      basis: >-
        Public sources support a targeted set of the most usable transaction anchors: Caris's own marketed IPO framing,
        Caris's final prospectus, Roche / Foundation Medicine, and GRAIL's current public MCED context. Other private
        precision-oncology financings are either stale, thinly disclosed, or not directly comparable.
    columns:
      - 参照点
      - 估值锚
      - 重要性
      - 为什么不能直接套用
      - 对 Caris 的启示
    rows:
      - - Caris IPO 营销区间（June 2025）
        - IPO 报道称，按每股 $16-$18 最高约 $5.35B
        - 显示最终定价前，后期 IPO 发行推广方认为市场能消化什么估值
        - 营销区间估值使用的股数口径不同于当前行情页
        - 可作为上限，衡量上市投资者最初被要求以多激进口径给 Caris 定价
      - - Caris 最终 424B4
        - 以 $21 出售 23.53M 股，另有 3.53M 股超额配售权
        - 为实际发行经济性和所有权集中度提供硬公开锚点
        - 仅靠招股书仍无法厘清 2026 市场数据页中的完全稀释在外股数
        - 是 IPO 机制的最佳事实基础，但不能给出唯一无争议的市值数字
      - - Roche / Foundation Medicine (2018)
        - 股权价值约 $2.4B；公司整体价值约 $5.3B
        - 战略买家为规模化综合基因组检测支付了明显溢价
        - 这是 2018 年战略并购，不是 May 2026 的公开市场交易倍数
        - 支持一个判断：若质量得到验证，战略型肿瘤资产可高于上市实验室倍数成交
      - - GRAIL 上市 MCED 背景（May 2026）
        - 仅 $156.12M 收入对应 $2.62B 市值
        - 说明公开市场能给可信 MCED 敞口附上多高期权价值
        - GRAIL 阶段更早，结构上也不同于 Caris 当前收入基础
        - Detect 可边际抬升估值，但 Caris 目前不应按纯 MCED 稀缺资产估值
    notes: 本表混合 IPO 营销口径、实际发行条款、历史战略并购和当前公开 MCED 背景，因为它们分别回应 Caris 估值争论的不同部分。
