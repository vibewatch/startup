      - number: '3.3'
        title: 液体活检与 MRD 竞争对手
        blocks:
          - type: paragraph
            body: >-
              Guardant Health, Inc.（NASDAQ: GH）是晚期癌症液体活检的商业领导者，已为超过 12,000 名医生完成 500,000+ 次血液检测。FDA 最近批准了新版 Guardant360
              Liquid CDx，可从血液做综合基因组分析，直接竞争 Caris Assure。Guardant360 CDx 是循环游离 DNA
              检测，可在不做组织活检的情况下分析实体瘤基因组；对组织获取受限的患者来说，这是关键流程优势。Guardant Health 还提供 Shield（结直肠癌筛查血液检测）和 Guardant
              Infinity（下一代 MRD 与治疗反应监测平台，InfinityAI）。相较 Caris Assure，Guardant
              的核心优势是商业成熟度更高、多年液体活检市场开发沉淀出的医生关系，以及可能更容易放大报销的纯血液检测商业模式。Caris Assure 的 WES+WTS 血液分析在技术上比 Guardant360
              的靶向面板更全面，但 Guardant 更早的 FDA 批准和更广的医生采用，构成了有意义的分销护城河。

              Natera, Inc.（NASDAQ: NTRA）是全球细胞游离 DNA（cfDNA）检测领导者，覆盖肿瘤、女性健康和器官健康。在肿瘤领域，Natera 产品组合包括：Signatera（基于肿瘤信息的个性化
              MRD 检测，使用原发组织做全外显子组或全基因组测序，截至 2025 年已获 Medicare 覆盖）；Altera（肿瘤基因组分析，可从同一组织样本中与 Signatera
              一起或单独下单）；Latitude（无组织 MRD 检测）；Empower（胚系遗传性癌症检测）。Natera 发表了 400+ 篇同行评审论文，并运营 CLIA 认证、CAP 认可实验室。按 Natera
              自身说法，Signatera 是获得 Medicare 覆盖的「唯一按基因组设计的 MRD 检测」，这给它在 MRD 监测中的报销优势。Natera 在液体活检肿瘤分析（Altera）上与 Caris
              Assure 竞争，也作为另一种综合 CGP 路径与 Caris MI Profile 竞争。GRAIL 针对 2025 财年提交的 10-K 将 Natera 与 Caris、Foundation
              Medicine、Guardant 和 Tempus 一同列为 CGP 竞争对手，说明行业普遍认可 Natera 正在扩大肿瘤诊断版图。
            claimRefs:
