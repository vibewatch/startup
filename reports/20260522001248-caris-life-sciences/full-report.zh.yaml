      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              近期主要增长驱动，是 NCCN 临床指南把综合生物标志物检测扩展到更多癌种和治疗线。NCCN 指南提及对肿瘤医生就是需求信号：一旦指南纳入某项生物标志物检测，支付方覆盖通常会跟进。CMS NCD
              90.2（2018 年 3 月 16 日生效）提供了 Medicare 覆盖的基础框架，要求 NGS 检测获得 FDA 批准或许可，作为患者特定癌症的伴随诊断。Caris 的 MI Cancer
              Seek（MCS）检测于 2024 年 6 月获得 FDA CDx 批准，形成锚定报销路径。ChromoSeq 于 2026 年 5 月获得 MolDX 地方覆盖决定（LCD），进一步扩大 Medicare
              对髓系恶性肿瘤（AML、MDS、MPN）的报销。更广义的肿瘤药物上市节奏——全球平均每年 25 个新的活性肿瘤药物成分——扩大了需要分子伴随诊断的可靶向改变池，直接抬高 Caris 的相关病例量。


              主要采用约束都与报销有关。DOJ 按 Medicare 14 天规则发起的 False Claims Act 调查（2025 年 3 月收到民事调查要求）是一个活跃负面信号：如果 CMS 认定 Caris
              按服务日期规则违规计费，公司可能面临追偿、罚款，并需要调整计费流程。商业支付方覆盖分散在 90+ 份单独谈判的合同中，每份合同都有不同的预授权要求和覆盖限制。New York CLEP
              限制把一个重要都会市场排除在液体活检销售之外。更长期看，多癌种早筛市场（Caris 估计为 $100 billion）还没有成熟的 CMS 报销路径，商业化时间表高度不确定，取决于临床验证研究结果和监管决定。
