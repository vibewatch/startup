      - number: '3.6'
        title: 护城河耐久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              Caris 抵御竞争替代的主要护城河包括：（1）数据规模和匹配临床-基因组数据库（截至 2026 年 3 月，1.07M+ 总分子画像、484,000+
              份匹配数据集），形成耐久的药企数据授权优势，小型竞争对手难以快速复制；（2）WES+WTS 组合宽度，目前在商业规模上独一份——Tempus 的 xT CDx + xR
              组合是最接近的替代品，但需要分开下单；（3）建立在十年 Medicare、Medicaid 和商业支付方谈判之上的报销基础设施；（4）CODEai AI/ML 平台，它把检测量转化为药企 R&D
              收入，方式包括真实世界数据、生物标志物发现和临床试验匹配。

              威胁 Caris 护城河的主要竞争替代向量包括：（a）Foundation Medicine 的 FDA CDX 伴随诊断锁定——当某个药物的 FDA 批准处方信息明确要求 FoundationOne CDx
              用于患者选择时，无论 Caris MI Profile 技术覆盖多宽，肿瘤医生都不能替换；（b）Tempus AI 嵌入 EHR 的 AI 平台（Tempus One），把下单流程和 AI
              生成的临床洞察直接嵌进医生实践，随着时间推高粘性和切换成本；（c）Guardant Health 与 12,000+ 名医生建立的液体活检关系，可能在 Caris Assure 达到相当规模前先吃掉新增液体
              CGP 需求；（d）GRAIL 在 MCED 筛查市场的先发优势，而 Caris Detect 尚未商业化发布。

              对已把 Caris MI Profile
              深度嵌入流程的肿瘤医生来说，切换成本包括：报告格式变化、生物信息学管线重新验证、临床人员再培训，以及账单和物流合同重谈。不过，如果肿瘤医生会按肿瘤类型或检测适应证在多家供应商之间并用，切换成本就更低。多供应商并用风险在液体活检中最高，同一诊所可能按不同适应证同时下单
              Guardant360 和 Caris Assure。Caris 竞争位置的主要负面信号是 Foundation Medicine 已深度扎根的 CDX 版图：美国获批 NGS CDX 适应证中超过 50% 指定
              FoundationOne CDx 为必需检测，这对 Caris MI Profile 在伴随诊断指导治疗选择中的可服务市场形成结构性上限，除非 Caris 为每一个对应药物单独争取 CDX 批准。
            claimRefs:
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
      - number: '3.7'
        title: 展品
        blocks:
          - type: callout
            title: Foundation Medicine CDX 锁定效应是 Caris 的结构性市场天花板
            body: >-
              Foundation Medicine 持有美国所有获批 NGS 伴随诊断（CDX）适应证的 50% 以上。当某个药物的 FDA 批准处方信息把 FoundationOne CDx
              指定为患者选择所需伴随诊断检测时，肿瘤医生不能用 Caris MI Profile 替代——无论 Caris 的基因组覆盖更宽，或临床效用主张更强。这种结构性排除压缩了 Caris 在每个 CDX
              门控药物上的可服务市场；随着更多药物带着 FMI 专属 CDX 标签获 FDA 批准，限制还会随时间叠加。
            calloutType: risk
            claimRefs:
              - CP008
              - CP035
          - type: callout
            title: Caris Detect 进入 MCED 市场时缺少比较性临床证据
            body: >-
              GRAIL 的 Galleri 检测已经商业化，有 Lancet 和 Annals of Oncology 论文支持，假阳性率 0.4%，癌症信号来源准确率 93.4%。Caris Detect 计划在 2026
              年上半年用全基因组测序路径商业化发布，但尚未发表任何与 Galleri 头对头比较的临床数据。GRAIL 的 10-K 明确把 Caris 识别为未来 MCED 进入者，而非当前商业参与者。如果没有可与
              Galleri 多年临床证据包相当的已发表敏感性和特异性数据，Caris Detect 将面临显著的支付方覆盖和医生采用障碍。
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
              - CP033
          - type: callout
            title: Caris 的匹配临床-基因组数据库是耐久的药企变现资产
            body: >-
              Caris 拥有 484,000+ 份匹配临床-基因组数据集，为 CODEai 平台供能。这套数据库用了十年才在商业规模上搭成，新进入者无法快速复制。FY2025 药企 R&D 服务收入 $45.3M
              已证明可以变现；数据飞轮——更多检测产生更多匹配数据，吸引更多药企合作，再反向补贴临床检测量——就是长期竞争优势的结构基础。
            calloutType: strength
            claimRefs:
              - CP003
              - CP034
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Caris 围绕同一套肿瘤数据和实验室栈变现两类收入。分子检测服务是核心引擎：FY2025 分子检测收入为 $766.7M，约占总收入 94%；Q1 2026 分子检测收入为
              $210.8M。制药研发服务规模小得多，FY2025 为 $45.3M，Q1 2026 约 $5.4M，但管理层仍把该板块 FY2026 指引给到 $75M-$85M。公开记录因此支撑一个判断： Caris
              目前的收入质量仍主要靠临床检测驱动，而不是靠平台授权驱动。10-K 也把收入确认机制说清楚了。分子检测收入在检测结果交付给开单医生时确认；
              交易价格则受可变对价、隐含价格让步，以及不同支付方组合的历史回款约束。也就是说，报表增长是真实的，但不等于标价增长。Medicare 覆盖患者贡献了 FY2025 分子检测收入约 39.6%；Caris
              称其进入大多数主要商业支付方网络，并与覆盖 200 million 名参保人的 100+ 个 医疗计划合作；CMS 费用表以及 LCD/NCD 规则仍限定报销天花板。公开缺口在于，不同支付方类型的实际 ASP
              仍未披露，所以最强的收入趋势可观察，但还无法完全拆解。
