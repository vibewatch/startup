  - id: FV003
    title: 估值与增长图
    type: quadrant
    layout: standard
    summary: 把 Caris 和选定上市同行放在「短期增长耐久性」与「估值丰厚度」两个序数轴上。Caris 位于低增长诊断实验室和高溢价液体活检 / MCED 公司之间。
    data:
      xAxis: 短期增长耐久性（低 → 高）
      yAxis: 估值丰厚度（低 → 高）
      points:
        - id: caris
          label: Caris
          x: 6
          'y': 5
          tone: neutral
          detail: FY2026 指引意味着 23%-26% 增长；当前估值约为 5.0x 收入和 ~4.5x EV / 收入
        - id: tempus
          label: Tempus
          x: 8
          'y': 6
          tone: positive
          detail: Q1 2026 收入 +36.1%；市值 / 收入约 6.6x
        - id: guardant
          label: Guardant
          x: 8
          'y': 9
          tone: neutral
          detail: Q1 2026 收入 +48%；高溢价液体活检倍数约 14.5x
        - id: veracyte
          label: Veracyte
          x: 5
          'y': 6
          tone: neutral
          detail: 当前报价页收入倍数约 6.7x
        - id: natera
          label: Natera
          x: 7
          'y': 8
          tone: positive
          detail: MRD 领导者，市值 / 收入约 11.6x
        - id: neo
          label: NeoGenomics
          x: 4
          'y': 2
          tone: adverse
          detail: Q1 2026 收入 +11%；低增长实验室可比公司约 1.6x
        - id: grail
          label: GRAIL
          x: 3
          'y': 10
          tone: neutral
          detail: 尽管收入基数小得多，MCED 稀缺性溢价仍约 16.8x
    approximationNotes: x/y 分数是基于保留增长披露和当前估值读数做出的序数分析判断，不是数学标准化因子模型。
