      - number: '1.3'
        title: 管理层、董事会与治理
        blocks:
          - type: paragraph
            body: >
              David Dean Halbert（70 岁，名誉 D.Sc.）是 Caris Life Sciences 的创始人、董事长兼 CEO，自公司 2008 年创立以来一直任职。Halbert
              是连续医疗健康创业者，他的履历支撑了公司相当一部分可信度：1987 年，他创立药品福利管理公司 AdvancePCS，并将其做成数十亿美元业务，2004 年以约 $7.5 billion 出售给
              CareMark。之后他担任 Caris Diagnostics CEO（2005–2011），该公司以 $725M 出售给 Miraca
              Holdings，为他后来建设分子分析公司释放了资本和精力。Halbert 在医疗服务和报销上的经验，与 Caris 的上市路径高度贴合。关键人风险偏高：公开资料没有指定 CEO 接班计划，Halbert 的兄弟
              Jon S. Halbert 也在董事会任职，家族治理色彩值得尽调。


              高管团队补上了机构化深度。Brian J. Brille（65 岁）自 2018 年 1 月起担任副董事长兼 EVP，曾在 BofA Merrill Lynch（1999–2013）担任亚太区董事长 /
              总裁和医疗健康投行负责人，资本市场经验很深。David Spetzler, Ph.D.（50 岁）自 2016 年 11 月起任总裁，是平台的科学共同架构师；他于 2009 年 8 月以高级科学家身份加入，并在
              Arizona State University 获得分子生物学和商业方向的 MS、PhD 与 MBA。Luke Power（44 岁）自 2023 年 2 月起担任 SVP、CFO 和 CAO，2011 年
              12 月加入 Caris，是 Chartered Accountants Ireland 资深会员，此前在 PricewaterhouseCoopers 任职（2002–2011）。J. Russel
              Denton 自 2022 年 9 月起担任 SVP 兼总法律顾问，毕业于 Stanford Law，曾是 Shearman & Sterling LLP 合伙人（2018–2022）。


              根据 2026 年 4 月 DEF 14A 代理文件，董事会由 10 名董事组成，Peter M. Castleman（J.H. Whitney & Co.
              前董事长兼管理合伙人）担任首席独立董事。其他值得关注的董事包括 Lloyd B. Minor, M.D.（Stanford School of Medicine 院长）、David
              Fredrickson（AstraZeneca 肿瘤 EVP）和 Jeffrey Vacirca, M.D.（New York Cancer & Blood Specialists CEO；OneOncology
              联合创始人）。Halbert 家族成员集中（David 任 CEO、Jon 在董事会）以及 AdvancePCS 校友集中（Brian Brille、Laura Johansen、Danny
              Phillips），说明治理圈层关系紧密。
