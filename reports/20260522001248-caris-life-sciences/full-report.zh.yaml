        - 股价 $45.19；市值 $3.61B
        - 当前收入 $541.74M
        - 6.7x
        - 对高于 Caris 交易、已盈利的精准诊断平台有参考价值
        - 行情页收入是当前数据，但本章未纳入 May 2026 的直接增长披露
      - - Natera / NTRA
        - 股价 $203.69；市值 $29.09B
        - 当前收入 $2.50B
        - 11.6x
        - 证实 MRD 和监测龙头仍能拿到上市市场溢价倍数
        - Caris 目前缺少 Natera 在 MRD 和监测上的根基
      - - NeoGenomics / NEO
        - 股价 $9.11；市值 $1.19B
        - 当前收入 $745.97M；Q1 2026 收入 $187M，+11% YoY
        - 1.6x
        - 给低增长上市可比公司提供实用的诊断实验室下限
        - Neo 是低增长、低倍数的服务实验室参照，不是完全匹配的 AI 肿瘤学同业
      - - GRAIL / GRAL
        - 股价 $67.86；市值 $2.62B
        - 当前收入 $156.12M
        - 16.8x
        - 显示市场能给 MCED 期权价值加多高的稀缺溢价
        - MCED 仍处更早阶段，盈利性远低于 Caris 的核心检测业务
    notes: 当前倍数直接取自截至 accessDate 的行情页市值 / 收入读数，并非对同业完整调整后的 EV 倍数。Caris EV 另按其 March 31, 2026 资产负债表桥接。
