      - number: '8.3'
        title: 情景估值桥与回报测算
        blocks:
          - type: paragraph
            body: >-
              我们的基准情景按 FY2026 收入 $1.00B-$1.02B、4.0x-4.8x EV/收入给 Caris 估值；加回净现金后，对应约 $4.4B-$5.3B 股权价值。悲观情景使用
              3.0x-3.8x：若法律、报销或执行压力把 Caris 推向质量较低的诊断桶，股权价值约 $3.4B-$4.3B。乐观情景使用 5.5x-6.5x：若 Caris
              能解决法律叙事、补救控制缺陷、守住报销，并展示早期 Detect 牵引力，让投资者更愿意像 Tempus 或 Veracyte 那样定价，股权价值约
              $5.9B-$7.4B。以当前报价页股数作为实际分母，这些区间对应每股约 $12-$15（悲观）、$15.8-$18.8（基准）和
              $21.5-$26.3（乐观）。也就是说，今天报价不是困境异常值；它已经落在基准区间内。机会真实存在，但不深。 投资者获得的是适度基准上行，作为承担多个未解承销问题的补偿。
