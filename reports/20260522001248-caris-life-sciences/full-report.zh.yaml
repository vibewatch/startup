  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 位于肿瘤诊断、精准医疗和生物制药数据服务的交叉点。相关市场最好按诊疗连续体层级界定，而不是压成一个诊断品类。Caris
              明确瞄准四层：（1）癌症治疗选择——当前商业核心，医生用分子画像为患者匹配靶向治疗和免疫治疗；（2）多癌种早筛（MCED），这是一个规模大但仍处商业化前期的市场，用基于血液的全基因组测序，在无症状人群中筛查癌症信号；（3）微小残留病灶（MRD）追踪和治疗监测，分子检测用于评估治疗后残留病灶负担或监测复发；（4）生物制药和数据服务，Caris
              授权临床-基因组数据集，并为药企伙伴推进伴随诊断开发和临床试验项目。


              美国发病基数很大：SEER Program 估计 2026 年新增癌症病例 2,114,850 例，其中肺癌（229,410 例新增）和结直肠癌（158,850 例新增）合计约占总发病数的
              18%。所有癌症五年相对生存率目前为 70.5%，部分反映分子指导疗法的采用，也创造出一批不断扩大的长期幸存者，未来可能需要 MRD 监测。Caris 尚未商业化覆盖（早筛
              MCED）或仅部分竞争（竞争对手的传统单基因或热点位点面板）的相邻支出类别，不计入当前可服务可获取市场，但代表管线选择权。Caris 组织型 MI Profile 的替代方案包括 Foundation
              Medicine（Roche）、Tempus 和 Guardant Health 的靶向 NGS 基因面板；这些面板更便宜，但捕获的分子信息更少，属于性能与成本的权衡，而不是彻底的技术替代。
