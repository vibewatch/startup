      - number: '8.4'
        title: 风险折价、稀释压力与结论
        blocks:
          - type: paragraph
            body: >-
              现在的估值争论是质量和耐久性，不是生存。委托书披露显示，未行权期权 21.9M、RSU 约 4.5M；招股书则让创始人 David Halbert 持有约 44.6% 股权，内部人士约
              66.2%。仅这一点就意味着，稀释后股本、治理折价和可能的流通盘动态都需要明确处理。 业务也仍带有真实法律和报销折价：2022 年 14-day-rule 和解、后续公开文件披露的仍在进行 CID、未解决
              ICFR 重大缺陷，以及对支付方敏感的分子检测收入结构，都使 Guardant 或 Natera 式溢价为时尚早。Detect 和 ChromoSeq 带来上行可选性，但 Detect
              商业化仍早，ChromoSeq 仍是增量而非改变投资逻辑。总体上，Caris 应获得公平的中游倍数，而不是溢价英雄倍数。我们的立场是持有 / 回调时选择性增持。 按当前 EV
              测算，股票不算明显昂贵，但安全边际太薄；在 DOJ 范围、精确股数、支付方质量指标和 Detect 上市后证据更清晰前，不足以给出激进判断。
