      - number: '1.4'
        title: 资本形成、投资人和债务
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 在 2025 年 IPO 前已积累大量私募资本。公司在 17 年私有化历史中完成多轮优先股融资，Series A 到 Series F 的清算优先权合计约 $1.79
              billion。最大一轮是 Series D（约 $830M 投资，由 Silver Lake Partners 领投，2021 年 9 月宣布），这是公司历史上最大一笔私募机构投资，为推动 2024–2025
              年收入拐点的临床能力建设提供了规模资本。


              2023 年，Caris 与 Sixth Street Specialty Lending 签订 $400M 定期贷款。2025 年 6 月，公司完成 Nasdaq IPO，净募资约
              $519.5M，加上超额配售权带来的 $68.9M，总 IPO 资本约 $588.4M——这是有记录以来规模最大的精准医疗 IPO 之一。截至 2025 年 12 月 31 日，现金为 $796.3M（包括
              IPO 募资）。Q1 2026，Caris 用 Blue Owl Capital 和 Blackstone 牵头的新融资安排再融资 $400M 定期贷款，拉长期限并改善条款。Q1 2026 末现金约 $821M。


              整体资本图景显示，公司在漫长的盈利前阶段重金投入（截至 2025 年 12 月 31 日累计亏损 $2.5B），2024–2025 年跑出经营杠杆，现在已经产生正的调整后 EBITDA
              和自由现金流。从私有公司走向上市的过程中，未披露创始人老股出售；按当前收入规模（FY2025 收入 $812M、调整后 EBITDA $137.7M）看，公司债务水平（$400M）可控。
