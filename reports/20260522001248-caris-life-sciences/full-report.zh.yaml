        - 要求提供按收入划分的付款方结构、拒付率、按付款方类别划分的 ASP，以及 PAMA 敏感性
      - - Epic、OncoEMR 和其他 EHR 集成
        - 工作流粘性取决于第三方集成采用和成功上线
        - 嵌入式下单可以加速重复使用，但渠道层面的流失未披露
        - 要求提供活跃集成账户、实施待履约订单和集成后订单提升
      - - Precision Oncology Alliance 和 CODEai 研究网络
        - 声望和论文产出可能高于已货币化、可持续的收入可见度
        - 研究网络规模提升证据质量，但货币化和续约仍不清楚
        - 要求区分付费与赞助活动、站点层面参与度，以及从网络使用转化为收入的情况
      - - Right-In-Time 试验网络
        - 赞助方需求和站点激活待履约订单未公开量化
        - 试验赋能可能加深关系，但量级可能不稳定且依赖合作伙伴
        - 要求提供活跃赞助方数量、每站点开放试验、入组转化率，以及按季度划分的待履约订单
      - - 具名生物制药合作
        - Genentech 和 Ontada 证明相关性，但头部账户集中度和续约条款未披露
        - 若合同节奏变化或里程碑确认延迟，合作伙伴叙事可能夸大可见度
        - 要求提供前五大生物制药账户、合同期限、续约状态和递延收入节奏
      - - Medicare 计费合规
