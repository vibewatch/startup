      - number: '1.6'
        title: 风险、负面信号与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 在 2026 年 3 月 3 日提交的 FY2025 10-K
              年度报告中，披露财务报告内部控制存在重大缺陷。这是重要的治理和运营风险，说明公司的财务报告基础设施没有跟上增长速度，也让历史财务数据可靠性存在不确定性。对一家已经上市、受 SOX 302/404
              约束的公司来说，这一重大缺陷尤其值得关注。


              更急迫的是，2025 年 3 月，Caris 收到 U.S. Department of Justice 根据 False Claims Act（虚假申报法）发出的民事调查要求（CID），事涉公司是否遵守
              Medicare 服务日期（14 天）规则。14 天规则决定实验室检测何时可以单独计费、何时必须与住院费用打包。违反该规则可能引发追偿、罚款和声誉损害。SEC 本身也在 2025 年 4
              月给公司的评论信中标出这一风险，指出公司对调查范围披露不足，并要求在 S-1 中加强披露。


              其他重大风险包括：（1）关键人和家族集中风险——David Halbert 是唯一创始人兼 CEO，其兄弟 Jon Halbert 是非独立董事，且未披露接班计划；（2）Caris Assure 在 New
              York State 受 CLEP 批准限制，无法进入美国人口最密集市场；（3）收入集中（FY2025 约 94% 来自分子分析），对 Medicare 报销费率变化敏感；（4）累计亏损
              $2.5B，反映打造临床规模分子分析所需的重资本投入——业务已转正，但自由现金流仍会持续受到审视。后续章节应优先尽调 DOJ CID、报销轨迹和 ASP 可持续性。
            claimRefs:
