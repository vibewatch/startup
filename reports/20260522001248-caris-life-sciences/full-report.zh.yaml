  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 临床客户结构、订单流与支付方层级
        blocks:
          - type: paragraph
            body: >
              Caris 的核心商业动作仍是由肿瘤医生为癌症患者开具临床分子检测，而不是直接面向消费者（DTC）检测。公司描述合格患者样本由开单医生提交，用于治疗选择检测；
              公开运营数据也确认，这条医生驱动渠道已经具备规模。June 2025 提交的 S-1/A 称，截至 March 31, 2025，Caris 拥有 5,550+ 名定期下单肿瘤医生、90+ 个支付方报销合同，约
              60% 订单为电子下单。到 2026 年一季度，管理层称平台支持超过 6,100 名下单肿瘤医生，超过 70% 订单经 EHR 和门户渠道流转。临床量仍是最主要的公开采用证明：Caris 报告 FY2025
              治疗选择病例约 199,300 例，Q1 2026 为 52,800 例。


              经济上，公开买方 / 使用者 / 支付方层级是分开的。主治肿瘤医生是运营买方和工作流所有者，患者是治疗选择输出的受益人，报销来自广泛支付方基础，而不是少数具名企业账户。 Caris
              称其进入大多数主要商业支付方网络，拥有全国 Medicare 和 Medicare Advantage 覆盖，覆盖超过 200 million 名参保人，与 100+ 个医疗计划合作，并有 12+ 个州
              Medicaid 计划覆盖 MI Cancer Seek。由于公开披露强调支付方合同和覆盖广度，而不是具名医院系统收入集中度， 公开记录中报销暴露比单一客户暴露更清晰。
