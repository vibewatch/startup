  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前市场语境与 IPO 定位
        blocks:
          - type: paragraph
            body: >-
              截至 May 22, 2026，直接报价页面显示 CAI 约 $15.94 / 股，市值 $4.51B，流通股 282.68M。相对于 March 31, 2026 的现金、现金等价物及受限现金
              $823.4M，加上 April 新再融资下 $400M 初始定期贷款，隐含企业价值约 $4.09B，约为 FY2026 收入指引中点的 4.0x。这比任何单一 IPO 标题都更有用，因为 IPO
              本身曾被多种方式表述。June 2025 营销区间指向每股 $16-$18、估值最高 $5.3B-$5.35B；最终招股书则以 $21 定价 23.53M 股，并有 3.53M 股超额配售选择权；FY2025
              10-K 后续披露 IPO 募资净额为 $519.5M。实际情况是，Caris 现在交易价低于 IPO 价格，但股权价值仍高度取决于使用当前报价页股数、发行后基本股数，还是更完全稀释股数。正确结论不是某个 IPO
              标题错了，而是股数精度是 Caris 的一个活跃估值变量，应作为尽调事项处理，而不是既定事实。
