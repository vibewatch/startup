      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              多个外部视角共同框定市场机会。若按宽口径定义全球下一代测序市场，Allied Market Research 估计 2023 年基数为 $12.98 billion，并预测到 2035 年增长至 $97.81
              billion，CAGR 为 18.3%。MarketsandMarkets 口径更窄，预测全球 NGS 市场到 2031 年为 $27.14 billion，隐含 CAGR 为
              14.5%。综合基因组分析（CGP）子市场最直接对应 Caris 的 MI Profile；GlobeNewswire 分析师共识预计其到 2030 年达到 $10.1 billion，CAGR 为
              15.6%。全球癌症药物支出可作为需求侧代理指标，IQVIA 数据显示 2024 年为 $252 billion，并预计 2029 年达到 $441 billion。North America 占全球 NGS
              市场份额超过 46.5%，进一步把 Caris 的机会集中在本土。


              Caris 委托 Nephron Research LLC 做出的估计认为，美国肿瘤总 TAM 约为 $150 billion：早筛 $100 billion、MRD/监测 $28 billion、数据服务
              $10 billion、生物制药服务 $4 billion、治疗选择 $8 billion。关键尽调提醒：这些估计由公司委托，覆盖的市场大多尚未充分商业化（尤其是 $100B
              早筛数字），且没有独立证据交叉验证。隐含的治疗选择 TAM 为 $8 billion，与 Caris FY2025 分子分析服务收入 $767 million 在结构上相符——说明 Caris
              在快速规模化第一年，已经拿下当前聚焦 TAM 约 9.6%。不过，全球癌症诊断市场（所有模态）约为 $168.6 billion（2020 年），到 2028 年增长至 $280.6
              billion；这也提示，NGS/CGP 仍只是肿瘤诊断总支出中的少数，短期还要面对影像、病理和液体活检竞争对手的份额竞争。
