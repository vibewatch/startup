      - number: '7.3'
        title: 运营、数据与平台风险
        blocks:
          - type: paragraph
            body: >-
              即便没有披露重大事故，公开披露也支持一个有分量的运营风险判断。Caris 10-K 网络安全章节称，业务存储敏感患者基因组、保险和其他健康信息，并警告网络安全事件可能导致系统不可用、
              数据丢失或未经授权披露、诉讼、调查和强制通知。同一文件称，Caris 或供应商系统遭破坏，或未能遵守不断演进的隐私和数据安全法律，可能触发罚款、业务中断、
              声誉损害和收入损失。对于一家价值主张依赖可信处理基因组数据的精准肿瘤公司，隐私失败会同时伤害临床收入和制药数据变现。 [CR035] [CR036] [CR037]

              AI 风险也明确披露，而不是只能推断。10-K 称 Caris 使用 AI/ML 辅助诊断和获益预测决策，并承认模型训练、输入、输出或逻辑中的偏差或不准确，
              可能让个人处于不利位置，并使公司暴露于声誉、监管或法律损害。Caris Detect 最终 Achieve 1 发布稿把 MCED 检测定位为 AI
              赋能全基因组产品，但公开证据仍未披露亚组表现、上市后校准，或在真实筛查工作流中与 Galleri 的头对头证据。因此，模型治理质量是现实的尽调问题，不只是抽象伦理备注。 [CR032] [CR033]
              [CR038]

              供应商集中度进一步压缩执行容错。10-K 称 Caris 依赖有限或唯一供应商提供测序仪、试剂、实验室材料和其他投入，且可能无法快速替换。 这一点对 Caris
              比对软件公司更重要，因为公司同时在运行规模化临床检测、发布新检测，并捍卫报销经济性。如果关键测序或试剂投入收紧，管理层没有太多空间同时吸收运营中断和报销波动。 [CR039]
