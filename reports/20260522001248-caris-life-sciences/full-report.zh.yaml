      - number: '6.2'
        title: 具名证明、提供方工作流嵌入与联盟证据
        blocks:
          - type: paragraph
            body: >
              最强的公开客户证明不是一长串带量化结果的具名医院合同，而是联盟参与、工作流嵌入和少数具名机构引用的组合。Caris 将 Precision Oncology Alliance 描述为一个协作研究网络，包含 99+
              家机构和研究联盟，其中有 45+ 家 NCI 指定癌症中心。2025 S-1/A 显示，截至 March 31, 2025 仍有 96 名成员；而 Q1 2026 会议纪要称 UC San Francisco
              在该季度成为第 100 名成员。BioSpace 对 ASCO 2025 的报道补充了网络内持续使用的证据，提到 16 个肿瘤类型中有 37 个 Caris/POA 合作者摘要。


              具名机构证明比网络规模暗示的要薄。CARTI 是抓取材料中最清晰的公开客户证明见证：它称加入 Caris POA 将为 Arkansas
              患者带来先进精准肿瘤工具和研究机会，且无需离开本州。工作流嵌入比客户结果披露更可见。Caris 与 Epic 的合作把下单和结果放入 Epic 的 ORA 网络，Caris 称 Epic 客户约代表美国 60%
              肿瘤医生。另外，Caris 称其 OncoEMR 集成让 800+ 个癌症护理地点的 2,000+
              名临床医生可以使用检测。合并来看，这些信号说明运营部署真实存在，但对大多数癌症中心而言，仍未披露账户级留存、合同规模或基于结果的续约证明。
