      - number: '4.2'
        title: GTM 代理指标、销售效率与成本结构
        blocks:
          - type: paragraph
            body: >-
              对一家历史上私营的精准肿瘤学公司，Caris 给出了罕见强的公开牵引力，但仍没有披露核心销售效率算式。FY2025 临床治疗选择病例达到 199,300，Q4 2025 为 52,700，Q1 2026 为
              52,800，其中包括 9,200 例 Caris Assure。第三方 Q1 覆盖给出最有用的 GTM 代理指标：Investing 报道临床 ASP 为 $3,996，销售辖区从 82 扩到
              146，商业团队超过 270 人，电子下单超过订单量 70%，超过 3,000 名医生使用 EMR 集成。这些指标说明销售触面在扩大、工作流嵌入在加深， 但不能替代
              CAC、回本周期或医生队列留存数据。成本侧，公开趋势有利：FY2025 毛利为 $539.2M，毛利率 66%；Q4 2025 毛利率达到 75%；Q1 2026 毛利率回落至 65%。Q1 2026 研发支出
              $31.3M、SG&A $104.7M，说明 Caris 即便自由现金流转正后， 仍在投入商业管线。剩下的承销问题是服务交付不透明。10-K 把 Illumina 列为关键测序投入的唯一供应商，但 Caris
              没有披露单次检测 COGS、按平台划分的资本开支，也没有足够营运资本细节，无法区分结构性经营杠杆和报销驱动的利润率抬升。
