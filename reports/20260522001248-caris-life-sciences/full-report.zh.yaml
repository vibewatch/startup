  - id: TV006
    title: 尽调与投资逻辑破坏表
    columns:
      - 主题
      - 当前公开判断
      - 改变估值的因素
      - 投资逻辑破坏阈值
      - 尽调要求 / 监控
    rows:
      - - DOJ / CID / 14 天规则风险敞口
        - 历史和解已知；当前 CID 范围和准备金未公开
        - 干净解决或非重大准备金会支撑更高倍数；准备金扩大则会压缩倍数
        - 重大准备金、不利和解趋势，或损害报销信任的计费实践发现
        - 获取律师备忘录、准备金分析，以及审查范围 / 期间
      - - 稀释股数和流通盘
        - 期权、RSU 和行情页股数无法干净对齐到单一当前基本股数
        - 更清晰的稀释股数桥接会提高对每股上行的信心
        - 意外稀释或大额解禁 / 出售压力，显著抬升有效股数
        - 建立完整稀释股权结构表，纳入授予价格、归属和锁定期动态
      - - 支付方 ASP 与回款质量
        - 收入增长已公开；支付方层面的实际 ASP、拒付和申诉经济性未公开
        - ASP 更耐久支撑基准到乐观倍数；回款弱则把 Caris 推向悲观情景
        - ASP 恶化或回款逆转，削弱 2025-2026 利润率改善
        - 索取支付方组合 ASP、拒付 / 申诉数据和价格让步历史
      - - Detect 商业化
        - Achieve 1 数据有希望，但商业放量仍早期
        - 早期上市牵引力可支撑向 Tempus / Veracyte 式倍数迁移
        - 上市延迟、医生采用弱，或报销牵引力差
        - 监控上市节奏、检测量、报销路径和早期使用漏斗
      - - ICFR 整改
        - 公开材料仍未说明 FY2025 重大缺陷是否已完全整改
        - 整改完成会增强对预测质量和准备金可靠性的信心
        - IPO 后再次出现控制失效或重述风险
        - 审阅审计师评论和整改测试证据
      - - EV 对齐和债务使用
        - 相对净现金，当前 EV 看起来合理，但延迟提款和增量债务能力仍未关闭
        - 净现金稳定或增强可支撑估值底部；债务融资 M&A 会迅速改变 EV
        - 新增杠杆没有相应收入 / 利润率提升
        - 跟踪借款、契约余量和收购资金用途
    notes: 这些是最高价值的尽调路径，用于判断 Caris 应得中游估值、溢价重估，还是低质量诊断公司折价。
