      - number: '3.4'
        title: 相邻与替代竞争对手
        blocks:
          - type: paragraph
            body: >-
              Myriad Genetics, Inc.（NASDAQ: MYGN）是遗传性癌症基因检测领导者，拥有 30 多年历史，并发现了 BRCA1 和 BRCA2 基因。Myriad
              面向肿瘤的产品包括：BRACAnalysis CDx（获 FDA 批准的伴随诊断，用于乳腺癌、卵巢癌、胰腺癌和前列腺癌中的胚系 BRCA1/2 突变）；MyChoice CDx（获 FDA 批准用于卵巢癌 HRD
              状态，判断 PARP 抑制剂适用性）；MyRisk Hereditary Cancer（63 基因面板，评估 11 类遗传性癌症）；Precise Tumor（泛癌种综合 NGS 实验室检测）。Myriad
              还覆盖精神健康药物基因组学（GeneSight，已为 2M+ 患者下单）和产前筛查（Foresight、Prequel、SneakPeek）。Myriad 与 Caris 的直接竞争主要在胚系 /
              遗传性检测，以及泛癌种组织 NGS（Precise Tumor vs. MI Profile）。Myriad 的 BRCA1/2 CDx 业务形成了耐久转诊路径：肿瘤医生下遗传性检测订单时，通常会先默认使用
              Myriad 已获批检测，再考虑综合 CGP 平台。

              Exact Sciences Corporation（NASDAQ: EXAS）主要在结直肠癌筛查（Cologuard Plus）和癌症治疗指导基因组学（Oncotype
              DX，用于早期乳腺癌、结肠癌和前列腺癌复发风险）上竞争。Exact Sciences 的 Oncodetect 是一项液体活检 MRD ctDNA 检测，正在临床开发中，将在 MRD 监测领域与 Caris
              Detect 和 Natera Latitude 竞争。Exact Sciences 不直接与 Caris MI Profile 的综合肿瘤基因组分析竞争，但其 Oncotype DX
              早期乳腺癌治疗指导业务，在治疗决策节点占据了相当多肿瘤医生注意力，降低了早期患者使用全量 CGP 的紧迫性。

              Illumina, Inc.（NASDAQ: ILMN）是全球下一代测序（NGS）仪器和试剂的主导供应商，Caris、竞争对手和医院实验室的大部分 DNA/RNA 测序都建立在 Illumina
              之上。Illumina 对 Caris 的竞争相关性主要体现在平台级供应商角色：如果 Illumina 提高仪器成本或限制试剂获取，Caris 和所有 CGP 竞争对手的利润率都会同时承压。Illumina
              曾拥有 GRAIL，并在监管程序后将其剥离；现在仍保留 GRAIL Galleri 收入的高个位数永久特许权使用费。医院参考实验室（Quest Diagnostics、LabCorp）和机构型学术 CLIA
              实验室代表肿瘤分子检测的传统现状，拥有庞大的医生覆盖基础和成熟计费关系，但缺少专业平台公司的 CGP 深度、FDA CDX 宽度和数据变现能力。FDA 伴随诊断批准清单记录了各竞争对手获批的 CDX 检测，确认
              Foundation Medicine 和 Guardant Health 的 CDX 领先地位。
