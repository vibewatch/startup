      - - 量化的 DOJ/FCA 风险敞口及任何应计准备
        - 法律悬而未决事项已有披露，但结果的财务区间没有披露
        - 重大 — 仅靠公开证据无法完整测算下行情景
        - 要求提供律师备忘录、风险敞口分析，以及与 CID 相关的任何计提或不计提准备理由
    notes: 每一行都在实质卡住投资判断，或构成重大限定，不是泛泛的愿望清单。这些缺口也是本章没有把当前盈利画像视为已完全看透的主要原因。
