    title: 产品架构图
    type: stack
    caption: >-
      Caris 的产品架构按六层堆栈组织，从原始生物样本延伸到商业化 AI 产品。数据飞轮纵向运转： 实验室层处理的每个临床病例都会向 CODEai 平台层增加记录，后者再训练所有下游 AI 产品。 MI Cancer Seek
      是一条并行 IVD 路径，受 FDA PMA SSED 对 Illumina NovaSeq 6000 硬件施加的更严格约束。
    data:
      layers:
        - label: 样本获取层
          detail: 组织（FFPE 活检）或血液抽取（Assure/MI Cancer Seek/Caris Detect 使用外周血）；样本物流和监管链； Caris Assure NY 不可用，待 CLEP 批准
        - label: 实验室处理层
          detail: >-
