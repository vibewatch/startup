    caption: 标准的医生发起临床工作流，从下单到报告交付，展示 Caris 与临床客户交互或创造价值的七个节点。 EHR 集成压缩节点 3 和 7 之间的步骤时长；平均 TAT 缩短 2.2 天，来自电子下单和结果直接嵌入医生工作流。
