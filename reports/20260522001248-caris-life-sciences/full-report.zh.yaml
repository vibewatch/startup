  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与报销风险
        blocks:
          - type: paragraph
            body: >-
              最高严重度的公开风险是 DOJ 围绕 Medicare 服务日期规则的悬而未决。April 2025，SEC 明确要求 Caris 扩展 S-1 中关于 March 2025 民事调查要求的披露，补充 CID
              背景、调查范围，以及 Caris 对 14-day rule 的合规情况。FY2025 10-K 后来确认，CID 涉及 Caris 在 False Claims Act 下遵守 Medicare
              服务日期规则的情况。 [CR001] [CR002]

              风险并非理论问题。2022 年，Caris 已支付 $2,886,674.86，了结其被指不当延迟提交部分基因癌症筛查检测、以便在 14-day 捆绑支付窗口之外向 Medicare
              计费的指控。和解协议把事项与举报人 Samuel Caughron 的 qui tam 诉讼，以及被指 Date-of-Service / 14-day-rule 违规关联起来；举报人叙述称受挑战行为跨越
              2007-2017。公开来源没有披露当前 CID 的索赔范围、准备金或可能追缴区间，因此下行在性质上重要，但金额仍待厘清。 [CR003] [CR004] [CR005] [CR047]

              报销集中度放大法律风险。Medicare 覆盖患者约占 FY2025 分子检测收入 39.6%；Caris 自己的支付方页面称，公司进入 100+ 个医疗计划网络、覆盖 200M+ 名参保人，包括
              Medicare 和 Medicare Advantage。10-K 警告，基因组检测覆盖决定耗时、昂贵且可能变化； Caris 年度医生通知强调，公司必须按联邦和州规则一致地向 Medicare
              计费，并在服务预计不被覆盖时可能需要 ABN。换句话说，Caris 最强的利润率引擎仍处在一个外部决定支付、医学必要性和计费程序的报销制度之下。 [CR009] [CR010] [CR011] [CR012]

              新产品覆盖和州准入仍被关口卡住。S-1 显示 Caris Assure 仍未进入 New York；该检测在除 New York 以外美国所有州可用，仍待 NY CLEP 批准。GenomeWeb 后在 May
              8, 2026 报道，Caris 刚提交 NYSDOH / Wadsworth 申请，意味着截至 runDate，该检测仍在审查中而非已获批准。Caris 还披露，Caris Assure MRD 只是已提交
              MolDx 技术评估，不能保证接受；ChromoSeq 新获 MolDx 覆盖则显示，增量菜单扩张多么依赖 CMS 承包商覆盖决定。 [CR013] [CR014] [CR015] [CR016]

              治理风险也应放进同一篮子，因为它影响外部披露可信度。Caris FY2025 10-K 称，截至年末，财务报告内部控制的重大缺陷仍未解决， 原因是复杂会计判断所需合格会计资源不足。FY2026 委托书和 Q1
              2026 新闻稿未公开说明该缺陷已完全补救。对于一家新上市、同时面对 DOJ 计费调查的公司，这一组合抬高了对盈利质量和法律准备金可靠性的尽调门槛。 [CR006] [CR007] [CR008]
