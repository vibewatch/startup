      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Caris 的收入经过两条买方渠道，经济结构不同。主渠道是临床肿瘤医生为单个癌症患者开立分子分析。Caris 直接向 Medicare、Medicaid 或商业支付方收费；肿瘤医生发起订单，但不是付款方。截至
              2025 年 12 月 31 日，Caris 拥有 5,550+ 名经常下单的肿瘤医生（定义为过去 12 个月内至少下单四次）和 90+ 份有效商业支付方报销合同。FY2025 临床分析服务贡献 $766.7
              million（占总收入 94.4%），主要来自组织型 MI Profile（约 170,300 个病例），Caris Assure 液体活检量也在增长（约 29,000 个病例）。第二条渠道是生物制药和药企
              R&D 伙伴——100+ 家公司使用 Caris 的生物样本库、CODEai AI 平台和伴随诊断服务——FY2025 产生 $45.3
              million。生物制药伙伴直接付费（没有保险中介），但销售周期更长，经济性逐合同决定。


              不同细分市场的采用路径不同。社区肿瘤医生通常需要：（1）NCCN 指南推荐适用癌种；（2）Medicare/支付方确认覆盖；（3）下单机构内部批准；（4）Caris 销售代表关系。学术癌症中心常通过 Caris
              Precision Oncology Alliance（Caris POA）参与，并走机构采购渠道。Caris Assure 液体活检还受 New York State CLEP
              限制，实验室批准前无法进入美国最大都会市场。Caris 已提交 NY CLEP 申请，正在等待审查。对生物制药伙伴来说，采用触发点是明确需要综合分子生物标志物数据，或需要提交伴随诊断监管申请。Caris
              Detect 是使用 WGS 技术、自研化学和 AI/ML 的 MCED 检测，预计 2026 年推出；它需要通过初级保健医生而非肿瘤医生建立一条全新的采用路径，这种结构断点增加了市场落地复杂度。
