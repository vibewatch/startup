companyProfile:
  summary: >-
    Armada is a private San Francisco-based edge-infrastructure company founded in late 2022
    by Dan Wright and Jon Runyan. The company sells a full-stack sovereign-edge platform
    spanning Galleon modular data centers, Atlas fleet and connectivity management, Bridge
    GPU orchestration, and a marketplace for first- and third-party applications. Public
    traction is strongest in named deployments with the U.S. Navy, Alaska DOT&PF, Washington
    DNR, and Aker BP, plus go-to-market and manufacturing support from Microsoft, Carahsoft,
    and Johnson Controls. Armada's May 2026 Series B set a $2.0 billion pre-money valuation
    and brought disclosed funding to about $465 million, while leaving core economics,
    customer breadth, and factory execution details largely private.
  founders:
    - name: Dan Wright
      role: Co-founder & CEO
      background: Former DataRobot CEO and former AppDynamics COO.
      claimRefs: [CO011]
    - name: Jon Runyan
      role: Co-founder & COO
      background: Former Okta general counsel through the company's IPO.
      claimRefs: [CO012]
  foundingLocation: San Francisco, USA
  headquarters: San Francisco, USA
  productSummary: >-
    Armada's product is a full-stack edge-infrastructure platform: Galleon rugged modular
    data centers, Atlas fleet/connectivity management, Bridge on-prem GPU orchestration and
    GPUaaS software, and a marketplace for applications and partner hardware designed for
    sovereign AI in remote or regulated environments.
  customerFocus: >-
    Defense, public-sector, offshore energy, telecom, and other industrial operators that
    need low-latency, sovereign, or disconnected AI and data infrastructure outside
    conventional centralized cloud environments.
  businessModel: >-
    Hardware-plus-software revenue model combining Galleon system sales and deployments with
    Bridge and Atlas software, marketplace and orchestration layers, and channel-led
    procurement through partners such as Azure Marketplace and Carahsoft.
  stage: Series B private company
  fundingStatus: >-
    Raised a $230 million Series B in May 2026 at a $2.0 billion pre-money valuation;
    disclosed funding reached about $465 million after the round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO006, CO010, CO021, CO023, CU001, CU022, CI001, CI020]
summary:
  headline: >-
    Armada has a credible sovereign-edge infrastructure wedge and unusually strong early
    deployment proof, but opaque economics, factory-scale execution risk, and a stretched
    2026 price keep the company in research-more territory.
