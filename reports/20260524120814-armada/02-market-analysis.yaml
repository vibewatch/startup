callouts:
  - calloutType: insight
    title: Armada's best market lens is sovereign, rugged, and disconnected infrastructure
    body: >-
      The opportunity is attractive because Armada sits where three trends overlap: AI inference is becoming
      more distributed, governments and regulated sectors increasingly want local control, and many industrial
      or mission environments still cannot rely on conventional cloud architecture.
    claimRefs:
      - CM007
      - CM018
      - CM024
      - CM025
      - CM031
      - CM046
  - calloutType: risk
    title: The category can be large and still difficult to monetize quickly
    body: >-
      Power delays, capex intensity, integration effort, and buyer fragmentation mean that a big surrounding
      market does not automatically translate into fast, repeatable bookings. Armada needs proof that today's
      references scale into standardized multi-site programs before larger incumbents use their balance sheets
      and channel reach to crowd the category.
    claimRefs:
      - CM026
      - CM027
      - CM038
      - CM039
      - CM040
      - CM041
      - CM048
      - CM051
