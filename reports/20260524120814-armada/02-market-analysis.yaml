  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: armada-commercial-scale
      missingEvidence: "Public revenue, ACV, installed-base, or active-site metrics that could anchor a bottom-up SOM model."
      whyItMatters: "Without public commercial metrics, the SOM range is necessarily analytical and cannot be triangulated against actual deployment density or realized contract value."
      diligencePath: "Request current bookings, revenue, site count, hardware backlog, and multi-site expansion data from management, then rebuild the SOM from real vertical cohorts."
      relatedQuestionRefs:
        - QM025
    - type: missing-source
      severity: material
      topic: sovereign-ai-benchmark
      missingEvidence: "A clean standalone public 2026 benchmark for sovereign AI infrastructure that separates sovereign cloud and sovereign edge buildout from broader AI or cloud spending."
      whyItMatters: "The sovereignty lens clearly matters to Armada, but accessible public data usually bundles it into broader AI infrastructure or cloud categories."
      diligencePath: "Request paid analyst extracts or investor materials that isolate sovereign AI infrastructure demand by geography and buyer type, especially for defense and regulated industries."
      relatedQuestionRefs:
        - QM026
    - type: private-evidence-only
      severity: material
      topic: telecom-edge-monetization
      missingEvidence: "Public carrier ROI, contract-value, or utilization benchmarks for distributed AI-grid monetization."
      whyItMatters: "Telecom is strategically attractive, but public evidence is still stronger on architecture and use cases than on repeatable economics."
      diligencePath: "Request live telco pipeline, design-partner conversions, commercial terms, and utilization assumptions for AI-grid deployments before underwriting telecom as a core wedge."
