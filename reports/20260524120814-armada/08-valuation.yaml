- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Current fair-value range
  - Core assumptions
  - What has to be true
  - Probability signal
  - Versus $2.23B post-money
  rows:
  - - Bear
    - $1.2B-$1.7B
    - Bookings convert slowly, Forge One ramps unevenly, power or site readiness delays deployments, and public multiples compress
    - Hardware working capital dominates before recurring software proof appears
    - Meaningful if factory timing or conversion starts slipping in 2026
    - ~0.5x-0.8x current mark
  - - Base
    - $1.8B-$2.5B
    - Bookings convert acceptably, Forge One starts continuous production, and Bridge or Atlas show credible recurring attach without full software re-rating
    - Armada becomes a repeatable hybrid infrastructure platform rather than a one-off project vendor
    - Most defensible public-evidence case today
    - ~0.8x-1.1x current mark
  - - Bull
    - $3.0B-$4.5B
    - Repeat sovereign deployments, clear software-control-plane monetization, customer diversification, and sustained capital-market appetite for AI infrastructure
    - Armada looks more like a scaled operating layer for sovereign AI factories than a hardware supplier
    - Requires private evidence not yet public
    - ~1.3x-2.0x current mark
  notes: Ranges are milestone-banded and not derived from undisclosed revenue; they translate public analogs, capital intensity, and execution evidence into directional value bands.
  claimRefs:
