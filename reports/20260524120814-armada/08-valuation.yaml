- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Monitoring cadence
  - Action implication
  rows:
  - - Bookings fail to convert
    - No credible bridge from bookings to recognized revenue after multiple quarters
    - Turns growth narrative into order-quality risk
    - Quarterly / diligence updates
    - Move to avoid or require lower valuation
  - - Factory ramp slips
    - Forge One misses continuous-production timing or shows visible yield / supply-chain issues
    - Undercuts scale story and burns capital
    - Monthly operating review
    - Pause underwriting until throughput proof returns
  - - Power or site readiness stalls
    - Material customer delays tied to interconnection, utility deposits, or construction bottlenecks
    - Pushes deployments right while fixed costs build
    - Pipeline by site
    - Reduce value band toward bear case
  - - Software attach remains weak
    - Bridge / Atlas stay strategic packaging rather than monetized recurring layer
    - Keeps Armada in hardware-led valuation bucket
    - Contract and product mix review
    - Do not underwrite premium software multiple
  - - Opaque financing terms emerge
    - Preference stack or structure creates adverse downside asymmetry for new money
    - Can reduce equity upside even if operations succeed
    - Term-sheet review
    - Reprice or walk away
  notes: These are the simplest observable ways for the May 2026 valuation thesis to break before a full operating history is public.
  claimRefs:
  - CV039
  - CV040
  - CV041
  - CV042
  - CV045
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Decision impact
  rows:
  - - Revenue-bookings bridge
    - Recognized revenue by quarter versus bookings and backlog
    - Determines whether demand is turning into real economics
    - Finance room + board materials
    - Highest
  - - Gross margin by layer
    - Hardware, deployment, support, Bridge, and Atlas margin profile
    - Determines which public comp bucket is appropriate
    - Finance room + product P&L
    - Highest
  - - Working capital and capex
    - Inventory, receivables, customer deposits, factory tooling, and utility deposits
    - Tests whether the Series B funds scale or only the gap to next capital raise
    - Finance + operations
    - Highest
  - - Customer concentration by dollars
    - Top customers, top sectors, and renewal / expansion dependence
    - Determines revenue durability and downside concentration
    - Sales ops + finance
    - High
  - - Factory throughput
    - Leviathan line rate, supplier readiness, QA metrics, and field-service loop
    - Validates whether Forge One is a catalyst or a new bottleneck
    - Ops diligence
    - High
  - - Series B preference terms
    - Liquidation preference, participation, anti-dilution, and any structured side letters
    - Changes actual return distribution for new money
    - Legal + financing docs
    - Highest
  notes: These are the private facts most likely to move the round from stretched to fair or from track to avoid.
