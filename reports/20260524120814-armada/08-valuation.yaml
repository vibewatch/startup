- id: TV003
  title: Valuation semantics and public-knowns table
  columns:
  - Item
  - Public value / status
  - What it is
  - What it is not
  - Implication
  rows:
  - - Series B size
    - $230M
    - New primary capital raised in May 2026
    - Not the company valuation
    - Shows round scale and implied new-money ownership only
  - - Pre-money valuation
    - $2.0B
    - Official price before new cash
    - Not post-money and not revenue
    - Anchor for dilution math
  - - Implied post-money
    - ~$2.23B
    - Pre-money plus new capital
    - Not a disclosed revenue multiple
    - Best entry-price proxy for new investors
  - - Total disclosed funding
    - Nearly half a billion / $465M
    - Cumulative capital raised
    - Not current cash balance or earnings power
    - Signals capital support, not valuation support
  - - Bookings growth
    - 540% FY25-26; 2000% Q1 FY27 YoY
    - Demand signal disclosed by company
    - Not recognized revenue or gross margin
    - Supports interest, not proof of economics
  - - Revenue / ARR / gross margin
    - Undisclosed publicly
    - Critical economic denominator still private
    - Not safe to infer from bookings or funding headlines
    - Prevents precise multiple underwriting
  notes: This distinction table exists because valuation, post-money math, total funding, bookings, and revenue are all separate analytical objects in Armada's May 2026 round.
