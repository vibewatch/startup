  title: Valuation
summary: Armada's May 2026 round is plausible inside the current AI-infrastructure capital cycle, but public evidence is still too thin on revenue conversion, margin mix, and financing terms to call the price attractive. The public-evidence stance is therefore track / research-more with a stretched valuation label rather than buy.
sections:
- id: known-price-hidden-economics
  title: The price is disclosed; the economic denominator is not
  body: |-
    Armada's official May 2026 release makes two things clear and one thing unclear. Clear: the company raised $230 million, called the round oversubscribed, and labeled the price a $2 billion pre-money valuation. That implies an approximately $2.23 billion post-money entry point and roughly 10.3% post-money ownership for the new capital. Clear as well: management is using the round to fund a manufacturing-and-deployment story around Galleon Forge One, Leviathan, and a Johnson Controls framework agreement, not pitching a low-capex software company.

    What remains unclear is the revenue denominator that would let outsiders test whether the price is cheap, fair, or expensive on a conventional multiple basis. The same source set gives bookings growth, total funding, and factory plans, but not recognized revenue, ARR, gross margin, backlog conversion, or the mix between hardware, deployment services, and recurring software. That means the valuation has to be framed first as financing semantics and milestone underwriting, not as a clean public multiple on disclosed economics. Distinguishing valuation, post-money math, total funding, bookings, and revenue is therefore not bookkeeping trivia; it is the core analytical constraint on this chapter.
