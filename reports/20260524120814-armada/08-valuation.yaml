    - Public / digital infrastructure equipment
    - $125.8B market cap
    - 11.60x trailing sales
    - Best mature hardware-plus-services digital-infrastructure analog with power and thermal exposure
    - Disclosure quality and scale are far ahead of Armada
  - - Equinix
    - Public / digital infrastructure platform
    - $106.5B market cap
    - 11.18x trailing sales
    - Shows what recurring digital infrastructure can command when utilization and revenue quality are visible
    - REIT economics and recurring colocation contracts are not Armada today
  - - Digital Realty
    - Public / data-center REIT
    - $68.7B market cap
    - 10.88x trailing sales
    - Useful asset-backed capex analog for site, power, and deployment intensity
    - Real-estate ownership model is structurally different
  - - Pure Storage
    - Public / hybrid hardware-software
    - $29.0B market cap
    - 7.91x trailing sales
    - Helpful hybrid product plus recurring software/support analog
    - Storage economics are cleaner and more disclosed than modular AI factories
  - - Nutanix
    - Public / software-led infrastructure
    - $12.7B market cap
    - 4.73x trailing sales
    - Shows where software-led infra can price without hardware-heavy capex
    - Much more software-centric than Armada
  - - HPE
    - Public / diversified infrastructure
    - $49.9B market cap
    - 1.40x trailing sales
    - Useful downside floor for diversified, lower-multiple infrastructure
    - Too diversified and low-growth to be a direct comp
  - - Nebius
    - Public / AI cloud outlier
    - $55.0B market cap
    - 62.64x trailing sales
    - Captures how extreme AI-native public enthusiasm can get
