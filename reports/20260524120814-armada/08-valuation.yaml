- id: scenario-and-sensitivity
  title: A milestone-banded scenario framework is more honest than a fake revenue model
  body: |-
    Because Armada's current revenue is not public, a precise DCF or current revenue-multiple model would be false precision. The defensible alternative is milestone banding. The base case assumes that bookings begin converting into recognized revenue on tolerable timing, Forge One reaches continuous production without visible yield or working-capital shock, and Bridge or Atlas prove they are real recurring attach layers rather than purely strategic packaging. In that state, Armada can plausibly grow into the current post-money mark and perhaps modestly exceed it.

    The bear case is simpler and more dangerous. If bookings stay disconnected from recognized revenue, if factory ramp or site power pushes deployments rightward, or if hardware working capital absorbs the new round faster than expected, investors can quickly re-rate Armada toward the lower end of diversified or hardware-heavy infrastructure precedent. The bull case requires more than additional logos: it needs repeat sovereign or regulated deployments, observable software control-plane monetization, and credible evidence that Armada is becoming an operating layer rather than merely a box supplier. Sensitivity therefore lives less in a hidden revenue number than in execution, attach, and financing quality.
  claimRefs:
  - CV037
