  - Current read
  - Evidence basis
  - Why it matters
  - Decision implication
  rows:
  - - Recommendation
    - track / research-more
    - Strong strategic positioning but incomplete public economics
    - The price cannot be called attractive from public evidence alone
    - Do not underwrite as a buy without private diligence
  - - Confidence
    - medium
    - Many factual anchors are public, but core revenue and cap-table inputs are private
    - Range of fair values remains wide
    - Use milestone gates rather than single-point conviction
  - - Risk rating
    - high
    - Factory ramp, power readiness, working capital, and bookings conversion dominate downside
    - Execution risk can re-rate the round quickly
    - Monitor factory and conversion data closely
  - - Valuation stance
    - stretched
    - Implied post-money is understandable in-category but unsupported by disclosed revenue and margin
    - The market is paying for strategic option value before economics are public
    - Treat upside as conditional, not assumed
  - - Entry discipline
    - wait for proof or better price
    - Need revenue-bookings bridge, margin layering, and preference terms
    - These are the facts that move the underwriting debate
    - Advance only after targeted diligence or material proof
  notes: This table translates the chapter into an investment stance using public evidence only; it is not a substitute for private financial diligence.
