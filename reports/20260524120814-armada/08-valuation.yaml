- id: public-market-benchmark-lenses
  title: Public markets offer a valuation band, not a single clean comp
  body: |-
    Public comparables do not yield one neat answer, but they do establish the range of what the market is paying for adjacent business models in May 2026. Mature digital-infrastructure and hybrid names cluster from roughly 1.4x trailing sales at HPE to 4.7x at Nutanix, 7.9x at Pure Storage, and around 10.9x to 11.6x at Digital Realty, Equinix, and Vertiv. Nebius sits at a much more speculative 62.6x trailing sales, while CoreWeave still trades around 9.24x despite already being public and revenue-disclosing. That spread matters more than any one name because Armada spans several buckets at once.

    Armada has physical deployment, thermal, and power exposure that makes Vertiv, HPE, and Digital Realty directionally relevant. It also has software and control-plane ambition that makes Pure and Nutanix useful on the upside. But there is no direct public twin for a sovereign-AI, rugged modular factory business that has public bookings proof but undisclosed revenue. The right lesson from public markets is therefore that premium infrastructure multiples are possible when investors can see revenue quality and mix. Armada is asking investors to pay before that disclosure exists, which is why the current round screens as priceable but not obviously supported.
