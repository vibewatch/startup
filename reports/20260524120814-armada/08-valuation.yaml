  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category fit
    - Armada sits inside a real sovereign-AI and modular AI-factory build cycle
    - A hot private capital cycle can inflate valuations before durable economics appear
    - Proof that repeat deployments produce durable revenue and gross margin
  - - Business model
    - Hardware plus control-plane software could merit premium hybrid valuation treatment
    - Public evidence still looks more like capital-intensive deployment than recurring software
    - Visible attach rates and software-led gross profit contribution
  - - Private analogs
    - Armada is above Modular but far below Crusoe, leaving room if execution compounds
    - Those analogs prove category enthusiasm, not that Armada has already earned similar economics
    - Evidence that Armada is scaling beyond reference deployments
  - - Public comps
    - Premium public infra names show investors will pay for strategic infrastructure with quality disclosure
    - Armada lacks the revenue, margin, and utilization disclosure those public comps provide
    - Disclosed revenue or private diligence that narrows the multiple uncertainty
  - - Capital cycle
    - Large pools of infrastructure capital can keep funding factories and deployments
    - Opaque financing, build-cost inflation, and power bottlenecks can compress the entire space
    - Evidence of capital efficiency and power-secure pipeline, not just fundraising success
  notes: 'The valuation case is evidence-sensitive: the same category momentum that lifts private rounds can also reverse if execution or financing transparency disappoints.'
