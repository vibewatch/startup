- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Representative public-market set spanning hybrid infrastructure, data-center REITs, diversified hardware, and AI-native cloud as of late May 2026; private rounds and nonpublic segment data are analyzed separately.
