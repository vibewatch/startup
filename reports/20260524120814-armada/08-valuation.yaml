  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-b-preferences
    missingEvidence: Exact liquidation preference, participation, anti-dilution, and seniority terms for the Series B.
    whyItMatters: These terms change actual downside protection and upside capture even if the operating story succeeds.
    diligencePath: Request the financing documents, updated cap table, and a counsel memo summarizing economics for the new round.
    relatedQuestionRefs:
    - QV025
  - type: private-evidence-only
    severity: material
    topic: revenue-conversion-and-margin-mix
    missingEvidence: Quarterly bookings-to-revenue bridge, backlog roll-forward, hardware versus software mix, and gross margin by layer.
    whyItMatters: Without these data, Armada cannot be benchmarked to public analog multiples with precision.
    diligencePath: Request finance-room revenue waterfalls, margin schedules, cohort economics, and current customer concentration by dollars.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: factory-working-capital
    missingEvidence: Factory throughput plan, supplier commitments, inventory turns, receivables timing, and utility-deposit / capex schedule.
    whyItMatters: The round can look large while still being insufficient if manufacturing and deployment working capital are front-loaded.
    diligencePath: Review factory operating plan, procurement cadence, customer deposit structure, and monthly cash bridge for Forge One / Leviathan.
    relatedQuestionRefs:
    - QV022
    - QV023
  - type: enumeration-incomplete
    severity: minor
    topic: public-comparable-set
    missingEvidence: Additional like-for-like public and segment-level analogs, including vendor subsegments and more private round detail, would broaden the comp set.
    whyItMatters: The comp table is deliberately representative rather than exhaustive because direct public twins for Armada do not exist.
    diligencePath: Expand the set with investor-bank research, segmented vendor disclosures, and new public AI-infrastructure issuers as they emerge.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV010
    - QV016
    relatedTableRefs:
    - TV004
