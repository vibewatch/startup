  - id: founders-leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      Armada’s public narrative is founder-led. Dan Wright is the co-founder and CEO most visibly
      associated with the company’s fundraising, mission framing, and external partnerships; public
      profiles repeatedly anchor Armada’s origin story to Wright’s prior operating roles at
      AppDynamics and DataRobot. Jon Runyan, the co-founder and COO, brings enterprise legal and
      company-building experience from Okta and appears across Armada’s early product and investor
      communications as the operational complement to Wright’s go-to-market profile. On the technical
      side, Pradeep Nair is consistently identified as founding CTO, while official Armada resource
      pages and Forbes coverage identify Prag Mishra as Chief AI Officer.

      This leadership mix looks strong for enterprise selling and applied AI commercialization, but
      it also produces concentration risk. Wright is the key public face across CNBC, investor,
      partner, and company materials, so any leadership disruption would likely affect fundraising,
      recruiting, and strategic messaging disproportionately. Governance disclosure remains the thin
      spot. The fetched 2026 public materials provide useful executive evidence, but they do not
      provide a clean current board roster, committee structure, or investor control-rights view.
      That means later-stage diligence should treat public leadership visibility as adequate for team
      mapping, but insufficient for a full governance or control analysis.
    claimRefs:
