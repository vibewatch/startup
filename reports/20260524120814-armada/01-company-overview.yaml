  - id: deployments-partners-and-commercial-footprint
    title: Deployments, Partners, and Commercial Footprint
    body: >-
      Armada’s commercial proof set is stronger on named deployments and sector breadth than on
      conventional SaaS metrics. The company disclosed in 2024 that customers had already brought its
      technology to 43 countries, and by 2025-2026 public sources named reference deployments with
      the U.S. Navy, Alaska DOT&PF, Washington DNR, Aker BP, and other industrial or public-sector
      operators. The use cases are internally consistent: process data where latency or connectivity
      breaks cloud workflows, then apply AI or automation in environments such as offshore rigs,
      wildfire operations, defense exercises, and remote field infrastructure.

      The customer stories show the pattern. Alaska DOT&PF used Atlas and Galleon to collapse drone
      imagery turnaround from multi-day or 28-hour-plus delays to same-day or real-time outputs.
      Washington DNR used Atlas to centralize roughly 45 Starlinks supporting wildfire response and
      remote operations. Armada’s UNITAS 2025 participation put a Galleon and Atlas into a U.S. Navy
      exercise ashore and aboard ship, while Aker BP agreed to deploy a Galleon on the Norwegian
      Continental Shelf for offshore drilling workflows. Around those deployments, Armada has built a
      partner layer that includes Microsoft, NVIDIA, Palantir, Dell, Skydio, and Carahsoft-linked
      public-sector channels, reinforcing the company’s thesis that it is selling sovereign AI
      capability as a system rather than a single box or software license.
