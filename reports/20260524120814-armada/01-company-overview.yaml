  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Current board roster, committee structure, observer rights, and founder or investor control terms."
      whyItMatters: "Later-stage venture underwriting depends on understanding who governs the company and how strategic investors can influence capital allocation, M&A, and manufacturing commitments."
      diligencePath: "Request the latest board deck, cap table summary, investor rights agreement, and any board observer schedules from management."
      relatedQuestionRefs: [QO009]

    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: "Current revenue, ARR, exact customer count, headcount, gross margin profile, and audited FY26 or FY27 operating metrics."
      whyItMatters: "Bookings growth is helpful but cannot substitute for revenue quality, operating leverage, or customer concentration analysis in later diligence chapters."
      diligencePath: "Request the latest board-approved KPI pack and management financials broken out by revenue, bookings, deployments, and headcount."
      relatedQuestionRefs: [QO026]

    - type: missing-source
      severity: material
      topic: legal-regulatory
      missingEvidence: "Docket-level litigation, sanctions, export-control, procurement protest, and regulator checks for Armada and its key executives."
      whyItMatters: "The company sells into defense, government, and cross-border industrial settings where legal and compliance issues can impair bookings, security clearances, and valuation."
      diligencePath: "Run court-docket, sanctions, debarment, and regulator-database searches for Armada, Dan Wright, Jon Runyan, and key subsidiaries or affiliates."
      relatedQuestionRefs: [QO025]

    - type: missing-source
      severity: minor
      topic: founding-date
      missingEvidence: "Exact incorporation date or state filing confirming the precise founding date rather than late-2022 phrasing."
      whyItMatters: "The difference is not thesis-breaking, but exact formation timing matters for holding periods, recruiting chronology, and early-round document review."
      diligencePath: "Pull secretary-of-state incorporation records or the original certificate of incorporation from management counsel."
      relatedQuestionRefs: [QO001]
