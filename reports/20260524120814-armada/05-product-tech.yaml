- id: key-risks-and-diligence-gaps
  title: The public record shows a credible architecture, but the most decision-relevant operating specs are still the missing ones
  body: >-
    The chapter supports Armada's product thesis at a fairly high level of confidence: there is a real
    hardware family, a real software control plane, a real sovereign-cloud integration path, and a real
    manufacturing program behind Leviathan. The constraint case is equally real. Two independent TechCrunch
    pieces are useful because they explain why modular AI infrastructure is not exempt from the wider power
    and thermal bottlenecks affecting the sector: power conversion losses are material, turbine and other
    energy-equipment lead times are long, and the economics of AI infrastructure increasingly turn on energy
    availability as much as compute availability. Armada's own public materials do not solve those questions.
    They do not publish per-SKU power or cooling envelopes outside broad form factors, they do not publish
    site-prerequisite matrices or uptime SLAs, and they do not disclose detailed security accreditation sets
    for Bridge or Galleon. As a result, the product architecture is investable as a concept and clearly more
    mature than a slideware stack, but full underwriting still depends on a private technical package that
    quantifies power, deployment repeatability, security accreditation, and factory throughput.
