  title: Product module / asset matrix
  columns:
  - Module / SKU
  - Primary user / buyer
  - Public maturity
  - Supportable technical detail
  - Differentiation
  - Diligence gap
  rows:
  - - Atlas
    - Fleet / network operations teams
    - Live product page and trial CTA
    - Manages Starlink, SD-WAN, drones, cameras, and sensors from one pane of glass
    - Turns connectivity plus asset telemetry into one control surface
    - No public API surface, uptime SLA, or pricing sheet
  - - Beacon
    - Remote field teams with tight space constraints
    - Publicly named SKU
    - Suitcase-sized Galleon for lightweight remote edge processing
    - Smallest form factor extends the family below container scale
    - No public rack count, power draw, or payload bill of materials
  - - Cruiser
    - Field sites and compact industrial / defense deployments
    - Publicly named SKU
    - 20-foot Galleon with 3 racks of compute and optional air-gapped configuration
    - Brings containerized compute into space-constrained deployments
    - No public power input, GPU mix, or commissioning checklist
  - - Triton
    - Heavier industrial, offshore, and defense workloads
    - Publicly named SKU and deployed product
    - 40-foot Galleon with 5 racks of compute and optional air-gapped configuration
    - Largest non-Leviathan form factor with rugged field focus
    - No public per-rack density, storage architecture, or uptime target
  - - Leviathan
    - AI factory, sovereign cloud, and high-density training / inference buyers
    - Publicly launched in 2025 and expanded in 2026
    - Megawatt-scale, liquid-cooled Galleon with 10x Triton compute claim and energy-flexible siting
    - Extends Armada from edge node to modular AI factory
    - Exact MW rating, CDU topology, and supported chip / rack mix are not public
  - - Bridge
    - GPU-cloud operators, data centers, telecoms, universities, enterprises
    - Public product plus docs surface
    - IaaS / PaaS GPU-cloud platform with Kubernetes, SLURM, JupyterHub, NIM, MIG, billing, and RBAC
    - Lets Armada span existing customer infrastructure, not just Armada hardware
    - No public performance benchmarks or external security accreditation pack
  - - Marketplace
    - Platform admins and solution teams
    - Public product page
    - Deploys first-party OpsAI apps, partner apps, and customer containers to Galleon / AEP
    - Speeds application onboarding instead of forcing bespoke integration every time
    - No public revenue share, review process, or supported runtime matrix
  - - Azure Local on Galleon
    - Governments and regulated industries needing sovereign cloud at the edge
    - Public collaboration available now
    - Azure Local plus AEP on ruggedized modular data centers with multi-rack and disconnected-operation support
    - Adds cloud-consistent operating model to Armada hardware
    - Exact validated reference architectures and accreditations are not public in full
  notes: Publicly visible product matrix synthesized from Armada product pages, docs, Microsoft, and DCD; unknown SKU-level specs remain intentionally blank rather than inferred.
