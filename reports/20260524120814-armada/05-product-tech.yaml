  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sku-power
    missingEvidence: Public or private per-SKU power draw, rack-density, and supported compute / storage envelope for Beacon, Cruiser, Triton, and Leviathan.
    whyItMatters: Power and thermal density determine where each module can actually deploy, what site prep is needed, and how credible the energy-flexibility story is by SKU.
    diligencePath: Request current spec sheets or deployment design guides for each Galleon variant, including power input, rack counts, cooling method, and supported chip classes.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE003
  - type: private-evidence-only
    severity: material
    topic: deployment-sla-gap
    missingEvidence: Detailed site-prerequisite checklist, commissioning sequence, and deployment SLA by product tier and customer environment.
    whyItMatters: The investment case leans on deployment-in-weeks; without prerequisites and SLA definitions, investors cannot tell whether that claim scales beyond favorable showcase deployments.
    diligencePath: Request implementation playbooks, sample statements of work, site-readiness templates, and post-install acceptance criteria for at least one recent Triton and one Leviathan deployment.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: material
    topic: security-accreditation
    missingEvidence: Bridge- and Galleon-specific security accreditation, hardening, and air-gap validation package beyond Atlas certifications and Azure Local partner language.
    whyItMatters: Sovereign and defense positioning depends on more than marketing language; buyers and underwriters need evidence that the actual control plane and hardware platform meet the required assurance boundary.
    diligencePath: Request Bridge and Galleon control matrices, penetration-test summaries, accreditation memos, and any FedRAMP, DoD, or equivalent customer approval packages.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: forge-one-throughput
    missingEvidence: Annual unit throughput, critical supplier commitments, and yield / rework assumptions for Forge One and Johnson Controls production.
    whyItMatters: Forge One is the mechanism that turns Armada from a deployment company into a manufacturing company, so throughput and bottlenecks directly determine revenue timing and delivery credibility.
    diligencePath: Request factory ramp plan, supplier scorecard, thermal-equipment lead times, and unit-output plan for the first twelve months of continuous production.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
