- id: deployment-power-cooling-and-forge-one
  title: Deployment speed, energy flexibility, and liquid cooling are real product claims, while Forge One is the bet that turns architecture into manufacturing
  body: >-
    Armada's public deployment claim is deliberately aggressive: operational in weeks, not years. The
    strongest product evidence for that claim comes from preconfigured Galleons, Microsoft and Armada's
    integrated Azure Local messaging, and the public note that an ally deployed a Triton in six days.
    Leviathan extends that story from edge compute into modular AI-factory infrastructure. Armada and
    independent DCD coverage both describe Leviathan as a liquid-cooled, megawatt-scale product, and Armada
    says it can colocate with stranded natural gas, solar, nuclear, and other alternative energy sources.
    Forge One is the operationalization layer behind that ambition. Armada and Johnson Controls say the
    Arizona facility can reach 400,000 square feet, create roughly 500 jobs, and start continuous production
    with Leviathan, while Johnson Controls brings advanced thermal-management capability and a large global
    field force. This should improve standardization and deployment repeatability, but it also shifts the
    company's execution burden toward manufacturing throughput, thermal design, and energy equipment rather
    than just software shipping. Public sources still do not disclose how many units Forge One can produce,
    what the supplier bottlenecks are, or which site-preparation assumptions must hold for the weeks-to-live
    claim to remain true.
