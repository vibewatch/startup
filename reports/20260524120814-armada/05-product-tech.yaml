company:
  name: Armada
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Armada's public product stack is materially more than a rugged box: the Armada Edge Platform (AEP)
    combines Atlas fleet management, Galleon modular data centers, Bridge GPU-cloud orchestration, and a
    Marketplace for first-party, partner, and bring-your-own applications. The public record supports a
    real technical architecture for disconnected and sovereign deployments, including local processing,
    satellite-plus-SD-WAN connectivity, air-gapped Cruiser/Triton configurations, Azure Local integration,
    and a liquid-cooled Leviathan at megawatt scale. The unresolved diligence issue is not whether Armada
    has products, but whether the company can operationalize them repeatedly at scale because per-SKU power
    envelopes, deployment SLAs, detailed non-Atlas security accreditations, and Forge One throughput are
    still private.
sections:
- id: product-stack-and-galleon-family
  title: Armada's product definition is a four-product edge platform anchored by a supportable Galleon family
  body: >-
    Armada's homepage and product surfaces describe a coherent full-stack offer rather than a one-product
    company. Armada Edge Platform is explicitly presented as four products: Atlas, Galleon, Bridge, and
    Marketplace. That matters because the product story spans customer workflow from connectivity and fleet
    visibility, to local compute, to GPU-cloud management, to packaged application delivery. The most
    supportable hardware detail sits inside the Galleon family. Armada publicly states that the line runs
    from Beacon, a suitcase-sized unit, to Cruiser, a 20-foot system with three racks of compute, to
    Triton, a 40-foot system with five racks of compute, and then to the liquid-cooled Leviathan at
    megawatt scale. The same source set also supports a practical deployment thesis: Galleon is preloaded
    with compute, networking, storage, heating, and cooling; Armada claims it can be operational in weeks,
    not years; and the local-processing workflow is explicitly designed to minimize backhaul by sending only
    mission-critical information back to the cloud. What is still missing is the exact per-SKU power,
    storage, and networking envelope outside these broad public descriptors.
