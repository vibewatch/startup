- id: sovereign-cloud-connectivity-and-security
  title: Azure Local integration and the named connectivity stack make the sovereign-edge architecture plausible, but public assurance still stops short of full accreditation detail
  body: >-
    The Microsoft collaboration is one of the strongest pieces of public technical corroboration in the
    chapter because both Armada and Microsoft describe the same basic architecture. Azure Local runs on
    Galleon modular data centers and interoperates with AEP as a sovereign private-cloud reference design.
    Microsoft says the design supports multi-rack managed clusters, hyperconverged or SAN-backed storage,
    and resilient multi-network connectivity across satellite, LTE/5G, RF, and SD-WAN. Armada adds a similar
    claim that the solution can keep critical systems online in communications-denied settings and can deploy
    ruggedized modules in weeks rather than months. The sovereignty story is also consistent with Armada's
    local-processing language and with partner surfaces from Carahsoft and Dell/Palantir that emphasize
    running sensitive workloads on infrastructure the customer controls. The trust picture is still uneven,
    however. Atlas has the clearest public control set, Azure Local is described as hardened and auditable,
    and Bridge documents hard isolation and RBAC, but the reviewed public pack does not provide Bridge- or
    Galleon-specific accreditation lists, formal air-gap validation packages, or public uptime commitments.
