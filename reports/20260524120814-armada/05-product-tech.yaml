- id: control-plane-and-application-layer
  title: The control plane is supportably software-defined, with Atlas for fleet operations and Bridge for GPU-cloud orchestration
  body: >-
    Armada's software story is concrete enough to underwrite a real control plane. Atlas is positioned as
    the operational interface for Starlink terminals, SD-WAN, drones, cameras, sensors, and other connected
    assets, with pooled-data-plan economics, predictive monitoring, and a security surface that includes SSO,
    RBAC, audit logs, and SOC 2 / ISO 27001 language. Bridge is more important technically because the docs
    move beyond marketing and show a genuine GPU-cloud platform. Armada documents Bridge as a combined IaaS
    and PaaS layer with multi-tenancy, Kubernetes and SLURM support, JupyterHub and Ray templates, NVIDIA NIM
    inference templates, autoscaling by GPU utilization, and UI-driven MIG partitioning for supported GPUs.
    Marketplace rounds out the architecture by letting customers deploy Armada's own industrial apps, partner
    software, or their own containerized workloads. A developer-signal source strengthens the picture: Armada
    is actively hiring for on-prem CaaS and GPUaaS on bare-metal Kubernetes using KVM, container runtimes,
    KubeVirt, and vGPU technology, which is consistent with the public docs rather than an unrelated jobs
    artifact.
