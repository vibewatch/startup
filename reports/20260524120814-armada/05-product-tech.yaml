- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Armada solution path
  - Measurable benefit claimed
  - Limitation
  rows:
  - - Remote industrial monitoring
    - Sensor, camera, and drone data wait on weak backhaul or delayed review
    - Atlas plus Galleon local processing plus OpsAI apps
    - Lower latency and reduced bandwidth because only mission-critical information goes upstream
    - Public sources do not quantify latency reduction or false-positive rates
  - - Contested or disconnected sovereign AI
    - Public cloud may be unavailable or non-compliant
    - Azure Local on Galleon with AEP orchestration and multi-path connectivity
    - Run cloud-consistent AI and analytics locally with sovereignty and auditability
    - Public sources do not disclose accreditation boundary documents or mission SLAs
  - - Existing GPU cluster monetization
    - Idle or fragmented GPU assets are hard to allocate and bill
    - Bridge with GPUaaS billing, RBAC, and observability
    - Higher utilization and monetizable excess GPU capacity
    - Public sources do not disclose realized pricing or customer utilization gains
  - - Telecom distributed AI grid
    - Latency-sensitive inference needs GPUs near users and network edges
    - AEP plus NVIDIA AI Grid reference alignment and optional Galleon modules
    - Unified workload placement across centralized, regional, and edge sites
    - Public evidence is pre-production architecture heavy and KPI light
  - - Public-sector rapid response deployment
    - Emergencies and field missions cannot wait for new construction
    - Ruggedized Galleons with local compute, connectivity, and Azure Local / Palantir ecosystem options
    - Faster deployment and resilient local processing in the field
    - Site prerequisites, training load, and ongoing field service obligations are not public
  - - Data science and model-serving teams
    - GPU resources are fragmented across clusters and toolchains
    - Bridge templates for Ray, JupyterHub with KAI Scheduler, and NVIDIA NIM
    - Faster cluster provisioning with workload-specific software preloaded
    - Public docs do not publish benchmark throughput or tenancy limits
  notes: Workflow rows map public use-case language to the corresponding Armada product surfaces; benefits are claimed, not independently quantified unless stated.
