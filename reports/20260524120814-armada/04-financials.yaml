  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Cash on hand and unrestricted liquidity
    missingEvidence: No public balance-sheet cash figure, unrestricted cash figure, or post-Series-B liquidity schedule is available.
    whyItMatters: Without cash on hand, the company cannot be underwritten for solvency or near-term manufacturing bridge capacity.
    diligencePath: Request the latest monthly balance sheet, cash account schedule, and any restricted-cash or escrow balances from finance.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: blocking
    topic: Monthly burn and runway under the factory plan
    missingEvidence: No public monthly burn, quarterly cash outflow, or runway bridge is available for the Forge One and Leviathan ramp.
    whyItMatters: Runway cannot be inferred from funding headlines when factory, inventory, and deployment working capital may absorb cash unevenly.
    diligencePath: Request a twelve-month cash-flow bridge with actual burn, capex, inventory, and working-capital movements plus downside runway scenarios.
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: blocking
    topic: Actual hardware versus software/services revenue mix
    missingEvidence: No public source breaks bookings or revenue into Galleon hardware, Bridge, Atlas, Marketplace, deployment, and support.
    whyItMatters: The margin path and valuation framework depend on whether Armada is currently hardware-led or already building a material recurring software tail.
    diligencePath: Request product-line revenue and bookings split for FY25, FY26, and Q1 FY27, including recurring versus non-recurring classification.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: material
    topic: Realized pricing and discount ladders
    missingEvidence: Public materials disclose Bridge billing units but not realized prices, discount ladders, customer deposits, or Galleon quote ranges.
    whyItMatters: Without realized price data, there is no defensible bridge from public demand signals to unit economics or gross profit.
    diligencePath: Request anonymized customer quotes or invoices for Galleon, Bridge, Atlas, and support, plus average selling price waterfalls by product line.
    relatedQuestionRefs:
    - QI025
  - type: private-evidence-only
    severity: material
    topic: Customer concentration, backlog, and deferred revenue
    missingEvidence: Public sources name customers and deployments but do not disclose top-customer concentration, backlog by customer, deferred revenue, or cancellation rights.
    whyItMatters: A few large sovereign, energy, or public-sector contracts could dominate both cash conversion and downside risk despite apparent logo breadth.
    diligencePath: Request top-customer shares of bookings and revenue, backlog aging, deferred-revenue balances, and key termination or milestone clauses.
    relatedQuestionRefs:
    - QI026
