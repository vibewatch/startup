callouts:
- calloutType: insight
  title: Public evidence supports a hardware-plus-software company, but not a pure SaaS one
  body: 'Armada''s public material clearly supports multiple monetization layers: Galleon hardware, Bridge usage-based software, Atlas management software, Marketplace distribution, and channel-driven procurement. What it does not support is forcing SaaS-style unit economics onto the whole business before the software share is disclosed.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI024
  - CI038
- calloutType: risk
  title: Bookings growth is demand evidence, not revenue-quality evidence
  body: The 540% FY25-FY26 and 2,000% Q1 FY27 bookings figures are impressive, but they do not say how much revenue was recognized, how much is deferred, or how much sits in hardware versus software contracts. That distinction is the single biggest public-modeling trap in this chapter.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI022
- calloutType: risk
  title: Factory economics are the hidden swing factor in capital adequacy
  body: Once Forge One and Leviathan are in scope, capital adequacy depends on factory spend, inventory commitments, deployment timing, and any structured financing support from Johnson Controls or customers. Public sources confirm the footprint and manufacturing relationship, but not who funds the expensive parts.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI039
  - CI040
- calloutType: recommendation
  title: Do not underwrite margin path or runway without the private schedule set
  body: Before taking a valuation view from this chapter, require a private package covering absolute bookings and revenue, product-line mix, gross margin by layer, factory capex responsibility, GPU procurement commitments, cash on hand, burn, runway, and customer concentration/backlog. Public evidence is directionally useful, but not closing-grade.
