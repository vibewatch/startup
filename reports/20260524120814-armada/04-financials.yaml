- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why still private in public record
  - Exact diligence path
  rows:
  - - Revenue and ARR
    - Cannot map bookings momentum to valuation or recurring quality
    - Private company; no public financial statements or KPI deck
    - Request monthly revenue bridge, ARR roll-forward, and signed revenue-recognition memo
  - - Bookings definition and absolute base
    - 540% and 2,000% growth rates cannot be converted into dollars
    - Public sources disclose percentages only
    - Request FY25, FY26, and Q1 FY27 absolute bookings and definition by contract type
  - - Hardware versus software/services mix
    - Determines gross-margin path and whether software-style multiples are justified
    - No public segment disclosure
    - Request product-line revenue split for Galleon, Bridge, Atlas, Marketplace, and services
  - - Gross margin by layer
    - Without layer margins, the margin path is impossible to underwrite
    - No public P&L or segment cost data
    - Request gross margin by hardware, software, services, and support
  - - Cash, burn, and runway
    - Capital adequacy is untestable despite large funding headlines
    - No public balance-sheet or cash-flow disclosure
    - Request cash balance, monthly burn, and runway bridge from CFO
  - - Factory capex and JCI economics
    - Manufacturing ramp could consume a large share of the Series B
    - Framework agreement economics are private
    - Request Forge One budget, capex responsibility matrix, and JCI pricing terms
  - - GPU procurement commitments and inventory
    - Leviathan economics depend on chip prepayments and inventory turns
    - No public GPU purchase or vendor-financing disclosure
    - Request GPU supply agreements, deposits, and inventory policy
  - - Customer concentration, backlog, and deferred revenue
    - A handful of large contracts could dominate risk and cash timing
    - Named customers are public, but concentration metrics are not
    - Request top-customer shares, backlog schedule, deferred revenue, and cancellation rights
  - - Realized price versus public constructs
    - Usage units and procurement routes do not reveal realized pricing power
    - Company discloses mechanism but not discounting
    - Request invoice samples, price waterfall, and average realized ASP by product
