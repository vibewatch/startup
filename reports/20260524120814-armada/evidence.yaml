evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, observer rights, and founder or investor control terms.
    whyItMatters: >-
      Later-stage venture underwriting depends on understanding who governs the company and how strategic investors can
      influence capital allocation, M&A, and manufacturing commitments.
    diligencePath: >-
      Request the latest board deck, cap table summary, investor rights agreement, and any board observer schedules from
      management.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current revenue, ARR, exact customer count, headcount, gross margin profile, and audited FY26 or FY27 operating
      metrics.
    whyItMatters: >-
      Bookings growth is helpful but cannot substitute for revenue quality, operating leverage, or customer
      concentration analysis in later diligence chapters.
    diligencePath: >-
      Request the latest board-approved KPI pack and management financials broken out by revenue, bookings, deployments,
      and headcount.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: material
    topic: legal-regulatory
    missingEvidence: >-
      Docket-level litigation, sanctions, export-control, procurement protest, and regulator checks for Armada and its
      key executives.
    whyItMatters: >-
      The company sells into defense, government, and cross-border industrial settings where legal and compliance issues
      can impair bookings, security clearances, and valuation.
    diligencePath: >-
      Run court-docket, sanctions, debarment, and regulator-database searches for Armada, Dan Wright, Jon Runyan, and
      key subsidiaries or affiliates.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: founding-date
    missingEvidence: Exact incorporation date or state filing confirming the precise founding date rather than late-2022 phrasing.
    whyItMatters: >-
      The difference is not thesis-breaking, but exact formation timing matters for holding periods, recruiting
      chronology, and early-round document review.
    diligencePath: >-
      Pull secretary-of-state incorporation records or the original certificate of incorporation from management
      counsel.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: armada-commercial-scale
    missingEvidence: Public revenue, ACV, installed-base, or active-site metrics that could anchor a bottom-up SOM model.
    whyItMatters: >-
      Without public commercial metrics, the SOM range is necessarily analytical and cannot be triangulated against
      actual deployment density or realized contract value.
    diligencePath: >-
      Request current bookings, revenue, site count, hardware backlog, and multi-site expansion data from management,
      then rebuild the SOM from real vertical cohorts.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: sovereign-ai-benchmark
    missingEvidence: >-
      A clean standalone public 2026 benchmark for sovereign AI infrastructure that separates sovereign cloud and
      sovereign edge buildout from broader AI or cloud spending.
    whyItMatters: >-
      The sovereignty lens clearly matters to Armada, but accessible public data usually bundles it into broader AI
      infrastructure or cloud categories.
    diligencePath: >-
      Request paid analyst extracts or investor materials that isolate sovereign AI infrastructure demand by geography
      and buyer type, especially for defense and regulated industries.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: telecom-edge-monetization
    missingEvidence: Public carrier ROI, contract-value, or utilization benchmarks for distributed AI-grid monetization.
    whyItMatters: >-
      Telecom is strategically attractive, but public evidence is still stronger on architecture and use cases than on
      repeatable economics.
    diligencePath: >-
      Request live telco pipeline, design-partner conversions, commercial terms, and utilization assumptions for AI-grid
      deployments before underwriting telecom as a core wedge.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: armada-pricing
    missingEvidence: >-
      Realized Armada contract pricing, ACV, services attachment, and hardware-versus-software gross-margin evidence
      against incumbent and substitute alternatives.
    whyItMatters: >-
      Without realized pricing and margin evidence, it is hard to know whether Armada's differentiated deployments
      produce durable economics or only high-complexity custom deals.
    diligencePath: >-
      Request cohort-level pricing waterfalls for representative Galleon plus AEP deals, including services, recurring
      software, and support components against comparable incumbent alternatives.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: direct-peer-coverage
    missingEvidence: >-
      A source-retainable official or independent product surface for Oxigen or another suggested startup that clearly
      matches Armada's modular sovereign edge-AI scope.
    whyItMatters: >-
      The direct startup peer set is thin, and unsupported names can distort the market map by implying false crowding
      or false differentiation.
    diligencePath: >-
      Run another source-discovery pass for Oxigen and adjacent startups only if an official product page, deployment
      case, or reputable independent profile surfaces; otherwise leave it out of scored matrices.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: armada-retention
    missingEvidence: >-
      Win-loss, renewal, fleet-expansion, and deployment-standardization data for Armada relative to pilots or showcase
      deployments.
    whyItMatters: >-
      Moat durability depends on whether Armada's first site becomes a repeatable program rather than a vivid but
      isolated deployment.
    diligencePath: >-
      Request customer-cohort retention and expansion data, including how many deployments moved from trial or showcase
      into multi-site production rollouts.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: channel-attribution
    missingEvidence: >-
      Partner-sourced versus direct-sourced pipeline, bookings, and renewal contribution across Microsoft, Carahsoft,
      NVIDIA, and other channels.
    whyItMatters: >-
      The chapter's GTM judgment depends on whether Armada owns the customer relationship or depends on partners that
      could redirect demand toward incumbent stacks.
    diligencePath: >-
      Ask management for a channel-mix bridge by pipeline, bookings, and active deployments, including reseller-led
      versus direct-led deal ownership.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: blocking
    topic: Cash on hand and unrestricted liquidity
    missingEvidence: No public balance-sheet cash figure, unrestricted cash figure, or post-Series-B liquidity schedule is available.
    whyItMatters: Without cash on hand, the company cannot be underwritten for solvency or near-term manufacturing bridge capacity.
    diligencePath: >-
      Request the latest monthly balance sheet, cash account schedule, and any restricted-cash or escrow balances from
      finance.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: blocking
