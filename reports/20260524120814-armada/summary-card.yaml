  topStrengths:
    - >-
      Armada has a differentiated full-stack offering spanning rugged modular data centers, fleet/connectivity
      management, GPU orchestration, and an application marketplace.
    - >-
      Public reference deployments with the U.S. Navy, Alaska DOT&PF, Washington DNR, and Aker BP show the product
      solves real disconnected and harsh-environment problems.
    - >-
      Microsoft, Carahsoft, and Johnson Controls materially improve procurement, sovereign-cloud credibility, and
      manufacturing capacity.
    - >-
      The May 2026 Series B gives Armada meaningful capital and external validation as sovereign and edge AI
      infrastructure demand accelerates.
  topRisks:
    - >-
      Public disclosures still omit revenue, ARR, gross margin, backlog conversion, and runway, so bookings growth
      cannot be mapped to durable economics.
    - >-
      Forge One, Leviathan, and broader manufacturing scale-up introduce high execution, supplier, thermal, and
      working-capital risk.
    - >-
      Customer proof remains concentrated in a small set of defense, public-sector, and industrial references, with
      meaningful dependence on Microsoft, Carahsoft, and Johnson Controls.
    - >-
      Sovereign-AI expansion raises export-control, cyber, and procurement compliance burdens that are only partially
      visible in public materials.
    - >-
      The May 2026 valuation looks stretched on public evidence and could re-rate if software attach or revenue
      conversion disappoints.
  unresolvedGaps:
    - >-
      No public recognized revenue, ARR, gross margin, EBITDA, burn, runway, or revenue-recognition bridge from
      bookings.
    - No public customer count, renewal or retention metrics, or account-level concentration by dollars.
    - >-
      No public throughput, yield, capex-responsibility, or working-capital detail for Forge One and Leviathan
      production.
    - No public board composition, preference stack, or detailed governance rights.
    - >-
      Limited public detail on non-Atlas security accreditations, full compliance packages, and counsel-grade litigation
      or incident diligence.
