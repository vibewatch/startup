- id: TR007
  title: Adverse signal log
  columns:
  - Signal
  - Evidence
  - Why adverse
  - Offsetting evidence
  - What to monitor next
  rows:
  - - Bookings disclosed without revenue quality metrics
    - Armada publicizes bookings growth but not revenue, ARR, margin, or backlog conversion.
    - Demand may be real while economic quality remains unknown.
    - Large round and multiple named deployments imply market pull.
    - Revenue conversion, backlog timing, and margin disclosure.
  - - Small public proof set
    - Named deployments cluster around Alaska, Washington DNR, UNITAS, Aker BP, and partner channels.
    - Reference concentration can overstate diversification.
    - The use cases are real and sector-diverse.
    - New named production customers and repeat orders.
  - - Reference systems over fleet rollouts
    - UNITAS is an exercise and Aker begins with a single reference installation.
    - Pilot-to-fleet execution risk remains meaningful.
    - These references do prove real operating relevance.
    - Fleet expansion, renewal, and multi-site rollout evidence.
  - - Sector-wide power and delay bottlenecks
    - JLL, CBRE, Belfer, and Deloitte all describe power scarcity and delivery delays.
    - Armada still has to secure power, cooling, and sites despite differentiated form factor.
    - Modular architecture can shorten some integration steps.
    - Interconnection timing, powered-site inventory, and on-site generation plans.
  - - Compliance surface expanding faster than public proof
    - BIS, EU AI Act, CISA, DoD, and NDAA sources all point to more governance and control obligations.
    - Compliance debt can stall deployments even when product demand exists.
    - Armada’s positioning is strongest where compliance matters most.
    - Export-control workflow, ATO evidence, and deployment-specific certifications.
  - - Factory throughput still private
    - Forge One dimensions and jobs are public, but unit economics and throughput are not.
    - Execution risk stays high until output quality and cadence are visible.
    - Johnson Controls partly de-risks thermal and manufacturing capability.
    - Throughput, yield, lead-time, and field-service metrics.
  notes: The adverse log records constraints that are supportable from public evidence today; it is not a claim that these
    risks have already crystallized into failure.
