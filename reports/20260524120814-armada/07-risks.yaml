- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Forge One execution
    - Factory launch and unit output
    - Ramp slips materially or throughput remains undisclosed through the next operating cycle.
    - Escalate diligence; reduce conviction until manufacturing proof is visible.
  - - Bookings quality
    - Revenue / backlog / recognition disclosure
    - Management still discloses only bookings while avoiding revenue conversion evidence.
    - Treat demand as real but economics as unproven; avoid software-style underwriting.
  - - Public-sector concentration
    - New disclosed non-government production accounts
    - Named deployments remain clustered in defense/public sector without diversification.
    - Assume higher volatility and slower scaling.
  - - Export / sovereign compliance
    - Buyer-ready compliance packs and export controls
    - Cross-border sales expand before reusable compliance documentation is visible.
    - Increase legal/compliance diligence and haircut rollout assumptions.
  - - Power / site readiness
    - Interconnection and energized-site lead times
    - Projects depend on powered sites without secured timelines or contingency generation.
    - Increase deployment buffers and capital assumptions.
  - - Partner dependence
    - Joint-selling and partner delivery evidence
    - Microsoft, Carahsoft, or Johnson Controls activity slows or becomes more promotional than operational.
    - Reassess route-to-market durability.
  - - Cyber / OT resilience
    - Independent security evidence
    - No meaningful certification, ATO, or incident-management proof emerges as deployments widen.
    - Treat security as a gating diligence item, not a check-box.
  - - Leadership bandwidth
    - Operating-bench visibility
    - Founder concentration stays high while scope expands across factory, field, and compliance.
    - Reassess execution capacity and succession coverage.
  notes: Kill criteria are underwriting triggers, not predictions. Each one is chosen because it is monitorable from public
    or diligenced operating evidence.
