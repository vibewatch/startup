  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: forge-one-throughput
    missingEvidence: Factory throughput, yield, supplier commitments, lead times, and field-failure metrics for Forge One
      and Leviathan.
    whyItMatters: Execution risk is the top residual risk, and public plant size does not prove repeatable output quality
      or cadence.
    diligencePath: Request manufacturing readiness review, supplier concentration map, throughput targets, and first-pass
      yield data by product family.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: customer-mix-and-conversion
    missingEvidence: Revenue, ARR, backlog conversion, deferred revenue, payment terms, and sector or account concentration
      by dollars.
    whyItMatters: Bookings alone cannot show whether public demand converts into durable, recognized revenue or diversified
      exposure.
    diligencePath: Request booked-to-billed-to-recognized bridge, customer concentration schedule, and backlog aging by sector
      and customer.
    relatedQuestionRefs:
    - QR029
  - type: missing-source
    severity: material
    topic: compliance-packaging
    missingEvidence: Deployment-specific ATO or accreditation artifacts, export-license workflow details, and buyer-ready
      compliance packages for sovereign deployments.
    whyItMatters: The market thesis depends on regulated and defense buyers, but public compliance proof is still abstract
      compared with the obligations described by regulators and partners.
    diligencePath: Request sample control packages, export-classification memos, buyer-specific authorization status, and
      evidence of completed security reviews.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: public-record-checks
    missingEvidence: Counsel-grade litigation, sanctions, debarment, enforcement, and incident searches for Armada, founders,
      and key affiliates.
    whyItMatters: Public-source review did not surface direct legal or incident events, but absence from a public source pack
      is not the same as a clean legal diligence result.
    diligencePath: Run docket, regulator, OFAC, BIS, SAM, and breach-notification database searches through counsel or compliance
      advisors.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Nonpublic licenses, customer-specific waivers, export exceptions, and closed or nonpublic legal matters
      that are not visible in public sources.
    whyItMatters: The chapter can rank public legal and regulatory vectors, but it cannot certify complete legal cleanliness
      or full jurisdictional coverage from public evidence alone.
    diligencePath: Use export and procurement counsel to verify jurisdiction-specific obligations and whether any customer-specific
      approvals or waivers already exist.
    relatedQuestionRefs:
    - QR009
    - QR011
    - QR030
    relatedTableRefs:
    - TR002
