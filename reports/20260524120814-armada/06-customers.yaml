  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: customer-breadth
    missingEvidence: A full customer roster or customer-count disclosure segmented by production deployment, pilot, channel-only, and vertical.
    whyItMatters: Without a broader roster, concentration risk and customer-base durability cannot be underwritten from public information alone.
    diligencePath: Request a customer ledger with start date, stage, ACV, deployment status, and whether each account is public sector, defense, industrial, or partner-led.
    relatedQuestionRefs:
    - QU022
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Renewal dates, NRR, GRR, expansion history, and satisfaction data for Alaska, Washington DNR, Aker BP, and other named accounts.
    whyItMatters: Armada can have strong early deployment proof and still fail to convert those accounts into durable recurring revenue without renewal and expansion evidence.
    diligencePath: Request cohort tables by start year and vertical, plus reference-account contract history showing renewals, expansions, logo churn, and any non-renewals.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: carahsoft-channel
    missingEvidence: Task-order counts, total contract value, renewals, and expansion bookings routed through Carahsoft vehicles.
    whyItMatters: Public contract-vehicle access lowers procurement friction, but it does not prove that Armada has converted public-sector interest into repeat booked revenue.
    diligencePath: Request reseller sales history by contract vehicle, agency, product, ACV, renewal status, and pipeline stage.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Bookings or revenue split by public sector, defense, industrial energy, sovereign cloud, and partner-led deals.
    whyItMatters: Without vertical mix data, investors cannot tell whether Armada is diversified across sectors or still overly dependent on a handful of showcase markets and accounts.
    diligencePath: Request bookings, revenue, and gross-margin mix by vertical and by deployment stage, then reconcile that split to named proof points and pipeline concentration.
