chapter:
  number: 6
  title: Customers
  summary: 'Armada has stronger public customer proof than most young infrastructure startups: Alaska DOT&PF, Washington DNR, UNITAS 2025, and Aker BP all map to concrete remote-workflow problems, while Carahsoft and Microsoft show credible procurement and sovereign-cloud access. The gap is durability rather than initial relevance. Public evidence still skews toward case studies, reference deployments, and partner-led channels rather than disclosed customer counts, renewals, or contract-value-driven ARR.'
sections:
- id: customer-segments-and-use-cases
  title: 'Customer pattern: sovereign, remote, and operationally constrained buyers'
  body: 'Armada’s public customer evidence is not broad horizontal enterprise adoption; it is a concentrated wedge into environments where connectivity, sovereignty, or latency make central cloud workflows fail. The clearest named end users are Alaska DOT&PF, Washington DNR, the U.S. Navy during UNITAS, and Aker BP. Those buyers share a similar pattern even though their industries differ. A government or industrial operator owns a mission in a remote or regulated environment; field users need local compute or centrally governed connectivity; and the buyer needs a way to deploy quickly without waiting for traditional data-center buildouts. Alaska’s drone and geospatial workflows, Washington DNR’s wildfire connectivity operations, the Navy’s maritime exercise environment, and Aker BP’s offshore drilling data flows all fit that template. Carahsoft, Microsoft, Second Front, Skydio, DOE Genesis Mission, WinDC, and Aramco then broaden the picture from individual proof points into adjacent demand
    surfaces. The result is a coherent customer thesis: Armada wins first where edge infrastructure is not an optimization but an operational prerequisite.'
