    - Upside
    - Microsoft and Second Front widen solution breadth for regulated buyers
    - Azure Local and Frontier run on Armada surfaces
    - Request which verticals or agencies moved from demo to paid production
  - - Geography and sector expansion
    - Upside
    - WinDC and Aramco show broader demand than one U.S. public-sector wedge
    - Australia and Saudi Arabia proof surfaced publicly
    - Request revenue mix by region and industrial segment
