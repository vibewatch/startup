- id: deployment-evidence-and-adoption-path
  title: Deployment proof is real, but maturity differs by account
  body: 'The best part of Armada’s customer chapter is that the proof is specific. Alaska DOT&PF describes a workflow that moved from memory cards and more than 28-hour delays to near-real-time decision support, with Data Center Dynamics reporting that the department now operates two Galleons. Washington DNR’s story is also operational rather than aspirational: Atlas replaced fragmented, P-card-driven Starlink buying with centrally managed connectivity for wildfire and remote-government use cases. UNITAS 2025 goes further on mission credibility because Armada says a Galleon and Atlas were used ashore and aboard ship, and multiple sources say the platform supported Flankspeed Edge and Minotaur workloads. Aker BP is different again: it is not a broad rollout, but a signed single-rig reference deployment explicitly intended to become a repeatable blueprint. Those distinctions matter. Alaska and Washington look like active use cases, the Navy looks like an operational exercise deployment, and
    Aker BP looks like a signed land-and-expand starting point. That is stronger than logo proof, but it is not the same as a mature, disclosed installed base with repeat economics.'
