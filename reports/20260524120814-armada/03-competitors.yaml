  - calloutType: insight
    title: The direct startup peer set is real, but still thin
    body: >-
      Public evidence supports Crusoe Spark and Nscale as the closest modular sovereign-AI peers, but Lambda
      looks more like a secure private-cluster substitute and the physical-infrastructure vendors look more
      like hardware-layer pressure than full-stack edge-AI equals.
    claimRefs:
      - CP026
      - CP029
      - CP033
      - CP046
  - calloutType: strength
    title: Armada's best wedge is orchestration on top of rugged deployment
    body: >-
      The strongest Armada-specific evidence is not just a metal box. It is the combination of Galleon,
      AEP/Bridge, Azure Local alignment, AI Grid orchestration, and public-sector distribution through
      Carahsoft.
    claimRefs:
      - CP004
      - CP006
      - CP007
      - CP009
      - CP045
  - calloutType: risk
    title: Hardware-only differentiation is the part of the moat most likely to compress
    body: >-
      Vertiv, Eaton, Schneider, and Rittal are all industrializing fast AI-ready modular infrastructure,
      while HPE and Dell package turnkey private AI for incumbent enterprise buyers. If Armada does not own
      the control plane and account path, better-capitalized players can absorb much of the box-level value.
    claimRefs:
      - CP035
      - CP036
      - CP040
      - CP047
      - CP048
