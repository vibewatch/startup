  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: armada-pricing
      missingEvidence: "Realized Armada contract pricing, ACV, services attachment, and hardware-versus-software gross-margin evidence against incumbent and substitute alternatives."
      whyItMatters: "Without realized pricing and margin evidence, it is hard to know whether Armada's differentiated deployments produce durable economics or only high-complexity custom deals."
      diligencePath: "Request cohort-level pricing waterfalls for representative Galleon plus AEP deals, including services, recurring software, and support components against comparable incumbent alternatives."
      relatedQuestionRefs: [QP025]
    - type: missing-source
      severity: material
      topic: direct-peer-coverage
      missingEvidence: "A source-retainable official or independent product surface for Oxigen or another suggested startup that clearly matches Armada's modular sovereign edge-AI scope."
      whyItMatters: "The direct startup peer set is thin, and unsupported names can distort the market map by implying false crowding or false differentiation."
      diligencePath: "Run another source-discovery pass for Oxigen and adjacent startups only if an official product page, deployment case, or reputable independent profile surfaces; otherwise leave it out of scored matrices."
      relatedQuestionRefs: [QP026]
    - type: private-evidence-only
      severity: material
      topic: armada-retention
      missingEvidence: "Win-loss, renewal, fleet-expansion, and deployment-standardization data for Armada relative to pilots or showcase deployments."
      whyItMatters: "Moat durability depends on whether Armada's first site becomes a repeatable program rather than a vivid but isolated deployment."
      diligencePath: "Request customer-cohort retention and expansion data, including how many deployments moved from trial or showcase into multi-site production rollouts."
      relatedQuestionRefs: [QP027]
    - type: private-evidence-only
      severity: material
      topic: channel-attribution
      missingEvidence: "Partner-sourced versus direct-sourced pipeline, bookings, and renewal contribution across Microsoft, Carahsoft, NVIDIA, and other channels."
      whyItMatters: "The chapter's GTM judgment depends on whether Armada owns the customer relationship or depends on partners that could redirect demand toward incumbent stacks."
      diligencePath: "Ask management for a channel-mix bridge by pipeline, bookings, and active deployments, including reseller-led versus direct-led deal ownership."
      relatedQuestionRefs: [QP028]
