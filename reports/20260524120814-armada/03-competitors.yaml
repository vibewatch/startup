chapter:
  number: 3
  title: Competitors
  summary: >-
    Armada is not fighting a crowded field of like-for-like rugged modular edge-AI startups. The closest
    direct public alternatives split between modular AI-factory challengers such as Crusoe Spark and
    Nscale, incumbent private/hybrid stacks from AWS, Microsoft, Google, HPE, and Dell, and physical
    infrastructure vendors such as Vertiv, Schneider, Eaton, and Rittal that can commoditize the box,
    power, and cooling layers. The most durable differentiation visible in Armada's own evidence is the
    combination of rugged deployable hardware, AEP/Bridge orchestration across existing and new sites,
    and partner-led distribution into sovereign and disconnected environments; the main risk is that
    incumbents and modular-infrastructure vendors can copy much of the physical layer while owning the
    customer relationship through deeper channels.
sections:
  - id: direct-peer-boundary
    title: The direct peer set is thinner than generic AI-infrastructure screens imply
    body: |-
      The public evidence does not support treating every GPU cloud or modular data-center vendor as a
      like-for-like Armada competitor. Armada's own product pages describe a combination of rugged,
      containerized Galleon hardware, AEP/Bridge orchestration, multi-tenant GPU monetization, and a
      partner marketplace that is supposed to turn remote infrastructure into a managed sovereign AI
      operating environment. On that definition, the closest publicly supported startup alternatives are
      Crusoe Spark and Nscale, because both talk in modular AI-factory language rather than only generic
      cloud capacity. Crusoe explicitly pitches turnkey prefabricated modular AI factories for low-latency,
      sovereign, and on-prem use cases, while Nscale combines sovereign modular data centers with a full
      software and fleet-operations stack.

      Lambda is an important substitute, but the evidence places it closer to a secure private-cluster and
      GPU-cloud alternative than to a rugged deployable field-data-center peer. Its strongest public
      differentiation is transparent GPU pricing, single-tenancy, and managed private-cloud Kubernetes.
      That matters because it reveals a real buyer alternative: many customers can solve the job by renting
      secure GPU capacity or standing up single-tenant clusters, without buying a ruggedized containerized
      deployment system. The chapter therefore treats direct competition as a thin set, substitute/private
      cluster competition as a separate class, and physical modular vendors as another class that attacks
      Armada's hardware moat from below.
