  - id: physical-layer-commoditization
    title: The hardware enclosure, power, and cooling layers are increasingly commoditizable
    body: |-
      Armada's physical product is differentiated today by portability, ruggedization, and integration, but
      the broader infrastructure market is moving quickly toward pre-integrated AI-ready pods, skids, and
      modular systems. Vertiv markets SmartMod, MegaMod, and OneCore around factory integration, multi-MW
      scale, rapid transport, and big claims on time-to-token, density, and TCO. Eaton and Flexnode pitch
      turnkey prefabricated AI factories for 3.5MW to 35MW data halls. Schneider's AI pod architecture is
      already designed around 1MW-plus high-density clusters, liquid cooling, and pre-assembled delivery,
      while Rittal is aligning OCP-inspired racks and water-based cooling to NVIDIA's emerging DC-power
      requirements. In other words, the physical layer is not static and it is not empty.

      This does not eliminate Armada's edge advantage, because most of these vendors are optimizing for
      enterprise, colo, hyperscale, and AI-factory deployment rather than a suitcase, 20-foot, or contested
      mission site. But it does mean that Armada cannot assume the enclosure, power train, or cooling stack
      remains unique for long. If customers view Galleon primarily as a fast modular AI-capacity box,
      better-capitalized vendors can pressure the category with adjacent offerings and established field
      service capacity. That pushes moat durability upward into orchestration, partner distribution,
      sovereign operating models, and proof that Galleon deployments stay valuable after the initial site
      goes live.
