      - number: '3.4'
        title: 分发能力和切换成本塑造真实输赢边界
        blocks:
          - type: paragraph
            body: >-
              本章最强的竞争证据，不是跑分功能，而是谁掌握通往买方的路径。Microsoft、HPE、Dell、NVIDIA 和 Carahsoft 都显示，渠道杠杆在主权和企业 AI 基础设施里有多重要。Armada 自己的
              Carahsoft 和 Microsoft 公告也强化同一点：公共部门和受监管买方通常希望在自己与原始基础设施供应商之间，有分销商、经销商网络、验证栈或在位云关系。Carahsoft 的 NVIDIA
              页面把这一教训扩展到 Armada 之外；公共部门 AI 市场靠集成商生态和合同载体流动，而不只是创始人直接销售。


              现状替代同样重要。买方往往可以留在集中式公有云 GPU 基础设施上，借助 Outposts 或 Azure Local
              延伸既有云栈，或者把计算留在安全私有集群里，而不是采用一种新的可部署边缘形态。锁定来源说明了这件事为何重要：计算本身可以迁移，但数据模型、身份、应用集成、IaC 和组织工作流会让退出云变得昂贵。这意味着
              Armada 不只是比性能；它还要对抗买方不愿增加新运营模式的惯性。AEP 和 Bridge 越能跨既有设施和客户自有基础设施运行，Armada 越能降低切换问题；如果越依赖专有硬件采购，买方池就越窄。
