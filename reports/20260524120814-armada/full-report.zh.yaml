      - number: '8.3'
        title: 私有市场类比支撑品类，但也抬高周期风险
        blocks:
          - type: paragraph
            body: >-
              私有市场类比确认，Armada 是在受益于一个活跃资本周期，而不是从零发明品类。Modular 在 2025 年宣布 $1.6 billion 估值，Crusoe 在垂直整合 AI 工厂基础设施规模化时披露了超过
              $10 billion 的 Series E。S&P、Reuters 和 Colliers 都指向同一个宏观事实：巨量资本正流入 AI 基础设施、数据中心和与电力绑定的建设。Armada
              的绝对金额估值因此在品类内有合理性，尤其是其产品和伙伴策略更接近基础设施，而不是纯企业软件。


              同一组来源也给出了反向逻辑。当一个市场正在吸收创纪录的基础设施募资、快速上升的建设成本、大量私募信贷使用，以及关于不透明融资结构的警告时，投资者应担心轮次规模和估值标签会跑在耐久经济性前面。Armada
              因而受益于当前私有 AI 基础设施买盘，也暴露于该买盘任何重估下行。公司的估值高于 Modular 披露值、远低于 Crusoe；这让本轮在语境中说得通，但不能让它自我证明。
