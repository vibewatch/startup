      - - 公开可比公司
        - 高溢价的公开基础设施公司说明，披露质量够好时，投资者愿意为战略基础设施付费
        - Armada 缺少这些公开可比公司提供的收入、利润率和利用率披露
        - 已披露收入，或能缩窄倍数不确定性的非公开尽调
      - - 资本周期
        - 大量基础设施资本可以继续给工厂和部署供血
        - 融资不透明、建设成本通胀和电力瓶颈会压缩整个赛道
        - 不只是融资成功，还要看到资本效率和锁定电力的管线证据
    notes: 估值案例对证据敏感：推高私募轮的同一股品类动能，一旦执行或融资透明度令人失望，也可能反转。
