      - number: '4.3'
        title: 公开可比公司给出很宽的利润率包络，这正说明 Armada 未披露组合很关键
        blocks:
          - type: paragraph
            body: >-
              Armada 不发布毛利率、贡献利润率、硬件物料清单或软件挂载率。因此，公开承销只能先从外部基准开始，而不是公司披露的单位经济学。在这组来源中，Vertiv 是最干净的硬件偏重基础设施类比：其 FY2024
              结果显示约 $8011.8 billion 销售额，服务约占收入 20.2%，隐含综合毛利率约 36.6%。当物理层占主导时，设备加服务基础设施模式可能就是这种样子。Pure Storage
              展示了截然不同的组合：FY2025 结果隐含产品毛利率约 66.1%、订阅服务毛利率 74.1%、综合毛利率 69.8%。如今更偏软件的 Nutanix，在 FY2024 Q4 报告 GAAP 毛利率
              85.2%，全年 84.9%，并同时给出 ARR 和 ACV 定义，且明确与 GAAP 时点脱钩。


              这些类比重要，因为 Armada 处在它们之间。Galleon 销售叠加部署、质保和现场支持，不应被硬塞进纯 SaaS 单位经济学模板。但 Bridge、Atlas 和 Marketplace
              也不能被忽略，因为它们是通往更高经常性毛利率的最明显路径。当前公开答案因此是一个包络，而不是一个点估计：如果 Armada 仍由硬件主导，利润率更可能像基础设施供应商而不是软件平台；如果 Bridge
              和其他经常性层增长快于硬件，利润率扩张可能显著。公开材料尚未显示哪条路径正在发生。
