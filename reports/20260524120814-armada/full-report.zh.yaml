      - - 订单额增长
        - FY25-26 为 540%；Q1 FY27 同比 2000%
        - 公司披露的需求信号
        - 不是确认收入，也不是毛利率
        - 支撑兴趣，但不是经济性证明
      - - 收入 / ARR / 毛利率
        - 未公开披露
        - 关键经济分母仍未公开
        - 不能拿订单额或融资标题来推断
        - 阻碍精确倍数测算
