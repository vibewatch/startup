      - number: '5.4'
        title: 部署速度、能源灵活性和液冷是实在的产品主张，Forge One 则是把架构变成制造能力的押注
        blocks:
          - type: paragraph
            body: >-
              Armada 的公开部署主张刻意激进：数周投运，而不是数年。支撑这一主张的最强产品证据来自预配置 Galleon、Microsoft 与 Armada 的 Azure Local
              集成叙事，以及一条公开信息：某盟友在 6 天内部署了一台 Triton。Leviathan 把这个故事从边缘计算延伸到模块化 AI 工厂基础设施。Armada 和 DCD 的独立报道都把 Leviathan
              描述为液冷、兆瓦级产品，Armada 还称它可以与闲置天然气、太阳能、核能及其他替代能源共址。Forge One 是把这份雄心落地的运营层。Armada 和 Johnson Controls 称，Arizona
              工厂最高可达 400,000 sq ft，创造约 500 个岗位，并以 Leviathan 启动连续生产；Johnson Controls
              则带来先进热管理能力和庞大全球现场服务队伍。这应能提升标准化和部署可重复性，但也把公司的执行负担从单纯软件交付，推向制造吞吐、热设计和能源设备。公开来源仍未披露 Forge One
              能生产多少单元、供应商瓶颈在哪里，或哪些场址准备假设必须成立，数周上线的主张才站得住。
