      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Armada
              的买方地图之所以有吸引力，正因为它高度碎片化。国防和公共安全交易通常靠韧性指挥、感知和本地分析来论证；能源和海上交易靠降低停机时间、在本地处理运营数据来论证；制造和采矿交易靠自动化、工人安全和预测性维护来论证；电信交易则靠把分布式
              AI 容量货币化，同时把延迟敏感负载留在用户和网络资产附近来论证。在这四类场景里，买方很少只是一个通用 CIO。预算权往往分散在运营、OT、安全、IT 基础设施、数字化转型，有时还包括任务或产品负责人之间。


              这种碎片化提高了销售复杂度，但也扩展了有效落地切入点。Microsoft 的 Azure Local 信息面向政府和受监管行业，Carahsoft
              为联邦、州、地方、教育和医疗买方把公共部门路径具体化，Ericsson 加 NTT DATA 则显示，私有 5G 加边缘 AI 正在制造、采矿、能源、交通和智慧城市环境中成为可重复的工业采购模式。Mitsui
              的投资逻辑从工业角度强化了同样的需求形态：当连续性、自主性和预测性维护必须在数据生成点工作时，本地 AI 才有价值。


              采用路径通常不是从第一天就企业级全面铺开。买方先从一个痛点明确、紧迫度高的工作流开始——例如 Alaska 的无人机影像周转、海军或应急响应任务、海上钻井工作流，或电信区域 AI
              部署——等本地计算证明价值后再标准化。因此，伙伴渠道和实施能力本身就是市场的一部分。在 Armada 的品类里，分发不只是看谁签
              PO，也要看谁能足够快地降低部署风险，让客户从单个加固站点走向车队、区域或主权云标准。
