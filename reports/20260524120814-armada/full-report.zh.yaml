      - 控制什么
      - 谁受益最大
      - 竞争影响
      - 锁定或杠杆效应
    rows:
      - - Microsoft
        - Azure Local 软件平面、主权私有云品牌、既有企业和政府账户
        - Azure Local、Azure 技术栈合作伙伴，以及任何借 Microsoft 主权叙事切入的厂商
        - 可以与 Armada 合作，同时仍掌握控制平面和客户关系
        - 提高买家信任度，但也可能限制 Armada 独立拥有账户
      - - NVIDIA
        - 参考架构、GPU 路线图、AI Enterprise 软件和生态验证
        - Dell、HPE、Armada、Carahsoft 及其他系统构建商
        - GPU 生态替 Armada 背书，但多家厂商都继承同一套参考栈，差异化也被压低
        - 权力转向最会把 NVIDIA 技术栈打包进客户账户的一方
      - - Carahsoft
        - 公共部门合同工具、经销商生态、演示 / 采购界面
        - Armada、NVIDIA 及其他瞄准政府和受监管买家的厂商
        - 公共部门进入市场可以由合作伙伴撮合，而不必直销
        - 不只靠技术，也靠合同和经销商关系抬高切换成本
      - - Dell
        - OEM 制造规模、服务、装机基础和账户覆盖
        - Dell AI Factory 以及对齐 NVIDIA 的企业 AI 交易
        - Dell 可以把 AI 基础设施变成既有企业账户里的标准 OEM 增购
        - 大型 OEM 触达面会压缩小厂商赢下通用企业交易的窗口
      - - HPE 和全球系统集成商
