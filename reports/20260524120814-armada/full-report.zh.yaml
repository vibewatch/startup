  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行风险占主导，因为 Armada 正从证明点扩到工业化产出
        blocks:
          - type: paragraph
            body: >-
              Armada 不像一家还在找用例的公司。公开证据显示，国防、州政府、海上能源和主权私有云都有真实需求面。风险在于，公司正大幅跨越运营复杂度，同时外部预期也在抬升。Series B、Johnson Controls
              框架协议和 Forge One 发布，把 Armada 从交付加固单元推到证明 Leviathan 及更广泛 Galleon
              需求可以连续生产。承销问题因此从产品是否可信，变成制造、部署和现场运营能否在客户耐心或资本市场容忍度耗尽之前规模化。


              公开记录中最强的反向事实不是需求弱，而是收入不透明。Armada
              披露的是订单额增长，不是收入、ARR、毛利率、待交付订单转收入，或收入确认政策。投资者因此能看到需求加速，却看不出它多快转为已确认收入或耐久的装机经济性。公开客户证明集也仍相对集中在少数具名参考，其中几项是演习或单一参考部署，而不是已披露的大规模部署。因此，最主要的剩余风险是工厂执行、订单额转收入、集中度和合规复杂度，而不是市场缺席。
