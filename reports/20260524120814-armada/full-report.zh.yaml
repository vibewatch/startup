      - number: '3.2'
        title: 在位混合云和私有云栈掌握最广渠道与最安全采购路径
        blocks:
          - type: paragraph
            body: >-
              AWS Outposts、Azure Local、Google Distributed Cloud、HPE Private Cloud AI 和 Dell AI Factory
              是主流企业和主权买方最重要的实际替代方案，因为它们把熟悉的控制平面和既有客户关系打包在一起。Outposts 在三年商业结构下，把部分 AWS 服务延伸到客户设施和托管站点。Azure Local 把 Azure
              Arc 延伸到合作伙伴或验证硬件上，并包含一条离线控制平面路径；Microsoft 与 Armada 的合作本身也说明，该公司可以一边与 Armada 合作，一边争夺主权私有云控制权。Google
              Distributed Cloud 给出更清晰的主权和隔离反击：它是一套由 Google 全托管的硬件加软件栈，用于数据中心和边缘位置，Gemini 可本地运行，并提供隔离选项。


              HPE 和 Dell 重要，是因为它们缩短了超大规模云软件与企业 OEM 采购之间的距离。HPE 把购买决策明确框定为自建、参考架构服务和交钥匙之间的选择；Dell 则推动一套模块化架构，拥有超过 4,000
              个客户部署和广泛专业服务支持。这一组合是 Armada 最大的分发挑战。买方如果想要本地 AI，但不需要加固型前置部署盒子，就可以留在既有 Microsoft、AWS、Google、HPE 或 Dell
              关系内，同时拿到 Armada 宣传的大部分主权、延迟和治理收益。
