      - number: '6.4'
        title: 主要客户风险不是相关性，而是转化、留存和集中度
        blocks:
          - type: paragraph
            body: >-
              反向读法很直接。Armada
              的公开客户故事更擅长说明产品能做什么，而不是这些账户的收入随时间如何表现。已审阅来源没有披露客户数、NRR、GRR、客户流失、任务订单历史或账户级扩张经济性。因此，公开证明以案例和合作伙伴为主，而不是以队列数据为主。这带来三类承销风险。第一，集中度风险可能很有意义，因为具名证明集仍然小，并集中在少数展示账户。第二，即便底层技术可行，试点转生产风险仍真实存在；独立企业
              AI 研究仍警告，成功试点常常因治理、运营模式和生产执行落后于演示而无法规模化。第三，即便有有用的转售商和采购改革，公共部门转化仍可能受采购流程中介。Carahsoft 降低摩擦，FY2026 NDAA
              改革也旨在加快商业技术采购，但两者都不等于已披露复购订单。简言之，Armada 的客户证据足以证明相关性和早期采用，但公共数据还不足以证明耐久性或广泛收入多元化。
