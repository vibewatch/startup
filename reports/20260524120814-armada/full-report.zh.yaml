      - number: '3.5'
        title: Armada 的护城河真实存在，但主要在软件、渠道和部署速度耐久性
        blocks:
          - type: paragraph
            body: >-
              证据支持对 Armada 差异化作更细的判断。公司确实有真实楔子：加固型模块化部署、隔离和离线运行、Azure Local 对齐、借 Bridge 和 AEP 形成的 GPU 货币化与编排层，以及借
              Carahsoft 获得的具体公共部门渠道。这比纯 GPU 云更有差异化，也比标准企业私有 AI 栈更能现场部署。它也解释了为什么 Armada 可以看起来像 Microsoft 和 NVIDIA
              的伙伴，同时又与其他购买本地 AI 容量的方式竞争。


              同一组证据也给护城河乐观设下硬边界。Lambda 透明定价、HPE 和 Dell 交钥匙栈、Google 和 AWS
              混合产品，以及快速进步的模块化基础设施供应商，都说明盒子层面的独特性会被压缩。耐久问题在于，Armada 的控制平面、伙伴触达和远程站点执行质量，能否成为主权和离线 AI 部署的默认运营层。如果能，Armada
              可以在集中式云和商品化模块化硬件之间占据可防守品类；如果不能，在位者可以吸收软件层，物理供应商可以压缩硬件层，Armada 则有风险变成一个形象鲜明但更窄的系统集成商。
