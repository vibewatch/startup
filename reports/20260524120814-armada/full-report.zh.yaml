      - number: '2.5'
        title: 增长驱动、采用约束，以及什么会打破多头逻辑
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动清晰可见，而且相互强化。IDC 的支出数据表明，AI 基础设施已经进入多年资本周期。JLL 称推理正变得比训练更重要，并将需要更多区域和边缘部署。Deloitte
              说明主权不是小众话术，而是活跃投资议程，在欧洲尤其如此。国防和工业来源又补上第二个驱动：确有一些环境需要本地计算，因为间歇连接、延迟或现场自主性会让集中式处理太慢或太脆弱。Armada
              还有一个产品层面的部署速度楔子：在建设、许可和场地准备可能耗时数年的市场里，数周可运行的基础设施本身就有价值。


              约束同样真实。JLL 称主要市场并网等待超过四年，AI 装配成本可达每 MW $25 million；Vertiv、Schneider 和 Data Center Knowledge
              都把电力和高密度基础设施描述为设计限制因素。Uptime 又给出两个警示信号：市场仍面临人员短缺和成本压力，而且大量 AI
              基础设施需求集中在超大规模云厂商和其他资本充足的玩家手里。换句话说，这个品类很大、很急迫，但并不顺滑。具体到 Armada，这意味着制造执行、渠道杠杆和部署复杂度，与顶线需求一样重要。


              因此，模块化数据中心估算互相矛盾，并不是记账麻烦，而是在提醒：品类成熟度仍不均衡。如果电力、许可和集中度继续拖慢市场转化，或者电信和主权 AI
              项目持续停留在大量试点阶段，可触达市场的扩张速度就可能慢于标题级资本开支数字。正确的尽调重点不是抽象地判断市场是否很大——它确实很大——而是判断 Armada
              能否在这个品类的基础设施瓶颈和买方复杂度开始偏向更大在位者之前，拿到可重复预算线。
