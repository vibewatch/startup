      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Armada 的公开叙事由创始人驱动。Dan Wright 是联合创始人兼 CEO，也是融资、使命叙事和外部合作中最显眼的公众面孔；公开资料反复把 Armada 的起源故事锚定在 Wright 此前在
              AppDynamics 和 DataRobot 的运营岗位上。联合创始人兼 COO Jon Runyan 则带来 Okta 的企业法务和公司建设经验，在 Armada 早期产品和投资人沟通中，扮演 Wright
              商业化画像的运营补位。技术侧，Pradeep Nair 一直被标注为创始 CTO，Armada 官方资源页和 Forbes 报道则将 Prag Mishra 标注为 Chief AI Officer。

              这组领导班子对企业销售和应用 AI 商业化有利，但也带来集中风险。Wright 贯穿
              CNBC、投资人、伙伴和公司材料，是关键公众面孔；一旦领导层出现扰动，融资、招聘和战略叙事很可能受到不成比例的影响。治理披露仍是薄弱环节。已抓取的 2026
              年公开材料能支撑高管画像，但没有给出清晰的现任董事会名单、委员会结构或投资人控制权视图。因此，后续阶段尽调可以把公开领导层可见度视为足以做团队映射，但不足以完成完整治理或控制权分析。
