      - number: '4.4'
        title: 工厂规模、模块化部署和兆瓦级产品让资本强度在客户自有经济性披露之前就已经成立
        blocks:
          - type: paragraph
            body: >-
              资本充足性问题与公司概览里的历史融资时间线有实质差异。财务承销需要看的公开事实是，Armada 披露总融资 $465 million，其中包括 2026 年 5 月 $230 million Series
              B、2025 年 7 月 $131 million 战略轮，以及 2024 年 7 月 $40 million 轮。最新一轮与 Johnson Controls 制造协议和 Arizona Galleon
              Forge One 计划同步发生。Johnson Controls 另行确认，面积最高 400,000 平方英尺、约 500 个岗位，并从 Leviathan
              开始连续生产。这组事实意味着资本强度并非假设：Armada 正围绕兆瓦级液冷产品爬坡一个真实制造足迹。


              仍不清楚的是，已披露资金是否足以覆盖最关键用途。公开来源没有说明 Series B 中有多少预留给工厂工装、预付款、GPU
              库存、部署营运资本或运营消耗。公开可比公司显示，数字基础设施可以很快变成资产负债表重型业务。Equinix 作为自有基础设施模式，指引 2025 年总 capex 为 $3.222-$3.472
              billion，并解释即使经常性安装经济性也可能与收入确认不同步。Moody's 和 Data Center Knowledge 进一步警告，如果需求或技术对已安装基础不利，交钥匙 AI
              数据中心资产会面临过度建设、过时和资本开支更新风险。Armada 近期资本可能仍然充足，但公开记录不够细，无法有信心地承销这一结论。
