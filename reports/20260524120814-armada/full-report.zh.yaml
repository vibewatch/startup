  - id: TV005
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 当前公允价值区间
      - 核心假设
      - 必须成立的条件
      - 概率信号
      - 相对 $2.23B 投后估值
    rows:
      - - 悲观
        - $1.2B-$1.7B
        - 订单额转化慢，Forge One 爬坡不均衡，电力或场址就绪拖慢部署，公开市场倍数压缩
        - 经常性软件证据出现前，硬件营运资金先主导经济性
        - 如果 2026 年工厂节奏或转化开始滑坡，该情景就有分量
        - 当前估值标记的 ~0.5x-0.8x
      - - 基准
        - $1.8B-$2.5B
        - 订单额转化可接受，Forge One 开始连续生产，Bridge 或 Atlas 展现可信的经常性附加收入，但还不足以获得完整软件重估
        - Armada 变成可复制的混合基础设施平台，而不是一次性项目供应商
        - 当前最站得住脚的公开证据情景
        - 当前估值标记的 ~0.8x-1.1x
      - - 乐观
        - $3.0B-$4.5B
        - 主权部署可重复，软件控制平面变现清楚，客户更分散，资本市场对 AI 基础设施的胃口持续
        - Armada 更像主权 AI 工厂的规模化运营层，而不是硬件供应商
        - 需要尚未公开的私有证据
        - 当前估值标记的 ~1.3x-2.0x
    notes: 区间按里程碑分带，并非来自未披露收入；它们把公开参照样本、资本强度和执行证据转成方向性价值区间。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV043
      - CV044
  - id: TV006
    title: 投资逻辑破裂与叫停触发器表
    columns:
      - 触发因素
      - 阈值
      - 如何冲击投资逻辑
      - 监测节奏
      - 行动含义
    rows:
      - - 订单额无法转化
        - 多个季度后，订单额与确认收入之间仍没有可信桥梁
        - 增长叙事转成订单质量风险
        - 季度 / 尽调更新
        - 转为回避，或要求更低估值
      - - 工厂爬坡滑坡
        - Forge One 错过连续生产时间点，或出现明显良率 / 供应链问题
        - 削弱规模化故事，并消耗资本
        - 月度运营复盘
        - 暂停投资测算，直到吞吐量证据恢复
      - - 电力或场址就绪停滞
        - 客户出现重大延误，原因指向并网、公用事业押金或建设瓶颈
        - 固定成本堆起来，部署时间被推后
        - 按场址跟踪管线
        - 将价值区间下调至接近悲观情景
      - - 软件附加仍弱
        - Bridge / Atlas 仍只是战略包装，而非已变现的经常性收入层
        - Armada 仍落在硬件主导估值桶里
        - 合同与产品组合复盘
        - 不要按溢价软件倍数做投资测算
      - - 融资条款不透明
        - 优先权堆叠或结构让新资金承担不利的下行不对称
        - 即使业务跑成，也会压低股权上行空间
        - 条款清单审阅
        - 重新定价或退出
    notes: 在完整运营历史公开之前，这些是 2026 年 5 月估值逻辑最容易被观察到的破裂方式。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV007
    title: 最终尽调索取清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 决策影响
    rows:
      - - 收入—订单额桥梁
        - 按季度确认收入，对照订单额和积压订单
        - 判断需求是否变成真实经济性
        - 财务资料室 + 董事会材料
        - 最高
      - - 按层拆分毛利率
        - 硬件、部署、支持、Bridge 和 Atlas 的毛利率结构
        - 决定应落入哪个公开可比公司估值桶
        - 财务资料室 + 产品 P&L
        - 最高
      - - 营运资金和资本开支
        - 库存、应收款、客户定金、工厂工装和公用事业押金
        - 检验 Series B 是在资助规模化，还是只填到下一轮融资前的缺口
        - 财务 + 运营
        - 最高
      - - 按金额看客户集中度
        - 头部客户、头部行业，以及续约 / 扩张依赖
        - 判断收入韧性和下行集中度
        - 销售运营 + 财务
        - 高
      - - 工厂吞吐量
        - Leviathan 产线速率、供应商就绪度、QA 指标和现场服务闭环
        - 验证 Forge One 是催化剂还是新瓶颈
        - 运营尽调
        - 高
      - - Series B 优先权条款
        - 清算优先权、参与权、反稀释，以及任何结构化附函
        - 改变新资金的实际回报分布
        - 法务 + 融资文件
        - 最高
    notes: 这些私有事实最可能把本轮从偏高推向合理，或从观察推向回避。
    claimRefs:
      - CV041
      - CV042
      - CV045
