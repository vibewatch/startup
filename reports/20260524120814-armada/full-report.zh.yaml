            body: >-
              Armada 下一层客户证据并不总是具名付费终端用户；很多时候，它是让未来获客更可信的渠道或合作伙伴入口。Carahsoft 是最干净的例子。Reston 体验中心和转售商页面显示，Armada
              已经拥有跨多个合同工具的公共部门采购路径；更早的 Commander Connect 文章也显示，Starlink 加 Armada 软件可以通过 NASPO 触达州和地方买家。Microsoft 通过把
              Armada 包进 Azure Local 和面向国防、公共安全、能源及受监管行业的主权私有云叙事，进一步加深了这种入口。Second Front 在这套基础设施之上补充了任务关键国防软件证明，Skydio
              则延伸了国家安全和公共安全无人机故事。美国公共部门之外，WinDC 和 Aramco 展示了向可再生能源驱动的 AI 基础设施和工业分布式云部署扩展；DOE Genesis Mission
              则显示公司进入了大型联邦科学计划的合作者名单。这些都不能替代硬性的续约或 ARR 证据，但合在一起说明 Armada
