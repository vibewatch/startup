      - number: '7.2'
        title: 主权 AI 扩张放大市场，也增加出口、采购和网络义务
        blocks:
          - type: paragraph
            body: >-
              Armada 的主权 AI 定位之所以有商业吸引力，正是因为它落在比普通云转售更难的监管和运营环境里。Microsoft 合作明确瞄准国防、政府和受监管行业，Carahsoft 与 UNITAS
              也显示公共部门和军事暴露不是假设。但同样的市场路径也带来更多义务。BIS 对先进计算出口的更新提高了芯片来源、最终用途筛查和转移控制的重要性。EU AI Act 实施栈为跨境部署再加一层文档、透明度，以及高风险
              / 通用模型义务。与此同时，FY2026 NDAA 及相关国防指引显示，DoD 买家正在提高对 AI 治理、测试、采购要求和能源感知数据中心规划的期待。


              网络安全和安全负担会随着部署环境而上升。CISA 的 AI-in-OT 指南和 DoD 的 AI 网络安全定制指南，都把运营 AI 描述为生命周期治理问题，而不是简单的软件补丁问题。对 Armada
              而言，这意味着在对抗性、断连或工业环境中的主权部署，不仅要满足可用性目标，还要满足模型、数据、基础设施和供应链控制。已审阅来源包中没有发现 Armada
              专属公开执法行动或已披露重大网络事件，但这种缺席应被解读为证据边界，而不是合规负担低的证明。
