  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 方向性的价值区间解释了为什么 Armada 只有在基准情形下大致定价合理，只有在牛市情形下才明显有吸引力。
    data:
      items:
        - label: 官方轮次定价
          low: 2
          mid: 2.23
          high: 2.23
          unit: $B
          note: 低位是官方投前估值；中位 / 高位展示隐含投后入场估值
        - label: 熊市公允价值
          low: 1.2
          mid: 1.45
          high: 1.7
          unit: $B
          note: 订单转收入滞后，工厂 / 电力摩擦主导
        - label: 基准公允价值
          low: 1.8
          mid: 2.15
          high: 2.5
          unit: $B
          note: 混合基础设施验证改善，但完整的软件重估还没到来
        - label: 牛市公允价值
          low: 3
          mid: 3.75
          high: 4.5
          unit: $B
          note: 主权部署可复制，控制平面变现有分量，才撑得起溢价
    approximationNotes: 这些是按里程碑分段的估值区间，不是来自未披露收入模型的输出。
    claimRefs:
      - CV004
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV043
      - CV044
  - id: FV003
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 围绕基准情形，最大驱动因素是软件附加、工厂执行，以及全市场基础设施估值下修。
    data:
      items:
        - label: Bridge / Atlas 形成有分量的经常性收入
          value: 0.6
          unit: $B
          detail: 如果控制平面变现真实且持久，就有上行空间
        - label: 订单顺畅转为确认收入
          value: 0.4
          unit: $B
          detail: 如果订单质量和收入确认节奏都证明强劲，就有上行空间
        - label: Forge One 爬坡错过时间或良率
          value: -0.7
          unit: $B
          detail: 最大下行点，因为规模化叙事依赖工厂
        - label: 公开市场 AI 基础设施倍数下修
          value: -0.5
          unit: $B
          detail: 即便 Armada 执行到位，品类压缩也会冲击估值
        - label: 电力 / 场地就绪拖慢部署
          value: -0.35
          unit: $B
          detail: 项目可能顺延，但需求不一定完全取消
        - label: 资本效率和营运资本纪律超预期
          value: 0.3
          unit: $B
          detail: 增强信心：本轮资金是在支撑规模化，而不只是撑到下一轮融资
    approximationNotes: 敏感性数值是围绕基准情形中点的方向性估值变化，不是经审计预测的输出。
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV039
      - CV040
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 紧凑的 IC 式评分解释了为什么公司可以有吸引力，但当前公开估值仍缺少干净支撑。
    data:
      items:
        - label: 市场拉力
          value: 8
          detail: 需求浮出水面，资本周期也强
        - label: 产品 / 护城河
          value: 7
          detail: 混合硬件加主权控制平面论点有差异化
        - label: 客户验证
          value: 7
          detail: 已有具名部署，但经济性仍未披露
        - label: 经济性可见度
          value: 3
          detail: 收入、ARR、利润率和转化仍未公开
        - label: 执行负担
          value: 4
          detail: 工厂、电力和营运资本负荷都是高风险变量
        - label: 估值支撑
          value: 4
          detail: 当前轮次可以理解，但谈不上明显有吸引力
        - label: 证据质量
          value: 4
          detail: 公开数据足以划出区间，但不足以形成强确信
    approximationNotes: 评分只是方向性的投资判断辅助，不是机械投资公式。
    claimRefs:
      - CV006
      - CV007
      - CV025
      - CV035
      - CV043
      - CV044
