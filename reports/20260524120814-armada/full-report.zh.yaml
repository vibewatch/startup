  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 替代方案
      - 公开定价情况
      - 合同 / 打包方式
      - 包含能力
      - 影响
    rows:
      - - Armada
        - 未找到公开标价证据
        - 硬件叠加 AEP/Bridge 软件与合作伙伴生态；定制化企业销售
        - 坚固化模块化站点、编排、连接管理、Marketplace、主权部署叙事
        - 定价不透明，ACV、服务附加率、硬件与软件收入占比都需要尽调
      - - AWS Outposts
        - 有官方定价结构，但配置选择需定制
        - 3 年期；可全额预付、部分预付或不预付；必须购买 Enterprise Support
        - 交付、安装、服务、EC2/EBS/S3 基础容量、本地 AWS 服务
        - 商务结构对 AWS 买家熟悉，但可能把客户锁进 AWS 支持与续约机制
      - - Azure Local
        - 按物理核心收取月度服务费
        - 已验证合作伙伴硬件，或在符合条件的硬件上自安装；60 天试用
        - Azure Arc 管理，AKS on Azure Local 不额外收费，可选 Windows Server 订阅
        - Microsoft 存量客户切入摩擦较低；仍需要 Azure 订阅和合作伙伴硬件路径
      - - Google Distributed Cloud 联网版
        - 公开起步价
        - 基于 Google 认证硬件的托管基础设施；每站点至少 96-vCPU
        - 面向容器和 VM 的托管 Kubernetes 基础设施与存储
        - 适合想要 Google 技术栈、但不需要定制坚固化硬件的受监管站点
      - - Google Distributed Cloud 气隙隔离版
        - 报价制
        - 气隙隔离托管部署
        - 面向主权和断网运行的气隙隔离软硬件栈
        - 主权叙事强，但公开定价仍不透明
      - - HPE Private Cloud AI
        - 按报价 / 范围核定
        - GreenLake 主导的交钥匙私有云，配置按需匹配
        - 预配置且验证过的技术栈、统一数据层、NVIDIA 软件、可观测性、合作伙伴生态
        - 靠降低集成负担竞争，目标是原本会自建的企业买家
      - - Dell AI Factory
        - 有用量制和即用即付选项，但未找到标价
        - 模块化架构叠加服务，覆盖桌面到数据中心
        - 服务器、网络、软件、服务、液冷、自动化平台
        - 即便没有公开标价，强企业销售动作也会挤压小厂商
      - - Lambda
        - 透明的公开小时定价
        - 按需实例，加上 1-Click 集群和预留容量销售
        - 单租户安全 GPU 云、私有云集群、托管 Kubernetes
        - 透明 GPU 价格给不透明的定制基础设施方案设下可见锚点
      - - AWS 公有云 GPU 区域
        - 公开实例族页面；按用量计费的云定价
        - 集中式云区域消费
        - 无需本地站点部署的加速计算
        - 当本地主权、延迟或断网运行并非决定因素时，它就是默认替代方案
    notes: >-
      公开定价可得性差异很大。Armada、HPE、Dell 以及大多数模块化物理设施厂商仍需尽调实际商务条款；Azure Local、Google Distributed Cloud 联网版和 Lambda
      至少给出部分公开价格锚点。
