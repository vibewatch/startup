      - number: '7.5'
        title: 有缓释项，但投资逻辑仍取决于尚未公开的证据
        blocks:
          - type: paragraph
            body: >-
              缓释故事足够可信，能让 Armada 仍具可投资性。Johnson Controls 降低热管理和制造执行风险。Microsoft 与 Carahsoft
              降低渠道和主权叙事风险。恶劣环境案例证明，标准云模式失效时，这个产品有价值。但缓释逻辑仍主要来自架构和合作伙伴；还没有配套的公开运营披露，让投资者可以实质性下调风险。我们仍没有 Forge One
              的公开吞吐数据、从订单额转收入的披露、按金额计算的客户集中度、详细合规包，或达到法律顾问级别的诉讼和事件检索结果。


              因此，风险章节应被读作一个可监测的承销框架，而不是静态风险信号清单。如果 Forge One 爬坡明显失手，如果公共部门采购周期拉长且客户集中度仍高，如果合规打包落后于主权 AI
              雄心，或公司不得不在尚未证明硬件加软件经济性之前为硬件式营运资本融资，投资逻辑就会断裂。当前公开证据支持真实机会和真实缓释，但还不足以让人忽视狭窄执行窗口。
