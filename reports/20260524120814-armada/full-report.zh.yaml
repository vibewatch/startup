chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与商业模式
        blocks:
          - type: paragraph
            body: >-
              Armada 由 Dan Wright 和 Jon Runyan 于 2022 年底创立，2023 年 12
              月走出隐身状态，总部位于旧金山。公开材料一直把公司定位为私营、全栈边缘基础设施企业，主张把计算、存储、连接和 AI 推近数据产生地，以此「弥合数字鸿沟」，而不是让所有负载都回流到集中式云。2026 年 5 月
              Series B 之后，这一定位已经和公司阶段绑定：Armada 不再只是在销售加固型边缘计算产品，而是在推一个更宽的主权 AI 平台，面向工业、国防、公共部门和受监管负载。

              到 2026 年，运营栈比发布初期清晰得多。Armada 当前组合包括：Atlas 用于监测和管理联网资产，Galleon 用于加固型模块化数据中心部署，Marketplace
              用于在边缘部署第三方硬件和软件，Bridge 用于把 GPU 集群编排并货币化为主权 AI 工厂。合起来看，商业模式是硬件加软件，而不是纯 SaaS：Armada
              销售可部署基础设施，再叠加控制软件、应用分发和伙伴集成，让客户在连接不稳定或主权要求严格的地方运行推理、分析或私有云负载。
