      - number: '8.4'
        title: 用里程碑分档情景框架，比假造收入模型更诚实
        blocks:
          - type: paragraph
            body: >-
              因为 Armada 当前收入不公开，精确 DCF 或当前收入倍数模型都是伪精确。更可防守的替代方案是里程碑分档。基准情景假设：订单额开始在可容忍时间内转为已确认收入；Forge One
              达到连续生产，没有可见良率冲击或营运资本冲击；Bridge 或 Atlas 证明自己是真正的经常性附加层，而不只是战略包装。在这种状态下，Armada 有可能长进当前投后标记，甚至小幅超过。


              悲观情景更简单，也更危险。如果订单额始终和已确认收入脱节，如果工厂爬坡或场址电力把部署时间向右推，或硬件营运资本比预期更快吃掉新融资，投资者可能迅速把 Armada
              重估到多元化或硬件重型基础设施先例的低端。乐观情景需要的不只是更多客户标识：它需要重复的主权或受监管部署、可观察的软件控制平面货币化，以及可信证据证明 Armada
              正成为运营层，而不只是箱体供应商。因此，敏感性更多落在执行、附加销售和融资质量上，而不是某个隐藏收入数字。
