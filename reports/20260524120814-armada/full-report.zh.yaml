      - number: '7.4'
        title: Armada 最好的商业助推器也是集中点
        blocks:
          - type: paragraph
            body: >-
              Armada 的合作伙伴栈是优势，也是公司主要依赖关系的地图。Microsoft 扩展了主权云控制平面，并给 Armada 一个面向受监管买家的验证叙事。Carahsoft
              降低联邦、州、地方、教育和医疗账户的采购摩擦。Johnson Controls 提供制造和热管理深度。这些关系降低了获客和交付风险，但也意味着规模越来越依赖 Armada
              不能完全控制的交易对手。合作伙伴路线图停滞、联合销售放慢，或渠道优先级下降，都可能收窄 Armada 进入那些当前让故事可投资的行业的路径。


              即使没有私有收入数据，客户集中度风险也看得见。公开证明集仍集中在少数具名公共部门、国防和工业参考账户周围，几项旗舰胜单也被明确描述为演习或单一参考系统，而不是大规模铺开。竞争压力会放大集中度风险。CoreWeave
              的 10-K 是有用的行业类比，因为它显示 AI 基础设施公司可以长期高度集中，并面对更大云厂商的竞争；这些厂商能打包更广产品，并利用既有客户关系。Armada
              仍未披露通常能缓释这些风险的指标：收入、ARR、利润率、待交付订单转化和营运资本结构。因此，即便完成大额 Series B，融资依赖仍然真实存在。
