      - number: '8.5'
        title: 公开证据支持观察或继续研究，但必须设明确断点触发器
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，正确结论不是买入。按可比公开和私有基础设施公司的体量看，绝对金额估值并不荒谬；但证据质量太薄，不能称价格有吸引力。关键经济和股权结构披露仍缺失，最重要的承销驱动因素现在落在工厂吞吐、订单额转化、软件附加销售和融资纪律上。这一组合足以让
              Armada 作为公司保持可投资性，但不足以从本轮融资中移除价格敏感性。


              实际含义是，把 2026 年 5 月轮次当作带里程碑门槛的观察或继续研究情形。如果收入转化、利润率分层和 Forge One
              执行得到证明，公司可以长进甚至超过当前标记。如果不能，下行路径很直接，因为这个品类已经有低倍数的混合型和硬件重型类比。因此，本章正确的最终输出是：估值立场偏高，置信度中等，执行风险高，尽调计划聚焦少数真正能改变承销判断的私有事实。
