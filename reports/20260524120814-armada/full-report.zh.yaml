              公开称，这条产品线从手提箱大小的 Beacon，到带 3 个计算机架的 20-foot Cruiser，再到带 5 个计算机架的 40-foot Triton，最后延伸到兆瓦级液冷
              Leviathan。同一组来源也支撑一个务实部署判断：Galleon 预装计算、网络、存储、供热和制冷；Armada
              称它可在数周内投运，而不是数年；本地处理工作流也明确设计成只把任务关键的信息回传云端，从而减少回传链路负担。仍缺的是各 SKU 在功耗、存储和网络上的精确边界，公开材料只给了这些宽泛描述。
