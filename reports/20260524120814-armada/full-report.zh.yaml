      - number: '1.4'
        title: 部署、伙伴与商业足迹
        blocks:
          - type: paragraph
            body: >-
              Armada 的商业证明，在具名部署和行业宽度上强于传统 SaaS 指标。公司 2024 年披露，客户已经把其技术带到 43 个国家；到 2025-2026 年，公开来源点名了与 U.S. Navy、Alaska
              DOT&PF、Washington DNR、Aker BP 及其他工业或公共部门运营方的标杆部署。用例内部一致：在延迟或连接性会打断云工作流的地方处理数据，再把 AI
              或自动化用于海上钻井平台、野火作业、国防演练和偏远现场基础设施等环境。

              客户案例呈现出同一种模式。Alaska DOT&PF 使用 Atlas 和 Galleon，把无人机影像周转从多日或 28 小时以上缩短到当天或实时输出。Washington DNR 用 Atlas 集中管理约
              45 台 Starlink，支撑野火响应和远程作业。Armada 参与 UNITAS 2025，把 Galleon 和 Atlas 带入 U.S. Navy 的岸上和舰上演练；Aker BP
              则同意在挪威大陆架部署一套 Galleon，用于海上钻井工作流。围绕这些部署，Armada 搭起了包括 Microsoft、NVIDIA、Palantir、Dell、Skydio 以及 Carahsoft
              关联公共部门渠道的伙伴层，强化了公司的核心主张：它销售的是系统化的主权 AI 能力，而不是单个盒子或一张软件许可。
