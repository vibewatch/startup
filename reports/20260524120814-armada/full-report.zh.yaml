  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式明显是硬件加软件和渠道赋能，但实际组合仍未公开
        blocks:
          - type: paragraph
            body: >-
              Armada 的公开材料支持多线收入模式，而不是纯产品或纯 SaaS 框架。Galleon 是物理系统销售：从较小现场单元到兆瓦级 Leviathan 的加固型模块化数据中心。Bridge
              是最清晰的软件货币化界面。Armada 现在称 Bridge 是用于管理、扩展和货币化 GPU 集群的软件；更新的 Bridge 材料进一步说明，定价基于活跃 GPU 使用量，并按 GPU/year 或
              GPU/hour 结构计费。同一组来源也明确，Bridge 可以运行在客户自有基础设施上，不只跑在 Armada 硬件上；这很重要，因为它意味着即使客户不购买新的
              Galleon，控制平面也可能成为经常性软件收入线。Atlas 和 Marketplace 扩展了这幅图景：Atlas 是带有 pooled data-plan 和 Azure 集成语言的管理平台，Bridge
              和 Marketplace 材料则描述了伙伴软件和模型服务，能把基础设施转成可创收的 AI 能力。


              公开记录没有披露的是这些收入线之间的实际组合。没有发布 Galleon 硬件、Bridge、Atlas、Marketplace、部署工作或支持之间的拆分。这一缺口对承销至关重要。如果硬件占主导，Armada
              的估值应更接近资本密集型基础设施供应商；如果软件和服务挂载率随时间占优，毛利率和倍数画像可能显著上移。因此，本章把多重收入界面的存在视为已确认，但每个界面的实际经济权重仍视为私有信息。
