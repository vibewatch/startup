      - number: '4.5'
        title: 关键承销问题不是需求是否存在，而是隐藏的组合和现金画像能否支撑估值
        blocks:
          - type: paragraph
            body: >-
              财务章节可以支持需求叙事，但不能闭合承销回路。公开证据支持 Armada 是一家真实业务，具备硬件、软件、渠道触达、主权 AI
              定位和快速增长的订单额。公开证据也支持一个判断：制造和部署成本真实存在，并非理论问题。问题在于，最影响决策的指标仍然缺失：收入、ARR、实际价格、硬件与软件组合、分层毛利率、账上现金、烧钱速度、跑道、积压订单、递延收入和客户集中度。公开材料也没有解释，尤其是在
              Forge One 和 Leviathan 纳入范围后，制造到收入确认之间的营运资本高峰由哪一方出资。


              这导向一个有纪律的结论。订单额增长应被视为需求证明，而不是收入质量证明。没有证据时，不应套用 NRR、CAC 回收期或 SaaS
              毛利率等软件式指标。资本充足性也不能只凭标题融资额来假设，因为当前模式可能需要在经常性软件经济性变得重要之前，先投入工厂开支、GPU
              采购、部署人力和应收账款融资。正确下一步不是建立一个英雄式模型，而是集中索取组合、利润率、积压订单和流动性资料。
