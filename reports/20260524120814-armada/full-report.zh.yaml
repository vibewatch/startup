      - number: '5.3'
        title: Azure Local 集成和具名连接栈让主权边缘架构更可信，但公开保证仍不到完整认证细节
        blocks:
          - type: paragraph
            body: >-
              Microsoft 合作是本章最强的公开技术旁证之一，因为 Armada 和 Microsoft 描述了同一套基本架构。Azure Local 跑在 Galleon 模块化数据中心上，并与 AEP
              互操作，形成主权私有云参考设计。Microsoft 称该设计支持多机架托管集群、超融合或 SAN 支撑的存储，以及跨卫星、LTE/5G、RF 和 SD-WAN 的韧性多网络连接。Armada
              也提出类似说法：该方案能在通信受限环境中保持关键系统在线，并可在数周而不是数月内部署加固模块。主权叙事也与 Armada 的本地处理表述一致，Carahsoft 和 Dell/Palantir
              的合作页面同样强调在客户控制的基础设施上运行敏感工作负载。但信任图景仍不均衡。Atlas 的公开控制集最清楚，Azure Local 被描述为加固且可审计，Bridge 文档写到硬隔离和
              RBAC；但已审阅公开材料没有给出 Bridge 或 Galleon 专属认证清单、正式物理隔离验证包，或公开可用性承诺。
