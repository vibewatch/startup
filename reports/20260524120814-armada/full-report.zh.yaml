  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格已披露；经济分母没有披露
        blocks:
          - type: paragraph
            body: >-
              Armada 2026 年 5 月官方公告讲清楚了两件事，也留下了一件不清楚的事。清楚的是：公司融资 $230 million，称本轮超额认购，并把价格标为 $2 billion 投前估值。这意味着约 $2.23
              billion 的投后进入点，以及新资金约 10.3% 的投后持股。也清楚的是：管理层用本轮资金讲的是围绕 Galleon Forge One、Leviathan 和 Johnson Controls
              框架协议的制造与部署故事，而不是在推一家低资本开支软件公司。


              仍不清楚的是收入分母；没有它，外部人无法用常规倍数判断价格便宜、公允还是昂贵。同一组来源给了订单额增长、累计融资和工厂计划，但没有给已确认收入、ARR、毛利率、待交付订单转化，也没有给硬件、部署服务和经常性软件之间的结构。因此，估值首先要按融资语义和里程碑承销来框定，而不是按披露经济性上的干净公开倍数。区分估值、投后测算、累计融资、订单额和收入不是记账琐事；这是本章的核心分析约束。
