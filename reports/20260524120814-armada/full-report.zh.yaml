      - number: '4.2'
        title: 唯一明确的定价单位在 Bridge 上，披露的增长指标是订单额而非收入
        blocks:
          - type: paragraph
            body: >-
              对一家现在同时销售物理基础设施和软件的公司来说，Armada 的定价披露异常狭窄。最好的公开定价信号来自 Bridge 新的用量语言：Armada 称定价基于活跃 GPU 使用量，并按 GPU/year 或
              GPU/hour 结构计费。这有价值，因为它证明公司存在明确的计量软件结构。但价格点、折扣阶梯、最低承诺，以及预留用量与突发用量之间的组合仍未披露。公开来源也没有给出
              Galleon、Leviathan、部署服务或 Atlas 的标价。Azure Marketplace 和 Carahsoft 降低采购摩擦，但不揭示实际成交价或毛利率。


              收入质量是更严肃的问题。Armada 最强的公开牵引指标是订单额增长：FY25 至 FY26 增长 540%，FY27 Q1 同比增长 2,000%。这些数字由公司披露，并被 CNBC
              独立复述，但它们不是收入。硬件加软件公司常常在订单、开票现金和已确认收入之间出现时间差。Pure Storage 和 Equinix
              提供了公开类比：硬件和安装现金可能先于会计确认或以不同方式确认，而经常性软件和服务义务可能按期确认。没有 Armada 的合同组合、确认政策、积压订单排期或递延收入数据，订单额数字只能证明需求，不能证明盈利质量。
