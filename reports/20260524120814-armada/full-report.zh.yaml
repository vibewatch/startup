      - number: '3.3'
        title: 硬件箱体、供电与冷却层越来越容易商品化
        blocks:
          - type: paragraph
            body: >-
              Armada 的物理产品目前靠便携性、加固和集成形成差异化，但更广泛的基础设施市场正快速走向预集成、AI 就绪的 pod、skid 和模块化系统。Vertiv 围绕 SmartMod、MegaMod 和
              OneCore 宣传工厂集成、多 MW 规模、快速运输，以及 time-to-token、密度和 TCO 上的大幅承诺。Eaton 和 Flexnode 推 3.5MW 到 35MW 数据大厅的交钥匙预制 AI
              工厂。Schneider 的 AI pod 架构已经围绕 1MW 以上高密度集群、液冷和预组装交付设计；Rittal 则把 OCP 启发的机架和水冷对齐 NVIDIA 新兴 DC
              电源要求。换句话说，物理层并非静止，也并非空白。


              这不会消除 Armada 的边缘优势，因为这些供应商多数在优化企业、colo、超大规模和 AI 工厂部署，而不是手提箱、20 英尺箱体或受争夺任务现场。但这意味着 Armada
              不能假设箱体、供电链或冷却栈会长期独特。如果客户主要把 Galleon 看成快速模块化 AI
              容量盒子，资本更充足的供应商就能用相邻产品和既有现场服务能力压迫这个品类。这会把护城河耐久性推向更上层：编排、伙伴分发、主权运营模式，以及 Galleon 部署上线后仍能保有价值的证据。
