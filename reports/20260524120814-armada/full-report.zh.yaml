      - 类别
      - 产品 / 范围
      - 最适合客户 / 站点
      - 公开规模或包装信号
      - 相对 Armada 的局限
    rows:
      - - Armada
        - 直接基准
        - 坚固型模块化 Galleon 硬件，加 AEP/Bridge 编排和合作伙伴市场
        - 国防、公共部门、海上能源、电信和远程工业站点
        - 从 Beacon 到 Leviathan；20+ 伙伴；Carahsoft 和 Microsoft 渠道
        - 需要软件采用和伙伴杠杆，才能守住硬件之外的防线
      - - Crusoe Spark
        - 直接模块化同业
        - 交钥匙预制模块化 AI 工厂，加 Crusoe Cloud 和托管推理
        - 低延迟、主权、本地和成组训练部署
        - 声称最快 3 个月部署，Spark 模块覆盖数百 kW 到数百 MW
        - 在坚固、受干扰或公共部门现场部署上的公开证据少于 Armada
      - - Nscale
        - 直接主权同业
        - 全栈 AI 云平台，加模块化主权数据中心和设备群运营
        - 需要主权枢纽容量的企业和政府买家
        - 公开园区从 30MW 到 240MW+，并声称具备全生命周期管理和模块化预制
        - 公开足迹更像枢纽级园区基础设施，而不是手提箱或 20 英尺现场部署
      - - Lambda
        - 私有集群替代
        - 单租户 GPU 云、私有云 Kubernetes 和 1-Click 集群
        - 希望快速获得安全 GPU 容量的企业和研究团队
        - 公开小时计价，集群规模 16 到 2,000+ GPU
        - 不是坚固型模块化现场数据中心供应商
      - - AWS Outposts
        - 既有混合云
        - 由 AWS 安装的机柜和服务器，在本地运行 AWS 服务
        - 需要本地延迟或数据本地化的现有 AWS 账户
        - 42U 机柜形态、AWS 安装、3 年定价模型
        - 较少为恶劣断联环境和报价驱动采购专门打造
      - - Azure Local
        - 既有混合 / 本地部署
        - 由 Azure Arc 启用的分布式基础设施，跑在合作伙伴或已验证硬件上
        - 以 Microsoft 为中心的企业和主权买家
        - 按核心计价、合作伙伴硬件目录、断联本地控制平面选项
        - 伙伴硬件模型不如 Galleon 那样专为坚固型现场部署打造
      - - Google Distributed Cloud
        - 既有混合 / 本地部署
        - 面向边缘和数据中心站点的全托管 Google 硬件和软件
        - 希望使用 Google 技术栈的受监管或隔离运营方
        - Gemini 本地部署、隔离选项、从一个到数千个地点的叙事
        - 对便携式坚固容器化硬件的强调较少
      - - HPE Private Cloud AI
        - 交钥匙企业私有 AI
        - 预配置 HPE/NVIDIA 私有云，通过 GreenLake 交付
        - 在自建与交钥匙之间比较的企业 AI 团队
        - 从开发者到大型配置，GSI 生态强
        - 更瞄准数据中心私有云，而不是前沿部署边缘站点
      - - Dell AI Factory
        - 交钥匙企业 AI 基础设施
        - 端到端数据平台、模块化架构、服务和 NVIDIA 技术栈
        - 大型企业账户把试点推向生产
        - 4,000+ 客户部署，OEM 规模强
        - 在企业账户中竞争最强，而不是远程断联任务
    notes: 这些行混合了直接同业、既有混合云技术栈和替代方案，因为 Armada 买家可以用几种方式解决同一任务。证据不足的单元格写成局限或未知，而不是猜测。
