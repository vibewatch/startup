      - number: '1.5'
        title: 里程碑与尽调警示
        blocks:
          - type: paragraph
            body: >-
              Armada 的里程碑推进异常紧凑。公司从 2022 年底创立，到 2023 年 12 月退出隐身，再在 2024 年叠加 Microsoft/M12 战略融资，2025 年伴随 $131 million
              融资发布 Leviathan，同年展示海军和公共部门部署，到 2026 年 5 月又把 $230 million Series B 与 Arizona
              制造扩建并行。这是从品类创建到工业化扩张的快速切换，也给后续市场、客户和估值分析提供了有用时间线。

              同一条时间线也暴露出主要风险。第一，Armada
              资本强度高：公司制造模块化数据中心，不只是授权软件；最新增长故事取决于工厂产能爬坡和持续获得战略资本。第二，当前收入、ARR、员工数、客户数、董事会构成和投资人控制条款的公开披露仍有限，意味着订单额增长还不能等同于经审计的运营成熟度。第三，创始人过往包袱并非完全从公开记录中消失：Forbes
              和 CNBC 仍持续提到 Dan Wright 离开 DataRobot 一事，尽管近期动能很强，声誉和治理尽调仍然相关。最后，已抓取的公开材料没有发现针对 Armada
              的诉讼或执法行动，但这不等于没有案卷级审查也能出具干净的法律健康证明。
