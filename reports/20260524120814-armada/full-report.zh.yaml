      - number: '2.2'
        title: 多个规模测算视角，而不是一个泛化 TAM
        blocks:
          - type: paragraph
            body: >-
              Armada 周边最好的公开市场证据，是一组基于视角且彼此重叠的证据。最宽的公开视角是 AI 基础设施本身：IDC 称 2025 全年 AI 基础设施支出达到 $318 billion，预计 2026 年约
              $487 billion，并预期市场到 2029 年超过 $1 trillion。这证明周边资本开支周期真实存在，但显然太宽，不能直接叫 Armada 的 TAM。更接近的视角是模块化数据中心；两个可获得的
              2026 年估算已经明显分化：Future Market Insights 预计 2026 年为 $29.3 billion，Research and Markets 预计 2026 年为 $47.75
              billion。两者都指向快速增长，但超过 $18 billion 的差距本身就是一条尽调事实，说明「模块化数据中心」还不是一个干净、稳定的品类。


              JLL 在这些市场估算和 Armada 实际用例之间提供了最有用的桥。其 2026 年展望称，2026 至 2030 年将新增约 100 GW 数据中心容量，CAGR 为 14%；推理可能在 2027
              年超过训练；推理需求将要求地理分布和嵌入式边缘系统。这正是 Armada 需要的宏观条件：AI 负载离开纯集中式集群模型，转向分布式、延迟敏感和监管敏感部署。Deloitte
              又补上主权视角，认为仅欧洲就可能在五年内围绕主权云、AI 数据中心、半导体及相邻基础设施投入超过 €100 billion 的公共和私人资本。


              因此，正确的承销动作不是把每个大类简单相加。Armada 可触达市场，是这些更大资金池里加固、主权敏感、离线的子集。如果用已发布模块化数据中心区间的大约 13-17%，再用 IDC 2026 年 AI
              基础设施预测的大约 1-1.6% 交叉校准，2026 年实用 SAM 约 $4-8 billion 可以成立。相对周边资本开支热潮，这一区间刻意保守；它比一个巨大但无差异的 TAM 更有决策价值，因为它尊重
              Armada 真实部署边界。方向性三年 SOM 约 $0.2-0.6 billion 也只有在 Armada 把今天的标杆和渠道关系转成可重复多站点项目时才算合理。
