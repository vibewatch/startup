  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及为什么这不是通用边缘计算
        blocks:
          - type: paragraph
            body: >-
              Armada 的市场边界从问题定义出发，而不是从一个泛化基础设施品类出发。公司明确销售四部分边缘栈——Atlas、Galleon、Bridge 和 Marketplace——让客户把 AI
              就绪计算、编排、连接控制和主权运行环境直接带到传统数据中心建设周期或公有云假设失效的地方。因此，纳入支出不是所有 AI
              基础设施，也不是所有边缘支出，而是更窄的一组预算：为恶劣、离线或受监管场景采购加固型模块化数据中心硬件、本地供电与冷却、边缘编排、安全连接和主权私有云能力。


              这一框定很关键，因为 Armada 对自己想切入的楔子讲得异常直接。公司首页和 Galleon 页面强调数周内可运行、模块化扩容，以及对离场数据的完全控制。Microsoft 也用 Azure Local
              语言强化同一框定：双方方案面向间歇连接、受争夺或完全离线的环境，在这些环境中，国防、公共安全、能源和关键基础设施运营方需要云一致的 AI
              能力，同时不能放弃本地性和控制权。因此，排除支出应包括核心超大规模建设、通用托管容量、普通公有云消耗，以及不能解决加固部署或主权问题的纯软件工具。这些类别相邻，有时也能替代，但把它们视为直接 SAM 会高估市场。


              实际含义是，Armada
              应被当作一家主权边缘基础设施公司来评估，而不是小号超大规模云厂商。它的市场存在于部署速度、离线运行、加固和本地治理是采购标准而非锦上添花的地方。因此，正确买方集中在国防、公共部门、海上能源、制造、采矿和电信，而不是那些可以依赖标准云或都会区托管的普通企业
              IT 资产。
