      - number: '1.3'
        title: 资本基础、投资方与工业化扩张
        blocks:
          - type: paragraph
            body: >-
              2024 至 2026 年间，Armada 的资本形成明显提速。2024 年 7 月，由 M12 领投的战略轮融资 $40 million，把披露融资总额推高到 $100 million 以上，也让公司和
              Azure Marketplace 分发绑定得更紧。2025 年 7 月，Armada 在发布 Leviathan 这一兆瓦级模块化数据中心产品的同时，宣布 $131 million 战略融资。到 2026 年
              5 月，公司以 $2 billion 估值完成超额认购的 $230 million Series B；CNBC Disruptor 50 资料列示总融资为 $465 million，Armada 和 Wilson
              Sonsini 则把累计金额描述为接近半十亿美元。

              投资人组合也不只是变大，而是更具战略性。Founders Fund、Lux Capital、Shield Capital、8090 Industries 等早期和复投方之外，又加入或强化了
              M12、Veriten、Glade Brook、Overmatch、BlackRock 和 Johnson Controls。Johnson Controls 这条线在运营上最重要，因为它超出了融资：双方宣布
              Global Framework Agreement，并计划在 Arizona 建设最多 400,000 平方英尺、约 500 个岗位的工厂 Galleon Forge One。这给 Armada 的主权 AI
              叙事配上了工业制造故事，但也把执行、营运资本需求和供应链纪律的门槛抬高了。
