  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Representative public-market set spanning hybrid infrastructure, data-center REITs, diversified hardware, and
        AI-native cloud as of late May 2026; private rounds and nonpublic segment data are analyzed separately.
    columns:
      - 可比对象
      - 状态
      - 当前市值 / EV 背景
      - 倍数 / 基准
      - Armada 参照价值
      - 局限
    rows:
      - - Vertiv
        - 上市 / 数字基础设施设备
        - $125.8B 市值
        - 11.60x TTM 销售额
        - 最接近成熟「硬件 + 服务」数字基础设施参照，覆盖电力与热管理
        - 披露质量和规模都远超 Armada
      - - Equinix
        - 上市 / 数字基础设施平台
        - $106.5B 市值
        - 11.18x TTM 销售额
        - 展示利用率和收入质量可见时，经常性数字基础设施能拿到什么定价
        - Armada 目前还没有 REIT 经济性和经常性主机托管合同
      - - Digital Realty
        - 上市 / 数据中心 REIT
        - $68.7B 市值
        - 10.88x TTM 销售额
        - 可参照其资产支撑型资本开支，尤其是场址、电力和部署强度
        - 房地产持有模式在结构上不同
      - - Pure Storage
        - 上市 / 混合硬件-软件
        - $29.0B 市值
        - 7.91x TTM 销售额
        - 可参照混合产品叠加经常性软件 / 支持的模式
        - 存储业务经济性更清晰，披露也比模块化 AI 工厂充分
      - - Nutanix
        - 上市 / 软件主导基础设施
        - $12.7B 市值
        - 4.73x TTM 销售额
        - 展示没有重硬件资本开支时，软件主导基础设施能如何定价
        - 比 Armada 更偏软件
      - - HPE
        - 上市 / 多元化基础设施
        - $49.9B 市值
        - 1.40x TTM 销售额
        - 可作为多元化、低倍数基础设施的下行地板
        - 业务过于多元、增长过慢，不能直接可比
      - - Nebius
        - 上市 / AI 云离群样本
        - $55.0B 市值
        - 62.64x TTM 销售额
        - 展示公开市场对 AI 原生资产的热情可以走到多极端
        - 离群估值不应锚定基准情景
      - - CoreWeave
        - 上市 / GPU 云
        - $57.6B 市值
        - 9.24x TTM 销售额
        - 最接近且有收入披露的公开 AI 基础设施溢价参照
        - GPU 云经济性和上市公司身份仍与 Armada 不同
    notes: 倍数是 Stock Analysis 在 2026 年 5 月下旬给出的 TTM 销售额快照；公司描述来自 Macrotrends 和监管文件。表格刻意只放公开公司，因此证据缺口记录缺失的私有公司和分业务参照样本。
