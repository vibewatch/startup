  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户模式：主权、远程、运营受限的买家
        blocks:
          - type: paragraph
            body: >-
              Armada 的公开客户证据不是广泛的横向企业采用，而是集中切入那些连接、主权或延迟让中心云工作流失效的环境。最清楚的具名终端用户是 Alaska DOT&PF、Washington DNR、U.S. Navy
              在 UNITAS 期间的使用，以及 Aker
              BP。行业不同，但这些买家有相似模式：政府或工业运营方在远程或受监管环境中承担任务；一线用户需要本地计算或集中治理的连接；买家还需要快速部署，不能等传统数据中心建设。Alaska
              的无人机和地理空间工作流、Washington DNR 的野火连接运营、Navy 的海上演习环境，以及 Aker BP 的海上钻井数据流，都符合这个模板。Carahsoft、Microsoft、Second
              Front、Skydio、DOE Genesis Mission、WinDC 和 Aramco 又把图景从单个证明点扩展到相邻需求面。结论是一个连贯的客户逻辑：边缘基础设施不是优化项而是运营前提时，Armada
              最先赢单。
