  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 这一建议来自强战略验证、仍不透明的经济性，以及高度依赖执行的规模化之间的碰撞。
    data:
      nodes:
        - id: n1
          label: 战略验证
          detail: 真实的主权和远程场地需求、战略投资者，以及 Johnson Controls 的制造支持
