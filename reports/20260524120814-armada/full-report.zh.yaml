      - number: '8.2'
        title: 公开市场给出估值区间，而不是单一干净可比公司
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给不出一个整齐答案，但能划出 2026 年 5 月市场愿意为相邻商业模式支付的范围。成熟数字基础设施和混合型公司，从 HPE 约 1.4x 过去十二个月销售额，到 Nutanix 的
              4.7x、Pure Storage 的 7.9x，以及 Digital Realty、Equinix 和 Vertiv 约 10.9x 至 11.6x。Nebius 处在更投机的 62.6x
              过去十二个月销售额，CoreWeave 即便已经上市并披露收入，仍约 9.24x 交易。这个跨度比任何单一公司更重要，因为 Armada 同时跨越几个类别。


              Armada 有实体部署、热管理和电力暴露，使 Vertiv、HPE 和 Digital Realty 具备方向性参考价值。它也有软件和控制平面雄心，使 Pure 与 Nutanix
              在上行情景中有用。但市场上没有直接对应的公开孪生公司：一家主权
              AI、加固模块化工厂业务，有公开订单额证明，却不披露收入。因此，公开市场给出的正确教训是：当投资者能看见收入质量和结构时，基础设施可以拿到溢价倍数。Armada
              要求投资者在这些披露出现之前付钱，这就是为什么本轮价格看起来可以定价，但还谈不上有明确支撑。
