      - number: '7.3'
        title: 工厂爬坡、电力接入和恶劣环境交付，是最尖锐的运营风险
        blocks:
          - type: paragraph
            body: >-
              Forge One 是风险章节最重要的运营催化剂，因为它把 Armada 从一家能组装和部署模块化系统的公司，变成一家必须在更大规模上证明吞吐、质量、供应商协调和现场服务的公司。Johnson Controls
              的帮助很实在：该合作方带来热管理专长、全球现场队伍和正式制造协议。但同一安排也集中风险。如果 Forge One 在时间、良率或供应商准备度上失手，Armada 回旋空间更小，因为 Leviathan、主权 AI
              需求和客户预期现在都已经进入市场叙事。


              更广的行业背景让这件事更难，而不是更容易。Belfer、Deloitte、JLL 和 CBRE 都指出，2025-2026 年 AI 基础设施项目的核心约束是电力并网、设备瓶颈和施工延迟。JLL
              称，电力而非成本或地理位置，是首要选址变量；CBRE 显示空置率创历史低位、预租活跃；Belfer 强调需求超过可用容量时，电网压力和项目延迟会带来风险。Armada
              还卖进比标准企业数据机房更难运营的环境。Aker BP 的海上参考系统和 Navy 的海上部署证明了差异化，但也意味着每个已部署资产都要承担更高的物流、维护、安全和可靠性负担。
