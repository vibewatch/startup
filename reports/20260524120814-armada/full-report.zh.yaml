  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业比通用 AI 基础设施筛选看起来更少
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持把每个 GPU 云或模块化数据中心供应商都当成 Armada 的同类竞争对手。Armada 自己的产品页描述的是一种组合：加固型、集装箱化的 Galleon 硬件，AEP/Bridge 编排，多租户
              GPU 货币化，以及一个伙伴 Marketplace，目标是把远程基础设施变成托管式主权 AI 运营环境。按这个定义，公开证据支撑的最接近创业公司替代品是 Crusoe Spark 和
              Nscale，因为两者都使用模块化 AI 工厂语言，而不只是泛泛谈云容量。Crusoe 明确推低延迟、主权和本地用例的交钥匙预制模块化 AI 工厂，Nscale
              则把主权模块化数据中心同完整软件和车队运营栈结合起来。


              Lambda 是重要替代品，但证据把它放在安全私有集群和 GPU 云替代方案的位置，而不是加固型可部署现场数据中心同业。它最强的公开差异点是透明 GPU 定价、单租户和托管私有云
              Kubernetes。这很重要，因为它揭示了一种真实买方替代路径：许多客户可以通过租用安全 GPU
              容量或搭建单租户集群来完成任务，而不必购买加固、集装箱化的部署系统。因此，本章把直接竞争视为一个较薄的集合，把替代 / 私有集群竞争单列为一类，也把物理模块化供应商单列为另一类；后者从下方攻击 Armada
              的硬件护城河。
