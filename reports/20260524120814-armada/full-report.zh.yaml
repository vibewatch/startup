      - number: '5.2'
        title: 控制平面有足够公开证据证明是软件定义：Atlas 管资产群运营，Bridge 管 GPU 云编排
        blocks:
          - type: paragraph
            body: >-
              Armada 的软件叙事足够具体，可以承销一个真实控制平面。Atlas 被定位为 Starlink 终端、SD-WAN、无人机、摄像头、传感器及其他连接资产的运营界面，配有共享数据套餐经济性、预测性监控，以及包含
              SSO、RBAC、审计日志和 SOC 2 / ISO 27001 表述的安全面。Bridge 在技术上更关键，因为文档跳出了营销口径，展示出一套真正的 GPU 云平台。Armada 将 Bridge 写成结合
              IaaS 和 PaaS 的层，支持多租户、Kubernetes 和 SLURM、JupyterHub 和 Ray 模板、NVIDIA NIM 推理模板、按 GPU 利用率自动扩缩，以及面向受支持 GPU 的 UI
              驱动 MIG 分区。Marketplace 则补齐架构，让客户部署 Armada 自有工业应用、合作伙伴软件，或自己的容器化工作负载。一个开发者信号来源也强化了这个判断：Armada 正在招聘在裸金属
              Kubernetes 上做本地 CaaS 和 GPUaaS 的岗位，技术栈包括 KVM、容器运行时、KubeVirt 和 vGPU；这和公开文档一致，不像无关招聘噪音。
