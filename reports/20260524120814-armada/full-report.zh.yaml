      - number: '5.5'
        title: 公开记录显示架构可信，但最影响决策的运营规格仍是缺口
        blocks:
          - type: paragraph
            body: >-
              本章可以以相当高置信度支撑 Armada 的产品逻辑：硬件家族是真的，软件控制平面是真的，主权云集成路径是真的，Leviathan 背后也有真实制造计划。约束同样真实。两篇独立 TechCrunch
              文章有用，因为它们解释了为什么模块化 AI 基础设施并不能绕开行业普遍的电力和散热瓶颈：电力转换损耗很实在，涡轮机和其他能源设备交期很长，AI
              基础设施的经济性越来越取决于能源可得性，不只是算力可得性。Armada 自己的公开材料没有解答这些问题。除宽泛形态外，公司没有发布各 SKU 的功耗或制冷边界，没有发布场址前置条件矩阵或可用性 SLA，也没有披露
              Bridge 或 Galleon 的详细安全认证集。因此，产品架构作为概念可以投资，成熟度也明显高于 PPT 堆栈；但完整承销仍取决于一套私有技术包，量化功耗、部署可重复性、安全认证和工厂吞吐。
