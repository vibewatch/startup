        title: The only explicit pricing unit is on Bridge, and the disclosed growth metric is bookings rather than revenue
        blocks:
          - type: paragraph
            body: >-
              Pricing disclosure is unusually narrow for a company that now sells both physical infrastructure and
              software. The best public pricing signal is Bridge's new usage language: Armada says pricing is based on
              active GPU usage and is structured as GPU/year or GPU/hour. That is useful because it proves an explicit
              metered software construct exists. But the price points, discount ladders, minimum commitments, and mix
              between reserved versus burst usage remain undisclosed. Public sources do not provide list prices for
              Galleon, Leviathan, deployment services, or Atlas either. Azure Marketplace and Carahsoft reduce
              procurement friction, but they do not reveal realized selling prices or gross margins.


              Revenue quality is the more serious issue. Armada's strongest public traction metric is bookings growth:
              540% from FY25 to FY26 and 2,000% year over year in Q1 FY27. Those figures are company-disclosed and
              independently repeated by CNBC, but they are not revenue. Hardware-plus-software companies frequently show
              timing gaps between orders, billed cash, and recognized revenue. Pure Storage and Equinix provide public
              analogs: hardware and installation cash can be received before or differently from accounting recognition,
              while recurring software and service obligations may be recognized ratably. Without Armada's contract mix,
              recognition policy, backlog schedule, or deferred-revenue data, the bookings figures are a demand signal
              only, not an earnings-quality metric.
