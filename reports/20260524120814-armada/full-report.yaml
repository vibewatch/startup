        - Positive
        - 2026-2030
        - Expands the need for geographically distributed and local AI infrastructure
        - Validate how much of Armada pipeline is inference-led versus general modernization
      - - Sovereignty, local control, and regulated-industry requirements
        - Positive
        - Current
        - Supports Azure Local and sovereign-private-cloud positioning for government and regulated buyers
        - Ask which live deals cite sovereignty or residency requirements as core reasons to buy
      - - Remote-site ROI from local processing
        - Positive
        - Current
        - Makes offshore, public-safety, and industrial use cases budgetable through downtime or latency reduction
        - Request quantified before/after metrics across additional customer sites beyond Alaska
      - - Operational-in-weeks deployment versus multi-year construction
        - Positive
        - Current
        - Creates a time-to-value wedge when traditional data-center build cycles are too slow
        - Measure actual deployment times, site-prep burden, and services attachment by product tier
      - - Channel and partner leverage
        - Positive
        - Current
