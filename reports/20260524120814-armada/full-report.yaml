      - number: '8.3'
        title: Private-market analogs support the category but also raise cycle risk
        blocks:
          - type: paragraph
            body: >-
              Private-market analogs confirm that Armada is benefiting from a live capital cycle rather than inventing a
              category from scratch. Modular announced a $1.6 billion valuation in 2025, and Crusoe disclosed a Series E
              round above $10 billion as it scaled vertically integrated AI-factory infrastructure. S&P, Reuters, and
              Colliers all point to the same macro fact: extraordinary volumes of capital are flowing into AI
              infrastructure, data centers, and power-linked build-outs. That makes Armada's absolute-dollar valuation
              plausible inside the category, especially because its product and partner strategy are much closer to
              infrastructure than to pure enterprise software.


              The same sources also provide the anti-thesis. When a market is absorbing record infrastructure
              fundraising, rapidly rising build costs, heavy private-credit use, and warnings about opaque financing
              structures, investors should worry that round sizes and valuation labels can outrun durable economics.
              Armada therefore benefits from the current private AI-infrastructure bid, but it is also exposed to any
              de-rating of that bid. The company sits above Modular's disclosed valuation but far below Crusoe's, which
              makes the round understandable in context without making it self-justifying.
            claimRefs:
