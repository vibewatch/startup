  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Armada's product definition is a four-product edge platform anchored by a supportable Galleon family
        blocks:
          - type: paragraph
            body: >-
              Armada's homepage and product surfaces describe a coherent full-stack offer rather than a one-product
              company. Armada Edge Platform is explicitly presented as four products: Atlas, Galleon, Bridge, and
              Marketplace. That matters because the product story spans customer workflow from connectivity and fleet
              visibility, to local compute, to GPU-cloud management, to packaged application delivery. The most
              supportable hardware detail sits inside the Galleon family. Armada publicly states that the line runs from
              Beacon, a suitcase-sized unit, to Cruiser, a 20-foot system with three racks of compute, to Triton, a
              40-foot system with five racks of compute, and then to the liquid-cooled Leviathan at megawatt scale. The
              same source set also supports a practical deployment thesis: Galleon is preloaded with compute,
              networking, storage, heating, and cooling; Armada claims it can be operational in weeks, not years; and
              the local-processing workflow is explicitly designed to minimize backhaul by sending only mission-critical
              information back to the cloud. What is still missing is the exact per-SKU power, storage, and networking
              envelope outside these broad public descriptors.
