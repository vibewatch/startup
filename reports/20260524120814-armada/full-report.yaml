        title: Public comps set a wide margin envelope, which is exactly why Armada's undisclosed mix matters
        blocks:
          - type: paragraph
            body: >-
              Armada does not publish gross margin, contribution margin, hardware bill of materials, or software attach
              rates. That means public underwriting has to start with external benchmarks instead of company-reported
              unit economics. Vertiv is the cleanest hardware-heavy infrastructure analog in this source set: its FY2024
              results show roughly $8011.8 billion of sales, with services at about 20.2% of revenue and an implied
              blended gross margin of about 36.6%. That is what an equipment-and-services infrastructure model can look
              like when the physical layer dominates. Pure Storage shows a much different blend: FY2025 results imply
              roughly 66.1% product gross margin, 74.1% subscription-services gross margin, and 69.8% blended gross
              margin. Nutanix, now much more software-led, reported 85.2% GAAP gross margin in Q4 FY2024 and 84.9% for
              the full year, together with ARR and ACV definitions that are explicitly decoupled from GAAP timing.


              Those analogs matter because Armada sits somewhere between them. A Galleon sale plus deployment, warranty,
              and field support should not be forced into a pure-SaaS unit-economics template. But neither should
              Bridge, Atlas, and Marketplace be ignored, because they are the only obvious path toward higher recurring
              gross margin. The current public answer is therefore an envelope, not a point estimate: if Armada remains
              hardware-led, margins are more likely to resemble infrastructure vendors than software platforms; if
              Bridge and other recurring layers scale faster than hardware, margin expansion could be significant.
              Public materials do not yet show which path is actually happening.
