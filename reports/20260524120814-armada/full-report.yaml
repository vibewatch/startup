        - Clarify which partners are demand-gen engines versus fulfillment or credibility layers
      - - Power availability and time-to-power bottlenecks
        - Negative
        - Current to structural
        - Can slow even modular rollouts if local or grid power is unavailable or too expensive
        - Assess how often Armada can rely on local generation or staged deployment to overcome grid delays
      - - Capital intensity and manufacturing execution
        - Negative
        - Current to structural
        - Factory throughput and working-capital discipline matter because Armada is not pure software
        - Review factory ramp assumptions, supplier concentration, and gross-margin profile by hardware tier
      - - Integration and field-deployment complexity
        - Negative
        - Current
        - Rugged sites require connectivity, compute, security, and application integration under harsh conditions
        - Quantify implementation timelines, partner dependency, and post-deployment support burden
      - - Capability concentration among hyperscalers and large incumbents
        - Negative
        - Current
