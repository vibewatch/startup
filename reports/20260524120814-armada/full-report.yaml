      - number: '7.5'
        title: Mitigations exist, but the thesis still depends on evidence that is not yet public
        blocks:
          - type: paragraph
            body: >-
              The mitigation story is credible enough to keep Armada investable. Johnson Controls reduces thermal and
              manufacturing execution risk. Microsoft and Carahsoft reduce channel and sovereignty-framing risk.
              Harsh-environment case studies prove that the product matters where standard cloud patterns fail. But the
              mitigation case is still mostly architectural and partner-based; it is not yet accompanied by the public
              operating disclosures that would let investors materially downgrade risk. We still do not have public
              throughput data for Forge One, disclosed revenue conversion from bookings, customer concentration by
              dollars, detailed compliance packages, or counsel-grade litigation and incident search results.


              That is why the risk chapter should be read as a monitorable underwriting framework rather than a static
              red flag list. The thesis breaks if Forge One misses its ramp materially, if public-sector procurement
              cycles lengthen while customer concentration stays high, if compliance packaging lags sovereign-AI
              ambition, or if the company has to finance hardware-style working capital without proving
              hardware-plus-software economics. The public evidence today supports real opportunity with real
              mitigation, but not enough proof yet to ignore the narrow execution window.
            claimRefs:
