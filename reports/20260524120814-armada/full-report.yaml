    rows:
      - - Armada
        - Direct baseline
        - Rugged modular Galleon hardware plus AEP/Bridge orchestration and partner marketplace
        - Defense, public sector, offshore energy, telecom, and remote industrial sites
        - Beacon to Leviathan; 20+ partners; Carahsoft and Microsoft routes
        - Needs software adoption and partner leverage to defend beyond hardware
      - - Crusoe Spark
        - Direct modular peer
        - Turnkey prefabricated modular AI factory plus Crusoe Cloud and managed inference
        - Low-latency, sovereign, on-prem, and grouped-training deployments
        - Claims deployments in as little as 3 months and Spark modules from hundreds of kW to 100s of MW
        - Less public proof than Armada in rugged contested or public-sector field deployments
      - - Nscale
        - Direct sovereign peer
        - Full-stack AI cloud platform plus modular sovereign data centers and fleet operations
        - Enterprise and government buyers wanting sovereign hub capacity
        - Public campuses from 30MW to 240MW+ with lifecycle management and modular prefabrication claims
        - Public footprint is hub-scale campus infrastructure rather than suitcase or 20-foot field deployments
      - - Lambda
        - Private-cluster substitute
        - Single-tenant GPU cloud, private-cloud Kubernetes, and 1-Click clusters
        - Enterprise and research teams wanting secure GPU capacity fast
        - Public hourly pricing and 16 to 2,000+ GPU clusters
        - Not a rugged modular field-data-center vendor
      - - AWS Outposts
        - Incumbent hybrid cloud
        - AWS services locally on AWS-installed racks and servers
        - Existing AWS accounts needing on-prem latency or data locality
        - 42U rack format, AWS installation, 3-year pricing model
        - Less purpose-built for harsh disconnected environments and quote-driven procurement
      - - Azure Local
        - Incumbent hybrid/on-prem
        - Azure Arc-enabled distributed infrastructure on partner or validated hardware
        - Microsoft-centered enterprise and sovereign buyers
        - Per-core pricing, partner hardware catalog, disconnected local control-plane option
        - Partner-hardware model is less purpose-built for rugged field deployment than Galleon
      - - Google Distributed Cloud
        - Incumbent hybrid/on-prem
        - Fully managed Google hardware and software for edge and data-center sites
        - Regulated or air-gapped operators wanting Google stack
        - Gemini on-prem, air-gapped option, one-to-thousands location story
        - Less emphasis on portable ruggedized containerized hardware
      - - HPE Private Cloud AI
        - Turnkey enterprise private AI
        - Pre-configured HPE/NVIDIA private cloud delivered through GreenLake
        - Enterprise AI teams comparing build vs turnkey
        - Developer-to-large configurations and strong GSI ecosystem
        - Targets data-center private cloud more than forward-deployed edge sites
      - - Dell AI Factory
        - Turnkey enterprise AI infrastructure
        - End-to-end data platform, modular architecture, services, and NVIDIA stack
        - Large enterprise accounts moving pilot to production
        - 4,000+ customer deployments and strong OEM scale
        - Competes hardest in enterprise accounts rather than remote disconnected missions
