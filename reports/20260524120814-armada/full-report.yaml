      - number: '1.5'
        title: Milestones and Diligence Flags
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is unusually compressed. Armada went from late-2022 founding to stealth exit in December
              2023, layered on a strategic Microsoft/M12 financing in 2024, launched Leviathan with a $131 million raise
              in 2025, demonstrated naval and public-sector deployments the same year, and by May 2026 was pairing a
              $230 million Series B with a manufacturing build-out in Arizona. That is a fast transition from category
              creation to industrial scale-up, and it gives later chapters a useful chronology for market, customer, and
              valuation analysis.

              The same chronology also surfaces the principal risks. First, Armada is capital intensive: the company is
              manufacturing modular data centers, not only licensing software, and its newest growth story depends on
              factory throughput and continuing access to strategic capital. Second, public disclosure quality remains
              limited for current revenue, ARR, headcount, customer count, board composition, and investor control
              terms, which means bookings growth cannot yet be read as equivalent to audited operating maturity. Third,
              founder baggage is not fully absent from the public record: Forbes and CNBC both continue to reference Dan
              Wright’s exit from DataRobot, making reputation and governance diligence relevant despite strong recent
              momentum. Finally, no Armada-specific lawsuit or enforcement action surfaced in the fetched public set,
              but that is not the same as a clean legal bill of health without docket-level review.
