      - number: '7.3'
        title: Factory ramp, power access, and harsh-environment delivery create the sharpest operating edge
        blocks:
          - type: paragraph
            body: >-
              Forge One is the most important operating catalyst in the risk chapter because it converts Armada from a
              company that can assemble and deploy modular systems into one that must prove throughput, quality,
              supplier coordination, and field service at a much larger scale. Johnson Controls materially helps: the
              partner brings thermal-management expertise, a global field force, and a formal manufacturing agreement.
              But the same arrangement also concentrates risk. If Forge One misses on timing, yield, or supplier
              readiness, Armada has fewer places to hide because Leviathan, sovereign-AI demand, and customer
              expectations are all being marketed now.


              The broader sector backdrop makes this harder, not easier. Belfer, Deloitte, JLL, and CBRE all point to
              power interconnection, equipment bottlenecks, and construction delays as defining constraints for AI
              infrastructure projects in 2025-2026. JLL says power, not cost or geography, is the primary site-selection
              variable; CBRE shows record-low vacancy and heavy preleasing; Belfer highlights the risk of grid stress
              and delayed projects when demand outpaces available capacity. Armada also sells into environments that are
              operationally tougher than a standard enterprise data hall. Aker BP's offshore reference system and the
              Navy's at-sea deployment prove differentiation, but they also imply higher logistics, maintenance, safety,
              and reliability burdens for every deployed fleet asset.
