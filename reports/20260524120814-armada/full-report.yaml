      - number: '2.5'
        title: Growth Drivers, Adoption Constraints, and What Could Break the Bull Case
        blocks:
          - type: paragraph
            body: |-
              The strongest growth drivers are visible and mutually reinforcing. IDC's spending data says AI
              infrastructure is already in a multi-year capital cycle. JLL says inference is becoming more important
              than training and will require more regional and edge deployment. Deloitte shows that sovereignty is not
              niche rhetoric but an active investment agenda, especially in Europe. Defense and industrial sources add
              a second driver: there are real environments where local compute is necessary because intermittent
              connectivity, latency, or field autonomy make centralized processing too slow or too fragile. Armada also
              has a product-level wedge on deployment speed: in a market where construction, permitting, and site
              readiness can take years, operational-in-weeks infrastructure is valuable in its own right.

              The constraints are just as real. JLL says grid connection waits in primary markets exceed four years and
              that AI fit-out can reach $25 million per MW, while Vertiv, Schneider, and Data Center Knowledge all
              describe power and high-density infrastructure as design-limiting factors. Uptime adds two more caution
              signals: the market still faces staffing shortages and cost pressure, and much AI infrastructure demand is
              concentrated among hyperscalers and other well-capitalized players. In other words, the category is large
              and urgent, but not frictionless. For Armada specifically, that means manufacturing execution, channel
              leverage, and deployment complexity are as important as top-line demand.

              The contradictory modular-data-center estimates are therefore not a bookkeeping nuisance; they are a
              reminder that category maturity is still uneven. If power, permitting, and concentration continue to slow
              market conversion, or if telecom and sovereign-AI programs remain pilot-heavy, the reachable market could
