companyProfile:
  summary: >-
    Armada is a private San Francisco-based edge-infrastructure company founded in late 2022 by Dan Wright and Jon
    Runyan. The company sells a full-stack sovereign-edge platform spanning Galleon modular data centers, Atlas fleet
    and connectivity management, Bridge GPU orchestration, and a marketplace for first- and third-party applications.
    Public traction is strongest in named deployments with the U.S. Navy, Alaska DOT&PF, Washington DNR, and Aker BP,
    plus go-to-market and manufacturing support from Microsoft, Carahsoft, and Johnson Controls. Armada's May 2026
    Series B set a $2.0 billion pre-money valuation and brought disclosed funding to about $465 million, while leaving
    core economics, customer breadth, and factory execution details largely private.
