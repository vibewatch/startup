            body: >-
              Armada's partner stack is a strength, but it is also a map of the company's main dependencies. Microsoft
              expands the sovereign-cloud control plane and gives Armada a validated story for regulated buyers.
              Carahsoft lowers procurement friction across federal, state, local, education, and healthcare accounts.
              Johnson Controls provides manufacturing and thermal depth. Those relationships reduce go-to-market and
              delivery risk, but they also mean scale increasingly depends on counterparties that Armada does not fully
              control. A stalled partner roadmap, slower joint selling, or a loss of channel priority could narrow
              Armada's path into the exact sectors that currently make the story investable.


              Customer concentration risk is visible even without private revenue data. The public proof set still
              clusters around a small number of named public-sector, defense, and industrial reference accounts, and
              several flagship wins are explicitly described as exercises or single-reference systems rather than large
              fleet rollouts. Competitive pressure compounds that concentration risk. CoreWeave's 10-K is a useful
              sector analog because it shows how AI infrastructure companies can remain highly concentrated and face
              competition from much larger cloud vendors that bundle broader products and leverage existing customer
              relationships. Armada also still withholds the metrics that would normally calm these risks: revenue, ARR,
              margins, backlog conversion, and working-capital structure. So financing dependency remains real even
