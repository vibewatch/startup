  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visibly hardware plus software and channel-enablement, but the realized mix is still private
        blocks:
          - type: paragraph
            body: >-
              Armada's public materials support a multi-line revenue model rather than a pure product or pure SaaS
              framing. Galleon is the physical system sale: ruggedized modular data centers ranging from smaller field
              units to the megawatt-scale Leviathan. Bridge is the clearest software monetization surface. Armada now
              says Bridge is software to manage, scale, and monetize GPU clusters, and the newer Bridge materials go
              further by stating that pricing is based on active GPU usage and structured as GPU/year or GPU/hour. The
              same source set also makes clear that Bridge can run on customer-owned infrastructure, not only on Armada
              hardware, which matters because it means the control plane could become a recurring software line even
              when the customer does not buy a new Galleon. Atlas and Marketplace extend the picture: Atlas is a
              management platform with pooled data-plan and Azure-integration language, while Bridge and Marketplace
              materials describe partner software and model services that can turn infrastructure into
              revenue-generating AI capabilities.


              What the public record does not disclose is the realized mix among those lines. There is no published
              split between Galleon hardware, Bridge, Atlas, Marketplace, deployment work, or support. That omission is
              central to underwriting. If hardware dominates, Armada should be valued closer to capital-intensive
              infrastructure vendors. If software and service attach rates dominate over time, the gross-margin and
              multiple profile could move materially upward. The chapter therefore treats the existence of multiple
              revenue surfaces as confirmed, but the actual economic weight of each surface as still private.
            claimRefs:
