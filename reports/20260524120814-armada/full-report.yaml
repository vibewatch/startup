      - number: '6.4'
        title: The main customer risk is not relevance; it is conversion, retention, and concentration
        blocks:
          - type: paragraph
            body: >-
              The adverse read is straightforward. Armada’s public customer story is much richer on what the product can
              do than on how revenue from those accounts behaves over time. No reviewed source discloses customer count,
              NRR, GRR, logo churn, task-order history, or account-level expansion economics. Public proof is therefore
              case-study-led and partner-led, not cohort-led. That creates three underwriting risks. First,
              concentration risk is likely meaningful because the named proof set is still small and clustered around a
              few showcase accounts. Second, pilot-to-production risk is real even when the underlying technology works;
              independent enterprise-AI research still warns that successful pilots often fail to scale because
              governance, operating model, and production execution lag the demo. Third, public-sector conversion can
              remain procurement-mediated even with helpful resellers and acquisition reform. Carahsoft lowers friction,
              and FY2026 NDAA reforms aim to accelerate commercial technology buying, but neither one is the same thing
              as disclosed repeat orders. In short, Armada has enough customer evidence to prove relevance and early
              adoption, but not enough public data to prove durability or broad revenue diversification.
