        title: >-
          Factory scale, modular deployment, and megawatt products make capital intensity real even before
          customer-owned economics are disclosed
        blocks:
          - type: paragraph
            body: >-
              The capital-adequacy question is materially different from the historical funding chronology captured in
              Company Overview. For financial underwriting, the relevant public facts are that Armada has disclosed $465
              million of total funding, including a $230 million Series B in May 2026, a $131 million strategic round in
              July 2025, and a $40 million round in July 2024. The latest round coincided with a Johnson Controls
              manufacturing agreement and a plan for Galleon Forge One in Arizona. Johnson Controls separately confirmed
              up to 400,000 square feet, around 500 jobs, and continuous production beginning with Leviathan. That
              combination means capital intensity is not hypothetical: Armada is ramping a real manufacturing footprint
              around a megawatt-scale liquid-cooled product.


              What remains unclear is whether disclosed funding is sufficient for the uses that matter most. Public
              sources do not say how much of the Series B is earmarked for factory tooling, prepayments, GPU inventory,
              deployment working capital, or operating burn. Public comps show how quickly digital infrastructure can
              become balance-sheet heavy. Equinix, an owned-infrastructure model, guided to $3.222-$3.472 billion of
              total 2025 capex and explained that even recurring installation economics can diverge from revenue
              recognition. Moody's and Data Center Knowledge further warn that turnkey AI data-center assets face
              overbuild, obsolescence, and capex-renewal risks if demand or technology moves against the installed base.
              Armada may still have adequate near-term capital, but the public record is not detailed enough to
              underwrite that conclusion with confidence.
