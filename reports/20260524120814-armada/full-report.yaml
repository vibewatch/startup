    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Directional value bands show why Armada looks roughly priced only in the base case and clearly attractive only in
      the bull case.
    data:
      items:
        - label: Official round pricing
          low: 2
          mid: 2.23
          high: 2.23
          unit: $B
          note: Low is official pre-money; mid/high show implied post-money entry
        - label: Bear fair value
          low: 1.2
          mid: 1.45
          high: 1.7
          unit: $B
          note: Bookings conversion lags and factory / power friction dominate
        - label: Base fair value
          low: 1.8
          mid: 2.15
          high: 2.5
          unit: $B
          note: Hybrid infrastructure proof improves but full software re-rating does not arrive yet
        - label: Bull fair value
          low: 3
          mid: 3.75
          high: 4.5
          unit: $B
          note: Repeat sovereign deployments and meaningful control-plane monetization justify premium treatment
