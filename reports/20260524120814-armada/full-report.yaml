        - Azure Arc management, AKS on Azure Local at no extra charge, optional Windows Server subscription
        - Lower-friction for Microsoft estates; still requires Azure subscription and partner-hardware path
      - - Google Distributed Cloud connected
        - Public starting price
        - Managed infrastructure on Google-certified hardware; 96-vCPU minimum per site
        - Managed Kubernetes-based infrastructure and storage for containers and VMs
        - Useful for regulated sites that want Google stack without custom rugged hardware
      - - Google Distributed Cloud air-gapped
        - Quote based
        - Air-gapped managed deployment
        - Air-gapped software/hardware stack for sovereignty and disconnected operations
        - Strong sovereignty story, but public pricing remains opaque
      - - HPE Private Cloud AI
        - Quote based / scoped
        - Turnkey GreenLake-led private cloud with right-sized configurations
        - Pre-configured validated stack, unified data layer, NVIDIA software, observability, partner ecosystem
        - Competes by lowering integration burden for enterprise buyers who would otherwise build their own
      - - Dell AI Factory
        - Consumption and pay-as-you-go options, but no retained list price
        - Modular architecture plus services from desktop to data center
