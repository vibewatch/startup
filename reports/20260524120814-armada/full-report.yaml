      - number: '2.2'
        title: Multiple Sizing Lenses, Not One Generic TAM
        blocks:
          - type: paragraph
            body: |-
              The best public market evidence around Armada is lens-based and overlapping. The broadest public lens
              is AI infrastructure itself: IDC says full-year 2025 AI infrastructure spend reached $318 billion,
              projects roughly $487 billion in 2026, and expects the market to exceed $1 trillion by 2029. That
              proves the surrounding capex cycle is real, but it is obviously too broad to call Armada's TAM. A
              closer lens is modular data centers, where two accessible 2026 estimates already diverge sharply:
              Future Market Insights projects $29.3 billion in 2026, while Research and Markets projects $47.75
              billion in 2026. Both point to rapid growth, but the more than $18 billion gap is itself a diligence
              fact showing that "modular data center" is not a clean, settled category.

              JLL provides the most useful bridge between those market estimates and Armada's actual use case. Its
              2026 outlook says roughly 100 GW of new data-center capacity will be added from 2026 to 2030 at a 14%
              CAGR, that inference could overtake training in 2027, and that inference demand will require geographic
              distribution and embedded systems at the edge. That is precisely the macro condition Armada needs: AI
              workloads moving away from a purely centralized-cluster model and toward distributed, latency-sensitive,
              regulation-sensitive deployments. Deloitte adds a sovereignty lens, arguing that Europe alone could see
              over €100 billion of public and private investment over five years across sovereign cloud, AI data
              centers, semiconductors, and adjacent infrastructure.

              The right underwriting move is therefore not to add every broad category together. Armada's targetable
              market is the rugged, sovereignty-sensitive, disconnected subset inside those broader pools. A practical
              2026 SAM of roughly $4-8 billion is supportable if one triangulates roughly 13-17% of the published
              modular-data-center range and roughly 1-1.6% of IDC's 2026 AI-infrastructure projection. That range is
              deliberately conservative relative to the surrounding capex boom, and it is more decision-useful than a
              giant undifferentiated TAM because it respects Armada's true deployment boundary. A directional three-
              year SOM of roughly $0.2-0.6 billion is then plausible only if Armada turns today's references and
              channel relationships into repeatable multi-site programs.
