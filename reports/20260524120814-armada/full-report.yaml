      - number: '3.4'
        title: Distribution power and switching cost shape the real win-loss boundary
        blocks:
          - type: paragraph
            body: |-
              The strongest competitive evidence in this chapter is less about benchmark features and more about who
              owns the route to the buyer. Microsoft, HPE, Dell, NVIDIA, and Carahsoft all show how much channel
              leverage matters in sovereign and enterprise AI infrastructure. Armada's own Carahsoft and Microsoft
              announcements reinforce the same point: public-sector and regulated buyers often want a distributor,
              reseller network, validated stack, or incumbent cloud relationship sitting between them and the raw
              infrastructure vendor. Carahsoft's NVIDIA page broadens the lesson beyond Armada specifically; the
              public-sector AI market is channeled through ecosystems of integrators and contract vehicles, not only
              direct founder-led sales.

              The status-quo substitute is equally important. Buyers can often remain on centralized public-cloud GPU
              infrastructure, extend existing cloud stacks via Outposts or Azure Local, or keep compute on secure
              private clusters rather than adopt a new deployable edge form factor. The lock-in sources underline
              why this matters: compute itself can be portable, but data models, identity, application integration,
              IaC, and organizational workflows make cloud exit expensive. That means Armada does not just compete on
              performance; it competes against buyer reluctance to add a new operating model. The more AEP and
              Bridge can run across existing facilities and customer-owned infrastructure, the easier Armada makes
              the switching problem. The more it depends on proprietary hardware purchases alone, the narrower the
              buyer pool becomes.
