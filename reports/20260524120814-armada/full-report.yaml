      - number: '3.2'
        title: Incumbent hybrid and private-cloud stacks own the broadest channels and the safest procurement path
        blocks:
          - type: paragraph
            body: |-
              AWS Outposts, Azure Local, Google Distributed Cloud, HPE Private Cloud AI, and Dell AI Factory are
              the most important practical alternatives for mainstream enterprise and sovereign buyers because they
              package familiar control planes with existing account relationships. Outposts extends select AWS
              services into customer facilities and colocation sites under a three-year commercial construct.
              Azure Local extends Azure Arc onto partner or validated hardware, including a disconnected control-
              plane path, and Microsoft's own Armada collaboration shows the company can simultaneously partner
              with Armada and compete for sovereign private-cloud control. Google Distributed Cloud offers an even
              clearer sovereign and air-gapped counterpunch: it is a fully managed Google hardware-plus-software
              stack for data centers and edge locations, with Gemini available on-prem and an air-gapped option.

              HPE and Dell matter because they narrow the distance between hyperscaler software and enterprise OEM
              procurement. HPE frames the buying decision explicitly as build-your-own versus reference-architecture
              services versus turnkey, while Dell is pushing a modular architecture with over 4,000 customer
              deployments and broad professional-services support. That combination is the biggest distribution
              challenge for Armada. The buyer who wants local AI but does not need a rugged forward-deployed box
              can stay inside an existing Microsoft, AWS, Google, HPE, or Dell relationship and still get a large
              share of the sovereignty, latency, and governance benefits Armada advertises.
