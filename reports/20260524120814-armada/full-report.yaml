  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Why This Is Not Generic Edge Compute
        blocks:
          - type: paragraph
            body: |-
              Armada's market boundary starts with a problem definition rather than a generic infrastructure category.
              The company is explicitly selling a four-part edge stack — Atlas, Galleon, Bridge, and Marketplace —
              that lets customers bring AI-ready compute, orchestration, connectivity control, and sovereign runtime
              environments directly to places where conventional data-center build cycles or public-cloud assumptions
              do not work. The included spend therefore is not all AI infrastructure and not all edge spending. It is
              the narrower set of budgets paying for rugged modular data-center hardware, local power and cooling,
              edge orchestration, secure connectivity, and sovereign private-cloud capabilities for harsh,
              disconnected, or regulated sites.

              That framing matters because Armada's product story is unusually explicit about the wedge it wants.
              Its homepage and Galleon pages emphasize operational-in-weeks deployment, modular scale-up, and full
              control over what data leaves a site. Microsoft reinforces the same framing in Azure Local terms:
              the joint solution is meant for intermittently connected, contested, or fully disconnected environments
              where defense, public safety, energy, and critical-infrastructure operators need cloud-consistent AI
              capabilities without surrendering locality or control. Excluded spend should therefore include core
              hyperscale buildouts, generic colocation capacity, ordinary public-cloud consumption, and software-only
              tooling that does not solve the rugged deployment or sovereignty problem. Those categories are adjacent
              and sometimes substitutive, but treating them as direct SAM would overstate the market.

              The practical implication is that Armada should be evaluated as a sovereign edge-infrastructure company,
              not as a miniature hyperscaler. Its market exists where deployment speed, disconnected operation,
              ruggedization, and local governance are procurement criteria rather than nice-to-have features. That is
              why the right buyer set is concentrated in defense, public sector, offshore energy, manufacturing,
              mining, and telecom rather than in ordinary enterprise IT estates that can rely on standard cloud or
              metro colocation.
