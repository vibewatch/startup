              The Microsoft collaboration is one of the strongest pieces of public technical corroboration in the
              chapter because both Armada and Microsoft describe the same basic architecture. Azure Local runs on
              Galleon modular data centers and interoperates with AEP as a sovereign private-cloud reference design.
              Microsoft says the design supports multi-rack managed clusters, hyperconverged or SAN-backed storage, and
