        title: >-
          The key underwriting question is not whether demand exists, but whether the hidden mix and cash profile
          justify the valuation
        blocks:
          - type: paragraph
            body: >-
              The financial chapter can support a demand narrative, but it cannot close the underwriting loop. Public
              evidence supports a real business with hardware, software, channel access, sovereign-AI positioning, and
              rapidly growing bookings. It also supports the view that manufacturing and deployment costs are real, not
              theoretical. The problem is that the most decision-relevant metrics are still missing: revenue, ARR,
              realized prices, hardware versus software mix, gross margin by layer, cash on hand, burn, runway, backlog,
              deferred revenue, and customer concentration. Public materials also do not explain which party funds the
              working-capital hump between manufacturing and revenue recognition, especially now that Forge One and
              Leviathan are in scope.


              That leads to a disciplined conclusion. Bookings growth should be treated as proof of demand, not proof of
              revenue quality. Software-style metrics such as NRR, CAC payback, or SaaS gross margin should not be
              imputed without evidence. And capital adequacy should not be assumed from the headline funding alone
              because the current model may require factory spending, GPU procurement, deployment labor, and receivables
              financing before recurring software economics become material. The right next step is not a heroic model;
              it is a focused diligence request for mix, margin, backlog, and liquidity.
