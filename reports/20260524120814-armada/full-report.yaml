chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Armada was founded in late 2022 by Dan Wright and Jon Runyan, emerged from stealth in December 2023, and
              is headquartered in San Francisco. Public materials consistently position the company as a private,
              full-stack edge-infrastructure business focused on “bridging the digital divide” by bringing compute,
              storage, connectivity, and AI closer to where data is generated rather than routing every workload back to
              centralized clouds. That positioning is now tied to the company’s post-May 2026 Series B stage: Armada is
              no longer only pitching a rugged edge-compute product, but a broader sovereign-AI platform designed for
              industrial, defense, public-sector, and regulated workloads.

              The operating stack is clearer in 2026 than it was at launch. Armada’s current portfolio spans Atlas for
              monitoring and managing connected assets, Galleon for ruggedized modular data-center deployments,
              Marketplace for deploying third-party hardware and software at the edge, and Bridge for orchestrating and
              monetizing GPU clusters as sovereign AI factories. Taken together, the business model is
              hardware-plus-software rather than pure SaaS: Armada sells deployable infrastructure and wraps it with
              control software, application distribution, and partner integrations that let customers run inference,
              analytics, or private cloud workloads where connectivity is intermittent or sovereignty requirements are
              strict.
