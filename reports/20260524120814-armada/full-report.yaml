      - number: '1.3'
        title: Capital Base, Investors, and Industrial Scale-Up
        blocks:
          - type: paragraph
            body: >-
              Armada’s capital formation accelerated sharply between 2024 and 2026. A July 2024 strategic round led by
              M12 raised $40 million, pushed disclosed funding above $100 million, and linked the company more tightly
              to Azure Marketplace distribution. In July 2025, Armada announced a $131 million strategic funding round
              alongside the launch of Leviathan, its megawatt-scale modular data-center offering. By May 2026 the
              company had raised a $230 million oversubscribed Series B at a $2 billion valuation, with CNBC’s Disruptor
              50 profile listing total funding at $465 million while Armada and Wilson Sonsini described the cumulative
              total as nearly half a billion dollars.

              The investor mix also became more strategic, not just larger. Early and repeat backers such as Founders
              Fund, Lux Capital, Shield Capital, and 8090 Industries were joined or reinforced by M12, Veriten, Glade
              Brook, Overmatch, BlackRock, and Johnson Controls. The Johnson Controls tie matters most operationally
              because it goes beyond financing: the companies announced a Global Framework Agreement and a planned
              Arizona factory, Galleon Forge One, of up to 400,000 square feet and roughly 500 jobs. That gives Armada
              an industrial-manufacturing story to match its sovereign-AI narrative, but it also raises the bar on
              execution, working-capital needs, and supply-chain discipline.
