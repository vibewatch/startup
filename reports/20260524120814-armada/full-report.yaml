      - number: '7.2'
        title: Sovereign-AI expansion broadens the market but adds export, procurement, and cyber obligations
        blocks:
          - type: paragraph
            body: >-
              Armada's sovereign-AI positioning is commercially attractive precisely because it sits inside harder
              regulatory and operational environments than generic cloud resale. The Microsoft collaboration explicitly
              targets defense, government, and regulated industries, while Carahsoft and UNITAS show that public-sector
              and military exposure is not hypothetical. But those same routes to market come with expanding
              obligations. BIS updates on advanced computing exports increase the importance of chip provenance, end-use
              screening, and diversion controls. The EU AI Act implementation stack adds another layer of documentation,
              transparency, and high-risk/general-purpose model obligations for cross-border deployments. At the same
              time, FY2026 NDAA and related defense guidance show that DoD buyers are raising expectations around AI
              governance, testing, procurement requirements, and energy-aware data-center planning.


              Cyber and safety burdens rise with the deployment context. CISA's AI-in-OT guidance and DoD's AI
              cybersecurity tailoring guide both frame operational AI as a lifecycle governance problem, not a simple
              software patching problem. For Armada, that means sovereign deployments in contested, disconnected, or
              industrial settings must satisfy not just uptime goals but model, data, infrastructure, and supply-chain
              controls. We did not find a public Armada-specific enforcement action or disclosed material cyber incident
              in the reviewed source pack, but that absence should be read as an evidence limit, not as proof that the
              compliance burden is low.
