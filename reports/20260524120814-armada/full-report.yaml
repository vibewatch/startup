  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation follows from strong strategic proof colliding with still-hidden economics and execution-heavy
      scale-up.
    data:
      nodes:
        - id: n1
          label: Strategic proof
          detail: Real sovereign and remote-site demand, strategic investors, and Johnson Controls manufacturing support
        - id: n2
