              - CV039
              - CV040
              - CV045
      - number: '8.5'
        title: Public evidence supports a track or research-more stance, with explicit break triggers
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, the right call is not buy. The absolute-dollar valuation is not absurd relative
              to the size of comparable public and private infrastructure businesses, but the evidence quality is too
              thin to call the price attractive. Key economic and cap-table disclosures are still missing, and the most
              important underwriting drivers now sit in factory throughput, bookings conversion, software attach, and
              financing discipline. That combination is enough to keep Armada investable as a company, but not enough to
              remove price sensitivity from the round.


              The practical implication is to treat the May 2026 round as a milestone-gated track or research-more
              situation. If revenue conversion, margin layering, and Forge One execution prove out, the company can grow
              into or beyond the mark. If they do not, the downside path is straightforward because the category already
              contains lower-multiple hybrid and hardware-heavy analogs. That is why the right final output of this
              chapter is a valuation stance of stretched, a medium confidence level, high execution risk, and a
              diligence plan focused on the few private facts that can actually move the underwriting case.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
