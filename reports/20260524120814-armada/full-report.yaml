  - id: FV003
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The biggest drivers around the base case are software attach, factory execution, and market-wide infrastructure
      de-rating.
    data:
      items:
        - label: Bridge / Atlas become meaningfully recurring
          value: 0.6
          unit: $B
          detail: Upside if control-plane monetization is real and durable
        - label: Bookings convert cleanly into recognized revenue
          value: 0.4
          unit: $B
          detail: Upside if order quality and revenue timing prove strong
        - label: Forge One ramp misses timing or yield
          value: -0.7
          unit: $B
          detail: Largest downside because scale narrative is factory-dependent
        - label: Public AI infra multiples de-rate
          value: -0.5
          unit: $B
          detail: Category compression can hit even if Armada executes
        - label: Power / site readiness delays deployments
          value: -0.35
          unit: $B
          detail: Projects can slide without canceling demand entirely
        - label: Capital efficiency and working-capital discipline outperform
          value: 0.3
          unit: $B
          detail: Improves confidence that the round funds scale rather than only the next raise
    approximationNotes: >-
      Sensitivity values are directional valuation deltas around the base-case midpoint rather than audited forecast
      outputs.
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV039
      - CV040
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Compact IC-style scoring shows why the company can be compelling while the current public valuation still lacks
      clean support.
    data:
      items:
        - label: Market pull
          value: 8
          detail: Demand surfaces and capital cycle are strong
        - label: Product / moat
          value: 7
          detail: Hybrid hardware plus sovereign control-plane thesis is differentiated
        - label: Customer proof
          value: 7
          detail: Named deployments exist, but economics remain undisclosed
        - label: Economic visibility
          value: 3
          detail: Revenue, ARR, margins, and conversion are still private
        - label: Execution burden
          value: 4
          detail: Factory, power, and working-capital load are high-risk variables
        - label: Valuation support
          value: 4
          detail: Current round is understandable, not clearly attractive
        - label: Evidence quality
          value: 4
          detail: Public data are enough for a band, not for strong conviction
    approximationNotes: Scores are directional underwriting aids, not a mechanical investment formula.
    claimRefs:
      - CV006
      - CV007
      - CV025
      - CV035
      - CV043
      - CV044
