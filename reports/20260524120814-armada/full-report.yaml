  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution risk dominates because Armada is scaling from proof points into industrial output
        blocks:
          - type: paragraph
            body: >-
              Armada does not look like a company struggling to find a use case. Public evidence shows real demand
              surfaces across defense, state government, offshore energy, and sovereign private cloud. The risk is that
              the company is now making a large jump in operating complexity at the same time that outside expectations
              are rising. The Series B, the Johnson Controls framework agreement, and the launch of Forge One move
              Armada from shipping rugged units into proving continuous production for Leviathan and broader Galleon
              demand. That changes the underwriting question from product plausibility to whether manufacturing,
              deployment, and field operations can scale before customer patience or capital-market tolerance runs out.


              The strongest adverse fact in the public record is not weak demand; it is revenue opacity. Armada
              discloses bookings growth, not revenue, ARR, gross margin, backlog conversion, or revenue-recognition
              policy. That means investors can see demand acceleration without being able to tell how quickly it
              converts into recognized revenue or durable installed economics. The public customer proof set is also
              still relatively concentrated in a handful of named references, several of which are exercises or
              single-reference deployments rather than disclosed fleet rollouts. For that reason, the top residual risks
              are factory execution, bookings-to-revenue conversion, concentration, and compliance complexity rather
              than market absence.
