    figureRefs:
      - FR001
  - id: s702
    title: Operational and technical risks reflect first-of-a-kind manufacturing and unproven field durability
    body: >-
      The Moses Lake facility is the world's first dedicated silicon anode material gigafactory, meaning Sila has
      no precedent plant to benchmark yield curves, throughput ramp rates, or defect profiles against. First-of-a-kind
      process risk is compounded by the precision required in nano-structured silicon particle synthesis — particle
      size distribution, porosity control, and conductive coating uniformity all affect downstream cell performance.
      Manufacturing yield at scale is unverified from public sources; any systematic quality escape could propagate
      through BMW iX battery packs and trigger costly recalls or warranty claims. The underlying silicon anode
      technology faces a well-documented degradation mechanism: silicon expands roughly 300% during lithiation,
      and repeated cycling causes solid-electrolyte-interphase instability and capacity fade. Sila's proprietary
      nano-porous architecture is designed to accommodate this expansion, but no public long-term field data from
      automotive deployments yet confirms cycle-life performance under real-world thermal cycling across seasons,
      fast-charge stress, and calendar aging. Workforce risk in Grant County, Washington is material: the region
      has limited advanced-manufacturing labor pools, and recruiting and retaining process engineers and quality
      specialists for a specialty chemicals facility 170 miles from Seattle requires sustained investment in
      relocation, training, and retention programs. Cybersecurity risk for the Moses Lake facility — including
      industrial control system integrity and IP protection for proprietary coating formulations — lacks any public
      attestation of SOC 2, ISO 27001, or equivalent certification.
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
    tableRefs:
      - TR002
  - id: s703
    title: Partner and customer concentration create single-point-of-failure exposure
    body: >-
      BMW represents Sila's dominant commercial relationship — the 2021 supply agreement for the BMW iX electric
      SUV is the only publicly confirmed volume automotive program, making Sila effectively a single-customer
      company for its highest-value product line. If BMW delays its EV program, switches chemistry direction, or
      encounters its own demand weakness, Sila's revenue ramp and factory utilization assumptions collapse. The
      dependency is compounded by Sila's position in the value chain: as an anode material supplier, Sila depends
      on battery cell manufacturers (currently believed to be Samsung SDI for BMW packs) to integrate its material
      into cells, creating a two-step dependency where neither the cell maker nor the OEM is directly controlled.
      DOE grant disbursement timing is a financial dependency — the $100M is milestone-gated and any slip in Moses
      Lake commissioning delays cash inflows that the capex plan may assume. Sole-source risk exists for specialty
      silicon precursors (silane gas, specific organosilicon compounds) and proprietary conductive coating chemicals
      where alternative qualified suppliers may not exist at the required purity grades. FEOC restrictions could
      force re-qualification of non-Chinese material sources, adding 12–18 months of qualification cycles. The
      consumer electronics channel (WHOOP fitness bands, other wearables) provides revenue diversification but at
      volumes orders of magnitude below automotive scale, offering limited cushion if BMW volumes disappoint.
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
