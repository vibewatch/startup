callouts:
  - calloutType: risk
    title: BMW concentration is a single-OEM thesis-break exposure
    body: >-
      Sila's automotive revenue depends almost entirely on one customer program. Any BMW EV strategy pivot,
      demand shortfall, or chemistry switch would invalidate the volume assumptions underpinning the Moses Lake
      investment thesis.
    claimRefs:
      - CR018
      - CR019
      - CR035
  - calloutType: insight
    title: Policy risk compounds operational risk in a narrow execution window
    body: >-
      The 2025–2027 period requires Sila to simultaneously ramp a first-of-a-kind factory, maintain DOE grant
      compliance, navigate IRA credit uncertainty, and deliver quality material to BMW — any single failure
      cascades into the others through shared capital and timeline dependencies.
    claimRefs:
      - CR001
      - CR002
      - CR010
      - CR033
  - calloutType: recommendation
    title: Require field cycle-life data and customer diversification evidence before underwriting aggressively
    body: >-
      The absence of public automotive field-performance data for Sila's silicon anode material is not yet a
      failure signal, but it means the technology thesis rests on lab validation and consumer-electronics use
      rather than proven automotive durability. Diligence must close this gap before confidence can be high.
    claimRefs:
      - CR014
      - CR034
      - CR037
