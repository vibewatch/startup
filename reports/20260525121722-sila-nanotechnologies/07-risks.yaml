      - FR003
  - id: s704
    title: People and execution risk reflects key-person dependency and prior organizational stress
    body: >-
      Gene Berdichevsky, co-founder and CEO, is the external face of the company, the primary fundraising
      relationship holder, and the strategic architect of Sila's OEM partnership strategy. His departure or
      incapacity would create immediate investor and customer confidence risk given the pre-revenue stage. Gleb
      Yushin, co-founder and chief scientist, holds foundational IP in nano-structured silicon anode chemistry
      developed during his Georgia Tech tenure — his deep technical knowledge is difficult to replicate and
      represents a single point of failure for continued materials innovation. The 2022 layoffs, reported at
      approximately 20% of staff, signal that Sila experienced meaningful organizational stress during the
      transition from R&D to manufacturing scale-up — a pattern common in deep-tech hardware companies but one
      that can leave cultural scars, institutional knowledge gaps, and hiring-market reputation damage. Recruiting
      battery engineers and process chemists in the Alameda, California headquarters market is intensely competitive,
      with Tesla, QuantumScape, Redwood Materials, and numerous other battery-adjacent firms competing for the same
      talent pool. The Moses Lake site faces different but equally challenging hiring dynamics: attracting
      experienced chemical plant operators to a rural Eastern Washington location requires premium compensation
      and relocation support that compresses margins during ramp.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
