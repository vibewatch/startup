  - id: s705
    title: Mitigation posture and thesis-break triggers
    body: >-
      Sila's mitigations are partially visible: the $590M Series F provides runway, the DOE grant de-risks capex,
      the BMW relationship provides demand visibility, and the consumer electronics revenue stream offers near-term
      cash flow. However, the critical mitigations — manufacturing yield improvement curves, customer diversification
      pipeline, cycle-life field validation data, and succession planning — are either private or unproven. The
      right monitoring framework treats the following as thesis-break triggers rather than background noise: IRA 45X
      credit elimination or material reduction, Moses Lake yield falling materially below plan 12 months post-ramp,
      BMW program cancellation or multi-year delay, a second major layoff round, or publication of independent
      cycle-life data showing silicon anode degradation worse than NMC-graphite alternatives in automotive duty
      cycles. Kill criteria should be tied to observable public milestones: BMW iX production volumes with Sila
      material, Moses Lake shipping announcements, DOE disbursement confirmations, and any patent litigation
      outcomes in the silicon anode space. The absence of public field-performance data is itself a soft trigger —
      if by end-2027 no OEM has published real-world cycle-life results for Sila-equipped vehicles, the technology
      risk thesis darkens materially.
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
