  - id: SEC403
    title: Capital adequacy and financing position
    body: >-
      Sila's capital position is anchored by a $375M Series G round closed in June 2024, led by Franklin Templeton
      with participation from 8VC, Coatue, T. Rowe Price, Bessemer Venture Partners, and Amgen. This brought total
      disclosed funding to approximately $925M–$1B across seven equity rounds plus a ~$100M DOE grant from the Office
      of Manufacturing and Energy Supply Chains selected in October 2022. The Series G valuation was reported at
      approximately $2.48B by Bloomberg (described as a down-round from a prior ~$3.3B valuation) and at roughly $3.4B
      by Reuters—a material discrepancy that has not been resolved by official disclosure. The DOE grant supports
      scale-up of EV battery component manufacturing at Moses Lake but carries milestone conditions. Cash on hand,
      monthly burn rate, and runway are not publicly disclosed. The company conducted layoffs in late 2022 (reportedly
      ~7–10% of staff), signaling cost discipline or revenue shortfalls during the EV demand slowdown. Manufacturing
      capex has been substantial: the Moses Lake factory alone represents a multi-hundred-million dollar investment.
      The company likely requires additional capital before reaching cash-flow breakeven, given ongoing factory ramp,
      automotive qualification timelines, and the capital intensity of advanced materials manufacturing. No public debt
      facilities, project finance, or credit lines have been disclosed.
    claimRefs:
      - CI013
