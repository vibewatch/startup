company:
  name: Sila Nanotechnologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Sila Nanotechnologies operates a B2B advanced materials revenue model selling silicon anode material to EV battery
    OEMs, supported by approximately $925M–$1B in cumulative funding through Series G and ~$100M in DOE grants, but
    discloses no revenue, margins, burn, or unit economics publicly—leaving the financial underwrite materially
    incomplete.
sections:
  - id: SEC401
    title: Revenue model and monetization architecture
    body: >-
      Sila Nanotechnologies generates revenue through a B2B advanced materials supply model. The company manufactures
      proprietary silicon-based anode material (branded Titan Silicon) at its Moses Lake, Washington factory and sells
      it to battery cell manufacturers and OEMs under multi-year supply agreements. The monetization unit is USD per
      kilogram of anode material or, equivalently, USD per kilowatt-hour of battery capacity enabled. The first
      commercial revenue came through consumer electronics (partnership with Whoop fitness band), and the company has
      since pivoted its primary growth focus to automotive-grade EV battery materials. Revenue recognition likely
      follows material shipment and acceptance by the customer, though the precise recognition policy is not publicly
      disclosed. The business model involves long qualification cycles typical of automotive supply chains, meaning
      that customer acquisition costs are front-loaded and revenue realization lags initial engagement by 2–5 years.
      The company has disclosed partnerships with Mercedes-Benz and BMW for next-generation EV batteries using Sila's
      material, but no contract values, volumes, or pricing have been made public. The revenue model is structurally
      similar to specialty chemical or advanced materials businesses: high fixed-cost manufacturing with volume-driven
      margin expansion, but subject to customer concentration risk and qualification dependency.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI018
      - CI030
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: SEC402
    title: Unit economics and cost structure signals
    body: >-
      Sila's unit economics remain almost entirely private. The company does not disclose realized pricing per kg,
      cost of goods sold, gross margin, manufacturing yield, or capacity utilization. Public evidence supports only
      directional inference. The Moses Lake factory represents roughly 180,000 square feet of manufacturing capacity,
      purpose-built for silicon anode production. Capital intensity is high: the facility required hundreds of millions
      in cumulative investment. Silicon anode manufacturing involves complex nano-engineering processes including
      chemical vapor deposition and proprietary particle architectures, suggesting that COGS includes significant
      energy, precursor chemical, equipment depreciation, and yield-loss costs. Public comparables from Amprius
      Technologies (AMPX) provide the closest analogue: Amprius reported revenue of $7.8M in FY2023 with negative
      gross margins during its manufacturing scale-up phase, showing that next-generation anode companies typically
      lose money at low utilization. Group14 Technologies, a direct competitor, raised $463M in Series D in early 2025
      and is similarly pre-profit. The IRA Section 45X Advanced Manufacturing Production Credit may provide a
      meaningful per-unit subsidy for domestically produced electrode active materials, potentially improving Sila's
      effective margin by $35 per kWh of battery capacity. However, Sila has not publicly confirmed 45X eligibility
      or quantified the expected benefit. Without disclosed ASP, COGS, yield, or utilization, the unit-economics
      bridge cannot be completed from public sources.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
