callouts:
  - calloutType: risk
    title: Financial opacity is the primary underwriting blocker
    body: >-
      Sila discloses none of the core financial metrics (revenue, margin, burn, runway, contract values) needed to
      underwrite the business. The investor can assess the capital stack and partnership quality, but cannot determine
      whether the company is on a path to profitability or will require continued large equity raises.
    claimRefs:
      - CI033
      - CI035
      - CI036
      - CI037
  - calloutType: insight
    title: Down-round signal suggests valuation reset despite strong capital access
    body: >-
      Bloomberg reported the Series G at ~$2.48B, below a prior ~$3.3B valuation, indicating a down-round. This is
      consistent with the broader EV demand slowdown and suggests investors repriced Sila's timeline to
      commercialization. The Reuters report of ~$3.4B contradicts this, creating unresolved valuation ambiguity.
    claimRefs:
      - CI024
      - CI025
      - CI026
      - CI029
  - calloutType: strength
    title: Institutional investor quality signals confidence in long-term thesis
    body: >-
      The Series G investor roster (Franklin Templeton, T. Rowe Price, Coatue, Bessemer, 8VC, Amgen) represents
      top-tier growth and crossover capital, suggesting these institutions conducted diligence and believe in
      Sila's multi-year path to commercial-scale EV materials supply.
    claimRefs:
      - CI013
      - CI014
      - CI015
