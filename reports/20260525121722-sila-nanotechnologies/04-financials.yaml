  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: Annual revenue or revenue run-rate for Sila Nanotechnologies
      whyItMatters: Without revenue data no revenue-based valuation, growth assessment, or financial model is possible
      diligencePath: Request audited or management-reported revenue for the last two fiscal years from company management
      relatedQuestionRefs:
        - QI002
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: Gross margin percentage by product line and manufacturing phase
      whyItMatters: Gross margin is the decisive metric for underwriting manufacturing-scale viability and breakeven timing
      diligencePath: Request gross-margin bridge by product (consumer electronics vs. automotive) and production phase
      relatedQuestionRefs:
        - QI007
    - type: private-evidence-only
      severity: blocking
      topic: cash and runway
      missingEvidence: Current cash on hand, monthly burn rate, and management runway estimate
      whyItMatters: Capital adequacy cannot be assessed without these inputs despite knowing total raised
      diligencePath: Request latest balance sheet with unrestricted cash and 12-month forward cash forecast
      relatedQuestionRefs:
        - QI011
    - type: private-evidence-only
      severity: material
      topic: contract terms
      missingEvidence: Supply agreement terms including pricing, volumes, take-or-pay minimums, and duration
      whyItMatters: Revenue visibility and downside protection depend on contract structure with OEM customers
      diligencePath: Request sample contract term sheet or summary of binding volume commitments from top 3 customers
      relatedQuestionRefs:
        - QI003
    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: Revenue share by customer and single-customer dependency percentage
      whyItMatters: High concentration in 1–2 OEMs creates counterparty risk if partnerships are delayed or cancelled
      diligencePath: Request top-3 customer revenue share and historical qualification pipeline conversion rate
      relatedQuestionRefs:
        - QI012
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Official post-money valuation for Series G round
      whyItMatters: Bloomberg and Reuters report materially different valuations ($2.48B vs. $3.4B) with no official resolution
      diligencePath: Request official cap table or term-sheet post-money valuation from company or lead investor
      relatedQuestionRefs:
        - QI005
    - type: private-evidence-only
      severity: material
      topic: debt and project finance
      missingEvidence: Any debt facilities, equipment financing, or project-finance obligations
      whyItMatters: Hidden leverage could dominate financial risk even if equity support appears strong
      diligencePath: Request full debt schedule, liens, credit facilities, and any equipment or factory financing
      relatedQuestionRefs:
        - QI020
    - type: private-evidence-only
      severity: material
      topic: manufacturing yield and utilization
      missingEvidence: Current manufacturing yield rate and capacity utilization at Moses Lake
      whyItMatters: Yield and utilization drive effective per-unit cost and determine when factory economics turn positive
      diligencePath: Request current yield vs. design target, utilization rate, and ramp timeline to 70%+ utilization
      relatedQuestionRefs:
        - QI008
    - type: private-evidence-only
      severity: minor
      topic: 45X eligibility
      missingEvidence: Confirmation of IRA Section 45X eligibility and expected per-unit credit amount
      whyItMatters: Could meaningfully improve effective margin during early-stage manufacturing ramp
      diligencePath: Request 45X eligibility determination letter or expected credit calculation from finance team
      relatedQuestionRefs:
        - QI010
    - type: private-evidence-only
      severity: blocking
      topic: capital breakeven
      missingEvidence: Total capital required to reach cash-flow breakeven and expected timeline
      whyItMatters: Determines whether current funding is sufficient or additional dilutive raises are required
      diligencePath: Request management financial model showing path to breakeven with assumptions on volume and pricing
      relatedQuestionRefs:
        - QI026
