  topStrengths:
    - >-
      Marquee Mercedes-Benz electric G-Class design win plus public Whoop and Panasonic agreements provide concrete
      commercial validation rare for a private battery-materials company.
    - >-
      Operational Moses Lake plant (600,000+ sq ft) plus $100M DOE manufacturing grant show Sila is operating at
      industrial scale rather than remaining a lab-stage chemistry story.
    - >-
      Founder team combines battery commercialization experience from Tesla (Berdichevsky) with deep materials science
      (Yushin) and is backed by a long-tenured late-stage investor syndicate.
  topRisks:
    - >-
      Sila does not publicly disclose revenue, gross margin, customer concentration in dollars, or a confirmed
      post-money valuation, so outside investors cannot price the business responsibly.
    - >-
      Heavy dependence on a small number of premium-auto programs (Mercedes-Benz, BMW Neue Klasse) leaves Sila exposed
      to OEM EV schedule slips, EV demand softness, and single-customer concentration.
    - >-
      Silicon anode field cycle-life, manufacturing yield at Moses Lake first-of-a-kind ramp, and IRA 45X policy
      continuity are material technical, operational, and policy risks for the underwriting thesis.
  unresolvedGaps:
    - Confirmed post-money Series G valuation, share price, preference stack, and any 2025–2026 secondary marks.
    - Revenue run-rate, gross margin, contracted backlog conversion timing, and per-program contract economics.
    - >-
      Detailed customer concentration in dollars and a complete public customer list beyond Mercedes, BMW, Whoop, and
      Panasonic.
    - Moses Lake operating yield, run-rate output, and the actual production economics of the plant ramp.
    - Current board composition, control rights, and complete governance map for the late-stage investor syndicate.
