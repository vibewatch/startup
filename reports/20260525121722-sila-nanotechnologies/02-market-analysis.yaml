callouts:
  - calloutType: strength
    title: Silicon anode market growing at ~50% CAGR with strong structural tailwinds
    body: >-
      Multiple independent analyst reports converge on approximately 50% compound annual growth for silicon anode
      materials from 2025 to 2030, driven by EV energy density requirements, falling battery prices creating headroom
      for premium materials, and policy support. Sila is one of the few companies with a commercial-scale U.S.
      production facility positioned to serve this growth.
    claimRefs:
      - CM007
      - CM008
      - CM010
      - CM011
      - CM025
      - CM026
  - calloutType: risk
    title: Chinese incumbents and graphite cost advantage may slow silicon adoption
    body: >-
      BTR, Shanshan, and Putailai collectively control 76% of global anode production with massive overcapacity and
      aggressive pricing. Silicon materials remain more expensive than graphite per kWh, and the EV demand slowdown
      in 2024-2025 reduces OEM urgency to adopt premium materials. Sila must achieve cost competitiveness through
      manufacturing scale and 45X credits, or risk being confined to low-volume premium niches longer than projected.
    claimRefs:
      - CM004
      - CM029
      - CM030
      - CM031
      - CM033
      - CM034
  - calloutType: insight
    title: Consumer electronics provides revenue bridge during automotive qualification
    body: >-
      Whoop's adoption of Sila material demonstrates that shorter consumer electronics qualification cycles (12-18
      months) provide real revenue and validation while automotive programs complete their 3-5 year timelines. This
      multi-segment strategy reduces dependence on any single OEM's production schedule.
    claimRefs:
      - CM017
      - CM019
      - CM021
