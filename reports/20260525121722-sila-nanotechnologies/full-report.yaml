          extended automotive timeline.
      - - bear
        - >-
          Mercedes delays or cancels silicon-anode plans, Moses Lake yield issues emerge, next round is a clear
          down-round below $2B, or company pivots to licensing model.
        - >-
          50-80% loss from Series G entry; late-stage preference stack may eliminate common equity value in a down-round
