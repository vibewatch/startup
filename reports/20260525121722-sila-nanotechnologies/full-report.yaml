  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies generates revenue through a B2B advanced materials supply model. The company
              manufactures proprietary silicon-based anode material (branded Titan Silicon) at its Moses Lake,
              Washington factory and sells it to battery cell manufacturers and OEMs under multi-year supply agreements.
              The monetization unit is USD per kilogram of anode material or, equivalently, USD per kilowatt-hour of
              battery capacity enabled. The first commercial revenue came through consumer electronics (partnership with
              Whoop fitness band), and the company has since pivoted its primary growth focus to automotive-grade EV
              battery materials. Revenue recognition likely follows material shipment and acceptance by the customer,
              though the precise recognition policy is not publicly disclosed. The business model involves long
              qualification cycles typical of automotive supply chains, meaning that customer acquisition costs are
              front-loaded and revenue realization lags initial engagement by 2–5 years. The company has disclosed
              partnerships with Mercedes-Benz and BMW for next-generation EV batteries using Sila's material, but no
              contract values, volumes, or pricing have been made public. The revenue model is structurally similar to
              specialty chemical or advanced materials businesses: high fixed-cost manufacturing with volume-driven
              margin expansion, but subject to customer concentration risk and qualification dependency.
