      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Sila's buyer landscape has three distinct tiers. First, automotive OEMs pursuing premium EVs with range
              and performance differentiation: Mercedes-Benz is the anchor customer, with Sila's Titan Silicon targeted
              for the electric G-Class around 2026. BMW was historically referenced as a partner, though no public
              supply agreement equivalent to Mercedes has been confirmed as of mid-2026. Second, consumer electronics
              makers seeking smaller, lighter batteries: Whoop was the first commercial customer, integrating Sila's
              material into the Whoop 4.0 band for a 17% energy density improvement. This segment provides earlier
              revenue and real-world validation ahead of automotive volumes. Third, battery cell manufacturers who act
              as intermediaries: Panasonic is named as a customer and cell-making partner. The adoption path follows a
              predictable sequence—material sampling, A/B sample testing, C-sample vehicle integration, and finally
              start of production—spanning 3–5 years for new chemistries in automotive. Consumer electronics cycles are
              shorter (12–18 months), explaining why Whoop preceded Mercedes. Budget ownership sits with cell
              procurement teams at battery makers and powertrain strategy groups at OEMs.
