      - number: '3.5'
        title: Substitute technologies and adjacent pathways
        blocks:
          - type: paragraph
            body: >-
              Solid-state batteries represent the most discussed substitute to silicon anodes. QuantumScape's anodeless
              architecture eliminates graphite and silicon host material entirely, using a solid ceramic separator with
              lithium metal plating. If commercialized at scale, solid-state batteries could offer higher energy
              density, faster charging, and improved safety without any anode material supplier. SES AI and Solid Power
              pursue similar lithium-metal or sulfide-electrolyte pathways. However, all solid-state approaches remain
              pre-commercial for automotive applications as of mid-2026, with manufacturing scale-up, cost, and
              cycle-life challenges still unresolved. The status quo—pure graphite anodes—remains the dominant installed
              base and the real competitive baseline. Graphite anodes are cheap, well-understood, and
              qualification-proven. Every silicon-anode company must justify the incremental cost and qualification risk
              versus the graphite status quo. This makes the competitive challenge for Sila two-dimensional: proving
              superiority over both direct silicon peers and the graphite baseline that most cell makers already trust.
