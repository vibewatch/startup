      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Sila was co-founded in 2011 by three individuals with deep battery and materials science backgrounds. Gene
              Berdichevsky, the CEO, was Tesla's seventh employee and principal engineer on the Roadster battery
              pack—the world's first mass-produced automotive lithium-ion system. He holds BS and MS degrees from
              Stanford in mechanical and energy engineering, and has co-authored over 45 patents. Dr. Gleb Yushin,
              Co-Founder and CTO, is a Professor of Materials Science at Georgia Institute of Technology, an
              Editor-in-Chief of Materials Today, and holds over 210 US and international patents. Alex Jacobs,
              Co-Founder and VP of Engineering, is an MIT mechanical engineering graduate who also worked at Tesla
              designing battery packs for the Roadster and Smart Fortwo, then managed battery cell operations at Amprius
              before co-founding Sila. Public governance disclosure is thin: Sila's leadership page names the three
              founders and functional executives, but no current board roster, committee structure, or investor control
              rights are publicly disclosed. This limits external assessment of governance quality and key-person
              concentration risk.
