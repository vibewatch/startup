  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies sells advanced silicon anode material—specifically its Titan Silicon product—into
              the lithium-ion battery supply chain. The primary market boundary is battery anode materials, which
              encompasses both incumbent graphite anodes and next-generation silicon-based alternatives. Included spend
              covers any revenue flowing to anode material suppliers from cell manufacturers building batteries for EVs,
              consumer electronics, and stationary storage. Excluded spend includes cathode materials, electrolytes,
              separators, cell assembly, and pack integration. The relevant buyer is the battery cell manufacturer
              (e.g., Panasonic, Samsung SDI, CATL) who sources anode powder or composite for cell production. The
              end-customer is typically an automotive OEM (Mercedes-Benz, BMW) or a device maker (Whoop). Status-quo
              substitutes are synthetic and natural graphite from Chinese incumbents such as BTR, Shanshan, and
              Putailai, who collectively control over 76% of global anode production capacity. Adjacent markets include
              solid-state battery materials and lithium-metal anodes, which could eventually compete with silicon for
              next-generation energy density gains but remain further from commercialization.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
