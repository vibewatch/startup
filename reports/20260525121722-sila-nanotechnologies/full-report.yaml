      - number: '7.2'
        title: Operational and technical risks reflect first-of-a-kind manufacturing and unproven field durability
        blocks:
          - type: paragraph
            body: >-
              The Moses Lake facility is the world's first dedicated silicon anode material gigafactory, meaning Sila
              has no precedent plant to benchmark yield curves, throughput ramp rates, or defect profiles against.
              First-of-a-kind process risk is compounded by the precision required in nano-structured silicon particle
              synthesis — particle size distribution, porosity control, and conductive coating uniformity all affect
              downstream cell performance. Manufacturing yield at scale is unverified from public sources; any
              systematic quality escape could propagate through BMW iX battery packs and trigger costly recalls or
              warranty claims. The underlying silicon anode technology faces a well-documented degradation mechanism:
              silicon expands roughly 300% during lithiation, and repeated cycling causes solid-electrolyte-interphase
              instability and capacity fade. Sila's proprietary nano-porous architecture is designed to accommodate this
              expansion, but no public long-term field data from automotive deployments yet confirms cycle-life
              performance under real-world thermal cycling across seasons, fast-charge stress, and calendar aging.
              Workforce risk in Grant County, Washington is material: the region has limited advanced-manufacturing
              labor pools, and recruiting and retaining process engineers and quality specialists for a specialty
              chemicals facility 170 miles from Seattle requires sustained investment in relocation, training, and
              retention programs. Cybersecurity risk for the Moses Lake facility — including industrial control system
              integrity and IP protection for proprietary coating formulations — lacks any public attestation of SOC 2,
              ISO 27001, or equivalent certification.
            claimRefs:
              - CR010
