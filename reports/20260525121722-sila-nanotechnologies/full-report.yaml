      - number: '8.4'
        title: Public comparables provide a bracket, not a target
        blocks:
          - type: paragraph
            body: >-
              The battery-tech public comparable set illustrates the wide range of outcomes for companies at various
              stages of commercialization. Amprius Technologies (AMPX), which produces silicon-nanowire anode cells,
              trades at a market cap of approximately $130M as of May 2026 on minimal revenue, representing the
              bear-case floor for a pre-scale anode company. Enovix (ENVX), a silicon-anode cell manufacturer with
              consumer electronics traction and EV ambitions, carries a market cap near $1.2B. QuantumScape (QS), the
              highest-profile next-gen battery company, maintains ~$2B market cap primarily on solid-state cell IP and
              OEM partnerships without production-scale revenue. SES AI (SES) trades near $300M with lithium-metal
              technology and automotive qualification programs. Solid Power (SLDP) and Microvast (MVST) round out the
              set at $400M-$600M with varying revenue stages. On the private side, Group14 Technologies raised its
              Series C at over $1B valuation in 2024 for silicon-carbon anode materials, making it the closest private
              comparable. The public data suggest that $2.5-3.4B for Sila is at the high end of the battery-materials
              valuation spectrum, comparable only to QuantumScape which trades on solid-state cell promise rather than
              proven anode economics. This does not mean Sila is overvalued — Mercedes validation is stronger proof than
              most peers can show — but it means the price already discounts successful volume production before that
              production is publicly demonstrated.
