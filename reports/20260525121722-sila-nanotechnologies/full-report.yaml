      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Structural drivers supporting silicon anode adoption include escalating EV range requirements, energy
              density limits of graphite (360–370 mAh/g theoretical vs. silicon's 4,200 mAh/g), falling battery pack
              prices creating headroom for premium materials, and policy incentives such as IRA Section 45X
              manufacturing credits worth 10% of production costs for U.S.-made electrode active materials. Sila's $100M
              DOE grant under the Bipartisan Infrastructure Law further de-risks capital expenditure. However,
              significant constraints persist. Graphite remains dramatically cheaper and proven at scale; Chinese anode
              suppliers operate with overcapacity and aggressive pricing. Silicon's 300% volume expansion during charge
              cycling creates engineering challenges that reduce cycle life. OEM qualification timelines of 3–5 years
              mean even a technically superior product takes years to convert into revenue. The EV market itself
              experienced a demand slowdown in 2024–2025 in Europe and the U.S., with sales falling short of forecasts,
              though China remained strong. Goldman Sachs and Roland Berger note that lower battery prices should
              eventually reignite demand, but timing uncertainty persists. For Sila specifically, the constraint is
              execution: converting a 10 GWh Moses Lake ramp into delivered, qualified material at cost parity with
              imports.
