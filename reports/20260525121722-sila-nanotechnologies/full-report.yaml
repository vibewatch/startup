      - number: '3.3'
        title: Silicon-rich cell makers and internal programs
        blocks:
          - type: paragraph
            body: >-
              Amprius Technologies (NYSE: AMPX) and Enovix (NASDAQ: ENVX) compete at the cell level rather than as
              material suppliers. Amprius manufactures silicon nanowire anode cells delivering up to 450 Wh/kg,
              targeting aviation, drones, and defense applications. Its SiCore platform is in volume production with
              repeat purchase orders—including a $35M order from a leading UAS manufacturer. Enovix produces 100% active
              silicon anode cells using a 3D cell architecture focused on consumer electronics and wearables, though its
              revenue scale remains limited relative to its public valuation. Ionblox (formerly Envia Energy) uses
              silicon monoxide anodes with supplemental lithium prelithiation to deliver extreme fast charging in
              large-format pouch cells for automotive and aviation customers. These cell makers are not direct material
              competitors to Sila but represent an alternative competitive path: vertically integrated silicon-anode
              cells that bypass the drop-in material supplier model entirely. Internal programs at CATL, LG Energy
              Solution, and Samsung SDI are also developing proprietary silicon-carbon composites that could eventually
              reduce demand for third-party silicon anode suppliers.
