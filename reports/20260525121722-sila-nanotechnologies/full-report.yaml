          - type: callout
            title: Mercedes OEM validation is uniquely strong for a private battery-materials company
            body: >-
              Very few private companies in battery materials have achieved automotive-grade OEM qualification. If
              Mercedes converts to volume production orders, Sila's technology moat and manufacturing position become
              significantly more defensible than what public comparables demonstrate.
            calloutType: strength
