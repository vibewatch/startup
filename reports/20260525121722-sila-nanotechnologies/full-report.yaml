          - type: callout
            title: Bloomberg vs Reuters valuation gap is a material red flag
            body: >-
              A $900 million discrepancy between reported Series G valuations ($2.48B vs $3.4B) may indicate a
              down-round from the 2021 Series F ($3.3B), complex preference terms, or unreliable third-party reporting.
              Any of these interpretations creates underwriting risk that cannot be resolved without direct management
              engagement.
            calloutType: risk
            claimRefs:
