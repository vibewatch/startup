              between Series F ($3.3B per TechCrunch, 2021) and Series G. Neither interpretation can be resolved from
              public sources alone. Until management discloses the exact post-money, share price, preference terms, and
              revenue trajectory, the recommendation remains research-more with medium confidence and high risk. The
              company clearly merits continued attention, but the price cannot be underwritten from outside.
