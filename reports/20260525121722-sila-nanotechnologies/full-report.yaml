      - number: '3.2'
        title: Direct silicon-anode peer profiles
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies is Sila's most formidable direct competitor. Based in Woodinville, WA, Group14
              manufactures SCC55, a silicon-carbon composite drop-in anode material. The company has raised over $1
              billion in equity through a $463M Series D, operates 10 GWh of online capacity across factories in South
              Korea and Washington State, claims shipments to over 100 customers, and holds 170+ issued patents. Its
              automotive partnerships include Porsche AG and SK, and it has signed agreements with eight leading EV and
              CE cell manufacturers totaling over $750M. Nexeon, based in the UK, produces silicon anode materials and
              partners with SKC for scale-up, but public disclosure on capacity and revenue is limited. OneD Battery
              Sciences offers Sinanode, a process that infuses silicon nanowires into existing graphite, claiming
              compatibility with existing supply chains and partnerships with Putailai for joint development. NEO
