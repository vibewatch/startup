      - number: '5.3'
        title: Technology and operating architecture
        blocks:
          - type: paragraph
            body: >-
              Sila's core technology is a silicon-carbon nanocomposite material synthesized through a proprietary
              process that the company does not fully disclose publicly. The foundational chemistry was invented by
              co-founder Gleb Yushin at Georgia Tech, building on his extensive research in nanostructured materials for
              energy storage. The key technical challenge that Sila addresses is silicon's approximately 300% volume
              expansion during lithiation, which historically caused rapid capacity fade through particle cracking, SEI
              instability, and electrical contact loss. Sila's nanocomposite architecture encapsulates silicon within a
              carbon scaffold that accommodates expansion internally, presenting a stable outer surface to the cell
              electrolyte. This approach preserves the high theoretical capacity of silicon (approximately 3,579 mAh/g
              vs graphite's 372 mAh/g) while mitigating the mechanical degradation that plagued earlier pure-silicon
              approaches. The manufacturing process at Moses Lake employs what the company describes as the world's
              largest reactors for silicon anode materials, with production engineering designed for rapid scaling. Sila
              sources raw materials from U.S.-based suppliers including REC Silicon, Norco, Airgas, and Linde,
              positioning itself for domestic supply chain resilience and potential IRA tax credit advantages. The
              proprietary synthesis details—likely involving chemical vapor deposition or pyrolysis steps—remain the
              company's most closely guarded technical asset and represent a significant diligence gap for investors
              seeking to evaluate manufacturing cost and yield.
