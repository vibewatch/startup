      - number: '2.2'
        title: 'TAM / SAM / SOM: multiple sizing lenses'
        blocks:
          - type: paragraph
            body: >-
              The broadest lens is global battery anode materials, estimated at $6.4 billion in 2026 growing at 13.6%
              CAGR to nearly $14 billion by 2032. Within this, the silicon anode materials segment is estimated at $489
              million to $1.15 billion in 2026 depending on scope definition, with consensus forecasts pointing to
              roughly $3.6 billion by 2030 and a CAGR near 50%. Grand View Research projects 50.1% CAGR from 2025 to
              2030; Fortune Business Insights and Business Research Insights corroborate with similar growth
              trajectories. A complementary lens is EV battery demand: IEA reports 1,200 GWh deployed globally in 2025
              with demand tripling by 2030, implying anode material consumption scales proportionally. Sila's SAM
              narrows to the premium silicon-dominant segment where OEMs require higher energy density than graphite
              blends can deliver—initially luxury EVs and performance wearables. The SOM is further constrained by
              Sila's current 10 GWh annual capacity target for 2026 at Moses Lake, which represents material for roughly
              100,000–200,000 EVs per year depending on cell chemistry and pack size. Multiple analyst reports agree the
              opportunity is large but Sila's near-term capture depends on qualification conversions and manufacturing
              execution rather than market availability.
