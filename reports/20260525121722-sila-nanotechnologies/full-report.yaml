            body: >-
              The financial verdict on Sila Nanotechnologies is structurally promising but materially unverifiable from
              public sources. Revenue quality depends on the durability of OEM qualification wins and whether supply
              agreements translate into contracted minimum volumes with take-or-pay protection. The margin path depends
              on manufacturing yield, energy costs, precursor pricing, and capacity utilization—none of which are
              public. Capital intensity is clearly high: building a greenfield advanced materials factory, qualifying
              with automotive OEMs, and scaling production requires sustained multi-hundred-million-dollar investment
              before breakeven. The company's investor base (Franklin Templeton, T. Rowe Price, Coatue, Bessemer)
              signals institutional confidence, and the DOE grant provides non-dilutive support. However, the EV demand
              slowdown of 2023–2024, the reported down-round valuation, and the 2022 layoffs all indicate that Sila's
              path to profitability is longer and more uncertain than initially anticipated. The highest-priority
              diligence asks are: current cash balance, monthly burn, contracted volume commitments from OEM partners,
              realized ASP per kg, manufacturing yield and COGS per kg, 45X credit eligibility and expected benefit, and
              timeline to gross-margin breakeven. Until management provides these inputs, Sila should be treated as a
              well-capitalized but financially opaque advanced materials company whose commercial traction cannot yet be
              underwritten.
