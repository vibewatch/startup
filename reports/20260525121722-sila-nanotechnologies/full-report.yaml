  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and policy risk centers on IRA credit volatility and DOE grant compliance
        blocks:
          - type: paragraph
            body: >-
              Sila's economic model for the Moses Lake factory depends materially on IRA Section 45X advanced
              manufacturing production credits, which provide per-kWh incentives for domestic electrode-active-material
              production. The Trump administration's 2025 review of IRA clean-energy provisions creates direct policy
              risk: Treasury guidance published in December 2024 narrowed eligibility criteria, and proposed rulemaking
              in early 2025 signaled further tightening of Foreign Entity of Concern restrictions that could affect
              Sila's upstream silicon precursor sourcing. Separately, the $100 million DOE grant for Moses Lake capacity
              buildout carries milestone-based disbursement conditions typical of Office of Clean Energy Demonstrations
              awards — failure to meet production ramp targets or domestic-content thresholds could trigger partial
              clawback. EPA hazardous materials handling requirements under RCRA apply to silicon nanoparticle
              processing waste streams, and OSHA Process Safety Management standards govern the chemical vapor
              deposition operations at Moses Lake. Export control tightening under Entity List expansions could restrict
              Sila's ability to serve certain Asian OEM customers if its materials are classified as dual-use advanced
              materials. The net regulatory picture is not one of imminent enforcement but of compounding policy tail
              risk that could simultaneously reduce credits, restrict inputs, and increase compliance burden.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
