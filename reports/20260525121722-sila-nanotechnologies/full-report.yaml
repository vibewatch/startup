  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Sila's competitive set spans five layers: (1) direct silicon-anode material startups selling drop-in
              powder or composite to cell makers (Group14, Nexeon, OneD Battery Sciences, NEO Battery Materials,
              Sicona); (2) silicon-rich cell makers who control the anode internally (Amprius, Enovix, Ionblox); (3)
              incumbent graphite anode suppliers adding silicon blends (BTR New Energy, Shanshan, Putailai, POSCO Future
              M, Resonac/Showa Denko); (4) adjacent substitute technologies that bypass silicon entirely (QuantumScape
              solid-state, SES AI lithium-metal); and (5) the status quo of pure graphite anodes that still power over
              90% of deployed lithium-ion cells. The competitive question is not whether silicon anodes are superior in
              theory—the energy-density advantage is well established—but whether Sila can secure enough qualified
              volume, at competitive cost, before incumbents replicate the technology or substitutes render the silicon
              pathway transitional. Group14's $1B+ in equity raised, 10 GWh online capacity, and automotive OEM
              agreements make it the most credible direct peer threatening Sila's positioning as the Western
              silicon-anode leader.
