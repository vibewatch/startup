      - number: '1.3'
        title: Capital formation, investor mix, and public-sector support
        blocks:
          - type: paragraph
            body: >-
              Sila's funding history reflects a classic deep-tech scale-up arc from early government grants through
              late-stage venture capital. The company received early grant support from DOE ARPA-E and NSF beginning
              around 2012–2016. Disclosed equity rounds include a Series D of $70 million led by Sutter Hill Ventures in
              2018, a Series E of approximately $170–219 million with Daimler AG (Mercedes-Benz) participation in 2019,
              a Series F of approximately $590 million led by Coatue in January 2021, and a Series G of $375 million
              closed June 27, 2024, co-led by Sutter Hill Ventures and T. Rowe Price with participation from Bessemer
              Venture Partners, Coatue, and Perry Creek Capital. Total capital raised exceeds $1.3 billion. Reported
              post-money valuation estimates for the Series F ranged up to $3.3 billion; the Series G valuation is
              estimated between $2.48 billion and $3.4 billion by third-party trackers, though Sila has not confirmed an
              exact figure. In October 2022, the U.S. Department of Energy awarded Sila $100 million under the
              Bipartisan Infrastructure Law to fund the Moses Lake facility buildout. Including earlier ARPA-E grants,
              DOE support totals over $120 million. The investor roster includes strategic participants Mercedes-Benz,
              Samsung Ventures, In-Q-Tel, Canada Pension Plan Investment Board, and BMW, alongside financial investors
              8VC, Matrix Partners, and others.
