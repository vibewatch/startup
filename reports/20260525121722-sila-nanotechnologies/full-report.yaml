            title: 'Public-evidence call: research-more'
            body: >-
              Sila is commercially credible but the reported $2.5-3.4B valuation cannot be underwritten from public
              sources. Do not upgrade until management discloses current revenue, cap-table terms, and Mercedes delivery
              timeline.
            calloutType: recommendation
            claimRefs:
