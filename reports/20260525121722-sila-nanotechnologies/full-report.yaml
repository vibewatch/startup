      - number: '8.5'
        title: Exit readiness and final diligence requirements
        blocks:
          - type: paragraph
            body: >-
              Sila's exit pathway likely runs through IPO or strategic acquisition. The IPO window for battery-materials
              companies reopened partially in 2024-2025 but remains selective: QuantumScape and Amprius listed via SPAC
              at elevated valuations that subsequently compressed, creating investor skepticism toward pre-revenue
              battery names. A conventional S-1 IPO would require Sila to disclose revenue, margins, and customer
              concentration — exactly the data missing from the current public record. Strategic acquisition by an OEM
              (Mercedes, BMW) or a battery-cell manufacturer (Samsung SDI, LG Energy Solution, Panasonic) is the
              alternative, but would likely value the company at production-reality multiples rather than
              forward-looking VC marks. For an investor today, the critical question is not whether Sila is a quality
              company — the technology and partnerships clearly are — but whether the Series G entry price leaves enough
              upside after dilution, preferences, and execution risk to justify illiquidity. Without disclosed revenue
              run-rate, contribution margins, and preference terms, that question cannot be answered. The diligence
              package required includes the complete cap table with preference stack, current and projected revenue by
              segment, Mercedes qualification timeline and volume commitments, Moses Lake facility yield and cost data,
              and secondary market transaction history.
