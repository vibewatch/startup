        title: Unit economics and cost structure signals
        blocks:
          - type: paragraph
            body: >-
              Sila's unit economics remain almost entirely private. The company does not disclose realized pricing per
              kg, cost of goods sold, gross margin, manufacturing yield, or capacity utilization. Public evidence
              supports only directional inference. The Moses Lake factory represents roughly 180,000 square feet of
              manufacturing capacity, purpose-built for silicon anode production. Capital intensity is high: the
              facility required hundreds of millions in cumulative investment. Silicon anode manufacturing involves
              complex nano-engineering processes including chemical vapor deposition and proprietary particle
              architectures, suggesting that COGS includes significant energy, precursor chemical, equipment
              depreciation, and yield-loss costs. Public comparables from Amprius Technologies (AMPX) provide the
              closest analogue: Amprius reported revenue of $7.8M in FY2023 with negative gross margins during its
              manufacturing scale-up phase, showing that next-generation anode companies typically lose money at low
              utilization. Group14 Technologies, a direct competitor, raised $463M in Series D in early 2025 and is
              similarly pre-profit. The IRA Section 45X Advanced Manufacturing Production Credit may provide a
              meaningful per-unit subsidy for domestically produced electrode active materials, potentially improving
              Sila's effective margin by $35 per kWh of battery capacity. However, Sila has not publicly confirmed 45X
              eligibility or quantified the expected benefit. Without disclosed ASP, COGS, yield, or utilization, the
              unit-economics bridge cannot be completed from public sources.
