      - - base
        - >-
          Consumer electronics revenue grows steadily, Mercedes timeline extends 12-18 months, Sila raises bridge or
          Series H at flat-to-modest-up valuation before IPO readiness.
        - >-
          Flat to modest return from Series G entry; dilution from additional rounds offsets any valuation step-up
