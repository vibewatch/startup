      - number: '1.4'
        title: Manufacturing readiness, partnerships, and commercial traction
        blocks:
          - type: paragraph
            body: >-
              Sila's commercial trajectory moved from consumer electronics proof of concept to automotive supply
              commitments. The company's first commercial product shipment was in September 2021, when Titan Silicon
              powered the WHOOP 4.0 fitness wearable, delivering 17 percent higher energy density in a smaller form
              factor. In 2022, Sila became the first next-generation battery materials company to sign a supply
              agreement with a global automaker when Mercedes-Benz selected Sila's anode material for its upcoming
              electric G-Class series. In December 2023, Panasonic Energy signed a commercial agreement for Titan
              Silicon to be integrated into its next-generation EV batteries. The Series G press release noted three
              additional undisclosed customer contracts. Sila's public press also references applications in drones,
              defense robotics, satellites, and AR/VR. Despite these commitments, full-scale commercial automotive
              shipments from Moses Lake remain scheduled for late 2025 into 2026 rather than already delivered. The
              company has not disclosed revenue, ARR, or precise vehicle volumes already using Sila material in
              production cars. Meanwhile, the broader EV market has faced demand softening, with peer battery startups
              like Ionic Materials, OneD Battery Sciences, and Freyr Battery struggling or shutting down during the same
              period—context that makes Sila's continued funding and execution notable but also highlights the
              competitive environment risk.
