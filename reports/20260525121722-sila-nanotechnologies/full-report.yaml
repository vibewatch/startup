            body: >-
              Sila's moat claims rest on three pillars: foundational silicon-carbon anode IP (invented by CTO Gleb
              Yushin), the Moses Lake factory as the largest silicon anode plant in the Western world (up to 150 GWh
              planned capacity), and strategic OEM partnerships with Mercedes-Benz and Panasonic Energy. Switching costs
              in anode materials are meaningful: cell makers require 12-24 months of qualification testing before
              approving a new anode material for volume production. This creates stickiness once qualified but also
              makes initial customer wins slow and expensive. However, several risks threaten moat durability. Group14
              has comparable IP depth (170+ patents), larger current online capacity (10 GWh vs. Sila's ramp), and
              equally prominent OEM relationships. Chinese incumbents can undercut on price and leverage existing
              qualifications. Solid-state substitutes could render the entire silicon-anode category transitional if
              they commercialize within the next 5-7 years. The most adverse scenario is that silicon anodes become a
              commodity input manufactured at scale by incumbents who absorb the IP through licensing or independent
