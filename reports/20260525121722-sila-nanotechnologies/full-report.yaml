              The company has raised over $925 million across seven rounds, secured a production partnership with
              Mercedes-Benz, shipped product into the Whoop 4.0 wearable, and opened a manufacturing facility in Moses
              Lake, Washington with planned annual capacity targeting over 100 GWh equivalent anode material. The Series
