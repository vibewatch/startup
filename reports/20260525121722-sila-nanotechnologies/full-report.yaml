      - number: '3.4'
        title: Incumbent graphite anode suppliers adding silicon
        blocks:
          - type: paragraph
            body: >-
              The global anode materials market is dominated by Chinese suppliers. BTR New Energy is the world's largest
              lithium-ion anode material supplier, manufacturing graphite and silicon-blended anode materials at massive
              scale with established relationships with CATL, BYD, and other top cell makers. Shanshan and Putailai are
              close behind in capacity. These incumbents have cost advantages from integrated supply chains, captive
              graphite mines, and decades of process optimization. They are actively developing silicon-composite anode
              products—Putailai has signed a joint development agreement with OneD Battery Sciences. POSCO Future M
              (Korea) and Resonac (formerly Showa Denko, Japan) supply anode materials regionally and are adding silicon
              capability. The incumbent threat to Sila is not that these companies match Sila's silicon content or IP
              sophistication immediately, but that they can offer blended silicon-graphite products at lower cost,
              leveraging existing customer relationships, qualification status, and manufacturing scale. Even a 5-10%
              silicon blend from an incumbent may satisfy many OEM near-term needs without requiring the qualification
              risk of switching to a new supplier like Sila.
