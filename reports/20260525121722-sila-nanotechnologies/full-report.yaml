      - number: '2.5'
        title: U.S. policy and incentive landscape
        blocks:
          - type: paragraph
            body: >-
              The Inflation Reduction Act's Section 45X Advanced Manufacturing Production Credit provides a 10% credit
              on production costs for electrode active materials manufactured domestically. Final regulations issued in
              late 2024 confirmed that anode materials qualify, with no phaseout for critical-mineral components. Sila's
              Moses Lake plant is positioned to capture these credits beginning with commercial production in 2025–2026.
              Additionally, Sila received a $100 million DOE grant under the Bipartisan Infrastructure Law in October
              2022, specifically targeting domestic battery material manufacturing scale-up. The broader policy
              environment favors onshoring: concerns about China's 80% control of battery-grade graphite refining,
              potential export controls, and bipartisan support for energy independence all create regulatory pull for
              U.S.-made alternatives. These incentives meaningfully improve Sila's unit economics relative to Chinese
              graphite imports, though the credits alone do not close the full cost gap without manufacturing scale and
              yield improvements.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM036
              - CM037
