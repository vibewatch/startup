  - id: direct-peer-profiles
    title: Direct silicon-anode peer profiles
    body: >-
      Group14 Technologies is Sila's most formidable direct competitor. Based in Woodinville, WA, Group14 manufactures
      SCC55, a silicon-carbon composite drop-in anode material. The company has raised over $1 billion in equity through
      a $463M Series D, operates 10 GWh of online capacity across factories in South Korea and Washington State, claims
      shipments to over 100 customers, and holds 170+ issued patents. Its automotive partnerships include Porsche AG and
      SK, and it has signed agreements with eight leading EV and CE cell manufacturers totaling over $750M. Nexeon, based
      in the UK, produces silicon anode materials and partners with SKC for scale-up, but public disclosure on capacity
      and revenue is limited. OneD Battery Sciences offers Sinanode, a process that infuses silicon nanowires into
      existing graphite, claiming compatibility with existing supply chains and partnerships with Putailai for joint
      development. NEO Battery Materials (Canada, public) develops NBMSiDE silicon anode material targeting drones, UAVs,
      and consumer electronics but remains at an earlier commercial stage. Sicona Battery Technologies (Australia)
      develops silicon-composite anodes but provides minimal public scale evidence.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP011
      - CP012
      - CP013
      - CP014
      - CP015
  - id: silicon-cell-makers
    title: Silicon-rich cell makers and internal programs
    body: >-
      Amprius Technologies (NYSE: AMPX) and Enovix (NASDAQ: ENVX) compete at the cell level rather than as material
      suppliers. Amprius manufactures silicon nanowire anode cells delivering up to 450 Wh/kg, targeting aviation, drones,
      and defense applications. Its SiCore platform is in volume production with repeat purchase orders—including a $35M
      order from a leading UAS manufacturer. Enovix produces 100% active silicon anode cells using a 3D cell architecture
      focused on consumer electronics and wearables, though its revenue scale remains limited relative to its public
      valuation. Ionblox (formerly Envia Energy) uses silicon monoxide anodes with supplemental lithium prelithiation to
      deliver extreme fast charging in large-format pouch cells for automotive and aviation customers. These cell makers
      are not direct material competitors to Sila but represent an alternative competitive path: vertically integrated
      silicon-anode cells that bypass the drop-in material supplier model entirely. Internal programs at CATL, LG Energy
      Solution, and Samsung SDI are also developing proprietary silicon-carbon composites that could eventually reduce
      demand for third-party silicon anode suppliers.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP016
      - CP017
      - CP018
      - CP036
  - id: incumbents-graphite-suppliers
    title: Incumbent graphite anode suppliers adding silicon
    body: >-
      The global anode materials market is dominated by Chinese suppliers. BTR New Energy is the world's largest
      lithium-ion anode material supplier, manufacturing graphite and silicon-blended anode materials at massive scale
      with established relationships with CATL, BYD, and other top cell makers. Shanshan and Putailai are close behind
      in capacity. These incumbents have cost advantages from integrated supply chains, captive graphite mines, and
      decades of process optimization. They are actively developing silicon-composite anode products—Putailai has signed
      a joint development agreement with OneD Battery Sciences. POSCO Future M (Korea) and Resonac (formerly Showa Denko,
      Japan) supply anode materials regionally and are adding silicon capability. The incumbent threat to Sila is not
      that these companies match Sila's silicon content or IP sophistication immediately, but that they can offer blended
      silicon-graphite products at lower cost, leveraging existing customer relationships, qualification status, and
      manufacturing scale. Even a 5-10% silicon blend from an incumbent may satisfy many OEM near-term needs without
      requiring the qualification risk of switching to a new supplier like Sila.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP019
      - CP020
      - CP021
      - CP037
