callouts:
  - calloutType: strength
    title: Sila holds foundational IP and the largest Western silicon anode plant
    body: >-
      Sila's co-founder invented the modern silicon-carbon anode chemistry, giving the company deep IP priority. Combined
      with the Moses Lake factory—described as the largest silicon anode plant in the Western world with up to 150 GWh of
      planned capacity—Sila has real structural assets that cannot be quickly replicated by new entrants.
    claimRefs:
      - CP001
      - CP027
      - CP028
      - CP029
  - calloutType: risk
    title: Group14's scale and funding trajectory directly threatens Sila's leadership claim
    body: >-
      Group14 has raised over $1 billion in equity, operates 10 GWh online with 20 GWh targeted by 2027, holds 170+
      patents, and has $750M+ in signed OEM agreements. This makes Group14 at least as credible as Sila on every
      dimension except foundational IP priority, and arguably ahead on deployed manufacturing scale as of mid-2026.
    claimRefs:
      - CP002
      - CP003
      - CP030
      - CP031
      - CP033
  - calloutType: risk
    title: Chinese incumbent cost advantage is the structural threat
    body: >-
      BTR, Shanshan, and Putailai can offer silicon-graphite blends at structurally lower cost using existing
      manufacturing infrastructure, established OEM relationships, and captive raw material supply. If 5-10% silicon
      blends satisfy near-term OEM requirements, demand for premium silicon-dominant anodes from Sila may be slower
      than projections suggest.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP020
      - CP037
