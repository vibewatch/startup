  - id: substitutes-and-adjacent
    title: Substitute technologies and adjacent pathways
    body: >-
      Solid-state batteries represent the most discussed substitute to silicon anodes. QuantumScape's anodeless
      architecture eliminates graphite and silicon host material entirely, using a solid ceramic separator with lithium
      metal plating. If commercialized at scale, solid-state batteries could offer higher energy density, faster charging,
      and improved safety without any anode material supplier. SES AI and Solid Power pursue similar lithium-metal or
      sulfide-electrolyte pathways. However, all solid-state approaches remain pre-commercial for automotive applications
      as of mid-2026, with manufacturing scale-up, cost, and cycle-life challenges still unresolved. The status quo—pure
      graphite anodes—remains the dominant installed base and the real competitive baseline. Graphite anodes are cheap,
      well-understood, and qualification-proven. Every silicon-anode company must justify the incremental cost and
      qualification risk versus the graphite status quo. This makes the competitive challenge for Sila two-dimensional:
      proving superiority over both direct silicon peers and the graphite baseline that most cell makers already trust.
    claimRefs:
      - CP022
      - CP023
      - CP024
      - CP025
      - CP026
      - CP038
    tableRefs:
      - TP003
  - id: moat-durability
    title: Moat durability, switching costs, and competitive risks
    body: >-
      Sila's moat claims rest on three pillars: foundational silicon-carbon anode IP (invented by CTO Gleb Yushin),
      the Moses Lake factory as the largest silicon anode plant in the Western world (up to 150 GWh planned capacity),
      and strategic OEM partnerships with Mercedes-Benz and Panasonic Energy. Switching costs in anode materials are
      meaningful: cell makers require 12-24 months of qualification testing before approving a new anode material for
      volume production. This creates stickiness once qualified but also makes initial customer wins slow and expensive.
      However, several risks threaten moat durability. Group14 has comparable IP depth (170+ patents), larger current
      online capacity (10 GWh vs. Sila's ramp), and equally prominent OEM relationships. Chinese incumbents can
      undercut on price and leverage existing qualifications. Solid-state substitutes could render the entire silicon-anode
      category transitional if they commercialize within the next 5-7 years. The most adverse scenario is that silicon
      anodes become a commodity input manufactured at scale by incumbents who absorb the IP through licensing or
      independent development, eroding the premium that pure-play startups like Sila currently command.
