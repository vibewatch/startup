  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - explicit assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - bull
        - >-
          Mercedes volume production begins 2026-2027, Moses Lake reaches target yield, Sila IPOs at $5-8B on disclosed
          $200M+ revenue run-rate with 30%+ gross margins.
        - >-
          2-3x return from Series G entry if IPO at $6B+; requires proof that automotive ASPs support margins at volume
          scale.
        - >-
          Automotive qualification delays, silicon-anode cycle-life limitations at volume, IPO window closure for
          pre-profit hardware companies.
        - >-
          Possible if Mercedes program stays on track and Sila demonstrates manufacturing cost curve; no public evidence
          confirms revenue trajectory yet.
      - - base
        - >-
          Consumer electronics revenue grows steadily, Mercedes timeline extends 12-18 months, Sila raises bridge or
          Series H at flat-to-modest-up valuation before IPO readiness.
        - >-
          Flat to modest return from Series G entry; dilution from additional rounds offsets any valuation step-up absent
          a clear IPO catalyst.
        - >-
          Continued cash burn without automotive revenue, preference stack compounding, and potential T. Rowe Price NAV
          write-down signals.
        - >-
          Most consistent with the current public evidence: strong technology, real but limited consumer shipments, and
          extended automotive timeline.
      - - bear
        - >-
          Mercedes delays or cancels silicon-anode plans, Moses Lake yield issues emerge, next round is a clear down-round
          below $2B, or company pivots to licensing model.
        - >-
          50-80% loss from Series G entry; late-stage preference stack may eliminate common equity value in a down-round
          scenario below $2B.
        - >-
          Competitive leapfrogging by solid-state or alternative anode chemistries, silicon expansion/degradation issues
          at automotive scale, EV demand slowdown.
        - >-
          Cannot be dismissed given Amprius ($130M), SES ($300M), and other battery-tech companies that saw severe
          compression from peak private valuations.
    notes: >-
      Scenarios are framed relative to Series G entry at $2.5-3.4B. The wide valuation range itself creates scenario
      uncertainty: bull and bear outcomes depend heavily on which reported figure is the true equity value.
