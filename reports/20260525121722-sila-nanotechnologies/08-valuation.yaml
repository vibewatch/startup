chapter:
  number: 8
  title: Valuation
  summary: >-
    Sila Nanotechnologies raised $375M in Series G (June 2024) at a reported valuation between $2.48B (Bloomberg) and
    $3.4B (Reuters/PitchBook), creating a material discrepancy that complicates outside underwriting. Public battery-tech
    comps trade from sub-$200M to ~$2B market cap, while private peer Group14 raised at $1B+. Total funding exceeds $925M,
    but unit economics, revenue, and margin remain undisclosed. The evidence-sensitive call is research-more with medium
    confidence, high risk, and unknown valuation stance pending direct diligence on pricing, economics, and cap-table terms.
sections:
  - id: s801
    title: 'Recommendation: strong commercial progress, opaque pricing'
    body: >-
      Sila Nanotechnologies has achieved unusual commercial milestones for a private battery-materials company. The company
      has raised over $925 million across seven rounds, secured a production partnership with Mercedes-Benz, shipped product
      into the Whoop 4.0 wearable, and opened a manufacturing facility in Moses Lake, Washington with planned annual
      capacity targeting over 100 GWh equivalent anode material. The Series G round in June 2024 raised $375 million from
      investors including Coatue, Bessemer Venture Partners, T. Rowe Price, and 8VC, at a reported post-money valuation
      ranging from approximately $2.48 billion (Bloomberg) to $3.4 billion (Reuters citing PitchBook). That $900 million gap
      between reported marks is itself a red flag for underwriting discipline: either the lower figure reflects dilution-adjusted
      equity value while the higher represents headline post-money, or there was a meaningful valuation step-down between Series F
      ($3.3B per TechCrunch, 2021) and Series G. Neither interpretation can be resolved from public sources alone. Until
      management discloses the exact post-money, share price, preference terms, and revenue trajectory, the recommendation
      remains research-more with medium confidence and high risk. The company clearly merits continued attention, but the
      price cannot be underwritten from outside.
