  - id: s803
    title: Anti-thesis — valuation opacity and commercialization lag
    body: >-
      The anti-thesis is not about technology quality; it is about whether public evidence can support the reported valuation.
      First, the Bloomberg vs Reuters valuation discrepancy ($2.48B vs $3.4B) is unresolved and may indicate a down-round
      from the 2021 Series F post-money of ~$3.3B. T. Rowe Price, a Series G participant, has historically marked down
      late-stage private holdings in mutual fund NAV disclosures when performance lags expectations — a pattern visible
      across multiple late-stage privates in 2022-2024 vintages. Second, Sila has not publicly disclosed revenue, gross
      margins, ASP per kWh of anode material, Mercedes delivery volumes, or automotive qualification timeline milestones.
      Third, the gap between consumer electronics shipment (Whoop) and automotive-scale volume production is enormous: Whoop
      represents grams of material per device, while Mercedes EV production requires thousands of tons annually. Fourth,
      public anode/battery peers have experienced severe multiple compression: Amprius trades at roughly $100-200M market cap,
      SES AI at $200-500M, and even QuantumScape — despite massive hype — has settled near $2B after peaking above $40B.
      The comparable set suggests that battery-materials companies rarely sustain valuations above $2-3B without demonstrated
      production-scale revenue. A $2.5-3.4B private valuation for Sila therefore embeds substantial execution risk that
      is not visible in the current public record.
