  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Valuation remains opaque
        - No disclosed share price, post-money, or secondary marks available during direct diligence engagement
        - Cannot establish evidence-based entry discipline; preference overhang unknowable.
        - >-
          Do not invest; keep recommendation at research-more or move to avoid if management refuses to share basic terms.
      - - Mercedes partnership stalls
        - >-
          Mercedes publicly shifts EV timeline, selects alternative anode supplier, or Sila discloses inability to meet
          automotive qualification milestones
        - Eliminates the primary OEM validation that justifies premium valuation over public peers.
        - Downgrade immediately; re-evaluate only if a replacement OEM commitment of comparable scale materializes.
      - - T. Rowe Price NAV markdown
        - >-
          T. Rowe Price mutual fund N-CSR filings show Sila marked below Series G entry or below $2B enterprise value
        - >-
          Confirms that a sophisticated institutional investor with information access views the position as impaired.
        - Treat as strong adverse signal; require significant entry discount to reported valuation before proceeding.
      - - Manufacturing yield failure
        - Moses Lake facility reports sub-target yield, significant capacity delays, or requires material additional capital
        - Breaks the manufacturing-credibility pillar and extends timeline to automotive-volume production.
        - Avoid paying premium pricing until production consistency is demonstrated over multiple quarters.
      - - Competitive leapfrog
        - >-
          Solid-state battery or alternative anode chemistry demonstrates equivalent energy density improvement with better
          cycle life at comparable or lower cost
        - Removes the technology-differentiation moat that justifies Sila's valuation premium.
        - Re-underwrite the total addressable market for silicon-anode materials before proceeding.
    notes: >-
      Each trigger links a monitorable event to an investment-committee action; triggers are designed to catch thesis
      deterioration before it fully manifests in the next financing round price.
