  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Latest valuation and share price
        - Exact Series G post-money, price per share, and any 2025-2026 secondary marks or 409A valuations
        - Without a confirmed entry price, the $900M Bloomberg-Reuters gap makes underwriting impossible.
        - >-
          Request Series G term sheet and most recent 409A from management; check Forge Global and EquityZen for
          secondary transaction history.
      - - Cap table and preferences
        - >-
          Full preference stack, liquidation multiples, participation terms, anti-dilution provisions, and option pool
          refresh from Series G
        - Preference overhang can eliminate common equity upside even if the company succeeds commercially.
        - Obtain complete cap table, Series G certificate of incorporation amendments, and investor rights agreement.
      - - Revenue and unit economics
        - >-
          Current revenue run-rate by segment (consumer electronics vs. automotive samples), gross margin, ASP per kWh of
          anode material, and contribution margin by customer
        - $2.5-3.4B valuation without disclosed revenue makes it impossible to assess capital efficiency or path to margins.
        - >-
          Request quarterly revenue and margin summary; compare ASP to commodity graphite anode pricing for margin
          sustainability analysis.
      - - Mercedes qualification timeline
        - >-
          Specific vehicle program, qualified volume commitment, delivery start date, and contractual terms including
          exclusivity and pricing
        - Mercedes validation is the primary thesis driver; without timeline specifics the bull case cannot be dated.
        - >-
          Request Mercedes supply agreement summary, qualification milestone timeline, and volume ramp plan from
          management.
      - - Manufacturing yield and cost
        - >-
          Moses Lake facility current yield rate, production cost per kg, capacity utilization, capex remaining, and
          comparison to target economics
        - Manufacturing credibility is only as strong as realized production data; planned capacity is not the same as proven capacity.
        - Review facility KPIs, quarterly production reports, and cost-per-unit trends with engineering team.
    notes: >-
      These asks represent the minimum diligence package needed to convert from research-more to an investable track or buy
      recommendation with quantifiable risk parameters.
