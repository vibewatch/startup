callouts:
  - calloutType: strength
    title: Sila has transitioned from R&D to operating manufacturer with contracted automotive demand
    body: >-
      The Moses Lake factory opening, Mercedes-Benz and Panasonic supply agreements, and Series G funding amid peer
      failures collectively show a company that has de-risked technology and is now executing on manufacturing and
      commercial delivery—a stage most battery material startups never reach.
    claimRefs:
      - CO024
      - CO028
      - CO029
      - CO030
      - CO031
      - CO035
  - calloutType: risk
    title: Revenue, valuation, and governance remain opaque while the EV market faces demand headwinds
    body: >-
      Sila does not publicly disclose revenue, ARR, unit economics, board composition, or a confirmed valuation.
      Combined with the broader EV demand slowdown and peer battery startup failures, investors must weigh
      demonstrated technical progress against financial and governance uncertainty.
    claimRefs:
      - CO035
      - CO036
      - CO037
  - calloutType: insight
    title: DOE grant support and supply-chain strategy position Sila as a geopolitical beneficiary
    body: >-
      Over $120 million in DOE grants, domestic manufacturing replacing Chinese-sourced graphite, and IRA tax credit
      eligibility create a structural tailwind that insulates Sila from some market cyclicality and trade-policy risk.
    claimRefs:
