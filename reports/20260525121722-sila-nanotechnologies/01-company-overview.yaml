  - id: section-4
    title: Manufacturing readiness, partnerships, and commercial traction
    body: >-
      Sila's commercial trajectory moved from consumer electronics proof of concept to automotive supply commitments.
      The company's first commercial product shipment was in September 2021, when Titan Silicon powered the WHOOP 4.0
      fitness wearable, delivering 17 percent higher energy density in a smaller form factor. In 2022, Sila became the
      first next-generation battery materials company to sign a supply agreement with a global automaker when
      Mercedes-Benz selected Sila's anode material for its upcoming electric G-Class series. In December 2023, Panasonic
      Energy signed a commercial agreement for Titan Silicon to be integrated into its next-generation EV batteries. The
      Series G press release noted three additional undisclosed customer contracts. Sila's public press also references
      applications in drones, defense robotics, satellites, and AR/VR. Despite these commitments, full-scale commercial
      automotive shipments from Moses Lake remain scheduled for late 2025 into 2026 rather than already delivered. The
      company has not disclosed revenue, ARR, or precise vehicle volumes already using Sila material in production cars.
      Meanwhile, the broader EV market has faced demand softening, with peer battery startups like Ionic Materials,
      OneD Battery Sciences, and Freyr Battery struggling or shutting down during the same period—context that makes
      Sila's continued funding and execution notable but also highlights the competitive environment risk.
    claimRefs:
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO034
      - CO035
      - CO036
  - id: section-5
    title: Milestone chronology and remaining diligence gaps
    body: >-
      The public chronology is detailed enough to serve as a reference for later chapters. It spans Sila's 2011
      founding, early DOE and NSF grants, the 2018 Series D, the 2019 Mercedes-Benz investment and Series E, the
      large 2021 Series F, the 2021 Whoop commercial debut, the 2022 DOE $100 million grant and Mercedes supply
      agreement, the 2023 Titan Silicon product launch and Panasonic agreement, the 2024 Series G, the April 2025
      Moses Lake commissioning, and the September 2025 factory opening. The most important open questions are not
      about whether Sila exists or is scaling, but about how the business should be underwritten. Retained public
      sources do not provide a confirmed latest valuation, a revenue or ARR figure, precise customer count, board
      roster, or detailed unit economics. These gaps should be carried forward as explicit diligence asks rather than
      normalized into false precision. The EV demand slowdown and peer failures provide an adverse frame that any
      investor should weigh against Sila's demonstrable technical and manufacturing progress.
