chapter:
  number: 1
  title: Company Overview
  summary: >-
    Sila Nanotechnologies is a privately held Alameda, California battery materials company founded in 2011 to
    commercialize silicon-dominant anode technology replacing graphite in lithium-ion batteries. Retained public sources
    support more than $1.3 billion raised through a 2024 Series G, approximately 400 employees, a newly operational
    600,000+ square foot manufacturing plant in Moses Lake, Washington, and confirmed automotive supply agreements with
    Mercedes-Benz and Panasonic Energy. The main unresolved items are latest valuation precision, revenue or ARR metrics,
    and a complete board roster.
sections:
  - id: section-1
    title: Identity, product scope, and operating footprint
    body: >-
      Sila Nanotechnologies, Inc. (doing business as "Sila") presents itself as a next-generation battery materials
      company with the mission to power the world's transition to clean energy. Founded in 2011 in Alameda, California,
      the company's core commercial product is Titan Silicon, a nano-composite silicon anode material engineered to
      replace conventional graphite in lithium-ion battery cells. The company claims Titan Silicon delivers 20–25 percent
      higher energy density over the industry's best-performing graphite cells today, with a roadmap to 40 percent
      improvement and sub-ten-minute recharge times in future releases. Sila's operating footprint spans its Alameda
      headquarters for R&D and corporate functions, and a 600,000-plus square foot automotive-scale manufacturing plant
      on a 160-acre campus in Moses Lake, Washington. The Moses Lake facility began commissioning in April 2025 and
      started initial Titan Silicon production in September 2025, making it the first large-scale silicon anode plant in
      the United States. Initial capacity supports 2–5 GWh annually, with engineered expansion capability to 250 GWh
      within five years. The company has publicly stated its intent to employ up to 500 skilled workers at Moses Lake
      over three to five years.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
