  - id: section-2
    title: Founders, leadership, and governance visibility
    body: >-
      Sila was co-founded in 2011 by three individuals with deep battery and materials science backgrounds. Gene
      Berdichevsky, the CEO, was Tesla's seventh employee and principal engineer on the Roadster battery pack—the
      world's first mass-produced automotive lithium-ion system. He holds BS and MS degrees from Stanford in mechanical
      and energy engineering, and has co-authored over 45 patents. Dr. Gleb Yushin, Co-Founder and CTO, is a Professor
      of Materials Science at Georgia Institute of Technology, an Editor-in-Chief of Materials Today, and holds over 210
      US and international patents. Alex Jacobs, Co-Founder and VP of Engineering, is an MIT mechanical engineering
      graduate who also worked at Tesla designing battery packs for the Roadster and Smart Fortwo, then managed battery
      cell operations at Amprius before co-founding Sila. Public governance disclosure is thin: Sila's leadership page
      names the three founders and functional executives, but no current board roster, committee structure, or investor
      control rights are publicly disclosed. This limits external assessment of governance quality and key-person
      concentration risk.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO002
  - id: section-3
    title: Capital formation, investor mix, and public-sector support
    body: >-
      Sila's funding history reflects a classic deep-tech scale-up arc from early government grants through late-stage
      venture capital. The company received early grant support from DOE ARPA-E and NSF beginning around 2012–2016.
      Disclosed equity rounds include a Series D of $70 million led by Sutter Hill Ventures in 2018, a Series E of
      approximately $170–219 million with Daimler AG (Mercedes-Benz) participation in 2019, a Series F of approximately
      $590 million led by Coatue in January 2021, and a Series G of $375 million closed June 27, 2024, co-led by Sutter
      Hill Ventures and T. Rowe Price with participation from Bessemer Venture Partners, Coatue, and Perry Creek Capital.
      Total capital raised exceeds $1.3 billion. Reported post-money valuation estimates for the Series F ranged up to
      $3.3 billion; the Series G valuation is estimated between $2.48 billion and $3.4 billion by third-party trackers,
      though Sila has not confirmed an exact figure. In October 2022, the U.S. Department of Energy awarded Sila $100
      million under the Bipartisan Infrastructure Law to fund the Moses Lake facility buildout. Including earlier ARPA-E
      grants, DOE support totals over $120 million. The investor roster includes strategic participants Mercedes-Benz,
      Samsung Ventures, In-Q-Tel, Canada Pension Plan Investment Board, and BMW, alongside financial investors 8VC,
      Matrix Partners, and others.
