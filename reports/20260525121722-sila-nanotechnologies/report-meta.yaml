companyProfile:
  summary: >-
    Sila Nanotechnologies is a privately held U.S. battery materials company commercializing Titan Silicon, a
    silicon-dominant nanocomposite anode that replaces graphite in lithium-ion cells. The company has a real Moses Lake
    factory, a marquee Mercedes-Benz design win and Whoop consumer launch, $1.3B+ raised through a 2024 Series G, and
    DOE manufacturing support, but outside investors still cannot underwrite the business on disclosed unit economics.
  foundedDate: '2011-01-01'
  founders:
    - name: Gene Berdichevsky
      role: Co-founder and CEO
      background: Former Tesla principal battery engineer (employee #7); led early Roadster battery program.
      claimRefs: [CO012, CO013]
    - name: Gleb Yushin
      role: Co-founder and Chief Scientist
      background: Georgia Tech materials science professor; chemistry IP foundation for silicon anode research.
      claimRefs: [CO012, CO014]
    - name: Alex Jacobs
      role: Co-founder
      background: Engineering co-founder from the founding team.
      claimRefs: [CO012]
  foundingLocation: Alameda, California
  headquarters: Alameda, California
  productSummary: >-
    Sila's commercial product is Titan Silicon, a silicon-dominant nanocomposite anode powder that drops into existing
    lithium-ion cell production lines and is targeted to lift cell-level energy density by roughly 20% versus graphite.
  customerFocus: >-
    Premium automotive OEMs (BMW, Mercedes-Benz), consumer electronics (Whoop), and downstream battery cell makers
    (Panasonic-class) needing higher energy density.
  businessModel: >-
    B2B materials supply — long-cycle qualified contracts to OEMs and cell makers, priced per kilogram or per kWh of
    anode capacity; manufacturing-backed supply at Moses Lake.
  stage: late-stage private (Series G)
  fundingStatus: >-
    Privately funded; $375M Series G closed June 27, 2024, co-led by Sutter Hill Ventures and T. Rowe Price with
    participation from Bessemer, Coatue, and Perry Creek Capital. Total capital raised exceeds $1.3B, supplemented by a
    $100M DOE manufacturing grant for the Moses Lake plant.
  disclosureProfile: private-undisclosed
  claimRefs: [CO005, CO008, CO012, CO019, CO021, CO022, CO029]
