  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: manufacturing process
      missingEvidence: >-
        Detailed description of Sila's proprietary nanocomposite synthesis process including reactor type,
        temperature profiles, precursor chemistry, and yield metrics.
      whyItMatters: >-
        Without process details, investors cannot independently assess manufacturing cost, scalability,
        or competitive moat durability.
      diligencePath: >-
        Request confidential process overview under NDA during investor due diligence; evaluate against
        academic state-of-art for Si/C composite synthesis.
      relatedQuestionRefs:
        - QE007
    - type: missing-source
      severity: material
      topic: automotive cycle life
      missingEvidence: >-
        Independent third-party validation of Titan Silicon cycle life in automotive-format cells over
        1,000+ cycles with capacity retention data.
      whyItMatters: >-
        Automotive OEMs require demonstrated cycle life for 8–10 year warranty coverage; absence of public
        data leaves durability claims unverified.
      diligencePath: >-
        Request cycle-life test reports from OEM qualification programs (BMW, Mercedes) under NDA; seek
        independent lab validation from Argonne or similar.
      relatedQuestionRefs:
        - QE024
    - type: stale
      severity: minor
      topic: IATF certification
      missingEvidence: >-
        Confirmation that IATF 16949 certification at Moses Lake has been achieved and the certificate
        number/scope.
      whyItMatters: >-
        IATF is a prerequisite for automotive OEM procurement; pending status creates qualification risk.
      diligencePath: >-
        Request IATF certificate or registrar confirmation during next diligence contact; check IATF
        public database for registered sites.
      relatedQuestionRefs:
        - QE023
    - type: missing-source
      severity: minor
      topic: CO2 footprint verification
      missingEvidence: >-
        Independent life-cycle assessment or third-party verification of Sila's claimed 50–70% lower CO2
        footprint compared to graphite anode production.
      whyItMatters: >-
        ESG claims without independent verification may not satisfy OEM sustainability requirements or
        investor ESG screening criteria.
      diligencePath: >-
        Request published LCA methodology and third-party verification report; check if any OEM partner
        has independently validated the carbon footprint claim.
      relatedQuestionRefs:
        - QE015
    - type: missing-source
      severity: minor
      topic: developer signal
      missingEvidence: >-
        Public technical community engagement beyond academic publications — conference proceedings,
        technical blog posts, community forum participation.
      whyItMatters: >-
        Limited public developer signal makes it harder to independently assess engineering depth and
        technology community validation.
      diligencePath: >-
        Search conference proceedings from Battery Show, ECS meetings, AABC for Sila presentations;
        check LinkedIn engineering team publications.
