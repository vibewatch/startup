company:
  name: Sila Nanotechnologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Sila's Titan Silicon anode powder is a commercially shipping, drop-in silicon-dominant nanocomposite material
    that replaces graphite in lithium-ion cells. The product is backed by over 210 patents from co-founder Gleb Yushin's
    research, manufactured at an automotive-scale Moses Lake plant, and already validated in consumer electronics
    (10M+ devices) and announced for Mercedes-Benz and Panasonic Energy EV cells. Key diligence gaps remain around
    proprietary CVD process details, long-term automotive cycle-life data, and full IATF 16949 certification status.
sections:
  - id: product-definition
    title: Product definition and customer workflow
    body: >-
      Sila sells Titan Silicon, a silicon-carbon nanocomposite anode powder designed as a drop-in replacement for
      graphite in lithium-ion battery cells. The product targets two distinct buyer workflows. First, consumer
      electronics OEMs (wearables, earbuds, power tools, laptops) integrate Titan Silicon through cell-maker
      partners to gain up to 20% higher energy density or equivalently smaller battery volume without redesigning
      the device. Second, automotive OEMs and their cell suppliers (Mercedes-Benz via Panasonic Energy, and other
      unnamed partners) are qualifying Titan Silicon for EV traction cells where the claimed benefit is approximately
      20–25% energy-density uplift at the cell level. Sila also offers Battery Engineering Services, working
      directly with customers and their cell suppliers to define optimal cell chemistry, electrode design, and
      qualification pathways tailored to specific product requirements. The company has shipped commercially since
      2021 and claims more than 10 million devices powered by its material. The customer integration model is
      deliberately non-disruptive: existing lithium-ion production lines can incorporate the powder with minimal
      retooling, which lowers adoption barriers for cell manufacturers already running high-volume graphite-anode
      processes.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE002
    figureRefs:
      - FE002
  - id: product-modules
    title: Product and asset portfolio
    body: >-
      Sila's portfolio spans one core material product (Titan Silicon anode powder), a services layer (Battery
      Engineering Services), and two manufacturing assets. The Alameda, California facility has operated
      commercially since 2021, holds ISO 9001:2015 certification, and produces material for consumer electronics
      customers at a rate supporting 10+ million devices annually. The Moses Lake, Washington plant is described
      as the largest silicon anode facility in the Western world, with state-of-the-art processing systems
      designed for automotive quality and volumes. Sila states the Moses Lake site began commissioning in April
      2025 and targets full operational status in 2025. At full site buildout, the company claims capacity to
      power up to 3 million EVs and up to 150 GWh following planned expansions. The company also positions its
      technology across defense, flight and space, and data center applications, though public evidence for
      deployments in those segments remains limited to marketing positioning rather than named customers.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: architecture
    title: Technology and operating architecture
    body: >-
      Sila's core technology is a silicon-carbon nanocomposite material synthesized through a proprietary process
      that the company does not fully disclose publicly. The foundational chemistry was invented by co-founder
      Gleb Yushin at Georgia Tech, building on his extensive research in nanostructured materials for energy
      storage. The key technical challenge that Sila addresses is silicon's approximately 300% volume expansion
      during lithiation, which historically caused rapid capacity fade through particle cracking, SEI
      instability, and electrical contact loss. Sila's nanocomposite architecture encapsulates silicon within a
      carbon scaffold that accommodates expansion internally, presenting a stable outer surface to the cell
      electrolyte. This approach preserves the high theoretical capacity of silicon (approximately 3,579 mAh/g
      vs graphite's 372 mAh/g) while mitigating the mechanical degradation that plagued earlier pure-silicon
      approaches. The manufacturing process at Moses Lake employs what the company describes as the world's
      largest reactors for silicon anode materials, with production engineering designed for rapid scaling.
      Sila sources raw materials from U.S.-based suppliers including REC Silicon, Norco, Airgas, and Linde,
      positioning itself for domestic supply chain resilience and potential IRA tax credit advantages. The
      proprietary synthesis details—likely involving chemical vapor deposition or pyrolysis steps—remain the
      company's most closely guarded technical asset and represent a significant diligence gap for investors
      seeking to evaluate manufacturing cost and yield.
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
    tableRefs:
      - TE003
    figureRefs:
      - FE003
  - id: differentiation-ip
    title: Differentiation and intellectual property
    body: >-
      Sila's differentiation rests on three pillars. First, foundational IP: Gleb Yushin has co-authored over
      210 US and international patents and patent applications, with publications in Nature Materials, JACS,
      ACS Nano, and Science. His 2010 Nature Materials paper on hierarchical silicon anodes is among the most
      cited works in the field, and multiple 2025-filed patents cover scaffolding matrices, electrode interlayers,
      and complex electrolytes—indicating continued active prosecution. Second, manufacturing know-how: Sila
      claims the highest throughput technology for Si/C anodes and has built what it describes as the world's
      largest reactors for silicon anode materials. The Moses Lake plant leverages decades of process engineering
      from team members with backgrounds at REC Silicon, PPG Industries, and Intel. Third, customer validation:
      commercial shipping since 2021 across 10+ million consumer devices provides real-world cycle data that
      competitors without volume production cannot match. The combination of deep academic foundations, scaled
      manufacturing, and commercial track record creates barriers that are difficult to replicate quickly, though
      competitors Group14, Amprius, and Enovix are each pursuing distinct silicon-integration approaches with
      their own IP and factory investments.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
    tableRefs:
      - TE004
  - id: trust-quality
    title: Trust, quality, and compliance
    body: >-
      Sila's quality infrastructure includes ISO 9001:2015 certification at the Alameda facility, with IATF
      16949 systems in place and certification implementation underway at Moses Lake. The company emphasizes
      end-to-end quality control testing and maintains an Environment, Health, Safety, and Security team at
      Alameda. The Moses Lake plant is positioned for automotive-grade production with robust production
      processes. Sila claims a 50–70% lower CO2 footprint versus conventional graphite anode production, which
      supports ESG positioning and potential regulatory advantages. The company's U.S.-based manufacturing
      and domestic raw material sourcing offer tariff and tax credit advantages under the Inflation Reduction
      Act framework. However, several trust-related gaps persist: no public SOC 2 or cybersecurity certification
      has been located, no independent third-party cycle-life validation data is published, IATF certification
      is described as underway rather than achieved, and the proprietary nature of the synthesis process means
      no independent manufacturing audit results are publicly available. These gaps are typical for a private
      advanced-materials company but represent material diligence items for automotive OEM procurement teams.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
    tableRefs:
      - TE005
    figureRefs:
      - FE004
  - id: roadmap
    title: Roadmap and development trajectory
    body: >-
      Sila's trajectory shows clear phase progression from R&D (founded 2011) through consumer electronics
      commercialization (first shipment 2021) to automotive-scale manufacturing (Moses Lake commissioning 2025).
      The company announced automotive supply agreements with Mercedes-Benz and Panasonic Energy, positioning
      Titan Silicon for next-generation EV cells. The Moses Lake plant began commissioning in April 2025 with
      targeted full operational status in 2025. Planned expansions could reach 150 GWh of capacity. The press
      page references a Plant 2 tool install RFP dated April 2026, suggesting active planning for capacity
      expansion beyond the initial Moses Lake footprint. The technology roadmap likely involves progressive
      increases in silicon content percentage to drive further energy density gains, though specific silicon
      loading percentages and next-generation product specifications remain undisclosed. The automotive
      qualification timeline is the critical path item: cell validation, module testing, and vehicle-level
      qualification typically require 2–4 years from material availability to series production.
    claimRefs:
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037
