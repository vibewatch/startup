callouts:
  - calloutType: strength
    title: Deep IP moat with 210+ patents and foundational academic research
    body: >-
      Gleb Yushin's 180+ publications and 210+ patents create one of the deepest IP positions in silicon
      anode technology. The 2010 Nature Materials paper on hierarchical silicon anodes remains a foundational
      reference, and active 2025 patent filings show continued prosecution across scaffolding, interlayer,
      and electrolyte innovations.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
  - calloutType: risk
    title: Automotive cycle-life and manufacturing yield data remain proprietary
    body: >-
      Despite claims of automotive qualification with BMW (historically) and Mercedes/Panasonic, Sila has
      not published independent cycle-life data, capacity retention curves, or manufacturing yield metrics.
      Silicon anode degradation from volume expansion and SEI instability is a well-documented challenge in
      academic literature, and the absence of public long-term data leaves a material gap for investors
      evaluating durability risk.
    claimRefs:
      - CE015
      - CE030
      - CE038
      - CE039
  - calloutType: insight
    title: Consumer electronics track record de-risks automotive ramp
    body: >-
      Sila's 10M+ device shipments since 2021 provide real-world manufacturing and field-failure data that
      pure-automotive silicon anode startups lack. This consumer base serves as a proving ground for
      process maturity before the higher-stakes automotive qualification cycle.
    claimRefs:
      - CE008
      - CE009
      - CE032
