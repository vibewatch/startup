        - id: j1
          label: Strategic investment / R&D contact
          detail: OEM venture arm or corporate development identifies Sila technology; may invest (BMW i Ventures 2017, Daimler 2017).
          tone: neutral
        - id: j2
          label: Material evaluation and cell testing
          detail: Cell manufacturer or OEM tests Sila anode material against performance targets over 12–24 months.
          tone: neutral
        - id: j3
          label: Platform qualification
          detail: Material qualified into specific vehicle platform or product program; 2–3 year process with extensive testing.
          tone: positive
        - id: j4
          label: Supply agreement / production commitment
          detail: OEM or cell maker signs supply agreement; triggers factory investment (BMW announcement 2022, Moses Lake construction).
