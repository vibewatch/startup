company:
  name: Sila Nanotechnologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Sila Nanotechnologies has two confirmed production customers — BMW Group for automotive battery cells and WHOOP for
    consumer wearables — plus a strategic partnership with Mercedes-Benz. The customer base is narrow and concentrated,
    with BMW dominating the commercial roadmap from 2026 onward. Public proof of adoption is strong for named
    counterparties but retention, pricing, and revenue concentration metrics remain undisclosed.
sections:
  - id: s601
    title: 'Customer segmentation: premium auto OEMs, consumer electronics, and strategic verticals'
    body: >-
      Sila's customer base segments into three tiers. The first and most commercially significant tier is premium
      automotive OEMs. BMW Group is the flagship customer, having announced in 2022 that Sila's silicon anode material
      would power its next-generation battery cells for the Neue Klasse platform launching in 2026. Mercedes-Benz
      followed in 2023, confirming Sila material for future electric G-Class and AMG performance vehicles. These OEM
      relationships involve multi-year qualification cycles (typically 3–5 years per program) and represent the bulk of
      Sila's projected commercial volume. The second tier is consumer electronics, anchored by WHOOP. The Whoop 4.0
      fitness band, launched in 2021, was the first commercially shipping product to use Sila's silicon anode material,
      demonstrating real-world production viability at scale before the automotive programs matured. The third tier is
      strategic and speculative: In-Q-Tel's investment signals potential defense and intelligence community interest, and
      Sila has discussed grid storage applications, though no named customer exists publicly in these verticals. The
      buyer, user, and payer differ by segment: in automotive, the cell manufacturer (e.g. Samsung SDI for BMW) is the
      direct material buyer while the OEM is the end-use specifier; in wearables, WHOOP is simultaneously buyer, user,
      and payer.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
      - CU011
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: s602
    title: Adoption trajectory from first wearable shipment to automotive production ramp
    body: >-
      Sila's customer adoption arc follows a clear sequence: laboratory qualification, small-format consumer product
      validation, then large-format automotive production. The timeline is anchored by observable milestones. In 2021,
      WHOOP 4.0 launched with Sila material, establishing the first commercial production reference and proving that
      the anode material could survive real-world manufacturing and product qualification. This was a deliberate
      strategy by Sila to demonstrate producibility in a lower-risk, smaller-scale application before the higher-stakes
      automotive deployments. BMW's partnership dates to at least 2017 through BMW i Ventures, but the formal
      production announcement came in 2022 when BMW confirmed Sila as a supplier for its 6th-generation battery cells
      in the Neue Klasse architecture. Series production is targeted for 2026–2027, contingent on Sila's Moses Lake,
      Washington factory reaching volume output. Mercedes-Benz announced its partnership in 2023, with production
      timelines less precisely defined but aligned to the late-2020s G-Class and AMG programs. The adoption trajectory
      therefore shows Sila converting a single consumer product reference into multiple automotive OEM commitments over
      a 4–5 year qualification window, with the critical inflection point being the Moses Lake factory's ability to
      supply automotive volumes starting in 2026.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: s603
    title: Named customer proof — production status, outcomes, and evidence quality
    body: >-
      The three named customers represent different points on the pilot-to-production spectrum. WHOOP is the only
      customer in confirmed series production with Sila material shipping since 2021. BMW is in pre-production with
      confirmed supply agreements and a factory under construction, targeting 2026 initial production. Mercedes-Benz is
      in qualification and partnership stage with less publicly defined timelines. For each customer, the public evidence
      quality varies. WHOOP proof is strongest: product teardowns, company announcements, and user reviews confirm Sila
      material is shipping in millions of units. BMW proof is anchored by official BMW press releases and Sila corporate
      announcements, corroborated by automotive press coverage of the Neue Klasse platform. Mercedes proof rests
      primarily on a joint press release and subsequent automotive media coverage, with fewer details on volumes or
      timelines. Panasonic has been referenced in some coverage as a potential supply relationship, but no definitive
      production agreement has been publicly confirmed and the relationship remains speculative. The named customer proof
      table below enumerates each confirmed relationship with its evidence basis and limitations.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU015
      - CU016
