  - id: s604
    title: Retention, durability, and satisfaction — mostly undisclosed
    body: >-
      Sila's customer durability profile is largely opaque from public sources. The company is private and does not
      disclose net revenue retention, gross retention, churn, contract lengths, or satisfaction metrics. What can be
      inferred is limited. WHOOP has continued using Sila material through at least the Whoop 4.0 product lifecycle
      (2021–present), suggesting retention of at least one product generation. BMW's relationship spans from the 2017
      BMW i Ventures investment through the 2022 production announcement and continues through 2026 factory
      construction — an implied 9-year relationship, though the bulk of commercial revenue has not yet begun. The
      automotive qualification cycle itself acts as a structural retention mechanism: once a material is qualified into
      a vehicle platform, switching costs are extremely high and multi-year contracts are standard. However, no public
      source discloses actual contract duration, volume commitments, pricing, take-or-pay terms, or renewal mechanics.
      The absence of any reported customer losses or partnership terminations is weakly positive but cannot substitute
      for disclosed retention data.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
    tableRefs:
      - TU004
      - TU006
  - id: s605
    title: Expansion paths and concentration risk
    body: >-
      Sila's customer concentration risk is significant and dominated by BMW. The Neue Klasse program represents by far
      the largest publicly announced volume commitment, and Sila's Moses Lake factory appears primarily sized and timed
      for BMW supply. This creates single-customer dependence at the revenue level even if the partnership roster
      includes Mercedes-Benz and WHOOP. The expansion path depends on several vectors: additional OEM qualifications
      (Mercedes production volumes, potential new OEMs), growth in consumer electronics beyond WHOOP, potential defense
      applications signaled by the In-Q-Tel relationship, and grid storage applications. However, automotive OEM
      qualification cycles mean that meaningful revenue diversification beyond BMW is unlikely before 2028–2029. A
      further concentration risk exists at the channel level: Sila supplies anode material to cell manufacturers (e.g.
      Samsung SDI) who then supply OEMs, creating intermediary dependence. If BMW were to delay or cancel the Neue
      Klasse EV program, or if broader EV demand softened, Sila's near-term commercial viability would be directly
      impacted. Recent coverage of EV demand slowdowns in Europe and BMW's own production timeline adjustments represent
      material adverse signals for Sila's concentration-heavy customer base.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
