callouts:
  - calloutType: strength
    title: Two premium OEMs validate technology for highest-performance EV applications
    body: >-
      BMW and Mercedes-Benz — two of the world's most demanding automotive OEMs — have both publicly committed to Sila
      material for their premium EV platforms. This dual-OEM validation is rare for a startup materials company and
      signals genuine technology differentiation.
    claimRefs:
      - CU002
      - CU004
      - CU015
  - calloutType: risk
    title: BMW concentration creates single-customer revenue dependence through at least 2028
    body: >-
      BMW's Neue Klasse program dominates Sila's near-term commercial roadmap. The Moses Lake factory is sized and
      timed primarily for BMW supply. Until Mercedes or additional OEMs reach production, Sila faces acute
      single-customer concentration risk amplified by broader EV demand uncertainty.
    claimRefs:
      - CU026
      - CU027
      - CU031
      - CU032
  - calloutType: insight
    title: WHOOP proves producibility but automotive is the make-or-break customer
    body: >-
      WHOOP's confirmed production since 2021 demonstrates Sila can manufacture and ship at scale, but automotive
      volumes will be orders of magnitude larger. The consumer reference de-risks technology but does not de-risk the
      automotive commercial execution.
    claimRefs:
      - CU001
      - CU014
      - CU016
