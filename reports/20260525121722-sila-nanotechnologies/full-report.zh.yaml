              年内商业化，整个硅负极类别可能变成过渡品类。最不利情形是，硅负极成为一种由既有厂商规模化制造的大宗投入品；既有厂商通过授权或独立开发吸收 IP，侵蚀 Sila 等纯玩家创业公司目前享有的溢价。
