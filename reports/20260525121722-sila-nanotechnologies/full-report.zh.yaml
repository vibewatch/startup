      - number: '7.3'
        title: 合作伙伴和客户集中带来单点故障暴露
        blocks:
          - type: paragraph
            body: >-
              BMW 是 Sila 最主要的商业关系——2021 年 BMW iX 电动 SUV 供货协议是唯一公开确认有量的汽车项目，使 Sila 在最高价值产品线上实质上成为单一客户公司。若 BMW 推迟 EV
              项目、转向其他化学路线，或自身需求走弱，Sila 的收入爬坡和工厂利用率假设都会坍塌。Sila 在价值链中的位置进一步放大依赖：作为负极材料供应商，Sila 依赖电池电芯制造商（目前认为 BMW 电池包由
              Samsung SDI 供货）把其材料集成进电芯，形成两步依赖，且电芯厂和 OEM 都不由 Sila 直接控制。DOE 拨款拨付时间也是财务依赖——$100M 按里程碑发放，Moses Lake
              调试任何滑坡都会推迟资本开支计划可能假设的现金流入。特种硅前驱体（硅烷气、特定有机硅化合物）和专有导电涂层化学品存在单一来源风险，替代合格供应商可能无法达到所需纯度等级。FEOC
              限制可能迫使非中国材料来源重新认证，增加 12–18 个月认证周期。消费电子渠道（WHOOP 健身手环及其他可穿戴设备）提供收入多元化，但规模比汽车小几个数量级；若 BMW 出货不及预期，缓冲有限。
