          - type: callout
            title: Bloomberg 与 Reuters 估值差异是重大红旗
            body: >-
              报道的 Series G 估值相差 $900M（$2.48B vs $3.4B），可能意味着较 2021 年 Series F（$3.3B）出现
              降估值融资、存在复杂优先权条款，或第三方报道不可靠。任何一种解释都会带来承销风险，且无法在不直接接触管理层的情况下消除。
            calloutType: risk
            claimRefs:
              - CV005
