  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现架构
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies 通过 B2B 先进材料供应模式产生收入。公司在 Washington 州 Moses Lake 工厂制造自有硅基负极材料（品牌 Titan
              Silicon），并根据多年供应协议出售给电池电芯制造商和 OEM。变现单位是每公斤负极材料的美元价格，或等价地，按其支持的每 kWh 电池容量计价。第一笔商业收入来自消费电子（与 Whoop
              健身手环合作），此后公司把主要增长重心转向车规 EV
              电池材料。收入确认可能跟随材料发货和客户验收，但精确确认政策没有公开披露。该商业模式包含汽车供应链典型的长认证周期，意味着获客成本前置，而收入兑现比初始接触滞后 2–5 年。公司披露了与
              Mercedes-Benz 和 BMW 的合作，用 Sila 材料开发下一代 EV
              电池，但没有公开合同金额、数量或价格。收入模型在结构上类似特种化学品或先进材料业务：高固定成本制造，利润率随产量扩大而扩张，但受客户集中风险和认证依赖影响。
