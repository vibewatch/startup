      - number: '8.5'
        title: 退出准备度和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Sila 的退出路径大概率是 IPO 或战略收购。2024–2025 年电池材料公司 IPO 窗口部分重开，但仍很挑剔：QuantumScape 和 Amprius 曾以较高估值通过 SPAC
              上市，随后估值压缩，使投资者对收入前电池公司更怀疑。常规 S-1 IPO 会要求 Sila 披露收入、利润率和客户集中度——这些正是当前公开记录缺失的数据。另一条路是被
              OEM（Mercedes、BMW）或电芯制造商（Samsung SDI、LG Energy Solution、Panasonic）战略收购，但估值更可能按生产现实倍数，而不是前瞻 VC
              标记。今天的投资者需要回答的关键问题，不是 Sila 是否是一家优质公司——技术和合作显然都很强——而是 Series G
              入场价在稀释、优先权和执行风险之后，是否还留下足够上行来补偿流动性不足。缺少已披露收入运行率、贡献利润率和优先权条款，这个问题无法回答。所需尽调包包括完整
              股权结构表和优先权栈、按细分拆分的当前及预测收入、Mercedes 认证时间表和量承诺、Moses Lake 工厂良率与成本数据，以及二级市场交易历史。
