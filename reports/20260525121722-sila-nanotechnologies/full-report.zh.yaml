      - number: '7.4'
        title: 人才和执行风险反映关键人依赖与此前组织压力
        blocks:
          - type: paragraph
            body: >-
              Gene Berdichevsky 是联合创始人兼 CEO，也是公司对外门面、主要融资关系持有人，以及 Sila OEM
              合作策略的战略设计者。公司仍处于收入前阶段，一旦他离职或失去履职能力，投资者和客户信心会立即受损。Gleb Yushin 是联合创始人兼首席科学家，在 Georgia Tech
              任职期间形成了纳米结构硅负极化学的基础 IP；这类深度技术知识很难复制，也是持续材料创新的单点故障。2022 年裁员据报约占员工 20%，说明 Sila
              在从研发转向制造规模化时经历过明显组织压力——这在深科技硬件公司中常见，但可能留下文化伤痕、机构知识缺口和招聘市场声誉损伤。在 Alameda, California
              总部市场招聘电池工程师和工艺化学师竞争极其激烈，Tesla、QuantumScape、Redwood Materials 以及大量电池相邻公司争夺同一人才池。Moses Lake
              站点面对不同但同样困难的招聘动态：要把有经验的化工厂操作员吸引到华盛顿州东部乡村地点，需要高薪和搬迁支持，爬坡期利润率会被挤压。
