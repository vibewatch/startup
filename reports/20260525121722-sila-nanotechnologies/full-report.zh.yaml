      - number: '8.2'
        title: 投资逻辑——带 OEM 验证的负极平台
        blocks:
          - type: paragraph
            body: >-
              Sila 的正面投资逻辑立在三根柱子上：技术差异化、OEM 级合作和制造可信度。公司的硅基负极材料已证明能比传统石墨负极提升 20-40% 能量密度，直接带来更小、更轻、续航更长的 EV
              电池，也提升消费电子能量密度。Mercedes-Benz 选择 Sila 作为 EQ 平台负极供应商，代表纳米复合硅负极首次通过大型汽车认证。Whoop 在 4.0 设备中出货搭载 Sila
              的电池，证明消费级规模下具备量产准备度。华盛顿州 Moses Lake 设施按多 GWh 产出设计，是美国少数专门建设且正在运行的硅负极工厂之一。DOE 贷款项目办公室参与和 IRA
              时代本土内容激励提供额外政策顺风。投资人名单——Coatue、Bessemer、T. Rowe Price、Sutter Hill、8VC，以及 Daimler 等战略伙伴——显示机构质量。若 Sila
              能把汽车认证转化为有吸引力 ASP 和正贡献利润率的批量供货合同，$2.5-3.4B 的估值区间相对 EV 电池材料可服务市场可能反而保守。
