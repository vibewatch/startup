  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 硅负极技术相对石墨可带来 20-40% 能量密度提升，直击电动车电池性能的核心瓶颈。
        - 若固态、锂金属等竞争路线在没有硅膨胀管理难题的情况下实现同等密度提升，该逻辑会削弱。
      - - 投资逻辑
        - Mercedes-Benz 的 OEM 选择代表汽车级认证；多数电池材料初创公司拿不到这一关。
        - 若 Mercedes 公开确认批量交付日期和承诺金额，逻辑会增强；若合作停滞或 Mercedes 转向其他供应商，逻辑会削弱。
      - - 投资逻辑
        - Moses Lake 工厂和 IRA 本土内容激励，为美国电池材料生产提供制造可信度和政策顺风。
        - 若 DOE LPO 提供直接贷款支持，逻辑会增强；若工厂爬坡落后计划，或 IRA 激励价值因政策变化缩水，逻辑会削弱。
      - - 反向逻辑
        - Bloomberg 与 Reuters 对 G 轮的估值差异（$2.48B vs $3.4B）提示潜在下行轮，或外部投资者看不到的复杂优先权条款。
        - 如果管理层确认 $3.4B 是标准优先权下的干净上行轮，该风险可解除；如果 T. Rowe Price 共同基金 NAV 减记确认 Bloomberg 的较低数字，风险会恶化。
      - - 反向逻辑
        - 收入、利润率、ASP、汽车交付量和生产良率均未公开；在 $2.5B+ 入场价格下，投资测算几乎失明。
        - 只有管理层直接披露或 S-1 文件才能消除这一缺口。若 Forge Global 或 EquityZen 出现交易数据，二级市场价格可提供过渡信号。
    notes: 投资逻辑取决于执行：OEM 认证能否转化为量产收入；反向逻辑则落在估值不透明，以及消费电子出货和汽车规模化生产之间的落差。
    claimRefs:
