        title: 信任、质量与合规
        blocks:
          - type: paragraph
            body: >-
              Sila 的质量基础设施包括 Alameda 设施的 ISO 9001:2015 认证，Moses Lake 已建立 IATF 16949 体系并正在推进认证落地。公司强调端到端质量控制测试，并在 Alameda
              设有 Environment, Health, Safety, and Security 团队。Moses Lake 工厂定位于车规级生产，配备稳健生产流程。Sila 声称相较传统石墨负极生产，CO2 足迹低
              50–70%，这支撑 ESG 定位和潜在监管优势。公司美国本土制造和本土原材料采购，在 Inflation Reduction Act 框架下提供关税和税收抵免优势。但多个信任缺口仍在：未找到公开 SOC 2
              或网络安全认证；没有发布独立第三方循环寿命验证数据；IATF 认证被描述为进行中而非已取得；合成工艺的自有属性意味着没有公开独立制造审计结果。这些缺口对私营先进材料公司并不罕见，但对车企 OEM
