        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              对 Sila Nanotechnologies 的财务判断是：结构上有吸引力，但公开来源无法实质验证。收入质量取决于 OEM 认证胜利的耐久性，以及供应协议是否转化为带 take-or-pay
              保护的合同最低采购量。利润率路径取决于制造良率、能源成本、前驱体价格和产能利用率——这些都不公开。资本强度显然很高：建设绿地先进材料工厂、通过车企 OEM
              认证并扩大产量，都要求在盈亏平衡前持续投入数亿美元。公司投资者基础（Franklin Templeton、T. Rowe Price、Coatue、Bessemer）显示机构信心，DOE 补助提供非稀释支持。但
              2023–2024 年 EV 需求放缓、报道中的 down-round 估值，以及 2022 年裁员，都说明 Sila
              通往盈利的路径比最初预期更长、更不确定。最高优先级尽调问题包括：当前现金余额、月度烧钱、OEM 伙伴的合同产量承诺、已实现 ASP / kg、制造良率和 COGS / kg、45X
              抵免资格及预期收益，以及达到毛利率盈亏平衡的时间线。在管理层提供这些输入前，Sila 应被视为一家资本充足但财务不透明的先进材料公司，其商业牵引尚无法承保。
