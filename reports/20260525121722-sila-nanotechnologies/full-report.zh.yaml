  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和政策风险集中在 IRA 抵免波动与 DOE 拨款合规
        blocks:
          - type: paragraph
            body: >-
              Sila 的 Moses Lake 工厂经济模型高度依赖 IRA 第 45X 条先进制造生产抵免，该抵免按 kWh 补贴美国本土电极活性材料生产。Trump 政府 2025 年审查 IRA
              清洁能源条款，带来直接政策风险：美国财政部 2024 年 12 月发布的指引收窄了资格标准；2025 年初拟议规则又显示受关注外国实体限制可能进一步收紧，影响 Sila
              上游硅前驱体采购。另一个独立风险是，Moses Lake 产能建设获得的 $100M DOE 拨款附带里程碑式拨付条件，这是清洁能源示范办公室
              授予项目的典型设计——若无法达到产能爬坡目标或本土内容门槛，可能触发部分追回。RCRA 下的 EPA 危险材料处理要求适用于硅纳米颗粒加工废物流，OSHA 过程安全管理标准则约束 Moses Lake
              的化学气相沉积作业。实体清单扩围带来的出口管制收紧，可能限制 Sila 服务部分亚洲 OEM
              客户，前提是其材料被归类为军民两用先进材料。整体监管图景不是执法迫在眉睫，而是政策尾部风险叠加：抵免可能减少，投入品可能受限，合规负担也可能上升。
