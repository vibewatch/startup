  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies 向锂离子电池供应链销售先进硅负极材料，具体产品是 Titan
              Silicon。核心市场边界是电池负极材料，既包括既有石墨负极，也包括下一代硅基替代品。纳入支出覆盖电芯制造商为
              EV、消费电子和固定储能电池采购负极材料时流向负极材料供应商的收入。排除支出包括正极材料、电解液、隔膜、电芯组装和电池包集成。相关买方是电池电芯制造商（如 Panasonic、Samsung
              SDI、CATL），他们采购负极粉体或复合材料用于电芯生产。终端客户通常是汽车 OEM（Mercedes-Benz、BMW）或设备制造商（Whoop）。现状替代品是来自中国现有企业的合成石墨和天然石墨，如
              BTR、Shanshan 和 Putailai；这些企业合计控制全球负极产能超过 76%。相邻市场包括固态电池材料和锂金属负极，长期可能与硅竞争下一代能量密度提升，但离商业化更远。
