      - number: '2.5'
        title: 美国政策与激励格局
        blocks:
          - type: paragraph
            body: >-
              Inflation Reduction Act 的 Section 45X Advanced Manufacturing Production Credit，对在美国本土制造的电极活性材料提供按生产成本 10%
              计的抵免。2024 年底发布的最终法规确认负极材料符合资格，且关键矿物组件不设逐步退出。Sila 的 Moses Lake 工厂定位为从 2025–2026 年商业生产开始获取这些抵免。此外，Sila 于
              2022 年 10 月根据 Bipartisan Infrastructure Law 获得 $100 million DOE 补助，明确用于本土电池材料制造规模化。更广泛政策环境有利于回流本土：围绕中国控制
              80% 电池级石墨精炼的担忧、潜在出口管制，以及两党对能源独立的支持，都给美国制造替代品带来监管拉力。这些激励显著改善 Sila
              相对中国石墨进口的单位经济模型；不过，如果没有制造规模和良率提升，仅靠抵免仍无法完全弥合成本差距。
