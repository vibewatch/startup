      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              支撑硅负极采用的结构性驱动包括：EV 续航要求上升；石墨能量密度触顶（理论值 360–370 mAh/g，对比硅的 4,200 mAh/g）；电池包价格下降，为高端材料腾出成本空间；以及 IRA Section
              45X 制造抵免等政策激励，对美国制造的电极活性材料提供相当于生产成本 10% 的抵免。Sila 根据 Bipartisan Infrastructure Law 获得的 $100M DOE
              补助，进一步降低资本开支风险。但重大约束仍在。石墨便宜得多，也已被大规模验证；中国负极供应商产能过剩、定价激进。硅在充放电循环中有 300% 体积膨胀，会带来缩短循环寿命的工程挑战。OEM 认证周期长达 3–5
              年，意味着即使产品技术更优，也需要多年才能转化为收入。2024–2025 年，欧洲和美国 EV 市场本身出现需求放缓，销量低于预测，尽管中国仍然强劲。Goldman Sachs 和 Roland Berger
              指出，电池价格下降最终应会重新点燃需求，但时间仍不确定。对 Sila 而言，约束在执行：能否把 Moses Lake 10 GWh 爬坡转成已交付、已认证，且成本与进口品持平的材料。
