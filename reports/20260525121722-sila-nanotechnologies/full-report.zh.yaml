      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              Sila 由三位拥有深厚电池与材料科学背景的人士于 2011 年共同创立。CEO Gene Berdichevsky 曾是 Tesla 第七号员工，并担任 Roadster
              电池包首席工程师——这是全球首个量产汽车锂离子系统。他拥有 Stanford 机械工程与能源工程 BS 和 MS 学位，并共同署名超过 45 项专利。联合创始人兼 CTO Dr. Gleb Yushin 是
              Georgia Institute of Technology 材料科学教授、Materials Today 主编，并拥有超过 210 项美国及国际专利。联合创始人兼工程 VP Alex Jacobs 毕业于
              MIT 机械工程，也曾在 Tesla 参与 Roadster 和 Smart Fortwo 电池包设计，随后在 Amprius 管理电芯运营，再共同创立 Sila。公开治理披露很薄：Sila
              管理层页面列出三位创始人和职能高管，但没有公开现任董事会名单、委员会结构或投资者控制权安排。外部因此难以评估治理质量和关键人集中风险。
