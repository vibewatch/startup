      - number: '7.5'
        title: 缓释姿态和打破假设的触发器
        blocks:
          - type: paragraph
            body: >-
              Sila 的缓释措施部分可见：$590M Series F 提供跑道，DOE 拨款降低资本开支风险，BMW
              关系提供需求可见性，消费电子收入流带来近期现金流。不过，关键缓释项——制造良率提升曲线、客户多元化管线、循环寿命实地验证数据和接班计划——要么私有，要么尚未证明。正确的监控框架应把以下事项视为打破投资假设的触发器，而不是背景噪音：IRA
              45X 抵免取消或实质削减、Moses Lake 爬坡后 12 个月良率显著低于计划、BMW 项目取消或延迟多年、第二轮重大裁员，或独立循环寿命数据发布并显示硅负极在汽车工况下退化劣于 NMC-graphite
              替代方案。否决标准应绑定可观察公开里程碑：搭载 Sila 材料的 BMW iX 产量、Moses Lake 出货公告、DOE 拨款确认，以及硅负极领域任何专利诉讼结果。缺少公开实地性能数据本身就是软触发器——若到
              2027 年底仍没有 OEM 发布搭载 Sila 车辆的真实循环寿命结果，技术风险假设会明显转暗。
