  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议维持继续研究：技术和 OEM 验证很强，但估值不透明、经济性未披露，抵消了这部分优势。
    data:
      nodes:
        - id: n1
          label: 技术差异化
          detail: 生产中已证明，相比石墨负极，能量密度提升 20-40%。
          tone: positive
        - id: n2
          label: OEM 验证
          detail: Mercedes-Benz 合作和 WHOOP 消费端出货，证明量产已就绪。
          tone: positive
        - id: n3
          label: 资本和制造
          detail: 累计融资 $925M+，Moses Lake 工厂已运营，IRA 政策形成利好。
          tone: positive
        - id: n4
          label: 估值不透明
          detail: Bloomberg（$2.48B）与 Reuters（$3.4B）的差异尚未解决；相较 2021 年 Series F，可能出现估值下调。
          tone: negative
        - id: n5
          label: 经济性未披露
          detail: 没有公开收入、利润率、汽车 ASP 或生产良率数据。
          tone: warning
        - id: n6
          label: 建议
          detail: 继续研究；风险高；在经济性和定价披露前，估值立场未知。
          tone: warning
      edges:
        - from: n1
          to: n6
