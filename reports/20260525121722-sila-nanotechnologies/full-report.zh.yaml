      - number: '1.4'
        title: 制造就绪度、合作伙伴与商业牵引
        blocks:
          - type: paragraph
            body: >-
              Sila 的商业路径从消费电子概念验证，走向车企供货承诺。公司首次商业出货发生在 2021 年 9 月，Titan Silicon 用于 WHOOP 4.0 健身可穿戴设备，在更小体积内带来 17%
              更高能量密度。2022 年，Mercedes-Benz 选择 Sila 的负极材料用于即将推出的电动 G-Class 系列，Sila 因而成为首家与全球车企签署供应协议的下一代电池材料公司。2023 年 12
              月，Panasonic Energy 签署 Titan Silicon 商业协议，将其导入下一代 EV 电池。G 轮新闻稿还提到三份未披露客户合同。Sila 公开新闻也提及无人机、防务机器人、卫星和 AR/VR
              应用。尽管已有这些承诺，Moses Lake 的全规模商业车规出货仍安排在 2025 年底到 2026 年，而不是已经交付。公司未披露收入、ARR，或已经在量产车中使用 Sila
              材料的精确车辆规模。与此同时，更广泛的 EV 市场需求转弱，同期 Ionic Materials、OneD Battery Sciences、Freyr Battery 等电池创业公司陷入困境或关停——这让
              Sila 持续融资和执行显得突出，也凸显竞争环境风险。
