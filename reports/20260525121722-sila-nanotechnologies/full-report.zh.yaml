  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Mercedes 在 2026-2027 年开始量产，Moses Lake 达到目标良率；Sila 在披露 $200M+ 收入运行率和 30%+ 毛利率后，以 $5-8B 估值 IPO。
        - 若 IPO 估值达到 $6B+，G 轮入场可获得 2-3x 回报；前提是证明汽车 ASP 在规模化后能支撑利润率。
        - 汽车认证延迟、硅负极在规模化下的循环寿命限制、未盈利硬件公司 IPO 窗口关闭。
        - 若 Mercedes 项目按计划推进，且 Sila 跑出制造成本曲线，该情景可能成立；但目前没有公开证据确认收入轨迹。
      - - 基准
        - 消费电子收入稳步增长，Mercedes 时间表延长 12-18 个月；Sila 在 IPO 准备就绪前，以持平到小幅上调估值完成桥接轮或 H 轮。
        - G 轮入场回报持平到小幅正回报；若缺少明确 IPO 催化，后续融资稀释会抵消估值上调。
        - 没有汽车收入时持续烧钱、优先股堆叠继续累积，以及潜在 T. Rowe Price NAV 减记信号。
        - 与当前公开证据最一致：技术强，消费出货真实但有限，汽车时间表拉长。
      - - 悲观
        - Mercedes 推迟或取消硅负极计划，Moses Lake 出现良率问题；下一轮明确成为低于 $2B 的下行轮，或公司转向授权模式。
        - G 轮入场亏损 50-80%；若下行轮估值低于 $2B，后期优先股堆叠可能抹掉普通股价值。
        - 固态或替代负极化学体系跨越式超车、硅在汽车规模下的膨胀 / 衰减问题、电动车需求放缓。
        - Amprius（$130M）、SES（$300M）等电池技术公司已从私募估值高点大幅压缩，该情景不能排除。
    notes: 情景基于以 $2.5-3.4B 估值进入 G 轮。估值区间本身很宽，带来情景不确定性：乐观和悲观结果很大程度取决于哪个报道数字才是真实股权价值。
