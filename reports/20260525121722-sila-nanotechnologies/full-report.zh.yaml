      - number: '1.3'
        title: 资本形成、投资者结构与公共部门支持
        blocks:
          - type: paragraph
            body: >-
              Sila 的融资史呈现典型深科技扩张曲线：从早期政府补助走向后期风险资本。公司约在 2012–2016 年开始获得 DOE ARPA-E 和 NSF 的早期补助支持。已披露股权轮次包括 2018 年由
              Sutter Hill Ventures 领投的 $70 million D 轮，2019 年 Daimler AG（Mercedes-Benz）参投、规模约 $170–219 million 的 E
              轮，2021 年 1 月由 Coatue 领投、规模约 $590 million 的 F 轮，以及 2024 年 6 月 27 日关闭的 $375 million G 轮；G 轮由 Sutter Hill
              Ventures 和 T. Rowe Price 共同领投，Bessemer Venture Partners、Coatue、Perry Creek Capital 参投。累计融资超过 $1.3
              billion。Series F 的投后估值报道最高到 $3.3 billion；Series G 估值被第三方追踪机构估在 $2.48 billion 至 $3.4 billion 之间，但 Sila
              未确认具体数字。2022 年 10 月，美国 Department of Energy 根据 Bipartisan Infrastructure Law 向 Sila 授予 $100 million，用于
              Moses Lake 设施建设。算上早期 ARPA-E 补助，DOE 支持总额超过 $120 million。投资者名单包括战略投资方 Mercedes-Benz、Samsung
              Ventures、In-Q-Tel、Canada Pension Plan Investment Board 和 BMW，也包括 8VC、Matrix Partners 等财务投资者。
