              Sila 的组合包括一个核心材料产品（Titan Silicon 负极粉体）、一层服务（Battery Engineering Services）和两项制造资产。California 州 Alameda 设施自
              2021 年起商业运营，持有 ISO 9001:2015 认证，并按支持每年 10+ million 台设备的速度为消费电子客户生产材料。Washington 州 Moses Lake
              工厂被描述为西方世界最大的硅负极设施，配有面向车规质量和产量的先进加工系统。Sila 称 Moses Lake 场地于 2025 年 4 月开始调试，目标 2025
