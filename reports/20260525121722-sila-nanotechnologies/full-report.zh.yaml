  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分：高端汽车 OEM、消费电子和战略垂直领域
        blocks:
          - type: paragraph
            body: >-
              Sila 的客户分成三层。第一层也是商业上最重要的一层，是高端汽车 OEM。BMW Group 是旗舰客户，2022 年宣布 Sila 的硅负极材料将用于 Neue Klasse 平台的下一代电芯，该平台计划
              2026 年推出。Mercedes-Benz 2023 年跟进，确认未来电动 G-Class 和 AMG 高性能车型将采用 Sila 材料。这类 OEM 关系涉及多年认证周期（每个项目通常 3–5 年），也是
              Sila 预计商业出货量的主体。第二层是消费电子，由 WHOOP 锚定。2021 年推出的 Whoop 4.0 健身手环，是首个采用 Sila
              硅负极材料并商业出货的产品，在汽车项目成熟前先证明了规模化实产可行。第三层更具战略性和猜测性：In-Q-Tel 的投资显示国防和情报部门可能有兴趣；Sila
              也谈到过电网储能应用，但这些垂直领域没有公开具名客户。买方、用户和付款方因细分而异：汽车领域里，电芯制造商（如为 BMW 供货的 Samsung SDI）是直接材料买方，OEM
              是终端规格制定者；可穿戴设备里，WHOOP 同时是买方、用户和付款方。
