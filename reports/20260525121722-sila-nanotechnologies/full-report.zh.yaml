            title: 政策风险在狭窄执行窗口内放大运营风险
            body: 2025–2027 年，Sila 必须同时爬坡一座首创工厂、维持 DOE 拨款合规、应对 IRA 抵免不确定性，并向 BMW 交付合格材料——任何一个环节失败，都会通过共享资本和时间线依赖传导到其他环节。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR033
          - type: callout
            title: 激进承销前必须拿到现场循环寿命数据和客户多元化证据
            body: Sila 硅负极材料缺少公开汽车现场性能数据，这还不是失败信号，但意味着技术论点建立在实验室验证和消费电子使用之上，而不是已证明的汽车耐久性。尽调必须补上这个缺口，信心才可能提高。
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR034
              - CR037
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：商业进展强，但定价不透明
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies 对一家私营电池材料公司而言，已经拿到少见的商业里程碑。公司七轮融资超过 $925M，拿下 Mercedes-Benz 量产合作，产品已进入 Whoop 4.0
              可穿戴设备，并在华盛顿州 Moses Lake 开设制造设施，规划年产能目标超过 100 GWh 等效负极材料。2024 年 6 月 Series G 融资 $375M，投资方包括 Coatue、Bessemer
              Venture Partners、T. Rowe Price 和 8VC，报道的投后估值从约 $2.48B（Bloomberg）到 $3.4B（Reuters 引 PitchBook）不等。报道估值相差
              $900M，本身就是承销纪律红旗：要么较低数字反映稀释调整后的股权价值，而较高数字是标题式投后估值；要么 Series F（TechCrunch 报 2021 年 $3.3B）到 Series G
              之间出现了实质降估值。仅靠公开来源无法判断哪种解释成立。管理层披露准确投后估值、股价、优先权条款和收入轨迹之前，建议仍是继续研究，置信度中等、风险高。公司显然值得持续关注，但外部无法承销价格。
