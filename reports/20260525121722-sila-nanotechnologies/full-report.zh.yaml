      - number: '5.3'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              Sila 的核心技术是一种硅碳纳米复合材料，通过公司未完全公开披露的自有工艺合成。基础化学体系由联合创始人 Gleb Yushin 在 Georgia Tech
              发明，建立在他对储能纳米结构材料的广泛研究之上。Sila 解决的关键技术挑战，是硅在锂化过程中约 300% 的体积膨胀；历史上，这会通过颗粒开裂、SEI 不稳定和电接触损失导致容量快速衰减。Sila
              的纳米复合架构把硅包裹在碳支架内，让膨胀在内部被吸收，并向电芯电解液呈现稳定外表面。这一路线保留硅的高理论容量（约 3,579 mAh/g，对比石墨 372
              mAh/g），同时缓解早期纯硅路线遭遇的机械退化。Moses Lake 的制造工艺使用公司所称全球最大的硅负极材料反应器，生产工程为快速扩张而设计。Sila 从美国供应商采购原材料，包括 REC
              Silicon、Norco、Airgas 和 Linde，使自身具备本土供应链韧性和潜在 IRA
              税收抵免优势。自有合成细节——很可能涉及化学气相沉积或热解步骤——仍是公司守得最紧的技术资产，也是投资者评估制造成本和良率时的重要尽调缺口。
