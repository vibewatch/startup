      - number: '8.3'
        title: 反方逻辑——估值不透明与商业化滞后
        blocks:
          - type: paragraph
            body: >-
              反方逻辑不在技术质量，而在公开证据能否支撑报道估值。第一，Bloomberg 与 Reuters 的估值差异（$2.48B vs $3.4B）尚未解决，可能意味着较 2021 年 Series F 约 $3.3B
              投后出现降估值融资。T. Rowe Price 是 Series G 参与方，历史上会在业绩不及预期时，在共同基金 NAV 披露中下调后期私营持仓估值；2022–2024
              年多个后期私营公司批次都能看到这种模式。第二，Sila 没有公开披露收入、毛利率、每 kWh 负极材料 ASP、Mercedes
              交付量或汽车认证时间线里程碑。第三，消费电子出货（Whoop）与汽车级批量生产之间差距巨大：Whoop 每台设备只需克级材料，而 Mercedes EV 生产每年需要数千吨。第四，公开负极 /
              电池同行经历了严重估值倍数压缩：Amprius 市值约 $100-200M，SES AI 为 $200-500M，即使 QuantumScape 曾被大幅炒作，也已从超过 $40B 的峰值回落至约
              $2B。可比组说明，电池材料公司如果没有被证明的量产收入，很少能维持 $2-3B 以上估值。因此，Sila $2.5-3.4B 的私营估值嵌入了大量执行风险，而当前公开记录看不到这些风险已经被解除。
