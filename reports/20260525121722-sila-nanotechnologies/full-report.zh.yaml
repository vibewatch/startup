      - number: '2.2'
        title: TAM / SAM / SOM：多种测算视角
        blocks:
          - type: paragraph
            body: >-
              最宽的口径是全球电池负极材料，预计 2026 年为 $6.4 billion，并以 13.6% CAGR 增长至 2032 年接近 $14 billion。其中，硅负极材料细分市场取决于范围定义，2026
              年估计为 $489 million 至 $1.15 billion；一致预测指向 2030 年约 $3.6 billion，CAGR 接近 50%。Grand View Research 预计 2025 至
              2030 年 CAGR 为 50.1%；Fortune Business Insights 和 Business Research Insights 也给出相近增长路径。另一个补充视角是 EV 电池需求：IEA
              报告 2025 年全球部署 1,200 GWh，2030 年需求将增至三倍，意味着负极材料消耗同比例扩张。Sila 的 SAM 收窄到高端、以硅为主的细分市场，那里 OEM
              需要高于石墨混配所能提供的能量密度——初期是豪华 EV 和高性能可穿戴设备。SOM 进一步受 Moses Lake 2026 年当前 10 GWh 年产能目标约束；取决于电芯化学体系和电池包大小，这大致对应每年
              100,000–200,000 辆 EV 的材料。多份分析师报告都认为机会很大，但 Sila 近期能拿下多少，取决于认证转化和制造执行，而不是市场是否存在。
