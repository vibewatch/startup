              个月认证测试。通过认证后会形成粘性，但也让初始客户获取缓慢且昂贵。不过，多项风险威胁护城河耐久性。Group14 拥有可比 IP 深度（170+ 项专利）、更大的当前在线产能（10 GWh，对比 Sila
