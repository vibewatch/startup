      - number: '4.3'
        title: 资本充足性与融资位置
        blocks:
          - type: paragraph
            body: >-
              Sila 的资本位置由 2024 年 6 月关闭的 $375M G 轮锚定，该轮由 Franklin Templeton 领投，8VC、Coatue、T. Rowe Price、Bessemer Venture
              Partners 和 Amgen 参投。加上 2022 年 10 月由 Office of Manufacturing and Energy Supply Chains 选定的约 $100M DOE
              补助，七轮股权融资使已披露融资总额达到约 $925M–$1B。Bloomberg 报道 Series G 估值约 $2.48B（称其较此前约 $3.3B 估值下调），Reuters 则报道约
              $3.4B——这一重大差异尚未被官方披露解决。DOE 补助支持 Moses Lake 的 EV 电池组件制造规模化，但附带里程碑条件。现金余额、月度烧钱和 runway 均未公开披露。公司在 2022
              年末裁员（报道称约 7–10% 员工），显示 EV 需求放缓期间的成本纪律或收入短缺。制造 capex 已相当可观：仅 Moses Lake
              工厂就是数亿美元投资。考虑到工厂继续爬坡、车规认证时间线以及先进材料制造资本强度，公司在达到现金流盈亏平衡前很可能需要更多资本。没有公开披露债务融资、项目融资或授信额度。
