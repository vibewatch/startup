              Sila 的客户采用路径很清楚：实验室认证、小尺寸消费产品验证，再到大尺寸汽车量产。时间线由可观察里程碑锚定。2021 年，WHOOP 4.0 搭载 Sila
              材料发布，建立首个商业生产参考，也证明负极材料能经受真实制造和产品认证。Sila 有意先在风险更低、规模更小的应用里证明可制造性，再进入押注更高的汽车部署。BMW 的合作至少可追溯到 2017 年 BMW i
              Ventures 投资，但正式量产公告出现在 2022 年，BMW 确认 Sila 将为 Neue Klasse 架构的第 6 代电芯供货。量产目标是 2026–2027 年，前提是 Sila 位于华盛顿州
              Moses Lake 的工厂达到规模产出。Mercedes-Benz 2023 年宣布合作，生产时间表披露较少，但与 2020 年代后期的 G-Class 和 AMG 项目一致。因此，Sila 在 4–5
