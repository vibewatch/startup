      - number: '7.2'
        title: 运营和技术风险来自首创制造与未经现场验证的耐久性
        blocks:
          - type: paragraph
            body: >-
              Moses Lake 设施是全球首座专用硅负极材料超级工厂，意味着 Sila
              没有先例工厂可用来对标良率曲线、吞吐爬坡速度或缺陷画像。首创工艺风险又被纳米结构硅颗粒合成所需精度放大——粒径分布、孔隙率控制和导电涂层均匀性都会影响下游电芯性能。公开来源无法验证规模制造良率；任何系统性质量漏检都可能沿
              BMW iX 电池包扩散，引发昂贵召回或保修索赔。底层硅负极技术面对一个文献充分记录的退化机制：硅在锂化过程中会膨胀约 300%，反复循环导致固态电解质界面不稳定和容量衰减。Sila
              专有纳米多孔架构旨在容纳这种膨胀，但汽车部署尚无公开长期实地数据，能够确认其在跨季节热循环、快充压力和日历老化下的循环寿命表现。华盛顿州 Grant County
              的劳动力风险很实质：当地先进制造劳动力池有限，要在距 Seattle 170 英里的专用化学品工厂招聘并留住工艺工程师和质量专家，需要持续投入搬迁、培训和留任项目。Moses Lake
              设施的网络安全风险——包括工业控制系统完整性、专有涂层配方的 IP 保护——没有任何公开 SOC 2、ISO 27001 或同等认证背书。
            claimRefs:
              - CR010
