      - number: '3.5'
        title: 替代技术与相邻路径
        blocks:
          - type: paragraph
            body: >-
              固态电池是最常被讨论的硅负极替代方案。QuantumScape
              的无负极架构完全消除石墨和硅宿主材料，使用固态陶瓷隔膜配合锂金属沉积。如果实现大规模商业化，固态电池无需任何负极材料供应商，就可能提供更高能量密度、更快充电和更好安全性。SES AI 和 Solid Power
              走类似的锂金属或硫化物电解质路径。但截至 2026
              年中，所有固态路线在车规应用上仍未商业化，制造规模化、成本和循环寿命挑战仍未解决。现状——纯石墨负极——仍是占主导的装机基础，也是真正的竞争基准。石墨负极便宜、成熟，并且已通过认证。每家硅负极公司都必须证明，相比石墨现状，增量成本和认证风险值得承担。这让
              Sila 的竞争挑战变成二维：既要证明优于直接硅同行，也要证明优于多数电芯厂已经信任的石墨基准。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP038
