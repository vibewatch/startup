      - number: '8.4'
        title: 公开可比公司给出区间，而不是目标价
        blocks:
          - type: paragraph
            body: >-
              电池科技公开可比组展示了不同商业化阶段公司的结果区间。Amprius Technologies (AMPX) 生产硅纳米线负极电芯，截至 2026 年 5 月在收入很小的情况下市值约
              $130M，是未规模化负极公司的熊市底线。Enovix (ENVX) 是具备消费电子牵引和 EV 野心的硅负极电芯制造商，市值约 $1.2B。QuantumScape (QS)
              是知名度最高的下一代电池公司，主要靠固态电芯 IP 和 OEM 合作、而非规模化生产收入，维持约 $2B 市值。SES AI (SES) 以锂金属技术和汽车认证项目交易在约 $300M。Solid Power
              (SLDP) 和 Microvast (MVST) 以不同收入阶段补足可比组，市值 $400M-$600M。私营侧，Group14 Technologies 2024 年 Series C 估值超过
              $1B，业务是硅碳负极材料，是最接近的私营可比公司。公开数据表明，Sila 的 $2.5-3.4B 位于电池材料估值谱系高端，只能与 QuantumScape
              相比；后者交易基础是固态电芯愿景，而不是已验证的负极经济性。这不意味着 Sila 被高估——Mercedes 验证比多数同行能拿出的证据更强——但意味着价格已经在量产公开证明之前，提前折现了成功量产。
