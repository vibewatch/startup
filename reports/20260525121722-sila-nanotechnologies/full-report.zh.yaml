  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Sila 销售 Titan Silicon，这是一种硅碳纳米复合负极粉体，设计为可直接替代锂离子电芯中的石墨。产品面向两类清晰买方工作流。第一，消费电子
              OEM（可穿戴设备、耳机、电动工具、笔记本电脑）通过电芯厂伙伴导入 Titan Silicon，在不重新设计设备的情况下，获得最高 20% 更高能量密度，或等价地缩小电池体积。第二，汽车 OEM
              及其电芯供应商（Mercedes-Benz 通过 Panasonic Energy，以及其他未具名伙伴）正在认证 Titan Silicon 用于 EV 动力电芯，声称收益是在电芯层面约 20–25%
              能量密度提升。Sila 还提供 Battery Engineering Services，直接与客户及其电芯供应商合作，定义匹配具体产品要求的最优电芯化学体系、电极设计和认证路径。公司自 2021
              年起商业出货，并声称已有超过 10 million 台设备由其材料供能。客户集成模式刻意降低冲击：现有锂离子产线只需少量改造即可加入这种粉体，这降低了已经运行大规模石墨负极工艺的电芯制造商采用门槛。
