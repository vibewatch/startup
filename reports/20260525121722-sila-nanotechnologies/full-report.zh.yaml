      - number: '4.2'
        title: 单位经济模型与成本结构信号
        blocks:
          - type: paragraph
            body: >-
              Sila 的单位经济模型几乎完全保密。公司不披露已实现每公斤价格、销货成本、毛利率、制造良率或产能利用率。公开证据只能支持方向性推断。Moses Lake 工厂约有 180,000
              平方英尺制造产能，专为硅负极生产而建。资本强度很高：该设施需要数亿美元累计投资。硅负极制造涉及复杂纳米工程工艺，包括化学气相沉积和自有颗粒架构，意味着 COGS
              包含显著的能源、前驱体化学品、设备折旧和良率损失成本。来自 Amprius Technologies（AMPX）的公开可比数据最接近：Amprius 报告 FY2023 收入
              $7.8M，制造规模化阶段毛利率为负，说明下一代负极公司在低利用率时通常亏钱。直接竞争对手 Group14 Technologies 于 2025 年初完成 $463M D 轮，同样尚未盈利。IRA
              Section 45X Advanced Manufacturing Production Credit 可能为本土生产的电极活性材料提供有意义的单位补贴，潜在把 Sila 的有效利润率改善 $35 / kWh
              电池容量。但 Sila 未公开确认 45X 资格，也未量化预期收益。缺少已披露 ASP、COGS、良率或利用率，无法仅靠公开来源搭出单位经济模型桥。
