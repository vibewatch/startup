      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Sila 的买方版图分为三层。第一层是追求续航和性能差异化的高端 EV 车企 OEM：Mercedes-Benz 是锚定客户，Sila 的 Titan Silicon 目标在 2026 年左右用于电动
              G-Class。BMW 过去被提及为合作伙伴，但截至 2026 年中，尚无公开确认的 Mercedes 同等级供应协议。第二层是希望电池更小、更轻的消费电子制造商：Whoop 是首个商业客户，将 Sila
              材料导入 Whoop 4.0 手环，带来 17% 能量密度提升。这一细分市场在车规放量前提供更早收入和真实场景验证。第三层是作为中介的电池电芯制造商：Panasonic
              被点名为客户和电芯制造合作方。采用路径遵循可预期顺序——材料送样、A/B 样测试、C 样整车集成，最后 SOP——车规新化学体系通常需要 3–5 年。消费电子周期更短（12–18 个月），这解释了为什么
              Whoop 早于 Mercedes。预算归属在电池厂的电芯采购团队和 OEM 的动力总成战略团队。
