  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资判断对估值清晰度和单位经济性最敏感，对技术质量或市场需求相对不敏感。
    data:
      items:
        - label: 入场价格清晰度（Bloomberg 与 Reuters 差距）
          value: 10
          detail: 两家报道来源之间 $900M 的估值差异，无法靠公开数据解释。
        - label: 收入和毛利率可见度
          value: 9
          detail: 尽管累计融资 $925M+，公司没有公开披露收入或利润率。
        - label: Mercedes 汽车量产时间
          value: 9
          detail: OEM 从认证到量产的间隔，是关键执行变量。
        - label: 优先股堆叠和稀释
          value: 8
          detail: 七轮融资累计 $925M+，可能给普通股带来优先权压力。
        - label: 规模化制造良率
          value: 7
          detail: Moses Lake 的生产经济性尚未公开确认。
        - label: 技术差异化护城河
          value: 5
          detail: 硅负极性能证据充分；竞争风险更偏长期。
    approximationNotes: 敏感性分数是 0-10 的序数评分，反映哪些未知项最影响投资决策；来源于保留证据的强度和缺口分析。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV017
      - CV019
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开电池技术可比公司显示，Sila 报道估值处在区间高端；如果汽车端执行滞后，下行空间不小。
    data:
      items:
        - label: 悲观情景（Amprius/SES 底部）
          low: 0.3
          mid: 0.5
          high: 0.8
          detail: 以 Amprius $130M 和 SES $300M 为锚；如果汽车端失败，代表严重估值压缩。
        - label: 基准情景（Enovix/Solid Power 区间）
          low: 0.8
          mid: 1.5
          high: 2.5
          detail: 以 $450M-$1.2B 的公开硅 / 电池技术同业为锚，这些公司已有早期商业化进展。
        - label: 乐观情景（QuantumScape 等价）
          low: 2.5
          mid: 3.5
          high: 5
          detail: 以 QuantumScape $2B 和 Group14 $1B+ 为锚；需要 Mercedes 批量生产确认，并且 IPO 路径清晰。
    approximationNotes: 数值是公开可比公司市值和已报道私募轮次隐含的企业价值（单位：$B）。由于 Sila 未公开披露收入或利润率，这些只是方向性区间，不是 DCF 推导出的目标值。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Sila 在技术和合作伙伴上得分较好，在估值透明度和经济性可见度上得分较差。
    data:
      items:
        - label: 技术差异化
          score: 8
          detail: 已展示 20-40% 的能量密度提升，并通过 WHOOP 生产验证。
        - label: OEM 合作伙伴质量
          score: 8
          detail: 被 Mercedes-Benz 选中，是少数私人电池公司拿得到的汽车级验证。
        - label: 制造可信度
          score: 7
          detail: Moses Lake 工厂已运营；美国生产叠加 IRA 政策利好。
        - label: 资本和投资人质量
          score: 7
          detail: 累计 $925M+ 融资来自 Coatue、Bessemer、T. Rowe Price 等顶级投资人。
        - label: 竞争位置
          score: 6
          detail: 相对石墨既有玩家较强；Group14、固态和锂金属构成新兴威胁。
        - label: 收入和经济性可见度
          score: 2
          detail: 没有披露收入、利润率、ASP 或汽车交付量。
        - label: 估值透明度
          score: 2
          detail: Bloomberg 与 Reuters 存在 $900M 差距；没有清晰入场标记或老股交易数据。
        - label: 下行风险平衡
          score: 4
          detail: 后期优先股堆叠、汽车端执行风险，以及 T. Rowe Price NAV 可能下调。
    approximationNotes: 分数是 0-10 的序数型投委会判断，来自保留证据；不是外部评级，也不是算法输出。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV011
      - CV017
      - CV022
      - CV040
      - CV042
