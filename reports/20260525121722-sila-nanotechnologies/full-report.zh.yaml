        - 直接尽调期间仍拿不到披露股价、投后估值或老股交易标记
        - 无法建立基于证据的入场纪律；优先权包袱不可知。
        - 不投资；若管理层拒绝分享基本条款，建议保持继续研究或转为回避。
      - - Mercedes 合作停滞
        - Mercedes 公开调整电动车时间表、选择替代负极供应商，或 Sila 披露无法达成汽车认证里程碑
        - 抹掉支撑其相对上市可比公司享有估值溢价的主要 OEM 验证。
        - 立即下调评级；只有出现规模相当的替代 OEM 承诺后再评估。
      - - T. Rowe Price NAV 减记
        - T. Rowe Price 共同基金 N-CSR 文件显示 Sila 标记价低于 G 轮入场价，或企业价值低于 $2B
        - 证实一家具备信息访问权的成熟机构投资者认为该持仓已经受损。
        - 视为强反向信号；继续推进前，入场价必须相对报道估值有显著折价。
      - - 制造良率失败
        - Moses Lake 工厂报告良率低于目标、产能显著延迟，或需要大量追加资本
        - 击穿制造可信度支柱，并拉长汽车规模化生产时间表。
        - 在多个季度证明生产一致性之前，避免支付溢价。
      - - 竞争路线超车
        - 固态电池或替代负极化学体系在相同或更低成本下，实现同等能量密度提升，并具备更好循环寿命
        - 抹掉支撑 Sila 估值溢价的技术差异化护城河。
        - 继续推进前，重新测算硅负极材料的总可用市场。
    notes: 每个触发项都把可监控事件连接到投委会动作；这些触发项旨在下一轮融资价格完全体现恶化之前捕捉投资逻辑走弱。
    claimRefs:
      - CV005
      - CV006
      - CV017
      - CV019
      - CV022
      - CV040
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 最新估值和股价
        - 精确的 G 轮投后估值、每股价格，以及任何 2025-2026 年老股交易标记或 409A 估值
        - 若没有确认入场价，Bloomberg 与 Reuters 之间 $900M 的差距会让投资测算无法落地。
        - 向管理层索取 G 轮条款清单和最新 409A；检查 Forge Global 和 EquityZen 的老股交易记录。
      - - 股权结构表和优先权
        - G 轮后完整优先股堆叠、清算倍数、参与权条款、反稀释条款和期权池刷新
        - 即使公司商业化成功，优先权包袱也可能抹掉普通股上行空间。
        - 获取完整股权结构表、G 轮公司注册证书修订文件和投资者权利协议。
      - - 收入和单位经济
        - 按分部划分的当前收入运行率（消费电子 vs. 汽车样品）、毛利率、每 kWh 负极材料 ASP，以及按客户划分的贡献利润率
        - 在收入未披露的情况下，$2.5-3.4B 估值使资本效率和利润率路径无法评估。
        - 要求提供季度收入和利润率摘要；将 ASP 与大宗石墨负极价格比较，分析利润率可持续性。
      - - Mercedes 认证时间表
        - 具体车型项目、已认证量承诺、交付开始日期，以及包含排他性和定价的合同条款
        - Mercedes 验证是主要投资逻辑驱动；没有具体时间表，乐观情景无法落到日期。
        - 向管理层索取 Mercedes 供应协议摘要、认证里程碑时间表和放量爬坡计划。
      - - 制造良率和成本
        - Moses Lake 工厂当前良率、每 kg 生产成本、产能利用率、剩余资本开支，以及与目标经济性的对比
        - 制造可信度只取决于已实现的生产数据；规划产能不等于已验证产能。
        - 与工程团队审阅工厂 KPI、季度生产报告和单位成本趋势。
    notes: 这些问题构成最低尽调包；拿到后，才可能从继续研究转向可投资跟踪，或在量化风险参数下给出买入建议。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV017
      - CV040
      - CV041
      - CV042
