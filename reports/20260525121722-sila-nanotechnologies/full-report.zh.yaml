        title: 证据要点
        blocks:
          - type: callout
            title: 公开证据结论：继续研究
            body: Sila 具备商业可信度，但公开来源无法承销报道的 $2.5-3.4B 估值。管理层披露当前收入、股权结构表条款和 Mercedes 交付时间线之前，不应上调评级。
            calloutType: recommendation
            claimRefs:
              - CV005
