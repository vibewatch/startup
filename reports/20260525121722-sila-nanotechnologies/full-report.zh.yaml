chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营版图
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies, Inc.（以「Sila」开展业务）把自己定位为下一代电池材料公司，使命是为全球清洁能源转型供能。公司 2011 年创立于 California 州
              Alameda，核心商业产品是 Titan Silicon：一种纳米复合硅负极材料，设计用来在锂离子电池电芯中替代传统石墨。Sila 称，Titan Silicon 相比当今行业表现最好的石墨电芯可带来
              20–25% 的能量密度提升，未来版本的路线图还包括 40% 提升和低于 10 分钟的充电时间。Sila 的运营版图包括位于 Alameda 的总部，负责 R&D 和公司职能；以及 Washington 州
              Moses Lake 一个占地 160 英亩、面积超过 600,000 平方英尺的车规级制造工厂。Moses Lake 工厂于 2025 年 4 月开始调试，并于 2025 年 9 月启动 Titan
              Silicon 初始生产，成为美国首座大规模硅负极工厂。初始产能支持每年 2–5 GWh，并设计为五年内可扩至 250 GWh。公司公开称，计划未来 3–5 年在 Moses Lake 雇用最多 500
              名熟练工人。
