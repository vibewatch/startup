callouts:
  - calloutType: risk
    title: Customer Concentration and Revenue Recognition Lag
    body: While Nyobolt has announced over $150 million in secured contract value, a significant share of near-term commercial execution is concentrated within Symbotic's logistics robotics network. Investors must diligence milestone delivery criteria, warranty reserve obligations, and cash collection timing to ensure reported contract backlog converts smoothly into recognized GAAP revenue.
    claimRefs:
      - CI004
      - CI005
      - CI014
      - CI015
  - calloutType: insight
    title: Capital Adequacy and Valuation Multiple Premium
    body: Following the $60 million Series C round led by Symbotic, Nyobolt has accumulated approximately $160 million in lifetime funding and achieved a $1.0 billion post-money valuation. Maintaining this unicorn multiple requires rapid revenue scaling from the $9 million 2024 revenue baseline, prudent manufacturing capex management at the Haverhill plant, and expanding beyond warehouse robotics into AI data centers.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
      - CI013
