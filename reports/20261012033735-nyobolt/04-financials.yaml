company:
  name: Nyobolt
chapter:
  number: 4
  title: Financials
  summary: Nyobolt has accelerated commercialization of its ultra-fast charging battery technology, reporting $9 million in 2024 revenue, fivefold year-over-year revenue expansion, and securing over $150 million in contract value across robotics and industrial infrastructure. A $60 million Series C led by Symbotic at a $1.0 billion valuation bolsters capital adequacy, but underwriting profitability requires closing substantial private-metric gaps in audited gross margins, unit costs, and customer concentration.
sections:
  - id: revenue-streams-and-commercial-model
    title: Revenue Streams and Commercialization Architecture
    body: Nyobolt has structured its commercial go-to-market model across multiple high-uptime industrial applications, diversifying beyond its initial automotive demonstration platform. The company operates primarily through direct hardware battery pack sales, integrated power management systems, and specialized infrastructure deployment agreements. Commercial revenue momentum is anchored by automated warehouse robotics, where Nyobolt provides high-power niobium tungsten oxide battery cells to Symbotic for deployment in automated distribution centers. Beyond robotics, the company is actively developing commercial solutions for AI data center power backup and high-uptime commercial vehicles, including a landmark memorandum of understanding with the state of Rajasthan to deliver over 100 megawatts of off-grid AI data center power management infrastructure. This multi-stream structure allows Nyobolt to pursue substantial enterprise contract values, though commercial maturity varies widely from production deployments in logistics automation to early-stage development agreements in infrastructure.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI011
      - CI014
    tableRefs:
      - TI001
  - id: pricing-contracting-and-unit-economics
    title: Pricing Architecture, Contract Structures, and Unit Economics
    body: 'Nyobolt monetizes its ultra-fast charging technology through structured multi-year enterprise contracts, non-recurring engineering milestone fees, and volume hardware delivery agreements. In April 2025, the company announced that it had secured over $150 million in cumulative contract value across industrial automation, robotics, and commercial vehicles, positioning the business for sustained revenue expansion. However, detailed realized pricing per kilowatt-hour, volume discount tiers, and bill-of-materials costs remain closely guarded proprietary figures. The core economic value proposition rests on total cost of ownership reduction: by delivering battery cells capable of surviving more than 20,000 charge-discharge cycles without thermal degradation, Nyobolt enables autonomous machines to operate continuously without expensive battery replacements or extended idle charging downtime. Nevertheless, key unit economic metrics including gross margin percentages, cell manufacturing costs at the Haverhill facility, and warranty reserve liabilities remain undisclosed and represent essential diligence targets for prospective investors.'
    claimRefs:
      - CI004
      - CI005
      - CI009
      - CI010
      - CI015
    tableRefs:
      - TI002
      - TI003
  - id: revenue-model-and-margin-conversion
    title: Commercial Conversion Dynamics and Margin Bridge
    body: The operational transition from academic materials science breakthroughs to commercial cash generation involves a defined multi-stage conversion pipeline. Nyobolt begins with cell-level chemistry validation developed at the University of Cambridge, translating patented niobium tungsten oxide anodes into demonstrator prototypes. These demonstrators, including the prototype EV sportscar charging from 10% to 80% in under five minutes, serve as proof points to secure customer partnership contracts. Commercial realization then depends on scaling manufacturing throughput and delivering production-quality battery packs into customer fleets, such as Symbotic's SymBot mobile robots. Revenue recognition proceeds through contract milestone billings and volume hardware deliveries, converting contracted backlog into recognized top-line revenue. Achieving healthy gross margins ultimately requires disciplined manufacturing yield management, favorable long-term niobium supply arrangements with strategic partners such as CBMM, and managing warranty obligations under intensive industrial operating cycles.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI008
      - CI015
    figureRefs:
      - FI001
  - id: capital-adequacy-burn-and-financial-verdict
    title: Capital Adequacy, Cash Burn, and Underwriting Verdict
    body: Nyobolt’s capital position was substantially reinforced in May 2026 when it secured a $60 million Series C funding round led by strategic partner Symbotic, bringing total funding to approximately $160 million and establishing a headline post-money valuation of $1.0 billion. This capital injection followed a transformative period in 2024, when the company achieved $9 million in non-GAAP revenue—a 135-fold increase over its $67,000 revenue baseline in 2023—and management subsequently indicated fivefold year-over-year revenue expansion. Historical filings revealed that prior to the 2025-2026 capital rounds, auditor comments on the 2023 accounts noted a March 2025 funding requirement before forward contract milestones were fully recognized, highlighting the capital-intensive nature of hardware manufacturing scale-up. Executive leadership has maintained cash discipline, emphasizing measured operational growth across Cambridge, Boston, and Haverhill facilities rather than rapid speculative cash burn. From an underwriting perspective, while strategic validation from Symbotic and rapid top-line traction are compelling, the $1.0 billion valuation multiple demands verified GAAP revenue delivery, audited gross margin transparency, and reduced customer concentration.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI008
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue Streams and Commercialization Architecture
    columns:
      - Commercial Stream
      - Revenue Mechanism
      - Contract Unit
      - Current Status
      - Revenue Quality
      - Diligence Requirement
    rows:
      - - Warehouse Robotics Battery Packs
        - Component and pack sales with recurring replacement modules
        - Per-pack price ($5k-$20k estimated) + integration fee
        - Production deployment via Symbotic across logistics networks
        - High strategic commitment but high customer concentration
        - Contract volume commitments, pricing escalators, and exclusivity terms
      - - AI Data Center Power Backup Systems
        - Turnkey power electronics systems and off-grid infrastructure
        - Per-megawatt system contract ($/kW installed)
        - MOU stage with State of Rajasthan (>100 MW planned)
        - High potential scale with long procurement and regulatory lead times
        - MOU conversion probability, binding milestones, and project financing obligations
      - - Heavy-Duty and Off-Highway Vehicles
        - Specialized battery packs for mining and industrial haulage
        - Per-vehicle pack supply plus maintenance service
        - Partner engagement with Scania Invest and OEM testing
        - Enterprise industrial sales with lengthy OEM qualification cycles
        - Joint development agreement revenue share and field test milestones
      - - Passenger EV Prototype Licensing / Retrofit
        - Platform licensing, cell supply, and engineering services
        - Per-vehicle license or milestone engineering fee
        - Demonstrator sports car tested (10-80% in <5 min); 8 OEM talks
        - Low current revenue contribution; option value on future platforms
        - OEM qualification status, IP licensing terms, and royalty structure
    notes: Revenue stream classifications and deployment statuses compiled from Nyobolt commercial announcements and investor disclosures; unit pricing metrics represent industry estimates.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI011
      - CI014
      - CI015
  - id: TI002
    title: Pricing and Commercial Contracting Framework
    columns:
      - Application Sector
      - Contract Structure
      - List vs Realized Pricing
      - Discounts and Unknowns
      - Revenue Implication
      - Information Source
    rows:
      - - Logistics Automation (Symbotic)
        - Multi-year volume supply agreement with milestone deliverables
        - Realized pricing negotiated at volume discount under strategic investment
        - Warranty liability sharing and volume discount tiers undisclosed
        - Anchor revenue driver representing majority of 2024-2025 run-rate
        - Company and investor disclosures (SYM Series C lead)
      - - Industrial AI Data Centers
        - Large-scale infrastructure contract (turnkey or EPC model)
        - Estimated capital project basis per megawatt installed capacity
        - Subsidies, grid connection costs, and payment milestones unknown
        - High lumpy contract additions with working capital pre-funding needs
        - Rajasthan MOU announcements and public statements
      - - Commercial Fleet Vehicles
        - Tier-1 OEM supply or retrofit kit pricing model
        - Custom quote per fleet requirement; list price not publicly published
        - Warranty period terms and battery replacement cycle costs undisclosed
        - High-margin niche with lengthy 18-36 month sales cycles
        - Industry reporting and Scania partnership announcements
      - - Technology Demonstrators & Licensing
        - Non-recurring engineering (NRE) fees and joint development agreements
        - Milestone-based development payments ($24M reported in contracts/milestones)
        - Contingent milestone pass rates and clawback clauses undisclosed
        - Lumpy non-operating revenue with limited recurring visibility
        - Audit disclosures and press reports
    notes: All contract terms, pricing structures, and discount schedules are synthesized from public strategic partnership announcements; detailed customer price schedules are proprietary.
    claimRefs:
      - CI004
