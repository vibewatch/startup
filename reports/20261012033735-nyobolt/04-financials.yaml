  - id: TI003
    title: Unit Economics and Underwriting Benchmark Analysis
    columns:
      - Economic Dimension
      - Reported Metric / Value
      - Confidence
      - Strategic Importance
      - Underwriting Diligence Ask
    rows:
      - - Gross Margin Percentage
        - null
        - low
        - Determines path to operating profitability and manufacturing breakeven
        - Request product-level gross margin schedules for SymBot battery packs
      - - Cycle Life Performance
        - 20,000+ cycles (>80% capacity retention)
        - high
        - Drives customer total cost of ownership by eliminating battery replacements
        - Review third-party degradation test reports under industrial duty cycles
      - - Battery Pack Energy vs Power Density
        - 6x energy of ultracapacitors; 20x power of standard Li-ion
        - medium
        - Justifies premium pricing relative to conventional LFP and NMC batteries
        - Inspect lab and customer benchmark tests against leading LFP/NMC cells
      - - Warranty Reserve Provisions
        - null
        - low
        - Protects against catastrophic cell failures in continuous 24/7 operating environments
        - Obtain historical warranty claim rates and balance sheet reserve policies
    notes: Where values are null, metrics are private and undisclosed by Nyobolt; confidence ratings reflect whether metrics are primary-source corroborated or inferred.
    claimRefs:
      - CI005
      - CI009
      - CI010
      - CI013
