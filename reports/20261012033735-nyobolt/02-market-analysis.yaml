callouts:
  - calloutType: "insight"
    title: "Power Density vs. Energy Density Redefines Target Market"
    body: "Nyobolt has bypassed direct competition with global battery giants like CATL and BYD in passenger EV mass markets by focusing on high-power density and high-cycle longevity. In physical AI warehouse robotics and AI data centre power management, machines charge continuously throughout the day, making cycle life and rapid sub-5-minute replenishment far more critical than single-charge range."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM009"
  - calloutType: "risk"
    title: "Supply Chain Concentration and Production Scale Hurdles"
    body: "While Nyobolt's product-market fit in warehouse robotics is substantiated by production deployment with Symbotic, the underlying chemistry relies heavily on niobium, where global supply is concentrated under Brazilian producer CBMM. Furthermore, scaling cell manufacturing from pilot volumes to millions of commercial units requires substantial capital intensity and flawless execution in high-power cell production."
    claimRefs:
      - "CM010"
      - "CM014"
