    title: Product Architecture Map
    type: stack
    summary: >-
      Hierarchical six-layer system architecture spanning raw chemical precursors to deployed industrial and automotive
      applications.
    data:
      layers:
        - label: Active Materials Synthesis
          modules:
            - Niobium Tungsten Oxide (NWO) anode powder
            - Advanced carbon additives
            - Electrolyte & separator formulation
          notes: University of Cambridge patented chemistry offering 20x power density over conventional graphite anodes.
        - label: Cell Design & Fabrication
          modules:
            - 2.6 Ah & 24.5 Ah low-impedance cells
            - Cylindrical & pouch form factors
            - High-current tabs & low-resistance current collectors
          notes: Engineered with Coventry University Cell Prototyping Laboratory; demonstrated over 4,400 fast-charge cycles.
        - label: Thermal & Mechanical Enclosure
          modules:
            - Liquid cold plates with water/glycol mix
            - Integrated AC chiller & compressor loop
            - Compact structural pack housing (1,250 kg EV spec)
          notes: Limits peak pack operating temperature to 60°C during continuous 500A DC charging.
        - label: Power Electronics & Battery Management
          modules:
            - Proprietary digital BMS firmware
            - Millisecond load fluctuation telemetry
            - High-voltage 800V DC charge controller interface
          notes: Maintains optimal voltage across individual cells and manages high constant-current charge profiles.
        - label: Modular Subsystem Packs
          modules:
            - Nyobolt Ultra pack architecture (6–10 min)
            - Nyobolt Xtreme pack architecture (1–5 min)
            - 35 kWh automotive demonstrator pack
          notes: Supports scalable assembly at Haverhill UK facility scaling toward 2M cells and 1,000 packs annually.
        - label: Deployment & Application Surfaces
          modules:
