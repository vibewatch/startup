            title: Strategic Customer Concentration and Preference Overhang
            body: >-
              Symbotic dual role as lead customer and lead Series C investor creates significant operational alignment
              but also profound concentration risk. Downside protection is complicated by undisclosed liquidation
              preferences and historical auditor commentary noting runway constraints before milestone recognition.
            calloutType: risk
