              - CV013
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Nyobolt exit readiness remains in early development, with an optimal liquidity window projected 3 to 5
              years out as the company scales manufacturing output and diversifies its customer base. A successful
              public listing via IPO on NASDAQ or the London Stock Exchange requires at least $100 million in
              predictable, high-margin revenue and established corporate governance across its UK and US operating
              entities. Alternatively, an M&A exit to a global industrial robotics conglomerate, tier-1 automotive
              supplier, or hyperscale data center infrastructure provider represents a viable pathway if Nyobolt
              demonstrates indispensable technology lock-in for fast-charging power systems. However, any acquisition or
              IPO trajectory is vulnerable to capital structure overhang if Series C preferred shares carry aggressive
              liquidation multiples, participating rights, or cumulative dividend ratchets that diminish common
              shareholder recovery.


              Before committing capital to Nyobolt, prospective investors must execute four non-negotiable diligence
              investigations: first, inspect the Series C shareholder agreement and Articles of Association to map the
              precise liquidation waterfall and preference seniority; second, audit pack-level manufacturing economics,
              scrap rates, and niobium anode supply contracts at the Haverhill production plant; third, evaluate the
              contractual durability and pricing terms of the Symbotic partnership agreement; and fourth, verify
              pipeline conversion across the reported $150 million contract backlog, including the 100MW Rajasthan data
              center project. Furthermore, investors should establish explicit thesis-break triggers that would mandate
              immediate liquidation or abandonment of the investment thesis: first, any deceleration in Symbotic robot
              orders or pilot cancellation; second, gross margins failing to exceed 20% on commercial deliveries; third,
              unaddressed cathode-anode degradation in extreme industrial operating conditions; and fourth, failure to
              secure a second anchor customer within twelve months.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Research-More at Stretched Valuation'
            body: >-
              While Nyobolt has demonstrated impressive technology commercialization and strategic validation through
              Symbotic, the $1.0 billion post-money Series C valuation implies a multiple exceeding 22x run-rate
              revenue. Investors should maintain a research-more posture, conditioning any direct investment on verified
              unit gross margins and full visibility into Series C preferred liquidation seniority.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV012
              - CV013
