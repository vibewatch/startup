        title: Financial and execution risk dominate the current evidence
        blocks:
          - type: paragraph
            body: >-
              The risk ranking starts with scale and disclosure rather than an assumed chemistry failure. Nyobolt
              announced a $60 million round in May 2026 and external coverage placed the company at a $1 billion
              valuation, while the company separately reported fivefold year-on-year revenue growth. Those are fresh
              financing and momentum signals, not evidence of cash available after planned investment, audited revenue
              quality, margin, or runway. The last absolute revenue figure in the assigned evidence is company-reported
              non-GAAP 2024 revenue of $9 million, alongside more than $150 million of contract value. Contract value is
              not recognized revenue, and neither measure establishes cash conversion. This combination makes valuation
              support, working capital, manufacturing spend, and contract realization the leading financial diligence
