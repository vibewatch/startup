      - number: '3.3'
        title: Substitutes, Incumbent Response, and Switching Costs
        blocks:
          - type: paragraph
            body: >
              In industrial robotics and material handling, the historical status-quo alternatives to high-power
              batteries have been electrostatic double-layer capacitors (ultracapacitors) and conventional
              graphite-anode lithium-ion batteries paired with automated mechanical pack-swapping infrastructure. In
              automated warehousing, ultracapacitors offer high cycle life and rapid burst charging but deliver limited
              gravimetric and volumetric energy density, forcing automated guided vehicles and mobile robots to
              interrupt active operational workflows for frequent recharges. Nyobolt's battery systems deliver up to six
              times more energy capacity than previously deployed ultracapacitor modules at a 40% lower pack weight,
              allowing warehouse robots such as Symbotic's SymBot fleet to sustain continuous operations without
              battery-wear penalties or dedicated battery-swapping stations. However, switching costs in utility and
              automotive applications remain high due to existing supply-chain contracts, long qualification cycles with
              Tier-1 automotive suppliers, and capital-intensive charging infrastructure investments.
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Moat Durability and Technological Displacement Risks
        blocks:
          - type: paragraph
            body: >
              Nyobolt's competitive moat rests on intellectual property originated in Professor Dame Clare Grey's
              research group at the University of Cambridge, covering low-impedance cell designs, synthesized niobium
              tungsten oxide anode active materials, and thermal-management electronics that prevent lithium plating
              during extreme fast charging. However, the durability of this moat faces dual pressures from established
              global battery conglomerates and upstream critical-mineral supply chains. Incumbent cell manufacturers
              including CATL, BYD, and LG Energy Solution possess unmatched manufacturing economies of scale, extensive
              gigafactory footprints, and established automotive customer relationships, with ability to deploy
              high-rate lithium iron phosphate (LFP) cells at lower unit costs. Furthermore, Nyobolt's reliance on
              niobium and tungsten exposes unit economics to specialised commodity markets, where mining concentration
              and precursor availability could constrain production scaling relative to commoditised graphite and iron
              phosphate chemistries.
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP013
              - CP016
