  - id: TE003
    title: Technology and Operating Architecture Table
    columns:
      - Layer / Process Component
      - Technical Role & Mechanism
      - Key Dependency
      - Primary Technical / Operational Risk
    rows:
      - - NWO Anode Material Synthesis
        - >-
          Nanostructured niobium tungsten oxide enables rapid 3D lithium-ion diffusion without structural lattice
          degradation
        - Refined battery-grade niobium and tungsten chemical precursor supply (CBMM, H.C. Starck)
        - Precursor commodity price volatility and single-source supplier concentration
      - - Low-Impedance Cell Engineering
        - >-
          Pouch and cylindrical cell internal construction optimized to minimize internal electrical resistance and
          Joule heating
        - Precision winding and coating equipment at Haverhill facility and pilot lines (Coventry Univ.)
        - Cell-level manufacturing yield defects during transition to multi-million cell annual volumes
      - - Thermal Management Subsystem
        - Cold plates circulating water/glycol mixture coupled with vehicle AC compressor and condenser chiller
        - Efficient thermal interface material (TIM) contact and uniform heat dissipation at 500A current
        - Localized hot spots or cold-plate seal leakage under severe multi-cycle thermal stress
      - - Proprietary BMS Firmware & Controls
        - Real-time state-of-charge and cell-voltage monitoring with millisecond feedback loop governing current taper
        - Automotive-grade microcontrollers and high-speed CAN/Ethernet telemetry bus
        - Firmware miscalibration leading to premature current throttling or localized overvoltage
    notes: >-
      System architectural components, manufacturing dependencies, and risk factors derived from Coventry University
      prototyping disclosures, CALLUM engineering specs, and company patent filings.
