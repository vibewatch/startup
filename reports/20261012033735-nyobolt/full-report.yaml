      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is unusually direct: co-founder and CEO Sai Shivareddy has worked across the battery
              value chain, while co-founder and chief scientist Clare Grey led the underlying academic research. The
              official leadership page also names technical, commercial, finance, operations, manufacturing, strategy,
              people, and communications executives. That breadth reduces obvious functional gaps, but technical
              narrative and public company identity remain concentrated around the two founders. Tracxn reports nine
              active directors, yet the retained pool contains no current official board register, committee structure,
              voting-rights schedule, or succession plan. Governance quality and founder dependence therefore remain
              diligence questions rather than verified strengths.
            claimRefs:
              - CO003
              - CO006
