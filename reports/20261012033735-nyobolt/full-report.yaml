        title: Named Customer Proof and Operational Validation
        blocks:
          - type: paragraph
            body: >-
              The cornerstone of Nyobolt's commercial validation is its multi-year production partnership with Symbotic,
              a leader in AI-powered supply chain automation. Symbotic has deployed Nyobolt's advanced battery packs
              across its SymBot autonomous mobile robots, which operate in demanding automated warehouse storage and
              retrieval environments for retail and grocery enterprises. In production deployment, Nyobolt's battery
              packs deliver six times the energy capacity of the ultracapacitors previously utilized, reduce power
              supply mass by 40 percent, and achieve a cycle life exceeding ten times standard lithium-ion alternatives.
              This tangible operational improvement eliminates swap-time overhead and enables round-the-clock machine
              utilization. Symbotic reinforced this commercial alignment by leading Nyobolt's $60 million Series C
              financing in May 2026 at a $1 billion valuation. While Symbotic represents a Tier-1 customer reference
              demonstrating verifiable product-market fit at scale, public evidence of secondary commercial deployments
