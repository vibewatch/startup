      - number: '6.2'
        title: Commercial Traction and Revenue Trajectory
        blocks:
          - type: paragraph
            body: >-
              Nyobolt's commercial trajectory reflects rapid top-line expansion from initial research and development
              prototypes into commercial production delivery. The company closed calendar year 2024 with $9 million in
              non-GAAP revenue, representing a transformative increase from early development stages, driven by initial
              commercial deliveries into automated warehouse systems. By mid-2025, company management reported securing
              over $150 million in forward contract value, spanning robotics deployments and heavy vehicle agreements.
              Historical press coverage highlighted earlier auditor scrutiny regarding going-concern runway and revenue
              timing, but subsequent capital raises and production rollouts have enabled the company to scale
              manufacturing capacity toward 2 million cells annually. Into 2026, Nyobolt reported revenue expanding
              fivefold year-over-year, supported by serial production expansion at its Haverhill facility and partner
              distribution networks. However, because detailed GAAP financial reconciliations and verified multi-year
              customer delivery schedules remain undisclosed, assessing the exact conversion velocity of contract value
