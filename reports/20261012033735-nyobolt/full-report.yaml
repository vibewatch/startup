            body: >-
              Nyobolt has transitioned from laboratory prototyping to active commercial revenue generation, closing 2024
              with $9 million in revenue and securing over $150 million in contracted pipeline. The company's primary
              commercial deployment is within Symbotic's SymBot autonomous mobile robots (AMRs), which automate
              high-density retail distribution warehouses. Operating in continuous 24/7 environments, SymBots previously
              relied on ultracapacitors that suffered from restricted operating capacity or conventional lithium-ion
              batteries that required extensive charging downtime. Nyobolt Xtreme packs provide six times the energy
              capacity of incumbent ultracapacitors while cutting pack weight by 40 percent and matching rapid
              opportunity-charging windows during routine freight handling pauses.


              In parallel, Nyobolt is targeting physical AI infrastructure and hyperscale AI data centers, developing
              high-density battery systems capable of buffering severe millisecond power fluctuations induced by dynamic
              GPU training clusters. To satisfy commercial supply commitments, Nyobolt operates a production facility in
              Haverhill, UK, currently expanding from 12 toward 70 specialized jobs with an annual capacity target of up
              to two million cells and 1,000 assembled packs. The manufacturing process leverages adapted roll-to-roll
              equipment and standard pouch/cylindrical cell assembly lines, avoiding the capital intensity of bespoke
              cleanroom fabrication while ensuring compliance with forthcoming EU Battery Regulation standards.
