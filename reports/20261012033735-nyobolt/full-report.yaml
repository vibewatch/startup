      - number: '5.4'
        title: Technical Durability, Verification, and Engineering Risks
        blocks:
          - type: paragraph
            body: >-
              The core durability claim separating Nyobolt from competitive fast-charging chemistries is its ability to
              sustain thousands of extreme C-rate cycles without catastrophic capacity loss or impedance rise.
              Independent testing conducted by a leading global automotive OEM substantiated that Nyobolt 2.6 Ah cells
              achieved over 4,400 consecutive fast-charge cycles under a 12C charge and 1C discharge test regime at 23
              degrees Celsius. Throughout this stress testing, the cells maintained greater than 80 percent battery
              capacity retention. Crucially, internal resistance increased by only 50 percent after 4,400 five-minute
              charge cycles, compared to the industry-standard end-of-life threshold where cell impedance typically
              doubles.


              Despite these laboratory and bench validations, significant engineering and commercialization risks
              remain. First, achieving sub-five-minute replenishment is strictly dependent upon offboard 350 kW 800V DC
              fast chargers capable of sustained 500A output, an infrastructure footprint that is currently sparse
              across commercial transit corridors. Second, long-term raw material supply for battery-grade niobium and
              tungsten is concentrated among specialty mining operators such as CBMM and H.C. Starck. Any upstream
              supply disruption or pricing escalation could erode Nyobolt's unit margins before its Haverhill plant
              achieves economies of scale.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE014
