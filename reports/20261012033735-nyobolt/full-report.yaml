      - number: '1.3'
        title: Financing and commercial scale
        blocks:
          - type: paragraph
            body: >-
              The financing record shows repeated access to institutional and strategic capital. Independent reporting
              cites a $10 million raise in 2021 and a £50 million Series B in 2022. Nyobolt then announced $30 million
              in April 2025, taking its stated cumulative funding to $100 million, while Tracxn records a further $60
              million Series C on 6 May 2026 and $161 million total funding at a $1 billion valuation. These are
              funding-raised figures, not cash-on-hand or runway. Commercial disclosure is less settled: company-issued
              material reports $9 million of 2024 non-GAAP revenue and more than $150 million of secured contract value,
              while Tracxn displays less than £1 million of annual revenue for the UK legal entity at the same year-end.
              The metrics may differ by entity or accounting basis, but the bridge is not public.
