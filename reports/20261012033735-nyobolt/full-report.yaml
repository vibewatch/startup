      - number: '6.4'
        title: Adoption Lifecycle, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Adoption of Nyobolt's energy systems follows an extensive customer engineering and validation lifecycle
              before reaching volume manufacturing. Industrial customers begin by validating cell-level fast-charge
              kinetics and thermal stability under rigorous laboratory benchmarking, verifying that cells can achieve 80
              percent charge in under five minutes without hazardous thermal excursion. The process then advances to
              custom pack engineering, cold-plate thermal integration, and proprietary battery management software
              tuning tailored to specific machine envelopes. Once field trials demonstrate operational reliability over
              thousands of continuous cycles, customers transition to serial production commitments. Expansion within
              accounts follows a fleet rollout model across regional distribution hubs. However, the extreme technical
              customization required creates significant procurement friction, lengthening sales cycles for prospective
              customers outside Symbotic. Furthermore, because Symbotic acts simultaneously as anchor customer,
              commercial distribution partner, and lead growth equity investor, Nyobolt faces pronounced customer
              concentration risk. Any slowdown in Symbotic's system deployment rate or shifts in its supply chain
              architecture would directly impact Nyobolt's commercial revenue trajectory.
