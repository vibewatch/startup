        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Customer Anchoring in Warehouse Automation
            body: >-
              Symbotic's dual role as lead deployment customer and lead Series C investor provides Nyobolt with anchored
              commercial volume in warehouse robotics, insulating it from near-term automotive EV commercialisation
              headwinds while validating sub-5-minute charging under severe production duty cycles.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP012
          - type: callout
            title: Upstream Raw Material Concentration and Scale Disparity
            body: >-
              While Nyobolt's niobium tungsten oxide chemistry avoids conventional nickel-cobalt supply bottlenecks,
              reliance on specialised niobium active materials and specialized cell synthesis limits immediate cost
              parity against incumbent gigafactory-scale lithium iron phosphate manufacturers.
            calloutType: risk
            claimRefs:
