  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Categorisation, and Commercial Focus
        blocks:
          - type: paragraph
            body: >-
              Nyobolt delineates its addressable market around high-rate, high-uptime energy applications where battery
              recharge latency directly dictates industrial asset productivity. Rather than competing directly against
              dominant lithium-ion cell manufacturers in the price-sensitive passenger electric vehicle sector, Nyobolt
              focuses on specialized industrial use cases that require ultra-high power density and extreme cycle life.
              Its primary operational domains encompass automated warehouse robotics, AI data centre power backup,
              heavy-duty commercial transport, and specialty technology demonstrator vehicles. Across power-intensive
              automation and commercial sectors, only twenty percent of equipment is currently electrified, presenting a
              substantial greenfield conversion opportunity. Nyobolt's proprietary niobium tungsten oxide chemistry
              delivers twenty times the energy density of supercapacitors while achieving full recharge in under five
              minutes and sustaining over 20,000 duty cycles, effectively isolating high-throughput commercial
              operations from commodity battery segments.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              Evaluating Nyobolt's addressable opportunity requires examining distinct market layers rather than relying
              on a single broad top-line projection. In warehouse automation, third-party industry forecasts value the
              global physical AI logistics robotics market at $6.8 billion in 2025, expanding at a 21.2 percent compound
              annual rate to $38.4 billion by 2034. Concurrently, rapid expansion in generative AI compute is driving
              the data centre infrastructure market toward an estimated $500 billion within five years as GPU clusters
              escalate facility power requirements tenfold. At the serviceable commercial layer, Nyobolt has announced
              securing over $150 million in customer contract value across robotics and industrial power systems,
              alongside a 100MW off-grid data centre deployment agreement in Rajasthan, India. While these aggregate
              industry projections encompass broad mechanical and compute expenditures beyond battery subsystems,
              Nyobolt's reported revenue growth from $67,000 in 2023 to $9 million in 2024 reflects accelerating
              adoption across its high-power niches.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM011
