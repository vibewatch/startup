chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Nyobolt traces its technology to a 2018 Cambridge battery-research breakthrough and states that the
              company was founded in 2019. It presents itself not as a cell-only vendor but as an integrated
              energy-systems business spanning anode materials, cells, packs, battery management, power electronics,
              charging controls, and software. The commercial focus is on applications where high power and uptime
              matter, including AI infrastructure, robotics, heavy vehicles, passenger vehicles, and grid systems. The
              official footprint lists a Cambridge headquarters plus facilities or sales operations in Haverhill,
              Bedford, Bad Duerkheim, and Tokyo. Performance statements such as charging from 10% to 80% in under five
              minutes are company claims; the retained evidence does not provide an independently audited
              product-performance dataset.
