      - number: '5.2'
        title: Pack-Level Architecture and Thermal Management
        blocks:
          - type: paragraph
            body: >-
              Integrating ultrafast-charging cells into reliable commercial battery packs requires strict co-engineering
              of mechanical enclosures, power electronics, and thermal regulation circuits. Because fast charging at 350
              kW delivers continuous direct currents up to 500A, even minor internal resistance across busbars or cell
              tabs could induce dangerous localized temperature spikes. Nyobolt addresses this challenge through
              proprietary low-impedance module interconnects coupled with an active liquid cooling architecture. The
              pack cooling subsystem utilizes aluminum cold plates circulating an aqueous water/glycol mixture,
              integrated directly with vehicle or equipment air conditioning compressors, condensers, and dedicated
              chiller units.


              During track validation of the driveable Nyobolt EV sports car prototype—engineered in collaboration with
              CALLUM—this thermal subsystem maintained peak battery temperatures strictly at or below 60 degrees Celsius
              throughout a continuous 350 kW (800V) DC charge cycle. The 35 kWh pack was replenished from 10 percent to
              80 percent state of charge in 4 minutes 37 seconds, adding 120 miles of range in the initial four minutes
              of 500A constant-current charging. Beyond automotive powertrains, Nyobolt's proprietary Battery Management
              System (BMS) incorporates millisecond-level telemetry monitoring to govern voltage balancing and active
              current tapering, ensuring complete operational stability across varied duty cycles.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE010
              - CE014
