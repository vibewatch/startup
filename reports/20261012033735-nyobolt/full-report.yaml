  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Market Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              Nyobolt targets high-intensity industrial sectors where continuous operational uptime is paramount and
              conventional battery recharge latency imposes severe productivity penalties. The company's core commercial
              traction is concentrated in autonomous warehouse robotics, where automated mobile robots require
              continuous multi-shift operations without lengthy recharge or pack-swapping interruptions. Beyond
              automated material handling, Nyobolt is actively positioning its niobium-based energy technology across
              three adjacent segments: AI data centre backup and transient power management, heavy-duty commercial
              haulage, and emerging humanoid robotics platforms. In AI data centres, surging power volatility from
              high-density GPU racks creates demand for millisecond response times and rapid energy buffer cycling,
              leading to early framework engagements such as a 100MW off-grid memorandum of understanding in Rajasthan.
              In commercial transport, vehicle operators require megawatt-level fast charging to electrify heavy duty
              fleets without fleet expansion. While these pipeline segments present substantial long-term addressable
              markets, commercial commitments outside warehouse automation remain primarily exploratory, leaving current
              operational cash generation heavily dependent on automated logistics buyers.
