companyProfile:
  summary: >-
    Nyobolt is a Cambridge-founded battery-systems company commercialising niobium-based fast-charge technology for
    industrial uptime-critical use cases. The business spans cells, packs, battery management, power electronics, and
    charging controls, with a commercial focus on warehouse robotics, AI data-centre power, commercial vehicles, and
    adjacent industrial electrification markets.
