  topStrengths:
    - Demonstrated ultrafast charging and cycle-life performance in real deployments.
    - Symbotic provides a credible scaled customer and strategic financing validation.
    - Revenue and contract value have moved meaningfully higher since the prior report.
  topRisks:
    - Customer concentration remains high, with limited evidence of a second scaled account.
    - Gross margin, BOM, and audited revenue quality remain undisclosed.
    - Series C preference terms, liquidation waterfall, and broader private cap-table details remain opaque.
  unresolvedGaps:
    - Audited 2025 revenue, 2026 run-rate, and a clear bridge from non-GAAP revenue to statutory accounting.
    - Gross margin, contribution margin, pack-level BOM, warranty reserves, and other unit economics.
    - >-
      Series C cap-table terms, liquidation preferences, ratchets, participation rights, and the true common-equity
      waterfall.
    - >-
      Customer concentration by account, top-10 customer mix, and a second named production-scale customer beyond
      Symbotic.
    - Current customer count and headcount remain undisclosed despite broader public traction signals.
