company:
  name: "Nyobolt"
chapter:
  number: 7
  title: "Risks"
  summary: "Nyobolt's highest-evidence risks are execution and dependency risks: scaling beyond demonstrated cells and prototype packs, managing a customer-investor relationship with Symbotic, and financing growth from a still-small disclosed revenue base. Product tests and fresh funding are meaningful mitigants, but public evidence does not close current certification, incident, unit-economics, runway, supplier-concentration, or contract-conversion questions."
sections:
  - id: "financial-and-execution-priority"
    title: "Financial and execution risk dominate the current evidence"
    body: >-
      The risk ranking starts with scale and disclosure rather than an assumed chemistry failure. Nyobolt announced a $60 million round in May 2026 and external coverage placed the company at a $1 billion valuation, while the company separately reported fivefold year-on-year revenue growth. Those are fresh financing and momentum signals, not evidence of cash available after planned investment, audited revenue quality, margin, or runway. The last absolute revenue figure in the assigned evidence is company-reported non-GAAP 2024 revenue of $9 million, alongside more than $150 million of contract value. Contract value is not recognized revenue, and neither measure establishes cash conversion. This combination makes valuation support, working capital, manufacturing spend, and contract realization the leading financial diligence items; a miss could force more capital or weaken negotiating leverage even if demand remains real.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR014"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "operational-quality-and-safety"
    title: "Technical proof reduces, but does not eliminate, operational risk"
    body: >-
      Available evidence supports cell and prototype performance more strongly than production repeatability. A University of Cambridge article reports independent testing above 4,000 fast-charge cycles with more than 80 percent capacity retention, and Nyobolt says its cells use commercially available components and standard manufacturing equipment. However, the same university article described a historical plan to ramp to 1,000 packs in 2025 and a flexible model of up to two million cells per year; the assigned 2026 evidence does not confirm completion, yield, scrap, warranty, or field-failure rates. Nyobolt also claims reduced premature-failure and lithium-plating risk, but the pool does not identify certification standards, certifying bodies, recalls, or incident history. Therefore mitigation maturity is best described as demonstrated testing plus early deployment, not proven high-volume quality control.
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR002"
  - id: "partner-and-commercial-dependencies"
    title: "Commercial proof is concentrated in relationships with strategic counterparties"
    body: >-
      Symbotic is both the lead investor in the latest round and the only named current scaled deployment in the assigned evidence. Nyobolt says Symbotic's warehouse robots use its batteries and that the product improves capacity, weight, and cycle life versus prior alternatives. This overlap is strategically useful but creates pricing, rollout, governance, and customer-concentration exposure that cannot be quantified without account-level revenue and contract terms. The company also describes work with other robotics companies and an unnamed humanoid developer, which signals pipeline breadth but not a second independently verifiable production account. A memorandum of understanding with Rajasthan for more than 100 MW of off-grid AI data-centre and power infrastructure adds a new channel, yet the source does not disclose binding volume, financing, permitting, or delivery milestones. Supplier identities, dual sourcing, and material-price protections are also absent.
    claimRefs:
      - "CR003"
      - "CR011"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "legal-regulatory-and-kill-criteria"
    title: "Regulatory and legal exposure remains an evidence gap, not a clean bill of health"
    body: >-
      The available sources do not establish the current status of product certifications, environmental and lifecycle compliance, transport approvals, litigation, freedom to operate, or reported safety incidents. The adverse search returned no retained source, but absence of a result is not evidence that no incident or dispute exists. Caplight's public page further says its filing documents are not displayed, limiting public verification. Diligence should therefore request a jurisdiction-by-jurisdiction compliance matrix, certificates, claims and incident logs, patent and freedom-to-operate opinions, and regulator correspondence. Thesis-break triggers should be monitorable: failure to document required approvals before shipment, a material recall or field-safety event, failure to demonstrate current production yield and warranty performance, loss or material slowdown of the Symbotic deployment, failure to convert another named production customer, or a financing plan that does not bridge disclosed cash needs to contracted cash receipts.
    claimRefs:
      - "CR003"
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
