callouts:
  - calloutType: recommendation
    title: 'Recommendation: Research-More at Stretched Valuation'
    body: >-
      While Nyobolt has demonstrated impressive technology commercialization and strategic validation through Symbotic,
      the $1.0 billion post-money Series C valuation implies a multiple exceeding 22x run-rate revenue. Investors should
      maintain a research-more posture, conditioning any direct investment on verified unit gross margins and full
      visibility into Series C preferred liquidation seniority.
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV013
  - calloutType: risk
    title: Strategic Customer Concentration and Preference Overhang
    body: >-
      Symbotic dual role as lead customer and lead Series C investor creates significant operational alignment but also
      profound concentration risk. Downside protection is complicated by undisclosed liquidation preferences and
      historical auditor commentary noting runway constraints before milestone recognition.
    claimRefs:
      - CV002
      - CV007
      - CV008
      - CV014
