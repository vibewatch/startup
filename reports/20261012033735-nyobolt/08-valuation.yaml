  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Margin Assumptions
      - Valuation / Return Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          2026 revenue exceeds $50M; gross margins reach 40%+; second tier-1 customer announced; 100MW data center
          deployment begins.
        - >-
          Exit at $2.5B-$3.5B via IPO or strategic acquisition by robotics/industrial leader within 3-4 years (2.5x-3.5x
          return).
        - >-
          Delay in commercial ramp at Haverhill facility; loss of key technology personnel or customer pilot
          cancellation.
        - 25% (requires flawless industrial execution and rapid customer diversification)
      - - Base Case
        - >-
          2026 revenue grows to $25M-$35M; gross margins stabilize around 25%-30%; steady Symbotic deployment without
          major expansion.
        - Valuation marks mark-to-market at $1.0B-$1.4B; modest 1.0x-1.4x multiple expansion over 4-5 year horizon.
        - Margin compression from raw material volatility; slower adoption of 100MW Indian data center initiative.
        - 50% (most consistent with current multi-round funding trajectory and contract backlog)
      - - Bear Case
        - >-
          Revenue stalls under $20M; gross margins under 15% due to high niobium costs; Symbotic volume softens or
          delays orders.
        - >-
          Down-round recapitalization at $400M-$600M; senior preference stack wipes out common equity; substantial
          dilution.
        - >-
          Customer rollout halts; cash runway tightens before operating profitability; auditor going-concern flags
          re-emerge.
        - 25% (reflects historical auditor warnings on runway and capital intensity of battery manufacturing)
    notes: >-
      Scenario model estimates forward enterprise valuations across operating trajectories; return logic is indexed to
      the $1.0B Series C post-money valuation baseline.
