  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis (Bull View)
      - Anti-Thesis (Bear View)
      - What Would Change The View
    rows:
      - - Market Demand
        - >-
          Surging physical AI, warehouse automation, and data center demand requires instant-power batteries with zero
          downtime.
        - Niche high-rate market may prove smaller than conventional EV storage, limiting total addressable market.
        - Demonstrated volume adoption across multiple non-robotics enterprise verticals and data center operators.
      - - Product & Tech
        - >-
          Proprietary niobium tungsten oxide delivers 10x cycle life and sub-5-minute ultra-fast charging without
          thermal degradation.
        - >-
          Niobium cell chemistry involves higher material costs and complex cathode-anode balancing versus standard
          LFP/NMC.
        - Third-party verified cell-level cycle data and pack cost parity curves matching conventional chemistries.
      - - Customer Traction
        - Symbotic partnership validates production readiness and commercial utility in mission-critical robotics.
        - Severe customer concentration in Symbotic creates systemic counterparty risk if warehouse rollouts decelerate.
        - Disclosure of two or more independent production contracts exceeding $20M in annual revenue outside Symbotic.
      - - Valuation & Terms
        - $1B post-money valuation signals top-tier strategic backing from Symbotic, Scania, and CBMM.
        - >-
          Valuation represents extreme revenue multiple (>22x) with undisclosed preference overhang and liquidation
          stacks.
        - Full disclosure of Series C liquidation preference terms showing clean 1x non-participating preferred equity.
    notes: >-
      Thesis and anti-thesis drivers evaluate the trade-offs between Nyobolt demonstrated technological differentiation
      and unresolved commercial, concentration, and structural valuation risks.
