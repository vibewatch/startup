company:
  name: Nyobolt
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nyobolt is a Cambridge-founded battery-systems company built around
    fast-charge, high-power applications, with founder-led technical continuity
    and a five-location operating footprint. Public evidence shows meaningful
    financing and commercial progress, but revenue definitions, customer count,
    financing terms, and current governance require primary-document diligence.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Nyobolt traces its technology to a 2018 Cambridge battery-research
      breakthrough and states that the company was founded in 2019. It presents
      itself not as a cell-only vendor but as an integrated energy-systems
      business spanning anode materials, cells, packs, battery management,
      power electronics, charging controls, and software. The commercial focus
      is on applications where high power and uptime matter, including AI
      infrastructure, robotics, heavy vehicles, passenger vehicles, and grid
      systems. The official footprint lists a Cambridge headquarters plus
      facilities or sales operations in Haverhill, Bedford, Bad Duerkheim, and
      Tokyo. Performance statements such as charging from 10% to 80% in under
      five minutes are company claims; the retained evidence does not provide
      an independently audited product-performance dataset.
    claimRefs: [CO001, CO002, CO004, CO005, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder-market fit is unusually direct: co-founder and CEO Sai Shivareddy
      has worked across the battery value chain, while co-founder and chief
      scientist Clare Grey led the underlying academic research. The official
      leadership page also names technical, commercial, finance, operations,
      manufacturing, strategy, people, and communications executives. That
      breadth reduces obvious functional gaps, but technical narrative and
      public company identity remain concentrated around the two founders.
      Tracxn reports nine active directors, yet the retained pool contains no
      current official board register, committee structure, voting-rights
      schedule, or succession plan. Governance quality and founder dependence
      therefore remain diligence questions rather than verified strengths.
    claimRefs: [CO003, CO006, CO013]
    tableRefs: [TO002]
  - id: financing-and-commercial-scale
    title: Financing and commercial scale
    body: >-
      The financing record shows repeated access to institutional and strategic
      capital. Independent reporting cites a $10 million raise in 2021 and a
      £50 million Series B in 2022. Nyobolt then announced $30 million in April
      2025, taking its stated cumulative funding to $100 million, while Tracxn
      records a further $60 million Series C on 6 May 2026 and $161 million
      total funding at a $1 billion valuation. These are funding-raised figures,
      not cash-on-hand or runway. Commercial disclosure is less settled:
      company-issued material reports $9 million of 2024 non-GAAP revenue and
      more than $150 million of secured contract value, while Tracxn displays
      less than £1 million of annual revenue for the UK legal entity at the same
      year-end. The metrics may differ by entity or accounting basis, but the
      bridge is not public.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence-view
    title: Milestones and diligence view
    body: >-
      Nyobolt has progressed from university research through venture rounds,
      an EV demonstration, reported deployments, and a 2026 Series C. The
      sequence is consistent with a company moving from technical validation
      toward scaled industrial commercialization, but several public numbers
      remain issuer-reported and non-comparable. A January 2025 article also
      described an earlier press concern, based on 2023 auditor comments, that
      fresh funding was needed; management argued that the account view omitted
      $24 million of forward milestone and contract revenue. The retained
      sources do not establish whether that dispute was resolved through audited
      cash-flow evidence. Investment diligence should therefore reconcile
      statutory and non-GAAP revenue, inspect contract quality and customer
      concentration, verify the cap table and preferences, and obtain a dated
      organization and governance pack.
    claimRefs: [CO001, CO002, CO007, CO008, CO009, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
