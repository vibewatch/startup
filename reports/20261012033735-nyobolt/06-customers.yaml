figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Commercial lifecycle stages from cell specification and testing through multi-site robotic fleet expansion.
    data:
      items:
        - label: Initial Chemistry Validation
          stage: Initial Chemistry Validation
          description: Customer evaluates cell-level fast-charge kinetics and thermal impedance in laboratory testing.
          touchpoints:
            - Bench testing of 10-80% charge in under 5 minutes
            - UN 38.3 cell safety certification review
        - label: Custom Pack & BMS Prototyping
          stage: Custom Pack & BMS Prototyping
          description: Engineering teams design tailored pack enclosures, cold-plate thermal controls, and custom BMS software.
          touchpoints:
            - Mechanical envelope specification
            - Water-glycol cold plate thermal integration
        - label: Pilot Vehicle / Robot Integration
          stage: Pilot Vehicle / Robot Integration
          description: Retrofitting prototype packs into customer machines (e.g. SymBot AMRs) for dynamic field trials.
          touchpoints:
            - Field duty-cycle validation
            - Measurement of energy density and weight reduction vs ultracapacitors
        - label: Operational Durability Verification
          stage: Operational Durability Verification
          description: Validation of cycle longevity over thousands of continuous fast-charge cycles under warehouse workloads.
          touchpoints:
            - Verification of 4,000+ cycle life without degradation
            - Monitoring operating temperatures below 45 degrees Celsius
        - label: Serial Fleet Production Rollout
          stage: Serial Fleet Production Rollout
          description: Customer commits to volume production orders across designated operational facilities.
          touchpoints:
            - Supply agreement execution ($150M+ pipeline)
            - Factory deployment in US automated distribution hubs
        - label: Multi-Facility Expansion & Strategic Alignment
          stage: Multi-Facility Expansion & Strategic Alignment
          description: Account expands across customer facility network and deepens strategic investment ties.
          touchpoints:
            - Strategic Series C co-investment by lead customer
            - Expansion into adjacent automation and AI data centre workloads
    claimRefs:
      - CU011
      - CU014
callouts:
  - calloutType: risk
    title: High Strategic Customer Concentration in Warehouse Robotics
    body: While Symbotic provides marquee commercial validation, proven operational uptime, and equity backing, Nyobolt's near-term commercial durability remains tied to a single customer ecosystem. Commercial expansion into AI data centres and heavy-duty vehicles remains largely at the MoU and prototype stage, requiring rigorous scrutiny of non-Symbotic contract conversion timelines.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU012
