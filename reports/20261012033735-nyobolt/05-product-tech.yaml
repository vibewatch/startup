callouts:
  - calloutType: "insight"
    title: "Physics of Low Impedance: Uncoupling Fast Charging from Thermal Degradation"
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
    body: "Nyobolt's primary technical breakthrough is not merely faster charge acceptance, but the structural prevention of Joule heating and lithium plating at extreme C-rates. By utilizing open-tunnel niobium tungsten oxide crystal structures, lithium ions diffuse rapidly without inducing lattice distortion, allowing 4,400+ fast-charge cycles with only a 50 percent impedance increase."
  - calloutType: "risk"
    title: "Infrastructure and Upstream Supply Vulnerabilities"
    claimRefs:
      - "CE005"
      - "CE009"
      - "CE014"
    body: "Realizing sub-five-minute charge times requires specialized 350 kW 800V DC chargers capable of sustained 500A delivery and dedicated liquid chiller loops, limiting deployment to controlled depot or industrial environments. Furthermore, commercial ramp from 1,000 packs toward gigawatt-hour volumes hinges on establishing cost-effective, multi-source supplies of specialized niobium precursor materials."

