  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从原始化学前体到已部署工业和汽车应用的六层分级系统架构。
    data:
      layers:
        - label: 活性材料合成
          modules:
            - 铌钨氧化物（NWO）负极粉末
            - 先进碳添加剂
            - 电解液与隔膜配方
          notes: University of Cambridge patented chemistry offering 20x power density over conventional graphite anodes.
        - label: 电芯设计与制造
          modules:
            - 2.6 Ah 和 24.5 Ah 低阻抗电芯
            - 圆柱和软包形态
            - 大电流极耳与低电阻集流体
          notes: Engineered with Coventry University Cell Prototyping Laboratory; demonstrated over 4,400 fast-charge cycles.
        - label: 热管理与机械外壳
          modules:
            - 水 / 乙二醇混合液冷板
            - 一体化 AC 冷水机与压缩机回路
            - 紧凑型结构电池包外壳（1,250 kg 电动车规格）
          notes: Limits peak pack operating temperature to 60°C during continuous 500A DC charging.
        - label: 电力电子与电池管理
          modules:
            - 专有数字 BMS 固件
            - 毫秒级负载波动遥测
            - 高压 800V DC 充电控制器接口
          notes: Maintains optimal voltage across individual cells and manages high constant-current charge profiles.
        - label: 模块化子系统电池包
          modules:
            - Nyobolt Ultra 电池包架构（6–10 分钟）
            - Nyobolt Xtreme 电池包架构（1–5 分钟）
            - 35 kWh 汽车演示电池包
          notes: Supports scalable assembly at Haverhill UK facility scaling toward 2M cells and 1,000 packs annually.
        - label: 部署与应用场景
          modules:
            - Symbotic SymBot 仓储 AMR
            - 乘用和商用电动车原型
            - AI 数据中心 GPU 瞬时电力缓冲器
          notes: >-
            Commercial deployments in high-uptime environments where charging downtime directly impairs operational
            economics.
    approximationNotes: 架构分层和模块分组反映已发布的系统集成规格与原型演示；生产封装可能因客户配置而异。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
