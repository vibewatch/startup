  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与商业重点
        blocks:
          - type: paragraph
            body: >-
              Nyobolt
              将可触达市场定义为高要求、高可用性的能源应用：电池补能速度会直接影响工业资产生产率。它没有在价格敏感的乘用车电动车领域正面挑战主流锂离子电芯厂商，而是聚焦需要超高功率密度和极端循环寿命的专业工业场景。主要运营领域包括自动化仓储机器人、AI
              数据中心备用电源、重型商用运输和特种技术示范车辆。目前功率密集型自动化和商业设备只有两成实现电动化，留下大量绿地转换机会。Nyobolt 的铌钨氧化物化学体系据称可提供超级电容器二十 倍的能量密度，同时实现低于
              5 分钟的完全充电并支持超过 20,000 次工作循环。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
      - number: '2.2'
        title: 市场规模视角与可触达机会
        blocks:
          - type: paragraph
            body: >-
              评估 Nyobolt 的可触达机会，需要拆分不同市场层次，而不是依赖单一的宽泛收入预测。第三方预测称，全球物理 AI 物流机器人市场 2025 年规模为 $6.8b，预计以 21.2% 的复合年增长率扩张至
              2034 年的 $38.4b。生成式 AI 计算扩张正推动数据中心基础设施市场在 5 年内迈向约 $500b，GPU 集群扩展使设施功率需求增加十倍。Nyobolt 宣布已获得超过 $150m
              的客户合同金额，并与 Rajasthan 合作方签署 100MW 离网数据中心部署协议。尽管行业预测涵盖的支出远超电池子系统，Nyobolt 据报道的收入仍从 2023 年 $67,000 增至 2024 年
              $9m。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM011
