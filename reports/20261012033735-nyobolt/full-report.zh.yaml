      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的退出准备度仍处于早期阶段。随着公司扩大产能并分散客户基础，最佳流动性窗口预计在 3 至 5 年后。若要通过 NASDAQ 或伦敦证券交易所 IPO 成功上市，             
              Nyobolt 需要至少 $100m 的可预测高毛利收入，并在英国和美国运营实体之间建立成熟的公司治理。另一条可行路径是被全球工业机器人集团、一级汽车供应商或超大规模数据中心基础设施提供商并购，但前提是
              Nyobolt 能证明其快充电力系统具备不可替代的技术锁定。若 Series C 优先股附带激进的清算倍数、参与权或累计股息棘轮，侵蚀普通股股东的回收额，任何并购或 IPO 路径都可能受到资本结构悬置的拖累。

              在向 Nyobolt 投入资本前，潜在投资者必须完成四项不可妥协的尽调：第一，查阅 Series C 股东协议和公司章程，厘清确切的清算分配顺序与优先级；第二，审计 Haverhill
              生产工厂的整包制造经济性、报废率和铌负极供应合同；第三，评估 Symbotic 合作协议的合同持久性和定价条款；第四，核实已报告的 $150m 合同积压的管线转化，包括 100MW
              拉贾斯坦数据中心项目。此外，投资者应设定明确的论点失效触发条件，一旦发生就必须立即清算或放弃投资论点：第一，Symbotic 机器人订单放缓或试点取消；第二，商业交付毛利率未能超过
              20%；第三，极端工业运行条件下正负极衰减问题未被解决；第四，12 个月内未能获得第二个锚定客户。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 图表附件
        blocks:
          - type: callout
            title: 建议：估值偏高，继续研究
            body: >-
              Nyobolt 已通过 Symbotic 展现出令人印象深刻的技术商业化能力和战略验证，但 $1.0b 的 Series C 投后估值对应超过 run-rate 收入 22x
              的倍数。投资者应继续研究，任何直接投资都应以已验证的单位毛利和对 Series C 优先股清算优先级的充分了解为前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV012
              - CV013
          - type: callout
            title: 战略客户集中度与优先权悬置
            body: Symbotic 同时担任主要客户和 Series C 领投方，既带来显著的运营协同，也造成深度集中风险。未披露的清算优先权，以及历史审计师评论中关于里程碑确认前现金续航受限的表述，使下行保护更加复杂。
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV014
