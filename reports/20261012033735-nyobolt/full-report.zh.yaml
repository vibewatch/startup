        - 实体 AI、仓储自动化和数据中心需求激增，需要能够即时供电且零停机的电池。
        - 高倍率细分市场可能比传统电动车储能更小，从而限制总可寻址市场。
        - 多个非机器人企业垂直领域及数据中心运营商已展示规模化采用。
      - - 产品与技术
        - 专有铌钨氧化物带来 10 倍循环寿命，并可在无热衰减的情况下实现 5 分钟以内超快充电。
        - 与标准 LFP/NMC 相比，铌电芯化学体系材料成本更高，正负极平衡也更复杂。
        - 第三方验证的电芯级循环数据，以及与传统化学体系成本相当的电池包成本曲线。
      - - 客户牵引力
        - Symbotic 合作验证了其在任务关键型机器人中的生产准备度和商业效用。
        - 客户严重集中于 Symbotic；若仓库铺开放缓，将产生系统性交易对手风险。
        - 披露两份或更多 Symbotic 之外、年收入超过 $20M 的独立生产合同。
      - - 估值与条款
        - $1B 投后估值表明 Symbotic、Scania 和 CBMM 提供了顶级战略支持。
        - 估值对应极高的收入倍数（超过 22 倍），且优先权负担和清算顺位未披露。
        - 完整披露 Series C 清算优先权条款，证明其为清晰的 1 倍非参与型优先股。
    notes: 正反论点评估 Nyobolt 已展示的技术差异化，与尚未解决的商业、集中度和估值结构风险之间的权衡。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入与利润率假设
      - 估值 / 回报逻辑
      - 主要下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2026 年收入超过 $50M；毛利率达到 40% 以上；宣布第二个一级客户；100MW 数据中心部署启动。
        - 3-4 年内通过 IPO 或被机器人 / 工业领域龙头战略收购，以 $2.5B-$3.5B 退出（回报 2.5 倍-3.5 倍）。
        - Haverhill 工厂商业爬坡延迟；关键技术人员流失或客户取消试点。
        - 25%（要求工业化执行无瑕，并快速实现客户多元化）
      - - 基准情景
        - 2026 年收入增长至 $25M-$35M；毛利率稳定在约 25%-30%；Symbotic 持续部署但没有大幅扩张。
        - 估值按市价调整至 $1.0B-$1.4B；4-5 年内倍数温和扩张至 1.0 倍-1.4 倍。
        - 原材料波动压缩利润率；印度 100MW 数据中心计划的采用速度放缓。
        - 50%（与当前多轮融资轨迹和合同积压最为一致）
      - - 悲观情景
        - 收入停滞在 $20M 以下；铌成本高企导致毛利率低于 15%；Symbotic 数量减少或延迟下单。
        - 以 $400M-$600M 估值进行下轮融资重组；高级优先股堆叠吞噬普通股权益；大幅稀释。
        - 客户铺开暂停；实现经营盈利前现金 runway 收紧；审计师的持续经营警示再次出现。
        - 25%（反映审计师历史上对 runway 和电池制造资本密集度的警示）
    notes: 情景模型估算不同经营轨迹下的远期企业估值；回报逻辑以 $1.0B Series C 投后估值为基准。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
