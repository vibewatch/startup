              页面称备案文件未公开展示，进一步限制了公开验证。尽调应索取逐司法辖区合规矩阵、认证、索赔和事故日志、专利及自由实施意见，以及监管往来文件，并持续监控批准、召回、现场安全、生产良率、质保、Symbotic
