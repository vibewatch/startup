  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将已验证的商业证明、利润率不确定性和估值倍数依次连接至“继续研究”建议的决策框架。
    approximationNotes: 分析所列的决策阶段，代表根据 C 轮融资披露和已核实的公司申报文件设定的尽调关口。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
    data:
      nodes:
        - id: milestone-proof
          label: 商业与技术验证：Symbotic 全天候部署与收入增长 5 倍
        - id: margin-opacity
          label: 单位经济性不透明：单元级毛利率与 BOM 未披露
        - id: concentration-check
          label: 交易对手集中度：Symbotic 核心客户与领投方的一致性
        - id: valuation-multiple
          label: 估值溢价：$1.0B C 轮融资投后估值倍数（按运行率计算 >22 倍）
        - id: downside-protection
          label: 下行风险：历史审计师对资金续航的警示与未经验证的优先股堆叠
        - id: final-recommendation
          label: 最终判断：估值偏高，在毛利率披露前继续研究
      edges:
        - from: milestone-proof
          to: margin-opacity
        - from: margin-opacity
          to: concentration-check
        - from: concentration-check
          to: valuation-multiple
        - from: valuation-multiple
          to: downside-protection
        - from: downside-protection
          to: final-recommendation
