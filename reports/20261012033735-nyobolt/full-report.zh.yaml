              Nyobolt 已从实验室原型转向商业收入，2024 年收入 $9m，并获得超过 $150m 的合同管线。主要部署是 Symbotic 的 SymBot
              自主移动机器人（AMR），用于自动化高密度零售配送仓。Nyobolt Xtreme 电池包的能量容量是现有超级电容器的六倍，重量降低 40%。公司还面向 物理 AI 基础设施和超大规模 AI
              数据中心开发高密度电池系统，以缓冲 GPU 集群的毫秒级功率波动。英国 Haverhill 设施计划将专业岗位从 12 个扩展至 70 个，年度目标产能为 2 百万 个电芯和 1,000
