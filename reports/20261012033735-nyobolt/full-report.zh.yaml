  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心负极化学与低阻抗电芯设计
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的技术优势源自 Cambridge 大学由 Clare Grey 教授和 Sai Shiv教授领导的十余年电化学研究。传统锂离子电池使用石墨负极，在超过 2C
              的充电速率下容易出现锂析出、枝晶生长和焦耳发热。Nyobolt 使用具有开放晶体隧道结构的纳米结构铌钨氧化物（NWO）负极，使锂离子快速嵌入和脱嵌而不引发晶格应变或相变。Nyobolt 与 Coventry
              University 的 Cell Prototyping Laboratory 合作，将其规模化为高功率软包和圆柱电芯。所得低阻抗电芯功率密度最高可达标准锂离子电芯的二十倍，同时保持相当能量密度。Nyobolt
              的产品包括支持 6—10 分钟周转的 Nyobolt Ultra，以及支持 1—5 分钟极端快充的 Nyobolt Xtreme。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
