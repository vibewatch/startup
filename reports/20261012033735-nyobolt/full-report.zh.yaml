    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的技术源自 2018 年剑桥电池研究突破，公司于 2019 年成立。它并非只销售电芯，而是覆盖负极材料、电芯、电池包、电池管理、电力电子、充电控制和软件的集成能源系统公司。应用重点包括 AI
              基础设施、机器人、重型车辆、乘用车和电网系统。官方足迹包括 Cambridge 总部，以及 Haverhill、Bedford、Bad Duerkheim 和 Tokyo。公司声称产品可在 5 分钟内从 10%
              充至 80%；现有证据未提供经独立审计的产品表现数据集。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO015
