      - number: '5.2'
        title: 电池包架构与热管理
        blocks:
          - type: paragraph
            body: >-
              将超快充电芯集成到可靠电池包中，需要协同设计机械外壳、电力电子和热调节回路。350 kW 快充会连续输送最高 500A 电流，微小内部电阻也可能造成危险温升。Nyobolt
              采用低阻抗模块互连和主动液冷；冷却系统使用铝制冷板循环水和乙二醇，并与空调压缩机、冷凝器和专用冷却器集成。与 CALLUM 合作开发的 Nyobolt EV 原型在连续 350
              kW（800V）直流充电期间将峰值温度保持在 60°C 以下；35 kWh 电池包在 4 分 37 秒内从 10% 充至 80%，前 4 分钟增加 120 英里 续航。BMS 还提供毫秒级遥测、电压均衡和主动电流
              逐步降流。
            claimRefs:
