        blocks:
          - type: paragraph
            body: >-
              将 Nyobolt 与其他快充化学体系区分开的核心耐久性主张，是电芯能够在不出现灾难性容量损失或阻抗飙升的情况下承受数千次极端 C 倍率循环。独立测试显示，2.6 Ah 电芯在 23°C、12C 充电和 1C
              放电条件下连续完成超过 4,400 次快充循环，容量保持率超过 80%；4,400 次 5 分钟充电后内部阻抗仅增加 50%。但低于 5 分钟补能依赖稀缺的 350 kW、800V、500A
              直流快充设备；电池级铌和钨供应也集中在 CBMM、H.C. Starck 等运营商。供应中断或价格上涨可能侵蚀 Haverhill 工厂的单位利润率。
