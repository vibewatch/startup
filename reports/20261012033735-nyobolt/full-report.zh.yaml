              - CV012
      - number: '8.3'
        title: 建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              综合现有的技术证据、商业进展和融资指标，我们对 Nyobolt 给出“继续研究”的投资建议，信心评分为中等（5.8/10），风险评级为高，估值判断偏高。暂不直接建议买入的首要原因是入场价格缺乏纪律：一家预计年化
              run-rate 收入仅 $25m 至 $45m 的企业，却对应 $1.0b 估值，投资者必须对单位毛利和合同持续转化抱有极高信心。Nyobolt 技术在 Symbotic 的 24/7
              自主移动机器人中表现无疑优于传统超级电容器和标准锂电芯，但战略投资者的验证不能替代经审计的产品层面盈利能力和透明财务报告。

              我们的决策框架认为，若要上调至更积极的投资立场，必须实质性补上两项主要尽调缺口：第一，经审计确认 Haverhill 的电芯制造在规模化后毛利率超过 35%；第二，以合同验证至少两家独立、非 Symbotic
              的企业客户，其硬件与服务经常性年收入合计超过 $20m。在这些里程碑达成前，以 $1.0b 股权估值入场，会让新资本在下一轮融资或上市退出时面临显著的倍数压缩风险。相比按 headline
              估值发行、未定价的普通股或 pari passu 优先股，采用结构化投资工具——例如带 20% 至 30% 折价机制的高级可转债，或清晰的清算优先权——能提供更合适的风险调整后敞口。
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
              - CV013
