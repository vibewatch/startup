        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              产品与市场匹配度十分直接：联合创始人兼 CEO Sai Shiv拥有覆盖电池价值链的经验，联合创始人兼首席科学家 Clare Grey
              主导底层学术研究。官方领导层页面还列出技术、商业、财务、运营、制造、战略、人力和传播高管，职能覆盖较完整；但技术叙事和公开公司身份仍高度集中于两位创始人。Tracxn 报告有 9
              名在任董事，但留存材料没有当前官方董事会名册、委员会架构、投票权安排或继任计划。因此，治理质量和创始人依赖仍是尽调问题，而不是已验证的优势。
