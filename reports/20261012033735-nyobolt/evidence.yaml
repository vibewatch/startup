evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current official board register, committee mandates, founder succession plan, executive biographies, and
      management ownership.
    whyItMatters: Founder dependence and board independence cannot be assessed from names and titles alone.
    diligencePath: >-
      Request the latest board pack, statutory director register, committee charters, organization chart, succession
      plans, and executive CVs.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      An audited reconciliation between the $9 million 2024 non-GAAP company figure and the less-than-£1 million
      UK-entity figure shown by Tracxn.
    whyItMatters: >-
      Revenue scale, accounting perimeter, growth, and valuation multiples cannot be evaluated reliably without
      comparable definitions.
    diligencePath: >-
      Obtain audited consolidated accounts, management accounts, revenue recognition policies, and a contract-to-revenue
      bridge for 2023-2026.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Current ownership percentages, preference terms, debt, secondaries, option dilution, investor rights, and cash
      available after financing.
    whyItMatters: Headline funding and valuation do not establish common-equity value, liquidity, governance control, or runway.
    diligencePath: >-
      Request the fully diluted cap table, all financing documents, debt schedules, secondary-transfer records, and
      latest cash statement.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Current customer count, named production customers, backlog composition, cancellation rights, and concentration by
      customer.
    whyItMatters: >-
      Contract value cannot establish diversified recurring demand or revenue conversion without customer and
      contract-level detail.
    diligencePath: >-
      Request a customer roster, top-ten concentration schedule, signed-order backlog, renewal data, and contract
      samples.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: A complete, current investor register with ownership, board seats, and economic rights for every security holder.
    whyItMatters: The public stakeholder map is only a sample and cannot establish control or the full economic waterfall.
    diligencePath: Reconcile the statutory shareholder register to the fully diluted cap table and all side letters.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Contract-level breakdown of the $150 million secured contract value, distinguishing anchor customer Symbotic
      commitments from independent pipeline accounts.
    whyItMatters: >-
      Material revenue concentration in a single customer creates downstream dependency and valuation risk if
      deployments encounter rollout delays.
    diligencePath: Request customer contract schedule, milestone completion terms, and non-Symbotic commercial backlog under NDA.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
