  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: An independent hospitality-software market model segmented by hotel type, geography, and software category, plus a disclosed Mews segment mix to bridge TAM to SAM/SOM.
      whyItMatters: Without an external market model and Mews-specific segment mix, valuation work can describe demand signals and budget envelopes but cannot underwrite addressable market share with precision.
      diligencePath: Obtain recent independent industry market reports or public-company lodging-tech disclosures, then reconcile them with management's own customer and product mix.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: pricing-economics
      missingEvidence: Executed Mews quotes or contracts showing module pricing, support tiers, payment-processing take rates, and add-on packaging by property type.
      whyItMatters: Quote-only pricing and payments economics determine real adoption friction and customer payback, especially when the all-in stack extends beyond the base PMS.
      diligencePath: Request anonymized customer proposals or management pricing sheets and compare them against live property bills for small, mid-sized, and multi-property accounts.
    - type: missing-source
      severity: minor
      topic: enterprise-segmentation
      missingEvidence: A disclosed breakdown of Mews customers or ARR by independent hotels, large managed properties, and multi-property groups.
      whyItMatters: Public review concentration suggests where adoption is strongest, but it does not prove revenue concentration or where future upsell capacity is greatest.
      diligencePath: Ask management for segment-level customer count, GMV, or ARR mix and cross-check it against reference customers and win-loss examples.
