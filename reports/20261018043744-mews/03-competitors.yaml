      severity: material
      topic: pricing-transparency
      missingEvidence: Public list pricing or realized pricing for named incumbent and cloud-PMS rivals, plus Mews payment take-rate disclosure.
      whyItMatters: Without like-for-like commercial terms, the pricing comparison remains directional and cannot show whether Mews' integrated suite is cheaper or simply differently packaged.
      diligencePath: Obtain current quotes or procurement screenshots from Mews, Oracle OPERA, Cloudbeds, and at least one standalone RMS or channel vendor used by comparable hotels.
    - type: missing-source
      severity: material
      topic: win-loss-benchmarking
      missingEvidence: Public win-loss data or independent benchmark studies comparing Mews against Oracle, Cloudbeds, Stayntouch, or other named hotel-system rivals by segment.
      whyItMatters: The chapter can describe Mews' architecture and buyer tradeoffs, but it cannot prove competitive conversion rates or displacement patterns from the assigned pool alone.
      diligencePath: Gather reference calls, procurement records, analyst comparisons, or hotel group case studies that document recent platform selections and rejection reasons.
