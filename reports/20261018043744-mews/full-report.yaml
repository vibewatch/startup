      - number: '4.2'
        title: Public traction and commercial proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction datapoints are volume and installed-base proxies, not audited revenue. In
              its January 2026 funding announcement, Mews said it had 15,000 customers across 85 countries, $19.7
              billion of platform transaction volume in 2025, and 55% SaaS gross-profit growth. That is enough to
              establish meaningful scale and a large cross-sell surface for payments, RMS, and ancillary workflows, but
              it does not translate cleanly into recognized revenue or cash generation. Customer-proof examples help
              show time-to-value and usage outcomes—such as 18-day onboarding, upsell revenue, automated payments, and
              direct-booking conversion—but they remain selected case studies rather than portfolio medians. The
              AI-readiness outlook also implies that connectivity, open APIs, and structured content may become more
              important demand drivers than pure ad spend in future hotel software selection.
