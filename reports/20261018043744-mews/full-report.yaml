  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: Mews competes against architectures, not just PMS brands'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports treating Mews as a challenger to several alternative architectures at once
              rather than to one clean peer set. Official Mews materials argue the average hotel still runs on eight to
              ten software vendors, while Dante Bianchi's field note frames the practical substitute set as legacy
              on-prem PMS deployments such as OPERA or older RoomMaster, fragmented point tools, and manual
              front-desk-heavy operations. That matters because the buyer tradeoff is often between keeping specialized
              tools that preserve bespoke workflows and moving to a more unified operating model. On the evidence in
              this pool, Mews is strongest where a hotel wants fewer handoffs across reservations, payments, pricing,
              messaging, and distribution; it is weaker where the property values maximum workflow customization,
              processor flexibility, or established incumbent habits more than consolidation.
            claimRefs:
              - CP001
              - CP002
