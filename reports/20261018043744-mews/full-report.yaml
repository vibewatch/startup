            - Looking for faster staff training and fewer integration fees
          tone: positive
        - label: Migrate from fragmented stack
          actor: Ops or IT lead
          touchpoints:
            - Legacy PMS replaced in days or weeks in case-study examples
            - Buyer pain centers on disconnected systems and manual reconciliation
          tone: neutral
        - label: Automate guest-facing workflows
          actor: Front desk and revenue teams
          touchpoints:
            - Self-service kiosk check-in and guest messaging
            - Automated payments and upsell flows
          tone: positive
        - label: Standardize portfolio operations
          actor: Multi-property leadership
          touchpoints:
            - Shared PMS payments and reporting across hotel groups
            - Faster launch playbooks for new properties
          tone: positive
        - label: Expand into adjacent modules
          actor: Commercial and distribution teams
          touchpoints:
            - Channel-manager migration path through SiteMinder overlap
            - Access to 400+ OTAs through one contract and support line
          tone: positive
        - label: Hit enterprise-fit boundary
          actor: Enterprise resort or events operator
          touchpoints:
