  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization breadth
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a broadening revenue model rather than a single-function PMS thesis. Mews' 2026
              operating-system launch bundled revenue management, guest messaging, automations, accounts receivable, and
              channel management into the same commercial narrative as the existing PMS, POS, payments, and reservation
              workflow. That matters financially because it creates multiple attach points per property: subscription
              software, payment processing, distribution, ancillary-space monetization, and workflow automation. The
              public record is still thin on what Mews actually captures from each stream. Outside a third-party review
              estimate for entry PMS pricing, the assigned sources do not disclose realized ASPs, bundle discounts,
              payment take rate, or whether new modules are sold à la carte versus bundled into broader contracts.
