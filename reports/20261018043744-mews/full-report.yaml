  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Assigned evidence places Mews highest on consolidation, while bespoke and specialist alternatives preserve
      stronger fit for custom workflows.
    data:
      xAxis:
        label: Platform consolidation
        min: 1
        max: 5
        low: Fragmented
        high: Unified
        description: Ordinal score derived from assigned-source evidence
        scale: ordinal
      yAxis:
        label: Fit for bespoke or legacy workflows
        min: 1
        max: 5
        low: Lower fit
        high: Higher fit
        description: Higher values preserve more customized operating habits
        scale: ordinal
      points:
        - label: Mews OS
          x: 5
          'y': 3
          detail: >-
            Unified PMS, payments, RMS, messaging, and channel layers reduce stack sprawl, but reviews and field notes
            still flag reporting, multi-property, and payment constraints.
        - label: Legacy on-prem PMS
          x: 2
          'y': 4
          detail: >-
            Legacy systems keep familiar workflows and can suit custom operations, but assigned evidence frames them as
            less mobile and less unified.
        - label: Standalone RMS plus PMS
          x: 2
          'y': 4
          detail: >-
            Specialist pricing tools preserve deeper point functionality, but Mews is trying to absorb that category
            into the core stack.
        - label: External channel manager plus PMS
          x: 2
          'y': 3
          detail: >-
            Distribution depth remains attractive as a specialist layer, yet Mews is using the SiteMinder partnership to
            remove a separate contract and support flow.
        - label: Fragmented best-of-breed stack
          x: 1
          'y': 4
          detail: >-
            Best-of-breed stacks maximize function-level choice but keep the reconciliation burden that Mews cites as
            the industry's core problem.
        - label: Internal build or manual workarounds
          x: 3
          'y': 5
          detail: >-
            Local process control can fit idiosyncratic operations, but it carries the highest testing, integration, and
            staff-process burden.
    approximationNotes: >-
      Axes are evidence-backed ordinal scores from the assigned pool, not measured benchmark values or inferred
      market-share rankings.
