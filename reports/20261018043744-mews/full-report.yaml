      - number: '4.3'
        title: Capital needs and balance-sheet context
        blocks:
          - type: paragraph
            body: >-
              Mews has obvious access to capital, but public evidence still stops short of proving capital adequacy. The
              company announced a $300 million Series D at a $2.5 billion valuation in January 2026, and Tracxn records
              $710 million of total funding over 14 rounds including a $100 million conventional debt round in September
              2024. That combination suggests management has financed expansion with both equity and debt while
              continuing to invest in payments, international growth, and AI-led product development. What remains
              missing is the underwriting bridge from raised capital to current balance sheet: there is no public cash
              balance, burn figure, runway, debt covenant, or free cash flow disclosure in the assigned source set. The
              funding headline therefore improves resilience optics more than it clears solvency risk.
            claimRefs:
              - CI001
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial read-through is directionally positive on revenue quality but incomplete for underwriting.
              Public evidence points to a platform that is widening its monetization surface, growing gross-profit
              dollars, and generating operational proof points that can support upsell and payments attach over time. At
              the same time, independent reviews flag billing workflow friction, uneven reporting depth, slower support
              on complex issues, and weaker fit for large resorts or legacy-heavy properties—all of which can cap
              enterprise ASPs or raise service-delivery costs. The core diligence blocker is still missing private
              finance data: without module mix, take rate, realized pricing, CAC/payback, concentration, burn, and
              runway, investors can track the business but cannot fully underwrite the margin path or capital intensity
              behind the refreshed valuation.
            claimRefs:
              - CI001
