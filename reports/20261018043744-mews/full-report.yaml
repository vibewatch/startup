    title: Recommendation logic
    type: flow
    summary: Public evidence supports category leadership, but the missing underwriting bridge keeps the call at track.
    data:
      nodes:
        - id: scale
          label: Scale proof
          note: >-
            15,000 customers, 85 countries, $19.7 billion of 2025 platform transaction volume, and 55% SaaS gross-profit
            growth.
        - id: product
          label: Product breadth
          note: >-
            Unfold 2026 combines RMS, channel management, guest messaging, automations, and accounts receivable into a
            wider operating-system pitch.
        - id: monetization
          label: Share-of-wallet upside
          note: Payments, revenue management, and workflow modules can deepen monetization inside existing hotel accounts.
        - id: friction
          label: Delivery friction
          note: Review synthesis still flags reporting, group billing, support, and occasional bug concerns.
        - id: price
          label: Price test
          note: Public sources disclose the $2.5 billion mark but not ARR, margin, net retention, or preference terms.
        - id: call
          label: Recommendation
          note: Track; upgrade only if private diligence proves durable economics or if price resets.
      edges:
