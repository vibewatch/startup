      - number: '5.3'
        title: Module maturity is uneven and public control evidence remains thin
        blocks:
          - type: paragraph
            body: >-
              The product roadmap is ambitious, but the public evidence base still shows uneven maturity. Community
              guidance from June 2026 said Guest Messaging was still in closed beta with GA targeted for August 1, which
              means at least one headline module was not yet broadly available when Mews unveiled the OS concept.
              Channel management is also partly partner-powered through SiteMinder, so an important distribution
              workflow still depends on an external rail rather than a fully native module. On the implementation side,
              third-party review evidence is directionally positive but not clean: customers consistently praise ease of
              use, automation, and integration flexibility, yet the same review set flags weaker reporting/BI,
              cumbersome billing or group workflows, and support or training gaps for more complex use cases. Finally,
              the assigned source pool contains only limited public evidence on security, privacy, uptime, and
              compliance controls beyond a support-process certification and general secure-data claims, so trust
              diligence should stay open rather than inferred from product breadth.
            claimRefs:
              - CE005
