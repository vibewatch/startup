      - number: '6.3'
        title: Durability and concentration remain the key customer unknowns
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence gap is not whether Mews has customers; it is whether the public evidence proves
              durable, diversified, and renewal-backed economics from them. Review and case-study material shows clear
              product-market fit and some expansion motions, but the assigned sources do not disclose NRR, GRR, churn,
              renewal rates, contract length, customer concentration, or partner-channel concentration. Even the
              expansion narrative is skewed toward cross-sell and operational breadth rather than hard retention
              evidence. For underwriting, the practical conclusion is that Mews looks commercially credible, but
              customer quality still depends on data the public record does not yet publicly provide today.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution risk now sits above pure category risk
        blocks:
          - type: paragraph
            body: >-
              The core downside is not whether hotels want modernization; it is whether Mews can turn a broad product
              narrative into reliable production behavior across revenue management, guest messaging, accounting, and
              distribution without introducing support or control failures. Mews itself framed Unfold 2026 as the moment
              five launches became one operating system, but one of the flagship modules - Guest Messaging - was still
              in closed beta on June 1, 2026. Independent coverage also warned that the "AI agents running operations"
              thesis is hard to prove in exception-heavy hotel workflows, and the combined stack broadens the blast
              radius if pricing, messaging, or workflow automation misfires across a 15,000-customer footprint.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Partner dependence and quote-based economics add downside convexity
        blocks:
          - type: paragraph
            body: >-
              Mews is deliberately pulling more third parties into the core operating path. HospitalityNet reported that
              nearly 3,000 joint Mews-SiteMinder hotels are expected to move onto the new embedded channel product,
              while Mews says that product will connect hotels to 400+ OTAs through one contract, one bill, and one
              support line. That creates concentration risk: if the migration, partner SLA, or API behavior degrades,
              room distribution and guest acquisition are directly affected. At the same time, the public pricing
              picture remains quote-driven, with separate payment processing fees and incomplete disclosure of
              implementation charges, making it harder to underwrite gross-margin durability or rollout payback without
              primary contracts.
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR012
      - number: '7.3'
        title: Public mitigations exist, but control evidence is still thinner than the risk surface
        blocks:
          - type: paragraph
            body: >-
              The assigned pool is not devoid of mitigations: Hotel Tech Report shows a GCSC support certification and
              references a SOC 2 Type 2 announcement, and customer proof indicates some properties kept operating even
              during internet outages. But the same evidence still flags weaker reporting and billing workflows, slower
              support for complex issues, internet and latency dependence, partner dependencies, and unresolved
              data-residency transparency. The practical implication is that diligence should not treat marketing
              language or review-page badges as equivalent to a trust center, DPA, incident playbook, or litigation
              search. This chapter therefore ranks the risk as manageable only if direct diligence closes those control
              gaps before underwriting a priced round.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting the next round
            body: >-
              Treat the thesis as broken if post-GA guest messaging still lacks production references, if the SiteMinder
              migration slips or degrades channel performance materially, or if diligence cannot clear support-SLA and
              data-governance questions before committing capital.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR009
              - CR011
          - type: callout
            title: Mitigations exist, but they are still mostly narrative markers
            body: >-
              Support certification, a SOC 2 announcement reference, and customer anecdotes about resilient operations
              are helpful, but they are not substitutes for primary control documents, incident history, or
              contract-level economics.
            calloutType: insight
            claimRefs:
              - CR009
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation context supports interest, not price conviction
        blocks:
          - type: paragraph
            body: >-
              Public evidence anchors the discussion around Mews' January 2026 Series D: the company disclosed a $300
              million round at a $2.5 billion valuation, and both company-issued and independent coverage repeated 2025
              operating markers that are large enough to command attention. The strongest disclosed proof points are
              scale and activity rather than clean software-economics disclosure: 15,000 customers, 132,000+ monthly
              active hoteliers, 85 countries, $19.7 billion of platform transaction volume, and 55% SaaS gross-profit
              growth. That package makes it credible that Mews is becoming a category leader in hotel operating
              software, and Vestbee's note that Mews had also raised $75 million in 2025 reinforces that investors are
              still funding acceleration. The problem for underwriting is that the public pack stops before it discloses
              the recurring revenue, retention, margin, or preference terms needed to decide whether the $2.5 billion
              mark offers upside for a new investor rather than simply confirming that high-quality capital is still
              available to the company.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV014
      - number: '8.2'
        title: Upside depends on operating-system expansion outpacing delivery friction
        blocks:
          - type: paragraph
            body: >-
              The most important upside argument is not just that Mews has scale already, but that it is trying to turn
              a property-management footprint into a broader hospitality operating system. Unfold 2026 added embedded
              revenue management, channel management, guest messaging, automations, and accounts receivable; management
              also presented these features as the route to deeper payments and workflow monetization inside the
              installed base. Publicly cited performance claims are directionally attractive: Mews says RMS runs 150
              million pricing calculations a day and improves revenue per square meter, while an IDC study cited by the
              company claims meaningful customer ROI and payback. HospitalityNet's reporting on the SiteMinder
              partnership suggests cross-sell headroom inside hotels that already use both products. The main
              counterweight is that independent review synthesis still flags reporting, group billing, support, and
              occasional bug issues, while an executive interview also highlights data quality, rollout sequencing, and
              change management as real constraints on AI-led automation becoming dependable at scale.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Recommendation discipline should stay relative to the current mark
        blocks:
          - type: paragraph
            body: >-
              The right reader-facing conclusion from this public evidence set is track, not buy or pass. A pass would
              overstate the downside because the company clearly has scale, product ambition, and fresh institutional
              support; a buy would overstate what has actually been underwritten because the available sources never
              bridge from platform activity and product vision to the software, payments, and cash-generation metrics
              that determine forward returns. That is why scenario framing should stay relative to the disclosed $2.5
              billion price rather than pretend to a precise fair-value range. The upgrade path is concrete: private
              diligence would need to show clean ARR quality, durable net retention, attractive payments economics,
              manageable support/reporting friction, and a cap table without punitive preference or dilution overhang.
              Until that package exists, the best stance is to keep Mews in the active pipeline, avoid stretching on
              price, and revisit aggressively only if data or terms move in the investor's favor.
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy, at the disclosed mark
            body: >-
              Mews has enough public evidence of category leadership to stay on the short list, but the available
              materials do not justify leading or stretching into the current valuation without private financial and
              cap-table diligence.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
          - type: callout
            title: What would upgrade the call
            body: >-
              A tighter recommendation would require private evidence that platform scale converts into high-quality
              recurring software and payments economics, plus proof that support and reporting friction are not
              undermining adoption of the broader operating-system bundle.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
