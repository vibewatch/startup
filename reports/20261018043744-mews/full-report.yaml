  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows a repeatable motion from modern-fit evaluation to module expansion, but not full retention
      proof.
    data:
      items:
        - label: Evaluate modern-fit segment
          actor: Owner-operator or GM
          touchpoints:
