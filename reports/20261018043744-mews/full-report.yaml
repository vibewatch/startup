  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope has widened from PMS to a hospitality operating system
        blocks:
          - type: paragraph
            body: >-
              Mews is no longer just selling a reservation or front-desk system. The official product narrative now
              spans PMS, POS, RMS, housekeeping, payments, messaging, automation, channel distribution, and receivables,
              with the company explicitly framing this as one operating system for hotel operations rather than a bundle
              of disconnected point tools. Independent coverage broadly matches that framing: Hospitality Net describes
              the 2026 launch set as one integrated stack, while EQT's investment thesis argues the newer modules are
              being integrated into an API-first platform rather than bolted on as loose add-ons. The key underwriting
              point is that product breadth is real and expanding, but investors should separate long-standing core PMS
              and payments capabilities from the newer OS layers that still need proof of GA readiness, scaled adoption,
              and operational reliability.
