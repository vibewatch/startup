  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Ranked view of the six risks that matter most to underwriting a 2026 Mews round.
    data:
      columns:
        - label: Likelihood
          detail: Public-evidence view as of 2026-10-18
        - label: Impact
          detail: Operational or underwriting blast radius
        - label: Mitigation maturity
          detail: Higher is better; reflects evidence strength, not vendor intent
      rows:
        - label: AI guest messaging rollout
          values:
            - label: Medium
              tone: high
              note: Closed beta on 2026-06-01 shows near-term rollout risk.
            - label: High
              tone: critical
              note: Guest comms and task actions touch live service delivery.
            - label: Low-medium
              tone: medium
              note: Assigned pool lacks post-GA error, override, or reference data.
        - label: Full-stack product integration
          values:
            - label: Medium-high
              tone: high
              note: Five launches and acquisition-heavy expansion increase execution surface area.
            - label: High
              tone: critical
              note: Cross-module workflow failures would affect front office and finance.
            - label: Medium
              tone: medium
              note: Product breadth is real, but rollout telemetry is not public here.
        - label: SiteMinder migration dependency
          values:
            - label: Medium
              tone: medium
              note: Nearly 3,000 joint hotels still need to move onto the combined product.
            - label: High
              tone: critical
              note: Distribution problems hit booking flow and room inventory quickly.
            - label: Medium
              tone: medium
              note: One-contract / one-support positioning helps, but SLA evidence is missing.
        - label: Support and incident responsiveness
          values:
            - label: Medium
              tone: medium
              note: Review evidence cites slower support for complex or peak-period issues.
            - label: High
              tone: high
              note: PMS downtime or slow triage is acute for live hotel operations.
            - label: Medium
              tone: medium
              note: Support certification exists, but no direct SLA or response-time data was retained.
        - label: Cloud uptime and connectivity dependence
          values:
            - label: Medium
              tone: medium
              note: Public feedback still flags internet and latency sensitivity.
            - label: Medium-high
              tone: high
              note: Even short disruptions can impair check-in, billing, or channel updates.
            - label: Medium
              tone: medium
              note: Customer proof suggests some resiliency, but status-history evidence is absent.
        - label: Pricing and compliance transparency
          values:
            - label: Medium
              tone: medium
              note: Quote-based pricing and incomplete implementation disclosures are persistent.
            - label: Medium-high
              tone: high
              note: Opaque fees and missing control documents can alter payback and liability assumptions.
            - label: Low-medium
              tone: medium
              note: Public mitigations are high-level; primary trust and contract artifacts were not in pool.
    approximationNotes: >-
      Ordinal ratings synthesize the retained sources; they are not implied incident frequencies or actuarial
      probabilities.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
