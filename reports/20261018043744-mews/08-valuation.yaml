  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: valuation-underwriting
      missingEvidence: ARR, revenue, NRR, gross margin, free-cash-flow or burn, and the split between software and payments economics.
      whyItMatters: A new investor cannot tell whether the disclosed $2.5 billion mark offers upside without the metrics that convert platform activity into durable enterprise value.
      diligencePath: Request the latest board deck, monthly KPI pack, audited or management financials, and a bridge from platform transaction volume to recurring revenue and gross profit.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: cap-table-overhang
      missingEvidence: Current cap table, liquidation preferences, option-pool expansion, debt covenants, and any structured financing rights.
      whyItMatters: Entry discipline depends on whether new money would be diluted or subordinated by preference terms that are invisible in public reporting.
      diligencePath: Obtain the current cap table, investor-rights agreement, debt schedule, and term-sheet summary from management and counsel.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: external-comps
      missingEvidence: A current comparable set with relevant growth, margin, retention, and transaction-multiple data across hospitality or adjacent vertical software.
      whyItMatters: Without external valuation anchors, scenario work can only stay relative to the current mark rather than establishing a precise fair-value range.
      diligencePath: Build a comp pack from public hospitality software, travel-tech infrastructure, and recent private transactions after the private KPI set is available.
      relatedQuestionRefs: [QV008]
