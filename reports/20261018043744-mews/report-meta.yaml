  topStrengths:
    - Category-leading hospitality OS narrative with broad product coverage and clear platform expansion.
    - Strong capital access, including a $300 million Series D at a $2.5 billion valuation.
    - Large installed base and transaction volume suggest meaningful cross-sell and monetization potential.
  topRisks:
    - Public disclosure still does not reveal ARR, take rate, burn, runway, or board governance detail.
    - Independent reviews flag reporting, billing, and support friction as the platform broadens.
    - Payments and distribution expansion increase execution complexity and capital intensity.
  unresolvedGaps:
    - >-
      ARR, NRR, and segment-level gross margin remain unavailable, so the $2.5 billion valuation cannot be fully
      underwritten.
    - Payments net take-rate and PayFac contract terms are still opaque, limiting margin and lock-in analysis.
    - Consolidated group financial statements are not public, so the Dutch parent balance sheet remains unresolved.
    - Win/loss evidence versus Oracle and Cloudbeds is still missing, limiting competitive moat assessment.
    - Board composition and governance after the Series D remain unpublished.
