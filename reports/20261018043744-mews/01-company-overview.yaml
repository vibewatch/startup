company:
  name: "Mews"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Mews enters this refresh as a founder-shaped, Amsterdam-based hospitality software company that now frames itself as a full operating system rather than a stand-alone PMS. Public 2026 evidence supports a $300 million Series D at a $2.5 billion valuation and broad operating scale, but public financial disclosure still lags the valuation narrative because ARR, revenue run rate, board composition, and a fully reconciled capital history remain unavailable in the assigned evidence."
sections:
  - id: "identity-and-scale"
    title: "Identity and current operating scale"
    body: |
      Mews now positions itself as a unified hospitality operating system, not just a hotel PMS, with company materials describing one platform that spans revenue, operations, guest workflows, payments, and ancillary modules such as RMS and housekeeping. The assigned evidence also supports meaningful current scale: company-issued 2026 materials cite 15,000 properties across 85 countries and more than 132,000 monthly active hoteliers, while the June 2026 founder interview adds that properties on the platform processed $19.7 billion in transactions during 2025. Headquarters support is thinner than scale support but still present: the U.S. Chamber profile describes Mews as Amsterdam-based. The combination indicates a genuinely scaled vertical software platform, but the company still discloses activity metrics more readily than core financial metrics such as ARR or revenue run rate.
    claimRefs: ["CO001", "CO002", "CO009", "CO010", "CO011"]
    tableRefs: ["TO001"]
  - id: "founding-and-leadership"
    title: "Founding path and leadership concentration"
    body: |
      The founding story is unusually product-proximate. Richard Valtr says he worked in his family's Prague hotel operations, concluded incumbent hotel systems were fundamentally broken, and built Mews with early technical leaders Jan Široký and Jiří Helmich before The Emblem Prague Hotel became the first property to run entirely on the platform in 2013. The same interview says Matthijs Welle joined as CEO after the first year and brought Hilton operating experience into commercialization. In 2026 launch materials, major category and product narratives are still voiced primarily by Valtr and Welle, which supports a practical key-person-dependence view even without a published board roster in the assigned pool. Public leadership visibility is therefore adequate for the operating story but weak for governance diligence.
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO015"]
    tableRefs: ["TO002"]
  - id: "capital-and-stakeholders"
    title: "Capital history, stakeholder map, and governance gaps"
    body: |
      Public financing history is directionally clear even though the fully reconciled capital stack is not. The founder interview describes a progression from a $1.6 million seed round in 2016 to later Series A, B, and C raises, while current company-issued material says Mews recently secured a $300 million Series D at a $2.5 billion valuation; the same founder interview says the company has attracted $710 million from global investors. That is enough to confirm late-stage status and a deep venture sponsor set, but not enough to reconcile secondaries, debt, or any undisclosed bridge capital. The stakeholder picture is similarly legible on investors and strategic partners, yet opaque on formal governance because the assigned evidence does not publish a current board roster, board-seat allocation, or control terms.
    claimRefs: ["CO007", "CO008", "CO009", "CO013"]
    tableRefs: ["TO003"]
  - id: "milestones-and-current-positioning"
    title: "Milestones and current platform positioning"
    body: |
      Mews's historical arc in the assigned evidence is from early workflow automation toward a broader hospitality OS thesis. Company launch material credits the business with milestones such as online check-in, open APIs, embedded payments, online check-out, a 2021 semantic/data-model layer, and a 2025 mobile digital key, culminating in the May 2026 Unfold launch of RMS, channel management, guest messaging, automations, and accounts receivable under a unified operating-system framing. Independent Hospitality Net coverage adds that nearly 3,000 hotels already used both Mews and SiteMinder before migration to the combined channel-manager product. The main disconfirming evidence in this pool is not existential but operational: Hotel Tech Report says customers praise automation and integration flexibility while still flagging reporting, billing, and support gaps, which matters because the new OS pitch increases expectations for cross-module reliability.
    claimRefs: ["CO012", "CO013", "CO014", "CO016"]
    figureRefs: ["FO001"]
