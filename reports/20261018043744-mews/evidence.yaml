evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Public ARR, revenue run-rate, and segment mix figures for software, payments, and other operating-system modules.
    whyItMatters: >-
      The assigned evidence supports valuation and scale claims but not the core revenue base needed to underwrite the
      $2.5 billion Series D valuation.
    diligencePath: >-
      Request current board deck, monthly management accounts, and product-line revenue bridge that reconciles bookings,
      payments volume, and software revenue.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: conflicting-data
    severity: material
    topic: capital-history-reconciliation
    missingEvidence: A fully reconciled financing ledger covering all primary rounds, secondaries, and any debt or credit facilities.
    whyItMatters: >-
      The founder interview cites $710 million attracted, but the named public rounds in the assigned evidence do not
      fully explain that total.
    diligencePath: >-
      Obtain cap table history, round closing memos, and any secondary-sale summary to reconcile proceeds by date and
      instrument.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance-transparency
    missingEvidence: Current board roster, investor board-seat allocation, and formal control or veto rights.
    whyItMatters: >-
      Leadership visibility is adequate for operating analysis, but governance opacity limits diligence on oversight
      quality, investor control, and succession resilience.
    diligencePath: Request current board list, shareholder agreement summary, and post-Series D governance memo.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent hospitality-software market model segmented by hotel type, geography, and software category, plus a
      disclosed Mews segment mix to bridge TAM to SAM/SOM.
    whyItMatters: >-
      Without an external market model and Mews-specific segment mix, valuation work can describe demand signals and
      budget envelopes but cannot underwrite addressable market share with precision.
    diligencePath: >-
      Obtain recent independent industry market reports or public-company lodging-tech disclosures, then reconcile them
      with management's own customer and product mix.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Executed Mews quotes or contracts showing module pricing, support tiers, payment-processing take rates, and add-on
      packaging by property type.
    whyItMatters: >-
      Quote-only pricing and payments economics determine real adoption friction and customer payback, especially when
      the all-in stack extends beyond the base PMS.
    diligencePath: >-
      Request anonymized customer proposals or management pricing sheets and compare them against live property bills
      for small, mid-sized, and multi-property accounts.
  - type: missing-source
    severity: minor
    topic: enterprise-segmentation
    missingEvidence: >-
      A disclosed breakdown of Mews customers or ARR by independent hotels, large managed properties, and multi-property
      groups.
    whyItMatters: >-
      Public review concentration suggests where adoption is strongest, but it does not prove revenue concentration or
      where future upsell capacity is greatest.
    diligencePath: >-
      Ask management for segment-level customer count, GMV, or ARR mix and cross-check it against reference customers
      and win-loss examples.
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing or realized pricing for named incumbent and cloud-PMS rivals, plus Mews payment take-rate
      disclosure.
    whyItMatters: >-
      Without like-for-like commercial terms, the pricing comparison remains directional and cannot show whether Mews'
      integrated suite is cheaper or simply differently packaged.
    diligencePath: >-
      Obtain current quotes or procurement screenshots from Mews, Oracle OPERA, Cloudbeds, and at least one standalone
      RMS or channel vendor used by comparable hotels.
  - type: missing-source
    severity: material
    topic: win-loss-benchmarking
    missingEvidence: >-
      Public win-loss data or independent benchmark studies comparing Mews against Oracle, Cloudbeds, Stayntouch, or
      other named hotel-system rivals by segment.
    whyItMatters: >-
      The chapter can describe Mews' architecture and buyer tradeoffs, but it cannot prove competitive conversion rates
      or displacement patterns from the assigned pool alone.
    diligencePath: >-
      Gather reference calls, procurement records, analyst comparisons, or hotel group case studies that document recent
      platform selections and rejection reasons.
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: Module-level net revenue mix across PMS, payments, POS, RMS, channel management, AR, and spaces.
    whyItMatters: >-
      Without mix, investors cannot separate recurring software revenue from transaction-linked or services-linked
      revenue quality.
    diligencePath: Request segment P&L or board materials showing revenue mix, attach rates, and gross margin by monetization stream.
    relatedQuestionRefs:
      - QI001
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, contract terms, discounts, onboarding fees, and payment take-rate economics.
    whyItMatters: Third-party list estimates do not show actual ASPs, take rate, or the monetization value of add-on modules.
    diligencePath: >-
      Obtain customer contracts, renewal cohorts, payment-pricing schedules, and gross-vs-net revenue recognition
      policy.
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn, runway, debt terms, and covenant package after the 2026 Series D.
    whyItMatters: >-
      Funding headlines alone cannot prove whether expansion and acquisitions are self-financing or still dependent on
      fresh capital.
    diligencePath: Request latest management accounts, cash-flow statement, debt agreements, and board runway scenario pack.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, payback, win rate, sales cycle, expansion revenue, and customer concentration by segment.
    whyItMatters: >-
      Public case studies show selected outcomes but do not establish portfolio-average sales efficiency or retention
      durability.
    diligencePath: >-
      Request cohort CAC/payback analysis, funnel conversion by segment, and top-customer concentration for the latest
      twelve months.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Detailed public security, privacy, compliance, and uptime materials such as certifications, trust-center pages,
      SLA commitments, or incident-history documentation.
    whyItMatters: >-
      Product breadth alone does not prove the controls needed for enterprise hotel deployments or regulated payment
      workflows.
    diligencePath: >-
      Request current trust-center materials, payment-security certifications, DPA terms, and uptime or
      incident-reporting artifacts from Mews.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: module-maturity
    missingEvidence: >-
      Reference customers, attach rates, and renewal or usage data for Guest Messaging, Channel Manager, Accounts
      Receivable, and BI modules.
    whyItMatters: >-
      The investment case depends on whether the newer OS layers are broadly adopted products or still early attach
      modules with limited proof.
    diligencePath: Ask for module-level customer counts, cohort adoption curves, and three reference calls for each newer module.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: implementation-burden
    missingEvidence: Churn, escalation, implementation-time, and support-response metrics segmented by hotel size and complexity.
    whyItMatters: >-
      Public review and case-study evidence suggests both strong flexibility and non-trivial training or support burden,
      which affects rollout risk.
    diligencePath: Request implementation scorecards, support SLA performance, and churn or downgrade reasons by customer cohort.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Public NRR, GRR, churn, renewal-rate, and contract-length disclosure for the installed base.
    whyItMatters: Without durability metrics it is impossible to separate logo growth from recurring customer quality and expansion.
    diligencePath: Request cohort retention, renewal, and contract-term data by segment for the last 8 quarters.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer share, revenue concentration, geography mix, and channel-partner concentration for customer
      acquisition.
    whyItMatters: Concentration risk can change the interpretation of the visible growth and cross-sell narrative.
    diligencePath: >-
      Request the top 10 customers by ARR, revenue by geography and segment, and the partner-sourced share of new
      bookings.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A broader, representative sample of customer references across segments, property sizes, and geographies.
    whyItMatters: The public record is skewed toward favorable deployments and cannot stand in for the full customer base.
    diligencePath: >-
      Ask management for a customer reference list spanning wins, renewals, and challenged deployments across the last
      12 months.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU003
  - type: missing-source
