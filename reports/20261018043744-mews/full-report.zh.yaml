      - number: '4.3'
        title: 资本需求与资产负债表背景
        blocks:
          - type: paragraph
            body: >-
              Mews 显然有融资渠道，但公开证据仍不足以证明资本充足。公司在 2026 年 1 月宣布以 $2.5 billion 估值完成 $300 million Series D；Tracxn 记录其 14 轮融资累计
              $710 million，其中包括 2024 年 9 月一笔 $100 million 的常规债务融资。这种组合说明管理层同时使用股权和债务为扩张融资，并继续投入支付、国际增长和 AI
              驱动的产品开发。缺失的是从已融资资本连接到当前资产负债表的投资判断桥梁：指定来源没有公开现金余额、消耗速度、资金可支撑期限、债务契约或自由现金流。融资标题改善的是韧性观感，而不是消除偿付能力风险。
            claimRefs:
              - CI001
              - CI014
              - CI016
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从收入质量看，财务信号总体偏正面，但仍不足以完成投资判断。公开证据指向一个不断扩大变现面、增加毛利金额，并持续产生可支持未来增购和支付附着的运营证明的平台。同时，独立评论指出账单工作流摩擦、报表深度不均、复杂问题支持较慢，以及对大型度假村或老旧系统占比较高的物业适配较弱；这些问题都可能压低企业
              ASP
              或抬高服务交付成本。核心尽调阻塞点仍是缺少私有财务数据：没有模块结构、支付抽成率、实际定价、CAC/回本期、客户集中度、消耗速度和资金可支撑期限，投资者可以跟踪业务，却无法完整判断支撑新估值的利润路径或资本强度。
            claimRefs:
              - CI001
