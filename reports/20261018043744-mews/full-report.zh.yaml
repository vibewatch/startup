chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前运营规模
        blocks:
          - type: paragraph
            body: >
              Mews 如今把自己定位为统一的酒店业运营系统，而不只是酒店 PMS。公司材料称，一个平台覆盖收益、运营、宾客工作流、支付，以及 RMS、客房清洁等附加模块。现有证据也支持其已具备相当规模：公司发布的 2026
              年材料称，平台覆盖 85 个国家的 15,000 个物业、月活跃酒店从业者超过 132,000 人；2026 年 6 月的创始人访谈还称，平台上的物业在 2025 年处理了 $19.7 billion
              的交易。总部信息不如规模信息充分，但仍有依据：美国商会资料将 Mews 描述为总部位于阿姆斯特丹。综合来看，Mews 确实已成为有规模的垂直软件平台，但公司仍更愿意披露活跃度指标，而非 ARR
              或收入运行率等核心财务指标。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 创业路径与领导层集中度
        blocks:
          - type: paragraph
            body: >
              Mews 的创立故事与产品痛点贴得很近。Richard Valtr 表示，他曾参与家族在布拉格的酒店运营，认定现有酒店系统从根本上已经失灵，于是与早期技术负责人 Jan Široký 和 Jiří Helmich
              一起创办 Mews；2013 年，The Emblem Prague Hotel 成为第一家完全运行在该平台上的物业。同一访谈称，Matthijs Welle 在第一年后加入并出任 CEO，把 Hilton
              的运营经验带入商业化。2026 年发布材料中的主要品类和产品叙事，仍主要由 Valtr 和 Welle
              对外表达。即使现有证据没有公布董事会名单，这也支持“关键人物依赖”的实际判断。因此，公开领导层信息足以支撑运营故事，但不足以完成治理尽调。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO015
      - number: '1.3'
        title: 资本历史、利益相关方与治理缺口
        blocks:
          - type: paragraph
            body: >
              公开融资历史的大方向清晰，但完整对账后的资本结构并不清楚。创始人访谈描述了从 2016 年 $1.6 million 种子轮到后续 Series A、B、C 轮融资的过程；公司当前材料则称，Mews 最近以
              $2.5 billion 估值完成 $300 million Series D。该访谈还称，公司已从全球投资者处吸引 $710
              million。上述信息足以确认其已进入后期阶段、拥有深厚的风险投资方阵容，但不足以对账二级交易、债务或任何未披露的过桥资金。投资者和战略伙伴构成相对清晰，但正式治理仍然模糊，因为现有证据没有公布当前董事会名单、董事席位分配或控制条款。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO013
      - number: '1.4'
        title: 里程碑与当前平台定位
        blocks:
          - type: paragraph
            body: >
              现有证据中的 Mews 历史轨迹，是从早期工作流自动化走向更广泛的酒店业 OS。公司发布材料列出的里程碑包括在线入住、开放 API、嵌入式支付、在线退房、2021 年语义/数据模型层，以及 2025
              年移动数字钥匙；2026 年 5 月的 Unfold 发布则把 RMS、渠道管理、宾客消息、自动化和应收账款纳入统一的操作系统框架。独立媒体 Hospitality Net
              补充称，在迁移到合并后的渠道管理产品前，已有近 3,000 家酒店同时使用 Mews 和 SiteMinder。该证据池中最主要的反向证据并非致命问题，而是运营层面的：Hotel Tech Report
              称，客户认可自动化和集成灵活性，但仍指出报表、账单和支持方面存在缺口。新 OS 叙事提高了跨模块可靠性的预期，这一点因此很重要。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案组合
        blocks:
          - type: paragraph
            body: >
              现有证据把 Mews 的市场定义为更广泛的酒店业运营系统预算，而不只是 PMS 替换周期。公司发布材料一贯把产品描述成一个数据层，覆盖
              PMS、RMS、消息、自动化、应收账款和渠道管理；同时指出，普通酒店在这些工作流上仍要运行 8 到 10
              个独立软件供应商。这个定义很重要，因为它把经济目标从预订台账扩大到运营栈整合决策；替代方案不再是一个现有模块，而是一组彼此割裂的品类工具。

              在这个边界内，最明显的需求信号是工作流统一。Mews 称，其 2026 年对五国 500 名酒店从业者的调查发现，运营方希望现有系统更好地协同；公开发布评论也显示，Mews
              正围绕定价、分销、消息、入住、开票和支付之间的衔接处推出新模块。              换句话说，Mews
              不只是增加相邻功能，而是想把集成负担转化为一笔能靠人员效率、宾客体验和收入优化证明其合理性的打包软件及支付预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM010
      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >
              独立评论和目录资料显示，实际买方通常是承担跨部门职责的运营者，而不是某一个部门负责人。对真实使用场景的公开描述反复提到前台、客房清洁、会计、预订、支付和收益管理工作流。因此，产品销售既触及运营用户，也触及能够证明跨部门平台整合合理性的预算负责人。在物业受到对账工作、上线复杂度或多工具宾客旅程困扰的情况下，采用
              Mews 的可能性更高；如果酒店对“窄 PMS 加点状集成”已经满意，采用动力则较弱。

              可见的公开足迹也指向 Mews 最自然的采用场景。Research.com 和 Hotel Tech Report 显示，Mews
              与酒店、旅舍、服务式公寓、企业住房、活动场地和多物业集团都相关；但可见公开评论数据最集中的仍是最大企业层级以下的市场：Hotel Tech Report 列出 485 家小型物业、377 家中型物业和 363
              家大型物业，500 间以上客房的物业只有 67 家。这种分布不能证明收入结构，但说明 Mews 的公开验证材料在独立酒店、精品酒店和中端运营环境中最强；在这些场景里，现代
              UX、集成和宾客自助服务可以迅速改变日常工作流。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
      - number: '2.3'
        title: 受证据约束的规模测算视角、驱动因素与限制
        blocks:
          - type: paragraph
            body: >
              现有证据不足以支持可信的自上而下 TAM、SAM 或 SOM 测算。指定证据中没有独立来源按酒店类型、地域或软件类别给出市场规模模型，也没有保留的来源披露 Mews
              自身的分部收入结构。可用的替代方法，是把市场规模视为一组可观察的预算和 ROI 视角：按报价计价的每间客房价格、物业层面软件栈总成本区间、客户覆盖广度，以及管理层引用的 ROI 证明。这些视角足以说明 Mews
              正在争取每个物业一笔有意义的软件加支付预算，但不足以判断今天全球住宿软件市场中究竟有多少真正可触达。

              最清晰的采用驱动因素是集成减负、自动化和收益管理经济性。公开材料称，Mews 内置 RMS
              能力，把定价与分销连接得更紧，并能让酒店栈更多部分共用一份合同和一张账单；独立评论也大体印证，集成和易用性是客户采用该产品的核心原因。限制因素同样主要是商业问题，而不只是技术问题：价格需要询价，支持升级要收费，一些评论者仍指出报表或多物业能力存在缺口，竞争对手拆解还认为支付加价和付费附加组件可能明显推高总拥有成本。这些摩擦尤其会拖慢大型或复杂客户的采用，而这些客户恰恰最能从整合中获得价值。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
              - CM010
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：Mews 对抗的是架构，而不只是 PMS 品牌
        blocks:
          - type: paragraph
            body: >-
              指定证据支持把 Mews 视为同时挑战多种替代架构，而不是一个边界清晰的同业集合。Mews 官方材料称，普通酒店仍运行 8 到 10 个软件供应商；Dante Bianchi 的一线笔记则把实际替代方案归纳为
              OPERA 或较早 RoomMaster 等老旧本地部署
              PMS、割裂的点状工具，以及高度依赖人工前台的运营方式。买方通常是在保留能支撑定制工作流的专业工具，与转向更统一的运营模式之间做取舍。根据这个证据池，酒店若希望减少预订、支付、定价、消息和分销之间的交接，Mews
              更有优势；如果物业更看重最大化工作流定制、支付处理商灵活性或沿用现有系统的习惯，而不是整合，Mews 则较弱。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP010
              - CP012
              - CP014
