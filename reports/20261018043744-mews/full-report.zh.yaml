    approximationNotes: 这是一张工作流桥接图，不是量化瀑布图；公开来源披露了产品连接和部分业绩主张，但未披露模块层面的收入占比。
  - id: FE001
    title: 公开证据中的 Mews 操作系统技术栈
    type: stack
    summary: 公开证据将 Mews 描述为分层的酒店技术栈：在同一数据模型上连接宾客运营、商业工作流、自动化和集成。
    data:
      layers:
        - label: 宾客与员工操作界面
          detail: 前台、宾客和收益团队通过同一运营环境协作，而不是分别使用单点工具。
          modules:
            - PMS 与预订引擎
            - POS
            - 自助终端与在线入住
            - Guest Messaging
          outputs:
            - 预订与互动事件
            - 员工工作流上下文
        - label: 商业与运营模块
          detail: 收入、支付、开票和宾客运营如今更贴近物业核心。
          modules:
            - RMS
            - 支付
            - 应收账款
            - 客房整理与运营工作流
          outputs:
            - 定价动作
            - 支付与开票工作流
        - label: 自动化与 AI 编排
          detail: Mews 正将代理驱动的自动化定位为酒店工作流的协调层。
          modules:
            - 自动化
            - Mews Agent
            - AI 辅助回复与任务路由
          outputs:
            - 自动化宾客动作
            - 减少人工交接
        - label: 共享数据与上下文层
          detail: 官方和外部来源都将共同数据模型及语义层指向技术黏合剂的位置。
          modules:
            - SpaceTime 数据模型
            - 语义层
            - 共享宾客、预订和客房上下文
          outputs:
            - 跨模块上下文
            - 一致的工作流状态
        - label: 集成与分发轨道
          detail: 开放 API 和合作伙伴轨道将平台延伸到外部渠道和酒店技术栈。
          modules:
            - 开放 API
            - 市场集成
            - SiteMinder 驱动的渠道管理器
          outputs:
            - OTA 分发
            - CRM 与网站集成
        - label: 报表与业绩可见性
          detail: 分析和资产组合可见性属于操作系统叙事的一部分，但评论证据表明其深度仍不一致。
          modules:
            - 商业智能
            - 资产组合报表
            - 收益与运营仪表盘
          outputs:
            - 预测与报表上下文
            - 资产组合层面的决策支持
    approximationNotes: 这套技术栈是对公开模块和运营依赖的分析性归纳，并非供应商的原样系统架构图。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
      - CE009
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，从现代化适配度评估到模块扩张的路径可以复现，但尚未证明完整留存。
    data:
      items:
        - label: 评估现代化适配客群
          actor: 业主兼运营者或总经理
          touchpoints:
            - 拥有 25-199 间客房的精品酒店或市中心酒店
            - 寻求更快的员工培训和更少的集成费用
          tone: positive
        - label: 从分散技术栈迁移
          actor: 运营或 IT 负责人
          touchpoints:
            - 案例研究显示，传统 PMS 可在数天或数周内替换
            - 买方痛点集中在系统割裂和手工对账
          tone: neutral
        - label: 自动化面向宾客的工作流
          actor: 前台与收益团队
          touchpoints:
            - 自助终端入住和宾客消息
            - 自动化支付与增售流程
          tone: positive
        - label: 标准化资产组合运营
          actor: 多物业管理层
          touchpoints:
            - 在酒店集团内共享 PMS、支付和报表
            - 为新物业更快落地的启动手册
          tone: positive
        - label: 扩展到相邻模块
          actor: 商业与分销团队
          touchpoints:
            - 通过 SiteMinder 重叠关系实现渠道管理器迁移
            - 通过一份合同和一个支持热线接入 400+ 个 OTA
          tone: positive
        - label: 触及企业级适配边界
          actor: 企业度假村或活动运营商
          touchpoints:
            - 复杂销售和餐饮需求仍是资格筛选点
            - 公开记录尚未证明其已广泛渗透企业度假村市场
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 影响 2026 年 Mews 融资判断的六项关键风险排名。
    data:
      columns:
        - label: 可能性
          detail: 截至 2026-10-18 的公开证据视角
        - label: 影响
          detail: 运营或投资判断的影响范围
        - label: 缓释成熟度
          detail: 越高越好；反映证据强度，而非供应商意愿
      rows:
        - label: AI 宾客消息发布
          values:
            - label: 中
              tone: high
              note: 2026-06-01 的封闭测试显示，短期内存在发布风险。
            - label: 高
              tone: critical
              note: 宾客沟通和任务动作触及实时服务交付。
            - label: 低—中
              tone: medium
              note: 已分配证据池缺少正式上线后的错误、人工覆盖或参考数据。
        - label: 全栈产品集成
          values:
            - label: 中—高
              tone: high
              note: 五次发布和以收购为主的扩张扩大了执行面。
            - label: 高
              tone: critical
              note: 跨模块工作流故障会影响前台和财务。
            - label: 中
              tone: medium
              note: 产品覆盖确实广，但这里没有公开发布遥测数据。
        - label: SiteMinder 迁移依赖
          values:
            - label: 中
              tone: medium
              note: 近 3,000 家联合酒店仍需迁移到合并后的产品。
            - label: 高
              tone: critical
              note: 分发问题会迅速冲击预订流程和客房库存。
            - label: 中
              tone: medium
              note: 一份合同 / 一个支持渠道的定位有帮助，但缺少 SLA 证据。
        - label: 支持与事故响应速度
          values:
            - label: 中
              tone: medium
              note: 评论证据称，复杂问题或旺季问题的支持速度较慢。
            - label: 高
              tone: high
              note: PMS 停机或分诊缓慢会直接影响酒店实时运营。
            - label: 中
              tone: medium
              note: 公司有支持认证，但未留存直接 SLA 或响应时间数据。
        - label: 云端正常运行时间与连接依赖
          values:
            - label: 中
              tone: medium
              note: 公开反馈仍指出其对网络和延迟较敏感。
            - label: 中—高
              tone: high
              note: 即使短暂中断，也可能影响入住、计费或渠道更新。
            - label: 中
              tone: medium
              note: 客户证据显示具备一定韧性，但缺少状态历史证据。
        - label: 定价与合规透明度
          values:
            - label: 中
              tone: medium
              note: 基于报价的定价和不完整的实施披露长期存在。
            - label: 中—高
              tone: high
              note: 不透明费用和缺失的控制文件可能改变回收期及责任假设。
            - label: 低—中
              tone: medium
              note: 公开缓释措施只有概括描述；证据池中没有主要信任和合同材料。
    approximationNotes: 序数评级综合了留存来源；它们不是隐含的事故频率或精算概率。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持品类领先，但缺失的投资判断桥接数据使结论仍停留在跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证明
          note: 15,000 家客户、85 个国家、2025 年 $19.7 billion 的平台交易量，以及 55% 的 SaaS 毛利增长。
        - id: product
          label: 产品广度
          note: Unfold 2026 将 RMS、渠道管理、宾客消息、自动化和应收账款整合进更宽泛的操作系统叙事。
        - id: monetization
          label: 钱包份额上行空间
          note: 支付、收益管理和工作流模块可以在现有酒店客户内加深变现。
        - id: friction
          label: 交付摩擦
          note: 评论综合仍指出报表、集团计费、支持和偶发 Bug 问题。
        - id: price
          label: 价格检验
          note: 公开来源披露了 $2.5 billion 的估值，但未披露 ARR、利润率、净留存率或优先权条款。
        - id: call
          label: 建议
          note: 跟踪；只有私人尽调证明经济性持久，或价格重置时，才上调判断。
      edges:
        - from: scale
          to: product
        - from: product
          to: monetization
        - from: monetization
          to: friction
        - from: friction
          to: price
        - from: price
          to: call
    approximationNotes: null
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
