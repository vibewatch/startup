  - id: TP001
    title: 竞争者与替代方案概览表
    columns:
      - 替代方案类别
      - 类别
      - 规模或融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Mews 运营系统
        - 直接的集成型挑战者
        - $300M Series D、估值 $2.5B；覆盖 85 个国家的 15,000 家物业；月活酒店从业者 132,000 人。
        - 寻找云原生运营核心的独立酒店、集团和品牌
        - 在一个平台内统一 PMS、支付、RMS、消息和分销层
        - 报告深度、多物业工具、支付经济性和定制工作流适配仍需验证
      - - 传统本地部署 PMS（例如 OPERA 或较早的 RoomMaster 类部署）
        - 在位替代方案
        - 指定来源提到传统案例，但没有提供当前规模数据
        - 已形成定制工作流、现代化紧迫性较低的物业
        - 熟悉的流程，更能适应传统运营习惯
        - 相比 Mews 的方案，硬件更新、移动性和附加模块路径更弱、更分散
      - - 独立 RMS 加 PMS 技术栈
        - 专业化点解决方案类别
        - Mews 称嵌入 RMS 后每天进行 150M 次定价计算；指定来源池没有提供独立竞品的规模或定价
        - 想要高级定价能力、但不想改变其余技术栈的酒店
        - 无需替换核心 PMS，也能保留各模块中的最佳定价逻辑
        - 工具分立会保留 Mews 正在试图消除的交接和上下文切换
      - - 外部渠道管理器加 PMS
        - 相邻替代方案
        - 由 SiteMinder 驱动的 Mews 渠道层提到 400+ 个 OTA，以及近 3,000 家当前并行使用的酒店
        - 重视广泛 OTA 分销、同时保留现有 PMS 的酒店
        - 专业分销深度和在位系统的熟悉度
        - 除非酒店采用 Mews 的嵌入式模式，否则会多出一套合同和支持流程
      - - 分散的最佳组合技术栈
        - 广义的现状型竞争者
        - Mews 称平均一家酒店仍在运行八到十家软件供应商
        - 习惯按功能拼接最佳工具的运营者
        - 各模块具备功能深度，也能按需更换供应商
        - 对账负担、重复账单和支持交接会随时间累积
      - - 内部自建和手动运营变通方案
        - 现状 / 内部替代方案
        - 指定来源池没有外部规模指标；经济性取决于具体物业
        - 依靠员工流程纪律和集成，而不是大规模软件迁移的物业
        - 本地控制力最大，也无需被迫更换平台
        - 集成、测试和员工流程负担最高，自动化上行空间最弱
    notes: 替代方案类别仅限于指定来源池直接提及或暗示的内容；缺失的竞品规模或定价数据保留为未知，不作推断。
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP010
      - CP012
      - CP013
      - CP014
  - id: TP002
    title: 功能与能力矩阵
    columns:
