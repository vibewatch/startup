        high: 统一
        description: Ordinal score derived from assigned-source evidence
        scale: ordinal
      yAxis:
        label: 对定制化或旧式工作流的适配度
        min: 1
        max: 5
        low: 较低适配
        high: 较高适配
        description: Higher values preserve more customized operating habits
        scale: ordinal
