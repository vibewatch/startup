        - AI 采用停滞或附加率令人失望。
        - 新模块采用数据、按客户群组划分的客户 ROI 和强劲留存。
      - - 基准
        - Mews 仍在赢得市场份额、拓宽产品边界，但私人市场的经营数据大致只能支撑当前估值。
        - 当前估值可以辩护，却谈不上明显低估；回报取决于克制的入场条款和持续执行。
        - 模块采用率不一，平台规模转化为利润率的幅度有限。
        - 增长稳定，ARR 质量和支付业务经济性尚可，但并不突出。
      - - 悲观
        - 报表支持和工作流复杂度拖慢扩张，而私人市场指标显示，平台活动转化为经常性利润池的能力更弱。
        - 公开叙事撑不起当前估值，平轮或下轮融资变得合理。
        - 净留存率偏低、利润率承压、实施拖延，或存在优先权负担。
        - 证据显示，流失集中在复杂物业，或新模块采用率偏弱。
    notes: 公开来源无法支持精确的外部可比估值区间，因此情景逻辑以披露的 $2.5 billion 融资估值为参照。
