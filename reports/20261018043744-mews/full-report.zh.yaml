        title: 公开增长与商业代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开增长数据点是交易量和安装基数代理指标，而不是经审计收入。Mews 在 2026 年 1 月融资公告中称，已覆盖 85 个国家的 15,000 个客户，2025 年平台交易额为 $19.7
              billion，SaaS 毛利增长 55%。这足以证明已具备有意义的规模，也说明支付、RMS 和附加工作流拥有很大的交叉销售面，但不能直接转化为确认收入或现金生成。客户案例可以展示价值实现速度和使用结果，例如
              18 天上线、增销收入、自动支付和直订转化；但它们仍是精选案例，而不是全体客户的中位数。面向 AI 的趋势也意味着，在未来酒店软件选择中，连接能力、开放 API 和结构化内容的重要性可能超过单纯的广告投放。
