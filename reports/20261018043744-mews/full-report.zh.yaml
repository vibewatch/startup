  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现广度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持收入模式正在扩宽，而不是单一功能 PMS 的叙事。Mews 2026 年的操作系统发布，把收益管理、宾客消息、自动化、应收账款和渠道管理，与现有
              PMS、POS、支付和预订工作流放进同一套商业叙事。这在财务上很重要，因为每个物业由此产生多个增购触点：订阅软件、支付处理、分销、附加空间变现和工作流自动化。但公开记录仍很少说明 Mews
              实际从每条收入流中捕获多少价值。除第三方对入门级 PMS 价格的估算外，指定来源没有披露实际 ASP、套餐折扣、支付抽成率，或新模块究竟是单独销售，还是打包进更大的合同。
