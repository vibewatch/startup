        - Essentials、Advanced 和 Enterprise 层级；月度价格取决于方案层级、物业规模和所需功能
        - 以核心 PMS 为基础，向更完整的运营系统扩展
        - 指定来源池没有公开确切目录价
        - 入门成本可变，依赖销售，而不是透明的自助购买
      - - Mews 附加模块扩展
        - RMS、POS 和额外市场集成需要另行付费
        - 让酒店向更完整的运营技术栈扩展
        - 总拥有成本可能显著高于基础许可费
        - 整合有价值，但集成套件并非统一的一揽子全包方案
      - - 嵌入式支付
        - 通过 Mews 基础设施处理，而不是酒店偏好的处理商
        - 令牌化、对账和嵌入式宾客支付流程
        - 跨境支付费用可能较高；本来源池没有公开 take rate 细节
        - 支付既是提高切换成本的杠杆，也是买方尽调重点
      - - 分散的最佳组合技术栈
        - 不同供应商对应多份合同、账单和支持渠道
        - 可按模块提供专业功能
        - 指定来源池没有提供整个技术栈的汇总价格
        - 酒店以集成复杂度换取功能层面的选择权
      - - 传统 PMS 迁移路径
        - 迁移和更新经济性因物业而异；指定来源池没有公开的可比合同条款
        - 保留现有工作流，避免近期更换平台
        - 转换成本和在位者折扣未知
        - 当工作流中断比整合更重要时，在位者仍可能胜出
    notes: 指定来源池支持方向性的产品打包分析，但不支持对点名竞品进行可比的公开定价基准比较。
