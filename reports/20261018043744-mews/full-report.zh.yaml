        - label: Mews OS
          x: 5
          'y': 3
          detail: 统一的 PMS、支付、RMS、消息和渠道层减少了技术栈蔓延，但评论和一线记录仍指出报表、多物业和支付方面存在限制。
        - label: 传统本地部署 PMS
          x: 2
          'y': 4
          detail: 传统系统保留熟悉的工作流，也能适应定制化运营，但已有证据将其描述为移动化和统一程度更低。
