      - [Boutique and city-center hotels, Owner-operator or GM / hotel staff / property budget owner, Replace legacy PMS with easier training and automation, "HotelTech.review calls Mews best for city hotels and boutiques with 25-199 rooms", Core documented sweet spot, No segment revenue mix or churn disclosure]
      - [Multi-property boutique groups, Central ops and finance / property teams / group owner, Standardize PMS payments and reporting across several properties, "Cuspera examples include Pelham Hospitality and Otter Hospitality using one PMS across portfolios", Supports land-and-expand motion within hotel groups, No disclosed cohort retention or group ACV]
      - [Tech-forward apartments glamping and contactless operators, Founder or ops lead / lean on-site team / property owner, Self-service check-in payments and automation, "Cuspera highlights Stay Awesome and autonomous or alternative-stay deployments", Expands Mews beyond traditional hotels into adjacent lodging formats, No disclosure of how large this cohort is]
      - [Large resorts and event-heavy properties, Enterprise leadership / specialized commercial teams / central IT or finance, Complex sales and catering or legacy-heavy operations, "HotelTech.review says large resorts with complex events should evaluate carefully", Defines edge of current fit rather than core demand, Win-loss and enterprise reference set are not disclosed]
    notes: Independent review and case-study sources; rows summarize public fit signals rather than revenue-share disclosure.
    claimRefs: [CU003, CU004, CU005, CU010, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Customer footprint, 15000 properties or customers across 85 countries, "2026-02 to 2026-05", "Mews press plus ExploreTech or Mews May launch press", High, Indicates scaled global installed base rather than a handful of logos, No split by region property type or payer size]
      - [Active usage, 132000 monthly active hoteliers or users, "2026-02 to 2026-03", "Mews press plus ExploreTech", High, Suggests recurring operator engagement not just contracts on paper, No mapping from users to paying accounts]
      - [Channel-manager expansion path, Nearly 3000 hotels already run both Mews and SiteMinder and will migrate over coming months, 2026-06, HospitalityNet, Medium, Shows a concrete cross-sell and migration surface inside the existing base, No disclosed conversion rate or commercial terms]
      - [Public proof ecosystem, 216 verified reviews and 106 expert recommendations analyzed with 55 success stories and 17 references surfaced, 2026 access, HotelTechReport, Medium, Shows broad public discussion and reference density around the product, Methodology and customer overlap are not disclosed]
    notes: Values preserve the public wording and time windows; several metrics lack account-level denominators or cohort breakdowns.
    claimRefs: [CU001, CU002, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [Sure Hotel by Best Western Wilhelmshaven City, Small branded hotel, "PMS and POS rollout with kiosk check-in and upsell workflows", Production, "18-day onboarding; 60% of guests check in via kiosk; €23,835 upsell revenue in 7 months", Case-study source with no contract-length disclosure]
      - [Pelham Hospitality, Medium hotel group plus event and restaurant operations, "Switched from Opera to Mews across hospitality workflows", Production, "100% automated payment process and new properties launch in about 30 days", Company-curated reference quality; no renewal or spend detail]
      - [Maison Mère, 51-room boutique hotel in Paris, "Digitized front-desk and upsell operations", Production, "€104 extra per upsell, €163 more per booking, ADR +33%, RevPAR +37% in 7 months", Single-property result set without independent verification]
      - [Stay Awesome, Small hotel and apartment operator, "Portfolio rollout with self-service check-in and fast implementations", Production, "Expanded from 2 to 7 locations in 18 months; 100% self-service check-in; 2-3 day implementation times", Outcome blends Mews with Atomize and does not disclose retention]
    notes: Partial sample of public case studies and references; not an exhaustive customer list and heavily weighted toward successful deployments.
    enumerationScope:
      coverage: sample
      basis: Public case studies and curated references captured in the assigned source pool rather than the full customer base.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows a repeatable motion from modern-fit evaluation to module expansion, but not full retention proof.
    data:
      items:
        - label: Evaluate modern-fit segment
          actor: Owner-operator or GM
          touchpoints:
            - Boutique or city-center hotel with 25-199 rooms
            - Looking for faster staff training and fewer integration fees
          tone: positive
        - label: Migrate from fragmented stack
          actor: Ops or IT lead
          touchpoints:
            - Legacy PMS replaced in days or weeks in case-study examples
            - Buyer pain centers on disconnected systems and manual reconciliation
          tone: neutral
        - label: Automate guest-facing workflows
          actor: Front desk and revenue teams
          touchpoints:
            - Self-service kiosk check-in and guest messaging
            - Automated payments and upsell flows
          tone: positive
        - label: Standardize portfolio operations
          actor: Multi-property leadership
          touchpoints:
            - Shared PMS payments and reporting across hotel groups
            - Faster launch playbooks for new properties
          tone: positive
        - label: Expand into adjacent modules
          actor: Commercial and distribution teams
          touchpoints:
            - Channel-manager migration path through SiteMinder overlap
            - Access to 400+ OTAs through one contract and support line
          tone: positive
        - label: Hit enterprise-fit boundary
          actor: Enterprise resort or events operator
          touchpoints:
            - Complex sales and catering needs remain a qualification point
            - Public record does not yet prove broad enterprise-resort penetration
          tone: warning
    approximationNotes: null
    claimRefs: [CU003, CU004, CU007, CU008, CU010, CU012, CU014]
