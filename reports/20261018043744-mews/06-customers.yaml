  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-durability
      missingEvidence: Public NRR, GRR, churn, renewal-rate, and contract-length disclosure for the installed base.
      whyItMatters: Without durability metrics it is impossible to separate logo growth from recurring customer quality and expansion.
      diligencePath: Request cohort retention, renewal, and contract-term data by segment for the last 8 quarters.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer share, revenue concentration, geography mix, and channel-partner concentration for customer acquisition.
      whyItMatters: Concentration risk can change the interpretation of the visible growth and cross-sell narrative.
      diligencePath: Request the top 10 customers by ARR, revenue by geography and segment, and the partner-sourced share of new bookings.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A broader, representative sample of customer references across segments, property sizes, and geographies.
      whyItMatters: The public record is skewed toward favorable deployments and cannot stand in for the full customer base.
      diligencePath: Ask management for a customer reference list spanning wins, renewals, and challenged deployments across the last 12 months.
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU003]
    - type: missing-source
      severity: minor
      topic: segment-mix
      missingEvidence: Revenue or customer-count splits by boutique, branded, enterprise, alternative stay, and multi-property segments.
      whyItMatters: Segment mix would show whether the strongest public references represent the core business or only a curated subset.
      diligencePath: Request a segmented customer-base rollup by property type, room band, geography, and direct versus partner-acquired channel.
