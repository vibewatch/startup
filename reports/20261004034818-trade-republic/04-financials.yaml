company:
  name: "Trade Republic"
chapter:
  number: 4
  title: "Financials"
  summary: "Third-party sources report €34.8 million of net income for the 2023/24 or 2024 reporting period and approximately €340 million of revenue, but the assigned evidence does not establish audited status or provide a current primary filing. The key underwriting issue is the post-PFOF revenue mix: public evidence describes low explicit customer fees, banking and interest income, and a new internal-execution model, while realized spreads, acquisition economics, cash, burn, runway, and debt remain undisclosed."

sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Customer Pricing"
    body: >-
      Trade Republic combines visible transaction pricing with less transparent
      economics from trading execution, banking services, and interest income.
      Curvo reports a €1 transaction fee for stock and ETF purchases or sales,
      while both Curvo and Banker on Wheels describe recurring ETF savings-plan
      execution as free. Banker on Wheels says the company earns from banking,
      interest, trading, and other products but does not disclose each stream's
      contribution. That missing mix matters because headline fees are not the
      same as realized revenue: spread capture, customer cash balances, trading
      frequency, and the proportion of free savings-plan activity determine
      revenue per customer. The prefetched official pricing page did not expose
      fee line items, so the third-party pricing evidence should be reconciled
      to management contracts and actual customer cohorts.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"

  - id: "reported-financial-profile"
    title: "Reported Profitability and Cost Structure"
    body: >-
      The latest financial figures in the assigned pool are secondary reports,
      not a retained primary filing. Wikipedia reports €34.8 million of annual
      profit for 2023/24 on about €340 million of revenue, including €316 million
      of commission income; Banker on Wheels separately describes approximately
      €34.8 million of net income for the 2024 financial year. Wikipedia also
      reports €225 million of general administrative expenses, including €67
      million of personnel expense. These figures indicate accounting
      profitability, not cash generation, and the differing period labels must
      be reconciled before modeling. They do not disclose gross margin, customer
      acquisition cost, channel spend, working capital, capital expenditure, or
      service-delivery cost. Consequently, the public record supports a
      profitability signal but not a complete unit-economic or cash-flow case.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"

  - id: "execution-transition-and-operating-risk"
    title: "Execution Transition and Operating Risk"
    body: >-
      Revenue quality is exposed to the transition away from payment for order
      flow. Wikipedia says PFOF represented about one third of revenue when Trade
      Republic obtained its banking licence and had fallen below 30% by January
      2026; it also reports that a subsidiary obtained a BaFin licence to operate
      a multilateral trading facility. Curvo describes a July 2026 model with
      €1 Best Price internal execution and €2 Direct Price exchange routing, but
      this competitor-authored comparison is not an independent benchmark.
      Curvo and Banker on Wheels both flag spread or execution-transparency
      concerns. Customer reviews add anecdotal support-cost and service-friction
      signals, but they do not quantify staffing expense, churn, or lost trading
      volume. Underwriting therefore requires actual post-ban order economics,
      venue mix, execution-quality reporting, and support-cost cohorts.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"

  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      Public traction is substantial but not a substitute for balance-sheet
      evidence. Banker on Wheels reports more than 10 million customers and over
      €150 billion of client assets, metrics that describe platform scale rather
      than company revenue, cash, or regulatory capital. EquityZen explains that
      its Trade Republic pre-IPO exposure is sourced from existing shareholders
      through investment funds; this is secondary liquidity and should not be
      treated as primary funding or cash available to the company. None of the
      assigned evidence establishes current corporate cash, burn, runway,
      regulatory capital headroom, debt obligations, or planned uses of funds.
      The financial verdict is therefore cautiously positive on reported
      accounting profitability but blocked for valuation underwriting by
      revenue-mix opacity, unverified post-PFOF margins, absent cohort economics,
      and missing liquidity and capital schedules.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI014"

