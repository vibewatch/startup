          to: "manual-trades"
          label: "transaction activity"
        - from: "customer-activity"
          to: "banking-interest"
          label: "cash and banking use"
        - from: "manual-trades"
          to: "historical-pfof"
          label: "legacy routing economics"
        - from: "historical-pfof"
          to: "post-ban-execution"
          label: "regulatory transition"
    approximationNotes: "Qualitative mechanism map only; it does not imply revenue shares, conversion rates, gross profit, or comparable denominators."
