  topStrengths:
    - Mass retail scale with 10 million customers and €150 billion in assets under management.
    - Disclosed profitability plus a full ECB banking licence and expanding deposit-based monetization.
    - 'Strong brand simplicity: flat-fee trading, automated savings plans, and broad European distribution.'
  topRisks:
    - The June 2026 PFOF phase-out creates a major, still-unquantified revenue transition.
    - Private-company opacity limits independent verification of margins, capital structure, and cohort retention.
    - Support friction, depot-transfer delays, and execution complaints could pressure retention as competition rises.
  unresolvedGaps:
    - FY2024 and FY2025 audited IFRS consolidated financials remain unpublished in the assigned evidence set.
    - Post-PFOF MTF revenue-per-order economics and execution-quality reporting are still unquantified.
    - Cap table, liquidation preference stack, and employee option pool remain undisclosed.
    - Customer churn, retention cohorts, and repeat-deposit behavior are still not publicly verified.
    - Verified cash-flow, burn, runway, and debt schedules are still unavailable for independent underwriting.
