        title: Product Surface and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              The current official landing page exposes only a high-level product taxonomy—“Spend,” “Save,” and
              “Trust”—rather than detailed, fetched specifications for instruments, pricing, eligibility, or
              country-by-country functionality [CE001]. The support surface separately advertises 24/7 call and chat,
              but the assigned text does not disclose response-time commitments, escalation performance, or incident
              history [CE002]. The clearest workflow detail comes from the Android engineering disclosure: a native
