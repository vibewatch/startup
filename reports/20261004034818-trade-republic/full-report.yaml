      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frictionless Retail Onboarding and Massive Scale
            body: >-
              Trade Republic has established an unprecedented retail distribution moat in continental Europe, amassing
              over 10 million customer accounts and €150 billion in assets under management. By combining €1 flat-fee
              trading with automated free ETF savings plans and high-yield cash interest, the platform successfully
              activated millions of first-time investors previously excluded by incumbent bank fees.
            calloutType: strength
