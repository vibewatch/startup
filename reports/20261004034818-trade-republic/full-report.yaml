      - number: '5.4'
        title: Maturity, Reliability, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Mobile delivery evidence indicates real engineering maturity: the Android team reported material P90
              build-time reductions [CE008], 92% code coverage, more than 800 regression cases, and a UI-test workflow
              running in under 15 minutes [CE009]. Those are company-reported development metrics, however, and they do
              not establish production uptime or customer-facing defect rates. The assigned independent developer source
              provides the main caution: its first client version became unmaintained and broke after Trade Republic API
              changes [CE016]. That does not prove the official app or backend was unreliable; it shows that unofficial
              integrations face interface-change risk in the absence of a documented public contract. Underwriting
              should therefore distinguish internal development quality signals from externally verified reliability.
              Required diligence includes current migration status, service-level objectives, incident and recovery
              history, penetration-test or certification evidence, and a clear policy for third-party access.
