  - id: FO001
    title: Trade Republic Corporate and Product Evolution Timeline (2015-2026)
    type: timeline
    summary: >-
      Key corporate, financing, product, and regulatory milestones tracing Trade Republic from incubation to decacorn
      status and banking operations.
    approximationNotes: Milestones reflect primary press release dates, corporate filings, and regulatory approvals.
    data:
      items:
        - label: '2015: Corporate Incubation'
          date: '2015-01-01'
          description: >-
            Trade Republic is founded in Munich under the name Neon Trading within Comdirect Bank startup garage by
            Christian Hecker, Thomas Pischke, and Marco Cancellieri.
        - label: '2017: Strategic Seed Funding'
          date: '2017-07-01'
          description: Düsseldorf-based broker Sino AG acquires a majority stake with a €600,000 initial financing.
        - label: '2019: Public Brokerage Launch'
          date: '2019-05-01'
          description: Mobile app brokerage launches unrestricted trading in Germany following Series A round led by Creandum.
        - label: '2020: Series B Expansion'
          date: '2020-04-01'
          description: Accel and Founders Fund co-lead €62M Series B round to accelerate international expansion.
        - label: '2021: Meme Stock Disruption & Series C'
          date: '2021-05-20'
          description: Sequoia Capital leads $900M Series C at $5.3B valuation following GameStop retail trading disruptions.
        - label: '2022: European Rollout & Series C Extension'
          date: '2022-06-03'
          description: Ontario Teachers' Pension Plan leads €250M extension at €5B valuation; platform expands to 17 countries.
        - label: '2023: Full ECB Banking Licence'
          date: '2023-12-06'
          description: European Central Bank grants full banking licence; firm announces first profitable calendar year.
        - label: '2024: Visa Debit Card Launch'
          date: '2024-01-09'
          description: Reaches 4 million customers and €35B AUM; rolls out Visa card with 1% Saveback rewards.
        - label: '2025: Scale Milestones & €12.5B Valuation'
          date: '2025-12-22'
          description: Secures €12.5B valuation in €1.2B secondary share transaction; customer base reaches 10 million users.
        - label: '2026: BaFin MTF Trading Licence'
          date: '2026-01-30'
          description: Subsidiary obtains BaFin multilateral trading facility licence ahead of EU June 2026 PFOF prohibition.
