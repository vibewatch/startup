            body: >-
              Trade Republic combines visible transaction pricing with less transparent economics from trading
              execution, banking services, and interest income. Curvo reports a €1 transaction fee for stock and ETF
              purchases or sales, while both Curvo and Banker on Wheels describe recurring ETF savings-plan execution as
