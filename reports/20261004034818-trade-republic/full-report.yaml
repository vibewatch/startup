chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Licensing, and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Trade Republic Bank GmbH is a German digital bank and securities trading institution headquartered at
              Brunnenstraße 19-21 in Berlin, Germany. The company was originally conceived and founded in 2015 in Munich
              under the corporate name Neon Trading within the startup incubator of Comdirect Bank. Co-founders
              Christian Hecker, Thomas Pischke, and Marco Cancellieri set out to build an accessible, mobile-first
              investment platform offering commission-free trading in exchange-traded funds, equities, derivatives, and
              crypto assets. A key operational transformation occurred in December 2023 when the European Central Bank
              granted Trade Republic a full banking licence, supervised by BaFin and the Deutsche Bundesbank. This
              regulatory status enabled the firm to hold customer deposits directly, provide dedicated International
              Bank Account Numbers across European markets, roll out interest-bearing cash accounts, and issue a Visa
              debit card featuring Saveback rewards. By early 2025, Trade Republic had expanded operations to 17
              countries across Europe, including Germany, France, Spain, Italy, Austria, and Poland, reaching 8 million
              users by April 2025 and subsequently surpassing 10 million users managing over €100 billion in customer
              assets.
