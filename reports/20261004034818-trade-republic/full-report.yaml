      - number: '1.3'
        title: Financing History, Secondary Liquidity, and Stakeholder Alignment
        blocks:
          - type: paragraph
            body: >-
              Trade Republic has raised over $1.3 billion in cumulative primary equity financing across multiple
              institutional investment rounds since its initial seed backing. Following an early €600,000 capital
              infusion in 2017 and a majority investment from Düsseldorf-based broker Sino AG, the company completed a
              €62 million Series B round in April 2020 co-led by Accel and Founders Fund. In May 2021, Sequoia Capital
              led a landmark $900 million Series C financing valuing the company at $5.3 billion, which was subsequently
              supplemented in June 2022 by a €250 million Series C extension led by Ontario Teachers' Pension Plan Board
              at a €5.0 billion ($5.0 billion) post-money valuation. In December 2025, Trade Republic concluded a
              massive €1.2 billion secondary share transaction that valued the company at €12.5 billion. While providing
              significant liquidity to early venture investors and employees, the secondary transaction did not
              introduce new primary cash to the company's balance sheet, leaving capitalization and future capital
              expenditures reliant on accumulated retained earnings and existing balance sheet liquidity.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
