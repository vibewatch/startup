          - type: callout
            title: Customer Service Deficits and Retention Opacity
            body: >-
              Behind headline customer acquisition figures lies severe operational friction in retail customer support
              and transfer processing. Complaints logged by German consumer authorities rose 75 percent year-over-year,
              driven by automated chatbot dead-ends, frozen balances, and blocked depot transfers. Crucially, Trade
              Republic publishes no cohort retention or MAU data, leaving long-term account stickiness unverified.
            calloutType: risk
            claimRefs:
              - CU010
