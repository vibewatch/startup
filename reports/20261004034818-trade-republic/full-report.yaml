              not disclose each stream's contribution. That missing mix matters because headline fees are not the same
              as realized revenue: spread capture, customer cash balances, trading frequency, and the proportion of free
              savings-plan activity determine revenue per customer. The prefetched official pricing page did not expose
              fee line items, so the third-party pricing evidence should be reconciled to management contracts and
              actual customer cohorts.
