      - number: '1.2'
        title: Leadership Architecture, Executive Governance, and Key Persons
        blocks:
          - type: paragraph
            body: >-
              The executive leadership and organizational governance of Trade Republic combine startup founder
              stewardship with institutional banking administration. Chief Executive Officer Christian Hecker, who
              co-founded the firm after an initial background in investment banking, leads the company's executive
              strategy, public markets interface, and product vision. Co-founders Thomas Pischke and Marco Cancellieri
              originally engineered the company's proprietary core trading technology, operational workflows, and mobile
              application infrastructure. To satisfy BaFin and European Central Bank regulatory standards for credit
              institutions, Trade Republic established a formal dual-leadership and managing directorship structure
              incorporating seasoned banking executives Andreas Torner and Gernot Mittendorfer alongside the founders.
              Despite this institutional oversight, strategic decision-making and external capital relations remain
              heavily concentrated in CEO Christian Hecker, creating a distinct key-person dependency as the bank
              navigates complex pan-European regulatory scrutiny, customer service scalability demands, and cross-border
              expansion into markets like Poland, France, and Italy.
            claimRefs:
