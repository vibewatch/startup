        title: Execution Transition and Operating Risk
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is exposed to the transition away from payment for order flow. Wikipedia says PFOF
              represented about one third of revenue when Trade Republic obtained its banking licence and had fallen
              below 30% by January 2026; it also reports that a subsidiary obtained a BaFin licence to operate a
              multilateral trading facility. Curvo describes a July 2026 model with €1 Best Price internal execution and
              €2 Direct Price exchange routing, but this competitor-authored comparison is not an independent benchmark.
              Curvo and Banker on Wheels both flag spread or execution-transparency concerns. Customer reviews add
              anecdotal support-cost and service-friction signals, but they do not quantify staffing expense, churn, or
              lost trading volume. Underwriting therefore requires actual post-ban order economics, venue mix,
              execution-quality reporting, and support-cost cohorts.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Public traction is substantial but not a substitute for balance-sheet evidence. Banker on Wheels reports
              more than 10 million customers and over €150 billion of client assets, metrics that describe platform
              scale rather than company revenue, cash, or regulatory capital. EquityZen explains that its Trade Republic
              pre-IPO exposure is sourced from existing shareholders through investment funds; this is secondary
              liquidity and should not be treated as primary funding or cash available to the company. None of the
              assigned evidence establishes current corporate cash, burn, runway, regulatory capital headroom, debt
              obligations, or planned uses of funds. The financial verdict is therefore cautiously positive on reported
              accounting profitability but blocked for valuation underwriting by revenue-mix opacity, unverified
              post-PFOF margins, absent cohort economics, and missing liquidity and capital schedules.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-PFOF revenue quality is unverified
            body: >-
              The available sources describe the regulatory and routing transition but do not disclose realized post-ban
              revenue per order, spread capture, execution quality, or balance-sheet capital consumed by the new model.
            calloutType: risk
            claimRefs:
