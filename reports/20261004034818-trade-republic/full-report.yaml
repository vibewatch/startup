            body: >-
              Trade Republic’s 2025 Android review describes a native Kotlin application using Gradle multi-module
              builds, Jetpack ViewModel-based MVVM, Retrofit REST calls, Scarlet WebSockets, Anvil dependency injection,
              and Jetpack Compose [CE006]. That is concrete evidence of a substantial client codebase, not merely a
