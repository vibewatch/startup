      - number: '5.3'
        title: Backend, Data, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The most detailed backend evidence is split between a co-presented AWS conference deck and
              company-authored recruiting material. The deck reports 620 TB of lakehouse storage, 30 TB of monthly
              storage growth, two million monthly queries, and 220 replicated databases plus streaming sources [CE010].
              Its architecture uses Debezium and Kafka for ingestion, with S3, Apache Iceberg, AWS Glue, EMR, Athena,
              Snowflake, Spark, Airflow, and dbt across storage, catalog, compute, and orchestration layers [CE011]. A
              product-monitoring case describes movement from daily updates to intraday insights without bespoke
              application code [CE012]. Recruiting text adds JVM services on AWS and a GitHub/Buildkite/container
              delivery path [CE013], while other reposted company roles name Kubernetes, Kafka, Kinesis, RDS, Cassandra,
              SLO monitoring, and security-control work [CE014]. These disclosures demonstrate technical breadth, but
