      - number: '2.2'
        title: Addressable Market Sizing and Adoption Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable scale of European retail wealth requires multi-layered sizing lenses that
              distinguish total household financial assets from serviceable self-directed digital brokerage volumes.
              Across the European Union and eurozone economies, household financial wealth exceeds tens of trillions of
              euros, but historical capital market participation has lagged behind United States benchmarks due to
              reliance on state pension safety nets and risk-averse deposit cultures. For example, in southern European
              markets like Greece, official central bank figures indicate that 58% of household financial assets remain
              parked in cash deposits yielding an average interest rate of merely 0.03% annually.


              The Serviceable Addressable Market (SAM) is defined by the population of digitally enabled European retail
              consumers across the 18 active European jurisdictions where Trade Republic holds passported banking or
              branch infrastructure, encompassing Germany, France, Italy, Spain, the Netherlands, Austria, Poland, and
              the Baltics. Within this perimeter, approximately 100 million retail savers represent potential
              self-directed wealth accumulators. Trade Republic's Serviceable Obtainable Market (SOM) is evidenced by
              its verified scale of 10 million registered customers and €150 billion in assets under management (AUM)
              reached by late 2025, up from 4 million customers and €35 billion AUM in early 2024. This trajectory
              reflects an average account balance expanding toward €15,000, driven by automated monthly ETF accumulation
              and cash deposit yields.
