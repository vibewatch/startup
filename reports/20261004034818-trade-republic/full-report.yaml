          - type: callout
            title: Treat reported profit as a signal, not a cash-flow conclusion
            body: >-
              Proceed only after reconciling the fiscal period to a primary filing and obtaining revenue mix, cash flow,
              regulatory-capital headroom, CAC, retention, and debt schedules.
            calloutType: recommendation
            claimRefs:
