evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-ownership
    missingEvidence: Audited equity ownership cap table detailing percentage ownership and preference shares.
    whyItMatters: Without an exact cap table, full waterfall returns and governance control cannot be modeled.
    diligencePath: Obtain certified shareholder register from Commercial Register (Handelsregister) or management disclosure.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pfof-revenue-transition
    missingEvidence: >-
      Actual post-PFOF order routing economics, multilateral trading facility (MTF) fee schedules, and market-maker
      spread sharing data.
    whyItMatters: >-
      Payment for order flow previously accounted for nearly 30% of broker revenue; the financial viability of flat €1
      trading depends on replacement revenue under the MTF architecture.
    diligencePath: >-
      Inspect Trade Republic BaFin MTF rulebook filings, Bundesanzeiger disclosures, and partner market-maker clearing
      statements.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Fully loaded customer acquisition cost, payback period, sales or onboarding cycle, channel economics, and
      retention by country and cohort.
    whyItMatters: >-
      Without cohort contribution economics, customer and asset growth cannot be translated into sustainable lifetime
      value.
    diligencePath: >-
      Request monthly country-by-channel cohorts covering acquisition spend, funded accounts, assets, trading activity,
      gross contribution, retention, and payback.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: primary-financial-statements
    missingEvidence: >-
      A retained primary filing that confirms the reporting period, accounting perimeter, revenue recognition, profit,
      cash flow, and balance sheet.
    whyItMatters: >-
      The assigned secondary sources use 2023/24 and 2024 labels for the same reported profit amount, and accounting
      profit does not establish cash generation.
    diligencePath: Obtain the relevant filed annual accounts and audit opinion, then reconcile every reported amount and period.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: post-pfof-unit-economics
    missingEvidence: >-
      Post-ban revenue per order, realized spread capture, execution-quality statistics, route mix, and capital required
      by the MTF model.
    whyItMatters: >-
      These inputs determine whether the replacement execution model preserves revenue quality without increasing
      customer or balance-sheet risk.
    diligencePath: Request pre/post-ban monthly order economics by venue, product, customer cohort, and execution route.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current corporate cash, operating cash flow, burn or cash generation, runway, regulatory-capital headroom, debt
      obligations, and planned uses of funds.
    whyItMatters: >-
      Funding history, secondary share liquidity, and customer assets do not establish cash available to finance the
      company.
    diligencePath: >-
      Review current management accounts, liquidity forecasts, regulatory-capital returns, debt agreements, and
      board-approved financing plans.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: >-
      Current service-level objectives, uptime history, severity-classified incidents, recovery time, recovery point,
      and peak-load test results.
    whyItMatters: >-
      Development metrics and architecture diagrams do not establish customer-facing availability or resilience under
      trading and banking load.
    diligencePath: >-
      Request the trailing 24 months of SLO reports, incident postmortems, disaster-recovery tests, and peak-event
      capacity results.
    relatedQuestionRefs:
      - QE004
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security-and-compliance-controls
    missingEvidence: >-
      Control design and operating-effectiveness evidence for identity, encryption, secure development, vulnerability
      management, penetration testing, and third-party assurance.
    whyItMatters: Job descriptions evidence intended responsibilities but cannot verify that controls are implemented or effective.
    diligencePath: >-
      Request current audit reports, certification scope, penetration-test executive summaries, remediation tracking,
      and security-governance documentation.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: stale
    severity: material
    topic: mobile-roadmap
    missingEvidence: >-
      Current completion status and production outcomes for the Coroutines Flow, Kotlin Serialization, and Ktor
      migrations disclosed in March 2025.
    whyItMatters: >-
      The published target architecture contains unresolved migrations whose completion, risk, and customer impact
      cannot be inferred.
    diligencePath: >-
      Request the current Android architecture roadmap, migration completion metrics, defect trends, and release-quality
      dashboards.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: supported-developer-surface
    missingEvidence: >-
      Official API documentation, interface-versioning policy, approved third-party access model, and deprecation
      commitments.
    whyItMatters: The only assigned external developer evidence describes an unofficial client that broke after API changes.
    diligencePath: >-
      Request API governance documentation and confirm whether regulated or commercial partners receive supported
      interfaces unavailable publicly.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: Customer cohort retention and monthly active users
    missingEvidence: >-
      Audited monthly active user (MAU) metrics, user cohort retention curves, and annual account churn rates across
      European operating markets.
    whyItMatters: >-
      Without cohort retention and activity rates, customer durability cannot be distinguished from acquisition volume
      driven by high marketing spend and cash interest promotions.
    diligencePath: >-
      Request verified internal management reporting showing 12-month and 24-month account activity cohorts and deposit
      retention during confidential investor diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: >-
      Comprehensive audit of all commercial advertising counterparties and institutional platform partners beyond
      published case studies.
    whyItMatters: >-
      Public case study proof is limited to select growth marketing vendors, leaving channel partner concentration
      unverified.
    diligencePath: Review vendor contracts and commercial marketing service level agreements during management Q&A.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: >-
      Audited IFRS consolidated financial statements for FY2024 and FY2025 to verify net profit margins, interest income
      breakdown, and cost structures.
    whyItMatters: >-
      Without audited financial statements, valuation multiples rely on press releases and regulatory leaks rather than
      audited GAAP/IFRS figures.
    diligencePath: >-
      Inspect forthcoming Bundesanzeiger regulatory filings or request audited management accounts from Trade Republic
      investor relations.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: MTF unit economics
    missingEvidence: >-
      Empirical revenue per executed trade under the newly BaFin-licensed multilateral trading facility compared to
      legacy PFOF rebates.
    whyItMatters: >-
      PFOF historically generated ~30% of revenue; if the MTF cannot replace this gross profit, future earnings will
      suffer significant compression.
    diligencePath: >-
      Obtain broker fee schedules, exchange rebate disclosures, and execution venue volume filings post-June 2026
      transition.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV002
