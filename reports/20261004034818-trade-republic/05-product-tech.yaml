company:
  name: "Trade Republic"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Trade Republic discloses a mature native Android client, formal architecture governance, and a sizeable AWS-centered analytics platform, but most evidence is company-issued or partner-presented. The strongest external developer signal highlights a closed, change-prone interface surface, while public evidence remains insufficient to verify production service levels, security controls, or the current completion status of disclosed migrations."
sections:
  - id: "product-surface-and-workflows"
    title: "Product Surface and Customer Workflows"
    body: |-
      The current official landing page exposes only a high-level product taxonomy—“Spend,” “Save,” and “Trust”—rather than detailed, fetched specifications for instruments, pricing, eligibility, or country-by-country functionality [CE001]. The support surface separately advertises 24/7 call and chat, but the assigned text does not disclose response-time commitments, escalation performance, or incident history [CE002]. The clearest workflow detail comes from the Android engineering disclosure: a native client connects to backend services through REST and WebSocket interfaces, supporting ordinary requests and live price delivery [CE006]. An independent open-source portfolio downloader also says Trade Republic lacks a comprehensive view of sold-asset analytics, showing a user workflow that remains dependent on an unofficial tool rather than a documented developer product [CE015]. This evidence supports the existence of a broad consumer app, but not a complete SKU inventory or verified end-to-end service quality.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE015"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs: []
  - id: "mobile-engineering-and-governance"
    title: "Mobile Engineering and Architecture Governance"
    body: |-
      Trade Republic’s 2025 Android review describes a native Kotlin application using Gradle multi-module builds, Jetpack ViewModel-based MVVM, Retrofit REST calls, Scarlet WebSockets, Anvil dependency injection, and Jetpack Compose [CE006]. That is concrete evidence of a substantial client codebase, not merely a marketing claim. The same disclosure records migrations from RxJava2 to Coroutines Flow, GSON to Kotlin Serialization, and Scarlet to Ktor; these modernization programs improve the target architecture but also identify unresolved technical debt as of publication [CE007]. Engineering process is comparatively explicit: a roughly 280-person product-technology organization was organized by business domain, while architectural decisions used RFCs or ADRs, reviews, and a Tech Radar integrated into Backstage [CE003, CE004, CE005]. This governance model provides a repeatable path from assessment to adoption or deprecation, although the source says the radar process is a recommendation rather than a mandatory control.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs: []
    figureRefs:
      - "FE001"
  - id: "backend-data-and-operating-model"
    title: "Backend, Data, and Operating Model"
    body: |-
      The most detailed backend evidence is split between a co-presented AWS conference deck and company-authored recruiting material. The deck reports 620 TB of lakehouse storage, 30 TB of monthly storage growth, two million monthly queries, and 220 replicated databases plus streaming sources [CE010]. Its architecture uses Debezium and Kafka for ingestion, with S3, Apache Iceberg, AWS Glue, EMR, Athena, Snowflake, Spark, Airflow, and dbt across storage, catalog, compute, and orchestration layers [CE011]. A product-monitoring case describes movement from daily updates to intraday insights without bespoke application code [CE012]. Recruiting text adds JVM services on AWS and a GitHub/Buildkite/container delivery path [CE013], while other reposted company roles name Kubernetes, Kafka, Kinesis, RDS, Cassandra, SLO monitoring, and security-control work [CE014]. These disclosures demonstrate technical breadth, but they do not independently verify capacity, availability, recovery objectives, or control effectiveness.
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs: []
  - id: "maturity-reliability-and-diligence"
    title: "Maturity, Reliability, and Diligence Priorities"
    body: |-
      Mobile delivery evidence indicates real engineering maturity: the Android team reported material P90 build-time reductions [CE008], 92% code coverage, more than 800 regression cases, and a UI-test workflow running in under 15 minutes [CE009]. Those are company-reported development metrics, however, and they do not establish production uptime or customer-facing defect rates. The assigned independent developer source provides the main caution: its first client version became unmaintained and broke after Trade Republic API changes [CE016]. That does not prove the official app or backend was unreliable; it shows that unofficial integrations face interface-change risk in the absence of a documented public contract. Underwriting should therefore distinguish internal development quality signals from externally verified reliability. Required diligence includes current migration status, service-level objectives, incident and recovery history, penetration-test or certification evidence, and a clear policy for third-party access.
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE016"
    tableRefs: []
    figureRefs: []
