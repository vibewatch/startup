    Trade Republic Bank GmbH is a Berlin-based digital bank and neobroker founded in 2015 that now combines
    commission-lite brokerage, automated savings plans, cash-interest banking, and debit-card spend features for a large
    European retail base. The company has surpassed 10 million customers, reported over €150 billion in assets under
    management, and has disclosed profitability, but private-company opacity still leaves valuation, cohort retention,
    and post-PFOF economics only partially verifiable.
