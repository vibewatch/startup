summary:
  headline: >-
    Trade Republic is a large, profitable European neobroker-bank with 10 million customers and €150 billion in assets,
    but the June 2026 PFOF transition, private-company opacity, and a stretched secondary valuation keep the stock at
    track rather than buy.
