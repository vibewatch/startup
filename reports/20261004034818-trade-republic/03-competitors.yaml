      - - Scalable Capital
        - Direct Neobroker / Robo-Advisor
        - Series E; >€10B AUM; major European presence
        - Hybrid retail investors & passive wealth accumulators
        - Prime+ subscription model with flat trading & robo-advisory integration
        - Subscription fee required for zero-commission trading; narrower pan-EU banking features
      - - DEGIRO (flatexDEGIRO)
        - Incumbent Discount Broker
        - Publicly listed (flatexDEGIRO AG); millions of accounts across Europe
        - Active traders & cost-conscious equity investors
        - Extensive global exchange access, established European brand, deep product range
        - Legacy interface, complex tiered fee schedules, limited integrated banking services
      - - Interactive Brokers
        - Global Multi-Asset Broker
        - 'Publicly listed (NASDAQ: IBKR); >$400B client equity globally'
        - Sophisticated traders, institutions & active wealth managers
        - Global market breadth across 150+ markets, professional margin & options tools
        - Complex desktop interface (TWS), steep learning curve, less tailored for passive retail savers
      - - Robinhood
        - International Neobroker
        - 'Publicly listed (NASDAQ: HOOD); major US retail base'
        - Young mobile-first retail stock and crypto traders
        - Pioneer in mobile UI/UX, commission-free options and crypto ecosystem
        - Limited European footprint, regulatory constraints in EU expansion, late entry in Continental EU
    notes: Comparative profile data compiled from company disclosures, Wikipedia, Forge Global, and FinTech Weekly reporting as of 2025-2026.
