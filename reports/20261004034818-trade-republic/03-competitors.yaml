callouts:
  - calloutType: risk
    title: 'Regulatory Cliff: The June 2026 European Union PFOF Prohibition'
    body: Trade Republic's core brokerage monetization model faces a direct regulatory transition as the European Union's revised MiFIR Article 39a takes effect, ending Germany's temporary exemption from the ban on payment for order flow on June 30, 2026. While Trade Republic has reduced PFOF from one-third to under 30% of revenues and secured a BaFin Multilateral Trading Facility licence in January 2026 to internalize order matching, execution economics under the post-PFOF regime remain unproven.
    claimRefs:
      - CP004
      - CP013
      - CP014
  - calloutType: insight
    title: Customer Support Friction and Operational Bottlenecks
    body: Independent customer reviews on Trustpilot and regulatory complaints filed with German consumer protection bodies highlight that Trade Republic's aggressive automated scaling has strained operational support. Deprecated telephone lines, reliance on automated AI chatbots, and backlogs in depot transfers and dividend processing create customer friction that could impair retention and drive multi-homing investors toward responsive rivals.
    claimRefs:
      - CP006
      - CP011
      - CP015
