callouts:
  - calloutType: risk
    title: "PFOF Revenue Elimination Shifts Monetization to In-House MTF and Interest Margins"
    body: "The expiration of Germany's PFOF exemption on 30 June 2026 eliminated traditional venue kickback rebates that historically represented over 30% of Trade Republic's net revenue. While the transition to an in-house multilateral trading facility under BaFin oversight preserves transaction fees via €1 Best Price and €2 Direct Price models, retail trading velocity may soften if market volatility recedes or competitors compress pricing."
    claimRefs:
      - CR002
      - CR003
  - calloutType: insight
    title: "Customer Support Bottlenecks Represent the Most Acute Consumer Governance Friction"
    body: "Rapid retail scaling to 10 million accounts without proportionate investment in human-assisted customer support has resulted in mounting consumer protection scrutiny and severe customer dissatisfaction. The reliance on AI chatbot responses for complex account lockouts, tax discrepancies, and securities transfers poses a material threat to user retention and regulatory standing under BaFin's consumer protection mandate."
    claimRefs:
      - CR007
      - CR008
