  title: "Risks"
  summary: "Trade Republic faces structural regulatory, operational, partner, and financial risks as it transitions from a low-cost neobroker to a full-scale deposit-taking bank and in-house trading venue under strict BaFin and ECB supervision."
sections:
  - id: regulatory-legal-risk
    title: "Regulatory and Legal Risk: Licence Compliance, PFOF Transition, and Consumer Scrutiny"
    body: "Trade Republic operates under full credit-institution supervision by BaFin and the Deutsche Bundesbank, holding an ECB banking licence granted in December 2023 and an MTF operating licence granted in January 2026. The regulatory environment imposes severe compliance, anti-money laundering, and capital obligations across 18 European markets. The European Union ban on payment for order flow (PFOF) came into full effect following the expiration of the German national exemption on 30 June 2026, forcing Trade Republic to replace third-party rebate agreements with its proprietary in-house execution framework and multilateral trading facility. Under this revised regime, standard Best Price execution charges a €1 settlement fee while direct routing incurs a €2 per-order charge, exposing trading margins to competitive volume pressure. Concurrently, consumer protection authorities have targeted the platform's commercial representations: Verbraucherzentrale Baden-Württemberg initiated legal proceedings in February 2025 alleging misleading advertising concerning cash interest and deposit protection scopes, and earlier promotional free-share campaigns were curtailed via a cease-and-desist undertaking with Verbraucherzentrale Hamburg. BaFin also reviewed over 4,000 retail complaints resulting from trading restrictions imposed during extreme market volatility, demonstrating ongoing supervisory sensitivity to retail execution controls."
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
    tableRefs:
      - TR001
  - id: operational-security-risk
    title: "Operational, Infrastructure, and Customer Support Vulnerabilities"
    body: "The platform's rapid expansion to 10 million customers across 18 European jurisdictions has introduced operational bottlenecks and platform stability risks during market stress events. Technical glitches caused trading disruptions during severe equity sell-offs in April 2025, echoing platform outages and trade restrictions seen during high-volatility events such as the January 2021 meme stock rally. Operational infrastructure migrations have also triggered backend accounting errors, including dividend distribution delays in mid-2024 and erroneous tax withholding debits on retail accounts exceeding thousands of euros following corporate stock splits in late 2025. Customer service capabilities have faced acute strain, with consumer protection bodies recording a 75% year-on-year increase in user complaints through late 2025 citing unassisted chatbot responses, absence of phone support, and prolonged delays in executing outbound securities depot transfers. While Trade Republic deploys two-factor authentication, encrypted communications, and fraud monitoring, operational stability and support bandwidth remain critical residual exposures."
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: partner-counterparty-risk
    title: "Partner, Custody, and Financial Counterparty Dependencies"
    body: "Despite holding its own banking licence, Trade Republic maintains critical counterparty relationships for deposit safeguarding, securities clearing, and asset custody. Customer cash deposits held under omnibus trust accounts are distributed across partner credit institutions including Solaris SE, Deutsche Bank AG, J.P. Morgan SE, and Citibank Europe plc, subjecting customer cash balances to the operational standing and solvency of these banking partners. In addition, balances allocated to money market funds operate outside statutory deposit insurance schemes such as the EdB, relying on asset segregation safeguards. Securities custody is conducted in partnership with HSBC Germany and deposited with central securities depositories including Clearstream Banking in Frankfurt, while cryptocurrency custody depends on third-party custodian BitGo Europe GmbH for offline cold-storage management. In derivatives, Trade Republic acts purely as an introducing broker for structured product issuers Société Générale, HSBC, and Vontobel. Disruption or credit deterioration at any of these primary institutional partners directly impacts Trade Republic's service availability, client asset accessibility, and execution integrity."
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR003
