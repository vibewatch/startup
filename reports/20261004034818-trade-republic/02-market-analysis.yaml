callouts:
  - calloutType: "risk"
    title: "Regulatory Disruption: The 2026 PFOF Phase-Out Cliff"
    body: "The European Union's statutory ban on payment for order flow removes a foundational pillar of discount brokerage unit economics. With Germany's national exemption terminating on 30 June 2026, Trade Republic must transition from third-party exchange rebates (previously accounting for over 30% of revenue) to alternative monetization architectures, including its licensed Multilateral Trading Facility (MTF) and net interest margin."
    claimRefs:
      - "CM001"
      - "CM015"
      - "CM016"
  - calloutType: "insight"
    title: "Deposit Intermediation as a Sticky Customer Moat"
    body: "By securing a full ECB banking licence and passing through ECB deposit interest alongside debit card Saveback rewards, Trade Republic transforms episodic trading accounts into continuous salary and savings deposits, structurally expanding client assets from €35B to €150B within two years."
    claimRefs:
      - "CM003"
      - "CM008"
      - "CM010"
