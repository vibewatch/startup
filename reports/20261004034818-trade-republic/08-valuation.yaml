        - "€350M–€450M net revenue; multiple contracts to 12x–16x P/S, driving valuation down to €5.5B–€7.5B (down-round mark)."
        - "BaFin supervisory enforcement on depot transfer backlogs; persistent negative consumer sentiment."
        - "25% (heightened regulatory execution risk)"
