callouts:
  - calloutType: "recommendation"
    title: "Prudent Entry Discipline on Secondary Shares"
    body: "While Trade Republic has demonstrated exceptional customer acquisition velocity and balance sheet scale across Europe, the €12.5 billion secondary pricing sets a demanding hurdle that requires near-flawless execution through the June 2026 PFOF transition. Prospective investors in pre-IPO secondary vehicles should demand a minimum 25% to 35% liquidity discount below the €12.5 billion headline mark until audited post-ban MTF operating margins are disclosed."
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV011"
      - "CV012"
      - "CV016"

  - calloutType: "risk"
    title: "The June 2026 PFOF Structural Revenue Test"
    body: "Payment for order flow has provided zero-commission neobrokers with guaranteed, high-margin transaction subsidies. Germany's temporary exemption expires on June 30, 2026, forcing Trade Republic to migrate equity trading to its newly licensed multilateral trading facility. If execution rebates cannot be fully recouped from exchange spreads or customer order fees, gross profitability will compress materially."
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV013"
      - "CV016"

