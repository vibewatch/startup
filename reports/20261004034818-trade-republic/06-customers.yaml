          touchpoints: "Mobile app registration via paid growth channels (e.g. Moloco) and refer-a-friend"
          detail: "Account verification and identity check completed within 10 minutes (5-figure launch scaling to 10M+ users)"
        - label: "Cash Deposit & Yield Activation"
          touchpoints: "Individual IBAN assignment under full ECB banking licence"
          detail: "Deposit uninvested funds to earn competitive cash interest; over €150B customer assets attracted"
        - label: "First Investment & Savings Setup"
          touchpoints: "Commission-free automated ETF or fractional share savings plan"
          detail: "Automate recurring investments from as little as €1 per month; >33% of users are first-time investors"
        - label: "Transaction Expansion & Active Trading"
          touchpoints: "Low-cost €1 flat settlement fee across 6,500+ equities and bonds"
          detail: "Self-directed trading in single stocks, derivatives, and crypto across 17 European countries"
        - label: "Spend & Saveback Loop"
          touchpoints: "Trade Republic Visa debit card with Saveback and Roundup features"
          detail: "Earn 1% cashback invested directly into chosen asset plus spare-change roundups"
        - label: "Retention or Support Friction"
          touchpoints: "In-app automated support chatbot and depot transfer interfaces"
          detail: "Resolution of account limits or outbound transfers; 350 formal vzbv complaints"
