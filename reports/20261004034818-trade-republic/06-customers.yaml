callouts:
  - calloutType: strength
    title: "Frictionless Retail Onboarding and Massive Scale"
    body: "Trade Republic has established an unprecedented retail distribution moat in continental Europe, amassing over 10 million customer accounts and €150 billion in assets under management. By combining €1 flat-fee trading with automated free ETF savings plans and high-yield cash interest, the platform successfully activated millions of first-time investors previously excluded by incumbent bank fees."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
      - "CU014"
  - calloutType: risk
    title: "Customer Service Deficits and Retention Opacity"
    body: "Behind headline customer acquisition figures lies severe operational friction in retail customer support and transfer processing. Complaints logged by German consumer authorities rose 75 percent year-over-year, driven by automated chatbot dead-ends, frozen balances, and blocked depot transfers. Crucially, Trade Republic publishes no cohort retention or MAU data, leaving long-term account stickiness unverified."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
