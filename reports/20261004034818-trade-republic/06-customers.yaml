company:
  name: "Trade Republic"
chapter:
  number: 6
  title: "Customers"
  summary: "Trade Republic reports over 10 million customers and €150 billion in assets under management across 17 European markets as of late 2025, driven by automated ETF savings plans, zero-commission equity trading, and high-yield cash accounts. However, customer stickiness remains unverified due to private cohort opacity, while consumer watchdog complaints surged 75 percent year-over-year over automated customer service failures and depot transfer obstacles."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Base Segmentation and Retail Demographics"
    body: "Trade Republic's customer base is anchored in European retail self-directed savers and first-time investors who were previously underserved or priced out by traditional private banks and brokerages. More than one third of early platform adopters had never previously purchased shares or invested in exchange-traded funds, highlighting the platform's core demographic appeal among younger retail savers. The customer portfolio spans novice passive accumulators utilizing automated fractional ETF savings plans, active self-directed traders generating high order volume in single equities and derivatives, and yield-focused depositors utilizing the ECB-licensed cash account. While historically concentrated in Germany, geographic expansion across 17 European jurisdictions and non-euro entry into Poland has diversified the regional retail customer footprint."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU008"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-aum-growth"
    title: "Adoption Trajectory and Assets Under Management Scale"
    body: "The platform's customer growth curve has accelerated dramatically across consecutive multi-year milestones since its closed beta launch in early 2019. Trade Republic scaled from five-figure user numbers in mid-2019 to 4 million accounts holding $38 billion in assets by mid-2022, representing an average client asset balance of approximately $10,000 per user. Platform disclosures indicate growth reached 8 million accounts and €100 billion in assets by April 2025, expanding further to exceed 10 million customers and €150 billion in assets under management by December 2025. This steep trajectory was significantly accelerated by the introduction of interest on uninvested cash in January 2023 and the receipt of a full ECB banking licence in December 2023, though definitions of customer count do not separate active monthly depositors from dormant registrations."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU002"
  - id: "acquisition-channels-and-customer-proof"
    title: "Acquisition Strategy and Named Customer Proof"
    body: "Customer acquisition for Trade Republic relies on aggressive performance marketing campaigns, mobile growth platforms, and word-of-mouth viral loops powered by cash interest and cashback incentives. Controlled incrementality studies executed with ad-tech partner Moloco demonstrated statistically significant install lift across core markets including Germany, France, and Spain, prompting Trade Republic to triple its advertising expenditure with the platform in a single operating quarter. Over 60,000 customer reviews on public platforms such as Trustpilot reflect widespread appreciation for low-cost trading, competitive cash yield, and seamless mobile onboarding. Nevertheless, retail customer feedback displays clear bifurcation, as high satisfaction with basic execution contrasts sharply with severe operational dissatisfaction when technical or administrative exceptions occur."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-churn-and-expansion-loops"
    title: "Retention Dynamics, Support Friction, and Expansion Loops"
    body: "Trade Republic expands user wallet share through a clear multi-product funnel that begins with high-yield uninvested cash and migrates users into automated recurring ETF plans and debit card Saveback rewards. Despite this expansion architecture, customer durability faces mounting headwinds from customer support bottlenecks and administrative frictions. The Verbraucherzentrale Bundesverband recorded 350 formal complaints regarding Trade Republic by October 2025, representing a 75 percent year-over-year increase driven by inaccessible customer service, AI-generated chat dead-ends, and protracted delays executing outbound securities depot transfers. Crucially, Trade Republic publishes no audited monthly active user metrics, net revenue retention figures, or multi-year cohort churn statistics, leaving underlying customer stickiness unproven during broader equity market downturns."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
