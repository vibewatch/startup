callouts:
  - calloutType: "risk"
    title: "Structural Margin Cliff: The 2026 European Union PFOF Ban"
    body: "Trade Republic's core financial model has historically derived over 30% of net revenues from payment for order flow rebates paid by market makers such as Lang & Schwarz. Under MiFIR Article 39a, all PFOF arrangements must cease across Germany by June 30, 2026. While the acquisition of a BaFin multilateral trading facility licence in January 2026 enables internalized market making, the net revenue per executed order under the new structure remains unproven, posing substantial risk to platform gross margins."
    claimRefs:
      - "CO003"
      - "CO013"

  - calloutType: "strength"
    title: "Deposit Franchise and ECB Interest Arbitrage"
    body: "Operating under a full European Central Bank licence granted in December 2023 has structurally transformed Trade Republic from a pure broker into a deposit-taking digital institution. The firm passed through high central bank interest rates to amass over €35 billion in fiduciary cash and customer deposits, fueling net profits of €34.8 million in FY2023/2024 and insulating the business against trading volume cyclicality."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"

