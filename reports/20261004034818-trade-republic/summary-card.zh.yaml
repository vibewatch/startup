  topStrengths:
    - 大众零售规模，拥有 1000 万客户和 €150B 资产管理规模。
    - 披露已实现盈利，持有完整 ECB 银行牌照，且基于存款的变现模式不断扩张。
    - 品牌简单明了：固定费用交易、自动化储蓄计划，以及广泛的欧洲分销网络。
  topRisks:
