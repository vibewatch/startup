    - 非上市公司不透明度限制了对利润率、资本结构和队列留存的独立验证。
    - 客服摩擦、转仓延迟以及订单执行投诉可能在竞争加剧时给留存带来压力。
  unresolvedGaps:
    - 审核分配的证据集中未发布 FY2024 与 FY2025 经审计 IFRS 合并财务数据。
    - PFOF 后的 MTF 每笔订单收入经济模型与执行质量报告仍未量化。
    - 股权结构表、清算优先权与优先股堆叠以及员工期权池仍未披露。
    - 客户流失、留存队列与重复存款行为仍未获公开验证。
    - 仍无法获得经过验证的现金流、烧钱速度、现金跑道和债务明细表以供独立投资判断。
