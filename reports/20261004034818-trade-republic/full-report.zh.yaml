      - number: '1.4'
        title: 监管逆风、运营韧性与市场架构
        blocks:
          - type: paragraph
            body: >-
              尽管客户规模快速膨胀，且 FY2023/2024 在 €315.6M 佣金收入下实现了 €34.8M 净利润，Trade Republic
              仍面临严峻的结构性与监管挑战。从历史模式看，公司的低佣散户经纪业务高度依赖做市商 Lang & Schwarz 提供的订单流返佣（PFOF）。根据欧盟修订的《金融工具市场法规》（MiFIR），PFOF
              将在欧洲全境遭到全面封杀，而德国享有的过渡豁免期将于 2026 年 6 月 30 日终止。为此，Trade Republic 于 2026 年 1 月取得 BaFin
              颁发的多边交易设施（MTF）运营牌照，试图将撮合执行基础设施内部化。与此同时，客服承载力与系统可靠性引来了更严格的监管注视：德国消费者保护组织已就存款利率及存款保障宣传发起诉讼与禁令警告；而在极端行情宕机、分红派息积压以及拆股后扣税出错等技术故障发生后，向
              BaFin 和德国联邦消费者保护组织联合会（vzbv）投诉的用户数量急剧上升。
            claimRefs:
              - CO003
              - CO005
              - CO013
              - CO015
              - CO016
      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 结构性毛利悬崖：2026 年欧盟 PFOF 禁令
            body: >-
              Trade Republic 历史核心财务模式中，净收入有超过 30% 来自 Lang & Schwarz 等做市商支付的订单流返佣（PFOF）。根据 MiFIR 第 39a 条规定，德国境内的所有 PFOF
              安排必须在 2026 年 6 月 30 日前彻底终止。虽然公司于 2026 年 1 月取得 BaFin
              颁发的多边交易设施（MTF）牌照以实现内部化做市撮合，但新模式下单均净收入能否跑通仍未经证实，对平台整体毛利率构成重大风险。
            calloutType: risk
            claimRefs:
              - CO003
              - CO013
          - type: callout
            title: 存款特许与欧洲央行利差套利
            body: >-
              2023 年 12 月拿下欧洲央行（ECB）全牌照后，Trade Republic 在组织形态上从纯券商升级为吸储型数字银行。公司将央行高利率让利给储户，借此聚拢了超过 €35B 的信托现金与客户存款，推动
              FY2023/2024 实现 €34.8M 净利润，平滑了交易量波动的周期性影响。
            calloutType: strength
            claimRefs:
              - CO004
