        title: 客群结构与散户画像
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 的客群底盘是欧洲个人自主储蓄者与初次入市投资者，这部分人群此前长期被传统私人银行和高门槛券商拒之门外。早期平台采纳者中，超过三分之一此前从未买过股票或投资过
              ETF，印证了该平台对年轻一代储蓄者的强大吸引力。其客户结构主要涵盖三部分：使用自动定投买入碎股 ETF
              的初级被动定投群体、在个股和衍生品上频繁下单的高频自主交易者，以及冲着欧洲央行牌照活期高息而来的纯储蓄储户。尽管早期用户高度集中在德国本土，但随着业务拓展至欧洲 17
              个辖区并进军非欧元区的波兰，零售客户的地域版图已大为分散。
            claimRefs:
              - CU001
              - CU005
              - CU008
