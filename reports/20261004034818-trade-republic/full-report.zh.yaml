      - number: '2.3'
        title: 客群分层、工作流与采纳经济模型
        blocks:
          - type: paragraph
            body: >-
              欧洲散户投资采纳路径可细分为三类客群，其生命周期价值（LTV）、交易活跃度与工作流需求截然不同。最大客群是长期被动定投（DCA）的财富积累者，多为初次入市的新手。该群体决策摩擦极低：平台提供按周、双周或按月执行的零手续费
              ETF 定投计划，最低仅需 €1 即可买入碎股。日常银行功能极大地强化了该群体的获客效率，包括挂钩欧洲央行存款利率的闲置资金利息，以及借记卡消费按 1% Saveback 返现至指定定投计划的奖励机制。


              第二类客群是高频投机交易者，在个股及场内杠杆衍生品上执行短期策略，交易品种包括汇丰（HSBC）、法国兴业银行（Société
              Générale）、瑞银（UBS）和冯托贝尔（Vontobel）等机构发行的权证、牛熊证与涡轮。虽然零费率模式下的被动定投用户几乎不贡献直接佣金，但活跃的衍生品与股票交易者以每笔 €1
              的固定结算费拉动了整体换手率。第三类客群是自主选股者，寻求以低费率配置欧洲与美国主要大盘蓝筹股。这部分用户绕开了传统银行高昂的收费门槛，但受困于 Trade Republic
              应用内缺失技术图表、回测工具或复杂订单路由，往往必须借力 ProRealTime 或 TradingView 等第三方行情软件完成选股。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
