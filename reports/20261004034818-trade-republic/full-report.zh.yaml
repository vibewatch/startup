  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与业务边界
        blocks:
          - type: paragraph
            body: >-
              Trade Republic
              的目标市场横跨欧洲散户投资平台、数字化自主券商与个人日常现金管理。核心基本盘是面向散户的自主投资，涵盖上市股票、交易型开放式指数基金（ETF）、碎股交易、主权与企业固收债券、加密资产以及场内衍生品。核心支出包含散户承担的执行佣金、交易所及交易场所直连成本、做市商返佣、托管费与外汇兑换费。相邻的可渗透品类则包括个人现金存款中介、支付卡刷卡手续费分成、自动定投服务以及散户流动性基金分销。


              在业务边界上，平台严格排除机构主经纪商业务、高接触私人财富顾问、全权委托资产管理以及机构高频交易撮合。现有替代方案包括传统欧洲零售银行网点（如 Sparkassen、Volksbanken、BNP Paribas
              和 Santander），这些机构以往单笔订单收取 €10 至 €25
              的最低起步佣金，并持续征收证券账户托管年费，交易摩擦极大；另一类替代品是存放在商业银行低息活期账户中的闲置资金，在通胀侵蚀下缩水而非进入资本市场利滚利。相比之下，互联网券商拆解了订单路由链条，并彻底取消了显性托管费。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
