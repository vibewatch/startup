      - number: '7.2'
        title: 运营、基础设施与客户支持隐患
        blocks:
          - type: paragraph
            body: >-
              在欧洲 18 个司法管辖区快速吸纳 1000 万客户（10m）后，平台在极端市场行情下暴露出严重的运营瓶颈与稳定性隐患。2025 年 4 月股市剧烈抛售期间，技术故障导致交易中断，重演了 2021 年 1
              月散户抱团股（meme stock）狂潮期间出现的系统宕机与交易限制。基础设施重构也多次引发后端账务错误，例如 2024 年中期的股息分红延迟，以及 2025
              年底上市公司拆股后系统误扣个人账户数千欧元代扣税款。客服承载能力面临巨大压力，截至 2025 年底，消保机构记录的用户投诉量同比激增
              75%，主要控诉机器人客服无实质帮助、缺少人工电话渠道，以及向外转仓办理周期漫长。尽管 Trade Republic 部署了双重认证（2FA）、端到端加密与反欺诈监控，但系统稳定性和客服带宽仍是核心隐患。
