      - number: '1.2'
        title: 管理层架构、公司治理与关键人物
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 的高管架构与组织治理结合了初创团队主导与专业银行管理。联合创始人兼 CEO Christian Hecker 投行出身，全面统筹执行战略、公开市场对接与产品方向；另两位联合创始人
              Thomas Pischke 与 Marco Cancellieri 早期主导研发了底层自研交易技术、运营工作流以及移动端底层架构。为满足 BaFin 与欧洲央行对信贷机构的监管标准，Trade Republic
              建立了正式的双首长与董事总经理架构，引入资深银行高管 Andreas Torner 与 Gernot Mittendorfer 协同治理。但在体制化监督之外，核心战略决策与外部资本关系仍高度集中在
              Christian Hecker 一人手中，形成显著的关键人风险。尤其在当前，银行既要面对复杂的泛欧监管审查、客服承载力瓶颈，又要推进波兰、法国、意大利等跨国扩张，治理挑战更为突出。
            claimRefs:
              - CO002
              - CO007
              - CO008
              - CO015
