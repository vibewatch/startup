            body: >-
              Trade Republic 历经四轮融资，累计筹集约 $1.25B 一级市场风投资金：从 2019 年 €11.3M 的 A 轮起步，到 2021 年 5 月由 Sequoia Capital 领投
              $900M（投后估值 $5.3B）的 C 轮，再到 2022 年 6 月由 Ontario Teachers' Pension Plan 领投的 €250M 追加融资。2025 年 12 月，包括
