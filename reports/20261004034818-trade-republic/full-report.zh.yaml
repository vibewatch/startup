  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 的核心投资逻辑，建立在其确立泛欧领先数字储蓄与银行平台地位之上——公司在 18 个欧洲市场承接了史无前例的散户资金迁移潮。凭借完整的 ECB 银行牌照，公司累计吸纳逾 1,000
              万客户（10m），管理资产规模突破 €150B，将欧洲大陆公共养老金体系的人口结构压力转化为持久的获客动能。此外，Trade Republic 已连续三个财年实现盈利，在 FY2023/24 凭约 €340M
              营收录得 €34.8M 净利润，彻底拉开与长期亏损风投同业的差距。反向论点则指向三处尖锐的结构性隐患：首先，欧盟规定 2026 年 6 月 30 日前强制淘汰订单流回扣（PFOF），直接威胁此前占平台营收约
              30% 的核心佣金返佣来源；其次，运营与客服短板持续存在，消保投诉增加、转仓延误及市场波动时的订单执行故障印证了这一缺陷；最后，2025 年 12
              月老股转让折射出的极高估值倍数，在缺乏经审计公开证据的前提下，过早计入了向银行业务与多边交易设施（MTF）无缝切换的乐观预期。
