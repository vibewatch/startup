      - number: '5.2'
        title: 移动端工程与架构治理
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 2025 年的 Android 技术回顾披露，其原生 Kotlin 客户端采用了 Gradle 多模块构建体系、基于 Jetpack ViewModel 的 MVVM
              架构、Retrofit REST 请求、Scarlet WebSocket 框架、Anvil 依赖注入以及 Jetpack Compose 界面库
              [CE006]。这为客户端代码工程量提供了扎实佐证，而非单纯的营销主张。同一材料记录了从 RxJava2 向 Coroutines Flow、从 GSON 向 Kotlin Serialization、以及从
              Scarlet 向 Ktor 的多项技术迁移；这些现代化重构虽优化了目标架构，但也反映出截至发稿时仍有未结清的技术债务 [CE007]。工程协作流程相对清晰规范：约 280
              人的产研团队按业务领域划分，架构决策依托 RFC 或 ADR 机制、代码审查以及嵌入 Backstage 的 Tech Radar 技术雷达运转 [CE003, CE004,
              CE005]。这套治理机制为技术的评估、采纳或废弃提供了可复现的路径，不过资料注明该技术雷达仅为指导建议，并非强制管控手段。
