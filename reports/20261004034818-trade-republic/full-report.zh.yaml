            body: >-
              最详实的后端架构证据分布在一份联合发布的 AWS 大会演说材料和公司招聘材料中。大会材料披露，公司拥有 620 TB 的湖仓一体（lakehouse）存储，月度存储增量达 30 TB，月查询量 200 万次，维护
              220 个副本数据库及多路流式数据源 [CE010]。数据架构采用 Debezium 与 Kafka 负责数据采集，并在存储、元数据目录、计算与调度层全面应用了 S3、Apache Iceberg、AWS
