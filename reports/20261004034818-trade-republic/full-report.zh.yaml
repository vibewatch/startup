            title: 二级老股交易的审慎入场纪律
            body: >-
              尽管 Trade Republic 在欧洲展现出极高的获客增速与资产负债表规模，但 €12.5B 的二级老股定价设定了苛刻标准，要求其在 2026 年 6 月 PFOF
              过渡阶段必须做到执行毫无差错。在官方披露禁令落地后经审计的 MTF 经营利润率之前，拟参与 Pre-IPO 二级份额的投资者应在 €12.5B 标价基础上，要求至少 25% 至 35% 的流动性折价。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV011
              - CV012
              - CV016
          - type: callout
            title: 2026 年 6 月 PFOF 收入结构性大考
            body: >-
              订单流回扣（PFOF）曾为零佣金新型券商提供确定且高毛利的交易补贴。德国的临时豁免期将于 2026 年 6 月 30 日截止，倒逼 Trade Republic
              将股票交易全面迁移至新获批的多边交易设施（MTF）。一旦执行返佣无法通过交易所买卖价差或向客户收取订单手续费得到足额对冲，公司毛利空间将面临实质性压缩。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV013
              - CV016
