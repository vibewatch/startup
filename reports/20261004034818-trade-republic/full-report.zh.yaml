  - id: FP001
    title: 欧洲零售券商竞争定位图
    type: quadrant
    summary: 围绕银行与财富整合度（X 轴）及自主交易深度（Y 轴）对欧洲零售投资平台展开的序数定位映射。
    data:
      xAxis: 银行与日常财富整合度
      yAxis: 自主交易深度与产品广度
      points:
        - name: Trade Republic
          x: 0.85
          'y': 0.55
