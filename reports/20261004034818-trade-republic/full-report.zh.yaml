            body: >-
              官方网站首页当前仅展示宏观产品分类——“Spend”（消费）、“Save”（储蓄）与“Trust”（信任），未提供交易品种、定价细则、准入门槛或分国别功能的详细公开规范 [CE001]。客服页面宣称提供 24/7
              电话与聊天支持，但材料并未披露响应时长承诺、问题升级处理表现或历史故障记录 [CE002]。最明确的工作流细节来自 Android 研发披露：原生客户端通过 REST 与 WebSocket
              接口直连后端服务，分别承载常规请求与实时行情分发 [CE006]。此外，某独立开源持仓下载工具提到 Trade Republic
              缺少对已清仓资产的完整分析视图；用户工作流因此仍依赖非官方工具补位，而非成熟的官方开发者产品 [CE015]。上述证据证实平台具备面向大众的成熟 App，但无法推导出完整的 SKU 资产清单或端到端服务质量。
