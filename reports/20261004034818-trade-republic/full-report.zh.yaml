      - number: '4.2'
        title: 已披露盈利能力与成本结构
        blocks:
          - type: paragraph
            body: >-
              本次尽调材料中最新的财务数据均来自二手报道，而非留存的一手财报。维基百科记载，公司 2023/24 财年营业收入约 €340M（其中佣金收入 €316M），录得 €34.8M 年利润；Banker on
              Wheels 则单独指出其 2024 财年净利润约为 €34.8M。维基百科同时记录了一般行政开支 €225M，其中包含 €67M
              人事成本。上述指标仅代表账面会计盈利，并不代表真实的现金流创造能力，且在建模前必须对不同来源的时间区间口径进行调和。公开数据未披露毛利率、获客成本（CAC）、渠道支出、营运资金、资本开支或履约交付成本。因此，现有公开记录仅能支撑盈利的积极信号，尚不足以拼出完整的单客经济模型或现金流底表。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
