      - number: '4.3'
        title: 执行模式转型与经营风险
        blocks:
          - type: paragraph
            body: >-
              公司的收入质量面临告别 PFOF 转型的考验。维基百科指出，Trade Republic 获得银行牌照时，PFOF 约占其收入的三分之一，到 2026 年 1 月降至 30% 以下；同时披露其子公司取得了
              BaFin 颁发的多边交易设施运营牌照。Curvo 描述了 2026 年 7 月的收费模式，即 €1 的最优价（Best Price）内部撮合和 €2 的直接价（Direct
              Price）交易所路由，但该竞品视角的横向对比并非独立权威基准。Curvo 与 Banker on Wheels
              均指出了点差或撮合透明度隐患。用户评价提供了客服成本承压与服务摩擦的零散信号，但未量化人员薪酬支出、用户流失率或受损的交易量。因此，在评估该业务时，必须拿到禁令落地后的实际订单收益、交易场所结构、撮合质量报告以及各期客服成本数据。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 资本充足率与财务定论
        blocks:
          - type: paragraph
            body: >-
              公开披露的业务进展十分亮眼，但无法替代资产负债表的真金白银。Banker on Wheels 称其拥有超 1000 万客户和逾 €150B
              客户资产，这些数据仅能描摹平台体量，无法体现公司实际营业收入、账面现金或监管资本充足率。EquityZen 指出，其平台提供的 Trade Republic Pre-IPO
              份额来自老股东通过投资基金转让；这属于老股流动性，绝不能混同为公司的直接融资或账面可用资金。现有材料均未证明公司当前的账面现金余额、现金消耗率（burn
              rate）、跑道（runway）、监管资本缓冲空间、债务负担或资金使用规划。因此，在财务定论上：对其公布的会计账面盈利谨慎看好，但由于收入结构模糊、后 PFOF
              毛利未经证实、客群队列数据缺失且流动性与资本规划断档，暂无法为估值提供测算支撑。
            claimRefs:
