            body: >-
              自 2019 年初开启封闭内测以来，平台在数年间跨越多个里程碑，用户增长曲线呈现爆发式陡峭拉升。Trade Republic 的用户量从 2019 年中的五位数迅速攀升，到 2022 年中已拥有 400
              万个账户（4m）、掌管 $38B 资产，户均资产约为 $10,000。平台官方披露，到 2025 年 4 月账户数达到 800 万（8m）、管理资产 €100B；2025 年 12 月进一步突破 1000
              万客户（10m），资产管理规模超 €150B。2023 年 1 月推出的闲置资金计息功能以及 2023 年 12
              月获批的欧洲央行全银行牌照，极大催化了这一飞跃；不过，官方公布的客户数并未区分月度活跃储户与休眠注册账号。
