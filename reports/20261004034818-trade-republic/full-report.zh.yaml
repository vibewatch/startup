      - number: '2.2'
        title: 市场规模测算与渗透视角
        blocks:
          - type: paragraph
            body: >-
              评估欧洲散户财富的市场空间，需要多层测算视角，区分家庭金融总资产与真正可服务的数字化自主交易规模。在欧盟及欧元区经济体中，家庭金融资产总规模高达数十万亿欧元；但受制于国家养老金托底与风险厌恶的储蓄文化，欧洲历史上的资本市场参与度一直显著落后于美国水平。以希腊等南欧市场为例，央行官方数据显示，当地
              58% 的家庭金融资产仍趴在现金存款上，平均年化收益率仅 0.03%。


              可服务市场（SAM）由 Trade Republic 依托银行牌照通创通道或分支机构覆盖的 18
              个欧洲活跃辖区内的数字化零售客群构成，覆盖德国、法国、意大利、西班牙、荷兰、奥地利、波兰及波罗的海国家。在这一范围内，约 1
              亿个人储蓄者构成潜在的自主理财人群。公司可获取市场（SOM）的验证依据在于：其注册客户数从 2024 年初的 400 万（管理资产 €35B）跃升至 2025 年底的 1000 万，资产管理规模（AUM）达到
              €150B。在每月 ETF 自动定投积累和现金高息驱动下，用户平均账户余额逐步向 €15,000 靠近。
