  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：牌照合规、PFOF 转型与消费者审视
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 持有 2023 年 12 月获批的欧洲央行银行牌照与 2026 年 1 月获批的 MTF 运营牌照，受 BaFin 与德国联邦银行的全面信贷机构监管。该监管环境对横跨欧洲 18
              个市场的合规治理、反洗钱及资本储备提出了极为严苛的要求。随着德国国家豁免于 2026 年 6 月 30 日到期，欧盟针对订单流返佣（PFOF）的全面禁令正式生效，倒逼 Trade Republic
              用自研内部撮合系统与多边交易设施替代第三方的返佣协议。在调整后的收费模式下，标准最优价（Best Price）撮合收取 €1 结算费，而交易所直接路由则按单收取
              €2，使交易业务毛利率直接暴露在激烈的交易量竞争中。与此同时，消保机构对其商业宣传发起精准打击：巴登-符腾堡州消保中心（Verbraucherzentrale Baden-Württemberg）于 2025 年
              2 月提起诉讼，指控其现金利息与存款保障范围涉嫌虚假宣传；汉堡消保中心也曾通过禁令承诺迫使其叫停早期的“免费赠股”拉新活动。此外，BaFin 曾立案审查因极端行情限制交易而引发的超 4,000
              起散户投诉，表明监管层对零售经纪的风控干预保持高度敏感。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
