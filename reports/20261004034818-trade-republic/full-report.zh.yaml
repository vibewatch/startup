        - 覆盖 18 个国家、拥有 10M+ 客户与 €150B AUM，70% 为首次投资的零售用户。
        - 新增用户停滞、AUM 流向传统银行，或零售存款发生实质性流失。
      - - 银行多元化业务论点
        - 欧洲央行银行牌照与独立 IBAN 将交易型券商转化为具备高粘性的经常性存款与支付业务生态。
        - 2023 年 12 月获正式银行牌照；推出带 Saveback 的借记卡；据报道已连续三年实现盈利。
