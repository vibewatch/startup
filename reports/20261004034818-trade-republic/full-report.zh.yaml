              Management、GIC、Fidelity 和 Khosla Ventures，完成了一笔 €1.2B 的老股转让交易，公司对应估值达 €12.5B（$13.5B）。关键在于，这一里程碑式流动性事件并未向
              Trade Republic 资产负债表注入任何新增一级资本，实质是股东结构重组与早期员工流动性变现。若按 2025/2026 年预计 €400M 至 €500M 的收入运行率推算，€12.5B 的纸面估值对应
              25x 至 31x 预估 P/S，相比 Robinhood（8x 至 12x P/S）与 Charles Schwab（6x 至 8x
              P/S）等成熟上市券商及折扣经纪商存在苛刻溢价。由于无法查阅非公开股权架构的清算优先权条款，且缺乏经审计的 FY2024/25 IFRS 财报，二级老股买方承担着实质性的估值下调风险。
