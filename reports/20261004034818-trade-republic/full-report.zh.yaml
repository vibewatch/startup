chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 法人实体、监管牌照与展业规模
        blocks:
          - type: paragraph
            body: >-
              Trade Republic Bank GmbH 是一家德国数字银行与证券交易机构，总部位于德国柏林 Brunnenstraße 19-21。公司 2015 年在慕尼黑孵化设立，原名 Neon
              Trading，脱胎于 Comdirect Bank 的创业孵化器。三位联合创始人 Christian Hecker、Thomas Pischke 与 Marco Cancellieri
              计划打造低门槛、移动优先的投资平台，提供 ETF、股票、衍生品及加密资产的免佣交易。2023 年 12 月，公司迎来运营转折点：欧洲央行（ECB）正式颁发全银行牌照，由 BaFin
              和德国联邦银行负责监管。拿到牌照后，Trade Republic 得以直接吸纳客户存款、在欧洲多国开通专属 IBAN 账户、推出活期计息现金账户，并发行带有 Saveback 返利机制的 Visa 借记卡。截至
              2025 年初，业务覆盖德国、法国、西班牙、意大利、奥地利、波兰等 17 个欧洲国家；截至 2025 年 4 月，用户数达到 8M，之后突破 10M，管理客户资产超过 €100B。
