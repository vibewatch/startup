              牌照旗下的多边交易设施（MTF）成功将做市机制内化，以交易所买卖价差弥补 PFOF 损失，同时存款变现与欧洲个人养老金账户扩张带动年化营收逼近 €900M，支撑 €16.0B 至 €20.0B
