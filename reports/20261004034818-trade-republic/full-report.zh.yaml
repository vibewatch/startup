            body: >-
              移动端交付数据体现出扎实的工程成熟度：Android 团队披露其 P90 构建时长显著缩短 [CE008]，测试代码覆盖率达 92%，沉淀了 800 多个回归测试用例，且 UI 自动化测试能在 15
              分钟内执行完毕 [CE009]。不过，这些仅为公司内部研发指标，不能直接推导为线上生产环境的可用性（uptime）或面向用户的故障率。独立开发者提供的材料给出了主要警示：其首个客户端版本在 Trade
              Republic 接口调整后直接失效并停止维护
              [CE016]。这虽不能证明官方客户端或服务端不稳定，但说明在缺乏公开协议约定的情况下，第三方集成极易遭受接口变更冲击。因此，在评估该业务时必须将内部研发质量信号与外部验证的可靠性区分开。后续重点尽调事项包括：技术迁移推进现状、服务等级目标（SLO）、故障与灾备恢复记录、渗透测试或合规认证报告，以及第三方接入的明确规范。
            claimRefs:
