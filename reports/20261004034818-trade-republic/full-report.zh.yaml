  - id: FI001
    title: 商业模式转型图谱
    type: flow
    summary: 客户活跃度可接入多条变现路径，而交易执行路径正从以往的路由回扣转向内部撮合与直接路由模式。
    data:
      nodes:
        - id: customer-activity
          label: 客户活跃度与资产
          detail: 超过 10M 客户与逾 €150B 客户资产为第三方报道的规模指标，并非公司营业收入。
        - id: savings-plans
          label: 免费 ETF 定投计划执行
          detail: 据报道定投执行手续费为 €0，交叉销售与服务维度的经济效益未予披露。
        - id: manual-trades
          label: 手动证券交易
          detail: 股票及 ETF 买卖据报道收取 €1 的显性手续费。
        - id: banking-interest
          label: 银行业务与利息收入
          detail: Banker on Wheels 指出存在上述收入流，但称具体贡献未予披露。
        - id: historical-pfof
          label: 历史 PFOF 盈利模式
          detail: 截至 2026 年 1 月，据报道该项收入占总营收的比例已低于 30%。
        - id: post-ban-execution
          label: 禁令后的 MTF 与直接路由
          detail: 公开资料提及内部 Best Price 与外部 Direct Price 两条路由，但实际利润率未予披露。
      edges:
        - from: customer-activity
          to: savings-plans
          label: 定期定额投资
        - from: customer-activity
          to: manual-trades
          label: 交易活跃度
        - from: customer-activity
          to: banking-interest
          label: 现金与银行服务使用
        - from: manual-trades
          to: historical-pfof
          label: 传统路由经济模式
        - from: historical-pfof
          to: post-ban-execution
          label: 监管转型
    approximationNotes: 仅为定性机制图谱；并不隐含收入分成比例、转化率、毛利或可比分母。
    claimRefs:
      - CI003
      - CI006
      - CI011
      - CI012
      - CI013
      - CI016
  - id: FE001
    title: 产品架构与治理图谱
    type: stack
    summary: 基于公开披露证据梳理的技术栈，串联起客户端、后端服务、流式数据平面、分析层、平台管控与架构治理。
    data:
      layers:
        - label: 客户端
          detail: 采用 Kotlin、Compose、MVVM、REST 和 WebSocket 组件构建的 Android 原生应用。
          items:
            - 表现层与状态管理
            - 请求与实时行情连接
        - label: 后端服务
          detail: 招聘资料提及 AWS 上的 JVM 框架与容器化交付。
          items:
            - Kotlin、Spring 及 Vert.x
            - Hibernate 或 jOOQ
        - label: 流式数据接入
          detail: 技术大会分享的架构显示，业务变更通过 Debezium 及 Kafka 生态服务进行路由。
          items:
            - 数据库变更捕获
            - 消息与连接器层
        - label: 湖仓与分析
          detail: S3 与 Iceberg 存储对接元数据目录、计算、转换及查询服务。
          items:
            - Glue 数据目录与 Iceberg 数据表
            - EMR、Athena、Snowflake、Spark、Airflow 与 dbt
        - label: 平台与安全运维
          detail: 转载的公司招聘职位描述涉及 Kubernetes、云端数据存储、SLO 监控与安全管控职责。
          items:
            - 自助服务平台与可观测性
            - 安全架构与 CI/CD 管控
        - label: 架构治理
          detail: RFC 与 ADR 流转至评审会议，并沉淀入整合了 Backstage 的技术雷达。
          items:
            - 评估、试验、采纳或搁置的生命周期
            - Markdown、Pull Request 与 CI 流程更新
    approximationNotes: 根据指定披露材料综合梳理的概念层级；并非经核实的生产环境依赖图，亦不暗示任何未披露的架构组件。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程与产品扩张飞轮
    type: journey-map
    summary: 贯穿初始用户获取、现金入金激活、自动化 ETF 定投、刷卡 Saveback 返现到多资产财富积累的端到端客户生命周期。
    data:
      items:
        - label: 获客与开户激活
          touchpoints: Mobile app registration via paid growth channels (e.g. Moloco) and refer-a-friend
          detail: 账户验证与身份核验在 10 分钟内完成（从上线初期的万级规模扩张至 10M+ 用户）
        - label: 资金入金与收益激活
          touchpoints: Individual IBAN assignment under full ECB banking licence
          detail: 存入未投资闲置资金以赚取具竞争力的现金利息；已吸引超过 €150B 客户资产
        - label: 首次投资与储蓄定投配置
          touchpoints: Commission-free automated ETF or fractional share savings plan
          detail: 每月最低仅需 €1 即可开启自动化定投；>33% 用户为首次投资者
        - label: 交易拓展与主动交易
          touchpoints: Low-cost €1 flat settlement fee across 6,500+ equities and bonds
          detail: 覆盖 17 个欧洲国家，支持单只股票、衍生品及加密货币的自主交易
        - label: 消费与 Saveback 返现闭环
          touchpoints: Trade Republic Visa debit card with Saveback and Roundup features
          detail: 赚取 1% 返现并直接投资于选定资产，并附带零钱凑整功能
        - label: 留存或客服阻滞
          touchpoints: In-app automated support chatbot and depot transfer interfaces
          detail: 处理账户限额或出金转账；350 起 vzbv 正式投诉
    approximationNotes: 生命周期各阶段综合自 Trade Republic 产品发布公告、供应商营销研究及消费者保护机构调查结论。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU010
      - CU011
      - CU014
