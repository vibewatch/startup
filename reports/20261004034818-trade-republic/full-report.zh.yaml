  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 欧洲零售经纪与财富管理格局
        blocks:
          - type: paragraph
            body: >-
              欧洲零售经纪与数字银行市场的显著特征是激烈的价格战、产品同质化以及深刻的监管转向。Trade Republic 作为总部位于柏林的数字银行兼互联网券商，业务遍及欧洲 17
              国，已从单一移动经纪扩展至活期往来账户、借记卡及闲置资金活期计息。其直接竞争对手包括 Scalable Capital、eToro 等数字券商，DEGIRO 等泛欧折扣券商，以及 Interactive
              Brokers 和 Robinhood 等国际多资产交易平台。此外，德意志银行（Deutsche Bank）、Comdirect 和法国巴黎银行（BNP
              Paribas）等传统全能银行拥有庞大的存款底盘，属于根基深厚的老牌巨头，但其存款正持续流向低费率移动平台。现状替代品还包括传统线下网点银行、直接认购主权债券以及银行普通定期存款。


              欧洲互联网券商间的竞争格局，正日益由单一交易量变现转向全功能零售银行服务。尽管早期扩张得益于 PFOF 返佣补贴下的零佣金炒股模式，但欧盟监管改革已明确要求各成员国在 2026 年 6 月 30 日前彻底取缔
              PFOF。这一监管红线倒逼券商将收入拓展至净息差、借记卡刷卡费分成、货币兑换及会员订阅费。规模成为决定性的竞争壁垒：Trade Republic 披露截至 2025 年 4 月，其在欧洲 17 国拥有 800
              万用户（8m） 万用户和超过 €100B 资产管理规模，并在 2023/24 财年录得 €34.8M 年利润；相较于未成气候的小型同行，展现出极强的经营杠杆优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
