      - number: '3.3'
        title: 切换成本、护城河韧性与监管颠覆
        blocks:
          - type: paragraph
            body: >-
              Trade Republic
              竞争护城河的长期成色，取决于客户锁定效应以及对监管风暴的适应能力。零售经纪业务天然具有切换成本低和多平台开户（multi-homing）普遍的特征：欧洲自主投资者通常会在多个平台同时保留活跃账户，以薅取促销期的现金高息或套利不同资产类别的费率差。然而，Trade
              Republic 通过分配独立 IBAN、推出支持工资入账的活期账户、绑定自动周期定投以及借记卡 Saveback 返利，逐步拉高了账户迁移的琐碎摩擦，将低频买卖的券商关系转化为高粘性的主力银行账户。


              公司面临的最严峻竞争逆风，是欧盟依据 MiFIR 第 39a 条全面推行的订单流返佣禁令，德国享有的国家级豁免将在 2026 年 6 月 30 日终止。以往来自 Lang & Schwarz 等做市商的 PFOF
              返佣约占总收入的三分之一。作为应对，Trade Republic 于 2026 年 1 月拿下了 BaFin
              颁发的多边交易设施（MTF）运营牌照，意在将交易基建与执行收费内化。与此同时，对手在欧洲市场的加速扩张——如 XTB 在中东欧、Robinhood 在英国和欧洲——正在持续挤压佣金费率并推高散户获客成本。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
