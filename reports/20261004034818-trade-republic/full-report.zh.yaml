  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与客户定价
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 将清晰可见的前端交易定价，与相对不透明的撮合执行、银行服务及利息收入商业模式杂糅在一起。Curvo 披露其股票和 ETF 交易单笔收取 €1，同时 Curvo 和 Banker on
              Wheels 均证实其定期 ETF 定投计划完全免费。Banker on Wheels
              称公司收入来源包括银行业务、利息、交易及其他产品，但未披露各项业务的具体贡献比例。这一结构拆分的缺失至关重要，因为标称费率不等于实际变现收入：点差截留、客户现金沉淀、交易换手频次以及免费定投占比，共同决定了单客平均收入。抓取的官方资费页面并未列出详细费用细项，因此第三方机构的定价陈述仍需与管理层合同及实际客户队列数据交叉核验。
