      - number: '3.2'
        title: 竞品定位、定价体系与产品矩阵
        blocks:
          - type: paragraph
            body: >-
              对各竞品维度的深入拆解展现了截然不同的战略打法。同类互联网券商如 Scalable Capital 采用混合变现路径，将固定包月交易会员（Prime+）与计息存款功能捆绑，正面争夺长期 ETF
              定投族与自主投资散户。DEGIRO 等泛欧折扣券商则侧重全球交易所覆盖面与廉价通道，深耕欧洲大陆，主打价格敏感型活跃交易者。而 Interactive Brokers
              等机构与专业级散户平台，强调全球多资产执行、复杂保证金机制与深度投研分析，吸引的是成熟的高净值活跃交易者，而非大众储蓄人群。


              Trade Republic 的差异化在于极简定价与一体化银行功能。在单笔交易上，公司仅收取 €1 固定外部结算费，股票与 ETF
              自动定投则完全免费。为截流传统银行的现金存款，公司推出了闲置资金计息账户，并上线带有 1% Saveback 自动投资功能的 Visa
              借记卡。然而，用户体验反馈暴露出长期的服务短板：第三方评价平台充斥着对客服响应迟缓、AI 聊天机器人机械死板的抱怨，且在行情剧烈波动、账户转仓及分红结算等关键节点屡屡发生运营延误。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
