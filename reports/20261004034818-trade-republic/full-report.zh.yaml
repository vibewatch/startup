figures:
  - id: FO001
    title: Trade Republic 公司与产品演进时间线（2015-2026）
    type: timeline
    summary: 梳理 Trade Republic 从孵化创立、跻身百亿美元超级独角兽到开展银行全业务的核心公司、融资、产品及监管里程碑。
    approximationNotes: 里程碑依据一手官方新闻稿发布日期、公司法定备案与监管批准记录整理。
    data:
      items:
        - label: 2015：公司孵化创立
          date: '2015-01-01'
          description: >-
            Christian Hecker、Thomas Pischke 与 Marco Cancellieri 在 Comdirect Bank 创业车库中于慕尼黑创立 Trade Republic，初始名为 Neon
            Trading。
        - label: 2017：战略种子轮融资
          date: '2017-07-01'
          description: 总部位于杜塞尔多夫的券商 Sino AG 出资 €600,000 进行初始投资，收购多数股权。
        - label: 2019：正式推出零售券商业务
          date: '2019-05-01'
          description: 在 Creandum 领投的 A 轮融资后，移动端 App 券商在德国正式上线无限制交易。
        - label: 2020：B 轮融资与跨国扩张
          date: '2020-04-01'
          description: Accel 与 Founders Fund 联合领投 €62M 的 B 轮融资，加速国际化扩张。
        - label: 2021：散户抱团股异动与 C 轮融资
          date: '2021-05-20'
          description: 在 GameStop 散户交易受阻风波后，Sequoia Capital 以 $5.3B 估值领投 $900M 的 C 轮融资。
        - label: 2022：欧洲多国上线与 C 轮追加融资
          date: '2022-06-03'
          description: 安大略省教师养老金计划（Ontario Teachers' Pension Plan）以 €5B 估值领投 €250M 追加融资；平台业务拓展至 17 个国家。
        - label: 2023：获得欧洲央行正式银行牌照
          date: '2023-12-06'
          description: 欧洲央行授予正式银行牌照；公司宣布实现首个自然年盈利。
        - label: 2024：上线 Visa 借记卡
          date: '2024-01-09'
          description: 客户数达到 400 万，AUM 达 €35B；推出带 1% Saveback 返现奖励的 Visa 卡。
        - label: 2025：规模里程碑与 €12.5B 估值
          date: '2025-12-22'
          description: 在 €1.2B 二级市场股权交易中获得 €12.5B 估值；客户基数突破 1000 万。
        - label: 2026：获批 BaFin MTF 交易牌照
          date: '2026-01-30'
          description: 赶在欧盟 2026 年 6 月 PFOF 禁令生效前，子公司取得 BaFin 多边交易设施（MTF）牌照。
    claimRefs:
