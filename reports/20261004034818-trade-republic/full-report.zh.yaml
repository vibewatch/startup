      - number: '7.3'
        title: 合作伙伴、资产托管与金融对手方依赖
        blocks:
          - type: paragraph
            body: >-
              尽管拥有自己的银行牌照，Trade Republic 在存款托管、证券清算与资产存管等环节依然高度依赖外部对手方。存放于综合信托账户中的客户现金被分散配置在合作信贷机构中，包括 Solaris
              SE、德意志银行（Deutsche Bank AG）、摩根大通（J.P. Morgan SE）与花旗欧洲（Citibank Europe
              plc），因而客户资金安全直接受制于上述银行伙伴的经营状况与偿付能力。此外，配置到货币市场基金的余额不受德国法定存款保险机构（EdB）等法定存款保险计划覆盖，纯粹依赖资产隔离机制保障。证券托管由汇丰德国（HSBC
              Germany）配合完成，并存放在法兰克福的明讯银行（Clearstream Banking）等中央证券存管机构；加密资产托管则委托第三方托管机构 BitGo Europe GmbH
              进行离线冷钱包存储。在衍生品业务上，Trade Republic 仅作为法国兴业银行（Société
              Générale）、汇丰（HSBC）和冯托贝尔（Vontobel）等结构化产品发行人的介绍经纪商。任何一家核心机构伙伴若发生业务中断或信用资质恶化，都将直接冲击 Trade Republic
              的服务可用性、客户资产安全与交易执行连续性。
