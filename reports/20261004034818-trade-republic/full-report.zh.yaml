      - number: '2.4'
        title: 结构性增长催化剂与市场制约因素
        blocks:
          - type: paragraph
            body: >-
              欧洲互联网券商的长期扩张受宏观与人口结构变迁的双重驱动。人口老龄化加剧以及公共养老金系统财政负担沉重，造成了系统性的养老储蓄缺口。包括德国在内的欧洲多国政府已逐步意识到推进以权益类资产为核心的个人养老金改革的必要性，以鼓励民间资金参与资本市场。与此同时，移动金融服务的普及让智能手机成为跨年龄段人群（从年轻一代到退休人员）日常理财的标准入口。


              但在另一侧，严厉的结构性制约与监管介入深刻影响着行业盈利能力。欧盟落地的订单流返佣（PFOF）禁令直接威胁到低成本券商的变现基石。在德国，此前券商享受的过渡期豁免将于 2026 年 6 月 30
              日到期；以往平台通过将散户订单导流至 Lang & Schwarz Exchange 等专属交易场所，能赚取丰厚的返佣收入。Trade Republic 披露，PFOF 历史上约占其总收入的三分之一，到 2026
              年初已压降至 30% 以下。为应对 2026 年中即将到来的收入悬崖，平台必须经历重资产转型的阵痛：申请牌照并上线自研多边交易设施（MTF）、将订单执行系统收归自营，并转向深挖现金利差收益。
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 监管剧变：2026 年 PFOF 淘汰悬崖
            body: >-
              欧盟针对订单流返佣（PFOF）的法定禁令抽掉了折扣券商单客经济模型的一大支柱。随着德国国家层面的豁免在 2026 年 6 月 30 日终止，Trade Republic 必须告别以往占收入超 30%
              的第三方交易所返佣，转投新的变现架构，包括持牌多边交易设施（MTF）撮合与净息差收益。
            calloutType: risk
            claimRefs:
              - CM001
              - CM015
              - CM016
          - type: callout
            title: 存款中介化：高粘性客户护城河
            body: >-
              拿到欧洲央行全银行牌照后，Trade Republic 通过向用户全额传导央行存款利息，结合借记卡 Saveback 消费返利，把低频交易账户变成了承接工资与日常储蓄的蓄水池，在两年内将托管客户资产从 €35B
              结构性推高至 €150B。
            calloutType: insight
            claimRefs:
              - CM003
