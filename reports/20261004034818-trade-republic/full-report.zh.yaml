              P/S）。悲观情景下，2026 年 6 月 PFOF 政策断崖引发佣金利润率剧烈收缩，加之客服失灵与转仓瓶颈导致用户加速流失，估值承压回落至 €6.0B 至 €8.0B。鉴于非公开股权在 EquityZen
