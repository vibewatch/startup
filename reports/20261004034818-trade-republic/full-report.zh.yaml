              Trade Republic 获客倚仗激进的投放买量、移动增长平台，以及由高息和返现激励驱动的裂变口碑。与广告技术伙伴 Moloco
              开展的严格增量测试表明，在德国、法国、西班牙等核心市场实现了统计学上显著的应用安装量提升，促使 Trade Republic 在单一季度内将其在 Moloco 上的广告预算直接提高至三倍。Trustpilot
              等公开平台上超过 60,000
              条用户评价显示，大众对低费率交易、高吸引力活期利息和丝滑的手机开户体验普遍认可。然而，散户反馈呈现严重的两极分化：对基础交易执行的高满意度，与技术或行政环节出错时的强烈不满形成了鲜明反差。
