  - id: FV001
    title: 估值综合推导与决策链路
    type: flow
    summary: 以环环相扣的分析链，将经营规模、银行多元化业务、监管阻力与估值纪律层层串联，最终推导出“观察”评级。
    data:
      nodes:
        - id: scale-proof
          label: 零售规模与特许壁垒：覆盖 18 国，拥有 10M+ 用户与 €150B AUM
        - id: profitability-proof
          label: 经营盈利能力：连续 3 年盈利（FY23/24 净利润 €34.8M）
        - id: regulatory-cliff
          label: 监管断崖：2026 年 6 月欧盟 PFOF 禁令波及 ~30% 收入
        - id: mtf-licence
          label: 基础设施应对：2026 年 1 月拿下 BaFin MTF 牌照，内化订单执行
        - id: valuation-multiple
          label: 估值基准：€12.5B 老股交易估值对应 25x–31x 预计 P/S
        - id: recommendation-call
          label: 投资建议：维持“观察”立场，待禁令后 MTF 经审计的经济模型明确
      edges:
        - from: scale-proof
          to: profitability-proof
        - from: profitability-proof
          to: regulatory-cliff
        - from: regulatory-cliff
          to: mtf-licence
        - from: mtf-licence
          to: valuation-multiple
        - from: valuation-multiple
          to: recommendation-call
    approximationNotes: 将经营规模、监管阻力与估值指标的链式证据，直接引向投资结论。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
