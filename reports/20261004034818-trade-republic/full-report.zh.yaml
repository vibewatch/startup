      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 监管悬崖：2026 年 6 月欧盟 PFOF 禁令生效
            body: >-
              随着欧盟修订版 MiFIR 第 39a 条落地并于 2026 年 6 月 30 日终结德国对订单流返佣禁令的临时豁免，Trade Republic 的核心券商变现模式迎来直接的监管转向。虽然公司已将 PFOF
              收入占比从三分之一压降至 30% 以下，并在 2026 年 1 月斩获 BaFin 多边交易设施牌照以实现订单内部撮合，但后 PFOF 体制下的交易执行经济模型仍未获验证。
