      - number: '1.3'
        title: 融资沿革、老股流动性与股东利益协同
        blocks:
          - type: paragraph
            body: >-
              自种子轮以来，Trade Republic 历经多轮机构投资，累计完成逾 $1.3B 一级市场股权融资。2017 年获得早期 €600,000 注资并由杜塞尔多夫券商 Sino AG 控股后，公司于 2020 年
              4 月完成由 Accel 与 Founders Fund 联合领投的 €62M B 轮融资。2021 年 5 月，Sequoia Capital 领投标志性的 $900M C 轮融资，投后估值达
              $5.3B；2022 年 6 月，安大略省教师退休基金会（Ontario Teachers' Pension Plan Board）又领投了 €250M 的 C 轮追加轮，投后估值保持在
              €5.0B（$5.0B）。2025 年 12 月，Trade Republic 完成一笔规模达 €1.2B 的大额老股交易，公司估值达到
              €12.5B。这笔老股转让虽为早期风险投资人与员工提供了充沛流动性，但并未给公司资产负债表注入新的营运资金；未来的资本充足水平与资本开支，依然只能仰仗滚存留存收益和账上现有流动性。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
