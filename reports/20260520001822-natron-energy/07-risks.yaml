  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: field-results
    missingEvidence: A full field-performance package covering degradation curves, warranty terms, uptime, and failure incidents across shipped systems.
    whyItMatters: Natron's public record contains strong marketing claims but only preliminary demonstration updates, which is not enough to underwrite long-lived industrial assets.
    diligencePath: Request customer-qualified performance reports, warranty books, service-event logs, and UCSD final data outputs.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Board materials, runway forecasts, cap-table rights, liquidation preferences, and investor-payment schedules leading into the 2025 shutdown.
    whyItMatters: These documents are necessary to separate a market-driven miss from governance or financing-structure failure.
    diligencePath: Obtain the last board decks, waterfall model, financing term sheets, and any investor-side payment suspension notices.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: orders
    missingEvidence: The identities, cancellation rights, product SKUs, and delivery schedules behind the reported $25 million of booked orders.
    whyItMatters: Without named counterparties and contract terms, backlog quality cannot be judged and customer-fulfillment risk may still be understated.
    diligencePath: Request redacted order book, customer concentration schedule, contract milestones, and cancellation / refund clauses.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: certification-bottleneck
    missingEvidence: A product-by-product certification matrix showing exact UL and other qualification status at the time the company stopped shipping.
    whyItMatters: The public record suggests certification scope mattered to deliverability, but it does not pin down which SKUs or configurations were blocked.
    diligencePath: Collect certification certificates, application timelines, customer qualification requirements, and any failed-test or remediation notices.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: policy-dependence
    missingEvidence: Definitive JDIG, megasite, and other state-support documents showing milestone conditions, draw mechanics, and clawback or termination provisions.
    whyItMatters: Investors need to know whether shutdown stranded only optional support or triggered contingent liabilities and missed obligations.
    diligencePath: Pull state incentive agreements, county-board materials, and any shutdown-related correspondence between Natron and North Carolina agencies.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
