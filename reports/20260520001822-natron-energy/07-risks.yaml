- id: TR004
  title: Red-flag checklist
  columns:
  - red flag
  - evidence
  - status
  - why it matters
  rows:
  - - WARN notice used the faltering-company exception rather than normal 60-day lead time
    - Company said full notice would have harmed financing efforts
    - Triggered
    - Late WARN usage is often a sign liquidity is already gone
  - - Booked orders remained unfulfilled at shutdown
    - Public reports cited $25M of orders and no delivery on current or future orders
    - Triggered
    - Backlog did not convert into financeable revenue
  - - 40x scale-up announced before long operating proof was visible
    - 600 MW Holland versus 24 GW NC factory
    - Triggered
    - Scale narrative materially outran disclosed execution evidence
  - - Multiple refinancing avenues failed in the same quarter
    - WARN enumerated follow-on equity, new equity, convertible note, and management proposal
    - Triggered
    - Capital markets stopped believing the bridge story
  - - Product fit was narrow relative to headline storage narratives
    - Natron said its product was not suited for long-duration discharge or standalone BESS
    - Triggered
    - Addressable market was smaller than broad energy-storage framing implied
  - - Public field-performance disclosure stayed preliminary
    - UCSD demo still reported initial findings and future updates
    - Triggered
    - Independent proof never caught up to marketing claims
  - - Wind-down moved toward asset sale / ABC rather than recovery financing
    - Sherwood sale process and TechCrunch ABC description
    - Triggered
    - Recovery odds and information rights usually worsen in off-court liquidations
  notes: Every item in this checklist was visible in public sources by the time of shutdown; none requires proprietary diligence to spot in hindsight.
