- id: scale-and-fulfillment-gap
  title: Manufacturing scale and customer-fulfillment risk outran disclosed operating proof
  body: 'Natron''s operating story asked investors and customers to believe two things at once: first, that the Holland plant had crossed into commercial manufacturing with a differentiated, UL-listed sodium-ion product; second, that the same company could jump from a 600 megawatt annual site to a proposed 24 gigawatt North Carolina factory, a 40x step-up. Public evidence never closed that bridge. The company marketed very strong attributes—fifteen-minute recharge, more than 50,000 cycles, nonflammability, high power, and suitability for AI-driven data-center backup and industrial peak shaving—but its own microgrids page also conceded the product was not suited for long-duration discharge or standalone BESS use. The sharpest adverse datapoint is not that Natron lacked commercial interest; it is that the company still shut down with booked orders reportedly totaling $25 million and a public claim that current and future orders would not be delivered. That combination suggests certification
    scope, manufacturing readiness, and working-capital discipline were all weaker than the headline market narrative. Even the UC San Diego demonstration page still framed results as “initial findings” and promised future updates, underscoring how thin the public field-performance record remained before the company failed.'
