- id: TR005
  title: Mitigation status and kill criteria
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - status as of run date
  - action implication
  rows:
  - - Liquidity trap
    - New money closes before shutdown
    - Committed financing sufficient to cover working capital and order execution
    - Failed
    - Thesis broken once closure occurs without rescue capital
  - - Certification-to-shipment conversion
    - Commercial shipments begin and continue
    - Named shipped systems, installed base, and repeat orders are publicly disclosed
    - Failed / unverified
    - Do not underwrite backlog without shipment proof
  - - Manufacturing ramp
    - Holland demonstrates stable output before NC leap
    - Yield, throughput, and warranty metrics become public or diligence-verified
    - Failed
    - Reject giga-scale assumptions until plant-level proof exists
  - - Customer proof durability
    - Reference deployments publish operating outcomes
    - Named customers disclose use case, uptime, and renewal intent
    - Incomplete
    - Treat customer demand as soft until production evidence appears
  - - Policy support translates into financeable projects
    - Incentives are paired with committed capital and executable milestones
    - Grant / tax narratives are matched by definitive project funding
    - Failed
    - Policy alone is not a mitigation
  - - Disclosure quality
    - Board, runway, warranty, and backlog details are available
    - Diligence package closes major public information gaps
    - Absent
    - Raise the risk rating when management asks investors to underwrite opacity
  notes: Because Natron shut down in 2025, most “mitigations” are now post-mortem diagnostics rather than live remedies.
