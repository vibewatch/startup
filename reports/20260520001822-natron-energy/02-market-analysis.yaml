- id: buyers-and-adoption
  title: Buyer segmentation, budget ownership, and adoption path
  body: 'The public buyer map is coherent even if exact budget lines are rarely disclosed. In data-center UPS and critical-power deployments, the user is the facility or infrastructure team that owns uptime risk, while the economic sponsor is typically a critical-power, operations, or infrastructure capex owner choosing among UPS architectures and battery chemistries. In industrial peak shaving or power-quality deployments, the user is the plant or site operator and the payer sits closer to energy management, operations leadership, or CFO-backed reliability and fuel-savings programs. Natron’s UC San Diego fast-charging project shows a similar pattern in adjacent use cases: buyers adopt the battery to handle a high-power bottleneck, not to maximize multihour arbitrage. Adoption also appears to be evidence-heavy. Critical-power buyers first identify an outage, load-ramp, or power-quality problem; then compare chemistry options on safety, runtime, maintenance, and TCO; then require qualification,
    integration, and field proof before broader rollout. That slow purchase motion is important for valuation because it narrows near-term SOM even when macro demand for resilient power is rising.'
