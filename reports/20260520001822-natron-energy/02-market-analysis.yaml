- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rising data-center electricity demand and AI load growth
    - Positive
    - Near-term through 2030
    - Expands spending on resilient power, UPS upgrades, and high-power ride-through solutions
    - Which named operators are qualifying sodium-ion for critical power versus staying with incumbents?
  - - Safety, TCO, and sustainability rising in buyer criteria
    - Positive
    - Current
    - Improves the appeal of chemistries that reduce maintenance, fire risk, and Scope 3 concerns
    - What third-party field data prove Natron on these dimensions versus VRLA, NiZn, and Li-ion?
  - - Domestic manufacturing and energy-storage policy support
    - Positive
    - Medium term
    - Can improve supply economics and channel credibility for U.S.-made systems
    - How much of Natron unit economics depended on tax credits and state incentives?
  - - Industrial power-quality and fast-charging bottlenecks
    - Positive
    - Current
    - Creates adjacent use cases outside classic UPS replacement
    - How much real pipeline exists outside data-center critical power?
  - - Li-ion scale, falling LFP costs, and buyer familiarity
    - Negative
    - Current
    - Makes incumbent offers cheaper, denser, and easier to finance than alternative chemistries
    - Where does Natron still win when buyers benchmark full installed cost and footprint?
  - - Entrenched lead-acid and live nickel-zinc UPS alternatives
    - Negative
    - Current
    - Keeps Natron from assuming a clean field in critical power despite safety and maintenance pain points
    - Which large UPS channels have standardized on VRLA, LFP, or NiZn and why?
  - - Immature North American sodium-ion demand
    - Negative
    - Medium term
    - Limits near-term SAM realization and makes manufacturing scale risky
    - What customer backlog was contractually committed before Natron shut down?
  - - Commercialization and financing execution risk
    - Negative
    - Immediate
    - Natron’s own closure shows that a valid use case does not guarantee durable scale-up
    - Which technical, certification, or working-capital hurdles blocked conversion of announced capacity into shipments?
  notes: The table combines market demand drivers with commercialization constraints because Natron’s valuation depends on both demand visibility and the ability to industrialize an alternative chemistry.
