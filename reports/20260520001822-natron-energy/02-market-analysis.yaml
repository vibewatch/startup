  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-precision
    missingEvidence: Third-party revenue or unit-market breakdown for short-duration critical-power sodium-ion deployments relevant to Natron.
    whyItMatters: Without a public segment cut, Natron’s SAM and SOM cannot be stated as more than constrained lenses.
    diligencePath: Request customer pipeline, shipment mix, and quoted backlog by data-center UPS, industrial, telecom, and fast-charging segment.
    relatedQuestionRefs:
    - QM008
  - type: private-evidence-only
    severity: material
    topic: budget-owner-transparency
    missingEvidence: Named procurement owners, contract terms, and budget sources for telecom and other backup-power deals relevant to Natron.
    whyItMatters: Buyer-map confidence is lower when public sources show the use case but not the internal budget owner or contract structure.
    diligencePath: Collect customer case studies, procurement records, or management commentary that identify decision makers and contract terms by segment.
    relatedQuestionRefs:
    - QM012
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: commercialization-readiness
    missingEvidence: Independent evidence on whether Natron’s announced capacity, certifications, and customer demand were convertable into durable shipments before shutdown.
    whyItMatters: The market may exist while company-specific commercialization still fails, which materially changes valuation timing.
    diligencePath: Review board materials, customer purchase orders, certification records, and lender or investor diligence files from 2024-2025.
