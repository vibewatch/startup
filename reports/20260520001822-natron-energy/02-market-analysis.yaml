- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and valuation implications
  body: 'The demand-side drivers are visible. EIA and IEA both show rising electricity and data-center loads, while UPS and industrial-battery market studies point to sustained spending on resilient power, high-availability infrastructure, and safer chemistries. Natron also benefits from a narrative around domestic supply chains, abundant materials, and policy support for U.S. energy-storage manufacturing. But the constraints are at least as important. Current market structure still favors lithium-ion and four-hour assets, sodium-ion demand in North America remains small by public estimates, and fast improvements in LFP price and energy density can compress the niche for alternative chemistries. The commercialization record is also sobering: Natron’s own shutdown in 2025 demonstrates that a valid use case does not guarantee durable financing, qualification success, or customer conversion at scale. For valuation, the investable conclusion is therefore narrower than a headline battery TAM.
    Natron’s best wedge is a real critical-power and industrial high-power segment, but monetization depends on proving lifecycle economics, building channel trust, and scaling before lithium-ion or nickel-zinc close the gap.'
