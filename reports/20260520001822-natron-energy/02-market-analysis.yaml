- id: sizing-lenses
  title: 'Sizing lenses: broad industrial battery spend is real, but Natron’s core wedge is smaller'
  body: 'Public market data support a large backdrop but not a clean Natron-specific TAM/SAM/SOM stack. Mordor’s industrial battery estimate puts the global market at USD 41.93 billion in 2026 growing to USD 93.71 billion by 2031, and Grand View estimates the global data-center UPS market at USD 4.04 billion in 2024 rising to USD 6.27 billion by 2030. Those are useful outer bounds, but neither is a direct Natron market number. The industrial-battery lens includes forklifts, telecom, and broad power sectors, while the UPS lens captures only one part of Natron’s opportunity and omits industrial seconds-to-minutes peak shaving. The current deployment mix also matters. NREL and EIA evidence show that present U.S. stationary storage is overwhelmingly lithium-ion and four-hours-or-less because today’s capacity rules and arbitrage structure reward that duration window. Natron therefore sits between two public lenses: broader industrial and UPS revenue pools that validate real demand, and a current
    storage market structure that is already electrified but optimized for chemistries with far greater incumbent scale. The right takeaway is not that Natron owns a giant BESS TAM; it is that the company targets a narrower critical-power wedge inside several larger but only partially relevant markets.'
