- id: section-2
  title: Leadership visibility, funding history, and stakeholder map
  body: 'Public leadership disclosure is thinner than Natron’s product messaging but still adequate for a chapter-one operating picture. Business Wire releases in 2024 identify founder Colin Wessells and co-CEO Wendell Brooks as the executive faces of the Michigan scale-up and North Carolina expansion. Shutdown-period reporting adds two more named operators: chief commercial officer John Schmidt, who communicated that booked orders would not be fulfilled, and Elizabeth Shober, who signed the WARN notice as head of team and talent. What remains missing is exactly what private-company diligence would normally want next: a current board roster, board-seat allocation, and investor control-rights map. Capital formation is also only partially public. Natron disclosed a $35 million 2020 round, but its own 2020 releases conflict on whether that round was Series B or Series D. Later visibility comes from partner and database sources: United Airlines announced a strategic investment in 2022; Energy-Storage.news
    named ABB, Chevron, and Khosla among investors in 2024; PitchBook listed a $189 million later-stage round in January 2024; and Latitude Media later reported more than $363 million raised overall plus a $55.4 million top-up before shutdown. That is enough to map visible stakeholders, but not enough to verify ownership, liquidation seniority, or current valuation.'
