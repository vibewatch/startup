  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: A current board roster, board-seat allocation, and investor control-rights summary for Natron.
    whyItMatters: Leadership quality is visible, but governance control and downside decision rights remain opaque, which matters for understanding how the 2025 shutdown decision was made.
    diligencePath: Request the latest board deck, voting agreements, and any current Delaware cap-table or governance summary from counsel or lead investors.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled financing history that resolves the 2020 round label conflict and lists all round amounts with dates and lead investors.
    whyItMatters: Round chronology anchors dilution, valuation history, and investor seniority, but the retained public record contains conflicting labels and incomplete amounts.
    diligencePath: Pull the company financing ledger from board materials or the cap-table system and reconcile it against the 2020 press releases and 2024-2025 private-market databases.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: metrics-gap
    missingEvidence: A current headcount, customer count, revenue run-rate, and post-shutdown retained-team count.
    whyItMatters: The shutdown changed Natron’s scale profile abruptly, so stale employee counts and absent revenue data materially affect underwriting and recovery-value judgments.
    diligencePath: Obtain the final operating dashboard, employee census at shutdown, and current liquidation staffing plan from management or the assignee.
    relatedQuestionRefs:
    - QO020
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: valuation-gap
    missingEvidence: Credible public post-2024-05-20 evidence of Natron’s latest post-money valuation, if any exists.
    whyItMatters: The report request explicitly asks whether Natron was a unicorn, and public materials currently do not support that conclusion.
    diligencePath: Ask management, lead investors, or the assignee for the final financing documents or a board-approved valuation memo; otherwise treat unicorn status as unverified.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A full cap table, board-seat map, and liquidation waterfall showing which investors or creditors controlled the wind-down.
    whyItMatters: The public stakeholder map identifies visible names but not economic control, recovery seniority, or who authorized the liquidation path.
    diligencePath: Review the cap table, stockholder agreements, debt documents, and Sherwood engagement letter to map voting power and recovery order.
    relatedQuestionRefs:
    - QO013
    - QO022
    relatedTableRefs:
    - TO003
