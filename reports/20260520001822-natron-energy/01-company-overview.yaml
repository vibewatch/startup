company:
  name: Natron Energy
chapter:
  number: 1
  title: Company Overview
  summary: Natron Energy was a private sodium-ion battery company founded in 2012 and based in Santa Clara, California, with a commercial-scale plant in Holland, Michigan and an announced but unrealized Edgecombe County, North Carolina gigafactory; its products were aimed at industrial and data-center / critical-power applications. Strong public evidence from WARN filings and multiple independent outlets shows that by early September 2025 the company had shut down and entered liquidation or asset-sale mode. No retained credible public evidence on or after 2024-05-20 verifies a $1 billion-plus company valuation, and the widely cited $1.4 billion figure refers to planned North Carolina factory capex rather than enterprise value.
sections:
- id: section-1
  title: Identity, product scope, and operating footprint
  body: 'Natron’s retained official pages make the company’s market identity unusually clear. The homepage describes Natron as a supplier of critical-power and industrial batteries for high-powered use cases such as AI data centers, peak shaving, and power quality management, while the company/contact page explicitly says Natron is privately held and does not offer public stock or consumer investment access. The same official materials narrow the company’s product scope: Natron sells into commercial and industrial applications, not residential or DIY uses, and its data-center, industrial, and microgrid pages repeatedly frame the chemistry around short-duration, high-power discharge rather than long-duration standalone storage. The operating-footprint evidence is also concrete. Natron’s retained homepage source lists Santa Clara, California and Holland, Michigan addresses, and the manufacturing page says Holland opened in 2024 with a future gigafactory planned for Edgecombe County, North
    Carolina. That combination supports treating Natron as a private U.S. industrial battery manufacturer with a narrow, mission-critical-power orientation rather than a broad consumer battery brand.'
