- id: section-3
  title: Manufacturing commercialization and the 2024 scale-up narrative
  body: 'Natron’s strongest late-stage evidence came from manufacturing and commercialization milestones rather than classic software metrics. The April 2024 Business Wire release said Holland had begun commercial-scale production, projected 600 megawatts of annual output at full capacity, and was supported by more than $40 million of retrofit spending plus $19.8 million from ARPA-E. Natron also said initial shipments would start in June 2024 with an initial data-center focus, matching the company’s repeated positioning around critical power and AI-related loads. Outside the plant itself, commercialization proof exists but stays niche-specific. United Airlines invested around airport-ground electrification, and UC San Diego publicly described a 2024 demonstration of Natron batteries for commercial EV fast charging. The most ambitious scale claim was the August 2024 Edgecombe County announcement: 24 gigawatts of planned annual output, nearly $1.4 billion of proposed factory investment, and
    more than 1,000 jobs. That announcement matters because it demonstrates Natron’s industrial ambition and state-level support, but it should not be read as evidence that the company had already achieved gigafactory scale or unicorn valuation.'
