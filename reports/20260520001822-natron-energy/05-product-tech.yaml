- id: TE003
  title: Technical dependency map
  columns:
  - Dependency
  - Why it matters
  - Evidence
  - Risk if weak
  - Current posture
  rows:
  - - Prussian-blue electrode know-how
    - Core chemistry moat and the basis for Natron's power / cycle-life thesis
    - Official chemistry explanations and repeated trade coverage
    - If repeatability or degradation differ from marketing, the whole value proposition weakens
    - Mechanism is clearly described; third-party lifetime data remain limited
  - - Existing-line retrofit compatibility
    - Natron's manufacturing thesis relies on adapting high-volume battery equipment
    - Holland retrofit disclosures and CATL commentary on sodium-ion line compatibility
    - Poor yield or hidden process changes would raise capex and delay scale
    - Commercial proof exists in Holland; giga-scale economics remain unproven
  - - UL certification scope
    - Critical-power buyers need safety and permitting comfort
    - BlueTray UL 1973 plus UL 9540A disclosure
    - If safety evidence stops at one SKU, broader deployment slows
    - Strong for BlueTray; underdocumented for BluePack / BlueRack
  - - Power-electronics / UPS integration
    - Natron sells into systems, not isolated cells
    - United, UC San Diego, and official use-case pages all imply integrator workflows
    - Without interoperable controls and qualification support, adoption stalls
    - Partner examples exist; public interface documentation does not
  - - Customer qualification cycles
    - Data centers and industrial buyers prioritize reliability and safety over novelty
    - Data Center Frontier survey and data-center trade coverage
    - Qualification drag can outlast chemistry success
    - Clear dependency; no public qualification cycle metrics disclosed
  - - Domestic-source / BABA paperwork
    - Procurement advantage depends on documented compliance, not slogans alone
    - Natron BABA claim plus state-backed domestic-manufacturing narrative
    - If unsupported in audits or bids, domestic-positioning premium erodes
    - Company claim visible; independent compliance documentation absent
  - - Scale-up capital continuity
    - 24 GW expansion required sustained capex and working capital
    - NC project disclosures plus 2025 adverse sources
    - Technical roadmap halts even if chemistry works
    - This dependency failed by 2025
  - - BMS / software / cyber disclosure
    - Critical infrastructure buyers need operational-control assurance
    - Absence of public architecture docs across official surfaces
    - Opaque controls raise diligence friction and security questions
    - Public disclosure is minimal
  notes: Dependencies are operational as well as chemical. The failure mode is often not cell science itself but integration, certification scope, qualification drag, or capital continuity.
