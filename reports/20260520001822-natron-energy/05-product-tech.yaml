- id: TE002
  title: 'Performance metrics: official claims versus non-company evidence'
  columns:
  - Metric
  - Official claim
  - Strongest non-company evidence in pack
  - Why it matters
  - Caveat / limit
  rows:
  - - Cycle life
    - '>50,000 cycles / deep-discharge cycles'
    - Energy-Storage.news repeats the claim but notes zero strain should not be read as zero degradation
    - Supports high-cycle UPS, power-quality, and fast-cycling industrial roles
    - No peer-reviewed Natron lifetime dataset or public fleet degradation curve in pack
  - - Recharge speed
    - Full recharge in 15 minutes or less
    - UC San Diego EV-fast-charging demo reported response characteristics aligned with high-power charging demands
    - Critical for repeat-use short-duration workloads
    - Public independent test data remain early and use-case specific
  - - Discharge profile
    - 100% rated power over two minutes; more than 100% under two minutes for critical power
    - Supported only by company critical-power pages in this pack
    - Defines the wedge against long-duration batteries
    - No independent UPS run-time certification in pack
  - - Round-trip efficiency
    - Upwards of 98% in industrial peak-shaving use case
    - No independent efficiency test published in pack
    - Important for repeated cycling economics
    - Treat as marketing until third-party test data appear
  - - Thermal-runaway / fire safety
    - Incapable of thermal runaway; nonflammable
    - BlueTray UL 1973 and disclosed UL 9540A results provide product-specific third-party support
    - Core differentiator for critical infrastructure buyers
    - Evidence scope is clearest for BlueTray/cells, not the entire product stack
  - - Cooling / settling
    - No active cooling; no thermal waiting or settling required
    - Comparison can be contextualized against Eaton lithium UPS literature discussing BMS and UL 9540A mitigation
    - Simplifies maintenance and eliminates claimed single points of failure
    - No field dataset quantifies reliability benefit across Natron fleets
  - - Materials / supply chain
    - No lithium, cobalt, nickel, or conflict minerals; commodity aluminum/iron/manganese/sodium
    - Independent trade coverage repeats the materials narrative
    - Supports cost, domestic sourcing, and sustainability pitch
    - No public supplier list or audited sourcing file in pack
  - - Duty-cycle fit
    - Not suited for long-term discharge or standalone BESS use
    - Official limitation is consistent with partner-demo use cases
    - Important boundary on underwriting and deployment fit
    - Means Natron is not a universal substitute for LFP energy-storage systems
  notes: This table intentionally separates official performance marketing from the narrower independent evidence base. Where no third-party test appears in the source pack, the caveat states that directly rather than inferring validation.
