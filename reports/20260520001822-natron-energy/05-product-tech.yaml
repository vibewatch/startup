callouts:
- calloutType: strength
  title: BlueTray Has the Best Evidence Base in the Stack
  body: Natron's overall product story is unevenly evidenced, but BlueTray 4000 is materially stronger than the rest of the portfolio. It combines product-specific UL 1973 safety certification, public UL 9540A disclosure, commercial-shipment language, and a clear fit for short-duration critical-power workflows. That does not validate the entire product family, but it does show Natron cleared a real productization threshold beyond lab-scale chemistry.
  claimRefs:
  - CE006
  - CE007
  - CE018
  - CE019
  - CE020
- calloutType: risk
  title: Scale-Up and Full-Stack Validation Stayed Narrow
  body: The chapter's main risk is not that Natron lacked any real technical progress; it is that the strongest proof stayed narrow while the scaling ambition expanded quickly. Public evidence is much stronger for BlueTray safety and Holland first-factory execution than for BluePack/BlueRack certification scope, field reliability, BMS transparency, or giga-scale manufacturing durability. The 2025 shutdown converts those missing proofs from abstract diligence asks into demonstrated scale risk.
