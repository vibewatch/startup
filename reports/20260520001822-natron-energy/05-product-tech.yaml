  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cycle-life-validation
    missingEvidence: Independent life-testing data showing degradation curves, usable-capacity retention, and failure modes for BlueTray, BluePack, and BlueRack under representative duty cycles.
    whyItMatters: Natron's 50,000-cycle and zero-strain claims are central to the product thesis, but public evidence does not verify how those claims hold at product level over time.
    diligencePath: Request third-party test reports, customer fleet data, and warranty-return statistics segmented by product family and use case.
    relatedQuestionRefs:
    - QE003
  - type: missing-source
    severity: material
    topic: baba-procurement-proof
    missingEvidence: A customer procurement file, auditor letter, or documented compliance package that substantiates Natron's BABA claim beyond marketing language.
    whyItMatters: Domestic-manufacturing positioning can influence public-sector and infrastructure buying decisions, but unsupported claims should not be underwritten as delivered compliance.
    diligencePath: Request customer-facing domestic-content/BABA documentation, bill-of-material origin summaries, and any independent compliance attestations.
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: material
    topic: field-reliability-data
    missingEvidence: Installed-base size, failure-rate history, warranty claims, MTBF-style reliability reporting, and maintenance burden for BluePack and BlueRack fleets.
    whyItMatters: Critical-power buyers ultimately qualify reliability in field operation, not just chemistry claims or launch certifications.
    diligencePath: Ask management for fleet KPI dashboards, warranty cohorts, and named customer references with operating-history data.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: controls-and-cyber-disclosure
    missingEvidence: BMS architecture, communications interfaces, cybersecurity controls, firmware update process, and any public standards compliance relevant to critical infrastructure customers.
    whyItMatters: Integration transparency affects both system qualification and security diligence in data centers, telecom, and industrial environments.
    diligencePath: Request system architecture docs, protocol lists, threat model, pen-test summaries, and any NERC / IEC / customer security review artifacts.
    relatedQuestionRefs:
    - QE024
  - type: conflicting-data
    severity: material
    topic: scale-readiness-vs-closure
    missingEvidence: Internal yield, utilization, backlog-conversion, and working-capital metrics explaining why Holland proof did not translate into durable NC scale-up readiness.
    whyItMatters: The product chapter cannot cleanly separate technical readiness from capital readiness without operational manufacturing metrics.
    diligencePath: Request plant-level KPI history, qualification funnel metrics, and the post-mortem on why 2024 production success still ended in a 2025 shutdown.
    relatedQuestionRefs:
    - QE025
