- id: capital-adequacy
  title: Capital adequacy and the late-2025 cash failure
  body: 'Capital adequacy is where Natron’s public story breaks. The reviewed sources show the company had real industrial ambition — a commercial Michigan plant, first shipments in 2024, and a planned 24 GW North Carolina gigafactory — but they do not show a financing base commensurate with that scale-up. Public disclosures are themselves inconsistent: PitchBook shows a latest deal amount of $189 million and a “generating revenue” status, while Latitude reported that Natron had raised more than $363 million in total and had added $55.4 million to its Series F only five months before shutting down. Even before testing valuation, that inconsistency means a clean capital base cannot be established from public sources alone.


    The late-2025 failure is, by contrast, unusually explicit because the WARN letter describes it in financing terms. Natron told Michigan regulators that it had been seeking follow-on funding from existing investors, a new Series B equity process, a secured convertible note, a management-led recapitalization proposal, and additional purchase orders. The board concluded on August 27, 2025 that those efforts had failed to produce enough funding to cover the additional working capital and operating expense needed to execute available purchase orders. Latitude added that booked orders totaled $25 million, but Natron would not deliver current or future orders after closure.


    The closure sources are directionally consistent on what happened next. WARN documents the permanent closure of the Holland and Santa Clara facilities and 95 layoffs across both states. Manufacturing Dive says the shutdown also halted the North Carolina factory plan. TechCrunch describes investors refusing to release more money and Sherwood Partners liquidating the company via an assignment for the benefit of creditors. Energy-Storage.news adds a sector-level explanation: sodium-ion demand in North America remained small while LFP kept improving on price and density. Taken together, the public evidence points to a working-capital failure inside an already capex-heavy manufacturing strategy.'
