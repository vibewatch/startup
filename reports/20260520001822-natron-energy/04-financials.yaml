- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public status today
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue by stream
    - Needed to separate hardware, system, and any service revenue
    - Not disclosed
    - No clean revenue model can be built
    - Obtain audited revenue bridge by product, system, and service line
  - - Realized ASP and discounts
    - Needed to test pricing power versus lithium-ion and lead-acid alternatives
    - Not disclosed
    - Cannot convert product claims into monetization quality
    - Request invoices, price books, discount schedules, and channel terms
  - - Gross margin / contribution margin
    - Needed to evaluate whether Natron's chemistry and manufacturing story created financeable economics
    - Not disclosed
    - No margin model; no payback or EBITDA bridge
    - Request product-level gross margin, warranty reserves, and factory cost absorption
  - - Cash on hand, debt, and monthly burn
    - Needed to explain runway and how much capital would have prevented shutdown
    - Not disclosed publicly before closure
    - No reliable runway model despite obvious late-stage distress
    - Request cash ledger, debt schedule, and weekly liquidity forecast
  - - Backlog conversion and customer concentration
    - Needed to judge whether the $25M booked-order datapoint was scalable and durable
    - Only a single late-stage booked-orders figure is public
    - No visibility into concentration, churn, or execution quality
    - Request top-customer backlog, order aging, and shipment conversion history
  - - Valuation and security terms
    - Needed to compare Natron against public storage and power-equipment comps responsibly
    - Not disclosed
    - No clean valuation model; any multiple choice is arbitrary
    - Request last-round term sheet, cap table, preference stack, and board valuation materials
  notes: 'This table is the core deliverable for Natron''s financial chapter: public disclosure is too thin and too inconsistent for a clean model, so the right answer is an explicit list of the missing inputs.'
