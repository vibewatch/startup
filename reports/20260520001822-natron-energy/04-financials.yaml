- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value or status
  - Source quality
  - Notes
  - Diligence ask
  rows:
  - - Latest database snapshot
    - PitchBook shows latest deal type Series BB, latest deal amount $189M, 200 employees, and “Generating Revenue” status
    - Medium — paywalled database summary
    - Useful but incomplete; does not reconcile to later shutdown reporting
    - Full financing chronology with dates, amounts, and instrument types
  - - Alternative public funding total
    - Latitude reports >$363M raised overall plus a $55.4M April 2025 top-up
    - Medium — independent news reporting
    - Materially conflicts with other public funding snapshots
    - Board-approved cumulative financing ledger and cap table
  - - Current cash on hand
    - Not publicly disclosed
    - Low
    - No public month-end cash balance found before closure
    - Month-end cash and restricted-cash schedule for 2024-2025
  - - Runway / monthly burn
    - Not publicly disclosed; only the late-stage working-capital failure is public
    - Low
    - Public sources show failure outcome but not cash runway math
    - Monthly burn, hiring plan, and cash bridge to shutdown
  - - Committed manufacturing capex
    - Holland retrofit >$40M; North Carolina plan nearly $1.4B
    - High on disclosed projects
    - Scale ambition materially exceeded disclosed locked-in funding visibility
    - Plant-by-plant capex budget and financing plan
  - - Publicly identified incentives
    - Up to $21.747M JDIG reimbursement plus expected $30M megasite grant
    - High on announced support
    - Helpful but small relative to $1.4B plant cost
    - Which incentives were approved, claimed, or contingent
  - - Late-2025 financing attempts and outcome
    - Follow-on equity, new Series B, secured convertible note, management-led proposal, and new orders all failed to prevent closure
    - High on WARN chronology
    - This is the clearest public evidence of capital inadequacy
    - Board decks, term sheets, and 13-week cash forecast around the shutdown
  notes: Capital adequacy cannot be modeled cleanly because public sources disagree on total capital raised and omit cash, debt, and burn. The clearest public financial fact is the August 2025 working-capital failure described in the WARN letter.
