  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: service-revenue
    missingEvidence: Management breakout of service, warranty, spare-parts, and any recurring support revenue attached to Natron deployments.
    whyItMatters: Without an aftermarket revenue line, the chapter cannot judge whether Natron had recurring gross profit beyond initial hardware shipment.
    diligencePath: Request customer contracts, warranty reserve policy, and service attach-rate data by product family.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Audited or management-confirmed revenue-recognition policy showing whether revenue is booked at shipment, installation, commissioning, or over service life.
    whyItMatters: Recognition timing determines whether backlog or booked orders translate into current-period revenue and margin.
    diligencePath: Obtain accounting policy memo, customer invoice examples, and revenue waterfall by quarter.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-by-customer backlog, conversion, and concentration metrics including book-to-bill and backlog aging.
    whyItMatters: The only public backlog datapoint is a late-stage $25 million booked-order figure, which is insufficient to judge revenue durability or concentration risk.
    diligencePath: Request top-customer list, signed purchase orders, shipment status, and backlog conversion by quarter.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Product-level COGS, yield, factory utilization, warranty reserves, and contribution margin by hardware family and deployment type.
    whyItMatters: Gross margin is the single most important test of whether Natron's chemistry and manufacturing claims translated into financeable unit economics.
    diligencePath: Request product P&Ls, standard cost decks, and monthly factory KPI packages for Holland and planned North Carolina operations.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: blocking
    topic: cash-burn
    missingEvidence: Month-end cash, restricted cash, debt, monthly burn, and minimum-liquidity covenant history for the 12 months before closure.
    whyItMatters: The WARN letter proves a working-capital failure but not the burn trajectory, cash runway, or exact amount of capital that would have saved the business.
    diligencePath: Request board materials, cash bridge, weekly 13-week cash-flow forecast, and debt or bridge-financing documents.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: blocking
    topic: valuation
    missingEvidence: Post-money valuation, share count, liquidation preference stack, and terms of the 2024 and 2025 financings.
    whyItMatters: Without security-level financing terms, any comparison to public storage or power-equipment comps becomes arbitrary rather than investable.
    diligencePath: Request cap table, financing term sheets, liquidation stack, and last-round board valuation materials.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
