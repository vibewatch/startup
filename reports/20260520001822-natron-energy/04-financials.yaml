tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Battery pack / module hardware
    - BlueTray and BluePack battery products sold for critical-power and industrial uses
    - Per battery / rack-ready module
    - Products publicly marketed; public shipments began in 2024
    - Medium — clearly commercial product revenue, but no ASP or volume disclosure
    - Revenue by SKU, shipped units, realized ASP, and gross margin by product family
  - - Cabinet / system sales
    - BlueRack cabinets and larger integrated deployments for data centers and industrial power
    - Per cabinet / per deployed system
    - Publicly marketed; cabinet-level pricing not disclosed
    - Medium — likely higher-value than module-only sales, but recognition point unknown
    - Booked system value, revenue-recognition timing, and installed-base count
  - - Site integration / commissioning
    - Engineering, installation, and commissioning revenue attached to deployments
    - Per project / milestone
    - Likely exists structurally; not disclosed separately
    - Low-medium — may matter for revenue timing but not publicly broken out
    - Project milestone schedule, commissioning fees, and pass-through cost treatment
  - - Aftermarket service / warranty / replacements
    - Possible support, spares, and warranty-related monetization after deployment
    - Per contract / per installed fleet
    - Not publicly disclosed as a separate line
    - Low — public materials do not quantify recurring revenue
    - Service attach rate, warranty reserves, spare-parts revenue, and renewal mechanics
  - - Non-dilutive grants and tax support
    - Government awards and incentives that support commercialization but are not durable operating revenue
    - USD per award or credit
    - Publicly evident as capital support, not recurring customer revenue
    - Low — helps financing, not core monetization quality
    - Total grants claimed, accounting treatment, and which credits were actually monetized
  notes: Public evidence supports hardware and integrated-system monetization, but not clean revenue mix or recognition. Grants and tax credits are listed because they matter to funding adequacy, not because they constitute durable customer revenue.
