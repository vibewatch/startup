- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Materials basket
    - 'Commodity inputs highlighted: sodium, iron, manganese, aluminum; no lithium, cobalt, or nickel'
    - Medium
    - Supports the thesis of lower strategic-mineral exposure and potentially lower raw-material volatility
    - Bill of materials, supplier concentration, and material-cost bridge versus lithium-ion incumbents
  - - Manufacturing leverage
    - Natron says it converted existing lithium-ion lines in Holland
    - Medium
    - Line conversion can reduce initial capex versus a fully bespoke process
    - Actual retrofit scope, incremental tooling spend, and resulting yield/throughput
  - - Holland retrofit capital
    - '>$40M spent to upgrade a $300M facility'
    - Medium
    - Factory overhead absorption depends on utilization against that installed base
    - Monthly production, yield, utilization, and fixed-cost absorption by line
  - - Current production base
    - 600 MW annual nameplate output in Holland
    - Medium
    - Small base relative to planned scale-up means overhead and qualification drag matter materially
    - Run-rate output, shipped units, and backlog-to-capacity conversion
  - - Planned next-step capex
    - Nearly $1.4B planned for 24 GW North Carolina plant
    - High
    - Scale-up economics depend on financing and utilization, not just chemistry
    - Detailed North Carolina capex budget, financing plan, and ramp assumptions
  - - Gross margin
    - Not publicly disclosed
    - High
    - Gross margin is the core test of whether Natron's chemistry translates into financeable economics
    - Product P&L, gross margin by SKU, and warranty reserve history
  - - Working-capital intensity
    - Publicly shown only indirectly through failed efforts to fund operations and execute purchase orders
    - Medium
    - Inventory, certification, and order-execution needs can kill a hardware company before margin is proven
    - Cash conversion cycle, inventory days, and working-capital requirement per order dollar
  notes: This table is intentionally honest about what is missing. Public disclosures support a structural unit-economics logic but do not provide the price, yield, utilization, or gross-margin data needed for a true model.
