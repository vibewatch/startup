      - number: '4.2'
        title: Unit economics logic and manufacturing capex intensity
        blocks:
          - type: paragraph
            body: >-
              Natron’s public unit-economics logic is directionally intelligible even though the actual numbers are
              mostly missing. The company’s chemistry avoids lithium, cobalt, and nickel and instead highlights abundant
              inputs such as sodium, iron, manganese, and aluminum. It also touts the ability to retrofit existing
              battery-manufacturing equipment: in Holland, Michigan, Natron said it spent more than $40 million to
              upgrade a $300 million facility by converting lithium-ion lines to sodium-ion production. Those two
              disclosures support the basic bullish thesis — commodity-material inputs plus line-conversion leverage
              should lower variable cost and reduce the greenfield burden relative to building an entirely bespoke
              process from scratch.


              But the same public record shows why that thesis was not enough. Battery economics for Natron depend not
              only on the bill of materials, but also on factory utilization, labor and overhead absorption,
              certification timing, yield, warranty exposure, inventory turns, and the length of customer qualification
              cycles. Natron’s public record discloses none of the standard outputs of that cost structure: no gross
              margin, no contribution margin, no service cost, no warranty reserve, no CAC or payback, and no realized
              price. That makes the “cheap abundant materials” argument necessary but not sufficient for underwriting.


              The manufacturing buildout sharply increases the burden. Holland’s 600 MW annual capacity is meaningful
              for first commercialization, but the planned North Carolina step-up to 24 GW and nearly $1.4 billion of
              project cost means the financial model quickly becomes one of capital deployment and utilization, not just
              chemistry. NREL’s long-duration storage work and Energy-Storage.news’s closure coverage both underscore
              the same problem: alternative chemistries must win on total system economics while lithium-ion and
              especially LFP continue to improve on cost and density. Without published ASP, yield, utilization, or
              gross-margin data, Natron’s public unit-economics case remains structural rather than model-ready.
            claimRefs:
              - CI019
              - CI020
