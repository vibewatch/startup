      - number: '7.3'
        title: Competition, substitution, and dependency risk narrowed Natron's strategic wedge
        blocks:
          - type: paragraph
            body: >-
              Natron was not trying to enter an empty market. It was trying to carve out a high-power, short-duration
              wedge inside segments already served by established critical-power and storage vendors while also
              competing against a moving lithium-based benchmark. Grand View sized the global data-center UPS market at
              more than $4 billion in 2024 and explicitly listed incumbents such as Vertiv and Eaton among key
              suppliers, while EnerSys already marketed reserve-power and data-center products. Fluence, meanwhile,
              marketed large-scale storage and AI-oriented power strategies with far more deployment depth than Natron
              ever disclosed. Independent sodium-ion coverage made the substitution risk even sharper:
              Energy-Storage.news cited analysts expecting only 3–4 GWh of North American sodium-ion demand by decade
              end and warned that domestic LFP progress could erase that window, while both TechCrunch and ESS News
              emphasized that falling lithium and improving LFP economics were raising the hurdle for alternative
              chemistries. NREL's storage work also reinforces that the most attractive long-duration opportunities do
              not automatically map to a two-minute, high-power product. Natron therefore depended on a narrow
              commercial wedge, supportive policy, and unusually fast scaling all arriving together.
