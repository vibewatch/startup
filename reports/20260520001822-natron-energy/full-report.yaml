  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Natron’s public customer record is strongest on use-case specificity and weakest on revenue and retention
      visibility.
    data:
      columns:
        - Production maturity
        - Outcome specificity
        - Revenue visibility
        - Retention visibility
      rows:
        - label: Data-center customers (unnamed)
          values:
            - label: medium
              tone: neutral
              detail: Initial shipments were publicly announced but operators were not named.
            - label: medium
              tone: neutral
              detail: Critical-power and AI-load use case is clear.
            - label: low
              tone: warning
              detail: No operator names, contract values, or install counts.
            - label: low
              tone: warning
              detail: No renewals, churn, or cohort metrics.
        - label: United Airlines Ventures
          values:
            - label: low
              tone: warning
              detail: Use cases are prospective rather than deployed.
            - label: high
              tone: positive
              detail: Airport ground equipment and gate operations are specifically named.
            - label: low
              tone: warning
              detail: Investment is public, but order value is not.
            - label: low
              tone: warning
              detail: No repeat-purchase disclosure.
        - label: Chevron / Nabors
          values:
