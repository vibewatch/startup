  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and wedge selection
        blocks:
          - type: paragraph
            body: >-
              Natron’s public customer record is strongest on segment fit rather than account disclosure. Current and
              archived official pages consistently position the company around short-duration critical power and
              industrial power-quality jobs: AI or data-center backup power, peak shaving, power quality management,
              immediate high-load support, and hybrid generator use. The industrial materials extend beyond generic
              factory loads into oil and gas exploration, diesel displacement, and utility peak avoidance, while the
              microgrids page explicitly says Natron is not a long-duration standalone BESS chemistry. That narrows the
              likely buyer set to operators whose outage cost, fuel savings, or safety requirement can justify a
