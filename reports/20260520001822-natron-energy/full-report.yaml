  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, unicorn check, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Natron is not an active underwriting candidate as of 2026-05-20. The public record says the company
              permanently closed its Holland and Santa Clara facilities in early September 2025, failed to secure enough
              new funding to cover working capital and operating expense, and is being liquidated through an assignment
              for the benefit of creditors. Independent trade coverage from Data Center Dynamics reinforces the same
              conclusion. That pushes the present-tense investment question away from growth equity and toward a legacy
              asset or claims-recovery question. For a new investor, there is no live financing process, no operating
              continuity, and no disclosed price at which fresh equity can be underwritten.


              The requested unicorn check fails on the evidence. No reviewed public source verifies a Natron equity
              valuation of $1 billion or more on or after 2024-05-20. PitchBook shows a latest deal amount of $189
              million but no public post-money figure. Latitude reports total capital raised above $363 million and a
              $55.4 million top-up to the Series F, again without a verified unicorn post-money. The widely repeated
              $1.4 billion number comes from Natron’s August 2024 North Carolina factory announcement and refers to
              project capex for a 24 GW site, not to Natron’s equity value.


              That combination leads to a blunt conclusion. Recommendation: no-go / avoid for new money. Confidence:
              medium-high on the directional call, because the shutdown and liquidity failure are well corroborated; low
              on any residual equity value, because the estate sale, debt, and preference stack are undisclosed. Risk
              rating is effectively critical, and valuation stance is best described as unsupported or unknown rather
              than merely expensive. Natron’s own commercial-only page underscores that there is no public-investment
              route to underwrite anyway. Until estate-sale terms or a funded restart emerge, Natron belongs in a legacy
              diligence bucket, not an active investment queue.
            claimRefs:
