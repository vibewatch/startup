      - number: '8.2'
        title: 'Method selection: what can still be valued honestly'
        blocks:
          - type: paragraph
            body: >-
              Natron did achieve real commercialization milestones before failing. The Holland plant opened in 2024,
              Natron said it had invested more than $40 million to retrofit the site, and the company positioned that
              facility as the first commercial-scale sodium-ion plant in the United States with 600 MW of annual
              capacity. Natron also had a UL-listed BlueTray product, marketed BluePack and BlueRack configurations for
              commercial and industrial users, attracted strategic backers such as United Airlines, and even reached at
              least one university-led EV fast-charging demonstration. Those facts mean the business was not vaporware;
              there was genuine product, certification, and manufacturing progress.


              But the same record shows why most classic valuation methods should be rejected. Revenue-multiple
              underwriting fails because Natron never published verified revenue, gross margin, backlog conversion, or
              customer concentration, and because the company is no longer operating. DCF or project-finance approaches
              fail because there is no supported operating forecast and because the creditor stack, preference
              waterfall, and estate-sale path are undisclosed. Replacement-cost reasoning also misleads: the North
              Carolina site’s nearly $1.4 billion budget measures what a huge future plant might have cost to build, not
              what Natron’s equity was worth.


              That leaves only two honest lenses. The first is a liquidation or strategic-asset-sale lens, which is the
              right present-tense frame but is blocked by missing waterfall data. The second is public-multiple
              triangulation, but only as a framing band to test whether a unicorn claim is even plausible. NREL’s
              long-duration-storage work is a reminder that storage value is application-, duration-, and
              system-dependent, not a simple premium that can be pasted onto Natron. Public-multiple framing is
              therefore not a real Natron valuation, because the operating inputs needed to connect Natron to any
              revenue or EBITDA multiple are missing.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV040
              - CV044
              - CV045
              - CV052
              - CV054
      - number: '8.3'
        title: Public comps are a framing band, not a Natron valuation
        blocks:
          - type: paragraph
            body: >-
              The comp set is useful mainly because it shows how little precision is available. Across public names
              touching energy storage or critical power, the market-cap-to-revenue range runs from about 0.5x at Stem to
              about 1.3x at Fluence and 2.1x at EnerSys, then up to about 4.2x at tiny ESS Tech, about 5.1x at Eaton,
              11.4x at Vertiv, and an extreme 21x at Eos. QuantumScape adds a different warning: a pre-revenue battery
              developer can hold a multibillion-dollar market cap for option value, but that says more about
              public-market narrative appetite than about what a shut-down Natron should be worth.


              That dispersion is exactly why public multiples can only frame the conversation. Fluence, Stem, and ESS
              Tech are storage-related public operators with very different scale, distress, and financing profiles.
              EnerSys and Eaton are mature disclosed incumbents. Vertiv is a data-center power winner with a much
              broader product set and strong AI sentiment. Eos is a volatile alternative-chemistry outlier. The filing
              history of Eaton and EnerSys also highlights the disclosure-quality gap: those companies publish full
              10-Ks, while Natron never supplied the public revenue, margin, or balance-sheet data needed to place it
              reliably on the same spectrum.


              The framing-band implication is still useful for the unicorn question. Natron’s last public commercial
              signal was $25 million of booked orders. Even applying a generous 1x to 4x revenue-style framing band to
              that signal yields only about $25 million to $100 million. To reach $1 billion, Natron would need
              something like $250 million of annual revenue at 4x or $100 million at a 10x multiple. No reviewed public
              source verifies either revenue level, and no reviewed public source verifies the post-money valuation
              required to bridge the gap.
            claimRefs:
