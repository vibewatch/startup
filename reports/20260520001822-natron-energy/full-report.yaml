        title: Pricing visibility and packaging favored scale players over chemistry specialists
        blocks:
          - type: paragraph
            body: >-
              The commercial problem for Natron was not just proving that sodium-ion could work; it was proving that a
              narrow critical-power battery could beat a full-system offer on total solution cost. Public pricing
              transparency was weak across the peer set, but Natron was particularly opaque. The clearest public pricing
              signal was a qualitative one: management told Energy-Storage.news that its products would be
              price-competitive with other chemistries as scale improved, without publishing any list price, realized
              price, or customer case showing the delta versus lithium UPS alternatives. That leaves buyers comparing a
              chemistry narrative against incumbent bundles.


              This matters because the market Natron targeted is not tiny. Grand View sized the data-center UPS market
              at $4.04 billion in 2024 and projected $6.27 billion by 2030, with centralized UPS still the dominant
              configuration. Data Center Frontier's buyer survey said operators prioritize long life, reliability,
              sustainability, safety, and lifetime cost. Those decision criteria favor vendors that can prove uptime
              economics, not just chemistry novelty. Meanwhile Mordor highlighted how lithium-ion already held the
              largest industrial-battery share and how Chinese LFP costs kept falling. Peak and Eos show the adjacent
              stationary tradeoff clearly: both sell broader resilience or grid value, but neither is trying to win on
              Natron's two-minute UPS niche. Natron therefore needed unusually strong price proof, and public evidence
              never got there.
