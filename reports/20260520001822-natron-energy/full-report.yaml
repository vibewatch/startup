  - id: FV001
    title: Recommendation logic flow
    type: flow
    layout: wide
    summary: >-
      The decision path runs from real commercialization proof through shutdown, unicorn-evidence failure, and method
      rejection to a no-go recommendation.
    data:
      nodes:
        - id: n1
          label: Commercial proof
          detail: UL-listed product, Holland plant, 600 MW capacity claim, strategic investors
        - id: n2
          label: Capital intensity
          detail: $40M Holland retrofit plus planned $1.4B / 24 GW North Carolina step-up
        - id: n3
          label: Shutdown evidence
          detail: WARN, Latitude, TechCrunch, and Manufacturing Dive confirm 2025 closure and liquidity failure
        - id: n4
          label: Unicorn check
          detail: No credible public evidence of $1B+ post-money on or after 2024-05-20; $1.4B is factory capex
        - id: n5
          label: Valuation method
          detail: Use liquidation lens or comp framing only; reject revenue, EBITDA, and DCF precision
        - id: n6
          label: Recommendation
          detail: No-go / avoid; legacy diligence case until estate terms or funded restart emerge
      edges:
        - from: n1
          to: n2
          label: still needed scale-up funding
        - from: n2
          to: n3
          label: stressed balance sheet
        - from: n3
          to: n4
          label: forces evidence reset
        - from: n4
          to: n5
          label: removes unicorn support
        - from: n5
          to: n6
          label: sets decision
    approximationNotes: This figure is qualitative decision logic, not a mechanical scorecard.
    claimRefs:
      - CV003
      - CV006
      - CV039
      - CV040
      - CV044
      - CV047
  - id: FV002
    title: Valuation sensitivity bar
    type: bar
    layout: standard
    summary: >-
      Illustrative revenue-multiple sensitivity shows how far Natron’s last public commercial signal sits below a
      unicorn threshold.
    data:
      items:
        - label: $25M orders @ 1x
          value: 25
          unit: USD m
          detail: Booked-order anchor with distressed low-end framing
        - label: $25M orders @ 4x
          value: 100
          unit: USD m
          detail: Generous mature-operator framing on Natron’s last public order signal
        - label: $100M revenue @ 4x
          value: 400
          unit: USD m
          detail: Still well below unicorn territory
        - label: $100M revenue @ 10x
          value: 1000
          unit: USD m
          detail: Requires an upper-bound public multiple and verified scale that Natron never disclosed
        - label: $250M revenue @ 4x
          value: 1000
          unit: USD m
          detail: Shows the revenue scale needed to reach $1B at a more ordinary premium multiple
        - label: Observed public proof
          value: 25
          unit: USD m orders
          detail: Only hard public commercial signal near shutdown
    approximationNotes: >-
      Bars are framing math only. Natron did not disclose verified revenue at these levels, and booked orders are not
      the same as realized revenue.
    claimRefs:
      - CV014
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: Valuation / range
    type: range
    layout: standard
    summary: >-
      Three framing bands show how far observed public signals sit from a unicorn threshold; these are not live Natron
      valuations.
    data:
      items:
        - label: Booked-order framing
          low: 25
          mid: 62.5
          high: 100
          unit: USD m
          note: Applies 1x to 4x framing to the last public $25M booked-order signal
        - label: Illustrative disclosed-scale framing
          low: 100
          mid: 250
          high: 400
          unit: USD m
          note: 'Illustrative only: what $100M of verified revenue could imply at 1x to 4x'
        - label: Unicorn threshold requirement
          low: 1000
          mid: 1000
          high: 1000
          unit: USD m
          note: Requires either $250M revenue at 4x or $100M at 10x, neither publicly verified
    approximationNotes: >-
      The first band is anchored to a real public order figure; the latter two are hypothetical framing thresholds used
      to test the plausibility of a $1B claim.
    claimRefs:
      - CV014
      - CV039
      - CV040
      - CV042
      - CV043
  - id: FV004
    title: Investment KPI scorecard
    type: kpi
    layout: standard
    summary: >-
      Seven investment-committee KPIs summarize why Natron remains strategically interesting but uninvestable from
      public evidence in 2026.
    data:
      items:
        - label: Technology differentiation
          value: 3
          unit: /5
          note: Real chemistry and safety differentiation, but not enough to overcome commercialization failure
        - label: Commercial proof
          value: 2
          unit: /5
          note: Factory, UL listing, and orders existed, but disclosed revenue traction stayed thin
        - label: Market tailwind
          value: 3
          unit: /5
          note: Data-center and industrial battery demand are real, but competition remains intense
        - label: Financing resilience
          value: 1
          unit: /5
          note: Documented liquidity failure and liquidation dominate the score
        - label: Disclosure quality
          value: 1
          unit: /5
          note: No public cap table, margin, debt, or verified revenue support
        - label: Comparable support
          value: 2
          unit: /5
          note: Comps help reject a unicorn claim but do not produce a real Natron valuation
        - label: Investability today
          value: 1
          unit: /5
          note: No-go / avoid until estate-sale terms or funded restart become public
    approximationNotes: Scores are analyst judgment based on public evidence as of runDate, not audited operating KPIs.
    claimRefs:
      - CV017
      - CV019
      - CV020
      - CV044
      - CV045
      - CV047
      - CV048
