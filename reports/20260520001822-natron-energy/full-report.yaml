  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Natron's wedge was real, but it was narrower than the broader sodium-ion race
        blocks:
          - type: paragraph
            body: >-
              Natron was not trying to be a generic grid battery vendor. Its own materials centered on critical-power
              and industrial jobs where very high power, immediate recharge, and fire safety matter more than four-hour
              duration or commodity energy density. BluePack and BlueRack were pitched around a two-minute discharge
              window, under-fifteen-minute recharge, and a Prussian-blue chemistry that Natron argued could avoid
              thermal runaway while surviving more than 50,000 cycles. That is a sharp wedge for UPS-style duty cycles,
              telecom-style resilience, and industrial peak shaving.


              The direct sodium-ion peer set pursued a broader commercialization path. CATL tied sodium-ion to both
              transport and energy-storage applications and emphasized manufacturability on lithium-compatible lines,
              which matters because scale can arrive without a wholly new factory stack. HiNa likewise framed sodium-ion
              as a multi-application platform spanning large-scale storage and vehicles. Peak is closer to Natron on the
              U.S. alternative-chemistry story, but its product thesis is explicitly grid-scale stationary storage, not
              two-minute critical-power runtime. The practical result is that Natron entered the market with a credible
              technical wedge, but against peers already chasing larger addressable-volume pools than industrial UPS
              alone.
