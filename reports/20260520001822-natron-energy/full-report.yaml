companyProfile:
  summary: >-
    Natron Energy was a private U.S. sodium-ion battery company founded in 2012 and centered in Santa Clara, California,
    with products for short-duration critical-power and industrial applications plus a commercial-scale plant in
    Holland, Michigan. The company reached real product, certification, and manufacturing milestones, but by September
    2025 it had shut down and entered liquidation or asset-sale mode. As of 2026-05-20, Natron is best understood as a
    legacy case with interesting technology history rather than an active venture underwriting opportunity.
  foundedDate: '2012-01-01'
  founders:
    - name: Colin Wessells
      role: Founder and co-CEO
      background: Publicly visible founder who led Natron's chemistry commercialization and 2024 factory scale-up narrative.
      claimRefs:
        - CO014
  foundingLocation: Santa Clara, California
  headquarters: Santa Clara, California
  productSummary: >-
    Natron sold Prussian-blue sodium-ion battery products including BluePack, BlueRack, and BlueTray systems for
    short-duration critical power, industrial peak shaving, telecom, microgrid, EV fast-charging, and related high-power
    applications.
  customerFocus: >-
    Commercial and industrial operators that need short-duration critical power, power quality management, peak shaving,
    telecom backup, EV fast charging, and other mission-critical high-power deployments.
  businessModel: >-
    Direct enterprise sales of battery hardware and integrated commercial or industrial power systems rather than a
    publicly disclosed recurring-software model.
  stage: post-shutdown private legacy case
  fundingStatus: >-
    Public sources support more than $363 million raised in total, including a publicly visible $189 million later-stage
    round amount in January 2024 and a reported $55.4 million top-up before shutdown, but no verified post-money
    valuation is public.
