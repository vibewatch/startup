      - number: '3.4'
        title: Natron had a product moat, but the moat was not durable once capital and channel scale failed
        blocks:
          - type: paragraph
            body: >-
              Natron's feature edge was real: nonflammable chemistry, very high cycle life, and recharge speed that
              mapped well to short-duration critical-power events. The issue is that those strengths were never enough
              to clear the scale and channel gauntlet. Natron's actual 2024 production footprint was a 600 MW Michigan
              plant, while its 24 GW North Carolina plan remained aspirational. By late August 2025 the company had
              exhausted multiple financing paths, and the board opted for a permanent shutdown. That timing matters
              because the same period saw analysts arguing that North American sodium-ion demand could remain only 3-4
              GWh by the end of the decade and that LFP's price and density improvements were shrinking the value of
              Natron's 50,000-cycle advantage.


              That combination makes Natron's moat look brittle in hindsight. If the company were still operating, the
              key diligence questions would be channel coverage, realized pricing, and whether customers were willing to
              swap incumbent UPS ecosystems for a single-purpose sodium-ion battery. After the shutdown, durability
              worsens further because IP control, service continuity, and installed-base support all become uncertain.
              CATL and BYD can absorb chemistry improvements into massive manufacturing systems, while Eaton, Vertiv,
              and EnerSys can absorb battery changes into entrenched procurement, service, and controls relationships.
              Natron won the chemistry argument in a narrow niche, but it lost the scale race and therefore lost the
              moat.
