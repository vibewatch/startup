figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Natron’s public record moved from early chemistry and certification milestones into 2024 manufacturing scale-up
      and then into a documented shutdown and liquidation by September 2025.
    data:
      items:
        - date: '2012-01-01'
          label: Founded
          detail: Natron began operations as a sodium-ion battery startup.
          tone: positive
        - date: '2020-09-24'
          label: UL listing
          detail: BlueTray 4000 became the first publicly cited UL-listed sodium-ion battery.
          tone: positive
        - date: '2022-06-01'
          label: United investment
          detail: United Airlines announced a strategic equity investment.
          tone: positive
        - date: '2024-04-28'
          label: Holland opens
          detail: Natron announced commercial-scale production in Michigan.
          tone: positive
        - date: '2024-08-15'
          label: NC gigafactory announced
          detail: Edgecombe County plan called for 24 GW annual output and $1.4B capex.
          tone: positive
