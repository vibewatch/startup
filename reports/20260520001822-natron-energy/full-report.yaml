  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Liquidity and refinancing failure is the core risk because it already happened
        blocks:
          - type: paragraph
            body: >-
              Natron should be underwritten from the fact pattern of a failed financing, not from the hope that future
              execution could have saved it. The August 2025 WARN notice is unusually explicit: management had been
              pursuing follow-on money from existing stockholders, a new equity round, a secured convertible note, a
              management-led capital proposal, and new purchase orders, and the board concluded on August 27 that those
              efforts had failed. The stated reason for shutdown was not abstract macro pressure; it was the inability
              to raise enough additional working capital and operating cash to execute the purchase orders already in
              hand. That distinction matters because it converts “funding risk” into a proven inability to bridge
              backlog into revenue. Press coverage then sharpened the same point: Sherwood Partners moved toward an
              asset sale, TechCrunch described an assignment-for-the-benefit-of-creditors process rather than an orderly
              growth recapitalization, and closure followed only about a year after Natron publicly launched its North
              Carolina megaproject. Battery-Tech then summarized the employee memo as an explicit end to current and
              future order fulfillment while Sherwood prepared asset sales, and Tiger Group later marketed a November
              2025 auction to liquidate roughly USD 74 million of equipment from the closed Santa Clara and Holland
              facilities. In diligence terms, the company's most important risk channel was financing-to-fulfillment,
              and it broke decisively.
            claimRefs:
