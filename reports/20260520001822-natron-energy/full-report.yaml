  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the use cases Natron actually serves
        blocks:
          - type: paragraph
            body: >-
              Natron should not be underwritten against all stationary storage or the full long-duration energy storage
              narrative. The company’s own materials consistently define a power-first battery for critical power and
              industrial applications: AI and data-center backup, power quality, seconds-to-minutes peak shaving,
              generator hybridization, and similar high-cycle jobs where immediate discharge and rapid recharge matter
              more than sustained multi-hour output. The sharpest boundary line comes from Natron’s own microgrid/BESS
              page, which explicitly says the product is not suited for long-term energy discharge or use by itself in a
              BESS system. That means included spend is data-center UPS, industrial power-quality and peak-load
              management, telecom or other mission-critical backup, and selected high-power adjacencies such as EV fast
              charging. Excluded spend includes long-duration renewable firming, four-hour grid batteries bought mainly
              for daily arbitrage, and residential or commercial capacity-oriented battery packs. This distinction
              matters because Natron’s value proposition is about power density, recharge speed, and safety under
              mission-critical cycling, not about storing solar generation for hours or days.
