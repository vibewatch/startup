            body: >-
              Public leadership disclosure is thinner than Natron’s product messaging but still adequate for a
              chapter-one operating picture. Business Wire releases in 2024 identify founder Colin Wessells and co-CEO
              Wendell Brooks as the executive faces of the Michigan scale-up and North Carolina expansion.
              Shutdown-period reporting adds two more named operators: chief commercial officer John Schmidt, who
              communicated that booked orders would not be fulfilled, and Elizabeth Shober, who signed the WARN notice
              as head of team and talent. What remains missing is exactly what private-company diligence would normally
              want next: a current board roster, board-seat allocation, and investor control-rights map. Capital
              formation is also only partially public. Natron disclosed a $35 million 2020 round, but its own 2020
