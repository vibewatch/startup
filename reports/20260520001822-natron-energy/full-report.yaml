    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Natron’s retained official pages make the company’s market identity unusually clear. The homepage
              describes Natron as a supplier of critical-power and industrial batteries for high-powered use cases such
              as AI data centers, peak shaving, and power quality management, while the company/contact page explicitly
              says Natron is privately held and does not offer public stock or consumer investment access. The same
              official materials narrow the company’s product scope: Natron sells into commercial and industrial
              applications, not residential or DIY uses, and its data-center, industrial, and microgrid pages repeatedly
              frame the chemistry around short-duration, high-power discharge rather than long-duration standalone
              storage. The operating-footprint evidence is also concrete. Natron’s retained homepage source lists Santa
              Clara, California and Holland, Michigan addresses, and the manufacturing page says Holland opened in 2024
              with a future gigafactory planned for Edgecombe County, North Carolina. That combination supports treating
              Natron as a private U.S. industrial battery manufacturer with a narrow, mission-critical-power orientation
              rather than a broad consumer battery brand.
