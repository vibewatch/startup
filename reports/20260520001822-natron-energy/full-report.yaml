      - number: '8.4'
        title: Legacy scenarios, exit reality, and next steps
        blocks:
          - type: paragraph
            body: >-
              The only sensible scenario analysis now is a legacy-case scenario analysis. In a bull legacy case, a
              strategic buyer pays meaningful value for Natron’s UL-listed product, sodium-ion intellectual property,
              tooling, and U.S. manufacturing know-how, potentially preserving some estate value. In a base legacy case,
              the assignment-for-benefit-of-creditors process produces an asset sale, but secured claims, administrative
              costs, and preference overhang absorb most of the proceeds. In a bear legacy case, the estate is sold
              piecemeal with little strategic premium and common equity is effectively wiped out. Because the waterfall
              is not public, those scenarios are useful as directional decision logic rather than as audited values.


              Exit readiness for a normal venture investor is therefore absent. There is no credible IPO path, no
              disclosed ongoing financing round, and no public price discovery process. What remains are diligence
              blockers: estate-sale terms, debt and priority claims, the cap table and preference stack, audited revenue
              and gross margin before closure, and evidence that any buyer is willing to fund a restart rather than
              simply buy assets. Those are not minor missing cells in a model; they are the difference between a real
              valuation exercise and an evidence gap.


              Accordingly, the right next step is not to stretch toward a synthetic target price. It is to monitor the
              estate process, asset-sale outcomes, and any restart financing. If those appear, the file can be reopened.
              Until then, Natron should be treated as a legacy technology case with strategic lessons and limited
              valuation usefulness, not as an underwritable startup opportunity.
            claimRefs:
