      - number: '1.4'
        title: Shutdown, liquidation, and the explicit valuation evidence gap
        blocks:
          - type: paragraph
            body: >-
              The 2024 expansion story does not survive contact with the 2025 adverse record. Natron’s WARN letter says
              the board determined on 2025-08-27 that fundraising efforts had failed and that the Holland and Santa
              Clara facilities would permanently close on 2025-09-03, affecting 95 employees across both states.
              Independent coverage quickly moved beyond “layoffs” into “shutdown” and “liquidation.” Manufacturing Dive
              and Data Center Dynamics reported that the company had ceased operations and halted its North Carolina
              factory plan, while Latitude Media and TechCrunch reported that Sherwood Partners was seeking to sell
              assets and that the wind-down was proceeding through an assignment for the benefit of creditors. That
              evidence is strong enough to state clearly that Natron remained private but shut down and entered
              liquidation by September 2025. It also sharpens the chapter’s biggest requested evidence gap. Public
              sources after 2024-05-20 do not verify a $1 billion-plus company valuation. PitchBook masks valuation,
              public reporting focuses on plant plans and shutdown mechanics, and the $1.4 billion North Carolina number
              is factory capex only. The correct chapter-one stance is therefore private company, shutdown/liquidation
              confirmed, unicorn status publicly unverified.
