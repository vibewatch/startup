      - number: '2.4'
        title: Competitive dynamics versus lithium-ion, lead-acid, nickel-zinc, and other sodium-ion routes
        blocks:
          - type: paragraph
            body: >-
              Natron’s competitive set is broader than “other sodium-ion startups.” The first and largest incumbent is
              lithium-ion, which still holds the cost, scale, and buyer-familiarity advantage across industrial
              batteries and almost all current U.S. stationary deployments. Lead-acid remains important because VRLA
              still serves a large installed UPS base and ranks well with buyers on familiarity and upfront cost, even
              though lifecycle economics are moving against it. Nickel-zinc is a more direct critical-power alternative:
              the Data Center Frontier survey shows it ranking strongly on safety and cost perceptions, and ABB’s
              integration of ZincFive batteries into MegaFlex proves it is already embedded in the UPS channel. Natron
              argues its sodium-ion chemistry avoids cooling delays, fire risk, and some mineral constraints found in
              lithium-ion, lead-acid, and nickel-zinc systems, but those are still largely vendor-led claims. Other
              sodium-ion approaches also differ materially from Natron. CATL and BYD push toward broader energy-storage
              and scalable capacity applications, while Peak Energy and HiNa are much closer to grid-scale stationary
              storage. Natron is therefore not merely competing as “a sodium-ion company”; it is competing for the
              subset of buyers who value ultra-fast recharge and high power more than cheap multihour energy capacity.
