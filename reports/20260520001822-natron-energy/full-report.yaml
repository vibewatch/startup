  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The public customer funnel runs from clear segment demand into strategic pilots and initial shipments, then breaks
      at named-operator and renewal proof before ending in non-fulfillment after shutdown.
    data:
      nodes:
        - id: segment
          label: Segment demand
          detail: Data-center UPS and industrial power buyers value safety, fast recharge, and short-duration power.
          tone: positive
        - id: strategic
          label: Strategic intro / demo
          detail: United, UCSD, Chevron, and Nabors create access and validation pathways.
          tone: positive
        - id: shipment
          label: Initial shipments / booked orders
          detail: Natron announced June 2024 shipments and later had a reported USD 25M order book.
          tone: neutral
        - id: named
          label: Named production deployment
          detail: Public disclosure rarely names operators, live sites, or contract values.
          tone: warning
        - id: retention
          label: Retention and expansion
          detail: NRR, churn, renewals, and concentration were never publicly disclosed and shutdown halted fulfillment.
          tone: negative
      edges:
        - from: segment
          to: strategic
        - from: strategic
          to: shipment
        - from: shipment
          to: named
        - from: named
          to: retention
    approximationNotes: null
    claimRefs:
      - CU009
