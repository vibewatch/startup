  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The decisive downside path ran from failed financing and incomplete shipment readiness into undelivered orders,
      factory closure, and liquidation.
    data:
      nodes:
        - id: r1
          label: Funding failure
          type: input
        - id: r2
          label: Certification / shipment gap
          type: input
        - id: r3
          label: 40x scale-up overreach
