  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Natron’s customer path started with segment pain and safety needs, moved through strategic-intro or demo wedges,
      and then stalled before durable public expansion proof emerged.
    data:
      nodes:
        - id: need
          label: Mission-critical need
          detail: Buyer starts from outage cost, peak-load pain, fuel savings, or safety constraints.
          tone: neutral
        - id: wedge
          label: Wedge selection
          detail: >-
            Natron targets data-center critical power, industrial power quality, airport ground support, and EV fast
            charging.
          tone: positive
        - id: access
          label: Strategic access
          detail: United, Chevron, Nabors, ABB, and UCSD provide credibility, introductions, or proving-ground visibility.
          tone: positive
        - id: deploy
          label: Initial deployment
          detail: Public proof reaches shipments, demos, or prospective use cases, but rarely names paying operators.
          tone: warning
        - id: durable
          label: Durable expansion
          detail: Renewals, concentration, and post-pilot conversion stay undisclosed and were overtaken by shutdown risk.
          tone: negative
    approximationNotes: null
    claimRefs:
      - CU001
      - CU004
      - CU014
      - CU018
      - CU028
      - CU031
      - CU033
