              Chevron, and Khosla among investors in 2024; PitchBook listed a $189 million later-stage round in January
              2024; and Latitude Media later reported more than $363 million raised overall plus a $55.4 million top-up
              before shutdown. That is enough to map visible stakeholders, but not enough to verify ownership,
              liquidation seniority, or current valuation.
