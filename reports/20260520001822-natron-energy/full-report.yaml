  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Prussian-blue chemistry and product architecture
        blocks:
          - type: paragraph
            body: >-
              Natron's product story starts with chemistry, and the company has been unusually consistent about the
              mechanism it wants customers to believe matters. Official pages say Natron uses a patented Prussian-blue
              electrode family with sodium ions moving through large cubic pores, enabling fast intercalation, low
              internal resistance, and a so-called "zero strain" charge-discharge mechanism. That is a clear and
              specific technical claim, not generic battery marketing. It also explains why Natron consistently
              positions itself around high power, rapid recharge, and short-duration duty cycles rather than around the
              highest energy density or long-duration storage.


              The evidence quality is mixed. Natron's own chemistry page and product surfaces provide the mechanism
              narrative, and Energy-Storage.news repeated the same explanation while explicitly noting that zero strain
              should not be read as zero degradation. In other words, there is some external repetition of the
              mechanism, but this source pack does not contain a peer-reviewed Natron cell paper or an independent
              degradation dataset that would let diligence verify the 50,000-cycle claim on a product-by-product basis.
              The right reading is therefore: the Prussian-blue mechanism is technically plausible and clearly
              articulated, but most performance implications remain company-claimed rather than independently
              benchmarked.


              That chemistry maps into a layered hardware stack rather than a software-led platform. Natron's disclosed
              architecture runs from Prussian-blue sodium-ion cells and modules up into BlueTray 4000 rack packs,
              BluePack critical-power batteries, and BlueRack 250 cabinets or larger integrated systems. It is also a
              deliberately bounded architecture. Natron's own industry pages say the company does not sell into
              residential or DIY use cases and that its batteries are designed for commercial and industrial
              deployments. This chapter therefore treats Natron as a specialized high-power electrochemical hardware
              company, not as a general-purpose energy-storage vendor.
            claimRefs:
