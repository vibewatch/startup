      - number: '5.2'
        title: Product stack, operating fit, and use-case boundaries
        blocks:
          - type: paragraph
            body: >-
              Natron's marketed stack breaks into three named products with a consistent operating philosophy. BlueTray
              4000 is the most concrete SKU in the public record: a rack-mounted 48 VDC battery pack marketed at 4 kW
              over a two-minute discharge with 6 kW peak power. BluePack is the critical-power battery that official
              pages tie to 25 kW / 48-volt systems and rapid recharge, while BlueRack 250 is the cabinet-level scaling
              wrapper that Natron describes as ranging from 25 kW to multi-megawatt deployments. Across all three, the
              pitch is the same: deliver very high power for short durations, recharge in roughly 15 minutes, avoid
              thermal settling and active cooling, and repeat the cycle many times.


              The use-case fit follows directly from that architecture. Natron's official pages place the products into
              data-center critical power, industrial peak shaving and power-quality management, EV fast charging,
              microgrids, telecom, and hybridized generator systems. Just as important, Natron also describes where the
              stack does not fit. The microgrid/BESS page explicitly says the chemistry is not suited to long-term
              energy discharge and should not be used by itself as a long-duration BESS. That is a valuable boundary
              condition because it reduces the risk of diligence reading Natron as a generic substitute for LFP
              energy-storage systems.


              Independent validation exists, but only around selected workflows. UC San Diego's Center for Energy
              Research described a real-world 400VDC Natron deployment at commercial EV fast chargers and reported
              successful system integration plus promising early safety, cycle-life, and response findings. United
              Airlines separately described airport ground-equipment charging, resilience, and
              electricity-demand-management use cases after taking a strategic stake in the company. Those examples
              support the idea that Natron's short-duration, high-power operating wedge resonated with customers. They
              do not, however, prove broad fleet performance across all marketed SKUs or end markets.
