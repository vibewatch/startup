            body: >-
              When Natron gets specific, the named proofs are mostly strategic investors, ecosystem partners, or
              demonstrations rather than clearly disclosed paying production accounts. United Airlines Ventures is the
              cleanest airport-ground-support reference: United invested directly and described potential use for
              pushback tractors, gate operations, electricity-demand management, and resilience, but the disclosure
              stays forward-looking and never converts into a public purchase order. UC San Diego is the clearest real
              deployment proof because the university describes an integrated 400VDC system in commercial EV fast
              chargers and a six-month outdoor demo, yet that still reads like a proving-ground installation rather than
              recurring commercial revenue. California Energy Commission project tracking makes the UC San Diego proof
              stronger than a one-off announcement: Natron shipped modules in 2024, installed and commissioned the
              system in January 2025, and continued testing through 2025. Nabors and Chevron sit in between. Natron’s
              2024 production release called both strategic customer-investors, and Nabors’ own announcement said the
              companies were evaluating sodium-ion batteries for drilling markets, but neither company is publicly
              disclosed as a paying production site. Even Natron’s strongest commercial claim—June 2024 initial
              shipments with an initial focus on data-center customers—stops short of naming operators or giving install
