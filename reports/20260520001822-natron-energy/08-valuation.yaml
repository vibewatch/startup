- id: public-comps-and-framing-band
  title: Public comps are a framing band, not a Natron valuation
  body: 'The comp set is useful mainly because it shows how little precision is available. Across public names touching energy storage or critical power, the market-cap-to-revenue range runs from about 0.5x at Stem to about 1.3x at Fluence and 2.1x at EnerSys, then up to about 4.2x at tiny ESS Tech, about 5.1x at Eaton, 11.4x at Vertiv, and an extreme 21x at Eos. QuantumScape adds a different warning: a pre-revenue battery developer can hold a multibillion-dollar market cap for option value, but that says more about public-market narrative appetite than about what a shut-down Natron should be worth.


    That dispersion is exactly why public multiples can only frame the conversation. Fluence, Stem, and ESS Tech are storage-related public operators with very different scale, distress, and financing profiles. EnerSys and Eaton are mature disclosed incumbents. Vertiv is a data-center power winner with a much broader product set and strong AI sentiment. Eos is a volatile alternative-chemistry outlier. The filing history of Eaton and EnerSys also highlights the disclosure-quality gap: those companies publish full 10-Ks, while Natron never supplied the public revenue, margin, or balance-sheet data needed to place it reliably on the same spectrum.


    The framing-band implication is still useful for the unicorn question. Natron’s last public commercial signal was $25 million of booked orders. Even applying a generous 1x to 4x revenue-style framing band to that signal yields only about $25 million to $100 million. To reach $1 billion, Natron would need something like $250 million of annual revenue at 4x or $100 million at a 10x multiple. No reviewed public source verifies either revenue level, and no reviewed public source verifies the post-money valuation required to bridge the gap.'
