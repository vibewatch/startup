  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: estate-waterfall
    missingEvidence: ABC asset-sale terms, gross sale proceeds, secured debt, administrative claims, and any distribution waterfall.
    whyItMatters: Without the estate waterfall, no public analyst can determine whether any residual value reaches preferred or common equity.
    diligencePath: Monitor restructuring disclosures, buyer announcements, and any sale memorandum or creditor summary released by the assignee.
    relatedQuestionRefs:
    - QV027
    - QV029
    - QV030
    relatedTableRefs:
    - TV004
    - TV007
  - type: private-evidence-only
    severity: material
    topic: valuation-history
    missingEvidence: Signed financing documents, board materials, or investor decks showing Natron’s actual 2024-2025 post-money valuation and preference stack.
    whyItMatters: The unicorn check can only say that public evidence is missing; it cannot prove what a private board-approved valuation was without the private financing documents.
    diligencePath: Request financing documents, board consents, or cap-table summaries from prior investors, management, or the assignee under NDA.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV029
  - type: missing-source
    severity: material
    topic: operating-history
    missingEvidence: Audited or investor-grade pre-close revenue, gross margin, backlog conversion, customer concentration, and cash-burn history.
    whyItMatters: Without operating data, public-multiple triangulation cannot be converted from a framing exercise into a real valuation model.
    diligencePath: Request FY2024-FY2025 board packages, audit material, or lender decks from former management or investors.
    relatedQuestionRefs:
    - QV023
    - QV025
    - QV029
  - type: enumeration-incomplete
    severity: material
    topic: comparables
    missingEvidence: Private distressed asset-sale precedents for failed battery and critical-power hardware startups, plus Natron-specific restart bids if any exist.
    whyItMatters: The public comp table can only frame valuation. Distressed private precedents are the missing evidence set that would matter more for a shut-down Natron estate.
    diligencePath: Build a precedent set from bankruptcy, ABC, and asset-sale disclosures across battery and power-hardware failures if the file is reopened.
    relatedQuestionRefs:
    - QV014
    - QV022
    - QV027
    relatedTableRefs:
    - TV005
