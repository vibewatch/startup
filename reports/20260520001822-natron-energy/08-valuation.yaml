- id: TV004
  title: Scenario assumptions table
  columns:
  - Scenario
  - Status path
  - Key assumptions
  - Valuation / return logic
  - Probability signal
  rows:
  - - Bull legacy case
    - Strategic buyer acquires IP, tooling, certifications, and team elements
    - Competitive bidding for assets; buyer funds restart; estate assets have strategic scarcity
    - Could create meaningful estate value, but common-equity recovery still depends on unknown creditor stack
    - Low — no public buyer or funded restart has been disclosed
  - - Base legacy case
    - ABC or liquidation sale clears assets but mostly benefits creditors
    - One or more buyers exist, yet proceeds are absorbed by secured claims, admin costs, and preferences
    - Common equity likely zero or de minimis even if assets are sold
    - High — best matches current public evidence
  - - Bear legacy case
    - Piecemeal sale with little strategic premium
    - Weak buyer interest, limited IP premium, no restart funding
    - Estate value low and equity effectively wiped out
    - Medium — plausible if assets prove non-differentiated in market
  - - Reopen case only
    - Not a valuation scenario but a gating event
    - Estate-sale terms, audited pre-close financials, and funded restart become public
    - Would justify re-running valuation from scratch, not tweaking this chapter
    - Very low in current public record
  notes: These are legacy scenarios because Natron had already shut down by runDate. They are not venture-growth cases.
