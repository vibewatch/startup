- id: TV003
  title: Method selection table
  columns:
  - Method
  - What it would need
  - Public evidence available
  - Use for Natron now?
  - Reason
  rows:
  - - Revenue multiple
    - Verified revenue, backlog conversion, and peer-quality disclosure
    - No verified revenue or conversion data
    - 'No'
    - Missing operating inputs and no live company to price
  - - EBITDA / cash-flow multiple
    - Reported gross margin, opex, and normalized earnings
    - No public margin or cash-flow disclosure
    - 'No'
    - Would be pure invention
  - - DCF / project finance
    - Management forecast, capex schedule, working capital, financing stack
    - No credible public forecast and the company has already shut down
    - 'No'
    - Fails both on inputs and going-concern status
  - - Replacement / capex value
    - Cost to replicate assets and certainty that replacement cost equals equity value
    - North Carolina plan disclosed almost $1.4B of project capex only
    - 'No'
    - Factory capex is not post-money equity value
  - - Liquidation / strategic asset sale
    - Estate-sale terms, debt, admin claims, preference stack, buyer interest
    - Shutdown confirmed but waterfall undisclosed
    - Yes, but blocked
    - Only honest present-tense lens, but still missing key facts
  - - Public comp framing band
    - Observable public comps and explicit caveat that Natron is not directly comparable
    - Comp data exists but spans a huge range
    - Yes, framing only
    - Useful for rejecting unicorn claims, not for setting a target price
  notes: This table intentionally separates framing utility from real valuation usability.
