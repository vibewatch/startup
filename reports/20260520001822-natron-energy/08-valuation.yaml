- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Evidence basis
  - What would change the view
  rows:
  - - Thesis
    - Natron reached real product and manufacturing proof
    - UL listing, Holland plant, 600 MW capacity claim, June 2024 shipments
    - Need audited customer deployments and margin proof to matter for equity value
  - - Thesis
    - Target markets are real and growing
    - Data-center UPS and industrial battery markets are large and expanding
    - Need proof that Natron captured durable share and pricing
  - - Thesis
    - Domestic supply chain and materials story had strategic appeal
    - Official materials emphasized no lithium/cobalt/nickel and U.S. manufacturing
    - Need evidence that this translated into superior economics rather than just narrative
  - - Anti-thesis
    - The company failed before public disclosure ever supported underwriting
    - WARN, Latitude, and TechCrunch document closure and liquidity failure
    - Only a funded restart with disclosed terms would soften this
  - - Anti-thesis
    - No public source verifies a unicorn valuation
    - PitchBook shows deal size, not post-money; $1.4B is factory capex
    - A signed financing document or board-approved term sheet would be required
  - - Anti-thesis
    - Comp multiples are too dispersed to rescue the case
    - Public peers range from sub-1x to >20x revenue and many are structurally incomparable
    - Need verified revenue, margin, and cap table data to use comps seriously
  notes: The anti-thesis dominates because Natron is already in liquidation; the thesis items explain why the company mattered, not why a new investor should pay today.
