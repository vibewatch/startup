- id: TV007
  title: Diligence blockers / next steps table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Estate process
    - ABC filings, asset-sale purchase agreement, and gross proceeds
    - Without sale terms there is no grounded liquidation value
    - Monitor Sherwood / assignee sale disclosures and buyer announcements
  - - Creditor stack
    - Secured debt, admin claims, cure costs, and other priority obligations
    - Waterfall leakage determines whether any equity value survives
    - Request estate waterfall or creditor summary from restructuring parties
  - - Cap table and preferences
    - Preferred liquidation stack, participation rights, and anti-dilution terms
    - Residual common-equity outcomes cannot be modeled otherwise
    - Request board-approved cap table and financing docs under NDA
  - - Audited operating history
    - Pre-close revenue, gross margin, backlog conversion, and customer concentration
    - Needed to test whether public comp framing has any factual base
    - Request audited or investor-board financial package for FY2024-FY2025
  - - Restart financing
    - Evidence of a buyer willing to recapitalize and resume production
    - Only a funded restart would convert Natron back into an operating-company valuation case
    - Monitor strategic buyers, DOE channels, and trade press
  - - Private distressed comps
    - Comparable asset sales for failed battery and power-hardware startups
    - Would sharpen any liquidation benchmark
    - Compile precedent distressed transactions if the file ever reopens
  notes: These blockers are the minimum evidentiary package required before Natron can be re-underwritten.
