- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - No funded restart appears
    - Twelve months pass with no disclosed buyer-backed restart financing
    - Confirms Natron is an asset-sale story only, not a recoverable operating company
    - Keep recommendation at no-go
  - - Estate sale benefits only creditors
    - Sale documents show little or no residual after secured and administrative claims
    - Eliminates residual common-equity hope
    - Treat equity value as zero
  - - No verified revenue scale emerges
    - No audited evidence of pre-close revenue anywhere near $100M
    - Makes unicorn framing mathematically unsupported
    - Reject any late-arriving unicorn narrative
  - - Strategic buyer pays only for selective assets
    - Buyer acquires patents or tooling without restarting the platform
    - Caps recoverable value to asset slices rather than enterprise value
    - Keep valuation stance unsupported
  - - Comp band compresses further
    - Public storage/power comps de-rate while Natron remains non-operating
    - Removes even framing support from upper-band outcomes
    - Tighten any residual upside language
  notes: These are monitorable kill criteria for the legacy case, not quarterly operating KPIs.
