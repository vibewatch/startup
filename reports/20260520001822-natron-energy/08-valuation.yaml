- id: method-selection-and-operating-proof
  title: 'Method selection: what can still be valued honestly'
  body: 'Natron did achieve real commercialization milestones before failing. The Holland plant opened in 2024, Natron said it had invested more than $40 million to retrofit the site, and the company positioned that facility as the first commercial-scale sodium-ion plant in the United States with 600 MW of annual capacity. Natron also had a UL-listed BlueTray product, marketed BluePack and BlueRack configurations for commercial and industrial users, attracted strategic backers such as United Airlines, and even reached at least one university-led EV fast-charging demonstration. Those facts mean the business was not vaporware; there was genuine product, certification, and manufacturing progress.


    But the same record shows why most classic valuation methods should be rejected. Revenue-multiple underwriting fails because Natron never published verified revenue, gross margin, backlog conversion, or customer concentration, and because the company is no longer operating. DCF or project-finance approaches fail because there is no supported operating forecast and because the creditor stack, preference waterfall, and estate-sale path are undisclosed. Replacement-cost reasoning also misleads: the North Carolina site’s nearly $1.4 billion budget measures what a huge future plant might have cost to build, not what Natron’s equity was worth.


    That leaves only two honest lenses. The first is a liquidation or strategic-asset-sale lens, which is the right present-tense frame but is blocked by missing waterfall data. The second is public-multiple triangulation, but only as a framing band to test whether a unicorn claim is even plausible. NREL’s long-duration-storage work is a reminder that storage value is application-, duration-, and system-dependent, not a simple premium that can be pasted onto Natron. Public-multiple framing is therefore not a real Natron valuation, because the operating inputs needed to connect Natron to any revenue or EBITDA multiple are missing.'
