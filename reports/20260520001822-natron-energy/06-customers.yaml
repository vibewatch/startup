  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-data-center-customers
    missingEvidence: Named data-center operators, site counts, installed units or MW, and deployment dates.
    whyItMatters: Without named operators or install counts, the best-documented commercial wedge still cannot be audited for depth or reference quality.
    diligencePath: Request top data-center accounts, install inventory, and at least two referenceable customer calls.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU002
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, renewal timing, and contract lengths by segment.
    whyItMatters: Segment fit is not enough for underwriting if there is no evidence that deployed or booked accounts were renewing or expanding.
    diligencePath: Request customer cohort table, contract forms, renewal dates, and expansion history by named account.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: channel-roster
    missingEvidence: Named integration partners, distributors, reseller economics, and win or conversion data.
    whyItMatters: The public record implies partner-assisted selling but does not show whether Natron had enough channel capacity to scale beyond bespoke deals.
    diligencePath: Request channel map, top integrator names, segment ownership, and closed-won pipeline by route-to-market.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, revenue mix by segment, and pipeline concentration by account or partner.
    whyItMatters: Strategic-investor visibility can hide concentration in a handful of counterparties or lighthouse accounts.
    diligencePath: Request revenue bridge by segment, top-10 account list, and pipeline-weighted concentration metrics.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: booked-order-identity
    missingEvidence: Customer-by-customer detail for the reported USD 25 million booked orders, including product, stage, deposits, and cancellation status.
    whyItMatters: The shutdown converted demand into non-fulfillment risk, but the public record does not show which customer relationships were damaged or how much cash exposure remained.
    diligencePath: Request the order ledger, customer status at shutdown, cancellation notices, and any refund or claim schedule.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
