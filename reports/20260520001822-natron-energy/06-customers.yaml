  title: GTM / distribution model
  columns:
  - Motion
  - Target segment
  - Evidence
  - What it proves
  - Dependency / risk
  - Public gap
  rows:
  - - Direct enterprise critical-power sales
    - Data centers, telecom, mission-critical facilities
    - Official pages plus BlueTray commercial-availability claim
    - Natron had a product built for enterprise critical-power buyers
    - Needs long procurement cycles and proof of field reliability
    - No disclosed pipeline conversion or named operators
  - - Strategic-investor-led beachhead
    - Airports and airline operations
    - United Airlines Ventures investment and stated airport use cases
    - Natron had a credible wedge into airport ground support
    - Depends on investor follow-through and airport integration work
    - No disclosed deployment, units, or contract value
  - - Strategic-customer-led industrial decarbonization
    - Oilfield and industrial fuel-saving use cases
    - Chevron and Nabors investor disclosures plus drilling-operations quote
    - Industrial sponsors increased category credibility
    - Economics and adoption may depend on a few anchor partners
    - No audited field performance or purchase volume
  - - Demonstration-led commercialization
    - EV fast charging and grid-benefit validation
    - UC San Diego and CEC-backed demo
    - Natron could integrate into commercial chargers in a live environment
    - Grant-funded demos do not guarantee scale-up
    - No public post-demo order book
  - - Partner-assisted integration route
    - Installations needing integrators or channel partners
    - Company page mentions sales and integration partners
    - Natron likely expected partner help in enterprise installs
    - Partner quality and coverage are not public
    - No named distributor, reseller, or integrator list
