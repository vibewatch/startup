- id: TU005
  title: Expansion and concentration risk
  columns:
  - Expansion lever or risk
  - Current signal
  - Impact on revenue quality
  - Supporting proof
  - Diligence path
  rows:
  - - Data-center-first wedge
    - Initial shipment focus pointed at data-center customers
    - May speed early adoption but can concentrate pipeline in one demanding segment
    - Initial-focus shipment claim plus UPS market context
    - Obtain account list, site count, and share of pipeline by segment
  - - Strategic-investor dependence
    - United, Chevron, and Nabors are more visible than most paying customers
    - Strategic access can look stronger than actual booked recurring revenue
    - Investor disclosures and partner quotes
    - Separate investor relationships from signed customer contracts
  - - Named-customer scarcity
    - No named data-center operators in reviewed sources
    - Hides concentration and makes references hard to audit
    - Official and independent source set
    - Request top 10 accounts, reference customers, and install inventory
  - - Retention opacity
    - No public NRR, GRR, churn, or contract term data
    - Makes land-and-expand claims impossible to underwrite
    - Public disclosure gap across sources
    - Request renewal cohorts and contract duration by segment
  - - Certification or commercialization gating
    - TechCrunch linked undelivered orders to a UL-certification bottleneck
    - Execution gating can block conversion from demand to revenue
    - TechCrunch plus historical UL timeline
    - Map which products, certifications, and customer SKUs were gating orders
  - - Shutdown and non-fulfillment
    - Booked orders were reported, but Natron would not deliver current or future orders after shutdown
    - Turns pipeline into explicit non-fulfillment and reputational risk
    - Latitude, Manufacturing Dive, and WARN notice
    - Get customer-by-customer order status, deposits, and claim exposure
  notes: This table focuses on revenue-quality risk rather than technology risk; Natron’s shutdown turns missing retention data into a live fulfillment issue.
