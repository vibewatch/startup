  rows:
  - - Data-center / critical power
    - 'Buyer: data-center operator or critical-facility owner; user: facilities and power team; payer: infrastructure budget'
    - Official critical-power pages, 2024 shipment focus, and ABB critical-infrastructure quote
    - Initial data-center customer focus disclosed; no named operator public
    - Best-documented commercial wedge tied to AI and backup power
    - No named operator, no install count, no renewal data
  - - Industrial power-quality / peak shaving
    - 'Buyer: plant or operations owner; user: site energy or facilities team; payer: plant capex or opex'
    - Official industrial and microgrid pages
    - Use case marketed; named production customers not public
    - Matches short-duration, high-cycle, high-safety chemistry
    - Savings remain mostly company-claimed
  - - Airport ground support
    - 'Buyer: airline or airport operations; user: ground-ops team; payer: electrification budget'
    - United investment and airport-use disclosure
    - Strategic-investor proof; potential deployment only
    - Fast recharge and safety matter in airside equipment
    - No public purchase order or live fleet deployment
  - - Oilfield / industrial hybrid gensets
    - 'Buyer: drilling contractor or site operator; user: field operations; payer: fuel-saving and decarbonization budget'
    - Official oil-rig example and Nabors quote
    - Potential use case; no confirmed commercial order
    - High-value diesel-displacement story
    - ROI and savings are not customer audited
  - - Academic / proving ground EV fast charging
    - 'Buyer: research host or public-program sponsor; user: UCSD operators; payer: grant or partner funding'
    - UC San Diego real-world demo with commercial chargers
    - Live demonstration and validation, not revenue proof
    - Best public system-integration evidence
    - Final results and follow-on orders not public
  notes: Rows separate segment fit from revenue proof; investor or partner evidence is not treated as confirmed paying production demand.
