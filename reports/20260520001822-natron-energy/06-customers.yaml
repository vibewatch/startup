company:
  name: Natron Energy
chapter:
  number: 6
  title: Customers
  summary: Natron’s public customer evidence supports a coherent wedge into data-center critical power, industrial power-quality, airport ground support, oilfield hybridization, and EV fast-charging validation, but it rarely identifies named paying production accounts. United Airlines Ventures, Chevron, Nabors, and UC San Diego are meaningful proof points, yet most are investor, partner, or demonstration evidence rather than audited recurring revenue. The 2025 shutdown turns missing retention and conversion data into explicit non-fulfillment risk because booked orders were reported but not delivered.
sections:
- id: segment-map
  title: Customer segments and wedge selection
  body: 'Natron’s public customer record is strongest on segment fit rather than account disclosure. Current and archived official pages consistently position the company around short-duration critical power and industrial power-quality jobs: AI or data-center backup power, peak shaving, power quality management, immediate high-load support, and hybrid generator use. The industrial materials extend beyond generic factory loads into oil and gas exploration, diesel displacement, and utility peak avoidance, while the microgrids page explicitly says Natron is not a long-duration standalone BESS chemistry. That narrows the likely buyer set to operators whose outage cost, fuel savings, or safety requirement can justify a high-power battery with rapid recharge. Independent market sources support the wedge selection even though they do not prove Natron won it: data-center UPS is a multibillion-dollar market, data-center electricity demand is rising, and industrial battery demand spans oil and gas,
    telecom, manufacturing, and transport. The result is a coherent segment map, but not one with disclosed account counts or segment revenue mix.'
