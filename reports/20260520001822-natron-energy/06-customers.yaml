- id: durability-fallout
  title: Retention unknowns and shutdown fallout
  body: 'The chapter’s biggest diligence problem is not that Natron lacked any customer interest; it is that the public record never shows whether interest turned into durable revenue. There is no public customer count, no active-site denominator, no NRR or GRR, no churn, no contract-length disclosure, and no top-customer concentration data. That opacity became more important once the company failed. Manufacturing Dive said Natron was still seeking purchase orders before shutdown, Latitude reported the company would not deliver current or future orders and that booked orders totaled USD 25 million, and TechCrunch tied the failure to a funding crunch and a claimed UL-certification bottleneck. The WARN notice then made the outcome official: the board concluded fundraising had failed and the Holland and Santa Clara sites would close. For customer diligence, that means the relevant risk is not theoretical churn but conversion failure and non-fulfillment. Natron may have found real demand in
    data-center and industrial niches, yet the last public evidence says those booked orders were stranded rather than expanded into an installed, renewing base.'
