      - number: '2.4'
        title: 相对锂离子、铅酸、镍锌和其他钠离子路径的竞争动态
        blocks:
          - type: paragraph
            body: >-
              Natron 的竞争集合不只是“其他钠离子创业公司”。第一个、也是最大的既有对手是锂离子，它在工业电池和几乎所有美国现有固定式部署中仍握有成本、规模和买方熟悉度优势。铅酸仍然重要，因为 VRLA 仍服务庞大的
              UPS 存量基盘，并且在熟悉度和前期成本上仍被买方看重，尽管全生命周期经济性正在转向不利。镍锌是更直接的关键供电竞品：Data Center Frontier 调查显示，买方对其安全性和成本感知评分较高，ABB
              将 ZincFive 电池集成进 MegaFlex，也证明它已嵌入 UPS 渠道。Natron
              主张其钠离子化学体系能避开锂离子、铅酸和镍锌系统里的冷却延迟、火灾风险和部分矿物约束，但这些大多仍是供应商主导的说法。其他钠离子路径与 Natron 也有实质差异。CATL 和 BYD
              更偏向广义储能和可规模化容量应用，Peak Energy 与 HiNa 更接近电网级固定式储能。因此 Natron
              不只是以“一家钠离子公司”的身份竞争；它在争夺一小类买方：他们看重超快回充和高功率，胜过低价多小时能量容量。
