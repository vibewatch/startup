      - - Vertiv Holdings
        - $123.92B
        - $10.84B
        - ~11.4x
        - 数据中心电力受益标的，与 Natron 的 AI / 关键电力叙事相关
        - AI 情绪和更宽产品范围使其只能用于上限框架
      - - Stem, Inc.
        - $0.077B
        - $0.16B
        - ~0.5x
        - 说明承压的储能邻近上市公司可能以低于 1x 收入交易
        - 软件和项目属性与 Natron 差异很大
      - - ESS Tech
        - $0.025B
        - $0.006B
        - ~4.2x
        - 替代化学体系上市微盘股，说明小规模困境标的仍会给出噪声很大的倍数
        - 收入基数很小，市值也处于困境状态，因此该比率不是干净锚点
      - - QuantumScape
        - $4.49B
        - N/A
        - 不具参考意义
        - 说明尚无收入的电池开发商也可能拥有期权价值型市值
        - 没有收入且仍作为上市公司运营，使其无法作为 Natron 估值锚点
    notes: >-
      倍数来自 2026 年 5 月提取的 CompaniesMarketCap 数据，只是框架参考，不是真正的 Natron 估值。纳入 Eaton 和 EnerSys 的监管文件页面，是为了凸显它们与 Natron
      的披露质量差异。
    enumerationScope:
      coverage: partial
      basis: >-
        Public framing set covers relevant disclosed public names across alternative chemistry, storage integration,
        industrial battery, and data-center power, but it cannot capture private distressed asset sales or Natron’s
        undisclosed capital structure.
