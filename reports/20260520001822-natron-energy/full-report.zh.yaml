      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              即便很少披露精确预算科目，公开买方图谱仍然自洽。在数据中心 UPS 和关键供电部署中，使用者是承担正常运行时间风险的设施或基础设施团队，经济发起人通常是关键供电、运营或基础设施资本开支负责人，在 UPS
              架构和电池化学体系之间做选择。在工业削峰或电能质量部署中，使用者是工厂或站点运营方，付款方更接近能源管理、运营领导层，或由 CFO 支持的可靠性与燃料节省项目。Natron 的 UC San Diego
              快充项目显示，邻近用例也遵循类似模式：买方采用电池是为了解决高功率瓶颈，而不是最大化多小时套利。采用过程看起来也重证据。关键供电买家会先识别停电、负载爬坡或电能质量问题；随后在安全、续航、维护和 TCO
              上比较化学体系；最后要求资质、集成和现场验证，才会更广泛铺开。这种慢采购动作对估值很重要，因为即便宏观层面对韧性电力的需求上升，近端 SOM 也会被压窄。
