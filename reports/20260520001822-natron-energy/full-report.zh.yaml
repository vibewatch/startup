  - id: TP001
    title: 与 Natron 工业 / UPS 切入点相关的竞争者画像
    columns:
      - 竞争者
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 相对 Natron 或既有厂商的限制
    rows:
      - - Natron Energy
        - 直接钠离子 UPS / 工业挑战者
        - ~200 名员工；最新一笔 $189M 交易；关闭前现有 600 MW 工厂和 24 GW 规划
        - 关键电力、工业削峰、EV 快充
        - 不可燃普鲁士蓝化学体系；<15 min 回充；>50k 次循环
        - 规模化竞赛失利，NC 扩建前于 2025 年关闭
      - - CATL sodium-ion
        - 直接钠离子 + 全球电池既有巨头
        - 控制全球约 70% 产能的 Top-5 电芯厂阵营；具备锂电兼容规模
        - 交通和储能
        - 第一代钠离子 160 Wh/kg；15 分钟充至 80%；制造杠杆巨大
        - 未围绕 Natron 的短时 UPS 利基优化
      - - BYD Battery-Box
        - LFP 固定式储能替代方案
        - Top-5 电芯厂阵营；模块化系统最高 983 kWh
        - 备电、离网、住宅和商业储能
        - 对安装商友好的 LFP 平台，固定式场景适配面广
        - 偏能量型固定式储能，不是超快速工业 UPS
      - - EnerSys
        - 后备电源既有厂商
        - $8.01B 市值；$3.73B 收入
        - 后备电源、数据中心、工业电力
        - 电池、AC/DC 电源和监控产品线宽
        - 化学体系创新差异化较弱
      - - Eaton
        - UPS 生态既有厂商
        - $144.40B 市值；$28.52B 收入
        - 企业级和超大规模 UPS
        - 打包 UPS、锂电池、BMS 和服务经济性
        - 靠锂电架构竞争，而不是钠离子化学体系
      - - Vertiv
        - UPS 生态既有厂商
        - $123.92B 市值；$10.84B 收入
        - 任务关键型数据中心 UPS
        - 10-600kW 模块化 UPS，配锂电 / VRLA 选项和 DCIM 集成
        - 系统宽度会压过利基电池专家
      - - HiNa Battery
        - 中国直接钠离子同行
        - 核心钠离子专利持有者；应用聚焦广
        - 大规模储能、EV、低速车
        - 低成本、长寿命、高安全钠离子平台
        - UPS 专项证据少于 Natron
      - - Peak Energy
        - 美国钠离子固定式储能挑战者
        - $10M 种子轮 + $55M Series A；3.5 MWh 试点；20+ GWh 路径
        - 电网级固定式储能
        - 被动冷却钠离子、美国制造、照付不议合同
        - 优先固定式 / 电网，而非短时 UPS
      - - Eos Energy
        - 相邻替代化学体系同行
        - $2.33B 市值；$0.11B 收入
        - 韧性电网、可再生能源、微电网
        - 美国制造锌基长时储能
        - 解决的时长问题不同于 Natron
    notes: 规模 / 融资字段混合了上市公司市场数据、已披露融资或产能里程碑；截至 2026-05-20，表中仅列与 Natron 工业 / UPS 购买动作直接相关的同行。
