      - number: '2.2'
        title: 规模测算口径：广义工业电池支出真实存在，但 Natron 的核心切入点更小
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个大背景，但无法拼出干净的 Natron 专属 TAM/SAM/SOM。Mordor 估计全球工业电池市场 2026 年为 USD 41.93 billion，到 2031 年增至 USD
              93.71 billion；Grand View 估计全球数据中心 UPS 市场 2024 年为 USD 4.04 billion，到 2030 年升至 USD 6.27
              billion。这些可以当外部边界，但都不是直接的 Natron 市场数字。工业电池口径包含叉车、通信和广义电力领域；UPS 口径只覆盖 Natron
              机会的一部分，还漏掉工业秒到分钟级削峰。当前部署结构也重要。NREL 和 EIA 证据显示，美国现有固定式储能压倒性地由锂离子和四小时以内资产主导，因为今天的容量规则和套利结构奖励这个时长窗口。因此 Natron
              夹在两个公开口径之间：更广的工业和 UPS 收入池验证了真实需求；当前储能市场结构虽已电气化，却围绕规模远大得多的既有化学体系优化。正确结论不是 Natron 拥有一个巨大的 BESS
              TAM，而是公司瞄准几个更大、但只有部分相关市场里的更窄关键供电切口。
