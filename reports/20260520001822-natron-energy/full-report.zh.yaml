  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、独角兽核验与估值立场
        blocks:
          - type: paragraph
            body: >-
              截至 2026-05-20，Natron 不是一个可主动承销的新投资标的。公开记录显示，公司已在 2025 年 9 月初永久关闭 Holland 和 Santa Clara
              设施，未能获得足够新融资来覆盖营运资本和经营费用，并正通过为债权人利益转让程序清算。Data Center Dynamics
              的独立行业报道也强化了同一结论。因此，当下投资问题不再是成长股权，而是遗留资产或债权回收。对新投资者来说，没有正在进行的融资流程，没有经营连续性，也没有可用于承销新股权的披露价格。


              按现有证据，请求的独角兽核验不成立。没有已审阅的公开来源能证明 Natron 在 2024-05-20 当天或之后拥有 $1 billion 或以上的股权估值。PitchBook 显示最新交易金额为 $189
              million，但没有公开投后估值。Latitude 报道累计融资超过 $363 million，Series F 又追加 $55.4 million，同样没有经核实的独角兽投后估值。被广泛转述的 $1.4
              billion 数字来自 Natron 2024 年 8 月 North Carolina 工厂公告，指的是 24 GW 站点项目资本开支，不是 Natron 的股权价值。


              这些证据导向一个直接结论。建议：no-go /
              avoid，不投入新钱。置信度：方向性判断为中高，因为停运和流动性失败有充分交叉印证；剩余股权价值为低，因为财产出售、债务和优先权结构没有披露。风险评级实际上是危急，估值立场更适合描述为缺乏支撑或未知，而不只是昂贵。Natron
              自己的仅商业客户页面也说明，无论如何不存在可承销的公开投资通道。在财产出售条款或有资金支持的重启出现前，Natron 应放在遗留尽调桶里，而不是主动投资队列。
