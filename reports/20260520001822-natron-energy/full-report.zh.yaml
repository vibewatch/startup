            body: >-
              Natron 后期最强的证据来自制造和商业化里程碑，而不是典型软件指标。2024 年 4 月 Business Wire 新闻稿称，Holland 已开始商业规模生产，满产后预计年产 600
              megawatts，并由超过 $40 million 的改造支出和 ARPA-E 的 $19.8 million 支持。Natron 还称首批出货将在 2024 年 6
              月启动，初期聚焦数据中心，这与公司围绕关键供电和 AI 相关负载的反复定位一致。工厂之外，商业化证据存在，但停留在特定细分场景。United Airlines 围绕机场地面设备电气化投资，UC San Diego
              公开描述了 2024 年用 Natron 电池做商业 EV 快充演示。最激进的规模声明，是 2024 年 8 月 Edgecombe County 公告：计划年产 24 gigawatts，拟投入工厂资本开支近
