        blocks:
          - type: paragraph
            body: >-
              Natron 的公开领导层披露比产品宣传薄，但足够拼出第一章的运营画像。2024 年的 Business Wire 新闻稿把创始人 Colin Wessells 和联席 CEO Wendell Brooks 放在
              Michigan 扩产和 North Carolina 扩张的台前。停摆期报道又补充了两名具名运营者：首席商务官 John Schmidt 告知已预订订单不会履约；Elizabeth Shober
              作为团队与人才负责人签署了 WARN 通知。缺失的，正是私营公司尽调通常下一步最想要的内容：现任董事会名单、董事席位分配，以及投资人控制权图谱。资本形成也只有部分公开。Natron 披露过 2020 年 $35
              million 融资，但其 2020 年自己的新闻稿对该轮到底是 Series B 还是 Series D 说法不一致。后续可见度来自合作伙伴和数据库来源：United Airlines 在 2022
              年宣布战略投资；Energy-Storage.news 在 2024 年点名 ABB、Chevron 和 Khosla 等投资方；PitchBook 列出 2024 年 1 月 $189 million
              后期轮；Latitude Media 后来报道称累计融资超过 $363 million，停摆前又追加 $55.4 million。这足以画出可见利益相关方，但不足以验证所有权、清算顺位或当前估值。
