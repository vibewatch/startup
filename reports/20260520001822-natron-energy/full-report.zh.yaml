  - id: TV006
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 未出现已融资重启
        - 12 个月过去，仍未披露买方支持的重启融资
        - 确认 Natron 只是资产出售故事，不是可恢复运营的公司
        - 维持不投建议
      - - 资产出售只惠及债权人
        - 出售文件显示，有担保债权和管理费用债权之后几乎没有或没有剩余
        - 普通股残余价值希望被清零
        - 将股权价值按零处理
      - - 未出现经验证的收入规模
        - 没有经审计证据显示停业前收入接近 $100M
        - 独角兽框架在数学上失去支撑
        - 拒绝任何迟来的独角兽叙事
      - - 战略买方只为精选资产付款
        - 买方收购专利或工装，但不重启平台
        - 可回收价值被封顶在资产切片，而不是企业价值
        - 维持估值立场缺乏支撑
      - - 可比公司区间进一步压缩
        - 上市储能 / 电力可比公司估值下修，而 Natron 仍未运营
        - 连上限结果的框架支撑也被拿掉
        - 收紧任何剩余上行表述
    notes: 这些是遗留案例可监控的终止标准，不是季度运营 KPI。
    claimRefs:
      - CV041
      - CV043
      - CV046
      - CV047
      - CV049
  - id: TV007
    title: 尽调阻塞项 / 下一步表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 资产处置流程
        - ABC 文件、资产出售购买协议和总出售所得
        - 没有出售条款，就没有扎实的清算价值
        - 跟踪 Sherwood / 受让人出售披露和买方公告
      - - 债权堆叠
        - 有担保债务、管理费用债权、补救成本和其他优先义务
        - 瀑布分配泄漏决定是否还有股权价值留存
        - 向重组相关方索取破产财产瀑布分配或债权人摘要
      - - 股权结构表和优先权
        - 优先股清算堆叠、参与权和反稀释条款
        - 否则无法建模普通股残余结果
        - 在 NDA 下索取董事会批准的股权结构表和融资文件
      - - 经审计运营历史
        - 停业前收入、毛利率、积压订单转化和客户集中度
        - 用于检验上市可比公司框架是否有事实基础
        - 索取 FY2024-FY2025 经审计或提交投资人 / 董事会的财务包
      - - 重启融资
        - 有买方愿意再资本化并恢复生产的证据
        - 只有已融资重启，才会把 Natron 拉回运营公司估值案例
        - 跟踪战略买方、DOE 渠道和行业媒体
      - - 私有困境可比交易
        - 失败电池和电力硬件创业公司的可比资产出售
        - 可让清算基准更精准
        - 如果档案重新打开，汇总历史困境交易
    notes: 这些阻塞项是重新承销 Natron 前所需的最低证据包。
    claimRefs:
      - CV045
      - CV046
      - CV049
