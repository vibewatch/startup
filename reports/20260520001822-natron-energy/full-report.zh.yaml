        - Holland 已有商业化证明；吉瓦级规模经济性仍未验证
      - - UL 认证范围
        - 关键供电买家需要安全性和许可审批把握
        - BlueTray 的 UL 1973，以及 UL 9540A 披露
        - 如果安全证据只覆盖一个 SKU，扩展部署会放慢
        - BlueTray 证据强；BluePack / BlueRack 文档不足
      - - 电力电子 / UPS 集成
        - Natron 卖的是系统场景，不是孤立电芯
        - United、UC San Diego 和官方用例页面都指向集成商工作流
        - 控制系统不互通、验证支持不到位，采用就会卡住
        - 有合作伙伴案例；公开接口文档没有
      - - 客户验证周期
        - 数据中心和工业买家把可靠性、安全性排在新颖性前面
        - Data Center Frontier 调研和数据中心行业报道
        - 验证周期的拖累可能比化学体系成功持续更久
        - 依赖关系清楚；未披露公开的验证周期指标
      - - 本土来源 / BABA 文件
        - 采购优势靠合规文件支撑，不靠口号
        - Natron 的 BABA 主张，加上州政府背书的本土制造叙事
        - 审计或投标里撑不住，本土定位溢价就会被侵蚀
        - 公司主张可见；独立合规文件缺失
      - - 扩产资本连续性
        - 24 GW 扩产需要持续资本开支和营运资金
        - NC 项目披露，加上 2025 年反向来源
        - 即便化学体系可行，技术路线图也会停摆
        - 到 2025 年，这个依赖已经失效
      - - BMS / 软件 / 网络安全披露
        - 关键基础设施买家需要运营控制保障
        - 官方渠道没有公开架构文档
        - 控制系统不透明会抬高尽调摩擦，并引出安全问题
        - 公开披露很少
    notes: 这些依赖不只是化学体系，也包括运营。失败模式往往不是电芯科学本身，而是集成、认证范围、验证拖累或资本连续性。
