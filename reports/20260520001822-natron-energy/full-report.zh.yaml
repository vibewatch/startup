      - number: '7.2'
        title: 制造扩张和客户履约风险跑在已披露运营证据前面
        blocks:
          - type: paragraph
            body: >-
              Natron 的运营故事要求投资者和客户同时相信两件事：第一，Holland 工厂已经用一款差异化、UL 列名的钠离子产品跨入商业制造；第二，同一家公司可以从年产 600 megawatt 的站点跃迁到拟建的
              24 gigawatt North Carolina 工厂，扩张 40 倍。公开证据从未补上这座桥。公司营销的属性很强——十五分钟回充、超过 50,000 次循环、不可燃、高功率，适合 AI
              驱动的数据中心备电和工业削峰——但它自己的微电网页面也承认，产品不适合长时放电或独立 BESS 用途。最尖锐的负面数据点不是 Natron 没有商业兴趣，而是公司仍在已预订订单据称达到 $25
              million、且公开称当前和未来订单不会交付的情况下关停。这个组合说明，认证范围、制造就绪度和营运资本纪律都弱于头条市场叙事。即便 UC San Diego
              演示页面也仍把结果表述为「初步发现」，并承诺未来更新，凸显公司失败前公开现场性能记录仍然很薄。
