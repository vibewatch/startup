      - number: '3.2'
        title: 替代品集合由已经掌握买方关系的既有玩家主导
        blocks:
          - type: paragraph
            body: >-
              Natron 不只是在和其他钠离子团队竞争。数据中心备电和工业韧性买家也可以选择成熟的 LFP、备用电源电池，或由既有玩家提供的完整 UPS 方案。在这一组里，BYD 的 Battery-Box 是最清楚的
              LFP 固定式替代品：它服务备电、离网和商业用例，采用安装商驱动的模块化架构，从小型住宅系统扩展到接近 1 MWh。EnerSys 则来自备用电源侧，目录包括 PowerSafe 和 DataSafe
              电池，也包括卖给数据中心和工业环境的 AC/DC 电源与监控工具。


              对 Natron 来说，Eaton 和 Vertiv 是最难对付的替代品，因为它们竞争的是系统架构层，而不只是化学体系。Eaton 围绕 BMS 管理的安全性、更快回充、更小占地和相对 VRLA
              更低的全生命周期运营负担来包装锂电 UPS 电池。Vertiv 的 Liebert APM2 又把这套组合扩展到模块化 10-600 kVA/kW UPS 容量、可热插拔的锂电或 VRLA 电池，以及直接的
              BMS/DCIM 集成。它们的资产负债表也不在一个量级：Eaton 和 Vertiv 年收入都达到数十亿美元，这意味着采购团队可以从同一供应商购买服务、控制、冗余和支持，以及电池选项。Natron
              的化学体系差异化强于这些既有玩家，但没有它们的生态控制力。
