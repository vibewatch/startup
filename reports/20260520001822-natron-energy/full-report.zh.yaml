      - number: '6.2'
        title: 具名证据、部署，以及仍未核实的部分
        blocks:
          - type: paragraph
            body: >-
              Natron 一旦给出具体证据，具名样本大多是战略投资者、生态伙伴或演示项目，而不是明确披露的付费量产账户。United Airlines Ventures 是最清晰的机场地面支持参照：United
              直接投资，并描述了在拖车、登机口运营、电力需求管理和韧性上的潜在用途，但披露始终停留在前瞻表述，没有转化为公开采购订单。UC San Diego 是最清楚的真实部署证据，因为校方描述了一个接入商业 EV 快充桩的
              400VDC 集成系统和为期六个月的户外演示；但它仍更像验证场安装，而不是经常性商业收入。California Energy Commission 的项目跟踪让 UC San Diego
              证据强于一次性公告：Natron 在 2024 年交付模块，2025 年 1 月安装并调试系统，并在 2025 年继续测试。Nabors 和 Chevron 介于两者之间。Natron 的 2024
              年投产公告称两者都是战略客户投资者，Nabors 自己的公告也说双方正在评估面向钻井市场的钠离子电池，但没有任何一家公司被公开披露为付费量产站点。即便 Natron 最强的商业化表述——2024 年 6
              月开始发货、初期聚焦数据中心客户——也没有点名运营商或给出安装数量。
