  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和 Natron 真正服务的用例
        blocks:
          - type: paragraph
            body: >-
              不能把 Natron 按全部固定式储能或完整长时储能叙事来承销。公司自己的材料一直把产品定义为面向关键供电和工业场景、功率优先的电池：AI
              和数据中心备电、电能质量、秒到分钟级削峰、发电机混合化，以及类似的高循环任务——这些场景更看重即时放电和快速回充，而不是持续数小时输出。最清楚的边界来自 Natron 自己的微电网 / BESS
              页面：页面明确说该产品不适合长时间能量放电，也不适合单独用于 BESS 系统。这意味着纳入的支出包括数据中心 UPS、工业电能质量和峰值负载管理、通信或其他任务关键备电，以及 EV
              快充等部分高功率邻近场景；排除的支出包括长时可再生能源保供、主要用于日内套利的四小时电网电池，以及面向容量的住宅或商业电池包。这个区分重要，因为 Natron
              的价值主张是任务关键循环下的功率密度、回充速度和安全性，而不是把太阳能发电存上数小时或数天。
