      - number: '6.3'
        title: 销售路径和分销模式
        blocks:
          - type: paragraph
            body: >-
              可见的销售模式更像直销企业客户，再借伙伴增强可信度，而不是铺开广泛分销网络。公司官方材料明确排除消费者用途，并提到销售和集成伙伴，但已审阅的公开记录没有列出稳健的经销商名单。相反，证据显示 Natron
              选择的是安全、快速回充和短时供电足够关键、客户愿意接受新化学体系的场景：任务关键型数据中心、机场、电信或关键基础设施、工业设施和现场作业。战略投资者似乎同时充当准入通道。United
              带来航空公司和机场连接；Nabors 自身公告让油田路径更具体；ABB 的关键电力背书支撑数据中心和 5G 定位；UC San Diego 加上 CEC 则为 EV 快充提供公开验证场。EV
              快充切入点也不只是营销，而有正式项目支持：2019 年报道称 California Energy Commission 向 Natron 授予 USD 3 million，用于在 UC San Diego
              快充站点安装储能。Data Center Frontier 的调研背景解释了 Natron 为什么选择这条路径：数据中心买家高度重视化学体系安全，也要管理不同规模的 UPS
              部署。缺失的仍是商业管线本身——具名集成商、采购周期数据、赢单率，以及哪些伙伴入口转化成了重复订单。
