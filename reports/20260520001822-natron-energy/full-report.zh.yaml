  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 竞争威胁
      - 严重程度
      - 缓释措施 / 尽调问题
    rows:
      - - 防火、不可燃化学体系
        - 既有 UPS 厂商如今把锂电系统、BMS、UL 测试和全服务支持打包销售
        - 高
        - 将 Natron 的安全优势与整个打包 UPS 系统对标，而不只看电芯化学体系
      - - '>50k 次循环寿命和快速回充'
        - 当占地和价格主导决策时，LFP 成本下降和能量密度提升会削弱额外循环的价值
        - 高
        - 要求提供两分钟 UPS 工况与锂电替代方案的并列项目经济性
      - - 美国制造和规划中的 24 GW 扩产
        - 24 GW 规划从未变成运营产能，融资也在爬坡前失败
        - 致命
        - 除非有资本承诺和运营产线支撑，否则不要把规划产能当作有约束力的规模
      - - 普鲁士蓝化学体系和 IP 领先
        - 停产和资产出售风险削弱了对服务连续性和未来产品路线图的控制
        - 高
        - 核查专利所有权、留置权，以及停产后任何资产转让条款
      - - 聚焦关键电源细分市场
        - Eaton、Vertiv 和 EnerSys 已经掌握买方流程、服务预期和采购渠道
        - 高
        - 衡量经销商覆盖、装机基础和参考客户，而不只看化学体系主张
      - - 钠离子品类时点
        - 北美钠离子需求可能仍是细分市场，而中国玩家和 LFP 既有厂商继续更快扩产
        - 高
        - 在低需求和 LFP 成本下行情景下压力测试品类逻辑
    notes: 严重性是作者基于所引公开证据的判断。「严重」表示 Natron 在 2025 年停产中已经兑现的风险， 而不是假设中的未来威胁。
