              2024 年的扩张故事，碰上 2025 年的负面记录就站不住了。Natron 的 WARN 信称，董事会在 2025-08-27 认定融资努力失败，Holland 和 Santa Clara 设施将在
              2025-09-03 永久关闭，影响两州共 95 名员工。独立报道很快从“裁员”推进到“停摆”和“清算”。Manufacturing Dive 与 Data Center Dynamics
              报道称，公司已停止运营并叫停 North Carolina 工厂计划；Latitude Media 和 TechCrunch 报道称，Sherwood Partners
              正在寻求出售资产，清盘通过债权人利益转让推进。证据足够强，可以明确写下：Natron 仍是私营公司，但到 2025 年 9
              月已经停摆并进入清算。它也放大了本章最大、也是用户要求核验的证据缺口。2024-05-20 之后，公开来源没有验证公司估值超过 $1 billion。PitchBook
              隐藏估值，公开报道聚焦工厂计划和停摆机制，North Carolina 的 $1.4 billion 只是工厂资本开支。因此第一章的正确判断是：私营公司，停摆 / 清算已确认，独角兽状态公开未验证。
