      - number: '7.4'
        title: 公开披露落后于下行路径，缓释质量偏弱
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是治理和披露质量。Natron 是私营公司，公开财务能见度很低；决定性的负面信息来自 WARN
              申报和第三方报道，而不是公司自己发布的重组文件，去解释现金跑道、积压订单转化、认证边界、质保暴露或债权人优先顺位。PitchBook
              显示这是一家晚期私营公司，董事会规模大、融资轮次多，但留存的公开记录仍没有披露毛利率、现金消耗、契约包、清算优先权、客户集中度，或未交付订单背后的具名对手方。这种不透明很重要，因为它让投资者无法区分坏市场和坏执行栈。最清楚的教训是：公共激励、ARPA-E
              支持、战略投资者和强产品宣称，在营运资本、认证到发货的转化以及披露纪律同时失守后，并不构成真正缓释。尽调时，正确姿态不是寻找单一银弹解释，而是把 Natron
              视为一个案例：披露薄弱放大了所有其他风险，外部人看不到失败正在累积，直到它已经变成停运和清算程序。
