      - number: '7.3'
        title: 竞争、替代与依赖风险收窄了 Natron 的战略切口
        blocks:
          - type: paragraph
            body: >-
              Natron 不是在进入一个空白市场。它试图在既有关键电力和储能供应商已经服务的细分市场里切出一个高功率、短时切口，同时还要对抗持续移动的锂基准。Grand View 将 2024 年全球数据中心 UPS
              市场测算为超过 $4 billion，并明确把 Vertiv、Eaton 等在位厂商列为关键供应商；EnerSys 则已经销售备用电力和数据中心产品。与此同时，Fluence 销售大型储能和面向 AI
              的电力策略，其部署深度远超过 Natron 曾披露的水平。独立钠离子报道让替代风险更尖锐：Energy-Storage.news 引述分析师预计，到本十年末北美钠离子需求只有 3–4 GWh，并警告本土 LFP
              进展可能抹掉这个窗口；TechCrunch 和 ESS News 也都强调，锂价下跌和 LFP 经济性改善正在抬高替代化学体系的门槛。NREL
              的储能研究也强化了一点：最有吸引力的长时机会不会自动映射到一款两分钟、高功率产品。因此，Natron 依赖的是一个狭窄商业切口、政策支持和异常快速扩张同时到位。
