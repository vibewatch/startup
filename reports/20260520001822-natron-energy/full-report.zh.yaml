      - number: '3.3'
        title: 定价可见度和包装方式更利于规模玩家，而非化学体系专家
        blocks:
          - type: paragraph
            body: >-
              Natron 的商业难题不只是证明钠离子能工作，而是证明一个狭窄的关键供电电池能在总解决方案成本上打赢完整系统方案。整个同业集合的公开定价透明度都弱，但 Natron
              尤其不透明。最清楚的公开定价信号是定性信号：管理层告诉 Energy-Storage.news，随着规模改善，其产品会与其他化学体系具有价格竞争力，但没有公布任何标价、实现价格，或展示相对锂电 UPS
              替代方案价差的客户案例。买方于是只能拿一个化学体系叙事去对比既有玩家的打包方案。


              这一点重要，因为 Natron 瞄准的市场并不小。Grand View 估算数据中心 UPS 市场 2024 年为 $4.04 billion，并预计到 2030 年达到 $6.27 billion，其中集中式
              UPS 仍是主导配置。Data Center Frontier
              的买方调查称，运营方优先考虑长寿命、可靠性、可持续性、安全和全生命周期成本。这些决策标准更利于能证明正常运行时间经济性的供应商，而不只是化学新奇性。与此同时，Mordor 强调锂离子已经占据最大工业电池份额，中国
              LFP 成本还在下降。Peak 和 Eos 清楚展示了邻近固定式储能的取舍：两者都销售更宽的韧性或电网价值，但都不是想赢 Natron 的两分钟 UPS 利基。因此 Natron
              需要格外强的价格证据，而公开证据从未走到那一步。
