  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 普鲁士蓝化学体系和产品架构
        blocks:
          - type: paragraph
            body: >-
              Natron 的产品故事从化学体系开始，而且公司对它希望客户相信的关键机制说法异常一致。官方页面称 Natron
              使用专利普鲁士蓝电极族，钠离子在大型立方孔隙中移动，从而实现快速嵌入、低内阻，以及所谓“零应变”的充放电机制。这是清楚且具体的技术主张，不是泛化电池营销。它也解释了为什么 Natron
              一直围绕高功率、快速回充和短时工况定位，而不是围绕最高能量密度或长时储能。


              证据质量参差。Natron 自己的化学页面和产品页面提供了机制叙事，Energy-Storage.news 也复述了同一解释，并明确提醒“零应变”不应被理解为零衰减。换句话说，机制有一些外部复述，但这组来源不包含
              Natron 电芯的同行评议论文，也没有独立衰减数据集能让尽调按产品逐一核验 50,000 次循环主张。正确读法因此是：普鲁士蓝机制在技术上可信，且表述清楚，但多数性能含义仍是公司主张，而非独立基准验证。


              该化学体系映射到的是分层硬件栈，而不是软件牵引的平台。Natron 披露的架构从普鲁士蓝钠离子电芯和模组，向上延伸到 BlueTray 4000 机架电池包、BluePack 关键供电电池，以及 BlueRack
              250 机柜或更大的集成系统。该架构也被刻意限定。Natron 自己的行业页面说，公司不销售给住宅或 DIY 用例，电池为商业和工业部署设计。因此，本章把 Natron
              视为一家专门做高功率电化学硬件的公司，而不是通用储能供应商。
