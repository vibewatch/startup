      - number: '4.3'
        title: 资本充足性和 2025 年末现金失败
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Natron 公开故事断裂的地方。审阅来源显示，公司确有工业雄心——一座商业化 Michigan 工厂、2024 年首批出货，以及计划中的 24 GW North Carolina
              超级工厂——但没有显示与该扩产规模匹配的融资基础。公开披露本身也不一致：PitchBook 显示最新交易金额为 $189 million，状态为“正在产生收入”；Latitude 则报道称 Natron
              累计融资超过 $363 million，并在停摆前仅五个月为 Series F 追加 $55.4 million。即便还没测试估值，这种不一致也意味着，仅靠公开来源无法建立干净的资本基础。


              相比之下，2025 年末的失败异常明确，因为 WARN 信以融资语言描述了它。Natron 告诉 Michigan 监管机构，公司曾寻求现有投资人的后续资金、新一轮 Series B
              股权流程、一笔有担保可转债、管理层主导的资本重组方案，以及额外采购订单。董事会在 2025 年 8 月 27
              日认定，这些努力未能产生足够资金，无法覆盖执行现有采购订单所需的额外营运资本和运营费用。Latitude 补充称，已预订订单总额为 $25 million，但 Natron 关闭后不会交付现有或未来订单。


              关闭来源对随后发生的事情方向一致。WARN 记录了 Holland 和 Santa Clara 设施永久关闭，以及两州共 95 人裁员。Manufacturing Dive 称停摆也叫停了 North
              Carolina 工厂计划。TechCrunch 描述为投资人拒绝释放更多资金，Sherwood Partners 通过债权人利益转让清算公司。Energy-Storage.news
              则补上一条行业层面解释：北美钠离子需求仍小，LFP 价格和密度仍在改善。合在一起，公开证据指向一个资本开支已经很重的制造战略内部发生的营运资本失败。
