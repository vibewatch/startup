        - label: 受 WARN 影响员工
          value: 95
          unit: people
    approximationNotes: 零值表示没有公开披露，不一定是经济意义上的零；25 million 这一数字是在手订单价值，不是已确认收入。
    claimRefs:
      - CU009
      - CU018
      - CU039
      - CU040
      - CU043
      - CU045
      - CU046
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Natron 最高的残余风险是已经兑现的融资失败、客户无法履约，以及掩盖断裂直到关闭的披露不透明。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 残余敞口
      rows:
        - label: 流动性 / 再融资失败
          values:
            - label: 已兑现
              tone: negative
            - label: 严重
              tone: negative
            - label: 失败
              tone: negative
            - label: 严重
              tone: negative
        - label: 制造规模化风险
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
        - label: 客户履约风险
          values:
            - label: 已兑现
              tone: negative
            - label: 严重
              tone: negative
            - label: 弱
              tone: negative
            - label: 高
              tone: negative
        - label: 竞争 / 替代
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 有限
              tone: warning
            - label: 高
              tone: negative
        - label: 政策 / 激励依赖
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 部分
              tone: warning
            - label: 高
              tone: negative
        - label: 性能披露缺口
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 弱
              tone: negative
            - label: 高
              tone: negative
        - label: 治理 / 披露不透明
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 弱
              tone: negative
            - label: 高
              tone: negative
    approximationNotes: 定性标签是有证据支持的分析师判断，因为 Natron 在关闭前没有发布数值化企业风险矩阵。
    claimRefs:
      - CR001
      - CR007
      - CR015
      - CR024
      - CR035
      - CR039
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 决定性下行路径从融资失败和发货准备不足开始，传导到订单未交付、工厂关闭和清算。
    data:
      nodes:
        - id: r1
          label: 融资失败
          type: input
        - id: r2
          label: 认证 / 发货缺口
          type: input
        - id: r3
          label: 40x 扩产冒进
          type: input
        - id: r4
          label: 政策 / 激励依赖
          type: input
        - id: r5
          label: 披露不透明
          type: input
        - id: o1
          label: 在手订单未履约
          type: process
        - id: o2
          label: 工厂关闭
          type: process
        - id: o3
          label: NC 项目搁浅
          type: process
        - id: o4
          label: 资产出售 / ABC 清算
          type: output
        - id: o5
          label: 股权价值受损
          type: output
      edges:
        - from: r1
          to: o1
          label: 没有营运资金执行积压订单
        - from: r1
          to: o2
          label: 现金过桥失败
        - from: r2
          to: o1
          label: 订单无法转化为发货
        - from: r3
          to: o2
          label: 扩产雄心跑在证据前面
        - from: r4
          to: o3
          label: 受激励支持的项目失去发起方能力
        - from: r5
          to: o5
          label: 投资者较晚看到下行风险
        - from: o1
          to: o2
          label: 积压订单不再支撑运营资金
        - from: o2
          to: o3
          label: 运营基础消失
        - from: o2
          to: o4
          label: 关闭触发清算路径
        - from: o4
          to: o5
          label: 资产出售回收成为主导
    approximationNotes: DAG 是因果图，不是基于财务模型；它抽象了 WARN 通知和后续报道描述的公开下行链条。
    claimRefs:
      - CR001
      - CR003
      - CR007
      - CR008
      - CR035
      - CR040
      - CR041
  - id: FR003
    title: 依赖 DAG
    type: dag
    layout: wide
    summary: Natron 需要资本、准入、制造就绪、客户证明和支持性激励同时到位；任何一个节点失灵都会削弱整个投资逻辑。
    data:
      nodes:
        - id: d1
          label: 后续资本
          type: input
        - id: d2
          label: UL / 准入范围
          type: input
        - id: d3
          label: Holland 工厂吞吐
          type: input
        - id: d4
          label: North Carolina 激励
          type: input
        - id: d5
          label: 战略伙伴 / 演示
          type: input
        - id: d6
          label: 客户发货
          type: process
        - id: d7
          label: 复购订单 / 证明
          type: process
        - id: d8
          label: 项目可融资性
          type: process
        - id: d9
          label: 扩产执行
          type: output
        - id: d10
          label: 估值支撑
          type: output
      edges:
        - from: d1
          to: d6
          label: 为营运资金提供资金
        - from: d2
          to: d6
          label: 推动客户接受
        - from: d3
          to: d6
          label: 提供可制造供给
        - from: d5
          to: d7
          label: 形成参考案例
        - from: d6
          to: d7
          label: 装机基础证明产品
        - from: d4
          to: d8
          label: 降低项目成本栈
        - from: d7
          to: d8
          label: 增强可融资性
        - from: d8
          to: d9
          label: 支撑大型工厂扩张
        - from: d9
          to: d10
          label: 规模支撑估值
        - from: d1
          to: d10
          label: 资本信心锚定定价
    approximationNotes: 这张依赖图展示失败前的运营栈；Natron 2025 年停摆表明，这套栈从未端到端稳定跑通。
    claimRefs:
      - CR010
      - CR011
      - CR014
      - CR022
      - CR023
      - CR027
      - CR035
      - CR037
  - id: FV001
    title: 推荐逻辑流
    type: flow
    layout: wide
    summary: 决策路径从真实商业化证明出发，经过停摆、独角兽证据失效和估值方法否定，最终落到不投建议。
    data:
      nodes:
        - id: n1
          label: 商业化证明
          detail: 获 UL 列名的产品、Holland 工厂、600 MW 产能口径、战略投资者
        - id: n2
          label: 资本强度
          detail: $40M Holland 改造，加上计划中的 $1.4B / 24 GW North Carolina 扩产
        - id: n3
          label: 停摆证据
          detail: WARN、Latitude、TechCrunch 和 Manufacturing Dive 证实 2025 年关闭和流动性失败
        - id: n4
          label: 独角兽核验
          detail: 2024-05-20 当日或之后，没有可信公开证据支持 $1B+ 投后估值；$1.4B 是工厂资本开支
        - id: n5
          label: 估值方法
          detail: 只能用清算视角或可比公司口径；拒绝收入、EBITDA 和 DCF 精准估值
        - id: n6
          label: 建议
          detail: 不投 / 回避；除非资产出售条款或获资重启浮出水面，否则只是遗留尽调案例
      edges:
        - from: n1
          to: n2
          label: 仍需规模化资金
        - from: n2
          to: n3
          label: 资产负债表承压
        - from: n3
          to: n4
          label: 迫使证据重置
        - from: n4
          to: n5
          label: 抽掉独角兽支撑
        - from: n5
          to: n6
          label: 决定结论
    approximationNotes: 该图是定性决策逻辑，不是机械评分卡。
    claimRefs:
      - CV003
      - CV006
      - CV039
      - CV040
      - CV044
      - CV047
  - id: FV002
    title: 估值敏感性柱状图
    type: bar
    layout: standard
    summary: 示例性的收入倍数敏感性显示，Natron 最后一项公开商业信号离独角兽门槛还有多远。
    data:
      items:
        - label: $25M 订单 @ 1x
          value: 25
          unit: USD m
          detail: 以已签订单为锚，按困境低端口径估算
        - label: $25M 订单 @ 4x
          value: 100
          unit: USD m
          detail: 用慷慨的成熟运营商口径看 Natron 最后一项公开订单信号
        - label: $100M 收入 @ 4x
          value: 400
          unit: USD m
          detail: 仍远低于独角兽区间
        - label: $100M 收入 @ 10x
          value: 1000
          unit: USD m
          detail: 需要公开倍数上限，还需要 Natron 从未披露过的已验证规模
        - label: $250M 收入 @ 4x
          value: 1000
          unit: USD m
          detail: 显示在更常见的溢价倍数下，达到 $1B 需要多大收入规模
        - label: 可见公开佐证
          value: 25
          unit: USD m orders
          detail: 停摆前后唯一硬公开商业信号
    approximationNotes: 柱形只是口径测算。Natron 未披露达到这些水平的已验证收入，已签订单也不等于已实现收入。
    claimRefs:
      - CV014
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 区间
    type: range
    layout: standard
    summary: 三档口径显示，已观察到的公开信号离独角兽门槛还有多远；这些不是 Natron 的实时估值。
    data:
      items:
        - label: 已签订单口径
          low: 25
          mid: 62.5
          high: 100
          unit: USD m
          note: 对最后一项公开 $25M 已签订单信号套用 1x 至 4x 口径
        - label: 披露规模示例口径
          low: 100
          mid: 250
          high: 400
          unit: USD m
          note: 仅作示例：$100M 已验证收入在 1x 至 4x 下可能对应什么估值
        - label: 独角兽门槛要求
          low: 1000
          mid: 1000
          high: 1000
          unit: USD m
          note: 需要 $250M 收入按 4x 计算，或 $100M 按 10x 计算；两者都未获公开验证
    approximationNotes: 第一档锚定真实公开订单数字；后两档是假设性口径门槛，用来测试 $1B 说法是否站得住。
    claimRefs:
      - CV014
      - CV039
      - CV040
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 七项投委会 KPI 概括了为什么 Natron 在战略上仍有看点，但按 2026 年公开证据看仍不可投。
    data:
      items:
        - label: 技术差异化
          value: 3
          unit: /5
          note: 化学体系和安全差异真实存在，但不足以抵消商业化失败
        - label: 商业化证明
          value: 2
          unit: /5
          note: 工厂、UL 列名和订单都存在，但披露收入牵引力仍然薄弱
        - label: 市场顺风
          value: 3
          unit: /5
          note: 数据中心和工业电池需求确实存在，但竞争仍然激烈
        - label: 融资韧性
          value: 1
          unit: /5
          note: 有记录的流动性失败和清算主导评分
        - label: 披露质量
          value: 1
          unit: /5
          note: 没有公开股权结构、利润率、债务或已验证收入支撑
        - label: 可比公司支撑
          value: 2
          unit: /5
          note: 可比对象有助于否定独角兽说法，但不能给出 Natron 的真实估值
        - label: 当前可投性
          value: 1
          unit: /5
          note: 资产出售条款或获资重启公开之前，不投 / 回避
    approximationNotes: 分数是基于 runDate 公开证据的分析师判断，不是经审计的经营 KPI。
    claimRefs:
      - CV017
      - CV019
      - CV020
      - CV044
      - CV045
      - CV047
      - CV048
