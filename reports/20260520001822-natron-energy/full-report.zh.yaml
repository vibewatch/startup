  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Natron 留存的官方页面把公司的市场身份说得异常清楚。首页称 Natron 是关键供电和工业电池供应商，服务 AI 数据中心、削峰、电能质量管理等高功率用例；公司 / 联系页面则明确说 Natron
              是私营公司，不提供公开股票或面向消费者的投资入口。同一组官方材料也收窄了产品范围：Natron 面向商业和工业场景销售，不面向住宅或 DIY
              用途；其数据中心、工业和微电网页面反复把化学体系放在短时、高功率放电上，而不是长时独立储能。运营足迹的证据也很具体。Natron 留存的首页源列出 California 的 Santa Clara 和
              Michigan 的 Holland 地址，制造页面称 Holland 于 2024 年开业，并计划在 North Carolina 的 Edgecombe County
              建设未来超级工厂。这些证据合在一起，支持把 Natron 定义为一家美国私营工业电池制造商，定位狭窄、面向任务关键供电，而不是宽泛的消费电池品牌。
