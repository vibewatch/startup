  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价姿态和变现边界
        blocks:
          - type: paragraph
            body: >-
              Natron 的公开商业故事，本质是硬件和系统故事，不是软件或订阅故事。其网站营销面向关键供电、工业、EV 充电和电能质量用例的离散钠离子产品——BluePack、BlueRack 250 和 BlueTray
              4000；行业页面则把 Natron 描述为数据中心和工业电力中，较既有电池化学体系更安全、回充更快的替代品。这支持一个承销判断：近端收入最可能来自电池包、机柜和集成部署销售，而不是独立的经常性软件层。


              问题是，Natron 从未公布足以把这个故事转成干净收入模型的商业细节。本报告审阅的公开来源，没有披露标价、实现 ASP、服务附加率、渠道毛利、客户集中度，或收入确认的会计节点。公开材料也没有回答 Natron
              是在模块出货、机柜出货、安装、调试，还是组合系统里程碑时确认收入。因此公司的公开定位只能支持一个结构性模型：硬件 SKU 进入机柜 / 系统部署，可能还存在调试、保修或更换收入组合，但具体占比未披露。


              定价姿态比定价本身更清楚。Natron 反复把安全性、回充速度、循环寿命、无需主动冷却和本土供应链内容，作为买方应选择钠离子而非锂离子或铅酸的理由。Energy-Storage.news 还报道，Natron
              称其产品价格会与其他化学体系有竞争力；但无论官方还是第三方公开来源，都没有披露“有竞争力”按单块电池、单个机架或单套安装系统折算到底是多少钱。这意味着公开尽调能评估价值主张和买方逻辑，但无法评估真实变现质量或利润留存。
