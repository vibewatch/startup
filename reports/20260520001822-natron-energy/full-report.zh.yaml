  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与切入点选择
        blocks:
          - type: paragraph
            body: >-
              Natron 的公开客户记录，更能证明它选中的细分场景匹配，而不是披露了多少具体账户。当前和存档的官方页面都把公司放在短时关键电力和工业电能质量场景里：AI
              或数据中心备用电源、削峰、电能质量管理、即时高负载支撑，以及与发电机混用。工业材料不只覆盖泛化工厂负载，还延伸到油气勘探、柴油替代和公用事业削峰；微电网页面则明确说明，Natron 不是长时独立 BESS
              化学体系。由此，可能买方被收窄到一类运营商：停电成本、燃料节省或安全要求足以支撑采购可快速回充的高功率电池。独立市场来源支持这个切入点，尽管不能证明 Natron 已经拿下市场：数据中心 UPS
              是数十亿美元市场，数据中心用电需求在上升，工业电池需求覆盖油气、电信、制造和交通。结论是，细分市场地图是连贯的，但公开资料没有给出账户数量或分细分市场收入结构。
