  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 流动性与再融资失败是核心风险，因为它已经发生
        blocks:
          - type: paragraph
            body: >-
              评估 Natron 时，应从融资失败的事实链出发，而不是寄望未来执行本可以救下公司。2025 年 8 月的 WARN
              通知罕见地直白：管理层此前一直在向现有股东寻求跟投资金、推动新一轮股权融资、争取有担保可转债、提交管理层主导的资本方案，并争取新的采购订单；董事会在 8 月 27
              日认定这些努力已经失败。停运原因不是抽象的宏观压力，而是无法筹到足够的新增营运资本和经营现金，去执行已经在手的采购订单。这个区别很重要，因为它把「融资风险」改写成已经被验证的、无法把积压订单桥接为收入的能力缺口。媒体报道随后把同一点变得更尖锐：Sherwood
              Partners 转向资产出售，TechCrunch 描述的是为债权人利益转让程序，而不是有序的增长型资本重组；关闭发生在 Natron 公开推出 North Carolina
              超大型项目约一年后。Battery-Tech 随后概括员工备忘录称，公司明确终止当前和未来订单履约，Sherwood 准备资产出售；Tiger Group 后来又推广 2025 年 11 月拍卖，清算关闭后的
              Santa Clara 和 Holland 设施中约 USD 74 million 的设备。用尽调语言说，公司最重要的风险通道是从融资到履约，而这条通道已经明确断裂。
