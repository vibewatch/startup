  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Natron 的切入点真实存在，但比广义钠离子竞赛更窄
        blocks:
          - type: paragraph
            body: >-
              Natron 并不想做泛化的电网电池供应商。它自己的材料围绕关键供电和工业任务展开：极高功率、即时回充和防火安全比四小时时长或商品化能量密度更重要。BluePack 和 BlueRack
              的卖点是两分钟放电窗口、低于十五分钟回充，以及 Natron 所称能避免热失控并承受超过 50,000 次循环的普鲁士蓝化学体系。对 UPS 类工况、通信类韧性和工业削峰来说，这是一个锋利切口。


              直接钠离子同业走的是更宽的商业化路径。CATL 把钠离子同时绑定交通和储能应用，并强调可在锂电兼容产线上制造；这一点重要，因为规模可以在不重建整套工厂体系的情况下到来。HiNa
              同样把钠离子描述为横跨大规模储能和车辆的多应用平台。Peak 在美国替代化学体系叙事上更接近 Natron，但它的产品命题明确是电网级固定式储能，而不是两分钟关键供电续航。实际结果是，Natron
              带着可信技术切口进入市场，却面对已经追逐比工业 UPS 更大可寻址容量池的同业。
