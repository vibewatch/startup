      - number: '8.4'
        title: 遗留情景、退出现实与下一步
        blocks:
          - type: paragraph
            body: >-
              现在唯一合理的情景分析，是遗留案例情景分析。在牛市遗留情景中，战略买家为 Natron 的 UL 列名产品、钠离子知识产权、工装和美国制造 know-how
              支付有意义的价值，可能保住部分财产价值。在基准遗留情景中，为债权人利益转让程序产生资产出售，但有担保债权、行政成本和优先权负担吸收了大部分所得。在熊市遗留情景中，财产被拆分出售，几乎没有战略溢价，普通股实际上归零。由于分配瀑布不公开，这些情景只适合作为方向性决策逻辑，而不是经审计价值。


              因此，普通风险投资者的退出准备度并不存在。没有可信 IPO
              路径，没有披露的持续融资轮，也没有公开价格发现流程。剩下的是尽调阻断项：财产出售条款、债务和优先债权、股权结构和优先权栈、关闭前经审计收入和毛利率，以及任何买方愿意出资重启而不只是购买资产的证据。这些不是模型里几个小小的缺失单元；它们是一次真实估值练习与证据缺口之间的差别。


              因此，正确下一步不是勉强拼出一个合成目标价，而是监控财产程序、资产出售结果和任何重启融资。如果这些出现，文件可以重新打开。在那之前，Natron
              应被视为一个有战略教训、但估值用途有限的遗留技术案例，而不是一个可承销的创业投资机会。
            claimRefs:
              - CV015
