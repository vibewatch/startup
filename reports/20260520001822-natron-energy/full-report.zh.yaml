      - number: '2.5'
        title: 增长驱动、采用约束和估值含义
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动很清楚。EIA 和 IEA 都显示用电量和数据中心负载上升，UPS 与工业电池市场研究也指向对韧性电力、高可用基础设施和更安全化学体系的持续支出。Natron
              还受益于本土供应链、丰富材料和美国储能制造政策支持的叙事。但约束至少同样重要。当前市场结构仍偏向锂离子和四小时资产，公开估计下 North America 钠离子需求仍小，LFP
              价格和能量密度快速改善会挤压替代化学体系的利基。商业化记录也足够警醒：Natron 自己在 2025 年停摆，说明有效用例并不保证融资能持续、资质能通过，或客户能规模化转化。对估值而言，可投资结论因此比标题式电池
              TAM 窄得多。Natron 最好的切入点是真实存在的关键供电和工业高功率细分市场，但能否变现取决于证明全生命周期经济性、建立渠道信任，并在锂离子或镍锌补上差距之前完成规模化。
