      - number: '4.2'
        title: 单位经济性逻辑和制造资本开支强度
        blocks:
          - type: paragraph
            body: >-
              Natron 的公开单位经济性逻辑方向上说得通，尽管真实数字大多缺失。公司化学体系避开锂、钴和镍，转而强调钠、铁、锰、铝等丰富投入品。公司还宣称能够改造既有电池制造设备：在 Michigan 的
              Holland，Natron 称花费超过 $40 million，把一座 $300
              million、原本偏锂离子的设施升级为钠离子生产线。这两项披露支撑了基本乐观论点——商品化材料投入加上产线改造杠杆，相比从零建设完全定制工艺，应当降低可变成本并减轻绿地建设负担。


              但同一套公开记录也说明，光有这个论点不够。Natron 的电池经济性不仅取决于物料清单，还取决于工厂利用率、人工和间接费用吸收、认证时点、良率、保修风险、库存周转和客户资质周期长度。Natron
              的公开记录没有披露这套成本结构里的任何标准输出：没有毛利率、贡献毛利、服务成本、保修准备金、CAC 或回本周期，也没有实现价格。这让“便宜且丰富材料”的论证成为承销的必要条件，但绝不充分。


              制造建设又显著抬高了负担。Holland 的 600 MW 年产能对首次商业化有意义，但计划中 North Carolina 升级到 24 GW、项目成本接近 $1.4
              billion，意味着财务模型很快不再只是化学体系，而变成资本部署和利用率问题。NREL 的长时储能研究和 Energy-Storage.news
              的关闭报道都强调同一个问题：替代化学体系必须在总系统经济性上获胜，而锂离子、尤其是 LFP 还在成本和密度上继续改善。没有已公布的 ASP、良率、利用率或毛利率数据，Natron
              的公开单位经济性案例仍停留在结构层面，还不能建模。
