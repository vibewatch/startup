      - number: '3.4'
        title: Natron 有产品护城河，但资本和渠道规模失败后，护城河并不耐久
        blocks:
          - type: paragraph
            body: >-
              Natron 的功能优势真实存在：不可燃化学体系、极高循环寿命，以及与短时关键供电事件高度匹配的回充速度。问题是，这些优势从未足以穿过规模和渠道关口。Natron 2024 年实际生产足迹是一座 600 MW 的
              Michigan 工厂，而 24 GW 的 North Carolina 计划仍停留在愿景。到 2025 年 8
              月底，公司已耗尽多条融资路径，董事会选择永久停摆。这个时点重要，因为同一时期已有分析认为，北美钠离子需求到十年末可能仍只有 3-4 GWh，LFP 的价格和密度改善正在压缩 Natron 50,000
              次循环优势的价值。


              这些因素合在一起，回头看 Natron 的护城河很脆。如果公司仍在运营，关键尽调问题会是渠道覆盖、实现价格，以及客户是否愿意为单一用途钠离子电池替换既有 UPS 生态。停摆之后，耐久性进一步变差，因为 IP
              控制、服务连续性和存量装机支持都变得不确定。CATL 和 BYD 可以把化学体系改良吸收到庞大制造系统里，Eaton、Vertiv 和 EnerSys
              则可以把电池变化吸收到根深蒂固的采购、服务和控制关系里。Natron 在狭窄利基里赢了化学体系论证，却输掉规模竞赛，因此也输掉了护城河。
