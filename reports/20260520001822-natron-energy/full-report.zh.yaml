companyProfile:
  summary: >-
    Natron Energy 是一家美国私营钠离子电池公司，成立于 2012 年，核心位于 California 的 Santa Clara，产品面向短时关键供电和工业场景，并在 Michigan 的 Holland
    建有商业规模工厂。公司确实达成过产品、认证和制造里程碑，但到 2025 年 9 月已停摆，并进入清算或资产出售状态。截至 2026-05-20，Natron
    更适合作为一个技术史有研究价值的存量案例，而不是仍可承销的活跃风险投资机会。
