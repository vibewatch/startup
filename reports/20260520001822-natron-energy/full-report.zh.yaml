  - id: TP003
    title: 定价 / 打包模式对比
    columns:
      - 公司
      - 商业模式
      - 公开定价信号
      - 涵盖范围
      - 含义
    rows:
      - - Natron
        - 直接电池柜 / 项目报价
        - 无公开标价；管理层仅称规模改善后定价应具竞争力
        - 短时钠离子电池包和电池柜
        - 没有已实现价格数据，很难证明相对打包 UPS 方案的 TCO 优势
      - - CATL sodium-ion
        - OEM / 项目定价
        - 已审阅来源未见公开价格
        - 电芯和钠锂混合电池包
        - 钠离子走向主流后，规模很可能比化学体系新颖性更重要
      - - BYD Battery-Box
        - 安装商渠道模块化系统
        - 已审阅来源未见公开全包安装价
        - 模块化 LFP 固定式储能堆
        - 靠广泛渠道可得性和简单扩容路径竞争
      - - EnerSys
        - 报价驱动的电池 + 电力设备
        - 已审阅来源未见公开标价
        - 后备电源电池 + AC/DC 电源和监控
        - 既有后备电源关系降低了切换化学体系的必要性
      - - Eaton
        - 配置化 UPS 和电池套装
        - 无公开标价；公开材料强调相对 VRLA 的全生命周期成本节省
        - UPS、电池、BMS、维护旁路、服务框架
        - 即使化学体系不新，打包方案也能靠采购简单性胜出
      - - Vertiv
        - 配置化 UPS 和电池套装
        - 无公开标价；产品页强调效率和可用性
        - 10-600kW 模块化 UPS、锂电 / VRLA 电池、DCIM 和服务
        - 系统级打包提高了新电池进入者的切换成本
      - - Peak
        - 项目 / 合同模式
        - 有公开节省成本主张，但无标价
        - 电网级钠离子储能系统
        - 竞争点是固定式储能 TCO，而不是 UPS 续航时间
      - - Eos
        - 项目制系统
        - 已审阅来源未见公开标价
        - 面向电网和微电网的锌基长时储能
        - 相邻替代方案，时长比回充速度更关键
    notes: 本表关注定价可见度和打包模式，不估算精确采购价，因为已审阅公开来源很少披露客户级报价数据。
