      - number: '5.3'
        title: 制造成熟度、认证和成熟信号
        blocks:
          - type: paragraph
            body: >-
              Natron 产品章节里最强的非营销证据，来自安全认证和首座工厂执行。BlueTray 4000 在 2020 年获得 UL 1973 列名，Natron 也公开披露其电芯的 UL 9540A
              火灾测试结果。这很重要，因为它把 Natron 泛泛的“不可燃 / 无热失控”话术，转化为至少一个产品特定的第三方安全里程碑。但不能夸大证据范围。本组来源中公开可见的 UL 证据绑定 BlueTray
              和电芯；BluePack 或 BlueRack 250 的同等公开认证细节在这里并不存在。


              制造成熟度也真实存在，但不完整。Natron 2024 年在 Michigan 的 Holland 启动商业规模运营，称投入超过 $40 million
              改造一座此前偏锂离子的设施，并把该工厂描述为未来钠离子工厂的 600 MW 年产能蓝本。Energy-Storage.news 独立复述了这些生产主张。对尽调而言，这意味着 Natron
              确实越过了从实验室化学到商业制造的门槛。它不意味着公司已经解决吉瓦级规模下的良率、利用率、资质吞吐量或营运资本纪律。


              North Carolina 计划把这个差别说得更清楚。官方和州政府背书来源描述了一座 24 GW 工厂，投资近 $1.4 billion，并通过 JDIG 和 Megasite Readiness
              资金获得公共激励。Natron 还围绕美国可获得材料和 Michigan 生产，营销 BABA 和本土供应链定位。但在本组来源里，这些主张大多仍是公司自述的采购优势，而不是独立成文的合规文件。2025
              年停摆也说明，Holland 的商业规模生产不足以化解从首座工厂跃迁到持久多 GW 制造的风险。
