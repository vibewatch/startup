      - number: '4.4'
        title: 财务结论和明确尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              诚实结论是，公开披露不足以支撑 Natron Energy 的干净收入、利润率或估值模型。它只能支撑一个方向性叙事：Natron
              似乎靠电池硬件和集成系统变现，可能还有附带的调试或售后收入，并围绕美国本土钠离子制造搭建了大型资本计划。它从未公开提供承销该叙事所需的数字——按收入流拆分的报告收入、实现价格、毛利率、现金余额、月度烧钱速度、积压订单转化、客户集中度，或基于股数的估值。


              缺失数据之所以重要，是因为公开可比公司跨越完全不同的财务形态。公开市场现在既给尚未产生收入的电池开发商赋予有意义的价值，也给拥有详细申报文件和持续披露财务报表的数十亿美元电力设备供应商赋值。QuantumScape
              没有收入也能维持公开市值；Eos 和 ESS 展示了低收入电池制造案例；Vertiv 和 EnerSys 展示了成熟、已披露的电力设备企业。这些可比点只能证明储能和电力硬件的估值曲面很宽，却不能说明 Natron
              失败前位于曲面的哪个点。


              因此，本章财务判断必须狭窄且明确。Natron
              资本强度很高，追求一条制造爬坡路径，而这条路径依赖的外部资金多于公开来源显示其已锁定的资金；在公开披露足以支撑可辩护承销模型之前，公司就耗尽了营运资本。正确的尽调输出不是伪装成精确预测的合成模型，而是一张清晰缺口表：管理层需要披露收入、毛利、烧钱速度、积压订单和估值哪些内容，真实财务模型才会存在。
