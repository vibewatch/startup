      - number: '5.2'
        title: 产品栈、运行适配和用例边界
        blocks:
          - type: paragraph
            body: >-
              Natron 对外营销的产品栈拆成三个具名产品，运行哲学一致。BlueTray 4000 是公开记录中最具体的 SKU：一款机架式 48 VDC 电池包，标称两分钟放电 4 kW，峰值功率 6
              kW。BluePack 是关键供电电池，官方页面将其与 25 kW / 48-volt 系统和快速回充绑定；BlueRack 250 则是机柜级扩展外壳，Natron 描述其范围从 25 kW
              到多兆瓦部署。三者的卖点相同：在短时内输出极高功率，约 15 分钟回充，避免热静置和主动冷却，并重复这一循环许多次。


              用例适配直接来自这套架构。Natron 官方页面把产品放进数据中心关键供电、工业削峰和电能质量管理、EV 快充、微电网、通信、混合发电机系统。更重要的是，Natron 也描述了产品栈不适合哪里。微电网 /
              BESS 页面明确说，该化学体系不适合长时间能量放电，也不应单独作为长时 BESS 使用。这是有价值的边界条件，因为它降低了尽调把 Natron 误读为 LFP 储能系统泛化替代品的风险。


              独立验证存在，但只围绕部分工作流。UC San Diego 的 Center for Energy Research 描述了一个在商业 EV 快充桩上的真实 400VDC Natron
              部署，并报告系统集成成功，以及早期安全性、循环寿命和响应表现有希望。United Airlines 在入股后，也分别描述了机场地面设备充电、韧性和用电需求管理用例。这些案例支持一个判断：Natron
              的短时、高功率运行切口确实引起客户共鸣。但它们并不能证明所有已营销 SKU 或终端市场都有广泛车队表现。
