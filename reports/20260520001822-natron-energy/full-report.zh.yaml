      - number: '8.2'
        title: 方法选择：哪些东西仍能诚实估值
        blocks:
          - type: paragraph
            body: >-
              Natron 失败前确实达成过真实商业化里程碑。Holland 工厂在 2024 年开业，Natron 称已投入超过 $40 million 改造该站点，并把这座设施定位为美国第一座商业规模钠离子工厂，年产能
              600 MW。Natron 也拥有 UL 列名的 BlueTray 产品，面向商业和工业用户销售 BluePack 和 BlueRack 配置，吸引了 United Airlines
              等战略支持者，甚至至少推进到一个由大学牵头的 EV 快充演示项目。这些事实说明，业务不是空气项目；产品、认证和制造确实有进展。


              但同一记录也说明，为什么大多数经典估值方法应被剔除。收入倍数承销行不通，因为 Natron 从未发布经核实的收入、毛利率、积压订单转化或客户集中度，而且公司已经不再运营。DCF
              或项目融资方法也行不通，因为没有可支撑的运营预测，债权人栈、优先权分配瀑布和财产出售路径也没有披露。重置成本推理同样会误导：North Carolina 站点接近 $1.4 billion
              的预算衡量的是建造一座巨大未来工厂可能要花多少钱，而不是 Natron 股权值多少钱。


              剩下只有两个诚实视角。第一是清算或战略资产出售视角，这是当下正确框架，但缺少瀑布数据，无法落地。第二是公开倍数三角测算，但只能作为框架区间，用来测试独角兽说法是否哪怕有可能成立。NREL
              的长时储能研究提醒我们，储能价值取决于应用、时长和系统，不能把简单溢价贴到 Natron 身上。因此，公开倍数框架并不是真正的 Natron 估值，因为把 Natron 连接到任何收入或 EBITDA
              倍数所需的运营输入都缺失。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV040
              - CV044
              - CV045
              - CV052
              - CV054
      - number: '8.3'
        title: 公开可比公司只是框架区间，不是 Natron 估值
        blocks:
          - type: paragraph
            body: >-
              可比公司组的主要价值，是显示这里几乎没有精确度。覆盖储能或关键电力的上市公司里，市值 / 收入区间从 Stem 约 0.5x，到 Fluence 约 1.3x、EnerSys 2.1x，再到小体量 ESS
              Tech 约 4.2x、Eaton 约 5.1x、Vertiv 11.4x，以及极端的 Eos 21x。QuantumScape
              提供了另一种警示：一家尚未有收入的电池开发商可以凭期权价值维持数十亿美元市值，但这更多说明公开市场对叙事的胃口，而不是已经停运的 Natron 应该值多少钱。


              正因为离散度如此之大，公开倍数只能给讨论划边界。Fluence、Stem 和 ESS Tech 都是储能相关上市运营商，但规模、困境和融资画像差异很大。EnerSys 和 Eaton
              是成熟且披露充分的在位厂商。Vertiv 是数据中心电力赢家，产品线更宽，并享有强 AI 情绪。Eos 是波动很大的替代化学体系离群值。Eaton 和 EnerSys
              的申报历史也凸显披露质量差距：这些公司发布完整 10-K，而 Natron 从未提供公开收入、利润率或资产负债表数据，无法可靠地把它放到同一条光谱上。


              这个框架区间对独角兽问题仍有用。Natron 最后一条公开商业信号是 $25 million 已预订订单。即便对这个信号套用慷慨的 1x 到 4x 类收入框架区间，也只得到约 $25 million 到 $100
              million。要达到 $1 billion，Natron 大致需要在 4x 倍数下有 $250 million 年收入，或在 10x 倍数下有 $100 million
              年收入。没有已审阅的公开来源核实任一收入水平，也没有已审阅的公开来源核实弥合差距所需的投后估值。
            claimRefs:
              - CV014
