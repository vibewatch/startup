      - number: '6.4'
        title: 留存未知数与停运后果
        blocks:
          - type: paragraph
            body: >-
              本章最大的尽调问题，不是 Natron 没有客户兴趣，而是公开记录从未说明兴趣是否转成了可持续收入。没有公开客户数、没有活跃站点分母、没有 NRR 或
              GRR、没有流失率、没有合同期限披露，也没有头部客户集中度数据。公司失败后，这种不透明更加关键。Manufacturing Dive 称 Natron 停运前仍在寻求采购订单；Latitude
              报道公司不会交付当前或未来订单，已预订订单总额为 USD 25 million；TechCrunch 则把失败归因于融资紧张和所谓 UL 认证瓶颈。WARN
              通知随后让结果正式化：董事会认定融资已经失败，Holland 和 Santa Clara 两处站点将关闭。对客户尽调而言，相关风险不是理论上的流失，而是转化失败和无法履约。Natron
              可能确实在数据中心和工业利基场景找到了需求，但最后的公开证据显示，这些已预订订单被搁置，而不是扩展成已安装、会续约的客户基础。
