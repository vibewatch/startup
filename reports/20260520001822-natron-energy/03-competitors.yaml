- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competitive threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Fire-safe, nonflammable chemistry
    - Incumbent UPS vendors now package lithium systems with BMS, UL testing, and full-service support
    - High
    - Benchmark Natron safety win against the whole bundled UPS system, not just cell chemistry
  - - '>50k cycle life and rapid recharge'
    - LFP cost and energy-density gains erode the value of extra cycles when footprint and price dominate
    - High
    - Request side-by-side project economics for two-minute UPS duty cycles versus lithium alternatives
  - - U.S. manufacturing and planned 24 GW scale-up
    - The 24 GW plan never became operating capacity and financing failed before the ramp
    - Critical
    - Treat planned scale as non-binding unless backed by capital commitments and operating lines
  - - Prussian-blue chemistry and IP lead
    - Shutdown and asset-sale risk weaken control over service continuity and future product roadmaps
    - High
    - Review patent ownership, liens, and any post-shutdown asset transfer terms
  - - Niche focus on critical power
    - Eaton, Vertiv, and EnerSys already own buyer workflows, service expectations, and procurement channels
    - High
    - Measure reseller reach, installed base, and reference accounts rather than chemistry claims alone
  - - Sodium-ion category timing
    - North American sodium-ion demand may remain niche while Chinese players and LFP incumbents keep scaling faster
    - High
    - Stress-test the category thesis under low-demand and falling-LFP-cost scenarios
  notes: Severity is an author judgment based on cited public evidence. Critical indicates a risk that already crystallized
    in Natron's 2025 shutdown rather than a hypothetical future threat.
