  title: Natron won the chemistry argument but lost the financing and channel argument
  body: Natron's public record supports a real technical wedge in nonflammable, ultra-fast-cycling sodium-ion packs for industrial
    and critical-power jobs. The company still shut down because category demand, capital access, pricing proof, and incumbent
    ecosystem depth all moved against it faster than its planned scale-up could materialize.
