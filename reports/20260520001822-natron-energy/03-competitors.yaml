  evidenceGaps:
  - type: missing-source
    severity: material
    topic: natron-pricing
    missingEvidence: Executed Natron customer quotes or contracts showing realized $/kW or $/kWh pricing, warranty terms,
      and service scope against comparable UPS alternatives.
    whyItMatters: Without realized pricing, the chapter can only judge Natron's cost position qualitatively even though TCO
      is a top buyer criterion.
    diligencePath: Request closed-won customer proposals, pipeline quotes, and any archived discount schedule or warranty
      appendix from Natron's commercial team files.
    relatedQuestionRefs:
    - QP018
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: channel-coverage
    missingEvidence: Named distributors, UPS integrators, and service partners carrying Natron products, plus installed-base
      counts by segment and geography.
    whyItMatters: Distribution reach is central to competing with Eaton, Vertiv, and EnerSys, yet public evidence on Natron's
      channel footprint is minimal.
    diligencePath: Review reseller agreements, partner pipeline reports, service contracts, and installed-base dashboards
      for Natron's critical-power accounts.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: ip-durability
    missingEvidence: Patent-family map, maintenance status, and any post-shutdown asset-sale or license terms governing Natron's
      Prussian-blue intellectual property.
    whyItMatters: Moat durability after shutdown depends on whether Natron's IP remains controlled, enforceable, and serviceable
      rather than simply technically differentiated.
    diligencePath: Pull patent docket records, lien filings, sale documents, and restructuring materials for any disposition
      of Natron's technology assets.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
