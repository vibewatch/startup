  rows:
  - - Natron Energy
    - Direct sodium-ion UPS / industrial challenger
    - ~200 employees; latest $189M deal; 600 MW current plant and 24 GW plan before shutdown
    - Critical power, industrial peak shaving, EV fast charging
    - Nonflammable Prussian-blue chemistry; <15 min recharge; >50k cycles
    - Lost the scale race and shut down in 2025 before NC expansion
  - - CATL sodium-ion
    - Direct sodium-ion + global battery incumbent
    - Top-5 cell maker cohort controlling ~70% of global capacity; lithium-compatible scale
    - Transport and energy storage
    - 160 Wh/kg first-gen sodium-ion; 15-minute 80% charge; huge manufacturing leverage
    - Not optimized around Natron's short-duration UPS niche
  - - BYD Battery-Box
    - LFP stationary-storage substitute
    - Top-5 cell maker cohort; modular systems up to 983 kWh
    - Backup, off-grid, residential and commercial storage
    - Installer-friendly LFP platform with broad stationary fit
    - Energy-oriented stationary storage rather than ultra-fast industrial UPS
  - - EnerSys
    - Reserve-power incumbent
    - $8.01B market cap; $3.73B revenue
    - Reserve power, data centers, industrial power
    - Broad battery plus AC/DC power and monitoring catalog
    - Less differentiated on chemistry innovation
  - - Eaton
    - UPS ecosystem incumbent
    - $144.40B market cap; $28.52B revenue
    - Enterprise and hyperscale UPS
    - Bundled UPS, lithium batteries, BMS, and service economics
    - Competes with lithium architecture rather than sodium-ion chemistry
  - - Vertiv
    - UPS ecosystem incumbent
    - $123.92B market cap; $10.84B revenue
    - Mission-critical data-center UPS
    - 10-600kW modular UPS with lithium/VRLA options and DCIM integration
    - System breadth can overwhelm niche battery specialists
  - - HiNa Battery
    - Direct sodium-ion China peer
    - Core sodium-ion patent holder; broad application focus
    - Large-scale storage, EVs, low-speed vehicles
    - Low-cost, long-life, high-safety sodium-ion platform
    - Less UPS-specific evidence than Natron
  - - Peak Energy
    - U.S. sodium-ion stationary challenger
    - $10M seed + $55M Series A; 3.5 MWh pilot; 20+ GWh path
    - Grid-scale stationary storage
    - Passively cooled sodium-ion, U.S. manufacturing, take-or-pay contracts
    - Stationary/grid first rather than short-duration UPS
  - - Eos Energy
    - Adjacent alternative-chemistry peer
    - $2.33B market cap; $0.11B revenue
    - Resilient grids, renewables, microgrids
    - U.S.-made zinc-based long-duration storage
    - Solves a different duration problem than Natron
