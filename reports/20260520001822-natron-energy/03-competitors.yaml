- id: incumbent-ups-and-reserve-power-substitutes
  title: The substitute set was dominated by incumbents that already owned the buyer relationship
  body: |-
    Natron did not just compete with other sodium-ion teams. Buyers in data-center backup and industrial resilience could also choose proven LFP, reserve-power batteries, or complete UPS stacks from incumbents. BYD's Battery-Box is the clearest LFP stationary substitute in this set: it serves backup, off-grid, and commercial use cases and scales from small residential systems to nearly 1 MWh with a modular installer-driven architecture. EnerSys comes from the reserve-power side, with a catalog that includes PowerSafe and DataSafe batteries as well as AC/DC power and monitoring tools sold into data-center and industrial environments.

    Eaton and Vertiv are the hardest substitutes for Natron because they compete at the system-architecture layer rather than at chemistry alone. Eaton frames lithium UPS batteries around BMS-managed safety, faster recharge, smaller footprint, and lower lifetime operating burden versus VRLA. Vertiv's Liebert APM2 extends that bundle with modular 10-600 kVA/kW UPS capacity, hot-swappable lithium or VRLA batteries, and direct BMS/DCIM integration. Their balance sheets are also in a different league: Eaton and Vertiv each generate multi-billion-dollar annual revenue, which means procurement teams can buy service, controls, redundancy, and support from the same vendor that sells the battery option. Natron had better chemistry differentiation than these incumbents, but not their ecosystem control.
