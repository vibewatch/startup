chapter:
  number: 4
  title: "Financials"
  summary: "Lyte has raised $272 million in total equity financing to date, including a $165 million Series C in September 2026 that valued the physical AI perception company at $1.6 billion post-money. While management reports that its initial sensing silicon and hardware production batches are continuously sold out across mobile robotics and humanoid deployments, unit economics, gross margins, pricing tiers, and revenue recognition remain unverified private metrics requiring targeted diligence."
sections:
  - id: "capital-adequacy-and-financing"
    title: "Capital Adequacy, Valuation, and Financing Trajectory"
    body: "Lyte closed a $165 million Series C round in September 2026 led by Maverick Silicon, bringing its lifetime equity funding to $272 million since founding in 2021 and establishing a $1.6 billion post-money valuation. The financing followed an aggregate $107 million Series A round announced when the company emerged from stealth in January 2026. Management has designated the Series C proceeds to scale silicon fabrication, expand its LyteVision hardware and software platform, and staff engineering, operations, and support functions across an organization of approximately 120 employees. The balance sheet provides substantial near-term runway for capital-intensive custom ASIC and sensor production, yet forward cash burn and capital expenditure commitments to merchant foundries remain undisclosed private variables."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
  - id: "revenue-streams-and-pricing"
    title: "Commercial Model, Revenue Streams, and Pricing Structure"
    body: "Lyte commercializes physical AI perception by bundling custom 4D sensing silicon, RGB optical modules, and edge inertial sensors into unified hardware blocks managed by its LyteVision spatial operating software. The primary revenue stream derives from proprietary hardware product sales and development kits delivered to robotics original equipment manufacturers across industrial inspection, warehouse logistics, and manufacturing automation. The company also pursues spatial intelligence platform software licensing and developer integration fees. However, list prices, per-unit volume discounting schedules, and customer software recurring subscription terms remain strictly private, leaving realized average selling prices and recurring revenue mix unverified by external diligence."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure, Gross Margin Drivers, and Capital Intensity"
    body: "Lyte's operational cost structure is heavily weighted toward semiconductor design, custom optics tooling, foundry packaging, and high-compensation physical AI engineering talent. The company's fabless semiconductor model requires upfront tape-out and masking capital expenditures alongside working capital buffers to support custom silicon inventory runs. Co-founder Alexander Shpunt confirmed that all initial sensing silicon, chips, and hardware batches have been continuously sold out since emerging from stealth. However, the capital intensity of maintaining custom hardware fabrication alongside edge software deployment presents structural margin compression risks if foundry wafer yields fluctuate or assembly lead times lengthen during scaling."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "financial-verdict-and-diligence"
    title: "Financial Verdict, Operating Risk, and Underwriting Blockers"
    body: "From an underwriting standpoint, Lyte commands top-tier venture sponsorship and proven technical leadership from pioneering Apple Face ID and PrimeSense executives. Nonetheless, third-party diligence encounters critical data blockers: historical recognized revenue, current annual recurring revenue, gross margins, and customer contract backlog are entirely undisclosed. Furthermore, industry-wide macro analysis from optical and photonic technology funds underscores severe long-term capital intensity, cyclical demand shifts, supply chain disruption, and rapid technology obsolescence across advanced optoelectronic hardware. Lyte's long-term enterprise valuation depends on whether it can successfully transition from capital-intensive custom hardware delivery to high-margin recurring spatial perception software."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
