      - number: '3.2'
        title: Competitor Profile and Scale Comparison
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitors across the physical AI perception sector reveals stark contrasts in capital scale,
              technical specialization, and organizational maturity. Traditional component suppliers operate at high
              manufacturing volumes but offer isolated point solutions that lack spatial intelligence algorithms or
              unified data pipelines. Conversely, custom in-house perception development is restricted to well-funded
              robotics enterprises due to the steep engineering overhead and talent scarcity identified in industrial
              automation surveys. Lyte has established significant capital scale, raising $107 million upon emerging
              from stealth in January 2026 and securing a $165 million Series C round led by Maverick Silicon in
              September 2026, reaching a post-money valuation of $1.6 billion. The company's executive team brings
              distinctive engineering credibility rooted in Apple's depth-sensing and PrimeSense heritage. This pedigree
              provides Lyte with deep institutional knowledge in silicon-level perception, differentiating the company
              from smaller venture-backed sensor startups and generic machine vision integrators.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
