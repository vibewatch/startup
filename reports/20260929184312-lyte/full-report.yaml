              - CR013
      - number: '7.4'
        title: Capital Intensity, Gross Margin Exposure, and Comprehensive Risk Heatmap
        blocks:
          - type: paragraph
            body: >-
              Developing proprietary semiconductor hardware and physical AI perception infrastructure is fundamentally
              capital intensive. Despite securing $165 million in Series C financing in September 2026 at a $1.6 billion
              valuation, bringing total paid-in capital to $272 million, Lyte incurs substantial cash burn driven by
              tape-out expenses, specialized engineering compensation, custom optical tooling, and inventory working
              capital requirements. To sustain its targeted hardware-plus-software business model, Lyte must transition
              from low-volume pilot batches to high-volume manufacturing runs that achieve favorable silicon wafer yield
              curves. If customer production adoption scales more slowly than anticipated, fixed fabrication commitments
              and inventory carrying costs will compress gross margins and accelerate cash consumption. To synthesize
              Lyte's overall risk posture across regulatory, operational, partner, and financial dimensions, the
              investment matrix evaluates residual exposures after accounting for management's technical mitigations,
              capital reserves, and ongoing engineering controls.
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
