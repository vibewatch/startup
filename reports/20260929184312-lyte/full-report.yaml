              - CR002
              - CR005
              - CR006
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Custom Silicon Dependency Creates Inherent Supply Chain Fragility
            body: >-
              Lyte's core architectural strength—its custom silicon unifying 4D sensing, RGB imaging, and motion
              awareness from the transistor level—is simultaneously its primary operational vulnerability. Unlike
              robotics software vendors that operate asset-light models, Lyte is bound to semiconductor fabrication lead
              times, expensive wafer tape-outs, and single-source packaging partners. Any disruption at the foundry or
              packaging level directly throttles hardware revenue and customer deployment timelines.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Customer Diversification Is the Critical Operational De-Risking Lever
            body: >-
              Because initial production batches of LyteVision are concentrated among early adopters in warehouse
              logistics and industrial inspection, Lyte's near-term valuation is heavily dependent on those customers
              successfully scaling their own fleets. Broadening commercial integration across quadrupeds, humanoids, and
              robotaxis will be essential to decouple Lyte's financial performance from the execution risks of any
              single anchor robotics OEM.
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              Lyte presents a compelling investment case anchored in full-stack physical AI infrastructure, replacing
              fragmented off-the-shelf robotics sensor clusters with proprietary silicon and synchronized 4D edge
              perception. Founded by Alexander Shpunt, Arman Hajati, and Yuval Gerson—the engineering architects behind
              Microsoft Kinect and Apple's Face ID—Lyte addresses the foundational sensing bottleneck that currently
              impedes autonomous robot deployment across complex industrial settings. We assign an overall investment
              recommendation of Buy with Medium confidence and a Medium risk rating, categorizing the valuation stance
              as Stretched at the current $1.6 billion post-money mark. The thesis is reinforced by tier-1 institutional
              backing from Maverick Silicon, Fidelity, Atreides, and semiconductor pioneer Avigdor Willenz, as well as
              verified production shipments to inspection, logistics, and manufacturing customers. However, the
              anti-thesis centers on the absence of publicly disclosed recurring revenue metrics, customer concentration
              risks in early commercial scaling, and broad industrial implementation inertia. Investors must balance
              category-defining silicon moats against early-stage commercialization execution.
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Capital Efficiency
        blocks:
          - type: paragraph
            body: >-
              Lyte has demonstrated remarkable fundraising velocity, raising $272 million across four equity rounds
              since its 2021 founding. The company operated in stealth until January 2026, when it formally emerged with
              $107 million in aggregate capital, culminating in a $60 million Series B at a $458.94 million valuation
              ($12.69 per share). Just eight months later, on September 2, 2026, Lyte closed a $165 million Series C led
              by Maverick Silicon at $36.84 per share, establishing a $1.6 billion post-money valuation and elevating
              managing partner Andrew Homan to the board. The Series C price per share represents an eightfold gain over
              the June 2024 Series A mark of $4.43 ($148.15 million post-money) and a twenty-two-fold increase over the
              December 2022 Series Seed price of $1.68 ($40 million post-money). Capital structure records from Forge
              Global confirm that all preferred series carry standard 1.0x non-participating liquidation preferences
              without cumulative dividend overhangs, preserving clean common equity upside. Nonetheless, the rapid
              valuation appreciation has created significant liquidation preference seniority ($272 million aggregate
              preference stack) that early-stage investors must evaluate when modeling downside risk distribution.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Valuation Benchmarks, Secondary Signals, and Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              Valuing Lyte requires examining both high-multiple physical AI foundation platforms and
              hardware-integrated robotics suppliers. Private market benchmarks compiled by Forge Global illustrate a
              pronounced valuation bifurcation: AI foundation model developers such as Figure AI ($42.5 billion Series
              C) and Skild AI ($14 billion Series C) command massive speculative premiums, whereas commercial robotics
              and automated materials handling peers such as Agility Robotics ($2.12 billion Series C-3) and Dexterity
              ($1.66 billion Series C-1) trade closely in line with Lyte's $1.6 billion capitalization. Crucially,
              secondary market indicators on Forge Global highlight acute private market illiquidity: active buy orders
              total merely $100,000 against $2.00 million in asking orders, with no established Forge Price or recent
              transaction matches. This wide bid-ask spread suggests that private secondary liquidity remains
              constrained, meaning that current secondary marks offer no corroboration for an expansion beyond the
              primary round price. In the absence of audited ARR or gross margin disclosures, Lyte's pricing relies
              heavily on forward commercialization milestones rather than trailing multiples, reinforcing the need for
              strict valuation discipline.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV014
      - number: '8.4'
        title: Scenario Return Modeling, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our return framework evaluates Lyte across bull, base, bear, and liquidation scenarios over a three-year
              horizon through 2029. Under the base case (50% probability), Lyte achieves $120 million in revenue by
              expanding LyteVision across warehouse automation, mobile inspection, and industrial manufacturing,
              supporting a $1.8 billion valuation at a 15x multiple (1.1x MOIC). In the bull case (25% probability),
              Lyte emerges as the undisputed standard perception architecture for physical AI, scaling to $250 million
              in high-margin ARR at a 20x multiple to deliver a $5.0 billion valuation (3.1x MOIC, ~33% annualized
              return). Conversely, the bear case (20% probability) models customer integration friction and adoption
              delays—consistent with McKinsey data indicating that over 60% of industrial enterprises lack robotic
              integration capabilities—leading to revenue stagnation at $40 million and valuation contraction to $700
              million (-56% downside). A liquidation or intellectual property sale scenario (5% probability) yields
              approximately $150 million to $200 million. Definitive investment commitments should remain contingent on
              Phase II diligence verifying contract backlog conversion, unit silicon bill-of-materials margins, and
              customer pilot-to-production velocity.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline at $1.6B Post-Money Valuation
            body: >-
              Lyte warrants a Buy recommendation on the strength of its proprietary silicon perception architecture and
              exceptional Apple/PrimeSense pedigree. However, because its post-money valuation expanded 3.5x in under a
              year to $1.6 billion without audited commercial revenues, investors should enforce strict position-sizing
              limits and avoid paying secondary market premiums.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV012
          - type: callout
            title: Secondary Market Illiquidity and Industrial Adoption Headwinds
            body: >-
              Private market data from Forge Global reveals negligible secondary trading liquidity, while McKinsey
              estimates indicate over 60% of target industrial customers lack internal integration capabilities. These
              dual constraints could prolong sales cycles and compress downside valuations in a capital-constrained
              environment.
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV007
