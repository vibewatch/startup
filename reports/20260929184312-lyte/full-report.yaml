  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Stack Definition, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Lyte defines its addressable market around the foundational perception layer of physical AI, developing
              vertically integrated custom silicon, multimodal sensors, and spatial software for autonomous machines.
              Rather than building complete robotic vehicles or competing in generalized enterprise software, Lyte
              captures spending allocated to high-performance spatial sensing, real-time edge compute, and sensor
              fusion. At the core of this stack is LyteVision, which unifies coherent 4D vision, high-resolution RGB
              imaging, and inertial motion sensing onto a synchronized hardware-software pipeline. The status quo in
              commercial robotics relies on assembling off-the-shelf discrete sensors from disparate component vendors,
              forcing engineering teams to spend months troubleshooting sensor fusion, calibration drift, and latency.
              Lyte eliminates this integration cycle by delivering unified spatial data through a single physical
              connection, earning the CES 2026 Best of Innovation Award in Robotics. Crucially, the market boundary
              strictly excludes legacy consumer and entertainment software domains that share the company name, such as
              the secondary event and concert ticketing reservation exchange formerly operated by Lyte, Inc.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Capital Scale
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for physical AI perception requires analyzing top-down industry growth
              projections alongside bottom-up hardware bill-of-materials allocations. On a macro level, Grand View
              Research projects the global artificial intelligence robotics market will expand to reach $125 billion by
              2030, driven by the proliferation of autonomous mobile robots, automated inspection platforms, and
              next-generation collaborative systems. For physical AI systems operating in dynamic real-world
              environments, real-time edge processing is mandatory to prevent stale perception decisions. Assuming
              merchant perception silicon and integrated sensor blocks represent approximately 8% to 12% of total
              autonomous machine hardware expenditure, the serviceable addressable market (SAM) for dedicated perception
              hardware spans an estimated $8 billion to $15 billion by 2030. Following its emergence from stealth with
              $107 million in January 2026, Lyte secured a $165 million Series C round led by Maverick Silicon in
              September 2026 at a $1.6 billion post-money valuation, bringing total capital raised to $272 million.
              Commercial production shipments have commenced to leading customers across inspection, logistics, and
              manufacturing, though granular customer contract values and bottom-up SOM figures remain undisclosed
              private metrics.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
