      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Lyte was founded in 2021 by Alexander Shpunt, Arman Hajati, and Yuval Gerson, a trio whose prior work
              spans PrimeSense and Apple's sensing organizations. The company describes itself as the perception layer
              for physical AI: its LyteGalaxy platform combines sensors, compute, software, and algorithms, while
              LyteVision integrates coherent 4D vision, RGB, and inertial sensing at the edge. This is a
              product-platform description, not evidence of a disclosed software or hardware revenue model. Public
              location evidence also needs normalization: January coverage calls the company Mountain View-based,
              whereas an industry-member directory lists a Sunnyvale street address. The Snapshot table therefore
              distinguishes sourced facts from open corporate-identity questions rather than selecting one headquarters
              label without a legal filing.
