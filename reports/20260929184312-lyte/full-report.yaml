      - number: '6.4'
        title: Account Durability, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Lyte's long-term business model relies on a land-and-expand architecture centered on custom silicon and
              hardware-software lock-in. When a robotics OEM designs LyteVision into its physical robot chassis,
              mechanical mounts, electrical wiring harnesses, and navigation compute stack, switching costs become
              formidable. Re-architecting a robot around competitor sensors requires complete mechanical re-engineering,
              recalibration, and retraining of physical AI foundation models. Consequently, initial evaluation and pilot
              design wins create high account durability and natural expansion as customers scale fleet deployments.
              However, this model introduces acute customer concentration risks: early commercial hardware revenues are
              typically driven by a small handful of high-volume robotics manufacturers. Delays in an OEM's commercial
              production ramp or changes in customer procurement priorities could disproportionately impact Lyte's
              shipping volumes and quarterly cash flow, underscoring the critical need to diversify its OEM design-win
              pipeline.
            claimRefs:
              - CU007
              - CU008
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
              - CU007
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Switching Costs Create Exceptional Account Durability
            body: >-
              In physical AI robotics, perception hardware is deeply entwined with mechanical, electrical, and
              algorithmic system architecture. Once an OEM designs Lyte's custom sensing silicon and unified optical
              block into its production robot, replacing Lyte requires a multi-month chassis redesign, sensor
              recalibration, and software model retraining. This structural moat provides Lyte with high net retention
              potential, provided initial production batches meet quality and delivery commitments.
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU014
              - CU015
          - type: callout
            title: Customer Concentration in Early Robotics Scaling
            body: >-
              Because the physical AI robotics market remains in an early transition from pilots to commercial scale,
              Lyte's near-term revenues are highly exposed to the commercialization timelines of a small cohort of
              anchor robotics OEMs. Any production bottleneck, hardware recall, or scaling pause at a key customer
              represents a material vulnerability for Lyte's revenue predictability.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Functional Safety Certifications, and Export Control Exposure
        blocks:
          - type: paragraph
            body: >-
              Lyte operates at the intersection of custom semiconductor design, optical sensing, and autonomous
              robotics, exposing the company to stringent international regulatory oversight and functional safety
              compliance frameworks. Because LyteVision is engineered to control machine perception in safety-critical
              industrial settings—including collaborative robot workcells, autonomous mobile robots (AMRs) sharing
              warehouse aisles with human workers, and automated inspection quadrupeds in hazardous facilities—the
              platform must satisfy rigorous machinery safety directives such as ISO 13849, IEC 61508, and ANSI/RIA
              R15.08. Any optical calibration failure, timestamp drift, or undetected sensor blindness in dusty,
              variable-lighting industrial conditions could lead to collisions, personal injury, and catastrophic
              operational shutdowns. Such incidents would trigger severe product liability claims, mandatory hardware
              recalls, and immediate suspension of commercial deployments. Furthermore, because Lyte designs proprietary
              sensing application-specific integrated circuits (ASICs) and coherent 4D perception algorithms, its
              technology is subject to evolving United States dual-use export control regulations and semiconductor
              restrictions administered by the Bureau of Industry and Security (BIS). Any regulatory determination
              classifying Lyte's advanced 4D perception silicon under high-performance computing or autonomous defense
              controls could restrict international customer shipments and constrain global supply chain expansion.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
