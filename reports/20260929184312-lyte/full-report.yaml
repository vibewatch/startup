              - CM013
              - CM014
      - number: '2.3'
        title: Target Buyer Segmentation, Economic Payers, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement of physical AI perception infrastructure is concentrated among original equipment
              manufacturers (OEMs) and enterprise automation operators across four primary segments: autonomous mobile
              robots (AMRs), industrial inspection systems, advanced manufacturing workcells, and next-generation
              humanoids or quadrupeds. The target buyer persona is typically a Vice President of Hardware Engineering or
              Chief Technology Officer who oversees vehicle architecture and sensor selection. The primary end users are
              robotics software developers and field deployment engineers who require calibrated, low-latency spatial
              inputs to execute navigation, obstacle avoidance, and manipulation tasks. Economic budget ownership
              resides within corporate R&D and product engineering capital expenditure budgets for new machine
              platforms, transitioning into operational production procurement as designs scale. The primary adoption
              trigger across customer segments is the elimination of multi-sensor calibration drift and the reduction of
              system integration lead times from quarters to weeks. Since emerging from stealth in January 2026, Lyte
              has translated this value proposition into active production deployments across logistics facilities,
              industrial inspection sites, and manufacturing lines.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM011
              - CM014
      - number: '2.4'
        title: Growth Drivers, Structural Adoption Constraints, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The primary catalyst driving demand for integrated perception is the widening capability gap within
              industrial automation. According to McKinsey & Co. research, more than 60% of industrial enterprises lack
              the internal technical expertise to implement robotic automation, with multi-sensor integration and
              calibration cited as major friction points. While off-the-shelf sensor components appear cheaper on a
              discrete bill of materials, the hidden costs of custom fusion software, latency overhead, and field
              reliability failures create compelling economic justification for pre-integrated stacks. However, adoption
              velocity is constrained by lengthy OEM design-in cycles and rigorous industrial safety certifications.
              Robotics OEMs require multi-quarter bench testing and field validation before transitioning perception
              architectures from prototypes to volume production runs. For investors and diligence teams, key unresolved
              priorities include quantifying per-unit average selling prices (ASPs), customer pilot-to-production
              conversion velocity, and gross margins on custom silicon versus third-party optical components. Because
              customer contracts and unit shipment volumes remain undisclosed private metrics, ongoing diligence must
              monitor OEM design wins and production cohort expansion.
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Perception Stack Verticalization Solves Robotics Integration Bottleneck
            body: >-
              In physical AI and robotics, standard integration involves purchasing discrete LiDAR, radar, cameras, and
              IMUs from separate component vendors, creating months of calibration drift, latency, and sensor fusion
              debugging. By co-designing proprietary silicon, sensors, and spatial software, Lyte captures higher module
              value while solving the core technical bottleneck that prevents industrial enterprises from scaling
              automation.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: callout
            title: Long Design-In Cycles and Enterprise Validation Friction
            body: >-
              While the top-down market tailwind is strong ($125B AI robotics by 2030), robotic OEMs and industrial
              buyers face rigorous multi-quarter safety qualification, simulation, and field test procedures before
              committing to production volumes. Perception hardware providers face substantial revenue ramp delays if
              OEM customer platform development cycles encounter engineering or certification hurdles.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Archetypes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for physical AI perception is defined by a fundamental architectural divide
              between fragmented component assembly and vertically integrated spatial intelligence. Most commercial
              robotics developers today rely on the status quo of assembling discrete sensors—such as optical cameras,
              LiDAR units, and separate inertial measurement units—procured from diverse third-party hardware
              manufacturers. This multi-vendor approach forces robotics engineering teams to build complex sensor-fusion
              software layers, manage asynchronous clock domains, and repeatedly troubleshoot calibration drift in the
              field. Lyte directly challenges this paradigm with its LyteVision platform, which packages 4D coherent
              vision, RGB imaging, and inertial sensing into a unified sensing module powered by proprietary edge
              silicon. In addition to multi-vendor component assemblies, the competitive landscape encompasses
              high-volume robotics OEMs that pursue internal custom hardware builds, as well as adjacent optical
              component incumbents that manufacture high-precision photonic subsystems for hyperscale and industrial
              markets.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
