  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Thesis Element
      - Core Argument
      - Evidence & Drivers
      - What Would Invalidate View
    rows:
      - - Full-Stack Silicon Perception
        - Unified 4D sensing on custom silicon eliminates latency and calibration drift of modular sensor suites.
        - CES 2026 Innovation winner; proven PrimeSense/Apple Face ID architectural pedigree.
        - Competitors achieve comparable edge synchronization using commodity sensors and open software.
      - - Tier-1 Investor Syndicate
        - >-
          Backing by Maverick Silicon, Fidelity, Atreides, and Avigdor Willenz provides deep capital and silicon
          governance.
        - $272 million raised with high-profile board addition from Maverick Silicon.
        - Governance conflicts or investor syndicate fatigue in financing capital-intensive hardware scaling.
      - - Customer Integration Friction
        - >-
          Industrial automation customers face steep engineering and cultural hurdles in adopting complex perception
          stacks.
        - McKinsey finding that over 60% of industrial companies lack internal robotic integration skills.
        - Turnkey reference designs and standard ROS/middleware drivers accelerate customer deployment.
      - - Valuation Multiple Contraction
        - Headline $1.6 billion valuation leaves limited room for operational execution missteps or macro downturns.
        - Steep 3.5x valuation step-up in under one year with illiquid secondary trading activity.
        - Contract backlog acceleration and high-margin recurring software attach justify premium pricing.
