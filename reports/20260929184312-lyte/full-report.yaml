      - number: '3.3'
        title: Capability Matrix and Technical Durability
        blocks:
          - type: paragraph
            body: >-
              Lyte's primary technical moat rests on the vertical integration of custom sensing silicon, multimodal
              hardware, and low-level spatial software. Standard robotics configurations process perception
              asynchronously, feeding disparate sensor outputs into central compute boards where software algorithms
              attempt to reconcile spatial discrepancies. In contrast, LyteVision measures motion and depth natively at
              the hardware level, aligning 4D vision and inertial measurements on a single synchronized timeline. This
              edge-native fusion substantially decreases decision latency and eliminates the integration failures that
              plague multi-vendor robotics deployments. However, the durability of this technical advantage depends on
              maintaining a performance lead over rapidly advancing general-purpose vision models and commodity hardware
              pipelines. If open-source perception algorithms and standardized compute platforms achieve comparable
              spatial accuracy without requiring bespoke silicon, the proprietary hardware moat could face
              commoditization pressure from lower-cost modular alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: Moat Durability, Commercial Model, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The commercial adoption of LyteVision involves substantial economic and operational switching costs for
              robotics manufacturers. When an autonomous mobile robot or industrial inspection OEM designs Lyte's
              unified sensor module into its physical chassis, the robot's physical mounting, wiring harnesses, and
              software navigation stack become tightly coupled to Lyte's proprietary architecture. While this dynamic
              creates strong post-adoption customer retention and high switching barriers, it also introduces friction
              during the initial sales cycle, as OEMs hesitate to depend on a single proprietary hardware supplier.
              Furthermore, Lyte maintains strict confidentiality regarding its per-unit module pricing, volume discount
              thresholds, and recurring software licensing fees, creating an evidence gap for underwriters evaluating
              unit economics. In adjacent optical sectors, public market comps demonstrate that component suppliers face
              cyclical customer concentration risks tied to capital expenditure cycles. Maintaining commercial
              defensibility will require Lyte to prove superior total-cost-of-ownership against commodity alternatives
              while securing multi-year OEM volume production commitments.
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Disruption in Robotics Perception
            body: >-
              Lyte's core competitive thesis challenges the prevailing robotics paradigm of cobbling together discrete
              vision, depth, and inertial sensors from disparate vendors. By implementing sensor fusion directly onto
              custom silicon at the edge, Lyte converts complex multi-month integration efforts into plug-and-play
              perception modules.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Vendor Lock-in and Proprietary Silicon Exposure
            body: >-
              While vertical integration eliminates calibration drift and sensor integration bottlenecks, it creates
              significant switching costs for robotics OEMs. Committing to LyteVision binds the robot's physical
              mounting, communication bus, and spatial software pipeline to a proprietary single-vendor hardware
              platform.
            calloutType: risk
            claimRefs:
              - CP001
              - CP010
              - CP014
