              - CU009
              - CU010
      - number: '6.3'
        title: Named Customer Proof, Deployment Profiles, and Defense Diligence
        blocks:
          - type: paragraph
            body: >-
              Publicly confirmed commercial deployments for Lyte remain structured primarily around robotics OEM
              categories rather than co-marketed enterprise logos, reflecting widespread non-disclosure agreements
              across competitive robotics and physical AI markets. Lyte's technology has been deployed across diverse
              physical form factors, including humanoids, quadrupeds, autonomous mobile robots, robotic arms, and
              mobility systems. In market diligence, automated data ingestion frequently encounters namespace confusion
              with unrelated entities sharing the 'Lyte' brand, notably Hypori's 'Hypori Lyte for Secure Messaging'
              deployed across 27,000 users in the Department of the Air Force and Air Combat Command. Diligence confirms
              that Hypori Lyte is a distinct virtual mobile infrastructure software product unrelated to Lyte AI's
              physical robotics perception silicon. For Lyte AI, named tier-one customer proof remains tightly held by
              management, though industry partners such as the Association for Advancing Automation (A3) validate Lyte's
              commercial integration as an active perception supplier to the automation ecosystem.
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
