  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Spatial Platform Architecture, and Edge Sensing Stack
        blocks:
          - type: paragraph
            body: >-
              Lyte develops an end-to-end perception system engineered specifically for robotics and Physical AI
              operating in complex, dynamic physical environments. The core commercial product is LyteVision, a
              vertically integrated perception platform and sensing block that natively fuses 4D vision (distance plus
              instantaneous velocity), RGB optical imaging, and inertial measurement unit (IMU) awareness at the
              physical edge into a single connection. The broader architectural umbrella, LyteGalaxy, coordinates this
              spatial intelligence across multimodal sensors, embedded compute, and proprietary algorithms to deliver a
              unified frame of reference. Traditional robotics workflows require robotics original equipment
              manufacturers (OEMs) to procure disparate LiDAR, camera, and IMU components from multiple merchant
              suppliers, calibrate extrinsic parameters manually, write complex fusion software, and debug recurring
              synchronization failures. Lyte addresses this structural bottleneck from the transistor up by fabricating
              custom sensing silicon and system-on-chip (SoC) architectures that eliminate asynchronous polling and
              sensor alignment pipelines, enabling autonomous machines to perceive position and motion natively rather
              than reconstructing them through compute-heavy post-processing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
