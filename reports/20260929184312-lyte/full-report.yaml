  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Operating Assumptions
      - Target Multiple & 2029 Value
      - Downside & Execution Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Standardization on LyteVision across autonomous logistics and inspection robots; $250M ARR by 2029; 70% gross
          margins.
        - 20x ARR multiple yields $5.0 billion valuation (3.1x MOIC; ~33% IRR).
        - Slower warehouse automation adoption; silicon supply disruptions.
        - 25% (High potential driven by foundational physical AI demand).
      - - Base Case
        - >-
          Steady industrial penetration; $120M revenue by 2029; blended 55% gross margin across hardware and software
          attach.
        - 15x revenue multiple yields $1.8 billion valuation (1.1x MOIC; ~3% IRR).
        - Extended customer pilot cycles; price competition from modular sensor makers.
        - 50% (Reflects solid execution in early production deployments).
      - - Bear Case
        - High customer integration friction; commoditization of depth sensors; revenue plateaus at $40M by 2029.
        - 10x revenue multiple yields $400M valuation (-75% loss on Series C entry).
        - Customer churn to low-cost alternatives; cash burn outpaces revenue growth.
        - 20% (Substantial downside if industrial adoption stalls).
      - - Breakup / Liquidation
        - Commercial traction fails; company acquired for intellectual property and patent portfolio.
        - Asset sale or acqui-hire valued at $150M-$200M (Series C liquidation preference partially impaired).
        - Complete failure of commercial scaling; executive departures.
        - 5% (Low probability given founding pedigree and cash cushion).
    notes: >-
      Scenario valuations assume a 3-year holding period through 2029 and model exit returns relative to the $1.6
      billion Series C post-money valuation.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
