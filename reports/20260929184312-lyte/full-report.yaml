      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Moat: Hardware-Synchronized Coherent 4D Sensing'
            body: >-
              Lyte's primary technical breakthrough is solving sensor fusion at the transistor level rather than in
              software. By measuring distance and velocity simultaneously on custom silicon, Lyte eliminates the
              millisecond-scale latency and calibration drift that plague conventional robotics stacks combining
              independent cameras and LiDARs.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE005
          - type: callout
            title: 'Ecosystem Risk: Complete Absence of Public Developer APIs and SDKs'
            body: >-
              According to independent evaluation by APIs.io, Lyte publishes no open APIs, SDKs, or machine-readable
              developer documentation, scoring 7.6/100 on API quality and 0/100 on agent readiness. This proprietary
              closed-hardware model limits broad developer experimentation and makes customer integration strictly
              dependent on direct engineering engagements.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Commercial Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              Lyte targets robotics original equipment manufacturers (OEMs), physical artificial intelligence
              developers, and industrial automation operators who require real-time 4D spatial perception in
              unstructured, dynamic physical operating environments. Historically, commercial robotics developers have
              faced severe integration bottlenecks: industry research from McKinsey indicates that over 60 percent of
              industrial companies lack internal capability to implement robotic automation, including complex sensor
              fusion. Robotics engineering teams typically spend months procuring disparate LiDAR, camera, and inertial
              components, calibrating disparate hardware, and resolving asynchronous sensor drift in software. Lyte's
              unified LyteVision platform addresses this structural friction by combining custom silicon, 4D sensing,
              RGB imaging, and motion awareness into a single edge module. The company's primary addressable customer
              segments span warehouse logistics providers deploying autonomous mobile robots (AMRs), industrial
              facilities utilizing automated inspection robots and quadrupeds, advanced manufacturing plants adopting
              robotic arms, and autonomous vehicle and robotaxi developers requiring robust predictive safety.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
              - CU011
      - number: '6.2'
        title: Commercial Adoption Trajectory and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Lyte's commercial trajectory accelerated rapidly following its emergence from stealth in January 2026.
              Prior to public disclosure, Lyte developed four internal generations of sensing prototypes and silicon
              architectures between 2021 and 2025. Following its $107 million stealth announcement and showcase at CES
              2026—where its perception platform received the Best of Innovation Award in Robotics—Lyte transitioned
              directly into production shipments. By September 2026, coinciding with its $165 million Series C round led
              by Maverick Silicon, the company confirmed active production shipments across inspection, logistics, and
              manufacturing customer bases. Investor commentary from Maverick Silicon highlighted that early customer
              demand has been broad and diverse, with initial sensor chip and hardware production batches continuously
              committed. However, as an early-stage private enterprise, Lyte has not publicly released aggregate
              deployed unit counts, active account rosters, or recognized annual recurring revenue, requiring investment
              underwriters to treat commercial velocity as early-stage production scaling.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
