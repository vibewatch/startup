callouts:
  - calloutType: "insight"
    title: "Perception Stack Verticalization Solves Robotics Integration Bottleneck"
    body: "In physical AI and robotics, standard integration involves purchasing discrete LiDAR, radar, cameras, and IMUs from separate component vendors, creating months of calibration drift, latency, and sensor fusion debugging. By co-designing proprietary silicon, sensors, and spatial software, Lyte captures higher module value while solving the core technical bottleneck that prevents industrial enterprises from scaling automation."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Long Design-In Cycles and Enterprise Validation Friction"
    body: "While the top-down market tailwind is strong ($125B AI robotics by 2030), robotic OEMs and industrial buyers face rigorous multi-quarter safety qualification, simulation, and field test procedures before committing to production volumes. Perception hardware providers face substantial revenue ramp delays if OEM customer platform development cycles encounter engineering or certification hurdles."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM011"
