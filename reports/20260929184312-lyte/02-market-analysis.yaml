chapter:
  number: 2
  title: "Market Analysis"
  summary: "Lyte addresses the physical AI perception layer, targeting a $125 billion AI robotics market by 2030 by replacing fragmented multi-vendor sensor assembly with vertically integrated 4D sensing silicon, edge compute, and spatial software across logistics, inspection, and manufacturing."
sections:
  - id: "market-boundary-definition"
    title: "Market Boundary, Stack Definition, and Included Spend"
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM006"
      - "CM012"
    tableRefs:
      - "TM001"
    body: "Lyte defines its addressable market around the foundational perception layer of physical AI, developing vertically integrated custom silicon, multimodal sensors, and spatial software for autonomous machines. Rather than building complete robotic vehicles or competing in generalized enterprise software, Lyte captures spending allocated to high-performance spatial sensing, real-time edge compute, and sensor fusion. At the core of this stack is LyteVision, which unifies coherent 4D vision, high-resolution RGB imaging, and inertial motion sensing onto a synchronized hardware-software pipeline. The status quo in commercial robotics relies on assembling off-the-shelf discrete sensors from disparate component vendors, forcing engineering teams to spend months troubleshooting sensor fusion, calibration drift, and latency. Lyte eliminates this integration cycle by delivering unified spatial data through a single physical connection, earning the CES 2026 Best of Innovation Award in Robotics. Crucially, the market boundary strictly excludes legacy consumer and entertainment software domains that share the company name, such as the secondary event and concert ticketing reservation exchange formerly operated by Lyte, Inc."

  - id: "addressable-market-sizing"
    title: "Addressable Market Sizing, Sizing Lenses, and Capital Scale"
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
    body: "Sizing the addressable market for physical AI perception requires analyzing top-down industry growth projections alongside bottom-up hardware bill-of-materials allocations. On a macro level, Grand View Research projects the global artificial intelligence robotics market will expand to reach $125 billion by 2030, driven by the proliferation of autonomous mobile robots, automated inspection platforms, and next-generation collaborative systems. For physical AI systems operating in dynamic real-world environments, real-time edge processing is mandatory to prevent stale perception decisions. Assuming merchant perception silicon and integrated sensor blocks represent approximately 8% to 12% of total autonomous machine hardware expenditure, the serviceable addressable market (SAM) for dedicated perception hardware spans an estimated $8 billion to $15 billion by 2030. Following its emergence from stealth with $107 million in January 2026, Lyte secured a $165 million Series C round led by Maverick Silicon in September 2026 at a $1.6 billion post-money valuation, bringing total capital raised to $272 million. Commercial production shipments have commenced to leading customers across inspection, logistics, and manufacturing, though granular customer contract values and bottom-up SOM figures remain undisclosed private metrics."

  - id: "buyer-segmentation-workflows"
    title: "Target Buyer Segmentation, Economic Payers, and Procurement Pathways"
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
      - "CM008"
    tableRefs:
      - "TM003"
    body: "Procurement of physical AI perception infrastructure is concentrated among original equipment manufacturers (OEMs) and enterprise automation operators across four primary segments: autonomous mobile robots (AMRs), industrial inspection systems, advanced manufacturing workcells, and next-generation humanoids or quadrupeds. The target buyer persona is typically a Vice President of Hardware Engineering or Chief Technology Officer who oversees vehicle architecture and sensor selection. The primary end users are robotics software developers and field deployment engineers who require calibrated, low-latency spatial inputs to execute navigation, obstacle avoidance, and manipulation tasks. Economic budget ownership resides within corporate R&D and product engineering capital expenditure budgets for new machine platforms, transitioning into operational production procurement as designs scale. The primary adoption trigger across customer segments is the elimination of multi-sensor calibration drift and the reduction of system integration lead times from quarters to weeks. Since emerging from stealth in January 2026, Lyte has translated this value proposition into active production deployments across logistics facilities, industrial inspection sites, and manufacturing lines."

  - id: "adoption-drivers-constraints-diligence"
    title: "Growth Drivers, Structural Adoption Constraints, and Diligence Priorities"
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM011"
      - "CM013"
      - "CM014"
    body: "The primary catalyst driving demand for integrated perception is the widening capability gap within industrial automation. According to McKinsey & Co. research, more than 60% of industrial enterprises lack the internal technical expertise to implement robotic automation, with multi-sensor integration and calibration cited as major friction points. While off-the-shelf sensor components appear cheaper on a discrete bill of materials, the hidden costs of custom fusion software, latency overhead, and field reliability failures create compelling economic justification for pre-integrated stacks. However, adoption velocity is constrained by lengthy OEM design-in cycles and rigorous industrial safety certifications. Robotics OEMs require multi-quarter bench testing and field validation before transitioning perception architectures from prototypes to volume production runs. For investors and diligence teams, key unresolved priorities include quantifying per-unit average selling prices (ASPs), customer pilot-to-production conversion velocity, and gross margins on custom silicon versus third-party optical components. Because customer contracts and unit shipment volumes remain undisclosed private metrics, ongoing diligence must monitor OEM design wins and production cohort expansion."
