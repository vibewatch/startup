            title: $1.6B 投后估值的入场纪律
            body: >-
              凭借自研芯片感知架构以及出色的 Apple / PrimeSense 团队背景，Lyte 值得给予买入（Buy）建议。然而，在缺乏经审计商业收入的情况下，其投后估值在不到一年内增长 3.5x 至
              $1.6B，投资者应执行严格的持仓规模上限，避免在老股市场上支付溢价。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV012
          - type: callout
            title: 老股市场缺乏流动性与工业采纳阻力
            body: Forge Global 的一级市场数据显示老股交易流动性微乎其微，而 McKinsey 估计超过 60% 的目标工业客户欠缺内部系统集成能力。这两重制约因素可能拉长销售周期，并在资本收紧环境下压缩下行估值。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV007
