      - number: '7.2'
        title: 运营脆弱性、自研芯片制造与量产爬坡风险
        blocks:
          - type: paragraph
            body: >-
              作为无晶圆厂半导体与传感硬件厂商，Lyte 在 2026 年量产爬坡阶段面临严峻的运营与供应链脆弱性。公司的核心技术差异化优势——将 4D 相干视觉、RGB
              成像与惯性测量统一到单条硬件时间线上的自研传感芯片——高度依赖先进半导体代工制程、精密光学封装以及亚微米级传感器标定工艺。Lyte Lyte
              自有芯片的生产完全依赖外部商用晶圆代工厂和专业封装厂。任何晶圆制造瓶颈、封装缺陷、载板短缺或良率损耗，都会直接削弱 Lyte 向物流、巡检和制造领域机器人客户交付量产订单的能力。此外，将精密光学模组与定制
              ASIC 组装在一起，对无尘车间制造公差提出了极高要求。假使早期量产批次遭遇良率下滑，或在热应力与机械冲击下出现实地可靠性故障，Lyte 将面临毛利率严重受损、客户迟交罚款以及高额质保维修支出的重压。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
