      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 自研芯片依赖性带来天然的供应链脆弱性
            body: >-
              Lyte 最核心的架构优势——从晶体管层级打通 4D 感知、RGB 成像与运动感知的自研芯片——恰恰构成了其最主要的运营软肋。不同于轻资产运营的机器人软件厂商，Lyte
              必须承受漫长的半导体代工交付周期、昂贵的晶圆流片成本以及对单一封装伙伴的依赖。晶圆厂或封装环节的任何波折，都会直接掐死硬件收入并拖垮客户部署排期。
            calloutType: risk
