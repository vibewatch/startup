      - number: '3.2'
        title: 竞品画像与体量对比
        blocks:
          - type: paragraph
            body: >-
              对比 Physical AI
              感知赛道的竞争者，可以看到各家在资本规模、技术专长和组织成熟度上的明显差异。传统零部件供应商出货量大，却只提供孤立器件，缺少空间智能算法和统一数据流水线。另一端，工业自动化调查反复指出研发成本高、人才稀缺，因此只有少数资金雄厚的机器人企业能自研全栈感知模块。Lyte
              融资规模已相当可观：2026 年 1 月公开亮相时融资 $107 million，随后在 2026 年 9 月完成由 Maverick Silicon 领投的 $165 million Series C
              轮融资，投后估值达 $1.6 billion。管理团队的工程声誉根植于 Apple 深度感知和 PrimeSense。这段技术积累让 Lyte
              在芯片级感知领域的深厚技术积淀，使其拉开了与小型风投传感器初创企业及通用机器视觉集成商的差距。
            claimRefs:
