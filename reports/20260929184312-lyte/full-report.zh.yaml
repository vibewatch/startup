      - number: '3.2'
        title: 竞对画像与资本规模对比
        blocks:
          - type: paragraph
            body: >-
              横向比对物理 AI
              感知赛道的竞争者，各方在资本规模、技术专精与组织成熟度上分化显著。传统元器件厂商虽具备大规模制造优势，但产品多为单点隔离方案，欠缺空间智能算法与统合的数据流水线。另一方面，由于工业自动化行业调查反映出的极高工程研发开销与顶尖人才短缺，自研全栈感知系统往往仅局限于资金雄厚的头部机器人企业。Lyte
              已构筑起可观的资本壁垒：2026 年 1 月出海面世即披露 $107M 融资，同年 9 月再获 Maverick Silicon 领投的 $165M Series C 轮融资，投后估值达到
              $1.6B。公司管理团队脱胎于 Apple 深度传感业务与 PrimeSense 技术班底，具备极具辨识度的工程公信力。这种技术渊源使 Lyte
              在芯片级感知领域拥有深厚的组织沉淀，与早期小型传感器初创企业及泛通用机器视觉集成商拉开了差距。
