  - id: FE001
    title: LyteVision 全栈运行架构
    type: stack
    summary: 垂直一体化感知架构，清晰呈现从物理传感、定制芯片、嵌入式固件到中间件集成的演进链路。
    data:
      layers:
        - label: 应用与下游计算层
          detail: 对接机器人运动控制系统、自主导航算法栈及数字孪生仿真平台的集成交互层。
        - label: 传输与计算加速中间件
          detail: 依托 NVIDIA Holoscan Sensor Bridge、NITROS 协议与 CUDA 计算加速构建的零拷贝数据流层。
        - label: 嵌入式固件与实时操作系统（RTOS）
          detail: 运行于嵌入式 Linux 与 RTOS 之上的确定性运行时层，支撑敏捷原型验证与硬件在环（HIL）测试。
        - label: 自研芯片与 SoC 片上互联
          detail: 搭载定制逻辑单元、Arm 嵌入式内核及一致性片上网络（NoC）的专用处理层。
        - label: 边缘传感与光电换能层
          detail: 实时捕获高相干4D空间视觉、高分辨率RGB图像及惯性运动遥测数据的物理传感层。
        - label: 晶圆代工与物理芯片底层
          detail: 借助商业晶圆代工厂流片制造的底层半导体衬底与先进封装物理层。
    approximationNotes: 架构层级划分依据公开专利文献、工程技术披露、APIs.io 平台审计及招聘岗位说明书梳理；内部元器件总线拓扑结构仍属于机密专有信息。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户落地旅程图
    type: journey-map
    summary: 机器人OEM整机厂采纳 Lyte 集成感知平台的客户旅程与业务拓展全生命周期，涵盖从前期评估直至全机队铺开的完整阶段。
    data:
      items:
        - label: 阶段一：架构评估与开发者套件验证
          touchpoints:
            - 将通用货架传感器套件与统一4D传感技术开展基准性能比对
            - 采购 LyteVision 评估开发者套件
            - 验证单线缆边缘计算连接与IMU惯性同步性能
        - label: 阶段二：原型机集成与仿真测试
          touchpoints:
            - 将定制传感器模组集成嵌入机器人实体底盘
            - 将 LyteVision API 接入机器人操作系统（ROS）导航算法技术栈
            - 在多变光照与动态障碍物复杂工况下验证感知精度
        - label: 阶段三：锁定定点（Design Win）与前装导入
          touchpoints:
            - 将自研ASIC芯片与光学模块正式写入OEM整机物料清单（BOM）
            - 签约锁定量产硬件分批交付计划与交期承诺
            - 确立产品质保、固件远程升级（OTA）及功能安全合规协议
        - label: 阶段四：商业化机队放量与首批量产交付
          touchpoints:
            - 推进商业化机器人车队在客户仓储中心及制造厂区实地规模部署
            - 首批交付边缘传感芯片规模量产模组
            - 持续监测现场实际运行指标与实时避障遥测数据
        - label: 阶段五：机队群体智能演进与感知模型拓展
          touchpoints:
            - 订阅 LyteVision 空间智能算法更新与进阶感知大模型
            - 赋能活跃机器人节点持续接入具身智能前沿算法突破
            - 将 Lyte 平台技术栈复用拓宽至全新机器人构型与新产品线
        - label: 阶段 6：跨代平台续约与 Tier-1 标配化
          touchpoints:
            - 将升级版 LyteCore 芯片确立为下一代机器人平台标配
            - 签署多年期批量供应协议并展开战略性协同研发
            - 在全球客户机群中确立企业级硬件深度绑定
    approximationNotes: 本示意性业务框架模拟机器人 OEM 标准设计导入周期；具体商业合同阶段受客户保密协议（NDA）约束。
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU014
      - CU015
