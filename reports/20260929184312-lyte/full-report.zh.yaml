  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、技术栈划分与目标采购预算
        blocks:
          - type: paragraph
            body: >-
              Lyte 将其目标市场锚定在物理 AI
              的底层感知环节，专门为自主机器开发垂直集成的定制芯片、多模态传感器及空间计算软件。公司不涉足整机机器人制造，亦不参与通用企业级软件竞争，而是专注于切入高精度空间感知、实时边缘计算与传感器融合领域的采购预算。该技术栈的核心载体为
              LyteVision，其将相干 4D 视觉、高分辨率 RGB
              成像及惯性运动传感整合至同一软硬件同步流水线中。当前商用机器人普遍采用采购多家第三方分立元器件拼装的方案，导致工程团队不得不耗费数月排查传感器融合误差、标定漂移与延迟问题。Lyte
              借助单一物理接口输出统一空间感知数据，直接规避了这套繁琐的集成流程，并凭此斩获 CES 2026 机器人品类最佳创新奖（Best of Innovation
              Award）。在尽调口径上，必须将该市场边界与同名涉足二手演出及音乐节票务平台的旧实体 Lyte, Inc. 严格区分。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
