          - type: callout
            title: 客户多元化是运营降风险的核心杠杆
            body: >-
              由于 LyteVision 的初期量产批次高度集中在仓储物流和工业巡检的尝鲜客户手中，Lyte 近期的估值支撑极大程度取决于这些客户自身能否顺利扩大机器人部署规模。向四足机器人、人形机器人和 Robotaxi
              广泛拓展商用集成，是将其财务表现与单一核心机器人 OEM 执行风险解绑的必经之路。
