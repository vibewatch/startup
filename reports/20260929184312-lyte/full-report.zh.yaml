  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 经营假设
      - 目标倍数与 2029 年估值
      - 下行风险与执行触发因素
      - 概率判断
    rows:
      - - 乐观情景
        - LyteVision 成为自主物流与巡检机器人的标准感知架构；到 2029 年实现 $250M ARR；毛利率达 70%。
        - 按 20 倍 ARR 计算估值达 $5.0B（3.1 倍 MOIC；约 33% IRR）。
        - 仓储自动化渗透慢于预期；芯片供应中断。
        - 25%（具身智能底层需求释放驱动的高潜力）。
      - - 基准情景
        - 工业领域稳步渗透；到 2029 年收入达 $120M；硬件加软件综合毛利率为 55%。
        - 按 15 倍收入计算估值达 $1.8B（1.1 倍 MOIC；约 3% IRR）。
        - 客户试点周期拉长；面临拼装传感器厂商的价格战。
        - 50%（反映早期量产部署中的稳健执行）。
      - - 悲观情景
        - 客户集成阻力大；深度传感器商品化；到 2029 年收入停滞在 $40M。
        - 按 10 倍收入计算估值为 $400M（较 C 轮入场点亏损 75%）。
        - 客户流失至廉价替代品；烧钱速度超过收入增速。
        - 20%（若工业落地停滞，面临巨大下行风险）。
      - - 破产清算 / 出售
        - 商业化未能跑通；公司最终因知识产权与专利组合被收购。
        - 资产出售或人才并购估值在 $150M–$200M（C 轮清算优先权部分受损）。
        - 商业放量彻底受挫；高管团队离职。
        - 5%（鉴于创始团队背景与充足现金垫，发生概率较低）。
    notes: 各情景估值均假设持有 3 年至 2029 年，并测算相对于 C 轮 $1.6B 投后估值的退出回报。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
