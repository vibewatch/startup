        title: 具名客户落地证据、部署画像与防务概念辨析
        blocks:
          - type: paragraph
            body: >-
              鉴于机器人与物理 AI 竞争格局下保密协议的普遍约束，Lyte 公开确认的商业交付仍主要按 OEM 行业大类划分，未见联合宣传的头部客户标杆商标。Lyte
              的技术方案已适配多种形态载体，包括人形机器人、四足机器狗、自主移动机器人（AMR）、工业机械臂及移动出行底盘。在尽职调查中，自动化数据爬取常受同名品牌干扰，尤其是 Hypori 旗下面向美国空军及空战司令部
              2.7 万名用户部署的“Hypori Lyte 安全通信”产品。经核查确认，Hypori Lyte 属于虚拟移动基础设施软件，与 Lyte AI 的物理机器人感知芯片毫无关联。就 Lyte AI
              本身而言，一线具名商业背书仍被管理层列为商业机密，但推进自动化协会（A3）等行业机构的收录，从侧面印证了 Lyte 作为活跃感知供应商在自动化生态圈中的真实落地。
