      - number: '7.4'
        title: 资本密集度、毛利率风险与综合风险热力图
        blocks:
          - type: paragraph
            body: >-
              研发自研半导体硬件与 Physical AI 感知基础设施是一项极其烧钱的重资产工程。尽管公司在 2026 年 9 月以 $1.6 billion 估值完成了 $165 million 的 Series C
              轮融资，累计实缴资本达到 $272 million。流片开销、专业工程团队薪酬、定制光学模具和库存营运资金需求，都让 Lyte 持续大量消耗现金。要维持“硬件 + 软件”模式，Lyte
              必须尽快从小批量试点转向大规模制造，并跑出良好的晶圆良率。若客户量产落地慢于预期，固定代工产能承诺和库存成本会挤压毛利率、加快现金消耗。投资评估矩阵综合考察监管、运营、合作伙伴与财务风险，并在纳入管理层的技术缓释举措、资金储备和持续工程管控后，评估剩余风险敞口。
            claimRefs:
              - CR014
              - CR015
              - CR016
