            title: 高切换成本构筑出色的客户留存持久度
            body: >-
              在 Physical AI 机器人领域，感知硬件与机械、电气及算法架构深度耦合。一旦 OEM 将 Lyte 的自研传感芯片与一体化光学模块设计进量产机型中，换掉 Lyte
              就需要花费数月重新设计底盘结构、重新标定传感器并重训软件模型。只要初期量产批次能够兑现品质与交付承诺，这一结构性壁垒就将为 Lyte 带来极高的净留存潜力。
            calloutType: insight
