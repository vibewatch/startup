        title: 客户留存韧性、增购扩容动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Lyte 的长期商业模式依托以自研芯片和软硬件一体化为核心的增购扩张（Land-and-Expand）路径。一旦机器人 OEM 在物理底盘、机械支架、电气线束及导航计算架构中选型导入
              LyteVision，客户的替换门槛便变得极为陡峭。若改用竞品传感器，不仅需要彻底重构整机机械工程，还需重新标定全套系统并对物理 AI
              基础模型重新训练。因此，早期的评估测试与原型定点能够带来极高的客户黏性，并随着客户设备集群的铺开自然实现营收扩容。然而，该模式伴随着尖锐的客户集中度风险：早期硬件收入往往由少数几家放量的标杆机器人大客户所贡献。核心
              OEM 客户量产爬坡延期或采购重心的转移，都会对 Lyte 的当期出货量与现金流产生不成比例的剧烈冲击，凸显了加快拓展多元化 OEM 定点管线的紧迫性。
