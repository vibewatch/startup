      - number: '8.2'
        title: 融资历史、股权结构表动态与资本效率
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，Lyte 展现出极快的融资节奏，四轮股权融资累计吸纳 $272 million。公司此前一直处于隐身模式，直至 2026 年 1 月正式公开亮相，当时累计融资达 $107
              million，并完成一笔投后估值 $458.94 million（每股 $12.69）的 $60 million B 轮融资。仅八个月后，Lyte 于 2026 年 9 月 2 日完成由 Maverick
              Silicon 领投的 $165 million C 轮融资，每股价格 $36.84，投后估值达 $1.6 billion，管理合伙人 Andrew Homan 随后加入董事会。C 轮每股价格是 2024 年 6
              月 A 轮 $4.43（投后估值 $148.15 million）的八倍，也是 2022 年 12 月 Seed 轮 $1.68（投后估值 $40 million）的二十二倍。Forge Global
              资本结构记录证实，所有优先股均采用标准的 1.0x 不参与分配清算优先权，且无累积股息负担，保留了干净的普通股上行空间。尽管如此，估值的快速拉升构筑了极具优先顺位的清算优先权（累计优先股堆叠达 $272
              million），早期投资者在测算下行情景风险分配时必须充分评估这一因素。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
