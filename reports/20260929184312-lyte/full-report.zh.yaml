      - number: '2.4'
        title: 增长驱动力、结构性落地瓶颈与尽调重点
        blocks:
          - type: paragraph
            body: >-
              推动集成式感知方案需求的核心驱动因素，在于工业自动化领域日益扩大的技术能力断层。麦肯锡（McKinsey & Co.）研究表明，超过 60%
              的工业企业欠缺自主落地机器人自动化的工程能力，其中多传感器集成与系统标定被列为主要痛点。尽管分立采购现成传感器在账面 BOM
              上看似更便宜，但自研融合算法的隐形成本、延迟损耗以及现场可靠性隐患，为预集成软硬件方案提供了充分的商业合理性。然而，落地渗透速度受制于 OEM
              漫长的导入验证周期（Design-in）与严苛的工业安全认证。机器人厂商在将感知架构从原型机切入批量投产前，往往需要经历多个季度的台架测试与现场实测。从投资与尽调视角审视，尚未厘清的核心指标包括单机平均售价（ASP）、客户从试点测试向量产转化的速度，以及自研芯片相比外购光学器件的实际毛利率。鉴于客户合同与出货量均属非公开信息，后续需重点跟踪
              OEM 选型定点（Design wins）及量产客户群的留存与扩单表现。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 支撑证据与分析要点
        blocks:
          - type: callout
            title: 感知层全栈垂直整合破解机器人系统集成痛点
            body: >-
              在物理 AI 与机器人领域，常规集成方案需要从不同元器件供应商分散采购激光雷达、毫米波雷达、摄像头及 IMU，从而导致数月耗费在标定漂移消除、延迟调优与传感器融合调试上。Lyte
              协同设计自研芯片、传感器与空间计算软件，在获取更高模组附加值的同时，化解阻碍工业企业规模化推进自动化的技术瓶颈。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: callout
            title: 漫长的导入验证周期与企业级测试阻力
            body: >-
              尽管自上而下的市场前景向好（AI 机器人产业到 2030 年预计达 1250 亿美元），但机器设备制造方与工业客户在敲定批量采购前，需经历长达数季度的安全准入、仿真测试与实地运行考核。一旦 OEM
              客户的机型研发在工程或认证环节受阻，感知硬件供应商的收入爬坡便会面临实质性延滞。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构路线分野
        blocks:
          - type: paragraph
            body: >-
              物理 AI
              感知领域的竞争格局呈现出分立元器件拼装与垂直整合空间智能两种技术路线的根本分化。目前多数商用机器人开发商沿用采购分立传感器的传统模式，即从不同第三方硬件厂商分别采购光学摄像头、激光雷达单元与独立惯性测量单元。多供应商采购迫使工程团队搭建复杂的传感器融合软件层，协调异步时钟域，并在实际运维中反复应对标定漂移。Lyte
              依托 LyteVision 平台直接向该模式发起挑战，借助自研边缘芯片将 4D 相干视觉、RGB 成像与惯性传感集成于单一模组内。除多元器件拼装路线外，竞争环境还包括选择内部自研定制硬件的大型机器人
              OEM，以及为超大规模数据中心和工业场景制造高精度光子学子系统的传统光学元器件巨头。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
