              - CM007
      - number: '2.2'
        title: 潜在市场空间测算、测算视角与资本规模
        blocks:
          - type: paragraph
            body: >-
              测算物理 AI 感知硬件的市场空间需结合自上而下的行业增长预期与自下而上的硬件 BOM 拆解。从宏观维度看，Grand View Research
              预测，随着自主移动机器人、自动化巡检平台及下一代协作系统的规模化落地，全球人工智能机器人市场规模将在 2030 年扩张至 $125B。面对真实物理环境中的动态变化，物理 AI
              系统必须依靠实时边缘计算以防范感知决策失效。若假设外购商用感知芯片与集成式传感器模组约占自主机器整体硬件支出的 8% 至 12%，则专用感知硬件的可服务市场空间（SAM）预计在 2030 年达到 $8B 至
              $15B。2026 年 1 月公开亮相并公布 $107M 融资后，Lyte 于 2026 年 9 月完成由 Maverick Silicon 领投的 $165M Series C 轮融资，投后估值达
              $1.6B，累计融资总额达 $272M。尽管公司已面向巡检、仓储物流及制造业的头部客户启动商用量产交付，但具体的单客户合同金额与自下而上的 SOM 数据仍属未公开的私有指标。
            claimRefs:
