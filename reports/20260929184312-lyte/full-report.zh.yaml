              - CV013
      - number: '8.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: $1.6B 投后估值的入场纪律
            body: >-
              凭借自研芯片感知架构以及出色的 Apple 与 PrimeSense 团队背景，Lyte 值得给予买入评级。但在缺乏经审计商业收入的情况下，其投后估值不到一年便升至原来的 3.5 倍、达到 $1.6
              billion，投资者应严格控制持仓规模，避免在老股市场支付溢价。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV012
          - type: callout
            title: 老股市场流动性不足与工业落地阻力
            body: >-
              来自 Forge Global 的一级市场数据显示，老股交易流动性微乎其微，同时 McKinsey 的估算显示超过 60%
              的目标工业客户缺乏内部系统集成能力。这两重制约因素在资金收紧的环境下可能拉长销售周期，并压低估值下限。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
