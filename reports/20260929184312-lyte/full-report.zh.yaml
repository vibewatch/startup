          - type: paragraph
            body: >-
              Lyte 的长远商业模式依赖围绕自研芯片与软硬件强绑定打造的增购扩张（land-and-expand）机制。一旦机器人 OEM 在机械底盘、结构固定件、电气线束以及导航计算技术栈中选用了
              LyteVision，客户的切换成本将变得极其高昂。若要改用竞品传感器重新设计机器人，意味着必须对整机结构进行彻底改造、重新校准标定，并重训 Physical AI
              具身基础模型。因此，早期的评估验证与试点定点（design
              wins）能够带来很高的客户粘性，随着客户扩大机器人机队规模，收入也会自然放量。但这种模式伴随着严重的客户集中度风险：硬件起步阶段的商业收入往往高度依赖少数出货量大的机器人大厂。一旦核心 OEM
              客户的商业化爬坡遇阻，或因外部采购优先级调整而推迟排产，都将对 Lyte 的出货台数与季度现金流造成不成比例的冲击，突显出拓展多元化 OEM 定点合作储备的紧迫性。
            claimRefs:
