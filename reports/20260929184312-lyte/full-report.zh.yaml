  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 论点要素
      - 核心论据
      - 证据与驱动因素
      - 证伪条件
    rows:
      - - 全栈芯片级感知
        - 基于自研芯片的统一 4D 感知，消除了多传感器拼装方案的延迟与标定漂移。
        - 获 CES 2026 创新奖；团队具备 PrimeSense / Apple Face ID 的架构传承。
        - 竞争对手利用通用传感器加开源软件，实现了相当的边缘同步表现。
      - - 一线投资财团
        - Maverick Silicon、Fidelity、Atreides 和 Avigdor Willenz 的支持带来充足资金，也带来深厚的芯片行业治理经验。
        - 累计融资 $272M，且 Maverick Silicon 高管进驻董事会。
        - 董事会治理发生冲突，或投资财团对重资产硬件扩产失去出资意愿。
      - - 客户集成摩擦
        - 工业自动化客户引入复杂感知架构时，面临很高的工程门槛和组织惯性。
        - 麦肯锡调研指出，超过 60% 的工业企业缺乏内部机器人集成能力。
        - 开箱即用的参考设计与标准 ROS / 中间件驱动加速了客户落地。
      - - 估值倍数收缩
        - $1.6B 的高估值容错空间极小，难以承受运营执行失误或宏观下行冲击。
        - 不到一年内估值陡增 3.5 倍，且老股交易缺乏流动性。
        - 订单积压加速增长，且高毛利经常性软件增购收入足以支撑溢价定价。
    notes: 投资与反向逻辑要点综合自技术披露、财团背景及工业落地基准。
