      - number: '7.3'
        title: 交易对手依赖、客户集中度与 OEM 平台锁定
        blocks:
          - type: paragraph
            body: >-
              Lyte 的商业化战略深度绑定机器人原始设备制造商（OEM）、自动驾驶开发者以及工业系统集成商。这种业务结构带来了尖锐的客户集中度风险：在量产爬坡起步期，少数核心机器人 OEM
              贡献了绝大部分模块出货量与近期收入。一旦核心 OEM 遭遇商业化阻碍、重新设计机器人底盘，或者受宏观工业景气度下行影响推迟放量，Lyte 的收入增速与单机经济模型将遭受即刻冲击。同时，Lyte
              对平台生态系统存在关键依赖。虽然公司自行提供边缘算力与空间软件算法，但机器人制造商仍须将 LyteVision
              接入外部机器人操作系统、导航软件栈以及云端车队管理系统。第三方软件更新不兼容、客户计算硬件引入的延迟开销，抑或合作伙伴对采用专有传感器接口心存顾虑，都可能拉长系统集成周期，放缓企业落地步伐。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
