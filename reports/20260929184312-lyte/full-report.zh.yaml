      - number: '5.2'
        title: 自研芯片差异化壁垒、嵌入式固件与集成工作流
        blocks:
          - type: paragraph
            body: >-
              区分 Lyte 与传统机器视觉及光学测距厂商的核心技术护城河，在于其自研定制芯片。Lyte 没有选用市面现成的图像信号处理器（ISP）或通用微控制器，而是自主设计嵌入式 SoC，集成 Arm
              嵌入式核心、相干片上网络（NoC）互联总线结构以及专用硬件加速逻辑，专门承载低延迟的边缘计算机视觉与机器学习任务。固件和系统软件基于嵌入式 Linux 与实时操作系统（RTOS），使用 C++ 和 Python
              编写，直接对接底板点亮调试、自研驱动程序以及硬件在环（HIL）自动化验证框架。为了接入下游机器人计算单元，Lyte 与 NVIDIA 展开合作，借助 Holoscan Sensor Bridge
              将高吞吐感知遥测数据直传至 GPU，支持零拷贝数据传输、Jetson Thor、CUDA 加速和 NITROS 流水线，同时将实时空间数据同步投射至 NVIDIA Omniverse 与 Isaac Sim
              中构建实时数字孪生。然而，尽管其嵌入式工程平台支持量化边缘神经网络部署，但具体的芯片制程节点、代工厂家以及原始传感器时钟主频等，依然是未公开的内部工程机密。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
