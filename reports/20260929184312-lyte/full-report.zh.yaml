            body: >-
              选用 LyteVision 会给机器人设备厂商带来高昂的经济与运营转换成本。一旦自主移动机器人或工业巡检 OEM 将该一体化模组设计进车体底盘，其机械结构支架、线束布局以及软件导航栈便会与 Lyte
              的专有架构深度绑定。这种机制在客户采纳后能筑牢留存率与替换壁垒，却也会在初期销售周期中带来阻力，因设备制造商普遍对单一专有硬件供应商产生技术依赖顾虑重重。此外，Lyte
              对单机模组价格、阶梯出货折扣及软件订阅费用严格保密，为评估单体经济模型留下了证据缺口。从光学元器件可比上市公司的表现来看，硬件供应商普遍承受与宏观资本开支周期紧密挂钩的客户集中度波动风险。Lyte
              若要维持长远商业护城河，必须在面对标准化替代品时证明其全生命周期总拥有成本（TCO）的领先性，并稳步锁定 OEM 客户长达数年的批量供货定点。
