      - number: '2.4'
        title: 增长驱动力、落地结构性阻碍与尽调核心关注点
        blocks:
          - type: paragraph
            body: >-
              驱动集成感知需求的核心催化剂，是工业自动化领域日益扩大的技术能力断层。McKinsey & Co. 研究显示，超过 60%
              的工业企业缺乏落地机器人自动化所需的内部技术积累，其中多传感器集成与标定被列为主要卡点。虽然分立式货架传感器在单纯的 BOM
              成本上看似更便宜，但自研融合软件的隐性开销、延迟损耗以及现场可靠性故障，为一体化预集成方案提供了充足的经济理由。但方案导入速度受制于 OEM 漫长的导入周期（design-in
              cycles）与严苛的工业安全认证。在将感知架构从原型机切入批量生产之前，机器人 OEM
              往往需要经历数个季度的台架测试与实地验证。投资机构与尽调团队尚未厘清的核心问题包括测算单台平均售价（ASP）、客户从试点到量产的转化周期，以及自研芯片相比第三方光学组件的毛利率水平。鉴于客户合同与出货台数仍属未公开的私有指标，后续尽调必须重点追踪
              OEM 定点合作与量产客户群体的扩张动向。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 感知栈垂直一体化打破机器人集成瓶颈
            body: >-
              在 Physical AI 与机器人领域，常规集成需要从不同零部件供应商分别采购激光雷达、毫米波雷达、摄像头和 IMU，伴随而来的是数月之久的标定漂移、通信延迟以及传感器融合调试。Lyte
              协同自研专用芯片、传感器和空间软件，在吃下更高模块价值的同时，化解了阻碍工业企业规模化部署自动化的核心技术瓶颈。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: callout
            title: 漫长的方案导入周期与企业级验证摩擦
            body: >-
              尽管自上而下的市场红利清晰（2030 年 AI 机器人市场达 $125B），但机器人 OEM 和工业买家在锁定批量采购前，必须完成严苛且长达数个季度的安全准入、仿真测试与实地运行。一旦 OEM
              客户的平台开发在工程或认证环节受阻，感知硬件供应商将面临收入放量严重推迟的风险。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构流派
        blocks:
          - type: paragraph
            body: >-
              Physical AI
              感知领域的竞争格局呈现出一条底层的架构分水岭：碎片化的零部件拼凑还是垂直一体化的空间智能。当今多数商用机器人开发商仍沿用拼装分立传感器的老路——从不同硬件厂商分别采购光学摄像头、激光雷达单元与独立的惯性测量单元。这种多供应商模式迫使机器人工程团队必须自建复杂的传感器融合软件层、处理异步时钟域，并在实地使用中反复排查标定漂移。Lyte
              凭借 LyteVision 平台直接向这一范式发起挑战，该平台依托自研边缘芯片，将 4D 相干视觉、RGB
              成像与惯性感知封装进高度集成的统一传感模块。除了多供应商拼装模式外，竞争版图还包括尝试自研专用硬件的量产级机器人 OEM，以及为超大规模计算和工业市场制造高精度光子子系统的传统光学巨头。
