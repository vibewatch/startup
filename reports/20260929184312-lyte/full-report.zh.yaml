  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、空间平台架构与边缘传感技术栈
        blocks:
          - type: paragraph
            body: >-
              Lyte 研发了一套专为复杂、动态物理环境下运行的机器人与 Physical AI 量身定制的端到端感知系统。核心商用产品是
              LyteVision，作为垂直一体化的感知平台与传感模块，它在物理边缘端靠单一物理接口原生融合了 4D 视觉（距离与瞬时速度）、RGB 光学成像以及惯性测量单元（IMU）数据。更为广义的架构顶层框架
              LyteGalaxy，则统筹调度多模态传感器、嵌入式计算与自研算法，输出统一的空间参考坐标系。传统机器人研发流程中，机器人 OEM 必须向不同供应商分散采购激光雷达、摄像头和
              IMU，手工标定外参、编写复杂的融合算法，并反复调试时钟不同步导致的失效。Lyte
              从芯片底层入手，自行设计传感芯片与系统级芯片（SoC）架构，省去异步轮询和传感器对齐流程，让自主机器直接感知位置与运动，不必再靠高算力做后期重建。
            claimRefs:
              - CE001
