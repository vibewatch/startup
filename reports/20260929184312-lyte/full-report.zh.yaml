    rows:
      - - 传感器套件装配与机械结构搭建
        - 从多家供应商分别采购独立的 LiDAR、双目立体相机与 IMU
        - 单台一体化传感单元，集成 4D 视觉、RGB 与 IMU 传感器
        - 无需设计多传感器支架，也省去分散布线
        - 固定的一体化外形限制单个传感器的定制化布局
      - - 传感器空间与时间标定
        - 需耗费数月标定外参矩阵并处理长期标定漂移
        - 出厂预标定的硬件架构，具备统一的空间参考坐标系
        - 免去客户手动标定周期，彻底消除外参漂移
        - 遭遇机械撞击或外力损伤后的重新标定规程未公开
      - - 边缘传感器融合与算力负载
        - 主机 CPU/GPU 执行异步软件融合，存在毫秒级延迟
        - 在统一时间线上由定制 SoC 完成原生硬件融合
        - 实现亚毫秒级空间延迟，同时降低主机算力开销
        - 主机计算平台须支持 Holoscan 等高速数据流互连方案
      - - 现实环境动态物体追踪
        - 依靠连续帧差分推算物体运动轨迹与多普勒速度
        - 在 4D 坐标空间内直接原生测量距离与速度
        - 实时捕获瞬时速度矢量，满足安全关键型避障需求
        - 在浓雾、粉尘等极端遮挡环境下的性能边界尚未验证
    notes: 传统失效模式记录于行业机器人研究报告（McKinsey/The Robot Report）；Lyte 性能声明反映公司公布的架构技术指标。
