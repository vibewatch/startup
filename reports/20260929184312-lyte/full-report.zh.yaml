  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 从团队背景履历、技术验证，经估值约束最终推导至投资建议的决策链条。
    data:
      nodes:
        - id: pedigree
          label: 创始人履历背景
          detail: 汇聚 Apple Face ID 与 PrimeSense 资深工程骨干
        - id: tech-proof
          label: 感知能力验证
          detail: 自研 4D 芯片荣获 CES 最佳创新奖
        - id: commercial
          label: 量产规模化扩张
          detail: 产品已向工业质检、物流仓储和先进制造场景规模出货
        - id: valuation-check
          label: 估值水平评估
          detail: 估值达到 $1.6B，以每股 $36.84 计在 8 个月内跃升至三倍
        - id: risk-adjustment
          label: 商业落地与流动性风险
          detail: 工业端推广阻力与二级市场老股交易流动性匮乏
        - id: recommendation
          label: 最终投资建议
          detail: 审慎买入，严格控制初始建仓仓位
      edges:
        - from: pedigree
          to: tech-proof
        - from: tech-proof
          to: commercial
        - from: commercial
          to: valuation-check
        - from: valuation-check
          to: risk-adjustment
        - from: risk-adjustment
          to: recommendation
    approximationNotes: 该流程展示了将各层公开证据综合凝练为最终投资立场的定性决策逻辑。
