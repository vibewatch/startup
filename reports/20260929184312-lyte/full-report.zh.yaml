  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规监管、功能安全认证与出口管制风险敞口
        blocks:
          - type: paragraph
            body: >-
              Lyte 处于自研半导体芯片设计、光学传感与自主机器人的交叉前沿，必须应对严苛的国际监管审查与功能安全合规框架。由于 LyteVision
              的定位是主导安全关键型工业场景下的机器感知——包括人机协作机器人工作站、与工人共享仓储通道的自主移动机器人（AMR），以及在高危工况下作业的自动化巡检四足机器人——该平台必须符合 ISO 13849、IEC
              61508 和 ANSI/RIA R15.08
              等严格的机械安全标准。在粉尘弥漫、光线复杂的工业现场，任何光学标定失效、时间戳漂移或未被侦测到的传感器致盲，都可能引发设备碰撞、人身伤害以及灾难性的停产事故。此类事故将招致严厉的产品责任索赔、强制硬件召回并导致商业部署即刻叫停。此外，由于
              Lyte 自行设计专用传感集成电路（ASIC）与相干 4D 感知算法，其技术也受美国商务部工业与安全局（BIS）不断变化的军民两用出口管制法规和半导体限制约束。一旦监管部门认定 Lyte 的先进 4D
              感知芯片归属于高性能计算或自主国防受控范畴，就可能限制其向海外客户出货，进而遏制其全球供应链拓展。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
