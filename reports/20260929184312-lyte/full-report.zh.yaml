      - number: '2.3'
        title: 目标买家客群、买单方与采购路径
        blocks:
          - type: paragraph
            body: >-
              Physical AI
              感知基础设施的采购方集中在四类核心细分领域的原始设备制造商（OEM）与企业自动化运营商：自主移动机器人（AMR）、工业巡检系统、先进制造工作站以及下一代人形或四足机器人。目标买家画像通常是统揽整机架构与传感器选型的硬件工程副总裁或首席技术官（CTO）。核心最终用户则是机器人软件工程师与现场部署工程师，他们需要精准标定、低延迟的空间数据输入来执行导航、避障与机械臂操作任务。预算所有权在新机型平台研发阶段归属于企业研发（R&D）与产品工程资本开支，在方案定型量产后则转入日常运营采购。各客群的核心采购驱动力在于根除多传感器标定漂移，并将系统集成周期从数个季度压缩至数周。自
              2026 年 1 月结束隐身状态以来，Lyte 已将这一价值主张转化为物流园区、工业巡检现场和制造产线上的实质量产部署。
            claimRefs:
              - CM001
