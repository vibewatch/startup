    approximationNotes: 顶层宏观预测引自 Grand View Research（2030年达1250亿美元）；底层分层反映零部件成本占比估算（占机器人BOM物料成本的8-12%）及已披露的客户部署规模。
    claimRefs:
      - CM004
      - CM005
      - CM008
      - CM010
      - CM013
      - CM014
    data:
      items:
        - label: 全球AI机器人市场规模（2030年）
          detail: 涵盖系统、软件与服务的1250亿美元宏观市场机遇（Grand View Research）。
