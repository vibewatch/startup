      - number: '8.2'
        title: 融资历史、股权结构表动态与资本效率
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，Lyte 展现出极快的融资节奏，历经四轮股权融资累计筹资 $272M。公司此前长期处于隐身状态，直至 2026 年 1 月正式公开亮相，当时累计融资额达到 $107M，最终以
              $458.94M 估值（每股 $12.69）完成 $60M Series B 轮融资。仅 8 个月后，于 2026 年 9 月 2 日，Lyte 完成由 Maverick Silicon 领投的 $165M
              Series C 轮融资，每股价格 $36.84，投后估值确立为 $1.6B，Maverick Silicon 管理合伙人 Andrew Homan 随之加入董事会。Series C 轮每股价格达到 2024 年
              6 月 Series A 轮 $4.43（投后估值 $148.15M）的八倍，达到 2022 年 12 月 Series Seed 轮 $1.68（投后估值 $40M）的二十二倍。Forge Global
              的资本结构记录证实，所有优先股轮次均附带标准的 1.0x 非参与型清算优先权，不含累积股息负担，从而保留了干净的普通股上行空间。尽管如此，估值快速拉升带来了显著的清算优先权偿付顺位（累计 $272M
              优先股堆叠），早期投资者在测算下行风险分布时必须审慎评估。
            claimRefs:
              - CV001
              - CV002
