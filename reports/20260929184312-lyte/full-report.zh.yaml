      - number: '8.3'
        title: 估值基准、老股信号与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              评估 Lyte 的估值，需要兼顾高估值倍数的物理 AI 基础平台与硬件集成机器人供应商。Forge Global 汇总的一级市场基准显示出明显的估值分化：Figure AI（$42.5B Series C）和
              Skild AI（$14B Series C）等 AI 基础模型开发商享有巨大的投机溢价；而 Agility Robotics（$2.12B Series C-3）及 Dexterity（$1.66B
              Series C-1）等商用机器人与物料搬运自动化同行，交易估值则与 Lyte 的 $1.6B 估值规模紧密契合。关键在于，Forge Global 上的老股交易指标揭示出一级市场流动性严重不足：活跃买单总额仅为
              $100,000，相对之下卖方挂单达 $2.00M，既无公开发布的 Forge
              Price，近期也无撮合成交记录。如此悬殊的买卖价差反映出一级市场老股流动性依然受限，当前老股定价无法支撑估值较新股发行价进一步扩张。在缺少经审计 ARR 或毛利率披露的情况下，Lyte
              定价高度依赖远期商业化里程碑而非历史财务倍数，投资者更应严守估值纪律。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV014
      - number: '8.4'
        title: 情景回报建模、下行触发因素与尽调需求
        blocks:
          - type: paragraph
            body: >-
              我们的回报测算框架立足截至 2029 年的三年投资周期，从乐观、基准、悲观和清算四种情景审视 Lyte。在基准情景（50% 概率）下，Lyte 将 LyteVision
              推广至仓储自动化、移动巡检和工业制造领域，取得 $120M 收入，以 15x 估值倍数支撑 $1.8B 估值（1.1x MOIC）。在乐观情景（25% 概率）下，Lyte 确立为物理 AI
              领域公认的标准感知架构，高毛利 ARR 规模扩大至 $250M，按 20x 估值倍数测算可达 $5.0B 估值（3.1x MOIC，年化回报率 ~33%）。相对地，悲观情景（20%
              概率）模拟了客户集成摩擦与采纳延迟——这与 McKinsey 的调研数据相吻合，即超过 60% 的工业企业缺乏机器人系统集成能力——导致收入停滞在 $40M，估值回落至 $700M（-56%
              下行空间）。清算或知识产权出售情景（5% 概率）预计产生约 $150M 至 $200M 回报。最终投资决策应严格取决于二期尽调结果，重点验证合同在手储备转化率、单芯片 BOM
              毛利率以及客户试点向正式量产的推进速度。
