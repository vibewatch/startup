  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态、空间平台架构与边缘传感技术栈
        blocks:
          - type: paragraph
            body: >-
              Lyte 专为复杂动态物理环境中的机器人与物理 AI（Physical AI）研发端到端感知系统。其核心商用产品 LyteVision
              是一套垂直集成的感知平台与传感硬件单元，在物理边缘端借助单根连接接口原生融合了 4D 视觉（测距加即时速度向量）、RGB 光学成像及惯性测量单元（IMU）状态感知。更高层级的架构母体 LyteGalaxy
              则在多模态传感器、嵌入式计算核心与专有算法之间协同空间智能，输出统合的时空基准系。传统机器人研发流程要求整机 OEM 向多家供应商分散外购激光雷达、摄像头和
              IMU，手动标定外参，编写复杂的后处理融合软件，并反复排查异步时序同步故障。Lyte 从晶体管级切入化解这一结构性瓶颈，依托自研传感芯片与 SoC
              系统架构消除了异步轮询与传感器校准链路，让自主机器能够直接原生感知物理空间的位置与运动状态，无需依赖高算力开销的后处理重建。
            claimRefs:
