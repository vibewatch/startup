  - number: 7
    title: 风险考量
    sections:
      - number: '7.1'
        title: 监管合规、功能安全认证与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Lyte 处于定制半导体设计、光学传感与自主机器人的交汇赛道，直面严格的国际监管与功能安全合规框架约束。鉴于 LyteVision
              专为安全攸关的工业场景提供感知支撑——包括人机共存的人机协作工作站、穿梭于工人货架通道的自主移动机器人（AMR），以及在高危工况下作业的四足巡检机器人——该平台必须满足诸如 ISO 13849、IEC 61508
              及 ANSI/RIA R15.08
              等一系列严苛的机械安全指令。在多粉尘、强光骤变等复杂工业环境中，任何光学标定失效、时间戳漂移或未被检出的传感器瞬时盲区，都可能引发设备碰撞、人身伤害及灾难性停产事故。此类事故将诱发巨额产品责任索赔、强制硬件召回以及商业部署的紧急叫停。此外，Lyte
              自主设计专有传感 ASIC 与相干 4D 感知算法，其技术面临美国商务部工业与安全局（BIS）动态调整的军民两用出口管制法规及半导体限制约束。一旦监管机构将 Lyte 的先进 4D
              感知芯片归入高性能计算或自主防务管制清单，其面向海外客户的出货与全球供应链扩展都将遭受严厉制约。
