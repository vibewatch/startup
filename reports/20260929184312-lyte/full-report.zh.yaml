      - - 乐观情景
        - LyteVision 确立为自主物流与巡检机器人的行业通用标准；到 2029 年达成 $250M ARR；毛利率维持在 70%。
        - 给予20倍 ARR 倍数，对应50.0亿美元估值（3.1倍 MOIC；约33% IRR）。
        - 仓储自动化渗透进度不及预期；晶圆芯片供应中断。
        - 25%（底层具身智能刚性需求驱动下的高成长空间）。
      - - 中性基准情景
        - 工业领域稳步渗透；到2029年实现1.2亿美元营收；硬件与捆绑软件综合毛利率达55%。
        - 给予15倍市销率（P/S），对应18.0亿美元估值（1.1倍 MOIC；约3% IRR）。
        - 客户概念验证（POC）周期拖长；遭遇分立式传感器厂商价格战。
        - 50%（反映早期量产导入进展扎实稳健）。
      - - 悲观情景
        - 客户系统集成难度过大；深度传感器陷入同质化价格内卷；到2029年营收停滞在4000万美元瓶颈。
        - 给予10倍市销率，对应4.0亿美元估值（较 Series C 入场估值账面浮亏-75%）。
        - 客户流失转向廉价替代品；资金消耗速率显著超前于营收增长。
        - 20%（若工业规模化渗透遇阻，将面临显著下行风险）。
      - - 破产清算 / 资产拆售
        - 商业化拓展全面失利；公司因知识产权与专利组合被低价并购。
        - 资产打包出售或人才收购（acqui-hire），估值约 $150M–$200M（Series C 清算优先权发生部分减值损失）。
        - 商业化放量完全受挫；核心管理层相继离职。
        - 5%（鉴于创始团队背景实力雄厚且账面资金充裕，该概率较低）。
    notes: 情景测算假设持有期为 3 年直至 2029 年，并以 $1.6B 的 Series C 投后估值为基准测算退出回报。
