      - number: '8.3'
        title: 估值对标、老股交易信号与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              评估 Lyte 的估值，需要同时审视高估值倍数的物理 AI 基础平台与软硬一体机器人供应商。Forge Global 整理的一级市场对标数据显示出显著的估值分化：Figure AI（C 轮估值 $42.5
              billion）和 Skild AI（C 轮估值 $14 billion）等 AI 基础模型开发商享有极高的投机溢价；而商用机器人及自动化物料搬运同业如 Agility Robotics（C-3 轮估值
              $2.12 billion）与 Dexterity（C-1 轮估值 $1.66 billion），估值水平则与 Lyte 的 $1.6 billion 市值高度接近。至关重要的是，Forge Global
              上的老股交易指标凸显出一级市场流动性的严重匮乏：有效买单总额仅为 $100,000，而卖单挂牌总额达 $2.00 million，既未形成官方 Forge
              Price，近期也无撮合成交。如此悬殊的买卖价差表明老股流动性持续承压，当前的二级市场挂牌价无法为突破一级轮次定价提供任何佐证。在缺乏经审计的 ARR 或毛利率披露的情况下，Lyte
              的定价高度依赖远期商业化里程碑，而非静态财务倍数，这进一步凸显了严守估值纪律的必要性。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV014
      - number: '8.4'
        title: 情景回报测算、下行触发因素与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              我们的回报测算模型针对 Lyte 设定了截至 2029 年的三年期跨度，覆盖乐观、基准、悲观和清算四种情景。在基准情景（概率 50%）下，Lyte 凭借 LyteVision
              在仓储自动化、移动巡检和工业制造领域的扩张，实现 $120 million 营收，按 15x 估值倍数支撑起 $1.8 billion 估值（MOIC 为 1.1x）。在乐观情景（概率 25%）下，Lyte
              成为物理 AI 领域公认的标准感知架构，高毛利 ARR 规模达到 $250 million，按 20x 估值倍数实现 $5.0 billion 估值（MOIC 为 3.1x，年化回报率约
              33%）。相反，在悲观情景（概率 20%）下，受客户集成阻力与落地推迟影响——这与 McKinsey 指出超过 60% 工业企业缺乏机器人集成能力的数据一致——营收停滞在 $40 million，估值收缩至
              $700 million（下行幅度 -56%）。清算或知识产权出售情景（概率 5%）预计回收约 $150 million 至 $200
              million。最终投资决策应取决于二期尽调结果，重点验证在手合同转化率、单颗芯片 BOM 毛利率以及客户从试点走向规模化量产的速度。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
