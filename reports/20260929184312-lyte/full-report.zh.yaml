      - number: '3.3'
        title: 能力矩阵与技术护城河壁垒
        blocks:
          - type: paragraph
            body: >-
              Lyte 的核心技术壁垒在于自研传感芯片、多模态硬件与底层空间软件的垂直一体化。常规机器人配置均采用异步感知流程，将不同传感器的输出汇入中央计算主板，再靠软件算法修正空间偏差。相比之下，LyteVision
              直接用硬件原生测量运动与深度，将 4D 视觉与惯性读数对齐到同一条同步时间线上。这种边缘原生融合大幅缩短决策延迟，也消除了多供应商机器人方案常见的集成故障。不过，这项技术优势能否持久，取决于 Lyte
              能否持续领先于快速进步的通用视觉模型和标准硬件方案。若开源感知算法配合标准化算力平台，无需定制芯片也能达到相近的空间精度，低成本模块化方案就可能让 Lyte 的自研硬件护城河迅速商品化。
