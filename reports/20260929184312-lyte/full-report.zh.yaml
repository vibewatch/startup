  - id: FE001
    title: LyteVision 全栈运行架构
    type: stack
    summary: 垂直整合的感知架构，展示从物理传感、自研芯片、嵌入式固件到中间件集成的逐层跃升。
    data:
      layers:
        - label: 应用与下游计算
          detail: 对接机器人控制系统、自主导航算法栈与数字孪生仿真器的集成层。
        - label: 传输与加速中间件
          detail: 依托 NVIDIA Holoscan Sensor Bridge、NITROS 协议及 CUDA 加速的零拷贝流传输层。
        - label: 嵌入式固件与实时操作系统
          detail: 运行在嵌入式 Linux 与 RTOS 之上的确定性运行时，支持快速原型构建与硬件在环（HIL）测试。
        - label: 自研芯片与 SoC 片上互连
          detail: 集成自研专用逻辑、Arm 嵌入式核心与一致性片上网络（NoC）的专用处理层。
        - label: 边缘传感与光学传感器
          detail: 采集高一致性 4D 空间视觉、高分辨率 RGB 图像以及惯性运动遥测的物理层。
        - label: 晶圆代工与底层物理芯片
          detail: 通过商用晶圆厂流片制造的底层半导体衬底与封装基底。
    approximationNotes: 架构分层依据公开专利、工程披露、APIs.io 供应商审查及招聘岗位描述整理；内部组件总线拓扑仍属商业机密。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 机器人 OEM 引入 Lyte 集成感知平台的客户旅程与扩张生命周期，涵盖从初期评估到车队规模化部署的全过程。
    data:
      items:
        - label: 阶段一：架构评估与开发者套件
          touchpoints:
            - 对比现成组装传感器方案与统一 4D 感知的基准性能
            - 采购 LyteVision 评估版开发者套件
            - 验证单接口边缘计算与 IMU 硬件级同步表现
        - label: 阶段二：原型机集成与仿真
          touchpoints:
            - 将定制传感器模块嵌入实体机器人底盘
            - 将 LyteVision API 接入机器人操作系统（ROS）导航算法栈
            - 在多变光照与动态障碍物环境下测试感知精度
        - label: 阶段三：量产设计定型（Design Win）
          touchpoints:
            - 将自研 ASIC 与光学模组锁定进 OEM 的物料清单（BOM）
            - 签署批量硬件批次交付合同并约定供货周期
            - 确立质保、固件空中升级（OTA）及安全合规协议
        - label: 阶段四：车队商业化扩张与首批交付
          touchpoints:
            - 在客户仓储与工厂现场部署商业化机器人车队
            - 交付首批边缘传感芯片模组
            - 监控现场运行指标与实时避障遥测数据
        - label: 阶段五：车队智能升级与感知模型拓展
          touchpoints:
            - 订阅 LyteVision 空间智能更新与高阶感知模型
            - 将持续更新的具身智能能力部署到已运行的机器人节点
            - 将 Lyte 平台应用延伸至全新机器人形态与产品线
        - label: 阶段 6：多代平台迭代与 Tier-1 标准化
          touchpoints:
            - 推动下一代机器人平台统一采用升级版 LyteCore 芯片
            - 签署多年期批量供货协议并开展战略联合开发
            - 在全球客户机队中建立企业级硬件锁定效应
    approximationNotes: 本示意性运营框架用于模拟标准 OEM 机器人设计周期；具体商业合同阶段受客户保密协议约束。
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按严重程度分级的多维风险矩阵，在监管、运营、合作伙伴及财务领域对发生概率与影响程度进行映射。
    data:
      columns:
        - 低影响
        - 中度影响
        - 较大影响
        - 高影响
        - 严重影响
        - 极重影响
      rows:
        - label: 高发生概率
          values:
            - label: 低敞口
              detail: 标准软件驱动更新
            - label: 中度敞口
              detail: 环境传感器脏污（粉尘、眩光）
            - label: 偏高敞口
              detail: 初期硬件毛利率承压
            - label: 高敞口
              detail: 核心客户量产爬坡延误
            - label: 严重敞口
              detail: 晶圆代工产能配额受限
            - label: 极重敞口
              detail: 双源供应商认证延误
        - label: 中发生概率
          values:
            - label: 低敞口
              detail: 常规零部件交期波动
            - label: 中度敞口
              detail: 竞争对手在 3D 感知领域的专利主张
            - label: 偏高敞口
              detail: 晶圆代工配额缺口
            - label: 高敞口
              detail: 协作机器人功能安全失效
            - label: 严重敞口
              detail: 光学封装良率下滑
            - label: 极重敞口
              detail: 直接产品责任索赔
        - label: 低发生概率
          values:
            - label: 可忽略敞口
              detail: 轻微日常行政延误
            - label: 低敞口
              detail: 通用行业协会合规事务
            - label: 中度敞口
              detail: 边缘传感器固件遭网络篡改
            - label: 高敞口
              detail: 亚微米级光学对准缺陷
            - label: 严重敞口
              detail: 核心客户 OEM 项目取消
            - label: 极重敞口
              detail: 军民两用半导体出口禁运
    approximationNotes: 各项评估反映了 Lyte 在核心运营与商业维度上，经缓释后的综合残余风险水平。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR010
      - CR014
  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 从团队履历和技术验证出发，结合量产进展与估值纪律，推导投资建议。
    data:
      nodes:
        - id: pedigree
          label: 创始团队背景
          detail: Apple Face ID 与 PrimeSense 资深工程老兵
        - id: tech-proof
          label: 感知能力验证
          detail: 自研 4D 芯片，荣获 CES 最佳创新奖
        - id: commercial
          label: 规模化量产
          detail: 面向巡检、物流及制造客户批量出货
        - id: valuation-check
          label: 估值评估
          detail: 估值 8 个月内涨至原来的 3 倍，达 $1.6B；每股 $36.84
        - id: risk-adjustment
          label: 落地采用与流动性风险
          detail: 工业场景落地阻力与老股交易缺乏流动性
        - id: recommendation
          label: 投资建议
          detail: 审慎买入，严格控制初始仓位
      edges:
        - from: pedigree
          to: tech-proof
        - from: tech-proof
          to: commercial
        - from: commercial
          to: valuation-check
        - from: valuation-check
          to: risk-adjustment
        - from: risk-adjustment
          to: recommendation
    approximationNotes: 流程图呈现定性决策链：综合各层证据，形成最终投资判断。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
