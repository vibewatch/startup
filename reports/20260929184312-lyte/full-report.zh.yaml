      - number: '2.3'
        title: 目标客群细分、预算决策方与采购链条
        blocks:
          - type: paragraph
            body: >-
              物理 AI
              感知基础设施的采购高度集中在整机制造厂商（OEM）及企业自动化运营商中，主要覆盖四大细分场景：自主移动机器人（AMR）、工业巡检系统、先进制造工作站，以及下一代人形或四足机器人。目标买方决策者通常是负责整机电气架构与传感器选型的硬件工程副总裁或
              CTO。核心最终使用者则是机器人软件开发者与现场部署工程师，他们依赖经过精准标定、低延迟的空间输入数据执行路径规划、避障和机械臂操作。采购预算初期来自新机型研发阶段的资本性支出与研发经费，在机型进入放量阶段后转由生产运营供应链预算承接。各细分客群采纳该方案的核心驱动力在于彻底消除多传感器联合标定漂移，并将系统集成周期从数个季度大幅缩短至数周。自
              2026 年 1 月告别隐身状态以来，Lyte 已将这一价值主张转化为物流仓储、工业巡检与制造产线上的实质性量产交付。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
          - type: table
            tableRef: TM003
