  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑、评级建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              Lyte 依托全栈具身智能物理 AI 基础设施构筑起引人注目的投资逻辑，用自研芯片和边缘同步 4D 感知取代支离破碎的通用机器人外购传感器组合。公司由 Alexander Shpunt、Arman Hajati
              和 Yuval Gerson 创立——三人正是 Microsoft Kinect 与 Apple Face ID 背后的核心工程架构师。Lyte
              直指当前阻碍自主机器人在复杂工业场景中规模部署的底层感知瓶颈。我们给予综合投资建议买入（Buy），置信度为中，风险评级为中，在当前 $1.6B
              投后估值水平下将估值立场归为偏高（Stretched）。Maverick Silicon、Fidelity、Atreides 以及半导体领军人物 Avigdor Willenz
              等一线机构投资者的支持，以及向巡检、物流和制造客户经确认的量产出货，强化了该投资逻辑。然而，反向逻辑集中于缺少公开披露的经常性收入指标、早期商业化扩张期的客户集中度风险，以及普遍存在的工业落地惯性。投资者必须权衡定义品类的芯片护城河与早期商业化执行风险。
