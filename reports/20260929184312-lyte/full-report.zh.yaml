companyProfile:
  summary: >-
    Lyte 成立于 2021 年，是一家专注于机器人与物理 AI（Physical AI）的感知技术公司。其主打产品 LyteVision 为集成式传感平台，融合了定制 4D 视觉、RGB
    成像、惯性传感与边缘计算能力。公司声称已迈入量产出货阶段，累计融资 2.72 亿美元，其中包括 2026 年 9 月投后估值达 16 亿美元的 C 轮融资；但公开证据显示，其营收规模、客户集中度、定价机制及资本效率仍高度不透明。
