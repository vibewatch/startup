  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、技术栈定义与涵盖支出
        blocks:
          - type: paragraph
            body: >-
              Lyte 将目标市场界定为 Physical AI 的基础感知层，为自主机器开发垂直整合的自研芯片、多模态传感器和空间软件。Lyte
              不造完整机器人，也不与通用企业软件厂商竞争；它瞄准的是高精度空间感知、实时边缘计算和传感器融合相关支出。这套技术栈的核心是 LyteVision，它将相干 4D 视觉、高分辨率 RGB
              成像与惯性运动感知统一接入同步的软硬件流水线。商用机器人的现状依然是拼凑各家供应商的分立传感器零部件，迫使工程团队耗费数月排查传感器融合、标定漂移和延迟问题。Lyte
              仅需单条物理连接即可交付统一空间数据，砍掉了冗长的集成周期，并由此斩获 CES 2026 机器人品类的 Best of Innovation
              Award。关键在于，该市场边界严格排除了同名的传统消费与娱乐软件业务，例如此前由 Lyte, Inc. 运营的二级演出与音乐会票务转售平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM012
