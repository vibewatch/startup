        title: 护城河持久度、商业模式与替换风险
        blocks:
          - type: paragraph
            body: >-
              采用 LyteVision 会给机器人制造商带来高昂的经济与运营切换成本。一旦自主移动机器人或工业巡检 OEM 将 Lyte 的集成传感器模块设计进机械底盘，机器人的物理安装结构、线束走向以及软件导航栈便会与
              Lyte 的专有架构深度绑定。这种机制在采购后构筑起极强的客户留存与切换壁垒，但也在早期销售周期中平添了阻力，因为 OEM 普遍对押注单一专有硬件供应商心存顾虑。同时，Lyte
              对单模块售价、阶梯折扣门槛以及经常性软件授权费用严加保密，给评估单机经济模型的投资人留下了证据缺口。从光学相邻赛道的上市可比公司来看，零部件供应商普遍面临与客户资本开支周期同频的强周期性集中度风险。若要守住商业壁垒，Lyte
              必须向客户证明其全生命周期总拥有成本（TCO）显著优于通用替代品，并锁定 OEM 客户的多年期批量采购承诺。
