      - number: '5.2'
        title: 自研芯片差异化、嵌入式固件与集成开发链路
        blocks:
          - type: paragraph
            body: >-
              区别于传统机器视觉与光学测距供应商，Lyte 最核心的技术护城河在于专有定制芯片。Lyte 并未采纳市售通用图像信号处理器（ISP）或通用微控制器，而是自主设计嵌入式 SoC，集成 Arm
              嵌入式核心、片上网络（NoC）相干互连架构以及执行低延迟边缘计算机视觉与机器学习任务的专用硬件逻辑。其固件与系统级软件基于嵌入式 Linux 及实时操作系统（RTOS），采用 C++ 和 Python
              开发，深度覆盖板级点亮、定制驱动及硬件在环（HIL）自动化验证框架。对接下游机器人主控计算单元时，Lyte 与 NVIDIA 展开技术合作，依托 Holoscan 传感器桥接技术将高通量感知遥测数据直通注入
              GPU，支持零拷贝数据传输、Jetson Thor 芯片、CUDA 加速计算以及 NITROS 管道，同时能将实时空间数据同步映射至 NVIDIA Omniverse 与 Isaac Sim
              构建数字孪生。然而，尽管其原型开发基础设施支持量化边缘神经网络部署，具体的芯片制程工艺节点、晶圆代工厂归属及原始传感器时钟主频等仍属未公开的内部工程机密。
