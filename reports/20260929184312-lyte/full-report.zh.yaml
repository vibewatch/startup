  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、评级建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              Lyte 主打全栈物理 AI 基础设施，以自研芯片和同步 4D 边缘感知替代分散拼装的机器人传感器，投资逻辑颇具吸引力。三位联合创始人 Alexander Shpunt、Arman Hajati 与 Yuval
              Gerson 曾担任 Microsoft Kinect 与 Apple Face ID 背后的工程架构师；Lyte
              瞄准的正是复杂工业场景中制约自主机器人落地的感知瓶颈。我们的综合建议为买入，置信度中等、风险评级中等；按当前 $1.6 billion 投后估值衡量，估值偏高。投资逻辑的支撑在于：公司获得 Maverick
              Silicon、Fidelity、Atreides 以及半导体先驱 Avigdor Willenz
              等一线机构注资，并向巡检、物流和制造业客户实现了经核实的量产出货。然而，反向逻辑集中表现为未公开披露经常性收入指标、商业化早期扩张中的客户集中度风险，以及工业领域普遍存在的落地惯性。投资者必须在定义品类的芯片护城河与早期商业化执行力之间做好权衡。
