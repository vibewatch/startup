            title: 机器人放量早期的客户集中度风险
            body: >-
              鉴于 Physical AI 机器人市场仍处于从技术试点向商业化规模过度的早期阶段，Lyte 的近期收入高度暴露于少数核心头部 OEM 客户的商业化排期上。关键客户在生产端的任何卡点、硬件召回或扩产停滞，都会对
              Lyte 收入的可预测性造成实质打击。
