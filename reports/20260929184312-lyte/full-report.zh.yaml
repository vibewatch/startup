      - number: '2.2'
        title: 目标市场测算、测算视角与资本规模
        blocks:
          - type: paragraph
            body: >-
              测算 Physical AI 感知层的目标市场，需要将自上而下的行业增长预测与自下而上的硬件物料清单（BOM）占比结合审视。宏观层面，Grand View Research
              预测，在自主移动机器人、自动化巡检平台与下一代协作系统的普及推动下，全球人工智能机器人市场到 2030 年将增长至 $125 billion。在动态多变的现实环境中运行的 Physical AI
              系统，必须依赖实时边缘计算来避免感知决策滞后。假定外购商用感知芯片与集成式传感模块约占自主机器硬件总支出的 8% 至 12%，那么到 2030 年，专用感知硬件的可服务市场（SAM）估算可达 $8 billion
              至 $15 billion。Lyte 于 2026 年 1 月以 $107 million 结束隐身状态后，又在 2026 年 9 月完成了由 Maverick Silicon 领投的 $165 million
              Series C 轮融资，投后估值达到 $1.6 billion，累计融资额达 $272 million。目前公司已开始向巡检、物流与制造领域的头部客户批量出货，但详细的客户合同金额与自下而上的 SOM
              指标仍属未公开的私有数据。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
