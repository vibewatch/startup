            body: >-
              自 2026 年 1 月公开亮相后，Lyte 的商业化进程显著加快。在结束隐身状态前，Lyte 已在 2021 至 2025 年间完成了四代内部传感器原型与芯片架构的迭代演进。伴随 1.07
              亿美元融资的公布以及在 CES 2026 斩获机器人品类最佳创新奖，公司直接转入批量生产交付阶段。到 2026 年 9 月宣布由 Maverick Silicon 领投的 1.65 亿美元 C
              轮融资时，官方确认已全面面向巡检、物流和制造领域的客户批量出货。来自 Maverick Silicon
              的投资人评述指出，早期客户需求广泛多元，初期芯片与硬件制造批次均已被预订一空。然而，作为未上市初创公司，Lyte 尚未公开累计实际装机量、活跃客户花名册或经审计的
