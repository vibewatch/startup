companyProfile:
  summary: >-
    Lyte is a 2021-founded robotics and Physical AI perception company that
    sells LyteVision, an integrated sensing platform combining custom 4D vision,
    RGB imaging, inertial sensing, and edge compute. The company says it has
    moved into production shipments and raised $272 million total, including a
    September 2026 Series C that valued it at $1.6 billion, but public evidence
    still leaves revenue, customer concentration, pricing, and capital efficiency
    largely opaque.
