  topStrengths:
    - Proprietary 4D perception silicon and synchronized edge sensing differentiate Lyte from fragmented robotics sensor stacks.
    - Founder-market fit is unusually strong, with PrimeSense and Apple depth-sensing pedigree.
    - Reported production shipments and a $272 million capital base support near-term execution.
  topRisks:
    - Revenue, ARR, customer count, pricing, and gross margin remain undisclosed.
    - Custom silicon fabrication and supply-chain execution could compress margins or delay scaling.
    - Customer concentration and valuation stretch leave the equity story dependent on continued OEM adoption.
  unresolvedGaps:
    - Named customers, contract values, and deployment counts are still undisclosed.
    - Unit pricing, volume discounts, and recurring software economics remain private.
    - Audited revenue, ARR, gross margin, cash burn, and runway are not publicly verified.
    - Public functional-safety and reliability evidence remains limited.
