  name: "Lyte"
chapter:
  number: 6
  title: "Customers"
  summary: "Lyte has transitioned from stealth engineering to initial production deployments, shipping its LyteVision perception hardware and software platform to robotics original equipment manufacturers across warehouse logistics, industrial inspection, and automated manufacturing. Commercial adoption is anchored by high-profile design wins across autonomous mobile robots, robotic arms, quadrupeds, robotaxis, and humanoids, while early enterprise demand is reported as sold out; however, individual customer accounts, contract values, net retention rates, and revenue concentration remain undisclosed private metrics."
sections:
  - id: "customer-segmentation-and-target-markets"
    title: "Customer Base Segmentation and Commercial Demand Drivers"
    body: "Lyte targets robotics original equipment manufacturers (OEMs), physical artificial intelligence developers, and industrial automation operators who require real-time 4D spatial perception in unstructured, dynamic physical operating environments. Historically, commercial robotics developers have faced severe integration bottlenecks: industry research from McKinsey indicates that over 60 percent of industrial companies lack internal capability to implement robotic automation, including complex sensor fusion. Robotics engineering teams typically spend months procuring disparate LiDAR, camera, and inertial components, calibrating disparate hardware, and resolving asynchronous sensor drift in software. Lyte's unified LyteVision platform addresses this structural friction by combining custom silicon, 4D sensing, RGB imaging, and motion awareness into a single edge module. The company's primary addressable customer segments span warehouse logistics providers deploying autonomous mobile robots (AMRs), industrial facilities utilizing automated inspection robots and quadrupeds, advanced manufacturing plants adopting robotic arms, and autonomous vehicle and robotaxi developers requiring robust predictive safety."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "commercial-adoption-trajectory-and-proof"
    title: "Commercial Adoption Trajectory and Production Deployments"
    body: "Lyte's commercial trajectory accelerated rapidly following its emergence from stealth in January 2026. Prior to public disclosure, Lyte developed four internal generations of sensing prototypes and silicon architectures between 2021 and 2025. Following its $107 million stealth announcement and showcase at CES 2026—where its perception platform received the Best of Innovation Award in Robotics—Lyte transitioned directly into production shipments. By September 2026, coinciding with its $165 million Series C round led by Maverick Silicon, the company confirmed active production shipments across inspection, logistics, and manufacturing customer bases. Investor commentary from Maverick Silicon highlighted that early customer demand has been broad and diverse, with initial sensor chip and hardware production batches continuously committed. However, as an early-stage private enterprise, Lyte has not publicly released aggregate deployed unit counts, active account rosters, or recognized annual recurring revenue, requiring investment underwriters to treat commercial velocity as early-stage production scaling."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-customer-validation"
    title: "Named Customer Proof, Deployment Profiles, and Defense Diligence"
    body: "Publicly confirmed commercial deployments for Lyte remain structured primarily around robotics OEM categories rather than co-marketed enterprise logos, reflecting widespread non-disclosure agreements across competitive robotics and physical AI markets. Lyte's technology has been deployed across diverse physical form factors, including humanoids, quadrupeds, autonomous mobile robots, robotic arms, and mobility systems. In market diligence, automated data ingestion frequently encounters namespace confusion with unrelated entities sharing the 'Lyte' brand, notably Hypori's 'Hypori Lyte for Secure Messaging' deployed across 27,000 users in the Department of the Air Force and Air Combat Command. Diligence confirms that Hypori Lyte is a distinct virtual mobile infrastructure software product unrelated to Lyte AI's physical robotics perception silicon. For Lyte AI, named tier-one customer proof remains tightly held by management, though industry partners such as the Association for Advancing Automation (A3) validate Lyte's commercial integration as an active perception supplier to the automation ecosystem."
    claimRefs:
      - "CU005"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Account Durability, Expansion Dynamics, and Concentration Risks"
    body: "Lyte's long-term business model relies on a land-and-expand architecture centered on custom silicon and hardware-software lock-in. When a robotics OEM designs LyteVision into its physical robot chassis, mechanical mounts, electrical wiring harnesses, and navigation compute stack, switching costs become formidable. Re-architecting a robot around competitor sensors requires complete mechanical re-engineering, recalibration, and retraining of physical AI foundation models. Consequently, initial evaluation and pilot design wins create high account durability and natural expansion as customers scale fleet deployments. However, this model introduces acute customer concentration risks: early commercial hardware revenues are typically driven by a small handful of high-volume robotics manufacturers. Delays in an OEM's commercial production ramp or changes in customer procurement priorities could disproportionately impact Lyte's shipping volumes and quarterly cash flow, underscoring the critical need to diversify its OEM design-win pipeline."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
