callouts:
  - calloutType: "insight"
    title: "High Switching Costs Create Exceptional Account Durability"
    body: "In physical AI robotics, perception hardware is deeply entwined with mechanical, electrical, and algorithmic system architecture. Once an OEM designs Lyte's custom sensing silicon and unified optical block into its production robot, replacing Lyte requires a multi-month chassis redesign, sensor recalibration, and software model retraining. This structural moat provides Lyte with high net retention potential, provided initial production batches meet quality and delivery commitments."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU014"
      - "CU015"
  - calloutType: "risk"
    title: "Customer Concentration in Early Robotics Scaling"
    body: "Because the physical AI robotics market remains in an early transition from pilots to commercial scale, Lyte's near-term revenues are highly exposed to the commercialization timelines of a small cohort of anchor robotics OEMs. Any production bottleneck, hardware recall, or scaling pause at a key customer represents a material vulnerability for Lyte's revenue predictability."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU016"
