  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: disclosure-gaps
      missingEvidence: >-
        Audited revenue, ARR, gross margin, named customers, deployment counts,
        customer concentration, headcount, cash balance, burn, and runway.
      whyItMatters: >-
        Financing and production claims cannot establish commercial traction,
        capital efficiency, or financing durability without these denominators.
      diligencePath: >-
        Request audited financials, monthly management accounts, bank statements,
        payroll reports, and a customer-level revenue and deployment schedule.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: headquarters
      missingEvidence: >-
        Current legal domicile, principal executive office, and relationship
        between the Mountain View description and Sunnyvale member-directory address.
      whyItMatters: >-
        Entity identity affects legal, tax, employment, and regulatory diligence
        and prevents a definitive headquarters statement.
      diligencePath: >-
        Obtain formation and foreign-qualification filings, the current cap
        table header, and written company confirmation of principal offices.
      relatedQuestionRefs: [QO001, QO008]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
