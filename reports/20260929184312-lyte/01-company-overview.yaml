artifact: company-overview
slug: lyte
runDate: 2026-09-29
company:
  name: Lyte
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Lyte is a 2021-founded physical-AI perception company built by former
    PrimeSense and Apple engineers; it says its vertically integrated platform
    has entered production deployments. A September 2026 company release reports
    $272 million of total capital and a $1.6 billion post-money valuation, while
    revenue, customer count, headcount, legal domicile, and ownership remain
    unverified in the assigned public evidence.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: >-
      Lyte was founded in 2021 by Alexander Shpunt, Arman Hajati, and Yuval
      Gerson, a trio whose prior work spans PrimeSense and Apple's sensing
      organizations. The company describes itself as the perception layer for
      physical AI: its LyteGalaxy platform combines sensors, compute, software,
      and algorithms, while LyteVision integrates coherent 4D vision, RGB, and
      inertial sensing at the edge. This is a product-platform description, not
      evidence of a disclosed software or hardware revenue model. Public
      location evidence also needs normalization: January coverage calls the
      company Mountain View-based, whereas an industry-member directory lists a
      Sunnyvale street address. The Snapshot table therefore distinguishes
      sourced facts from open corporate-identity questions rather than selecting
      one headquarters label without a legal filing.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: financing-and-stage
    title: Financing and operating stage
    body: >-
      The financing record changed materially during 2026. Independent January
      coverage reported $107 million of aggregate funding when Lyte emerged from
      stealth. On September 2, a Lyte-issued release syndicated by Business Wire
      and Yahoo Finance announced a $165 million Series C led by Maverick Silicon,
      a $1.6 billion post-money valuation, and $272 million of total capital
      raised since founding. Those are financing disclosures, not revenue, ARR,
      cash balance, or runway. The same release says Lyte had entered production
      and was shipping to robotics customers in inspection, logistics, and
      manufacturing, but it names no customers and supplies no deployment or
      revenue denominator. A funding database still showing January as the
      latest round illustrates why dated source attribution is essential.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder-market fit is the clearest organizational strength in the available
      record. Shpunt previously co-founded PrimeSense, while the founders'
      biographies connect them to Apple's depth-sensing, imaging, haptics, and
      advanced-technology work. Lyte's official roster also shows named leaders
      for hardware, physical AI, silicon, software, finance, packaging, operations,
      and sales, indicating functional breadth beyond the founders. Governance
      nevertheless remains founder- and investor-concentrated in public view:
      Avigdor Willenz is both founding investor and board chair, and the official
      page lists three other directors. Board voting rights, committees, founder
      vesting, succession plans, and investor ownership percentages are not
      disclosed, so the table's dependency ratings are diligence assessments
      rather than reported governance facts.
    claimRefs: [CO001, CO013, CO014, CO015]
    tableRefs: [TO002]
  - id: scale-and-evidence-boundaries
    title: Scale signals and evidence boundaries
    body: >-
      Public milestones establish capital formation, a CES recognition, a move
      from stealth to claimed production shipments, and the addition of a new
      lead investor. They do not establish commercial scale. None of the
      company-relevant assigned sources discloses revenue or ARR, a customer
      count, named production customers, employee count, gross margin, debt,
      available cash, or runway. The phrase "leading robotics customers" is
      therefore retained as a company claim rather than converted into a count
      or independently verified adoption metric. Search results also collide
      with Roundhill's unrelated Photonics & Optics ETF, which uses LYTE as its
      ticker; that source is used solely to document identity ambiguity and not
      as evidence about Lyte AI. Legal, regulatory, litigation, outage, and
      adverse-event checks returned no assigned direct source, which is an
      evidence gap rather than proof that no such events exist.
    claimRefs: [CO010, CO011, CO012, CO016]
callouts:
  - calloutType: strength
    title: Founder-market fit is unusually direct
    body: >-
      The three founders combine PrimeSense and Apple experience across depth
      sensing, imaging, haptics, mechanical systems, and product-scale deployment.
    claimRefs: [CO001, CO013]
  - calloutType: risk
    title: Financing scale exceeds disclosed commercial proof
    body: >-
      The $1.6 billion post-money valuation and $272 million raised are
      company-reported, while revenue, named customers, deployment counts, and
      headcount remain undisclosed in the assigned evidence.
    claimRefs: [CO008, CO009, CO011, CO016]
  - calloutType: assumption
    title: Current headquarters is not verified
    body: >-
      January sources describe Mountain View, while an industry directory lists a
      Sunnyvale address; a legal-entity filing or company confirmation is needed.
    claimRefs: [CO002, CO003]
