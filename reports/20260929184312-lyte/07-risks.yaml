callouts:
  - calloutType: "risk"
    title: "Custom Silicon Dependency Creates Inherent Supply Chain Fragility"
    body: "Lyte's core architectural strength—its custom silicon unifying 4D sensing, RGB imaging, and motion awareness from the transistor level—is simultaneously its primary operational vulnerability. Unlike robotics software vendors that operate asset-light models, Lyte is bound to semiconductor fabrication lead times, expensive wafer tape-outs, and single-source packaging partners. Any disruption at the foundry or packaging level directly throttles hardware revenue and customer deployment timelines."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "Customer Diversification Is the Critical Operational De-Risking Lever"
    body: "Because initial production batches of LyteVision are concentrated among early adopters in warehouse logistics and industrial inspection, Lyte's near-term valuation is heavily dependent on those customers successfully scaling their own fleets. Broadening commercial integration across quadrupeds, humanoids, and robotaxis will be essential to decouple Lyte's financial performance from the execution risks of any single anchor robotics OEM."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR015"
