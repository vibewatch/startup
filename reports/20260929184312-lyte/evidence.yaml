evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Audited revenue, ARR, gross margin, named customers, deployment counts, customer concentration, headcount, cash
      balance, burn, and runway.
    whyItMatters: >-
      Financing and production claims cannot establish commercial traction, capital efficiency, or financing durability
      without these denominators.
    diligencePath: >-
      Request audited financials, monthly management accounts, bank statements, payroll reports, and a customer-level
      revenue and deployment schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      Current legal domicile, principal executive office, and relationship between the Mountain View description and
      Sunnyvale member-directory address.
    whyItMatters: >-
      Entity identity affects legal, tax, employment, and regulatory diligence and prevents a definitive headquarters
      statement.
    diligencePath: >-
      Obtain formation and foreign-qualification filings, the current cap table header, and written company confirmation
      of principal offices.
    relatedQuestionRefs:
      - QO001
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Fully diluted cap table, investor ownership, security terms, board rights, committees, founder vesting, succession
      plans, debt, and secondaries.
    whyItMatters: Public names do not reveal control, liquidation economics, governance protections, or key-person continuity.
    diligencePath: >-
      Review charter documents, financing agreements, board minutes, option ledger, debt schedule, and key-person
      succession materials.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Direct records covering litigation, regulatory actions, sanctions, recalls, safety incidents, outages, layoffs, or
      material leadership departures.
    whyItMatters: >-
      The assigned adverse search returned no direct source, so the record cannot support either an adverse-event
      finding or a clean-history claim.
    diligencePath: >-
      Run entity-verified court, regulator, patent-dispute, employment, product safety, insurance-claims, and
      incident-log diligence using legal entity names.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      At least two additional dated product, partnership, regulatory, or operating milestones needed for an eight-event
      company chronology.
    whyItMatters: >-
      The public timeline is dominated by financing announcements and does not reveal the cadence of product validation
      or commercial execution.
    diligencePath: >-
      Request a board-approved milestone history and supporting product-release, certification, design-win, and shipment
      records with exact dates.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent bottom-up market sizing reports isolating the merchant robotics perception component spend from total
      robotics hardware expenditures.
    whyItMatters: >-
      Without segmented perception TAM/SAM data, sizing relies on top-down aggregate AI robotics forecasts ($125B by
      2030) rather than addressable sensor-and-compute module budgets.
    diligencePath: >-
      Request customer BOM cost breakdown data and third-party analyst component forecasts from management during
      technical diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: customer-adoption
    missingEvidence: >-
      Detailed production shipment volumes, per-unit hardware pricing (ASPs), and customer pilot-to-production
      conversion rates across robotics OEMs.
    whyItMatters: >-
      Quantifying annual serviceable obtainable market (SOM) requires understanding unit economics and OEM integration
      timelines across inspection and logistics.
    diligencePath: Review commercial contracts, customer order backlogs, and cohort shipment schedules under NDA.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Disclosed unit economics, bill-of-materials cost, volume tier discounts, and annual recurring software fees for
      LyteVision modules.
    whyItMatters: >-
      Without published unit pricing or contract schedules, OEM total-cost-of-ownership cannot be validated against
      commodity multi-sensor assemblies.
    diligencePath: >-
      Request customer procurement contracts, OEM master supply agreements, and per-robot sensor package pricing
      schedules under NDA.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: commoditization-risk
    missingEvidence: >-
      Third-party benchmark data on whether open-source fusion software on standard cameras/IMUs can match custom 4D
      perception silicon performance.
    whyItMatters: >-
      Rapid improvements in commodity vision foundation models could erode the premium commanded by proprietary custom
      silicon hardware.
    diligencePath: >-
      Conduct standardized field benchmarks evaluating drift, compute latency, and edge power draw across proprietary
      versus open-source stacks.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-bom
    missingEvidence: >-
      Audited income statements, gross margin by revenue stream, and component-level bill of materials for LyteVision
      modules.
    whyItMatters: >-
      Gross margin defines whether Lyte commands high-multiple software-like operating leverage or lower-margin
      semiconductor hardware economics.
    diligencePath: >-
      Obtain management accounts under non-disclosure agreement detailing foundry wafer costs, assembly yield rates, and
      direct unit gross profit.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contract-terms
    missingEvidence: >-
      Official pricing tiers, master services agreements, and customer contract discount schedules for hardware
      shipments and software licensing.
    whyItMatters: >-
      Without realized contract pricing, financial projections cannot underwrite average selling prices or revenue
      predictability.
    diligencePath: Review redacted customer agreements across inspection, logistics, and manufacturing partners.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited balance sheet, quarterly cash burn rate, capital expenditure schedule for foundry masking/tooling, and net
      cash on hand.
    whyItMatters: >-
      Determines whether the $165M Series C provides more than 24-36 months of operational runway given expensive custom
      semiconductor development.
    diligencePath: Request monthly cash flow statements and forward financial budget from CFO or lead investor Maverick Silicon.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: semiconductor-manufacturing
    missingEvidence: >-
      Semiconductor foundry partner identity, fabrication process node (nm), wafer defect density, and packaging
      supplier agreements.
    whyItMatters: >-
      Directly governs hardware manufacturing gross margins, unit production lead times, and capacity scaling risks
      under volume robotics deployment.
    diligencePath: >-
      Request fabless semiconductor operations audit, wafer supply agreements, and foundry capacity reservation
      schedules during technical diligence.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: reliability-and-functional-safety
    missingEvidence: >-
      Formal functional safety certifications (such as ISO 26262 ASIL or IEC 61508 SIL), thermal operating envelopes,
      and MTBF test records.
    whyItMatters: >-
      Industrial robotics and autonomous vehicle customers require certified functional safety ratings before deploying
      systems alongside human workers.
    diligencePath: >-
      Review third-party safety laboratory audit reports, environmental chamber thermal stress logs, and accelerated
      life testing data.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
