callouts:
  - calloutType: recommendation
    title: Research-more, not unconditional buy
    body: "Palmetto's financing access is credible, but public evidence does not establish a current equity price or risk-adjusted return. Obtain current cap-table, cohort, margin, and servicing evidence before underwriting."
    claimRefs: [CV001, CV003, CV005, CV015]
  - calloutType: risk
    title: Asset financing is not equity liquidity
    body: "ABS issuance is backed by customer contracts and can fund operations, but it does not by itself show cash available to common equity or remove dilution and preference risk."
    claimRefs: [CV006, CV007]
  - calloutType: assumption
    title: Scenario values remain qualitative
    body: "No defensible numeric valuation range is presented because audited revenue, gross margin, cohort loss data, current private pricing, and cap-table terms are not in the assigned evidence."
    claimRefs: [CV004, CV005, CV014]
