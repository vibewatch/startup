company:
  name: Palmetto
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Palmetto's access to institutional financing and a meaningful residential solar asset base, but it does not establish current equity value, sustainable revenue quality, or contract-asset performance. The appropriate stance is research-more with strict entry discipline rather than an unconditional buy.
sections:
  - id: recommendation
    title: Recommendation and valuation discipline
    body: Palmetto has evidence of financing-market access, including a $420 million 2025 securitization backed by 22,188 residential solar PPAs and leases and a separately reported $150 million 2023 investment from TPG Rise Climate. Those transactions demonstrate capital availability for the asset platform, not cash available to common equity or a current equity valuation. Forge records a $1.01 billion post-money valuation for the February 2022 Series C and explicitly warns that its data may rely on limited inputs and is not a market price. A separate data profile estimates 2025 revenue at $75 million and labels it an estimate, while also reporting a 2022 $1 billion valuation. Because revenue recognition, gross margin, portfolio loss performance, cap-table preferences, and current secondary pricing are not public in the assigned evidence, a precise multiple or target return would be false precision. The recommendation is research-more; proceed only after obtaining current capitalization and cohort economics, and require a materially better price or stronger evidence before underwriting a buy.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable context
    body: The positive thesis is that Palmetto has assembled a financing-enabled residential energy platform with repeat access to structured capital and a product model that can aggregate long-lived customer contracts. The 2025 ABS disclosures identify 22,188 PPAs and leases as collateral and describe a software-driven origination and servicing platform. The anti-thesis is that capital-market access can coexist with weak unit economics, customer-performance disputes, or financing dependence; independent consumer evidence includes reports of systems being offline, delayed service, and unresolved payment or installation issues. The complaint evidence is anecdotal and not a portfolio default statistic, but it is directly relevant to servicing cost, retention, and liability diligence. Public comparable evidence is thin; Caplight lists LGCY Power, Schneider Electric, and Powur as similarity comparables without public valuation outputs for Palmetto, while Sunrun's public market capitalization was $1.85 billion on October 22, 2026 after a reported 60.96% decline in 2026. Sunrun is a different public company and is not a direct valuation multiple for Palmetto.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: Scenario analysis should be treated as a decision framework, not a forecast. The bull case requires verified portfolio performance, repeat securitization capacity, improving service outcomes, and a current equity price below a supportable value after preference and dilution adjustments. The base case assumes financing access continues but public operating data remains incomplete, so an investor tracks rather than pays for modeled growth. The bear case is triggered by securitization disruption, rising defaults or service liabilities, weak customer savings, or a down-round that resets the 2022 private mark. Consumer review evidence includes a claim that one system was non-functional for five of nine months and separate reports of continuing payments alongside unresolved service problems; these are individual accounts, not proof of portfolio-wide failure. Exit readiness is therefore conditional; management should provide audited financials, cohort-level contract performance, current cap table and preference terms, debt and securitization covenants, customer concentration, complaint and service metrics, and an updated financing or secondary mark. A thesis break is failure to reconcile those data with the $1 billion reference valuation or to demonstrate durable access to capital on acceptable terms.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exhibits
    title: Valuation evidence exhibits
    body: The exhibits separate historical financing observations, uncertain private-market marks, public comparable context, and downside signals. Values retain their source period and qualification; no revenue, ARR, funding, or asset-backed issuance figure is treated as interchangeable with equity value or cash on hand. The recommendation therefore turns on evidence that can be refreshed and audited rather than on a stale headline mark. Financing access is a useful operating signal, but it is not a substitute for tracing contract cash flows, servicing obligations, investor seniority, and the price actually available to a new investor.
    claimRefs: [CV002, CV003, CV007, CV010, CV012]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a buy until current price and operating evidence are obtained."]
      - [Confidence, "Medium", "Financing facts are corroborated, but current equity value and economics are not."]
      - [Risk rating, "High", "Capital dependence, contract performance, service obligations, and valuation opacity remain material."]
      - [Valuation stance, "Stretched / unverified", "The $1.01B 2022 mark is historical; no current independent equity price is shown."]
      - [Entry discipline, "Require current cap table and cohort economics", "Price only after preference, dilution, defaults, servicing cost, and margin are reconciled."]
    notes: "Historical financing and valuation observations are not a current equity price, cash balance, ARR, or revenue-recognition conclusion; null or unavailable operating fields remain diligence gaps."
    claimRefs: [CV001, CV003, CV004, CV005]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Financing-enabled scale, "2025 ABS transactions exceeded $716M in aggregate issuance and the second transaction was backed by 22,188 PPAs and leases.", "Cohort cash flows, losses, advance rates, covenants, and retained economics fail to support repeat financing."]
      - [Institutional validation, "TPG Rise Climate provided $150M in 2023, according to ESG Today and PV Tech.", "The round was not equity or was not available to the operating company as represented."]
      - [Valuation reference, "Forge records a $1.01B post-money valuation for February 2022 Series C.", "Current secondary or inside-round evidence is materially below the reference after dilution and preferences."]
      - [Operating-risk anti-thesis, "Independent reviews describe outages, delayed repairs, and payment disputes.", "Audited service-level, complaint, warranty, and retention data show issues are isolated and economically contained."]
    notes: "The consumer accounts are directional adverse evidence, not a measured default rate or representative sample; the financing figures describe issuance or investment, not equity proceeds available to common holders."
    claimRefs: [CV006, CV007, CV008, CV009, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Cohort losses and servicing costs are controlled; financing remains repeatable; current price is below a verified mark.", "Potential upside is supportable only through audited cash flows, margin, dilution, and preference-adjusted entry data.", "Low-to-medium pending evidence", "ABS access weakens or customer performance fails to meet underwriting assumptions."]
      - [Base, "Capital access continues, but revenue quality, margin, retention, and current equity price remain opaque.", "Track or negotiate; do not pay the 2022 $1B reference without a current mark and downside protection.", "Highest on current public evidence", "No timely disclosure of cap table, cohorts, or operating KPIs."]
      - [Bear, "Defaults, service liabilities, customer disputes, or financing-market contraction increase while valuation resets.", "Downside may include dilution, preference overhang, impaired exit liquidity, or a down-round.", "Material and unquantified", "Securitization disruption, covenant breach, material down-round, or persistent outage/complaint escalation."]
      - [Exit readiness, "A strategic or public exit requires durable unit economics, clean governance, and transferable contract assets.", "No public evidence supports an exit multiple or target return today.", "Unresolved", "Current private mark cannot be reconciled to audited results or market comparables."]
    notes: "Scenarios are qualitative because the assigned evidence does not provide audited revenue, gross margin, cohort losses, current equity price, cap table, or a defensible valuation multiple; probability labels are signals, not modeled probabilities."
    claimRefs: [CV003, CV004, CV011, CV012, CV013, CV014]
