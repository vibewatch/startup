company:
  name: Palmetto
chapter:
  number: 3
  title: Competitors
  summary: Palmetto competes as a software-led residential-energy platform layered over partner installers, financing, and long-lived system ownership. Its differentiation is workflow coordination and financing flexibility, while local installation quality, service execution, and long-term contract friction leave room for larger integrated installers and lower-cost purchase alternatives.
sections:
  - id: landscape-and-business-model
    title: Competitive landscape and operating model
    body: >-
      The evidence supports a broad landscape rather than a single peer set. Palmetto's
      original platform description connected homeowners with financing, installers, and
      monitoring software, while current review sources describe a design-and-paperwork
      layer that dispatches local installation partners. That creates direct competition
      with national installers such as Sunrun, purchase-focused Tesla Solar, regional
      installer networks, and local contractors; it also competes with the status quo of
      staying on utility power or building an internal procurement process. The 2025
      securitization evidence shows that Palmetto also competes for institutional capital
      and asset-finance capacity, not only homeowner demand. These layers make “competitor”
      a job-to-be-done comparison: acquisition, system delivery, financing, monitoring,
      and post-install service can each be won by a different provider.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-facing-differentiation
    title: Buyer-facing differentiation and trade-offs
    body: >-
      Palmetto's buyer-facing proposition is flexibility: cash purchase, loan, lease, and
      PPA paths; an app-driven process; and optional monitoring and protection services.
      Independent review material consistently frames the trade-off as convenience and
      financing choice versus dependence on the assigned local installer and the quality of
      post-sale support. The price evidence is directional rather than a controlled quote
      benchmark: one review estimates roughly $2.50–$3.50 per watt before incentives and
      another places Palmetto at $2.70–$3.40 per watt. These should not be treated as
      realized pricing or a universal offer. A customer comparing Palmetto with Sunrun,
      Tesla, or a local installer should normalize dollars per watt, ownership, escalators,
      warranty scope, installer identity, and transfer terms rather than comparing headline
      monthly payments.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: durability-and-displacement
    title: Moat durability, service risk, and displacement
    body: >-
      The most defensible moat is operational coordination around complex local workflows
      plus access to financing and long-duration solar assets. The 2025 ABS transaction,
      backed by 22,188 residential leases and PPAs, demonstrates financing access and an
      installed asset base, but it does not prove superior unit economics or customer
      retention. The same partner model that expands coverage can weaken consistency:
      review sources report mixed service outcomes, and a current complaint analysis says
      service or repair issues were the largest category in its dated BBB count. This is
      adverse evidence about execution, not proof of systemic failure. Larger integrated
      providers can compete on brand, scale, or owned crews, while Tesla and local
      installers can compete on purchase economics or local trust. Durability therefore
      depends on measured service levels, partner quality control, asset performance, and
      transfer economics that are not fully public.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Core competitive thesis
    body: Palmetto's platform and financing coordination are meaningful differentiators, but the partner-installation and long-contract model makes local service execution the key durability test.
    claimRefs: [CP002, CP010, CP014]
  - calloutType: risk
    title: Evidence limit
    body: Public sources do not provide a controlled, apples-to-apples benchmark for Palmetto versus named peers on realized price, retention, installation defect rates, or contribution margin.
    claimRefs: [CP007, CP008, CP014]
