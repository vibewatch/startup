      - [Palmetto LightReach, "$0 upfront; fixed monthly lease or per-kWh PPA", "Third-party ownership, maintenance, and predictable payments described", "Escalator and transfer terms must be checked in the contract", "Reduces upfront barrier but increases long-term contract and transfer dependence"]
      - [Palmetto Protect, "Free tier and paid monitoring membership described", "Monitoring, diagnostics, and discounted eligible labor", "Paid price and attach rate are not disclosed in assigned sources", "Adds a service layer beyond installation"]
      - [Sunrun, "Not established in assigned sources", "National alternative named by review sources", "No controlled price or package comparison retained", "Requires a fresh like-for-like quote"]
      - [Tesla Solar, "Often lower published purchase price according to review source", "Purchase-focused alternative", "No comparable current quote retained", "Potential price pressure on purchase-led demand"]
      - [Local installer, "Varies by quote, roof, utility, and geography", "May include direct local service", "No market-wide benchmark", "Can win on trust or local execution despite less financing breadth"]
    notes: "Pricing figures are source-reported estimates and product descriptions, not realized revenue, ARR, margin, or a controlled peer benchmark. No unsupported discount rate or contract total is imputed."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Palmetto is positioned as software- and financing-oriented, with service consistency constrained by partner execution; alternatives occupy different combinations of integration and local accountability.
    data:
      xAxis: "Financing and workflow breadth"
      yAxis: "Installation and service control"
      points:
        - {label: Palmetto, x: 4, y: 2, rationale: "Multiple financing paths and coordinated workflow are documented; local partner execution lowers direct control."}
        - {label: Sunrun, x: 4, y: 3, rationale: "Named as a larger national alternative; exact current control and pricing are not established in assigned sources."}
        - {label: Tesla Solar, x: 2, y: 2, rationale: "Purchase-focused and potentially lower published price; comparable service evidence is not established."}
        - {label: Local installer, x: 2, y: 4, rationale: "Local accountability can be strong, but financing and workflow breadth vary by provider."}
        - {label: Utility status quo, x: 1, y: 5, rationale: "No installation workflow or financing complexity, but no onsite generation or system service."}
        - {label: Internal build, x: 3, y: 1, rationale: "Can control vendor choices but requires internal financing and operational capabilities."}
    approximationNotes: "Ordinal coordinates are analyst synthesis from the cited capability evidence, not measured market scores; points preserve uncertainty where peer-specific evidence is absent."
    claimRefs: [CP002, CP003, CP004, CP005, CP010]
