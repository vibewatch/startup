      - ["Design a system", "Homeowner needs site-specific sizing and engineering", "Palmetto coordinates design and engineering", "One workflow across project stages", "Design accuracy and rework rates are not disclosed"]
      - ["Secure financing", "Homeowner needs low-upfront payment", "Energy Plan and financing pathways", "Reduces upfront cash requirement", "Lifetime cost and realized approval rates require contract data"]
      - ["Install and activate", "Homeowner needs permitting, construction, inspection, and utility approval", "Palmetto coordinates partners and fulfillment", "Potentially standardized handoffs", "Partner quality and cycle-time distributions are not public"]
      - ["Monitor and maintain assets", "Homeowner needs production and issue resolution", "Monitoring, service, and performance-guarantee model", "Long-term support is part of the product promise", "Public reviews indicate unresolved support and outage cases"]
    notes: The table describes the intended workflow from public company and third-party descriptions; benefit fields are directional and not independently measured.
    claimRefs: [CE001, CE002, CE003, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or unknown]
    rows:
      - ["Customer marketplace", "Acquires and routes homeowner demand", "Retail and installer partners", "Channel concentration and conversion quality are undisclosed"]
      - ["Origination and sales workflow", "Turns a homeowner inquiry into a project", "Sales representatives and partner network", "Mis-selling and handoff controls need testing"]
      - ["Design, engineering, and permitting", "Converts site information into an executable project", "Local permitting and utility processes", "Rework, delay, and design-error rates are not public"]
      - ["Financing and asset ownership", "Funds systems and structures long-lived customer contracts", "Banks, lenders, and capital markets", "Contract-asset performance and servicing costs are not public"]
      - ["Installation and fulfillment", "Deploys equipment at the home", "Independent or partner installers", "Quality, licensing, and accountability vary by market"]
      - ["Monitoring and servicing", "Tracks production and resolves issues", "Connectivity, field service, and support operations", "Uptime, ticket aging, security controls, and escalation SLAs are not disclosed"]
    notes: Architecture layers are an analytical synthesis of the disclosed operating model; Palmetto has not published a complete technical architecture or independent control audit in the assigned sources.
    claimRefs: [CE005, CE006, CE007, CE008, CE010, CE014]
figures:
