  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-disclosure
      missingEvidence: Independent technical documentation covering software architecture, APIs, model governance, cybersecurity, privacy, and uptime.
      whyItMatters: The public record supports a software-enabled operating model but does not establish technical defensibility or control maturity.
      diligencePath: Request architecture diagrams, security attestations, penetration-test summaries, incident logs, and service-level reports under NDA.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Installation, production, outage, service-ticket, and repair cohorts segmented by installer, geography, product, and contract vintage.
      whyItMatters: Customer reports indicate reliability and support risk, but public complaints cannot establish rates or expected loss.
      diligencePath: Obtain anonymized cohort data and reconcile it to contractual performance guarantees and servicing costs.
      relatedQuestionRefs: [QE005, QE007, QE008]
    - type: missing-source
      severity: material
      topic: partner-dependencies
      missingEvidence: Partner roster, installer quality controls, licensing checks, concentration, escalation rules, and accountability for incomplete work.
      whyItMatters: Distributed execution can make product quality and remediation dependent on parties outside Palmetto's direct control.
      diligencePath: Review partner contracts, quality scorecards, termination history, and sample customer cases from multiple states.
      relatedQuestionRefs: [QE003, QE005]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Evidence of privacy, security, and compliance controls for customer, payment, energy, and monitoring data.
      whyItMatters: The assigned sources do not establish how connected-home and financial data are protected.
      diligencePath: Request SOC 2 or equivalent reports, data-flow maps, vendor controls, and breach-notification history.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public repository, package, API forum, engineering talk, practitioner discussion, or integration-partner technical post tied to Palmetto's platform.
      whyItMatters: The assigned community evidence is consumer feedback and cannot establish developer adoption, integration depth, or engineering execution.
      diligencePath: Request API documentation, release history, partner integration references, developer metrics, and an engineering demonstration.
      relatedQuestionRefs: [QE003, QE006, QE007]
