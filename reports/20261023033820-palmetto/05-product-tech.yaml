    title: Product architecture map
    summary: Palmetto's public product story links homeowner demand to distributed project execution, financing, and long-term asset service.
    type: stack
    data:
      layers:
        - label: Customer and partner interface
          modules:
            - label: Homeowner marketplace
              detail: Demand capture and product selection
            - label: Retail and installer partners
              detail: Distribution and local execution channel
        - label: Origination and project workflow
          modules:
            - label: Sales and site assessment
              detail: Customer qualification and system design inputs
            - label: Design, permitting, and fulfillment
              detail: Project progression to installation and activation
        - label: Financing and asset model
          modules:
            - label: Energy Plan
              detail: Lease or PPA structure with long-duration obligations
            - label: Capital-markets program
              detail: Financing pathway for residential contract assets
        - label: Operations and service
          modules:
            - label: Monitoring and performance
              detail: Production tracking and guarantee administration
            - label: Maintenance and field support
              detail: Repair, warranty, and partner-service coordination
        - label: Data and controls
          modules:
            - label: Local intelligence data
              detail: Site and market inputs for workflow decisions
        - label: External dependencies
          modules:
            - label: Utilities and permitting authorities
              detail: Approval, interconnection, and operating constraints
    approximationNotes: The figure reconstructs an operating model from public descriptions; it is not a verified software, hardware, data, or security architecture.
    claimRefs: [CE005, CE006, CE007, CE008, CE010, CE015]
