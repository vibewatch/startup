company:
  name: Palmetto
chapter:
  number: 5
  title: Product & Technology
  summary: Palmetto presents a software-enabled residential-energy platform around customer acquisition, system design, financing, installation coordination, monitoring, and long-term service. Public evidence supports a broad product and financing model, but the technical surface is thin and customer reports raise material questions about post-installation reliability, partner execution, and service remediation.
sections:
  - id: customer-product
    title: Customer product and operating model
    body: >-
      Palmetto's customer proposition is not a single hardware product. Public descriptions
      characterize an end-to-end residential clean-energy workflow that combines sales,
      design, engineering, permitting, fulfillment, financing, installation coordination,
      monitoring, and maintenance. The product set spans solar, storage, EV charging,
      heat pumps, and related home-electrification tools, while the consumer Energy Plan
      can be structured as a lease or power-purchase agreement. The platform therefore
      sits between homeowner, financing counterparty, local installer, utility, and
      long-lived asset owner. That can lower upfront friction and broaden distribution,
      but it also creates handoff risk: the party selling the plan may be a partner,
      installation may be subcontracted, and service quality depends on coordination
      across the network. The public record does not establish module-level adoption,
      software usage, or realized performance across the installed base.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, maturity, and differentiation
    body: >-
      The disclosed architecture is best understood as a workflow and asset-servicing
      stack rather than a documented proprietary hardware stack. Palmetto describes
      software-driven origination and servicing, automated workflows, predictive
      algorithms, local intelligence data, and a consumer marketplace connected to
      financing and capital-markets infrastructure. Its 2025 securitization disclosure
      also describes a pool of residential PPAs and leases and references time-of-use
      and grid-services programs. These materials indicate operational integration
      across demand generation, underwriting or financing, project execution, and
      ongoing asset monitoring. They do not disclose APIs, software architecture,
      model validation, uptime, cybersecurity controls, component specifications,
      manufacturing ownership, or independently measured installation cycle times.
      The defensible advantage may therefore be process data, partner access, servicing
      operations, and financing execution, but that hypothesis needs technical and
      portfolio evidence rather than marketing language.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    figureRefs: [FE001]
    tableRefs: [TE003]
  - id: reliability-trust
    title: Reliability, support, and diligence risks
    body: >-
      Product risk is concentrated after sale. Palmetto's own described plan includes
      long-duration service and performance commitments, while independent review
      pages contain both positive installation accounts and adverse reports of systems
      offline, delayed repairs, monitoring failures, unresolved billing disputes, and
      difficulty obtaining support. These are customer accounts, not a statistically
      representative failure rate, and they do not prove that every installation is
      defective. They do show that service responsiveness and partner accountability
      are central diligence questions for a product whose economics and customer trust
      depend on years of operation. A cancellation guide likewise describes a model
      involving local subcontractors, third-party lenders, project management, and
      monitoring, which increases the number of parties needed to remediate an issue.
      Before underwriting technical maturity, request component-level warranties,
      outage and ticket data, service-level commitments, installer quality controls,
      cybersecurity and privacy documentation, and cohort-level performance against
      contractual guarantees.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
  - id: product-verdict
    title: Product verdict and open evidence
    body: >-
      Palmetto appears to have meaningful product breadth and a scalable operating
      concept, but public evidence is stronger for the commercial story than for the
      underlying technical controls. The company can point to a large financing
      program and a software-driven operating model, yet the assigned evidence does
      not establish software reliability, integration depth, incident rates, customer
      retention, or consistent partner execution. The product is consequently best
      viewed as an integrated service-and-finance system with technology-enabled
      operations, not as a transparently verifiable software moat. The highest-value
      diligence is operational: obtain anonymized installation and service cohorts,
      production-versus-estimate data, unresolved-ticket aging, installer defect
      rates, partner concentration, security attestations, and the exact contractual
      owner of monitoring, maintenance, and performance remediation. Evidence quality
      is also uneven: GetLatka relies on an external revenue estimate, while the fetched
      Nasdaq Private Market snapshot supplies no Palmetto-specific product detail.
    claimRefs: [CE005, CE010, CE011, CE014, CE015, CE016]
callouts:
  - calloutType: insight
    title: Product thesis
    body: Palmetto's apparent differentiation is the coordination of customer acquisition, project execution, financing, and long-term asset servicing; public materials do not yet prove that the software layer itself is difficult to replicate.
    claimRefs: [CE005, CE006, CE008]
  - calloutType: risk
    title: Reliability diligence
    body: The most material product risk is not whether panels or batteries exist, but whether Palmetto and its partner network can monitor, repair, and communicate about distributed assets over a multi-decade contract.
    claimRefs: [CE010, CE011, CE012, CE013]
