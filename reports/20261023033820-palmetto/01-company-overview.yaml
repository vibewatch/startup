callouts:
  - calloutType: strength
    title: Multiple capital channels are visible
    body: Equity investment, LightReach capital, asset-backed securitization, and ITC transfers show financing breadth, although those amounts do not establish profitability or cash availability.
    claimRefs: [CO008, CO009, CO010, CO011]
  - calloutType: risk
    title: Operating quality lacks a denominator
    body: Complaint and review evidence identifies service risks worth testing, but public sources do not disclose the customer base, verified incident rate, or cohort economics needed to quantify them.
    claimRefs: [CO016]

