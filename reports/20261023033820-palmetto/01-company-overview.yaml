company:
  name: Palmetto
chapter:
  number: 1
  title: Company Overview
  summary: Palmetto is a private residential clean-energy platform with documented access to equity, securitization, and tax-credit capital channels. The scale of its financed asset pools is meaningful, but public revenue, customer, governance, and operating-quality evidence remains incomplete or third-party estimated.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: Palmetto describes a consumer energy platform that connects homeowners with clean-energy partners and financing across solar, storage, HVAC, backup power, and efficient appliances. Its homepage presents a coordinated workflow from system design and installer connection through payment-plan selection and ongoing system operation, indicating a platform and partner-network model rather than a single-function installer. Public identity records are less settled. EquityZen lists a 2009 founding year and Charleston, South Carolina headquarters, while GetLatka says Christopher Kemper founded the business in 2010. Those profile statements establish a reasonable identity range, not an authoritative incorporation date or current legal headquarters, so both remain explicit diligence items.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: Christopher Kemper is consistently identified as founder and chief executive by CNBC, EquityZen, and GetLatka, making his role the clearest leadership fact in the assigned evidence. CNBC reports an advisory group spanning former Treasury Secretary Larry Summers, former Federal Energy Regulatory Commission commissioner Neil Chatterjee, Nextdoor co-founder Nirav Tolia, and Monica Williams of The Equity Project. That network may broaden access to policy, technology, and macroeconomic judgment, but an advisory board is not evidence of fiduciary oversight, voting control, or succession readiness. No assigned source provides a complete executive roster, legal board composition, ownership schedule, or succession plan, leaving key-person dependence and formal governance unresolved.
    claimRefs: [CO006, CO007]
    tableRefs: [TO002]
  - id: capital-formation-and-scale
    title: Capital formation and scale
    body: Palmetto has demonstrated access to several forms of capital, but the labels and beneficiaries must remain distinct. PV Tech reports a $150 million TPG Rise Climate investment in 2023. PV Magazine reports that Palmetto announced $1.2 billion of investments for LightReach in early 2025 and later closed a $420 million securitization backed by 22,188 residential PPAs and leases. In April 2026, Palmetto announced a $300 million ITC transfer to two Fortune 1000 partners. These figures represent equity investment, project or platform capital, asset-backed financing, and tax-credit transfers; none is interchangeable with revenue, ARR, cash on hand, or total equity funding. GetLatka's $75 million 2025 revenue estimate and 634-person LinkedIn-derived headcount are useful scale indicators but remain unaudited secondary estimates.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO014, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: valuation-and-diligence-boundary
    title: Valuation markers and diligence boundary
    body: >-
      GetLatka reports that Palmetto's February 2022 Series C raised $375 million at a $1 billion valuation, which is a historical financing marker rather than a verified current valuation. The same profile's $1.6 billion total-raised label includes a $1.2 billion debt-financing entry, illustrating why reported funding totals cannot be treated as equity raised or cash available without a capitalization and debt schedule. Adverse sources also warrant investigation: a referral-oriented review cites 340 BBB complaints over three years, and consumer-review material describes outages and delayed support. Those observations lack a company-wide customer denominator and therefore cannot establish an incident rate. Audited financials, cohort performance, customer counts, complaint rates, partner concentration, and formal governance remain the core evidence gaps.
    claimRefs: [CO013, CO014, CO016]

