company:
  name: Palmetto
chapter:
  number: 6
  title: Customers
  summary: >-
    Palmetto's customer proposition spans homeowner solar and storage, partner-led
    installation, and LightReach financing, with public evidence of more than 20,000
    adopted households but limited disclosure of retention, cohort economics, and
    concentration. Customer reviews show a material service and post-installation
    durability risk alongside positive installation experiences.
sections:
  - id: customer-segments
    title: Customer segments and buying structure
    body: >-
      Palmetto primarily serves residential homeowners seeking solar, storage, and
      broader electrification, while also supplying a platform to local installers,
      dealers, and enterprise brands. Rust Belt Industrials describes a marketplace
      connecting homeowners in more than 25 U.S. states with vetted local installers,
      and the company's 2022 operating-platform release says co-branded sales and
      fulfillment systems were designed for consumer and enterprise brands. The
      customer is therefore not a single buyer: the homeowner is the end user and
      payer, the installer or dealer is an acquisition and delivery channel, and
      financing institutions support the LightReach asset-backed plan. Public sources
      do not disclose segment-level revenue, active-account counts by state, or the
      share of direct versus partner-originated demand. Latka explicitly labels its
      $75 million 2025 revenue figure as a Growjo estimate rather than company-reported
      revenue, so it cannot establish customer economics. A separate contract-exit
      guide also describes Palmetto as a marketplace rather than a traditional
      installer, reinforcing the need to separate the roles of seller, installer,
      lender, and service provider during diligence.
    claimRefs: [CU001, CU002, CU003, CU004, CU015, CU016]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest public adoption datum is Mercom's report that more than 20,000
      households had adopted solar through LightReach lease or power-purchase plans
      by January 2025. That is a cumulative household figure, not an active-customer
      or retention measure, and it is not accompanied by cohort, geography, utilization,
      cancellation, or revenue denominators. The same source describes the plans as
      beginning near the end of 2023, while Tracxn records 278 employees as of
      December 31, 2024 and a 2025 debt round, providing context for scale but not
      customer durability. Publicly named deployments are sparse: the available
      evidence supports a broad household adoption count and a marketplace model,
      but does not identify three independently verified production customers with
      measured outcomes. This limits confidence in expansion and reference quality.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-and-risk
    title: Retention, service durability, and concentration gaps
    body: >-
      Palmetto does not publicly report NRR, GRR, churn, renewal rates, contract
      length by cohort, or service-response performance. Reviews provide directional
      evidence rather than a statistically representative retention dataset. Solar
      Reviews includes both positive installation accounts and complaints about
      systems remaining offline, delayed callbacks, and customers paying while systems
      were not producing. A separate review summary counted 340 complaints in three
      years, with 148 categorized as service or repair, while explicitly warning that
      the count is not adjusted for the customer base. These signals make post-sale
      service, subcontractor execution, and transfer or financing friction material
      diligence items. The company also does not disclose top-partner, top-state, or
      top-account concentration, so scale cannot yet be translated into durable
      customer economics.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Evidence of scaled residential adoption
    body: >-
      More than 20,000 households were reported as adopting LightReach solar lease
      or power-purchase plans by January 2025, but the figure is cumulative and
      company-linked rather than a retention or active-use metric.
    claimRefs: [CU005]
  - calloutType: risk
    title: Durability is not proven by logos or installations
    body: >-
      Public evidence lacks cohort retention and concentration data, while review
      sources describe both successful installations and recurring service failures;
      diligence should obtain cohort-level production, complaint, cancellation, and
      response-time data.
    claimRefs: [CU010, CU011, CU014]
