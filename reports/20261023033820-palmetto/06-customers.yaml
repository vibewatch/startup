  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Cohort-level NRR, GRR, churn, renewal, cancellation, and service-response metrics by product and activation vintage."
      whyItMatters: "Cumulative household adoption does not establish durable usage, economics, or customer satisfaction."
      diligencePath: "Request monthly cohort tables, contract-level retention definitions, cancellation reasons, production uptime, complaint rates, and service-ticket aging under NDA."
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-deployments
      missingEvidence: "A customer reference list with production status, geography, contract form, installation date, and measured outcomes."
      whyItMatters: "The public record does not distinguish logos, cumulative households, pilots, and independently verified production deployments."
      diligencePath: "Obtain permissioned customer references and reconcile them to installation, activation, production, and payment records."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: "Top-10 customer, partner, state, installer, and financing-counterparty shares."
      whyItMatters: "A partner-led marketplace can appear broad while remaining economically dependent on a small number of channels or counterparties."
      diligencePath: "Request revenue and installed-base concentration schedules for the latest twelve quarters, with customer and partner names masked if necessary."
      relatedQuestionRefs: [QU005]
