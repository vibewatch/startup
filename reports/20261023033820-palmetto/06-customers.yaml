      severity: material
      topic: service
      missingEvidence: "Verified complaint, outage, and resolution data reconciled to the installed base."
      whyItMatters: "Anecdotal positive and adverse reviews cannot determine the base rate of service failure or retention."
      diligencePath: "Reconcile CRM tickets, inverter uptime, production guarantees, refunds, and complaint outcomes to active contracts."
      relatedQuestionRefs: [QU006]
