      - ["Palmetto employees", 278, "Dec 31, 2024", "Tracxn", "medium", "Provides an operating-scale reference point", "Revenue per employee and customer-support staffing"]
      - ["Residential marketplace coverage", "25+ U.S. states", "Undated source page", "Rust Belt Industrials", "medium", "Suggests geographic reach through local installers", "Active state count, installations per state, and state-level economics"]
      - ["Customer reviews on SolarReviews", 160, "Page accessed Oct 23, 2026", "SolarReviews", "medium", "Offers directional service and installation feedback", "Review representativeness, verified-customer share, and denominator"]
    notes: "Metrics mix cumulative households, employee count, geographic coverage, and review count; they are not a comparable conversion funnel and should not be interpreted as one."
    claimRefs: [CU005, CU006, CU007, CU011]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: "Publicly identifiable customer evidence and customer-facing adoption records available in the assigned source pool as of 2026-10-23"
    columns: [Customer or cohort, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["LightReach household cohort", "Residential homeowner", "Solar lease or power-purchase plan", "Production/adopted cohort claimed by Mercom", ">20,000 households reported adopted", "No named households, cohort retention, or independently verified production data"]
      - ["SolarReviews reviewer: Anthony Terranova", "Residential homeowner", "20-panel installation and electrical-service upgrade", "Production according to review", "Reviewer reported system online Apr 1, 2026 and producing more than household need", "Single self-reported account; no bill or production records supplied"]
      - ["SolarReviews reviewer: Kevin", "Residential homeowner", "Residential system with post-installation support", "Production system with outage period", "Reviewer reported system non-functional for 5 of 9 months and continued payments", "Single adverse account; causation and contract terms are not independently verified"]
      - ["SolarReviews reviewer: Jonathan Roberts", "Residential homeowner", "Cancelled project involving subcontractor permitting", "Cancelled before installation", "Reviewer reported a $14,000 deposit remained unresolved nearly a year later", "Single adverse account; dispute outcome is not independently verified"]
    notes: "Enumeration is a sample of publicly available customer evidence, not an exhaustive customer list; named reviews are customer statements and require verification through contracts, production logs, permits, and payment records."
    claimRefs: [CU008, CU010, CU011, CU012]
