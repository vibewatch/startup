artifact: financials
slug: palmetto
runDate: 2026-10-23
company:
  name: Palmetto
chapter:
  number: 4
  title: Financials
  summary: Palmetto has demonstrated access to institutional and asset-backed financing, but public evidence does not establish corporate profitability, cash availability, or asset-cohort returns. The underwriting case therefore rests on private verification of contract cash flows, servicing costs, credit performance, financing recourse, and unrestricted liquidity.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Palmetto is described as a platform rather than a panel manufacturer: it combines customer acquisition,
      energy modeling, financing, installer coordination, and long-term system management. LightReach is reported
      as a lease and power-purchase-agreement platform that removes the upfront system payment while a third party
      owns the asset and the homeowner makes predictable monthly payments. That model can produce long-duration
      contractual cash flows, while the marketplace, software, and energy-intelligence activities may add other
      monetization paths. Public evidence does not disaggregate realized revenue among those streams or explain
      revenue recognition. GetLatka explicitly says Palmetto has not published revenue and presents a roughly
      $75 million estimate for 2025, so that figure is a scale proxy rather than ARR, audited revenue, or cash.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: Sales efficiency, cost structure, and unit economics
    body: >-
      Public traction indicators include more than 20,000 LightReach households across over 30 states and an
      approximately 300-customer daily addition rate reported in January 2025. Those operating statistics are
      company-derived figures repeated by an aggregator, not audited revenue or retention cohorts. The operating
      model spans sales, design, engineering, permitting, installation coordination, equipment, monitoring,
      maintenance, and performance obligations, so contribution margin depends on more than customer payment
      volume. No assigned source provides channel-level CAC, sales-cycle length, payback, installed cost, gross
      margin, service cost, cancellation rate, or retention. Customer-review evidence describes delayed service
      and difficulty reaching the company; these are allegations rather than measured loss data, but they identify
      service response, warranty expense, and contract continuity as variables that could weaken unit economics.
    claimRefs: [CI004, CI008, CI009, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital access and financing dependency
    body: >-
      Palmetto has credible evidence of financing access. A company-issued release syndicated by Yahoo Finance and
      independent PV Magazine reporting describe a $420 million October 2025 securitization backed by 22,188
      residential PPAs and leases; together with an approximately $286 million April issuance, reported 2025 term
      ABS issuance exceeded $716 million. Separate reporting describes $1.2 billion of investment supporting
      LightReach and a $150 million 2023 TPG Rise Climate investment. These amounts have different purposes and
      cannot be added as corporate funding, revenue, or cash available. Securitization proceeds, warehouse capacity,
      tax equity, asset-level debt, and corporate growth capital carry different recourse, reserve, covenant, and
      cash-flow implications. The round-by-round corporate funding chronology belongs in Company Overview; the
      financial question here is how much unrestricted liquidity remains after asset funding and obligations.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is research-more. Repeat institutional access is a strength because it supports
      origination and demonstrates capital-market demand for pools of residential contracts. It does not establish
      positive corporate cash flow, durable gross margin, or adequate runway. Underwriting requires audited or
      management financial statements; a bridge from contract billings to recognized revenue and cash; unrestricted
      cash and monthly burn; all warehouse, debt, tax-equity, and securitization obligations; and a vintage-level
      cohort tape covering production, collections, defaults, cancellations, transfers, service costs, and guarantee
      payments. The public complaint count and service allegations increase the importance of reconciling support
      performance to cash collections and reserves, but neither source supplies a denominator or quantifies the
      financial impact. Until those private inputs are verified, margin path, capital adequacy, and next-round timing
      remain material blockers rather than forecastable outputs.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or basis, Public status, Evidence quality, Diligence request]
    rows:
      - ["Energy Plan lease/PPA", "Homeowner pays under a long-term agreement while a third party owns the asset", "Monthly payment or PPA rate", "Mechanism described; realized revenue undisclosed", "Independent reports of company terms", "Contract-level billings, collections, escalators, and revenue-recognition schedule"]
      - ["LightReach financing platform", "Institutional capital supports zero-upfront residential solar and storage", "$1.2B investment reported", "Financing capacity, not revenue or cash available", "Two reports; underlying mix not disclosed", "Sources-and-uses, advance rates, reserves, fees, and recourse"]
      - ["Marketplace and installer coordination", "Platform connects homeowners with local installers and manages workflow", "More than 25 states in one industry profile", "Scale proxy; take rate undisclosed", "Independent profile", "Dealer fees, channel take rate, cancellation cost, and partner concentration"]
      - ["Software and energy intelligence", "Digital tools model homes and support energy recommendations or developer access", "Revenue contribution unavailable", "Capability described; monetization unquantified", "Independent profiles", "Module revenue, usage, gross margin, and customer retention"]
    notes: "Public offer terms, financing capacity, platform activity, and estimated corporate revenue are not interchangeable; undisclosed fields are diligence gaps, not zeros."
    claimRefs: [CI001, CI002, CI003, CI005, CI013]
  - id: TI002
    title: Pricing and monetization terms
    columns: [Offer, Published term, List versus realized pricing, Financial implication, Diligence request]
    rows:
      - ["Palmetto Energy Plan", "25-year lease or PPA, depending on state", "No realized customer-price distribution disclosed", "Long duration can support contracted payments and creates transfer exposure", "Signed state-level agreements, payment curves, and renewal or end-of-term terms"]
      - ["Annual rate escalator", "Independent review reports a contract range of 0% to 3.5%", "Actual customer mix is unavailable", "Escalation can lift nominal receipts while affecting affordability and transferability", "Distribution of escalators by vintage, state, and channel"]
      - ["Performance guarantee", "90% production threshold with review every 36 months is reported", "Not a price; potential shortfall-payment obligation", "Creates monitoring, reserve, and servicing exposure", "Claims frequency, payment history, reserve methodology, and exclusions"]
      - ["Zero-upfront offer", "$0 upfront and predictable monthly payments are reported", "No verified payment distribution or realized discount data", "Upfront-cost removal shifts asset funding and performance exposure to the provider side", "Customer payment, dealer compensation, tax-credit, and subsidy bridge"]
    notes: "Terms are reported descriptions of public offers, not evidence of realized revenue, customer lifetime value, or contribution margin."
    claimRefs: [CI002, CI006, CI007]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value, Confidence, Underwriting relevance, Diligence request]
    rows:
      - ["Corporate revenue", "$75M estimate for 2025", "Low", "Rough scale proxy only; not company-published or audited", "Audited revenue bridge and recognition policy by stream"]
      - ["Gross margin", null, "Unavailable", "Tests whether installation, financing, and service costs support contribution", "Consolidated and segment gross-margin bridge"]
      - ["CAC, sales cycle, and payback", null, "Unavailable", "Tests whether partner-led origination scales efficiently", "Channel cohorts for spend, conversion, cycle, cancellation, and payback"]
      - ["Cash burn and runway", null, "Unavailable", "Determines corporate capital need and next-round trigger", "Monthly cash flow, unrestricted cash, debt maturities, and base/downside runway"]
      - ["Contract performance", null, "Unavailable", "Drives asset value, securitization access, and guarantee exposure", "Vintage-level production, payment, default, transfer, cancellation, and service data"]
      - ["2025 term ABS issuance", "More than $716M across two reported transactions", "High for issuance amount", "Demonstrates capital access, not corporate cash or profitability", "Waterfalls, advance rates, recourse, reserves, triggers, and covenant headroom"]
    notes: "Null means the assigned public evidence does not disclose the metric. Financing and securitization amounts are not revenue, cash burn, or unrestricted liquidity."
    claimRefs: [CI005, CI010, CI011, CI012, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: The public model converts homeowner demand into long-duration payments through origination, third-party asset funding, installation, and servicing.
    data:
      nodes:
        - id: homeowner-demand
          label: Homeowner demand
          detail: Customer acquisition and energy assessment; channel economics are undisclosed
        - id: origination
          label: System origination
          detail: Design, permitting, installer coordination, and fulfillment
        - id: asset-funding
          label: LightReach asset funding
          detail: Institutional capital supports a zero-upfront lease or PPA structure
        - id: operating-asset
          label: Residential energy asset
          detail: Third-party-owned system produces power under a long-term customer agreement
        - id: customer-payments
          label: Customer payments
          detail: Monthly lease payment or rate-per-kWh mechanism; realized pricing is undisclosed
        - id: servicing-capital-markets
          label: Servicing and capital markets
          detail: Collections, maintenance, guarantees, reserves, and potential securitization
    approximationNotes: "The sequence shows the reported commercial mechanism; it does not quantify conversion, revenue recognition, margin, or cash timing."
    claimRefs: [CI001, CI002, CI006, CI010, CI012, CI013]
callouts:
  - calloutType: strength
    title: Capital-market access is an operating advantage
    body: Two reported 2025 ABS transactions totaling more than $716 million indicate repeat institutional access, but the amount represents asset-backed issuance rather than corporate revenue or unrestricted cash.
    claimRefs: [CI010, CI011, CI012]
  - calloutType: risk
    title: Cohort economics remain the core blocker
    body: No assigned source provides cash, burn, gross margin, acquisition payback, asset defaults, or servicing cost by vintage, preventing a reliable margin or runway judgment.
    claimRefs: [CI015, CI016]
