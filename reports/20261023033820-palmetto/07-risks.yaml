schemaVersion: "report-v2"
artifact: risks
slug: palmetto
runDate: 2026-10-23
company:
  name: Palmetto
chapter:
  number: 7
  title: Risks
  summary: >-
    Palmetto's principal exposures are execution and service reliability in a long-duration
    residential energy contract, dependence on financing and tax-policy conditions, and limited
    public visibility into operating and portfolio performance. Public sources show both
    institutional-capital access and material customer-service allegations, so risk remains high
    until contract performance, complaint remediation, and asset-level economics are independently
    evidenced.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Palmetto's residential model is exposed to changing tax-credit eligibility, contractor and
      partner licensing, consumer-credit obligations, and contract-transfer requirements. The
      statutory framework is not a simple tailwind: the Clean Electricity Investment Credit applies
      to qualified facilities and storage placed in service after December 31, 2024, while the
      statute also contains eligibility limits, foreign-entity restrictions, recapture provisions,
      and an exclusion for certain leased property. SEIA's 2025 market review describes policy
      uncertainty, tariff investigations, permitting actions, and tax-credit qualification
      uncertainty as drivers of delays and cancellations. Consumer-facing review material also
      describes a company-owned 25-year Energy Plan with transfer, buyout, and notice mechanics
      that may create dispute and compliance risk. The diligence priority is to reconcile each
      state, installer, contract form, and tax-credit assumption rather than treating a national
      product description as a uniform legal posture. One allocated ConsumerAffairs page did not
      yield Palmetto-specific evidence in the prefetched body, only platform disclosures, so it is
      retained as a source-access limitation rather than used to offset the adverse record.
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-financial
    title: Operating reliability and financial-model risk
    body: >-
      The operating risk is concentrated in the handoff between Palmetto, partner installers,
      equipment vendors, utilities, and financing counterparties. A partner announcement says
      Enact integration was intended to streamline proposals and supports solar, storage, and HVAC
      financing, but it does not establish completed deployment quality or service-level
      performance. SolarReviews contains customer accounts of systems offline for months, delayed
      responses, incomplete work, and continued payments; these are individual reports, not a
      verified incident rate. Palmetto's capital structure adds model risk: the company disclosed
      more than $1.2 billion of capital for 2024 and 2025 LightReach plans, while PV Magazine
      reported a $420 million securitization backed by 22,188 leases and PPAs. Those figures
      evidence financing scale, not cash available, profitability, default performance, or
      servicing economics. Until cohort-level production, cancellations, delinquency, warranty
      cost, and partner performance are disclosed, residual exposure is material. GetLatka
      separately says Palmetto has not published revenue and labels its $75 million annual figure
      as a Growjo estimate; that is not audited revenue evidence and leaves margin and liquidity
      risk unquantified.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR016]
    tableRefs: [TR002]
  - id: dependencies-and-thesis-breaks
    title: Partner, market, and thesis-break dependencies
    body: >-
      Palmetto depends on institutional capital, tax policy, partner installers, customer
      acquisition, and continued residential demand. Enact describes LightReach as a financing
      integration available through a software platform used by installers, while Palmetto's 2025
      release says its network includes more than 600 small and medium-sized businesses and
      enterprise partners; neither source discloses counterparty concentration or failure recovery.
      SEIA reports 2025 residential installations declined 2% from 2024 and identifies equipment
      shortages, delayed projects, trade actions, and policy uncertainty. Adverse customer-review
      evidence includes allegations of nonfunctional systems, delayed technicians, contract
      disputes, and unresolved refunds, but the review population and denominator are not known.
      Thesis-break triggers should therefore be measurable: a sustained rise in service backlog or
      system downtime, inability to renew or securitize portfolios on acceptable terms, loss of key
      installer or financing partners, adverse tax-credit or licensing outcomes, or customer
      economics below contract guarantees. Clay identifies Christopher Kemper as founder and CEO
      from 2010 to the present, creating a diligence need around succession and delegated operating
      authority; the source does not establish an actual continuity problem.
    claimRefs: [CR010, CR011, CR012, CR013, CR015]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Highest residual risk
    body: The largest unresolved exposure is not proof that Palmetto lacks demand; it is the absence of public cohort-level evidence linking financed residential deployments to production, service cost, customer retention, and cash generation.
    claimRefs: [CR007, CR008, CR009, CR013]
  - calloutType: assumption
    title: Monitoring trigger
    body: Treat any missed production-guarantee payment, material service backlog, partner failure, or securitization cost increase as a thesis review event until the company provides cohort-level reconciliations.
    claimRefs: [CR004, CR007, CR012]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule / case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Clean Electricity Investment Credit qualification and prohibited-foreign-entity limits", "United States", "Statutory framework applies to qualifying property; eligibility depends on facts", "medium", "high", "Map project eligibility and supply-chain provenance before underwriting", "High", "Obtain tax opinions and project-level qualification files"]
      - ["Residential contract transfer, production guarantee, and escalator obligations", "State-specific", "Public descriptions identify 25-year terms, 0%-3.5% escalators, and a 90% guarantee; contract terms vary", "medium", "high", "Standardize disclosures and service escalation", "High", "Sample executed agreements by state and test transfer, buyout, notice, and guarantee settlement"]
      - ["Installer licensing, consumer-credit, and litigation exposure", "State and federal", "Public review material describes nine federal dockets and a pending California license accusation; allegations are not findings", "medium", "high", "Verify each installer license, complaint, docket, and response", "High", "Commission counsel review of partner and marketing compliance"]
    notes: "Rows synthesize statutory text, market-policy evidence, and third-party complaint/court summaries; allegations and public counts are not adjudicated findings, and status varies by state and contract."
    enumerationScope:
      coverage: partial
      basis: "Publicly visible federal, statutory, and consumer-facing issues found in the assigned 2026 refresh pool; not a complete legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["System outage or delayed repair", "medium", "high", "Not publicly measurable", "High", "No public uptime, response-time, or warranty-cost denominator"]
      - ["Installation or permitting failure by partner", "medium", "high", "Partner model and licensing checks are described but not evidenced at portfolio scale", "High", "No complete partner quality or state exception dataset"]
      - ["Proposal, monitoring, or customer-support handoff failure", "medium", "high", "Software integration and monitoring are marketed; customer reports conflict", "High", "Need ticket aging, escalation, and customer-outcome cohorts"]
      - ["Asset performance below contract assumptions", "unknown", "high", "Performance guarantee is described but cohort outcomes are not public", "High", "Need production, degradation, guarantee-payment, and servicing data"]
    notes: "Likelihood and residual exposure are qualitative because public evidence lacks company-wide denominators; customer reviews are directional adverse signals rather than incident-rate estimates."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Institutional financing", "Morgan Stanley, Truist Bank, and other financial institutions", "Capital providers", "Not disclosed", "Funding or securitization becomes unavailable or more expensive", "high", "Maintain diversified capital sources and reserve capacity", "High"]
      - ["Installer and dealer network", "More than 600 partners reported by Palmetto", "Sales and fulfillment", "Not disclosed", "Partner quality or license failure creates customer and regulatory liability", "high", "Partner onboarding and license verification", "High"]
      - ["Software and asset-management integration", "Enact Solar", "Proposal and financing workflow", "Not disclosed", "Integration or data handoff failure slows sales or service", "medium", "Contractual interfaces and reconciliation controls", "Medium"]
      - ["Tax-credit and market-policy regime", "U.S. Treasury / IRS and state programs", "Economics and eligibility", "Systemic", "Policy or tariff change delays demand and project deployment", "high", "Scenario underwriting and project-level tax review", "High"]
    notes: "Counterparty names and partner counts come from public releases or partner material; concentration, exclusivity, contractual protections, and failure recovery are not disclosed."
    claimRefs: [CR005, CR008, CR009, CR010, CR011, CR012, CR015]
