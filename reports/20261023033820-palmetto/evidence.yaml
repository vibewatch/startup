evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, gross margin, cash flow, debt, liquidity, and revenue-recognition detail.
    whyItMatters: >-
      Financing volumes and third-party estimates cannot establish profitability, cash availability, or current
      valuation support.
    diligencePath: >-
      Request audited financial statements, management accounts, debt schedules, and a revenue-recognition memo under
      NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive, fiduciary board, capitalization, investor-rights, and succession records.
    whyItMatters: The public advisory roster does not reveal voting control, oversight quality, or key-person mitigants.
    diligencePath: >-
      Obtain the capitalization table, board list and minutes, investor-rights agreements, organization chart, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Verified customer count, retention, complaint denominator, uptime, production, service-response, and
      contract-asset cohorts.
    whyItMatters: >-
      Individual reviews and a complaint count identify risk but cannot quantify incidence, churn, asset performance, or
      unit economics.
    diligencePath: >-
      Request customer and asset cohorts by vintage, state, installer, financing product, complaint type, service time,
      and resolution.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: Authoritative incorporation date and current legal and principal operating headquarters.
    whyItMatters: Public profiles conflict on founding year and do not establish a current legal headquarters.
    diligencePath: Verify incorporation records, active state registrations, financing documents, and current company legal records.
    relatedQuestionRefs:
      - QO001
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      Eligible homes by state, qualified leads, approval rates, installation throughput, conversion and active contracts
      by channel.
    whyItMatters: >-
      Industry capacity and financing pools cannot be translated into Palmetto's current SAM, SOM or share without these
      denominators.
    diligencePath: >-
      Request the current state-level market model and funnel with definitions, vintages and reconciliations to
      installed cohorts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: financed-assets
    missingEvidence: Defaults, prepayments, transfers, disputes, servicing cost and net yield by origination cohort.
    whyItMatters: ABS issuance demonstrates financing access but not durable asset economics or cash available to the company.
    diligencePath: Review collateral tapes, trustee reports, cohort waterfalls and servicing agreements under NDA.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-trust
    missingEvidence: >-
      A normalized complaint, outage and repair-time rate using verified installed-system or active-customer
      denominators.
    whyItMatters: Raw reviews and complaint counts show issue types but cannot establish incidence or comparative service quality.
    diligencePath: Obtain complaint taxonomy, fleet uptime, response time and cancellation rates by state and cohort.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: comparative-evidence
    missingEvidence: >-
      Comparable current quotes, realized price, service-level outcomes, retention, and contribution-margin data for
      Palmetto and named peers.
    whyItMatters: >-
      Without controlled peer data, the apparent software, financing, and price advantages cannot be translated into
      durable competitive share or returns.
    diligencePath: >-
      Collect three standardized quotes and contract packs per target state, then benchmark installation, service,
      transfer, and unit-economics outcomes.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: partner-installation
    missingEvidence: Partner-level installer quality, defect, response-time, and geographic concentration data.
    whyItMatters: The partner model can expand coverage while making the customer experience and moat dependent on local execution.
    diligencePath: >-
      Request partner scorecards, complaint cohorts, service tickets, repeat-visit rates, and state-level concentration
      from management.
    relatedQuestionRefs:
      - QP002
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: corporate-financials
    missingEvidence: Audited revenue, gross margin, cash flow, unrestricted cash, and a complete corporate debt schedule.
    whyItMatters: >-
      Without these inputs, corporate profitability, runway, financing dependency, and the next-round trigger cannot be
      calculated.
    diligencePath: >-
      Request audited statements, monthly management accounts, bank balances, debt maturities, borrowing-base reports,
      and covenant certificates.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: cohort-economics
    missingEvidence: >-
      Contract-level payment, production, default, cancellation, transfer, servicing-cost, and guarantee-payment data by
      vintage.
    whyItMatters: >-
      Securitization volume demonstrates financing access but does not establish asset quality, cash yield, loss
      behavior, or corporate margin.
    diligencePath: >-
      Request a cohort tape and reconcile it to collections, reserve accounts, financing waterfalls, servicing expenses,
      and guarantee claims.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
