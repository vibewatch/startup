    notes: "Units, periods and denominators remain source-specific; no row is converted into TAM, SAM, SOM, revenue or cash."
    claimRefs: [CM002, CM003, CM007, CM008]
  - id: TM003
    title: Segment, buyer and adoption map
    columns: [segment, buyer, user, payer, workflow, budget_owner, adoption_trigger]
    rows:
      - [LightReach lease or PPA, Homeowner, Household, "Household payments plus third-party asset capital", "Qualify, contract, finance, install, interconnect, service", "Household energy budget and asset underwriter", "Lower upfront cash requirement"]
      - [Customer-owned rooftop solar, Homeowner, Household, Homeowner, "Quote, cash or loan, install, interconnect", "Household capital budget or lender", "Ownership and long-term bill savings"]
      - [Residential storage bundle, Homeowner, Household, "Homeowner or third-party owner", "Size load, bundle, install, operate", "Household resilience budget and underwriter", "Backup power and time-of-use management"]
      - [Dealer or local installer channel, "Dealer / installer", Household, "Platform or channel economics", "Originate, design, permit and install", "Partner operating budget", "Lead flow and workflow software"]
      - [Institutional asset capital, "Bank or capital provider", Household indirectly, "Capital provider funds asset pool", "Underwrite, fund, securitize and monitor", "Institutional investment allocation", "Contracted residential cash flows"]
    notes: "The workflow is an evidence-constrained operating map; conversion rates, underwriting cutoffs and channel economics are not public."
    claimRefs: [CM005, CM006, CM009, CM010]
