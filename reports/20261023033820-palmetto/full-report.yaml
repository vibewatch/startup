  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is U.S. residential distributed energy, with third-party-owned rooftop solar and
              storage at the core and EV charging, HVAC and home energy management as adjacencies. Palmetto describes
              LightReach as a lease or PPA product, while its platform also connects households with installers,
              financing and post-install monitoring. Commercial, community and utility-scale solar are excluded from the
              core boundary because their buyers, project sizes, interconnection paths and budgets differ.
              Customer-owned cash or loan purchases are close substitutes, as are utility service and, where available,
              community-solar subscriptions. This definition avoids treating every solar installation or global
              renewable-energy dollar as addressable to Palmetto. It also makes contract duration, financing
              eligibility, roof suitability and installer coverage part of the serviceable market rather than
              post-sizing adjustments.
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports multiple sizing lenses, not an additive TAM calculation. SEIA and Wood
              Mackenzie's Q4 2024 report recorded 1,128 MWdc of U.S. residential installations in Q3 2024, down 39% year
              over year, and forecast a 26% full-year contraction. Its then-current outlook expected more than 6 GWdc in
              2025, 21% growth that year and 18% in 2026; these are historical forecasts, not verified 2025 or 2026
              actuals. Palmetto-specific scale is visible through a $420 million October 2025 securitization backed by
              22,188 residential PPAs and leases and more than $716 million of 2025 ABS issuance. The January 2025
              company release separately claimed more than 20,000 LightReach households and average adoption on track
              for 300 households per day. Contract counts, issuance values, deployment capacity and revenue estimates
              have different periods and denominators; none is interchangeable with revenue, ARR, cash available, market
              share or a current serviceable obtainable market.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer, user, payer and adoption path
        blocks:
          - type: paragraph
            body: >-
              The homeowner is the buyer and household user, but the economic payer structure is split. Under
              LightReach, institutional capital funds a company-owned system while the household makes contracted lease
              or PPA payments; Palmetto's company-issued release marketed zero upfront investment and stable monthly
              payments. Dealers and local installers are channel participants rather than the end buyer, and capital
              providers underwrite the asset pool rather than household electricity demand. The adoption path therefore
              requires lead generation, household and site qualification, contracting, financing approval, design,
              permitting, installation, utility permission to operate and long-term servicing. A home sale introduces
              another decision point because the retained contract review describes transfer, prepayment or a later
              fair-market-value buyout. This multi-party path expands distribution but makes conversion and customer
              experience dependent on parties Palmetto does not fully control.
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
      - number: '2.4'
        title: Drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Third-party ownership can reduce the upfront cash barrier, and the Q4 2024 market outlook identified this
              structure as a residential recovery driver. The same evidence attributed the 2024 decline to elevated
              rates and customer uncertainty, while installer and financier bankruptcies created orphaned projects.
              Broader adoption also depends on labor, equipment and interconnection capacity; the IEA's Renewables 2024
              scope treats grid queues and system integration as barriers to faster renewable expansion. Trust is a
              separate constraint. A September 2026 commercial review of public records reported 340 BBB complaints in
              three years, including 148 service or repair issues, but explicitly noted that the count lacks a customer
              denominator and is not a finding. SolarReviews contains both positive accounts and reports of outages or
              weak post-install support, so it demonstrates issue types rather than incidence. Valuation should
              therefore be tied to financed-cohort performance, conversion, service cost and durable state-level share,
              all of which remain unavailable in the assigned evidence.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale evidence is not market share
            body: >-
              Palmetto's financed contract pools show capital-market access and deployment volume, but they do not
              disclose eligible-home penetration, conversion, cohort economics or durable share.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM015
          - type: callout
            title: Trust can narrow the serviceable market
            body: >-
              Long contract terms, transfers, multi-party installation and reported service issues can slow adoption
              even where the underlying household economics appear attractive.
            calloutType: risk
            claimRefs:
