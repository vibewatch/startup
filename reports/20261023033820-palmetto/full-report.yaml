  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Palmetto's customer journey runs from homeowner demand through partner delivery, financing, activation, and
      recurring service.
    data:
      items:
        - id: UJ001
          label: Discover
          title: Discover
          description: Homeowner seeks solar, storage, or electrification savings.
          touchpoints:
            - Online assessment
            - Partner or brand acquisition
        - id: UJ002
          label: Configure
          title: Configure
          description: Palmetto and partners estimate system design, price, and financing.
          touchpoints:
            - Energy assessment
            - Quote and plan selection
        - id: UJ003
          label: Contract
          title: Contract
          description: Customer chooses a LightReach lease or power-purchase structure where available.
          touchpoints:
            - Monthly-payment plan
            - Third-party financing ecosystem
        - id: UJ004
          label: Install
          title: Install
          description: Local installers deliver the system through Palmetto's marketplace workflow.
          touchpoints:
            - Permitting
            - Installation and utility approval
        - id: UJ005
          label: Activate
          title: Activate
          description: The system begins producing energy and the customer enters the service period.
          touchpoints:
            - Monitoring
            - Production measurement
        - id: UJ006
          label: Retain or expand
          title: Retain or expand
          description: Durability depends on production, service response, payment performance, and transfer options.
          touchpoints:
            - Maintenance
            - Home sale transfer
            - Additional storage or electrification
    approximationNotes: >-
      Stages are an analytical representation of the workflow described by assigned sources; no conversion rate or stage
      volume is implied.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU010
      - CU013
