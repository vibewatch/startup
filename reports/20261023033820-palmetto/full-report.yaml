  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Palmetto is positioned as software- and financing-oriented, with service consistency constrained by partner
      execution; alternatives occupy different combinations of integration and local accountability.
    data:
      xAxis: Financing and workflow breadth
      yAxis: Installation and service control
      points:
        - label: Palmetto
          x: 4
          'y': 2
          rationale: >-
            Multiple financing paths and coordinated workflow are documented; local partner execution lowers direct
            control.
        - label: Sunrun
          x: 4
          'y': 3
          rationale: >-
            Named as a larger national alternative; exact current control and pricing are not established in assigned
            sources.
        - label: Tesla Solar
          x: 2
          'y': 2
          rationale: Purchase-focused and potentially lower published price; comparable service evidence is not established.
        - label: Local installer
          x: 2
          'y': 4
          rationale: Local accountability can be strong, but financing and workflow breadth vary by provider.
        - label: Utility status quo
          x: 1
          'y': 5
          rationale: No installation workflow or financing complexity, but no onsite generation or system service.
        - label: Internal build
          x: 3
          'y': 1
          rationale: Can control vendor choices but requires internal financing and operational capabilities.
    approximationNotes: >-
      Ordinal coordinates are analyst synthesis from the cited capability evidence, not measured market scores; points
      preserve uncertainty where peer-specific evidence is absent.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP010
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The public model converts homeowner demand into long-duration payments through origination, third-party asset
      funding, installation, and servicing.
    data:
      nodes:
        - id: homeowner-demand
          label: Homeowner demand
          detail: Customer acquisition and energy assessment; channel economics are undisclosed
        - id: origination
          label: System origination
          detail: Design, permitting, installer coordination, and fulfillment
        - id: asset-funding
          label: LightReach asset funding
          detail: Institutional capital supports a zero-upfront lease or PPA structure
        - id: operating-asset
          label: Residential energy asset
          detail: Third-party-owned system produces power under a long-term customer agreement
        - id: customer-payments
          label: Customer payments
          detail: Monthly lease payment or rate-per-kWh mechanism; realized pricing is undisclosed
        - id: servicing-capital-markets
          label: Servicing and capital markets
          detail: Collections, maintenance, guarantees, reserves, and potential securitization
    approximationNotes: >-
