        title: Exhibits
        blocks:
          - type: callout
            title: Capital-market access is an operating advantage
            body: >-
              Two reported 2025 ABS transactions totaling more than $716 million indicate repeat institutional access,
              but the amount represents asset-backed issuance rather than corporate revenue or unrestricted cash.
            calloutType: strength
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Cohort economics remain the core blocker
            body: >-
              No assigned source provides cash, burn, gross margin, acquisition payback, asset defaults, or servicing
              cost by vintage, preventing a reliable margin or runway judgment.
            calloutType: risk
            claimRefs:
