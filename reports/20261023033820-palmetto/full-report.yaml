  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Financing evidence supports platform relevance, while valuation and operating gaps constrain the investment call.
    data:
      nodes:
        - id: scale
          label: 22,188 PPAs and leases backed 2025 ABS
          note: Asset collateral, not equity value.
        - id: capital
          label: Institutional financing access
          note: 2025 ABS issuance and 2023 TPG investment are distinct transactions.
        - id: gaps
          label: Current price and cohort economics unavailable
          note: Revenue quality, margin, losses, preferences, and dilution remain unresolved.
        - id: downside
          label: Service and contract-performance downside
          note: Independent accounts are adverse signals, not portfolio statistics.
        - id: decision
          label: Research-more with strict entry discipline
          note: Require current cap table, audited economics, and cohort data.
        - id: price
          label: Price only after reconciliation
          note: A historical private mark is not a current transaction price.
      edges:
        - from: scale
          to: capital
        - from: capital
          to: gaps
        - from: gaps
          to: downside
        - from: downside
          to: decision
        - from: decision
          to: price
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV012
      - CV015
