              - CE007
              - CE008
              - CE010
              - CE015
      - number: '5.3'
        title: Reliability, support, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Product risk is concentrated after sale. Palmetto's own described plan includes long-duration service and
              performance commitments, while independent review pages contain both positive installation accounts and
              adverse reports of systems offline, delayed repairs, monitoring failures, unresolved billing disputes, and
              difficulty obtaining support. These are customer accounts, not a statistically representative failure
              rate, and they do not prove that every installation is defective. They do show that service responsiveness
              and partner accountability are central diligence questions for a product whose economics and customer
              trust depend on years of operation. A cancellation guide likewise describes a model involving local
              subcontractors, third-party lenders, project management, and monitoring, which increases the number of
              parties needed to remediate an issue. Before underwriting technical maturity, request component-level
              warranties, outage and ticket data, service-level commitments, installer quality controls, cybersecurity
              and privacy documentation, and cohort-level performance against contractual guarantees.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Product verdict and open evidence
        blocks:
          - type: paragraph
            body: >-
              Palmetto appears to have meaningful product breadth and a scalable operating concept, but public evidence
              is stronger for the commercial story than for the underlying technical controls. The company can point to
              a large financing program and a software-driven operating model, yet the assigned evidence does not
              establish software reliability, integration depth, incident rates, customer retention, or consistent
              partner execution. The product is consequently best viewed as an integrated service-and-finance system
              with technology-enabled operations, not as a transparently verifiable software moat. The highest-value
              diligence is operational: obtain anonymized installation and service cohorts, production-versus-estimate
              data, unresolved-ticket aging, installer defect rates, partner concentration, security attestations, and
              the exact contractual owner of monitoring, maintenance, and performance remediation. Evidence quality is
              also uneven: GetLatka relies on an external revenue estimate, while the fetched Nasdaq Private Market
              snapshot supplies no Palmetto-specific product detail.
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product thesis
            body: >-
              Palmetto's apparent differentiation is the coordination of customer acquisition, project execution,
              financing, and long-term asset servicing; public materials do not yet prove that the software layer itself
              is difficult to replicate.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE008
          - type: callout
            title: Reliability diligence
            body: >-
              The most material product risk is not whether panels or batteries exist, but whether Palmetto and its
              partner network can monitor, repair, and communicate about distributed assets over a multi-decade
              contract.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying structure
        blocks:
          - type: paragraph
            body: >-
              Palmetto primarily serves residential homeowners seeking solar, storage, and broader electrification,
              while also supplying a platform to local installers, dealers, and enterprise brands. Rust Belt Industrials
              describes a marketplace connecting homeowners in more than 25 U.S. states with vetted local installers,
              and the company's 2022 operating-platform release says co-branded sales and fulfillment systems were
              designed for consumer and enterprise brands. The customer is therefore not a single buyer: the homeowner
              is the end user and payer, the installer or dealer is an acquisition and delivery channel, and financing
              institutions support the LightReach asset-backed plan. Public sources do not disclose segment-level
              revenue, active-account counts by state, or the share of direct versus partner-originated demand. Latka
              explicitly labels its $75 million 2025 revenue figure as a Growjo estimate rather than company-reported
              revenue, so it cannot establish customer economics. A separate contract-exit guide also describes Palmetto
              as a marketplace rather than a traditional installer, reinforcing the need to separate the roles of
              seller, installer, lender, and service provider during diligence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption datum is Mercom's report that more than 20,000 households had adopted solar
              through LightReach lease or power-purchase plans by January 2025. That is a cumulative household figure,
              not an active-customer or retention measure, and it is not accompanied by cohort, geography, utilization,
              cancellation, or revenue denominators. The same source describes the plans as beginning near the end of
              2023, while Tracxn records 278 employees as of December 31, 2024 and a 2025 debt round, providing context
              for scale but not customer durability. Publicly named deployments are sparse: the available evidence
              supports a broad household adoption count and a marketplace model, but does not identify three
              independently verified production customers with measured outcomes. This limits confidence in expansion
              and reference quality.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU010
              - CU013
      - number: '6.3'
        title: Retention, service durability, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Palmetto does not publicly report NRR, GRR, churn, renewal rates, contract length by cohort, or
              service-response performance. Reviews provide directional evidence rather than a statistically
              representative retention dataset. Solar Reviews includes both positive installation accounts and
              complaints about systems remaining offline, delayed callbacks, and customers paying while systems were not
              producing. A separate review summary counted 340 complaints in three years, with 148 categorized as
              service or repair, while explicitly warning that the count is not adjusted for the customer base. These
              signals make post-sale service, subcontractor execution, and transfer or financing friction material
              diligence items. The company also does not disclose top-partner, top-state, or top-account concentration,
              so scale cannot yet be translated into durable customer economics.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence of scaled residential adoption
            body: >-
              More than 20,000 households were reported as adopting LightReach solar lease or power-purchase plans by
              January 2025, but the figure is cumulative and company-linked rather than a retention or active-use
              metric.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Durability is not proven by logos or installations
            body: >-
              Public evidence lacks cohort retention and concentration data, while review sources describe both
              successful installations and recurring service failures; diligence should obtain cohort-level production,
              complaint, cancellation, and response-time data.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Palmetto's residential model is exposed to changing tax-credit eligibility, contractor and partner
              licensing, consumer-credit obligations, and contract-transfer requirements. The statutory framework is not
              a simple tailwind: the Clean Electricity Investment Credit applies to qualified facilities and storage
              placed in service after December 31, 2024, while the statute also contains eligibility limits,
              foreign-entity restrictions, recapture provisions, and an exclusion for certain leased property. SEIA's
              2025 market review describes policy uncertainty, tariff investigations, permitting actions, and tax-credit
              qualification uncertainty as drivers of delays and cancellations. Consumer-facing review material also
              describes a company-owned 25-year Energy Plan with transfer, buyout, and notice mechanics that may create
              dispute and compliance risk. The diligence priority is to reconcile each state, installer, contract form,
              and tax-credit assumption rather than treating a national product description as a uniform legal posture.
              One allocated ConsumerAffairs page did not yield Palmetto-specific evidence in the prefetched body, only
              platform disclosures, so it is retained as a source-access limitation rather than used to offset the
              adverse record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
              - CR010
              - CR012
      - number: '7.2'
        title: Operating reliability and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The operating risk is concentrated in the handoff between Palmetto, partner installers, equipment vendors,
              utilities, and financing counterparties. A partner announcement says Enact integration was intended to
              streamline proposals and supports solar, storage, and HVAC financing, but it does not establish completed
              deployment quality or service-level performance. SolarReviews contains customer accounts of systems
              offline for months, delayed responses, incomplete work, and continued payments; these are individual
              reports, not a verified incident rate. Palmetto's capital structure adds model risk: the company disclosed
              more than $1.2 billion of capital for 2024 and 2025 LightReach plans, while PV Magazine reported a $420
              million securitization backed by 22,188 leases and PPAs. Those figures evidence financing scale, not cash
              available, profitability, default performance, or servicing economics. Until cohort-level production,
              cancellations, delinquency, warranty cost, and partner performance are disclosed, residual exposure is
              material. GetLatka separately says Palmetto has not published revenue and labels its $75 million annual
              figure as a Growjo estimate; that is not audited revenue evidence and leaves margin and liquidity risk
              unquantified.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner, market, and thesis-break dependencies
        blocks:
          - type: paragraph
            body: >-
              Palmetto depends on institutional capital, tax policy, partner installers, customer acquisition, and
              continued residential demand. Enact describes LightReach as a financing integration available through a
              software platform used by installers, while Palmetto's 2025 release says its network includes more than
              600 small and medium-sized businesses and enterprise partners; neither source discloses counterparty
              concentration or failure recovery. SEIA reports 2025 residential installations declined 2% from 2024 and
              identifies equipment shortages, delayed projects, trade actions, and policy uncertainty. Adverse
              customer-review evidence includes allegations of nonfunctional systems, delayed technicians, contract
              disputes, and unresolved refunds, but the review population and denominator are not known. Thesis-break
              triggers should therefore be measurable: a sustained rise in service backlog or system downtime, inability
              to renew or securitize portfolios on acceptable terms, loss of key installer or financing partners,
              adverse tax-credit or licensing outcomes, or customer economics below contract guarantees. Clay identifies
              Christopher Kemper as founder and CEO from 2010 to the present, creating a diligence need around
              succession and delegated operating authority; the source does not establish an actual continuity problem.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual risk
            body: >-
              The largest unresolved exposure is not proof that Palmetto lacks demand; it is the absence of public
              cohort-level evidence linking financed residential deployments to production, service cost, customer
              retention, and cash generation.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR013
          - type: callout
            title: Monitoring trigger
            body: >-
              Treat any missed production-guarantee payment, material service backlog, partner failure, or
              securitization cost increase as a thesis review event until the company provides cohort-level
              reconciliations.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              Palmetto has evidence of financing-market access, including a $420 million 2025 securitization backed by
              22,188 residential solar PPAs and leases and a separately reported $150 million 2023 investment from TPG
              Rise Climate. Those transactions demonstrate capital availability for the asset platform, not cash
              available to common equity or a current equity valuation. Forge records a $1.01 billion post-money
              valuation for the February 2022 Series C and explicitly warns that its data may rely on limited inputs and
              is not a market price. A separate data profile estimates 2025 revenue at $75 million and labels it an
              estimate, while also reporting a 2022 $1 billion valuation. Because revenue recognition, gross margin,
              portfolio loss performance, cap-table preferences, and current secondary pricing are not public in the
              assigned evidence, a precise multiple or target return would be false precision. The recommendation is
              research-more; proceed only after obtaining current capitalization and cohort economics, and require a
              materially better price or stronger evidence before underwriting a buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Palmetto has assembled a financing-enabled residential energy platform with
              repeat access to structured capital and a product model that can aggregate long-lived customer contracts.
              The 2025 ABS disclosures identify 22,188 PPAs and leases as collateral and describe a software-driven
              origination and servicing platform. The anti-thesis is that capital-market access can coexist with weak
              unit economics, customer-performance disputes, or financing dependence; independent consumer evidence
              includes reports of systems being offline, delayed service, and unresolved payment or installation issues.
              The complaint evidence is anecdotal and not a portfolio default statistic, but it is directly relevant to
              servicing cost, retention, and liability diligence. Public comparable evidence is thin; Caplight lists
              LGCY Power, Schneider Electric, and Powur as similarity comparables without public valuation outputs for
              Palmetto, while Sunrun's public market capitalization was $1.85 billion on October 22, 2026 after a
              reported 60.96% decline in 2026. Sunrun is a different public company and is not a direct valuation
              multiple for Palmetto.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
      - number: '8.3'
        title: Scenarios, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be treated as a decision framework, not a forecast. The bull case requires
              verified portfolio performance, repeat securitization capacity, improving service outcomes, and a current
              equity price below a supportable value after preference and dilution adjustments. The base case assumes
              financing access continues but public operating data remains incomplete, so an investor tracks rather than
              pays for modeled growth. The bear case is triggered by securitization disruption, rising defaults or
              service liabilities, weak customer savings, or a down-round that resets the 2022 private mark. Consumer
              review evidence includes a claim that one system was non-functional for five of nine months and separate
              reports of continuing payments alongside unresolved service problems; these are individual accounts, not
              proof of portfolio-wide failure. Exit readiness is therefore conditional; management should provide
              audited financials, cohort-level contract performance, current cap table and preference terms, debt and
              securitization covenants, customer concentration, complaint and service metrics, and an updated financing
              or secondary mark. A thesis break is failure to reconcile those data with the $1 billion reference
              valuation or to demonstrate durable access to capital on acceptable terms.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Valuation evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate historical financing observations, uncertain private-market marks, public comparable
              context, and downside signals. Values retain their source period and qualification; no revenue, ARR,
              funding, or asset-backed issuance figure is treated as interchangeable with equity value or cash on hand.
              The recommendation therefore turns on evidence that can be refreshed and audited rather than on a stale
              headline mark. Financing access is a useful operating signal, but it is not a substitute for tracing
              contract cash flows, servicing obligations, investor seniority, and the price actually available to a new
              investor.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV010
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not unconditional buy
            body: >-
              Palmetto's financing access is credible, but public evidence does not establish a current equity price or
              risk-adjusted return. Obtain current cap-table, cohort, margin, and servicing evidence before
              underwriting.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV015
          - type: callout
            title: Asset financing is not equity liquidity
            body: >-
              ABS issuance is backed by customer contracts and can fund operations, but it does not by itself show cash
              available to common equity or remove dilution and preference risk.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
          - type: callout
            title: Scenario values remain qualitative
            body: >-
              No defensible numeric valuation range is presented because audited revenue, gross margin, cohort loss
              data, current private pricing, and cap-table terms are not in the assigned evidence.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
              - CV014
