  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer product and operating model
        blocks:
          - type: paragraph
            body: >-
              Palmetto's customer proposition is not a single hardware product. Public descriptions characterize an
              end-to-end residential clean-energy workflow that combines sales, design, engineering, permitting,
              fulfillment, financing, installation coordination, monitoring, and maintenance. The product set spans
              solar, storage, EV charging, heat pumps, and related home-electrification tools, while the consumer Energy
              Plan can be structured as a lease or power-purchase agreement. The platform therefore sits between
              homeowner, financing counterparty, local installer, utility, and long-lived asset owner. That can lower
              upfront friction and broaden distribution, but it also creates handoff risk: the party selling the plan
              may be a partner, installation may be subcontracted, and service quality depends on coordination across
              the network. The public record does not establish module-level adoption, software usage, or realized
              performance across the installed base.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
      - number: '5.2'
        title: Architecture, maturity, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is best understood as a workflow and asset-servicing stack rather than a
              documented proprietary hardware stack. Palmetto describes software-driven origination and servicing,
              automated workflows, predictive algorithms, local intelligence data, and a consumer marketplace connected
              to financing and capital-markets infrastructure. Its 2025 securitization disclosure also describes a pool
              of residential PPAs and leases and references time-of-use and grid-services programs. These materials
              indicate operational integration across demand generation, underwriting or financing, project execution,
              and ongoing asset monitoring. They do not disclose APIs, software architecture, model validation, uptime,
              cybersecurity controls, component specifications, manufacturing ownership, or independently measured
              installation cycle times. The defensible advantage may therefore be process data, partner access,
              servicing operations, and financing execution, but that hypothesis needs technical and portfolio evidence
              rather than marketing language.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
