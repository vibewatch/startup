  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and operating model
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a broad landscape rather than a single peer set. Palmetto's original platform
              description connected homeowners with financing, installers, and monitoring software, while current review
              sources describe a design-and-paperwork layer that dispatches local installation partners. That creates
              direct competition with national installers such as Sunrun, purchase-focused Tesla Solar, regional
              installer networks, and local contractors; it also competes with the status quo of staying on utility
              power or building an internal procurement process. The 2025 securitization evidence shows that Palmetto
              also competes for institutional capital and asset-finance capacity, not only homeowner demand. These
              layers make “competitor” a job-to-be-done comparison: acquisition, system delivery, financing, monitoring,
              and post-install service can each be won by a different provider.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
