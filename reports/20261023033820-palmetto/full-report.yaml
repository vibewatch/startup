  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Palmetto is described as a platform rather than a panel manufacturer: it combines customer acquisition,
              energy modeling, financing, installer coordination, and long-term system management. LightReach is
              reported as a lease and power-purchase-agreement platform that removes the upfront system payment while a
              third party owns the asset and the homeowner makes predictable monthly payments. That model can produce
              long-duration contractual cash flows, while the marketplace, software, and energy-intelligence activities
              may add other monetization paths. Public evidence does not disaggregate realized revenue among those
              streams or explain revenue recognition. GetLatka explicitly says Palmetto has not published revenue and
              presents a roughly $75 million estimate for 2025, so that figure is a scale proxy rather than ARR, audited
              revenue, or cash.
            claimRefs:
