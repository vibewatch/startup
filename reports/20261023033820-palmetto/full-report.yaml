      - number: '4.3'
        title: Capital access and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Palmetto has credible evidence of financing access. A company-issued release syndicated by Yahoo Finance
              and independent PV Magazine reporting describe a $420 million October 2025 securitization backed by 22,188
              residential PPAs and leases; together with an approximately $286 million April issuance, reported 2025
              term ABS issuance exceeded $716 million. Separate reporting describes $1.2 billion of investment
              supporting LightReach and a $150 million 2023 TPG Rise Climate investment. These amounts have different
              purposes and cannot be added as corporate funding, revenue, or cash available. Securitization proceeds,
              warehouse capacity, tax equity, asset-level debt, and corporate growth capital carry different recourse,
              reserve, covenant, and cash-flow implications. The round-by-round corporate funding chronology belongs in
              Company Overview; the financial question here is how much unrestricted liquidity remains after asset
              funding and obligations.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is research-more. Repeat institutional access is a strength because it supports
              origination and demonstrates capital-market demand for pools of residential contracts. It does not
              establish positive corporate cash flow, durable gross margin, or adequate runway. Underwriting requires
              audited or management financial statements; a bridge from contract billings to recognized revenue and
              cash; unrestricted cash and monthly burn; all warehouse, debt, tax-equity, and securitization obligations;
              and a vintage-level cohort tape covering production, collections, defaults, cancellations, transfers,
              service costs, and guarantee payments. The public complaint count and service allegations increase the
              importance of reconciling support performance to cash collections and reserves, but neither source
              supplies a denominator or quantifies the financial impact. Until those private inputs are verified, margin
              path, capital adequacy, and next-round timing remain material blockers rather than forecastable outputs.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
