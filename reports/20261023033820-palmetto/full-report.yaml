      - number: '3.3'
        title: Moat durability, service risk, and displacement
        blocks:
          - type: paragraph
            body: >-
              The most defensible moat is operational coordination around complex local workflows plus access to
              financing and long-duration solar assets. The 2025 ABS transaction, backed by 22,188 residential leases
              and PPAs, demonstrates financing access and an installed asset base, but it does not prove superior unit
              economics or customer retention. The same partner model that expands coverage can weaken consistency:
              review sources report mixed service outcomes, and a current complaint analysis says service or repair
              issues were the largest category in its dated BBB count. This is adverse evidence about execution, not
              proof of systemic failure. Larger integrated providers can compete on brand, scale, or owned crews, while
              Tesla and local installers can compete on purchase economics or local trust. Durability therefore depends
              on measured service levels, partner quality control, asset performance, and transfer economics that are
              not fully public.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Core competitive thesis
            body: >-
              Palmetto's platform and financing coordination are meaningful differentiators, but the
              partner-installation and long-contract model makes local service execution the key durability test.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
              - CP014
          - type: callout
            title: Evidence limit
            body: >-
              Public sources do not provide a controlled, apples-to-apples benchmark for Palmetto versus named peers on
              realized price, retention, installation defect rates, or contribution margin.
            calloutType: risk
            claimRefs:
