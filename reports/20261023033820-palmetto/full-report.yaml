      - number: '3.2'
        title: Buyer-facing differentiation and trade-offs
        blocks:
          - type: paragraph
            body: >-
              Palmetto's buyer-facing proposition is flexibility: cash purchase, loan, lease, and PPA paths; an
              app-driven process; and optional monitoring and protection services. Independent review material
              consistently frames the trade-off as convenience and financing choice versus dependence on the assigned
              local installer and the quality of post-sale support. The price evidence is directional rather than a
              controlled quote benchmark: one review estimates roughly $2.50–$3.50 per watt before incentives and
              another places Palmetto at $2.70–$3.40 per watt. These should not be treated as realized pricing or a
              universal offer. A customer comparing Palmetto with Sunrun, Tesla, or a local installer should normalize
              dollars per watt, ownership, escalators, warranty scope, installer identity, and transfer terms rather
              than comparing headline monthly payments.
