callouts:
  - calloutType: "risk"
    title: "Capital Structure Risk: The 17.5% Guaranteed Yield Hurdle"
    body: "DeployCo's $4 billion capitalization differs fundamentally from conventional venture financing. By guaranteeing syndicate investors a minimum 17.5% annual return over five years with capped profit participation, the structure functions like high-yield senior debt. Servicing approximately $700 million in annual return hurdles puts immediate pressure on cash generation, leaving common equity vulnerable if services engagements cannot be converted into high-margin software revenues."
    claimRefs:
      - "CV004"
      - "CV005"
  - calloutType: "insight"
    title: "The Scale Asymmetry: 150 Engineers vs. Accenture's 700,000"
    body: "While DeployCo's valuation of $14 billion post-money reflects immense enthusiasm for frontier AI deployment, its physical delivery capacity on day one is constrained to roughly 150 forward-deployed engineers. With Accenture deploying over 85,000 AI and data professionals, enterprise buyers seeking multi-model architectures and complex systems legacy integration will continue utilizing incumbent integrators, limiting DeployCo to flagship transformation accounts."
    claimRefs:
      - "CV002"
      - "CV006"
