      - number: '1.4'
        title: 运营规模、里程碑与企业部署瓶颈
        blocks:
          - type: paragraph
            body: >-
              DeployCo 的运营时间线展现了企业人工智能实施如何从精品咨询快速演变为机构化部署 [CO001, CO008]。 组织源于 Tomoro 于 2023 年 5 月与 OpenAI 合作成立的业务，并在
              2026 年 5 月正式收购前，为早期企业客户扩充了交付能力 [CO008, CO009]。 这笔交易在首日把约 150 名经验丰富的前线部署工程师和部署专家整合进 DeployCo [CO009]。
              早期企业案例显示出大规模运营落地，包括 BBVA 覆盖 120,000 名员工的全球部署，以及 John Deere 的农业决策支持系统 [CO014]。 但 DeployCo 仍面临严重的运营摩擦和结构性阻力
              [CO011, CO012]。 行业内部基准显示，超过 70% 的企业 AI 试点项目因工作流摩擦、数据碎片化和监管阻力而无法进入生产 [CO011]。 此外，企业软件买家和开发者越来越担心专有厂商锁定，因为深度
              FDE 集成会把 OpenAI 的模型栈直接嵌入企业核心基础设施 [CO012]。
            claimRefs:
