  - id: FE001
    title: 产品架构图
    type: stack
    summary: 通过嵌入式 FDE 小组和 Agent SDK 运行时，将企业记录系统连接至 OpenAI 前沿智能的六层架构栈。
    data:
      layers:
        - label: 第 1 层：企业记录系统
          detail: 传统企业数据存储、ERP / CRM 平台、数据仓库和安全内部文档库。
          modules:
            - SAP / Salesforce / Oracle ERP 集成连接器
            - 关系型与对象数据库（PostgreSQL、Snowflake、S3）
            - 企业身份验证与基于角色的访问控制（RBAC）
        - label: 第 2 层：企业数据摄取与 RAG 管线
          detail: 语义索引、向量嵌入生成、检索增强生成引擎和实时数据清洗。
          modules:
            - 分块与向量嵌入摄取管线
            - 低延迟混合关键词-语义检索引擎
            - 特定领域数据清洗与 Token 规范化
        - label: 第 3 层：治理、信任与安全边界
          detail: 企业合规框架、数据驻留边界、基础安全过滤器和审计轨迹日志。
          modules:
            - HIPAA、GDPR 与金融服务合规执行
            - 自动输出删减与敏感数据匿名化
            - 运营审计日志与请求-响应可追溯性
        - label: 第 4 层：前沿基础模型与定制微调
          detail: 直接访问 OpenAI 前沿模型（GPT-4o、o 系列推理、GPT-5 路线图），并进行特定领域微调。
          modules:
            - 直接访问前沿模型检查点与权重
            - 专有企业微调与适配器优化
            - 推理与推断优化运行时
        - label: 第 5 层：前置部署工程（FDE）运营小组
          detail: 跨职能工程小组（Tomoro 团队）嵌入客户团队，执行构建-验证-泛化循环。
          modules:
