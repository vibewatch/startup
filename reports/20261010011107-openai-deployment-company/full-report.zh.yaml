        title: 展示
        blocks:
          - type: callout
            title: 渠道去中介化与咨询伙伴摩擦
            body: >-
              DeployCo 与 McKinsey、Bain 及 Capgemini 组成的创始联盟掩盖了一场不可避免的商业冲突：DeployCo 从基础 AI
              评估扩展到数百万美元级别的工作流重构后，将直接争夺其共同投资者自身数字化转型业务的核心高利润空间。
            calloutType: risk
            claimRefs:
              - CR008
          - type: callout
            title: 前沿模型锁定与云迁移摩擦
            body: DeployCo 将客户工作流架构与 OpenAI 专有模型权重及开发路线图紧密绑定，筑起很高的迁移壁垒，压缩客户采用多模型的选择空间，也让企业暴露于单一供应商的定价和可用性风险之下。
            calloutType: risk
            claimRefs:
              - CR009
