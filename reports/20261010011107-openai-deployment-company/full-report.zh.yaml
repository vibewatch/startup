      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双重摩擦：保证收益负担与企业试点失败率
            body: >-
              DeployCo 的商业模式在资本承诺与市场现实之间存在即时的结构性张力。要为 $4B+ 承诺资本支付 17.5% 的保证年化收益，公司必须产生可观的高毛利现金流；与此同时，行业数据显示 70% 至 80%
