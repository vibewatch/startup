            - 定制评估工具集与准确率基准测试
            - 定制系统原型开发与运营试点部署
        - label: 第 6 层：工作流嵌入式应用与 Agent SDK
          detail: 终端用户运营界面、自动化多步骤工作流、代理式决策系统和生产漂移遥测。
          modules:
