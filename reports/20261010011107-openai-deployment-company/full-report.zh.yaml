  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、服务交付层级与运营模式
        blocks:
          - type: paragraph
            body: >-
              OpenAI Deployment Company 以 DeployCo 商业化运营，代表一种把企业生成式 AI 从试验性概念验证项目推进到生产基础设施的运营转型模式 [CE001]。 DeployCo
              不授权拆分的模型 API，也不提供通用软件订阅，而是通过专门的前线部署工程（FDE）团队交付结构化专业服务 [CE001, CE005]。
              这些跨学科技术团队直接与客户高管、业务线运营人员和内部工程部门协作，设计、构建、测试和部署有韧性的系统 [CE001, CE009]。
              商业服务分为三个递进层级：基础层覆盖初始风险评估和数据治理；加速层交付定制模型微调和检索增强生成（RAG）管线；规模层提供完整运营交接和持续漂移监控，年费从 $500,000 起 [CE003]。
              交付运营建立在约 150 名专业工程师之上，他们通过收购伦敦应用 AI 咨询公司 Tomoro 加入 [CE005]。 DeployCo 还配套扁平层级、每周研发黑客松和持续技术试验的内部文化 [CE006]。
            claimRefs:
              - CE001
