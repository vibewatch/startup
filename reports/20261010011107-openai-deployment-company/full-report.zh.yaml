chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、设立与使命
        blocks:
          - type: paragraph
            body: >-
              OpenAI Deployment Company 以商业标识 DeployCo 运营，代表 OpenAI 从纯前沿基础模型开发转向全栈企业实施服务的战略转折 [CO001]。 DeployCo 是一家由
              OpenAI 控股的特拉华州有限责任公司，总部位于加州旧金山 1455 号 3rd Street，并以伦敦为欧洲交付体系的支点 [CO001, CO002]。 DeployCo
              不授权原始应用程序接口端点，也不出售打包的 SaaS 席位，而是把前线部署工程师直接派驻到企业客户环境中 [CO001, CO010]。
              这些专门技术小组与企业高管、部门运营人员和内部软件工程团队并肩工作，围绕前沿生成式模型重构关键运营流程 [CO001, CO010]。 DeployCo
              聚焦于实操型系统架构、定制数据集成和合规工程，力图把企业人工智能从试验性概念验证项目推进为生产基础设施 [CO010, CO014]。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
              - CO013
      - number: '1.2'
        title: 高管治理、领导架构与关键人员
        blocks:
          - type: paragraph
            body: >-
              DeployCo 的治理架构由 OpenAI 母公司的高管提供战略支持，再由资深咨询业管理团队负责运营执行 [CO007, CO008]。 值得注意的是，公司启动时没有公布独立的首席执行官或总裁，而是继续直接向
              OpenAI 首席执行官 Sam Altman 汇报 [CO007]。 商业拓展和企业合作由 OpenAI 首席营收官 Denise Dresser 负责，她此前曾任 Slack 首席执行官；OpenAI
              前首席运营官 Brad Lightcap 则负责联盟架构和特别投资项目 [CO007]。 公司通过收购成立于 2023 年、总部位于伦敦的应用人工智能咨询公司 Tomoro，确保了首日运营交付能力
              [CO008]。 Tomoro 管理团队包括董事总经理 Ed Broussard、数据架构师 Rishabh Sagar 和企业 AI 负责人 Chris Spencer，负责核心工程团队和部署方法论
              [CO008]。 这种双重架构让公司依赖 OpenAI 母公司领导层，同时特拉华实体内部正式高管的权限仍未公布 [CO007]。
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
      - number: '1.3'
        title: 资本结构、联盟与投资人银团
        blocks:
          - type: paragraph
            body: >-
              DeployCo 通过企业咨询业前所未见的联盟结构完成资本化 [CO003, CO005]。 公司启动时获得超过 $4 billion 的初始承诺资本，投后估值为 $14 billion，对应 $10
              billion 投前基础 [CO003]。 私募股权公司 TPG 领投，Advent International、Bain Capital 和 Brookfield 担任共同领投的创始合作方 [CO005]。
              值得注意的是，融资谈判加入了结构化投资人保护：19 家联盟成员在五年期限内获得最低 17.5% 的年化保证收益，同时利润参与权设有上限 [CO004]。
              因此，这笔融资实质上更像高收益工具，而非通常的稀释性风险投资股权 [CO004]。 与此同时，DeployCo 与大型管理咨询公司和系统集成商建立了优先服务及联合销售联盟，其中包括 Bain &
              Company、McKinsey & Company 和 Capgemini [CO005, CO006]。 这些联盟让 DeployCo 立即、优先触达全球超过 2,000 家企业被投公司 [CO006,
              CO013]。
            claimRefs:
