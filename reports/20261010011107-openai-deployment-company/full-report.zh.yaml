  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              OpenAI Deployment Company 的核心投资论点，建立在企业生成式人工智能面临的系统性商业瓶颈之上：超过 100 万家企业采用 OpenAI 的产品和
              API，但行业数据显示，若不嵌入式重构工作流，超过 70% 的企业 AI 试点无法进入生产阶段 [CV003, CV004, CV011]。DeployCo 一方面获得前沿模型路线图的优先访问权，另一方面吸收
              Tomoro 的一线前置部署工程师，由此搭建嵌入式交付体系，把试验性预算转化为关键生产系统 [CV003, CV004]。此外，DeployCo 的 19 家机构投资者联盟包括私募股权巨头
              TPG、Advent、Bain Capital 和 Brookfield，以及 Bain & Company、McKinsey & Company、Capgemini 等咨询公司；这些机构旗下拥有超过 2,000
              家企业组合公司，能立即提供封闭式分销渠道 [CV002, CV007, CV008,
              CV010]。反论点则集中在三项根本性脆弱点：尚未验证的独立管理体系、客户对单一供应商模型锁定的反弹，以及相较高利润软件平台，扩大高接触人工工程团队时面临的严重执行风险 [CV005, CV006,
              CV011]。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.2'
        title: 融资结构、资本化与估值立场
        blocks:
          - type: paragraph
            body: >-
              DeployCo 于 2026 年 5 月 11 日完成资本化：在 OpenAI 控股并掌握运营控制权的前提下，承诺融资超过 $4 billion，投前估值 $10 billion，投后估值 $14
              billion [CV001, CV002, CV009]。本轮由 TPG 领投；Brookfield 承诺投入 $500 million，Advent 与 Bain Capital
              联合担任共同领投，Goldman Sachs、SoftBank 和 BBVA 等机构伙伴也参与其中 [CV002, CV006, CV009,
              CV010]。关键在于，独立分析显示，这笔交易谈成的是结构化固定收益融资工具，而非标准普通风险股权：联盟投资者在五年内获得合同保证的最低年回报率 17.5%，同时股权利润参与受到上限约束 [CV005]。要为
              $4 billion 资本支付 17.5% 的年度收益门槛，每年需要产生约 $700 million 的现金流或新增资本价值；而公司的商业收入依赖每年起价 $500,000 的服务项目，因而承受极重的财务表现压力
              [CV004, CV005]。因此，我们认为估值偏高，反映出优先收益带来的沉重负担，以及人力资本密集型部署尚未证明能够维持利润率。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 可比公司与结构性交付倍数
        blocks:
          - type: paragraph
            body: >-
              评估 DeployCo 的 $14 billion 估值，需要对照公开系统集成商、企业软件平台和专业 FDE 服务商。Accenture 等传统全球咨询巨头的交易倍数为收入的 2.5x 至
              3.5x，运营利润率接近 15%，背后是超过 700,000 名员工的全球规模，其中交付人员达数十万 [CV006]。相比之下，前置部署工程方法的先驱 Palantir Technologies 享有超过收入
              15x 至 25x 的高软件平台倍数，但这是在将部署工作流标准化为可复用的专有软件平台 Foundry 和 AIP 后才获得的溢价 [CV005, CV008]。UBS
              的市场分析指出，传统系统集成商仍拥有决定性的交付能力和多模型中立优势；而 DeployCo 从 Tomoro 继承的首日约 150 名工程师，不大幅扩充人力就无法服务复杂的企业部署 [CV002,
              CV006]。DeployCo 的 $14 billion 估值意味着每名首日工程师对应约 $93 million
              的企业价值，相较咨询同业溢价极高；只有当嵌入式项目迅速转化为专有的经常性软件收入时，这一估值才说得通。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
      - number: '8.4'
        title: 情景分析、下行触发因素与尽调问题
        blocks:
          - type: paragraph
            body: >-
              我们的情景模型以三年经营周期为框架，建立乐观、基准和悲观路径。乐观情景（概率 25%）下，DeployCo 借助 2,000+ 家组合公司网络和伙伴渠道，迅速将年度订单额扩大到 $1.5 billion 以上，把
              FDE 工作流标准化为模块化软件包，使毛利率接近 60%，并轻松覆盖投资者 17.5% 的收益门槛 [CV004, CV005, CV007]。基准情景（概率 50%）下，DeployCo
              成为顶尖精品转型服务商，年收入达到 $600M 至 $900M；但由于工程师薪酬高达 $200K-$400K、集成复杂，毛利率被限制在 35% 至 45%，股权回报大多被优先收益门槛吞噬 [CV005,
              CV008]。悲观情景（概率 25%）下，企业抵制单一供应商锁定、初始 12 周部署后客户留存受阻，加上交付瓶颈，使公司无法达到 $700M 的年度现金门槛，进而触发资本重组或被母公司 OpenAI 吸收
              [CV004, CV005, CV006]。关键尽调问题包括：经审计的资本表清算优先权、Tomoro 历史客户留存，以及活跃账户的实际毛利率。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 资本结构风险：17.5% 保证收益门槛
            body: >-
              DeployCo 的 $4 billion 资本结构与传统风险融资有根本区别。该结构向联盟投资者保证五年内最低 17.5% 的年回报，同时限制利润参与上限，实际更像高收益优先级债务。每年约 $700
              million 的收益门槛会立即挤压现金创造能力；如果服务项目无法转化为高毛利软件收入，普通股权就会变得脆弱。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: 规模不对称：150 名工程师对比 Accenture 的 700,000 人
            body: >-
              DeployCo $14 billion 的投后估值说明市场对前沿 AI 部署抱有巨大热情，但其首日实际交付能力只有约 150 名前置部署工程师。Accenture 拥有超过 85,000 名 AI
              和数据专业人员；寻求多模型架构及复杂传统系统集成的企业买家仍会继续使用传统集成商，DeployCo 因而只能争取旗舰级转型客户。
            calloutType: insight
            claimRefs:
              - CV002
              - CV006
