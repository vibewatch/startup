              - CU010
      - number: '6.3'
        title: 已披露客户与参考账户
        blocks:
          - type: paragraph
            body: >-
              DeployCo 运营影响的实证证据，来自早期标杆合作关系，以及从 Tomoro 收购而来的企业客户名单。 在金融服务领域，BBVA 是 DeployCo 最大的公开参考部署：公司把 ChatGPT
              Enterprise 和专业工作流工具扩展到 25 个国家的 120,000 名员工，将自动化智能融入日常银行决策。 在农业和工业自动化领域，John Deere 与 DeployCo
              合作，并验证了化学品用量降低 70%、客户互动提升六倍。 其他客户证据来自 Tomoro 过去在游戏、零售和交通领域的项目，包括 Supercell、Tesco、Virgin Atlantic、Red Bull
              和 Fidelity International。 Supercell 部署 GPT-4o 后，每天处理 5 亿 tokens，同时把客户支持运营费用降低 90%。
              但独立验证仍受厂商选择性发布案例的限制；这类案例很少披露基准服务水平协议、长期软件授权利润分成或多年合同续约保证。
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
      - number: '6.4'
        title: 留存持久性、伙伴分销与集中度风险
        blocks:
          - type: paragraph
            body: >-
              DeployCo 商业模式的长期持久性取决于留存机制、扩张回路和结构性渠道冲突的缓解。 与近乎零边际成本扩张的传统软件企业不同，DeployCo 依赖由 19 家机构投资人和咨询伙伴推动的高接触服务分销飞轮。
              Bain & Company、McKinsey & Company 和 Capgemini 等咨询类投资人既是共同投资者，也是优先集成渠道，把 DeployCo 项目交叉销售给已有的财富 500 强客户关系。
              这种安排让公司立即触达数千家企业，但也可能让希望获得客观厂商评估的企业买方面临利益冲突。 此外，DeployCo 的企业合同预计年费从 $500,000
              起，并可扩展到数百万美元的转型承诺；这些合同被设计用来支持向金融银团投资人支付 17.5% 的保证年化收益。 这种固定收益结构要求客户多年锁定，形成明显的厂商依赖：专有工作流会与 OpenAI
              技术栈深度纠缠，带来实质性切换成本和长期客户集中度风险。
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 分销冲突与厂商锁定
            body: 咨询公司的股权支持可能造成咨询偏见，而嵌入式 FDE 集成则可能让企业客户陷入严重的厂商锁定。
            calloutType: risk
            claimRefs:
              - CU007
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管审查、并购许可与合规漏洞
        blocks:
          - type: paragraph
            body: >-
              OpenAI Deployment Company 的法律与监管态势，集中于多司法辖区对其公司结构、伙伴联盟和收购 Tomoro 基础交易的审查。 由于公司把约 150
              名前线部署工程师直接带入企业工作流，商业可行性取决于美国和欧洲监管机构正式批准交易交割并通过反垄断审查。
              此外，作为专门的部署子公司运营，还必须应对严格的数据隐私要求、知识产权边界，以及医疗、保险和银行等高风险行业的部门合规标准。
              如果不能及时获得合并许可，或监管机构认定模型访问权与专业服务之间存在反竞争搭售，收入扩张就会延迟，客户承诺也会受到干扰。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营转化障碍与工具链安全风险
        blocks:
          - type: paragraph
            body: >-
              DeployCo 在把试验性人工智能试用转化为持久的企业生产系统时，运营执行面临明显摩擦。 OpenAI 内部研究显示，超过 70% 的付费 API
              客户实验最终无法达到生产规模，主要原因是企业集成瓶颈、治理障碍和数据管理摩擦。 DeployCo 试图通过与一线员工驻场协作的高接触前线部署工程团队，解决这一结构性失败模式。 但把自动化 AI
              编码智能体和自主循环嵌入客户代码库，会引入严重的软件供应链风险，包括包投毒、不可信的安装后执行和凭证外泄漏洞，因此需要严格的最小权限沙箱和主动监控。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 伙伴渠道张力与基础模型栈锁定
        blocks:
          - type: paragraph
            body: >-
              DeployCo 的资本结构和分销模式制造了复杂的对手方依赖与结构性渠道冲突。 在 19 家全球投资和咨询机构支持下，DeployCo 依赖 McKinsey、Bain 和 Capgemini
              等知名管理咨询公司引入企业交易并负责变革管理。 但这些咨询公司同时运营相互竞争的内部人工智能转型业务，因此与 DeployCo 争夺客户数字预算的长期竞争不可避免。
              与此同时，企业客户面临单一供应商锁定：把深层工作流集成直接绑定到 OpenAI 专有模型权重和工具后，企业牺牲架构可移植性，削弱未来定价议价能力，并在竞争性前沿模型进步时承担高昂的重新平台化成本。
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 财务不透明、成本轨迹与尽调监控终止标准
        blocks:
          - type: paragraph
            body: >-
              从财务和投资角度看，DeployCo 的财务透明度很低，固定成本敞口却很高。 尽管公司启动时获得超过  billion 的承诺资本、投后估值为 4
              billion，但公开来源没有披露已实现收入、毛利率或运营现金消耗的经核实数据。 从 Tomoro 吸收 150 名专业部署人员，会立即形成不可忽视的薪酬负担；公司必须用年费从 00,000
              起的高价值企业合同来支撑。 监控指标必须跟踪从试点到生产的转化里程碑、每名部署工程师带来的毛利率，以及伙伴线索生成量，以便在资本储备耗尽前发现论点可能失效。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
