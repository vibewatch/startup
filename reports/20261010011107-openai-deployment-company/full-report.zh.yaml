        - 该结构每年带来约 $700M 的类债务支付压力；若收入爬坡停滞，股权价值将面临严重下行
      - - 估值立场
        - 偏高
        - $14B 估值意味着按首日约 150 名专家计算，每名工程师对应约 $93M 估值，因此必须快速转向高毛利软件
        - 当前定价已提前计入成功转向平台经济的预期，但软件标准化和单位经济性尚未得到验证
      - - 决策含义
        - 选择性参与
        - 通过 TPG、Bain、Brookfield 和 Advent 获得 2,000+ 家组合公司的封闭式访问，为初期交易流提供独特保护
        - 相比无对冲的次级股权敞口，优先选择商业共同投资或商业供应商合作
    notes: 该评估综合了 2026 年 5 月至 7 月报道中的银团条款、估值标记和交付基准。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
  - id: TV002
    title: 投资论点与反论点矩阵
    columns:
      - 视角
      - 核心论点
      - 底层证据与机制
      - 哪些变化会改变判断
    rows:
      - - 论点（看涨催化剂）
        - 克服企业 AI 试点失败
        - 超过 70% 的企业 AI 实验无法进入生产；嵌入式 FDE 跨越数据、工作流和合规障碍
        - 初始 12 周构建阶段后客户仍持续流失，或客户更偏好内部自建工程团队
      - - 论点（分销）
        - 前所未有的封闭式分销护城河
        - 由 TPG、Advent、Bain Capital 和 Brookfield 牵头的 19 家投资者联盟，为全球 2,000+ 家企业组合公司提供支持
        - 赞助方私募股权公司未能要求其组合公司与 DeployCo 合作
      - - 论点（访问优势）
        - 特权式前沿模型内省
        - DeployCo 的 FDE 直接访问 OpenAI 模型权重和开发路线图，可在发布前设计工作流架构
        - 监管限制特惠访问，或前沿模型推理能力商品化
      - - 反论点（财务）
        - 激进保证回报带来的悬压
        - 投资者获得最低保证年化回报 17.5% 且利润有上限；这要求 $4B 资本每年产生约 $700M 的偿付价值
        - 将银团条款重构为标准普通股，或早期企业软件版税现金流大幅增长
      - - 反论点（交付）
        - 人力资本交付的规模化瓶颈
        - Accenture 拥有超过 700K 名员工（其中超过 85K 名 AI / 数据专业人员）；DeployCo 的 150 名工程师限制了近期执行能力
        - 快速将 FDE 工作流编码为自主软件部署代理，使收入与工程师人数脱钩
      - - 反论点（中立性）
        - 企业抵触模型单一化
        - 大型企业需要多模型架构（Anthropic Claude、Google Gemini）；DeployCo 受限于只能使用 OpenAI 模型
        - DeployCo 建立正式的多供应商支持实践，或 OpenAI 取得持续且无法超越的模型优势
    notes: 论点与反论点将结构性优势与融资约束、竞争现实进行对照。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 三年情景分析：看涨、基准与看跌路径
    columns:
      - 情景
      - 核心假设与运营路径
      - 估值与回报逻辑
      - 主要风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - DeployCo 将 FDE 人数扩大至 1,000+；封闭式 PE 漏斗转化 300+ 家组合公司；软件毛利率达到 60%+
        - 估值扩大至 $25B-$30B；年收入达到 $1.8B+；轻松超过 17.5% 门槛，并带来显著股权上行空间
        - 人才工资上涨；收购的精品咨询公司整合摩擦；竞争实验室的 FDE 执行（Anthropic Ode）
        - 25%（需要将 FDE 工作流产品化为可复用 IP，并做到无瑕疵执行）
      - - 基准情景
        - DeployCo 扩大至 400–600 名工程师；持续赢得高端转型合同（$5M+）；毛利率稳定在 35%–45%
        - 估值维持在 $14B-$16B；年收入增至 $700M-$900M；以 17.5% 优先收益率偿付，剩余股权收益极少
        - 企业 IT 支出收缩；FDE 高流失率（薪酬 $200K-$400K）；客户抵制单一供应商锁定
        - 50%（反映成熟的高端咨询经济性和强大的赞助方支持）
      - - 悲观情景
        - 试点到生产的转化停滞；企业买方偏好多模型系统集成商（Accenture）；高额现金消耗无法达到 $700M 门槛
        - 估值压缩至 $8B 以下；银团优先清算权吸收全部企业价值；股权持有人受损
        - 投资者回报不足触发优先权益追回；Tomoro 人才离职；母公司 OpenAI 重新吸收部署部门
        - 25%（固定收益、类债务资本结构及交付规模化门槛推高风险）
    notes: 情景以 $4B 承诺资本的 5 年期 17.5% 优先回报门槛为基准，模拟三年财务路径。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
