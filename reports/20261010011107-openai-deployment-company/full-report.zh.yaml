  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              企业 AI 部署市场正从原始基础模型 API 授权转向纵向整合、深度参与的实施服务。 过去，企业软件采购会把软件厂商与 Accenture、Deloitte、Capgemini 等第三方系统集成商分开。
              但前沿人工智能部署的执行复杂度很高：概率模型输出必须接入确定性的旧式企业资源规划、客户关系管理和数据仓库系统。 OpenAI Deployment
              Company（DeployCo）通过把直接模型访问权与现场前线部署工程师（FDE）结合，划定了独特的市场边界。
              这套运营范围包括嵌入式诊断工作流设计、定制检索增强生成管线、微调和生产系统维护，同时明确排除横向通用软件转售与一般人员增补。 DeployCo 收购 Tomoro（约 150 名工程师）和 Palantir
              校友创办的 Northslope 等专业咨询公司，直接挑战传统 IT 咨询巨头，为财富 500 强买家提供从模型权重到日常运营工作流执行的一站式责任伙伴。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM012
      - number: '2.2'
        title: 可服务市场规模、服务乘数与扩张视角
        blocks:
          - type: paragraph
            body: >-
              企业 AI 部署的市场测算显示，实施服务机会的增长明显超过软件和模型层本身。 Gartner 的行业基准表明，企业每花 $1 购买 AI 软件，通常还会向外部实施咨询、定制工程、员工培训和变革管理投入 $3 至
              $5。 全球基础模型 API 市场虽预计只有数百亿美元规模，但下游运营化层把总体可寻址市场扩展为 $300B 至 $500B 的服务生态。 在这一市场中，DeployCo 首先瞄准 $40B 至 $60B
              的可服务可寻址市场（SAM），覆盖财富 500 强和 FTSE 100 企业在金融服务、消费者智能和医疗等高合规行业推进关键自动化的需求。 DeployCo
              眼下的可服务可获取市场（SOM）受工程带宽限制，初始能力约为 150 至 300 名部署专家，每个项目年费从 $500,000 起。 TPG 领衔的 19 家机构银团承诺提供总计 $4B
              资本，为激进扩张铺路，使公司能够通过程序化收购扩大可计费部署能力。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM009
              - CM013
      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              前线部署工程的企业采购路径清晰分为经济决策高管、运营 IT 负责人和一线业务部门运营人员。 主要经济买方通常是负责企业转型预算的首席执行官、首席信息官或首席数字官，他们受到董事会紧迫要求的驱动，要把 AI
              试验转化为切实的商业结果。 采购结构分为三个层级：基础层（$500,000+ 起订，重点是风险评估和架构审查）、加速层（定制微调与 ERP 集成，把上线时间缩短 40% 至
              60%），以及规模层（全面运营管理和持续模型升级）。 运营用户包括业务线领域专家，例如合作伙伴 NielsenIQ 的零售库存规划人员或消费者智能分析师；他们使用定制工作流工具，而不是原始提示词界面。
              采用摩擦的核心是预算归属：中央创新预算会启动早期试点，但长期扩张需要业务部门负责人为持续订阅层级买单，在商业签约前要求可验证的生产力指标和工作流可靠性。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动因素、经济治理与尽调限制
        blocks:
          - type: paragraph
            body: >-
              尽管战略顺风明显，企业 AI 部署行业仍受严重执行瓶颈和结构性经济约束支配。 独立企业研究显示，约 80% 的人工智能试点项目无法达到生产规模；OpenAI 内部调查则显示，超过 70% 的付费 API
              实验停留在概念验证阶段。 失败的主要原因是组织变革管理不足、数据治理障碍，以及把非确定性模型接入高合规工作流的困难。 此外，关键市场评论指出，私募股权支持的部署载体内在地存在严重的委托代理激励冲突。
              回报依赖部署量和 token 消耗增长的发起方，与要求按单位计算投资回报、按工作流归因成本并自动控制支出的企业 CFO 存在结构性错位。 如果缺少严格的财务控制，企业可能重演 MarchFirst
              所代表的互联网泡沫时代咨询陷阱：计算成本不断累积，利润率却没有同步扩张。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 从试点到生产的失败陷阱与激励错位
            body: 当 80% 的企业 AI 试点无法扩展、私募股权发起方又推动激进采用目标时，企业可能在没有建立清晰工作流级 ROI 治理的情况下，为昂贵的计算扩张买单。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
          - type: callout
            title: 服务乘数：超越原始模型商品化
            body: 企业在实施和变革管理上的支出是模型 API 授权的三至五倍，因此掌握前线部署集成层，就能拿下企业 AI 的主要利润池。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：前沿实验室、传统系统集成商与 FDE 先行者
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，随着前沿基础模型提供商大举进入深度参与的服务交付，企业 AI 实施格局发生结构性变化。 企业客户越来越难把概念验证试验推进到可规模化的生产系统，早期报道显示，超过 70% 的企业 API
              项目在全面部署前停滞。 作为回应，OpenAI 推出 OpenAI Deployment Company（DeployCo），由 19 家机构组成、TPG 领投的联盟注入超过 $4
              billion，并收购总部位于爱丁堡的应用咨询公司 Tomoro，以便首日获得 150 名经验丰富的前线部署工程师。 这一举动直接回应了 Anthropic 八天前与 Blackstone、Hellman &
              Friedman 和 Goldman Sachs 设立的 $1.5 billion 平行合资企业。 两家实验室支持的公司都明确采用由 Palantir Technologies
              开创的前线部署工程模式，把软件工程师直接嵌入客户团队和工作流。 因此，DeployCo 面临三类竞争：模型实验室旗下的对手服务公司、拥有庞大客户基础的 Accenture 和 Deloitte
              等全球系统集成商，以及服务中型市场买家的专业 FDE 咨询公司。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 能力差异化：模型优先访问权与厂商中立
        blocks:
          - type: paragraph
            body: >-
              DeployCo 与传统系统集成商之间的核心竞争轴，是结构性的访问权不对称。 DeployCo 作为 OpenAI 控股的运营部门，其前线部署工程师可以直接访问模型权重、预发布研究路线图，以及 OpenAI
              核心研究团队的专门工程支持。 这让 DeployCo 能在前沿模型能力普遍开放商业 API 之前，就围绕即将推出的能力设计客户工作流。 相比之下，Accenture 和 Deloitte
              等传统集成商只能严格通过外部商业 API 运营，无法深入查看模型。 但这种与实验室的紧密绑定也带来了厂商中立性方面的反向弱点。 大型企业 IT 组织经常要求多模型架构，以降低对手方风险和成本集中度，并在
              OpenAI 系统旁部署 Anthropic 的 Claude、Google 的 Gemini 和开放权重模型。 全球集成商拥有适配跨平台部署的多厂商实践，而 DeployCo 只运行 OpenAI
              技术栈，迫使买家在部署深度和厂商选择权之间取舍。
            claimRefs:
              - CP007
              - CP008
              - CP009
