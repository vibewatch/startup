      - number: '3.3'
        title: 定价模式、联盟分销与渠道动态
        blocks:
          - type: paragraph
            body: >-
              DeployCo 的商业拓展依靠高价值、以结果为导向的转型合同，与传统咨询计费模式形成鲜明对比。 DeployCo 不采用开放式工时加材料人员配置，而是围绕生产交付里程碑设计客户项目；据报道，入门订阅层级年费从
              $500,000 起，多年转型项目通常收费 £5 million 或更高。 DeployCo 的一项关键竞争护城河是封闭式分销渠道：由 19 家机构组成的创始投资人联盟——包括私募股权巨头 TPG、Bain
              Capital 和 Brookfield——控制着遍布全球、超过 2,000 家企业的被投组合。 这些被投公司可以优先获得 DeployCo 的工程团队支持，有效缓冲早期获客摩擦。 此外，Bain &
              Company、Capgemini 和 McKinsey & Company 等管理咨询公司也参与 DeployCo 的股权共同投资，把企业战略咨询渠道用于联合销售部署项目，同时分享股权回报。
