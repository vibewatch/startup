evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited standalone financial statements, GAAP revenue, annual recurring revenue (ARR), and operating cash burn for
      DeployCo.
    whyItMatters: >-
      Without standalone financial disclosures, valuation multiples and standalone unit economics cannot be verified
      independently from parent OpenAI.
    diligencePath: >-
      Request private financial reporting package or audited financial statements from lead investor TPG or parent
      OpenAI.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete confirmed corporate officer roster and dedicated standalone executive appointments for DeployCo beyond
      parent OpenAI liaisons.
    whyItMatters: >-
      Clarifies operational reporting lines and determines whether former Tomoro directors hold formal officer authority
      or advisory roles within DeployCo.
    diligencePath: >-
      Review formal post-acquisition organizational charts and Delaware LLC operating agreements during management
      diligence sessions.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Comprehensive breakdown of capital allocation, voting rights, and individual commitment amounts for all 19
      consortium partner firms.
    whyItMatters: >-
      Determines individual partner exposure, governance influence, and specific distribution obligations across the
      2,000+ portfolio company network.
    diligencePath: Obtain the syndicate subscription agreement and limited liability company agreement from lead sponsor TPG.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited client contract values, renewal rates, and proprietary fine-tuning service margins across DeployCo's
      active Fortune 500 accounts.
    whyItMatters: >-
      Without segmented financial disclosures, estimating the exact serviceable obtainable market (SOM) relies on
      forward deployed headcount assumptions rather than realized recurring engagement revenues.
    diligencePath: >-
      Review client contract terms, minimum commitment thresholds, and services-to-software margin splits during formal
      management diligence.
    relatedQuestionRefs:
