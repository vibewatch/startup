      - number: '3.3'
        title: Pricing Models, Consortium Distribution, and Channel Dynamics
        blocks:
          - type: paragraph
            body: >-
              DeployCo's commercial go-to-market strategy relies on high-value, outcome-oriented transformation
              contracts that contrast sharply with traditional consulting billing models. Rather than relying on
              open-ended time-and-materials staffing, DeployCo structures client engagements around production delivery
              milestones, with reported entry subscription tiers starting at $500,000 annually and multi-year
              transformation programs typically commanding £5 million or more. A decisive competitive moat is DeployCo's
              captive distribution channel: its 19-firm founding investor consortium—which includes private equity
              giants TPG, Bain Capital, and Brookfield—controls portfolio holdings spanning more than 2,000 corporate
              enterprises globally. These portfolio companies receive prioritized access to DeployCo's engineering
              bench, effectively insulating DeployCo from early customer acquisition friction. Furthermore, management
              consultancies Bain & Company, Capgemini, and McKinsey & Company participate as equity co-investors in
              DeployCo, aligning their enterprise strategy advisory channels to co-sell deployment engagements while
              sharing in equity returns.
