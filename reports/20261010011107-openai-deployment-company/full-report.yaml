  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Service Delivery Tiers, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The OpenAI Deployment Company, commercially identified as DeployCo, represents an operational
              transformation model designed to transition enterprise generative AI from experimental proof-of-concept
              projects into production infrastructure [CE001]. Rather than licensing unbundled model APIs or offering
              generalized software subscriptions, DeployCo delivers structured professional services through dedicated
              Forward Deployed Engineering (FDE) pods [CE001, CE005]. These multi-disciplinary technical teams embed
