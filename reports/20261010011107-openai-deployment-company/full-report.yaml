  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Segmentation & Target Buying Centers
        blocks:
          - type: paragraph
            body: >-
              The commercial strategy of the OpenAI Deployment Company focuses exclusively on large enterprise
              organizations where operational complexity and regulatory constraints prevent standard off-the-shelf
              software adoption. DeployCo segments its initial customer base across four primary buying centers: private
              equity portfolio companies, global tier-one banking institutions, consumer retail conglomerates, and
              industrial equipment manufacturers. The core buyer persona sits at the intersection of the Chief Operating
              Officer, Chief Technology Officer, and business unit heads who bear direct P&L responsibility for
              mission-critical workflows. In private equity, the customer relationship is heavily intermediated by
              consortium sponsors such as TPG, Advent International, Bain Capital, and Brookfield, who provide captive
              access to more than 2,000 portfolio companies worldwide. For global financial institutions such as BBVA,
              DeployCo positions its forward deployed engineers as dedicated transformation partners capable of
              embedding intelligence across heavily audited environments spanning dozens of jurisdictions. While this
              focus yields substantial contract values and high strategic relevance, it also introduces significant
              procurement friction, lengthy sales cycles, and complex multi-stakeholder governance reviews.
