  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Matrix
    columns:
      - Perspective
      - Core Argument
      - Underlying Evidence & Mechanism
      - What Would Change the View
    rows:
      - - Thesis (Bull Catalyst)
        - Overcoming Enterprise AI Pilot Failure
        - >-
          Over 70% of enterprise AI experiments fail to reach production; embedded FDEs bridge data, workflow, and
          compliance barriers
        - >-
          Persistent customer attrition after initial 12-week build phase or client preference for internal DIY
          engineering teams
      - - Thesis (Distribution)
        - Unprecedented Captive Distribution Moat
        - >-
          19-firm investor consortium led by TPG, Advent, Bain Capital, and Brookfield sponsors over 2,000 corporate
          portfolio companies globally
        - Failure of sponsor private equity firms to mandate DeployCo engagements across their portfolio companies
      - - Thesis (Access Advantage)
        - Privileged Frontier Model Introspection
        - >-
          DeployCo FDEs maintain direct access to OpenAI model weights and development roadmaps, enabling pre-release
          workflow architecture
        - Regulatory restrictions on preferential access or commoditization of frontier model reasoning capabilities
      - - Anti-Thesis (Financial)
        - Aggressive Guaranteed Return Overhang
        - >-
          Investors receive a guaranteed minimum 17.5% annual return with profit caps, requiring ~$700M in annual
          servicing value on $4B
        - >-
          Restructuring of syndicate terms into standard common equity or massive early enterprise software royalty cash
          flows
      - - Anti-Thesis (Delivery)
        - Human-Capital Delivery Scaling Bottleneck
        - >-
          Accenture deploys >700K employees (>85K AI/data professionals); DeployCo's 150 engineers limit near-term
          execution capacity
        - >-
          Rapid codification of FDE workflows into autonomous software deployment agents, decoupling revenue from
          engineering headcount
      - - Anti-Thesis (Neutrality)
        - Enterprise Resistance to Model Monoculture
        - >-
          Large enterprises require multi-model architectures (Anthropic Claude, Google Gemini); DeployCo is restricted
          to OpenAI models
        - >-
          DeployCo establishing official multi-vendor support practices or OpenAI achieving sustained insurmountable
          model superiority
    notes: >-
      Thesis and anti-thesis drivers contrast structural advantages against financing constraints and competitive
      realities.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 'Three-Year Scenario Analysis: Bull, Base, and Bear Trajectories'
    columns:
      - Scenario
      - Core Assumptions & Operating Trajectory
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          DeployCo scales FDE headcount to 1,000+; captive PE funnel converts 300+ portfolio companies; software gross
          margins reach 60%+
        - >-
          Valuation expands to $25B-$30B; annual revenue reaches $1.8B+; easily clears 17.5% hurdle with substantial
          equity upside
        - >-
          Talent wage inflation; integration friction across acquired consulting boutiques; rival lab FDE execution
          (Anthropic Ode)
        - 25% (Requires flawless execution in productizing FDE workflows into reusable IP)
      - - Base Case
        - >-
          DeployCo scales to 400-600 engineers; wins steady high-end transformation contracts ($5M+); gross margins
          stabilize at 35%-45%
        - >-
          Valuation holds at $14B-$16B; annual revenue grows to $700M-$900M; services the 17.5% preferred yield with
          minimal residual equity gains
        - >-
          Enterprise IT spending compression; high FDE turnover ($200K-$400K comp); client resistance to single-vendor
          lock-in
        - 50% (Reflects established high-end consulting economics and strong sponsor backing)
      - - Bear Case
        - >-
          Pilot-to-production conversion stalls; enterprise buyers favor multi-model SIs (Accenture); high cash burn
          fails to meet $700M hurdle
        - >-
          Valuation compresses below $8B; syndicate preferred liquidation rights absorb all enterprise value; equity
          holders impaired
        - >-
          Investor return shortfall triggers preferred clawbacks; Tomoro talent departure; parent OpenAI re-absorbs
          deployment arm
        - 25% (Elevated risk driven by fixed-yield debt-like capital structure and delivery scaling hurdles)
    notes: >-
      Scenarios model three-year financial trajectory against the 17.5% five-year preferred return hurdle on $4B
      committed capital.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
