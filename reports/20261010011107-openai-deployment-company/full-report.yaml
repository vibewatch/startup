  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Service Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The enterprise AI deployment market represents a structural shift from raw foundation model API licensing
              toward vertically integrated, hands-on implementation services. Historically, enterprise software
              procurement decoupled software vendors from third-party systems integrators such as Accenture, Deloitte,
              and Capgemini. However, frontier artificial intelligence deployment presents acute execution complexity:
              probabilistic model outputs must interface with deterministic legacy enterprise resource planning,
              customer relationship management, and data warehouse systems. The OpenAI Deployment Company (DeployCo)
              establishes a distinct market boundary by combining direct model access with on-site Forward Deployed
              Engineers (FDEs). This operational perimeter includes embedded diagnostic workflow design, custom
              retrieval-augmented generation pipelines, fine-tuning, and production system maintenance, while explicitly
              excluding horizontal commodity software resale and generic staff augmentation. By acquiring specialized
              consultancies including Tomoro (~150 engineers) and Palantir-alumni practice Northslope, DeployCo directly
              challenges traditional IT consulting incumbents, offering Fortune 500 buyers a single accountable partner
              spanning model weights through daily operational workflow execution.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM012
      - number: '2.2'
        title: Addressable Market Sizing, Services Multipliers, and Expansion Lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing for enterprise AI deployment reveals that the implementation services opportunity
              substantially outpaces the underlying software and model layer. Industry benchmarks from Gartner indicate
              that for every $1 spent on enterprise AI software, organizations allocate $3 to $5 toward external
              implementation consulting, custom engineering, workforce training, and change management. While the global
              foundation model API market is estimated at tens of billions of dollars, the downstream operationalization
              layer expands the Total Addressable Market into a $300B to $500B services ecosystem. Within this
              landscape, DeployCo targets an initial Serviceable Addressable Market (SAM) of $40B to $60B across Fortune
              500 and FTSE 100 enterprises seeking mission-critical automation across high-compliance verticals like
              financial services, consumer intelligence, and healthcare. DeployCo's immediate Serviceable Obtainable
              Market (SOM) is constrained by engineering bandwidth, with an initial capacity of approximately 150 to 300
              deployed specialists servicing engagements starting at $500,000 annually. Capital commitments totaling $4B
              from a 19-firm syndicate led by TPG provide aggressive expansion runway, enabling programmatic
              acquisitions to expand billable deployment capacity.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM009
              - CM013
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement pathways for forward deployed engineering reflect a clear segmentation across
              executive economic sponsors, operational IT leaders, and frontline business unit operators. The primary
              economic buyer is typically the Chief Executive Officer, Chief Information Officer, or Chief Digital
              Officer managing enterprise transformation budgets, motivated by urgent board mandates to convert AI
              experimentation into tangible commercial outcomes. Procurement structures span three defined tiers:
              Foundations ($500,000+ entry subscriptions focusing on risk assessment and architecture review),
              Acceleration (custom fine-tuning and ERP integration reducing time-to-production by 40% to 60%), and Scale
              (full operational management and continuous model upgrades). Operational users comprise line-of-business
              domain experts, such as retail inventory planners or consumer intelligence analysts at partners like
              NielsenIQ, who interact with customized workflow tools rather than raw prompt interfaces. Adoption
              friction centers on budget ownership: central innovation budgets initiate early pilots, but long-term
              expansion requires business-unit leaders to fund ongoing subscription tiers, demanding verifiable
              productivity metrics and workflow reliability before commercial sign-off.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Economic Governance, and Diligence Constraints
        blocks:
          - type: paragraph
            body: >-
              Despite compelling strategic tailwinds, adoption in the enterprise AI deployment sector is governed by
              severe execution bottlenecks and structural economic constraints. Independent enterprise research
              demonstrates that approximately 80% of artificial intelligence pilot projects fail to reach production
              scale, while internal OpenAI surveys indicate that over 70% of paid API experiments stall in
              proof-of-concept limbo. These failures stem primarily from organizational change management deficits, data
              governance barriers, and the difficulty of integrating non-deterministic models into compliance-heavy
              workflows. Furthermore, critical market commentary highlights serious principal-agent incentive conflicts
              inherent in private equity-backed deployment vehicles. Sponsors whose returns depend on scaling deployment
              volume and token consumption face structural misalignment with enterprise CFOs who require unit-level
              return on investment, cost-per-workflow attribution, and automated spending governors. Without rigorous
              financial controls, enterprises risk replicating the dot-com era consulting traps exemplified by
              MarchFirst, accumulating compounding compute overhead without commensurate margin expansion.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Pilot-to-Production Failure Trap and Incentive Misalignment
            body: >-
              With 80% of enterprise AI pilots failing to scale and private equity sponsors driving aggressive adoption
              mandates, enterprises risk funding expensive compute expansion without establishing clear workflow-level
              ROI governance.
