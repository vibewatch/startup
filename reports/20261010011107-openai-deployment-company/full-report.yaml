  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for the OpenAI Deployment Company rests on the systemic commercial bottleneck
              in enterprise generative artificial intelligence: while more than one million businesses adopt OpenAI
              products and APIs, industry data shows over 70% of enterprise AI pilot experiments fail to reach
              production without embedded workflow redesign [CV003, CV004, CV011]. By combining privileged access to
              frontier model roadmaps with hands-on Forward Deployed Engineers acquired via Tomoro, DeployCo creates an
              embedded delivery apparatus that converts experimental budgets into mission-critical production systems
              [CV003, CV004]. Furthermore, DeployCo's 19-firm investor syndicate—featuring private equity leaders TPG,
              Advent, Bain Capital, and Brookfield, alongside consultancies Bain & Company, McKinsey & Company, and
              Capgemini—sponsors over 2,000 corporate portfolio companies, establishing an immediate captive
              distribution channel [CV002, CV007, CV008, CV010]. Conversely, the anti-thesis centers on three
              fundamental vulnerabilities: an unproven standalone management apparatus, customer pushback against
              single-vendor model lock-in, and severe execution risks when scaling high-touch human engineering teams
              compared to high-margin software platforms [CV005, CV006, CV011].
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
