chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Formation, and Mission
        blocks:
          - type: paragraph
            body: >-
              The OpenAI Deployment Company, operating under the commercial identifier DeployCo, represents a
              fundamental strategic shift for OpenAI from pure frontier foundation model development into full-stack
              enterprise implementation services [CO001]. Structured as a majority-owned Delaware limited liability
              company, DeployCo is headquartered at 1455 3rd Street in San Francisco, California, while anchoring its
              European delivery apparatus in London [CO001, CO002]. Rather than licensing raw application programming
              interface endpoints or selling packaged SaaS seats, DeployCo deploys Forward Deployed Engineers directly
              into enterprise client environments [CO001, CO010]. These dedicated technical pods embed alongside
              corporate executives, department operators, and internal software engineering teams to redesign
              mission-critical operational processes around frontier generative models [CO001, CO010]. By focusing on
              hands-on systems architecture, bespoke data integration, and compliance engineering, DeployCo seeks to
              transition enterprise artificial intelligence from experimental proof-of-concept initiatives into
              production infrastructure [CO010, CO014].
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
              - CO013
      - number: '1.2'
        title: Executive Governance, Leadership Structure, and Key Personnel
        blocks:
          - type: paragraph
            body: >-
              DeployCo's governance architecture combines strategic sponsorship from parent OpenAI executives with
              operational execution led by veteran consulting leadership [CO007, CO008]. Notably, the company launched
              without naming a dedicated standalone Chief Executive Officer or President, maintaining direct reporting
              relationships into OpenAI Chief Executive Officer Sam Altman [CO007]. Commercial go-to-market execution
              and enterprise partnerships are directed by OpenAI Chief Revenue Officer Denise Dresser, formerly the
              Chief Executive Officer of Slack, while former OpenAI Chief Operating Officer Brad Lightcap oversees
              consortium structuring and special investment projects [CO007]. Operational delivery on day one was
              secured through the founding acquisition of London-based applied artificial intelligence consultancy
              Tomoro, founded in 2023 [CO008]. Tomoro's leadership team, including Managing Director Ed Broussard, data
              architect Rishabh Sagar, and enterprise AI lead Chris Spencer, manages core engineering pods and
              deployment methodologies [CO008]. This dual structure introduces key-person dependencies on parent OpenAI
              leadership while formal officer authority within the Delaware entity remains unannounced [CO007].
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
      - number: '1.3'
        title: Capital Structure, Consortium Alliances, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Capitalization of DeployCo was executed through a consortium structure unprecedented in enterprise
              consulting [CO003, CO005]. The entity launched with more than $4 billion in initial committed capital at a
              post-money valuation of $14 billion, implying a $10 billion pre-money base [CO003]. The capital vehicle
              was led by private equity firm TPG, alongside co-lead founding partners Advent International, Bain
              Capital, and Brookfield [CO005]. Notably, the financing was negotiated with structured investor
              protections, providing the 19 consortium partners with a guaranteed minimum 17.5% annual return over a
              five-year horizon alongside capped profit participation [CO004]. This structures the financing effectively
              as a high-yield instrument rather than standard dilutive venture equity [CO004]. In parallel, DeployCo
              established preferred services and co-selling alliances with major management consultancies and systems
              integrators, prominently featuring Bain & Company, McKinsey & Company, and Capgemini [CO005, CO006]. These
              alliances give DeployCo immediate, privileged commercial access to more than 2,000 corporate portfolio
              companies globally [CO006, CO013].
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
      - number: '1.4'
        title: Operational Scale, Milestones, and Enterprise Deployment Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              DeployCo's operational timeline traces the rapid evolution of enterprise artificial intelligence
              implementation from boutique advisory into institutional deployment [CO001, CO008]. Originating from
              Tomoro's establishment in May 2023 in alliance with OpenAI, the organization scaled delivery capabilities
              across early enterprise clients prior to its formal acquisition in May 2026 [CO008, CO009]. The
              transaction integrated approximately 150 experienced Forward Deployed Engineers and deployment specialists
              into DeployCo on day one [CO009]. Early enterprise case studies highlight substantial operational
              rollouts, including BBVA's global deployment across 120,000 employees and John Deere's agricultural
              decision support systems [CO014]. However, DeployCo faces profound operational friction and structural
              headwinds [CO011, CO012]. Internal industry benchmarks indicate that over 70% of enterprise AI pilot
              projects fail to reach production due to workflow friction, data fragmentation, and regulatory resistance
              [CO011]. Furthermore, enterprise software buyers and developers voice growing apprehension regarding
              proprietary vendor lock-in, as deep FDE integration embeds OpenAI's model stack directly into core
              corporate infrastructure [CO012].
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO011
              - CO012
              - CO014
