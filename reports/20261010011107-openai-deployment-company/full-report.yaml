      - number: '8.2'
        title: Financing Structure, Capitalization, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              DeployCo's capitalization was established on May 11, 2026, with over $4 billion in committed funding at a
              $10 billion pre-money and $14 billion post-money valuation under OpenAI majority ownership and operational
              control [CV001, CV002, CV009]. The round was led by TPG, with Brookfield committing $500 million alongside
              co-leads Advent and Bain Capital, and participation from institutional partners including Goldman Sachs,
              SoftBank, and BBVA [CV002, CV006, CV009, CV010]. Crucially, independent analysis reveals that the
              transaction was negotiated as a structured fixed-yield financing instrument rather than standard common
              venture equity: syndicate investors receive a contractually guaranteed minimum annual return of 17.5% over
              five years alongside a cap on equity profit participation [CV005]. Servicing this 17.5% annual hurdle on
              $4 billion requires generating approximately $700 million in annual cash flow or incremental capital
              value, placing an intense financial performance burden on an entity whose commercial revenue relies on
              services engagements starting at $500,000 annually [CV004, CV005]. Consequently, our valuation stance is
              stretched, reflecting the demanding preferred yield overhang and the unproven margin durability of
              human-capital-intensive deployment.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Comparable Set and Structural Delivery Multiples
        blocks:
          - type: paragraph
            body: >-
              Evaluating DeployCo's $14 billion valuation requires cross-referencing public systems integrators,
              enterprise software platforms, and specialized FDE service providers. Legacy global consulting incumbents
              such as Accenture trade at revenue multiples of 2.5x to 3.5x with operating margins near 15%, supported by
              global scale exceeding 700,000 employees and hundreds of thousands of delivery personnel [CV006]. In
              contrast, Palantir Technologies—the pioneer of the forward-deployed engineering methodology—commands high
              software-platform multiples exceeding 15x to 25x revenue, but achieved that premium only after
              standardizing its deployment workflows into reusable proprietary software platforms (Foundry and AIP)
              [CV005, CV008]. Market analysis by UBS indicates that legacy systems integrators maintain decisive
              delivery capacity and multi-model neutrality advantages, whereas DeployCo's day-one bench of ~150
              engineers inherited from Tomoro cannot service complex enterprise rollouts without massive human-capital
              scaling [CV002, CV006]. DeployCo's valuation of $14 billion implies roughly $93 million in enterprise
              value per day-one engineer, representing an extreme premium over consulting peers that can only be
              rationalized if embedded engagements rapidly transition into proprietary recurring software revenue.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
      - number: '8.4'
        title: Scenario Analysis, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our scenario modeling establishes bull, base, and bear trajectories across three-year operating horizons.
              In the bull case (25% probability), DeployCo leverages its 2,000+ portfolio company network and partner
              channels to rapidly scale annual bookings beyond $1.5 billion, standardizing FDE workflows into modular
              software packages that expand gross margins toward 60% and comfortably servicing the 17.5% investor yield
              hurdle [CV004, CV005, CV007]. In the base case (50% probability), DeployCo functions as a premier boutique
              transformation services provider generating $600M to $900M in annual revenue, but gross margins remain
              capped at 35% to 45% due to high engineer compensation ($200K-$400K) and integration complexity, leaving
              equity returns largely absorbed by the preferred yield hurdle [CV005, CV008]. In the bear case (25%
              probability), enterprise pushback against single-vendor lock-in, client retention friction following the
              12-week initial deployment phase, and delivery bottlenecks prevent the firm from meeting its $700M annual
              cash hurdle, triggering recapitalization or absorption into parent OpenAI [CV004, CV005, CV006]. Key
              diligence asks focus on audited cap-table liquidation preferences, Tomoro's historical client retention,
              and gross margin realizations across active accounts.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Structure Risk: The 17.5% Guaranteed Yield Hurdle'
            body: >-
              DeployCo's $4 billion capitalization differs fundamentally from conventional venture financing. By
              guaranteeing syndicate investors a minimum 17.5% annual return over five years with capped profit
              participation, the structure functions like high-yield senior debt. Servicing approximately $700 million
              in annual return hurdles puts immediate pressure on cash generation, leaving common equity vulnerable if
              services engagements cannot be converted into high-margin software revenues.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: 'The Scale Asymmetry: 150 Engineers vs. Accenture''s 700,000'
            body: >-
              While DeployCo's valuation of $14 billion post-money reflects immense enthusiasm for frontier AI
              deployment, its physical delivery capacity on day one is constrained to roughly 150 forward-deployed
              engineers. With Accenture deploying over 85,000 AI and data professionals, enterprise buyers seeking
              multi-model architectures and complex systems legacy integration will continue utilizing incumbent
              integrators, limiting DeployCo to flagship transformation accounts.
            calloutType: insight
            claimRefs:
              - CV002
              - CV006
