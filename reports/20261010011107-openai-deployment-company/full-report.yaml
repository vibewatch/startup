            title: The Vertical Integration Shift from Model Wholesaler to Delivery Competitor
            body: >-
              The launch of OpenAI Deployment Company and the Anthropic-Blackstone venture represents a permanent change
              in AI industry structure. By acquiring applied-AI boutiques like Tomoro and Northslope, frontier labs have
              moved from API wholesalers into direct implementation competitors against Accenture, Deloitte, and
              Cognizant.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP013
          - type: callout
