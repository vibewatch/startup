            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
          - type: callout
            title: 'The Services Multiplier: Moving Beyond Raw Model Commodity'
            body: >-
              Because enterprise spending on implementation and change management outpaces model API licensing by three
              to five times, owning the forward deployed integration layer captures the dominant profit pool of
              enterprise AI.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM007
