      - number: '3.4'
        title: 'Moat Durability: Switching Costs, Talent Bottlenecks, and Structural Risks'
        blocks:
          - type: paragraph
            body: >-
              DeployCo's long-term defensibility rests on the high operational switching costs created by embedded
              forward-deployed engineering. When engineers redesign enterprise data pipelines, enterprise resource
              planning interfaces, and regulatory controls around proprietary model architectures, replacing the
              provider requires rebuilding core business processes rather than simply switching API endpoints.
              Nonetheless, DeployCo faces acute structural threats and channel tensions. Shares in incumbent IT services
              firms dropped 3% to 5% upon DeployCo's announcement, reflecting market recognition that DeployCo directly
              contests high-margin implementation budgets. As DeployCo scales, conflict with traditional systems
              integrators that also refer OpenAI API volume is likely to intensify. Additionally, DeployCo's aggressive
              inorganic expansion—such as acquiring Tomoro and ex-Palantir boutique Northslope using its $4 billion
              pool—faces potential antitrust and regulatory scrutiny. Finally, single-vendor lock-in risks may cause
              risk-sensitive CIOs in banking and healthcare to restrict DeployCo to specific workflows while maintaining
              multi-vendor integrators for core enterprise governance.
            claimRefs:
              - CP009
              - CP013
              - CP014
