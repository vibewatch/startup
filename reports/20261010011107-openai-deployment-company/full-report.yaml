  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Frontier Labs, Incumbent SIs, and FDE Pioneers'
        blocks:
          - type: paragraph
            body: >-
              The enterprise AI implementation landscape underwent a structural transformation in May 2026 as frontier
              foundation model providers moved aggressively into hands-on services delivery. Enterprise customers had
              increasingly encountered bottlenecks when attempting to move from proof-of-concept experiments into
              scalable production systems, with early reporting indicating that over 70% of enterprise API initiatives
              stalled before full deployment. In response, OpenAI launched the OpenAI Deployment Company (DeployCo) as a
              majority-owned subsidiary capitalized with over $4 billion from a 19-firm consortium led by TPG, acquiring
              Edinburgh-based applied consultancy Tomoro to secure 150 experienced Forward Deployed Engineers on day
              one. This move directly counters Anthropic's parallel $1.5 billion venture established with Blackstone,
              Hellman & Friedman, and Goldman Sachs just eight days earlier. Both lab-backed ventures explicitly adopt
              the forward-deployed engineering operating model pioneered by Palantir Technologies, embedding software
              engineers directly inside client teams and workflows. Consequently, DeployCo faces competition across
              three distinct categories: rival model lab service ventures, incumbent global systems integrators such as
              Accenture and Deloitte that possess massive client footprints, and specialized FDE consultancies serving
              middle-market buyers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
