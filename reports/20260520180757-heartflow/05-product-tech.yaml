callouts:
  - calloutType: strength
    title: Physics-plus-AI is the core product differentiator
    body: >-
      The strongest evidence-backed product edge is not one module name but the architecture: a
      single-CCTA workflow that combines deep-learning segmentation, computational fluid dynamics,
      human-reviewed quality control, and a growing annotation asset to deliver anatomy, physiology,
      and plaque outputs inside clinician systems.
    claimRefs:
      - CE002
      - CE027
      - CE028
      - CE029
      - CE041
  - calloutType: risk
    title: Operational opacity is still the main technical diligence gap
    body: >-
      Heartflow publishes enough to show a real regulated production workflow, but not enough to
      prove public uptime, hard SLAs, self-serve integration depth, or scaled routine use of PCI
      Navigator. That means the remaining product risk is execution opacity rather than absence of a
      real platform.
    claimRefs:
      - CE019
      - CE021
      - CE046
