  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / framework
      - Public status
      - Scope / implication
      - Evidence
      - Remaining gap
    rows:
      - - FDA Class II device status
        - Active
        - Heartflow operates as regulated medical-device software in the United States
        - Filing plus K250902 and K190925 documents
        - Public docs do not provide the full post-market surveillance dashboard.
      - - Quality-management obligations
        - Active
        - K250902 reminds Heartflow that design controls, CAPA, labeling, MDR, and UDI obligations apply
        - FDA clearance letter cites QS regulation and post-market requirements
        - Public sources do not disclose audit cadence, findings, or CAPA history.
      - - Data protection architecture
        - Active
        - Platform claims encryption at rest and in transit, MFA/SSO, granular authorization, secure SDLC, and de-identification of PHI for processing
        - 10-K data-security section
        - No public architecture white paper or incident-history page was found.
      - - External certifications
        - Active
        - HITRUST, ISO 27001, ISO 13485, SOC 2 Type 2, and UK CyberEssentials support buyer trust and procurement review
        - 10-K data-security section
        - Public source set does not expose certificate numbers, audit scope, or renewal dates.
      - - Clinical safety signal
        - Positive but indirect
        - Filing says studies collecting adverse-event data reported no platform-related adverse events
        - 10-K clinical-results section
        - Public evidence does not replace formal post-market vigilance reporting or uptime evidence.
      - - Support governance
        - Active
        - Contact page and support page show staffed support lines and operational support functions in the U.S. and UK
        - Product support phone lines plus case-support language
        - Public materials do not commit to response-time SLAs or severity escalation policies.
    notes: >-
      This table distinguishes controls that are explicitly documented from controls that are merely
      implied. Where the public record stops at framework names or FDA obligations, the gap is stated
      instead of inferred away.
