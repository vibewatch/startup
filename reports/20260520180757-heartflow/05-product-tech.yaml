  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow step
      - Heartflow solution
      - Measurable benefit / signal
      - Limitation / caveat
    rows:
      - - Read every CCTA efficiently
        - Reader receives a CCTA and needs a fast first-pass understanding of lesions
        - Roadmap auto-delivers an anatomic overview to PACS or Heartflow system
        - SMART-CT public signal says up to 25% faster reads and >40% better agreement between readers
        - Benefit is reader-workflow focused; public evidence does not show a separate paid SKU.
      - - Decide whether a lesion needs intervention
        - Physician has an anatomic scan but limited physiologic certainty
        - FFRCT provides lesion-specific blood-flow values across the coronary tree
        - Heartflow cites 90-minute median turnaround plus PRECISE and PACIFIC outcome/accuracy signals
        - Utility still depends on image quality, case acceptance, and payer coverage.
      - - Intensify preventive treatment earlier
        - Physician wants risk beyond stenosis or calcium score alone
        - Plaque Analysis quantifies plaque burden and composition with staging context
        - DECIDE and REVEALPLAQUE are used as signals that plaque changes management and aligns with IVUS
        - Public evidence on long-term attach, payer durability, and realized economics is incomplete.
      - - Plan PCI before the cath lab
        - Interventional team wants lesion, calcium, plaque, and physiology context before stenting
        - PCI Navigator combines these views in one interface
        - Banner and 2026 newsroom signals suggest growing clinical and registry use
        - Public sources still look launch-stage and do not quantify scaled routine use.
      - - Launch and scale a CCTA program
        - Site needs protocol help, coding support, integration, and physician education
        - Heartflow Support provides implementation, reimbursement, peer education, and case support
        - Lower adoption friction and deeper account embedment than a self-service software model
        - Public materials do not quantify hours of service, staffing load, or SLA commitments.
    notes: >-
      The benefits column uses published study or deployment signals rather than internal ROI claims.
      Caveats identify the operational or evidence breakpoints where public documentation stops.
