tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Current status / maturity
      - Workflow role
      - Differentiation
      - Diligence gap
    rows:
      - - Roadmap Analysis
        - Imaging cardiologist / radiologist
        - Commercial, bundled, broadly embedded
        - Default anatomic triage layer for every acceptable CCTA sent to Heartflow
        - Improves reading speed and consistency; keeps Heartflow in every case even when paid add-ons are not ordered
        - Public evidence does not show whether any enterprise contracts price Roadmap separately or only use it for retention.
      - - FFRCT Analysis
        - Cardiologist, radiologist, referring physician
        - Commercial flagship; most mature module
        - Adds lesion-specific physiology to decide who needs revascularization
        - AI plus CFD physiology on the same CCTA, guideline recognition, broad reimbursement, and deepest evidence base
        - Public sources still do not break out attach by account cohort or turnaround percentiles by case complexity.
      - - Plaque Analysis
        - Preventive cardiology, imaging readers, downstream treating physician
        - Commercial and expanding reimbursement / evidence base
        - Quantifies plaque burden and composition to guide risk management and preventive treatment
        - Prospectively validated versus IVUS and positioned as a preventive-management layer beyond stenosis alone
        - Public evidence still lacks product-level revenue, attach, and outcome durability by payer class.
      - - PCI Navigator
        - Interventional cardiologist
        - Launch-stage / expanding from registry and partnership evidence
        - Pre-PCI and intra-procedure planning with anatomy, physiology, and plaque in one view
        - Extends Heartflow from diagnosis into cath-lab planning without asking for a new imaging modality
        - Public proof of routine usage, active-site count, and systems required during live cases remains limited.
      - - Plaque Tracker
        - Preventive cardiology / longitudinal care teams
        - Roadmap item for 2027
        - Longitudinal comparison of sequential CCTAs to assess regression on therapy
        - Natural extension of Heartflow’s plaque quantification and nomogram work into disease monitoring
        - No public regulatory, clinical, pricing, or deployment detail yet.
      - - Heartflow Support
        - Program administrator, technologist, revenue-cycle lead, physician champion
        - Commercial service layer around every deployment
        - Builds and scales the CCTA + Heartflow pathway through training, integration, reimbursement, and case support
        - Makes adoption easier than a self-serve developer product and embeds Heartflow deeper into account operations
        - Service intensity could hide labor dependence that public materials do not quantify.
    notes: >-
      This table separates clearly commercial modules from bundled workflow layers and forward-looking
      extensions. Status labels reflect only reviewed public evidence and intentionally distinguish
      scaled availability from launch-stage and roadmap claims.
