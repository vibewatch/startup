    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Five-layer view of Heartflow’s public architecture, from CCTA acquisition through AI and
      physics processing, human quality control, clinical delivery, and trust/compliance controls.
    data:
      layers:
        - id: acquisition
          label: Acquisition layer
          detail: Previously acquired CCTA DICOM data enters from hospital or outpatient imaging programs.
          tone: neutral
        - id: ai-modeling
          label: AI + modeling layer
          detail: Deep learning and related machine-learning tools segment anatomy and generate the patient-specific 3D model.
          tone: positive
        - id: physiology
          label: Physics / quantitative layer
          detail: Computational fluid dynamics and derived analytics calculate FFRCT, blood flow, stenosis, and plaque metrics.
          tone: positive
        - id: qc
          label: Human QC + production layer
          detail: Analysts inspect and correct anatomy before final delivery; corrections become labels for later versions.
          tone: neutral
        - id: delivery
          label: Delivery + trust layer
          detail: Interactive web, PDF, PACS, and EMR outputs sit on top of encryption, de-identification, MFA/SSO, and quality controls.
          tone: positive
    approximationNotes: >-
      This figure is constrained to mechanisms explicitly described in the filing, FDA clearance, and
