  - id: deployment-integration-and-support-model
    title: Deployment, integration, reliability proxies, and support
    body: >-
      Heartflow’s deployment model is unusually service-heavy for a company often described as AI
      software. The support page is not an afterthought; it effectively describes the implementation
      playbook. Heartflow offers protocol and workflow recommendations for CCTA image quality,
      hands-on deployment of Heartflow One, PACS and EMR integration help, coding and reimbursement
      support, rate negotiation and claims-audit help, peer-to-peer education, and case-level clinical
      plus technical support. That package lowers adoption friction for hospitals and imaging centers,
      and it likely explains how the company could claim more than 1,465 U.S. accounts in late 2025
      and more than 1,800 institutions on current marketing pages. The trade-off is that public
      reliability evidence is mostly indirect. Heartflow markets a 90-minute median turnaround and
      patient pages emphasize that no extra scan, appointment, or radiation is required beyond the
      original CCTA, but the reviewed source set does not include a public status page, uptime history,
      incident disclosure archive, or hard external SLA language. The practitioner/developer signal is
      also thin. Public sources show integration claims and support contacts, but not open API docs or
      a public sandbox, so integration depth still appears account-managed rather than community-led.
    claimRefs:
