company:
  name: Heartflow
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Heartflow sells a software-and-services coronary-care workflow that starts with a previously
    acquired CCTA and returns anatomy, physiology, and plaque outputs inside clinician systems.
    The moat is not raw software alone but the combination of AI plus computational fluid
    dynamics, human-reviewed production operations, regulatory breadth, and a large annotated image
    asset; the main public diligence gaps are uptime/SLA evidence, developer-facing integration
    surface, and how much of PCI Navigator is already routine versus still launch-stage.
sections:
  - id: product-definition-and-workflow
    title: Product definition in real clinical workflow terms
    body: >-
      Heartflow is best understood as a post-processing operating layer on top of coronary computed
      tomography angiography rather than as a scanner, a PACS replacement, or a stand-alone cath-lab
      device. The workflow starts after a clinician orders and acquires a CCTA for a patient with
      suspected coronary artery disease. Heartflow’s official product pages and filing describe a
      secure transfer of previously acquired CCTA data into its cloud platform, where software turns
      that scan into a patient-specific 3D representation of the coronary tree and then returns
      clinically actionable outputs. In current marketing language, Heartflow One bundles four jobs:
      Identify disease with Roadmap, Decide with FFRCT, Manage with Plaque Analysis, and Build the
      program with support services. In practice, this means imaging readers receive an anatomic
      triage layer automatically, then order more detailed physiology and plaque modules as needed,
      with results delivered back through web, PDF, PACS, and EMR surfaces. The key product point is
      therefore workflow compression: one CCTA in, a staged set of anatomy, physiology, plaque, and
      treatment-planning outputs out, without asking the patient to undergo another non-invasive or
      invasive diagnostic test first.
    claimRefs:
      - CE001
