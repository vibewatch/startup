  - id: module-map-and-current-maturity
    title: Module map, SKU logic, and current maturity
    body: >-
      The module map is clearer in 2026 than it was when Heartflow was mainly an FFRCT company.
      Roadmap is the default interpretation layer and is explicitly described as bundled with every
      CCTA sent to Heartflow rather than as a separately sold product. FFRCT remains the flagship and
      still dominates public economics, because it provides lesion-specific physiology and uses the
      familiar invasive FFR threshold of 0.80 or below to identify clinically significant disease.
      Plaque Analysis is the second major commercial module, moving Heartflow from ischemia guidance
      into risk stratification and preventive management by quantifying plaque volume and composition.
      PCI Navigator is the next adjacency: filings and 2026 coverage frame it as a pre-PCI and
      intra-procedure planning tool that combines anatomy, physiology, and plaque localization in one
      interface, but public evidence still looks launch-stage rather than fully mature. Plaque
      Tracker is even earlier and remains a 2027 roadmap item for longitudinal regression tracking.
      That leaves Heartflow with one clearly scaled core product, one increasingly validated and
      reimbursed add-on, one bundled workflow enhancer, and two downstream/longitudinal roadmap
      extensions that deepen the same CCTA-centered platform rather than opening a new modality.
