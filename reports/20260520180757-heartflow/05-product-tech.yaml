  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-surface
      missingEvidence: Public API documentation, SDK or sandbox access, integration reference architecture, and any public status-page or webhook/event model.
      whyItMatters: >-
        Heartflow clearly advertises PACS and EMR integration, but the absence of a public technical
        surface makes it hard to judge how configurable, programmable, or self-service the deployment
        really is.
      diligencePath: >-
        Request the implementation checklist, interface spec, integration architecture, and a guided
        walk-through of any private developer or customer-administration portal.
      relatedQuestionRefs: [QE023]
    - type: missing-source
      severity: material
      topic: reliability-observability
      missingEvidence: Public uptime metrics, incident history, turnaround-percentile data by module, disaster-recovery details, and external SLA language.
      whyItMatters: >-
        Heartflow sits in a time-sensitive diagnostic workflow; without observable reliability
        evidence, investors cannot tell whether the service-heavy operating model introduces hidden
        bottlenecks or outage risk.
      diligencePath: >-
        Ask for status-history exports, SLA commitments, turnaround distributions, business-continuity
        documentation, and any post-market or customer-escalation summaries.
      relatedQuestionRefs: [QE024]
    - type: missing-source
      severity: material
      topic: pci-navigator-live-scope
      missingEvidence: Independent evidence on active PCI Navigator sites, case volumes, attach rates, and how much intra-procedure integration is required in routine practice.
      whyItMatters: >-
        Public sources show launch momentum, registry activity, and a major Banner partnership, but
        they do not yet prove repeatable scaled downstream adoption across many cath labs.
      diligencePath: >-
        Request general-availability date, active-site count, procedure count, attach-rate data, and a
        case study showing the exact systems and workflow used during live PCI.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE005]
