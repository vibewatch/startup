  - id: architecture-data-and-production-model
    title: Architecture, operating model, and data asset
    body: >-
      Public evidence supports a fairly specific operating architecture. Heartflow says the platform
      ingests previously acquired CCTA DICOM data, applies deep learning and other machine-learning
      models to segment anatomy, then runs computational fluid dynamics and related calculations to
      derive FFRCT, blood-flow, stenosis, and plaque outputs from a 3D computer model. The filing is
      explicit that this is not a pure lights-out software product: the production process includes a
      human-in-the-loop quality-control step where analysts review and correct extracted anatomy before
      final delivery, and those corrections become labeled data for later model generations. That
      design matters economically and strategically. It raises the implementation and labor footprint
      versus a fully self-serve SaaS product, but it also creates a feedback loop between deployed
      cases, annotations, and algorithm refinement. Heartflow says this loop has produced more than
      160 million annotated CCTA images and more than a decade of refinement, which is the closest
      thing the company has to a product-data moat. The strength is specificity: AI plus physics plus
      operational review. The risk is hidden dependence on production throughput, quality staffing, and
      internal tooling that remain mostly opaque in public materials.
