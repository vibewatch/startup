  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role in platform
      - Key dependency
      - Public evidence
      - Core risk
    rows:
      - - CCTA acquisition and ingest
        - Starts with previously acquired CCTA DICOM data and routes it into Heartflow workflow
        - Mature cardiac-CT program, scanner quality, and account connectivity
        - Filing and product pages say CCTA data is securely transferred to Heartflow cloud
        - Image-quality variance or incomplete site setup can reduce case acceptability and throughput.
      - - AI segmentation layer
        - Extracts coronary anatomy and other features from the scan to build the patient-specific model
        - Trained models and a large labeled image base
        - Filing says machine-learning algorithms segment CCTA data and extract anatomy
        - Public materials do not expose performance by scanner, geography, or edge-case anatomy.
      - - Human-in-the-loop QC
        - Production analysts inspect and correct segmentation before final delivery
        - Internal review tools and trained analysts
        - Filing explicitly describes analyst review and correction of extracted anatomy
        - Labor intensity and staffing throughput are not publicly disclosed.
      - - CFD and quantitative analytics
        - Computes FFRCT plus stenosis, plaque, pressure, velocity, and blood-flow outputs
        - Numerical methods, compute capacity, validated algorithms
        - Filing and FDA letter describe physiology simulation from the 3D model
        - Public evidence does not show module-level compute cost or failure-rate distribution.
      - - Delivery layer
        - Returns outputs through interactive web, PDF, PACS, EMR, and case-list workflow surfaces
        - Hospital IT integration and access controls
        - Filing, plaque, roadmap, and support pages all point to multi-format clinical delivery
        - No public API reference or sandbox explains what is configurable versus account-managed.
      - - Learning data asset
        - Stores analyst corrections as labels and improves later model generations
        - Bi-directional data sharing and long-run commercial case volume
        - Filing says corrections are stored as labels and the asset exceeds 160 million annotated images
        - External auditability of data-rights breadth and model-governance process is limited in public sources.
      - - Support and reimbursement operations
        - Wraps deployment, coding, and case support around the technical product
        - Customer success staffing and payer-policy maintenance
        - Support page advertises protocol help, integration, coding, appeals, and peer support
        - Services may be critical to adoption but obscure how self-serve the core software really is.
    notes: >-
      Architecture is limited to what public filing and product materials specifically describe. The
      table intentionally avoids unsupported claims about cloud vendors, latency guarantees, or model
      architecture details.
