- id: people-execution-risks
  title: People and Execution Risks
  body: 'Execution risk at Heartflow is less about a missing management bench than about coordination load across specialized
    functions. The company reported 843 full-time employees at year-end 2025 and says success depends on attracting and retaining
    highly skilled technology personnel. At the same time, growth now requires synchronized performance from AI engineering,
    quality/regulatory, information security, market access, revenue operations, production support, and customer success.
    Q1 2026 results show that Heartflow is still adding sales personnel and training production teams while also increasing
    technology and clinical-research spend, which means scale is still being bought, not yet fully harvested. That increases
    risk of onboarding lag, inconsistent field execution, or service bottlenecks during a period when plaque analysis, PCI
    planning, and broader workflow products are still being commercialized. The mitigation is real: Heartflow now discloses
    a deeper C-suite than many medtech peers, including dedicated leaders for legal and compliance, medical, technology, product,
    finance, operations, customer success, revenue, regulatory and quality, and reimbursement. That reduces classic single-founder
    fragility. Even so, the public narrative still centers heavily on CEO John Farquhar in earnings and product launches,
    so a leadership disruption or failure to coordinate this broad functional build-out would still hit growth, payer execution,
    and confidence simultaneously.'
