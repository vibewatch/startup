- id: partner-dependency-risks
  title: Partner and Dependency Risks
  body: 'Heartflow''s commercial model is deeply dependent on counterparties it does not control. Payers are the most obvious:
    FFRCT is broadly covered, but plaque still requires newly won national-commercial and MAC support to translate into routine
    use. The company therefore carries both policy risk and operational reimbursement risk, which is why Heartflow maintains
    a large coding, appeal, and market-access support function. Hospitals are the second major dependency. Heartflow says
    more than 1,800 institutions use the platform, which diversifies installed base, but the 10-K still warns that decision-making
    is concentrated enough that one customer loss can create disproportionate damage. Adoption also depends on PACS/EMR integration,
    CT program redesign, and clinical championing at the site level. The scanner and imaging ecosystem is a third dependency:
    Heartflow benefits from CCTA growth, but Canon, Siemens, GE, Philips, and other vendors increasingly market their own
    cardiac CT and post-processing capabilities, while plaque-analysis competitors such as Cleerly and newer entrants are
    using reimbursement momentum to close commercial gaps. Public-system and flagship-account wins such as NHS England rollout
    and Banner Health expansion help de-risk market acceptance, yet they also create concentration in reference accounts and
    raise the cost of any service failure. Residual exposure is therefore high even though the installed base is large, because
    payer, customer, and workflow dependencies all transmit directly into utilization and revenue.'
