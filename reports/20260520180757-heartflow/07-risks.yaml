- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Regulatory / MAUDE escalation
    - FDA MAUDE, warning-letter, recall, or new 510(k) disclosures
    - Any new warning letter, mandated recall, or cluster of serious adverse-event reports tied to a released algorithm
    - Re-underwrite product-quality assumptions and cut growth multiple until CAPA and regulatory closure are verified
  - - Plaque reimbursement disappointment
    - MAC/commercial policy updates and product-level denial rates
    - Plaque denials stay elevated or two major payers narrow criteria within 12 months
    - Reduce plaque adoption ramp and lower medium-term revenue expectations
  - - Material service interruption
    - Customer incident notices, cloud status, or delayed report turnaround
    - Multi-day outage or repeat SLA misses that materially delay physician reports
    - Treat as trust event; require postmortem, remediation budget, and customer-retention impact review
  - - Customer concentration shock
    - Renewal disclosures, reference-account loss, or abrupt account-utilization decline
    - Loss of a major reference account or evidence that one customer drives disproportionate revenue
    - Apply higher concentration discount and intensify customer diligence
  - - Competitive reimbursement parity
    - Coverage wins and feature launches from Cleerly or other plaque vendors
    - Two or more competitors achieve national-commercial parity without clear Heartflow differentiation
    - Reassess pricing power and attach lower gross-margin upside to plaque
  - - Execution overspend
    - Quarterly opex growth versus revenue growth
    - Sales / technology / clinical-support spend continues to outgrow revenue for three consecutive quarters
    - Delay profitability timing assumptions and widen downside scenario
  - - Leadership / bench disruption
    - Executive departures and reassignments
    - Departure of a critical reimbursement, quality, technology, or revenue leader without rapid replacement
    - Pause confidence upgrade until successor quality and operating continuity are clear
  notes: These triggers are designed to be externally monitorable where possible and to translate directly into underwriting
    actions rather than generic concern.
