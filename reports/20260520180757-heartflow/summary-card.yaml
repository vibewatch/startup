    headcount: 843
  topStrengths:
    - 'Real public operating proof: $176.0M of 2025 revenue, 41% Q1 2026 growth, and ~80% gross margin'
    - >-
      Installed-base and usage scale: 1,465 U.S. accounts, 1,800+ institutions globally, and nearly 650,000 patients
      served
    - >-
      Differentiated workflow stack that combines AI, computational fluid dynamics, regulatory breadth, and a large
      annotated CCTA data asset
    - >-
      Broad reimbursement and guideline support that make adoption easier than for many digital-health or imaging-AI
      peers
    - Post-IPO balance sheet with ~$254.9M of cash and investments reduces near-term financing risk
  topRisks:
    - >-
      FFRCT still represented 98% of 2025 revenue, so the second-engine plaque thesis remains more narrative than
      disclosed economics
    - Payer or MAC tightening around plaque reimbursement would directly hit the key upside case
    - >-
      Competition from Cleerly, Elucid, Keya, and OEM-adjacent workflows can narrow Heartflow's premium and pressure
      pricing
    - >-
      A cloud-mediated Class II medical-device workflow carries quality, regulatory, service-delivery, and litigation
      transmission risk
    - >-
      Retention, customer concentration, mature-account utilization, and realized pricing remain under-disclosed in the
      public record
  unresolvedGaps:
    - Product-level plaque revenue, attach, ASP, and gross margin remain undisclosed
    - Gross-to-net realization, denial rates, and payer-class collections are not publicly broken out
    - Mature-account utilization curves and expansion density by cohort are not publicly available
    - NRR, renewal timing, and top-customer concentration remain undisclosed
    - Public win-loss evidence versus Cleerly, Elucid, Keya, and in-house alternatives is still limited
    - Capital-allocation discipline by sales hiring, clinical spend, and payback remains unclear
