summary:
  headline: >
    Heartflow is a real, scaled public coronary-AI platform with strong growth, high gross margins, and meaningful
    installed-base proof, but at roughly 9x forward EV/revenue the shares already discount much of that quality before
    plaque economics, retention, and concentration are publicly visible.
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
