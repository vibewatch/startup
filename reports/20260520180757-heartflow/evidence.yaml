evidenceGaps:
  - type: missing-source
    severity: material
    topic: beneficial-ownership
    missingEvidence: >-
      A current proxy statement or large-holder filing showing insider, legacy-investor, and public-float ownership
      after the August 2025 IPO.
    whyItMatters: Control rights, board influence, and exit overhang cannot be assessed from pricing and biography sources alone.
    diligencePath: Pull the latest proxy, 13G/13D filings, and any lock-up or secondary disclosures from the SEC filings page.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: san-francisco-headcount
    missingEvidence: >-
      A post-relocation employee count or location mix confirming how many workers now sit in San Francisco versus
      legacy sites.
    whyItMatters: HQ relocation affects operating leverage, facilities strategy, and organizational concentration risk.
    diligencePath: Check later 10-Qs, investor presentations, and recruiting pages for updated site-specific headcount disclosures.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: product-revenue-mix
    missingEvidence: >-
      A disclosed split of current revenue between FFRCT, Plaque, PCI planning, and any service or international
      components.
    whyItMatters: >-
      Later market, customer, and valuation judgments need to know whether Plaque is truly becoming a second engine or
      remains a strategic adjacency.
    diligencePath: Ask management or review future earnings materials for module-level revenue or case-volume disclosures.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
      - FO003
  - type: missing-source
    severity: material
    topic: public-ccta-volume-sam
    missingEvidence: >-
      A public dataset linking annual U.S. CCTA procedure volume, eligible chest-pain cohorts, payer mix, and attach
      assumptions for FFRCT and plaque analysis.
    whyItMatters: >-
      Without that denominator, market sizing remains a set of credible proxies rather than a defendable TAM/SAM/SOM
      stack.
    diligencePath: >-
      Use CMS claims, commercial claims datasets, and society procedure statistics to build a bottom-up annual
      case-volume model.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: net-reimbursement-and-pricing
    missingEvidence: >-
      Contracted per-case pricing, denial rates, write-offs, and net reimbursement by payer class for Heartflow and
      major rivals.
    whyItMatters: >-
      Public list reimbursement alone does not reveal actual provider economics or whether the pathway remains
      attractive after denials and appeal workload.
    diligencePath: >-
      Interview provider customers, request anonymized reimbursement waterfalls, and compare against payer-policy
      criteria by account type.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM003
      - TM004
      - FM002
  - type: private-evidence-only
    severity: material
    topic: true-plaque-utilization
    missingEvidence: >-
      A disclosed breakdown of how many installed accounts order plaque routinely, occasionally, or not at all after
      installation.
    whyItMatters: >-
      Installed-base counts overstate commercialization progress if a large share of sites have capability enabled but
      minimal recurring use.
    diligencePath: >-
      Ask management or customer references for ordering frequency, active-user counts, and plaque attach by cohort over
      time.
    relatedQuestionRefs:
      - QM029
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Contracted per-site economics, minimum commitments, revenue-share terms, and discount ladders for Heartflow,
      Cleerly, Elucid, Keya, and Medis are not publicly disclosed.
    whyItMatters: >-
      Without real contract terms, pricing comparison can only rely on reimbursement anchors and anecdotal cash-pay
      examples, which weakens gross-margin and switching-cost inference.
    diligencePath: >-
      Request de-identified customer contracts, renewal quotes, and win-loss pricing summaries for representative
      outpatient imaging and hospital accounts.
    relatedQuestionRefs:
      - QP020
      - QP021
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: share-and-win-rates
    missingEvidence: >-
      Public sources do not quantify vendor-level win rates, attach rates inside the same site, or share of
      plaque-analysis volume by competitor.
    whyItMatters: >-
      Competitive durability depends on whether Heartflow is actually holding share in reimbursed plaque and FFR
      workflows rather than simply growing with the category.
    diligencePath: >-
      Ask management for competitive displacement data, renewal retention, and account-level attach by product and by
      competitor replacement scenario.
    relatedQuestionRefs:
      - QP022
      - QP024
      - QP026
  - type: missing-source
    severity: minor
    topic: oem-roadmaps
    missingEvidence: >-
      Reviewed OEM sources do not provide a complete apples-to-apples roadmap for plaque-analysis reimbursement,
      especially for vendors other than Siemens and Canon.
    whyItMatters: >-
      OEM bundling is a plausible medium-term risk, but the exact timing and scope of reimbursed competitive offerings
      remain uncertain.
    diligencePath: >-
      Review OEM product sheets, RSNA/SCCT launch decks, and direct customer references for Siemens, GE, Canon, and
      Philips cardiac AI roadmaps.
    relatedQuestionRefs:
      - QP003
      - QP019
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-access-and-multi-homing
    missingEvidence: >-
      The public record does not show how often hospitals run Heartflow alongside Cleerly, Elucid, Keya, or
      invasive-physiology tools in the same care pathway.
    whyItMatters: >-
      Multi-homing determines whether Heartflow can become the operating system of record or remains one analysis layer
      among many reimbursed options.
    diligencePath: >-
      Interview imaging directors and interventional cardiologists at mixed-vendor sites and request workflow
      screenshots, order volumes, and exception rules.
    relatedQuestionRefs:
      - QP017
      - QP022
      - QP026
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-waterfall
    missingEvidence: Net realized ASP by product, site type, payer, and rebate tier.
    whyItMatters: >-
      Public reimbursement reference points do not show the true gross-to-net revenue quality or whether ambulatory mix
      is compressing realized unit revenue.
    diligencePath: >-
      Request monthly gross billings, denials, appeals, rebates, and realized collections by FFRCT and Plaque for the
      last 12 months.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, quota attainment, and rep-productivity by TSM and TAM cohort.
    whyItMatters: >-
      Heartflow already spends heavily on SG&A, so investors need proof that incremental selling dollars create durable
      account usage rather than only new-logo optics.
    diligencePath: >-
      Request field-force cohort analysis showing hiring date, territory maturity, CAC, payback, pipeline conversion,
      and mature-account productivity.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: Gross retention, net revenue retention, and cohort expansion by account vintage.
    whyItMatters: >-
      A usage-driven model should get stronger as accounts mature, but that cannot be underwritten from installed-base
      counts alone.
    diligencePath: Request quarterly account cohorts showing case growth, attach expansion, churn, and contract-renewal history.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: plaque-revenue-proof
    missingEvidence: Product-level Plaque revenue, ASP, margin, and reorder data since reimbursement broadened.
    whyItMatters: >-
      Plaque is the clearest upside driver beyond FFRCT, but public evidence still stops at coverage, accounts, and
      clinical narrative.
    diligencePath: >-
      Request monthly Plaque revenue cases, attach rates, reorder behavior, gross margin, and account-level penetration
      since H2 2023.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: >-
      Public API documentation, SDK or sandbox access, integration reference architecture, and any public status-page or
      webhook/event model.
    whyItMatters: >-
      Heartflow clearly advertises PACS and EMR integration, but the absence of a public technical surface makes it hard
      to judge how configurable, programmable, or self-service the deployment really is.
    diligencePath: >-
      Request the implementation checklist, interface spec, integration architecture, and a guided walk-through of any
      private developer or customer-administration portal.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: reliability-observability
    missingEvidence: >-
      Public uptime metrics, incident history, turnaround-percentile data by module, disaster-recovery details, and
      external SLA language.
    whyItMatters: >-
      Heartflow sits in a time-sensitive diagnostic workflow; without observable reliability evidence, investors cannot
      tell whether the service-heavy operating model introduces hidden bottlenecks or outage risk.
    diligencePath: >-
      Ask for status-history exports, SLA commitments, turnaround distributions, business-continuity documentation, and
      any post-market or customer-escalation summaries.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: pci-navigator-live-scope
    missingEvidence: >-
