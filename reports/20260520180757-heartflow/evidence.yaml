    whyItMatters: >-
      Public sources show launch momentum, registry activity, and a major Banner partnership, but they do not yet prove
      repeatable scaled downstream adoption across many cath labs.
    diligencePath: >-
      Request general-availability date, active-site count, procedure count, attach-rate data, and a case study showing
      the exact systems and workflow used during live PCI.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
