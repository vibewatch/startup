  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Heartflow
    rows:
      - - Heartflow AI-assisted CCTA analysis
        - Per-analysis software interpretation, workflow support, and reimbursable FFRCT / plaque outputs
        - Scanner capital, cath-lab procedures, downstream drug spend
        - Health system imaging program; Medicare / commercial payer
        - Core market the company monetizes directly
      - - Baseline coronary CTA imaging
        - CT scan acquisition and reading program that enables later AI attach
        - Non-cardiac CT, MRI, echo, nuclear imaging unrelated to CAD workup
        - Radiology or cardiology service line; facility reimbursement
        - Necessary upstream workflow and budget owner
      - - CT OEM ecosystem
        - Cardiac CT scanner capability, post-processing, and workflow tooling
        - Pure AI analysis reimbursement unless bundled separately
        - Hospital capital committee / imaging leadership
        - Shapes whether CCTA capacity grows fast enough for Heartflow
      - - Traditional stress testing
        - SPECT, stress echo, PET, stress EKG workflows competing for the same diagnostic decision
        - CCTA-derived plaque or FFRCT analysis
        - Cardiology service line; standard payer coverage
        - Primary status-quo substitute per Heartflow filings
      - - Invasive angiography / catheterization
        - Definitive invasive diagnostic pathway and procedure planning
        - Non-invasive gatekeeping before cath
        - Interventional cardiology / hospital budget / payer
        - Remains a substitute when clinicians bypass non-invasive triage
    notes: >-
      Boundary is defined by who captures value at each stage of CAD evaluation; the table distinguishes Heartflow's
      monetized analysis layer from adjacent scanner, test, and invasive-procedure spend.
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM006
      - CM029
      - CM030
      - CM049
      - CM051
  - id: TM002
    title: Evidence-constrained sizing lens table
    columns:
      - Lens
      - Publisher / year
      - Geography
      - Value
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Disease-burden lens
        - Heartflow / current patient page
        - U.S.
        - CAD described as taking one in five U.S. lives
        - Uses disease prevalence and mortality burden to show why earlier detection matters
        - medium
        - Too broad to equal Heartflow-revenue opportunity
      - - Installed-base lens
        - Heartflow FY2025 results
        - U.S.
        - 1,465 installed accounts
        - Counts disclosed enabled accounts rather than total CCTA-capable sites
        - medium
        - Installed accounts are not the same as annual ordering volume
      - - Plaque attach lens
        - Heartflow FY2025 results
        - U.S.
        - 489 plaque accounts (~33% of installed base)
        - Compares disclosed plaque-installed accounts with total installed accounts
        - medium
        - Says nothing about frequency of plaque use inside those accounts
      - - Coverage lens
        - Heartflow 10-K / Aetna / CMS commentary
        - U.S.
        - FFRCT ~99% covered lives; Plaque ~75% covered lives plus all-seven-MAC coverage construct
        - Uses payer access as a proxy for serviceable demand
        - high
        - Coverage breadth does not guarantee claim approval or ordering behavior
      - - Revenue-engine lens
        - Heartflow FY2025 and Q1 2026 results
        - Global with U.S. concentration
        - Growth primarily driven by U.S. FFRCT volume
        - Uses disclosed revenue driver to identify the currently monetized submarket
        - high
        - Does not isolate total CCTA market or future plaque mix
    notes: >-
      This chapter intentionally uses multiple public lenses instead of one synthetic TAM number because annual CCTA
      volume, approval rates, and attach assumptions are not fully public.
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM025
      - CM029
      - CM050
