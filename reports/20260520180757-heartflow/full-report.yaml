      - number: '3.3'
        title: Pricing signals, GTM power, switching cost, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Public pricing visibility is poor, so the cleanest comparison is not list price but the reimbursement and
              workflow structure each vendor brings to market. Heartflow has the strongest public reimbursement footing,
              with broad FFRCT coverage, substantial plaque coverage, and a mature direct-sales and customer-success
              model. Cleerly and Elucid now benefit from the same plaque reimbursement tailwind, but neither publishes
              net contract pricing in the reviewed source set. Keya makes a different pitch: it stresses patient- and
              payer-centric pricing, no scanner certification, and the ability to run analysis remotely or on site,
              which lowers deployment friction and may make it easier for a site to trial DVFFR next to existing tools.
              Medis and OEM ecosystems compete differently again; their advantage is channel access. GE’s partnership
              with Medis shows how incumbents can pull physiology software into established interventional sales motion,
              while Siemens and Canon already sit close to scanner procurement and cardiac CT workflow design. That
              means Heartflow’s switching cost is meaningful after go-live—because billing support, workflow
              integration, case lists, and physician habits accumulate around the installed account—but not absolute. A
              hospital can still multi-home by keeping a CCTA program, using Heartflow for some cases, testing Cleerly
