      - number: '1.4'
        title: Milestones, reimbursement expansion, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company with real product and commercial momentum, but not a finished risk
              profile. Independent retrospective coverage credits Heartflow's first FFRCT product with U.S. commercial
              availability in 2014, while the FDA's K190925 record confirms 2019 clearance for HeartFlow FFRct Analysis.
              By 2021-2025 the company extended beyond physiology into Roadmap, Plaque, and later PCI planning, with
              external coverage in September 2025 documenting next-generation plaque clearance and a 21% claimed
              detection improvement over the first-generation algorithm. Reimbursement momentum also improved
              materially: Heartflow emphasized growing payer coverage for plaque analysis, Banner became a visible
              customer and later a broader strategic partner, and trade press argued that new CMS and CPT economics
              should accelerate CCTA-based adoption. But this is also where the most useful adverse evidence sits. The
              2025 10-K warns that Heartflow still depends heavily on FFRCT, faces significant competition, and is
              generating only very limited revenue from a still-nascent Plaque commercialization effort. Independent
              reporting adds a second risk lens: the new AI plaque reimbursement codes are attracting scrutiny about
              whether four-figure payments are justified by clinical and economic benefit. The April 2026 patent case
              against Cleerly reinforces that this is now an active competitive category rather than a field Heartflow
              owns uncontested.
