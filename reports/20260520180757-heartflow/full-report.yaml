  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and geographic segmentation
        blocks:
          - type: paragraph
            body: >-
              Heartflow is not sold into a generic enterprise IT budget; it is sold into cardiac-imaging programs that
              already run coronary CTA and can therefore order analysis on top of an existing scan. The practical buyer
              is usually a hospital, health-system, outpatient imaging center, or cardiology service line that has to
              justify workflow change, reimbursement mechanics, and clinical champion support. The users are more
              fragmented: imaging cardiologists or radiologists need a faster first read, ordering or preventive
              cardiologists need physiology and plaque outputs to guide medical management, and interventional
              cardiologists increasingly use the same data for PCI planning. Payers matter because Heartflow’s public
              reimbursement pages now frame Plaque and FFRCT as covered by Medicare and multiple national insurers,
              making coverage breadth part of the product story rather than a background assumption. Geography is also
              broader than a U.S.-only marketing footprint: Heartflow’s own pages say the platform is commercially
              available in the United States and selected international markets, while NHS England provides the clearest
              external proof that non-U.S. deployment is more than a nominal clearance story.
