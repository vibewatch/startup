        title: Cost structure, gross-margin drivers, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s public numbers show a company with genuine gross-margin progress but a still-heavy
              operating-cost structure. Full-year 2025 gross margin reached 76.8%, then 80.2% in the first quarter of
              2026, with management attributing expansion to higher case volume and AI-driven productivity improvements
              inside the production team. The 10-K is useful because it explains what sits beneath that margin:
              production labor, hosting, software amortization, contract-fulfillment amortization, royalty payments, and
              facilities or technology overhead. That is better than a hardware business, but it is not pure software
              either because the production workflow still carries meaningful labor and quality-control components.
              Meanwhile operating expenses remain large. R&D was about 37% of 2025 revenue and SG&A about 76%, so even
              strong gross margin does not yet translate into profitability. The first quarter kept that pattern alive,
              with operating expenses at 136% of revenue and a reported operating loss inflated by the headquarters-move
              impairment. The margin path therefore looks directionally positive, especially if Plaque adds incremental
              revenue on the same scan, but Heartflow still needs labor automation and better sales efficiency to turn
              high gross margins into durable earnings power.
