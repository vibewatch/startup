      - number: '4.4'
        title: Liquidity, obligations, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s near-term capital picture looks much stronger than its GAAP losses alone would imply because
              2025 recapitalized the balance sheet. The company finished 2025 with $280.2 million of cash, cash
              equivalents, and investments and still reported $254.9 million at March 31, 2026. That liquidity was built
              by a balance-sheet reset: roughly $332.4 million of net IPO proceeds, $72.8 million of net proceeds from
              the 2025 convertible notes, and then automatic note conversion plus a $115.1 million term-loan repayment.
              Public market data now values the company near $2.3 billion, which makes fresh equity available in
              principle if growth remains credible. The important nuance is that Heartflow is not capital-light in every
              sense. Operating cash usage was still $54.0 million in 2025, lease commitments totaled $26.5 million, and
              the company took a 2026 impairment tied to vacating or resizing the Mountain View footprint before
              arranging a sublease. Even so, public data suggests a multi-year runway rather than an immediate financing
              dependency, especially because property-and-equipment spend was only $5.0 million in 2025 and royalty
              obligations are modest. The underwriting question is therefore not survival, but whether the current cash
              buffer is being converted into durable product mix and sales-efficiency improvements before investors lose
              patience.
