  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / set
      - Public pricing signal
      - Commercial model
      - Included capabilities
      - Unknown / caveat
      - Implication
    rows:
      - - Heartflow
        - >-
          Public reimbursement anchors exist: 75580 around $1,017 for 2025 and plaque reimbursement near $951 OPPS /
          ~$1,021 office-equivalent market anchors
        - Direct B2B software sale with account billing and ordered add-on analyses
        - RoadMap baseline plus on-demand FFRCT and Plaque; PCI Navigator expansion
        - Net contract price, discounting, and bundle structure are not publicly disclosed
        - Strong reimbursement footing helps sales, but true unit economics cannot be benchmarked from public sources
      - - Cleerly
        - >-
          No public list price in reviewed sources; public value signal comes from coverage wins and Medicare-aligned
          plaque criteria
        - Enterprise/provider and payor-oriented software contracting
        - Plaque, stenosis, ischemia, compare review layer
        - Per-analysis or subscription terms were not publicly disclosed on reviewed sources
        - Coverage momentum is visible, but pricing power versus Heartflow is still opaque
      - - Elucid
        - Public 2026 plaque payment signal of about $1,021 office / $951 OPPS via 75577
