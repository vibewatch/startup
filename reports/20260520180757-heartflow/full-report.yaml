  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Heartflow's highest-severity risk is not the absence of regulatory approval, but the obligation to keep a
              rapidly evolving software platform inside its approved and reimbursable perimeter. FDA cleared Heartflow
              Analysis under K250902 in July 2025 as a Class II device and explicitly tied post-market operation to
              Quality System requirements, labeling rules, and medical device reporting. Heartflow's own 10-K goes
              further: if FDA disagrees with the company's internal view that a change falls inside existing clearance
              or PCCP boundaries, the agency can require a new filing, stop marketing of a modified product, or force a
              recall. The same filing discloses prior MAUDE reports involving false negatives and imprecise results,
              even though none had resulted in a recall as of the 2025 filing. Commercial risk is tightly coupled to
              regulation. FFRCT reimbursement is mature, but plaque reimbursement only became meaningfully national in
              late 2025 and 2026, with five of seven MACs covering it and two still case-by-case. That creates a live
              risk that coding, medical-necessity criteria, or payer economics tighten before utilization is proven.
              Heartflow's April 2026 patent suit against Cleerly shows the company is defending its moat, but litigation
              also creates cost, management distraction, and countersuit exposure. The legal and regulatory bench is
              stronger than a typical growth-stage medtech, yet residual exposure remains high because quality,
              reimbursement, and IP are all thesis-critical.
            claimRefs:
