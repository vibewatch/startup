  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Higher baseline CCTA reimbursement
        - Positive
        - 2025 onward
        - Makes it easier for sites to justify building and staffing CCTA programs
        - Measure whether local payer contracts actually moved with CMS benchmarks
      - - Category I reimbursement for FFRCT and Plaque
        - Positive
        - 2024 for FFRCT; 2026 for Plaque
        - Turns advanced analysis into a reimbursable workflow rather than a pure cash-pay add-on
        - Review denial rates, prior-auth burden, and site-level net reimbursement
      - - Guideline support plus clinical evidence
        - Positive
        - Current
        - Helps payers and clinicians treat CCTA plus AI as pathway infrastructure rather than experimental software
        - Separate marketing claims from outcome-backed evidence in local sales conversations
      - - Workflow automation and service support
        - Positive
        - Current
        - RoadMap, PACS / EMR integration, and reimbursement support lower operational friction
        - Check whether support intensity is scalable as installed base grows
      - - Physician behavior change risk
        - Negative
        - Current
        - Entrenched stress-testing and cath-lab habits can slow adoption even when reimbursement exists
        - Interview high-volume sites about ordering behavior before and after go-live
      - - Value skepticism and plaque commercialization risk
        - Negative
        - Current
        - >-
          Four-figure AI reimbursement and still-nascent plaque revenue invite scrutiny from payers and hospital finance
          teams
        - Track whether plaque orders grow faster than installed capacity and whether policy terms tighten
    notes: >-
      This table mixes catalysts and barriers because adoption depends on the interaction between payer economics,
      clinical confidence, and operational readiness rather than on any single factor.
    claimRefs:
