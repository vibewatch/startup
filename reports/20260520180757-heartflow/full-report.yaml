chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and product stack
        blocks:
          - type: paragraph
            body: >-
              Heartflow is a coronary-care software company that says its mission is to turn coronary artery disease
              from the leading cause of death into a condition that can be detected early, diagnosed accurately, and
              managed for life. The company was incorporated in Delaware in 2007 as Cardiovascular Simulation, changed
              its name to HeartFlow in 2009, and by 2025 consolidated its holding-company structure back into Heartflow,
              Inc. The operating concept has stayed consistent: start with a coronary CTA scan, generate a
              patient-specific 3D model, and deliver software outputs that clinicians can use across detection,
              physiology, plaque assessment, and procedure planning. Heartflow now bundles that stack as Heartflow One,
              with Roadmap Analysis for lesion review, FFRCT Analysis for non-invasive physiology, Plaque Analysis for
              plaque volume and composition, and PCI Navigator for interventional planning. A notable identity nuance
              for later chapters is headquarters drift across source dates: the 2025 10-K still listed Mountain View as
              the principal executive office, while 2026 product and investor pages display a San Francisco address and
              first-quarter results tied the move to facilities optimization.
