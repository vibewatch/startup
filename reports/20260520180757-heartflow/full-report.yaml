      - number: '7.5'
        title: Financial and Model Risks
        blocks:
          - type: paragraph
            body: >-
              Heartflow is growing quickly, but the financial model still carries meaningful concentration and
              proof-of-profitability risk. Q1 2026 revenue rose 41% year over year to $52.6 million, and the company
              raised full-year guidance to $228-$232 million, yet it still posted a $29.5 million operating loss and
              held $254.9 million of cash and investments rather than positive free cash flow. The near-term model
              remains anchored on U.S. FFRCT volume, which the company itself identifies as a single-product dependence
              risk, while plaque commercialization is explicitly described in the 10-K as nascent. That means investors
              are effectively underwriting continued flagship volume growth plus successful reimbursement conversion on
              a newer product set. The cost side is also live: sales hiring, production training, technology investment,
              clinical evidence generation, litigation, and security/quality overhead all consume operating leverage.
              Market risk compounds that pressure. STAT's reimbursement critique shows payer or physician backlash is
              plausible if AI pricing appears ahead of proven value, while Cardiovascular Business and Cardiac Wire both
              show that reimbursement is attracting more well-funded entrants into plaque analysis. Mitigation exists in
              the form of strong gross margins, a large installed base, and public-system/customer proof, but residual
              exposure remains medium-high because profitability depends on utilization density, reimbursement
              durability, and competition staying rational at the same time.
