  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role / position
      - Background or founder-market fit
      - Key-person dependency
    rows:
      - - John Farquhar
        - President, CEO, director
        - Medtronic operator who joined Heartflow in Aug. 2021, became president Jan. 2022, and CEO Mar. 2022
        - High – public-company execution, investor messaging, and commercial scaling concentrate around him
      - - John Stevens, M.D.
        - Co-founder; vice chair after 2022 transition
        - Longtime executive and clinical founder who remained on the board after stepping out of the CEO role
        - Medium – founder continuity and category credibility still matter even if he no longer runs daily operations
      - - Charles Taylor, Ph.D.
        - Co-founder / scientific originator
        - >-
          Computational medicine pioneer credited with developing the blood-flow simulation work that created
          Heartflow's first product category
        - Medium – technical narrative and IP heritage remain closely tied to his work
      - - William C. Weldon
        - Chair of the board
        - Former Johnson & Johnson chairman and CEO, adding medtech governance depth
        - Medium – governance anchor rather than day-to-day operator
      - - Tim Barabe
        - Director
        - Finance and life-sciences operating background across Affymetrix and Novartis
        - Low
      - - Julie Cullivan
        - Director
        - >-
          Enterprise-scale operating and cybersecurity background across Forescout, FireEye, Autodesk, McAfee, EMC, and
          Oracle
        - Low
      - - Jeffrey C. Lightcap
        - Director
        - HealthCor Partners investor representative with healthcare-focused private-equity background
        - Low
    notes: >-
      Table is bounded to publicly disclosed founders and current board/management figures most relevant to
      company-overview diligence; it is not a full officer-by-officer org chart.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the founder and governance-critical leadership names explicitly disclosed in retained public
