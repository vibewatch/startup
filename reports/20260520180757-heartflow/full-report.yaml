        title: Leadership, founders, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Heartflow's current operating leadership is centered on President and CEO John Farquhar, who officially
              took the CEO role on March 1, 2022 after joining as chief operating officer in August 2021 and becoming
              president at the start of 2022. His biography and the transition release frame him as the commercial
              scaling executive for the public-era chapter, while co-founder John Stevens shifted to vice chair and
              remains important as a board-level continuity figure. Founder-market fit still matters because the
              technical origin story is unusually strong: Charles Taylor, the computational-science co-founder, is
              independently described as the architect of the non-invasive blood-flow simulation work that created
              Heartflow's first product category. Governance is also unusually heavyweight for a medtech software
              company of this size. The board chair is former Johnson & Johnson chief executive William C. Weldon, and
              the public about page also identifies directors including Tim Barabe, Julie Cullivan, Jeffrey Lightcap,
              Wayne Riley, and Casey Tansey. That mix suggests board coverage across medtech operations, healthcare
              investing, enterprise scale-up, and policy, but it also highlights key-person dependence on Farquhar for
              execution and on the founding technical narrative for product credibility.
