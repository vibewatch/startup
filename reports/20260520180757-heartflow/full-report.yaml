      - number: '6.4'
        title: Durability, repeat usage, and what public evidence cannot prove
        blocks:
          - type: paragraph
            body: >-
              The strongest durability signal is structural rather than statistical. Heartflow says revenue is generated
              each time a physician chooses to review FFRCT, Plaque, or both, so a live account can keep generating
              revenue as long as clinicians keep ordering cases. The company also says RoadMap is bundled to improve
              customer loyalty and that support services include coding help, rate negotiation, PACS and EMR
              integration, peer education, and case-level support. Those are classic land-and-expand tools: reduce
              initial friction, win clinician trust, then raise recurring case volume and add Plaque on top of the same
              scan. Public evidence also suggests real repeat use because 2025 and Q1 2026 growth were both tied to U.S.
              FFRCT volume. But there is an equally important absence: the reviewed public set does not disclose NRR,
              GRR, logo retention, contract length, renewal cohorts, or representative satisfaction samples. That means
              the chapter can support a plausible recurring-usage thesis, not a proven retention thesis.
