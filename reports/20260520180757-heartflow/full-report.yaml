      - number: '5.5'
        title: Differentiation, trust controls, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s differentiation is credible, but it is not unchallenged. The strongest product edge visible in
              public evidence is the combination of regulatory breadth, clinical evidence, installed-base scale, and
              data/annotation depth around one CCTA-centered workflow. The company can credibly say it spans anatomy,
              physiology, plaque, and support services, while filings show a large patent estate across FFRCT, Plaque,
              and Roadmap methods. It also discloses concrete trust controls: encryption in transit and at rest, MFA and
              SSO, granular authorization, de-identification of PHI for processing, and certifications including
              HITRUST, ISO 27001, ISO 13485, SOC 2 Type 2, and UK CyberEssentials. FDA history is also meaningful, from
              the 2014 de novo for FFRCT to the 2025 K250902 clearance covering the broader Heartflow Analysis feature
              set. Still, the chapter is not a clean win. Cleerly and other cardiac-CT vendors now contest the plaque
              and interpretation narrative, Heartflow is actively defending its IP in litigation, and the company still
              does not publish enough public detail on uptime, developer-facing integration, or the scaled live usage of
              PCI Navigator to eliminate execution risk. The roadmap looks coherent, but public maturity still falls by
              module.
