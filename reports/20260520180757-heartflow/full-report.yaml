      - number: '2.2'
        title: Buyer, user, payer, and workflow economics
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for Heartflow is usually the health system or imaging program that must justify
              building and sustaining a high-quality CCTA workflow, but the daily users span imaging cardiologists,
              radiologists, preventive cardiologists, and increasingly interventional teams. Heartflow's own disclosures
              make clear that commercialization is not just an algorithm sale: RoadMap is delivered automatically, FFRCT
              and Plaque are ordered selectively, and the company supports coding, appeals, rate negotiation, PACS and
              EMR integration, and peer-to-peer education. Reimbursement changes materially improved the adoption case.
              CMS lifted baseline CCTA payment for 2025, FFRCT reimbursement remained above $1,000, and plaque analysis
              received Category I coding plus broader payer coverage. Even so, the purchase still requires hospital
              workflow redesign, physician confidence, and a budget owner willing to treat CCTA plus AI as a
              programmatic pathway rather than a one-off interpretation service.
