      - number: '1.3'
        title: Public-market status, revenue scale, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Heartflow crossed from venture-backed medtech startup into public company territory in August 2025, when
              it priced 16.7 million IPO shares at $19.00, raised expected gross proceeds of about $316.7 million, and
              began trading on Nasdaq under the ticker HTFL. That IPO matters because it resets the capital story from
              opaque venture financing to a public-equity base with daily market pricing and formal quarterly
              disclosure. The first two public earnings releases already give later chapters reusable operating anchors:
              full-year 2025 revenue was $176.0 million with 76.8% gross margin, and first-quarter 2026 revenue reached
              $52.6 million with 80.2% gross margin, while cash and investments remained above $250 million. Scale
              indicators are also unusually explicit for a company at this stage. Heartflow said adoption exceeded 1,800
              institutions globally and nearly 650,000 patients by May 2026; year-end 2025 disclosures also cited a
              1,465-account U.S. installed base and 489 U.S. Plaque accounts. Market-cap snapshots around May 19-20,
              2026 placed equity value near $2.33 billion. The main missing piece is exact post-IPO beneficial ownership
              by legacy investors, insiders, and public float, which limits any strong control-rights conclusion from
              public sources alone.
