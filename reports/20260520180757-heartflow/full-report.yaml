        - Track
        - >-
          The company quality is real, but the current public price does not leave enough asymmetric upside for an
          immediate buy call.
      - - Confidence
        - Medium
        - >-
          Revenue, margin, cash, and installed-base data are solid, but product-level mix, retention, and realized
          pricing remain under-disclosed.
      - - Risk rating
        - High
        - >-
          Single-product dependence, payer sensitivity, competitive narrowing, and quality or regulatory transmission
          risk remain material.
      - - Valuation stance
        - Fair
        - A premium is justified by growth and gross margin, but the stock already prices in strong execution.
      - - Current public snapshot
        - ~$2.33B market cap, ~$2.08B EV, ~$27.08/share, ~9.0x 2026 EV/revenue
        - This is the actual starting point the IC must underwrite rather than a generic quality score.
