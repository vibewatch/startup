      - number: '6.3'
        title: 'Named customer proof: what is clearly live versus merely referenced'
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s named-customer proof is real but uneven. Banner Imaging is the cleanest U.S. proof point
              because the customer itself said Heartflow was offered at seven imaging locations in 2024, and AuntMinnie
              later reported a deeper 2026 Banner partnership that brings the workflow into hospital CT assessment and
              PCI planning. NHS England is the cleanest public-system reference because it gives deployment count,
              patient count, savings, and longitudinal rollout timing from a customer-side source rather than from
              Heartflow’s own marketing. By contrast, several other references are supportive but softer: Heartflow’s
              platform page includes a named Sutter Health cardiologist quote, the support page includes a WellStar
              executive quote, and the GAMEFILM page lists Image One and other participating sites. Those references
              show real clinician or site engagement, but they do not disclose order volume, contract status, or whether
              the deployment is system-wide versus champion-led. The patient-stories page is even weaker for enterprise
              underwriting: it is useful evidence that physicians and patients saw value, but it does not prove durable
              customer economics.
