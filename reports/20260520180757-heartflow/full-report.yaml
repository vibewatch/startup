      - number: '8.5'
        title: Recommendation, entry discipline, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The investment-committee conclusion is track, not avoid and not buy. The company is exit-ready in the
              public-market sense because it already trades, has cleaned up pre-IPO financing overhang, and still
              carries enough liquidity to fund execution. But thesis completeness remains lower than company quality.
              The committee should want one of two things before upgrading: either a materially better entry, closer to
              7x 2026 midpoint EV/revenue and roughly $21.78 per share, or materially better evidence that plaque is a
              revenue engine with defensible unit economics. The thesis breaks if revenue growth slips below 20% despite
              stable coverage, if payer or MAC policies tighten around plaque pricing, or if quality, regulatory, or
              litigation events interrupt physician trust. Final diligence should focus on product-level plaque revenue,
              gross-to-net realization, denial rates, mature-account utilization, retention, and customer concentration.
              Until those items are visible, current pricing offers only moderate upside against a real downside path,
              which is exactly the setup for a monitored watchlist position rather than a decisive entry.
