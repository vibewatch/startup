companyProfile:
  summary: >
    Heartflow is a public cardiovascular software company founded in 2007 that analyzes previously acquired coronary CT
    angiography (CCTA) scans to help clinicians identify anatomy, physiology, plaque burden, and PCI-planning
    implications from a single workflow. The company went public in August 2025 under ticker HTFL, reported $176.0
    million of 2025 revenue, and by May 2026 said it had been adopted by more than 1,800 institutions and used in nearly
    650,000 patients worldwide. Heartflow's strongest strategic advantage is a regulated, workflow-embedded platform
    with broad reimbursement and real clinical adoption; the key caveat preserved across the report is that plaque
    remains strategically important but still under-disclosed and only a very small revenue contributor in public
    filings.
  foundedDate: '2007-01-01'
  founders:
    - name: Charles Taylor
      role: Co-founder
      background: >
        Independent university and NSF profiles credit Taylor with co-founding Heartflow and developing the non-invasive
        blood-flow simulation technology behind the company's original category.
      claimRefs:
        - CO016
    - name: John Stevens
      role: Co-founder; former CEO and current vice chair
      background: >
        Company disclosures identify Stevens as a co-founder and former chief executive who remained vice chair of the
        board after the March 2022 CEO transition.
      claimRefs:
        - CO015
  headquarters: San Francisco, California, USA
  productSummary: >
    Heartflow Analysis / Heartflow One is AI-based medical-device software that takes an existing adult CCTA study,
    securely transmits it into Heartflow's cloud workflow, and returns a patient-specific 3D coronary model with Roadmap
    lesion visualization, FFRCT physiology, plaque characterization, and newer PCI-planning support. The technical
    differentiation described across the report is the combination of deep learning, computational fluid dynamics,
    human-reviewed production operations, and delivery back into clinician systems such as PACS and EMR.
  customerFocus: >
    Heartflow's practical buyers are hospitals, health systems, and imaging-center programs that already run CCTA
    workflows, while the day-to-day users span imaging cardiologists or radiologists, ordering and preventive
    cardiologists, and interventional cardiologists. The payer surface now includes Medicare and major commercial
    insurers, which materially lowers adoption friction versus earlier years.
  businessModel: >
    Revenue is primarily usage-driven and paid on a pay-per-click basis when a physician chooses to review FFRCT
    Analysis, Plaque Analysis, or both, with revenue recognized when the requested analysis is delivered. Roadmap is
    generally positioned as an integrated workflow feature rather than a stand-alone SKU, and Heartflow supplements the
    software with reimbursement, integration, and clinical-support services.
  stage: Public
  fundingStatus: >
    Heartflow became a public company through its August 2025 IPO, pricing 16.67 million shares at $19.00 for expected
    gross proceeds of approximately $316.7 million before fees. The balance-sheet cleanup also included automatic
    conversion of the 2025 convertible notes at the IPO.
