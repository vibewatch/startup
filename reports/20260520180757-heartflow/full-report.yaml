  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / observable event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth stall
        - Two consecutive quarters with <20% year-over-year revenue growth while reimbursement remains stable
        - Implies utilization density or attach is weaker than the platform thesis assumes
        - Downgrade to stretched and revisit bear-case weighting immediately
      - - Plaque reimbursement tightening
        - Any commercial-payer rollback, MAC narrowing, or materially worse denial pattern around plaque analysis
        - Hits the second-engine thesis directly and weakens base-case multiple support
        - Cut scenario multiple range and pause any upgrade
      - - Quality or regulatory event
        - >-
          A recall, warning-letter-like event, or meaningful new adverse quality signal tied to Heartflow analysis
          outputs
        - Would damage physician and payer trust, not just near-term operations
        - Move to avoid unless remediation and commercial impact are clearly bounded
      - - Competitive reimbursement parity
        - Direct peers sustain broader reimbursement and commercialization without Heartflow showing better economics
        - Turns Heartflow from category creator into one option among many
        - Reduce premium assumption toward public-comp median
      - - Capital-markets dependence returns
        - Follow-on financing needed before product-mix or leverage proof is visible
        - Reintroduces dilution risk into a story currently justified partly by capital-structure cleanup
        - Demand lower entry price or wait
      - - Leadership or litigation shock
        - Major leadership disruption or litigation outcome that impairs commercialization
        - Raises execution and moat risk at the same time
        - Re-underwrite moat durability and management depth before holding
    notes: >-
      Every trigger is observable from public filings, payer policy updates, management reporting, or legal developments
      rather than from vague sentiment checks.
    claimRefs:
      - CV018
      - CV031
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Plaque revenue
        - Public disclosures do not break out plaque revenue, ASP, attach, or gross margin
        - The upside thesis depends on plaque becoming a second engine rather than a reimbursement headline
        - Request monthly product-level revenue, case count, ASP, and gross-margin bridge under NDA
      - - Gross-to-net and denials
        - No public gross-to-net waterfall or denial-rate disclosure by payer class exists
        - High nominal reimbursement does not equal realized unit economics
        - Request paid, denied, appealed, and collected rates for FFRCT and plaque by payer class
      - - Mature-account utilization
        - Public data discloses installed accounts but not mature cohort throughput or expansion curves
        - The stock should be valued on durable density, not just on logo count
        - Request cohort utilization and attach by account vintage and site type
      - - Retention and concentration
        - NRR, top-customer concentration, and renewal timing remain undisclosed
        - Premium multiple support depends on sticky usage and manageable customer concentration
        - Request top-10 customer share, contract duration, and cohort retention data
      - - Plaque competitive economics
        - Competitor reimbursement and funding are visible, but direct comparative win rates are not
        - Without comparative conversion data, it is easy to overstate moat durability
        - Ask for win-loss analysis against Cleerly, Elucid, Keya, and in-house alternatives
      - - Capital allocation
        - Public evidence shows cash and cleanup, but not the hurdle rate for sales hiring or clinical spending
        - The next multiple turn should come from more efficient growth, not just more spend
        - Review budget by growth initiative, headcount plan, and payback expectations before taking a stronger view
    notes: >-
      These asks are intentionally concrete and monitorable because the remaining debate is about economics and
      durability, not product existence.
    claimRefs:
      - CV014
      - CV018
      - CV031
      - CV039
      - CV040
      - CV044
