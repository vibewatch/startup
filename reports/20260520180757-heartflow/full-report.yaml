      - number: '7.2'
        title: Operational, Quality, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Heartflow is a software-heavy medtech business whose value depends on delivering correct,
              fast, and workflow-compatible outputs inside hospital care pathways. The 10-K states that past software
              code and release-process defects caused intermittent interruptions to physician use, and it also discloses
              historic MAUDE reports involving false negatives and imprecise readings. That matters because physician,
              patient, and payer confidence is a core adoption variable. The company has meaningful mitigations:
              encryption at rest and in transit, de-identification of sensitive data, annual cyber risk assessment,
              quarterly Audit Committee oversight, and certifications including HITRUST, ISO 27001, ISO 13485, and SOC 2
              Type 2. But the same filing says Heartflow depends on outsourced AWS cloud infrastructure, third-party
              service providers, and production-related computing concentrated in California and Texas. A cloud outage,
              cyber event, or local disaster can delay report delivery and damage trust. Workflow dependence is equally
              real. Heartflow must ingest customer CCTA studies, integrate with PACS and EMR environments, and help
              sites improve image quality and reading efficiency; if that enablement slips, utilization can stall even
              when reimbursement exists. External inputs also matter: Heartflow itself cites the 2022 iodinated contrast
              shortage as evidence that supply disruption can reduce CCTA volumes. Q1 2026 results add a further
              execution signal because gross-margin gains were partially offset by hiring and training production
              personnel while the company also absorbed a facilities impairment during headquarters relocation.
