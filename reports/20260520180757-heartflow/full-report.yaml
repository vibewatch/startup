      - number: '8.3'
        title: Bull, base, and bear range logic
        blocks:
          - type: paragraph
            body: >-
              Scenario math is more informative here than a single-point target. The bear case assumes 2027 revenue only
              reaches $245 million to $255 million because plaque monetization disappoints, competitive coverage
              compresses pricing power, and the market assigns only 4.5x to 6.0x EV/revenue. That yields about $1.10
              billion to $1.53 billion of enterprise value, clearly below the current $2.08 billion. The base case
              assumes $285 million to $300 million of 2027 revenue, continued durable FFRCT growth, visible but still
              partial plaque contribution, and a 7x to 9x multiple; that produces $1.99 billion to $2.70 billion of
              enterprise value, which mostly brackets today's value. The bull case requires much more: $340 million to
              $380 million of 2027 to 2028 revenue, explicit plaque revenue diversification, and continued category
              leadership despite growing competition. At 9x to 11x EV/revenue, enterprise value would reach about $3.06
              billion to $4.18 billion. Upside exists, but not with the sort of asymmetry that justifies a buy before
              better evidence appears.
