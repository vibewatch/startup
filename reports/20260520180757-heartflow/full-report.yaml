  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in real clinical workflow terms
        blocks:
          - type: paragraph
            body: >-
              Heartflow is best understood as a post-processing operating layer on top of coronary computed tomography
              angiography rather than as a scanner, a PACS replacement, or a stand-alone cath-lab device. The workflow
              starts after a clinician orders and acquires a CCTA for a patient with suspected coronary artery disease.
              Heartflow’s official product pages and filing describe a secure transfer of previously acquired CCTA data
              into its cloud platform, where software turns that scan into a patient-specific 3D representation of the
              coronary tree and then returns clinically actionable outputs. In current marketing language, Heartflow One
              bundles four jobs: Identify disease with Roadmap, Decide with FFRCT, Manage with Plaque Analysis, and
              Build the program with support services. In practice, this means imaging readers receive an anatomic
              triage layer automatically, then order more detailed physiology and plaque modules as needed, with results
              delivered back through web, PDF, PACS, and EMR surfaces. The key product point is therefore workflow
              compression: one CCTA in, a staged set of anatomy, physiology, plaque, and treatment-planning outputs out,
              without asking the patient to undergo another non-invasive or invasive diagnostic test first.
