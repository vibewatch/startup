  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public-market starting point and capital-structure context
        blocks:
          - type: paragraph
            body: >-
              By May 20, 2026, Heartflow is no longer a private narrative asset; it is a public medtech-software company
              whose price already embeds durable growth and improving economics. CompaniesMarketCap showed the stock
              near $27.08 and market capitalization near $2.33 billion. Subtracting the $254.9 million of cash, cash
              equivalents, and investments reported at March 31, 2026 produces enterprise value of roughly $2.08
              billion, or about 9.0x the midpoint of management's $228 million to $232 million 2026 revenue guide. That
              multiple is not absurd for 41% year-over-year Q1 growth and 80.2% gross margin, but it is also not
              distressed given continuing operating losses and thin product-mix disclosure. The capital-structure
              question is far cleaner than it was pre-IPO: the August 2025 offering priced 16.67 million shares at $19,
              convertible notes converted into common stock at the IPO, and the company still held enough cash to avoid
              a near-term financing scramble. The market is therefore no longer underwriting survival. It is
              underwriting whether plaque and broader workflow products can justify paying in advance for a second
              growth engine.
            claimRefs:
