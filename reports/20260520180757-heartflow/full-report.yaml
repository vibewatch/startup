  - id: TM005
    title: Competitive and substitute landscape
    columns:
      - Alternative
      - Category
      - What it sells / claims
      - Overlap with Heartflow
      - Market implication
    rows:
      - - Cleerly
        - Direct AI competitor
        - >-
          AI-enabled CCTA plaque, stenosis, and ischemia analysis; makes comparative claims versus FFRCT and stress
          testing
        - High overlap in plaque and ischemia reading layer
        - Raises feature and evidence competition inside the same CCTA workflow
      - - Elucid
        - Direct AI plaque competitor
        - CTA plaque assessment based on ground-truth histology; FFRCT under development
        - High overlap in plaque characterization, partial overlap in physiology roadmap
        - Pushes differentiation toward plaque-composition credibility
      - - Keya Medical
        - Direct CT-FFR competitor
        - AI-enabled non-invasive CT FFR analysis tied to CPT 75580 economics
        - High overlap in FFRCT-style physiology use case
        - Competes on lower-cost or alternative physiology positioning
      - - Medis
        - Adjacent physiology / post-processing competitor
        - Vendor-independent cardiac imaging suite plus QFR physiology from angiography
        - Partial overlap with invasive or cath-adjacent physiology decision support
        - Expands buyer comparison set beyond CCTA-only vendors
      - - CT OEM ecosystem
        - Incumbent platform layer
        - Scanner capacity, cardiac CT workflow, and post-processing from Siemens, GE, Philips, Canon, and peers
        - Indirect but structural overlap via CCTA program ownership
        - OEMs can help expand CCTA while retaining leverage over hospital capital budgets
      - - Traditional stress tests
        - Status-quo substitute
        - SPECT, stress echo, PET, and stress EKG pathways
        - Compete directly for initial non-invasive diagnostic choice
        - Entrenched clinical routines slow Heartflow conversion even when evidence improves
      - - Invasive angiography / catheterization
        - Procedural substitute
        - Direct invasive evaluation and planning
        - Competes when clinicians skip non-invasive triage or use Heartflow mainly to avoid unnecessary cath
        - Defines the downstream cost and convenience benchmark Heartflow must beat
      - - Heartflow
        - Current category leader by scale
        - RoadMap, FFRCT, Plaque, and PCI planning tied to reimbursement and installed-base scale
        - Reference point for the market
        - If the company keeps its installed-base and payer lead, category economics may consolidate around its workflow
    notes: >-
      Landscape rows intentionally mix direct competitors and workflow substitutes because buyers compare Heartflow
      against both software peers and entrenched diagnostic pathways.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
