      - number: '6.5'
        title: Expansion levers, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s public expansion thesis is coherent: Plaque rides on the same CCTA scan as FFRCT, major payer
              coverage is widening, and independent trade press repeatedly argues that reimbursement and guideline
              support should accelerate cardiac-CT AI usage. Arizona and Florida landing pages show how Heartflow turns
              coverage into sales collateral at the local level, and Fierce plus CIToday show that payer wins and CMS
              rule changes are part of the company’s sales motion. Still, concentration and procurement risk remain
              meaningful. The filing says no single customer exceeds 10% of revenue, but it also says a relatively small
              number of customer decision-makers can control multiple accounts, which is a more subtle concentration
              risk than simple revenue share. The same filing warns that customers can reduce order volumes, negotiate
              utilization rebates, or react to reimbursement cuts, and it highlights the possibility of a proposed
              Medicare payment reduction. Finally, STAT’s skeptical piece shows that value questions persist even as
              coverage broadens, especially for plaque analysis before it becomes routine at scale.
