        - >-
          A lower entry price would better compensate for unresolved plaque monetization and competitive compression
          risk.
      - - Upgrade conditions
        - Visible plaque revenue diversification, sustained 30%+ growth, and modest opex leverage
        - These are the clearest evidence-based conditions that would justify moving from track to buy.
