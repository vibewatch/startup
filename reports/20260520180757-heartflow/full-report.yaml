      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s moat is still stronger than any single peer’s because it combines scale, reimbursement,
              product breadth, and embedded commercial operations. The company’s direct evidence for this is compelling:
              1,465 installed U.S. accounts at the end of 2025, more than 1,800 institutions globally by mid-2026, and a
              dataset the company says exceeded 200 million annotated CCTA images. That is hard for hospitals to
              recreate internally and hard for smaller rivals to match quickly. But the moat is not self-reinforcing in
              the way scanner ownership or a procedure-room install base would be. Cleerly is openly attacking
              Heartflow’s clinical narrative; Elucid is trying to own the high-risk plaque story; Keya offers a more
              flexible FFRCT deployment model; and Medis plus GE illustrate how adjacent incumbents can meet
              cardiologists later in the workflow. Adverse evidence also exists on pricing and durability. STAT
              questioned whether the new roughly $1,000 plaque-analysis payment is worth it, which matters because payer
              skepticism can flatten category margins even if clinical adoption grows. Heartflow’s patent suit against
              Cleerly signals both confidence and vulnerability: its IP estate is large, but the case itself shows that
              direct rivals are now close enough to trigger legal defense. The clearest conclusion is that Heartflow
              still leads, yet its future edge depends on staying the operational default for CCTA programs before
              reimbursed plaque and physiology tools become commoditized across multiple vendors.
