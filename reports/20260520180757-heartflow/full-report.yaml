  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, substitutes, and entrants'
        blocks:
          - type: paragraph
            body: >-
              Heartflow sits in a layered market rather than a clean one-for-one software category. The most direct
              overlap is with Cleerly, Elucid, and Keya, all of which use coronary CT images to quantify plaque,
              estimate ischemia, or both. Medis is not a true like-for-like substitute for Heartflow’s non-invasive
              cloud workflow, but it does matter because QFR gives interventional cardiologists an adjacent physiology
              product inside the cath-lab decision chain. Upstream, scanner and post-processing incumbents such as
              Siemens, Canon, and GE shape who even has the cardiac CT capacity to adopt CCTA-first pathways, which
              gives them distribution leverage that pure software vendors lack. The status quo remains resilient: stress
              testing, PET or SPECT, and direct referral to invasive angiography still compete for the same diagnostic
              decision, especially where CCTA programs are immature or clinicians do not trust additional software
              layers. The next competitive wave is already visible. Cardiovascular Business reported that newer
              plaque-analysis vendors such as Caristo, Artrya, Circle Cardiovascular, Ziosoft, and Siemens’ pending
              plaque tools are trying to exploit the same reimbursement opening that helped Heartflow and Cleerly scale.
              The implication is that Heartflow’s market leadership is real, but it sits inside a broadening reimbursed
              stack where competitors can arrive from direct AI, cath-lab software, or OEM channels rather than from one
              obvious peer set.
