  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, mix, and monetization quality
        blocks:
          - type: paragraph
            body: >-
              Heartflow’s revenue quality is better than a typical early public medtech story because the company is not
              trying to sell scanners, cath-lab hardware, or one-time software licenses. The 10-K says substantially all
              revenue is usage-driven, recognized when the requested analysis is delivered, and billed directly to the
              account each time a physician chooses FFRCT, Plaque, or both. That matters because it ties revenue to real
              clinical usage rather than to booked seats or deployment promises. The problem is concentration.
              Management disclosed that FFRCT still represented 98% of revenue at year-end 2025, which means public
              investors are still underwriting one dominant product plus a Plaque upsell story rather than a balanced
              multi-module platform. Plaque reimbursement and recent FDA updates help, but commercialization started
              with limited market education in late 2023 and still lacks product-level revenue disclosure. RoadMap
              improves retention and workflow but is generally bundled, while PCI Navigator was framed as an integrated
              feature rather than a separate paid SKU. The result is a monetization stack with strong per-use economics
              and low hardware friction, but only one clearly proven revenue engine.
