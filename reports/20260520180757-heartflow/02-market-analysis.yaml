- id: growth-drivers-and-adoption-barriers
  title: Growth drivers, reimbursement catalysts, and adoption barriers
  body: 'Three forces currently support market growth. First, Heartflow and trade press both point to a reimbursement regime that now better rewards AI-assisted coronary analysis, especially as plaque analysis moved into Category I reimbursement and national commercial coverage expanded. Second, Heartflow says it has deep clinical validation, broad guideline support, and a growing real-world dataset, all of which help persuade clinicians and payers that the pathway is not just another radiology AI overlay. Third, workflow automation matters: RoadMap, integration services, and customer-support infrastructure reduce the operational burden of scaling CCTA programs. The barriers, however, are not cosmetic. Heartflow itself warns that physicians may be unwilling to change standard practice, payers may still narrow or revise coverage, and plaque commercialization remains nascent despite early momentum. That means the category can grow quickly while still remaining operationally fragile and sensitive
    to evidence, coding policy, and local workflow execution.'
