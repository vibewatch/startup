  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-ccta-volume-sam
    missingEvidence: A public dataset linking annual U.S. CCTA procedure volume, eligible chest-pain cohorts, payer mix, and attach assumptions for FFRCT and plaque analysis.
    whyItMatters: Without that denominator, market sizing remains a set of credible proxies rather than a defendable TAM/SAM/SOM stack.
    diligencePath: Use CMS claims, commercial claims datasets, and society procedure statistics to build a bottom-up annual case-volume model.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: net-reimbursement-and-pricing
    missingEvidence: Contracted per-case pricing, denial rates, write-offs, and net reimbursement by payer class for Heartflow and major rivals.
    whyItMatters: Public list reimbursement alone does not reveal actual provider economics or whether the pathway remains attractive after denials and appeal workload.
    diligencePath: Interview provider customers, request anonymized reimbursement waterfalls, and compare against payer-policy criteria by account type.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM003
    - TM004
    - FM002
  - type: private-evidence-only
    severity: material
    topic: true-plaque-utilization
    missingEvidence: A disclosed breakdown of how many installed accounts order plaque routinely, occasionally, or not at all after installation.
    whyItMatters: Installed-base counts overstate commercialization progress if a large share of sites have capability enabled but minimal recurring use.
    diligencePath: Ask management or customer references for ordering frequency, active-user counts, and plaque attach by cohort over time.
    relatedQuestionRefs:
    - QM029
    relatedTableRefs:
    - TM002
    - TM005

