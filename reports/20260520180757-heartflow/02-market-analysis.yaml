- id: competition-and-positioning
  title: Competition, substitutes, and Heartflow positioning
  body: 'Heartflow sits inside a crowded competitive stack rather than a winner-take-all software category. Direct AI rivals include Cleerly, Elucid, and Keya; adjacent physiology and post-processing vendors include Medis; and the broader structure is shaped by CT OEMs that can bundle cardiac CT capability while also defending legacy modalities such as stress imaging. Cleerly already markets comparative claims against FFRCT and stress testing, Elucid differentiates on histology-based plaque composition, Keya pushes non-invasive CT FFR economics, and Medis offers angiography-derived physiology through vendor-independent software. Outside the software set, invasive angiography and traditional stress tests still compete for the same diagnostic decision and remain deeply embedded in clinical routines. Heartflow''s counter-position is to be the analysis layer of record for CCTA programs: broad reimbursement, high installed base, dataset scale, clinical evidence, and workflow support are the company''s
    core moat arguments. The market-structure consequence is that Heartflow benefits from CCTA growth, but it does not control the scanner, the ordering behavior, or the reimbursement environment outright.'
