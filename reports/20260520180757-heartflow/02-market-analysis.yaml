  - - Interventional / cath-lab planning
    - Interventional cardiology leadership
    - Interventional cardiologists
    - Hospital procedural economics
    - Use PCI Navigator after CT-based triage and before stenting
    - Cath-lab or cardiovascular service line
    - Need to plan procedures before entering the lab
  - - Payer and utilization-management review
    - Medical-policy / contracting teams
    - Claims reviewers and radiology benefit managers
    - Medicare MACs and national commercial payers
    - Determine whether analysis is covered and under what stenosis / symptom criteria
    - Payer medical-policy budget
    - Clinical evidence, coding, and EviCore-aligned policy changes
