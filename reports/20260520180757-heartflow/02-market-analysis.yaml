    - Cardiology service-line leadership
    - Cardiologists ordering CCTA and downstream analyses
    - Professional fee plus payer authorization
    - Use anatomy plus physiology to avoid unnecessary invasive testing
    - Cardiology operations budget
    - Guideline support and better pathway economics
  - - Preventive plaque-management program
    - Preventive cardiology lead or system executive sponsor
    - Preventive cardiologists / lipid clinics
    - Commercial plus Medicare / Medicare Advantage coverage
    - Order plaque analysis after qualifying CCTA to tailor therapy
    - Population-health or cardiology budget
