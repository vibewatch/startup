company:
  name: Heartflow
chapter:
  number: 2
  title: Market Analysis
  summary: Heartflow's market is best defined as the reimbursable analysis layer inside a CCTA-based coronary-care workflow rather than as all of cardiology imaging. Growth is currently driven by broader reimbursement, guideline-backed clinical evidence, and Heartflow's installed-base scale, but adoption still depends on local CCTA program build-out, physician behavior change, and a competitive field that now includes Cleerly, Elucid, Keya, Medis, CT OEM workflows, and the legacy stress-testing / invasive-angiography pathways Heartflow wants to displace.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and evidence-constrained sizing
  body: 'Heartflow is not selling into all of cardiology imaging; its commercial wedge is the CCTA-based analysis layer that sits after a coronary CTA scan and before a treatment decision. The included spend therefore centers on software analysis, interpretation support, and reimbursement-linked add-ons such as FFRCT and plaque quantification, while excluded spend includes the scanner itself, broad hospital cardiology budgets, and therapeutic procedures that happen only after a diagnostic decision is made. Public evidence is strongest for four sizing lenses rather than a textbook TAM: the sheer burden of CAD, the installed base of Heartflow-enabled accounts, the coverage breadth for reimbursed analyses, and the attach gap between FFRCT-era footprint and Plaque-era utilization. That is enough to show a real and expanding market, but not enough to publish one clean TAM/SAM/SOM number without layering in assumptions about annual CCTA volume, case mix, and payer approval. The practical implication
    is that Heartflow''s valuation-relevant market is best understood as a constrained CCTA workflow market with large upside, not as all cardiovascular imaging spend.'
