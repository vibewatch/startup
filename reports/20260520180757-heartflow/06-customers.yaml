company:
  name: Heartflow
chapter:
  number: 6
  title: Customers
  summary: "Heartflow sells into CCTA-capable hospitals, health systems, and imaging centers, with payer\
    \ coverage and workflow support doing much of the commercial work. Public adoption proof is stronger\
    \ than usual for a medtech workflow company\u20141,465 U.S. accounts, 489 U.S. plaque accounts, 1,800+\
    \ institutions globally, 650,000+ patients worldwide, Banner and NHS deployment evidence\u2014but\
    \ true retention, cohort renewal, and concentration quality remain under-disclosed."
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, payer, and geographic segmentation
  body: "Heartflow is not sold into a generic enterprise IT budget; it is sold into cardiac-imaging programs\
    \ that already run coronary CTA and can therefore order analysis on top of an existing scan. The practical\
    \ buyer is usually a hospital, health-system, outpatient imaging center, or cardiology service line\
    \ that has to justify workflow change, reimbursement mechanics, and clinical champion support. The\
    \ users are more fragmented: imaging cardiologists or radiologists need a faster first read, ordering\
    \ or preventive cardiologists need physiology and plaque outputs to guide medical management, and\
    \ interventional cardiologists increasingly use the same data for PCI planning. Payers matter because\
    \ Heartflow\u2019s public reimbursement pages now frame Plaque and FFRCT as covered by Medicare and\
    \ multiple national insurers, making coverage breadth part of the product story rather than a background\
    \ assumption. Geography is also broader than a U.S.-only marketing footprint: Heartflow\u2019s own\
    \ pages say the platform is commercially available in the United States and selected international\
    \ markets, while NHS England provides the clearest external proof that non-U.S. deployment is more\
    \ than a nominal clearance story."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU028
  - CU029
  tableRefs:
  - TU001
  figureRefs:
