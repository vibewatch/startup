  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Audited NRR, GRR, logo-retention, and cohort-renewal data by account vintage and
      product mix.
    whyItMatters: Without cohort retention metrics, recurring usage looks plausible but cannot be underwritten
      as durable.
    diligencePath: Request a renewal cohort by account vintage showing gross retention, net retention,
      and attach expansion for FFRCT and Plaque.
    relatedQuestionRefs:
    - QU016
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: contract-durability
    missingEvidence: Average contract length, renewal notice periods, early-termination rights, and top-account
      pricing terms.
    whyItMatters: Usage concentration and rebate clauses matter more in a pay-per-analysis model than
      in a fixed-license SaaS model.
    diligencePath: Request top-20 account contract summaries with term, rebate ladders, termination clauses,
      and whether pricing is at system or facility level.
    relatedQuestionRefs:
    - QU017
    - QU021
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: representative-satisfaction
    missingEvidence: Representative customer-satisfaction or site-level reference data beyond curated
      testimonials and selected public stories.
    whyItMatters: Curated testimonials do not show whether implementation quality, turnaround, or clinical
      value are broad-based across the installed base.
    diligencePath: Ask for a blinded sample of renewal references across hospitals, imaging centers, and
      cardiology groups plus any third-party survey or promoter score methodology.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: minor
    topic: international-account-mix
    missingEvidence: Country-level account counts, revenue mix, and active-site counts outside the U.S.
      and England.
    whyItMatters: Commercial availability language does not show where Heartflow is truly scaled versus
      merely cleared or selectively sold.
    diligencePath: Request country-by-country active-account counts, payer access, and 2025-2026 revenue
      split for UK, Japan, Canada, EU, and other select regions.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: material
    topic: named-site-utilization
    missingEvidence: Site-level order volume, plaque attach rate, and renewal status for named public
      references such as Banner, Sutter, WellStar, Image One, and GAMEFILM participants.
    whyItMatters: Named logos are useful proof of engagement but do not tell an investor whether deployments
      are broad, deep, recent, or economically important.
    diligencePath: Request site-by-site volume, first-order date, latest-order date, and whether each
      named account is production, pilot, paused, or expanded.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU013
    relatedTableRefs:
    - TU003

