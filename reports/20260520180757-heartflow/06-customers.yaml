- id: durability-repeat-usage-and-support
  title: Durability, repeat usage, and what public evidence cannot prove
  body: 'The strongest durability signal is structural rather than statistical. Heartflow says revenue
    is generated each time a physician chooses to review FFRCT, Plaque, or both, so a live account can
    keep generating revenue as long as clinicians keep ordering cases. The company also says RoadMap is
    bundled to improve customer loyalty and that support services include coding help, rate negotiation,
    PACS and EMR integration, peer education, and case-level support. Those are classic land-and-expand
    tools: reduce initial friction, win clinician trust, then raise recurring case volume and add Plaque
    on top of the same scan. Public evidence also suggests real repeat use because 2025 and Q1 2026 growth
    were both tied to U.S. FFRCT volume. But there is an equally important absence: the reviewed public
    set does not disclose NRR, GRR, logo retention, contract length, renewal cohorts, or representative
    satisfaction samples. That means the chapter can support a plausible recurring-usage thesis, not a
    proven retention thesis.'
  claimRefs:
  - CU014
  - CU015
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-procurement-friction
  title: Expansion levers, concentration, and procurement friction
  body: "Heartflow\u2019s public expansion thesis is coherent: Plaque rides on the same CCTA scan as FFRCT,\
    \ major payer coverage is widening, and independent trade press repeatedly argues that reimbursement\
    \ and guideline support should accelerate cardiac-CT AI usage. Arizona and Florida landing pages show\
    \ how Heartflow turns coverage into sales collateral at the local level, and Fierce plus CIToday show\
    \ that payer wins and CMS rule changes are part of the company\u2019s sales motion. Still, concentration\
    \ and procurement risk remain meaningful. The filing says no single customer exceeds 10% of revenue,\
    \ but it also says a relatively small number of customer decision-makers can control multiple accounts,\
    \ which is a more subtle concentration risk than simple revenue share. The same filing warns that\
    \ customers can reduce order volumes, negotiate utilization rebates, or react to reimbursement cuts,\
    \ and it highlights the possibility of a proposed Medicare payment reduction. Finally, STAT\u2019\
    s skeptical piece shows that value questions persist even as coverage broadens, especially for plaque\
    \ analysis before it becomes routine at scale."
