- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: Account expansion path from reimbursement readiness to account activation, recurring FFRCT
    volume, Plaque attach, and deeper procedure-planning use.
  data:
    nodes:
    - id: af1
      label: Coverage and guideline support
      detail: FFRCT and Plaque need enough payer coverage and clinical support to justify local program
        activation.
      tone: neutral
    - id: af2
      label: Account activation
      detail: A hospital, system, or imaging center joins the installed base and begins sending CCTA cases.
      tone: positive
    - id: af3
      label: Recurring FFRCT use
      detail: Repeat physician orders drive U.S. FFRCT volume and are the main revenue engine.
      tone: positive
    - id: af4
      label: Plaque attach
      detail: Sites add plaque analysis on the same scan as coverage expands and preventive use cases
        grow.
      tone: positive
    - id: af5
      label: Deeper workflow embedment
      detail: PCI planning, education, and operational support deepen dependence on the Heartflow pathway.
      tone: positive
    edges:
