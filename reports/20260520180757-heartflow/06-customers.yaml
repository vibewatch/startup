callouts:
- calloutType: strength
  title: Recurring-order economics are plausible even without published NRR
  body: "Heartflow\u2019s best durability signal is mechanical: installed sites generate revenue each\
    \ time clinicians order an analysis, and the same scan can support multiple add-on modules. Q1 2026\
    \ and FY2025 updates both tie growth to U.S. FFRCT volume, suggesting recurring use after installation\
    \ rather than episodic hardware placement."
  claimRefs:
  - CU014
  - CU015
  - CU030
- calloutType: risk
  title: Decision-maker concentration and reimbursement drift are the main customer risks
  body: 'The filing removes the easy bear case that one customer is more than 10% of revenue, but it replaces
    it with a subtler one: a small number of systems may control many accounts, and reimbursement changes
    can still make those accounts less active. Without cohort retention or top-system volume disclosure,
    concentration risk remains partly hidden.'
  claimRefs:
  - CU035
  - CU036
  - CU037
  - CU038
