figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Heartflow customer journey from an existing CCTA program through ordering, reimbursement-enabled
    interpretation, treatment planning, and repeat case support.
  data:
    nodes:
    - id: jm1
      label: CCTA-ready program
      detail: Hospital or imaging center already performs coronary CTA and has a clinician champion plus
        reimbursement path.
      tone: neutral
    - id: jm2
      label: Order Heartflow
      detail: Imaging or ordering physician decides whether to use bundled RoadMap only or request FFRCT
        and / or Plaque.
      tone: positive
    - id: jm3
      label: Interpret and decide
      detail: Results return to imagers, ordering cardiologists, and sometimes interventional cardiologists
        for medication or cath decisions.
      tone: positive
    - id: jm4
      label: Economic gate
      detail: Claims, payer policy, coding, and local reimbursement determine whether clinicians keep
        ordering at scale.
      tone: warning
    - id: jm5
      label: Support and expand
      detail: Integration, peer education, and reimbursement support aim to turn first use into recurring
        volume and Plaque or PCI expansion.
      tone: positive
  approximationNotes: Stages reflect the reviewed public workflow and reimbursement materials, not a measured
    average sales cycle. The key bottleneck is the economic gate between first enthusiasm and recurring
    order volume.
