- id: adoption-trajectory-and-usage
  title: Adoption trajectory, usage intensity, and installed-base headroom
  body: "Public adoption evidence is unusually concrete for a medtech workflow company. Heartflow\u2019\
    s filing and 2026 investor updates give three useful anchor metrics: a 1,465-account U.S. installed\
    \ base at year-end 2025, a 489-account U.S. Plaque installed base, and more than 1,800 institutions\
    \ globally by spring 2026. Patient counts stepped from more than 500,000 in January 2026 to more than\
    \ 600,000 in March and over 650,000 by May, which is directionally consistent with continued usage\
    \ growth after the IPO. Just as important, the filing says 195,000 U.S. patients ran through the platform\
    \ in 2025 and that this represented about 19% of current U.S. CCTA volumes. That means the current\
    \ installed base is still far from saturated. Both the 2025 and first-quarter 2026 results attribute\
    \ growth primarily to higher U.S. FFRCT volume, which is the strongest public clue that once an account\
    \ is installed, recurring case flow\u2014not one-time software revenue\u2014is what moves the income\
    \ statement."
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
