- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Description
  - Impact
  - Diligence path
  rows:
  - - Plaque on the same CCTA scan
    - Heartflow says Plaque rides on the same scan as FFRCT, which should make cross-sell cheaper than
      launching a new modality
    - 'Positive: lower incremental workflow friction and potential operating leverage'
    - Request plaque attach by FFRCT account vintage and payer class to confirm land-and-expand in practice.
  - - Coverage-led geographic expansion
    - State and national coverage pages are used as sales collateral to activate ordering in Arizona,
      Florida, and nationally
    - 'Positive: payer wins broaden the addressable ordering base without new hardware'
    - Request ordering trends before and after each payer-policy change by state and payer.
  - - Decision-maker concentration across multi-account systems
    - No single customer exceeds 10% of revenue, but some customer systems control multiple accounts
    - 'Negative: loss of one system can impair several facilities at once'
    - Request top-20 systems, account counts per system, and share of total order volume.
  - - Pricing pressure from rebates and mix
    - Heartflow says utilization and volume rebates affected ASP in 2025
    - 'Negative: revenue quality can degrade even if case counts rise'
    - Request rebate ladders and whether large systems receive enterprise-wide discounts.
  - - Reimbursement policy volatility
    - Commercial payers can deny, reduce, or bundle payment and Medicare rules can change APC economics
    - 'Negative: sites may cut usage if reimbursement weakens'
    - Request payer-policy monitoring cadence and contingency plans for major payment changes.
  - - Public-proof scarcity
    - Most named references are testimonials or partial lists rather than quantified production accounts
    - 'Negative: investors cannot infer concentration or renewal quality from logos alone'
    - Request site-level production, latest-order date, and whether each public reference is pilot, paused,
      or expanded.
  notes: Expansion logic is evidence-based, but concentration and procurement risk remain under-disclosed.
    The table separates what the public record supports from what still needs primary diligence.
