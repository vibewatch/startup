tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Primary use case
  - Public scale signal
  - Revenue / strategic value
  - Key gap
  rows:
  - - Hospital and health-system cardiac programs
    - 'Buyer: service-line administrator or cardiology leadership; User: imaging / ordering / interventional
      physicians; Payer: hospital and insurers'
    - Use a prior CCTA to decide diagnosis, medication, cath referral, or PCI planning
    - 1,465 U.S. accounts and 1,800+ global institutions imply hospitals and systems are the core footprint
    - Large systems can control many individual accounts and create expansion paths across facilities
    - Public materials do not break out how many accounts sit inside the largest systems
  - - Outpatient imaging centers and radiology groups
    - 'Buyer: imaging-center operator; User: radiologist or cardiac imagers; Payer: Medicare and commercial
      insurers'
    - Offer Heartflow-enabled CCTA in outpatient settings
    - Banner Imaging said Heartflow was offered at seven locations in 2024
    - Outpatient economics matter because reimbursement and avoidance of invasive tests are part of the
      pitch
    - No public attach-rate or profitability disclosure by imaging-center type
  - - Ordering and preventive cardiologists
    - 'Buyer: clinician champion within a site; User: preventive or ordering cardiologist; Payer: insurer
      / health system'
    - Add physiology and plaque to personalize medical management
    - DECIDE and patient-story pages pitch treatment-plan change and preventive care decisions
    - Clinician champion behavior likely drives recurring orders inside installed accounts
    - Champion-led adoption may not translate into broad facility-wide usage
  - - Interventional cardiologists / cath labs
    - 'Buyer: cath-lab leadership; User: interventional cardiologist; Payer: hospital / insurer'
    - Plan lesions and stent strategy before or during PCI
    - "Banner\u2019s 2026 partnership and PCI Navigator language show Heartflow is pushing deeper into\
      \ cath-lab workflow"
    - Adds a second expansion module after diagnostic use is established
    - Routine live-case usage is not yet quantified publicly
  - - Payers and utilization managers
    - 'Buyer: payer medical-policy team or reimbursement gatekeeper; User: provider billing / prior-auth
      staff; Payer: Medicare and national insurers'
    - Determine whether plaque and FFRCT can be ordered profitably and repeatedly
    - Heartflow reimbursement pages list Medicare plus national commercial insurers for Plaque and near-universal
      FFRCT coverage
    - Coverage breadth expands addressable ordering surface without new scanners
    - Policy durability, prior-authorization burden, and exact rates remain variable by geography
  - - International public systems and select overseas markets
    - 'Buyer: public-system or national-health-service administrators; User: cardiologists and imaging
      teams; Payer: government or mixed systems'
    - Use Heartflow after CCTA in England and sell commercially in selected non-U.S. markets
    - NHS England disclosed rollout, patient counts, and savings; Heartflow says specific functionalities
      are available in the UK, EU, Japan, and Canada
    - External public-system proof supports international credibility beyond U.S. reimbursement dependence
    - Country-level active-account and revenue mix outside England are not publicly disclosed
  notes: Segmentation is based on reviewed public workflow, reimbursement, and named-deployment evidence.
    Public scale is strongest for sites and payers, while revenue contribution by segment is mostly undisclosed.
