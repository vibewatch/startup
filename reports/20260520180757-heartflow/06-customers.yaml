      to: af3
      label: First production cases
    - from: af3
      to: af4
      label: Same-scan cross-sell
    - from: af4
      to: af5
      label: Broader program adoption
  approximationNotes: This is a conceptual deployment path rather than a literal measured conversion funnel.
    Heartflow discloses installed-base and usage outputs but not stage-by-stage conversion rates.
