slug: heartflow
runDate: "2026-05-20"
company:
  name: Heartflow
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Heartflow is a public coronary-care software company that traces its roots to 2007,
    sells an AI-driven CCTA workflow spanning Roadmap, FFRCT, Plaque, and PCI planning,
    and reported $176.0 million of 2025 revenue plus $52.6 million of first-quarter 2026
    revenue after its August 2025 IPO. The strongest reused ground-truth facts for later
    chapters are the 2019 FDA-cleared FFRCT foundation, John Farquhar's March 2022 CEO
    transition, the company's 2025 IPO under ticker HTFL, and management's disclosure that
    Plaque commercialization is still nascent even as institutional adoption exceeded 1,800
    sites and patient usage approached 650,000 by May 2026.
sections:
  - id: identity-and-platform
    title: Identity, headquarters, and product stack
    body: >-
      Heartflow is a coronary-care software company that says its mission is to turn coronary
      artery disease from the leading cause of death into a condition that can be detected
      early, diagnosed accurately, and managed for life. The company was incorporated in
      Delaware in 2007 as Cardiovascular Simulation, changed its name to HeartFlow in 2009,
      and by 2025 consolidated its holding-company structure back into Heartflow, Inc. The
      operating concept has stayed consistent: start with a coronary CTA scan, generate a
      patient-specific 3D model, and deliver software outputs that clinicians can use across
      detection, physiology, plaque assessment, and procedure planning. Heartflow now bundles
      that stack as Heartflow One, with Roadmap Analysis for lesion review, FFRCT Analysis for
      non-invasive physiology, Plaque Analysis for plaque volume and composition, and PCI
      Navigator for interventional planning. A notable identity nuance for later chapters is
      headquarters drift across source dates: the 2025 10-K still listed Mountain View as the
      principal executive office, while 2026 product and investor pages display a San
      Francisco address and first-quarter results tied the move to facilities optimization.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO046, CO048]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Leadership, founders, and governance posture
    body: >-
      Heartflow's current operating leadership is centered on President and CEO John Farquhar,
      who officially took the CEO role on March 1, 2022 after joining as chief operating
      officer in August 2021 and becoming president at the start of 2022. His biography and
      the transition release frame him as the commercial scaling executive for the public-era
      chapter, while co-founder John Stevens shifted to vice chair and remains important as a
      board-level continuity figure. Founder-market fit still matters because the technical
      origin story is unusually strong: Charles Taylor, the computational-science co-founder,
      is independently described as the architect of the non-invasive blood-flow simulation
      work that created Heartflow's first product category. Governance is also unusually
      heavyweight for a medtech software company of this size. The board chair is former
      Johnson & Johnson chief executive William C. Weldon, and the public about page also
      identifies directors including Tim Barabe, Julie Cullivan, Jeffrey Lightcap, Wayne
      Riley, and Casey Tansey. That mix suggests board coverage across medtech operations,
      healthcare investing, enterprise scale-up, and policy, but it also highlights key-person
      dependence on Farquhar for execution and on the founding technical narrative for product
      credibility.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO049, CO050]
    tableRefs: [TO002]
  - id: capital-scale-and-public-status
    title: Public-market status, revenue scale, and stakeholder map
    body: >-
      Heartflow crossed from venture-backed medtech startup into public company territory in
      August 2025, when it priced 16.7 million IPO shares at $19.00, raised expected gross
      proceeds of about $316.7 million, and began trading on Nasdaq under the ticker HTFL.
      That IPO matters because it resets the capital story from opaque venture financing to a
      public-equity base with daily market pricing and formal quarterly disclosure. The first
      two public earnings releases already give later chapters reusable operating anchors:
      full-year 2025 revenue was $176.0 million with 76.8% gross margin, and first-quarter
      2026 revenue reached $52.6 million with 80.2% gross margin, while cash and investments
      remained above $250 million. Scale indicators are also unusually explicit for a company
      at this stage. Heartflow said adoption exceeded 1,800 institutions globally and nearly
      650,000 patients by May 2026; year-end 2025 disclosures also cited a 1,465-account U.S.
      installed base and 489 U.S. Plaque accounts. Market-cap snapshots around May 19-20,
      2026 placed equity value near $2.33 billion. The main missing piece is exact post-IPO
      beneficial ownership by legacy investors, insiders, and public float, which limits any
      strong control-rights conclusion from public sources alone.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO047, CO051, CO052]
    tableRefs: [TO003]
    figureRefs: [FO003]
  - id: milestones-commercialization-and-risks
    title: Milestones, reimbursement expansion, and adverse signals
    body: >-
      The milestone record shows a company with real product and commercial momentum, but not
      a finished risk profile. Independent retrospective coverage credits Heartflow's first
      FFRCT product with U.S. commercial availability in 2014, while the FDA's K190925 record
      confirms 2019 clearance for HeartFlow FFRct Analysis. By 2021-2025 the company extended
      beyond physiology into Roadmap, Plaque, and later PCI planning, with external coverage
      in September 2025 documenting next-generation plaque clearance and a 21% claimed
      detection improvement over the first-generation algorithm. Reimbursement momentum also
      improved materially: Heartflow emphasized growing payer coverage for plaque analysis,
      Banner became a visible customer and later a broader strategic partner, and trade press
      argued that new CMS and CPT economics should accelerate CCTA-based adoption. But this is
      also where the most useful adverse evidence sits. The 2025 10-K warns that Heartflow
      still depends heavily on FFRCT, faces significant competition, and is generating only
      very limited revenue from a still-nascent Plaque commercialization effort. Independent
      reporting adds a second risk lens: the new AI plaque reimbursement codes are attracting
      scrutiny about whether four-figure payments are justified by clinical and economic
      benefit. The April 2026 patent case against Cleerly reinforces that this is now an
      active competitive category rather than a field Heartflow owns uncontested.
    claimRefs: [CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO053]
    tableRefs: [TO004]
    figureRefs: [FO001]
