callouts:
  - calloutType: strength
    title: "Heartflow already looks like a scaled public medtech software asset"
    body: >-
      Unlike many newly public digital-health companies, Heartflow entered the market with
      triple-digit annual revenue, gross margins in the high-70s to low-80s, and a clear
      installed-base narrative tied to more than 1,800 institutions and nearly 650,000
      patients.
    claimRefs: [CO019, CO021, CO022, CO023, CO025, CO026]
  - calloutType: risk
    title: "Plaque is strategically important but not yet the proven economic engine"
    body: >-
      Management's own 10-K language says plaque commercialization is nascent and generating
      very minimal revenue even as reimbursement and customer adoption broaden. Later chapters
      should test whether plaque is becoming a true second growth driver or remains mainly a
      strategic adjacency to FFRCT.
    claimRefs: [CO038, CO039, CO040, CO042, CO043]
