summary:
  headline: |
    Heartflow 是一家真实且已有规模的上市冠脉 AI 平台，增长强、毛利率高，装机基础也有实证；但在斑块业务经济性、留存和集中度公开之前，约 9x 远期 EV/revenue 的股价已经提前消化了大部分质地。
  overallScore: 6.8
