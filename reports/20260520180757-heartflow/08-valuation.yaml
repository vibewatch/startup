- id: comparable-framework
  title: 'Comparable framework: public references plus private milestone markers'
  body: Comparable work argues for discipline rather than enthusiasm. Heartflow's current roughly 9x forward EV/revenue sits above workflow or procedure medtech references like iCAD and PROCEPT, both around 5x market-cap-to-revenue, and roughly alongside imaging-AI references like Nano-X and Butterfly. These are imperfect comps. None combines coronary CCTA software, reimbursement breadth, and Heartflow's installed-base scale in exactly the same way, so some premium is justified. But the private direct-peer set does not show a vacuum either. Cleerly's reimbursement wins and fresh funding, Elucid's capital base and histology differentiation, Keya's CT-FFR positioning, and Medis or Canon channel strength all suggest coronary AI has moved from category creation to competitive commercialization. The correct valuation read is that Heartflow is better proven than most direct peers, but the current multiple already sits near the upper end of adjacent imaging-AI references while the most important
    monetization variables remain private. That is why the comparable table should inform a valuation range, not be mistaken for a precise fair-value oracle.
