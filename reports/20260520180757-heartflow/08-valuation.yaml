company:
  name: Heartflow
chapter:
  number: 8
  title: Valuation
  summary: Heartflow enters May 2026 as a legitimate public coronary-AI leader with 30%+ growth, ~80% gross margin, a cleaned-up balance sheet, and real installed-base proof, but the stock already prices in much of that quality at roughly 9x forward EV/revenue. The bull case depends on plaque becoming a disclosed second engine and on competitive pressure staying manageable; absent that evidence, the right IC conclusion is track with high risk, medium confidence, and price discipline near the low-$20s rather than an immediate buy.
sections:
- id: public-market-starting-point
  title: Public-market starting point and capital-structure context
  body: 'By May 20, 2026, Heartflow is no longer a private narrative asset; it is a public medtech-software company whose price already embeds durable growth and improving economics. CompaniesMarketCap showed the stock near $27.08 and market capitalization near $2.33 billion. Subtracting the $254.9 million of cash, cash equivalents, and investments reported at March 31, 2026 produces enterprise value of roughly $2.08 billion, or about 9.0x the midpoint of management''s $228 million to $232 million 2026 revenue guide. That multiple is not absurd for 41% year-over-year Q1 growth and 80.2% gross margin, but it is also not distressed given continuing operating losses and thin product-mix disclosure. The capital-structure question is far cleaner than it was pre-IPO: the August 2025 offering priced 16.67 million shares at $19, convertible notes converted into common stock at the IPO, and the company still held enough cash to avoid a near-term financing scramble. The market is therefore no longer
    underwriting survival. It is underwriting whether plaque and broader workflow products can justify paying in advance for a second growth engine.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
