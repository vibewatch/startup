- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Butterfly Network
    - ~$1.14B market cap; ~$0.10B TTM revenue
    - ~11.4x market-cap/revenue
    - Public imaging-AI and workflow reference with software narrative and growth expectations
    - Hardware-plus-software mix and handheld-ultrasound market differ materially from coronary CCTA analysis
  - - iCAD
    - ~$0.10B market cap; $19.52M TTM revenue
    - ~5.1x market-cap/revenue
    - Small-cap public imaging-AI reference showing what the market pays when proof is narrower
    - Breast-imaging focus and scale are far smaller than Heartflow's platform
  - - PROCEPT BioRobotics
    - ~$1.59B market cap; ~$0.32B TTM revenue
    - ~5.0x market-cap/revenue
    - High-growth public medtech workflow name useful as a discipline anchor for premium medtech multiples
    - Procedure robotics economics differ from software-forward coronary analysis
  - - Nano-X Imaging
    - ~$0.12B market cap; $12.3M TTM revenue
    - ~9.8x market-cap/revenue
    - Imaging-AI reference that shows the market will pay up for optionality in imaging infrastructure
    - Commercial maturity and revenue base are much weaker than Heartflow's
  - - Cleerly
    - 2025 coverage win; 2024 $106M extension
    - Valuation undisclosed; commercialization milestone only
    - Closest direct private competitor on plaque reimbursement and commercialization momentum
    - No disclosed post-money valuation, so this is a milestone reference rather than a tradable multiple
  - - Elucid
    - 2023 $80M Series C; $121M total funding
    - Valuation undisclosed; commercialization milestone only
    - Direct plaque-characterization peer with differentiated histology positioning
    - Funding is informative about investor belief, not about current clearing price
  - - Keya / Medis / Canon set
    - Keya >$110M historical funding; Medis-GE channel tie-up; Canon AI cardiac CT stack
    - No direct valuation disclosed; strategic competition marker
    - Shows that both startup and incumbent channels are competing for coronary workflow economics
    - A strategic milestone set is less precise than a pure public-company comparable
  notes: This is a representative sample, not an exhaustive coronary AI valuation census. Public rows use market-cap-to-revenue because debt and cash are not normalized across every comp source.
  enumerationScope:
    coverage: sample
    basis: Representative sample drawn from May 2026 public imaging-AI and workflow market-data pages plus direct coronary-AI milestone sources; it is not exhaustive because closest private peer valuations remain undisclosed in the public record.
