- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Multiple
  - Implied EV
  - Probability signal
  - Key dependency
  rows:
  - - Bear
    - 2027 revenue $245M-$255M
    - 4.5x-6.0x EV/revenue
    - $1.10B-$1.53B
    - Meaningful if plaque monetization disappoints and the market derates reimbursement-sensitive AI names
    - Plaque revenue stays small, competition tightens pricing, and growth slips toward the teens
  - - Base
    - 2027 revenue $285M-$300M
    - 7.0x-9.0x EV/revenue
    - $1.99B-$2.70B
    - Most plausible if FFRCT stays durable and plaque contributes but does not yet dominate
    - Visible attach improvement, continued 80% gross margin, and some opex leverage
  - - Bull
    - 2027-2028 revenue $340M-$380M
    - 9.0x-11.0x EV/revenue
    - $3.06B-$4.18B
    - Requires strong execution and a supportive market rather than only a good quarter
    - Plaque becomes a disclosed second engine and the competitive set stays rational
  notes: Revenue and multiple assumptions are explicit transformed ranges, not hidden spreadsheets. The base case brackets current EV; the bull case needs evidence not yet publicly disclosed.
