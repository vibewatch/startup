tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Why it matters
  rows:
  - - Recommendation
    - Track
    - The company quality is real, but the current public price does not leave enough asymmetric upside for an immediate buy call.
  - - Confidence
    - Medium
    - Revenue, margin, cash, and installed-base data are solid, but product-level mix, retention, and realized pricing remain under-disclosed.
  - - Risk rating
    - High
    - Single-product dependence, payer sensitivity, competitive narrowing, and quality or regulatory transmission risk remain material.
  - - Valuation stance
    - Fair
    - A premium is justified by growth and gross margin, but the stock already prices in strong execution.
  - - Current public snapshot
    - ~$2.33B market cap, ~$2.08B EV, ~$27.08/share, ~9.0x 2026 EV/revenue
    - This is the actual starting point the IC must underwrite rather than a generic quality score.
  - - Preferred entry zone
    - <= ~$21.78/share or <= ~7x 2026 EV/revenue
    - A lower entry price would better compensate for unresolved plaque monetization and competitive compression risk.
  - - Upgrade conditions
    - Visible plaque revenue diversification, sustained 30%+ growth, and modest opex leverage
    - These are the clearest evidence-based conditions that would justify moving from track to buy.
  notes: Rows separate the top-line call from the price discipline and evidence conditions required for an upgrade.
