- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis argument
  - Anti-thesis / what changes the view
  rows:
  - - Heartflow already has large installed-base and patient scale, which supports a premium to speculative AI names.
    - If installed accounts do not convert into denser recurring use or if plaque attach stays cosmetic, the scale premium should compress.
  - - FFRCT reimbursement breadth plus FDA-cleared plaque analysis gives Heartflow more commercial proof than most direct peers.
    - If payer backlash or MAC narrowing hits plaque economics, Heartflow loses the clean second-engine story the market is paying for.
  - - 80% gross margin and 30%+ growth justify paying more than generic medtech hardware multiples.
    - If revenue growth falls below 20% while operating losses stay large, the stock will look over-earning on narrative rather than on cash generation.
  - - The IPO and note conversion cleaned up pre-public financing overhang and left the balance sheet liquid.
    - If execution stumbles, follow-on equity becomes dilutive rather than strategic, and clean capital structure no longer helps equity holders.
  - - Heartflow still looks more proven than direct coronary AI peers on installed base and public evidence.
    - Competitor funding, coverage wins, and OEM channel power mean the category is now competitive enough to cap Heartflow's premium.
  - - DECIDE, plaque staging, and workflow depth create upside beyond the core FFRCT franchise.
    - Public evidence still does not show plaque revenue, ASP, or retention economics, so workflow depth cannot yet be capitalized at face value.
  notes: Each anti-thesis condition is monitorable and maps to either entry discipline, a downgrade trigger, or a diligence request.
