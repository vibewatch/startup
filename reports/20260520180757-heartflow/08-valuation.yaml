- id: thesis-and-antithesis
  title: Why Heartflow deserves a premium — and why that premium should stay capped
  body: 'Heartflow deserves some premium to generic medtech because it has a real installed-base, reimbursement, and workflow machine rather than a speculative AI demo. FY2025 ended with 1,465 U.S. accounts and 489 plaque accounts, while Q1 2026 commentary framed more than 1,800 institutions and nearly 650,000 patients worldwide. The product stack now includes FDA-cleared plaque analysis and commercial decision-support materials like DECIDE, which support the idea that Heartflow can deepen use on the same CCTA study. Those facts support a premium multiple. The anti-thesis is just as concrete. Public filings still say FFRCT represented 98% of 2025 revenue, so investors are mostly underwriting one proven engine plus an under-disclosed upsell story. Competitors are better funded and increasingly reimbursed: Cleerly won UnitedHealthcare and Cigna coverage and raised another $106 million, Elucid has $121 million of disclosed funding and a differentiated histology-based pitch, Keya markets CT-FFR
    under CPT 75580, and OEM or cath-lab channels such as Medis with GE and Canon can squeeze the workflow. STAT''s pricing critique shows that even covered reimbursement can still face value backlash. Premium warranted, but not without a ceiling.'
