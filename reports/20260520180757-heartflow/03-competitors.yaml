- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why credible
  - Evidence / mitigation ask
  rows:
  - - Installed base and account workflow of record
    - Plaque and FFRCT alternatives gain reimbursement and prove easy to multi-home
    - High
    - Cleerly, Elucid, and Keya now all have a clearer reimbursement path or commercial wedge
    - Request account-level retention, attach, and competitive displacement data by product
  - - Data scale and human-reviewed operations
    - Competitors narrow the data and workflow gap or buyers decide software layers are replaceable
    - High
    - Cleerly, Elucid, and Keya all market large image bases, analysts, or strong clinical validation
    - Ask for case-acceptance trends, turnaround times, and model-performance deltas versus peers
  - - Guideline and reimbursement lead
    - Payers scrutinize ~$1,000 AI payments and compress category economics
    - High
    - STAT questioned value while multiple vendors now cite the same CPT and CMS tailwinds
    - Model downside scenarios under lower payment, stricter coverage, or preauthorization friction
  - - IP estate and first-mover history
    - Patent litigation distracts management or reveals close functional overlap with rivals
    - Medium-high
    - Heartflow has sued Cleerly over six patents while direct product overlap is increasing
    - Track injunction risk, counterclaims, and whether litigation changes product roadmaps
  - - Platform breadth from RoadMap to PCI planning
    - OEMs and cath-lab incumbents win the downstream workflow and reduce Heartflow to one reimbursed report
    - Medium-high
    - GE plus Medis and Siemens / Canon cardiac stacks already own adjacent clinician touchpoints
    - Validate PCI Navigator uptake and whether it changes share inside interventional programs
  - - No-capital-equipment sales model
    - Lower hardware dependence makes initial switching and pilot testing easier for challengers
    - Medium
    - Keya emphasizes low-setup deployment and multi-homing remains feasible
    - Request competitive-pilot conversion data and reasons for non-renewal at mixed-vendor sites
  notes: Severity is analytical rather than model-derived. Each row pairs a specific Heartflow moat claim with a concrete threat and the diligence item most likely to separate narrative from durable advantage.
