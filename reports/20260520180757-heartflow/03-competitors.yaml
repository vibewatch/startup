  rows:
  - - Heartflow
    - Category leader / baseline
    - Public company; 1,465 U.S. installed accounts at FY2025; >1,800 institutions globally by Q1 2026
    - Cardiology, radiology, and CCTA programs at health systems and imaging centers
    - RoadMap, FFRCT, Plaque Analysis, PCI Navigator roadmap
    - Broadest installed non-invasive stack, but still heavily reliant on FFRCT volume and direct-sales execution
  - - Cleerly
    - Direct peer
    - Disclosed $279M total raised by 2022 plus $106M Series C extension in 2024
    - Preventive cardiology, CCTA programs, payors and providers
    - Plaque analysis, stenosis, ischemia, compare / human-review workflow
    - Aggressive comparative positioning and coverage momentum; public net pricing remains undisclosed
  - - Elucid
    - Direct plaque-focused peer
    - Disclosed $121M total funding as of 2023
    - Cardiologists and imaging programs seeking tissue-level plaque characterization
    - PlaqueIQ histology-based plaque analysis; FFRCT planned
    - Strong histology differentiation and 75577 economics, but FFRCT is still pending FDA clearance
  - - Keya Medical
    - Direct FFRCT peer / partial plaque overlap
    - Historical disclosure of >$110M funding and 200+ healthcare-system relationships
    - CCTA programs seeking FDA-cleared CT FFR with low local setup burden
    - DEEPVESSEL FFR; investigational DVPlaque
    - Commercial U.S. FFRCT ready, but plaque product is not FDA-cleared for U.S. sale
  - - Medis
    - Adjacent physiology rival
    - 35+ years in cardiovascular imaging; global customer base across 100+ countries
    - Interventional cardiology and cath-lab users
    - QFR, CT/XA/MR post-processing, angiography-derived physiology
    - High trust in invasive workflow, but not a CCTA-native reimbursed plaque operating system
  - - Siemens / Canon / GE cardiac CT stacks
    - Incumbent OEM / workflow control
    - Global medtech incumbents with capital-equipment and service channels
    - Radiology and cardiology departments buying or upgrading scanners
    - Cardiac CT acquisition, post-processing, functional testing, and workflow tools
    - Channel power is very high, but reimbursed plaque/FFRCT software breadth remains less explicit than Heartflow’s
  - - Stress testing / direct ICA
    - Status quo substitute
    - Entrenched hospital workflow and existing reimbursement base
    - Clinicians and service lines not yet standardized on CCTA-first care
    - Exercise ECG, stress echo, SPECT/PET, direct cath referral
    - Deeply embedded and familiar, but less aligned with the CCTA-first anatomy-plus-physiology narrative
  - - Caristo / Artrya / Circle / Ziosoft / pending Siemens plaque
    - Likely entrants
    - Multiple private or emerging vendors; public funding and readiness vary
    - Sites attracted by new plaque reimbursement and preventive-cardiology use cases
    - Plaque analysis or adjacent CT AI modules
    - Could speed commoditization, but public readiness and commercial depth remain uneven in reviewed sources
