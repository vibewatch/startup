  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Contracted per-site economics, minimum commitments, revenue-share terms, and discount ladders for Heartflow, Cleerly, Elucid, Keya, and Medis are not publicly disclosed.
    whyItMatters: Without real contract terms, pricing comparison can only rely on reimbursement anchors and anecdotal cash-pay examples, which weakens gross-margin and switching-cost inference.
    diligencePath: Request de-identified customer contracts, renewal quotes, and win-loss pricing summaries for representative outpatient imaging and hospital accounts.
    relatedQuestionRefs:
    - QP020
    - QP021
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: share-and-win-rates
    missingEvidence: Public sources do not quantify vendor-level win rates, attach rates inside the same site, or share of plaque-analysis volume by competitor.
    whyItMatters: Competitive durability depends on whether Heartflow is actually holding share in reimbursed plaque and FFR workflows rather than simply growing with the category.
    diligencePath: Ask management for competitive displacement data, renewal retention, and account-level attach by product and by competitor replacement scenario.
    relatedQuestionRefs:
    - QP022
    - QP024
    - QP026
  - type: missing-source
    severity: minor
    topic: oem-roadmaps
    missingEvidence: Reviewed OEM sources do not provide a complete apples-to-apples roadmap for plaque-analysis reimbursement, especially for vendors other than Siemens and Canon.
    whyItMatters: OEM bundling is a plausible medium-term risk, but the exact timing and scope of reimbursed competitive offerings remain uncertain.
    diligencePath: Review OEM product sheets, RSNA/SCCT launch decks, and direct customer references for Siemens, GE, Canon, and Philips cardiac AI roadmaps.
    relatedQuestionRefs:
    - QP003
    - QP019
    - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-access-and-multi-homing
    missingEvidence: The public record does not show how often hospitals run Heartflow alongside Cleerly, Elucid, Keya, or invasive-physiology tools in the same care pathway.
    whyItMatters: Multi-homing determines whether Heartflow can become the operating system of record or remains one analysis layer among many reimbursed options.
    diligencePath: Interview imaging directors and interventional cardiologists at mixed-vendor sites and request workflow screenshots, order volumes, and exception rules.
    relatedQuestionRefs:
    - QP017
    - QP022
    - QP026

