- id: direct-profiles-and-capability-comparison
  title: Direct competitor profiles, capability overlap, and trust posture
  body: 'Among direct peers, Cleerly is the most obviously scaled and commercially aggressive challenge because it combines large disclosed funding, coverage wins, and explicit comparative claims against FFRCT and stress testing. It presents itself as a three-in-one plaque, stenosis, and ischemia workflow rather than a point plaque reader. Elucid is more differentiated than directly substitutive today: its pitch is histology-based plaque composition and risk stratification, not current commercial FFRCT scale, though it is clearly building toward a reimbursed plaque-plus-FFRCT stack. Keya is the most credible lower-friction FFRCT challenger in the U.S. because it is already FDA-cleared and tied to code 75580, but its plaque product remains investigational in the United States, which limits direct overlap with Heartflow’s expanding plaque narrative. Medis has far more operating history than the startup peers, yet its center of gravity is still angiography-derived physiology and cath-lab planning
    rather than reimbursed non-invasive plaque analysis. Relative to this field, Heartflow’s trust posture remains strongest where buyers care about broad guideline support, direct installed-base scale, human-reviewed workflow operations, and both plaque and physiology under one commercial umbrella. The downside is that Heartflow no longer has a category with no alternatives: Cleerly is contesting the clinical narrative, Elucid is contesting tissue characterization, Keya is contesting lower-friction FFRCT delivery, and Medis plus OEMs contest the downstream procedural workflow.'
