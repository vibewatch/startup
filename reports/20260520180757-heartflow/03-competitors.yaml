- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / set
  - Public pricing signal
  - Commercial model
  - Included capabilities
  - Unknown / caveat
  - Implication
  rows:
  - - Heartflow
    - 'Public reimbursement anchors exist: 75580 around $1,017 for 2025 and plaque reimbursement near $951 OPPS / ~$1,021 office-equivalent market anchors'
    - Direct B2B software sale with account billing and ordered add-on analyses
    - RoadMap baseline plus on-demand FFRCT and Plaque; PCI Navigator expansion
    - Net contract price, discounting, and bundle structure are not publicly disclosed
    - Strong reimbursement footing helps sales, but true unit economics cannot be benchmarked from public sources
  - - Cleerly
    - No public list price in reviewed sources; public value signal comes from coverage wins and Medicare-aligned plaque criteria
    - Enterprise/provider and payor-oriented software contracting
    - Plaque, stenosis, ischemia, compare review layer
    - Per-analysis or subscription terms were not publicly disclosed on reviewed sources
    - Coverage momentum is visible, but pricing power versus Heartflow is still opaque
  - - Elucid
    - Public 2026 plaque payment signal of about $1,021 office / $951 OPPS via 75577
    - Commercial plaque software with FFRCT planned
    - PlaqueIQ today; FFRCT roadmap for 2026 pending clearance
    - No public contract terms or FFRCT pricing yet
    - Reimbursement is attractive, but cross-sell economics remain speculative until FFRCT launches
  - - Keya
    - No dollar list price disclosed; page says patient- and payer-centric pricing and references 75580 economics
    - Remote or on-site analysis workflow for DVFFR
    - FFRCT today; U.S. plaque workflow investigational only
    - Actual ASPs, margin model, and U.S. plaque commercialization timing remain undisclosed
    - Low-friction deployment may help trial wins even without public pricing transparency
  - - Medis / OEMs
    - No public like-for-like software price in reviewed sources; contracts likely sit inside broader interventional or scanner budgets
    - Cath-lab software, OEM bundle, or capital-equipment-adjacent selling motion
    - QFR, interventional imaging, scanner workflow, post-processing
    - Public sources do not separate software-only price from broader hardware or service packages
    - Bundle power can outweigh nominal software price in large hospital deals
  - - Cash-pay plaque example
    - STAT reported one physician discussing an extra $850 plaque-analysis payment before broad insurance coverage
    - Consumer or self-pay add-on in limited settings
    - Plaque quantification only in cited anecdote
    - Article is paywalled and does not establish a standard market rate
    - Shows residual price scrutiny even after Medicare coverage improved
  notes: This table uses public reimbursement anchors, disclosed cash-pay anecdotes, and explicit “undisclosed” labels. It does not estimate hidden vendor ASPs or contract discounts.
