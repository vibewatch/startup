- id: gtm-motion-and-utilization-proxies
  title: GTM motion, installed-base utilization, and sales-efficiency proxies
  body: 'Public data gives Heartflow useful GTM signals even though it does not publish a clean CAC or payback dashboard. The company describes a segmented field model in which Territory Sales Managers win new accounts and Territory Account Managers increase utilization, while the onboarding process avoids customer-side capital equipment purchases. Support is not limited to technical deployment: Heartflow markets training, PACS and EMR integration, coding support, rate negotiation, claims-audit help, appeals assistance, peer education, and case support. That operating model should lower adoption friction and helps explain why the company could reach a 1,465-account U.S. installed base and more than 1,800 institutions globally. Utilization trends are also constructive. Revenue cases climbed from 40,336 in the first quarter of 2025 to 57,776 in the fourth quarter, and management says new accounts usually take about 12 months to reach steady-state volumes. The caveat is pricing mix. Clinic
    and office accounts carry lower pricing than hospitals, and their share of U.S. revenue cases kept rising, which can dilute blended ASP even while volume grows. Public disclosures therefore support scale and adoption momentum, but they still do not reveal the actual cost of customer acquisition, rep productivity, or mature-account expansion economics.'
