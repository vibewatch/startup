- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Realized ASP by product, site type, and payer
    - Blended reimbursement references cannot show gross-to-net realization.
    - Prevents clean underwriting of revenue quality and product mix.
    - Request contract waterfall, denial and appeal rates, rebate terms, and monthly realized ASP by FFRCT and Plaque.
  - - Sales efficiency / CAC payback
    - High SG&A can be acceptable only if it creates durable installed-base usage.
    - Blocks judgment on whether the field model is scaling efficiently.
    - Request TSM and TAM productivity cohorts, quota attainment, CAC, and payback by geography.
  - - Net revenue retention and cohort expansion
    - Installed-base durability matters more than logo count in a usage-driven model.
    - Prevents conviction that volume growth will persist without constant new-logo spend.
    - Request gross retention, NRR, case growth, and attach expansion by account vintage.
  - - Product-level Plaque revenue and margin
    - Plaque is the main upside narrative but public filings only show reimbursement and installed-base signals.
    - Leaves the second-engine thesis largely qualitative.
    - Request monthly Plaque revenue cases, attach rates, ASP, and gross margin since reimbursement broadened.
  - - Top-customer revenue concentration by health system
    - Decision-making concentration can create step-down risk even without a >10% disclosed customer.
    - Downside risk is hard to stress-test.
    - Request top-10 customer revenue share, contract renewal schedule, and any systemwide exclusivity terms.
  - - Collections and working-capital metrics
    - Revenue quality depends on how fast billed analyses convert into cash.
    - Weak visibility could hide future burn re-acceleration.
    - Request DSO, aged receivables, denials, appeals aging, and write-off history by payer.
  - - International unit economics
    - International and other revenue exists but is still small and not profitability-tagged.
    - Limits confidence in geographic diversification.
    - Request region-level revenue, ASP, gross margin, and local-sales-cost disclosure.
  - - Implementation labor and support cost per new account
    - Support-heavy deployment may be strategically useful but can mask true acquisition economics.
    - Makes the no-capex pitch look easier than the P&L reality.
    - Request implementation hours, training cost, and support cost by account class and time-to-go-live.
  notes: These gaps are the minimum private-data requests needed to convert a good public narrative into an underwritable financial model. Each row names an exact follow-up rather than a generic diligence placeholder.
