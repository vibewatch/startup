  - Diligence ask
  rows:
  - - Average revenue per 2025 revenue case (proxy)
    - 888
    - medium
    - Blended proxy for monetization efficiency using disclosed 2025 revenue and 2025 revenue cases; not a true product-level ASP.
    - Provide net ASP by FFRCT versus Plaque, site class, and rebate tier.
  - - New-account ramp to steady state
    - 12 months
    - medium
    - Ramp time constrains cash conversion from new-logo wins and shapes field-force capacity planning.
    - Provide enablement-to-first-case and enablement-to-100-case distributions by cohort.
  - - Clinic / office share of U.S. revenue cases
    - 32% in 2025
    - high
    - Ambulatory mix helps scale but can pressure blended pricing because management says it is lower priced than hospitals.
    - Provide ASP and gross margin by hospital versus clinic site type.
  - - Gross margin
    - 76.8% FY2025; 80.2% Q1 2026
    - high
    - Margin is already software-like, so the key underwriting question is whether it holds as the team keeps hiring and Plaque mix expands.
    - Provide gross margin split between FFRCT and Plaque and the manual-touch minutes per case.
  - - CAC payback
    - null
    - low
    - Without CAC or rep-productivity data, investors cannot tell whether SG&A is efficiently creating durable usage.
    - Provide fully loaded CAC, quota attainment, payback, and mature-territory productivity by TSM cohort.
  - - Net revenue retention / cohort expansion
    - null
    - low
    - Installed-base quality matters more than logo count once new-account growth normalizes.
    - Provide gross retention, NRR, and case expansion by account vintage and product attach.
  - - Top-customer revenue share
    - null
    - low
    - Decision concentration can still create step-down revenue risk even without a >10% single-customer disclosure.
    - Provide top-10 customer revenue share, contract term, and renewal timing.
  - - Estimated Plaque attach within disclosed installed base
    - 33.4
    - medium
    - Plaque attach is the clearest public proxy for whether a second revenue engine is taking hold.
    - Provide plaque revenue cases, reorder frequency, and attach by account age and specialty.
  notes: Rows mix disclosed facts with clearly labeled proxy estimates. Every unavailable field has a concrete diligence request because the public record does not disclose mature SaaS-style unit economics.
