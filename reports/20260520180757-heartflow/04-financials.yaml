- id: verdict-and-diligence-blockers
  title: Financial verdict, revenue quality, and diligence blockers
  body: 'The financial verdict is mixed but investable. Revenue quality is better than it first appears because Heartflow sells a recurring, per-analysis workflow without customer capex, and the company has enough coverage, support infrastructure, and installed-base scale to make real usage-driven revenue possible. Gross margin is already strong and looks capable of staying in the high-70s to low-80s if automation keeps reducing manual production effort. The problem is that the public story still depends on an FFRCT franchise that represented 98% of revenue at year-end 2025. Plaque may become a powerful second engine, but public evidence still shows reimbursement momentum and installed-base attach, not disclosed Plaque revenue, ASP, or margin. That leaves the biggest diligence blockers squarely in private data: realized pricing by product and site type, rebate waterfall, CAC and rep productivity, retention by account cohort, top-customer concentration, and product-level mix. Public capital
    looks adequate for now, but the stock’s roughly 9x to 10x forward revenue multiple already assumes the company can turn broad reimbursement and support-heavy deployment into a more diversified, more efficient platform business.'
