- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / contract signal
  - List vs. realized visibility
  - Public evidence
  - Implication
  - Diligence ask
  rows:
  - - FFRCT reimbursement proxy
    - No public list price; economics visible via coding and reimbursement references
    - 2025 trade coverage cited roughly $997-$1,017 FFRCT payment and Heartflow says ~99.5% U.S. lives covered
    - Reimbursement support is real, but provider collection rates still depend on local contracts and denials
    - Provide gross-to-net realization, denial rates, and appeal win rates by payer class.
  - - Plaque reimbursement proxy
    - No public list price; economics visible via 75577, RVUs, Medicare and commercial coverage
    - Aetna press cited new Category I code; trade press referenced roughly $950 payment point; all seven MACs covered by Jan. 2026
    - Plaque is monetizable in principle, but value scrutiny could pressure realized rates or utilization
    - Provide plaque ASP, payer mix, and any coverage exclusions by stenosis band.
  - - RoadMap economics
    - Bundled / included
    - RoadMap is generally not stand-alone and is delivered with every CCTA sent to Heartflow
    - Supports retention and utilization rather than disclosed direct revenue
    - Confirm whether RoadMap is ever priced separately in enterprise deals.
  - - Site-type pricing mix
    - Lower pricing in clinic / office settings than in hospitals
    - Management says clinic and office cases are lower priced and rose to 32% of U.S. cases in 2025
    - Volume growth can still dilute blended ASP as ambulatory mix rises
    - Provide ASP and gross margin by site type and reimbursement class.
  - - Support package
    - Not separately priced in public disclosures
    - Support page markets coding help, rate negotiation, appeal support, training, and integration
    - Commercial value may be embedded inside contract economics rather than shown as stand-alone revenue
    - Break out services labor cost and any paid implementation line items.
  - - Volume rebates / contract modifiers
    - Contractual adjustments not publicly quantified
    - 10-K says pricing contracts can include utilization and volume rebates
    - High nominal reimbursement does not equal realized unit revenue
    - Provide rebate thresholds, take-rates, and gross-to-net waterfall by large account.
  notes: Public pricing visibility is reimbursement-led, not list-price-led. Table emphasizes reimbursement reference points, bundled support, and contract modifiers rather than pretending a public rate card exists.
