- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Public read-through
  - Diligence ask
  rows:
  - - Cash, cash equivalents, and investments
    - $254.9M at Mar. 31, 2026
    - Primary liquidity buffer
    - Strong absolute cash balance for a company still reporting losses
    - Provide unrestricted cash, covenant constraints, and minimum operating cash target.
  - - Operating cash use
    - $54.0M in FY2025
    - Best public burn proxy anchored in actual cash flow
    - Suggests Heartflow is not near a financing cliff after the IPO
    - Provide monthly cash burn bridge and expected 2026 burn by scenario.
  - - Public runway proxy
    - 49-57 months
    - Turns balance-sheet cash into an underwriting time horizon
    - Implies multi-year runway under recent burn assumptions, not immediate dependency
    - Confirm board-approved runway target and sensitivity to slower Plaque uptake.
  - - IPO proceeds
    - $332.4M net in 2025
    - Reset equity liquidity and funded debt cleanup
    - Shows why today’s liquidity is largely capital-markets enabled, not internally generated
    - Provide residual IPO cash by use bucket and any earmarked M&A capacity.
  - - 2025 Convertible Notes
    - $98.3M principal; auto-converted at IPO
    - Reduced refinancing risk by converting debt-like capital into equity
    - Balance sheet is cleaner than pre-IPO private financing stack
    - Provide any remaining note-like or structured obligations outside the converted issue.
  - - Term-loan cleanup
    - $115.1M principal repaid plus $6.8M exit and prepayment fees
    - Shows the cost of simplifying the capital stack
    - IPO cash was partly used to de-lever rather than only to fund growth
    - Provide current debt schedule, if any, and remaining interest-bearing obligations.
  - - Lease footprint
    - $26.5M lease obligations; $6.2M due through 2026
    - Facilities can become a hidden cash drag if growth slows
    - The HQ move created both an impairment charge and a multi-year lease overhang
    - Provide lease-by-site utilization and expected sublease recovery timing.
  - - Sublease offset
    - Mountain View sublease starts in 2026 and scales to full occupancy by Mar. 2027
    - Offsets part of the lease burden
    - Mitigates but does not eliminate footprint costs
    - Provide contracted rent receipts, downtime risk, and landlord consent terms.
  - - Royalty obligations
    - $0.3M remaining aggregate obligation
    - Shows licensing is not the main capital-intensity problem
    - Royalty burden is manageable versus labor and SG&A
    - Provide any revenue-share clauses beyond the stated minimums.
  notes: This table separates liquidity from the financing events that created it. Runway is a public proxy, not management guidance, and assumes no major strategic acquisition or abrupt burn acceleration.
