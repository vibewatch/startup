    - High quality but highly concentrated
    - Provide realized net ASP by site type, payer, and rebate tier.
  - - Plaque Analysis
    - Usage-driven add-on analysis on the same CCTA scan as FFRCT
    - Per analysis / revenue case
    - Broadening reimbursement; 489 plaque accounts at FY2025; commercialization still early
    - Promising but still nascent second engine
    - Provide product-level revenue, gross margin, attach, and reorder frequency.
  - - RoadMap Analysis
    - Bundled workflow and interpretation-efficiency layer
    - Included feature
    - Generally delivered with every CCTA sent to Heartflow; not sold as a stand-alone product
    - Retention and utilization support, not a disclosed direct revenue stream
    - Clarify whether RoadMap supports any bundled pricing uplift or only retention.
  - - PCI Navigator
    - Integrated procedure-planning feature expected to broaden workflow depth
    - Feature / future usage case
    - Expected Q2 2026 launch; described as integrated rather than stand-alone
    - Strategic adjacency with no public monetization proof yet
    - Provide launch pricing, attach assumptions, and target user cohort.
  - - International and other revenue
    - Geographic diversification outside the U.S. core base
    - USD millions
    - $15.4M in FY2025 and $4.3M in Q1 2026
    - Helpful diversification but still small relative to U.S. FFRCT base
    - Break out geography, distributor economics, and region-level gross margin.
