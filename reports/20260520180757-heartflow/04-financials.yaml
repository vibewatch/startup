  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-waterfall
    missingEvidence: Net realized ASP by product, site type, payer, and rebate tier.
    whyItMatters: Public reimbursement reference points do not show the true gross-to-net revenue quality or whether ambulatory mix is compressing realized unit revenue.
    diligencePath: Request monthly gross billings, denials, appeals, rebates, and realized collections by FFRCT and Plaque for the last 12 months.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, quota attainment, and rep-productivity by TSM and TAM cohort.
    whyItMatters: Heartflow already spends heavily on SG&A, so investors need proof that incremental selling dollars create durable account usage rather than only new-logo optics.
    diligencePath: Request field-force cohort analysis showing hiring date, territory maturity, CAC, payback, pipeline conversion, and mature-account productivity.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: Gross retention, net revenue retention, and cohort expansion by account vintage.
    whyItMatters: A usage-driven model should get stronger as accounts mature, but that cannot be underwritten from installed-base counts alone.
    diligencePath: Request quarterly account cohorts showing case growth, attach expansion, churn, and contract-renewal history.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: plaque-revenue-proof
    missingEvidence: Product-level Plaque revenue, ASP, margin, and reorder data since reimbursement broadened.
    whyItMatters: Plaque is the clearest upside driver beyond FFRCT, but public evidence still stops at coverage, accounts, and clinical narrative.
    diligencePath: Request monthly Plaque revenue cases, attach rates, reorder behavior, gross margin, and account-level penetration since H2 2023.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI001
    - TI005
