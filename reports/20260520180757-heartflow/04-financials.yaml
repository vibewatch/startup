callouts:
- calloutType: strength
  title: Revenue quality is usage-driven and does not depend on customer hardware capex
  body: Heartflow gets paid when physicians actually use the analysis workflow, and the customer does not need to buy capital equipment to go live. That makes the model more demand-linked and less implementation-front-loaded than many medtech launches.
  claimRefs:
  - CI011
  - CI012
  - CI029
  - CI030
- calloutType: risk
  title: Plaque is strategically important but still not proven as a disclosed second revenue engine
  body: Public evidence shows better reimbursement, more plaque accounts, and recent regulatory progress, but the company still disclosed 98% FFRCT concentration and has not published Plaque revenue or margin. That keeps the expansion story ahead of the public proof.
  claimRefs:
  - CI013
  - CI043
  - CI044
  - CI067
  - CI063
