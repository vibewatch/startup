  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、结构与变现质量
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的收入质量好过典型早期上市医疗科技故事，因为公司不是在卖扫描仪、导管室硬件或一次性软件许可。10-K 年度报告称，几乎全部收入都由使用量驱动，在请求的分析交付时确认，并且每当医生选择
              FFRCT、Plaque 或两者时，直接向账户计费。这很重要，因为收入绑定真实临床使用，而不是预订席位或部署承诺。问题是集中度。管理层披露，FFRCT 在 2025 年末仍占收入
              98%，这意味着公开市场投资者承销的仍是一款主导产品加 Plaque 增购故事，而不是均衡的多模块平台。Plaque 报销和近期 FDA 更新有帮助，但商业化从 2023
              年末有限的市场教育开始，目前仍缺少分产品收入披露。RoadMap 改善留存和工作流，但通常被打包；PCI Navigator 被描述为集成功能，而非单独付费 SKU。结果是，Heartflow
              有一套单次使用经济性强、硬件摩擦低的变现栈，但只有一个已经清楚验证的收入引擎。
