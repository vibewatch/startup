  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程
      - 平台角色
      - 关键依赖
      - 公开证据
      - 核心风险
    rows:
      - - CCTA 采集和摄取
        - 从既有 CCTA DICOM 数据起步，并把数据送入 Heartflow 工作流
        - 成熟的心脏 CT 项目、扫描仪质量和账户连通性
        - 监管文件和产品页称，CCTA 数据会安全传输至 Heartflow 云端
        - 图像质量波动或站点设置不完整，可能压低病例可接收率和处理吞吐。
      - - AI 分割层
        - 从扫描中提取冠脉解剖结构和其他特征，建立患者专属模型
        - 已训练模型和大规模标注图像库
        - 监管文件称，机器学习算法会分割 CCTA 数据并提取解剖结构
        - 公开材料没有披露按扫描仪、地区或边缘解剖病例划分的性能。
      - - 人在回路质控
        - 生产分析员在最终交付前检查并校正分割结果
        - 内部审查工具和受训分析员
        - 监管文件明确描述了分析员对提取解剖结构的审查和校正
        - 劳动强度和人员吞吐量未公开披露。
      - - CFD 和定量分析
        - 计算 FFRCT，以及狭窄、斑块、压力、速度和血流输出
        - 数值方法、算力和已验证算法
        - 监管文件和 FDA 信函描述了基于 3D 模型的生理模拟
        - 公开证据没有展示模块级算力成本或失败率分布。
      - - 交付层
        - 通过交互式网页、PDF、PACS、EMR 和病例列表工作流界面返回输出
        - 医院 IT 集成和访问控制
        - 监管文件、Plaque、路线图和支持页面均指向多格式临床交付
        - 没有公开 API 参考或沙盒说明哪些内容可配置、哪些由账户经理管理。
      - - 学习型数据资产
        - 将分析员校正结果保存为标签，并改进后续模型世代
        - 双向数据共享和长期商业病例量
        - 监管文件称，校正结果会保存为标签，且该资产已超过 160 million 张标注图像
        - 公开来源对数据权利范围和模型治理流程的外部可审计性有限。
      - - 支持与报销运营
        - 围绕技术产品提供部署、编码和病例支持
        - 客户成功人员配置和付款方政策维护
        - 支持页面宣传协议帮助、集成、编码、申诉和同行支持
        - 服务可能是采用的关键，但也模糊了核心软件到底有多少自助属性。
    notes: 架构只限于公开监管文件和产品材料明确描述的内容。本表有意避开没有支撑的云厂商、 延迟保证或模型架构细节说法。
