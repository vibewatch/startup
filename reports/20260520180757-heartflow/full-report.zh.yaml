      - number: '1.3'
        title: 公开市场状态、收入规模与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              2025 年 8 月，Heartflow 从风投支持的医疗科技初创公司跨入上市公司区间：公司以 $19.00 定价发行 16.7 million 股 IPO 股票，预计募集总额约 $316.7
              million，并以 HTFL 代码在 Nasdaq 开始交易。这个 IPO
              重要，因为资本故事从不透明的风险融资，切换为有每日市场定价和正式季度披露的公开股权基础。前两次上市后业绩公告已经为后续章节提供了可复用的经营锚点：2025 全年收入 $176.0 million，毛利率
              76.8%；2026 年一季度收入达到 $52.6 million，毛利率 80.2%；现金和投资仍高于 $250 million。规模指标也比同阶段公司更明确。Heartflow 称，到 2026 年 5
              月，全球采用机构超过 1,800 家，患者近 650,000 名；2025 年末披露还提到美国装机账户 1,465 个、美国 Plaque 账户 489 个。2026 年 5 月 19–20
              日附近的市值快照显示，股权价值接近 $2.33 billion。主要缺口是 IPO 后遗留投资者、内部人和公众流通股的准确受益所有权；只靠公开来源，很难对控制权作出强结论。
