      - number: '5.3'
        title: 架构、运营模式与数据资产
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一套相当具体的运营架构。Heartflow 称平台摄入既有 CCTA DICOM 数据，应用深度学习和其他机器学习模型分割解剖结构，再运行计算流体力学和相关计算，从 3D 计算机模型中推导
              FFRCT、血流、狭窄和斑块输出。监管文件明确说明，这不是一个纯无人值守的软件产品：生产流程包含人机协同质控步骤，由分析师在最终交付前审阅并修正提取出的解剖结构，这些修正又成为后续模型代际的标注数据。这个设计在经济和战略上都重要。相比完全自助的
              SaaS 产品，它提高了实施复杂度和人工占用；但也在已部署病例、标注和算法迭代之间形成反馈回路。Heartflow 称这条回路已经产生超过 160 million 张带标注 CCTA
              图像，并经历十多年迭代，这是公司最接近产品数据护城河的资产。强项在于具体：AI + 物理 + 运营复核。风险在于，公司对生产吞吐、质控人员和内部工具的隐藏依赖，在公开材料中大多仍不透明。
