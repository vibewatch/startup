      - number: '2.2'
        title: 买方、用户、支付方与工作流经济性
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的经济买方通常是卫生系统或影像项目，它们必须证明建设并持续运营高质量 CCTA
              工作流的合理性；日常用户则包括影像心脏病医生、放射科医生、预防心脏病医生，以及越来越多的介入团队。Heartflow 自身披露清楚说明，商业化不是单纯卖算法：RoadMap 自动交付，FFRCT 和 Plaque
              按需选择下单，公司还支持编码、申诉、费率谈判、PACS 和 EMR 集成，以及同业教育。报销变化显著改善了采用理由。CMS 上调了 2025 年基础 CCTA 支付，FFRCT 报销仍高于
              $1,000，Plaque Analysis 获得 Category I 编码，并拿到更广的支付方覆盖。即便如此，采购仍要求医院重塑工作流、医生建立信心，并且有预算负责人愿意把 CCTA + AI
              当作一条项目化路径，而不是一次性阅片服务。
