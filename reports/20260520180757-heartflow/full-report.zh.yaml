  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 重要性
    rows:
      - - 投资建议
        - 观察
        - 公司质量确实成立，但当前公开价格没有为立即买入留下足够非对称上行。
      - - 信心
        - 中
        - 收入、利润率、现金和已安装基础数据扎实，但产品级结构、留存和实际定价披露仍不足。
      - - 风险评级
        - 高
        - 单一产品依赖、付款方敏感性、竞争收窄，以及质量或监管传导风险仍然重要。
      - - 估值立场
        - 合理
        - 增长和毛利率足以支撑溢价，但股价已经计入强执行。
      - - 当前公开快照
        - ~$2.33B 市值，~$2.08B EV，~$27.08/股，~9.0x 2026 EV/收入
        - 这是投委会必须核保的真实起点，而不是泛化质量评分。
      - - 偏好的入场区间
        - <= ~$21.78/股，或 <= ~7x 2026 EV/收入
        - 更低入场价能更好补偿 Plaque 变现未解和竞争压缩风险。
      - - 上调条件
        - Plaque 收入多元化可见、30%+ 增长持续、运营费用杠杆温和显现
        - 这些是最清晰、由证据支撑的条件，足以支持从观察转为买入。
    notes: 行把顶层结论、价格纪律和上调所需证据条件拆开。
