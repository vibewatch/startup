  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开市场起点与资本结构背景
        blocks:
          - type: paragraph
            body: >-
              到 2026 年 5 月 20 日，Heartflow 已不再是私募叙事资产，而是一家公开交易的医疗技术软件公司；股价已经计入了持续增长和经济性改善。CompaniesMarketCap 显示，股价约
              $27.08，市值约 $2.33 billion。扣除 2026 年 3 月 31 日报告的 $254.9 million 现金、现金等价物和投资，企业价值约 $2.08 billion，约为管理层 $228
              million 至 $232 million 的 2026 年收入指引中点的 9.0x。考虑到 Q1 同比增长 41%、毛利率
              80.2%，这个倍数并不离谱；但在仍有经营亏损、产品组合披露很薄的情况下，也谈不上困境价。资本结构问题比 IPO 前干净得多：2025 年 8 月发行以每股 $19 定价 16.67 million
              股，可转票据在 IPO 时转为普通股，公司仍持有足够现金，近期不必慌忙融资。因此，市场不再承销生存，而是在承销斑块和更广泛的流程产品能否撑起第二条增长曲线，并证明提前付费合理。
