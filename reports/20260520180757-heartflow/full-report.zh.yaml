      - number: '4.2'
        title: GTM 动作、装机利用率与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              虽然 Heartflow 不公布干净的 CAC 或回本周期仪表盘，公开数据仍给出有用的 GTM
              信号。公司描述了一套分层外勤模型：区域销售经理赢得新账户，区域客户经理提升利用率；上线流程避免客户侧购买资本设备。支持也不止技术部署：Heartflow 对外营销培训、PACS 和 EMR
              集成、编码支持、费率谈判、理赔审计帮助、申诉协助、同业教育和病例支持。这种运营模型应当降低采用摩擦，也解释了公司为何能达到 1,465 个美国装机账户和全球超过 1,800
              家机构。利用率趋势也有建设性。收入病例数从 2025 年一季度的 40,336 例升至四季度的 57,776 例，管理层称新账户通常需要约 12
              个月达到稳态量。限制条件在于定价结构。诊所和办公室账户的价格低于医院，其在美国收入病例中的占比持续上升，即便量在增长，也可能稀释混合
              ASP。因此，公开披露支持规模和采用动能，但仍未揭示真实获客成本、销售代表产能或成熟账户扩张经济性。
