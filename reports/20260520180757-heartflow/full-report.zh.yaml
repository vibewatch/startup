      - number: '1.2'
        title: 领导层、创始人与治理姿态
        blocks:
          - type: paragraph
            body: >-
              Heartflow 当前经营领导层以总裁兼 CEO John Farquhar 为核心。他 2021 年 8 月加入公司担任 COO，2022 年初升任总裁，并于 2022 年 3 月 1 日正式接任
              CEO。个人履历和交接公告都把他塑造成上市公司阶段负责商业规模化的高管；联合创始人 John Stevens 转任副董事长，仍是董事会层面的连续性人物。创始人与市场的匹配度仍然重要，因为 Heartflow
              的技术起源故事异常强：计算科学背景联合创始人 Charles Taylor，被独立资料描述为无创血流模拟工作的架构者，这项工作创造了 Heartflow
              的第一个产品品类。以这个体量的医疗科技软件公司看，治理阵容也很重。董事长是 Johnson & Johnson 前 CEO William C. Weldon，公开关于页面还列出 Tim Barabe、Julie
              Cullivan、Jeffrey Lightcap、Wayne Riley 和 Casey Tansey
              等董事。这个组合意味着董事会覆盖医疗科技运营、医疗投资、企业级扩张和政策，但也凸显两个关键人依赖：执行上依赖 Farquhar，产品可信度上依赖创始技术叙事。
