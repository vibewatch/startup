  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑论点
      - 反向逻辑 / 什么会改变判断
    rows:
      - - Heartflow 已经拥有较大的已安装基础和患者规模，足以支撑相对投机性 AI 标的的溢价。
        - 如果已安装账户不能转化为更密集的重复使用，或 Plaque 附加只是表面动作，规模溢价应被压缩。
      - - FFRCT 报销覆盖够广，Plaque 分析也已获 FDA 许可，因此 Heartflow 的商业证明强于多数直接同业。
        - 如果付款方反弹或 MAC 收窄打击 Plaque 经济性，Heartflow 将失去市场正在买单的清晰第二引擎故事。
      - - 80% 毛利率和 30%+ 增长，支撑其估值高于普通医疗科技硬件倍数。
        - 如果收入增速跌破 20%，而经营亏损仍大，股价看起来就是吃叙事红利，而不是靠现金生成能力。
      - - IPO 和票据转换清理了上市前融资包袱，让资产负债表保持流动性。
        - 如果执行失手，后续股权融资会变成稀释而非战略选择；干净资本结构也不再帮到股东。
      - - 从已安装基础和公开证据看，Heartflow 仍比直接冠脉 AI 同业更经验证。
        - 竞争对手融资、覆盖突破和 OEM 渠道力量意味着赛道已经足够拥挤，足以压住 Heartflow 的溢价。
      - - DECIDE、斑块分期和工作流深度，为核心 FFRCT 业务之外创造上行。
        - 公开证据仍未显示 Plaque 收入、ASP 或留存经济性，因此还不能按面值资本化工作流深度。
    notes: 每条反向逻辑条件都可监控，并对应入场纪律、降级触发器或尽调请求。
    claimRefs:
