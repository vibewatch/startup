        - Cleerly、Elucid 和 Keya 都在营销大型影像库、分析师或强临床验证
        - 询问病例接收趋势、周转时间，以及相对同业的模型性能差异
      - - 指南和报销领先
        - 付款方审视约 $1,000 的 AI 支付，并压缩品类经济性
        - 高
        - STAT 质疑价值，同时多家厂商现在引用同一 CPT 和 CMS 顺风
        - 建模低支付、更严覆盖或事前授权摩擦下的下行情景
      - - IP 资产和先发历史
        - 专利诉讼分散管理层注意力，或暴露与竞争对手的功能重叠很近
        - 中高
        - Heartflow 已就六项专利起诉 Cleerly，而直接产品重叠正在增加
        - 跟踪禁令风险、反诉，以及诉讼是否改变产品路线图
      - - 从 RoadMap 到 PCI 规划的平台广度
        - OEM 和导管室既有厂商拿下下游工作流，把 Heartflow 压缩成一份可报销报告
        - 中高
        - GE 叠加 Medis，以及 Siemens / Canon 心脏产品栈，已经占住相邻临床触点
        - 验证 PCI Navigator 的采用率，以及它是否改变介入项目内部份额
      - - 无需资本设备的销售模式
        - 硬件依赖更低，挑战者更容易切入初始切换和试点
        - 中
        - Keya 强调低配置部署，多平台并用仍可行
        - 索取竞争性试点转化数据，以及混合供应商站点不续约的原因
    notes: 严重性是分析判断，不是模型推导。每行把一条 Heartflow 护城河主张对应到具体威胁，并给出最能区分叙事与持久优势的尽调项。
