      - number: '5.5'
        title: 差异化、信任控制与路线图风险
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的差异化可信，但并非无人挑战。公开证据中最强的产品边缘，是围绕一个以 CCTA 为中心的工作流，把监管广度、临床证据、装机规模和数据 /
              标注深度结合起来。公司可以可信地说，自己覆盖解剖、生理学、斑块和支持服务；监管文件也显示，公司在 FFRCT、Plaque 和 Roadmap
              方法上拥有庞大专利资产。公司还披露了具体信任控制：传输中和静态加密、MFA 和 SSO、细粒度授权、处理时去标识化 PHI，以及 HITRUST、ISO 27001、ISO 13485、SOC 2 Type 2
              和 UK CyberEssentials 等认证。FDA 历史也有分量，从 2014 年 FFRCT 的 de novo，到 2025 年覆盖更广 Heartflow Analysis 功能集的 K250902
              获批。即便如此，本章不是干净胜利。Cleerly 和其他心脏 CT 厂商现在争夺 Plaque 和判读叙事，Heartflow 正在诉讼中主动捍卫 IP，公司也没有公布足够多关于正常运行时间、开发者集成和 PCI
              Navigator 规模化日常使用的公开细节，无法消除执行风险。路线图看起来连贯，但各模块公开成熟度仍有差距。
