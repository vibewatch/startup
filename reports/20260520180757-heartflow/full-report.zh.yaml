  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户、支付方与地域分层
        blocks:
          - type: paragraph
            body: >-
              Heartflow 不是卖进泛化的企业 IT 预算，而是卖进已经运行冠脉
              CTA、因此可以在既有扫描之上下单分析的心脏影像项目。实际买方通常是医院、卫生系统、门诊影像中心或心脏科服务线，它们必须证明工作流变更、报销机制和临床牵头人支持的合理性。用户更加分散：影像心脏病医生或放射科医生需要更快的一读，开单或预防心脏病医生需要生理学和斑块输出指导药物管理，介入心脏病医生也越来越多用同一数据做
              PCI 规划。支付方很重要，因为 Heartflow 的公开报销页面现在把 Plaque 和 FFRCT 描述为由 Medicare
              和多家全国性保险公司覆盖，让覆盖广度成为产品故事的一部分，而不只是背景假设。地域也不只是美国营销版图：Heartflow 自己的页面称平台已在美国和若干国际市场商业化；NHS England
              则提供最清晰的外部证明，说明非美国部署不只是名义上的许可故事。
