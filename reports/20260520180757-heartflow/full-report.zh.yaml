  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              Heartflow 并不是把所有心脏病影像都当作市场。它的商业切入点，是冠脉 CTA 扫描之后、治疗决策之前的 CCTA 分析层。因此，纳入的支出主要是软件分析、判读支持，以及
              FFRCT、斑块量化等与报销挂钩的附加项；排除的支出则包括扫描仪本身、医院整体心脏科预算，以及只有诊断决策之后才发生的治疗程序。公开证据最强的不是教科书式 TAM，而是四个规模视角：CAD 的庞大疾病负担、可使用
              Heartflow 的装机账户、获报销分析的覆盖广度，以及 FFRCT 时代覆盖面与 Plaque 时代使用率之间的附着缺口。这足以说明市场真实且在扩张，但还不足以在不叠加年 CCTA
              量、病例组合和支付方批准假设的情况下，发布一个干净的 TAM/SAM/SOM 数字。实际含义是，和估值相关的 Heartflow 市场，最好理解为一个有巨大上行空间、但受边界约束的 CCTA
              工作流市场，而不是全部心血管影像支出。
