  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私人指标
      - 重要性
      - 对结论的影响
      - 精确尽调路径
    rows:
      - - 按产品、站点类型和支付方划分的已实现 ASP
        - 混合报销参考无法显示总额到净额实现。
        - 阻碍干净承销收入质量和产品组合。
        - 索取合同瀑布、拒付和申诉率、返利条款，以及 FFRCT 和 Plaque 的月度已实现 ASP。
      - - 销售效率 / CAC 回本周期
        - 只有能创造持久已安装基础使用量，高 SG&A 才可接受。
        - 阻碍判断现场销售模型是否高效扩张。
        - 索取 TSM 和 TAM 产能队列、配额达成率、CAC，以及按地域划分的回本周期。
      - - 净收入留存率和队列扩张
        - 在用量驱动模型中，已安装基础耐久性比 logo 数量更重要。
        - 难以确信量增不靠持续新客户投入也能延续。
        - 索取按账户年份划分的总留存率、NRR、病例增长和附加扩张。
      - - 产品级 Plaque 收入和毛利率
        - Plaque 是主要上行情景，但公开文件只展示报销和安装基础信号。
        - 第二增长引擎逻辑大多停留在定性。
        - 索取报销拓宽以来的月度 Plaque 收入病例、附加率、ASP 和毛利率。
      - - 按医疗系统划分的头部客户收入集中度
        - 即便没有披露 >10% 客户，决策集中也可能带来阶梯式下滑风险。
        - 下行风险难以压力测试。
        - 索取前 10 大客户收入占比、合同续约时间表和任何系统级排他条款。
      - - 回款和营运资本指标
        - 收入质量取决于已开票分析转化为现金的速度。
        - 可见度弱，可能掩盖未来烧钱再次加速。
        - 索取按支付方划分的 DSO、账龄应收、拒付、申诉账龄和核销历史。
      - - 国际单位经济
        - 国际及其他收入已经存在，但规模仍小，且未标注盈利能力。
        - 限制对地域多元化的信心。
        - 索取区域级收入、ASP、毛利率和本地销售成本披露。
      - - 每个新账户的实施人工和支持成本
        - 支持密集型部署可能具有战略价值，但会遮蔽真实获客经济性。
        - 让无资本设备叙事看起来比 P&L 现实更轻松。
        - 索取按账户类别和上线时间划分的实施小时、培训成本和支持成本。
    notes: 上述缺口是把漂亮公开叙事转成可承销财务模型所需的最低私人数据请求。每行都点名精确追问，而不是泛泛的尽调占位。
