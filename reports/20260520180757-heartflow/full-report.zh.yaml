  - id: TU001
    title: 客户细分表
    columns:
      - 细分
      - 买方 / 用户 / 付款方
      - 主要使用场景
      - 公开规模信号
      - 收入 / 战略价值
      - 关键缺口
    rows:
      - - 医院和医疗系统心脏项目
        - 买方：服务线管理者或心脏科领导层；用户：影像 / 开单 / 介入医生； 付款方：医院和保险方
        - 使用既有 CCTA 来决定诊断、用药、导管检查转诊或 PCI 规划
        - 1,465 个美国账户和 1,800+ 家全球机构说明，医院和医疗系统是核心覆盖面
        - 大型系统可控制许多单个账户，并在多院区铺出扩张路径
        - 公开材料没有拆分最大系统内部有多少账户
      - - 门诊影像中心和放射科集团
        - 买方：影像中心运营方；用户：放射科医生或心脏影像医生；付款方：Medicare 和商业保险方
        - 在门诊场景提供启用 Heartflow 的 CCTA
        - Banner Imaging 称，2024 年 Heartflow 已在七个地点提供
        - 门诊经济性重要，因为报销和避免侵入性检查都是销售主张的一部分
        - 没有按影像中心类型披露公开附加率或盈利能力
      - - 开单和预防心脏科医生
        - 买方：站点内的临床倡导者；用户：预防或开单心脏科医生； 付款方：保险方 / 医疗系统
        - 加入生理学和斑块信息，个性化治疗管理
        - DECIDE 和患者故事页面主打治疗方案调整和预防护理决策
        - 临床倡导者的行为很可能带动已安装账户内的重复开单
        - 倡导者带动的采用未必能转化为全院广泛使用
      - - 介入心脏科医生 / 导管室
        - 买方：导管室领导层；用户：介入心脏科医生；付款方：医院 / 保险方
        - 在 PCI 前或过程中规划病变和支架策略
        - Banner 2026 年合作和 PCI Navigator 表述显示，Heartflow 正更深进入导管室工作流
        - 在诊断使用建立后，增加第二个扩张模块
        - 常规实时病例使用尚未公开量化
      - - 付款方和利用管理方
        - 买方：付款方医疗政策团队或报销把关方；用户：服务方计费 / 预授权人员； 付款方：Medicare 和全国性保险方
        - 判断 Plaque 和 FFRCT 是否能有利可图且重复开单
        - Heartflow 报销页面列出 Medicare 以及全国性商业保险方对 Plaque 的覆盖， 以及 FFRCT 近乎普遍的覆盖
        - 覆盖广度扩大了可触达开单面，无需新增扫描仪
        - 政策稳定性、预授权负担和具体费率仍随地区变化
      - - 国际公共体系和部分海外市场
        - 买方：公共体系或国家医疗服务管理者；用户：心脏科医生和影像团队； 付款方：政府或混合体系
        - 在英格兰 CCTA 之后使用 Heartflow，并在选定的非美国市场商业销售
        - NHS England 披露了推广、患者人数和节省金额；Heartflow 称特定功能已在英国、欧盟、 日本和加拿大可用
        - 外部公共体系证据支撑其国际可信度，不完全依赖美国报销
        - 英格兰以外按国家划分的活跃账户和收入结构未公开披露
    notes: 细分基于已审阅的公开工作流、报销和具名部署证据。公开规模信号在站点和付款方上最强， 但各细分的收入贡献大多未披露。
