        title: 模块地图、SKU 逻辑与当前成熟度
        blocks:
          - type: paragraph
            body: >-
              2026 年的模块地图，比 Heartflow 主要还是 FFRCT 公司时更清楚。Roadmap 是默认判读层，并被明确描述为随每一次发送给 Heartflow 的 CCTA
              打包提供，而不是单独销售的产品。FFRCT 仍是旗舰，也仍主导公开经济性，因为它提供病变特异生理学，并使用医生熟悉的侵入式 FFR 0.80 或以下阈值来识别具有临床意义的疾病。Plaque Analysis
              是第二个主要商业模块，把 Heartflow 从缺血指导推进到风险分层和预防管理，靠量化斑块体积和成分实现。PCI Navigator 是下一个邻接业务：监管文件和 2026 年报道把它描述为一个 PCI
              前和术中规划工具，在一个界面里结合解剖、生理学和斑块定位；但公开证据仍像发布初期，而不是完全成熟。Plaque Tracker 更早，仍是 2027 年用于纵向回归跟踪的路线图项目。因此，Heartflow
              拥有一个明确具规模的核心产品、一个验证和报销都在增强的附加模块、一个打包的工作流增强器，以及两个下游 / 纵向路线图扩展。它们加深的是同一个以 CCTA 为中心的平台，而不是打开一个新模态。
