  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动 / 集中度风险
      - 描述
      - 影响
      - 尽调路径
    rows:
      - - Plaque 复用同一次 CCTA 扫描
        - Heartflow 表示，Plaque 与 FFRCT 使用同一次扫描；相比推出新模态，这应能降低交叉销售成本
        - 正向：增量工作流摩擦更低，也可能带来经营杠杆
        - 按 FFRCT 账户创建年份和付款方类型索取 Plaque 附加率，验证落地-扩张是否真的跑通。
      - - 由覆盖政策带动的地域扩张
        - 州级和全国覆盖页面被当作销售资料，用于在亚利桑那州、佛罗里达州以及全美激活下单
        - 正向：付款方突破扩大可下单基数，无需新增硬件
        - 按州和付款方索取每次付款方政策变化前后的下单趋势。
      - - 多账户系统内的决策者集中
        - 单一客户收入占比没有超过 10%，但部分客户体系控制多个账户
        - 负向：失去一个系统可能一次性伤及多家机构
        - 索取前 20 大系统、每个系统的账户数及其在总订单量中的占比。
      - - 返点和结构变化带来的定价压力
        - Heartflow 表示，使用量和规模返点在 2025 年影响了 ASP
        - 负向：即使病例量上升，收入质量也可能变差
        - 索取返点阶梯，并确认大型系统是否获得全系统折扣。
      - - 报销政策波动
        - 商业付款方可能拒付、降付或打包支付，Medicare 规则也可能改变 APC 经济性
        - 负向：若报销走弱，站点可能减少使用
        - 索取付款方政策监控节奏，以及重大支付变化的应急方案。
      - - 公开证据稀缺
        - 大多数具名参考只是证言或部分名单，不是量化生产账户
        - 负向：投资人无法只靠品牌标识推断集中度或续约质量
        - 索取站点级产量、最近下单日期，并确认每个公开参考是试点、暂停还是已扩张。
    notes: 扩张逻辑有证据支撑，但集中度和采购风险仍披露不足。本表把公开记录能够支持的内容，与仍需一手尽调的内容分开。
