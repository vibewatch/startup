      - - 临床安全信号
        - 正向但间接
        - 监管文件称，收集不良事件数据的研究没有报告平台相关不良事件
        - 10-K 临床结果章节
        - 公开证据不能替代正式上市后警戒报告或正常运行时间证据。
      - - 支持治理
