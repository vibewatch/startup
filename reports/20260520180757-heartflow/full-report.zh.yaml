companyProfile:
  summary: >
    Heartflow 是一家成立于 2007 年的上市心血管软件公司。它分析既有冠状动脉 CT 血管造影（CCTA）扫描，帮助临床医生在一个工作流里识别解剖结构、生理学、斑块负荷以及 PCI 规划提示。公司 2025 年 8 月以
    HTFL 代码上市，2025 年收入为 $176.0 million；到 2026 年 5 月，公司称平台已被全球超过 1,800 家机构采用，并用于近 650,000 名患者。Heartflow
    最强的战略优势，是一个受监管、嵌入工作流的平台，叠加广泛报销和真实临床采用；本报告持续保留的关键限定是，Plaque 仍具战略重要性，但公开文件披露不足，收入贡献也仍然很小。
  foundedDate: '2007-01-01'
  founders:
    - name: Charles Taylor
      role: 联合创始人
      background: |
        独立大学和 NSF 资料均将 Taylor 记为 Heartflow 联合创始人，并认为他开发了支撑公司最初品类的无创血流模拟技术。
      claimRefs:
        - CO016
    - name: John Stevens
      role: 联合创始人；前 CEO、现任副董事长
      background: |
        公司披露将 Stevens 列为联合创始人和前 CEO；2022 年 3 月 CEO 交接后，他仍担任董事会副董事长。
      claimRefs:
        - CO015
  headquarters: San Francisco, California, USA
  productSummary: >
    Heartflow Analysis / Heartflow One 是基于 AI 的医疗器械软件。它接收既有成人 CCTA 检查，将数据安全传入 Heartflow 云端工作流，再返回患者专属 3D 冠脉模型，包含 Roadmap
    病变可视化、FFRCT 生理学、斑块表征，以及较新的 PCI 规划支持。报告各处描述的技术差异化，来自深度学习、计算流体力学、人工复核的生产运营，以及将结果回传至 PACS、EMR 等临床系统的交付能力。
  customerFocus: >
    Heartflow 的实际买方，是已经运行 CCTA 工作流的医院、卫生系统和影像中心项目；日常用户则横跨影像心脏病医生或放射科医生、开单和预防心脏病医生，以及介入心脏病医生。支付方覆盖面现在包括 Medicare
    和主要商业保险公司，相比早年显著降低了采用摩擦。
  businessModel: >
    收入主要由使用量驱动。医生选择查看 FFRCT Analysis、Plaque Analysis 或两者时，客户按次点击付费；请求的分析交付后，公司确认收入。Roadmap 通常被定位为集成工作流功能，而不是独立
    SKU；Heartflow 还配套提供报销、集成和临床支持服务。
  stage: Public
  fundingStatus: >
    Heartflow 通过 2025 年 8 月 IPO 成为上市公司，以 $19.00 定价发行 16.67 million 股，扣费前预计募集总额约 $316.7 million。资产负债表清理还包括 2025 年可转债在 IPO
    时自动转换。
