    rows:
      - - FFRCT 报销代理指标
        - 无公开标价；经济性可从编码和报销参考中看到
        - 2025 年行业报道提到 FFRCT 支付额大约 $997-$1,017，Heartflow 称约 99.5% 美国受保人群已覆盖
        - 报销支撑真实存在，但医疗机构收款率仍取决于本地合同和拒付情况
        - 按支付方类别提供总额到净额实现率、拒付率和申诉胜率。
      - - Plaque 报销代理指标
        - 无公开标价；经济性可从 75577、RVU、Medicare 和商业保险覆盖中看到
        - Aetna 新闻稿提到新的 Category I 代码；行业媒体提到大约 $950 的支付点；到 Jan. 2026，全部七家 MAC 已覆盖
        - Plaque 原则上可以变现，但价值审查可能压低已实现费率或使用率
        - 提供 Plaque ASP、支付方组合，以及按狭窄程度分层的任何覆盖排除。
      - - RoadMap 经济性
        - 捆绑 / 内含
        - RoadMap 通常不独立销售，并随每份发送给 Heartflow 的 CCTA 一起交付
        - 支持留存和使用率，而非已披露直接收入
        - 确认 RoadMap 在企业交易中是否曾单独定价。
      - - 站点类型定价组合
        - 诊所 / 办公室场景定价低于医院
        - 管理层称，诊所和办公室病例定价更低，2025 年升至美国病例的 32%
