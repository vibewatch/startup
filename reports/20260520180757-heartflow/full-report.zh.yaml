        - 产品支持电话线及病例支持表述
        - 公开材料没有承诺响应时间 SLA 或严重程度升级政策。
    notes: 本表区分明确记录在案的控制，与只是被暗示存在的控制。公开记录止于框架名称或 FDA 义务时，本表直接写出缺口，而不是把缺口推断掉。
