            body: >-
              最强的持久性信号是结构性的，而非统计性的。Heartflow 称，每当医生选择查看 FFRCT、Plaque
              或两者时，公司就产生收入；因此，只要临床医生持续下单病例，已上线账户就能持续产生收入。公司还称，RoadMap 被打包以提升客户忠诚度，支持服务包括编码帮助、费率谈判、PACS 和 EMR
              集成、同业教育和病例级支持。这些都是典型的先落地后扩张工具：降低初始摩擦，赢得临床医生信任，然后提高经常性病例量，并在同一扫描之上添加 Plaque。公开证据也暗示真实重复使用，因为 2025 年和 2026
              年一季度增长都与美国 FFRCT 量有关。但同样重要的是缺席项：已审阅公开材料没有披露
              NRR、GRR、按客户标识计算的留存、合同期限、续约队列或代表性满意度样本。因此，本章能支持一个可信的经常性使用投资逻辑，而不是已经证实的留存投资逻辑。
