      - number: '7.5'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              Heartflow 增长很快，但财务模型仍有显著集中度和盈利证明风险。Q1 2026 收入同比增长 41%，至 $52.6 million，公司把全年指引上调至 $228-$232 million；但它仍录得
              $29.5 million 经营亏损，持有 $254.9 million 现金和投资，而不是产生正自由现金流。近期模型仍锚定美国 FFRCT 量，公司自己也把这称为单一产品依赖风险；与此同时，10-K
              明确说斑块商业化仍处早期。这意味着投资者实际上在承销两件事：旗舰产品量持续增长，以及新产品组合的报销成功转化。成本端也仍活跃：销售招聘、生产培训、技术投入、临床证据生成、诉讼，以及安全/质量开销都会吃掉经营杠杆。市场风险进一步放大压力。STAT
              的报销批评说明，如果 AI 定价走在已证明价值前面，支付方或医生反弹并非不可能；Cardiovascular Business 和 Cardiac Wire
              也显示，报销正在吸引更多资金充足的进入者切入斑块分析。缓释来自强毛利率、庞大装机基础和公立系统/客户证明，但剩余敞口仍为中高，因为盈利能力同时取决于使用密度、报销耐久性，以及竞争保持理性。
