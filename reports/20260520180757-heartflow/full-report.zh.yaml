      - number: '1.4'
        title: 里程碑、报销扩张与反向信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Heartflow 既有真实产品和商业动能，也还没有完成风险出清。独立回顾报道认为 Heartflow 首个 FFRCT 产品 2014 年在美国商业化上市；FDA K190925 记录则确认
              HeartFlow FFRct Analysis 于 2019 年获批。2021–2025 年，公司从生理学扩展到 Roadmap、Plaque，之后又进入 PCI 规划；2025 年 9
              月的外部报道记录了下一代斑块产品获批，并称检测能力较第一代算法提升 21%。报销动能也明显改善：Heartflow 强调 Plaque Analysis 的支付方覆盖扩大，Banner
              先成为可见客户、后又成为更广泛的战略合作伙伴，行业媒体也认为新的 CMS 和 CPT 经济性会加速基于 CCTA 的采用。但最有用的反向证据也在这里。2025 年 10-K 年度报告警告，Heartflow
              仍高度依赖 FFRCT，面临重大竞争，而且仍处萌芽期的 Plaque 商业化只贡献非常有限的收入。独立报道又给出第二重风险视角：新的 AI
              斑块报销代码正在受到审视，市场质疑四位数支付是否能被临床和经济收益证明。2026 年 4 月针对 Cleerly 的专利诉讼进一步说明，这已经是一个活跃竞争品类，而不是 Heartflow 无争议拥有的领域。
