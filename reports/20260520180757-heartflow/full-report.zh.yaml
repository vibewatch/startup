  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Heartflow 最严重的风险不是缺少监管批准，而是必须把一个快速演进的软件平台持续留在已获批、可报销的边界内。FDA 在 2025 年 7 月按 K250902 批准 Heartflow Analysis 为
              II 类器械，并明确把上市后运营同质量体系要求、标签规则和医疗器械报告绑定。Heartflow 自己的 10-K 说得更进一步：如果 FDA 不认可公司关于某项变更仍落在既有许可或 PCCP
              边界内的内部判断，监管方可以要求重新申报、叫停修改后产品的营销，或强制召回。同一份文件披露，历史 MAUDE 报告曾涉及假阴性和结果不精确；尽管截至 2025
              年监管文件，这些报告均未导致召回。商业风险和监管紧密耦合。FFRCT 报销已经成熟，但斑块报销直到 2025 年末和 2026 年才真正具备全国性，七个 MAC
              中五个覆盖，两个仍逐案处理。因此，在使用量得到证明之前，编码、医学必要性标准或支付方经济性仍可能收紧。Heartflow 2026 年 4 月针对 Cleerly
              的专利诉讼说明公司在守护护城河，但诉讼也带来成本、管理层分心和反诉敞口。法律和监管班底强于典型成长阶段医疗技术公司，但剩余敞口仍高，因为质量、报销和 IP 都是投资逻辑的关键。
