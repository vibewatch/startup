      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的护城河仍强于任何单一同业，因为它结合了规模、报销、产品宽度和嵌入式商业运营。公司给出的直接证据很有说服力：2025 年末美国装机账户 1,465 个，2026 年中全球机构超过 1,800
              家，公司称数据集超过 200 million 张带标注 CCTA 图像。医院很难在内部重建这些资产，小型竞争者也很难快速追上。但这条护城河并不像扫描仪所有权或手术室装机基础那样自我强化。Cleerly 正公开攻击
              Heartflow 的临床叙事；Elucid 试图占据高风险斑块故事；Keya 提供更灵活的 FFRCT 部署模式；Medis 加 GE
              则说明相邻既有厂商可以在工作流更后段接触心脏病医生。定价和耐久性上也有反向证据。STAT 质疑新的约 $1,000 Plaque Analysis
              支付是否值得，这很重要，因为即便临床采用增长，支付方怀疑也可能压平品类利润率。Heartflow 针对 Cleerly 的专利诉讼同时显示信心和脆弱性：其 IP
              资产庞大，但案件本身说明直接对手已经近到足以触发法律防御。最清晰的结论是，Heartflow 仍然领先，但未来优势取决于它能否在可报销斑块和生理学工具跨多厂商商品化之前，继续成为 CCTA 项目的运营默认选项。
