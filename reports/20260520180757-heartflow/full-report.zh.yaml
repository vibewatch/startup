        title: 乐观、基准、悲观区间逻辑
        blocks:
          - type: paragraph
            body: >-
              做情景数学比给单点目标更有信息量。悲观情景假设 2027 年收入只到 $245 million 至 $255 million，因为斑块变现不及预期，竞争性覆盖压缩定价权，市场只给 4.5x 至 6.0x
              EV/revenue。对应企业价值约 $1.10 billion 至 $1.53 billion，明显低于当前 $2.08 billion。基准情景假设 2027 年收入为 $285 million 至 $300
              million，FFRCT 继续耐久增长，斑块贡献可见但仍不完整，倍数为 7x 至 9x；企业价值为 $1.99 billion 至 $2.70 billion，大体包住今天的价值。乐观情景要求高得多：2027
              至 2028 年收入达到 $340 million 至 $380 million，斑块收入多元化被明确证明，并且在竞争加剧下继续保持品类领先。按 9x 至 11x EV/revenue，企业价值将达到约
              $3.06 billion 至 $4.18 billion。上行存在，但在更好证据出现前，还没有足以支撑买入的非对称性。
            claimRefs:
              - CV032
