      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的执行风险不在于缺管理层班底，而在于专业职能之间的协同负荷。公司报告 2025 年末有 843 名全职员工，并称成功取决于吸引和留住高技能技术人员。与此同时，增长现在要求 AI
              工程、质量/监管、信息安全、市场准入、收入运营、生产支持和客户成功同步交付。Q1 2026 业绩显示，Heartflow
              仍在增加销售人员、培训生产团队，同时提高技术和临床研究开支；换句话说，规模仍靠投入买来，还没有完全收割。这会提高入职滞后、前线执行不一致，或服务瓶颈的风险，而斑块分析、PCI
              规划和更广泛的流程产品仍在商业化中。缓释确实存在：Heartflow 如今披露的高管团队比许多医疗技术
              同行更厚，法务与合规、医疗、技术、产品、财务、运营、客户成功、收入、监管与质量、报销都有专职负责人。这降低了典型单一创始人脆弱性。即便如此，公开叙事在财报和产品发布中仍高度围绕 CEO John
              Farquhar；一旦领导层中断，或无法协调这套宽职能搭建，增长、支付方执行和信心仍会同时受打击。
