        - 中高：诉讼会消耗现金和管理层时间，也可能招致反诉或拖慢销售周期
        - 调取起诉状、案卷以及任何答辩/反诉；量化诉讼准备金和外部律师支出
      - - 国际监管维护（EU MDR / 其他市场）
        - 欧盟 / 英国 / 日本 / 加拿大
        - 进行中
        - '2'
        - '3'
        - 现有认证和公告机构监督；已在部分地区建立商业存在
        - 中：功能扩展或文件缺口可能拖慢上市，并抬高持续合规成本
        - 索取逐地区许可矩阵、续期日历，以及任何未关闭的公告机构发现项
    notes: 行按严重性排序，再按发生概率排序。核心观察是，Heartflow 的监管和报销风险互相缠在一起：软件变更和付款方经济性都会影响 Plaque 及未来工作流产品的变现。
