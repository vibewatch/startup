      - number: '3.3'
        title: 定价信号、GTM 能力、切换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              公开定价能见度很差，因此最清晰的比较不是标价，而是各厂商带到市场的报销和工作流结构。Heartflow 的公开报销基础最强：FFRCT 覆盖广、Plaque 覆盖可观，且有成熟的直销和客户成功模型。Cleerly
              和 Elucid 现在也受益于同一股 Plaque 报销顺风，但两者都没有在已审阅来源中公布净合同价格。Keya
              的说法不同：它强调以患者和支付方为中心的定价、不需要扫描仪认证，并且可以远程或现场运行分析，这降低了部署摩擦，也可能让站点更容易把 DVFFR 放在既有工具旁边试用。Medis 和 OEM
              生态又以不同方式竞争；它们的优势是渠道接入。GE 与 Medis 的合作显示，既有厂商可以把生理学软件拉入成熟的介入销售动作；Siemens 和 Canon 本来就贴近扫描仪采购和心脏 CT 工作流设计。这意味着
              Heartflow 上线后的切换成本有意义——因为计费支持、工作流集成、病例列表和医生习惯会围绕已安装账户累积——但并非绝对。医院仍然可以多供应商并用：保留 CCTA 项目，部分病例使用
              Heartflow，其他病例测试 Cleerly 或 Keya，并在下游依赖 Medis 或 OEM 工具。在这个市场里，锁定效应较少来自硬件依赖，更多来自报销信心、阅片习惯和伙伴接入。
