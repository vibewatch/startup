chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品栈
        blocks:
          - type: paragraph
            body: >-
              Heartflow 是一家冠脉护理软件公司。公司称，使命是把冠状动脉疾病从头号死因，变成一种可以早筛、准诊并终身管理的疾病。公司 2007 年在 Delaware 以 Cardiovascular
              Simulation 名义注册，2009 年更名为 HeartFlow，到 2025 年又把控股公司结构整合回 Heartflow, Inc.。运营思路始终一致：从冠脉 CTA 扫描出发，生成患者专属 3D
              模型，再交付临床医生可用于检测、生理学判断、斑块评估和手术规划的软件输出。Heartflow 现在把这套产品栈打包为 Heartflow One，其中 Roadmap Analysis 用于病变审阅，FFRCT
              Analysis 用于无创生理学判断，Plaque Analysis 用于斑块体积和成分分析，PCI Navigator 用于介入规划。后续章节需要注意一个身份细节：不同来源日期下，总部位置在漂移。2025 年
              10-K 年度报告仍列出 Mountain View 为主要行政办公室，而 2026 年产品和投资者页面显示 San Francisco 地址，一季度业绩也把搬迁与设施优化联系起来。
