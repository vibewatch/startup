  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手、既有厂商、替代方案与新进入者
        blocks:
          - type: paragraph
            body: >-
              Heartflow 所处的是一个分层市场，不是干净的一对一软件品类。最直接的重叠来自 Cleerly、Elucid 和 Keya，它们都使用冠脉 CT 图像来量化斑块、估算缺血，或两者兼做。Medis 并不是
              Heartflow 无创云端工作流的真正同类替代品，但它仍然重要，因为 QFR 给介入心脏病医生在导管室决策链里提供了相邻的生理学产品。上游的扫描仪和后处理既有厂商，如 Siemens、Canon 和
              GE，决定谁具备采用 CCTA 优先路径的心脏 CT 能力，因此拥有纯软件厂商缺乏的分销杠杆。现状仍有韧性：压力测试、PET 或 SPECT，以及直接转诊做侵入性冠脉造影，仍在争夺同一个诊断决策，尤其是在
              CCTA 项目不成熟，或临床医生不信任额外软件层的场景。下一波竞争已经可见。Cardiovascular Business 报道称，Caristo、Artrya、Circle
              Cardiovascular、Ziosoft 以及 Siemens 待推出斑块工具等更新的斑块分析厂商，正试图利用帮助 Heartflow 和 Cleerly 扩张的同一个报销窗口。含义是，Heartflow
              的市场领导地位真实存在，但它位于一个正在扩大的获报销技术栈中；竞争者可能来自直接 AI、导管室软件或 OEM 渠道，而不是一个显而易见的同伴集合。
