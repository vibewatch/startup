      - number: '3.2'
        title: 直接竞品画像、能力重叠与信任姿态
        blocks:
          - type: paragraph
            body: >-
              在直接同业中，Cleerly 是最明显具备规模且商业进攻性最强的挑战者，因为它结合了已披露的大额融资、覆盖进展，以及针对 FFRCT
              和压力测试的明确比较性主张。它把自己呈现为斑块、狭窄和缺血三合一工作流，而不是单点斑块读片工具。Elucid 今天更像差异化对手，而非直接替代者：它主打基于组织学的斑块成分和风险分层，不是当前商业化 FFRCT
              规模，但显然在搭建可报销的 Plaque + FFRCT 技术栈。Keya 是美国最可信的低摩擦 FFRCT 挑战者，因为它已经获 FDA 批准，并与代码 75580 绑定；但其 Plaque
              产品在美国仍处研究阶段，这限制了它与 Heartflow 扩张中的 Plaque 叙事的直接重叠。Medis
              的运营历史比初创同业长得多，但重心仍是基于血管造影的生理学和导管室规划，而不是可报销的无创斑块分析。相对这个领域，Heartflow 的信任姿态在买方重视广泛指南支持、直接装机规模、人工复核工作流运营，以及把
              Plaque 和生理学放在同一个商业伞下时最强。下行面是，Heartflow 不再拥有一个没有替代方案的品类：Cleerly 正在争夺临床叙事，Elucid 正在争夺组织表征，Keya 正在争夺更低摩擦的
              FFRCT 交付，Medis 加 OEM 则争夺下游介入工作流。
