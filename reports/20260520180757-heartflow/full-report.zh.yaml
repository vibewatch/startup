      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的商业模式深度依赖它无法控制的交易对手。支付方最明显：FFRCT 覆盖广，但斑块仍要把新拿到的全国商业保险和 MAC 支持转成常规使用。因此公司同时承担政策风险和报销运营风险，这也是
              Heartflow 维持大型编码、申诉和市场准入支持职能的原因。医院是第二个主要依赖。Heartflow 称超过 1,800 家机构使用平台，装机基础因此分散，但 10-K
              仍警告，决策集中度足以让一个客户流失造成不成比例的损害。采用还取决于 PACS/EMR 集成、CT 项目重设计，以及站点层面的临床拥护者。扫描仪和影像生态是第三个依赖：Heartflow 受益于 CCTA
              增长，但 Canon、Siemens、GE、Philips 等厂商越来越多地营销自家的心脏 CT 和后处理能力；Cleerly 等斑块分析竞争者以及新进入者也借报销势头缩小商业差距。NHS England
              推广、Banner Health
              扩张等公立系统和旗舰账户胜利有助于降低市场接受风险，但也让参考账户更集中，并抬高任何服务失败的代价。因此，尽管装机基础庞大，剩余敞口仍高；支付方、客户和流程依赖都会直接传导到使用量和收入。
