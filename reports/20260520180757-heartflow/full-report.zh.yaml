        - 监管文件以及 K250902、K190925 文件
        - 公开文件没有提供完整的上市后监测仪表盘。
      - - 质量管理义务
        - 有效
        - K250902 提醒 Heartflow，设计控制、CAPA、标签、MDR 和 UDI 义务均适用
        - FDA 许可函引用 QS 法规和上市后要求
        - 公开来源未披露审计频率、审计发现或 CAPA 历史。
      - - 数据保护架构
        - 有效
        - 平台声称具备静态和传输中加密、MFA/SSO、细粒度授权、安全 SDLC， 并会在处理时对 PHI 去标识化
        - 10-K 数据安全章节
        - 未找到公开架构白皮书或事件历史页面。
      - - 外部认证
        - 有效
