      - number: '4.3'
        title: 成本结构、毛利驱动与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的公开数字显示，公司确实取得了毛利率进展，但运营成本结构仍然很重。2025 全年毛利率达到 76.8%，2026 年一季度升至 80.2%；管理层将扩张归因于病例量提升，以及生产团队内部由
              AI 驱动的效率改善。10-K
              年度报告有用之处在于解释毛利率下面有什么：生产人工、托管、软件摊销、合同履约摊销、版税支付，以及设施或技术开销。这好过硬件业务，但也不是纯软件，因为生产工作流仍带有实质人工和质控成分。与此同时，运营费用仍然很大。R&D
              约占 2025 年收入的 37%，SG&A 约占 76%，所以强毛利率还没有转化为盈利。一季度延续了这个模式，运营费用为收入的 136%，总部搬迁减值又放大了报告经营亏损。因此，利润率路径方向上向好，尤其是
              Plaque 如果能在同一扫描上贡献增量收入；但 Heartflow 仍需要劳动自动化和更好的销售效率，才能把高毛利转化为持久盈利能力。
