  - id: TV005
    title: 投资逻辑失效与扼杀触发因素表
    columns:
      - 触发因素
      - 阈值 / 可观察事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长停滞
        - 报销保持稳定时，连续两个季度同比收入增长 <20%
        - 意味着使用密度或附加销售弱于平台逻辑假设
        - 立即下调至偏高，并重新审视悲观情景权重
      - - 斑块报销收紧
        - 商业支付方任何回滚、MAC 收窄，或围绕斑块分析的拒付模式明显恶化
        - 直接打击第二引擎逻辑，并削弱基准情景倍数支撑
        - 下调情景倍数区间，暂停任何上调
      - - 质量或监管事件
        - 与 Heartflow 分析输出相关的召回、类似警告信事件，或新的重大负面质量信号
        - 损害医生和支付方信任，不只是影响短期运营
        - 转为回避，除非整改和商业影响已被清楚圈定
      - - 竞争性报销趋同
        - 直接同业维持更广报销和商业化，而 Heartflow 未显示更好经济性
        - Heartflow 从品类创造者变成众多选择之一
        - 将溢价假设下修至上市可比公司中位数附近
      - - 资本市场依赖回归
        - 在产品组合或经营杠杆得到验证前，需要后续融资
        - 重新把稀释风险带回这个目前部分靠资本结构清理支撑的故事
        - 要求更低入场价，或继续等待
      - - 领导层或诉讼冲击
        - 重大领导层动荡，或损害商业化的诉讼结果
        - 同时抬高执行风险和护城河风险
        - 持有前重新评估护城河耐久性和管理层厚度
    notes: 每个触发因素都能从公开文件、支付方政策更新、管理层报告或法律进展中观察，而不是靠模糊的情绪检查。
    claimRefs:
      - CV018
      - CV031
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 斑块收入
        - 公开披露未拆分斑块收入、ASP、附加率或毛利率
        - 上行逻辑取决于斑块成为第二引擎，而不只是报销标题
        - 在 NDA 下索取月度产品级收入、病例数、ASP 和毛利率桥接
      - - 总额到净额与拒付
        - 没有按支付方类别披露公开的总额到净额瀑布图或拒付率
        - 名义高报销不等于实际单位经济性
        - 索取 FFRCT 和斑块按支付方类别的已支付、拒付、申诉和回款比例
      - - 成熟账户使用率
        - 公开数据披露已安装账户，但不披露成熟队列吞吐量或扩张曲线
        - 股票应按可持续密度估值，而不只是按客户数量
        - 索取按账户年份和站点类型拆分的队列使用率与附加率
      - - 留存与集中度
        - NRR、头部客户集中度和续约时间仍未披露
        - 溢价倍数支撑取决于粘性使用和可控的客户集中度
        - 索取前 10 大客户占比、合同期限和队列留存数据
      - - 斑块竞争经济性
        - 竞争对手报销和融资可见，但直接比较的胜率不可见
        - 没有比较转化数据，容易高估护城河耐久性
        - 索取对 Cleerly、Elucid、Keya 和院内替代方案的赢单 / 输单分析
      - - 资本配置
        - 公开证据显示现金和结构清理，但未显示销售招聘或临床投入的门槛回报率
        - 下一轮倍数提升应来自更高效增长，而不只是更多支出
        - 在形成更强观点前，审查各增长项目预算、招聘计划和回本预期
    notes: 这些问题刻意设得具体且可监控，因为剩余争论在于经济性和耐久性，而不是产品是否存在。
    claimRefs:
      - CV014
      - CV018
      - CV031
      - CV039
      - CV040
      - CV044
