        - 任何新警告信、强制召回，或与已发布算法相关的严重不良事件报告聚集
        - 重新核保产品质量假设，并下调增长倍数，直到 CAPA 和监管闭环得到验证
      - - Plaque 报销不及预期
        - MAC / 商业政策更新和产品级拒付率
        - Plaque 拒付率持续高企，或两个主要付款方在 12 个月内收窄标准
        - 下调 Plaque 采用爬坡，并降低中期收入预期
      - - 重大服务中断
        - 客户事故通知、云状态或报告周转延迟
        - 多日中断，或反复未达 SLA 且实质性延迟医生报告
        - 视为信任事件；要求复盘、整改预算和客户留存影响评估
      - - 客户集中度冲击
        - 续约披露、参考账户流失或账户使用量骤降
        - 流失一个主要参考账户，或证据显示单一客户贡献不成比例收入
        - 适用更高集中度折价，并加码客户尽调
      - - 竞争对手报销达到同等水平
        - Cleerly 或其他斑块厂商的覆盖突破和功能发布
        - 两个或更多竞争对手达到全国商业覆盖同等水平，且 Heartflow 差异化不清晰
        - 重新评估定价权，并给 Plaque 附加更低毛利率上行
      - - 执行超支
        - 季度运营费用增速相对收入增速
        - 销售 / 技术 / 临床支持支出连续三个季度增速高于收入
        - 推迟盈利时点假设，并扩大下行情景
      - - 领导层 / 管理梯队扰动
        - 高管离职和岗位调整
        - 关键报销、质量、技术或收入负责人离职，且没有迅速补位
        - 暂停上调信心，直到继任者质量和运营连续性清晰
    notes: 这些触发器尽可能设计成可外部监控，并能直接转化为核保动作，而不是泛泛担忧。
    claimRefs:
