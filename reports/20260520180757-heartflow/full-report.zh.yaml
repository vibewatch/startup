  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入假设
      - 倍数
      - 隐含 EV
      - 概率信号
      - 关键依赖
    rows:
      - - 悲观
        - 2027 收入 $245M-$255M
        - 4.5x-6.0x EV/收入
        - $1.10B-$1.53B
        - 如果 Plaque 变现不及预期，且市场下调对报销敏感 AI 标的的估值，这一情景就有意义
        - Plaque 收入保持很小，竞争压紧定价，增长滑向十几个百分点
      - - 基准
        - 2027 收入 $285M-$300M
        - 7.0x-9.0x EV/收入
        - $1.99B-$2.70B
        - 如果 FFRCT 保持韧性，Plaque 有贡献但尚未占主导，这是最可能情景
        - 附加率改善可见、80% 毛利率持续，并出现一定运营费用杠杆
      - - 乐观
        - 2027-2028 收入 $340M-$380M
        - 9.0x-11.0x EV/收入
        - $3.06B-$4.18B
        - 需要强执行和支持性市场，而不只是一个好季度
        - Plaque 成为已披露的第二引擎，竞争格局保持理性
    notes: 收入和倍数假设是明确转换后的区间，不是隐藏电子表格。基准情景覆盖当前 EV；乐观情景需要尚未公开披露的证据。
