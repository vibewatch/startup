      - number: '8.4'
        title: 可比框架：公开参照与私有里程碑标记
        blocks:
          - type: paragraph
            body: >-
              可比公司工作指向纪律，而不是兴奋。Heartflow 当前约 9x 的前瞻 EV/revenue 高于 iCAD、PROCEPT 等流程或手术医疗技术参考标的，后两者市值/收入约 5x；这一倍数也大致接近
              Nano-X、Butterfly 等影像 AI 参考标的。可比性并不完美。没有哪家公司以完全相同的方式组合冠脉 CCTA 软件、报销广度和 Heartflow
              的装机规模，因此一定溢价可以成立。但私有直接同业也没有显示真空。Cleerly 的报销胜利和新融资、Elucid 的资本基础和组织学差异化、Keya 的 CT-FFR 定位，以及 Medis 或 Canon
              的渠道实力，都说明冠脉 AI 已经从品类创建进入竞争性商业化。正确的估值解读是：Heartflow 比多数直接同业更经验证，但当前倍数已经接近相邻影像 AI
              参考标的的上沿，而最重要的变现变量仍不公开。因此，可比表应当用于校准估值区间，而不是被误当成精确的公允价值神谕。
