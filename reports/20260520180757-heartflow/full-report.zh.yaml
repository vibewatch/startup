      - number: '6.5'
        title: 扩张杠杆、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的公开扩张逻辑是自洽的：Plaque 搭同一次 CCTA 扫描和 FFRCT 一起卖，主要支付方覆盖在扩大，独立行业媒体也反复指出，报销和指南支持会加速心脏 CT AI 的使用。Arizona
              和 Florida 的落地页展示了 Heartflow 如何把覆盖转成地方层面的销售素材；Fierce 和 CIToday 也说明，支付方胜利和 CMS
              规则变化已经进入公司的销售动作。但集中度和采购风险仍然不轻。监管文件称没有单一客户贡献超过 10%
              收入，却也说明少数客户决策者可能控制多个账户；这种集中风险比简单的收入占比更隐蔽。同一份文件警告，客户可能下调订单量、谈判使用返利，或因报销削减而收缩；文件还提到 Medicare
              拟议支付下调的可能性。最后，STAT 的质疑文章表明，即使覆盖扩大，价值问题仍会存在，尤其是斑块分析尚未大规模常规化之前。
