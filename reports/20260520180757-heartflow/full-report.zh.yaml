      - number: '4.5'
        title: 财务结论、收入质量与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是好坏参半，但仍可投资。收入质量好过第一眼印象，因为 Heartflow
              销售的是无需客户资本开支的经常性按分析计费工作流；公司也有足够的覆盖、支持基础设施和装机规模，让真实使用驱动收入成为可能。毛利率已经很强，如果自动化持续降低人工生产工作量，看起来有能力维持在高 70% 到低
              80% 区间。问题是，公开故事仍依赖一个 2025 年末占收入 98% 的 FFRCT 业务。Plaque 可能成为有力的第二引擎，但公开证据仍只显示报销动能和装机附着，而不是已披露的 Plaque 收入、ASP
              或利润率。最大的尽调阻断项因此都落在私有数据里：按产品和站点类型划分的实际定价、返利瀑布、CAC 和销售代表产能、按账户队列的留存、头部客户集中度，以及分产品结构。公开资本目前看足够，但公司股票约 9x 到
              10x 前瞻收入倍数，已经假设它能把广泛报销和重支持部署，转化为一个更多元、更高效的平台业务。
