      - number: '8.2'
        title: Heartflow 为何应有溢价——以及溢价为何应有上限
        blocks:
          - type: paragraph
            body: >-
              Heartflow 理应相对普通医疗技术公司享有一些溢价，因为它不是投机性 AI 演示，而是有真实装机基础、报销和流程机器。FY2025 结束时，公司有 1,465 个美国账户和 489 个斑块账户；Q1
              2026 口径则提到全球超过 1,800 家机构、接近 650,000 名患者。产品栈现在包括 FDA 准入的斑块分析，以及 DECIDE 这类商业决策支持材料，支撑了 Heartflow 在同一次 CCTA
              检查上加深使用的逻辑。这些事实支持溢价倍数。反向逻辑同样具体。公开文件仍称 FFRCT 占 2025 年收入的
              98%，所以投资者大多在承销一个已经验证的引擎，再加上披露不足的增购故事。竞争者资金更足，报销也越来越到位：Cleerly 拿到 UnitedHealthcare 和 Cigna 覆盖并又融资 $106
              million，Elucid 已披露融资 $121 million 且主打差异化的组织学路径，Keya 按 CPT 75580 营销 CT-FFR，Medis 与 GE、Canon 等 OEM
              或导管室渠道则会挤压流程。STAT 的定价批评说明，即便已覆盖的报销也可能遭遇价值反弹。溢价有理由，但必须有上限。
