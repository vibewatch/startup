        - 高：软件变更或缺陷可能触发警告信、新 510(k)、停售或召回审查
        - 刷新 2026 年 FDA MAUDE 和召回数据库检查；审阅设计变更文件和 CAPA 历史
      - - Plaque 报销 / 编码收缩
