      - 当前工作流步骤
      - Heartflow 解决方案
      - 可衡量收益 / 信号
      - 限制 / 注意事项
    rows:
      - - 高效读取每份 CCTA
        - 阅片医生收到 CCTA，需要快速初步理解病灶
        - Roadmap 自动向 PACS 或 Heartflow 系统交付解剖概览
        - SMART-CT 公开信号称阅片最高快 25%，阅片者之间一致性提高 >40%
        - 收益聚焦阅片工作流；公开证据未显示单独付费 SKU。
      - - 判断病灶是否需要介入
        - 医生有解剖扫描，但生理确定性有限
        - FFRCT 提供冠脉树各处的病灶级血流值
        - Heartflow 引用 90 分钟中位周转时间，以及 PRECISE 和 PACIFIC 结局 / 准确性信号
        - 效用仍取决于图像质量、病例接受和支付方覆盖。
      - - 更早加强预防治疗
        - 医生想获得超越单纯狭窄或钙化积分的风险信息
        - Plaque 分析结合分期背景量化斑块负荷和成分
        - DECIDE 和 REVEALPLAQUE 被用作斑块改变管理并与 IVUS 对齐的信号
        - 长期附加率、支付方耐久性和已实现经济性的公开证据不完整。
      - - 导管室前规划 PCI
        - 介入团队希望支架置入前掌握病灶、钙化、斑块和生理背景
        - PCI Navigator 在一个界面合并这些视图
        - Banner 和 2026 新闻室信号显示临床与注册研究使用在增长
        - 公开来源仍像发布阶段，未量化规模化常规使用。
      - - 启动并扩展 CCTA 项目
        - 站点需要协议帮助、编码支持、集成和医生教育
        - Heartflow 支持提供实施、报销、同行教育和病例支持
        - 比自助式软件模式采用摩擦更低，账户嵌入更深
        - 公开材料未量化服务小时、人员负载或 SLA 承诺。
    notes: 收益列使用已发表研究或部署信号，而非内部 ROI 主张。注意事项点出公开文档止步的运营或证据断点。
