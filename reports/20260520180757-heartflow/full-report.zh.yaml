      - number: '5.4'
        title: 部署、集成、可靠性代理指标与支持
        blocks:
          - type: paragraph
            body: >-
              对一家常被描述为 AI 软件的公司而言，Heartflow 的部署模型异常偏服务。支持页面不是补充材料，而是几乎写出了实施手册。Heartflow 提供 CCTA 图像质量的协议和工作流建议、Heartflow
              One 的手把手部署、PACS 和 EMR 集成帮助、编码和报销支持、费率谈判与理赔审计帮助、同业教育，以及病例级临床和技术支持。这套组合降低了医院和影像中心的采用摩擦，也可能解释了公司为何能在 2025
              年末声称美国账户超过 1,465 个，并在当前营销页面上声称机构超过 1,800 家。取舍在于，公开可靠性证据大多是间接的。Heartflow 营销 90 分钟中位周转时间，患者页面也强调除了原始 CCTA
              外，无需额外扫描、预约或辐射；但已审阅来源没有公开状态页、正常运行时间历史、事故披露档案或硬性外部 SLA 语言。实践者 / 开发者信号也很薄。公开来源显示集成主张和支持联系方式，但没有开放 API
              文档或公开沙盒，因此集成深度看起来仍是账户管理驱动，而非社区驱动。
