  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Butterfly Network
        - ~$1.14B 市值；~$0.10B TTM 收入
        - ~11.4x 市值/收入
        - 具备软件叙事和增长预期的公开影像 AI 与工作流参照
        - 硬件加软件组合与手持超声市场，和冠脉 CCTA 分析差异很大
      - - iCAD
        - ~$0.10B 市值；$19.52M TTM 收入
        - ~5.1x 市值/收入
        - 小盘公开影像 AI 参照，显示证据更窄时市场愿意支付的价格
        - 乳腺影像焦点和规模都远小于 Heartflow 平台
      - - PROCEPT BioRobotics
        - ~$1.59B 市值；~$0.32B TTM 收入
        - ~5.0x 市值/收入
        - 高增长公开医疗科技工作流公司，可作为溢价医疗科技倍数的纪律锚
        - 手术机器人经济性不同于软件优先的冠脉分析
      - - Nano-X Imaging
        - ~$0.12B 市值；$12.3M TTM 收入
        - ~9.8x 市值/收入
        - 影像 AI 参照，显示市场会为影像基础设施可选性支付溢价
        - 商业成熟度和收入基础远弱于 Heartflow
      - - Cleerly
        - 2025 年覆盖突破；2024 年 $106M 延展轮
        - 估值未披露；只是商业化里程碑
        - 在斑块报销和商业化势头上，最接近的直接私营竞争对手
        - 未披露投后估值，因此这是里程碑参照，而不是可交易倍数
      - - Elucid
        - 2023 年 $80M Series C；累计融资 $121M
        - 估值未披露；只是商业化里程碑
        - 直接的斑块表征同业，组织学定位差异化
        - 融资能说明投资人信心，不能说明当前清算价格
      - - Keya / Medis / Canon 组合
        - Keya 历史融资 >$110M；Medis-GE 渠道绑定；Canon AI 心脏 CT 栈
        - 未披露直接估值；战略竞争标记
        - 说明初创公司和在位渠道都在争夺冠脉工作流经济性
        - 战略里程碑组合不如纯上市公司可比样本精确
    notes: 这是代表性样本，不是完整的冠脉 AI 估值普查。上市公司行使用市值 / 收入，因为每个可比来源的债务和现金并未统一标准化。
