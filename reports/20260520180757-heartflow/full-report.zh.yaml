        - 影像心脏科医生 / 放射科医生
        - 商业化、捆绑、广泛嵌入
        - 每份可接受并发送给 Heartflow 的 CCTA 的默认解剖分诊层
        - 提高阅片速度和一致性；即便未订购付费附加项，也让 Heartflow 留在每个病例里
        - 公开证据未显示企业合同是否单独为 Roadmap 定价，还是只把它用于留存。
      - - FFRCT 分析
        - 心脏科医生、放射科医生、转诊医生
        - 商业化旗舰；最成熟模块
        - 增加病灶级生理信息，用来判断谁需要血运重建
        - 同一 CCTA 上的 AI 加 CFD 生理学、指南认可、广泛报销和最深证据基础
        - 公开来源仍未按账户队列拆分附加率，也未按病例复杂度披露周转时间分位数。
      - - Plaque 分析
        - 预防心脏科、影像阅片医生、下游治疗医生
        - 已商业化，报销和证据基础正在扩展
        - 量化斑块负荷和成分，结合分期背景指导风险管理和预防治疗
        - 相对 IVUS 前瞻性验证，并被定位为超越单纯狭窄的预防管理层
        - 公开证据仍缺少按支付方类别划分的产品级收入、附加率和结果耐久性。
      - - PCI Navigator
        - 介入心脏科医生
        - 发布阶段 / 正从注册研究和合作证据扩展
        - PCI 前和术中规划，把解剖、生理和斑块放在同一视图
        - 把 Heartflow 从诊断延伸到导管室规划，无需新增影像模态
        - 常规使用、活跃站点数量和实时病例所需系统的公开证明仍有限。
      - - Plaque Tracker
        - 预防心脏科 / 长期照护团队
        - 2027 年路线图项目
        - 连续 CCTA 的纵向对比，用来评估治疗后的斑块回归
        - Heartflow 斑块量化和列线图工作的自然延伸，进入疾病监测
        - 尚无公开监管、临床、定价或部署细节。
      - - Heartflow 支持
        - 项目管理员、技师、收入周期负责人、医生倡导者
        - 围绕每次部署的商业服务层
        - 通过培训、集成、报销和病例支持，搭建并扩展 CCTA + Heartflow 路径
        - 比自助式开发者产品更容易采用，也让 Heartflow 更深嵌入账户运营
        - 服务强度可能隐藏公开材料未量化的人工依赖。
    notes: 本表把明确商业化的模块、捆绑工作流层和前瞻性扩展拆开。状态标签只反映已审阅的公开证据，并刻意区分规模化可用性、发布阶段和路线图主张。
