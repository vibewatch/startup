        - 截至 Mar. 31, 2026 为 $254.9M
        - 主要流动性缓冲
        - 对一家仍在亏损的公司来说，绝对现金余额较强
        - 提供非受限现金、契约约束和最低运营现金目标。
      - - 经营现金消耗
        - FY2025 为 $54.0M
        - 锚定实际现金流的最佳公开烧钱代理指标
        - 暗示 IPO 后 Heartflow 并不接近融资悬崖
        - 提供月度现金消耗桥，以及 2026 年不同情景下的预计消耗。
      - - 公开现金跑道代理指标
        - 49-57 months
        - 把资产负债表现金转成承销时间窗口
        - 在近期烧钱假设下，意味着多年现金跑道，而非马上依赖融资
        - 确认董事会批准的现金跑道目标，以及对 Plaque 采用放慢的敏感性。
      - - IPO 募资
        - 2025 年净额 $332.4M
        - 重置股权流动性，并为债务清理提供资金
        - 说明当前流动性很大程度来自资本市场，而非内部生成
        - 按用途桶提供剩余 IPO 现金，以及任何预留 M&A 能力。
      - - 2025 年可转票据
        - $98.3M 本金；IPO 时自动转换
        - 通过把类债资本转为股权，降低再融资风险
        - 资产负债表比 IPO 前私人融资结构更干净
        - 提供已转换发行之外任何剩余类票据或结构性义务。
      - - 定期贷款清理
        - 偿还 $115.1M 本金，另有 $6.8M 退出和提前还款费用
        - 显示简化资本结构的成本
        - IPO 现金部分用于去杠杆，而不只是投入增长
        - 提供当前债务期限表（如有）和剩余有息义务。
      - - 租赁足迹
        - $26.5M 租赁义务；$6.2M 截至 2026 年到期
        - 如果增长放缓，设施可能成为隐藏现金拖累
        - 总部搬迁既产生减值费用，也留下多年租赁包袱
        - 提供按站点划分的租赁使用率和预期转租回收时间。
      - - 转租抵消
        - Mountain View 转租从 2026 年开始，并在 Mar. 2027 前爬坡至满租
        - 抵消部分租赁负担
        - 缓解但不能消除场地成本
        - 提供已签约租金收入、空置期风险和房东同意条款。
      - - 特许权使用费义务
        - 剩余合计义务 $0.3M
        - 说明授权许可不是主要资本强度问题
        - 相对人工和 SG&A，特许权使用费负担可控
        - 提供既定最低额之外任何收入分成条款。
