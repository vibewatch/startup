      - number: '4.4'
        title: 流动性、债务义务与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的近端资本图景强于 GAAP 亏损本身所暗示的水平，因为 2025 年重置了资产负债表。公司 2025 年末持有 $280.2 million 现金、现金等价物和投资，2026 年 3 月
              31 日仍报告 $254.9 million。这一流动性来自资产负债表重置：约 $332.4 million IPO 净募集资金、$72.8 million 2025
              年可转债净募集资金，随后可转债自动转换，并偿还 $115.1 million 定期贷款。公开市场数据现在给公司的估值接近 $2.3
              billion；原则上，只要增长仍可信，公司仍可获得新股权融资。重要细节是，Heartflow 并非所有意义上都资本轻。2025 年经营现金使用仍为 $54.0 million，租赁承诺合计 $26.5
              million；公司 2026 年还因腾退或缩小 Mountain View 空间、在安排转租前产生减值。即便如此，公开数据指向的是多年现金跑道，而非立即融资依赖，尤其是 2025 年物业和设备支出只有 $5.0
              million，版税义务也不高。承销问题因此不是能否活下去，而是当前现金缓冲能否在投资者失去耐心前，转化为持久的产品组合和销售效率改善。
