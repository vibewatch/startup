      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Heartflow 是软件占比很高的医疗技术公司，公司价值取决于能否在医院诊疗路径中交付正确、快速、适配流程的输出。10-K
              称，过去的软件代码和发布流程缺陷曾导致医生使用间歇性中断，也披露过涉及假阴性和读数不精确的历史 MAUDE
              报告。关键在于，医生、患者和支付方信任本身就是采用的核心变量。公司有实质缓释：存储和传输加密、敏感数据去标识化、年度网络风险评估、审计委员会季度监督，以及 HITRUST、ISO 27001、ISO 13485
              和 SOC 2 Type 2 等认证。但同一份文件也称，Heartflow 依赖外包的 AWS 云基础设施、第三方服务商，生产相关计算集中在 California 和
              Texas。云中断、网络事件或本地灾害都可能拖慢报告交付并损害信任。流程依赖同样真实。Heartflow 必须接收客户 CCTA 检查，接入 PACS 和 EMR
              环境，并帮助站点提升图像质量和阅片效率；只要这套赋能掉链子，即使有报销，使用量也可能停滞。外部输入也重要：Heartflow 自己引用 2022 年碘造影剂短缺，说明供应扰动会压低 CCTA 量。Q1 2026
              业绩又给出执行信号：毛利率提升被招聘和培训生产人员部分抵消，公司还在总部搬迁中确认了设施减值。
