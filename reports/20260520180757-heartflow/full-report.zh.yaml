  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按真实临床工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Heartflow 最适合被理解为覆盖在冠状动脉计算机断层血管造影之上的后处理运营层，而不是扫描仪、PACS 替代品或独立导管室设备。工作流从临床医生为疑似冠状动脉疾病患者开立并获取 CCTA
              后开始。Heartflow 官方产品页和监管文件描述了一个安全传输流程：既有 CCTA 数据进入云平台，软件把扫描转成患者专属的 3D 冠脉树表示，再返回具备临床行动性的输出。按当前营销语言，Heartflow
              One 打包了四件事：用 Roadmap 识别疾病，用 FFRCT 决策，用 Plaque Analysis
              管理，再用支持服务搭建项目。实际使用中，影像阅片者会自动收到一层解剖分诊；之后按需要下单更详细的生理学和斑块模块，结果通过网页、PDF、PACS 和 EMR 界面回传。因此，关键产品点是工作流压缩：输入一次
              CCTA，输出一组分阶段的解剖、生理学、斑块和治疗规划结果，在此之前不要求患者先接受另一项无创或侵入性诊断检查。
