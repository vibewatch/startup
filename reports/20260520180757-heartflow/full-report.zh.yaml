      - number: '2.4'
        title: 竞争、替代品与 Heartflow 定位
        blocks:
          - type: paragraph
            body: >-
              Heartflow 位于拥挤的竞争栈中，而不是一个赢家通吃的软件品类。直接 AI 对手包括 Cleerly、Elucid 和 Keya；相邻的生理学和后处理厂商包括 Medis；更大结构则受 CT OEM
              影响，这些厂商既能捆绑心脏 CT 能力，也会捍卫压力影像等传统模态。Cleerly 已经在营销中提出对 FFRCT 和压力测试的比较性主张，Elucid 以基于组织学的斑块成分作为差异化，Keya 推动无创 CT
              FFR 经济性，Medis 则通过厂商无关软件提供基于血管造影的生理学。软件集合之外，侵入性冠脉造影和传统压力测试仍在争夺同一个诊断决策，并深嵌在临床常规里。Heartflow 的反向定位，是成为 CCTA
              项目的标准分析层：广泛报销、高装机基础、数据集规模、临床证据和工作流支持，是公司的核心护城河论据。市场结构上的结果是，Heartflow 受益于 CCTA 增长，但并不直接控制扫描仪、开单行为或报销环境。
