      - number: '8.5'
        title: 建议、入场纪律、逻辑破裂触发点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              投委会结论是观察，不是回避，也不是买入。按公开市场定义，公司已经具备退出状态：股票已交易，IPO
              前融资悬挂已清理，流动性仍足以支持执行。但投资逻辑完整度低于公司质量。委员会在上调评级前应等待两件事之一：要么入场价格明显更好，接近 2026 年指引中点 EV/revenue 的 7x、约每股
              $21.78；要么有明显更强的证据证明斑块是一个有防御性单位经济的收入引擎。如果在覆盖稳定的情况下收入增长跌破 20%，如果支付方或 MAC
              围绕斑块定价收紧政策，或如果质量、监管、诉讼事件打断医生信任，投资逻辑就会破裂。最终尽调应聚焦产品级斑块收入、gross-to-net
              实现、拒付率、成熟账户使用量、留存和客户集中度。在这些项目可见之前，当前价格面对真实下行路径只提供中等上行，正适合放在监控型观察名单，而不是果断进场。
