      - number: '2.3'
        title: 增长驱动、报销催化与采用障碍
        blocks:
          - type: paragraph
            body: >-
              目前有三股力量支撑市场增长。第一，Heartflow 和行业媒体都指向一个更奖励 AI 辅助冠脉分析的报销制度，尤其是 Plaque Analysis 进入 Category I
              报销、全国性商业保险覆盖扩大之后。第二，Heartflow 称自己有深度临床验证、广泛指南支持和不断增长的真实世界数据集，这些都能帮助说服临床医生和支付方：这条路径不是又一个放射科 AI
              叠加层。第三，工作流自动化很重要：RoadMap、集成服务和客户支持基础设施，降低了 CCTA 项目扩张的运营负担。但障碍并非表面问题。Heartflow
              自己警告，医生可能不愿改变标准实践，支付方仍可能收窄或修改覆盖范围，Plaque 商业化尽管早期有动能，仍处萌芽期。这意味着品类可以快速增长，同时仍在运营上脆弱，并对证据、编码政策和本地工作流执行高度敏感。
