        - 在位 OEM / 工作流控制
        - 拥有资本设备和服务渠道的全球医疗技术在位者
        - 购买或升级扫描仪的放射科和心脏科部门
        - 心脏 CT 采集、后处理、功能测试和工作流工具
        - 渠道力量很强，但可报销斑块 / FFRCT 软件广度仍不如 Heartflow 明确
      - - 压力测试 / 直接 ICA
        - 现状替代方案
