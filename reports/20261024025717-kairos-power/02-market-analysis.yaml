company:
  name: Kairos Power
chapter:
  number: 2
  title: Market Analysis
  summary: Kairos Power addresses the market for clean, firm electricity and advanced-reactor infrastructure rather than an undifferentiated global energy TAM. Public evidence supports a large potential nuclear deployment envelope and credible demand drivers, but the addressable commercial segment remains constrained by licensing, fuel, site, capital, and contract-economics uncertainty.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is the development and eventual sale of clean, firm
      electricity and advanced-reactor systems for utilities, large power buyers,
      and public-sector or industrial sites. It includes reactor design and
      licensing, demonstration and engineering infrastructure, fuel and coolant
      production, construction, long-term operation, and power purchase
      arrangements. It excludes the entire global electricity market, unrelated
      renewable generation, and secondary-market financial products. The status
      quo alternatives are existing light-water nuclear, gas generation, renewables
      paired with storage or demand response, and delaying load growth. A government
      siting analysis makes the deployment envelope concrete: it examined 54
      operating and 11 recently retired nuclear sites across 31 states, while
      Kairos's Albuquerque filing defines a narrower enabling-market wedge around
      salt production, fuel-development laboratories, and design-build-test
      capability.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      No retained source isolates Kairos Power's SAM or SOM, and the company is
      private, so a single headline TAM would overstate precision. Three lenses
      are more decision-useful. First, DOE's preliminary siting work estimates 60
      to 95 GW of potential new capacity at existing or recently retired nuclear
      sites, with the upper case including smaller advanced reactors of 600 MW;
      this is a deployment opportunity, not Kairos revenue. Second, DOE says about
      200 GW of additional nuclear capacity may be needed by 2050 to support
      projected demand, a policy-scale demand signal rather than a booked market.
      Third, Kairos's Albuquerque project documents $300 million of additional
      company investment through 2028 and at least 100 jobs, a local
      infrastructure and supply-chain wedge rather than reactor sales. These
      lenses bound opportunity while preserving geography, methodology, and
      denominator differences.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The primary economic buyer is a utility or large electricity consumer that
      can sign a long-duration power contract and tolerate a first-of-a-kind
      construction program. The user is the grid, plant operator, or industrial
      load; the payer is the utility, corporate offtaker, public sponsor, or
      project-finance structure. Google is described by UpMarket as targeting a
      500 MW fleet by 2035, but the retained page does not disclose contract price,
      duration, risk allocation, or termination rights. Public-sector and
      institutional counterparties also matter: DOE's ARDP is described as a
      cost-shared partnership, while the Albuquerque packet says the company
      funds its requested bonds and ties the project to out-of-state customers
      and investors. The adoption sequence is therefore demonstration, regulatory
      acceptance, fuel and manufacturing qualification, site and financing
      commitment, then repeat deployment.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by electrification and data-center growth: the IEA's
      2026 electricity outlook describes rapidly rising power demand and a need
      for flexibility as systems integrate diverse generation. Kairos's
      technology proposition is a lower-pressure fluoride-salt coolant and TRISO
      fuel design, while its iterative testing strategy is intended to reduce
      technical, licensing, manufacturing, and construction risk. The constraint
      set is equally material. GAO reports that NRC modified its advanced-reactor
      licensing process but still faces staffing and retention challenges and has
      not measured whether incentives close those gaps. The Breakthrough account
      also identifies the absence of domestic HALEU capability as a deployment
      issue. Consequently, valuation depends on evidence of schedule, cost,
      licensing, fuel availability, and binding offtake economics, none of which
      is fully public in the assigned pool.
    claimRefs: [CM012, CM013, CM014, CM015]
    callouts:
      - calloutType: insight
        title: Market opportunity is real but gated
        body: The evidence supports a substantial clean-firm-power opportunity, but the investable market is the portion that clears licensing, fuel, site, financing, and offtake gates.
        claimRefs: [CM004, CM012, CM015]
      - calloutType: risk
        title: SAM and contract economics remain open
        body: Public sources do not isolate Kairos's serviceable market share or disclose the economic terms of the Google-related fleet, so deployment potential should not be treated as revenue visibility.
        claimRefs: [CM008, CM015]
