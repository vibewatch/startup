company:
  name: Kairos Power
chapter:
  number: 6
  title: Customers
  summary: Kairos Power has moved beyond undifferentiated prospecting into structured relationships with utilities, hyperscaler energy teams, and nuclear operators, but the public record still describes planned demonstrations and announced capacity rather than delivered commercial output, recurring revenue, or retention.
sections:
  - id: buyer-segments
    title: Buyer segments and customer workflow
    body: >-
      Kairos Power's public customer surface is concentrated in infrastructure buyers
      that need firm, carbon-free electricity and in nuclear operators that can shape
      deployment requirements. The clearest end-user signal is Google's data-center
      energy organization, with TVA serving as the utility and transmission counterparty
      for the announced Hermes 2 arrangement. A second segment is utilities and
      generators that can advise on siting, licensing, operations, manufacturing,
      construction, and commercialization; Kairos described this role for Bruce Power,
      Constellation, Southern Company, and TVA in its OMADA consortium. The Albuquerque
      public record adds a manufacturing and fuel-development footprint, but it is
      evidence of capability-building rather than customer adoption. A commercial
      program-management posting confirms that Kairos is building CRM, proposal,
      customer-management, and partnership processes, which is a useful operating
      signal but not proof of contracted revenue. Public evidence does not disclose
      buyer-level pricing, contract duration for Kairos's agreements, realized
      utilization, or the allocation of economics between Kairos, TVA, and Google.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: >-
      The adoption trajectory has three distinct layers. First, Kairos has assembled
      an ecosystem of utilities and generators to advise on the technology and its
      commercialization, which is stronger than a logo-only relationship but remains
      a consortium and development signal. Second, the Hermes 2 PPA announcement
      identifies a concrete planned plant, a utility buyer, a hyperscaler beneficiary,
      and up to 50 MW of intended delivery, with operations targeted for 2030. Third,
      the broader Google arrangement is described as up to 500 MW across six to seven
      reactors by 2035. These figures are announced capacity and schedule targets;
      they do not establish commissioning, delivered megawatt-hours, payments,
      renewals, or customer concentration. A government project record also documents
      a planned $300 million Kairos investment and at least 100 jobs in Albuquerque by
      the end of 2028, which supports scaling intent but is not a customer metric.
      The evidence therefore supports progressing commercial validation, not claiming
      active fleet adoption.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Durability, expansion, and procurement risk
    body: >-
      The strongest expansion mechanism is a first-of-a-kind demonstration that can
      create operating evidence for later reactors. Google and TVA explicitly frame
      Hermes 2 lessons as a way to improve the economics of future units, while Kairos
      describes the demonstration as a pathway toward a commercial fleet. That is a
      plausible land-and-expand loop, but it remains conditional on licensing,
      construction, operation, and cost performance. The customer base is also
      economically concentrated in a small number of strategic counterparties in the
      disclosed record: Google and TVA anchor the current PPA, while the OMADA members
      are prospective advisors and collaborators rather than a disclosed recurring
      customer cohort. Independent reporting on large-load tariffs shows that data
      center procurement can involve long commitments, minimum-payment requirements,
      collateral, and early-exit penalties in comparable utility settings; those
      terms are not evidence of Kairos's contract, but they identify diligence items
      for its customer economics. No public source in this pool reports NRR, GRR,
      churn, renewal, customer satisfaction, or realized customer-level margins.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Strategic customer validation
    body: The Google- TVA- Kairos structure links a hyperscaler energy need, a regulated utility, and a named advanced-reactor project; it is materially stronger than an unaffiliated customer logo, while remaining pre-operational until Hermes 2 is built and runs.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Adoption is not yet durable revenue
    body: Public disclosures establish announced capacity and counterparties, not delivered power, recurring revenue, renewal behavior, or contract profitability; the next diligence step is to obtain executed contract economics and operating milestones.
    claimRefs: [CU008, CU011, CU013, CU014]
