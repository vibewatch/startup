      - ["Bruce Power", "Nuclear operator", "OMADA advisory participation on technology and commercialization", "Development collaboration", "Provides operator expertise to inform siting, licensing, manufacturing, construction, and commercialization", "No named reactor purchase or production deployment disclosed"]
      - ["Constellation", "Nuclear operator and energy supplier", "OMADA advisory participation on advanced nuclear development", "Development collaboration", "Brings operating knowledge from a large nuclear fleet to the consortium", "Advisory role is not proof of a Kairos purchase or deployment"]
