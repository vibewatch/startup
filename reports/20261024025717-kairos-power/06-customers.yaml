  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: Executed customer contracts, renewal terms, delivered-energy records, and customer-level economics for Google, TVA, and any other commercial counterparties.
      whyItMatters: Without realized delivery and contract economics, announced capacity cannot be translated into recurring revenue, retention, margin, or customer lifetime value.
      diligencePath: Request executed PPA and related agreements under NDA, including payment schedule, availability obligations, termination rights, collateral, and delivery acceptance tests.
      relatedQuestionRefs: [QU005, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: concentration
      missingEvidence: Complete customer and counterparty list, including undisclosed utilities, industrial users, and any paid advisory or engineering relationships.
      whyItMatters: The public record may understate customer concentration and channel dependence.
      diligencePath: Reconcile CRM account exports, signed commercial agreements, and pipeline by segment against the named public counterparties.
      relatedQuestionRefs: [QU001, QU006]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adoption-trajectory
      missingEvidence: Independent evidence of Hermes 2 construction progress, commissioning, operating performance, and delivered megawatt-hours.
      whyItMatters: The chapter's strongest adoption evidence is forward-looking and could fail to convert into operating proof.
      diligencePath: Obtain current construction milestone records, NRC status, commercial operation date evidence, and first-year availability data.
      relatedQuestionRefs: [QU002, QU003, QU008]
    - type: missing-source
      severity: material
      topic: procurement-friction
      missingEvidence: Kairos-specific contract risk allocation, minimum-take obligations, collateral, and utility interconnection terms.
      whyItMatters: Comparable utility tariffs show that large-load procurement can shift substantial cost and schedule risk to customers, but the Kairos allocation is unknown.
      diligencePath: Review the executed TVA PPA, interconnection agreement, and Google commercial framework with counsel and energy-market specialists.
      relatedQuestionRefs: [QU007]
