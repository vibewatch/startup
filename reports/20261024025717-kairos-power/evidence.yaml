evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Current fully diluted cap table, common-equity valuation, preference stack, and cumulative primary equity raised.
    whyItMatters: Without these records, ownership concentration, dilution, investor rights, and entry valuation cannot be assessed.
    diligencePath: Request the latest board-approved cap table, financing documents, 409A work, and a proceeds bridge by instrument.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Current board, independent directors, committees, observer rights, succession plan, and delegated authorities.
    whyItMatters: >-
      Founder concentration is visible, but governance capacity for nuclear construction and multi-party delivery is
      not.
    diligencePath: >-
      Obtain the board roster, governance documents, committee charters, reserved matters, and executive succession
      materials.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current audited revenue, revenue run-rate, customer count, workforce, locations, and committed-versus-available
      capital.
    whyItMatters: Historical staffing and named counterparties do not establish current scale, liquidity, or commercial conversion.
    diligencePath: >-
      Request monthly management accounts, payroll census, site list, contract schedule, and unrestricted cash
      reconciliation.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A Kairos-specific SAM/SOM bridge from capacity opportunity to contracted revenue, including reactor unit economics
      and target geography.
    whyItMatters: >-
      Capacity potential and local investment do not establish addressable revenue or Kairos share, which limits
      valuation and adoption forecasting.
    diligencePath: >-
      Request management's market model, qualified project pipeline, unit economics, site pipeline, and
      probability-weighted conversion assumptions.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Executed Google and other offtake terms covering price, duration, milestones, risk allocation, collateral, and
      termination.
    whyItMatters: >-
      A fleet target without binding economics cannot be translated into revenue visibility, project financeability, or
      downside protection.
    diligencePath: >-
      Obtain executed agreements, amendments, PPAs, development milestones, and counterparty credit and termination
      provisions under NDA.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: public-market-data
    missingEvidence: Auditable private valuation, funding-round terms, and investor ownership data.
    whyItMatters: >-
      Caplight exposes headings but not full filing records, while marketplace estimates may not reflect executable
      prices.
    diligencePath: >-
      Request the latest capitalization table, financing documents, 409A or board valuation, and any secondary
      transaction data.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Kairos-specific tariff, capex, levelized cost, contract duration, escalation, customer risk allocation, and
      cancellation terms for Hermes 2 and future commercial units.
    whyItMatters: >-
      Without comparable commercial terms, public technology and partnership evidence cannot establish whether Kairos
      can win against incumbent generation, competing SMRs, or substitute power.
    diligencePath: >-
      Obtain executed or redacted TVA/Google and other customer contracts, project budgets, financing assumptions, and
      independent cost-to-complete reviews.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Current competitor-by-competitor licensing milestones, customer commitments, manufacturing capacity, and operating
      or construction performance on a common basis.
    whyItMatters: >-
      The assigned pool establishes a crowded SMR landscape but does not support a current, like-for-like ranking of
      Kairos against every direct and adjacent developer.
    diligencePath: >-
      Collect current NRC and regulator records, customer procurement documents, project-finance disclosures, and
      independent technical or construction benchmarks for named peers.
    relatedQuestionRefs:
      - QP009
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current balance sheet, cash balance, restricted cash, monthly burn, committed matching funds, and runway.
    whyItMatters: >-
      DOE milestones and bond authorizations do not show whether Kairos can fund corporate overhead, cost overruns, or
      delayed milestones.
    diligencePath: >-
      Request the latest management accounts, 24-month cash forecast, capex commitments, and financing plan from
      management.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: offtake-terms
    missingEvidence: >-
      Executed Google/TVA/Kairos agreements, price, escalation, minimum purchase, credit support, schedule remedies, and
      termination rights.
    whyItMatters: >-
      Capacity announcements cannot be converted into project finance or revenue forecasts without contract economics
      and risk allocation.
    diligencePath: Obtain the signed commercial documents and build a base, downside, and delayed-delivery case.
    relatedQuestionRefs:
      - QI004
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: FOAK and NOAK capex, fuel, operating, maintenance, insurance, decommissioning, and financing assumptions.
    whyItMatters: Lazard's market benchmark is not a Kairos cost curve, and unproven SMR economics create valuation risk.
    diligencePath: >-
      Request the integrated project model with sensitivity cases for schedule, capacity factor, rates, fuel, and cost
      escalation.
    relatedQuestionRefs:
      - QI007
      - QI009
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-model
    missingEvidence: Revenue recognition policy and backlog conversion for DOE, construction, equipment, and electricity streams.
    whyItMatters: Government awards, financing authorizations, and planned capacity are not interchangeable with recognized revenue.
    diligencePath: >-
      Reconcile contracts to accounting schedules, remaining performance obligations, invoices, collections, and
      deferred revenue.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: blocking
    topic: commercial-maturity
    missingEvidence: Independent commissioning and sustained operating data for a Kairos reactor connected to the grid.
    whyItMatters: >-
      Without operating history, reliability, availability, safety performance, and realized output remain unvalidated
      for underwriting.
    diligencePath: >-
      Request commissioning records, operating logs, outage history, test results, and independent verification for
      Hermes and any successor unit.
    relatedQuestionRefs:
