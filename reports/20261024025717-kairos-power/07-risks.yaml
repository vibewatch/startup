company:
  name: Kairos Power
chapter:
  number: 7
  title: Risks
  summary: Kairos Power has meaningful regulatory progress, but its investment risk remains concentrated in first-of-a-kind construction, qualification, supply-chain scale-up, and opaque project economics. The most decision-relevant mitigations are observable milestones—licensed and completed Hermes facilities, repeatable salt and fuel production, resilient counterparties, and disclosed cost and schedule performance—not the existence of permits alone.
sections:
  - id: risk-ranking
    title: Ranked risk profile
    body: >-
      The highest-conviction risk is execution of a first-of-a-kind nuclear
      demonstration on a revised schedule. World Nuclear News reports that the
      NRC extended Hermes 1's construction-completion date from 31 December 2026
      to 30 April 2029 after Kairos attributed the request to development delays
      associated with the first-of-a-kind facility design and construction; the
      company also revised its expected completion to 2028. This is an observed
      schedule change, not proof that the reactor will fail, but it raises the
      probability of further cost, financing, and credibility pressure. A second
      risk is industrialization: Albuquerque documents describe a planned salt
      production facility and two fuel-development labs, while Generation Atomic
      notes that commercial-scale Flibe manufacturing had not previously been
      demonstrated. These mitigations are strategically sensible but remain
      execution work. The risk register therefore ranks observable delivery
      milestones above aspirational commercial deployment dates.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory, legal, and safety exposure
    body: >-
      Kairos has built a substantial regulatory record, but the record also
      shows an iterative process with multiple topical reports, audits,
      exemptions, and facility-specific reviews. The NRC lists pre-application
      activity beginning in November 2018 and identifies submissions that were
      still under review, including the Hermes 1 site-characteristics audit,
      operator training and testing, and a 10 CFR 55 exemption request. DOE
      reported initial acceptance of a source-term methodology in 2021, while
      the current NRC page records continuing technical engagement. These facts
      reduce uncertainty relative to an unlicensed design but do not eliminate
      licensing, construction-quality, fuel qualification, safeguards, or
      environmental compliance risk. Public evidence does not establish the
      full status of every permit condition, open audit item, or future
      commercial-plant license; those are explicit diligence gaps rather than
      assumptions of compliance.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-financial-model
    title: Operational dependencies and financial-model risk
    body: >-
      The deployment model depends on specialized inputs and external
      institutions: TRISO fuel qualification, fluoride-salt production,
      national-laboratory and DOE collaboration, NRC review, site construction,
      and committed offtake. Albuquerque's industrial-revenue-bond packet
      describes a $300 million company investment through the end of 2028 and
      a self-purchase bond structure, but it is not a consolidated project
      budget, cash-burn disclosure, or proof of available liquidity. The same
      packet says the city's analysis relied on information provided by the
      company. Similarly, the reported Google/TVA arrangement is an important
      demand signal, yet public extracts do not disclose complete economics,
      termination rights, or allocation of construction and performance risk.
      This combination creates financing and counterparty risk even where
      strategic partnerships are positive. Investors should require contract,
      liquidity, contingency, and supplier-concentration evidence before
      treating announced commitments as bankable cash flow.
    claimRefs: [CR009, CR010, CR011, CR012, CR016]
    tableRefs: [TR003]
  - id: diligence-and-thesis-breaks
    title: Monitoring indicators and thesis-break triggers
    body: >-
      The practical monitoring plan is milestone-based. Positive evidence would
      include Hermes 1 completion against the revised schedule, successful
      operation of the electricity-producing Hermes 2 architecture, repeatable
      salt and fuel production with independent quality records, closure of
      NRC audit and exemption items, and executed offtake terms with clear
      construction and performance allocation. Negative indicators include
      another material completion-date extension, unresolved safety or
      qualification findings, supplier or fuel delays, a reduction in committed
      offtake, or a financing structure that requires materially more capital
      than the disclosed project plan. The available record does not provide
      enough information to assign a precise probability to these outcomes, so
      the appropriate stance is to monitor measurable triggers and request
      primary documents rather than convert uncertainty into a numeric forecast.
    claimRefs: [CR013, CR014, CR015, CR016]
    tableRefs: []
