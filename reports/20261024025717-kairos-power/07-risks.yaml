callouts:
  - calloutType: risk
    title: The key risk is execution, not concept validation
    body: "Kairos has visible NRC engagement and a permitted demonstration path, but the Hermes 1 date extension explicitly attributes delay to first-of-a-kind design and construction. A permit is therefore a milestone, not evidence of commercial schedule certainty."
    claimRefs: [CR001, CR002, CR005]
  - calloutType: assumption
    title: Public demand is not yet public bankability
    body: "The Google/TVA arrangement is a meaningful demand signal, but the assigned public extracts do not disclose complete economics, termination rights, or construction-risk allocation. Treat it as strategic validation until the contract is reviewed."
    claimRefs: [CR016]
  - calloutType: recommendation
    title: Require milestone evidence before underwriting scale
    body: "The next diligence package should include the amended Hermes 1 schedule, current budget and contingency, open NRC items, fuel and salt qualification records, and complete offtake economics."
    claimRefs: [CR002, CR007, CR013, CR015]
