    title: Pricing and monetization evidence
    columns: [Metric, Value, Basis, Confidence, Why it matters, Diligence ask]
    rows:
      - [DOE milestone funding, "Up to $303 million", "Performance-based fixed-price agreement", "Medium", "Supports demonstration cash inflows but depends on delivery", "Reconcile award, amendments, paid-to-date, and milestone completion"]
      - [Albuquerque facility investment, "$300 million by end-2028", "Company representation in municipal bond record", "Medium", "Signals near-term capital intensity", "Reconcile budget to current forecast and funding sources"]
