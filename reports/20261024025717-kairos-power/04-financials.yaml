      - [Equipment/furniture/fixtures allocation, "$250 million", "Municipal project allocation", "Medium", "Largest disclosed facility cost bucket", "Obtain vendor commitments, contingencies, and depreciation policy"]
      - [Google program capacity, "Around 500 MW", "TechCrunch report of announced agreement", "Medium", "Indicates potential demand scale, not price", "Obtain binding capacity, delivery, pricing, and credit-support terms"]
    notes: "These are disclosed project or capacity figures, not realized prices, ARR, revenue, or margin. PPA pricing and realized electricity revenue remain unavailable."
    claimRefs: [CI001, CI004, CI006, CI007, CI013]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Current revenue, null, low, "No audited or management revenue figure was disclosed in the assigned evidence", "Provide monthly revenue by stream and recognition policy"]
      - [Cash on hand, null, low, "Bond authorization and DOE awards do not establish corporate liquidity", "Provide latest balance sheet, restricted cash, and liquidity runway"]
      - [Gross margin, null, low, "Demonstration and future PPA economics are not disclosed", "Provide project-level gross margin bridge and O&M assumptions"]
      - [Burn/runway, null, low, "Capital intensity and milestone funding create timing risk, but burn is not public", "Provide 24-month cash forecast, uses of funds, and next-round trigger"]
      - [Cost of energy, null, low, "Lazard gives a market benchmark framework, not a Kairos cost curve", "Provide FOAK/NOAK capex, financing, fuel, capacity-factor, and LCOE cases"]
      - [PPA realized price, null, low, "The 500 MW announcement does not disclose a $/MWh price", "Provide executed price, escalation, availability, curtailment, and termination terms"]
    notes: "Null means unavailable in the assigned public evidence, not zero. Each missing input is a specific underwriting request."
    claimRefs: [CI009, CI010, CI013, CI014, CI015, CI016]
