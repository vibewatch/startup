callouts:
  - calloutType: strength
    title: Milestone capital is aligned to technical delivery
    body: DOE's fixed-price milestone structure ties public funding to Hermes execution rather than treating an award headline as unrestricted cash.
    claimRefs: [CI001, CI012]
  - calloutType: risk
    title: Public offtake is not public unit economics
    body: The reported Google program establishes demand intent and capacity scale, but it does not disclose price, take-or-pay protection, schedule remedies, or Kairos' project return.
    claimRefs: [CI004, CI005, CI013]
  - calloutType: recommendation
    title: Underwrite liquidity and project finance before valuation
    body: Request the cash bridge, committed project budget, matching-fund obligations, PPA terms, debt or guarantees, and downside cases for delay and cost overrun.
    claimRefs: [CI008, CI010, CI015, CI016]
