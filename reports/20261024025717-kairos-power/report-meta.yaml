  topStrengths:
    - Founder-led technical depth with a credible reactor-development and licensing record.
    - DOE, Google, TVA, and Samsung C&T relationships provide meaningful commercialization and financing signals.
    - Hermes creates a concrete demonstration path toward repeatable commercial reactor deployment.
  topRisks:
    - First-of-a-kind construction, licensing, fuel, schedule, and cost-overrun risk remains high.
    - Current valuation, cap table, liquidity, revenue, margins, and contract economics are not publicly disclosed.
    - Commercial adoption remains planned capacity rather than demonstrated operating output or recurring revenue.
  unresolvedGaps:
    - Current common-equity valuation mark, preference stack, dilution terms, and any structured downside protections.
    - Full Google/TVA contract economics, duration, risk allocation, collateral, and termination rights.
    - Updated Hermes budget, contingency usage, and revised schedule after the disclosed project extension.
    - Bridge from DOE HALEU allocation to scalable commercial TRISO fuel supply for later units.
