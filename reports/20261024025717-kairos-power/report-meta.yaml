companyProfile:
  summary: >-
    Kairos Power is a private advanced-nuclear company developing fluoride-salt-cooled high-temperature reactors using
    TRISO fuel. Its public record shows progression from research and licensing into Hermes demonstration construction
    and commercial planning, supported by DOE funding and strategic relationships with Google, TVA, and Samsung C&T.
