figures:
  - id: FO001
    title: Kairos Power development and commercialization milestones
    type: timeline
    summary: >-
      A dated sequence from research origin through expected fleet delivery, separating completed events from forward targets.
    data:
      items:
        - date: "2011"
          label: DOE-sponsored university research begins
          details: MIT and partner universities began the integrated FHR research effort from which Kairos later emerged.
          tone: neutral
          claimRefs: [CO005]
        - date: "2016"
          label: Kairos Power incorporated
          details: The company formalized the research program into a commercial enterprise.
          tone: positive
          claimRefs: [CO001]
        - date: "2020-06"
          label: Source-term topical report submitted
          details: Kairos submitted its accident source-term calculation approach to the NRC.
          tone: neutral
          claimRefs: [CO016]
        - date: "2021-11"
          label: NRC draft safety evaluation reported
          details: DOE reported initial NRC acceptance of the methodology and five approved topical reports.
          tone: positive
          claimRefs: [CO016]
        - date: "2024-07"
          label: Hermes construction milestone
          details: Albuquerque public materials reported construction beginning on the Hermes low-power demonstration reactor.
          tone: positive
          claimRefs: [CO015]
        - date: "2024-08"
          label: Albuquerque expansion reviewed
          details: The city considered a $300 million self-purchased IRB request tied to facilities and at least 100 planned jobs.
          tone: neutral
          claimRefs: [CO008, CO009, CO012]
        - date: "2024-10"
          label: Google deployment agreement announced
          details: The commercial plan targets approximately 500 MW of reactor capacity by 2035.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-09"
          label: Samsung C&T package announced
          details: The reported package combines $70 million of equity with in-kind engineering services, worth up to $100 million.
          tone: positive
          claimRefs: [CO006]
        - date: "2030 target"
          label: Hermes 2 expected to operate
          details: This is a forward company schedule, not a completed operating milestone.
          tone: warning
          claimRefs: [CO015]
        - date: "2035 target"
          label: Google fleet target
          details: The agreement targets roughly 500 MW by 2035; delivery and economics remain to be verified.
          tone: warning
          claimRefs: [CO007]
    approximationNotes: >-
      Month precision is used only where the source supplies it; entries labeled
      target are forward expectations and are not treated as completed milestones.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO009, CO012, CO015, CO016]
callouts:
  - calloutType: risk
    title: Do not aggregate unlike capital instruments
    body: >-
      The $300 million Albuquerque IRB authority is self-purchased, the Samsung
      package includes in-kind services, and DOE support is milestone based; none is
      interchangeable with total equity raised or cash available.
    claimRefs: [CO006, CO008, CO009, CO010, CO014]
  - calloutType: insight
    title: Founder-market fit is also concentration risk
    body: >-
      The founding team spans the original research, licensing, testing, and nuclear
      design lineage, but public evidence does not show how that knowledge and
      authority are distributed beyond the founders.
    claimRefs: [CO004, CO005]
