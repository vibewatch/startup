company:
  name: Kairos Power
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kairos Power is a private, founder-led advanced-nuclear developer moving from
    research and licensing into first-of-a-kind construction. Its 2026 Samsung C&T
    package and Google deployment target strengthen the commercialization narrative,
    but current valuation, total equity raised, revenue, customer count, board
    composition, and a current audited workforce figure remain undisclosed.
sections:
  - id: identity-and-stage
    title: Identity, product, and current stage
    body: >-
      Kairos Power was incorporated in 2016 and is headquartered in Alameda,
      California. Its core product is the KP-FHR, a fluoride-salt-cooled
      high-temperature reactor that combines TRISO fuel pebbles with a low-pressure
      fluoride-salt coolant. The company is still in a demonstration and
      commercialization build-out rather than an evidenced operating-fleet stage:
      Hermes 1 is the low-power learning reactor, while Hermes 2 is described as the
      first commercial-scale unit and is expected to operate in 2030. Google provides
      a visible demand anchor through a roughly 500 MW target by 2035, but the retained
      evidence does not disclose present revenue, customer count, or operating output.
    claimRefs: [CO001, CO002, CO003, CO007, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder depth and governance visibility
    body: >-
      The founding officer group combines technical continuity with concentrated
      execution responsibility. Mike Laufer is identified as co-founder and CEO,
      Edward Blandford as co-founder and CTO, and Per Peterson as co-founder and chief
      nuclear officer. The company's origin in a 2011 DOE-sponsored university
      research program provides unusually direct founder-market fit: the team emerged
      from work spanning reactor design, thermal hydraulics, materials, safety,
      modeling, and licensing. That continuity is a strategic strength, but it also
      creates key-person dependence. The assigned public evidence does not establish
      the current board roster, independent-director coverage, succession planning, or
      decision rights beyond the founders' operating roles.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital structure signals and operating scale
    body: >-
      Public capital evidence must be separated by instrument. The September 2026
      Samsung C&T package was reported as up to $100 million, including $70 million of
      equity and the remainder in engineering services. Separately, the Albuquerque
      project sought $300 million of city-issued industrial revenue bonds, but the
      filing says those bonds are self-purchased and use no city funds; that amount is
      therefore not equivalent to outside financing raised or cash available. The same
      filing contemplated DOE award funding and existing private investors for the
      project. Its August 2024 workforce snapshot reported approximately 400 employees
      company-wide, including 113 in New Mexico, but it is not a current headcount.
    claimRefs: [CO006, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, evidence limits, and diligence priorities
    body: >-
      The milestone sequence shows a long technical de-risking path: university
      research began in 2011, the company incorporated in 2016, regulatory engagement
      produced a first-of-kind source-term review by 2021, and construction and
      municipal expansion activity became visible in 2024. Google and Samsung then
      added commercial and delivery counterparties. The sequence improves credibility
      but does not remove schedule, cost, or governance risk; expected dates are not
      completed milestones. Diligence should reconcile the current cap table and
      valuation, distinguish grants, self-purchased bonds, in-kind services, and equity,
      obtain current workforce and revenue evidence, and test whether founder-led
      controls are adequate for multi-site nuclear delivery.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO014, CO015, CO016]
    figureRefs: [FO001]
