schemaVersion: "report-v2"
artifact: competitors
slug: kairos-power
runDate: 2026-10-24
company:
  name: Kairos Power
chapter:
  number: 3
  title: Competitors
  summary: Kairos Power competes in an unusually broad advanced-nuclear field where reactor architecture, licensing progress, factory execution, fuel access, and customer bankability matter more than a simple feature checklist. Public evidence supports a differentiated molten-salt/TRISO and iterative-manufacturing position, but also shows that commercial economics and HALEU supply remain sector-wide gating risks.
sections:
  - id: landscape
    title: Landscape and strategic position
    body: >-
      The relevant competitive set is broader than other molten-salt developers. The World Nuclear
      Association describes more than 100 SMR designs at different development stages, spanning
      light-water, fast-neutron, high-temperature gas, and molten-salt technologies. That creates
      direct reactor-design competition, but also incumbent large reactors, customer-owned
      generation, utility portfolios of wind and solar, natural gas, and internal procurement as
      substitutes. Kairos is differentiated by combining fluoride-salt cooling, TRISO fuel,
      factory-oriented modular construction, and a test-and-learn sequence. Those attributes may
      improve deployment fit for data centers and constrained grids, yet they do not eliminate
      licensing, fuel, construction, or cost-of-power hurdles.
    claimRefs: [CP003, CP005, CP006, CP009, CP014, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capabilities
    title: Capability, licensing, and distribution comparison
    body: >-
      Buyer evaluation is likely to weight bankability and delivery evidence at least as heavily as
      reactor physics. Kairos has a meaningful public licensing and demonstration record: DOE said
      five of fourteen submitted technical or topical reports had been approved in 2021, while
      Hermes 1 and Hermes 2 provide staged hardware and construction learning. ORNL's 2026
      partnership adds independent laboratory capability around fuel, materials, spent-fuel
      handling, and remote maintenance. In contrast, the public pool provides no comparable
      customer pricing or realized operating-cost disclosure for Kairos, and competitor evidence
      shows that even an NRC-approved SMR project can be cancelled when economics deteriorate.
      Capability claims therefore remain stronger than commercial proof.
    claimRefs: [CP001, CP002, CP003, CP004, CP008, CP010, CP013, CP014]
    tableRefs: [TP002]
  - id: pricing
    title: Pricing, packaging, and buyer trade-offs
    body: >-
      No retained source provides a Kairos list price, contract tariff, realized revenue, or
      customer-level cost of electricity. The commercially relevant package is instead a staged
      demonstration and future fleet proposition: Hermes 1 is a 35 MWth non-power unit, while
      Hermes 2 is described as a 50-MWe site tied to a TVA/Google power-purchase arrangement.
      Factory fabrication, precast civil work, and repeatable modules are intended to reduce
      schedule and cost, but these are company-described mechanisms rather than verified unit
      economics. NuScale's cancelled project is a useful adverse sector benchmark, not a Kairos
      price proxy: its reported cost rose to $89/MWh and participating utilities lost interest.
      Diligence should obtain Kairos's tariff, capex, escalation, risk allocation, and cancellation
      terms before treating the package as competitive.
    claimRefs: [CP003, CP004, CP008, CP009, CP016]
    tableRefs: [TP003]
  - id: durability
    title: Switching costs, dependencies, and moat durability
    body: >-
      Kairos's potential moat is executional rather than merely intellectual property. Its
      Albuquerque and Oak Ridge activities, iterative demonstrations, fuel-development work, and
      ORNL relationships can build know-how, qualified suppliers, regulatory familiarity, and
      workforce density that are costly for a new entrant to reproduce. The same architecture
      creates dependencies: WNA reports that HALEU is not yet widely commercially available and
      that supply-chain buildout needs substantial capital and initial government support. Before
      delivery, buyers can still switch technologies: after the NuScale cancellation, UAMPS
      considered wind, solar, and natural-gas alternatives. Once bespoke licensing, site work, and
      fuel arrangements begin, switching likely becomes harder, but absent contract terms prevent
      a quantified lock-in assessment. Kairos's public distribution power rests on government,
      laboratory, workforce, and TVA/Google relationships rather than a proven standard product.
    claimRefs: [CP001, CP003, CP004, CP007, CP009, CP011, CP012, CP013, CP015, CP016]
    tableRefs: []
  - id: exhibits
    title: Evidence-backed exhibits
    body: >-
      The exhibits separate what is publicly demonstrated from what remains unknown. Landscape
      rows use source-backed categories and named projects rather than assuming that every advanced
      reactor developer is a direct peer. The capability matrix marks unavailable evidence as
      unknown instead of filling cells with inferred rankings. The pricing comparison preserves
      MWth versus MWe and reported dollars per megawatt-hour as different units and periods.
      A positioning map is intentionally ordinal: its axes summarize public evidence on
      commercialization readiness and deployment differentiation, not independently measured
      performance or valuation.
    claimRefs: [CP005, CP006, CP008, CP009, CP014, CP015, CP016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TP001
    title: Competitor and substitute landscape
    columns: [competitor_or_alternative, category, public_scale_or_stage, target_segment, differentiation, limitation]
    rows:
      - [Kairos Power, direct advanced-nuclear peer, "Hermes 1: 35 MWth; Hermes 2: 50 MWe site; DOE support up to $303 million is risk-reduction funding, not disclosed company cash", "Data centers, utilities, industrial and clean-firm-power buyers", "Fluoride salt coolant, TRISO fuel, iterative demonstrations, factory-oriented modules", "No public Kairos tariff, realized fleet economics, or commercial operating history"]
      - [NuScale Power, direct SMR peer, "Six-unit 462 MW CFPP was terminated; other projects were reported as still announced", "Utilities and municipal power systems", "NRC-approved SMR design and utility-scale project experience", "Data Center Frontier reported CFPP cost escalation to $89/MWh and utility withdrawal"]
      - [BWXT, adjacent advanced-reactor / microreactor peer, "Selected by DOD in 2022 to build Project Pele prototype; 2026 source reports TRISO core progress", "Defense installations and remote or resilient-power buyers", "HTR/TRISO and government-backed prototype route", "Public pool does not establish commercial utility pricing or fleet deployment"]
      - [X-energy, adjacent high-temperature peer, "Selected with BWXT for Project Pele final engineering design in 2021", "Defense and industrial clean-power buyers", "High-temperature reactor and TRISO-related positioning", "Public pool does not establish current customer contracts or operating economics"]
      - [Large light-water reactor, incumbent substitute, "Traditional units are around 1000 MWe or more", "Large grids and utility-scale generation", "Proven operating base and low cost per unit once built", "High upfront capital and less flexible deployment for small grids"]
      - [Wind and solar portfolio, status-quo substitute, "UAMPS considered wind expansion and utility-scale solar after CFPP cancellation", "Utilities and power buyers", "Alternative procurement path documented in the NuScale case", "Public pool does not provide a Kairos-specific cost or reliability comparison"]
      - [Natural gas generation, status-quo substitute, "UAMPS considered natural-gas technologies using hydrogen after CFPP cancellation", "Firm-power buyers and utilities", "Alternative energy source documented in the NuScale case", "No Kairos-specific bid, emissions, or fuel-cost comparison retained"]
    notes: "Sources include WNA's technology overview, ANS and Nucnet reporting on Kairos, and Data Center Frontier's adverse NuScale case; null means the assigned pool did not provide a comparable public metric."
    enumerationScope:
      coverage: partial
      basis: "Representative U.S. advanced-nuclear peers and status-quo alternatives documented in the assigned 2026 evidence pool; not a complete global developer census."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP008, CP009, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns: [buying_criterion, Kairos_Power, NuScale, BWXT_or_X_energy, incumbent_large_reactor, evidence_status]
    rows:
      - [Reactor architecture, "Fluoride salt-cooled high-temperature reactor with TRISO fuel", "SMR; detailed design not retained in pool", "High-temperature / TRISO-related Project Pele work", "Light-water reactor baseline", "Kairos and sector categories source-backed; competitor cells are bounded"]
      - [Licensing and demonstration, "Hermes 1 licensing and Hermes 2 construction described; five of fourteen DOE reports approved in 2021", "NRC approval and terminated CFPP reported", "DOD prototype route for BWXT; X-energy design selection reported", "Mature large-reactor supply base", "Public evidence is not a like-for-like licensing comparison"]
      - [Factory and modular delivery, "Factory-based modules, precast concrete, seismic isolation described for Hermes 2", "No comparable retained detail", "Mobile / modular prototype requirements described for Project Pele", "Modular construction is used, but large units remain the baseline", "Kairos statements are company-reported; unknowns remain"]
      - [Fuel and supply chain, "HALEU contract for Hermes 1; TRISO fuel development with LANL", "Fuel specifics not retained", "TRISO core and HALEU requirements described for Project Pele", "Conventional low-enriched uranium ecosystem", "WNA identifies HALEU availability as a sector constraint"]
      - [Customer and channel proof, "TVA/Google arrangement reported for Hermes 2; commercial terms unavailable", "UAMPS CFPP participation ended", "Defense channel via DOD prototype", "Utility procurement channel", "No retained source supports realized Kairos revenue or tariff"]
    notes: "This matrix preserves unknowns and distinguishes company-described capabilities from independent or government-reported evidence; cells are not a scored product ranking."
    claimRefs: [CP001, CP003, CP004, CP007, CP008, CP010, CP013, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [offer_or_project, price_or_scale, contract_or_packaging, included_capabilities, discount_or_unknowns, implication]
    rows:
      - [Kairos Hermes 1, "35 MWth; no electric capacity", "Low-power demonstration reactor and fuel-learning program", "KP-FHR demonstration, HALEU/TRISO fuel work, licensing and operations learning", "Tariff, capex, schedule contingency and customer economics unknown", "Evidence supports technology learning, not commercial price"]
      - [Kairos Hermes 2, "50 MWe site described in 2026 ANS reporting", "TVA/Google power-purchase-backed demonstration site", "Factory modules, precast civil structure and repeatable deployment model described", "PPA price, term, risk allocation, cancellation rights and realized cost unknown", "Potential anchor customer and delivery reference; underwriting remains open"]
      - [NuScale CFPP, "Six 77-MW units; 462 MW total", "UAMPS utility coalition purchase plan, later terminated", "Commercial SMR power project at INL site", "Reported project cost escalated to $89/MWh; final delivered economics unavailable", "Adverse sector benchmark for cost and demand risk, not Kairos pricing"]
      - [Large reactor baseline, "Around 1000 MWe or more per unit", "Utility-scale generation asset", "24/7 electricity and established operating model", "Project-specific capex and tariff not retained", "Scale advantage but less suitable for incremental or small-grid loads"]
    notes: "Values retain source units and periods. No row should be read as realized revenue, ARR, or a comparable levelized-cost estimate; nulls identify missing public commercial terms."
    claimRefs: [CP003, CP004, CP008, CP009, CP015, CP016]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Kairos sits in a differentiated but still mid-commercialization position: its technology and execution evidence are distinctive, while sector economics and competitor delivery remain unresolved."
    data:
      xAxis: "Public commercialization evidence (ordinal: 1 low, 5 high)"
      yAxis: "Deployment differentiation (ordinal: 1 low, 5 high)"
      points:
        - {label: "Kairos Power", x: 3, y: 5, note: "Hermes demonstrations, licensing work, factory-oriented delivery, and ORNL partnership; commercial economics undisclosed"}
        - {label: "NuScale", x: 3, y: 3, note: "NRC approval and commercial project history, offset by CFPP termination and reported $89/MWh cost"}
        - {label: "BWXT / X-energy", x: 2, y: 4, note: "Project Pele design/prototype route and high-temperature/TRISO positioning; commercial utility proof not retained"}
        - {label: "Large LWR baseline", x: 5, y: 2, note: "Established operating and supply base, but large-unit format is less deployment-flexible"}
        - {label: "Wind and solar portfolio", x: 4, y: 3, note: "Substitute pathway considered after CFPP cancellation; assigned pool lacks a Kairos-specific comparison"}
        - {label: "Natural gas generation", x: 4, y: 2, note: "Dispatchable substitute referenced in the NuScale case; emissions and fuel trade-offs remain"}
    approximationNotes: "Ordinal coordinates are analyst synthesis from the cited evidence, not measured market scores or a claim that unlike technologies share a common performance scale."
    claimRefs: [CP003, CP005, CP006, CP008, CP009, CP014, CP015, CP016]
callouts:
  - calloutType: insight
    title: Differentiation is real but not yet bankability
    body: "Kairos has a distinctive technology-and-execution bundle, but the retained evidence does not establish a public commercial tariff, realized fleet economics, or repeatable operating record."
    claimRefs: [CP003, CP004, CP008, CP010, CP016]
  - calloutType: risk
    title: HALEU and cost are shared bottlenecks
    body: "HALEU availability requires supply-chain investment and initial government support, while the NuScale cancellation shows that customer demand can weaken when projected power costs rise."
    claimRefs: [CP007, CP008, CP009]
