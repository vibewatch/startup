      - [Coolant, Fluoride salt / FLiBe heat-transfer fluid, Salt purification and production capability, "Chemistry, corrosion, and supply qualification"]
      - [Reactor and heat systems, KP-FHR and Hermes demonstration hardware, NRC licensing and construction execution, First-of-a-kind integration and schedule risk]
      - [Instrumentation and systems engineering, "Requirements, interfaces, verification, and change impact", Cross-functional engineering and regulated-industry practices, Evidence is primarily role-level rather than operating performance]
      - [Construction, Bioshield and cast-in-place structures, "ORNL, Barnard, and additive-manufacturing partners", Form qualification and scaling beyond demonstrations]
      - [Deployment and operations, Utility-supported demonstration and future grid connection, TVA / utility and regulator collaboration, No public sustained grid-operating record]
    notes: >-
      The architecture is a public-evidence synthesis of described components and dependencies; it is not a complete engineering design or safety case.
    claimRefs: [CE004, CE005, CE006, CE007, CE009, CE014]
