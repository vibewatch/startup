callouts:
  - calloutType: strength
    title: Staged de-risking is concrete
    body: ETU operation, licensing work, fuel and salt facilities, and construction-scale formwork provide observable intermediate milestones rather than a purely conceptual reactor narrative.
    claimRefs: [CE001, CE008, CE012]
  - calloutType: risk
    title: Commercial repeatability remains unproven
    body: Public sources document prototypes, permits, and construction demonstrations, but not sustained commercial generation, repeatable plant delivery, or independently verified cost and reliability outcomes.
    claimRefs: [CE010, CE011, CE015]
  - calloutType: recommendation
    title: Technical diligence stance
    body: The technology case merits continued tracking because intermediate hardware, licensing, and construction milestones are unusually concrete, but underwriting should remain conditional on commissioning evidence, qualified fuel and salt production, schedule performance, and independently verified plant economics.
    claimRefs: [CE008, CE010, CE015]
