company:
  name: Kairos Power
chapter:
  number: 5
  title: Product & Technology
  summary: Kairos Power is progressing a fluoride-salt-cooled, high-temperature reactor through non-nuclear test systems, fuel and salt process development, construction demonstrations, and staged licensing. Public evidence supports a technically specific iterative-development strategy, but commercial maturity, repeatability, and full-scale operating evidence remain unproven.
sections:
  - id: delivered-product
    title: Delivered product and customer workflow
    body: >-
      Kairos Power's delivered product is not yet a fleet of operating commercial plants; it is a staged development program for the KP-FHR, a fluoride-salt-cooled, high-temperature reactor intended to provide firm clean power. The near-term workflow is engineering-led: build and operate non-nuclear test systems, use the results to refine reactor and manufacturing designs, then license and construct demonstration hardware before commercial deployment. The Engineering Test Unit (ETU) is described as a non-nuclear prototype at the same scale as Hermes, while Hermes is a low-power demonstration reactor intended to advance the commercial design. The customer-facing value proposition is therefore future dependable electricity rather than an already deployed software or equipment SKU, and current public evidence does not establish commercial operating performance or realized customer economics.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: modules-and-architecture
    title: Modules, fuel, salt, and construction architecture
    body: >-
      The product architecture combines a reactor core using TRISO fuel, a fluoride-salt coolant loop, supporting fuel and salt production capabilities, and a construction method intended to make complex nuclear structures more repeatable. The Albuquerque development plan identifies a salt production facility for fluoride salt used as the primary heat-transfer fluid and separate pebble and TRISO development laboratories. DOE describes the ETU as a platform for demonstrating systems, structures, and components, testing supply-chain readiness, and gaining operating experience. ORNL evidence adds a construction layer: 3D-printed composite forms were validated for cast-in-place shielding structures at the Hermes campus. These are concrete technical building blocks, but public sources do not disclose a complete commercial bill of materials, validated lifecycle cost, or independently audited performance envelope.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment
    title: Maturity, deployment, integration, and roadmap
    body: >-
      Maturity is best understood as a sequence of demonstrations rather than a single readiness label. DOE reported 1,000 hours of pumped FLiBe operation in ETU-1 and said the unit would inform Hermes design, construction, and operation. The NRC-related DOE account reported initial acceptance of Kairos's source-term methodology and five approved topical reports as of November 2021, while TechCrunch later reported an NRC construction permit for two Hermes 2 test reactors. ORNL reported that Hermes was under construction and that its additive-manufacturing demonstration was intended to reduce construction risk before scale-up. TechCrunch also reported a 2030 target for the first Google-linked reactor and 2035 for the remainder; these are company targets, not demonstrated delivery dates. Integration support from utilities and national laboratories is visible, but public evidence does not establish grid operations, reliability, outage history, or production-scale support performance.
    claimRefs: [CE008, CE009, CE010, CE011]
  - id: differentiation-and-risk
    title: Differentiation, controls, and technical risk
    body: >-
      Kairos's differentiation rests on the combination of TRISO fuel, low-pressure molten-salt cooling, iterative hardware development, licensing engagement, and increasing control over salt, fuel, and construction processes. DOE characterizes the ETU program as a way to reduce technical, licensing, manufacturing, and construction risks; Kairos's own ANS description frames technology, construction, licensing, and supply-chain certainty as separate workstreams. The public record also shows important dependencies: national-laboratory and utility collaboration, specialized fuel and salt processes, NRC review, and a supply chain that is still being developed. Safety claims should remain bounded: the DOE source reports initial acceptance of a source-term methodology, not a completed commercial safety case, and TechCrunch notes that Generation IV classification is broad. Material diligence gaps are repeatability at commercial scale, qualification of fuel and materials, schedule performance after construction permitting, cybersecurity and operational controls, and independently verified economics.
    claimRefs: [CE012, CE013, CE014, CE015]
