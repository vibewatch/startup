  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: commercial-maturity
      missingEvidence: Independent commissioning and sustained operating data for a Kairos reactor connected to the grid.
      whyItMatters: Without operating history, reliability, availability, safety performance, and realized output remain unvalidated for underwriting.
      diligencePath: Request commissioning records, operating logs, outage history, test results, and independent verification for Hermes and any successor unit.
      relatedQuestionRefs: [QE003, QE007, QE008]
    - type: private-evidence-only
      severity: material
      topic: economics
      missingEvidence: Validated full-scale capital cost, operating cost, fuel cost, and schedule basis for commercial KP-FHR plants.
      whyItMatters: Technical milestones do not establish cost competitiveness or financing viability.
      diligencePath: Obtain the latest integrated cost model, vendor quotations, contingency, schedule risk register, and independent engineering review.
      relatedQuestionRefs: [QE005, QE006]
    - type: missing-source
      severity: material
      topic: quality-controls
      missingEvidence: Current qualification, cybersecurity, quality-assurance, and configuration-control evidence for production and operations.
      whyItMatters: A regulated nuclear product depends on auditable controls across fuel, salt chemistry, software, suppliers, and construction.
      diligencePath: Request current QA program records, fuel and material qualification matrices, cyber controls, supplier audits, and regulator correspondence.
      relatedQuestionRefs: [QE004, QE008]
