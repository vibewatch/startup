            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: Founder depth and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founding officer group combines technical continuity with concentrated execution responsibility. Mike
              Laufer is identified as co-founder and CEO, Edward Blandford as co-founder and CTO, and Per Peterson as
              co-founder and chief nuclear officer. The company's origin in a 2011 DOE-sponsored university research
              program provides unusually direct founder-market fit: the team emerged from work spanning reactor design,
              thermal hydraulics, materials, safety, modeling, and licensing. That continuity is a strategic strength,
              but it also creates key-person dependence. The assigned public evidence does not establish the current
              board roster, independent-director coverage, succession planning, or decision rights beyond the founders'
              operating roles.
            claimRefs:
              - CO004
              - CO005
