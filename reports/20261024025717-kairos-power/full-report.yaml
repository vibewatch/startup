  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risk and probability signal
    rows:
      - - Bull
        - Demonstrations meet schedule and budget; commercial contracts convert; plant economics become verifiable.
        - A premium could be supportable only after comparable cash-flow and dilution data exist.
        - No evidence-based probability is assigned; watch operating and construction proof.
      - - Base
        - Technical progress continues, but financing and economics remain only partly disclosed.
        - Maintain track status and defer a numeric range until transaction terms and unit economics are available.
        - Current public evidence best supports this cautious posture, not a probability estimate.
      - - Bear
        - Schedule or cost resets increase capital needs; commercial conversion or licensing slows.
        - Down-round, preference, dilution, and illiquidity risk can dominate strategic value.
        - Peer risk disclosures and Kairos share illiquidity are observable downside signals.
      - - Pricing rule
        - Any offer is reviewed on a fully diluted and preference-adjusted basis.
        - Require a target return model tied to verified cash needs, milestones, and exit assumptions.
        - Walk away if downside protections obscure common-equity economics or funding runway.
    notes: >-
      Scenario outputs are qualitative because public evidence does not support valuation ranges, return probabilities,
      or a target exit date.
    claimRefs:
      - CV002
      - CV008
