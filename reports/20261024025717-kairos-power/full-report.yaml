              - CE012
              - CE013
      - number: '5.2'
        title: Modules, fuel, salt, and construction architecture
        blocks:
          - type: paragraph
            body: >-
              The product architecture combines a reactor core using TRISO fuel, a fluoride-salt coolant loop,
              supporting fuel and salt production capabilities, and a construction method intended to make complex
              nuclear structures more repeatable. The Albuquerque development plan identifies a salt production facility
              for fluoride salt used as the primary heat-transfer fluid and separate pebble and TRISO development
              laboratories. DOE describes the ETU as a platform for demonstrating systems, structures, and components,
              testing supply-chain readiness, and gaining operating experience. ORNL evidence adds a construction layer:
              3D-printed composite forms were validated for cast-in-place shielding structures at the Hermes campus.
              These are concrete technical building blocks, but public sources do not disclose a complete commercial
              bill of materials, validated lifecycle cost, or independently audited performance envelope.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE008
              - CE010
              - CE012
      - number: '5.3'
        title: Maturity, deployment, integration, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Maturity is best understood as a sequence of demonstrations rather than a single readiness label. DOE
              reported 1,000 hours of pumped FLiBe operation in ETU-1 and said the unit would inform Hermes design,
              construction, and operation. The NRC-related DOE account reported initial acceptance of Kairos's
              source-term methodology and five approved topical reports as of November 2021, while TechCrunch later
              reported an NRC construction permit for two Hermes 2 test reactors. ORNL reported that Hermes was under
              construction and that its additive-manufacturing demonstration was intended to reduce construction risk
              before scale-up. TechCrunch also reported a 2030 target for the first Google-linked reactor and 2035 for
              the remainder; these are company targets, not demonstrated delivery dates. Integration support from
              utilities and national laboratories is visible, but public evidence does not establish grid operations,
              reliability, outage history, or production-scale support performance.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Kairos's differentiation rests on the combination of TRISO fuel, low-pressure molten-salt cooling,
              iterative hardware development, licensing engagement, and increasing control over salt, fuel, and
              construction processes. DOE characterizes the ETU program as a way to reduce technical, licensing,
              manufacturing, and construction risks; Kairos's own ANS description frames technology, construction,
              licensing, and supply-chain certainty as separate workstreams. The public record also shows important
              dependencies: national-laboratory and utility collaboration, specialized fuel and salt processes, NRC
              review, and a supply chain that is still being developed. Safety claims should remain bounded: the DOE
              source reports initial acceptance of a source-term methodology, not a completed commercial safety case,
              and TechCrunch notes that Generation IV classification is broad. Material diligence gaps are repeatability
              at commercial scale, qualification of fuel and materials, schedule performance after construction
              permitting, cybersecurity and operational controls, and independently verified economics.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Staged de-risking is concrete
            body: >-
              ETU operation, licensing work, fuel and salt facilities, and construction-scale formwork provide
              observable intermediate milestones rather than a purely conceptual reactor narrative.
            calloutType: strength
            claimRefs:
              - CE001
              - CE008
              - CE012
          - type: callout
            title: Commercial repeatability remains unproven
            body: >-
              Public sources document prototypes, permits, and construction demonstrations, but not sustained commercial
              generation, repeatable plant delivery, or independently verified cost and reliability outcomes.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE015
          - type: callout
            title: Technical diligence stance
            body: >-
              The technology case merits continued tracking because intermediate hardware, licensing, and construction
              milestones are unusually concrete, but underwriting should remain conditional on commissioning evidence,
              qualified fuel and salt production, schedule performance, and independently verified plant economics.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kairos Power's public customer surface is concentrated in infrastructure buyers that need firm,
              carbon-free electricity and in nuclear operators that can shape deployment requirements. The clearest
              end-user signal is Google's data-center energy organization, with TVA serving as the utility and
              transmission counterparty for the announced Hermes 2 arrangement. A second segment is utilities and
              generators that can advise on siting, licensing, operations, manufacturing, construction, and
              commercialization; Kairos described this role for Bruce Power, Constellation, Southern Company, and TVA in
              its OMADA consortium. The Albuquerque public record adds a manufacturing and fuel-development footprint,
              but it is evidence of capability-building rather than customer adoption. A commercial program-management
              posting confirms that Kairos is building CRM, proposal, customer-management, and partnership processes,
              which is a useful operating signal but not proof of contracted revenue. Public evidence does not disclose
              buyer-level pricing, contract duration for Kairos's agreements, realized utilization, or the allocation of
              economics between Kairos, TVA, and Google.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU009
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory has three distinct layers. First, Kairos has assembled an ecosystem of utilities
              and generators to advise on the technology and its commercialization, which is stronger than a logo-only
              relationship but remains a consortium and development signal. Second, the Hermes 2 PPA announcement
              identifies a concrete planned plant, a utility buyer, a hyperscaler beneficiary, and up to 50 MW of
              intended delivery, with operations targeted for 2030. Third, the broader Google arrangement is described
              as up to 500 MW across six to seven reactors by 2035. These figures are announced capacity and schedule
              targets; they do not establish commissioning, delivered megawatt-hours, payments, renewals, or customer
              concentration. A government project record also documents a planned $300 million Kairos investment and at
              least 100 jobs in Albuquerque by the end of 2028, which supports scaling intent but is not a customer
              metric. The evidence therefore supports progressing commercial validation, not claiming active fleet
              adoption.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Durability, expansion, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest expansion mechanism is a first-of-a-kind demonstration that can create operating evidence
              for later reactors. Google and TVA explicitly frame Hermes 2 lessons as a way to improve the economics of
              future units, while Kairos describes the demonstration as a pathway toward a commercial fleet. That is a
              plausible land-and-expand loop, but it remains conditional on licensing, construction, operation, and cost
              performance. The customer base is also economically concentrated in a small number of strategic
              counterparties in the disclosed record: Google and TVA anchor the current PPA, while the OMADA members are
              prospective advisors and collaborators rather than a disclosed recurring customer cohort. Independent
              reporting on large-load tariffs shows that data center procurement can involve long commitments,
              minimum-payment requirements, collateral, and early-exit penalties in comparable utility settings; those
              terms are not evidence of Kairos's contract, but they identify diligence items for its customer economics.
              No public source in this pool reports NRR, GRR, churn, renewal, customer satisfaction, or realized
              customer-level margins.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic customer validation
            body: >-
              The Google- TVA- Kairos structure links a hyperscaler energy need, a regulated utility, and a named
              advanced-reactor project; it is materially stronger than an unaffiliated customer logo, while remaining
              pre-operational until Hermes 2 is built and runs.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Adoption is not yet durable revenue
            body: >-
              Public disclosures establish announced capacity and counterparties, not delivered power, recurring
              revenue, renewal behavior, or contract profitability; the next diligence step is to obtain executed
              contract economics and operating milestones.
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest-conviction risk is execution of a first-of-a-kind nuclear demonstration on a revised schedule.
              World Nuclear News reports that the NRC extended Hermes 1's construction-completion date from 31 December
              2026 to 30 April 2029 after Kairos attributed the request to development delays associated with the
              first-of-a-kind facility design and construction; the company also revised its expected completion to
              2028. This is an observed schedule change, not proof that the reactor will fail, but it raises the
              probability of further cost, financing, and credibility pressure. A second risk is industrialization:
              Albuquerque documents describe a planned salt production facility and two fuel-development labs, while
              Generation Atomic notes that commercial-scale Flibe manufacturing had not previously been demonstrated.
              These mitigations are strategically sensible but remain execution work. The risk register therefore ranks
              observable delivery milestones above aspirational commercial deployment dates.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Kairos has built a substantial regulatory record, but the record also shows an iterative process with
              multiple topical reports, audits, exemptions, and facility-specific reviews. The NRC lists pre-application
              activity beginning in November 2018 and identifies submissions that were still under review, including the
              Hermes 1 site-characteristics audit, operator training and testing, and a 10 CFR 55 exemption request. DOE
              reported initial acceptance of a source-term methodology in 2021, while the current NRC page records
              continuing technical engagement. These facts reduce uncertainty relative to an unlicensed design but do
              not eliminate licensing, construction-quality, fuel qualification, safeguards, or environmental compliance
              risk. Public evidence does not establish the full status of every permit condition, open audit item, or
              future commercial-plant license; those are explicit diligence gaps rather than assumptions of compliance.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational dependencies and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The deployment model depends on specialized inputs and external institutions: TRISO fuel qualification,
              fluoride-salt production, national-laboratory and DOE collaboration, NRC review, site construction, and
              committed offtake. Albuquerque's industrial-revenue-bond packet describes a $300 million company
              investment through the end of 2028 and a self-purchase bond structure, but it is not a consolidated
              project budget, cash-burn disclosure, or proof of available liquidity. The same packet says the city's
              analysis relied on information provided by the company. Similarly, the reported Google/TVA arrangement is
              an important demand signal, yet public extracts do not disclose complete economics, termination rights, or
              allocation of construction and performance risk. This combination creates financing and counterparty risk
              even where strategic partnerships are positive. Investors should require contract, liquidity, contingency,
              and supplier-concentration evidence before treating announced commitments as bankable cash flow.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical monitoring plan is milestone-based. Positive evidence would include Hermes 1 completion
              against the revised schedule, successful operation of the electricity-producing Hermes 2 architecture,
              repeatable salt and fuel production with independent quality records, closure of NRC audit and exemption
              items, and executed offtake terms with clear construction and performance allocation. Negative indicators
              include another material completion-date extension, unresolved safety or qualification findings, supplier
              or fuel delays, a reduction in committed offtake, or a financing structure that requires materially more
              capital than the disclosed project plan. The available record does not provide enough information to
              assign a precise probability to these outcomes, so the appropriate stance is to monitor measurable
              triggers and request primary documents rather than convert uncertainty into a numeric forecast.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The key risk is execution, not concept validation
            body: >-
              Kairos has visible NRC engagement and a permitted demonstration path, but the Hermes 1 date extension
              explicitly attributes delay to first-of-a-kind design and construction. A permit is therefore a milestone,
              not evidence of commercial schedule certainty.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: callout
            title: Public demand is not yet public bankability
            body: >-
              The Google/TVA arrangement is a meaningful demand signal, but the assigned public extracts do not disclose
              complete economics, termination rights, or construction-risk allocation. Treat it as strategic validation
              until the contract is reviewed.
            calloutType: assumption
            claimRefs:
              - CR016
          - type: callout
            title: Require milestone evidence before underwriting scale
            body: >-
              The next diligence package should include the amended Hermes 1 schedule, current budget and contingency,
              open NRC items, fuel and salt qualification records, and complete offtake economics.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR007
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Kairos merits continued diligence, but the public record does not support a defensible entry valuation or
              a buy recommendation. The company remains private, and the available secondary-market page says there is
              no public stock price and warns that transaction prices can diverge from the last funding round. That
              uncertainty matters because the strongest evidence concerns technical and financing milestones rather than
              distributable economics: Kairos describes a 150 MWe dual-unit commercial configuration and targets costs
              competitive with natural gas, but it does not publish realized plant cost, margin, cash burn, or project
              return data on the reviewed technology page. The appropriate stance is therefore unknown valuation with
              strict price and term discipline, paired with a high risk rating and medium confidence in the directional
              conclusion.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.2'
        title: Financing and dilution context
        blocks:
          - type: paragraph
            body: >-
              Public disclosures demonstrate access to substantial support but do not reveal cash available to common
              shareholders. Albuquerque's 2024 packet described a requested $300 million self-purchased industrial
              revenue bond for facilities and equipment, explicitly stating that no City funds would purchase or repay
              the bonds; the project financing was expected to come from the DOE award and existing private investors. A
              secondary review records a separate $630 million, seven-year DOE technology agreement from 2020, while
              American Nuclear Society reports that Samsung C&T may provide up to $100 million through a mixture of
              direct investment and in-kind engineering services. These amounts are not interchangeable with equity
              raised or unrestricted liquidity. Without the cap table, liquidation preferences, debt, milestone
              conditions, and pro forma dilution, the financing headline cannot establish common-equity value.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be milestone-conditioned rather than built from unsupported revenue
              multiples. X-energy's own first-quarter 2026 disclosure reported $944 million of liquidity at March 31, no
              debt, and approximately $1.1 billion of net IPO proceeds after quarter-end; it also reported $43.4 million
              of quarterly revenue and grant income against $109.5 million of operating expenses. Those figures show the
              scale of capital available to a public advanced nuclear peer, but X-energy is a competitor and its
              self-reported economics are not an independent benchmark for Kairos. Oklo's syndicated company release
              likewise warns that an emerging advanced-nuclear market with no commercial project operating, regulatory
              uncertainty, and continuing plant-financing needs can impair outcomes. The bull case requires demonstrated
              schedule, cost, and commercial conversion; the bear case is delay, dilution, or failed economics.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not publicly established. UpMarket describes Kairos shares as illiquid, speculative, and
              subject to an unpredictable exit timeline, while the X-energy IPO shows only that public markets can fund
              a more disclosed peer; it does not establish Kairos's timing or valuation. Before pricing an investment,
              diligence should reconcile the fully diluted cap table and preference waterfall, cash and committed
              funding, monthly burn, project-level obligations, Google and TVA contract economics, construction budgets,
              and the path from demonstration milestones to repeatable 150 MWe plants. Thesis-break triggers are a
              material schedule or budget reset without matched funding, terms that subordinate new common capital,
              failure to demonstrate cost and operating performance, or loss of credible customer and regulatory
              conversion. Until those items are resolved, track rather than transact.
            claimRefs:
              - CV002
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline is the gating issue
            body: >-
              Kairos can be strategically attractive while still being unpriceable from public evidence. Require a
              current fully diluted capitalization, preference waterfall, verified liquidity and burn, project
              obligations, and milestone-linked economics before converting the track stance into an investment
              recommendation.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV011
              - CV016
