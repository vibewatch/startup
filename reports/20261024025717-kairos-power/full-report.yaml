  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the development and eventual sale of clean, firm electricity and advanced-reactor
              systems for utilities, large power buyers, and public-sector or industrial sites. It includes reactor
              design and licensing, demonstration and engineering infrastructure, fuel and coolant production,
              construction, long-term operation, and power purchase arrangements. It excludes the entire global
              electricity market, unrelated renewable generation, and secondary-market financial products. The status
              quo alternatives are existing light-water nuclear, gas generation, renewables paired with storage or
              demand response, and delaying load growth. A government siting analysis makes the deployment envelope
              concrete: it examined 54 operating and 11 recently retired nuclear sites across 31 states, while Kairos's
              Albuquerque filing defines a narrower enabling-market wedge around salt production, fuel-development
              laboratories, and design-build-test capability.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source isolates Kairos Power's SAM or SOM, and the company is private, so a single headline
              TAM would overstate precision. Three lenses are more decision-useful. First, DOE's preliminary siting work
              estimates 60 to 95 GW of potential new capacity at existing or recently retired nuclear sites, with the
              upper case including smaller advanced reactors of 600 MW; this is a deployment opportunity, not Kairos
              revenue. Second, DOE says about 200 GW of additional nuclear capacity may be needed by 2050 to support
              projected demand, a policy-scale demand signal rather than a booked market. Third, Kairos's Albuquerque
              project documents $300 million of additional company investment through 2028 and at least 100 jobs, a
              local infrastructure and supply-chain wedge rather than reactor sales. These lenses bound opportunity
              while preserving geography, methodology, and denominator differences.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
