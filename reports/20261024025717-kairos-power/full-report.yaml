        title: Evidence-backed exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate what is publicly demonstrated from what remains unknown. Landscape rows use
              source-backed categories and named projects rather than assuming that every advanced reactor developer is
              a direct peer. The capability matrix marks unavailable evidence as unknown instead of filling cells with
