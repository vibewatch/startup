              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is a utility or large electricity consumer that can sign a long-duration power
              contract and tolerate a first-of-a-kind construction program. The user is the grid, plant operator, or
              industrial load; the payer is the utility, corporate offtaker, public sponsor, or project-finance
              structure. Google is described by UpMarket as targeting a 500 MW fleet by 2035, but the retained page does
              not disclose contract price, duration, risk allocation, or termination rights. Public-sector and
              institutional counterparties also matter: DOE's ARDP is described as a cost-shared partnership, while the
              Albuquerque packet says the company funds its requested bonds and ties the project to out-of-state
              customers and investors. The adoption sequence is therefore demonstration, regulatory acceptance, fuel and
              manufacturing qualification, site and financing commitment, then repeat deployment.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by electrification and data-center growth: the IEA's 2026 electricity outlook
              describes rapidly rising power demand and a need for flexibility as systems integrate diverse generation.
              Kairos's technology proposition is a lower-pressure fluoride-salt coolant and TRISO fuel design, while its
              iterative testing strategy is intended to reduce technical, licensing, manufacturing, and construction
              risk. The constraint set is equally material. GAO reports that NRC modified its advanced-reactor licensing
              process but still faces staffing and retention challenges and has not measured whether incentives close
              those gaps. The Breakthrough account also identifies the absence of domestic HALEU capability as a
              deployment issue. Consequently, valuation depends on evidence of schedule, cost, licensing, fuel
              availability, and binding offtake economics, none of which is fully public in the assigned pool.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than other molten-salt developers. The World Nuclear Association
              describes more than 100 SMR designs at different development stages, spanning light-water, fast-neutron,
              high-temperature gas, and molten-salt technologies. That creates direct reactor-design competition, but
              also incumbent large reactors, customer-owned generation, utility portfolios of wind and solar, natural
              gas, and internal procurement as substitutes. Kairos is differentiated by combining fluoride-salt cooling,
              TRISO fuel, factory-oriented modular construction, and a test-and-learn sequence. Those attributes may
              improve deployment fit for data centers and constrained grids, yet they do not eliminate licensing, fuel,
              construction, or cost-of-power hurdles.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP009
              - CP014
              - CP015
