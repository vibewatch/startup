chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current stage
        blocks:
          - type: paragraph
            body: >-
              Kairos Power was incorporated in 2016 and is headquartered in Alameda, California. Its core product is the
              KP-FHR, a fluoride-salt-cooled high-temperature reactor that combines TRISO fuel pebbles with a
              low-pressure fluoride-salt coolant. The company is still in a demonstration and commercialization
              build-out rather than an evidenced operating-fleet stage: Hermes 1 is the low-power learning reactor,
              while Hermes 2 is described as the first commercial-scale unit and is expected to operate in 2030. Google
              provides a visible demand anchor through a roughly 500 MW target by 2035, but the retained evidence does
              not disclose present revenue, customer count, or operating output.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO015
