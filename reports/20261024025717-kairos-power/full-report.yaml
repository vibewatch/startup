  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kairos Power's delivered product is not yet a fleet of operating commercial plants; it is a staged
              development program for the KP-FHR, a fluoride-salt-cooled, high-temperature reactor intended to provide
              firm clean power. The near-term workflow is engineering-led: build and operate non-nuclear test systems,
              use the results to refine reactor and manufacturing designs, then license and construct demonstration
              hardware before commercial deployment. The Engineering Test Unit (ETU) is described as a non-nuclear
              prototype at the same scale as Hermes, while Hermes is a low-power demonstration reactor intended to
              advance the commercial design. The customer-facing value proposition is therefore future dependable
              electricity rather than an already deployed software or equipment SKU, and current public evidence does
              not establish commercial operating performance or realized customer economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
