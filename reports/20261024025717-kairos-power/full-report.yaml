        title: Capital structure signals and operating scale
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence must be separated by instrument. The September 2026 Samsung C&T package was
              reported as up to $100 million, including $70 million of equity and the remainder in engineering services.
              Separately, the Albuquerque project sought $300 million of city-issued industrial revenue bonds, but the
              filing says those bonds are self-purchased and use no city funds; that amount is therefore not equivalent
              to outside financing raised or cash available. The same filing contemplated DOE award funding and existing
              private investors for the project. Its August 2024 workforce snapshot reported approximately 400 employees
              company-wide, including 113 in New Mexico, but it is not a current headcount.
