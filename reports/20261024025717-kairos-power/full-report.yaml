      - number: '3.2'
        title: Capability, licensing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Buyer evaluation is likely to weight bankability and delivery evidence at least as heavily as reactor
              physics. Kairos has a meaningful public licensing and demonstration record: DOE said five of fourteen
              submitted technical or topical reports had been approved in 2021, while Hermes 1 and Hermes 2 provide
              staged hardware and construction learning. ORNL's 2026 partnership adds independent laboratory capability
              around fuel, materials, spent-fuel handling, and remote maintenance. In contrast, the public pool provides
              no comparable customer pricing or realized operating-cost disclosure for Kairos, and competitor evidence
              shows that even an NRC-approved SMR project can be cancelled when economics deteriorate. Capability claims
              therefore remain stronger than commercial proof.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
