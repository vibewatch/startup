  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence places Kairos before commercial revenue scale. The most concrete current funding mechanism
              is the DOE Advanced Reactor Demonstration Program agreement: DOE can provide up to $303 million through
              performance-based, fixed-price milestones for Hermes design, construction, and commissioning, so this is
              program funding rather than recurring customer revenue (C I001). The Albuquerque development record
              separately describes revenue sources as coming from out-of-state entities and investors and says the
              company expects construction and equipment contracts (C I002, C I003). These records support a
              project-and-contract model, but they do not disclose recognized revenue, backlog conversion, gross profit,
              or collections.

              The intended commercial monetization is electricity sold through utility and corporate offtake
              arrangements. A contemporaneous report describes Google’s agreement as adding around 500 MW of carbon-free
              electricity, with plants scheduled to come online by the end of the decade, while noting that the precise
              behind-the-meter versus grid structure was not clear (C I004). The resulting financial model is closer to
              capital-intensive project development than SaaS: milestone funding supports de-risking, then long-lived
              power contracts must support construction finance and operating cash generation. No public source in this
              pool establishes the PPA strike price, escalation, minimum purchase, termination rights, or accounting
              treatment.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI006
              - CI012
              - CI013
              - CI014
      - number: '4.2'
        title: Capital needs, cost drivers, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Kairos’ capital requirements are visible even without a private cash statement. The Albuquerque record
              approves a requested $300 million industrial revenue bond project, describes an additional $300 million
              company investment by the end of 2028, and allocates roughly $50 million to buildings and real-property
              improvements and $250 million to equipment, furniture, and fixtures (C I006, C I007). The same record says
              the bonds are self-purchased and no city funds or city credit enhance them, so the authorization should
              not be treated as cash already available to Kairos (C I008).

              Cost risk is also structural. Lazard’s June 2024 LCOE analysis says persistent high interest rates
              increased low-end LCOE values and emphasizes the advantage of sizable, well-capitalized companies with
              scale and balance-sheet support (C I009). TechCrunch reports that no commercial SMR has yet been
              commissioned and that the economics remain largely unproven, while citing Vogtle’s seven-year delay and
              $17 billion over-budget outcome as a conventional nuclear warning (C I010). Kairos’ performance-based DOE
              arrangement reduces some public-funding execution risk, but it does not establish sufficient liquidity for
              cost overruns, schedule slippage, debt service, or fleet construction.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI007
              - CI013
      - number: '4.3'
        title: Unit economics and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest public economics are directional rather than realized. The DOE/NEI description says Hermes
              is a 35 MWt non-power demonstration and that Hermes 2 is intended to produce electricity and demonstrate
              the architecture of future commercial plants; it explicitly frames the demonstrations as a way to mitigate
              technology, licensing, supply-chain, and construction risk to achieve cost certainty (C I012). That makes
              Hermes a validation asset, not evidence of current plant-level margin.

              Public sources provide no audited revenue, cash balance, operating burn, gross margin, utilization,
              customer concentration, debt schedule, or realized $/MWh. Even the stronger commercial signal—Google’s
              planned 500 MW program—does not disclose price or delivery economics (C I005, C I013). Accordingly, a
              financial underwriting model should use explicit scenario inputs for construction cost, schedule, capacity
              factor, fuel and maintenance expense, financing rate, and PPA terms rather than infer them from list
              descriptions or total capital raised. The current verdict is strategically promising but financially
              under-documented: capital adequacy and project returns remain material diligence blockers.
            claimRefs:
              - CI005
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Kairos has assembled a plausible bridge from public milestone capital to contracted electricity demand,
              and the regulatory and manufacturing milestones improve the credibility of that bridge. The financial risk
              is not a lack of an addressable revenue mechanism; it is the unobserved conversion from demonstrations
              into financeable, cost-competitive and on-time commercial units. Public evidence cannot establish whether
              the company can fund its matching obligations and corporate overhead through Hermes 2, whether the
              Google/TVA arrangements transfer construction and performance risk, or whether future plants can earn an
              adequate return after fuel, labor, insurance, decommissioning, and financing costs. Investors should
              request the latest management accounts, cash and burn bridge, project budgets, PPA economics, debt and
              guarantee terms, and a sensitivity case for delay and cost overrun before assigning a valuation.
            claimRefs:
              - CI001
              - CI008
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Milestone capital is aligned to technical delivery
            body: >-
              DOE's fixed-price milestone structure ties public funding to Hermes execution rather than treating an
              award headline as unrestricted cash.
            calloutType: strength
            claimRefs:
              - CI001
              - CI012
          - type: callout
            title: Public offtake is not public unit economics
            body: >-
              The reported Google program establishes demand intent and capacity scale, but it does not disclose price,
              take-or-pay protection, schedule remedies, or Kairos' project return.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI013
          - type: callout
            title: Underwrite liquidity and project finance before valuation
            body: >-
              Request the cash bridge, committed project budget, matching-fund obligations, PPA terms, debt or
              guarantees, and downside cases for delay and cost overrun.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI010
              - CI015
