              - CP007
              - CP008
              - CP010
              - CP013
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a Kairos list price, contract tariff, realized revenue, or customer-level cost
              of electricity. The commercially relevant package is instead a staged demonstration and future fleet
              proposition: Hermes 1 is a 35 MWth non-power unit, while Hermes 2 is described as a 50-MWe site tied to a
              TVA/Google power-purchase arrangement. Factory fabrication, precast civil work, and repeatable modules are
              intended to reduce schedule and cost, but these are company-described mechanisms rather than verified unit
              economics. NuScale's cancelled project is a useful adverse sector benchmark, not a Kairos price proxy: its
              reported cost rose to $89/MWh and participating utilities lost interest. Diligence should obtain Kairos's
              tariff, capex, escalation, risk allocation, and cancellation terms before treating the package as
              competitive.
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP009
              - CP015
              - CP016
      - number: '3.4'
        title: Switching costs, dependencies, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Kairos's potential moat is executional rather than merely intellectual property. Its Albuquerque and Oak
              Ridge activities, iterative demonstrations, fuel-development work, and ORNL relationships can build
              know-how, qualified suppliers, regulatory familiarity, and workforce density that are costly for a new
              entrant to reproduce. The same architecture creates dependencies: WNA reports that HALEU is not yet widely
              commercially available and that supply-chain buildout needs substantial capital and initial government
              support. Before delivery, buyers can still switch technologies: after the NuScale cancellation, UAMPS
              considered wind, solar, and natural-gas alternatives. Once bespoke licensing, site work, and fuel
              arrangements begin, switching likely becomes harder, but absent contract terms prevent a quantified
              lock-in assessment. Kairos's public distribution power rests on government, laboratory, workforce, and
              TVA/Google relationships rather than a proven standard product.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP009
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
