    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Regulatory review and approved construction activity reduce part of the technology-to-license risk.
        - Operating evidence that validates schedule, safety, and cost assumptions would strengthen the thesis.
      - - Thesis
        - DOE, City-facilitated, private-investor, and Samsung support indicate multiple financing channels.
        - Verified unrestricted liquidity and fully committed project funding would reduce financing risk.
      - - Anti-thesis
