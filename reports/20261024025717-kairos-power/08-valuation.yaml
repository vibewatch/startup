    title: Recommendation logic
    type: flow
    summary: "A staged evidence chain shows why meaningful technical progress still resolves to track rather than buy."
    data:
      nodes:
        - id: regulatory-proof
          label: Regulatory proof
          detail: "Historical NRC methodology review and construction-permit progress reduce, but do not remove, licensing risk."
        - id: demonstration-execution
          label: Demonstration execution
          detail: "Construction milestones must prove schedule, safety, and budget performance."
        - id: commercial-conversion
          label: Commercial conversion
          detail: "Customer commitments must become financeable, enforceable project economics."
        - id: unit-economics
          label: Unit economics
          detail: "Realized plant cost, operating cost, margin, and repeatability are not public."
        - id: financing-structure
          label: Financing structure
          detail: "Awards, bonds, direct investment, and in-kind support require separate treatment."
        - id: entry-price
          label: Entry price and terms
          detail: "The current common-equity mark, preferences, and dilution remain undisclosed."
        - id: recommendation
          label: Track / research more
          detail: "Advance only after price, terms, runway, and milestone evidence are verified."
    approximationNotes: "The sequence is analytical, not a probability-weighted model; it contains no inferred conversion rates."
    claimRefs: [CV002, CV003, CV005, CV008, CV009, CV010, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline is the gating issue
    body: >-
      Kairos can be strategically attractive while still being unpriceable from public
      evidence. Require a current fully diluted capitalization, preference waterfall,
      verified liquidity and burn, project obligations, and milestone-linked economics
      before converting the track stance into an investment recommendation.
    claimRefs: [CV002, CV003, CV009, CV011, CV016]
