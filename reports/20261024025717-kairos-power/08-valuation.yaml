company:
  name: Kairos Power
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a track-and-diligence stance, not a priced investment
    recommendation. Kairos has meaningful regulatory, project-financing, and partner
    signals, but its current common-equity valuation, preference stack, cash position,
    commercial unit economics, and exit timing remain undisclosed.
sections:
  - id: decision-and-valuation-stance
    title: Decision and valuation stance
    body: >-
      Kairos merits continued diligence, but the public record does not support a
      defensible entry valuation or a buy recommendation. The company remains private,
      and the available secondary-market page says there is no public stock price and
      warns that transaction prices can diverge from the last funding round. That
      uncertainty matters because the strongest evidence concerns technical and
      financing milestones rather than distributable economics: Kairos describes a
      150 MWe dual-unit commercial configuration and targets costs competitive with
      natural gas, but it does not publish realized plant cost, margin, cash burn, or
      project return data on the reviewed technology page. The appropriate stance is
      therefore unknown valuation with strict price and term discipline, paired with a
      high risk rating and medium confidence in the directional conclusion.
    claimRefs: [CV001, CV002, CV008, CV009, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-dilution-context
    title: Financing and dilution context
    body: >-
      Public disclosures demonstrate access to substantial support but do not reveal
      cash available to common shareholders. Albuquerque's 2024 packet described a
      requested $300 million self-purchased industrial revenue bond for facilities and
      equipment, explicitly stating that no City funds would purchase or repay the
      bonds; the project financing was expected to come from the DOE award and existing
      private investors. A secondary review records a separate $630 million,
      seven-year DOE technology agreement from 2020, while American Nuclear Society
      reports that Samsung C&T may provide up to $100 million through a mixture of
      direct investment and in-kind engineering services. These amounts are not
      interchangeable with equity raised or unrestricted liquidity. Without the cap
      table, liquidation preferences, debt, milestone conditions, and pro forma
      dilution, the financing headline cannot establish common-equity value.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-context
    title: Scenarios and comparable context
    body: >-
      The scenario framework should be milestone-conditioned rather than built from
      unsupported revenue multiples. X-energy's own first-quarter 2026 disclosure
      reported $944 million of liquidity at March 31, no debt, and approximately
      $1.1 billion of net IPO proceeds after quarter-end; it also reported $43.4 million
      of quarterly revenue and grant income against $109.5 million of operating
      expenses. Those figures show the scale of capital available to a public advanced
      nuclear peer, but X-energy is a competitor and its self-reported economics are
      not an independent benchmark for Kairos. Oklo's syndicated company release
      likewise warns that an emerging advanced-nuclear market with no commercial
      project operating, regulatory uncertainty, and continuing plant-financing needs
      can impair outcomes. The bull case requires demonstrated schedule, cost, and
      commercial conversion; the bear case is delay, dilution, or failed economics.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness is not publicly established. UpMarket describes Kairos shares as
      illiquid, speculative, and subject to an unpredictable exit timeline, while the
      X-energy IPO shows only that public markets can fund a more disclosed peer; it
      does not establish Kairos's timing or valuation. Before pricing an investment,
      diligence should reconcile the fully diluted cap table and preference waterfall,
      cash and committed funding, monthly burn, project-level obligations, Google and
      TVA contract economics, construction budgets, and the path from demonstration
      milestones to repeatable 150 MWe plants. Thesis-break triggers are a material
      schedule or budget reset without matched funding, terms that subordinate new
      common capital, failure to demonstrate cost and operating performance, or loss
      of credible customer and regulatory conversion. Until those items are resolved,
      track rather than transact.
    claimRefs: [CV002, CV008, CV011, CV012, CV013, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Track / research more", "Technical and financing milestones exist, but price support is incomplete.", "Do not issue a buy recommendation from public evidence."]
      - [Confidence, Medium, "Evidence strongly establishes the disclosure gaps; economics remain private.", "Use diligence milestones rather than a point estimate."]
      - [Risk rating, High, "Pre-commercial execution, financing, liquidity, and regulatory risks remain material.", "Require downside protection and staged capital."]
      - [Valuation stance, Unknown, "No verified current common-equity mark or fully diluted capitalization is public.", "Price only after cap-table and unit-economics review."]
    notes: "Qualitative investment judgment based only on the cited public evidence; no numeric valuation or probability is estimated."
    claimRefs: [CV001, CV002, CV009, CV011, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Regulatory review and approved construction activity reduce part of the technology-to-license risk.", "Operating evidence that validates schedule, safety, and cost assumptions would strengthen the thesis."]
      - [Thesis, "DOE, City-facilitated, private-investor, and Samsung support indicate multiple financing channels.", "Verified unrestricted liquidity and fully committed project funding would reduce financing risk."]
      - [Anti-thesis, "Public sources do not disclose current common-equity value, preferences, dilution, or realized commercial economics.", "A current financing package and audited operating model could make entry pricing assessable."]
      - [Anti-thesis, "Public peers disclose substantial capital needs and pre-commercial operating expense.", "Repeatable plant delivery with contracted margins would weaken this concern."]
    notes: "Financing figures use their original forms: an IRB is not City cash, in-kind support is not all cash, and government awards are not unrestricted equity."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009, CV010, CV012, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Key risk and probability signal]
    rows:
      - [Bull, "Demonstrations meet schedule and budget; commercial contracts convert; plant economics become verifiable.", "A premium could be supportable only after comparable cash-flow and dilution data exist.", "No evidence-based probability is assigned; watch operating and construction proof."]
      - [Base, "Technical progress continues, but financing and economics remain only partly disclosed.", "Maintain track status and defer a numeric range until transaction terms and unit economics are available.", "Current public evidence best supports this cautious posture, not a probability estimate."]
      - [Bear, "Schedule or cost resets increase capital needs; commercial conversion or licensing slows.", "Down-round, preference, dilution, and illiquidity risk can dominate strategic value.", "Peer risk disclosures and Kairos share illiquidity are observable downside signals."]
      - [Pricing rule, "Any offer is reviewed on a fully diluted and preference-adjusted basis.", "Require a target return model tied to verified cash needs, milestones, and exit assumptions.", "Walk away if downside protections obscure common-equity economics or funding runway."]
    notes: "Scenario outputs are qualitative because public evidence does not support valuation ranges, return probabilities, or a target exit date."
    claimRefs: [CV002, CV008, CV009, CV011, CV012, CV013, CV014, CV015, CV016]
figures:
