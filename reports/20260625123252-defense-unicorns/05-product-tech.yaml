- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Defense Unicorns solution
  - Measurable benefit
  - Limitation
  rows:
  - - Platform engineer shipping to air-gapped cluster
    - Manually stage images, repos, and manifests across disconnected boundaries
    - Use Zarf-backed UDS bundle to package dependencies once and deploy through a local registry/Git path
    - Lower packaging variance and repeatable deployment artifact
    - Still requires target-environment validation and bundle authoring discipline
  - - Mission operator updating edge system
    - Wait for specialized IT support or depot intervention
    - Use Fleet Connect to deploy or update mission software from Android/browser and reset to known-good baseline
    - Minutes-level reset/update workflow claimed for tactical systems
    - Public evidence is still mostly company-produced rather than customer-authored
  - - Authorizing official reviewing security posture
    - Review slide decks and manually assembled control evidence
    - Consume architecture diagrams, control mappings, SBOMs, and generated compliance artifacts from UDS
    - ATO narrative shifts from months to weeks/days in company materials
    - Coverage claims are product marketing rather than public third-party audit reports
  - - Commercial vendor entering Army IL4/IL5
    - Build bespoke security stack and lengthy documentation package
    - Package for UDS Army and inherit pre-authorized infrastructure posture
    - Lower barrier to market entry and faster approvals
    - Economic terms and success-rate conversion are not public
  - - Security team tuning runtime detections
    - Operate separate security toolchain or accept noisy defaults
    - Enable Falco stable rules by default and tune incubating/sandbox rules through bundle overrides
    - Centralized runtime detection with offline-friendly OCI/Helm distribution
    - Rule-noise tuning still requires Kubernetes and Falco expertise
  notes: Benefits synthesize official workflow descriptions, not audited customer outcome studies; where public
    proof is company-authored, the limitation column calls that out explicitly.
