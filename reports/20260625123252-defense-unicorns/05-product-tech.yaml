chapter:
  number: 5
  title: Product & Technology
  summary: 'Defense Unicorns delivers a layered defense-software stack: open-source Zarf for air-gapped packaging,
    UDS Core for Kubernetes runtime controls, commercial UDS products for enterprise delivery, tactical-edge fleet
    management, and a registry/compliance layer around OCI artifacts. The architecture is technically differentiated
    by package-first air-gap delivery, operator-driven policy automation, composable functional layers, and documented
    edge-optimization work such as Istio Ambient and Falco-based runtime security, but important commercial details
    such as module-level adoption, SLA transparency, and Registry/Fleet pricing remain largely private.'
sections:
- id: product-suite-and-operator-workflow
  title: Product suite and operator workflow
  body: 'Defense Unicorns is not selling a single point tool; it is packaging a product family around secure delivery
    into disconnected and regulated military environments. The open-source foundation is UDS Core plus Zarf, but
    the commercial surfaces matter: UDS Enterprise for platform and cybersecurity teams, UDS Fleet for distributed
    tactical systems, UDS Registry for managing OCI and Zarf artifacts, and UDS Army as a pre-authorized path into
    Army IL4/IL5 environments. The unifying workflow is intentionally simple: package once, move the artifact across
    cloud, on-prem, or DDIL environments, then let operators deploy and manage it without depending on specialized
    Kubernetes staff at every edge node. That is a materially different customer promise from generic DevSecOps
    consulting or cloud-only platform engineering, because Defense Unicorns is designing for mission operators,
    authorizing officials, and vendors that must live with air gaps, classified enclaves, and field resets rather
    than just CI/CD convenience.'
