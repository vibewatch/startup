- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Zarf init package
    - Seeds registry/Git plumbing and prepares disconnected Kubernetes clusters
    - Requires cluster access and, if not using external registry, registry bootstrap path
    - Bootstrap mechanics are powerful but operationally non-trivial in heterogeneous clusters
  - - UDS bundle manifest
    - Pins Zarf packages and environment-specific configuration into one deployable artifact
    - Correct dependency ordering and author-maintained overrides
    - Bad bundle design can still create version or configuration drift
  - - UDS Operator + Package CR
    - Automates app integration for ingress, SSO, monitoring, authz, and network policy
    - Depends on core-base services and cluster admission flow
    - Operator abstraction can hide complexity teams still need during debugging
  - - Pepr Policy Engine
    - Admission-time mutation and validation of workload posture
    - Webhook availability and explicit Exemption CR management
    - Exemptions can become policy debt if not governed tightly
  - - Istio ambient mesh
    - Provides encrypted service-to-service traffic with lower edge footprint than sidecars
    - Requires ztunnel pathing plus policy updates such as port 15008 handling
    - Mesh still introduces networking complexity and authorization-policy tuning burden
  - - UDS functional layers
    - Lets operators deploy only needed platform capabilities (identity, logging, monitoring, Falco, Velero, portal)
    - core-base foundation and some layer-specific prerequisites
    - Commercial layers require Registry access and agreement, limiting self-serve transparency
  - - UDS Registry / OCI path
    - Distributes signed packages and metadata across enterprise and edge deployments
    - Depends on prior packaging discipline and registry access model
    - Public docs do not fully disclose tenancy, redundancy, or standalone service commitments
  notes: Architecture table combines official docs and Zarf references; risk cells highlight where the public materials
    reveal unavoidable operational complexity rather than a product flaw.
