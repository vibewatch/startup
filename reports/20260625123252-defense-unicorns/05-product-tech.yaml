- id: roadmap-open-source-traction-and-differentiation
  title: Roadmap, open-source traction, and differentiation
  body: 'Defense Unicorns’ clearest technical moat is not raw algorithmic IP; it is a combination of open-source
    credibility, defense-specific packaging know-how, and a more composable operational model than older all-in-one
    stacks. Zarf remains the broadest open-source signal, with nearly two thousand GitHub stars and very recent
    updates, while UDS Core, UDS CLI, Pepr, and Lula show an active, if smaller, engineering surface around operator
    automation and compliance-as-code. Roadmap signals are also concrete: UDS Core 1.7 adds optional Envoy Gateway
    and richer Package CR annotations, while Fleet still lists iOS as future work rather than current capability.
    Compared with monolithic Big Bang-style bundles criticized for compliance theater, synchronized upgrades, and
    opaque abstraction, UDS’s docs emphasize selective functional layers, bundle-level version pinning, and lower-footprint
    ambient mesh operation. That said, the commercial boundary is real: custom layer usage requires authenticated
    UDS Registry access and an agreement, so some of the most investable product economics remain outside the open-source
    evidence trail.'
