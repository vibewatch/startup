  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fleet-registry-reliability
    missingEvidence: Public uptime, MTTR, incident history, and support-SLA disclosures for UDS Fleet and UDS Registry.
    whyItMatters: Operational resilience is a core part of the investment thesis, but the public record is richer
      on security architecture than on service quality or customer support commitments.
    diligencePath: Request customer-facing SLA documents, support handbooks, incident postmortems, and any status-page
      or availability reporting used in production programs.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: commercial-gating
    missingEvidence: Standalone pricing, tenancy model, contract terms, and module-level monetization for UDS Registry,
      UDS Fleet, and custom layer registries.
    whyItMatters: The public evidence clearly establishes technical value, but not whether commercial attach rates,
      margins, or customer lock-in are attractive enough for venture underwriting.
    diligencePath: Request SKU sheets, pricing models, gross-margin assumptions, customer packaging terms, and a
      map of which products require authenticated Registry access or bespoke agreements.
    relatedQuestionRefs:
    - QE023
    - QE026
  - type: access-blocked
    severity: minor
    topic: f22-edge-proof
    missingEvidence: Ungated detailed performance metrics and operational context behind the F-22 software-delivery
      case study.
    whyItMatters: The tactical-edge thesis is strongest when supported by named mission outcomes, but the public
      F-22 landing page is too thin to show failure modes, sustainment burden, or repeatability.
    diligencePath: Request the full case study deck or technical after-action report, including baseline workflow,
      install steps, elapsed times, and which parts were operator-driven versus engineer-assisted.
    relatedQuestionRefs:
    - QE027
  - type: missing-source
    severity: material
    topic: module-adoption-metrics
    missingEvidence: Module-specific deployment counts, named users, and conversion evidence separating UDS Enterprise,
      Fleet, Registry, and Army from company-wide mission-system totals.
    whyItMatters: Company-wide mission-system counts do not reveal which modules drive adoption, what is still pilot-stage,
      or where commercial traction is strongest.
    diligencePath: Request product-line dashboards or customer cohort data showing active deployments, renewals,
      and expansion by module and environment type.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
