- id: security-compliance-and-hardening
  title: Security, compliance, and hardening posture
  body: Defense Unicorns’ product narrative is tightly coupled to compliance automation, and the company has unusually
    deep public documentation for that layer. Official material repeatedly claims UDS addresses a majority of NIST
    SP 800-53 technical controls out of the box, with ATO-specific pages asserting over 90% coverage for IL4/IL5
    patterns and emphasizing automatically generated evidence, SBOMs, CVE results, architecture diagrams, and control
    traceability. The company’s own CMMC Level 2 certification with zero POA&Ms supports the argument that security
    is central to internal operations, while the RapidFort partnership indicates Defense Unicorns is outsourcing
    part of its hardened-container pipeline to accelerate near-zero-CVE and FIPS-oriented builds. On the runtime
    side, UDS Core has standardized on Falco and exposes configuration for stable, incubating, and sandbox rulesets,
    and the UDS CLI adds keyless package-signature verification. The strength is a credible compliance-by-design
    story; the risk is that public evidence is richer on platform controls than on Fleet or Registry service-level
    reliability, customer support guarantees, or incident transparency.
