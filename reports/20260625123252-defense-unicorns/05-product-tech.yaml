- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Defense Unicorns turns software delivery into a package-scan-publish-transport-deploy-manage loop that
    works across enterprise and tactical-edge environments.
  data:
    nodes:
    - id: n1
      label: Package mission app
      detail: Author bundles software, dependencies, and config with UDS/Zarf standards
      type: step
    - id: n2
      label: Scan and generate evidence
      detail: Produce SBOMs, vulnerability scans, signatures, and compliance artifacts
      type: step
    - id: n3
      label: Publish to UDS Registry
      detail: Store OCI/Zarf artifacts with role-specific metadata and verification data
      type: step
    - id: n4
      label: Cross the air gap
      detail: Move package via local registry, cross-domain path, or physical media into DDIL or classified enclave
      type: step
    - id: n5
      label: Deploy through Enterprise or Fleet
      detail: Platform teams or operators install software onto cloud, on-prem, or tactical systems
      type: step
    - id: n6
      label: Operate and observe
      detail: Use Fleet Command, platform telemetry, and runtime detections to manage the estate
      type: step
    - id: n7
      label: Reset / update to known-good state
      detail: Edge crews push updates or revert systems rapidly without waiting on specialist support
      type: step
