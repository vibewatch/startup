- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / mechanism
  - Status
  - Scope
  - Gap
  rows:
  - - NIST SP 800-53 technical-control coverage
    - Claimed live
    - Majority out of the box; >90% claim for IL4/IL5 ATO-focused pattern
    - No public independent validation quantifying exact control inheritance by environment
  - - Generated compliance evidence
    - Claimed live
    - Architecture diagrams, control traceability, inventories, SBOMs, CVE outputs, audit artifacts
    - No public sample artifact pack tied to a named customer ATO
  - - CMMC Level 2 corporate certification
    - Completed May 2025
    - Defense Unicorns internal handling of CUI and supply-chain credibility
    - Corporate certification is not the same as customer-environment product accreditation
  - - Falco runtime detection baseline
    - Default in current UDS Core
    - Stable rules enabled by default; incubating/sandbox optional via bundle overrides
    - Operational tuning burden still falls on customer teams for noisy workloads
  - - Keyless package signature verification
    - Documented in UDS CLI
    - Bundle create / inspect / deploy can enforce signing identity and OIDC issuer checks
    - Customers may still bypass with skip-signature-validation if process discipline is weak
  - - RapidFort hardened images / FIPS modules
    - Partner-delivered
    - Near-zero CVE posture, FIPS-validated modules, smaller images for UDS Core and proprietary products
    - Hardening outcome partly depends on third-party partner capacity and roadmap
  notes: Status reflects what the company documents publicly, not what has been independently audited across every
    customer enclave or deployment flavor.
