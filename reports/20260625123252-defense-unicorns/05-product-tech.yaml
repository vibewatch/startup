callouts:
- calloutType: strength
  title: Air-gap delivery is a real technical wedge, not just a slogan
  body: Defense Unicorns combines package transport, local registry seeding, Git/OCI mutation, and edge-operator
    tooling into a workflow that is specifically designed for disconnected and DDIL environments. That is materially
    more concrete than generic cloud DevSecOps positioning.
  claimRefs:
  - CE001
  - CE002
  - CE016
  - CE030
- calloutType: strength
  title: Open-source credibility supports commercial product claims
  body: Zarf, UDS Core, UDS CLI, Pepr, and Lula all show recent GitHub activity, giving Defense Unicorns a developer-signal
    footprint that is unusual for a defense software company selling into classified and air-gapped environments.
  claimRefs:
  - CE036
  - CE037
  - CE038
  - CE039
- calloutType: risk
  title: The platform still hides meaningful operational complexity
  body: UDS lowers day-to-day toil, but the public docs themselves show that admission-policy governance, service-mesh
    port handling, exemptions, and registry topology still require serious Kubernetes fluency under the hood.
  claimRefs:
  - CE015
  - CE017
  - CE041
  - CE042
  - CE043
- calloutType: risk
  title: Commercial surfaces are less transparent than the open-source core
  body: The evidence trail is strong for architecture and packaging mechanics, but much thinner for module-specific
    adoption, SLAs, pricing, and standalone Registry or Fleet reliability. Investors should not mistake open-source
    visibility for complete product-market transparency.
  claimRefs:
  - CE046
  - CE047
  - CE048
- calloutType: recommendation
  title: Ask for customer-level operating evidence before underwriting scale
  body: Next diligence should request module-by-module deployment counts, public or private uptime / incident records,
    Registry tenancy architecture, Fleet mobile roadmap timing, and evidence that non-engineer operators can sustain
    the system without a heavy contractor tail.
  claimRefs:
  - CE005
  - CE033
  - CE045
  - CE047
  - CE048
