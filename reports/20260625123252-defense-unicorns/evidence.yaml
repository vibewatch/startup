evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, ARR, gross margin, burn, and renewal/cohort data.
    whyItMatters: The public record proves relevance and fundraising momentum but not unit economics or cash efficiency.
    diligencePath: Request audited or board-reviewed financials plus current pipeline-to-bookings bridge.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Exact employee count, security-clearance mix, and contractor versus FTE composition.
    whyItMatters: Hiring signals growth, but staffing scale and cleared labor mix matter for delivery capacity and margin structure.
    diligencePath: Request HR roster summary and org chart by function and clearance level.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Board roster, investor ownership percentages, voting rights, and any protective provisions.
    whyItMatters: Governance leverage and dilution history can materially affect control and exit economics.
    diligencePath: Review cap table, board consents, and latest financing documents under NDA.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: mission-system-count
    missingEvidence: >-
      A consistent definition of what counts as a mission system, organization, program, or deployment environment in
      public scale claims.
    whyItMatters: The difference between 30-plus and 80-plus entities could reflect category changes rather than pure growth.
    diligencePath: Ask management to reconcile each public count to paying programs, production deployments, and pilot environments.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: >-
      A fully reconciled chronology tying every public scale claim, contract vehicle, and product launch to a dated
      announcement or award notice.
    whyItMatters: >-
      The chapter has enough dated milestones to clear the overview bar, but some public scale claims still rely on
      broad launch posts instead of primary award documents.
    diligencePath: >-
      Collect award notices, contract summaries, and archived release dates for each major milestone and reconcile them
      into the company timeline.
    relatedQuestionRefs:
      - QO013
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: classified-demand-visibility
    missingEvidence: >-
      Program-level counts of classified or air-gapped deployments and related annual spend by service or defense-wide
      owner.
    whyItMatters: >-
      Without deployment counts and spend by owner, SAM and SOM remain derived proxies instead of auditable bottoms-up
      market totals.
    diligencePath: Request cleared customer references, deployment counts, and category spend breakdowns during management diligence.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: authorization-cycle-time
    missingEvidence: Average elapsed time from tool selection to inherited ATO or operational deployment on mission networks.
    whyItMatters: >-
      Category value depends heavily on whether software-delivery tooling materially shortens authorization timelines
      versus incumbent approaches.
    diligencePath: Ask for program case studies with before-and-after authorization timelines and inherited-control reuse metrics.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: factory-standardization
    missingEvidence: >-
      A public cross-service inventory showing tool-chain commonality and budget ownership across the 50+ software
      factories.
    whyItMatters: >-
      Standardization level affects whether vendors can scale one product broadly or must sell custom integrations
      factory by factory.
    diligencePath: Collect service-level factory maps, platform standards, and contract vehicle usage in customer interviews.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: budget-lens-normalization
    missingEvidence: >-
      A single official table that reconciles discretionary DoD, national-defense discretionary, and total-request
      figures for software-market analysts.
    whyItMatters: Different budget lenses are easy to misread as contradictory and can distort top-down market narratives.
    diligencePath: Use management diligence to standardize one budget lens for investor materials and explicitly footnote the others.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      Public price books, contract structures, or realized pricing examples for Defense Unicorns, GitLab government,
      Anchore federal, and Aqua federal offers.
    whyItMatters: >-
      Without public packaging and pricing evidence, the cheapest viable substitute path cannot be compared with
      confidence.
    diligencePath: >-
      Request example statements of work, pricing schedules, or procurement records from recent defense or federal
      deployments.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: adoption-counts
    missingEvidence: >-
      Comparable public counts of active programs, classified deployments, or production software-factory instances
      across the prime-led rivals and Defense Unicorns.
    whyItMatters: >-
      Adoption breadth affects channel strength and switching-cost assessment, but public materials are selective and
      mostly marketing-oriented.
    diligencePath: >-
      Ask each vendor or reseller for referenceable production programs, renewal history, and number of accredited
      environments.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: prime-channel-conversion
    missingEvidence: >-
      Evidence showing how often awardable status on Platform One marketplace-style channels converts into live
      multi-year program awards.
    whyItMatters: >-
      Marketplace status is a channel signal, but it is not the same as a scaled installed base or recurring procurement
      engine.
    diligencePath: >-
      Review award records, follow-on task orders, and channel-partner case studies tied to the named marketplace
      entrants.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Stream-level revenue split among software subscriptions, support, training, embedded services, and SBIR-derived
      work.
    whyItMatters: >-
      Without the stream mix, investors cannot tell whether the visible award base converts into software-like recurring
      gross profit or labor-heavy delivery revenue.
    diligencePath: >-
      Request the last 12 months of revenue segmented by stream, plus mapping of major public awards to software,
      services, and prototype work.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI001
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, and base/downside runway model.
    whyItMatters: >-
      Runway cannot be computed from public sources even after the Series B, so capital adequacy and next-round timing
      remain assumptions rather than evidence.
    diligencePath: >-
      Request current treasury pack, six-month burn bridge, and board runway scenarios prepared after the Series B
      close.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: revenue-and-margin-disclosure
    missingEvidence: ARR, GAAP revenue, gross margin, and customer concentration disclosures or audited financial statements.
    whyItMatters: >-
      These are the minimum facts required to connect the unicorn valuation and public award base to durable financial
      performance.
    diligencePath: >-
      Request audited financials, monthly revenue bridge, gross-margin split by stream, and top-customer concentration
      by program.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: access-blocked
    severity: minor
    topic: marketplace-detail
