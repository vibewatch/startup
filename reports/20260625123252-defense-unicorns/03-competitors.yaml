  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-and-packaging
    missingEvidence: Public price books, contract structures, or realized pricing examples for Defense
      Unicorns, GitLab government, Anchore federal, and Aqua federal offers.
    whyItMatters: Without public packaging and pricing evidence, the cheapest viable substitute path cannot
      be compared with confidence.
    diligencePath: Request example statements of work, pricing schedules, or procurement records from
      recent defense or federal deployments.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: adoption-counts
    missingEvidence: Comparable public counts of active programs, classified deployments, or production
      software-factory instances across the prime-led rivals and Defense Unicorns.
    whyItMatters: Adoption breadth affects channel strength and switching-cost assessment, but public
      materials are selective and mostly marketing-oriented.
    diligencePath: Ask each vendor or reseller for referenceable production programs, renewal history,
      and number of accredited environments.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: prime-channel-conversion
    missingEvidence: Evidence showing how often awardable status on Platform One marketplace-style channels
      converts into live multi-year program awards.
    whyItMatters: Marketplace status is a channel signal, but it is not the same as a scaled installed
      base or recurring procurement engine.
    diligencePath: Review award records, follow-on task orders, and channel-partner case studies tied
      to the named marketplace entrants.
    relatedQuestionRefs:
    - QP009
    relatedTableRefs:
    - TP003
