- id: TP003
  title: Deployment, packaging, and procurement comparison
  columns:
  - rival archetype
  - typical packaging or contract model
  - deployment model
  - accreditation or channel advantage
  - procurement posture
  - implication for Defense Unicorns
  rows:
  - - Defense Unicorns
    - Platform plus services; public price undisclosed
    - Portable platform across cloud, on-prem, and tactical edge
    - Claims built-in controls and evidence for faster ATO
    - Can sell as platform-first offer
    - Strong where buyer wants one portable baseline rather than a labor-heavy services wrapper
  - - Platform One Big Bang + Iron Bank
    - Government-funded baseline; program implementation effort separate
    - GitOps delivery plus approved software supply channel
    - Government ownership and alignment to DoD reference architecture
    - Comfortable inside DoD standardization motions
    - Hardest in-house substitute when buyer values standards ownership over integration simplicity
  - - Leidos
    - Task-order or prime-led services around software factories and 2F operations
    - Operated environments in federal and classified/unclassified settings
    - Existing federal relationships plus accredited partner tooling
    - Strong on incumbent procurement lanes
    - Competes on channel and labor scale more than on portable product parity
  - - SAIC
    - Managed-services and mission-integration work
    - Secure-government-cloud operations across multiple hyperscalers
    - Cloud One and mission-operations familiarity
    - Strong where operations budgets already sit with SAIC
    - Can satisfy buyers that want outsourced operations instead of a new platform owner
  - - Booz Allen
    - Productized DevSecOps templates wrapped in consulting
    - Enterprise DevSecOps and accredited multicloud services
    - Integration depth with partner clouds and government programs
    - Strong in transformation and enterprise-standardization deals
    - Pressures Defense Unicorns in headquarters-led standardization efforts
  - - BAE marketplace route
    - Prime-led marketplace solution with UDS underneath
    - Prime-operated delivery motion
    - Awardable status on Platform One marketplace-style channel
    - Useful when awardable status and prime cover matter more than platform branding
    - Shows that prime-channel access can be as important as technical differentiation
  - - GitLab
    - Managed single-tenant government cloud or offline self-managed
    - Cloud SaaS-like tenancy or full offline self-hosting
    - FedRAMP Moderate government cloud plus integrated workflows
    - Commercial software procurement with strong self-service story
    - Most direct commercial full-stack substitute where a program accepts GitLab-centered workflows
  - - Anchore / Aqua
    - Security-platform subscriptions with implementation services as needed
    - Pipeline, registry, and runtime integrations
    - Federal compliance language, policy packs, and security authorizations
    - Often purchased as a security layer inside existing stacks
    - Displaces slices of value unless Defense Unicorns bundles or partners better on scanning and policy
  notes: Packaging and contract-model cells separate product posture from procurement posture; public
