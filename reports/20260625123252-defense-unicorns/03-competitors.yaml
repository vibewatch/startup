tables:
- id: TP001
  title: Competitor and substitute profile table
  columns:
  - competitor
  - category
  - target segment
  - differentiation
  - deployment model
  - limitation
  rows:
  - - Defense Unicorns
    - Direct secure software-delivery platform
    - Defense programs needing portable and disconnected delivery
    - Airgap-native platform with integrated compliance evidence and open-source portability
    - Portable platform spanning cloud, on-prem, and tactical edge
    - Public materials do not disclose standard pricing or broad installed-base counts
  - - Platform One Big Bang
    - In-house / government baseline
    - Programs standardizing on DoD-owned Kubernetes delivery patterns
    - Government-owned hardened package baseline aligned to the DoD DevSecOps Reference Architecture
    - GitOps delivery of hardened approved packages into Kubernetes
    - Opinionated stack can be heavy and does not by itself equal application-specific accreditation
  - - Iron Bank
    - In-house / government supply-channel substitute
    - Programs prioritizing approved containers and software provenance
    - DoD-controlled software supply channel for mission-critical software
    - Repository and supply-chain channel rather than full factory workflow
    - Not a full CI/CD, evidence, and runtime-operations platform on its own
  - - Leidos
    - Prime-integrator software factory
    - Federal customers wanting agile delivery inside prime-led programs
    - Software factories marketed as secure and mission-grade plus classified/unclassified 2F operations
    - Operated software-factory and DevSecOps services
    - More services-led than portable self-serve product
  - - SAIC
    - Prime-integrator managed environment
    - Programs already inside Cloud One or mission-integration contracts
    - Managed multicloud delivery and mission-application operations
    - AWS, Azure, and OCI secure government clouds as managed service
    - Public materials emphasize operations, not a productized portable stack
  - - Booz Allen
    - Prime-integrator DevSecOps platform
    - Agencies standardizing on Booz-led enterprise DevSecOps
    - Enterprise-scale DevSecOps with templated Jenkins-based delivery and multicloud accreditation support
    - Productized delivery platform wrapped in consulting and integration services
    - Less evidence of airgap-native portability than Defense Unicorns
  - - BAE Systems + UDS
    - Prime-channel route / marketplace offer
    - Buyers sourcing through Platform One awardable channels
    - Awardable status on the P1 Solutions Marketplace with UDS integrated into BAE delivery motion
    - Prime-led secure software delivery routed through marketplace-style procurement
    - Channel advantage may accrue to the prime relationship more than to the underlying platform brand
  - - Anchore
    - Container and compliance specialist
    - Teams needing SBOM, scanning, and policy enforcement in federal environments
    - DoD-focused policy packs, air-gapped support, IL-6/FIPS language, and DoD hardening-guide relevance
    - On-prem or pipeline-integrated security tooling
    - Does not, in fetched materials, replace the full program-level software-factory operating model
  - - Aqua Security
    - Container and code-to-cloud security platform
    - Organizations prioritizing scanning, CNAPP, and compliance breadth
    - Code-to-cloud security, pipeline controls, SBOM features, and federal compliance posture
    - Security platform integrated across SDLC and cloud
    - More security platform than procurement-aware delivery factory
  - - GitLab
    - Commercial full-stack substitute
    - Government teams wanting one integrated DevSecOps platform with cloud or offline options
    - FedRAMP Moderate single-tenant government offering plus documented offline self-managed install
    - Managed government cloud or offline self-managed deployment
    - Less tailored public messaging around ATO evidence and tactical-edge logistics than Defense Unicorns
  - - Palantir Apollo
    - Adjacent deployment/fleet-management platform
    - Programs needing software orchestration across security domains
    - Connected/disconnected deployment and compliance-aware change control across IL5/IL6 environments
    - Central software orchestration across air-gapped and connected estates
    - Fetched materials position Apollo as fleet management, not a turnkey software factory
  - - Open-source DIY (Argo CD + Flux + Kyverno)
    - DIY substitute
    - Highly capable platform teams comfortable assembling their own stack
    - Best-of-breed GitOps and policy primitives with auditability and flexibility
    - Self-assembled Kubernetes-native stack
    - No bundled procurement channel, accreditation evidence workflow, or managed support path in project
      docs
  notes: Profiles compare how a buyer solves the same secure-software-delivery job; where pricing or installed-base
    data is not public, cells are marked by posture rather than by unsupported revenue claims.
