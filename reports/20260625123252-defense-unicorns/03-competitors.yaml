- calloutType: risk
  title: Government ownership and incumbent channels are the largest displacement threat
  body: Platform One, Iron Bank, and prime-led environments can be politically easier to buy than a newer
    platform brand, even when they are heavier or more fragmented technically. Defense Unicorns must therefore
    prove integration simplicity and authorization speed, not just feature equivalence.
