- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - moat claim
  - threat vector
  - severity
  - why it matters
  - mitigation or diligence ask
  rows:
  - - Integrated airgap-native delivery
    - GitLab or prime-led environments cover enough of the workflow for less disruption
    - High
    - If the buyer already has preferred CI/CD conventions, Defense Unicorns may be judged as integration
      overhead rather than simplification
    - Ask for proof of migration time from incumbent stacks into UDS in classified and disconnected environments
  - - ATO-evidence acceleration
    - Government programs accept Big Bang plus manual evidence collection instead of paying for tighter
      integration
    - High
    - The core premium in the Defense Unicorns story is time-to-authorization reduction
    - Request side-by-side evidence packages showing what UDS automates that Big Bang, GitLab, or primes
      still do manually
  - - Open-source portability
    - Open-source buyers decide they can assemble Argo CD, Flux, Kyverno, and scanners themselves
    - Medium
    - DIY is credible for elite platform teams and can cap pricing power
    - Quantify ongoing integration and sustainment burden for DIY versus UDS
  - - Prime-channel access
    - Leidos, SAIC, Booz Allen, or BAE bundle software delivery inside larger task orders
    - High
    - Distribution can trump feature posture in defense procurement
    - Map which target programs already buy through prime-led modernization contracts
  - - Container compliance depth
    - Anchore or Aqua become the de facto federal scanning and SBOM layer inside customer stacks
    - Medium
    - If Defense Unicorns does not win the compliance layer, it risks becoming a thinner orchestration
      wrapper
    - Verify whether key programs require named scanners or specific FedRAMP/IL patterns before choosing
      UDS
  - - Government standardization pressure
    - Platform One baseline becomes politically safer than a newer vendor-owned platform
    - High
    - Government-owned defaults can reset category expectations regardless of product elegance
    - Track Platform One adoption, policy guidance, and whether awardable marketplace status converts
      into actual awards
  - - Opinionated baseline backlash
    - Big Bang complexity creates a market opening for simpler platforms
    - Medium
    - Adverse evidence against the government baseline can become a selling point for Defense Unicorns
    - Collect concrete replacement case studies where programs left heavier stacks for simpler portable
      baselines
  notes: Severity reflects competitive impact, not legal or security severity; mitigation items are diligence
    asks because public sources do not expose enough win-rate, pricing, or renewal data to close them.
