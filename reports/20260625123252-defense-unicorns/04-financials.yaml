- id: funding-history-and-valuation-signals
  title: Funding history and valuation signals
  body: 'The disclosed financing history is lopsided toward recent scale-up capital. SEC filings show an early September 2022 offering of just $504,329 and a much larger February 2024 offering of $35.0 million that was essentially fully sold to three investors. The January 2026 financing then reset the scale of the company entirely: Defense Unicorns and Bain Capital both disclosed a $136 million Series B that pushed valuation above $1 billion. On disclosed equity alone, public sources support at least roughly $171.5 million raised before counting any undetailed government-matching structures or later private instruments not visible in retained sources. The valuation signal is clearly strong, but it is not perfectly arms-length. Bain said it had backed the company since Series A, meaning the unicorn step-up reflects at least partial insider conviction rather than only brand-new outside price discovery. The other noteworthy nuance is that Bain paired the financing announcement with a claim
    of rapid profitable growth and 300% year-over-year adoption growth in military systems. Those statements are directionally encouraging and likely contributed to the valuation, but they are not substitutes for disclosed revenue, retention, or gross-margin data. The financing story is therefore compelling as a market-confidence signal and incomplete as a fundamentals bridge.'
