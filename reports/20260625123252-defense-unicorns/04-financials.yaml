  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Stream-level revenue split among software subscriptions, support, training, embedded services, and SBIR-derived work.
    whyItMatters: Without the stream mix, investors cannot tell whether the visible award base converts into software-like recurring gross profit or labor-heavy delivery revenue.
    diligencePath: Request the last 12 months of revenue segmented by stream, plus mapping of major public awards to software, services, and prototype work.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, and base/downside runway model.
    whyItMatters: Runway cannot be computed from public sources even after the Series B, so capital adequacy and next-round timing remain assumptions rather than evidence.
    diligencePath: Request current treasury pack, six-month burn bridge, and board runway scenarios prepared after the Series B close.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-and-margin-disclosure
    missingEvidence: ARR, GAAP revenue, gross margin, and customer concentration disclosures or audited financial statements.
    whyItMatters: These are the minimum facts required to connect the unicorn valuation and public award base to durable financial performance.
    diligencePath: Request audited financials, monthly revenue bridge, gross-margin split by stream, and top-customer concentration by program.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: access-blocked
    severity: minor
    topic: marketplace-detail
    missingEvidence: Detailed public-facing P1 listing contents for the awardable solution.
    whyItMatters: The gated marketplace prevents outside verification of exactly how the solution is packaged or described to eligible buyers.
    diligencePath: Obtain screenshots or an authorized export of the P1 listing from an eligible government account during diligence.
    relatedQuestionRefs:
    - QI015
  - type: missing-source
    severity: material
    topic: classified-vs-public-revenue
    missingEvidence: Revenue split between classified work, public award records, and commercial or contractor channels.
    whyItMatters: Public USAspending data captures only a visible subset of government work, so customer concentration and audit readiness remain unclear.
    diligencePath: Request a management breakdown of recognized revenue by classification channel, customer, and prime versus subcontract position.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
