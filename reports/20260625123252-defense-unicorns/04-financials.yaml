callouts:
- calloutType: strength
  title: Open-core plus mission services is a real monetization architecture
  body: The public record is unusually clear on how Defense Unicorns gets paid even though it is opaque on how much it gets paid. Free UDS Base, paid per-environment licenses, 24/7 support, and embedded mission services together create multiple monetization layers instead of a single bet on seat licenses.
  claimRefs:
  - CI008
  - CI010
  - CI012
  - CI013
  - CI036
- calloutType: risk
  title: Visible awards prove demand but not software quality of revenue
  body: The fetched federal awards are large enough to establish real customer demand, yet they do not show what share of those dollars is recurring software, what share is labor, or what margins sit underneath them. That distinction is the central quality-of-revenue question.
  claimRefs:
  - CI022
  - CI024
  - CI025
  - CI027
  - CI028
  - CI044
- calloutType: risk
  title: The unicorn valuation still outruns public fundamentals disclosure
  body: A $1B-plus valuation is credible as a financing outcome, but public sources still omit ARR, margin, burn, and runway. Bain’s insider continuity from Series A strengthens confidence in the company while also limiting how arms-length the valuation signal is.
  claimRefs:
  - CI004
  - CI005
  - CI037
  - CI042
- calloutType: recommendation
  title: Require a contract-to-margin bridge before underwriting
  body: The next diligence step is not another market map; it is a data-room bridge that maps visible awards and subscriptions into recognized revenue, gross margin, and cash burn. Without that bridge, investors can assess traction but not capital efficiency.
  claimRefs:
  - CI038
  - CI039
  - CI043
  - CI045
