- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Exact diligence path
  - Current public proxy / limitation
  rows:
  - - ARR / GAAP revenue
    - Without magnitude and growth, valuation cannot be tied to fundamentals
    - Request monthly revenue, trailing-twelve-month revenue, and ARR bridge
    - Public awards prove demand but not recognized revenue
  - - Revenue mix by software vs services vs SBIR/R&D work
    - Determines quality and repeatability of gross profit
    - Request stream-level revenue segmentation for the last 12 months
    - Public sources show hybrid mechanics but not stream shares
  - - Gross margin by stream
    - Needed to test whether the business behaves like software or services
    - Request gross margin split for software, support, services, and prototype work
    - No retained source discloses margin
  - - Cash, burn, and runway
    - Capital adequacy cannot be underwritten without treasury data
    - Request current cash, six-month burn bridge, and base/downside runway model
    - Series B size reduces alarm but does not compute runway
  - - Customer concentration and classified mix
    - A few large sole-source accounts could drive outsized renewal risk
    - Request top-five customer concentration and classified/unclassified revenue split
    - USAspending captures only the visible public subset
  - - Award-to-license mapping
    - Large obligations may still include implementation labor or prototype scope
    - Request CLIN-level mapping from visible awards to recurring software, services, and milestone work
    - Federal records disclose obligation totals, not economic composition
  notes: These gaps are the minimum data-room requests needed to convert traction evidence into an underwritten financial view.
