- id: fundamental-risk-mitigations-and-kill-criteria
  title: Fundamental risk, mitigations, and kill criteria
  body: 'The valuation and fundamental-risk problem is not that Defense Unicorns lacks traction; it is that the public record
    is still far thinner than the valuation headline. Bain Capital’s announcement gives the company a greater-than-$1 billion
    valuation, a $136 million Series B, profitable growth language, and a 300 percent adoption-growth claim. What it does
    not provide is the operating pack investors need to underwrite downside: revenue, gross margin, concentration by program,
    renewal behavior, backlog conversion, or the portion of demand that depends on noncompetitive award channels versus durable
    recurring platforms. That makes public valuation support narrative-heavy even if the underlying business later proves
    strong in diligence.  The right way to handle that gap is not to dismiss the company but to define kill criteria early.
    Loss of compliance eligibility, a budget cycle that repeatedly delays major software awards, proof that open-source bundle
    complexity is creating security debt, or evidence that SBIR-origin channels are not converting into diversified recurring
    programs should each trigger a re-underwrite. Public mitigants exist—open-source portability, offline deployment, documented
    compliance progress, and real mission demand—but they are still incomplete mitigants until management can connect them
    to concentration, renewal, margin, and incident evidence.'
  claimRefs:
  - CR046
  - CR047
  - CR050
  - CR055
