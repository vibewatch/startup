  evidenceGaps:
  - type: missing-source
    severity: material
    topic: company-specific-accreditation-disclosure-tr001
    missingEvidence: A company-specific public or NDA source confirming whether any Defense Unicorns cloud service has FedRAMP
      authorization or a FedRAMP Moderate equivalent package, plus a public incident history or status archive.
    whyItMatters: Without company-specific accreditation and incident evidence, investors cannot tell whether public-sector
      cloud claims rest on inherited platform credentials, customer boundary assumptions, or a still-unfinished authorization
      path.
    diligencePath: Request the latest SSP boundary summary, any FedRAMP or equivalent assessment package, and the last 24
      months of security incident and POA&M reporting.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: material
    topic: prime-and-program-diversification
    missingEvidence: A program-by-program revenue bridge showing direct awards, marketplace-origin awards, and prime-subcontractor
      revenue by customer and contract vehicle.
    whyItMatters: Marketplace listings and a few visible awards do not prove durable diversification across buyers, primes,
      or renewal cohorts.
    diligencePath: Request a trailing-24-month bookings and revenue schedule by agency, program, prime partner, contract vehicle,
      and recompete date.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: valuation-underwriting-pack
    missingEvidence: Revenue, gross margin, burn, backlog conversion, concentration, and renewal evidence needed to test whether
      a $1B+ valuation is supported by fundamentals instead of procurement momentum alone.
    whyItMatters: The public record supports growth and contract traction, but not the underlying unit economics or durability
      required to price downside credibly.
    diligencePath: Request board-ready KPI packs, cohort renewal analysis, backlog-to-revenue conversion, and scenario planning
      tied to budget delay and compliance-failure cases.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
