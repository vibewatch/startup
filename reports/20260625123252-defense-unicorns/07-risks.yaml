- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance eligibility loss
    - Cyber or accreditation failure
    - Loss of CMMC readiness, adverse assessor findings, or inability to evidence secure-software controls for a material
      program
    - Pause underwriting until management provides remediation timeline, backlog impact, and customer containment plan.
  - - Appropriations timing shock
    - Budget execution slippage
    - Repeated CR-driven delay in key award or option timing for major software programs
    - Discount near-term bookings conversion and re-test cash needs against delayed-award scenarios.
  - - Ownership-screening shock
    - FOCI or foreign-investment screening event
    - NISS ineligibility, unresolved SF-328 issues, or a financing event that creates new foreign-control questions
    - Re-underwrite cap-table flexibility, counsel costs, and timing risk on covered awards.
  - - Platform complexity debt
    - Cyber or reliability drag from stack sprawl
    - Evidence of persistent upgrade lag, emergency patch backlog, or customer concern about bundled-platform overhead
    - Shift the thesis from platform leverage to operational debt until release metrics improve.
  - - Fundamental/valuation mismatch
    - Growth does not translate into diversified durable economics
    - No credible revenue, margin, concentration, and renewal package despite unicorn valuation and visible contract traction
    - Treat valuation as procurement-momentum-driven and require a materially better entry price or stronger diligence package.
  notes: Triggers are analytical thresholds derived from the sourced risk pathways, not management-guided forecasts or legal
    advice.
