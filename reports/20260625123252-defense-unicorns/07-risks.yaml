company:
  name: Defense Unicorns
chapter:
  number: 7
  title: Risks
  summary: Defense Unicorns’ highest residual risks cluster around procurement concentration, appropriations timing, compliance
    and accreditation execution, and the operational burden of selling open-source-heavy software into a tightening defense-security
    regime. Public evidence supports real mitigants—air-gap delivery, CMMC progress, open-source portability, and contract
    traction—but it also shows a business exposed to sole-source procurement lanes, new FOCI scrutiny, export-control complexity,
    cleared-labor constraints, and well-capitalized competitors that already market accredited public-sector DevSecOps alternatives.
sections:
- id: ranked-risk-landscape
  title: 'Ranked risk landscape: concentration plus appropriations timing'
  body: Defense Unicorns’ public traction is real, but the public award trail also shows why procurement concentration is
    the first risk investors should rank. The company’s own contract-vehicle page emphasizes SBIR Phase III sole-source authority,
    Tradewinds, P1 Solutions, and AWS Marketplace access rather than a diversified set of openly competed program wins. The
    three readily inspectable USAspending awards reviewed here total roughly $87.6 million and all point back to SBIR-derived
    or one-source mechanics. That pattern can be attractive while the company is scaling because it compresses sales cycles
    and aligns with mission-urgent buying behavior, but it also means growth is exposed to a narrower set of statutory lanes
    and program champions than a broad-based enterprise software vendor would tolerate.  That concentration risk compounds
    with appropriations risk. GAO’s 2026 report says continuing resolutions create extra contracting and funding actions,
    delay milestones, and preserve no-new-starts limits that are especially awkward for software-heavy RDT&E and procurement
    accounts. The FY2026 defense budget itself implicitly acknowledges the problem by asking for cross-appropriation software
    flexibility to reduce delay and reprogramming friction. For Defense Unicorns, that means the same procurement system that
    can reward urgency can also delay revenue timing, backlog conversion, and option exercise cadence when Washington falls
    into CR-driven budget management.
  claimRefs:
