- id: dependency-competition-and-people
  title: Dependency, competition, and people constraints
  body: Defense Unicorns is not competing in an empty field. GitLab already markets a FedRAMP Moderate public-sector DevSecOps
    offer, Palantir is extending IL6-accredited cloud coverage, Anchore sells air-gapped SBOM and container-security tooling,
    and the major primes all market enterprise-scale DevSecOps or software-factory services to government buyers. None of
    these products is identical to UDS, but together they show that accreditation, offline deployment, container hardening,
    and mission-software delivery are contested buying criteria rather than unique territory. That means Defense Unicorns
    must keep proving that its integrated air-gap-native approach is worth choosing over a mix of primes, accredited cloud
    platforms, and point tools.  People and governance constraints amplify this pressure. The proposed FOCI rule would create
    NISS eligibility gates and tight mitigation timelines on covered unclassified awards, while Goodwin’s 2026 defense-tech
    guidance shows how investor structure, affiliation rules, and foreign stakes can collide with SBIR eligibility and later
    FOCI review. Meanwhile GAO still documents workforce reductions, private-sector competition, and lengthy clearance processes
    across defense labor markets. A company that depends on cleared DevSecOps, compliance, and program-delivery talent cannot
    assume labor is infinitely elastic just because demand is strong.
  claimRefs:
