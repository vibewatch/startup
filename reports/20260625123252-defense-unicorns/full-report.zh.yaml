            body: >-
              扩张故事可信，但集中度仍是闸门风险。可见扩张向量横跨海军舰队现代化、陆军 marketplace 式分发、空军任务系统更新，以及 BAE 和 SAIC 主导的总包渠道。 Defense Unicorns 还借
              DHS 和 CISA 采购工具推销联邦邻近入口，暗示核心 DoD 军种之外也有路径。即便如此，可归因客户基础仍几乎全是美国政府国家安全需求。 USAspending 显示，可见联邦授奖集中在 GSA 和 DoD
              流程中；在展示的下属机构组合里，空军规模远大于陆军，留存来源也没有识别出民用商业客户账本。 预算时点对这家公司并不中性，这一点很关键。DoD 监督材料和 GAO
              覆盖的报告显示，持续决议会推迟授奖、限制新启动项目、推高成本，并迫使反复重做预算规划。 对一家强调软件现代化、原型转化和快速列装的供应商来说，即便任务需求真实，这些采购摩擦也会直接转化为客户时点风险。
