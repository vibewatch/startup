companyProfile:
  summary: >-
    Defense Unicorns 总部位于 San Antonio，由退伍军人创办，是一家国防软件平台公司。公司由 Rob Slaughter、Jeff McCoy 和 Andrew Greene 于 2021 年 3
    月创立。核心产品 UDS 是一个面向气隙环境的软件交付平台：应用只打包一次，就能跨云端、本地、涉密和战术边缘环境迁移；UDS Army、UDS Registry、UDS Fleet
    等产品作为补充。作为一家私营国防软件公司，它的公开客户证明异常扎实，包括具名的 Navy、Army、Air Force 案例，以及 BAE Systems、SAIC 的伙伴渠道。公司在已披露的 $35 million Series
    A 之后，于 2026 年 1 月完成 Bain 领投的 $136 million Series B，估值超过 $1 billion；但公开证据仍未披露收入、利润率、留存或治理细节，无法把牵引力直接转成干净的投资承销案例。
