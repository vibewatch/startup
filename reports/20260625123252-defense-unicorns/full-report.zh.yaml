      - number: '8.6'
        title: 最终尽调问题与打破 thesis 的触发点
        blocks:
          - type: paragraph
            body: >-
              本章的判断缺口，不在于 Defense Unicorns 是否具备战略重要性；公开记录强烈暗示它具备。缺口在于当前轮次价格是否给新投资人留下足够安全边际。
              因此，剩余尽调清单异常偏估值。第一，管理层需要提供收入质量：ARR 或确认收入、毛利率、续约行为，以及积压订单在经常性软件与服务或支持工作之间的拆分。 第二，投资人需要理解 $300 million
              工具：上限、转化历史、客户集中度、转售商使用情况，以及实际获得资金的 task orders 时点。第三，Series B
              文件本身很重要，因为优先权条款可能让不变的头部估值对新钱或早期持有人没那么有吸引力。第四，公开义务金额图景应与渠道和盟友收入对账，因为 USAspending
              几乎肯定低估了全部商业现实。在这些问题关闭之前，正确姿态是监控打破 thesis 的触发点，而不是只从独角兽标题外推。
            claimRefs:
              - CV039
              - CV047
              - CV048
              - CV049
              - CV050
