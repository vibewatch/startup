      - number: '2.5'
        title: 采用障碍、矛盾信号与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要障碍不是 Pentagon 是否想要现代软件交付，而是项目能否足够快地吸收组织和合规变化。GAO 在 2023 年发现，DOD 至少部分落实了 17 项重大软件现代化建议，但其中 13
              项仍有未完成动作，包括人力和实施规划缺口。2025 年 3 月 State of DevSecOps 同样肯定进展，也记录了从孤立优秀样板扩展出去的必要性。预算时点是另一个真实摩擦点：GAO 2026 年 1
              月报告称，过去 49 个财年中，DOD 只有 12 个财年没有在持续决议下运行；其调查的 74 个采办项目中约一半报告 CR
              影响了进度。时点扰动很关键，因为供应商即便有产品市场匹配，仍可能遭遇授标延迟、部署推后和收入周期拉长。测量问题也很实质。公开来源没有披露涉密或气隙部署数量、从软件选择到任务网络继承 ATO 的平均时间，或 IT
              / cyber 预算中准确有多少留给软件交付平台。因此，任何风投式 TAM 叙事若直接从完整 DoD 预算、甚至完整 IT / cyber
              预算跳到巨大的软件交付机会，都会夸大这个市场变现的速度。更好的结论是：这个类别战略重要，也有采购支撑，但采用仍受认证劳动力、资金碎片化、人才稀缺和不透明涉密需求卡住。
            claimRefs:
