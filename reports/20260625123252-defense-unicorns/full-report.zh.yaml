  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与建议
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 于 2026-01-13 跨过独角兽门槛，当时公司宣布由 Bain Capital 领投、估值超过 $1 billion 的 $136 million Series B。
              这轮不是传闻或二级市场标记；它是当前公开记录中唯一披露的一级估值锚点，同时伴随管理层关于快速且盈利性增长、军事系统采用量同比增长 300% 的主张。 对一家 2021
              年才成立的防务软件公司来说，这些是有意义的正面信号。公开证据还显示，产品宽度不止单一工具：UDS、UDS Registry、UDS Army、 后来的 Airgap App Store 发布，以及 2026 年
              4 月 UDS Fleet 公告；该公告把平台与 80 多个任务系统和组织、一个 $300 million 的 DoD 全域合同工具连在一起。问题不是缺少叙事，而是缺少财务披露。本章审阅的公开来源都没有提供
              ARR、毛利率、留存、积压订单质量或 Series B 优先权条款。 在此基础上，投资判断是继续研究，置信度中等，风险高，估值立场是偏紧而非有吸引力。
