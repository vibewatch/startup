chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品范围
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 位于 San Antonio，由退伍军人创办。公司的核心判断是：即便任务系统断开公共互联网，仍需要现代软件交付能力。公司并不把 UDS 包装成通用 DevSecOps
              工具箱，而是定义为面向气隙环境的平台：一次打包，跨云端、本地和战术边缘环境部署，同时带上任务使用所需的合规和软件供应链证据。已审阅材料反复强调可移植性、避免供应商锁定，以及把软件从卫星送到潜艇的能力。这一身份很关键：Defense
              Unicorns 不是把自己定位成纯咨询公司或窄工具厂商，而是想成为国防项目软件保障的基础设施。Zarf 仍是这个故事里的重要证明点，因为它体现了公司在断连环境开源打包上的根；UDS Army、UDS
              Registry、UDS Fleet 等新产品则显示，公司正从单一工具可信度走向完整平台套件。
