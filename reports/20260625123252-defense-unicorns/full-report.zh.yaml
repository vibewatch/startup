  - id: TP004
    title: 护城河耐久度与竞争风险登记表
    columns:
      - 护城河主张
      - 威胁向量
      - 严重性
      - 为什么重要
      - 缓释措施或尽调问题
    rows:
      - - 集成式原生隔离网络交付
        - GitLab 或主承包商主导环境覆盖了足够多工作流，迁移扰动更小
        - 高
        - 如果买方已有偏好的 CI/CD 惯例，Defense Unicorns 可能被视为新增集成负担，而不是简化工具
        - 要求提供从既有技术栈迁移到 UDS 的用时证明，覆盖机密和断连环境
      - - ATO 证据加速
        - 政府项目接受 Big Bang 加人工证据收集，而不是为更紧密集成付费
        - 高
        - Defense Unicorns 故事中的核心溢价，是缩短授权时间
        - 索取并排证据包，说明 UDS 自动化了哪些 Big Bang、GitLab 或主承包商仍需手工完成的工作
      - - 开源可移植性
        - 开源买方认为自己可以组装 Argo CD、Flux、Kyverno 和扫描器
        - 中
        - 顶尖平台团队自己动手有可信度，也会压住定价权
        - 量化自建方案相较 UDS 的持续集成与维护负担
      - - 主承包商渠道准入
        - Leidos、SAIC、Booz Allen 或 BAE 把软件交付打包进更大的任务订单
        - 高
        - 国防采购里，分销触达可能压过功能姿态
        - 梳理哪些目标项目已经通过主承包商牵头的现代化合同采购
      - - 容器合规深度
        - Anchore 或 Aqua 成为客户栈内事实上的联邦扫描与 SBOM 层
        - 中
        - Defense Unicorns 若拿不下合规层，就可能退化成更薄的编排外壳
        - 核验关键项目在选择 UDS 前，是否要求指定扫描器或特定 FedRAMP/IL 模式
      - - 政府标准化压力
        - Platform One 基线在政治上比更新的供应商自有平台更安全
