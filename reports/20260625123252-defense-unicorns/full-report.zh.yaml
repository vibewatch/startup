      - number: '4.5'
        title: 财务结论与披露缺口
        blocks:
          - type: paragraph
            body: >-
              财务上，Defense Unicorns 看起来更真实，但不够透明。公开来源清楚支持混合变现模式、真实政府需求，以及投资人在独角兽量级上的持续兴趣；但它们不足以支撑干净的收入质量承销模型。保留的公开来源没有披露
              ARR、GAAP
              收入、毛利率、客户集中度、净留存、现金余额、月度烧钱，或订阅、服务和由原型延伸工作之间的收入拆分。这意味着关键尽调问题不是“是否存在”，而是“构成如何”：可见授标簿中有多少是经常性软件、多少是劳动密集型支持；环境许可证模型中有多大比例能转化为可重复续约经济；涉密和
              sole-source 路径能否成熟为更广的 program-of-record 收入，同时不压缩利润率。因此，恰当的财务结论是：对牵引力建设性，对经济性谨慎。投资人可以合理推断 Defense Unicorns
              有付费客户和强采购准入，但仍需要管理层披露，才能判断利润率韧性、资本效率，以及 $1 billion+ 估值是便宜、合理还是偏高。
