      - number: '8.5'
        title: 稀释、融资路径与退出准备度
        blocks:
          - type: paragraph
            body: >-
              $136 million Series B 应能降低近期稀释压力，尤其如果公司确实像管理层所称已经盈利，但它并没有完全消除融资风险。关键问题不是 Defense Unicorns
              能否撑过接下来几个季度，而是公司能否在下一次定价事件前，把叙事牵引力转成经常性、高质量收入。如果 $300 million 合同工具转化为可重复项目， 且盟友买方扩张，下一轮 $1.5 billion 到
              $2.5 billion 区间是合理的。如果收入披露仍薄或转化不及预期，在今天更紧的软件倍数环境下， 平轮或下轮落到 $0.6 billion 到 $0.9 billion
              区间会变得现实。由于业务由软件牵引、不是重工厂模式，下行可能好于需要巨额生产 capex 的自主系统同业，
              但这仍是推断，不是已证明事实。因此退出准备度最多算中等：最可能的路径是再融一轮私募；在没有更深披露的情况下，被防务总包商或系统集成商收购，比近期公开上市更可信。
