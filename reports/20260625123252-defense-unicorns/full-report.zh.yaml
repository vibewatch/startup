      - number: '3.3'
        title: 容器合规厂商和相邻国防平台可替换栈的一部分
        blocks:
          - type: paragraph
            body: >-
              Anchore 和 Aqua 不是 Defense Unicorns 的完整复制品，但会争夺同一预算的重要部分。两家公司都向联邦买方营销软件供应链安全；Anchore 尤其强调 DoD 专属语言，如 DISA
              STIG、DoD IL-6、FIPS 和容器加固指南；Aqua 则强调从代码到云的覆盖、软件供应链扫描和 FedRAMP 规模合规。当买方已有 GitOps 和托管基线，主要需要扫描、策略和 SBOM
              管理时，这些能力可能已经足够。Palantir Apollo 的相关性来自另一点：其官方文档讲的是跨连接、断连和气隙环境集中管理软件，并在 FedRAMP、IL5、IL6
              中做具备合规意识的变更控制。即使抓取材料没有把 Apollo 呈现为认证优先的软件工厂，它仍在部署和舰队管理问题上贴近 Defense Unicorns。Anduril 离核心任务更远：抓取的 Lattice
              页面强调指挥控制和任务自主，因此 Anduril 是相邻国防软件玩家，而不是主要 DevSecOps 替代品。对想要更窄工具链的买方来说，GitLab 加扫描厂商再加策略引擎，是更严肃的商业替代方案。
