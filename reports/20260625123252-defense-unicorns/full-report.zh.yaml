  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价机制
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 不是纯开源厂商，也不是传统按席位计价的 SaaS 公司。公开记录显示，它采用开源核心结构：UDS Base 在 AGPL-3.0 下免费，UDS Enterprise 和 UDS
              Fleet 则按唯一环境出售固定总价许可证；环境定义本身又与基础设施、Kubernetes
              发行版、涉密等级和地理位置绑定。这种计量方式很重要，因为它指向随任务环境扩张的账户经济，而不是简单用户数。公开定价仍没有价目表：公司要求按具体任务联系报价，并把商业条款放入 Order
              Forms，而不是公开表格。同一批材料显示，支持和服务在经济上有实质分量。付费计划包括通用支持，并对关键问题提供 24/7 响应；公司还单独营销
              Mission-as-a-Service、站点可靠性支持和前线部署工程。产品条款也强化一点：费用基于购买数量，而非实际用量；软件、支持、培训和其他服务都可能放进同一份商业文件。因此，最可辩护的财务读法是混合模式：漏斗顶端免费开源采用，随后是付费环境许可证，再叠加可抬高合同价值、但也带来劳动强度和利润率分散的服务与支持。
