        - 在发布指标改善前，把投资论点从平台杠杆转向运营债。
      - - 基本面 / 估值错配
        - 增长没有转化为多元且持久的经济性
        - 尽管已有独角兽估值和可见合同牵引，但仍拿不出可信的收入、利润率、集中度和续约材料包
        - 将估值视为由采购动能驱动，并要求明显更好的入场价格或更强尽调材料包。
    notes: 触发因素是从有来源支持的风险路径推导出的分析阈值，不是管理层指引预测或法律意见。
