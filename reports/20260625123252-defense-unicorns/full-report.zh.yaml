      - number: '7.2'
        title: 监管、认证与法律执行风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险是合规执行。Defense Unicorns 卖进的项目里，安全交付不只是功能，而是采购边界的一部分，因此认证和陈述风险具有实质经济意义。DoD
              安全软件备忘录称，过时授权流程仍在拖累敏捷交付，开源可见性缺口仍是真实的软件保障问题。随后 CMMC 合同分阶段导入又加上一道合规硬化棘轮。最终 DFARS 规则已经生效，官方 CMMC 文件称，当前阶段到
              2026 年 11 月 9 日以前重点是 Level 1 和 Level 2 自评。这不是安全垫；它只是更强的第三方和合同强制预期更深进入工业基础之前的跑道。 法律下行同样具体。DOJ 2026 年
              LOGZONE 和解显示，网络安全虚假陈述已不再只是理论上的 False Claims Act 问题。即便 Defense Unicorns 最终把许多项目落在断连或客户托管环境中，FedRAMP
              压力仍然重要：公共部门买方已经能在市场上看到获认证替代方案，触及 CUI 的云交付模块也会按这个背景被评判。
              尽调问题不是公司是否懂合规话术，而是每条对外营销的部署路径，能否扛住认证、陈述和证据负担，同时不制造未来授奖阻断或索赔暴露。
