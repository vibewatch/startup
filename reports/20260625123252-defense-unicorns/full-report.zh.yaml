      - - 合同位置
        - 可见联邦 obligations 加上已披露的 $300M 合同工具，说明采购准入真实存在。
        - 合同上限不是收入，而相对独角兽估值，公开 obligations 仍然很小。
        - 证据显示任务订单转化为有资金支持的经常性项目。
      - - 产品护城河
        - 隔离环境原生任务软件和软件工厂谱系，暗示嵌入式工作流价值。
        - 公开记录没有证明毛利率可持续，也没有证明服务强度低。
