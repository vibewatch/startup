      - number: '1.4'
        title: 里程碑、公开规模信号与未解尽调风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Defense Unicorns 已经越过“未来潜力”叙事，拿出了可验证的任务系统证据。Navy 潜艇案例把 Zarf 与 Columbia-class 保障需求和数千万美元 Phase III
              后续资金连在一起。F-22 演示说明，公司能把软件交付架构带入高后果飞机环境；UDS Army、CMMC Level 2 认证和 UDS Fleet 共同显示，它的产品横跨授权、网络安全和战术舰队管理。2026
              年 6 月 UDS Fleet 发布还给出了最宽泛的公开规模说法，包括软件部署在超过 80 个任务系统中，并提到一份 $300 million 的 DoD 全域合同和一份 $15 million 的 Space
              Force 合同。这些信号有分量，但不能关闭所有风险问题。收入、ARR、准确员工数和股权结构表细节仍未披露。公司深度绑定美国国防采购节奏；2026 年 2 月外部对 Big Bang
              生态的批评也提出了一个真实尽调问题：Defense Unicorns 能否把软件工厂经验商业化，而不重演批评者归因于这一谱系的复杂性、抽象层和合规剧场问题？
