        - 国防全域 IT / 网络安全拨款
        - 标准、共享工具、中央仓库
        - 国防全域 IT / 网络安全资源出资方
        - 需要标准化安全交付并继承控制
      - - 军种软件工厂
        - 军种 CIO、PEO 数字办公室、工厂负责人
        - 开发者、SRE、DevSecOps 团队
        - 军种 IT 和 RDT&E 预算
        - 工具链选择、平台部署、cATO 工作流
        - Army、Navy、Air Force、Space Force 数字化组合
