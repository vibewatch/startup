        - 快速验证、外场测试、OTA 转化
        - 作战司令部和赞助 PEO
        - 需要软件在断连或高延迟环境中也能运行
      - - 国防承包商和 DIB 供应商
        - 主承包集成商、二级软件供应商、对合规敏感的分包商
        - 供应商工程和安全团队
        - 主合同预算和间接 IT 预算
