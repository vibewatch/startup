      - number: '5.2'
        title: 架构与交付模型
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 的技术核心不是专有应用单体，而是打包和控制平面架构。UDS bundles 把 Zarf packages 和特定环境配置钉进一个可部署制品；UDS Operator 和
              Package 自定义资源则把应用部署同入口、身份、监控和策略自动化包在一起。底层由 Zarf 处理气隙 Kubernetes 的难点：初始化本地注册表，把 Flux 和 Argo 引用改向本地 OCI 或
              Git 端点，并把软件作为 tarballs 或 OCI artifacts 交付，必要时可用物理介质运输。UDS Core 再加入可组合功能层，如身份、日志、监控、备份 /
              恢复和运行时安全。架构专门为受限环境调校：Defense Unicorns 把 Istio 推向 ambient mode，以降低每个 pod 的 sidecar
              开销，并发布具备依赖意识的层排序，让团队只携带其环境真正撑得住的平台部分。
