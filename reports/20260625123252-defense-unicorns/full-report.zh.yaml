      - number: '3.2'
        title: 主承包集成商更靠采购姿态和托管环境竞争，而不是靠产品纯度
        blocks:
          - type: paragraph
            body: >-
              大型主承包商的威胁，不在于 Leidos、SAIC、Booz Allen 或 BAE 一定比 Defense Unicorns
              有更清晰的产品页，而在于它们能把安全软件交付包进更大的现代化、云或任务集成工作里；这些工作本来就有预算、合同通道和持有安全许可的劳动力。Leidos 明确向需要敏捷但不能牺牲安全的联邦客户营销软件工厂，再通过
              Second Front 合作把这一姿态延伸到涉密和非涉密 DevSecOps 运营。SAIC 抓取材料同样服务优先：Cloud One 案例描述的是跨 AWS、Azure 和 Oracle
              安全政府云的托管多云环境，而不是独立可移植平台。Booz Allen 通过 Solutions Delivery Platform 和 Jenkins Templating Engine
              把交付栈的一部分产品化，但仍强调多云集成和已认证服务。BAE 的相关性主要来自渠道放大：SatNow 报道显示 BAE 和 Defense Unicorns 共同在 Platform One Solutions
              Marketplace 获得可授标状态，说明 BAE 的渠道力量可能合作，也可能竞争，取决于谁掌握主承包关系。这个类别给 Defense Unicorns 施压的是分发和采购速度，而不是原始 GitOps 机制。
