      - number: '3.4'
        title: 护城河能否守住，取决于它能否比政府自有栈或模块化栈更好地简化认证和采购
        blocks:
          - type: paragraph
            body: >-
              在这组竞争者中，Defense Unicorns 最好的护城河并不是发明了 GitOps、扫描器或策略引擎。开源生态已经提供这些基础件，政府买方也能通过 Big Bang 获得加固包、通过 Iron Bank
              获得容器供应、通过主承包商获得多云服务。真正护城河是把可移植性、离线运行和合规证据更紧地组合起来，缩短认证工作，同时不把客户锁进封闭供应商栈。当项目需要快速获得安全基线，但不想自己承担把 GitLab、Argo
              CD 或 Flux、Kyverno、扫描厂商、制品物流和证据收集缝合到一起的集成负担时，这一定位最强。反向证据是，政府基线在改进，主承包商也在学会把已认证 DevSecOps
              包进更大合同。BordenCastle 对 Big Bang
              的批评其实双向作用：它提示某些标准栈过重，也说明政府基线已经能提供多少预集成能力。因此，当买方更看重快速列装和更低集成阻力，而不是政府自有或主承包商自有环境带来的政治舒适感时，Defense Unicorns
              更容易赢。最大未解弱点仍是打包透明度：公开材料还没有充分披露合同结构或实际定价，无法判断买方何时应改用模块化替代方案。
