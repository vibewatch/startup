      - number: '7.3'
        title: 开源、网络安全与供应链负担
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 的产品强项和运营风险来自同一个地方：一套为断连环境打造、开源占比很高的技术栈。Zarf 明确免费且开源，UDS 称自己建立在开源基础之上，
              平台还宣称在运行时内部掌控网络、身份、日志、监控、运行时安全和合规。若执行到位，这种广度可以成为护城河，因为它给买方一个紧凑的空隔离交付叙事；
              但任何升级错误、供应链可见性缺口或硬化失败，爆炸半径也会随之扩大。DoD 自己的安全软件备忘录称，开源代码来源可见性仍然不足；容器硬化指南则显示， 软件被视为可信之前，部门预期要完成大量扫描、STIG
              对齐、Iron Bank 流程和证据生产。外部 Big Bang 批评在这里有用，不是因为它证明 Defense Unicorns
              今天存在问题，而是因为它点出了整套设计哲学的一种失效模式：捆绑平台可能变得单体化、难升级，合规戏份很足，但操作者理解很弱。Defense Unicorns
              如果不能让开源基础保持更新、严格扫描，并证明捆绑复杂性在产出客户价值而非隐藏债务，早期赢得可信度的同一套架构，后续就可能变成网络安全、可靠性和续约风险来源。
