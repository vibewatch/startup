          - type: paragraph
            body: >-
              公开证据指向有意义的融资准入和不小的公开收入流入，但不足以计算现金续航期。正面看，公司带着 $136 million 新股权进入 2026 年，仅三份合同的可见联邦授标抓取金额就已超过 $87
              million。公司还营销多种采办捷径；在公司自己描述为缓慢的采购环境中，这些路径能帮助压缩收入转化时间。风险侧，保留的公开材料没有披露当前现金、月度烧钱、债务或现金续航期。这个缺口在这里比纯软件故事更重要，因为
              Defense Unicorns 明确向涉密和气隙环境销售 24/7 支持、Mission-as-a-Service
              和前线部署工程。这些交付特征可能提高客户黏性和合同价值，但也意味着服务和合规劳动力基础，可能拉大总预订额与软件式利润率之间的距离。独立风险来源也强化了这一点：Goodwin
              指出，许多国防初创公司仍卡在原型到生产之间的死亡谷；GAO 也持续把国防采办描述为缓慢且流程繁重。公开数据没有显示即时流动性压力；它显示的关键资本充足性问题是，收入能否扩展为持久、高效的项目工作。
