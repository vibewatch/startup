      - number: '7.4'
        title: 依赖、竞争与人才约束
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 并不是在空场竞争。GitLab 已经销售 FedRAMP Moderate 公共部门 DevSecOps 产品，Palantir 正在扩展 IL6 认证云覆盖， Anchore
              销售空隔离 SBOM 和容器安全工具，主要总包商也都向政府买方销售企业级 DevSecOps 或软件工厂服务。这些产品没有一个与 UDS 完全相同，
              但合在一起说明，认证、离线部署、容器硬化和任务软件交付都是被争夺的购买标准，而不是 Defense Unicorns 独占的地盘。因此 Defense Unicorns
              必须持续证明，其一体化、原生空隔离方法，值得买方放弃总包商、认证云平台和单点工具的组合。人才和治理约束会放大这种压力。拟议 FOCI 规则会给受覆盖的非涉密授奖设置 NISS
              资格门槛和紧凑缓解时限；Goodwin 2026 年防务科技指南则显示，投资人结构、关联规则和外资持股可能与 SBIR 资格及后续 FOCI 审查相冲突。与此同时，GAO
              仍在记录国防劳动力市场中的人员缩减、私营部门竞争和漫长的安全许可流程。一家依赖持证 DevSecOps、 合规和项目交付人才的公司，不能因为需求强劲就假设劳动力无限有弹性。
