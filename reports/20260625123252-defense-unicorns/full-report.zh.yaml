        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 卖的不是单点工具；它围绕安全交付到断连和受监管军事环境，打包了一组产品。开源基础是 UDS Core 加 Zarf，但商业界面同样重要：面向平台和网络安全团队的 UDS
              Enterprise，面向分布式战术系统的 UDS Fleet，用于管理 OCI 和 Zarf 制品的 UDS Registry，以及作为进入 Army IL4 / IL5 环境预授权路径的 UDS
              Army。统一工作流被刻意做得简单：一次打包，把制品跨云端、本地或 DDIL 环境迁移，然后让操作员部署和管理，不必在每个边缘节点都依赖专业 Kubernetes 人员。这与通用 DevSecOps
              咨询或仅云端的平台工程有实质不同，因为 Defense Unicorns 面向的是任务操作员、授权官员和供应商；他们要面对气隙、涉密隔离区和现场重置，而不只是追求 CI/CD 便利。
