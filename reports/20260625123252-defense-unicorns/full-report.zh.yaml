            body: >-
              对一家私营国防初创公司而言，Defense Unicorns 的公开融资记录异常清楚：2024 年 2 月 Series A 和 2026 年 1 月 Series B 都有公开描述。仅按已披露轮次，公司至少融资
              $171 million；Bain 领投的 Series B 把公司估值推到 $1 billion 以上。银团和金额同样重要：Ansa、Sapphire
              显示早期投资人持续加注，Bain、Valor、AVP、Uncorrelated Ventures 和 David Petraeus 则扩大了公司周边的战略与政治网络。公司也把 SAIC、BAE Systems
              的合作关系描述成倍增器，可以把产品可信度转成更大项目准入。即便如此，公开披露仍止步于浅层股权结构表。没有已审阅来源给出董事席位、持股比例、清算条款或二级交易。对投资人而言，这意味着公司确有融资动能和产业盟友，但公开记录仍不足以厘清治理杠杆、稀释历史或准确经济所有权。
