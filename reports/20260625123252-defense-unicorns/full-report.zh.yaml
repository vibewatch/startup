            body: >-
              已披露融资历史明显偏向近期扩张资本。SEC 文件显示，2022 年 9 月早期发行仅 $504,329；2024 年 2 月一笔更大的 $35.0 million 发行基本全部卖给三名投资人。2026 年 1
              月融资随后彻底重设公司量级：Defense Unicorns 和 Bain Capital 均披露了一笔 $136 million Series B，把估值推到 $1 billion
              以上。仅按已披露股权融资，在不计任何未详述的政府配套结构或保留来源中看不到的后续私人工具前，公开来源支持至少约 $171.5 million 融资。估值信号显然强，但并非完全独立第三方定价。Bain 表示自
              Series A 起就支持公司，意味着独角兽级跳升至少部分反映内部人信念，而不只是全新外部价格发现。另一个值得注意的细节是，Bain 在融资公告中同时声称公司快速盈利增长，且军用系统采用同比增长
              300%。这些说法方向上令人鼓舞，也可能推高了估值，但不能替代已披露收入、留存或毛利率数据。因此，融资故事作为市场信心信号很有说服力，但作为基本面桥梁仍不完整。
