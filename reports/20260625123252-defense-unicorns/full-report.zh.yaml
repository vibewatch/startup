      - number: '2.2'
        title: 规模测算视角：预算锚点、装机基础与推导 SAM
        blocks:
          - type: paragraph
            body: >-
              没有官方来源发布干净的“国防气隙软件交付”TAM，因此市场规模必须靠多组有证据支撑的视角推导，而不能只引用一个分析师标题。最宽的锚点是 FY2026 DoD IT 和网络空间预算请求：$66.1
              billion，其中 IT 为 $51.8 billion、网络为 $14.3 billion，分布在 3,271 项投资中。更大的 DoD FY2026 总请求为 $961.6
              billion，但其中只有一部分可能流向软件交付基础设施。第二个视角是装机基础需求：2025 年 3 月 State of DevSecOps 称，DoD 已有超过 50 个软件工厂把代码交付到生产环境；DSOP
              则宣传超过 100 个标准化工具和服务选项。第三个视角是合规驱动的相邻需求：FedRAMP 列出 527 项认证服务和 28 项 FedRAMP 20x 认证服务，而 FedRAMP 20x 仍在敲定 2026
              年规则和提交流程。这些信号支持一个低个位数十亿美元量级的美国 SAM，而不是数百亿美元量级。若刻意保守地假设 FY2026 IT / cyber 支出中约 2% 到 5%
              触及软件工厂、合规自动化、加固制品管理和断连部署工具，则指示性 SAM 约为每年 $1.3 billion 到 $3.3 billion。这是估算，不是已报告市场总额；应把它视为受约束的支出带，而非精确收入池。
