          label: 收入时点冲击
          detail: 订单或 backlog 转化滑期
          tone: negative
        - id: valuation_reset
          label: 估值重置
          detail: 投资者因持久性减弱而下调定价
          tone: negative
        - id: thesis_break
          label: 投资假设破裂
          detail: 增长故事不再跨过风险调整后回报门槛
          tone: negative
      edges:
