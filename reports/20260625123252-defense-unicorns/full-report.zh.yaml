  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：真正替代方案是政府基线、服务主导的主承包商和模块化替代品
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 卖的是安全软件交付结果，不只是扫描器或 Kubernetes 工具。因此，最直接的替代方案，是国防买方已经能把任务软件从源码送到已认证运行时的几条路：Platform One
              Big Bang 加 Iron Bank 这类政府自有基线；在既有任务订单下由主承包集成商运营的环境；或由 GitLab、容器安全厂商和开源 GitOps 工具拼出的模块化商业栈。Defense Unicorns
              自身材料强调面向气隙的交付、可移植性和合规证据；Platform One 文档则强调加固、已批准包和 DoD DevSecOps Reference
              Architecture。这意味着购买决策通常围绕谁拥有基线和授权路径，而不是谁有最花哨的单项功能。Big Bang 和 Iron Bank 重要，是因为它们定义了一个政府自有标准，分发和加固已在 DoD
              内部得到认可。GitLab 重要，是因为它把集成 DevSecOps、政府专用云租户和有文档支撑的离线部署结合起来。Argo CD、Flux、Kyverno
              等开源工具也重要，因为成熟团队可以围绕它们自建；但这些项目本身不带授权叙事、托管渠道或合同路径。
