              证据质量高于只摆 logo 的营销，但仍不均衡。海军和空军证据包含具名项目和具体作战结果，明显强过模糊的军种清单。陆军证据显示了真实采购设计和点名接入动作，
              但尚未披露同等强度、可归因到已列装项目的证据。最宽口径的规模主张仍来自公司：UDS Fleet 称 Defense Unicorns 软件已部署到 80 多个任务系统和组织， 公司拥有 $300 million
