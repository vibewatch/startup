      - number: '1.2'
        title: 创始人、领导层与治理姿态
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 最强的身份资产是创始人与市场的匹配。Rob Slaughter、Jeff McCoy 和 Andrew Greene 并不是以外部人身份切入国防软件；公司自己的历史把他们和
              Kessel Run、Space CAMP、Platform One、Big Bang 连在一起，DefenseScoop 的报道也强化了一个公开叙事：Slaughter 从 DoD
              软件工厂转向创业者，是公司故事的核心。这样的背景支撑了军方买方信任，但也把战略和声誉权重集中在少数创始型运营者身上。Slaughter 显然是公众面孔和首席布道者，McCoy 提供技术可信度，Greene
              则被呈现为持续连接产品与任务的工程师。公开来源缺的是正式治理细节：已审阅材料没有披露更完整的董事会名单、投票权或投资人控制条款。因此，尽调应把创始人质量视为优势，同时继续验证接班安排、决策权，以及公司的平台战略是否过度依赖少数运营者。
