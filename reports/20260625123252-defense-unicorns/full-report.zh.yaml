              Defense Unicorns 故事背后确有真实证据。公司材料显示，业务借 Platform One 血统、海军和陆军引用，以及海军、空军和 Space Force 系统部署，
              嵌入了真实防务软件工作流。公司还在 Series B 之前公开披露过 $35 million Series A，说明早期投资人重复支持，而不是一次机会主义加价。 USAspending
              给了一个重要的硬数据底座：本报告抓取的收款方画像显示，可见联邦义务金额为 $42.54 million，GSA 和 DoD 是最大的两个授奖渠道。
              这不能证明公司总收入，因为转售商、分包商和合同工具经济性可能不同于直接义务金额；但它说明公司卖的不是纯空气。偏紧之处来自公开义务金额与 $1 billion 股权价值之间的缺口。如果市场把 Defense
              Unicorns 承保为一个承载可重复、高毛利任务工作负载的软件平台，这个价格可以成立。如果真实经济性更接近服务或低转化合同工具， 估值就很难辩护。
