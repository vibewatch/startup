      - number: '2.3'
        title: 买方、用户、付款方与采购路径
        blocks:
          - type: paragraph
            body: >-
              这一类别的买方栈结构性分散。用户是软件工厂运营者、DevSecOps 工程师、平台团队，以及需要把代码送入涉密或断连网络的任务应用团队。买方则是采办专业人员、平台办公室、各军种 CIO 和 PEO
              组织，以及决定哪些工具可继承、哪些要自建的边缘现代化团队。付款方分散在国防全域 IT 账户、各军种 IT 和网络预算、项目办公室 RDT&E
              科目，以及任务系统现代化资金中。采购确实明显提速，但并不均匀。Defense.gov 和 2025 年 3 月背景简报强调，软件采办路径、CSO 和 OT 已成为许多软件采购的新默认路线；资金到位后，不到一年可到
              MVP。DIU 称，自 2016 年以来已通过 CSO 授出超过 500 个 OT，其中 88% 给了非传统供应商，近期一项 Replicator 软件奖项用 110
              天完成。战术边缘现代化又创造了额外入口：Army 的 G-TEAD 模式为 TRL 7+ 技术跑 180 天验证冲刺，并把成功供应商推向 OTA；DISA 和 Army
              太空项目则把应用、数据和连接能力推到更靠近战术边缘用户的位置。对 Defense Unicorns 来说，这意味着需求真实存在，但必须逐个项目赢下，而不是靠一个集中品类所有者一次性拿下。
            claimRefs:
