              的 UDS Army 架构触达的 Army 项目经理和士兵；以及 F-22 软件企业等 Air Force 任务系统所有者。第二层是主承包商和集成商渠道：BAE Systems 和 SAIC
              不是军事软件结果的终端用户，但它们把 UDS 嵌入更大的政府产品，是重要的项目路径伙伴。第三层是 UDS Army 试图通过应用市场模式为 Army
              买方聚合的软件供应商生态。采购路径几乎和技术采用同样重要。Defense Unicorns 明确营销 SBIR Phase III、GSA IDIQ、Tradewinds、P1、SeaPort NxG、AWS
              Marketplace 和直接授标手册，因为公司客户受采办约束，低摩擦、预清理的路径比通用企业 SaaS 采购更有价值。
