  - id: TP003
    title: 部署、打包与采购比较
    columns:
      - 竞争者原型
      - 典型打包或合同模式
      - 部署模式
      - 认证或渠道优势
      - 采购姿态
      - 对 Defense Unicorns 的含义
    rows:
      - - Defense Unicorns
        - 平台加服务；公开价格未披露
        - 跨云、本地和战术边缘的可移植平台
        - 声称内置控制和证据，可加快 ATO
        - 可作为平台优先方案销售
        - 买方想要一条可移植基线，而不是重人力服务外壳时，优势明显
      - - Platform One Big Bang + Iron Bank 基线
        - 政府出资基线；项目实施工作另算
        - GitOps 交付加已批准软件供应渠道
        - 政府所有权，并与 DoD 参考架构对齐
        - 适合 DoD 标准化动作
        - 买方更看重标准所有权而非集成简单性时，这是最难打的内部替代
      - - Leidos
        - 围绕软件工厂和 2F 运营的任务订单或主承包服务
        - 在联邦、机密 / 非机密场景中运营环境
        - 既有联邦关系，加上已认证合作伙伴工具
        - 在既有采购通道上很强
        - 更多在渠道和人力规模上竞争，而非可移植产品对等
      - - SAIC
        - 托管服务和任务集成工作
        - 跨多个超大规模云的安全政府云运营
        - 熟悉 Cloud One 和任务运营
        - 运营预算已在 SAIC 手中时很强
        - 可满足那些想外包运营、而不想新增平台负责人的买方
      - - Booz Allen
        - 产品化 DevSecOps 模板外包在咨询中
        - 企业 DevSecOps 和已认证多云服务
        - 与合作伙伴云和政府项目的深度集成
        - 在转型和企业标准化交易中很强
        - 会在总部主导的标准化工作中挤压 Defense Unicorns
      - - BAE 市场路径
        - 由主承包商主导的市场解决方案，底层使用 UDS
        - 主承包商运营的交付动作
        - 在 Platform One 类市场渠道上具备可授标状态
        - 当可授标状态和主承包背书比平台品牌更重要时有用
        - 表明主承包渠道触达可能和技术差异化一样重要
      - - GitLab
        - 托管单租户政府云或离线自托管
        - 云 SaaS 式租户或完整离线自托管
        - FedRAMP Moderate 政府云，加集成工作流
        - 商业软件采购，自助叙事很强
        - 项目接受以 GitLab 为中心的工作流时，它是最直接的商业全栈替代
      - - Anchore / Aqua
        - 安全平台订阅，按需配实施服务
        - 流水线、镜像仓库和运行时集成
        - 联邦合规表述、策略包和安全授权
        - 常作为既有技术栈内的安全层采购
        - 除非 Defense Unicorns 在扫描和策略上更好地打包或合作，否则会被替代掉部分价值
    notes: 打包和合同模式单元格把产品姿态与采购姿态分开；公开来源没有披露多数竞争者的实际定价、折扣，或席位制与用量制经济性。
