  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序：集中度叠加拨款时点
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 的公开牵引力真实存在，但公开授奖轨迹也说明，采购集中度应排在投资人风险清单第一位。公司自己的合同工具页面强调 SBIR Phase III
              单一来源授权、Tradewinds、P1 Solutions 和 AWS Marketplace 入口，而不是一组多元化的公开竞标项目胜利。本文检查到的 3 笔易核验 USAspending 授奖合计约
              $87.6 million，全部指向 SBIR 衍生或单一来源机制。公司扩张时，这种模式有吸引力：它压缩销售周期，也贴合任务紧急采购行为；
              但也意味着，增长暴露在比广义企业软件供应商更窄的法定通道和项目拥护者之上。集中风险还会与拨款风险叠加。GAO 2026 年报告称，持续决议会制造额外合同与资金动作、
              推迟里程碑，并保留不许新启动的限制；对软件占比较高的 RDT&E 和采购账户来说，这些限制尤其别扭。FY2026 国防预算本身也隐含承认了这个问题， 因为预算请求跨拨款科目的软件灵活性，以降低延迟和重编程摩擦。对
              Defense Unicorns 来说，同一套能奖励紧急性的采购系统，一旦 Washington 进入 CR 驱动的预算管理，也会拖慢收入确认时点、积压订单转化和期权行权节奏。
