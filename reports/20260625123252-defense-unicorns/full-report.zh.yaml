      - number: '7.5'
        title: 基本面风险、缓释因素与放弃标准
        blocks:
          - type: paragraph
            body: >-
              估值和基本面风险的问题，不是 Defense Unicorns 没有牵引力，而是公开记录仍远薄于估值标题。Bain Capital 公告给了公司超过 $1 billion 的估值、 $136 million
              Series B、盈利性增长表述，以及军事系统采用量增长 300% 的主张。但公告没有给出投资人承保下行所需的运营包：收入、毛利率、按项目集中度、
              续约行为、积压订单转化，或需求中有多少依赖非竞争性授奖通道、多少来自耐久的经常性平台。即便底层业务日后在尽调中被证明很强，公开估值支撑仍偏叙事。
              处理这个缺口的正确方式不是否定公司，而是尽早定义放弃标准。合规资格丧失、预算周期反复推迟重大软件授奖、开源捆绑复杂性正在制造安全债务的证据， 或 SBIR
              源头通道未能转化为多元化经常性项目的证据，都应触发重新承保。公开缓释因素确实存在——开源可移植性、离线部署、有文件记录的合规进展和真实任务需求——
              但在管理层把它们与集中度、续约、利润率和事故证据连起来之前，这些缓释因素仍不完整。
