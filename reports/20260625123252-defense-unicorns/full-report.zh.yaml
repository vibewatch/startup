  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - FY25-26 Software Modernization 任务
        - 驱动
        - 近期
        - 为 cATO、API、软件工厂规模化、SaaS ATO 和边缘云使用创造政策需求
        - 哪些任务已有出资实施负责人，哪些还只是政策意图？
      - - Software Fast Track 计划
        - 驱动
        - 近期
        - 把验证、SCRM 和授权改革推入采购流程
        - 到 FY27，SWFT 中有多少会变成第三方供应商的强制要求？
      - - FedRAMP 20x 转型
        - 驱动
        - 2026-2027
        - 奖励证据密集型自动化和更轻量的持续保障
        - 中等级别自动化模式会被国防封闭区接受吗？
      - - CMMC 分阶段落地
        - 驱动
        - 2025-2028
        - 把合规压力扩展到承包商群体，并利好具备证据自动化能力的供应商
        - 主承包商会以多快速度把 CMMC 证据要求推给软件分包商？
      - - 战术边缘需求
        - 驱动
        - 当前
        - 提升“打包一次、随处部署”工作流的价值，这类工作流需扛住 D-DIL 条件
        - 哪些项目今天已有断连软件交付预算，哪些只是未来愿望？
      - - 软件工厂装机基础
        - 驱动
        - 当前
        - 创造许多采用节点，但也带来许多本地工具决策
        - 50 多个工厂之间，工具链标准化到什么程度？
      - - 人才与实施缺口
        - 约束
        - 当前
        - 团队仍缺软件人才厚度和执行纪律，规模化因此放慢
        - 最缺的岗位在哪里：AOs、平台 SRE、安全工程师，还是产品负责人？
      - - 持续决议
        - 约束
        - 反复出现
        - 即便需求存在，也会推迟授标和部署时点
        - 管线中有多大比例暴露在年度拨款扰动下？
      - - 预算归属分散
        - 约束
        - 持续存在
        - 迫使供应商销售转向许多小机会，而不是一个品类经理
        - 哪些军种或国防范围账户稳定资助可复用交付平台？
      - - 不透明的机密需求
        - 约束
        - 持续存在
        - 阻碍自下而上的清晰测算，也隐藏从试点到部署的转化率
        - 在 NDA 或具备保密资质的尽调下，索取部署数量、继承 ATO 指标和预算组合
    notes: 大部分品类风险落在部署摩擦和预算节奏上，而不是缺少对安全、可移植软件交付的战略需求。
