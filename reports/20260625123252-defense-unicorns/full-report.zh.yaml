            body: >-
              最强的公开收入质量证据来自联邦授标记录，而不是任何已披露 ARR 指标。Defense Unicorns 公开宣传 SBIR Phase III、SeaPort NxG、Tradewinds 和 P1
              路线，USAspending 记录显示，这些路线能转化为真实的八位数义务金额。抓取的授标端点包括一份与气隙软件交付 SBIR Phase III 工作相关的 $65.0 million GSA 交付订单、一份支持
              Air Force 网络架构平台的 $12.7 million DoD 交付订单，以及一份 $9.9 million SBIR sequential Phase II 合同。三项可见授标合计 $87.6
              million。这不意味着 $87.6 million 的经常性软件收入，因为同一批来源显示其中混有由原型项目延伸的 SBIR 工作、交付订单支持和平台服务。但它确立了一点：Defense Unicorns
              拿到的是有经济分量的政府项目，而不只是试点。这个金额带也说明，客户经济性很可能取决于项目级合同和环境扩张，而不是低客单价自助采用。限制同样重要：公开授标记录没有披露每项义务中有多少是软件订阅、实施劳动力、培训或
              R&D 支持，因此授标栈是规模信号，不是利润率质量答案。
