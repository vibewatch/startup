  - id: TV005
    title: 论点破裂和终止触发因素表
    columns:
      - 触发项
      - 阈值
      - 对投资判断的传导
      - 行动含义
    rows:
      - - 收入验证不及预期
        - 管理层披露或尽调显示，收入仍低于约 $40M，且复购有限。
        - 当前估值会从软件溢价，重估到更低的私募软件区间。
        - 按悲观情形区间重做承销；把持平轮或下轮视为基准风险。
      - - $300M 合同载体未能转化
        - 未来 12-24 个月，任务订单转化或义务金额增长有限。
        - 本轮估值内含的期权价值会快速流失。
        - 除非价格重置，否则立场转向回避。
      - - 优先权结构对投资人不友好
        - Series B 文件披露较重的优先清算权、结构化条款或 pay-to-play 保护。
        - 头部估值高估了新投资人或普通股持有人的有效价值。
        - IC 承销中大幅折让本轮价格。
      - - 2026 年软件倍数进一步走弱
        - 网络安全和国防软件估值压缩到当前精选区间以下。
        - 即便公司执行尚可，私募定价弹性也会收窄。
        - 收紧可比区间，下调上行情景假设。
      - - 任务采用停滞
        - 当前 80+ 任务系统说法之外，没有实质增长。
        - 软件平台叙事走弱，公司更像项目制业务。
        - 后续跟投前要求新的牵引力证明。
    notes: 阈值是作者定义的监控规则，锚定公开指标和尽调输出。
    claimRefs:
      - CV009
      - CV010
      - CV023
      - CV024
      - CV042
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入质量
        - 已确认收入或 ARR、客户集中度，以及经常性软件与服务的拆分。
        - 缺少这些数据，当前倍数就无法可靠落到公开可比公司的区间上。
        - 获取管理层材料、审计财报，或贷方风格的月度 KPI 包。
      - - 毛利率与续约
        - 按产品线拆分的毛利率、续约率、净留存和支持负担。
        - 这些指标决定 Defense Unicorns 应该拿软件倍数还是服务倍数。
        - 在 NDA 下索取 cohort 级单位经济和合同续约历史。
      - - 合同载体转化
        - $300M 合同载体上限、已授予任务订单、已拨款 backlog，以及转化为收入的时间。
        - 如果转化缓慢，头部合同载体可能只有期权价值，没有现金流。
        - 审阅任务订单数据，并与 USAspending / 渠道 bookings 对账。
      - - 渠道结构
        - 直接联邦义务金额，与经销商、分包商和盟友收入的对比。
        - USAspending 几乎必然低估总业务量，但差额必须量化。
        - 要求提供从公开义务金额到报告收入的收入桥。
      - - Series B 条款
        - 清算优先权、反稀释棘轮、按比例认购权、董事会条款，以及任何债务或认股权证叠加。
        - 同一个头部估值，对新投资人的经济含义可能完全不同。
        - 承销前审阅融资文件或律师摘要。
    notes: 每个尽调问题都直接牵动估值；没有一个只是泛泛的加分项。
    claimRefs:
      - CV039
      - CV052
