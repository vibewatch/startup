      - number: '2.4'
        title: 增长驱动：现代化政策、合规负担与边缘需求
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自政策和作战，而不是纯宏观预算。FY25–26 Software Modernization Implementation Plan 明确优先推进快速通道 SaaS ATO、边缘应用的 OCONUS
              云使用、cATO、软件工厂扩展、API 互操作和 AI 就绪。2025 年 4 月 Accelerating Secure Software 备忘录更进一步，指出冗长授权流程会拖累敏捷连续交付，并要求在 90
              天内建立涵盖网络安全、供应链风险管理、验证和信息共享的 Software Fast Track 框架。DSOP
              向项目方出售的是同一个结果：跨企业、云、断连、间歇和涉密环境的可移植性，以及几天内可部署、而不是一年才落地的加固软件工厂。DISA 容器加固指南和 Iron Bank
              流程说明了经济意义：可复用加固容器和可继承控制项能减少重复认证工作。战术边缘压力放大了机会。Army 和 DISA 来源强调，连接差、延迟敏感或平台长期远离本土云运行时，用户需要仍能工作的能力。Defense
              Unicorns 的产品叙事与这些驱动高度一致：它围绕一次打包、部署到争夺性或断连环境，而不是假设永久连接的超大规模云模型。
