    UDS 是一个安全、可移植、面向气隙环境的平台，把应用和依赖打包成可跨云端、本地和断连环境部署的制品。更大的产品家族包括面向平台和网络安全团队的 UDS Enterprise、面向 DDIL / 战术边缘作业的 UDS
    Fleet、用于签名制品分发和合规元数据的 UDS Registry，以及针对 Army 的授权加速路径。
