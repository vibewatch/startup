  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：面向争夺性国防环境的安全软件交付
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 不卖通用云，也不卖万用国防软件；它卖的是工具和工作流层，帮助任务软件在云端、本地、涉密、断连和战术边缘环境中完成构建、打包、授权、迁移和运行。Defense Unicorns 把
              UDS 描述为军用完整软件工作流，把 Zarf 描述为把软件打包并分发到气隙、受限和独立环境的方法。DoD 官方 DevSecOps 材料对相邻的政府自有问题集也有类似定义：标准化工具、加固容器、CI/CD
              编排、cATO，以及跨断连和涉密环境的可移植性。因此，市场边界包括软件工厂、制品注册表、容器加固、SBOM / 签名、合规自动化，以及把任务应用迁入严苛环境的打包 /
              部署中间件；不包括核心武器硬件、没有断连部署要求的通用企业 SaaS、原始公有云基础设施消耗，以及不解决软件交付摩擦的宽泛网络安全产品。现状替代方案包括按项目定制的流水线、手工 ATO
              文书、主承包商定制栈，以及内部拼装的软件工厂。这个边界很重要：DoD 数字预算表面上巨大，但直接支付气隙交付和高合规软件运营的部分，是窄得多的中间件和平台类别。
