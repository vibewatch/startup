            body: >-
              最有用的公开可比公司分成两组。软件溢价端，Palantir 和 CrowdStrike 的 EV/Sales 分别约为 50.59x 和 32.90x，说明公开市场愿意为有规模、
              有披露且投资人信心深厚的战略软件平台支付什么价格。政府科技和服务端，Booz Allen 与 Leidos 的 EV/Sales 约为 0.97x 和 1.13x，说明收入一旦服务占比高或绑定采购，
              倍数会多快塌陷。Defense Unicorns 几乎肯定落在两端之间，但具体落点取决于尚未公开的证据。私营防务科技可比案例显示，战略紧迫性与制造叙事对齐时， 市场可以多慷慨：Saronic 以 $9.25
              billion 估值融资 $1.75 billion，并披露一份 $392 million 海军合同；Epirus 融资 $250 million 扩大生产；Shield AI 此前已累计获得 $500
              million Series F 资本。与此同时，2026 年研究更不宽容。S&P 报告防务科技融资创新高但 M&A 放缓，McKinsey 称颠覆者估值仍跑在义务金额前面，PitchBook
              警告部分品类过热，ION 显示网络安全倍数正在重置。这组信号支持对 Defense Unicorns 给出“偏紧但不荒唐”的判断。
            claimRefs:
