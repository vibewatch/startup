  - id: TP001
    title: 竞争者与替代方案画像表
    columns:
      - 竞争者
      - 类别
      - 目标细分
      - 差异化
      - 部署模式
      - 局限
    rows:
      - - Defense Unicorns
        - 直接安全软件交付平台
        - 需要可移植、断连交付的国防项目
        - 原生支持隔离网络的平台，集成合规证据，并具备开源可移植性
        - 跨云、本地和战术边缘的可移植平台
        - 公开材料未披露标准定价或广泛装机基础数量
      - - Platform One Big Bang 基线
        - 内部 / 政府基线
        - 围绕 DoD 自有 Kubernetes 交付模式标准化的项目
        - 政府自有加固软件包基线，与 DoD DevSecOps Reference Architecture 对齐
        - 通过 GitOps 把已获批加固软件包交付到 Kubernetes
        - 技术栈较有主张、可能偏重；本身并不等于应用专项认证
      - - Iron Bank
        - 内部 / 政府供应渠道替代
        - 优先考虑已批准容器和软件来源证明的项目
        - 面向任务关键软件的 DoD 控制软件供应渠道
        - 更像代码库和供应链渠道，不是完整工厂工作流
        - 单独看，并不是完整 CI/CD、证据和运行运维平台
      - - Leidos
        - 主承包集成商软件工厂
        - 希望在主承包项目内获得敏捷交付的联邦客户
        - 对外宣传安全、任务级软件工厂，并提供机密 / 非机密 2F 运营
        - 运营型软件工厂和 DevSecOps 服务
        - 更偏服务驱动，不像可移植自助产品
      - - SAIC
        - 主承包集成商托管环境
        - 已在 Cloud One 或任务集成合同内的项目
        - 托管多云交付和任务应用运营
        - 以托管服务形式提供 AWS、Azure 和 OCI 安全政府云
        - 公开材料强调运营，而不是产品化可移植栈
      - - Booz Allen
        - 主承包集成商 DevSecOps 平台
        - 围绕 Booz 主导企业级 DevSecOps 标准化的机构
        - 企业级 DevSecOps，配套模板化 Jenkins 交付和多云认证支持
        - 产品化交付平台，外包在咨询与集成服务中
        - 原生隔离网络可移植性的证据少于 Defense Unicorns
      - - BAE Systems + UDS
        - 主承包渠道路径 / 市场方案
        - 通过 Platform One 可授标渠道采购的买方
        - 在 P1 Solutions Marketplace 上具备可授标状态，UDS 被整合进 BAE 交付动作
        - 由主承包商主导的安全软件交付，经类市场采购路径落地
        - 渠道优势可能更多归于主承包关系，而非底层平台品牌
      - - Anchore
        - 容器与合规专家
        - 在联邦环境中需要 SBOM、扫描和策略执行的团队
        - 面向 DoD 的策略包、隔离网络支持、IL-6 / FIPS 表述，以及与 DoD 加固指南的相关性
        - 本地部署或集成进流水线的安全工具
        - 在已抓取材料中，不能替代完整项目级软件工厂运营模型
      - - Aqua Security
        - 从代码到云的容器安全平台
        - 优先考虑扫描、CNAPP 和合规覆盖面的组织
        - 从代码到云的安全、流水线控制、SBOM 功能和联邦合规姿态
        - 横跨 SDLC 和云集成的安全平台
        - 更像安全平台，不像懂采购的软件交付工厂
      - - GitLab
        - 商业全栈替代方案
        - 希望用一个集成 DevSecOps 平台、且可选云或离线部署的政府团队
        - FedRAMP Moderate 单租户政府方案，加上有文档支持的离线自托管安装
        - 托管政府云或离线自托管部署
        - 围绕 ATO 证据和战术边缘物流的公开叙事，不如 Defense Unicorns 有针对性
      - - Palantir Apollo
        - 相邻部署 / 车队管理平台
        - 需要跨安全域编排软件的项目
        - 在 IL5 / IL6 环境中支持连接 / 断连部署和具备合规意识的变更控制
        - 跨隔离网络和联网资产的中央软件编排
        - 已抓取材料把 Apollo 定位为车队管理，而不是交钥匙软件工厂
      - - 开源 DIY（Argo CD + Flux + Kyverno）
        - DIY 替代方案
        - 能力很强、愿意自行组装技术栈的平台团队
        - 具备可审计性和灵活性的最佳 GitOps 与策略原语组合
        - 自行组装的 Kubernetes 原生栈
        - 项目文档中没有打包采购渠道、认证证据工作流或托管支持路径
    notes: 画像比较的是买方如何完成同一项安全软件交付任务；若定价或装机基础数据未公开，单元格按姿态标注，而不是用无依据收入主张填充。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the major government-owned, prime-led, modular, and adjacent alternatives surfaced in fetched
