companyProfile:
  summary: Defense Unicorns is a San Antonio-based, veteran-founded defense software platform company founded in March 2021 by Rob Slaughter, Jeff McCoy, and Andrew Greene. Its core offer is UDS, an airgap-native software delivery platform that packages applications once and moves them across cloud, on-premises, classified, and tactical-edge environments, complemented by products such as UDS Army, UDS Registry, and UDS Fleet. Public customer proof is unusually strong for a private defense software company, including named Navy, Army, and Air Force references plus partner channels through BAE Systems and SAIC. The company raised a $136 million Bain-led Series B in January 2026 at a valuation above $1 billion after a disclosed $35 million Series A, but public evidence still does not disclose the revenue, margin, retention, or governance detail needed to translate traction into a clean underwriting case.
  foundedDate: '2021-03-01'
  founders:
    - name: Rob Slaughter
      role: Co-founder and CEO
      background: Former U.S. Air Force officer and Platform One leader with a Ph.D. in Engineering Physics; his defense software-factory background is central to the company strategy.
      claimRefs:
        - CO009
    - name: Jeff McCoy
      role: Co-founder and CTO
      background: Former Air Force and senior civilian technical leader with more than 18 years of experience before taking technical leadership at Defense Unicorns.
      claimRefs:
        - CO010
    - name: Andrew Greene
      role: Co-founder
      background: Defense and national-security engineer whose prior work aligns the company closely with mission-user needs.
      claimRefs:
        - CO011
  foundingLocation: San Antonio, Texas, USA
  headquarters: San Antonio, Texas, USA
  productSummary: UDS is a secure, portable, airgap-native platform that packages applications and dependencies into artifacts that can be deployed across cloud, on-premises, and disconnected environments. The broader product family includes UDS Enterprise for platform and cybersecurity teams, UDS Fleet for DDIL/tactical-edge operations, UDS Registry for signed artifact distribution and compliance metadata, and Army-specific authorization acceleration paths.
  customerFocus: U.S. national-security buyers that need compliant software delivery in regulated or disconnected environments, including Navy, Army, Air Force, and Space Force mission programs, plus defense primes and integrators embedding UDS into broader delivery stacks.
  businessModel: Hybrid open-core model with free open-source adoption at the top of funnel and monetization through firm-fixed-price per-environment or per-system UDS subscriptions, attached support, training, and forward-deployed services, plus government contract-vehicle and prototype-derived program work.
  stage: Series B
  fundingStatus: Publicly disclosed financing totals at least about $171.5 million, including a roughly $35 million Series A in 2024 and a $136 million Bain-led Series B in January 2026 that valued the company above $1 billion.
