- id: budget-and-sizing-lenses
  title: 'Sizing lenses: budget anchors, installed base, and derived SAM'
  body: 'No official source publishes a clean “defense air-gapped software delivery” TAM, so the market must be sized through multiple evidence-backed lenses rather than one analyst headline. The broadest anchor is the FY2026 DoD IT and cyberspace budget request: $66.1 billion, including $51.8 billion of IT and $14.3 billion of cyber, spread across 3,271 investments. The wider DoD FY2026 request is $961.6 billion, but only a subset of that budget can ever flow to software-delivery infrastructure. A second lens is installed-base demand: the March 2025 State of DevSecOps says DoD already has more than 50 software factories delivering code into production, while DSOP advertises over 100 standardized tool and service options. A third lens is compliance-driven adjacent demand: FedRAMP lists 527 certified services and 28 FedRAMP 20x certified services, while FedRAMP 20x is still formalizing 2026 rules and submission processes. These signals support a derived U.S. SAM in the low-single-digit billions,
    not tens of billions. Using a deliberately conservative assumption that roughly 2% to 5% of FY2026 IT/cyber spending touches software factories, compliance automation, hardened artifact management, and disconnected deployment tooling yields an indicative SAM of about $1.3 billion to $3.3 billion annually. That is an estimate, not a reported market total, and it should be treated as a constrained spending band rather than a precise revenue pool.'
