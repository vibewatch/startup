- id: constraints-and-diligence-gaps
  title: Adoption barriers, contradictory signals, and diligence gaps
  body: 'The main barrier is not whether the Pentagon wants modern software delivery; it is whether programs can absorb the organizational and compliance change fast enough. GAO found in 2023 that DOD had at least partially implemented all 17 major software-modernization recommendations but still had unfinished actions on 13 of them, including workforce and implementation-planning gaps. The March 2025 State of DevSecOps similarly celebrates progress while documenting the need to scale beyond isolated pockets of excellence. Budget timing is another real friction point: GAO’s January 2026 report says DOD has operated under continuing resolutions in all but 12 of the last 49 fiscal years, and about half of the 74 acquisition programs it surveyed reported schedule effects from CRs. Those timing disruptions matter because a vendor can have product-market fit yet still face award delays, deferred deployment, and elongated revenue cycles. There is also a material measurement problem. Public sources
    do not disclose the count of classified or air-gapped deployments, the average time from software selection to inherited ATO on mission networks, or the exact fraction of IT/cyber budgets reserved for software-delivery platforms. As a result, any venture-style TAM claim that jumps directly from the full DoD budget or even the full IT/cyber budget to a huge software-delivery opportunity would overstate how fast this market can be monetized. The better conclusion is that the category is strategically important and procurement-backed, but adoption remains bottlenecked by accreditation labor, fragmented funding, workforce scarcity, and opaque classified demand.'
