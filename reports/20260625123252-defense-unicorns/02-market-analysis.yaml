  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: classified-demand-visibility
    missingEvidence: Program-level counts of classified or air-gapped deployments and related annual spend by service or defense-wide owner.
    whyItMatters: Without deployment counts and spend by owner, SAM and SOM remain derived proxies instead of auditable bottoms-up market totals.
    diligencePath: Request cleared customer references, deployment counts, and category spend breakdowns during management diligence.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: authorization-cycle-time
    missingEvidence: Average elapsed time from tool selection to inherited ATO or operational deployment on mission networks.
    whyItMatters: Category value depends heavily on whether software-delivery tooling materially shortens authorization timelines versus incumbent approaches.
    diligencePath: Ask for program case studies with before-and-after authorization timelines and inherited-control reuse metrics.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: factory-standardization
    missingEvidence: A public cross-service inventory showing tool-chain commonality and budget ownership across the 50+ software factories.
    whyItMatters: Standardization level affects whether vendors can scale one product broadly or must sell custom integrations factory by factory.
    diligencePath: Collect service-level factory maps, platform standards, and contract vehicle usage in customer interviews.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: budget-lens-normalization
    missingEvidence: A single official table that reconciles discretionary DoD, national-defense discretionary, and total-request figures for software-market analysts.
    whyItMatters: Different budget lenses are easy to misread as contradictory and can distort top-down market narratives.
    diligencePath: Use management diligence to standardize one budget lens for investor materials and explicitly footnote the others.
    relatedQuestionRefs:
    - QM004
