- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver/Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - FY25-26 Software Modernization tasks
    - Driver
    - Near-term
    - Creates policy demand for cATO, APIs, software-factory scale, SaaS ATO, and edge cloud use
    - Which tasks have funded implementation owners versus policy intent only?
  - - Software Fast Track initiative
    - Driver
    - Near-term
    - Pushes verification, SCRM, and authorization reform into acquisition flow
    - How much of SWFT becomes mandatory for third-party vendors by FY27?
  - - FedRAMP 20x transition
    - Driver
    - 2026-2027
    - Rewards evidence-heavy automation and lighter-weight continuous assurance
    - Will moderate-class automation patterns become acceptable to defense enclaves?
  - - CMMC phase-in
    - Driver
    - 2025-2028
    - Expands compliance pressure across the contractor base and favors vendors with evidence automation
    - How quickly do primes push CMMC evidence requirements into software subcontractors?
  - - Tactical-edge demand
    - Driver
    - Current
    - Raises value of package-once deploy-anywhere workflows that survive D-DIL conditions
    - Which programs have budget today for disconnected software delivery versus future aspiration?
  - - Software factory installed base
    - Driver
    - Current
    - Creates many adoption nodes but also many local tool decisions
    - How standardized are tool chains across the 50+ factories?
  - - Workforce and implementation gaps
    - Constraint
    - Current
    - Slows scale because teams still lack software workforce depth and execution discipline
    - 'Where are the hardest shortage roles: AOs, platform SREs, security engineers, or product owners?'
  - - Continuing resolutions
    - Constraint
    - Recurring
    - Delays awards and deployment timing even where demand exists
    - What share of pipeline is exposed to annual appropriations disruption?
  - - Fragmented budget ownership
    - Constraint
    - Persistent
    - Forces vendor sales into many small opportunities instead of one category manager
    - Which service or defense-wide accounts consistently fund reusable delivery platforms?
  - - Opaque classified demand
    - Constraint
    - Persistent
    - Prevents clean bottoms-up sizing and hides conversion rates from pilot to deployment
    - Request deployment counts, inherited-ATO metrics, and budget mix under NDA or cleared diligence
  notes: Most category risk sits in deployment friction and budget timing, not in a lack of strategic demand for secure and portable software delivery.
