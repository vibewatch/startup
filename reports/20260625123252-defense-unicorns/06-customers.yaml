  evidenceGaps:
  - type: missing-source
    severity: material
    topic: renewal visibility
    missingEvidence: Named option periods, renewal cadence, and exercised follow-on awards for the Navy, Army, and Air Force programs referenced here.
    whyItMatters: Without renewal data, public customer proof cannot be converted into a strong recurring-revenue or stickiness conclusion.
    diligencePath: Request contract numbers, periods of performance, exercised options, and recompete calendars for CANES, UDS Army, F-22, and related Phase III awards.
    relatedQuestionRefs:
    - QU013
  - type: private-evidence-only
    severity: material
    topic: top customer concentration
    missingEvidence: Revenue share of the top customer and top three customers, ideally split by direct government sales versus partner-channel sales.
    whyItMatters: Customer concentration is central to underwriting durability and budget sensitivity, but public award data is not a substitute for revenue mix.
    diligencePath: Request management customer concentration schedules and reconcile them to USAspending-visible awards and channel pipeline data.
    relatedQuestionRefs:
    - QU020
  - type: missing-source
    severity: minor
    topic: intelligence community customer attribution
    missingEvidence: A named public source tying Defense Unicorns to an identifiable intelligence-community customer or confirming that such proof cannot be made public.
    whyItMatters: IC demand could diversify the customer base, but without attribution it cannot be treated as verified customer proof.
    diligencePath: Request a sanitized customer list or customer-reference process under NDA covering IC and other classified accounts.
    relatedQuestionRefs:
    - QU022
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof coverage
    missingEvidence: A fuller roster of named programs or customers by branch, including contract identifiers, deployment maturity, and user counts.
    whyItMatters: The named-customer-proof table is intentionally partial because many cited mission systems and branch claims are not publicly attributable to specific operating units.
    diligencePath: Ask management for a branch-by-branch customer ledger under NDA and map each item to direct, channel, pilot, or production status.
    relatedQuestionRefs:
    - QU001
    - QU006
    - QU026
    relatedTableRefs:
    - TU003
