tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Current public proof
  - Strategic value
  - Main gap
  rows:
  - - U.S. Navy fleet and submarine programs
    - Buyer/payer = Navy program offices; user = sailors, ship crews, submarine sustainment teams
    - Afloat network modernization, submarine sustainment, shipboard software updates
    - Named CANES contract, Navy-published submarine success story, ship-prototype testing story
    - Best public proof of production-oriented demand and long-duration mission fit
    - Public sources do not disclose contract value, renewal terms, or fleetwide deployment counts
  - - U.S. Army software-distribution ecosystem
    - Buyer/payer = Army program managers; user = soldiers and mission-system owners; gatekeeper = DEVCOM C5ISR and AOs
    - IL4/IL5 app distribution, compliance inheritance, tactical-edge software delivery
    - Named DEVCOM C5ISR collaboration plus six-vendor onboarding cohort
    - Creates a repeatable Army marketplace route instead of one-off bespoke integrations
    - Public proof is stronger on procurement design than on attributed deployed Army end programs
  - - U.S. Air Force mission-system owners
    - Buyer/payer = Air Force mission owners; user = pilots, maintainers, software teams
    - Open-mission-system software update delivery for combat aircraft
    - Named F-22 demonstration with Air Force Sustainment Center Software Directorate
    - Shows value in high-switching-cost airborne mission systems
    - Demonstration outcome is public; fleetwide fielding timeline and contract economics are not
  - - Space Force and strategic-deterrence-adjacent programs
    - Buyer/payer = national-security program offices; user = launch-range and deterrence operators
    - Launch-range modernization and secure software delivery in sensitive environments
    - Company-claimed $15M Space Force contract and partner references to strategic deterrence programs
    - Suggests expansion into highly sensitive mission sets
    - Named Space Force program identifiers and customer testimonials are not retained publicly
  - - Prime and integrator channels
    - Buyer = primes/integrators; user = their defense-program delivery teams; payer = government program through prime contract
    - Embed UDS into broader DevSecOps and mission-integration offerings
    - Named BAE Platform One route and SAIC integration partnership
    - Important scale path into larger programs without direct standalone DU prime awards
    - Channel economics, revenue share, and conversion into recurring end-program spend are undisclosed
  - - Federal-adjacent agencies and software vendors
    - Buyer = DHS/CISA or agency contracting offices; user = mission owners and approved vendors
    - Low-friction procurement and app-marketplace distribution
    - Contract-vehicle page cites DHS/CISA eligibility; UDS Army cohort shows software vendors onboarding
    - Broadens top-of-funnel beyond a single branch and helps ecosystem growth
    - No named DHS/CISA deployment in retained sources; vendors are not equivalent to paying Army end customers
  notes: Segmentation separates direct military end customers from partner channels and vendor-ecosystem participants. Public proof is strongest where a named government program and concrete deployment outcome coexist.
