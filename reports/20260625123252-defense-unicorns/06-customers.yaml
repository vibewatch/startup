- id: expansion-and-concentration-risk
  title: Expansion and Concentration Risk
  body: The expansion story is credible, but the concentration story remains the gating risk. Expansion vectors are visible across Navy fleet modernization, Army marketplace-style distribution, Air Force mission-system updates, and prime-led channels through BAE and SAIC. Defense Unicorns also markets federal-adjacent access through DHS and CISA vehicles, suggesting a path beyond core DoD branches. Even so, the attributable customer base remains overwhelmingly U.S. government national-security demand. USAspending shows visible federal award concentration in GSA and DoD flows, with Air Force appearing far larger than Army in the displayed sub-agency mix, and no retained source identifies a civilian commercial customer book. That matters because budget timing is not neutral for this company. DoD oversight and GAO-covered reporting show that continuing resolutions delay awards, restrict new starts, increase costs, and force repeated budget replanning. For a vendor that emphasizes software modernization,
    prototype transition, and rapid fielding, those procurement frictions translate directly into customer-timing risk even when mission demand is real.
