- id: named-deployment-proof-by-branch
  title: Named Deployment Proof by Branch
  body: 'The strongest public customer proof is attributable and branch-specific, but it is not evenly distributed. Navy proof is the deepest: Defense Unicorns announced a CANES Next Generation contract in October 2025, described CANES as the Navy’s program of record for afloat network infrastructure, and a Navy success-story PDF tied Zarf/UDS to Project Blue, Columbia-class submarine sustainment, and Ohio-class upgrades. Army proof is real but more ecosystem-oriented. DEVCOM C5ISR is a named collaborator, UDS Army promises IL4/IL5 pre-authorized environments and an Army App Marketplace, and the first public cohort lists six onboarded vendors; however, those vendors are ecosystem participants rather than proof of Army-wide deployed end use. Air Force proof is narrower but highly attributable: the Air Force Sustainment Center Software Directorate publicly demonstrated F-22 software installation in minutes. Separate from direct branch customers, BAE Systems and SAIC provide attributable partner-channel
    proof through Platform One and mission-integration pathways that can carry UDS into larger defense programs.'
