company:
  name: Defense Unicorns
chapter:
  number: 6
  title: Customers
  summary: 'Defense Unicorns has unusually strong attributable customer proof for a private defense-software company: named Navy, Army, and Air Force programs, a Navy-published submarine success story, and attributable channel partnerships with BAE Systems and SAIC. The evidence still supports a concentrated conclusion rather than a broad one: public proof is overwhelmingly U.S. national-security demand, partner-led procurement channels matter materially, and retention economics remain mostly unreported, leaving budget-timing and customer-concentration risk as the main customer-side concerns.'
sections:
- id: buyer-segments-and-procurement-surface
  title: Buyer Segments and Procurement Surface
  body: 'Defense Unicorns sells into a defense-software buying system where the buyer, user, payer, and deployment gatekeeper are often different people. The clearest end-customer segments are Navy program offices and ship/submarine operators, Army program managers and soldiers reached through DEVCOM C5ISR’s UDS Army construct, and Air Force mission-system owners such as the F-22 software enterprise. A second layer is prime and integrator channels: BAE Systems and SAIC are not end users of military software outcomes, but they are important route-to-program partners because they embed UDS into broader government offerings. A third layer is the software-vendor ecosystem that UDS Army tries to aggregate for Army buyers through an app-marketplace model. Procurement path matters almost as much as technical adoption. Defense Unicorns explicitly markets SBIR Phase III, GSA IDIQ, Tradewinds, P1, SeaPort NxG, AWS Marketplace, and direct-award playbooks because the company’s customers operate under
    acquisition constraints that reward low-friction, pre-cleared paths more than generic enterprise-SaaS purchasing.'
