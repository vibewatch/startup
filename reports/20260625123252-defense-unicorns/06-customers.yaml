- id: TU003
  title: Named customer proof table
  columns:
  - Customer / channel
  - Segment
  - Deployment / use case
  - Production vs. pilot
  - Outcome or signal
  - Limitation
  rows:
  - - U.S. Navy fleet modernization programs
    - Direct government customer
    - CANES Next Generation plus shipboard software-prototype testing
    - 'Mixed: named contract plus prototype testing'
    - Attributable Navy demand across afloat infrastructure and ship experimentation
    - Public sources do not disclose contract dollars, ship counts, or renewal status
  - - U.S. Navy submarine sustainment (Project Blue / SUBMEPP context)
    - Direct government customer
    - Air-gapped software delivery for Columbia-class sustainment and Ohio-class upgrades
    - Production-oriented sustainment use
    - Navy success-story PDF ties Zarf/UDS to submarine maintenance workflows and long-life platforms
    - Specific contract vehicles, annual spend, and user counts are undisclosed
  - - U.S. Army DEVCOM C5ISR / UDS Army
    - Direct government customer + marketplace sponsor
    - Pre-authorized IL4/IL5 software-delivery environment and Army App Marketplace
    - Operational procurement pathway, not yet fully enumerated end deployments
    - Named Army collaborator and first onboarding cohort of six vendors
    - Public proof is stronger on enablement than on disclosed Army program deployments
  - - Air Force Sustainment Center Software Directorate (F-22)
    - Direct government customer
    - Continuous software delivery to F-22 open mission-system compute enclave
    - Demonstrated operational capability
    - Software installed/upgraded in minutes; future path for pilots and maintainers
    - No disclosed fleetwide rollout schedule or contract economics
  - - BAE Systems via Platform One Solutions Marketplace
    - Prime/channel partner
    - Readily awardable DevSecOps offering built on UDS for government buyers
    - Procurement-channel proof
    - P1 awardable status and real-world use case accessible to government customers
    - Proof is channel access, not a named operational end-program by itself
  - - SAIC mission-integration ecosystem
    - Prime/channel partner
    - UDS embedded in SAIC software-delivery environment across cloud, on-prem, and tactical edge
    - Procurement-channel and deployment-enablement proof
    - SAIC says timelines fall from months to weeks/days and model can scale across programs
    - Public sources do not enumerate the end programs adopting through SAIC
  notes: Rows are ordered by attributable proof quality, not revenue importance. Direct end-customer rows are stronger than channel rows, but partner-channel proof still matters because it affects how government customers can actually buy and deploy the platform.
  enumerationScope:
