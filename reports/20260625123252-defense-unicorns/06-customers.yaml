- id: evidence-quality-and-repeat-use-proxies
  title: Evidence Quality and Repeat-Use Proxies
  body: 'Evidence quality is better than logo-level marketing but still uneven. Navy and Air Force proofs include named programs and concrete operational outcomes, which makes them materially stronger than vague branch lists. Army proof shows real procurement design and named onboarding activity, but not the same level of attributable fielded-program disclosure. The broadest scale claims remain company-claimed: UDS Fleet says Defense Unicorns software is deployed across more than 80 mission systems and organizations, that the company has a $300 million DoD-wide contract ceiling, and that it holds a $15 million Space Force contract. Those claims are directionally important but weaker than the named Navy and Air Force proofs because the underlying mission-system roster, contract identifiers, and renewal history are not published in retained sources. There is also no public cohort-style retention dataset. No retained source discloses NRR, GRR, churn, or satisfaction scores, so durability has
    to be inferred from long-lived mission environments, compliance inheritance, and the friction of replacing software once it is embedded in air-gapped or regulated operational systems.'
