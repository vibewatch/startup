- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Factor
  - Type
  - Description
  - Impact
  - Diligence path
  rows:
  - - Federal customer concentration
    - Concentration risk
    - Attributable proof is overwhelmingly U.S. government defense demand; no named civilian commercial customer book is public
    - High
    - Request customer mix by branch, agency, direct sale, channel sale, and commercial revenue
  - - Air Force-heavy visible sub-agency mix
    - Concentration risk
    - USAspending profile displays Air Force far above Army among named sub-agencies
    - Medium-high
    - Reconcile USAspending with management customer revenue mix and backlog
  - - Continuing-resolution and new-start constraints
    - Adverse procurement risk
    - CRs delay awards, restrict new starts, and create budget replanning burdens across DoD acquisition
    - High
    - Map revenue sensitivity to slips in new awards, OTAs, and option exercises
  - - Prime/channel dependence
    - Channel risk
    - BAE and SAIC expand reach but may intermediate economics and customer ownership
    - Medium
    - Request channel pipeline, partner-sourced ARR/bookings, and renewal control
  - - Low-friction vehicle advantage
    - Expansion driver
    - SBIR Phase III, GSA, Tradewinds, P1, SeaPort, and AWS can shorten path to award
    - Positive
    - Quantify conversion rates by contract vehicle and average sales-cycle reduction
  - - Army marketplace expansion
    - Expansion driver
    - UDS Army can turn one platform into multiple vendor and program relationships
    - Positive but early
    - Request active vendor count, program-manager usage, and paid conversions
  - - Evidence-quality gap on mission-system count
    - Verification risk
    - 80+ mission systems and $15M Space Force claim remain company-led with limited public attribution
    - Material
    - Provide named program list under NDA and contract identifiers for major branch claims
  notes: Impact reflects customer-revenue durability, not product quality. Concentration and timing risk dominate because public customer proof is strong but still tightly tied to federal acquisition cycles.
