      - number: '7.3'
        title: Open-source, cybersecurity, and supply-chain burden
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns’ product strength and its operational risk come from the same place: an open-source-heavy
              stack purpose-built for disconnected environments. Zarf is explicitly free and open source, UDS says it is
              built on open-source foundations, and the platform claims to own networking, identity, logging,
              monitoring, runtime security, and compliance inside the runtime itself. That breadth can be a moat if
              executed well because it gives buyers a compact story for air-gapped delivery, but it also raises the
              blast radius of any upgrade mistake, supply-chain visibility gap, or hardening failure. DoD’s own
              secure-software memo says open-source code origin visibility remains inadequate, and the container
              hardening guide shows how much scanning, STIG alignment, Iron Bank workflow, and evidence production the
              department expects before software is treated as trusted.  The external Big Bang critique is useful here
              not because it proves a problem at Defense Unicorns today, but because it names a failure mode for this
              entire design philosophy: a bundled platform can become monolithic, hard to upgrade, and strong on
              compliance theater while weak on operator understanding. If Defense Unicorns cannot keep its open-source
              foundations current, scan them rigorously, and show that bundle complexity is producing customer value
              rather than hidden debt, the same architecture that wins early credibility can later become a source of
              cyber, reliability, and renewal risk.
