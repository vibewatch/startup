chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and product scope
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns is a San Antonio-based, veteran-founded defense software company built around the
              proposition that mission systems need modern software delivery even when they operate disconnected from
              the public internet. The company pitches UDS as an airgap-native platform rather than a generic DevSecOps
              toolkit: package once, deploy across cloud, on-premises, and tactical edge environments, and carry the
              compliance and software-supply-chain evidence needed for mission use. The reviewed material repeatedly
              emphasizes portability, vendor-lock avoidance, and the ability to move software from satellites to
              submarines. That identity is important because Defense Unicorns is not positioning itself as a pure
              consulting shop or a narrow tool vendor; it is trying to become infrastructure for software sustainment
              across defense programs. Zarf remains an important proof point in that story because it shows the
              company’s roots in open-source packaging for disconnected environments, while newer products such as UDS
              Army, UDS Registry, and UDS Fleet show a move from single-tool credibility to a full platform suite.
