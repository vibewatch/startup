      - number: '1.2'
        title: Founders, leadership, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns’ strongest identity asset is founder-market fit. Rob Slaughter, Jeff McCoy, and Andrew
              Greene did not approach defense software as outsiders; the company’s own history ties them to Kessel Run,
              Space CAMP, Platform One, and Big Bang, and DefenseScoop coverage reinforces that Slaughter’s transition
              from DoD software factories to startup founder is a central part of the public narrative. That background
              supports credibility with military buyers, but it also concentrates strategic and reputational weight in a
              small group of founder-operators. Slaughter is clearly the public face and chief evangelist, McCoy anchors
              technical credibility, and Greene is presented as the continuing product-and-mission engineer. What is
              missing from public sources is formal governance detail: reviewed materials do not disclose a fuller board
              roster, voting rights, or investor control provisions. That means diligence should treat founder quality
              as a strength while still testing succession, decision rights, and whether the company’s platform strategy
              depends too heavily on a narrow set of operators.
