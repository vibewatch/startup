  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer Segments and Procurement Surface
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns sells into a defense-software buying system where the buyer, user, payer, and deployment
              gatekeeper are often different people. The clearest end-customer segments are Navy program offices and
              ship/submarine operators, Army program managers and soldiers reached through DEVCOM C5ISR’s UDS Army
              construct, and Air Force mission-system owners such as the F-22 software enterprise. A second layer is
              prime and integrator channels: BAE Systems and SAIC are not end users of military software outcomes, but
              they are important route-to-program partners because they embed UDS into broader government offerings. A
              third layer is the software-vendor ecosystem that UDS Army tries to aggregate for Army buyers through an
