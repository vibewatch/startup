        title: Valuation anchor and recommendation
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns crossed the unicorn threshold on 2026-01-13 when it announced a $136 million Series B led
              by Bain Capital at a valuation above $1 billion. That round is not a rumor or secondary mark; it is the
              only disclosed primary valuation anchor in the current public record, and it arrived alongside management
              claims of rapid and profitable growth plus 300% year-over-year adoption growth in military systems. Those
              are meaningful positives for a defense software company, especially one founded only in 2021. Public
              evidence also shows product breadth beyond a single tool: UDS, UDS Registry, UDS Army, the later Airgap
              App Store launch, and an April 2026 UDS Fleet announcement that tied the platform to more than 80 mission
              systems and organizations and a $300 million DoD-wide contract vehicle. The problem is not lack of a
              narrative; it is lack of financial disclosure. No public source reviewed for this chapter provides ARR,
              gross margin, retention, backlog quality, or Series B preference terms. On that basis the investment call
              is research-more, confidence is medium, risk is high, and the valuation stance is stretched rather than
              attractive.
