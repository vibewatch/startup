      - number: '4.2'
        title: Public contract values and customer-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public revenue-quality evidence comes from federal award records rather than from any
              disclosed ARR metric. Defense Unicorns publicly advertises SBIR Phase III, SeaPort NxG, Tradewinds, and P1
              routes, and USAspending records show those routes translate into real eight-figure obligations. The
              fetched award endpoints include a $65.0 million GSA delivery order tied to air-gap software delivery SBIR
              Phase III work, a $12.7 million DoD delivery order to support an Air Force cyber architecture platform,
              and a $9.9 million SBIR sequential Phase II contract. Together, those three visible awards total $87.6
              million. That does not mean $87.6 million of recurring software revenue, because the same sources show a
              mix of prototype-derived SBIR work, delivery-order support, and platform services. Still, it does
              establish that Defense Unicorns is landing economically material government engagements rather than only
              pilots. The size band also suggests that customer economics likely hinge on program-level contracts and
              environment expansion, not on low-ticket self-serve adoption. The caveat is equally important: public
              award records do not disclose how much of each obligation is software subscription, implementation labor,
              training, or R&D support, so the award stack is a scale signal rather than a margin-quality answer.
