      - number: '7.2'
        title: Regulatory, accreditation, and legal execution risk
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster is compliance execution. Defense Unicorns sells into programs where secure
              delivery is not just a feature but part of the procurement boundary, which makes accreditation and
              representation risk economically material. DoD’s secure-software memo says outdated authorization
              processes still frustrate agile delivery and that open-source visibility gaps remain a real
              software-assurance problem. CMMC’s contractual phase-in then adds a hardening compliance ratchet. The
              final DFARS rule is already effective, and the official CMMC documentation says the current phase
              emphasizes Level 1 and Level 2 self-assessments through November 9, 2026. That is not a comfort blanket;
              it is a runway before stronger third-party and contract-enforced expectations spread more deeply through
              the industrial base.  The legal downside is equally concrete. DOJ’s 2026 LOGZONE settlement shows cyber
              misrepresentation is no longer a theoretical False Claims Act issue. FedRAMP pressure also matters even if
              Defense Unicorns ultimately lands many programs in disconnected or customer-hosted environments:
              public-sector buyers already see accredited alternatives in the market, and cloud-delivered modules
              touching CUI will be judged against that backdrop. The diligence question is not whether the company
              understands compliance rhetoric; it is whether every marketed deployment path can clear the accreditation,
              representation, and evidence burden without creating a future award block or claims exposure.
            claimRefs:
