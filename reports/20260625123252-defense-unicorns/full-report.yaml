  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns is not a pure open-source vendor and not a conventional seat-priced SaaS business. The
              public record shows an open-core structure in which UDS Base remains free under AGPL-3.0 while UDS
              Enterprise and UDS Fleet are monetized as firm-fixed-price licenses sold per unique environment, with the
              environment definition itself tied to infrastructure, Kubernetes distribution, classification level, and
              geography. That metering scheme matters because it points to account economics that scale with mission
              environments rather than simple user counts. Public pricing still stops short of a rate card: the company
              requires mission-specific contact for pricing and moves commercial terms into Order Forms rather than
              public tables. The same materials show support and services are economically material. Paid plans include
              general support with 24/7 response for critical issues, and the company separately markets
              Mission-as-a-Service, site-reliability support, and forward-deployed engineering. Product terms reinforce
              that fees are based on purchased quantities, not actual usage, and that software, support, training, and
              other services can all sit inside the same commercial paperwork. The most defensible financial read is
              therefore a hybrid model: free open-source adoption at the top of funnel, then paid environment licenses,
              then services and support attachments that can lift contract value but also create labor intensity and
              margin dispersion.
