      - number: '2.5'
        title: Adoption barriers, contradictory signals, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main barrier is not whether the Pentagon wants modern software delivery; it is whether programs can
              absorb the organizational and compliance change fast enough. GAO found in 2023 that DOD had at least
              partially implemented all 17 major software-modernization recommendations but still had unfinished actions
              on 13 of them, including workforce and implementation-planning gaps. The March 2025 State of DevSecOps
              similarly celebrates progress while documenting the need to scale beyond isolated pockets of excellence.
              Budget timing is another real friction point: GAO’s January 2026 report says DOD has operated under
              continuing resolutions in all but 12 of the last 49 fiscal years, and about half of the 74 acquisition
              programs it surveyed reported schedule effects from CRs. Those timing disruptions matter because a vendor
              can have product-market fit yet still face award delays, deferred deployment, and elongated revenue
              cycles. There is also a material measurement problem. Public sources do not disclose the count of
              classified or air-gapped deployments, the average time from software selection to inherited ATO on mission
              networks, or the exact fraction of IT/cyber budgets reserved for software-delivery platforms. As a result,
              any venture-style TAM claim that jumps directly from the full DoD budget or even the full IT/cyber budget
              to a huge software-delivery opportunity would overstate how fast this market can be monetized. The better
              conclusion is that the category is strategically important and procurement-backed, but adoption remains
              bottlenecked by accreditation labor, fragmented funding, workforce scarcity, and opaque classified demand.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM041
              - CM042
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: the real alternatives are government baselines, service-led primes, and modular substitutes'
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns is selling a secure software-delivery outcome, not merely a scanner or a Kubernetes tool.
              The most direct alternatives therefore are the ways a defense buyer can already get mission software from
              source to accredited runtime: a government-owned baseline such as Platform One Big Bang plus Iron Bank, a
              prime-integrator-run environment operated under an existing task order, or a modular commercial stack
              assembled from GitLab, container-security vendors, and open-source GitOps tools. Defense Unicorns’ own
              materials stress airgap-native delivery, portability, and compliance evidence, while Platform One
              documents emphasize hardened approved packages and the DoD DevSecOps Reference Architecture. That means
              the buying decision is usually about who owns the baseline and authorization path, not about who has the
              fanciest single feature. Big Bang and Iron Bank matter because they define a government-owned standard
              with distribution and hardening already recognized inside DoD. GitLab matters because it combines
              integrated DevSecOps with a government-specific cloud tenancy and documented offline deployment.
              Open-source tools such as Argo CD, Flux, and Kyverno matter because sophisticated teams can build around
              them, but those projects do not themselves bring an authorization narrative, managed channel, or
              contracting path.
