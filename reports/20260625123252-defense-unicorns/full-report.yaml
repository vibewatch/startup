      - number: '2.3'
        title: Buyer, user, payer, and procurement path
        blocks:
          - type: paragraph
            body: >-
              The buyer stack for this category is structurally fragmented. Users are software factory operators,
              DevSecOps engineers, platform teams, and mission application teams that need to ship code into classified
              or disconnected networks. Buyers are acquisition professionals, platform offices, service CIO and PEO
              organizations, and edge-modernization teams deciding which tools can be inherited versus built internally.
              Payers are dispersed across defense-wide IT accounts, service IT and cyber budgets, program-office RDT&E
              lines, and mission-system modernization funding. Procurement has accelerated meaningfully, but not
              uniformly. Defense.gov and the March 2025 background briefing emphasize the software acquisition pathway,
              CSOs, and OTs as the new default route for many software buys, with less than a year to MVP once funds are
              obligated. DIU says it has awarded more than 500 OTs via CSOs since 2016, with 88% going to nontraditional
              vendors and a recent Replicator software award completed in 110 days. Tactical-edge modernization creates
              additional entry points: the Army’s G-TEAD model runs 180-day validation sprints for TRL 7+ technology and
              transitions successful vendors toward OTAs, while DISA and Army space programs are pushing applications,
              data, and connectivity closer to the user at the tactical edge. For Defense Unicorns, that means demand is
              real, but it must be won program by program rather than through a single centralized category owner.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
