    UDS is a secure, portable, airgap-native platform that packages applications and dependencies into artifacts that
    can be deployed across cloud, on-premises, and disconnected environments. The broader product family includes UDS
    Enterprise for platform and cybersecurity teams, UDS Fleet for DDIL/tactical-edge operations, UDS Registry for
    signed artifact distribution and compliance metadata, and Army-specific authorization acceleration paths.
