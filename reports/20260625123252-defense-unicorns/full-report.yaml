            body: >-
              Anchore and Aqua are not full replicas of Defense Unicorns, but they attack important portions of the same
              budget. Both vendors market software-supply-chain security to federal buyers; Anchore goes especially hard
              on DoD-specific language such as DISA STIG, DoD IL-6, FIPS, and container-hardening guidance, while Aqua
