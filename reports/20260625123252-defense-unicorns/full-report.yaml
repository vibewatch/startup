  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue proof disappoints
        - Management disclosure or diligence shows revenue still below roughly $40M with limited recurrence.
        - Current valuation re-rates from software premium toward lower private-market software bands.
        - Re-underwrite on bear-case range; treat flat/down round as base risk.
      - - $300M vehicle does not convert
        - Limited task-order conversion or obligation growth through the next 12-24 months.
        - Option value embedded in the round erodes quickly.
        - Move stance toward avoid unless price resets.
      - - Preference stack is investor-unfriendly
        - Series B documents reveal heavy preferences, structure, or pay-to-play protections.
        - Headline valuation overstates effective value for new or common holders.
        - Discount the round price materially in IC underwriting.
      - - 2026 software multiples weaken further
        - Cyber and defense software valuations compress below current selective bands.
        - Private pricing flexibility shrinks even if company execution is decent.
        - Tighten comp range and reduce upside assumptions.
      - - Mission adoption stalls
        - No meaningful growth beyond the current 80+ mission-system claim.
        - The software-platform narrative weakens and the company looks more project-based.
        - Require new traction proof before following on.
    notes: Thresholds are author-defined monitoring rules anchored to public metrics and diligence outputs.
    claimRefs:
      - CV009
      - CV010
      - CV023
      - CV024
      - CV042
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue quality
        - Recognized revenue or ARR, customer concentration, and split between recurring software and services.
        - Without it, the current multiple cannot be placed reliably on the public comp spectrum.
        - Obtain management deck, audited financials, or lender-style monthly KPI package.
      - - Margin and renewals
        - Gross margin, renewal rates, net retention, and support burden by product line.
        - These metrics determine whether Defense Unicorns deserves software or services multiples.
        - Request cohort-level unit economics and contract renewal history under NDA.
      - - Contract vehicle conversion
        - $300M vehicle ceiling, awarded task orders, funded backlog, and timing of conversion into revenue.
        - A headline vehicle can create option value without cash flow if conversion is slow.
        - Review task-order data and reconcile to USAspending / channel bookings.
      - - Channel mix
        - Direct federal obligations versus reseller, subcontractor, and allied revenue.
        - USAspending almost certainly understates total business, but the gap must be quantified.
        - Ask for revenue bridge from public obligations to reported revenue.
      - - Series B terms
        - Liquidation preferences, ratchets, pro rata rights, board terms, and any debt or warrant overlays.
        - The same headline valuation can imply very different economics for new investors.
        - Review financing documents or counsel summary before underwriting.
    notes: Each diligence ask is directly valuation-linked; none is a generic nice-to-have.
    claimRefs:
      - CV039
      - CV052
