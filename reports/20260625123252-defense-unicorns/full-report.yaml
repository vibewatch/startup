    rows:
      - - Disconnected deployment and packaging middleware
        - Package creation, artifact bundling, registry sync, offline install tooling
        - Generic cloud hosting or end-user SaaS with no disconnected requirement
        - Program offices, platform teams, software factories
        - Core to Defense Unicorns and Zarf
      - - Compliance and authorization automation
        - SBOM generation, signing, vulnerability scanning, inherited control evidence, cATO workflow
        - Standalone GRC consulting without deployment tooling
        - CIOs, AOs, cyber teams, platform offices
        - Core market driver because compliance gates software adoption
      - - Hardened container and artifact services
        - Approved base images, hardened repositories, container review and reuse
        - Raw public image registries or unmanaged open-source mirrors
        - DISA, DSOP, service platform teams
        - Adjacent and often bundled with delivery workflow
      - - Software factory platform services
        - CI/CD orchestration, developer tools, observability, policy enforcement
        - Mission application feature work itself
        - Service software factories, defense-wide DevSecOps programs
        - Primary route to budgeted demand
      - - Tactical-edge software transport and operation
        - Portable runtime, local registries, edge package deployment, offline updates
        - Weapons hardware, radios, satellites, or generic network gear
        - Operational units, edge modernization teams, tactical PEOs
        - High-value niche aligned to contested-environment needs
    notes: >-
      The boundary is defined by software-delivery friction in disconnected and classified environments, not by all
      defense software or all cloud spending.
