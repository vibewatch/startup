      - number: '3.2'
        title: Prime integrators compete on procurement posture and operated environments more than on product purity
        blocks:
          - type: paragraph
            body: >-
              The large-prime threat is not that Leidos, SAIC, Booz Allen, or BAE necessarily publish a cleaner product
              page than Defense Unicorns. It is that they can wrap secure software delivery inside broader
              modernization, cloud, or mission-integration work that already has budget, contracting lanes, and cleared
              labor. Leidos explicitly markets software factories to federal customers that need agility without giving
              up security and then extends that posture through its Second Front partnership for classified and
              unclassified DevSecOps operation. SAIC’s fetched materials are similarly services-first: the Cloud One
              case study describes a managed multicloud environment across AWS, Azure, and Oracle secure government
              clouds rather than a standalone portable platform. Booz Allen productizes part of the delivery stack
              through its Solutions Delivery Platform and Jenkins Templating Engine, but still stresses multicloud
              integration and accredited services. BAE is relevant mainly as a channel amplifier: the SatNow coverage
              shows BAE and Defense Unicorns jointly reaching awardable status on the Platform One Solutions
              Marketplace, which underscores that BAE’s channel power can be cooperative or competitive depending on who
              owns the prime relationship. This category pressures Defense Unicorns on distribution and procurement
              speed rather than on raw GitOps mechanics.
