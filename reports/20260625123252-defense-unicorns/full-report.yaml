  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: secure software delivery for contested defense environments'
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns does not sell generic cloud or all-purpose defense software; it sells the tooling and
              workflow layer that gets mission software built, packaged, authorized, moved, and operated across cloud,
              on-prem, classified, disconnected, and tactical-edge environments. Defense Unicorns describes UDS as a
              complete software workflow for the military and Zarf as a way to package and distribute software into
              air-gapped, constrained, and standalone environments. Official DoD DevSecOps materials define the adjacent
              government-owned problem set similarly: standardized tools, hardened containers, CI/CD orchestration,
              cATO, and portability across disconnected and classified environments. The market boundary therefore
              includes software factories, artifact registries, container hardening, SBOM/signing, compliance
              automation, and packaging/deployment middleware used to move mission applications into austere
              environments. It excludes core weapons hardware, generic enterprise SaaS with no disconnected deployment
              requirement, raw public-cloud infrastructure consumption, and broad cyber products that do not solve
              software-delivery friction. Status-quo substitutes are bespoke program-by-program pipelines, manual ATO
              paperwork, prime-integrator custom stacks, and internally assembled software factories. That boundary
              matters because the headline DoD digital budget is enormous, but the slice that directly pays for
              air-gapped delivery and compliance-heavy software operations is a much narrower middleware-and-platform
              category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
