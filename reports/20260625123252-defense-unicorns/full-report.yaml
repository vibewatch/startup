companyProfile:
  summary: >-
    Defense Unicorns is a San Antonio-based, veteran-founded defense software platform company founded in March 2021 by
    Rob Slaughter, Jeff McCoy, and Andrew Greene. Its core offer is UDS, an airgap-native software delivery platform
    that packages applications once and moves them across cloud, on-premises, classified, and tactical-edge
    environments, complemented by products such as UDS Army, UDS Registry, and UDS Fleet. Public customer proof is
    unusually strong for a private defense software company, including named Navy, Army, and Air Force references plus
    partner channels through BAE Systems and SAIC. The company raised a $136 million Bain-led Series B in January 2026
    at a valuation above $1 billion after a disclosed $35 million Series A, but public evidence still does not disclose
    the revenue, margin, retention, or governance detail needed to translate traction into a clean underwriting case.
