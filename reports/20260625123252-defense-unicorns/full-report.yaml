      - number: '5.2'
        title: Architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The technical core of Defense Unicorns is a packaging-and-control-plane architecture rather than a
              proprietary application monolith. UDS bundles pin Zarf packages and environment-specific configuration
              into a single deployable artifact, while the UDS Operator and Package custom resource wrap application
              deployment with ingress, identity, monitoring, and policy automation. Underneath that, Zarf handles the
              hard part of air-gapped Kubernetes by seeding a local registry, mutating Flux and Argo references toward
              local OCI or Git endpoints, and shipping software as tarballs or OCI artifacts that can be transported on
              physical media if needed. UDS Core then adds composable functional layers such as identity, logging,
              monitoring, backup/restore, and runtime security. The architecture is specifically tuned for constrained
              environments: Defense Unicorns moved Istio toward ambient mode to reduce per-pod sidecar overhead and
              publishes dependency-aware layer ordering so teams can carry only the parts of the platform their
              environment can actually sustain.
