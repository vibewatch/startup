      - number: '1.3'
        title: Funding history, disclosed capitalization, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The public funding record is unusually clean for a private defense startup because both the February 2024
              Series A and January 2026 Series B were openly described. On disclosed rounds alone, Defense Unicorns has
              raised at least $171 million, and the Bain-led Series B moved the company above a $1 billion valuation.
              The syndicate matters as much as the dollars: Ansa and Sapphire show repeat conviction from earlier
              investors, while Bain, Valor, AVP, Uncorrelated Ventures, and David Petraeus widen the strategic and
              political network around the company. The company also presents partnerships with SAIC and BAE Systems as
              force multipliers that can convert product credibility into larger program access. Even so, public
              disclosures stop short of cap-table depth. No reviewed source gives board seats, ownership percentages,
              liquidation terms, or secondary activity. For investors, this means the company has real funding momentum
              and relevant industrial allies, but the public record is still too thin to resolve governance leverage,
              dilution history, or exact economic ownership.
