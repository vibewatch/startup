        title: Capital adequacy, burn, and runway implications
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to meaningful financing access and nontrivial public revenue inflows, but not to a
              calculable runway. On the positive side, the company entered 2026 with $136 million of new equity and with
              visible federal awards whose fetched values already exceed $87 million across just three contracts. The
              company also markets multiple acquisition shortcuts, which can help compress revenue conversion timelines
              in a procurement environment the company itself describes as slow. On the risk side, nothing in the
              retained public set discloses current cash, monthly burn, debt, or runway. That omission matters more here
              than it would in a pure software story because Defense Unicorns explicitly sells 24/7 support,
              Mission-as-a-Service, and forward-deployed engineering into classified and air-gapped environments. Those
              delivery features likely improve customer stickiness and contract value, but they also imply a service and
              compliance labor base that can widen the gap between gross bookings and software-like margins. Independent
              risk sources reinforce the point: Goodwin notes that many defense startups still stall in the valley of
              death between prototype and production, while GAO continues to describe defense acquisition as slow and
              process-heavy. Public data does not show immediate liquidity stress; it does show that scaling revenue
              into durable, efficient program work remains the key capital-adequacy question.
