        title: Milestones, public scale signals, and open diligence risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Defense Unicorns has moved beyond a narrative of future potential into demonstrable
              mission-system evidence. The Navy submarine case study ties Zarf to Columbia-class sustainment needs and
              tens of millions of dollars of Phase III follow-on funding. The F-22 demonstration shows the company can
              translate its software-delivery architecture into a high-consequence aircraft environment, while UDS Army,
              CMMC Level 2 certification, and UDS Fleet together show product breadth across authorization,
              cybersecurity, and tactical fleet management. The June 2026 UDS Fleet launch also supplied the most
              expansive public scale claims, including software deployed across more than 80 mission systems and a cited
              $300 million DoD-wide contract plus a $15 million Space Force contract. Those are meaningful signals, but
              they do not close every risk question. Revenue, ARR, exact headcount, and cap-table details remain
              undisclosed. The company is deeply tied to U.S. defense procurement rhythms, and an external February 2026
              critique of the Big Bang ecosystem underscores a real diligence question: can Defense Unicorns
              commercialize software-factory lessons without recreating the complexity, abstraction, and
              compliance-theater problems that critics associate with that lineage?
