  - id: TP003
    title: Deployment, packaging, and procurement comparison
    columns:
      - rival archetype
      - typical packaging or contract model
      - deployment model
      - accreditation or channel advantage
      - procurement posture
      - implication for Defense Unicorns
    rows:
      - - Defense Unicorns
        - Platform plus services; public price undisclosed
        - Portable platform across cloud, on-prem, and tactical edge
        - Claims built-in controls and evidence for faster ATO
        - Can sell as platform-first offer
        - Strong where buyer wants one portable baseline rather than a labor-heavy services wrapper
