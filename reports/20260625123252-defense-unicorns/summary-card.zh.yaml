  topStrengths:
    - 作为私营防务软件公司，公开证据异常扎实：可归因的海军、陆军和空军引用，加上公司公开称已部署到 80 多个任务系统和组织。
    - 创始人与市场匹配真实且贴着产品：团队来自 DoD 软件工厂生态，做的是面向隔离环境的原生平台，有具体合规和离线部署能力，不是泛化 DevSecOps 外壳。
    - Defense Unicorns 既有产品牵引力，也借助 SBIR/GSA 路径、Platform One 市场，以及 BAE Systems 和 SAIC 伙伴渠道撬动采购。
    - 资本化和合规姿态都是加分项：$136 million Series B、老股东继续支持，以及公开 CMMC Level 2 认证且 POA&M 为零。
  topRisks:
    - ARR、收入、毛利率、留存、积压订单质量和 Series B 优先权条款均未披露，公开证据很难审计 $1B+ 估值。
    - 客户和收入暴露集中在美国防务采购；可见公开授标偏向 SBIR 衍生或单一来源渠道，未必能顺滑放大成广泛经常性项目。
    - 收入模式看起来部分依赖人力，支持、培训和前置部署服务可能稀释软件式利润率，即使 bookings 继续强劲。
    - 竞争和合规压力真实存在：已获认证的公共部门 DevSecOps 替代方案、主承包商主导的交付栈，以及 Big-Bang 式套件复杂度风险，都会挑战护城河耐久性。
  unresolvedGaps:
    - ARR 或确认收入、毛利率、续约 / 留存和积压订单转化均未公开披露。
    - 公开来源看不到标准定价兑现、每个账户平均环境数、软件与服务收入结构，或员工数和涉密人员构成。
    - 董事会构成、持股比例、控制权和 Series B 优先权条款仍不在公开记录里。
    - $300 million 合同工具说法、80 多个任务系统足迹和伙伴渠道牵引力，还需要更扎实的证据证明已获资金转化、续约行为和直接经济价值。
