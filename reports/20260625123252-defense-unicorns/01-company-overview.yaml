company:
  name: Defense Unicorns
chapter:
  number: 1
  title: Company Overview
  summary: Defense Unicorns is a San Antonio-based, veteran-founded defense software platform company founded in 2021 by Rob Slaughter, Jeff McCoy, and Andrew Greene to deliver modern software in air-gapped military environments. Publicly disclosed financing totals at least $171 million across a $35 million Series A and $136 million Bain-led Series B that pushed valuation above $1 billion, while milestones such as the Navy Zarf case study, Army C5ISR collaboration, F-22 demo, CMMC Level 2 certification, and UDS Fleet launch support real mission traction. The main open diligence gaps are undisclosed revenue and headcount, incomplete governance transparency, heavy dependence on U.S. defense buyers, and whether the company’s software-factory lineage can scale without carrying forward the complexity critics associate with Big Bang-style stacks.
sections:
- id: identity-and-product
  title: Identity, mission, and product scope
  body: 'Defense Unicorns is a San Antonio-based, veteran-founded defense software company built around the proposition that mission systems need modern software delivery even when they operate disconnected from the public internet. The company pitches UDS as an airgap-native platform rather than a generic DevSecOps toolkit: package once, deploy across cloud, on-premises, and tactical edge environments, and carry the compliance and software-supply-chain evidence needed for mission use. The reviewed material repeatedly emphasizes portability, vendor-lock avoidance, and the ability to move software from satellites to submarines. That identity is important because Defense Unicorns is not positioning itself as a pure consulting shop or a narrow tool vendor; it is trying to become infrastructure for software sustainment across defense programs. Zarf remains an important proof point in that story because it shows the company’s roots in open-source packaging for disconnected environments, while
    newer products such as UDS Army, UDS Registry, and UDS Fleet show a move from single-tool credibility to a full platform suite.'
  claimRefs:
  - CO002
  - CO004
  - CO005
  - CO006
