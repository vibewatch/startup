callouts:
- calloutType: strength
  title: Founder-market fit is unusually strong for this buyer set
  body: Defense Unicorns is selling into the same defense-software ecosystem its founders previously helped build. That makes the go-to-market story unusually credible relative to generic DevSecOps startups, especially when combined with visible proof points such as the Navy submarine case study, the F-22 demonstration, and Army C5ISR collaboration.
  claimRefs:
  - CO008
  - CO009
  - CO027
  - CO029
- calloutType: risk
  title: Public momentum outpaces public economic disclosure
  body: The company has enough open-source evidence to support a strong capability narrative, but not enough to support a full underwriting view on revenue quality, gross margins, burn, or exact workforce scale. Public scale claims are directionally positive; they are not a substitute for management financial disclosure.
  claimRefs:
  - CO018
  - CO021
  - CO033
  - CO041
- calloutType: insight
  title: Platformization is the upside and the execution risk
  body: Defense Unicorns is broadening from Zarf and a core runtime into a family of authorization, registry, and fleet-management products. That increases monetization paths and strategic relevance, but it also raises the diligence burden around product focus, support overhead, and whether the company can avoid replicating the complexity critics assign to older DoD software-factory stacks.
  claimRefs:
  - CO022
  - CO035
  - CO036
  - CO045
