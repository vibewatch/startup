- id: founders-and-governance
  title: Founders, leadership, and governance posture
  body: 'Defense Unicorns’ strongest identity asset is founder-market fit. Rob Slaughter, Jeff McCoy, and Andrew Greene did not approach defense software as outsiders; the company’s own history ties them to Kessel Run, Space CAMP, Platform One, and Big Bang, and DefenseScoop coverage reinforces that Slaughter’s transition from DoD software factories to startup founder is a central part of the public narrative. That background supports credibility with military buyers, but it also concentrates strategic and reputational weight in a small group of founder-operators. Slaughter is clearly the public face and chief evangelist, McCoy anchors technical credibility, and Greene is presented as the continuing product-and-mission engineer. What is missing from public sources is formal governance detail: reviewed materials do not disclose a fuller board roster, voting rights, or investor control provisions. That means diligence should treat founder quality as a strength while still testing succession,
    decision rights, and whether the company’s platform strategy depends too heavily on a narrow set of operators.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO039
  - CO044
  tableRefs:
  - TO002
  figureRefs: []
- id: funding-and-stakeholders
  title: Funding history, disclosed capitalization, and stakeholder map
  body: 'The public funding record is unusually clean for a private defense startup because both the February 2024 Series A and January 2026 Series B were openly described. On disclosed rounds alone, Defense Unicorns has raised at least $171 million, and the Bain-led Series B moved the company above a $1 billion valuation. The syndicate matters as much as the dollars: Ansa and Sapphire show repeat conviction from earlier investors, while Bain, Valor, AVP, Uncorrelated Ventures, and David Petraeus widen the strategic and political network around the company. The company also presents partnerships with SAIC and BAE Systems as force multipliers that can convert product credibility into larger program access. Even so, public disclosures stop short of cap-table depth. No reviewed source gives board seats, ownership percentages, liquidation terms, or secondary activity. For investors, this means the company has real funding momentum and relevant industrial allies, but the public record is still
    too thin to resolve governance leverage, dilution history, or exact economic ownership.'
  claimRefs:
