  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, ARR, gross margin, burn, and renewal/cohort data.
    whyItMatters: The public record proves relevance and fundraising momentum but not unit economics or cash efficiency.
    diligencePath: Request audited or board-reviewed financials plus current pipeline-to-bookings bridge.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Exact employee count, security-clearance mix, and contractor versus FTE composition.
    whyItMatters: Hiring signals growth, but staffing scale and cleared labor mix matter for delivery capacity and margin structure.
    diligencePath: Request HR roster summary and org chart by function and clearance level.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Board roster, investor ownership percentages, voting rights, and any protective provisions.
    whyItMatters: Governance leverage and dilution history can materially affect control and exit economics.
    diligencePath: Review cap table, board consents, and latest financing documents under NDA.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: mission-system-count
    missingEvidence: A consistent definition of what counts as a mission system, organization, program, or deployment environment in public scale claims.
    whyItMatters: The difference between 30-plus and 80-plus entities could reflect category changes rather than pure growth.
    diligencePath: Ask management to reconcile each public count to paying programs, production deployments, and pilot environments.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: A fully reconciled chronology tying every public scale claim, contract vehicle, and product launch to a dated announcement or award notice.
    whyItMatters: The chapter has enough dated milestones to clear the overview bar, but some public scale claims still rely on broad launch posts instead of primary award documents.
    diligencePath: Collect award notices, contract summaries, and archived release dates for each major milestone and reconcile them into the company timeline.
    relatedQuestionRefs:
    - QO013
    - QO019
    relatedTableRefs:
    - TO004
