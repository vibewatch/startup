  topStrengths:
    - >-
      Unusually strong public proof for a private defense software company, including attributable Navy, Army, and Air
      Force references plus a public claim of deployment across more than 80 mission systems and organizations.
    - >-
      Founder-market fit is authentic and product-specific: the team comes from the DoD software-factory ecosystem and
      built an airgap-native platform with concrete compliance and disconnected-deployment features rather than a
      generic DevSecOps wrapper.
    - >-
      Defense Unicorns combines product traction with procurement leverage through SBIR/GSA pathways, the Platform One
      marketplace, and partner channels with BAE Systems and SAIC.
    - >-
      Capitalization and compliance posture are meaningful positives, with a $136 million Series B, repeat investor
      support, and public CMMC Level 2 certification with zero POA&Ms.
  topRisks:
    - >-
      The $1B+ valuation is hard to audit from public evidence because ARR, revenue, gross margin, retention, backlog
      quality, and Series B preference terms remain undisclosed.
    - >-
      Customer and revenue exposure is concentrated in U.S. defense procurement, and visible public awards skew toward
      SBIR-derived or one-source channels that may not scale cleanly into broad recurring programs.
    - >-
      The revenue model appears partly labor-intensive, with support, training, and forward-deployed services
      potentially diluting software-like margins even if bookings remain strong.
    - >-
      Competition and compliance pressure are real: accredited public-sector DevSecOps alternatives, prime-led delivery
      stacks, and the risk of Big-Bang-style bundle complexity all challenge moat durability.
  unresolvedGaps:
    - ARR or recognized revenue, gross margin, renewal/retention, and backlog conversion are not publicly disclosed.
    - >-
      Public sources do not show standard pricing realization, average environments per account,
      software-versus-services mix, or headcount and cleared-labor composition.
    - >-
      Board composition, ownership percentages, control rights, and Series B preference terms remain outside the public
      record.
    - >-
      The $300 million contract-vehicle claim, 80-plus mission-system footprint, and partner-channel traction still need
      tighter evidence on funded conversion, renewal behavior, and direct economic value.
