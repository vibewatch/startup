  - - Confidence
    - medium
    - The round, obligation floor, and comparator set are public; the decisive revenue-quality inputs are not.
  - - Risk rating
    - high
    - Valuation depends on conversion of contract vehicles into recurring revenue while 2026 software multiples are less forgiving.
  - - Valuation stance
    - stretched
    - The price can work only if Defense Unicorns proves software-like recurring revenue materially above the public obligation floor.
  - - Entry discipline
    - Do not lead blindly at headline price
    - Require NDA diligence on revenue, margin, backlog, and Series B terms before treating the round as fair.
  - - Monitor horizon
    - 12-24 months
    - That window should reveal conversion of the $300M vehicle, new obligations, and whether another financing is needed.
