- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Valuation / scale marker
  - Revenue multiple marker
  - Why it matters / limitation
  rows:
  - - Palantir
    - Public software / defense platform
    - $272.09B market cap; $5.22B revenue
    - ~50.59x EV/Sales
    - Shows the ceiling for a scaled strategic software platform with extensive disclosure; not directly comparable on maturity.
  - - CrowdStrike
    - Public cybersecurity platform
    - $171.33B market cap; $5.09B revenue
    - ~32.90x EV/Sales
    - Shows premium cyber multiples, but commercial security growth is broader and more diversified than DoD procurement.
  - - Booz Allen
    - Public defense / gov services
    - $7.51B market cap; $11.22B revenue
    - ~0.97x EV/Sales
    - Useful floor for services-heavy or procurement-tied revenue.
  - - Leidos
    - Public defense / govtech contractor
    - $13.12B market cap; $17.33B revenue
    - ~1.13x EV/Sales
    - Another floor anchor for large procurement businesses with disclosure and scale.
  - - Saronic
    - Private defense autonomy
    - $9.25B valuation; $392M Navy contract disclosed
    - Undisclosed
    - Shows how aggressively capital rewards strategic autonomy winners with contract evidence.
  - - Shield AI / Epirus
    - Private defense technology
    - $500M Series F capital raised / $250M Series D, $550M total funding
    - Undisclosed
    - Illustrates ongoing investor appetite, but both are more hardware-intensive than Defense Unicorns.
  notes: 'Comparable set is intentionally mixed: public software premiums, public defense-service floors, and private defense-tech round markers. Defense Unicorns can live only between those poles.'
