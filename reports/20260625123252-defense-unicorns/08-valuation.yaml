  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Recognized revenue or ARR, gross margin, renewal behavior, and backlog quality by product line.
    whyItMatters: These metrics determine whether Defense Unicorns deserves software-platform multiples or should trade closer to services-oriented primes.
    diligencePath: Request audited financial statements or a management KPI package under NDA.
    relatedQuestionRefs:
    - QV016
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: A bridge from public USAspending obligations to total revenue including reseller, subcontractor, and allied channels.
    whyItMatters: Public obligations prove demand exists, but they may materially understate or distort the real revenue base behind the valuation.
    diligencePath: Reconcile task orders, reseller bookings, and recognized revenue in a diligence data room.
    relatedQuestionRefs:
    - QV006
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: series-b-terms
    missingEvidence: Preference terms, liquidation stack, board rights, anti-dilution provisions, and any debt or warrant overlays from the Series B.
    whyItMatters: The same headline valuation can imply very different economics depending on structure and investor protections.
    diligencePath: Review the financing documents or a counsel-prepared term summary before underwriting.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: contract-conversion
    missingEvidence: Detailed conversion data on the disclosed $300M contract vehicle into funded task orders and recurring programs.
    whyItMatters: The upside case assumes ceiling value turns into real bookings rather than remaining merely available capacity.
    diligencePath: Ask management for task-order history, current pipeline, and conversion timing by customer.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV003
    - TV006
