- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Supports the $1B price
  - What still stretches it
  - View change trigger
  rows:
  - - Customer traction
    - Software deployed across 80+ mission systems and multiple military branches.
    - Deployment breadth does not reveal revenue quality, pricing power, or renewal behavior.
    - Public disclosure of annual recurring revenue by major program.
  - - Contract position
    - Visible federal obligations plus a disclosed $300M contract vehicle show real procurement access.
    - Contract ceiling is not revenue, and public obligations remain small relative to unicorn valuation.
    - Evidence that task orders convert into recurring funded programs.
  - - Product moat
    - Airgap-native mission software and software-factory lineage suggest embedded workflow value.
    - Public record does not prove gross-margin durability or low services intensity.
    - Gross-margin disclosure above a software-like threshold.
  - - Capital markets
    - Bain-led round and repeat backers signal credible investor support.
    - 2026 software and cyber multiples are resetting while defense-tech M&A is slower.
    - Another round at a higher price backed by revenue disclosure.
  - - Relative comp set
    - Much cheaper than Saronic and below top software premiums.
    - Still far richer than Booz Allen or Leidos unless revenue scales quickly.
    - Proof that Defense Unicorns deserves to be comped with software platforms, not integrators.
  notes: Rows pair the strongest supporting fact with the main counterpoint that could still break the valuation case.
