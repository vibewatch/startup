- id: final-diligence
  title: Final diligence asks and thesis-break triggers
  body: 'The judgment gap in this chapter is not whether Defense Unicorns matters strategically; the public record strongly suggests it does. The gap is whether the current round price leaves enough margin of safety for a new investor. That means the remaining diligence list is unusually valuation-specific. First, management needs to provide revenue quality: ARR or recognized revenue, gross margin, renewal behavior, and backlog split between recurring software and services or support work. Second, investors need to understand the $300 million vehicle: ceiling, conversion history, customer concentration, reseller usage, and timing of actual funded task orders. Third, the Series B documents themselves matter because preference terms can make an unchanged headline valuation less attractive to new money or earlier holders. Fourth, the public-obligation picture should be reconciled with channel and allied revenue, since USAspending almost certainly understates total commercial reality. Until
    those questions close, the right posture is to monitor for thesis-break triggers rather than extrapolate from the unicorn headline alone.'
