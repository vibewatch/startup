company:
  name: Defense Unicorns
chapter:
  number: 8
  title: Valuation
  summary: Defense Unicorns' January 2026 $136 million Series B at more than $1 billion gives the company a real valuation anchor, but public evidence still leaves a wide gap between visible federal obligations and the software-like economics needed to justify that price. Public contract data, deployment claims, and a strong investor syndicate support a serious business rather than a vanity mark, yet 2026 cyber and defense-tech multiple evidence says the round is stretched unless recurring revenue is materially above the current public floor. The result is a research-more recommendation with medium confidence, high risk, and a stretched valuation stance.
sections:
- id: valuation-anchor
  title: Valuation anchor and recommendation
  body: 'Defense Unicorns crossed the unicorn threshold on 2026-01-13 when it announced a $136 million Series B led by Bain Capital at a valuation above $1 billion. That round is not a rumor or secondary mark; it is the only disclosed primary valuation anchor in the current public record, and it arrived alongside management claims of rapid and profitable growth plus 300% year-over-year adoption growth in military systems. Those are meaningful positives for a defense software company, especially one founded only in 2021. Public evidence also shows product breadth beyond a single tool: UDS, UDS Registry, UDS Army, the later Airgap App Store launch, and an April 2026 UDS Fleet announcement that tied the platform to more than 80 mission systems and organizations and a $300 million DoD-wide contract vehicle. The problem is not lack of a narrative; it is lack of financial disclosure. No public source reviewed for this chapter provides ARR, gross margin, retention, backlog quality, or Series B
    preference terms. On that basis the investment call is research-more, confidence is medium, risk is high, and the valuation stance is stretched rather than attractive.'
