- id: dilution-exit
  title: Dilution, fundraising path, and exit readiness
  body: 'The $136 million Series B should lower immediate dilution pressure, especially if the company is genuinely profitable as management claims, but it does not remove financing risk altogether. The relevant question is not whether Defense Unicorns can operate in the next few quarters; it is whether the company can convert narrative traction into recurring, high-quality revenue before needing the next price-setting event. If the $300 million contract vehicle converts into repeatable programs and allied buyers expand, a $1.5 billion to $2.5 billion next-round range is plausible. If revenue disclosure remains thin or conversion disappoints, a flat or down round into the $0.6 billion to $0.9 billion range becomes realistic under today’s tighter software multiple environment. Because the business is software-led rather than factory-heavy, the downside is probably better than autonomy peers that require massive production capex, but that is still an inference rather than a proved fact. Exit
    readiness is therefore moderate at best: another private round is the most likely path, while acquisition by a defense prime or systems integrator is more plausible than a near-term public listing without much deeper disclosure.'
