- id: support-vs-opacity
  title: What supports the price and what still stretches it
  body: 'There is real evidence behind the Defense Unicorns story. Company materials show the business is embedded in real defense-software workflows through Platform One lineage, Navy and Army references, and deployments across Navy, Air Force, and Space Force systems. The company also publicly disclosed a $35 million Series A before the Series B, indicating repeat support from earlier investors rather than a single opportunistic markup. USAspending adds an important hard-data floor: the recipient profile fetched for this report shows $42.54 million of visible federal obligations, with GSA and DoD as the two largest award channels. That does not prove total company revenue, because reseller, subcontractor, and contract-vehicle economics can differ from direct obligations, but it does show the company is not selling pure vapor. The stretch comes from the gap between those public obligations and the $1 billion equity value. If the market is underwriting Defense Unicorns as a software platform
    with repeatable, high-margin mission workloads, the price can work. If the real economics are closer to services or low-conversion contract vehicles, the valuation becomes difficult to defend.'
