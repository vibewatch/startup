- id: scenario-bridge
  title: Scenario and revenue-multiple bridge
  body: Because Defense Unicorns is private and does not disclose revenue, the cleanest way to value the company is not a faux-precise DCF but a scenario bridge from public contract evidence to implied software multiples. The visible obligation floor on USAspending is $42.54 million cumulatively, while the company also says it has a $300 million DoD-wide contract vehicle and software deployed across more than 80 mission systems and organizations. Those facts support a broad possible revenue band. In a bear case, current revenue or near-term run-rate may still sit around $25 million to $40 million, producing a 25x to 40x multiple at the current valuation and leaving little protection if multiples compress further. In a base case, $45 million to $70 million of revenue points to roughly $0.9 billion to $1.3 billion of equity value. In a bull case, $80 million to $120 million of revenue and continued software-style growth could support $1.6 billion to $2.4 billion. That range means the current
    round can be justified, but only under stronger execution than the public record can independently verify today.
