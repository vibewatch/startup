- id: comparables-market-context
  title: Comparable set and 2026 market context
  body: 'The most useful public comps split into two groups. On the software premium end, Palantir and CrowdStrike trade around 50.59x and 32.90x EV/Sales respectively, showing what the public market will pay for strategic software platforms with scale, disclosure, and deep investor confidence. On the govtech and services end, Booz Allen and Leidos sit near 0.97x and 1.13x EV/Sales, showing how fast multiples collapse when revenue is services-heavy or procurement-tied. Defense Unicorns almost certainly belongs between those poles, but where it lands depends on evidence not yet public. Private defense-tech comps show how generous the market can be when strategic urgency and manufacturing narrative align: Saronic raised $1.75 billion at a $9.25 billion valuation and disclosed a $392 million Navy contract; Epirus raised $250 million to scale production; Shield AI had already accumulated $500 million of Series F capital. At the same time, 2026 research is less forgiving. S&P reports record defense-tech
    funding but slower M&A, McKinsey says disruptors still outrun obligations on valuation, PitchBook warns some categories are overheating, and ION shows cyber multiples resetting. That combination supports a stretched but not absurd view on Defense Unicorns.'
