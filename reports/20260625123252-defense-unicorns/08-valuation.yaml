- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue / traction assumption
  - Multiple logic
  - Equity value range
  - Probability signal
  rows:
  - - Bull
    - Revenue reaches roughly $80M-$120M with strong conversion of the $300M vehicle and broader allied adoption.
    - 15x-20x revenue, still below top software leaders but above services primes.
    - $1.6B-$2.4B
    - Requires software-like economics plus additional obligations and cleaner disclosure.
  - - Base
    - Revenue reaches roughly $45M-$70M with continued adoption but incomplete proof on margins and renewals.
    - 10x-14x revenue, above prime contractors but below premium cyber leaders.
    - $0.9B-$1.3B
    - Closest fit to current public evidence.
  - - Bear
    - Revenue remains roughly $25M-$40M and contract conversion disappoints while software multiples reset.
    - 6x-10x revenue, closer to selective 2026 private software and down-round logic.
    - $0.5B-$0.8B
    - Triggered by thin disclosures, weak obligations growth, or slower procurement conversion.
  - - Current round
    - Valuation already assumes meaningful software-style growth beyond the visible obligation floor.
    - Headline price implies 25x-40x on low revenue and 12.5x-16.7x on mid-case revenue.
    - ~$1.0B+
    - Defensible only if management can prove stronger economics than public data alone shows.
  notes: All scenario ranges are author estimates derived from public obligations, claimed traction, and public/private comp bands; they are not company guidance.
