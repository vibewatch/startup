callouts:
  - calloutType: recommendation
    title: 'Underwriting Stance: Track Pending Valuation Absorption'
    body: While Hightouch exhibits top-tier customer momentum and leadership in the emerging agentic marketing stack, the $2.75B Series D entry valuation prices in near-flawless execution and significant multiple expansion. Investors should maintain a Track posture until audited ARR growth, gross margin durability, and retention metrics validate the premium multiple.
    claimRefs:
      - CV001
      - CV002
      - CV003
  - calloutType: risk
    title: Platform Absorption and Multiple Compression Downside
    body: 'The core investment hazard is a twin compression: warehouse platforms like Snowflake and Databricks incorporating native activation capabilities, combined with martech multiple compression toward public medians of 6x-10x revenue. Without proprietary moats in agentic decisioning, downside scenarios imply up to 65% capital impairment.'
    claimRefs:
      - CV007
      - CV009
      - CV010
