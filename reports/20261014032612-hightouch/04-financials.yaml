  - - Gross Margin Percentage
    - null
    - Low
    - Reflects software hosting cost versus customer-borne warehouse compute
    - Review COGS breakdown including AWS hosting, third-party LLMs, and support
  - - Net Revenue Retention (NRR)
    - null
    - Low
    - Measures cohort expansion across sync destinations and product modules
    - Obtain annualized cohort retention curves and net dollar retention tables
  - - Customer Acquisition Cost (CAC) Payback
    - null
    - Low
    - GTM efficiency benchmark across enterprise sales and cloud co-selling
