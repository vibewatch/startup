callouts:
- calloutType: risk
  title: Multi-Variable Pricing and Customer Warehouse Compute Drag
  body: "Hightouch's multi-variable pricing structure\u2014charging across destinations, sync schedules, and optional feature modules\u2014creates forecasting challenges for enterprise buyers. Furthermore, because reverse ETL runs queries directly inside customer data warehouses like Snowflake, high-frequency synchronization can drive unexpected compute consumption on customer bills, introducing indirect margin pressure."
  claimRefs:
  - CI003
  - CI009
- calloutType: insight
  title: Ecosystem-Driven Cloud Co-Selling Efficiency
  body: By aligning deeply with Snowflake and AWS Marketplace, Hightouch leverages cloud vendor commit budgets and co-selling programs to compress sales cycles and reduce direct outbound CAC, helping justify its premium Series D valuation despite unconfirmed private ARR metrics.
  claimRefs:
  - CI005
  - CI006
