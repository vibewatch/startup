  - - Identity Resolution
    - Warehouse-native identity stitching engine add-on
    - Monthly active profile / volume tier
    - Commercial add-on
    - High lock-in but subject to enterprise data team validation
    - Request identity resolution module contract count and ARR contribution
  - - Personalization & Match APIs
    - Low-latency HTTP API querying audience membership at runtime
    - API call volume / query latency tier
    - Emerging product line
    - Usage-sensitive revenue subject to application query volume
    - Inspect API call consumption patterns and gross margins
  - - Agentic Marketing Platform
    - AI orchestration and decisioning workflows on first-party data
    - Workflow / campaign agent subscription
    - Newly launched (Series D catalyst)
    - Early-stage revenue with unproven cohort renewal durability
    - Obtain pilot-to-paid conversion rates and contracted ARR for AMP
  notes: Categorization derived from public product tiers, analyst documentation, and Series D investor positioning; exact ARR breakdown by product line is undisclosed.
