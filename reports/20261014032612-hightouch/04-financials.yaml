  - - Real-Time Streaming / Events
    - Monthly Tracked Users (MTUs) and event volume add-on
    - Hybrid usage billing layered onto base platform fee
    - Overage penalties and MTU baseline thresholds undisclosed
    - McGaw technical review and CDP market comparison
  - - Cloud Marketplace Channel
    - Direct procurement via AWS Marketplace / Snowflake partner billing
    - Contracted software licenses drawn against cloud commits
    - Marketplace rev-share take rates (estimated 3-15%) undisclosed
    - AWS Marketplace listing and Snowflake partnership announcements
  notes: Contract values reflect market intelligence, consultant teardowns, and buyer reports; exact realization rates and discount schedules require private ledger audit.
