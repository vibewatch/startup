    - Active commercial core
    - High recurring retention tied to operational workflows
    - Audit sync volume tier distributions and expansion rates
  - - Customer Studio & Audiences
    - Subscription add-on for no-code marketer audience segmentation
    - Platform seat license plus audience tier
    - High-growth upsell
    - High gross margin software layer with potential stickiness
