  - - Average Contract Value (ACV)
    - null
    - Low
    - Indicates enterprise penetration vs mid-market composition
    - Analyze ACV distribution across top 20% vs remaining 80% of customer accounts
  notes: Quantitative metrics are largely undisclosed private information; reported growth is company-claimed via Series D investor statements.
