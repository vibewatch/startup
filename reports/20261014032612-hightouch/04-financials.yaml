    - Official platform documentation and analyst reviews
  - - Starter / Growth Tier
    - Tiered by number of destinations and sync frequency
    - Estimated mid-market contracts ($5k-$25k/yr)
    - Volume discounting and annual commitment concessions private
    - Consultancy benchmarks and G2/PeerSpot user feedback
  - - Enterprise Composable CDP
    - Custom negotiated annual contract based on syncs, destinations, and features
