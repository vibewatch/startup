companyProfile:
  summary: >-
    Hightouch is a late-stage, venture-backed customer data activation and agentic marketing platform founded in 2018 in
    San Francisco. The product keeps the customer warehouse as the system of record, activates modeled data into
    downstream SaaS and ad tools, and has expanded from reverse ETL into Customer Studio, identity resolution,
    personalization, and agentic marketing workflows. The company serves a broad base of enterprise customers and sits
    in the warehouse-native composable CDP category, but private financials and cohort retention remain opaque.
