evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-waterfall
    missingEvidence: Detailed Series D cap table, liquidation preferences, seniority stacks, and secondary discount terms.
    whyItMatters: >-
      Evaluating equity hurdle rates and downside protection at the $2.75B post-money valuation requires verified
      liquidation preference schedules rather than headline press releases.
    diligencePath: >-
      Request the Series D certificate of incorporation, capitalization table summary, and investor rights agreements
      during management due diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-operating-metrics
    missingEvidence: Audited GAAP revenue bridge by product line, gross margin, net revenue retention (NRR), and cash burn rate.
    whyItMatters: >-
      Validating software unit economics and runway requires audited financial disclosures rather than self-reported
      top-line milestones.
    diligencePath: >-
      Obtain management quarterly financial packages, cohort retention schedules, and audited financial statements
      during confirmatory diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited commercial revenue breakdown isolating pure reverse ETL pipeline contracts from bundled Composable CDP and
      Agentic Marketing ARR subscriptions.
    whyItMatters: >-
      Without segmented product-line contract data, evaluating the durable growth and retention velocity of pure
      activation versus full marketing platform displacement relies on high-level management disclosures.
    diligencePath: >-
      Request management cohort retention tables and product-line revenue allocations, or inspect software procurement
      contract samples from enterprise cloud marketplaces.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitive-market-share
    missingEvidence: >-
      Audited win/loss data and logo retention metrics comparing Hightouch directly against Fivetran/Census and Twilio
      Segment across enterprise accounts ($100K+ ARR).
    whyItMatters: >-
      Without private enterprise renewal and churn benchmarks, it is difficult to quantify whether Fivetran's bundling
      of Census is eroding Hightouch's net new customer acquisition.
    diligencePath: >-
      Request customer cohort retention reports, gross revenue retention (GRR) by deal size, and competitive win/loss
      analysis during technical underwriting.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-revenue-breakdown
    missingEvidence: Audited financial statements, GAAP revenue, and detailed ARR bridge by product line and customer cohort.
    whyItMatters: >-
      Public ARR estimates diverge significantly from $23.3M to $100M, making valuation underwriting at $2.75B
      impossible without audited records.
    diligencePath: >-
      Require management to provide audited income statements, revenue recognition policies, and cohort ARR waterfalls
      under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Direct cost-of-goods-sold breakdown between cloud infrastructure, LLM inference costs for agentic features, and
      customer support.
    whyItMatters: >-
      Software gross margins dictate long-term cash flow potential, and agentic AI token consumption could compress
      traditional 80%+ SaaS margins.
    diligencePath: Review hosting infrastructure invoices, third-party AI provider expenses, and gross margin schedules by SKU.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
