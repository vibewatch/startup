  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Supporting Rationale
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - >-
          Sustained >100% YoY growth and marquee customer adoption establish strong market leadership, but private
          valuation prices in aggressive multiple expansion ahead of audited financials.
        - Monitor audited ARR bridge, retention cohorts, and multiple normalization before deploying primary capital.
      - - Confidence
        - Medium
        - >-
          Public financing rounds and customer testimonials corroborate product-market fit, but lack of private unit
          economics and margin data constrains underwriting visibility.
        - Condition underwriting conviction on detailed cohort net expansion and gross margin disclosure.
      - - Risk Rating
        - High
        - >-
          Multi-variable usage pricing risks customer churn, while warehouse vendors and incumbent marketing clouds
          represent structural platform absorption risk.
        - Require clear proof of defensibility in agentic decisioning layer beyond baseline reverse ETL.
      - - Valuation Stance
        - Expensive
        - >-
          $2.75B Series D valuation reflects an estimated ~27.5x multiple on $100M ARR, significantly exceeding public
          martech and data infrastructure medians (6x-10x).
        - Enforce entry discipline; seek secondary discounts or wait for growth to absorb the rich headline multiple.
    notes: >-
      Synthesis of valuation stance, recommendation conviction, risk profile, and underwriting requirements for
      Hightouch following its Series D financing.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Category
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - 'Thesis: Composable & Agentic Leadership'
        - >-
          Hightouch pioneered warehouse-native composable CDP and successfully expanded upward into agentic marketing
          and automated decisioning.
        - >-
          Backing from Goldman Sachs Alternatives and Bain Capital Ventures at $2.75B valuation; leadership recognition
          in Snowflake modern marketing report.
        - Loss of key enterprise accounts or failure of agentic decisioning workflows to demonstrate incremental ROI.
      - - 'Thesis: Enterprise Scale & Momentum'
        - >-
          High-velocity enterprise customer adoption across top consumer brands demonstrates product stickiness and
          commercial momentum.
        - >-
          Marquee enterprise customer base including Spotify, Domino's, Ramp, and DraftKings alongside EMEA go-to-market
          leadership expansion.
        - Deceleration in annual revenue growth below 50% or rising logo churn among tier-one enterprise brands.
      - - 'Anti-Thesis: Multi-Variable Cost Exposure'
        - >-
          Multi-variable pricing across syncs, destinations, and features creates billing unpredictability and risks
          customer cost friction as usage scales.
        - >-
          Third-party implementation analysis highlights steep learning curves, SQL dependency, and escalating costs
          with sync frequency.
        - >-
          Transition to transparent, predictable pricing models or automated sync-cost optimization tools that eliminate
          surprise bills.
      - - 'Anti-Thesis: Valuation Multiple & Platform Absorption'
        - >-
          At an estimated ~27.5x ARR multiple, the valuation leaves no margin of safety against warehouse vendors
          building native activation or martech consolidation.
        - >-
          Warehouse vendors (Snowflake, Databricks) and CRM leaders (Salesforce Data Cloud) actively investing in native
          activation capabilities.
        - >-
          Sustained durable growth >100% with audited gross margins >80% and proven expansion of the AI context layer
          beyond warehouse sync.
    notes: >-
      Structured comparison of investment thesis pillars against disconfirming anti-thesis risks and underwriting pivot
      conditions.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR grows from $100M to $350M over 3 years (>50% CAGR); AI decisioning attaches to >60% of accounts; gross
          margin expands to 78%; net revenue retention exceeds 130%.
        - >-
          Valued at 15x forward revenue at exit, yielding $5.25B enterprise value (1.9x MOIC, ~24% annualized IRR from
          $2.75B entry).
        - >-
          Platform absorption by Snowflake or Databricks fails to materialize; enterprise marketing budgets consolidate
          into agentic platforms.
        - 25%
      - - Base Case
        - >-
          ARR expands to $240M over 3 years (~34% CAGR); composable CDP remains dominant with moderate AI decisioning
          attach; NRR stabilizes at 115%; gross margin at 72%.
        - >-
          Multiple compresses to 10x revenue at exit, yielding $2.40B enterprise value (0.87x MOIC, flat to slightly
          negative return vs $2.75B Series D mark).
        - >-
          Growth decelerates as market saturates; warehouse native features reduce willingness to pay for standalone
          activation add-ons.
        - 50%
      - - Bear Case
        - >-
          ARR decelerates to $160M over 3 years (~17% CAGR); native warehouse activation features erode reverse ETL
          pricing power; CFO and sales turnover creates execution drag.
        - >-
          Multiple contracts to 6x revenue (in line with broader public martech median), resulting in $960M enterprise
          value (0.35x MOIC, down-round or severe dilution).
        - >-
          Executive departures disrupt go-to-market execution; customers shift to built-in
          Snowflake/Databricks/Salesforce activation tools.
        - 25%
    notes: >-
      Three-year underwriting scenario projections modeling revenue trajectories, exit multiples, MOIC outcomes, and
      downside triggers.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
