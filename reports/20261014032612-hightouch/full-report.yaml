chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Model, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              Hightouch is a San Francisco-based customer data activation and agentic marketing platform founded in
              2018. The company originated the commercial reverse ETL category by enabling enterprise data teams to sync
              modeled customer records directly from cloud data warehouses—including Snowflake, Google BigQuery,
              Databricks, and Amazon Redshift—to over 250 operational business tools and advertising destinations.
              Rather than forcing organizations to ingest events into a secondary, proprietary database schema,
              Hightouch positions the customer data warehouse as the single source of truth. The company has since
              expanded upstream into marketer-facing visual audience segmentation, real-time identity resolution,
              personalization APIs, and autonomous marketing agents. Operating as a late-stage venture-backed private
              enterprise, Hightouch is recognized in Gartner Customer Data Platform research and serves leading consumer
              and B2B brands such as Domino's, Autotrader, Cars.com, Aritzia, and PetSmart.
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Hightouch was founded by Tejas Manohar, Kashish Gupta, and Josh Curl following their participation in the
              Y Combinator Winter 2019 (W19) batch. The initial founding insight emerged directly from Manohar's
              engineering experience at Segment, where customers routinely struggled to extract warehouse-modeled data
              back into downstream operational tools. The company operates under a co-chief executive governance
              structure, with Tejas Manohar and Kashish Gupta serving as Co-CEOs. Manohar spearheads core product
              architecture, technical vision, and platform expansion, while Gupta directs commercial execution,
              strategic alliances, and enterprise go-to-market operations. Co-founder Josh Curl contributed foundational
              systems engineering to establish high-throughput, fault-tolerant warehouse pipelines. Executive leadership
              displays high founder-market fit across modern data stack infrastructure, though strategic continuity
              remains heavily dependent on the co-CEOs' ongoing stewardship.
            claimRefs:
              - CO001
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
      - number: '1.3'
        title: Funding History, Valuation Milestones, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Hightouch has raised over $282 million in cumulative venture capital across multiple funding rounds since
              its 2019 commercial launch. After securing early venture backing from Sequoia Capital, Bain Capital
              Ventures, ICONIQ Capital, and Sapphire Ventures, the company reached initial unicorn valuation status in
              2022. Momentum continued with an $80 million financing round at a $1.2 billion valuation in February 2025.
              On April 29, 2026, Hightouch announced a $150 million Series D financing round at a $2.75 billion
              post-money valuation co-led by Goldman Sachs and Bain Capital Ventures. This capital infusion reflects
              institutional investor conviction that marketing infrastructure is transitioning from basic generative
              content generation toward deeply integrated, data-grounded agentic execution. However, private cap table
              terms, liquidation preference seniority, and secondary sales discounts remain confidential, warranting
              thorough investor diligence.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO004
              - CO006
      - number: '1.4'
        title: Commercial Milestones, Product Evolution, and Operational Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Hightouch's commercial trajectory reflects aggressive category creation and product scope expansion.
              Following its Y Combinator graduation in 2019, the platform defined the reverse ETL standard before
              executing an explicit strategic pivot in 2022 toward composable customer data platforms. At Cannes Lions
              2026, Snowflake recognized Hightouch as a Category Leader for Activation and Delivery in its Modern
              Marketing Data Stack report. Despite strong ecosystem validation, independent evaluations reveal material
              operational and cost tradeoffs. McGaw notes that Hightouch's multi-variable pricing model creates
              forecasting hurdles, while zero-copy architectures often shift expenses to underlying warehouse compute
              bills and internal engineering payrolls. Furthermore, enterprise user reviews on AWS Marketplace identify
              platform clunkiness, interface bugs when cloning syncs, and limitations in exporting journey data for
              off-platform testing.
            claimRefs:
              - CO002
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO014
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Architectural Shift to Composable Activation
            body: >-
              Hightouch's commercial momentum stems from riding enterprise data warehouse gravity. By turning Snowflake,
              BigQuery, Databricks, and Redshift into the customer record of truth rather than maintaining a redundant
              external storage silo, Hightouch established defensibility against legacy CDPs like Segment while
              expanding directly into marketer-facing studio workflows.
            calloutType: insight
            claimRefs:
              - CO008
              - CO014
          - type: callout
            title: Hidden Cost Shifting and Interface Friction
            body: >-
              Independent analysis from McGaw and customer reviews on AWS Marketplace indicate that zero-copy
              architecture shifts infrastructure expense to underlying warehouse compute queries. Furthermore, complex
              multi-variable sync pricing, sync cloning bugs, and the conceptual division between reverse ETL and
              Customer Studio create operational friction for non-technical growth teams.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The enterprise customer data landscape is undergoing an architectural restructuring driven by data
              warehouse centralisation. Historically, enterprises purchased monolithic, packaged customer data platforms
              such as Salesforce Data Cloud, Adobe Real-Time CDP, or standalone solutions like Twilio Segment to
              collect, store, and segment customer event data in proprietary vendor repositories. In contrast, Hightouch
              defines and anchors the warehouse-native composable CDP category, which decouples data storage from
              activation. Rather than duplicating sensitive customer records into external SaaS silos, Hightouch
              activates existing models directly from authoritative enterprise data warehouses including Snowflake,
              Databricks, Google BigQuery, and Amazon Redshift. Addressable enterprise software spend includes dedicated
              reverse-ETL data activation pipelines, audience-building interfaces, identity resolution tooling, and
              downstream marketing workflow automation. Excluded spend encompasses low-level data extraction and loading
              (ELT) pipelines managed by tools like Fivetran, internal warehouse infrastructure compute fees, and
              downstream messaging delivery infrastructure such as ESPs or ad network inventory.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Addressable Spend, and Growth Projections
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for Hightouch requires triangulating multiple analytical lenses across
              dedicated software categories and broader martech ecosystems. Credible market research estimates place the
              worldwide customer data platform market between $4.58B and $10.49B in 2026, depending on whether ancillary
              integration services and adjacent martech products are bundled. Institutional analyst consensus
              triangulates core 2026 CDP software spend at approximately $5B to $6B, with IDC estimating the sector at
              $5.7B+. Long-term market projections forecast a rapid 27.8% compound annual growth rate, expanding the
              global market footprint to $58.41B by 2033. Within this broader universe, Hightouch's serviceable
              available market is concentrated among enterprise accounts with modern cloud data warehouse deployments
              that seek to eliminate duplicate profile storage taxes. By replacing six-figure packaged CDP fees with
              warehouse-native activation and expanding into an estimated multi-hundred-million-dollar agentic marketing
              layer for automated creative and campaign decisioning, Hightouch positions itself to capture expanding
              operational budgets beyond pure reverse ETL.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
