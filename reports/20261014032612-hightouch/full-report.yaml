        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Variable Pricing and Customer Warehouse Compute Drag
            body: >-
              Hightouch's multi-variable pricing structure—charging across destinations, sync schedules, and optional
              feature modules—creates forecasting challenges for enterprise buyers. Furthermore, because reverse ETL
              runs queries directly inside customer data warehouses like Snowflake, high-frequency synchronization can
              drive unexpected compute consumption on customer bills, introducing indirect margin pressure.
            calloutType: risk
            claimRefs:
              - CI003
              - CI009
          - type: callout
            title: Ecosystem-Driven Cloud Co-Selling Efficiency
            body: >-
              By aligning deeply with Snowflake and AWS Marketplace, Hightouch leverages cloud vendor commit budgets and
              co-selling programs to compress sales cycles and reduce direct outbound CAC, helping justify its premium
              Series D valuation despite unconfirmed private ARR metrics.
            calloutType: insight
            claimRefs:
