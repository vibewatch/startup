              - CU009
      - number: '6.2'
        title: Adoption Trajectory, Scale Milestones, and Revenue Velocity
        blocks:
          - type: paragraph
            body: >-
              Hightouch's commercial adoption accelerated markedly following the general availability of AI-driven
              marketing and orchestration workflows in late 2024. Secondary market analysis reports that the company
              added approximately $100 million in annual recurring revenue over a 20-month span, supported by enterprise
              budget reallocations toward warehouse-native agentic infrastructure. The company's expansion was further
              reinforced by a $150 million Series D financing round announced on April 29, 2026 at a $2.75 billion
              post-money valuation, led by Goldman Sachs and Bain Capital Ventures. While these top-line velocity
              indicators demonstrate rapid enterprise adoption across consumer-facing brands managing high-cardinality
              customer bases, private diligence cannot independently audit ARR product disaggregation, gross margin
              stability, or underlying cash burn.
            claimRefs:
              - CU002
              - CU007
              - CU011
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
