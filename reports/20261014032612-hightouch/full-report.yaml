  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Visual map of customer progression from technical data warehouse connection to autonomous agentic campaign
      orchestration.
    data:
      items:
        - label: Data Engineering Onboarding
          stage: Warehouse Connection
          persona: Data Engineer / Platform Architect
          action: Connects Snowflake, Databricks, or BigQuery to warehouse-native catalog
          touchpoints:
            - SQL model definitions
            - Schema synchronization
            - Destination connector mapping
          sentiment: 'Positive: removes custom API engineering overhead'
          painPoints: Setup requires comfort with warehouse SQL and schema modeling
        - label: Reverse ETL Operationalization
          stage: Pipeline Automation
          persona: Analytics Engineer / Marketing Operations
          action: Automates scheduled synchronization of customer records to CRMs and ad networks
          touchpoints:
            - Sync scheduling
            - Detailed execution logs
            - Sync failure alerting
          sentiment: 'Positive: granular error logs and robust alerting'
          painPoints: Multi-variable sync pricing creates forecasting uncertainty
        - label: Marketer Studio Adoption
          stage: No-Code Segmentation
          persona: Lifecycle Marketer / Growth Lead
          action: Builds visual audience segments and multi-step customer journeys without code
          touchpoints:
            - Customer Studio UI
            - Visual audience builder
            - Behavioral cohort filters
          sentiment: 'Empowered: eliminates engineering bottleneck for basic lists'
          painPoints: Conceptual overlap between engineering models and Customer Studio
        - label: Agentic Decisioning Deployment
          stage: AI Decisioning
          persona: Growth Marketing Director
          action: Deploys algorithmic next-best-action models on top of warehouse customer tables
          touchpoints:
            - Next-best-offer rules
            - Predictive churn triggers
            - Algorithmic decision logs
          sentiment: 'High upside: automated customer prioritization'
          painPoints: Requires data engineering to maintain underlying feature tables
        - label: Omnichannel Campaign Scaling
          stage: Omnichannel Activation
          persona: Digital Advertising Lead
          action: Coordinates dynamic audience syncs across ad networks and messaging platforms
          touchpoints:
            - Google and Meta ad syncs
            - Iterable and Braze streams
            - Real-time webhook routing
          sentiment: 'High efficiency: real-time ad suppression and targeting'
          painPoints: Destination API rate limits and sync frequency caps
        - label: Autonomous Workflow Orchestration
          stage: Full Agentic Marketing
          persona: Chief Marketing Officer
          action: Deploys autonomous marketing agents to draft campaigns, test creative, and measure outcomes
          touchpoints:
            - Agentic Marketing Platform
            - Brand governance controls
            - Automated campaign reporting
          sentiment: 'Strategic transformation: dramatic reduction in agency fees'
          painPoints: Export testing constraints and organizational trust hurdles
    approximationNotes: Synthesized from practitioner workflow reviews on AWS Marketplace/PeerSpot and G2.
