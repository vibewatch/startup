      - number: '5.2'
        title: Architecture, Deployment, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Hightouch leaves the warehouse as the source of truth and activates its models into
              downstream tools rather than operating as the primary profile store and message-delivery system. This can
              reduce persistent data duplication, centralize governance, and support flexible SQL- or model-driven
              activation. The tradeoff is coupling: useful deployment assumes clean warehouse data, maintained identity
              logic, sufficient query capacity, and data-engineering ownership. Hightouch can coordinate audiences and
              decisions, but delivery still depends on destination systems such as email, advertising, CRM, and
              engagement platforms. Streaming reverse ETL broadens latency-sensitive use cases, while independent
              comparison evidence still describes real-time event collection as secondary to the warehouse-activation
              core.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
