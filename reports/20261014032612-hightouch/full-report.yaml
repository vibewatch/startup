              - CU013
      - number: '6.3'
        title: Named Customer Deployments and Verified Operational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Official vendor disclosures and joint technology ecosystem publications validate enterprise deployments
              across major consumer brands, including Domino's, Autotrader, Cars.com, Aritzia, PetSmart, and automotive
              franchises deploying campaigns across flagship portals like Toyota and Lexus.co.uk. In production
              environments, enterprise practitioners leverage warehouse-native activation to pull web analytics and
              first-party telemetry, classify consumers into predictive behavioral tiers, and dispatch personalized
              omnichannel messaging directly via downstream destinations like Iterable. Verified customer outcomes
              demonstrate six-figure annual operational savings from preemptive churn and maintenance interventions,
              substantial reductions in third-party agency processing overhead, and faster campaign turnaround times due
              to eliminated engineering dependencies.
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
