  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Hightouch's core job is to move modeled customer data from a cloud warehouse into operational systems
              through reverse ETL. The product surface now spans the sync engine, Customer Studio for no-code audience
              construction, identity and personalization functions, AI Decisioning, and newer content and campaign
              tooling. In customer workflow terms, data engineers maintain warehouse models and connector mappings while
              marketers build audiences and journeys on those governed inputs. The split reduces recurring
              audience-request tickets, but it does not remove the need for engineering to maintain schemas and source
              data. One practitioner reported faster campaign launches and more than six figures of annual savings in a
              specific preventive-maintenance campaign; that result is a single customer report, not a general platform
              benchmark.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE009
              - CE013
