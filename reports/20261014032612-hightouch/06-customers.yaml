    body: "Verified production case studies demonstrate tangible financial return on investment for enterprise clients. Verified practitioner reviews cite over six figures in annual operational savings through automated predictive campaigns, reduced agency service fees, and accelerated time-to-market by enabling non-technical teams to deploy segments independently."
    claimRefs:
      - "CU005"
      - "CU008"
  - calloutType: "risk"
    title: "Critical Opacity Around Retention, Cohort Churn, and Pricing Predictability"
    body: "Despite high headline revenue velocity, Hightouch provides zero public visibility into net revenue retention (NRR), gross revenue retention (GRR), or customer account concentration. Furthermore, independent architectural analyses confirm that multi-variable pricing models and interface synchronization bugs create friction that could elevate enterprise churn risk if unaddressed."
    claimRefs:
      - "CU006"
      - "CU012"
      - "CU014"
      - "CU015"
