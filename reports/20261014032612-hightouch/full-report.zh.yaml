              - CP010
              - CP014
      - number: '3.3'
        title: 定价模式、切换摩擦与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Hightouch 主要通过按使用量分层的 Composable CDP 收费，核心指标是活跃同步任务数和同步频率；Agentic Marketing Platform 则另收每月个性化 action 费用。免费
              Basic 层最多支持 2 个活跃同步任务，企业层按报价收费。行业目录中的独立用户评价和客户评论指出，当多目的地营销运营扩张时，按同步计费的价格会非线性上涨，给数据团队带来意外成本增长和续约摩擦。

              可组合层的切换成本存在结构性不对称。客户记录仍留在客户自己的云数据仓库中，因此与从专有 CDP 孤岛提取数据相比，把原始数据迁移到另一家 reverse ETL
              供应商在技术上很直接。但运营切换成本仍然很高：企业部署会在 Customer Studio 内搭建复杂的受众层级、父子分群和触发器配置，同时维护复杂字段映射与自定义目的地
              webhook。更重要的是，reverse ETL 自带运营依赖：同步计划按周期运行（分钟到小时），不是真正的实时同步；同步运行时，PII 会反复复制到外部目的地边界；schema
              漂移或管道错误则会持续增加客户数据工程团队的值班维护负担。Hightouch 通过向上扩展到无代码受众工具、仓库内身份解析和代理式 campaign 决策来抵御商品化，但被数据仓库上游吸收仍是其长期首要战略威胁。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
