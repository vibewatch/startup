  - id: FM001
    title: 市场规模与可寻址支出金字塔
    type: pyramid
    summary: 从长期营销科技品类潜力逐层拆解到眼前的仓库数据激活和智能体营销软件支出。
    data:
      items:
        - label: 长期 CDP 生态总 TAM
          value: $58.4B (2033 Projection)
          detail: 企业客户数据和自动化运营带动全球软件与服务长期市场以 27.8% CAGR 扩张。
        - label: 综合客户数据平台市场
          value: $5.7B - $10.5B (2026)
          detail: 通过多重来源交叉估算传统与可组合客户数据平台的专用软件和实施支出。
        - label: 核心 CDP 软件许可专用支出
          value: $4.6B - $5.0B (2026)
          detail: 企业直接用于客户画像统一、身份解析和实时激活工具的软件支出。
        - label: 可组合与仓库原生 CDP SAM
          value: $1.5B - $2.0B (2026)
          detail: 面向运营云数据湖仓、希望避免第三方画像重复的机构的可触达市场。
        - label: 核心企业数据激活与反向 ETL SOM
          value: $400M - $600M (2026)
          detail: 将仓库模型同步至 250+ 个下游运营 SaaS 应用的即时可服务企业机会。
        - label: 智能体营销工作流软件扩张
          value: $200M - $350M (2026)
          detail: 面向自主创建营销活动、Ad Studio 创意生成和 AI 决策的新兴增量预算池。
    approximationNotes: 广义 CDP 数据反映 Grand View Research、Mordor Intelligence 和 IDC 的市场交叉估算；可组合 SAM、SOM 和智能体扩张估计则是受现代云仓库采用率约束的分析性分层。
