      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 上游 Lakehouse 侵入带来的结构性威胁
            body: >-
              对 Hightouch 长期利润率和平台防御力最具威胁的，不是直接的 reverse ETL 对手 Census，而是 Databricks、Snowflake 等上游云数据平台。Databricks 的
              CustomerLake（2026 年 6 月进入 Private Preview）表明，数据基础设施供应商可以把身份解析和受众分群直接吸收到 lakehouse 治理引擎中。如果数据仓库把原生 reverse
              ETL 和受众整理作为默认平台能力，Hightouch 能捕获多少可触达价值，将完全取决于其上游的 Customer Studio 和 Agentic Marketing Platform
              能否在商业营销人员中形成足够的软件锁定。
            calloutType: risk
            claimRefs:
              - CP004
              - CP014
          - type: callout
            title: 可组合技术栈的“两工具问题”与延迟取舍
            body: >-
              Hightouch 通过查询客户仓库消除了重复数据存储成本，但不会原生发送通信。买方必须分别订阅营销自动化平台（Braze、Iterable、Salesforce Marketing
              Cloud），由此产生集成脆弱性、跨供应商调试负担，以及按分钟到小时计算的批量同步延迟。这一结构性缺口给 Conversion 等一体化仓库原生替代方案留下市场机会，同时让企业数据工程团队持续承担同步管道维护。
            calloutType: insight
            claimRefs:
