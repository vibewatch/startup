        - 退出时按前瞻收入 15 倍估值，企业价值达到 $5.25B（MOIC 1.9 倍；以 $2.75B 入场计算，年化 IRR 约 24%）。
        - Snowflake 或 Databricks 吸收平台的情景没有发生；企业营销预算向智能体平台集中。
        - 25%
      - - 基准情景
        - ARR 在 3 年内增至 $240M（CAGR 约 34%）；可组合 CDP 继续占主导，AI 决策适度附加；NRR 稳定在 115%；毛利率为 72%。
        - 退出时倍数压缩至收入 10 倍，企业价值为 $2.40B（MOIC 0.87 倍；相对 $2.75B Series D 估值持平至略亏）。
        - 市场饱和后增长放缓；仓库原生功能降低客户为独立激活附加模块付费的意愿。
        - 50%
      - - 悲观情景
        - ARR 在 3 年内仅增至 $160M（CAGR 约 17%）；仓库原生激活功能削弱反向 ETL 的定价权；CFO 和销售团队更替拖累执行。
        - 倍数收缩至收入 6 倍（与更广泛公开营销科技公司中位数一致），企业价值为 $960M（MOIC 0.35 倍，面临下轮融资或严重稀释）。
        - 高管离职扰乱市场进入执行；客户转向 Snowflake、Databricks、Salesforce 内置的激活工具。
        - 25%
    notes: 这组三年投资判断情景预测模拟收入轨迹、退出倍数、MOIC 结果和下行触发因素。
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
