      - number: '3.2'
        title: 直接竞品、传统厂商与上游 Lakehouse 进入者
        blocks:
          - type: paragraph
            body: >-
              仓库原生激活的直接竞争以 Census 为核心；两家公司在 2019 年同时进入市场后形成双寡头。Fivetran 于 2025 年收购 Census 后，Fivetran Activations 把
              reverse ETL 绑定到现有数据摄取合同，按 Monthly Active Rows（MAR）计费，给 Hightouch 的独立合同续约带来捆绑压力。与此同时，RudderStack
              提供仓库原生事件采集和 reverse ETL，并设有开源自托管层，吸引希望避免供应商锁定和基础设施加价的开发者型工程团队。

              传统 CDP 厂商采取另一种架构取舍。Twilio Segment 提供成熟、开箱即用的实时事件摄取和 SDK 路由，目的地目录广泛，但按 Monthly Tracked
              Users（MTUs）收费；对管理数百万匿名访客画像的企业而言，这会造成定价摩擦和存储重复。Conversion 等新兴垂直竞品则挑战可组合技术栈的“两工具问题”：Hightouch
              把仓库数据激活到下游营销自动化平台（MAP），却不原生提供邮件投递或工作流执行；Conversion 则把仓库查询与原生邮件 campaign 投递、可视化旅程和双向 CRM 同步直接结合。Adobe（通过
              GenStudio 和 Brand Intelligence）及 Salesforce（通过 Agentforce 和 Data
              Cloud）等企业基础设施套件，也在自身企业软件边界内吸收代理式营销工作流，加大了对 Hightouch 新推出的 Agentic Marketing Platform 层的压力。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
