      - CM005
      - CM006
      - CM013
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对比客户数据平台和激活方案在架构仓库原生性及端到端营销活动执行范围上的相对位置。
    data:
      xAxis:
        label: 架构集成：专有存储 vs 仓库原生
        min: 0
        max: 10
      yAxis:
        label: 功能范围：单点反向 ETL vs 原生营销活动执行
        min: 0
        max: 10
      points:
        - label: Hightouch
          x: 8.8
          'y': 6.2
          description: 通过直接 SQL 查询实现高度仓库原生，并拓展到 Customer Studio 受众管理和 AI 决策。
        - label: Census (Fivetran)
          x: 8.5
          'y': 4
          description: 核心仓库原生反向 ETL，与 Fivetran 摄取管道紧密集成，但营销执行能力有限。
        - label: Databricks CustomerLake
