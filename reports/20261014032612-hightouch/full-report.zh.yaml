  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 以市场验证和客户牵引为起点，依次连接估值阻力，最终形成跟踪判断。
    data:
      nodes:
        - label: 市场验证与增长
          detail: 在 Goldman Sachs Alternatives 领投的 D 轮融资中筹得 $150M，估值达 $2.75B，年增长率超过 100%。
        - label: 企业客户牵引
          detail: 已部署于 Spotify、Domino's、Ramp 等企业品牌，并获得 Snowflake Modern Marketing 技术栈认可。
        - label: 代理式产品拓展
          detail: 从 reverse ETL 拓展至营销上下文层和 AI 决策编排。
        - label: 定价与运营阻力
          detail: 多变量定价复杂，技术学习曲线陡峭，带来客户留存和成本上升风险。
        - label: 估值倍数脱节
          detail: 隐含的 ARR 约 27.5 倍，显著高于上市公司可比标的，安全边际有限。
        - label: 建议：跟踪
          detail: 在审计财务数据、队列留存数据和倍数正常化之前，继续保持审慎的跟踪判断。
