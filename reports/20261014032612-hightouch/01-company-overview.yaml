company:
  name: Hightouch
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2018 in San Francisco, Hightouch originated the warehouse-native reverse ETL category and expanded into
    composable customer data activation and agentic marketing orchestration. Operating at a $2.75B valuation following its
    $150M Series D round in April 2026, the company serves over 800 enterprise brands while facing operational headwinds around
    warehouse compute cost shifting and multi-variable pricing complexity.
sections:
- id: identity-and-market-position
  title: Corporate Identity, Model, and Current Stage
  body: Hightouch is a San Francisco-based customer data activation and agentic marketing platform founded in 2018. The company
    originated the commercial reverse ETL category by enabling enterprise data teams to sync modeled customer records directly
    from cloud data warehouses—including Snowflake, Google BigQuery, Databricks, and Amazon Redshift—to over 250 operational
    business tools and advertising destinations. Rather than forcing organizations to ingest events into a secondary, proprietary
    database schema, Hightouch positions the customer data warehouse as the single source of truth. The company has since
    expanded upstream into marketer-facing visual audience segmentation, real-time identity resolution, personalization APIs,
    and autonomous marketing agents. Operating as a late-stage venture-backed private enterprise, Hightouch is recognized
    in Gartner Customer Data Platform research and serves leading consumer and B2B brands such as Domino's, Autotrader, Cars.com,
    Aritzia, and PetSmart.
  claimRefs:
  - CO001
  - CO003
  - CO008
  - CO010
  - CO015
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founders, Executive Leadership, and Governance
  body: Hightouch was founded by Tejas Manohar, Kashish Gupta, and Josh Curl following their participation in the Y Combinator
    Winter 2019 (W19) batch. The initial founding insight emerged directly from Manohar's engineering experience at Segment,
    where customers routinely struggled to extract warehouse-modeled data back into downstream operational tools. The company
    operates under a co-chief executive governance structure, with Tejas Manohar and Kashish Gupta serving as Co-CEOs. Manohar
    spearheads core product architecture, technical vision, and platform expansion, while Gupta directs commercial execution,
    strategic alliances, and enterprise go-to-market operations. Co-founder Josh Curl contributed foundational systems engineering
    to establish high-throughput, fault-tolerant warehouse pipelines. Executive leadership displays high founder-market fit
    across modern data stack infrastructure, though strategic continuity remains heavily dependent on the co-CEOs' ongoing
    stewardship.
  claimRefs:
  - CO001
  - CO007
  tableRefs:
  - TO002
- id: capitalization-and-stakeholder-profile
  title: Funding History, Valuation Milestones, and Stakeholder Profile
  body: Hightouch has raised over $282 million in cumulative venture capital across multiple funding rounds since its 2019
    commercial launch. After securing early venture backing from Sequoia Capital, Bain Capital Ventures, ICONIQ Capital, and
    Sapphire Ventures, the company reached initial unicorn valuation status in 2022. Momentum continued with an $80 million
    financing round at a $1.2 billion valuation in February 2025. On April 29, 2026, Hightouch announced a $150 million Series
    D financing round at a $2.75 billion post-money valuation co-led by Goldman Sachs and Bain Capital Ventures. This capital
    infusion reflects institutional investor conviction that marketing infrastructure is transitioning from basic generative
    content generation toward deeply integrated, data-grounded agentic execution. However, private cap table terms, liquidation
    preference seniority, and secondary sales discounts remain confidential, warranting thorough investor diligence.
  claimRefs:
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO003
- id: milestones-and-operational-tradeoffs
  title: Commercial Milestones, Product Evolution, and Operational Tradeoffs
  body: Hightouch's commercial trajectory reflects aggressive category creation and product scope expansion. Following its
    Y Combinator graduation in 2019, the platform defined the reverse ETL standard before executing an explicit strategic
    pivot in 2022 toward composable customer data platforms. At Cannes Lions 2026, Snowflake recognized Hightouch as a Category
    Leader for Activation and Delivery in its Modern Marketing Data Stack report. Despite strong ecosystem validation, independent
    evaluations reveal material operational and cost tradeoffs. McGaw notes that Hightouch's multi-variable pricing model
    creates forecasting hurdles, while zero-copy architectures often shift expenses to underlying warehouse compute bills
    and internal engineering payrolls. Furthermore, enterprise user reviews on AWS Marketplace identify platform clunkiness,
    interface bugs when cloning syncs, and limitations in exporting journey data for off-platform testing.
  claimRefs:
  - CO002
  - CO009
  - CO011
  - CO012
  - CO013
  - CO014
