callouts:
- calloutType: insight
  title: The Architectural Shift to Composable Activation
  body: Hightouch's commercial momentum stems from riding enterprise data warehouse gravity. By turning Snowflake, BigQuery,
    Databricks, and Redshift into the customer record of truth rather than maintaining a redundant external storage silo,
    Hightouch established defensibility against legacy CDPs like Segment while expanding directly into marketer-facing studio
    workflows.
  claimRefs:
  - CO008
  - CO014
- calloutType: risk
  title: Hidden Cost Shifting and Interface Friction
  body: Independent analysis from McGaw and customer reviews on AWS Marketplace indicate that zero-copy architecture shifts
    infrastructure expense to underlying warehouse compute queries. Furthermore, complex multi-variable sync pricing, sync
    cloning bugs, and the conceptual division between reverse ETL and Customer Studio create operational friction for non-technical
    growth teams.
  claimRefs:
  - CO011
  - CO012
  - CO013
