callouts:
  - calloutType: risk
    title: The Warehouse Disintermediation Paradox
    body: Hightouch core strategic advantage—its warehouse-native architecture that avoids data duplication—is simultaneously its primary existential vulnerability. As Snowflake, Databricks, and Salesforce Data Cloud increasingly invest in native outbound activation connectors, Hightouch must maintain rapid product velocity in marketer-facing layers (Customer Studio, MatchBoost, AI Decisioning) to avoid being commoditized into a thin SQL sync utility.
    claimRefs:
      - CR008
      - CR009
  - calloutType: insight
    title: Hidden Infrastructure Compute Drag
    body: Enterprise total cost of ownership often diverges sharply from software licensing fees. Because reverse ETL queries run directly against production data warehouses, high-frequency syncs and unoptimized audience models generate substantial auxiliary Snowflake and BigQuery compute consumption, compounding the unpredictability of usage-based software pricing.
    claimRefs:
      - CR004
      - CR005
