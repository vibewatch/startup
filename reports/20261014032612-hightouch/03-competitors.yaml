callouts:
  - calloutType: "risk"
    title: "Structural Threat from Upstream Lakehouse Encroachment"
    body: |
      The most formidable threat to Hightouch's long-term margin and platform defensibility is not direct reverse ETL rival Census, but upstream cloud data platforms like Databricks and Snowflake. Databricks' CustomerLake (Private Preview in June 2026) demonstrates that data infrastructure providers can absorb identity resolution and audience segmentation directly into lakehouse governance engines. If data warehouses offer native reverse ETL and audience curation as default platform capabilities, Hightouch's addressable value capture will depend entirely on whether its upstream Customer Studio and Agentic Marketing Platform create sufficient software lock-in among business marketers.
    claimRefs:
      - "CP004"
      - "CP014"
  - calloutType: "insight"
    title: "The Composable Stack's 'Two-Tool Problem' and Latency Trade-Off"
    body: |
      While Hightouch eliminates the cost of duplicate data stores by querying the customer warehouse, it does not send communications natively. Buyers must maintain separate subscriptions to marketing automation platforms (Braze, Iterable, Salesforce Marketing Cloud), creating integration fragility, cross-vendor debugging overhead, and batch sync latencies measured in minutes to hours. This structural gap creates market opportunity for all-in-one warehouse-native alternatives such as Conversion, while subjecting enterprise data engineering teams to ongoing sync pipeline maintenance.
    claimRefs:
      - "CP008"
      - "CP012"
      - "CP015"
