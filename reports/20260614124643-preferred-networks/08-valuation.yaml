- id: comparable-multiples
  title: Comparable Multiples
  body: 'The comparable set is deliberately split rather than blended into a single headline multiple. NVIDIA and AMD inform
    AI-chip upside, but they are scaled public semiconductor companies with supply-chain, gross-margin and platform advantages
    PFN has not publicly demonstrated. Palantir, C3.ai and UiPath help frame enterprise-AI software multiples, but they are
    also software-purer than PFN’s mix of chips, cloud, robotics and materials-simulation services. Fanuc, CYBERDYNE and SenseTime
    push in the opposite direction by showing that robotics and AI implementation businesses can trade at lower multiples
    when growth, margins or regulatory exposure disappoint. Private comps widen the range: OpenAI and Anthropic demonstrate
    how expensive frontier-model scarcity can become, while Cohere, Mistral, Figure, Wayve and Sakana AI are closer but still
    imperfect. The Sakana AI data point is particularly relevant: a reported $1.5 billion valuation narrows PFN’s Japan-AI
    scarcity premium and weakens simplistic claims that PFN automatically deserves the highest local AI multiple.'
