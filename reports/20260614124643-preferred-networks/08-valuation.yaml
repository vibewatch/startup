- id: exit-paths-liquidity
  title: Exit Paths and Liquidity
  body: 'PFN has plausible but not immediate liquidity routes. A Tokyo Stock Exchange Growth Market IPO is more plausible
    than Prime in a near-term scenario because PFN is still a private, venture-backed technology company, but JPX guidance
    makes clear that listing is an audited, multi-step process rather than an announcement-driven event. Public sources reviewed
    here do not show audited financial statements, public-company governance readiness or a near-term IPO filing. Strategic
    M&A may therefore be the more credible earlier path, especially after Toyota, SBI, Mitsubishi-related investors and MHI
    each signaled industrial interest. Potential buyers would not be valuing a generic AI lab: they would be underwriting
    chips, cloud infrastructure, robotics, materials simulation and Japan-sovereign AI positioning. The recommendation is
    research-more with a stretched valuation stance. Upgrade only if diligence proves high-margin recurring revenue, chip
    demand, credible PLaMo commercialization and clean preference economics; downgrade to avoid if the alleged valuation reset
    is corroborated or if ARR and gross margins remain undisclosed.'
