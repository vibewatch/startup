company:
  name: Preferred Networks, Inc.
chapter:
  number: 8
  title: Valuation
  summary: Preferred Networks has exceptional strategic validation, but its investable valuation remains unproven because
    the last clean valuation anchor is the 2017 Toyota round and later 2024–2025 financings did not disclose post-money values.
    Public comps and private AI/robotics rounds support a wide $1.0–6.0B scenario range, making the recommendation research-more
    and the valuation stance stretched at any unconfirmed $2.5–3.0B entry price.
sections:
- id: round-history-and-implied-valuation
  title: Round History and Implied Valuation
  body: 'Preferred Networks’ valuation file has one unusually old but still important anchor: the August 2017 Toyota financing.
    PFN’s own release confirms Toyota invested about ¥10.5 billion, while independent coverage reported the round as roughly
    $95 million and associated it with a multi-billion-dollar implied value. That remains the last clean external valuation
    marker because the 2024 and 2025 releases disclose capital but not post-money valuation. The December 2024 first close
    was meaningful—¥19 billion across equity led by SBI Group plus debt from banks—and it was followed by ¥5 billion in April
    2025 plus an undisclosed June 2025 extension. These financings are strategically positive because they add SBI, Development
    Bank of Japan, Mitsubishi Corporation and Wacom to Toyota’s historical support base. They are not, however, valuation
    proof. Publicly available evidence supports a conservative conclusion: PFN is still a unicorn-quality asset, but any claimed
    $2.5–3.0 billion valuation for the 2024–2026 window is unconfirmed and should be treated as a diligence hypothesis rather
    than a fact.'
