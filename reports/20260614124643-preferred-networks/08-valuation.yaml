  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation gap
    missingEvidence: Current post-money valuation, price per share, fully diluted share count, debt terms and liquidation
      preferences for the 2024 and 2025 financings.
    whyItMatters: Without these inputs, investors cannot distinguish a true up-round from a strategic financing with downside-protective
      terms.
    diligencePath: Request the cap table, financing documents, 409A valuation and board-approved fully diluted share count
      from PFN counsel and CFO.
    relatedQuestionRefs:
    - QV003
    - QV018
    - QV020
    relatedTableRefs:
    - TV001
    - TV008
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR
    missingEvidence: Audited revenue, ARR, gross margin, segment contribution and customer concentration by chips, PLaMo,
      robotics, PFP and cloud.
    whyItMatters: Revenue and margin are required to turn comparable multiples and sum-of-parts estimates into an investable
      valuation.
    diligencePath: Request audited FY2023-FY2026 statements, management accounts, ARR bridge, cohort retention and segment
      gross-margin schedules.
    relatedQuestionRefs:
    - QV011
    - QV019
    - QV028
    relatedTableRefs:
    - TV005
    - TV008
  - type: conflicting-data
    severity: material
    topic: valuation skepticism
    missingEvidence: Reliable corroboration or rebuttal of the adverse valuation-decline report from a high-reputation source
      or official financing document.
    whyItMatters: A confirmed down-round or effective common-equity value decline would change the valuation stance from stretched
      to expensive.
    diligencePath: Cross-check press reports against financing term sheets, 409A marks, secondary indications and investor-side
      diligence memos.
    relatedQuestionRefs:
    - QV004
    - QV023
    - QV030
    relatedTableRefs:
    - TV006
    - TV008
  - type: enumeration-incomplete
    severity: minor
    topic: TV003 public comparable valuation table sample coverage
    missingEvidence: A complete statistical peer screen with all listed AI, semiconductor, software and robotics companies
      and normalized current enterprise values.
    whyItMatters: The public comparable table is intentionally representative; a full banker-style comp set could shift the
      blended multiple.
    diligencePath: Export a Capital IQ, FactSet or Bloomberg peer screen with standardized EV, revenue, EBITDA and growth
      metrics as of the investment committee date.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV008
    - QV022
    relatedTableRefs:
    - TV003
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 private AI and robotics comparable sample coverage
    missingEvidence: Full private-company cap table terms, liquidation preferences, revenue scale and secondary marks for
      each private comp.
    whyItMatters: Headline private valuations are not directly comparable common-equity values and may overstate ordinary-share
      economics.
    diligencePath: Request banker databases and investor memos for the private rounds, including share class, preference and
      revenue data.
    relatedQuestionRefs:
    - QV009
    - QV010
    relatedTableRefs:
    - TV004
