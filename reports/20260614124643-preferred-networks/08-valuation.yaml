- id: scenario-and-sum-of-parts
  title: Scenario and Sum-of-Parts Valuation
  body: The most defensible methodology is sum-of-parts plus scenario analysis. A single revenue multiple would create false
    precision because PFN does not publicly disclose revenue, ARR, segment margin, customer concentration or unit economics.
    The model therefore assigns separate value ranges to AI chips, PLaMo and enterprise AI, robotics, materials/drug-discovery
    software, cloud infrastructure and strategic option value. The base case produces approximately $2.0–2.8 billion, roughly
    consistent with a high-quality Japan AI unicorn but not enough to guarantee venture returns at the top of the rumored
    range. The bear case is $1.0–1.6 billion if AI valuation reset pressure, hardware margin drag and weak recurring revenue
    dominate. The bull case is $4.0–6.0 billion, but it requires proof that MN-Core or PLaMo can behave more like scarce AI
    infrastructure than like bespoke Japanese industrial R&D. At a $2.5 billion entry, a 3x target return requires a $7.5
    billion exit; at $3.0 billion, it requires $9.0 billion, before dilution or liquidation preferences.
  claimRefs:
  - CV029
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
