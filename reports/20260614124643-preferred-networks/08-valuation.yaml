callouts:
- calloutType: recommendation
  title: Research-more, not buy, until valuation proof exists
  body: PFN has rare strategic validation and credible Japan-sovereign AI positioning, but public evidence does not verify
    a current post-money valuation, revenue, ARR, margin or preference stack. At rumored $2.5–3.0B pricing, the margin for
    error is too narrow for a buy recommendation without data-room support.
  claimRefs:
  - CV008
  - CV039
  - CV042
  - CV043
  - CV045
- calloutType: risk
  title: Valuation reset risk is not proven but cannot be ignored
  body: 'The adverse valuation-reset source is low reputation and conflicts with primary financing releases, yet it flags
    the exact risk investors must diligence: whether new capital was raised at a lower effective common-equity value than
    PFN’s historical unicorn narrative implies.'
