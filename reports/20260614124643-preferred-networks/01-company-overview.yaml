company:
  name: Preferred Networks, Inc.
chapter:
  number: 1
  title: Company Overview
  summary: Preferred Networks is a Tokyo-based, founder-led AI company vertically integrating semiconductors, compute
    infrastructure, foundation models and industrial AI applications. Public evidence supports strong strategic
    backing and recent 24 billion yen financing, but revenue, customer count, headcount and exact valuation remain
    private-company diligence gaps.
sections:
- id: identity-overview
  title: Identity, scope and operating model
  body: 'Preferred Networks, Inc. (PFN) is a Tokyo-based private AI company established on March 26, 2014 and headquartered
    at Otemachi Building in Chiyoda-ku. The company’s own mission statement — “Make the real world computable and
    create the future together” — is unusually broad, but its public materials make the operating scope concrete:
    PFN works vertically from AI chips and in-house supercomputing to foundation models, industrial solutions and
    applications. That makes the company less comparable to a pure software startup and more comparable to an integrated
    AI infrastructure-and-applications lab with strategic commercialization paths. Publicly evidenced domains include
    manufacturing, mobility, energy, materials, life sciences, entertainment, finance, public services and education.
    Revenue, ARR, margin and customer-count data are not publicly disclosed in reviewed sources, so later chapters
    should treat PFN as late-stage private with strong strategic validation but incomplete financial transparency.'
  claimRefs:
  - CO001
  - CO002
  - CO007
  - CO008
  - CO022
  - CO037
  - CO042
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership
  title: Founders, leadership and governance
  body: 'PFN remains founder-led. The reviewed company page lists Toru Nishikawa as Co-Founder and Chairman and
    Daisuke Okanohara as Co-Founder and Chief Executive Officer, while the co-founders’ message emphasizes a company
    built by people who “love computer science and technology” and want to master every layer of computing. This
    founder continuity is a strength for technical coherence and partner trust, but it also creates key-person concentration:
    the two co-founders still anchor strategy, corporate narrative and technical direction more than a broad professionalized
    management slate visible to outsiders. PFN does disclose a governance layer: directors include Hiroshi Maruyama
    and outside audit-and-supervisory committee directors, and executives include COO Naoto Ono, CFO Yotaro Katayama
    and VP of Engineering Masaaki Fukuda. No public source reviewed disclosed compensation, ownership percentages,
    succession plans or full board voting arrangements.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO038
  - CO040
  tableRefs:
  - TO002
  figureRefs: []
- id: funding-capital
  title: Funding history, valuation signals and stakeholders
  body: 'PFN’s capital history is dominated by strategic Japanese industrial and financial backers. Toyota invested
    1.0 billion yen in 2015 and an additional approximately 10.5 billion yen in 2017, making Toyota the largest
    external shareholder at that time. FANUC invested 900 million yen in 2015, and PFN’s milestone chronology adds
    2017 capital tie-ups with Hakuhodo DY, Mitsui, Mizuho and Hitachi. Recent financing shifted the story from mobility/robotics
    R&D toward Japan-made AI semiconductors and compute infrastructure: SBI agreed to invest up to 10 billion yen
    in 2024; PFN then announced a 19 billion yen first close in December 2024 and a 5 billion yen extension in April
    2025, bringing that round to 24 billion yen to date. Independent press supports unicorn framing, but exact post-money
    valuation and cap-table ownership remain private, so valuation should be treated as media/market-data supported
    rather than audited.'
