  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, fully diluted share count, liquidation preferences and secondary
      activity for the 2024–2025 financing.
    whyItMatters: Valuation discipline and investor economics cannot be assessed from round size alone.
    diligencePath: Request cap table, financing documents, investor presentation and any valuation memos from the
      company or lead investors.
    relatedQuestionRefs:
    - QO029
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-scale
    missingEvidence: Revenue, ARR, gross margin, customer count, backlog, contract values and customer concentration
      by line of business.
    whyItMatters: Strategic partnerships may not translate into recurring revenue or scalable margins.
    diligencePath: Request management accounts, signed contracts, pipeline report, revenue bridge and cohort/customer
      concentration schedule.
    relatedQuestionRefs:
    - QO030
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-board
    missingEvidence: Full board observer list, investor governance rights, option pool, management succession plan
      and compensation.
    whyItMatters: Founder-led governance and strategic investor rights may affect control, exit optionality and
      conflict management.
    diligencePath: Review shareholders agreement, board minutes, option plan and management organization chart.
