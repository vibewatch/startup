companyProfile:
  summary: Preferred Networks (PFN) is a Tokyo-based deep-learning company founded in March 2014 by Toru Nishikawa and Daisuke Okanohara as a spin-out from Preferred Infrastructure. PFN positions itself as a vertically integrated AI platform, designing its own MN-Core deep-learning accelerator with Kobe University, operating large-scale GPU and MN-Core computing infrastructure, training the PLaMo foundation-model series under Japan's NEDO GENIAC program, and applying these capabilities to industrial robotics (Fanuc), automotive perception (Toyota), materials discovery (Matlantis with ENEOS), drug discovery (Chugai Pharmaceutical), agriculture (CraftyFarm with Oisix) and consumer robotics (Kachaka via Preferred Robotics). It is widely cited as Japan's most valuable private AI startup.
  foundedDate: '2014-03-26'
  founders:
    - name: Toru Nishikawa
      role: Co-founder, Chairman (prior CEO)
      background: University of Tokyo computer-science alumnus and co-founder of Preferred Infrastructure (2006); PFN's longtime CEO before transitioning to Chairman, with a deep-learning research and engineering background.
      claimRefs:
        - CO003
        - CO004
    - name: Daisuke Okanohara
      role: Co-founder, Executive Vice President / Chief Executive Researcher
      background: University of Tokyo natural-language-processing and information-theory researcher; co-founded Preferred Infrastructure in 2006 and PFN in 2014, leading long-horizon research strategy.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Tokyo, Japan
  headquarters: Otemachi, Tokyo, Japan
  productSummary: PFN sells (a) MN-Core deep-learning accelerator silicon and systems (including the L1000 LLM-inference part); (b) computing-infrastructure access (PFN cloud, KDDI partnership); (c) the PLaMo foundation-model family; (d) Matlantis cloud atomistic-simulation for materials and chemistry (joint venture with ENEOS); (e) industrial-AI / robotics solutions for Fanuc, Toyota and other large enterprises; and (f) consumer robotics through Preferred Robotics' Kachaka. Revenue is reported as a mix of solutions / licensing, chip and system sales, cloud and SaaS subscriptions, and research-grant or co-development income.
  customerFocus: Large Japanese industrial groups (automotive, factory automation, energy, materials, pharma), Japanese government and academic research programs, and a growing layer of Japanese-language LLM and atomistic-simulation enterprise customers; consumer reach is limited to the Kachaka home-robot pilot.
  businessModel: Hybrid IP / hardware / software model — research-and-development services and co-development with strategic anchors (Toyota, Fanuc, ENEOS, Chugai); MN-Core chip and MN-3 / MN-Core 2 system sales; Matlantis and PFN-cloud subscription revenue; PLaMo licensing and government-funded compute (NEDO GENIAC); plus equity-style partnerships where lead investors are also lead customers.
  stage: Late-stage private (Japanese kabushiki kaisha; widely classified as a unicorn)
  fundingStatus: December 2024 ¥19B first close (SBI-led equity plus debt from MUFG, Resona, Shoko Chukin and SMBC), extended to a ¥24B series by April 2025; layered on top of historic Toyota (¥1B 2015, ¥10.5B 2017), Fanuc, NTT, Mitsui, Mizuho and Hitachi rounds, taking lifetime disclosed funding well above ¥40B. The Bridge and Latka peg current valuation around ¥300B / $2B, while PremierAlts secondary marks indicate a materially lower $1.0B as of June 2025.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO001
