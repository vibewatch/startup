    - CI015
summary:
  headline: Preferred Networks remains Japan's most credible vertically integrated AI platform, but a thinly disclosed revenue base and a conflicted ($1.0B vs $2B+) third-party valuation make the headline unicorn price hard to underwrite from public evidence alone.
