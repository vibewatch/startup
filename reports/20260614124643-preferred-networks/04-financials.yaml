    - TI007
  - type: missing-source
    severity: material
    topic: KDDI commercial traction
    missingEvidence: Official PFN, KDDI, or contract evidence verifying the claimed 1,000-chip or GPU sale.
    whyItMatters: A large KDDI order would materially change revenue visibility and chip commercialization risk.
    diligencePath: Request customer contract, purchase order, PFN/KDDI announcement, or bankable customer reference.
    relatedQuestionRefs:
    - QI027
