- id: revenue-traction-and-disclosure-gaps
  title: Revenue Traction and Disclosure Gaps
  body: 'PFN does not publish the revenue, ARR, gross margin, cash balance, or burn-rate package needed for a conventional
    private-company underwriting model. The retained evidence therefore supports only an estimate range and a disclosure verdict.
    Craft lists FY2023 revenue of 7.7 billion yen; Latka lists 2024 revenue of $42 million; Growjo estimates $49.5 million;
    AI Market Watch points to a historical 8.486 billion yen metric and a 280–340 employee range; RocketReach gives a much
    lower $15.3 million 2026 figure that looks like an outlier. The defensible approach is to use the middle cluster as directional
    evidence and explicitly exclude it from audited financial treatment. The revenue model itself appears diversified: partner
    co-creation, AI solutions, PFCP cloud compute, proprietary AI chips, PLaMo-related products, and potentially joint-venture
    compute services. But segment revenue, recurring mix, customer concentration, backlog conversion, and revenue recognition
    remain private evidence only.'
