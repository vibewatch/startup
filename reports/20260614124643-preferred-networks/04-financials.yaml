- id: TI007
  title: Public Financial Gaps and Diligence Path
  columns:
  - Missing Metric
  - Severity
  - Why It Matters
  - Exact Diligence Path
  rows:
  - - Audited revenue and revenue recognition
    - Blocking
    - Valuation sensitivity depends on realized revenue, not press-release financing amounts
    - Request audited or management-prepared financial statements and recognition policy
  - - Segment revenue by chips, PFCP, PLaMo, and services
    - Material
    - Mix determines margin path and revenue quality
    - Request product-line P&L and top-customer contracts
  - - Gross margin by segment
    - Blocking
    - Hardware/cloud/service/software margins differ materially
    - Request COGS bridge and fully loaded gross margin
  - - Cash balance and monthly burn
    - Blocking
    - Runway cannot be calculated from public sources
    - Request bank cash report and monthly cash-flow forecast
  - - Debt terms and security
    - Material
    - Bank financing can subordinate new investors
    - Review all loan agreements, covenants, collateral, and maturity schedule
  - - Customer concentration and backlog
    - Material
    - Strategic partnerships may not equal recurring revenue
    - Request top-10 revenue, backlog, renewals, and committed minimums
  - - PFCP unit economics
    - Material
    - Cloud compute could be high growth but capex-heavy
    - Request utilization, price per compute unit, power cost, and depreciation policy
  notes: These are the minimum finance workpapers required before treating PFN as underwritten rather than source-triangulated.
