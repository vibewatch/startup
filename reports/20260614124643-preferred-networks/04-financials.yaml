  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Company-prepared or audited FY2023-FY2026 P&L with operating profit, EBITDA, and segment gross margin.
    whyItMatters: Public sources conflict on revenue and do not verify operating-profit durability.
    diligencePath: Request audited statements, management accounts, and auditor bridge from non-consolidated to consolidated
      results.
    relatedQuestionRefs:
    - QI011
    - QI026
    relatedTableRefs:
