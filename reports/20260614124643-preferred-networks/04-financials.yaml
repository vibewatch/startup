- id: capital-intensity-runway-and-infrastructure
  title: Capital Intensity, Runway, and Infrastructure Leverage
  body: 'PFN’s strongest financial signal is also its core risk: it is vertically integrating a capital-intensive AI stack.
    Official sources show development of MN-Core processors, PFCP compute infrastructure, PLaMo foundation models, and the
    MN-Core L1000 processor for 2026 commercialization. That is more expensive than a pure application-software business because
    silicon development, systems engineering, high-density compute, and AI model training all require sustained technical
    spending before product-market economics are fully visible. The December 2024 and April 2025 financings reduce short-term
    financing pressure, and partner vehicles such as Preferred Computing Infrastructure may move part of cloud commercialization
    into a shared structure with Mitsubishi Corporation and IIJ. METI/NEDO compute-resource programs also improve ecosystem
    support. But none of those sources disclose cash on hand, monthly burn, or runway months, so public diligence cannot prove
    self-funding operations or operating-profit durability.'
