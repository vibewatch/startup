company:
  name: Preferred Networks, Inc.
chapter:
  number: 4
  title: Financials
  summary: PFN has raised a large recent financing series and retains unusually strong Japanese strategic backing, but it
    remains a private, financially opaque AI infrastructure company. Public evidence supports a roughly ¥24B latest financing
    series, a headline valuation above ¥300B with conflicting lower market-data estimates, and estimated revenue in the tens
    of millions of dollars rather than audited public financials.
sections:
- id: funding-history-capital-structure
  title: Funding History and Capital Structure
  body: 'PFN’s public financing record is unusually rich for a private Japanese AI company, but it still has to be read as
    a capital-structure map rather than a full financial statement. The newest retained primary evidence is the December 2024
    first close of 19 billion yen, followed by an April 2025 extension that brought the financing series to 24 billion yen.
    The structure was mixed: equity from strategic and financial investors plus bank debt, with named lenders including MUFG
    Bank, SMBC, Resona, Shoko Chukin, and later Mizuho. That mix matters because it suggests PFN can access blue-chip balance
    sheets and banks, not only venture capital, but it also creates diligence questions around security, covenants, debt maturity,
    and whether compute infrastructure is financed on PFN’s balance sheet or through partners. Historical strategic investments
    from Toyota and FANUC show the same pattern: PFN has long financed deep AI R&D through industrial partners that also want
    access to its technology.'
