    severity: minor
    topic: investor verification
    missingEvidence: Primary-source support for ENEOS or Chugai Pharmaceutical participation in the latest financing rounds.
    whyItMatters: Incorrect investor names distort cap-table quality and strategic-synergy analysis.
    diligencePath: Ask management for the full cap table and signed subscription list; do not include the names without source
      support.
