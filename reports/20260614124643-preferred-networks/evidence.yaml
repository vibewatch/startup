evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Exact post-money valuation, fully diluted share count, liquidation preferences and secondary activity for the
      2024–2025 financing.
    whyItMatters: Valuation discipline and investor economics cannot be assessed from round size alone.
    diligencePath: >-
      Request cap table, financing documents, investor presentation and any valuation memos from the company or lead
      investors.
    relatedQuestionRefs:
      - QO029
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-scale
    missingEvidence: >-
      Revenue, ARR, gross margin, customer count, backlog, contract values and customer concentration by line of
      business.
    whyItMatters: Strategic partnerships may not translate into recurring revenue or scalable margins.
    diligencePath: >-
      Request management accounts, signed contracts, pipeline report, revenue bridge and cohort/customer concentration
      schedule.
    relatedQuestionRefs:
      - QO030
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-board
    missingEvidence: Full board observer list, investor governance rights, option pool, management succession plan and compensation.
    whyItMatters: Founder-led governance and strategic investor rights may affect control, exit optionality and conflict management.
    diligencePath: Review shareholders agreement, board minutes, option plan and management organization chart.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: som
    missingEvidence: PFN segment revenue, customer counts, MN-Core external sales, and partner commercial economics by vertical.
    whyItMatters: SOM and valuation cannot be grounded without knowing which large market lenses PFN actually monetizes.
    diligencePath: >-
      Request revenue bridge by segment, signed partner contracts, utilization metrics and gross margin by business
      model.
    relatedQuestionRefs:
      - QM023
      - QM025
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: agriculture-robotics
    missingEvidence: Fresh PFN-specific CraftyFarm commercialization proof, customers, deployments or product status.
    whyItMatters: >-
      Agriculture robotics is a real market but should not drive valuation if PFN participation is stale or
      experimental.
    diligencePath: Ask management for CraftyFarm roadmap, pilot customers, field performance and revenue contribution.
    relatedQuestionRefs:
      - QM007
      - QM026
    relatedTableRefs:
      - TM001
      - TM004
  - type: conflicting-data
    severity: minor
    topic: japan-ai
    missingEvidence: A harmonized Japan AI software/services definition separating infrastructure, AIaaS and all-AI market totals.
    whyItMatters: Japan market estimates vary widely by scope and could distort SAM.
    diligencePath: Normalize IDC, IMARC and VMR categories into software, services, infrastructure and hardware before valuation.
    relatedQuestionRefs:
      - QM009
      - QM016
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: MN-Core benchmarks
    missingEvidence: >-
      Current MN-Core benchmark-per-dollar, power, software compatibility, and customer deployment data versus H100,
      H200, Blackwell, MI300, Gaudi, and TPU.
    whyItMatters: >-
      Without comparable benchmarks, chip differentiation remains an engineering claim rather than an underwriting
      input.
    diligencePath: >-
      Request customer benchmark decks, hardware availability data, compiler maturity evidence, and win/loss notes from
      PFN.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing opacity
    missingEvidence: Realized pricing, discounts, support obligations, and gross-margin implications for PFN and core competitors.
    whyItMatters: >-
      Packaging differences can hide whether PFN is a premium platform, services business, or research-heavy custom
      project vendor.
    diligencePath: Collect contracts, invoices, proposal decks, and customer procurement comparisons.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: PFN Bio traction
    missingEvidence: >-
      Named pharma partners, milestones, validated targets, or pipeline economics for PFN Bio relative to Recursion,
      Isomorphic, Insilico, BenevolentAI, and Schrödinger.
    whyItMatters: Drug-discovery competitors have clearer public vertical identity; PFN Bio needs proof of comparable traction.
    diligencePath: Request PFN Bio partner list, milestone economics, case studies, and scientific validation materials.
    relatedQuestionRefs:
      - QP029
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: CraftyFarm deployments
    missingEvidence: Japan-specific CraftyFarm deployment metrics, crop focus, labor savings, and hardware/service model.
    whyItMatters: >-
