      - number: '7.3'
        title: Geopolitical, Export-Control, Safety and AI-Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              PFN’s semiconductor ambitions sit inside a tightening U.S.-Japan-EU regulatory perimeter. BIS and CSIS
              sources show that advanced AI chips, EDA software, semiconductor manufacturing equipment and high-end
              compute supply chains are regulated chokepoints. Japan’s METI controls add domestic export-control
              considerations, and any PFN hardware or software sold into China-linked, military-linked or restricted end
              uses could trigger license, end-use or customer-screening obligations. Physical robotics and mobility
              applications add safety exposure under industrial robot standards such as ISO 10218, especially when PFN
              technology moves from lab environments into factories, logistics, autonomous mobility or service robots.
              The EU AI Act adds an additional risk tier for PFN systems placed on or used in Europe. No public evidence
              shows an export-control classification matrix, AI Act compliance mapping, safety incident history, or
              third-party robotics safety certification. The residual exposure is therefore medium-to-high severity with
              diligence focused on legal opinions, licenses, safety files and customer end-use controls.
            claimRefs:
              - CR019
