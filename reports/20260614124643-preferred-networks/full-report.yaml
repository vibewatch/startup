      - number: '1.5'
        title: Milestones, adverse events and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The chronology shows a company that repeatedly moves from research framework to industrial deployment,
              while pruning lines that cease to be strategic. The early Chainer framework was a major PFN asset, but in
              2019 PFN moved Chainer into maintenance and migrated research to PyTorch; that is an adverse
              product-platform event for Chainer’s standalone moat, even if the company framed it as an ecosystem
              decision. The official milestones page also notes consumer-service endings for Crypko and Petalica Paint
              in 2025, reinforcing that PFN is willing to shut down non-core consumer products. Diligence should
              therefore focus on which businesses have durable commercial pull: recent capital use is explicitly tied to
              MN-Core, PLaMo, AI solutions, talent and infrastructure, while exact valuation, customer count, revenue
              scale, gross margin and customer concentration are not public. Later chapters should test whether the
              strategic investor network converts into repeatable revenue or mainly subsidizes national-champion R&D.
