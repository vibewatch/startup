      - number: '3.2'
        title: Competitor Profile Deep Dives
        blocks:
          - type: paragraph
            body: >-
              The strongest chip competitors beat PFN on ecosystem more than on isolated silicon claims. NVIDIA’s
              installed software stack, roadmap, and enterprise packaging make H100/H200/Blackwell the default
              comparison; Google TPU has hyperscaler integration; AMD and Intel offer procurement alternatives; and
              Cerebras, Graphcore, and SambaNova demonstrate that non-GPU AI silicon is not unique to PFN. Robotics
              competition is similarly ecosystem-led. NVIDIA Isaac surrounds perception with simulation and deployment
              tooling, while Skild AI and Physical Intelligence pursue general robot foundation models. Covariant is
              especially instructive: its Amazon talent-and-licensing deal is adverse evidence that strategic buyers can
              capture scarce robotics-AI capability without buying the entire startup. In automotive, Waymo and Mobileye
              are more mature autonomy references, Wayve is closer on embodied AI, and Woven by Toyota is a Japanese OEM
              internal-build threat. The Japan AI cohort is fragmented but locally relevant, with Sakana stronger on
              research narrative and ABEJA/ELYZA stronger on enterprise deployment posture.
