      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              PFN remains founder-led. The reviewed company page lists Toru Nishikawa as Co-Founder and Chairman and
              Daisuke Okanohara as Co-Founder and Chief Executive Officer, while the co-founders’ message emphasizes a
              company built by people who “love computer science and technology” and want to master every layer of
              computing. This founder continuity is a strength for technical coherence and partner trust, but it also
              creates key-person concentration: the two co-founders still anchor strategy, corporate narrative and
              technical direction more than a broad professionalized management slate visible to outsiders. PFN does
              disclose a governance layer: directors include Hiroshi Maruyama and outside audit-and-supervisory
              committee directors, and executives include COO Naoto Ono, CFO Yotaro Katayama and VP of Engineering
              Masaaki Fukuda. No public source reviewed disclosed compensation, ownership percentages, succession plans
              or full board voting arrangements.
