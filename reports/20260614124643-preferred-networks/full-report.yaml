companyProfile:
  summary: >-
    Preferred Networks (PFN) is a Tokyo-based deep-learning company founded in March 2014 by Toru Nishikawa and Daisuke
    Okanohara as a spin-out from Preferred Infrastructure. PFN positions itself as a vertically integrated AI platform,
    designing its own MN-Core deep-learning accelerator with Kobe University, operating large-scale GPU and MN-Core
    computing infrastructure, training the PLaMo foundation-model series under Japan's NEDO GENIAC program, and applying
    these capabilities to industrial robotics (Fanuc), automotive perception (Toyota), materials discovery (Matlantis
    with ENEOS), drug discovery (Chugai Pharmaceutical), agriculture (CraftyFarm with Oisix) and consumer robotics
    (Kachaka via Preferred Robotics). It is widely cited as Japan's most valuable private AI startup.
  foundedDate: '2014-03-26'
  founders:
    - name: Toru Nishikawa
      role: Co-founder, Chairman (prior CEO)
      background: >-
        University of Tokyo computer-science alumnus and co-founder of Preferred Infrastructure (2006); PFN's longtime
        CEO before transitioning to Chairman, with a deep-learning research and engineering background.
      claimRefs:
        - CO003
        - CO004
    - name: Daisuke Okanohara
      role: Co-founder, Executive Vice President / Chief Executive Researcher
      background: >-
