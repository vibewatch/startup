        title: IP, Research Velocity, Trust, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The technology moat is a portfolio of research, open source, silicon know-how, and domain-specific data
              rather than a single patent wall visible from public sources. PFN has shipped or maintained Chainer, CuPy,
              Optuna and pfio; it has created custom silicon with published efficiency results; it operates a Japanese
              foundation-model line; and it has converted materials simulation research into Matlantis. That breadth is
              rare, but it makes diligence more complex. Public sources do not yet answer several deployment-critical
              questions: exact MN-Core 2/L1000 fabrication and supply commitments, PFCP service-level architecture,
              model-safety controls, export-control posture, data residency, and customer security certifications. The
              adverse case is not that PFN lacks technology; it is that its technology may remain strongest in
              affiliated or Japan-specific contexts while global enterprise AI standardizes around NVIDIA
