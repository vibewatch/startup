        title: Financial Verdict and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              PFN should be underwritten as a strategically financed, technically differentiated AI infrastructure
              company with opaque private economics. The positive case is that PFN has long-term industrial validation
              from Toyota, FANUC, Mitsubishi Corporation, SBI, major trust banks, and government-adjacent compute
              initiatives; it has raised a large recent financing series; and it owns a stack that could turn
              constrained Japanese AI infrastructure demand into cloud and product revenue. The adverse case is that the
              same stack is expensive, public revenue estimates are inconsistent, and the valuation could be stretched
              if revenue is only in the public $42 million to $56 million estimate band. The immediate diligence
              checklist is therefore not optional: audited or management-prepared P&L, segment revenue, gross margins by
              chips/cloud/solutions, debt terms, cash balance, monthly burn, backlog, top-customer concentration, PFCP
