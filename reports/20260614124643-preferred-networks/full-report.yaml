      - number: '2.4'
        title: Growth Drivers, Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Growth drivers are strong but uneven. AI infrastructure spending, Japan sovereign-compute priorities,
              robotics labor constraints, smart manufacturing digitization, autonomous-driving physical AI, and pharma
              pressure to shorten discovery cycles all support demand for PFN’s capabilities. The MHI and Toyota 2026
              announcements improve freshness and show PFN is still converting research depth into strategic partner
              access. Constraints are equally important: industrial AI requires long validation cycles, safety-critical
              infrastructure buyers demand reliability and auditability, AI accelerators face NVIDIA-class ecosystem
              lock-in and foundry capacity limits, agricultural robotics has difficult unit economics and seasonality,
              and drug-discovery AI faces clinical translation risk. The adverse Chugai pipeline signal is not
              PFN-specific but shows why computational discovery should be treated as high-upside, high-validation-risk
              exposure. Public evidence cannot calculate PFN SOM; revenue mix, partner contract economics and external
              MN-Core sales remain data-room asks.
