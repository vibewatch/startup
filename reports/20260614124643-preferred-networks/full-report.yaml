            body: >-
              The public adoption path is best understood as a funnel: funded co-research, capital/business alliance,
              productized function, joint venture, then commercial product or infrastructure service. FANUC and ENEOS
              are the best evidence of this path. FANUC progressed from 2015 R&D and investment to AI functions released
