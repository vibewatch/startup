  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercialization and Customer Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks remains a high-upside but high-execution-risk company because its stated strategy spans
              semiconductors, computing infrastructure, foundation models, robotics and vertical applications. That
              breadth creates a commercialization challenge: PFN must convert research-grade technology into repeatable
              products while maintaining partner-specific solutions for Toyota, FANUC and other industrial customers.
              The historical Chainer-to-PyTorch transition is the clearest public example of a PFN-created platform
              losing standalone strategic importance; management itself said the era when a deep-learning framework was
              the competitive edge had matured. Customer concentration is also structurally different from ordinary
              enterprise concentration because Toyota and FANUC have been both strategic collaborators and ecosystem
              gatekeepers. Toyota’s internal Woven by Toyota capability creates displacement risk, while FANUC-specific
              FIELD integration creates lock-in and dependency risk. The public record does not disclose revenue mix,
              contract minimums, backlog, gross retention or whether Toyota/FANUC remain material revenue sources in
              2026, so the appropriate risk posture is high severity and medium likelihood pending private diligence.
