        title: Governance, Reputation, IP and Adverse-Event Risk
        blocks:
          - type: paragraph
            body: >-
              The reviewed public record produced multiple adverse or disconfirming signals but no confirmed scandal,
              enforcement action, founder departure, accounting issue or layoff event through the run date. The
              strongest adverse datapoints are not sensational: Chainer moved to maintenance mode, independent analysts
              scrutinize MN-Core as a niche accelerator, CB Insights shows negative Mosaic Score movement, and
              macro/market sources warn about AI-bubble and yen risks. That pattern matters because PFN’s valuation
              depends on belief that deep technical assets will become durable products. IP risk is material but mostly
              latent: JPO guidance confirms AI inventions are an active examination area, and PFN’s collaboration-heavy
              history with Toyota, FANUC, Kobe University, Facebook/PyTorch and other partners makes ownership,
              contribution rights, patent licenses and open-source obligations key diligence areas. The absence of
              public controversy should not be mistaken for low governance risk; it means the decisive evidence is
