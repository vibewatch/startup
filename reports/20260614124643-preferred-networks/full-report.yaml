  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks (PFN) should not be sized as a single generic AI company. Its market boundary is a
              portfolio of physical-AI and scientific-AI lenses anchored in partner commercialization: industrial AI and
              smart manufacturing with Fanuc and MHI, industrial robotics intelligence, Toyota-linked physical AI and
              autonomous-driving software, MN-Core AI infrastructure and accelerators, agriculture robotics as a
              narrower option-value lens, and AI-driven drug discovery through Chugai-style experiment automation.
              Included spend is software, model, accelerator and integration value that PFN can plausibly influence
              through co-creation or licensing. Excluded spend includes consumer AI apps, general cloud services with no
              PFN compute role, vehicle hardware, broad farm equipment unrelated to autonomy, and pharma wet-lab spend
              that is not computational or automated. The result is a multi-market boundary with very different buyers,
              rather than one headline TAM.
