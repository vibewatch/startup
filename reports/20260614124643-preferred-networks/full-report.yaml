      - number: '7.4'
        title: Financial, Funding, Talent and Macro Risk
        blocks:
          - type: paragraph
            body: >-
              PFN is a private, capital-intensive AI infrastructure company. Public market-data sources confirm funding
              and unicorn positioning, but they do not disclose revenue, ARR, gross margin, operating loss, cash burn,
              runway, hardware gross margin, capex needs or debt obligations. The combination of custom semiconductors,
              compiler work, foundation models and industrial deployments implies a cost base that may be difficult to
              fund if AI-infrastructure sentiment weakens. Reuters coverage of AI-bubble concern is not a PFN-specific
              indictment, but it is directly relevant to the next financing cycle for a private AI company with limited
              public financial disclosure. Japan’s weak yen can cut both ways: it may help yen-denominated costs when
              translated into USD, but it can increase imported compute, EDA, equipment and cloud costs and complicate
              USD valuation comparisons. Talent risk is similarly material because PFN needs a rare mix of AI
              researchers, compiler engineers, robotics specialists and semiconductor product talent competing against
              hyperscalers and national champions.
