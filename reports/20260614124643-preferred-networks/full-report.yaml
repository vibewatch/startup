chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope and operating model
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks, Inc. (PFN) is a Tokyo-based private AI company established on March 26, 2014 and
              headquartered at Otemachi Building in Chiyoda-ku. The company’s own mission statement — “Make the real
              world computable and create the future together” — is unusually broad, but its public materials make the
              operating scope concrete: PFN works vertically from AI chips and in-house supercomputing to foundation
              models, industrial solutions and applications. That makes the company less comparable to a pure software
              startup and more comparable to an integrated AI infrastructure-and-applications lab with strategic
              commercialization paths. Publicly evidenced domains include manufacturing, mobility, energy, materials,
              life sciences, entertainment, finance, public services and education. Revenue, ARR, margin and
              customer-count data are not publicly disclosed in reviewed sources, so later chapters should treat PFN as
              late-stage private with strong strategic validation but incomplete financial transparency.
