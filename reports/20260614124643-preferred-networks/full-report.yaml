      - number: '3.3'
        title: Capability, Pricing, and Distribution Matrix
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports directional comparison, not audited benchmark parity. PFN’s main advantage is
              unusual breadth: it can talk credibly about chip design, Japanese LLMs, robotics, life sciences, and
              agriculture from one research organization. That breadth is valuable for customers seeking long-horizon AI
              R&D partners, but it does not automatically create best-of-breed product proof in every segment. NVIDIA
              and Google are stronger on accelerator ecosystem distribution, Waymo/Mobileye on deployed autonomy proof,
              Recursion/Isomorphic/Schrödinger on drug-discovery brand depth, and FarmWise/Carbon Robotics on narrow
              agriculture ROI claims. Pricing is mostly opaque, so buyers will compare packaging rather than list price:
              cloud or server accelerator availability, robot platform purchase or pilot terms, enterprise AI services,
              pharma collaboration economics, and project-specific agriculture automation. Unknown cells are
              intentionally labeled unknown or partial because public pages rarely disclose model-quality benchmarks,
