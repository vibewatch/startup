  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              PFN’s public financing record is unusually rich for a private Japanese AI company, but it still has to be
              read as a capital-structure map rather than a full financial statement. The newest retained primary
              evidence is the December 2024 first close of 19 billion yen, followed by an April 2025 extension that
              brought the financing series to 24 billion yen. The structure was mixed: equity from strategic and
              financial investors plus bank debt, with named lenders including MUFG Bank, SMBC, Resona, Shoko Chukin,
              and later Mizuho. That mix matters because it suggests PFN can access blue-chip balance sheets and banks,
              not only venture capital, but it also creates diligence questions around security, covenants, debt
              maturity, and whether compute infrastructure is financed on PFN’s balance sheet or through partners.
              Historical strategic investments from Toyota and FANUC show the same pattern: PFN has long financed deep
              AI R&D through industrial partners that also want access to its technology.
