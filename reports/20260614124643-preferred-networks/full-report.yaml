  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Architecture & Platform: Vertical Integration Rather Than a Single Product'
        blocks:
          - type: paragraph
            body: >-
              PFN’s current product surface is best understood as a vertically integrated AI stack, not a conventional
              single-product startup. The public homepage says the company integrates AI chips, computing
              infrastructure, generative AI, solutions and products; the product pages then map that strategy into four
              layers. At the bottom are MN-Core processors and PFCP compute capacity. Above that are software
              frameworks, compilers, runtime tooling and open-source libraries that let PFN teams map PyTorch/JAX-era
              workloads onto PFN-owned compute. The model layer is PLaMo, a Japanese-language-oriented foundation-model
              family with API, chat, translation, open-model and enterprise-customization surfaces. The application
              layer includes Matlantis for atomistic materials simulation, Kachaka and industrial robotics through group
              company Preferred Robotics, and bespoke AI solutions for manufacturing, materials, life sciences,
              public-sector and enterprise customers. This architecture creates real differentiation because PFN can
              tune silicon, compiler, model and application together; it also creates execution risk because each layer
              has a different commercialization clock and buyer.
