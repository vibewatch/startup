            body: >-
              Retention is visible through relationship expansion rather than disclosed NRR. FANUC shows the strongest
              longitudinal evidence: a 2015 R&D alliance, 2015 capital alliance, 2018 JV, and 2018-2019 AI function
              releases. ENEOS also shows durability because the relationship is embedded in Matlantis and PFP releases
              rather than a single announcement. NTT’s evidence is supplier/customer-case oriented and appears durable
              for compute infrastructure, but it does not prove recurring software revenue. Chugai and Mitsui/Preferred
              Medicine show credible healthcare collaborations; however, public sources stop short of scaled recurring
              clinical or drug-discovery revenue. Toyota has substantial strategic proof but its current 2026 work
              remains joint research. Across all relationships, PFN’s customer success metric is milestone
              conversion—research to product or JV—not conventional retention cohorts, so diligence should request
