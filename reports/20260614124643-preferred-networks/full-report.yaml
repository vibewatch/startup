        Infrastructure in 2006 and PFN in 2014, leading long-horizon research strategy.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Tokyo, Japan
  headquarters: Otemachi, Tokyo, Japan
  productSummary: >-
    PFN sells (a) MN-Core deep-learning accelerator silicon and systems (including the L1000 LLM-inference part); (b)
    computing-infrastructure access (PFN cloud, KDDI partnership); (c) the PLaMo foundation-model family; (d) Matlantis
    cloud atomistic-simulation for materials and chemistry (joint venture with ENEOS); (e) industrial-AI / robotics
    solutions for Fanuc, Toyota and other large enterprises; and (f) consumer robotics through Preferred Robotics'
    Kachaka. Revenue is reported as a mix of solutions / licensing, chip and system sales, cloud and SaaS subscriptions,
    and research-grant or co-development income.
  customerFocus: >-
    Large Japanese industrial groups (automotive, factory automation, energy, materials, pharma), Japanese government
    and academic research programs, and a growing layer of Japanese-language LLM and atomistic-simulation enterprise
    customers; consumer reach is limited to the Kachaka home-robot pilot.
  businessModel: >-
    Hybrid IP / hardware / software model — research-and-development services and co-development with strategic anchors
    (Toyota, Fanuc, ENEOS, Chugai); MN-Core chip and MN-3 / MN-Core 2 system sales; Matlantis and PFN-cloud subscription
    revenue; PLaMo licensing and government-funded compute (NEDO GENIAC); plus equity-style partnerships where lead
    investors are also lead customers.
  stage: Late-stage private (Japanese kabushiki kaisha; widely classified as a unicorn)
  fundingStatus: >-
    December 2024 ¥19B first close (SBI-led equity plus debt from MUFG, Resona, Shoko Chukin and SMBC), extended to a
    ¥24B series by April 2025; layered on top of historic Toyota (¥1B 2015, ¥10.5B 2017), Fanuc, NTT, Mitsui, Mizuho and
    Hitachi rounds, taking lifetime disclosed funding well above ¥40B. The Bridge and Latka peg current valuation around
    ¥300B / $2B, while PremierAlts secondary marks indicate a materially lower $1.0B as of June 2025.
