      - number: '1.4'
        title: Platform, subsidiaries and commercial proof points
        blocks:
          - type: paragraph
            body: >-
              PFN’s company story is now a portfolio of connected technology bets. MN-Core and MN-3 provide the hardware
              and compute proof: PFN says MN-3 topped Green500 three times, while TOP500 and Supermicro provide
              independent corroboration of the MN-3 system and energy-efficiency achievement. Preferred Elements extends
              PFN into multimodal foundation models, Matlantis carries computational chemistry and materials simulation,
              and partner announcements with Mitsubishi Corporation, IIJ, Rapidus, Sakura Internet and GMO show that the
              compute stack is moving into joint-venture commercialization rather than remaining only an internal
              research asset. On the applications side, ENEOS publicly confirmed autonomous refinery operation with PFN,
              and June 2026 releases add mission-critical AI with Mitsubishi Heavy Industries plus physical-AI research
              with Toyota. This evidence supports a real industrial partner base, but not yet a transparent revenue
