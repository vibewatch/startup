      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              PFN’s moat is most defensible where its research breadth becomes a compounding capability rather than a
              collection of unrelated bets. MN-Core can create switching cost if customers optimize workloads around PFN
              hardware and software, but that advantage is vulnerable to CUDA, TPU availability, and procurement habits.
              Robotics perception can become sticky if PFN owns production data and deployment tooling, yet
              foundation-model robotics startups and NVIDIA Isaac can commoditize parts of that stack. PLaMo benefits
              from Japanese-language specialization, but domestic AI vendors with clearer enterprise GTM can win
              accounts. PFN Bio and CraftyFarm have option value, but competitors dedicated to drug discovery or
              agriculture can show cleaner vertical focus. The biggest risk is multi-homing: customers can use NVIDIA
              GPUs, Toyota or Mobileye autonomy stacks, a Japanese LLM vendor, a pharma AI specialist, and a
              crop-specific robot without standardizing on PFN. Diligence should therefore test not whether PFN has
              smart technology, but where it has productized proof, distribution, and switching costs that focused
              rivals cannot neutralize.
