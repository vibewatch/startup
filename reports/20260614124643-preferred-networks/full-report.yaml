      - number: '7.2'
        title: Competitive and Technical Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              PFN’s MN-Core strategy faces an unusually severe competitive set. NVIDIA is not merely a chip vendor; it
              combines advanced accelerators, CUDA, libraries, developer mindshare and a procurement ecosystem that
              makes switching expensive. CSIS’s discussion of CUDA ecosystem effects explains why a technically
              efficient niche accelerator can still struggle commercially: customers must move software, tools and
              operational expertise away from an incumbent stack. Hyperscaler silicon compounds the pressure. AWS
              Trainium and Google TPU are not sold as isolated chips; they are integrated into cloud procurement,
              support, pricing and model workflows. Open foundation models further compress differentiation in software
              layers above the chip. PFN’s own MN-Core pages provide real product and price evidence, but public sources
              do not demonstrate broad third-party deployment, unit economics, utilization, or a developer ecosystem
              comparable to CUDA, Trainium or TPU. This makes competitive displacement a top-three thesis risk.
            claimRefs:
