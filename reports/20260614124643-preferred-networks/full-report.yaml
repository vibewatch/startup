        title: Funding history, valuation signals and stakeholders
        blocks:
          - type: paragraph
            body: >-
              PFN’s capital history is dominated by strategic Japanese industrial and financial backers. Toyota invested
              1.0 billion yen in 2015 and an additional approximately 10.5 billion yen in 2017, making Toyota the
              largest external shareholder at that time. FANUC invested 900 million yen in 2015, and PFN’s milestone
              chronology adds 2017 capital tie-ups with Hakuhodo DY, Mitsui, Mizuho and Hitachi. Recent financing
              shifted the story from mobility/robotics R&D toward Japan-made AI semiconductors and compute
              infrastructure: SBI agreed to invest up to 10 billion yen in 2024; PFN then announced a 19 billion yen
              first close in December 2024 and a 5 billion yen extension in April 2025, bringing that round to 24
              billion yen to date. Independent press supports unicorn framing, but exact post-money valuation and
              cap-table ownership remain private, so valuation should be treated as media/market-data supported rather
              than audited.
