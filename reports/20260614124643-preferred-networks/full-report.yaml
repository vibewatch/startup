  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Across PFN’s Many Jobs-to-be-Done
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks does not have one clean peer group; it has several overlapping arenas because the
              company spans AI chips, deep-learning software, robot perception, Japanese foundation models, AI drug
              discovery, and agriculture robotics. In AI infrastructure, MN-Core competes against the gravitational pull
              of NVIDIA H100, H200, and Blackwell, plus AMD MI300, Intel Gaudi, Google TPU, Cerebras, Graphcore, and
              SambaNova. In robotics and perception, the relevant alternatives include NVIDIA Isaac, Boston Dynamics
              Spot, Covariant, Skild AI, Physical Intelligence, Figure AI, and Sanctuary AI. Automotive work is compared
              against Waymo, Wayve, Mobileye, NVIDIA DRIVE, and Toyota’s own Woven organization. PLaMo’s domestic
              mindshare competes with Sakana AI, rinna, ABEJA, and ELYZA. PFN Bio faces Recursion, Isomorphic Labs,
              Insilico, BenevolentAI, and Schrödinger, while CraftyFarm is exposed to specialized agriculture robotics
              such as Plenty, FarmWise, and Carbon Robotics. The status quo is also material: many customers can build
              internally, rent cloud GPUs, buy off-the-shelf robot platforms, or keep domain-specific teams in-house.
