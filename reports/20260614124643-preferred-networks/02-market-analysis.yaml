company:
  name: Preferred Networks, Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: 'Preferred Networks spans several overlapping but non-additive markets: global AI platforms, smart manufacturing
    and industrial robotics, Toyota-linked physical AI/autonomous-driving software, MN-Core AI accelerators and Japan AI infrastructure,
    agriculture robotics, and AI-driven drug discovery. The broadest 2026 AI spending lenses exceed $375B to $2.5T, but PFN’s
    serviceable opportunity is much narrower and partner-led. The most defensible near-term market thesis is Japan-centered
    physical AI for industrial, infrastructure, automotive and scientific workflows, with agriculture and drug discovery treated
    as higher-uncertainty option value.'
sections:
- id: market-definition
  title: Market Boundary and Status-Quo Substitutes
  body: 'Preferred Networks (PFN) should not be sized as a single generic AI company. Its market boundary is a portfolio of
    physical-AI and scientific-AI lenses anchored in partner commercialization: industrial AI and smart manufacturing with
    Fanuc and MHI, industrial robotics intelligence, Toyota-linked physical AI and autonomous-driving software, MN-Core AI
    infrastructure and accelerators, agriculture robotics as a narrower option-value lens, and AI-driven drug discovery through
    Chugai-style experiment automation. Included spend is software, model, accelerator and integration value that PFN can
    plausibly influence through co-creation or licensing. Excluded spend includes consumer AI apps, general cloud services
    with no PFN compute role, vehicle hardware, broad farm equipment unrelated to autonomy, and pharma wet-lab spend that
    is not computational or automated. The result is a multi-market boundary with very different buyers, rather than one headline
    TAM.'
