- id: sizing-lenses
  title: Market Sizing — TAM, SAM, SOM and Segment Lenses
  body: 'The sizing answer is a range, not a point estimate. The broadest global AI spending lens is useful only as context:
    Gartner’s 2026 AI spending forecast exceeds $2.5 trillion, while Fortune Business Insights places the 2026 global AI market
    at $375.93 billion. PFN’s nearer lenses are smaller but more relevant: smart manufacturing is $387.14 billion in 2026,
    industrial robotics is $15.5 billion, AI accelerator chips are $154.6 billion, autonomous-driving software is roughly
    $2.97 billion in 2026 by Precedence and $1.8 billion in 2024 to $7.0 billion by 2035 by MarketsandMarkets, agriculture
    robotics is $18.0 billion, and AI drug discovery is about $2.9 billion. Japan-specific demand is also meaningful: IDC
    expects Japan AI infrastructure to exceed $5.5 billion in 2026, while Japan AIaaS and all-AI forecasts vary sharply by
    definition. PFN’s serviceable market should therefore be constrained to Japanese industrial/physical-AI deployments, AI
    infrastructure, and selected partner verticals rather than the full AI economy. Public-source market sizing also creates
    an important interpretation rule: these markets are adjacent, not additive. A Toyota physical-AI proof point cannot be
    valued like a full autonomous-car supplier; an MN-Core deployment cannot be valued like a dominant merchant GPU vendor;
    and a Chugai or agriculture proof point should not automatically transfer to industrial robotics. The chapter therefore
    treats each lens as a separate diligence path with its own buyer, budget owner, conversion evidence and failure mode.'
