- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication for PFN
  - Diligence Ask
  rows:
  - - Japan sovereign AI infrastructure and NEDO-backed post-5G R&D
    - driver
    - 2026–2030
    - Supports MN-Core/AImod and domestic compute differentiation
    - Confirm grant economics, AImod utilization and whether external customers pay for MN-Core capacity
  - - Industrial AI shift from pilots to embedded manufacturing workflows
    - driver
    - 2026–2031
    - Supports MHI/Fanuc-style co-creation and smart manufacturing platform demand
    - Quantify partner pipeline from joint research to paid deployment
  - - Industrial robot installed base in Japan and globally
    - driver
    - Current and cyclical
    - Creates large installed base for robot intelligence software
    - Determine PFN revenue share in Fanuc deployments, if any
  - - Toyota physical-AI inference research
    - driver
    - 2026–2029
    - Validates automotive and robotics inference use cases for MN-Core L
    - Ask whether the research has commercial milestones or only exploratory R&D
  - - AI accelerator demand and GPU supply pressure
    - driver
    - 2026–2035
    - Large chip TAM supports MN-Core narrative
    - Assess foundry access, software ecosystem and external sales traction
  - - Pharma cycle-time pressure
    - driver
    - 2026–2033
    - Supports Chugai-style computational chemistry and experiment automation
    - Request conversion metrics from AI-suggested compounds to validated candidates
  - - Partner-led commercialization dependency
    - constraint
    - Persistent
    - PFN may be dependent on partners for route-to-market and revenue capture
    - Review contract terms, exclusivity, IP ownership and gross margin split
  - - Safety-critical validation and auditability
    - constraint
    - Near to medium term
    - Infrastructure, automotive and pharma buyers require long validation cycles
    - Ask for deployment timelines from PoC to production by vertical
  - - Chip ecosystem barriers versus NVIDIA-class platforms
    - constraint
    - Persistent
    - MN-Core TAM may be large but practical share could remain internal or Japan-specific
    - Benchmark compiler, model support, customer migration costs and total cost of ownership
  - - Agriculture robotics PFN evidence gap
    - constraint
    - Current
    - Agriculture should not drive valuation without fresh PFN commercialization proof
    - Request CraftyFarm status, paying customers, unit economics and deployment geography
  - - Adverse Chugai AI-assisted antibody discontinuation
    - constraint
    - 2026 signal
    - Shows drug-discovery AI can fail at translation despite platform promise
    - Separate platform revenue from therapeutic milestone assumptions
  notes: Timing is qualitative; constraints are diligence priorities because PFN discloses partnerships and technology more
    clearly than revenue conversion metrics.
