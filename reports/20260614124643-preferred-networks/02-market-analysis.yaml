- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - Relevance to PFN
  rows:
  - - Industrial AI / smart manufacturing
    - AI models, deployment software, robotics intelligence, digital twins and integration for factories/infrastructure
    - Generic enterprise AI, ERP, non-industrial analytics
    - Manufacturers, robot OEMs, MHI-like infrastructure primes
    - Core commercialization route through Fanuc, MHI and manufacturing AI demand
  - - Industrial robotics
    - Robot intelligence, self-optimization, perception and automation software attached to robot OEM ecosystems
    - Robot arms as commodity hardware where PFN has no economics
    - Robot OEMs, factory automation teams
    - Fanuc relationship and Japan robot density make this a direct lens
  - - Autonomous driving / physical AI
    - Perception, inference acceleration, simulation and physical-AI research software
    - Vehicle hardware, ride-hailing fleet value, consumer ADAS subscriptions unrelated to PFN
    - Toyota R&D, mobility engineering groups
    - Toyota FRC 2026 research validates access but not revenue scale
  - - AI chips / accelerators
    - MN-Core processors, AI infrastructure, cooling and internal/partner compute platforms
    - Commodity cloud compute resale, GPUs where PFN has no share
    - AI infrastructure operators, model teams, sovereign-AI programs
    - Large TAM but highest ecosystem and capital-intensity risk
  - - Agriculture robotics
    - Autonomous farm robots, machine vision, spraying, harvesting and farm automation software
    - Conventional tractors, seed/chemical inputs, farm management without robotics
    - Farm operators, ag equipment OEMs
    - Small option-value lens; PFN-specific CraftyFarm evidence not fresh publicly
  - - AI-driven drug discovery
    - Computational chemistry, experiment automation, molecular simulation and AI discovery platforms
    - Wet-lab services without AI automation, clinical trial spend
    - Pharma R&D, discovery-platform teams
    - Chugai relationship and MALEXA context validate adjacency but clinical conversion risk remains
  - - Japan AI software/services/infrastructure
    - Domestic AI infrastructure, AIaaS, industrial AI services and sovereign compute
    - Global consumer AI spend and non-Japan services
    - Japanese enterprises, government-backed infrastructure programs
    - Important SAM filter for PFN as Japan domestic champion
  notes: Boundary separates PFN-influenceable software, chips and co-created vertical solutions from broad end-market hardware
    or services that PFN does not directly monetize.
