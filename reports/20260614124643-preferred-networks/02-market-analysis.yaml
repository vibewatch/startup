- id: segmentation-buyers
  title: Buyer Segmentation and Adoption Path
  body: Buyer segmentation is the key adoption lens. In industrial robotics, Fanuc-like robot OEMs and factory automation
    teams are buyers, while line engineers and robot programmers are users; the budget owner is usually manufacturing engineering
    or plant automation capex. In infrastructure and smart manufacturing, MHI and similar heavy-industry primes buy mission-critical
    AI capability to embed into infrastructure projects. Toyota’s Frontier Research Center points to automotive R&D and physical-AI
    engineering buyers, not retail vehicle buyers. MN-Core and AImod buyers are internal AI model teams, data-center operators,
    sovereign-AI programs and partners such as IIJ/JAIST. Pharma buyers are Chugai-like discovery-platform and R&D automation
    teams; agriculture buyers would be equipment OEMs or large farm operators, but public PFN-specific commercialization evidence
    is thinner. Across segments, PFN’s adoption path usually starts with joint research, then partner internal use, then joint
    commercialization or licensing.
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM030
