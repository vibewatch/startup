- id: s605
  title: Concentration and Verification Risks
  body: 'The principal customer diligence risk is not absence of names; it is ambiguity of economics. PFN has many elite logos,
    but public sources rarely separate investor, partner, supplier, research collaborator, and paying customer roles. Toyota,
    FANUC, ENEOS, Chugai, Mitsui, NTT, Hitachi, Hakuhodo DY, Mizuho, and Mitsubishi Corporation all validate strategic access,
    yet none disclose PFN revenue contribution. CNBC’s cited three-to-five-year commercialization cycle reinforces the risk
    that some impressive partnerships may be long-cycle R&D rather than near-term recurring revenue. Geographic concentration
    is also material: most proof is Japan-centered, with Matlantis U.S. launch the clearest international commercialization
    signal. Finally, the requested Oisix/CraftyFarm relationship could not be corroborated from fetched public sources; it
    should be treated as an unresolved diligence item unless management supplies primary evidence.'
