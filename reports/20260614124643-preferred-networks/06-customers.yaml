- id: s602
  title: Segments and Use Cases
  body: PFN’s segment mix is unusually broad for a private AI company. Automotive and physical AI center on Toyota’s robot
    and automated-driving research agenda. Factory automation centers on FANUC machine tools, robots, and ROBO-MACHINE functions.
    Industrial edge and social infrastructure center on the FANUC-Hitachi JV and the 2026 MHI mission-critical AI alliance.
    Materials simulation is anchored by ENEOS and Matlantis, where PFP model development became a commercial simulator. Healthcare
    includes Chugai drug-discovery work and Mitsui-backed Preferred Medicine cancer-detection research. Communications infrastructure
    is represented by NTT data-center/GPU/supercomputer support, while KDDI and SoftBank show a newer GPU-cloud ecosystem
    route. Robotics includes Preferred Robotics’ JR East rail-inspection work and Kachaka/Kachaka Pro products. Advertising
    and creative AI are represented by Hakuhodo DY investment and PaintsChainer commercialization.
