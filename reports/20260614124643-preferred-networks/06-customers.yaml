      channel: Investor or incumbent sponsor
      description: Toyota, FANUC, Chugai, Hakuhodo, Hitachi, Mitsui and others enter via investment or capital/business alliances.
    - label: Joint research
      channel: Co-development project
      description: PFN embeds deep-learning, MN-Core, robotics, or simulation expertise with customer technical teams.
    - label: Pilot / validation
      channel: Customer assets or R&D workflows
      description: Use cases validate factory automation, materials simulation, rail inspection, drug discovery, or physical-AI
        inference.
    - label: Productization
      channel: AI functions, simulator, robot, GPU cloud, or JV
