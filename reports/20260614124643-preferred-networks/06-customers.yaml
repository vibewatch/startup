- id: s603
  title: Traction Evidence and Adoption Path
  body: 'The public adoption path is best understood as a funnel: funded co-research, capital/business alliance, productized
    function, joint venture, then commercial product or infrastructure service. FANUC and ENEOS are the best evidence of this
    path. FANUC progressed from 2015 R&D and investment to AI functions released in 2018-2019 and the Intelligent Edge System
    JV. ENEOS progressed from PFP co-development into Matlantis, a dedicated simulator business with U.S. expansion and a
    2024 version-7 release. Toyota’s 2026 FRC collaboration is strategically important but still research-stage. JR East/Preferred
    Robotics is pilot/deployment proof in rail maintenance robotics, while SoftBank and KDDI are ecosystem infrastructure
    routes rather than direct PFN customer contracts. The strongest current-year signals are Toyota FRC, JR East, SoftBank
    GPU Cloud, and MHI, all active in 2026.'
  claimRefs:
  - CU030
  - CU033
  - CU037
  - CU038
  - CU039
  - CU040
  - CU024
