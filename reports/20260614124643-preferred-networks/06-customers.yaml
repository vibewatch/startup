company:
  name: Preferred Networks, Inc.
chapter:
  number: 6
  title: Customers
  summary: 'PFN has unusually strong named-customer and partner proof across Toyota, FANUC, Hitachi, ENEOS/Matlantis, Chugai,
    NTT, JR East/Preferred Robotics, Hakuhodo DY, Mitsubishi/MHI, KDDI, SoftBank, and GENIAC. The evidence is strongest for
    strategic co-creation, productized FANUC and Matlantis work, compute infrastructure partnerships, and 2026 physical-AI/robotics
    alliances. The central diligence risk is economic ambiguity: many logos are investors, suppliers, R&D partners, or JVs
    rather than disclosed paying production customers, and no public NRR, churn, ARR, or top-customer concentration metrics
    are available.'
sections:
- id: s601
  title: Named-Customer Portfolio
  body: 'Preferred Networks has a deep named-customer and strategic-partner portfolio, but it is not a conventional SaaS account
    list. The strongest pattern is co-creation with large Japanese industrial incumbents that are also investors: Toyota Motor,
    FANUC, Hitachi, ENEOS, Chugai Pharmaceutical, Mitsui & Co., NTT, Hakuhodo DY, Mizuho Bank, Mitsubishi Corporation, and
    Mitsubishi Heavy Industries all appear in fetched official or partner sources. Toyota is the clearest automotive anchor,
    with a 2017 additional investment tied to automated-driving AI and a 2026 Frontier Research Center collaboration using
    MN-Core L processors for physical AI. FANUC is the deepest industrial-robotics relationship, beginning with 2015 R&D and
    capital alliances and extending into productized AI functions plus the FANUC-Hitachi-PFN Intelligent Edge System JV. The
    portfolio is credible, but customer status varies: some names are production/product proof, some are R&D partners, and
    some are strategic investors.'
  claimRefs:
