- id: geopolitical-regulatory-risks
  title: Geopolitical, Export-Control, Safety and AI-Regulatory Risk
  body: PFN’s semiconductor ambitions sit inside a tightening U.S.-Japan-EU regulatory perimeter. BIS and CSIS sources
    show that advanced AI chips, EDA software, semiconductor manufacturing equipment and high-end compute supply
    chains are regulated chokepoints. Japan’s METI controls add domestic export-control considerations, and any
    PFN hardware or software sold into China-linked, military-linked or restricted end uses could trigger license,
    end-use or customer-screening obligations. Physical robotics and mobility applications add safety exposure under
    industrial robot standards such as ISO 10218, especially when PFN technology moves from lab environments into
    factories, logistics, autonomous mobility or service robots. The EU AI Act adds an additional risk tier for
    PFN systems placed on or used in Europe. No public evidence shows an export-control classification matrix, AI
    Act compliance mapping, safety incident history, or third-party robotics safety certification. The residual
    exposure is therefore medium-to-high severity with diligence focused on legal opinions, licenses, safety files
    and customer end-use controls.
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR038
  - CR039
  - CR045
  tableRefs:
  - TR002
  figureRefs: []
- id: financial-talent-macro-risks
  title: Financial, Funding, Talent and Macro Risk
  body: 'PFN is a private, capital-intensive AI infrastructure company. Public market-data sources confirm funding
    and unicorn positioning, but they do not disclose revenue, ARR, gross margin, operating loss, cash burn, runway,
    hardware gross margin, capex needs or debt obligations. The combination of custom semiconductors, compiler work,
    foundation models and industrial deployments implies a cost base that may be difficult to fund if AI-infrastructure
    sentiment weakens. Reuters coverage of AI-bubble concern is not a PFN-specific indictment, but it is directly
    relevant to the next financing cycle for a private AI company with limited public financial disclosure. Japan’s
    weak yen can cut both ways: it may help yen-denominated costs when translated into USD, but it can increase
    imported compute, EDA, equipment and cloud costs and complicate USD valuation comparisons. Talent risk is similarly
    material because PFN needs a rare mix of AI researchers, compiler engineers, robotics specialists and semiconductor
    product talent competing against hyperscalers and national champions.'
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR040
  tableRefs:
  - TR005
  figureRefs:
  - FR003
- id: governance-adverse-events
  title: Governance, Reputation, IP and Adverse-Event Risk
  body: 'The reviewed public record produced multiple adverse or disconfirming signals but no confirmed scandal,
    enforcement action, founder departure, accounting issue or layoff event through the run date. The strongest
    adverse datapoints are not sensational: Chainer moved to maintenance mode, independent analysts scrutinize MN-Core
    as a niche accelerator, CB Insights shows negative Mosaic Score movement, and macro/market sources warn about
    AI-bubble and yen risks. That pattern matters because PFN’s valuation depends on belief that deep technical
    assets will become durable products. IP risk is material but mostly latent: JPO guidance confirms AI inventions
    are an active examination area, and PFN’s collaboration-heavy history with Toyota, FANUC, Kobe University, Facebook/PyTorch
    and other partners makes ownership, contribution rights, patent licenses and open-source obligations key diligence
    areas. The absence of public controversy should not be mistaken for low governance risk; it means the decisive
    evidence is private board minutes, customer contracts, cap tables, patent assignments and management retention
    agreements.'
  claimRefs:
