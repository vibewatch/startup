  title: PFN’s biggest competitor is ecosystem gravity
  body: NVIDIA, Google, Toyota, Amazon, Mobileye, and specialized pharma or agriculture vendors can narrow PFN’s advantage even when PFN has strong research. The diligence question is where PFN has productized switching cost rather than admirable breadth.
  claimRefs:
  - CP029
  - CP030
  - CP035
  - CP039
  - CP040
