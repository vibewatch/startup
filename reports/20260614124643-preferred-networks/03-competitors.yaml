company:
  name: Preferred Networks, Inc.
chapter:
  number: 3
  title: Competitors
  summary: Preferred Networks competes less like a single-product startup and more like a portfolio of AI bets facing best-of-breed rivals in each lane. MN-Core is pressured by NVIDIA, Google, AMD, Intel, and custom-silicon specialists; robotics perception faces NVIDIA Isaac, Boston Dynamics, Covariant, Skild AI, Physical Intelligence, Figure, and Sanctuary; automotive AI competes with Waymo, Wayve, Mobileye, NVIDIA DRIVE, and Toyota Woven; PLaMo faces Japanese AI peers such as Sakana, rinna, ABEJA, and ELYZA; PFN Bio faces dedicated AI-drug-discovery platforms; and CraftyFarm faces specialized agriculture automation. PFN’s moat is breadth, Japan ecosystem credibility, and research depth, but its risk is that customers multi-home or buy focused platforms with stronger distribution.
sections:
- id: landscape
  title: Competitive Landscape Across PFN’s Many Jobs-to-be-Done
  body: 'Preferred Networks does not have one clean peer group; it has several overlapping arenas because the company spans AI chips, deep-learning software, robot perception, Japanese foundation models, AI drug discovery, and agriculture robotics. In AI infrastructure, MN-Core competes against the gravitational pull of NVIDIA H100, H200, and Blackwell, plus AMD MI300, Intel Gaudi, Google TPU, Cerebras, Graphcore, and SambaNova. In robotics and perception, the relevant alternatives include NVIDIA Isaac, Boston Dynamics Spot, Covariant, Skild AI, Physical Intelligence, Figure AI, and Sanctuary AI. Automotive work is compared against Waymo, Wayve, Mobileye, NVIDIA DRIVE, and Toyota’s own Woven organization. PLaMo’s domestic mindshare competes with Sakana AI, rinna, ABEJA, and ELYZA. PFN Bio faces Recursion, Isomorphic Labs, Insilico, BenevolentAI, and Schrödinger, while CraftyFarm is exposed to specialized agriculture robotics such as Plenty, FarmWise, and Carbon Robotics. The status quo is
    also material: many customers can build internally, rent cloud GPUs, buy off-the-shelf robot platforms, or keep domain-specific teams in-house.'
