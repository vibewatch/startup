  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: PFCP
    missingEvidence: PFCP customer list, SLA, region, architecture and security documentation for external compute customers.
    whyItMatters: PFCP is central to the stack, but public materials do not establish whether it is a scalable external cloud
      product or mostly internal infrastructure.
    diligencePath: Request PFCP customer contracts, architecture diagrams, availability statistics, security reports and roadmap
      from management.
    relatedQuestionRefs:
    - QE015
    - QE016
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: KDDI
    missingEvidence: Primary source confirming the reported 2024 KDDI investment in GPU compute hosted by PFN and the exact
      scope of the partnership.
    whyItMatters: If verified, KDDI would materially improve third-party infrastructure validation; if not, it should not
      support the investment case.
    diligencePath: Ask PFN/KDDI for the original announcement, contract scope, hosting site, committed GPU capacity and customer
      access terms.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: MN-Core supply
    missingEvidence: Manufacturer, packaging, yield, volume commitments and cost curves for MN-Core 2 and MN-Core L1000.
    whyItMatters: The chip roadmap cannot be underwritten without supply-chain and unit-cost evidence beyond first-generation
      TSMC disclosure.
    diligencePath: Review foundry agreements, packaging partner contracts, yield reports, board BOMs and customer purchase
      orders under NDA.
    relatedQuestionRefs:
    - QE031
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: trust and compliance
    missingEvidence: SOC 2, ISO 27001, model safety evaluation, data residency, export-control and incident-response evidence
      for PFCP and PLaMo.
    whyItMatters: Enterprise and government AI buyers require controls that are not enumerated on public product pages.
    diligencePath: Request security questionnaires, audit letters, AI governance policy, red-team results, customer DPAs and
      export-control memos.
    relatedQuestionRefs:
    - QE032
  - type: enumeration-incomplete
    severity: minor
    topic: customer proof
    missingEvidence: Unaffiliated customer case studies for MN-Core 2, PFCP and PLaMo usage at production scale.
    whyItMatters: Affiliated workloads are technically useful but may overstate market pull.
    diligencePath: Interview reference customers and compare paid external workloads against internal or subsidiary workloads.
    relatedQuestionRefs:
    - QE017
    - QE018
    relatedTableRefs:
    - TE004
