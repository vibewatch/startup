- id: robotics-applications
  title: 'Robotics, Materials, and Customer Applications: Affiliated Workloads Validate the Stack'
  body: 'PFN’s most concrete non-model applications sit in robotics and materials. The Toyota relationship began with self-driving
    R&D in 2014, expanded to service robots in 2019, and reappeared in 2026 as physical-AI research using MN-Core L Series
    processors for robots that need high-speed on-premise inference. FANUC’s 2015 capital alliance gave PFN a second industrial
    robotics anchor. Kachaka, a Preferred Robotics autonomous mobile robot product, gives the group a commercial robotics
    surface and also serves as an MN-Core workload example. In materials, PFCC’s Matlantis is a clearer product: it launched
    as a cloud atomistic simulator in 2021, expanded to the United States in 2023, and is backed by the PFP neural-network-potential
    line published in Nature Communications. These applications matter because they create captive workloads for MN-Core and
    PLaMo; the risk is that affiliated validation may overstate third-party demand until more unaffiliated customer proof
    is disclosed.'
  claimRefs:
  - CE030
