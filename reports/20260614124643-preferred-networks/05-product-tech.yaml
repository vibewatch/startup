- id: ai-chips-mn-core
  title: 'AI Chips & Compute: MN-Core Efficiency Wins, Commercialization Still Proving Out'
  body: 'The strongest hard-technology evidence is the MN-Core line. PFN disclosed the first MN-Core as a TSMC 12nm matrix-operations
    accelerator targeting 1.0 TFLOPS/W in half precision, then used 160 chips in MN-3. TOP500 independently corroborated the
    core claim: MN-3 led the June 2020 Green500 at 21.1 GFLOPS/W and again led the November 2021 list at 39.38 GFLOPS/W. PFN
    has since moved from benchmark demonstration to productization: the chips page lists MN-Core 2 boards, an eight-board
    MN-Server 2, and a Devkit with published Japan pricing. The same page claims real workload wins in Kachaka optimization
    and Matlantis simulation. However, GPU displacement is not yet proved. KDDI’s public GPU Cloud page illustrates how mainstream
    enterprise AI infrastructure still centers NVIDIA GPUaaS, while PFN’s public evidence emphasizes internal or affiliated
    workloads. Diligence should therefore treat MN-Core as credible differentiated silicon with unproven ecosystem breadth.'
  claimRefs:
