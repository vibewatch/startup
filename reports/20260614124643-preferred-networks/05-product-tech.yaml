callouts:
- calloutType: strength
  title: Green500 wins are independently corroborated hard-tech proof
  body: Unlike many AI chip startups with only forward-looking claims, PFN operated MN-3 and had its energy efficiency independently
    reported by TOP500 in 2020 and 2021. That does not prove market adoption, but it materially validates engineering capability.
  claimRefs:
  - CE006
  - CE007
- calloutType: risk
  title: GPU ecosystem gravity remains the central adverse case
  body: PFN’s MN-Core claims are credible, yet enterprise AI infrastructure remains heavily NVIDIA-centered. Unless PFN shows
    broader developer tooling, external workloads and supply commitments, MN-Core may remain a high-performing internal accelerator
    rather than a platform business.
  claimRefs:
  - CE039
  - CE040
  - CE041
- calloutType: risk
  title: Trust and compliance evidence is missing from the public record
  body: PFN markets compute and models to enterprise and government contexts, but public sources reviewed here did not enumerate
    SOC 2, ISO 27001, model safety, data residency or export-control controls. These should be requested before underwriting
    regulated deployments.
  claimRefs:
  - CE042
