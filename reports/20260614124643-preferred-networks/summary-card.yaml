  topStrengths:
    - >-
      Genuine vertical integration across custom MN-Core silicon, large-scale compute, the PLaMo foundation model, and
      applied solutions — rare among private AI companies globally and unique within Japan.
    - >-
      Deep, multi-year strategic-anchor relationships with Toyota (automotive perception) and Fanuc (industrial
      robotics) that double as both customers and long-standing investors.
    - >-
      Diversified application footprint — Matlantis (ENEOS), drug discovery (Chugai), Kachaka consumer robot (Preferred
      Robotics), CraftyFarm agriculture (Oisix) — that hedges single-vertical risk.
    - Strong technical credibility (MN-3
    - >-
      Continued access to capital from large Japanese institutions, banks and government-aligned investors (SBI, MUFG,
      Resona, SMBC, DBJ, Mitsubishi Corp, Sekisui House, Wacom) into late 2024 / 2025.
  topRisks:
    - >-
      No audited revenue, gross margin, segment economics or post-2017 primary-market valuation is publicly disclosed;
      the live $2B narrative leans on Latka / The Bridge / CB Insights trackers that conflict with PremierAlts' $1.0B
      secondary mark.
    - >-
      Heavy commercial dependence on a small number of strategic shareholders (Toyota, Fanuc, NTT, Mitsui) that are
      simultaneously customers, creating governance and revenue-concentration risk.
    - >-
      MN-Core faces a near-monopoly NVIDIA stack plus rising hyperscaler in-house silicon (TPU, Trainium, MAIA, MTIA)
      and well-funded merchant rivals; PFN's 2024 sale of the MN-Core 2 chip business raises questions about
      merchant-chip strategy.
    - >-
      Japan-specific risks — yen weakness compressing USD valuation, US export-control rules on advanced AI chips, a
      small domestic LLM TAM relative to global hyperscalers, and a chronic senior-AI-engineer talent shortage.
    - >-
      Limited near-term IPO path on the Tokyo Stock Exchange Growth / Prime market against a softening AI-valuation
      environment; future rounds could re-price down toward the PremierAlts $1.0B mark.
  unresolvedGaps:
    - >-
      Audited consolidated revenue, gross margin and segment economics (chip / cloud / Matlantis / PLaMo / robotics /
      services split).
    - >-
      A reconciled primary-market valuation post-2017 that explains the $1.0B vs $2B+ gap between PremierAlts and Latka
      / The Bridge / CB Insights.
    - >-
      Full cap table, liquidation preferences and any secondary-market activity around the December 2024 / April 2025
      financing series.
    - Forward MN-Core L1000 commercial pipeline, deployed unit volume and customer wins outside PFN's own cloud.
    - >-
      Independent post-deployment evidence on the Kachaka home-robot install base, CraftyFarm field trials and Matlantis
      enterprise net-revenue retention.
