      - number: '5.5'
        title: IP、研究速度、信任与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              技术护城河是一组研究、开源、硅片 know-how 和领域专属数据，而不是公开来源中可见的单一专利墙。PFN 已发布或维护 Chainer、CuPy、Optuna 和
              pfio；它用已发布的能效结果打造自研硅片；运营日语基础模型线；并把材料仿真研究转化成 Matlantis。这种广度稀缺，但也让尽调更复杂。公开来源还没有回答几个部署关键问题：MN-Core 2/L1000
              的准确制程和供应承诺、PFCP 服务级架构、模型安全控制、出口管制姿态、数据驻留和客户安全认证。反面案例不是 PFN 缺技术，而是其技术可能在关联或日本特定场景中最强；与此同时，全球企业 AI 围绕 NVIDIA
              基础设施、hyperscaler 云和拥有更大开发者基础的开源模型生态标准化。
