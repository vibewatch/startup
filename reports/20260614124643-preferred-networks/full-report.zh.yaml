              年收入 $42 million；Growjo 估计 $49.5 million；AI Market Watch 指向历史 84.86 亿日元指标和 280–340 名员工区间；RocketReach 给出低得多的
              2026 年 $15.3 million，像是离群值。稳妥做法是把中间簇作为方向性证据，并明确排除经审计财务处理。收入模式本身看起来多元：伙伴共同创造、AI 解决方案、PFCP 云计算、自有 AI
