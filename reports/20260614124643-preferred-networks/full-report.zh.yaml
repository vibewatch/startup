      - number: '5.4'
        title: 机器人、材料与客户应用：关联工作负载验证技术栈
        blocks:
          - type: paragraph
            body: >-
              PFN 最具体的非模型应用落在机器人和材料。Toyota 关系始于 2014 年自动驾驶研发，2019 年扩展到服务机器人，并在 2026 年以 physical-AI 研究重新出现，使用 MN-Core L
              Series 处理器支持需要高速本地推理的机器人。FANUC 2015 年资本联盟给了 PFN 第二个工业机器人锚点。Preferred Robotics 的自主移动机器人产品 Kachaka
              为集团提供商业机器人界面，也充当 MN-Core 工作负载案例。材料领域，PFCC 的 Matlantis 是更清晰的产品：它 2021 年作为云端原子级模拟器推出，2023 年扩展到美国，并由发表在
              Nature Communications 的 PFP 神经网络势产品线支撑。这些应用很重要，因为它们为 MN-Core 和 PLaMo 创造了 captive
              workloads；风险在于，在披露更多非关联客户证据之前，关联验证可能高估第三方需求。
