  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks (PFN) 不应按一家泛 AI 公司来测算规模。它的市场边界是一组 physical-AI 与 scientific-AI 视角，并由伙伴商业化锚定：与 Fanuc 和
              MHI 相关的工业 AI 与智能制造、工业机器人智能、Toyota 相关 physical AI 与自动驾驶软件、MN-Core AI 基础设施和加速器、作为较窄期权价值的农业机器人，以及通过 Chugai
              式实验自动化切入的 AI 驱动药物发现。纳入的支出是 PFN 可通过共同创造或授权合理影响的软件、模型、加速器和集成价值。排除的支出包括消费者 AI 应用、没有 PFN
              计算角色的一般云服务、整车硬件、与自主化无关的广义农机，以及非计算或非自动化的制药湿实验室支出。结果不是一个标题式 TAM，而是买方高度不同的多市场边界。
            claimRefs:
