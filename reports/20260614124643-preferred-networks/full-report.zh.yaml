  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业化与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks 仍是一家上行高、执行风险也高的公司，因为其既定战略横跨半导体、计算基础设施、基础模型、机器人和垂直应用。这种广度带来商业化挑战：PFN
              必须把研究级技术转成可重复产品，同时继续为 Toyota、FANUC 和其他工业客户维护伙伴专属解决方案。历史上的 Chainer 向 PyTorch 迁移，是 PFN
              自创平台失去独立战略重要性的最清晰公开案例；管理层自己也表示，深度学习框架作为竞争边缘的时代已经成熟。客户集中度也与普通企业集中度结构不同，因为 Toyota 和 FANUC
              既是战略合作者，也是生态守门人。Toyota 内部 Woven by Toyota 能力形成替代风险，而 FANUC 专属 FIELD
              集成同时带来锁定和依赖风险。公开记录没有披露收入结构、合同最低额、积压订单、总留存，或 Toyota/FANUC 在 2026 年是否仍是重要收入来源，因此在私有尽调完成前，合适的风险姿态是高严重性、中等可能性。
