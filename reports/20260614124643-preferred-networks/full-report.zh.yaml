              2026 年公告提升了证据新鲜度，也显示 PFN 仍在把研究深度转化为战略伙伴入口。约束同样重要：工业 AI 需要漫长验证周期，安全关键基础设施买方要求可靠性和可审计性，AI 加速器面临 NVIDIA
              级生态锁定和晶圆代工产能限制，农业机器人单位经济性差且受季节性影响，药物发现 AI 则有临床转化风险。Chugai 管线的不利信号并非 PFN 专属，但说明计算发现应被视为高上行、高验证风险敞口。公开证据无法计算
