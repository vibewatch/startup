      - number: '7.3'
        title: 地缘政治、出口管制、安全和 AI 监管风险
        blocks:
          - type: paragraph
            body: >-
              PFN 的半导体雄心落在不断收紧的美国、日本和欧盟监管边界内。BIS 和 CSIS 资料显示，先进 AI 芯片、EDA 软件、半导体制造设备和高端算力供应链都是受监管的卡点。日本 METI
              管制又叠加了本国出口管制考量；任何 PFN 硬件或软件若销售给涉华、涉军或受限终端用途，都可能触发许可、最终用途或客户筛查义务。实体机器人和移动应用还会带来工业机器人标准下的安全敞口，例如 ISO
              10218；PFN 技术一旦从实验室进入工厂、物流、自动移动或服务机器人场景，风险更明显。欧盟 AI Act 则给投放或使用在欧洲的 PFN 系统再加一层风险。公开证据没有显示出口管制分类矩阵、AI Act
              合规映射、安全事故记录，或第三方机器人安全认证。因此，剩余敞口为中到高严重度，尽调应聚焦法律意见、许可证、安全文件和客户最终用途控制。
