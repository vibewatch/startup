      - number: '2.2'
        title: 市场规模——TAM、SAM、SOM 与分部视角
        blocks:
          - type: paragraph
            body: >-
              规模测算答案是区间，不是点估计。最宽的全球 AI 支出视角只适合作背景：Gartner 的 2026 年 AI 支出预测超过 $2.5 trillion，Fortune Business Insights 则给出
              2026 年全球 AI 市场 $375.93 billion。PFN 更近的视角更小但更相关：2026 年智能制造为 $387.14 billion，工业机器人为 $15.5 billion，AI 加速器芯片为
              $154.6 billion，自动驾驶软件按 Precedence 约为 2026 年 $2.97 billion，按 MarketsandMarkets 则从 2024 年 $1.8 billion 增至
              2035 年 $7.0 billion，农业机器人为 $18.0 billion，AI 药物发现约为 $2.9 billion。日本本土需求也有意义：IDC 预计日本 AI 基础设施在 2026 年超过 $5.5
              billion，而日本 AIaaS 与全 AI 预测因定义不同而差异很大。因此，PFN 的可服务市场应被限制在日本工业 / physical-AI 部署、AI 基础设施和选定伙伴垂直领域，而不是整个 AI
              经济。公开来源的市场规模还带来一个重要解释规则：这些市场相邻，不能相加。Toyota physical-AI 验证点不能像完整自动驾驶汽车供应商那样估值；MN-Core 部署不能像占主导地位的商用 GPU
              厂商那样估值；Chugai 或农业验证点也不能自动迁移到工业机器人。因此，本章把每个视角都视为独立尽调路径，各自拥有买方、预算所有者、转化证据和失败模式。
