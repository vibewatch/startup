      - number: '7.5'
        title: 治理、声誉、知识产权和不利事件风险
        blocks:
          - type: paragraph
            body: >-
              截至运行日期，所审阅的公开记录给出了多项不利或反证信号，但没有确认的丑闻、执法行动、创始人离职、会计问题或裁员事件。最强的不利数据点并不戏剧化：Chainer 转入维护模式，独立分析师把 MN-Core
              作为利基加速器审视，CB Insights 显示 Mosaic Score 下行，宏观和市场来源警示 AI 泡沫与日元风险。这个模式很关键，因为 PFN
              的估值取决于一个信念：深厚技术资产能变成耐久产品。知识产权风险重要但大多潜伏：JPO 指引确认 AI 发明是活跃审查领域；PFN 与 Toyota、FANUC、Kobe
              University、Facebook/PyTorch
              等伙伴长期合作，所有权、贡献权、专利许可和开源义务因此成为尽调重点。没有公开争议，不应被误读为治理风险低；这只说明决定性证据藏在非公开董事会纪要、客户合同、股权结构表、专利转让文件和管理层留任协议里。
