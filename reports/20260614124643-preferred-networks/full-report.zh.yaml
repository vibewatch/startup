        - Fanuc 关系和日本机器人密度使其成为直接观察镜头
      - - 自动驾驶 / 实体 AI
        - 感知、推理加速、仿真和实体 AI 研究软件
        - 车辆硬件、网约车车队价值、与 PFN 无关的消费级 ADAS 订阅
        - Toyota 研发、移动出行工程团队
        - Toyota FRC 2026 研究验证了进入渠道，但未验证收入规模
