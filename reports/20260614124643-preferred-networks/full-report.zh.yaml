  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史和隐含估值
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks 的估值档案里有一个异常久远但仍重要的锚点：2017 年 8 月 Toyota 融资。PFN 自己的新闻稿确认 Toyota 投资约 ¥10.5
              billion；独立报道则称该轮约 $95 million，并将其与数十亿美元隐含价值联系起来。由于 2024 年和 2025 年公告披露了资本规模，却没有披露投后估值，这仍是最后一个清晰的外部估值标记。2024
              年 12 月首关很重要——SBI Group 领投股权，加上银行债务，合计 ¥19 billion——随后 2025 年 4 月又有 ¥5 billion，2025 年 6
              月还有一笔未披露金额的扩展轮。这些融资在战略上是正面信号，因为它们在 Toyota 的历史支持基础上加入了 SBI、Development Bank of Japan、Mitsubishi Corporation
              和 Wacom。但它们不是估值证明。公开证据支持一个保守结论：PFN 仍是独角兽质量资产，但 2024–2026 窗口内任何 $2.5–3.0 billion 估值说法都未获确认，应作为尽调假设，而不是事实。
