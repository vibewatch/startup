      - number: '8.2'
        title: 可比公司倍数
        blocks:
          - type: paragraph
            body: >-
              可比组刻意拆开看，而不是混成一个头部倍数。NVIDIA 和 AMD 能提示 AI 芯片上行空间，但它们是有规模的上市半导体公司，具备供应链、毛利率和平台优势；PFN
              尚未公开证明这些能力。Palantir、C3.ai 和 UiPath 可用于框定企业 AI 软件倍数，但它们也比 PFN 更纯软件，PFN 则混合了芯片、云、机器人和材料仿真服务。Fanuc、CYBERDYNE
              和 SenseTime 给出反方向参照：当增长、利润率或监管敞口不达预期时，机器人和 AI 实施业务可以用更低倍数交易。私有可比公司把区间拉宽：OpenAI 和 Anthropic
              显示前沿模型稀缺性可以有多贵；Cohere、Mistral、Figure、Wayve 和 Sakana AI 更接近，但仍不完美。Sakana AI 这个数据点尤其相关：据报道其估值为 $1.5
              billion，这压缩了 PFN 的日本 AI 稀缺性溢价，也削弱了 PFN 理所当然应享有本土最高 AI 倍数的简单说法。
