      - number: '8.4'
        title: 退出路径和流动性
        blocks:
          - type: paragraph
            body: >-
              PFN 有可行但并非临近的流动性路径。短期看，Tokyo Stock Exchange Growth Market IPO 比 Prime 更可信，因为 PFN 仍是一家私有、由风险资本支持的科技公司；但 JPX
              指引说得很清楚，上市是经过审计的多步骤流程，不是靠公告驱动的事件。本文审阅的公开来源没有显示已审计财务报表、上市公司治理准备度或近期 IPO 申报。因此，战略并购可能是更可信的早期路径，尤其是在
              Toyota、SBI、Mitsubishi 相关投资者和 MHI 都释放工业兴趣之后。潜在买家不会按通用 AI 实验室估值：他们承销的是芯片、云基础设施、机器人、材料仿真和日本主权 AI
              定位。建议是在估值偏紧的前提下继续研究。只有尽调证明高毛利经常性收入、芯片需求、可信的 PLaMo 商业化和干净的优先权经济，才应上调；若所谓估值重置得到印证，或 ARR 与毛利率仍不披露，则下调为回避。
