      - number: '7.2'
        title: 竞争与技术替代风险
        blocks:
          - type: paragraph
            body: >-
              PFN 的 MN-Core 策略面对一组异常强的竞争对手。NVIDIA 不只是芯片供应商；它把先进加速器、CUDA、库、开发者心智和采购生态绑在一起，切换成本很高。CSIS 对 CUDA
              生态效应的讨论说明了一个问题：即便利基加速器技术效率不错，商业化仍可能卡住，因为客户必须把软件、工具和运营经验从既有技术栈迁出来。超大云厂商自研芯片进一步加压。AWS Trainium 和 Google TPU
              不是孤立出售的芯片，而是嵌在云采购、支持、定价和模型工作流里。开放基础模型也压缩了芯片之上软件层的差异化空间。PFN 自有 MN-Core
              页面提供了真实产品和价格证据，但公开资料没有证明它有广泛第三方部署、单位经济、利用率，或可与 CUDA、Trainium、TPU 相比的开发者生态。因此，竞争替代是前三大投资论点风险之一。
