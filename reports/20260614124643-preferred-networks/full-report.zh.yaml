  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 架构与平台：垂直整合，而非单一产品
        blocks:
          - type: paragraph
            body: >-
              PFN 当前产品面最好理解为垂直整合的 AI 栈，而不是传统单一产品初创公司。公开首页称公司整合 AI 芯片、计算基础设施、生成式 AI、解决方案和产品；产品页面随后把该战略映射到四层。底层是 MN-Core
              处理器和 PFCP 计算容量。其上是软件框架、编译器、运行时工具和开源库，帮助 PFN 团队把 PyTorch/JAX 时代的工作负载映射到 PFN 自有计算上。模型层是
              PLaMo，这是一个面向日语的基础模型家族，提供 API、聊天、翻译、开放模型和企业定制界面。应用层包括用于原子级材料仿真的 Matlantis、Kachaka 和通过集团公司 Preferred
              Robotics 推进的工业机器人，以及面向制造、材料、生命科学、公共部门和企业客户的定制 AI 解决方案。这种架构形成真实差异化，因为 PFN
              可以一起调优硅片、编译器、模型和应用；它也带来执行风险，因为每一层都有不同的商业化时钟和买方。
