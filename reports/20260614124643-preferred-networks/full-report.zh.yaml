      - number: '8.3'
        title: 情景和分部加总估值
        blocks:
          - type: paragraph
            body: >-
              最能自洽的方法是分部加总叠加情景分析。单一收入倍数会制造虚假精确度，因为 PFN 没有公开披露收入、ARR、分部利润率、客户集中度或单位经济。因此，模型分别给 AI 芯片、PLaMo 与企业 AI、机器人、材料
              / 药物发现软件、云基础设施和战略期权价值设定估值区间。基准情景约为 $2.0–2.8 billion，大致符合高质量日本 AI 独角兽，但不足以保证在传闻区间高端进入后获得风险投资回报。熊市情景为
              $1.0–1.6 billion，前提是 AI 估值重置压力、硬件利润率拖累和薄弱经常性收入占主导。牛市情景为 $4.0–6.0 billion，但需要证明 MN-Core 或 PLaMo 的表现更像稀缺 AI
              基础设施，而不是定制化日本工业研发。若以 $2.5 billion 进入，3x 目标回报需要 $7.5 billion 退出；若以 $3.0 billion 进入，则需要 $9.0
              billion，且还未计入稀释或清算优先权。
