        title: 估值轨迹与市场数据冲突
        blocks:
          - type: paragraph
            body: >-
              估值故事有吸引力，但不干净。The Bridge 的日文报道显示，2024 年 12 月轮后 PFN 市值超过 3000 亿日元；Latka 列出 2024 年 $2 billion 估值。这些数据点与 PFN
              是日本 AI 独角兽这一基础事实方向一致。然而，PremierAlts 列出截至 2025 年 6 月明显更低的 $1.0 billion 估值；任何依赖简单 $2 billion
              标题的投资者都应把它视为不利数据点。承销答案是展示区间，而不是选择最漂亮的数字。如果估计收入约为 $42 million 至 $56 million，$2 billion 估值意味着约 36x 至 48x
              收入；较低的 $1.0 billion 估计仍意味着约 18x 至 24x 收入。任一倍数区间都要求投资者相信 PFN 的芯片、PFCP cloud、PLaMo 模型和工业解决方案能复利成高质量毛利。
