      - number: '5.3'
        title: 模型与软件：Chainer 遗产、PyTorch 迁移与 PLaMo 商业化推进
        blocks:
          - type: paragraph
            body: >-
              对一家日本工业 AI 公司而言，PFN 的软件可信度异常深。Chainer 于 2015 年发布，帮助普及 define-by-run 动态计算图；ChainerX 后来试图把 ndarray
              和自动微分的性能关键路径迁入 C++。PFN 在 2019 年决定将 Chainer 转入维护并把研究迁移到 PyTorch，这本身是正向治理信号，而非失败：公司识别到框架生态正在整合，于是把工程能量转向
              PyTorch 社区贡献、CuPy、Optuna 和应用专属工具。Optuna 和 CuPy 继续提供可见的开发者信号，PFN 的 Hugging Face 组织也给 PLaMo
              外部模型分发界面。模型线已经从子公司实验转向核心战略：Preferred Elements 成立于 2023 年，PLaMo Prime 于 2024 年通过 API 和聊天发布，PFN 又在 2025
              年宣布将吸收 Preferred Elements，以加快 PLaMo 的社会落地。
