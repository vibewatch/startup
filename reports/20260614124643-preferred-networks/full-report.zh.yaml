            body: >-
              PFN 的公司故事如今是一组相互连接的技术押注。MN-Core 和 MN-3 提供硬件与计算验证：PFN 称 MN-3 三次登顶 Green500，TOP500 和 Supermicro 则独立印证了 MN-3
              系统和能效成绩。Preferred Elements 把 PFN 延伸到多模态基础模型，Matlantis 承接计算化学和材料仿真；与 Mitsubishi
              Corporation、IIJ、Rapidus、Sakura Internet 和 GMO 的合作公告显示，计算栈正在走向合资商业化，而不只是内部研究资产。应用侧，ENEOS 公开确认与 PFN
              实现炼油厂自主运行，2026 年 6 月发布又新增与 Mitsubishi Heavy Industries 的关键任务 AI，以及与 Toyota 的 physical-AI
              研究。这些证据支撑真实的工业伙伴基础，但还不能证明透明的收入基础。
