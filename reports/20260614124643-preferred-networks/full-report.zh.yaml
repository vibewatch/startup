      - number: '5.2'
        title: AI 芯片与计算：MN-Core 赢得能效，商业化仍需证明
        blocks:
          - type: paragraph
            body: >-
              最强的硬科技证据来自 MN-Core 产品线。PFN 披露第一代 MN-Core 是一款 TSMC 12nm 矩阵运算加速器，目标是在半精度下达到 1.0 TFLOPS/W，随后在 MN-3 中使用 160
              颗芯片。TOP500 独立印证了核心主张：MN-3 在 2020 年 6 月 Green500 以 21.1 GFLOPS/W 夺冠，并在 2021 年 11 月榜单以 39.38 GFLOPS/W
              再次登顶。PFN 此后从基准演示走向产品化：芯片页面列出 MN-Core 2 板卡、八板 MN-Server 2，以及带有日本定价的 Devkit。同一页面声称在 Kachaka 优化和 Matlantis
              仿真的真实工作负载中取得优势。但 GPU 替代尚未被证明。KDDI 公开 GPU Cloud 页面说明，主流企业 AI 基础设施仍以 NVIDIA GPUaaS 为中心，而 PFN
              公开证据强调内部或关联工作负载。因此，尽调应把 MN-Core 视为可信的差异化硅片，但生态广度仍未被证明。
