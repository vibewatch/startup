      - number: '3.4'
        title: 护城河持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              PFN 的护城河最有防御力的地方，是其研究广度变成复利能力，而不是一组互不相关的押注。如果客户围绕 PFN 硬件和软件优化工作负载，MN-Core 可以形成切换成本，但这种优势容易受 CUDA、TPU
              可用性和采购习惯冲击。如果 PFN 掌握生产数据和部署工具，机器人感知会变黏；但机器人基础模型初创公司和 NVIDIA Isaac 可以把部分技术栈商品化。PLaMo 受益于日语专长，但 GTM 更清晰的日本
              AI 厂商可以赢得账户。PFN Bio 和 CraftyFarm 有期权价值，但专注药物发现或农业的竞争对手能展示更干净的垂直聚焦。最大风险是多供应商并用：客户可以用 NVIDIA GPU、Toyota 或
              Mobileye 自动驾驶栈、日本 LLM 厂商、制药 AI 专家和作物专属机器人，而不在 PFN 上标准化。因此，尽调不应只问 PFN 是否有聪明技术，而要测试 PFN
              在哪里拥有产品化证明、分发和聚焦对手难以中和的切换成本。
