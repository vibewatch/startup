              PFN 的资本历史主要由日本产业和金融战略支持者主导。Toyota 在 2015 年投资 10 亿日元，2017 年又追加约 105 亿日元，使 Toyota 成为当时最大的外部股东。FANUC 在 2015
              年投资 9 亿日元，PFN 的里程碑年表还列出 2017 年与 Hakuhodo DY、Mitsui、Mizuho 和 Hitachi 的资本合作。近期融资把故事从出行 / 机器人研发转向日本制造 AI
              半导体和计算基础设施：SBI 在 2024 年同意最高投资 100 亿日元；PFN 随后在 2024 年 12 月宣布 190 亿日元首关，并在 2025 年 4 月追加 50 亿日元，使该轮迄今达到 240
