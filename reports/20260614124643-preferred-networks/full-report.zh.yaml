        - MN-Core 处理器、AI 基础设施、冷却和内部 / 伙伴算力平台
        - 商品云算力转售、PFN 没有份额的 GPU
        - AI 基础设施运营商、模型团队、主权 AI 项目
        - TAM 很大，但生态和资本强度风险最高
      - - 农业机器人
        - 自主农场机器人、机器视觉、喷洒、收割和农场自动化软件
        - 传统拖拉机、种子 / 化学投入品、不含机器人的农场管理
        - 农场经营者、农业设备 OEM
        - 小型期权价值视角；PFN 相关 CraftyFarm 证据公开更新不足
      - - AI 驱动药物发现
        - 计算化学、实验自动化、分子仿真和 AI 发现平台
        - 不含 AI 自动化的湿实验服务、临床试验支出
        - 药企研发、发现平台团队
        - Chugai 关系和 MALEXA 背景验证邻近性，但临床转化风险仍在
