  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: PFN 多重任务场景下的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks 没有一个清晰的同业组；它有多个重叠战场，因为公司横跨 AI 芯片、深度学习软件、机器人感知、日本基础模型、AI 药物发现和农业机器人。在 AI 基础设施中，MN-Core
              要对抗 NVIDIA H100、H200 和 Blackwell 的引力，也要面对 AMD MI300、Intel Gaudi、Google TPU、Cerebras、Graphcore 和
              SambaNova。在机器人与感知中，相关替代方案包括 NVIDIA Isaac、Boston Dynamics Spot、Covariant、Skild AI、Physical
              Intelligence、Figure AI 和 Sanctuary AI。汽车业务要与 Waymo、Wayve、Mobileye、NVIDIA DRIVE 以及 Toyota 自有 Woven
              组织比较。PLaMo 在日本本土的心智份额与 Sakana AI、rinna、ABEJA 和 ELYZA 竞争。PFN Bio 面对 Recursion、Isomorphic
              Labs、Insilico、BenevolentAI 和 Schrödinger，而 CraftyFarm 暴露于 Plenty、FarmWise 和 Carbon Robotics
              等专业农业机器人。现状替代也很关键：许多客户可以内部自建、租用云 GPU、购买现成机器人平台，或保留领域专属团队在内部。
