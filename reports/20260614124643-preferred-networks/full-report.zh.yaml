companyProfile:
  summary: >-
    Preferred Networks (PFN) 是一家总部位于东京的深度学习公司，2014 年 3 月由 Toru Nishikawa 和 Daisuke Okanohara 从 Preferred Infrastructure
    拆分创立。PFN 将自己定位为垂直整合的 AI 平台：与 Kobe University 设计自有 MN-Core 深度学习加速器，运营大规模 GPU 与 MN-Core 计算基础设施，在日本 NEDO GENIAC 计划下训练
    PLaMo 基础模型系列，并把这些能力落到工业机器人（Fanuc）、汽车感知（Toyota）、材料发现（与 ENEOS 合作的 Matlantis）、药物发现（Chugai Pharmaceutical）、农业（与 Oisix
    合作的 CraftyFarm）和消费机器人（Preferred Robotics 旗下 Kachaka）。它被广泛视为日本估值最高的私营 AI 初创公司。
  foundedDate: '2014-03-26'
  founders:
    - name: Toru Nishikawa
      role: 联合创始人、董事长（前 CEO）
      background: University of Tokyo 计算机科学校友，也是 Preferred Infrastructure（2006）的联合创始人；长期担任 PFN CEO，后转任董事长，具备深度学习研究与工程背景。
