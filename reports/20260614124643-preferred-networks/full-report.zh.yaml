    approximationNotes: 定性矩阵来自风险登记表和公开证据；不是内部控制评估。
    claimRefs:
      - CR041
      - CR043
      - CR045
  - id: FR006
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示技术、监管和融资风险如何传导到收入质量和估值。
    data:
      nodes:
        - id: n1
          label: 商业化延迟
        - id: n2
          label: Toyota / FANUC 集中度
        - id: n3
          label: NVIDIA / hyperscaler 替代
        - id: n4
          label: 出口管制限制
        - id: n5
          label: 收入质量下降
        - id: n6
          label: 融资 / down-round 风险
        - id: n7
          label: 估值重置
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: 因果链由公开风险证据推断，未按概率加权。
    claimRefs:
      - CR030
      - CR038
      - CR041
      - CR042
  - id: FV001
    title: 估值区间——低、中、高
    type: range
    layout: standard
    summary: 情景估值从熊市的 $1.0B 到牛市的 $6.0B；若按传闻入场价计算，风险投资回报目标需要高得多的退出估值。
    data:
      items:
        - label: 熊市情景
          low: 1000
          mid: 1300
          high: 1600
        - label: 基准情景
          low: 2000
          mid: 2400
          high: 2800
        - label: 牛市情景
          low: 4000
          mid: 5000
          high: 6000
        - label: $2.5B 入场价对应 3x 目标
          low: 7500
          mid: 7500
          high: 7500
        - label: $3.0B 入场价对应 3x 目标
          low: 9000
          mid: 9000
          high: 9000
    approximationNotes: 单位为百万美元；目标回报线不计未来稀释和清算优先权。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV002
    title: 可比公司倍数方向
    type: bar
    layout: standard
    summary: 方向性公开可比区间把成熟机器人、企业 AI 和前沿 AI 稀缺性分开。
    data:
      items:
        - label: 成熟机器人底部
          value: 2
        - label: AI 软件中段
          value: 8
        - label: AI 芯片规模化龙头
          value: 18
        - label: 前沿 AI 稀缺性
          value: 25
        - label: PFN 基准情景混合
          value: 10
    approximationNotes: 示意性收入倍数等价值基于公开市场和私募轮可比性，不是经审计的 PFN 收入。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: FV003
    title: PFN 融资与估值轨迹
    type: timeline
    layout: standard
    summary: PFN 披露的资本轨迹为正，但历史 Toyota 锚点之后，投后估值披露消失。
    data:
      items:
        - date: 2017-08
          label: Toyota 投资 ~¥10.5B
        - date: 2024-08
          label: SBI 资本 / 业务联盟
        - date: 2024-12
          label: ¥19B 首次交割加债务
        - date: 2025-04
          label: ¥5B 延展融资
        - date: 2025-06
          label: 未披露延展融资
        - date: 2026-06
          label: MHI 业务联盟
    approximationNotes: 时间线包括已披露融资和战略事件；不意味着所有事件都是有定价的股权轮。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV013
  - id: FV004
    title: 分部估值瀑布图
    type: waterfall
    layout: standard
    summary: 基准情景价值分布在芯片、PLaMo、机器人、材料、云和战略期权价值上。
    data:
      items:
        - label: AI 芯片 / MN-Core
          value: 800
        - label: PLaMo / 企业 AI
          value: 650
        - label: 机器人 / 物理 AI
          value: 450
        - label: 材料 / PFP
          value: 300
        - label: 云基础设施
          value: 250
        - label: 战略期权溢价
          value: 350
    approximationNotes: 基准情景单位为百万美元；分部价值是分析师基于公开证据和可比公司作出的估计。
    claimRefs:
      - CV012
      - CV013
      - CV032
      - CV033
  - id: FV005
    title: 投资 KPI 摘要
    type: kpi
    layout: standard
    summary: 估值取决于未披露 KPI，而不只是 PFN 战略支持方的质量。
    data:
      items:
        - label: 最新披露的 2024 首次交割
          value: ¥19B
          note: 资本已披露，估值未披露
        - label: 2025 年披露的延展融资
          value: ¥5B + undisclosed
          note: 增加现金跑道，不构成估值证明
        - label: 当前 ARR
          value: Undisclosed
          note: 阻断尽调的缺口
        - label: 毛利率
          value: Undisclosed
          note: 用来区分软件与硬件经济性
        - label: 基准估值
          value: $2.0–2.8B
          note: 分析师情景，不是公司指引
        - label: 3x 目标退出
          value: $7.5–9.0B
          note: 按传闻 $2.5–3.0B 入场价
        - label: 建议
          value: research-more
          note: 只有 data room 提供证明后才上调
    approximationNotes: KPI 摘要混合已披露事实和模型输出；未披露指在已审阅公开来源中未找到。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV036
      - CV039
      - CV042
      - CV045
  - id: FV006
    title: 可比定位象限
    type: quadrant
    layout: standard
    summary: PFN 处在日本战略 AI、物理机器人和 AI 芯片基础设施之间，并不能清晰映射到单一同业组。
    data:
      points:
        - label: PFN
          x: 6
          'y': 7
        - label: Sakana AI
          x: 7
          'y': 5
        - label: Figure AI
          x: 5
          'y': 8
        - label: Wayve
          x: 6
          'y': 8
        - label: Anthropic
          x: 9
          'y': 4
        - label: OpenAI
          x: 10
          'y': 4
        - label: Fanuc
          x: 3
          'y': 7
        - label: Palantir
          x: 8
          'y': 3
    approximationNotes: X 轴代表 AI / 软件稀缺性；Y 轴代表物理世界 / 硬件敞口。评分为定性判断。
    claimRefs:
      - CV017
      - CV021
      - CV022
      - CV025
      - CV026
      - CV027
