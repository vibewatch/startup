      background: University of Tokyo 自然语言处理与信息论研究者；2006 年联合创立 Preferred Infrastructure，2014 年联合创立 PFN，负责长期研究战略。
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Tokyo, Japan
  headquarters: Otemachi, Tokyo, Japan
  productSummary: >-
    PFN 销售：（a）MN-Core 深度学习加速器芯片和系统（包括 L1000 LLM 推理部件）；（b）计算基础设施访问（PFN cloud、KDDI 合作）；（c）PLaMo 基础模型家族；（d）面向材料和化学的
    Matlantis 云端原子级仿真（与 ENEOS 合资）；（e）面向 Fanuc、Toyota 及其他大型企业的工业 AI / 机器人解决方案；以及（f）通过 Preferred Robotics 的 Kachaka
    切入消费机器人。收入据称由解决方案 / 授权、芯片和系统销售、云与 SaaS 订阅，以及研究补助或共同开发收入混合构成。
  customerFocus: 大型日本工业集团（汽车、工厂自动化、能源、材料、制药）、日本政府和学术研究项目，以及不断增长的日语 LLM 与原子级仿真企业客户；消费者触达仅限 Kachaka 家用机器人试点。
  businessModel: >-
    混合 IP / 硬件 / 软件模式——与战略锚点（Toyota、Fanuc、ENEOS、Chugai）开展研发服务和共同开发；销售 MN-Core 芯片及 MN-3 / MN-Core 2 系统；获取 Matlantis 和
    PFN-cloud 订阅收入；PLaMo 授权和政府资助计算（NEDO GENIAC）；再加上主要投资方同时也是主要客户的股权式合作。
  stage: Late-stage private (Japanese kabushiki kaisha; widely classified as a unicorn)
  fundingStatus: >-
    2024 年 12 月首关 ¥19B（SBI 领投股权，MUFG、Resona、Shoko Chukin 和 SMBC 提供债务），到 2025 年 4 月扩展为 ¥24B 系列；叠加历史上 Toyota（2015 年
    ¥1B、2017 年 ¥10.5B）、Fanuc、NTT、Mitsui、Mizuho 和 Hitachi 轮次，累计已披露融资远高于 ¥40B。The Bridge 和 Latka 将当前估值锚定在约 ¥300B / $2B，而
    PremierAlts 的二级市场标记显示截至 2025 年 6 月为明显更低的 $1.0B。
