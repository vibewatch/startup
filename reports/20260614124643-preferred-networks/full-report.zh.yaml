            body: >-
              PFN 应按一家由战略资本融资、技术差异化明显但私有经济性不透明的 AI 基础设施公司来承销。正面案例是，PFN 长期获得 Toyota、FANUC、Mitsubishi
              Corporation、SBI、主要信托银行和政府邻近计算计划的工业验证；近期融资系列规模大；并且拥有一套可能把受约束的日本 AI
              基础设施需求转化为云和产品收入的技术栈。反面案例是，同一技术栈成本高，公开收入估计互相矛盾；如果收入只落在公开 $42 million 至 $56 million
              估计区间，估值可能偏紧。因此，眼前尽调清单不是可选项：经审计或管理层编制的 P&L、分部收入、芯片 / 云 / 解决方案毛利率、债务条款、现金余额、月度烧钱、积压订单、头部客户集中度、PFCP 单位经济性，以及
