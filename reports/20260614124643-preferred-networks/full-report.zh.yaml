        - 全部优先股条款和债务义务
        - 决定普通股回报瀑布
        - 进入前先建模稀释
      - - MN-Core 管线
        - 已签订单、ASP、毛利率
        - 验证芯片分部上行空间
        - 若偏弱，下调牛市情景
      - - PLaMo 商业化
        - ARR、流失率和客户名单
        - 验证基础模型倍数
        - 没有 ARR 就不给溢价倍数
      - - 不利估值佐证
        - 可靠的 down round 或 409A 证据
        - 可确认估值过高风险
        - 下调至回避
    notes: 该清单并不完整，按价值权重排序；完整数据室还应加入客户合同、IP 所有权、安全合规和招聘计划。
