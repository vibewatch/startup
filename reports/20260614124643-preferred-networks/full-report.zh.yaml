      - number: '7.4'
        title: 财务、融资、人才和宏观风险
        blocks:
          - type: paragraph
            body: >-
              PFN 是一家私有、重资本 AI
              基础设施公司。公开市场数据来源确认了融资和独角兽定位，但没有披露收入、ARR、毛利率、经营亏损、现金消耗、跑道、硬件毛利率、资本开支需求或债务义务。定制半导体、编译器工作、基础模型和工业部署叠在一起，意味着成本底座很重；一旦
              AI 基础设施情绪走弱，融资可能变难。Reuters 关于 AI 泡沫担忧的报道不是专门针对 PFN 的指控，但对一家公开财务披露有限的私有 AI
              公司而言，直接关系到下一轮融资周期。日元走弱利弊都有：日元计价成本折成美元可能更有利，但进口算力、EDA、设备和云成本会上升，美元估值比较也会更复杂。人才风险同样重要，因为 PFN 需要 AI
              研究员、编译器工程师、机器人专家和半导体产品人才的稀缺组合，而竞争对手是超大云厂商和国家级冠军企业。
