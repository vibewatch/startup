      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分层是理解采用的关键视角。在工业机器人中，Fanuc 式机器人 OEM 和工厂自动化团队是买方，产线工程师和机器人程序员是用户；预算所有者通常是制造工程或工厂自动化资本开支。在基础设施和智能制造中，MHI
              及类似重工业主承包商购买关键任务 AI 能力，并嵌入基础设施项目。Toyota 的 Frontier Research Center 指向汽车研发和 physical-AI
              工程买方，而不是零售购车者。MN-Core 和 AImod 买方包括内部 AI 模型团队、数据中心运营商、主权 AI 计划和 IIJ/JAIST 等伙伴。制药买方是 Chugai
              式发现平台和研发自动化团队；农业买方会是设备 OEM 或大型农场运营商，但公开的 PFN 专属商业化证据更薄。跨分部看，PFN 的采用路径通常从联合研究开始，随后进入伙伴内部使用，再走向联合商业化或授权。
