    sections:
      - number: '1.1'
        title: 身份、范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks, Inc. (PFN) 是一家总部位于东京的私营 AI 公司，成立于 2014 年 3 月 26 日，总部位于千代田区大手町大厦。公司自己的使命表述——“Make the
              real world computable and create the future together”——异常宽泛，但公开材料把运营范围讲得很具体：PFN 从 AI
              芯片和自有超算一路做到基础模型、工业解决方案和应用。这使公司不像纯软件初创公司，更像一个整合 AI
              基础设施与应用的实验室，并带有战略商业化路径。公开证据覆盖制造、出行、能源、材料、生命科学、娱乐、金融、公共服务和教育。经审阅来源没有公开收入、ARR、利润率和客户数量数据，因此后续章节应把 PFN
              视为战略验证强、但财务透明度不足的后期私营公司。
