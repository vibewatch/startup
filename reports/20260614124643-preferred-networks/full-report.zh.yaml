        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              PFN 仍由创始人主导。经审阅的公司页面列出 Toru Nishikawa 为联合创始人兼董事长，Daisuke Okanohara 为联合创始人兼首席执行官；联合创始人寄语则强调，公司由“love
              computer science and
              technology”的人打造，并希望掌握计算的每一层。这种创始人延续性有利于技术一致性和伙伴信任，但也形成关键人物集中：两位联合创始人仍比外部可见的广泛职业化管理团队更深地锚定战略、公司叙事和技术方向。PFN
              披露了治理层：董事包括 Hiroshi Maruyama 和外部审计及监督委员会董事，高管包括 COO Naoto Ono、CFO Yotaro Katayama 和工程副总裁 Masaaki
              Fukuda。经审阅的公开来源没有披露薪酬、持股比例、接班计划或完整董事会投票安排。
