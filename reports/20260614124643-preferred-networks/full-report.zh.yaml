            body: >-
              PFN 最强的财务信号也是核心风险：它在垂直整合一个资本密集型 AI 栈。官方来源显示，公司正在开发 MN-Core 处理器、PFCP 计算基础设施、PLaMo 基础模型，以及面向 2026 年商业化的
              MN-Core L1000 处理器。这比纯应用软件业务更贵，因为硅片开发、系统工程、高密度计算和 AI 模型训练，都需要在产品市场经济性完全可见前持续投入技术开支。2024 年 12 月和 2025 年 4
              月融资减轻了短期融资压力，Preferred Computing Infrastructure 等伙伴载体也可能把一部分云商业化转入与 Mitsubishi Corporation 和 IIJ
              共享的结构。METI/NEDO 计算资源项目也改善生态支持。但这些来源都没有披露在手现金、月度烧钱或 runway 月数，因此公开尽调无法证明业务可自我融资或运营利润具备持久性。
