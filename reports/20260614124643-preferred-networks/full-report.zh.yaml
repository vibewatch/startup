      - number: '1.5'
        title: 里程碑、不利事件与尽调含义
        blocks:
          - type: paragraph
            body: >-
              年表显示，PFN 多次从研究框架推进到工业部署，同时砍掉不再具备战略性的业务线。早期 Chainer 框架曾是 PFN 的重要资产，但 2019 年 PFN 将 Chainer 转入维护并把研究迁移到
              PyTorch；对 Chainer 的独立护城河而言，这是一次不利的平台产品事件，即便公司将其解释为生态选择。官方里程碑页面还记录了 Crypko 和 Petalica Paint 在 2025
              年终止消费者服务，进一步说明 PFN 愿意关闭非核心消费产品。因此，尽调应聚焦哪些业务具备持久商业拉力：近期资本用途明确绑定 MN-Core、PLaMo、AI
              解决方案、人才和基础设施，而准确估值、客户数量、收入规模、毛利率和客户集中度并未公开。后续章节应检验战略投资者网络到底能转化为可重复收入，还是主要补贴国家冠军式研发。
