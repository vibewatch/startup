      - number: '3.3'
        title: 能力、定价与分发矩阵
        blocks:
          - type: paragraph
            body: >-
              公开证据支持方向性比较，而非经审计的基准同等性。PFN 的主要优势是不寻常的广度：它可以从同一个研究组织出发，可信地谈芯片设计、日本 LLM、机器人、生命科学和农业。对寻找长期 AI
              研发伙伴的客户来说，这种广度有价值，但不会自动在每个分部都生成 best-of-breed 产品证明。NVIDIA 和 Google 在加速器生态分发上更强，Waymo/Mobileye
              在已部署自动驾驶验证上更强，Recursion/Isomorphic/Schrödinger 在药物发现品牌深度上更强，FarmWise/Carbon Robotics 在窄农业 ROI
              主张上更强。定价大多不透明，因此买方会比较封装而非标价：云或服务器加速器可用性、机器人平台购买或试点条款、企业 AI
              服务、制药合作经济性，以及项目专属农业自动化。未知单元格被有意标为未知或部分，因为公开页面很少披露模型质量基准、客户胜率、实际价格或部署单位经济性。
