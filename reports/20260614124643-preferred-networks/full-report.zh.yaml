              Motor、FANUC、Hitachi、ENEOS、Chugai Pharmaceutical、Mitsui & Co.、NTT、Hakuhodo DY、Mizuho Bank、Mitsubishi
              Corporation 和 Mitsubishi Heavy Industries 都出现在抓取的官方或伙伴来源中。Toyota 是最清晰的汽车锚点，2017 年追加投资与自动驾驶 AI 相关，2026 年
              Frontier Research Center 合作则使用 MN-Core L 处理器推进 physical AI。FANUC 是最深的工业机器人关系，从 2015 年研发和资本联盟开始，延伸到产品化 AI
