    topic: enterprise-pricing-transparency
    missingEvidence: Comparable public reactor, fuel, or long-term contract price schedules for newcleo and its most relevant peers.
    whyItMatters: Without contract economics, the chapter can compare packaging logic and readiness but cannot prove who has better pricing power or lower customer-acquisition cost.
    diligencePath: Request anonymized term sheets, indicative PPAs, or board materials showing expected price per MWe, fuel cost, and support-service scope.
