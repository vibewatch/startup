  rows:
  - - newcleo
    - Direct fast-reactor developer
    - Private; >900 employees, >100 partnerships, ~$750m-$780m disclosed capital snapshots
    - Industrial decarbonization, grids, process heat, future fuel-cycle users
    - Lead-cooled fast reactor plus MOX and European industrial partnerships
    - No operating commercial plant and public technical detail still thin
  - - Oklo
    - Direct fast-reactor peer
    - Public; about $11.64b market cap and $2.21b cash
    - Data centers, factories, defense, behind-the-meter power
    - Fast fission plus fuel recycling and DOE-backed plutonium pathway
    - Still pre-commercial and dependent on future project execution
  - - NuScale
    - Incumbent substitute / direct advanced-nuclear peer
    - Public; about $4.46b market cap and NRC-approved SMR module
    - Utilities, industrial sites, process heat, desalination, hydrogen
    - Strongest published licensing proof and customer financing models
    - Water-cooled design is less differentiated on waste-recycling narrative
  - - BWXT
    - Manufacturing incumbent substitute
    - Public; nearly 10,000 employees and about $3.38b revenue
    - Government, manufacturing, nuclear supply chain, space and defense
    - Credibility, manufacturing depth, and long customer history
    - Not a like-for-like marketed commercial SMR product in the retained set
  - - X-energy / TerraPower
    - Adjacent advanced-reactor challengers
    - Private and strategic-backed; active commercialization messaging
    - Heavy industry, data centers, utility and industrial heat users
    - Alternative advanced-reactor architectures with strong industrial-use positioning
    - Different coolant and fuel approaches reduce like-for-like overlap
  - - ARC Clean Technology
    - Direct fast-reactor peer
    - Private; Series B closed and 3 active projects disclosed
    - Campuses, grids, industrial sites, data centers
    - 100 MWe fast reactor, long fuel cycle, advanced Canadian review status
    - Canadian pathway does not equal deployment proof for global buyers
  - - Blykalla
    - Direct lead-cooled European entrant
    - Private; compact 55 MW SEALER positioning
    - Flexible industrial and remote deployments
    - Lead-cooled technology with very similar safety and fuel-residence pitch
    - Earlier-stage scale and customer proof than newcleo discloses
  - - Moltex / Saltfoss
    - Adjacent fuel-cycle and floating substitutes
    - Private; waste-burning or floating-power narratives with smaller teams
    - Grid balancing, industrial power, remote or maritime users
    - Alternative waste-to-energy and floating deployment stories
    - Public readiness and financing proof remain limited
