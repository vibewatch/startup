- id: moat-risk-and-displacement
  title: Switching costs, moat durability, and adverse evidence
  body: The public record supports a moat, but not a hard moat. Before award, buyers can compare reactor class, financing package, siting assumptions, fuel story, and partner ecosystem across a crowded field. After award, switching costs could become meaningful because fuel-fabrication choices, site engineering, and industrial integration create project-specific lock-in. The problem is that newcleo has not yet demonstrated repeated commercial plants or disclosed contract economics that would prove those later-stage switching costs in practice. Adverse evidence sharpens that caution. Sifted repeatedly links the France move to capital access and reports that the €1 billion raise remains only partially closed. Nuclear Engineering International also notes that the company's public technical detail is still thin relative to the ambition of its timelines. The result is a credible competitive wedge, but one whose durability still depends on financing and regulatory execution more than on already-proven
    installed-base lock-in.
