    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: moat-proof
    missingEvidence: Customer win-loss data and procurement reasons showing why buyers choose newcleo over NuScale, Oklo, ARC, or industrial alternatives.
    whyItMatters: Public marketing shows broad differentiation claims across the field, but moat durability ultimately depends on how customers decide under real procurement constraints.
    diligencePath: Request recent procurement memos, competitor tear sheets, and project committee materials covering selection criteria and reasons for award.
