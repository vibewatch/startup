chapter:
  number: 3
  title: Competitors
  summary: 'newcleo''s closest public alternatives are other advanced-reactor developers that pair non-LWR designs with industrial heat or fuel-cycle narratives: Oklo, ARC, Blykalla, Moltex, and several adjacent players such as X-energy, TerraPower, and Saltfoss/Seaborg. The company''s strongest visible wedge is the combination of lead-cooled fast reactors, MOX fuel ambitions, and European industrial partnerships, but the moat is only partly proven because regulatory maturity, pricing transparency, and commercial deployment evidence remain stronger or more visible at several peers and incumbents.'
sections:
- id: landscape-and-player-classes
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'The competitive field is broader than a single lead-cooled peer set. Like-for-like technology challengers include Oklo, ARC, Moltex, and Blykalla because each combines an advanced-reactor pitch with some version of fuel-cycle control, long refueling intervals, or waste-reduction messaging. NuScale matters as a near-term substitute because it brings the strongest public licensing proof and multiple customer financing models. BWXT matters as an incumbent manufacturing and trust benchmark even without selling an identical standalone reactor product. X-energy, TerraPower, and Saltfoss/Seaborg widen the frame further by chasing the same industrial-decarbonization and behind-the-meter budgets with different coolant, fuel, or deployment formats. World Nuclear Association''s overview makes the strategic problem clear: buyers can solve the same clean-energy job through many reactor families, so any moat based only on modularity or industrial-heat rhetoric is structurally fragile.'
