  - type: private-evidence-only
    severity: material
    topic: installed-base-proof
    missingEvidence: Backlog, repeat-customer, and binding offtake data showing whether partnerships convert into actual plant awards or lifecycle revenue.
    whyItMatters: Switching-cost arguments remain theoretical until buyers commit capital and stay on the platform long enough for fuel, maintenance, or service lock-in to matter.
    diligencePath: Request signed customer pipeline, contracted backlog, conversion rates from partnership to project, and any repeat-development mandates.
    relatedQuestionRefs:
