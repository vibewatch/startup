  rows:
  - - Closed fuel cycle plus lead-cooled design
    - Oklo, Moltex, ARC, and others also market recycling or waste-use benefits
    - High
    - Request proof of proprietary cost advantage, fuel rights, and licensing defensibility versus named peers
  - - European industrial partnerships
    - Partnerships may stay exploratory rather than convert into binding offtake or EPC revenue
    - High
    - Request signed commercial terms, milestones, and customer commitments behind Danieli, Saipem, and other integrations
  - - Multi-country supply-chain footprint
    - Large footprint can raise coordination cost before any plant is operating
    - Medium
    - Request site-by-site capex, staffing, and milestone ownership to prove the footprint is a moat rather than overhead
  - - Regulatory engagement across France, Slovakia, and the U.S.
    - NuScale and ARC publicly show deeper disclosed readiness in their home pathways
    - High
    - Request critical-path licensing calendar with go/no-go dependencies and budget burn by jurisdiction
  - - Capital access and future de-SPAC
    - Fundraising remains partially open and competitors can point to public cash balances today
    - High
    - Request post-transaction liquidity plan, redemptions sensitivity, and next-round triggers
  - - Project-specific switching costs after award
    - No public installed-base evidence yet shows repeatable lock-in or renewal power
    - Medium
    - Request backlog, repeat customer data, and signed lifecycle or fuel-service commitments
  notes: Severity reflects competitive durability risk, not plant-safety risk. The register emphasizes the specific proof still missing from public sources.
