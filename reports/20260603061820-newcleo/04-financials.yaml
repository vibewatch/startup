tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value/status
  - quality
  - diligence ask
  rows:
  - - Supply-chain and engineering income
    - Revenue from nuclear equipment supply-chain operating companies and related engineering work
    - Annual revenue
    - Publicly disclosed for 2024 at roughly €70m-$80m depending source wording
    - Real current revenue, but not equivalent to operating-reactor cash flow
    - Provide audited revenue bridge by entity, segment, and customer class.
  - - Reactor project development
    - Future sale or development of lead-cooled fast-reactor projects
    - Per project / per plant
    - Roadmap visible; no signed public price schedule in retained set
    - Potentially high value but still pre-commercial
    - Provide signed customer contracts, milestones, and payment schedule.
  - - MOX fuel fabrication
    - Future fuel manufacturing and supply tied to closed fuel cycle
    - Per fuel contract / facility output
    - Roadmap visible in France and U.S.; no public price or volume disclosed
    - Strategically attractive but unpriced and capital-heavy
    - Provide plant capex, target output, fuel pricing, and margin assumptions.
  - - Industrial heat and electricity offtake
    - Application-specific power and heat delivery into steel, offshore, chemicals, and similar sectors
    - PPA / heat agreement
    - Use cases public via Danieli and Saipem, but no commercial term sheet disclosed
    - Commercial logic is visible; realized economics are unknown
    - Provide indicative PPAs or framework agreements with pricing and duration.
  - - Licensing / EPCM / qualification services
    - Engineering, qualification, and training activity around precursor and fuel facilities
    - Project service fees
    - Implied by precursor, FASTER, and multi-country roadmap
    - Could support near-term revenue quality if margin is strong
    - Break out service revenue, gross margin, and customer concentration.
  - - Strategic JV / project-capital participation
    - Participation via project vehicles such as the Oklo-linked U.S. fuel initiative
    - Project equity / carry / development fee
    - Potential up to $2b vehicle referenced, but subject to conditions
    - Strategic source of upside but highly conditional
    - Provide definitive JV terms, capital commitment schedule, and downside protections.
  notes: Current value/status distinguishes disclosed current revenue from future planned revenue mechanisms. Unknown means the retained source set does not disclose price, volume, or recognition policy.
