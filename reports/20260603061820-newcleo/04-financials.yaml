    - Market cap and revenue are public, but plant contract pricing is not
    - Valuation is public; project economics are still partly opaque
    - Peer valuations do not reveal reactor margin or cash payback
    - Yahoo Finance peer statistics
    - Do not treat public market cap as proof of customer economics.
