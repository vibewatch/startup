- id: blockers-and-financial-verdict
  title: Public gaps and financial verdict
  body: 'The public gap is not whether newcleo has commercial intent; it plainly does. The gap is whether an investor can convert the current evidence into a clean model of revenue quality, margin path, and runway. Public peers show how much more disclosure exists when a company has listed and must report cash, market capitalization, revenue, and losses quarterly. Oklo and NuScale still trade at rich valuations despite losses, while BWXT represents a mature manufacturing benchmark with positive earnings. Those signposts help frame the range, but they do not solve newcleo''s own opacity. The missing items remain basic and underwriting-critical: consolidated cash, monthly burn, debt, customer backlog, binding PPAs, reactor and MOX unit economics, and audited reconciliation of funding rounds. Financially, newcleo looks better than a concept company because revenue and fundraising are real, but worse than a fully underwritable infrastructure platform because too much of the case still depends
    on future financing and regulatory conversion rather than currently disclosed economics.'
