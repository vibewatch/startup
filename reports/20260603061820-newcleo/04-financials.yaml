    - Term, indexation, and customer credit support unknown
    - Danieli / Saipem partner releases
    - Need indicative term sheet with duration, escalation, and offtaker obligations.
  - - Oklo peer model
    - Consultative PPA and custom project scoping
    - List price not public; structured per customer need
    - Site work, heat need, and reliability requirements drive price
    - Oklo Energy
    - Shows why advanced-reactor pricing is solved in proposals, not brochures.
  - - NuScale peer model
    - PPA, lease, or customer-owned structure via ENTRA1
    - No standard realized price in retained set
    - Financing structure can change customer economics materially
    - NuScale Products
    - newcleo likely needs comparable financing fluency to win projects.
