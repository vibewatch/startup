  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-liquidity
    missingEvidence: Current consolidated cash balance, monthly burn, runway, and board-approved financing plan for the group.
    whyItMatters: Without explicit liquidity data, capital adequacy can only be inferred from fundraising headlines and policy signals rather than underwritten from a balance sheet.
    diligencePath: Request latest monthly management accounts, 24-month cash bridge, and downside runway scenarios.
    relatedQuestionRefs:
    - QI012
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: reactor-and-fuel-unit-economics
    missingEvidence: Plant-level capex, MOX throughput, gross margin, and payback assumptions for reactor and fuel programs.
    whyItMatters: Revenue quality and margin path depend on whether future assets generate attractive economics after years of development spend.
    diligencePath: Request reactor and fuel-facility unit-economics model with sensitivity cases and cost stack by major component.
    relatedQuestionRefs:
    - QI004
    - QI012
    - QI021
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
  - type: missing-source
    severity: material
    topic: debt-and-project-finance
    missingEvidence: Debt facilities, guarantee packages, project-finance structures, and any contingent liabilities.
    whyItMatters: Hidden leverage or guarantee obligations can materially change downside risk even when the topline story remains strong.
    diligencePath: Request treasury schedules, project-finance term sheets, guarantees, and covenant summaries.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: Audited reconciliation of total capital raised, dates of each close, currency conversion, and source-and-use of proceeds.
    whyItMatters: The retained public sources cite different totals because they describe different tranches and currencies, so investors need one reconciled version before underwriting valuation and dilution.
    diligencePath: Request audited cap-table and fundraising history, plus post-SPAC proceeds waterfall and use-of-funds schedule.
    relatedQuestionRefs:
    - QI019
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-backlog-and-concentration
    missingEvidence: Signed backlog, top-customer concentration, payment milestones, and customer-specific economics for reactor or fuel programs.
    whyItMatters: Partnership counts alone do not reveal whether revenue is diversified, recurring, or dependent on a small number of counterparties.
    diligencePath: Request customer pipeline by stage, signed contracts, top-10 revenue concentration, and milestone payment calendar.
    relatedQuestionRefs:
    - QI020
    - QI023
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
