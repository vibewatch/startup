- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Consolidated cash balance and runway
    - Blocks any hard capital-adequacy conclusion
    - Request latest monthly management accounts, balance sheet, and 24-month cash forecast.
  - - Monthly burn by project and corporate center
    - Prevents timing of next raise and dilution analysis
    - Request project-by-project cash bridge covering precursor, MOX, licensing, and HQ functions.
  - - Debt, guarantees, or project-finance terms
    - Can materially change downside risk and covenant flexibility
    - Request treasury schedules, term sheets, guarantees, and board financing approvals.
  - - Customer backlog and binding PPAs / offtake
    - Limits confidence in forward revenue quality
    - Request top pipeline, signed contracts, and milestone payment calendars.
  - - Reactor, MOX, and service gross margins
    - Blocks judgment on margin path and eventual profitability
    - Request unit-economics model, plant-level gross margin, and sensitivity cases.
  - - Funding-round reconciliation and use of proceeds
    - Without it, capital-raised headlines can be misleading
    - Request audited cap-table history, source-and-use schedule, and post-SPAC proceeds waterfall.
  notes: Each gap is phrased as a concrete underwriting blocker so the diligence path can be executed without reinterpretation.
