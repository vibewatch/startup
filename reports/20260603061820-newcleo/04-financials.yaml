company:
  name: Newcleo
chapter:
  number: 4
  title: Financials
  summary: newcleo has real disclosed 2024 revenue and repeated evidence of fundraising access, but the public record still looks like an engineering- and supply-chain business financing a much larger future reactor and fuel platform. Near-term capital support could improve through the NewHold transaction and the Oklo-linked U.S. fuel partnership, yet public sources still do not disclose consolidated cash, burn, debt, or runway. The underwriting conclusion is constructive on strategic momentum but cautious on revenue quality, margin visibility, and capital adequacy because most of the value still depends on future regulated assets whose economics are not publicly priced.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: 'The retained sources do show that newcleo is not a pure pre-revenue science project. Markets Insider, the January 2026 leadership announcement, and Oklo''s May 2026 partner release all cite meaningful 2024 revenue. But they also frame that revenue in ways that matter for quality: it comes from supply-chain operating companies, engineering, and adjacent industrial activity, not from a fleet of operating reactors or a disclosed base of long-term power contracts. Future monetization is legible in outline—reactor development, MOX fuel fabrication, and industrial heat or electricity applications with partners like Danieli and Saipem—but public price cards are absent. That makes the best comparable lens the peer set. Oklo and NuScale both present consultative project models, PPAs, leases, or customer-owned structures rather than standardized posted pricing. For newcleo, the business model is visible, but realized pricing power and revenue-recognition quality remain unproven from public
    evidence alone.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI006
  - CI009
  - CI010
  - CI011
  - CI012
  - CI038
  tableRefs:
