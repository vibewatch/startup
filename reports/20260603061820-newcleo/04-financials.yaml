- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Capital access is the chapter''s central underwriting variable. The visible positives are material: 2025-2026 round disclosures, the proposed NewHold transaction with up to $429 million of gross proceeds, and the Oklo-linked fuel-infrastructure partnership that references up to $2 billion via a newcleo-affiliated vehicle subject to conditions. The visible negatives are equally material. Sifted says the company''s €1 billion raise remains only partially closed, and the European Commission minutes explicitly record that newcleo was looking for additional financing to support activity. UK registry sources confirm 2024 accounts exist for the retained entities, but they do not disclose group liquidity or runway in the retained snapshots. So the best current judgment is that newcleo likely has enough momentum to keep funding development, but not enough public disclosure for a rigorous capital-adequacy conclusion. This is a financing-dependent scale-up story, not a self-funding business
    with clear balance-sheet resilience.'
  claimRefs:
  - CI004
  - CI005
  - CI007
  - CI008
