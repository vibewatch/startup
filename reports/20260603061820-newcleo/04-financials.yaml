- id: traction-and-cost-structure
  title: Traction proxies and cost structure
  body: 'Public traction looks real, but it should not be confused with mature plant economics. Multiple sources place newcleo above 900 employees with more than 100 partnerships, and the NRC presentation plus NEI coverage show a roadmap spanning a precursor, MOX manufacturing, multiple factories and training centers, Slovak deployment ambitions, and U.S. fuel and reactor licensing. Those are valuable commercialization signals because they suggest the company has already built a sizeable industrial organization. They are also cost signals. A company building non-nuclear precursors, fuel facilities, and first-of-a-kind reactor programs across several countries is structurally capital-intensive long before any recurring reactor cash flows arrive. Peer benchmarks underline that point. Oklo''s fuel-recycling page describes a $1.68 billion recycling facility, while BWXT shows the scale and manufacturing depth a mature incumbent can bring. What remains missing is the bridge from roadmap to unit
    economics: no retained source discloses gross margin, burn, working capital, or plant-level profitability for newcleo.'
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
