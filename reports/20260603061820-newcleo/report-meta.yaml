companyProfile:
  summary: Newcleo was founded in 2021 to commercialize a closed fuel-cycle advanced-nuclear model built around lead-cooled fast reactors, MOX fuel manufacturing, and vertically integrated nuclear-engineering capabilities. The company's centre of gravity has shifted from London to Paris, but its operating footprint remains deliberately pan-European, with UK entities still active, Italy central to PRECURSOR R&D, Slovakia part of the deployment roadmap, and U.S. licensing and fuel-fabrication ambitions also under development. Public evidence supports real regulatory and industrial momentum, including UK GDA acceptance, U.S. NRC pre-application work, ENEA-backed precursor activity, and a growing set of industrial counterparties. Even so, the company remains pre-commercial in reactor terms, with no disclosed paying reactor customers, materially incomplete financial disclosure, and a valuation story that already assumes substantial future execution success.
  foundedDate: '2021-03-18'
  founders:
    - name: Stefano Buono
      role: Founder and CEO
      background: Italian physicist, former CERN scientist, and repeat public-company founder who anchors Newcleo's reactor and capital-markets narrative.
      claimRefs: [CO012, CO013]
    - name: Elisabeth Rizzotti
      role: Co-founder and Deputy CEO
      background: Physicist by training who built operations across Italy and was elevated in 2026 as the company prepared for larger financing and delivery demands.
      claimRefs: [CO014]
    - name: Luciano Cinotti
      role: Co-founder and Chief Scientific Officer
      background: Public technical leader for the PRECURSOR and lead-cooled reactor programme, reinforcing the venture's deep specialist bench.
      claimRefs: [CO016]
  foundingLocation: London, United Kingdom
  headquarters: Paris, France (with active UK entities)
  productSummary: Newcleo's product stack combines the LFR-AS-200 lead-cooled fast reactor roadmap, smaller precursor and demonstrator steps, and future MOX fuel fabrication so the company can sell or develop dispatchable low-carbon heat and power for heavy industry, data centers, and other hard-to-abate uses.
  customerFocus: Future target customers are industrial heat and power users such as steel, chemicals, offshore energy, data centers, and other large energy consumers; publicly named counterparties are still feasibility-stage or demonstrator-stage partners rather than paying reactor customers.
  businessModel: Near-term economics rely on supply-chain, engineering, and operating-company revenue plus continued capital formation; long-term value depends on reactor projects, fuel fabrication, and bespoke power or heat offtake contracts.
  stage: Private / pre-commercial reactor platform
  fundingStatus: Public reporting shows capital raised moving from €487m and €535m in 2024 reporting to roughly $750m-$780m in 2026 company-linked materials, while the proposed NewHold transaction would add a clearer external price reference if completed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO007, CO023, CO024, CO032, CO033, CO042, CU001, CV001, CV003]
summary:
  headline: Newcleo has stronger technical depth and regulatory traction than many European advanced-nuclear peers, but the public case still depends on repeated financing, future customer conversion, and milestone execution at a valuation that already prices in meaningful success.
