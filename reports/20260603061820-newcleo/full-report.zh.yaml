  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              保留来源确实显示，newcleo 不是一个纯粹尚未收入的科学项目。Markets Insider、2026 年 1 月领导层公告以及 Oklo 2026 年 5 月伙伴发布都提到有分量的 2024
              年收入。但这些来源对收入的描述也关系到质量：收入来自供应链运营公司、工程和相邻工业活动，而不是运营中的反应堆舰队或已披露的长期电力合同基础。未来变现路径轮廓清晰——反应堆开发、MOX 燃料制造，以及与
              Danieli、Saipem 等伙伴相关的工业热能或电力应用——但公开价格卡缺席。因此，最好的可比视角是同业集合。Oklo 和 NuScale
              展示的都是咨询式项目模型、PPA、租赁或客户自有结构，而不是标准化公布定价。对 newcleo 来说，商业模式可见，但仅凭公开证据，已兑现的定价能力和收入确认质量仍未被证明。
