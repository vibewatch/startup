              制造、多座工厂和培训中心、斯洛伐克部署野心，以及美国燃料与反应堆许可。这些是有价值的商业化信号，因为它们说明公司已经搭出相当规模的工业组织。它们也是成本信号。一家公司在多个国家同时建设非核前驱项目、燃料设施和首堆反应堆项目，在任何经常性反应堆现金流到来之前，结构上就会非常资本密集。同业基准强调了这一点。Oklo
              的燃料回收页面描述了一座 $1.68 billion 回收设施，BWXT 则显示成熟既有玩家能拿出的规模和制造深度。仍然缺失的是从路线图到单位经济性的桥：没有保留来源披露 newcleo
