            body: >-
              概览层面的证据在追踪 Newcleo 带日期的执行里程碑时最强。ENEA 支持的 Brasimone 前驱工作、Chusclan 的 FASTER 枢纽、Danieli 和 Saipem 合作、斯洛伐克
              JV，都说明公司在搭建一个多国工业化栈，而不是只靠单个原型承诺。监管活动也看得见：英国设计已经进入通用设计评估，公司也和美国 NRC 开启了预申请讨论。但同一组记录也暴露重要风险信号。Sifted
              的报道说得很清楚：Newcleo
              的融资野心跑在已完成交割之前，迁往法国部分受融资和原料考虑驱动，英国钚获取受挫已经迫使一项燃料工厂计划改道。披露缺口同样重要。不同来源给出的员工数差距很大，客户和订单簿指标并不公开清晰，当前估值证据也不足以支撑精确封面数字。因此，后续章节应把执行进展视为真实存在，同时在管理层提供一手文件之前，把规模和经济性指标视为暂定。
