  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于当前公开证据质量，适合采用宽口径低 / 中 / 高区间。
    approximationNotes: 区间反映融资和里程碑结果，不是用保密预测校准出的 DCF。
    data:
      items:
        - label: 股权价值（USD M）
          low: 800
          mid: 2500
          high: 6000
        - label: 当前交易参考带来的新增净现金（USD M）
          low: 150
          mid: 300
          high: 429
        - label: 商业化前仍可能需要的后续资本（USD M）
          low: 500
          mid: 1500
          high: 3000
        - label: 以 $2.4b 入场计算的指示性回报倍数
          low: 0.4
          mid: 1.1
          high: 2.5
    claimRefs:
