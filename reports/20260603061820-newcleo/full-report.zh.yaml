      - number: '1.3'
        title: 融资历史、公司结构与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Newcleo 的资本故事规模亮眼，但口径很嘈杂。独立报道显示，2024 年 €87 million 融资完成后，披露资本达到 €487 million；随后 €135 million 英国轮次之后，数字升至
              €535 million。到 2026 年，公司相关材料又把创立以来融资额推进到约 $750 million 至 $780
              million。这些数字不能直接互换：时间戳不同，也可能用不同方式分类股权、后续配股和相邻融资活动。Companies House 的申报历史支持一个判断：到 2025 年底和 2026
              年上半年，公司仍在积极融资，但它无法解开估值或工具层面的不透明。利益相关方组合也重要。Danieli、Saipem、Walter Tosto
              等工业集团以及其他具名投资者具备战略相关性，因为商业化路径取决于供应链和工业热能用例，而不只是财务赞助。与此同时，拟议的 NewHold
              交易说明管理层仍想保留公共资本选项，尽管截至本次报告日期，已审阅证据没有显示交易完成。
