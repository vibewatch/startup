      - number: '5.2'
        title: 反应堆与燃料架构
        blocks:
          - type: paragraph
            body: >-
              公开技术材料把 newcleo 的架构描述为液态铅冷、快中子反应堆，并配套由后处理核材料生产的 MOX
              燃料。它的设计论证既是机械性的，也是战略性的。铅冷和常压运行被呈现为核心安全差异点，快谱则让公司能够主张回收含钚材料，而不是依赖新鲜铀供应。这形成了一个闭式燃料循环故事，比标准轻水 SMR
              竞争者更垂直整合。它也引入了新的依赖：只有燃料制造准备度、进料材料获取和资质认证都跟上反应堆项目，反应堆才会释放完整战略优势。换句话说，这个产品更应被理解为燃料加反应堆系统，而不是一个独立核岛。
