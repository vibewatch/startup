      - number: '2.2'
        title: 多个测算视角，而不是单一标题式 TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多个规模测算视角，但没有一个能干净推导出 Newcleo 专属 SAM 或 SOM。最宽的视角是基础设施机会：World Economic Forum 引用 U.S. Department of
              Energy 工作，称退役或即将退役煤电场址最高可达 174 GWe，现有核电场址还有 95
              GWe。这给新核能选址划出上限，不是能率先通过首堆铅冷许可、燃料、融资和客户风险测试的部分。相邻公司信号显示市场实际很碎片化：NuScale 销售 77 MW 轻水模块和 6 GW 公用事业项目；Oklo 通过
              PPA 销售最高 75 MWe；Blykalla 目标是 55 MW 铅冷部署；ARC 覆盖 100 MWe
              到吉瓦级场址。这些视角说明多个买家类别都需要稳定的模块化核能，但它们不能互换。对决策有用的结论是：市场需求很大，但 newcleo 近期可支撑投资判断的赛道仍窄，而且高度项目化。
