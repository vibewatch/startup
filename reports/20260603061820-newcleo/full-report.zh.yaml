      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 最好的公开视角是受限市场，而不是最大市场
            body: >-
              广义 SMR 或新核能需求视角有助于解释这一类别为何重要，但会夸大对 newcleo 决策有用的范围。可支撑投资判断的市场，是能为 200 MWe
              铅冷项目跨过许可、燃料循环、融资和长销售周期门槛的场址和买家子集。
            calloutType: insight
            claimRefs:
              - CM010
              - CM016
              - CM038
          - type: callout
            title: 燃料循环野心既能放大市场，也能缩小市场
            body: MOX 与废料回收逻辑可能为主权或对废料敏感的买家创造战略价值，但也增加了更简单轻水路径不需要承担的原料、许可和接受度复杂性。
            calloutType: risk
            claimRefs:
              - CM027
              - CM028
