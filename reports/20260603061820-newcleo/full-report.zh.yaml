            body: >-
              资本获取是本章最核心的投资判断变量。看得见的正面因素很实质：2025-2026 轮次披露、拟议 NewHold 交易带来最高 $429 million 总收益，以及 Oklo 相关燃料基础设施合作中提到的、由
              newcleo 关联载体在满足条件后可获得最高 $2 billion 的安排。看得见的负面因素同样实质。Sifted 称公司 €1 billion 融资仍只部分完成，European Commission
              会议纪要也明确记录 newcleo 正在寻求额外融资来支持活动。英国注册来源确认保留实体存在 2024 年账目，但保留快照没有披露集团流动性或现金跑道。因此，当前最合理判断是：newcleo
              很可能有足够动能继续为开发融资，但公开披露不足以支撑严谨的资本充足性结论。这是一个依赖融资的规模化故事，不是一个具备清晰资产负债表韧性的自筹资金业务。
