          - type: paragraph
            body: >-
              Newcleo 搭出了相当可观的合作伙伴版图，但公开证据目前更能证明可行性研究和产业协同，而不是有约束力的部署承诺或客户签约的反应堆需求。PRECURSOR 仍是计划在 2026
              年交付的非核模拟器，LEANDREA 瞄准 2034 年，定位为技术示范和测试设施；与 Saipem、Danieli 的产业合作也只是可行性或探索协议，不是已入账的反应堆订单。Nuclear
              Engineering International
              还指出，公司技术仍处在非常早期的概念设计阶段，但组织已在扩员工、布站点、建制造设施。组织规模和反应堆验证之间的错位带来运营风险：完整反应堆许可尚未拿到，公司已经在建设培训中心、燃料组件测试能力，并通过收购补供应链产能。行业背景同样关键。先进核能部署长期卡在合格劳动力、专用组件和长周期制造产能上。如果
              Newcleo 不能把合作网络转成确定承购、可开工站点项目和可复制制造证明，扩大的产业足迹可能先放大烧钱速度，而不是降低收入风险。
