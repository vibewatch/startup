      - number: '3.3'
        title: 监管姿态、规模标记与信任信号
        blocks:
          - type: paragraph
            body: >-
              监管姿态是 newcleo 公开竞争故事中最混合的一项。公司有实质动能——反应堆和 MOX 设施都已与美国开展预申请接触，法国和斯洛伐克里程碑也在推进——但保留证据仍显示它早于 NuScale 已获 NRC
              批准的模块，也落后于 ARC 已公布的加拿大审查状态。规模标记优于许多风投支持的同业：多个来源提到超过 900 名员工、100 多个合作伙伴，以及数千万级 2024 年收入。即便如此，Oklo、NuScale 和
              BWXT 等公共市场竞争者可以展示已披露现金余额、市值、分析师覆盖和成熟投资者关系界面。这类披露会成为客户、合作伙伴和供应商的信任信号。它不能保证执行，但让竞争者的资本和治理姿态比 newcleo 作为一家接近
              de-SPAC
              的私人公司目前提供的内容更清晰。这个缺口在竞争上重要，因为受监管基础设施市场中的客户，常把融资披露看作执行韧性的代理指标。哪怕还没证明反应堆更便宜，能展示公共现金、申报文件和治理的同业，在采购中也可能显得风险更低。因此，newcleo
              不只是在反应堆设计和燃料循环逻辑上竞争，也在和时间赛跑，看它能多快把私人公司的不透明转化为更持久的公共信任信号。
