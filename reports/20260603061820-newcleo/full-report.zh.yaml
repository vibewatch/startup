      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 融资失败
        - 到 2H26-2027，未以可接受条款完成 de-SPAC 或等效大额融资
        - 当前估值参考失去可信度，稀释风险跳升
        - 论点破裂；按下行融资情景重写测算
      - - 法国里程碑延误
        - 示范或燃料里程碑后移超过 12 个月，且没有匹配资金缓释
        - 价值兑现时间拉长，基准情景区间压缩
        - 切换到悲观情景假设
      - - 收入质量失效
        - 管理层无法把 2024 年收入、其他收入和财务收入桥接到可持续分部经济性
        - EV/收入对比失效，可信度下降
        - 管理层出具经审计桥接材料前，暂停投资
      - - 项目管线证明失败
        - 9.2GW 机会叙事背后没有已签客户或场址证据
        - 乐观情景失去商业转化驱动
        - 大幅下调上行估值区间
      - - 公开市场窗口关闭
        - 先进核能公开可比公司估值进一步下修，或波动过大，无法支撑后续融资
        - 外部流动性选项减弱，要求回报率上升
        - 要求更大入场折扣，或观望
    enumerationScope:
      coverage: partial
      basis: >-
        These are the most monitorable public kill triggers tied directly to valuation support rather than exhaustive
        operating risks.
    notes: 触发项只有能从公开证据或标准尽调材料中观察到，才有用。
    claimRefs:
      - CV014
      - CV022
      - CV026
      - CV033
      - CV034
      - CV035
      - CV036
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - SPAC 经济账
        - 合并协议、PIPE 条款、发起人促成份额、费用漏损和赎回敏感性
        - 募资总额不等于可用净现金，也不等于投资者持股
        - 法律和投行团队尽调交易文件
      - - 股权结构和稀释
        - 当前优先权栈、可转债、认股权证和交割后股数
        - 没有稀释数学，无法测算回报
        - 管理层和律师数据室
      - - 收入桥
        - 按子公司和可重复质量拆分 2024 年收入、其他收入和财务收入
        - 如果当前收入主要来自并购驱动的支撑活动，可能夸大商业化证明
        - CFO 材料包和经审计分部桥接
      - - 里程碑资本计划
        - 基准和下行情景下，达到 2030 与 2033 里程碑所需资本
        - 决定已宣布融资是足够资金，还是又一笔过桥
        - 董事会批准的融资模型
      - - 管线质量
        - 9.2GW 机会管线以及斯洛伐克 / 工业叙事背后的已签客户、场址或伙伴证据
        - 乐观情景需要转化证据，不只是机会表述
        - 用合同和条款清单做商业尽调
      - - 监管路径
        - 整合 ASNR、NRC 和英国里程碑图，并按关口列预算
        - 估值更取决于里程碑时间，而不是抽象技术质量
        - 监管尽调工作流
    enumerationScope:
      coverage: partial
      basis: These six asks are the highest-priority items needed to convert a track stance into an investable price call.
    notes: 各项按其改变稀释调整后回报的直接程度排序，而不是按一般趣味性。
    claimRefs:
      - CV026
      - CV027
      - CV037
      - CV038
      - CV039
      - CV040
