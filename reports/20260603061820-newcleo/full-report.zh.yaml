  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与燃料循环风险
        blocks:
          - type: paragraph
            body: >-
              Newcleo
              最大的单一投资判断问题，不是监管机构是否知道这家公司存在，而是在反应堆设计、燃料制造、废料处理、运输和逐国选址之间，究竟有多少单独审批必须同时到位，反应堆部署现金流才会成为现实。公司已经打开了可见的监管路径：美国工作现在处于
              NRC 预申请模式，英国设计已被纳入通用设计评估，法国仍是 MOX
              燃料和示范反应堆计划的重心。但这些数据点都不意味着公司已经降低了许可风险。美国材料仍是教育性材料，英国流程预计还需要约两年才会进入更深入部署决策，法国路径仍取决于施工授权申报、公众讨论、燃料循环审批和放射性材料物流。由于
              Newcleo
              的价值主张依赖回收燃料，而不是单纯反应堆硬件，监管复杂度被放大，而不是降低。英国钚获取受挫已经说明，进料政策会改变工厂选址策略。因此，投资者应把监管栈视为一条链，最弱环节是废料获取加燃料许可，而不只是反应堆安全论证。
