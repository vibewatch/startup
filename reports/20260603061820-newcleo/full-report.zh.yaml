            body: >-
              公开记录支持存在护城河，但不是硬护城河。授标之前，买家可以在拥挤赛道里比较反应堆类别、融资方案、选址假设、燃料故事和伙伴生态。授标之后，切换成本可能变得有分量，因为燃料制造选择、场址工程和工业集成会形成项目特定锁定。问题在于，newcleo
              还没有证明可重复的商业电站，也没有披露能证明这些后期切换成本确实成立的合同经济性。反向证据让这种谨慎更有必要。Sifted 多次把迁往法国与资本获取联系起来，并报道 €1 billion
              融资仍只部分完成。Nuclear Engineering International
