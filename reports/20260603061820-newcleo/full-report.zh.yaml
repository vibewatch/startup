        title: 资本密集度与模型风险
        blocks:
          - type: paragraph
            body: >-
              Newcleo 的公开融资故事同时证明了投资者兴趣和融资风险。独立报道显示，公司在 EUR87 million 融资完成后，披露资本从约 EUR487 million 起步；后续一组交割后升至约 EUR535
              million。但同一报道也清楚说明，公司仍瞄准更大资金规模，包括此前宣布的 EUR1 billion 股权融资，以及到 2030 年仅在法国就约 EUR3 billion
              的投资。这个缺口重要，因为公开记录还显示，公司烧钱可观，而当前收入相对于燃料基础设施、示范资产和最终商业反应堆所需建设而言仍偏小。Sifted 引述称，2024 年上半年平均月度现金消耗约 EUR13
              million，2024 年 6 月 30 日现金为 EUR221 million，2023 年亏损 EUR57.5 million，收入仍来自收购的运营公司，而不是反应堆销售。2025 和 2026 年
              Companies House 持续出现配股记录，也符合一家仍依赖反复股权注入的业务状态。投资判断含义很直接：如果下一轮大额融资窗口延后，估值支撑会在反应堆里程碑能够弥补之前先走弱。
