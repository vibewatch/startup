            body: >-
              newcleo 最有辨识度的公开故事不是泛泛的 SMR 话术，而是试图把铅冷反应堆、MOX 燃料和钢铁制造、海上供电等行业特定应用配在一起。Danieli 和 Saipem 支撑了这一定位，NRC
              托管的演示材料也指向斯洛伐克、法国、意大利和美国开发轨道。但直接同业也有差异化卖点。Oklo 把快堆、燃料回收和 DOE 支持的钚路径结合起来；NuScale 用已获许可的水冷设计搭配 ENTRA1
              的客户融资选项；X-energy 强调高温蒸汽和重工业适配；ARC
              强调快堆传承和长燃料循环。整个集合中，公开标价基本缺席。看得见的模式是咨询式、项目特定合同，而不是公布价目表。这意味着竞争比较更多取决于准备度、融资结构和应用匹配，而不是透明的每兆瓦价格竞争。
