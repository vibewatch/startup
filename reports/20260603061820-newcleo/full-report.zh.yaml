  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 投资论点：公开资本市场愿意接纳先进核能平台
        - Oklo 和 NuScale 都说明，尚未达到完全商业规模的公司也能获得数十亿美元公开市场标记
        - 先进核能公开可比公司估值明显下修，后续融资窗口长期关闭
      - - 投资论点：Newcleo 的收入基础比纯收入前同业更偏工业
        - MarketsInsider 将 2024 年约 $80m 的收入、其他收入和财务收入归因于运营公司
        - 管理层无法按子公司证明收入质量、利润率和可重复性
      - - 投资论点：已宣布的 SPAC 提供可用外部定价锚
        - 约 $2.4b 的拟议投前估值，加上已承诺 PIPE 和信托现金，框定当前谈判区间
        - 交易失败、赎回激增或条款恶化
      - - 反论点：资本需求仍远大于已宣布交易
        - Sifted 报道，到 2030 年法国需要约 EUR3bn，到本十年末还需要数十亿
        - 里程碑资本计划显示支出显著更低，且有强非稀释性支持
      - - 反论点：反应堆经济性仍埋在并购来的供应链收入下面
        - 当前公开收入不是反应堆部署收入
        - 管理层证明可持续分部利润率，并说明如何过渡到反应堆现金流
      - - 反论点：相对 Oklo 估值看似便宜，但相对 BWXT 式收入倍数偏贵
        - 投机型公开可比公司和成熟核制造商对应完全不同的估值逻辑
        - Newcleo 拿出足够许可和项目证据，足以脱离成熟工业估值锚
    notes: 判断变化刻意设置为可证伪，不是泛泛的利好和利空。
