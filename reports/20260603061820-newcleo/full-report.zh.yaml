  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 宽口径股权价值对融资和里程碑假设的敏感性，而不是狭窄表格模型给出的结果。
    approximationNotes: 这些条形是方向性的情景锚点，不是精确公允价值结果。
