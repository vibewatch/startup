      - number: '2.4'
        title: 增长驱动、约束与需要保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动因素清晰且可信：大型用户对稳定清洁能源的需求在上升，煤电场址再利用打开了巨大的基础设施视角，工业脱碳正在带来具体合作活动，欧洲也通过 PRECURSOR、LEANDREA
              及相关项目投资铅冷生态能力。但约束同样实质。许可和场址接受需要多年；基于 MOX
              的价值主张会增加燃料循环审批和原料依赖；商业舰队形成之前，资本需求已经以十亿级计。公开记录因此包含一个必须保留、不能平均掉的矛盾：清洁稳定热能和电力的宏观需求很大，而近期可商业供给的铅冷能力仍极小。公开证据还显示，买家教育、场址资质和融资谈判会按细分市场不均衡推进，这进一步压缩了现实的近期可服务市场。本章因此支持强需求背景，但只支持受限的近期可服务市场。
