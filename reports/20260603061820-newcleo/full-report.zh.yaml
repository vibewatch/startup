  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、既有玩家、相邻公司与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争场域比单一铅冷同业集合更宽。按技术对标的挑战者包括 Oklo、ARC、Moltex 和 Blykalla，因为每家公司都把先进反应堆叙事与某种燃料循环控制、长换料间隔或减废信息结合起来。NuScale
              是近期替代方案，因为它拥有最强的公开许可证明和多种客户融资模型。BWXT 即使不销售完全相同的独立反应堆产品，也构成既有制造和信任基准。X-energy、TerraPower 和 Saltfoss/Seaborg
              又进一步扩大了框架，它们用不同冷却剂、燃料或部署形式，争夺同一批工业脱碳和表后预算。World Nuclear Association
              的概览把战略问题讲清楚了：买家可以通过许多反应堆家族解决同一项清洁能源任务，因此只靠模块化或工业热话术建立的护城河，在结构上很脆弱。
