chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Newcleo 更准确的定位不是单一反应堆设计初创公司，而是一家打造闭式燃料循环方案的先进核能公司。当前公开材料把它描述为一家创立于 2021
              年的铅冷快堆开发商，同时还想制造混合氧化物燃料，并掌握更多周边产业供应链。关键就在这里：它的经济叙事不只依赖反应堆
              IP，公司试图把反应堆部署、燃料制造和工程执行整合成一个平台。地理图景也不只是一个总部地址那么简单。报道现在把 Newcleo
              描述为从伦敦迁至巴黎后的法国总部公司，但英国法律实体仍在运作，意大利仍是前驱工作的核心，美国或英国监管路径也还在搭建。后续章节可复用的底层事实是：Newcleo
              的身份带有泛欧洲属性，刻意押注燃料循环，工业客户逻辑则锚定难减排行业的热能和电力，而不是单纯的商用电网发电。
