      - number: '7.4'
        title: 治理、披露漂移与监测逻辑
        blocks:
          - type: paragraph
            body: >-
              最后一层风险不在某个单点事件，而在持续监测的质量。Newcleo 正在把管理层制度化，新增副 CEO 和集团 CFO，显然想从科研项目变成有规模的工业平台。但公开披露仍然嘈杂。员工数会随来源和日期在约
              850、900、950 到超过 1,200 之间跳动；收入口径从 2023 年 EUR9 million、2024 年上半年 EUR26 million，跳到公司相关材料里的 2024 年 EUR70-80
              million；英国实体记录也显示高频高管变更，以及控股公司和 PSC 变动。Oklo 等可比上市核能公司说明，资本市场最终会要求更完整的治理、董事会和投资者监测基础设施。Oklo
              也已经向数据中心、工厂和工业场址营销 24/7 清洁能源，其技术叙事依托的是“可比快堆技术此前已建成并运行”的说法。也就是说，Newcleo
              最终不仅要经受融资审查，还会在设计成熟度和客户叙事上承受更尖锐的比较压力。其他先进核能同行已经在部署就绪度、燃料形态或反应堆运行传承上披露更具体的主张，披露质量本身可能变成风险。Newcleo
              的实际尽调规则因此很简单：不要只看工业化叙事的标题。要监测融资是否关闭，实体变更、许可步骤和披露经营指标能否继续对得上。若对不上，正确做法不是平均这些数字，而是下调置信度，并要求一手文件。
