      - number: '8.2'
        title: 融资背景与公开可比公司
        blocks:
          - type: paragraph
            body: >-
              公开可比公司只有按商业模式拆开才有用。Oklo 和 NuScale 代表投机性的先进反应堆股票，交易基础仍更多是许可期权、政策入口和资本充裕度，而不是传统盈利。BWXT
              在光谱另一端：它是盈利的核制造与工程老牌公司，有真实收入、现金流和国防支持的韧性。Newcleo 尴尬地夹在两端之间。MarketsInsider 将约 $80 million 的 2024
              年收入、其他收入和金融收入归给公司，但这些收入来自供应链运营公司，而不是反应堆部署。拿 BWXT 的成熟倍数看，Newcleo 显得偏贵；拿 Oklo 或 NuScale 的投机性公开估值看，已宣布的 SPAC
              又不算离谱。这正是单一同业倍数会误导的原因。可比公司分析只能给方向，不能给精度：先进核能可以拿到数十亿美元估值，但前提是投资者接受长周期里程碑风险和重大融资依赖。
