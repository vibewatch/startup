          detail: 指标与实体变动无法相互勾稽
          type: risk
        - id: n5
          label: 时间表滑坡
          detail: 2030-2033 年里程碑右移
          type: impact
        - id: n6
          label: 现金跑道压力
          detail: 烧钱速度跑在融资可见度前面
          type: impact
        - id: n7
