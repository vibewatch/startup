            title: 尽调应聚焦场址和承购的具体性
            body: 下一步尽调不是寻找更大的核能 TAM，而是追问漏斗里有哪些具名工业、数据中心、海上或主权项目，哪些场址能够承载它们，哪些燃料获取假设是真实的。
