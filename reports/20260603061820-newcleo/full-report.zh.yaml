      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Newcleo 有公开市场可选项，但还没有达到公开市场级别的证明。已宣布交易、新财务负责人和宽泛工业叙事有帮助，但当前披露仍不足以让投资者对稀释调整后的回报建立信心。公开同业已经通过高管页面、股票页面、SEC
              搜索可见性和邻近业务披露暴露出更多可审查面，这也正是 Newcleo
              相比真正上市公司标准仍显早期的原因。即便欧盟存在先进核能资金渠道，也应把它们视为竞争背景，而不是已承诺资本。最重要的尽调缺口不是少了一段技术描述，而是缺少一座完整财务桥梁，把今天收购来的供应链收入接到明天的燃料和反应堆现金流。投资者还需要知道，拟议总募集资金在赎回、费用和发起人激励经济性之后能留下多少，以及抵达
              2030 和 2033
              里程碑仍需多少额外资金。因此，今天的退出准备度更接近有条件的战略或上市可选项，而不是一个干净、可独立承销的上市公司终点。本章最终建议仍是观察，直到这些问题关闭，或入场价格降到足以创造真正安全边际。缺失的桥梁正是纪律型投资者应优先选择研究节奏和定价纪律，而不是只为赛道兴奋的原因。
