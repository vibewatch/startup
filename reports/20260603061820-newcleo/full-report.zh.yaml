  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先划市场边界，再谈市场规模
        blocks:
          - type: paragraph
            body: >-
              分析 newcleo，正确起点不是“所有核能”，甚至不是“所有 SMR”。公司的公开材料描述的是一座 200 MWe 铅冷快堆，配套 MOX
              燃料方案，并明确点名工业脱碳、数据中心、氢能、区域供热和电网供电等用例。Danieli 和 Saipem
              又把范围进一步收窄到绿色钢铁和海上工艺热应用。也就是说，应纳入的市场，是清洁能源支出中买家需要稳定热能或电力、往往发生在场址层面、并且可能在意燃料安全或减废的那一部分。边界应排除大型传统吉瓦级电站、泛化的零售电力需求，以及任何无法映射到
              200 MWe 铅冷项目或可比承购结构的广义 SMR 支出。买家仍会把 newcleo 与其他核能架构、化石燃料或电网替代方案比较，因此这些替代品在分析上重要，但不应被误认为纳入支出。
