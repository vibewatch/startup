      - CV023
      - CV026
      - CV028
      - CV031
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 评分卡把技术吸引力与估值承销质量拆开。
    data:
      items:
        - label: 技术雄心
          value: 8
          detail: 闭式燃料循环和工业热叙事具备差异化
        - label: 公开市场支撑
          value: 7
          detail: SPAC 参考和同业估值锚显示资本市场有胃口
        - label: 收入质量证据
          value: 4
          detail: 当前公开收入不是反应堆商业化的干净证据
        - label: 资金充足度
          value: 3
          detail: 资本需求仍显著高于已披露交割金额和拟议总募资
        - label: 监管证据
          value: 4
          detail: 确有实际进展，但关键路径仍处于商业化前阶段
        - label: 估值清晰度
          value: 3
          detail: 稀释和里程碑输入缺口太多，无法给出精确公允价值
        - label: 入场纪律
          value: 8
          detail: 若投资者坚持价格和证据闸门，决策质量会显著提高
    claimRefs:
      - CV001
      - CV008
      - CV022
      - CV023
      - CV024
      - CV026
      - CV027
      - CV030
      - CV042
