        blocks:
          - type: paragraph
            body: >-
              最强的公开产品-市场证据还不是运营中的电站，而是 newcleo 反复点名的工业工作流足够具体。Saipem 和 Danieli
              不是抽象标识。它们自己的发布提到海上供电、浮动核能机组、绿色钢铁、Digimelter、Energiron，以及与氢相关的热能需求。这些用例符合 newcleo 公开叙事：一座 200 MWe
              铅冷反应堆应当同时向能源密集型设施提供电力和高温热能。这让公司区别于只谈电力的信息，但并不唯一。Oklo、X-energy、Moltex、Blykalla、ARC 和 Seaborg
              都在销售某种过程热、减废、灵活选址或先进燃料逻辑。newcleo 真正的差异在于铅冷加回收 MOX 的垂直整合组合。代价是许可和部署成熟度：NuScale 和 ARC
