      - number: '1.2'
        title: 领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              这家公司仍然由创始人塑形。Stefano Buono 不只是台前 CEO，也是 Newcleo
              当前商业化计划与过去几十年铅反应堆研究之间的主要桥梁，这让这家先进核能初创公司拥有少见的深度创始人-市场匹配。2026 年联合创始人 Elisabeth Rizzotti 晋升，以及 Jon Stranske
              出任集团 CFO，说明公司在准备承受更重的工业化和公共市场审视时，已经开始扩充运营与财务班底。技术可信度也不只靠 Buono，联合创始人兼首席科学官 Luciano Cinotti
              同样支撑公开技术叙事。即便如此，公开记录对具名高管的呈现仍强于对治理细节的披露。英国高管登记确认公司有更广的董事池，并且董事会仍在更新，但没有说明委员会结构、内部决策权或接班安排。投资判断的要点是：Newcleo
              看起来比纯创始人载体更机构化，但关键人物集中和披露不对称仍是重要的概览层面问题。
