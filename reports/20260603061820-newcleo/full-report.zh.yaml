  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一体化产品栈与资产地图
        blocks:
          - type: paragraph
            body: >-
              newcleo 并不是在公开单独销售一个反应堆 SKU。已审阅记录反复呈现的是一体化栈：商业铅冷快堆、回收 MOX 燃料路径，以及一组让反应堆更可信的使能资产。中心是 LFR-AS-200，这是一款 200
              MWe 产品，面向电力和高温工业用途。周边则有 Brasimone 的 PRECURSOR、Chusclan 的 FASTER 培训与研发中心、规划中的 MOX 燃料厂，以及 LEANDREA
              示范项目。这个栈很重要，因为 newcleo
              的差异化主张不是简单的铅冷，而是反应堆设计、燃料回收、资质基础设施和未来运营彼此强化。商业含义在执行成功时是正面的，但成熟度含义也同样清楚：大部分公开证明仍停留在商业化前资产和面向监管机构的材料中，而不是运营中的反应堆或成熟产品目录。
