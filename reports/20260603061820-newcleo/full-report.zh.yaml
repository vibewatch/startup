          values:
            - 治理失灵
            - 法国选址延误；合作伙伴未转化
            - 燃料循环审批；大额融资缺口
        - label: 高影响
          values:
            - 英国实体频繁变动
            - 美国申请滞后；披露漂移
            - 供应链瓶颈；先导项目到 FOAK 的转化
        - label: 中等影响
          values:
            - 地方反对噪音
            - 工业时间表滑坡
            - 可行性研究疲劳
    claimRefs:
      - CR004
      - CR007
      - CR009
