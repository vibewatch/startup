      - number: '8.3'
        title: 情景区间与否决触发器
        blocks:
          - type: paragraph
            body: >-
              公开信息无法支持精确 DCF，因此正确框架是以里程碑为条件的情景分析。乐观情景下，de-SPAC
              或同等规模融资完成，法国选址和燃料里程碑继续推进，工业合作转成已签约项目，公司证明供应链收入能成为反应堆经济性的底座，而不只是临时资产负债表支撑。基准情景下，Newcleo
              融资足以保住期权价值，但距离可融资的商业反应堆仍差数步；估值会围绕已宣布交易参照聚集，而不会显著高于该参照。悲观情景下，融资摩擦、赎回或监管滑坡会在反应堆经济性更清楚前迫使公司以更低价格融资。这些情景的重点不是选出一个完美数字，而是找出哪些条件必须成立，才能守住市场上已有的数字。若条件失效，估值应快速压缩。
