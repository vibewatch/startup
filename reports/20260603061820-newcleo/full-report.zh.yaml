          label: SPAC 参考估值
          detail: 投前 $2.4b；最高 $429m 总募资
          type: input
        - id: n2
          label: 公开可比公司支撑
          detail: Oklo 和 NuScale 显示资本市场对先进核能有投机性需求
          type: input
