            body: >-
              公开缺口不是 newcleo
              是否有商业化意图；它显然有。缺口在于，投资者能否把当前证据转化为一套干净模型，解释收入质量、利润率路径和现金跑道。公共同业显示，一家公司上市并必须季度披露现金、市值、收入和亏损后，可获得的披露会多得多。Oklo
              和 NuScale 尽管亏损，估值仍然很高；BWXT 则代表了具备正收益的成熟制造基准。这些路标有助于划定范围，但不能解决 newcleo
              自身的不透明。缺失项目仍很基础且对投资判断关键：合并现金、月度烧钱速度、债务、客户积压、具有约束力的 PPA、反应堆与 MOX 单位经济性，以及融资轮次的经审计调节。财务上，newcleo
              好于概念公司，因为收入和融资真实存在；但也弱于完全可支撑投资判断的基础设施平台，因为太多逻辑仍依赖未来融资和监管转化，而不是当前披露的经济性。
