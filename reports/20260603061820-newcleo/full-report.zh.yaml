      - CR035
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 因果图展示许可、融资和披露风险如何传导为现金跑道、时间表和估值压力。
    data:
      nodes:
        - id: n1
          label: 燃料循环审批
          detail: 反应堆、MOX、废料与运输许可
          type: risk
        - id: n2
          label: 资金缺口
          detail: 大额融资落后于资本需求
          type: risk
        - id: n3
