      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              已抓取证据中最可信的买家，是能源密集型工业企业、数据中心园区、公用事业或区域供热系统、海上运营方，以及在意乏燃料管理和燃料安全的主权或国家支持实体。这些细分市场的用户、付款方和采购路径并不相同。工业项目像漫长的企业基础设施销售；数据中心和防务式机会更像合同化能源服务或
              PPA 结构；公用事业或主权项目则深度绑定监管审查和公共政策。Oklo 公开的 MOU 到 PPA
              漏斗在这里有参考价值，因为它显示相邻先进核能供应商也预期，在形成收入之前，需要经历漫长的范围界定、场址评估、工程和合同周期。Newcleo 自己的 NRC 和 GDA
              路径也指向同样模式。因此，在这个市场里，采用路径本身就是市场边界的一部分：买家必须能承受多年监管、场址和燃料循环开发过程，而不只是购买清洁电子。
