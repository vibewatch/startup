        - 技术 / 燃料循环模型
        - Wasteburner 反应堆，加上回收和储存栈
        - 与闭式燃料循环叙事最直接可比
        - 抓取来源中没有公开融资标记
      - - Saltfoss / Seaborg
        - 部署模型
        - 200-800MW 浮式 CMSR 驳船概念
        - 争夺工业和海事脱碳资本
        - 反应堆化学路线和平台设计不同
      - - Blykalla
        - 铅冷快堆定位
        - SEALER 为 55MW，具备被动安全和紧凑占地
        - 说明铅冷定位在欧洲并非独有
        - 抓取来源中没有公开估值标记
    enumerationScope:
      coverage: partial
      basis: >-
        Comp set combines public valuation anchors with private technology references because no single pure-play peer
        is sufficient.
    notes: 可比组刻意混用不同模型；这是给 Newcleo 建框架唯一诚实的方式，而不是假装存在完美同业。
    claimRefs:
