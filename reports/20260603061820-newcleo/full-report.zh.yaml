companyProfile:
  summary: >-
    Newcleo 成立于 2021 年，目标是把一套闭式燃料循环先进核能模式推向商业化：以铅冷快堆为核心，配套 MOX
    燃料制造，并垂直整合核工程能力。公司的重心已从伦敦转向巴黎，但运营版图仍有意保持泛欧洲属性：英国实体继续运作，意大利是 PRECURSOR
    研发核心，斯洛伐克进入部署路线图，美国许可和燃料制造规划也在推进。公开证据支持其监管和产业动能真实存在，包括英国 GDA 受理、美国 NRC 预申请工作、ENEA
    支持的前驱项目，以及不断增加的产业合作方。即便如此，就反应堆而言，公司仍处于商业化前阶段，没有披露付费反应堆客户，财务披露明显不完整，估值叙事已经预设了相当大的未来执行成功。
  foundedDate: '2021-03-18'
  founders:
    - name: Stefano Buono
      role: 创始人兼 CEO
      background: 意大利物理学家、前 CERN 科学家，也曾多次创办公共市场公司；他撑起了 Newcleo 的反应堆叙事和资本市场叙事。
