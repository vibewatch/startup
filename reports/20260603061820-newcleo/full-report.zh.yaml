  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值判断是：Newcleo 只有在价格和证据纪律都足够严格时才可投。最重要的公开标记是拟议中的 NewHold 交易：约 $2.4 billion 投前股权价值；若 PIPE 资金和信托现金留存，最高可取得
              $429 million 总募集资金。这个点位可作为市场参照，但不能等同于被验证的公允价值。公开记录在股权结构、SPAC 发起人激励、赎回、优先权包袱，以及 Newcleo
              当前收入中多少是可持续经营收入、多少来自金融或收购驱动收入方面，仍然有大洞。与此同时，Sifted
              报道显示，公司在法国项目和商业化铺开上仍需要数十亿美元。这个组合不支持买入式判断。只看公开证据，正确姿态是观察：保持跟踪、按里程碑承销，但不要把拟议的公开市场交易误当成下行有边界的证明。
