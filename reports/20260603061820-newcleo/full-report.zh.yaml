        - Danieli 和 newcleo 材料支撑的核心目标切入口
      - - 数据中心和数字基础设施电力
        - 专用园区级清洁基荷或签约能源服务容量
        - 没有表后或专用容量逻辑的一般公用事业电价或 REC 购买
        - 数据中心运营商或长期承购方
        - newcleo 美国计划中的核心早期承购方切入口
      - - 电网和再供能项目
        - 退役煤电替代、小型电网支撑、区域供热和公用事业级稳定电力
        - 任何地区的所有大宗电力需求
        - 公用事业公司、国资支持开发商、受监管承购方
        - 相关，但比工业或燃料循环绑定用途更宽泛、差异化更弱
      - - 废料、燃料安全和主权相关计划
        - 废料减少、国内燃料安全或战略自主与电热需求同样重要的项目
        - 从未转化为反应堆或燃料设施采购的废料管理政策支出
        - 政府、国资支持公用事业公司或战略工业赞助方
        - MOX 叙事的重要战略差异点
      - - 离岸和浮动核能应用
        - 离岸平台或浮动发电单元的电力和工艺热
        - 与先进核能无关的一般海上电力系统
        - 离岸运营商、海洋基础设施赞助方
        - Saipem 支撑的邻近需求切入口
      - - 广义 SMR 或传统核能 TAM
        - 核能或 SMR 市场的标题式叙事
        - 未映射到 newcleo 产品的大型第三代吉瓦级电站和泛全球核能 TAM
        - 分析师和政策制定者，而非直接买方
        - 可作背景，但不是对决策有用的市场边界
    notes: 各行按待完成任务而不是泛核能装机容量来划分可服务市场。纳入和排除支出是作者基于公开公司、伙伴和行业来源作出的分类。
