  - - Legacy financial backers
    - Investors
    - Kairos, Indaco Ventures, Azimut, LIFTT, Exor-linked vehicles, and family offices recur in public coverage.
    - These names anchor fundraising credibility but the current ownership stack is opaque.
    - Request investor concentration, liquidation preferences, and pro-rata behavior.
  - - Inarcassa and CERN pension fund
    - Institutional capital
    - Publicly named institutional participants in later rounds.
    - Institutional money can widen funding sources but may also change return expectations and governance pressure.
    - Confirm cheque sizes, governance rights, and lock-up terms.
  - - NewHold Investment Corp III
    - Proposed public-markets counterparty
    - Would provide a route to public listing if the business combination closes.
    - Important because it reframes disclosure requirements and valuation discovery.
    - Request merger agreement status, PIPE support, and closing conditions.
  - - JAVYS / Slovakia JV
    - Project partner
    - NRC-hosted materials say the JV targets four Slovak LFR-AS-200 reactors.
    - One of the clearest public commercialization hooks in the current source set.
    - Review JV economics, offtake assumptions, and site-readiness status.
  - - Danieli and Saipem
    - Industrial application partners
    - Public MOUs tie the reactor platform to steel decarbonization and offshore use cases.
    - These partnerships help test whether industrial heat demand can become real project demand.
    - Request scope, milestones, exclusivity, and conversion path from MOU to revenue.
