company:
  name: Newcleo
chapter:
  number: 1
  title: Company Overview
  summary: 'Newcleo is a 2021-founded advanced nuclear developer whose corporate centre of gravity has shifted from London to Paris while active UK entities, Italian R&D activity, and US or UK regulatory pathways remain in play. The evidence base supports meaningful technical and partnership progress, but public scale and capital metrics are messy: total funding moves from €487 million and €535 million in 2024 reporting to $750 million-plus in 2026 company materials, headcount figures drift sharply, and current valuation or customer metrics remain thin. The chapter therefore supports an ambitious industrialization story with genuine regulatory momentum but still-high disclosure and capital-intensity risk.'
sections:
- id: identity-footprint-and-business-model
  title: Identity, footprint, and business model
  body: 'Newcleo is best described as an advanced nuclear company building a closed-fuel-cycle proposition rather than a single reactor-design startup. Across current public materials it is presented as a 2021-founded developer of lead-cooled fast reactors that also wants to manufacture mixed-oxide fuel and own more of the surrounding industrial supply chain. That matters because the economic story depends on more than reactor IP: the company is trying to combine reactor deployment, fuel fabrication, and engineering execution into one platform. The geographic picture is similarly more complex than one headquarters line. Coverage now frames Newcleo as France-headquartered after a move from London to Paris, yet UK legal entities remain active, Italy remains central to precursor work, and US or UK regulatory routes are still being built. For later chapters, the reusable ground truth is that Newcleo’s identity is pan-European with a deliberate fuel-cycle angle and an industrial-customer thesis
    anchored in heat and power for hard-to-abate sectors rather than purely merchant grid generation.'
