  topStrengths:
    - >-
      Newcleo pairs a differentiated lead-cooled fast-reactor design with MOX fuel and supply-chain integration,
      creating a more complete platform story than many single-asset peers.
    - >-
      The company has real regulatory and industrial momentum, including UK GDA acceptance, U.S. NRC pre-application
      activity, ENEA-backed precursor work, and a wide network of industrial partnerships.
    - >-
      Public evidence supports meaningful current scale through acquired supply-chain revenue, multi-country operations,
      and a finance team increasingly shaped for larger capital raises.
  topRisks:
    - >-
      The company still needs far more capital than public proceeds disclosed so far, and dilution or financing friction
      could reset valuation before core reactor milestones are proven.
    - >-
      No paying reactor customers, PPAs, or durable commercial offtake contracts are publicly disclosed, so customer
      proof remains materially behind the industrial narrative.
    - >-
      Public metrics on total funding, headcount, revenue quality, and commercialization timing are inconsistent enough
      that precise fair-value underwriting remains unsafe.
  unresolvedGaps:
    - >-
      Full cap table, promote, redemption, and dilution mechanics for the proposed public-market transaction are not
      publicly clear.
    - >-
      Consolidated cash, monthly burn, debt, working-capital profile, and reactor or MOX unit economics remain
      undisclosed.
    - >-
      Public customer evidence stops at feasibility partners, demonstrator hosts, and target sectors rather than binding
      long-term offtake contracts.
    - >-
      The evidence set does not yet provide a clean bridge from today's supply-chain revenue to future reactor and fuel
      cash flows.
