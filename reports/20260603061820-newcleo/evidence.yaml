evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current valuation
    missingEvidence: >-
      A primary financing document, signed merger agreement economics, or board-approved valuation memo that fixes the
      latest priced valuation and security terms.
    whyItMatters: >-
      Without a priced primary document the overview cannot responsibly publish a precise current valuation cover metric
      or compare entry price against risk.
    diligencePath: >-
      Request the latest equity round documents, cap table by class, and any active SPAC or PIPE economics package from
      management.
    relatedQuestionRefs:
      - QO014
  - type: conflicting-data
    severity: material
    topic: headcount and footprint metrics
    missingEvidence: A run-date employee count by legal entity and geography together with an official site or office list.
    whyItMatters: >-
      Headcount is a core maturity signal for advanced nuclear platforms, but the public record currently drifts too
      much for a precise cover fact.
    diligencePath: >-
      Ask for HR-system exports or a board reporting pack that reconciles employees, contractors, offices, and project
      sites to one run-date view.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: customer count and commercial backlog
    missingEvidence: >-
      A signed customer or project pipeline report showing counterparties, stage, contracted value, and any reactor
      deployment commitments.
    whyItMatters: >-
      The company’s overview story leans on industrial demand, but open sources do not quantify customers, backlog, or
      firm orders well enough for a cover metric.
    diligencePath: >-
      Request the current commercial pipeline, signed MOUs by stage, and any binding offtake, siting, or JV
      commercialization documents.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: consolidated revenue quality
    missingEvidence: >-
      Audited or management-certified consolidated financial statements that explain how the cited 2024 revenue and
      other income were generated.
    whyItMatters: >-
      The public revenue figure may include different operating-company income buckets and therefore is not enough on
      its own to anchor quality-of-revenue analysis.
    diligencePath: >-
      Request audited consolidated statements, segment reporting, and a bridge between supply-chain revenue and future
      reactor-project revenue expectations.
    relatedQuestionRefs:
      - QO013
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage remains partial
    missingEvidence: A complete executive roster, board matrix, and committee structure with current reporting lines.
    whyItMatters: >-
      The chapter can name visible leaders, but underwriting key-person risk and governance quality requires a fuller
      decision-rights map.
    diligencePath: >-
      Request the current board deck, org chart, and governance handbook covering all top executives and non-executive
      directors.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map remains partial
    missingEvidence: A current cap table, debt schedule, strategic-partner register, and JV economics summary.
    whyItMatters: >-
      The public stakeholder list reveals who matters, but not the exact control rights, economic exposure, or dilution
      stack behind those names.
    diligencePath: >-
      Request cap-table materials, debt or convertible instruments, and strategic agreement summaries with governance or
      exclusivity provisions.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: Public sources do not isolate a Newcleo-specific SAM or SOM by geography, buyer class, or site pipeline.
    whyItMatters: >-
      Without a buyer- and region-specific pipeline, it is easy to confuse macro decarbonization need with an investable
      near-term market for 200 MWe lead-cooled projects.
    diligencePath: >-
