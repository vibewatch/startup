- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Reprocessed spent fuel plus depleted uranium
    - Input material for MOX fabrication
    - Access to separated material, qualification, and regulatory approvals
    - Fuel moat weakens if feed-material access or qualification slips
  - - MOX fuel fabrication facility
    - Converts material into reactor fuel and training / qualification workflows
    - French or US siting, licensing, and industrial partners
    - Factory schedule can bottleneck reactor schedule
  - - Lead-cooled fast reactor core
    - Converts fast-spectrum fission into heat under liquid-lead cooling
    - Validated materials, safety case, and core design progression
    - Core remains pre-FOAK in public record
  - - Secondary system plus turbo-generator
    - Converts reactor heat into electricity and supports process-heat delivery
    - PRECURSOR and later demonstrator evidence
    - Public performance and reliability data are not yet available
  - - Qualification and training assets
    - Train operators and validate materials / handling workflows
    - FASTER, Brasimone, LEANDREA, and partner-lab execution
    - Support assets help, but they are not substitutes for reactor deployment
  - - Regulators and industrial off-takers
    - Approve and ultimately absorb the plant output
    - NRC, UK regulators, French authorities, and future buyers
    - Commercial timing depends on external actors as much as on engineering
  notes: This architecture table combines physical system blocks with enabling operating infrastructure because newcleo's public product narrative is vertically integrated across both.
