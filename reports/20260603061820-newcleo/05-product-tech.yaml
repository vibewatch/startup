- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - newcleo solution
  - Measurable benefit
  - Limitation
  rows:
  - - Decarbonize offshore power supply
    - Diesel or gas-fired offshore generation
    - SM-LFR concept studied with Saipem for offshore electricity and process heat
    - Zero-emission electricity and process heat use case explicitly described by counterparty
    - Still only at feasibility-study stage; no deployed prototype or signed order
  - - Decarbonize steel production
    - Grid electricity, gas, and separate hydrogen inputs for steelmaking
    - LFR electricity plus heat integrated with Danieli steelmaking and hydrogen pathways
    - Counterparty identifies Digimelter, Energiron, and hydrogen-related applications
    - No plant design, contract economics, or implementation site disclosed
  - - Supply energy to hard-to-abate industry or data centers
    - Fossil-fired boilers, grid electricity, or large bespoke energy assets
    - 200 MWe reactor providing electricity plus high-temperature heat
    - Company materials name multiple industrial verticals that value combined heat and power
    - Named off-takers are not public and reactor is not yet licensable or build-ready
  - - Reduce long-term waste burden while producing power
    - Long-duration spent-fuel storage and conventional fresh-fuel procurement
    - Recycled-MOX fuel loop feeding a fast reactor
    - Company claims reduced final waste and lower fresh-uranium dependence
    - Public proof for feed-material sourcing, economics, and throughput remains incomplete
  notes: Benefits reflect company or counterparty statements rather than operating-plant measurements; no row should be read as delivered commercial performance.
  claimRefs:
