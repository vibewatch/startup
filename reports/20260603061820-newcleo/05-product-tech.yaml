    - French reactor and fuel-facility siting work
    - Public evidence is high level and not yet a full public safety dossier
  - - Qualification and training infrastructure
    - Publicly named via Brasimone, FASTER, and LEANDREA
    - Materials testing, operator training, and support readiness
    - Public test outputs and acceptance criteria are sparse
  - - Formal quality or cyber certifications
    - Not disclosed in reviewed public sources
    - Manufacturing QA, digital support, service operations
    - No public SOC, ISO, code-standard, or fleet-reliability evidence found
  notes: The strongest public trust signals are regulatory and qualification milestones; public operational-quality metrics remain a material diligence gap.
