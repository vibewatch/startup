  evidenceGaps:
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: A true public developer surface such as source repositories, APIs, SDK documentation, package registries, or public engineering forums tied directly to newcleo.
    whyItMatters: Product-tech requires developer-signal, but the reviewed public record only shows regulator-hosted decks, trade-practitioner coverage, and one technical interview rather than a real software or developer community surface.
    diligencePath: Request public engineering documentation, any open technical repositories, and operator training materials; until then treat SE003, SE008, and SE014 as practitioner-community proxies rather than true developer evidence.
    relatedQuestionRefs:
    - QE013
    - QE014
  - type: missing-source
    severity: material
    topic: safety-case
    missingEvidence: Public copies of the detailed reactor description and licensing-basis enclosures cited by the NRC package, plus any public design-basis or accident-analysis summaries.
    whyItMatters: Without the full enclosure-level technical package, diligence cannot independently test how much of the safety case is engineering detail versus high-level positioning.
    diligencePath: Obtain the reactor-description and safety-strategy enclosures listed in the NRC package and map key design-basis assumptions against French and UK filings.
    relatedQuestionRefs:
    - QE008
    - QE018
  - type: private-evidence-only
    severity: material
    topic: fuel-facility
    missingEvidence: Commercial details on feed-material availability, separations counterparties, qualification flows, and expected throughput for the MOX plant.
    whyItMatters: The reactor business model depends on fuel-fabrication readiness; without feedstock, licensing, and throughput detail, the closed-fuel-cycle moat may be slower to realize than the roadmap implies.
    diligencePath: Request signed feed-material MOUs, throughput assumptions, and the qualification plan for Nogent or any US fuel-fabrication site.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: quality-certifications
    missingEvidence: Public evidence of formal manufacturing, QA, cybersecurity, and service certifications or reliability metrics for reactor, fuel, and digital support operations.
    whyItMatters: Enterprise and industrial buyers will care about quality systems and service reliability even before the first reactor operates, and the current public record is too thin to underwrite that operating discipline.
    diligencePath: Ask management for the quality-management framework, applicable code standards, supplier qualification protocol, and any planned certification timetable.
    relatedQuestionRefs:
    - QE016
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: roadmap-consistency
    missingEvidence: A reconciled public roadmap showing why 2030-2033 European milestones and 2032-2034 US milestones differ across sources.
    whyItMatters: Roadmap drift does not yet break the thesis, but it complicates underwriting which milestone is regulatory, which is demonstrator, and which is first commercial revenue.
    diligencePath: Request a single jurisdiction-tagged milestone chart with explicit definitions for precursor, prototype, FOAK, MOX plant, and commercial LFR-AS-200 dates.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE005
sections:
- id: product-stack-and-asset-map
  title: Integrated Product Stack and Asset Map
  body: 'newcleo is not publicly selling a single reactor SKU in isolation. The reviewed record consistently presents an integrated stack: a commercial lead-cooled fast reactor, a recycled-MOX fuel pathway, and a ladder of enabling assets that make the reactor credible. At the center is the LFR-AS-200, a 200 MWe product positioned for both electricity and high-temperature industrial uses. Around it sit PRECURSOR at Brasimone, the FASTER training and R&D center in Chusclan, the planned MOX fuel plant, and the LEANDREA demonstrator. That stack matters because newcleo''s differentiation claim is not simply lead-cooled; it is that reactor design, fuel recycling, qualification infrastructure, and future operations all reinforce one another. The commercial implication is positive if executed, but the maturity implication is equally clear: most public proof still sits in pre-commercial assets and regulator-facing materials rather than in operating reactors or a mature product catalogue.'
  claimRefs:
  - CE001
  - CE002
  - CE009
  - CE011
  - CE012
  - CE023
  - CE038
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: reactor-and-fuel-architecture
  title: Reactor and Fuel Architecture
  body: 'Public technical materials describe newcleo''s architecture as a liquid-lead-cooled, fast-neutron reactor coupled to MOX fuel produced from reprocessed nuclear material. The design argument is mechanical as much as strategic. Lead cooling and atmospheric-pressure operation are presented as the core safety differentiators, while the fast spectrum is what allows the company to argue for recycling plutonium-bearing material instead of relying on fresh uranium supply. This creates a closed-fuel-cycle story that is more vertically integrated than standard light-water SMR competitors. It also introduces new dependencies: the reactor only delivers its full strategic advantage if fuel-fabrication readiness, feed-material access, and qualification all keep pace with the reactor program. In other words, the product is best understood as a fuel-and-reactor system, not a standalone nuclear island.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE019
  - CE023
  - CE036
  tableRefs:
  - TE002
  - TE003
  figureRefs:
  - FE002
- id: development-path-and-dependencies
  title: Development Path and Critical Dependencies
  body: 'newcleo''s public roadmap is ambitious but still clearly pre-FOAK. The ENEA PRECURSOR program, LEANDREA, and French site work are intended to close technical and qualification gaps before a commercial reactor ever operates. Regulatory progress is real: there is public evidence of French pre-licensing work, UK GDA acceptance, and NRC pre-application engagement for both the reactor and a fuel-fabrication facility. But those steps do not remove execution dependency. The commercialization path still depends on regulators in multiple jurisdictions, test assets in Italy and Belgium, French or US fuel-fabrication progress, industrial qualification infrastructure, and eventually named off-takers. The 2025 EC summary and the 2026 NRC deck also show that roadmap dates are jurisdiction-specific and still moving. That is consistent with a company building a platform in parallel across several markets, but it means schedule confidence should remain moderate rather than high.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE013
  - CE014
  - CE015
  - CE017
  - CE018
  - CE038
  tableRefs:
  - TE004
  - TE005
  figureRefs:
  - FE003
- id: industrial-use-cases-and-differentiation
  title: Industrial Use Cases and Differentiation
  body: 'The strongest public product-market evidence is not yet an operating plant; it is the specificity of the industrial workflows newcleo keeps naming. Saipem and Danieli are not abstract logos. Their own releases describe offshore power, floating nuclear units, green steel, Digimelter, Energiron, and hydrogen-linked heat demand. Those use cases fit the public newcleo pitch that a 200 MWe lead-cooled reactor should provide both electricity and high-temperature heat to energy-intensive facilities. This differentiates the company from standard electricity-only messaging, but it is not unique. Oklo, X-energy, Moltex, Blykalla, ARC, and Seaborg all market some combination of process heat, waste reduction, flexible siting, or advanced fuel logic. The real newcleo distinction is the combination of lead cooling plus recycled-MOX vertical integration. The trade-off is licensing and deployment maturity: peers like NuScale and ARC disclose more advanced formal licensing or commercialization status
    today.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE039
  - CE040
  figureRefs:
  - FE004
- id: trust-quality-and-public-proof-gaps
  title: Trust, Quality, and Public Proof Gaps
  body: For trust and quality, newcleo's public proof is still licensing-centric. The reviewed sources support that the company is actively engaging regulators and building qualification and training assets; they do not yet support a mature public operating-controls story. No reviewed source disclosed operating availability, formal quality certifications, digital-support standards, or enterprise-service metrics for any product surface. That does not mean the internal controls are weak; it means the public diligence record is thin. The gap is especially visible on the developer-signal requirement. There is enough public technical discussion to satisfy a practitioner-proxy standard through regulator decks, trade coverage, and an engineering interview, but there is no true repository, SDK, or software community surface to examine. Combined with Nuclear Engineering International's point that the LFR-AS-200 is still conceptual, the correct underwriting stance is that the technical thesis is interesting
    and increasingly legible, but the public proof set still looks like an emerging industrial platform rather than a product already hardened for deployment.
  claimRefs:
  - CE016
  - CE024
  - CE035
  - CE036
  - CE037
  - CE038
  - CE041
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - LFR-AS-200 commercial reactor
    - Utility, industrial off-taker, data-center or process-heat buyer
    - Conceptual / pre-FOAK public maturity; 200 MWe commercial target
    - Lead-cooled fast spectrum plus recycled-MOX integration and non-electric-use positioning
    - No public EPC budget, availability target, or site-specific customer contract disclosed
  - - MOX fuel manufacturing facility
    - newcleo operations and future reactor fleet
    - Planned; fuel-facility siting and feasibility work public, operating plant not public
    - Treats fuel supply as part of product moat rather than a third-party procurement input
    - Feed-material contracts, throughput, and qualification path remain undisclosed publicly
  - - PRECURSOR at ENEA Brasimone
    - Engineering, qualification, and future operators
    - Operational target 2026; non-nuclear 10 MW precursor
    - Scaled secondary-system and turbo-generator validation before FOAK plant
    - Public test program results and commissioning milestones are still limited
  - - FASTER training and R&D center
    - Engineering, training, fuel-process, and support teams
    - Site acquired; support asset, not reactor
    - Builds training and qualification capability around the reactor-fuel platform
    - Exact equipment list, staffing plan, and throughput are not public
  - - LEANDREA demonstrator / test facility
    - Materials and fuel qualification teams
    - Planned demonstrator expected 2034
    - Adds irradiation and fuel-testing capacity tied directly to commercialization
    - Timeline remains long-dated and relies on external consortium delivery
  notes: Statuses reflect public source language as of 2026-06-03; customer-facing commercial maturity is materially lower than the breadth of the announced asset map.
