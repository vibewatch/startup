callouts:
- calloutType: strength
  title: Integrated fuel-cycle control is the clearest product differentiator
  body: Among public peer materials, newcleo most clearly differentiates itself by insisting that the reactor and recycled-fuel pathway are one product. That creates a potentially stronger moat than simple reactor-form-factor differentiation if the company can actually execute the MOX-fabrication side on time.
  claimRefs:
  - CE001
  - CE004
  - CE023
  - CE034
- calloutType: risk
  title: The platform is still pre-FOAK even though the asset map looks broad
  body: 'PRECURSOR, FASTER, LEANDREA, and multi-jurisdiction licensing work all improve credibility, but they do not change the core maturity fact: the commercial reactor is still a 2030s roadmap asset with multiple external dependencies.'
  claimRefs:
  - CE009
  - CE011
  - CE015
  - CE016
  - CE038
  - CE040
- calloutType: recommendation
  title: Treat practitioner proxies as a temporary substitute for developer signal
  body: Because no true public SDK, repository, or engineering community surface was found, the chapter relies on regulator decks, practitioner media, and a technical interview to satisfy the developer-signal requirement. Diligence should request direct engineering artifacts before underwriting execution confidence too aggressively.
  claimRefs:
  - CE024
  - CE035
  - CE037
  - CE041
