  name: Newcleo
chapter:
  number: 5
  title: Product & Technology
  summary: newcleo's product is an integrated lead-cooled fast reactor and recycled-MOX fuel platform rather than a standalone reactor design. Public technical evidence shows a real pre-licensing, precursor, and materials-test program across France, Italy, Belgium, the UK, and the US, but the core product remains pre-FOAK. The commercial LFR-AS-200 is still a 2030s roadmap asset, and public proof of engineering maturity comes mainly from regulator-hosted decks, partner labs, and practitioner media rather than a true developer ecosystem.
