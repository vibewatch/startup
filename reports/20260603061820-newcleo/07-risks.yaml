  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: project-finance
    missingEvidence: Project-level capex, schedule, and funding sources by milestone for fuel, demo, and first commercial plants.
    whyItMatters: Without milestone capital mapping, investors cannot tell whether disclosed raises are enough or merely bridge financing.
    diligencePath: Request management's integrated financing plan, milestone budget, and downside liquidity case.
  - type: missing-source
    severity: blocking
    topic: french-permitting
    missingEvidence: Primary ASNR and French local-process documents tying the demo reactor and fuel facility to dated filing and review milestones.
    whyItMatters: French licensing concentration is now central to the commercialization path after the UK fuel reversal.
    diligencePath: Obtain the Safety Option File response, public-debate calendar, and permit critical-path tracker.
  - type: conflicting-data
    severity: material
    topic: disclosure-drift
    missingEvidence: A management bridge reconciling headcount, revenue, partnership, and funding totals across filings, press, and interviews.
    whyItMatters: Metric drift weakens confidence in forecasting and can hide whether growth comes from reactor progress or acquired subsidiaries.
    diligencePath: Ask for a board-approved KPI pack tying every public figure to a source system and date stamp.
  - type: missing-source
    severity: material
    topic: TR001 partner-conversion coverage gap
    missingEvidence: Binding offtake, site, or paid development contracts showing industrial MOUs are converting into monetisable demand.
    whyItMatters: Feasibility-stage partnerships cannot substitute for customer proof when underwriting revenue timing.
    diligencePath: Request executed contracts, term sheets, and stage-gated commercial milestones for the top industrial partners.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: governance-controls
    missingEvidence: Current org chart, delegated authorities, PMO controls, and entity-level decision rights after the holding-company move.
    whyItMatters: Multi-country execution risk rises when decision rights and reporting lines are not visible from public materials.
    diligencePath: Review board materials, committee structure, and monthly operating-review templates.
