- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Large financing gap persists
    - No major financing close beyond disclosed smaller rounds
    - No credible step-change financing or public-market close within the next 12-18 months
    - Treat as thesis break for current valuation support and require runway bridge plan
  - - French fuel / demo permitting slips
    - Public timetable on Nogent, Chinon, or safety-option pathway moves right
    - Key French milestone slips by more than 12 months without matched funding relief
    - Re-underwrite commercialization timeline and capex
  - - US licensing remains stuck at education stage
    - No move beyond pre-application materials
    - No application-readiness evidence after repeated NRC engagement
    - Downgrade US optionality to non-core upside
  - - Industrial partnerships remain non-binding
    - No conversion from study / MOU to site, offtake, or paid development contract
    - No binding partner conversion before next financing event
    - Discount pipeline quality and customer-proof assumptions
  - - Entity and metric drift worsens
    - Headcount, funding, or revenue claims continue to diverge without reconciliation
    - Primary diligence cannot tie public numbers to filed statements
    - Pause investment until management provides audited bridge materials
  notes: Triggers are intentionally observable from public evidence so the investment team can monitor them between refresh cycles.
