- id: execution-supply-chain-and-partner-risk
  title: Execution, supply-chain, and partner conversion risk
  body: 'Newcleo has assembled an impressive partnership surface, but the public evidence still looks much stronger on feasibility work and industrial alignment than on binding deployment or customer-contracted reactor demand. PRECURSOR remains a non-nuclear simulator due by 2026, LEANDREA is aimed at 2034 as a technology demonstrator and test facility, and industry collaborations with Saipem and Danieli are feasibility or exploration agreements rather than booked reactor orders. Nuclear Engineering International also notes that the company''s technologies remain in very early conceptual design stage even as the organisation expands headcount, sites, and manufacturing facilities. That mismatch between organisational scale and reactor proof creates operational risk: the company is building training centres, fuel-assembly testing capabilities, and acquisition-led supply-chain capacity ahead of full reactor licensing. Sector context matters here as well. Advanced nuclear deployment faces persistent
    bottlenecks in qualified labour, specialised components, and long-lead fabrication capacity. If Newcleo cannot convert its partnership network into firm offtake, site-ready projects, and repeatable manufacturing proof, the enlarged industrial footprint could amplify burn faster than it de-risks revenue.'
