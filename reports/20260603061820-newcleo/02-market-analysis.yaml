figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: A layered view from broad infrastructure opportunity to the much narrower near-term lane that could plausibly convert into newcleo projects.
  data:
    items:
    - label: Upper-bound infrastructure lens
      value: Up to 269 GWe
      detail: 174 GWe at retired or retiring U.S. coal sites plus 95 GWe at existing nuclear sites; broad new-nuclear siting opportunity, not a Newcleo TAM.
    - label: Target workload lens
      value: Firm heat + power sites
      detail: Industrial clusters, data centers, utilities, district heating systems, and sovereign projects that need reliable clean energy rather than generic retail power.
    - label: newcleo lane
      value: 200 MWe lead-cooled + MOX projects
      detail: Projects where buyers value heat, power, fuel security, or waste reduction enough to accept first-of-a-kind lead-cooled risk.
    - label: Near-term serviceable reality
      value: Project-by-project and pre-scale
      detail: Regulatory, fuel-cycle, financing, and site constraints keep the underwritable near-term market far smaller than the macro demand lens.
  approximationNotes: The layers are conceptual market filters, not additive revenue tiers. The top layer is a public siting lens; the bottom layer is an evidence-constrained serviceability view.
  claimRefs:
  - CM001
  - CM009
  - CM010
