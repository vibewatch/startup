  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Source
  - Geography
  - Quantity
  - What it captures
  - What it misses
  - Confidence
  rows:
  - - Retired or retiring coal-site opportunity
    - World Economic Forum citing U.S. DOE
    - United States
    - 174 GWe across 145 sites
    - Upper-bound siting opportunity for new nuclear replacement or co-location
    - Not newcleo-specific and not limited to lead-cooled projects
    - medium
  - - Existing nuclear-site expansion opportunity
    - World Economic Forum citing U.S. DOE
    - United States
    - 95 GWe
    - Additional siting opportunity where nuclear infrastructure already exists
    - May favor incumbents or later-stage technologies over first-of-a-kind reactors
    - medium
  - - Utility portfolio signal
    - NuScale homepage
    - TVA seven-state region, United States
    - 6 GW program
    - Evidence that utilities can procure modular nuclear in multi-gigawatt portfolios
    - Light-water, NRC-approved pathway is not directly comparable to newcleo
    - low
  - - newcleo unit-size lens
    - NRC presentation / NucNet
    - Europe / UK / United States
    - 200 MWe per LFR-AS-200 unit
    - Target project scale for newcleo's commercial reactor
    - Says nothing about how many sites will clear licensing, financing, or fuel access
    - medium
  - - Adjacent fast-reactor energy-service lens
    - Oklo energy and regulatory pages
    - United States
    - Up to 75 MWe per Aurora powerhouse
    - Shows data-center, industrial, and defense buyers can be targeted through PPAs
    - Different reactor, business model, and fuel pathway
    - medium
  - - Smaller remote or floating segment lens
    - Blykalla, Seaborg, and ARC
    - Nordics / global / Canada
    - 55-100 MWe units, or 100 MWe-to-GW sites
    - Shows demand for smaller remote, floating, and industrial deployments
    - Does not prove demand for 200 MWe lead-cooled projects specifically
    - medium
  - - Decision-useful conclusion
    - Author synthesis from public sources
    - Global
    - No credible public SAM / SOM isolated
    - Public sources support large macro need and multiple deployment analogs
    - Requires management pipeline, site, pricing, and fuel-access data to underwrite
    - medium
  notes: These rows are multiple sizing lenses, not additive TAM layers. They intentionally preserve broad and constrained estimates side by side because the cache does not contain a defensible Newcleo-specific SAM or SOM.
