callouts:
- calloutType: insight
  title: The best public lens is a constrained market, not the biggest one
  body: Broad SMR or new-nuclear demand lenses help frame why the category matters, but they overstate what is decision-useful for newcleo. The underwritable market is the subset of sites and buyers that can clear licensing, fuel-cycle, financing, and long sales-cycle hurdles for a 200 MWe lead-cooled project.
  claimRefs:
  - CM010
  - CM016
  - CM038
- calloutType: risk
  title: Fuel-cycle ambition can both expand and shrink the market
  body: The MOX and waste-recycling thesis may create strategic value for sovereign or waste-sensitive buyers, but it also adds feedstock, licensing, and acceptance complexity that simpler light-water pathways do not carry.
  claimRefs:
  - CM027
  - CM028
  - CM036
- calloutType: recommendation
  title: Diligence should focus on site and offtake specificity
  body: The next diligence step is not to look for a bigger nuclear TAM; it is to ask which named industrial, data-center, offshore, or sovereign projects are in the funnel, which sites can host them, and which fuel-access assumptions are real.
  claimRefs:
  - CM020
  - CM023
  - CM036
