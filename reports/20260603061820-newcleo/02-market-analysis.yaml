- id: TM005
  title: Public commercialization and deployment signals
  columns:
  - Program / signal
  - Public evidence
  - Buyer class implicated
  - Market read-through
  - Limitation
  rows:
  - - newcleo U.S. entry lane
    - Company presentation plus NRC pre-application package point to data centers or hard-to-abate industries as early off-takers
    - Industrials and data centers
    - Most concrete named wedge for early commercialization
    - No public contract values or binding offtake quantities disclosed
  - - Danieli green-steel collaboration
    - Study of combined electricity and heat for steelmaking and hydrogen-linked processes
    - Steelmakers and heavy industry
    - Validates industrial-heat demand wedge
    - Partnership language is exploratory, not an order
  - - Saipem offshore study
    - Feasibility study for offshore and floating applications of newcleo technology
    - Offshore energy and marine infrastructure
    - Creates an offshore adjacency not captured in generic SMR TAMs
    - Still feasibility-stage
  - - PRECURSOR and LEANDREA infrastructure
    - European precursor and demonstrator work in Italy and Belgium / Romania pathway
    - Future utilities, regulators, and industrial ecosystem partners
    - Signals ecosystem formation and supply-chain learning
    - R&D progress is not customer revenue
  - - NuScale TVA 6 GW signal
    - Homepage announcement of a 6 GW program with TVA and ENTRA1
    - Utilities and regulated power systems
    - Shows utilities can consider large portfolio-scale nuclear procurement
    - Later-stage light-water path is easier to finance and regulate than newcleo today
  - - Oklo power-as-a-service and regulatory reuse
    - Oklo markets MOU-to-PPA process and reusable topical approvals
    - Data centers, industrials, defense
    - Shows adjacent buyers may want contracted energy services and repeatable approvals
    - Not proof that buyers will accept newcleo's specific fuel-cycle complexity
  notes: These are commercialization signals, not booked revenue. The table intentionally mixes direct newcleo evidence and adjacent comparable signals to show how public demand manifests in this market.
