sections:
- id: market-boundary
  title: Market boundary before market size
  body: The right starting point for newcleo is not 'all nuclear' or even 'all SMRs.' The company's public materials describe a 200 MWe lead-cooled fast reactor paired with a MOX fuel proposition and explicitly name industrial decarbonization, data centers, hydrogen, district heating, and grid power as use cases. Danieli and Saipem narrow that further into green steel and offshore process-heat applications. That means the included market is the subset of clean-energy spend where buyers need firm heat or power, often at site level, and may also care about fuel security or waste reduction. The boundary should exclude large conventional gigawatt plants, generic retail electricity demand, and any broad SMR spend that does not map to a 200 MWe lead-cooled project or a comparable off-take structure. Buyers still compare newcleo with other nuclear architectures and with fossil or grid alternatives, so those substitutes matter analytically, but they should not be mistaken for included spend.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM008
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Multiple sizing lenses, not one headline TAM
  body: 'Public evidence supports multiple sizing lenses, but none cleanly yields a Newcleo-specific SAM or SOM. The broadest lens is infrastructure opportunity: the World Economic Forum cites U.S. Department of Energy work suggesting up to 174 GWe at retired or retiring coal sites and another 95 GWe at existing nuclear sites. That frames the upper bound for new nuclear siting, not the part that will clear first-of-a-kind lead-cooled licensing, fuel, financing, and customer risk tests. Adjacent company signals show how fragmented the market really is: NuScale markets 77 MW light-water modules and a 6 GW utility program; Oklo markets up to 75 MWe through PPAs; Blykalla targets 55 MW lead-cooled deployments; ARC addresses 100 MWe-to-gigawatt sites. Those lenses indicate demand for firm modular nuclear across several buyer classes, but they are not interchangeable. The decision-useful conclusion is that market need is large while the underwritable near-term lane for newcleo is still narrow
    and project-specific.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM038
  - CM039
  tableRefs:
  - TM002
  - TM005
  figureRefs:
  - FM001
- id: buyers-and-adoption
  title: Buyer segmentation and adoption path
  body: 'The most credible buyers in the fetched evidence are energy-intensive industrials, data-center campuses, utilities or district-heating systems, offshore operators, and sovereign or state-backed entities that care about spent-fuel management and fuel security. Those segments do not share the same user, payer, or procurement path. Industrial projects look like long enterprise infrastructure sales; data-center and defense-style opportunities resemble contracted energy-service or PPA structures; utility or sovereign projects remain deeply intertwined with regulatory review and public policy. Oklo''s published MOU-to-PPA funnel is useful here because it shows how even adjacent advanced-nuclear vendors expect long scoping, site-evaluation, engineering, and contracting cycles before revenue. Newcleo''s own NRC and GDA pathways imply the same pattern. This is therefore a market in which the adoption path itself is part of the market boundary: buyers must be able to tolerate a multi-year
    regulatory, site, and fuel-cycle development process, not just buy clean electrons.'
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  tableRefs:
  - TM003
  figureRefs:
  - FM002
- id: drivers-and-constraints
  title: Growth drivers, constraints, and preserved contradictions
  body: 'The strongest growth drivers are visible and credible: large-user demand for firm clean energy is rising, coal-site repowering opens a huge infrastructure lens, industrial decarbonization is producing concrete partnership activity, and Europe is investing in lead-cooled ecosystem capabilities through PRECURSOR, LEANDREA, and related programs. But the constraints are just as material. Licensing and site acceptance take years; a MOX-based value proposition introduces extra fuel-cycle approvals and feedstock dependencies; and capital needs are measured in the billions before commercial fleets exist. The public record therefore contains a contradiction that should be preserved, not averaged away: macro demand for clean firm heat and power is very large while near-term commercial lead-cooled availability is still tiny. Public evidence also suggests buyer education, site qualification, and financing negotiations will progress unevenly by segment, which further compresses the realistic near-term serviceable market. This chapter therefore supports a strong demand backdrop but only a constrained near-term serviceable market.'
  claimRefs:
  - CM031
  - CM032
  - CM033
  - CM034
  - CM035
  - CM036
  - CM037
  - CM038
