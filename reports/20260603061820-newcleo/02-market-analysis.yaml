  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: Public sources do not isolate a Newcleo-specific SAM or SOM by geography, buyer class, or site pipeline.
    whyItMatters: Without a buyer- and region-specific pipeline, it is easy to confuse macro decarbonization need with an investable near-term market for 200 MWe lead-cooled projects.
    diligencePath: Request management's segmented project pipeline, named target sites, and region-level qualification criteria, then reconcile them against public regulatory milestones.
    relatedQuestionRefs:
    - QM020
    - QM027
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: feedstock-access
    missingEvidence: Public evidence does not quantify how much commercially accessible separated material or spent-fuel-derived feedstock could actually support newcleo's MOX thesis in target countries.
    whyItMatters: Fuel-cycle access is central to the company's market narrative, but the difference between theoretical waste availability and licensable commercial feedstock could materially shrink the addressable market.
    diligencePath: Obtain country-by-country feedstock access assumptions, counterparties, and regulatory permissions for separated material, reprocessing, transport, and MOX fabrication.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: project-pricing
    missingEvidence: No public source in this fetched set provides price benchmarks for 200 MWe lead-cooled heat-and-power projects or comparable PPAs versus gas, grid power, or renewables-plus-storage.
    whyItMatters: Without pricing and delivered-cost benchmarks, TAM rhetoric cannot be converted into adoption probability, customer willingness-to-pay, or margin assumptions.
    diligencePath: Ask management for indicative PPA ranges, LCOE assumptions, and industrial-heat price targets by segment, then test them against customer energy bills and alternative technologies.
    relatedQuestionRefs:
    - QM029
