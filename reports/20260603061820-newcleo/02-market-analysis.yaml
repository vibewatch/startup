  title: Market Analysis
  summary: newcleo's usable market is not the full nuclear TAM but the narrower set of industrial, data-center, utility, offshore, and sovereign buyers that value firm clean heat and power plus a closed-fuel-cycle proposition enough to tolerate first-of-a-kind project risk. Public evidence supports strong macro demand and large infrastructure opportunity, but the near-term serviceable market remains constrained by licensing, fuel-cycle approvals, financing, and long enterprise sales cycles.
