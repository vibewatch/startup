tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Likely buyer / payer
  - Relevance to newcleo
  rows:
  - - Industrial heat and power
    - On-site firm electricity plus high-temperature heat for steel, chemicals, cement, hydrogen, and similar facilities
    - General industrial electricity retail spend with no nuclear project component
    - Industrial operator, project company, energy-procurement committee
    - Core target wedge supported by Danieli and newcleo materials
  - - Data-center and digital infrastructure power
    - Dedicated campus-scale clean baseload or contracted energy-service capacity
    - Generic utility tariffs or REC purchases without behind-the-meter or dedicated capacity logic
    - Data-center operator or long-term offtaker
    - Core early-offtaker wedge in newcleo's U.S. plan
  - - Grid and repowering projects
    - Retired-coal replacement, small-grid support, district heating, and utility-scale firm power
    - All bulk-power demand everywhere
    - Utility, state-backed developer, regulated off-taker
    - Relevant but broader and less differentiated than industrial or fuel-cycle-linked uses
  - - Waste, fuel-security, and sovereignty-linked programs
    - Projects where waste reduction, domestic fuel security, or strategic autonomy matter alongside power and heat
    - Waste-management policy spend that never converts into reactor or fuel-facility procurement
    - Government, state-backed utility, or strategic industrial sponsor
    - Strategically important differentiator for the MOX narrative
  - - Offshore and floating nuclear applications
    - Electricity and process heat for offshore platforms or floating generation units
    - Generic marine power systems without advanced-nuclear relevance
    - Offshore operator, marine infrastructure sponsor
    - Adjacent demand wedge supported by Saipem
  - - Broad SMR or conventional nuclear TAM
    - Headline nuclear or SMR market narratives
    - Large Gen III gigawatt plants and generic global nuclear TAMs not mapped to newcleo's offer
    - Analysts and policymakers rather than direct buyers
    - Useful context, but not a decision-useful market boundary
  notes: Rows classify the addressable market by job-to-be-done rather than by generic nuclear capacity. Included and excluded spend are author classifications grounded in public company, partner, and industry sources.
