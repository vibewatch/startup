    - Medium- to long-term
    - Can differentiate newcleo where governments value sovereignty and waste handling
    - What feedstock access assumptions are contractually supportable?
  - - Long licensing and GDA / NRC timelines
    - Constraint
    - Current to medium-term
    - Pushes revenue realization into the 2030s and narrows the near-term serviceable market
    - What are the earliest realistic dates for reactor, fuel-facility, and site approvals?
  - - Fuel-cycle complexity and public acceptance
    - Constraint
    - Current to long-term
    - MOX and recycling add approvals and stakeholder-management complexity versus simpler LWR pathways
    - Which jurisdictions are actually open to the required fuel-cycle steps?
  - - Capital intensity and repeated fundraising
    - Constraint
    - Current to medium-term
    - Interest may not convert into projects without large equity, debt, or state support
    - How much capital is needed before first commercial revenues?
  - - Technology fragmentation across SMR architectures
    - Constraint
    - Current
    - Broad market figures overstate comparability and can mislead diligence
    - Which comparable vendors truly target the same buyer, site, and fuel chain?
  notes: Driver and constraint timing is qualitative. The rows focus on adoption and valuation relevance rather than attempting a single weighted score.
