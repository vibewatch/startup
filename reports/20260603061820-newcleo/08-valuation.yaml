- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing failure
    - No de-SPAC close or equivalent large financing on acceptable terms by 2H26-2027
    - Current valuation reference loses credibility and dilution risk jumps
    - Thesis break; re-underwrite from downside financing case
  - - French milestone slippage
    - Demo or fuel milestones move right by more than 12 months without matched capital relief
    - Base-case range compresses because time-to-value lengthens
    - Shift to bear-case assumptions
  - - Revenue-quality failure
    - Management cannot bridge 2024 revenue, other income, and financial income to durable segment economics
    - EV/revenue comparisons become unusable and credibility weakens
    - Pause investment until audited bridge is produced
  - - Pipeline proof failure
    - No signed customer or site evidence behind the 9.2GW opportunity narrative
    - Bull case loses its commercial-conversion driver
    - Cut upside valuation range materially
  - - Public-market window shuts
    - Advanced-nuclear public comps de-rate further or remain too volatile for follow-on financing
    - External liquidity option weakens and required return rises
    - Demand larger entry discount or stand aside
  enumerationScope:
    coverage: partial
    basis: These are the most monitorable public kill triggers tied directly to valuation support rather than exhaustive operating risks.
  notes: A trigger is only useful if it is observable from public evidence or standard diligence materials.
