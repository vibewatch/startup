- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Public capital markets are open to advanced-nuclear platforms'
    - Oklo and NuScale both support multi-billion public marks for companies still before full commercial scale
    - Advanced-nuclear public comps de-rate materially and stay shut for follow-on financings
  - - 'THESIS: Newcleo has a more industrial revenue base than pure pre-revenue peers'
    - MarketsInsider attributes about $80m of 2024 revenue, other income and financial income from operating companies
    - Management cannot prove revenue quality, margins, and recurrence by subsidiary
  - - 'THESIS: The announced SPAC gives a usable external pricing anchor'
    - Proposed pre-money of about $2.4b with committed PIPE and trust cash frame the current negotiation zone
    - The transaction fails, redemptions spike, or terms worsen
  - - 'ANTI-THESIS: Capital need remains far larger than the announced transaction'
    - Sifted reports around EUR3bn needed in France by 2030 and billions more by decade end
    - Milestone capital plan shows materially lower spend and strong non-dilutive support
  - - 'ANTI-THESIS: Reactor economics are still buried beneath acquired supply-chain revenue'
    - Current public revenue is not reactor deployment revenue
    - Management proves durable segment margins and bridge to reactor cash generation
  - - 'ANTI-THESIS: Valuation can look cheap versus Oklo but rich versus BWXT-style revenue multiples'
    - Speculative public comps and mature nuclear manufacturers imply very different valuation logics
    - Newcleo delivers enough licensing and project proof to justify leaving mature-industry anchors behind
  notes: The view changes are intentionally falsifiable; they are not generic positives and negatives.
