- id: scenario-ranges-and-kill-triggers
  title: Scenario ranges and kill triggers
  body: Because a tight DCF is impossible from public information, the correct valuation framework is milestone-conditioned scenarios. In the bull case, the de-SPAC or equivalent large financing closes, French siting and fuel milestones keep moving, industrial partnerships convert into signed projects, and the company proves that supply-chain revenue can become a platform for reactor economics rather than just a temporary balance-sheet support. In the base case, Newcleo stays financed enough to preserve option value but remains several steps short of bankable commercial reactors; that leaves valuation clustered around, not dramatically above, the announced transaction reference. In the bear case, financing friction, redemptions, or regulatory slips force a lower-priced round before reactor economics are clearer. These scenarios are less about choosing a perfect number than about identifying what must be true to defend the number already in the market. If those conditions fail, valuation
    should compress quickly.
