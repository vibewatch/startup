- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - SPAC closes cleanly; French and US milestones advance; industrial MOUs convert; supply-chain revenue quality is proven
    - Broad equity value range roughly $4.0b-$6.0b; upside comes from de-risked milestones and access to larger pools of capital
    - Still vulnerable to long-dated reactor execution and dilution
    - Needs multiple milestone wins, not just one financing event
  - - Base
    - Capital arrives but milestone proof stays mixed; company keeps option value alive without full de-risking
    - Broad range roughly $2.0b-$3.0b, centred around the announced transaction reference
    - Additional raises still likely; fair value remains range-bound
    - Most public evidence points here today
  - - Bear
    - SPAC or equivalent financing slips, redemptions bite, or licensing milestones move right
    - Range roughly $0.8b-$1.5b as the next capital raise resets price under weaker evidence
    - Down-round, dilution, and confidence loss
    - Triggered by financing failure or visible schedule slip
  notes: Ranges are intentionally broad because public evidence does not support a tight DCF or exact dilution-adjusted exit model.
