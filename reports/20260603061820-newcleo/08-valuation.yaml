- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - SPAC economics
    - Merger agreement, PIPE terms, sponsor promote, fee leakage, and redemption sensitivities
    - Gross proceeds are not the same as net usable cash or investor ownership
    - Legal and banking diligence on transaction documents
  - - Cap table and dilution
    - Current preference stack, convertibles, warrants, and post-close share count
    - Return underwriting is impossible without dilution math
    - Management and counsel data room
  - - Revenue bridge
    - 2024 revenue, other income, and financial income by subsidiary and by recurring quality
    - Current revenue could overstate commercialization proof if it is mostly acquisition-driven support activity
    - CFO package and audited segment bridge
  - - Milestone capital plan
    - Capital required to reach 2030 and 2033 milestones under base and downside cases
    - Determines whether announced financing is sufficient or just another bridge
    - Board-approved financing model
  - - Pipeline quality
    - Signed customer, site, or partner evidence behind the 9.2GW opportunity pipeline and Slovakia/industrial narratives
    - Bull case needs conversion proof, not just opportunity language
    - Commercial diligence with contracts and term sheets
  - - Regulatory path
    - Integrated ASNR, NRC, and UK milestone map with budget by gate
    - Valuation depends more on milestone timing than on abstract technology quality
    - Regulatory diligence workstream
  enumerationScope:
    coverage: partial
    basis: These six asks are the highest-priority items needed to convert a track stance into an investable price call.
  notes: Items are ranked by how directly they change dilution-adjusted returns rather than by general interestingness.
