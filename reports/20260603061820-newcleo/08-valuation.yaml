  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: dilution
    missingEvidence: Detailed cap table, sponsor promote, PIPE backstop terms, warrants, and post-close share count.
    whyItMatters: Gross proceeds do not translate into investor returns without dilution math.
    diligencePath: Review merger agreement, financing schedules, and counsel-prepared cap table model.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited 2024 segment bridge separating recurring operating revenue from other income and financial income.
    whyItMatters: Relative valuation is misleading if the current revenue base does not represent durable commercialization progress.
    diligencePath: Request CFO workpapers and audited subsidiary bridge.
  - type: private-evidence-only
    severity: material
    topic: capital-plan
    missingEvidence: Milestone-by-milestone capital need through 2030 and first commercial deployment with downside cases.
    whyItMatters: Without it, investors cannot tell whether the announced financing is enough or just another bridge.
    diligencePath: Obtain board-approved financing model and downside liquidity analysis.
  - type: missing-source
    severity: material
    topic: TV004 pipeline-proof gap
    missingEvidence: Signed customer, site, or term-sheet evidence behind the 9.2 GW opportunity pipeline and industrial narratives.
    whyItMatters: Bull-case valuation depends on pipeline conversion, not just market interest.
    diligencePath: Collect customer contracts, LOIs, and project-specific development agreements.
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: regulatory-budget
    missingEvidence: Integrated regulatory critical path tying ASNR, NRC, and any UK workstreams to budget and timing.
    whyItMatters: Milestone timing, not headline technology quality, is the key driver of valuation compression or expansion from here.
    diligencePath: Request programme-management tracker with spend-to-date and next-gate funding needs.
