callouts:
- calloutType: insight
  title: The strongest public proof is customer-intent, not customer-revenue
  body: Saipem and Danieli matter because they are customer-side voices describing concrete workflows. But until a named buyer signs capacity, heat, or reactor terms, these remain intent signals rather than durable commercial proof.
  claimRefs:
  - CU003
  - CU004
  - CU009
  - CU010
- calloutType: risk
  title: Commercial concentration could become extreme before it is measurable
  body: With no public paying-customer base today, the first one or two commercial buyers could dominate early backlog. That makes diligence on first-customer identity, sector mix, and funding path more important than any synthetic customer-count metric.
  claimRefs:
  - CU013
  - CU033
  - CU034
- calloutType: recommendation
  title: Demand-side diligence should ask for contracts, not more logos
  body: The chapter already has logos and use-case statements. What it lacks is contract form, payment mechanics, offtake volume, and buyer seriousness. The next diligence step is to request term sheets, deposits, or stage-gated commercial commitments.
  claimRefs:
  - CU001
  - CU012
  - CU039
