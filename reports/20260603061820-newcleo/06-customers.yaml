chapter:
  number: 6
  title: Customers
  summary: As of 2026-06-03, newcleo has not publicly disclosed paying reactor customers, contracted PPAs, or operating commercial plants. The strongest public demand evidence instead comes from named industrial counterparties and R&D hosts such as Saipem, Danieli, ENEA, and the EAGLES-LEANDREA consortium, plus repeated management references to data centers and hard-to-abate industry as future off-takers. That is useful customer-intent evidence, but it is not the same thing as production customer proof, retention, or revenue durability.
