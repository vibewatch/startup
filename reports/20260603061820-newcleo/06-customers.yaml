    - No signed reactor sale, pricing, or implementation timetable
  - - ENEA / PRECURSOR
    - R&D host
    - Electrical simulator and precursor development at Brasimone
    - R&D / qualification
    - Shows respected host institution willing to advance the technical path
    - Does not represent external power demand or a paying customer
  - - EAGLES / LEANDREA / SCK CEN
    - Demonstrator and materials-test host
    - Future technology demonstrator and test facility for materials and fuels
    - Demonstrator only
    - Useful commercialization-enablement signal for future customers
    - Still long-dated and not equivalent to a customer deployment
  notes: Enumeration includes the named external counterparties visible in the reviewed public source pack as of 2026-06-03. These rows intentionally separate customer-side proof from actual commercial customer proof; none of the rows is a disclosed paying reactor customer.
