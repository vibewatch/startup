  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: commercial-customer-gap
    missingEvidence: Named paying customers, signed PPAs, offtake terms, or reactor-order documents for newcleo.
    whyItMatters: Without commercial customer proof, the chapter can only underwrite demand intent and partner quality, not revenue durability or backlog quality.
    diligencePath: Request signed customer contracts, term sheets, letters of intent with MW or heat offtake, and milestone-linked payment structure details.
    relatedQuestionRefs:
    - QU003
    - QU010
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Contract length, renewal mechanics, cohort retention, NRR / GRR, satisfaction, SLA performance, and reference-customer interviews.
    whyItMatters: Durability is a core customer question; absent retention and satisfaction data, there is no public basis to model repeat demand or churn resistance.
    diligencePath: Ask management for any customer funnel and retention deck, counterpart reference calls, and if unavailable at least the stage-gated commercial pipeline by counterparty.
    relatedQuestionRefs:
    - QU011
    - QU022
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer exposure, channel concentration, geographic mix, and strategic-investor-to-customer overlap.
    whyItMatters: If the first real customers come disproportionately from one sector or financing relationship, concentration risk could be extreme even before the first plant operates.
    diligencePath: Request a pipeline split by sector, geography, counterparty type, and expected first-fleet economics.
    relatedQuestionRefs:
    - QU012
    - QU013
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: named-offtaker-gap
    missingEvidence: A public or diligence-only list of named data-center or hard-to-abate industry off-takers currently under discussion.
    whyItMatters: The company repeatedly names these verticals, but without named off-takers it is impossible to test whether the strongest future segment is steel, chemicals, data centers, or something else.
    diligencePath: Ask for dated off-taker conversations, site shortlist, and non-confidential indicators of buyer seriousness such as engineering studies, deposits, or exclusivity windows.
    relatedQuestionRefs:
    - QU001
    - QU010
    relatedTableRefs:
    - TU001
    - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: counterparty-list
    missingEvidence: A complete list of all publicly disclosable external counterparties beyond the handful named in the reviewed sources.
    whyItMatters: The named-proof table is exhaustive only for the reviewed public source pack, not necessarily for all existing counterparties or pilots.
    diligencePath: Ask management to confirm whether any other named industrial users, sovereign hosts, or grid partners can be disclosed publicly.
    relatedQuestionRefs:
    - QU002
    relatedTableRefs:
    - TU003
sections:
- id: target-segments-and-buyer-map
  title: Target Segments and Buyer Map
  body: newcleo's public customer picture starts with market segments, not with contracted customers. Across the NRC deck, SPAC materials, and broader advanced-nuclear context sources, the recurring buyer categories are data centers, hard-to-abate industry, process-heat-intensive manufacturing, offshore energy users, and other buyers that value firm clean electricity plus heat. That target-segment map is plausible and sector-consistent; peers like Oklo, X-energy, NuScale, Moltex, and Blykalla market similar end uses. But it is important to separate segment credibility from customer proof. Today's public evidence says newcleo has identified economically sensible buyer archetypes; it does not show that any one of those archetypes has signed a firm reactor or heat-offtake deal. Strategic investors from AI and industrial sectors strengthen the demand narrative, but they still function as soft signal rather than proof of payer behavior.
  claimRefs:
  - CU007
  - CU008
  - CU016
  - CU017
  - CU019
  - CU020
  - CU026
  - CU027
  - CU029
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-counterparties-and-proof-quality
  title: Named Counterparties and Proof Quality
  body: 'The named public counterparties are real, but they are not equivalent to commercial customers. Saipem and Danieli provide the strongest customer-side evidence because each counterparty uses its own channel to describe a specific intended use case for newcleo technology. Saipem talks about offshore electricity, process heat, and floating units; Danieli talks about green steel, Digimelter, Energiron, and hydrogen. Those releases prove demand intent and technical fit. They do not prove signed reactor orders, capacity commitments, or revenue recognition. ENEA and LEANDREA are one step farther from customer proof: they show that respected R&D and demonstrator hosts are willing to work with newcleo, but those are qualification and technology-readiness relationships, not paying-customer relationships. The right analytical distinction is therefore partner, demonstrator host, and prospective user on one side, and actual paying commercial customer on the other.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU009
  - CU010
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: adoption-trajectory-and-commercial-readiness
  title: Adoption Trajectory and Commercial Readiness
  body: 'Public adoption metrics for newcleo are best read as commercialization prerequisites rather than customer traction. The reviewed sources do not disclose plants in operation, MW sold, signed PPAs, a paying-customer count, or any recurring-revenue metric. What they do disclose is a sequence of enabling markers: UK GDA acceptance, NRC pre-application work, ENEA PRECURSOR, LEANDREA, French site development, and an expanding narrative around future off-taker verticals. This matters because it changes how the chapter should score progress. For a software or services company, absence of customer count would be catastrophic. For an advanced-reactor developer at this stage, regulatory and technical milestones are meaningful, but only as leading indicators. They can lower future customer-acquisition friction, but they do not yet answer the core question of who pays, when they pay, or how durable those payments will be once a first plant exists.'
  claimRefs:
  - CU001
  - CU011
  - CU018
  - CU021
  - CU031
  - CU032
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: retention-expansion-and-concentration-gaps
  title: Retention, Expansion, and Concentration Gaps
  body: Because there is no public commercial fleet, nearly every durability metric is blank. No reviewed source disclosed contract length, renewal mechanics, NRR, GRR, churn, customer satisfaction, or repeat-order behavior. That means land-and-expand is unproven and concentration analysis is mostly hypothetical. The main risk is that the first real customer or two could dominate the entire early revenue base, especially if they come from one vertical such as steel, data centers, or a single sovereign program. Financing risk amplifies this problem. Adverse reporting shows that the company still needs substantial capital before delivery milestones, and procurement will stay slow because counterparties must also underwrite licensing, fuel availability, siting, and build-out risk. The result is a chapter where the correct analytical move is not to guess retention or concentration, but to convert each missing commercial metric into a diligence ask.
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU033
  - CU034
  - CU039
  tableRefs:
  - TU004
  - TU005
- id: peer-benchmark-for-customer-proof
  title: Peer Benchmark for Customer Proof
  body: 'A peer benchmark makes the evidence-quality gap more concrete. Oklo publicly markets PPAs and says a Meta-backed Ohio project includes a prepayment mechanism. ARC discloses a deployment term sheet in Türkiye. Seaborg frames a Pertamina exploration around commercial viability and potential follow-on projects. TerraPower''s 2026 newsroom already talks about commercialization agreements and active construction. Against that backdrop, newcleo''s public counterparties look meaningful but earlier. They show credible industrial interest and serious institutions willing to engage. They do not yet show the same level of commercial proof that peers are starting to disclose. This does not invalidate the newcleo thesis, but it does mean the customer chapter must remain conservative: public demand is visible, public payment proof is not.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU028
  - CU030
  - CU040
  tableRefs:
  - TU006
tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Data centers and digital infrastructure
    - Hyperscaler, colocation operator, or campus owner as buyer; data-center operator as user; energy budget as payer
    - Firm clean power and potentially heat-adjacent site energy
    - Publicly named as target segment but no named customer disclosed
    - Large long-duration load and strong decarbonization need
    - No named off-taker, contract structure, or site economics disclosed
  - - Hard-to-abate industrial users
    - Industrial operator as buyer and user; operating company or project SPV as payer
    - Combined electricity and process heat for chemicals, glass, ceramics, paper, and similar industry
    - Multiple verticals named publicly; no named commercial buyer disclosed
    - Could create high-value long-duration baseload demand
    - No public contract, heat-take profile, or site shortlist disclosed
  - - Steel and hydrogen-linked manufacturing
    - Steelmaker or project owner as buyer; plant operator as user; industrial balance sheet as payer
    - Green steel, Digimelter, Energiron, and hydrogen-linked heat use cases
    - Specific workflow described by Danieli, but still study stage
    - Most concrete public industrial workflow in the source set
    - No signed plant, capex split, or offtake terms disclosed
  - - Offshore energy / floating users
    - Platform operator, grid user, or marine infrastructure sponsor as buyer
    - Offshore electricity and process heat plus floating nuclear units
    - Specific workflow described by Saipem, still feasibility stage
    - Potentially differentiated siting niche with partner validation
    - No prototype order, regulatory path, or commercial structure disclosed
  - - R&D and demonstrator hosts
    - Research center, consortium, or demonstration sponsor
    - Qualification, materials testing, and precursor development
    - Named and active via ENEA and LEANDREA
    - Important for technology de-risking but not equivalent to paying-customer revenue
    - Do not prove durable end-market demand on their own
  notes: This table separates plausible future revenue segments from current public proof. A named segment is not the same thing as a disclosed commercial customer.
