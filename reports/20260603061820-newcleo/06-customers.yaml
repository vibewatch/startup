    - Counterparty-authored proof that the workflow is concrete enough to study jointly
    - No purchase order, MW commitment, or site announced
  - - Danieli
    - Steel and hydrogen-linked manufacturing
    - Green steel, Digimelter, Energiron, and hydrogen-related integration study
    - Feasibility only
