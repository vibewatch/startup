- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - If one data-center or steel buyer converts first, that segment could validate adjacent buyers
    - The first real customer may dominate early backlog because there is no disclosed fleet diversity yet
    - High concentration could define pricing and project design early
    - Request pipeline split by vertical and probability-weighted first-three-site list
  - - Regulatory progress can unlock more buyer conversations
    - Sales remain tightly coupled to licensing and fuel milestones
    - Customer timing can slip even if demand exists
    - Request milestone-to-conversion map from GDA / NRC progress to commercial contracting
  - - Strategic investors may become future users or references
    - Investor names can be mistaken for customer proof
    - Misreading soft demand as firm demand can overstate readiness
    - Request explicit investor-versus-customer classification from management
  - - Named counterparties may broaden into multiple projects
    - No follow-on orders or repeat engagements are public
    - Land-and-expand thesis is unproven
    - Request updates on whether studies have progressed to FEED, site work, or term sheets
  - - European public-funding access may support project development
    - Funding dependence can slow procurement confidence if rounds remain partially closed
    - Counterparties may wait for better financing visibility before committing
    - Request funding plan tied to customer milestones and project finance assumptions
