      - number: '1.3'
        title: Funding history, corporate structure, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Newcleo’s capital story is impressive on scale but noisy on measurement. Independent reporting puts
              disclosed capital at €487 million after the 2024 €87 million close and then €535 million after the later
              €135 million UK tranche, while 2026 company-linked materials move the number to roughly $750 million to
              $780 million raised since founding. Those figures are not interchangeable: they are time-stamped
              differently and may not classify equity, later allotments, and adjacent financing activity the same way.
              Companies House filing history supports the view that capital formation remained active through late 2025
              and the first half of 2026, but it does not solve valuation or instrument-level opacity. The stakeholder
              mix also matters. Industrial groups such as Danieli, Saipem, Walter Tosto, and other named investors are
              strategically relevant because the commercialization path depends on supply chain and industrial heat use
              cases, not just financial sponsorship. At the same time, the proposed NewHold transaction shows management
              still wants a public-capital option even though the reviewed evidence does not show completion by the run
              date.
