      - number: '8.2'
        title: Financing context and public comparables
        blocks:
          - type: paragraph
            body: >-
              The public comp set is useful only when split by business model. Oklo and NuScale represent speculative
              advanced-reactor equities that still trade on licensing optionality, policy access, and capital abundance
              more than on conventional earnings. BWXT represents the opposite end of the spectrum: a profitable nuclear
              manufacturing and engineering incumbent with real revenue, cash flow, and defence-backed durability.
              Newcleo sits awkwardly between these poles. MarketsInsider attributes about $80 million of 2024 revenue,
              other income, and financial income to the company, but that revenue comes from supply-chain operating
              companies rather than reactor deployment. Against BWXT's mature multiple, Newcleo screens rich; against
              Oklo or NuScale's speculative public marks, the announced SPAC looks less extreme. That is precisely why a
              single peer multiple is misleading. The comp exercise supports direction, not precision: advanced nuclear
              can command multi-billion valuations, but only when investors accept long-dated milestone risk and major
              funding dependence.
