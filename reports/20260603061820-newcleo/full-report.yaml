              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Multiple sizing lenses, not one headline TAM
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple sizing lenses, but none cleanly yields a Newcleo-specific SAM or SOM.
              The broadest lens is infrastructure opportunity: the World Economic Forum cites U.S. Department of Energy
              work suggesting up to 174 GWe at retired or retiring coal sites and another 95 GWe at existing nuclear
              sites. That frames the upper bound for new nuclear siting, not the part that will clear first-of-a-kind
              lead-cooled licensing, fuel, financing, and customer risk tests. Adjacent company signals show how
              fragmented the market really is: NuScale markets 77 MW light-water modules and a 6 GW utility program;
              Oklo markets up to 75 MWe through PPAs; Blykalla targets 55 MW lead-cooled deployments; ARC addresses 100
              MWe-to-gigawatt sites. Those lenses indicate demand for firm modular nuclear across several buyer classes,
              but they are not interchangeable. The decision-useful conclusion is that market need is large while the
              underwritable near-term lane for newcleo is still narrow and project-specific.
            claimRefs:
              - CM009
              - CM010
              - CM011
