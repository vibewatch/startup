      - number: '3.3'
        title: Regulatory posture, scale markers, and trust signals
        blocks:
          - type: paragraph
            body: >-
              Regulatory posture is where newcleo's public competitive story is most mixed. The company has meaningful
              momentum—U.S. pre-application engagement for both a reactor and MOX facility, plus active French and
              Slovak milestones—but the retained evidence still places it earlier than NuScale's NRC-approved module and
              behind ARC's published Canadian review status. Scale markers are better than many venture-backed peers:
              multiple sources cite more than 900 employees, over 100 partnerships, and tens of millions of 2024
              revenue. Even so, public-market rivals such as Oklo, NuScale, and BWXT can point to disclosed cash
              balances, market capitalizations, analyst coverage, and established investor-relations surfaces. That kind
              of disclosure becomes a trust signal for customers, partners, and suppliers. It does not guarantee
              execution, but it gives competitors a more legible capital and governance posture than newcleo currently
              offers as a private company approaching de-SPAC. That gap matters competitively because customers in
              regulated infrastructure markets often read financing disclosure as a proxy for execution resilience. A
              peer that can show public cash, filings, and governance can look lower-risk in procurement even before it
              proves a cheaper reactor. newcleo therefore competes not only on reactor design and fuel-cycle logic, but
              also on how quickly it can convert private-company opacity into a more durable public trust signal.
            claimRefs:
