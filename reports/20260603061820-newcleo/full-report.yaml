  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and fuel-cycle risk
        blocks:
          - type: paragraph
            body: >-
              Newcleo's largest single underwriting issue is not whether regulators know the company exists, but how
              many separate approvals must line up across reactor design, fuel fabrication, waste handling, transport,
              and country-by-country siting before cash flows from reactor deployment become real. The company has
              opened tangible regulatory pathways: the US effort is now in NRC pre-application mode, the UK design was
              accepted into generic design assessment, and France remains the centre of gravity for the MOX fuel and
              demonstration reactor plan. But none of these datapoints means the company has de-risked licensing. The US
              package is still educational material, the UK process is expected to take around two years before any
              deeper deployment decision, and the French pathway still depends on construction authorisation filings,
              public debate, fuel-cycle approvals, and radioactive-material logistics. Because Newcleo's value
              proposition depends on recycled fuel rather than plain reactor hardware, regulatory complexity is
              multiplied rather than reduced. The UK plutonium-access setback already showed that feedstock policy can
              change plant-location strategy. Investors should therefore treat the regulatory stack as a chain whose
              weakest link is waste access plus fuel licensing, not just the reactor safety case.
            claimRefs:
