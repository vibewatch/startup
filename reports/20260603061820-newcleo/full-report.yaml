      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Newcleo has public-market optionality, but not public-market-grade proof. The announced transaction, new
              finance leadership, and broad industrial narrative help, yet current disclosure still falls short of what
              an investor would need for conviction on dilution-adjusted returns. Public peers already expose much more
              surface area to scrutiny through executive pages, stock pages, SEC search visibility, and
              adjacent-business disclosures, which is exactly why Newcleo still looks early relative to a true
              public-company standard. Even where EU funding channels for advanced nuclear exist, they should be treated
              as competitive context rather than as committed capital. The most important diligence gap is not a missing
              technology description; it is the absence of an integrated financial bridge from today's acquired
              supply-chain revenue to tomorrow's fuel and reactor cash flows. Investors also need to know how much of
              the proposed gross proceeds would survive after redemptions, fees, and promote economics, and what
              additional funding is still required to reach 2030 and 2033 milestones. Exit readiness today therefore
              looks closer to conditional strategic or listed optionality than to a clean, independently underwritten
              public-company destination. The chapter's final recommendation remains track until those asks are closed
              or the entry price changes enough to create a real margin of safety. That missing bridge is why
              disciplined investors should prefer research sequencing and pricing discipline over enthusiasm for the
              category alone.
