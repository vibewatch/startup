      - number: '7.2'
        title: Capital intensity and model risk
        blocks:
          - type: paragraph
            body: >-
              Newcleo's public fundraising story simultaneously demonstrates investor interest and financing risk.
              Independent reporting shows the company moved from roughly EUR487 million of disclosed capital after an
              EUR87 million close to roughly EUR535 million after a later set of closes, yet the same reporting makes
              clear the company still targets far larger sums, including a previously announced EUR1 billion equity
              raise and about EUR3 billion of investment in France by 2030 alone. That gap matters because the public
              record also shows meaningful burn and only modest current revenue relative to the build required for fuel
              infrastructure, demonstration assets, and eventual commercial reactors. Sifted cites average monthly cash
              burn of about EUR13 million in first-half 2024, EUR221 million of cash at 30 June 2024, a EUR57.5 million
              2023 loss, and revenue that still came from acquired operating companies rather than reactor sales.
              Ongoing Companies House share allotments through 2025 and 2026 are consistent with a business still
              dependent on repeated equity infusions. The underwriting implication is straightforward: if the next large
              financing window slips, valuation support weakens before reactor milestones can compensate.
