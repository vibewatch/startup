      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Oklo
        - Public EV / market cap
        - About $9.43b EV and $11.64b market cap; pre-revenue and cash-rich
        - Shows public markets will price advanced-nuclear optionality at large absolute values
        - Speculative and volatile; no steady revenue base
      - - NuScale
        - Public EV / revenue
        - About $3.57b EV on $18.67m revenue; roughly 191x EV/revenue
        - Useful for how a listed reactor developer can trade despite negative economics
        - Heavily sentiment-driven and not a clean anchor for private fair value
      - - BWXT
        - Public EV / revenue / EBITDA
        - About $18.76b EV on $3.38b revenue; roughly 5.56x EV/revenue with positive EBITDA
        - Mature nuclear manufacturing comp for downside discipline
        - Too mature to anchor a frontier reactor platform directly
      - - X-energy
        - Technology / product status
        - Xe-100 at 80MWe / 200MWt with TRISO-X fuel strategy
        - Shows another industrial-heat and fuel-integrated advanced-reactor narrative
        - No public valuation datapoint in the fetched sources
      - - ARC Clean Technology
        - Technology / regulatory status
        - ARC-100 at 100MWe with Canadian regulatory progress narrative
        - Shows a deployment-ready fast-reactor competitor for industrial power budgets
        - No public mark in the fetched sources
      - - Moltex
        - Technology / fuel-cycle model
        - Wasteburner reactor plus recycling and storage stack
        - Most directly comparable closed-fuel-cycle storyline
        - No public financing mark in the fetched sources
      - - Saltfoss / Seaborg
        - Deployment model
        - Floating CMSR barge concept at 200-800MW
        - Competes for industrial and maritime decarbonization capital
        - Different reactor chemistry and platform design
      - - Blykalla
        - Lead-cooled fast-reactor positioning
