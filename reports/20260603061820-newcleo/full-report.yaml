        specialist bench.
      claimRefs:
        - CO016
  foundingLocation: London, United Kingdom
  headquarters: Paris, France (with active UK entities)
  productSummary: >-
    Newcleo's product stack combines the LFR-AS-200 lead-cooled fast reactor roadmap, smaller precursor and demonstrator
    steps, and future MOX fuel fabrication so the company can sell or develop dispatchable low-carbon heat and power for
    heavy industry, data centers, and other hard-to-abate uses.
  customerFocus: >-
