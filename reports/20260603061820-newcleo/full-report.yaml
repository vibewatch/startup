      - number: '1.4'
        title: Milestones, regulatory path, and disclosed gaps
        blocks:
          - type: paragraph
            body: >-
              The overview evidence is strongest when it traces Newcleo’s execution path through dated milestones.
              ENEA-backed precursor work at Brasimone, the Chusclan FASTER hub, the Danieli and Saipem partnerships, and
              the Slovakia JV all suggest the company is building a multi-country industrialization stack instead of
              relying on a single prototype promise. Regulatory activity also looks tangible: the UK design has entered
              generic design assessment and the company has opened pre-application discussions with the US NRC. But the
              same record surfaces important risk signals. Sifted’s reporting makes clear that Newcleo’s fundraising
              ambition has run ahead of completed closes, that the move to France was partly motivated by funding and
              feedstock considerations, and that the UK plutonium-access setback already forced one fuel-factory plan to
              change course. Disclosure gaps remain equally important. Headcount figures vary sharply by source,
              customer and order-book metrics are not publicly clean, and current valuation evidence is not strong
              enough for a precise cover number. Later chapters should therefore treat execution progress as real, while
              treating scale and economics metrics as provisional unless management provides primary documents.
