              presents an integrated stack: a commercial lead-cooled fast reactor, a recycled-MOX fuel pathway, and a
              ladder of enabling assets that make the reactor credible. At the center is the LFR-AS-200, a 200 MWe
              product positioned for both electricity and high-temperature industrial uses. Around it sit PRECURSOR at
