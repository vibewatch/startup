  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary before market size
        blocks:
          - type: paragraph
            body: >-
              The right starting point for newcleo is not 'all nuclear' or even 'all SMRs.' The company's public
              materials describe a 200 MWe lead-cooled fast reactor paired with a MOX fuel proposition and explicitly
              name industrial decarbonization, data centers, hydrogen, district heating, and grid power as use cases.
              Danieli and Saipem narrow that further into green steel and offshore process-heat applications. That means
              the included market is the subset of clean-energy spend where buyers need firm heat or power, often at
              site level, and may also care about fuel security or waste reduction. The boundary should exclude large
              conventional gigawatt plants, generic retail electricity demand, and any broad SMR spend that does not map
              to a 200 MWe lead-cooled project or a comparable off-take structure. Buyers still compare newcleo with
              other nuclear architectures and with fossil or grid alternatives, so those substitutes matter
              analytically, but they should not be mistaken for included spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
