      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most credible buyers in the fetched evidence are energy-intensive industrials, data-center campuses,
              utilities or district-heating systems, offshore operators, and sovereign or state-backed entities that
              care about spent-fuel management and fuel security. Those segments do not share the same user, payer, or
              procurement path. Industrial projects look like long enterprise infrastructure sales; data-center and
              defense-style opportunities resemble contracted energy-service or PPA structures; utility or sovereign
              projects remain deeply intertwined with regulatory review and public policy. Oklo's published MOU-to-PPA
              funnel is useful here because it shows how even adjacent advanced-nuclear vendors expect long scoping,
              site-evaluation, engineering, and contracting cycles before revenue. Newcleo's own NRC and GDA pathways
              imply the same pattern. This is therefore a market in which the adoption path itself is part of the market
              boundary: buyers must be able to tolerate a multi-year regulatory, site, and fuel-cycle development
              process, not just buy clean electrons.
