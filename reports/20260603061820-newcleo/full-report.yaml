      - number: '3.2'
        title: Capability breadth, customer fit, and commercial structure
        blocks:
          - type: paragraph
            body: >-
              newcleo's most distinctive public story is not generic SMR rhetoric but the attempt to pair lead-cooled
              reactors, MOX fuel, and industry-specific applications such as steelmaking and offshore power. Danieli and
              Saipem support that positioning, and the NRC-hosted presentation points to Slovak, French, Italian, and
              U.S. development tracks. But direct peers also bring differentiated selling points. Oklo pairs fast
              reactors with fuel recycling and DOE-backed plutonium pathways; NuScale pairs a licensed water-cooled
              design with customer financing options through ENTRA1; X-energy emphasizes high-temperature steam and
              heavy-industry fit; ARC emphasizes fast-reactor heritage and long fuel cycles. Across the set, public list
              pricing is largely absent. The visible pattern is consultative, project-specific contracting rather than
              posted rate cards. That means competitive comparison hinges on readiness, financing structure, and
              application fit more than on transparent per-megawatt price competition.
