companyProfile:
  summary: >-
    Newcleo was founded in 2021 to commercialize a closed fuel-cycle advanced-nuclear model built around lead-cooled
    fast reactors, MOX fuel manufacturing, and vertically integrated nuclear-engineering capabilities. The company's
    centre of gravity has shifted from London to Paris, but its operating footprint remains deliberately pan-European,
    with UK entities still active, Italy central to PRECURSOR R&D, Slovakia part of the deployment roadmap, and U.S.
    licensing and fuel-fabrication ambitions also under development. Public evidence supports real regulatory and
    industrial momentum, including UK GDA acceptance, U.S. NRC pre-application work, ENEA-backed precursor activity, and
    a growing set of industrial counterparties. Even so, the company remains pre-commercial in reactor terms, with no
    disclosed paying reactor customers, materially incomplete financial disclosure, and a valuation story that already
    assumes substantial future execution success.
  foundedDate: '2021-03-18'
  founders:
    - name: Stefano Buono
      role: Founder and CEO
      background: >-
        Italian physicist, former CERN scientist, and repeat public-company founder who anchors Newcleo's reactor and
        capital-markets narrative.
      claimRefs:
        - CO012
        - CO013
    - name: Elisabeth Rizzotti
      role: Co-founder and Deputy CEO
