  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The core valuation judgment is that Newcleo is investable only with strong price and evidence discipline.
              The public mark that matters most is the proposed NewHold transaction: roughly $2.4 billion of pre-money
              equity value and up to $429 million of gross proceeds if the PIPE funds and trust cash survive. That is
              useful as a market reference point, but it is not the same as a validated fair value. The public record
              still leaves major holes around cap-table structure, sponsor promote, redemptions, preference overhang,
              and how much of Newcleo's current revenue is durable operating revenue versus financial or
              acquisition-driven income. Meanwhile, Sifted's reporting shows the company still needs billions more for
              France and commercial rollout. That combination argues against a buy-style call. On public evidence alone,
              the right posture is track: stay engaged, underwrite the milestones, but do not mistake a proposed
              public-market transaction for proof that downside is bounded.
