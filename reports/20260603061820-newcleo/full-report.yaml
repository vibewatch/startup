              coupled to MOX fuel produced from reprocessed nuclear material. The design argument is mechanical as much
              as strategic. Lead cooling and atmospheric-pressure operation are presented as the core safety
              differentiators, while the fast spectrum is what allows the company to argue for recycling
              plutonium-bearing material instead of relying on fresh uranium supply. This creates a closed-fuel-cycle
              story that is more vertically integrated than standard light-water SMR competitors. It also introduces new
              dependencies: the reactor only delivers its full strategic advantage if fuel-fabrication readiness,
              feed-material access, and qualification all keep pace with the reactor program. In other words, the
              product is best understood as a fuel-and-reactor system, not a standalone nuclear island.
