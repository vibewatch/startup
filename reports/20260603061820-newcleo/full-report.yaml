chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Newcleo is best described as an advanced nuclear company building a closed-fuel-cycle proposition rather
              than a single reactor-design startup. Across current public materials it is presented as a 2021-founded
              developer of lead-cooled fast reactors that also wants to manufacture mixed-oxide fuel and own more of the
              surrounding industrial supply chain. That matters because the economic story depends on more than reactor
              IP: the company is trying to combine reactor deployment, fuel fabrication, and engineering execution into
              one platform. The geographic picture is similarly more complex than one headquarters line. Coverage now
              frames Newcleo as France-headquartered after a move from London to Paris, yet UK legal entities remain
              active, Italy remains central to precursor work, and US or UK regulatory routes are still being built. For
              later chapters, the reusable ground truth is that Newcleo’s identity is pan-European with a deliberate
              fuel-cycle angle and an industrial-customer thesis anchored in heat and power for hard-to-abate sectors
              rather than purely merchant grid generation.
