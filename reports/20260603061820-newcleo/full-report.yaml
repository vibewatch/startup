      - number: '2.4'
        title: Growth drivers, constraints, and preserved contradictions
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are visible and credible: large-user demand for firm clean energy is rising,
              coal-site repowering opens a huge infrastructure lens, industrial decarbonization is producing concrete
              partnership activity, and Europe is investing in lead-cooled ecosystem capabilities through PRECURSOR,
              LEANDREA, and related programs. But the constraints are just as material. Licensing and site acceptance
              take years; a MOX-based value proposition introduces extra fuel-cycle approvals and feedstock
              dependencies; and capital needs are measured in the billions before commercial fleets exist. The public
              record therefore contains a contradiction that should be preserved, not averaged away: macro demand for
              clean firm heat and power is very large while near-term commercial lead-cooled availability is still tiny.
              Public evidence also suggests buyer education, site qualification, and financing negotiations will
              progress unevenly by segment, which further compresses the realistic near-term serviceable market. This
              chapter therefore supports a strong demand backdrop but only a constrained near-term serviceable market.
            claimRefs:
