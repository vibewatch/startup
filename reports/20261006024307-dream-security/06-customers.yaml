company:
  name: "Dream Security"
chapter:
  number: 6
  title: "Customers"
  summary: "Dream Security targets sovereign governments and critical national infrastructure operators across Europe, the Middle East, Asia, and Latin America with on-premises and air-gapped cyber defense. Commercial operations commencing in late 2024 have yielded a claimed nearly $300M in total contract value and $40M in reported 2025 revenue across ministerial, defense, and utility segments. However, extreme customer concentration, opaque non-disclosure agreements, procurement headwinds from founder controversy, and zero disclosed net retention metrics leave production durability subject to significant diligence verification."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Dream Security stratifies its commercial customer base into three primary sovereign and quasi-sovereign tiers: national security agencies and defense ministries, critical national infrastructure operators, and civilian government ministries. The primary economic buyer is typically a national security adviser, interior minister, or defense procurement authority seeking full technological sovereignty and zero foreign cloud telemetry. Unlike enterprise SaaS security platforms that deploy via multi-tenant public cloud infrastructure, Dream mandates an entirely on-premises, air-gapped delivery architecture where government clients retain total physical and operational ownership over every model layer. Operating across Europe, the Middle East, Asia, and expanding into Latin America, Dream packages its cyber defense offerings to shield water utilities, power grids, nuclear facilities, and energy pipelines against advanced nation-state attacks while ensuring no data escapes sovereign national borders."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Commercial Velocity and Contract Value Trajectory"
    body: "Commercial operations initiated in late 2024, followed by rapid top-line expansion supported by large government commitments. Company announcements in June 2026 stated that Dream has secured nearly $300 million in cumulative total contract value across its national cybersecurity and sovereign AI deployments. Independent financial tracking reports that the company generated $40 million in revenue during 2025 following a $1.1 billion valuation milestone in February 2025, culminating in a $260 million Series C financing round at a $3.0 billion valuation in mid-2026. Despite headline booking figures, contract duration, annual recurring revenue run rate, and cash collection milestones remain undisclosed. The lack of standard revenue recognition details conceals whether contract totals represent multi-year sovereign master service agreements or recognized software licenses."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-retention"
    title: "Named Customer Proof, Retention Dynamics, and Concentration Headwinds"
    body: "Publicly verifiable customer deployments are constrained by sovereign non-disclosure agreements, classified national procurement protocols, and heightened reputational sensitivity surrounding executive leadership. While Dream claims active deployments across ministries and infrastructure operators in Europe, the Middle East, and Asia, zero individual sovereign clients or utility logos are publicly acknowledged on company marketing surfaces. Furthermore, investigative reporting and industry coverage highlight substantial procurement friction: co-founder Shalev Hulio's past leadership of NSO Group and the associated Pegasus spyware scrutiny create persistent reputational hurdles among Western European procurement committees. Net revenue retention, gross revenue retention, and pilot-to-production conversion rates remain completely unreleased, creating acute concentration risk where losing a small number of sovereign counterparties would materially destabilize commercial revenue."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
callouts:
  - calloutType: "risk"
    title: "Sovereign Contract Opacity and Founder Reputational Friction"
    body: "Dream Security's customer proof rests entirely on un-itemized sovereign contract figures without named referenceable clients. In democratic and Western European jurisdictions, historical controversy associated with NSO Group's Pegasus surveillance creates significant vetting friction for defense procurement committees, exacerbating customer concentration across a narrow cohort of sovereign buyers."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU014"
  - calloutType: "insight"
    title: "Air-Gapped Delivery Model Creates High Switching Barriers"
    body: "Deploying proprietary AI models and detection infrastructure directly within air-gapped sovereign environments creates extreme vendor lock-in. Once a government embeds Dream's national data reasoning layer into classified workflows, rip-and-replace friction is formidable, granting substantial structural durability provided political alliances remain stable."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
