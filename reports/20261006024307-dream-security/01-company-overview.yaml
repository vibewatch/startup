callouts:
  - calloutType: "insight"
    title: "Sovereign AI Infrastructure as a Geopolitical Wedge"
    body: "Dream Security's pivot from enterprise cyber tooling to full national sovereign AI addresses an immediate geopolitical constraint: government restrictions by foreign powers (such as US limits on frontier models) and national data sovereignty mandates require governments to own their models and run air-gapped without external telemetry."
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO008"
  - calloutType: "risk"
    title: "Extreme Governance and Reputational Key-Person Concentration"
    body: "While co-founders Shalev Hulio and Sebastian Kurz provide unprecedented access to international heads of state, both figures carry pronounced legal, diplomatic, and public relations scrutiny stemming from offensive surveillance controversies and Austrian political proceedings."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO014"
