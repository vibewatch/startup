company:
  name: "Dream Security"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Dream Security is an Israeli sovereign AI and defensive cybersecurity startup founded in late 2022 by former NSO Group CEO Shalev Hulio, former Austrian Chancellor Sebastian Kurz, and CTO Gil Dolev. The company builds on-premises, air-gapped sovereign AI systems and threat-hunting architectures for national governments and critical infrastructure operators. In June 2026, Dream raised a $260 million Series C round led by Group 11 at a $3 billion valuation, crossing an estimated $100 million in annual recurring revenue (ARR)."
sections:
  - id: "executive-identity-and-mission"
    title: "Corporate Identity, Operating Model, and Sovereign Mandate"
    body: "Dream Security (registered legally in Israel as corporation 516642246 under Dream Group) was founded between late 2022 and early 2023 with headquarters in Tel Aviv-Yafo, Israel. Rather than competing as an enterprise endpoint or niche vulnerability scanner, Dream positions its platform exclusively as a national capability layer for technological sovereignty and critical infrastructure cyber defense. The company engineers on-premises and air-gapped systems intended to process government data entirely within sovereign borders without telemetry leakage or dependence on foreign hyperscalers. Its business model relies on large-scale government procurement across intelligence, defense, and civilian ministries, delivering custom vertical model architectures trained in client-controlled data centers while Dream operates secondary computing clusters including dedicated capacity in Modi'in, Israel."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "founding-and-leadership"
    title: "Executive Leadership, Governance, and Key-Person Risk"
    body: "The company was established by Chief Executive Officer Shalev Hulio (former co-founder and CEO of spyware vendor NSO Group), President Sebastian Kurz (former Chancellor of Austria), and Chief Technology Officer Gil Dolev. This founding coalition creates an unusual blend of offensive/defensive technical cyber tradecraft and elite geopolitical diplomatic access. Functional executive leadership includes Chief Business and Strategy Officer Amir Becker, Chief Legal and Corporate Development Officer Ilan Grinshtain, and Chief of Staff Amit Amrami. While the pedigree unlocks bilateral access to heads of state and ministerial procurement teams across Europe and the Middle East, it also concentrates severe key-person and headline risk around Hulio's past association with offensive cyber surveillance and international litigation."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization History, Valuation Trajectory, and Commercial Scale"
    body: "Dream Security has executed an aggressive financing schedule, completing a major capital round in nearly every year of operation. Following an initial $20 million Seed round in October 2022 and a $35 million Series A round in November 2023, Dream secured a $100 million Series B round in February 2025 led by Bain Capital Ventures at a $1.1 billion valuation, followed by a $45 million secondary transaction in August 2025 at $1.3 billion. In June 2026, Dream closed a $260 million Series C financing round led by Group 11 with participation from Bicycle Capital, Bain Capital Ventures, Aleph, Tru Arrow Partners, and Clal Insurance, bringing post-money valuation to $3.0 billion and cumulative institutional funding to $415 million. Commercially, the company claims $300 million in accumulated customer orders since launching late-2024 operations, with industry estimates confirming that ARR recently surpassed $100 million across an estimated 200 to 500 employees."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
