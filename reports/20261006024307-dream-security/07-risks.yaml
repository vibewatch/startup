company:
  name: "Dream Security"
chapter:
  number: 7
  title: "Risks"
  summary: "The strongest public mitigant is Dream Security's claimed on-premises, air-gapped deployment model, but the assigned evidence does not independently verify legal posture, certifications, service levels, incident history, customer concentration, or audited financial performance. The principal investment risk is therefore verification risk across sovereign procurement, deployment assurance, compute concentration, and scaling rather than a source-supported finding of a specific enforcement action or company incident."
sections:
  - id: "risk-ranking-and-evidence-boundary"
    title: "Risk Ranking and Evidence Boundary"
    body: >-
      Dream Security sells into governments and national infrastructure, where a failed deployment,
      procurement interruption, or assurance deficiency can have unusually high consequences. The
      public evidence supports six ranked diligence themes: sovereign procurement and legal review;
      customer-segment concentration; customer-controlled deployment assurance; compute and facility
      concentration; financial and operating-data opacity; and entity-resolution errors caused by an
      unrelated Korean company with the same name. These are residual-risk assessments, not findings
      that a breach, enforcement action, license failure, or customer loss has occurred. The assigned
      pool contains no target-specific regulator decision, court record, audited financial statement,
      incident postmortem, service-level history, or contract roster. Accordingly, the heatmap uses
      qualitative likelihood and impact bands and makes evidence closure, not intuition, the gating
      mechanism for an investment decision.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-governance"
    title: "Regulatory, Legal, and Governance Exposure"
    body: >-
      Dream's website says deployments remain within national borders, with no telemetry or foreign
      control. That architecture could reduce cross-border data-transfer and hyperscaler dependency
      concerns, but it does not establish compliance with any customer's privacy, export-control,
      defense-procurement, or AI-governance regime. Globes identifies co-founder Shalev Hulio as a
      former NSO Group chief executive and Sebastian Kurz as a former Austrian chancellor; the assigned
      evidence does not contain a court or regulator record establishing current liability for either
      founder. Founder screening and procurement eligibility should therefore be verified rather than
      characterized as an active legal case. A separate Korean issuer and interview subject named
      Dream Security also create a material research-control risk: filings or operating facts can be
      misattributed unless legal entity identifiers, jurisdiction, and website are checked source by
      source.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-assurance"
    title: "Operational Security, Reliability, and Assurance"
    body: >-
      The on-premises and air-gapped model reduces foreign-cloud reliance but shifts substantial
      operational responsibility into each sovereign customer's environment. Public materials in the
      assigned pool do not disclose independent penetration tests, certifications, availability
      history, recovery objectives, patch responsibilities, or false-positive performance, so the
      effectiveness of that operating model remains a diligence question. Industrial Cyber reported
      a critical GNU Inetutils telnetd vulnerability disclosed by Dream Security Labs and explicitly
      said there was no confirmed active exploitation at publication. The affected component is
      third-party software, not evidence of a vulnerability or incident in Dream's own platform; it
      is relevant only as an illustration of the legacy infrastructure conditions that national and
      industrial buyers may operate. Deployment controls, support boundaries, and incident evidence
      must be tested directly.
    claimRefs:
      - "CR001"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-and-execution"
    title: "Dependencies, Financial Opacity, and Scaling Risk"
    body: >-
      Globes reports that Dream serves governments and national infrastructure and that its customer
      count is limited, which makes procurement timing and individual sovereign relationships
      potentially important even though the source does not disclose a concentration denominator.
      The same report places hundreds of Blackwell 200 GPUs in a 250-kilowatt MegaDC footprint in
      Modi'in, indicating a reported facility and advanced-compute dependency without proving that
      this is Dream's only capacity. Public data vendors also disagree on workforce and funding:
      employee measures range from a 101-250 band to 235 and 354, while recorded funding totals range
      from $360 million across two rounds to $415 million across five rounds. Those values may differ
      by date and methodology; they should not be converted into burn, runway, cash available, or
      audited headcount. Investment underwriting requires reconciled cap-table, cash, contract, and
      workforce schedules.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR003"
