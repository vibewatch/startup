      - number: '5.2'
        title: 产品组合、部署证据与成熟度
        blocks:
          - type: paragraph
            body: >
              产品组合覆盖两个相关但不同的任务。Sphere 和 Hero 面向国家网络防御：据报道，Sphere 负责识别、调查并阻止攻击；Hero 调查漏洞和攻击路径、评估风险并提出修复建议。Atlas
              则把平台从网络运营延展到政府职能所需的主权语言模型。这种广度可能支持更大的战略合同，但也带来尽调要求：必须把共享平台组件与分别部署的产品分开，并确认哪些模块已普遍可用、处于试点阶段或仍在路线图上。


              部署证据是正面的，但与发行方有关联。投资方 Tau Capital 报告称，Dream 已在多个阿联酋部门部署威胁检测和安全通信，并为公用事业及智慧城市平台提供实时保护。这支持了实际使用证据，但 Tau
              是投资方而非独立技术评估者，公开叙述没有提供合同范围、正常运行时间、检测率、部署日期或客户撰写的验证。公开员工指标也有分歧：FundedIQ 报告员工区间为 101–250 人，Dealroom 则对应 354
              名员工，其中包括 22 名 AI 专家。这一差异妨碍对实施和支持能力作出精确评估。
