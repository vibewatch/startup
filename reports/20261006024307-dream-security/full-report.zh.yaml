      - number: '5.3'
        title: 架构与主权控制边界
        blocks:
          - type: paragraph
            body: >
              已披露的架构以本地控制为核心。Dream 表示部署采用本地部署和物理隔离方式、不使用遥测、离线接收多种格式的数据，并针对垂直行业和国家环境定制模型。Tau Capital
              补充称，平台结合机器学习、行为分析和实时威胁情报。这些描述确立了功能架构——本地数据边界、数据接入、推理和应用模块——但没有说明底层模型设计、接口、更新机制、加密控制或经过测试的吞吐量。


              Globes 提供了最具体的运营细节。据其报道，政府客户在自有云中训练模型，并从自己的数据中心运行模型，Dream 无法访问客户信息。报道还称模型规模为 8B 至 80B 参数，Dream 在 Modi'in 的
              MegaDC 使用 250 千瓦和数百块 Blackwell 200 GPU。来源没有说明哪些工作负载运行在 MegaDC
              而非客户站点、模型更新如何跨越物理隔离，或每位客户必须提供什么硬件。因此，架构展示项把已披露组件与未解决的依赖分开，而不是呈现一套推测的实施蓝图。
