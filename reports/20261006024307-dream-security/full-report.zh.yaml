            body: >-
              Dream Security
              将商业客户划分为三个主要的主权和准主权层级：国家安全机构及国防部门、国家关键基础设施运营商，以及民政部门。主要经济买方通常是寻求完整技术主权和零外国云遥测的国家安全顾问、内政部长或国防采购机构。不同于通过多租户公有云基础设施部署的企业
              SaaS 安全平台，Dream 要求完全本地部署、物理隔离的交付架构，让政府客户保留每一层模型的全部物理和运营所有权。Dream
              在欧洲、中东和亚洲运营，并正拓展拉丁美洲；它把网络防御产品打包，用于保护水务、电网、核设施和能源管线，抵御高级民族国家攻击，同时确保数据不越过主权国家边界。
