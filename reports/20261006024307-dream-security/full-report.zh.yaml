figures:
  - id: FO001
    title: 公司里程碑与资本化时间线
    type: timeline
    summary: 按时间追踪 Dream Security 从 2022 年至 2026 年的成立、产品发布、融资和估值扩张里程碑。
    data:
      items:
        - label: 2022 年 10 月：公司成立与种子轮
          detail: Dream Security 由 Shalev Hulio 和 Gil Dolev 在特拉维夫创立；完成由 Group 11 领投的 $20M 种子轮。
        - label: 2023 年 11 月：Series A 融资
          detail: 完成由 Aleph 和 Group 11 领投的 $35M Series A，以加速主权 AI 网络安全研发。
        - label: 2025 年 2 月：Series B 与独角兽地位
          detail: 获得由 Bain Capital Ventures 领投的 $100M Series B，估值 $1.1B，用于打造 Cyber Language Model。
        - label: 2025 年 8 月：二级流动性融资
          detail: 完成 $45M 二级交易，估值 $1.3B，由 Group 11、Tru Arrow 和 Tau Capital 支持。
        - label: 2024 年末至 2026 年初：商业扩张
          detail: 在 Sphere 和 Hero 网络安全平台上累计获得据报道为 $300M 的政府订单。
        - label: 2026 年 6 月：$3B 估值的 Series C 融资
          detail: 完成由 Group 11 和 Bicycle Capital 领投的 $260M Series C，估值 $3.0B，ARR 突破 $100M。
        - label: 2026 年 7 月：拉丁美洲地域扩张
          detail: 正式向拉丁美洲主权防务机构拓展商业和市场业务。
