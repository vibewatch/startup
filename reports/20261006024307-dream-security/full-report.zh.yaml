      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 没有事故记录不等于运营没有事故
            body: 指定证据池包含一份关于第三方 GNU 软件漏洞的报道，但没有 Dream 平台复盘或完整事故历史。应通过客户参考、独立测试和事故日志确认安全结果，不要从公开沉默推断安全无虞。
            calloutType: risk
            claimRefs:
              - CR014
              - CR016
          - type: callout
            title: 以证据闭环作为投资闸门
            body: 在赋予更低的剩余风险评级前，要求完成法律和采购审查、按合同拆解的集中度分析、经审计的现金和运营指标、部署保障以及韧性证据。
            calloutType: recommendation
            claimRefs:
