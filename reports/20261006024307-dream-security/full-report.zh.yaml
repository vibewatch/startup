chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与主权使命
        blocks:
          - type: paragraph
            body: >-
              Dream Security（以 Dream Group 名义在以色列注册，公司编号 516642246）成立于 2022 年末至 2023 年初，总部位于以色列特拉维夫-雅法。Dream
              不与企业终端产品或细分漏洞扫描器正面竞争，而是把平台定位为服务技术主权和关键基础设施网络防御的国家能力层。公司构建本地部署、物理隔离的系统，目标是在主权边界内处理全部政府数据，避免遥测泄露，也不依赖外国超大规模云厂商。其商业模式依靠情报、国防和民政部门的大规模政府采购，在客户控制的数据中心交付按垂直行业定制、训练好的模型架构，同时由
              Dream 运营包括以色列 Modi'in 专用容量在内的辅助计算集群。
            claimRefs:
