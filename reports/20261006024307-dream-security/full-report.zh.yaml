      - number: '3.3'
        title: 转换成本、锁定持久性与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              Dream Security 的竞争防御力来自机构转换成本、主权数据本地化和政治接入，而非传统软件网络效应。主权国防合同需要许可级信任、本地部署的物理隔离基础设施，以及与涉密运营网络的集成。一旦某个国家将
              Dream 的 Sphere 平台嵌入国家关键基础设施，并用本国情报训练定制 Atlas 模型，更换厂商就会产生严重运营摩擦并可能造成情报中断。此外，联合创始人 Sebastian Kurz 的外交网络和 NSO
              前管理层关系，能够打开普通企业软件初创公司无法获得的部长级采购渠道。反过来，Dream 也存在明显的护城河脆弱点：主权采购周期超过 12 至 18
              个月，客户数量天然受限于友好外国国家，而商业多租户软件平台能带来更高的经常性运营杠杆。若盟国政府要求本国主权 AI 模型，或强制采用美国认证的厂商框架，Dream 可能被本国国防龙头替代。
            claimRefs:
