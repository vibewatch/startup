  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Dream 把产品定位为国家能力层，而不是传统企业单点产品。公司称该系统将主权 AI 与国家网络安全结合，在国家边界内运行，并把分散的政府数据转化为决策，且不会把遥测发送给 Dream
              或外国云。按客户工作流看，买方是政府或国家机构，使用者是高级官员和网络安全部门，交付结果是一个由本地控制的网络调查和政府专用 AI 工作负载环境。这些是公司描述，不是独立测量的结果。


              产品组合把宽泛的平台主张落到了更具体的边界上。Globes 将 Sphere 描述为网络防御系统，将 Hero 描述为自主漏洞与攻击路径调查产品，将 Atlas
              描述为供国家使用的主权自然语言模型产品。Seedtable 独立地把同一功能模式归纳为国家 AI
              平台、代理式安全产品，以及面向政府和关键基础设施的保护。公开材料仍未披露产品打包、许可边界、实施周期、服务级承诺或可量化的客户收益，因此工作流表将这些项目记录为尽调缺口，而不是估算值。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE010
              - CE011
              - CE015
