              $414M。这些差异可能源于统计范围和对老股出售的处理方式，但来源没有解决分歧。更重要的是，融资额不等于可用现金。没有审阅过的来源提供当前现金、月度消耗、现金跑道、债务、契约或已承诺的项目融资义务，因此新一轮融资支持融资渠道，却不能证明资本充足。
