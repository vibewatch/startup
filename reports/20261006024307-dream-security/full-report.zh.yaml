            body: >-
              公司由首席执行官 Shalev Hulio（间谍软件厂商 NSO Group 前联合创始人兼 CEO）、总裁 Sebastian Kurz（奥地利前总理）和首席技术官 Gil Dolev
              创立。这一创始组合把攻防网络技术经验与高层地缘政治外交资源结合在一起，十分少见。职能高管还包括首席业务与战略官 Amir Becker、首席法务与企业发展官 Ilan Grinshtain，以及幕僚长 Amit
              Amrami。创始团队背景能够打通欧洲和中东国家元首及部长级采购团队的双边渠道，但也让 Hulio 过去参与攻击性网络监控和国际诉讼所带来的关键人物及舆论风险高度集中。
