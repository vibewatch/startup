  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与证据边界
        blocks:
          - type: paragraph
            body: >-
              Dream Security
              向政府和国家基础设施销售产品，因此部署失败、采购中断或保障不足可能造成异常严重的后果。公开证据支持六个有排序的尽调主题：主权采购与法律审查；客户细分集中度；客户控制的部署保障；计算资源和设施集中度；财务及运营数据不透明；以及同名无关韩国公司造成的实体解析错误。这些是剩余风险评估，不是已经发生数据泄露、执法行动、许可失败或客户流失的结论。指定证据池中没有目标公司的监管决定、法院记录、经审计财务报表、事故复盘、服务级历史或合同清单。因此，热力图采用定性可能性和影响区间，把证据闭环而非直觉作为投资决策的闸门。
            claimRefs:
              - CR003
              - CR004
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              Dream 网站称部署留在国家边界内，不使用遥测，也没有外国控制。这种架构可能降低跨境数据传输和依赖超大规模云厂商的担忧，但不能证明符合任何客户的隐私、出口管制、国防采购或 AI 治理制度。Globes
              指出联合创始人 Shalev Hulio 曾任 NSO Group 首席执行官，Sebastian Kurz
              曾任奥地利总理；指定证据没有包含法院或监管记录，能够证明任一创始人当前承担责任。因此，应验证创始人审查和采购资格，而不能把它们描述成正在进行的法律案件。另有一家韩国发行方和一位名为 Dream Security
              的受访者，也造成重大研究控制风险：除非逐个来源核对法律实体标识、司法辖区和网站，否则申报文件或运营事实可能被错误归属。
            claimRefs:
              - CR001
              - CR002
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR015
      - number: '7.3'
        title: 运营安全、可靠性与保障
        blocks:
          - type: paragraph
            body: >-
              本地部署和物理隔离模式减少了对外国云的依赖，却把大量运营责任转移到每个主权客户的环境中。指定证据池的公开材料没有披露独立渗透测试、认证、可用性历史、恢复目标、补丁责任或误报表现，因此该运营模式的有效性仍是尽调问题。Industrial
              Cyber 报道了 Dream Security Labs 披露的 GNU Inetutils telnetd 严重漏洞，并明确表示截至发布时没有确认的主动利用。受影响组件是第三方软件，不是 Dream
              自身平台存在漏洞或发生事故的证据；它的相关性仅在于说明国家和工业买方可能运行的传统基础设施状况。部署控制、支持边界和事故证据必须直接测试。
            claimRefs:
              - CR001
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR014
      - number: '7.4'
        title: 依赖、财务不透明与扩张风险
        blocks:
          - type: paragraph
            body: >-
              Globes 报道 Dream 服务政府和国家基础设施，且客户数量有限；尽管来源没有披露集中度分母，这使采购时点和单个主权关系可能十分重要。同一报道提到 Modi'in 的 MegaDC 设施占地使用 250
              千瓦、配备数百块 Blackwell 200 GPU，说明公司存在已报告的设施和先进计算依赖，但不能证明这是 Dream 的唯一容量。公开数据供应商对员工和融资也意见不一：员工数量从 101–250 区间到
              235 和 354 不等，记录的融资总额则从两轮 $360M 到五轮 $415M
              不等。这些数值可能因日期和方法不同而异，不应被转换成消耗、现金跑道、可用现金或经审计员工数。投资判断需要对账后的资本表、现金、合同和员工计划。
            claimRefs:
