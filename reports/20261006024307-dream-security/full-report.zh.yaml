      - number: '5.4'
        title: 差异化、信任与技术尽调
        blocks:
          - type: paragraph
            body: >
              Dream
              最清晰的已披露差异化在于架构主权：本地运行、零遥测、无外国控制，并按政府环境调整模型。国家网络应用与主权语言模型的结合，也比单一安全类别更宽。这些属性可能对重视管辖权控制和断网运行的政府有价值，但审阅过的证据没有量化检测质量、误报、模型准确率、延迟、可用性或总体部署工作量。因此，在客户撰写的证据和技术测试支持之前，最低摩擦、零集成设置等营销主张都应视为未经验证。


              信任证据同样不完整。公开架构描述了数据留在哪里、由谁操作模型，但没有披露认证、独立审计、安全更新流程、漏洞披露实践、事故历史或隐私与留存控制。在指定证据池中，没有出现相关的公司专属代码库、软件包、从业者论坛、工程演讲或其他开发者信号代理。投资判断应要求架构审查、红队结果、模型评估、服务和支持记录，以及至少两次覆盖生产部署的客户参考电话。在此之前，产品在部署模式上似乎有差异化，但比较性能和运营可靠性仍未验证。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE012
