        blocks:
          - type: paragraph
            body: >-
              Dream Security 的融资节奏激进，几乎每个运营年度都完成一轮大型融资。2022 年 10 月完成 $20M 种子轮，2023 年 11 月完成 $35M A 轮；随后在 Bain Capital
              Ventures 领投下，于 2025 年 2 月以 $1.1B 估值完成 $100M B 轮，并在 2025 年 8 月以 $1.3B 估值完成 $45M 老股交易。2026 年 6 月，Dream 在
