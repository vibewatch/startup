              自己的网站把产品描述为开箱即用、定制化、本地部署且物理隔离的平台，却没有公开标价、计费单位、折扣政策或收入确认方法。能够站得住的结论是：公司采用定制化主权合同模式，但经常性软件、实施和服务的组合仍未知。
