  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初步威胁界定到跨部委扩张的六阶段主权客户获取生命周期。
    approximationNotes: 阶段和触点综合自主权采购标准与物理隔离企业软件生命周期。
    data:
      nodes:
        - label: 1. 地缘政治威胁评估
          summary: >-
            Sovereign audit of national cyber vulnerabilities, hostile nation-state risks, and foreign cloud
            dependencies
          touchpoints:
            - National security council reviews
            - Critical infrastructure vulnerability audit
        - label: 2. 物理隔离架构界定
          summary: Design of strictly on-premises, air-gapped infrastructure topology within national borders
          touchpoints:
            - Data sovereignty compliance check
            - Zero-telemetry hardware validation
        - label: 3. 主权试点概念验证
          summary: Initial deployment of Sphere and Hero on isolated critical infrastructure network segments
          touchpoints:
            - Simulation of nation-state attack vectors
            - Air-gapped AI reasoning benchmark
        - label: 4. 国家级生产环境启用
          summary: Full commercial commissioning protecting power grids, water facilities, and energy networks
          touchpoints:
            - Formal classified procurement sign-off
            - Multi-year master service agreement execution
        - label: 5. 运营加固与集成
          summary: Autonomous vulnerability analysis and attack path mitigation by local operational teams
          touchpoints:
            - Continuous autonomous red-teaming
            - Domestic intelligence ingestion workflows
        - label: 6. 跨部委主权 AI 扩张
          summary: Expansion of custom models across interior, finance, and justice civilian administrative bodies
          touchpoints:
            - Cross-ministerial data reasoning deployment
            - Expansion contract value add-on
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU011
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅考虑指定证据中可见的缓解措施后，对六项尽调风险进行定性优先级排序。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解证据
        - 剩余优先级
      rows:
        - label: 主权采购与法律审查
          values:
            - 中
            - 高
            - 架构声明；缺少法律记录
            - 高
        - label: 客户细分集中度
          values:
            - 中
            - 高
            - 客户数量仅被描述为有限
            - 高
        - label: 部署保障与服务质量
          values:
            - 中
            - 高
            - 本地和物理隔离声明
            - 高
        - label: 算力与设施集中度
          values:
            - 中
            - 高
            - 据报设施布局；缺少冗余
            - 高
        - label: 财务与运营数据不透明
          values:
            - 高
            - 中
            - 多个公开数据集；没有经审计的核对
            - 高
        - label: 实体名称误归属
          values:
            - 高
            - 中
            - 实体标识符可以缓解
            - 中
    approximationNotes: 可能性、影响和剩余优先级区间是分析师判断，不是测量概率；不代表任何数值换算或事件频率。
    claimRefs:
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将宏观经济顺风、商业进展和估值溢价连接至有条件的“跟踪”建议的序贯决策框架。
    data:
      nodes:
        - label: 宏观主权需求
          detail: 对前沿模型的地缘政治出口限制，推动各国对本地主权 AI 的需求
          tone: positive
        - label: 商业动能
          detail: 据报 $300M 客户订单和 $100M ARR 跑率支撑 2026 年 6 月的 $260M Series C
          tone: positive
        - label: 高企的入场倍数
          detail: 当前 $3.0B 估值隐含激进的约 30x ARR 倍数，需要持续的超高速增长
          tone: warning
        - label: 治理与创始人摩擦
          detail: 管理层与 NSO Group 的背景关联，在欧洲防务采购中持续造成摩擦
          tone: negative
        - label: 财务不透明
          detail: 缺少经审计财务报表、已确认的毛利率结构或透明的净收入留存率
          tone: negative
        - label: 建议：跟踪
          detail: 在经审计的 FY2025 财务报表和三个主权客户背书得到确认前，不承诺投入资本
          tone: neutral
    approximationNotes: 将量化估值倍数与运营及治理风险指标结合的定性决策综合。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV010
      - CV013
      - CV014
