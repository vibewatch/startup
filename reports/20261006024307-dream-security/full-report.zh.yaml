              融资才会降低近期融资风险；这两点都没有公开。投资尽调因此应要求经审计报表、按合同确认收入、经常性收入与服务收入桥接、客户群组，以及现金到现金跑道的时间表，之后再给已报告运行率赋予 SaaS 经济性或估值。
