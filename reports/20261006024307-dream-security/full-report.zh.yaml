  - id: FM001
    title: 主权 AI 与网络防御市场规模金字塔
    type: pyramid
    summary: 从全球宏观网络安全支出逐层下探至 Dream Security 已验证运营规模的分层市场规模。
    data:
      items:
        - label: 全球宏观网络安全 TAM
          value: 200
          unit: USD B
          note: 自上而下汇总的商业和公共网络安全软件及服务支出
        - label: 主权 AI 与关键基础设施 SAM
          value: 25
          unit: USD B
          note: 可触达的国防、主权 LLM 和物理隔离关键基础设施保护市场
        - label: 近期可服务可获得市场（SOM）
          value: 4.5
          unit: USD B
          note: 覆盖 100-150 个目标国家及主要基础设施运营商的近期可触达主权管线
        - label: Dream Security 据报商业订单
          value: 0.3
          unit: USD B
          note: 自 2024 年末商业发布以来累计的客户合同订单
        - label: Dream Security 估算年度经常性收入（ARR）
          value: 0.1
          unit: USD B
          note: 2026 年 6 月完成 $260M Series C 融资后达到的估算 ARR 里程碑
        - label: Dream Security Series C 资本注入
          value: 0.26
          unit: USD B
          note: 2026 年 6 月由 Group 11 和 Bicycle Capital 领投、按 $3.0B 估值筹集的增长资本
    approximationNotes: 宏观 TAM 和 SAM 代表自上而下的市场共识区间。SOM 反映自下而上的可触达主权合同规模。公司里程碑反映已披露的订单和融资总额。
    claimRefs:
