  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与结构范围
        blocks:
          - type: paragraph
            body: >
              Dream Security 面向的是国家主权 AI
              和任务关键型网络安全基础设施这一专业领域，而非横向的企业安全即服务市场。其可服务运营边界包括本地部署、物理隔离的国家网络防御平台；面向民政和国防部门的主权基础语言模型；以及针对民族国家高级持续性威胁（APT）的自主漏洞调查系统。商品化企业终端检测与响应（EDR）、标准云原生应用保护平台（CNAPP）和面向消费者的
              AI 应用均不在这一运营范围内。


              现状替代方案主要是 Palo Alto Networks、Check Point Software 和 CyberArk
              等厂商提供的彼此割裂的传统单点产品，加上人工运营的国家安全运营中心（SOC）和政府内部定制的涉密系统。与此同时，Palantir Technologies
              等前沿企业数据平台属于相邻分析基础设施，但往往依赖混合连接或更宽泛的分析范围，而不是专门的国家网络遥测模型。Dream 的核心架构消除了外国遥测和对云超大规模厂商的依赖，形成了以完整国家技术主权为边界的明确市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >
              评估 Dream Security 的市场机会，必须把不受约束的总体网络安全估算与专业主权国家基础设施预算分开。全球网络安全软件和 AI 市场通常估计每年超过 $200B，但 Dream
              的可服务市场（SAM）严格限于那些要求本地部署、零外国遥测，并需要保护能源、公用事业、医疗保健和国家行政部门免受民族国家对手攻击的主权国防及关键基础设施实体。


              按自下而上的可服务可获得市场（SOM）测算，可触达的客户群受限于约 100 至 150 个有能力为定制国家 AI 部署提供资金的主权国家，以及关键基础设施运营商。按每套国家主权栈每年 $10M 至 $30M
              的预估合同额计算，近期 SOM 对应的年度支出池为 $1.0B 至 $4.5B。商业估计称 Dream 累计客户合同订单超过 $300M、年度经常性收入（ARR）超过
              $100M，但由于信息来自私人披露、二级估值相互冲突（$2.5B 至 $5.0B），且多年期签约承诺缺乏独立验证，第三方市场验证仍然有限。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方细分、预算归属与采购流程
        blocks:
          - type: paragraph
            body: >
              主权 AI
              和国家网络防御基础设施的购买角色，与传统企业的首席信息安全官（CISO）有很大不同。主要经济买方和预算负责人包括国家安全顾问、国防采购机构、国家元首网络部门负责人，以及内政、司法和财政等内阁级部门。次级商业买方包括各类电网、核反应堆、水务机构及油气网络的企业领导层和关键基础设施资产运营商。


              采用路径依赖复杂的政府间采购渠道，而非商业自助服务或数字 GTM 漏斗。商业分析画像显示，初始企业客户的毛收入留存率最高可达 97%；但主权销售流程的特点是客户实现价值周期漫长、平均约 60
              天，需要严格的涉密安全许可，并要针对各国本地语言和法律语料定制模型。管理层的战略关系（包括奥地利前总理 Sebastian Kurz 和 NSO Group 前高管）成为打通欧洲、中东和拉丁美洲市场的主要敲门砖。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 宏观增长催化剂、采用瓶颈与结构性风险
        blocks:
          - type: paragraph
            body: >
              重大地缘政治催化剂正在加快采用速度，尤其是美国出口限制压缩了外国主权实体获得 OpenAI 和 Anthropic
              等前沿基础模型的渠道。这种监管分化迫使非美国盟友政府采购在本地托管的主权模型，以避免战略上依赖外国超大规模云厂商。与此同时，针对政府机构和关键资产的自主 AI
              代理网络攻击活动不断升级，进一步拉动了能够实时绘制网络并压制国家行为体的主动式平台需求。


              但采用也面临严重的结构性约束。严格在专用硬件上运行物理隔离部署（例如 Dream 使用 Blackwell 级基础设施的多 GPU
              部署），会限制快速软件更新和多租户扩展。此外，政府采购周期一向漫长；在专业国防网络之外，未经辅助的品牌认知度仍低；高管背景引发的审视，也会给评估长期厂商锁定的西方民主国家买方带来反复的合规和声誉障碍。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主权 AI 的刚性需求造就隔离型高毛利市场
            body: 美国对 OpenAI、Anthropic 等前沿商业模型实施出口限制，已形成紧迫的主权市场驱动因素。非美国政府不再把物理隔离语言模型仅仅视为软件，而是将其视为国家主权和行政独立所必需的基础性国家基础设施。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 主权 GTM 固有的采购摩擦与客户集中
            body: 主权国防项目能带来较大的年度合同额，却也会造成极高的客户集中度和漫长的采购周期。直接向内阁部门销售需要高频外交关系维护，使收入增速暴露于地缘政治变化和监管许可瓶颈。
            calloutType: risk
            claimRefs:
              - CM010
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：主权国防 AI 与商业安全
        blocks:
          - type: paragraph
            body: >-
              Dream Security 所处的竞争格局在客户范围、部署架构和技术主权上都存在明显分野。传统网络安全厂商把多租户云方案卖给商业企业，而 Dream
              专门面向国家政府、主权部门以及包括核反应堆、电网和水务在内的国家关键基础设施运营商。在企业身份与访问管理领域，市场情报数据库经常把 Okta、CyberArk、AhnLab 和 Raonsecure
              等认证服务商与传统认证企业放在一起比较。然而 Dream Security
              位于民族国家层面，部署物理隔离系统，以抵御俄罗斯、中国和伊朗等外国国家行为体的高级持续性威胁。此外，公开数据服务和股票筛选器经常把这家以色列私人独角兽与 Dream Security Co.,
              Ltd.（KOSDAQ: 203650）混为一谈；后者是 1998 年成立、约有 314B KRW 市值的韩国上市 PKI 与数字认证公司。这种市场混淆遮蔽了 Dream 真正的竞争集合：主权 AI
              平台、政府国防承包商和专业漏洞修复厂商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
      - number: '3.2'
        title: 直接同业、传统国防巨头与主权 AI 竞争者
        blocks:
          - type: paragraph
            body: >-
              评估 Dream 的替代方案，需要考察三个不同的竞争层级：国家数据分析传统厂商、新兴 AI 代理安全初创公司，以及专业攻击路径修复厂商。在主权政府分析领域，Palantir Technologies
              是主要的传统基准，向全球国防和情报机构部署数据整合、监控和运营平台。在专业漏洞评估领域，Zafran、Pantera、XM Cyber 和 SafeBreach 等以色列同业挑战 Dream 的 Hero
              产品；Hero 能自主调查攻击路径并提出暴露面缓解建议。与此同时，代理式 AI 的快速兴起催生了 Tenet Security、Mindgard、Neo 和 Onyx Security
              等早期安全平台，专注于监控和保护自主企业 AI 工作流。Dream 通过一套开箱即用的主权部署，与商业 AI 安全初创公司拉开差异：其 Atlas 模型家族提供 8B 至 80B
              参数的主权语言模型，完全本地部署、零遥测，从而在国际出口限制之后消除对美国超大规模云厂商的主权依赖。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
