  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历程与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              Dream Security 在四年运营历史中保持了惊人的融资速度，从 2022 年 10 月种子轮一路扩张到 2026 年 6 月的 $3.0B 估值。最新一轮 $260M 融资由 Group 11 和
              Bicycle Capital 共同领投，B 轮领投方 Bain Capital Ventures 继续参与，Clal Insurance 和 Aleph 也参与其中。这笔资金接续了 2025 年 2 月以
              $1.1B 估值完成的 $100M B 轮，以及 2025 年 8 月以 $1.3B 估值完成的 $45M 老股交易，十六个月内估值几乎增长三倍。按已记录轮次计算，累计股权融资为 $415M。然而，随着预估
              ARR 近期突破 $100M，当前投后估值意味着约 30 倍 ARR 的激进收入倍数，价格中已经计入完美执行和管线快速转化。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV014
      - number: '8.2'
        title: 投资论点与主权 AI 需求顺风
        blocks:
          - type: paragraph
            body: >-
              Dream Security 的核心投资论点建立在推动主权技术自主的结构性宏观和地缘政治顺风上。当西方出口管制和地缘政治壁垒限制非美国政府获得 Mythos、Fable
              等前沿商业基础模型时，民族国家正优先追求本国运营独立。Dream 通过 Cyber Language Model 和 Atlas
              平台直接回应这一主权要求，提供本地部署、物理隔离、零外国遥测且不依赖超大规模云厂商的部署。反方论点则强调治理和执行摩擦尖锐：联合创始人 Shalev Hulio 曾领导 NSO
              Group，这在欧洲和北约成员国国防采购机构中持续引发声誉敏感性。此外，Dream 日益聚焦自主漏洞发现，正与 Zafran、Pantera 和 SafeBreach
              等专业网络安全老牌厂商直接竞争，可能威胁长期定价权和平台差异化。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 估值情景与下行风险校准
        blocks:
          - type: paragraph
            body: >-
              要按 $3.0B 估值评估 Dream Security，必须把不同商业采用路径拆开做严格情景建模。公司声称自 2024 年末以来累计订单管线接近
              $300M，但公开确认的多年期经常性许可仍然很少。在牛市情景中，Dream 成功把主权 AI 平台落地到超过 15 个国家部门，ARR 在 2027 年末加速达到 $220M，同时维持 25 倍高倍数，带来
              $5.0B 估值。基准情景预计现有管线机会稳步转化，2027 年 ARR 达到 $150M；随着国防增长稳定，倍数压缩至 18 倍
              ARR，股权价值保持不变。熊市情景反映机构采购延迟、公众反对创始人关系和预订增速放缓，ARR 压缩至 $110M、倍数降至 10 倍 ARR，估值下调 60%。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.4'
        title: 建议立场、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              我们给 Dream Security 的建议为 Track，分析置信度中等，风险评级高，并认为当前入场估值昂贵。公司在主权 AI 网络安全领域展现出一流速度和先发优势，但在缺少经审计财务透明度的情况下以 30 倍
              ARR 投入机构资本，风险收益并不对称。从 Track 升至 Buy，必须满足三个尽调门槛：第一，取得经审计的 FY2025 财务报表，确认 GAAP 收入确认以及软件毛利率超过
              70%；第二，对三个已签约主权部门进行保密客户参考访谈；第三，取得正式外部法律确认，厘清跨境国防合规。具体的论点失效触发器包括失去任何一级主权合同、年度预订增长降至 25%
              以下，或目标西方司法辖区实施正式监管采购限制。
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资立场：审计完成前有条件 Track
            body: >-
              我们建议维持 Track 立场，而不是按 Dream Security 当前 $3.0B 估值投入资本。尽管公司在战略上至关重要的领域展现出罕见速度，但在缺少经审计财务和可验证客户合同的情况下支付约 30 倍
              ARR，会造成不对称的下行风险。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV014
          - type: callout
            title: 声誉与采购拖累
            body: 联合创始人 Shalev Hulio 曾任 NSO Group 高管，持续构成采购阻力。尽管 Dream 严格专注防御，欧洲机构级国防买方仍对监控技术相关的公共审查保持敏感，这可能损害长期合同转化。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
          - type: callout
            title: 主权 AI 基础设施作为独立资产类别
            body: Dream 向主权语言模型（Atlas）的战略转向，利用了西方出口禁令对外国访问前沿基础模型的限制。通过部署带有气隙推理的本地集群，Dream 解决了商业云网络安全供应商无法处理的关键国家依赖风险。
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
