  - id: FI001
    title: 公开证据可支持的收入模型桥接
    type: flow
    summary: 证据支持运营顺序，但不支持转化率、合同金额、确认收入或毛利。
    data:
      nodes:
        - id: sovereign-need
          label: 国家主权 AI 需求
          detail: 政府或关键基础设施需求是起始客群。
        - id: bespoke-contract
          label: 定制合同
          detail: 公开定价、计价单位、期限和折扣均不可得。
        - id: custom-model
          label: 定制垂直模型
          detail: Dream 表示模型会按国家背景和价值观调整。
        - id: air-gapped-deployment
          label: 物理隔离部署
          detail: 该技术栈在国家边界内运行，不产生外国遥测。
        - id: reported-top-line
          label: 据报收入
          detail: 第三方报告为 $100M 或以上，但采用不同期间和口径。
        - id: gross-profit-gap
          label: 毛利不可得
          detail: 没有公开成本分配或毛利率数据来闭合桥接。
      edges:
        - from: sovereign-need
          to: bespoke-contract
        - from: bespoke-contract
          to: custom-model
        - from: custom-model
          to: air-gapped-deployment
        - from: air-gapped-deployment
          to: reported-top-line
        - from: reported-top-line
          to: gross-profit-gap
    approximationNotes: 仅为概念流程；未估算价格、转化率、确认收入分配或利润率。
    claimRefs:
      - CI002
      - CI003
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: 已披露的主权产品技术栈
    type: stack
    summary: 对已披露的用户、应用、推理层、数据流和客户控制部署边界进行功能性分层。
    data:
      layers:
        - label: 国家级用户
          detail: 国家元首、各部委、国家网络安全机构和高级官员。
        - label: 主权 AI 应用
          detail: Atlas，一款面向国家的自然语言模型产品。
        - label: 国家级网络安全应用
          detail: Sphere 用于网络防御，Hero 用于漏洞和攻击路径调查。
        - label: 推理层
          detail: 据报道，定制模型参数规模为 8B–80B，并结合机器学习和行为分析。
        - label: 数据层
          detail: 对多种格式的客户数据进行离线摄取和推理。
        - label: 部署边界
          detail: 在本地、物理隔离或客户控制的数据中心运行，Dream 无法访问政府信息。
    approximationNotes: 这是对已披露能力的功能排序，不是经过验证的物理拓扑；接口和控制路径未公开。
