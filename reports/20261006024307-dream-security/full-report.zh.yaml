              声称已在欧洲、中东和亚洲的政府部门及基础设施运营商中进行活跃部署，但公司营销页面没有公开确认任何具体主权客户或公用事业标志。此外，调查报道和行业报道强调了显著的采购摩擦：联合创始人 Shalev Hulio
