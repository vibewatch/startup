chapter:
  number: 5
  title: "Product & Technology"
  summary: "Dream presents a sovereign AI and national cyber-defense stack built for on-premises, air-gapped government deployment. Independent reporting identifies three named products—Sphere, Hero, and Atlas—but the reviewed evidence does not provide independent performance benchmarks, public reliability metrics, detailed integration specifications, or a company-specific developer signal."
sections:
  - id: "product-and-workflow"
    title: "Product Definition and Customer Workflow"
    body: |
      Dream positions its offering as a national capability layer rather than a conventional enterprise point product. The company says the system combines sovereign AI with national cybersecurity, runs inside national borders, and turns fragmented government data into decisions without sending telemetry to Dream or a foreign cloud. In customer-workflow terms, the buyer is a government or national institution, the operating users are senior officials and cyber authorities, and the delivered outcome is a locally controlled environment for cyber investigation and government-specific AI workloads. Those are company descriptions, not independently measured outcomes.

      The named portfolio gives the broad platform claim more concrete boundaries. Globes describes Sphere as the cyber-defense system, Hero as the autonomous vulnerability and attack-route investigation product, and Atlas as the sovereign natural-language-model product for state use. Seedtable independently catalogs the same functional pattern as a national AI platform, an agentic security product, and protection for governments and critical infrastructure. Public materials still do not expose packaging, license boundaries, implementation duration, service-level commitments, or measurable customer benefit, so the workflow table records those items as diligence gaps rather than estimates.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE015"
    tableRefs:
      - "TE002"
  - id: "portfolio-and-maturity"
    title: "Portfolio, Deployment Evidence, and Maturity"
    body: |
      The product set spans two related but distinct missions. Sphere and Hero address national cyber defense: Sphere is reported to identify, investigate, and thwart attacks, while Hero investigates vulnerabilities and attack routes, assesses risk, and recommends fixes. Atlas extends the platform beyond cyber operations into sovereign language models for government functions. This breadth may support a larger strategic contract, but it also creates a diligence need to separate shared platform components from separately deployed products and to establish which modules are generally available, piloted, or roadmap items.

      Deployment evidence is positive but issuer-linked. Investor Tau Capital reports threat-detection and secure-communications deployments across multiple UAE ministries, plus live protection of utilities and smart-city platforms. That supports evidence of field use, but Tau is an investor rather than an independent technical evaluator, and the public account supplies no contract scope, uptime, detection rate, deployment date, or customer-authored validation. Public staffing indicators also diverge: FundedIQ reports a 101–250 employee band, while Dealroom maps 354 employees including 22 AI specialists. The difference prevents a precise assessment of implementation and support capacity.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE001"
  - id: "architecture-and-control-boundary"
    title: "Architecture and Sovereign Control Boundary"
    body: |
      The disclosed architecture centers on local control. Dream says deployments are on-premises and air-gapped, operate without telemetry, ingest data offline in multiple formats, and use models customized to a vertical and national context. Tau Capital adds that the platforms combine machine learning, behavioral analytics, and real-time threat intelligence. These descriptions establish a functional architecture—local data boundary, ingestion, reasoning, and application modules—but not the underlying model design, interfaces, update mechanism, cryptographic controls, or tested throughput.

      Globes provides the most specific operating detail. It reports that government customers train models in their own cloud and operate them from their data centers, while Dream does not access their information. It also reports model sizes from 8 billion to 80 billion parameters and a Dream footprint at MegaDC in Modi'in using 250 kilowatts and hundreds of Blackwell 200 GPUs. The source does not establish which workloads run at MegaDC versus customer sites, how model updates cross an air gap, or what hardware each customer must supply. The architecture exhibit therefore separates disclosed components from unresolved dependencies rather than presenting an inferred implementation blueprint.
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "differentiation-and-diligence"
    title: "Differentiation, Trust, and Technical Diligence"
    body: |
      Dream's clearest disclosed differentiation is architectural sovereignty: local operation, no telemetry, no foreign control, and models adjusted to a government's context. The combination of national cyber applications and sovereign language models is also broader than a single security category. These attributes may matter for governments that prioritize jurisdictional control and disconnected operation, but the reviewed evidence does not quantify detection quality, false positives, model accuracy, latency, availability, or total deployment effort. Marketing claims such as minimal friction and zero integration setup should therefore remain unverified until supported by customer-authored evidence and technical testing.

      Trust evidence is similarly incomplete. The public architecture describes where data remains and who operates the models, but it does not disclose certifications, independent audits, secure-update procedures, vulnerability disclosure practices, incident history, or privacy and retention controls. No relevant company-specific repository, package, practitioner forum, engineering talk, or other developer-signal proxy appears in the assigned evidence pool. Underwriting should require an architecture review, red-team results, model evaluations, service and support records, and at least two reference calls covering production deployment. Until then, the product appears differentiated in deployment model but unverified in comparative performance and operating reliability.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE012"
      - "CE013"
