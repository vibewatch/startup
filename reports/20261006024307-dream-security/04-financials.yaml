company:
  name: "Dream Security"
chapter:
  number: 4
  title: "Financials"
  summary: "Public records indicate meaningful financing and more than $100M of reported revenue or revenue run rate, but they do not establish audited revenue, ARR, gross margin, cash burn, or runway. Conflicting funding totals, headcount estimates, and revenue denominators make the financial case directional rather than underwriteable."
sections:
  - id: "revenue-quality-and-monetization"
    title: "Revenue Quality and Monetization"
    body: >-
      The public top line is material but not cleanly defined. Multiples records
      $100M as of August 2025, while Startup Nation Central describes a revenue
      run rate above $100M in June 2026. Multiples explicitly warns that its
      round-linked fields may represent revenue or ARR and may use run-rate or
      LTM periods, so these observations cannot be treated as audited revenue,
      ARR, or a comparable growth series. Dream's own site describes a turnkey,
      custom, on-premises and air-gapped platform but publishes no list price,
      billing unit, discount policy, or revenue-recognition method. The
      defensible conclusion is a bespoke sovereign-contract model whose
      recurring software, implementation, and service mix remains unknown.
    claimRefs:
      - "CI002"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: >-
      Delivery architecture points to cost intensity that a simple SaaS label
      would obscure. Dream says deployments remain inside national borders,
      operate without foreign telemetry, and use models customized by vertical.
      Those features plausibly require implementation, model adaptation,
      support, and security-cleared personnel, but no reviewed source quantifies
      those costs or separates them from product expense. Public workforce
      signals also conflict: Startup Nation Central lists 235 employees, while
      Dealroom maps 354. Neither figure is payroll expense. Gross margin, CAC,
      payback, sales cycle, net retention, working capital, capex, and service
      delivery costs remain undisclosed, preventing a reliable margin bridge or
      efficiency benchmark.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy"
    title: "Capital Adequacy and Financing Dependency"
    body: >-
      The June 2026 financing signal is comparatively well corroborated:
      multiple independent profiles report a $260M round at a $3B valuation.
      Aggregate funding is not reconciled, however. FundedIQ reports $360M
      across two rounds, Startup Nation Central reports $415M across five, and
      Multiples reports $414M across four rounds plus a secondary transaction.
      These differences may reflect scope and treatment of secondary sales, but
      the sources do not resolve them. More importantly, funding raised is not
      cash available. No reviewed source provides current cash, monthly burn,
      runway, debt, covenants, or committed project-finance obligations, so the
      fresh round supports financing access but does not prove capital adequacy.
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
  - id: "financial-verdict"
    title: "Financial Verdict and Diligence Blockers"
    body: >-
      Revenue quality is not yet underwriteable. Public evidence supports a
      large sovereign opportunity and substantial reported top-line scale, but
      it does not show how much is recurring software, implementation revenue,
      backlog, or contract value. The custom deployment model could create
      defensible relationships and high switching costs, yet it could also
      carry material labor and acceptance risk; no margin data distinguishes
      those outcomes. The $260M round lowers near-term financing risk only if
      proceeds remain available and obligations are limited, neither of which
      is public. Investment diligence should therefore require audited
      statements, contract-level revenue recognition, a recurring-versus-
      services bridge, customer cohorts, and a cash-to-runway schedule before
      assigning SaaS economics or valuing the reported run rate.
    claimRefs:
      - "CI004"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
