        - label: 'October 2022: Corporate Inception & Seed Round'
          detail: Dream Security founded in Tel Aviv by Shalev Hulio and Gil Dolev; closes $20M Seed round led by Group 11.
        - label: 'November 2023: Series A Financing'
          detail: Raises $35M Series A round led by Aleph and Group 11 to accelerate sovereign AI cyber R&D.
        - label: 'February 2025: Series B & Unicorn Status'
          detail: >-
            Secures $100M Series B round led by Bain Capital Ventures at a $1.1B valuation to build the Cyber Language
            Model.
        - label: 'August 2025: Secondary Liquidity Financing'
          detail: Completes $45M secondary transaction at $1.3B valuation backed by Group 11, Tru Arrow, and Tau Capital.
        - label: 'Late 2024 - Early 2026: Commercial Expansion'
          detail: Accumulates $300M in reported government order bookings across Sphere and Hero cyber platforms.
        - label: 'June 2026: Series C Financing at $3B Valuation'
          detail: Raises $260M Series C led by Group 11 and Bicycle Capital at a $3.0B valuation, crossing $100M in ARR.
        - label: 'July 2026: Latin America Geographic Expansion'
          detail: Initiates formal commercial and market expansion into Latin America sovereign defense institutions.
        - label: 'September 2026: Hercules Model Release'
