      - number: '5.4'
        title: Differentiation, Trust, and Technical Diligence
        blocks:
          - type: paragraph
            body: >
              Dream's clearest disclosed differentiation is architectural sovereignty: local operation, no telemetry, no
              foreign control, and models adjusted to a government's context. The combination of national cyber
              applications and sovereign language models is also broader than a single security category. These
              attributes may matter for governments that prioritize jurisdictional control and disconnected operation,
              but the reviewed evidence does not quantify detection quality, false positives, model accuracy, latency,
              availability, or total deployment effort. Marketing claims such as minimal friction and zero integration
              setup should therefore remain unverified until supported by customer-authored evidence and technical
              testing.


              Trust evidence is similarly incomplete. The public architecture describes where data remains and who
              operates the models, but it does not disclose certifications, independent audits, secure-update
              procedures, vulnerability disclosure practices, incident history, or privacy and retention controls. No
              relevant company-specific repository, package, practitioner forum, engineering talk, or other
              developer-signal proxy appears in the assigned evidence pool. Underwriting should require an architecture
              review, red-team results, model evaluations, service and support records, and at least two reference calls
              covering production deployment. Until then, the product appears differentiated in deployment model but
              unverified in comparative performance and operating reliability.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Dream Security stratifies its commercial customer base into three primary sovereign and quasi-sovereign
              tiers: national security agencies and defense ministries, critical national infrastructure operators, and
              civilian government ministries. The primary economic buyer is typically a national security adviser,
              interior minister, or defense procurement authority seeking full technological sovereignty and zero
              foreign cloud telemetry. Unlike enterprise SaaS security platforms that deploy via multi-tenant public
              cloud infrastructure, Dream mandates an entirely on-premises, air-gapped delivery architecture where
              government clients retain total physical and operational ownership over every model layer. Operating
              across Europe, the Middle East, Asia, and expanding into Latin America, Dream packages its cyber defense
              offerings to shield water utilities, power grids, nuclear facilities, and energy pipelines against
              advanced nation-state attacks while ensuring no data escapes sovereign national borders.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
