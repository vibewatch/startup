chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Sovereign Mandate
        blocks:
          - type: paragraph
            body: >-
              Dream Security (registered legally in Israel as corporation 516642246 under Dream Group) was founded
              between late 2022 and early 2023 with headquarters in Tel Aviv-Yafo, Israel. Rather than competing as an
              enterprise endpoint or niche vulnerability scanner, Dream positions its platform exclusively as a national
              capability layer for technological sovereignty and critical infrastructure cyber defense. The company
              engineers on-premises and air-gapped systems intended to process government data entirely within sovereign
              borders without telemetry leakage or dependence on foreign hyperscalers. Its business model relies on
              large-scale government procurement across intelligence, defense, and civilian ministries, delivering
              custom vertical model architectures trained in client-controlled data centers while Dream operates
              secondary computing clusters including dedicated capacity in Modi'in, Israel.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
