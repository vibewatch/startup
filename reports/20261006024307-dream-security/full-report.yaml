      - number: '4.2'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Delivery architecture points to cost intensity that a simple SaaS label would obscure. Dream says
              deployments remain inside national borders, operate without foreign telemetry, and use models customized
              by vertical. Those features plausibly require implementation, model adaptation, support, and
              security-cleared personnel, but no reviewed source quantifies those costs or separates them from product
              expense. Public workforce signals also conflict: Startup Nation Central lists 235 employees, while
              Dealroom maps 354. Neither figure is payroll expense. Gross margin, CAC, payback, sales cycle, net
              retention, working capital, capex, and service delivery costs remain undisclosed, preventing a reliable
              margin bridge or efficiency benchmark.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing signal is comparatively well corroborated: multiple independent profiles report a
              $260M round at a $3B valuation. Aggregate funding is not reconciled, however. FundedIQ reports $360M
              across two rounds, Startup Nation Central reports $415M across five, and Multiples reports $414M across
              four rounds plus a secondary transaction. These differences may reflect scope and treatment of secondary
              sales, but the sources do not resolve them. More importantly, funding raised is not cash available. No
              reviewed source provides current cash, monthly burn, runway, debt, covenants, or committed project-finance
              obligations, so the fresh round supports financing access but does not prove capital adequacy.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI007
      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is not yet underwriteable. Public evidence supports a large sovereign opportunity and
              substantial reported top-line scale, but it does not show how much is recurring software, implementation
              revenue, backlog, or contract value. The custom deployment model could create defensible relationships and
              high switching costs, yet it could also carry material labor and acceptance risk; no margin data
              distinguishes those outcomes. The $260M round lowers near-term financing risk only if proceeds remain
              available and obligations are limited, neither of which is public. Investment diligence should therefore
              require audited statements, contract-level revenue recognition, a recurring-versus- services bridge,
              customer cohorts, and a cash-to-runway schedule before assigning SaaS economics or valuing the reported
              run rate.
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not liquidity
            body: >-
              The reported $260M round demonstrates financing access, but public funding totals conflict and no reviewed
              source discloses cash on hand, burn, debt, restricted cash, or runway.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: callout
            title: Require an accounting bridge
            body: >-
              Do not underwrite the reported $100M-plus top line as ARR or audited revenue until management reconciles
              revenue, ARR, run rate, backlog, TCV, services, and recognition periods.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              Dream positions its offering as a national capability layer rather than a conventional enterprise point
              product. The company says the system combines sovereign AI with national cybersecurity, runs inside
              national borders, and turns fragmented government data into decisions without sending telemetry to Dream
              or a foreign cloud. In customer-workflow terms, the buyer is a government or national institution, the
              operating users are senior officials and cyber authorities, and the delivered outcome is a locally
              controlled environment for cyber investigation and government-specific AI workloads. Those are company
              descriptions, not independently measured outcomes.


              The named portfolio gives the broad platform claim more concrete boundaries. Globes describes Sphere as
              the cyber-defense system, Hero as the autonomous vulnerability and attack-route investigation product, and
              Atlas as the sovereign natural-language-model product for state use. Seedtable independently catalogs the
              same functional pattern as a national AI platform, an agentic security product, and protection for
              governments and critical infrastructure. Public materials still do not expose packaging, license
              boundaries, implementation duration, service-level commitments, or measurable customer benefit, so the
              workflow table records those items as diligence gaps rather than estimates.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
              - CE015
      - number: '5.2'
        title: Portfolio, Deployment Evidence, and Maturity
        blocks:
          - type: paragraph
            body: >
              The product set spans two related but distinct missions. Sphere and Hero address national cyber defense:
              Sphere is reported to identify, investigate, and thwart attacks, while Hero investigates vulnerabilities
              and attack routes, assesses risk, and recommends fixes. Atlas extends the platform beyond cyber operations
              into sovereign language models for government functions. This breadth may support a larger strategic
              contract, but it also creates a diligence need to separate shared platform components from separately
              deployed products and to establish which modules are generally available, piloted, or roadmap items.


              Deployment evidence is positive but issuer-linked. Investor Tau Capital reports threat-detection and
              secure-communications deployments across multiple UAE ministries, plus live protection of utilities and
              smart-city platforms. That supports evidence of field use, but Tau is an investor rather than an
              independent technical evaluator, and the public account supplies no contract scope, uptime, detection
              rate, deployment date, or customer-authored validation. Public staffing indicators also diverge: FundedIQ
              reports a 101–250 employee band, while Dealroom maps 354 employees including 22 AI specialists. The
              difference prevents a precise assessment of implementation and support capacity.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE010
              - CE011
              - CE013
      - number: '5.3'
        title: Architecture and Sovereign Control Boundary
        blocks:
          - type: paragraph
            body: >
              The disclosed architecture centers on local control. Dream says deployments are on-premises and
              air-gapped, operate without telemetry, ingest data offline in multiple formats, and use models customized
              to a vertical and national context. Tau Capital adds that the platforms combine machine learning,
              behavioral analytics, and real-time threat intelligence. These descriptions establish a functional
              architecture—local data boundary, ingestion, reasoning, and application modules—but not the underlying
              model design, interfaces, update mechanism, cryptographic controls, or tested throughput.


              Globes provides the most specific operating detail. It reports that government customers train models in
              their own cloud and operate them from their data centers, while Dream does not access their information.
              It also reports model sizes from 8 billion to 80 billion parameters and a Dream footprint at MegaDC in
              Modi'in using 250 kilowatts and hundreds of Blackwell 200 GPUs. The source does not establish which
              workloads run at MegaDC versus customer sites, how model updates cross an air gap, or what hardware each
              customer must supply. The architecture exhibit therefore separates disclosed components from unresolved
              dependencies rather than presenting an inferred implementation blueprint.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
