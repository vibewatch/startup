              - CO013
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              The company was established by Chief Executive Officer Shalev Hulio (former co-founder and CEO of spyware
              vendor NSO Group), President Sebastian Kurz (former Chancellor of Austria), and Chief Technology Officer
              Gil Dolev. This founding coalition creates an unusual blend of offensive/defensive technical cyber
              tradecraft and elite geopolitical diplomatic access. Functional executive leadership includes Chief
              Business and Strategy Officer Amir Becker, Chief Legal and Corporate Development Officer Ilan Grinshtain,
              and Chief of Staff Amit Amrami. While the pedigree unlocks bilateral access to heads of state and
              ministerial procurement teams across Europe and the Middle East, it also concentrates severe key-person
              and headline risk around Hulio's past association with offensive cyber surveillance and international
              litigation.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO014
