              - CU003
              - CU005
              - CU011
      - number: '6.2'
        title: Commercial Velocity and Contract Value Trajectory
        blocks:
          - type: paragraph
            body: >-
              Commercial operations initiated in late 2024, followed by rapid top-line expansion supported by large
              government commitments. Company announcements in June 2026 stated that Dream has secured nearly $300
              million in cumulative total contract value across its national cybersecurity and sovereign AI deployments.
              Independent financial tracking reports that the company generated $40 million in revenue during 2025
              following a $1.1 billion valuation milestone in February 2025, culminating in a $260 million Series C
              financing round at a $3.0 billion valuation in mid-2026. Despite headline booking figures, contract
              duration, annual recurring revenue run rate, and cash collection milestones remain undisclosed. The lack
              of standard revenue recognition details conceals whether contract totals represent multi-year sovereign
              master service agreements or recognized software licenses.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named Customer Proof, Retention Dynamics, and Concentration Headwinds
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer deployments are constrained by sovereign non-disclosure agreements,
              classified national procurement protocols, and heightened reputational sensitivity surrounding executive
              leadership. While Dream claims active deployments across ministries and infrastructure operators in
              Europe, the Middle East, and Asia, zero individual sovereign clients or utility logos are publicly
              acknowledged on company marketing surfaces. Furthermore, investigative reporting and industry coverage
              highlight substantial procurement friction: co-founder Shalev Hulio's past leadership of NSO Group and the
              associated Pegasus spyware scrutiny create persistent reputational hurdles among Western European
              procurement committees. Net revenue retention, gross revenue retention, and pilot-to-production conversion
              rates remain completely unreleased, creating acute concentration risk where losing a small number of
              sovereign counterparties would materially destabilize commercial revenue.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Contract Opacity and Founder Reputational Friction
            body: >-
              Dream Security's customer proof rests entirely on un-itemized sovereign contract figures without named
              referenceable clients. In democratic and Western European jurisdictions, historical controversy associated
              with NSO Group's Pegasus surveillance creates significant vetting friction for defense procurement
              committees, exacerbating customer concentration across a narrow cohort of sovereign buyers.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU014
          - type: callout
            title: Air-Gapped Delivery Model Creates High Switching Barriers
            body: >-
              Deploying proprietary AI models and detection infrastructure directly within air-gapped sovereign
              environments creates extreme vendor lock-in. Once a government embeds Dream's national data reasoning
              layer into classified workflows, rip-and-replace friction is formidable, granting substantial structural
              durability provided political alliances remain stable.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU004
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Evidence Boundary
        blocks:
          - type: paragraph
            body: >-
              Dream Security sells into governments and national infrastructure, where a failed deployment, procurement
              interruption, or assurance deficiency can have unusually high consequences. The public evidence supports
              six ranked diligence themes: sovereign procurement and legal review; customer-segment concentration;
              customer-controlled deployment assurance; compute and facility concentration; financial and operating-data
              opacity; and entity-resolution errors caused by an unrelated Korean company with the same name. These are
              residual-risk assessments, not findings that a breach, enforcement action, license failure, or customer
              loss has occurred. The assigned pool contains no target-specific regulator decision, court record, audited
              financial statement, incident postmortem, service-level history, or contract roster. Accordingly, the
              heatmap uses qualitative likelihood and impact bands and makes evidence closure, not intuition, the gating
              mechanism for an investment decision.
            claimRefs:
              - CR003
              - CR004
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory, Legal, and Governance Exposure
        blocks:
          - type: paragraph
            body: >-
              Dream's website says deployments remain within national borders, with no telemetry or foreign control.
              That architecture could reduce cross-border data-transfer and hyperscaler dependency concerns, but it does
              not establish compliance with any customer's privacy, export-control, defense-procurement, or
              AI-governance regime. Globes identifies co-founder Shalev Hulio as a former NSO Group chief executive and
              Sebastian Kurz as a former Austrian chancellor; the assigned evidence does not contain a court or
              regulator record establishing current liability for either founder. Founder screening and procurement
              eligibility should therefore be verified rather than characterized as an active legal case. A separate
              Korean issuer and interview subject named Dream Security also create a material research-control risk:
              filings or operating facts can be misattributed unless legal entity identifiers, jurisdiction, and website
              are checked source by source.
            claimRefs:
              - CR001
              - CR002
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR015
      - number: '7.3'
        title: Operational Security, Reliability, and Assurance
        blocks:
          - type: paragraph
            body: >-
              The on-premises and air-gapped model reduces foreign-cloud reliance but shifts substantial operational
              responsibility into each sovereign customer's environment. Public materials in the assigned pool do not
              disclose independent penetration tests, certifications, availability history, recovery objectives, patch
              responsibilities, or false-positive performance, so the effectiveness of that operating model remains a
              diligence question. Industrial Cyber reported a critical GNU Inetutils telnetd vulnerability disclosed by
              Dream Security Labs and explicitly said there was no confirmed active exploitation at publication. The
              affected component is third-party software, not evidence of a vulnerability or incident in Dream's own
              platform; it is relevant only as an illustration of the legacy infrastructure conditions that national and
              industrial buyers may operate. Deployment controls, support boundaries, and incident evidence must be
              tested directly.
            claimRefs:
              - CR001
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR014
      - number: '7.4'
        title: Dependencies, Financial Opacity, and Scaling Risk
        blocks:
          - type: paragraph
            body: >-
              Globes reports that Dream serves governments and national infrastructure and that its customer count is
              limited, which makes procurement timing and individual sovereign relationships potentially important even
              though the source does not disclose a concentration denominator. The same report places hundreds of
              Blackwell 200 GPUs in a 250-kilowatt MegaDC footprint in Modi'in, indicating a reported facility and
              advanced-compute dependency without proving that this is Dream's only capacity. Public data vendors also
              disagree on workforce and funding: employee measures range from a 101-250 band to 235 and 354, while
              recorded funding totals range from $360 million across two rounds to $415 million across five rounds.
              Those values may differ by date and methodology; they should not be converted into burn, runway, cash
              available, or audited headcount. Investment underwriting requires reconciled cap-table, cash, contract,
              and workforce schedules.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Absence of an incident record is not evidence of incident-free operation
            body: >-
              The assigned pool contains a report about a vulnerability in third-party GNU software but no Dream
              platform postmortem or complete incident history. Confirm security outcomes through customer references,
              independent tests, and incident logs rather than inferring safety from public silence.
            calloutType: risk
            claimRefs:
              - CR014
              - CR016
          - type: callout
            title: Gate investment on evidence closure
            body: >-
              Require legal and procurement screening, contract-level concentration, audited cash and operating metrics,
              deployment assurance, and resilience evidence before assigning a lower residual risk rating.
            calloutType: recommendation
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Current Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Dream Security has sustained remarkable fundraising velocity across its four-year operating history,
              scaling from its October 2022 seed round to a $3.0 billion valuation in June 2026. The latest $260 million
              financing was co-led by Group 11 and Bicycle Capital, with continued participation from Series B lead
              investor Bain Capital Ventures, alongside Clal Insurance and Aleph. This capital infusion follows a
              February 2025 Series B round of $100 million at a $1.1 billion valuation and an interim August 2025
              secondary transaction of $45 million at a $1.3 billion valuation, reflecting an almost three-fold
              valuation escalation over sixteen months. Total cumulative equity capital secured across recorded rounds
              stands at $415 million. However, with estimated annual recurring revenue recently crossing $100 million,
              the current post-money valuation implies an aggressive revenue multiple of approximately 30x ARR, pricing
              in flawless execution and rapid pipeline conversion.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV014
      - number: '8.2'
        title: Investment Thesis and Sovereign AI Demand Tailwinds
        blocks:
          - type: paragraph
            body: >-
              The central investment thesis for Dream Security rests on structural macroeconomic and geopolitical
              tailwinds driving sovereign technology autonomy. As Western export controls and geopolitical barriers
              restrict non-US governmental access to cutting-edge commercial foundation models such as Mythos and Fable,
              nation-states are prioritizing domestic operational independence. Dream addresses this sovereign mandate
              directly with its Cyber Language Model and Atlas platform, offering on-premises, air-gapped deployments
              with zero foreign telemetry or hyperscaler dependency. Conversely, the anti-thesis highlights acute
              governance and execution frictions. Co-founder Shalev Hulio’s prior leadership of NSO Group generates
              persistent reputational sensitivity among European and NATO-aligned defense procurement bodies.
              Furthermore, Dream’s expanding focus on autonomous vulnerability discovery places it in direct rivalry
              with specialized cyber incumbents including Zafran, Pantera, and SafeBreach, threatening long-term pricing
              power and platform differentiation.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Valuation Scenarios and Downside Risk Calibration
        blocks:
          - type: paragraph
            body: >-
              Underwriting Dream Security at a $3.0 billion valuation requires rigorous scenario modeling across
              distinct commercial adoption paths. The company claims an accumulated order pipeline approaching $300
              million since late 2024, yet public confirmation of signed multi-year recurring licenses remains scarce.
              In our bull-case scenario, Dream successfully operationalizes its sovereign AI platform across more than
              fifteen national ministries, accelerating ARR to $220 million by late 2027 while maintaining an elevated
              25x multiple to deliver a $5.0 billion valuation. The base-case scenario projects steady conversion of
              existing pipeline opportunities to yield $150 million in 2027 ARR, offset by multiple compression to 18x
              ARR as defense growth stabilizes, resulting in flat equity value. The bear-case scenario reflects
              institutional procurement delays, public pushback against founder affiliations, and decelerating bookings,
              compressing ARR to $110 million and multiples to 10x ARR for a 60% valuation markdown.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation Stance, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              We assign Dream Security a Track recommendation with medium analytical confidence and a high risk rating,
              characterizing the prevailing entry valuation as expensive. While the company exhibits premier velocity
              and first-mover positioning within the sovereign AI cybersecurity domain, committing institutional capital
              at 30x ARR without audited financial transparency presents an unfavorable risk-reward asymmetry.
              Institutional progression from Track to Buy requires satisfying three mandatory diligence hurdles: first,
              receiving audited FY2025 financial statements confirming GAAP revenue recognition and software gross
              margins above 70%; second, conducting confidential reference interviews across three signed sovereign
              ministries; and third, obtaining formal external legal confirmation clarifying cross-border defense
              compliance. Tangible thesis-break triggers include the loss of any tier-one sovereign contract,
              deceleration of annual bookings growth below 25%, or formal regulatory procurement restrictions in target
              Western jurisdictions.
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Conditional Track Pending Audit'
            body: >-
              We recommend maintaining a Track stance rather than committing capital to Dream Security at its current
              $3.0 billion valuation. Although the company exhibits rare velocity in a strategically vital domain,
              paying ~30x ARR in the absence of audited financials and verifiable customer contracts creates an
              asymmetrical downside profile.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV014
          - type: callout
            title: Reputational and Procurement Overhang
            body: >-
              Co-founder Shalev Hulio’s prior tenure at NSO Group represents a persistent procurement headwind. Despite
              Dream’s strictly defensive focus, institutional defense buyers in Europe remain sensitive to public
              scrutiny regarding surveillance technologies, which could impair long-term contract conversion.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
          - type: callout
            title: Sovereign AI Infrastructure as a Distinct Asset Class
            body: >-
              Dream’s strategic pivot toward sovereign language models (Atlas) capitalizes on Western export bans that
              restrict foreign access to frontier foundation models. By deploying on-premises clusters with air-gapped
              inference, Dream solves a critical national dependency risk that commercial cloud cybersecurity vendors
              cannot address.
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
