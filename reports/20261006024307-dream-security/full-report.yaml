      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Commercial Scale
        blocks:
          - type: paragraph
            body: >-
              Dream Security has executed an aggressive financing schedule, completing a major capital round in nearly
              every year of operation. Following an initial $20 million Seed round in October 2022 and a $35 million
              Series A round in November 2023, Dream secured a $100 million Series B round in February 2025 led by Bain
              Capital Ventures at a $1.1 billion valuation, followed by a $45 million secondary transaction in August
              2025 at $1.3 billion. In June 2026, Dream closed a $260 million Series C financing round led by Group 11
              with participation from Bicycle Capital, Bain Capital Ventures, Aleph, Tru Arrow Partners, and Clal
              Insurance, bringing post-money valuation to $3.0 billion and cumulative institutional funding to $415
              million. Commercially, the company claims $300 million in accumulated customer orders since launching
              late-2024 operations, with industry estimates confirming that ARR recently surpassed $100 million across
              an estimated 200 to 500 employees.
