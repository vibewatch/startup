evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-burn
    missingEvidence: Audited financial statements confirming FY2025 revenue recognition, cash burn rate, and gross margin profile.
    whyItMatters: >-
      Reported $100M ARR and $300M order backlog are unaudited company claims and journalist estimates that cannot be
      reconciled without formal disclosures.
    diligencePath: >-
      Request audited financial statements, revenue recognition schedules, and banking verification during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: sovereign-customer-census
    missingEvidence: Complete list of signed sovereign and national critical infrastructure customer contracts.
    whyItMatters: >-
      National security confidentiality prevents independent verification of client identities, churn, and contract
      renewal terms.
    diligencePath: Seek classified customer references or anonymized sovereign cohort retention data under strict NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table-coverage
    missingEvidence: Full unredacted executive team census and employment agreements for secondary VP-tier executives.
    whyItMatters: >-
      Partial coverage in TO002 reflects senior founders and chief officers; departmental VPs are only partially
      disclosed in public intelligence registries.
    diligencePath: Review full management census and organizational charts during confirmatory management meetings.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: cap-table-ownership-percentages
    missingEvidence: >-
      Fully diluted cap table schedule detailing exact equity stakes, option pools, and liquidation preferences across
      seed and growth rounds.
    whyItMatters: Public sources identify investors by entry round but omit ownership percentages and governance covenants.
    diligencePath: Inspect latest Articles of Association and investors' rights agreements in data room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: contract-backlog
    missingEvidence: >-
      Audited customer contract breakdown and signed multi-year commitment schedules across sovereign government
      clients.
    whyItMatters: >-
      Reported $300M in accumulated orders cannot be reconciled against recurring revenue velocity without contract
      duration and cancellation terms.
    diligencePath: >-
      Obtain audited FY2025/FY2026 revenue recognition disclosures or certified customer contract schedule under NDA
      during confirmatory diligence.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: sovereign-tam-methodology
    missingEvidence: >-
      Independent third-party market study isolating dedicated sovereign AI defense budgets across non-US allied
      nations.
    whyItMatters: >-
      Current market estimates extrapolate from general defense IT spending rather than distinct sovereign LLM
      allocations.
    diligencePath: Review classified defense IT expenditure benchmarks and NATO allied intelligence procurement registries.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sovereign-contract-pricing
    missingEvidence: >-
      Itemized sovereign contract pricing schedules, discount tiers, and maintenance fee structures across signed
      European and Middle Eastern defense accounts.
    whyItMatters: >-
      Without verified contract documentation, realized software subscription pricing cannot be distinguished from
      bespoke installation and data-center enablement fees.
    diligencePath: >-
      Request unredacted customer schedule exhibits or third-party audit reports from lead investors Bain Capital
      Ventures or Group 11.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: independent-threat-benchmarks
    missingEvidence: >-
      Independent comparative efficacy benchmarks evaluating Dream's Sphere and Hero platforms directly against
      competitive threat-hunting tools like Palantir or SafeBreach.
    whyItMatters: >-
      Threat mitigation effectiveness and false-positive rates are currently supported solely by vendor representations
      and media reports.
    diligencePath: Commission classified or red-team evaluations from allied government cybersecurity test facilities.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: conflicting-data
    severity: material
    topic: revenue-denominator
    missingEvidence: >-
      Audited period revenue plus a management bridge among revenue, ARR, run rate, backlog, total contract value, and
      services.
    whyItMatters: The public values use different labels and periods, so growth and revenue quality cannot be calculated.
    diligencePath: Reconcile audited statements to contract-level bookings, billings, deferred revenue, and recognized revenue.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: >-
      Sales-cycle duration, stage conversion, CAC, payback, partner economics, and procurement costs by sovereign
      cohort.
    whyItMatters: Without cohort economics, the capital needed to win and deploy each government account is unknown.
    diligencePath: Obtain CRM stage history and sales-and-marketing cost allocations for signed and lost opportunities.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: >-
      Gross margin, cost of revenue, service-delivery labor, net retention, working capital, and capex by product and
      contract.
    whyItMatters: These inputs determine whether the custom sovereign model can produce software-like margins.
    diligencePath: Review audited income statements, COGS allocations, payroll mapping, customer cohorts, and capex schedules.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, debt, covenants, project obligations, and board-approved operating
      plan.
    whyItMatters: A financing announcement does not establish usable cash or runway.
    diligencePath: Obtain the latest balance sheet, bank statements, debt schedule, cash forecast, and financing use-of-proceeds.
    relatedQuestionRefs:
      - QI007
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated employee and contractor roster reconciling 235 employees with Dealroom's mapped count of 354.
    whyItMatters: Workforce size is a rough cost-base proxy, but the conflicting estimates cannot support payroll assumptions.
    diligencePath: Review HRIS headcount by location, function, employment status, and month.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A company-specific public repository, package, engineering talk, practitioner discussion, or integration-partner
      technical post that demonstrates product usability or engineering maturity.
    whyItMatters: >-
      The assigned evidence pool contains no relevant developer or practitioner signal, leaving implementation quality
      and operator experience uncorroborated.
    diligencePath: >-
      Request a technical integration partner reference and customer-operator session, then review repository, release,
      support, and issue-resolution evidence under NDA.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Independent benchmarks for detection accuracy, false positives, latency, model quality, adversarial robustness,
      availability, and deployment effort.
    whyItMatters: >-
      The public materials describe capabilities and deployments but do not establish comparative product performance or
      operational reliability.
    diligencePath: >-
      Obtain red-team results, model evaluations, production SLA records, incident history, and two customer-authored
      reference reports.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Certifications, independent security audits, privacy and retention controls, vulnerability disclosure process,
      secure-update design, and air-gap maintenance procedures.
    whyItMatters: >-
      Local deployment reduces external data exposure but does not by itself validate product security, compliance,
      recoverability, or safe maintenance.
    diligencePath: >-
      Review the security architecture, certification reports, audit scope, software bill of materials, update signing
      process, and disaster-recovery runbooks.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and cohort renewal figures across sovereign
      client accounts.
    whyItMatters: >-
      Without retention data, investors cannot verify whether early commercial bookings represent recurring long-term
      revenue or one-off pilot deployments.
    diligencePath: >-
      Request confidential historical cohort retention tables and multi-year contract renewal documentation during
      management diligence.
    relatedQuestionRefs:
      - QU004
