callouts:
  - calloutType: recommendation
    title: 'Investment Stance: Conditional Track Pending Audit'
    body: We recommend maintaining a Track stance rather than committing capital to Dream Security at its current $3.0 billion valuation. Although the company exhibits rare velocity in a strategically vital domain, paying ~30x ARR in the absence of audited financials and verifiable customer contracts creates an asymmetrical downside profile.
    claimRefs:
      - CV001
      - CV007
      - CV014
  - calloutType: risk
    title: Reputational and Procurement Overhang
    body: Co-founder Shalev Hulio’s prior tenure at NSO Group represents a persistent procurement headwind. Despite Dream’s strictly defensive focus, institutional defense buyers in Europe remain sensitive to public scrutiny regarding surveillance technologies, which could impair long-term contract conversion.
    claimRefs:
      - CV010
      - CV011
  - calloutType: insight
    title: Sovereign AI Infrastructure as a Distinct Asset Class
    body: Dream’s strategic pivot toward sovereign language models (Atlas) capitalizes on Western export bans that restrict foreign access to frontier foundation models. By deploying on-premises clusters with air-gapped inference, Dream solves a critical national dependency risk that commercial cloud cybersecurity vendors cannot address.
    claimRefs:
      - CV008
      - CV009
