  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Weight
      - Core Operating Assumptions
      - Implied 2027 Valuation Range
      - Key Downside Trigger
    rows:
      - - Bull Case
        - 25%
        - Atlas adopted across 15+ sovereign clients; ARR expands to $220M by late 2027; multiple remains strong at 25x ARR
        - $5.0B - $5.5B (1.7x - 1.8x return)
        - Prolonged government procurement and security certification cycles delaying deployments
      - - Base Case
        - 50%
        - Steady conversion of $300M pipeline; ARR grows to $150M in 2027; multiple compresses to sustainable 18x ARR level
        - $2.5B - $3.0B (0.8x - 1.0x return)
        - Margin compression resulting from extensive on-premises hardware and GPU deployment services
      - - Bear Case
        - 25%
        - Procurement friction limits signed governments to under 12; ARR plateaus at $110M; multiple contracts to 10x ARR
        - $1.0B - $1.2B (0.3x - 0.4x return)
        - Formal European regulatory inquiry or foreign intelligence scrutiny impeding international sales
    notes: Eighteen-month forward valuation modeling evaluating ARR expansion trajectories against multiple compression risks.
