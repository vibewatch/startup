companyProfile:
  summary: >-
    Dream Security is an Israeli sovereign AI and national cybersecurity company that sells on-premises, air-gapped
    systems for governments and critical infrastructure operators. Its platform combines cyber-defense products such as
    Sphere and Hero with the Atlas sovereign language-model layer, positioning the company as a national capability
    provider rather than a generic enterprise security vendor. The business has attracted substantial capital and claims
    >$100M ARR, but the public record still leaves revenue quality, customer concentration, and operating performance
    only partly verified.
