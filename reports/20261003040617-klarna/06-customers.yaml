chapter:
  number: 6
  title: "Customers"
  summary: "Klarna has scaled its two-sided commerce network to over 120 million active consumers and 1.2 million live merchants globally as of mid-2026, processing $36.6 billion in second-quarter gross merchandise volume. While distribution agreements with payment processors such as J.P. Morgan Payments and enterprise retailers like H&M fuel top-line adoption, long-term durability increasingly relies on recurring engagement through the Klarna Card and paid memberships to counter credit underwriting scrutiny and macroeconomic headwinds."
sections:
  - id: "customer-segmentation-and-two-sided-network"
    title: "Two-Sided Network Segmentation and Scaled Participation"
    body: "Klarna operates a scaled two-sided commerce network connecting over 120 million active consumers with more than 1.2 million merchant partners globally. The consumer base divides between episodic shoppers utilizing core interest-free Pay in 4 and Pay in 30 days installment solutions and high-frequency digital banking users who adopt the Klarna Card, cashback rewards, and paid Klarna Memberships. On the commercial supply side, merchant participation spans enterprise multi-brand retailers such as H&M, Sephora, Nike, and Airbnb alongside hundreds of thousands of small-to-medium ecommerce creators and dropshippers who integrate standardized payments via ecommerce platforms and payment service providers. This two-sided architecture creates self-reinforcing distribution flywheels: consumer demand for payment flexibility incentivizes merchant checkout adoption, while expanding merchant ubiquity drives repeat transaction volume and lowers blended customer acquisition costs across competitive retail categories."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs: []
  - id: "consumer-adoption-trajectory-and-everyday-finance"
    title: "Consumer Adoption Trajectory and Everyday Finance Expansion"
    body: "Klarna's consumer adoption has transitioned from initial online checkout financing into broader everyday financial management. The network reached 120 million active consumers over the twelve months ending in mid-2026, driving a 24% year-over-year surge in average revenue per active user as consumers integrated Klarna into recurring purchasing habits. Adoption velocity is pronounced across product lines that extend beyond point-of-sale financing: Klarna Card active cardholders expanded nearly fivefold to 6.5 million across 16 countries, while paid Klarna Memberships reached 2 million subscribers, driving subscription revenue up more than 600% year-over-year. Regional engagement mirrors this deepening usage, evidenced by France where mobile app monthly active users expanded by 221% year-over-year to 2.9 million. By embedding instant underwriting and personalized shopping discovery into conversational AI tools, Klarna captures higher-frequency spend across non-discretionary categories including travel, daily retail, and wellness services."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU015"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "enterprise-merchant-proof-and-distribution-alliances"
    title: "Enterprise Merchant Proof and Platform Distribution Alliances"
    body: "Merchant expansion accelerated sharply throughout 2025 and 2026, adding 285,000 merchants in 2025 alone and crossing the 1.2 million merchant milestone. Growth is heavily catalyzed by platform-level distribution alliances with major payment service providers (PSPs) rather than bespoke bilateral merchant integrations. Most notably, Klarna activated distribution through J.P. Morgan Payments, enabling flexible payment options across an acquiring footprint processing $2.6 trillion annually without requiring technical overhead from participating merchants. Tier-one retail partnerships demonstrate ongoing production rollouts and cross-border expansion, exemplified by H&M's regional deployment of interest-free flexible checkout across Romania and Hungary in March 2026. These enterprise deployments validate Klarna's ability to drive conversion, increase average order value, and deepen merchant retention, although partner concentration and negotiated fee concessions remain central diligence considerations for platform profitability."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU003"
    figureRefs: []
  - id: "retention-mechanics-underwriting-scrutiny-and-concentration-risks"
    title: "Durability, Credit Underwriting Scrutiny, and Concentration Risks"
    body: "Despite strong top-line momentum and 42% growth in transaction margin dollars to $446 million in Q2 2026, customer durability faces scrutiny across underwriting rigor and macroeconomic exposures. Following Klarna's September 2025 IPO, a shareholder class action lawsuit challenged offering disclosures, alleging that rapid consumer expansion was fueled by underwriting high-risk loans for non-durable goods like fast food, which contributed to an immediate 102% spike in credit loss provisions. While Klarna maintained credit loss provisions at 0.52% of GMV in Q2 2026—down from 0.56% a year earlier—credit risk remains sensitive to economic conditions in core regions such as Germany, where volume softness prompted management to moderate full-year GMV guidance to $149B-$151B. Furthermore, Klarna does not publicly disclose granular cohort-based net revenue retention (NRR) or merchant churn metrics, leaving open questions regarding underlying merchant durability once initial promotional subsidies expire."
    claimRefs:
      - "CU004"
      - "CU013"
      - "CU014"
    tableRefs: []
    figureRefs: []
