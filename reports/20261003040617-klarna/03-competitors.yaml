  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Merchant Fee Model
      - Consumer Financing Cost
      - Consumer Late Fees
      - Monetization Mix & Capital Velocity
    rows:
      - - Klarna
        - 1.5% to 2.9% base transaction fee plus merchant spread
        - 0% APR on Pay in 4; APR varies on long-term Fair Financing
        - $7.00 per missed installment (one free reschedule)
        - ~70% merchant fees; 40-day credit cycle (~9x capital recycling)
      - - Affirm
        - Variable merchant MDR (typically 2.0% to 5.0% by AOV)
        - 0% to 35.99% APR depending on creditworthiness and term
        - $0.00 (Affirm does not charge late fees)
        - ~50% consumer loan interest, ~50% merchant MDR fees
      - - Afterpay
        - 3.0% to 6.0% transaction fee plus fixed transaction charge
        - 0% APR for standard Pay-in-4 installment schedules
        - Fixed late fees capped at a percentage of purchase value
        - Predominantly merchant transaction processing fees
      - - PayPal Pay Later
        - Standard PayPal merchant processing fees (typically 2.99% + fixed)
        - 0% APR on Pay in 4; 9.99% to 35.99% APR on Pay Monthly
        - $0.00 late fees on Pay in 4 in key markets
        - Blended wallet take rate and interest on monthly plans
    notes: "Synthesized from public pricing disclosures, partner documentation, and fintech industry comparative research."
    claimRefs:
      - CP004
      - CP006
      - CP008
      - CP009
