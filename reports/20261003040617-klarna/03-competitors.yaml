callouts:
  - calloutType: insight
    title: Distribution Integration via PSP Platforms as a Competitive Moat
    body: >
      Klarna's partnership with J.P. Morgan Payments to auto-enable installment checkout across millions of merchants, alongside Stripe and Clover terminal rollouts, establishes a significant structural advantage over point-solution lenders that must negotiate bilateral merchant agreements.
    claimRefs:
      - CP001
      - CP007
  - calloutType: risk
    title: Post-IPO Credit Loss Provision Volatility and Litigation Exposure
    body: >
      A 102% year-over-year spike in credit loss provisions shortly after Klarna's September 2025 IPO triggered securities fraud class action investigations alleging inadequate disclosure of risks associated with lending for non-durable goods like food deliveries.
    claimRefs:
      - CP010
      - CP011
