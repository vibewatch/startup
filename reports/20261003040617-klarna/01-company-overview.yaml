callouts:
  - calloutType: "risk"
    title: "Concentration of Voting Control and Key-Person Exposure"
    body: "Klarna's corporate governance combines extreme key-person dependence on CEO Sebastian Siemiatkowski with a dual-class share structure that concentrates 99.09% of pre-IPO voting rights. Potential Class C supervoting share issuances grant Siemiatkowski up to 15% voting power for 20 years, limiting external shareholder checks even as upcoming 2027 CFO and CMO transitions introduce management friction."
    claimRefs:
      - "CO002"
      - "CO007"
      - "CO009"
  - calloutType: "insight"
    title: "Regional Retail Sensitivity Versus Transaction Margin Resilience"
    body: "While Klarna's Q2 2026 reduction in annual GMV guidance highlights sensitivity to retail macroeconomic conditions in core European markets like Germany, its 42% year-over-year expansion in transaction margin dollars to $446 million proves that lower-cost consumer deposits (funding 90% of receivables) and subscription upgrades provide defensive earnings leverage."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
