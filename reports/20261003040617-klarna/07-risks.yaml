    claimRefs: [CR002, CR003, CR005, CR006, CR008, CR011, CR012, CR013, CR016]
callouts:
  - calloutType: "risk"
    title: "Primary kill criterion"
    body: "A sustained increase in credit-loss provisions or delinquencies without offsetting pricing, funding, or underwriting action would invalidate the current view that scale and improving transaction margins can absorb consumer-credit volatility."
    claimRefs: [CR002, CR003, CR005]
  - calloutType: "assumption"
    title: "Control evidence is not assurance"
    body: "Disclosed governance, fraud, security, and resilience controls are treated as mitigation evidence, not proof that controls are effective; independent testing and regulator closure remain diligence requirements."
    claimRefs: [CR009, CR012, CR013, CR014, CR015]
