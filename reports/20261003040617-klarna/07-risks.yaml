      - ["Privacy and digital operational resilience", "EU and global", "GDPR and DORA obligations apply; assigned evidence does not establish regulator-tested closure of all prior privacy matters", "Medium", "High", "Cyber governance, CISO oversight, training, and incident processes disclosed", "Medium-high due to fine, processing-ban, outage, and trust consequences", "Review DORA testing, DPIAs, material incidents, regulator correspondence, and independent control reports"]
