company:
  name: "Klarna"
chapter:
  number: 7
  title: "Risks"
  summary: "Klarna's highest residual risks are credit performance, multi-jurisdiction regulatory execution, and concentration in funding and infrastructure partners. Disclosed governance, improving Q2 2026 credit-loss metrics, and deposit funding mitigate but do not eliminate exposure to an economic downturn, compliance remediation, outages, or securities litigation."
sections:
  - id: "risk-priorities"
    title: "Risk priorities and residual exposure"
    body: >-
      The risk profile is dominated by the interaction of a large unsecured consumer-credit book, regulated-bank obligations, and a digital payments platform that must remain available at transaction scale. Klarna reported $15.2 billion of consumer lending credit exposure at December 31, 2025, while its Q2 2026 provision ratio improved to 0.52% of GMV from 0.56% a year earlier. That improvement is useful but not a through-cycle stress result. The company also reduced its 2026 GMV outlook to $149-$151 billion from more than $155 billion, citing currency translation and a more measured view of German volumes. The heatmap therefore keeps credit, regulation, cybersecurity, funding, and payments-ecosystem continuity above ordinary execution risks, with mitigation maturity scored only from disclosed controls rather than assumed effectiveness.
    claimRefs: [CR002, CR003, CR004, CR011, CR012]
    figureRefs: [FR001]
  - id: "regulatory-and-legal"
    title: "Regulatory and legal exposure"
    body: >-
      Klarna operates under banking, payments, consumer-credit, privacy, anti-money-laundering, sanctions, and digital-resilience regimes across multiple jurisdictions. The clearest realized compliance signal is the December 2024 SFSA remark and SEK 500 million fine; Klarna's 20-F says the investigation found deficiencies in KYC, customer-due-diligence, risk-classification, suspicious-activity analysis, and model-risk processes, and describes subsequent remediation. The 2026 prospectus separately frames GDPR non-compliance and capital-and-liquidity requirements as highly significant risks. Securities class-action litigation has also been instituted, but the assigned sources establish allegations rather than liability or damages. The investment implication is not to capitalize a precise legal loss; it is to require primary regulator closure evidence and current court-docket review before treating compliance remediation as complete.
    claimRefs: [CR008, CR009, CR010, CR011, CR016]
    tableRefs: [TR001]
  - id: "credit-operations-and-security"
    title: "Credit, operational, and security risks"
    body: >-
      Credit risk is economically material because Klarna bears unsecured consumer exposure and depends on underwriting, fraud controls, and collections across changing macroeconomic conditions. The 2026 prospectus reported SEK 104.63 billion of lending credit exposure at June 30, 2025, while the later 20-F reported $15.2 billion at year-end using a different currency, date, and denominator; those figures should not be treated as a growth series without reconciliation. Operationally, both the prospectus and 20-F warn that system, network, cloud, data, and third-party failures can interrupt transaction processing and raise regulatory costs. Klarna disclosed formal cyber oversight and said no identified 2025 threat materially affected the business, while explicitly declining assurance that no undetected incident occurred. Partner and company descriptions of controls are mitigations, not independent tests of control effectiveness.
    claimRefs: [CR001, CR002, CR003, CR012, CR013, CR014, CR015]
    tableRefs: [TR002]
  - id: "dependencies-and-kill-criteria"
    title: "Dependencies, monitoring, and thesis-break triggers"
    body: >-
      Funding and partner concentration turn external relationships into operating constraints. Klarna disclosed that 90% of 2025 funding came from $13 billion of consumer deposits, a fact echoed in Q2 2026 results, and warned that funding costs and access can deteriorate with rates, sentiment, or counterparties. The 20-F names AWS as the primary cloud provider, identifies AWS and Visa as sole or limited-source providers, and says merchant-of-record partners account for a substantial portion of merchant revenue. Monitor quarterly credit provisions and delinquency by product and vintage, deposit retention and cost, regulatory remediation milestones, uptime and recovery performance, and partner concentration. Thesis-break triggers are a sustained credit-loss step-up without matching pricing, a material license restriction, unresolved repeat AML/privacy findings, inability to replace a critical provider within tested recovery objectives, or repeated guidance cuts tied to core demand rather than currency.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR013]
    tableRefs: [TR003]
