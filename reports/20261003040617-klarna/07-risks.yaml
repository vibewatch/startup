      - ["IT, network, cloud, or cybersecurity disruption", "Medium", "High", "Medium: board, AuditCo, CISO, training, and incident processes disclosed", "High because transactions, underwriting, and service availability are digital", "Independent uptime, RTO/RPO, resilience-test results, and incident history are unavailable"]
      - ["Fraud, identity, or data-control failure", "Medium", "High", "Medium-low: company and partner controls are described but not independently tested here", "Medium-high across losses, remediation, fines, and trust", "Control-effectiveness evidence and current fraud-loss denominators are unavailable"]
      - ["Macroeconomic demand and credit deterioration", "Medium-high", "High", "Medium: short-duration underwriting and pricing levers are described elsewhere, but no stress results are assigned", "Medium-high after reduced 2026 GMV guidance", "Recession, unemployment, inflation, and German-volume sensitivities are not quantified"]
