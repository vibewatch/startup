      - ["Card issuance and network access", "Visa and payment networks", "Klarna Card and payment acceptance", "Visa described as sole or limited-source for relevant services", "Rule change, PCI issue, suspension, or outage reduces payment channels", "High", "Compliance investment and partner management", "Medium-high because replacement may be difficult or disruptive"]
      - ["Merchant distribution and US product origination", "PSPs / MoRs including Stripe; WebBank; WooCommerce", "Merchant reach, processing, and selected US financing or balance products", "Substantial merchant revenue derives from MoR-linked merchants; exact shares unavailable", "Partner termination, repricing, or service failure slows GMV and raises migration cost", "High", "Multiple ecosystem relationships and direct API channel", "Medium-high because concentration and contractual exit terms are undisclosed"]
    notes: "Dependency roles and concentration language come from Klarna's 20-F; exact counterparty revenue shares, switching times, and contractual protections remain private-evidence gaps."
    claimRefs: [CR005, CR006, CR007, CR014]
