  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Realized merchant pricing, CAC, payback, sales-cycle, discounting, and PSP or channel economics by product and geography.
      whyItMatters: Public list terms and aggregate revenue cannot establish acquisition efficiency or durable net take rate.
      diligencePath: Obtain merchant contracts, pricing waterfalls, channel agreements, cohort acquisition spend, and contribution-payback schedules.
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: Regulatory-capital ratios, liquidity-coverage metrics, stress outflows, encumbered liquidity, and management's capital plan.
      whyItMatters: Cash, deposits, and bank operating cash flow do not translate directly into startup-style burn or runway.
      diligencePath: Review regulatory returns, ALCO materials, liquidity stress tests, capital triggers, and debt and deposit maturity ladders.
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: product-economics
      missingEvidence: Audited revenue, transaction margin, credit losses, and capital consumption by Pay in Full, Pay Later, Fair Financing, Card, and membership.
      whyItMatters: Product mix and receivable-sale accounting can move reported revenue and margin without proving through-cycle economics.
      diligencePath: Obtain audited product and geography segment schedules plus vintage loss and receivable-sale reconciliations.
      relatedQuestionRefs: [QI009, QI010]
      relatedTableRefs: [TI001, TI003]
