schemaVersion: "report-v2"
artifact: financials
slug: klarna
runDate: 2026-10-03
company:
  name: Klarna
chapter:
  number: 4
  title: Financials
  summary: Klarna entered the second half of 2026 with faster revenue and transaction-margin growth, positive reported operating income, and a more capital-light receivables strategy. The underwriting case nevertheless depends on management-defined non-IFRS metrics, changing revenue recognition, longer-duration credit performance, and private pricing and efficiency inputs that the reviewed public evidence does not resolve.
sections:
  - id: revenue-architecture
    title: Revenue architecture and monetization
    body: >-
      Klarna monetizes transaction activity through transaction-service revenue, interest income, gain on
      receivable sales, and emerging subscription fees. In Q2 2026, management reported $707 million of
      transaction-service revenue, $266 million of interest income, and $69 million of gain on sale, summing
      to $1.042 billion of total revenue. This is not a pure payments or SaaS model: economics vary with
      product mix, credit duration, funding, and whether receivables remain on balance sheet or are sold.
      Public consumer terms show a $1.29-$5.99 service-fee range for one U.S. Pay in 4 example, but that is
      list pricing, not evidence of realized merchant yield, portfolio pricing, or gross margin by product.
    claimRefs: [CI001, CI004, CI014, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: transaction-economics
    title: Transaction economics and operating leverage
    body: >-
      Q2 revenue grew 27% year over year while transaction margin dollars grew 42% to $446 million, or
      42.8% of revenue. Transaction costs were $596 million: $233 million of processing and servicing,
      $192 million of credit-loss provisions, and $171 million of funding cost. Provisions declined to
      0.52% of GMV, but this quarterly ratio should not be treated as a through-cycle loss rate. Management
      said roughly $0.56 of each incremental transaction-margin dollar reached the operating line, and
      reported $27 million of operating income and $9 million of net income. These results demonstrate
      operating leverage, while leaving CAC, payback, sales-cycle, and channel-economics evidence unavailable.
    claimRefs: [CI002, CI003, CI005, CI006, CI007]
    tableRefs: [TI003]
  - id: capital-and-accounting
    title: Capital adequacy, funding, and accounting sensitivity
    body: >-
      At March 31, 2026, the unaudited balance sheet showed $2.806 billion of cash and cash equivalents,
      $12.301 billion of consumer deposits, and $1.415 billion of notes payable and other borrowings.
      Klarna described deposits as 90% of funding and disclosed a $2 billion forward-flow facility intended
      to support $17 billion of U.S. financing capacity. It also sold $1.2 billion of Fair Financing
      receivables in Q1 for a $57 million gain. These figures evidence liquidity and funding access, not
      a conventional startup runway: bank operating cash flow includes lending and deposit movements, so
      the Q1 cash decline cannot be relabeled as cash burn without a regulatory-capital and liquidity bridge.
    claimRefs: [CI008, CI009, CI010, CI011]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Management lowered full-year 2026 revenue guidance to $4.08-$4.16 billion from above $4.34 billion,
      while raising transaction-margin-dollar guidance to $1.62-$1.65 billion, approximately 1.09% of GMV.
      The divergence reflects softer German volume, mix, and a prospective fair-value presentation for
      eligible U.S. and German Fair Financing originations. Independent commentary is divided: one analyst
      emphasizes diversified revenue and improving leverage, while adverse coverage highlights prior
      expectation misses and the untested underwriting of longer-duration lending. The financial stance is
      therefore constructive on near-term margin direction but conditional on audited product economics,
      cohort losses, regulatory capital, realized pricing, and proof that receivable sales remain economical.
    claimRefs: [CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Q2 2026 value or status, Revenue quality, Diligence ask]
    rows:
      - [Transaction service, Merchant/payment and service fees including membership, "$707m; +17% YoY", "Volume-linked with an emerging recurring component", "Disclose merchant take rate, subscription share, and realized net pricing by product"]
      - [Interest income, Interest recognized on consumer financing, "$266m; +21% YoY", "Yield-bearing but credit-, duration-, and funding-sensitive", "Provide product and vintage yield net of losses and funding"]
      - [Gain on sale, Sale and fair-value economics from receivables, "$69m", "Potentially capital-light but timing- and market-dependent", "Provide sale frequency, buyers, advance rates, retained risk, and gain sensitivity"]
      - [Consumer and membership fees, Pay in 4 service fees and paid membership, "Public Pay in 4 example: $1.29-$5.99 service fee; membership amount not retained", "List pricing only; realized mix is undisclosed", "Provide paid-subscriber ARPU, churn, fee waivers, and realized consumer-fee revenue"]
    notes: Q2 values are company-reported; consumer fees are public list terms, not realized portfolio pricing, and product-level margin is unavailable.
    claimRefs: [CI004, CI014, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer or unit, Public price or mechanism, List versus realized, Discount or unknown, Underwriting implication]
    rows:
      - [Pay in Full, "Payment fees, subscriptions, and deposit interest", "Mechanism disclosed; realized take rate unavailable", "Merchant terms and channel splits private", "Do not infer payment gross margin from GMV"]
      - [Pay in 4, "$1.29-$5.99 service fee in a $248 U.S. example", "Public example only", "Approval, down-payment, and consumer-specific terms apply", "Requires realized fee incidence and loss-adjusted cohort yield"]
      - [Paid membership, "Monthly fee; exact retained-page amount unavailable", "Mechanism disclosed; realized ARPU unavailable", "Plan mix, promotions, and churn undisclosed", "Recurring revenue quality needs subscriber retention evidence"]
      - [Fair Financing, "Interest income plus potential gain on receivable sale", "Portfolio mechanism disclosed; contract pricing unavailable", "Duration, APR mix, sale terms, and retained exposure undisclosed", "Margin durability depends on credit and capital-market execution"]
    notes: The table separates public mechanisms and list terms from unavailable realized pricing; null or unavailable values require contract and cohort data.
    claimRefs: [CI004, CI010, CI014, CI015]
  - id: TI003
    title: Unit economics and capital diagnostics
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Transaction margin, "42.8% of revenue in Q2 2026", High, "Closest disclosed contribution metric after transaction costs", "Reconcile TMD to IFRS by product and geography"]
      - [Credit-loss provisions, "0.52% of Q2 2026 GMV", High, "Directly affects credit-adjusted transaction economics", "Provide vintage loss curves, roll rates, recoveries, and recession stress"]
      - [Processing and servicing, "0.64% of Q2 2026 GMV", Medium, "Captures delivery cost before non-transaction operating expense", "Separate card issuance, PSP, servicing, and collections costs"]
      - [Funding cost, "0.47% of Q2 2026 GMV", Medium, "Measures balance-sheet funding drag", "Provide deposit beta, maturity ladder, hedging, and forward-flow all-in cost"]
      - [Incremental TMD conversion, "$0.56 per incremental TMD dollar reached the operating line", Medium, "Management proxy for operating leverage", "Reconcile the period and adjustments to IFRS operating income"]
      - [Cash runway, null, Low, "A bank balance sheet cannot be underwritten with a startup burn-rate shortcut", "Provide regulatory-capital ratios, liquidity coverage, stress outflows, and management capital plan"]
    notes: Values are Q2 company disclosures except the March 31 balance-sheet context; cash runway is intentionally null because bank cash flows are not cash burn.
    claimRefs: [CI002, CI005, CI006, CI007, CI009]
figures:
  - id: FI001
    title: Q2 2026 revenue-to-transaction-margin bridge
    type: flow
    summary: Company-reported activity branches into three revenue lines, while transaction costs determine transaction margin dollars.
    data:
      nodes:
        - id: activity
          label: Consumer and merchant activity
          value: 36.6
          unit: "$bn GMV"
          detail: Q2 2026 gross merchandise volume; GMV is not revenue.
        - id: service
          label: Transaction service revenue
          value: 707
          unit: "$m"
          detail: Includes payment and service revenue; subscription revenue grew more than 600% year over year.
        - id: interest
          label: Interest income
          value: 266
          unit: "$m"
          detail: Driven by current and prior-period consumer-financing originations.
        - id: sale
          label: Gain on sale
          value: 69
          unit: "$m"
          detail: Includes U.S. forward flows and German back-book sales.
        - id: revenue
          label: Total revenue
          value: 1042
          unit: "$m"
          detail: Q2 2026 reported revenue.
        - id: costs
          label: Transaction costs
          value: 596
          unit: "$m"
          detail: Processing and servicing, provisions for credit losses, and funding costs.
        - id: tmd
          label: Transaction margin dollars
          value: 446
          unit: "$m"
          detail: Non-IFRS measure equal to revenue less transaction costs.
      edges:
        - from: activity
          to: service
          label: Payment and service monetization
        - from: activity
          to: interest
          label: Financed receivables
        - from: activity
          to: sale
          label: Receivable sales
        - from: service
          to: revenue
        - from: interest
          to: revenue
        - from: sale
          to: revenue
        - from: revenue
          to: costs
          label: Transaction-cost burden determines TMD
        - from: costs
          to: tmd
          label: Revenue less transaction costs
    approximationNotes: Values are company-reported Q2 2026 results; the diagram is relational, not a proportional rendering, and does not imply that GMV converts to revenue at a uniform rate.
    claimRefs: [CI001, CI002, CI004, CI005]
callouts:
  - calloutType: strength
    title: Margin growth outpaced revenue
    body: Q2 transaction margin dollars grew 42% year over year versus 27% revenue growth, while reported operating income was positive.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Accounting and funding choices alter reported lines
    body: Receivable sales and prospective fair-value presentation can accelerate recognition and reduce balance-sheet intensity, so revenue growth alone is an incomplete underwriting metric.
    claimRefs: [CI010, CI012, CI013]
