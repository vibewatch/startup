evidenceGaps:
  - type: private-evidence-only
    severity: minor
    topic: employee-headcount
    missingEvidence: Audited exact headcount disclosure across technical, product, and customer support divisions as of Q2 2026.
    whyItMatters: >-
      Klarna has significantly reduced full-time headcount from 7,000 in 2022 to approximately 2,900-3,400 via AI
      automation, affecting operational leverage assumptions.
    diligencePath: Review subsequent Form 20-F or Q3 2026 statutory filings to verify post-restructuring payroll metrics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-succession-planning
    missingEvidence: >-
      Confirmed identities of permanent successor appointees for the Chief Financial Officer and Chief Marketing Officer
      positions.
    whyItMatters: >-
      Planned transitions for CFO Niclas Neglén and CMO David Sandström in early 2027 create continuity risks across
      financial reporting and merchant partner marketing.
    diligencePath: >-
      Monitor upcoming Klarna investor relations announcements and SEC Form 6-K filings ahead of the scheduled early
      2027 transition window.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: class-c-option-allotment
    missingEvidence: >-
      Exact disclosure of whether Class C option allotments have been formally executed by the board for Sebastian
      Siemiatkowski post-IPO.
    whyItMatters: >-
      Execution of Class C option awards determines whether Siemiatkowski's voting power expands toward the 15%
      statutory cap.
    diligencePath: Inspect upcoming annual proxy statement / Notice of AGM filings under UK Companies Act.
    relatedQuestionRefs:
      - QO001
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: subprime-credit-exposure
    missingEvidence: >-
      Audited loan book breakdown distinguishing prime versus subprime borrowers and default rates on non-durable
      micro-loans versus general retail goods.
    whyItMatters: >-
      Essential to determine whether credit loss volatility is structural to micro-installment consumer behavior or an
      isolated post-IPO macroeconomic anomaly.
    diligencePath: >-
      Review subsequent SEC Form 20-F annual filings, class action discovery filings, and quarterly loan delinquency
      disclosures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-take-rates
    missingEvidence: >-
      Audited merchant discount rate (MDR) breakdown by merchandise category comparing Klarna, Affirm, and Afterpay
      contract realizations.
    whyItMatters: >-
      Standard list prices obscure bilateral enterprise discounting for tier-1 retailers like Apple, Amazon, and
      Walmart, distorting true merchant margin take rates.
    diligencePath: Review public retail merchant 10-K filings and payment processing vendor expense disclosures.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: private-credit-loss-by-vintage
    missingEvidence: >-
      Granular credit loss and 30+ day delinquency rates segmented by basket category (e.g. food delivery vs
      electronics) across BNPL peers.
    whyItMatters: >-
      Class action litigation alleges non-durable everyday loans suffer disproportionate default rates, impacting unit
      economics differently from durable goods financing.
    diligencePath: >-
      Analyze forward flow loan purchase agreements and securitization disclosures from WebBank and asset-backed debt
      investors.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Realized merchant pricing, CAC, payback, sales-cycle, discounting, and PSP or channel economics by product and
      geography.
    whyItMatters: Public list terms and aggregate revenue cannot establish acquisition efficiency or durable net take rate.
    diligencePath: >-
      Obtain merchant contracts, pricing waterfalls, channel agreements, cohort acquisition spend, and
      contribution-payback schedules.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Regulatory-capital ratios, liquidity-coverage metrics, stress outflows, encumbered liquidity, and management's
      capital plan.
    whyItMatters: Cash, deposits, and bank operating cash flow do not translate directly into startup-style burn or runway.
    diligencePath: >-
      Review regulatory returns, ALCO materials, liquidity stress tests, capital triggers, and debt and deposit maturity
      ladders.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: product-economics
    missingEvidence: >-
      Audited revenue, transaction margin, credit losses, and capital consumption by Pay in Full, Pay Later, Fair
      Financing, Card, and membership.
    whyItMatters: >-
      Product mix and receivable-sale accounting can move reported revenue and margin without proving through-cycle
      economics.
    diligencePath: Obtain audited product and geography segment schedules plus vintage loss and receivable-sale reconciliations.
    relatedQuestionRefs:
      - QI009
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: algorithmic-underwriting
    missingEvidence: >-
      Audited documentation or third-party validation of Klarna's proprietary real-time credit underwriting algorithms,
