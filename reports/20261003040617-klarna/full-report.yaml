  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Klarna Group plc represents one of the largest public-market consumer fintech assets, completing its NYSE
              IPO in September 2025 at $40.00 per share with an implied initial valuation of $14B. The core investment
              thesis rests on structural operating leverage: Klarna has broadened beyond traditional point-of-sale Buy
              Now, Pay Later (BNPL) into high-frequency everyday banking, debit cards, and paid subscription tiers. In
              Q2 2026, active consumers reached 120 million (+8% YoY), while merchant count expanded 54% YoY to surpass
              1.2 million, accelerated by major payment service provider distribution deals such as J.P. Morgan
              Payments. Furthermore, transaction margin dollars (TMD) grew 42% YoY to $446 million (42.8% of revenue),
              demonstrating that unit economics are scaling faster than top-line gross merchandise volume (GMV).
              Conversely, the anti-thesis emphasizes credit vulnerability and regulatory overhang. The company faces a
              pending securities class action alleging that IPO documents understated credit risks from aggressive
              consumer lending and obscured a 102% spike in credit loss provisions shortly after listing. Additionally,
              management revised its full-year 2026 GMV guidance downward to $149B–$151B due to softer consumer spending
              trends in Germany, underscoring cyclical retail sensitivity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: Current Valuation Context and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Klarna's capital history shows dramatic valuation swings across funding cycles, from a peak private
              post-money mark of $45.6B in June 2021 down to $6.7B in July 2022, before public listing on the NYSE in
              September 2025. Over its history, Klarna raised $4.19B in equity across 23 rounds, supplemented by
              significant debt facilities including a $1.63B conventional debt round in August 2025 and a €900M German
              forward-flow warehouse facility announced in July 2026. This forward-flow structure sells German Fair
              Financing term loans and new receivables on a rolling basis, protecting the balance sheet from credit
              concentration. In Q2 2026, Klarna delivered GAAP operating income of $27M (compared to a loss of $46M in
              Q2 2025) and net income of $9M, establishing sequential GAAP profitability. With full-year 2026 revenue
              guided to $4.08B–$4.16B and adjusted operating income targeted at $280M–$300M, the stock trades at roughly
              3.4x to 3.5x forward revenue. However, credit loss provisions, while steady at 0.52% of GMV in Q2 2026,
              remain subject to scrutiny given plaintiff allegations that non-durable goods lending drives elevated
              default propensity.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
