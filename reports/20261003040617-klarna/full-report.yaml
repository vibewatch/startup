chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Domicile, and Dual-Class Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Klarna Group plc was founded in Stockholm, Sweden, in 2005 by Sebastian Siemiatkowski, Niklas Adalberth,
              and Victor Jacobsson as Kreditor, originally incubating at the Stockholm School of Economics Business Lab.
              Over two decades, the venture transformed from an invoice-based post-delivery payment service into an
              international payments and everyday commerce network operating across 26 countries. To prepare for its
              public listing on the New York Stock Exchange, the group completed an international corporate
              reorganization in May 2024, establishing Klarna Group plc as a public limited company incorporated under
              the laws of England and Wales with corporate headquarters at 10 York Road in London, while preserving
              operational banking and supervisory foundations through Klarna Bank AB in Stockholm under the supervision
              of the Swedish Financial Supervisory Authority (Finansinspektionen). Following the completion of its
              initial public offering in September 2025 under the ticker symbol KLAR, Klarna established a dual-class
              equity architecture that concentrates post-offering voting power. Pre-IPO shareholders received Class B
              voting shares carrying ten votes per share with no dividend or liquidation rights, resulting in legacy
              shareholders retaining 99.09% of post-offering voting rights. Furthermore, Klarna's articles of
              association permit the issuance of ten-vote Class C shares exclusively to co-founder and Chief Executive
              Officer Sebastian Siemiatkowski and affiliated vehicles, capped at 15% of pre-offering voting rights,
              codifying long-term executive influence while maintaining foreign private issuer governance status.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance Safeguards, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Klarna's corporate leadership remains anchored by co-founder Sebastian Siemiatkowski, who has continuously
              directed corporate strategy and operations as Chief Executive Officer and director since February 2005.
              Strategic decision-making and operational execution are distributed across an executive team that includes
              Chief Product and Design Officer David Fock, Chief Operating Officer Camilla Giesecke, Chief Financial
              Officer Niclas Neglén, Chief Marketing Officer David Sandström, Chief Technology Officer Yaron Shaer, and
              Chief Commercial Officer David Sykes. The company explicitly identifies Sebastian Siemiatkowski as an
              irreplaceable key person whose departure would severely disrupt operations, innovation culture, and
              partner relationships. Board governance is chaired by former Sequoia Capital partner Sir Michael J.
              Moritz, presiding over a nine-member board that includes prominent independent and institutional directors
              such as former U.S. Federal Reserve Vice Chairman Roger W. Ferguson, Jr., Heartland A/S CEO Lise Kaae,
              former Twitter executive chairman Omid R. Kordestani, Sequoia partner Andrew Reed, Goldman Sachs former
              Chief Accounting Officer Sarah Smith (Audit Committee Chair), and Bolt founder Markus Villig. However,
              leadership stability faces near-term transition hurdles: following Q2 2026 financial reporting, Klarna
              disclosed planned leadership handovers for both Chief Financial Officer Niclas Neglén and Chief Marketing
              Officer David Sandström scheduled for early 2027, introducing transition risk during an active corporate
              transformation.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Financing Trajectory, Valuation Cycles, and Institutional Sponsors
        blocks:
          - type: paragraph
            body: >-
              Klarna's capitalization trajectory reflects the extreme cyclicality of fintech equity over the past
              decade. The company secured early institutional backing from Sequoia Capital in 2010, followed by
              expansion capital from General Atlantic, DST Global, and Northzone. During the pandemic e-commerce boom of
              June 2021, an equity financing round led by SoftBank's Vision Fund 2 valued the business at approximately
              $46 billion, positioning Klarna as Europe's most valuable private technology company. However, the
              subsequent macroeconomic contraction and rising interest rates forced a severe reset in July 2022, when
              Klarna raised $800 million at a post-money valuation of $6.7 billion—an approximate 85% markdown. The cap
              table was gradually stabilized through insider financing, including an $813 million funding round from
              July 2022 to March 2023 at an average price of $18 per share supported by Sequoia Capital, Victor
              Jacobsson, Sebastian Siemiatkowski, and Commonwealth Bank of Australia. In September 2025, Klarna
              successfully priced its U.S. initial public offering at $40.00 per share, issuing 5,000,000 primary
              ordinary shares and facilitating secondary liquidity for 29,311,274 shares sold by legacy investors,
              achieving an opening day market capitalization of $17.3 billion. Institutional sponsor influence remains
              concentrated in Sequoia Capital (holding over 20% of post-IPO equity), Heartland A/S (the investment
              vehicle of Danish billionaire Anders Holch Povlsen), and Commonwealth Bank of Australia, with former
              founders Victor Jacobsson and Sebastian Siemiatkowski holding material personal equity stakes.
            claimRefs:
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO007
              - CO010
              - CO012
      - number: '1.4'
        title: Scale Progression, Monetization Streams, and Volume Headwinds
        blocks:
          - type: paragraph
            body: >-
              Klarna's operating scale has expanded from checkout installment financing into a global consumer network.
              By the second quarter of 2026, Klarna reported 120 million active consumers across 26 countries, over 1.2
              million integrated retail merchants, and quarterly Gross Merchandise Volume (GMV) of $36.6 billion,
              representing 18% year-over-year expansion. Core monetization encompasses merchant transaction processing
              fees, consumer financing and interest charges, late payment administrative fees, interchange revenue from
              the co-branded Visa Klarna Card, merchant advertising placements ($180 million in 2024), and subscription
              fees from Klarna Plus and newly launched multi-tier consumer memberships. However, commercial momentum has
              encountered regional friction. In August 2026, management revised its full-year 2026 GMV guidance downward
              from greater than $155 billion to $149–151 billion, and lowered guided full-year revenue to $4.08–4.16
              billion. The guidance cut was driven by approximately $600 million in adverse currency translation and a
              softer consumer retail environment in Germany, Klarna's largest single market by transaction volume, which
              triggered a 20.9% post-earnings market decline. Nonetheless, Klarna upgraded its transaction margin dollar
              outlook to $1.62–1.65 billion, relying on low-cost deposit funding (funding roughly 90% of loan
              receivables) and expanding subscription and card adoption to offset retail GMV deceleration.
            claimRefs:
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: Historical Milestones, Regulatory Scrutiny, and Infrastructure Expansion
        blocks:
          - type: paragraph
            body: >-
              Klarna's corporate history spans aggressive international growth alongside tightening European and North
              American regulatory oversight. The company reached critical milestones by securing a Swedish banking
              license in 2017, launching physical card products across Europe and the U.S. in 2022, and expanding retail
              marketing through the acquisition of PriceRunner. To lower long-term merchant processing friction, Klarna
              introduced its proprietary digital stablecoin, KlarnaUSD, in November 2025, and submitted an application
              in July 2026 to charter an FDIC-insured industrial bank in Utah to eliminate dependence on third-party
              U.S. partner banks. Concurrently, commercial enterprise distribution expanded via an Apple device leasing
              partnership and a platform-wide merchant agreement with J.P. Morgan Payments. These expansion milestones
              have been counterbalanced by material compliance and regulatory challenges. In December 2024, the Swedish
              Financial Supervisory Authority issued Klarna Bank AB an administrative fine of SEK 500 million
              (approximately $48 million) and a formal regulatory remark for deficiencies in anti-money laundering risk
              assessments and customer due diligence. Earlier, the Swedish Authority for Privacy Protection upheld a SEK
              7.5 million GDPR fine for inadequate consumer privacy disclosures. In workforce management, Klarna reduced
              its headcount from approximately 7,000 employees in 2022 down to under 3,000 in 2025 through restructuring
              and aggressive deployment of generative AI automation, underscoring both technological agility and
              operational labor exposure.
            claimRefs:
              - CO001
              - CO004
              - CO011
              - CO012
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO010
              - CO011
              - CO012
              - CO014
              - CO015
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration of Voting Control and Key-Person Exposure
            body: >-
              Klarna's corporate governance combines extreme key-person dependence on CEO Sebastian Siemiatkowski with a
              dual-class share structure that concentrates 99.09% of pre-IPO voting rights. Potential Class C
              supervoting share issuances grant Siemiatkowski up to 15% voting power for 20 years, limiting external
              shareholder checks even as upcoming 2027 CFO and CMO transitions introduce management friction.
            calloutType: risk
            claimRefs:
              - CO002
              - CO007
              - CO009
          - type: callout
            title: Regional Retail Sensitivity Versus Transaction Margin Resilience
            body: >-
              While Klarna's Q2 2026 reduction in annual GMV guidance highlights sensitivity to retail macroeconomic
              conditions in core European markets like Germany, its 42% year-over-year expansion in transaction margin
              dollars to $446 million proves that lower-cost consumer deposits (funding 90% of receivables) and
              subscription upgrades provide defensive earnings leverage.
            calloutType: insight
            claimRefs:
              - CO013
              - CO014
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Spend Scope
        blocks:
          - type: paragraph
            body: >
              Klarna's core commercial engine is situated at the convergence of three distinct financial and commerce
              software layers: digital payment processing, point-of-sale consumer credit installment lending, and mobile
              banking services. To analyze Klarna's addressable opportunity rigorously, the market must be partitioned
              into explicit included transaction volumes, fee profit pools, and adjacent excluded financial categories.
              The foundation of Klarna's transaction volume is short-term Buy Now Pay Later (BNPL), structured primarily
              around interest-free Pay in 30 days and Pay in 3 or Pay in 4 installment schedules collected bi-weekly or
              monthly. Under this core mechanism, merchants pay a merchant discount rate of approximately 2.74% to
              unlock latent consumer purchasing demand and raise basket conversion rates. In exchange, consumers face
              zero interest charges or compounding interest fees when payments are settled on schedule.


              Beyond interest-free short-term payment deferrals, Klarna has progressively expanded into longer-term Fair
              Financing loan facilities spanning 3 to 48 months with annual percentage rates up to 35.99%, as well as
              debit-card-based point-of-sale payments via the Klarna Card, in-app sponsored affiliate marketing, and
              licensed digital deposit banking in European jurisdictions. These expansions broaden Klarna's transaction
              capture across in-store and online channels, reaching over 120 million active annual consumers and 1.2
              million integrated merchants worldwide.


              Conversely, diligent market sizing requires excluding major segments of traditional enterprise financial
              services and secured consumer lending. Mortgage origination, commercial auto leasing, large corporate
              revolving credit facilities, business-to-business treasury operations, and legacy interchange processing
              networks that lack direct point-of-sale consumer relationship software are excluded from Klarna's
              serviceable footprint. In addition, traditional high-interest revolving credit card balances—where card
              issuers generate substantial net interest margin through compounding balance carrying costs and mishap
              penalty fees—represent Klarna's primary displacement target rather than its addressable operational spend
              pool.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Evidence-Constrained Opportunity'
        blocks:
          - type: paragraph
            body: >
              Sizing Klarna's commercial opportunity requires multiple analytical lenses rather than a single
              unconstrained top-line estimate. At the broadest macroeconomic tier, the Total Addressable Market (TAM)
              can be conceptualized either as the $18 trillion global consumer retail and travel spend across Klarna's
              active operating jurisdictions (representing roughly $450 billion in potential merchant fee revenues
              assuming an average take rate of 2.5%), or through the $8 trillion legacy revolving credit industry that
              BNPL actively unbundles and displaces. While these top-line macroeconomic aggregates illustrate the
              ultimate theoretical ceiling for electronic consumer commerce and revolving household credit, they
              conflate non-discretionary consumer expenses with digital checkout transactions and vastly overstate what
              any single payments network can realistically capture.


              A more realistic operational lens examines the dedicated global Buy Now Pay Later market, independently
              sized at approximately $260 billion in transaction volume. Within this market, Klarna commands leading
              positions across multiple key geographic theaters: independent industry data credits Klarna with
              approximately 72% global website traffic share among BNPL specialists, a 48% volume share in Europe, and
              26% market share by BNPL volume in the United States, ahead of rivals Afterpay (22%) and Affirm (19%).


              At the serviceable addressable market (SAM) level, equity research analysts model Klarna's addressable
              payments transaction volume at approximately $520 billion. In 2026, Klarna's actual operational traction
              demonstrates substantial scale within this serviceable pool: annual gross merchandise volume (GMV)
              guidance ranges between $149 billion and $151 billion, with Q2 2026 GMV reaching $36.6 billion (up 18%
              year-over-year globally and 27% in the United States). Full-year 2026 net revenue is guided to $4.08
              billion–$4.16 billion, supported by an effective take rate of 2.84%–2.85% excluding accounting fair-value
              originations adjustments. This positions Klarna's Serviceable Obtainable Market (SOM) at approximately 29%
              of its $520 billion payment SAM.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
