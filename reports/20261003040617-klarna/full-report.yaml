      - number: '8.3'
        title: Valuation Scenarios and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Klarna's intrinsic equity value requires assessing diverging operating scenarios across credit
              performance, merchant distribution velocity, and European consumer spending. In the bull case, J.P. Morgan
              Payments and Apple Upgrade rollouts drive U.S. transaction margins toward European levels (54%–60% vs.
              U.S. 23%), expanding FY2026 adjusted operating income above $350M and supporting multiple re-rating toward
              5.0x forward sales. In the base case, European retail moderation keeps GMV around $150B and adjusted
              operating income in the guided $280M–$300M range, justifying fair valuation at $14B–$15B. In the bear
              case, legal fallout from the securities class action or deterioration in subprime consumer repayment
              pushes loss provisions above 1.0% of GMV, compressing multiples to 2.0x sales and pushing market cap down
              toward $8B. Diligence priorities must center on monitoring independent court dockets regarding the Hagens
              Berman securities litigation, auditing forward-flow off-balance-sheet recourse terms, and verifying
              whether Klarna's Utah FDIC bank application achieves formal regulatory approval to lower third-party
              funding friction.
