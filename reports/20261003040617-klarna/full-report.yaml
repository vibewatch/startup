  - id: FO001
    title: Klarna Strategic Corporate Evolution and Critical Milestones
    type: timeline
    summary: >-
      Chronological progression of Klarna from an invoice factoring startup in Stockholm to a public digital bank and
      everyday payments network.
    data:
      items:
        - label: '2005'
          detail: Founded in Stockholm as Kreditor by Sebastian Siemiatkowski, Niklas Adalberth, and Victor Jacobsson.
          tone: neutral
        - label: '2010'
          detail: Sequoia Capital leads first institutional U.S. venture round, initiating international scale.
          tone: positive
        - label: '2017'
          detail: Obtains full Swedish banking license from Finansinspektionen to operate as Klarna Bank AB.
          tone: positive
        - label: '2021'
          detail: SoftBank Vision Fund 2 leads round valuing Klarna at $46B peak private valuation.
          tone: positive
        - label: '2022'
          detail: Valuation falls 85% to $6.7B in $800M recapitalization; group begins cost cutting and AI pivot.
          tone: warning
        - label: '2024'
          detail: Finansinspektionen issues SEK 500M AML fine; Klarna redomiciles parent company to UK.
          tone: adverse
        - label: '2025'
          detail: Completes NYSE IPO (ticker KLAR) at $40.00/share ($17.3B valuation); launches KlarnaUSD stablecoin.
          tone: positive
        - label: '2026'
          detail: Reports $1.042B Q2 revenue, cuts FY26 GMV outlook on German retail softness, applies for Utah bank charter.
          tone: warning
    approximationNotes: Milestones selected based on official regulatory disclosures, SEC filings, and audited historical events.
