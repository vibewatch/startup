            body: >-
              Despite strong top-line momentum and 42% growth in transaction margin dollars to $446 million in Q2 2026,
              customer durability faces scrutiny across underwriting rigor and macroeconomic exposures. Following
              Klarna's September 2025 IPO, a shareholder class action lawsuit challenged offering disclosures, alleging
