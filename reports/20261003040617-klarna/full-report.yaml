        blocks:
          - type: paragraph
            body: >-
              Klarna operates under banking, payments, consumer-credit, privacy, anti-money-laundering, sanctions, and
              digital-resilience regimes across multiple jurisdictions. The clearest realized compliance signal is the
              December 2024 SFSA remark and SEK 500 million fine; Klarna's 20-F says the investigation found
