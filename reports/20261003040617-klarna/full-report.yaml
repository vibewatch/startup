        title: Risk priorities and residual exposure
        blocks:
          - type: paragraph
            body: >-
              The risk profile is dominated by the interaction of a large unsecured consumer-credit book, regulated-bank
              obligations, and a digital payments platform that must remain available at transaction scale. Klarna
              reported $15.2 billion of consumer lending credit exposure at December 31, 2025, while its Q2 2026
              provision ratio improved to 0.52% of GMV from 0.56% a year earlier. That improvement is useful but not a
              through-cycle stress result. The company also reduced its 2026 GMV outlook to $149-$151 billion from more
              than $155 billion, citing currency translation and a more measured view of German volumes. The heatmap
              therefore keeps credit, regulation, cybersecurity, funding, and payments-ecosystem continuity above
