  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and User Workflow
        blocks:
          - type: paragraph
            body: >-
              Klarna delivers flexible checkout financing and everyday consumer banking services centered on its
              signature Buy Now Pay Later installments and digital shopping ecosystem. Consumers access Klarna directly
              through web merchants via hosted checkout redirects or embedded Web SDKs, as well as through the
              standalone Klarna mobile application and physical or virtual Klarna Cards. The primary consumer product
              offering divides retail transactions into interest-free installment schedules or deferred invoice
              settlement, transferring default and non-payment risk away from retail merchants. Across merchant
              partners, Klarna provides dynamic onsite marketing placements, developer sandbox playgrounds, and
              programmatic order management APIs supporting automated authorizations, captures, cancellations, and
              dispute workflows. At enterprise scale, Klarna serves over 120 million active consumers globally and over
              1.2 million active merchant integrations, with high-frequency engagement increasingly driven by 6.5
