              - CE014
      - number: '5.4'
        title: Underwriting Mechanics, Security, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Klarna's business model hinges on instant algorithmic credit evaluation executed within sub-second
              checkout latency budgets to maintain transaction conversion rates. Proprietary decision engines analyze
              basket metadata, historical repayment records, device telemetry, and behavioral signals in real time to
              calculate buyer eligibility and assign dynamic transaction limits without requiring cumbersome
              documentation. Operating across regulated financial jurisdictions necessitates strict technical adherence
              to compliance architectures, including PCI DSS cardholder data encryption, GDPR privacy governance, and
              PSD2 Strong Customer Authentication requirements. To control financial exposure, machine learning fraud
              detection models operate continuously alongside automated identity verification rails, keeping reported
              credit loss provisions at 0.52% of GMV as of Q2 2026. However, opacity surrounding model drift,
              vertical-specific default sensitivities, and loss curves under macroeconomic contraction remains a
              material diligence gap for prospective underwriting.
            claimRefs:
