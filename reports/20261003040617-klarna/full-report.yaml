              receivable sales, and emerging subscription fees. In Q2 2026, management reported $707 million of
              transaction-service revenue, $266 million of interest income, and $69 million of gain on sale, summing to
              $1.042 billion of total revenue. This is not a pure payments or SaaS model: economics vary with product
              mix, credit duration, funding, and whether receivables remain on balance sheet or are sold. Public
              consumer terms show a $1.29-$5.99 service-fee range for one U.S. Pay in 4 example, but that is list
              pricing, not evidence of realized merchant yield, portfolio pricing, or gross margin by product.
