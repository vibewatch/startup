      - number: '5.2'
        title: Software Stack and Data Lakehouse Architecture
        blocks:
          - type: paragraph
            body: >-
              Klarna's backend architecture relies on decoupled domain microservices and a cloud-native analytical data
              infrastructure designed for horizontal scalability and high transaction concurrency. To address developer
              complexity and brittle middleware chains across its Node.js backend services, Klarna engineering built an
              internal microservices framework designated Steve the Stitcher. Steve wraps the Inversify dependency
              injection library, strictly separating HTTP and event-driven transport controllers from core domain
              services and external client adapters while enforcing payload validation and correlation ID propagation.
              In parallel, Klarna completed a multi-year migration from on-premises legacy databases and Hadoop clusters
              to a unified cloud data lakehouse on AWS. The data architecture combines Amazon S3 object storage for raw
              transaction landing with Amazon Redshift analytical warehouses and Apache Spark clusters hosted on EMR for
              large-scale data processing, orchestrated via Jenkins CI/CD automation and customized Apache Airflow
              pipelines.
