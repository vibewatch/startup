companyProfile:
  summary: >-
    Klarna is a Stockholm-founded fintech that has become a public everyday-finance network spanning payments, BNPL,
    consumer credit, card, and subscription products. The company went public on the NYSE in 2025, serves a very large
    consumer and merchant base, and is now balancing improving profitability and transaction-margin expansion against
    regulatory, credit, litigation, and management-transition risks.
