    title: "The BNPL Take-Rate Transformation and Merchant Economics"
    body: "BNPL providers like Klarna command merchant discount fees of 2.0% to 3.5%, significantly higher than standard credit card interchange fees. Merchants willingly absorb this cost because installment financing directly tackles eCommerce checkout friction, driving proven 20% to 30% increases in sales conversion rates and lifting average basket sizes by 30% to 50%."
