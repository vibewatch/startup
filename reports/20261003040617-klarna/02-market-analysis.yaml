  - id: "market-sizing-tam-sam-som"
    title: "Market Sizing: TAM, SAM, and Evidence-Constrained Opportunity"
    body: |
      Sizing Klarna's commercial opportunity requires multiple analytical lenses rather than a single unconstrained top-line estimate. At the broadest macroeconomic tier, the Total Addressable Market (TAM) can be conceptualized either as the $18 trillion global consumer retail and travel spend across Klarna's active operating jurisdictions (representing roughly $450 billion in potential merchant fee revenues assuming an average take rate of 2.5%), or through the $8 trillion legacy revolving credit industry that BNPL actively unbundles and displaces. While these top-line macroeconomic aggregates illustrate the ultimate theoretical ceiling for electronic consumer commerce and revolving household credit, they conflate non-discretionary consumer expenses with digital checkout transactions and vastly overstate what any single payments network can realistically capture.

      A more realistic operational lens examines the dedicated global Buy Now Pay Later market, independently sized at approximately $260 billion in transaction volume. Within this market, Klarna commands leading positions across multiple key geographic theaters: independent industry data credits Klarna with approximately 72% global website traffic share among BNPL specialists, a 48% volume share in Europe, and 26% market share by BNPL volume in the United States, ahead of rivals Afterpay (22%) and Affirm (19%).

      At the serviceable addressable market (SAM) level, equity research analysts model Klarna's addressable payments transaction volume at approximately $520 billion. In 2026, Klarna's actual operational traction demonstrates substantial scale within this serviceable pool: annual gross merchandise volume (GMV) guidance ranges between $149 billion and $151 billion, with Q2 2026 GMV reaching $36.6 billion (up 18% year-over-year globally and 27% in the United States). Full-year 2026 net revenue is guided to $4.08 billion–$4.16 billion, supported by an effective take rate of 2.84%–2.85% excluding accounting fair-value originations adjustments. This positions Klarna's Serviceable Obtainable Market (SOM) at approximately 29% of its $520 billion payment SAM.
