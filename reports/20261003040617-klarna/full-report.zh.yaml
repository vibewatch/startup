            body: >-
              信贷风险具备实质财务影响，原因在于 Klarna 承担无担保个人敞口，且在不断变化的宏观经济环境下高度依赖核保、反欺诈控制及催收。2026 年招股书披露截至 2025 年 6 月 30 日的借贷信用敞口为
              1046.3 亿瑞典克朗，而后续的 20-F 年报则采用不同币种、基准日与口径披露年末敞口为 152 亿美元；未经勾稽调节前，不应将两项数据视作连续增长序列。运营层面，招股书与 20-F
              均预警系统、网络、云基础设施、数据及第三方故障可能中断交易处理并推高合规成本。Klarna 披露了正式的网络安全监督机制，并表示 2025
              年排查出的威胁未对业务构成实质影响，但同时明确拒绝保证未发生未察觉事件。合作伙伴与公司自身对控制措施的描述属于风险缓解举措，并非对控制有效性的独立第三方测试。（原文量化锚点：$15.2b；104.63b）
