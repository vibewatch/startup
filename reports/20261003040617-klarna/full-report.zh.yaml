            body: >-
              Klarna的公司治理将对CEO Sebastian
              Siemiatkowski的极端关键人依赖与集中99.09%上市前投票权的双重股权架构绑定。潜在发行的C类超级投票权股赋予Siemiatkowski长达20年、最高15%的投票权，在2027年CFO与CMO即将交接引发管理摩擦之际，限制了外部股东的监督制衡。
