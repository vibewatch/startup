              Financing新增发放采用预期公允价值计价法。独立分析观点存在分歧：看多分析强调收入多元化与杠杆改善，利空报道则聚焦过往业绩不及预期以及长周期贷款风控未经周期考验。因此，财务研判对短期利润率趋势持建设性态度，但审慎结论取决于审计后的单品经济学、客群坏账周期、监管资本、实际定价水平以及应收款转让是否保持经济性。（原文量化锚点：$1.62；$1.65b；$4.08；$4.16b；$4.34b）
