      - number: '3.3'
        title: 定价机制、坏账拨备轨迹与护城河持久度
        blocks:
          - type: paragraph
            body: >
              Klarna与其核心竞对在变现结构与底层资金机制上存在显著分化。Klarna以支付处理商逻辑运作：历史上约70%的净营业收入来自商户交易费（平均在1.5%至2.9%之间，外加刷卡手续费及商户利差），并依托平均约40天的短期信贷周期实现年化周转高达9次
              [CP006, CP009]。相比之下，Affirm约半数收入来自平均期限11个月的较长周期消费贷款利息，使得资产负债表更易受资金成本波动及宏观利率冲击影响 [CP006]。


              尽管Klarna依托零售存款账户享有资金成本优势（占欧洲银行实体资金来源的约90%），但美国市场的迅猛扩张与日常微额交易的推进加剧了公司的信贷风险敞口 [CP001,
              CP006]。2025年9月挂牌上市后，Klarna于2025年11月披露信贷损失拨备同比激增102%，引致股东集体诉讼调查，指控其招股材料低估了向非成熟借款人发放外卖等生鲜易耗品分期贷款的风险特征
              [CP010, CP011]。与此同时，征信格局发生改变：征信机构已将BNPL数据纳入FICO Score 10 BNPL等信用评分模型，加剧了各主要支付机构客户对逾期罚息及违约上报的敏感度 [CP008,
              CP012]。
