  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: 零售分期服务商在分发网络规模与产品矩阵广度维度的序数定位。
    data:
      points:
        - label: Klarna
          x: 88
          'y': 85
          note: 覆盖日常金融、BNPL及汇聚120万余商户的购物Super App，产品生态布局最广。（原文量化锚点：1.2m）
        - label: Affirm
          x: 72
          'y': 48
          note: 深耕大额高客单零售核保与信用积累金融服务，Super App综合功能相对聚焦。
        - label: Afterpay
          x: 68
          'y': 40
          note: 在可选消费品零售结账场景深受消费者认可；多品类银行业务拓展克制。
        - label: PayPal Pay Later
          x: 92
          'y': 35
          note: 依托PayPal钱包实现极高收银台普及率，但专属功能深度较低，用户口碑偏弱。
        - label: Zip
          x: 45
