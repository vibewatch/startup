  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Klarna围绕标志性的BNPL分期付款与数字购物生态，提供灵活的结账融资与日常消费者银行服务。消费者可通过商户端托管结账跳转或嵌入式Web
              SDK直达Klarna，亦可通过独立的Klarna移动App及实体或虚拟Klarna
              Card使用服务。核心消费端产品将零售交易拆分为免息分期还款或延期账单结算，将违约与未付款风险从零售商户端剥离。面向商户伙伴，Klarna提供动态站内营销点位、开发者沙盒环境，以及支持自动化授权、扣款、取消及争议处理的订单管理API。在企业级规模下，Klarna在全球服务超1.2亿活跃消费者及超120万活跃合作商户，横跨16个国家的650万活跃Klarna
              Card持卡人与200万付费Klarna Membership订阅用户持续推高日常使用频次。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
