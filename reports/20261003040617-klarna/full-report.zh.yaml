      - number: '3.2'
        title: 产品能力、分发生态壁垒与运营权衡
        blocks:
          - type: paragraph
            body: >
              分发规模与生态嵌入是区隔Klarna与单点解决方案机构的核心防线。Klarna通过与主流支付服务商（PSP）及商户收单机构直连合作加速企业级分发，特别是打通J.P. Morgan
              Payments的收单网络实现商户自动开通，并接入Stripe与Clover POS终端 [CP001, CP007]。收单层分发显著降低了商户接入摩擦，免去结账环节的定制工程研发
              [CP001]。此外，通过与苹果合作在全美Apple Store线上零售渠道落地Apple Upgrade设备租赁计划，印证了Klarna向高客单价硬件生态的渗透策略 [CP001]。


              然而，Klarna向高频非耐用消费品以及自动化客服的激进扩张带来了明显的运营摩擦。主流消费者评价平台数据汇总显示，尽管界面简洁保持了较高的应用商店评分（4.8至4.9星），但客服争议处理与退款执行存在严重的系统性滞后
              [CP008]。客服响应周期动辄数天至数月，主因是过度依赖AI客服机器人；Klarna已于2025年底开始重新招募人工客服纠偏 [CP007,
              CP008]。此类服务脱节与Zip、Afterpay等在独立评价平台上维持更高消费者口碑的专业竞对形成鲜明对比 [CP004]。
            claimRefs:
              - CP001
