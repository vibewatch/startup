      - number: '1.2'
        title: 高管团队、治理机制与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Klarna的公司领导层仍以联合创始人Sebastian
              Siemiatkowski为核心，他自2005年2月起持续担任首席执行官兼董事，主导公司战略与运营。战略决策与日常执行分布于高管团队，包括首席产品与设计官David Fock、首席运营官Camilla
              Giesecke、首席财务官Niclas Neglén、首席营销官David Sandström、首席技术官Yaron Shaer以及首席商务官David Sykes。公司明确将Sebastian
              Siemiatkowski列为不可替代的关键人物，其离职将严重扰乱公司运营、创新文化及合作伙伴关系。董事会由前红杉资本合伙人Sir Michael J.
              Moritz爵士担任主席，主持九人董事会，成员包括前美联储副主席Roger W. Ferguson, Jr.、Heartland A/S首席执行官Lise Kaae、前Twitter执行董事长Omid R.
              Kordestani、红杉资本合伙人Andrew Reed、高盛前首席会计官Sarah Smith（审计委员会主席）以及Bolt创始人Markus
              Villig等知名独立与机构董事。然而，领导层稳定性近期面临换届挑战：在2026年Q2财报发布后，Klarna披露首席财务官Niclas Neglén与首席营销官David
              Sandström计划于2027年初离任交接，在业务转型期引入了过渡风险。
            claimRefs:
              - CO006
