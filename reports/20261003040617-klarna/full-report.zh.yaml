chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业主体、注册地与双重股权架构
        blocks:
          - type: paragraph
            body: >-
              Klarna Group plc于2005年由Sebastian Siemiatkowski、Niklas Adalberth和Victor
              Jacobsson以Kreditor之名创立于瑞典斯德哥尔摩，最初孵化于斯德哥尔摩经济学院商业实验室。二十年间，该项目从基于发票的货到付款服务转型为横跨26个国家运营的国际支付与日常商业网络。为筹备在纽约证券交易所上市，该集团于2024年5月完成国际公司重组，设立Klarna
              Group plc为依据英格兰和威尔士法律注册成立的公共有限公司，总部设于伦敦York Road 10号；同时保留斯德哥尔摩Klarna Bank
              AB的日常银行与监管实体，受瑞典金融监管局（Finansinspektionen）监管。2025年9月以股票代码KLAR完成首次公开募股后，Klarna确立了集中上市后投票权的双重股权架构。IPO前股东获得每股享有10票投票权但无分红权或清算权的B类普通股，使得老股东保留了上市后99.09%的投票权。此外，Klarna的公司章程允许仅向联合创始人兼首席执行官Sebastian
              Siemiatkowski及其关联实体发行每股10票投票权的C类股，上限为发行前投票权的15%，在维持外国私人发行人治理地位的同时，从制度上确立了管理层的长期控制权。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
