            body: >-
              资金来源与合作伙伴集中度将外部合作转化为运营约束。Klarna 披露 2025 年 90% 的资金来自 130 亿美元的个人储蓄存款，这一结构在 2026 年 Q2
              财报中再次印证；公司同时警告，资金成本与获取渠道可能随利率、市场情绪或交易对手变化而恶化。20-F 文件指出 AWS 为主要云服务商，将 AWS 和 Visa
              列为单一或排他性来源供应商，并指出登记商家（MoR）合作伙伴贡献了相当大比例的商户收入。需重点跟踪的季度指标包括：按产品与账龄划分的信贷拨备及违约率、存款留存率与资金成本、监管整改关键节点、系统正常运行时间与灾备恢复表现，以及合作伙伴集中度。投资逻辑颠覆触发条件包括：信贷损失持续走高且未获定价对冲、牌照遭遇实质限制、反洗钱或隐私问题再遭查处且未获解决、无法在测试恢复时效内替换关键供应商，或因核心需求疲软（而非汇率波动）连续下调业绩指引。
