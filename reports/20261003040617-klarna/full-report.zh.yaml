      - number: '7.2'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              Klarna 在多个司法管辖区承受银行、支付、消费信贷、隐私、反洗钱（AML）、制裁以及数字运营韧性等多重监管。最明确的既成合规信号是 2024 年 12 月瑞典金融监管局（SFSA）的警告及 5
              亿瑞典克朗罚款；Klarna 20-F 文件显示，该调查发现其在 KYC、客户尽职调查、风险分级、可疑交易分析及模型风险流程中存在缺陷，并阐述了后续整改措施。2026 年招股书则将违反 GDPR
              以及资本和流动性要求列为极重大风险。虽然证券集体诉讼已经立案，但现有材料仅表明原告指控，尚未裁定法律责任或赔偿金额。在投资研判上，关键不在于折现计提确切的诉讼损失，而是在认定合规整改彻底完成前，必须获取主监管机构结案证据并核查当前法庭卷宗记录。
