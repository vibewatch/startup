              Klarna等BNPL机构收取2.0%至3.5%的商户折扣费，显著高于普通信用卡刷卡手续费。商户之所以接受该费率，是因为分期付款能直接解决电商结账摩擦，经证实可带来20%至30%的销售转化率提升，并将客单价提高30%至50%。
