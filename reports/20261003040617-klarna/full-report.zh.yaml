      - number: '8.4'
        title: 附注与图表
        blocks:
          - type: callout
            title: 信用与诉讼阴霾下宜保持审慎克制
            body: >-
              Klarna 在 2026 年 Q2 持续实现 GAAP 盈利（营业利润 2700 万美元，净利润 900
              万美元），证实了其日常金融网络的可扩展性。然而，鉴于信贷损失披露相关的未决证券诉讼以及德国市场业绩指引下调，当前约 3.4
              倍远期营收估值已充分反映近期执行预期。建议对该标的保持“观察”（track），直至法律责任理清且信贷拨备趋势彻底企稳。
            calloutType: recommendation
