            title: 区域零售敏感性与交易利润韧性对比
            body: >-
              尽管Klarna在2026年Q2下调年度GMV指引凸显了对德国等欧洲核心市场零售宏观环境的敏感度，但其交易利润总额同比扩张42%至4.46亿美元，证明低成本消费者存款（支撑90%应收款）与订阅升级提供了防御性盈利杠杆。
