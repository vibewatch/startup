  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与支出范畴
        blocks:
          - type: paragraph
            body: >-
              Klarna的核心商业引擎定位于数字支付处理、POS端消费信贷分期贷款与移动银行服务三大金融及商业软件层的交汇点。若要审慎评估Klarna的潜在市场空间，必须将市场明确划分为涵盖的交易量、手续费利润池以及排除在外的相邻金融品类。Klarna交易量的基石是短期BNPL（先买后付），核心产品形态为30天免息付款（Pay
              in 30 days）以及按双周或按月收取的3期或4期免息分期（Pay in 3 / Pay in
              4）。在此核心机制下，商户支付约2.74%的费率，以释放潜在消费需求并提升购物车结算转化率；作为交换，消费者按期履约无需支付任何利息或复利罚息。


              除免息短期延期付款外，Klarna逐步拓展至期限3至48个月、年化利率最高达35.99%的较长期Fair Financing贷款产品，同时提供基于借记卡的Klarna Card
              POS支付、应用内赞助联盟营销以及欧洲司法管辖区内的持牌数字存款银行服务。这些扩张拓宽了Klarna在线上线下渠道的交易捕获能力，在全球覆盖超1.2亿年活跃消费者与120万家合作商户。


              相反，审慎的市场规模测算必须剔除传统企业金融服务与抵押消费信贷的大部分板块。房贷发起、商业汽车租赁、大型企业循环信贷额度、B2B资金管理运作，以及缺乏直接POS消费者关系软件的传统刷卡转接清算网络，均不在Klarna的服务范围之内。此外，发卡行通过复利计息与违约罚金赚取丰厚净息差的传统高息循环信用卡余额，属于Klarna重点替代的存量靶标，而非其可直接获取的运营交易额池。（原文量化锚点：1.2m；120m）
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 市场规模测算：TAM、SAM与受证据约束的市场机会
        blocks:
          - type: paragraph
            body: >-
              测算Klarna的商业空间需要从多重视角切入，而非依赖单一无约束的顶层预测。从最宽的宏观口径看，潜在市场总量（TAM）既可理解为Klarna展业地区18万亿美元的全球消费零售与旅游支出（按2.5%平均变现率推算，对应约4500亿美元潜在商户手续费收入），亦可参照BNPL正在拆解并替代的8万亿美元传统循环信贷行业。尽管这些宏观总量勾勒出电子消费与家庭循环信贷的理论天花板，但混淆了非可选消费支出与线上结账交易，大幅高估了单一支付网络现实中所能捕获的份额。


              更具实操意义的分析视角聚焦于全球专用BNPL市场，独立测算该市场交易额约2600亿美元。在该市场内，Klarna在多个核心区域占据领先地位：独立行业数据表明，Klarna在BNPL专业平台中占据约72%的全球网站访问份额，在欧洲拥有48%的交易额份额，在美国以26%的BNPL交易额份额领先对手Afterpay（22%）和Affirm（19%）。


              到了可服务市场（SAM）这一层，券商研报测算Klarna对应可服务支付交易额约5200亿美元。2026年，Klarna在这一市场展现出显著运营规模：全年商品交易总额（GMV）指引介于1490亿至1510亿美元之间，2026年Q2
              GMV达366亿美元（全球同比增长18%，美国同比增长27%）。2026全年净营收指引为40.8亿至41.6亿美元，剔除会计公允价值发放调整后的有效变现率为2.84%至2.85%。因此Klarna的可获取服务市场（SOM）约占其5200亿美元支付SAM的29%。（原文量化锚点：$149b；$151b；$18t；$260b；$36.6b；$4.08b；$4.16b；$450b；$520b；$520b；$8t）
