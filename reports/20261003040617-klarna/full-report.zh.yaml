  - number: 6
    title: 客户与商户
    sections:
      - number: '6.1'
        title: 双边网络分群与规模化参与
        blocks:
          - type: paragraph
            body: >-
              Klarna运营着一个连接全球逾1.2亿活跃消费者与超120万商户伙伴的规模化双边商业网络。消费客群分为两类：使用4期免息（Pay in 4）与30天延期（Pay in 30
              days）核心分期产品的偶发购物者，以及使用Klarna Card、返现奖励与付费Klarna
              Memberships的高频数字银行用户。在商业供给端，商户涵盖H&M、Sephora、Nike、Airbnb等大型多品牌零售商，以及数十万通过电商平台和支付服务商集成标准化支付的中小电商创作者与独立站卖家。这种双边架构催生了自我强化的分发飞轮：消费者对灵活支付的需求促使商户在结账端引入Klarna，而商户覆盖面的扩大进一步带动重复交易量，拉低了各竞争零售品类的综合获客成本。（原文量化锚点：1.2m；120m）
