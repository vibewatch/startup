      - number: '1.3'
        title: 融资历程、估值周期与机构支持方
        blocks:
          - type: paragraph
            body: >-
              Klarna的资本化轨迹反映了过去十年金融科技资产极端的周期性波动。公司于2010年获得红杉资本早期机构注资，随后获得General Atlantic、DST
              Global和Northzone的扩张资本。在2021年6月疫情电商红利期，由软银愿景基金2期领投的一轮股权融资对该业务估值约460亿美元，使其成为欧洲估值最高的未上市科技公司。然而，随后的宏观紧缩与利率上升迫使估值在2022年7月经历剧烈重置，当时Klarna以67亿美元投后估值融资8亿美元——估值缩水约85%。股权结构表通过内部人融资逐步企稳，包括2022年7月至2023年3月期间由红杉资本、Victor
              Jacobsson、Sebastian
              Siemiatkowski及澳大利亚联邦银行支持、均价每股18美元的8.13亿美元融资。2025年9月，Klarna以每股40.00美元成功完成美国首次公开募股，发行5,000,000股一级普通股，并为老股东出售的29,311,274股提供二级流动性，首日开盘市值达173亿美元。机构支持方影响力仍集中于红杉资本（持有IPO后超20%股权）、Heartland
              A/S（丹麦亿万富翁Anders Holch Povlsen的投资实体）及澳大利亚联邦银行，前创始人Victor Jacobsson与Sebastian
              Siemiatkowski持有大量个人股权。（原文量化锚点：$17.3b；$18；$40.00；$46b；$6.7b；$800m；$813m）
            claimRefs:
