      - number: '5.2'
        title: 软件技术栈与数据湖仓架构
        blocks:
          - type: paragraph
            body: >-
              Klarna的后端架构依托解耦的领域微服务与云原生分析型数据基础设施，旨在保障横向扩展能力与高交易并发度。为解决Node.js后端开发复杂度与中间件调用链路脆弱的问题，Klarna工程团队自主研发了名为Steve
              the
              Stitcher的内部微服务框架。Steve封装了Inversify依赖注入库，严格将HTTP及事件驱动传输控制器与核心领域服务及外部客户端适配器隔离开来，同时强制执行载荷校验与关联ID透传。与此同时，Klarna历时多年完成了从本地陈旧数据库及Hadoop集群向AWS云端统一数据湖仓的迁移。该数据架构结合Amazon
              S3对象存储沉淀原始交易数据，通过托管在EMR上的Apache Spark集群与Amazon Redshift分析型数据仓库进行大规模数据计算，经由Jenkins CI/CD自动化与定制化Apache
              Airflow数据流水线统一编排调度。
