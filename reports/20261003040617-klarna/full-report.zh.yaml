      - number: '2.3'
        title: 买方分群、价值主张与经济飞轮
        blocks:
          - type: paragraph
            body: >-
              Klarna的市场渗透依赖于连接零售企业商户与零售消费者的双边支付与商业网络。这两类参与群体的经济动力与预算归属存在根本差异。在商户端，预算决策权归属于数字商务、营销与支付工程部门。大中型零售商受结账转化率等核心指标驱动：RBC
              Capital
              Markets研报显示，结账环节集成Klarna预计可提升20%至30%的转化率，并将客单价（AOV）提升30%至50%。这些转化改善足以抵消2%至3%的商户手续费，使Klarna从成本项支付工具转变为获客与创收渠道。2026年，Klarna通过直连美国最大商户收单机构J.P.
              Morgan Payments（年交易处理量达2.6万亿美元）获得重大分发突破，商户无需定制代码即可开通Klarna。


              在消费者端，驱动采纳的核心动力是摆脱掠夺性循环信用卡的结构性转变，在年轻的Z世代和千禧一代中尤为突出。消费者调研显示，70%的BNPL用户更偏好分期付款而非传统信用卡，59%的用户表示愿意完全替代信用卡。Klarna面向消费者的价值主张是提供可预期的免息还款计划，消除复利债务陷阱。此外，随着用户从单次结账分期用户进阶为多产品App订阅会员，消费者粘性持续加深：截至2026年中，Klarna
              Memberships付费订阅用户同比增长八倍至200万，Klarna
              Card在16个国家拥有650万活跃用户。在瑞典等成熟市场，活跃消费者年均交易达33次，推动2026年Q2每活跃消费者平均收入同比增长24%。
            claimRefs:
