      - number: '2.4'
        title: 增长驱动力、信贷脆弱性与不利法律约束
        blocks:
          - type: paragraph
            body: >-
              Klarna的发展轨迹取决于数字商务结构性红利与日益趋紧的信贷、监管及法律约束之间的微妙平衡。在增长端，扩张动力来自美国市场的快速普及（2026年Q2 GMV同比增长27%）、Apple
              Store线上线下Apple Upgrade计划等战略分发协议，以及较长期Fair
              Financing渗透率的提升。由于Klarna在欧洲拥有以低成本零售银行存款为主的资金来源（占资金来源的90%），并辅以与Nelnet、Elliott及Värde
              Partners等机构签署的远期流动协议，其资金成本在结构上低于非银行金融科技竞对。


              然而，激进扩张至高频小额日常消费交易引发了严峻的运营漏洞与不利市场审视。2025年9月在纽交所以每股40美元（估值151.1亿美元）IPO后，Klarna在2025年Q3财报中披露信贷损失拨备同比激增102%。信贷拨备的突然恶化引发股价大跌——较发行价下跌近33%至约28.50美元——并引来多起证券欺诈集体诉讼，包括纽约东区联邦地区法院受理的Nayak诉Klarna
              Group plc案。


              诉讼指控Klarna在IPO招股书中对信贷风险存在重大瞒报，未披露贷款增长主要由向陷入财务困境的非成熟消费者放贷所驱动，包括外卖等非耐用品分期微贷。此外，Klarna交易量第一大市场德国面临宏观逆风，迫使管理层将2026全年GMV指引从超1550亿美元下调至1490亿至1510亿美元。这些情况表明，面对消费者债务疲劳与宏观周期转向，Klarna的信贷风控算法仍具有高度脆弱性。（原文量化锚点：$149b；$15.11b；$151b；$155b；$28.50；$40）
            claimRefs:
              - CM006
              - CM007
              - CM010
