  - id: FI001
    title: 2026年Q2营收至交易毛利拆解桥接图
    type: flow
    summary: 公司报告的业务活动分流为三条收入管线，扣除交易成本后得出交易毛利额。
    data:
      nodes:
        - id: activity
          label: 消费者与商户端交易活动
          value: 36.6
          unit: $bn GMV
          detail: 2026年Q2商品交易总额；GMV不等于营业收入。
        - id: service
          label: 交易服务收入
          value: 707
          unit: $m
          detail: 包含支付与服务收入；订阅收入同比增长超600%。
        - id: interest
          label: 利息收入
          value: 266
          unit: $m
          detail: 由当期及既往各期发起的消费信贷业务共同驱动。
        - id: sale
          label: 贷款出售收益
          value: 69
          unit: $m
          detail: 包含美国远期转让资产与德国存量信贷资产（back-book）出售收益。
        - id: revenue
          label: 营业总收入
          value: 1042
          unit: $m
          detail: 2026年Q2报告营业收入。
        - id: costs
          label: 交易成本
          value: 596
          unit: $m
          detail: 处理与服务费、信贷损失拨备及资金成本。
        - id: tmd
          label: 交易毛利额（TMD）
          value: 446
          unit: $m
          detail: 非IFRS指标，等于营业收入减去交易成本。
      edges:
        - from: activity
          to: service
          label: 支付与服务变现
        - from: activity
          to: interest
          label: 信贷应收账款计息
        - from: activity
          to: sale
          label: 应收账款出售
        - from: service
          to: revenue
        - from: interest
          to: revenue
        - from: sale
          to: revenue
        - from: revenue
          to: costs
          label: 扣除交易成本负担得出TMD
        - from: costs
          to: tmd
          label: 营收减去交易成本
    approximationNotes: 数值源自公司报告的2026年Q2业绩；该图为关系示意图，非等比例渲染，亦不意味着GMV以匀速转化为营收。
