      - number: '6.2'
        title: 消费者采纳轨迹与日常金融拓展
        blocks:
          - type: paragraph
            body: >-
              Klarna的消费者采纳已从初期的线上结账分期拓展至更广泛的日常财务管理。截至2026年中期末的12个月内，该网络覆盖1.2亿活跃消费者，随着消费者将Klarna融入日常消费习惯，每活跃用户平均收入同比大增24%。在POS融资之外的产品线上，渗透速度尤为迅猛：Klarna
              Card活跃持卡人翻了近五倍至横跨16个国家的650万人；付费Klarna
              Memberships突破200万订阅用户，推动订阅收入同比增长超600%。区域活跃度同样印证了粘性的提升，例如法国移动App月活跃用户同比增长221%至290万人。通过将即时授信与个性化购物推荐整合至对话式AI工具，Klarna在旅游、日常零售与健康服务等非可选消费品类中捕获了更高频的支出。（原文量化锚点：120m；2.9m；2m；6.5m）
