      - CI001
      - CI002
      - CI004
      - CI005
  - id: FE001
    title: 产品技术架构图
    type: stack
    summary: 涵盖用户展现、API网关、微服务编排、核心领域逻辑、风险决策及云端数据基础设施的六层产品技术架构。
    data:
      layers:
        - label: 客户端展现与渠道接入层
          description: 贯通移动App、嵌入式结账SDK、店内支付终端及Klarna实体/虚拟卡的消费者触点。
          modules:
            - Klarna 移动应用（iOS / Android）
            - 嵌入式网页与托管结账SDK
            - Klarna实体卡与虚拟卡
        - label: 边缘网关与接入层
          description: 处理请求体校验、鉴权令牌、速率限制及Webhook事件分发的API网关。
          modules:
            - REST API与Webhook分发器
            - 商户合作伙伴门户与深度链接
            - 平台插件（Adobe, BigCommerce）
        - label: 微服务编排与传输层
          description: 内部Steve框架，负责管理Inversify依赖注入、HTTP控制器校验及链路关联ID追踪。
          modules:
            - Steve the Stitcher IoC容器
            - 请求校验控制器
            - 客户端传输适配器
        - label: 核心领域与结算服务层
          description: 独立管理订单生命周期、分期还款试算、支付扣款与退款的领域微服务。
          modules:
            - 订单管理API（请款 / 退款）
            - 分期还款计划引擎
            - 商户结算与外汇汇率计算
        - label: 核保与风险决策引擎
          description: 在结账环节实时评估身份核验、反欺诈甄别与信用状况的决策系统。
          modules:
            - 亚秒级信贷决策逻辑
            - 行为欺诈与高频异常评分
            - 合作方KYC与反洗钱核验渠道
        - label: 云端数据湖仓与持久层
          description: 支持大规模分析处理、数据管道编排及BI报表的云原生数据平台。
          modules:
            - Amazon S3对象存储
            - Amazon Redshift分析型数据仓库
            - EMR上的Apache Spark与Apache Airflow
    approximationNotes: null
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从商户结账初次触达，到即时核保、灵活支付执行及常态化会员互动的六阶段消费者生命周期。
    data:
      items:
        - label: 结账触达
          detail: 消费者在零售合作方线上结账或店内POS收银台看到Klarna标识或弹窗。
          tone: neutral
        - label: 即时核保
          detail: 数秒内完成实时软性信用评估与反欺诈核验，不影响信用评分。
          tone: positive
        - label: 灵活支付
          detail: 消费者选择四期免息（Pay in 4）、30天延期（Pay in 30 days）或分期贷款；商户扣除处理费后预先收到全额结算款项。
          tone: positive
        - label: App体验引导
          detail: 消费者在移动App中跟踪待还分期账单、安排提前还款并监测物流交付状态。
          tone: neutral
        - label: 日常银行业务与银行卡
          detail: 用户申领并使用Klarna Card进行线下借记消费，赚取返现并统一管理个人开支。
          tone: positive
        - label: 订阅会员与忠诚度计划
          detail: 高频消费者加入Klarna Memberships，获取更丰厚奖励、航司积分兑换及专属商户特惠。
          tone: positive
    approximationNotes: 生命周期阶段综合自Klarna消费者入驻文档及披露的App产品界面。
