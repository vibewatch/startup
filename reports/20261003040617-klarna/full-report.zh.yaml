              Financing应收款，实现5700万美元收益。这些数据证实了流动性与资金获取渠道，但不同于初创公司的常规现金跑道：银行经营现金流包含贷款投放与存款吞吐变动，若无监管资本与流动性对账桥接，不可将Q1现金减少直接定性为现金消耗。（原文量化锚点：$1.2b；$1.415b；$12.301b；$17b；$2.806b；$2b；$57m）
