figures:
  - id: FO001
    title: Klarna战略演进与关键里程碑
    type: timeline
    summary: 梳理Klarna从斯德哥尔摩的发票保理初创企业，演进为上市数字银行及日常支付网络的历程。
    data:
      items:
        - label: '2005'
          detail: 由Sebastian Siemiatkowski、Niklas Adalberth和Victor Jacobsson在斯德哥尔摩创立，原名Kreditor。
          tone: neutral
        - label: '2010'
          detail: Sequoia Capital领投首轮美国机构风投，开启国际化规模扩张。
          tone: positive
        - label: '2017'
          detail: 获瑞典金融监管局（Finansinspektionen）全面银行牌照，作为Klarna Bank AB展业。
          tone: positive
        - label: '2021'
          detail: SoftBank Vision Fund 2领投融资，推升Klarna至460亿美元未上市估值顶峰。
          tone: positive
        - label: '2022'
          detail: 在8亿美元资本重组中估值骤降85%至67亿美元；集团开启削减成本并转向AI战略。
          tone: warning
        - label: '2024'
          detail: Finansinspektionen开出5亿瑞典克朗反洗钱罚单；Klarna将母公司迁至英国。
          tone: adverse
        - label: '2025'
          detail: 以40.00美元/股完成纽交所IPO（代码KLAR，估值173亿美元）；推出KlarnaUSD稳定币。
          tone: positive
        - label: '2026'
