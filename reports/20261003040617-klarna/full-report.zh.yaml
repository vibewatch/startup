      - number: '6.4'
        title: 留存韧性、信贷承销审视与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管业务势头强劲且2026年Q2交易利润总额同比增长42%至4.46亿美元，但客户留存韧性面临承销严谨度与宏观波动的双重拷问。2025年9月Klarna完成IPO后，一宗股东集体诉讼对招股披露提出异议，指控其消费端迅猛扩张源于向外卖等非耐用品发放高风险贷款，直接导致信贷损失拨备当期激增102%。尽管Klarna在2026年Q2将信贷损失拨备率控制在GMV的0.52%（低于去年同期的0.56%），但信贷风险对德国等核心区域的经济状况高度敏感；德国交易量的疲软促使管理层将全年GMV指引调降至1490亿至1510亿美元。此外，Klarna未公开披露细分客群的净金额留存率（NRR）或商户流失率指标，在初期促销补贴退潮后，基础商户的留存韧性仍有待观察。（原文量化锚点：$149b；$151b；$446m）
