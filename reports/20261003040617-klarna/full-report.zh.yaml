      - number: '8.3'
        title: 估值情景推演与尽调问询重点
        blocks:
          - type: paragraph
            body: >-
              评估 Klarna 的股权内在价值，需要考察其在信贷表现、商户分发拓展速度与欧洲消费支出不同走势下的经营情景分化。乐观情景下，J.P. Morgan Payments 与 Apple Upgrade
              项目推进带动美国交易毛利率向欧洲水平收敛（欧洲为 54%–60%，美国为 23%），推动 2026 财年调整后营业利润突破 3.5 亿美元，支撑远期市销率重估至 5.0 倍。基准情景下，欧洲零售降温使 GMV
              维持在 1500 亿美元左右，调整后营业利润落在指引区间 2.8 亿至 3.0 亿美元，对应合理估值 140 亿至 150 亿美元。悲观情景下，证券集体诉讼引发负面连锁反应，或次级消费者还款意愿恶化导致拨备率超过
              GMV 的 1.0%，估值倍数压缩至 2.0 倍市销率，市值下探至 80 亿美元附近。尽调核心重点包括：独立跟踪 Hagens Berman 发起的证券诉讼法院卷宗、审计远期转让表外追索条款，以及核查
              Klarna 在犹他州申请 FDIC 银行牌照是否获得正式监管批准以降低第三方资金摩擦。（原文量化锚点：$350M；$150B；$280M；$300M；$14B；$15B；$8B）
            claimRefs:
              - CV003
