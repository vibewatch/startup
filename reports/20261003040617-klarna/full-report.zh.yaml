  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险优先级与剩余风险敞口
        blocks:
          - type: paragraph
            body: >-
              公司的风险特征主要由三者交织主导：庞大的无担保消费信贷资产、持牌银行监管义务，以及必须保持交易级高可用的数字支付平台。截至 2025 年 12 月 31 日，Klarna 披露的消费信贷敞口为 152
              亿美元；2026 年 Q2 拨备率由去年同期的 GMV 0.56% 降至 0.52%。这一改善虽具正面意义，但并非经历完整周期的压力测试结果。此外，受汇率折算影响及对德国交易量预期趋于审慎，公司将 2026 年
              GMV 预期从超过 1550 亿美元下调至 1490 亿至 1510
              亿美元。因此，风险热图将信贷、监管、网络安全、资金来源及支付生态连续性置于普通执行风险之上，且风险缓解成熟度仅按已披露控制措施评分，不预设其有效性。（原文量化锚点：$149；$15.2b；$151b；$155b）
