      - number: '5.3'
        title: 生态集成与企业级分发
        blocks:
          - type: paragraph
            body: >-
              公司通过与全球电商平台、支付服务商（PSP）及商户收单网络的深度技术集成建立分发广度。Klarna并未单纯依赖逐个商户落地定制软件开发，而是面向Adobe
              Commerce、BigCommerce、Adyen及Checkout.com等主流商业平台分发标准化插件与预认证连接器。这一间接分发策略在2026年通过与J.P. Morgan
              Payments的企业级合作迎来重大飞跃，无需定制店铺代码即可在J.P.
              Morgan平台的商户中全量自动开通Klarna支付套件。技术集成边界通过正式的网络分发协议进行约束，收单伙伴与支付机构根据标准化分发规则，共同承担商户审核、KYC认证、反洗钱合规监控与争议结算管理的日常职责。
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE014
      - number: '5.4'
        title: 风控机制、安全性与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Klarna的商业模式立足于亚秒级结账延时内完成算法信贷评估，以守护交易转化率。专有决策引擎实时解析购物车元数据、历史还款表现、设备遥测数据与行为信号，无繁琐资料要求即可即时计算买家资质并动态设定交易额度。在受监管的金融司法辖区展业，要求系统严格遵循合规标准，包括PCI
              DSS持卡人数据加密、GDPR隐私合规与PSD2强客户身份认证（SCA）要求。为控制财务敞口，机器学习反欺诈模型与自动化身份验证体系持续并行运转，使2026年Q2报告的信贷损失拨备维持在GMV的0.52%。然而，模型漂移、特定品类违约敏感性以及宏观经济下行周期中损失曲线的不透明性，仍构成承销评估的实质性尽调盲区。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
