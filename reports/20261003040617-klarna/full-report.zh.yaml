  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与战略定位
        blocks:
          - type: paragraph
            body: >-
              全球BNPL与数字分期支付行业正在经历深度的结构性整合与竞争极化。Klarna的核心价值主张建立在连接全球逾1.2亿活跃消费者与超120万商户合作伙伴的双边网络之上 [CP001,
              CP002]。与主要充当信贷发放方的垂直POS贷款机构不同，Klarna将自身定位为一体化购物与日常金融网络，提供涵盖4期免息分期（Pay in 4）、30天延期账单（Pay in 30
              days）、较长期分期贷款（Fair Financing）及实体/虚拟支付卡的完整产品矩阵 [CP002, CP003]。


              在竞争版图中，Klarna面临来自专用BNPL金融科技、数字钱包巨头、传统银行卡网络及发卡银行的多层次竞争。在北美和西欧，其核心纯BNPL对手为Affirm以及Block旗下的Afterpay，此外还包括发源于澳大利亚的Zip
              [CP004, CP005]。Affirm围绕高客单价、透明分期及清晰APR披露定位，直接通过消费贷款利息获取大量收入 [CP004,
              CP006]。Afterpay聚焦可选生活方式品类的无摩擦商户结账与消费者品牌忠诚度，在评价平台保持较高的消费者好评度 [CP004, CP005]。与此同时，老牌平台PayPal通过嵌入生态的PayPal
              Pay Later切入结账环节，依托广泛商户覆盖获客，但独立消费者评价评分偏低 [CP004]。（原文量化锚点：1.2m；120m）
            claimRefs:
              - CP001
