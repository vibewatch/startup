      - number: '8.2'
        title: 当前估值背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              Klarna 的融资历程展现了跨融资周期的剧烈估值震荡：从 2021 年 6 月私募投后估值顶峰的 456 亿美元，跌至 2022 年 7 月的 67 亿美元，最终于 2025 年 9
              月登陆纽交所。历史上，Klarna 历经 23 轮融资累计吸收 41.9 亿美元股权资本，并辅以庞大的债权融资支持，包括 2025 年 8 月规模达 16.3 亿美元的传统债权融资，以及 2026 年 7
              月宣布的 9 亿欧元德国远期转让（forward-flow）循环信贷额度。该远期转让结构滚动出售德国 Fair Financing 定期贷款与新增应收账款，隔离了资产负债表的信用集中风险。2026 年
              Q2，Klarna 取得 GAAP 营业利润 2700 万美元（2025 年 Q2 为亏损 4600 万美元），净利润 900 万美元，确立了连续 GAAP 盈利态势。按 2026 全年预期营收 40.8 亿至
              41.6 亿美元、调整后营业利润目标 2.8 亿至 3.0 亿美元测算，当前股价对应约 3.4 倍至 3.5 倍远期营收。然而，尽管 2026 年 Q2 信贷损失拨备稳定在 GMV 的
              0.52%，但鉴于原告指控非耐用品借贷推高违约倾向，拨备表现仍需接受持续审视。（原文量化锚点：$45.6B；$6.7B；$4.19B；$1.63B；€900M；$27M；$46M；$9M；$4.08B；$4.16B；$280M；$300M）
            claimRefs:
              - CV001
