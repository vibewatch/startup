- id: SO-product-ecosystem
  title: Software-defined ecosystem and physical footprint
  body: 'The company’s differentiation story is more integrated than the “scooter maker” label suggests. In formal offer documents Ather describes itself as a pure-play EV company selling electric two-wheelers plus associated software, charging infrastructure and smart accessories conceptualised and designed in India. The annual report expands that argument: AtherStack provides navigation, analytics, ride assistance, safety and productivity layers, while the company’s charging infrastructure combines portable home chargers with the Ather Grid public network and LECCS interoperability ambitions. The FY2024-25 annual report disclosed 3,611 chargers across 360-plus cities and 375 global experience centres, while more recent management commentary cited by Outlook Business points to 4,322 charging points by Q2 FY26. That combination of retail reach, charging density and software updates is the strongest reason Ather still commands premium-brand positioning despite heavier competition from mass-market
    incumbents.'
  claimRefs:
