  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TO002 leadership depth and headcount
    missingEvidence: Current total employee count, board depth below founders, and functional succession depth beyond the disclosed R&D share.
    whyItMatters: Investors need operating leverage and management-bench context, especially after listing and expansion.
    diligencePath: Request current org headcount, manufacturing headcount, engineering headcount and a management-org chart from management.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: TO003 Hero stake and post-IPO ownership
    missingEvidence: Clean post-IPO Hero MotoCorp ownership percentage with current free-float breakdown and other top holders.
    whyItMatters: Ownership concentration affects governance, valuation support and strategic optionality.
    diligencePath: Use the latest exchange shareholding pattern and reconcile it against pre-issue prospectus tables and IPO allotment disclosures.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 full milestone chronology
    missingEvidence: Store-level opening cadence, international channel chronology and more precise dates for some technical and governance milestones.
    whyItMatters: The overview can show scale, but not every dated operational milestone needed for a full longitudinal operating history.
    diligencePath: Request an internal milestone deck or build a management timeline from board decks and monthly MIS packs.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
