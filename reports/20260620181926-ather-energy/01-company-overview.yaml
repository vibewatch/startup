company:
  name: Ather Energy
chapter:
  number: 1
  title: Company Overview
  summary: Ather Energy is a Bengaluru-founded electric two-wheeler company that has already crossed from startup into newly public operating company, with two scooter lines, a meaningful charging-and-software ecosystem, and unusually rich public disclosures for an Indian EV player. The company entered the unicorn club in 2024 at roughly a $1.3 billion valuation, listed in May 2025, and grew FY26 revenue to ₹3,671.76 crore while still remaining loss-making. The core overview conclusion is that Ather has real product, brand and ecosystem depth, but not yet a fully de-risked profitability profile.
sections:
- id: SO-identity
  title: Identity, product scope, and operating model
  body: 'Ather Energy is now best understood as a newly public Indian electric two-wheeler company rather than a classic early-stage startup. The company was founded in Bengaluru in 2013 by IIT Madras alumni Tarun Mehta and Swapnil Jain, and its current legal and reporting posture is that of a listed entity on both NSE and BSE. That matters because the diligence baseline has shifted: unlike many private EV peers, Ather now publishes annual reports, prospectus disclosures, integrated exchange filings, and secretarial compliance documents that let investors triangulate management claims against formal filings. The operating identity that emerges from those materials is consistent. Ather sells a premium electric scooter ecosystem built around the 450 performance line and the Rizta family line, with charging, software, accessories and subscriptions treated as part of the same product system rather than side businesses.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
