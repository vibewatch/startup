runDate: '2026-06-20'
company:
  name: Ather Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Ather’s public filings now support a real scale-and-improvement story: FY26 revenue from operations reached
    ₹3,671.76 crore, quarterly and annual losses narrowed sharply, and non-vehicle ecosystem revenue is becoming a
    disclosed contributor rather than a vague narrative. But the same record still shows a hardware-heavy cost base,
    continuing factory and R&D spend requirements, and too little disclosure on cash conversion, service gross
    margin, and store-level productivity to call the model financially de-risked.
sections:
  - id: revenue-quality-and-pricing
    title: Revenue quality, pricing, and mix
    body: >-
      Ather’s open-source financial record is strong enough to establish the broad shape of revenue quality, but not
      yet strong enough to fully underwrite it. FY25 reporting gives the cleanest audited mix view: 88% of revenue
      came from vehicle sales and 12% from non-vehicle streams. That matters because the company is not presenting as
      a pure scooter-ASP story anymore. Q2 FY26 reporting sharpened the picture by naming software subscriptions,
      charging, accessories, spares, and service as the main non-vehicle contributors. In other words, Ather is trying
      to monetize an installed-base ecosystem rather than only one-time scooter deliveries.

      What remains missing is realization detail. Official product pages publish current ex-showroom prices for the 450
      and Rizta families, and those price points sit above the FY25 revenue-per-vehicle figure. That gap is not
      automatically negative; it likely reflects model mix, discounting, financing, subsidies, and the fact that
      realized revenue is not equivalent to headline list price. But it does mean investors still cannot tell how much
      of the top line is driven by durable pricing power versus policy support and ancillary monetization. Revenue
      quality is improving, but it is not yet disclosure-complete.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI013
      - CI020
      - CI021
      - CI037
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-and-margin-path
    title: Cost structure, gross margin, and unit-economics path
    body: >-
      The FY26 filing shows a cost structure that still looks unmistakably hardware-heavy. Cost of materials consumed
      alone was ₹2,808.15 crore, far larger than any other expense line, which means Ather’s margin story still lives
      or dies on procurement discipline, design simplification, supply-chain execution, and inventory management.
      Employee cost, finance cost, depreciation, and marketing remain meaningful but secondary relative to BOM
      economics. That is consistent with prospectus and annual-report definitions of gross-margin mechanics, which
      center materials, stock-in-trade, and inventory changes rather than any software-style revenue-leverage story.

      Even so, the direction of travel is clearly improving. FY25 adjusted gross margin reached 19%, while adjusted
      gross margin without subsidy was only 12%, showing both progress and ongoing sensitivity to incentives. Q2 FY26
      coverage pushed the improvement narrative further, with adjusted gross margin at ₹210.6 crore or 22% and EBITDA
      margin at -10%. Reuters-style FY26 coverage attributed the first-ever annual loss decline to Rizta demand and
      lower unit costs. The right conclusion is not that Ather has solved unit economics; it is that there is now
      credible evidence of a margin path, but the open record still cannot cleanly separate structural improvement from
      mix uplift and policy support.
    claimRefs:
      - CI002
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
      - CI017
      - CI018
      - CI019
    tableRefs:
      - TI003
      - TI006
    figureRefs:
      - FI002
  - id: capital-adequacy-and-use-of-funds
    title: Capital adequacy, liquidity, and use of funds
    body: >-
      The prospectus makes clear that the IPO was not a maturity event in which Ather simply repaired the balance
      sheet; it was a forward-investment raise. The biggest planned bucket was ₹927.2 crore for a Maharashtra electric
      two-wheeler factory, followed by ₹750 crore for R&D, ₹300 crore for marketing, and only ₹40 crore for borrowing
      repayment. That split alone tells you the company still needs substantial capital to fund manufacturing scale and
      product development. The May 2026 utilization table reinforces the point. Only a fraction of the factory,
      marketing, and R&D allocations had been deployed by that date, so much of the capex and commercialization burden
      still sits ahead of the company rather than behind it.

      Balance-sheet disclosure is good enough to show resources, but not enough to close the runway question. The FY26
      filing disclosed more than ₹1,375 crore across investments, cash, and bank balances, plus a broader ₹2,683.63
      crore current-financial-asset base and manageable non-current borrowings. A simple loss-based runway proxy makes
      headline liquidity look comfortable, but that estimate almost certainly flatters reality because it ignores
      inventory swings, working-capital absorption, and future factory spend. The financial view here is that Ather is
      funded to keep operating and investing, but not yet funded so transparently that outside investors can stop asking
      for a board-grade cash plan.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI033
      - CI039
    tableRefs:
      - TI004
    figureRefs:
      - FI003
  - id: financial-verdict-and-blockers
    title: Financial verdict and remaining blockers
    body: >-
      The strongest positive conclusion is that Ather now has enough public evidence to prove it is a real scaled
      operating company, not an aspirational EV story. Revenue has stepped up sharply, losses have narrowed, Rizta has
      broadened the demand base, and the company still has a strategic shareholder in Hero MotoCorp. Those facts matter.
      They make the business far more credible than a private EV startup with no filings and no product-level
      monetization evidence.

      The blockers, however, remain material. Policy support appears uneven relative to some peers, hardware working
      capital is still meaningful, and the biggest post-IPO cash uses are still ahead. Most importantly, the company
      does not publicly disclose the private metrics that would convert an encouraging public narrative into an
      investable financial model: service gross margin, CAC and payback, contribution margin by stream, warranty-reserve
      economics, and management’s own cash-runway view. The right verdict is therefore constructive but not complacent:
      Ather has a believable margin-improvement path, yet still needs deeper disclosure before investors can underwrite
      durability rather than just momentum.
    claimRefs:
      - CI007
      - CI015
      - CI032
      - CI034
      - CI035
      - CI040
      - CI036
      - CI037
      - CI038
    tableRefs:
      - TI005
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Vehicle sales
        - Sale of Ather 450 and Rizta scooters through company-controlled retail footprint
        - Vehicle delivered
        - FY25 mix 88% of revenue; FY26 growth still primarily volume-led
        - 'Medium: auditable, but realized pricing and discounting are opaque'
        - Disclose realized ASP by model, subsidy component, and dealer incentive burden
      - - Software subscriptions
        - Dashboard, navigation, connected features, and paid software services
        - Subscription / feature package
        - Explicitly named as a non-vehicle revenue driver in Q2 FY26 coverage
        - 'Medium-to-high: promising, but attach and renewal are undisclosed'
        - Provide paying-subscriber count, attach rate, ARPU, and churn/renewal
      - - Charging revenue
        - Public fast charging and related energy sessions through Ather Grid
        - Charging session / network usage
        - Named inside ecosystem revenue stack; no standalone revenue disclosed
        - 'Medium: recurring, but likely still small versus vehicles'
        - Provide charger monetization rate, paid-session mix, and charger payback
      - - Accessories, spares, and service
        - After-sales monetization tied to installed base
        - Ticket / part / service order
        - Named in Q2 FY26 non-vehicle revenue commentary
        - 'Low-to-medium: useful buffer, but economics remain undisclosed'
        - Provide aftermarket gross margin and installed-base spend per vehicle
      - - Financing-linked ecosystem value
        - Battery warranty, app, service, and ownership-cost positioning support conversion more than direct line-item revenue
        - Bundle / ownership package
        - Supports pricing power but is not separately recognized in public statements
        - 'Low: value signal, not revenue proof'
        - Show conversion uplift, financing attach, and warranty-reserve economics
    notes: Rows separate disclosed revenue surfaces from value-supporting features; only vehicle/non-vehicle mix percentages are formally published.
    claimRefs:
      - CI003
      - CI005
      - CI013
      - CI020
      - CI021
