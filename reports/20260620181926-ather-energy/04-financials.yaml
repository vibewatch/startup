  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Ather does not publish service gross margin, warranty-claim cost, or contribution margin by vehicle versus ecosystem revenue stream.
      whyItMatters: Without those splits it is impossible to tell whether improving adjusted gross margin is durable software leverage or temporary mix or subsidy relief.
      diligencePath: Request a FY24-FY26 bridge by stream showing volume, ASP, subsidy, warranty reserve, gross margin, and contribution margin.
    - type: private-evidence-only
      severity: material
      topic: cash-runway
      missingEvidence: Management does not publish monthly cash burn, covenant package, or a board-approved liquidity runway view.
      whyItMatters: Headline cash balances can materially overstate runway when a hardware company is still funding inventory, retail expansion, and factory capex.
      diligencePath: Request monthly cash bridge, debt schedule, minimum cash thresholds, and scenario plan for Maharashtra-factory spend.
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: There is no public disclosure of CAC, dealer economics, financing-subsidy burden, or experience-centre payback.
      whyItMatters: Retail-footprint growth can look attractive while still destroying capital if store-level productivity and financing costs are weak.
      diligencePath: Ask for mature-store sales curve, sales productivity per centre, financing-attach rate, and payback by region.
    - type: stale
      severity: minor
      topic: policy-support
      missingEvidence: Open sources show policy friction, but they do not quantify Ather-specific realised PM E-DRIVE benefit or future PLI eligibility.
      whyItMatters: Subsidy and manufacturing-support asymmetry could materially change realized demand, margins, and capex returns.
      diligencePath: Request management’s subsidy capture by quarter, pending claims, and scenario analysis with and without new support schemes.
