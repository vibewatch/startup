  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact on diligence
      - Why it matters
      - Exact diligence path
      - Priority
    rows:
      - - Cash burn and runway
        - High
        - Needed to test whether IPO cash plus current liquidity really covers factory buildout and losses
        - Request monthly cash bridge, covenant schedule, and downside runway case
        - Immediate
      - - Service and ecosystem gross margin
        - High
        - Non-vehicle revenue is now strategic but economically opaque
        - Request gross margin by software, charging, accessories, spares, and service
        - Immediate
      - - Customer concentration and regional mix
        - Medium-to-high
        - Growth quality can be misleading if revenue is concentrated in a few regions or channels
        - Request top-state, top-centre, and fleet-versus-retail mix tables
        - High
      - - Warranty and reserve economics
        - Medium
        - Battery warranty is a conversion lever but could hide future cost drag
        - Request reserve policy, claims rate, and out-of-warranty service economics
        - High
      - - Experience-centre productivity
        - Medium
        - Store expansion can consume capital if mature cohorts do not pay back
        - Request sales per centre, contribution margin, and payback by cohort
        - High
    notes: Each row identifies a missing private metric that prevents full underwriting even though public disclosure quality is unusually strong for an Indian EV startup.
    claimRefs:
      - CI021
      - CI032
      - CI036
      - CI037
      - CI038
