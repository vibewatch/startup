callouts:
  - calloutType: insight
    title: Revenue quality is improving, not finished
    body: Ather now discloses enough to show ecosystem monetization exists, but not enough to quantify how much of margin improvement is software-like leverage versus hardware mix and subsidy effects.
    claimRefs:
      - CI003
      - CI013
      - CI037
  - calloutType: risk
    title: Runway remains a management-only number
    body: Public cash and IPO-proceeds tables help, but they are not a substitute for a quarterly cash bridge that includes inventory, capex, and covenant constraints.
    claimRefs:
      - CI024
      - CI025
      - CI029
      - CI030
