      - - Accessories, spares, and service
        - No public rate card in corpus
        - Aftermarket ticket and service revenue
        - Gross margin and repeat frequency undisclosed
        - Financial Express Q2
    notes: Official list prices anchor the catalogue, but monetization below the ex-showroom level still requires management disclosure.
