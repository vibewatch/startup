company:
  name: Ather Energy
chapter:
  order: 7
  number: 7
  title: Risks
  summary: 'Ather''s highest risks are not generic EV-startup fears anymore; they are a concentrated mix of subsidy and policy volatility, unresolved legal and tax proceedings, component and factory concentration, service-execution slippage during mass-market expansion, and the possibility that Rizta-led growth proves less durable than the current narrative suggests. The encouraging point is that public-company controls, rising ancillary revenue, improving margins, and a larger charging footprint provide real mitigants. The underwriting conclusion is still high risk: Ather is stronger than many private EV peers, but it remains a loss-making listed OEM whose downside can transmit quickly into share-price, demand, and channel confidence.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'Ather now operates inside a much denser regulatory perimeter than it did as a private startup. Its demand still benefits from PM E-DRIVE, but the scheme is a consumer incentive rather than a permanent manufacturer entitlement, and the policy archive shows that e-two-wheeler extensions and amendments have already become an active moving part of the market. The company''s own history shows that subsidy shifts matter: Economic Times, citing the IPO document, noted that revenue pressure in FY24 followed reduced FAME support and the resulting price increase. That means Ather is exposed not only to market demand but to policy-mediated affordability. The legal side is equally material. The prospectus disclosed outstanding criminal and tax proceedings involving the company, directors, and promoters, including 36 tax proceedings and one criminal matter against the company itself, plus much larger tax and criminal matter counts at Hero MotoCorp as corporate promoter. None of this proves a
    terminal issue, but it creates exactly the kind of headline, compliance, and management-attention risk that public-market investors discount aggressively. Secretarial-compliance disclosures are the main mitigation: no SEBI or exchange action was reported against the listed entity or directors during FY26, and no additional non-compliance was observed in that review period. The right legal conclusion is therefore not "clean" but "controlled, yet still exposed."'
