- id: supply-operations-quality
  title: Supply chain, manufacturing, and quality risk
  body: 'Operationally, Ather remains more concentrated than its brand strength can make it appear. The prospectus shows substantial but incomplete domestic sourcing: 75% of cost of materials was domestic in the nine months ended December 2024, but seven components were still imported from China, Hong Kong SAR, Singapore, and South Korea, with five of those imported items tied to batteries. Supplier concentration is meaningful. The top supplier alone accounted for 23% of purchases, and the top 10 accounted for 73%, with lithium-ion cells explicitly listed as the largest exposure. The company also disclosed limited supplier options for electronics, cells, seat locks, and side-stand sensors, and acknowledged that the global semiconductor shortage had already affected production between FY21 and FY23. On the factory side, Ather still depends on its Hosur facilities for scooter assembly and battery-pack manufacturing. That is manageable until it is not: any disruption can hit production, servicing,
    and delivery at once. Public owner commentary suggests the current quality problem is less catastrophic failure than service experience, software quirks, parts turnaround, and local execution consistency. That is still dangerous during a mass-market scale-up because family and commuter buyers are less patient than performance enthusiasts. Battery and high-voltage risk also remain structurally important even though the provided corpus does not show a public recall event; Ather''s own servicing disclosures stress specialized battery and software-handling requirements, which means scaling service quality is itself part of the safety stack.'
