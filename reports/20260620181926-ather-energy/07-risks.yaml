- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Subsidy / policy shock
    - PM E-DRIVE follow-on policy and OEM pricing actions
    - No extension beyond July 2026 plus visible post-subsidy price hikes
    - Re-underwrite demand elasticity and family-segment growth assumptions
  - - Service-quality failure
    - Complaint intensity, spare-parts lag, and review-platform deterioration
    - Multi-quarter rise in service-delay complaints while network expands
    - Cut confidence in national expansion and ecosystem-retention thesis
  - - Product / regional concentration
    - Rizta mix and South India dependency
    - Rizta weakens before 450 replacement products or non-south growth fill the gap
    - Treat growth as less durable and reduce revenue / margin expectations
  - - Supply disruption
    - Component shortages, battery-cell pricing spikes, or Hosur downtime
    - Repeated delivery delays or gross-margin reversal tied to BOM stress
    - Lower target multiple and increase residual risk rating
  - - Legal / governance escalation
    - Material adverse order, penalty, or enforcement action
    - Any significant company-level proceeding worsens or attracts regulator action
    - Re-rate governance and public-market risk immediately
  - - Capital-intensity overshoot
    - Maharashtra plant delays or losses stop narrowing
    - Expansion capex rises while operating losses fail to improve for two reporting cycles
    - Move from high-risk track to avoid until economics restabilize
  notes: The purpose of the table is to convert open-ended concern into monitorable, decision-grade triggers that can be checked every quarter.
