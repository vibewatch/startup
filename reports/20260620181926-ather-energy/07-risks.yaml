  evidenceGaps:
  - type: missing-source
    severity: material
    topic: safety-and-incident-data
    missingEvidence: Public field-incident rate, battery warranty-claim rate, and recall or non-recall safety dashboard.
    whyItMatters: Ather is scaling into mainstream household usage, where reliability and safety optics matter as much as performance.
    diligencePath: Request field-failure, warranty, and incident-rate reporting by model and city.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: service-operations-metrics
    missingEvidence: City-level service turnaround, spare-parts fill rate, and complaint aging data across company-owned versus partner-run centres.
    whyItMatters: The public review corpus strongly suggests service quality is the main operational bottleneck, but the company does not publish the metrics needed to underwrite that risk.
    diligencePath: Request internal service dashboards, partner scorecards, and complaint-resolution SLAs.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR015
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: supplier-resilience
    missingEvidence: Contract structure, inventory cover, and alternate-source readiness for cells, electronics, and other constrained parts.
    whyItMatters: Ather's disclosed supplier concentration is material enough that resilience cannot be judged from public descriptions alone.
    diligencePath: Review top-supplier contracts, dual-sourcing plan, and inventory cover days with operations leadership.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR011
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: non-south-expansion-quality
    missingEvidence: State-wise service quality and contribution margin outside South India.
    whyItMatters: Expansion risk is not only about opening new stores but about maintaining satisfaction and economics in newer geographies.
    diligencePath: Request state-level sales, gross margin, complaint rates, and partner payback.
    relatedQuestionRefs:
    - QR017
    - QR022
    relatedTableRefs:
    - TR003
    - TR004
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: Customer-contract, insurance, and product-liability provisions beyond the public regime-level risks visible in filings and policy documents.
    whyItMatters: Public law is only part of the real risk surface for a listed EV OEM selling connected vehicles through third-party channels.
    diligencePath: Review dealer agreements, insurance coverage, indemnity language, and product-liability protocols.
    relatedTableRefs:
    - TR001
