- id: partner-competitive-model
  title: Partner, customer, competitive, and model risk
  body: 'Ather''s commercial risk is now inseparable from its competitive context. FY26 data show that TVS and Bajaj have already outscaled it, while Hero Vida is rising fast and Ola still frames the performance ceiling in consumers'' minds. This matters because the Indian E2W market has shifted toward mainstream family mobility, practical replacement, and service trust rather than pure early-adopter excitement. That shift helped Ather because Rizta unlocked a larger TAM, but it also increased the penalty for weak after-sales execution. Product and geographic concentration add to the risk. External market-data sources say Rizta now contributes about 70% of sales, while public reporting tied to the IPO says roughly 61% of sales in nine-month FY25 still came from southern India. That is a better risk profile than single-customer enterprise dependence, but it is still concentration. Channel dependence matters too: third-party retail partners operate almost all experience and service centres,
    and one partner accounted for 7% of nine-month FY25 revenue. Ather''s charging and app ecosystem are real moats, yet not uncontested. TVS emphasizes a relationship-manager model and 2,000-plus public chargers, Chetak cites 4,100-plus service touchpoints and six-lakh-plus riders, and Ola continues to market far more aggressive range and speed at a lower starting price. Strategic-shareholder risk is subtler but real: Hero remains an important capital sponsor, yet Hero also scales Vida, so support and overlap can coexist.'
