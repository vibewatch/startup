callouts:
- calloutType: risk
  title: The biggest risk is mainstream scale, not proof of concept
  body: Ather has already proven that it can build and sell product at scale. The real question is whether it can keep service quality, cost discipline, and policy-resilient demand intact while moving from premium enthusiast appeal into a broader family-mobility market.
  claimRefs:
  - CR022
  - CR025
  - CR026
  - CR027
  - CR039
- calloutType: insight
  title: Public-company controls are a real mitigation
  body: The prospectus, governance filing, and secretarial-compliance report give Ather a clearer control baseline than most EV startups. That does not erase risk, but it materially improves the ability to monitor it.
  claimRefs:
  - CR010
  - CR012
  - CR038
  - CR043
- calloutType: assumption
  title: No public recall evidence is not the same as low safety risk
  body: The provided corpus does not show a disclosed recall or battery-safety event, but the absence of public incident evidence should not be treated as proof that field-safety risk is immaterial for a fast-scaling EV OEM.
  claimRefs:
  - CR013
  - CR042
