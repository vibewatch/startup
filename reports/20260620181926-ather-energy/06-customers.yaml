  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - core use case
  - scale / evidence signal
  - revenue or strategic value
  - key gap
  rows:
  - - 450 performance commuters
    - Individual buyer and rider; urban salaried commuter, student, or enthusiast pays
    - Fast daily commuting, tech-forward riding, navigation, and premium ownership feel
    - Official 450 positioning plus review-platform evidence from named riders
    - Core premium ASP base and brand halo
    - No public split of 450 revenue, repeat purchase, or segment retention
  - - Family commuter households (Rizta)
    - Household buyer; one or two family riders; cost-sensitive payer with comfort priority
    - School runs, errands, office commuting, grocery hauling, shared family scooter use
    - Rizta launch lifted FY25 and FY26 volume trajectory; multiple reviews emphasize comfort and storage
    - Mainstream TAM expansion and current growth engine
    - No public household-conversion funnel or family-segment NPS disclosed
  - - Work-use urban riders
    - Self-employed delivery or frequent-use city rider pays and uses
    - Low running-cost urban mileage, dense-stop work, all-day practical commuting
    - BikeDekho review references parcel delivery and daily 40 km use; charging and maintenance economics support case
    - Helps Ather spread beyond discretionary buyers
    - Evidence is anecdotal rather than company-disclosed fleet or commercial-account data
  - - Export / neighbouring-market riders
    - Retail rider in Nepal or Sri Lanka via distributor model
    - Imported premium EV scooter purchase in selected cities
    - Annual report and charging map show presence in Nepal and Sri Lanka
    - Small but useful geographic diversification signal
    - No disclosed unit count, partner economics, or retention data by overseas market
  notes: Segmentation is based on product positioning, named review text, dealer descriptions, and distribution disclosures. Ather does not publish a formal customer-mix breakout by use case or household profile.
