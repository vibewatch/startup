company:
  name: Ather Energy
chapter:
  order: 6
  number: 6
  title: Customers
  summary: 'Ather now serves two clearly different customer jobs: tech-forward urban commuters buying the 450 line for performance and software, and family or everyday household riders buying Rizta for comfort, storage, and lower running cost. Adoption has accelerated sharply since Rizta, but proof of customer durability is still mostly proxy-based: app ratings, AtherStack attach, repeat charging and service usage, and public owner reviews rather than disclosed retention cohorts. The customer verdict is constructive, though service responsiveness, spare-parts delays, apartment-charging friction, South India concentration, and Rizta-heavy mix remain real expansion risks.'
sections:
- id: customer-segmentation
  title: Customer segmentation and buyer jobs
  body: Ather's customer base is no longer a single premium-enthusiast niche. The official product surfaces and dealer segmentation now show at least three practical buyer clusters. First, the 450X and 450S still address tech-forward urban commuters, students, office riders, and performance-oriented early adopters who value acceleration, Google Maps navigation, ride modes, OTA updates, and app-linked control more than maximum storage. Second, Rizta has materially broadened the buyer base toward families and mainstream scooter households, where the purchase decision is driven by seat comfort, boot capacity, predictable range, safety, and low running cost rather than outright speed. Third, public user reviews show an adjacent work-use cohort such as parcel-delivery or high-frequency city riders, for whom quiet operation, low maintenance, and fuel savings matter more than brand cachet. This matters because Ather's current customer mix is increasingly a portfolio of use cases rather than a single
    identity brand. The bullish read is that Ather found a credible path beyond enthusiast buyers; the caution is that family and commuter customers are less tolerant of service friction and price-premium slippage than early adopters were.
