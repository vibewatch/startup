- id: TU006
  title: Charging and ownership-friction signals table
  columns:
  - signal
  - positive proof
  - adverse proof
  - customer implication
  rows:
  - - Public fast-charging loop
    - Ather app can monitor and pay for charging; Grid scale is a visible ownership benefit
    - Apartment users without dedicated parking still face home-charging friction
    - Charging can be a moat for urban users with access, but not a universal adoption unlock
  - - Software engagement
    - AtherStack attach and app rating suggest meaningful post-sale engagement
    - Dashboard freezes and navigation lag show software can also generate dissatisfaction
    - The software moat is real but must stay reliable to support retention
  - - Service experience
    - Some HT Auto owners call servicing smooth and modern compared with traditional garages
    - Ecozaar and review aggregates say delays and support-process frustration remain a common complaint cluster
    - Mass-market scaling depends on making service quality more consistent across cities
  - - Product fit by segment
    - Rizta solves comfort and storage pain points better than the 450 line
    - The non-removable battery and lower top speed limit can still block some households
    - Ather can broaden reach, but not every commuter profile will convert equally
  notes: This exhibit isolates the customer-friction variables most likely to determine whether Ather's charging and software ecosystem becomes a durable retention advantage or merely a differentiator at purchase.
