- id: expansion-concentration-risks
  title: Expansion, concentration, and channel risk
  body: 'The expansion thesis is credible but not de-risked. Rizta clearly unlocked a larger family-mobility market, and external market commentary says the broader Indian E2W market has pivoted from experimentation toward practical commuter replacement. That helps explain why Ather''s growth accelerated when it moved beyond the premium 450 identity. Even so, concentration risk remains meaningful across geography, product mix, and channel structure. IPO risk disclosures cited by external reporting say roughly 61% of sales in the first nine months of FY25 still came from southern India, while prospectus disclosures show one retail partner represented 7% of nine-month FY25 revenue and 11% of FY24 revenue. Product concentration has also increased: Rizta is now described as roughly 70% of FY26 sales. That is good while the family segment is hot, but it also means the growth story is more exposed to mainstream value, service, and subsidy-sensitive buyers. Apartment charging constraints and the
    Rizta''s non-removable battery can still block adoption in dense urban housing. Finally, competitors are not standing still: TVS, Bajaj, and Hero now attack the same family-use case with stronger legacy distribution or service depth. Ather''s customer expansion story therefore depends as much on service execution and geographic diversification as on product quality.'
