- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration or blocker
  - impact
  - diligence path
  rows:
  - - Rizta broadens TAM into family mobility
    - Product mix now heavily tilted toward Rizta at roughly 70% of FY26 sales
    - Growth can continue, but one-model dependence rises
    - Track monthly mix by model and margin by product line
  - - National network expansion
    - 61% of sales were still concentrated in southern India in 9M FY25
    - Geographic concentration can slow all-India re-rating
    - Request state-wise sales, contribution margin, and new-city payback
  - - Charging ecosystem and app features
    - Apartment users still face home-charging friction because Rizta battery is non-removable
    - Reduces conversion in dense urban housing and rental households
    - Measure booking-to-cancellation rates by parking/charging availability
  - - Retail footprint scaling
    - One retail partner represented 7% of 9M FY25 revenue and 11% in FY24
    - Channel disruption can create local service and revenue shock
    - Review partner concentration, partner churn, and COCO fallback plan
  - - Premium software-led ownership loop
    - Competitors such as TVS and Bajaj have deeper service reach and mainstream trust
    - Ather could win product preference but lose on support convenience
    - Benchmark service turnaround, touchpoint density, and warranty-claim closure against peers
  notes: The main customer risk is not lack of demand; it is whether Ather can preserve customer satisfaction while moving from enthusiast buyers to broader household and commuter cohorts.
