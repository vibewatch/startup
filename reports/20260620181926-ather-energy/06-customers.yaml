- id: adoption-trajectory-proof
  title: Adoption trajectory and named customer proof
  body: 'The adoption curve is now visible in operating data rather than only marketing copy. Annual-report volumes rose from 109,577 units in FY24 to 155,394 in FY25, and FY26 industry reporting points to 239,124 units with market share around 17%, versus about 11% in FY25. Q4 FY26 alone reached 83,418 units, while Q2 FY26 commentary pointed to 65,595 deliveries, 524 experience centres, and 4,322 charging points. The most important product-level proof is Rizta: external market-data sources describe it as the primary growth driver and place its sales contribution at about 70% of FY26 volumes. For a consumer EV OEM, the closest equivalent to named enterprise customers is attributed ownership proof and long-term rider testimony. That evidence exists but is mixed in quality. BikeDekho and HT Auto reviews identify named riders discussing 40 km daily commuting, city delivery work, family use, and intercity travel with charging stops. Drivio''s six-month Rizta test adds a more structured ownership
    view around comfort, boot utility, range realism, and charging behavior. Together these sources confirm real usage, but not cohort-level durability or renewal economics.'
