  topStrengths:
    - 作为印度 EV 初创公司，Ather 已具备真实的上市公司披露质量，材料包括年报、招股书资料和持续交易所文件。
    - AtherStack 软件、Ather Grid 充电网络和品牌零售 / 服务网点共同撑起差异化生态，不只是单一踏板车 SKU。
    - Rizta 把可触达客户从发烧友扩到更大众人群，推动 FY26 收入明显放量，同时亏损收窄。
    - 工程文化强，研发投入力度大，产品和充电创新可见，支撑其高端品牌位置。
  topRisks:
    - 盈利能力尚未跑通；即便毛利改善，FY26 仍录得可观净亏损。
    - 大众 EV 品类竞争激烈，业务仍暴露在补贴、定价和投入成本变化之下。
    - 服务一致性和主流用户持有体验披露不够干净，难以有把握地支撑上市公司溢价倍数。
    - Hero、TVS、Bajaj 和 Ola 共同抬高竞争强度；Ather 的估值溢价需要持续优于同业的执行来兑现。
    - 制造和资本开支扩张仍在前方，IPO 并未消除资本密集风险。
  unresolvedGaps:
    - 公开资料仍看不到车型级毛利率、服务毛利率，或按收入流拆分的贡献利润率。
    - 公开资料没有按队列披露客户留存、复购或软件续费。
    - IPO 后当前股权结构和自由流通股拆分仍需与最新交易所持股结构核对。
    - 门店级回本周期、充电桩利用率和 Maharashtra 工厂爬坡经济性仍不在公开记录中。
