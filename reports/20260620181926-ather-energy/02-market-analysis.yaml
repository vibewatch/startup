chapter:
  number: 2
  title: Market Analysis
  summary: India’s electric two-wheeler market has moved from subsidy-led experimentation into mainstream replacement demand, with FY2026 volumes around 1.4 million units, 6.54% two-wheeler penetration, and buyer preference shifting toward family scooters sold through trusted service networks. PM E-DRIVE still supports demand, but the post-subsidy glide path, apartment-charging friction, and intense legacy-OEM execution now matter more than raw category hype. For Ather specifically, Rizta meaningfully widened the reachable market, but the company still addresses only a subset of the 21.41 million-unit Indian two-wheeler TAM.
sections:
- id: SM-boundary-size
  title: Market boundary and current size
  body: 'The right market boundary for Ather is not “all EV” or even “all scooters.” The outer TAM starts with India’s entire two-wheeler market, which reached 21.41 million units in FY2026, because every electric scooter ultimately competes against a petrol two-wheeler or a decision to delay replacement. But the practical SAM is narrower: scooter-heavy commuter and family use cases, plus selected delivery and urban utility usage, where charging access, daily mileage, and total-cost-of-ownership work in EV favour. The category is already large enough to matter. Ather’s annual report and multiple FY2026 market trackers show E2W sales moving from roughly 1.15 million units in FY2025 to about 1.40 million units in FY2026, while penetration climbed from 5.8% to 6.54%. The market also kept broadening inside the scooter format itself: scooters rose from roughly 32% of overall two-wheeler mix in FY2019 to around 36% in FY2025, and about 15.7% of Indian scooter sales were already electric in FY2025.
    That makes the core diligence question less “is there a market?” and more “which buyer slices convert fast enough, and on what economics?”'
