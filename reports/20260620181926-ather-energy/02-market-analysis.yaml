- id: SM-constraints-verdict
  title: Penetration limits, constraints, and sizing verdict
  body: 'The category is expanding, but the penetration ceiling is still governed by three frictions: price, charging practicality, and execution quality. Even bullish FY2026 coverage concedes that an electric scooter still carries a higher upfront cost than a petrol equivalent, which is why every successful brand is now using either service depth, financing, battery plans, or family-oriented packaging to justify the switch. Apartment-charging friction remains real for non-removable-battery products; Rizta reviews explicitly flag this as a constraint for some urban households. Competitive dynamics are also tightening. Legacy OEMs have already shown that service reach and supplier leverage can overwhelm first-mover advantage, while policy design has not always treated startup OEMs evenly. The resulting sizing conclusion is pragmatic rather than promotional. Ather’s outer opportunity is the full Indian two-wheeler replacement pool, but its near-term serviceable market is the scooter-heavy
    commuter, family, and delivery slices where home or neighbourhood charging works and where buyers will pay for software-led reliability. Rizta clearly expanded that market versus the older 450-only positioning, yet Ather still has to prove that off-South expansion and post-subsidy demand can hold once execution, not policy, becomes the main moat.'
