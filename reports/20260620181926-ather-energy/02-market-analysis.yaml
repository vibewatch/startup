- id: TM003
  title: Segment / buyer map
  enumerationScope:
    coverage: partial
    basis: Covers the main public buyer segments visible in filings, market trackers, and customer reviews; city-level demographic segmentation is not publicly enumerated.
  columns:
  - segment
  - buyer
  - user
  - payer / budget owner
  - workflow
  - adoption trigger
  rows:
  - - Performance commuter
    - Urban professional or enthusiast
    - Primary rider
    - Individual salary budget
    - Daily city commute plus occasional longer urban runs
    - Software features, acceleration, and charging confidence justify premium pricing.
  - - Family household
    - Married or multi-rider household buyer
    - Shared family riders and pillion use
    - Household mobility budget
    - Errands, school drop-offs, office commute, weekend local travel
    - Seat comfort, storage, safety, and predictable cost beat raw speed.
  - - Working professionals and women scooter users
    - Convenience-oriented personal mobility buyer
    - Single frequent rider
    - Personal transport budget
    - Regular short-to-medium daily commute
    - Ease of use, automatic transmission feel, and practicality drive scooter demand.
  - - Delivery / fleet operator
    - Gig worker or fleet manager
    - High-mileage rider
    - Operator cash flow or fleet capex budget
    - Many short urban trips with charging rotation planning
    - Lower rupee-per-kilometre cost and uptime outweigh premium design.
  - - Apartment or constrained-charging buyer
    - Urban apartment household considering an EV switch
    - Potential first-time EV user
    - Household budget but constrained by parking setup
    - Needs reliable home or nearby charging before purchase
    - Availability of charging access or removable-battery alternatives becomes decisive.
  notes: Segment boundaries combine filing language with independent buyer commentary; the apartment-charging row is included because charging practicality repeatedly appears as a conversion filter, not because it is a standalone demographic segment.
