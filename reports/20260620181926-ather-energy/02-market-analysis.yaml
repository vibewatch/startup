- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: Indicative conversion funnel for an Indian scooter buyer moving from EV awareness to repeatable daily use.
  data:
    items:
    - label: 'Awareness: EV economics and policy support'
      value: 100
      description: Buyer sees subsidy messaging, running-cost savings, and expanding EV visibility in mainstream two-wheeler shopping.
    - label: 'Evaluation: upfront price and financing'
      value: 70
      description: Decision narrows to whether subsidy, financing, or battery plans make the EV sticker price tolerable versus petrol alternatives.
    - label: 'Confidence: charging and service access'
      value: 45
      description: Buyer checks whether home or neighbourhood charging is practical and whether service support is trusted locally.
    - label: 'Conversion: product-segment fit'
      value: 25
      description: Family buyers prioritize seat, storage, and stability; performance commuters prioritize software and acceleration.
    - label: 'Retention: repeat daily replacement'
      value: 15
      description: Low running cost and dependable service convert the EV from second vehicle experiment into primary commuter or family mobility.
  approximationNotes: Funnel percentages are ordinal conversion weights, not measured market conversion rates; they express the relative friction introduced by price, charging, and service concerns.
