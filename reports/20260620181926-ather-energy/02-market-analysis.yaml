tables:
- id: TM001
  title: Market definition table
  columns:
  - segment / category
  - included spend
  - excluded spend
  - buyer / payer
  - relevance
  rows:
  - - Urban commuter scooters
    - Personal electric scooters replacing 110cc–125cc petrol commuting trips
    - Motorcycles, premium leisure bikes, and non-registered low-speed EVs
    - Individual household buyer is usually also the payer
    - This is the core mass-market EV conversion pool in FY2026.
  - - Family scooters
    - Two-up and utility-oriented scooters bought for family mobility, errands, school runs, and mixed commuting
    - Performance-first enthusiast products bought mainly for acceleration or image
    - Household decision-maker pays; multiple family members use
    - Rizta, iQube, and Chetak growth shows this slice is now the fastest mainstream adoption path.
  - - Delivery / fleet utility
    - High-usage scooters used for food, parcel, and last-mile delivery where TCO matters
    - Passenger 3W fleets and heavy commercial EV categories
    - Fleet operator or gig worker pays and uses
    - This segment over-indexes on running-cost savings and uptime rather than brand aspiration.
  - - Charging and software adjacency
    - Charging access, navigation, safety, OTA features, and battery plans that shape purchase conversion
    - Standalone charging CPO economics unrelated to two-wheeler retail demand
    - Vehicle buyer pays directly or indirectly through scooter ownership bundle
    - Ather’s software-plus-charging stack matters only because it improves scooter conversion and retention.
  - - Status-quo substitute
    - Petrol scooter purchase or replacement deferral
    - Broader public transport spending and car purchases
    - Same household or individual budget as an EV scooter decision
    - The real competitive baseline remains ICE replacement, not only rival EV OEMs.
  notes: Boundary starts from all Indian two-wheelers but narrows to scooter-led commuter, family, and delivery use cases where EV economics and charging practicality can realistically convert demand.
