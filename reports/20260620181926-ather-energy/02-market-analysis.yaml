- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - PM E-DRIVE demand incentives and e-vouchers
    - positive
    - Current but policy-bound
    - Reduces upfront price and can pull demand forward around deadlines.
    - Model demand after July 2026 without assuming another extension.
  - - Public charging and charging-network buildout
    - positive
    - Medium term
    - Improves buyer confidence beyond home-charging households.
    - Track whether charging density spreads into Tier 2/3 Ather expansion markets.
  - - Family-scooter product wave (Rizta / iQube / Chetak)
    - positive
    - Current
    - Expands EV adoption beyond enthusiasts into mainstream replacement purchases.
    - Check whether family-scooter mix sustains when subsidy support weakens.
  - - Running-cost and maintenance advantage
    - positive
    - Structural
    - TCO keeps EV attractive even when sticker prices remain higher.
    - Stress-test savings using city electricity tariffs and real annual mileage.
  - - Legacy service and dealer depth
    - positive for incumbents / negative for weaker networks
    - Current
    - Trust and after-sales execution increasingly decide market share.
    - Measure service turnaround and city-level network density, not only stores opened.
  - - Higher upfront cost versus petrol
    - negative
    - Current
    - Can stall conversion unless financing or battery plans offset sticker shock.
    - Quantify payback period by segment rather than using generic EV math.
  - - Apartment charging friction and non-removable batteries
    - negative
    - Current
    - Restricts conversion among urban buyers without reliable parking access.
    - Estimate what share of target cities lacks practical home charging.
  - - Policy or PLI asymmetry
    - negative
    - Medium term
    - Uneven subsidy or manufacturing support can distort OEM competitiveness.
    - Track whether policy changes materially favor scale incumbents or cell-localization leaders.
  notes: Drivers and constraints are mixed because the same market can expand overall while Ather’s share outcome depends on service reach, subsidy glide path, and charging practicality.
