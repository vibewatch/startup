companyProfile:
  summary: >-
    Ather Energy is a Bengaluru-founded electric two-wheeler manufacturer that pairs premium scooters with a software, charging, and service ecosystem. Its core lines are the performance-oriented Ather 450 family and the family-focused Rizta line, supported by AtherStack software, Ather Grid charging, and a company-controlled experience-centre footprint. Since listing in 2025, Ather has become one of the most transparent Indian EV startups to diligence publicly, showing real revenue scale and a visible path to better margins, but still not full profitability.
