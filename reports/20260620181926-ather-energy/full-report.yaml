  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and current size
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Ather is not “all EV” or even “all scooters.” The outer TAM starts with
              India’s entire two-wheeler market, which reached 21.41 million units in FY2026, because every electric
              scooter ultimately competes against a petrol two-wheeler or a decision to delay replacement. But the
              practical SAM is narrower: scooter-heavy commuter and family use cases, plus selected delivery and urban
              utility usage, where charging access, daily mileage, and total-cost-of-ownership work in EV favour. The
              category is already large enough to matter. Ather’s annual report and multiple FY2026 market trackers show
              E2W sales moving from roughly 1.15 million units in FY2025 to about 1.40 million units in FY2026, while
              penetration climbed from 5.8% to 6.54%. The market also kept broadening inside the scooter format itself:
              scooters rose from roughly 32% of overall two-wheeler mix in FY2019 to around 36% in FY2025, and about
              15.7% of Indian scooter sales were already electric in FY2025. That makes the core diligence question less
              “is there a market?” and more “which buyer slices convert fast enough, and on what economics?”
