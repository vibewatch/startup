  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and public-market anchor
        blocks:
          - type: paragraph
            body: >-
              The key difference between valuing Ather and valuing a private EV startup is that Ather now has a
              market-clearing public reference point. The IPO was priced at ₹321 per share at the top end of the range,
              which Autocar Professional translated into a pre-money valuation of about ₹9,330 crore and a post-money
              valuation of about ₹11,956 crore, or roughly $1.4 billion. That is only modestly above the roughly $1.3
              billion implied by the NIIF-led 2024 private round, so the listing did not represent a euphoric
              step-function in headline value. The listing outcome therefore reads as pragmatic rather than speculative:
              Ather used the market to fund the Maharashtra plant and broaden its capital base while accepting pricing
              discipline. Hero MotoCorp remains a major strategic holder even after dilution, which matters because it
              keeps a credible industrial sponsor inside the cap table. The adverse side is equally clear.
              Prospectus-era risk reporting and external coverage still emphasise losses since incorporation, negative
              operating cash flow, and the fact that public investors are effectively funding the next leg of scale-up
              before a full proof of profitability exists.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
