  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality, pricing, and mix
        blocks:
          - type: paragraph
            body: >-
              Ather’s open-source financial record is strong enough to establish the broad shape of revenue quality, but
              not yet strong enough to fully underwrite it. FY25 reporting gives the cleanest audited mix view: 88% of
              revenue came from vehicle sales and 12% from non-vehicle streams. That matters because the company is not
              presenting as a pure scooter-ASP story anymore. Q2 FY26 reporting sharpened the picture by naming software
              subscriptions, charging, accessories, spares, and service as the main non-vehicle contributors. In other
              words, Ather is trying to monetize an installed-base ecosystem rather than only one-time scooter
              deliveries.

              What remains missing is realization detail. Official product pages publish current ex-showroom prices for
              the 450 and Rizta families, and those price points sit above the FY25 revenue-per-vehicle figure. That gap
              is not automatically negative; it likely reflects model mix, discounting, financing, subsidies, and the
              fact that realized revenue is not equivalent to headline list price. But it does mean investors still
              cannot tell how much of the top line is driven by durable pricing power versus policy support and
              ancillary monetization. Revenue quality is improving, but it is not yet disclosure-complete.
