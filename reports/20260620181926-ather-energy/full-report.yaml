            body: >-
              Ather’s charging network is now large enough to be a core part of the product, not just an accessory.
              Official pages describe India’s largest two-wheeler fast-charging network, 30 km of range in 10 minutes,
              app-based session monitoring and payment, and thousands of public charging points. Rizta’s product page
              pushes that claim further by citing 5,900-plus points in 370-plus cities, while independent reporting
              during FY26 cited 4,322 points during the year’s earlier stages. The right read is that the network is
              expanding quickly and that Ather wants charging, routing, and ownership software to feel like one coherent
              operating system.

              Manufacturing and roadmap signals also point to a company trying to industrialize beyond its original
              premium enthusiast niche. The annual report says current facilities can produce more than 4.2 lakh E2Ws
              annually. Machinemaker says the EL platform is Ather’s first new vehicle architecture since the 450, built
              from 26 lakh km of data and designed for lower component count, faster assembly, and better
              serviceability. GreentechLead adds a battery-localization roadmap with Amara Raja, NMC and LFP chemistry
              work, 4695-cell research, and a much larger Maharashtra Factory 3.0. Taken together, the roadmap supports
              a credible move toward broader segments and lower cost-to-serve, but it also increases execution risk
              because more of Ather’s future value now depends on platform transition, manufacturing scale-up, and
              supplier localization landing on schedule.
