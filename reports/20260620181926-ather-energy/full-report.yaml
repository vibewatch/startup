  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Ather now operates inside a much denser regulatory perimeter than it did as a private startup. Its demand
              still benefits from PM E-DRIVE, but the scheme is a consumer incentive rather than a permanent
              manufacturer entitlement, and the policy archive shows that e-two-wheeler extensions and amendments have
              already become an active moving part of the market. The company's own history shows that subsidy shifts
              matter: Economic Times, citing the IPO document, noted that revenue pressure in FY24 followed reduced FAME
              support and the resulting price increase. That means Ather is exposed not only to market demand but to
              policy-mediated affordability. The legal side is equally material. The prospectus disclosed outstanding
              criminal and tax proceedings involving the company, directors, and promoters, including 36 tax proceedings
              and one criminal matter against the company itself, plus much larger tax and criminal matter counts at
              Hero MotoCorp as corporate promoter. None of this proves a terminal issue, but it creates exactly the kind
              of headline, compliance, and management-attention risk that public-market investors discount aggressively.
              Secretarial-compliance disclosures are the main mitigation: no SEBI or exchange action was reported
              against the listed entity or directors during FY26, and no additional non-compliance was observed in that
              review period. The right legal conclusion is therefore not "clean" but "controlled, yet still exposed."
