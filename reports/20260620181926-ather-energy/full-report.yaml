      - number: '3.4'
        title: Distribution power, switching cost, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The most durable moat in India’s electric two-wheeler market currently looks less like raw technology and
              more like a bundle: distribution reach, service responsiveness, financing confidence, and the ability to
              package EV ownership as a low-risk replacement for petrol scooters. That helps explain why TVS and Bajaj
              rose so quickly and why Ather still faces real execution pressure despite strong brand and product depth.
              Ather’s moat is not imaginary. It still owns one of the strongest software-and-charging narratives in the
              segment, has meaningful retail scale, and has used Rizta to escape the narrow enthusiast box. But
              independent reporting also makes the downside clear: legacy incumbents have larger networks and balance
              sheets, while Ola can still pull attention with standout range-speed-price claims if its service recovery
              sticks. Hero Vida adds a more subtle threat by pairing practicality with parent-brand confidence, and
              Bounce’s portable-battery message attacks one of the category’s hardest adoption frictions directly.
              Switching costs are therefore only moderate. Buyers can be retained by experience, network familiarity,
              and charger ecosystem comfort, but product convergence means moat durability now depends on execution
              quality quarter after quarter rather than on first-mover status alone.
            claimRefs:
