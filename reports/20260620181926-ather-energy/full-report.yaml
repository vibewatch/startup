      - number: '8.2'
        title: Operating proof, margin trajectory, and multiple support
        blocks:
          - type: paragraph
            body: >-
              The strongest reason Ather deserves more than a distressed hardware multiple is that the operating story
              is visibly improving. FY26 revenue reached ₹3,671.76 crore, Q4 volumes rose to 83,418 units, annual loss
              narrowed to ₹517.17 crore, and Q2 commentary pointed to roughly 12% non-vehicle revenue with adjusted
              gross margin around 22%. The annual report also showed that 88% of users buy AtherStack and that app
              ratings remain strong, which helps the argument that Ather is not merely assembling scooters but building
              an ecosystem that can support recurring wallet share through software, charging, accessories, and service.
              That said, the evidence is not strong enough for a clear premium-growth verdict. The company is still
              loss-making, still dependent on Rizta for a large share of volume, and still exposed to policy-assisted
              affordability in the mainstream family segment. The valuation question is therefore not whether Ather has
              real demand — it clearly does — but whether investors should pay a premium today for economics that are
              only partly proven. On that test, the current evidence supports a base-case multiple around the IPO mark
              rather than a large re-rating ahead of FY27 execution.
            claimRefs:
