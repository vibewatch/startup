  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Uses the most relevant public or disclosed pricing anchors available in the corpus; diversified incumbents are
        included as strategic comparables despite weak business-model purity.
    columns:
