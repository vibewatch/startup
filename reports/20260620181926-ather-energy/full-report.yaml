      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, don't chase
            body: >-
              Ather is investable and more disclosure-rich than most EV startups, but the IPO price already reflects a
              solid portion of the credible upside. The next upgrade to buy needs FY27 execution proof, not more
              storytelling.
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV027
              - CV028
              - CV030
          - type: callout
            title: The premium to Ola must be earned continuously
            body: >-
              Ather won a quality premium at IPO despite lower volume and market share than Ola. That premium will not
              survive if service quality, margin progress, or family-segment momentum disappoint.
            calloutType: risk
            claimRefs:
              - CV015
              - CV020
              - CV032
              - CV042
          - type: callout
            title: The base case assumes better-than-average execution
            body: >-
              A fair valuation around the IPO mark already assumes Ather can keep shrinking losses, hold high-teens
              share, and defend its brand against legacy service networks. If any of those assumptions break, the bear
              band matters quickly.
            calloutType: assumption
            claimRefs:
