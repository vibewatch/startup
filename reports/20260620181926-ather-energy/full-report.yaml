chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating model
        blocks:
          - type: paragraph
            body: >-
              Ather Energy is now best understood as a newly public Indian electric two-wheeler company rather than a
              classic early-stage startup. The company was founded in Bengaluru in 2013 by IIT Madras alumni Tarun Mehta
              and Swapnil Jain, and its current legal and reporting posture is that of a listed entity on both NSE and
              BSE. That matters because the diligence baseline has shifted: unlike many private EV peers, Ather now
              publishes annual reports, prospectus disclosures, integrated exchange filings, and secretarial compliance
              documents that let investors triangulate management claims against formal filings. The operating identity
              that emerges from those materials is consistent. Ather sells a premium electric scooter ecosystem built
              around the 450 performance line and the Rizta family line, with charging, software, accessories and
              subscriptions treated as part of the same product system rather than side businesses.
