              and pay on the app, while the annual report says Ather Grid already spanned 3,611 chargers across 360-plus
              cities by March 2025. Public reviews generally support the product-side stickiness. Riders repeatedly cite
              smooth performance, low running cost, reliable range readouts, and modern app-driven service as reasons
              the scooter remains a preferred commuter after months or years of use. But the same corpus also surfaces
              the main weakness: service experience is not uniformly strong. HT Auto cites dashboard freezes, navigation
              lag, and slow spare-parts turnaround; Ecozaar's review synthesis says the biggest complaint cluster is
              delays and support-process frustration; BikeWale's aggregate 3.9 out of 5 score includes a meaningful 18%
              one-star share. The result is not a collapse in customer love, but a clear warning that retention may be
