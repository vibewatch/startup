              Ather does not publicly disclose NRR, GRR, churn, renewal rates, or customer-count cohorts, so durability
              has to be inferred from behavior proxies. The strongest positive proxy is software and ecosystem
              engagement: the FY2024-25 annual report said 88% of E2W users purchased AtherStack, AtherStack contributed
