      - number: '2.2'
        title: Policy transition and buyer economics
        blocks:
          - type: paragraph
            body: >-
              Policy still matters, but mostly through buyer acquisition cost rather than direct manufacturer rescue. PM
              E-DRIVE replaced the six-month EMPS bridge after FAME-II and carried a ₹10,900 crore outlay over 1 April
              2024 to 31 March 2026, including ₹3,679 crore of demand incentives across roughly 2.8 million vehicles and
              ₹2,000 crore for public charging infrastructure. The official design is important: incentives flow to
              consumers at purchase and are reimbursed through OEMs, which means demand can pull forward abruptly around
              scheme deadlines. That happened in March 2026, when registrations spiked near 190,941 units before April
              normalized. The economics are still attractive enough to keep EV demand alive even after subsidy noise.
              Independent FY2026 coverage repeatedly returns to the same logic: running cost can be as low as roughly 30
              paise per kilometre versus around ₹2 per kilometre for petrol scooters, while BaaS or financing products
              from TVS and Ather reduce the sticker shock. The open issue is what happens after the current policy
              window rolls off. Market trackers already frame July 2026 as the next real test of whether volumes stay
              resilient without another buyer-side cushion.
