  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Ather now runs two primary journeys: a software-first 450 commuter path and a comfort-first Rizta family path,
      both depending on charging, app, and service follow-through after purchase.
    data:
      items:
        - label: Discover
          detail: 450 buyers respond to performance and tech; Rizta buyers respond to family comfort, storage, and savings.
          tone: positive
        - label: Evaluate
          detail: Test rides, true-range confidence, financing, and local charging access shape conversion.
          tone: neutral
        - label: Purchase
          detail: Product choice splits between 450 performance and Rizta practicality.
          tone: positive
        - label: Activate ecosystem
          detail: App setup, AtherStack, home charger, and Grid familiarity create the first stickiness loop.
          tone: positive
        - label: Own and service
          detail: Satisfaction depends on ride quality, OTA fixes, service turnaround, and spare-part availability.
          tone: warning
        - label: Expand or refer
          detail: >-
            Upsell paths include Pro Pack, accessories, charging use, and household referrals, but only if service
            quality holds.
          tone: neutral
