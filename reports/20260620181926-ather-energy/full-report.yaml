      - number: '3.3'
        title: Capability, pricing, and challenger profiles
        blocks:
          - type: paragraph
            body: >-
              Pure EV and Bounce Infinity matter less because they threaten Ather’s premium brand and more because they
              expose where the market can still fragment. Bounce’s official surface leans hard into detachable
              batteries, lower starting prices, and city-friendly range, which directly addresses apartment-charging
              friction that still constrains many fixed-battery scooters. Pure EV shows a different risk: independent
              trackers still show meaningful FY2026 volume growth, but the retained official page is so sparse that
              product-level transparency is materially weaker than what top-tier OEMs offer. That weakens confidence in
              its ability to compete on capability signalling, even if price-led demand exists. For Ather, the more
              important matrix question is whether the company is compared as a performance-tech brand, a family scooter
              brand, or both. The answer in 2026 is “both, but unevenly.” The 450 line still wins on software-led
              excitement, while Rizta is the vehicle that lets Ather participate in the mainstream family replacement
              wave. That duality is strategically valuable, but it also means Ather is defending two positions against
              competitors who are often optimized for one clearer buyer promise.
