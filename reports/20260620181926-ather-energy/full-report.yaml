            title: Ather still depends on a narrower market than the headline TAM implies
            body: >-
              Rizta widened Ather’s addressable market materially, but apartment-charging friction, premium heritage,
              and the need for stronger off-South service execution mean the company still serves only part of India’s
              full two-wheeler replacement opportunity.
            calloutType: risk
