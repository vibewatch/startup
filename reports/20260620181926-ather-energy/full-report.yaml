      - number: '2.4'
        title: Penetration limits, constraints, and sizing verdict
        blocks:
          - type: paragraph
            body: >-
              The category is expanding, but the penetration ceiling is still governed by three frictions: price,
              charging practicality, and execution quality. Even bullish FY2026 coverage concedes that an electric
              scooter still carries a higher upfront cost than a petrol equivalent, which is why every successful brand
              is now using either service depth, financing, battery plans, or family-oriented packaging to justify the
              switch. Apartment-charging friction remains real for non-removable-battery products; Rizta reviews
              explicitly flag this as a constraint for some urban households. Competitive dynamics are also tightening.
              Legacy OEMs have already shown that service reach and supplier leverage can overwhelm first-mover
              advantage, while policy design has not always treated startup OEMs evenly. The resulting sizing conclusion
              is pragmatic rather than promotional. Ather’s outer opportunity is the full Indian two-wheeler replacement
              pool, but its near-term serviceable market is the scooter-heavy commuter, family, and delivery slices
              where home or neighbourhood charging works and where buyers will pay for software-led reliability. Rizta
              clearly expanded that market versus the older 450-only positioning, yet Ather still has to prove that
              off-South expansion and post-subsidy demand can hold once execution, not policy, becomes the main moat.
            claimRefs:
              - CM020
              - CM022
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM037
              - CM038
              - CM039
              - CM040
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The category has crossed from trial into replacement
            body: >-
              By FY2026 the decisive buyer question in Indian E2Ws is no longer whether electric scooters work, but
              which brands combine trusted service, family practicality, and acceptable upfront economics well enough to
              replace petrol scooters at scale.
            calloutType: insight
            claimRefs:
