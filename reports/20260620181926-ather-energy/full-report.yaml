  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument type
      - argument
      - what would change the view
    rows:
      - - Thesis
        - >-
          Ather has become a differentiated public EV platform with software, charging, and distribution assets that
          justify more than a plain hardware multiple.
        - Show sustained non-vehicle revenue growth, strong service metrics, and continued loss reduction.
      - - Thesis
        - >-
          Rizta broadened the customer base from enthusiast buyers into mainstream family mobility, which materially
          improved scale economics.
        - Confirm that the mix shift remains durable even after subsidy normalization.
      - - Thesis
        - IPO pricing was disciplined, not euphoric, with valuation only modestly above the 2024 private unicorn mark.
        - >-
          If the market later rerates Ather well above the base band without new proof, the disciplined-pricing argument
          weakens.
      - - Anti-thesis
        - >-
          Ather is still a loss-making OEM with negative cash-flow history, so the market may ultimately value it like a
          cyclical hardware business rather than a premium EV platform.
        - Positive profit trajectory or much clearer recurring-margin proof would weaken this concern.
      - - Anti-thesis
        - >-
          The valuation premium to Ola and the competitive fight with TVS and Bajaj require cleaner service execution
          than Ather has publicly proven.
        - Publish service TAT, complaint closure, and retention metrics showing mainstream scale quality.
      - - Anti-thesis
        - >-
          Rizta concentration, South India concentration, and policy-sensitive mainstream buyers can all compress the
          multiple if growth slows.
        - A more balanced model mix and stronger non-south contribution would improve resilience.
    notes: The chapter's decision is not a scorecard of company quality alone; it is a price-versus-proof judgment.
