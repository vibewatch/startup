      - number: '8.3'
        title: Comparable set, valuation premium, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The most important comparable is not TVS or Bajaj on a pure market-cap basis because those are larger
              diversified incumbents, nor is Hero because Vida is only one piece of its business. The cleanest public
              comp is Ola Electric as the other listed pure-play Indian E2W name, and the clearest message from Autocar
              Professional's pricing analysis is that Ather was awarded a quality premium: at IPO pricing it was valued
              at 55% of Ola despite selling about one-third the volume and trailing badly on market share at that
              moment. Investors were effectively paying for better perceived product quality, cleaner brand, stronger
              charging and software narrative, and fewer public service-governance scars. That premium can be justified
              only if Ather keeps executing better than peers. The anti-thesis is therefore straightforward. Legacy
              players such as TVS and Bajaj now command the mainstream family segment with deeper service and
              distribution assets, while Ola can still claim a more aggressive price-performance proposition. If Ather's
              service experience proves inconsistent, if Rizta demand fades, or if policy support rolls off before unit
              economics mature further, the premium multiple should compress toward a more ordinary loss-making OEM
              band.
            claimRefs:
              - CV015
