      - number: '1.3'
        title: Capital history, IPO transition, and shareholder map
        blocks:
          - type: paragraph
            body: >-
              Ather’s financing path shows both resilience and valuation discipline. Public reporting and the prospectus
              indicate that the company raised a $71 million NIIF-led round in August 2024 at roughly a $1.3 billion
              valuation, cementing unicorn status before the IPO process. By the time of listing, the public-market
              entry was smaller and more pragmatic than some earlier expectations: the final IPO was priced at ₹304–321
              per share, with a ₹2,626 crore fresh issue and a much smaller offer for sale than first contemplated in
              the DRHP. At the upper band, Ather’s implied valuation was about ₹11,956 crore, or roughly $1.4 billion.
              Hero MotoCorp remained the anchor strategic shareholder and was still treated as a promoter in the
              prospectus. This is not a cap table that looks abandoned; rather, it looks like a founder-led company that
              used listing as a capital bridge into the next manufacturing phase while keeping strategic sponsor support
              intact. The overview implication is that valuation credibility now depends less on fundraising
              storytelling and more on listed-company execution against disclosed manufacturing and margin plans.
