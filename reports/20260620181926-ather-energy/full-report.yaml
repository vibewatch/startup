      - number: '1.4'
        title: Scale evidence, leadership, and the adverse baseline
        blocks:
          - type: paragraph
            body: >-
              The scale picture is real, but the adverse baseline is too. The prospectus and annual report show Ather
              had already built meaningful volume, share and product breadth before listing: FY24 revenue was ₹1,753.8
              crore, prospectus market share was 11.5% in FY24, and the Rizta alone sold 88,869 units in FY25. FY26
              reporting then showed another sharp step-up, with revenue from operations of ₹3,671.76 crore and a
              materially narrower loss. Still, the same filing set underscores why this remains a WATCH-style story
              rather than an obvious buy. The company has incurred losses since incorporation, relied on ongoing
              investment to expand capacity and network infrastructure, disclosed legal proceedings involving the
              company and certain promoters/directors, and highlighted battery-safety plus import-dependence risks in
              its own risk factors. That mix means the business has already escaped the “concept risk” zone, but it has
              not escaped execution, capital-intensity or public-market scrutiny risk. In other words, Ather’s overview
              supports a strong product-and-brand platform, but not a de-risked operating model yet.
