      - number: '3.2'
        title: Head-to-head profiles across the top tier
        blocks:
          - type: paragraph
            body: >-
              TVS and Bajaj are the hardest direct strategic benchmarks because both now win where India’s mass-market
              buyer increasingly cares most: dependable service, familiar brand trust, and family-usable packaging. TVS
              iQube combines a wide variant ladder, portable charging, long IDC range claims, and 2,800-plus dealers
              across 1,000-plus cities. Bajaj’s Chetak counters with a simpler trust proposition built around metal-body
              durability, 4,100-plus service touchpoints, and increasingly affordable variants. Ola remains the
              spec-sheet outlier: its S1 Pro+ advertises 320 km IDC range, 130 kmph top speed, and aggressive pricing,
              but independent FY2026 coverage still ties the brand to service-related friction and a sharp loss of
              share. Hero Vida is different again. It does not dominate the performance conversation, yet it has scaled
              quickly by leaning into removable-battery practicality and the comfort buyers want in urban commuting.
              Ather’s own position sits between these models: the 450 line remains software-led and enthusiast-friendly,
              Rizta is its family-market answer, and charging plus software remain differentiators, but the company
              still has to prove that these advantages can offset rivals whose distribution power is already broader.
