  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Ather's customer base is no longer a single premium-enthusiast niche. The official product surfaces and
              dealer segmentation now show at least three practical buyer clusters. First, the 450X and 450S still
              address tech-forward urban commuters, students, office riders, and performance-oriented early adopters who
              value acceleration, Google Maps navigation, ride modes, OTA updates, and app-linked control more than
              maximum storage. Second, Rizta has materially broadened the buyer base toward families and mainstream
              scooter households, where the purchase decision is driven by seat comfort, boot capacity, predictable
              range, safety, and low running cost rather than outright speed. Third, public user reviews show an
              adjacent work-use cohort such as parcel-delivery or high-frequency city riders, for whom quiet operation,
              low maintenance, and fuel savings matter more than brand cachet. This matters because Ather's current
              customer mix is increasingly a portfolio of use cases rather than a single identity brand. The bullish
              read is that Ather found a credible path beyond enthusiast buyers; the caution is that family and commuter
              customers are less tolerant of service friction and price-premium slippage than early adopters were.
