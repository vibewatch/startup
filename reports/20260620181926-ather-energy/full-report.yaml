      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bear
        - >-
          Subsidy support weakens, service friction stays visible, Rizta concentration persists, and losses stop
          narrowing materially
        - 1.5x-2.2x FY26 revenue implies roughly ₹5,500-8,100 crore value
        - Policy expiry, channel strain, competitive pressure, and margin reversal
        - Real if FY27 gross margin stalls or market share slips back toward low teens
      - - Base
        - >-
          Ather sustains high-teens share, ancillary revenue mix improves, and losses continue to narrow without proving
          full profitability yet
        - 2.8x-3.5x FY26 revenue implies roughly ₹10,300-12,900 crore value
        - Service quality must hold while scaling outside South India
        - Current IPO valuation sits here, making the stock fair rather than cheap
      - - Bull
        - >-
          Share exceeds 20%, service metrics stay clean, Maharashtra expansion executes, and software / charging revenue
          deepen the moat
        - 4.0x-5.0x FY26 revenue implies roughly ₹14,700-18,400 crore value
        - Requires genuine proof that Ather deserves a premium public-EV multiple
