  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Ather’s product architecture stacks rider-facing scooters on top of software, charging, data, and engineering
      layers.
    data:
      layers:
        - label: Rider and use-case layer
          modules:
            - 450 performance use case
            - Rizta family use case
          detail: Two product lines cover performance and family jobs while sharing the same connected ecosystem.
        - label: Vehicle feature layer
          modules:
            - Dashboard UX
            - Voice on Ather
            - Safety controls
            - Ride modes
          detail: >-
            Navigation, alerts, traction control, AutoHold, and other ride features are exposed at the vehicle
            interface.
        - label: Connected software layer
          modules:
            - AtherStack
            - OTA updates
            - Ride statistics
            - Remote controls
          detail: >-
            Product value keeps changing after purchase because software is a first-class part of the scooter
            experience.
        - label: Charging and energy layer
          modules:
            - Ather Grid
            - Ather Duo / portable AC charging
            - App-based charger discovery
          detail: Charging is integrated into the ownership system rather than treated as a separate ecosystem.
        - label: Data and engineering layer
          modules:
            - Cloud telemetry
            - Siemens PLM / simulation
            - GitHub tooling
          detail: >-
            Telemetry, design tools, and open-source engineering assets help shorten iteration loops and support
            interoperability.
