      - number: '2.3'
        title: Buyer segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              The fastest-moving Indian E2W demand in 2026 is not the enthusiast niche that originally made Ather
              famous. The market has pivoted toward family mobility, where reliability, comfort, practicality, and
              service confidence outweigh acceleration bragging rights. BusinessLine’s FY2026 framing is especially
              useful here: TVS iQube, Bajaj Chetak, and Ather Rizta together represent the market’s move into mainstream
              replacement behaviour, not trial purchases. Ather’s own filings support the same conclusion. The company
              says its distribution was strongest in South India because performance scooters found earlier traction
              there, but Rizta let Ather address the convenience-scooter category that makes up the bulk of the market
              and pushed national share higher in Q4 FY2025. Segment detail matters. Working professionals and women
              continue to pull scooter share higher because of convenience and ease of use. Family buyers care about
              seat, storage, stability, and predictable range. Delivery riders and fleet operators care about uptime,
              charging rhythm, and TCO. These segments do not buy on the same feature stack, so Ather’s market expansion
              depends less on headline EV penetration and more on whether Rizta can keep converting commuter households
              while the 450 line preserves brand aspiration.
