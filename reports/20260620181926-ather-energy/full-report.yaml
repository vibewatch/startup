      - number: '7.4'
        title: Financial model risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is the central reason Ather still belongs in a high-risk bucket despite better
              public disclosures than most EV peers. The company has incurred losses since incorporation and has posted
              negative operating cash flow for years, while still funding network growth, product expansion, and a new
              Maharashtra plant. FY26 results clearly improved the shape of the story, with a narrower annual loss,
              stronger Q4 volumes, and more evidence that software, charging, accessories, and service can contribute
              recurring revenue. That matters because 12% non-vehicle revenue and high AtherStack attach rates are
              exactly the sort of signals investors want to see from an EV OEM trying to earn more than hardware
              margins. But the risk is unresolved, not removed. The business is newly public, so every quarterly miss
              can immediately reprice capital access and brand confidence. The mitigation frame therefore has to be
              trigger-based. Investors should watch subsidy rollover after July 2026, service satisfaction in new
              regions, Maharashtra plant execution, gross-margin progression, and whether Ather can hold market share
              while scaling beyond South India. If losses widen again, if Rizta mix weakens without 450 replacement
              strength, or if service complaints rise while legacy competitors deepen their support edge, the equity
              story de-rates quickly.
            claimRefs:
