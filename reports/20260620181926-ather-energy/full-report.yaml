      - number: '4.3'
        title: Capital adequacy, liquidity, and use of funds
        blocks:
          - type: paragraph
            body: >-
              The prospectus makes clear that the IPO was not a maturity event in which Ather simply repaired the
              balance sheet; it was a forward-investment raise. The biggest planned bucket was ₹927.2 crore for a
              Maharashtra electric two-wheeler factory, followed by ₹750 crore for R&D, ₹300 crore for marketing, and
              only ₹40 crore for borrowing repayment. That split alone tells you the company still needs substantial
              capital to fund manufacturing scale and product development. The May 2026 utilization table reinforces the
              point. Only a fraction of the factory, marketing, and R&D allocations had been deployed by that date, so
              much of the capex and commercialization burden still sits ahead of the company rather than behind it.

              Balance-sheet disclosure is good enough to show resources, but not enough to close the runway question.
              The FY26 filing disclosed more than ₹1,375 crore across investments, cash, and bank balances, plus a
              broader ₹2,683.63 crore current-financial-asset base and manageable non-current borrowings. A simple
              loss-based runway proxy makes headline liquidity look comfortable, but that estimate almost certainly
              flatters reality because it ignores inventory swings, working-capital absorption, and future factory
              spend. The financial view here is that Ather is funded to keep operating and investing, but not yet funded
              so transparently that outside investors can stop asking for a board-grade cash plan.
