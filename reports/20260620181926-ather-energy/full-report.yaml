      - number: '4.2'
        title: Cost structure, gross margin, and unit-economics path
        blocks:
          - type: paragraph
            body: >-
              The FY26 filing shows a cost structure that still looks unmistakably hardware-heavy. Cost of materials
              consumed alone was ₹2,808.15 crore, far larger than any other expense line, which means Ather’s margin
              story still lives or dies on procurement discipline, design simplification, supply-chain execution, and
              inventory management. Employee cost, finance cost, depreciation, and marketing remain meaningful but
              secondary relative to BOM economics. That is consistent with prospectus and annual-report definitions of
              gross-margin mechanics, which center materials, stock-in-trade, and inventory changes rather than any
              software-style revenue-leverage story.

              Even so, the direction of travel is clearly improving. FY25 adjusted gross margin reached 19%, while
              adjusted gross margin without subsidy was only 12%, showing both progress and ongoing sensitivity to
              incentives. Q2 FY26 coverage pushed the improvement narrative further, with adjusted gross margin at
              ₹210.6 crore or 22% and EBITDA margin at -10%. Reuters-style FY26 coverage attributed the first-ever
              annual loss decline to Rizta demand and lower unit costs. The right conclusion is not that Ather has
              solved unit economics; it is that there is now credible evidence of a margin path, but the open record
              still cannot cleanly separate structural improvement from mix uplift and policy support.
