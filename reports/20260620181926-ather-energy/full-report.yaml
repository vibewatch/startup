  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and FY2026 leaderboard
        blocks:
          - type: paragraph
            body: >-
              The competitive set for Ather is now clear and unusually concentrated. FY2026 market trackers show TVS,
              Bajaj, Ather, Ola, and Hero Vida occupying the top tier, with Ampere behind them and smaller players such
              as Pure EV and Bounce still far below the six-figure annual scale band. This matters because the market is
              no longer rewarding novelty alone. BusinessLine and Autocar Professional both frame FY2026 as a structural
              turn in which legacy manufacturers converted scale, supply-chain leverage, and after-sales networks into
              share gains, while Ather proved it could still grow quickly after broadening from the 450 performance line
              into the Rizta family segment. April 2026 snapshots reinforce the same pattern: TVS led, Bajaj followed,
              Ather held third, Vida was already material, and Ola remained visible but diminished. The implication is
              that buyers now compare Ather against multiple solution archetypes at once: trust-heavy incumbents, a
              high-spec disruptor, a removable-battery value scaler, and a tail of smaller price challengers.
              Competitive diligence therefore has to assess not just products, but channel strength, service confidence,
              and who owns the most credible “family scooter replacement” narrative.
