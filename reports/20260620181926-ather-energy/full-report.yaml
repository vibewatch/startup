      - number: '8.4'
        title: Bull / base / bear cases and recommendation logic
        blocks:
          - type: paragraph
            body: >-
              Ather's valuation is best framed as a scenario range anchored to current revenue rather than to distant
              perfection. In a bear case, the market treats Ather as a still-loss-making OEM facing subsidy risk, rising
              competition, and product concentration; that supports only about 1.5x to 2.2x FY26 revenue, or roughly
              ₹5,500-8,100 crore. In a base case, the market accepts that Ather is a better-than-average public EV
              platform with improving losses, a real ancillary-revenue layer, and room to hold high-teens market share;
              that supports about 2.8x to 3.5x revenue, or roughly ₹10,300-12,900 crore. In a bull case, Ather proves
              that service execution scales, market share pushes sustainably above 20%, and ecosystem revenues rise
              without losing brand discipline; that would justify roughly 4.0x to 5.0x revenue, or about ₹14,700-18,400
              crore. The issue-price valuation sits inside the base band. That is why the recommendation is track rather
              than buy or avoid. The stock is investable, but the price is no longer a venture-style bargain that can
              ignore execution risk. The next re-rating must come from FY27 proof, not from story inflation.
            claimRefs:
              - CV022
              - CV023
