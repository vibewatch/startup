  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量、定价与组合
        blocks:
          - type: paragraph
            body: >-
              Ather 的公开财务记录足以勾勒收入质量的大致形状，但还不足以完全承保。FY25 报告给出了最干净的经审计组合视图：88% 收入来自整车销售，12%
              来自非整车收入。这个比例很关键，因为公司已经不再把自己讲成纯粹的踏板车 ASP 故事。Q2 FY26 报告进一步把图景说清楚，点名软件订阅、充电、配件、备件和服务是主要非整车贡献项。换句话说，Ather
              试图变现的是一个装机基础生态，而不只是一次性踏板车交付。

              仍然缺失的是实现价格细节。官方产品页公布了 450 和 Rizta 家族的当前 ex-showroom 价格，这些价格点高于 FY25
              单车收入数字。这个差距不天然负面；它很可能反映车型组合、折扣、金融、补贴，以及确认收入并不等于标题标价。但这确实意味着，投资人仍无法判断，收入增长有多少来自可持续定价权，又有多少来自政策支持和附加变现。收入质量在改善，但披露还没有完整。
