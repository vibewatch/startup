      - number: '8.2'
        title: 经营证明、利润率轨迹和倍数支撑
        blocks:
          - type: paragraph
            body: >-
              Ather 值得高于困境硬件倍数的最强理由，是经营故事已经明显改善。FY26 收入达到 ₹3,671.76 crore，Q4 交付量升至 83,418 辆，全年亏损收窄至 ₹517.17 crore，Q2
              评论指向约 12% 非车辆收入和约 22% 调整后毛利率。年报还显示 88% 用户购买 AtherStack，App 评分保持强劲，这支撑了一个判断：Ather
              不只是组装踏板车，而是在搭建一个生态，靠软件、充电、配件和服务持续拿到钱包份额。话虽如此，证据还不足以给出明确的高溢价增长结论。公司仍在亏损，销量很大一部分仍依赖
              Rizta，也仍暴露在政策辅助的主流家庭可负担性之下。因此，估值问题不是 Ather 有没有真实需求——显然有——而是投资者今天是否应为只被部分证明的经济性支付溢价。按这个标准，当前证据支持围绕 IPO
              水平的基准倍数，而不是在 FY27 执行兑现前大幅重估。
