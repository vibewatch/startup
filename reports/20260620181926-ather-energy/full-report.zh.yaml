      - number: '7.2'
        title: 供应链、制造与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Ather 的集中度比品牌强度看起来的更高。招股书显示，本地采购规模可观但并不完整：截至 2024 年 12 月的九个月，75% 材料成本来自本土，但仍有七个部件从中国、Hong Kong
              SAR、Singapore 和 South Korea 进口，其中五个进口项目与电池相关。供应商集中度有意义。仅第一大供应商就占采购额 23%，前 10 大占
              73%，锂离子电芯被明确列为最大暴露。公司还披露，电子件、电芯、座椅锁和侧撑传感器的供应商选择有限，并承认全球半导体短缺已在 FY21 至 FY23 影响生产。工厂侧，Ather 仍依赖 Hosur
              设施完成踏板车装配和电池包制造。在不出事时可控；一旦中断，生产、服务和交付会同时受打击。公开车主评论显示，当前质量问题更像服务体验、软件小问题、备件周转和本地执行一致性，而不是灾难性故障。即便如此，在大众市场爬坡期仍然危险，因为家庭和通勤买家的耐心低于性能发烧友。电池和高压风险也仍然结构性重要，尽管所给材料没有显示公开召回事件；Ather
              自身服务披露强调电池和软件处理需要专门能力，这意味着服务质量规模化本身就是安全栈的一部分。
