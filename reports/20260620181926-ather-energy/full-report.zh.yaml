      - number: '8.3'
        title: 可比公司、估值溢价和反论点
        blocks:
          - type: paragraph
            body: >-
              最重要的可比对象，不是按纯市值口径看 TVS 或 Bajaj，因为它们是规模更大的多元化既有厂商；也不是 Hero，因为 Vida 只是其业务的一部分。最干净的公开可比公司是 Ola
              Electric，即另一家上市印度 E2W 纯电玩家。Autocar Professional 定价分析传递的最清晰信息是，Ather 获得了质量溢价：按 IPO 定价，Ather 的估值相当于 Ola 的
              55%，尽管当时销量约为 Ola 的三分之一，市场份额也明显落后。投资者实质上是在为更好的感知产品质量、更干净的品牌、更强的充电和软件叙事，以及更少的公开服务治理伤痕付费。只有 Ather
              持续比同行执行更好，这个溢价才站得住。反论点因此很直接。TVS 和 Bajaj 等传统玩家凭更深的服务和分销资产，已经掌握主流家庭细分市场；Ola 仍能主张更激进的性价比。如果 Ather 的服务体验不稳定，如果
              Rizta 需求褪色，或如果单位经济性进一步成熟前政策支持退坡，溢价倍数就应压缩到更普通的亏损 OEM 区间。
