      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              2026 年增长最快的印度 E2W 需求，已经不是最早让 Ather 出名的发烧友小众市场。市场转向家庭出行，可靠性、舒适性、实用性和服务信心，比加速性能的炫耀权更重要。BusinessLine 对 FY2026
              的框架尤其有用：TVS iQube、Bajaj Chetak 和 Ather Rizta 合在一起，代表的是市场进入主流替换行为，而不是试用型购买。Ather
              自己的文件也支持同一结论。公司称，过去分销在南印度最强，因为性能踏板车更早在那里获得牵引力；但 Rizta 让 Ather 切入占据市场主体的便利型踏板车品类，并在 Q4 FY2025
              推高全国份额。分层细节很重要。上班族和女性继续拉高踏板车份额，因为便利、易用。家庭买家关心座椅、储物、稳定性和可预期续航。配送骑手和车队运营方关心在线率、充电节奏和 TCO。这些分层购买的不是同一套功能，所以
              Ather 的市场扩张不取决于 EV 渗透率这个标题数字，而取决于 Rizta 能否持续转化通勤家庭，同时 450 线保住品牌向往。
