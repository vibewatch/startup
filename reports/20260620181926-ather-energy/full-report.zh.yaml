        - 摩托车、高端休闲车和未注册低速 EV
        - 个人家庭买方通常也是付款方
        - 这是 FY2026 核心大众市场 EV 转化池。
      - - 家庭踏板车
        - 为家庭出行、办事、接送上学和混合通勤购买，强调双人乘坐和实用性的踏板车
        - 主要为加速或形象购买的性能优先发烧友产品
        - 家庭决策者付款；多名家庭成员使用
        - Rizta、iQube 和 Chetak 的增长显示，这一块现在是最快的主流采用路径。
      - - 配送 / 车队工具
        - 用于餐饮、包裹和最后一公里配送的高使用率踏板车，TCO 很关键
        - 乘用 3W 车队和重型商用 EV 类别
        - 车队运营商或零工劳动者付款并使用
        - 该细分市场更看重运行成本节省和正常运行时间，而不是品牌向往。
      - - 充电和软件邻接
        - 影响购买转化的充电接入、导航、安全、OTA 功能和电池计划
        - 与两轮车零售需求无关的独立充电 CPO 经济性
        - 车辆买方通过踏板车所有权组合直接或间接付款
        - Ather 的软件加充电栈重要，只因为它改善踏板车转化和留存。
      - - 现状替代品
        - 购买汽油踏板车或推迟替换
        - 更广泛的公共交通支出和汽车购买
        - 与 EV 踏板车决策相同的家庭或个人预算
        - 真正的竞争基线仍是 ICE 替代，而不只是竞争 EV OEM。
    notes: 边界从印度所有两轮车开始，但收窄到踏板车主导的通勤、家庭和配送场景；在这些场景里，EV 经济性和充电便利性有现实机会转化需求。
