        - FY2026 销量 14,352 辆
        - 头部之外的价格敏感 EV 买家
        - 仍在增长，并在市场中保持存在
        - 保留的官方页面信息稀疏，削弱透明度和品牌信心。
      - - Bounce Infinity
        - 电池便携性挑战者
        - 2026 年 4 月销量 1,077 辆；低基数下进入前十
        - 看重可拆卸电池的公寓或城市买家
