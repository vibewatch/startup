      - number: '7.4'
        title: 财务模型风险、缓释因素和打破论点的触发器
        blocks:
          - type: paragraph
            body: >-
              财务模型风险，是 Ather 尽管披露优于多数 EV 同行、仍应归入高风险桶的核心原因。公司自成立以来一直亏损，并且多年经营现金流为负；同时还要继续投入网络扩张、产品扩充和 Maharashtra
              新工厂。FY26 结果明显改善了叙事形态：全年亏损收窄，Q4 交付量更强，也有更多证据显示软件、充电、配件和服务能够贡献经常性收入。这很重要，因为 12% 非车辆收入和较高 AtherStack
              绑定率，正是投资者希望从一家试图赚到硬件利润之外收入的 EV OEM
              身上看到的信号。但风险只是缓和，并没有消失。公司刚上市，每一次季度失误都可能立刻重定价资本可得性和品牌信心。因此，缓释框架必须以触发器为核心。投资者应跟踪 2026 年 7
              月之后的补贴延续、新区域服务满意度、Maharashtra 工厂执行、毛利率进展，以及 Ather 在走出印度南部时能否守住市场份额。如果亏损再次扩大，如果 Rizta 组合走弱且 450
              不能接力，或如果服务投诉上升、传统竞争对手又加深支持优势，股权故事会迅速降级。
