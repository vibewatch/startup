companyProfile:
  summary: >-
    Ather Energy 是一家创立于 Bengaluru 的电动两轮车制造商，把高端踏板车与软件、充电和服务生态打包在一起。核心产品线包括偏性能的 Ather 450 家族和面向家庭的 Rizta，由 AtherStack
    软件、Ather Grid 充电网络，以及公司控制的体验中心网络支撑。2025 年上市后，Ather 成为公开市场中最便于尽调的印度 EV 创业公司之一：收入规模真实，利润率改善路径也看得见，但距离全面盈利仍有差距。
