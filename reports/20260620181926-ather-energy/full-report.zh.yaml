  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与当前规模
        blocks:
          - type: paragraph
            body: >-
              Ather 的正确市场边界不是“所有 EV”，甚至也不是“所有踏板车”。外层 TAM 要从印度整个两轮车市场算起——FY2026 该市场达到 21.41 million
              台，因为每一辆电动踏板车最终都在与一辆燃油两轮车，或一个推迟换车的决定竞争。但实际 SAM 更窄：偏踏板车的通勤和家庭场景，加上部分配送和城市工具用途；在这些场景里，充电可达性、日里程和总拥有成本更容易让 EV
              占优。这个品类已经大到足够重要。Ather 年报和多个 FY2026 市场追踪都显示，E2W 销量从 FY2025 的约 1.15 million 台增至 FY2026 的约 1.40 million
              台，渗透率从 5.8% 升至 6.54%。踏板车这一形态内部也在继续扩张：踏板车在整体两轮车组合中的占比从 FY2019 的约 32% 升至 FY2025 的约 36%，而 FY2025 印度踏板车销量中约
              15.7% 已经是电动。核心尽调问题因此不再是“有没有市场？”，而是“哪些买家切片转换得足够快，经济账如何？”
