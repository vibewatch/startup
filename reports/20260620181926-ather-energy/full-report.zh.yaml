        - 检查补贴支持减弱后，家用踏板车组合能否维持。
      - - 使用成本和维护优势
        - 正向
        - 结构性
        - 即使标价仍然更高，TCO 仍让 EV 保持吸引力。
        - 用城市电价和真实年里程压力测试节省空间。
