        - Ather 定价为 Ola 的 55%，尽管销量和份额明显更低
        - 最相关的印度上市 E2W 纯标的可比
        - 相对表述本身不能证明哪家公司更配得上溢价
      - - TVS / Bajaj 既有厂商规模基准
        - FY26 E2W 销量
        - TVS 约 341k 辆，Bajaj 约 289k 辆，均高于 Ather 约 239k 辆
        - 显示 Ather 尚未成为品类里的主导执行者
        - 集团结构让公开资料无法直接拆出 EV 业务估值
      - - Hero Vida 相邻项
        - FY26 E2W 销量加战略股东重叠
        - Vida 约 144k 辆，同时 Hero 仍持有 Ather 主要股权
        - 有助于思考战略可选性和竞争重叠
        - 没有独立公开的 Vida 估值
    notes: 这张表强调估值纪律，而不是虚假的精确度。给定资料里，只有 Ather 自身 IPO 标记是干净的收入倍数锚。
