        - 规模仍远低于头部；若大型 OEM 回应同一需求，护城河会很窄。
    notes: 规模数据混合了 FY2026 年销量和当前市场信号，因为小型挑战者没有同样丰富的公开财务背景；目标是比较竞争姿态，而不是对齐经审计利润率。
