      - number: '7.3'
        title: 伙伴、客户、竞争与模型风险
        blocks:
          - type: paragraph
            body: >-
              Ather 的商业风险现在已经和竞争格局绑在一起。FY26 数据显示，TVS 和 Bajaj 的规模已经超过 Ather，Hero Vida 也在快速爬升；Ola 仍在消费者心里定义性能上限。这一点重要，因为印度
              E2W 市场已经从早期尝鲜热度，转向主流家庭出行、实用替代和服务信任。这个转向帮了 Ather 一把：Rizta 打开了更大的
              TAM；但售后执行一旦薄弱，代价也更高。产品和地域集中度进一步放大风险。外部市场数据来源称，Rizta 目前贡献约 70% 销量；与 IPO 相关的公开报道则称，FY25 前九个月约 61%
              销售额仍来自印度南部。这比依赖单一企业客户的风险结构更好，但集中度仍然存在。渠道依赖也很关键：第三方零售伙伴运营几乎所有体验和服务中心，其中一家伙伴贡献了 FY25 前九个月 7% 收入。Ather 的充电和
              App 生态是真护城河，但并非没有对手。TVS 强调关系经理模式和 2,000 多个公共充电桩，Chetak 提到 4,100 多个服务触点和 60 多万骑手，Ola
              则继续用更低起售价营销更激进的续航和速度。战略股东风险更隐蔽，但真实存在：Hero 仍是重要资本支持方，但 Hero 也在放大 Vida，支持和重叠可以同时存在。
