      - number: '5.3'
        title: 充电网络、制造方式与路线图
        blocks:
          - type: paragraph
            body: >-
              Ather 的充电网络现在已经足够大，成为产品核心部分，而不只是配件。官方页面称其拥有印度最大的两轮车快充网络，10 分钟补能 30 km 续航，支持 App 端会话监控和支付，并拥有数千个公共充电点。Rizta
              产品页进一步把说法推高，引用 370 多个城市、5,900 多个充电点；FY26 期间的独立报道则在年内较早阶段引用 4,322 个点。正确解读是，网络正在快速扩张，Ather
              想让充电、路线和用车软件像同一个连贯操作系统。

              制造和路线图信号也指向一家公司正试图超越最初的高端发烧友小众市场，走向工业化。年报称，现有设施年产能可超过 4.2 lakh 台 E2W。Machinemaker 称，EL 平台是 Ather 自 450
              以来第一个新车架构，基于 26 lakh km 数据打造，目标是降低零部件数量、加快装配并提高可维护性。GreentechLead 又补充了与 Amara Raja 的电池本地化路线图、NMC 和 LFP
              化学体系工作、4695 电芯研究，以及规模大得多的 Maharashtra Factory 3.0。合在一起，路线图支持公司可信地走向更广细分和更低服务成本，但也提高了执行风险，因为 Ather
              未来更大一部分价值现在取决于平台转换、制造爬坡和供应商本地化能否按计划落地。
