      - number: '1.2'
        title: 软件定义生态与线下网络
        blocks:
          - type: paragraph
            body: >-
              公司讲差异化，并不只是“踏板车制造商”这么简单。在正式发行文件中，Ather 将自己描述为一家 pure-play EV
              公司，销售在印度构思并设计的电动两轮车，以及配套软件、充电基础设施和智能配件。年报把这个逻辑展开：AtherStack 提供导航、分析、骑行辅助、安全和效率层；公司的充电基础设施则把便携家充、Ather Grid
              公共网络和 LECCS 互操作目标组合起来。FY2024-25 年报披露，公司在 360 多个城市拥有 3,611 个充电器和 375 家全球体验中心；Outlook Business
              引用的更近期管理层评论则指向 Q2 FY26 的 4,322 个充电点。零售触达、充电密度和软件更新叠在一起，是 Ather 在大众市场竞争加剧后仍能维持高端品牌定位的最强理由。
