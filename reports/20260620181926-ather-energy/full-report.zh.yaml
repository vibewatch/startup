      - number: '8.4'
        title: 牛 / 基准 / 熊情景和建议逻辑
        blocks:
          - type: paragraph
            body: >-
              Ather 的估值最好用锚定当前收入的情景区间来框定，而不是锚定遥远的完美状态。熊情景下，市场把 Ather 视为一家仍亏损、面对补贴风险、竞争升温和产品集中度的 OEM；这只能支撑约 1.5x 到 2.2x
              FY26 收入，约 ₹5,500-8,100 crore。基准情景下，市场接受 Ather 是一个优于平均水平的上市 EV 平台，亏损在改善，附属收入层真实存在，也有空间守住高十位数市场份额；这支撑约 2.8x
              到 3.5x 收入，约 ₹10,300-12,900 crore。牛情景下，Ather 证明服务执行可以随规模放大，市场份额可持续推高到 20% 以上，生态收入上升且不牺牲品牌纪律；这将支持约 4.0x 到
              5.0x 收入，约 ₹14,700-18,400 crore。发行价估值位于基准区间内。因此建议是跟踪，而不是买入或回避。股票具备可投资性，但价格已经不再是可以忽略执行风险的风投式便宜货。下一次重估必须来自
              FY27 证明，而不是故事膨胀。
