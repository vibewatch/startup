  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与 FY2026 排行榜
        blocks:
          - type: paragraph
            body: >-
              Ather 的竞争集合现在已经清晰，而且异常集中。FY2026 市场追踪显示，TVS、Bajaj、Ather、Ola 和 Hero Vida 占据第一梯队，Ampere 位居其后，Pure EV、Bounce
              等小玩家仍远低于六位数年销量区间。这很重要，因为市场已经不再只奖励新鲜感。BusinessLine 和 Autocar Professional 都把 FY2026
              定义为结构性转折：传统制造商把规模、供应链杠杆和售后网络转化为份额增长；Ather 则证明，从 450 性能线拓展到 Rizta 家庭细分后，自己仍能快速增长。2026 年 4 月快照强化了同一格局：TVS
              领先，Bajaj 跟随，Ather 保住第三，Vida 已具备实质规模，Ola 仍可见但明显削弱。含义是，买家现在会同时拿 Ather
              与多种方案原型比较：重信任的传统厂商、高规格颠覆者、可拆电池的价值规模化玩家，以及一长尾价格挑战者。因此，竞争尽调不能只看产品，还要评估渠道强度、服务信心，以及谁拥有最可信的“家庭踏板车替换”叙事。
