      - number: '2.2'
        title: 政策转换与买家经济账
        blocks:
          - type: paragraph
            body: >-
              政策仍然重要，但主要通过获客成本起作用，而不是直接托底制造商。FAME-II 之后，PM E-DRIVE 接替了为期六个月的 EMPS 过渡方案，覆盖 2024 年 4 月 1 日至 2026 年 3 月 31
              日，总支出 ₹10,900 crore，其中包括面向约 2.8 million 辆车的 ₹3,679 crore 需求激励，以及用于公共充电基础设施的 ₹2,000
              crore。官方设计很关键：激励在购车环节流向消费者，再通过 OEM 报销，这意味着需求可能围绕方案截止日突然前置。2026 年 3 月就出现过这种情况，注册量在 4 月恢复正常前冲到接近 190,941
              台。即便补贴噪音退去，经济账仍足够有吸引力，可以支撑 EV 需求。FY2026 的独立报道反复回到同一个逻辑：运行成本可低至约每公里 30 paise，而燃油踏板车约每公里 ₹2；同时 TVS 和 Ather 的
              BaaS 或金融产品降低了标价冲击。未解问题是当前政策窗口结束后会发生什么。市场追踪已把 2026 年 7 月视为下一次真正测试：没有新的买方缓冲后，销量能否保持韧性。
