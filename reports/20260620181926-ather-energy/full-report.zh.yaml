      - CV001
      - CV004
      - CV005
      - CV010
      - CV015
      - CV041
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 扩张期服务质量恶化
        - 评论平台转差，服务 TAT 证据到 FY27 仍不透明或继续恶化
        - 击穿高端品牌和主流家庭扩张论点
        - 从跟踪转向回避，直到运营纪律重新建立
      - - PM E-DRIVE 过渡后的政策冲击
        - 2026 年 7 月后没有平稳的支持过渡，并随后出现明显 ASP 压力
        - 同时削弱家庭需求和利润率假设
        - 将倍数假设下调至熊市区间
      - - 市场份额回落
        - TVS 和 Bajaj 继续拉开差距时，份额回落到低十位数
        - 削弱增长加溢价估值叙事
        - 降低信心，并预期倍数压缩
      - - Maharashtra 工厂失手
        - 产能时间表或资本开支纪律明显滑坡
        - 重新打开 IPO 本应融资穿越的资本强度和执行担忧
        - 重估为增长更慢、风险更高的 OEM
      - - 亏损轨迹反转
        - FY26 改善之后，FY27 亏损再次扩大
        - 表明经营模型的可扩展性低于市场预期
        - 转向回避，除非被异常强劲的市场份额增长抵消
      - - Rizta 依赖被证明脆弱
        - 450 刷新或新产品抵消销量之前，Rizta 占比已经走弱
        - 暴露产品集中和家庭细分脆弱性
        - 下调基础情景估值，等待产品组合多元化
    notes: 这些是实用的公开市场触发项，而不是投机性的宏观恐惧。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV034
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 车型级毛利率
        - Rizta、450 家族、配件、充电和软件之间的利润率拆分
        - 决定家族扩张故事是在增厚收益，还是只是在堆销量
        - 要求管理层披露，或对供应商和经销商做渠道核查
      - - 服务执行数据
        - 城市级投诉率、服务 TAT、备件满足率和重复进店服务次数
        - 大众市场支持质量弱，溢价估值就撑不住
        - 要求内部服务仪表盘和合作伙伴评分卡
      - - 政策敏感性
        - 2026 年 7 月后 PM E-DRIVE 支持减弱时，需求和利润率预计会受多大影响
        - 主流家庭需求比发烧友需求更看价格
        - 结合管理层和经销商访谈，搭建价格弹性敏感性分析
      - - 充电网络经济性
        - 公共充电网络的利用率、场地方流失和盈利能力
        - 充电护城河是差异化主张的核心，但也可能吃掉资本
        - 要求网络利用率、回本周期和在线率数据
      - - 电池和安全数据
        - 质保索赔率、衰减曲线和事故率历史
        - 安全不确定性会压低市场愿意支付的溢价倍数
        - 要求现场故障统计和质保准备金方法
      - - Maharashtra 工厂里程碑
        - 一期时间表、预算执行和供应商准备情况
        - 未来增长和资本强度假设都取决于执行
        - 每季度跟踪管理层指引与工厂、供应商里程碑的偏差
    notes: 这些问题足以把建议明确推向买入或回避；拿不到答案，审慎立场仍应是持续跟踪。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV043
