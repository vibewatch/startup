      - number: '4.3'
        title: 资本充足性、流动性与资金用途
        blocks:
          - type: paragraph
            body: >-
              招股书明确显示，IPO 不是 Ather 简单修复资产负债表的成熟事件，而是一次面向未来投资的融资。计划中最大的一桶，是为 Maharashtra 电动两轮车工厂投入 ₹927.2 crore；随后是 R&D
              ₹750 crore、营销 ₹300 crore，借款偿还只有 ₹40 crore。仅这个分配就说明，公司仍需要大量资本来支撑制造规模和产品开发。2026 年 5
              月资金使用表进一步强化了这一点。到该日期，工厂、营销和 R&D 分配只动用了部分资金，因此大部分 capex 和商业化负担仍在公司前方，而不是身后。

              资产负债表披露足以显示资源，但不足以关上 runway 问题。FY26 文件披露，投资、现金和银行余额合计超过 ₹1,375 crore，另有更广义的 ₹2,683.63 crore
              流动金融资产基础，非流动借款也可控。用亏损简单推算 runway，会让标题流动性看起来舒服，但这个估算几乎肯定美化了现实，因为它忽略了库存波动、营运资本吸收和未来工厂支出。这里的财务判断是：Ather
              有资金继续运营和投资，但透明度还不足以让外部投资人停止要求一份董事会级现金计划。
