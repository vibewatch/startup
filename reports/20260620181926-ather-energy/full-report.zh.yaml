      - number: '2.4'
        title: 渗透率上限、约束与规模判断
        blocks:
          - type: paragraph
            body: >-
              品类在扩张，但渗透率上限仍由三类摩擦决定：价格、充电便利性和执行质量。即便偏乐观的 FY2026
              报道也承认，电动踏板车的前期成本仍高于同级燃油车；因此所有成功品牌都在用服务深度、金融、电池方案或家庭化包装来证明换车合理。固定电池产品在公寓充电上仍有真实摩擦；Rizta
              评测明确指出，这会限制部分城市家庭。竞争也在收紧。传统 OEM 已经证明，服务覆盖和供应商杠杆可以压过先发优势；政策设计也并不总是公平对待创业型 OEM。由此得出的规模判断更务实，而非宣传式。Ather
              的外层机会是印度完整的两轮车替换池，但近期可服务市场，是偏踏板车的通勤、家庭和配送切片：家充或社区充电可用，买家也愿意为软件驱动的可靠性付费。相比过去只有 450 的定位，Rizta
              明显扩大了这个市场；但一旦执行而非政策成为主要护城河，Ather 仍要证明南印度以外扩张和后补贴需求能撑住。
