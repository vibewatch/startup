      - number: '3.3'
        title: 能力、定价与挑战者画像
        blocks:
          - type: paragraph
            body: >-
              Pure EV 和 Bounce Infinity 的重要性，不在于它们威胁 Ather 的高端品牌，而在于它们暴露了市场仍可能碎片化的位置。Bounce
              的官方表述强推可拆电池、更低起售价和适合城市的续航，正面回应了仍限制许多固定电池踏板车的公寓充电摩擦。Pure EV 展示的是另一类风险：独立追踪仍显示 FY2026
              销量有意义增长，但其保留下来的官方页面过于稀疏，产品级透明度明显弱于第一梯队 OEM。即便存在价格驱动需求，这也削弱了外界对其能力信号的信心。对 Ather
              来说，更重要的矩阵问题是：市场到底把公司当作性能科技品牌、家庭踏板车品牌，还是两者兼有。2026 年的答案是“两者都有，但不均衡”。450 线仍靠软件驱动的兴奋感取胜；Rizta 则让 Ather
              参与主流家庭替换浪潮。这种双重性有战略价值，但也意味着 Ather 要同时防守两个位置，而很多竞争对手只围绕一个更清晰的买家承诺优化。
