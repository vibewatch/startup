      - number: '5.2'
        title: 架构、软件栈与工程工具链
        blocks:
          - type: paragraph
            body: >-
              关于 Ather 技术架构，最好的公开证据显示，公司同时从遥测、云基础设施、嵌入式软件和工程流程纪律中构建联网车辆价值。年报把 AtherStack 定义为把 OTA
              更新、骑行统计和云集成带到两轮车上的自有层。Google Cloud 案例研究补上了最深的技术纹理：每辆踏板车 43 个 IoT
              传感器、预测性维护逻辑、路线优化、车队数据反馈到未来产品决策，以及一个月度更新比传统六个月发布周期更重要的运营模式。这使 Ather 的软件栈实质上定义产品，而不是装饰品。

              工程工具链同样认真。Siemens 记录了 Ather 在新车平台中使用 Teamcenter PLM、Simcenter STAR-CCM+、物理测试解决方案和
              NX，并明确强调更快上市和更高一次做对率。GitHub 又增加了一层开发者信号：用于充电互操作的 LECCS、用于不绑定微控制器的嵌入式开发的 ASDK，以及用于 CAN 通信的 ACAN。含义是，Ather
              并不依赖一个自有软件巨石。它运营的是车辆软件、云分析、工程仿真和开源工具组成的分层栈，理应提高迭代速度，但也带来对外部平台的集成依赖。
