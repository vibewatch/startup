      - number: '1.4'
        title: 规模证据、领导层与反向基线
        blocks:
          - type: paragraph
            body: >-
              规模图景是真实的，反向基线也同样真实。招股书和年报显示，上市前 Ather 已经形成有意义的销量、份额和产品宽度：FY24 收入为 ₹1,753.8 crore，招股书披露 FY24 市占率 11.5%，仅
              Rizta 在 FY25 就售出 88,869 台。FY26 报告随后又出现一次明显跃升，运营收入达到 ₹3,671.76 crore，亏损显著收窄。可是同一组文件也说明，为什么这仍是 WATCH
              型故事，而不是显而易见的买入标的。公司自成立以来持续亏损，依赖持续投资扩产和建设网络基础设施，披露了涉及公司及部分 promoters / directors
              的法律程序，并在自身风险因素中强调电池安全与进口依赖风险。这组因素说明，业务已经走出“概念风险”区，但尚未摆脱执行风险、资本密集风险和公开市场审视风险。换句话说，Ather
              的概览支持一个强产品、强品牌的平台，但还不能证明运营模式已经去风险。
