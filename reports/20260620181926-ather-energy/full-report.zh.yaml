    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营模式
        blocks:
          - type: paragraph
            body: >-
              现在看 Ather Energy，更像一家新近上市的印度电动两轮车公司，而不是典型早期创业公司。公司 2013 年由 IIT Madras 校友 Tarun Mehta 和 Swapnil Jain 在
              Bengaluru 创立，目前的法律与报告身份是在 NSE 和 BSE 两地上市的公司。这一点很关键，因为尽调基线已经变了：不同于许多未上市 EV 同行，Ather
              现在发布年报、招股书披露、综合交易所文件和秘书合规文件，投资人可以用正式文件反向校验管理层说法。上述材料呈现出的运营身份相当一致：Ather 销售的是围绕 450 性能线和 Rizta
              家庭线打造的高端电动踏板车生态，充电、软件、配件和订阅都被纳入同一个产品系统，而不是旁支业务。
