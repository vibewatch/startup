      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              采用曲线现在已经体现在运营数据里，而不只是营销文案里。年报销量从 FY24 的 109,577 台升至 FY25 的 155,394 台；FY26 行业报道指向 239,124 台，市占率约 17%，而 FY25
              约为 11%。仅 Q4 FY26 就达到 83,418 台；Q2 FY26 评论则指向 65,595 台交付、524 家体验中心和 4,322 个充电点。最重要的产品级证据是
              Rizta：外部市场数据源把它描述为主要增长驱动，并将其销售贡献置于 FY26 销量约 70%。对消费 EV OEM
              来说，最接近具名企业客户的，是归因清楚的车主证据和长期骑手证言。这类证据存在，但质量参差。BikeDekho 和 HT Auto 评测识别了具名骑手，讨论 40 km
              日常通勤、城市配送工作、家庭使用，以及带充电停靠的城际出行。Drivio 的六个月 Rizta
              测试又围绕舒适性、后备箱实用性、续航真实性和充电行为，提供了更结构化的用车视角。合在一起，这些来源确认了真实使用，但还不能证明 cohort 级耐久性或续费经济性。
