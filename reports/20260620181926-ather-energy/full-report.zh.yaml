        - FY2026 销量 144,313 辆；增长 196%
        - 重视实用性和可拆卸电池的城市通勤人群
        - Hero 母公司信用、价值型细分、可拆卸电池吸引力
        - 保留的官方产品披露比同业更薄；产品光环弱于 TVS/Ather/Ola。
