      - number: '8.5'
        title: 最终尽调问题、持有逻辑和下行触发器
        blocks:
          - type: paragraph
            body: >-
              Ather 已经上市，剩余估值工作不再是判断非流动性退出路径，而是进入纪律，以及投资者能否带着信念穿越未来 12-18
              个月。关键尽调问题务实且可监控：印度南部以外各邦增长质量、分车型毛利率和组合、服务周转数据、充电网络利用率、电池事故和质保趋势，以及 Maharashtra 工厂里程碑执行。投资者还应明确量化政策敏感性：如果
              PM E-DRIVE 支持退坡、家庭买家需求转弱，ASP 和利润率会让出多少？这个论点比软件公司更快破裂，因为硬件、服务和零售彼此牵动。市场份额放缓、服务评价恶化、FY26
              改善后亏损再次扩大，或工厂延迟，都会压缩倍数。反过来，如果 Ather 在拓宽经常性收入并对抗 TVS 和 Bajaj
              守住份额的同时继续缩减亏损，基准情景可以上移。目前审慎持有逻辑很简单：围绕公允价值跟踪，避免为尚未到来的盈利能力支付大额投机溢价。
