  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              相比未上市创业阶段，Ather 现在处在更密的监管边界内。需求仍受益于 PM E-DRIVE，但该方案是消费者激励，而不是永久制造商权益；政策档案显示，e-two-wheeler
              的延期和修订已经成为市场中的活跃变量。公司自身历史说明，补贴变化很重要：Economic Times 引用 IPO 文件指出，FY24 收入压力来自 FAME 支持减少和随之而来的涨价。这意味着 Ather
              暴露的不只是市场需求，还有政策中介下的可负担性。法律侧同样重大。招股书披露，公司、董事和 promoters 涉及未决刑事和税务程序，其中公司自身有 36 起税务程序和 1 起刑事事项；Hero MotoCorp
              作为 corporate
              promoter，还涉及数量大得多的税务和刑事事项。这些都不能证明存在终局性问题，但确实制造了公开市场投资人会大幅折价的标题风险、合规风险和管理层注意力风险。秘书合规披露是主要缓释：FY26
              期间，没有报告针对上市实体或董事的 SEBI 或交易所行动，也没有在该审查期观察到额外不合规。因此，正确的法律结论不是“干净”，而是“受控，但仍有暴露”。
