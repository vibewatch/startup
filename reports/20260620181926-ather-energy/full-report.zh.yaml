      - number: '6.4'
        title: 扩张、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              扩张论点可信，但尚未去风险。Rizta 明显打开了更大的家庭出行市场，外部市场评论称，更广泛的印度 E2W 市场已经从试验转向实用通勤替换。这解释了为什么 Ather 走出高端 450
              身份后增长加速。即便如此，地理、产品组合和渠道结构上的集中风险仍然有意义。外部报道引用的 IPO 风险披露称，FY25 前九个月约 61% 销售仍来自南印度；招股书披露显示，一家零售伙伴贡献了 FY25
              前九个月收入的 7% 和 FY24 收入的 11%。产品集中度也上升了：Rizta 现在被描述为 FY26 销量约
              70%。当家庭细分火热时这是好事，但也意味着增长故事更暴露于主流价值、服务和补贴敏感型买家。公寓充电约束和 Rizta 不可拆电池仍可能阻挡高密度城市住房中的采用。最后，竞争对手没有停下：TVS、Bajaj 和
              Hero 正用更强的传统分销或服务深度攻击同一个家庭使用场景。因此，Ather 的客户扩张故事，取决于服务执行和地理多元化，程度不亚于产品质量。
