      - 论点
      - 什么会改变判断
    rows:
      - - 正论
        - Ather 已经成为一个差异化的公开 EV 平台，软件、充电和分销资产足以支撑高于普通硬件的倍数。
        - 持续展示非整车收入增长、强服务指标和亏损继续收窄。
      - - 正论
        - Rizta 把客群从发烧友买家拓宽到主流家庭出行，显著改善了规模经济。
        - 确认补贴正常化之后，产品结构迁移仍能持续。
      - - 正论
        - IPO 定价克制，没有狂热，只比 2024 年私募独角兽估值略高。
        - 如果市场后来在没有新证据的情况下，把 Ather 重估到远高于基础区间，克制定价论点会变弱。
      - - 反论
        - Ather 仍是亏损 OEM，历史现金流为负，市场最终可能按周期性硬件公司而不是高端 EV 平台给它估值。
        - 正向利润轨迹或更清晰的经常性利润率证据，会削弱这一担忧。
      - - 反论
        - 相对 Ola 的估值溢价，以及与 TVS、Bajaj 的竞争，要求 Ather 拿出比目前公开证据更干净的服务执行。
        - 发布服务 TAT、投诉关闭和留存指标，证明主流规模下的质量。
      - - 反论
        - Rizta 集中、南印度集中和政策敏感的主流买家，都会在增长放缓时压缩倍数。
        - 更均衡的车型组合和更强的非南方贡献，会改善韧性。
    notes: 本章决策不是只给公司质量打分，而是在判断价格与证据是否匹配。
