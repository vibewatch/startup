  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买家任务
        blocks:
          - type: paragraph
            body: >-
              Ather 的客户基础已经不再是单一高端发烧友小众市场。官方产品页面和经销商分层现在至少显示出三个实际买家群。第一，450X 和 450S
              仍面向技术前倾的城市通勤者、学生、办公室骑手和偏性能的早期采用者；他们看重加速、Google Maps 导航、骑行模式、OTA 更新和 App 联动控制，胜过最大储物空间。第二，Rizta
              已经显著把买家基础扩大到家庭和主流踏板车家庭，购买决策由座椅舒适、后备箱容量、可预期续航、安全和低运行成本驱动，而不是绝对速度。第三，公开用户评价显示存在相邻工作用途人群，例如包裹配送或高频城市骑手；对他们而言，安静运行、低维护和省油钱比品牌调性更重要。这很关键，因为
              Ather 当前客户组合越来越像一组使用场景组合，而不是单一身份品牌。乐观解读是，Ather 找到了越过发烧友买家的可信路径；谨慎面则是，家庭和通勤客户对服务摩擦、价格溢价滑坡的容忍度，低于早期采用者。
