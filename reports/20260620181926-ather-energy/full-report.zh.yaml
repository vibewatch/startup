      - 折扣 / 未知项
      - 含义
    rows:
      - - Ather 450 车系
        - ₹135,999–₹152,499
        - IDC 续航 122–161 km；90 km/h
        - 软件栈、导航、牵引力控制、智能显示屏
        - 相比通勤家庭 EV 定价更高端
        - 最适合仍把性能和软件放在首位的买家。
      - - Ather Rizta
        - ~₹1.12L–₹1.54L
        - 宣称续航 123–160 km；面向家庭场景调校
        - 大座椅、储物、安全功能、联网能力
        - 不可拆卸电池仍是现实限制
        - 这是 Ather 转化主流家庭用户的产品。
      - - TVS iQube
        - ₹94,434–₹158,834，另有 BaaS/EMI 包装
        - 94–212 km IDC，取决于版本
        - 便携充电器、广泛版本、客户经理、公共充电器
        - 版本复杂度高，但属有意设计
        - TVS 靠宽度和低风险拥车竞争。
      - - Bajaj Chetak
        - 典型约 ₹1.20L–₹1.35L，另有低于 ₹1L 的 C2501 上市提示
        - 指名版本为 3.0 kWh / 115 km；C2501 提到 113 km
        - 金属车身、置换、金融、服务保障
        - 此处未完全标准化各城市版本价格栈
        - Bajaj 把信任和不断扩展的可负担性结合起来。
      - - Ola S1 Pro / Pro+
        - ₹1,02,499–₹1,24,999
        - 176–320 km IDC；最高 130 kmph
        - 高端性能、MoveOS 功能、取送车服务
        - 现实服务一致性仍是抵消项
        - 参数表比较占主导时，Ola 最快抢到注意力。
      - - Hero Vida
        - 保留的官方页面未清晰披露价格
        - 市场报道强调可拆卸电池实用性
        - 价值导向的城市通勤和售后信心
        - 保留的官方产品页面过于稀疏，难以做精确套餐比较
        - Vida 更靠实用拥车信心竞争，而不是顶级性能。
      - - Bounce Infinity
        - 保留页面中的起售价区间为 ₹1.15L–₹1.25L
        - 70+ 至 100+ km；1.9–2.5 kWh
        - 可拆卸电池和面向城市的可及套餐
        - 具体城市落地价不同
        - Bounce 更像充电摩擦解决方案，而不是全谱系护城河。
    notes: 价格来自保留页面或评测快照，并非统一标准化的全印度上路价数据集；含义比完美的跨城市可比性更重要。
