        - 建模 2026 年 7 月后的需求，不要假设政策会再次延期。
      - - 公共充电和充电网络建设
        - 正向
        - 中期
        - 让非家充家庭之外的买家更有信心。
        - 跟踪充电密度是否扩散到 Ather 扩张的二、三线市场。
      - - 家用踏板车产品潮（Rizta / iQube / Chetak）
        - 正向
        - 当前
