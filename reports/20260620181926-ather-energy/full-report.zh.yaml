  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户流程
        blocks:
          - type: paragraph
            body: >-
              Ather 当前产品表面足够宽，可以服务不同骑行任务，同时不放弃一致的品牌架构。450 线仍是偏性能的旗舰，配有更高最高速度、更强加速、牵引力控制、Google Maps 导航和高端仪表软件。Rizta
              则把品牌重新定位到家庭出行，强调更大座椅、更强储物和舒适性、实时位置分享、SkidControl、Push Navigation 以及安全导向提醒。关键不在于 Ather
              只是推出了两种踏板车形态；它创造了两个进入同一联网生态的客户入口。

              因此，用户流程首先是生态。用户发现车型，买入仪表和 App 体验，通过 Google Maps 和语音功能导航，依赖 OTA 更新逐步改善功能，再用 Ather Grid
              或家充保持车辆在两次骑行之间可用。这比单纯硬件销售更强，因为产品价值在交付后仍会继续。独立客户反馈和评测页面大体支持这一解读：性能和软件反复被提为优势，舒适性、价格敏感，以及偶发的服务或软件小问题仍是最可见摩擦。
