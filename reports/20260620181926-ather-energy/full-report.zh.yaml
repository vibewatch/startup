      - number: '4.2'
        title: 成本结构、毛利率与单元经济路径
        blocks:
          - type: paragraph
            body: >-
              FY26 文件显示，Ather 的成本结构仍然明显偏硬件。仅材料消耗成本就达到 ₹2,808.15 crore，远高于其他任何费用科目，这意味着 Ather
              的利润率故事仍取决于采购纪律、设计简化、供应链执行和库存管理。员工成本、财务成本、折旧和营销仍有意义，但相对于 BOM
              经济性都居次。这与招股书和年报对毛利机制的定义一致：核心是材料、库存商品和存货变动，而不是软件式收入杠杆故事。

              即便如此，趋势明显在改善。FY25 调整后毛利率达到 19%，不含补贴的调整后毛利率只有 12%，同时显示进展和对激励的持续敏感。Q2 FY26 报道进一步强化改善叙事，调整后毛利为 ₹210.6
              crore、毛利率 22%，EBITDA margin 为 -10%。Reuters 式 FY26 报道把首次年度亏损下降归因于 Rizta 需求和更低单车成本。正确结论不是 Ather
              已经解决单元经济，而是已有可信证据显示利润率路径存在；但公开记录仍无法干净区分结构性改善、组合提升和政策支持。
