      - number: '1.3'
        title: 融资历史、IPO 转型与股东图谱
        blocks:
          - type: paragraph
            body: >-
              Ather 的融资路径同时体现韧性和估值纪律。公开报道和招股书显示，公司在 2024 年 8 月完成 NIIF 领投的 $71 million 融资，估值约 $1.3 billion，在 IPO
              前锁定独角兽身份。到上市时，公开市场入口比此前部分预期更小，也更务实：最终 IPO 定价为每股 ₹304–321，新股发行 ₹2,626 crore，出售老股规模远小于 DRHP
              最初设想。按价格区间上限计算，Ather 隐含估值约 ₹11,956 crore，约合 $1.4 billion。Hero MotoCorp 仍是锚定战略股东，并在招股书中继续被视为
              promoter。这不是一张被抛弃的股权表；更像是一家创始人主导的公司，借上市为下一阶段制造扩张搭桥，同时保住战略 sponsor
              支持。概览层面的含义是，估值可信度现在不再主要靠融资叙事，而取决于上市公司能否兑现已披露的制造和利润率计划。
