      - number: '4.4'
        title: 财务结论与剩余阻塞点
        blocks:
          - type: paragraph
            body: >-
              最强的正面结论是，Ather 现在有足够公开证据证明，它是一家真实有规模的运营公司，而不是一个愿景型 EV 故事。收入大幅上台阶，亏损收窄，Rizta 扩大了需求基础，公司仍有 Hero MotoCorp
              这个战略股东。这些事实很重要。相比没有文件、也没有产品级变现证据的未上市 EV 创业公司，它让业务可信度高得多。

              但阻塞点仍然重大。相对部分同行，政策支持看起来不均衡；硬件营运资本仍有分量；IPO 后最大现金用途仍在前方。最重要的是，公司没有公开披露那些能把鼓舞人心的公开叙事转成可投资财务模型的私域指标：服务毛利率、CAC
              和回收期、分业务贡献毛利、保修准备金经济性，以及管理层自己的现金 runway 视图。因此，正确判断是建设性但不能自满：Ather 的利润率改善路径可信，但在投资人能承保耐久性而不只是动量之前，披露还需要更深。
