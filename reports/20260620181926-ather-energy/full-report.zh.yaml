      - number: '6.3'
        title: 留存、重复使用、充电与满意度代理指标
        blocks:
          - type: paragraph
            body: >-
              Ather 不公开披露 NRR、GRR、流失率、续费率或客户数 cohort，因此耐久性只能从行为代理指标推断。最强的正向代理，是软件和生态参与度：FY2024-25 年报称，88% E2W 用户购买了
              AtherStack，AtherStack 贡献 6% 收入，移动 App 在 Android 和 Apple 合并评分为 4.5 / 5。充电页面进一步说明，App 是日常产品循环的一部分，因为骑手可以在
              App 中监控充电状态并支付；年报则称，截至 2025 年 3 月，Ather Grid 已覆盖 360 多个城市、3,611
              个充电器。公开评测总体支持产品侧粘性。骑手反复提到顺滑性能、低运行成本、可靠续航读数和现代 App 驱动服务，是踏板车在数月或数年后仍是优先通勤工具的原因。但同一组材料也揭示了主要弱点：服务体验并不一致强。HT
              Auto 提到仪表死机、导航延迟和备件周转慢；Ecozaar 的评测综合称，最大投诉簇是延误和支持流程挫败感；BikeWale 3.9 / 5 的汇总评分中，一星占比达到有意义的
              18%。结果不是客户喜爱崩塌，而是一个清晰警示：留存可能比 Ather 的高端品牌暗示更依赖本地服务。
