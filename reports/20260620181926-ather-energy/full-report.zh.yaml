  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和公开市场锚点
        blocks:
          - type: paragraph
            body: >-
              估值 Ather 和估值一家私有 EV 初创公司的关键差别在于，Ather 现在有了市场出清后的公开参照点。IPO 定价为区间上限每股 ₹321；Autocar Professional 将其换算为约
              ₹9,330 crore 的投前估值和约 ₹11,956 crore 的投后估值，约合 $1.4 billion。这个水平只略高于 2024 年 NIIF 领投私募轮隐含的约 $1.3
              billion，因此上市并没有带来标题估值的亢奋式跳升。上市结果更像务实，而非投机：Ather 借市场为 Maharashtra 工厂融资、拓宽资本基础，同时接受定价纪律。Hero MotoCorp
              即使被稀释后仍是主要战略持有人，这一点重要，因为它让股权结构里保留了可信的产业支持方。反面同样清楚。招股书时期的风险披露和外部报道仍强调成立以来亏损、经营现金流为负，以及公开市场投资者实际上是在完整盈利证明出现前，为下一段规模扩张买单。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV040
