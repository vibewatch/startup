      - number: '3.2'
        title: 第一梯队正面对比
        blocks:
          - type: paragraph
            body: >-
              TVS 和 Bajaj 是最难对付的直接战略标杆，因为两家公司现在赢在印度大众买家越来越在意的地方：可靠服务、熟悉品牌带来的信任，以及家庭可用的产品包装。TVS iQube 组合了宽 SKU 梯队、便携充电、长
              IDC 续航宣称，以及覆盖 1,000 多个城市的 2,800 多家经销商。Bajaj 的 Chetak 则用更简单的信任主张反击：金属车身耐用性、4,100 多个服务触点，以及越来越可负担的版本。Ola
              仍是参数表异类：S1 Pro+ 宣传 320 km IDC 续航、130 kmph 最高速度和激进定价，但 FY2026 独立报道仍把该品牌与服务摩擦和份额急剧流失联系在一起。Hero Vida
              又不同。它并不主导性能话题，却靠可拆电池的实用性和城市通勤买家想要的舒适感快速放量。Ather 自己的位置介于这些模式之间：450 线仍由软件驱动、对发烧友友好；Rizta
              是其家庭市场答案；充电和软件仍是差异点。但公司还要证明，这些优势能抵消对手更广的分销力量。
