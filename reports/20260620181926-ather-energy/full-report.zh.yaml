      - number: '5.4'
        title: 信任、安全、合规与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，信任和安全已经在功能层面嵌入 Ather 当前产品。Rizta 页面突出 FallSafe、Crash Alert、ParkSafe、拖车和盗窃提醒、远程锁车，以及实时位置分享。450
              页面突出牵引力控制、AutoHold、Magic Twist 和仪表通信功能。官方页面也把电池保修定位为用车信心的重要杠杆；充电文档则强调可控电流输出、热管理和电池安全快充。从买家视角看，Ather
              显然不只是卖加速，而是在卖安全、控制和可靠性。

              合规图景更薄。材料中有上市公司治理表面和秘书合规报告，但没有呈现产品安全白皮书、公开隐私架构、具名网络安全认证，或能让安全敏感或受安全监管买家完成尽调的车辆与充电认证包。客户评论也呈现出联网产品的正常取舍：用户认可
              OTA 修复和软件驱动的用车体验，但仪表延迟、服务摩擦或舒适性限制仍会在一线出现。因此，信任结论是：可见功能设计为正面，证据完整性则混合。Ather
              在产品安全上看起来考虑周到，但公开记录仍没有给出完整的合规证明包。
