      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 最大风险是主流规模，而非概念验证
            body: Ather 已经证明自己能以规模化方式造车、卖车。真正的问题是，从高端发烧友吸引力走向更广泛的家庭出行市场时，它能否同时守住服务质量、成本纪律和抗政策波动的需求。
            calloutType: risk
            claimRefs:
              - CR022
              - CR025
              - CR026
              - CR027
              - CR039
          - type: callout
            title: 上市公司控制是真正的缓释因素
            body: 招股书、治理文件和秘书合规报告，给了 Ather 一个比多数 EV 初创公司更清晰的控制基线。这不能抹掉风险，但显著提高了监控风险的能力。
            calloutType: insight
