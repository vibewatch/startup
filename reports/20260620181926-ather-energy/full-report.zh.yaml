      - number: '3.4'
        title: 分销力量、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              目前印度电动两轮车市场最耐久的护城河，不太像单点技术，更像一组能力：分销触达、服务响应、金融信心，以及把 EV 用车包装成低风险燃油踏板车替换的能力。这解释了 TVS 和 Bajaj 为什么上升得这么快，也解释了
              Ather 虽然品牌强、产品深，仍面临真实执行压力。Ather 的护城河并非虚构。公司仍拥有该细分中最强的软件与充电叙事之一，零售规模有意义，也借 Rizta
              逃出了狭窄的发烧友盒子。但独立报道同样把下行面说清楚：传统 incumbents 拥有更大的网络和资产负债表；如果 Ola 的服务修复站稳，它仍能凭突出的续航、速度和价格宣称抢走注意力。Hero Vida
              用实用性叠加母品牌信任，构成更微妙的威胁；Bounce
              的便携电池叙事则直接攻击品类最难的采用摩擦之一。因此，切换成本只算中等。体验、网络熟悉度和充电生态舒适度可以留住买家，但产品趋同意味着，护城河耐久性现在取决于一个季度接一个季度的执行质量，而不是单靠先发身份。
