- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Ather software + charging ecosystem
    - Incumbents can neutralize with broader service trust and enough app features
    - high
    - Track whether software-led attachment still changes conversion in non-core markets.
  - - TVS service-led family moat
    - If BaaS or variant complexity confuses buyers, value brands can undercut it
    - medium
    - Measure conversion by city and variant, not only national volume.
  - - Bajaj trust and build-quality moat
    - If performance and software become more decisive, Chetak can look conservative
    - medium
    - Watch whether younger urban buyers trade up to richer dashboards elsewhere.
  - - Ola spec-sheet moat
    - Service friction and volatility can offset headline range-speed advantage
    - high
    - Monitor repeat-buy signals and service turnaround rather than launch claims alone.
  - - Vida removable-battery practicality
    - If charging improves broadly, detachable-battery advantage narrows
    - medium
    - Test whether apartment-heavy markets actually over-index toward Vida.
  - - Bounce / Pure price-portability niche
    - Large OEMs can replicate the same value hooks with stronger channels
    - high
    - Treat them as flank attackers unless they prove sustained scale and clearer disclosure.
  - - Ather ecosystem moat
    - Supply-chain or subsidy-claim disruptions can weaken pricing flexibility against larger incumbents
    - medium
    - Track magnet, cell, and subsidy-claim issues because they affect how aggressively Ather can defend share.
  notes: This register scores severity against Ather’s competitive position, not against each brand’s standalone survival risk.
