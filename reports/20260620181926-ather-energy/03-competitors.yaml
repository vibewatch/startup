tables:
- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Profiles the seven named competitors and Ather using public FY2026 volume, product, pricing, and distribution evidence; deeper city-level dealer and margin data are not fully public for every player.
  columns:
  - competitor
  - category
  - scale / funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Ather Energy
    - Top-tier startup / listed EV OEM
    - 239,124 FY2026 units; listed company with public disclosures
    - Performance commuters plus family households via Rizta
    - Software stack, charging ecosystem, brand, dual product positioning
    - Service reach still smaller than leading incumbents; family execution is newer.
  - - TVS iQube
    - Legacy incumbent
    - 341,471 FY2026 units; 24% share
    - Mainstream family and commuter buyers
    - 2,800+ dealers, broad variant ladder, BaaS, trusted service network
    - Less differentiated software brand than Ather; proposition is more execution than aspiration.
  - - Bajaj Chetak
    - Legacy incumbent
    - 289,323 FY2026 units; 21% share
    - Family commuters and ICE replacers
    - 4,100+ service touchpoints, durable metal-body trust, affordable variants
    - Product story is less tech-forward; competitive edge relies on trust and reach.
  - - Ola Electric
    - Scale disruptor
    - 164,294 FY2026 units after 52% decline
    - Spec-seeking urban buyers and price-sensitive switchers
    - Best headline performance/range claims, aggressive pricing, cell-localization narrative
    - Independent coverage still flags service challenges and lost share.
  - - Hero Vida
    - Large incumbent challenger
    - 144,313 FY2026 units; 196% growth
    - Urban commuters wanting practicality and removable batteries
    - Hero parent credibility, value segment, removable battery appeal
    - Official retained product disclosure is thinner than peers; product halo weaker than TVS/Ather/Ola.
  - - Pure EV
    - Smaller challenger
    - 14,352 FY2026 units
    - Price-sensitive EV buyers outside the top tier
    - Still growing and present in the market
    - Official retained page is sparse, weakening transparency and brand confidence.
  - - Bounce Infinity
    - Battery-portability challenger
    - 1,077 April 2026 units; top-10 presence on low base
    - Apartment or urban buyers valuing detachable batteries
    - Portable battery narrative and relatively accessible pricing
    - Scale remains far below the top tier; moat is narrow if larger OEMs answer the same need.
  notes: Scale figures mix annual FY2026 volume and current-market signals because smaller challengers do not have equally rich disclosed financial backdrops; the goal is comparable competitive posture, not audited margin parity.
