- id: TP003
  title: Pricing / packaging comparison
  columns:
  - brand / model anchor
  - price / packaging
  - range / battery / speed cue
  - included capability
  - discount / unknowns
  - implication
  rows:
  - - Ather 450 line
    - ₹135,999–₹152,499
    - 122–161 km IDC; 90 km/h
    - Software stack, navigation, traction control, smart display
    - Premium pricing relative to commuter-family EVs
    - Best fit for buyers who still value performance and software first.
  - - Ather Rizta
    - ~₹1.12L–₹1.54L
    - 123–160 km claimed range; family-oriented tuning
    - Large seat, storage, safety features, connectivity
    - Non-removable battery remains a practical caveat
    - This is Ather’s mainstream-family conversion product.
  - - TVS iQube
    - ₹94,434–₹158,834 plus BaaS/EMI framing
    - 94–212 km IDC depending variant
    - Portable charger, broad variants, relationship manager, public chargers
    - Variant complexity is high but deliberate
    - TVS competes on breadth and low-risk ownership.
  - - Bajaj Chetak
    - ~₹1.20L–₹1.35L typical, with sub-₹1L C2501 launch callout
    - 3.0 kWh / 115 km on named variant; 113 km on C2501 mention
    - Metal body, exchange, finance, service assurance
    - Exact variant-by-city price stack is not fully normalized here
    - Bajaj blends trust with expanding affordability.
  - - Ola S1 Pro / Pro+
    - ₹1,02,499–₹1,24,999
    - 176–320 km IDC; up to 130 kmph
    - High-end performance, MoveOS features, pickup/drop service
    - Real-world service consistency remains the offsetting question
    - Ola wins attention fastest where spec-sheet comparison dominates.
  - - Hero Vida
    - Price not cleanly disclosed in retained official page
    - Removable-battery practicality emphasized in market reporting
    - Value-oriented urban commuting and after-sales confidence
    - Official retained product page is too sparse for exact package comparison
    - Vida competes more on practical ownership confidence than on top-end performance.
  - - Bounce Infinity
    - ₹1.15L–₹1.25L starting-price band in retained page
    - 70+ to 100+ km; 1.9–2.5 kWh
    - Detachable battery and accessible city-focused package
    - Exact city-specific delivered pricing varies
    - Bounce is a charging-friction solution more than a full-spectrum moat.
  notes: Prices are retained-page or review snapshots rather than a single normalized all-India on-road dataset; implication matters more than perfect cross-city comparability.
