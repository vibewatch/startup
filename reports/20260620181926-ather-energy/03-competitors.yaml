- calloutType: risk
  title: The flank attack is real at both ends of the market
  body: TVS and Bajaj attack Ather from above with larger service systems, while Bounce and similar challengers attack from below with portable batteries or simpler price-led value propositions. That leaves Ather needing clean execution in both its performance and family segments at once.
