  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Ather solution
      - Measurable benefit
      - Limitation
    rows:
      - - Navigate urban commute without phone juggling
        - Mount phone or use basic dashboard prompts
        - Google Maps on dashboard plus voice interaction and push navigation
        - Better in-ride navigation and fewer phone interactions
        - Still depends on software responsiveness and map-provider uptime
      - - Keep scooter current after purchase
        - Visit service center or live with stale features
        - OTA updates through AtherStack
        - Monthly or recurring feature uplift without replacing hardware
        - Feature quality still depends on release discipline and testing
      - - Charge during city movement
        - Search manually for compatible charging or go home
        - Ather Grid plus app-based charger discovery and payment
        - Faster top-ups and lower range anxiety
        - Apartment or network-coverage constraints remain
      - - Family-safe daily riding
        - Use mechanical scooter with limited alerts
        - FallSafe, Crash Alert, ParkSafe, SkidControl, live-location sharing
        - Stronger confidence for multi-user household use
        - Public proof of incident reduction is not disclosed
      - - Manage connected ownership
        - Separate service, charging, and ride records
        - App, dashboard, remote controls, ride logs, and diagnostics
        - More integrated ownership journey
        - Software lag or service-process gaps can still frustrate users
    notes: Workflow rows are based on official pages and public technical descriptions; the public corpus explains use cases well but does not quantify conversion or retention impact.
