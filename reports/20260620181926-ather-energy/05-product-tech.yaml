company:
  name: Ather Energy
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Ather’s product stack is best understood as a software-defined electric two-wheeler ecosystem rather than a simple
    scooter catalogue: the 450 line covers performance users, Rizta targets family use cases, Ather Grid extends the
    vehicle into a charging network, and AtherStack plus cloud and OTA layers keep features evolving after purchase.
    Public technical evidence also shows real engineering depth in telemetry, PLM, charging interoperability, and
    product roadmap execution, but it leaves open questions on product-security certifications, battery-quality
    documentation, and how quickly EL-platform and AtherStack-7 ambitions convert into production-scale reliability.
sections:
  - id: product-surface-and-user-workflow
    title: Product surface and customer workflow
    body: >-
      Ather’s current product surface is broad enough to serve different rider jobs without abandoning a coherent brand
      architecture. The 450 line remains the performance-oriented flagship, with higher top speed, stronger acceleration,
      traction control, Google Maps navigation, and premium dashboard software. Rizta repositions the brand for family
      mobility with a larger seat, greater storage-and-comfort emphasis, live-location sharing, SkidControl, Push
      Navigation, and safety-oriented alerting. The key point is that Ather has not merely launched two scooter shapes;
      it has created two customer-entry points into the same connected ecosystem.

      The workflow is therefore ecosystem-first. Users discover a model, buy into the dashboard and app experience,
      navigate through Google Maps and voice functions, rely on OTA updates to improve functionality over time, and use
      Ather Grid or home charging to keep the product useful between rides. That is a stronger workflow than a hardware-
      only sale because product value continues after delivery. Independent customer and review surfaces broadly support
      this reading: performance and software are recurring strengths, while comfort, price sensitivity, and occasional
      service or software quirks remain the most visible frictions.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE028
