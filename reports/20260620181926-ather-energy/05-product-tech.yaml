  - id: trust-safety-compliance-and-gaps
    title: Trust, safety, compliance, and remaining gaps
    body: >-
      Public evidence shows that trust and safety are designed into current Ather products at the feature level. Rizta’s
      page highlights FallSafe, Crash Alert, ParkSafe, Tow and Theft alerts, remote immobilization, and live-location
      sharing. The 450 page highlights traction control, AutoHold, Magic Twist, and dashboard communication features.
      Official pages also position battery warranty as a major ownership-confidence lever, while charging documentation
      emphasizes controlled current delivery, thermal management, and battery-safe fast charging. From a buyer’s point of
      view, Ather is clearly trying to sell safety, control, and reliability rather than just acceleration.

      The compliance picture is thinner. The corpus contains public-company governance surfaces and secretarial
      compliance reporting, but it does not surface a product-security whitepaper, public privacy architecture, named
      cybersecurity certification, or vehicle-and-charging certification package that would close diligence for a
      security-sensitive or safety-regulated buyer. Customer commentary also shows the normal tradeoff of connected
      products: users appreciate OTA fixes and software-led ownership, but dashboard lag, service friction, or comfort
      limitations still appear in the field. The trust verdict is therefore positive on visible feature design and mixed
      on evidence completeness. Ather looks thoughtful on product safety, but the public record still does not provide a
      complete compliance proof pack.
