tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Dependence / risk
      - Diligence gap
    rows:
      - - Ather 450 line
        - Performance-oriented urban rider
        - Mature live product line
        - 6.4 kW motor, traction control, Google Maps, software-led premium positioning
        - Premium pricing and comfort tradeoffs versus mass-market rivals
        - Need attach-rate, warranty-cost, and retention data by 450 cohort
      - - Ather Rizta line
        - Family commuter and comfort-focused rider
        - Live growth product line
        - Family ergonomics, safety alerts, smart connectivity, broader addressable market
        - Broader segment entry raises price and service expectations
        - Need sell-through, repeat purchase, and attachment of paid features
      - - Ather Grid
        - Public charging user and route-dependent rider
        - Live network with expanding footprint
        - Integrated vehicle, app, and fast-charging experience
        - Network uptime and host economics are not public
        - Need paid-session mix, charger utilization, and uptime by cohort
      - - AtherStack / OTA software
        - Existing owners across models
        - Mature, continuously updated layer
        - Vehicle keeps improving after purchase; dashboard is part of product value
        - Software bugs or lag can directly hit product satisfaction
        - Need release cadence, adoption, rollback, and defect metrics
      - - EL platform
        - Future mass-market and multi-segment launches
        - Recent roadmap / pre-scale platform
        - Lower component count, better serviceability, broader segmentation promise
        - Execution and launch timing risk until shipping models land
        - Need SOP milestones, validation status, and cost-down targets
    notes: Matrix separates the current product surface from the enabling platform and network layers because Ather’s moat is ecosystemic, not SKU-by-SKU only.
