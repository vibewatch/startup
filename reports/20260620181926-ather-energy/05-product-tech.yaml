  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-security
      missingEvidence: The corpus does not include a public product-security architecture, privacy whitepaper, or named cybersecurity certification for connected scooters, apps, or charging back ends.
      whyItMatters: Security-sensitive buyers and late-stage investors need more than feature pages to underwrite a connected-vehicle platform.
      diligencePath: Request architecture diagrams, vulnerability-management process, incident history, privacy controls, and any external certification or audit package.
    - type: missing-source
      severity: material
      topic: battery-and-charging-certification
      missingEvidence: Public sources describe battery-safe charging and quality intent but do not provide a clear certification and test package for packs, chargers, and field-safety performance.
      whyItMatters: Battery and charging incidents can damage brand trust, warranty economics, and regulatory relationships.
      diligencePath: Request certification matrix, test standards, warranty-claim data, and any field-failure or recall history by cohort.
    - type: private-evidence-only
      severity: material
      topic: software-quality
      missingEvidence: There is no public release-quality dashboard covering bug rates, OTA rollback rates, feature adoption, or dashboard performance metrics.
