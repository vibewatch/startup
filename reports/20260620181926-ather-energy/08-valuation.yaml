- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Uses the most relevant public or disclosed pricing anchors available in the corpus; diversified incumbents are included as strategic comparables despite weak business-model purity.
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Ather IPO upper band
    - FY26 revenue vs equity value
    - ₹11,956 crore post-money at ₹321; ~3.3x FY26 revenue
    - Best direct public-price anchor for Ather itself
    - Still based on a newly listed, loss-making company before FY27 proof
  - - NIIF-led 2024 private round
    - Private valuation mark
    - ~$1.3 billion implied valuation
    - Shows IPO was not a dramatic markup over the latest private round
    - Private round lacks the transparency and trading discipline of public markets
  - - Ola Electric relative comp
    - Relative public valuation at time of Ather pricing
    - Ather priced at 55% of Ola despite materially lower volume and share
    - Most relevant pure-play listed Indian E2W comparable
    - Relative statement does not by itself prove which company deserved the premium
  - - TVS / Bajaj incumbent scale benchmark
    - FY26 E2W volumes
    - TVS ~341k units, Bajaj ~289k, both above Ather ~239k
    - Shows Ather is not yet the dominant execution leader in its category
    - Conglomerate structures make direct EV segment valuation impossible from public corpus
  - - Hero Vida adjacency
    - FY26 E2W volumes plus strategic-shareholder overlap
    - Vida ~144k units while Hero still holds a major stake in Ather
    - Useful for thinking about strategic optionality and competitive overlap
    - No standalone public Vida valuation exists
  notes: The table emphasizes valuation discipline, not false precision. Only Ather's own IPO mark is a clean revenue-multiple anchor in the provided corpus.
