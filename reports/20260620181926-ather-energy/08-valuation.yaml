callouts:
- calloutType: recommendation
  title: Track, don't chase
  body: Ather is investable and more disclosure-rich than most EV startups, but the IPO price already reflects a solid portion of the credible upside. The next upgrade to buy needs FY27 execution proof, not more storytelling.
