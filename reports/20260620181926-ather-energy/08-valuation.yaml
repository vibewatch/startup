- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Service-quality deterioration during scale-up
    - Review platforms worsen and service TAT evidence remains opaque or deteriorates through FY27
    - Breaks the premium-brand and mainstream-family expansion thesis
    - Move from track toward avoid until operating discipline is re-established
  - - Policy shock after PM E-DRIVE transition
    - No smooth support transition after July 2026 and visible ASP pressure follows
    - Weakens family-demand and margin assumptions simultaneously
    - Cut multiple assumptions toward bear range
  - - Market-share regression
    - Share falls back toward low teens while TVS and Bajaj keep widening the gap
    - Undermines the growth-plus-premium valuation narrative
    - Reduce conviction and expect multiple compression
  - - Maharashtra plant miss
    - Capacity timeline or capex discipline slips materially
    - Reopens capital-intensity and execution concerns the IPO was meant to fund through
    - Re-rate as a slower-growth, higher-risk OEM
  - - Loss trajectory reverses
    - FY27 losses widen again after FY26 improvement
    - Shows the operating model is less scalable than the market hoped
    - Move to avoid unless offset by exceptional market-share gain
  - - Rizta dependence proves fragile
    - Rizta mix weakens before 450 refreshes or new products offset volume
    - Exposes product concentration and family-segment vulnerability
    - Lower base-case valuation and wait for portfolio diversification
  notes: These are practical public-market triggers rather than speculative macro fears.
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV034
  - CV042
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Model-level gross margin
    - Margin split between Rizta, 450 family, accessories, charging, and software
    - Determines whether the family-growth story is accretive or merely volumetric
    - Request management disclosure or channel checks with suppliers and dealers
  - - Service execution data
    - City-level complaint rates, service TAT, spare-parts fill rate, and repeat-service visits
    - Premium valuation cannot survive weak mass-market support quality
    - Request internal service dashboards and partner scorecards
  - - Policy sensitivity
    - Expected demand and margin impact if PM E-DRIVE support tapers after July 2026
    - Mainstream-family demand is more price sensitive than enthusiast demand
    - Build a price-elasticity sensitivity with management and dealer interviews
  - - Charging-network economics
    - Utilization, host churn, and profitability of public charging network
    - Charging moat is central to the differentiation claim but may also absorb capital
    - Request network utilization, payback, and uptime data
  - - Battery and safety data
    - Warranty-claim rate, degradation profile, and incident-rate history
    - Safety uncertainty caps willingness to pay a premium multiple
    - Request field-failure statistics and warranty reserve methodology
  - - Maharashtra plant milestones
    - Phase-one timing, budget adherence, and supplier readiness
    - Future growth and capital-intensity assumptions depend on execution
    - Track management guidance against plant and supplier milestones quarterly
  notes: These asks are enough to move the recommendation decisively toward buy or avoid; without them, the prudent stance remains track.
  claimRefs:
