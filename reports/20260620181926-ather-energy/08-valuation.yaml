company:
  name: Ather Energy
chapter:
  order: 8
  number: 8
  title: Valuation
  summary: 'Ather is one of the rare Indian EV startups that can already be valued against a real public-market price rather than a purely narrative private mark. At the IPO upper band, the company was worth about ₹11,956 crore, or roughly 3.3x FY26 revenue, which looks defensible for a newly public, still-loss-making E2W OEM with improving margins, rising market share, a meaningful software and charging attach story, and richer disclosures than most peers. It does not yet look obviously cheap. The right stance is track: fair around the IPO mark, stretched if investors pay a much larger premium before FY27 proves that Rizta-led growth, service quality, and profitability progress can hold together.'
sections:
- id: financing-context
  title: Financing context and public-market anchor
  body: 'The key difference between valuing Ather and valuing a private EV startup is that Ather now has a market-clearing public reference point. The IPO was priced at ₹321 per share at the top end of the range, which Autocar Professional translated into a pre-money valuation of about ₹9,330 crore and a post-money valuation of about ₹11,956 crore, or roughly $1.4 billion. That is only modestly above the roughly $1.3 billion implied by the NIIF-led 2024 private round, so the listing did not represent a euphoric step-function in headline value. The listing outcome therefore reads as pragmatic rather than speculative: Ather used the market to fund the Maharashtra plant and broaden its capital base while accepting pricing discipline. Hero MotoCorp remains a major strategic holder even after dilution, which matters because it keeps a credible industrial sponsor inside the cap table. The adverse side is equally clear. Prospectus-era risk reporting and external coverage still emphasise losses
    since incorporation, negative operating cash flow, and the fact that public investors are effectively funding the next leg of scale-up before a full proof of profitability exists.'
