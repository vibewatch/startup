- id: diligence-asks
  title: Final diligence asks, hold logic, and downside triggers
  body: 'Because Ather is already public, the remaining valuation work is no longer about an exit path from illiquidity. It is about entry discipline and whether an investor can hold through the next 12-18 months with conviction. The key diligence asks are practical and monitorable: state-wise growth quality outside South India, model-level gross margin and mix, service-turnaround data, charging-network utilization, battery-incident and warranty trends, and milestone execution at the Maharashtra plant. Investors should also quantify policy sensitivity explicitly: if PM E-DRIVE support rolls off and family-buyer demand weakens, how much ASP and margin giveback follows? The thesis breaks faster than in a software company because hardware, service, and retail all interact. A slowdown in market share, a deterioration in service reviews, a widening of losses after FY26''s improvement, or a plant delay would all compress the multiple. Conversely, if Ather keeps shrinking losses while broadening
    recurring revenue and holding share against TVS and Bajaj, the base case can migrate upward. For now, the prudent hold logic is simple: track around fair value, avoid paying a large speculative premium for profitability that has not yet arrived.'
