- id: risks-and-verdict
  title: Customer-quality risks and final verdict
  body: The customer base looks broad and real, but not perfectly transparent. Public evidence implies a diversified SMB-heavy customer mix with platform leverage, which is attractive for revenue resilience. The counterweight is that support quality, pricing friction, or platform-policy dependence could hurt retention faster in a long-tail customer base than in a concentrated enterprise book. The lack of public churn, NRR, or cohort data means this chapter can only partially verify stickiness. Even so, customer proof is strong enough to support the broader thesis that Shippo sells a mission-critical workflow and not just a nice-to-have ecommerce plugin. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution rather than merely broad top-of-funnel awareness. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution
    rather than merely broad top-of-funnel awareness. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution rather than merely broad top-of-funnel awareness.
