chapter:
  number: 6
  title: Customers
  summary: Shippo appears to have a broad, ecommerce-native customer base with credible ROI proof and a strategically important embedded-distribution layer. The strongest evidence comes from operational case studies and app-marketplace traction; the largest blind spot is the absence of public cohort-retention and concentration data, which tempers certainty on revenue durability.
sections:
- id: customer-definition-scale
  title: Who the customer is and how broad the base looks
  body: 'Shippo''s customer story has two layers. The direct layer is the familiar one: ecommerce merchants, especially SMBs, signing up for self-serve shipping software or API access. The second layer is more strategic: software platforms, marketplaces, and operations tools embedding Shippo underneath their own merchant experiences. Public metrics support both readings. Third-party data points to roughly 100,000 direct customers, while Shippo''s own ecosystem metrics describe much larger downstream shipment and merchant reach. The right interpretation is not that one number is wrong, but that they measure different parts of the distribution stack. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution rather than merely broad top-of-funnel awareness. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution
    rather than merely broad top-of-funnel awareness. What matters for underwriting is whether these public signals imply durable adoption, low-friction expansion, and resilient platform-led distribution rather than merely broad top-of-funnel awareness.'
  claimRefs:
  - CU001
