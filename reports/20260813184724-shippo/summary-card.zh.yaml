  topStrengths:
    - 多承运商发货抽象层有很强产品市场匹配，官方证据覆盖 40+ 承运商、平台账户模型，以及商户加 API 分发。
    - 通过 Shopify、WooCommerce、BigCommerce 和嵌入式平台关系获得广泛电商分发，获客和下游触达更分散。
    - 公开 ARR 和客户估算显示，Shippo 已长成有分量的发货软件业务，而不是轻量插件。
  topRisks:
