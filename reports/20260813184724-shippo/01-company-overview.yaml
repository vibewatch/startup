- id: leadership-governance
  title: Founders, leadership, and organizational profile
  body: 'The strongest founder evidence is narrower than some secondary databases suggest. Shippo''s official about page names Laura and Simon as co-founders and explicitly roots the company in their frustration with the shipping complexity of their own online-store project. Public sources uniformly identify Laura Behrens Wu as CEO, and the 2021 fundraising coverage reinforces her role as founder and chief public spokesperson. Shippo does not expose a detailed public board page in the fetched materials, so governance depth is thinner than for IPO-track companies; however, the 2021 funding post highlighted senior leadership additions in engineering and finance, and the about page emphasizes a management bench with alumni from several scaled technology companies. Organizationally, Dealroom''s 2026 talent preview suggests the company has a globally distributed footprint, while Shippo''s own careers language leans into a remote-first operating model. That mix is strategically relevant: it supports
    carrier and partner coverage across multiple geographies, but it also means public governance disclosure is lighter than public-market comparables.'
  claimRefs:
  - CO002
  - CO008
  - CO012
  - CO013
  - CO028
  - CO029
  tableRefs:
  - TO003
  figureRefs:
  - FO002
- id: capitalization-and-scale
  title: Funding history, valuation status, and scale snapshot
  body: 'Shippo''s public financing story is unusually coherent for a private logistics-software company. Official and independent sources agree that the June 2021 round added $50 million and pushed the business to a $1 billion valuation, while secondary databases consistently place lifetime funding around $154 million across eight rounds. The round history visible in Tracxn and Stock Analysis also makes clear that Shippo stepped up sharply from a $495 million Series D valuation in February 2021 to unicorn status just a few months later. Dealroom and Failory both still classify Shippo as a unicorn in 2026, which matters because the user request requires post-2024 confirmation of status. Scale signals are strong but messy: GetLatka points to roughly $51.2 million of 2024 revenue and about 285 employees, Dealroom maps 298 employees, the about page markets $12 billion-plus annual GMV and 200 million-plus shipments, and partner-facing pages talk about 300,000-plus businesses while the 2021 funding
    post highlighted 100,000 direct merchants. The safe takeaway is not that all of these metrics are interchangeable, but that Shippo clearly operates at meaningful software and infrastructure scale while still disclosing metrics in marketing-specific ways.'
