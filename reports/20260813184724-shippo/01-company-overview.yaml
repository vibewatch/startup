- id: milestones-and-context
  title: Milestones, geographic reach, and implications for later chapters
  body: 'The milestone chronology supports a clear narrative for the rest of the report. Shippo began with a merchant-shipping workflow problem, scaled into a multi-carrier API and dashboard, raised progressively larger rounds through 2017 and 2020, then reached unicorn status in 2021. The 2021 funding memo already described international presence in Germany, France, the UK, Canada, and Australia, plus plans to push farther into Western Europe and regional US-carrier coverage. By 2025, partner announcements such as Linnworks and newer customer/partner pages positioned Shippo as infrastructure rather than just a small-business app, emphasizing uptime, compliance work, and multi-tenant shipping for platforms. That shift helps frame later chapters: competition should be evaluated against both dashboard tools and embedded APIs, financial analysis should account for several business surfaces, and customer analysis should preserve the difference between direct merchants and ecosystem reach. The
    main caveat is disclosure hygiene: public founder counts, founding-year cards, and customer counters are not perfectly aligned, so the report should prioritize the explicit metric attached to each source rather than compressing them into one headline number.'
