  topStrengths:
    - Strong product-market fit around multi-carrier shipping abstraction, with official evidence for 40+ carriers, platform account models, and merchant-plus-API distribution.
    - Broad ecommerce distribution through Shopify, WooCommerce, BigCommerce, and embedded platform relationships supports diversified acquisition and downstream reach.
    - Public ARR and customer estimates imply Shippo has grown into a meaningful shipping-software business rather than a lightweight plugin.
  topRisks:
    - The public record does not disclose retention, gross margin, partner concentration, or support-cost detail, which makes the 2021 $1B mark hard to defend with conviction.
    - Customer-friction signals around support, billing, claims, and carrier dependency could compound if growth slows or product complexity rises.
    - Competitive positioning appears strongest for startups, SMBs, and embedded platforms, raising risk that larger or more complex accounts outgrow the product.
  unresolvedGaps:
    - Current post-2021 valuation, secondary-market signal, and any refreshed preferred-stack terms.
    - 2024–2026 actual ARR/revenue, gross margin, burn, and net revenue retention.
    - Partner concentration, claims-loss economics, and enterprise security / compliance artifacts.
