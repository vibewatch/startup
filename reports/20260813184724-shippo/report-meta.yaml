companyProfile:
  summary: >-
    Shippo is a San Francisco-based private shipping-software company founded in 2013 that sells a multi-carrier shipping API and merchant web app for ecommerce brands, marketplaces, and software platforms. Public materials show real infrastructure attributes—40+ carrier connectivity, platform/white-label account models, broad commerce-platform distribution, and roughly 100,000 direct merchants plus wider partner reach—but they do not disclose enough retention, margin, or concentration data to fully validate the 2021 $1B unicorn mark against 2026 market conditions.
  foundedDate: '2013-01-01'
  founders:
