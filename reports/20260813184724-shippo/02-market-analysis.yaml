chapter:
  number: 2
  title: Market Analysis
  summary: Shippo operates inside a several-billion-dollar multi-carrier shipping-software category that is growing at double-digit rates, but its demand base is better understood as a software layer riding on top of a much larger parcel market than as a slice of all logistics spend. Public market reports, parcel-volume benchmarks, and Shippo's own product surfaces all point to a strong structural tailwind from ecommerce shipping complexity, with the biggest frictions now coming from legacy integration, privacy/security scrutiny, and fast-changing cross-border compliance rules.
sections:
- id: market-boundary
  title: Market boundary and practical addressable scope
  body: Shippo should not be underwritten as a generic logistics company. The most defensible market boundary is the multi-carrier shipping-software and infrastructure layer that sits between merchants, platforms, and parcel carriers. That layer includes labels, rate shopping, tracking, returns, address validation, customs data, and carrier-account orchestration, but it excludes owned transportation assets, warehouse leases, and the entire parcel-delivery revenue pool. This distinction matters because the software market is many orders of magnitude smaller than the parcel market it intermediates, yet the parcel market still acts as the demand reservoir. Public product pages make clear that Shippo monetizes software and workflow abstraction, not freight margin in the way an asset-heavy logistics operator does. That means the right TAM framing starts with software-category estimates and is then checked against parcel-volume flows, buyer segments, and distribution channels rather than simply
    citing a giant logistics number. For diligence, the key question is whether this demand signal is durable across merchant cohorts, partner channels, and regulatory cycles, not merely a temporary parcel-volume or ecommerce-cycle effect.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM020
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: TAM, SAM, and parcel-demand lenses
  body: 'Public TAM work is directionally helpful but not precise enough to lean on one number. Mordor Intelligence places parcel-management and multi-carrier shipping software at $2.63 billion in 2025 and $2.93 billion in 2026, growing to just under $5 billion by 2031. Verified Market Reports publishes a broader estimate, which is useful less for its exact number than for proving that public category boundaries vary materially. The parcel-flow lens is much larger: Pitney Bowes says U.S. parcel volume reached 23.1 billion shipments in 2025 and could reach 31 billion by 2031, with revenue per parcel also rising. The right interpretation is that Shippo sits on top of a very large shipment base but captures only a software take-rate on the decisions around those parcels. That suggests a practical SAM defined by SMB, mid-market, and platform-driven merchants needing multi-carrier orchestration, not every parcel moved in the economy. For diligence, the key question is whether this demand signal
    is durable across merchant cohorts, partner channels, and regulatory cycles, not merely a temporary parcel-volume or ecommerce-cycle effect.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM035
