callouts:
- calloutType: insight
  title: The real market is not all shipping spend
  body: Shippo monetizes workflow and orchestration around parcels, not the full transportation bill. That is why category TAM should be framed with software-market sources first and parcel-volume sources second.
  claimRefs:
  - CM001
  - CM003
  - CM035
- calloutType: risk
  title: Cross-border regulation is now a go-to-market constraint
  body: De minimis suspension and customs-data tightening can expand demand for shipping software while simultaneously making the product harder to deliver. This is a market tailwind only for vendors that keep compliance logic current.
