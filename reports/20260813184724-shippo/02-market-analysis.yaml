- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Factor
  - Direction
  - Why it matters for Shippo
  rows:
  - - Ecommerce parcel-volume expansion
    - Positive
    - More shipments create more need for rate shopping and orchestration
  - - AI-enabled routing and predictions
    - Positive
    - Helps software buyers move beyond static rate tables
  - - Cloud adoption by SMEs
    - Positive
    - Lowers onboarding friction for merchant software
  - - Cross-border customs digitization
    - Positive and complex
    - Creates demand but raises execution requirements
  - - Legacy integration complexity
    - Negative
    - Larger accounts still weigh build-versus-buy costs
  - - Cybersecurity and privacy obligations
    - Negative
    - Procurement slows when operational and address data are sensitive
  - - Carrier API throttling / access limits
    - Negative
    - Platform reliability is partly hostage to carrier partners
  - - De minimis suspension and customs changes
    - Negative for simplicity, positive for workflow need
    - Raises the value of software that can absorb compliance change
  notes: Driver / constraint synthesis draws from Mordor, CBP, and Federal Register materials.
