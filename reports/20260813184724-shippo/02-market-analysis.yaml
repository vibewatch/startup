  - type: conflicting-data
    severity: material
    topic: tam-estimates
    missingEvidence: A management-quality TAM / SAM bridge that reconciles public software-market reports with Shippo's own merchant and platform volumes.
    whyItMatters: Public reports prove the category exists and is growing, but they do not on their own show how much of that spend Shippo can practically capture.
    diligencePath: Request management's internal segmentation by merchant size, API-vs-app mix, and regional expansion plans.
