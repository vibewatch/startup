- id: revenue-trajectory
  title: Public revenue path and traction proxies
  body: The best public revenue anchor is still GetLatka's estimate, not audited financials. That source pegs Shippo at roughly $51.2 million of 2024 revenue after about $42 million in 2023 and $38.2 million in 2022, versus about $28.1 million in 2021. If directionally right, that implies meaningful post-pandemic scaling rather than a flat business. The throughput metrics on Shippo's own about page—$12 billion-plus annual GMV and 200 million-plus shipments—are much larger than the revenue number, which is exactly what one would expect from a low take-rate workflow layer sitting on top of parcel spend. Public headcount estimates of roughly 285 to 298 people also suggest that Shippo has not scaled headcount wildly ahead of estimated revenue. The financial read-through is therefore about revenue quality, support burden, and the durability of monetization mechanics rather than about any single headline revenue or funding data point.
  claimRefs:
  - CI009
  - CI010
  - CI013
  - CI014
  - CI027
  - CI028
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: unit-economics-proxies
  title: Unit-economics proxies, comps, and capital adequacy
  body: 'Because Shippo does not publish audited margin data, the best available unit-economics read comes from proxies. The pricing tables show usage-based monetization; case studies show ROI versus internal build and customer-support savings; and parcel-industry data show the underlying market is still subject to rate inflation, surcharges, and complexity. That combination implies a business with credible software value-add but meaningful exposure to the carrier layer beneath it. Public comparables help frame the extremes: UPS illustrates the capital intensity and scale of the delivery layer, while Pitney Bowes is a closer economic adjacency because it sells technology-driven shipping and mailing solutions inside a regulated ecosystem. On capital adequacy, lifetime funding near $154 million and the absence of any rescue-style public financing narrative suggest Shippo has growth optionality, but not enough disclosure to underwrite burn or runway confidently. The financial read-through is
    therefore about revenue quality, support burden, and the durability of monetization mechanics rather than about any single headline revenue or funding data point.'
  claimRefs:
