chapter:
  number: 4
  title: Financials
  summary: 'Shippo''s public financial picture is directionally encouraging but still incomplete: official pricing pages show a multi-surface monetization model built on labels, subscriptions, API usage, and protection attachments, while third-party databases estimate revenue of about $51.2 million in 2024 on a headcount under 300. The company''s last public priced round was $1 billion in 2021, which implies a rich multiple against public revenue estimates and leaves the margin, burn, and retention story as the main unresolved underwriting problem.'
sections:
- id: revenue-model
  title: Revenue streams, pricing, and monetization logic
  body: Shippo's public pricing architecture makes the revenue model clearer than its private-company financial disclosure. The company monetizes label transactions, subscription access, and API usage for non-label services such as tracking, rating, and address validation. The API starter tier is free to adopt but becomes metered after the first 30 labels, while the web app layers a free merchant tier, a $17 Pro tier, overage charges at higher shipment bands, and insurance-related attachments. This is not pure SaaS and not pure pass-through logistics margin either. It is a usage-linked software model whose realized economics depend on shipment count, carrier mix, and attached services. The insurance page and partner materials also suggest optional protection revenue and claim-related economics sit alongside the core shipping workflow. The financial read-through is therefore about revenue quality, support burden, and the durability of monetization mechanics rather than about any single headline
    revenue or funding data point. The financial read-through is therefore about revenue quality, support burden, and the durability of monetization mechanics rather than about any single headline revenue or funding data point.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
