chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a cautious-but-positive valuation stance on Shippo. The company still looks strategically valuable and may deserve unicorn status under favorable private KPIs, but the best public anchors—$51.2M ARR in 2024 and a 2021 $1B round—leave the current public-evidence base case below the stale unicorn mark until fresh retention, margin, and concentration data are produced.
sections:
- id: anchors
  title: Hard public anchors for valuation
  body: Public valuation work on Shippo starts with two anchors and should not pretend to have more certainty than that. First, the last hard pricing event is the June 2021 Series E at a $1 billion valuation. Second, the best current public revenue estimate is $51.2 million ARR for 2024. Those two figures imply a roughly 19.5x revenue multiple, which is high enough to require a strong quality story. Dealroom and Failory still treat Shippo as a unicorn in 2026, but those labels confirm category status more than current fair value. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction matters because private-market pricing can
    stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk.
  claimRefs:
  - CV001
