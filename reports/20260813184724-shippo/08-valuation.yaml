  - TV001
  figureRefs:
  - FV001
- id: bull-vs-bear
  title: Bull and bear arguments from public evidence
  body: The bull case is real. Shippo operates in a growing multi-carrier shipping-software category, sits on top of a very large parcel market, and appears to do more than a simple merchant plugin. Platform account models, compliance labor, and embedded distribution can justify software-like valuation treatment. The bear case is also real. Competition is crowded, public comparisons already signal scale ceilings, and key inputs such as margins, retention, and trust disclosure are missing. That combination argues against naively carrying forward the 2021 private-market multiple. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction
