- id: comp-frame-range
  title: Comp frame and valuation range
  body: Public comps should be used directionally, not mechanically. UPS and Pitney Bowes filings help size the adjacent ecosystem and show the strategic importance of SMB shipping aggregation, but neither is a clean multiple comp for Shippo. The more useful exercise is range framing. On public evidence alone, an 8x to 16x ARR band looks more defensible than the approximately 19.5x implied by the last round. That still describes a valuable software asset, but it places today's base-case fair value below the stale 2021 unicorn mark unless internal metrics are exceptionally strong. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk. That distinction
    matters because private-market pricing can stay above public-evidence fair value only when growth, retention, and margin quality are strong enough to absorb category and execution risk.
