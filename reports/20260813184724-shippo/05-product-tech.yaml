- id: architecture-and-distribution
  title: Architecture, integration patterns, and developer tooling
  body: 'The most distinctive technical attribute in the public record is flexibility of integration path. Shippo supports a single-merchant account model, white-label managed accounts where Shippo is invisible to the merchant, and gray-label OAuth where merchants keep a direct relationship with Shippo. For platform operators, that means Shippo is not just one API—it is a multi-tenant control plane with sub-account management and merchant-level resource management. Developer tooling also looks solid by startup-software standards: Shippo publishes API docs, support tutorials, SDK examples, and a public Postman collection. Distribution through Shopify, WooCommerce, and BigCommerce strengthens the product story by turning the API into installable channel software rather than just a sales-led integration. For diligence, the important question is whether these capabilities remain dependable at scale and whether they create meaningful operational leverage for customers beyond simple postage discounts.
