  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: SOC 2 / ISO / penetration-testing disclosures, data-processing terms, and enterprise security questionnaire responses.
    whyItMatters: Large platforms and enterprise shippers will care about these controls more than SMBs, and public product pages are not enough to clear that diligence.
    diligencePath: Request the trust package, DPA, and latest security-compliance artifacts from Shippo.
