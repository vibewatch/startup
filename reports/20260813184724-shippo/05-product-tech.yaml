  evidenceGaps:
  - type: access-blocked
    severity: minor
    topic: policy-transparency
    missingEvidence: Full text extraction of Shippo's privacy and terms pages in the same run.
    whyItMatters: Policy content is relevant to trust and compliance review, but the JS-rendered privacy center limited direct inspection in fetch mode.
    diligencePath: Capture the privacy-center text via browser session or request a trust/security packet directly from the company.
    relatedQuestionRefs:
