- id: reliability-and-dependencies
  title: Reliability narrative, outage exposure, and external dependencies
  body: 'Shippo''s public reliability case is credible but not absolute. The company and partners publish strong claims around avoided carrier outages, compliance hours, incident response, and 99.95%-plus reliability during peak periods. Those claims line up with the economics of the product: buyers are outsourcing operational hassle as much as they are buying cheaper labels. At the same time, the status page itself makes clear that Shippo remains dependent on carrier APIs and maintenance schedules outside its control. That is not a contradiction so much as the nature of the product. Shippo''s value is in absorbing, normalizing, and responding to those failures faster than a merchant or platform could do alone. For diligence, the important question is whether these capabilities remain dependable at scale and whether they create meaningful operational leverage for customers beyond simple postage discounts. For diligence, the important question is whether these capabilities remain dependable
    at scale and whether they create meaningful operational leverage for customers beyond simple postage discounts.'
