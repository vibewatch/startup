chapter:
  number: 5
  title: Product & Technology
  summary: 'Shippo''s product record supports a real infrastructure thesis: official docs, platform pages, and developer tooling show a multi-carrier abstraction layer that handles labels, rating, tracking, validation, returns, and multi-tenant shipping workflows across both web-app and API surfaces. Public reliability and compliance claims are meaningful, but the product still inherits carrier-side outage risk and exposes a lighter public trust-policy surface than the strongest enterprise software vendors.'
sections:
- id: workflow-definition
  title: Product definition and module map
  body: 'Shippo is best understood as a shipping abstraction layer rather than a simple label printer. The company packages one core workflow across multiple surfaces: users connect stores or systems, compare rates, buy labels, validate addresses, track parcels, manage returns, and reconcile billing from one interface or API. The official module set is broad enough to matter—labels, rating, tracking, address validation, returns, and billing/reconciliation—yet still tightly focused on parcel-shipping operations. Public materials also show that the same core capabilities are exposed differently to SMB web-app buyers versus API and platform buyers, which helps explain why Shippo appears in both merchant-shipping and embedded-infrastructure shortlists. For diligence, the important question is whether these capabilities remain dependable at scale and whether they create meaningful operational leverage for customers beyond simple postage discounts. For diligence, the important question is whether
    these capabilities remain dependable at scale and whether they create meaningful operational leverage for customers beyond simple postage discounts.'
  claimRefs:
  - CE001
  - CE002
