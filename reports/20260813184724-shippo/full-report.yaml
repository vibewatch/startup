      - number: '2.2'
        title: TAM, SAM, and parcel-demand lenses
        blocks:
          - type: paragraph
            body: >-
              Public TAM work is directionally helpful but not precise enough to lean on one number. Mordor Intelligence
              places parcel-management and multi-carrier shipping software at $2.63 billion in 2025 and $2.93 billion in
              2026, growing to just under $5 billion by 2031. Verified Market Reports publishes a broader estimate,
              which is useful less for its exact number than for proving that public category boundaries vary
              materially. The parcel-flow lens is much larger: Pitney Bowes says U.S. parcel volume reached 23.1 billion
              shipments in 2025 and could reach 31 billion by 2031, with revenue per parcel also rising. The right
              interpretation is that Shippo sits on top of a very large shipment base but captures only a software
              take-rate on the decisions around those parcels. That suggests a practical SAM defined by SMB, mid-market,
              and platform-driven merchants needing multi-carrier orchestration, not every parcel moved in the economy.
              For diligence, the key question is whether this demand signal is durable across merchant cohorts, partner
              channels, and regulatory cycles, not merely a temporary parcel-volume or ecommerce-cycle effect.
