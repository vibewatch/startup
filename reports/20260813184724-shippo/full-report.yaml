            - CO005
            - CO006
        - id: carriers
          label: 40+ carriers, 500+ service levels, 1000+ tracking carriers
          detail: Carrier connectivity and normalization are the core infrastructure job.
          claimRefs:
            - CO005
            - CO006
        - id: protection
          label: Protection / claims partner layer
