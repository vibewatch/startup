        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Shippo is best understood as a shipping abstraction layer rather than a simple label printer. The company
              packages one core workflow across multiple surfaces: users connect stores or systems, compare rates, buy
              labels, validate addresses, track parcels, manage returns, and reconcile billing from one interface or
              API. The official module set is broad enough to matter—labels, rating, tracking, address validation,
              returns, and billing/reconciliation—yet still tightly focused on parcel-shipping operations. Public
              materials also show that the same core capabilities are exposed differently to SMB web-app buyers versus
              API and platform buyers, which helps explain why Shippo appears in both merchant-shipping and
              embedded-infrastructure shortlists. For diligence, the important question is whether these capabilities
