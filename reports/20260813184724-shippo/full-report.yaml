      - number: '2.4'
        title: Regulatory complexity, channel distribution, and market verdict
        blocks:
          - type: paragraph
            body: >-
              Cross-border regulation has become a central market constraint, not a footnote. CBP and Federal Register
              actions in 2025-2026 around the suspension of de minimis treatment make customs data, duty handling, and
              entry procedures more important for exactly the type of merchant and platform workflows Shippo wants to
              support internationally. At the same time, distribution increasingly rides through ecommerce platforms
              such as Shopify, WooCommerce, and channel-ops software like Linnworks, which means partner reach may
              matter more than pure direct sales count. That mix suggests Shippo's market is attractive but
              operationally demanding: the company benefits from secular growth in parcel shipping and software
              adoption, yet must keep pace with compliance, carrier fragmentation, and platform-controlled distribution.
              Public TAM references are good enough to support a large and growing category, but not good enough to
              replace management-level cohort and shipment economics in a true market model.
