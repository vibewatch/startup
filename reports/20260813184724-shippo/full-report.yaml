  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive-set taxonomy
        blocks:
          - type: paragraph
            body: >-
              Shippo competes in a crowded but still segmentable field. The direct set includes API-first shipping
              infrastructure such as EasyPost, dashboard-oriented shipping tools such as ShipStation, low-end
              substitutes such as Pirate Ship, and regional or use-case specialists such as Sendcloud. Internal build
              and platform-native shipping flows are also real substitutes even when they are not branded as standalone
              shipping software. The reason taxonomy matters is that the category is not won by one universal feature
              score. Public buyer guides consistently separate domestic high-volume needs, international
              duties-and-taxes needs, developer-first integration needs, and enterprise transport-management needs.
              Shippo shows up most strongly in the API-first and embedded-platform buckets, less so as the broadest
              carrier network or the deepest international engine. In investment terms, the practical issue is not who
              has the most features in a static checklist, but which vendor can keep pricing power and expansion room as
              merchant complexity rises. In investment terms, the practical issue is not who has the most features in a
              static checklist, but which vendor can keep pricing power and expansion room as merchant complexity rises.
