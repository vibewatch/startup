      - number: '8.4'
        title: Recommendation and final valuation verdict
        blocks:
          - type: paragraph
            body: >-
              The right valuation posture is cautious but not dismissive. Shippo looks materially better than a
              commodity shipping plugin and may still deserve a unicorn label in a favorable private market. But the
              public record does not yet prove that the full 2021 mark remains the correct underwriting anchor. The most
              responsible stance is neutral-to-positive: respect the strategic asset, require private KPI confirmation,
              and underwrite downside to a sub-$1 billion base case until retention, margin, and platform-expansion
              evidence are shown. That distinction matters because private-market pricing can stay above public-evidence
