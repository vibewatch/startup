figures:
  - id: FO001
    title: Shippo milestone timeline
    type: timeline
    layout: wide
    summary: Maps Shippo from founding through unicorn financing and later partner/infrastructure positioning.
    data:
      items:
        - date: '2013-01-01'
          label: Founding story begins
          detail: >-
            Official about page roots Shippo in Laura and Simon's attempt to run an online store and solve shipping
            complexity.
          tone: positive
        - date: '2017-10-31'
          label: Series B becomes public
          detail: TechCrunch reports Shippo's $20M Series B as the business shipping platform scales beyond 15,000 customers.
          tone: neutral
        - date: '2020-04-07'
          label: Series C
          detail: Tracxn logs a $30M Series C as ecommerce shipping demand accelerates.
          tone: positive
        - date: '2021-02-23'
          label: Series D at $495M
          detail: Pre-unicorn valuation step-up before the larger June round.
          tone: positive
        - date: '2021-06-02'
          label: Series E at $1B
          detail: Official Shippo announcement says the company raised $50M and reached unicorn status.
          tone: positive
        - date: '2025-06-12'
          label: Linnworks partnership
          detail: Partner announcement positions Shippo as global shipping infrastructure with 40+ carriers and 99.95% uptime.
          tone: positive
        - date: '2026-08-13'
          label: Unicorn status still visible
          detail: Dealroom and Failory still classify Shippo as a unicorn in 2026.
          tone: neutral
    approximationNotes: >-
      The official about page gives a founding year but not a precise founding day, so the founding marker uses a
      first-of-year placeholder.
    claimRefs:
      - CO002
      - CO016
      - CO017
      - CO021
      - CO023
      - CO026
      - CO032
  - id: FO002
    title: Operating model flow
    type: flow
    layout: standard
    summary: Shows how Shippo sits between merchants, platforms, and carriers as an abstraction layer.
    data:
      nodes:
        - id: buyers
          label: Merchants / platforms / logistics operators
          detail: Different buyer types use the same underlying shipping abstraction.
          claimRefs:
            - CO001
            - CO004
        - id: shippo
          label: Shippo API + dashboard
          detail: Unified layer for labels, rates, tracking, returns, and billing.
