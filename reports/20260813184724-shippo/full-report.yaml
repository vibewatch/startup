        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Shippo's core public identity is consistent even when some metadata is noisy: it is a San Francisco-based
              multi-carrier shipping platform that lets merchants, platforms, and logistics operators buy labels,
              compare carrier rates, track parcels, and manage returns from one integration layer. The official
              homepage, pricing pages, and product pages all frame Shippo as a one-stop shipping stack rather than a
              single-feature postage tool. The about page explains that the product is used by businesses, marketplaces,
              and logistics infrastructure providers through one API and dashboard, while the platforms page makes clear
              that Shippo is sold both as merchant software and as embedded infrastructure for SaaS and marketplace
              partners. That matters because it explains why Shippo markets several different scale counters: direct
              merchants, broader business relationships, and ecosystem reach all coexist. Dealroom's public card lists
              San Francisco as the company's base, which lines up with other third-party databases and with Shippo's own
              public address on partner listings.
