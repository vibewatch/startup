      - number: '2.3'
        title: Buyer segmentation, growth drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The category is expanding because ecommerce shipping is still operationally messy. Merchants need to
              compare carriers, delivery speeds, service levels, and customs requirements in workflows that increasingly
              span direct-to-consumer stores, marketplaces, and embedded platform channels. Shippo's own product and
              platform materials line up well with this demand: the company sells direct merchant software, but it also
              sells white-label and gray-label workflows to platforms that want shipping built into their product.
              Mordor's driver list—ecommerce parcel-volume growth, AI-enabled routing, cloud adoption by SMEs, and
              customs/documentation digitization—matches Shippo's public roadmap surprisingly well. The caveat is that
              the same report also surfaces real constraints: legacy-system integration, cybersecurity and privacy
              scrutiny, and carrier API restrictions can all slow adoption or elongate procurement. Those frictions help
              explain why build-versus-buy remains a real decision for larger accounts. For diligence, the key question
              is whether this demand signal is durable across merchant cohorts, partner channels, and regulatory cycles,
              not merely a temporary parcel-volume or ecommerce-cycle effect.
