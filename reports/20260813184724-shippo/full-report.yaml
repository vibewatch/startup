      - number: '3.3'
        title: Switching costs, substitutes, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The biggest strategic debate is whether Shippo is sticky infrastructure or a replaceable label printer.
              The answer is both, depending on customer type. Label generation is commoditizing, especially at the very
              small end where Pirate Ship or carrier-direct workflows are often good enough. But once shipping logic is
              integrated into OMS, WMS, storefront, billing, and notifications, switching becomes operationally annoying
              even if it is still technically possible. That is why the strongest moat candidate is not cheap postage
              alone; it is the carrier-abstraction, compliance, and multi-tenant account-management layer that buyers
              would otherwise need to rebuild themselves. Partner evidence around in-house integration cost supports
              this interpretation. In investment terms, the practical issue is not who has the most features in a static
              checklist, but which vendor can keep pricing power and expansion room as merchant complexity rises.
