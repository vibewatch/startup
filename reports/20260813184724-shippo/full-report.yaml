  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and practical addressable scope
        blocks:
          - type: paragraph
            body: >-
              Shippo should not be underwritten as a generic logistics company. The most defensible market boundary is
              the multi-carrier shipping-software and infrastructure layer that sits between merchants, platforms, and
              parcel carriers. That layer includes labels, rate shopping, tracking, returns, address validation, customs
              data, and carrier-account orchestration, but it excludes owned transportation assets, warehouse leases,
              and the entire parcel-delivery revenue pool. This distinction matters because the software market is many
              orders of magnitude smaller than the parcel market it intermediates, yet the parcel market still acts as
              the demand reservoir. Public product pages make clear that Shippo monetizes software and workflow
              abstraction, not freight margin in the way an asset-heavy logistics operator does. That means the right
              TAM framing starts with software-category estimates and is then checked against parcel-volume flows, buyer
              segments, and distribution channels rather than simply citing a giant logistics number. For diligence, the
              key question is whether this demand signal is durable across merchant cohorts, partner channels, and
              regulatory cycles, not merely a temporary parcel-volume or ecommerce-cycle effect.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM020
