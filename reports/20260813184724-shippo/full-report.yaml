  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Hard public anchors for valuation
        blocks:
          - type: paragraph
            body: >-
              Public valuation work on Shippo starts with two anchors and should not pretend to have more certainty than
              that. First, the last hard pricing event is the June 2021 Series E at a $1 billion valuation. Second, the
              best current public revenue estimate is $51.2 million ARR for 2024. Those two figures imply a roughly
              19.5x revenue multiple, which is high enough to require a strong quality story. Dealroom and Failory still
              treat Shippo as a unicorn in 2026, but those labels confirm category status more than current fair value.
              That distinction matters because private-market pricing can stay above public-evidence fair value only
              when growth, retention, and margin quality are strong enough to absorb category and execution risk. That
              distinction matters because private-market pricing can stay above public-evidence fair value only when
              growth, retention, and margin quality are strong enough to absorb category and execution risk. That
              distinction matters because private-market pricing can stay above public-evidence fair value only when
              growth, retention, and margin quality are strong enough to absorb category and execution risk.
