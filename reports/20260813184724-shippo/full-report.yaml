  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Shippo's public pricing architecture makes the revenue model clearer than its private-company financial
              disclosure. The company monetizes label transactions, subscription access, and API usage for non-label
              services such as tracking, rating, and address validation. The API starter tier is free to adopt but
              becomes metered after the first 30 labels, while the web app layers a free merchant tier, a $17 Pro tier,
