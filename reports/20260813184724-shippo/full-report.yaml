      - number: '7.4'
        title: Risk prioritization and verdict
        blocks:
          - type: paragraph
            body: >-
              The correct risk framing is cumulative, not binary. None of the public issues alone make Shippo
              uninvestable. The real danger is interaction: slower macro growth magnifies churn sensitivity; weaker
              pricing power magnifies support-cost problems; limited trust disclosure makes enterprise expansion harder;
              and partner dependence increases the cost of operational slips. The top diligence follow-ups should
              therefore focus on retention, concentration, margins, trust/compliance, and insurance economics. If those
              internal metrics are healthy, the public risk profile is manageable. If not, the downside to a unicorn-era
              valuation becomes much sharper. The diligence priority is to understand whether management can mitigate
              this risk operationally or whether the exposure is structural and therefore more likely to pressure
              retention, margins, or valuation. The diligence priority is to understand whether management can mitigate
              this risk operationally or whether the exposure is structural and therefore more likely to pressure
              retention, margins, or valuation.
