        title: Capability, pricing, and channel comparisons
        blocks:
          - type: paragraph
            body: >-
              The clearest public comparison points are carrier breadth, pricing structure, API access, and channel
              distribution. EasyPost markets 100-plus carriers and emphasizes infrastructure-grade features such as AI
              rate selection and billing-dispute tooling. ShipStation publishes tiered subscriptions and is strongest
              where operations teams want a familiar UI and lots of marketplace integrations. Shippo undercuts both at
              the low end with a free starter API plan, a $17 Pro tier, and API access on every plan. That combination
              helps explain why third-party comparisons repeatedly cast Shippo as the best entry point for startups and
              developers. At the same time, the public record also shows the risk: once order volume, user counts, or
              international requirements compound, other tools start to look more purpose-built. In investment terms,
              the practical issue is not who has the most features in a static checklist, but which vendor can keep
              pricing power and expansion room as merchant complexity rises. In investment terms, the practical issue is
