      - number: '8.4'
        title: 建议与最终估值判断
        blocks:
          - type: paragraph
            body: >-
              正确的估值姿态是谨慎，但不是否定。Shippo 明显强于大宗化发货插件，在有利的私募市场里可能仍配得上独角兽标签。但公开记录还没有证明，2021
              年的完整估值仍应作为正确的承销锚。最负责的立场是中性偏正面：尊重战略资产，要求用私有 KPI 确认，并在留存、利润率和平台扩张证据拿出来前，把下行承销到低于 $1 billion
