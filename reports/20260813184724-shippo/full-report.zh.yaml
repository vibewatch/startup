        blocks:
          - type: paragraph
            body: >-
              里程碑时间线为报告后续部分提供了清晰叙事。Shippo 起步于商家发货工作流问题，随后扩展成多承运商 API 和仪表盘，2017 年和 2020 年融资轮次逐步放大，并在 2021 年进入独角兽行列。2021
              年融资备忘录已描述其在 Germany、France、UK、Canada 和 Australia 的国际存在，并计划进一步进入 Western Europe 和美国区域承运商覆盖。到 2025
              年，Linnworks 等合作公告以及新的客户 / 合作伙伴页面，已将 Shippo
              定位为基础设施而不只是小企业应用，强调正常运行时间、合规工作和面向平台的多租户发货。这种转向有助于界定后续章节：竞争应同时对照仪表盘工具和嵌入式
              API，财务分析应覆盖多个业务界面，客户分析也应保留直接商家与生态触达之间的差异。主要但书是披露卫生：公开创始人数、成立年份卡片和客户计数并不完全一致，因此报告应优先保留每个来源对应的明确指标，而不是压缩成一个总口径数字。
