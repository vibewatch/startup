        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              即便部分元数据噪声较多，Shippo 的核心公开身份仍然一致：它是一家总部位于 San Francisco
              的多承运商发货平台，让商家、平台和物流运营方通过一个集成层购买面单、比较承运商费率、追踪包裹并管理退货。官方首页、定价页和产品页都把 Shippo 定位成一站式发货栈，而不是单一功能的邮资工具。About
              页面说明，企业、市场平台和物流基础设施提供商通过一个 API 和仪表盘使用产品；平台页面则明确显示，Shippo 既作为商家软件销售，也作为面向 SaaS
              和市场平台合作伙伴的嵌入式基础设施销售。这一点重要，因为它解释了 Shippo 为什么同时营销几套不同的规模计数：直接商家、更广义的商业关系和生态触达并存。Dealroom 的公开卡片将 San
              Francisco 列为公司所在地，这与其他第三方数据库以及 Shippo 在合作伙伴列表中的公开地址一致。
