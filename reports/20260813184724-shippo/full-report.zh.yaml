      - number: '2.4'
        title: 监管复杂度、渠道分发与市场结论
        blocks:
          - type: paragraph
            body: >-
              跨境监管已经从脚注变成核心市场约束。CBP 和 Federal Register 在 2025-2026 年围绕暂停 de minimis 待遇的动作，让海关数据、关税处理和入境流程，对 Shippo
              希望国际化支持的商家和平台工作流更加重要。与此同时，分发越来越依托 Shopify、WooCommerce 等电商平台，以及 Linnworks
              这类渠道运营软件，这意味着合作伙伴触达可能比纯直接销售数量更重要。这种组合说明 Shippo
              的市场有吸引力，但运营要求高：公司受益于包裹发货和软件采用的长期增长，却必须跟上合规、承运商碎片化和平台控制分发的节奏。公开 TAM
              参考足以支撑一个大且增长中的品类，但不足以取代真正市场模型里管理层级别的队列和发货经济性。
