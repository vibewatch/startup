figures:
  - id: FO001
    title: Shippo 里程碑时间线
    type: timeline
    layout: wide
    summary: 勾勒 Shippo 从创立、独角兽融资到后续合作伙伴 / 基础设施定位的路径。
    data:
      items:
        - date: '2013-01-01'
          label: 创立故事起点
          detail: Shippo 官方关于页面把源头追溯到 Laura 和 Simon 经营线上商店、解决发货复杂度的尝试。
          tone: positive
        - date: '2017-10-31'
          label: Series B 轮公开
          detail: TechCrunch 报道 Shippo 的 $20M Series B 轮；当时这家企业发货平台已扩展到超过 15,000 个客户。
          tone: neutral
        - date: '2020-04-07'
          label: Series C 轮
          detail: Tracxn 记录 $30M Series C 轮，彼时电商发货需求加速。
          tone: positive
        - date: '2021-02-23'
          label: Series D 轮，估值 $495M
          detail: 更大的 6 月融资前，估值先上了一个台阶，但仍未到独角兽。
          tone: positive
        - date: '2021-06-02'
          label: Series E 轮，估值 $1B
          detail: Shippo 官方公告称公司融资 $50M，并达到独角兽状态。
          tone: positive
        - date: '2025-06-12'
          label: Linnworks 合作
          detail: 合作公告把 Shippo 定位为全球发货基础设施，连接 40+ 家承运商，在线率达 99.95%。
          tone: positive
        - date: '2026-08-13'
          label: 独角兽状态仍可见
          detail: Dealroom 和 Failory 在 2026 年仍将 Shippo 归为独角兽。
          tone: neutral
    approximationNotes: 官方关于页面给出创立年份，但没有精确到创立日，所以创立节点用当年第一天占位。
