            body: >-
              对一家私营物流软件公司来说，Shippo 的公开融资叙事异常连贯。官方和独立来源都认同，2021 年 6 月那轮新增 $50 million，并把公司推至 $1 billion
              估值；二级数据库也一致将累计融资放在约 $154 million、共八轮。Tracxn 和 Stock Analysis 可见的轮次历史还显示，Shippo 从 2021 年 2 月 Series D 的
              $495 million 估值，在几个月后快速跃升至独角兽。Dealroom 和 Failory 到 2026 年仍将 Shippo 归类为独角兽，这一点重要，因为用户要求确认 2024
              年之后的状态。规模信号强但杂乱：GetLatka 指向 2024 年收入约 $51.2 million、员工约 285 人；Dealroom 映射 298 名员工；About 页面营销 $12
