      - number: '8.3'
        title: 可比框架与估值区间
        blocks:
          - type: paragraph
            body: >-
              公开可比公司只能定方向，不能机械套倍数。UPS 和 Pitney Bowes 的监管文件能帮助框定相邻生态，也显示 SMB 发货聚合的战略重要性，但两家公司都不是 Shippo
              的干净倍数可比对象。更有用的是区间框架。仅看公开证据，8x 至 16x ARR 区间比上一轮隐含的大约 19.5x 更站得住。这仍然说明 Shippo
