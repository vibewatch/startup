  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与实际可服务范围
        blocks:
          - type: paragraph
            body: >-
              不应按一家泛物流公司来判断
              Shippo。最可辩护的市场边界，是位于商家、平台和包裹承运商之间的多承运商发货软件与基础设施层。这一层覆盖面单、费率比价、追踪、退货、地址验证、海关数据和承运商账户编排，但不包括自有运输资产、仓库租赁，也不包括整个包裹配送收入池。这一区分很重要，因为软件市场比它所中介的包裹市场小多个数量级，但包裹市场仍然是需求蓄水池。公开产品页显示，Shippo
              变现的是软件和工作流抽象，不像重资产物流运营商那样靠货运毛利。正确的 TAM
              框架应先从软件品类估计出发，再用包裹量流、买方分层和分发渠道校验，而不是简单引用一个巨大的物流数字。尽调关键问题是，这一需求信号能否穿越商家队列、合作伙伴渠道和监管周期，而不只是包裹量或电商周期带来的短期效应。
