            body: >-
              Shippo 的公开估值只能从两个锚点起步，不能假装公开证据比这更确定。第一，最近一次硬定价是 2021 年 6 月 Series E 轮，估值 $1 billion。第二，目前最有支撑的公开收入估计是 2024
              年的年经常性收入（ARR）为 $51.2 million。这两组数字推出来的收入倍数大约 19.5x，已经高到必须用很强的质量逻辑来支撑。Dealroom 和 Failory 到 2026 年仍把 Shippo
              列为独角兽，但这些标签更多确认的是品类地位，不是当前公允价值。这个差别很关键：只有增长、留存和利润率质量强到足以吸收品类与执行风险，私募市场定价才可能高于公开证据支撑的公允价值。这个差别很关键：只有增长、留存和利润率质量强到足以吸收品类与执行风险，私募市场定价才可能高于公开证据支撑的公允价值。这个差别很关键：只有增长、留存和利润率质量强到足以吸收品类与执行风险，私募市场定价才可能高于公开证据支撑的公允价值。
