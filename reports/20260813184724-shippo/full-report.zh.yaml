    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合分类
        blocks:
          - type: paragraph
            body: >-
              Shippo 所在赛道拥挤，但仍可分层。直接竞争集包括 EasyPost 这类 API 优先型发货基础设施、ShipStation 这类偏仪表盘的发货工具、Pirate Ship 这类低端替代品，以及
              Sendcloud
              这类区域或用例专家。内部自建和平台原生发货流程也是实质替代品，即便它们没有以独立发货软件品牌出现。分类之所以重要，是因为这个品类不是靠一张通用功能评分表取胜。公开买方指南持续区分国内高货量需求、国际关税和税费需求、开发者优先集成需求，以及企业运输管理需求。Shippo
              在 API
              优先和嵌入式平台桶里最强，在最广承运商网络或最深国际化引擎上没那么强。从投资角度看，实际问题不是谁在静态功能清单上项目最多，而是谁能在商家复杂度上升时守住定价权和扩张空间。从投资角度看，实际问题不是谁在静态功能清单上项目最多，而是谁能在商家复杂度上升时守住定价权和扩张空间。
