              创造产品机会，也抬高了执行门槛。与此同时，公开法律和隐私可见度仍比理想状态更薄。公司有政策页面，但抓取输出未能产出干净的逐行政策审查，公开来源包也没有浮现企业级安全披露。对投资者而言，信任和合规应被视为未解决的尽调事项，而不是默认强项。尽调优先事项是弄清楚管理层能否通过运营缓释这项风险，还是这种暴露具有结构性，因此更可能压迫留存、毛利率或估值。尽调优先事项是弄清楚管理层能否通过运营缓释这项风险，还是这种暴露具有结构性，因此更可能压迫留存、毛利率或估值。
