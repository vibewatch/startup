              最可见的公开风险在运营和客户侧。Shippo
              的状态记录和独立状态跟踪清楚显示，承运商依赖是产品的永久组成部分。单看这一点仍可管理——事实上，处理这些依赖正是客户付费的一部分——但当事故与支持延迟、账单混乱或理赔争议叠加时，业务会变得更脆弱。评测和投诉平台展示的正是这种模式。对长尾
              SMB
              客户基数而言，这些摩擦重要，因为许多小客户可以在几乎没有采购惯性的情况下离开。尽调优先事项是弄清楚管理层能否通过运营缓释这项风险，还是这种暴露具有结构性，因此更可能压迫留存、毛利率或估值。尽调优先事项是弄清楚管理层能否通过运营缓释这项风险，还是这种暴露具有结构性，因此更可能压迫留存、毛利率或估值。尽调优先事项是弄清楚管理层能否通过运营缓释这项风险，还是这种暴露具有结构性，因此更可能压迫留存、毛利率或估值。
