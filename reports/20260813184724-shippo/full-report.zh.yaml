      - number: '2.3'
        title: 买方分层、增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              这个品类在扩张，因为电商发货仍然难做。商家需要在工作流里比较承运商、配送速度、服务等级和海关要求，而这些工作流越来越横跨 DTC 店铺、市场平台和嵌入式平台渠道。Shippo
              自身产品和平台材料与这种需求高度匹配：公司销售直接商家软件，也把白标和灰标流程卖给希望把发货嵌进产品的平台。Mordor 列出的驱动因素——电商包裹量增长、AI 驱动的路线选择、SME 采用云，以及海关 /
              文件数字化——与 Shippo 的公开路线图意外契合。但同一报告也给出了真实约束：遗留系统集成、网络安全与隐私审查，以及承运商 API
              限制，都可能拖慢采用或拉长采购周期。这些摩擦也解释了为什么大客户仍会认真权衡自建还是采购。尽调关键问题是，这一需求信号能否穿越商家队列、合作伙伴渠道和监管周期，而不只是包裹量或电商周期带来的短期效应。
