companyProfile:
  summary: >-
    Shippo 是一家总部位于 San Francisco、成立于 2013 年的私营发货软件公司，面向电商品牌、市场平台和软件平台销售多承运商发货 API 与商家 Web 应用。公开材料显示，它具备真实的基础设施属性——连接 40+
    家承运商，支持平台 / 白标账户模型，拥有广泛电商平台分发，并服务约 100,000 个直接商家及更大的合作伙伴触达；但公开资料没有披露足够的留存、毛利率或集中度数据，无法在 2026 年市场环境下完整验证 2021 年 $1B
    独角兽估值。
