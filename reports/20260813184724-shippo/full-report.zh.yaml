      - number: '2.2'
        title: TAM、SAM 与包裹需求视角
        blocks:
          - type: paragraph
            body: >-
              公开 TAM 研究方向上有帮助，但还不精确到可以押注一个数字。Mordor Intelligence 将包裹管理和多承运商发货软件市场放在 2025 年 $2.63 billion、2026 年 $2.93
              billion，并预计到 2031 年接近 $5 billion。Verified Market Reports
              发布了更宽的估计，它的价值不在精确数字，而在证明公开品类边界差异很大。包裹流视角要大得多：Pitney Bowes 称美国包裹量 2025 年达到 23.1 billion 件，到 2031 年可能达到 31
              billion 件，单件包裹收入也在上升。正确解读是，Shippo 位于一个非常大的发货基座之上，但只在围绕这些包裹的决策中抽取软件费率。这意味着实际 SAM 应定义为需要多承运商编排的
              SMB、中端市场和平台驱动商家，而不是经济中移动的每一个包裹。尽调关键问题是，这一需求信号能否穿越商家队列、合作伙伴渠道和监管周期，而不只是包裹量或电商周期带来的短期效应。
