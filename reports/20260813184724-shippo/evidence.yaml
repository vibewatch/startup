evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      Authoritative corporate-history disclosure that reconciles 2013 official founding with Dealroom's 2017 public
      card.
    whyItMatters: >-
      Founding-year ambiguity is small economically but it affects milestone chronology and later comparison against
      peers.
    diligencePath: Request a management timeline or legal-incorporation summary and reconcile it against the public company card.
    relatedQuestionRefs:
      - QO004
      - QO023
    relatedTableRefs:
      - TO004
      - TO005
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      Current management disclosure that separates direct paying merchants from ecosystem businesses, monthly users, and
      partner-reached businesses.
    whyItMatters: >-
      Customer-count inflation or metric mixing can distort growth, retention, and valuation arguments if later chapters
      use the wrong denominator.
    diligencePath: >-
      Request a current KPI deck with definitions for direct active merchants, monthly API businesses, and
      partner-network reach.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO023
  - type: conflicting-data
    severity: material
    topic: tam-estimates
    missingEvidence: >-
      A management-quality TAM / SAM bridge that reconciles public software-market reports with Shippo's own merchant
      and platform volumes.
    whyItMatters: >-
      Public reports prove the category exists and is growing, but they do not on their own show how much of that spend
      Shippo can practically capture.
    diligencePath: Request management's internal segmentation by merchant size, API-vs-app mix, and regional expansion plans.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: sam-definition
    missingEvidence: Current split of revenue and active accounts across SMB app, API brands, and embedded platform channels.
    whyItMatters: >-
      Without channel mix, analysts can only approximate Shippo's true SAM and competitive position within each buyer
      segment.
    diligencePath: Request cohort and channel disclosures with active-account, shipment, and revenue mix by buyer motion.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
      - QM017
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Actual competitive win-loss data by segment, especially against EasyPost and ShipStation.
    whyItMatters: >-
      Public positioning shows who competes with Shippo, but only management data can reveal whether Shippo is gaining
      or losing share in its target segments.
    diligencePath: Request recent win-loss analysis by channel, customer size, and use case.
    relatedQuestionRefs:
      - QP002
      - QP003
      - QP017
      - QP025
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Churn, migration, and cohort-retention data for customers who outgrow starter plans.
    whyItMatters: >-
      The public debate about Shippo's scale ceiling cannot be resolved without evidence on whether customers actually
      leave as they grow.
    diligencePath: >-
      Request cohort analysis by shipment band and product surface, including migrations to Premier or platform
      products.
    relatedQuestionRefs:
      - QP018
      - QP021
      - QP024
  - type: private-evidence-only
    severity: material
    topic: margin-path
    missingEvidence: Audited gross margin, contribution margin, and insurance-claims loss ratio by product surface.
    whyItMatters: >-
      These metrics determine whether Shippo deserves infrastructure-software multiples or thinner shipping-service
      multiples.
    diligencePath: Request detailed P&L by labels, subscriptions, API fees, and protection revenue with margin bridge.
    relatedQuestionRefs:
      - QI006
      - QI013
      - QI020
      - QI023
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, free cash flow, and next financing trigger.
    whyItMatters: >-
      Lifetime funding alone cannot show whether Shippo is comfortably self-funding growth or still dependent on another
      private round.
    diligencePath: Request current cash, burn, and 24-month financing plan.
    relatedQuestionRefs:
      - QI015
      - QI016
      - QI023
  - type: access-blocked
    severity: minor
    topic: policy-transparency
    missingEvidence: Full text extraction of Shippo's privacy and terms pages in the same run.
    whyItMatters: >-
      Policy content is relevant to trust and compliance review, but the JS-rendered privacy center limited direct
      inspection in fetch mode.
    diligencePath: Capture the privacy-center text via browser session or request a trust/security packet directly from the company.
    relatedQuestionRefs:
      - QE018
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      SOC 2 / ISO / penetration-testing disclosures, data-processing terms, and enterprise security questionnaire
      responses.
    whyItMatters: >-
      Large platforms and enterprise shippers will care about these controls more than SMBs, and public product pages
      are not enough to clear that diligence.
    diligencePath: Request the trust package, DPA, and latest security-compliance artifacts from Shippo.
    relatedQuestionRefs:
      - QE016
      - QE017
      - QE018
      - QE023
  - type: private-evidence-only
    severity: material
    topic: cohorts-and-retention
    missingEvidence: Net revenue retention, gross retention, cohort churn, and customer concentration by top accounts or platforms.
    whyItMatters: These metrics determine whether customer breadth translates into durable high-quality revenue.
    diligencePath: >-
      Request cohort retention tables, NRR/GRR, and the share of volume or revenue sourced from the top ten customers
      and top commerce platforms.
