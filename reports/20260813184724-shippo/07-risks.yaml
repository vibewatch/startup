- calloutType: risk
  title: Shippo's risks are cumulative rather than singular
  body: The business is most vulnerable when support, pricing friction, and macro moderation hit simultaneously. None is fatal alone; together they can make a shipping-infrastructure company look much more commodity-like.
  claimRefs:
  - CR019
  - CR024
  - CR030
  - CR031
