chapter:
  number: 7
  title: Risks
  summary: Shippo's public risk profile is moderate-to-high but still manageable if internal retention, support, and trust metrics are strong. The structural risks are carrier dependence, pricing-pressure/commoditization, platform dependence, and rising cross-border compliance complexity; the most important unresolved diligence items are retention, security/compliance posture, and protection-program economics.
sections:
- id: operational-and-customer
  title: Operational, support, and customer-friction risks
  body: The most visible public risks are operational and customer-facing. Shippo's status record and independent status tracking make clear that carrier dependencies are a permanent part of the product. That alone is manageable—indeed, handling those dependencies is part of what customers pay for—but the business becomes more fragile when incidents combine with support delays, billing confusion, or claims disputes. Review and complaint platforms show exactly that pattern. For a long-tail SMB customer base, those frictions matter because many small customers can leave without much procurement inertia. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins,
    or valuation. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation.
