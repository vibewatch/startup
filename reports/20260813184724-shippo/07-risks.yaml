  title: Structural business-model risks
  columns:
  - Risk
  - Mechanism
  - Likely impact
  rows:
  - - Commoditization at low end
    - Free/cheap shipping tools compress willingness to pay
    - Lower pricing power and higher churn
  - - Outgrowing the product at high end
    - Larger accounts need deeper automation or international depth
    - Growth ceiling / expansion friction
  - - Moderating parcel growth
    - Macro tailwind less explosive than pandemic era
    - Less room to outrun execution issues
  - - Mixed customer motion complexity
    - SMB self-serve and platform infrastructure need different execution
    - Operating complexity and support cost
  - - Partner / platform dependency
    - Acquisition and volume tied to ecosystems
    - Policy or demand shocks propagate faster
  notes: These are structural and should be assumed persistent until disproven by internal metrics.
