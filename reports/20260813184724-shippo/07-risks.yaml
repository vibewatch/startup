- id: strategic-macro
  title: Strategic, macro, and pricing-power risks
  body: 'A second risk cluster is more structural. Parcel demand is still growing, but at a moderate pace relative to the pandemic period, which reduces the chance that simple market expansion hides execution issues. Meanwhile, the competitive landscape puts pressure on pricing power: low-end substitutes can satisfy basic shipping needs, while higher-end peers can claim deeper automation or international features. Public comparisons already frame Shippo as strong for startups and developers but more limited at greater complexity. That positioning is workable, but only if Shippo avoids being stranded in the middle between commodity shipping tools and more capable infrastructure providers. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation. The diligence priority is to understand whether management can mitigate this risk operationally or
    whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation.'
