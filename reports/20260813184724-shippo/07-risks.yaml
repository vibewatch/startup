- id: regulatory-legal
  title: Regulatory, legal, and trust-surface risks
  body: Cross-border shipping regulation is becoming more material to any shipping-software company. U.S. de minimis changes and related CBP implementation guidance raise the complexity of low-value ecommerce shipments, which creates product opportunity for Shippo but also raises execution stakes. At the same time, public legal and privacy visibility remains thinner than ideal. The company has policy pages, but the fetched output did not yield a clean line-by-line policy review, and the public source pack did not surface enterprise-grade security disclosures. For investors, that means trust and compliance should be treated as unresolved diligence items rather than assumed strengths. The diligence priority is to understand whether management can mitigate this risk operationally or whether the exposure is structural and therefore more likely to pressure retention, margins, or valuation. The diligence priority is to understand whether management can mitigate this risk operationally or whether
    the exposure is structural and therefore more likely to pressure retention, margins, or valuation.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR020
  - CR021
