company:
  name: Substack
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Substack operates a fully managed creator publishing platform offering six content
    formats (newsletters, Notes, Chat, podcasts, live video/audio, and video-on-demand) under
    a single dashboard. The platform provides native iOS (4.9/5, 454K+ reviews) and Android
    (4.8/5, ~248K reviews) apps, browser-based Recording Studio (launched March 2026), and a
    connected-TV app for Apple TV and Google TV (January 2026). Core infrastructure is fully
    managed by Substack: email delivery, CDN hosting, Stripe payment rails, Apple IAP, and
    media storage. No public API or official developer SDK exists; the developer ecosystem
    consists of 126+ third-party GitHub community libraries. The February 2026 data breach
    (700K accounts, 4-month dwell time) is a material security concern; the privacy policy was
    updated May 14, 2026 to add CSAM reporting obligations. Mandatory Apple IAP (effective
    September 2025) adds ~30% pricing overhead on iOS and eliminates creator data portability
    for iOS subscribers. Key product risks are no API, Apple IAP lock-in, and post-breach
    security posture questions; key strengths are the Recommendations network driving 30%+
    of paid conversions and the rapidly maturing multi-format product suite.

sections:
  - id: product-definition-and-modules
    title: Product definition and module inventory
    body: >
      Substack is a subscription media platform that enables independent writers, journalists,
      podcasters, and video creators to publish directly to subscribers and monetize through
      paid subscriptions. The platform's core product is an integrated publishing suite combining
      six content formats under a single publication dashboard: email newsletters (the original
      and dominant format), Notes (a social-feed layer for short-form content), Chat (threaded
      messaging for paid subscriber communities), podcast and audio hosting, live video and audio
      broadcasts, and video-on-demand posts. Each format is accessible to both free and paid
      subscribers, with creators controlling paywall placement at the post or section level. The
      platform operates as a fully managed hosted service—creators receive a [slug].substack.com
      URL with an optional custom domain overlay for a one-time $50 fee, and email is delivered
      from the @substack.com sender domain. Mobile reach is served by native iOS and Android apps,
      both rated above 4.8/5 across more than 700,000 combined app store reviews as of May 2026.
      The product is designed for low-friction onboarding with no code required to launch;
      Substack charges no monthly platform fee and takes a 10% cut of subscription revenue only
      when a creator generates paid revenue. Substack reports over 5 million paid subscriptions
      platform-wide as of early 2026, and its Recommendations network claims to drive more than
      30% of all paid subscriber conversions.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE013
      - CE016
      - CE018
      - CE033
      - CE034
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: technical-architecture-and-operating-model
    title: Technical architecture and operating model
    body: >
      Substack's operating model is built on a fully managed hosting architecture: creators never
      provision infrastructure. The platform handles email delivery, media storage, CDN-backed
      web pages, payment processing, and mobile app distribution as bundled services. Email
      delivery uses Substack's own sending infrastructure; the sender domain remains
      @substack.com regardless of custom domain configuration. Payment infrastructure relies on
      Stripe for web subscriptions and Apple's in-app purchase system for iOS subscriptions—the
      latter became mandatory in September 2025. The iOS app (v2.97.0, iOS 17+) and Android
      app (v2.99.2, updated May 21, 2026) are native applications. The platform has no public
      REST API or official developer SDK; the 126+ GitHub repositories tagged "substack" are
      community-built tools, with python-substack (151+ stars, ma2za) being the most active
      unofficial library. Uptime is tracked through a public Statuspage.io endpoint—no SLA or
      guaranteed uptime percentage is published, and no incidents were recorded May 13–24, 2026.
      Media hosting for podcasts, live streams, and VOD is included in the platform fee.
      The Recording Studio, launched March 12, 2026, enables browser-based audio and video
      capture for solo creators and up to two remote guests with automatic short-clip generation
      and AI-assisted thumbnail creation; TechCrunch reported that video/audio creators grew
      revenue 50% faster in a 90-day window than text-only peers.
    claimRefs:
      - CE008
      - CE017
      - CE021
      - CE023
      - CE029
      - CE035
    tableRefs:
      - TE002
      - TE003
    figureRefs:
      - FE002
      - FE003

  - id: trust-safety-security-and-privacy
    title: Trust, safety, security, and privacy
    body: >
      Substack's content policy is formalized in publicly accessible guidelines
      (substack.com/content), updated March 19, 2026 to include addenda for the UK Online
      Safety Act and Australia's Online Safety Act. Prohibited content includes harassment,
      doxxing, incitement to violence, CSAM, and spam. Privacy governance is maintained in
      a separate policy (substack.com/privacy, updated May 14, 2026), which added an explicit
      commitment to share CSAM detection data with NCMEC and established a 30-day response
      timeline for GDPR and CCPA data subject requests. Subscriber email addresses and names
      are shared with publication owners, but phone numbers and payment details are withheld.
      The most significant security event in the chapter's evidence window is the February 2026
      data breach: Substack disclosed on February 3–5, 2026 that approximately 700,000 user
      accounts were compromised, with email addresses and phone numbers exposed but not
      passwords or payment information. Cybersecurity analysts reported the intrusion went
      undetected for approximately four months (placing the breach origin around October 2025),
      indicating a substantial detection gap. CEO Chris Best issued a public apology and
      Substack characterized the incident as resolved; Infosecurity Magazine and Forbes
      independently confirmed the breach. This was reportedly the second Substack security
      incident following a 2020 mass-BCC email exposure. The Substack Defender program provides
      legal support and platform advocacy to creators facing external threats. Creator support
      uses a tiered model: chatbot triage plus dedicated human responses for paid creators.
      Third-party reviewers and creator forums document complaints about Apple IAP pricing
      markup and limited data portability as persistent product grievances.
    claimRefs:
