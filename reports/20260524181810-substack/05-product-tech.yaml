  - id: roadmap-differentiation-and-product-risks
    title: Roadmap, differentiation, and product risks
    body: >
      Substack's 2026 product roadmap is centered on video-first expansion and cross-platform
      creator acquisition. The Recording Studio (March 12, 2026) enables in-browser podcast
      and video recording with AI-powered clip generation. The Substack TV app (January 2026,
      Apple TV + Google TV) extends content consumption to connected-TV screens with a
      TikTok-style "For You" feed. AI-powered video clip generation auto-creates highlights
      from livestreams with automated YouTube Shorts upload. A $20 million Creator Accelerator
      Fund supports cross-platform migrations. Substack's differentiators relative to Beehiiv,
      Ghost, and ConvertKit include: a built-in discovery network driving 30%+ of paid
      conversion, an integrated social layer (Notes), browser-based video production, and CTV
      reach. Analytics were updated in September 2025 to unify email and in-app engagement
      metrics. The Boost advertising product provides an additional paid distribution channel.
      Key product risks include: (1) no public API limits developer ecosystem depth and
      integration opportunities; (2) mandatory Apple IAP adds approximately 30% pricing
      overhead on iOS with no subscriber data portability; (3) the February 2026 breach and
      four-month detection gap raise unresolved questions about monitoring maturity; and (4)
      customization constraints—email still sent from @substack.com, no custom templates—remain
      documented creator pain points. Substack's iOS App Store rating (4.9/5) and its
      Recommendations network represent the strongest observable quality and distribution
      moats; however, the platform architecture concentrates critical dependencies on Stripe,
      Apple, and Substack itself as the sole managed hosting provider.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE019
      - CE022
