  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-architecture
      missingEvidence: >
        Substack has not disclosed its email delivery vendor, CDN provider, database
        architecture, or cloud infrastructure partners. No formal SLA or contractual uptime
        guarantee is published.
      whyItMatters: >
        Without visibility into infrastructure dependencies, it is not possible to assess
        vendor concentration risk, single-point-of-failure exposure, or resilience commitments
        beyond the voluntary Statuspage incident feed.
      diligencePath: >
        Request a technical due diligence briefing from Substack engineering leadership;
        inspect email headers on received newsletters to identify the MTA provider; review
        any cloud vendor disclosures in Terms of Service or Data Processing Agreements.

    - type: private-evidence-only
      severity: material
      topic: data-breach-security-posture
      missingEvidence: >
        Substack has not disclosed post-breach security audit results, new intrusion
        detection capabilities, patching timelines, or confirmed technical remediation
        steps beyond the CEO's public apology.
      whyItMatters: >
        The four-month breach dwell time suggests monitoring or alerting gaps. Without
        confirmed remediation, the same failure mode (unauthorized persistence, delayed
        detection) could recur, exposing another incident.
      diligencePath: >
        Request a security audit summary and written confirmation of new monitoring controls
        from Substack's security team; ask for the incident post-mortem and root-cause
        analysis as part of diligence.

    - type: missing-source
      severity: minor
      topic: competitive-app-store-ratings
      missingEvidence: >
        No direct comparison of Substack iOS or Android app store ratings versus Beehiiv,
        Ghost, or ConvertKit was available in the fetched evidence set.
      whyItMatters: >
        App store quality rankings are a weak but observable signal of product maturity
        relative to category peers; an absolute rating of 4.9/5 is more meaningful in
        competitive context.
      diligencePath: >
        Fetch Beehiiv and Ghost App Store pages and compare their ratings and review
        volumes directly against Substack's App Store listing.
      relatedQuestionRefs:
        - QE024

    - type: missing-source
      severity: minor
      topic: email-delivery-infrastructure
      missingEvidence: >
        No public source confirms whether Substack uses a major transactional email vendor
        (e.g., Mailgun, SendGrid, SparkPost, Amazon SES) or operates its own SMTP
        infrastructure at scale.
      whyItMatters: >
        Email delivery vendor choice affects deliverability reliability, send volume
        limits, and transition complexity if Substack changes providers or experiences
        an infrastructure incident.
      diligencePath: >
        Inspect email headers (Received-SPF, DKIM, Message-ID) on multiple received
        Substack newsletters and cross-reference with major transactional email vendor
        IP ranges and DKIM signing domains.
