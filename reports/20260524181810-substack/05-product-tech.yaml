callouts:
  - title: "Strong mobile ratings and discovery network create durable creator advantage"
    body: >
      Substack's iOS app (4.9/5, 454K reviews) and Android app (4.8/5, ~248K reviews) rank
      among the highest-rated apps in their category, reflecting strong product-market fit in
      mobile content consumption. Combined with the Recommendations network driving more than
      30% of paid subscriber conversions platform-wide, these two signals suggest a self-reinforcing
      flywheel: high app quality increases engagement and retention, while network-driven
      discovery reduces creator customer-acquisition cost. The platform's claimed 5M+ paid
      subscriptions further corroborates the monetization flywheel.
    calloutType: strength
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE033

  - title: "Apple IAP economics and February 2026 data breach are material platform risks"
    body: >
      Mandatory Apple IAP (effective September 2025) adds approximately 30% to iOS subscription
      prices and prevents creator access to iOS subscriber payment data—a structural constraint
      that has driven documented creator departures and limits creator data ownership. The
      February 2026 data breach (700K accounts, ~4-month dwell time before detection) raises
      questions about the platform's intrusion-detection maturity; post-breach security posture
      is not publicly disclosed. Both risks are architectural: the Apple IAP dependency is
      imposed by Apple policy, and the security monitoring gap is a Substack engineering concern.
      Platform concentration across Stripe, Apple, and Substack-managed hosting compounds the
      overall dependency risk profile.
    calloutType: risk
    claimRefs:
      - CE009
      - CE010
      - CE014
      - CE040

