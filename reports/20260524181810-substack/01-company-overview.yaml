  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Substack is a San Francisco-based creator platform founded in 2017 by Chris Best, Hamish McKenzie, and Jairaj Sethi that lets writers, podcasters, and video creators monetize direct audience relationships through subscriptions. Public evidence supports a July 2025 $100 million Series C at a $1.1 billion valuation, a 10% take-rate model, 5 million paid subscriptions on-platform by 2025, and continuing product expansion into Notes, live video, and app-based discovery, while detailed board composition, exact headcount, and audited financial disclosure remain limited."
  },
  "sections": [
    {
      "id": "identity-product-and-scale",
      "title": "Identity, product model, and scale signals",
      "body": "Substack’s official materials describe the company as more than a newsletter tool: it is positioned as a media platform and economic infrastructure layer for independent writers, podcasters, video creators, and other knowledge workers. The clearest current articulation is that creators can write, send, record, livestream, chat, sell subscriptions, and manage analytics inside one product, with the platform making money only when creators do. Official pages repeatedly state that creators keep 90% of subscription revenue minus payment-processing fees while Substack takes a 10% cut, which makes the business model easy to explain and directly aligned with creator earnings. Scale signals are meaningful even if not fully audited. On its own pages, Substack says it has 5 million paid subscriptions and counting, that tens of millions of people read, watch, and listen on the platform every week, that more than half of new subscribers come from the built-in network, that 1 million-plus posts are discovered in the app every day, and that 30% or more of paid subscriptions come from within the network. Those claims matter because they frame Substack as a discovery system, not just a transactional checkout layer. Product scope has also widened in a way that supports that framing: official and third-party materials show Notes, chat, podcasts, live video, and the mobile app all working as ways to deepen engagement and reduce a creator’s need to stitch together multiple external tools.",
