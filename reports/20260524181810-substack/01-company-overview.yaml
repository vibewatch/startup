    {
      "id": "milestones-expansion-and-adverse-notes",
      "title": "Milestones, product expansion, and adverse notes",
      "body": "Substack’s milestone pattern since launch shows a company that has steadily moved from paid email infrastructure toward a broader creator network. Notes expanded discovery in 2023 by creating a short-form social layer on top of newsletters. By 2024 and 2025 the company was adding live video, deepening mobile-app distribution, and enabling direct iOS in-app subscriptions, all of which reinforce the idea that Substack increasingly behaves like a full-stack creator platform rather than a simple publishing backend. Some of the new features are explicitly designed to create more on-platform engagement and monetization: the live-video documentation emphasizes instant notifications and paywalled streams, while PPC Land reports that the company told publishers the app already drives more than 30% of all paid subscriptions. The same strategic shift, however, sharpens business risk. In late 2023 and early 2024, Substack’s handling of pro-Nazi newsletters triggered pressure from writers, attracted critical coverage from NBC News and TechCrunch, and culminated in Platformer leaving for Ghost. That episode is not just reputational color. It showed that as Substack builds recommendation and discovery surfaces such as Notes and the app, moderation disputes become more material because the company is no longer merely hosting content but algorithmically helping publications spread. Substack later removed some newsletters after criticism, but the controversy still demonstrates that product expansion and trust-and-safety governance are tightly linked in the company’s story.",
