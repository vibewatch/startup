summary:
  headline: >-
    Substack has genuine creator-platform scale and differentiated network effects, but the 2025 unicorn valuation looks
    expensive against estimated ARR, visible creator churn pressure, and elevated legal-platform risk.
  overallScore: 5.9
  recommendation: research-more
