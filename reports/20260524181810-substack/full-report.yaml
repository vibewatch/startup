        - label: Platform Proof
          value: 4
          note: 5M paid subscriptions (March 2025), $450M GMV, 22% ARR growth; Q1 2025 cash-flow positive — strong traction
        - label: Competitive Moat
          value: 3
          note: Reader network effects real but contested; beehiiv growing rapidly at 0% take-rate; creator exodus risk
        - label: Unit Economics
          value: 2
          note: 90%+ gross margin estimated (platform model); but 10% take rate under structural pressure; no NRR disclosed
        - label: Risk Profile
          value: 2
          note: 'High: creator concentration, fee pressure, Apple IAP, February 2026 breach, no audited data'
        - label: Valuation Discipline
          value: 1
          note: 24.4x ARR vs 5.8x M&A median; base case implies flat-to-negative return; bear case -50–71% loss
        - label: Evidence Quality
          value: 2
          note: No audited financials; no cap table; no Form D for Series C; all ARR/GMV figures are analyst estimates
