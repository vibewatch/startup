  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              Substack's addressable market is best understood through three concentric layers, each with a distinct
              boundary and evidence base. The innermost layer—the one most directly relevant to Substack's current
              business—is the global newsletter platforms for creators market, which The Business Research Company sized
              at $1.76 billion in 2025 and $2.08 billion in 2026, growing at an 18.4% CAGR. This market covers
              standalone platforms, integrated email marketing tools used by individual creators, and social media–based
              newsletter products. The middle layer is the daily newsletters market, which Dataintelo estimated at $6.8
              billion in 2025, expanding at 8.9% CAGR toward $14.7 billion by 2034. This definition captures both free
              and paid newsletter publishing revenue and overlaps with the creator economy infrastructure broadly. The
              outer layer—used most often for TAM citations—is the global email marketing market, which Mordor
              Intelligence placed at $12.84 billion in 2025 and projects at $13.72 billion in 2026 at a 10.82% CAGR
              through 2031. Market Research Future gives a slightly higher estimate of $14.0 billion for 2026, growing
              at 11.4% CAGR to 2035.


              These three layers are not interchangeable. The email marketing market includes enterprise CRM tools, bulk
              senders, and transactional email infrastructure that Substack does not serve. Substack's actual
              competitive surface sits squarely within the newsletter platforms for creators layer, with adjacency to
              the daily newsletters market when evaluating audience ownership and content publishing workflows. Excluded
              spend includes enterprise email service providers (Mailchimp at scale, Salesforce Marketing Cloud, Klaviyo
              enterprise), bulk transactional email, and SMS or push notification channels. Status-quo substitutes—free
              email lists on Mailchimp or ConvertKit, personal Substack without paid tiers, WordPress with a mailing
              plugin—represent the largest category of non-monetizing adjacent activity. The newsletter advertising
              market, which InboxBanner estimated at $2.8 billion in annual spend in 2026, is an adjacent revenue stream
              that competing platforms like beehiiv have monetized aggressively but which Substack has not prioritized.


              Market boundary matters for valuation: if an investor benchmarks Substack against the $13.72 billion email
              marketing market, the platform's $45 million in annualized revenue represents a sub-1% share with large
              theoretical upside. If measured against the $2.08 billion newsletter platforms for creators market, the
              platform's implied market share is more meaningful but the growth ceiling is also lower. Preserving this
              ambiguity is essential for diligence: no single TAM is obviously correct, and the right answer depends on
              which substitutes a creator considers when choosing a publishing platform.
            claimRefs:
