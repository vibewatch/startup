      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Substack's 10% Fee Is a Structural Churn Risk at Scale
            body: >-
              At $10,000/month in subscription revenue, Substack charges approximately $12,000 per year in platform
              fees—compared with a flat $576–$1,152 per year on beehiiv or $348 per year on Ghost. Established creators
              with growing subscriber bases have strong financial incentive to migrate. The May 2026 creator exodus,
              including The Ankler, The Rose Garden Report, and Extra Points, illustrates that this risk is not
              theoretical.
