  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module inventory
        blocks:
          - type: paragraph
            body: >
              Substack is a subscription media platform that enables independent writers, journalists, podcasters, and
              video creators to publish directly to subscribers and monetize through paid subscriptions. The platform's
              core product is an integrated publishing suite combining six content formats under a single publication
              dashboard: email newsletters (the original and dominant format), Notes (a social-feed layer for short-form
              content), Chat (threaded messaging for paid subscriber communities), podcast and audio hosting, live video
              and audio broadcasts, and video-on-demand posts. Each format is accessible to both free and paid
              subscribers, with creators controlling paywall placement at the post or section level. The platform
              operates as a fully managed hosted service—creators receive a [slug].substack.com URL with an optional
              custom domain overlay for a one-time $50 fee, and email is delivered from the @substack.com sender domain.
              Mobile reach is served by native iOS and Android apps, both rated above 4.8/5 across more than 700,000
              combined app store reviews as of May 2026. The product is designed for low-friction onboarding with no
              code required to launch; Substack charges no monthly platform fee and takes a 10% cut of subscription
              revenue only when a creator generates paid revenue. Substack reports over 5 million paid subscriptions
              platform-wide as of early 2026, and its Recommendations network claims to drive more than 30% of all paid
              subscriber conversions.
