            title: Strong mobile ratings and discovery network create durable creator advantage
            body: >
              Substack's iOS app (4.9/5, 454K reviews) and Android app (4.8/5, ~248K reviews) rank among the
              highest-rated apps in their category, reflecting strong product-market fit in mobile content consumption.
              Combined with the Recommendations network driving more than 30% of paid subscriber conversions
              platform-wide, these two signals suggest a self-reinforcing flywheel: high app quality increases
              engagement and retention, while network-driven discovery reduces creator customer-acquisition cost. The
              platform's claimed 5M+ paid subscriptions further corroborates the monetization flywheel.
