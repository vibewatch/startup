  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and content-policy risk
        blocks:
          - type: paragraph
            body: >
              Substack operates in a rapidly tightening multi-jurisdictional regulatory environment. In the United
              Kingdom, the Online Safety Act 2023 (OSA) created legal duties enforceable since March 17, 2025
              (illegal-content duties) and July 25, 2025 (children's-safety duties) requiring "highly effective age
              assurance" to prevent minors from accessing pornography, self-harm promotion, and other harmful content.
              Ofcom has broad enforcement powers including fines of up to 10% of qualifying worldwide revenue and, in
              severe cases, court-ordered service blocking. Substack confirmed compliance by rolling out mandatory age
              verification for UK users—identity-document or selfie-matching via an external provider—for access to
              restricted content. In the European Union, the Digital Services Act (DSA, Regulation (EU) 2022/2065) has
              been fully applicable since February 17, 2024, imposing notice-and-action mechanisms, transparency
              reporting, statement-of-reasons for takedowns, and know-your-business- customer (KYBC) verification. The
              DSA second enforcement wave for mid-sized platforms is targeted for Q2 2026 by MLex; non-compliance
              carries fines up to 6% of annual global turnover (the Commission fined X €120M in December 2025). The
              General Data Protection Regulation (GDPR) requires breach notification to competent data protection
              authorities within 72 hours; Substack's four-month disclosure lag for the October 2025 breach (disclosed
              February 2026) creates a plausible DPA inquiry surface. Australia's Online Safety Act 2021 subjects
              Substack to age-verification, harmful-content takedown, and risk-assessment obligations enforced by the
              eSafety Commissioner; a 2026 "digital duty of care" reform extends obligations to proactive harm
              prevention. In the United States, Section 230 of the Communications Decency Act currently shields Substack
              from liability for most user-generated content—confirmed in John Doe v. Substack Inc. (SF Superior Court,
              Feb 2025, anti-SLAPP dismissal of $25M defamation suit) and Smith v. Substack Inc. (USDC N.D. Cal., Aug
              2024, Section 230 immunity for hosted content negligence claim). The FTC enforces data security and
              deceptive-practice obligations under Section 5 of the FTC Act. The pending STOP CSAM Act would remove
              Section 230 immunity for platforms that knowingly facilitate child sexual abuse material, increase fines
              to $1M, and narrow reporting timeframes—an obligation Substack has pre-empted by updating its privacy
              policy on May 14, 2026 to add NCMEC/CSAM-reporting disclosure. The Substack Defender program provides
              legal support to creators in 15+ countries, mitigating creator-level legal risk but not reducing
              platform-level regulatory exposure.
