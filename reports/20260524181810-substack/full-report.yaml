      - number: '3.4'
        title: Switching Costs, Lock-In, Multi-Homing, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Substack's switching costs are real but asymmetric: lower for the creator than the company's discovery
              moat would suggest, but higher in practice because of the payment-relationship problem. Email list
              portability is a genuine creator-friendly feature—Substack allows full export of subscriber emails
              including paid subscribers. However, exported paid subscriber lists do not include Stripe billing
              relationships; the creator must manually re-enroll paying subscribers on a new platform, which involves
              reader friction, partial churn, and messaging effort. Industry accounts suggest 10–30% of paid subscribers
              do not re-subscribe after platform migration—a meaningful revenue cost for any publication with a large
              paid base. Analytics history, comment archives, and Substack Notes engagement do not migrate;
              recommendations- network growth contributions do not follow the creator.


              The network effect is a partial lock-in mechanism. Creators who receive 30%+ of their paid subscribers
              from Substack's internal network are implicitly paying for ongoing access to that discovery channel
              through their 10% fee. Leaving means losing the incoming flow of network-driven subscribers—an ongoing
              cost rather than a one-time switching cost. This creates a structural asymmetry: new or growing creators
              are more locked in by network dependency, while large established creators (with 50,000+ subscribers and
              stable paid bases) are more likely to find the fee economics outweigh the network value and switch.


              Multi-homing among creators is increasingly common in 2026. The dominant observed pattern is beehiiv as
              primary platform (for economics and analytics) with a secondary Substack presence maintained for discovery
              and network reach. One documented case of a 50,000-subscriber migration to beehiiv reported 30% subscriber
              growth using beehiiv's referral system while acknowledging Substack's network remains "more valuable for
              discoverability." This multi-homing behavior reduces Substack's lock-in but partially preserves its
              network value proposition. Multi-homing readers is rarer but not uncommon: newsletter readers who engage
              deeply often follow individual writers across platforms via email, reducing their exposure to any one
              platform's network.


              Moat durability assessment: Substack's discovery network is its most durable moat, but it is not a classic
              platform network effect where value scales with user count in a self-reinforcing way. The network is
              editorially curated and algorithm-driven; its value to any individual creator depends on Substack's
              curatorial decisions and recommendation engine quality, both of which can degrade or be disrupted.
              beehiiv's trajectory—$30M ARR growing 100%+ YoY, 140,000 newsletters, dedicated growth infrastructure, and
              April 2026 podcast launch—represents the most credible near-term commoditization threat. Ghost's permanent
              0% fee and open-source architecture make it the structural floor for any creator willing to self-host,
              limiting Substack's pricing power on the fee dimension. The combination of converging features,
              platform-fee sensitivity among high-revenue creators, and trust-and-safety controversy creates a scenario
              where Substack's moat is solid in the early-creator segment but vulnerable at the high-value tail.
