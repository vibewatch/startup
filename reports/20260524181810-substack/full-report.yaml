      - number: '7.2'
        title: Operational, security, and data-privacy risk
        blocks:
          - type: paragraph
            body: >
              The February 2026 security incident is the most significant operational risk event in the chapter's
              evidence window. On February 3–5, 2026, Substack CEO Chris Best disclosed that an unauthorized third party
              had accessed approximately 700,000 user accounts—including email addresses, phone numbers, and internal
              metadata—during a window beginning in October 2025. The breach went undetected for approximately four
              months, which cybersecurity experts described as a "particularly troubling" dwell time; attackers had a
              prolonged window to exploit exposed contact data before users were notified. Passwords, financial data,
              and credit card numbers were not accessed. KnowBe4's lead security advocate noted that email addresses and
              phone numbers "are enough for targeted phishing, SIM-swap attempts, or doxxing," and that "attackers don't
              need passwords if they can socially engineer users." The risk is acute for Substack's journalist and
              public-figure user base, who are disproportionately targeted for SIM-swap and doxxing attacks. Comparitech
              and Pixel Privacy advocates publicly called on users to monitor for suspicious communications. No credit
              monitoring, formal regulatory notification (GDPR 72-hour requirement), or third-party security audit
              outcome was disclosed. Substack characterized the issue as fixed and a "full investigation" as underway,
              but provided no specifics. This was reportedly the second security incident after a 2020 mass-BCC email
              exposure. Post-breach, Substack updated its privacy policy (May 14, 2026) to add CSAM/NCMEC detection
              sharing and formalize a one-month response timeline for GDPR/CCPA data-subject requests, signaling an
              accelerated compliance posture. Content moderation risk is structural: Substack's "lightweight"
              enforcement model relies on post-publication reporting rather than proactive filtering. The GLAAD 2026
              Social Media Safety Index identifies platforms lacking robust enforcement as persistently unsafe for
              at-risk communities. Substack's updated content guidelines (March 19, 2026) added UK OSA and Australian
              OSA addenda but retained the core discretionary enforcement posture. No SLA or guaranteed uptime
              percentage is published; platform availability is tracked solely via a public Statuspage.io endpoint.
            claimRefs:
