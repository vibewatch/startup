            title: Apple IAP economics and February 2026 data breach are material platform risks
            body: >
              Mandatory Apple IAP (effective September 2025) adds approximately 30% to iOS subscription prices and
              prevents creator access to iOS subscriber payment data—a structural constraint that has driven documented
              creator departures and limits creator data ownership. The February 2026 data breach (700K accounts,
              ~4-month dwell time before detection) raises questions about the platform's intrusion-detection maturity;
              post-breach security posture is not publicly disclosed. Both risks are architectural: the Apple IAP
              dependency is imposed by Apple policy, and the security monitoring gap is a Substack engineering concern.
