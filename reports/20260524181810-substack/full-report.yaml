        - label: Base Case (45–50% probability)
          low: 780
          mid: 915
          high: 1050
          note: $65–70M ARR at 12–15x; flat to -5% vs entry; preferred stack recovered, limited common upside
        - label: Bear Case (25–35% probability)
          low: 315
          mid: 432
          high: 550
          note: $45–55M ARR at 7–10x; 50–71% loss; liquidation preferences absorb first $200M
