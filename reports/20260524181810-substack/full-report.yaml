          Requires sustained 30% ARR growth, successful advertising monetization, and premium exit multiple — none
          confirmed without audited evidence
      - - Base (45–50%)
        - $65–70M (22% CAGR maintained)
        - 12–15x ARR (above M&A median; below peak SaaS)
        - $780M–$1.05B (flat to -5% vs $1.1B entry)
        - >-
          Current growth rate held; advertising contributes modest revenue; creator churn contained; exit to strategic
          buyer
        - >-
          Most probable scenario; flat-to-modest loss for financial-return buyers; preferred stack recovered but limited
          common upside
      - - Bear (25–35%)
        - $45–55M (<15% CAGR; stagnation)
        - 7–10x ARR (M&A median or below)
        - $315–550M (50–71% loss on $1.1B entry)
        - >-
          Beehiiv captures 20%+ of mid-tier creators; advertising pilot fails; Apple IAP reduces creator economics;
          further multiple compression
        - >-
          Liquidation preference stack absorbs first $200M; common equity severely impaired; potential down-round
          required
    notes: >-
      Source: Sacra (January 2026 outlook), Goldman Sachs creator economy report (2026), beehiiv State of Newsletters
      2026; estimates only.
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >
        Covers directly comparable private creator economy platforms, adjacent public SaaS benchmarks, and notable M&A
        transactions from 2025; does not enumerate every SaaS company.
    columns:
      - Comparable
      - Metric
      - Value
      - Implied Multiple
      - Relevance
      - Limitation
    rows:
      - - Patreon (private, creator platform)
        - $179M revenue (2025, Sacra); $4B valuation
        - $4B valuation / $179M ARR = 22.3x
        - 22.3x ARR
        - Closest direct comparable—creator subscription platform, similar take-rate model
        - 4x Substack's revenue scale; 2021 valuation mark (not recently reset); different creator category mix
      - - Beehiiv (private, newsletter SaaS)
        - $30M ARR (June 2025, Sacra); $192–225M valuation
        - $192–225M / $30M = 6.4–7.5x
        - 6.4–7.5x ARR
        - Closest direct competitive comparable—newsletter platform, same creator TAM
        - >-
          SaaS-subscription model (not GMV take-rate); lower revenue scale; faster ARR growth trajectory (2x to $50M
          projected 2026)
      - - Creator economy software M&A median (Quartermast 2025)
        - 81 deals; 3.2–10.7x range; 5.8x median
        - $261–481M implied for Substack at 5.8x on $45M ARR
        - 5.8x ARR (median M&A)
        - Industry-wide M&A market benchmark for software platforms in creator economy
        - M&A multiples reflect control premium, not minority venture pricing; Substack is larger scale than median deal
      - - Vimeo (acquired by Bending Spoons, 2025)
        - $417M FY2024 revenue; $1.38B acquisition price
        - $1.38B / $417M = 3.3x revenue
        - 3.3x revenue
        - Video creator platform infrastructure; largest recent creator economy M&A benchmark
        - Different business model (B2B SaaS); declining revenue at time of acquisition; distressed-multiple context
      - - Public SaaS median (Windsor Drake/Aventis, Q1 2026)
        - SaaS Capital Index ~3.8–4x EV/ARR; public SaaS median
        - Substack at 24.4x vs 3.8–4x public median = 6x premium
        - 3.8–4x EV/ARR
        - Market-wide public SaaS benchmark for comparable-stage software businesses
        - >-
          Public market liquidity premium; listed companies have audited financials and governance; not directly
          comparable
      - - Public horizontal SaaS (Multiples.vc, May 2026)
        - Median EV/Revenue 2.2x; design/engineering software 4.9x
        - Substack at 24.4x vs horizontal SaaS 2.2x = 11x premium
        - 2.2x EV/Revenue
        - Sector-level benchmark for non-specialized SaaS; useful lower bound
        - Horizontal SaaS is commoditizing; Substack has platform/marketplace characteristics distinct from pure SaaS
      - - Captiv8 (acquired by Publicis, 2025)
        - $32M net revenue; $175M acquisition
        - $175M / $32M = 5.5x revenue
        - 5.5x revenue
        - Creator marketing platform infrastructure; confirms creator economy M&A median
        - >-
          Influencer marketing focus different from subscription publishing; acquired into large enterprise buyer
          context
    notes: >-
      Source: chapter analysis; exit values derived from ARR projections × comparable multiples. All figures are
      estimates; entry price = $1.1B July 2025 Series C.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration below 15% YoY
        - Sacra or equivalent estimate of ARR growth drops below 15% for two consecutive half-years
        - Base case collapses toward bear; exit multiple compresses; $1.1B entry irrecoverable
        - Reassess position; accelerate secondary exit or explore strategic sale process
      - - High-GMV creator concentration defection
        - Any of top 10 newsletters (collectively ~$40M GMV annually) migrates to competing platform
        - Accelerates remaining top-creator reconsideration; GMV and ARR directly impacted; reputational signal
        - Initiate creator retention diligence; assess GMV concentration; consider position reduction
      - - Advertising product launch delayed or abandoned
        - No announced advertising revenue product by Q4 2026 (18 months after December 2025 pilot)
        - Core take-rate model cannot be augmented; fee pressure from 0%-take competitors unmitigated
        - Re-underwrite base case without advertising contribution; revise exit multiple downward
      - - Further preferred financing round at valuation below $1.1B (down-round)
        - Any disclosed financing event at post-money valuation below $1.0 billion
        - >-
          Series C liquidation stack triggers anti-dilution; signals fundamental thesis miss; reputational and financial
          damage
        - Immediate thesis-break; evaluate protective provisions; assess recap terms
      - - Multiple comparable IPOs or M&A at multiples well below 24x ARR
        - Two or more comparable creator/media platforms list or are acquired in 2026 at multiples below 10x ARR
        - Market re-rates Substack to comparable level; $1.1B valuation marked down by external secondary investors
        - Reassess holding thesis; create realistic secondary sale path before further multiple compression
    notes: >-
      Source: Forge Global IPO tracker, Reuters/Bloomberg, company announcements; probability estimates are analyst
      judgment only.
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Series C Form D SEC filing
        - No confirmed Form D for July 2025 Series C on EDGAR as of May 2026; 2021 and 2023 amendments confirmed
        - >-
          Without Form D, liquidation preference terms, participating/non-participating structure, and security class
          are unverifiable from public sources
        - Request from company; check EDGAR CIK 0001783191 for any post-July 2025 Form D filings
      - - Audited financial statements
        - >-
          No GAAP-audited financials disclosed since 2021; all 2022–2026 revenue and margin figures are analyst
          estimates
        - >-
          Cannot independently verify ARR, gross margin, operating expense, or cash-flow positive claim without audited
          statements
        - Request FY2023, FY2024, and FY2025 audited financials from management as condition of investment
      - - Creator retention and net revenue retention metrics
        - No platform-level creator churn rate, net revenue retention (NRR), or cohort analysis is publicly available
        - >-
          GMV concentration at top creators makes retention the single most important driver of ARR trajectory; without
          NRR, growth is unverifiable
        - >-
          Request GMV cohort analysis, creator retention by revenue tier, and subscriber churn disaggregated by
          acquisition channel
      - - Cap table and option pool composition
        - No disclosed cap table, option pool percentage, or anti-dilution structure for any financing round
        - >-
          Without fully diluted share count and option pool, common equity return cannot be modeled; liquidation
          overhang is estimated, not confirmed
        - Request fully diluted cap table from Series C closing, ESOP pool size, and all preference terms
      - - Advertising revenue run-rate and pilot economics
        - >-
          December 2025 native advertising pilot confirmed but no revenue contribution, take-rate structure, or scale
          timeline disclosed
        - >-
          Advertising is the primary lever for ARR growth acceleration beyond the organic subscription trajectory;
          without evidence, bull case is speculative
        - Request advertising revenue by Q1 and Q2 2026, advertiser count, take-rate structure, and roadmap
    notes: 'Source: chapter analysis; conditions reflect publicly available evidence as of May 2026.'
