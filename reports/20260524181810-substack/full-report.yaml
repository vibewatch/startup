      - number: '7.4'
        title: Competitive, people, and execution risk
        blocks:
          - type: paragraph
            body: >
              The "Substack Tax"—the platform's 10% perpetual revenue commission—is driving accelerating creator churn
              at scale. In May 2026, Matt Brown's Extra Points newsletter (71,000 subscribers) migrated to Beehiiv,
              saving an estimated $25,000 per year. The Ankler, a prominent entertainment industry publication, left for
              a new platform called Passport, citing the need for "more flexibility and control across products,
              revenue, and audience relationships." Sean Highkin of The Rose Garden Report moved to Ghost and reported
              "significantly more money" earned after departing. Beehiiv charges a flat monthly fee ($43–$99/month) with
              0% platform commission; the economic crossover point is reached at approximately 200–250 paid subscribers
              paying $5/month, at which Beehiiv's cost is lower than Substack's 10% cut. Beehiiv reported 150%
              year-over-year creator growth and $4.5M additional ARR in Q1 2026 with 50,000+ active creators. MWM
              Intelligence data shows Substack's iOS app download velocity was down approximately 20% in the 7-day
              period ending May 2026 versus the preceding 4-week average, suggesting a cooling-off period even as
              aggregate install base remains large (9.7M+ annual downloads). LinkedIn Newsletters leverages a 900M+ user
              professional network for near-zero distribution friction, representing a structural threat to Substack's
              B2B and professional creator segments. Key person risk is acute: CEO Chris Best, McKenzie
              (communications), and Sethi (CTO) form a three-founder leadership cluster with no publicly disclosed
              succession plan. Best's philosophy shapes Substack's content-moderation posture, investor relations, and
              product strategy; his departure would introduce significant uncertainty. Substack is a single-product
              company—its sole mobile offering is the Substack app—with no revenue diversification outside the 10% take
              rate. This means creator-churn risk and platform- concentration risk are directly co-mingled: loss of top
              creators reduces both GMV and advertiser/network attractiveness. Diligence asks include: (1) creator
              cohort retention curves at 12/24/36 months for publications earning >$10K/month; (2) disclosed churn rate
              among the top-100 revenue-generating publications; (3) committed growth capital or bridge facility
              confirming runway beyond 2026.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR041
              - CR042
              - CR043
              - CR044
              - CR045
