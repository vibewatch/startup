          - type: callout
            title: Newsletter Platform Market Is Undersized in Most Analyst Reports
            body: >-
              The most commonly cited email marketing TAMs ($12–14B) dramatically overstate the market relevant to
              Substack by including enterprise CRM and bulk email infrastructure. The TBRC newsletter platforms for
              creators estimate of $2.08B in 2026 is a closer approximation of the serviceable addressable market,
              though it likely underestimates the full GMV opportunity including gross writer revenue flows.
