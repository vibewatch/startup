            title: Paid Conversion Rate Is the Critical Leading Indicator
            body: >-
              With 50 million active subscriptions and only 5 million paid (10% paid rate as a gross share), the latent
              monetization opportunity within Substack's existing free user base is significant. If niche newsletter
              conversion rates of 4–10% could be achieved across the platform average, gross writer revenue could
              increase 1.3–3× without new user acquisition. The actual realized conversion rate of ~3% reflects the
              general-content publication mix.
