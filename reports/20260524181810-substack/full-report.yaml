  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and base profile
        blocks:
          - type: paragraph
            body: >
              Substack's customer base is two-sided: creators are the supply-side customers who publish and build
              audiences, while readers are the demand-side customers who pay for access to content. As of 2026,
              Substack's active paying-creator count stands at approximately 17,000 writers earning revenue (at least
              one paid subscriber), while nearly 100,000 publications in total earn some money—double the figure from
              May 2025. Creators fall into four primary segments: (1) independent journalists and former newsroom
              employees who migrated to Substack following layoffs or to gain editorial autonomy; (2) independent
              writers including columnists, analysts, essayists, fiction writers, and niche commentators; (3)
              subject-matter experts such as academics, public health professionals, financial analysts, and tech
              product managers; and (4) emerging multi-format creators running podcast-and-newsletter or video-and-
              newsletter hybrid publications. On the reader side, the platform reported 50 million total active
              subscriptions (free and paid) as of April 2026, with 5 million paid subscriptions—a figure representing
              subscription transactions, not unique individuals (since one reader may pay for multiple publications).
              Finance, business, U.S. politics, technology, and health are the five highest-earning content verticals,
              as verified by bestwriting.com's 2026 statistics compilation. Geographically, Substack skews heavily
              toward English-language markets, though the company is actively waiving its 10% platform fee in India,
              Brazil, Indonesia, Mexico, and Malaysia to accelerate international creator density. The Recommendations
              network and app-driven discovery together drive 30%+ of paid subscriptions, making the platform's internal
              network an effective acquisition channel for creators with established-enough audiences to earn
              cross-publication recommendations.
