      - number: '1.2'
        title: Founders, leadership, and capital base
        blocks:
          - type: paragraph
            body: >-
              The founder story is consistent across reputable sources even when public governance detail is thin.
              Betakit, Y Combinator, industry profiles, and major funding coverage identify Chris Best, Hamish McKenzie,
              and Jairaj Sethi as the founding trio, with Best remaining CEO and McKenzie still serving as a prominent
              public-facing co-founder and policy voice. Best and Sethi’s Kik and Waterloo background is useful context
              because it highlights that Substack’s roots sit partly in consumer internet product-building rather than
              purely in publishing. Public capital formation is much better documented than board structure. In July
              2025, Substack announced a $100 million Series C, with TechCrunch, Axios, Variety, Hollywood Reporter,
              Silicon Republic, and BetaKit all broadly agreeing on round size and a post-money valuation of about $1.1
              billion. Coverage also converges on the lead backers—BOND and The Chernin Group—with Andreessen Horowitz
              and a mix of celebrity and strategic investors participating. What remains less visible is equally
              important for diligence: public sources do not provide a complete current board roster, exact ownership
              percentages, liquidation preferences, or a cleanly sourced 2026 employee count. That means the company is
              easy to orient on at the founder-and-financing level, but not yet fully transparent enough for
              institutional governance underwriting from public evidence alone.
