  - id: TP001
    title: Competitor Profile Table
    enumerationScope:
      coverage: partial
      rationale: >
        Seven primary competitors and one status-quo substitute profiled; additional smaller platforms (Buttondown,
        Paragraph, MailerLite, Lede) exist but lack the scale or strategic relevance to materially change the
        competitive analysis for Substack's investor diligence.
      basis: >
        Competitors selected based on public evidence of newsletter or creator-monetization platform operations,
        publicly reported user or revenue metrics, and direct product overlap with Substack's core
        email-newsletter-plus-paid-subscription workflow as of May 2026.
    columns:
      - competitor
      - category
      - scale-or-funding
      - target-segment
      - revenue-model
      - differentiation
      - limitation
    rows:
      - - beehiiv
        - Direct newsletter platform
        - $82.7M raised; $30M ARR (June 2025); $225M valuation (2024)
        - Growth-focused newsletter operators and media businesses
        - Flat SaaS fee ($0–$96/mo); 0% on paid subs; ad and Boosts network revenue
        - >-
          Native referral, ad network, Boosts, advanced analytics; Morning Brew heritage; April 2026 podcast hosting at
          0%
        - No equivalent discovery network to Substack's recommendations; still closing automation gap vs Kit
      - - Ghost
        - Direct newsletter platform (open-source)
        - Nonprofit foundation; $100M+ creator revenue on platform (est.); privately funded
        - Independent publishers wanting full ownership and 0% fees
        - Flat managed hosting ($9–$199/mo) or free self-hosted; 0% take rate
        - Open-source CMS, full data ownership, custom themes, 8,000+ integrations, SEO-native
        - No discovery network; technical overhead for self-hosting; minimal built-in growth mechanics
      - - Kit (ConvertKit)
        - Email marketing / creator automation
        - Bootstrapped to profitability; ~$40M ARR est. (pre-2025); rebranded from ConvertKit 2024
        - Creators selling digital products, courses, and multi-step sequences
        - Flat SaaS fee ($0–$66+/mo at 1K subs); 0% on creator revenue
        - Best-in-class visual automation builder; tag-based segmentation; digital product delivery
        - >-
          Not newsletter-native; no discovery network; limited multimedia publishing; less brand cachet than Substack or
          beehiiv
      - - Mailchimp (Intuit)
        - General email marketing
        - Acquired by Intuit 2021 for $12B; large enterprise scale; Standard ~$13–$100+/mo
        - SMBs, e-commerce, and brand marketers who need automation and segmentation
        - Per-contact SaaS; free tier to 500 contacts; Standard/Premium; no rev-share on subscriptions
        - 300+ integrations, advanced automation, brand-kit, multivariate testing, mature deliverability
        - No native paywall or paid subscriptions; business-focus misaligns with creator economy; expensive at scale
      - - Patreon
        - Fan membership / creator monetization platform
        - ~$400M raised; 250,000+ active creators; $1B+ paid out to creators (cumulative)
        - Multi-format creators (podcasters, artists, video) seeking tiered fan memberships
        - 10% platform fee (new creators post-Aug 2025) plus Stripe fees; legacy plans 8–12%
        - Tiered perk structure, Discord integrations, video hosting (100hrs/mo), community tools
        - No newsletter delivery or email list ownership; no content discovery; audience locked to Patreon
      - - Medium
        - Publishing and writer monetization platform
        - ~$400M raised; millions of monthly readers; Partner Program pays ~$10–$20/mo median
        - Writers seeking broad organic discovery without managing an email list
        - Reader subscription ($5/mo, $50/yr); writer earnings allocated by reading time
        - Strong algorithmic discovery; built-in audience; no tech overhead for writer
        - >-
          Writers do not own email list; earnings unpredictable and platform-controlled; no direct subscriber
          relationship
      - - WordPress + plugins
        - Self-hosted CMS with newsletter plugins
        - Free open-source; plugins (MailPoet, Mailster) typically $50–$150/yr premium tiers
        - Technical creators wanting maximum control and zero platform fees
        - One-time plugin license or annual SaaS; no revenue share on subscriptions; hosting ~$10–$50/mo
        - Complete ownership, unlimited customization, no platform lock-in, established SEO
        - Requires technical maintenance; deliverability must be managed independently; no discovery network
      - - Internal build (e.g. The Ankler)
        - Status quo / self-built publishing stack
        - Custom; typically viable only at 50,000+ paid subscribers generating significant revenue
        - Large established publications willing to invest in technical infrastructure
        - No platform fee; costs are engineering and hosting
        - Full control over brand, business model, and technology stack
        - High upfront and maintenance cost; requires technical team; no network effects
    notes: >
      Scale figures for beehiiv from Sacra and Latka platforms (June 2025 reporting). Ghost foundation revenue figure
      per ghost.org official materials. Kit/ConvertKit revenue estimated from public sources; not formally disclosed.
      Patreon pricing reflects post-August 4, 2025 standardized plan. Medium earnings estimate from community-reported
      medians; not officially published by Medium.
