      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses and Conflicting Estimates'
        blocks:
          - type: paragraph
            body: >
              The range of market size estimates for the newsletter and email creator space is wide, and analysts use
              incompatible boundary definitions. Mordor Intelligence, one of the most frequently cited sources, pegs the
              global email marketing market at $12.84 billion in 2025 and $13.72 billion in 2026, with a 10.82% CAGR to
              2031. A competing estimate from Market Research Future places the 2025 market at $12.6 billion and 2026 at
              $14.0 billion—a $280 million spread attributable to different methodological choices and vendor
              classifications. The Business Research Company uses a tighter scope—newsletter platforms for creators
              specifically—and arrives at $1.76 billion in 2025 and $2.08 billion in 2026, growing at 18.4% CAGR.
              Dataintelo's daily newsletters market estimate of $6.8 billion in 2025 sits between these two anchor
              points. Fortune Business Insights cited a $16.08 billion newsletter market figure that readless.app
              aggregated, suggesting even wider definitional variance exists in commercial research.


              Below these market-level estimates, the creator economy superset was valued at $205–314 billion in 2026 by
              multiple research groups, with Goldman Sachs using approximately $250 billion as a consensus figure. The
              newsletter segment is a small but rapidly growing share of that ecosystem. Substack's $450 million in
              gross writer revenue and beehiiv's $30 million in platform revenue together represent a measurable but
              still early-stage portion of the potential creator economy spend on publishing infrastructure.


              These figures collectively support a SAM for Substack—defined as the newsletter platforms for creators
              market—of roughly $2 billion in 2026. The serviceable obtainable market (SOM) is harder to bound
              precisely. Using platform-level revenue and writer GMV as a proxy, Substack's current SOM participation is
              approximately $495 million (platform revenue of $45M plus gross writer revenue of $450M, though the latter
              is a pass-through, not a revenue figure). Competing platform revenues—beehiiv at $30M ARR, Ghost at
              difficult-to-quantify open-source scale—suggest the overall paid newsletter infrastructure market is still
              in early innings of monetization relative to the TAM. The major evidence gap is the absence of a clean,
              comparable sizing for the Substack-specific SAM, since all analyst reports use methodologies that blend
              free and paid, individual and enterprise, platform and tool layers without consistent segmentation.
