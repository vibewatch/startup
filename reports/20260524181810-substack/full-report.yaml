companyProfile:
  summary: >-
    Substack is a San Francisco-based creator platform founded in 2017 by Chris Best, Hamish McKenzie, and Jairaj Sethi.
    It began as paid newsletter infrastructure and has since expanded into a broader creator operating system spanning
    newsletters, Notes, Chat, podcasts, live video, and mobile app distribution. The business model is simple and
    creator-aligned on paper: creators keep 90% of subscription revenue minus payment fees while Substack takes a 10%
    platform cut. Public traction is real, with 5 million paid subscriptions on-platform by 2025 and a July 2025 $100
    million Series C at a $1.1 billion valuation, but underwriting remains constrained by private-company opacity around
    audited revenue, board structure, creator concentration, and long-term cohort durability.
