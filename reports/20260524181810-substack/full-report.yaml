      - number: '5.2'
        title: Technical architecture and operating model
        blocks:
          - type: paragraph
            body: >
              Substack's operating model is built on a fully managed hosting architecture: creators never provision
              infrastructure. The platform handles email delivery, media storage, CDN-backed web pages, payment
              processing, and mobile app distribution as bundled services. Email delivery uses Substack's own sending
              infrastructure; the sender domain remains @substack.com regardless of custom domain configuration. Payment
              infrastructure relies on Stripe for web subscriptions and Apple's in-app purchase system for iOS
              subscriptions—the latter became mandatory in September 2025. The iOS app (v2.97.0, iOS 17+) and Android
              app (v2.99.2, updated May 21, 2026) are native applications. The platform has no public REST API or
              official developer SDK; the 126+ GitHub repositories tagged "substack" are community-built tools, with
              python-substack (151+ stars, ma2za) being the most active unofficial library. Uptime is tracked through a
              public Statuspage.io endpoint—no SLA or guaranteed uptime percentage is published, and no incidents were
              recorded May 13–24, 2026. Media hosting for podcasts, live streams, and VOD is included in the platform
              fee. The Recording Studio, launched March 12, 2026, enables browser-based audio and video capture for solo
              creators and up to two remote guests with automatic short-clip generation and AI-assisted thumbnail
              creation; TechCrunch reported that video/audio creators grew revenue 50% faster in a 90-day window than
              text-only peers.
            claimRefs:
              - CE008
