    layout: standard
    summary: >
      IC-ready scoring across seven investment dimensions: market opportunity, platform proof, competitive moat, unit
      economics, risk profile, valuation discipline, and evidence quality. Scores reflect the balance of evidence as of
      May 2026; private company limitations constrain evidence quality materially.
    data:
      items:
