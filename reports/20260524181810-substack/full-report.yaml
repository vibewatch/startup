      - number: '7.3'
        title: Partner, platform, and financial-model risk
        blocks:
          - type: paragraph
            body: >
              Mandatory Apple in-app purchase integration, activated in September 2025 for all 30,000+ Substack iOS
              publications, is the most structurally consequential platform risk. Apple extracts 30% of subscription
              revenue in the first year (15% in subsequent years); Substack passes this cost to subscribers via an
              automatic ~30% iOS price markup (a $10/month newsletter becomes ~$13 in-app). Critically, IAP transactions
              transfer the billing relationship from the creator to Apple: subscriber payment histories and renewal
              management sit entirely within Apple's ecosystem, making IAP-acquired subscribers non-portable if a
              creator migrates to a competing platform. This eliminates the data-portability argument that historically
              distinguished Substack from walled-garden competitors. IAP payments carry a 45-day remittance lag compared
              to near-immediate web payments via Stripe, creating cash-flow friction for creators reliant on
              subscription income. Outside the United States, iOS users have no lower-price alternative: the Epic Games
              v. Apple court ruling that permits external payment links applies only within the US, meaning
              international subscribers are exclusively exposed to inflated IAP pricing—without explanation in the app
              UI that a cheaper web option exists. Substack is Stripe-exclusive for web payments: creators connect their
              own Stripe accounts and Substack charges its 10% fee through the Stripe API. No alternative payment
              processor is supported; Stripe policy violations, technical outages, or a relationship termination would
              immediately halt creator payouts. On financial model risk, Sacra estimates Substack's annualized revenue
              at $45M as of July 2025, against ~$220M in total funding raised across six rounds, implying a revenue
              multiple of approximately 24x at the $1.1B July 2025 valuation. Substack reached positive cash flow in Q1
              2025 per Sacra, but no audited financials, public SLA, or detailed cost structure are available to
              independently verify burn trajectory or margin profile. Revenue is highly concentrated in the top tier of
              creators: the top 10 publications collectively earn over $40M/year, and 50+ creators each earn over
              $1M/year individually—meaning a small number of defections directly impacts Substack's GMV and 10%
              take-rate revenue.
            claimRefs:
