  - id: FU001
    title: Customer journey map
    type: journey-map
    insight: >
      Creators move from zero-cost account activation through a monetization ramp before facing the 10% fee crossover
      where flat-fee competitors become financially attractive. Readers convert from free discovery through app-based
      engagement to paid subscriptions, with multi-newsletter adoption deepening platform retention. Departures occur at
      the expansion stage for creators who reach scale and encounter fee or control limits.
    data:
      items:
        - id: discovery
          label: Discovery
          actor: Creator / Reader
          description: >
            Creators: hear about Substack through journalism layoffs, SEO, peer referrals, or social media. Readers:
            discover specific newsletters through Substack app recommendations, social shares, or search—platform
            reports 1 million+ post discoveries in the app daily.
          channels:
            - Social media shares
            - Substack app recommendations
            - Search / SEO
            - Journalism layoff network effects
        - id: activation
          label: Activation
          actor: Creator / Reader
          description: >
            Creators: launch free newsletter with zero upfront cost; begin building free subscriber base. Readers:
            subscribe to one or more newsletters for free; 50M+ total subscriptions active as of April 2026 (the vast
            majority are free).
          channels:
            - Substack web signup (zero fee)
            - Reader iOS / Android app
            - Email-only free subscription
        - id: monetization
          label: Monetization / Purchase
          actor: Creator enables paid; Reader converts
          description: >
            Creators: enable paid tier at their chosen price (minimum $5/month or $50/year); Substack takes 10% of all
            paid revenue. Readers: upgrade from free to paid via web checkout (Stripe) or iOS IAP (Apple-managed, ~30%
            more expensive). Platform reports 30%+ of paid conversions originate within its own network.
          channels:
            - Substack Recommendations network
            - Notes social feed discovery
            - Stripe web checkout
            - Apple IAP (iOS, mandatory since Aug 2025)
        - id: engagement
          label: Deep Engagement
          actor: Reader / Creator
          description: >
            Retained paid subscribers engage at 3× the rate of free subscribers; average open rates 44%. Creators post
            at sustained cadence; community features (Chat, comments) deepen audience bond. Average reader subscribes to
            5 newsletters per week on platform.
          channels:
            - Email inbox (44% open rate)
            - Substack iOS / Android app
            - Chat / comment threads
            - Live video broadcasts
        - id: expansion-or-departure
          label: Expansion or Departure
          actor: Creator (at scale)
          description: >
            Successful creators generating >$100K/year face annual Substack fees exceeding $10K. Flat-fee competitors
            (Ghost, Beehiiv) become financially attractive. Documented departures: The Ankler (150K+ paid subscribers),
            Alison Roman (343K subscribers), Matt Brown (saves $22K/year on Beehiiv). Some creators remain for network
            discovery value.
          channels:
            - Ghost / Beehiiv migration
            - Substack network exit (loss of recommendations)
            - Custom platform (The Ankler → Passport)
    sourceRefs:
      - SU001
      - SU002
      - SU009
      - SU011
      - SU012
