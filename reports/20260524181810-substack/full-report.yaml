      - number: '5.3'
        title: Trust, safety, security, and privacy
        blocks:
          - type: paragraph
            body: >
              Substack's content policy is formalized in publicly accessible guidelines (substack.com/content), updated
              March 19, 2026 to include addenda for the UK Online Safety Act and Australia's Online Safety Act.
              Prohibited content includes harassment, doxxing, incitement to violence, CSAM, and spam. Privacy
              governance is maintained in a separate policy (substack.com/privacy, updated May 14, 2026), which added an
              explicit commitment to share CSAM detection data with NCMEC and established a 30-day response timeline for
              GDPR and CCPA data subject requests. Subscriber email addresses and names are shared with publication
              owners, but phone numbers and payment details are withheld. The most significant security event in the
              chapter's evidence window is the February 2026 data breach: Substack disclosed on February 3–5, 2026 that
              approximately 700,000 user accounts were compromised, with email addresses and phone numbers exposed but
              not passwords or payment information. Cybersecurity analysts reported the intrusion went undetected for
              approximately four months (placing the breach origin around October 2025), indicating a substantial
              detection gap. CEO Chris Best issued a public apology and Substack characterized the incident as resolved;
              Infosecurity Magazine and Forbes independently confirmed the breach. This was reportedly the second
              Substack security incident following a 2020 mass-BCC email exposure. The Substack Defender program
              provides legal support and platform advocacy to creators facing external threats. Creator support uses a
              tiered model: chatbot triage plus dedicated human responses for paid creators. Third-party reviewers and
              creator forums document complaints about Apple IAP pricing markup and limited data portability as
              persistent product grievances.
