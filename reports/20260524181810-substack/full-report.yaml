  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Substack’s official materials describe the company as more than a newsletter tool: it is positioned as a
              media platform and economic infrastructure layer for independent writers, podcasters, video creators, and
              other knowledge workers. The clearest current articulation is that creators can write, send, record,
              livestream, chat, sell subscriptions, and manage analytics inside one product, with the platform making
              money only when creators do. Official pages repeatedly state that creators keep 90% of subscription
              revenue minus payment-processing fees while Substack takes a 10% cut, which makes the business model easy
              to explain and directly aligned with creator earnings. Scale signals are meaningful even if not fully
              audited. On its own pages, Substack says it has 5 million paid subscriptions and counting, that tens of
              millions of people read, watch, and listen on the platform every week, that more than half of new
              subscribers come from the built-in network, that 1 million-plus posts are discovered in the app every day,
              and that 30% or more of paid subscriptions come from within the network. Those claims matter because they
              frame Substack as a discovery system, not just a transactional checkout layer. Product scope has also
              widened in a way that supports that framing: official and third-party materials show Notes, chat,
              podcasts, live video, and the mobile app all working as ways to deepen engagement and reduce a creator’s
              need to stitch together multiple external tools.
