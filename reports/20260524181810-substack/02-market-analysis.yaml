  - id: buyer-segmentation
    title: "Creator Buyer/User/Payer Segmentation"
    body: >
      Substack's market is shaped by a collapsed buyer/user/payer structure: in the self-serve core of the business, the creator is
      simultaneously the buyer (choosing the platform), the user (writing and publishing), and the indirect payer (through a revenue share
      rather than a subscription fee). Readers are the direct payers who fund the creator's revenue. This is atypical compared to SaaS
      markets where buyer, user, and budget owner are often distinct personas. The implications for go-to-market and churn analysis are
      significant: the creator's motivation to stay on Substack is primarily economic (the 10% fee versus alternatives), whereas the
      reader's motivation is editorial (value of the specific publication).


      Five main creator segments define the Substack user base. Solo writers and independent journalists—primarily former or current
      media professionals—represent the platform's original and most culturally prominent cohort. Roughly 30% of Substack writers come
      from journalism backgrounds. This segment values editorial freedom, audience ownership, and direct monetization. Their paid
      conversion rates are often above the platform average. The second segment is niche-content specialists: finance analysts, software
      engineers, local news operators, and subject-matter experts who achieve conversion rates of 4–10% versus the platform average
      of 3%, because their audiences have clear professional or financial reasons to pay. Tech newsletters lead at 8% conversion.
      Media brands—small editorial teams, digital-native publishers, and occasionally legacy brands launching Substack verticals—form
      a third segment. These users seek audience development, newsletter-specific analytics, and multi-author workflows that Substack
      supports but which competitors like beehiiv and Ghost also offer. The fourth segment is podcasters: Substack's podcast network
      has grown to 10,000 shows, with one in five publications offering audio content. The fifth is hybrid multimedia creators who
      blend text, audio, and short-form social content, often treating Substack as one monetization layer within a multi-platform strategy.


      Adoption path differs by segment. For new solo writers, Substack is typically the first paid publishing tool—low friction to start,
      no upfront cost, discovery via Notes and recommendations. For established media professionals switching from institutional employers,
      Substack is an income platform with network effects. For scaled-up creators generating above $10,000 per month in subscription
      revenue, the 10% fee becomes the primary migration trigger, and beehiiv, Ghost, or independent platforms become serious alternatives.
      Nearly 100,000 publications earn money on Substack as of April 2026, but the median creator earns approximately $4,000 annually—a
      figure that implies most monetizing creators are part-time or supplemental income seekers rather than full-time businesses. The top
      quartile earns above $16,000, and 50+ publications earn over $1 million per year.
