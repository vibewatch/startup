  - id: adoption-constraints
    title: Adoption Constraints
    body: >
      The most structurally significant adoption constraint is Substack's 10% platform fee, which becomes punitive at scale. A creator
      earning $10,000 per month in subscription revenue pays approximately $12,000 per year in platform fees alone before Stripe processing
      costs, compared with $0 on beehiiv or Ghost (which charge flat SaaS rates instead). At $1,000 per month in revenue, Kit's bundled
      3.5% + $0.30 fee structure is actually cheaper than beehiiv's $49/month plan, but Substack's take rate is the worst-in-class at all
      revenue levels above $500/month. The fee comparison is widely known: MWM Intelligence reported a high-profile creator exodus in
      May 2026, with The Ankler, The Rose Garden Report, and Extra Points all publicly citing the "Substack Tax" as a primary reason for
      migrating to Ghost, beehiiv, or Passport.


      The second major constraint is Apple's in-app purchase mandate. Since August 2025, Substack requires all publications with payments
      enabled to offer Apple's IAP system. Apple takes 30% (declining to 15% after year one) of any subscription purchased through the
      iOS app. Substack responds by automatically raising iOS app prices to preserve creator take-home revenue—effectively passing the
      cost to readers. A more significant long-run issue, analyzed by beehiiv CEO Tyler Denk, is that Apple-managed subscriptions remove
      the billing relationship from the writer's Stripe account, preventing creators from portably migrating paid subscribers to another
      platform if they leave Substack. This creates lock-in by design and has drawn adverse coverage from TechCrunch and Dataconomy.
      The US-only external payment link workaround (permitted by the Epic v. Apple ruling) mitigates this partially for US creators but
      does not apply to international markets.


      Subscription fatigue is an emerging demand-side constraint. In 2026, 41% of consumers report subscription fatigue; the average
      American holds 8.2 active subscriptions while underestimating their monthly spend by 2.5×. Churn rates for paid newsletters have
      risen approximately 23%, and customer acquisition costs for paid newsletter subscriptions are up ~67% since 2021. Monthly paid
      newsletter churn averages ~4%, meaning a 1,000-paid-subscriber newsletter must add 40 new subscribers each month just to stay flat.
      Beehiiv's own data shows a 50% annual paid churn rate for newsletters on its platform, suggesting significant voluntary cancellation
      behavior across the category. HubSpot's survey found that 55% of newsletter professionals believe earning newsletter revenue will
      become significantly harder by 2030.


      Switching and migration friction is real but declining. Exporting subscriber lists is technically feasible on all platforms, but
      creator archives, historical posts, SEO, and embedded reader habits create inertia. Apple-managed subscriptions exacerbate migration
      friction by severing the payment relationship. Competition from 0% take-rate SaaS tools will intensify: beehiiv at $43/month with
      0% revenue cut, Ghost at $29/month with 0% cut, and Kit at 0% monthly fee (3.5% per transaction) all offer substantially better
      unit economics than Substack for any creator generating more than a few hundred dollars per month in subscription revenue.
