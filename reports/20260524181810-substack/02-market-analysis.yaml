      severity: material
      topic: market-share-data
      missingEvidence: "Platform-level market share data for Substack, beehiiv, Ghost, and Kit as a percentage of the newsletter platforms for creators market—no analyst report provides this breakdown."
      whyItMatters: "Without share data, it is impossible to benchmark Substack's relative position within the SAM or assess whether it is gaining or losing ground against direct competitors."
      diligencePath: "Commission a custom survey of newsletter creators asking which platform they use and why; or request platform-disclosed subscriber/publication counts from beehiiv and Ghost for comparison."
      relatedQuestionRefs: [QM007, QM026]

    - type: missing-source
      severity: material
      topic: ios-iap-subscription-share
      missingEvidence: "The proportion of Substack's paid subscriptions that are managed by Apple vs. direct web subscriptions—no public data available as of runDate."
      whyItMatters: "The magnitude of Apple lock-in and the 30% fee impact depends directly on what share of Substack's subscriber base subscribed via iOS IAP. If it is small, the constraint is manageable; if large, migration becomes structurally difficult."
      diligencePath: "Request Substack internal data on IAP vs web subscription split; monitor creator surveys on subscription origination channel."
      relatedQuestionRefs: [QM015]

    - type: conflicting-data
      severity: material
      topic: market-size
      missingEvidence: "A consensus or independent-validation methodology reconciling the 7× divergence between TBRC ($2.08B) and Fortune Business Insights ($16.08B) newsletter market estimates for 2026."
      whyItMatters: "Valuation benchmarking for Substack depends on which market definition is accepted; the difference implies either a sub-1% or ~2% market share for a platform with $45M in revenue."
      diligencePath: "Compare primary source methodologies from TBRC and Fortune Business Insights; test each definition against bottom-up creator count × average platform fee to derive an alternative estimate."
      relatedQuestionRefs: [QM005]

    - type: private-evidence-only
      severity: minor
      topic: creator-migration-magnitude
      missingEvidence: "Quantitative data on the total number of publications and/or revenue that migrated from Substack to competing platforms in 2025–2026."
      whyItMatters: "High-profile migrations are documented but whether they represent a statistically significant revenue loss is unknown. Substack's retention metrics are not publicly disclosed."
      diligencePath: "Monitor public platform growth disclosures from beehiiv and Ghost; cross-reference Substack's gross writer revenue trajectory for deceleration signals."
      relatedQuestionRefs: [QM014]

    - type: stale
      severity: minor
      topic: discoverability-dependence
      missingEvidence: "Current (2026) data on the share of new paid subscriptions attributable to Substack's built-in discovery (Notes, Recommendations, network) versus external traffic—the 30% figure cited is a company claim without a clear date."
      whyItMatters: "If discovery dependence is growing, Substack's network effect moat strengthens. If declining, the fee premium becomes harder to justify as discovery value decreases."
      diligencePath: "Request updated Substack platform data on paid subscription origination by channel; track Notes engagement metrics."
      relatedQuestionRefs: [QM017]

