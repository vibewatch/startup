  - id: adoption-trajectory-and-platform-growth
    title: Adoption trajectory and platform-level growth
    body: >
      Substack's paid subscription growth trajectory is one of the clearest available proxies
      for platform health: 1 million paid subscriptions reached in March 2021; 2 million by
      February 2023; 3 million by February 2024; 4 million by November 2024; and 5 million
      by March 2025. The final jump from 4 million to 5 million—a net addition of more than
      1 million subscriptions in roughly four months—was partly attributed by Sacra to a "Trump
      bump" driven by demand for independent political analysis during the U.S. election period.
      As of early 2026, the 5 million figure has not been updated officially, suggesting a
      possible deceleration in paid subscription growth even as total active subscriptions
      (including free) reached 50 million. Gross writer revenue grew from $300 million in 2023
      to $370 million in 2024 to $450 million in 2025, with Sacra estimating Substack's own
      annualized revenue at $45 million in July 2025 (a 10% take rate on $450 million GMV).
      The number of revenue-generating publications doubled from 50,000 to nearly 100,000 in
      calendar year 2025, with 10,000 publications crossing the 1,000-paid-subscriber threshold
      that many creators treat as a sustainability milestone. Micro-publisher data from bestwriting
      shows an 18% year-on-year rise in paid subscribers and a 21% jump in average monthly
      earnings per creator. iOS app downloads exceeded 9.7 million in the trailing 360 days
      as of May 2026 (MWM), though download velocity declined roughly 20% in the final seven
      days of that window—a possible signal of plateauing mobile growth. Engagement indicators
      remain strong: 44% email open rates (approximately double the industry average of 20–22%)
      and 5.2% click-through rates as reported by WorldMetrics and bestwriting.
