  - id: FU002
    title: "Adoption / deployment funnel"
    type: funnel
    insight: >
      The Substack creator funnel shows steep drop-offs: from all registered publishers to
      those earning any revenue, to those reaching the 1,000-paid-subscriber sustainability
      threshold, to top earners. Roughly 70% of active newsletters generate zero paid revenue,
      meaning monetization success is highly concentrated among a small fraction of creators.
