company:
  name: Substack
chapter:
  number: 6
  title: Customers
  summary: >
    Substack serves two interlocking customer groups: creators (writers, journalists, podcasters,
    and niche experts who publish) and readers (subscribers who pay for and consume content). As
    of early 2026, the platform hosts over 5 million paid subscriptions across approximately
    100,000 revenue-generating publications, up from 50,000 in May 2025. Revenue is sharply
    concentrated: 50+ creators earn more than $1 million annually while the median creator earns
    approximately $4,000 per year and roughly 70% of active newsletters generate zero paid
    revenue. Platform-level annual paid subscription churn is estimated at ~50% (Sacra), making
    ongoing creator and reader acquisition critical to growth. Strong adverse signals include
    high-profile departures—The Ankler (150,000+ paid subscribers), Alison Roman (343,000
    subscribers), Anne Helen Petersen, Sean Highkin, Matt Brown—driven by the 10% "Substack
    Tax," limited customization, and post-mandatory-Apple-IAP data lock-in. Despite defections,
    Substack's iOS app maintains a 4.86/5 rating from ~700,000 reviews and the Recommendations
    network drives 30%+ of paid conversions, providing durable acquisition advantages.

sections:
  - id: customer-segments-and-base-profile
    title: Customer segmentation and base profile
    body: >
      Substack's customer base is two-sided: creators are the supply-side customers who publish
      and build audiences, while readers are the demand-side customers who pay for access to
      content. As of 2026, Substack's active paying-creator count stands at approximately 17,000
      writers earning revenue (at least one paid subscriber), while nearly 100,000 publications
      in total earn some money—double the figure from May 2025. Creators fall into four primary
      segments: (1) independent journalists and former newsroom employees who migrated to
      Substack following layoffs or to gain editorial autonomy; (2) independent writers including
      columnists, analysts, essayists, fiction writers, and niche commentators; (3) subject-matter
      experts such as academics, public health professionals, financial analysts, and tech product
      managers; and (4) emerging multi-format creators running podcast-and-newsletter or video-and-
      newsletter hybrid publications. On the reader side, the platform reported 50 million total
      active subscriptions (free and paid) as of April 2026, with 5 million paid subscriptions—a
      figure representing subscription transactions, not unique individuals (since one reader may
      pay for multiple publications). Finance, business, U.S. politics, technology, and health
      are the five highest-earning content verticals, as verified by bestwriting.com's 2026
      statistics compilation. Geographically, Substack skews heavily toward English-language
      markets, though the company is actively waiving its 10% platform fee in India, Brazil,
      Indonesia, Mexico, and Malaysia to accelerate international creator density. The
      Recommendations network and app-driven discovery together drive 30%+ of paid subscriptions,
      making the platform's internal network an effective acquisition channel for creators with
      established-enough audiences to earn cross-publication recommendations.
