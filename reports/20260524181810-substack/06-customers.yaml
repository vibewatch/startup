  - id: named-creator-proof-and-outcomes
    title: Named creator proof and production outcomes
    body: >
      Substack's most compelling customer evidence is the roster of high-profile creators who
      have built substantial paid audiences on the platform. Heather Cox Richardson's "Letters
      from an American" is the platform's largest publication by subscriber count with 2.9 million
      total subscribers; Lenny Rachitsky's "Lenny's Newsletter" has approximately 1.1–1.2 million
      subscribers and is described in multiple third-party rankings as the leading business
      newsletter globally. The Free Press, founded by former New York Times editor Bari Weiss,
      had 750,000 total subscribers with over 100,000 paying $8/month—making it Substack's top
      revenue generator as of August 2024. The Bulwark had 39,000 paid subscribers and 283,000
      free across six publications; Zeteo News (Mehdi Hasan) reported 20,000 paid subscribers
      and 217,000 free readers within months of a February 2024 launch. These named deployments
      all involve production-grade, commercially active publications earning recurring revenue with
      real audiences. Creator satisfaction captured in G2 and TrustRadius reviews (both accessed
      May 2026) highlights ease of use, content ownership, and seamless payment integration as
      recurring positives. Specific G2 reviews describe the platform as the "best social network"
      with "outstanding viewpoint diversity," while TrustRadius reviews emphasize the ability to
      own content without technical skills as a decisive differentiator for non-developer writers.
      The About page testimonials include a creator noting they had "never had this kind of one-
      to-one relationship with someone reading their work"—consistent with Substack's positioning
      as a trust-based direct-audience platform. Apple App Store listing reviews contribute
      additional customer-proof signal with 700,000+ ratings and a 4.86/5 rating per MWM data.
