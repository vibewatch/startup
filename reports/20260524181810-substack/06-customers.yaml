figures:
  - id: FU001
    title: "Customer journey map"
    type: journey-map
    insight: >
      Creators move from zero-cost account activation through a monetization ramp before facing
      the 10% fee crossover where flat-fee competitors become financially attractive. Readers
      convert from free discovery through app-based engagement to paid subscriptions, with
      multi-newsletter adoption deepening platform retention. Departures occur at the expansion
      stage for creators who reach scale and encounter fee or control limits.
    data:
      items:
        - id: "discovery"
          label: "Discovery"
          actor: "Creator / Reader"
          description: >
            Creators: hear about Substack through journalism layoffs, SEO, peer referrals, or social
            media. Readers: discover specific newsletters through Substack app recommendations,
            social shares, or search—platform reports 1 million+ post discoveries in the app daily.
