  - id: retention-repeat-usage-and-satisfaction
    title: Retention, repeat usage, and satisfaction
    body: >
      Substack does not publish platform-level NRR, GRR, or subscriber cohort data, making
      retention assessment reliant on proxies. The most authoritative estimate is Sacra's figure
      of approximately 50% annual churn on paid subscriptions—meaning that to maintain a
      flat paid subscriber base, a creator must continuously replace half their paying readers
      each year. This translates to roughly 4.2% monthly churn. For a creator with 600 paid
      subscribers at $8/month, maintaining that base requires adding approximately 25 new paid
      subscribers monthly or attracting roughly 357 new free subscribers monthly at the 7%
      free-to-paid conversion rate (mazkara.studio analysis). Retention correlates strongly
      with creator quality, consistency, and audience type: tech and finance verticals achieve
      8% free-to-paid conversion versus a 3% platform average (bestwriting), suggesting these
      niche audiences are stickier and more willing to pay. Engagement proxies are favorable:
      44% average email open rates and paid subscribers engaging at 3x the rate of free subscribers
      indicate that readers who commit to paying are highly active. The Substack iOS app's 4.86/5
      star rating from approximately 700,000 reviews (MWM, May 2026) and the Reader app's
      continued download volume provide indirect evidence of strong reader-side retention. However,
      the platform-level churn is a structural risk: with 50% annual subscription churn at the
      newsletter level, the "treadmill" dynamic forces creators to run acquisition continuously
      or face declining income—which contributes to documented creator burnout and platform
      defections. For readers, the absence of a Substack-wide unique-subscriber count prevents
      distinguishing between readers subscribing to one newsletter (high at-risk) versus those
      subscribed to five (lower overall churn risk because they remain on the platform even if
      one newsletter churns).
