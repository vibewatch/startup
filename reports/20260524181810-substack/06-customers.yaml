  evidenceGaps:
    - dimension: quantification
      severity: material
      topic: platform-nrr-grr-cohort-data
      type: no-public-evidence
      description: >
        Substack has not published platform-level NRR, GRR, or paid subscriber cohort curves.
        Retention analysis relies entirely on Sacra third-party estimates.
      missingEvidence: >
        Substack has not published platform-level NRR, GRR, or paid subscriber cohort curves.
        Retention analysis relies entirely on Sacra third-party estimates and publicly available
        creator anecdotes. No investor-grade cohort data is available.
      whyItMatters: >
        Without cohort data or NRR figures, it is impossible to independently assess subscriber
        health, the true retention improvement trajectory, or how paid subscriptions compound
        over time. The 50% annual churn estimate, if accurate, materially constrains platform
        growth math.
      diligencePath: >
        Request platform-level cohort analytics from Substack management; ask for NRR and GRR
        by content vertical and creator tier; cross-reference against Stripe payout data if
        available under NDA.
      relatedQuestionRefs:
        - QU016
        - QU025

    - dimension: quantification
      severity: major
      topic: unique-payer-count
      type: no-public-evidence
      description: >
        Unique paying individual count is not disclosed. The reported 5 million paid subscriptions
        overstates the payer base since each individual can hold multiple subscriptions.
      missingEvidence: >
        Substack reports paid subscriptions as a transaction count, not a unique-payer count.
        An individual reader subscribing to four newsletters counts four times. No source has
        estimated the unique-payer deduplication factor.
      whyItMatters: >
        Unique payer count is the relevant denominator for market penetration and TAM estimates.
        Without it, platform scale is difficult to benchmark against traditional media or SaaS
        subscriber metrics.
      diligencePath: >
        Request unique-subscriber-count from Substack; ask whether Stripe Connect data can be
        deduplicated by payment method or email address; compare against estimated creator
        subscriber base using the Substack discovery API.
      relatedQuestionRefs:
        - QU014
        - QU028

    - dimension: quantification
      severity: moderate
      topic: creator-segment-churn-differential
      type: no-public-evidence
      description: >
        Creator-segment-level churn (journalists vs. experts vs. multimedia creators) is unknown.
        The aggregate 50% annual churn may mask significantly worse rates among emerging creators.
      missingEvidence: >
        No source provides churn rates segmented by creator tier, content vertical, or
        subscription price point. The 50% annual churn figure is a platform average that
        likely conceals a wide distribution.
      whyItMatters: >
        If emerging creators churn at 70–80% annually while top creators retain 90% of paid
        subscribers, the platform's revenue concentration risk is understated and the creator
        lifecycle economics are materially different from the aggregate figure.
      diligencePath: >
        Request creator-tier cohort data from Substack; analyze public creator subscription
        page histories; survey migrated creators about their retention rates before departure.
      relatedQuestionRefs:
        - QU021
      relatedTableRefs:
        - TU003

    - dimension: quantification
      severity: moderate
      topic: named-creator-proof-coverage
      type: partial-evidence
      description: >
        Named creator proof table (TU003) is partial. Many top-50 publications have no
        verified paid subscriber counts; figures are drawn from third-party aggregations
        and may be 12–18 months stale for individual creators.
      missingEvidence: >
        Direct creator disclosure of current paid subscriber count and monthly revenue is
        rare. Most figures in TU003 are third-party estimates from bestwriting.com,
        backlinko.com, and paved.com rather than self-reported creator data.
      whyItMatters: >
        Stale or estimated creator proof data weakens the customer validation section.
        Without verified current figures, the named-proof table understates or overstates
        individual creator scale and monetization success.
      diligencePath: >
        Review each creator's most recent public update or interview disclosure; cross-reference
        against Substack leaderboard screenshots; request creator case studies from Substack
        marketing team.
      relatedTableRefs:
        - TU003
