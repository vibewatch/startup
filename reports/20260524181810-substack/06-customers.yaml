  - id: expansion-dynamics-and-concentration-risks
    title: Expansion dynamics and concentration risks
    body: >
      Substack's expansion pattern is creator-side rather than typical enterprise land-and-expand:
      successful publications grow their paid subscriber base organically via the Recommendations
      network and Notes discovery, increasing GMV paid to Substack at the same 10% take rate.
      There is no formal tiering or upsell mechanism—creators cannot unlock additional platform
      capabilities by paying more. Revenue concentration is an acute risk: the top 10% of creators
      capture 62% of all platform payments (mazkara.studio), the top 50+ creators each earn over
      $1 million annually (bestwriting), and the top 10 publications alone generate $40 million+
      per year (backlinko). If any top-tier creator migrates—as The Ankler (150,000+ paid
      subscribers), Alison Roman (343,000 subscribers), and Anne Helen Petersen did in 2025–2026—
      the GMV impact is meaningful. Adverse evidence is substantial: Beehiiv reported approximately
      3,000 migrations from Substack in the 12 months to March 2025 (BlogHerald), and the roster
      of documented departures includes Casey Newton (content moderation concerns, January 2024),
      Brad Hargreaves (API/integration needs, September 2025), and Matt Brown of Extra Points
      ($25,000+ annual fee savings on Beehiiv vs. Substack). The 10% "Substack Tax" creates an
      accelerating defection incentive as creator revenue scales. Mandatory Apple IAP (August 2025)
      adds further friction by preventing iOS subscriber data portability to Stripe—a structural
      lock-in mechanism that Dataconomy described as a predictable "take control → increase
      dependency → increase take rate" pattern. On the positive side, 30%+ of paid subscriptions
      originate from the Substack network, making the platform's discovery infrastructure a real
      retention tool for creators who cannot replicate that distribution channel elsewhere.
