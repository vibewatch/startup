chapter:
  number: 3
  title: Competitors
  summary: >
    Substack competes across three distinct tiers: direct newsletter platform peers (beehiiv, Ghost, Kit/ConvertKit),
    adjacent monetization platforms (Patreon, Medium), and general email-marketing infrastructure (Mailchimp, WordPress plugins).
    The sharpest competitive threat in 2026 comes from beehiiv, which reached $30M ARR with 140,000+ newsletters and 0% take
    rate, and Ghost, which offers open-source full ownership at flat monthly fees starting at $9–$29/mo. Substack's primary
    differentiation is its network—30%+ of paid subscriptions come from within the platform—but this advantage erodes for
    creators earning above roughly $500/month in subscription revenue, at which point beehiiv or Ghost become structurally
    cheaper. May 2026 saw a documented exodus of high-profile publications including The Ankler (~150,000 paid subscribers),
    Extra Points (71,000 subs, would have paid $25K/yr on Substack vs $3K on beehiiv), and The Rose Garden Report to competing
    platforms. Substack's content moderation posture—laissez-faire by design—is an additional trust liability that has
    triggered writer departures and reputation damage following a push-notification incident promoting a Nazi blog. Switching
    costs are partially mitigated by email list portability but reinforced by payment-relationship lock-in, analytics loss,
    and recommendation-network dependency.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >
      Substack's competitive landscape is best organized by the job the creator is trying to accomplish, rather than by
      product category alone. Three structural tiers define the landscape.


      The first tier—direct newsletter platform peers—contains the four most directly substitutable products: beehiiv, Ghost,
      Kit (formerly ConvertKit), and Buttondown. Each targets the same core workflow of email publishing with optional paid
      subscriptions, but differs sharply in business model, fee structure, and strategic positioning. beehiiv was founded in
      2021 by alumni of Morning Brew and is explicitly building media-company-grade infrastructure for newsletter operators.
      As of June 2025 it had reached $30M in annualized revenue with 140,000 active newsletters and $82.7M in funding, making
      it the fastest-growing and most well-capitalized direct alternative to Substack. Ghost is a nonprofit-backed open-source
      CMS with native newsletter and paid-membership capabilities. Ghost charges 0% on subscription revenue and flat monthly
      fees from $9/mo (Starter) to $199/mo (Business) on its managed hosting; creators who self-host pay only server costs.
      Kit (rebranded from ConvertKit in 2024) is automation-first, targeting creators who sell digital products, courses, and
      multi-step sequences alongside newsletters; its free plan supports up to 10,000 subscribers, and paid plans start at
      $33/mo. None of these platforms replicate Substack's discovery and recommendation network, which remains its most
      durable single differentiation.


      The second tier—adjacent monetization platforms—includes Patreon and Medium, which solve overlapping creator-monetization
      jobs but through fundamentally different product approaches. Patreon (founded 2013, 250,000+ active creators) is a
      tiered fan-membership platform focused on multi-format creators—podcasters, illustrators, video producers, and musicians—
      who want to offer structured perks at multiple price points. Patreon does not provide newsletter delivery or email list
      ownership as core features; its audience "lives" on the platform. After August 4, 2025, Patreon standardized at a 10%
      platform fee for all new creators, matching Substack's rate. Medium operates a Partner Program where writers earn based
      on reading time from paying Medium members ($5/mo or $50/yr); writers do not own their subscriber email list and have
      no control over algorithmic distribution. Medium competes with Substack for the attention of writers who value discovery
      over ownership.


      The third tier—general-purpose email marketing and self-built alternatives—includes Mailchimp (Intuit-owned, 300+
      integrations, no native paywall, Standard plan from $13/mo), MailerLite, ActiveCampaign, and self-hosted WordPress
      with newsletter plugins (MailPoet, Newsletter, Mailster). These tools target business email marketing rather than
      creator monetization, but are genuine status-quo substitutes for creators who do not need paid subscriptions or who
      have sophisticated automation requirements. Mailchimp's Standard plan runs approximately $100/mo for 10,000 contacts—
      more expensive than Substack for a non-monetizing list. WordPress plugins offer maximum customization and zero revenue
      share but require technical maintenance and independent email deliverability infrastructure.


      Internal build is a real substitute for high-revenue publications: The Ankler migrated off Substack to its own in-house
      technology infrastructure in May 2026, a path available only to teams with technical resources and large enough
      subscriber bases to justify the cost. Likely entrants worth monitoring are Spotify (which owns Anchor/Megaphone and
      has newsletter infrastructure from its podcast ecosystem), LinkedIn (which has launched newsletter features for
      professional creators), and Substack's own horizontal expansion risk—if beehiiv continues its 100%+ year-over-year
      revenue growth and closes the feature gap on discovery, the market structure could shift materially within 12–24 months.
