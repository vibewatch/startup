  - id: pricing-and-fee-economics
    title: Pricing, Fee Structure, and Creator Economics
    body: >
      The central pricing dynamic in the newsletter platform market in 2026 is the crossover point between Substack's
      percentage-based model and the flat-fee models of beehiiv and Ghost. At small scale, Substack is effectively free—a
      creator with 100 paid subscribers at $5/month pays Substack roughly $50/month, less than beehiiv's $43/month Scale
      plan. Above approximately 200 paid subscribers at $5/month, beehiiv becomes cheaper; above 1,000 paid subscribers at
      $5/month, the annual cost difference exceeds $2,400. At the scale of Extra Points (71,000 subscribers, roughly $5/month
      average price), the annual cost on Substack exceeds $25,000 versus approximately $3,000 on beehiiv—a $22,000 per year
      difference. This is the documented economic driver behind the May 2026 creator exodus.


      Substack charges exactly 10% of all paid subscription revenue with no cap, volume discount, or negotiated ceiling, plus
      Stripe processing fees of approximately 2.9% plus $0.30 per transaction. The combined all-in fee is typically 13–16%
      of gross subscription revenue. Substack has no monthly subscription for the creator and offers no negotiated volume
      discount for large publications. The model is transparent and requires zero upfront cost, which makes it optimal for
      early-stage creators with uncertain revenue.


      beehiiv charges $0/month (Launch, up to 2,500 subscribers), $43/month billed annually (Scale, up to 100,000
      subscribers), or $96/month billed annually (Max, up to 100,000 subscribers). At over 100,000 subscribers, pricing
      moves to a custom enterprise tier. The Scale plan includes 0% take rate on paid subscriptions, access to the ad network
      and Boosts marketplace, email automations, A/B testing, and surveys. The Max plan adds podcast hosting (with 0%
      revenue cut, launched April 2026), referral programs, multiple publications, and removal of beehiiv branding.


      Ghost Pro charges flat monthly fees: Starter ($18/mo, 1,000 members, one staff user, basic design); Publisher ($29/mo,
      1,000 members, 3 staff users, custom themes, paid subscriptions, advanced analytics); Business ($199/mo, 10,000+
      members, 15 staff users). Ghost takes 0% of subscription revenue; creators pay only Stripe processing fees. Self-hosted
      Ghost is free but requires server hosting (typically $10–20/month). Ghost Pro is the financially optimal choice for
      any creator earning above approximately $290/month in subscription revenue (the point at which Substack's 10% cut
      exceeds Ghost Pro Publisher's monthly fee).


      Kit's pricing (2026): free plan up to 10,000 subscribers with limited automations; Creator plan from $33/month;
      Creator Pro from $66/month. Kit takes 0% of subscription revenue and earns through flat SaaS fees. Mailchimp charges
      per-contact: free up to 500 contacts, Standard plan approximately $13/month (500 contacts, scales to ~$100/month for
      10,000 contacts), no built-in paywall. Patreon charges new creators (post August 2025) a flat 10% platform fee plus
      payment processing. Medium does not charge creators directly but takes a share of the $5/month reader subscription
      pool distributed by reading time—creator earnings are variable and not under creator control.
