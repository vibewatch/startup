figures:
  - id: FP001
    title: "Competitive Positioning Map: Network Effects vs. Fee Efficiency for Creators (2026)"
    type: quadrant
    layout: wide
    summary: >
      Ordinal scoring (1–10) on two competitive axes: x = network/discovery strength (strength of built-in
      audience acquisition through the platform), y = creator fee efficiency (inverse of platform take rate;
      10 = 0% fee/flat cost, 1 = high percentage take). Scores are evidence-backed estimates based on
      public product documentation and third-party analysis as of May 2026. Substack occupies the
      high-network / low-fee-efficiency quadrant; Ghost and beehiiv occupy the high-efficiency / lower-network
      quadrant.
    approximationNotes: >
      Ordinal scores (1–10) assigned using evidence-backed rationale, not precise measurement. Network
      score for Substack (9/10) derived from official 30%+ paid-sub attribution data and creator testimonials
      about discovery value. Fee efficiency for Substack (3/10) reflects 10% + Stripe combined ~13–16% take
      rate versus 0% competitors. beehiiv network score (5/10) reflects growing Boosts/recommendation
      network but no organic discovery engine equivalent to Substack Notes. Ghost fee efficiency (9/10)
      reflects 0% take rate with minimal flat hosting cost. Medium discovery (8/10) reflects strong
      algorithmic distribution. Patreon discovery (2/10) reflects no newsletter-feed discovery mechanism.
    data:
      points:
        - {x: 9, y: 3, label: "Substack", id: comp-substack}
        - {x: 5, y: 9, label: "beehiiv", id: comp-beehiiv}
        - {x: 2, y: 9, label: "Ghost", id: comp-ghost}
        - {x: 4, y: 7, label: "Kit (ConvertKit)", id: comp-kit}
        - {x: 2, y: 6, label: "Mailchimp", id: comp-mailchimp}
        - {x: 2, y: 3, label: "Patreon", id: comp-patreon}
        - {x: 8, y: 5, label: "Medium", id: comp-medium}
