  evidenceGaps:
    - type: no-public-evidence
      severity: major
      topic: "competitor-profile-table: Substack creator cohort retention and churn data segmented by revenue tier"
      missingEvidence: >
        Substack does not publish creator churn rates, platform revenue by creator cohort, or the
        distribution of creators by monthly subscription revenue. Without this data, the precise
        financial exposure from high-revenue creator migration to beehiiv or Ghost cannot be quantified.
      whyItMatters: >
        If the top 1% of Substack creators by revenue generate 50%+ of platform fee income (a common
        SaaS power-law distribution), then the May 2026 exodus of high-profile publications represents
        a disproportionate revenue risk beyond what creator-count metrics would suggest.
      diligencePath: >
        Request Substack internal cohort data under NDA: distribution of platform fee revenue by creator
        monthly revenue decile; creator retention/churn rates for publications above $10K/month in
        subscription revenue; and year-over-year trends in creator migration off-platform.
      relatedTableRefs:
        - TP001
      relatedQuestionRefs:
        - QP019
    - type: no-public-evidence
      severity: moderate
      topic: "feature-capability-matrix: beehiiv and Ghost private platform metrics not disclosed"
      missingEvidence: >
        Ghost's total number of active paid publications, exact creator revenue processed, and retention
        rates are not publicly disclosed by the nonprofit foundation. beehiiv's platform metrics beyond
        ARR and newsletter count (e.g., average revenue per newsletter, creator churn, paid subscriber
        conversion rates) are not publicly available.
      whyItMatters: >
        Comparing Substack's competitive position against beehiiv requires understanding beehiiv's
        creator economics, not just its own platform metrics. Absence of this data limits the ability
        to assess whether beehiiv's 0% take-rate model is sustainable at scale or whether the ad/Boosts
        revenue compensates adequately.
      diligencePath: >
        Request beehiiv and Ghost competitive benchmarks in Substack's investor data room; cross-reference
        against Sacra's available coverage and Latka financial data.
      relatedTableRefs:
        - TP002
      relatedQuestionRefs:
        - QP015
    - type: no-public-evidence
      severity: minor
      topic: "moat-durability-competitive-risk-register: quantitative moat metrics for recommendation network ROI"
      missingEvidence: >
        Substack's official claim that 30%+ of paid subscriptions come from within the network is not
        broken down by creator size, content category, or time cohort. The marginal value of the
        network to a creator with 1,000 paid subscribers versus 50,000 paid subscribers is unknown.
      whyItMatters: >
        If network-driven paid subscriptions are concentrated among small/new creators rather than
        mid-to-large creators, then the 30%+ figure overstates the lock-in for the high-revenue creators
        most at risk of migrating to beehiiv or Ghost.
      diligencePath: >
        Request Substack breakdown of recommendation-driven paid subscriber attribution by creator
        revenue cohort; analyze whether network contribution rate declines as creators scale.
      relatedTableRefs:
        - TP004
      relatedQuestionRefs:
        - QP008

