  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: "TR001 regulatory risk register boundary"
      missingEvidence: >
        TR001 does not enumerate emerging or lower-priority jurisdictions outside the confirmed UK,
        EU, US, and Australia frameworks, so the regulatory risk register remains intentionally partial.
      whyItMatters: >
        Readers could otherwise over-interpret TR001 as exhaustive and underweight jurisdictional tail
        risk that may matter if Substack has material creator or reader exposure in additional markets.
      diligencePath: >
        Extend the regulatory scan to Canada, key APAC markets, and any country where Substack has
        material creator or reader exposure; add any confirmed platform-safety or privacy regimes to
        TR001 with the same statutory-maximum framing used here.
      relatedQuestionRefs:
        - QR024
      relatedTableRefs:
        - TR001
