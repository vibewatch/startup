callouts:
  - title: "February 2026 breach likely violated GDPR 72-hour notification requirement"
    body: >
      The February 2026 data breach disclosed a four-month detection gap that almost certainly
      violated GDPR Article 33's 72-hour breach-notification requirement. Substack has not
      publicly disclosed DPA notifications or inquiry outcomes. This is an active unresolved
      legal exposure that could result in fines of up to 4% of global annual turnover, in
      addition to compounding reputational damage to a platform whose value proposition is
      trust-based direct audience relationships.
    calloutType: risk
    claimRefs:
      - CR001
      - CR002

  - title: "Revenue opacity prevents independent modelling of break-even trajectory"
    body: >
      Revenue opacity is a persistent diligence gap. Sacra's $45M annualized revenue estimate
      (July 2025) is an independent inference, not audited. Substack has never published
      financials, gross margin, burn rate, or runway. The combination of $220M total funding
      raised, a $1.1B valuation at 24x estimated revenue, and a creator-churn headwind from
      Beehiiv's 0%-fee model means an investor cannot independently model break-even trajectory
      without private company access. Diligence should require audited financials and creator
      cohort churn data before any investment decision.
    calloutType: insight
    claimRefs:
      - CR012
      - CR015

