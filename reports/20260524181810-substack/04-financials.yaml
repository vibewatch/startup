figures:
  - id: FI001
    title: "Revenue Model Bridge: Creator Subscription Activity to Substack Platform Revenue"
    type: flow
    layout: wide
    summary: >
      Illustrates how creator subscription activity flows through the Substack revenue
      model to produce platform revenue. Starts from total active subscriptions (35M)
      and paid subscriptions (5M), applies an assumed average annual value per paid
      subscription to derive GMV, and then applies the 10% take rate to arrive at
      estimated platform ARR. All figures are estimates derived from public platform
      metrics and Sacra analysis.
    approximationNotes: >
      Average revenue per paid subscription implied by $450M GMV / 5M paid
      subscriptions = $90/year (~$7.50/month). This is consistent with a median price
      of $5–$10/month weighted toward annual plans. GMV and ARR figures are Sacra
      estimates as of July 2025. Stripe fees are borne by creators separately and are
      not deducted in this flow.
    data:
      nodes:
        - id: total-active-subs
          label: "35M active subscriptions (free + paid)"
          value: 35000000
          unit: subscriptions
        - id: paid-subs
          label: "5M paid subscriptions"
          value: 5000000
          unit: subscriptions
        - id: gmv
          label: "~$450M creator GMV (est. 2025)"
          value: 450000000
          unit: USD
        - id: substack-cut
          label: "10% take rate"
          value: 0.10
          unit: rate
        - id: platform-arr
          label: "~$45M platform ARR (est. July 2025)"
          value: 45000000
          unit: USD
        - id: creator-earnings
          label: "~$405M net to creators (before Stripe)"
          value: 405000000
          unit: USD
      edges:
        - from: total-active-subs
          to: paid-subs
          label: "~14% paid conversion rate"
        - from: paid-subs
          to: gmv
          label: "×$90 avg annual revenue/sub"
        - from: gmv
          to: platform-arr
          label: "10% Substack take rate"
        - from: gmv
          to: creator-earnings
          label: "90% net to creators"
    claimRefs:
      - CI002
      - CI003
      - CI007
      - CI008

  - id: FI002
    title: "Unit Economics Bridge: Creator Revenue Flow After Platform and Processing Fees"
    type: flow
    layout: standard
    summary: >
      Illustrates the economics of a representative $10/month subscription from
      subscriber payment to creator net payout, showing how Substack's 10% fee,
      Stripe's 2.9% + $0.30 transaction fee, and Stripe's 0.7% recurring billing
      fee each reduce creator take-home on a web subscription. A parallel column
      shows the Apple IAP pathway, which adds Apple's 30% fee and a 45-day payout
      delay. All figures are from official pricing sources.
