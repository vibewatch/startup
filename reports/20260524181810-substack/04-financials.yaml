company:
  name: Substack
chapter:
  number: 4
  title: Financials
  summary: >
    Substack is a private company and has not published audited financial statements;
    all revenue, ARR, and GMV figures cited here are third-party analyst estimates
    (primarily Sacra) or derived from publicly disclosed platform metrics and the
    company's 10% take rate. Sacra estimates Substack hit $45 million in annualized
    revenue in July 2025, up from $37 million at year-end 2024, driven by 10% of
    approximately $450 million in creator GMV across roughly 5 million paid
    subscriptions. The company reported being "accidentally cash-flow positive" in Q1
    2025 but stated it is not focused on sustained profitability, prioritizing growth
    instead. In July 2025 Substack raised $100 million Series C at a $1.1 billion
    valuation (total disclosed funding ~$200 million), reducing near-term capital risk
    but confirming continued financing dependency. Key financial risks include creator
    revenue concentration, 10% take-rate pressure from 0%-fee rivals (beehiiv, Ghost),
    Apple IAP adding a 30% fee wedge on iOS international subscriptions, gross margin
    compression if advertising builds out, and the absence of audited disclosure. ARR
    and GMV trajectory are well-corroborated by independent analysis; burn, runway,
    capex, and unit economics are unavailable from public evidence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model, pricing, and public traction
    body: >
      Substack's revenue engine is simple and publicly documented: the platform charges
      no upfront or monthly fee, taking a flat 10% of every paid subscription
      transaction. Stripe, which handles payment processing, separately charges 2.9% +
      $0.30 per transaction plus a 0.7% recurring billing fee introduced in July 2024.
      At a $10/month subscription price the all-in fee is roughly 16.6%, leaving the
      creator approximately $8.34. The Substack official help center confirms this
      structure without ambiguity. Because the model is purely transactional, Substack's
      revenue scales directly with GMV (total creator subscription revenue across the
      platform), and Substack earns exactly 10% of that GMV line. Sacra, an independent
      analyst, estimates the platform GMV reached approximately $450 million in 2025, up
      from $370 million in 2024 and $300 million in 2023, making Substack's estimated
      platform revenue (ARR) approximately $45 million in July 2025, up from $37 million
      at year-end 2024 and $30 million at year-end 2023. ARR Club separately reported
      the $45M ARR milestone in June 2025, consistent with Sacra's estimate. These
      figures are estimates from third-party analysts, not audited results; Substack has
      not publicly disclosed revenue since a reported $12 million in gross revenue for
      2021, cited by Axios. Traction indicators supporting the GMV estimate include the
      company's own March 2025 disclosure that paid subscriptions exceeded 5 million
      (more than doubling from 2 million in 2023), Backlinko's confirmed report of 20+
      million monthly active subscribers, Bestwriting's sourced figure that nearly
      100,000 publications now earn money globally as of April 2026, and the WorldMetrics
      2026 market report noting 35+ million active subscriptions. Substack also
      disclosed in Axios and the Sacra dataset that more than 50 individual creators earn
      over $1 million per year, and Backlinko confirmed the top 10 newsletters
      collectively earn approximately $40 million annually. Both data points reinforce
      heavy GMV concentration at the top of the creator distribution. The iOS app drives
      more than 30% of all paid subscriptions per Sacra, making it a material revenue
      channel even as it introduces Apple IAP complexity (see section 3).
