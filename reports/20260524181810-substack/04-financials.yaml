  evidenceGaps:
    - type: no-public-evidence
      severity: critical
      topic: "audited-financial-statements"
      missingEvidence: >
        Substack has not published audited financial statements for any year after 2021. No P&L,
        balance sheet, cash flow statement, or tax filings are publicly available. All revenue,
        GMV, burn, and margin figures are analyst estimates or derived calculations.
      whyItMatters: >
        Without audited financials, any revenue estimate carries material uncertainty. The Sacra
        $45M ARR estimate may differ from actual results by 20% or more in either direction.
        Underwriting at the $1.1B valuation requires confirmation of the revenue trajectory.
      diligencePath: >
        Request audited financial statements (income statement, balance sheet, cash flow) for
        FY2022–FY2025 under NDA. Reconcile against Stripe transaction data as an independent
        verification of GMV.
      relatedTableRefs:
        - TI005
      relatedQuestionRefs:
        - QI003
        - QI008
        - QI010

    - type: no-public-evidence
      severity: major
      topic: "burn-rate-and-cash-position"
      missingEvidence: >
        Monthly burn rate, cash and equivalents balance, and runway calculation are not publicly
        disclosed. The only signal is CEO's Q1 2025 "accidentally cash-flow positive" statement,
        which is directional only and may not reflect post-Series C spending ramp.
      whyItMatters: >
        Capital adequacy cannot be verified without burn data. The $100M Series C could represent
        12 months or 4+ years of runway depending on the company's spending plans.
      diligencePath: >
        Request CFO-provided monthly cash flow statement for the last 12 months; confirmed
        forecast for 18 months post-Series C; and management's stated runway under base, bull,
        and bear scenarios.
