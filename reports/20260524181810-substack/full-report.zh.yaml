  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Substack 的可触达市场最好拆成三层同心圆，每一层都有不同边界和证据基础。最内层，也是与 Substack 当前业务最直接相关的一层，是全球创作者通讯平台市场；The Business Research
              Company 估计该市场 2025 年规模为 $1.76 billion，2026 年为 $2.08 billion，CAGR 为
              18.4%。这个市场覆盖独立平台、个人创作者使用的一体化邮件营销工具，以及基于社交媒体的通讯产品。中间层是每日通讯市场，Dataintelo 估计 2025 年规模为 $6.8 billion，并以 8.9%
              CAGR 增长，到 2034 年达到 $14.7 billion。这个定义同时纳入免费和付费通讯发布收入，也与更宽的创作者经济基础设施重叠。最外层，也是 TAM
              引用中最常用的一层，是全球电子邮件营销市场；Mordor Intelligence 估计 2025 年为 $12.84 billion，2026 年为 $13.72 billion，并预测到 2031 年
              CAGR 为 10.82%。Market Research Future 给出略高的 2026 年估计，为 $14.0 billion，并以 11.4% CAGR 增长到 2035 年。


              这三层不能互换。电子邮件营销市场包含企业 CRM 工具、批量发送工具和事务邮件基础设施，而 Substack 并不服务这些需求。Substack
              的实际竞争面明确落在创作者通讯平台这一层；评估受众所有权和内容发布工作流时，它又与每日通讯市场相邻。不应计入的支出包括企业邮件服务提供商（规模化 Mailchimp、Salesforce Marketing
              Cloud、Klaviyo enterprise）、批量事务邮件，以及 SMS 或推送通知渠道。现状替代方案——Mailchimp 或 ConvertKit 上的免费邮件列表、没有付费层级的个人
              Substack、带邮件插件的 WordPress——构成最大一类未变现的相邻活动。InboxBanner 估计 2026 年年支出为 $2.8 billion 的通讯广告市场，是一条相邻收入流；beehiiv
              等竞争平台已经积极变现，但 Substack 尚未优先投入。


              市场边界会直接影响估值：如果投资者拿 $13.72 billion 的电子邮件营销市场对标，Substack 的 $45 million 年化收入意味着低于 1% 的份额，理论上行很大。如果按 $2.08
              billion 的创作者通讯平台市场衡量，平台隐含份额更有分量，但增长天花板也更低。尽调必须保留这种模糊性：没有哪一个 TAM 显然正确，答案取决于创作者选择发布平台时会把哪些替代方案放进比较集。
