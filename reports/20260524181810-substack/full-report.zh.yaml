      - - EU Digital Services Act（欧盟数字服务法，Regulation (EU) 2022/2065）
        - 欧盟
        - 2024 年 2 月起生效；第二轮执法潮为 2026 年 Q2；X 于 2025 年 12 月被罚 €120M
        - 高 — 中型平台现已进入执法范围
        - 高 — 罚款最高可达年度全球营业额的 6%
        - 透明度报告；通知与行动机制；面向商业用户的 KYBC
        - 中 — Substack 合规状态未经独立审计；若 EU MAU 超过 45M，可能被认定为 VLOP
        - 审计 DSA 合规计划；确认创作者打款环节的 KYBC 落地；核验透明度报告发布
      - - GDPR（Regulation (EU) 2016/679）— 泄露通知和数据主体权利
        - 欧盟 / EEA / 英国
        - 生效 — 2026 年 2 月的泄露披露可能未满足 72 小时 DPA 通知要求
        - 高 — 鉴于 4 个月检测滞后，可能触发多个 DPA 调查
        - 高 — 罚款最高可达全球年度营业额的 4%（Art 83(5)）或 €20M
        - 隐私政策于 2026 年 5 月 14 日更新；承诺 1 个月内响应数据主体请求；EU-US 传输使用 Standard Contractual Clauses
        - 高 — 72 小时通知缺口未解决；DPA 调查状态未知
        - 索取 DPA 通知记录；取得 DPA 结案确认或和解状态；审阅 DPC（爱尔兰）调查历史
      - - US Section 230 (47 U.S.C. § 230) — 责任改革风险
        - 美国
        - 现行法律仍完整；国会改革提案活跃；STOP CSAM Act 待审
        - 中 — 当前任期改革可能性不高，但两党压力持续
        - 高 — 若改革取消大型平台豁免，Substack 将暴露于创作者内容责任
        - Section 230 目前已对 Substack 有利地确认（John Doe v. Substack 2025；Smith v. Substack 2024）
        - 中 — 长期风险；若 STOP CSAM 通过，CSAM 相邻促进行为失去豁免
        - 跟踪 STOP CSAM 和 KOSA 立法进展；审阅 CSAM 检测供应商和 NCMEC 申报节奏
      - - Australia Online Safety Act 2021 + 2026 数字注意义务改革
        - 澳大利亚
        - 生效 — 2026 年修正案加入主动伤害预防义务
        - 中 — eSafety Commissioner 已开始对其他平台采取执法程序
        - 中 — 民事罚款；蓄意不合规可能导致服务暂停
        - Substack 发布 AU OSA 合规文章；年龄验证和内容门禁正在推进
        - 中 — 注意义务改革范围尚未最终确定；合规成本未量化
        - 确认 eSafety Commissioner 分类；取得澳大利亚外部律师对新注意义务的评估
    notes: 覆盖截至 2026 年 5 月的重大监管框架；不包括新兴或推测性司法辖区。列示罚款为法定最高额。
