      - 行动含义
    rows:
      - - Apple IAP 创作者锁定和流失加速
        - 月收入 >$5K 的出版物月度创作者净收入流失率
        - 创作者净收入月流失率连续三个月超过 3%
        - 投资假设破裂：如果头部创作者迁移速度快于新进入者补位速度，10% 抽成护城河被侵蚀
      - - 英国 / 欧盟监管执法
        - Ofcom 开启调查，或针对 Substack 发起 DSA 执法程序
        - Ofcom、EU Digital Services Coordinator 或 GDPR DPA 发出任何正式调查或罚款通知
        - 重大：潜在罚款为全球收入 6–10% + 合规成本；暂停英国 / 欧盟增长投入
      - - 2026 年 2 月泄露 — GDPR 监管调查
        - Irish DPC 或任何欧盟 / 英国监管机构就泄露通知时点开启 DPA 调查
        - 任何 DPA 就 Art 33 的 72 小时通知义务开启调查或发出罚款通知
        - 重大成本敞口；与现有泄露披露叠加，进一步损害声誉
      - - 创作者集中度 — top-100 流失
        - 年收入 >$500K 的出版物公开宣布离开
        - 任意 90 天窗口内，三个或更多 top-100 收入出版物公开离开
        - 投资假设破裂：说明 Recommendations 网络折扣无法为规模化经营者抵消 10% 费率
      - - 安全事件复发
        - 新的未授权访问披露，或安全研究员披露影响 Substack 基础设施的 CVE
        - 2026 年 2 月泄露后 24 个月内发生任何新的重大未授权访问事件
        - 投资假设破裂：安全故障模式显示结构性监控缺陷，与信任优先业务模式不兼容
