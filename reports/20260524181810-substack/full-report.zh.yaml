      - number: '4.2'
        title: 成本结构、毛利率与广告转向
        blocks:
          - type: paragraph
            body: >
              Substack 的成本结构受益于平台模式：公司不生产内容，也不承担媒体文件的托管成本；没有库存负担；新增一个付费订阅的边际成本主要是支付处理。Stripe 向 Substack 汇总收费，Substack
              先扣除创作者收入与 Stripe 成本之间的差额，再向创作者分配 90%。行业分析将 Substack 平台层面的毛利率放在 90%+，这与 SaaS
              型公司一致：主要可变成本是支付基础设施，而不是内容生产。Pootlepress 和多份分析师综述指出，2021 年 Substack 报告总收入 $11.9 million、净亏损 $22.9
              million，意味着当时运营费用约为收入的 2.9 倍。到 2025 年 Q1，公司据 CEO Chris Best 对 Nieman Lab 的说法已“意外”实现现金流转正，但 Best
              明确表示公司并不聚焦盈利，而是优先增长。Variety 确认，2025 年 7 月 Series C 时 Substack 员工刚刚超过 100 人；按旧金山软件公司的市场薪酬估算，年化人力成本约为 $20-30
              million。其他运营费用包括云基础设施、大规模邮件投递、客户支持、法律服务（Substack 的创作者法律项目）以及不断扩大的产品工程投入。上述项目均未公开披露。2025 年 12 月，CityAM 报道
              Substack 启动原生广告试点，把品牌与人工筛选的 newsletter 对接。试点阶段 Substack 暂不抽取赞助交易分成，但公司已释放信号：如果试点成功，将把广告产品商业化。The Current
              报道称，广告计划源于投资者对收入多元化的要求，也源于创作者压力——平台上的作者已经在手工管理自售广告交易，据称拥有 75,000 名以上订阅者的出版物，newsletter 赞助单次插入可达
              $20,000。PPC Land 指出，Substack 的 $100M Series C 明确释放了广告支持属于战略重点的信号。广告产品若能规模化，可能在 10%
              订阅抽成之外增加第二条收入线，但也会抬高成本（销售、广告运营、品牌安全），并可能改变 Substack 的激励结构，与其“创作者独立”的定位产生张力——正如 Enders Analysis 所说，这与
              Netflix 的订阅加广告混合模式相呼应。
