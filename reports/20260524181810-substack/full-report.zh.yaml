      - number: '7.2'
        title: 运营、安全与数据隐私风险
        blocks:
          - type: paragraph
            body: >
              2026 年 2 月安全事件是本章证据窗口内最重大的运营风险事件。2026 年 2 月 3–5 日，Substack CEO Chris Best 披露，自 2025 年 10
              月开始的一段窗口期内，未经授权的第三方访问了约 700,000 个用户账户——包括邮箱地址、电话号码和内部元数据。泄露约四个月未被发现，网络安全专家称这种 dwell
              time“尤其令人担忧”；在用户收到通知之前，攻击者有很长时间可以利用暴露的联系数据。密码、财务数据和信用卡号未被访问。KnowBe4 的首席安全倡导者指出，邮箱地址和电话号码“足以用于定向
              phishing、SIM-swap 尝试或 doxxing”，且“如果攻击者能对用户做 social engineering，就不需要密码”。对 Substack
              的记者和公众人物用户群体来说，这一风险很尖锐，因为他们更容易成为 SIM-swap 和 doxxing 攻击目标。Comparitech 和 Pixel Privacy
              倡导者公开呼吁用户监控可疑通信。公司未披露信用监控、正式监管通知（GDPR 72 小时要求）或第三方安全审计结果。Substack 称问题已经修复，“全面调查”正在进行，但没有提供细节。据称，这是继 2020 年
              mass-BCC 邮件暴露后的第二起安全事件。泄露之后，Substack 于 2026 年 5 月 14 日更新隐私政策，加入 CSAM / NCMEC 检测共享，并正式设定 GDPR / CCPA
              数据主体请求一月响应时限，显示合规姿态加速。内容审核风险具有结构性：Substack 的“轻量”执行模式依赖发布后举报，而不是主动过滤。GLAAD 2026 Social Media Safety Index
              将缺乏强执行力的平台识别为对高风险社群持续不安全。Substack 2026 年 3 月 19 日更新的内容 guidelines 加入英国 OSA 和澳大利亚 OSA
              附录，但保留了核心的自由裁量式执行姿态。公司未发布 SLA 或保证 uptime 百分比；平台可用性只通过公开 Statuspage.io 端点跟踪。
