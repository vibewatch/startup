      - number: '6.5'
        title: 扩张机制与集中度风险
        blocks:
          - type: paragraph
            body: >
              Substack 的扩张模式发生在创作者侧，而不是典型企业 SaaS 的 land-and-expand：成功 publication 通过 Recommendations 网络和 Notes
              发现自然扩大付费订阅者基数，推动支付给 Substack 的 GMV 按同样 10% 抽成增长。平台没有正式分层或 upsell 机制——创作者不能通过付更多钱解锁额外平台能力。收入集中度是尖锐风险：前 10%
              创作者拿走全平台 62% 的支付额（mazkara.studio），50+ 名头部创作者每人年收入超过 $1 million（bestwriting），仅前 10 个 publication 每年就产生 $40
              million+ 收入（backlinko）。如果任何头部创作者迁移——正如 The Ankler（150,000+ 付费订阅者）、Alison Roman（343,000 订阅者）和 Anne Helen
              Petersen 在 2025–2026 年所做的那样——GMV 影响会很明显。反向证据也很充足：Beehiiv 报告截至 2025 年 3 月的 12 个月里约有 3,000 名创作者从 Substack
              迁移（BlogHerald）；有记录的离开者包括 Casey Newton（内容审核担忧，2024 年 1 月）、Brad Hargreaves（API / 集成需求，2025 年 9 月），以及 Extra
              Points 的 Matt Brown（相比 Substack，在 Beehiiv 上每年节省 $25,000+ 费用）。10% 的 “Substack Tax” 会随着创作者收入扩大而加速离开激励。强制
              Apple IAP（2025 年 8 月）又增加摩擦，因为它阻止 iOS 订阅者数据携带到 Stripe；这是结构性 lock-in 机制，Dataconomy 将其描述为可预期的“取得控制 → 增加依赖 →
              提高抽成率”模式。积极面在于，30%+ 付费订阅来自 Substack 网络；对于无法在别处分发出同等效果的创作者，平台发现基础设施是真实的留存工具。
