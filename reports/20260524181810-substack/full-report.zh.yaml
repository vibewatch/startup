      - number: '6.6'
        title: 图表
        blocks:
          - type: callout
            title: Recommendations 网络与高互动读者基础构成持久获客优势
            body: >
              Substack 的 Recommendations 网络驱动 30%+ 的所有付费订阅；部分创作者报告，新订阅者中有 78% 来自其他 Substack newsletter 推荐。再加上 44%
              平均邮件打开率（是 20–22% 行业基准的两倍）、付费订阅者互动度为免费订阅者 3 倍，以及 iOS app 基于 700,000+ 条评论获得 4.86/5
              评分，平台对已经参与其中的读者具备真正的留存基础设施。2025 年 3 月达到 5 million 付费订阅里程碑，2025 年作者总收入达到 $450
              million，说明该模式已经在有意义的规模上成立。对头部创作者——Heather Cox Richardson（2.9M 订阅者）、Lenny Rachitsky（~1.2M）、Bari
              Weiss（100,000+ 名付费订阅者，$8/month）——而言，平台已经可证明地支持独立媒体职业达到机构级收入水平。
            calloutType: strength
