      - number: '1.2'
        title: 创始人、领导层与资本基础
        blocks:
          - type: paragraph
            body: >-
              即便公开治理细节不多，可靠来源中的创始人叙事仍保持一致。Betakit、Y Combinator、行业画像和主要融资报道都把 Chris Best、Hamish McKenzie 和 Jairaj Sethi
              列为创始三人组；Best 仍任 CEO，McKenzie 仍是能见度很高的对外联合创始人和政策声音。Best 与 Sethi 的 Kik 和 Waterloo 背景值得注意，因为它说明 Substack
              的根不只在出版业，也有一部分来自消费互联网产品构建。公开融资记录比董事会结构清楚得多。2025 年 7 月，Substack 宣布 $100 million C
              轮，TechCrunch、Axios、Variety、Hollywood Reporter、Silicon Republic 和 BetaKit 对轮次规模与约 $1.1 billion
              的投后估值基本一致。报道也大体指向领投方 BOND 和 The Chernin Group，Andreessen Horowitz
              以及一批名人和战略投资者参与。仍然不够可见的部分同样重要：公开来源没有给出完整的现任董事会名单、准确持股比例、清算优先权，或有清晰来源的 2026
              年员工数。也就是说，从创始人与融资层面看，公司容易定位；但仅靠公开证据，还不足以支撑机构级治理尽调。
