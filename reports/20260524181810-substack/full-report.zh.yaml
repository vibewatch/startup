      - number: '2.5'
        title: 采用约束
        blocks:
          - type: paragraph
            body: >
              最具结构性的采用约束，是 Substack 的 10% 平台费；规模做大后，这笔费用会变得惩罚性。订阅收入为 $10,000 per month 的创作者，仅平台费每年就约为 $12,000，还未计 Stripe
              处理成本；相比之下，beehiiv 或 Ghost 的收入抽成为 $0（两者改收固定 SaaS 费用）。在 $1,000 per month 收入水平，Kit 的 3.5% + $0.30 捆绑费率实际上比
              beehiiv 的 $49/month 计划更便宜；但一旦月收入超过 $500，Substack 的抽成率在所有收入层级都是同类最差。费用比较已广为人知：MWM Intelligence 报道，2026 年 5
              月出现知名创作者外流，The Ankler、The Rose Garden Report 和 Extra Points 都公开把 “Substack Tax” 列为迁往 Ghost、beehiiv 或
              Passport 的主要原因。


              第二个主要约束是 Apple 的应用内购买要求。自 2025 年 8 月起，Substack 要求所有开启支付的刊物提供 Apple IAP 系统。任何通过 iOS 应用购买的订阅，Apple 抽取
              30%（一年后降至 15%）。Substack 的应对方式是自动抬高 iOS 应用价格，以保住创作者到手收入——实际上把成本转嫁给读者。beehiiv CEO Tyler Denk
              分析过一个更重要的长期问题：Apple 管理的订阅会把计费关系从作者的 Stripe 账户中拿走，使创作者离开 Substack 时无法可携迁移付费订阅者到其他平台。这是设计上的锁定，并已引发
              TechCrunch 和 Dataconomy 的反向报道。Epic v. Apple 裁决允许的、仅美国适用的外部支付链接变通路径，只能部分缓解美国创作者的问题，并不适用于国际市场。


              订阅疲劳正在成为需求侧约束。2026 年，41% 的消费者表示有订阅疲劳；普通美国人持有 8.2 个活跃订阅，同时低估自己的月支出 2.5×。付费通讯流失率已上升约 23%，付费通讯订阅的获客成本自 2021
              年以来上升约 67%。付费通讯月均流失约为 4%，意味着拥有 1,000 名付费订阅者的通讯每月必须新增 40 名订阅者才能维持不变。beehiiv 自有数据显示，其平台上通讯的付费年流失率为
              50%，说明整个品类存在显著自愿取消行为。HubSpot 调查发现，55% 的通讯专业人士认为，到 2030 年赚取通讯收入会明显更难。


              切换和迁移摩擦真实存在，但正在下降。所有平台在技术上都可以导出订阅者列表，但创作者档案、历史帖子、SEO 和已经嵌入读者习惯的使用方式会制造惯性。Apple 管理的订阅会切断支付关系，进一步加剧迁移摩擦。来自
              0% 抽成 SaaS 工具的竞争会加剧：beehiiv 为 $43/month 且 0% 收入抽成，Ghost 为 $29/month 且 0% 抽成，Kit 月费为 $0（每笔交易
              3.5%），只要创作者每月订阅收入超过几百美元，它们的单位经济账都明显优于 Substack。
