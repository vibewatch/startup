  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块清单
        blocks:
          - type: paragraph
            body: >
              Substack 是一个订阅媒体平台，让独立作者、记者、播客和视频创作者直接向订阅者发布内容，并通过付费订阅变现。平台核心产品是一套整合式发布工具，在单一 publication dashboard
              下承载六种内容形态：电子邮件 newsletter（最早也是主导格式）、Notes（短内容社交信息流）、Chat（面向付费订阅者社群的 threaded
              messaging）、播客与音频托管、实时视频与音频直播，以及视频点播帖。免费和付费订阅者都可以访问这些格式，创作者按帖子或栏目控制付费墙位置。平台以全托管托管服务运行——创作者获得一个
              [slug].substack.com URL，也可一次性支付 $50 叠加自定义域名；邮件由 @substack.com 发件域发送。移动端触达靠原生 iOS 和 Android app 承接；截至 2026
              年 5 月，两端合计超过 700,000 条应用商店评论，评分均高于 4.8/5。产品设计追求低摩擦上手，发布无需代码；Substack 不收月度平台费，只在创作者产生付费收入时抽取订阅收入的 10%。截至
              2026 年初，Substack 报告全平台付费订阅超过 5 million；其 Recommendations 网络称，超过 30% 的付费订阅者转化由该网络驱动。
