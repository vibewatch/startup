      - number: '6.3'
        title: 具名创作者证明与生产结果
        blocks:
          - type: paragraph
            body: >
              Substack 最有说服力的客户证据，是一批知名创作者已经在平台上建立了可观的付费受众。Heather Cox Richardson 的 “Letters from an American”
              按订阅者数是平台最大 publication，总订阅者 2.9 million；Lenny Rachitsky 的 “Lenny's Newsletter” 约有 1.1–1.2 million
              订阅者，并被多个第三方排行榜描述为全球领先的商业 newsletter。由前 New York Times 编辑 Bari Weiss 创办的 The Free Press 拥有 750,000
              名总订阅者，其中超过 100,000 名以 $8/month 付费——截至 2024 年 8 月，这是 Substack 收入最高的 publication。The Bulwark 在六个 publication
              中拥有 39,000 名付费订阅者和 283,000 名免费订阅者；Zeteo News（Mehdi Hasan）在 2024 年 2 月上线后数月内报告 20,000 名付费订阅者和 217,000
              名免费读者。这些具名部署都属于生产级、商业活跃的 publication，拥有真实受众并产生经常性收入。G2 和 TrustRadius 评论（均访问于 2026 年 5
              月）中的创作者满意度反复强调易用性、内容所有权和无缝支付集成。具体 G2 评论称该平台是“最好的社交网络”，具有“出色的观点多样性”；TrustRadius
              评论则强调，无需技术技能即可拥有内容，是非开发者作者的决定性差异点。About 页 testimonials 中，一名创作者说自己“从未与阅读自己作品的人建立过这种一对一关系”——这与 Substack
              作为基于信任的直连受众平台的定位一致。Apple App Store listing 评论提供了额外客户证明信号：按 MWM 数据，评分数超过 700,000，评分为 4.86/5。
