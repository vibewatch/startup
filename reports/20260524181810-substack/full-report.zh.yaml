  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
    rows:
      - - 建议
        - 观望 — 当前 $1.1B 价格下，不建议以财务回报为目标入场
        - 24.4x ARR 倍数 vs. 5.8x M&A 中位数；基础情形退出价值低于入场价；无审计财务报表
      - - 置信度
        - 低至中 — 私营公司；所有经营指标均为第三方估算
        - 2021 年后没有审计报表；Series C 的 Form D 尚未确认；未披露股权结构表
      - - 风险评级
        - 高 — 创作者流失加速，竞争费率施压，倍数压缩风险较高
        - 2025 年约 3,000 名创作者离开；beehiiv 预计 2026 年收入 $50M；上市 SaaS 为 3.8–4x
      - - 估值立场
        - 相对可比公司偏贵；只有按 Series C 条款把它当作风险成长押注，才说得通
        - 可比创作者经济软件为 5.8x ARR；上市 SaaS 中位数 3.8–4x ARR（2026Q1）
      - - 决策含义
        - 跟踪 ARR 增长、创作者留存、广告收入和市场倍数走势
        - 若入场估值降至 $600–750M（15–17x ARR），且拿到审计财务和留存证据，再重新评估
    notes: 来源：Sacra（2025 年 7 月）、TechCrunch、BOND/Chernin 新闻稿、SEC EDGAR；所有数字均为估算或来自二手来源。
  - id: TV002
    title: 投资论点 / 反方论点表
    columns:
      - 论点
      - 证据
      - 哪些情况会改变判断
    rows:
      - - 正方论点：创作者经济结构性增长，给公司留下长跑道（Goldman Sachs 预计 $250B→$480B，至 2027 年）
        - Goldman Sachs 创作者经济研究；ChannelCore 2026 年统计；22.5% CAGR
        - 创作者经济增速放缓至 10% CAGR 以下，或订阅模式被广告资助的免费平台冲击
      - - 正方论点：5M+ 付费订阅者和 20M+ MAU 带来读者侧网络效应，单纯工具型竞争对手难以复制
        - TechCrunch、Axios、Backlinko 确认 5M 付费订阅者（2025 年 3 月）；50+ 名创作者年收入 $1M+
        - 付费订阅者数停滞；头部创作者出走，削弱留存创作者的发现价值
      - - 正方论点：经验丰富的投资人组合（BOND、a16z、Chernin）提供战略和运营支持
        - Hollywood Reporter、TechCrunch；Mood Rowghani 代表 BOND 进入董事会；Chernin 具备媒体经验
        - 关键投资人减少参与；降价轮或契约违约释放投资人担忧信号
      - - 反方论点：与 0% 抽佣的 SaaS 竞争对手相比，10% 抽佣率在规模化后难以持续
        - Sacra 可比分析；beehiiv 在约 200 名付费订阅者时与 Substack 的成本打平
        - Substack 推出创作者可选定价或混合收费模式，留住高 GMV 创作者
      - - 反方论点：创作者出走加速——2025 年约 3,000 名创作者离开；The Ankler、Extra Points 等知名账号在列
        - MWM 2026 年 5 月；U.S. News/Reuters（2026 年 1 月）报道 beehiiv 每七名新作者中就有一名来自 Substack
        - 净新增创作者转正；头部 GMV 创作者留存率被公布并改善
      - - 反方论点：24.4x ARR 倍数没有任何同规模创作者经济可比公司支撑
        - Quartermast 中位数 5.8x；上市 SaaS 2026Q1 为 3.8–4x；beehiiv 为 7–8x；邮件简报并购为 2–4x
        - 公开市场把创作者经济订阅基础设施重估至 15x+；IPO 证据显示可超过 24x
    notes: 来源：Sacra、Crunchbase、multiples.vc（2026 年 5 月）、Windsor Drake（2026Q1）、Quartermast/Netinfluencer（2025）。所有倍数均为估算。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - ARR 假设（2027）
      - 退出倍数
      - 退出企业价值
      - 关键假设
      - 概率信号
    rows:
      - - 乐观（20–25%）
        - $90–100M（从 $45M 基准起，CAGR 30%+）
        - 15–18x ARR（平台网络效应溢价）
        - $1.35–1.8B（较 $1.1B 入场估值上行 23–64%）
        - 广告产品跑通（年化收入 $15M+）；创作者留存企稳；国际订阅者增长加速
        - 需要 ARR 持续增长 30%、广告变现成功、退出倍数维持溢价——若没有审计证据，三项都未确认
      - - 基准（45–50%）
        - $65–70M（维持 22% CAGR）
        - 12–15x ARR（高于并购中位数，低于 SaaS 高峰）
        - $780M–$1.05B（相对 $1.1B 入场持平至 -5%）
        - 当前增长率守住；广告带来适度收入；创作者流失受控；退出给战略买家
        - 最可能的情景；财务回报买方面临持平至小幅亏损；优先股结构可回收，但普通股上行有限
      - - 悲观（25–35%）
        - $45–55M（<15% CAGR；停滞）
        - 7–10x ARR（并购中位数或更低）
        - $315–550M（相对 $1.1B 入场亏损 50–71%）
        - Beehiiv 拿下 20%+ 中腰部创作者；广告试点失败；Apple IAP 压低创作者经济账；估值倍数继续压缩
        - 清算优先权结构先吃掉前 $200M；普通股严重受损；可能需要降价轮
    notes: 来源：Sacra（2026 年 1 月展望）、Goldman Sachs 创作者经济报告（2026）、beehiiv State of Newsletters 2026；仅为估算。
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >
        Covers directly comparable private creator economy platforms, adjacent public SaaS benchmarks, and notable M&A
        transactions from 2025; does not enumerate every SaaS company.
    columns:
      - 可比对象
      - 指标
      - 数值
      - 隐含倍数
      - 为何可比
      - 局限
    rows:
      - - Patreon（私营，创作者平台）
        - $179M 收入（2025，Sacra）；估值 $4B
        - $4B 估值 / $179M ARR = 22.3x
        - 22.3x ARR
        - 最接近的直接可比对象——创作者订阅平台，抽佣率模式相似
        - 收入规模为 Substack 的 4x；2021 年估值标记（近期未重估）；创作者类别组合不同
      - - Beehiiv（私营，邮件简报 SaaS）
        - $30M ARR（2025 年 6 月，Sacra）；估值 $192–225M
        - 计算：$192–225M / $30M = 6.4–7.5x
        - 6.4–7.5x ARR
        - 最接近的直接竞争可比对象——邮件简报平台，服务同一个创作者 TAM
        - SaaS 订阅模式（非 GMV 抽佣）；收入规模更低；ARR 增长路径更快（预计 2026 年翻倍至 $50M）
      - - 创作者经济软件并购中位数（Quartermast 2025）
        - 81 笔交易；区间 3.2–10.7x；中位数 5.8x
        - 按 $45M ARR 以 5.8x 计算，Substack 隐含估值 $261–481M
        - 5.8x ARR（并购中位数）
        - 创作者经济软件平台的行业并购市场基准
        - 并购倍数反映控制权溢价，不等同少数股权风险投资定价；Substack 规模大于中位数交易
      - - Vimeo（2025 年被 Bending Spoons 收购）
        - $417M FY2024 收入；收购价 $1.38B
        - $1.38B / $417M = 3.3x 收入
        - 3.3x 收入
        - 视频创作者平台基础设施；近期最大创作者经济并购基准
        - 商业模式不同（B2B SaaS）；收购时收入下滑；属于困境倍数语境
      - - 上市 SaaS 中位数（Windsor Drake/Aventis，2026Q1）
        - SaaS Capital Index 约 3.8–4x EV/ARR；上市 SaaS 中位数
        - Substack 24.4x 对比 3.8–4x 上市中位数 = 6x 溢价
        - 估值倍数：3.8–4x EV/ARR
        - 同阶段软件业务的全市场上市 SaaS 基准
        - 公开市场流动性溢价；上市公司有审计财务和治理；不可直接比较
      - - 上市横向 SaaS（Multiples.vc，2026 年 5 月）
        - EV/Revenue 中位数 2.2x；设计 / 工程软件 4.9x
        - Substack 24.4x 对比横向 SaaS 2.2x = 11x 溢价
        - 估值倍数：2.2x EV/Revenue
        - 非专用 SaaS 的行业层面基准；可作有用下限
        - 横向 SaaS 逐渐商品化；Substack 具备平台 / 市场属性，不同于纯 SaaS
      - - Captiv8（2025 年被 Publicis 收购）
        - $32M 净收入；收购价 $175M
        - $175M / $32M = 5.5x 收入
        - 5.5x 收入
        - 创作者营销平台基础设施；印证创作者经济并购中位数
        - 影响者营销与订阅出版不同；收购进入大型企业买方语境
    notes: 来源：章节分析；退出价值来自 ARR 预测 × 可比倍数。所有数字均为估算；入场价格 = 2025 年 7 月 Series C 的 $1.1B。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV005
    title: 论点失效与止损触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 增长同比放缓至 15% 以下
        - Sacra 或同等估算显示 ARR 增长连续两个半年低于 15%
        - 基准情景坍向悲观；退出倍数压缩；$1.1B 入场价无法收回
        - 重新评估持仓；加快二级市场退出，或探索战略出售流程
      - - 高 GMV 创作者集中流失
        - 前 10 大邮件简报中任一迁往竞争平台（合计年 GMV 约 $40M）
        - 加速其余头部创作者重新评估；GMV 与 ARR 直接受冲击；释放声誉信号
        - 启动创作者留存尽调；评估 GMV 集中度；考虑减仓
      - - 广告产品发布延迟或放弃
        - 到 2026Q4 仍未宣布广告收入产品（距 2025 年 12 月试点 18 个月）
        - 核心抽佣模式无法加杠杆；0% 抽佣竞争对手带来的费率压力没有缓冲
        - 在不计广告贡献的情况下重做基准情景；下调退出倍数
      - - 低于 $1.1B 估值的后续优先股融资（降价轮）
        - 任何披露的融资事件，投后估值低于 $1.0B
        - Series C 清算优先权结构触发反稀释；说明核心论点落空；声誉和财务双重受损
        - 立即判定论点失效；评估保护性条款；测算资本重组条款
      - - 多个可比 IPO 或并购倍数明显低于 24x ARR
        - 2026 年两个或以上可比创作者 / 媒体平台上市或被收购，倍数低于 10x ARR
        - 市场把 Substack 重估到可比水平；外部二级市场投资人下调 $1.1B 估值
        - 重新评估持有论点；在倍数进一步压缩前设计现实的二级出售路径
    notes: 来源：Forge Global IPO tracker、Reuters/Bloomberg、公司公告；概率估算仅为分析师判断。
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - Series C Form D SEC 备案
        - 截至 2026 年 5 月，EDGAR 上未确认 2025 年 7 月 Series C 的 Form D；已确认 2021 和 2023 年修订
        - 没有 Form D，就无法从公开来源验证清算优先权条款、参与 / 非参与结构和证券类别
        - 向公司索取；检查 EDGAR CIK 0001783191 是否有 2025 年 7 月之后的 Form D 备案
      - - 审计财务报表
        - 2021 年后未披露 GAAP 审计财务；2022–2026 年所有收入和利润率数字均为分析师估算
        - 没有审计报表，就无法独立验证 ARR、毛利率、运营费用或现金流为正的说法
        - 将管理层提供 FY2023、FY2024 和 FY2025 审计财务作为投资条件
      - - 创作者留存与净收入留存指标
        - 平台层面的创作者流失率、净收入留存（NRR）或 cohort 分析均未公开
        - 头部创作者的 GMV 集中度让留存成为 ARR 路径最关键驱动；没有 NRR，增长无法验证
        - 索取 GMV cohort 分析、按收入层级拆分的创作者留存，以及按获客渠道拆分的订阅者流失
      - - 股权结构表与期权池构成
        - 任何融资轮均未披露股权结构表、期权池比例或反稀释结构
        - 没有完全摊薄股数和期权池，就无法建模普通股回报；清算权悬顶只是估算，尚未确认
        - 索取 Series C 交割时的完全摊薄股权结构表、ESOP 池规模和所有优先权条款
      - - 广告收入年化额与试点经济账
        - 2025 年 12 月原生广告试点已确认，但未披露收入贡献、抽佣结构或规模化时间表
        - 广告是 ARR 增速超过自然订阅路径的主要杠杆；没有证据，乐观情景只是推测
        - 索取 2026Q1 和 Q2 广告收入、广告主数量、抽佣结构和路线图
    notes: 来源：章节分析；条件反映截至 2026 年 5 月公开可得证据。
