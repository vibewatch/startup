      - number: '2.3'
        title: 创作者买方 / 用户 / 付款方分层
        blocks:
          - type: paragraph
            body: >
              Substack
              的市场由买方、用户、付款方合一的结构塑造：在自助式核心业务里，创作者同时是买方（选择平台）、用户（写作和发布）和间接付款方（通过收入分成，而不是订阅费付费）。读者才是直接付款方，他们为创作者收入买单。这与
              SaaS 市场不同；在 SaaS 中，买方、用户和预算所有者通常是不同角色。它对获客、销售和流失分析影响很大：创作者留在 Substack 的动机主要是经济账（10%
              费用相对于替代方案），而读者的动机是编辑价值（具体刊物是否值得付费）。


              五类主要创作者定义了 Substack 用户基础。独立写作者和独立记者——主要是前媒体人或现役媒体人——构成平台最初、文化能见度也最高的队列。约 30% 的 Substack
              写作者来自新闻业背景。这个群体看重编辑自由、受众所有权和直接变现，付费转化率往往高于平台平均。第二类是垂直内容专家：金融分析师、软件工程师、本地新闻运营者和主题专家。由于受众有明确的职业或财务理由付费，他们能达到
              4–10% 的转化率，高于平台 3% 的平均水平。科技通讯以 8% 转化率领先。媒体品牌——小型编辑团队、数字原生出版方，以及偶尔上线 Substack
              垂直频道的传统品牌——构成第三类。这些用户寻求受众增长、通讯专用分析和多作者工作流；Substack 支持这些能力，beehiiv 和 Ghost 等竞争者也提供。第四类是播客主：Substack
              的播客网络已增长到 10,000 档节目，五分之一刊物提供音频内容。第五类是混合型多媒体创作者，他们混合文字、音频和短内容社交，通常把 Substack 当作多平台策略中的一层变现工具。


              采用路径因分层不同而变化。对新的独立写作者来说，Substack 通常是第一个付费发布工具——启动摩擦低、没有前置成本，并能通过 Notes 和推荐获得发现。对从机构雇主转出的成熟媒体人来说，Substack
              是带网络效应的收入平台。对订阅收入超过 $10,000 per month 的规模化创作者来说，10% 费用会成为主要迁移动因，beehiiv、Ghost 或独立平台都变成严肃替代方案。截至 2026 年 4
              月，近 100,000 个刊物在 Substack 上赚钱，但中位创作者年收入约 $4,000——这个数字说明，多数变现创作者是兼职或补充收入者，而不是全职业务。前四分位收入超过 $16,000，50+
              个刊物年收入超过 $1 million。
