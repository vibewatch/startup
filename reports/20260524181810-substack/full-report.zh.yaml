      - number: '3.4'
        title: 切换成本、锁定、多栖与护城河韧性
        blocks:
          - type: paragraph
            body: >
              Substack 的切换成本真实存在，但不对称：对创作者来说，它低于公司发现护城河暗示的水平；但在实践中，又因为支付关系问题而更高。邮件列表可携带是真正对创作者友好的功能——Substack
              允许完整导出订阅者邮箱，包括付费订阅者。不过，导出的付费订阅者列表不包含 Stripe 计费关系；创作者必须在新平台上手动让付费订阅者重新登记，这会带来读者摩擦、部分流失和沟通成本。行业说法显示，平台迁移后有
              10–30% 的付费订阅者不会重新订阅；对任何拥有大型付费基础的刊物来说，这都是有意义的收入成本。分析历史、评论档案和 Substack Notes 互动不会迁移；推荐网络带来的增长贡献也不会跟随创作者。


              网络效应是部分锁定机制。付费订阅者中有 30%+ 来自 Substack 内部网络的创作者，实际上是在通过 10%
              费用为持续接入这个发现渠道付费。离开意味着失去网络驱动订阅者的持续流入——这是一项持续成本，而不是一次性切换成本。它制造了结构性不对称：新创作者或成长中创作者更容易被网络依赖锁住；而大型成熟创作者（拥有
              50,000+ 订阅者和稳定付费基础）更可能发现费用经济账压过网络价值，从而切换平台。


              到 2026 年，创作者多栖越来越常见。主流观察模式是把 beehiiv 作为主平台（为了经济账和分析），同时保留一个次级 Substack 存在，用于发现和网络触达。一个有记录的 50,000 订阅者迁往
              beehiiv 的案例报告，借助 beehiiv 推荐系统实现 30% 订阅者增长，同时承认 Substack 网络“对可发现性更有价值”。这种多栖行为削弱了 Substack
              的锁定，但也部分保留了它的网络价值主张。读者多栖更少见，但并不罕见：深度互动的通讯读者往往会通过邮件跨平台跟随单个写作者，从而降低自己对任何一个平台网络的暴露。


              护城河韧性评估：Substack 的发现网络是它最持久的护城河，但它不是经典平台网络效应，即价值随用户数自我强化地扩大。这个网络由编辑策展和算法驱动；它对任何单个创作者的价值取决于 Substack
              的策展选择和推荐引擎质量，而两者都可能退化或被扰动。beehiiv 的轨迹——$30M ARR、同比增长 100%+、140,000 份通讯、专门的增长基础设施，以及 2026 年 4
              月上线播客——代表最可信的近期商品化威胁。Ghost 永久 0% 费用和开源架构，为愿意自托管的创作者提供结构性底线，限制了 Substack
              在费用维度的定价权。功能收敛、高收入创作者对平台费敏感，以及信任与安全争议叠加在一起，形成一种局面：Substack 的护城河在早期创作者群体中稳固，但在高价值尾部脆弱。
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
