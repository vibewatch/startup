  - id: FU001
    title: 客户旅程地图
    type: journey-map
    insight: >
      创作者先零成本激活账户，再爬坡变现，随后会遇到 10% 费用交叉点；到那时，固定费用竞争对手在财务上更有吸引力。读者从免费发现转向 App
      内互动，再转为付费订阅；订阅多个简报会加深平台留存。离开发生在扩张阶段：创作者达到规模后，费用或控制权限制开始显现。
    data:
      items:
        - id: discovery
          label: 发现
          actor: 创作者 / 读者
          description: |
            创作者：通过新闻业裁员、SEO、同行推荐或社交媒体听说 Substack。读者：通过 Substack App 推荐、社交分享或搜索发现具体简报——平台称 App 内每天有 1 million+ 次帖子发现。
          channels:
            - 社交媒体分享
            - Substack App 推荐
            - 搜索 / SEO
            - 新闻业裁员网络效应
        - id: activation
          label: 激活
          actor: 创作者 / 读者
          description: |
            创作者：以零前期成本上线免费简报，开始积累免费订阅者。读者：免费订阅一个或多个简报；截至 2026 年 4 月，活跃订阅总量 50M+（绝大多数免费）。
          channels:
            - Substack 网页注册（零费用）
            - 读者 iOS / Android App
            - 仅邮件免费订阅
        - id: monetization
          label: 变现 / 购买
          actor: 创作者开启付费；读者转化
          description: >
            创作者：按自选价格开启付费层级（最低 $5/月或 $50/年）；Substack 对所有付费收入抽取 10%。读者：通过网页结账（Stripe）或 iOS IAP（Apple 管理，贵约
            30%）从免费升级到付费。平台称 30%+ 付费转化来自自身网络。
          channels:
            - Substack Recommendations 网络
            - Notes 社交信息流发现
            - Stripe 网页结账
            - Apple IAP（iOS，自 2025 年 8 月起强制）
        - id: engagement
          label: 深度互动
          actor: 读者 / 创作者
          description: |
            留存下来的付费订阅者互动率是免费订阅者的 3×；平均打开率 44%。创作者保持发帖节奏；社区功能（Chat、评论）加深受众关系。平台上，平均读者每周订阅 5 份简报。
          channels:
            - 邮箱收件箱（44% 打开率）
            - Substack iOS / Android App（移动应用）
            - Chat / 评论线程
            - 直播视频
        - id: expansion-or-departure
          label: 扩张或离开
          actor: 创作者（达到规模）
          description: >
            年收入 >$100K 的成功创作者，每年面对超过 $10K 的 Substack 费用。固定费用竞争对手（Ghost、Beehiiv）在财务上变得有吸引力。已记录离开案例包括：The Ankler（150K+
            付费订阅者）、Alison Roman（343K 订阅者）、Matt Brown（在 Beehiiv 每年节省 $22K）。部分创作者仍为网络发现价值留在平台。
          channels:
            - 迁移至 Ghost / Beehiiv
            - 退出 Substack 网络（失去推荐）
            - 自建平台（The Ankler → Passport）
    sourceRefs:
      - SU001
      - SU002
      - SU009
      - SU011
      - SU012
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    insight: >
      Substack 创作者漏斗掉队很陡：从所有注册发布者，到产生任何收入的发布者，再到达到 1,000 名付费订阅者可持续门槛的发布者，最后到头部收入者。约 70%
      的活跃简报没有任何付费收入，说明变现成功高度集中在少数创作者手中。
    data:
      items:
        - label: 活跃出版物（免费 + 付费）
          value: 100
          description: 估计截至 2024 年，Substack 注册出版物为 2+ million 份；只有一部分仍在活跃发布
