      - number: '5.3'
        title: 信任、安全、安保与隐私
        blocks:
          - type: paragraph
            body: >
              Substack 的内容政策写入公开可访问的 guidelines（substack.com/content），并于 2026 年 3 月 19 日更新，加入针对英国 Online Safety Act
              和澳大利亚 Online Safety Act 的附录。禁止内容包括骚扰、doxxing、煽动暴力、CSAM 和垃圾信息。隐私治理由单独政策维护（substack.com/privacy，2026 年 5 月
              14 日更新），新增对 NCMEC 共享 CSAM 检测数据的明确承诺，并为 GDPR 和 CCPA 数据主体请求设定 30 天响应时限。订阅者邮箱地址和姓名会共享给 publication
              所有者，但电话号码和支付详情不会共享。本章证据窗口内最重大的安全事件是 2026 年 2 月数据泄露：Substack 于 2026 年 2 月 3–5 日披露，约 700,000
              个用户账户被入侵，邮箱地址和电话号码暴露，但密码和支付信息未暴露。网络安全分析师报告称，入侵约四个月未被发现（将泄露起点推至 2025 年 10 月左右），显示检测缺口很大。CEO Chris Best
              公开致歉，Substack 称事件已经解决；Infosecurity Magazine 和 Forbes 独立确认了该泄露。据称，这是 Substack 继 2020 年 mass-BCC
              邮件暴露之后的第二起安全事件。Substack Defender 项目为面临外部威胁的创作者提供法律支持和平台倡导。创作者支持采用分层模式：chatbot
              分流，加上面向付费创作者的专门人工回复。第三方评论者和创作者论坛记录的持续产品抱怨，集中在 Apple IAP 价格加价和有限的数据可携带性。
