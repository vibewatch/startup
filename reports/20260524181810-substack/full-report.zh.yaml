      - number: '3.3'
        title: 平台能力、分发与信任姿态
        blocks:
          - type: paragraph
            body: >
              2026 年，通讯平台之间的产品能力差异明显，但正在收敛。相比 beehiiv 和 Kit，Substack 在自动化、分群和分析深度上最弱；它在内置发现和社交功能上最强。自动化上的竞争差距有实质影响：Kit
              已经搭建了可视化拖拽自动化引擎，具备条件逻辑、基于标签的分群和复杂多步序列，Substack 和 beehiiv 都尚未追上。beehiiv 在增长基础设施上领先——推荐计划、Boosts
              联合注册网络、推荐网络和广告网络都是原生功能，面向那些把受众增长视为纪律化商业活动、而不是自然内容成功的运营者。Ghost 擅长
              SEO、自定义品牌和开放集成架构，但没有原生发现网络；它瞄准愿意投入资源建设自有分发的创作者。


              分发力是 Substack 最清晰的竞争优势。Substack 官方数据显示，超过 30% 的新付费订阅来自平台网络内部，渠道包括推荐、Notes 和算法发现。一位创作者报告，仅靠 Substack 推荐就获得
              2,000 名付费订阅者；独立分析按典型通讯广告费率估算，这相当于约 $10,000 的获客成本。beehiiv 的 Boosts 网络提供付费联合注册（通常每位订阅者 $1–3）和广告网络（赞助内容 CPM 为
              $2–5）。这些是需要主动投入的增长机制，不是被动发现。Ghost 和 Kit 没有等价的网络发现机制；两者都要求创作者自己拉外部流量。


              各平台在信任和内容审核姿态上差异很大，这对 Substack 构成实质声誉风险。Substack 内容指南最后更新于 2026 年 3 月 19
              日，禁止可信的身体伤害威胁，以及基于受保护群体煽动暴力的内容，但明确拒绝因刊物持有极端观点而取消变现，理由是言论自由原则。这种放任姿态反复引发争议。一次推送通知事件中，Substack
              算法推广了一份带有纳粹图像的通讯，引发一波创作者离开和声誉损害。Casey Newton（Platformer）因为公司未能一贯处理反犹内容而离开
              Substack。数百名写作者分别签署公开信，一边要求更严格审核，另一边捍卫平台中立。Mashable 记录的 2024 年多名写作者离开，反映出一个延续到 2026 年的模式。beehiiv、Ghost、Kit
              和 Mailchimp 没有可比的信任与安全争议，这为机构出版方、品牌或记者评估 Substack 与替代方案时制造了差异化风险因素。截至 2026 年，Substack 联合创始人 Hamish
              McKenzie 反对 UK Online Safety Act，显示平台无意在外部压力下实质改变审核姿态。


              多格式能力是 Substack 为留住创作者投入的方向。Substack 在一个平台内支持文字帖子、播客、直播视频（Substack Recording Studio）、订阅者聊天和评论线程。beehiiv 在
              2026 年 4 月上线原生播客托管，且 0% 收入抽成，直接竞争 Substack 的音频产品。Ghost 支持富媒体嵌入、多通讯分群和强 API，但不原生托管播客或直播视频。Kit 和 Mailchimp
              以文本邮件为先，多媒体发布能力有限。
