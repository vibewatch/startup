  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与公开增长信号
        blocks:
          - type: paragraph
            body: >
              Substack 的收入引擎简单，且有公开材料支撑：平台不收前置费或月费，而是对每笔付费订阅交易固定抽取 10%。负责支付处理的 Stripe 另收每笔交易 2.9% + $0.30，并加收 2024 年 7
              月引入的 0.7% 循环账单费。按 $10/month 的订阅价格计算，综合费率约为 16.6%，创作者约留下 $8.34。Substack 官方帮助中心明确确认这一结构。因为模型纯粹按交易计费，Substack
              收入随 GMV（平台上的创作者订阅总收入）直接扩张，Substack 正好赚取这条 GMV 线的 10%。独立分析机构 Sacra 估计，平台 GMV 在 2025 年达到约 $450 million，高于
              2024 年的 $370 million 和 2023 年的 $300 million；这意味着截至 2025 年 7 月，Substack 估计平台收入（ARR）约为 $45 million，高于 2024
              年底的 $37 million 和 2023 年底的 $30 million。ARR Club 另行报道 2025 年 6 月达到 $45M ARR 里程碑，与 Sacra
              估计一致。这些数字来自第三方分析师估计，不是经审计结果；自 Axios 引述的 2021 年 $12 million 总收入报道之后，Substack 未再公开披露收入。支撑 GMV
              估计的牵引力指标包括：公司自己在 2025 年 3 月披露付费订阅超过 5 million（较 2023 年 2 million 增加一倍多）；Backlinko 确认报道月活订阅者为 20+
              million；Bestwriting 有来源的数字显示，截至 2026 年 4 月，全球近 100,000 个刊物正在赚钱；WorldMetrics 2026 市场报告提到 35+ million
              个活跃订阅。Substack 还在 Axios 和 Sacra 数据集中披露，50 多位个人创作者年收入超过 $1 million；Backlinko 确认前 10 大通讯合计年收入约 $40
              million。两项数据都强化了一个判断：GMV 高度集中在创作者分布的头部。按 Sacra 数据，iOS 应用带来全部付费订阅的 30% 以上，使其成为重要收入渠道，即便它同时引入 Apple IAP
              复杂性（见第 3 节）。
