companyProfile:
  summary: >-
    Substack 是一家位于 San Francisco 的创作者平台，由 Chris Best、Hamish McKenzie 和 Jairaj Sethi 于 2017
    年创立。它最初是付费通讯基础设施，后来扩展成更宽的创作者操作系统，覆盖通讯、Notes、Chat、播客、直播视频和移动应用分发。商业模式在规则上简单，也与创作者利益对齐：创作者保留订阅收入扣除支付费后的 90%，Substack
    抽取 10% 平台费用。公开增长信号真实存在：到 2025 年，平台上已有 5 million 个付费订阅；2025 年 7 月，公司以 $1.1 billion 估值完成 $100 million C
    轮。但投资判断仍受私营公司不透明度制约，关键缺口包括经审计收入、董事会结构、创作者集中度和长期队列韧性。
