      - number: '6.4'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >
              Substack 不发布平台级 NRR、GRR 或订阅者 cohort 数据，因此留存评估必须依赖代理指标。最权威的估计来自 Sacra：付费订阅年流失率约为
              50%——也就是说，创作者若想维持付费订阅基数不变，每年必须持续补回一半付费读者。这相当于月流失率约 4.2%。对一名拥有 600 名付费订阅者、定价 $8/month 的创作者来说，维持该基数需要每月新增约
              25 名付费订阅者；或者在 7% 免费转付费转化率下，每月吸引约 357 名新的免费订阅者（mazkara.studio
              分析）。留存与创作者质量、更新一致性和受众类型高度相关：科技和金融垂类的免费转付费转化率达到 8%，而平台平均为 3%（bestwriting），说明这些细分受众黏性更强，也更愿意付费。互动代理指标有利：44%
              平均邮件打开率，以及付费订阅者互动率为免费订阅者的 3 倍，说明愿意付费的读者活跃度很高。MWM 2026 年 5 月数据显示，Substack iOS app 基于约 700,000 条评论获得 4.86/5
              星评分；Reader app 持续下载量也间接证明读者侧留存较强。不过，平台级流失是结构性风险：newsletter 层面年订阅流失率达到
              50%，会形成“跑步机”动态，迫使创作者持续获客，否则收入下滑——这也导致有记录的创作者 burnout 和平台流失。读者侧方面，Substack 没有全平台唯一订阅者数，外部无法区分只订阅一个
              newsletter 的读者（高风险）与订阅五个 newsletter 的读者（即使一个 newsletter 流失，仍留在平台上，整体流失风险更低）。
            claimRefs:
