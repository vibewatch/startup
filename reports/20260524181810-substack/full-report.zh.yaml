      - - 邮件 ROI：每投入 $1 回报 $36–44
        - 驱动因素
        - 当前
        - 支撑创作者 / 品牌继续投入 newsletter 发布基础设施
        - 验证收件箱竞争加剧后 ROI 是否仍能守住
      - - 创作者经济以 22–23% CAGR 增长
        - 驱动因素
        - 中期（2–4 年）
        - 创作者变现工具 TAM 扩大，newsletter 平台也受益
        - 监测创作者经济支出中流向 newsletter 平台的占比
      - - 付费订阅 GMV 同比增长 138%（beehiiv，2024–2025）
        - 驱动因素
        - 当前
        - 验证付费 newsletter 变现近期顺风很强
        - 确认增速可持续，还是 COVID 后正常化效应
      - - Newsletter 广告市场 2026 年达 $2.8B，同比增约 25%
        - 驱动因素
        - 中期
        - 广告提供并行变现路径；beehiiv 在抓，Substack 则淡化
        - 评估 Substack 避开广告的策略是否让增长输给竞争对手
      - - 亚太邮件市场增速最快，CAGR 为 11–14%
        - 驱动因素
        - 长期（4 年以上）
        - 存在地域扩张机会；Substack 创作者已有 41% 在北美以外
        - 衡量国际创作者的变现和转化率，并与美国基准对比
      - - 订阅疲劳：41% 消费者称有此感受（2026）
        - 约束
        - 当前
        - 限制每位读者可承受的付费 newsletter 总订阅数上限
        - 跟踪流失率、每位读者平均订阅数和取消触发因素
      - - 付费 newsletter 月流失率约 4% / 年流失率 50%
        - 约束
        - 当前
        - 高替换率推高 CAC 负担；自然增长优势对创作者经济账至关重要
        - 评估 Substack 平台上的净订阅增长、总新增和流失
      - - 平台费（Substack 10%）对比 0% 替代方案（beehiiv、Ghost）
        - 约束
        - 当前
        - 费用差距会推高收入创作者迁移；2026 年 5 月已出现可见出走
        - 建模创作者盈亏平衡：月收入达到多少时，迁移才划算？
      - - Apple iOS IAP 30% 费用与计费锁定
        - 约束
        - 当前
        - 提高实际总抽成率；让创作者无法迁移经 iOS 订阅建立的计费关系
        - 量化 Substack 订阅中经 iOS IAP 与网页成交的占比，评估锁定强度
      - - 付费 newsletter CAC 自 2021 年以来上升约 67%
        - 约束
        - 当前
        - 获客成本上升挤压创作者单位经济；利好内置发现的平台
        - 对比各平台订阅者获客效率（Substack Notes vs beehiiv Boosts）
      - - 迁移摩擦：Apple 管理的订阅不可携带
        - 约束
        - 当前
        - iOS 订阅建立后会阻止可迁移流失，形成平台锁定
        - 评估高收入创作者中，有多少比例的订阅者主要来自 IAP
      - - 来自 0% 抽成 SaaS 的竞争：beehiiv、Ghost、Kit
        - 约束
        - 当前
        - 成熟创作者的平台竞争加剧；Substack 仍保有新创作者发现优势
        - 按季度跟踪各平台市场份额变化
      - - HubSpot：55% 从业者称到 2030 年 newsletter 赚钱会更难
        - 约束
        - 长期
        - 释放从业者对饱和的担忧；可能表明品类成熟早于分析师乐观预期
        - 用主要平台的实际订阅增长曲线交叉验证
    notes: 驱动 / 约束判断为定性判断，基于截至 runDate 的公开研究和平台数据。时间分类（当前 / 中期 / 长期）为近似判断。
