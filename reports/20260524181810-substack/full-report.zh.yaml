      - number: '7.4'
        title: 竞争、人员与执行风险
        blocks:
          - type: paragraph
            body: >
              “Substack Tax”——平台永久 10% 收入佣金——正在规模化推动创作者流失加速。2026 年 5 月，Matt Brown 的 Extra Points newsletter（71,000
              名订阅者）迁移到 Beehiiv，估计每年节省 $25,000。知名娱乐行业 publication The Ankler 转到名为 Passport
              的新平台，理由是需要“在产品、收入和受众关系上有更大灵活性和控制权”。The Rose Garden Report 的 Sean Highkin 迁到 Ghost，并称离开后赚到“显著更多的钱”。Beehiiv
              收取固定月费（$43–$99/month），平台佣金 0%；当约 200–250 名付费订阅者每月支付 $5 时，Beehiiv 成本低于 Substack 的 10% 抽成，经济交叉点就会出现。Beehiiv
              报告 2026 年 Q1 创作者同比增长 150%，新增 ARR $4.5M，活跃创作者超过 50,000。MWM Intelligence 数据显示，截至 2026 年 5 月的 7 天期间，Substack
              iOS app 下载速度较此前 4 周平均值下降约 20%；即便总安装基数仍很大（年下载 9.7M+），也显示出一段降温期。LinkedIn Newsletters 借助 900M+
              用户的职业网络，带来近乎零摩擦的分发，对 Substack 的 B2B 和专业创作者细分构成结构性威胁。关键人风险突出：CEO Chris Best、McKenzie（communications）和
              Sethi（CTO）构成三位创始人领导集群，且没有公开披露继任计划。Best 的理念塑造了 Substack 的内容审核姿态、投资者关系和产品战略；他若离开，将引入重大不确定性。Substack
              是单产品公司——唯一移动产品是 Substack app——除了 10% 抽成外没有收入多元化。这意味着创作者流失风险与平台集中风险直接混在一起：头部创作者流失会同时降低 GMV 以及广告主 /
              网络吸引力。尽调问题包括：（1）月收入 >$10K 的 publication 在 12/24/36 个月的创作者 cohort 留存曲线；（2）收入前 100 的 publication
              的披露流失率；（3）已承诺的增长资本或 bridge facility，以确认 2026 年之后的 runway。
