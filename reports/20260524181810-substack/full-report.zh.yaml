        - label: Patreon（最近估值标记，2021 年 Series F 轮）
          value: 22.3
          note: $4B / $179M ARR — 收入规模 4x
        - label: Beehiiv（Wefunder 估值标记，2024）
          value: 7.5
          note: $192–225M / $30M ARR
        - label: 上市 SaaS 中位数（Windsor Drake，2025 年末）
          value: 6.1
          note: SaaS Capital Index，2025 年中
        - label: 创作者经济软件 M&A 中位数（Quartermast，2025）
          value: 5.8
          note: 81 笔交易；区间 3.2–10.7x
        - label: 上市 SaaS 中位数（2026 年 Q1）
          value: 3.9
          note: SaaS Capital Index Q1 2026；AI 冲击压缩倍数
        - label: 上市横向 SaaS 中位数（2026 年 5 月）
          value: 2.2
          note: Multiples.vc；横向 SaaS 板块
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      以假设的 2027 年退出为口径，给出乐观、基准、悲观情景下的企业价值区间，并用 $1.1 billion Series C 轮入场价作参照。假设为标准 1x 非参与式清算优先权；估算基于公开可得 ARR 轨迹。
    data:
      items:
        - label: 乐观情景（20–25% 概率）
          low: 1350
          mid: 1575
          high: 1800
          note: $90–100M ARR，15–18x；上行 23–64%；需要 30%+ CAGR 和广告产品跑通
        - label: 基准情景（45–50% 概率）
          low: 780
          mid: 915
          high: 1050
          note: $65–70M ARR，12–15x；相对入场持平至 -5%；优先股堆叠可收回，普通股上行有限
        - label: 悲观情景（25–35% 概率）
          low: 315
          mid: 432
          high: 550
          note: $45–55M ARR，7–10x；亏损 50–71%；清算优先权先吃掉 $200M
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      从七个投资维度给出 IC 可用评分：市场机会、平台验证、竞争护城河、单位经济、风险画像、估值纪律、证据质量。评分反映截至 2026 年 5 月的证据平衡；私有公司限制显著压低证据质量。
    data:
      items:
        - label: 市场机会
          value: 5
          note: 创作者经济 $250B+（2026）→ $480B（2027，GS 估计）；订阅驱动增长快于广告模式
        - label: 平台验证
          value: 4
          note: 5M 付费订阅（2025 年 3 月）、$450M GMV、ARR 增长 22%；2025 年 Q1 现金流转正 — 牵引力强
        - label: 竞争护城河
          value: 3
          note: 读者网络效应真实但被竞争挤压；beehiiv 以 0% 抽成快速增长；创作者出走风险
        - label: 单位经济
          value: 2
          note: 估计毛利率 90%+（平台模式）；但 10% 抽成率承受结构性压力；未披露 NRR
        - label: 风险画像
          value: 2
          note: 高：创作者集中、费率压力、Apple IAP、2026 年 2 月泄露事件、无审计数据
        - label: 估值纪律
          value: 1
          note: 24.4x ARR vs M&A 中位数 5.8x；基准情景隐含回报持平至负值；悲观情景回报 -50–71%
        - label: 证据质量
          value: 2
          note: 无审计财务；无股权结构表；Series C 无 Form D；所有 ARR/GMV 数据均为分析师估计
