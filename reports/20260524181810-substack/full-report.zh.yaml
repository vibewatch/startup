      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              通讯市场最主要的结构性增长驱动，是内容分发从平台中介转向创作者自有、直接触达受众的关系。社交平台提高算法筛选、降低自然触达后，电子邮件通讯提供了一个可预测、无算法的渠道，打开率通常达到
              38–44%，而社交媒体自然触达率约为 10%。电子邮件的 ROI 优势——每花 $1 带来 $36–44，而社交媒体为 $2.80——一直稳定，并在行业报告中反复出现。随着社交平台品牌广告 CPM 上升，以及
              GDPR、CCPA、CPRA 等隐私监管削弱第三方追踪，第一方邮件受众的结构性价值还在上升。


              第二个主要驱动是创作者经济的专业化。2026 年，全球活跃创作者超过 207 million。仅 beehiiv 上的付费通讯订阅在 2025 年就产生 $19 million，高于 2024 年的 $8
              million，同比增长 138%。2025 年在 beehiiv 上线的通讯首次产生收入的中位时间降至 66 天，说明变现基础设施正在成熟。HubSpot 的 2025 State of Newsletters
              对 400+ 位通讯专业人士的调查发现，45% 受访者预计未来 12 个月通讯利润会显著增加，25%
              报告上一年利润大幅增长。创作者经济趋势也推动收入模式从纯订阅转向混合收入：同时经营订阅、赞助、活动和数字产品的创作者，收入约为只做订阅运营者的 3×。


              第三，通讯广告市场增长会拉动平台市场。2026 年通讯广告支出估计为 $2.8 billion（高于 2023 年的 $1.6
              billion），出版方有经济动机让通讯运营更专业化，从而推动平台升级。beehiiv
              的原生广告网络和推荐市场代表相邻收入流，正在把创作者从纯订阅模式拉走，并推向全栈平台。亚太快速扩张的移动互联网基础也是一个长周期地理驱动；该地区预计将为电子邮件营销带来最快的区域增长，CAGR 为
              11–14%，而目前 41% 的 Substack 创作者已位于北美以外。
            claimRefs:
              - CM030
              - CM031
              - CM032
