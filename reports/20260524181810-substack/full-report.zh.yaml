    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与规模信号
        blocks:
          - type: paragraph
            body: >-
              Substack
              的官方材料把公司描述得不止是通讯工具：它定位成服务独立写作者、播客主、视频创作者和其他知识工作者的媒体平台与经济基础设施层。目前最清晰的表述是，创作者可以在一个产品里写作、发送、录制、直播、聊天、销售订阅并管理分析，平台只在创作者赚钱时赚钱。官方页面反复说明，创作者保留订阅收入扣除支付处理费后的
              90%，Substack 抽取 10%，这让商业模式容易解释，也直接绑定创作者收入。规模信号有分量，即便还没有完全审计。Substack 在自有页面称，平台已有 5 million 个付费订阅且仍在增长，每周有
              tens of millions 人在平台上阅读、观看和收听，超过一半的新订阅者来自内置网络，每天有 1 million-plus 篇帖子在应用内被发现，30%
              或更多付费订阅来自网络内部。这些说法重要，因为它们把 Substack
              定义为发现系统，而不只是交易结算层。产品范围也以支持这一定位的方式变宽：官方和第三方材料显示，Notes、聊天、播客、直播视频和移动应用都在加深互动，也减少创作者拼接多个外部工具的必要。
