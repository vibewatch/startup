  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与基础画像
        blocks:
          - type: paragraph
            body: >
              Substack 的客户基础是双边结构：创作者是供给侧客户，负责发布内容、建立受众；读者是需求侧客户，为内容访问付费。截至 2026 年，Substack 活跃付费创作者约为 17,000
              名产生收入的作者（至少一名付费订阅者），而总计近 100,000 个 publication 有一定收入——较 2025 年 5 月翻倍。创作者主要分为四类：（1）裁员后迁移到
              Substack、或为获得编辑自主权而迁移的独立记者和前新闻编辑室员工；（2）独立作者，包括专栏作者、分析师、散文作者、小说作者和细分领域评论者；（3）学者、公共卫生专业人士、金融分析师和科技产品经理等主题专家；（4）运营播客加
              newsletter 或视频加 newsletter 混合 publication 的新兴多格式创作者。读者侧，截至 2026 年 4 月，平台报告总活跃订阅（免费和付费）为 50 million，其中付费订阅为
              5 million——该数字代表订阅交易，不代表唯一个人，因为一个读者可能为多个 publication 付费。bestwriting.com 的 2026
              年统计汇编验证，金融、商业、美国政治、科技和健康是收入最高的五个内容垂类。地域上，Substack 明显偏向英语市场，但公司正主动在印度、巴西、印度尼西亚、墨西哥和马来西亚免除 10%
              平台费，以加速国际创作者密度。Recommendations 网络与 app 驱动发现合计带来 30%+ 付费订阅；对于已经有足够受众、能够获得跨 publication
              推荐的创作者，平台内部网络是有效获客渠道。
