  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Substack 的竞争格局最好按创作者要完成的任务来组织，而不是单纯按产品品类。三个结构层定义了这个格局。


              第一层是直接通讯平台同业，包含四个最直接可替代的产品：beehiiv、Ghost、Kit（前身为 ConvertKit）和
              Buttondown。它们都瞄准同一个核心工作流：邮件发布加可选付费订阅；但商业模式、费用结构和战略定位差异很大。beehiiv 由 Morning Brew 前员工在 2021
              年创立，明确在为通讯运营者打造媒体公司级基础设施。截至 2025 年 6 月，它已达到 $30M 年化收入，拥有 140,000 份活跃通讯和 $82.7M 融资，是增长最快、资本最充足的 Substack
              直接替代者。Ghost 是一个由非营利组织支持的开源 CMS，原生具备通讯和付费会员能力。Ghost 对订阅收入收取 0%，其托管服务按月收费，从 $9/mo（Starter）到
              $199/mo（Business）；自托管创作者只支付服务器成本。Kit（2024 年从 ConvertKit 更名）以自动化为先，面向在通讯之外销售数字产品、课程和多步序列的创作者；免费计划支持最多
              10,000 名订阅者，付费计划从 $33/mo 起。这些平台都没有复制 Substack 的发现和推荐网络，而后者仍是 Substack 最持久的单点差异化。


              第二层是相邻变现平台，包括 Patreon 和 Medium。它们解决与创作者变现重叠的任务，但产品路径根本不同。Patreon（成立于 2013 年，250,000+
              活跃创作者）是分层粉丝会员平台，聚焦多格式创作者——播客主、插画师、视频制作者和音乐人——这些创作者希望在多个价位提供结构化权益。Patreon
              不把通讯发送或邮件列表所有权作为核心功能；受众“住”在平台上。2025 年 8 月 4 日之后，Patreon 对所有新创作者统一收取 10% 平台费，与 Substack 费率一致。Medium 运营
              Partner Program，写作者基于付费 Medium 会员（$5/mo 或 $50/yr）的阅读时长获得收入；写作者不拥有订阅者邮件列表，也无法控制算法分发。Medium
              争夺的是重视发现多于所有权的写作者注意力。


              第三层是通用邮件营销和自建替代方案，包括 Mailchimp（Intuit 旗下，300+ 集成，无原生付费墙，Standard 计划从 $13/mo
              起）、MailerLite、ActiveCampaign，以及带通讯插件的自托管
              WordPress（MailPoet、Newsletter、Mailster）。这些工具面向企业邮件营销，而不是创作者变现，但对于不需要付费订阅、或有复杂自动化需求的创作者，它们是真实的现状替代。Mailchimp
              的 Standard 计划对 10,000 个联系人约为 $100/mo——对未变现列表来说比 Substack 更贵。WordPress 插件提供最大定制化和零收入分成，但需要技术维护和独立邮件送达基础设施。


              对高收入刊物来说，自建是真实替代方案：The Ankler 于 2026 年 5 月从 Substack
              迁到自有内部技术基础设施，这条路只适合拥有技术资源、且订阅者基础大到足以证明成本合理的团队。值得跟踪的潜在进入者包括 Spotify（拥有
              Anchor/Megaphone，并从播客生态中获得通讯基础设施）、LinkedIn（已为专业创作者推出通讯功能），以及 Substack 自身的横向扩张风险——如果 beehiiv 继续保持 100%+
              同比收入增长，并补上发现功能差距，市场结构可能在 12–24 个月内发生实质变化。
