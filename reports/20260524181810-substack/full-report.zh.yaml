      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Substack 的运营模式建立在全托管托管架构之上：创作者无需配置基础设施。平台把邮件投递、媒体存储、CDN 支撑的网页、支付处理和移动 app 分发打包成服务。邮件投递使用 Substack
              自有发送基础设施；无论是否配置自定义域名，发件域都保持为 @substack.com。支付基础设施方面，网页订阅依赖 Stripe，iOS 订阅依赖 Apple 的应用内购买系统——后者自 2025 年 9
              月起成为强制要求。iOS app（v2.97.0，iOS 17+）和 Android app（v2.99.2，2026 年 5 月 21 日更新）均为原生应用。平台没有公开 REST API，也没有官方开发者
              SDK；GitHub 上标记为 “substack” 的 126+ 个仓库均为社区工具，其中 python-substack（151+ stars，ma2za）是最活跃的非官方库。可用性通过公开
              Statuspage.io 端点跟踪——公司未发布 SLA 或保证 uptime 百分比，2026 年 5 月 13–24 日也未记录事故。播客、直播和 VOD 的媒体托管包含在平台费内。Recording
              Studio 于 2026 年 3 月 12 日推出，支持个人创作者与最多两名远程嘉宾在浏览器内录制音频和视频，并自动生成短片、用 AI 辅助生成缩略图；TechCrunch 报道，在一个 90 天窗口内，视频
