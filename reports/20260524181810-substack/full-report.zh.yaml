      - number: '2.2'
        title: 市场规模测算：多重视角与相互冲突的估计
        blocks:
          - type: paragraph
            body: >
              通讯和邮件创作者领域的市场规模估计跨度很大，分析师使用的边界定义也互不兼容。Mordor Intelligence 是最常被引用的来源之一，它把全球电子邮件营销市场估为 2025 年 $12.84
              billion、2026 年 $13.72 billion，到 2031 年 CAGR 为 10.82%。Market Research Future 的竞争性估计为 2025 年 $12.6
              billion、2026 年 $14.0 billion；$280 million 的差额来自方法选择和厂商分类不同。The Business Research Company
              使用更窄口径——专门的创作者通讯平台——得到 2025 年 $1.76 billion、2026 年 $2.08 billion，并以 18.4% CAGR 增长。Dataintelo 对每日通讯市场的 $6.8
              billion 2025 年估计，落在这两个锚点之间。Fortune Business Insights 给出的 $16.08 billion 通讯市场数字被 readless.app
              聚合，说明商业研究中的定义差异可能更大。


              在这些市场级估计之上，多个研究机构把创作者经济这个上位市场在 2026 年估为 $205–314 billion，Goldman Sachs 使用的共识数字约为 $250
              billion。通讯板块只是这个生态中的小部分，但增长很快。Substack 的 $450 million 写作者总收入和 beehiiv 的 $30 million
              平台收入合在一起，已经代表了创作者经济中投向发布基础设施的一块可衡量、但仍处早期的支出。


              这些数字共同支持一个约 $2 billion 的 2026 年 Substack 可服务市场（SAM），定义为创作者通讯平台市场。可获取市场（SOM）更难精确划边界。如果用平台级收入和写作者 GMV
              代理，Substack 当前参与的 SOM 约为 $495 million（$45M 平台收入加 $450M 写作者总收入，不过后者是转付流水，不是收入）。竞争平台收入——beehiiv 为 $30M
              ARR，Ghost 的开源规模难以量化——说明相对于 TAM，整个付费通讯基础设施市场仍处在变现早期。主要证据缺口在于，缺少一个干净、可比、专门针对 Substack 的 SAM
              测算；所有分析师报告的方法都把免费与付费、个人与企业、平台与工具层混在一起，分段不一致。
