  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      rationale: >
        Seven primary competitors and one status-quo substitute profiled; additional smaller platforms (Buttondown,
        Paragraph, MailerLite, Lede) exist but lack the scale or strategic relevance to materially change the
        competitive analysis for Substack's investor diligence.
      basis: >
        Competitors selected based on public evidence of newsletter or creator-monetization platform operations,
        publicly reported user or revenue metrics, and direct product overlap with Substack's core
        email-newsletter-plus-paid-subscription workflow as of May 2026.
    columns:
      - 竞争对手
      - 类别
      - 规模或融资
      - 目标客群
      - 收入模式
      - 差异化
      - 局限
    rows:
      - - beehiiv
        - 直接 newsletter 平台
        - 已融资 $82.7M；ARR $30M（2025 年 6 月）；估值 $225M（2024）
        - 重视增长的 newsletter 运营者和媒体业务
        - 固定 SaaS 费用（$0–$96/mo）；付费订阅 0% 抽成；广告和 Boosts 网络收入
        - 原生推荐、广告网络、Boosts、高级分析；Morning Brew 基因；2026 年 4 月推出 0% 抽成播客托管
        - 没有等同于 Substack 推荐体系的发现网络；自动化能力仍在追赶 Kit
      - - Ghost
        - 直接 newsletter 平台（开源）
        - 非营利基金会；平台创作者收入 $100M+（估计）；私人资金支持
        - 想要完全所有权和 0% 费用的独立出版方
        - 固定托管服务费（$9–$199/mo）或免费自托管；0% 抽成
        - 开源 CMS、完整数据所有权、自定义主题、8,000+ 集成、原生 SEO
        - 无发现网络；自托管有技术负担；内置增长机制很少
      - - Kit (ConvertKit)
        - 邮件营销 / 创作者自动化
        - 自举至盈利；ARR 估计约 $40M（2025 年前）；2024 年由 ConvertKit 改名
        - 销售数字产品、课程和多步骤序列的创作者
        - 固定 SaaS 费用（1K 订阅者 $0–$66+/mo）；创作者收入 0% 抽成
        - 顶级可视化自动化构建器；基于标签的分群；数字产品交付
        - 不是 newsletter 原生；无发现网络；多媒体发布有限；品牌声量弱于 Substack 或 beehiiv
      - - Mailchimp (Intuit)
        - 通用邮件营销
        - 2021 年被 Intuit 以 $12B 收购；大企业级规模；Standard 约 $13–$100+/mo
        - 需要自动化和分群的 SMB、电商和品牌营销人员
        - 按联系人计费的 SaaS；免费层最多 500 联系人；Standard/Premium；订阅无收入分成
        - 300+ 集成、高级自动化、品牌套件、多变量测试、成熟送达能力
        - 无原生付费墙或付费订阅；业务重心与创作者经济错位；规模化后昂贵
      - - Patreon
        - 粉丝会员 / 创作者变现平台
        - 融资约 $400M；活跃创作者 250,000+；累计向创作者支付 $1B+
        - 需要分层粉丝会员的多格式创作者（播客主、艺术家、视频创作者）
        - 平台费 10%（2025 年 8 月后新创作者）加 Stripe 费用；旧计划 8–12%
        - 分层权益结构、Discord 集成、视频托管（100 小时 / 月）、社区工具
        - 无 newsletter 递送或邮件列表所有权；无内容发现；受众锁在 Patreon
      - - Medium
        - 出版和写作者变现平台
        - 融资约 $400M；月读者数百万；Partner Program 支付中位数约 $10–$20/mo
        - 想要广泛自然发现、又不想管理邮件列表的写作者
        - 读者订阅（$5/mo、$50/yr）；按阅读时长分配写作者收入
        - 算法发现强；内置受众；写作者无需承担技术负担
        - 写作者不拥有邮件列表；收入不可预测且由平台控制；没有直接订阅者关系
      - - WordPress + plugins
        - 带 newsletter 插件的自托管 CMS
        - 免费开源；插件（MailPoet、Mailster）高级层通常 $50–$150/yr
        - 想要最大控制权和零平台费的技术型创作者
        - 一次性插件许可或年度 SaaS；订阅无收入分成；托管约 $10–$50/mo
        - 完整所有权、无限自定义、无平台锁定、成熟 SEO
        - 需要技术维护；送达能力要自行管理；无发现网络
      - - 内部自建（例如 The Ankler）
        - 现状方案 / 自建发布技术栈
        - 自定义；通常只有付费订阅者 50,000+ 且收入可观时才可行
        - 愿意投入技术基础设施的大型成熟出版方
        - 无平台费；成本来自工程和托管
        - 完全控制品牌、商业模式和技术栈
        - 前期和维护成本高；需要技术团队；无网络效应
