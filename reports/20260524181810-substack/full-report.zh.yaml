      - number: '6.2'
        title: 采用轨迹与平台级增长
        blocks:
          - type: paragraph
            body: >
              Substack 的付费订阅增长轨迹，是现有最清晰的平台健康度代理指标之一：2021 年 3 月达到 1 million 付费订阅；2023 年 2 月达到 2 million；2024 年 2 月达到 3
              million；2024 年 11 月达到 4 million；2025 年 3 月达到 5 million。从 4 million 到 5 million 的最后一跳——约四个月净增超过 1 million
              订阅——Sacra 部分归因于美国大选期间独立政治分析需求带来的 “Trump bump”。截至 2026 年初，5 million
              这一数字尚未被官方更新，暗示付费订阅增长可能减速，尽管总活跃订阅（含免费）已达到 50 million。作者总收入从 2023 年 $300 million 增至 2024 年 $370 million，再到
              2025 年 $450 million；Sacra 估算 Substack 2025 年 7 月自身年化收入为 $45 million（按 $450 million GMV 的 10% 抽成）。2025
              日历年内，产生收入的 publication 数从 50,000 翻倍至近 100,000，其中 10,000 个 publication 跨过 1,000
              名付费订阅者门槛；许多创作者把该门槛视为可持续里程碑。bestwriting 的微型出版商数据显示，付费订阅者同比增长 18%，每名创作者平均月收入跃升 21%。截至 2026 年 5 月，过去 360 天
              iOS app 下载量超过 9.7 million（MWM），但该窗口最后七天的下载速度下滑约 20%——这可能说明移动端增长正在平台化。互动指标仍然强劲：WorldMetrics 和 bestwriting
              报告的邮件打开率为 44%（约为 20–22% 行业均值的两倍），点击率为 5.2%。
