      - number: '3.2'
        title: 定价、费用结构与创作者经济账
        blocks:
          - type: paragraph
            body: >
              2026 年通讯平台市场的核心定价动态，是 Substack 按比例抽成模式与 beehiiv、Ghost 固定费用模式之间的交叉点。小规模时，Substack 近似免费——一个拥有 100 名付费订阅者、价格为
              $5/month 的创作者，每月向 Substack 支付约 $50，低于 beehiiv 的 $43/month Scale 计划。超过约 200 名付费订阅者且价格为 $5/month 后，beehiiv
              会更便宜；超过 1,000 名付费订阅者且价格为 $5/month 后，年成本差超过 $2,400。以 Extra Points 的规模（71,000 名订阅者，平均价格约
              $5/month）计算，Substack 年成本超过 $25,000，而 beehiiv 约为 $3,000——每年相差 $22,000。这正是 2026 年 5 月创作者外流背后有记录可查的经济驱动。


              Substack 精确收取所有付费订阅收入的 10%，没有封顶、规模折扣或可谈判上限，另加 Stripe 处理费，约为每笔交易 2.9% 加 $0.30。综合费用通常为总订阅收入的 13–16%。Substack
              不向创作者收取月费，也不给大型刊物谈判规模折扣。这个模式透明，且没有前置成本，因此最适合收入不确定的早期创作者。


              beehiiv 收费为 $0/month（Launch，最多 2,500 名订阅者）、按年计费 $43/month（Scale，最多 100,000 名订阅者），或按年计费 $96/month（Max，最多
              100,000 名订阅者）。超过 100,000 名订阅者后，价格进入定制企业档。Scale 计划包括对付费订阅 0% 抽成、接入广告网络和 Boosts 市场、邮件自动化、A/B 测试和调查。Max
              计划增加播客托管（2026 年 4 月上线，0% 收入抽成）、推荐计划、多刊物，以及移除 beehiiv 品牌标识。


              Ghost Pro 收取固定月费：Starter（$18/mo，1,000 名会员，1 个员工账号，基础设计）；Publisher（$29/mo，1,000 名会员，3
              个员工账号，自定义主题、付费订阅、高级分析）；Business（$199/mo，10,000+ 名会员，15 个员工账号）。Ghost 对订阅收入抽成 0%；创作者只支付 Stripe 处理费。自托管 Ghost
              免费，但需要服务器托管（通常 $10–20/month）。任何订阅收入超过约 $290/month 的创作者，Ghost Pro 在财务上都是最优选择（也就是 Substack 10% 抽成超过 Ghost
              Pro Publisher 月费的临界点）。


              Kit 的定价（2026）：免费计划支持最多 10,000 名订阅者，但自动化有限；Creator 计划从 $33/month 起；Creator Pro 从 $66/month 起。Kit 对订阅收入抽成
              0%，靠固定 SaaS 费用赚钱。Mailchimp 按联系人收费：免费支持最多 500 个联系人，Standard 计划约 $13/month（500 个联系人，10,000 个联系人时升至约
              $100/month），没有内置付费墙。Patreon 对新创作者（2025 年 8 月之后）收取固定 10% 平台费，另加支付处理费。Medium 不直接向创作者收费，但从按阅读时长分配的 $5/month
              读者订阅池中抽取一部分——创作者收入可变，也不由创作者控制。
