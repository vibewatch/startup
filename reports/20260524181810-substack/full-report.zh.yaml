  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与内容政策风险
        blocks:
          - type: paragraph
            body: >
              Substack 所处的多司法辖区监管环境正在快速收紧。英国方面，Online Safety Act 2023（OSA）设立了法律义务，并自 2025 年 3 月 17 日（非法内容义务）和 2025 年 7 月
              25 日（儿童安全义务）起可执行，要求使用“高度有效的年龄保证”，防止未成年人接触色情、自残推广和其他有害内容。Ofcom 拥有广泛执法权，包括最高达符合条件全球收入 10%
              的罚款；严重情况下，还可寻求法院命令封锁服务。Substack 确认通过推出英国用户强制年龄验证来合规——访问受限内容需通过外部服务商进行身份证件或自拍匹配。欧盟方面，Digital Services
              Act（DSA，Regulation (EU) 2022/2065）自 2024 年 2 月 17 日起全面适用，要求 notice-and-action 机制、透明度报告、下架理由说明和
              know-your-business-customer（KYBC）验证。MLex 称，面向中型平台的 DSA 第二波执法目标在 2026 年 Q2；不合规最高可罚全球年度营业额的 6%（Commission 于
              2025 年 12 月对 X 罚款 €120M）。General Data Protection Regulation（GDPR）要求在 72 小时内向主管数据保护机构通报数据泄露；Substack 对 2025
              年 10 月泄露的四个月披露滞后（2026 年 2 月披露）形成了合理的 DPA 调查入口。澳大利亚 Online Safety Act 2021 让 Substack
              承担年龄验证、有害内容下架和风险评估义务，由 eSafety Commissioner 执行；2026 年 “digital duty of care”
              改革把义务扩展到主动伤害预防。美国方面，Communications Decency Act 的 Section 230 目前保护 Substack 免于大多数用户生成内容责任——John Doe v.
              Substack Inc.（SF Superior Court，2025 年 2 月，anti-SLAPP 驳回 $25M 诽谤诉讼）和 Smith v. Substack Inc.（USDC N.D.
              Cal.，2024 年 8 月，托管内容过失索赔适用 Section 230 immunity）均确认了这一点。FTC 依据 FTC Act Section 5 执行数据安全和欺骗性行为义务。待审的 STOP
              CSAM Act 将取消明知促成儿童性虐待材料的平台的 Section 230 immunity，把罚款提高到 $1M，并缩短报告时限——Substack 已在 2026 年 5 月 14 日更新隐私政策，加入
              NCMEC / CSAM 报告披露，提前应对该义务。Substack Defender 项目为 15+ 个国家的创作者提供法律支持，能缓解创作者层面的法律风险，但不会降低平台层面的监管敞口。
