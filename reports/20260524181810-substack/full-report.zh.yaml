            body: >
              2026 年 2 月披露的数据泄露暴露出四个月检测缺口，几乎肯定违反了 GDPR Article 33 的 72 小时泄露通知要求。Substack 未公开披露 DPA
              通知或调查结果。这是仍未解决的活跃法律敞口，可能导致最高达全球年度营业额 4% 的罚款，也会进一步损害一个以信任型直连受众关系为价值主张的平台声誉。
