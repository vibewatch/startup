          - type: callout
            title: 50% 年流失率与头部创作者离开显示集中度和留存风险会叠加
            body: >
              Sacra 估算的平台级付费订阅流失率约为每年 50%，意味着 Substack 的收入引擎必须持续获客才能维持 GMV——创作者 burnout 是有记录的结构性副产物。收入幂律极端：前 10%
              创作者拿走全部支付的 62%，因此即使一小波头部流失，也会明显冲击 GMV。2025–2026 年的离开潮——The Ankler（150,000 名付费订阅者）、Alison Roman（343,000
              名订阅者）、Anne Helen Petersen、Sean Highkin 和 Casey Newton——证明 10% 的 “Substack Tax”
              与有限的平台控制权是真实流失驱动因素，而非理论风险。强制 Apple IAP（2025 年 8 月）进一步破坏 iOS 订阅者的数据可携带性，形成结构性
              lock-in；批评者称，这预示未来抽成率可能上升。Beehiiv 记录的十二个月内约 3,000 名创作者从 Substack 迁移（BlogHerald），为竞争对手渗透提供了量化证据。
