      - number: '1.3'
        title: 里程碑、产品扩张与反向信息
        blocks:
          - type: paragraph
            body: >-
              Substack 自成立以来的里程碑显示，公司一直从付费邮件基础设施稳步走向更宽的创作者网络。Notes 在 2023 年扩展了发现能力，在通讯之上叠加短内容社交层。到 2024 年和 2025
              年，公司开始加入直播视频、加深移动应用分发，并支持直接 iOS 应用内订阅，这些动作都强化了一个判断：Substack
              越来越像全栈创作者平台，而不是简单的发布后端。部分新功能明确为了制造更多平台内互动和变现：直播视频文档强调即时通知和付费墙直播，PPC Land 报道称，公司告诉出版方，应用已经带来全部付费订阅的 30%
              以上。可是，同一个战略转向也放大了业务风险。2023 年末到 2024 年初，Substack 处理亲纳粹通讯刊物的方式引发写作者施压，招致 NBC News 和 TechCrunch 的批评性报道，最终导致
              Platformer 转投 Ghost。这个事件不只是声誉背景。它说明，当 Substack 搭建 Notes
              和应用这样的推荐与发现界面时，审核争议会更具实质性，因为公司不再只是托管内容，而是在算法上帮助刊物传播。Substack
              后来在批评声中移除了一些刊物，但争议仍然证明，产品扩张与信任和安全治理在公司的叙事里紧密绑定。
