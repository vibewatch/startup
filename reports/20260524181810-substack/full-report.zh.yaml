      - number: '7.3'
        title: 合作伙伴、平台与财务模型风险
        blocks:
          - type: paragraph
            body: >
              2025 年 9 月面向 30,000+ 个 Substack iOS publication 启用的强制 Apple 应用内购买集成，是结构上最重要的平台风险。Apple 第一年抽取 30% 订阅收入（后续年份
              15%）；Substack 通过自动约 30% 的 iOS 价格加价把该成本转嫁给订阅者（$10/month 的 newsletter 在 app 内变成约 $13）。关键在于，IAP
              交易把计费关系从创作者转移给 Apple：订阅者支付历史和续费管理完全留在 Apple 生态内，因此通过 IAP 获取的订阅者在创作者迁移到竞争平台时不可携带。这削弱了 Substack 过去区别于
              walled-garden 竞争对手的数据可携带性论点。与 Stripe 近乎即时的网页支付相比，IAP 支付有 45 天汇款滞后，给依赖订阅收入的创作者带来现金流摩擦。美国以外，iOS
              用户没有更低价替代方案：允许外部支付链接的 Epic Games v. Apple 法院裁决只适用于美国境内，这意味着国际订阅者只能面对被抬高的 IAP 定价——app UI
              中也没有解释存在更便宜的网页选项。Substack 的网页支付只使用 Stripe：创作者连接自己的 Stripe 账户，Substack 通过 Stripe API 收取 10%
              费用。平台不支持其他支付处理商；一旦违反 Stripe 政策、发生技术中断或关系终止，创作者 payout 会立即停摆。财务模型风险方面，Sacra 估算 Substack 截至 2025 年 7 月的年化收入为
              $45M，对应六轮累计融资约 $220M；按 2025 年 7 月 $1.1B 估值计算，收入倍数约为 24x。Sacra 称 Substack 2025 年 Q1 实现正现金流，但没有审计财务、公开 SLA
              或详细成本结构可独立验证 burn 轨迹或利润率画像。收入高度集中在头部创作者：前 10 个 publication 合计年收入超过 $40M，50+ 名创作者个人年收入各超过
              $1M——这意味着少数人离开就会直接影响 Substack 的 GMV 和 10% 抽成收入。
