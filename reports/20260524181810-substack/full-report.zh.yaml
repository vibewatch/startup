              收入不透明是持续存在的尽调缺口。Sacra 的 $45M 年化收入估算（2025 年 7 月）是独立推断，不是审计数据。Substack 从未发布财务报表、毛利率、burn rate 或 runway。累计融资
              $220M、估值 $1.1B、对应估算收入 24x，再叠加 Beehiiv 0%
              费率模式带来的创作者流失逆风，这些因素放在一起，意味着投资者若没有私营公司访问权限，就无法独立建模盈亏平衡轨迹。任何投资决定前，尽调都应要求审计财务和创作者 cohort 流失数据。
