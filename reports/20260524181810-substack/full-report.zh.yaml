      - number: '5.4'
        title: 路线图、差异化与产品风险
        blocks:
          - type: paragraph
            body: >
              Substack 的 2026 年产品路线图围绕 video-first 扩张和跨平台创作者获取展开。Recording Studio（2026 年 3 月 12 日）支持在浏览器内录制播客和视频，并用 AI
              生成片段。Substack TV app（2026 年 1 月，Apple TV + Google TV）把内容消费延伸到联网电视屏幕，并提供 TikTok 风格的 “For You” feed。AI
              驱动的视频片段生成会从直播中自动制作 highlight，并自动上传 YouTube Shorts。$20 million Creator Accelerator Fund 支持跨平台迁移。相对
              Beehiiv、Ghost 和 ConvertKit，Substack 的差异化包括：内置发现网络带来 30%+ 付费转化，整合社交层（Notes），浏览器内视频制作，以及 CTV 触达。Analytics 于
              2025 年 9 月更新，统一邮件和 app 内互动指标。Boost 广告产品提供额外付费分发渠道。关键产品风险包括：（1）没有公开 API，限制开发者生态深度和集成机会；（2）强制 Apple IAP 让
              iOS 价格增加约 30%，且订阅者数据不可携带；（3）2026 年 2 月泄露和四个月检测缺口，让监控成熟度仍有待回答；（4）定制约束——邮件仍由 @substack.com
              发送、没有自定义模板——仍是创作者记录在案的痛点。Substack 的 iOS App Store 评分（4.9/5）和 Recommendations
              网络，是最强的可观察质量与分发护城河；但平台架构也把关键依赖集中到 Stripe、Apple 和作为唯一全托管服务商的 Substack 自身。
