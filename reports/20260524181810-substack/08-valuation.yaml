    - "GMV concentration at top creators makes retention the single most important driver of ARR trajectory; without NRR,
      growth is unverifiable"
    - "Request GMV cohort analysis, creator retention by revenue tier, and subscriber churn disaggregated by acquisition channel"
  - - "Cap table and option pool composition"
    - "No disclosed cap table, option pool percentage, or anti-dilution structure for any financing round"
    - "Without fully diluted share count and option pool, common equity return cannot be modeled; liquidation overhang is
      estimated, not confirmed"
    - "Request fully diluted cap table from Series C closing, ESOP pool size, and all preference terms"
  - - "Advertising revenue run-rate and pilot economics"
    - "December 2025 native advertising pilot confirmed but no revenue contribution, take-rate structure, or scale timeline
      disclosed"
    - "Advertising is the primary lever for ARR growth acceleration beyond the organic subscription trajectory; without evidence,
      bull case is speculative"
    - "Request advertising revenue by Q1 and Q2 2026, advertiser count, take-rate structure, and roadmap"

  notes: 'Source: chapter analysis; conditions reflect publicly available evidence as of May 2026.'
