companyProfile:
  summary: Groq is a Mountain View–based AI inference infrastructure company that designs its own Language Processing Unit
    (LPU) chips for deterministic, ultra-low-latency token generation. Groq's LPU architecture eliminates DRAM bottlenecks
    via SRAM-centric design and static compilation, and the company now pairs that heritage with a global inference cloud
    built around GroqCloud and LPX/Nvidia-backed capacity. The company serves more than 6 million developers and thousands
    of AI-native companies across 13 data centers while keeping current revenue and headcount largely undisclosed.
  foundedDate: '2016-01-01'
  founders:
  - name: Jonathan Ross
    role: Co-founder and Chief Scientist (departed Dec 2025)
    background: Inventor of Google's original TPU; designed Groq's LPU architecture from first principles.
    claimRefs:
    - CO002
  foundingLocation: Mountain View, California, USA
  headquarters: Mountain View, California
  productSummary: Groq sells deterministic AI inference via GroqCloud (developer API) and on-premise/enterprise deployments.
    The LPU chip achieved 241–800+ tokens/second for Llama-class open-source models, and the company now emphasizes inference
    cloud capacity, OpenAI-compatible APIs, and enterprise-grade delivery closer to end users. Supported models include Meta
    Llama 3.x, Mixtral, Mistral, DeepSeek, Whisper, and OpenAI's open models.
  customerFocus: AI developers, enterprise AI teams, regulated-industry buyers, sovereign AI initiatives, and large-scale
    infrastructure partners.
  businessModel: Usage-based API pricing (per token), enterprise contracts, infrastructure partnerships, and hardware/licensing
    or cloud deployment arrangements.
  stage: late-stage private
  fundingStatus: August 2026 round valued Groq at $3.5B; the company raised $650M in June 2026 and $350M in August 2026, bringing
    recent funding to $1B and disclosed funding to roughly $2.8B.
  claimRefs:
  - CO011
