  topStrengths:
  - Industry-leading inference speed via deterministic LPU architecture and LPX/Nvidia-backed capacity still creates a real
    latency advantage.
  - Developer community scale above 6M users and OpenAI-compatible API preserve low-friction adoption and high awareness.
  - Recent $1B of funding plus the Saudi infrastructure commitment support a broader global inference buildout.
  topRisks:
  - Founder Jonathan Ross and President Sunny Madra leaving for Nvidia created enduring key-person and roadmap risk.
  - Audited financials remain unavailable, so revenue quality and margin path are still opaque.
  - Capital intensity is rising as Groq shifts toward a global inference-cloud footprint with 200MW-scale ambitions.
