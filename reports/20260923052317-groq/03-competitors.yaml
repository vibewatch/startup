  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Cerebras and SambaNova per-token pricing
    missingEvidence: Neither Cerebras nor SambaNova publishes per-token API pricing; enterprise contract pricing is negotiated
      directly and not accessible without primary access.
    whyItMatters: Without per-token pricing data for custom-silicon peers, Groq's pricing advantage cannot be fully quantified
      relative to its closest hardware-architecture competitors.
    diligencePath: Request pricing terms from Cerebras and SambaNova enterprise sales; obtain reference quotes for comparable
      workload sizes.
    relatedQuestionRefs:
    - QP005
  - type: missing-source
    severity: material
    topic: Groq compliance certification status (SOC 2, FedRAMP, HIPAA)
    missingEvidence: Groq has not publicly confirmed SOC 2 Type II, FedRAMP, or HIPAA BAA certifications for GroqCloud, limiting
      enterprise and government procurement access.
    whyItMatters: Compliance gaps constrain Groq's ability to compete for regulated enterprise and federal contracts — a key
      growth segment shared with Cerebras and SambaNova.
    diligencePath: Request Groq's current compliance certification portfolio and roadmap; verify against federal procurement
      requirements.
  - type: missing-source
    severity: material
    topic: SambaNova strategic outcome — sale or continuation
    missingEvidence: As of May 2026, the outcome of SambaNova's reported sale exploration is not publicly confirmed; it is
      unknown whether a buyer emerged or the company is continuing independently.
    whyItMatters: If SambaNova is acquired by a strategic buyer (e.g., a hyperscaler), it could dramatically alter the competitive
      landscape for Groq's GroqRack product in the federal market.
    diligencePath: Monitor SambaNova press releases, TechCrunch/The Information M&A coverage, and SEC filings if a public
      strategic buyer is involved.
  - type: private-evidence-only
    severity: minor
    topic: Groq vs Cerebras actual customer overlap and win/loss data
    missingEvidence: Win/loss data for Groq versus Cerebras and SambaNova in enterprise and federal procurement is not publicly
      available.
    whyItMatters: Without win/loss evidence, it is unclear whether Groq is meaningfully competing against Cerebras for the
      same customers or occupying a distinct niche.
    diligencePath: Request Groq's win/loss tracking from sales leadership; interview 2–3 shared-target customers (e.g., DOE
      national labs).
    relatedQuestionRefs:
    - QP002
    - QP007
  - type: missing-source
    severity: minor
    topic: Groq next-generation LPU chip specifications and SRAM roadmap
    missingEvidence: Groq has not publicly disclosed the specifications, SRAM capacity, or tape-out timeline for its next-generation
      LPU chip beyond Samsung 4nm process confirmation.
    whyItMatters: The SRAM headroom constraint is Groq's most documented architectural limitation versus Cerebras and GPU-based
      peers; the roadmap for addressing it is unconfirmed.
    diligencePath: Request next-gen LPU architecture and SRAM capacity roadmap from Groq engineering leadership post-Nvidia
      deal.
  - type: missing-source
    severity: minor
    topic: Fireworks AI and Together AI enterprise contract retention rates
    missingEvidence: Neither Fireworks AI nor Together AI publicly discloses net revenue retention, gross churn, or enterprise
      customer cohort data.
    whyItMatters: Without retention benchmarks for GPU-cloud peers, it is difficult to assess whether Groq's pricing advantage
      translates into durable retention or whether both categories have low switching costs.
    diligencePath: Obtain third-party analyst research on API provider churn or retention metrics; benchmark against public
      SaaS peers.
callouts:
- id: CAL001
  type: risk
  title: SRAM Architecture Ceiling Limits Competitive Reach
  body: Groq's LPU SRAM-centric design is its primary speed advantage but also its most documented competitive constraint.
    Models exceeding approximately 70–80 billion parameters cannot be served efficiently on current LPU hardware without quantization,
    while Cerebras WSE-3 (40GB SRAM) and SambaNova SN40L (three-tier memory) handle larger models. As frontier model sizes
    grow beyond 100B parameters, Groq's competitive reach narrows unless its next-generation chip significantly expands on-chip
    memory capacity. Forbes analyst Karl Freund's warning that only one of the three custom ASIC startups may survive with
    5% combined market share by 2030 underscores the urgency of resolving this constraint.
  claimRefs:
  - CP001
- id: CAL002
  type: insight
  title: SambaNova's Distress Is Both a Warning and an Opportunity for Groq
  body: 'SambaNova Systems exploring a sale in October 2025 after failing to raise a new funding round signals that the capital
    intensity of custom-silicon AI inference is straining at least one of the three main ASIC startups. For Groq, this is
    simultaneously adverse (confirming that the category faces capital-raising difficulty) and opportunistic: SambaNova''s
    federal and national-laboratory customer relationships (Oak Ridge, LLNL) could become available to Groq''s GroqRack sales
    team if SambaNova''s strategic future remains uncertain. Groq''s $1.5B+ raised and the December 2025 Nvidia licensing
    deal capital provide a relative funding buffer, though the leadership transition introduces execution risk.'
  claimRefs:
  - CP001
