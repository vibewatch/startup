  - FP002
- id: SP_S03
  title: Capability Comparison — Pricing, GTM, and Trust
  body: 'On per-token pricing, Groq''s GroqCloud API is positioned at approximately $0.75 per million input tokens and $0.99
    per million output tokens for DeepSeek-R1 class models — roughly 4–8x cheaper than Together AI ($3.00/$7.00 per million)
    and Fireworks AI ($3.00/$8.00 per million). However, Groq''s SRAM-centric architecture limits supported model sizes: models
    exceeding the on-chip SRAM capacity (approximately 70B–80B parameters for current LPU generations) cannot run on GroqCloud
    without model quantization or partitioning, whereas GPU-based providers can run any model that fits within GPU VRAM, including
    405B+ parameter models. Cerebras outperforms Groq on raw tokens-per-second throughput for very large models (e.g., Llama
    3.1 405B) per Artificial Analysis benchmarks, while Groq maintains the lead for mid-size models (Llama 3.1 70B and below).
    On GTM, Groq''s developer-led motion (GroqCloud free tier; 2.8M+ developer signups; OpenAI-compatible API) mirrors Together
    AI''s developer-first approach. Fireworks AI has focused more aggressively on enterprise sales and production SLAs, evidenced
    by its $315M ARR. Groq lacks publicly disclosed SOC 2 Type II, FedRAMP, or HIPAA BAA certifications, which constrains
    enterprise and government procurement. Cerebras and SambaNova have deeper federal relationships (DOE, DOD, national labs)
    than GroqCloud. Distribution for all non-hyperscaler inference providers is primarily direct or developer-community-led;
    none have established meaningful channel-reseller programs. GPU-cloud providers can list on AWS, Azure, and GCP marketplace
    while Groq''s custom silicon is not natively available through hyperscaler marketplaces as a managed offering.'
  claimRefs:
  - CP001
  - CP002
  tableRefs:
  - TP002
  - TP003
  figureRefs:
  - FP003
- id: SP_S04
  title: Moat Durability and Adverse Competitive Evidence
  body: 'Groq''s primary moat claim is architectural: the LPU''s deterministic, SRAM-centric design yields latency and power
    efficiency advantages that Nvidia GPUs cannot easily replicate without abandoning the CUDA general-purpose execution model.
    However, this moat faces four structural threats. First, Nvidia''s Blackwell B200 GPU includes inference-optimized memory
    configurations and NIM microservices that close the latency gap for batch inference use cases. Barclays estimates that
    non-Nvidia silicon will capture only around 10–15% of the inference accelerator market by 2030, while Nvidia holds 50%+
    long-term. Second, the SRAM headroom constraint is a documented limitation: Groq''s current chips cannot cost-effectively
    serve models larger than approximately 70–80B parameters at scale without quantization, which limits competitive reach
    as frontier model sizes grow to 100B–1T+ parameters. Third, Forbes analyst Karl Freund wrote in October 2025 that "there
    could be room for only one of the three custom ASIC startups to survive" if combined custom-ASIC market share reaches
    only 5% by 2030 — a direct adverse signal for Groq, Cerebras, and SambaNova. Fourth, SambaNova''s October 2025 exploration
    of a sale after failing to raise a new round is a leading indicator of capital-raising difficulty across the custom-silicon
    inference category. On lock-in, Groq benefits from minimal switching cost for developers (OpenAI-compatible API), which
    is simultaneously a distribution advantage and a retention risk — developers can switch to Together AI or Fireworks with
    a single endpoint change. On supply and partner access, Groq''s Samsung 4nm manufacturing agreement and GlobalFoundries
    14nm history provide some supply security, but all custom-silicon players face multi-year fab lead times and capital intensity
    for next-generation chip generations. The December 2025 Nvidia licensing deal (approximately $20B) and departure of founder
    Jonathan Ross and President Sunny Madra to Nvidia represent both a capital injection and an adverse signal about Groq''s
    ability to retain its core founding leadership in a standalone capacity.'
  claimRefs:
  - CP001
  - CP002
  tableRefs:
  - TP004
