chapter:
  number: 6
  title: Customers
  key: customers
  summary: 'Groq''s customer base as of May 2026 spans enterprise AI teams, government and research institutions, growth-stage
    companies, and a large developer self-serve tier totaling 2.8 million registered developers. Named enterprise accounts
    include McLaren Formula 1, Paytm, Bell Canada, Saudi Aramco''s HUMAIN venture ($1.5B infrastructure commitment), the U.S.
    Department of Energy at Argonne National Laboratory, CERN, IBM, and India''s Department of Telecommunications. Revenue
    is heavily concentrated: an estimated 25% of customers contribute approximately 70% of revenue, with HUMAIN representing
    a single- account concentration risk of material severity. Developer adoption is viral and proven, but monetization depth
    is concentrated in enterprise and government. The absence of publicly disclosed NRR, cohort churn, or contract renewal
    data prevents independent assessment of retention durability. Low API switching costs (OpenAI-compatible interface) and
    active competitive pressure from Cerebras, Together AI, and Fireworks AI are the primary risks to customer durability.'
sections:
- id: S01
  title: Customer Segments and Buyer Landscape
  body: Groq's customer base is organized into four identifiable segments by buyer type, revenue band, and deployment model.
    The enterprise segment (estimated contract value above $100,000 per year) comprises approximately 25% of customer accounts
    but drives roughly 70% of total revenue. Enterprise buyers are primarily AI engineering leads and CTO-level executives
    at technology-intensive companies, government agencies, and research institutions who require deterministic latency SLAs
    that GPU-based cloud providers cannot guarantee. The growth-company segment (estimated $10,000–$100,000 per year) comprises
    approximately 35% of accounts and 25% of revenue; this tier skews toward AI-native startups building real-time applications
    such as voice AI, code copilots, and gaming intelligence where Groq's throughput advantage is commercially meaningful.
    Developer self-serve customers (less than $10,000 per year, including free-tier users) constitute approximately 40% of
    accounts but only approximately 5% of revenue — a large but monetization-light base whose primary value is top-of-funnel
    pipeline and ecosystem signaling. Vertically, Groq's named customer logos span motorsport (McLaren F1), financial services
    (Paytm), telecommunications (Bell Canada, Government of India DoT), energy and commodities (Saudi Aramco HUMAIN), high-energy
    physics (CERN), national laboratory computing (US DOE / Argonne), and enterprise software (IBM, Salesforce via partner
    integrations). Geographically, GroqCloud's developer base is global, with documented concentrations in the United States,
    India (Paytm, DoT), Europe (CERN), and the Gulf Cooperation Council region (HUMAIN). Revenue geography is not publicly
    disclosed and represents a diligence gap, as the HUMAIN commitment could disproportionately shift the apparent geographic
    mix if recognized in 2025–2026.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
- id: S02
  title: Named Enterprise Customer Case Studies and Deployment Proof
  body: 'Groq''s most commercially and reputationally significant named customer is McLaren Formula 1, which uses GroqCloud''s
    LPU-backed inference for real-time telemetry analysis and race strategy optimization during Grand Prix events. This deployment
    is production-grade — it operates on race day with latency constraints no GPU-based API could meet — and represents a
    high- reference-quality proof of Groq''s core value proposition: deterministic, sub-50-millisecond inference for time-critical
    decisions. Paytm, India''s largest fintech by payment volume, has deployed GroqCloud for AI-powered customer service interactions
    at scale, making it one of the highest-volume consumer AI deployments in Groq''s portfolio. Bell Canada deployed Groq
    LPUs for telecom AI applications, extending the enterprise account base into regulated North American infrastructure.
    Saudi Aramco''s HUMAIN joint venture represents Groq''s largest single commercial commitment by dollar value: a $1.5 billion
    infrastructure agreement to power Saudi Arabia''s national AI compute ambitions, with Groq providing LPU capacity as the
    preferred inference accelerator. The U.S. Department of Energy deployed Groq hardware alongside Cerebras at Argonne National
    Laboratory for AI inference workloads, providing federal-sector credibility and a high-visibility reference deployment
    for regulated-environment procurement. CERN, the European particle physics consortium, deployed Groq infrastructure for
    data analysis tasks, broadening the scientific computing vertical. IBM selected GroqCloud for enterprise AI applications,
    signaling tier-1 enterprise credibility. India''s Department of Telecommunications selected Groq for national telecom
    AI workloads in 2025. The common thread across all named enterprise deployments is speed: every public customer rationale
    cites inference throughput or deterministic latency as the primary selection criterion. However, no named customer has
    published quantified ROI, contract value, NRR, or renewal data, limiting the depth of outcome-level diligence possible
    from public sources.'
  claimRefs:
