  - id: FM001
    title: 市场空间透视测算
    type: pyramid
    summary: 采用层层嵌套视角，从最宽泛的市场总规模下沉测算至 Groq 在 2025 年的预估可获取市场。TAM 包含了与训练相关的硬件与服务。Groq 真正的市场机会集中在 API 推理 IaaS 及对速度高度敏感的细分赛道。
