      - number: '5.5'
        title: 附件
        blocks:
          - type: callout
            title: 确定性LPU架构构筑了中等规模大语言模型推理的坚实技术护城河
            body: >-
              相比GPU方案，Groq的LPU架构走出了一条根本不同的AI推理路径：静态调度、以SRAM为核心、且具备完全确定性。该设计在7B–70B参数模型上展现出首字延迟与吞吐量优势。GPU的动态执行模型本身会带来调度延迟，不是调整配置就能消除的；若不从底层重构，GPU架构无法复制这一表现。ArtificialAnalysis的独立基准测试数据（2024年1月Llama
              2 70B达241 Token/秒，而最接近的GPU方案不足50 Token/秒）证实，在目标模型规模区间内，Groq 的性能优势显著。此外，GroqFlow
              编译器的静态调度让运行表现可预测、可复现。延迟敏感的生产负载看重这种确定性，它的价值并不取决于峰值吞吐量。该护城河在中短期内具备韧性，因为它根植于芯片设计与编译器技术，并非竞品仅靠软件优化就能追上的调优参数。
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE012
          - type: callout
            title: SRAM上限与单位成本经济性构成最核心的技术尽调风险
            body: >-
              让LPU在中等规模模型上傲视群雄的SRAM核心架构，在大模型推理场景下反成结构性天花板。超过约700亿至800亿参数的模型必须跨多个GroqNode分布式切分，引入节点间通信延迟，削弱了单系统吞吐量优势——而这正是
              Groq 核心竞争力的主要主张。ArtificialAnalysis 2025年10月的数据表明，在70B 以上参数模型上，Cerebras
              WSE-3已超越Groq，而前沿区间恰恰凝聚了最高的商业关注度与客单价。雪上加霜的是，SRAM单位Bit成本远高于DRAM与HBM；随着HBM成本随工艺成熟与放量逐步下行，即使Groq在中等规模模型上保住速度领先，其每Token成本优势也面临挤压。Groq尚未公开Gen2
              LPU的SRAM容量，导致外界无法评估三星4nm制程能否实质破解模型规模上限。既有规模上限、成本演进不确定、叠加大体量Gen2底层规格未披露，构成了潜在投资方评估其长期竞争耐力时最重大的技术尽调缺口。
            calloutType: insight
            claimRefs:
              - CE011
  - number: 6
    title: 客户与生态
    sections:
      - number: '6.1'
        title: 客户分群与买方画像
        blocks:
          - type: paragraph
            body: >-
              按买方类型、收入区间和部署模式划分，Groq的客户基础可归入四个清晰细分层级。企业客户（年合同额估计超过 $100,000（10
              万美元））约占客户总数的25%，却贡献了大约70%的总收入。企业买方主要是科技密集型企业、政府机构及科研院所的AI工程负责人和CTO级别高管，核心诉求在于GPU云服务商无法保障的确定性延迟SLA。成长型企业客户（年合同额预估在
              $10,000 至 $100,000（1 万至 10
              万美元））约占客户数的35%和收入的25%；该客群偏向原生AI初创团队，打造语音AI、代码Copilot和游戏智能等实时应用，Groq的吞吐量优势在此具备明确商业意义。开发者自助客户（年消费不足
              $10,000（1
              万美元），含免费层用户）占客户数的约40%，但仅贡献约5%收入——这一客群规模庞大但商业变现轻量，主要价值在于构成销售漏斗顶层并释放生态信号。从垂直行业来看，Groq的标杆客户覆盖赛车运动（McLaren
              F1）、金融服务（Paytm）、电信（Bell Canada、印度电信部DoT）、能源与大宗商品（沙特阿美HUMAIN）、高能物理（CERN）、国家实验室超算（美国能源部DOE /
              Argonne）以及企业级软件（IBM，以及通过合作伙伴集成的Salesforce）。在地域分布上，GroqCloud开发者遍布全球，主要集中在美国、印度（Paytm、DoT）、欧洲（CERN）和海湾阿拉伯国家合作委员会地区（HUMAIN）。收入的地域构成未向外界披露，构成一项尽调缺口；若HUMAIN相关承诺于2025至2026年确认，或将大幅改变其表面地域分布结构。
