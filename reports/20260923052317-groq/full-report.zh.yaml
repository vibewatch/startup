  - id: TE005
    title: GroqCloud 工作流与用例参考
    columns:
      - 用户需求 / 用例
      - 未使用 Groq（当前工作流）
      - 使用 GroqCloud
      - 可量化收益
      - 局限性
    rows:
      - - 实时 AI 智能体响应
        - OpenAI GPT-4 API 或自建 GPU；首 token 延迟（TTFT）为 200–800ms；高负载下需排队
        - 基于 Llama 3.1 70B 的 GroqCloud API；TTFT 约 50ms；确定性延迟
        - 响应速度提升 4–10x；减少面向用户产品中智能体的“思考等待”
        - 模型广度仅限于所支持的开源模型；GroqCloud 上缺乏对标 GPT-4 的等效模型
      - - 语音交互 / 语音转文字 + LLM
        - 采用 GPU 推理的独立 STT + LLM 流水线；端到端延迟通常达 1–2 秒
        - 在同一次 API 调用中运行 GroqCloud Whisper + Llama LLM；目标综合延迟低于 500ms
        - 在开源模型上实现对话级语音 AI 延迟，无需依赖闭源 API
        - 除 Whisper 外无多模态模型；不支持视觉处理流水线
      - - 开发者实验 / 原型开发
        - 使用需付费额度的 OpenAI API 或消费级 GPU 上的本地模型；受速率限制或成本高昂
        - GroqCloud 免费层；无需信用卡；兼容 OpenAI 的 API；即时接入
        - 从 OpenAI 迁移成本为零；免费接入加快了开发者上手速度
        - 免费层的速率限制可能制约压力测试与高频原型迭代
      - - LangChain / LlamaIndex 智能体应用
        - 基于 OpenAI 或 Anthropic 的推理后端；若 API 不兼容，切换需要修改代码
        - 通过 LiteLLM 或原生集成，将 GroqCloud 用作 LangChain/LlamaIndex 的无缝替代后端
        - 智能体执行链更快且延迟确定；相较于 GPU 替代方案每 token 成本更低
        - 模型多样性有限；依赖 Function Calling 的 LangChain/LlamaIndex 功能可能存在缺口
      - - 企业本地部署 LLM
        - 自建 GPU 服务器（H100/A100）；资本开支高；维护负担重；缺乏托管服务
        - GroqRack 本地部署 LPU 机架；托管硬件；企业级销售；包含 KQUE 液冷
        - 物理隔离部署具备确定性推理延迟；数据不出本地
        - 需前期采购硬件；合规认证状态未披露；公开价格信息有限
      - - 批量文档处理 / 摘要生成
        - GPU API 批量推理；延迟波动；按 token 计费随用量成比例增加
        - 支持 7B–70B 模型的 GroqCloud 批量 API；吞吐量高且每 token 成本低
        - 在中等规模模型上，Groq 大规模定价较 GPU IaaS 同行便宜约 4–7 倍（~4–7x）
        - 不支持微调模型；针对 100B 级模型，批处理任务受限于 SRAM 模型参数上限
    claimRefs:
      - CE001
      - CE002
    notes: 除注明独立基准测试外，可量化收益均为估算或公司声称数据。局限性反映了截至 2026 年 5 月已记录的架构或产品缺口。
