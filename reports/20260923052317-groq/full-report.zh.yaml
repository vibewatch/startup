      将 Groq 关键风险对应四种发生可能性（列）与四个影响等级（行）的矩阵。极高/高影响象限中的风险包括 BIS 出口管制重新分类、HUMAIN 收入集中、Samsung 晶圆代工集中以及 Nvidia Blackwell
      抹平速度差距。各单元格包含落入对应可能性与影响组合中的风险标识符。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
        - 已证实 / 确定
      rows:
        - label: 极高影响
          values:
            - label: ''
              tone: neutral
            - label: BIS 出口管制（R-09）；HUMAIN 政治风险（R-10）
              tone: critical
            - label: HUMAIN 收入集中（R-15）；超大规模云厂商 ASIC 替代（R-06）
              tone: critical
            - label: ''
              tone: neutral
        - label: 高影响
          values:
            - label: ''
              tone: neutral
            - label: Samsung 晶圆良率不及预期（R-02）；开源模型许可收紧（R-03）；Nvidia IP 专利费（R-13）
              tone: warning
            - label: Nvidia Blackwell 缩小速度差距（R-05）；编译器脆弱性（R-04）；烧钱速度与现金跑道（R-14）
              tone: warning
            - label: Jonathan Ross 离职（R-16）；CEO 过渡（R-17）
              tone: warning
        - label: 中影响
          values:
            - label: FTC 反垄断（R-12）
              tone: neutral
            - label: 《欧盟人工智能法案》合规（R-11）；GroqCloud 安全漏洞（R-07）
              tone: neutral
            - label: Cerebras 在 70B+ 上的挤压替代（R-07b）；编译器团队流失（R-18）
              tone: warning
            - label: ''
              tone: neutral
        - label: 低影响
          values:
            - label: 英国 AI 安全指引（R-08）
              tone: neutral
            - label: ''
              tone: neutral
            - label: ''
              tone: neutral
            - label: ''
              tone: neutral
    claimRefs:
      - CR001
      - CR002
      - CR005
