      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格跳水——单 Token 收入长期承压走低
            body: >-
              AI 推理价格每 12 个月暴跌约 10x（Sam Altman，2025 年 2 月）。Groq 的部分竞争力来自相较 GPU 方案的性价比，因此降价构成长期结构性逆风：即使 Token 调用量飙升，单
              Token 变现价值也在持续缩水。若 Groq 2025 年估计达到 $500M 的营收是以每 1M 输入 Token 对应 $0.75 为基准，一旦价格发生 10x 下跌，公司仅维持现有收入规模就需要实现
              10x 的用量增长。Groq 必须拿出远超价格跳水速度的用量爆发力，方能维系其增长轨迹。
            calloutType: risk
            claimRefs:
