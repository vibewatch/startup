              Groq从未披露面向企业客户的NRR、GRR或任何分群留存指标。API型基础设施公司兼容OpenAI接口，客户切换成本极低，因此NRR是判断企业收入能否持续的关键先行指标。若无此数据支撑，投资人根本无法厘清其企业客户群是在持续扩张还是正走向萎缩。这是阻断性尽调缺口；开展任何IRR财务模型测算前，都应先查阅虚拟数据室（Data
              Room）予以核实。
