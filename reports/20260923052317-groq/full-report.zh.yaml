      对比悲观、当前标杆、基准及乐观情景下的低/中/高估值区间。以 2025 年 9 月 Series E 轮 $6.9B 估值为基准锚点；悲观情景对应 50–60% 下行风险，乐观情景则为 Series E 投资人带来
