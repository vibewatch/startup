      - number: '2.2'
        title: 市场空间测算——TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >-
              AI 推理的潜在市场规模庞大且增长迅速，但由于口径与测算方法不同，各家机构预测差异显著。Grand View Research 估计 2024 年全球 AI 推理市场规模为 $97.24 billion，预计到
              2030 年将达 $253.75 billion（CAGR 17.5%）。MarketsandMarkets 测算 2025 年规模为 $106.15 billion，2030 年预计达 $254.98
              billion（CAGR 19.2%）。Fortune Business Insights 估计 2025 年为 $103.73 billion，到 2034 年将增至 $312.64 billion（CAGR
              12.98%）。上述广义数据涵盖了 AI 推理硬件（GPU / ASIC 采购）、云端 AI 服务以及企业级软件，覆盖范围远大于 Groq 的直接可服务市场。Groq 的可服务市场（SAM）聚焦于云端 AI
              推理即服务这一细分子赛道：即 API 优先、规模化的托管 LLM 推理。根据云服务与硬件的收入拆分，该赛道测算约占广义市场的 10–20%，对应 2025 年 SAM 约为 $10–20
              billion。若按照第三方估算的 Groq 2025 年约 $500 million 营收测算，其在这一推理 IaaS 层的 SAM 市场份额大约为 3–5%。Groq
              的可获取市场（SOM）则进一步收敛至强依赖超低延迟与确定性吞吐的场景：实时 AI 智能体、语音交互、金融反欺诈及交互式开发者工具——该细分赛道在 2025 年估计为 $2–5 billion。估算 Groq
              的潜在机会时，投资者应对广义市场预测作合理折价。
            claimRefs:
              - CM001
              - CM002
