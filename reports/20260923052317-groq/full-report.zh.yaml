      - number: '7.4'
        title: 财务、人员与治理风险
        blocks:
          - type: paragraph
            body: >-
              高资本开支强度、烧钱速率加快、缺乏经审计公开财务报表以及营收过度依赖单一主权订单，勾勒出Groq严峻的财务风险画像。据估算，公司2024年在约$90M（9,000
              万美元）营收规模下的运营净亏损高达$150–200M（1.5 亿至 2 亿美元）——表明在HUMAIN项目落地前，其经营杠杆仍深陷负值区间。三星4nm制程LPU
              Gen2带来的年化资本支出预估在$50–100M（5,000 万至 1 亿美元）；数据中心机房运维耗资$30–60M（3,000 万至 6,000 万美元）；工程研发人力成本另占$60–80M（6,000 万至
              8,000 万美元）。即便2025年9月Series E融资$750M（7.5 亿美元）并斩获HUMAIN $1.5B（15
              亿美元）长约承诺，在HUMAIN收入能有效对冲巨额前期部署成本之前，按现行烧钱节奏推算，其资金跑道仅能维持18至24个月。高达$6.9B（69 亿美元）的Series
              E估值，隐含着投资人对其在2至3年内实现IPO的严苛预期，在极为紧凑的时间表内对收入扩张与毛利提升施加了巨大的执行重压。管理层公开宣称2026年实现经营现金流转正，但该目标完全系于HUMAIN项目回款，而后者又时刻笼罩在出口管制与地缘政治的不确定性阴霾之下。更关键的是，目前所有财务指标均为第三方分析师预估，官方从未出具经审计的GAAP财报。人员与治理危机更在2025年12月集中爆发：创始人Jonathan
              Ross（Google初代TPU发明人、LPU核心架构师）伴随知识产权交叉许可协议转投Nvidia；首席执行官Sunny Madra同期出走Nvidia；Simon
              Edwards临危受命接任CEO——这是其履历中首次执掌整家企业，正值公司关键业务跃迁期。LPU编译器核心研发团队体量小、技术稀缺，极易成为Nvidia及云厂商猎头挖角的目标。此外，董事会结构高度由风险投资机构把持，缺乏曾带领芯片硬件企业成功跨越ASIC量产深水区的资深产业运营高管。
