  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Groq在海外收入上的高度集中——尤其是沙特HUMAIN高达$1.5B（15
              亿美元）的承诺——带来了纯本土基础设施企业鲜少面临的监管与法律敞口。美国工业与安全局（BIS）在《出口管制条例》（EAR）框架下持续收紧前沿AI芯片出口，将各类加速器重新归入商业管制清单（CCL），并对销往中东市场的先进算力硬件实施出口许可证要求。若BIS未来将专用推理ASIC纳入管制细则，Groq的LPU在沙特和阿联酋的部署可能必须申请出口许可，进而阻断或延宕HUMAIN项目交付。BIS于2024年1月发布的暂行最终规则针对销往D:5组别国家的前沿AI芯片设定了基于性能的许可门槛；Groq必须严密监测其LPU
              Gen2的性能指标是否触碰上述红线。OFAC制裁合规是另一项不可忽视的连带风险：一旦HUMAIN任何关联实体被列入OFAC制裁名单，Groq法律上将全面禁止依据基础设施合同收取款项。2026年全面落地的欧盟《人工智能法案》（Regulation
              2024/1689）规定，当推理API被用于欧盟境内高风险AI场景（医疗、生物识别、雇佣筛选等）时，底层算力服务商须履行严格合规义务。在美国本土，联邦贸易委员会（FTC）在2024年AI竞争报告中已将推理算力集中度列为重点监管议题。2025年12月Groq与Nvidia达成的知识产权交叉许可更引入了边界未明的法律风险：未公开的专利费条款可能沉淀为未来的重大刚性支出，应用领域限制亦可能捆绑LPU
              Gen3的设计自由度。此外，服务美国能源部（Argonne国家实验室）涉及的ITAR与EAR合规，也大幅推高了联邦履约管理成本与人员准入审查门槛。
