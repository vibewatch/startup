  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景概览
        blocks:
          - type: paragraph
            body: >-
              Groq 面对的市场由三大鲜明阵营构成：定制芯片 AI 推理专家、基于 GPU 云的推理即服务 API 厂商，以及将推理与整体云生态捆绑销售的超大规模云厂商托管 AI 服务。在定制芯片同侪中，Cerebras
              Systems（WSE-3 芯片）与 SambaNova Systems（SN40L RDU）最具直接可比性——双方均搭建了专属 ASIC 架构，主攻低延迟及计算密集型推理负载，与 Groq 借助
              GroqRack 争夺相同的企业级和国家实验室客群。在 API 优先的 GPU 云厂商中，Together AI（General Catalyst 领投 Series B，估值 $3.3B，覆盖 450K+
              开发者）与 Fireworks AI（Sequoia 领投 Series C，估值 $4B，年经常性收入（ARR）达 $315M）代表了最具规模效应的替代方案，二者同样提供丰富的开源模型库与兼容 OpenAI 的
              API。作为行业霸主，Nvidia 的身份高度复合：它既是全行业 GPU 推理厂商赖以生存的供应商（掌控 CUDA 生态），又是技术授权合作伙伴（2025 年 12 月与 Groq 达成规模达 ~$20B
              的合作），同时还是极具威胁的下游竞争对手——其 NIM 推理微服务与 Triton Inference Server 已深度嵌入各大主流云平台。AMD 则依托 MI300X GPU 与 ROCm
              间接竞逐该市场。超大规模云厂商（AWS Inferentia 2、Google TPU v5、Azure Maia 100）研发自研芯片主要为了摊薄自身 AI API 的内部成本，并非作为独立第三方 IaaS
              对外输出，却吃下了企业级 AI 开支的大头。潜在的新入局者大概率包括更多获得风投支持的推理优化初创团队，以及 ARM 生态芯片设计商针对边缘和本地部署推出的垂类 ASIC。许多买方目前仍在 AWS、Azure 或
              Google 租用的 GPU 集群上自行托管开源模型；这正是 Groq 最主要的替代方案。
