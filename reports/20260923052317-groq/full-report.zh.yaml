      - number: '1.4'
        title: 反向信号与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Groq 存在数项值得尽调高度审视的实质性反向信号。首当其冲的是 2025 年 12 月创始人兼 CEO Jonathan Ross 与总裁 Sunny Madra 因授权协议转投
              Nvidia。近十年来，Ross 始终是公司的技术领军人物、对外发言人和核心销售推手。继任 CEO Simon Edwards 在履新前不足三个月才出任
              CFO，此前尚无公开的执掌芯片或云基础设施公司履历。其次，Groq 在 2019 年险些耗尽资金，生死仅差不到一个月——这一事实由 Ross
              本人披露，表明公司早期的风险管理相当脆弱，能够存活带有一定偶然性。第三，Groq 在 2023 年收入仅为 $3.4 million，净亏损却达 $88 million，令人质疑 ChatGPT
              问世后的收入增长是否具备持续性，抑或只是现有巨头尚未发力前的阶段性窗口。第四，技术分析师指出，LPU 基于 SRAM 的架构在存储密度上比 GPU 的 HBM
              低三个数量级，这限制了适配模型的规模，并将单卡硬件成本推高至约 $20,000。一位拒绝参与 Series D 轮融资的风投合伙人直言 Groq 的知识产权“长期来看缺乏防守力”，认为 Nvidia
              或其他现有巨头完全可能复制其推理速度优势。Lambda Cloud 的 CEO 亦公开表示，公司暂无引入 Groq 芯片的计划，并指出在云基础设施领域“很难去考虑 Nvidia 之外的选择”。虽然 Nvidia
              的技术授权在一定程度上印证了其 IP 价值，部分缓解了上述担忧，但风险依旧突出。
            claimRefs:
              - CO001
              - CO002
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 创始人离职——关键人风险暴露
            body: >-
              2025 年 12 月，作为非独家技术授权交易的一部分，创始人兼 CEO Jonathan Ross 与总裁 Sunny Madra 双双加盟 Nvidia。Ross 九年来一直是 Groq
              的技术领军人物和核心销售推手；他与 Madra 一同离开，对公司领导层造成重大冲击。新任 CEO Simon Edwards（此前仅在 3 个月前获任 CFO）此前从未掌舵过半导体或云基础设施企业。官方称
              GroqCloud 业务将平稳过渡且不受干扰，但对产品路线图和企业级客户关系的拉扯仍构成实质性的中期风险。
            calloutType: risk
            claimRefs:
              - CO001
          - type: callout
            title: SRAM 架构：以模型规模为代价换取极致速度
            body: >-
              Groq LPU 依托以 SRAM 为核心的设计跑出业内领先推理速度，但 SRAM 存储密度比 NVIDIA GPU 使用的 HBM 低约三个数量级。这严重压制了单芯片可承载的模型规模，且意味着每张 LPU
              加速卡成本高达大约 $20,000。多芯片扩展虽能部分缓解这一瓶颈，却带来了复杂的片间通信开销。Groq LPU v2（Samsung 4nm）旨在突破模型规模上限，但该架构本质上仍远不如 GPU
              方案适合模型训练。
            calloutType: risk
            claimRefs:
              - CO001
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              AI 推理市场涵盖用于在生产环境中运行已训练 AI 模型所需的算力、存储、网络与软件基础设施——即基于新输入数据生成预测、响应或决策。Groq 直接切入云端 AI 推理即服务（IaaS）赛道：提供可通过 API
              调用、云端托管、按 Token 计费的大语言模型（LLM）与多模态模型运行环境。该赛道隶属于更广泛的 AI 推理硬件与服务市场，后者还涵盖本地部署加速卡、边缘部署及企业级 MLOps 工具链。不在 Groq
              主战场的领域包括：AI 模型训练（由 Nvidia H100/H200 及 B200 GPU 牢牢把持的高资本开支工作负载）、微调基础设施，以及计算机视觉或推荐系统等 GPU
              成本结构完全不同的非语言模态推理。当前替代 Groq 方案的主流选择包括：(1) 超大规模云厂商 API 托管的 GPU 推理服务（AWS Bedrock、Azure OpenAI Service、Google
              Vertex AI）；(2) 在 GPU 集群上自行托管的开源 LLM；(3) 头部 AI 实验室（OpenAI、Anthropic）的闭源模型。Groq 在云端 IaaS
              层占据着鲜明的速度与性价比生态位，专门吃下那些基于 GPU 的替代方案在受支持开源模型上无法匹配其 tokens-per-second 吞吐的低延迟敏感场景。
            claimRefs:
              - CM001
              - CM002
          - type: table
