      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2017 年至 2025 年 9 月期间，Groq 历经 6 轮融资，公开披露的股权融资总额约 $1.5 billion，另有沙特阿拉伯王国于 2025 年 2 月宣布的 $1.5 billion
              基础设施承诺。公司于 2017 年完成由 Social Capital（Chamath Palihapitiya）领投的 $10 million 种子轮，随后在 2018 年获得追加早期资金。2021 年 4
              月，由 Tiger Global Management 与 D1 Capital Partners 领投的 $300 million Series C 轮融资推动 Groq 晋升独角兽，估值突破 $1
              billion。2024 年 8 月的 Series D 轮融资（BlackRock Private Equity Partners 领投，$640M，估值 $2.8B）引入了战略投资者 Samsung
              Catalyst Fund（LPU v2 半导体代工厂商）与 Cisco Investments（协同 Groq 的 Bell Canada 与企业电信业务布局），Morgan Stanley
              担任独家配售代理。2025 年 9 月的 Series E 轮融资（$750M，估值 $6.9B）由达拉斯成长期基金 Disruptive 领投（仅该机构便单轮注资近 $350
              million），BlackRock、Samsung、Cisco、D1、Altimeter、1789 Capital 与 Infinitum 跟投。2025 年 12 月，Nvidia 同意授权使用 Groq
              的推理技术，交易估值大约达 $20 billion，Groq 称其为非独家授权协议。据报道，Groq 2023 年收入为 $3.4 million，净亏损达 $88 million；2025 年预计收入为
              $500 million，展现出 ChatGPT 问世后的爆发式提速，但确切数据尚未经独立审计。
