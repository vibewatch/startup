  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 贯穿市场空间、产品验证、客户拓展、估值背景与风险要素，推导得出最终的「观察（MONITOR）」建议，并在各环节明确列出逻辑破坏触发条件。
    data:
      nodes:
        - id: market
          label: 市场空间
          detail: $97–128B AI 推理 TAM（2025 年）；2030 年达 $254–313B。Groq 可触达份额：$10–20B SAM。
          type: input
          tone: positive
        - id: product
          label: 产品验证：LPU 速度
          detail: 70B 模型推理速度达 750+ tokens/sec；为 GPU 云速度的 10–14×。经 ArtificialAnalysis 基准测试验证。
          type: process
          tone: positive
        - id: traction
          label: 客户拓展：2.8M 开发者 + HUMAIN
          detail: 拥有 2.8M 名开发者；HUMAIN 承诺采购价值 $1.5B 的基础设施；已拓展 McLaren、Paytm、DOE Argonne 等企业客户。
          type: process
          tone: positive
        - id: valuation
          label: 估值水平：$6.9B，对应 13.8× 2025E P/S
          detail: 2025 年 9 月完成 Series E 轮。与 AI 推理同业中位数一致。较此前 $2.8B 估值在 13 个月内增长 146%。
          type: process
          tone: neutral
        - id: risks
          label: 核心风险
          detail: Nvidia Blackwell 缩小速度差距；HUMAIN 面临 BIS 出口管制不确定性；缺乏经审计财报；存在 Nvidia 专利版税负担。
          type: process
          tone: risk
        - id: thesis-break
          label: 逻辑破坏触发条件
          detail: BIS 叫停 HUMAIN 合作；2025 年收入 <$400M；Nvidia 版税拖累毛利率 >10%。
          type: process
          tone: risk
        - id: recommendation
          label: 投资建议：观察（MONITOR）
          detail: 在 2025 年收入未获证实达到 $450M+ 且 HUMAIN 资金调用缺乏约束力前，切勿以 $6.9B 估值买入。
          type: output
          tone: neutral
    claimRefs:
      - CV001
      - CV004
