      - number: '5.4'
        title: 性能基准、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              独立基准测试数据佐证了Groq在中等规模大语言模型推理上的性能领先优势。2024年1月，ArtificialAnalysis.ai记录到GroqCloud运行Llama 2
              70B的吞吐量达每秒241个Token——在当时所有受测推理服务商中位居榜首，同期同模型的GPU方案吞吐量不足每秒50个Token。到2024年11月，GroqCloud运行Llama 3.1
              8B时实现了800+ Token/秒的吞吐量。Groq内部宣称，其在200亿参数量级开源模型上可实现1,000+ Token/秒。GroqCloud的首字延迟（TTFT）约50毫秒，在实时AI
              Agent和语音交互等延迟敏感场景中位列同类最优。Groq自称推理速度比Nvidia H100快20x，但ArtificialAnalysis
              2025年10月的数据显示，针对700亿及以上参数的模型，Cerebras
              WSE-3的性能已超越Groq；Groq的领先区间集中在70亿至700亿参数模型。主要结构性技术风险在于SRAM架构上限：片上SRAM按Bit扩容成本高昂，限制了单张GroqCard在不跨多节点分布式切分的前提下所能承载的最大模型体量。这就导致LPU速度优势与模型规模呈反比——100B
              以上参数的前沿模型商业价值最高，恰好是Groq相比Cerebras WSE-3及GPU方案优势最微弱的区间。其他风险包括：Gen2 LPU晶圆对三星德克萨斯州泰勒工厂存在单一供应链依赖；尚未公开任何SOC 2
              Type II或FedRAMP合规认证，制约受监管企业采购；以及OpenAI兼容API带来的低切换成本——助推采用的特性也让客户在竞品具备价格或功能优势时极易切出。
            claimRefs:
