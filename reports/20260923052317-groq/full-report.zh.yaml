chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Groq, Inc. 是一家垂直整合的 AI 硬件与推理基础设施公司，总部位于加利福尼亚州山景城（硅谷）。公司由 Google 原版张量处理单元（TPU）核心设计者之一 Jonathan Ross 与联合创始人
              Douglas Wightman 于 2016 年创立，目标直指 AI 部署的核心瓶颈：推理延迟。Groq 的旗舰产品语言处理单元（LPU）是一款专为 AI
              推理打造的专用集成电路（ASIC），能提供确定性、超低延迟的 Token 生成能力，在多种工作负载下性能显著优于 GPU 方案。LPU 原名张量流处理器（TSP），采用以 SRAM
              为核心的单核架构，所有执行逻辑均由编译器静态调度，彻底摒弃了分支预测器、多级缓存等传统硬件调度机制。Groq 拥有两大商业化渠道：GroqCloud API（于 2024 年 2 月 19
              日上线的云端推理服务，按 Token 用量计费）与面向企业及政企客户的本地部署 LPU 方案。GroqCloud 完全兼容 OpenAI API，现有基础设施迁移成本极低。公司第一代 LPU 芯片由
              GlobalFoundries 采用 14 nm 工艺制造；第二代芯片则由 Samsung Electronics 在得州泰勒工厂采用 4 nm 制程投产。截至 2025 年 12 月，Groq
              依托北美、欧洲与中东的数据中心，已服务逾 280 万名开发者及众多《财富》500 强企业。
            claimRefs:
