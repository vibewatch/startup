      - number: '3.2'
        title: 竞品画像——体量、融资与战略
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems（2016 年创立于加州门洛帕克；CEO 为 Andrew Feldman）造出了全球最大单芯片——晶圆级芯片 3 代（WSE-3），配备 900,000 个 AI 核心与
              40GB 片上 SRAM，基于台积电 3nm 工艺打造。Cerebras 于 2025 年 9 月以 $8.1B 估值完成 $1.1B 的 Series G 轮融资，客户包括
              AWS、Meta、IBM、Mistral、DOE、GSK 和 Mayo Clinic。Cerebras 声称其在大模型上的吞吐速度是 Nvidia GPU 的 20x，并在 Hugging Face 上公布每月超
              5M+ 次请求。Cerebras 兼顾训练与推理，其目标市场相较 Groq 纯推理的 LPU 更宽广，且主打企业优先的销售模式，主攻国家实验室与受监管行业客户。SambaNova Systems（2017
              年创立于加州帕洛阿尔托；CEO 为 Rodrigo Liang）基于可重构数据流单元（RDU）架构打造了 SN40L 芯片，引入三层存储层级（SRAM + HBM + DRAM）。SambaNova 累计融资达
              $2.17B，但在 2025 年 10 月据报道由于新一轮融资受挫正寻求出售——这是定制芯片推理赛道承压的重大标志。SambaNova 的客户涵盖橡树岭国家实验室、劳伦斯利弗莫尔国家实验室（LLNL）、OTP
              银行和沙特阿美。Together AI（2022 年创立；CEO 为 Vipul Ved Prakash）于 2025 年 2 月完成由 General Catalyst 领投的 $305M Series B
              轮融资，估值达 $3.3B，依托 200+ 开源模型服务 450K+ 名开发者。Together 采用 Nvidia Blackwell GPU 与 FlashAttention-3
              内核，融合了训练、微调与推理能力。Fireworks AI（估值 $4B；截至 2026 年初年经常性收入（ARR）达 $315M；完成由 Sequoia 领投、NVIDIA 与 AMD 参投的 $250M
              Series C 轮融资）服务 Uber、Shopify、GitLab、Notion 及 DoorDash，通过自研 FireAttention CUDA 栈每日处理 10T+ Token。Nvidia（年收入超
              $130B+；占据 80–90% 的 AI 加速芯片市场份额）是绝对的行业霸主，其经推理优化的 Blackwell GPU（B200）衍生型号已开始出货，NIM 微服务在牢固的 CUDA
              软件栈之上提供了开箱即用的推理编排能力。
