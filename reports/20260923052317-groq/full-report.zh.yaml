  - id: TV004
    title: 投资逻辑与反向逻辑对照表
    columns:
      - 维度
      - 投资逻辑（乐观 / 基准）
      - 反向逻辑（悲观）
      - 扭转判断的证据
    rows:
      - - 推理速度护城河
        - LPU 在延迟敏感型负载上快 10–14×，可支撑溢价并形成开发者锁定效应
        - Nvidia Blackwell B200 吞吐量达到 H100 的 2.4×；若无新一代 LPU 推出，Groq 的速度优势到 2026 年将被腰斩
        - 实测基准数据证实，LPU Gen3 在 70B+ 大模型上仍保持 >5× 速度优势
      - - 开发者生态
        - 2.8M 名注册开发者构成不断滚大的转化漏斗；22 个月增长 40×，印证产品与市场契合
        - API 兼容 OpenAI 意味着零切换成本；开发者可以毫无门槛地转向更便宜的 GPU 云替代方案
        - 队列数据证实企业级 NRR >150%，展现出高粘性平台特征
      - - 收入增长轨迹
        - 收入同比激增 500%（2024→2025）支撑 13.8× P/S；CEO 确认 2025 年 $500M ARR 目标
        - 大宗商品化推理导致 ASP 承压，迫使降价并拖累 2026 年收入增速跌破 30%
        - 经审计的 2025 年收入确认达 $450M+，且进入 2026 年后仍维持 >30% 的 QoQ 环比增长
      - - HUMAIN 交易价值
        - $1.5B 分期基础设施收入承诺带来政府级 AI 顺风，提供多年业绩能见度
        - BIS 出口管制阻断 LPU 出货沙特；无约束力意向书（LOI）无法转化为实际收入
        - 具备约束力的采购订单及首批 LPU 交付里程碑获确认；沙特部署取得 BIS 出口许可证
      - - 退出选择权
        - 结合当前增长轨迹，2027 年按 $15–25B 估值 IPO，或按 $10–14B 估值被 Cisco、Samsung、IBM 等战略并购具备可信度
        - 业绩不及预期或遇监管事件，导致流血轮、低于 $7B 折价出售或取消 IPO；Series E 轮投资者面临亏损
        - 递交 IPO 申请，确认 $450M+ ARR 及经审计财务数据；获得两家或以上战略方的并购意向
      - - 估值倍数
        - 13.8× 2025E P/S 与 AI 推理可比同行中位数持平，且较基准情景内在价值折价 15–40%
        - 2024 静态 P/S 高达 76× 且缺乏审计财务数据，使当前 $6.9B 估值具有投机性
        - 经审计的 2025 年收入达 $450M+，将使历史倍数降至 <20×，从而夯实当前的估值入场点
    notes: >-
      投资逻辑与反向逻辑均基于现有证据，但前提建立在未经证实的收入与未经审计的财务数据之上。若具约束力的 HUMAIN 提款排期、经审计达 $450M+ 的 2025 年收入，以及 >120% 的企业级 NRR
      同时得到证实，估值立场将从“观察”上调至“买入”。
    claimRefs:
      - CV004
      - CV005
  - id: TV005
    title: 终审尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 责任方 / 尽调路径
    rows:
      - - 2022–2025 年经审计财务报表
        - 公开领域不存在 GAAP 利润表、资产负债表或现金流量表；所有收入与利润率数据均为第三方估算
        - 收入与毛利率主张是所有估值情景的基石；输入数据未经证实意味着基准情景 DCF 的偏差可能达 30–50%
        - 申请数据室权限，获取经审计利润表、毛利率拆解桥梁，以及按业务线（API、企业端、HUMAIN）细分的收入数据
      - - HUMAIN 合同——具约束力条款与提款排期
        - 该 $1.5B 承诺包含具备约束力的采购订单还是仅为意向书尚未获公开证实；提款里程碑不明
        - HUMAIN 交易为最大单笔收入承诺；若仅为无约束力意向书或部署停滞，乐观与基准收入情景将双双落空
        - 调阅主服务协议（MSA）、分期采购订单排期表、BIS 出口许可证审批进展，以及首批交付里程碑节点
      - - Nvidia 交叉许可专利费条款
        - 2025 年 12 月 Groq 与 Nvidia 达成的知识产权交叉许可具体条款、专利费率、使用领域限制与期限均未公开披露
        - 对 Nvidia 潜在的专利费支付义务将永久压缩毛利率，并与核心 GPU 现存巨头产生竞争层面的利益牵扯
        - 调阅交叉许可协议全文；核查专利费率、最惠国待遇条款、反向授权条款，以及 LPU Gen3 架构设计的自由实施（FTO）范围
      - - 企业级 NRR 与队列留存数据
        - 尚未公开披露任何企业级 NRR、流失率或队列留存指标；2.8M 注册开发者混杂了付费与免费层级
        - 基准情景 DCF 假设 Groq 能留存并扩大企业级收入；若 NRR 低于 100%，基准情景将直接滑向悲观情景
        - 调阅企业级队列报告，掌握按入驻年份划分的 NRR、收入结构（API、企业端与基础设施）以及前十大客户集中度
      - - 股权结构表与清算优先权（优先股堆叠）
        - Groq 完整股权结构表、Series E 轮清算优先权、反稀释条款及二级市场老股承压状况均未公开
        - 按 $6.9B 入场的 Series E 轮投资者在公司 IPO 或并购时可能面临来自早期轮次的沉重优先股堆叠；清算优先权可能大幅挤压普通股上行空间
        - 调阅包含优先股堆叠的完整资本化表格，核查参与制与非参与制优先股、反稀释条款及员工期权池规模
    notes: >-
      上述五项尽调诉求按对投资逻辑的影响程度排序。前两项（经审计财务报表与 HUMAIN 合同条款）属于否决项（blocking）；缺少这两项时，在 $6.9B 或更高估值作出积极投资决定纯属投机。第 3 至 5
      项性质重要，但在初步建仓规模决策中不构成否决项。
    claimRefs:
      - CV001
      - CV004
  - id: TV006
    title: 逻辑破缺与终止投资触发条件表
    columns:
      - 触发条件
      - 阈值 / 信号
      - 对投资逻辑的传导机制
      - 应对行动
    rows:
      - - BIS 对 LPU 的出口管制归类
        - BIS 规则调整将专用推理 ASIC 纳入范围；LPU Gen2 性能指标突破商业管制清单（CCL）限制阈值
        - 阻断 HUMAIN 沙特部署（涉及 $1.5B 收入承诺）；乐观与基准收入情景彻底失效；悲观情景概率升至 50%+
        - 立即上报；聘请出口管制律师介入；按 HUMAIN 收入 100% 减记建模；将隐含估值下调至 $2–3B
      - - Groq 2025 年收入低于 $350M 未达预期
        - 2025 年底确认收入低于 $350M（较 $500M 目标偏差超 30%）；标志着 HUMAIN 订单未能兑现且市场份额流失
        - 基准情景直接滑向悲观情景；若收入仅为 $350M，13.8× 预期 P/S 意味着当前估值显著高估；下一轮股权融资大概率为流血轮
        - 减仓；在重新考虑前，必须获得确凿的 HUMAIN 具约束力提款证明及经审计收入数据
      - - Nvidia 交叉许可专利费超过收入的 10%
        - 法院文件、媒体报道或并购尽调披露，Groq 须向 Nvidia 支付超过 GroqCloud/LPU 收入 10% 的专利费
        - 永久将毛利率从 35–45% 压缩至 25–35%；2026 年实现现金流转正的承诺破灭；DCF 终值下调 20–30%
        - 立即下调评级；按调整后的利润率假设重新测算 DCF；评估在利润率承压下 IPO 是否仍具可行性
      - - Cerebras 或 Together AI 拿下企业级推理市场 >30% 份额
        - 第三方基准测试、Sacra/PitchBook 收入估算或企业调研数据表明，单一 GPU 云竞争对手拿下了超 30% 的推理市场份额
        - 速度优势作为企业决策关键考量的溢价遭到侵蚀；ASP 下跌加速；缺乏平台差异化将使 13.8× P/S 难以为继
        - 按季度监控 ArtificialAnalysis 基准表现及竞争对手的融资/ARR 进展；在追加资金前必须获得 NRR 真实数据
      - - HUMAIN 合同证实仅为无约束力意向书
        - 法律文件、尽调审查或媒体调查证实，HUMAIN 协议缺乏具备约束力的采购订单或可强制执行的交付里程碑
        - 收入逻辑失去最核心支柱；悲观情景沦为基准情景；缺少独立收入承诺支撑增长轨迹
        - 启动全面数据室审查；调阅合同全套法律文件；在确认具备约束力条款前暂缓任何追加出资
    notes: 逻辑破缺触发条件按严重程度 × 紧迫性排序。前三项目前无法通过公开渠道查证——须进入数据室或通过监管披露核实。触发阈值尽可能量化；任何一项单独触发，均会使概率加权内在价值跌破 Series E 轮 $6.9B 的入场估值。
    claimRefs:
      - CV001
      - CV002
