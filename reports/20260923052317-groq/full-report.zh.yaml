      - number: '3.4'
        title: 护城河壁垒与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Groq 的核心护城河主张立足于底层架构：LPU 具备确定性、以 SRAM 为中心的设计，由此带来的延迟和能效优势，Nvidia GPU 在不放弃 CUDA
              通用执行模型的前提下很难轻易复制。然而，这一护城河正面临四大结构性威胁。首先，Nvidia 的 Blackwell B200 GPU 引入了针对推理优化的显存配置与 NIM
              微服务，大幅收窄了批量推理场景下的延迟差距。Barclays 估计到 2030 年，非 Nvidia 芯片仅能占据推理加速卡市场约 10–15% 的份额，而 Nvidia 长期来看将稳守 50%+。其次，SRAM
              SRAM 容量受限是公开的硬伤：未经量化时，Groq 现有芯片难以经济地规模化运行超过约 70–80B 参数的模型；当前沿模型扩展到 100B–1T+ 参数，其竞争空间会受到挤压。第三，Forbes 分析师
              Karl Freund 于 2025 年 10 月撰文指出，若定制 ASIC 阵营到 2030 年的总市场份额仅能达到 5%，“三家定制 ASIC 初创公司中可能只能活下一家”——这对 Groq、Cerebras
              与 SambaNova 构成了直接的反向信号。第四，SambaNova 在新一轮融资告吹后于 2025 年 10 月寻求出售，是定制芯片推理全行业募资困难的风向标。从锁定效应来看，Groq
              凭借极低的开发者切换成本（兼容 OpenAI API）获益，但这既是获客优势，同样也是留存隐患——开发者改换一行 Endpoint 即可瞬间迁移至 Together AI 或
              Fireworks。供应链及伙伴通道上，Groq 的 Samsung 4nm 代工协议与 GlobalFoundries 14nm
              合作史提供了一定产能保障，但所有自研芯片厂商在下一代制程演进上都承受着长达数年的流片周期与重资本压力。2025 年 12 月规模约 $20B 的 Nvidia 技术授权交易，以及创始人 Jonathan Ross
              与总裁 Sunny Madra 出走 Nvidia，既是巨额资本注入，也释放了 Groq 作为独立实体难以留住核心创始班底的反向信号。
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP004
