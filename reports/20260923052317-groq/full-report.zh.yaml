      - number: '4.3'
        title: 成本结构、单位经济模型与毛利率
        blocks:
          - type: paragraph
            body: >-
              Groq 的成本构成主要分为三块：LPU 硬件资本开支（自 Samsung 4nm 晶圆厂采购芯片）、数据中心运维（机房托管与电力消耗），以及研发与工程团队的人力支出。赋予其极致推理速度的 SRAM
              核心架构，同时也埋下了结构性成本短板：SRAM 存储密度比 NVIDIA GPU 所用的 HBM 低几个数量级，且单字节造价昂贵得多，每张 LPU 加速卡成本高达约 $20,000。沉重的硬件成本将
              GroqCloud API 业务的毛利率压制在估计 35–45% 的水平——虽然随算力利用率提升有所改善，但依然大幅低于纯软件 SaaS 典型的 60–70%+。参考 Samsung 代工制造成本基准，LPU
              硬件的年资本开支估计为 $50–100M。日常运营消耗包含硬件折旧摊销，外加研发工程人员薪酬 $60–80M 与数据中心开销 $30–60M。2024 年估计总消耗（Burn）在 $150–200M
              之间。开发者端，Groq 的单位经济模型有利于获客：开发者驱动的扩散路径意味着单个 API
              用户的获客成本（CAC）趋近于零，但企业级订单离不开售前方案工程投入，这部分开销尚未公开量化。每位开发者贡献的平均年收入估计在 ~$178，但大头高度向头部企业客户倾斜。净留存率（NRR）、LPU 算力利用率以及
              LPU 资本开支的回本周期均属核心盲区，必须获取内部计费数据方能穿透。
