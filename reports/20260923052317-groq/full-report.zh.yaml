      nodes:
        - label: 全球 AI 推理市场 TAM：约 $106B（2025 年）
          detail: MarketsandMarkets 全球测算值，包含 GPU、CPU、ASIC 硬件及云服务。覆盖邻近训练领域及所有部署模式。并非全部属于 Groq 的可触达范围。
