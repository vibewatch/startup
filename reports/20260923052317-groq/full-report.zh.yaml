      - number: '5.2'
        title: 产品组合与服务层级
        blocks:
          - type: paragraph
            body: >-
              Groq 的商业化产品矩阵涵盖两大核心交付路径：基于云端的 API 推理服务 GroqCloud，以及本地部署的 LPU 硬件系统 GroqRack。GroqCloud 是公司的核心增长引擎：提供兼容
              OpenAI 的 REST API，支持对话补全（chat completions）与音频转录请求，开发者从 OpenAI
              或其他兼容接口迁移无需改动业务代码。该服务分为三个层级——免费版（设有限流的开发者权限）、Growth/Pro 版（更高限流、按 Token 用量计费）与 Enterprise 企业版（提供 SLA
              保障、定制资费及专有部署），打通了从前期测试到生产落地的拓展路径。支持的开源模型包括 Meta Llama 2 系列（7B、13B、70B）、Llama 3 及 Llama
              3.1（8B、70B、405B）、Mistral 7B、Mixtral 8x7B、DeepSeek-R1 蒸馏衍生版、面向语音转文本的 OpenAI Whisper，以及用于内容安全审查的 Meta Llama
              Guard。受单颗 LPU 的 SRAM 容量限制，Llama 3 405B 必须拆分到多个 GroqNode 上运行，因此即使是当前支持的最大模型，也会产生节点间通信延迟。GroqRack
              面向有物理隔离或本地部署诉求的政企客户，集成了 KQUE——Groq 专为数据中心机架集成定制的高密度散热与供电系统。2024 年 3 月，Groq 收购了 Definitive Intelligence，为
              GroqCloud 平台补齐了 AI 分析与自然语言商业智能能力，推动产品线从纯推理 API 拓展至分析类场景，但二者的整合成熟度未见公开记录。
            claimRefs:
              - CE001
              - CE002
