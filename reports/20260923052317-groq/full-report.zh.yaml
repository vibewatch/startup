          tone: positive
        - label: Groq 2025 年预估收入：约 $500M（占 IaaS SAM 约 3–5%）
          detail: 仅为第三方估算数据，未经审计。反映出公司在 IaaS 推理层占有重要但非主导的份额。较 2024 年约 $90M 实现强劲增长。
