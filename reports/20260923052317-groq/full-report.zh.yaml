      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >-
              Groq 由 Jonathan Ross 牵头创立，他此前在 Google 共同发明了张量处理单元（TPU）——堪称计算史上最具影响力的 AI 加速架构之一。Ross 自创立起一直担任 CEO，直到 2025 年
              12 月因非独家授权协议转投 Nvidia。联合创始人 Douglas Wightman（曾任职于 Google X）曾任首任 CEO，后离职，具体离职原因未向外界披露。后 Ross 时代的管理团队包括：2025
              年 9 月获任 CFO、并于 2025 年 12 月接任 CEO 的 Simon Edwards；2024 年 8 月加入担任 COO 的 Stuart Pann（曾任 Intel 及 HP
              高管），负责扩张运营规模；国际业务总裁 Mohsen Moazami（前 Cisco 高管）主导全球商业化拓展，包括规模达 $1.5 billion 的沙特合作项目；首席营收官 Ian Andrews 于
              2025 年 12 月出席了白宫创世纪任务（Genesis Mission）活动；Chelsey Susin Kantor 担任首席营销官。2024 年 8 月，Meta 首席 AI 科学家、图灵奖得主 Yann
              LeCun（亦是 Ross 在纽约大学期间的计算机系导师）出任技术顾问。Groq 董事会构成尚未公开披露，构成尽调层面的实质性治理缺口。关键人风险高度集聚：公司在单次交易中同时失去了创始人兼 CEO
              与总裁，而继任 CEO 尚无公开的掌舵半导体或云基础设施公司履历。
            claimRefs:
              - CO002
              - CO003
