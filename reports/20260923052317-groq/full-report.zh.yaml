      - number: '3.3'
        title: 能力对标——定价、GTM 与信任背书
        blocks:
          - type: paragraph
            body: >-
              单 Token 标价来看，GroqCloud API 针对 DeepSeek-R1 级模型的定价约在每 100 万输入 Token $0.75 与每 100 万输出 Token $0.99——比 Together
              AI（每百万 $3.00/$7.00）和 Fireworks AI（每百万 $3.00/$8.00）大约便宜 4–8x。然而，Groq 以 SRAM 为核心的架构限制了支持的模型尺寸：一旦模型超出片上 SRAM
              容量（当前一代 LPU 约 70B–80B 参数），在未经量化或分片的情况下便无法在 GroqCloud 上运行；相比之下，GPU 云厂商只要显存充裕即可加载任意模型，涵盖 405B+ 参数规模。据
              Artificial Analysis 的基准测试显示，Cerebras 在 Llama 3.1 405B 等超大模型上的原生 tokens-per-second 吞吐量超过了
              Groq；但在中等规模模型（Llama 3.1 70B 及以下）上，Groq 依然保持领跑。GTM 推进路径上，Groq 由开发者主导的飞轮（GroqCloud 免费套餐；2.8M+ 注册开发者；兼容
              OpenAI API）与 Together AI 的开发者优先打法如出一辙。Fireworks AI 则在企业级销售与生产级 SLA 上发力更猛，其 $315M 年经常性收入（ARR）便是明证。Groq
              缺乏公开披露的 SOC 2 Type II、FedRAMP 或 HIPAA BAA 认证，在一定程度上制约了政企客户的采购落地。Cerebras 与 SambaNova 拥有比 GroqCloud
              更深厚的联邦机构合作渊源（DOE、DOD 及国家实验室）。所有非超大规模云厂商的推理供应商，其分发主要依赖直销或开发者社群驱动；尚无一家建立起成规模的渠道分销体系。GPU 云厂商可以直接上架 AWS、Azure
              和 GCP 的云市场（Marketplace），而 Groq 的自研芯片目前尚无法以托管服务形态原生接入主流超大厂的云市场。
