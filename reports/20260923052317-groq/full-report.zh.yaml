        - label: 云端 AI 推理即服务 SAM：约 $10B–$20B（2025 年）
          detail: 仅统计 API 优先的托管大模型推理。按占比 TAM 约 10–20% 的云服务部分推算得出。属于 Groq 最核心的收入板块。
