      - number: '2.3'
        title: 市场细分——买方、用户与付费决策者
        blocks:
          - type: paragraph
            body: >-
              AI 推理市场依据部署模式、买方成熟度与成本敏感度呈现出清晰分层。超大规模云厂商（AWS、Azure、Google
              Cloud、Oracle、Meta）在收入和算力规模上占据最大份额，但它们主要自建自研推理基础设施，而非采购 Groq 这类专业 IaaS 供应商的服务。IaaS / API 优先赛道是 Groq
              的主战场，同台竞技的对手包括 Together AI（General Catalyst 领投，估值 $3.3 billion）、Fireworks AI、Cerebras
              Systems、SambaNova、Baseten 与 DeepInfra。金融服务、医疗健康、传媒及政府领域的企业买方在采购 API 厂商的推理算力时，核心考量延迟、吞吐量、合规要求与总体拥有成本。Groq
              主打开发者优先的去向市场（GTM）策略（截至 2024 年 8 月聚集 360,000+ 名开发者；到 2025 年 12 月突破 280 万 名）：开发者因速度优势、极简集成门槛（兼容 OpenAI
              API）和充裕的免费额度自发选用
              Groq，进而驱动企业级采购转化。联邦政府及国家实验室买方（DOE、ALCF）规模虽小但客单价极高，其科学计算场景对确定性、高复现性的推理性能有着差异化刚需。各细分赛道的预算决策者在生产级负载上通常为 IT /
              云基础设施负责人，实验与开发阶段则由 AI / ML 工程团队把控。采购周期跨度极大，从自助获取 API Key 的即时开通，到企业及联邦合约长达 6–24 个月的审批流程不等。
            claimRefs:
              - CM001
              - CM002
