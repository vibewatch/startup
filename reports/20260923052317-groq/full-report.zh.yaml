        - 密切关注 Nvidia H200/B200 推理效率的提升幅度
      - - CUDA 生态锁定效应
        - 制约因素
        - 持续存在
        - 开发者切换成本高昂；Groq 靠免费层级与低门槛切入突围
        - 监控去 CUDA 开发者采纳曲线与 Groq SDK 生态广度
      - - LPU 的 SRAM 限制模型参数上限
        - 制约因素
        - 当下
        - 若不靠多芯片组网，Groq 无法承载超大模型（>70B 参数）；限制了市场覆盖面
        - 问询 Groq：LPU v2 模型规模支持及 400B+ 超大模型路线图
      - - 大规模部署下的能耗瓶颈
        - 制约因素
        - 初现端倪（1–3 年）
        - 电力成本制约数据中心建设；LPU 的能效优势或成破局点
        - 在满载运行场景下比对 LPU 与 H100 的 Tokens/Watt 能效表现
      - - 企业级市场的合规与监管不确定性
        - 制约因素
        - 持续存在
        - 企业级采买须具备 FedRAMP、HIPAA、SOC2 认证；Groq 目前资质尚不明确
        - 核实 Groq 当前获得的合规认证资质（如 SOC2、ISO 27001）
      - - 推理 IaaS 服务商全行业价格战
        - 制约因素
        - 持续存在
        - 单 Token 收入持续下滑；需依赖业务规模放量以维持总营收
        - 测算收入敏感性模型：降价 50% 对比用量增长 3x的收益变化
    notes: >-
      阶段划分定义：当下 = 2025–2026 年处于活跃期；近期 = 12–24 个月；初现端倪 = 2–4 年。SRAM 模型规模上限系 Groq LPU v1/v2 架构特有限制。Groq
      的合规资质状态未在公开信息中获得独立核实。
