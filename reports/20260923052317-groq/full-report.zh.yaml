      - number: '2.4'
        title: 增长驱动因素与普及制约
        blocks:
          - type: paragraph
            body: >-
              AI 推理市场受到四大结构性红利的强力驱动：(1) 据 OpenAI CEO Sam Altman 称，同等 AI 能力等级的成本每 12 个月下降约
              10x，此前受限于成本的场景逐步跑通，带动需求指数级爆发；(2) 推理模型（DeepSeek R1、OpenAI o3、Anthropic Claude
              3.7）单次查询在推理阶段消耗的算力远超上一代模型，大幅推高了单次会话的平均推理成本，催生出对高能效硬件的旺盛需求；(3) 据 J.P. Morgan 统计，超大规模云厂商的 AI 资本开支从 2023 年的
              $126 billion 激增至 2024 年的 $197 billion，预计 2025 年将达 $234 billion，有力支撑了底层基础设施的持续扩张；(4) Barclays 估计前沿 AI
              领域的推理资本开支将从 2025 年的 $122.6 billion 跃升至 2026 年的 $208.2 billion，替代芯片最终将拿下 Nvidia 推理市场 50%+
              的份额。核心普及制约则包括：CUDA 软件生态构筑的绝对护城河（Nvidia 生态沉淀逾 10 年的开发工具，开发者面临极高的切换成本）；规模化运行下的能耗压力（据 Forbes
              报道，含电力在内的推理开销现已占到模型全生命周期总成本的高达 90%）；以 SRAM
              为核心的架构在支持模型尺寸上天花板明显，限制了参与竞争的模型跨度；定制芯片流片制造的极高资本密集度；以及医疗与金融行业因监管合规的不确定性，拖慢了企业接入第三方推理 API
              的步伐。推理市场还面临价格持续跳水的压制：推理成本同比大幅下挫，即便调用量飞速攀升，各厂商的每 Token 收入空间仍在被不断挤压。
