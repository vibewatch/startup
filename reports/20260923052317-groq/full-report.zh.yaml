      - number: '8.2'
        title: 可比公司分析与市场估值倍数
        blocks:
          - type: paragraph
            body: >-
              与Groq业务最直接的可比对象，是已公开估值的私营AI推理公司：Cerebras Systems（2025年9月$8.1B，2025年预估$510M，约 16× P/S）、Fireworks
              AI（2025年10月$4.0B，ARR 约 $315M，约 12.7× P/S）以及Together AI（2025年2月$3.3B，ARR 约 $200M，约 16.5× P/S）。Lambda
              Labs（$1.5B，ARR 约 $400M，约 3.8× P/S）代表纯粹的GPU算力租赁，平台溢价较低，属于部分可比标的。同属推理ASIC初创阵营的SambaNova Systems在2025年估值滑落至估计
              $1.5–2B，并寻求出售或破产重组等战略替代方案——这为悲观情景提供了敲响警钟的惨痛前例。在部分可比标的中，CoreWeave于2025年3月以约$19–20B 估值 IPO（对应2024 年 $1.9B
              收入，约 10× P/S），构成了公开市场上唯一的算力锚点。Databricks（估值 $43B，ARR $1.6B，约 27× P/S）与Scale AI（估值 $14B，收入约 $1B，约 14×
              P/S）展示了平台型与数据网络效应企业所享受的高溢价，而这正是Groq尚未构建成型的能力。Nvidia（市值约 $3T，收入 $130B，约 23× P/S）与AMD（市值约 $250B，收入 $24B，约
              10× P/S）则锚定了公开市场半导体龙头的估值上限。2025年私营AI推理领域EV/Revenue中位数大约在13–16× 区间。Groq 的
              13.8×恰好位于该估值带低端，表明市场尚未计入平台溢价——考虑到经审计财报缺失及纯推理定位压制TAM上限，这一折价合情合理。PitchBook与CB
              Insights一级市场数据显示，AI基础设施企业估值倍数已较2021至2022年巅峰时期挤压了20–40%，估值环境日趋审慎，Groq现阶段的估值中枢必须持续依赖过硬的业绩兑现来证明合理性。
            claimRefs:
