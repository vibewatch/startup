      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: SRAM 架构天花板限制竞争半径
            body: >-
              Groq LPU 以 SRAM 为核心的设计既是其最硬核的速度底牌，也是公开证据中最突出的竞争瓶颈。当前一代 LPU 硬件在未经量化时，难以高效承载超过约 70–80 billion 参数的模型；反观
              Cerebras WSE-3（40GB SRAM）与 SambaNova SN40L（三层存储架构）均可从容应对更大体量的模型。当前沿模型规模突破 100B 参数大关，除非 Groq
              下一代芯片能够大幅扩充片上存储容量，否则其竞争半径势必收窄。Forbes 分析师 Karl Freund 此前发出预警称，若到 2030 年定制 ASIC 阵营合计仅占 5%
              份额，三家初创公司可能仅有一家能够存活，这进一步凸显了突破该项瓶颈的紧迫性。
            calloutType: insight
            claimRefs:
              - CP001
          - type: callout
            title: SambaNova 陷入困境对 Groq 既是警讯亦是战机
            body: >-
              SambaNova Systems 在新一轮融资碰壁后于 2025 年 10 月寻求出售，这一信号表明定制芯片 AI 推理极高的资本开支已将三大主流 ASIC 初创公司中的至少一家逼入险境。对 Groq
              而言，这一态势兼具反向风险与商业机遇：一方面坐实了该细分赛道面临普遍的融资难题；另一方面，一旦 SambaNova 战略前景未卜，其在联邦政府及国家实验室（橡树岭、LLNL）沉淀的客群可能向 Groq 的
              GroqRack 销售团队敞开大门。尽管 Groq 累计融资超 $1.5B+，加之 2025 年 12 月来自 Nvidia 的技术授权资金提供了相对宽裕的资金缓冲，但领导层换届依然带来了执行层面的不确定性。
            calloutType: insight
            claimRefs:
              - CP001
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价体系
        blocks:
          - type: paragraph
            body: >-
              Groq 的变现路径主要依托三大支柱：(1) GroqCloud 按 Token 计费的 API 调用；(2) 锁定专属算力的企业级 API 合约；(3)
              基础设施战略合作——其中体量最大的当属沙特阿拉伯王国承诺的 $1.5B HUMAIN 合作项目。此外公司还拥有刚起步的本地部署 GroqRack 硬件业务，但定价细节与收入贡献均未公开披露。GroqCloud
              是能见度最高且最易追踪的业务线，采取按 Token 付费机制，公开标价为：Llama 3.1 70B 模型每 1M 输入 Token $0.59、每 1M 输出 Token $0.79；Llama 3.1 8B
              等小模型每 1M 输入 Token $0.05。这一资费水平显著低于高端 GPU 云端 API。企业级合约方面，公司声称起售价为每年 $500,000，保障独享 LPU
              算力与服务等级协议（SLA），但实际平均客单价（ASP）与签约客户数未曾对外公布。HUMAIN
              合作采取分期确认的基础设施收入架构，并非股权注资——即收入随算力节点逐步交付而分批确认，而非一次性前置到账。确认节奏与提款进度是现金流建模中最大的未知数。开发者
              API、企业级客群与基础设施三大板块的营收占比未公开拆解，在缺乏完整尽调资料室（Data Room）的情况下，无法独立核算客户集中度风险及各板块的利润率贡献。Groq 的商业变现极大受益于兼容 OpenAI
              API，显著消除了开发者的迁移摩擦。
            claimRefs:
