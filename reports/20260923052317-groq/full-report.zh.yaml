      - number: '6.4'
        title: 收入集中度、留存信号与反向证据
        blocks:
          - type: paragraph
            body: >-
              无论从客群细分还是单一客户维度考量，Groq的收入基本盘均暴露出显著的集中度风险。占客户总数约25%的企业客户贡献了预估70%的收入，致使即便流失极少数企业账户，整个业务体系也将承受剧烈震荡。沙特HUMAIN高达$1.5
              billion（15 亿美元）的承诺若按计划于2025至2026年确认，将构成畸高的单一大客收入比重——在未见多元化平衡指标披露的前提下，这是严重的结构性隐患。Groq 尚无公开的 NRR 或 NDR
              等净留存率指标，对评估企业客户留存构成了反向信号。按API型AI基础设施行业的通用标准，优质企业级NRR通常在120%以上；在缺乏公开披露的情况下，投资人只能将Groq的客户增购动能视作未获验证。客户满意度反馈喜忧参半：G2平台企业与开发者用户给GroqCloud打出了4.4星（满分5星）评价，盛赞其速度与开发者体验，但相比OpenAI，频繁限流和可选模型有限被指出为短板。Reddit的r/LocalLLaMA社区披露过多起GroqCloud高负载限流打断开发流程的投诉，部分开发者明确转向竞品。The
              Information于2025年8月报道，Groq切换成本极低引发了结构性流失风险，这一趋势在开发者层级客群中尤为明显，尽管企业级数据仍未公开。Together AI自称拥有超 450k
              名开发者，Fireworks
              AI宣称服务逾万家客户，无不表明Groq开发者端的留存面临强劲挤压。追求极致速度的企业客户可能粘性更稳固，但鉴于合同周期、续约率及客户留存等关键指标皆未公开，公开信源无法支撑起定量的留存测算。
