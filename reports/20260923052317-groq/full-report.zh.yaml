      - number: '8.3'
        title: DCF 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              三情景DCF模型构成本次估值建议的核心分析支柱。鉴于公司在商业化确定性上尚不牢固、处于未上市阶段且兼具硬件云属性、缺乏经审计财报且面临实质性监管敞口，各情景统一采用30%折现率。乐观情景（30%概率）：得益于HUMAIN合同全面兑现、Gen3
              LPU速度跃升以及向Agent工作负载拓宽，营收从2025年$500M以60%复合年均增长率（CAGR）飙升至2030年$5B；随着SRAM成本随规模效应摊薄及软件层成功变现，2030年毛利率升至60%；按20×
              EV/Revenue测算终值达$100B；以30%折现率折现至当下，对应当前内在估值区间为$18–25B。以$6.9B估值入局的Series
              E投资人可斩获2.6–3.6×回报。基准情景（50%概率）：营收从2025年$500M增至2030年$2.5B（38% CAGR）；随着机房利用率爬坡，毛利率修复至45%；按12×
              EV/Revenue计算终值为$30B；折现至当下对应当前内在估值为$8–12B。Series
              E的$6.9B估值较基准情景内在价值具备15–40%的温和安全边际——具备吸引力但容错率有限。悲观情景（20%概率）：因Nvidia Blackwell抹平性能差距、云巨头自研ASIC（AWS
              Trainium3、Google TPU v7）大举挤占市场、且HUMAIN项目在BIS出口管制重压下停滞，2030年营收减速至$800M（14% CAGR）；2030年毛利率仅为30%；按6×
              EV/Revenue测算终值为$4.8B；折现至当下对应估值仅为$2–3B。在此情景下，现行$6.9B估值存在2–3×的高估溢价。综合各情景概率加权后，内在价值中枢约为$9.5–12B——表明只要基准或乐观逻辑能顺利落地，Series
              E入场价较预期内在价值确有可观折价。
            claimRefs:
              - CV001
              - CV002
