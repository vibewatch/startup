      - number: '5.3'
        title: 开发者生态与 API 体验
        blocks:
          - type: paragraph
            body: >-
              GroqCloud 的开发者增长速度，在已有记录的 AI 基础设施 API 中处于最快之列：2024 年 2 月公开上线后的首月，有 70,000 名开发者注册；到 2024 年 8 月增至 360,000
              名，2025 年 12 月达到 280 万名。增速主要来自兼容 OpenAI 的 API 设计：已接入 OpenAI 的开发者只需修改一个端点 URL 和 API 密钥，无需重构代码，即可切换至
              GroqCloud。官方为 Python（PyPI 上的「groq」包）和 TypeScript / JavaScript（npm 上的「groq-sdk」包）发布客户端库，并提供直接访问 REST 接口的
              cURL 示例。生态集成包括 LangChain、LlamaIndex、LiteLLM、n8n、Flowise 和 PrivateGPT，让 GroqCloud 成为主流 AI
              编排框架即插即用的推理后端。GroqCloud API 客户端库的 GitHub 仓库合计拥有逾 10,000 颗 Star；结合平台上线时间看，这反映出较强的社区参与度。Groq 还运营活跃的开发者
              Discord，设有专门的支持频道、API 状态公告和社区作品展示主题帖。开发者文档门户 console.groq.com/docs 提供 API 参考、快速入门指南、模型卡片、速率限制文档及迁移指南。通过
              Hugging Face 提供模型，进一步扩大了生态覆盖；开发者可经 Hugging Face 推理 API 访问 Groq 托管的模型端点。HeliconeAI 的公开 API 分析数据显示，GroqCloud
              持续位居开发者 AI API 类别中调用量最大的推理端点之列，为社区采用情况提供了公司自报开发者数量之外的佐证。
