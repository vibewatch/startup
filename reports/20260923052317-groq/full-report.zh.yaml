          - type: callout
            title: 推理反超训练——利好 Groq 架构的结构性市场转向
            body: >-
              Morgan Stanley 估计未来数年内数据中心逾 75%的算力需求将流向推理。Barclays 估计到 2026 年，前沿 AI 的推理资本开支将反超训练，达到约 $208B。就连 Nvidia
              自身亦预测替代方案将占据 50% 的长期推理市场份额，意味着流向非 Nvidia 推理芯片的开支将达约 $200B。Groq 的 LPU 正是为这一历史性拐点而生。核心风险在于：在 Groq 这类专业云端
              IaaS 厂商完成规模化扩张前，Nvidia 经推理优化的 Blackwell 芯片以及超大规模云厂商的自研芯片（Google TPU、AWS Inferentia、Microsoft
              Maia）是否会吃下绝大部分增量红利。
