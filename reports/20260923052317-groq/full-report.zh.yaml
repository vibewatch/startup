  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: LPU 架构与技术创新
        blocks:
          - type: paragraph
            body: >-
              Groq 的语言处理单元（LPU）是一款专为 AI 推理（而非训练）定制开发的专用集成电路（ASIC）。LPU 底层架构的核心洞察在于：基于 GPU 的推理瓶颈并非算力 FLOPS，而是内存带宽——在每个
              Token 生成步骤之间从 DRAM 反复搬运模型权重，制造了 GPU 无法消除的延迟。Groq 给出的解法是以 SRAM 为核心的设计，将整张模型计算图映射至片上 SRAM，彻底省去了每个 Token 读取
              DRAM 的开销。LPU 采用单核架构，不设缓存层级、分支预测以及推测执行逻辑。取而代之的是 GroqFlow
              编译器在编译期完成所有操作的静态调度——这种“无内核（Kernel-Free）”执行模型在硬件通电运行前，便已完整锁定了整套模型的执行路径。这带来了确定性的超低延迟：无论 Batch Size
              大小或并发请求负载高低，给定的模型配置单 Token 耗时恒定不变；由于 GPU 的动态调度机制必然引入天然的波动性，其架构根本无法复现这一特性。第一代 LPU 由 GlobalFoundries 采用 14nm
              工艺代工，拥有 2.3 亿个晶体管，提供 900 GB/s 的片上内存带宽。第二代 LPU 在 Samsung 得州泰勒晶圆厂采用 4nm 制程节点代工，已于 2025
              年投入量产部署，晶体管密度更高、吞吐表现更优，但详细技术规格仍未公开。GroqCard（PCIe 加速卡）可拼装为 GroqNode 和 GroqRack——后者为 9U 机架单元，内置 8 个
              GroqNode（共 64 张 GroqCard），合计提供约 5.6 TFLOPS FP16 峰值算力。Groq 于 2022 年 3 月收购了 Maxeler Technologies，将其基于 FPGA
              的数据流计算专长与高性能计算（HPC）知识产权注入了底层架构。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
