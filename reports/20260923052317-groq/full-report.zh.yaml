companyProfile:
  summary: >-
    Groq 是一家总部位于加州山景城的 AI 推理基础设施公司，自研语言处理单元（LPU）芯片，主攻确定性、超低延迟的 Token 生成。Groq 的 LPU 架构依托以 SRAM 为核心的设计与静态编译，消除了 DRAM
    读写瓶颈；公司如今将这一底层积淀与全球推理云相结合，打造出基于 GroqCloud 和 LPX/Nvidia 支持的算力集群。Groq 借助分布在 13 处数据中心的节点，服务超过 600 万名开发者和数千家 AI
    原生企业，但当前收入与员工数基本未对外披露。
