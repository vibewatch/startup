- id: SO002s
  title: Founding Team and Leadership
  body: 'Groq''s founding was led by Jonathan Ross, who at Google co-invented the Tensor Processing Unit (TPU) — one of the
    most influential AI acceleration architectures in history. Ross served as CEO from founding until December 2025, when
    he transitioned to Nvidia as part of a non-exclusive licensing agreement. Co-founder Douglas Wightman (ex-Google X) served
    as the company''s first CEO before departing; the circumstances of his departure were not publicly disclosed. The post-Ross
    leadership team includes Simon Edwards, appointed CFO in September 2025 who became CEO in December 2025. Stuart Pann (former
    senior executive at Intel and HP) joined as COO in August 2024 to scale operations. Mohsen Moazami, President of International
    and a former Cisco executive, leads global commercial expansion including the $1.5 billion Saudi Arabia initiative. Ian
    Andrews serves as Chief Revenue Officer and attended the White House Genesis Mission event in December 2025. Chelsey Susin
    Kantor is Chief Marketing Officer. In August 2024, Meta''s Chief AI Scientist Yann LeCun — a Turing Award winner and former
    computer science professor of Jonathan Ross at NYU — joined as technical advisor. Groq''s board composition is not publicly
    disclosed, representing a material governance gap for diligence purposes. Key-person risk is elevated: the company lost
    its founder-CEO and President in a single event, and the successor CEO has no public track record running a semiconductor
    or cloud infrastructure company.'
  claimRefs:
  - CO002
  - CO003
  tableRefs:
  - TO002
- id: SO003s
  title: Funding History and Capital Structure
  body: Groq has raised approximately $1.5 billion in disclosed equity financing across six rounds between 2017 and September
    2025, plus a $1.5 billion infrastructure commitment from the Kingdom of Saudi Arabia announced in February 2025. The company
    received a $10 million seed round in 2017 led by Social Capital (Chamath Palihapitiya), followed by additional early-stage
    capital in 2018. In April 2021, the $300 million Series C — led by Tiger Global Management and D1 Capital Partners — vaulted
    Groq to unicorn status at over $1 billion valuation. The August 2024 Series D ($640M at $2.8B valuation, led by BlackRock
    Private Equity Partners) included strategic investors Samsung Catalyst Fund (the semiconductor manufacturer for LPU v2)
    and Cisco Investments (aligned with Groq's Bell Canada and enterprise telco plays). Morgan Stanley served as exclusive
    placement agent. The September 2025 Series E ($750M at $6.9B) was led by Disruptive — a Dallas growth fund that invested
    nearly $350 million in this single round — with continued participation from BlackRock, Samsung, Cisco, D1, Altimeter,
    1789 Capital, and Infinitum. In December 2025, Nvidia agreed to license Groq's inference technology in a deal valued at
    approximately $20 billion, described by Groq as a non-exclusive licensing arrangement. Groq's 2023 revenue was reported
    at $3.4 million against a net loss of $88 million; 2025 estimated revenue of $500 million reflects the dramatic post-ChatGPT
    acceleration, though exact figures have not been independently audited.
