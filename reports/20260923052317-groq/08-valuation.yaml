- id: TV004
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Investment Thesis (Bull / Base)
  - Anti-Thesis (Bear)
  - Evidence That Would Change the View
  rows:
  - - Inference Speed Moat
    - LPU delivers 10–14× speed advantage enabling pricing premium and developer lock-in for latency-sensitive workloads
    - Nvidia Blackwell B200 achieves 2.4× H100 throughput, halving Groq's speed gap by 2026 without new LPU generation
    - LPU Gen3 maintains >5× speed advantage on 70B+ models with confirmed benchmark data
  - - Developer Ecosystem
    - 2.8M registered developers = compounding funnel; 40× growth in 22 months demonstrates product-market fit
    - OpenAI-compatible API = zero switching cost; developers migrate to cheaper GPU-cloud alternatives without penalty
    - Enterprise NRR >150% confirmed by cohort data, demonstrating sticky platform behavior
  - - Revenue Growth Trajectory
    - 500% YoY revenue growth (2024→2025) supports 13.8× P/S; CEO confirms $500M ARR target for 2025
    - Commodity inference ASP compression forces price cuts that erode revenue growth below 30% in 2026
    - Confirmed $450M+ 2025 audited revenue and sustained >30% QoQ growth into 2026
  - - HUMAIN Deal Value
    - $1.5B phased infrastructure revenue commitment creates government AI tailwind with multi-year revenue visibility
    - BIS export controls block LPU shipment to Saudi Arabia; non-binding letter of intent = no realized revenue
    - Binding purchase orders and first LPU delivery milestones confirmed; BIS export license granted for Saudi deployment
  - - Exit Optionality
    - IPO at $15–25B in 2027 or strategic M&A at $10–14B (Cisco/Samsung/IBM) is credible given growth trajectory
    - Down round, distressed sale <$7B, or IPO pulled on revenue miss / regulatory event; Series E investors face loss
    - IPO filing submitted with $450M+ confirmed ARR and audited financials; M&A interest from two or more strategic parties
  - - Valuation Multiple
    - 13.8× 2025E P/S is in-line with AI inference peer median and represents a 15–40% discount to base-case intrinsic value
    - 76× 2024 trailing P/S and absence of audited financials make current valuation speculative at the $6.9B mark
    - Audited 2025 revenue at $450M+ reduces trailing multiple to <20× and validates the current valuation entry point
  notes: Thesis and anti-thesis positions are evidence-grounded but conditioned on unverified revenue and unaudited financials.
    The valuation stance would upgrade from MONITOR to BUY if binding HUMAIN draw-down schedule, audited 2025 revenue at $450M+,
    and enterprise NRR >120% are simultaneously confirmed.
  claimRefs:
  - CV004
  - CV005
- id: TV005
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Audited Financial Statements 2022–2025
    - No GAAP P&L, balance sheet, or cash-flow statement exists in the public domain; all revenue and margin figures are third-party
      estimates
    - Revenue and margin claims are the foundation of every valuation scenario; unverified inputs mean the base-case DCF could
      be wrong by 30–50%
    - Request data room access with audited P&L, gross margin bridge, and segmented revenue by stream (API, enterprise, HUMAIN)
  - - HUMAIN Contract — Binding Terms and Draw-Down Schedule
    - Whether the $1.5B commitment includes binding purchase orders or letters of intent is not publicly confirmed; draw-down
      milestones are unknown
    - The HUMAIN deal is the largest single revenue commitment; a non-binding LOI or stalled deployment eliminates the bull
      and base revenue scenarios
    - Request master service agreement, phased purchase order schedule, BIS export license status, and first delivery milestone
      dates
  - - Nvidia Cross-License Royalty Terms
    - The December 2025 Groq-Nvidia IP cross-license terms, royalty rates, field-of-use restrictions, and duration are not
      publicly disclosed
    - Hidden royalty obligations to Nvidia would permanently compress gross margins and create competitive entanglement with
      the primary GPU incumbent
    - Request full cross-license agreement; identify royalty rates, most-favored-nation clauses, grant-back provisions, and
      LPU Gen3 design freedom-to-operate scope
  - - Enterprise NRR and Cohort Retention Data
    - No enterprise NRR, churn rate, or cohort-level retention metric has been publicly disclosed; 2.8M developer registrations
      conflate paid and free tiers
    - The base-case DCF assumes Groq retains and expands enterprise revenue; if NRR is below 100%, the base case collapses
      to the bear case
    - Request enterprise cohort report showing NRR by vintage year, revenue mix (API vs. enterprise vs. infrastructure), and
      top-10 customer concentration
  - - Cap Table and Liquidation Preference Stack
    - Groq's full cap table, Series E liquidation preferences, anti-dilution provisions, and secondary market overhang are
      not publicly available
    - Series E investors at $6.9B may face significant preference stack from earlier rounds at IPO or M&A; liquidation preference
      could limit common-stock upside materially
    - Request full capitalization table with preference stack, participating preferred vs. non-participating, anti-dilution
      provisions, and employee option pool size
  notes: These five diligence asks are prioritized in order of thesis impact. Items 1 and 2 (audited financials and HUMAIN
    contract terms) are blocking; a positive investment decision at $6.9B or above without these would be speculative. Items
    3–5 are material but not blocking for initial sizing decisions.
  claimRefs:
  - CV001
  - CV004
- id: TV006
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / Signal
  - Transmission to Thesis
  - Action Implication
  rows:
  - - BIS export control classification of LPU
    - BIS rulemaking sweep includes dedicated inference ASICs; LPU Gen2 performance metrics breach CCL thresholds
    - Blocks HUMAIN Saudi Arabia deployment ($1.5B revenue commitment); eliminates bull and base revenue scenarios; elevates
      bear case probability to 50%+
    - Escalate immediately; engage export control counsel; model 100% HUMAIN revenue write-down; re-rate to $2–3B implied
      value
  - - Groq 2025 revenue miss below $350M
    - Year-end 2025 confirmed revenue below $350M (30%+ miss on $500M target); signals HUMAIN non-execution and market share
      loss
    - Base case collapses to bear case; 13.8× forward P/S at $350M revenue implies overvaluation at current mark; next equity
      raise likely at down-round
    - Reduce position; require confirmed binding HUMAIN draw-down and audited revenue before re-initiating
  - - Nvidia cross-license royalty exceeds 10% of revenue
    - Court filing, press report, or M&A due diligence reveals royalty rate >10% of GroqCloud/LPU revenue payable to Nvidia
    - Permanently compresses gross margins from 35–45% to 25–35%; eliminates cash-flow-positivity-by-2026 commitment; reduces
      terminal DCF by 20–30%
    - Immediate downgrade; re-run DCF with adjusted margin assumptions; assess whether IPO remains viable at compressed margin
      profile
  - - Cerebras or Together AI captures >30% of enterprise inference market
    - Third-party benchmark data, Sacra/PitchBook revenue estimates, or enterprise survey data shows >30% inference market
      share for a single GPU-cloud competitor
    - Groq's speed premium erodes as an enterprise decision driver; ASP compression accelerates; 13.8× P/S becomes hard to
      defend without platform differentiation
    - Monitor ArtificialAnalysis benchmarks and competitor funding/ARR quarterly; require NRR data before next capital commitment
  - - HUMAIN contract confirmed as non-binding LOI
    - Legal filings, due diligence review, or press investigation reveals HUMAIN agreement lacks binding purchase orders or
      enforceable delivery milestones
    - Revenue thesis loses its primary anchor; bear case becomes base case; growth trajectory unsupported by independent revenue
      commitment
    - Initiate full data room review; require contract documentation; withhold any additional capital until binding terms
      confirmed
  notes: Thesis-break triggers are ordered by severity × immediacy. The first three are currently unresolvable from public
    sources — they require data room access or regulatory disclosure. Trigger thresholds are quantitative where possible;
    each trigger independently moves the probability-weighted intrinsic value below the $6.9B Series E entry price.
  claimRefs:
  - CV001
  - CV002
