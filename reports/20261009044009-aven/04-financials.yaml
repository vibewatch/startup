callouts:
  - calloutType: "insight"
    title: "Secured Collateral Arbitrage Drives Superior Credit Unit Economics"
    body: "Aven's financial core relies on an arbitrage between home equity security and credit card convenience. By securing revolving lines with real property liens, Aven achieves expected loan default rates between 0.50% and 1.00%—a fraction of the 3% to 5% typical of unsecured revolving portfolios. This low credit loss profile enabled Aven to secure a AAA investment rating on its asset-backed paper within 10 months of initial issuance, providing access to institutional warehouse debt at benchmark rates that preserve a ~4.25% net interest spread despite offering cardholders interest rates up to 50% below traditional unsecured credit cards [CI001, CI006, CI009]."
    claimRefs:
      - "CI001"
      - "CI006"
      - "CI009"
  - calloutType: "risk"
    title: "Private Disclosure Gaps Obscure Cash Burn and True Acquisition Payback"
    body: "While Aven's headline traction metrics—over $3.0B in cumulative issued lines and a $2.2B Series E valuation—demonstrate rapid top-line scaling, the company operates with complete private opacity regarding cash burn, customer acquisition costs, and GAAP operating profitability. Furthermore, secondary shares traded on platforms like EquityZen remain restricted, leaving outside underwriters unable to evaluate balance sheet runway or warehouse liquidity buffers without direct management access [CI006, CI011, CI013, CI015, CI016]."
    claimRefs:
      - "CI006"
      - "CI011"
      - "CI013"
      - "CI015"
      - "CI016"
