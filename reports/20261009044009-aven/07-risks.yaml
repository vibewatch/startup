    title: "Partner and dependency risk register"
    columns: ["Dependency", "Counterparty / role", "Concentration evidence", "Failure scenario", "Severity", "Mitigation visible publicly", "Residual exposure / diligence ask"]
    rows:
      - ["Bank sponsorship and regulated lending operations", "Coastal Community Bank; partner bank", "Aven is described as not having a bank charter and working with Coastal", "Termination, restriction, examination issue, or service disruption limits originations or servicing", "High", "Internal compliance role includes bank requirements and reporting", "Obtain contract term, renewal, exclusivity, termination assistance, audit rights, issue history, and contingency bank plan"]
