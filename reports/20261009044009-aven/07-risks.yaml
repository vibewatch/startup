company:
  name: "Aven"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Aven's principal disclosed exposures are the breadth of consumer-lending compliance obligations,
    reliance on bank and infrastructure partners, and execution risk from automating secured credit
    across multiple collateral types. Public evidence shows internal compliance processes and strong
    customer sentiment, but it does not independently establish current loss rates, partner terms,
    regulatory examination outcomes, or the status of reported disputes.
sections:
  - id: "legal-and-regulatory"
    title: "Legal and regulatory exposure is structural, not episodic"
    body: >-
      Aven's own job content describes a compliance perimeter spanning TILA, RESPA, ECOA, HMDA, FCRA,
      UDAAP, state usury, servicing, licensing, and foreclosure rules. It also says a four-lawyer team
      handles audits, exam responses, licensing applications, disputes, marketing review, and vendor
      management. That disclosure is useful evidence of mitigation activity, but not proof that controls
      are effective. Simplify's editorial material on the same page reports a data-breach settlement,
      an FCRA arbitration appeal, and BBB complaints; without underlying court, regulator, or settlement
      records in the assigned evidence set, those items are adverse signals rather than verified legal
      conclusions. The residual risk is therefore high until examination history, complaint trends,
      licenses, and open-matter schedules are reviewed directly.
    claimRefs: ["CR001", "CR002", "CR003", "CR015", "CR016"]
    tableRefs: ["TR001"]
  - id: "operations-security-and-credit"
    title: "Automation and collateral breadth create coupled operating risks"
    body: >-
      Aven says speed is part of its operating culture and the tertiary company profile says automation
      is used to process, evaluate, and approve loans. Those features can reduce cost and cycle time,
      yet they also make model governance, adverse-action accuracy, disclosure controls, and incident
      response central to portfolio quality. The product set described in the profile spans home equity
      and bitcoin collateral; that widens the control surface from property valuation and lien perfection
      to crypto custody and collateral volatility. Trustpilot's archived summary is strongly positive
      about ease and service, but the platform explicitly says it does not verify specific reviewer
      claims. Customer sentiment is therefore a monitoring input, not a substitute for uptime, fraud,
      servicing, complaint, or loss data.
    claimRefs: ["CR006", "CR007", "CR009", "CR010", "CR012", "CR014", "CR015"]
    tableRefs: ["TR002"]
  - id: "partners-and-financial-model"
    title: "Critical dependencies sit outside Aven's direct control"
    body: >-
      The reviewed tertiary profile says Aven is not a bank, works with Coastal Community Bank, and
      funds loans through a partner bank and securitization. It also identifies BitGo as custodian for
      bitcoin collateral. These relationships create renewal, compliance, funding, custody, and service
      continuity risks that cannot be sized from public descriptions alone. The same profile describes
      prime or super-prime borrower concentration, which may support credit quality but can constrain
      demand and does not reveal performance under stress. Company claims of more than $400 million
      raised must not be treated as cash available. EquityZen places valuation, cap-table, funding,
      revenue, and financial detail behind investor access, leaving runway, warehouse terms, advance
      rates, securitization triggers, and unit economics as material diligence gaps.
    claimRefs: ["CR004", "CR005", "CR008", "CR011", "CR013", "CR014"]
    tableRefs: ["TR003"]
  - id: "monitoring-and-kill-criteria"
    title: "The investment case requires evidence-based tripwires"
    body: >-
      The risk posture is monitorable only if management supplies denominators and contractual evidence.
      Immediate diligence should reconcile complaint and litigation schedules to source records, test
      underwriting and adverse-action models, inspect bank-partner and custodian termination rights, and
      review cohort losses, fraud, delinquencies, funding covenants, and liquidity. Thesis-break triggers
      should include loss or fraud performance outside approved limits, a material regulator finding,
      inability to renew a critical partner, loss of funding access, or repeated control incidents whose
      remediation misses board-approved deadlines. A softer warning threshold is deterioration in
      verified customer sentiment alongside rising complaint volume. Until these records are available,
      the appropriate conclusion is residual uncertainty rather than a claim that no unrecorded incident
      or enforcement action exists.
    claimRefs: ["CR003", "CR010", "CR011", "CR015", "CR016"]
    figureRefs: ["FR001"]
