evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing Aven's net interest margin, credit card servicing costs, loan loss
      provisions, and partner bank revenue-share agreements.
    whyItMatters: >-
      Without audited loss rates and net margin figures, Aven's long-term underwriting viability and return on equity
      under housing market downturns cannot be confirmed.
    diligencePath: >-
      Request confidential loan-level delinquency performance cohorts and partner bank fee schedules under an
      institutional non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance-agreements
    missingEvidence: >-
      Formal board voting thresholds, secondary share transfer restrictions, and liquidity preference cascades across
      Series D and Series E preferred stock.
    whyItMatters: >-
      Institutional governance control rights and liquidation preferences dictate common shareholder recoveries in
      downside valuation scenarios.
    diligencePath: >-
      Inspect Aven's amended and restated certificate of incorporation and investor rights agreements filed with the
      Delaware Secretary of State.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: macro-credit-risk
    missingEvidence: >-
      Comprehensive nationwide default rates, 30/60/90-day delinquency curves, and AVM automated appraisal error margins
      under regional housing price stress.
    whyItMatters: >-
      Determines portfolio durability and credit loss reserves when homeowner borrowers face simultaneous employment
      shocks and home equity declines.
    diligencePath: >-
      Review loan-level performance data from Coastal Community Bank Call Reports or asset-backed securitization
      investor disclosures.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-scale-and-funding
    missingEvidence: >-
      Verified corporate funding, customer scale, current origination volume, target-segment mix, and strategic
      direction for Figure and other named direct peers.
    whyItMatters: >-
      Product limits do not establish company scale, capital durability, distribution reach, or ability to sustain price
      competition.
    diligencePath: >-
      Obtain current company disclosures, securitization filings, lender financial statements, and independent
      origination-volume data.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: access-blocked
    severity: material
    topic: distribution-and-contracts
    missingEvidence: >-
      Readable current official terms plus bank, channel, renewal, exclusivity, partner-access, and multi-homing
      provisions.
    whyItMatters: >-
      These terms determine whether Aven's distribution and servicing relationships create proprietary advantage or
      concentrated dependency.
    diligencePath: >-
      Request executed partner agreements and readable offer-level terms, then interview bank and channel
      counterparties.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: incumbent-and-substitute-benchmarks
    missingEvidence: >-
      Named current offers for incumbent banks, credit unions, unsecured card issuers, status-quo financing, and likely
      adjacent entrants.
    whyItMatters: >-
      Without named offers, relative pricing, distribution power, trust posture, and buyer switching thresholds cannot
      be benchmarked.
    diligencePath: Allocate current offer pages, regulator records, and independent comparisons for each missing competitor class.
    relatedQuestionRefs:
      - QP001
      - QP003
      - QP005
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing customer acquisition costs (CAC), payback periods, and channel marketing
      efficiency across digital and direct mail channels.
    whyItMatters: >-
      Without audited CAC and cohort payback data, prospective investors cannot determine if rapid line origination
      generates profitable unit economics after funding costs.
    diligencePath: >-
      Request confidential audited cohort financial models and marketing channel attribution reports from Aven
      management under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Disclosure of corporate net monthly cash burn, liquid cash reserves on balance sheet, and committed warehouse debt
      facility capacity.
    whyItMatters: >-
      Assessing capital adequacy and forward financing dependency requires verified visibility into operational cash
      burn versus warehouse facility headroom.
    diligencePath: >-
      Obtain quarterly bank covenant compliance certificates, warehouse facility agreements, and cash flow statements
      during formal underwriting diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer repository activity, API technical specifications, or engineering conference benchmark
      presentations from Aven's engineering team.
    whyItMatters: >-
      Validating the proprietary robustness, automated model failover mechanics, and data security standards of Aven's
      automated underwriting engine requires practitioner review.
    diligencePath: >-
      Request architectural whitepapers, AVM variance backtesting data, and technical partner integration documentation
      directly during engineering diligence.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited customer cohort retention data, Net Revenue Retention (NRR), and annualized cardholder attrition
      percentages.
    whyItMatters: >-
      Without cohort retention curves, long-term customer lifetime value and revolving balance durability cannot be
      independently verified.
    diligencePath: >-
      Request confidential loan-tape analytics and cohort retention reporting directly from company management during
      secondary or financing diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-enumeration-TU003
    missingEvidence: >-
      Comprehensive listing of all active enterprise hospitality clients and institutional bank partners beyond initial
      public case studies.
    whyItMatters: >-
      Current public proof represents a representative sample, leaving the full distribution of enterprise contracts and
      partner concentration unquantified.
    diligencePath: Review commercial vendor customer lists and banking partner schedules in private data room.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: reported-adverse-events
    missingEvidence: >-
      Primary court dockets, settlement documents, regulator records, incident reports, and complaint-level data
      supporting or refuting the adverse items reported by Simplify.
    whyItMatters: >-
      Without primary records, case status, affected population, remediation, and complaint frequency cannot be
      verified.
    diligencePath: >-
      Obtain the legal matter schedule and incident report, then reconcile each item to PACER, regulator, BBB, insurer,
      and board remediation records.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: bank-and-funding-dependency
    missingEvidence: >-
      Bank-partner, warehouse, securitization, and custodian contracts, including concentrations, covenants, renewals,
      termination rights, SLAs, and contingency plans.
    whyItMatters: >-
      A single restriction, termination, or funding trigger could constrain origination, servicing, liquidity, or
      collateral control.
    diligencePath: >-
      Review executed agreements, counterparty exposure schedules, compliance correspondence, covenant certificates, and
      tested transition plans in the data room.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: credit-and-model-performance
    missingEvidence: >-
      Cohort loss, delinquency, fraud, prepayment, AVM error, lien-defect, model-validation, fairness, adverse-action,
      and stress-test results with denominators and periods.
    whyItMatters: >-
      Public origination scale and borrower profile do not establish credit quality, model accuracy, or performance
      under housing and crypto stress.
    diligencePath: >-
      Obtain monthly vintage tapes, model governance files, independent validations, exception reports, adverse-action
      testing, and downside stress cases.
    relatedQuestionRefs:
      - QR004
      - QR006
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
  - type: access-blocked
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Current cash, unrestricted liquidity, burn, revenue composition, gross margin, unit economics, facility capacity,
      debt maturities, and covenant headroom.
    whyItMatters: >-
      Funding raised is not cash available, and public sources reviewed here do not support a runway or loss-absorption
      estimate.
    diligencePath: >-
      Review audited financials, current management accounts, cash reconciliation, debt and warehouse schedules,
      securitization waterfalls, and a 24-month liquidity forecast.
    relatedQuestionRefs:
      - QR006
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: target-return
    missingEvidence: >-
      Current entry price, fully diluted ownership, preference stack, audited operating model, credit-loss cohorts, and
      exit-comparable evidence.
    whyItMatters: >-
      Without these inputs, target MOIC, IRR, hold period, dilution, and downside recovery cannot be calculated
      responsibly.
    diligencePath: >-
      Obtain the data room, cap table, financing documents, audited statements, cohort tapes, and proposed security
      terms before pricing an investment.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A company-reconciled schedule explaining the $252M and $392.06M funding totals and the $110M versus $98.67M Series
      E amounts.
    whyItMatters: The discrepancy prevents reliable conclusions about historical dilution, capital raised, or cash available.
    diligencePath: >-
      Reconcile board-approved financing ledgers, certificates of incorporation, share issuances, and cash proceeds by
      round.
    relatedQuestionRefs:
      - QV002
    relatedTableRefs:
      - TV002
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      Auditable public-company, private-round, or M&A comparables matched for revenue definition, credit risk, funding
      model, growth, and profitability.
    whyItMatters: >-
      Aven's own round history and one recorded-revenue multiple are insufficient to establish a defensible fair-value
      range.
    diligencePath: >-
      Build a like-for-like comparable set from filings and transaction documents after audited Aven metrics establish
      the correct denominator.
    relatedQuestionRefs:
      - QV006
      - QV008
    relatedTableRefs:
      - TV003
