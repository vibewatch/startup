callouts:
  - calloutType: "insight"
    title: "Structural Margin Advantage via Secured Underwriting"
    body: "By securing revolving card lines with residential real estate, Aven creates a structural rate arbitrage against commercial banks. Typical unsecured credit card interest rates exceeded 22% in 2026, enabling Aven to price its home-equity card between 6.49% and 14.99% while maintaining attractive spreads through partner bank Coastal Community Bank."
    claimRefs:
      - "CM007"
      - "CM008"
  - calloutType: "risk"
    title: "Collateralized Revolving Credit and Foreclosure Exposure"
    body: "Securing daily convenience purchases and consumer discretionary debt with residential home equity creates an acute consumer protection trade-off. Unlike unsecured credit cards where default results in credit damage and collections, defaulting on the Aven card can ultimately trigger residential foreclosure proceedings."
    claimRefs:
      - "CM003"
      - "CM004"
