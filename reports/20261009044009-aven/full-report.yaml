      - number: '2.2'
        title: Market Sizing, Sizing Lenses, and Addressable Demand
        blocks:
          - type: paragraph
            body: >-
              Evaluating Aven's addressable market requires multi-dimensional sizing lenses rather than a single broad
              estimate. At the macro level, the total addressable market (TAM) is anchored by total tappable equity held
              by U.S. residential homeowners—a pool exceeding trillions of dollars across tens of millions of mortgaged
              properties. The serviceable addressable market (SAM) focuses on active revolving consumer credit card
              balances and annual home equity line origination volume among homeowners with fair-to-prime credit
              profiles (FICO scores of 640 and above). Unsecured revolving credit card debt in the U.S. represents a
              particularly fertile consolidation pool, given that prevailing interest-bearing credit card APRs averaged
              22.15% in mid-2026, whereas Aven's secured rates range from 6.49% to 14.99% with an 18% hard cap.


              The serviceable obtainable market (SOM) represents prime and near-prime homeowners within Aven's 43
              licensed states and Washington D.C. seeking flexible liquidity for debt consolidation, home improvement,
              or co-branded asset purchases. Proprietary origination trends published in Aven's Home Equity Pulse
              illustrate that urban homeowner demand is concentrated in debt restructuring, where 40% of draw activity
              in benchmark metropolitan areas such as Atlanta is directed toward debt consolidation, 15% toward home
              improvement, and 45% toward other consumer uses, with average approved HELOC credit lines reaching
              $97,550. Sizing constraints persist, however, as Aven remains unlicensed in several populous and
              economically significant jurisdictions, including New York, Missouri, and Nevada, which caps the near-term
              geographic reach of its digital lending platform.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Workflow Triggers, and Embedded Distribution
        blocks:
          - type: paragraph
            body: >-
              Aven's customer base segments into three distinct behavioral cohorts: Rate-Arbitrage Consolidators,
              Elective Project Renovators, and Co-Branded Asset Purchasers. Rate-Arbitrage Consolidators are existing
              homeowners carrying high-interest credit card balances or expensive personal loans who utilize Aven's 2.5%
              balance transfer fee and single-digit to low-double-digit APRs to dramatically lower their monthly finance
              charges. Elective Project Renovators leverage revolving limits up to $400,000 to finance phased home
              repairs, additions, or major replacements, drawing capital as contractor milestones arise and earning 2%
              unlimited cash back applied as statement credits against minimum dues.


              The third emerging cohort comprises Co-Branded Asset Purchasers, created via Aven's strategic partnership
              with Forest River Financial Services. With more than 80% of recreational vehicle owners being homeowners,
              Aven provides dealership-embedded financing through the Forest River Homeline Card, offering credit lines
              up to $400,000, 3% cash back on dealer purchases up to $50,000 annually, and 1% cash back on secondary
              spending. This workflow transforms the point-of-sale financing journey at RV and marine dealerships:
              instead of waiting weeks for traditional second-lien paperwork, qualified buyers secure pre-qualification
              in as little as three minutes and access funds in three days, bypassing conventional dealer finance
              hurdles. However, adoption across all segments faces friction from consumer risk perception, as pledging
              residential property collateral for revolving lifestyle or RV purchases introduces severe foreclosure
              exposure in the event of default.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Margin Advantage via Secured Underwriting
            body: >-
              By securing revolving card lines with residential real estate, Aven creates a structural rate arbitrage
              against commercial banks. Typical unsecured credit card interest rates exceeded 22% in 2026, enabling Aven
              to price its home-equity card between 6.49% and 14.99% while maintaining attractive spreads through
              partner bank Coastal Community Bank.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: Collateralized Revolving Credit and Foreclosure Exposure
            body: >-
              Securing daily convenience purchases and consumer discretionary debt with residential home equity creates
              an acute consumer protection trade-off. Unlike unsecured credit cards where default results in credit
              damage and collections, defaulting on the Aven card can ultimately trigger residential foreclosure
              proceedings.
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Evidence Boundary
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies Figure as the clearest named direct digital HELOC alternative to Aven.
              Aven itself spans two formats: a revolving home-equity line accessed through a Visa card and a more
              conventional Home Equity Cash product. Conventional HELOCs, unsecured rewards cards, cash savings, and
              internal household liquidity are relevant substitutes for the underlying job of funding purchases or
              obtaining cash, but the pool contains no named, current offers for those alternatives; the exhibits
              therefore mark their commercial terms as unknown rather than importing generic benchmarks. Two allocated
              results concern Aven Hospitality, an unrelated hotel-technology business, and are retained only to
              document entity disambiguation, not as competitive evidence about Aven Financial.
