  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              The recommendation is track/research more, with medium-low confidence, high underwriting risk, and a
              stretched-to-unsupported valuation stance at the last disclosed $2.2 billion post-money reference. The
              positive case is real but company-led: Aven reported threefold customer growth, more than $3 billion of
              aggregate credit lines, and expansion into mortgage refinancing. The price case is weaker. Multiples
              records $100 million of revenue and a 22.0x implied multiple, but explicitly says its revenue field may
              represent run-rate revenue or last-twelve-month revenue; it should not be treated as ARR. Forge shows no
              available price and limited market activity. Entry should therefore wait for audited revenue quality,
              margins, cohort losses, security terms, ownership, and a transaction price that supports a defined
              downside case.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
