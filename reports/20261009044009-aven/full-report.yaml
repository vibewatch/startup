      - number: '7.4'
        title: The investment case requires evidence-based tripwires
        blocks:
          - type: paragraph
            body: >-
              The risk posture is monitorable only if management supplies denominators and contractual evidence.
              Immediate diligence should reconcile complaint and litigation schedules to source records, test
              underwriting and adverse-action models, inspect bank-partner and custodian termination rights, and review
              cohort losses, fraud, delinquencies, funding covenants, and liquidity. Thesis-break triggers should
              include loss or fraud performance outside approved limits, a material regulator finding, inability to
              renew a critical partner, loss of funding access, or repeated control incidents whose remediation misses
              board-approved deadlines. A softer warning threshold is deterioration in verified customer sentiment
              alongside rising complaint volume. Until these records are available, the appropriate conclusion is
              residual uncertainty rather than a claim that no unrecorded incident or enforcement action exists.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR015
              - CR016
