      - number: '6.2'
        title: Adoption Trajectory and Borrower Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Adoption metrics for Aven indicate substantial consumer scale in asset-backed consumer lending, with
              company communications indicating over $300 million in cumulative interest payments saved by borrowers
              through March 2026. Consumer satisfaction across verified third-party evaluation platforms such as
              Trustpilot shows an aggregate rating of 4.9 out of 5 stars based on customer reviews. Borrowers
              consistently highlight the speed, digital onboarding, and absence of manual tax return or paystub upload
              friction as principal adoption drivers. However, third-party hospitality platform reviews on Hotel Tech
              Report for Aven Hospitality demonstrate a divergent software evaluation environment, where digital
              marketing tools hold a 4.4 out of 5 ease-of-use rating and 94% recommendation rate across verified
              hoteliers, but face operational feedback concerning setup overhead and support responsiveness.
