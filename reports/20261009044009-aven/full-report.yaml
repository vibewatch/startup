      - number: '7.2'
        title: Automation and collateral breadth create coupled operating risks
        blocks:
          - type: paragraph
            body: >-
              Aven says speed is part of its operating culture and the tertiary company profile says automation is used
              to process, evaluate, and approve loans. Those features can reduce cost and cycle time, yet they also make
              model governance, adverse-action accuracy, disclosure controls, and incident response central to portfolio
              quality. The product set described in the profile spans home equity and bitcoin collateral; that widens
              the control surface from property valuation and lien perfection to crypto custody and collateral
              volatility. Trustpilot's archived summary is strongly positive about ease and service, but the platform
              explicitly says it does not verify specific reviewer claims. Customer sentiment is therefore a monitoring
              input, not a substitute for uptime, fraud, servicing, complaint, or loss data.
            claimRefs:
              - CR006
              - CR007
