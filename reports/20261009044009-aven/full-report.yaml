  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Capitalized Product Streams
        blocks:
          - type: paragraph
            body: >-
              Aven monetizes consumer home equity by issuing the Aven Home Card, a hybrid revolving line of credit
              structured under a home equity line of credit (HELOC) legal framework and delivered through the Visa
              payment network. Unlike unsecured credit cards that depend heavily on merchant interchange and elevated
              interest margins to absorb credit defaults, Aven's revenue model is anchored in revolving net interest
              margin and asset servicing. Operating in partnership with Coastal Community Bank (Member FDIC), Aven
              originates secured credit lines of up to $250,000 at interest rates ranging from 7.99% to 15.49% variable
              APR, capped at 18.00% maximum APR over the life of the account [CI001, CI002]. Credit lines start with a
              $0 upfront fee structure, offering no annual fees and zero-cost notarization or closing fee options across
              its operating states [CI001, CI003]. Beyond revolving interest earned through its warehouse facilities and
              special purpose vehicles, Aven captures ancillary transactional fee income via balance transfers and
              cash-out operations, which carry a 2.5% transaction fee [CI004]. Although cardholders receive 2% unlimited
              cash back on purchases (and 7% on travel booked through its proprietary portal), merchant interchange
              earned on consumer spend is largely offset by rewards obligations [CI005]. As Aven broadens its offering
              into Aven Advisor and mortgage refinancing products, management seeks to cross-sell lower-cost liquidity
              solutions while maintaining low servicing overhead [CI006, CI007, CI008].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
