            title: Do not mistake disclosed process for control effectiveness
            body: >-
              Aven describes audits, policy updates, vendor reviews, and compliance staffing, but the assigned evidence
              does not include examination outcomes, exception rates, or remediation testing.
            calloutType: risk
            claimRefs:
