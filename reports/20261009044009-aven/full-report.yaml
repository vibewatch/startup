      - number: '7.3'
        title: Critical dependencies sit outside Aven's direct control
        blocks:
          - type: paragraph
            body: >-
              The reviewed tertiary profile says Aven is not a bank, works with Coastal Community Bank, and funds loans
              through a partner bank and securitization. It also identifies BitGo as custodian for bitcoin collateral.
              These relationships create renewal, compliance, funding, custody, and service continuity risks that cannot
              be sized from public descriptions alone. The same profile describes prime or super-prime borrower
              concentration, which may support credit quality but can constrain demand and does not reveal performance
              under stress. Company claims of more than $400 million raised must not be treated as cash available.
              EquityZen places valuation, cap-table, funding, revenue, and financial detail behind investor access,
              leaving runway, warehouse terms, advance rates, securitization triggers, and unit economics as material
              diligence gaps.
            claimRefs:
              - CR004
              - CR005
