              - CI009
              - CI012
      - number: '4.2'
        title: Cost Structure, Unit Economics, and Funding Spreads
        blocks:
          - type: paragraph
            body: >-
              The core unit economics of Aven depend heavily on the net interest spread between cardholder APRs and the
              institutional cost of capital incurred across warehouse credit facilities and asset-backed
              securitizations. External independent analysis highlights that net interest margin constitutes the primary
              revenue engine for the business model [CI009]. With cardholder variable rates averaging approximately
              11.74% and warehouse financing benchmarks tied to floating indices such as SOFR plus institutional credit
              spreads (estimated near 7.5% in benchmark scenarios), Aven captures a structural net interest spread
              estimated around 4.25% alongside an estimated 1.0% asset servicing fee [CI009]. Low expected default
              rates—typically modeled between 0.50% and 1.00% due to home equity collateralization—insulate gross
              margins compared to unsecured lending models, though warehouse facility haircuts and equity subordination
              requirements consume corporate cash [CI009]. User satisfaction and operational onboarding throughput are
              corroborated by verified consumer feedback, where cardholders highlight seamless digital origination and
              rapid fund access without upfront documentation friction [CI010]. Nevertheless, actual customer
              acquisition costs (CAC), payback periods across direct mail and digital acquisition channels, lifetime
              value (LTV), and realized portfolio loss rates remain closely guarded private metrics not disclosed in
              audited disclosures [CI011]. The efficiency of automated underwriting and automated valuation models
              (AVMs) substantially lowers upfront origination expenses, but institutional investors require audited loan
              performance data to verify sustained portfolio margins [CI006, CI011].
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI011
              - CI012
      - number: '4.3'
        title: Commercial Traction, Capital Adequacy, and Underwriting Diligence
        blocks:
          - type: paragraph
            body: >-
              Aven has demonstrated significant origination velocity since its 2022 market launch in California,
              progressing from $1.5 billion in cumulative issued credit lines and 33,000 cardholders at Series D in July
              2024 to more than $3.0 billion in aggregate credit lines issued by September 2025 at Series E [CI001,
              CI006, CI012]. Cumulative interest savings delivered to homeowners expanded from over $100 million in
              mid-2024 to over $215 million following its $110 million Series E round led by Khosla Ventures at a $2.2
              billion valuation [CI001, CI006, CI013]. Capitalization remains substantial, with lifetime equity funding
              reaching $252 million across Series D and Series E rounds, supported by Tier-1 institutions including
              Khosla Ventures, General Catalyst, GIC, and Founders Fund [CI013, CI014]. Institutional capital markets
              validation was further demonstrated when Aven achieved a AAA investment rating on its asset-backed paper
              within 10 months of its initial rated transaction [CI006]. However, secondary market liquidity on
              platforms such as EquityZen reflects private shareholder restrictions, and critical forward
              financials—including monthly net cash burn, corporate operating runway, and warehouse facility leverage
              limits—remain undisclosed private data points that impede complete underwriting assessment [CI015, CI016].
            claimRefs:
              - CI001
              - CI006
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI006
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Secured Collateral Arbitrage Drives Superior Credit Unit Economics
            body: >-
              Aven's financial core relies on an arbitrage between home equity security and credit card convenience. By
              securing revolving lines with real property liens, Aven achieves expected loan default rates between 0.50%
              and 1.00%—a fraction of the 3% to 5% typical of unsecured revolving portfolios. This low credit loss
              profile enabled Aven to secure a AAA investment rating on its asset-backed paper within 10 months of
              initial issuance, providing access to institutional warehouse debt at benchmark rates that preserve a
              ~4.25% net interest spread despite offering cardholders interest rates up to 50% below traditional
              unsecured credit cards [CI001, CI006, CI009].
            calloutType: insight
            claimRefs:
              - CI001
              - CI006
              - CI009
          - type: callout
            title: Private Disclosure Gaps Obscure Cash Burn and True Acquisition Payback
            body: >-
              While Aven's headline traction metrics—over $3.0B in cumulative issued lines and a $2.2B Series E
              valuation—demonstrate rapid top-line scaling, the company operates with complete private opacity regarding
              cash burn, customer acquisition costs, and GAAP operating profitability. Furthermore, secondary shares
              traded on platforms like EquityZen remain restricted, leaving outside underwriters unable to evaluate
              balance sheet runway or warehouse liquidity buffers without direct management access [CI006, CI011, CI013,
              CI015, CI016].
            calloutType: risk
            claimRefs:
              - CI006
              - CI011
              - CI013
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Aven operates as a technology-driven home equity lender delivering flexible revolving credit secured by
              residential real estate. Unlike traditional closed-end second mortgages or fixed lump-sum home equity
              loans that mandate full upfront disbursement and rigid amortized repayment schedules, Aven structures its
              primary consumer offering as a revolving line of credit where borrowers pay interest solely on the
              specific balance drawn. Customer engagement centers on the flagship Aven Home Card, which functions
              operationally like a credit-card-accessible home equity line of credit (HELOC). Homeowners can utilize the
              physical or digital card directly at point of sale for consumer purchases or execute direct
              account-to-account cash transfers, with interest accruing strictly on the active outstanding balance.
              Beyond the core revolving card, Aven's disclosed product portfolio encompasses standard fixed-payment
              HELOC solutions for borrowers seeking predictable debt schedules, the free mobile-first Aven Advisor tool
              designed to deliver personal finance insights and track home equity metrics, and exploratory financing
              lines including co-branded recreational vehicle lending with Forest River and announced asset-backed card
              concepts such as bitcoin-collateralized credit lines. The customer workflow transitions traditional
              multi-week home equity borrowing into an online-first onboarding experience emphasizing rapid digital
              prequalification and automated property valuation, although cash transfers and specific draw mechanisms
              incur transaction fees.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
