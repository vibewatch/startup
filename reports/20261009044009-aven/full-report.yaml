  - id: FI001
    title: Aven Revenue and Capital Flow Waterfall
    type: flow
    summary: >-
      Structural progression of customer home equity origination into net interest income, servicing fees, and corporate
      cash flow.
    data:
      nodes:
        - id: node-origination
          label: 1. Home Equity Origination
          detail: Homeowner taps equity via Coastal Community Bank-partnered Visa HELOC with credit lines up to $250k
        - id: node-revolving-balance
          label: 2. Revolving Balance Draw
          detail: Borrower utilizes credit line at 7.99%-15.49% variable APR, generating gross interest yield of ~11.74%
        - id: node-capital-funding
          label: 3. Warehouse Capital Funding
          detail: >-
            Credit facility funding provided via institutional warehouse lines and AAA-rated asset-backed
            securitizations at ~7.50% cost of funds
        - id: node-net-spread
          label: 4. Net Interest Spread Capture
          detail: >-
            Operating company captures estimated 4.25% net interest margin spread between borrower APR and institutional
            cost of debt
        - id: node-servicing-fee
          label: 5. Asset Servicing & Transaction Fees
          detail: Captures ~1.00% servicing fee on outstanding balance plus 2.50% balance transfer and cash-out liquidity fees
        - id: node-net-margin
          label: 6. Operating Cash Margin
          detail: >-
            Net cash flow generated after deducting low collateralized credit loss (0.50%-1.00%) and corporate operating
            expenses
      edges:
        - from: node-origination
          to: node-revolving-balance
        - from: node-revolving-balance
          to: node-capital-funding
        - from: node-capital-funding
          to: node-net-spread
        - from: node-net-spread
          to: node-servicing-fee
        - from: node-servicing-fee
          to: node-net-margin
    approximationNotes: >-
      Flow mechanics model public variable rate schedules and independent cost of capital benchmarks; exact SPV advance
      rates and servicing yields are private.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
      - CI009
      - CI012
