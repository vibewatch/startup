        title: Exhibits
        blocks:
          - type: callout
            title: Dual Identity in Market Sourcing
            body: >-
              Public domain evidence in 2026 reveals two distinct commercial entities operating under the Aven name:
              Aven (the asset-backed consumer credit card fintech founded in 2019 backed by Coastal Community Bank and
              BitGo) and Aven Hospitality (the enterprise hotel technology firm spun out of Sabre Hospitality by TPG).
              Diligence analysts must carefully separate retail consumer credit metrics from enterprise hotel SaaS
              deployments.
            calloutType: insight
