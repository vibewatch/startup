  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - $2.2B last-round reference; no reliable current secondary price
        - Do not endorse an entry price from public evidence
      - - Confidence
        - Medium-low
        - Financing is corroborated, but operating and security-level data are missing
        - Require primary diligence before underwriting returns
      - - Risk rating
        - High
        - 22.0x recorded-revenue multiple, private-market illiquidity, and bank dependency
        - Demand downside protection and explicit kill criteria
      - - Valuation stance
        - Stretched to unsupported
        - $100M recorded revenue is ambiguously run-rate or LTM and is not identified as ARR
        - Do not capitalize the figure as recurring software revenue
      - - Entry discipline
        - No price recommendation
        - Ownership, preferences, audited margins, loss curves, and current transaction price are absent
        - Set price only after the missing inputs are delivered
    notes: >-
      Assessments use the September 2025 financing reference and assigned public evidence; they are not a fair-value
      opinion, return forecast, or statement of cash available.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV012
