      - number: '3.2'
        title: Capability and Pricing Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Aven's card format is differentiated when spending can remain on card: it pairs a home-equity line with 2%
              cash back and reports no annual, sign-up, or prepayment fee in Bankrate's review. The tradeoff is a 2.5%
              fee when value must move to a bank account or another balance, reducing the advantage for cash-heavy use
              cases. Aven Home Equity Cash and Figure are closer substitutes for direct liquidity. LendEDU reports Aven
              Home Equity Cash at $5,000 to $400,000 with fixed-rate terms and funding in as few as three days, while
              Figure reaches $750,000, supports fixed and variable structures, and may fund in five days. These are
              publisher-reported snapshots, not borrower-specific offers.
            claimRefs:
