              While Aven boasts a 4.9-star Trustpilot rating and over $300M in consumer interest savings, retail loan
              performance data—including net charge-off rates, delinquency curves, and automated valuation model error
              margins—remains completely private. Investors must treat reported borrower savings as marketing aggregates
              rather than audited credit performance.
