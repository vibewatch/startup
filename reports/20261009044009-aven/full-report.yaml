  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure is structural, not episodic
        blocks:
          - type: paragraph
            body: >-
              Aven's own job content describes a compliance perimeter spanning TILA, RESPA, ECOA, HMDA, FCRA, UDAAP,
              state usury, servicing, licensing, and foreclosure rules. It also says a four-lawyer team handles audits,
              exam responses, licensing applications, disputes, marketing review, and vendor management. That disclosure
              is useful evidence of mitigation activity, but not proof that controls are effective. Simplify's editorial
              material on the same page reports a data-breach settlement, an FCRA arbitration appeal, and BBB
              complaints; without underlying court, regulator, or settlement records in the assigned evidence set, those
              items are adverse signals rather than verified legal conclusions. The residual risk is therefore high
              until examination history, complaint trends, licenses, and open-matter schedules are reviewed directly.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
          - type: table
