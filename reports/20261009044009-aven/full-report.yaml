      - number: '6.3'
        title: Named Deployments and Enterprise Proof
        blocks:
          - type: paragraph
            body: >-
              Because Aven's primary consumer credit card business serves individual private retail homeowners,
              individual borrowers are shielded by consumer financial privacy standards and are not published as
              enterprise logo case studies. Commercial customer proof at the institutional level is demonstrated through
              enterprise infrastructure and network partners, specifically Coastal Community Bank as the issuing bank
              authority under Visa license, BitGo as digital asset custodian, and credit bureau relationships governed
              by standard terms of service. In contrast, corporate releases for Aven Hospitality reveal named enterprise
              deployments such as Navarino Services, which piloted the redesigned SynXis booking engine across member
              hotel properties and reported a 30% direct revenue growth within the initial month of production usage.
