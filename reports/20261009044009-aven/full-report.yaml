        title: Exhibits
        blocks:
          - type: callout
            title: Secured Credit Card Innovation vs. Entity Disambiguation
            body: >-
              Aven has pioneered a novel product category by securing credit card lines against home equity, enabling
              prime homeowners to access low mortgage-like rates with instant digital onboarding. However, diligence
              analysts must distinguish Aven Financial, Inc. from unrelated corporate entities bearing the Aven
              name—including Nasdaq Stockholm-listed Avensia (AVEN.ST) and TPG-backed Aven Hospitality—to avoid
              contaminating underwriting and valuation benchmarks.
