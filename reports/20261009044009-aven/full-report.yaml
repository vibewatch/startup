      - number: '8.2'
        title: Financing and Valuation Evidence
        blocks:
          - type: paragraph
            body: >
              Independent deal reporting converges on a $110 million Series E at a $2.2 billion post-money valuation in
              September 2025, led by Khosla Ventures. The valuation increased from the $1 billion Series D reference
              reported for July 2024, while Multiples' recorded revenue remained $100 million at both round dates; its
              calculated multiple consequently rose from 10.0x to 22.0x. Funding totals do not fully reconcile. Tracxn
              and Multiples report $252 million across two rounds, whereas Forge displays $392.06 million of total
              funding and a $98.67 million Series E-1 amount. Those discrepancies may reflect share-class, transaction,
              or data-definition differences, but the assigned evidence does not resolve them. They should not be
              converted into a claim about cash available, dilution, or runway.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Framework and Exit Readiness
        blocks:
          - type: paragraph
            body: >
              Public evidence supports conditional scenarios, not probability-weighted valuation outputs. A bull outcome
              requires verified revenue acceleration beyond the recorded $100 million figure, durable credit
              performance, and demonstrated mortgage-refinance adoption before a valuation above the last round can be
              defended. The base case is a diligence hold: the $1 billion Series D and $2.2 billion Series E are
              historical financing anchors, not a current fair-value range. The bear case is a down-round or no-invest
              outcome if losses deteriorate, the bank relationship weakens, growth stalls, or private-market liquidity
              remains limited. No supportable target MOIC, IRR, hold period, or exit range can be calculated without an
              entry price, fully diluted ownership, preferences, audited economics, and comparable transaction evidence.
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence Gates and Thesis Breakers
        blocks:
          - type: paragraph
            body: >
              The investment committee should request audited revenue recognition, gross margin, contribution margin,
              funding costs, delinquencies, charge-offs, vintage curves, and stress performance by product. It should
              also obtain the current cap table, fully diluted share count, liquidation preferences, participation
              rights, anti-dilution terms, pro-rata rights, debt covenants, bank-partner agreement, and securitization
              documentation. The customer signal is encouraging but weak for valuation: Trustpilot's AI-generated review
              summary describes an easy and fast experience while warning that individual reviewer claims are not
              verified. Thesis-break triggers are a material deterioration in cohort losses, loss or restriction of
              Coastal Community Bank issuance, mortgage expansion without disclosed economics, a financing below the
              last-round reference, or continued absence of auditable metrics before a liquidity event.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Proof Is the Missing Gate
            body: >-
              The product thesis can be tracked, but public evidence does not support a current entry price or return
              case. Treat the $2.2B financing mark as a historical reference, not a present fair-value conclusion.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV016
          - type: callout
            title: Do Not Relabel Revenue as ARR
            body: >-
              Multiples records $100M of revenue and says such figures are typically run-rate revenue or reported LTM
              revenue. The source does not identify the figure as ARR, so recurring-revenue valuation treatment would be
              unsupported.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
