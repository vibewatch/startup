      - number: '3.3'
        title: Trust, Distribution, and Switching Friction
        blocks:
          - type: paragraph
            body: >-
              The customer-evidence surface is mixed rather than uniformly favorable. Trustpilot's automated summary
              says reviewers commonly praise speed, ease, and support, while Bankrate displays a 1.6 customer score from
              34 ratings and says 12% would recommend the lender; those populations and methods are not comparable, so
              neither is treated as a universal satisfaction measure. Aven's home collateral also changes the trust
              proposition: EquitySquirrel emphasizes that delinquency can ultimately create foreclosure exposure, unlike
              an ordinary unsecured card. The assigned texts describe applications, underwriting, notarization, and lien
              creation, supporting an inference that moving between secured providers entails procedural friction, but
              they do not provide churn, multi-homing, distribution-partner, or bank-contract evidence.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Aven's clearest defendable product distinction is the combination of revolving card access and home-equity
              pricing, not a demonstrated structural moat. The format is attractive for card-payable spending, but its
              economics weaken when a borrower needs cash because each transfer carries the reported 2.5% fee. Figure
              can compete for larger balances and rate-structure choice, while conventional HELOCs and unsecured cards
              remain substitute categories whose current terms were not established here. Collateral creates borrower
              friction after origination, but that friction may protect any secured lender rather than Aven
              specifically. No assigned evidence establishes proprietary distribution, exclusive supply or bank access,
              competitor funding advantage, or measured switching rates, so durability should remain an underwriting gap
              rather than a scored certainty.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Collateral changes the competitive trust equation
            body: >-
              Aven's lower-rate card format still pledges the home. That can make the product economically attractive
              for disciplined, card-payable spending while materially less substitutable for borrowers unwilling to
              attach foreclosure exposure to routine purchases.
            calloutType: risk
            claimRefs:
