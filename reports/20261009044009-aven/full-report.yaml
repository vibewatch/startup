  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Aven sits at the convergence of three primary credit categories: traditional
              home equity lines of credit (HELOCs), closed-end second mortgages/home improvement loans, and
              general-purpose revolving credit card debt. Aven's core product, the Home Equity Visa Card, restructures
              consumer borrowing by securing open-ended revolving lines of credit against residential real estate
              collateral, primarily targeting owner-occupied properties. The included spend encompasses high-ticket
              discretionary consumer purchases, structured home remodeling projects, major vehicle financing, and
              revolving credit card balance transfers. Excluded spend comprises purchase-money first-lien residential
              mortgages, commercial mortgages, multi-family construction financing, and small-dollar uncollateralized
              payday lending. Market intelligence and industry benchmarks also distinguish consumer home-equity fintech
              from unrelated B2B hospitality marketing software operating under the homonymous Aven Hospitality brand.


              Status-quo substitutes in this landscape include traditional depository HELOCs originated through
              commercial banks and credit unions, cash-out mortgage refinancings, standalone unsecured personal loans
              (originated by fintechs like SoFi or traditional lenders), and conventional high-APR unsecured credit
              cards. Whereas traditional HELOC originations typically entail weeks of manual processing, physical
              property appraisals, in-person notary appointments, and substantial closing costs, Aven compresses the
              origination timeline by utilizing automated valuation models (AVMs) and digital notarization to provide
              approvals in minutes and funding access in as fast as three days without origination or appraisal fees.
              Furthermore, Aven's expansion into co-branded dealership financing with Forest River demonstrates an
              adjacent market capture strategy, positioning asset-backed revolving lines against conventional
              point-of-sale recreational vehicle loans.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
