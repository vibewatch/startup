  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Customer and origination activity indicate product demand
        - Company release reports 3x customer growth and more than $3B of aggregate credit lines
        - Audited cohorts confirm growth without weaker credit quality
      - - Thesis
        - Mortgage refinancing creates a plausible adjacent growth path
        - HousingWire reports the September 2025 product rollout
        - Product-level originations, margins, and repeat use become available
      - - Thesis
        - Independent reporting corroborates the institutional financing reference
        - Axios and HousingWire report a $110M Series E at $2.2B
        - A current arm's-length transaction validates or improves the mark
      - - Anti-thesis
        - The disclosed valuation embeds a demanding revenue multiple
        - Multiples calculates 22.0x on $100M of recorded revenue
        - Audited revenue quality and growth materially exceed the recorded figure
      - - Anti-thesis
        - Funding records conflict and do not establish capitalization
        - The $252M two-round total differs from Forge's $392.06M display
        - The company supplies a reconciled cap table and financing schedule
      - - Anti-thesis
        - Secondary liquidity and price discovery are weak
        - Forge displays no available price and limited market activity
        - Observable, recurring arm's-length trades establish a current mark
    notes: >-
      Company-issued operating metrics are labeled as claims; independent deal records corroborate financing but do not
      verify unit economics or credit performance.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Case
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or decision trigger
    rows:
      - - Bull
        - Verified revenue acceleration, stable credit cohorts, and scaled mortgage adoption
        - >-
          A mark above $2.2B is considered only after audited forward economics support it; no public MOIC is
          supportable
        - Audited growth plus repeatable funding and loss performance
        - Growth is bought through weaker underwriting or uneconomic funding
      - - Base
        - Core product grows, but adjacent-product evidence and audited margins remain incomplete
        - $1B and $2.2B are historical round anchors, not a fair-value range; defer price and return estimates
        - Current metrics broadly validate the last-round operating narrative
        - Diligence remains incomplete at the next financing decision
      - - Bear
        - Credit losses rise, bank access tightens, growth slows, or liquidity remains limited
        - Down-round or no-invest outcome; magnitude cannot be quantified from assigned public evidence
        - Adverse cohort, partner, regulatory, or financing evidence
        - Material loss deterioration, bank restriction, or financing below the prior mark
    notes: >-
      Scenarios are conditional decision boundaries, not forecasts; probabilities, target returns, hold periods, and
      valuation ranges remain unquantified because entry terms and audited operating data are unavailable.
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV011
      - CV012
