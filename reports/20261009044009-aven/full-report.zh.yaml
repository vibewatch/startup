            body: >-
              Aven 把简化后的承销流程定位为主要技术差异，用自动 AVM 房产评估和数字风险筛查，取代传统银行数周的处理流程。但 Aven
              自动估值算法的准确度、对第三方模型的依赖以及机器银行系统都属于私人信息，机构投资者仍需核查逐笔贷款损失准备金和评估故障切换率。
