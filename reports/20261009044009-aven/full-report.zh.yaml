      - number: '8.4'
        title: 尽调门槛与投资逻辑破坏因素
        blocks:
          - type: paragraph
            body: >
              投资委员会应要求按产品提供经审计的收入确认、毛利率、贡献利润率、融资成本、逾期、核销、账龄曲线和压力表现。还应取得当前股权结构表、完全摊薄股数、清算优先权、参与权、反稀释条款、按比例认购权、债务契约、银行合作协议和证券化文件。客户信号令人鼓舞，但对估值帮助有限：Trustpilot
              的 AI 生成评价摘要称体验便捷快速，同时警告单条评论者的说法未经核实。投资逻辑破坏触发器包括队列损失显著恶化、Coastal Community Bank
              发卡权丧失或受限、抵押贷款业务扩张却不披露经济数据、融资价格低于上一轮参照值，或在流动性事件前持续缺少可审计指标。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格证明是缺失的门槛
            body: 产品逻辑可以继续跟踪，但公开证据不支持当前入场价格或回报逻辑。把 $2.2B 融资估值视为历史参照，而不是当前合理价值结论。
