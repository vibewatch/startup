      - number: '3.3'
        title: 信任、分销与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              客户证据并非一面倒地有利。Trustpilot 的自动摘要称，评论者通常称赞速度、便捷性和支持服务；而 Bankrate 展示的客户评分为 1.6，基于 34 条评价，并称只有 12%
              的人会推荐该贷款机构。这两组样本和方法不可比，因此都不能当作普遍满意度指标。Aven 的房屋抵押物也改变了信任逻辑：EquitySquirrel
              强调，逾期最终可能导致止赎风险，而普通无抵押卡没有这一点。已分配文本描述了申请、承销、公证和设立留置权等流程，因此可以推断在抵押贷款服务商之间切换会产生流程摩擦；但文本没有提供流失、多平台使用、分销伙伴或银行合同证据。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
