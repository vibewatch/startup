chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Aven Financial, Inc. 成立于 2019 年，总部位于加利福尼亚州旧金山，业务处在消费信用卡与住宅抵押融资的交汇处。公司的核心价值主张，是让房主以较低年化利率释放住宅净值，同时保留传统 Visa
              卡的便利性、奖励机制和循环使用方式。Aven 通过自动房产估值模型和远程机器人公证流程，去掉了过去让小额房屋净值信贷额度难以盈利的繁琐行政成本。尽调人员必须将 Aven Financial
              与名称相近的无关实体严格区分开来，尤其是瑞典上市数字商务公司 Avensia publ AB（在 Nasdaq Stockholm 以 AVEN 交易）以及企业软件供应商 Aven Hospitality（前身为
              Sabre Hospitality）。
            claimRefs:
