      - CO011
    data:
      items:
        - label: 创立
          date: 2019-06
          summary: Established by Sadi Khan, Collin Wikman, and Murtada Shah
          detail: 由 Square 和 Facebook 前高管在旧金山创立，旨在降低消费者借贷成本。
          tone: neutral
        - label: 产品开发
          date: 2020-09
          summary: Machine banking architecture and automated remote notarization
          detail: 开发专有自动估值、合规系统和机器人公证盖章流程。
          tone: positive
        - label: Aven Card 上线
          date: 2022-02
          summary: Public launch of marquee home-equity-backed credit card
          detail: 推出首张以住宅净值为抵押、利率接近优质抵押贷款水平的信用卡。
          tone: positive
        - label: 规模里程碑
          date: 2023-12
          summary: Tripled annual revenue and surpassed $1B in credit lines
          detail: 借款人快速增长推动 2023 年营收扩大至三倍。
          tone: positive
        - label: D 轮独角兽融资
          date: 2024-07
          summary: Closed $142M Series D co-led by Khosla and General Catalyst
          detail: 公司创立五年后达到独角兽估值。
          tone: positive
        - label: 顾问委员会成立
          date: 2024-08
          summary: Appointed federal housing and financial regulatory leaders
          detail: 聘任前 Freddie Mac CEO Michael DeVito 和 Fannie Mae CEO Timothy Mayopoulos。
          tone: neutral
        - label: E 轮融资
          date: 2025-09
          summary: General Catalyst doubles down in Series E growth round
          detail: 扩充资产负债表，以支持覆盖 50 个州的业务和抵押贷款再融资产品管线。
          tone: positive
        - label: 多州扩张
          date: 2026-10
          summary: Surpassed $3B funded to homeowners across 30+ US jurisdictions
          detail: 累计为客户节省超过 $215M 利息，同时筹备机器银行平台。
          tone: positive
  - id: FM001
    title: 市场可触达性与资格筛选规模层级
    type: pyramid
    summary: 将数万亿美元的美国消费者债务市场逐层收窄至符合 Aven 资格的房屋净值借款人。
    data:
      items:
        - label: 美国消费者债务总额与住宅净值
          value: 100
          unit: relative share
          description: 数万亿美元规模的消费者信贷和住宅净值总可寻址市场。
        - label: 循环信用卡余额与 HELOC 额度
          value: 80
          unit: relative share
          description: 持有高息循环信贷或寻求以房产担保流动性的房主。
        - label: 地理覆盖（43 个州 + D.C.）
          value: 65
          unit: relative share
          description: 持有已建立净值、位于 Aven 当前获牌经营辖区的房主。
        - label: 符合条件的信用画像（FICO >= 640）
          value: 45
          unit: relative share
          description: 达到 Aven 最低承保门槛，且收入经核实、净值未设押的房主。
        - label: 债务整合与生活方式目标借款人
          value: 25
          unit: relative share
          description: 寻求低利率债务整合、分阶段房屋翻修或嵌入式经销商融资的房主。
        - label: Aven 活跃交易者与借款人
          value: 12
          unit: relative share
          description: 使用数字 AVM 放款和循环额度进行消费或再融资的担保信用卡持有人。
    approximationNotes: 层级相对规模根据资格条件构建，包括房屋所有权、43 个州的覆盖范围、>=640 的 FICO 门槛，以及债务整合 / 翻修需求。
    claimRefs:
      - CM003
      - CM004
      - CM006
      - CM007
      - CM008
      - CM011
  - id: FP001
    title: 产品形态定位图
    type: quadrant
