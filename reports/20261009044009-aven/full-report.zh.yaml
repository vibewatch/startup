  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >
              建议为观察 / 继续研究，信心中低、承销风险高；以最近披露的 $2.2B 投后估值为参照，估值已偏高且缺乏支撑。积极逻辑确实存在，但主要来自公司自述：Aven 报告客户数增长三倍、累计信贷额度超过
              $3B，并扩展到抵押贷款再融资。价格逻辑则更弱。Multiples 记录收入 $100M 和 22.0x 隐含倍数，但明确表示收入字段可能代表运行率收入或过去 12 个月收入，不能将其视为 ARR。Forge
              没有可用价格，市场活动也有限。因此，入场应等到收入质量、利润率、损失队列、证券条款、所有权以及能支撑明确下行情景的交易价格都经过审计或核实后再考虑。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
