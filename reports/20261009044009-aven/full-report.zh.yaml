      - number: '1.2'
        title: 管理层、治理结构与顾问委员会
        blocks:
          - type: paragraph
            body: >-
              Aven 由首席执行官 Sadi Khan、首席设计官 Collin Wikman 和工程负责人 Murtada Shah 创立；三人此前都曾在 Facebook 和 Square 负责消费产品、UX
              设计或平台工程。这个技术型创始团队把复杂的抵押贷款合规流程与简洁的移动端消费体验结合起来，形成了 Aven 的产品能力。为应对住宅贷款和联邦信贷法规的严格监管，Aven
              组建了由前监管和住房金融高管组成的高知名度顾问委员会。主要顾问包括前 Freddie Mac 首席执行官 Michael DeVito、前 Fannie Mae 首席执行官 Timothy Mayopoulos
              和前白宫副幕僚长 Jim Messina，为资本市场定位和监管沟通提供机构层面的指导。
            claimRefs:
              - CO001
              - CO007
