  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管敞口是结构性的，而非偶发的
        blocks:
          - type: paragraph
            body: >-
              Aven 自己的招聘内容称，其合规边界涵盖
              TILA、RESPA、ECOA、HMDA、FCRA、UDAAP、州高利贷、服务、牌照和止赎规则。内容还称，四人律师团队负责审计、检查回复、牌照申请、争议、营销审查和供应商管理。这项披露可以证明公司在开展风险缓释工作，但不能证明控制有效。同一页面上
              Simplify 的编辑材料报告了一起数据泄露和解、一次 FCRA 仲裁上诉以及 BBB
              投诉；由于分配到的证据中没有底层法院、监管机构或和解记录，这些事项只能视为不利信号，而不是已经验证的法律结论。因此，在直接审阅检查历史、投诉趋势、牌照和未决事项清单前，剩余风险仍高。
