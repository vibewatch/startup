  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与资本化产品流
        blocks:
          - type: paragraph
            body: >-
              Aven 通过发行 Aven Home Card 将消费房屋净值变现。这是一种在房屋净值信贷额度（HELOC）法律框架下设计、通过 Visa
              支付网络交付的混合循环额度。无抵押信用卡主要依靠商户交换费和较高利息利差来吸收信用违约；Aven 的收入模式则以循环净息差和资产服务费为核心。Aven 与 Coastal Community Bank（FDIC
              成员银行）合作，在其运营州发放最高 $250,000 的抵押信贷额度，浮动年化利率为 7.99% 至 15.49%，账户存续期最高年化利率上限为 18.00% [CI001, CI002]。额度起始费用为
              $0，不收年费，并在运营州提供免费的公证或成交费用选项 [CI001, CI003]。除通过仓储融资工具和特殊目的载体赚取循环利息外，Aven 还通过余额转账和套现业务获取附加交易费收入，交易费为 2.5%
              [CI004]。持卡人购物可获得 2% 不限额返现（通过自有门户预订旅行可获 7%），但消费产生的商户交换费大多被奖励成本抵消 [CI005]。随着 Aven 扩展到 Aven Advisor
              和抵押贷款再融资产品，管理层希望交叉销售成本更低的流动性方案，同时维持较低的服务成本 [CI006, CI007, CI008]。
            claimRefs:
