      - number: '5.3'
        title: 竞争差异化、抵押风险控制与技术缺口
        blocks:
          - type: paragraph
            body: >-
              Aven 的核心产品差异，在于把信用卡交易便利性和快速数字化使用，与通常低于无抵押信用卡年化利率的资产支持借款利率结合起来。以住宅净值为循环信贷提供抵押后，Aven
              相比无抵押循环额度降低了信用风险，从而能为解决短期至中期借款需求的优质房主提供更有竞争力的定价。但这种架构也带来显著的抵押风险：由于借款直接以住宅不动产作抵押，付款违约或长期逾期会带来房屋止赎风险。独立评估指出，如果持卡人把资产支持信贷当作可选消费债务，而非住房抵押级别的房地产义务，卡式循环额度反而可能提高消费者违约风险。此外，Aven
              使用会随资本市场基准波动调整的浮动利率，给长期循环余额带来偿付能力变化。从架构和工程审计角度看，管理层称为“机器银行”的长期技术路线图仍受到私人披露限制；自动评估的实证准确性、区域房市下行期间的算法贷款损失表现，以及开发者可访问的
              API 规范都没有公开。
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE002
              - CE003
              - CE008
      - number: '5.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 循环卡形态中的房地产抵押机制
            body: >-
              Aven
              的数字申请和卡式循环形态虽然比无抵押卡提供更快的消费信贷速度和更低的年化利率，但产品本质上仍是以借款人房屋作抵押的房屋净值贷款。随意看待循环卡余额，逾期后可能导致房地产止赎；在长期高利率的货币环境中，浮动利率也会推高持有成本。
