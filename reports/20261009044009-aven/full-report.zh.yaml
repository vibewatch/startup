              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 情景框架与退出准备度
        blocks:
          - type: paragraph
            body: >
              公开证据支持条件式情景，而不是概率加权的估值输出。乐观结果要求收入增速经验证地超过已记录的
              $100M，信贷表现保持稳定，并证明抵押贷款再融资业务已经被客户采用，之后才有理由捍卫高于上一轮的估值。基准情景是暂停尽调：$1B Series D 和 $2.2B Series E
              是历史融资锚点，不是当前合理价值区间。悲观情景是降价融资或放弃投资，触发条件包括损失恶化、银行关系减弱、增长停滞或私人市场流动性持续有限。没有入场价格、完全摊薄后所有权、优先权、经审计经济数据和可比交易证据，就无法计算有支撑的目标
              MOIC、IRR、持有期或退出区间。
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
