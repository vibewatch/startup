      - number: '7.3'
        title: 关键依赖在 Aven 直接控制之外
        blocks:
          - type: paragraph
            body: >-
              已审阅的第三方简介称 Aven 不是银行，与 Coastal Community Bank 合作，并通过合作银行和证券化为贷款提供资金；简介还把 BitGo
              认定为比特币抵押物托管方。这些关系带来续约、合规、融资、托管和服务连续性风险，单凭公开描述无法量化。同一简介描述了优质或超优质借款人集中度，这或许支持信贷质量，但可能限制需求，也无法揭示压力情景下的表现。公司声称已融资超过
              $400M，不能当作可用现金。EquityZen 把估值、股权结构表、融资、收入和财务细节放在投资者权限之后，导致现金跑道、仓储条款、预付款率、证券化触发条件和单位经济成为重大尽调缺口。
