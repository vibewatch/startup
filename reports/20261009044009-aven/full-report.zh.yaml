  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流架构
        blocks:
          - type: paragraph
            body: >-
              Aven 是一家技术驱动的房屋净值贷款机构，以住宅不动产为抵押提供灵活的循环信贷。传统封闭式二次抵押贷款或固定金额房屋净值贷款通常要求一次性全额放款并按僵化的摊还计划还款；Aven
              则把主要消费产品设计成循环额度，借款人只需为实际提取的余额支付利息。客户主要使用旗舰产品 Aven Home
              Card，它在运营上类似于可通过信用卡使用的房屋净值信贷额度（HELOC）。房主可以在销售点直接使用实体卡或数字卡消费，也可以把资金直接转到其他账户；利息只在实际未偿余额上计提。除核心循环卡外，Aven
              已披露的产品还包括面向希望获得可预测还款计划的借款人的标准固定还款 HELOC、免费且以移动端为先的 Aven Advisor（用于提供个人理财洞察和跟踪房屋净值指标），以及正在探索的融资额度，包括与
              Forest River
              联名的休闲车贷款和已宣布的资产支持卡概念，例如比特币抵押信贷额度。客户工作流把传统数周的房屋净值借款变成在线优先的开户体验，强调快速数字预资格审批和自动房产估值，但现金转账和特定提款机制会收取交易费。
