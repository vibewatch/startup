      - number: '4.3'
        title: 商业进展、资本充足性与承销尽调
        blocks:
          - type: paragraph
            body: >-
              Aven 自 2022 年在加利福尼亚州进入市场以来，放款速度显著提升：2024 年 7 月 Series D 时累计发放信贷额度 $1.5B、拥有 33,000 名持卡人；到 2025 年 9 月 Series
              E 时，累计发放额度已超过 $3.0B [CI001, CI006, CI012]。房主累计节省的利息从 2024 年年中超过 $100M，扩大到 Khosla Ventures 以 $2.2B 估值领投
              $110M Series E 后的超过 $215M [CI001, CI006, CI013]。资本化规模仍然可观，Series D 和 Series E 合计带来 $252M 的累计股权融资，并有 Khosla
              Ventures、General Catalyst、GIC 和 Founders Fund 等一级机构支持 [CI013, CI014]。Aven 首次完成评级交易后不到 10 个月，其资产支持票据获得 AAA
              投资评级，进一步证明了机构资本市场的认可 [CI006]。但 EquityZen
              等平台的二级市场流动性受私人股东限制影响；月度净现金消耗、公司运营现金跑道和仓储工具杠杆上限等关键前瞻财务数据仍未公开，妨碍完整承销评估 [CI015, CI016]。
