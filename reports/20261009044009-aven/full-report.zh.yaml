      - number: '3.2'
        title: 能力与定价权衡
        blocks:
          - type: paragraph
            body: >-
              当消费可以留在卡内时，Aven 的卡形态更具差异化：它把房屋净值额度与 2% 返现结合起来，Bankrate 的评测称其不收年费、开卡费或提前还款费。代价是资金必须转到银行账户或其他余额时要收取 2.5%
              的费用，这会削弱其在现金密集型场景中的优势。Aven Home Equity Cash 和 Figure 更接近直接流动性替代品。LendEDU 报道，Aven Home Equity Cash 额度为
              $5,000 至 $400,000，提供固定利率条款，最快 3 天放款；Figure 额度可达 $750,000，支持固定和浮动结构，可能在 5 天内放款。这些是发布方报道的快照，不代表特定借款人的报价。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
