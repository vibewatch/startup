  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Aven 所处的可服务市场位于三类主要信贷的交汇处：传统房屋净值信贷额度（HELOC）、封闭式二次抵押贷款 / 家装贷款，以及一般用途循环信用卡债务。Aven 的核心产品 Home Equity Visa
              Card，以住宅不动产作抵押，为消费者重构开放式循环借贷，主要面向自住物业。纳入的支出包括高额可选消费、结构化家装项目、大额汽车融资以及循环信用卡余额转账；排除的支出包括用于购房的第一顺位住宅抵押贷款、商业抵押贷款、多户住宅建设融资以及小额无抵押发薪日贷款。市场研究和行业基准还会把消费房屋净值金融科技与同名
              Aven Hospitality 品牌下、无关的 B2B 酒店营销软件区分开来。


              这一市场中的现状替代品包括商业银行和信用合作社发放的传统存款型 HELOC、套现型抵押贷款再融资、独立的无抵押个人贷款（由 SoFi 等金融科技公司或传统贷款机构发放），以及传统高年化利率无抵押信用卡。传统
              HELOC 通常需要数周人工处理、实地房产评估、线下公证预约和高额成交成本；Aven 则利用自动估值模型（AVM）和数字公证，把放款流程压缩到几分钟内完成审批，最快 3
              天即可获得资金，而且不收发起费或评估费。此外，Aven 与 Forest River 开展联名经销商融资，说明其正把资产支持的循环额度延伸到传统零售端休闲车贷款这一相邻市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
