      - number: '7.2'
        title: 自动化与抵押物范围共同放大运营风险
        blocks:
          - type: paragraph
            body: >-
              Aven
              称速度是其运营文化的一部分，第三方公司简介也称公司用自动化处理、评估和批准贷款。这些功能可以降低成本、缩短周期，但也让模型治理、不利行动准确性、披露控制和事件响应成为组合质量的核心。简介描述的产品覆盖房屋净值和比特币抵押物，使控制边界从房产估值和完善留置权，扩展到加密托管和抵押物波动。Trustpilot
              的存档摘要高度肯定便捷性和服务，但平台明确表示不会核实具体评论者的说法。因此，客户情绪只能作为监测输入，不能替代正常运行时间、欺诈、服务、投诉或损失数据。
