      - number: '1.3'
        title: 资本化历程、估值变化与投资者基础
        blocks:
          - type: paragraph
            body: >-
              截至目前，Aven 累计完成超过 $400M 的股权融资，用于充实资产负债表、扩大获客和拓展州级放贷牌照。公司在 2024 年 7 月完成由 Khosla Ventures 和 General Catalyst
              共同领投的 $142M Series D 融资，并在 Founders Fund、Caffeinated Capital 和 Electric Capital 参与后成为独角兽。General Catalyst
              随后继续参与 Aven 的 Series E，认可其早期信贷表现和市场扩张指标。Series E 注资后，私人估值约为
              $2.2B，但在私人运营状态下，经审计的单位经济、贷款损失准备金以及合作银行的收入分成安排仍未披露。
            claimRefs:
