      - number: '7.4'
        title: 投资逻辑需要以证据为基础的触发器
        blocks:
          - type: paragraph
            body: >-
              只有管理层提供分母和合同证据，风险状况才可监测。立即开展的尽调应把投诉和诉讼清单与源记录核对，测试承销和不利行动模型，检查银行合作方和托管方的终止权，并审阅损失队列、欺诈、逾期、融资契约和流动性。投资逻辑破坏触发器应包括损失或欺诈表现超出批准限额、监管机构提出重大问题、无法续约关键合作方、融资渠道丧失，或控制事件反复发生且补救错过董事会批准的期限。更柔性的预警阈值，是经验证客户情绪恶化并伴随投诉量上升。在这些记录可获得前，适当结论是剩余不确定性，而不是断言不存在未记录的事件或执法行动。
