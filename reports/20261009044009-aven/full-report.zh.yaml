      - number: '2.2'
        title: 市场规模、估值视角与可服务需求
        blocks:
          - type: paragraph
            body: >-
              评估 Aven
              的可服务市场，不能只看一个笼统估算，而要从多个维度切入。宏观层面的总可用市场（TAM）以美国住宅房主可提取的全部住宅净值为锚，覆盖数千万套有抵押贷款的房产，总额超过数万亿美元。可服务市场（SAM）聚焦于活跃的循环消费信用卡余额，以及信用评分处于中等至优质区间（FICO
              640 分及以上）的房主年度房屋净值信贷额度发放量。考虑到 2026 年年中计息信用卡的平均年化利率为 22.15%，而 Aven 的抵押利率为 6.49% 至 14.99%，硬上限为
              18%，美国无抵押循环信用卡债务尤其适合整合。


              可获取市场（SOM）是 Aven 已获牌的 43 个州和华盛顿特区内、寻求灵活流动性来整合债务、改善住房或购买联名资产的优质及准优质房主。Aven 在 Home Equity Pulse
              中公布的自主放款趋势显示，城市房主需求集中于债务重组：在亚特兰大等基准大都会区，40% 的提款用于债务整合，15% 用于家装，45% 用于其他消费用途，获批 HELOC 平均额度达到
              $97,550。不过，Aven 在纽约、密苏里州和内华达州等人口众多且经济重要的司法辖区尚未获牌，这限制了其数字贷款平台近期的地域覆盖。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: 买方细分、工作流触发因素与嵌入式分销
        blocks:
          - type: paragraph
            body: >-
              Aven 的客户可分为三类行为队列：利率套利整合者、可选项目装修者和联名资产购买者。利率套利整合者是已有房产、但背负高息信用卡余额或高成本个人贷款的房主；他们利用 Aven 2.5%
              的余额转账费和个位数至低两位数年化利率，大幅降低每月融资支出。可选项目装修者利用最高 $400,000 的循环额度分阶段支付房屋维修、扩建或大额更换工程，按承包商里程碑提款，并获得 2%
              不限额返现，用于抵扣账单最低应付额。


              第三类新兴客户是联名资产购买者，来自 Aven 与 Forest River Financial Services 的战略合作。休闲车车主中超过 80% 同时拥有房产，因此 Aven 通过 Forest
              River Homeline Card 在经销商端嵌入融资：额度最高 $400,000，年度经销商采购最高 $50,000 的部分返现 3%，其他消费返现 1%。这套流程改变了 RV
              和船艇经销商的销售点融资：符合条件的买家不用等待数周的传统二顺位抵押文件，最快 3 分钟完成预资格审批，3
              天内获得资金，绕开传统经销商融资的障碍。但所有细分客群的采用都会受到风险认知的影响：把住宅抵押物用于循环生活消费或 RV 购买，一旦违约就会暴露于严重的止赎风险。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 抵押承销带来的结构性利润率优势
            body: >-
              Aven 以住宅不动产作抵押发放循环卡额度，形成相对于商业银行的结构性利率套利。传统无抵押信用卡在 2026 年的典型利率超过 22%，Aven 因而能把房屋净值卡定价在 6.49% 至
              14.99%，同时通过合作银行 Coastal Community Bank 保持有吸引力的利差。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: 抵押循环信贷与止赎风险
            body: 用住宅净值为日常便利消费和可选消费债务提供抵押，会形成尖锐的消费者保护权衡。无抵押信用卡违约通常导致信用受损和催收；Aven 卡违约最终可能触发住宅止赎程序。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与证据边界
        blocks:
          - type: paragraph
            body: >-
              分配到的证据把 Figure 识别为 Aven 最清晰的、具名的直接数字 HELOC 替代品。Aven 自身覆盖两种形态：通过 Visa 卡使用的循环房屋净值额度，以及更传统的 Home Equity Cash
              产品。传统
              HELOC、无抵押奖励卡、现金储蓄和家庭内部流动性，都是为消费或获取现金这一底层需求提供的相关替代品；但证据中没有这些替代品当前报价的具名信息，因此展示材料把商业条款标为未知，而不是套用通用基准。另有两项分配结果涉及无关的酒店科技企业
              Aven Hospitality，仅用于记录实体辨析，不作为 Aven Financial 的竞争证据。
