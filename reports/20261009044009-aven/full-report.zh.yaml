      - number: '1.4'
        title: 运营规模、地域扩张与公司里程碑
        blocks:
          - type: paragraph
            body: >-
              Aven Home Card 自 2022 年商业化推出以来，已在超过 30 个美国州快速扩大放款规模，为房主提供超过 $3B 的信贷额度。Aven 据称，其资产支持结构相较于年化利率超过 20%
              的传统无抵押卡，已为持卡人累计节省超过 $215M 利息。客户获取数据表明市场扩张明显：八成持卡人此前从未开通过房屋净值信贷额度。展望未来，Aven 的产品路线图计划覆盖全部 50
              个州，并扩展到汽车抵押卡和自动化抵押贷款再融资，把公司推向更广泛的机器银行平台。
            claimRefs:
