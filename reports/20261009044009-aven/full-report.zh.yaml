  - id: FI001
    title: Aven 收入与资本流瀑布图
    type: flow
    summary: 展示客户房屋净值放款如何转化为净利息收入、服务费和公司现金流。
    data:
      nodes:
        - id: node-origination
          label: 1. 房屋净值放款
          detail: 房主通过 Coastal Community Bank 合作发行的 Visa HELOC 提取净值，信用额度最高 $250k
        - id: node-revolving-balance
          label: 2. 循环余额提款
          detail: 借款人以 7.99%-15.49% 的浮动 APR 使用额度，产生约 11.74% 的毛利息收益
        - id: node-capital-funding
          label: 3. 仓储资本融资
          detail: 信贷工具通过机构仓储额度和 AAA 级资产支持证券化获得融资，资金成本约为 7.50%
        - id: node-net-spread
          label: 4. 净利差捕获
          detail: 运营公司捕获借款人 APR 与机构债务成本之间估计 4.25% 的净利差
        - id: node-servicing-fee
          label: 5. 资产服务与交易费用
          detail: 对未偿余额收取约 1.00% 的服务费，另收 2.50% 的余额转移和提现流动性费用
        - id: node-net-margin
          label: 6. 运营现金利差
          detail: 扣除低抵押信贷损失（0.50%-1.00%）和公司运营费用后的净现金流
      edges:
        - from: node-origination
          to: node-revolving-balance
        - from: node-revolving-balance
          to: node-capital-funding
        - from: node-capital-funding
          to: node-net-spread
        - from: node-net-spread
          to: node-servicing-fee
        - from: node-servicing-fee
          to: node-net-margin
    approximationNotes: 流程机制依据公开浮动利率表和独立资本成本基准建模；确切的 SPV 预付款率和服务收益率属于非公开信息。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
      - CI009
      - CI012
  - id: FE001
    title: Aven 消费金融技术栈
    type: stack
    summary: Aven 房屋净值借贷平台及其运营依赖的六层架构。
    data:
      layers:
        - label: 客户互动与访问层
          detail: Aven Home Card（Visa）、数字账户转账、Aven Advisor 个人财务仪表盘和移动账户管理
        - label: 决策与承保引擎
          detail: 自动预资格审查、信用风险评分、收入核验，以及实时债务收入比评估
        - label: 估值与抵押物智能
          detail: 自动估值模型（AVM）、数字产权和契据核验，以及实时可用净值边界
        - label: 留置权完善与数字结清
          detail: 电子文件签署、数字公证执行和自动化县级契据登记流程
        - label: 银行与贷款服务核心
          detail: 合作银行放款设施、循环信用额度服务和监管合规监控
        - label: 资本市场与支付结算
          detail: Visa 卡支付网络结算、自动提款发放和仓储融资设施
    approximationNotes: 架构层级综合产品运营审查、官方披露和贷款方分析。
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示客户从申请、净值核验、发卡到使用信贷的主要接触点。
    data:
      items:
        - label: 发现与资格评估
          touchpoints:
            - 消费者看到将产品利率与传统 HELOC 对比的宣传
            - 用户完成数字身份核验并提交房产地址
        - label: 自动净值核验
          touchpoints:
            - 无需手工提交工资单，即可完成数字房产估值和留置权检查
            - 通过自动估值模型生成承保决策
        - label: 发卡与激活
          touchpoints:
            - 虚拟 Visa 卡激活，实体卡由 Coastal Community Bank 寄送
            - 建立最长期限 10 年、返现 2% 的信用额度
        - label: 循环使用与还款
          touchpoints:
            - 消费者通过销售点刷卡交易或 ACH 转账提款
            - 借款人按循环条款或仅付息计划偿还余额
        - label: 扩展与多资产抵押
          touchpoints:
            - 符合条件的借款人可获得最高 $1M 的比特币抵押信贷额度
            - 房屋净值变化时，客户仍可使用信贷额度
        - label: 企业酒店业旅程
          touchpoints:
            - 酒店经营者评估 SynXis 预订引擎和数字营销服务
            - 直接接入物业管理系统，带来更高的直接预订量
    approximationNotes: 代表根据平台文档和审阅者见证构建的标准消费者及企业客户导入流程。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
      - CU010
      - CU012
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性剩余风险评级强调证据缺口，不代表经过测量的概率。
    data:
      columns:
        - key: risk
          label: 风险
          detail: 根据指定证据归纳的风险类别。
        - key: likelihood
          label: 可能性
          detail: 分析师的定性判断，不是测量出的概率。
        - key: impact
          label: 影响
          detail: 风险发生后的潜在影响。
        - key: mitigation
          label: 缓释成熟度
          detail: 公开可见的流程，不代表经过独立测试的有效性。
        - key: residual
          label: 剩余严重程度
          detail: 仅考虑已披露缓释措施后的评级。
      rows:
        - label: 消费者放贷合规
          note: 规则范围广；检查和测试结果不可得。
          values:
            - value: Consumer-lending compliance
            - value: Medium
            - value: High
            - value: Developing
            - value: High
        - label: 银行合作连续性
          note: 仅有一家具名银行合作关系；合同条款不可得。
          values:
            - value: Bank-partner continuity
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 融资与流动性
          note: 已筹资本金不等于可用现金；融资工具条款未披露。
          values:
            - value: Funding and liquidity
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 模型与信贷控制
          note: 已披露自动化，但没有验证和损失数据。
          values:
            - value: Model and credit controls
            - value: Medium
            - value: High
            - value: Developing
            - value: High
        - label: 安全与隐私
          note: 存在不利报道；指定资料中未提供主要事件记录。
          values:
            - value: Security and privacy
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 客户服务恶化
          note: 已归档的评论摘要为正面，但评论中的说法未经验证。
          values:
            - value: Customer-service deterioration
            - value: Low-medium
            - value: Medium
            - value: Partial
            - value: Medium
    approximationNotes: 所有评级均为定性判断；在缺少公开分母的情况下，有意不估算概率、损失或现金。
    claimRefs:
      - CR007
      - CR010
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径将运营证明与价格证明分开，最终进入继续研究关口。
    data:
      nodes:
        - id: operating-signal
          label: 运营信号
          detail: 公司报告客户增长 3 倍，累计授信额度超过 $3B。
          tone: positive
        - id: adjacency
          label: 相邻机会
          detail: 抵押贷款再融资扩大产品论点，但缺少公开市场进展指标。
          tone: neutral
        - id: price-anchor
          label: 价格锚点
          detail: 2025 年 9 月的 E 轮融资确立 $2.2B 投后估值。
          tone: neutral
        - id: multiple-hurdle
          label: 倍数门槛
          detail: 记录收入 $100M 隐含 22.0x 倍数，但运行口径与 LTM 含义不明。
          tone: risk
        - id: liquidity-hurdle
          label: 流动性门槛
          detail: Forge 显示没有价格，市场活动有限。
          tone: risk
        - id: decision
          label: 跟踪 / 继续研究
          detail: 要求经审计的经济数据、信贷群组、股权结构条款和当前交易价格。
          tone: warning
    approximationNotes: 这是定性证据链，不代表阶段转换率、概率或比例值。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV011
      - CV014
      - CV016
