        title: 展示材料
        blocks:
          - type: callout
            title: 抵押信用卡创新与实体辨析
            body: >-
              Aven 以房屋净值为信用卡额度提供抵押，开创了新的产品类别，让优质房主能以接近抵押贷款的低利率快速在线开户。但尽调人员必须把 Aven Financial, Inc. 与其他使用 Aven
              名称的企业区分开来，包括在 Nasdaq Stockholm 上市的 Avensia（AVEN.ST）和 TPG 支持的 Aven Hospitality，以免污染承销和估值基准。
