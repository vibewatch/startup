        blocks:
          - type: callout
            title: 抵押物改变了竞争中的信任逻辑
            body: Aven 的低利率卡形态仍然以房屋作抵押。对于自律、消费可留在卡内的借款人，它在经济上很有吸引力；但对于不愿把止赎风险附着到日常消费上的借款人，替代性会明显降低。
            calloutType: risk
            claimRefs:
              - CP001
