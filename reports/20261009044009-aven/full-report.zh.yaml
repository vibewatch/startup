        - 经审计的增长，加上可重复的融资和损失表现
        - 通过较弱的承保或不经济的融资换取增长
      - - 基准
        - 核心产品增长，但相邻产品证据和经审计利润率仍不完整
        - $1B 和 $2.2B 是历史融资锚点，不是公允价值区间；暂缓价格和回报估算
        - 当前指标大体验证上一轮融资时的运营叙事
        - 下一次融资决策前尽调仍未完成
      - - 悲观
        - 信贷损失上升、银行渠道收紧、增长放缓或流动性持续有限
        - 降价轮融资或不投资结果；无法从指定公开证据量化幅度
