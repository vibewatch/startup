      - number: '8.2'
        title: 融资与估值证据
        blocks:
          - type: paragraph
            body: >
              独立交易报道基本都指向 2025 年 9 月 Khosla Ventures 领投的 $110M Series E，投后估值 $2.2B。估值从 2024 年 7 月报道的 $1B Series D
              参照值上升；Multiples 在两轮交易日记录的收入都为 $100M，因此计算倍数从 10.0x 升至 22.0x。融资总额无法完全对账。Tracxn 和 Multiples 报告两轮合计 $252M，而
              Forge 显示总融资 $392.06M，并列出 $98.67M 的 Series E-1
              金额。这些差异可能来自股份类别、交易或数据定义不同，但分配到的证据没有解决它们，不能据此断言可用现金、稀释程度或现金跑道。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
