      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Aven 最明确、可辩护的产品差异，是把循环信用卡使用与房屋净值定价结合起来，而不是已经证明存在结构性护城河。对于可以用卡消费的场景，这种形态很有吸引力；但借款人需要现金时，每次转账都要收取已报道的 2.5%
              费用，经济性会减弱。Figure 可以在大额余额和利率结构选择上竞争，传统 HELOC 和无抵押卡仍是替代品，但其当前条款在此尚未确定。抵押物会在放款后制造借款人摩擦，但这或许保护的是所有抵押贷款机构，而不只是
              Aven。现有证据没有证明 Aven 拥有专有分销、独家供给或银行准入、竞争者融资优势或已量化的切换率，因此护城河耐久性应继续作为承销缺口，而不是确定性评分。
