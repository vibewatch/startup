      - number: '4.2'
        title: 成本结构、单位经济与融资利差
        blocks:
          - type: paragraph
            body: >-
              Aven 的核心单位经济高度依赖持卡人年化利率与仓储信贷额度及资产支持证券化所产生的机构资金成本之间的净息差。外部独立分析指出，净息差是该商业模式的主要收入引擎 [CI009]。持卡人浮动利率平均约为
              11.74%，仓储融资基准与 SOFR 加机构信用利差等浮动指数挂钩，在基准情景下估计接近 7.5%；Aven 因而获得约 4.25% 的结构性净息差，另有估计 1.0% 的资产服务费
              [CI009]。由于房屋净值抵押，预期违约率通常按 0.50% 至 1.00% 建模，较无抵押贷款模式更能保护毛利；不过仓储工具折价和股权次级要求会占用公司现金
              [CI009]。经验证的消费者反馈也印证了用户满意度和运营开户效率，持卡人称赞数字发起流程顺畅、获取资金迅速且无需前期繁琐材料
              [CI010]。然而，实际获客成本（CAC）、直邮和数字渠道的回本周期、客户终身价值（LTV）以及实现的组合损失率，仍是未在经审计披露中公布的严格保密私人指标
              [CI011]。自动承销和自动估值模型（AVM）显著降低了前期发起成本，但机构投资者仍需要经审计的贷款表现数据来验证组合利润率能否持续 [CI006, CI011]。
