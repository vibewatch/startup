        title: 展示材料
        blocks:
          - type: callout
            title: 抵押品套利推动更优的信贷单位经济
            body: >-
              Aven 的财务核心，是房屋净值抵押安全性与信用卡便利性之间的套利。通过给循环额度附加不动产留置权，Aven 把预期贷款违约率控制在 0.50% 至 1.00%，远低于无抵押循环组合通常的 3% 至
              5%。这种低信用损失表现让 Aven 在首次发行资产支持票据后不到 10 个月就获得 AAA 投资评级，从而以基准利率获得机构仓储债务；即便向持卡人提供比传统无抵押信用卡低约 50% 的利率，仍能守住约
              4.25% 的净息差 [CI001, CI006, CI009]。
