callouts:
  - calloutType: "risk"
    title: "Real Estate Collateralization Mechanics in Revolving Card Formats"
    body: "While Aven's digital application and card-based revolving format provide consumer credit speeds and lower APRs than unsecured cards, the product fundamentally remains a home equity loan secured by the borrower's home. Treating revolving card balances casually risks real estate foreclosure upon delinquency, and variable interest rates can escalate carrying costs during prolonged high-rate monetary environments."
    claimRefs:
      - "CE002"
      - "CE014"
      - "CE015"
      - "CE016"
  - calloutType: "insight"
    title: "Algorithmic Underwriting and the Proprietary Technology Veil"
    body: "Aven positions its streamlined underwriting as a primary technology differentiator that replaces weeks of legacy bank processing with automated AVM property appraisals and digital risk screening. However, the exact precision of Aven's automated valuation algorithms, third-party model dependency, and machine banking systems remain private, requiring institutional investors to diligence loan-level loss reserves and appraisal failover rates."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE012"
      - "CE013"
