chapter:
  number: 8
  title: "Valuation"
  summary: "Aven's September 2025 Series E established a $2.2 billion post-money reference, while one private-market data source records $100 million of revenue and a 22.0x implied revenue multiple. The evidence supports a track/research-more recommendation rather than a price endorsement because current audited economics, credit performance, security terms, ownership, and a reliable secondary mark are not public in the assigned evidence."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: |
      The recommendation is track/research more, with medium-low confidence, high underwriting risk, and a stretched-to-unsupported valuation stance at the last disclosed $2.2 billion post-money reference. The positive case is real but company-led: Aven reported threefold customer growth, more than $3 billion of aggregate credit lines, and expansion into mortgage refinancing. The price case is weaker. Multiples records $100 million of revenue and a 22.0x implied multiple, but explicitly says its revenue field may represent run-rate revenue or last-twelve-month revenue; it should not be treated as ARR. Forge shows no available price and limited market activity. Entry should therefore wait for audited revenue quality, margins, cohort losses, security terms, ownership, and a transaction price that supports a defined downside case.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-and-valuation-evidence"
    title: "Financing and Valuation Evidence"
    body: |
      Independent deal reporting converges on a $110 million Series E at a $2.2 billion post-money valuation in September 2025, led by Khosla Ventures. The valuation increased from the $1 billion Series D reference reported for July 2024, while Multiples' recorded revenue remained $100 million at both round dates; its calculated multiple consequently rose from 10.0x to 22.0x. Funding totals do not fully reconcile. Tracxn and Multiples report $252 million across two rounds, whereas Forge displays $392.06 million of total funding and a $98.67 million Series E-1 amount. Those discrepancies may reflect share-class, transaction, or data-definition differences, but the assigned evidence does not resolve them. They should not be converted into a claim about cash available, dilution, or runway.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
  - id: "scenario-framework-and-exit-readiness"
    title: "Scenario Framework and Exit Readiness"
    body: |
      Public evidence supports conditional scenarios, not probability-weighted valuation outputs. A bull outcome requires verified revenue acceleration beyond the recorded $100 million figure, durable credit performance, and demonstrated mortgage-refinance adoption before a valuation above the last round can be defended. The base case is a diligence hold: the $1 billion Series D and $2.2 billion Series E are historical financing anchors, not a current fair-value range. The bear case is a down-round or no-invest outcome if losses deteriorate, the bank relationship weakens, growth stalls, or private-market liquidity remains limited. No supportable target MOIC, IRR, hold period, or exit range can be calculated without an entry price, fully diluted ownership, preferences, audited economics, and comparable transaction evidence.
    claimRefs:
      - "CV003"
      - "CV008"
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "diligence-gates-and-thesis-breakers"
    title: "Diligence Gates and Thesis Breakers"
    body: |
      The investment committee should request audited revenue recognition, gross margin, contribution margin, funding costs, delinquencies, charge-offs, vintage curves, and stress performance by product. It should also obtain the current cap table, fully diluted share count, liquidation preferences, participation rights, anti-dilution terms, pro-rata rights, debt covenants, bank-partner agreement, and securitization documentation. The customer signal is encouraging but weak for valuation: Trustpilot's AI-generated review summary describes an easy and fast experience while warning that individual reviewer claims are not verified. Thesis-break triggers are a material deterioration in cohort losses, loss or restriction of Coastal Community Bank issuance, mortgage expansion without disclosed economics, a financing below the last-round reference, or continued absence of auditable metrics before a liquidity event.
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
