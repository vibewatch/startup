chapter:
  number: 3
  title: "Competitors"
  summary: "The assigned evidence supports a narrow product-level conclusion: Aven differentiates with a home-equity-backed Visa interface and purchase rewards, while Figure offers larger direct HELOC capacity and both fixed- and variable-rate structures. Durability remains unproven because competitor funding, bank and channel contracts, named incumbent terms, and observed switching behavior are not available in the assigned source pool."
sections:
  - id: "landscape-and-boundary"
    title: "Competitive Landscape and Evidence Boundary"
    body: "The assigned evidence identifies Figure as the clearest named direct digital HELOC alternative to Aven. Aven itself spans two formats: a revolving home-equity line accessed through a Visa card and a more conventional Home Equity Cash product. Conventional HELOCs, unsecured rewards cards, cash savings, and internal household liquidity are relevant substitutes for the underlying job of funding purchases or obtaining cash, but the pool contains no named, current offers for those alternatives; the exhibits therefore mark their commercial terms as unknown rather than importing generic benchmarks. Two allocated results concern Aven Hospitality, an unrelated hotel-technology business, and are retained only to document entity disambiguation, not as competitive evidence about Aven Financial."
    claimRefs:
      - "CP001"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "capability-and-pricing"
    title: "Capability and Pricing Tradeoffs"
    body: "Aven's card format is differentiated when spending can remain on card: it pairs a home-equity line with 2% cash back and reports no annual, sign-up, or prepayment fee in Bankrate's review. The tradeoff is a 2.5% fee when value must move to a bank account or another balance, reducing the advantage for cash-heavy use cases. Aven Home Equity Cash and Figure are closer substitutes for direct liquidity. LendEDU reports Aven Home Equity Cash at $5,000 to $400,000 with fixed-rate terms and funding in as few as three days, while Figure reaches $750,000, supports fixed and variable structures, and may fund in five days. These are publisher-reported snapshots, not borrower-specific offers."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP013"
      - "CP014"
    tableRefs:
      - "TP002"
  - id: "trust-distribution-and-lock-in"
    title: "Trust, Distribution, and Switching Friction"
    body: "The customer-evidence surface is mixed rather than uniformly favorable. Trustpilot's automated summary says reviewers commonly praise speed, ease, and support, while Bankrate displays a 1.6 customer score from 34 ratings and says 12% would recommend the lender; those populations and methods are not comparable, so neither is treated as a universal satisfaction measure. Aven's home collateral also changes the trust proposition: EquitySquirrel emphasizes that delinquency can ultimately create foreclosure exposure, unlike an ordinary unsecured card. The assigned texts describe applications, underwriting, notarization, and lien creation, supporting an inference that moving between secured providers entails procedural friction, but they do not provide churn, multi-homing, distribution-partner, or bank-contract evidence."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement"
    title: "Moat Durability and Displacement Risk"
    body: "Aven's clearest defendable product distinction is the combination of revolving card access and home-equity pricing, not a demonstrated structural moat. The format is attractive for card-payable spending, but its economics weaken when a borrower needs cash because each transfer carries the reported 2.5% fee. Figure can compete for larger balances and rate-structure choice, while conventional HELOCs and unsecured cards remain substitute categories whose current terms were not established here. Collateral creates borrower friction after origination, but that friction may protect any secured lender rather than Aven specifically. No assigned evidence establishes proprietary distribution, exclusive supply or bank access, competitor funding advantage, or measured switching rates, so durability should remain an underwriting gap rather than a scored certainty."
    claimRefs:
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP010"
      - "CP014"
      - "CP015"
    figureRefs:
      - "FP001"
