callouts:
  - calloutType: "insight"
    title: "Dual Identity in Market Sourcing"
    body: "Public domain evidence in 2026 reveals two distinct commercial entities operating under the Aven name: Aven (the asset-backed consumer credit card fintech founded in 2019 backed by Coastal Community Bank and BitGo) and Aven Hospitality (the enterprise hotel technology firm spun out of Sabre Hospitality by TPG). Diligence analysts must carefully separate retail consumer credit metrics from enterprise hotel SaaS deployments."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU012"
  - calloutType: "risk"
    title: "Consumer Underwriting Transparency and Absence of Public Cohort Loss Data"
    body: "While Aven boasts a 4.9-star Trustpilot rating and over $300M in consumer interest savings, retail loan performance data—including net charge-off rates, delinquency curves, and automated valuation model error margins—remains completely private. Investors must treat reported borrower savings as marketing aggregates rather than audited credit performance."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU010"
