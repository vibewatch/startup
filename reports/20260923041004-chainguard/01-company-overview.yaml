company:
  name: Chainguard
chapter:
  number: 1
  title: Company Overview
  summary: "Chainguard is a fully remote, Kirkland-Washington-incorporated cybersecurity startup founded in\n2021 by four former Google engineers who built foundational open-source supply-chain security\ntooling (sigstore, distroless, Tekton). The company's mission is to be the \"trusted source for\nopen source,\" providing zero-CVE hardened container images, language libraries, and VM images\nthat eliminate vulnerabilities before they enter production. Chainguard crossed the unicorn\nthreshold in July 2024 with a $140M Series C at a $1.12B valuation, then tripled to $3.5B in\nApril 2025 ($356M Series D). A $280M General Catalyst growth-financing round in October 2025\nbrought total raised to $892M. ARR reached $40M in fiscal year 2025 \u2014 a 7x year-on-year leap\nfrom roughly $5M \u2014 with 150+ enterprise customers including Canva, GitLab, HPE, Snap, and\nAnduril. The company employs approximately 350\u2013620 people worldwide (estimates vary) and\noperates with no physical offices.\n"
  researchQuestions: []
sections:
- id: S-identity
  title: Identity, Founding, and Business Model
  body: "Chainguard was incorporated in 2021 and launched publicly with a December 2021 seed round of\n$5 million. The company is registered in Kirkland, Washington, though it operates as a\nfully distributed organization with no permanent physical office. Its four active co-founders \u2014\nDan Lorenc (CEO), Matt Moore (CTO), Kim Lewandowski (CPO), and Ville Aikas (Distinguished\nEngineer) \u2014 all held senior roles at Google, where they created or led sigstore (the de-facto\nopen-source code-signing infrastructure), Distroless container images, and Kubernetes supply\nchain tooling. A fifth co-founder, Scott Nichols, departed in 2022.\n\nChainguard's product thesis is \"secure-by-design\": rather than scanning for vulnerabilities\nafter they appear, the company delivers minimal, hardened container images and language\nlibraries that contain zero known CVEs (Common Vulnerabilities and Exposures) at time of\ndelivery. Customers subscribe on a SaaS model to receive continuously rebuilt,\
    \ patched image\nfeeds and provenance-signed software bills of materials (SBOMs), replacing commodity public\nimages from Docker Hub or language ecosystems with hardened equivalents that dramatically\nshrink the attack surface.\n\nThe business model is subscription-based SaaS, with per-seat or per-image-pull pricing tiers\ntargeting enterprise DevSecOps and platform-engineering teams. Revenue is aligned with\ncustomer usage of Chainguard Images, Chainguard Libraries, and the newer Chainguard VMs\nproduct line. Government-sector deals are structured around FedRAMP-aligned compliance\nrequirements and SBOM mandates from U.S. executive orders.\n"
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: S-funding
  title: Funding History, Valuation, and Investors
  body: "Chainguard has completed five priced rounds and one growth-financing tranche since founding,\nraising a cumulative $892 million as of October 2025. The trajectory reflects exceptional\nvaluation compression: seed at implied sub-$50M; Series A ($50M, June 2022) at undisclosed\nterms; Series B ($61M, November 2023); Series C ($140M, July 2024) establishing the $1.12B\nunicorn valuation; and Series D ($356M, April 2025) reaching $3.5B \u2014 a 3.1x step-up in nine\nmonths. The October 2025 General Catalyst growth-financing round ($280M from the Customer\nValue Fund) was structured as strategic debt/growth capital rather than a traditional priced\nequity round, and did not trigger a new equity valuation headline; together with Series D it\nsecured $636M within six months.\n\nCore venture investors include Sequoia Capital (since Series A), Kleiner Perkins (new in\nSeries D), IVP (Series C and D co-lead), Lightspeed Venture Partners, Redpoint Ventures, and\nSpark Capital. Strategic corporate\
    \ investors include Salesforce Ventures and Datadog Ventures\n(both new in Series D), signaling deep-pocketed go-to-market alignment with the enterprise\nsoftware ecosystem. Amplify Partners and Mantis VC are also participating investors.\n\nThere is no public indication of secondary transactions, tender offers, or founder liquidity\nevents in any disclosed round. The company has not filed for IPO as of the report date.\n"
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO002
- id: S-milestones
  title: Key Milestones and Traction
  body: "Chainguard's rapid ascent from founding to $3.5B valuation in under four years is among the\nfastest supply-chain-security scale-ups on record. Demand accelerated sharply after several\nheadline supply-chain incidents validated the market: the SolarWinds hack (2020), Log4Shell\n(2021), and the XZ Utils backdoor (March 2024) \u2014 an attempted compromise of a widely-used\nopen-source compression library \u2014 each drove renewed enterprise urgency around securing\nsoftware build pipelines. U.S. Executive Order 14028 (May 2021) and the subsequent OMB\nguidance on SBOMs created a compliance pull in federal procurement that benefits Chainguard\ndirectly.\n\nCustomer traction metrics: 5x customer base growth year-on-year as reported at Series C\n(July 2024); over 175% ARR growth in the first six months of fiscal year 2024; 150+\nenterprise customers at Series D (April 2025); and ARR of $40M for full-year FY2025\nrepresenting approximately 7x year-on-year growth from roughly $5\u2013\
    6M in FY2024. The company\nprojects crossing $100M ARR before end of FY2026.\n\nHeadcount has grown from under 50 at Series A to approximately 350\u2013620 by 2025 (range\nreflects methodological differences across sources: GeekWire cited \"over 350\" in April 2025;\nLATKA estimated 622 for the same period). The company is fully remote and plans no physical\noffice, offering coworking stipends and biannual company-wide summits.\n\nNotable product milestones include the July 2022 public launch of Chainguard Images, the\n2023 launch of Chainguard Libraries, the 2024 expansion into VM images, and the 2025\nintroduction of AI-workload-specific secure images targeting LLM and GPU infrastructure\ndeployments.\n"
