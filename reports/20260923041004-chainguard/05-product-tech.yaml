  summary: "Chainguard's product portfolio centers on Wolfi OS \u2014 a purpose-built Linux \"undistro\" \u2014\nand a nightly rebuild pipeline that produces 2,000+ zero-CVE container images, hardened\nlanguage libraries, and VM images. The technical differentiation is build-time security:\nimages are rebuilt nightly from upstream sources, SBOMs are generated at build time, and\nevery artifact is signed with cosign/sigstore achieving SLSA Build Level 3. Tools melange\n(package builder) and apko (image assembler) are the open-source build infrastructure.\nThe product delivers drop-in compatibility with public Docker Hub images while eliminating\nknown CVEs at the point of delivery.\n"
