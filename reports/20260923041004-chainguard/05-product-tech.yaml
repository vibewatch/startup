sections:
- id: SE_PRODUCT
  title: Product Architecture and Core Technology
  order: 1
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  body: "Chainguard's technical architecture is built on a three-layer stack: (1) Wolfi OS \u2014 a\npurpose-built Linux undistro that provides the foundational package system; (2) the melange/apko\nbuild pipeline \u2014 open-source, declarative tools that convert Wolfi package definitions into\nminimal OCI container images with embedded SBOMs; and (3) the cosign/sigstore signing layer\nthat cryptographically attests every artifact. Every night, the pipeline evaluates all 2,000+\nimage definitions against upstream source repositories, rebuilds any image whose upstream\npackages have changed (including CVE patches), and signs the resulting images with in-toto\nprovenance attestations at SLSA Build Level 3. This automated rebuild cadence is a core\noperational differentiator: competitors who patch on-demand cannot match Chainguard's\nsystematic approach to maintaining zero-CVE status across the full image catalog.\n\nWolfi's key design decisions differentiate it from Alpine Linux: it uses\
    \ glibc (vs Alpine's\nmusl libc) for broader enterprise application compatibility, provides individually versioned\npackages rather than a monolithic distro release cycle, and generates machine-readable SBOMs\nfor every package at build time. The melange build system is fully declarative (YAML-based\npackage definitions), making builds reproducible and auditable. The pipeline processes\nover 500 million build manifests, reflecting its considerable scale and sustained operational maturity across the entire image catalog.\n"
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: SE_PRODUCTS
  title: Product Portfolio and Compliance
  order: 2
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  body: "Chainguard's product portfolio comprises four lines: (1) Chainguard Images \u2014 the flagship\ncontainer image subscription covering 2,000+ images across OS bases, language runtimes,\ndatabases, web servers, and AI/ML frameworks; (2) Chainguard Libraries \u2014 hardened, continuously\npatched packages for Python, Java, Node.js, Go, and other ecosystems; (3) Chainguard VMs \u2014\nhardened virtual machine images for AWS, Azure, and GCP cloud compute; and (4) Commercial\nBuilds (launched January 2026) \u2014 a product allowing enterprises to use the Wolfi build\ninfrastructure to produce proprietary application builds with verified provenance.\n\nThe compliance story is central to the federal and regulated-industry go-to-market: Chainguard\nprovides FIPS 140-2 validated and STIG-hardened image variants, aligning with NIST SP 800-218\nSSDF mandates and enabling FedRAMP-compliant deployments. This regulatory moat is difficult for\npure DevSecOps SaaS vendors (Snyk, Aqua) to replicate\
    \ without equivalent build-time SBOM and\nattestation infrastructure.\n"
  tableRefs:
  - TE002
- id: SE_LIMITS
  title: Product Limitations and Competitive Considerations
  order: 3
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  body: "Chainguard's principal product limitation is catalog coverage: not every open-source software\npackage has a Wolfi equivalent, requiring customers to request new images or maintain custom\nbuilds for legacy or niche software. The free tier is restricted to the :latest tag without\nversion pinning, creating friction for teams that require reproducible builds with pinned\nimage digests. G2 user reviews note that this free-tier limitation makes initial value\ndemonstration harder compared to tools (Docker Scout, Grype) that scan existing images\nwithout requiring a migration to a new container base.\n\nThe 'zero-CVE' claim is precise but requires nuanced interpretation: Chainguard Images have\nzero known CVEs at publish time, not zero future CVEs; new vulnerabilities discovered post-publish\nare remediated within the contractual SLA (7 days for critical). Chainguard has a material\ndependency on the sigstore/cosign infrastructure (hosted by CNCF/OpenSSF), which introduces\nan upstream\
    \ supply chain dependency for its own signing chain. A compromise of the sigstore\ntransparency log or CNCF-hosted infrastructure would materially affect Chainguard's trust model.\n\nThe product scope excludes runtime security, CSPM (cloud security posture management), and\nnetwork-level threat detection \u2014 a gap relative to CNAPP competitors such as Palo Alto\nPrisma Cloud and Wiz that provide end-to-end cloud security. This positions Chainguard\nas a point solution in the broader security stack rather than a platform, which may limit\nbudget size per deal and increase risk of platform consolidation as CNAPPs expand into\nimage supply chain capabilities. Community feedback on GitHub and G2 also cites that the\nWolfi glibc choice, while improving compatibility, can require application-level build\nadjustments for teams migrating from Alpine-based musl images.\n"
  tableRefs:
  - TE003
