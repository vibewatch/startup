- id: SM-buyers
  title: Buyer Segments and Demand Dynamics
  body: "Chainguard's primary buyers are large enterprise and public-sector organizations that operate\ncloud-native production environments and face regulatory or contractual security requirements.\nThe buying decision typically sits with Platform Engineering, DevSecOps, or Cloud Security\nteams, with CISO and Chief Architect sign-off for enterprise deals and Contracting Officer\napproval for U.S. federal deals.\n\n**Technology sector** (including software companies and hyperscalers) is the largest\nsegment by volume. These organizations run extensive container-based workloads, maintain\nlarge open-source software dependencies, and often face customer security review requirements\n(SOC 2, ISO 27001) that incentivize supply chain hardening. Named Chainguard customers\nincluding Canva, GitLab, Snap, and Anduril reflect this segment.\n\n**Financial services** (banking, insurance, capital markets) is the second-largest segment\nby revenue potential due to high regulatory scrutiny, large IT\
    \ budgets, and zero-tolerance\nfor data breaches. ANZ Bank is a named customer, suggesting APAC banking adoption. U.S. and\nEU financial regulators increasingly require provenance documentation for software systems.\n\n**Federal government** (U.S. Department of Defense, civilian agencies, defense contractors)\nis the highest-value segment for per-contract revenue, driven by EO 14028 and OMB M-22-18\nSBOM mandates. FedRAMP authorization requirements for cloud-based tools create both a barrier\nto entry (protecting incumbents) and a competitive moat once cleared (locking out\nunauthorized vendors).\n\n**Healthcare and critical infrastructure** segments are emerging, driven by HHS cybersecurity\nguidance, CISA Critical Infrastructure advisories, and post-incident response requirements\nfollowing ransomware attacks on healthcare IT.\n\nThe buying cycle for enterprise supply chain security tools typically ranges from 3\u20139 months,\nwith complexity increasing in regulated industries. Chainguard's\
    \ strategy of developer\nadoption (bottom-up, community) combined with enterprise contracts (top-down, CISO) reflects\nthe product-led-growth pattern common in developer-tool companies.\n"
  claimRefs:
  - CM001
