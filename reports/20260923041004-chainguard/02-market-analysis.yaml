- id: SM-growth
  title: Growth Drivers, Constraints, and Market Risks
  body: "**Primary growth drivers** for Chainguard's market are structural and near-term:\n\n- *Regulatory acceleration*: U.S. Executive Order 14028 (SBOM mandates, May 2021), OMB\n  M-22-18, EU Cyber Resilience Act (2024), NIST SSDF, and FedRAMP SBOM requirements create\n  compliance pull. By 2025\u20132026, SBOM requirements are expanding to financial services (ECB,\n  PRA) and critical infrastructure sectors beyond federal IT.\n\n- *Supply chain incidents*: Each high-profile incident (SolarWinds 2020, Log4Shell 2021,\n  XZ Utils 2024) produces a measurable surge in security buyer urgency and procurement\n  timeline compression. The XZ Utils backdoor specifically validated the risk of\n  nation-state attackers compromising open-source maintainers \u2014 Chainguard's exact\n  threat model.\n\n- *Cloud-native adoption*: Kubernetes usage continues to grow; CNCF's 2024 Annual Survey\n  found over 80% of enterprises running Kubernetes in production. Each container-based\n  workload creates\
    \ a unit of demand for secure base images.\n\n- *AI workload proliferation*: The emergence of LLM inference and training infrastructure\n  (GPU clusters, containerized model serving) introduces new and large open-source dependency\n  footprints. Chainguard has explicitly targeted AI workloads in its Series C messaging.\n\n**Market constraints and risks**:\n\n- *DevSecOps maturity prerequisite*: Chainguard's products require customers to have\n  established CI/CD pipelines and container infrastructure. Small and mid-market organizations\n  lack this maturity, narrowing the current SAM.\n\n- *CISO skepticism about scanning vs. prevention*: Some enterprise buyers continue to use\n  point scanning tools and are skeptical of migrating to a prevention-first model. This\n  creates customer education overhead and longer sales cycles.\n\n- *Competition from bundled security platforms*: Cloud providers (AWS ECR, Azure ACR, GCP\n  Artifact Registry) and endpoint security vendors (CrowdStrike, Palo\
    \ Alto Networks,\n  Aqua Security) bundle container scanning into broader platforms, reducing standalone\n  budgets available for purpose-built tools.\n\n- *Regulatory slowdown risk*: If U.S. policy direction shifts and SBOM enforcement slackens\n  under a different administration, compliance pull could diminish \u2014 though industry-driven\n  adoption would likely continue on its own momentum.\n\n- *Market fragmentation*: Analyst estimates for the market size vary by 2x\u20133x across\n  sources, reflecting definitional inconsistencies. This fragmentation complicates\n  TAM/SAM measurement and investor comparisons.\n"
