  topStrengths:
    - 技术护城河独特：Wolfi OS + 每晚重建 + SLSA L3 溯源，是市场上最难复制的供应链安全栈
    - 监管顺风：EO 14028、NIS2、DORA 和 CISA Secure by Design 在美国和欧盟企业市场拉出多年合规需求
    - 开发者驱动的 PLG 动作（cgr.dev 月拉取 4M+）带来有机、资本效率高的自下而上管线
    - 客户验证已落地：Elastic CVE 减少 90%，150+ 企业 logo 覆盖国防、金融服务和科技行业
    - 法律和监管画像干净：公司历史上无诉讼、无 IP 纠纷，且没有确认过的安全事件
  topRisks:
    - 平台整合风险：Google（收购 Wiz 后）、CrowdStrike 和 Palo Alto 都在扩展容器扫描；TAM 可能在整合压缩前只有 3–5 年窗口
    - 87.5x trailing ARR 入场倍数是 VC 市场中位数的 4x，必须持续保持 80%+ ARR 增长才撑得起估值
    - 烧钱压力：估计每月烧钱 $8-12M，意味着 2026 年底前需要 Series E 或 IPO；悲观情景（Lacework 先例）指向潜在减记
    - 关键人物集中：Dan Lorenc（CEO，sigstore 联合创建者）是公司技术和商业层面的核心门面
    - Wolfi 包生态存在 XZ 式供应链攻击风险；若恶意维护者发布带后门镜像，将对信任造成灾难性冲击
  unresolvedGaps:
    - FY2025 经审计 ARR、NRR 和毛利率未公开披露，而这些是估值倍数分析的核心输入
    - 完整股权结构表、清算优先权和优先股堆叠、Series D 条款经济性仍为私有信息，优先股悬压只能估计
    - Wolfi 构建管线没有公开第三方安全审计，XZ 式内部人威胁风险无法量化
    - 欧盟数据中心 / 实体状态尚未确认，欧洲扩张存在 NIS2/GDPR 数据主权暴露
    - FY2026 ARR 轨迹需要按季度跟踪；截至 Q1 2026 公开证据，$100M 目标尚未确认
