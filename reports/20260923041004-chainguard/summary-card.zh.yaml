summary:
  headline: >
    Chainguard 已经筑起市场最深的供应链安全护城河：SLSA L3 溯源、每晚零 CVE 重建和 Wolfi OS 背后是 4+ 年工程投入，CNAPP 既有厂商很难复制。EO 14028、NIS2、DORA
    带来强监管顺风，开发者驱动管线也在扩大，支撑长期投资逻辑。不过，87.5x trailing ARR 的入场倍数已经按完美执行定价，几乎不给执行失误留余地。建议：持有——若确认 FY2026 ARR ≥ $80M 且 NRR ≥
    120%，上调至买入。
