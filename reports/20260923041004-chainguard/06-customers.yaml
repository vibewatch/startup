sections:
- id: SU_OVERVIEW
  title: Customer Base Overview and Growth
  order: 1
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  body: "Chainguard has grown to 150+ enterprise customers as of April 2025, achieving this in\napproximately 3.5 years since founding in October 2021. The customer base is anchored by\nnamed references including Canva, GitLab, HPE, Snap, Anduril, ANZ Bank, Booz Allen\nHamilton, and Elastic. ARR was approximately $40M in FY2025, with a target of $100M+\nfor FY2026, implying a 150%+ growth rate \u2014 significantly above the 30-40% growth\ntypical for security SaaS at comparable scale. Customer count has grown at approximately\n50-75% CAGR since founding: from essentially zero at founding (October 2021) to 150+ at\nSeries D (April 2025).\n\nThe aggregate customer impact claimed by Chainguard is 100,000+ engineering hours saved\non vulnerability remediation \u2014 a metric reflecting the labor intensity of manual CVE\npatching that Chainguard's automated pipeline eliminates. At $40M ARR and 150+ customers,\nthe implied average contract value is approximately $267K per customer, consistent\
    \ with\nan enterprise (not SMB) business model. Compared to Snyk at a similar ARR stage (which\nhad 1,200+ customers at $100M ARR implying ~$83K ACV), Chainguard operates significantly\nupmarket \u2014 reflecting a CISO-level, compliance-driven buying process rather than Snyk's\ndeveloper-led bottom-up motion.\n"
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU_CUSTOMERS
  title: Named Customer Case Studies and Vertical Coverage
  order: 2
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  body: "Chainguard's named customer portfolio spans five distinct verticals: cloud-native\nsoftware companies (Canva, GitLab, Elastic, Snap), enterprise IT (HPE), defense and\ngovernment (Anduril Industries, Booz Allen Hamilton), financial services (ANZ Bank),\nand federal contractors. This vertical diversification is notable for a company at\nChainguard's stage and reduces revenue concentration risk across any single industry.\n\nThe strongest documented customer outcome is Elastic's published case study, which\nreports approximately 90% CVE reduction after migrating to Chainguard Images \u2014\nmaking it the most quantitatively validated customer reference. Snap's public\nendorsement confirms consumer-internet-scale production adoption. GitLab's November\n2024 partnership announcement gives Chainguard distribution access to GitLab's 30M+\ndeveloper user base as a channel for PLG adoption.\n\nFederal and defense customers (Anduril, Booz Allen) follow a distinct adoption\npattern: rather\
    \ than developer-led bottom-up adoption, these customers are driven\nby compliance requirements \u2014 FIPS 140-2 certification, STIG hardening mandates, and\nEO 14028's SBOM requirements. This creates a second, regulatory-driven demand\nchannel that operates independently of Chainguard's PLG motion.\n"
  tableRefs:
  - TU002
- id: SU_GTM
  title: Go-to-Market Model, Retention, and Expansion
  order: 3
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  body: "Chainguard operates a hybrid PLG plus enterprise sales model. Developers adopt the\nfree tier of Chainguard Images (up to 5 images, :latest tag only) through self-serve\npull from the Chainguard registry (cgr.dev). Chainguard's inside and field sales\nteam then identifies developer-adopting organizations and converts them to paid\nenterprise subscriptions through a land-and-expand motion. The free tier is\ndeliberately limited to drive conversion: version pinning, historical image access,\nSBOM downloads, and SLA coverage all require paid subscription.\n\nThe expansion model within customers flows from Images (initial land) to Libraries\n(language-level hardening, broader team coverage) to VMs (infrastructure teams)\nto Commercial Builds (for ISVs and enterprises with proprietary application builds).\nNet revenue retention and customer concentration are not publicly disclosed,\ncreating diligence uncertainty. At 622 employees against $40M ARR, revenue\nper employee is approximately\
    \ $64K \u2014 below the $200K efficiency target \u2014 indicating\nthe company is still in GTM scaling mode, consistent with its hiring pace and\nfundraising cadence. The primary adoption blockers cited in user reviews are\ncatalog coverage gaps and migration complexity when transitioning from Alpine-\nbased images to Wolfi-based equivalents. Chainguard does not appear to have a\nchannel or reseller program beyond the GitLab partnership, relying primarily on\ndirect enterprise field sales supported by the PLG developer community funnel. The\ndeveloper ecosystem signal from GitHub community activity (tens of thousands of\nrepository stars across open-source Wolfi and sigstore projects) provides an\norganic awareness channel that reduces cost of top-of-funnel customer acquisition\nrelative to competitors who rely exclusively on paid marketing.\n"
  tableRefs:
  - TU003
