  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基数概览与增长
        blocks:
          - type: paragraph
            body: |
              截至 2025 年 4 月，Chainguard 已增至 150+ 个企业客户，距离 2021 年 10 月创立约 3.5 年。客户基数由一批已命名案例支撑，
              包括 Canva、GitLab、HPE、Snap、Anduril、ANZ Bank、Booz Allen Hamilton 和 Elastic。FY2025 ARR 约 $40M，
              FY2026 目标为 $100M+，隐含 150%+ 增长率——显著高于同规模安全 SaaS 常见的 30–40% 增长。客户数自创立以来约按 50–75% CAGR 增长：
              从创立时基本为零（2021 年 10 月）到 Series D 时 150+（2025 年 4 月）。

              Chainguard 声称为客户累计节省 100,000+ 工程小时的漏洞修复工作——该指标反映手工 CVE 修补的高人力强度，也正是 Chainguard 自动化流水线所消除的成本。
              在 $40M ARR 和 150+ 客户下，隐含平均合同价值约为每客户 $267K，符合企业级（非 SMB）商业模式。与相近 ARR 阶段的 Snyk 相比
              （Snyk 在 $100M ARR 时有 1,200+ 客户，隐含约 $83K ACV），Chainguard 明显更偏高端客群——体现 CISO 级、合规驱动的采购过程，而非 Snyk 的开发者自下而上动作。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
