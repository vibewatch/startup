companyProfile:
  summary: >
    Chainguard 是一家软件供应链安全公司，为企业和云原生客户提供零 CVE 容器镜像和加固语言包。核心产品 Chainguard Images（2,000+ 个加固镜像）由 Wolfi OS 支撑——这是一个为该场景专门打造的
    Linux“非发行版”， 支持 glibc、每日包更新和完整 SLSA L3 构建来源证明。客户包括 Canva、GitLab、HPE、Snap、Anduril、 ANZ Bank、Booz Allen Hamilton 和
    Elastic，覆盖科技、国防和金融服务。公司由四位前 Google 工程师于 2021 年 10 月创立；CEO Dan Lorenc 曾共同创建 sigstore 和 cosign。Series D 轮估值 $3.5B（2025
    年 4 月）； 累计融资 $892M。
