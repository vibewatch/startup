      - number: '4.3'
        title: 资本充足性与财务判断
        blocks:
          - type: paragraph
            body: >
              Chainguard 累计融资 $892M，其中 $636M 集中在六个月窗口内完成（2025 年 4–10 月）。按估算年度烧钱 $80–150M

              （从 $40M ARR、622 名员工和成长阶段成本结构外推），即使不计收入增长，公司也有合理的 4–8 年现金跑道——资本充足性非常强。


              2025 年 10 月 General Catalyst Customer Value Fund 的 $280M 融资按业绩挂钩增长资本设计，而非传统股权或风险债，既减少现有股东稀释，

              又延长现金跑道，并为 Chainguard 的商业势头提供机构背书。该融资结构叠加 Series D（$356M，估值 $3.5B），表明投资者预期公司将在 2–4 年内发生重大流动性事件（IPO 或 M&A）。


              关键财务风险是集中度：150+ 客户、估算 $267K ACV 意味着前 10 大客户可能贡献 15–25% ARR。到 FY2026 达到 $100M ARR，需要把客户基数翻倍

              （在相近 ACV 下到 ~375 个），或把既有客户 ACV 扩张到约 $650K——两种路径都要求持续的企业销售能力和更快产品采用。资本不是约束变量；销售执行和产品扩张才是 $100M ARR
              里程碑的关键变量。
