  - id: FE001
    type: stack
    title: Chainguard 产品架构栈
    order: 1
    layout: standard
    summary: |
      分层技术栈展示 Chainguard 的产品架构：从 Wolfi OS 底座，到构建工具、签名基础设施，再到面向客户的产品线。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    data:
      layers:
        - label: 客户产品
          detail: Images | Libraries | VMs | 商业构建
          modules:
            - Chainguard Images（2,000+）
            - Chainguard Libraries
            - Chainguard VMs
            - 商业构建
        - label: 安全层
          detail: cosign 签名 | SLSA L3 证明 | SBOM（CycloneDX + SPDX）
          modules:
            - cosign / sigstore
            - in-toto 证明
            - SBOM 生成（apko）
        - label: 构建流水线
          detail: melange（APK 构建器）| apko（OCI 组装器）| 夜间重建自动化
          modules:
            - melange
            - apko
            - CI 重建流水线
        - label: Wolfi OS
          detail: glibc | apk 包 | 单独版本化 | 无内核
          modules:
            - Wolfi 包定义
            - APK 包管理器
            - glibc
        - label: 运行时交付
          detail: OCI registry 交付 | 签名拉取 | 策略执行
          modules:
            - Chainguard registry 交付
            - cgr.dev 分发
            - 签名验证
        - label: 开发者体验
          detail: 文档 | 教程 | CI/CD 集成
          modules:
            - docs.chainguard.dev（文档站点）
            - CI/CD 集成
            - 支持工具
  - id: FU001
    type: journey-map
    title: Chainguard 客户旅程：从开发者发现到企业续约
    order: 1
    layout: wide
    summary: |
      端到端客户旅程：开发者最初发现免费 Chainguard Images，随后团队采用、转化为企业客户，并扩展到更多产品线。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    data:
      items:
        - id: J1
          label: 认知
          detail: 开发者通过 GitHub、Wolfi/SLSA 社区或 CNCF 会议发现 Chainguard
          actor: 开发者
          sentiment: neutral
        - id: J2
          label: 免费采用
          detail: 拉取 Chainguard Image（:latest）；替换 Docker Hub 基础镜像；在 CI 中测试零 CVE
          actor: 开发者 / 小团队
          sentiment: positive
        - id: J3
          label: 转化触发
          detail: 需要版本固定、SBOM 下载或 CVE SLA；免费层不够用
          actor: 平台 / 安全负责人
          sentiment: neutral
        - id: J4
          label: 企业落地
          detail: 签订企业订阅；为生产容器部署，并配合准入控制
          actor: CISO / 平台工程
          sentiment: positive
        - id: J5
          label: 扩展
          detail: 扩展到 Libraries（Python/Java）；评估 VMs 用于非容器基础设施
          actor: 工程组织
          sentiment: positive
        - id: J6
          label: 续约
          detail: 凭合规证据和 CVE SLA 履约记录续约；扩大合同范围
          actor: 企业采购
          sentiment: positive
  - id: FR001
    type: matrix
    title: 风险热力图：可能性 vs 影响
    order: 1
    layout: wide
    summary: |
      风险热力图把 Chainguard 的主要风险放在“可能性 vs 影响”矩阵中。高可能性且高影响的风险，是优先缓释对象。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 重大影响
      rows:
        - label: 高可能性
          values:
            - label: n/a
              tone: neutral
            - label: AWS/Docker 原生扫描竞争
              tone: warning
            - label: FY2026 ARR 增长不达标
              tone: negative
            - label: n/a
              tone: neutral
        - label: 中等可能性
          values:
            - label: n/a
              tone: neutral
            - label: 人才流失；AI 加速 CVE 暴露
              tone: warning
            - label: 关键人物离职（Lorenc）
              tone: warning
            - label: CNAPP 整合（3-5 年周期）
              tone: negative
        - label: 低可能性
          values:
            - label: PQC 迁移扰动
              tone: positive
            - label: EU 数据主权缺口
              tone: neutral
            - label: XZ 式 Wolfi 后门攻击
              tone: warning
            - label: Sigstore 基础设施遭攻破
              tone: warning
        - label: 极低可能性
          values:
            - label: n/a
              tone: neutral
            - label: 诉讼或 IP 争议
              tone: positive
            - label: n/a
              tone: neutral
            - label: Chainguard 镜像遭入侵
              tone: negative
        - label: 监管顺风
          values:
            - label: SBOM 执法放松
              tone: neutral
            - label: EU 采购需求
              tone: positive
            - label: 联邦合规拉动
              tone: positive
            - label: 强制 secure-by-design 规则
              tone: positive
        - label: 竞争压力
          values:
            - label: 单点扫描器降价
              tone: warning
            - label: 云厂商捆绑销售
              tone: warning
            - label: CNAPP 平台整合
              tone: negative
            - label: 零 CVE 镜像加固商品化
              tone: negative
  - id: FV001
    type: flow
    title: 建议逻辑：从证据到 HOLD
    order: 1
    layout: wide
    summary: |
      流程图串起市场证据、技术验证、风险评估和估值背景，落到 HOLD 建议，并列出上调 / 下调触发条件。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    data:
      nodes:
        - id: FL1
          label: 供应链安全市场到 2030 年达 $9.7B，CAGR 26%
          detail: TAM 大且在增长，支撑独立做到 $500M ARR 的潜力
        - id: FL2
          label: 技术护城河：Wolfi + SLSA L3 + 夜间重建流水线
          detail: 领先 3-4 年；CNAPP 既有厂商很难在 <2 年内复制
        - id: FL3
          label: 监管顺风：EO 14028 + NIS2 + DORA + CISA
          detail: 美国联邦和 EU 企业市场有多年合规拉动
        - id: FL4
          label: 平台整合风险（Google-Wiz、CRWD、PANW）
          detail: 周期 3-5 年；整合窗口关闭前需要做到 $300M ARR
        - id: FL5
          label: 87.5x 往绩 ARR——入场倍数激进
          detail: 估值按完美执行定价；是 VC 可比公司中位数的 4x；ARR 不能失误
        - id: FL6
          label: HOLD 建议
          detail: ARR 达 $80M 且 NRR >120% 时上调至 BUY；ARR 不达标则下调至 SELL
        - id: FL7
          label: 监控：FY2026 ARR 季度进展；NRR；CNAPP 竞争公告
          detail: 12 个月复盘触发项，上调和下调标准明确
      edges:
        - from: FL1
          to: FL6
        - from: FL2
          to: FL6
        - from: FL3
          to: FL6
        - from: FL4
          to: FL6
        - from: FL5
          to: FL6
        - from: FL6
          to: FL7
