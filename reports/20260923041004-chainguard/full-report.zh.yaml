              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: |
              Chainguard 的投资逻辑建立在三根支柱上：(1) 技术护城河，CNAPP 在位者很难在 2–3 年内结构性复制（Wolfi OS、每晚重建流水线、SLSA L3 来源证明——约 4 年工程投入）；
              (2) 多年、多司法辖区的监管顺风（EO 14028、NIS2、DORA、CISA Secure by Design），在不把直接监管负担压到 Chainguard 身上的情况下，创造合规驱动的企业拉动；
              (3) 开发者主导的 PLG 动作（每月 4M+ 次拉取），建立资本效率更高的自下而上企业管线。

              OSSRA 2025 报告验证了供应链安全的持续紧迫性（84% 商业代码库带有开源漏洞），ARK 和 Goldman Sachs 预计相关安全市场到 2030 年有 25–30% CAGR——
              这提供 $7B+ 长期 TAM，支撑独立增长逻辑。软件供应链安全市场预计将从 2024 年 $2.4B 增至 2030 年 $9.7B，CAGR 为 26%。

              反向逻辑集中在三点：(1) 87.5 倍 ARR 入场倍数很苛刻，几乎不给执行失误留空间——即便 ARR 只低于预期 20%，倍数也会扩张到约 100 倍，可能迫使下轮融资降估值；
              (2) CNAPP 平台整合（Google-Wiz、CRWD、PANW）可能在 3 年内让容器加固市场商品化，并在 Chainguard 达到 IPO 规模前压缩其 TAM；
              (3) 产品范围窄，在 $100–200M ARR 处可能出现天花板，因为企业买方会向更少安全平台整合。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: 估值背景与情景分析
        blocks:
          - type: paragraph
            body: |
              以 $3.5B 估值和约 $40M 的 FY2025 ARR 计算，Chainguard 交易倍数约为 87.5 倍追踪 ARR——这是 2024 年 VC 市场中位数 22 倍（Pitchbook）的 4 倍，
              反映市场为 150%+ 增长和可防守技术护城河支付溢价。Goldman Sachs 的增长调整基准显示，150%+ 增长公司可获得 30–50 倍前瞻收入倍数；
              若 FY2026 ARR 达 $100M（乐观），倍数压缩至 35 倍——相对公开可比公司（CrowdStrike ~25 倍、SentinelOne ~20 倍）仍有溢价，但在可辩护区间内。
              Bessemer / Meritech 的公开 SaaS 基准也支持高增长网络安全公司中最快增长群体享有 30–50 倍前瞻倍数。

              三种情景：乐观（25%）：FY2026 ARR $100M+、NRR 130%+、2027–2028 年以 40–50 倍 ARR 退出 = $7.2–9B，回报 2–2.6 倍。
              基准（50%）：FY2026 ARR $80M、2028 年 IPO 时 ARR $200M、倍数 30–35 倍 = $6–7B，回报 1.7–2 倍。
              悲观（25%）：FY2026 ARR $55–65M、增长减速、M&A 或降估值轮按 20–25 倍 ARR = $1.4–2B，回报 0.4–0.57 倍。
              概率加权预期价值估计约 $5.7B，意味着以 $3.5B 入场的预期回报为 1.6 倍（稀释前）。在已融资 $892M 且大概率有 1 倍清算优先权的情况下，优先权悬挂很重——悲观情景中，
              低于 $892M 的全部退出所得都会被优先股投资者拿走。Lacework 式结果（2024 年收购价显著低于 $8.3B 融资估值）仍是尾部风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.3'
        title: 可比公司与退出准备度
        blocks:
          - type: paragraph
            body: |
              可比样本覆盖正向并购可比交易、公开市场交易可比公司，以及带警示性的私营公司案例。正向案例：Wiz
              在 2025 年 3 月以约 $32B 被收购，对应约 $500M ARR、约 64x ARR，是并购可比交易的天花板；这说明，如果
              Chainguard 达到 $150-200M ARR，战略买家可能愿意支付 $5-7B。公开市场可比公司的交易区间为 18-25x ARR；
              CrowdStrike 在 $5B ARR 上拿到 25x，SentinelOne 在 $1B ARR 上约 20x。Palo Alto Networks 的 Prisma Cloud
              CNAPP 混合倍数为 8-12x，说明增长放慢会让估值倍数严重下修。

              警示案例：Lacework 2021 年在 ARR 不到 $100M 时以 $8.3B 估值融资（约 80x），随后在 2024 年以远低于该估值的价格出售给
              Fortinet，Fortinet 还计提了减值。Orca Security 2024 年以 $1.8B 完成平轮，表明增长停滞会触发估值重置。两者都是
              Chainguard 在 87.5x ARR 倍数下承受风险的直接先例。退出准备度：Chainguard 的定性条件较强（治理、法律成熟度、知名投资人），但要成功公开上市，还需要
              $200M+ ARR、70%+ 毛利率，以及 Rule of 40 > 50。2025-2026 年网络安全 IPO 窗口正在改善，但基准情景下
              Chainguard 更现实的时间表是 2028 年。由战略买家并购仍是可信的替代退出路径，未来 3 年概率为 40%。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
