              - CU004
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战略与竞争风险
        blocks:
          - type: paragraph
            body: >
              Chainguard 的主导战略风险是平台整合：随着 CNAPP 厂商（Palo Alto Prisma Cloud、Wiz 之后的 Google Security、CrowdStrike Falcon
              Cloud Security、

              Microsoft Defender for Cloud）扩展容器安全和供应链能力，镜像加固点解决方案的独立市场可能被压缩。Google 2025 年 3 月以 $32B 收购 Wiz 是定义性先例——

              Google 现在拥有带容器扫描能力的 CNAPP 平台，并会积极向镜像供应链层发展。CrowdStrike 和 Microsoft 是第二、第三大平台威胁，二者都在用扫描和证明功能扩展 CNAPP 产品。

              Chainguard 的技术护城河（每晚重建流水线、Wolfi OS、构建时 SBOM、SLSA L3 来源证明）很深，短期难以复制；但 Google 或 Microsoft 级别的资源充足竞争对手，

              可能在 2–3 年内投入足够资源复制。


              初创公司竞争相对温和：RapidFort 采用摩擦更低的路径（无需迁移、移除未使用包），但供应链保证更弱。AWS ECR Inspector 和 Docker Scout 提供免费扫描，

              争夺扫描预算，但不竞争 Chainguard 的重建并证明模型。开源核心 Wolfi 模型引入搭便车动态：任何竞争对手都可以在 Apache 2.0 下 fork Wolfi 包定义，

              构建竞争性镜像目录，而无需商业回馈。与相近 ARR 阶段的 Snyk 相比，Chainguard 护城河更深（构建时加固比扫描更难复制），但市场集中度更高。

              生存风险排序中，整合按严重性排第一；Chainguard 在整合让点解决方案定位不可维持之前达到独立 IPO 规模（$300M+ ARR）的窗口估计为 2027–2029 年。

              如果 IPO 窗口收窄，由 Google、CrowdStrike 或 Palo Alto 以高于 $3.5B 的溢价战略收购，仍是最可能退出路径。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
