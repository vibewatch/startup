      - number: '6.2'
        title: 已命名客户案例与垂直覆盖
        blocks:
          - type: paragraph
            body: |
              Chainguard 的已命名客户组合横跨五个清晰垂直：云原生软件公司（Canva、GitLab、Elastic、Snap）、企业 IT（HPE）、国防和政府
              （Anduril Industries、Booz Allen Hamilton）、金融服务（ANZ Bank）以及联邦承包商。以 Chainguard 当前阶段看，这种垂直多元化值得注意，
              也降低了单一行业收入集中风险。

              文档最充分的客户成果是 Elastic 发布的案例研究，其中称迁移到 Chainguard Images 后 CVE 约减少 90%——这是量化验证最强的客户背书。
              Snap 的公开背书确认了消费互联网规模的生产采用。GitLab 2024 年 11 月合作公告让 Chainguard 通过 GitLab 30M+ 开发者用户基数获得 PLG 渠道分发。

              联邦和国防客户（Anduril、Booz Allen）采用路径不同：这些客户不是开发者自下而上推动，而是由合规要求驱动——FIPS 140-2 认证、STIG 加固要求，以及
              EO 14028 的 SBOM 要求。这创造了第二条由监管驱动的需求渠道，独立于 Chainguard 的 PLG 动作运行。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
