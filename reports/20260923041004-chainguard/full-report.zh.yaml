  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: |
              Chainguard 竞争的软件供应链安全市场，是应用安全的一个子集，处理代码进入生产环境之前、构建时引入的漏洞。公司产品
              （加固容器镜像、语言库、VM 镜像）在这个市场中占据一个清晰细分：防御性的安全内建基础设施，而非反应式漏洞检测（扫描）。
              相关 TAM 覆盖三类组织：(a) 生产环境依赖容器化或基于 VM 的工作负载，(b) 大规模消费开源软件，且 (c) 面临软件来源证明和
              SBOM 生成方面的监管或合同要求。

              三个相邻市场共同界定 Chainguard 的合并 TAM 框架：

              1. **软件供应链安全**：聚焦构建流水线、依赖管理、代码签名和制品完整性。多家分析机构估计，全球市场 2024 年为 $2.4–3.1B，
              到 2030–2033 年按 12–22% CAGR 增至 $5.1–12.5B。

              2. **容器与云原生应用安全**：覆盖容器镜像扫描、运行时保护、Kubernetes 安全态势管理（KSPM），以及容器化工作负载的供应链完整性。
              2024 年估算为 $2.3–3.6B，更激进预测给出 20–26% CAGR，到 2030–2035 年达到 $9.4–25B。

              3. **DevSecOps 平台**：嵌入 CI/CD 流水线的一体化安全工具。Grand View Research 估算，DevSecOps 市场 2024 年为 $8.84B，
              到 2030 年以 13.2% CAGR 增至 $20.2B。Chainguard 的工作流集成把它放在 DevSecOps 平台层里，角色是安全基础镜像供应商。

              采用保守的重叠调整后估算，Chainguard 的混合 TAM 约为 2024 年 $6–8B，并将在 2030 年扩张至 $15–25B。Chainguard 的
              $40M ARR 对应不到 0.7% 市场份额，说明公司仍处于面对大机会的早期规模化阶段。
