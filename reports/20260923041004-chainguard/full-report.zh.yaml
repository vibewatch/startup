      - number: '1.3'
        title: 关键里程碑与牵引力
        blocks:
          - type: paragraph
            body: |
              Chainguard 从创立到估值 $3.5B 不到四年，是供应链安全领域有记录以来扩张最快的公司之一。几起头部供应链事件验证市场后，
              需求明显加速：SolarWinds 攻击（2020 年）、Log4Shell（2021 年），以及 XZ Utils 后门（2024 年 3 月）——这是一次试图攻陷广泛使用的开源压缩库的事件——
              都让企业重新急迫地关注软件构建流水线安全。美国 Executive Order 14028（2021 年 5 月）以及随后关于 SBOM 的 OMB 指南，
              在联邦采购中形成合规拉动，直接利好 Chainguard。

              客户牵引指标：Series C（2024 年 7 月）时报告客户基数同比增长 5 倍；2024 财年前六个月 ARR 增长超过 175%；
              Series D（2025 年 4 月）时企业客户 150+；FY2025 全年 ARR 为 $40M，约为 FY2024 的 $5–6M 的 7 倍。
              公司预计在 FY2026 结束前突破 $100M ARR。

              员工数从 Series A 时不到 50 人增至 2025 年约 350–620 人（区间反映不同来源的方法差异：GeekWire 在 2025 年 4 月称
              “over 350”；LATKA 对同期估算为 622）。公司完全远程办公，且没有实体办公室计划，提供共享办公津贴和每年两次全员峰会。

              重要产品里程碑包括：2022 年 7 月公开发布 Chainguard Images，2023 年推出 Chainguard Libraries，2024 年扩展到 VM 镜像，
              2025 年推出面向 LLM 和 GPU 基础设施部署的 AI 工作负载专用安全镜像。
