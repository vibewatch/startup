      - number: '1.2'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: |
              自创立以来，Chainguard 已完成五轮定价融资和一笔增长融资，截至 2025 年 10 月累计融资 $892 million。估值路径显示出异常强的估值压缩：
              种子轮隐含估值低于 $50M；Series A（$50M，2022 年 6 月）条款未披露；Series B（$61M，2023 年 11 月）；
              Series C（$140M，2024 年 7 月）把公司推到 $1.12B 独角兽估值；Series D（$356M，2025 年 4 月）达到 $3.5B——
              九个月内估值抬升 3.1 倍。2025 年 10 月 General Catalyst 增长融资（来自 Customer Value Fund 的 $280M）按战略债务 /
              增长资本设计，而非传统定价股权轮，因此没有触发新的股权估值标题；连同 Series D，公司在六个月内锁定 $636M。

              核心风投包括 Sequoia Capital（自 Series A 起）、Kleiner Perkins（Series D 新进）、IVP（Series C 和 D 共同领投）、
              Lightspeed Venture Partners、Redpoint Ventures 和 Spark Capital。战略企业投资方包括 Salesforce Ventures 和
              Datadog Ventures（均在 Series D 新进），显示其与企业软件生态的 Go-to-Market 协同具备深口袋支持。Amplify Partners 和
              Mantis VC 也参与投资。

              任何已披露轮次都没有公开迹象显示发生过老股交易、要约收购或创始人流动性事件。截至报告日期，公司尚未提交 IPO 申请。
