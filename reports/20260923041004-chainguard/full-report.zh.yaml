chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: |
              Chainguard 于 2021 年注册成立，并在 2021 年 12 月以 $5 million 种子轮公开亮相。公司注册地在
              Washington 州 Kirkland，但以完全分布式组织运营，没有固定实体办公室。四位仍在公司的联合创始人——
              Dan Lorenc（CEO）、Matt Moore（CTO）、Kim Lewandowski（CPO）和 Ville Aikas（Distinguished
              Engineer）——都曾在 Google 担任高级岗位，参与创建或领导 sigstore（事实上的开源代码签名基础设施）、
              Distroless 容器镜像和 Kubernetes 供应链工具。第五位联合创始人 Scott Nichols 于 2022 年离开。

              Chainguard 的产品逻辑是「安全内建」：公司不等漏洞出现后再扫描，而是交付极简、加固的容器镜像和语言库，
              这些交付物在交付时不含已知 CVE（Common Vulnerabilities and Exposures）。客户按 SaaS 模式订阅，获得持续重建、
              打补丁的镜像 feed，以及带来源签名的软件物料清单（SBOM）。这些加固等价物替代 Docker Hub 或语言生态里的通用公共镜像，
              大幅压缩攻击面。

              商业模式是订阅式 SaaS，按座席或镜像拉取量分层定价，面向企业 DevSecOps 和平台工程团队。收入与客户对
              Chainguard Images、Chainguard Libraries 以及较新的 Chainguard VMs 产品线的使用挂钩。政府部门交易围绕
              FedRAMP 对齐的合规要求和美国行政令下的 SBOM 强制要求设计。
