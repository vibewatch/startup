      - number: '3.2'
        title: Chainguard 的竞争护城河
        blocks:
          - type: paragraph
            body: >
              Chainguard 的护城河由三层相互强化的资产构成：(1) 技术基础设施——Wolfi OS 是专用 Linux“非发行版”，支持每晚基于上游源码重建 2,000+ 个镜像，

              并以合同 SLA 交付 7 天内关键 CVE 补丁；(2) 标准共同所有权——共同创建并维护 sigstore、cosign、SLSA 和 Wolfi，让 Chainguard
              参与塑造每个竞争对手最终都必须实现的供应链安全标准；

              (3) 通过开源领导力（参与 OpenSSF 和 CNCF）建立的品牌与社区信任，这是纯商业供应商难以快速复制的资产。


              技术护城河最持久：为 2,000+ 个镜像复制一条每晚重建流水线，需要多年基础设施投资、上游维护者关系，以及深厚 Linux 打包经验；这类团队极其稀缺。

              标准所有权护城河更脆弱——随着 sigstore 采用接近普及，它会从差异化能力变成基本门槛。Chainguard 的社区信任护城河，在要求供应链来源证明和 SBOM
              合规的安全敏感企业与政府机构中提供不对称品牌价值；

              但如果资源充足的在位者愿意在 2–3 年内以相近深度投入开源贡献，这一护城河并非无法复制。
