  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与核心技术
        blocks:
          - type: paragraph
            body: |
              Chainguard 的技术架构建在三层栈上：(1) Wolfi OS——一个专用 Linux“非发行版”，提供底层包系统；(2) melange/apko
              构建流水线——开源、声明式工具，把 Wolfi 包定义转换成带嵌入式 SBOM 的极简 OCI 容器镜像；(3) cosign/sigstore 签名层，
              对每一个制品做密码学证明。每晚，流水线都会把全部 2,000+ 个镜像定义与上游源码仓库比对，重建上游包发生变化的镜像
              （包括 CVE 补丁），并用 SLSA Build Level 3 的 in-toto 来源证明签署生成的镜像。这种自动化重建节奏是核心运营差异点：
              按需打补丁的竞争对手，无法匹配 Chainguard 在完整镜像目录上系统性维持零 CVE 状态的做法。

              Wolfi 的关键设计选择使其区别于 Alpine Linux：它使用 glibc（而非 Alpine 的 musl libc），提升企业应用兼容性；采用单独版本化的包，
              而不是单体发行版发布周期；并在构建时为每个包生成机器可读 SBOM。melange 构建系统完全声明式（基于 YAML 的包定义），
              因而构建可复现、可审计。该流水线处理超过 500 million 份构建清单，体现出相当大的规模，以及覆盖整个镜像目录的持续运营成熟度。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
