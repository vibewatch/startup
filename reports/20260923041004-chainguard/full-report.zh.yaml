      - number: '3.3'
        title: 定价与分销
        blocks:
          - type: paragraph
            body: |
              Chainguard 采用团队规模 + 镜像访问定价，10 名工程师团队起价约 $19,000/年，包含 2,000+ 个镜像全量访问、合同化 CVE 修复 SLA
              （关键 7 天，高 / 中 / 低 14 天）和不限量镜像拉取。免费层允许每个组织免费使用最多五个生产镜像，让企业承诺前先完成评估和开发者采用。
              这一模型与 Snyk 的按开发者座席定价（随员工数扩张但不随镜像消费扩张）以及 Aqua 的按工作负载 / 节点定价（随云基础设施规模扩张）形成战略差异。

              Chainguard 通过自有 registry、AWS Marketplace 和 Azure Marketplace 分销，让企业可用既有云承诺消费（EDP/MACC 协议）采购。
              Marketplace 可用性消除了企业安全销售中的常见摩擦：无需建立新的供应商关系即可采购。公司也通过面向平台工程和 DevSecOps 团队的企业销售动作直接销售。
              免费社区层、按团队定价和 Marketplace 分销结合，形成低摩擦采用漏斗，类似成功的开发者优先软件公司；部署规模扩大后，有清晰路径升级到企业合同。
              大型企业部署的年合同价值估计在 $200K–$500K，联邦和受监管行业客户通常处于高端，因为还需要 FIPS 和 STIG 合规附加项。
