      - number: '2.2'
        title: 买方分层与需求动态
        blocks:
          - type: paragraph
            body: |
              Chainguard 的主要买方是运营云原生生产环境、且面临监管或合同安全要求的大型企业和公共部门组织。采购决策通常落在平台工程、
              DevSecOps 或云安全团队，企业交易需要 CISO 和 Chief Architect 签字，美国联邦交易还需要 Contracting Officer 批准。

              **科技行业**（包括软件公司和超大规模云厂商）按数量看是最大板块。这些组织运行大量容器工作负载，维护庞大的开源软件依赖，
              还常常面对客户安全审查要求（SOC 2、ISO 27001），因此有动力加固供应链。Canva、GitLab、Snap、Anduril 等 Chainguard 已命名客户体现了这一板块。

              **金融服务**（银行、保险、资本市场）因监管审查强、IT 预算大、对数据泄露零容忍，按收入潜力看是第二大板块。ANZ Bank 是已命名客户，
              暗示 APAC 银行业已开始采用。美国和欧盟金融监管机构越来越要求软件系统提供来源证明文档。

              **联邦政府**（美国国防部、民事机构、国防承包商）按单合同收入看价值最高，驱动因素是 EO 14028 和 OMB M-22-18 的 SBOM 强制要求。
              云工具的 FedRAMP 授权要求既是进入壁垒（保护在位者），一旦获批又形成竞争护城河（把未授权供应商挡在门外）。

              **医疗和关键基础设施**板块正在出现，动力来自 HHS 网络安全指南、CISA 关键基础设施公告，以及医疗 IT 遭勒索软件攻击后的事件响应要求。

              企业供应链安全工具采购周期通常为 3–9 个月，受监管行业复杂度更高。Chainguard 把开发者采用（自下而上、社区）与企业合同
              （自上而下、CISO）结合，符合开发者工具公司常见的产品驱动增长模式。
