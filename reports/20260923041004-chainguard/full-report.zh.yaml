              - CR004
      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: |
              Chainguard 的监管风险画像不对称偏正面：自身直接监管义务很少（没有已知诉讼，也没有会直接产生 NIS2/DORA 责任的欧盟实体），而客户合规义务会为其产品创造拉动需求。
              EU NIS2（2024 年 10 月生效）要求 18 个行业的关键基础设施运营方管理供应链风险；EU DORA（2025 年 1 月生效）要求欧盟金融机构实施 ICT 供应链控制和尽职调查。
              European Banking Authority 的 DORA 指南明确要求记录包括软件供应链在内的 ICT 第三方风险——Chainguard 的 SBOM 证明和 SLSA 来源证明正好满足这一要求。
              两者都会在欧洲企业客户中创造对带 SBOM 证明容器镜像的需求。

              在美国，CISA Secure by Design 指南（2024 年）和 EO 14028 SBOM 强制要求，为联邦和国防板块提供平行监管顺风，并强化政府垂直中抵御 CNAPP 整合的合规护城河。
              CISA 对供应链证明实践的背书，让 Chainguard 的产品定位得到美国网络安全主管机构的官方认可。需要监控的关键风险是欧盟数据主权：Chainguard 没有欧洲数据中心或欧盟法律实体，
              可能限制德国、法国等成员国中有数据驻留要求的 NIS2 监管实体采用。DORA 合规评估会拉长欧洲金融服务销售周期，但采用后也提高切换成本——这对通过合规驱动采购获取的企业账户构成结构性留存利好。
              截至 2026 年 5 月，未发现针对 Chainguard 的重大诉讼、IP 纠纷或监管执法行动。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: 运营、财务与依赖风险
        blocks:
          - type: paragraph
            body: >
              Chainguard 存在三类重大运营风险。第一，sigstore/CNCF 依赖：如果 Rekor 透明日志、Fulcio OIDC CA 或 CNCF DNS/CDN 被攻陷，

              将破坏所有 Chainguard 客户的镜像签名和 SLSA 来源证明完整性。MITRE ATT&CK 将供应链基础设施攻击记录为一种增长中的对手战术。

              第二，XZ 式供应链攻击风险——2024 年 XZ utils 后门（CVE-2024-3094）表明，恶意 Wolfi 包维护者可能引入后门代码，并通过 Chainguard Images 传播。

              每晚重建和 SLSA L3 来源证明提供检测能力，但无法预防上游仓库被攻陷。如果 Chainguard Image 中确认存在恶意载荷，将对客户信任造成灾难性打击。


              第三，关键人物集中：Dan Lorenc（CEO、sigstore 共同创建者）是最大的单人依赖风险。四位前 Google 联合创始人作为整体代表创始团队集中度——若两位或更多同时离开，

              将严重影响工程领导力。开源社区嵌入（共同创建 sigstore、参与 CNCF）把技术可信度部分分散到多名可见工程师身上，降低但不能消除这一风险。财务风险最具时间敏感性：

              以 2025 年 4 月融资 $140M、估算每月烧钱 $8–12M 计，现金跑道约 12–18 个月，要求公司在 2026 年底前完成 Series E 或 IPO。

              资本结构干净（SEC Form D 显示仅股权；无可转债）。如果 FY2026 ARR 低于 $80M，而目标为 $100M+，$3.5B 估值将面临实质减值。

              Kill criteria 包括：CNAPP 宣布以商品化价格提供原生零 CVE 重建能力；Chainguard 构建镜像发生已确认安全事件；12 个月内两名或更多联合创始人离职；或 FY2026 ARR 低于
              $80M。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR003
