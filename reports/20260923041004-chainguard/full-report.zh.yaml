  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Chainguard 的收入模型是订阅式 SaaS，围绕团队规模定价加镜像目录访问设计。三条产品线是 Chainguard Images（核心收入驱动——由 Wolfi OS 每晚重建的精选零 CVE
              容器镜像）、

              Chainguard Libraries（面向 Python、Java、Node 等语言生态的加固包）和 Chainguard VMs（加固虚拟机镜像，产品线中最新成员）。

              收入确认按年度订阅，除团队规模 / 镜像层级基础外没有消费计量，因此模型可预测，也便于客户做预算。


              FY2025（财年大约截至 2025 年 4 月）ARR 达到 $40M，较 FY2024 估算 $5–6M 约增长 7 倍。Sacra 估算，2023 日历年 ARR 为 $12.7M，

              这意味着 2024 年明显加速。公司目标是在 FY2026 结束前达到 $100M+ ARR——这是 2.5 倍增长目标；若实现，将代表供应链安全子领域最快触达九位数 ARR 门槛。

              通过 AWS 和 Azure Marketplace 分销，使客户能用既有云承诺消费购买 Chainguard 订阅，降低销售周期摩擦，并把有效买方群体从传统安全预算持有者扩展到更广范围。

              CrowdStrike 的 10-K 基准验证，成长阶段企业网络安全 SaaS 公司通常可达到 70–78% 毛利率。
            claimRefs:
              - CI001
