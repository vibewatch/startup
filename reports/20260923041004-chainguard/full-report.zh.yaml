      - number: '2.3'
        title: 增长驱动、约束与市场风险
        blocks:
          - type: paragraph
            body: |
              Chainguard 市场的**主要增长驱动**既有结构性，也有近期因素：

              - *监管加速*：美国 Executive Order 14028（SBOM 强制要求，2021 年 5 月）、OMB M-22-18、EU Cyber Resilience Act（2024 年）、
                NIST SSDF 和 FedRAMP SBOM 要求形成合规拉动。到 2025–2026 年，SBOM 要求正在从联邦 IT 扩展到金融服务（ECB、PRA）和关键基础设施行业。

              - *供应链事件*：每一次高知名度事件（SolarWinds 2020、Log4Shell 2021、XZ Utils 2024）都会显著推高安全买方的紧迫感，并压缩采购时间线。
                XZ Utils 后门尤其验证了国家级攻击者攻陷开源维护者的风险——这正是 Chainguard 的威胁模型。

              - *云原生采用*：Kubernetes 使用继续增长；CNCF 2024 Annual Survey 发现，超过 80% 的企业在生产环境运行 Kubernetes。每一个基于容器的工作负载，
                都产生一单位安全基础镜像需求。

              - *AI 工作负载扩散*：LLM 推理和训练基础设施（GPU 集群、容器化模型服务）的出现，带来新的且庞大的开源依赖足迹。Chainguard 在 Series C 信息中明确瞄准 AI 工作负载。

              **市场约束与风险**：

              - *DevSecOps 成熟度前提*：Chainguard 产品要求客户已经具备 CI/CD 流水线和容器基础设施。中小企业缺乏这种成熟度，因此当前 SAM 被压窄。

              - *CISO 对扫描 vs. 预防的怀疑*：部分企业买方仍在使用点状扫描工具，也怀疑是否要迁移到预防优先模型。这会增加客户教育成本，并拉长销售周期。

              - *捆绑安全平台竞争*：云厂商（AWS ECR、Azure ACR、GCP Artifact Registry）和端点安全供应商（CrowdStrike、Palo Alto Networks、
                Aqua Security）把容器扫描打包进更大平台，减少可用于专用工具的独立预算。

              - *监管放缓风险*：如果美国政策方向变化，SBOM 执法在另一届政府下松动，合规拉动可能减弱——尽管行业自身驱动的采用大概率会延续。

              - *市场碎片化*：不同来源对市场规模的估计相差 2–3 倍，反映定义不一致。这种碎片化让 TAM/SAM 测算和投资者比较更复杂。
