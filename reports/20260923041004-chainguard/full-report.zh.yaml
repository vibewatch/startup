      - number: '5.2'
        title: 产品组合与合规
        blocks:
          - type: paragraph
            body: >
              Chainguard 的产品组合包括四条线：(1) Chainguard Images——旗舰容器镜像订阅，覆盖 OS 基础镜像、语言运行时、数据库、Web 服务器和 AI/ML 框架等 2,000+ 个镜像；

              (2) Chainguard Libraries——面向 Python、Java、Node.js、Go 等生态的加固、持续修补包；(3) Chainguard VMs——面向 AWS、Azure 和 GCP
              云计算的加固虚拟机镜像；

              (4) Commercial Builds（2026 年 1 月推出）——让企业使用 Wolfi 构建基础设施，生产带验证来源证明的自有应用构建物。


              合规叙事是联邦和受监管行业 Go-to-Market 的核心：Chainguard 提供 FIPS 140-2 验证和 STIG 加固的镜像变体，对齐 NIST SP 800-218 SSDF 强制要求，

              并支持 FedRAMP 合规部署。缺乏等价构建时 SBOM 和证明基础设施的纯 DevSecOps SaaS 厂商（Snyk、Aqua），很难复制这道监管护城河。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.3'
        title: 产品限制与竞争考量
        blocks:
          - type: paragraph
            body: >
              Chainguard 的主要产品限制是目录覆盖：并非每个开源软件包都有 Wolfi 等价物，客户因此需要请求新镜像，或为遗留 / 小众软件维护自定义构建。

              免费层只允许使用 :latest 标签，不能做版本 pinning；对要求通过固定镜像 digest 实现可复现构建的团队，这会产生摩擦。G2 用户评论指出，

              与 Docker Scout、Grype 这类扫描现有镜像、无需迁移到新容器基础的工具相比，免费层限制让初始价值证明更难。


              “零 CVE”主张很精确，但需要细读：Chainguard Images 是发布时零已知 CVE，不是未来永远零 CVE；发布后发现的新漏洞，会在合同 SLA 内修复（关键 7 天）。

              Chainguard 对 sigstore/cosign 基础设施（由 CNCF/OpenSSF 托管）有实质依赖，这给它自己的签名链引入上游供应链依赖。如果 sigstore 透明日志或 CNCF
              托管基础设施被攻陷，

              将实质影响 Chainguard 的信任模型。


              产品范围不包括运行时安全、CSPM（云安全态势管理）和网络层威胁检测——相对于 Palo Alto Prisma Cloud、Wiz 等提供端到端云安全的 CNAPP 竞争对手，这是一个缺口。

              因此 Chainguard 在更广安全栈中更像点解决方案而非平台，可能限制单笔交易预算，并在 CNAPP 向镜像供应链能力扩展时增加平台整合风险。GitHub 和 G2 上的社区反馈也提到，

              Wolfi 选择 glibc 虽然改善兼容性，但团队从基于 Alpine 的 musl 镜像迁移到 Wolfi 等价物时，可能需要调整应用层构建。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
