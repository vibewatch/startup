      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: |
              Chainguard 尚未披露毛利率、NRR、CAC、LTV、流失率或烧钱速度。基于公开 ARR（$40M）和员工数（~622），隐含人均收入约 $64,000——
              明显低于高效企业 SaaS 公司 $150,000+ ARR / 人的基准。该指标虽然说明公司在激进投入增长，但也显示它仍处于盈利前规模化阶段，而不是接近资本效率。

              估算平均合同价值（ACV）约 $267K（$40M ARR / 150 个客户），把 Chainguard 明确放在企业级市场，与其面向受监管行业和联邦机构的安全与合规价值主张一致。
              镜像订阅成本模型具备有利毛利特征：Wolfi 重建流水线一旦建成，增量镜像拉取成本接近零，说明收入成本主要是人力（安全工程师、开源维护者），而不是基础设施可变成本。
              企业安全 SaaS 70–85% 毛利率基准意味着，如果 Chainguard 在员工数温和增长下达到 $100M ARR，将产生有意义的贡献利润。

              NRR 未披露但大概率较强：150 个客户基数上 ARR 增长 7 倍，意味着除新客户获取外，既有客户也贡献了显著扩张收入（增购更大镜像目录、Libraries、VMs）。
              OpenView 基准显示，这一 ARR 区间企业安全 SaaS 的上四分位 NRR 为 120–130%。
