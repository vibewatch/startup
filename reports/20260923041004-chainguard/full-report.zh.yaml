      - number: '6.3'
        title: Go-to-Market 模型、留存与扩张
        blocks:
          - type: paragraph
            body: |
              Chainguard 采用 PLG + 企业销售的混合模型。开发者通过 Chainguard registry（cgr.dev）自助拉取并采用 Chainguard Images 免费层
              （最多 5 个镜像，仅限 :latest 标签）。随后，Chainguard 的内勤和现场销售团队识别这些已被开发者采用的组织，并通过先落地、再扩张动作把它们转为付费企业订阅。
              免费层有意设限以推动转化：版本 pinning、历史镜像访问、SBOM 下载和 SLA 覆盖都需要付费订阅。

              客户内部扩张路径从 Images（初始落地）流向 Libraries（语言层加固、更广团队覆盖）、再到 VMs（基础设施团队），最后到 Commercial Builds
              （面向有自有应用构建的 ISV 和企业）。净收入留存和客户集中度未公开，形成尽调不确定性。622 名员工对应 $40M ARR，人均收入约 $64K——低于 $200K 效率目标——
              说明公司仍处于 GTM 规模化模式，与其招聘节奏和融资频率一致。用户评论中提到的主要采用障碍是目录覆盖缺口，以及从基于 Alpine 的镜像迁移到 Wolfi 等价物时的复杂度。
              除 GitLab 合作外，Chainguard 似乎没有渠道或转售计划，主要依赖企业直销团队，并由 PLG 开发者社区漏斗支撑。GitHub 社区活动带来的开发者生态信号
              （开源 Wolfi 和 sigstore 项目合计数万 repository stars）提供了有机认知渠道，相比完全依赖付费营销的竞争对手，降低了漏斗顶部获客成本。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
