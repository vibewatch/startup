evidenceGaps:
- type: missing-source
  severity: major
  topic: "Gross margin, NRR, CAC, LTV, burn rate, and churn \u2014 all financial operating metrics undisclosed"
  missingEvidence: Chainguard has not disclosed any operating financial metrics beyond ARR, headcount, funding, valuation, and customer count.
  whyItMatters: Without gross margin and NRR, it is impossible to independently validate the $3.5B valuation or assess the sustainability of the growth model.
  diligencePath: Request management disclosure of at minimum gross margin, NRR, and dollar retention rate; review audited financials if available.
  relatedQuestionRefs:
  - QI011
  - QI012
- type: missing-source
  severity: major
  topic: "Revenue breakdown by product line \u2014 Images vs Libraries vs VMs contribution"
  missingEvidence: No public disclosure of ARR attribution by product line; Images is assumed to be dominant but unconfirmed.
  whyItMatters: Product mix affects gross margin (Libraries and VMs may have different margins) and revenue diversification story.
  diligencePath: Request ARR bridge by product line from Chainguard finance.
  relatedTableRefs:
  - TI001
- type: missing-source
  severity: minor
  topic: "FY2026 ARR progress \u2014 no mid-year update available between April 2025 and May 2026"
  missingEvidence: No public ARR update post Series D announcement; $100M ARR target progress unknown.
  whyItMatters: The $100M ARR target is achievable given the trajectory but unconfirmed; missing a target this size would affect valuation.
  diligencePath: Request Q1/Q2 FY2026 ARR pipeline summary; check for any press releases or customer announcements post-April 2025.
  relatedQuestionRefs:
  - QI024
  - QI025
- type: missing-source
  severity: minor
  topic: General Catalyst Customer Value Fund repayment terms and covenants
  missingEvidence: Specific repayment terms, revenue covenants, and default triggers for the $280M GC financing are not publicly available.
  whyItMatters: If the growth financing has aggressive revenue covenants, it could constrain Chainguard's strategic flexibility.
  diligencePath: Review financing agreement term sheet; consult legal and financial advisors on covenant structure.
  relatedQuestionRefs:
  - QI015
