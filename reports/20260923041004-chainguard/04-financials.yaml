  title: Financial Profile
  summary: "Chainguard is a high-growth, loss-making SaaS company in the hyper-scale phase. ARR reached\n$40M in FY2025 (7x year-over-year from approximately $5.7M in FY2024), with a $100M+ ARR\ntarget for FY2026. The company has raised $892M in total, including $636M in a six-month\nwindow (Series D + growth financing, April\u2013October 2025), providing strong capital runway.\nRevenue model is subscription SaaS with per-team and per-image pricing. Unit economics are\nnot publicly disclosed; estimated revenue per employee of ~$64K is below mature SaaS efficiency,\nconsistent with aggressive growth investment. Gross margin and NRR are undisclosed private\ninformation. ARR multiple of ~87.5x (at April 2025 valuation) reflects frontier-growth pricing.\n"
