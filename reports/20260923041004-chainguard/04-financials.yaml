sections:
- id: SI_REVENUE
  title: Revenue Model and Growth Trajectory
  order: 1
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  body: "Chainguard's revenue model is subscription SaaS, structured around per-team-size pricing\nplus image catalog access. The three product lines are Chainguard Images (the core revenue\ndriver \u2014 curated, zero-CVE container images rebuilt nightly from Wolfi OS), Chainguard Libraries\n(hardened language-ecosystem packages for Python, Java, Node, etc.), and Chainguard VMs\n(hardened virtual machine images, the newest addition to the lineup). Revenue recognition is\nannual subscription with no consumption metering beyond the team-size/image-tier base, making\nthe model predictable and easy for customers to budget.\n\nARR reached $40M in FY2025 (fiscal year ending approximately April 2025), representing\napproximately 7x year-over-year growth from an estimated $5\u20136M in FY2024. Sacra estimates\nthat calendar 2023 ARR was $12.7M, which implies strong acceleration through 2024. The company\ntargets $100M+ ARR by end of FY2026 \u2014 a 2.5x growth target that, if achieved, would represent\n\
    the fastest milestone to the nine-figure ARR threshold in the supply-chain security subsector.\nDistribution through AWS and Azure Marketplace allows customers to consume Chainguard subscriptions\nagainst existing cloud committed-spend agreements, reducing sales cycle friction and expanding\nthe effective buyer universe beyond traditional security-budget holders. CrowdStrike's 10-K\nbenchmarks validate that enterprise cybersecurity SaaS companies at the growth stage typically\noperate at 70\u201378% gross margins.\n"
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: SI_UNITECS
  title: Unit Economics and Cost Structure
  order: 2
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  body: "Chainguard has not disclosed gross margin, NRR, CAC, LTV, churn, or burn rate. Based on\npublicly available ARR ($40M) and headcount (~622), the implied revenue per employee is\napproximately $64,000 \u2014 materially below the $150,000+ ARR-per-employee benchmark for\nefficient enterprise SaaS companies. This metric, while indicative of aggressive growth investment,\nsignals that the company is in the pre-profitability scaling phase rather than approaching\ncapital efficiency.\n\nThe estimated average contract value (ACV) of approximately $267K ($40M ARR / 150 customers)\npositions Chainguard firmly in enterprise territory, consistent with its security-and-compliance\nvalue proposition to regulated industries and federal agencies. The image-subscription cost\nmodel has favorable gross-margin characteristics: once the Wolfi rebuild pipeline is built,\nincremental image-pull costs are near-zero, suggesting the cost-of-revenue is primarily headcount\n(security engineers, open-source\
    \ maintainers) rather than infrastructure variable costs. Benchmarks\nfor enterprise security SaaS gross margins of 70\u201385% would imply meaningful contribution margin\nif Chainguard reaches $100M ARR at modest headcount growth from current levels.\n\nNRR is undisclosed but likely strong: a 7x ARR growth in a 150-customer base implies significant\nexpansion revenue from existing customers (upsell into larger image catalogs, Libraries, VMs)\nin addition to new customer acquisition. OpenView benchmarks suggest top-quartile NRR for\nenterprise security SaaS at this ARR band is 120\u2013130%.\n"
  tableRefs:
  - TI002
- id: SI_CAPITAL
  title: Capital Adequacy and Financial Verdict
  order: 3
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  body: "Chainguard has raised $892M total, including $636M in a six-month window (April\u2013October 2025).\nAt an estimated annual burn rate of $80\u2013150M (extrapolated from the $40M ARR, 622 employees,\nand growth-stage cost structure), the company has a plausible 4\u20138 year runway even before\nfactoring revenue growth \u2014 a very strong capital adequacy position.\n\nThe October 2025 $280M General Catalyst Customer Value Fund financing is structured as performance-\nlinked growth capital rather than traditional equity or venture debt, reducing dilution for existing\nshareholders while extending the cash runway and providing institutional validation of Chainguard's\ncommercial momentum. This financing structure, combined with the Series D ($356M at $3.5B), signals\nthat investors expect a significant liquidity event (IPO or M&A) within 2\u20134 years.\n\nThe key financial risk is concentration: with 150+ customers and estimated $267K ACV, the top\n10 customers likely account for\
    \ 15\u201325% of ARR. Reaching $100M ARR by FY2026 requires either\ndoubling the customer base (to ~375 at similar ACV) or expanding existing customer ACV to\napproximately $650K \u2014 both scenarios requiring sustained enterprise sales capacity and\naccelerated product adoption. Capital is not the binding constraint; sales execution and product\nexpansion are the critical variables for the $100M ARR milestone.\n"
  tableRefs:
  - TI003
