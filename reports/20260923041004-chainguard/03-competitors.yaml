sections:
- id: SP_OVERVIEW
  title: Competitive Overview
  order: 1
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  body: "Chainguard competes at the intersection of container security, software supply chain provenance,\nand DevSecOps tooling. The vendor landscape spans three distinct layers: (1) direct supply-chain\nand container-security specialists \u2014 Snyk ($8.5B valuation, developer-first SCA and container\nscanning), RapidFort (post-build container hardening), and Sysdig (Kubernetes runtime security);\n(2) full Cloud-Native Application Protection Platform (CNAPP) vendors \u2014 Aqua Security ($1B+),\nPalo Alto Cortex Cloud, Orca Security, and CrowdStrike Falcon Cloud Security; and (3) indirect\nsubstitutes \u2014 Red Hat Universal Base Images (UBI), Alpine Linux, Docker Official Images, and\ncloud-provider native scanning tools (AWS Inspector, Azure Defender for Containers). JFrog Xray\ncovers the artifact-scanning and software composition analysis (SCA) adjacency.\n\nThe competitive landscape is consolidating rapidly. Wiz was acquired by Google in March 2026 for\n$32B \u2014 removing the fastest-growing\
    \ CNAPP competitor from the independent vendor landscape. Lacework\nwas absorbed by Fortinet and rebranded FortiCNAPP. Checkmarx merged into Synopsys. These moves\nreduce the number of independent specialist vendors, pressure remaining point solutions to demonstrate\nplatform ambitions, and signal that large-enterprise security buyers are consolidating security\nvendors for unified coverage. Chainguard's narrow but deep positioning \u2014 supply chain provenance\nand zero-CVE image provision \u2014 occupies a differentiated niche that no tier-1 platform vendor\nfully replicates today, but the window to establish durable category leadership before platform\nabsorption narrows each year.\n"
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: SP_MOAT
  title: Chainguard's Competitive Moat
  order: 2
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  body: "Chainguard's moat rests on three reinforcing layers: (1) technical infrastructure \u2014 Wolfi OS\nis a purpose-built Linux \"undistro\" that enables nightly rebuilds of 2,000+ images against upstream\nsources, delivering sub-7-day critical CVE patching with a contractual SLA; (2) standards\nco-ownership \u2014 co-creation and maintenance of sigstore, cosign, SLSA, and Wolfi means Chainguard\nshapes the supply-chain security standards that every competitor must eventually implement; and\n(3) brand and community trust built through open-source leadership (OpenSSF and CNCF participation)\nthat commercial-only vendors cannot quickly replicate.\n\nThe technical moat is the most durable: replicating a nightly-rebuild pipeline for 2,000+ images\nrequires multi-year infrastructure investment, upstream maintainership relationships, and a team\nwith deep Linux packaging expertise that is extremely scarce. The standards-ownership moat is\nmore fragile \u2014 as sigstore adoption becomes near-universal,\
    \ it transitions from differentiator\nto table stakes. Chainguard's community trust moat provides asymmetric brand value in security-\nconscious enterprises and government agencies that require supply chain provenance and SBOM\ncompliance, but is non-trivially replicable by well-resourced incumbents over a 2\u20133 year horizon\nif they commit to open-source contribution at comparable depth.\n"
  tableRefs:
  - TP002
- id: SP_PRICING
  title: Pricing and Distribution
  order: 3
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  body: "Chainguard uses a team-size + image-access pricing model starting at approximately $19,000/year\nfor a team of 10 engineers, with full access to 2,000+ images, contractual CVE-remediation SLAs\n(7 days for critical, 14 days for high/medium/low), and unlimited image pulls. A free tier\nallows up to five production images per organization at no cost, enabling evaluation and\ndeveloper adoption before enterprise commitment. This model differs strategically from Snyk's\nper-developer seat pricing (which scales with headcount but not image consumption) and Aqua's\nper-workload/node pricing (which scales with cloud infrastructure scale).\n\nChainguard distributes through its own registry, AWS Marketplace, and Azure Marketplace, enabling\nenterprise procurement through existing committed cloud spend (EDP/MACC agreements). Marketplace\navailability removes a common friction point in enterprise security sales by allowing procurement\nwithout a new vendor relationship. The company also sells\
    \ directly through an enterprise sales\nmotion targeting platform-engineering and DevSecOps teams. The combination of a free community\ntier, per-team pricing, and marketplace distribution creates a low-friction adoption funnel\nthat mirrors successful developer-first software businesses, with a clear upgrade path to\nenterprise contract as deployment scales. Annual contract values estimated in the\n$200K\u2013$500K range for large enterprise deployments, with federal and regulated-sector\ncustomers typically at the higher end given FIPS and STIG compliance add-ons.\n"
  tableRefs:
  - TP003
