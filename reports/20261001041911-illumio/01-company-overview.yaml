chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2013 and headquartered in Sunnyvale, California, Illumio is a growth-stage zero-trust segmentation pioneer valued at $2.75 billion following its Series F financing. Led by co-founders Andrew Rubin and P.J. Kirner, the company has raised over $557 million from premier institutional sponsors including Thoma Bravo, J.P. Morgan, and Accel, protecting more than 1,000 enterprise customers while confronting operational scaling challenges in agent deployment and reporting automation."
sections:
  - id: "corporate-identity-and-market-mission"
    title: "Corporate Identity and Market Mission"
    body: "Illumio, Inc. is a Sunnyvale, California-based cybersecurity company established in 2013 by Andrew Rubin and P.J. Kirner. The company operates as a category creator in Zero Trust Segmentation (ZTS) and breach containment, addressing lateral attack propagation inside enterprise networks. Historically, enterprise perimeter defenses focused on north-south ingress and egress filtering, leaving internal east-west application traffic unrestricted once an adversary established initial access. Illumio addresses this architectural vulnerability by decoupling policy computation from network infrastructure, utilizing native host operating system packet filters to enforce micro-perimeters around workloads, bare-metal servers, virtual machines, and cloud containers. The company's corporate identity is anchored in assuming that network perimeters will inevitably fail under sophisticated attacker techniques, positioning proactive containment as the essential mechanism to prevent localized intrusions from escalating into catastrophic ransomware events."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO008"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Governance Structure"
    body: "Illumio's executive leadership is headed by co-founder and Chief Executive Officer Andrew Rubin, who has guided corporate strategy, financing, and commercial scaling since the company's inception in 2013. Co-founder and Chief Technology Officer P.J. Kirner directs core engineering architecture and technical innovation, having originally authored the foundational designs of Illumio's Policy Compute Engine. The executive bench was strengthened through seasoned enterprise software appointments, including Chief Financial Officer Anup Singh, formerly CFO of Nimble Storage, and Chief Product Officer Mario Espinoza, formerly product executive at Palo Alto Networks and Symantec. While the founding team retains extensive domain leadership and deep architectural authority, key-person dependency on Rubin and Kirner remains significant. Furthermore, practitioner reviews and customer evaluations highlight ongoing operational requirements for automated policy generation, enhanced reporting analytics, and lower administrative friction across large multi-operating-system deployments."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-history-and-investor-syndicate"
    title: "Capitalization History and Investor Syndicate"
    body: "Since its founding in 2013, Illumio has raised over $557 million in institutional equity capital across six financing rounds. The company's capitalization history reflects progressive backing from premier Silicon Valley venture firms and institutional asset managers. Early funding included a $34.5 million Series B in 2013 backed by General Catalyst and Andreessen Horowitz, followed by a $100 million Series C in 2015 led by Accel and BlackRock, and a $125 million Series D in 2017 led by J.P. Morgan Asset Management. In June 2021, Illumio completed a $225 million Series F financing round led by private equity firm Thoma Bravo at a post-money valuation of $2.75 billion, achieving prominent cybersecurity unicorn status. However, Illumio has not completed a primary capital raise since 2021, leaving current secondary market valuation benchmarks and cap table preferences undisclosed in public channels."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO003"
  - id: "commercial-scale-and-platform-evolution"
    title: "Commercial Scale and Platform Evolution"
    body: "Illumio has demonstrated notable enterprise commercial adoption, reporting that over 1,000 organizations and more than 15 of the Fortune 100 utilize its breach containment technology. In its fiscal year 2022 disclosures, the company highlighted over 60 percent worldwide revenue growth, 100 percent year-over-year bookings expansion, and 27 customers generating over $1 million in Annual Recurring Revenue. The company's product suite has evolved substantially from its original Adaptive Security Platform, expanding to include Illumio CloudSecure SaaS and, in February 2026, an agentless visibility and containment capability utilizing Check Point and Fortinet firewall telemetry. This hybrid expansion allows enterprises to map network flows without installing endpoint agents across legacy data center environments. Industry recognition culminated in Q3 2026, when Forrester Research named Illumio a Leader and Customer Favorite in The Forrester Wave for Microsegmentation Solutions."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
