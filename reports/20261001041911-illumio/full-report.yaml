      - number: '2.3'
        title: Buyer Segmentation, Budget Allocation, and Procurement Paths
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics and budget ownership differ substantially across enterprise tiers, cloud-native
              scale-ups, and mid-market organizations. In Global 2000 and Tier-1 financial institutions, buying
              authority is concentrated in the Chief Information Security Officer and Central Enterprise Security
              budget, with operational resilience and regulatory compliance teams functioning as primary economic
              sponsors. Conversely, small and midsize businesses (SMBs)—which account for 81% of successful ransomware
              attacks despite smaller IT footprints—frequently procure microsegmentation through managed security
              service providers (MSSPs) or combined IT infrastructure allocations. Illumio's workload-based licensing
              framework accommodates these diverse buyers by defining a workload atom as an individual OS instance
              across bare-metal, virtual machines, and cloud containers, while allowing five user endpoints to share a
              single workload license. Customer satisfaction on cloud marketplace channels remains exceptionally high,
              evidenced by a 9.5 average rating on AWS Marketplace via PeerSpot and universal willingness to recommend.
            claimRefs:
              - CM007
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: Growth Drivers, Implementation Bottlenecks, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of microsegmentation is propelled by severe regulatory enforcement and catastrophic
              ransomware dynamics, but balanced by material deployment friction. An ORDR survey across enterprise
              security leaders found that 99% of organizations are either implementing or actively planning
              microsegmentation initiatives. In the European Union, the Digital Operational Resilience Act (DORA)
              entered an intensive supervisory phase in 2026, holding critical financial entities and ICT third-party
              providers directly accountable for demonstrated service containment. Concurrently, cyber insurance
              underwriters are mandating workload segmentation on critical assets following a 58% spike in SMB claim
              losses. However, adoption velocity is constrained by initial pricing dispersion of up to 38% across
              comparable scopes and substantial policy modeling friction: organizations lacking disciplined CMDB tags
              require four to eight weeks simply to establish labeling taxonomies before enforcement rules can safely
              activate without operational disruption.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The TCO Multiplier: Operational Policy Tuning Exceeds Software Licensing'
            body: >-
              Enterprise buyers evaluating microsegmentation frequently mistake software license fees for total
              investment cost. While workload subscriptions for pure-play segmentation range from $10 to $80 per
              workload per year depending on fleet volume, independent benchmarks demonstrate that licensing accounts
              for only 30% to 40% of three-year total cost of ownership. The remaining 60% to 70% of spend resides in
              initial application dependency mapping, CMDB label reconciliation, and continuous cross-functional policy
              governance across SecOps and application owners.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: Regulatory Convergence as a Double-Edged Demand Catalyst
            body: >-
              While stringent compliance frameworks like DORA in Europe and federal zero-trust mandates in the United
              States create non-discretionary budget allocations for breach containment, they simultaneously lengthen
              enterprise procurement timelines. Financial institutions subject to joint supervisory examinations face
              stringent operational auditability standards requiring comprehensive runbooks and proof of rapid workload
              isolation, causing enterprise evaluation cycles to extend between 6 and 12 months.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
