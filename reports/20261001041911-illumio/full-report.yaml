  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              The zero-trust segmentation market represents a structural departure from perimeter-based network defense
              and north-south Zero Trust Network Access (ZTNA). While traditional perimeter architectures rely on border
              firewalls and broad VLAN zones, microsegmentation shifts enforcement directly to the individual workload
              and operating system kernel, establishing least-privilege communication policies for all east-west lateral
              traffic. This boundary separates pure-play workload isolation from complementary access controls: ZTNA
              authenticates users and endpoints accessing specific applications, whereas microsegmentation prevents an
              adversary who has breached one host from traversing laterally to domain controllers or backup datastores.
              Illumio's positioning as category leader is reinforced by top scores in strategy and offering in the Q3
              2026 Forrester Wave for Microsegmentation Solutions. Recent hybrid architectural expansions, such as
              ingesting native telemetry from Check Point and Fortinet firewalls, allow enterprises to achieve agentless
              visibility across data center and cloud environments without displacing existing investments.
            claimRefs:
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM011
              - CM014
      - number: '2.2'
        title: Addressable Market Sizing, Growth Horizons, and Constrained TAM
        blocks:
          - type: paragraph
            body: >-
              Addressable market sizing for zero-trust microsegmentation reflects accelerating enterprise adoption
              driven by ransomware containment priorities and regulatory mandates. Global market estimates diverge based
              on methodology: Coherent Market Insights projects a $4.56 billion market in 2026 expanding at a 25%
              compound annual growth rate, while Dataintelo values the 2025 market at $3.8 billion with a 17.5% CAGR,
              identifying a $2.37 billion pure software component. When evaluating the market through a constrained
              lens, enterprise spending is heavily influenced by the total cost of ownership structure. Third-party
              procurement benchmarks indicate that software subscription licenses—typically ranging from $30 to $80 per
              workload annually at sub-1,000 scale down to $10 to $12 at 50,000 workloads—represent only 30% to 40% of
              three-year expenditure. The remaining 60% to 70% is absorbed by initial application dependency discovery,
              configuration management labeling, and cross-functional policy governance across infrastructure and
              application engineering teams.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: figure
