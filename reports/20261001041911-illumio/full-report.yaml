  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Illumio operates as a zero-trust breach containment and microsegmentation platform engineered to arrest
              lateral threat movement across heterogeneous enterprise environments. Rather than attempting perimeter
              interception or operating as an inline network appliance, Illumio decouples policy intelligence from
              packet enforcement. The Policy Compute Engine serves as the centralized management controller that ingests
              telemetry, builds real-time application dependency maps, and calculates least-privilege allowlist rules
              using contextual multi-dimensional labels. Workload-level enforcement is delegated to Virtual Enforcement
              Nodes, which are lightweight guest operating system agents that program native stateful firewalls such as
              Linux iptables/nftables and Windows Filtering Platform. Because the agent never sits inline to traffic and
              requires no custom kernel extensions, host-level crashes or software updates cannot sever production
              network connectivity. In legacy infrastructure, IoT/OT environments, and cloud database instances where
              software agents cannot be installed, Illumio incorporates Network Enforcement Nodes and cloud API
              integrations to program access control lists on switches, routers, load balancers, and cloud security
              groups.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
