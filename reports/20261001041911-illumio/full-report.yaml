  - id: FR001
    title: Zero-trust enterprise risk severity and mitigation matrix
    type: matrix
    summary: >-
      Evaluation of primary operational, compliance, partner, and financial risks across severity, likelihood, and
      mitigation maturity.
    data:
      columns:
        - name: low-impact
          label: Low Impact
        - name: medium-impact
          label: Medium Impact
        - name: high-impact
          label: High Impact
        - name: critical-impact
          label: Critical Impact
        - name: systemic-impact
          label: Systemic Impact
        - name: existential-impact
          label: Existential Impact
      rows:
        - name: high-likelihood
          label: High Likelihood
          values:
            - label: Minor API Rate Limits
              note: Routine PCE API throttling managed via standard backoff protocols
            - label: PCI-DSS Audit Scoping Drift
              note: Workload sprawl requiring recurring compliance policy auditing
            - label: Host Agent Deployment Overhead
              note: Operational friction deploying VEN across complex heterogenous server fleets
            - label: Extended Sales Procurement Friction
              note: Lengthy evaluation cycles across risk-averse enterprise committees
            - label: Multi-Cloud Security Telemetry Latency
              note: Telemetry synchronization latency across distributed cloud VPCs
            - label: Legacy Host Driver Incompatibilities
              note: Kernel packet filtering conflicts on aging enterprise OS distributions
        - name: medium-likelihood
          label: Medium Likelihood
          values:
            - label: Minor Telemetry Ingestion Latency
              note: Slight delays in third-party firewall telemetry ingestion
            - label: Firewall Vendor Platform Bundling
              note: Partner competition from integrated firewall security suites
            - label: Regulatory Resilience Scrutiny
              note: Supervisory audits under DORA requiring demonstrated service continuity
            - label: Cross-Cloud Network Policy Drift
              note: Inconsistent rule definitions between on-prem and public cloud environments
            - label: Enterprise Security Team Siloing
              note: Organizational friction between SecOps and infrastructure networking teams
            - label: Valuation Multiple Compression
              note: Late-stage valuation overhang relative to shifting public peer multiples
        - name: low-likelihood
          label: Low Likelihood
          values:
            - label: Documentation Discrepancies
              note: Minor drift between API versions and implementation guides
            - label: PCE Supercluster Leader Latency
              note: Failover latency during regional cluster synchronization events
            - label: Critical Application Misconfiguration
              note: Improper policy enforcement blocking core production transactions
            - label: Third-Party Firewall API Deprecation
              note: Abrupt breaking changes in partner telemetry extraction hooks
            - label: Host Workload Outage from Kernel Panic
              note: Severe kernel driver failure induced by endpoint agent interaction
            - label: Catastrophic Customer Data Breach Under Containment
              note: Undetected lateral movement bypassing microsegmentation perimeter boundaries
    notes: >-
      Matrix maps likelihood against potential business impact; cell notes highlight active operational mitigations and
      residual exposures.
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR009
      - CR010
