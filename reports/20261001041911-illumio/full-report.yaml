  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Illumio operates as an enterprise cybersecurity software vendor monetizing breach containment and
              zero-trust microsegmentation. The core business model is centered on recurring software subscriptions for
              its flagship platform components, Illumio Core, Illumio Segmentation, and the more recently introduced
