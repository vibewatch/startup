      - number: '5.2'
        title: Module Map and Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              The commercial platform is organized into targeted functional modules designed around specific
              infrastructure attack surfaces. Illumio Core provides microsegmentation for on-premises bare-metal
              servers, virtual machines, and private clouds, supported by Flowlink for telemetry ingestion and
              specialized Kubernetes orchestration components including Kubelink and containerized enforcement nodes.
              Illumio CloudSecure delivers multi-cloud visibility and automated policy calculation across Amazon Web
              Services, Microsoft Azure, and Google Cloud Platform, translating native cloud security groups into
              coordinated security boundaries. For managed personal workstations and mobile laptops operating outside
              enterprise perimeters, Illumio Endpoint dynamically adjusts host firewall policies based on device network
              connectivity to isolate compromised endpoints. Complementing core segmentation, Illumio Insights acts as
              an AI cloud detection and response engine powered by the Illumio AI Security Graph to surface lateral
              movement risks and correlate vulnerabilities with active network pathways. These modules enable enterprise
              security operations teams to replace manual, error-prone access control lists with automated, label-based
              segmentation.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
