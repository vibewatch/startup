chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Market Mission
        blocks:
          - type: paragraph
            body: >-
              Illumio, Inc. is a Sunnyvale, California-based cybersecurity company established in 2013 by Andrew Rubin
              and P.J. Kirner. The company operates as a category creator in Zero Trust Segmentation (ZTS) and breach
              containment, addressing lateral attack propagation inside enterprise networks. Historically, enterprise
              perimeter defenses focused on north-south ingress and egress filtering, leaving internal east-west
              application traffic unrestricted once an adversary established initial access. Illumio addresses this
              architectural vulnerability by decoupling policy computation from network infrastructure, utilizing native
              host operating system packet filters to enforce micro-perimeters around workloads, bare-metal servers,
              virtual machines, and cloud containers. The company's corporate identity is anchored in assuming that
              network perimeters will inevitably fail under sophisticated attacker techniques, positioning proactive
              containment as the essential mechanism to prevent localized intrusions from escalating into catastrophic
              ransomware events.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO010
