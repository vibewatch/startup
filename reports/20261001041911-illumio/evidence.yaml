evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unverified-financial-kpis
    missingEvidence: Audited financial statements confirming GAAP revenue, ARR, gross margin percentage, and net revenue retention.
    whyItMatters: >-
      Without audited ARR and margin disclosures, valuation multiples and commercial sustainability cannot be
      independently confirmed.
    diligencePath: >-
      Request confidential disclosure of audited fiscal year financials and SaaS KPI schedule during management
      diligence meetings.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: Complete cap table and liquidation preference schedule across Series A through Series F share classes.
    whyItMatters: >-
      Investor economic ownership and liquidation priority determine common equity waterfall outcomes in an IPO or
      acquisition.
    diligencePath: Examine detailed cap table and shareholder agreements during formal legal and financial diligence.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: operational-headcount-discrepancy
    missingEvidence: Verified active employee census broken down by engineering, sales, and administrative functions.
    whyItMatters: >-
      Third-party estimates range widely from 250 to 881 personnel, obscuring organization scale and revenue per
      employee productivity.
    diligencePath: Review quarterly employer payroll reports and corporate organizational charts during operational review.
  - type: private-evidence-only
    severity: material
    topic: illumio-actual-arr-and-net-retention
    missingEvidence: >-
      Audited financial breakdown of Illumio's annual recurring revenue (ARR), net revenue retention (NRR), and gross
      margin percentage across commercial and federal business units.
    whyItMatters: >-
      Without audited subscription ARR and net expansion figures, valuation models must rely on third-party pricing
      benchmarks ($10 to $80/WL/yr) and estimated customer counts rather than validated recurring cash flows.
    diligencePath: >-
      Request confidential management disclosures under NDA regarding FY2025/FY2026 ARR, cohort expansion rates, and
      average contract values (ACVs) across top 100 enterprise accounts.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: tam-sizing-dispersion
    missingEvidence: >-
      Reconciliation of disparate market sizing methodologies between analyst estimates citing $4.56 billion (Coherent
      Market Insights) and $3.8 billion (Dataintelo).
    whyItMatters: >-
      Different sizing estimates define market boundaries inconsistently, with some bundling professional deployment
      services and adjacent hardware while others restrict TAM strictly to software subscriptions.
    diligencePath: >-
      Commission custom market telemetry isolating workload counts across Fortune 2000 hybrid estates to construct a
      unified bottom-up TAM model.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Audited enterprise discount schedules and per-workload realized pricing across Illumio, Akamai Guardicore, and
      Cisco Secure Workload.
    whyItMatters: >-
      Enterprise sales cycles rely heavily on custom multi-year discounting, making list and estimated pricing
      insufficient to assess competitive win-loss economics.
    diligencePath: Request anonymized enterprise customer win-loss contract data and procurement bid sheets during diligence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: displacement-telemetry
    missingEvidence: >-
      Direct third-party head-to-head migration telemetry measuring churn rates from legacy hardware firewall
      segmentation to Illumio Core.
    whyItMatters: >-
      Determines whether Illumio is primarily capturing greenfield hybrid cloud workloads or displacing installed
      enterprise perimeter appliances.
    diligencePath: >-
      Analyze system integrator implementation reports and vendor replacement references from enterprise customer
      surveys.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-gross-margin
    missingEvidence: >-
      Audited GAAP financial statements disclosing gross margin split between software subscription and professional
      services, plus net revenue retention cohorts.
    whyItMatters: >-
      Gross margin below 75% would indicate heavy professional services delivery drag rather than pure SaaS operating
      leverage, impairing public-market valuation multiples.
    diligencePath: >-
      Request audited income statements and revenue recognition schedules under NDA during confirmatory financial
      diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-burn-and-runway
    missingEvidence: Current cash balance, monthly net cash burn rate, and existing credit facility or debt covenants as of 2026.
    whyItMatters: >-
      Without cash-on-hand disclosures, capital runway cannot be verified independently from its June 2021 Series F
      funding baseline.
    diligencePath: Obtain quarterly board deck financials, cap table, and treasury cash summary from management.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: performance-benchmarks
    missingEvidence: >-
      Quantitative latency overhead benchmarks and throughput degradation metrics under maximum flow ingestion load for
      the Virtual Enforcement Node.
    whyItMatters: >-
      Enterprise infrastructure architects require empirical packet latency figures to verify that host firewall rule
      expansion does not impair high-frequency transaction workloads.
    diligencePath: >-
      Request customer deployment test telemetry, lab performance benchmark reports, or conduct dedicated test-bed load
      testing during technical proof-of-concept.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-nrr
    missingEvidence: Audited cohort-level Net Revenue Retention (NRR) and detailed customer churn percentages for 2024-2026.
    whyItMatters: >-
      Net Revenue Retention is critical to evaluating whether Illumio can sustain its 13-15x ARR multiple without
      relying solely on expensive new customer acquisition.
    diligencePath: >-
      Request private customer cohort retention schedules and gross/net dollar expansion data under NDA during
      investment diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
