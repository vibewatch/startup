  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Evidence-backed argument", "What would change the view"]
    rows:
      - ["Thesis", "Company-reported Forrester leadership and Gartner customer ratings indicate product-market credibility.", "Independent retention, win-rate, and expansion data would convert recognition into economic proof."]
      - ["Thesis", "The 2026 agentless visibility launch extends the platform across existing firewall telemetry.", "Evidence of paid adoption, attach rates, and efficient cross-sell would strengthen the valuation case."]
      - ["Thesis", "A 120,000-square-foot headquarters lease and about 1,000 reported employees indicate operating scale.", "Current revenue per employee and cash-burn data are needed to judge whether that scale is efficient."]
      - ["Anti-thesis", "The current valuation references range from $1.3B to $2.8B while current operating metrics remain private.", "Audited KPIs, cap-table terms, and a priced transaction could resolve the dispersion."]
    notes: "Product recognition is company-reported; lease and workforce observations come from independent news, while efficiency implications remain unverified."
    claimRefs: ["CV005", "CV007", "CV008", "CV009", "CV010", "CV011"]
  - id: "TV003"
    title: "Bull, base, and bear conditional framework"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bear", "Weak growth or retention, inefficient scale, or senior preference overhang.", "At or below the $1.3B Forge reference; no target return can be calculated without entry terms and exit timing.", "Down-round, dilution, and delayed liquidity.", "Not estimable from public evidence; triggered by adverse KPI or term disclosure."]
      - ["Base", "Durable but unquantified demand, acceptable SaaS economics, and no punitive preference stack.", "$1.3B-$2.75B observed-reference band; require underwritten ownership and dilution before computing returns.", "Multiple compression and platform-bundling pressure.", "Not estimable; supported only after current audited metrics reconcile the valuation gap."]
      - ["Bull", "Strong recurring growth, high retention, healthy margins, and credible public-market readiness.", "$2.75B-$2.8B reference area before any evidence-based premium; broad cybersecurity transactions are context, not direct comps.", "Using Wiz or SailPoint headline values as inappropriate direct multiples.", "Not estimable; requires verified growth, margins, retention, and an exit process."]
    notes: "Ranges organize observed financing and market-data references rather than forecast fair value; Wiz and SailPoint are broad sector context with different businesses and transaction structures."
    claimRefs: ["CV001", "CV002", "CV004", "CV005", "CV006", "CV013", "CV014", "CV015"]
