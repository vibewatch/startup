company:
  name: "Illumio"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Illumio has credible product and market proof, but the retained public evidence
    does not support a precise intrinsic valuation or a price-insensitive investment.
    Conflicting 2026 third-party marks and missing current operating and preference
    data make "research more" the defensible recommendation.
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and price discipline"
    body: >-
      The recommendation is research more, with medium confidence and high
      underwriting risk. Illumio's last disclosed primary round was a $225 million
      Series F at a $2.75 billion valuation in 2021, but current third-party signals
      do not converge: Forge reports a $1.3 billion valuation as of June 13, 2026,
      while Tracxn reports $2.8 billion. Those observations are not audited fair
      values, yet their roughly twofold spread is itself decision-relevant. No
      entry price should be approved without current ARR, growth, gross margin,
      retention, cash, debt, fully diluted ownership, and liquidation-preference
      data. The lower observed mark is therefore a diligence anchor rather than a
      buy signal, and the old primary valuation is not evidence that today's price
      is fair.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005"]
    tableRefs: ["TV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The positive case rests on external product signals and continued platform
      expansion. Illumio says it led the 2026 Forrester microsegmentation assessment,
      reports a 4.8-of-5 Gartner Peer Insights rating from 59 reviews, and launched
      agentless hybrid visibility using Check Point and Fortinet telemetry. The
      historical customer footprint included large enterprises and major banks,
      while a 2026 headquarters lease and an independently reported workforce of
      about 1,000 indicate ongoing operating commitment. The anti-thesis is not that
      these signals are false; it is that none substitutes for current recurring
      revenue quality, efficient growth, or investor economics. A strong product can
      still be a poor investment at the wrong price or behind an unfavorable
      preference stack.
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV011", "CV012", "CV016"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-comparable-context"
    title: "Scenarios and comparable context"
    body: >-
      The scenario bands below organize observed valuation references; they are not
      intrinsic-value forecasts. The bear anchor begins at or below Forge's $1.3
      billion mark if operating diligence reveals weak growth, poor retention, or
      preference overhang. The base case spans the current lower mark to the 2021
      $2.75 billion primary valuation, but only after validating SaaS economics. The
      bull reference reaches Tracxn's reported $2.8 billion mark if durable growth,
      margins, and expansion are demonstrated. Broader cybersecurity transactions
      show exit capacity but are not direct valuation multiples: Forge cites
      SailPoint's nearly $13 billion 2025 public valuation and Google's announced
      $32 billion Wiz acquisition, while Tracxn identifies Zscaler, Wiz, and Tenable
      as competitors with different product scopes and capital-market statuses.
    claimRefs: ["CV002", "CV004", "CV005", "CV013", "CV014", "CV015"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      Forge characterizes Illumio as a possible IPO candidate but states that no
      specific IPO plan has been announced. A large headquarters commitment and
      continued product launches are compatible with scale, but neither establishes
      IPO readiness, liquidity timing, or distributable value for current holders.
      Before an investment committee sets a price, management should provide audited
      financials, ARR and net retention cohorts, gross margin and cash burn, pipeline
      conversion, customer concentration, debt, the fully diluted cap table, and all
      preference and participation terms. Thesis-break triggers are a sustained
      valuation ask above the observed range without corresponding economics, growth
      or retention deterioration, a preference stack that materially subordinates
      new capital, or evidence that platform expansion is not producing efficient
      recurring revenue.
    claimRefs: ["CV006", "CV009", "CV010", "CV011", "CV005"]
    figureRefs: ["FV001"]
