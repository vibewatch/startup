callouts:
  - calloutType: risk
    title: The Agent Overhead vs Platform Bundling Dilemma
    body: >-
      Illumio's core competitive moat—deep, kernel-level host visibility and microsegmentation via the Virtual Enforcement Node (VEN)—is simultaneously its primary operational vulnerability. While host-based enforcement provides unmatched granularity across hybrid clouds, enterprise operations teams resist software bloat and kernel-level maintenance across sprawling server fleets. Illumio's strategic pivot to agentless visibility via firewall partnerships mitigates deployment friction but exposes the company to disintermediation by those same perimeter firewall giants. Investors must monitor whether Illumio can maintain independent software premium pricing against consolidated security platforms.
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR010
