      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Forge 将 Illumio 归类为潜在 IPO 候选企业，但也指出尚未公布具体的 IPO 计划。庞大的总部承诺与持续的产品发布与业务规模相符，但这既不能确立 IPO
              准备就绪程度，也无法明确流动性时间表或当前股东的可分配价值。在投资委员会确定投资价格之前，管理层应提供经审计的财务报表、ARR
              与净留存率队列、毛利率与现金烧钱速度、销售线索转化率、客户集中度、负债情况、完全摊薄股权结构表以及所有优先权和参与权条款。导致投资逻辑破裂的触发因素包括：在缺乏相应财务指标支撑的情况下持续要求高于观察区间的估值、增长或留存出现恶化、显著劣后新资本的优先股堆叠，或是有证据表明平台扩张未能带来高效的经常性收入。
            claimRefs:
              - CV006
