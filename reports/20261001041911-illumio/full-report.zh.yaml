chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与市场使命
        blocks:
          - type: paragraph
            body: >-
              Illumio, Inc. 是一家总部位于加利福尼亚州 Sunnyvale 的网络安全公司，由 Andrew Rubin 和 P.J. Kirner 于 2013
              年创立。作为零信任分段（ZTS）与入侵遏制领域的品类开创者，公司致力于解决企业网络内部的横向攻击扩散问题。从历史上看，企业边界防御主要聚焦于南北向出入流量过滤，一旦攻击者建立初始访问权限，内部东西向应用流量便畅通无阻。Illumio
              针对这一架构缺陷，将策略计算与网络基础设施解耦，利用原生主机操作系统的包过滤器在工作负载、裸金属服务器、虚拟机及云容器周围构建微边界。公司的核心立足于一种基本假设：在复杂的攻击手段面前，网络边界终将失效，因此主动遏制成为防止局部入侵演变为灾难性勒索软件事件的关键机制。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 高管领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Illumio 的高管团队由联合创始人兼首席执行官 Andrew Rubin 领衔，他自 2013 年公司创立以来一直负责公司战略、融资及商业化扩张。联合创始人兼首席技术官 P.J. Kirner
              主管核心工程架构与技术创新，是 Illumio 核心 Policy Compute Engine 基础设计的原创作者。公司通过引入资深企业软件高管进一步充实了管理层阵容，包括前 Nimble Storage
              首席财务官 Anup Singh 出任 CFO，以及前 Palo Alto Networks 和 Symantec 产品高管 Mario Espinoza
              出任首席产品官。尽管创始团队保留了深厚的行业领导力与架构掌控力，但对 Rubin 和 Kirner
              的关键人物依赖依然显著。此外，行业从业者评测与客户评估表明，在大规模多操作系统部署场景下，自动化策略生成、增强型报告分析以及降低管理摩擦等方面的运营需求持续存在。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: 资本化历程与投资机构财团
        blocks:
          - type: paragraph
            body: >-
              自 2013 年成立以来，Illumio 通过六轮融资累计获得超 $557M 的机构股权投资。公司的资本化历程体现出硅谷顶级风险投资机构与机构资产管理公司的持续支持。早期融资包括 2013 年由 General
              Catalyst 和 Andreessen Horowitz 支持的 $34.5M Series B 轮，随后是 2015 年由 Accel 和 BlackRock 领投的 $100M Series C 轮，以及
              2017 年由 J.P. Morgan Asset Management 领投的 $125M Series D 轮。2021 年 6 月，Illumio 完成由私募股权机构 Thoma Bravo 领投的
              $225M Series F 轮融资，投后估值达 $2.75B，跻身知名网络安全独角兽行列。然而，Illumio 自 2021
              年以来未再进行过新股融资，当前老股交易市场的估值基准及股权结构表优先权条款在公开渠道仍未披露。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 商业化规模与平台演进
        blocks:
          - type: paragraph
            body: >-
              Illumio 展现出显著的企业级商业化采纳成果，官方披露已有超 1,000 家机构以及超 15 家 Fortune 100 强企业采用其入侵遏制技术。在 2022 财年的披露中，公司强调全球收入增长超
              60%，预订额同比增长 100%，且有 27 家客户贡献的年经常性收入（ARR）超过 $1M。公司的产品线已从最初的 Adaptive Security Platform 大幅演进，扩展至 Illumio
              CloudSecure SaaS，并在 2026 年 2 月推出了利用 Check Point 和 Fortinet
              防火墙遥测的无代理可见性与遏制功能。这种混合扩展使企业无需在传统数据中心环境中安装端点代理即可映射网络流量。在 Q3 2026，行业认可度达到顶峰，Forrester Research 在 The
              Forrester Wave for Microsegmentation Solutions 报告中将 Illumio 评为领导者及 Customer Favorite。
