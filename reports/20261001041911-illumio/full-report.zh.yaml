        blocks:
          - type: paragraph
            body: >-
              从历史上看，企业微分段部署一直面临由主机代理资质验证、内部变更管理阻力以及跨独立网络与安全技术栈的工具蔓延所导致的运营摩擦。为化解这些阻力，Illumio 在 2026 年推行了两大战略转向：一是在
              Illumio Insights 中技术集成了无代理混合可见性（直接接入 Check Point 和 Fortinet 防火墙的原生遥测而无需主机代理），二是深化了与 Check Point Software
              的全球商业联盟。在该合作框架下，企业客户可以直接通过 Check Point 的商业渠道采购
              Illumio，使企业买方能够整合供应商账单、消耗现有的防火墙企业许可协议额度，并加速全企业范围的推广。这一布局精准契合了市场需求——IDC 研究指出，在该品类预计达 23.5% 的复合年增长率背景下，98.3%
              的微分段买方希望其解决方案能与现有的防火墙、SASE 和零信任平台紧密集成。然而，这种高度的渠道依赖带来了显著的商业风险：行业分析师警告称，Check Point 的激进捆绑打包对独立微分段许可产生定价压力，将在
              2027 年前加速企业安全套件整合，并在独立联盟受挫时使独立分段技术面临被沦为嵌入式平台功能的风险。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU013
      - number: '6.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 渠道分销破解采购与部署摩擦
            body: >-
              通过 Check Point 进行直接商业采购解决了微分段采纳中长期存在的主要瓶颈：供应商繁杂与主机代理部署疲劳。通过将无代理防火墙遥测与联合销售直接采购相结合，Illumio 顺应了企业买方的需求（98.3%
              的客户要求与防火墙和 SASE 深度集成）。
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU010
          - type: callout
            title: 套件捆绑与平台吸收风险
            body: >-
              尽管渠道联盟在短期内加快了客户拓展速度，但 Check Point 的套件捆绑压低了独立产品定价，并促使企业买方转向统一的多产品许可。如果主流网络与云厂商在 2027
              年前成功将微分段商品化为防火墙默认操作系统的标配功能，Illumio 将面临利润率挤压与被平台吸收的风险。
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管指令与运营韧性合规
        blocks:
          - type: paragraph
            body: >-
              全球监管框架从根本上改变了企业网络安全风险评估逻辑，将合规评估重心从静态控制项核查转向压力测试下的主动运营韧性。欧盟的 Digital Operational Resilience Act（DORA）及更新后的
              PCI-DSS 适用范围指令要求金融机构和关键基础设施运营方证明，即使主要控制措施失效，核心业务职能仍可维持运转。金融服务机构面临高额的数据泄露罚款，单次数据泄露事件平均成本达
              $5.97M，其中业务流失损失占总损失影响的 55%。Illumio 将其零信任分段平台定位于满足此类监管韧性指令的入侵遏制机制。然而，由于庞杂异构的存量 IT
              资产导致一致性策略执行难度加大，且快速的数字化转型在业务敏捷性与严苛的安全适用边界之间持续引发冲突，企业在推行过程中面临重大阻力。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
