      - number: '8.3'
        title: 估值情景与对标背景
        blocks:
          - type: paragraph
            body: >-
              下述情景区间旨在整理观察到的估值参考点，并非内在价值预测。悲观情景锚点始于或低于 Forge 给出的 $1.3B 估值点位（若业务尽调揭示增长疲软、留存不佳或优先权结构压力严重）。基准情景介于当前较低估值点位至
              2021 年 $2.75B 的新股估值之间，但前提是必须验证其 SaaS 财务指标。乐观情景参考点可达 Tracxn 报告的 $2.8B
              估值点位（前提是能够证实持久的增长、利润率及业务扩张）。更广泛的网络安全并购交易展示了退出容量，但不能直接作为估值倍数：Forge 援引了 SailPoint 在 2025 年近 $13B 的上市估值以及
              Google 宣布以 $32B 收购 Wiz，而 Tracxn 则将 Zscaler、Wiz 和 Tenable 列为竞争对手，但这些公司的产品范畴与资本市场状态各异。
