              多个国家及地区进行管理。尽管公开渠道未披露公开标价，但商业化落地通常采用按工作负载分档定价的年度或多年期订阅合同。通过与 Check Point 和 Fortinet
              防火墙遥测集成引入无代理可见性功能，降低了客户上手门槛，并为扩大企业级渗透提供了阻力更小的切入点。
