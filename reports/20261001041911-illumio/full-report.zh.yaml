      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正面投资逻辑依托于外部产品信号与持续的平台扩展。Illumio 称其领跑了 2026 年 Forrester 微分段评估，报告了来自 59 条评测、满分 5 分中获 4.8 分的 Gartner Peer
              Insights 评分，并推出了利用 Check Point 和 Fortinet 遥测的无代理混合可见性。其历史客户群体涵盖大型企业与主流银行，而 2026 年设立总部租约以及独立报告的约 1,000
              名员工规模，表明其业务运营投入持续稳定。反向逻辑并非否认这些信号的真实性，而是这些表象均无法替代对当前经常性收入质量、高效增长或投资者财务回报的验证。若定价过高或处于不利的优先股堆叠之后，即便优质的产品也可能沦为劣质投资。
            claimRefs:
