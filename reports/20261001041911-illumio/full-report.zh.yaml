              根据设备网络连接动态调整主机防火墙策略，以隔离受感染的端点。作为核心分段的有力补充，Illumio Insights 充当由 Illumio AI Security Graph 驱动的 AI
              云检测与响应引擎，用于暴露横向移动风险并将漏洞与活跃网络路径相关联。这些模块使企业安全运营团队能够借助自动化、基于标签的分段，取代手动且易错的访问控制列表。
