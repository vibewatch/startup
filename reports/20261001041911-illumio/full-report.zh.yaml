        - 集群控制器故障会导致策略向执行节点的下发延迟
      - - Virtual Enforcement Node (VEN)
        - 流式传输遥测数据并接收规则的轻量级主机代理
        - 客户机操作系统内核与原生数据包过滤器（iptables、WFP）
        - 代理版本老化或与客户机操作系统内核不兼容
      - - Network Enforcement Node (NEN)
        - 无代理遥测采集器与网络 ACL 编程服务
        - 企业交换机、路由器及网络设备管理 API
        - 硬件设备固件不兼容或 API 调用配额耗尽
      - - Flowlink & Telemetry Ingestion
        - 聚合多源网络流数据的独立采集器
        - 网络流协议（NetFlow、sFlow、IPFIX）与计算资源
        - 企业突发业务高峰期高吞吐流量丢包
      - - Cloud Synchronization Services
        - 多云资源发现与安全组 API 编排器
        - 公有云 IAM 凭证与厂商管理 API
        - 云厂商 API 限流或 IAM 凭证过期导致策略更新中断
    notes: 架构组件与依赖关系来源于官方技术白皮书和工程规范。
