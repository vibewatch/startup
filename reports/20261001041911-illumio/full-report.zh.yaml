  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与运行模式
        blocks:
          - type: paragraph
            body: >-
              Illumio 是一套零信任入侵遏制与微分段平台，旨在阻断跨异构企业环境的横向威胁扩散。与尝试边界拦截或作为内联网络设备运行不同，Illumio 将策略智能与数据包执行彻底解耦。Policy Compute
              Engine 作为集中管理控制器，负责接入遥测数据、构建实时应用依赖图谱，并利用上下文多维标签计算最小权限放行规则。工作负载层面的执行则委派给 Virtual Enforcement
              Node（VEN）——这是一种内嵌于客户操作系统中的轻量级代理程序，用于配置原生有状态防火墙（如 Linux iptables/nftables 和 Windows Filtering
              Platform）。由于代理绝不串接在流量链路中，且无需自定义内核扩展，因此主机层面的崩溃或软件更新绝不会中断生产网络连接。在无法安装软件代理的传统基础设施、IoT/OT 环境及云数据库实例中，Illumio
              通过结合 Network Enforcement Node 与云 API 集成，在交换机、路由器、负载均衡器及云安全组上配置访问控制列表。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
