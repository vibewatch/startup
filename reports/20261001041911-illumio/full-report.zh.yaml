  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    summary: 从宏观网络安全支出逐层细分至 Illumio 专注的纯微隔离入侵遏制可获取市场的层级结构。
    approximationNotes: 市场规模数据综合自 Coherent Market Insights（$4.56B）、Dataintelo（$3.80B）及企业工作负载订阅模型；SOM 反映纯微隔离可获取支出。
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM005
      - CM015
    data:
      items:
        - label: 网络与云安全总支出
          value: 28.5
          detail: 广泛的企业边界、云网络安全及防火墙基础设施（$28.5B TAM）
          tone: neutral
        - label: 全球微隔离市场
          value: 4.56
          detail: Coherent Market Insights 对 2026 年涵盖软件许可与专业落地服务的预测（$4.56B）
          tone: positive
        - label: 微隔离软件 TAM
          value: 2.37
          detail: 专用软件部分（根据 Dataintelo 研究占总市场的 62.4%），不含物理硬件设备（$2.37B）
          tone: positive
        - label: 可服务受监管企业 SAM
          value: 1.85
          detail: 受 DORA/NIST 监管的金融、医疗、政府及关键基础设施混合云资产（$1.85B）
          tone: opportunity
        - label: 专注型入侵遏制 SOM
          value: 0.48
          detail: 针对传统防火墙替代的专用策略计算引擎近期可获取市场（$0.48B）
          tone: opportunity
        - label: 年度运营人工与服务池
          value: 3.2
          detail: 相关的策略工程设计与持续隔离管理，占 3 年 TCO 的 60-70%（$3.2B）
          tone: warning
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 微隔离与混合云安全厂商在架构专业化和混合多云覆盖能力两个维度上的相对竞争定位。
    data:
      points:
        - label: Illumio
          x: 8.5
          'y': 9
          description: 专注型零信任微隔离领导者，具备广泛的多云与无代理防火墙覆盖能力
        - label: Akamai Guardicore
          x: 8
          'y': 7.5
          description: 主要的专用微隔离竞争对手，借助运营商网络边缘基础设施
        - label: Cisco Secure Workload
          x: 7.5
          'y': 6
          description: 现有数据中心网络架构安全方案，对基础设施有较强依赖
        - label: Palo Alto Networks
          x: 6.5
          'y': 8.5
          description: 综合网络安全平台，兼具原生防火墙与云安全业务重叠
        - label: Fortinet
          x: 6
          'y': 7
          description: 以硬件为核心的防火墙设备提供商，将遥测数据集成至混合安全中
        - label: Tenable Cloud Security
          x: 5.5
          'y': 5.5
          description: 云原生安全态势与漏洞管理，缺乏深度微隔离能力
        - label: Zero Networks
          x: 7
          'y': 6.5
          description: 自动化微隔离初创企业，挑战传统代理部署模式
    approximationNotes: 定位评分反映基于厂商披露和行业分析得出的架构专业化与多云覆盖相对序数评分（1-10 分）。
    claimRefs:
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型与单位经济传导桥
    type: waterfall
    summary: 追溯从企业合同签约到净确认毛利率的示意瀑布图。
    data:
      items:
        - label: 企业初始 ACV
          value: 100
          detail: 每次企业工作负载部署签约的年度合同总价值
        - label: 渠道代理折扣
          value: -20
          detail: 通过 Check Point 等联盟伙伴提供的合作方分成与分销商折扣
        - label: 净开票软件收入
          value: 80
          detail: 在服务期内按比例确认的净订阅合同价值
        - label: 云端与遥测托管成本
          value: -10
          detail: 多云流量遥测数据摄取与 AI Security Graph 计算成本
        - label: 客户导入与支持
          value: -6
          detail: 技术客户管理、客户成功与日常运维服务
        - label: 净毛利率贡献
          value: 64
          detail: 扣除营运费用前的隐含 64% 软件毛利率
