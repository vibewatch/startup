  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与相邻支出
        blocks:
          - type: paragraph
            body: >-
              零信任分段市场代表了与基于边界的网络防御及南北向零信任网络访问（ZTNA）在架构上的根本转变。传统边界架构依赖边界防火墙与粗粒度 VLAN
              分区，而微分段将策略执行直接下沉至单个工作负载与操作系统内核，为所有东西向横向流量建立最小权限通信策略。这一边界将纯粹的工作负载隔离与互补性访问控制清晰区分开来：ZTNA
              负责对访问特定应用的用户和端点进行身份验证，而微分段则防止入侵单个主机的攻击者横向渗透至域控制器或备份数据存储。Illumio 作为品类领导者的地位在 Q3 2026 Forrester Wave for
              Microsegmentation Solutions 评估中得到巩固，其在战略与产品能力维度均获最高分。近期推出的混合架构扩展（例如接入 Check Point 和 Fortinet
              防火墙的原生遥测）使企业能够在不替换现有投资的情况下，实现跨数据中心与云环境的无代理可见性。
            claimRefs:
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM011
              - CM014
      - number: '2.2'
        title: 目标市场规模、增长空间与受限 TAM
        blocks:
          - type: paragraph
            body: >-
              受勒索软件遏制紧迫性与合规强制要求的驱动，零信任微分段的目标市场规模展现出企业采纳加速的趋势。不同机构的全球市场测算因方法学而异：Coherent Market Insights 预计 2026 年市场规模将达
              $4.56B，复合年增长率为 25%；而 Dataintelo 估计 2025 年市场规模为 $3.8B，复合年增长率（CAGR）为 17.5%，其中纯软件部分占
              $2.37B。从受限视角评估该市场时，企业支出受到总体拥有成本（TCO）结构的严重影响。第三方采购基准显示，软件订阅许可（在 1,000 个工作负载以下时通常为每个工作负载每年 $30 至 $80，在
              50,000 个工作负载规模下逐步降至 $10 至 $12）仅占三年期总支出的 30% 至 40%。其余 60% 至 70%
              则被初始应用依赖项梳理、配置管理标签标注以及跨基础设施和应用工程团队的跨职能策略治理所消耗。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM015
      - number: '2.3'
        title: 买方客群细分、预算分配与采购路径
        blocks:
          - type: paragraph
            body: >-
              大型企业、云原生扩张期企业与中端市场机构之间的采购动态与预算归属存在显著差异。在 Global 2000
              强企业和一级金融机构中，采购决策权集中在首席信息安全官（CISO）与中央企业安全预算，业务连续性保障团队与合规团队充当主要经济赞助方。相反，尽管 IT 规模较小但承受了 81%
              成功勒索攻击的中小型企业（SMB），通常通过安全托管服务商（MSSP）或结合 IT 基础设施预算采购微分段产品。Illumio
              基于工作负载的许可框架通过将裸金属、虚拟机和云容器中的单个操作系统实例定义为基础工作负载单元，同时允许五个用户端点共享单个工作负载许可，有效满足了不同买方的需求。在云市场渠道上，客户满意度保持极高水平，PeerSpot
              上的 AWS Marketplace 平均评分为 9.5 分，且拥有全员推荐意愿。
            claimRefs:
              - CM007
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: 增长驱动力、实施瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >-
              严格的合规监管与灾难性的勒索软件形势推动了企业对微分段的采纳，但这一趋势受到实质性部署摩擦的掣肘。ORDR 对企业安全负责人的调查显示，99% 的机构正在实施或积极规划微分段项目。在欧盟，Digital
              Operational Resilience Act（DORA）于 2026
              年进入深度监管阶段，要求关键金融机构及其信息通信技术（ICT）第三方供应商对经实证的服务遏制能力直接负责。与此同时，承保机构称在中小企业理赔损失激增 58%
              后，正强制要求对关键资产实施工作负载分段。然而，同等规模下高达 38% 的初始报价分散度以及繁重的策略建模工作制约了采纳速度：缺乏规范 CMDB 标签的机构仅建立标签分类体系就需要 4 至 8
              周，随后才能在不影响业务运行的前提下安全激活执行规则。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM013
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: TCO 乘数效应：运营策略调优支出超出软件许可费用
            body: >-
              评估微分段的企业买方常将软件许可费用误认为总投资成本。尽管纯分段软件的工作负载订阅费根据部署规模在每个工作负载每年 $10 至 $80 不等，但独立基准表明，许可费用仅占三年总体拥有成本的 30% 至
              40%。其余 60% 至 70% 的支出则流向初始应用依赖项映射、CMDB 标签核对，以及安全运维（SecOps）与应用负责人之间持续的跨职能策略治理。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 监管趋同：作为双刃剑的需求催化剂
            body: >-
              虽然欧洲 DORA
              及美国联邦零信任指令等严苛合规框架为入侵遏制创造了刚性预算分配，但同时也拉长了企业的采购决策周期。接受联合监管审查的金融机构面临严苛的运营可审计性标准，要求具备完善的操作手册以及快速隔离工作负载的证明，导致企业评估周期延长至
              6 到 12 个月。
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构范式
        blocks:
          - type: paragraph
            body: >-
              零信任微分段市场由垂直细分专家、传统企业网络巨头以及云原生应用保护平台（CNAPP）厂商共同构成。Illumio
              将其核心平台定位于勒索软件与入侵遏制，致力于防止跨混合多云及本地部署数据中心架构的东西向横向威胁扩散。Akamai Guardicore 和 Zero Networks
              等垂直竞争对手瞄准类似的工作负载隔离场景，而 Palo Alto Networks 等平台型厂商则在其广泛的安全套件中提供边界相邻的分段能力。在分析机构的评估中，特别是 Q3 2026 Forrester
              Wave for Microsegmentation Solutions 报告中，Illumio 在 10 家参评厂商中，在当前产品能力和战略维度均被评为品类领导者。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 直接竞争对手与传统巨头画像
        blocks:
          - type: paragraph
            body: >-
              评估竞争对手画像揭示了专注型风投规模企业与多元化传统巨头资产负债表之间的结构性分化。Illumio 累计获得超 $558M 股权融资，以 Thoma Bravo 领投的 $2.75B Series F
              轮估值为支撑，支撑着估计在 $100M 至 $500M 之间的收入规模。相比之下，其主要竞争对手依托于体量庞大的上市跨国公司：Guardicore 依托 Akamai 的全球边缘网络运营，而 Cisco
              Secure Workload 则撬动其无处不在的企业园区和交换机基础设施。尽管 Palo Alto Networks 等平台提供商掌控着更大的企业整体安全预算，但 Illumio
              专注于主机级策略管理的研发投入，使其核心客群免受通用型边界扩展方案的蚕食。
            claimRefs:
              - CP003
              - CP004
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.3'
        title: 能力差异化、GTM 与信任态势
        blocks:
          - type: paragraph
            body: >-
              Illumio 的核心差异化主要体现在细粒度的工作负载级流量控制、基于标签的策略引擎以及广泛的混合架构集成深度，而非被动的云配置审计。与聚焦于漏洞发现的 Tenable Cloud Security
              等安全态势管理解决方案不同，Illumio 直接在操作系统和工作负载层强制执行主动的横向流量规则。针对企业的硬件资产投入，Illumio Insights 实时接入来自 Check Point 和
              Fortinet 防火墙的遥测数据，在基于代理的强制执行之外提供无代理的混合可见性。其商业销售方案分为 Illumio Segmentation 与 Illumio
              Insights，通过按核心或工作负载的年度订阅实现商业化。这种产品形态高度契合严格的监管合规框架（包括欧洲 DORA 指令与 PCI-DSS 合规要求），推动了在金融服务与医疗行业的广泛采纳。
