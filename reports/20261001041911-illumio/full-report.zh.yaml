    title: 乐观、基准与悲观情景条件框架
    columns:
      - 情景
      - 假设前提
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观情景
        - 增长或留存疲软、规模扩张缺乏效率，或存在优先权结构压力。
        - 等于或低于 Forge 给出的 $1.3B 参考值；在缺少入场条款和退出时机的情况下无法计算目标回报率。
        - 降估值融资、股权稀释以及流动性推迟。
        - 无法从公开证据中估算；若披露不利 KPI 或条款将触发该情景。
      - - 基准情景
        - 需求持续但未量化、SaaS 经济效益可接受，且无惩罚性优先股堆叠。
        - $1.3B-$2.75B 的观察参考区间；在计算回报前须核定持股比例与稀释情况。
        - 估值倍数下行及平台捆绑竞争压力。
        - 无法估算；仅在当前经审计指标弥合估值鸿沟后方能获得支撑。
      - - 乐观情景
        - 经常性收入增长强劲、留存率高、利润率健康，且具备切实可信的公开市场上市准备度。
        - 证据支持溢价前的 $2.75B-$2.8B 参考区间；广泛的网络安全并购交易仅作为行业背景，而非直接可比案例。
        - 将 Wiz 或 SailPoint 的交易标头金额不恰当地用作直接估值倍数。
        - 无法估算；需要经过验证的增长率、利润率、留存率及退出流程。
    notes: 区间仅用于梳理观察到的融资与市场数据参考，而非预测公允价值；Wiz 和 SailPoint 属于更广泛的行业背景，具备不同的业务形态和交易架构。
    claimRefs:
      - CV001
      - CV002
