  - id: FE001
    title: 产品架构图
    type: stack
    summary: Illumio Zero Trust Segmentation 平台架构，展示从管理端到执行端的编排机制。
    data:
      layers:
        - label: 管理与策略控制器层
          detail: 集中式 Policy Compute Engine（PCE）计算白名单规则并负责集群管理
          modules:
            - label: Policy Compute Engine（PCE）集群
        - label: 威胁分析与风险图谱层
          detail: AI Security Graph 揭示横向移动路径与漏洞关联
          modules:
            - label: Illumio Insights 风险图谱
        - label: 可视化与 API 接口层
          detail: 实时应用依赖拓扑控制台及管理类 REST API
          modules:
            - label: Illumio 可视化控制台
        - label: 遥测与流量采集层
          detail: Flowlink 网络数据包汇聚与多云遥测数据摄取
          modules:
            - label: Flowlink 采集器
        - label: 执行与编排层
          detail: Virtual Enforcement Node 主机防火墙编程及 Network Enforcement Node ACL 编程
          modules:
            - label: Virtual Enforcement Node（VEN）
        - label: 受管基础设施层
          detail: 混合多云工作负载、裸金属服务器、容器 Pod 及远程企业端点
          modules:
            - label: 裸金属、容器与端点
    approximationNotes: 代表基于 Illumio 架构技术文档梳理的概念性功能分层。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业客户采纳生命周期，从初始入侵遏制发现，演进至全资产微隔离与渠道采购。
    data:
      items:
        - label: 1. 风险评估与监管驱动
          summary: >-
            Enterprise evaluates lateral movement vulnerabilities driven by DORA, NIS2, or ransomware preparedness
            mandates.
          touchpoints:
            - CISO / 董事会审查
            - 监管差距审计
            - 分析机构 Wave 报告对标
        - label: 2. 无代理发现与流量测绘
          summary: >-
            Rapid deployment of Illumio Insights ingesting Check Point and Fortinet firewall telemetry to visualize
            east-west flows.
          touchpoints:
            - 防火墙遥测数据集成
            - 实时流量拓扑图
            - 爆炸半径模拟
        - label: 3. 初始生产 PoC 与核心围栏
          summary: >-
            Targeted deployment securing high-value databases, payment environments, or legacy applications without host
            re-architecture.
          touchpoints:
            - 核心资产标签化
            - 零信任策略建模
            - 概念验证（PoC）评估
        - label: 4. 企业采购与渠道整合
          summary: >-
            Commercial licensing executed directly through Check Point or major technology partners to streamline
            procurement.
          touchpoints:
            - 合作伙伴云市场
            - 联合销售折扣
            - 主服务协议（MSA）
        - label: 5. 全资产主机代理部署
          summary: >-
            Technical Account Management and Customer Success Advisors oversee scaling across on-prem, cloud, and
            container workloads.
          touchpoints:
            - 高管业务审查
            - TAM 架构指引
            - 工作负载强制策略验证
        - label: 6. 业务扩张与 AI 检测集成
          summary: >-
            Account expansion across new business units and adoption of AI cloud detection and response for continuous
            containment.
          touchpoints:
            - NRR 增长审查
            - AI Security Graph 集成
            - 年度续约协议
    approximationNotes: 生命周期阶段综合自 Gartner Peer Insights 用户评价、合作伙伴分销公告以及 TAM 岗位职责说明。
    claimRefs:
      - CU006
      - CU007
      - CU010
      - CU013
  - id: FR001
    title: 零信任企业风险严重程度与缓解矩阵
    type: matrix
    summary: 围绕严重程度、发生概率及缓解成熟度，对主要运营、合规、合作伙伴及财务风险进行综合评估。
    data:
      columns:
        - name: low-impact
          label: 低度影响
        - name: medium-impact
          label: 中度影响
        - name: high-impact
          label: 高度影响
        - name: critical-impact
          label: 严重影响
        - name: systemic-impact
          label: 系统性影响
        - name: existential-impact
          label: 颠覆性影响
      rows:
        - name: high-likelihood
          label: 高概率
          values:
            - label: 轻微 API 速率限制
              note: 日常 PCE API 限流通过标准退避协议处置
            - label: PCI-DSS 审计范围漂移
              note: 工作负载无序扩张需要反复进行合规策略审计
            - label: 主机代理部署开销
              note: 在复杂的异构服务器集群中部署 VEN 存在运维阻力
            - label: 销售采购周期拉长阻力
              note: 风险厌恶型企业委员会决策评估周期漫长
            - label: 多云安全遥测延迟
              note: 分布式云 VPC 间的遥测数据同步延迟
            - label: 遗留主机驱动兼容问题
              note: 老旧企业操作系统发行版上的内核数据包过滤冲突
        - name: medium-likelihood
          label: 中概率
          values:
            - label: 轻微遥测摄取延迟
              note: 第三方防火墙遥测数据摄取出现轻度延迟
            - label: 防火墙厂商平台捆绑
              note: 来自集成防火墙安全套件的生态伙伴竞争
            - label: 监管运营韧性审查
              note: DORA 框架下要求证明业务连续性的监管审计
            - label: 跨云网络策略漂移
              note: 本地与公有云环境之间规则定义不一致
            - label: 企业安全团队孤岛化
              note: SecOps 与基础设施网络团队之间的组织摩擦
            - label: 估值倍数下行压缩
              note: 相较于公开市场可比公司倍数变动带来的后期估值悬念
        - name: low-likelihood
          label: 低概率
          values:
            - label: 文档差异
              note: API 版本与实施指南之间存在细微出入
            - label: PCE 超级集群主节点延迟
              note: 区域集群同步事件中的故障转移延迟
            - label: 核心应用错误配置
              note: 策略执行不当导致核心生产交易被阻断
            - label: 第三方防火墙 API 废弃
              note: 合作伙伴遥测提取钩子发生突发破坏性变更
            - label: 内核崩溃致主机工作负载中断
              note: 端点代理交互引发的严重内核驱动故障
            - label: 受控状态下客户遭遇灾难性数据泄露
              note: 未被察觉的横向移动绕过微隔离边界
    notes: 矩阵将发生概率与潜在业务影响相映射；单元格备注标明了主动运维缓解措施与残余风险敞口。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR009
      - CR010
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 决策路径从产品力验证出发，经由估值分歧与经济指标缺失，最终得出有条件的继续研究建议。
    data:
      nodes:
        - id: product-proof
          label: 产品力验证
          detail: 2026 年分析机构与客户认可度来自公司披露。
        - id: platform-expansion
          label: 平台扩张
          detail: 无代理混合可见性拓宽了价值主张。
        - id: operating-scale
          label: 运营规模
          detail: 独立报道显示约 1,000 名员工及新总部租约。
        - id: valuation-dispersion
          label: 估值分歧
          detail: 观察到的参考估值在 $1.3B 至 $2.8B 之间。
        - id: private-data-gap
          label: 私有数据缺口
          detail: 当前 SaaS 经济指标、现金、债务、所有权及优先权条款均不可得。
        - id: recommendation
          label: 继续研究
          detail: 仅在指标与证券权益得到核验后再行确立入场条款。
    approximationNotes: 流程为定性且有序的推演；未赋予概率值，亦未暗示经过测算的估值。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV016
