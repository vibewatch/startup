callouts:
  - calloutType: "insight"
    title: "Channel Distribution Solves Procurement and Deployment Friction"
    body: "Direct commercial procurement through Check Point addresses the primary historical bottleneck for microsegmentation adoption: vendor sprawl and host agent deployment fatigue. By combining agentless firewall telemetry with direct co-sell procurement, Illumio aligns with enterprise buyer demand where 98.3% of customers require tight firewall and SASE integration."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU010"
  - calloutType: "risk"
    title: "Suite Bundling and Platform Absorption Vulnerability"
    body: "While channel alliances accelerate short-term customer velocity, Check Point's suite bundling pressures standalone pricing and incentivizes enterprise buyers toward unified multi-product licenses. If major network and cloud vendors successfully commoditize microsegmentation into default firewall operating systems by 2027, Illumio faces margin compression and platform absorption risks."
    claimRefs:
      - "CU012"
      - "CU013"
