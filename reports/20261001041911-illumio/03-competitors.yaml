callouts:
  - calloutType: "insight"
    title: "Agentless Telemetry Bridges Hardware and Host Microsegmentation"
    body: "By integrating telemetry from Check Point and Fortinet firewalls directly into Illumio Insights, Illumio neutralizes a key objection to pure-play software segmentation, enabling enterprises to visualize perimeter and lateral east-west traffic within a single console without immediate full-fleet agent rollouts."
    claimRefs:
      - "CP006"
      - "CP007"
  - calloutType: "risk"
    title: "Platform Consolidation Pressures Dedicated Security Budgets"
    body: "Broad platform security incumbents such as Palo Alto Networks and Fortinet offer integrated segmentation features bundled into enterprise license agreements, creating persistent pricing friction and lengthening sales cycles for dedicated breach containment solutions."
    claimRefs:
      - "CP011"
      - "CP012"
