callouts:
  - calloutType: strength
    title: Non-Inline Host Architecture Eliminates Single Points of Failure
    body: >-
      By decoupling policy computation in the Policy Compute Engine from enforcement in the Virtual Enforcement Node, Illumio avoids placing proprietary software inline to network traffic. The agent utilizes native host firewalls, ensuring that host agent maintenance or outages never interrupt active data plane communication.
    claimRefs:
      - CE003
      - CE004
  - calloutType: risk
    title: Operational Complexity and Policy Authoring Overhead
    body: >-
      Peer reviews and enterprise deployment evaluations note that while Illumio delivers robust network visibility, creating and maintaining granular segmentation policies across large-scale heterogeneous estates requires significant operational overhead, continuous agent lifecycle management, and enhanced automated workflows.
    claimRefs:
      - CE014
      - CE015
