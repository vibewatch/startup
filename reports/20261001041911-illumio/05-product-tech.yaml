  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Traditional Workflow
      - Illumio Platform Solution
      - Measurable Operational Benefit
      - Technical Limitation / Friction
    rows:
      - - Data Center East-West Traffic Containment
        - Static VLANs, subnet firewalls, and manual IP access control lists
        - Host-level firewall orchestration using multi-dimensional metadata labels
        - Eliminates network re-architecting and prevents lateral spread
        - Initial policy authoring requires discovering all application flows
      - - Multi-Cloud Security Boundary Management
        - Disjointed native security group rules across AWS, Azure, and GCP
        - Unified policy computation engine synchronizing cloud security groups
        - Centralized rule consistency and cross-cloud visibility maps
        - Subject to cloud provider API latency and synchronization delays
      - - Ransomware and Malware Blast Radius Isolation
        - Emergency network disconnection or manual host isolation protocols
        - Automated application ringfencing and instant host isolation
        - Restricts malware propagation to immediate peer workload in minutes
        - Strict isolation rules can disrupt undocumented microservices
      - - Legacy and IoT/OT Network Access Control
        - Unsegmented flat networks due to inability to install software agents
        - Network Enforcement Node (NEN) programming switch and router ACLs
        - Extends zero-trust boundaries to unmanaged appliances and databases
        - Switch hardware ACL table limits constrain rule scale
    notes: "Workflow comparisons compiled from Illumio architecture briefs, documentation guides, and enterprise peer reviews."
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE009
      - CE014
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architectural Layer
      - Role & Operational Mechanism
      - Primary Infrastructure Dependency
      - Key Failure Mode & Technical Risk
    rows:
      - - Policy Compute Engine (PCE)
        - Centralized management console and rule computation controller
        - Distributed database, Kafka message queues, and SaaS/on-prem nodes
        - Cluster controller failure delays policy distribution to enforcement nodes
      - - Virtual Enforcement Node (VEN)
        - Lightweight host agent streaming telemetry and receiving rules
        - Guest OS kernel and native packet filters (iptables, WFP)
        - Agent version obsolescence or incompatibilities with guest OS kernels
      - - Network Enforcement Node (NEN)
        - Agentless telemetry collector and network ACL programming service
        - Enterprise switches, routers, and network device management APIs
        - Hardware device firmware incompatibilities or API rate exhaustion
      - - Flowlink & Telemetry Ingestion
        - Standalone collector aggregating multi-source network flow streams
        - Network flow protocols (NetFlow, sFlow, IPFIX) and compute resources
        - High-throughput flow packet drops during peak enterprise burst events
      - - Cloud Synchronization Services
        - Multi-cloud resource discovery and security group API orchestrator
        - Public cloud IAM credentials and vendor management APIs
        - Cloud provider API throttling or IAM credential expiration halts updates
    notes: "Architecture components and dependencies sourced from technical whitepapers and engineering specifications."
    claimRefs:
      - CE003
      - CE005
      - CE011
      - CE012
      - CE013
