  title: "Market Analysis"
  summary: "Sharpa targets the physical labor automation market by developing anthropomorphic tactile hands and full-body humanoid robots designed to solve the manipulation bottleneck in brownfield commercial environments without facility retrofitting. Near-term commercialization centers on component sales to embodied AI researchers and early quick-service validation trials, while broader enterprise adoption remains constrained by unverified shift-level intervention rates and actuator supply-chain scaling."
sections:
  - id: "market-boundary-and-scope"
    title: "Market Boundary and Scope of Manipulation Automation"
    body: "The market boundary for Sharpa is defined by contact-rich manipulation and dexterous Physical AI rather than traditional fixed industrial automation. Conventional industrial robotics relies on deterministic workcells, hard tooling, and structured environments, which structurally excludes dynamic commercial spaces and delicate human-scale tasks. Sharpa develops general-purpose humanoid robots and anthropomorphic end-effectors engineered to complete unassisted shifts without requiring facility retrofits or customized physical workcells. Included addressable spend encompasses embodied AI hardware, high-degree-of-freedom tactile hands, humanoid platforms, and multimodal foundation model licenses. Excluded spend encompasses traditional fixed single-axis arms, rigid conveyor infrastructure, and computer-vision-only inspection systems."
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001
  - id: "market-sizing-and-tam-lenses"
    title: "TAM, SAM, and Evidence-Constrained Sizing Lenses"
    body: "Evaluating the total addressable opportunity for dexterous manipulation requires multi-lens analysis across broad labor pools, specialized hardware markets, and commercial service workflows. While theoretical physical labor substitution across retail, hospitality, food service, and light manufacturing represents a multi-trillion-dollar macroeconomic market, near-term addressable spend is constrained by manufacturing costs, component availability, and manipulation reliability. In the near term, component-level adoption among robotics OEMs and embodied AI research teams represents a serviceable obtainable market measured in hundreds of millions of dollars, supported by early industrialization milestones such as Hesai shipping over 10,000 actuation modules. Commercial enterprise pilots in quick-service restaurants demonstrate early expansion into operational store workflows."
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: "buyer-segmentation-and-economics"
    title: "Buyer Segmentation and Commercial Adoption Path"
    body: "The commercial buyer landscape for Sharpa is bifurcated between near-term technical developer accounts and operational enterprise accounts. Research laboratories and humanoid robot OEMs purchase the 22-DoF Wave hand through engineering and procurement budgets to accelerate physical intelligence research and eliminate proprietary hand development cycles. In contrast, commercial enterprise customers—such as quick-service restaurant operators and retail logistics managers—evaluate complete humanoid systems on shift-level return on investment, task success rates, and direct labor offset. Budget authority in enterprise accounts sits with vice presidents of store operations and chief transformation officers rather than R&D departments. The commercial adoption path progresses from controlled single-store validation trials toward multi-unit franchise fleet rollouts."
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
    tableRefs:
      - TM003
  - id: "growth-drivers-and-adoption-constraints"
    title: "Growth Drivers, Diligence Gaps, and Adoption Constraints"
    body: "Adoption of dexterous manipulation systems is propelled by persistent service labor shortages, rising hourly wages, and rapid progress in multimodal tactile foundation models. The ability to deploy autonomous humanoids directly into existing commercial layouts without costly building retrofits offers a compelling efficiency catalyst for high-turnover service sectors. However, critical adoption constraints remain unresolved. Independent operational data regarding mean time between failures, peak-hour human intervention frequencies, task completion speed, and ongoing maintenance expenditures remain completely unverified across multi-week commercial deployments. Furthermore, scaling production depends on supplier manufacturing yields for high-torque compact actuators. Prospective enterprise buyers and investors must weigh early commercial headlines against the current scarcity of long-term operational reliability metrics."
    claimRefs:
      - CM011
      - CM012
      - CM013
