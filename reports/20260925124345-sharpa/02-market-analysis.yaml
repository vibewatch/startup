callouts:
  - calloutType: insight
    title: "The Zero-Retrofit Imperative in Commercial Physical AI"
    body: "Sharpa's primary market differentiation hinges on operating in human environments without physical facility redesign. While fixed automation delivers high speed, retrofitting existing restaurant kitchens or retail stores entails prohibitive capital costs, making brownfield software-and-hardware compatibility the decisive buying criterion."
    claimRefs:
      - CM003
      - CM004
  - calloutType: risk
    title: "Unverified Shift-Level Reliability and Intervention Rates"
    body: "While real commercial deployments like Dairy Queen's Shanghai store prove technical capability across 55-step workflows, independent datasets verifying intervention frequencies, uptime, and maintenance economics over continuous operating months remain completely unavailable."
    claimRefs:
      - CM012
      - CM013
