    title: "The Last-Millimeter Tactile Control Advantage"
    body: "Sharpa's asynchronous architecture decouples high-level 1 Hz reasoning from 100 Hz System 0 tactile control, addressing the core failure mode of vision-only manipulation models that cannot sense slip or modulate contact force in real time."
    claimRefs:
