chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sharpa develops an integrated physical and cognitive robotics stack centered on the 22-DoF Sharpa Wave tactile hand and the hierarchical CraftNet VTLA foundation model. By coupling high-density fingertip tactile sensing with an asynchronous 100 Hz interaction loop, the company addresses the 'last-millimeter' manipulation challenge that limits conventional vision-only robotic architectures."
sections:
  - id: "product-definition-and-hardware-stack"
    title: "Product Definition and Physical Hardware Stack"
    body: "Sharpa delivers a vertically integrated embodied AI hardware and software platform designed to solve dexterous manipulation in human-centric operating environments. At the physical layer, the company's core commercial offering is the Sharpa Wave robotic hand, which features 22 active degrees of freedom and human-scale anthropomorphic geometry. Each fingertip integrates a proprietary Dynamic Tactile Array providing over 1,000 tactile sensing pixels and 5 mN pressure sensitivity, enabling sensitive closed-loop force modulation. The Wave hand achieved mass production status in October 2025 and received a CES 2026 Innovation Award. Upward from the hand, Sharpa has introduced the North full-body humanoid robot, a 67-DoF mobility and manipulation platform currently undergoing commercial pilot trials in retail and service workflows such as ice cream preparation."
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE010
    tableRefs:
      - TE001
  - id: "craftnet-vtla-architecture"
    title: "CraftNet VTLA Architecture and High-Frequency Control"
    body: "To power its physical manipulation hardware, Sharpa created CraftNet, an end-to-end hierarchical Vision-Tactile-Language-Action foundation model structured around a three-tier cognitive and motor hierarchy. System 2 serves as the reasoning brain, executing at approximately 1 Hz using an open-source vision-language model to interpret human semantic instructions, decompose long-horizon goals, and plan spatial operations. System 1 functions as the motion brain, running at 10 Hz to generate gross trajectory paths and pre-contact upper-body and hand configurations. Crucially, System 0 operates as the high-speed interaction brain at 100 Hz, consuming continuous tactile and proprioceptive telemetry to govern the 'last-millimeter' contact phase. When fine-grained physical execution encounters unexpected resistance, System 0 back-propagates state updates to System 1 to adjust physical intent in real time."
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE014
    figureRefs:
      - FE001
  - id: "developer-ecosystem-and-software-tools"
    title: "Developer Ecosystem, Integration, and Simulation Tools"
    body: "Sharpa provides developers and robotics integrators with an open software ecosystem to bridge laboratory simulation and physical robotic deployment. The open-source Sharpa Wave SDK delivers native C++ and Python runtime libraries, device drivers, and communication headers for integrating Wave hardware into existing ROS and custom robotic control stacks. Complementing the SDK, Sharpa Pilot provides an administrative application for device configuration, operational health monitoring, and firmware deployment. For model training and simulation, Sharpa publishes kinematic URDF, USD, and XML simulation assets alongside reinforcement learning environments in NVIDIA Isaac Lab. This infrastructure allows practitioners to simulate contact dynamics and retarget human teleoperation trajectories using sensorized gloves before deploying fine manipulation policies onto physical robot hardware."
    claimRefs:
      - CE006
      - CE007
      - CE011
    tableRefs:
      - TE002
  - id: "operational-risks-and-engineering-tradeoffs"
    title: "Operational Dependencies, Reliability, and Engineering Risks"
    body: "Despite promising architectural innovations in tactile-first autonomy, Sharpa faces significant technical, operational, and supply chain dependencies that warrant rigorous diligence. High-resolution tactile arrays rely on specialized elastomer membranes and micro-sensor matrices that are inherently vulnerable to physical friction, shear fatigue, and thermal drift during continuous multi-shift industrial duty cycles. Sensor degradation or loss of calibration in System 0 directly impairs fine-motor force modulation, creating operational risks of dropped objects or excessive contact pressure. Furthermore, while the company actively recruits specialized engineering talent across AI and commercial robotics, scaling real-world deployments requires robust continuous telemetry, field servicing infrastructure, and deterministic safety mechanisms to prevent human injury in collaborative service environments."
    claimRefs:
      - CE012
      - CE013
    tableRefs:
      - TE003
