chapter:
  number: 6
  title: "Customers"
  summary: "Sharpa's commercial customer traction is centered on early flagship pilots with enterprise operators like Dairy Queen China and government testbeds including Singapore's Punggol Digital District and A*Star. While academic and AI developer communities actively validate its 22-DoF Wave hand for contact-rich manipulation benchmarks, the company has not yet generated commercial revenue and faces adoption friction from high hardware costs, physical training data bottlenecks, and multi-vendor system integration."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: >
      Sharpa's early commercialization strategy addresses four distinct buyer and user segments: commercial retail and services operators, smart city and public infrastructure agencies, academic robotics research laboratories, and AI/developer platform partners. In retail and food service, franchise owners and store operations leaders seek automated physical manipulation to alleviate chronic service labor shortages without altering standard counter equipment. In public infrastructure, government agencies such as Singapore's JTC Corporation and maritime authorities evaluate autonomous mobile fleets for public district maintenance and container port handling. Academic laboratories represent an immediate evaluation segment, procuring hardware to test novel reinforcement learning frameworks for tactile dexterity. Finally, embodied AI developers and simulation platform vendors integrate the Wave hand as a reference benchmark for foundation models and simulation-to-real transfer.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Benchmarks, and Deployment Scale"
    body: >
      Sharpa's deployment trajectory has transitioned from isolated robotic hand hardware evaluations to integrated multi-robot district pilots in 2026. The company debuted its autonomous North humanoid robot in early 2026 and quickly secured high-visibility deployments across varied operational settings. Benchmarks conducted across academic and industrial partner environments demonstrate meaningful operational advantages over conventional parallel grippers. In collaborative research with NVIDIA on the ADEPT framework, tactile-reactive policies using the Sharpa Wave achieved an 80% success rate on contact-rich assembly trials compared to only 30% for vision-only baselines, while reducing peg-insertion task completion times from 20 to 70 seconds down to 5 to 10 seconds. These performance multiples validate the mechanical advantage of 22 active degrees of freedom, although commercial fleet utilization metrics remain closely guarded.
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-evidence-and-pilot-outcomes"
    title: "Named Customer Proof and Pilot Deployments"
    body: >
      Sharpa has established named pilot deployments across enterprise retail, municipal infrastructure, and maritime logistics. Dairy Queen China has partnered with Sharpa to deploy the North humanoid robot in a Shanghai retail store to perform real-time soft-serve ice cream preparation alongside human kitchen staff. In Singapore, JTC Corporation has contracted Sharpa to deploy a fleet of North robots across retail, food and beverage, and logistics environments throughout the 50-hectare Punggol Digital District, supported by an on-site corporate innovation lab. In heavy industrial logistics, Sharpa is collaborating with the A*Star Institute for Infocomm Research on automated container handling, focusing on high-risk twist-lock coning and deconing at container shipping terminals. Concurrently, academic institutions including Nanyang Technological University and MIT have demonstrated complex industrial gear meshing and zero-shot tool manipulation using the Wave hardware.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics, Commercial Conversion, and Concentration Risks"
    body: >
      Despite rapid pilot momentum, Sharpa remains pre-revenue and faces acute customer concentration and commercial durability challenges. Current enterprise customer deployments represent pilot demonstrations and subsidized public infrastructure initiatives rather than recurring enterprise software or hardware subscription contracts. Logistics and industrial executives exhibit hesitation toward multi-year commitments due to expected hardware commoditization and the unresolved friction of integrating general-purpose humanoids into legacy brownfield warehouse management systems. Furthermore, Sharpa's commercial visibility is heavily concentrated in Singapore government-supported ecosystems and single-store brand demonstrations, leaving long-term net revenue retention, hardware maintenance unit economics, and multi-site expansion velocity unproven.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
