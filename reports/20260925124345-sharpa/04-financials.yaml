chapter:
  number: 4
  title: "Financials"
  summary: "Sharpa raised $669 million in August 2026 at a reported $3.3 billion post-money valuation, while an independent sector profile still describes the company as pre-revenue. Its Shanghai Dairy Queen deployment establishes a live commercialization test, but pricing, unit volumes, gross margin, burn, cash balance, runway, and customer payback remain undisclosed."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model and Monetization Strategy"
    body: "Public evidence supports only a narrow revenue-model conclusion. Multiples classifies Sharpa's model as product sales, while The Frontier of Embodied AI states that the company has not yet generated revenue. The August 2026 North deployment at a Shanghai Dairy Queen store is therefore better treated as commercialization evidence than as evidence of recognized revenue. No retained source discloses a signed contract value, unit shipment count, list price, realized average selling price, subscription fee, maintenance charge, or revenue-recognition policy. Direct hardware sales are the only externally classified stream; restaurant-deployment revenue and any software or service component remain underwriting hypotheses that must be excluded from the base case until contracts or invoices are reviewed."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure, Gross Margins, and Unit Economics"
    body: "Sharpa's cost structure cannot be quantified from the assigned public evidence. The Wave hand's 22 degrees of freedom and more than 1,000 tactile-sensing pixels per fingertip indicate a component-dense product, and RoboMorrow reports that supplier Hesai provides actuation modules to Sharpa. The Dairy Queen deployment executes a 55-step workflow in existing store equipment, but no retained source provides bill of materials, actuator pricing, manufacturing yield, installation labor, warranty reserves, field-service cost, power use, or depreciation assumptions. RoboMorrow also identifies the missing operating variables directly: success rate, human interventions, order cycle time, uptime, mean time between failures, and full-shift economics. Until those inputs are observed over multiple stores and reconciled to realized customer pricing, neither gross margin nor customer payback is supportable."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy and Financing Dependency"
    body: "Multiples reports $784 million of cumulative funding across three rounds, and MarketScreener reports that the August 28, 2026 financing issued convertible preferred stock, raised $669 million, and set a $3.3 billion post-money valuation. Those financing proceeds demonstrate access to capital but do not establish current cash on hand or runway: the evidence provides no closing cash balance, monthly burn, restricted-cash terms, debt, project finance, capital commitments, or planned use-of-funds schedule. LinkedIn presents Sharpa as a 51-200 employee company, while the official careers page lists three AI engineering openings, two commercial openings, and one internship. These are operating-scale signals, not a basis for estimating burn. Management accounts and financing documents are required to determine whether the round funds commercialization through a next-round milestone."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI010"
      - "CI011"
      - "CI012"
  - id: "financial-verdict-and-underwriting-risks"
    title: "Financial Verdict and Underwriting Diligence Blockers"
    body: "The financial verdict is evidence-constrained rather than revenue-constrained alone. A $3.3 billion post-money valuation and a $669 million financing create substantial expectations, yet the retained evidence does not demonstrate revenue, realized pricing, repeat orders, or positive unit contribution. The strongest commercial proof is one operating restaurant workflow; the strongest adverse evidence says its intervention rate, cycle time, uptime, reliability, and shift economics are still unknown. The investment case therefore depends on converting technical performance into repeatable deployments before capital consumption outruns validation. Underwriting should remain conditional on audited revenue, cohort-level deployments, customer contracts, bill-of-materials and service-cost detail, cash and burn statements, financing obligations, and a board-approved plan tying the next financing trigger to measurable gross-margin and reliability milestones."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI008"
      - "CI013"
      - "CI014"
