company:
  name: "Sharpa"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Sharpa's highest residual risks are operational reliability and safety in a
    live food-service deployment, followed by immature public evidence on
    cybersecurity, compliance, field durability, and partner concentration.
    Large reported financing reduces near-term funding pressure but raises the
    execution bar while revenue, unit economics, and preference terms remain
    undisclosed.
sections:
  - id: "priority-risk-profile"
    title: "Priority risk profile"
    body: >-
      The risk posture is high because Sharpa is moving a young, full-stack
      robotics platform from demonstrations into a customer-facing workplace
      before publishing the operating evidence normally needed to underwrite
      safety, reliability, and service economics. Independent reporting says
      intervention rate, cycle time, uptime, mean time between failures, and
      full-shift economics remain unknown. Dense tactile hardware also creates
      a durability burden, while a reported $3.3 billion post-money valuation
      and no reported revenue make execution shortfalls economically material.
      The heatmap therefore ranks deployment reliability and human safety above
      financing risk, with cybersecurity and supplier dependence close behind.
    claimRefs: [CR001, CR003, CR006, CR009, CR010, CR016]
    figureRefs: [FR001]
  - id: "regulatory-legal-and-safety"
    title: "Regulatory, legal, and safety exposure"
    body: >-
      The assigned public evidence does not establish machinery or workplace
      safety certification, food-handling approvals, privacy controls, incident
      history, litigation status, or an insurance and product-liability
      framework. This is an evidence gap rather than proof of noncompliance, but
      it is decision-relevant because North is described as operating around
      real customers, food, powered joints, cameras, and networked AI systems.
      Before investment, counsel and an independent safety engineer should map
      each operating jurisdiction, obtain the safety case and incident log, and
      verify that emergency-stop, safe-state, hygiene, privacy, and update
      controls have been validated for the actual DQ deployment.
    claimRefs: [CR002, CR004, CR005, CR015, CR016]
    tableRefs: [TR001]
  - id: "operational-quality-and-security"
    title: "Operational, quality, and security risk"
    body: >-
      North's claimed 50-to-60-step workflow creates many opportunities for
      compounding errors, yet no public multi-day reliability dataset was found.
      Sharpa's tactile-first architecture may improve manipulation, but
      fingertip wear, calibration drift, cleaning, misgrasps, and actuator
      faults can turn capability into a service burden. The company also depends
      on a mixed hardware and software stack whose cybersecurity failures could
      become physical failures. The minimum mitigation package is a dated
      field-performance dataset, component life testing, fault-tree and hazard
      analysis, signed-update and network-isolation controls, rollback
      procedures, spares commitments, and independently witnessed acceptance
      tests under peak operating conditions.
    claimRefs: [CR002, CR003, CR005, CR006, CR011, CR014]
    tableRefs: [TR002]
  - id: "partners-financing-and-execution"
    title: "Partner, financing, and execution dependencies"
    body: >-
      Sharpa's commercial proof is concentrated in the DQ workflow described by
      the company, while critical components and platform credibility depend on
      counterparties such as Hesai, NVIDIA, and Unitree. Hesai reports production
      scale but does not disclose the Sharpa allocation, pricing, field failure
      rates, or duty-cycle life, leaving supply continuity and quality exposure
      unresolved. Reported funding provides substantial capacity, but preferred
      securities, a multibillion-dollar valuation, no reported revenue, and
      undisclosed burn or gross margin create financing-model risk. Investment
      diligence should therefore test alternative suppliers, contract rights,
      customer concentration, runway, liquidation preferences, and the budget
      required to support deployed robots.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR015]
    tableRefs: [TR003]
  - id: "mitigations-monitors-and-kill-criteria"
    title: "Mitigations, monitors, and thesis-break triggers"
    body: >-
      The investable path is milestone-gated rather than narrative-gated.
      Monitor autonomous completion rate, human interventions per order,
      safety-stop frequency, cycle time, uptime, component replacement rate,
      service cost per robot, security incidents, customer renewals, and cash
      burn against plan. Pause deployment if a safety-critical fault recurs
      without verified root-cause closure, if operation requires undisclosed
      continuous human control, or if the company cannot produce jurisdictional
      compliance and cybersecurity evidence. The thesis breaks if sustained
      field reliability remains below the customer's labor and throughput
      threshold, if a critical supplier cannot be substituted, or if capital
      needs rise without commensurate paid utilization.
    claimRefs: [CR003, CR004, CR005, CR006, CR011, CR016]
