evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: governance
    missingEvidence: >-
      Formal corporate registry filing or board roster clarifying executive versus non-executive status of co-founders
      Li Yifan, Xiang Shaoqing, and Sun Kai.
    whyItMatters: >-
      Key-person dependency and day-to-day operational execution cannot be definitively evaluated without resolving
      whether founders hold full-time executive roles or advisory board positions.
    diligencePath: >-
      Obtain ACRA corporate profile in Singapore and Shanghai enterprise registry records to audit statutory officer and
      director appointments.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Audited financial statements, unit economics, hardware gross margins, and multi-week operational MTBF datasets for
      retail and research deployments.
    whyItMatters: >-
      Validating whether the $3.3 billion valuation is sustainable requires empirical proof of repeatable commercial
      unit economics and contract revenue.
    diligencePath: >-
      Request customer deployment telemetry from CFB/Dairy Queen pilot, actuator Bill of Materials breakdown, and
      current GAAP financial statements in management diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-reliability-economics
    missingEvidence: >-
      Multi-week independent audit data on Dairy Queen Blizzard preparation MTBF, task failure rate, intervention
      frequency, and fully loaded shift labor replacement economics.
    whyItMatters: >-
      Without verified uptime and intervention figures, enterprise buyers cannot substantiate payback timelines or
      evaluate labor substitution ROI.
    diligencePath: >-
      Request longitudinal shift logs, maintenance incident logs, and customer intervention telemetry from pilot
      franchise partners.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-and-commercial-terms
    missingEvidence: >-
      Publicly verified list pricing and unit contract terms for commercial deployments of SharpaWave hands and North
      humanoid systems.
    whyItMatters: >-
      Without verified pricing tiers, total cost of ownership cannot be directly benchmarked against industrial parallel
      grippers or alternative humanoid platforms.
    diligencePath: >-
      Obtain customer procurement schedules, pilot deployment agreements, or channel reseller quotations during
      commercial due diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-unit-economics
    missingEvidence: Verified data on hardware production BOM, customer contract pricing, and Blizzard robot uptime.
    whyItMatters: Without unit economics or gross margins, underwriting commercial scalability and payback period is impossible.
    diligencePath: Request customer pilot performance logs, realized hardware cost sheets, and service contracts under NDA.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: cash-burn-and-runway
    missingEvidence: Detailed monthly operating burn rate, capital expenditure schedule, and net cash balances.
    whyItMatters: Determines exact runway duration and capital depletion timing under accelerated engineering expansion.
    diligencePath: Review unaudited management financial accounts and 2026-2027 pro-forma operating budget.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: tactile-sensor-reliability
    missingEvidence: >-
      Empirical reliability data, mean time between failures (MTBF), and wear degradation metrics for the Dynamic
      Tactile Array under continuous multi-shift operations.
    whyItMatters: >-
      High-density tactile arrays on robotic fingertips are subject to friction and shear stress; rapid sensor
      degradation would increase maintenance overhead and disrupt commercial deployments.
    diligencePath: >-
      Request accelerated lifecycle testing reports and sensor replacement cycle schedules from Sharpa's engineering
      team during technical diligence.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited figures for commercial customer retention, net revenue retention (NRR), and contract renewal rates across
      enterprise accounts.
    whyItMatters: >-
      Without production renewal data, it is impossible to verify whether early customer deployments represent durable
      long-term software/hardware contracts or one-off subsidized pilots.
    diligencePath: >-
      Request customer cohort schedules, pilot-to-production conversion rates, and master service agreements during
      management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: Comprehensive registry of all customer accounts, research institution licenses, and commercial pilot contracts.
    whyItMatters: >-
      Public disclosure is limited to flagship demonstration pilots and academic partner announcements, leaving total
      deployment scale unverified.
    diligencePath: Review full customer account list, active unit counts, and pipeline pipeline stages under NDA.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: blocking
    topic: regulatory-evidence
    missingEvidence: >-
      Jurisdiction-specific licenses, safety certifications, food-handling approvals, litigation searches, enforcement
      records, and product-liability coverage.
    whyItMatters: >-
      A live food-service humanoid creates physical, hygiene, privacy, and liability exposures that cannot be priced
      from product claims.
    diligencePath: >-
      Obtain counsel's jurisdiction map, regulator and court searches, certification files, insurance schedules,
      incident history, and an independent safety assessment.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: field-reliability
    missingEvidence: >-
      A multi-week field dataset covering completed orders, interventions, cycle time, uptime, MTBF, safety stops,
      component replacements, and service cost.
    whyItMatters: >-
      Without denominator-based operating data, commercial autonomy and deployment economics cannot be distinguished
      from a supervised pilot.
    diligencePath: >-
      Review raw timestamped robot and point-of-sale logs, reconcile them to staffing records, and commission an
      independently witnessed endurance test.
    relatedQuestionRefs:
      - QR004
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: cybersecurity
    missingEvidence: >-
      Sharpa-specific threat model, penetration-test results, data-flow map, update-signing design, access controls,
      vulnerability process, and incident register.
    whyItMatters: A software compromise can expose customer data or cause unsafe physical motion.
    diligencePath: >-
      Commission architecture review and red-team testing; verify network isolation, offline operation, signed updates,
      least privilege, safe rollback, and disclosure SLAs.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Audited revenue, burn, runway, gross margin, bill of materials, service cost, customer concentration, cap table,
      and liquidation-preference terms.
    whyItMatters: Reported financing and valuation do not establish sustainable unit economics or downside protection.
    diligencePath: >-
      Review audited financials, monthly cash bridge, unit economics by deployed robot, signed customer contracts, cap
      table, and financing documents.
    relatedQuestionRefs:
      - QR007
      - QR010
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: revenue-and-unit-economics
    missingEvidence: Independent audited unit economics and commercial contract values for retail and restaurant deployments.
    whyItMatters: >-
      Essential to justify the $3.3 billion valuation multiple and calculate true gross margins on robot-as-a-service
      hardware.
    diligencePath: >-
      Request customer contract terms, SLA uptime data, and bill of materials (BOM) cost schedules during technical and
      commercial diligence.
    relatedQuestionRefs:
      - QV009
