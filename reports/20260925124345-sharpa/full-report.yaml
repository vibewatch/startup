  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Sharpa's core investment thesis rests on its pioneering tactile-first Physical AI architecture, anchored
              by the mass-produced 22-DoF SharpaWave hand and proprietary CraftNet foundation model. Unlike vision-only
              robotics platforms, Sharpa's high-resolution tactile sensors provide millinewton-level pressure
              sensitivity, enabling contact-rich manipulation in unstructured commercial settings without requiring
              facility retrofits. Backing from tier-one strategics—including Alibaba, Meituan, Tencent, and
              JD.com—provides distribution pipelines into logistics and retail. Conversely, the anti-thesis highlights
              that Sharpa has not yet generated commercial revenue and operates in a capital-intensive hardware domain
              with long payback horizons. The deployment at Dairy Queen serves as a visible demonstration, but long-term
              maintenance economics, field intervention rates, and customer willingness to pay at scale remain unproven.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: Financing Context and Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              In August 2026, Sharpa disclosed more than RMB 4.5 billion (approximately $668M to $669M) in cumulative
              financing, closing a round of convertible preferred stock that established a post-money valuation of RMB
              22 billion ($3.3 billion). This transaction included leading institutional and corporate investors such as
              HongShan, Qiming Venture Partners, and Meituan DragonBall. At $3.3 billion post-money, Sharpa's private
              valuation reportedly surpasses that of Hesai Technology, the publicly listed lidar company founded by
              Sharpa's leadership team. When benchmarked against global embodied AI peers such as Figure AI and
              independent component specialists like LinkerBot, Sharpa commands a premium multiple driven by China
              strategic backing and perceived hardware defensibility, though public financial market comps trade at
              significantly lower revenue multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Valuation Scenarios and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario analysis highlights wide dispersion across potential outcomes given the binary nature of
              early-stage robotics commercialization. In the bull case, Sharpa scales its dexterous hands across OEM
              partners, deepens retail penetration across QSR chains, and reaches commercial revenue by 2028, supporting
              a $5.0B valuation exit via IPO. In the base case, Sharpa achieves specialized commercial adoption in niche
              high-value tasks but faces hardware margin compression and extended deployment cycles, supporting a flat
              $3.0B valuation. In the bear case, technical reliability bottlenecks, customer pilot churn, or competition
              from low-cost component manufacturers result in down-round risk or structured liquidation, compressing
              valuation below $1.2B. Key downside triggers include high human intervention rates during store operations
              and stalled commercial revenue conversion.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Recommendation Stance and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Based on current public evidence, we assign Sharpa a research-more recommendation with medium confidence,
              high risk rating, and a stretched valuation stance. The $3.3 billion valuation incorporates substantial
              execution perfection before commercial revenue generation or unit economic profitability is established.
              Institutional investors evaluating secondary purchases or future expansion rounds must demand rigorous
              technical and operational audit data before committing capital. Priority diligence asks include verifying
              task completion rates and mean time between failures (MTBF) during the Shanghai Dairy Queen deployment,
              auditing bill of materials (BOM) cost trajectories for the SharpaWave hand, and examining liquidation
              preference terms on the August 2026 convertible preferred round.
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline at $3.3 Billion Post-Money
            body: >-
              While Sharpa has assembled a formidable syndicate of Chinese tech strategics and demonstrated cutting-edge
              tactile dexterous manipulation, the $3.3B valuation already prices in near-flawless commercialization
              before recurring revenues have materialized.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: Operational Validation Gap in QSR Deployments
            body: >-
              The Dairy Queen Blizzard automation deployment showcases advanced contact-rich manipulation, but lack of
              transparency regarding human intervention frequency and store-level operating costs leaves commercial
              margin sustainability unresolved.
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
