              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence does not establish machinery or workplace safety certification, food-handling
              approvals, privacy controls, incident history, litigation status, or an insurance and product-liability
              framework. This is an evidence gap rather than proof of noncompliance, but it is decision-relevant because
              North is described as operating around real customers, food, powered joints, cameras, and networked AI
              systems. Before investment, counsel and an independent safety engineer should map each operating
              jurisdiction, obtain the safety case and incident log, and verify that emergency-stop, safe-state,
              hygiene, privacy, and update controls have been validated for the actual DQ deployment.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR015
              - CR016
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              North's claimed 50-to-60-step workflow creates many opportunities for compounding errors, yet no public
              multi-day reliability dataset was found. Sharpa's tactile-first architecture may improve manipulation, but
              fingertip wear, calibration drift, cleaning, misgrasps, and actuator faults can turn capability into a
              service burden. The company also depends on a mixed hardware and software stack whose cybersecurity
              failures could become physical failures. The minimum mitigation package is a dated field-performance
              dataset, component life testing, fault-tree and hazard analysis, signed-update and network-isolation
              controls, rollback procedures, spares commitments, and independently witnessed acceptance tests under peak
              operating conditions.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR011
              - CR014
      - number: '7.4'
        title: Partner, financing, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Sharpa's commercial proof is concentrated in the DQ workflow described by the company, while critical
              components and platform credibility depend on counterparties such as Hesai, NVIDIA, and Unitree. Hesai
              reports production scale but does not disclose the Sharpa allocation, pricing, field failure rates, or
              duty-cycle life, leaving supply continuity and quality exposure unresolved. Reported funding provides
              substantial capacity, but preferred securities, a multibillion-dollar valuation, no reported revenue, and
              undisclosed burn or gross margin create financing-model risk. Investment diligence should therefore test
              alternative suppliers, contract rights, customer concentration, runway, liquidation preferences, and the
              budget required to support deployed robots.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investable path is milestone-gated rather than narrative-gated. Monitor autonomous completion rate,
              human interventions per order, safety-stop frequency, cycle time, uptime, component replacement rate,
              service cost per robot, security incidents, customer renewals, and cash burn against plan. Pause
              deployment if a safety-critical fault recurs without verified root-cause closure, if operation requires
              undisclosed continuous human control, or if the company cannot produce jurisdictional compliance and
              cybersecurity evidence. The thesis breaks if sustained field reliability remains below the customer's
              labor and throughput threshold, if a critical supplier cannot be substituted, or if capital needs rise
              without commensurate paid utilization.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR016
