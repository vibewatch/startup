  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Physical Hardware Stack
        blocks:
          - type: paragraph
            body: >-
              Sharpa delivers a vertically integrated embodied AI hardware and software platform designed to solve
              dexterous manipulation in human-centric operating environments. At the physical layer, the company's core
              commercial offering is the Sharpa Wave robotic hand, which features 22 active degrees of freedom and
              human-scale anthropomorphic geometry. Each fingertip integrates a proprietary Dynamic Tactile Array
              providing over 1,000 tactile sensing pixels and 5 mN pressure sensitivity, enabling sensitive closed-loop
              force modulation. The Wave hand achieved mass production status in October 2025 and received a CES 2026
              Innovation Award. Upward from the hand, Sharpa has introduced the North full-body humanoid robot, a 67-DoF
              mobility and manipulation platform currently undergoing commercial pilot trials in retail and service
              workflows such as ice cream preparation.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
      - number: '5.2'
        title: CraftNet VTLA Architecture and High-Frequency Control
        blocks:
          - type: paragraph
            body: >-
              To power its physical manipulation hardware, Sharpa created CraftNet, an end-to-end hierarchical
              Vision-Tactile-Language-Action foundation model structured around a three-tier cognitive and motor
              hierarchy. System 2 serves as the reasoning brain, executing at approximately 1 Hz using an open-source
              vision-language model to interpret human semantic instructions, decompose long-horizon goals, and plan
              spatial operations. System 1 functions as the motion brain, running at 10 Hz to generate gross trajectory
              paths and pre-contact upper-body and hand configurations. Crucially, System 0 operates as the high-speed
              interaction brain at 100 Hz, consuming continuous tactile and proprioceptive telemetry to govern the
              'last-millimeter' contact phase. When fine-grained physical execution encounters unexpected resistance,
              System 0 back-propagates state updates to System 1 to adjust physical intent in real time.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE010
              - CE014
      - number: '5.3'
        title: Developer Ecosystem, Integration, and Simulation Tools
        blocks:
          - type: paragraph
            body: >-
              Sharpa provides developers and robotics integrators with an open software ecosystem to bridge laboratory
              simulation and physical robotic deployment. The open-source Sharpa Wave SDK delivers native C++ and Python
              runtime libraries, device drivers, and communication headers for integrating Wave hardware into existing
              ROS and custom robotic control stacks. Complementing the SDK, Sharpa Pilot provides an administrative
              application for device configuration, operational health monitoring, and firmware deployment. For model
              training and simulation, Sharpa publishes kinematic URDF, USD, and XML simulation assets alongside
              reinforcement learning environments in NVIDIA Isaac Lab. This infrastructure allows practitioners to
              simulate contact dynamics and retarget human teleoperation trajectories using sensorized gloves before
              deploying fine manipulation policies onto physical robot hardware.
            claimRefs:
              - CE006
              - CE007
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE011
      - number: '5.4'
        title: Operational Dependencies, Reliability, and Engineering Risks
        blocks:
          - type: paragraph
            body: >-
              Despite promising architectural innovations in tactile-first autonomy, Sharpa faces significant technical,
              operational, and supply chain dependencies that warrant rigorous diligence. High-resolution tactile arrays
              rely on specialized elastomer membranes and micro-sensor matrices that are inherently vulnerable to
              physical friction, shear fatigue, and thermal drift during continuous multi-shift industrial duty cycles.
              Sensor degradation or loss of calibration in System 0 directly impairs fine-motor force modulation,
              creating operational risks of dropped objects or excessive contact pressure. Furthermore, while the
              company actively recruits specialized engineering talent across AI and commercial robotics, scaling
              real-world deployments requires robust continuous telemetry, field servicing infrastructure, and
              deterministic safety mechanisms to prevent human injury in collaborative service environments.
            claimRefs:
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Last-Millimeter Tactile Control Advantage
            body: >-
              Sharpa's asynchronous architecture decouples high-level 1 Hz reasoning from 100 Hz System 0 tactile
              control, addressing the core failure mode of vision-only manipulation models that cannot sense slip or
              modulate contact force in real time.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Hardware Durability and Sensor Drift Blockers
            body: >-
              While 1,000+ tactile sensing pixels per fingertip enable delicate multi-modal interaction, high-density
              elastomer sensors face physical wear, calibration drift, and potential failure during continuous
              industrial shifts.
            calloutType: risk
            claimRefs:
              - CE002
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >
              Sharpa's early commercialization strategy addresses four distinct buyer and user segments: commercial
              retail and services operators, smart city and public infrastructure agencies, academic robotics research
              laboratories, and AI/developer platform partners. In retail and food service, franchise owners and store
              operations leaders seek automated physical manipulation to alleviate chronic service labor shortages
              without altering standard counter equipment. In public infrastructure, government agencies such as
              Singapore's JTC Corporation and maritime authorities evaluate autonomous mobile fleets for public district
              maintenance and container port handling. Academic laboratories represent an immediate evaluation segment,
              procuring hardware to test novel reinforcement learning frameworks for tactile dexterity. Finally,
              embodied AI developers and simulation platform vendors integrate the Wave hand as a reference benchmark
              for foundation models and simulation-to-real transfer.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption Trajectory, Benchmarks, and Deployment Scale
        blocks:
          - type: paragraph
            body: >
              Sharpa's deployment trajectory has transitioned from isolated robotic hand hardware evaluations to
              integrated multi-robot district pilots in 2026. The company debuted its autonomous North humanoid robot in
              early 2026 and quickly secured high-visibility deployments across varied operational settings. Benchmarks
              conducted across academic and industrial partner environments demonstrate meaningful operational
              advantages over conventional parallel grippers. In collaborative research with NVIDIA on the ADEPT
              framework, tactile-reactive policies using the Sharpa Wave achieved an 80% success rate on contact-rich
              assembly trials compared to only 30% for vision-only baselines, while reducing peg-insertion task
              completion times from 20 to 70 seconds down to 5 to 10 seconds. These performance multiples validate the
              mechanical advantage of 22 active degrees of freedom, although commercial fleet utilization metrics remain
              closely guarded.
            claimRefs:
              - CU002
              - CU005
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
