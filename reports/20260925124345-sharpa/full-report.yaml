              - CU004
              - CU005
              - CU007
      - number: '6.4'
        title: Retention Dynamics, Commercial Conversion, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Despite rapid pilot momentum, Sharpa remains pre-revenue and faces acute customer concentration and
              commercial durability challenges. Current enterprise customer deployments represent pilot demonstrations
              and subsidized public infrastructure initiatives rather than recurring enterprise software or hardware
              subscription contracts. Logistics and industrial executives exhibit hesitation toward multi-year
              commitments due to expected hardware commoditization and the unresolved friction of integrating
              general-purpose humanoids into legacy brownfield warehouse management systems. Furthermore, Sharpa's
              commercial visibility is heavily concentrated in Singapore government-supported ecosystems and
              single-store brand demonstrations, leaving long-term net revenue retention, hardware maintenance unit
              economics, and multi-site expansion velocity unproven.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Revenue Pilot Concentration and Commercial Conversion Risk
            body: >-
              Despite high-profile pilot deployments with Dairy Queen and Singapore's PDD, Sharpa has not yet generated
              commercial revenue. Early deployments are largely exploratory or subsidized testbeds rather than recurring
              commercial contracts, posing severe conversion risks if enterprise payback periods fail to justify
              hardware costs.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
              - CU014
          - type: callout
            title: Academic and Ecosystem Infiltration Preceding Enterprise Sales
            body: >-
              By partnering with NVIDIA, MANUS, NTU, and MIT, Sharpa has established its 22-DoF Wave hand as an early
              benchmark hardware platform in the embodied AI research community. This ecosystem infiltration seeds
              long-term enterprise adoption by ensuring new manipulation foundation models are trained natively on
              Sharpa hardware.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Priority risk profile
        blocks:
          - type: paragraph
            body: >-
              The risk posture is high because Sharpa is moving a young, full-stack robotics platform from
              demonstrations into a customer-facing workplace before publishing the operating evidence normally needed
              to underwrite safety, reliability, and service economics. Independent reporting says intervention rate,
              cycle time, uptime, mean time between failures, and full-shift economics remain unknown. Dense tactile
              hardware also creates a durability burden, while a reported $3.3 billion post-money valuation and no
              reported revenue make execution shortfalls economically material. The heatmap therefore ranks deployment
              reliability and human safety above financing risk, with cybersecurity and supplier dependence close
              behind.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
