  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope of Manipulation Automation
        blocks:
          - type: paragraph
            body: >-
              The market boundary for Sharpa is defined by contact-rich manipulation and dexterous Physical AI rather
              than traditional fixed industrial automation. Conventional industrial robotics relies on deterministic
              workcells, hard tooling, and structured environments, which structurally excludes dynamic commercial
              spaces and delicate human-scale tasks. Sharpa develops general-purpose humanoid robots and anthropomorphic
              end-effectors engineered to complete unassisted shifts without requiring facility retrofits or customized
              physical workcells. Included addressable spend encompasses embodied AI hardware, high-degree-of-freedom
              tactile hands, humanoid platforms, and multimodal foundation model licenses. Excluded spend encompasses
              traditional fixed single-axis arms, rigid conveyor infrastructure, and computer-vision-only inspection
              systems.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable opportunity for dexterous manipulation requires multi-lens analysis
              across broad labor pools, specialized hardware markets, and commercial service workflows. While
              theoretical physical labor substitution across retail, hospitality, food service, and light manufacturing
              represents a multi-trillion-dollar macroeconomic market, near-term addressable spend is constrained by
              manufacturing costs, component availability, and manipulation reliability. In the near term,
              component-level adoption among robotics OEMs and embodied AI research teams represents a serviceable
              obtainable market measured in hundreds of millions of dollars, supported by early industrialization
              milestones such as Hesai shipping over 10,000 actuation modules. Commercial enterprise pilots in
              quick-service restaurants demonstrate early expansion into operational store workflows.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.3'
        title: Buyer Segmentation and Commercial Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The commercial buyer landscape for Sharpa is bifurcated between near-term technical developer accounts and
              operational enterprise accounts. Research laboratories and humanoid robot OEMs purchase the 22-DoF Wave
              hand through engineering and procurement budgets to accelerate physical intelligence research and
              eliminate proprietary hand development cycles. In contrast, commercial enterprise customers—such as
              quick-service restaurant operators and retail logistics managers—evaluate complete humanoid systems on
              shift-level return on investment, task success rates, and direct labor offset. Budget authority in
              enterprise accounts sits with vice presidents of store operations and chief transformation officers rather
              than R&D departments. The commercial adoption path progresses from controlled single-store validation
              trials toward multi-unit franchise fleet rollouts.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Drivers, Diligence Gaps, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of dexterous manipulation systems is propelled by persistent service labor shortages, rising
              hourly wages, and rapid progress in multimodal tactile foundation models. The ability to deploy autonomous
              humanoids directly into existing commercial layouts without costly building retrofits offers a compelling
              efficiency catalyst for high-turnover service sectors. However, critical adoption constraints remain
              unresolved. Independent operational data regarding mean time between failures, peak-hour human
              intervention frequencies, task completion speed, and ongoing maintenance expenditures remain completely
              unverified across multi-week commercial deployments. Furthermore, scaling production depends on supplier
              manufacturing yields for high-torque compact actuators. Prospective enterprise buyers and investors must
              weigh early commercial headlines against the current scarcity of long-term operational reliability
              metrics.
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Zero-Retrofit Imperative in Commercial Physical AI
            body: >-
              Sharpa's primary market differentiation hinges on operating in human environments without physical
              facility redesign. While fixed automation delivers high speed, retrofitting existing restaurant kitchens
              or retail stores entails prohibitive capital costs, making brownfield software-and-hardware compatibility
              the decisive buying criterion.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Unverified Shift-Level Reliability and Intervention Rates
            body: >-
              While real commercial deployments like Dairy Queen's Shanghai store prove technical capability across
              55-step workflows, independent datasets verifying intervention frequencies, uptime, and maintenance
              economics over continuous operating months remain completely unavailable.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for embodied AI and physical manipulation comprises specialized dexterous hand
              manufacturers, full-body humanoid developers, and entrenched status-quo automation providers. Sharpa
              occupies a differentiated position by developing full-stack hardware and models centered around
              high-resolution tactile dexterous manipulation. Direct peers in the dexterous manipulator category include
              specialized Chinese robotics manufacturers such as Fourier Intelligence and Inspire Robots, who produce
              multi-DoF robotic end-effectors for industrial and research customers. In addition, integrated humanoid
              developers such as Unitree Robotics represent adjacent competitors, offering complete robotic platforms
              that currently prioritize locomotion and basic manipulation over high-precision tactile feedback.
              Supported by over $669 million in disclosed 2026 capital at a valuation of $3.3 billion, Sharpa has scaled
              development of its flagship 22-DoF SharpaWave hand alongside the 67-DoF North humanoid platform designed
              for commercial task execution in human service environments.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
      - number: '3.2'
        title: Capability Benchmarks and Pricing Structures
        blocks:
          - type: paragraph
            body: >-
              Evaluating manipulation performance highlights the fundamental trade-off between status-quo parallel-jaw
              grippers and multi-degree-of-freedom tactile hands. Conventional industrial automation relies on parallel
              grippers that exhibit high reliability in structured workflows but suffer from rigid alignment
              requirements. Empirical peg-insertion trials demonstrate that parallel-jaw grippers require 20 to 70
              seconds per attempt due to iterative repositioning, whereas SharpaWave completes the same task in 5 to 10
              seconds through dynamic in-hand reorientation. Furthermore, tactile feedback policies trained in
              simulation achieve an 80% task completion rate on physical hardware, compared to only 30% for vision-only
              models vulnerable to visual occlusion. From a commercial standpoint, list pricing remains closely guarded
              across private robotics vendors; dexterous hands are typically sold as premium research or enterprise
              developer kits, while full-body humanoids are deployed via custom enterprise pilot agreements rather than
              standardized catalog pricing.
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: Switching Costs, Supply Chain Dependencies, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Customer switching costs and vendor lock-in are dictated by software ecosystem integration and core
              component supply architectures. Sharpa has strategically integrated its hardware with NVIDIA's Isaac Lab
              and ADEPT reinforcement learning framework, enabling developers to transfer pre-trained dexterous
              manipulation policies directly to SharpaWave hardware with reduced simulation training steps. While
              software compatibility with standard simulation stacks lowers developer adoption hurdles, it
              simultaneously reduces long-term software switching barriers for robotic application developers. On the
              hardware supply side, key actuation modules are supplied by Hesai, which has scaled dedicated robotic
              actuator manufacturing past 10,000 units. However, Hesai also supplies lidar and actuation components to
              over 50 embodied AI robotics firms, including Unitree, Galbot, and Galaxea. This common Tier-1 supplier
              network fosters multi-homing across OEMs and prevents any single humanoid developer from monopolizing
              precision actuation components.
            claimRefs:
              - CP005
              - CP006
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP012
      - number: '3.4'
        title: Moat Durability and Commercial Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The durability of Sharpa's competitive moat depends on maintaining superior tactile foundation
              intelligence rather than proprietary mechanical hardware alone. As upstream Tier-1 component suppliers
              expand from dexterous hand actuators to standardized full-body humanoid joints, mechanical hardware
              capabilities will inevitably commoditize across competitive robotics manufacturers. Sharpa's primary
              defensive barrier therefore lies in its proprietary CraftNet vision-touch-language-action model, dynamic
              tactile sensor array, and high-frequency real-time grasp control. Significant commercialization risks
              persist: while pilot deployments such as the 55-step retail food preparation workflow at Dairy Queen
              showcase real-world applicability, independent multi-day datasets verifying mean time between failures,
              autonomous uptime, and human intervention rates remain unproven. Without demonstrated field reliability
              and favorable unit economics against low-cost human labor or dedicated fixed automation, long-term
              commercial displacement risks remain material.
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Tactile Sensing as the Core Manipulation Moat
            body: >-
              While conventional robotic automation relies heavily on computer vision and rigid parallel grippers,
              tactile intelligence substantially improves success rates in contact-rich tasks. Sharpa's engineering
              focus on fingertip dynamic tactile arrays and direct-drive actuation addresses the primary physical
              limitation preventing humanoids from performing fine motor tasks in commercial environments.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
          - type: callout
            title: Component Upstream Disintermediation and Replicability
            body: >-
              Because key actuation components are produced by Tier-1 suppliers like Hesai who also supply over 50
              competing robotics firms, mechanical hardware differentiation may erode over time. Sharpa must defend its
              position through proprietary visuo-tactile foundation models (CraftNet) and integrated deployment
              workflows rather than relying solely on proprietary hardware components.
            calloutType: risk
            claimRefs:
              - CP005
              - CP009
              - CP013
