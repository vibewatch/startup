  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer product architecture spanning hardware tactile arrays up to System 2 cognitive planning.
    data:
      layers:
        - label: Cognitive Planning Layer (System 2)
          detail: >-
            Operates at ~1 Hz using open-source VLMs to decompose complex human instructions into sequential
            manipulation steps.
        - label: Coarse Action Layer (System 1)
          detail: Runs at ~10 Hz to generate upper-body trajectories and pre-contact hand poses from multimodal inputs.
        - label: Interaction Control Layer (System 0)
          detail: >-
            Executes at ~100 Hz to process tactile feedback and modulate fine motor forces during last-millimeter object
            interaction.
        - label: Developer & Simulation Middleware
          detail: Sharpa Wave SDK, Isaac Lab tactile sensor assets, and Sharpa Pilot configuration software.
        - label: Physical Hardware Layer
          detail: Sharpa Wave 22-DoF dexterous hand and North 67-DoF full-body humanoid platform.
        - label: Sensing Subsystem
          detail: Dynamic Tactile Array providing over 1000 tactile pixels and 5 mN pressure sensitivity per fingertip.
    approximationNotes: Frequency specifications and layer definitions derived from Sharpa CraftNet whitepaper disclosures.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE014
  - id: FU001
    title: Customer journey and adoption stages
    type: journey-map
    summary: Adoption path from digital simulation and teleoperation to field pilots and enterprise fleet expansion.
    data:
      items:
        - label: 1. Virtual Simulation & Policy Training
          touchpoints:
            - Digital twin modeling inside NVIDIA Isaac Lab
            - RL dexterous manipulation policy pre-training
        - label: 2. Teleoperated Data Capture & Tuning
          touchpoints:
            - Teleoperation via MANUS motion-capture gloves
            - High-frequency tactile feedback data generation
        - label: 3. Lab Hardware Benchmark Validation
          touchpoints:
            - Benchmarking on Flexiv robotic arm and standalone Wave hand
            - Academic validation at NTU, MIT, Stanford, and Berkeley
        - label: 4. Controlled Real-World Commercial Pilot
          touchpoints:
            - Single-location demonstration deployment at DQ China store
            - Specialized retail task execution using standard equipment
        - label: 5. Multi-Environment District Testbed
          touchpoints:
            - Fleet rollout across retail, F&B, and logistics at PDD
            - Open Digital Platform integration with JTC and Grab
        - label: 6. Scaled Commercial Fleet Deployment
          touchpoints:
            - Transition from subsidized pilot to enterprise software/hardware contract
            - Commercial expansion contingent on resolving data and unit-cost hurdles
    approximationNotes: Illustrates the typical progression observed across academic, developer, and enterprise customer touchpoints.
