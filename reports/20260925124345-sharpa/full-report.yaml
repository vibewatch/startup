        title: Exhibits
        blocks:
          - type: callout
            title: Core underwriting risk
            body: >-
              The public record shows a real-world deployment claim but not the reliability, safety, intervention, or
              service-cost dataset needed to price the risk.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR016
          - type: callout
            title: Investment control
            body: >-
              Use milestone-based capital release tied to independent field reliability, safety evidence, supplier
              redundancy, paid utilization, and unit-economics disclosure.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR011
