      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Multiples reports $784 million of cumulative funding across three rounds, and MarketScreener reports that
              the August 28, 2026 financing issued convertible preferred stock, raised $669 million, and set a $3.3
              billion post-money valuation. Those financing proceeds demonstrate access to capital but do not establish
              current cash on hand or runway: the evidence provides no closing cash balance, monthly burn,
              restricted-cash terms, debt, project finance, capital commitments, or planned use-of-funds schedule.
              LinkedIn presents Sharpa as a 51-200 employee company, while the official careers page lists three AI
              engineering openings, two commercial openings, and one internship. These are operating-scale signals, not
              a basis for estimating burn. Management accounts and financing documents are required to determine whether
              the round funds commercialization through a next-round milestone.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial Verdict and Underwriting Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is evidence-constrained rather than revenue-constrained alone. A $3.3 billion
              post-money valuation and a $669 million financing create substantial expectations, yet the retained
              evidence does not demonstrate revenue, realized pricing, repeat orders, or positive unit contribution. The
              strongest commercial proof is one operating restaurant workflow; the strongest adverse evidence says its
              intervention rate, cycle time, uptime, reliability, and shift economics are still unknown. The investment
              case therefore depends on converting technical performance into repeatable deployments before capital
              consumption outruns validation. Underwriting should remain conditional on audited revenue, cohort-level
              deployments, customer contracts, bill-of-materials and service-cost detail, cash and burn statements,
              financing obligations, and a board-approved plan tying the next financing trigger to measurable
              gross-margin and reliability milestones.
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI013
              - CI014
