              - CU010
              - CU012
              - CU014
      - number: '6.3'
        title: Named Customer Proof and Pilot Deployments
        blocks:
          - type: paragraph
            body: >
              Sharpa has established named pilot deployments across enterprise retail, municipal infrastructure, and
              maritime logistics. Dairy Queen China has partnered with Sharpa to deploy the North humanoid robot in a
              Shanghai retail store to perform real-time soft-serve ice cream preparation alongside human kitchen staff.
              In Singapore, JTC Corporation has contracted Sharpa to deploy a fleet of North robots across retail, food
              and beverage, and logistics environments throughout the 50-hectare Punggol Digital District, supported by
              an on-site corporate innovation lab. In heavy industrial logistics, Sharpa is collaborating with the
              A*Star Institute for Infocomm Research on automated container handling, focusing on high-risk twist-lock
              coning and deconing at container shipping terminals. Concurrently, academic institutions including Nanyang
              Technological University and MIT have demonstrated complex industrial gear meshing and zero-shot tool
              manipulation using the Wave hardware.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
