callouts:
  - calloutType: "insight"
    title: "Tactile Sensing as the Core Manipulation Moat"
    body: "While conventional robotic automation relies heavily on computer vision and rigid parallel grippers, tactile intelligence substantially improves success rates in contact-rich tasks. Sharpa's engineering focus on fingertip dynamic tactile arrays and direct-drive actuation addresses the primary physical limitation preventing humanoids from performing fine motor tasks in commercial environments."
    claimRefs:
      - "CP002"
      - "CP010"
  - calloutType: "risk"
    title: "Component Upstream Disintermediation and Replicability"
    body: "Because key actuation components are produced by Tier-1 suppliers like Hesai who also supply over 50 competing robotics firms, mechanical hardware differentiation may erode over time. Sharpa must defend its position through proprietary visuo-tactile foundation models (CraftNet) and integrated deployment workflows rather than relying solely on proprietary hardware components."
    claimRefs:
      - "CP005"
      - "CP009"
      - "CP013"
