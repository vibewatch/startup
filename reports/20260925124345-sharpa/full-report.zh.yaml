      - number: '5.2'
        title: CraftNet VTLA 架构与高频控制系统
        blocks:
          - type: paragraph
            body: >-
              为驱动其物理操作硬件，Sharpa 开发了端到端分层视触语动（VTLA）基础模型 CraftNet，该模型依托认知与运动三层分级架构构建。System 2 作为「推理大脑」，以约 1 Hz
              的频率运行开源视觉语言模型，负责理解人类语义指令、长程目标任务拆解及空间操作规划。System 1 作为「运动大脑」，以 10 Hz
              运行以生成大范围运动轨迹以及触碰前的上半身与手部姿态构型。尤为关键的是，System 0 作为「高频交互大脑」以 100 Hz
              运行，实时接入连续触觉与本体感受遥测数据，接管「最后一毫米」接触阶段。当精细物理操作遇到非预期阻力时，System 0 会向 System 1 反向传播状态更新，实时修正物理动作意图。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE014
