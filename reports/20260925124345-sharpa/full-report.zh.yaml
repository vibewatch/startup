              - CR006
              - CR011
              - CR014
      - number: '7.4'
        title: 伙伴合作、融资及执行依赖
        blocks:
          - type: paragraph
            body: >-
              Sharpa 的商业实证高度依赖公司单方描述的 DQ 餐饮工作流，而关键零部件与平台公信力则受制于 Hesai、NVIDIA 和 Unitree 等合作方。Hesai 虽公布了产能规模，但并未披露供给
              Sharpa
              的配额、采购定价、现场故障率或作业循环寿命，供应链持续性与质量风险敞口依然未决。报道的融资规模提供了充裕的资金实力，但优先股证券、数十亿美元的高估值、未见公开收入以及未披露的烧钱率或毛利率，带来了融资模型层面的风险。因此，投资尽调应着重检验备选供应商储备、合同权益条款、客户集中度、资金跑道期、清算优先权以及维保已部署机器人所需的运维预算。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
