  - id: FI001
    title: 收入模型路径图
    type: flow
    summary: 从商业任务执行转化至企业经常性收入与毛利率的传导路径。
    data:
      nodes:
        - id: store-demand
          label: 餐饮订单需求
        - id: robot-execution
          label: North 人形机器人执行 55 步工序
        - id: raas-billing
          label: 实际结算单价 × 付费工作量
        - id: hardware-cogs
          label: 执行器与零部件主营业务成本（COGS）
        - id: field-service
          label: 维护与硬件磨损支出
        - id: net-contribution
          label: 毛利润 / 边际贡献
      edges:
        - from: store-demand
          to: robot-execution
          label: 产生任务量
        - from: robot-execution
          to: raas-billing
          label: 转化为可计费产出
        - from: robot-execution
          to: hardware-cogs
          label: 消耗硬件寿命
        - from: raas-billing
          to: net-contribution
          label: 确认收入
        - from: hardware-cogs
          to: net-contribution
          label: 扣除直接成本
        - from: field-service
          to: net-contribution
          label: 扣除日常运营开支
    approximationNotes: 本图仅为概念性投资评估测算推导；留存资料中没有任何公开来源披露 Sharpa 的实际定价、合同模式、成本分摊或毛利率。
    claimRefs:
      - CI002
      - CI005
      - CI007
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 涵盖从底层硬件触觉阵列到顶层 System 2 认知规划的六层产品架构。
    data:
      layers:
        - label: 认知规划层（System 2）
          detail: 运行频率约 1 Hz，基于开源视觉语言模型（VLM）将复杂人类指令拆解为时序操作步骤。
        - label: 粗粒度动作层（System 1）
          detail: 运行频率约 10 Hz，基于多模态输入生成上半身运动轨迹与接触前的手部姿态。
        - label: 交互控制层（System 0）
          detail: 运行频率约 100 Hz，负责处理触觉反馈，并在物体交互的最后数毫米微距内实时调节微电机输出力。
        - label: 开发者与仿真中间件
          detail: 包括 Sharpa Wave SDK、Isaac Lab 触觉传感器资产以及 Sharpa Pilot 配置软件。
        - label: 物理硬件层
          detail: 涵盖 22-DoF 自由度的 Sharpa Wave 灵巧手与 67-DoF 自由度的 North 全身人形机器人平台。
        - label: 传感子系统
          detail: 动态触觉阵列（Dynamic Tactile Array），每个指尖具备超过 1000 个触觉像素与 5 mN 的压力灵敏度。
    approximationNotes: 运行频率指标与架构分层定义均源自 Sharpa CraftNet 白皮书披露信息。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE014
  - id: FU001
    title: 客户旅程与技术采纳阶段
    type: journey-map
    summary: 展现从数字仿真与遥操作起步，逐步迈向现场试点和企业级机队规模化扩展的采纳路径。
    data:
      items:
        - label: 1. 虚拟仿真与策略训练
          touchpoints:
            - 在 NVIDIA Isaac Lab 内构建数字孪生模型
            - 强化学习（RL）灵巧操作策略预训练
        - label: 2. 遥操作数据采集与调优
          touchpoints:
            - 借助 MANUS 动捕手套开展遥操作
            - 生成高频触觉反馈数据
        - label: 3. 实验室硬件基准评测验证
          touchpoints:
            - 在 Flexiv 机械臂与独立 Wave 灵巧手上开展基准测试
            - 在 NTU、MIT、Stanford 及 Berkeley 完成学术验证
        - label: 4. 受控真实环境商业试点
          touchpoints:
            - 在 DQ 中国单家门店内进行示范部署
            - 使用标准商用设备执行专业化零售任务
        - label: 5. 多场景区域综合试验场
          touchpoints:
            - 在 PDD 展开跨零售、餐饮与物流场景的机队铺设
            - 与 JTC 及 Grab 的开放数字平台完成系统集成
        - label: 6. 规模化商业机队全面部署
          touchpoints:
            - 从补贴性质试点过渡至正式的企业级软硬件商业合同
            - 规模化商业扩张取决于能否攻克数据获取瓶颈与单机成本壁垒
    approximationNotes: 示意学术研究、开发者及企业客户接触场景中的典型递进演变过程。
    claimRefs:
      - CU007
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 基于证据权重的优先级评估表明：实际部署中的可靠性、安全性与网络安全风险居于首位，紧迫度相对较低的再融资与技术探索风险次之。
    data:
      columns:
        - 影响程度 (1-5)
        - 发生概率 (1-5)
        - 缓解措施成熟度 (1-5)
        - 剩余严重程度
      rows:
