      - number: '7.5'
        title: 缓解措施、监测指标与投资逻辑破坏触发项
        blocks:
          - type: paragraph
            body: >-
              投资路径应由里程碑把关，而不是靠叙事推动。持续跟踪自主完成率、每单人工干预次数、安全停机频率、周期时间、正常运行时间、部件更换率、单台服务成本、安全事故、客户续约，以及现金消耗是否符合计划。若安全关键故障反复出现且根因尚未查明，若运行依赖未披露的持续人工控制，或公司无法提供辖区合规与网络安全证据，就应暂停部署。若长期现场可靠性达不到客户对人力替代和吞吐量的要求、关键供应商无法替换，或资本需求上升却没有相应的付费使用量，投资逻辑就会失效。
            claimRefs:
              - CR003
