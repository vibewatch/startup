        title: 运行依赖、可靠性与工程风险
        blocks:
          - type: paragraph
            body: >-
              尽管触觉优先的自主架构展现出可观的技术创新，但 Sharpa
              面临着值得严格尽调的重大技术、运营及供应链依赖。高分辨率触觉阵列依赖专用弹性体薄膜与微传感器阵列，在多工班连续工业作业环境下天生容易受到物理摩擦、剪切疲劳及热漂移的影响。System 0
              传感器的老化退化或校准漂移会直接削弱精细动作的力度调节，造成掉落物品或接触压力过大的作业风险。此外，尽管公司在 AI
              与商用机器人领域积极招募工程专业人才，但规模化实地部署仍需要稳健的持续遥测、现场运维体系以及确定性安全机制，以防止协作服务环境中发生人员伤害。
            claimRefs:
              - CE012
              - CE013
