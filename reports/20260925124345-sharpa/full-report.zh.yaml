  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 串联资本规模、触觉硬件验证、商业试点推进以及无收入阶段估值重压，最终推导出投资立场的决策链路。
    data:
      nodes:
        - id: financing-scale
          label: 资本规模（融资 $669M，投后估值 $3.3B）
        - id: hardware-moat
          label: 硬件护城河（22-DoF 自由度 SharpaWave 灵巧手量产）
        - id: commercial-pilots
          label: 商业试点（55 步 Dairy Queen 制作工序）
        - id: revenue-overhang
          label: 零收入估值重压（截至目前已披露商业收入为零）
        - id: synthesis
          label: 尽调综合研判（技术实力强 vs 定价估值风险高）
        - id: decision-outcome
          label: 最终立场：继续研究 / 估值偏高
      edges:
        - from: financing-scale
          to: synthesis
        - from: hardware-moat
          to: synthesis
        - from: commercial-pilots
          to: synthesis
        - from: revenue-overhang
          to: synthesis
        - from: synthesis
          to: decision-outcome
    approximationNotes: 决策逻辑路径展示的是定性把关要件，而非定量评分权重。
    claimRefs:
      - CV012
      - CV013
      - CV014
