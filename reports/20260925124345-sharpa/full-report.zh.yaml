            body: >-
              Sharpa 为开发者和机器人集成商提供了开放的软件生态，搭建起实验室仿真与物理机器人部署之间的桥梁。开源的 Sharpa Wave SDK 提供原生 C++ 和 Python
              运行时库、设备驱动及通信头文件，便于将 Wave 硬件接入既有的 ROS 及定制机器人控制栈。作为 SDK 的补充，Sharpa Pilot
              提供了用于设备配置、运行状态监测及固件部署的管理应用程序。模型训练与仿真环节，Sharpa 在 NVIDIA Isaac Lab 中发布了运动学 URDF、USD 及 XML
              仿真资产，并配套提供强化学习环境。这一套基础设施使开发者能够在将精细操作策略部署至实体机器人之前，通过传感手套仿真接触动力学并重定向人类遥控操作轨迹。
