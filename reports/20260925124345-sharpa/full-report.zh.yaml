  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与物理硬件技术栈
        blocks:
          - type: paragraph
            body: >-
              Sharpa 提供软硬件垂直一体化的具身智能平台，旨在解决以人为中心的运营环境下的精细操作难题。在物理层，公司的核心商业化产品为 Sharpa Wave 仿生手，具备 22
              个主动自由度，外形按人手尺度设计。每个指尖均集成自研动态触觉阵列（Dynamic Tactile Array），提供超过 1,000 个触觉传感像素与 5 mN 的压力灵敏度，实现高灵敏度的闭环力控调节。Wave
              灵巧手于 2025 年 10 月实现量产，并获得 CES 2026 创新奖。在灵巧手之上，Sharpa 推出了 North 全尺寸人形机器人，作为一款拥有 67
              个自由度的移动与操作平台，目前正在冰淇淋制作等零售及服务场景中开展商业试点验证。
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
