  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Sharpa 的核心投资论点立足于其开创性的触觉优先物理 AI 架构，以量产的 22 自由度 SharpaWave 灵巧手与自研 CraftNet 基础模型为支柱。不同于纯视觉机器人平台，Sharpa
              的高分辨率触觉传感器具备毫牛级压力灵敏度，使其无需改造场地，也能在非结构化商业环境中完成接触密集型操作。Alibaba、Meituan、Tencent 及 JD.com
              等一线产业资本的加持，为其开拓物流与零售分发渠道铺平了道路。相反，反向论点强调 Sharpa 尚未产生商业化收入，且身处资本密集、投资回收期长的硬件赛道。Dairy Queen
              的落地展现了出色的演示效果，但长期维护成本、实地干预率以及客户规模化付费意愿均未经验证。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: 融资背景与对标参照
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月，Sharpa 披露累计融资超 RMB 4.5 billion（约合 $668M 至 $669M），完成了一轮可转换优先股融资，投后估值达 RMB 22 billion（$3.3
              billion）。本轮交易吸引了 HongShan、Qiming Venture Partners 以及 Meituan DragonBall 等头部机构与产业投资方。在 $3.3 billion
              投后估值下，Sharpa 的一级市场估值据报已超越其管理团队创立的激光雷达上市公司 Hesai Technology。相较于 Figure AI 等全球具身智能同行及 LinkerBot
              等独立零部件专家，Sharpa 凭借中国产业资本背书和硬件壁垒预期享有溢价倍数，但公开金融市场的可比公司交易估值倍数显著低于此类水平。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 估值情景推演与下行情景触发项
        blocks:
          - type: paragraph
            body: >-
              考虑到早期机器人商业化落地具有二元对立的特征，情景分析显示出潜在结果的巨大离散度。在乐观情景（Bull case）下，Sharpa 将灵巧手推广至各 OEM 合作伙伴，深化在快餐连锁的零售渗透，并在 2028
              年前实现商业收入，支撑以 $5.0B 估值通过 IPO 退出。在基准情景（Base case）下，Sharpa 在高价值细分任务中实现小范围商业化，但面临硬件毛利挤压和部署周期拉长，估值维持在 $3.0B
              平盘。在悲观情景（Bear case）下，技术可靠性遭遇瓶颈、客户试点流失或面临低成本零部件厂商竞争，将引致下调轮（down-round）风险或重组清算，估值跌破
              $1.2B。核心下行触发因素包括门店运营期间居高不下的人工干预率以及商业收入转化停滞。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 投资建议与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              基于现有公开证据，我们给予 Sharpa「继续研究」的投资建议，评定为中等确信度、高风险评级，估值立场偏高。$3.3 billion
              的估值已预先计入了在产生商业收入或确立单机经济效益之前的完美执行预期。评估老股转让或后续扩张轮次的机构投资人在出资前，必须索取严格的技术与运营审计数据。重点尽调要求包括：核验上海 Dairy Queen
              部署期间的任务完成率与平均无故障时间（MTBF）、审计 SharpaWave 灵巧手的 BOM 成本演变轨迹，以及核查 2026 年 8 月可转换优先股融资的清算优先权条款。
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.5'
        title: 深度图表
        blocks:
          - type: callout
            title: $3.3B 投后估值下的估值纪律
            body: 尽管 Sharpa 汇聚了实力雄厚的中国科技产业资本，并展示了领先的触觉精细操作能力，但 $3.3B 估值已在经常性收入兑现之前，过早计入了近乎完美的商业化预期。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: 快餐场景部署中的运营验证落差
            body: Dairy Queen 暴风雪制作展示了高难度的接触密集型操作；但人工干预频率和门店运营成本尚不透明，商业利润能否持续仍无法判断。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
