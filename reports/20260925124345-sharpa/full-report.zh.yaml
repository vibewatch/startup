            body: >-
              通过与 NVIDIA、MANUS、NTU 及 MIT 建立合作，Sharpa 将其 22 自由度 Wave 灵巧手确立为具身智能科研领域的早期基准硬件平台。这种生态渗透有助于确保新型操作基座模型原生基于
              Sharpa 硬件训练，为长期企业级采购埋下伏笔。
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 核心风险画像
        blocks:
          - type: paragraph
            body: >-
              Sharpa
              的风险评级为「高」：公司正把尚处早期的全栈机器人平台从演示推向顾客实际所在的工作场所，却尚未披露评估安全、可靠性和服务经济性所需的常规运营数据。独立报道指出，其人工干预率、订单周期时间、正常运行时间、平均无故障时间和整班经济性仍属未知。高密度触觉硬件也带来耐用性挑战；加之高达
              $3.3 billion 的投后估值与零收入现状，执行层面的任何闪失都将带来实质性的财务冲击。因此，风险热图将现场部署可靠性与人身安全置于融资风险之上，网络安全与供应商依赖紧随其后。
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: 监管、法律与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              现有公开证据无法证实公司已取得机械或作业场所安全认证、食品加工许可、隐私合规管控、事故记录、诉讼情况，亦未见保险与产品责任保障框架。这反映出证据缺口，虽非违规实证，但对投资决策至关重要，因为 North
              被描述为在真实顾客、食材、动力关节、摄像头及联网 AI
              系统环绕的环境下作业。在投资落实前，法律顾问与独立安全工程师应梳理各运营司法管辖区的法规要求，调取安全论证报告与事故日志，并核实紧急制动、安全状态保持、卫生、隐私及版本更新管控措施是否已在 DQ
              实际部署中经过充分验证。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR015
              - CR016
      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              North 号称执行包含 50 至 60 个步骤的工作流，这为误差累积提供了多处隐患，而目前尚未发现公开的多日运行可靠性数据集。Sharpa
              触觉优先的架构固然有助于改善操作，但指尖磨损、校准漂移、清洁维护、抓取失误与执行器故障均可能将技术优势转化为繁重的运维负担。此外，公司依赖软硬件混合的技术栈，一旦发生网络安全漏洞便可能演化为物理安全事故。最低限度的风险对冲包应包含：带日期的实地性能数据集、零部件寿命测试、故障树与危险源分析、签名更新与网络隔离控制、版本回滚机制、备件保障承诺，以及在峰值工况下经独立见证的验收测试。
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
