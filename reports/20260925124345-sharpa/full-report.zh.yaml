figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理从创立截至 2026 年 9 月的公司治理、融资、产品及商业化关键里程碑。
    data:
      items:
        - label: 2024 年末：公司成立
          date: '2024-11-15'
          detail: Hesai 联合创始人 Li Yifan、Xiang Shaoqing 与 Sun Kai 在新加坡创立具身智能独立初创公司 Sharpa。
          tone: positive
        - label: 2025 年 10 月：SharpaWave 实现量产
          date: '2025-10-01'
          detail: 具备触觉感知能力的 22-DoF 灵巧手 SharpaWave 启动商业化量产，并被多家科研实验室采用。
          tone: positive
        - label: 2026 年 1 月：荣获 CES 创新奖
          date: '2026-01-08'
          detail: SharpaWave 斩获 CES 2026 创新奖；公司在公开展会上展示了多台机器人的连续跨班次续航能力。
          tone: positive
        - label: 2026 年 3 月：披露累计 RMB 4.5B 融资
          date: '2026-03-15'
          detail: 媒体报道披露其早期融资金额超过 RMB 4.5B，投后估值达到 RMB 22B，投资方包括 Alibaba、Tencent 及 Meituan。
          tone: positive
        - label: 2026 年 7 月：早期商业化放量与团队扩张
          date: '2026-07-15'
          detail: Sharpa 在新加坡、上海与 Mountain View 的员工规模达到 74–100+ 人；进一步深化与 NVIDIA IsaacLab 的仿真合作。
          tone: positive
        - label: 2026 年 8 月：完成 $669M 优先股融资
          date: '2026-08-28'
          detail: Sharpa 完成 $669M 可转换优先股融资，投后估值达 $3.3B，新增投资方包括 HongShan、JD.com 与 Transsion。
          tone: positive
        - label: 2026 年 8 月：上海 Dairy Queen 门店进驻部署
          date: '2026-08-29'
          detail: Sharpa North 人形机器人在上海吴江路 Dairy Queen 门店面向真实顾客开展运营，完整执行 55 步暴风雪制作工序。
          tone: positive
        - label: 2026 年 9 月：商业化与自主性受到审视
          date: '2026-09-06'
          detail: 独立分析师指出正常运行时间、MTBF 及人工干预率均未获证实，对全班次自主作业的经济性提出质疑。
          tone: adverse
    approximationNotes: 日期反映据报道的交易公告、活动发布与产品推出时间。
    claimRefs:
      - CO006
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    summary: 市场规模测算层级由宽收窄，从理论上的全球重复性体力劳动替代，逐级下收至近期硬件与核心零部件部署。
    approximationNotes: 数值综合了宏观劳动力统计数据、自下而上的机器人零部件出货量以及商业化 QSR 试点覆盖范围。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM014
    data:
      items:
        - label: 全球体力劳动自动化 TAM（$3.5T+）
          detail: 零售、酒店餐饮、轻工制造及餐饮服务领域重复性体力劳动的总体规模。
        - label: 服务与工业人形机器人系统 SAM（$35B+）
          detail: 企业对能够无人工干预连续完成数小时班次的通用机器人平台需求。
        - label: 商业化 QSR 与零售工作站 SOM（$2.5B）
          detail: 针对高客流食品制作与门店柜台任务的定向部署，涉及柔性易变形物体的抓取处理。
        - label: 具身智能触觉零部件市场（$600M）
          detail: 向机器人整机厂商直接销售高分辨率触觉手（Sharpa Wave）及执行器模块。
        - label: 学术与实验室遥操作工具（$150M）
          detail: 结合 MANUS 动捕手套、NVIDIA Isaac Lab 及专用数据采集台架的科研部署。
        - label: 初期商业试点意向订单（$30M - $50M）
          detail: 早期旗舰店实测验证项目，包括上海 Dairy Queen 暴风雪冰淇淋制作。
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: 横跨运动学灵巧度与商业部署成熟度两大维度，评估各类机器人操作替代方案的定位。
    approximationNotes: 坐标数值基于技术规格说明与已公开部署信息推导得出，属于归一化序数评估结果。
    claimRefs:
      - CP001
      - CP003
      - CP010
      - CP012
    data:
      points:
        - label: Sharpa Wave 与 North
          x: 8.5
          'y': 6
        - label: Fourier Intelligence
          x: 6
          'y': 7
        - label: Inspire Robots
          x: 5.5
          'y': 6.5
        - label: Unitree 人形机器人
          x: 4.5
          'y': 7.5
        - label: 工业平行夹爪
          x: 2
