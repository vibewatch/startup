chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与全球运营版图
        blocks:
          - type: paragraph
            body: >-
              Sharpa 成立于 2024 年底，是一家专注于通用机器人与触觉操作系统的具身人工智能公司。公开资料显示，其总部设在新加坡，商务运营位于 Mountain View，主要制造与研发基地设在上海
              [CO001]。MarketScreener 报道称，公司于 2026 年 8 月完成 $669 million 可转换优先股融资，投后估值为 $3.3 billion（RMB 22
              billion）[CO002]。一份未注明日期的行业资料称 Sharpa 尚未产生收入，但其实际确认收入及试点部署的经济效益均未获第三方独立证实 [CO003]。人员规模指标从 LinkedIn 关联的 74
              人到媒体报道的超 100 人不等；两者统计口径不同，并非经核实的人员区间 [CO004]。公司仍在各运营地招聘 AI 工程与商业化岗位 [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 核心管理架构与治理格局
        blocks:
          - type: paragraph
            body: >-
              公开报道将 Hesai Technology 联合创始人 Li Yifan（David Li）、Xiang Shaoqing 与 Sun Kai 列为 Sharpa 创始人，并称该项目独立于 Hesai
              [CO006]。创始团队的正式高管头衔与日常管理职责目前仍存分歧。Seedtable 将 David Li 列为首席执行官（CEO）、Xiang Shaoqing 列为首席技术官（CTO）、Sun Kai
              列为高管（Executive），而 Embodied AI Frontier 则称三位创始人均未担任高管职务
              [CO007]。所审阅资料既未解释上述分歧缘由，也未证实各创始人在产品管理与工程上的具体分工。创始人履历虽有助于战略制定与融资推进，但其实际管理权限、运营责任及企业关联仍需依赖工商登记文件与管理层核实
              [CO006, CO007]。
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历史与战略投资方银团
        blocks:
          - type: paragraph
            body: >-
              Sharpa 虽已获得风险投资机构与科技巨头的支持，但现有融资数据未能形成相互印证的融资历史。Physix Frontier 记录截至 2026 年 8 月公司累计披露融资额为 $670
              million，且未明确具体轮次，亦无带日期的种子轮及早期研发阶段明细 [CO014]。MarketScreener 则单独报道称公司于 2026 年 8 月 28 日完成 $669 million
              可转换优先股融资，投后估值为 $3.3 billion [CO002]。上述披露数据不可直接相加，亦不能将单轮融资与累计总额混为一谈。据报道，投资方包括 Alibaba、Tencent、Meituan 与
              Meituan Dragon Ball、JD.com、HongShan 以及 Luminous Ventures
              [CO008]。产业投资方的入局或能提供落地场景渠道，但投资方名单本身无法证实治理权限与客户排他性。报道还显示 Hesai 亦是其执行器供应商，该供应关系应与股权归属或控制权分别评估 [CO013]。
            claimRefs:
              - CO002
              - CO008
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO008
              - CO013
      - number: '1.4'
        title: 产品里程碑、商业试点与落地实态
        blocks:
          - type: paragraph
            body: >-
              Sharpa 的产品路线从灵巧手切入，再向整机延伸；公司优先发展接触密集型触觉操作，而非先解决全身移动 [CO009]。2025 年 10 月，旗舰产品 SharpaWave 仿生手实现量产，配有 22
              个主动自由度及触觉传感器，荣获 CES 2026 创新奖 [CO009, CO010]。依托该操作平台，Sharpa 推出全尺寸人形机器人 North，在餐饮零售场景启动商业验证 [CO011]。2026 年 8
              月 29 日，Sharpa 将 North 部署于 Dairy Queen 上海暴风雪与汉堡旗舰店，与后厨员工协同执行包含 55 个步骤的甜品制作流程
              [CO011]。然而，独立分析师严谨的技术审视指出，平均无故障时间（MTBF）、人工干预率以及真实全工班经济可行性等核心运营指标，目前均未获证实，且未经第三方独立验证 [CO012]。此次部署是 Hesai
              供应的执行器与 Sharpa 触觉基座模型在真实世界中的一次早期压力测试，而规模化商业可行性仍取决于多工况下的长期可靠性数据 [CO012, CO013]。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.5'
        title: 深度图表
        blocks:
          - type: callout
            title: 创始人背景带来的战略杠杆
            body: 创始团队在扩张 Hesai Technology 过程中积累的业绩，赋予了 Sharpa 极高的初始资金信用、机构投资人资源以及制造专长，这些优势是绝大多数早期机器人初创公司所不具备的。
            calloutType: insight
            claimRefs:
              - CO001
              - CO006
              - CO008
          - type: callout
            title: 轰动性展示背后的商业化落差
            body: 虽然 Dairy Queen 暴风雪制作等公开部署吸引了大量媒体曝光，但由于缺乏第三方验证的 MTBF、正常运行时间及干预遥测数据，其单机经济模型与全工班自主作业能力仍未经证实。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与操作自动化范畴
        blocks:
          - type: paragraph
            body: >-
              Sharpa 的市场边界由接触密集型操作与具身物理智能（Physical
              AI）定义，而非传统的固定式工业自动化。传统工业机器人依赖确定性工作站、硬质工装和结构化环境，因此难以适应动态商业空间和精细的人工作业。Sharpa
              研发通用人形机器人及拟人末端执行器，目标是在无需改造场地或定制工作站的情况下完成无人干预的整班作业。其目标市场涵盖具身 AI
              硬件、高自由度触觉手、人形机器人本体及多模态基础模型授权；明确排除传统固定式单轴机械臂、刚性输送线基础设施以及纯计算机视觉检测系统。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: TAM、SAM 与证据约束下的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              评估精细操作的潜在市场空间，需要从宏观劳动力替代、专用硬件市场及商业服务工作流等多视角进行综合分析。尽管零售、酒店餐饮及轻工制造领域的体力劳动替代构成数万亿美元的宏观市场，但中短期可触达支出受到制造成本、零部件可用性及操作可靠性的制约。短期内，机器人主机厂（OEM）与具身
              AI 研发团队的零部件采购构成数亿美元的可服务获得市场（SAM），这一判断得到 Hesai 执行器模组出货突破 10,000
              套等早期产业化节点的支撑。快餐连锁门店的商业试点则展现出向运营级门店工作流扩张的早期迹象。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.3'
        title: 买方客群细分与商业落地路径
        blocks:
          - type: paragraph
            body: >-
              Sharpa 的商业买方格局呈现分化态势，主要划分为近期的技术开发者客户与中长期的运营型企业客户。科研实验室与人形机器人 OEM 通过工程与采购预算采购 22 自由度 Wave
              灵巧手，以加速物理智能研究并规避自研灵巧手的长研发周期。相比之下，连锁快餐运营商与零售物流主管等商业企业客户，则依据工班级投资回报率（ROI）、任务成功率及直接人工替代效果来评估整机人形机器人系统。企业客户的预算决策权掌握在门店运营副总裁与首席转型官手中，而非研发部门。商业落地路径正从受控的单店验证测试向多门店加盟网络铺开演进。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动力、尽调盲区与推广约束
        blocks:
          - type: paragraph
            body: >-
              服务业长期缺工、时薪上涨，加上多模态触觉基础模型快速进步，都在推动精细操作自动化。人形机器人若无需大规模改造就能进入现有商业场所，便有望提升用工流动率较高的服务行业效率。但采用仍受几项硬约束：数周商业部署中的平均无故障时间、高峰期人工介入频率、任务完成速度和日常维护开支，均缺少经独立核实的运营数据。扩产还取决于高扭矩紧凑型执行器的制造良率。企业买方和投资人需要权衡早期商业宣传与长期可靠性数据的缺口。
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 深度图表
        blocks:
          - type: callout
            title: 商业物理 AI 中的「零场地改造」刚需
            body: >-
              Sharpa
              核心的市场差异化优势在于无需重新设计物理设施即可融入人类工作环境。固定自动化虽具备高速优势，但改造既有餐厅厨房或零售门店会产生难以承受的资本开支，使得对现有棕地软硬件环境的兼容性成为决定性的采购考量。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 工班级可靠性与干预率未经核实
            body: 虽然 Dairy Queen 上海门店等真实商业部署证实了系统在 55 步工序中的技术能力，但在连续数月的运行周期内，缺乏验证干预频率、正常运行时间及维护经济性的独立数据集。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与直接竞品画像
        blocks:
          - type: paragraph
            body: >-
              具身智能与物理操作领域的竞争格局包含专用灵巧手制造商、整机人形机器人研发商以及根基深厚的传统自动化供应商。Sharpa
              凭借围绕高分辨率触觉精细操作构建的全栈硬件与模型，占据了差异化生态位。在灵巧手细分领域，直接竞品包括 Fourier Intelligence 与 Inspire Robots
              等中国专用机器人制造商，两者均面向工业与科研客户供应多自由度末端执行器。此外，Unitree Robotics
              等一体化人形机器人研发商构成相邻竞争对手，其完整机器人平台目前优先侧重运动能力与基础操作，而非高精度触觉反馈。依托 2026 年披露的逾 $669 million 融资及 $3.3 billion
              估值，Sharpa 推进旗舰 22 自由度 SharpaWave 灵巧手与 67 自由度 North 人形机器人平台的协同研发，后者专为人类服务环境下的商业任务执行而设计。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
      - number: '3.2'
        title: 性能基准与定价体系
        blocks:
          - type: paragraph
            body: >-
              评估操作性能揭示了传统平口夹爪与多自由度触觉手之间的本质取舍。传统工业自动化依赖平口夹爪，在结构化工作流中可靠性极高，但对位精度要求极为严苛。轴孔装配实测显示，受反复重定位影响，平口夹爪每次尝试耗时 20 至
              70 秒；而 SharpaWave 凭借手内动态姿态调整，仅需 5 至 10 秒即可完成相同任务。此外，在仿真环境中训练的触觉反馈策略在物理硬件上的任务完成率达 80%，而易受视线遮挡影响的纯视觉模型仅为
              30%。商业层面上，非上市机器人企业的公开标价均高度保密；灵巧手通常作为高端科研或企业开发者套件出售，而整机人形机器人则通过定制化企业试点协议交付，而非标准化目录定价。
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: 转换成本、供应链依赖与多家共用
        blocks:
          - type: paragraph
            body: >-
              客户转换成本与供应商绑定程度取决于软件生态融合深度与核心零部件供应架构。Sharpa 在战略上将硬件与 NVIDIA 的 Isaac Lab 及 ADEPT
              强化学习框架深度集成，开发者得以缩减仿真训练周期，将预训练精细操作策略直接迁移至 SharpaWave
              硬件。软件对主流仿真技术栈的兼容固然降低了开发者的采用门槛，但同时也削弱了机器人应用开发者的长期软件转换壁垒。在硬件供应链端，核心执行器模组由 Hesai 供应，其专用机器人执行器产能已突破 10,000
              套。然而，Hesai 亦向 Unitree、Galbot 和 Galaxea 等超过 50 家具身智能机器人公司供应激光雷达与执行器部件。多个 OEM
              共用这类一级供应商网络，降低了单一人形机器人厂商垄断精密执行器的可能。
            claimRefs:
              - CP005
              - CP006
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP012
      - number: '3.4'
        title: 护城河韧性与商业替代风险
        blocks:
          - type: paragraph
            body: >-
              Sharpa
              竞争壁垒的持久性取决于其能否保持触觉基座智能的领先优势，而非仅依赖自研机械硬件。随着上游一级零部件供应商的产品线从灵巧手执行器扩展至标准化整机人形关节，机械硬件能力在各竞品机器人厂商之间将不可避免地趋于同质化。因此，Sharpa
              的核心防御屏障在于其自研的 CraftNet 视触语动（vision-touch-language-action）模型、动态触觉传感阵列以及高频实时抓握控制。显著的商业化风险依然存在：尽管 Dairy Queen
              门店 55
              步餐饮制作等试点展示了现实可用性，但验证平均无故障时间、自主运行时间及人工干预率的独立跨日数据集仍未获证实。若无法在现场可靠性与相较于低成本人工或专用固定自动化的单机经济效益上建立优势，长期的商业替代风险仍不可忽视。
