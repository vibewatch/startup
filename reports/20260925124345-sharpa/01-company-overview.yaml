company:
  name: Sharpa
chapter:
  number: 1
  title: Company Overview
  summary: Sharpa is a Singapore-headquartered embodied AI robotics startup founded in late 2024 by Hesai Technology co-founders, specializing in tactile-driven dexterous manipulation and humanoid robotics. The company closed a $669 million convertible preferred round in August 2026 at a $3.3 billion valuation with backing from Alibaba, Tencent, Meituan, JD.com, and HongShan, while operating commercial pilots such as a Dairy Queen retail food-prep deployment.
sections:
  - id: sec-identity-overview
    title: Corporate Identity and Global Operational Footprint
    body: Sharpa was established in late 2024 as an embodied artificial intelligence company focused on general-purpose robotics and tactile manipulation systems. Public profiles place its headquarters in Singapore, business operations in Mountain View, and primary manufacturing and R&D facility in Shanghai [CO001]. MarketScreener reports an August 2026 convertible preferred financing of $669 million at a $3.3 billion post-money valuation (RMB 22 billion) [CO002]. An undated sector profile describes Sharpa as pre-revenue, but current recognized revenue and the economics of its pilot deployments are not independently established [CO003]. Staffing indicators range from 74 LinkedIn-associated members to press reporting of over 100 personnel; these are differently defined public observations, not a verified headcount range [CO004]. The company continues recruiting for AI engineering and commercial roles across its locations [CO005].
    tableRefs:
      - TO001
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
  - id: sec-leadership-governance
    title: Executive Leadership Architecture and Governance
    body: Public reporting identifies Hesai Technology co-founders Li Yifan (David Li), Xiang Shaoqing, and Sun Kai as Sharpa's founders and describes the venture as independent of Hesai [CO006]. Their formal executive titles and day-to-day responsibilities remain disputed. Seedtable lists David Li as Chief Executive Officer, Xiang Shaoqing as Chief Technology Officer, and Sun Kai as Executive, while Embodied AI Frontier says none of the founders hold executive roles [CO007]. The reviewed sources do not establish the reason for this discrepancy or confirm individual product-management and engineering remits. Founder backgrounds may matter to strategy and financing, but executive authority, operating responsibility, and corporate ties require registry filings and management verification [CO006, CO007].
    tableRefs:
      - TO002
    claimRefs:
      - CO006
      - CO007
  - id: sec-capitalization-investors
    title: Capitalization History and Strategic Investor Syndicate
    body: Sharpa has attracted backing from venture investors and major technology companies, but the reviewed funding figures do not establish a reconciled financing history. Physix Frontier lists $670 million of cumulative disclosure as of August 2026, explicitly without a specified round or a dated seed and development-stage breakdown [CO014]. MarketScreener separately reports a $669 million convertible preferred round on August 28, 2026 at a $3.3 billion post-money valuation [CO002]. These disclosures must not be added together or treated as interchangeable round and lifetime totals. Reported investors include Alibaba, Tencent, Meituan and Meituan Dragon Ball, JD.com, HongShan, and Luminous Ventures [CO008]. Their participation may offer access to deployment channels, but governance rights and customer exclusivity are not established by the investor list. Hesai is also reported as an actuator supplier, creating a supply relationship that should be assessed separately from equity ownership or control [CO013].
    tableRefs:
      - TO003
    claimRefs:
      - CO002
      - CO008
      - CO013
      - CO014
  - id: sec-milestones-commercialization
    title: Product Milestones, Commercial Pilots, and Deployment Realities
    body: Sharpa's product trajectory centers on building embodied AI capabilities from the hand upward, prioritizing tactile-rich manipulation before full-body mobility [CO009]. In October 2025, the company achieved mass production of its flagship SharpaWave robotic hand, which features 22 active degrees of freedom and tactile sensors that earned the CES 2026 Innovation Award [CO009, CO010]. Building on this manipulation platform, Sharpa introduced its full-body humanoid robot, North, initiating commercial validation in retail food service [CO011]. On August 29, 2026, Sharpa deployed North at a flagship Dairy Queen Blizzard & Burgers location in Shanghai, assigning the robot to execute a 55-step dessert preparation workflow alongside human kitchen staff [CO011]. However, rigorous technical scrutiny from independent analysts emphasizes that vital operational benchmarks—such as MTBF, human intervention rates, and true full-shift economic feasibility—remain unproven and unverified by third parties [CO012]. The deployment serves as an early real-world stress test for Hesai-supplied actuators and Sharpa's tactile foundation models, but broad commercialization viability requires sustained reliability data across varied production conditions [CO012, CO013].
    figureRefs:
      - FO001
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
