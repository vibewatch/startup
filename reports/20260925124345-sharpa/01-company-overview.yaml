    title: Company milestone timeline
    type: timeline
    summary: Key corporate, financing, product, and commercial milestones from inception through September 2026.
    data:
      items:
        - label: 'Late 2024: Incorporation'
          date: '2024-11-15'
          detail: Hesai co-founders Li Yifan, Xiang Shaoqing, and Sun Kai incorporate Sharpa in Singapore as an independent embodied AI startup.
          tone: positive
        - label: 'October 2025: SharpaWave Mass Production'
          date: '2025-10-01'
          detail: Commercial production begins for SharpaWave, a 22-DoF dexterous hand featuring tactile sensing adopted by research laboratories.
          tone: positive
        - label: 'January 2026: CES Innovation Award'
          date: '2026-01-08'
          detail: SharpaWave wins the CES 2026 Innovation Award; company demonstrates multi-robot shift endurance in public exhibition.
          tone: positive
        - label: 'March 2026: Cumulative RMB 4.5B Funding Disclosure'
          date: '2026-03-15'
          detail: Media reports disclose early financing round exceeding RMB 4.5B at RMB 22B valuation, naming Alibaba, Tencent, and Meituan.
          tone: positive
        - label: 'July 2026: Early Commercial Scale & Team Growth'
          date: '2026-07-15'
          detail: Sharpa reaches 74–100+ employees across Singapore, Shanghai, and Mountain View; deepens NVIDIA IsaacLab simulation collaboration.
          tone: positive
        - label: 'August 2026: $669M Preferred Equity Financing'
          date: '2026-08-28'
          detail: Sharpa closes $669M convertible preferred round at $3.3B post-money valuation, adding HongShan, JD.com, and Transsion.
          tone: positive
        - label: 'August 2026: Shanghai Dairy Queen Store Deployment'
          date: '2026-08-29'
          detail: Sharpa North humanoid begins real customer operations at Shanghai Wujiang Road Dairy Queen executing 55-step Blizzard workflow.
          tone: positive
        - label: 'September 2026: Commercialization & Autonomy Scrutiny'
          date: '2026-09-06'
          detail: Independent analysts note unverified uptime, MTBF, and human intervention rates, questioning full-shift autonomous economics.
          tone: adverse
    approximationNotes: Dates reflect reported transaction announcements, event launches, and product rollouts.
