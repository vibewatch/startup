company:
  name: Sharpa
chapter:
  number: 1
  title: Company Overview
  summary: Sharpa is a Singapore-headquartered embodied AI robotics startup founded in late 2024 by Hesai Technology co-founders, specializing in tactile-driven dexterous manipulation and humanoid robotics. The company closed a $669 million convertible preferred round in August 2026 at a $3.3 billion valuation with backing from Alibaba, Tencent, Meituan, JD.com, and HongShan, while operating commercial pilots such as a Dairy Queen retail food-prep deployment.
sections:
  - id: sec-identity-overview
    title: Corporate Identity and Global Operational Footprint
    body: Sharpa was established in late 2024 as an embodied artificial intelligence company focused on high-performance general-purpose robotics and advanced tactile manipulation systems. Legally headquartered in Singapore, the startup maintains active business operations in Mountain View and runs its primary manufacturing and research and development facility in Shanghai [CO001]. In August 2026, Sharpa announced a major milestone by securing $669 million in convertible preferred equity financing at a post-money valuation of $3.3 billion (RMB 22 billion), cementing its status as a prominent unicorn in the Physical AI robotics ecosystem [CO002]. Despite this substantial capital capitalization, the company remains formally pre-revenue, as commercialization initiatives are still in pilot deployments [CO003]. Operational staffing has scaled quickly, with verified headcount ranging from 74 professional team members on LinkedIn to over 100 employees reported across engineering, operations, and commercial execution [CO004]. The company continues active recruiting efforts for specialized AI engineering and commercial roles across its core locations [CO005].
    tableRefs:
      - TO001
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
  - id: sec-leadership-governance
    title: Executive Leadership Architecture and Governance
    body: Sharpa's technical strategy and corporate momentum are heavily anchored by its founding leadership team, consisting of Hesai Technology co-founders Li Yifan (David Li), Xiang Shaoqing, and Sun Kai [CO006]. The trio launched Sharpa as an independent venture without binding equity relationships or operational control ties to Hesai, seeking to advance general-purpose robotics beyond pure automotive optical perception [CO006]. However, external records reveal governance nuances and conflicting reporting regarding exact executive titles and day-to-day managerial roles [CO007]. Commercial entity directories like Seedtable list David Li as Chief Executive Officer, Xiang Shaoqing as Chief Technology Officer, and Sun Kai as Executive, whereas specialized embodied AI trade publications suggest that the founders hold non-executive or advisory positions to preserve focus on their publicly listed obligations [CO007]. This leadership structure creates significant key-person reliance while highlighting the necessity for independent corporate governance verification as the startup scales its commercial presence [CO006, CO007].
    tableRefs:
      - TO002
    claimRefs:
      - CO006
      - CO007
  - id: sec-capitalization-investors
    title: Capitalization History and Strategic Investor Syndicate
    body: The capitalization history of Sharpa illustrates rapid institutional backing and exceptional investor demand across both private venture capital and major technology conglomerates [CO002]. Prior to its landmark 2026 financing, early venture disclosures indicated cumulative funding of approximately $238 million during initial seed and development phases [CO014]. On August 28, 2026, Sharpa finalized a $669 million financing round issuing convertible preferred stock at a post-money valuation of $3.3 billion [CO002]. The transaction attracted an influential consortium of strategic internet platforms and premier venture investors, including Alibaba Group Holding, Tencent Holdings, Meituan and Meituan Dragon Ball, JD.com, HongShan (formerly Sequoia China), and Luminous Ventures [CO008]. These strategic partnerships afford Sharpa access to diverse deployment environments across e-commerce logistics, cloud computing, and local retail services, though they also introduce complex cap table governance questions and potential customer exclusivity considerations [CO008]. Furthermore, Sharpa's hardware roadmap remains interlinked with Hesai as an essential supplier of specialized actuator modules, establishing an ongoing supply relationship with the founders' prior enterprise [CO013].
    tableRefs:
      - TO003
    claimRefs:
      - CO002
      - CO008
      - CO013
      - CO014
  - id: sec-milestones-commercialization
    title: Product Milestones, Commercial Pilots, and Deployment Realities
    body: Sharpa's product trajectory centers on building embodied AI capabilities from the hand upward, prioritizing tactile-rich manipulation before full-body mobility [CO009]. In October 2025, the company achieved mass production of its flagship SharpaWave robotic hand, which features 22 active degrees of freedom and tactile sensors that earned the CES 2026 Innovation Award [CO009, CO010]. Building on this manipulation platform, Sharpa introduced its full-body humanoid robot, North, initiating commercial validation in retail food service [CO011]. On August 29, 2026, Sharpa deployed North at a flagship Dairy Queen Blizzard & Burgers location in Shanghai, assigning the robot to execute a 55-step dessert preparation workflow alongside human kitchen staff [CO011]. However, rigorous technical scrutiny from independent analysts emphasizes that vital operational benchmarks—such as MTBF, human intervention rates, and true full-shift economic feasibility—remain unproven and unverified by third parties [CO012]. The deployment serves as an early real-world stress test for Hesai-supplied actuators and Sharpa's tactile foundation models, but broad commercialization viability requires sustained reliability data across varied production conditions [CO012, CO013].
    figureRefs:
      - FO001
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
