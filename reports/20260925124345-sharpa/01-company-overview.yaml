callouts:
  - calloutType: insight
    title: Strategic Leverage from Founder Pedigree
    body: The founding team's track record scaling Hesai Technology provides Sharpa with immediate capital credibility, institutional investor access, and manufacturing expertise that few early-stage robotics startups command.
    claimRefs:
      - CO001
      - CO006
      - CO008
  - calloutType: risk
    title: Commercialization Gap Behind Headline Demonstrations
    body: While public deployments like the Dairy Queen Blizzard operation generate strong media visibility, the lack of third-party verified MTBF, uptime, and intervention telemetry leaves unit economics and full-shift autonomy unproven.
    claimRefs:
      - CO011
      - CO012
