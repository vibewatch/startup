evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, voting/control rights, and any investor governance provisions after the Series B.
    whyItMatters: Governance concentration and investor control cannot be judged from founder-centric publicity alone.
    diligencePath: >-
      Request the board deck, cap table, voting agreements, and any protective-provisions summary from counsel or
      finance.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, ARR, customer count, backlog/LOIs, and headcount as of the refresh date.
    whyItMatters: >-
      Commercial traction and organizational scale are core inputs to underwriting execution speed and valuation
      support.
    diligencePath: >-
      Request the latest KPI pack, signed customer schedule, and org/headcount snapshot rather than inferring from
      market demand.
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      The full cap table, Series B terms, liquidation preferences, and whether any debt, SAFEs, or secondaries sit
      inside the public total-raised number.
    whyItMatters: >-
      Public funding totals conflict, so valuation and ownership dilution cannot be analyzed confidently from summary
      coverage alone.
    diligencePath: >-
      Request the post-money cap table, financing docs, and a reconciliation of equity, grants, and any non-primary
      proceeds.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Publicly reviewable thermal-vacuum qualification evidence, propulsion/manufacturing milestones, and the FAA
      launch-license path for the proprietary vehicle.
    whyItMatters: >-
      The architecture is thesis-rich but proof-poor, and the launch/thermal path is the main determinant of whether the
      orbital-compute story can move beyond branding and financing.
    diligencePath: >-
      Request test reports, manufacturing updates, propulsion milestones, and the current licensing workplan from
      engineering and regulatory leads.
    relatedQuestionRefs:
      - QO004
      - QO006
  - type: missing-source
    severity: material
    topic: pricing-and-demand
    missingEvidence: >-
      Named customers, LOIs, pricing, contract structure, and workload-level demand assumptions for orbital-compute
      services.
    whyItMatters: >-
      Without customer and pricing evidence, the chapter cannot convert infrastructure interest into a defendable SAM or
      SOM.
    diligencePath: >-
      Obtain customer contracts, design-partner announcements, or management disclosures tying workloads and pricing to
      specific buyer segments.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: private-evidence-only
    severity: material
    topic: thermal-and-radiation-validation
    missingEvidence: >-
      Thermal-vacuum test data, radiation-tolerance results, and optical-link throughput evidence for the disclosed 1 MW
      orbital-compute concept.
    whyItMatters: >-
      These data determine whether the stated market can be served at the reliability and density implied by the public
      narrative.
    diligencePath: >-
      Request qualification data, test reports, or third-party technical reviews covering thermal, radiation, and
      communications subsystems.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: workload-prioritization
    missingEvidence: >-
      Current customer-facing prioritization of hyperscaler, government, and space-native use cases after the May 2026
      rebrand.
    whyItMatters: >-
      The buyer map is presently inferred from public commentary rather than pinned to a disclosed go-to-market
      sequence.
    diligencePath: >-
      Review future customer announcements, procurement records, or management interviews that specify initial verticals
      and budget owners.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Customer contracts, pricing schedules, or buyer quotes for Cowboy and any direct orbital-compute alternative.
    whyItMatters: >-
      Without public packaging or realized-pricing evidence, the pricing comparison can only document disclosure gaps
      rather than economic superiority.
    diligencePath: Request current pricing cards, draft MSAs, and any pilot contract language from management or customers.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named customers, LOIs, pilot conversions, or workload categories that chose Cowboy over terrestrial or internal
      alternatives.
    whyItMatters: >-
      Competitive durability is not proven until a buyer is shown selecting the product despite launch, latency, and
      regulatory tradeoffs.
    diligencePath: Ask for signed pilots, customer references, and stage-by-stage sales pipeline data.
    relatedQuestionRefs:
      - QP008
  - type: stale
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Current public product, pricing, and go-to-market disclosures for Starcloud, Relativity Space, Orbital Inc., and
      the orbital-data-center panel cohort.
    whyItMatters: >-
      The Caplight similarity list identifies plausible peers, but it does not provide enough current operating detail
      for a normalized benchmark.
    diligencePath: >-
      Refresh peer-specific pricing, product, and regulatory evidence before the next valuation or customer chapter
      repair.
    relatedQuestionRefs:
      - QP003
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Realized pricing, billing unit, contract length, committed-volume terms, and utilization assumptions for Cowboy's
      intended compute services.
    whyItMatters: >-
      Without monetization detail, the chapter cannot translate the product concept into revenue quality or margin
      potential.
    diligencePath: >-
      Request customer contracts or term sheets, pricing decks, pipeline/backlog detail, and workload-level revenue
      assumptions from management.
    relatedQuestionRefs:
      - QI003
      - QI006
  - type: private-evidence-only
    severity: material
    topic: cost-structure
    missingEvidence: >-
      Cash balance, monthly burn, debt or project-finance obligations, satellite/launch capex assumptions, and
      gross-margin build.
    whyItMatters: >-
      The Series B amount alone does not show runway length or whether another financing event is required before
      commercial scale.
    diligencePath: >-
      Obtain current cash and burn, capex roadmap, debt schedules, and board-approved financing plan through the next
      launch milestones.
    relatedQuestionRefs:
      - QI005
  - type: conflicting-data
    severity: minor
    topic: funding
