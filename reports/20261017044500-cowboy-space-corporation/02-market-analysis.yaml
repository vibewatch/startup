  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Hyperscale capacity relief
        - Hyperscaler infrastructure organization
        - ML-platform and compute-capacity teams
        - Central data-center capex committee
        - Add capacity where terrestrial interconnection queues slow new builds
        - Infrastructure and capacity-planning leadership
        - Multi-year power, cooling, or permitting bottlenecks
      - - Government and defense resilient compute
        - Agency or prime-contractor program office
        - Mission analytics teams
        - Program budget sponsor
        - Run latency-tolerant or resilience-driven workloads in orbit
        - Mission or program manager
        - Strategic need for sovereign or hard-to-disrupt compute
      - - Space-native data processing
        - Space operator or analytics provider
        - On-orbit and ground-processing teams
        - Mission operations budget
        - Process orbital sensor or autonomy workloads closer to source data
        - Product or mission operations leader
        - High downlink cost or operational latency from Earth-only processing
      - - Scientific or disaster-response inference
        - Public-sector or research consortium buyer
        - Scientists or emergency-response analysts
        - Grant, mission, or public-purpose funding source
        - Burst inference tied to orbital sensing or remote operations
        - Program sponsor
        - Use cases where latency tolerance matters more than lowest-cost compute
    notes: >-
      Buyers, payers, and triggers are inferred from the retained sources' stated use cases and constraint
      narratives because no retained source names signed customers or commercial pricing.
    claimRefs: [CM008, CM009, CM010]
