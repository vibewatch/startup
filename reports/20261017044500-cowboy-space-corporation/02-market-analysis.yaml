    title: Public evidence supports demand pressure, not a priced market
    body: >-
      The strongest retained evidence explains why orbital compute is interesting, but no retained source
      discloses named customers, contract values, pricing, utilization assumptions, or unit economics needed
      to convert that interest into a defendable near-term SAM or SOM.
    claimRefs: [CM008, CM014]
