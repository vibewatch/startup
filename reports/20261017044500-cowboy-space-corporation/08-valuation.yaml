      - ["Risk rating", "High", "Execution depends on unproven thermal, launch, and regulatory milestones rather than incremental SaaS-like scaling."]
      - ["Valuation stance", "Stretched", "A $2B mark is real as a financing event, but public evidence does not yet justify that price on fundamentals."]
      - ["Entry discipline", "Wait for proof", "A better entry needs customer or revenue evidence, milestone delivery, or price relief versus the current mark."]
    notes: "Summary converts the public financing record and disclosed proof gaps into an entry decision; it is not a substitute for private diligence."
    claimRefs: ["CV001", "CV003", "CV004", "CV009", "CV013", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Lens"
      - "Thesis"
      - "Anti-thesis / what would change the view"
    rows:
      - ["Market driver", "AI power and interconnection constraints create a plausible macro reason to move compute off Earth.", "The view improves only if Cowboy converts that macro story into customer-backed demand rather than remaining a sector narrative."]
      - ["Capital support", "A $275M Series B at $2B led by Index shows elite investors will fund the thesis at scale.", "The view worsens if follow-on financing arrives only through flat or down terms before core milestones are met."]
      - ["Product architecture", "An integrated rocket plus 1 MW orbital data-center design could create a differentiated moat if it works.", "The view improves only after public test results and launch progress show the architecture can survive engineering reality."]
      - ["Commercial proof", "Headcount growth and hiring suggest Cowboy is staffing for rapid execution.", "The view worsens if public revenue, pilots, or named customers still do not emerge after the current milestone window."]
      - ["Regulatory / execution burden", "FCC engagement and public system detail mean Cowboy is not just pitching an abstract concept.", "The view worsens if the filing stalls, waivers are challenged, or debris/thermal concerns delay the program."]
    notes: "Rows contrast why the company could earn a premium valuation with the specific proof required before that premium becomes investable."
    claimRefs: ["CV001", "CV005", "CV006", "CV007", "CV008", "CV009", "CV010", "CV015", "CV016"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Probability signal"
    rows:
      - ["Bull", "Cowboy delivers the first demo on time, preserves the 2028 launch path, and discloses credible customer demand for orbital compute.", "Current valuation can be defended or grow because the company would be converting a speculative category into milestone-backed infrastructure optionality.", "Requires public proof on customers, technical milestones, and regulatory progress in the next cycle."]
      - ["Base", "Cowboy remains well funded and technically ambitious, but commercialization and regulatory proof arrive slower than the financing narrative.", "The current mark looks full but not necessarily broken; investors watch for evidence rather than chase price.", "Most consistent with today's mix of strong financing support and limited operating disclosure."]
      - ["Bear", "Thermal, debris, licensing, or launch execution slip materially, and commercialization remains unproven.", "The current mark is vulnerable because it already overlaps with public-space-company valuation territory without matching their operating proof.", "A flat or down round, failed demo, or regulatory setback would move this path from cautionary to active."]
    notes: "Scenarios are qualitative because public evidence does not disclose revenue, unit economics, or cap-table terms needed for precise price targets."
    claimRefs: ["CV004", "CV005", "CV006", "CV008", "CV014", "CV015", "CV016"]
