              - CR011
      - number: '7.3'
        title: Capital, counterparties, and proof points still define the kill criteria
        blocks:
          - type: paragraph
            body: >-
              The Series B meaningfully improves survivability, but it does not prove that Cowboy has closed the funding
              or demand risk for the full architecture now being discussed in public. The current record supports a
              near-term development push, not a conclusion that the company has already financed a proprietary launcher,
              orbital data-center payloads, and the infrastructure needed to scale toward a 20,000-satellite concept.
              Dependency concentration remains high around Nvidia modules, launch readiness, FCC timing, and whether
              customers will accept a service that is still pre-demonstration in public. For investment purposes, the
              cleanest kill criteria are measurable: no credible demo readout, no clear design freeze and licensing
              path, no launch-cadence plan, or no customer and financing proof as 2028 approaches.
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Cleanest thesis-break trigger
            body: >-
              If Cowboy reaches the next 12-18 months without a credible demo readout, a clearer licensing path, and
              evidence that the integrated launch-plus-compute design is closing rather than widening engineering
              unknowns, the current valuation support weakens faster than the technical story strengthens.
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR015
          - type: callout
            title: Fastest de-risking path
            body: >-
              The public record would improve materially with four disclosed milestones: post-demo mission data, updated
              FCC filings that narrow the waiver set, thermal and debris evidence at system scale, and customer or
              financing proof tied to the 2028 operating path.
            calloutType: insight
            claimRefs:
              - CR003
              - CR005
