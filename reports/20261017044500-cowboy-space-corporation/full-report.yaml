chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product ground truth
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space now presents itself as a vertically integrated orbital infrastructure company rather than
              only a space-solar-power concept. Official pages and the May 2026 financing announcement line up on the
              stable facts later chapters can reuse: the company was founded in 2024 as Aetherflux, rebranded to Cowboy
              Space on May 11, 2026, is headquartered in San Carlos with a Seattle office, and is pitching launch,
              power, and in-orbit compute as one stack. The strongest product-level ground truth is architectural, not
              commercial: the rocket upper stage is intended to become a one-megawatt data center in orbit, and NVIDIA
              is the named compute-module collaborator. That is enough to define the business model, but it is still a
              design objective rather than a demonstrated operating asset.
