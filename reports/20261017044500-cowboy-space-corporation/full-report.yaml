  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated product thesis
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space's disclosed product is not a standalone satellite bus or a conventional hosted payload.
              Company and independent sources consistently describe a vertically integrated system that combines launch
              vehicle development, in-orbit power generation, and AI compute into one architecture, with the rocket
              upper stage intended to remain in orbit as the data-center node itself. That specificity matters because
              it gives the company a concrete product definition rather than a broad market thesis: the announced
              compute partner is NVIDIA, the node target is 1 megawatt, and the same integrated vehicle is supposed to
              own both launch cadence and delivered compute. The practical implication is that product differentiation
              currently rests less on proprietary software and more on system-level integration across spacecraft,
              launch, and power delivery.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE010
