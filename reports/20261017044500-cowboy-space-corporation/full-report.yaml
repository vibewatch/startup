              - CO006
              - CO009
              - CO012
      - number: '1.4'
        title: Milestones and execution watchpoints
        blocks:
          - type: paragraph
            body: >-
              The public milestone trail is unusually compressed: Cowboy goes from a 2024 founding to seed and Series A
              financing, advisory-board additions in early 2026, a May 2026 rebrand and Series B, and then an FCC filing
              for a 20,000-satellite "Stampede" constellation within days. That sequence establishes real momentum, but
              it also pulls the key diligence question forward from "is there interest?" to "can this program execute?"
              Retained independent coverage frames the first proprietary launch as a 2028 target and repeatedly
              highlights the same unresolved proof points: thermal rejection for a one-megawatt payload in vacuum,
              debris exposure from a very large constellation, and an unfinished satellite design that still needs
              regulatory follow-through.
