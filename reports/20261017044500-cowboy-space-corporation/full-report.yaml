              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Integrated launch-plus-compute design compounds execution risk
        blocks:
          - type: paragraph
            body: >-
              Cowboy's core product architecture is also the main operational risk amplifier. Public reporting describes
              a system in which the launch vehicle upper stage becomes the one-megawatt data-center payload, so launch,
              payload, thermal rejection, and orbital operations do not de-risk independently. That can create a
              stronger moat if it works, but it also means a single schedule slip can stall multiple parts of the thesis
              at once. Independent sources still call out unresolved heat rejection in vacuum, an unfinished satellite
              design, and a first proprietary launch that is only targeted for 2028. The optical-link-heavy architecture
              reduces routine spectrum dependence, but it introduces its own availability and ground-operations
              discipline requirements, which remain mostly described in concept rather than through demonstrated
              operating data.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
