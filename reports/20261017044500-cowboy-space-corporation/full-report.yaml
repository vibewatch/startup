  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes the physical path to monetization, but pricing, contracted demand, and margin conversion
      remain undisclosed.
    data:
      nodes:
        - id: demand
          label: AI power and data-center bottleneck
          detail: Terrestrial power and grid constraints are the demand premise in the retained coverage.
        - id: integrated-vehicle
          label: Integrated launch vehicle plus compute payload
          detail: Cowboy says the rocket upper stage and data-center payload are designed as one vehicle.
        - id: orbital-node
          label: 1 MW orbital data-center node
          detail: Each upper stage is described as becoming a one-megawatt data center in orbit.
        - id: service
          label: In-orbit compute and data-processing service
          detail: Public sources describe intended AI and data-processing workloads, not booked revenue.
        - id: monetization
          label: Customer pricing and utilization
          detail: No public rate card, contract term, backlog, or utilization disclosure.
        - id: gross-profit
          label: Gross profit after launch and operating costs
          detail: Public sources do not disclose margin, burn, or cash-runway conversion.
      edges:
        - from: demand
          to: integrated-vehicle
          label: motivates
        - from: integrated-vehicle
          to: orbital-node
          label: deploys
        - from: orbital-node
          to: service
          label: enables
        - from: service
          to: monetization
          label: converts through
        - from: monetization
          to: gross-profit
          label: less undisclosed cost stack
    approximationNotes: >-
      This is a public-mechanism bridge, not a measured revenue waterfall; the undisclosed pricing and cost nodes are
      shown explicitly instead of being estimated.
    claimRefs:
      - CI003
      - CI004
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources describe a vertically integrated stack that combines orbit selection, optical transport, NVIDIA
      compute payloads, and a purpose-built launch vehicle whose upper stage becomes the node.
    data:
      layers:
        - label: Orbit + power envelope
          detail: Stampede is described as a dawn-dusk sun-synchronous constellation sized for sustained solar access.
          items:
            - Up to 20,000 satellites
            - 700-1,000 km shells
          outputs:
            - Solar-powered compute away from terrestrial grid queues
        - label: Compute node
          detail: Each upper stage is intended to operate as a 1 MW orbital data center.
          modules:
            - NVIDIA Space-1 Vera Rubin modules
            - Just under 800 onboard GPUs
          outputs:
            - 1 MW per node
        - label: Transport + control
          detail: >-
            Optical links are the primary communications path, with Ka-band TT&C reserved for selected mission phases
            and emergencies.
          modules:
            - Optical inter-satellite links
            - Optical space-to-ground links
            - 18.8-19.3 GHz downlink TT&C
            - 28.6-29.1 GHz uplink TT&C
        - label: Demonstration path
          detail: >-
            The first near-term on-orbit milestone is a power-beaming demo satellite rather than a full commercial
            compute deployment.
          items:
            - First satellite later in 2026
            - Space-to-Earth power-beaming demo
          outputs:
            - Earliest public validation step
        - label: Launch integration
          detail: The launch vehicle and data center are designed as one system instead of a payload riding a generic rocket.
          items:
            - Purpose-built launch vehicle
            - Upper stage is the payload
            - 'First proprietary launch target: end-2028'
          outputs:
            - Potential internal launch cadence if development lands
        - label: Compliance envelope
          detail: >-
            The architecture still depends on an open FCC review and later completion of the final spacecraft design
            package.
          items:
            - Application pending review
            - Later license modification expected
          outputs:
            - Regulatory path remains product-critical
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Cowboy's path from market pull to durable customer expansion still passes through multiple pre-commercial proof
      gates.
    data:
      items:
        - label: Terrestrial AI bottleneck
          detail: >-
            The pitch starts with grid, water, land, and permitting constraints that make off-Earth compute conceptually
            attractive.
          touchpoints:
            - AI demand outstripping terrestrial infrastructure
            - Problem framing before customer disclosure
        - label: Narrow early buyer set
          detail: >-
            Independent market analysis points to Earth observation, defense/security, space-station,
            lunar-infrastructure, and experimental AI buyers first.
          touchpoints:
            - Mission-driven accounts
            - High budget but small population
        - label: Partner-led validation
          detail: NVIDIA collaboration is the clearest named ecosystem proof in the assigned pool.
          touchpoints:
            - Technology partner
            - Not end-customer proof
        - label: Technical milestone phase
          detail: Public milestones center on a 2026 power-beaming demo, FCC process, and launch-system buildout.
          touchpoints:
            - Demo before live customer usage
            - Regulatory and engineering dependency
        - label: Initial commercial entry
          detail: Cowboy says commercial operations could begin with one satellite and then expand with later launches.
          touchpoints:
            - Small initial capacity
            - Need named workloads and counterparties
        - label: Expansion and renewal test
          detail: >-
            Durable adoption will require contract wins, repeat usage, and evidence that the first few accounts do not
            dominate demand.
          touchpoints:
            - Concentration risk
            - No public retention metrics yet
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU010
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk remains highest where public evidence still lacks granted authority, completed design closure, or a
      demonstrated launch-and-operations path.
    data:
      columns:
        - label: Likelihood
          detail: Probability from the current public record, not management guidance.
        - label: Impact
          detail: Effect on the investment case if the risk crystallizes.
        - label: Mitigation maturity
          detail: Publicly evidenced mitigation quality rather than planned intent.
        - label: Residual exposure
          detail: Net risk after considering only disclosed mitigations.
      rows:
