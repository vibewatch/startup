  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The assigned pool places Cowboy high on integrated-stack ambition but low on disclosed commercial maturity
      relative to the terrestrial status quo.
    data:
      xAxis:
        label: Integrated stack ownership (ordinal)
        min: 1
        max: 10
        low: Modular / outsourced stack
        high: End-to-end owned stack
        description: >-
          Ordinal score from assigned-pool evidence on how much of launch, power, and compute the alternative appears to
          control.
        scale: ordinal
      yAxis:
        label: Disclosed commercial maturity (ordinal)
        min: 1
        max: 10
        low: Concept or filing stage
        high: Operational buying option
        description: >-
          Ordinal score from assigned-pool evidence on whether the alternative is a disclosed operating purchase option
          versus a proposal or study.
        scale: ordinal
      points:
        - label: Cowboy Space
          x: 9
          'y': 4
          tone: opportunity
        - label: Terrestrial hyperscale substitute
          x: 3
          'y': 10
          tone: positive
        - label: SpaceX orbital data-center filing
          x: 8
          'y': 5
          tone: neutral
        - label: Google Project Suncatcher
          x: 6
          'y': 2
          tone: neutral
        - label: Caplight comparable cluster
          x: 5
          'y': 4
          tone: neutral
        - label: Orbital data-center panel cohort
          x: 6
