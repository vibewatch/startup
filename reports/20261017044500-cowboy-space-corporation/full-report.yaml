              The assigned evidence pool does not surface named paying customers, signed contract
              values, backlog, LOIs, customer-count disclosures, or production deployments. What it
              does show is a stack of pre-commercial proof points: a collaboration with NVIDIA, an
              FCC filing that sketches how service could start with a single satellite, a planned
              power-beaming demo later in 2026, and independent reporting that treats contract wins
              with hyperscale and government customers as milestones to watch rather than wins
              already secured. That combination is meaningful because it demonstrates ecosystem
              interest and a commercialization path, but it is still qualitatively different from
              verified usage, revenue-bearing deployments, or referenceable customer outcomes.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU012
