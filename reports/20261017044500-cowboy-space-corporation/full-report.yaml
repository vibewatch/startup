      - number: '3.3'
        title: Moat durability is thesis-stage because commercial proof is still thin
        blocks:
          - type: paragraph
            body: >-
              The most durable moat element visible in the assigned evidence is concept-level vertical integration, not
              verified commercial lock-in. Independent coverage highlights competition for scarce technical talent, and
              adverse reporting stresses unresolved thermal and debris questions plus unfinished satellite design. Those
              facts do not invalidate the strategy, but they do mean moat durability remains thesis-stage until Cowboy
              converts its architecture into approved operations, customer wins, and a disclosed commercial package. The
              chapter therefore supports a limited judgment: Cowboy is differentiated in concept and ambition, yet the
