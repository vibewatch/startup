      Ordinal scores are evidence-backed but not source-native metrics. Cowboy scores high on integration because the
      company says the rocket and data center are one vehicle. The terrestrial substitute scores highest on maturity
      because the assigned reporting treats Earth-based capacity as the incumbent status quo. SpaceX and Google score
      above Cowboy on category validation but remain proposal- or study-stage in the cited evidence. The Caplight
      comparable cluster and the SatNews panel cohort are included as sparse peer sets rather than audited commercial
      equals.
