              - CM012
              - CM014
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The sources imply likely customer classes but stop short of naming them. Public commentary points to
              hyperscalers and AI cloud providers as the budget owners most directly exposed to power and
              interconnection constraints, while the most plausible early workload classes are latency-tolerant or
              space-native applications such as defense, Earth observation, sovereign compute, disaster response, and
              scientific processing. That is consistent with the disclosed rollout path: a space-to-Earth power beaming
              demo later in 2026, an end-to-end compute mission in the first half of 2027, and a first integrated
              in-house rocket-and-data-center launch targeted before the end of 2028. The adoption story is therefore
              phased and credibility-driven: the company must first prove that the architecture works before a broader
              buyer base can treat orbital compute as an infrastructure procurement option.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Constraints that cap near-term market realization
        blocks:
          - type: paragraph
            body: >-
              The strongest counterweight to the market narrative is that the core engineering and regulatory
              constraints remain visible in every independent source. Thermal rejection in vacuum, radiation tolerance,
              optical-network reliability, launch economics, debris exposure, and unfinished satellite design all appear
              as gating issues rather than solved implementation details. Even the more optimistic reporting frames the
              market as contingent on launch cadence and technical closure, not as a standing procurement category with
              disclosed demand. That makes Cowboy's market case strategically interesting but still thesis-stage: the
              company has shown why a customer might care, yet public evidence still does not show who will pay, on what
              contract terms, or at what service level once the system leaves the conceptual phase.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports demand pressure, not a priced market
            body: >-
              The strongest retained evidence explains why orbital compute is interesting, but no retained source
              discloses named customers, contract values, pricing, utilization assumptions, or unit economics needed to
              convert that interest into a defendable near-term SAM or SOM.
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: substitutes are clearer than direct peers'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a broader alternative set more convincingly than a tight named peer list.
              Cowboy's own materials position the company as an integrated launch, power, and orbital-compute stack,
              while independent coverage repeatedly frames the real incumbent alternative as terrestrial AI
              infrastructure constrained by grid, water, and permitting bottlenecks rather than by a mature orbital
              rival set. The clearest named external reference in the pool is Caplight's comparable list, which surfaces
              Starcloud, Relativity Space, and Orbital Inc. as business-model neighbors, but without enough disclosed
              operating detail to treat them as proven heads-up competitors. In practice, the public record here says
              buyers can already buy terrestrial compute, can watch filing-stage orbital entrants, and cannot yet
              compare Cowboy against a richly disclosed set of orbital vendors.
