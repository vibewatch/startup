      - number: '5.2'
        title: Operating model and deployment path
        blocks:
          - type: paragraph
            body: >-
              The public operating model is also unusually explicit for a company this early. Coverage of the FCC filing
              describes Stampede as a proposed constellation of up to 20,000 satellites in dawn-dusk sun-synchronous
              orbits between 700 and 1,000 kilometers, using optical links as the primary data path and Ka-band
              telemetry, tracking, and command for selected mission phases and emergencies. Cowboy is telling investors
              and regulators that the service can start with a single satellite and then expand node-by-node instead of
              waiting for full constellation scale. That lowers the minimum viable deployment threshold on paper, but it
              also means the early product story depends heavily on whether the first demo satellite, the first orbital
              compute node, and the first proprietary launch all land close to the disclosed schedule.
            claimRefs:
