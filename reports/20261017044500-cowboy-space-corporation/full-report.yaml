  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context is clear; true valuation support is still thin
        blocks:
          - type: paragraph
            body: >-
              The public financing datapoint is straightforward: Cowboy announced a $275M Series B at a $2B valuation in
              May 2026, and third-party databases also place the company in unicorn territory. What is much less clear
              is how much of that mark is supported by observed commercial traction versus investor willingness to fund
              a category-defining infrastructure thesis. Dealroom and Silicon Valley InvestClub broadly agree that the
              company has raised hundreds of millions and now sits around the $2B range, but the open record still
              leaves cumulative funding, exact prior-round terms, and secondary pricing opaque. That means the valuation
              signal is real as a market-clearing financing event, but still weak as evidence of durable intrinsic
              value. Public sources also do not expose the full preference stack or any debt/project-finance overhang,
              which limits entry-discipline precision at the current price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: The key gap is commercialization and execution proof, not narrative quality
        blocks:
          - type: paragraph
            body: >-
              Cowboy's story is easy to understand: AI data-center demand is stressing terrestrial power and permitting,
              so a vertically integrated orbital-compute stack could become valuable if it works. The problem is that
              the public record still shows a proof gap between story and underwriting evidence. Silicon Valley
              InvestClub explicitly reports no public revenue, ARR, or profitability disclosure. Cowboy has described a
              first satellite demonstration later in 2026, while independent coverage pushes the first proprietary 1 MW
              launch target to 2028. The FCC path is also early: New Space Economy says Stampede should be treated as a
              proposal under review rather than an approved network. SatNews further frames the downside in blunt terms,
              highlighting thermal rejection, debris exposure, and unit-economics risk as the core proof burdens before
              the thesis becomes investable on operating fundamentals rather than ambition.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.3'
        title: Public evidence supports track, with upside gated by milestones
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Cowboy converts capital, talent, and NVIDIA alignment into an unusual but defensible
              orbital-infrastructure platform before incumbents or adjacent launch players close the window. The base
              case is less dramatic: the company remains well funded and strategically interesting, but the next round
              of evidence arrives through demos, customer commitments, and regulatory progress rather than through
              public financial proof. The bear case is that a $2B private mark is already pricing a meaningful share of
              what public space companies achieved only after far deeper operating proof, while the hardest engineering
              and licensing questions are still open. On that balance, public evidence supports track rather than buy:
              the company is important enough to keep close, but the current entry price already assumes too much future
              success for the available public proof.
            claimRefs:
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: The next diligence cycle should focus on proof that can actually move price
        blocks:
          - type: paragraph
            body: >-
              The most useful diligence is not another restatement of Cowboy's market narrative; it is evidence that
              compresses the uncertainty behind the present valuation. The first priority is commercial proof: named
              design partners, pilots, backlog, or early revenue that demonstrate demand beyond sector-wide AI
              infrastructure enthusiasm. The second is technical proof: thermal-vacuum results, launch-vehicle progress,
              and evidence that the integrated upper-stage data-center architecture survives real-world test gates. The
              third is capitalization clarity: term sheets, liquidation preferences, pro rata rights, and any debt or
              project-finance claims senior to new equity. A thesis break would be a down-round, material FCC setback,
              or failure to convert the 2026-2028 milestone path into customer-backed execution.
            claimRefs:
              - CV006
              - CV009
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track. Cowboy has enough capital and strategic ambition to matter, but the public record is still too thin
              on revenue, customer proof, regulatory de-risking, and liquidation/preference detail to justify chasing a
              $2B private mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV015
