            tableRef: TO002
            claimRefs:
              - CO010
              - CO014
              - CO015
      - number: '1.3'
        title: Funding history and stakeholder configuration
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is strongest around the May 2026 Series B and much weaker on total
              capitalization. Official and independently reported materials agree that Cowboy announced a $275 million
              Series B at a $2 billion valuation led by Index Ventures, but the total capital-raised figure diverges
              across sources: SatNews cites roughly $325 million of disclosed equity, while tracker-style sources show
              $335 million-plus across three rounds and a grant. The practical implication is that the current round is
              real and well signaled, but any cap-table analysis still needs direct management materials to separate
              priced equity, grants, founder participation, and any side vehicles. Stakeholder importance also extends
              beyond investors to NVIDIA as a technical credibility partner and the FCC as the near-term regulatory
              gatekeeper.
            claimRefs:
              - CO006
              - CO007
