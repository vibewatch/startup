      - number: '5.3'
        title: Maturity, dependencies, and controls
        blocks:
          - type: paragraph
            body: >-
              The product concept is more specific than most thesis-stage space startups, but the maturity level remains
              low because the key engineering and regulatory dependencies are still open. Public sources say the
              satellite design is unfinished, the FCC asked for physical dimensions including solar panels before
              advancing the filing, and the launch vehicle still lacks public disclosure on engine details, thrust, test
              articles, and facilities. Independent commentary is also converging on the same hard technical
              bottlenecks: rejecting megawatt-scale waste heat in vacuum, safely operating a large constellation in
              crowded orbital bands, and proving that the integrated launch-plus-node model can be manufactured and
              licensed on a startup timeline. In diligence terms, the chapter reads as a concrete architecture with
              limited public validation rather than a product already de-risked for underwriting.
