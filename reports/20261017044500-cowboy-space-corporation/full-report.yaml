      - number: '6.3'
        title: Durability is unproven, and first-contract concentration could be high
        blocks:
          - type: paragraph
            body: |-
              Durability metrics are currently absent from public evidence: there is no disclosed
              NRR, GRR, churn, contract length, cohort behavior, or renewal evidence in the assigned
              pool. That matters because the most plausible early buyers are a narrow set of
              technically sophisticated accounts whose procurement cycles will depend on launch
              reliability, thermal performance, and regulatory progress rather than ordinary SaaS
              expansion mechanics. SatNews' skeptical read is useful here: the company still has to
              prove launch cadence, thermal management, and debris economics before the customer
              thesis looks durable. If those hurdles clear, Cowboy may be able to land high-value
              lighthouse accounts; until then, customer concentration risk is impossible to size but
              likely elevated because the early market is specialized and small.
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The customer case is segment-first, not account-first
            body: >-
              Cowboy's retained evidence is strongest when describing who might buy orbital compute and why terrestrial
              constraints create demand, but it stops short of named customers, workloads, or signed demand.
            calloutType: insight
            claimRefs:
              - CU002
              - CU008
              - CU012
          - type: callout
            title: First-contract concentration could become a gating risk
            body: >-
              Because the plausible early buyer set is narrow and public durability metrics are absent, even successful
              initial wins would likely leave Cowboy dependent on a small number of technically demanding accounts until
              usage evidence broadens.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory approval is the first hard gate
        blocks:
          - type: paragraph
            body: >-
              The regulatory issue is not whether Cowboy has a vision for orbital compute; it is whether the current
              filing can clear non-routine review without major delay or redesign. Independent coverage and the filing
              commentary in this pool are consistent on three points: Stampede is still an application rather than an
              approved operating system, the company is asking for multiple waivers from standard NGSO deployment
              mechanics, and outside commenters already want the FCC to apply exceptional scrutiny because the proposal
              combines a very large shell, optical links, and novel orbital-data-center use cases. That shifts the top
              legal risk from ordinary paperwork toward precedent-setting review, waiver outcomes, and whether Cowboy
              can turn a still-evolving technical record into a licensable system before its commercial schedule starts
              to matter.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
