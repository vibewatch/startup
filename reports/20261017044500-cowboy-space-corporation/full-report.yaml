      - number: '4.3'
        title: Capital adequacy depends on execution through unresolved engineering and regulatory gates
        blocks:
          - type: paragraph
            body: >-
              The latest financing materially extends Cowboy's ability to pursue the orbital-compute thesis, but it does
              not by itself clear the next underwriting question: how much capital the company will ultimately need to
              build launch vehicles, large orbital data-center satellites, and the related ground, manufacturing, and
              regulatory stack. Independent coverage treats the FCC filing as a proposal under review, not as an
              authorized operating network, and SatNews frames the launch-compute architecture as a bet that thermal,
              launch, optical-link, and unit-economics bottlenecks can all be solved together. Public sources also
              diverge on total capital raised, and none disclose cash on hand, burn, debt, or project-finance
              obligations. The result is enough evidence to call the company well funded for experimentation, but not
