  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is publicly legible, but monetization is not
        blocks:
          - type: paragraph
            body: >-
              The public materials are consistent on the product concept: Cowboy Space wants to sell orbital AI compute
              capacity using a vertically integrated architecture in which the launch vehicle's upper stage becomes a
              one-megawatt data center once in orbit. That gives investors and readers a usable mechanism for
              understanding what could become a revenue stream, but it is still a concept-stage mechanism rather than a
              disclosed commercial engine. The assigned sources do not provide customer contracts, a price card,
              GPU-hour pricing, minimum commitments, utilization assumptions, or any gross-profit bridge from launch and
              satellite costs to realized service margins. Public milestones remain engineering milestones: a power
              beaming demonstration, an optical-communications cluster mission, and a first proprietary rocket launch,
              not disclosed revenue milestones.
