  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The call stays at track because macro narrative and capital support are outweighed by missing commercialization
      proof and unresolved execution risks.
    data:
      nodes:
        - id: market-need
          label: AI power bottleneck
          note: The macro driver is real.
        - id: financing-proof
          label: 2026 financing proof
          note: $275M Series B at a $2B valuation.
        - id: technical-scope
          label: Ambitious technical scope
          note: 20,000-satellite Stampede plan and 1 MW orbital nodes.
        - id: commercial-gap
          label: Missing commercial proof
          note: No public revenue, ARR, or named customer evidence.
        - id: execution-risk
          label: Residual execution risk
          note: FCC review, thermal rejection, debris, and launch timing remain open.
        - id: recommendation
          label: Track / wait for proof
          note: Re-rate only after customers, milestones, and cap-table clarity improve.
      edges:
        - from: market-need
          to: financing-proof
          label: Explains investor appetite
        - from: financing-proof
          to: technical-scope
          label: Funds the architecture
        - from: technical-scope
          to: commercial-gap
          label: Still lacks demand proof
        - from: technical-scope
          to: execution-risk
          label: Creates engineering and licensing burden
        - from: commercial-gap
          to: recommendation
          label: Prevents buy call
        - from: execution-risk
          to: recommendation
          label: Keeps price discipline tight
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV015
      - CV016
