              - CO013
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is still concentrated around founder and CEO Baiju Bhatt. Company-issued
              financing materials, independent coverage, and tracker pages all center Bhatt as the strategic narrator
              for the product thesis, financing, and rebrand, which creates obvious key-person dependence. The strongest
              incremental bench evidence in the retained sources is legal and operational rather than broad executive
              build-out: SatNews identifies Joseph Yaffe as both COO and Chief Legal Officer, and Silicon Valley Invest
              Club lists advisory additions in March and April 2026. That suggests widening support around the founder,
              but the public record still does not expose a full board slate, voting structure, or post-Series B control
              map.
            claimRefs:
              - CO010
              - CO014
              - CO015
