      - number: '3.2'
        title: Differentiation rests on integration, but switching frictions still favor the status quo
        blocks:
          - type: paragraph
            body: >-
              Cowboy's differentiation story is not software breadth or channel access; it is architecture. The company
              says its launch vehicle, power system, and compute payload are designed together so that the upper stage
              becomes a one-megawatt data center in orbit. That could create a moat if orbital power economics, thermal
              management, and launch cadence all work at commercial scale. The problem is that the same integration
              leaves current buyers with a large switching burden: unlike terrestrial hyperscale capacity, the product
              in the assigned pool is not yet an approved, operating service with public pricing, customer references,
              or contract structure. The result is a competitive stance where Cowboy may be more differentiated than a
              generic aerospace startup, but less substitutable today than the terrestrial status quo it hopes to
              displace.
