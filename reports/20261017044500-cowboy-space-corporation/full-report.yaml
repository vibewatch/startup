  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The usable market boundary is narrower than "space infrastructure" and broader than a single satellite
              program. Cowboy's public narrative defines a vertically integrated orbital-compute stack in which the
              launch vehicle, upper-stage data center, orbital solar power, and optical networking are all part of the
              same product. That framing matters because the incumbent substitute is not another launch startup; it is
              terrestrial AI capacity expansion competing for grid interconnection, cooling, land, and permitting. The
              chapter therefore treats orbital compute as a response to AI infrastructure bottlenecks, not as a generic
              space-services market. That keeps included spend focused on compute-capacity delivery and the physical
              systems needed to operate it, while excluding ordinary satcom, Earth-observation, and software-only AI
              categories that the sources do not show Cowboy serving directly.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence offers sizing lenses, but not a clean market model. One independent trade article says
              hyperscalers are planning nearly $700 billion of data-center capacity spending in 2026, which is useful as
              a macro demand signal but not as Cowboy's addressable spend. Company and filing coverage then narrows the
              disclosed opportunity to a proposed 20,000-satellite constellation in dawn-dusk sun-synchronous orbit,
              with representative nodes reported at 20,000-25,000 kilograms, roughly 1 MW of usable power, and just
              under 800 GPUs. Those figures describe ambition and node design, not booked demand or realized service
              revenue. The result is an evidence-constrained picture: the problem size is clearly large, but the share
              Cowboy can win remains unquantified because public materials do not bridge from macro capex or physical
              architecture to priced commercial workloads.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
