company:
  name: "Cowboy Space Corporation"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Cowboy Space has moved beyond a generic "space AI" story into a specific integrated
    product concept: the rocket upper stage becomes the orbital compute node, the planned
    Stampede constellation sits in sun-synchronous orbit, and NVIDIA is the named compute
    partner. The public record is still pre-product, however, with an unfinished satellite
    design, an open FCC review, and no public proof yet on thermal qualification, launch
    hardware readiness, or service reliability.
sections:
  - id: "integrated-product-thesis"
    title: "Integrated product thesis"
    body: >-
      Cowboy Space's disclosed product is not a standalone satellite bus or a conventional
      hosted payload. Company and independent sources consistently describe a vertically
      integrated system that combines launch vehicle development, in-orbit power generation,
      and AI compute into one architecture, with the rocket upper stage intended to remain in
      orbit as the data-center node itself. That specificity matters because it gives the
      company a concrete product definition rather than a broad market thesis: the announced
      compute partner is NVIDIA, the node target is 1 megawatt, and the same integrated
      vehicle is supposed to own both launch cadence and delivered compute. The practical
      implication is that product differentiation currently rests less on proprietary software
      and more on system-level integration across spacecraft, launch, and power delivery.
    claimRefs: ["CE001", "CE002", "CE005", "CE010"]
    tableRefs: ["TE001"]
    figureRefs: ["FE001"]
  - id: "operating-model-and-deployment"
    title: "Operating model and deployment path"
    body: >-
      The public operating model is also unusually explicit for a company this early. Coverage
      of the FCC filing describes Stampede as a proposed constellation of up to 20,000
      satellites in dawn-dusk sun-synchronous orbits between 700 and 1,000 kilometers, using
      optical links as the primary data path and Ka-band telemetry, tracking, and command for
      selected mission phases and emergencies. Cowboy is telling investors and regulators that
      the service can start with a single satellite and then expand node-by-node instead of
      waiting for full constellation scale. That lowers the minimum viable deployment
      threshold on paper, but it also means the early product story depends heavily on whether
      the first demo satellite, the first orbital compute node, and the first proprietary
      launch all land close to the disclosed schedule.
    claimRefs: ["CE003", "CE004", "CE006", "CE007", "CE008", "CE009"]
    tableRefs: ["TE002"]
  - id: "maturity-dependencies-and-controls"
    title: "Maturity, dependencies, and controls"
    body: >-
      The product concept is more specific than most thesis-stage space startups, but the
      maturity level remains low because the key engineering and regulatory dependencies are
      still open. Public sources say the satellite design is unfinished, the FCC asked for
      physical dimensions including solar panels before advancing the filing, and the launch
      vehicle still lacks public disclosure on engine details, thrust, test articles, and
      facilities. Independent commentary is also converging on the same hard technical
      bottlenecks: rejecting megawatt-scale waste heat in vacuum, safely operating a large
      constellation in crowded orbital bands, and proving that the integrated launch-plus-node
      model can be manufactured and licensed on a startup timeline. In diligence terms, the
      chapter reads as a concrete architecture with limited public validation rather than a
      product already de-risked for underwriting.
    claimRefs: ["CE008", "CE011", "CE012", "CE013", "CE014"]
    tableRefs: ["TE003"]
