callouts:
  - calloutType: "strength"
    title: "The architecture is unusually specific for a thesis-stage company"
    body: >-
      Cowboy is not just claiming "space AI." Public sources consistently describe the same
      integrated design choice: the upper stage becomes the compute node, Stampede uses
      sun-synchronous solar exposure, and NVIDIA is the named compute module partner.
    claimRefs: ["CE002", "CE003", "CE005"]
  - calloutType: "risk"
    title: "Specificity has not yet turned into public technical validation"
    body: >-
      The concept is concrete, but the product still looks pre-validation. The filing remains
      under review, the satellite design is unfinished, and public sources still center the
      same unresolved issues: thermal rejection, launch-hardware readiness, and licensing.
    claimRefs: ["CE011", "CE012", "CE013", "CE014"]
