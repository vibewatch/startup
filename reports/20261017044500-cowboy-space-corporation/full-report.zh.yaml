chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品事实
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 如今将自己定位为垂直整合的轨道基础设施公司，而不只是太空太阳能概念。官网和 2026 年 5 月融资公告对后续章节可复用的稳定事实基本一致：公司 2024 年以 Aetherflux
              名义成立，2026 年 5 月 11 日更名为 Cowboy Space，总部在 San Carlos，并在 Seattle
              设有办公室；公司主张把发射、供电和在轨计算做成一套系统。产品层面最扎实的事实是架构，而非商业化：火箭上级预计会在轨道上变成一座 1 MW 数据中心，NVIDIA
              是具名计算模块合作方。这足以定义商业模式，但仍只是设计目标，不是已证明的运营资产。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层仍高度集中在创始人兼 CEO Baiju Bhatt 身上。公司发布的融资材料、独立报道和追踪页面都把 Bhatt
              放在产品论点、融资和更名叙事的中心，形成明显的关键人物依赖。留存来源中最有增量的团队证据偏法律和运营，而非广泛的高管搭建：SatNews 将 Joseph Yaffe 列为 COO 兼首席法务官，Silicon
              Valley Invest Club 列出了 2026 年 3 月和 4 月新增的顾问。这说明创始人周围的支持在扩大，但公开记录仍未披露完整董事会名单、表决结构或 B 轮后的控制权图谱。
            claimRefs:
              - CO010
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO010
              - CO014
              - CO015
      - number: '1.3'
        title: 融资历史与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              公开融资证据集中在 2026 年 5 月 B 轮，对总资本额的证据则弱得多。官方及独立报道都确认 Cowboy 宣布以 $2B 估值完成由 Index Ventures 领投的 $275M B
              轮，但各来源对累计融资额存在差异：SatNews 引用约 $325M 的已披露股权融资，追踪类来源则显示三轮融资及一笔赠款合计超过
              $335M。实际含义是，本轮融资真实且信号明确，但要做股权结构分析，仍需管理层直接材料来区分定价股权、赠款、创始人参与和任何侧袋载体。利益相关方的重要性也不止于投资人：NVIDIA 是技术可信度伙伴，FCC
              则是近期监管把关者。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO009
              - CO012
      - number: '1.4'
        title: 里程碑与执行观察点
        blocks:
          - type: paragraph
            body: >-
              公开里程碑轨迹异常紧凑：Cowboy 从 2024 年成立，经历种子轮和 A 轮融资、2026 年初增补顾问委员会、2026 年 5 月更名及 B 轮融资，几天后又为 20,000 颗卫星的 “Stampede”
              星座向 FCC 提交文件。这一顺序证明势头真实，但也把核心尽调问题从“有没有兴趣”提前推进到“项目能否执行”。留存的独立报道把首次自研发射定在 2028 年目标，并反复指出同一批未解决问题：真空中 1 MW
              载荷的散热、大型星座的碎片暴露风险，以及仍未完成、还需监管跟进的卫星设计。
            claimRefs:
