  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式清晰可读，但尚未兑现收入
        blocks:
          - type: paragraph
            body: >-
              公开材料对产品概念的描述一致：Cowboy Space 想用垂直整合架构销售轨道 AI 计算容量，让发射工具的上级进入轨道后成为 1 MW
              数据中心。这给投资人和读者提供了理解潜在收入来源的具体机制，但仍是概念阶段的机制，而不是已披露的商业引擎。现有资料没有客户合同、价目表、GPU
              小时价格、最低承诺、利用率假设，也没有把发射和卫星成本连接到实际服务利润率的毛利桥。公开里程碑仍是工程里程碑：能量传输演示、光通信集群任务和首次自研火箭发射，而非披露的收入里程碑。
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
