  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持观察，因为宏观叙事和资本支持仍不足以抵消商业化验证缺失及尚未解决的执行风险。
    data:
      nodes:
        - id: market-need
          label: AI 电力瓶颈
          note: 宏观驱动因素确实存在。
        - id: financing-proof
          label: 2026 年融资验证
          note: $275M B 轮，估值 $2B。
        - id: technical-scope
          label: 技术范围激进
          note: 20,000 颗卫星的 Stampede 计划和 1 MW 轨道节点。
        - id: commercial-gap
          label: 商业验证缺失
          note: 没有公开收入、ARR 或具名客户证据。
        - id: execution-risk
          label: 剩余执行风险
          note: FCC 审查、热学否决、碎片和发射时间仍未解决。
        - id: recommendation
          label: 观察／等待证据
          note: 只有客户、里程碑和股权结构清晰度改善后，估值才应重估。
      edges:
        - from: market-need
          to: financing-proof
          label: 解释投资者兴趣
        - from: financing-proof
          to: technical-scope
          label: 为架构提供资金
        - from: technical-scope
          to: commercial-gap
          label: 仍缺少需求验证
        - from: technical-scope
          to: execution-risk
          label: 带来工程和许可负担
        - from: commercial-gap
          to: recommendation
          label: 阻止买入建议
        - from: execution-risk
          to: recommendation
          label: 维持严格的价格纪律
