      - number: '4.3'
        title: 资本充足度取决于穿越未解决的工程与监管闸门
        blocks:
          - type: paragraph
            body: >-
              最新融资显著延长了 Cowboy 推进轨道计算论点的能力，但本身并没有回答下一个投资判断问题：公司最终需要多少资本，才能建造发射工具、大型轨道数据中心卫星，以及配套的地面、制造和监管体系。独立报道把 FCC
              文件视为审核中的提案，而非获批运营网络；SatNews
