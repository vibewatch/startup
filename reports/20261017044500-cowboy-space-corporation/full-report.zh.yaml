              的配合转化为一个不寻常但可守的轨道基础设施平台，在现有企业或相邻发射玩家关闭窗口前建立优势。基准情景没那么戏剧性：公司保持资金充足且具有战略吸引力，但下一轮证据来自演示、客户承诺和监管进展，而不是公开财务证明。悲观情景是
              $2B
              私募估值已经计入了相当一部分未来成功，而公开太空公司往往要在运营证明深得多之后才达到类似水平；与此同时，最难的工程和许可问题仍未解决。综合来看，公开证据支持继续跟踪，而不是买入：公司重要到值得密切观察，但以现有公开证明看，当前入场价格已经假设了过多未来成功。
            claimRefs:
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 下一轮尽调应聚焦真正能推动价格的证明
        blocks:
          - type: paragraph
            body: >-
              最有用的尽调不是再次复述 Cowboy 的市场叙事，而是寻找能压缩当前估值背后不确定性的证据。第一优先级是商业证明：具名设计合作方、试点、积压订单或早期收入，证明需求不只是全行业 AI
              基础设施热情。第二是技术证明：热真空结果、运载工具进展，以及一体化上级数据中心架构通过真实测试闸门的证据。第三是资本结构透明度：条款清单、清算优先权、按比例配售权，以及任何优先于新股权的债务或项目融资债权。论点破坏点可能是下轮降价融资、重大
              FCC 挫折，或无法把 2026-2028 年里程碑路径转化为客户支持的执行。
            claimRefs:
              - CV006
              - CV009
              - CV013
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议
            body: 跟踪。Cowboy 的资本和战略雄心足以使其重要，但公开记录在收入、客户证明、监管去风险以及清算 / 优先权细节方面仍太薄，不足以支持追高 $2B 私募估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV015
