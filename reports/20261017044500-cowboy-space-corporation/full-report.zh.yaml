      - number: '4.2'
        title: 定价、客户和牵引力仍是尽调要求
        blocks:
          - type: paragraph
            body: >-
              财务评估受限的原因不是收入数据互相矛盾，而是收入数据缺失。Caplight 公开页面披露融资元数据，却明确没有公开收入、ARR
              或盈利数据；其他资料同样止步于融资轮次和产品叙事。没有留存来源点名客户、提供积压订单或 LOI 数量、量化利用率，或区分标价与实际定价。因此，现有证据可以描述 Cowboy
              说它将如何变现，却无法说明买家是否已承诺付费、合同条件是什么，或早期规模能达到多少。
            claimRefs:
