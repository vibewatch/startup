    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 假设
      - 估值／回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - Cowboy 按时完成首次演示，保住 2028 年发射路径，并披露可信的轨道计算客户需求。
        - 当前估值可以守住甚至继续上升，因为公司将把一个投机性品类转化为由里程碑支撑的基础设施期权。
        - 下一轮周期必须拿出客户、技术里程碑和监管进展的公开证据。
      - - 基准
        - Cowboy 资金充足、技术野心不减，但商业化和监管验证慢于融资叙事。
        - 当前估值偏满，但未必失真；投资者会等证据，而不是追价。
        - 这最符合今天融资支持强、经营披露少的组合。
      - - 悲观
        - 热学、碎片、许可或发射执行明显延期，商业化仍未得到验证。
        - 当前估值容易受伤，因为它已触及公开市场航天公司的估值区间，却没有相匹配的经营验证。
        - 平轮或下轮融资、演示失败或监管受挫，都会让这条路径从警示变成现实。
    notes: 这些情景是定性的，因为公开证据没有披露精确目标价所需的收入、单位经济性或股权结构条款。
