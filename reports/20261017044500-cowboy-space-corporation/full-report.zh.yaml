            - 光学星地链路
            - 18.8-19.3 GHz 下行 TT&C
            - 28.6-29.1 GHz 上行 TT&C
        - label: 演示路径
          detail: 近期首个在轨里程碑是电力波束演示卫星，而不是完整商业计算部署。
          items:
            - 首颗卫星于 2026 年稍晚发射
            - 星地电力波束演示
          outputs:
            - 最早的公开验证步骤
        - label: 发射一体化
          detail: 发射器和数据中心按一个系统设计，而不是让载荷搭乘通用火箭。
          items:
            - 专用发射器
            - 上面级就是载荷
            - 首次自有发射目标：2028 年底
          outputs:
            - 若开发成功，可能形成内部发射节奏
        - label: 合规边界
          detail: 这套架构仍取决于 FCC 的公开审查，以及之后完成最终航天器设计文件包。
          items:
            - 申请待审
            - 预计之后修改许可证
          outputs:
            - 监管路径仍是产品成败关键
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Cowboy 从市场拉动走向持续客户扩张，仍要跨过多道商业化前验证关卡。
    data:
      items:
        - label: 地面 AI 瓶颈
          detail: 这套叙事从电网、水、土地和许可约束切入，说明地外计算为何在概念上有吸引力。
          touchpoints:
            - AI 需求超过地面基础设施承载力
            - 客户披露前的问题定义
        - label: 早期买家范围窄
          detail: 独立市场分析首先指向地球观测、国防／安全、空间站、月球基础设施和实验性 AI 买家。
          touchpoints:
            - 任务驱动型客户
            - 预算高，但客户群小
        - label: 伙伴主导验证
          detail: 在所分配样本中，NVIDIA 合作是最明确的具名生态验证。
          touchpoints:
            - 技术伙伴
            - 不是终端客户验证
        - label: 技术里程碑阶段
          detail: 公开里程碑集中在 2026 年电力波束演示、FCC 流程和发射系统建设。
          touchpoints:
            - 真实客户使用前先做演示
            - 依赖监管和工程
        - label: 初始商业进入
          detail: Cowboy 称商业运营可以从一颗卫星开始，再通过后续发射扩张。
          touchpoints:
            - 初始容量小
            - 需要具名工作负载和交易对手
        - label: 扩张与续约测试
          detail: 要让客户长期采用，需要拿下合同、形成重复使用，并证明最初几家客户不会占据大部分需求。
          touchpoints:
            - 集中度风险
            - 尚无公开留存指标
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU010
      - CU012
