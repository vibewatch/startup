  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              可用市场边界比“太空基础设施”更窄，又比单一卫星项目更宽。Cowboy
              的公开叙事定义了一套垂直整合的轨道计算系统，其中发射工具、上级数据中心、轨道太阳能和光学网络都属于同一产品。这个定位很关键，因为现有替代方案不是另一家发射初创公司，而是争夺电网并网、冷却、土地和许可资源的地面
              AI 容量扩张。因此，本章把轨道计算视为对 AI 基础设施瓶颈的回应，而非泛化的太空服务市场。纳入支出聚焦于计算容量交付及运营所需的物理系统，排除普通卫星通信、地球观测和来源未显示 Cowboy 直接服务的软件型
              AI 类别。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              公开证据提供了测算视角，却没有形成干净的市场模型。一篇独立行业文章称，超大规模云厂商计划在 2026 年投入近 $700B 建设数据中心，这可作为宏观需求信号，却不能直接视为 Cowboy
              的可服务支出。公司及文件报道随后把披露机会收窄到拟建的 20,000 颗卫星星座：卫星位于晨昏太阳同步轨道，代表性节点重量为 20,000-25,000 千克，约有 1 MW 可用功率和略低于 800 个
              GPU。这些数字描述的是雄心和节点设计，不是已签订单或实现的服务收入。结论是一个受证据约束的图景：问题规模显然很大，但 Cowboy
              能赢得的份额尚无法量化，因为公开材料没有把宏观资本开支或物理架构连接到有定价的商业工作负载。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM014
      - number: '2.3'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              来源暗示了可能的客户类别，却没有点名客户。公开评论把超大规模云厂商和 AI
              云服务商视为最直接受电力和并网约束影响的预算方；最合理的早期工作负载则是对延迟不敏感或太空原生的应用，例如国防、地球观测、主权计算、灾害响应和科学处理。这与已披露的推进路径一致：2026
              年下半年进行太空到地面的能量传输演示，2027 年上半年完成端到端计算任务，并在 2028
              年底前争取首次集成自研火箭和数据中心发射。因此，采用故事是分阶段、靠可信度推进的：公司必须先证明架构能工作，更多买家才会把轨道计算视为基础设施采购选项。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 限制近期市场兑现的因素
        blocks:
          - type: paragraph
            body: >-
              对市场叙事最有力的反作用是，核心工程和监管约束在每个独立来源中都清晰可见。真空散热、辐射耐受、光学网络可靠性、发射经济性、碎片暴露和未完成的卫星设计，都还是闸门问题，而不是已解决的实现细节。即使更乐观的报道也把市场描述为取决于发射频率和技术闭环，而非一个已有披露需求的现成采购类别。这使
              Cowboy 的市场论点在战略上有吸引力，但仍处于论证阶段：公司解释了客户为什么可能在意，却没有公开证据证明系统脱离概念阶段后谁会付费、合同条件是什么或服务水平能达到何种程度。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开证据证明需求压力，而非有定价的市场
            body: 留存证据最有力地说明了轨道计算为何有吸引力，但没有来源披露具名客户、合同金额、定价、利用率假设或单位经济模型，无法据此把兴趣转化为可辩护的近期 SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：替代方案比直接同行更清晰
        blocks:
          - type: paragraph
            body: >-
              现有资料更有力地支持一个宽泛的替代方案集合，而不是一份紧凑的具名同行清单。Cowboy 自己的材料把公司定位为发射、供电和轨道计算一体化架构；独立报道则反复把真正的现有替代方案指向受电网、用水和许可瓶颈约束的地面
              AI 基础设施，而不是成熟的轨道竞争者。资料中最清晰的外部具名参照来自 Caplight 的可比公司列表，其中有 Starcloud、Relativity Space 和 Orbital
              Inc.，但披露的运营细节不足，不能视为已验证的正面竞争者。实际来看，这里的公开记录说明买家现在可以买到地面计算，也能观察到仍在申请阶段的轨道新进入者，却还不能把 Cowboy
              与一组披露充分的轨道供应商直接比较。
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.2'
        title: 差异化来自整合，但切换摩擦仍让现状占优
        blocks:
          - type: paragraph
            body: >-
              Cowboy 的差异化不在软件广度或渠道，而在架构。公司称发射工具、供电系统和计算载荷共同设计，使上级成为轨道上的 1 MW
              数据中心。如果轨道供电经济性、散热管理和发射频率都能达到商业规模，这可能形成护城河。但同一套整合也给当前买家带来很高的切换负担：与地面超大规模容量不同，资料中的产品还不是获批并运营的服务，没有公开定价、客户案例或合同结构。因此，Cowboy
              的竞争姿态是：概念和雄心比普通航空航天初创公司更有差异化，但今天仍不如它希望取代的地面现状方案可替代。
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.3'
        title: 护城河耐久性仍处于论证阶段，商业证明很薄
        blocks:
          - type: paragraph
            body: >-
              在现有证据中，最持久的护城河要素是概念层面的垂直整合，而不是经验证的商业锁定。独立报道强调稀缺技术人才的竞争；负面报道则突出尚未解决的散热和碎片问题，以及未完成的卫星设计。这些事实并不否定战略，但意味着在
              Cowboy 把架构转化为获批运营、客户赢单和披露充分的商业方案之前，护城河耐久性仍停留在论证阶段。因此，本章只支持有限判断：Cowboy
              在概念和雄心上有差异化，但当前公开记录太薄，无法与具名同行比较实际定价、买家偏好或多归属行为。
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 真正的现有方案是地面计算
            body: 现有资料中最强的替代方案是已存在的地面 AI 容量。与 Cowboy 想取代的现状相比，其直接轨道同行仍缺乏充分披露。
            calloutType: insight
            claimRefs:
              - CP010
              - CP014
          - type: callout
            title: 整合同时是护城河和风险
            body: 掌握发射、供电和计算可以让 Cowboy 脱颖而出，但也意味着发射经济性、散热表现和许可都卡在同一条关键路径上。
            calloutType: risk
            claimRefs:
              - CP002
              - CP011
