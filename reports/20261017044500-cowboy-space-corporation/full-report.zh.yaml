    columns:
      - 视角
      - 正方论点
      - 反方论点 / 改变观点的因素
    rows:
      - - 市场驱动因素
        - AI 电力和并网约束构成将算力移出地球的合理宏观理由。
        - 只有当 Cowboy 将这一宏观叙事转化为有客户支撑的需求，而不是停留在行业叙事上，观点才会改善。
      - - 资本支持
        - Index 领投的 $275M、$2B 估值 Series B 轮表明顶级投资者愿意大规模为这一论点提供资金。
        - 如果核心里程碑完成前的后续融资只能以平估值或下调估值完成，观点就会恶化。
      - - 产品架构
        - 一体化火箭加 1 MW 轨道数据中心的设计如果能跑通，可能形成差异化护城河。
        - 只有公开测试结果和发射进展证明这套架构经得住工程现实，判断才会改善。
      - - 商业验证
        - 员工人数增长和持续招聘表明 Cowboy 正在为快速执行补充人手。
        - 如果当前里程碑窗口结束后仍看不到公开收入、试点或具名客户，判断会恶化。
      - - 监管 / 执行负担
        - Cowboy 已与 FCC 接洽并公开系统细节，说明它不只是在推销抽象概念。
        - 如果申报停滞、豁免受到质疑，或碎片／热学问题拖慢项目，判断会恶化。
    notes: 这些行对照说明公司为何可能获得估值溢价，以及在溢价具备投资价值前必须拿出的具体证据。
