      - ["Company identity", "Cowboy Space Corporation (fka Aetherflux)", "2026-05-11", "high", "Rebrand date is public; confirm whether any legacy contracts still sit under the Aetherflux name."]
      - ["Headquarters / offices", "San Carlos HQ; Seattle additional office", "current", "high", "Public sources confirm footprints, not team size by site."]
      - ["Stage", "Series B private company", "2026-05-11", "high", "Current stage is clear, but board/control rights are not publicly described."]
      - ["Latest valuation", "$2B post-money company announcement", "2026-05-11", "high", "No independent secondary price, tender, or markup disclosure in retained sources."]
      - ["Disclosed capital raised", "$325M disclosed equity / $335M+ tracker total", "2026-05 to 2026-10", "medium", "Totals conflict on whether tracker-reported grant or non-equity items are included."]
      - ["Revenue / ARR", null, "current", "low", "Request audited financials or KPI pack; retained public sources do not support a number."]
      - ["Customer count", null, "current", "low", "Request signed customer list, LOIs, or backlog schedule rather than inferring from sector demand."]
      - ["Headcount", null, "current", "low", "Request org chart or payroll snapshot; public pages describe backgrounds, not employee count."]
      - ["First proprietary launch target", "Before end-2028 / 2028 target", "2026-05", "medium", "Public target only; confirm propulsion, manufacturing, and licensing critical path."]
    notes: >-
      Null means the retained public source set does not support a precise value
      as of 2026-10-17; follow the listed diligence ask rather than inferring a
      number.
    claimRefs: [CO001, CO002, CO006, CO007, CO008, CO009, CO013]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Baiju Bhatt", "Founder & CEO", "Robinhood co-founder; public face of rebrand, fundraising, and product framing", "Strong capital-markets credibility and first-principles product ownership for the orbital-compute thesis", "High: strategy, financing narrative, and external credibility remain centered on Bhatt"]
      - ["Joseph Yaffe", "COO & Chief Legal Officer", "Joined in January 2026 from Skadden, where he led the Palo Alto office", "Adds legal, regulatory, and operating depth around licensing and execution", "Medium: expands bench, but public evidence still shows a concentrated executive surface"]
      - ["Matthew Seaford", "Advisory Board", "Tracker page describes him as a security and defense expert", "Signals interest in defense/government positioning rather than day-to-day operating capacity", "Low direct dependency; advisory role does not close governance or execution gaps"]
      - ["Brad Koenig", "Advisory Board", "Tracker page lists ex-Goldman Sachs and NIST-CHIPS background", "Adds policy, semiconductor, and capital-markets pattern recognition", "Low direct dependency; advisory role is supportive, not a disclosed control function"]
    notes: >-
      Publicly named leaders are incomplete and mix operating roles with
      advisory additions; the retained sources do not disclose the full board,
      reporting structure, or post-Series B governance package.
    enumerationScope:
      coverage: partial
      basis: >-
        Public sources retained for this chapter name the founder, one senior
        operating/legal executive, and two 2026 advisory additions, but not the
        complete management team or board.
    claimRefs: [CO010, CO014, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Index Ventures", "Lead investor", "Led both the Series A and Series B, making it the clearest repeat external capital signal", "Confirm board seat, pro-rata rights, and appetite to bridge future launch/infra capex"]
      - ["Baiju Bhatt", "Founder and investor", "Appears in official financing materials as both founder and participating investor, which can concentrate control and economics", "Confirm ownership %, voting structure, and any super-voting or transfer constraints"]
      - ["Breakthrough Energy Ventures / Construct / NEA / Interlagos", "Returning institutional backers", "Repeat participation suggests continuity behind the thesis, but the public record does not show check sizes or terms", "Request allocation by investor, reserve levels, and any insider-led round mechanics"]
      - ["NVIDIA", "Technology collaborator", "Named Space-1 partner is an important credibility lever for the product narrative even without disclosed revenue", "Confirm whether the relationship is strategic marketing, supply allocation, or a deeper commercial commitment"]
      - ["FCC", "Regulatory gatekeeper", "Constellation licensing and waiver treatment shape whether the orbital data-center roadmap can leave paper status", "Confirm application status, waiver odds, and required follow-on filings or modifications"]
      - ["Potential customers", "Commercial proof constituency", "No retained source names signed customers, backlog, or priced demand, so go-to-market validation remains weak", "Request LOIs, design partners, or contracted workloads before underwriting revenue timing"]
    notes: >-
      This map intentionally mixes capital providers, a strategic technology
      partner, regulator, and demand-side counterparties because all four shape
      control, execution speed, or downside risk at Cowboy's current stage.
    enumerationScope:
      coverage: partial
      basis: >-
        The retained public sources identify major investors, one named compute
        partner, the FCC filing path, and the absence of named customers, but
        they do not provide a full cap table or customer roster.
    claimRefs: [CO005, CO006, CO009, CO012]
