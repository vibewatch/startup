artifact: company-overview
slug: cowboy-space-corporation
runDate: 2026-10-17
company:
  name: Cowboy Space Corporation
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cowboy Space's refreshed public identity is anchored in a May 2026 rebrand,
    a $275 million Series B at a $2 billion valuation, and a consistent pitch
    that launch, power, and in-orbit AI compute are one vertically integrated
    system. The same public record still leaves board/control detail, operating
    metrics, and proof that the one-megawatt orbital data-center design can
    clear thermal, launch, and regulatory hurdles as the main diligence gaps.
sections:
  - id: identity-ground-truth
    title: Identity and product ground truth
    body: >-
      Cowboy Space now presents itself as a vertically integrated orbital
      infrastructure company rather than only a space-solar-power concept.
      Official pages and the May 2026 financing announcement line up on the
      stable facts later chapters can reuse: the company was founded in 2024 as
      Aetherflux, rebranded to Cowboy Space on May 11, 2026, is headquartered in
      San Carlos with a Seattle office, and is pitching launch, power, and
      in-orbit compute as one stack. The strongest product-level ground truth is
      architectural, not commercial: the rocket upper stage is intended to
      become a one-megawatt data center in orbit, and NVIDIA is the named
      compute-module collaborator. That is enough to define the business model,
      but it is still a design objective rather than a demonstrated operating
      asset.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      The public leadership picture is still concentrated around founder and CEO
      Baiju Bhatt. Company-issued financing materials, independent coverage, and
      tracker pages all center Bhatt as the strategic narrator for the product
      thesis, financing, and rebrand, which creates obvious key-person
      dependence. The strongest incremental bench evidence in the retained
      sources is legal and operational rather than broad executive build-out:
      SatNews identifies Joseph Yaffe as both COO and Chief Legal Officer, and
      Silicon Valley Invest Club lists advisory additions in March and April
      2026. That suggests widening support around the founder, but the public
      record still does not expose a full board slate, voting structure, or
      post-Series B control map.
    claimRefs: [CO010, CO014, CO015]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history and stakeholder configuration
    body: >-
      Public financing evidence is strongest around the May 2026 Series B and
      much weaker on total capitalization. Official and independently reported
      materials agree that Cowboy announced a $275 million Series B at a $2
      billion valuation led by Index Ventures, but the total capital-raised
      figure diverges across sources: SatNews cites roughly $325 million of
      disclosed equity, while tracker-style sources show $335 million-plus
      across three rounds and a grant. The practical implication is that the
      current round is real and well signaled, but any cap-table analysis still
      needs direct management materials to separate priced equity, grants,
      founder participation, and any side vehicles. Stakeholder importance also
      extends beyond investors to NVIDIA as a technical credibility partner and
      the FCC as the near-term regulatory gatekeeper.
    claimRefs: [CO006, CO007, CO008, CO009, CO011]
    tableRefs: [TO003]
  - id: milestones-and-watchpoints
    title: Milestones and execution watchpoints
    body: >-
      The public milestone trail is unusually compressed: Cowboy goes from a
      2024 founding to seed and Series A financing, advisory-board additions in
      early 2026, a May 2026 rebrand and Series B, and then an FCC filing for a
      20,000-satellite "Stampede" constellation within days. That sequence
      establishes real momentum, but it also pulls the key diligence question
      forward from "is there interest?" to "can this program execute?" Retained
      independent coverage frames the first proprietary launch as a 2028 target
      and repeatedly highlights the same unresolved proof points: thermal
      rejection for a one-megawatt payload in vacuum, debris exposure from a
      very large constellation, and an unfinished satellite design that still
      needs regulatory follow-through.
    claimRefs: [CO006, CO011, CO012, CO013, CO016]
    figureRefs: [FO001]
