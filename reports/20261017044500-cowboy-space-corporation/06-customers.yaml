callouts:
  - calloutType: insight
    title: "The customer case is segment-first, not account-first"
    body: >-
      Cowboy's retained evidence is strongest when describing who might buy orbital compute
      and why terrestrial constraints create demand, but it stops short of named customers,
      workloads, or signed demand.
    claimRefs: [CU002, CU008, CU012]
  - calloutType: risk
    title: "First-contract concentration could become a gating risk"
    body: >-
      Because the plausible early buyer set is narrow and public durability metrics are
      absent, even successful initial wins would likely leave Cowboy dependent on a small
      number of technically demanding accounts until usage evidence broadens.
    claimRefs: [CU009, CU010, CU011]
