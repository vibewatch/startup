company:
  name: "Cowboy Space Corporation"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Cowboy Space has a plausible customer thesis around power-constrained AI compute and
    narrow mission-driven orbital workloads, but the public evidence still stops short of
    named paying customers, production deployments, or retention proof. The assigned source
    pool shows partner proof, a route to first commercial operations, and clear prospective
    segments, yet today's adoption case remains pre-commercial and likely concentrated in a
    small number of early accounts if demand materializes.
sections:
  - id: "customer-thesis-and-segments"
    title: "Customer thesis points to narrow, high-value early segments"
    body: |-
      The strongest supportable customer story is segment-level rather than account-level.
      Cowboy positions orbital compute as a response to terrestrial bottlenecks in power,
      land, water, and permitting, which makes the concept most relevant to buyers that
      either need unusually energy-intensive AI capacity or already operate space assets
      whose data benefits from in-orbit processing. Independent market framing is explicit
      that early orbital-compute demand is more likely to come from Earth-observation
      operators, defense and security agencies, space-station or lunar-infrastructure users,
      and AI developers testing unusual workloads than from the broad enterprise cloud
      market. That narrows the first-customer set to accounts with large budgets and real
      mission need, but it also implies a concentrated go-to-market path rather than broad,
      diversified customer adoption in the near term.
    claimRefs: [CU001, CU002, CU008, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "public-adoption-proof"
    title: "Public adoption proof is still partner-led and milestone-led"
    body: |-
      The assigned evidence pool does not surface named paying customers, signed contract
      values, backlog, LOIs, customer-count disclosures, or production deployments. What it
      does show is a stack of pre-commercial proof points: a collaboration with NVIDIA, an
      FCC filing that sketches how service could start with a single satellite, a planned
      power-beaming demo later in 2026, and independent reporting that treats contract wins
      with hyperscale and government customers as milestones to watch rather than wins
      already secured. That combination is meaningful because it demonstrates ecosystem
      interest and a commercialization path, but it is still qualitatively different from
      verified usage, revenue-bearing deployments, or referenceable customer outcomes.
    claimRefs: [CU003, CU004, CU006, CU007, CU012]
    tableRefs: [TU002, TU003]
  - id: "durability-and-concentration"
    title: "Durability is unproven, and first-contract concentration could be high"
    body: |-
      Durability metrics are currently absent from public evidence: there is no disclosed
      NRR, GRR, churn, contract length, cohort behavior, or renewal evidence in the assigned
      pool. That matters because the most plausible early buyers are a narrow set of
      technically sophisticated accounts whose procurement cycles will depend on launch
      reliability, thermal performance, and regulatory progress rather than ordinary SaaS
      expansion mechanics. SatNews' skeptical read is useful here: the company still has to
      prove launch cadence, thermal management, and debris economics before the customer
      thesis looks durable. If those hurdles clear, Cowboy may be able to land high-value
      lighthouse accounts; until then, customer concentration risk is impossible to size but
      likely elevated because the early market is specialized and small.
    claimRefs: [CU005, CU009, CU010, CU011]
