companyProfile:
  summary: >-
    Cowboy Space Corporation is a San Carlos-based orbital infrastructure startup that rebranded from Aetherflux in May
    2026 and now pitches a vertically integrated stack spanning launch, orbital power, and in-orbit AI compute. The
    company announced a $275 million Series B at a $2 billion valuation, but the public record still shows a
    pre-commercial business with no disclosed revenue, named customers, or operating proof for the core one-megawatt
    orbital data-center concept.
  headquarters: San Carlos, California, USA
  productSummary: >-
    A vertically integrated orbital-compute platform that intends to place AI compute in orbit on a purpose-built launch
    vehicle and power it with space-based solar generation.
  customerFocus: >-
    AI infrastructure buyers, sovereign and defense compute users, and space-native workloads that benefit from
    off-Earth processing.
  businessModel: >-
    Undisclosed today; the stated long-term model is to sell orbital compute capacity and related launch/power
    infrastructure services.
  stage: Series B private company
  fundingStatus: >-
    $275M Series B announced in May 2026 at a $2B valuation, with prior disclosed equity around $325M and tracker totals
