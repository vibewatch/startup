company:
  name: Cowboy Space Corporation
chapter:
  number: 7
  title: Risks
  summary: >-
    Cowboy Space's risk stack is still dominated by external gating items rather than
    operating evidence: the FCC application is unapproved, the filing asks for
    multiple waivers, and independent sources still describe the satellite design
    and one-megawatt thermal problem as unresolved. The May 2026 Series B gives
    the company time to pursue the thesis, but public evidence still does not close
    licensing, launch-cadence, or commercial-proof risk for a 20,000-satellite plan.
sections:
  - id: regulatory-and-legal
    title: Regulatory approval is the first hard gate
    body: >-
      The regulatory issue is not whether Cowboy has a vision for orbital compute; it
      is whether the current filing can clear non-routine review without major delay
      or redesign. Independent coverage and the filing commentary in this pool are
      consistent on three points: Stampede is still an application rather than an
      approved operating system, the company is asking for multiple waivers from
      standard NGSO deployment mechanics, and outside commenters already want the
      FCC to apply exceptional scrutiny because the proposal combines a very large
      shell, optical links, and novel orbital-data-center use cases. That shifts the
      top legal risk from ordinary paperwork toward precedent-setting review, waiver
      outcomes, and whether Cowboy can turn a still-evolving technical record into a
      licensable system before its commercial schedule starts to matter.
    claimRefs: [CR002, CR003, CR004, CR011, CR012, CR015]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: technical-and-operational
    title: Integrated launch-plus-compute design compounds execution risk
    body: >-
      Cowboy's core product architecture is also the main operational risk amplifier.
      Public reporting describes a system in which the launch vehicle upper stage
      becomes the one-megawatt data-center payload, so launch, payload, thermal
      rejection, and orbital operations do not de-risk independently. That can create
      a stronger moat if it works, but it also means a single schedule slip can stall
      multiple parts of the thesis at once. Independent sources still call out
      unresolved heat rejection in vacuum, an unfinished satellite design, and a
      first proprietary launch that is only targeted for 2028. The optical-link-heavy
      architecture reduces routine spectrum dependence, but it introduces its own
      availability and ground-operations discipline requirements, which remain mostly
      described in concept rather than through demonstrated operating data.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR013, CR015]
    tableRefs: [TR002]
  - id: financial-and-thesis-breakers
    title: Capital, counterparties, and proof points still define the kill criteria
    body: >-
      The Series B meaningfully improves survivability, but it does not prove that
      Cowboy has closed the funding or demand risk for the full architecture now being
      discussed in public. The current record supports a near-term development push,
      not a conclusion that the company has already financed a proprietary launcher,
      orbital data-center payloads, and the infrastructure needed to scale toward a
      20,000-satellite concept. Dependency concentration remains high around Nvidia
      modules, launch readiness, FCC timing, and whether customers will accept a
      service that is still pre-demonstration in public. For investment purposes, the
      cleanest kill criteria are measurable: no credible demo readout, no clear
      design freeze and licensing path, no launch-cadence plan, or no customer and
      financing proof as 2028 approaches.
    claimRefs: [CR001, CR009, CR010, CR013, CR014, CR015]
    tableRefs: [TR003]
