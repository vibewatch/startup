callouts:
  - calloutType: risk
    title: Cleanest thesis-break trigger
    body: >-
      If Cowboy reaches the next 12-18 months without a credible demo readout, a
      clearer licensing path, and evidence that the integrated launch-plus-compute
      design is closing rather than widening engineering unknowns, the current
      valuation support weakens faster than the technical story strengthens.
    claimRefs: [CR005, CR007, CR009, CR011, CR015]
  - calloutType: insight
    title: Fastest de-risking path
    body: >-
      The public record would improve materially with four disclosed milestones:
      post-demo mission data, updated FCC filings that narrow the waiver set,
      thermal and debris evidence at system scale, and customer or financing proof
      tied to the 2028 operating path.
    claimRefs: [CR003, CR005, CR011, CR012, CR014, CR015]
