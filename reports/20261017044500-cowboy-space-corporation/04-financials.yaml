company:
  name: Cowboy Space Corporation
chapter:
  number: 4
  title: Financials
  summary: >-
    Cowboy Space has raised a fresh $275 million Series B at a reported $2
    billion valuation, but the public record still supports a financing thesis
    more than an operating-financial thesis. The assigned evidence shows a
    capital-intensive orbital-compute model with disclosed milestones and
    fundraising, while realized pricing, customers, revenue, margins, burn, and
    runway remain undisclosed.
sections:
  - id: revenue-model
    title: Revenue model is publicly legible, but monetization is not
    body: >-
      The public materials are consistent on the product concept: Cowboy Space
      wants to sell orbital AI compute capacity using a vertically integrated
      architecture in which the launch vehicle's upper stage becomes a
      one-megawatt data center once in orbit. That gives investors and readers a
      usable mechanism for understanding what could become a revenue stream, but
      it is still a concept-stage mechanism rather than a disclosed commercial
      engine. The assigned sources do not provide customer contracts, a price
      card, GPU-hour pricing, minimum commitments, utilization assumptions, or
      any gross-profit bridge from launch and satellite costs to realized
      service margins. Public milestones remain engineering milestones: a power
      beaming demonstration, an optical-communications cluster mission, and a
      first proprietary rocket launch, not disclosed revenue milestones.
    claimRefs:
      - CI003
      - CI004
      - CI011
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-traction
    title: Pricing, customers, and traction are still diligence asks
    body: >-
      Financial underwriting is constrained less by contradictory revenue data
      than by missing revenue data. Caplight's public page exposes fundraising
      metadata but explicitly lacks public revenue, ARR, and profitability
      figures, while the other assigned sources likewise stop at the financing
      round and product narrative. No retained source names customers, gives
      backlog or LOI counts, quantifies utilization, or distinguishes list from
      realized pricing. That means the current evidence can describe what Cowboy
      says it will monetize, but not whether buyers have committed to pay for
      it, on what terms, or at what early scale.
    claimRefs:
      - CI007
      - CI011
      - CI012
    tableRefs:
      - TI002
  - id: capital-needs
    title: Capital adequacy depends on execution through unresolved engineering and regulatory gates
    body: >-
      The latest financing materially extends Cowboy's ability to pursue the
      orbital-compute thesis, but it does not by itself clear the next
      underwriting question: how much capital the company will ultimately need
      to build launch vehicles, large orbital data-center satellites, and the
      related ground, manufacturing, and regulatory stack. Independent coverage
      treats the FCC filing as a proposal under review, not as an authorized
      operating network, and SatNews frames the launch-compute architecture as a
      bet that thermal, launch, optical-link, and unit-economics bottlenecks
      can all be solved together. Public sources also diverge on total capital
      raised, and none disclose cash on hand, burn, debt, or project-finance
      obligations. The result is enough evidence to call the company well funded
      for experimentation, but not enough to underwrite runway or dilution risk
      with precision.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI008
      - CI009
      - CI010
      - CI013
      - CI014
      - CI015
    tableRefs:
      - TI003
  - id: verdict
    title: Financial verdict
    body: >-
      The chapter's financial conclusion is therefore mixed. Cowboy Space has
      genuine fundraising momentum, named institutional backers, and a product
      story that can be traced into a plausible future revenue mechanism. But
      every core operating metric that would support conventional underwriting
      remains absent from the assigned pool: no revenue, no ARR, no disclosed
      customer commitments, no realized pricing, no burn, and no gross-margin
      evidence. For this refresh, the correct read is that capital availability
      is a necessary enabler of the thesis, not proof that the thesis is yet
      commercially validated.
    claimRefs:
      - CI001
      - CI004
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Orbital AI compute service
        - Sell compute capacity from Stampede satellites/data-center nodes in orbit
        - Pricing unit undisclosed
        - Publicly described product concept; no public revenue or pricing
        - Company-claimed model with no realized economics
        - Disclose contracted workloads, billing unit, minimum commitments, and utilization assumptions
      - - Launch-enabled deployment
        - Proprietary launch vehicle places the compute node in orbit as the rocket upper stage
        - Revenue line not disclosed
        - First proprietary rocket launch targeted for 2028
        - Operational milestone, not proven revenue
        - Clarify whether launch is internal enablement only or also a billable service
      - - Space-to-Earth power beaming demonstration
        - Demonstration mission intended to validate a foundational subsystem
        - Demo milestone
        - First satellite mission planned later in 2026
        - Technical validation step, not commercial traction
        - Provide commercialization path, counterparties, and expected monetization timing
      - - Optical data transmission / processing
        - Future cluster mission supports high-speed optical communications and in-space processing
        - Service pricing undisclosed
        - 2027 cluster mission discussed; no public customer commitments
        - Product roadmap signal only
        - Provide SLA targets, data-transfer economics, and early design-partner evidence
    notes: >-
      Public sources describe mechanisms and milestones but do not disclose
      realized pricing, customer contracts, or gross-profit conversion.
    claimRefs:
      - CI003
      - CI004
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / metric
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Orbital compute capacity
        - Not publicly disclosed
        - Unknown
        - No public rate card, term length, or committed-volume schedule
        - Caplight public page plus assigned news coverage
      - - Customer commitments / backlog / LOIs
        - Not publicly disclosed
        - Unknown
        - No named customers or signed-demand metrics in the retained pool
        - Assigned news coverage and Caplight public page
      - - Power-beaming demonstration
        - Demo mission only; no public commercial pricing
        - Not applicable
        - No disclosed conversion from demo to recurring revenue
        - Space.com milestone coverage
      - - Launch service economics
        - Not publicly disclosed
        - Unknown
        - No public separation of internal launch cost from external billable service
        - Business Wire, Space.com, The Robotics Media
    notes: >-
      This table intentionally records unavailable pricing surfaces rather than
      inferring SaaS-like or launch-like monetization terms that the sources do
      not disclose.
    claimRefs:
      - CI007
      - CI011
      - CI012
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Latest round / valuation
        - $275M Series B at $2B valuation
        - High
        - Sets the entry price for new capital but not operating performance
        - Confirm post-money basis, liquidation preferences, and any structured terms
      - - Total capital raised
        - Public sources conflict between roughly $325M and $335M
        - Low
        - Impacts dilution history and cash-to-date framing
        - Reconcile round-by-round proceeds, grants, founder capital, and any non-equity financing
      - - Revenue run rate / ARR
        - null
        - Medium
        - Core underwriting metric is unavailable
        - Provide monthly revenue, annualized run rate, and recurring vs non-recurring mix
      - - Customer count / backlog / LOIs
        - null
        - Medium
        - Demand proof is absent without committed counterparties
        - Provide signed customers, design partners, backlog, and LOI conversion assumptions
      - - Gross margin / contribution margin
        - null
        - Medium
        - Cannot assess unit economics without cost of service and launch allocation
        - Break out launch, satellite, power, communications, and operations cost structure
      - - Cash burn / runway / debt obligations
        - null
        - Medium
        - Financing adequacy cannot be underwritten from raise size alone
        - Provide current cash, monthly burn, debt/project finance, and next-round trigger
    notes: >-
      null means the assigned public sources do not disclose the metric; the
      confidence column reflects evidence quality, not business quality.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI009
      - CI010
      - CI014
      - CI015
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes the physical path to monetization, but pricing,
      contracted demand, and margin conversion remain undisclosed.
    data:
      nodes:
        - id: demand
          label: AI power and data-center bottleneck
          detail: Terrestrial power and grid constraints are the demand premise in the retained coverage.
        - id: integrated-vehicle
          label: Integrated launch vehicle plus compute payload
          detail: Cowboy says the rocket upper stage and data-center payload are designed as one vehicle.
        - id: orbital-node
          label: 1 MW orbital data-center node
          detail: Each upper stage is described as becoming a one-megawatt data center in orbit.
        - id: service
          label: In-orbit compute and data-processing service
          detail: Public sources describe intended AI and data-processing workloads, not booked revenue.
        - id: monetization
          label: Customer pricing and utilization
          detail: No public rate card, contract term, backlog, or utilization disclosure.
        - id: gross-profit
          label: Gross profit after launch and operating costs
          detail: Public sources do not disclose margin, burn, or cash-runway conversion.
      edges:
        - from: demand
          to: integrated-vehicle
          label: motivates
        - from: integrated-vehicle
          to: orbital-node
          label: deploys
        - from: orbital-node
          to: service
          label: enables
        - from: service
          to: monetization
          label: converts through
        - from: monetization
          to: gross-profit
          label: less undisclosed cost stack
    approximationNotes: >-
      This is a public-mechanism bridge, not a measured revenue waterfall; the
      undisclosed pricing and cost nodes are shown explicitly instead of being
      estimated.
    claimRefs:
      - CI003
      - CI004
      - CI011
      - CI012
      - CI013
callouts:
  - calloutType: risk
    title: No public revenue-quality proof yet
    body: >-
      The retained pool contains fundraising and milestone evidence, but it does
      not disclose realized pricing, customer commitments, utilization, revenue,
      or margin.
    claimRefs:
      - CI007
      - CI011
      - CI012
      - CI014
  - calloutType: insight
    title: Fresh capital buys learning time, not financial validation
    body: >-
      The Series B gives Cowboy room to pursue the architecture through 2026-28
      milestones, but the commercial and unit-economics case still depends on
      evidence the public sources do not yet provide.
    claimRefs:
      - CI001
      - CI004
      - CI013
      - CI014
