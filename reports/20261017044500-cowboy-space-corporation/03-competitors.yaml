company:
  name: Cowboy Space Corporation
chapter:
  number: 3
  title: Competitors
  summary: The assigned pool supports Cowboy Space's differentiation thesis more strongly than it supports
    a hard named-peer benchmark. Public evidence points to terrestrial AI infrastructure as the clearest
    current substitute, while orbital entrants remain mostly filing-, concept-, or similarity-stage in
    the available record.
sections:
- id: landscape-definition
  title: 'Competitive set: substitutes are clearer than direct peers'
  body: The assigned pool supports a broader alternative set more convincingly than a tight named peer
    list. Cowboy's own materials position the company as an integrated launch, power, and orbital-compute
    stack, while independent coverage repeatedly frames the real incumbent alternative as terrestrial
    AI infrastructure constrained by grid, water, and permitting bottlenecks rather than by a mature orbital
    rival set. The clearest named external reference in the pool is Caplight's comparable list, which
    surfaces Starcloud, Relativity Space, and Orbital Inc. as business-model neighbors, but without enough
    disclosed operating detail to treat them as proven heads-up competitors. In practice, the public record
    here says buyers can already buy terrestrial compute, can watch filing-stage orbital entrants, and
    cannot yet compare Cowboy against a richly disclosed set of orbital vendors.
  claimRefs:
  - CP001
  - CP006
  - CP010
  - CP014
  tableRefs:
  - TP001
- id: differentiation-and-switching
  title: Differentiation rests on integration, but switching frictions still favor the status quo
  body: 'Cowboy''s differentiation story is not software breadth or channel access; it is architecture.
    The company says its launch vehicle, power system, and compute payload are designed together so that
    the upper stage becomes a one-megawatt data center in orbit. That could create a moat if orbital power
    economics, thermal management, and launch cadence all work at commercial scale. The problem is that
    the same integration leaves current buyers with a large switching burden: unlike terrestrial hyperscale
    capacity, the product in the assigned pool is not yet an approved, operating service with public pricing,
    customer references, or contract structure. The result is a competitive stance where Cowboy may be
    more differentiated than a generic aerospace startup, but less substitutable today than the terrestrial
    status quo it hopes to displace.'
  claimRefs:
  - CP002
  - CP007
  - CP010
  - CP015
  tableRefs:
  - TP002
  figureRefs:
  - FP001
- id: durability-and-open-gaps
  title: Moat durability is thesis-stage because commercial proof is still thin
  body: 'The most durable moat element visible in the assigned evidence is concept-level vertical integration,
  not verified commercial lock-in. Independent coverage highlights competition for scarce technical
  talent, and adverse reporting stresses unresolved
    thermal and debris questions plus unfinished satellite design. Those facts do not invalidate the strategy,
    but they do mean moat durability remains thesis-stage until Cowboy converts its architecture into
    approved operations, customer wins, and a disclosed commercial package. The chapter therefore supports
    a limited judgment: Cowboy is differentiated in concept and ambition, yet the current public record
    is too thin to benchmark realized pricing, buyer preference, or multi-homing behavior against named
    peers.'
  claimRefs:
  - CP005
  - CP011
  - CP012
  - CP016
  tableRefs:
  - TP003
