        title: Exhibits
        blocks:
          - type: callout
            title: The highest rumored pricing needs private proof, not public enthusiasm
            body: >-
              At $50B–$71B, the central problem is not whether DeepSeek matters. It is whether the available evidence
              justifies paying for elite economics that have not yet been shown publicly.
