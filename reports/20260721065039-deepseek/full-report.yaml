      - number: '1.5'
        title: Milestones, market impact, and carry-forward diligence gaps
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's trajectory from founding to prospective $50 billion-plus private company in 36 months is
              anchored by compute advantage from High-Flyer's cluster, elite researcher talent from Zhejiang University,
              and a deliberate open-source strategy that earned grassroots adoption globally. Sensor Tower data
              quantifies the viral response to R1: daily active users grew more than 700% week-over-week in the period
              January 22-28, 2025; the app accumulated over 23 million global downloads in 19 days—more than twice
              ChatGPT's download pace at equivalent maturity. Bloomberg data from October 2025 shows DeepSeek beating
              OpenAI and Google in Africa. As of June 2026 DeepSeek accounted for approximately 23% of enterprise AI
              token traffic on the Vercel platform. Key adverse signals that later chapters must develop include: (1)
              Anthropic's February 2026 accusation of industrial-scale distillation attacks using 24,000 fraudulently
              created accounts and 16 million exchanges; (2) an OpenAI Congressional memo alleging ongoing IP theft; (3)
              US NDAA FY2026 restrictions on government use of DeepSeek; (4) Australia's government-wide DeepSeek ban;
              and (5) Stanford HAI's observation that DeepSeek is noticeably opaque when it comes to privacy protection,
              data-sourcing, and copyright. The company does not disclose revenue, gross margin, customer count, churn
              data, compute burn, or audited financials. Later chapters should independently test product-market fit,
              customer quality, compute economics, regulatory exposure, and IPO readiness.
