      - number: '7.3'
        title: >-
          People, execution, and mitigation: fast iteration is valuable, but it creates fragile coordination
          requirements
        blocks:
          - type: paragraph
            body: >-
              Execution risk at DeepSeek is not just about shipping fast; it is about coordinating research, product,
              policy, and channels under intense scrutiny. CNBC’s June 2026 reporting that investors were asked not to
              poach staff suggests that talent retention is strategic enough to be written into financing dynamics. The
              V3.1 release note shows how quickly DeepSeek can update models, modes, API mappings, pricing cadence, and
              agent features, which is impressive from a product perspective but risky from a change-management
              perspective. Fast iteration raises the cost of documentation drift, user confusion, and
              backwards-compatibility mistakes. External ecosystem pressure adds another layer. State of AI says China’s
              open-weights ecosystem is strengthening, while Volcengine, Baidu Qianfan, Kimi, and MiniMax materials show
              how quickly peers are building adjacent routes for customers. That means DeepSeek has to manage internal
              execution while the external market keeps moving. The right way to think about mitigation is therefore
              conditional, not absolute. Some risks can be reduced through better disclosures, stronger safeguards, and
              more disciplined release management. Others—like geopolitical trust gaps or export-control regimes—must
              simply be monitored as thesis-break conditions. Investors should assume DeepSeek can mitigate many
              operational risks, but not that it can fully control the policy environment around it. Execution risk
              compounds quickly across teams. DeepSeek has at least published a first-party model-mechanism disclosure
              aimed at transparency and safer use, which is not a full assurance regime but does show some mitigation
              intent in public.
