    title: Investment KPI scorecard
    type: kpi
    layout: wide
    summary: >-
      IC-style scorecard summarizing why DeepSeek is attractive enough to follow but too opaque to underwrite
      aggressively at the highest rumored prices.
    data:
      items:
        - label: Market opportunity
          value: 9 / 10
