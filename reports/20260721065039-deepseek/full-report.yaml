              infrastructure channels. Vercel’s June 2026 production index said DeepSeek’s share of routed tokens jumped
              from under 1% to 17% in a month while spend stayed near 1%; OpenRouter said DeepSeek doubled token share
              from 9% to 18% over the first half of 2026 and that agentic workloads drove much of the gain. These
              signals matter because they move the story from hype to repeated production routing. Meanwhile AWS, Azure,
              Google Cloud, NVIDIA, and Vercel all acted as named proof points that DeepSeek is being packaged for
              downstream users in mainstream developer and enterprise environments. Publicly visible expansion is
              therefore most credible as channel expansion and workflow expansion, not as disclosed named-account
              expansion. That distinction matters because routed usage is much closer to monetizable customer behavior
