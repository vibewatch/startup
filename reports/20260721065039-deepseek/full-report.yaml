      - number: '8.3'
        title: 'Recommendation and diligence asks: track or research more, not blind underwriting'
        blocks:
          - type: paragraph
            body: >-
              The public-evidence recommendation is to track DeepSeek or continue research rather than underwrite the
              company aggressively at the upper end of reported pricing. At roughly $50 billion, the company may still
              be arguable as a scarcity asset if an investor has privileged access to the data room and believes the
              channel and quality story will translate into durable revenue. At roughly $71 billion, the burden of proof
              becomes much higher. The key reason is not that the market opportunity is small; it is that the evidence
              quality is still far below what such pricing would ordinarily demand. Conference Board and ban-tracker
              sources show that policy and trust concerns remain real. CNIPA’s filing notice and the privacy-policy
              disclosures reinforce the idea that non-technical issues can influence value creation. Before committing
              capital, investors need customer concentration, revenue quality, cohort retention, gross margin, and
              compute-sourcing data. If those numbers are excellent, DeepSeek could deserve a premium. If they are
              merely good, today’s reported valuations are likely stretched. That is why the current recommendation is
              cautious curiosity rather than conviction capital. Public momentum should be treated as an input, not a
              verdict. Caution is warranted.
            claimRefs:
