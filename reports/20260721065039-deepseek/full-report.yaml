      - number: '1.4'
        title: Model architecture and product surface
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's product thesis is releasing best-in-class open-weight models with detailed technical papers and
              an affordably priced API. The first releases in late 2023—DeepSeek-Coder (November 2023) and DeepSeek-LLM
              67B—established the laboratory as a credible Chinese alternative to US open-source models. The pivotal
              architectural breakthrough was DeepSeek-V2 (May 2024), which deployed Multi-head Latent Attention (MLA)
              and a sparse Mixture-of-Experts design that reduced KV cache memory to 5-13% of standard Multi-Head
              Attention, slashing inference costs. V2 priced API access at 1 RMB per million tokens—roughly one-seventh
              of Llama 3 70B cost at the time—igniting a China AI price war that forced ByteDance, Baidu, Tencent, and
              Alibaba to cut rates. DeepSeek-V3 (December 2024) scaled the architecture to 671 billion total parameters
              with 37 billion active per token, trained on 14.8 trillion tokens; CSIS placed the final pre-training
              compute cost at roughly $5.6 million using H800 chips. DeepSeek-R1 (January 20, 2025) matched or exceeded
              OpenAI o1 on multiple benchmarks and triggered the DeepSeek Monday market event. The R1 methodology paper
              was published in Nature (volume 645, pages 633-638, 2025). DeepSeek-V4 (April 24, 2026) introduced V4-Pro
              with 1.6 trillion total parameters and a 1 million-token context window. As of the run date the API offers
              deepseek-chat at $0.07 per million input tokens. Model weights are freely downloadable from GitHub and
              Hugging Face; models are available via AWS, Azure, Google Vertex AI, and NVIDIA NIM.
            claimRefs:
