  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Legal and regulatory risk: privacy, jurisdiction, bans, and IP disputes are the front line'
        blocks:
          - type: paragraph
            body: >-
              DeepSeek’s legal and regulatory risk is unusually visible in public materials. Its own privacy policy says
              it applies to DeepSeek apps, websites, software, and related services, identifies Hangzhou DeepSeek
              Artificial Intelligence Co., Ltd. as the controller, and says personal data is directly collected,
              processed, and stored in the PRC to provide services. Its terms of use say services may change, vary by
              jurisdiction, or be suspended or terminated as laws, regulations, or technology evolve. Those facts would
              matter for any global AI startup, but they matter more here because multiple public sources document
              government restrictions tied to privacy and national-security concerns. TechCrunch, CNA, Al Jazeera, and
              the Conference Board all describe bans or restrictions by countries, agencies, or state and federal
              bodies. On top of this, CNBC and FDD summarize allegations around model distillation or IP misuse, while
              CNIPA’s trademark notice shows that the DeepSeek brand itself became a target for opportunistic
              registrations. The overall legal/regulatory read is not merely “China exposure.” It is a stack of
              overlapping issues: cross-border trust, public-sector exclusion risk, evolving AI governance, and the
              possibility that legal narratives travel faster than technical rebuttals. That stack can affect both
              procurement and valuation simultaneously.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
