          detail: GitHub and Hugging Face broaden evaluation and self-hosting.
          tone: positive
        - id: partner
          label: Partner distribution
          detail: AWS, Azure, Google Cloud, NVIDIA, and gateways widen enterprise reach.
          tone: positive
        - id: users
