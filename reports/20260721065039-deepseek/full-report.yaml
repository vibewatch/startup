  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from strategic scarcity and demand proof through a large discount for missing operating
      metrics and policy risk.
    data:
      nodes:
        - id: scarcity
          label: Strategic scarcity
          detail: DeepSeek is a globally noticed Chinese AI lab with real demand proof.
          tone: positive
        - id: demand
          label: Demand / adoption proxies
          detail: Vercel, OpenRouter, and app signals support market relevance.
          tone: positive
        - id: opacity
          label: Disclosure opacity
          detail: No audited revenue, margin, burn, or retention data.
          tone: warning
        - id: policy
          label: Policy / trust discount
          detail: Bans, privacy concerns, and filing-based brand issues weigh on value.
          tone: warning
        - id: recommend
          label: Track / research more
          detail: Premium interest is justified; premium entry pricing is not yet justified on public evidence.
          tone: warning
      edges:
        - from: scarcity
          to: recommend
        - from: demand
          to: recommend
        - from: opacity
          to: recommend
        - from: policy
          to: recommend
    approximationNotes: null
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV027
      - CV028
      - CV029
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Valuation is most sensitive to missing financial proof and policy discount, not to macro TAM alone.
    data:
      items:
        - label: Revenue quality disclosure
          value: 10
          note: Most powerful upside or downside driver.
        - label: Retention / concentration data
          value: 9
          note: Durability evidence can move value sharply.
        - label: Policy / trust discount
          value: 8
          note: Reachable demand can change quickly.
        - label: Channel dependence
          value: 7
          note: Intermediated demand deserves a haircut.
        - label: Strategic scarcity premium
          value: 7
          note: Explains why premium still exists.
        - label: Macro market growth
          value: 5
          note: Supportive backdrop but not enough alone.
    approximationNotes: Scores are ordinal importance weights for the valuation case, not regression outputs or probability estimates.
    claimRefs:
