        blocks:
          - type: paragraph
            body: >-
              The capital story is easier to observe than the operating statement. Forbes and Fortune both tie
              DeepSeek’s early funding capacity to founder Liang Wenfeng and the wealth created through High-Flyer,
              which means the company appears to have started with unusual founder financing for an AI lab of this
              scale. By mid-2026, however, DeepSeek had clearly shifted from founder-only financing to external capital.
              TechCrunch reported in May that DeepSeek’s first investment round could value it at $45 billion; CNBC
              reported in June that the first outside round had closed above $50 billion; and TechCrunch reported in
              July that the company was exploring roughly $1.5 billion in additional funds at about a $71 billion
              valuation after a reported $7 billion raise only a month earlier. CB Insights adds further but partly
              conflicting metadata, listing DeepSeek as a Series A company with $7.546 billion total raised. The common
              conclusion is that DeepSeek is no longer capital-constrained in the near term if those reports are
              directionally right. The harder question is runway. No reviewed source gives audited cash, monthly burn,
              gross margin, or infrastructure commitments. For a company shipping frontier-scale models at low prices,
              that missing operating disclosure is the single biggest obstacle to underwriting whether the newly
