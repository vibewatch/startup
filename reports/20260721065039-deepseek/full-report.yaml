        title: 'Customer segments: self-serve users, developers, enterprise platform teams, and intermediaries all matter'
        blocks:
          - type: paragraph
            body: >-
              DeepSeek’s public customer base has to be inferred from product surfaces and adoption proofs rather than
              from a clean list of named enterprise logos. The first segment is self-serve users who discover DeepSeek
              through chat, the mobile app, or viral model releases. Sensor Tower and Appfigures show just how quickly
              that audience formed in early 2025. The second segment is developers and AI-native product teams using
              DeepSeek through direct APIs or through compatible routing layers. The third segment is enterprise
              platform teams who encounter DeepSeek inside cloud catalogs or managed AI platforms such as AWS, Azure,
              and Google Cloud. The fourth segment is intermediaries—gateways, clouds, and platform operators—that
              effectively become customers or channel customers because they route third-party demand through DeepSeek.
              This segmentation matters because adoption quality differs by segment. Consumer downloads prove awareness.
              Gateway token share proves production experimentation. Cloud catalog presence proves procurement
              accessibility. None of those alone prove sticky enterprise accounts, but together they show that
              DeepSeek’s customer footprint is broader than a single viral consumer moment. The company’s customer story
