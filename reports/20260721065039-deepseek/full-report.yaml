      - number: '7.2'
        title: 'Operational and platform risk: safety, reliability, and distribution dependencies are tightly coupled'
        blocks:
          - type: paragraph
            body: >-
              DeepSeek’s operational risk is inseparable from how it distributes and markets the product. CSIS’s adverse
              commentary emphasizes misuse and jailbreak concerns; DeepSeek’s own terms remind users not to treat
              outputs as professional advice and note that outputs can contain errors or omissions; and the privacy
              policy makes clear that developers using downstream applications sit outside some parts of DeepSeek’s
              direct privacy scope. These issues matter because DeepSeek is no longer just publishing papers—it is
              operating live services, partner-packaged offerings, and gateway-routed workloads. That makes reliability,
              documentation accuracy, and compatibility stability part of the risk surface. The public status page is a
              positive signal, but it does not substitute for an incident history or SLA record. Distribution also cuts
              both ways. AWS, Azure, Google Cloud, NVIDIA, and Vercel all expand enterprise access, yet each extra
              surface creates dependency on external packaging, governance, or pricing logic. Azure’s V4-Pro catalog
              page underscores the upside of managed support and unified billing, but it also shows how much of the
              enterprise operating context can sit with the platform rather than the model lab. The result is a risk
              profile where model quality, abuse resistance, service operations, and channel dependency reinforce one
              another.
