        blocks:
          - type: paragraph
            body: >-
              DeepSeek discloses enough to understand how money is supposed to flow even though it does not disclose the
              resulting revenue. The API docs say billing is token-based, distinguish cached from uncached inputs, and
              separate input from output pricing. That matters because it makes monetization usage-linked rather than
              subscription-linked: revenue scales with inference volume, model mix, output intensity, and cache
              behavior. The same pricing page shows two main V4 routes—Flash and Pro—with materially different unit
              prices and concurrency ceilings, implying deliberate segmentation between lower-cost, higher-throughput
              use cases and more demanding workloads. DeepSeek’s terms of use further indicate that fees are deducted
              from prepaid or gifted balances and that the company reserves the right to change prices. Those mechanics
              look more like a modern cloud API business than a consumer subscription startup. On top of direct API
              revenue, DeepSeek’s managed availability through Google Cloud, Azure, AWS, and gateways such as Vercel
              suggests additional monetization via channel traffic and enterprise routing. What remains unknown is the
              blend: public sources do not reveal how much revenue comes from direct API spend, indirect cloud channels,
              or free consumer usage that only later converts into paid demand. The official changelog also shows that
              model names and supported interfaces are being actively retired and replaced, which makes release
