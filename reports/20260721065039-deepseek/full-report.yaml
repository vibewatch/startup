    title: Financial pressure drivers
    type: bar
    layout: standard
    summary: >-
      The biggest financial questions are not demand, but whether DeepSeek can preserve margin, access compute, and
      retain talent while staying cheap.
    data:
      items:
        - label: Margin compression risk
          value: 9
          note: Low public list prices create limited room for cost surprises.
        - label: Compute / hardware risk
          value: 8
          note: Export controls and supply constraints can affect cost or capability.
        - label: Disclosure opacity
          value: 9
          note: No public revenue or burn metrics make underwriting difficult.
        - label: Channel margin dilution
          value: 7
          note: Partner distribution broadens reach but may lower take rate.
        - label: Talent-cost inflation
          value: 7
          note: Competition for researchers can raise compensation and retention spend.
        - label: Policy / IP overhang
          value: 6
          note: Legal or policy disputes can affect customer trust and cost structure.
    approximationNotes: Scores are ordinal risk weights based on public evidence, not modeled probabilities or quantified downside cases.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
  - id: FE001
