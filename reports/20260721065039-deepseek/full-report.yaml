      - number: '1.3'
        title: Capital structure, fundraising, and IPO trajectory
        blocks:
          - type: paragraph
            body: >-
              For the first two and a half years of its existence DeepSeek operated as a wholly owned unit of High-Flyer
              with no outside investors. A November 2024 ChinaTalk profile stated explicitly that Deepseek is fully
              funded by High-Flyer and has no plans to fundraise. The strategic shift came in the first half of 2026:
              the Financial Times reported that Liang Wenfeng opted to raise funds to offer employees shares, motivated
              by competitive talent poaching. Initial discussions in April 2026 were reported at approximately $10
              billion by Reuters and The Information; by May 2026 the FT and Bloomberg both cited a valuation that had
              soared from $20 billion to $45 billion within weeks of negotiations. The round closed in June 2026 at
              approximately $7 billion raised and a $50 billion valuation—the company's first-ever external funding. The
              lead investor was China's Integrated Circuit Industry Investment Fund (Big Fund), a state vehicle
              supporting domestic semiconductor and AI development. Tencent and Alibaba are confirmed participants; CB
              Insights also lists CATL and Guozhitou Private Equity Fund Management in the investor base. A notable
              governance term was a no-poach covenant protecting DeepSeek employees from investor portfolio companies.
              By July 14, 2026—one week before the run date—Bloomberg and TechCrunch reported DeepSeek in talks to raise
              a further $1.5 billion at approximately $71 billion valuation, ahead of a 2027 IPO target. The rapid
              valuation progression from $10 billion to $71 billion within three months reflects state-capital
              enthusiasm for sovereign AI and international adoption of DeepSeek models.
