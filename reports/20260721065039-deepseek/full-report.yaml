        title: Identity, mission, and legal form
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's legal entity is Hangzhou DeepSeek Artificial Intelligence Basic Technology Research Co., Ltd.
              (Chinese: 杭州深度求索人工智能基础技术研究有限公司), registered in Hangzhou, Zhejiang Province. The brand name 深度求索 (Shen Du
              Qiu Suo) means 'seek depth,' reflecting a research-first rather than product-first orientation. The
              company was incorporated on July 17, 2023, as a wholly owned subsidiary of High-Flyer Capital Management,
              the quantitative hedge fund controlled by founder Liang Wenfeng. DeepSeek's mission statement—'unraveling
              the mystery of AGI with curiosity'—does not invoke safety, competition, or societal stakes in the manner
              typical of US frontier labs, focusing instead on pure scientific inquiry. The official website
              (deepseek.com) and platform (platform.deepseek.com) present the company as a research organization
              releasing open-weight models, with an API platform priced intentionally close to cost. The company
              operates an AI chatbot at chat.deepseek.com and publishes technical papers and model weights publicly.
              Multiple independent sources confirm the Hangzhou incorporation; a Beijing operational presence is
              plausible but was not directly verified in fetched sources. As of the run date DeepSeek remains a private
              company preparing for a possible IPO in 2027.
