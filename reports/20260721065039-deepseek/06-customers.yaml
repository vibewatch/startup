- id: adoption-and-expansion
  title: 'Adoption and expansion: public usage proxies point to real demand and expanding deployment paths'
  body: The strongest customer evidence in the reviewed set comes from adoption proxies that measure real behavior. Sensor
    Tower says DeepSeek amassed roughly 23 million global downloads in its first 19 days, more than double ChatGPT’s comparable
    launch window, and that average mobile DAUs rose more than 700% week over week during the breakout period. Appfigures
    likewise said the app crossed one million downloads quickly and was about to challenge ChatGPT. Those mobile signals are
    top-of-funnel, not durable revenue proof, but they establish unusual customer acquisition speed. More recent evidence
    comes from infrastructure channels. Vercel’s June 2026 production index said DeepSeek’s share of routed tokens jumped
    from under 1% to 17% in a month while spend stayed near 1%; OpenRouter said DeepSeek doubled token share from 9% to 18%
    over the first half of 2026 and that agentic workloads drove much of the gain. These signals matter because they move
    the story from hype to repeated production routing. Meanwhile AWS, Azure, Google Cloud, NVIDIA, and Vercel all acted as
    named proof points that DeepSeek is being packaged for downstream users in mainstream developer and enterprise environments.
    Publicly visible expansion is therefore most credible as channel expansion and workflow expansion, not as disclosed named-account
    expansion. That distinction matters because routed usage is much closer to monetizable customer behavior than app-chart
    momentum alone.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
