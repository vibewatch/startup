  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: Gross retention, net revenue retention, logo retention, expansion rates, and any customer-satisfaction
      survey data by segment.
    whyItMatters: Without retention and satisfaction data, it is impossible to know whether DeepSeek’s visible adoption converts
      into durable, expanding customer economics.
    diligencePath: Request cohort retention tables, NRR/GRR by segment, churn reasons, and any NPS/CSAT outputs from management.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named paying-customer count, top-account concentration, direct-versus-channel revenue mix, and geography
      / sector concentration.
    whyItMatters: A broad top-of-funnel can still hide heavy dependence on a few channels, a few large accounts, or a narrow
      geography mix.
    diligencePath: Request a customer concentration memo with top-10 accounts, channel mix, and sector / geography splits.
    relatedQuestionRefs:
    - QU013
    - QU018
    - QU019
    - QU023
    relatedTableRefs:
    - TU005
