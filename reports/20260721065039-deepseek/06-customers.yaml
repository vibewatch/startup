chapter:
  number: 6
  title: Customers
  summary: 'DeepSeek has meaningful public adoption signals but very little traditional enterprise customer disclosure. The
    strongest evidence comes from usage proxies: rapid app downloads, rising gateway token share, and repeated cloud/catalog
    distribution. That supports a broad top-of-funnel and growing production experimentation base, but it leaves retention,
    enterprise concentration, and customer-quality questions materially open.'
sections:
- id: segments-and-proof
  title: 'Customer segments: self-serve users, developers, enterprise platform teams, and intermediaries all matter'
  body: DeepSeek’s public customer base has to be inferred from product surfaces and adoption proofs rather than from a clean
    list of named enterprise logos. The first segment is self-serve users who discover DeepSeek through chat, the mobile app,
    or viral model releases. Sensor Tower and Appfigures show just how quickly that audience formed in early 2025. The second
    segment is developers and AI-native product teams using DeepSeek through direct APIs or through compatible routing layers.
    The third segment is enterprise platform teams who encounter DeepSeek inside cloud catalogs or managed AI platforms such
    as AWS, Azure, and Google Cloud. The fourth segment is intermediaries—gateways, clouds, and platform operators—that effectively
    become customers or channel customers because they route third-party demand through DeepSeek. This segmentation matters
    because adoption quality differs by segment. Consumer downloads prove awareness. Gateway token share proves production
    experimentation. Cloud catalog presence proves procurement accessibility. None of those alone prove sticky enterprise
    accounts, but together they show that DeepSeek’s customer footprint is broader than a single viral consumer moment. The
    company’s customer story is therefore strong on breadth and weak on direct disclosure.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
