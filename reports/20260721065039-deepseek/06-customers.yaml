- id: retention-and-concentration
  title: 'Retention, concentration, and satisfaction: the biggest customer unknowns remain below the surface'
  body: Customer quality is where the public evidence gets thin. No reviewed source discloses net revenue retention, logo
    retention, cohort retention, NPS, or even a reconciled count of paying enterprise customers. That forces a distinction
    between visible demand and underwritten customer durability. Gateway and cloud signals imply repeat usage, because token
    share does not rise without some recurring workloads, but they do not reveal how concentrated that demand is among a few
    power users or intermediaries. Concentration risk is real for two reasons. First, much of DeepSeek’s visible enterprise
    reach runs through third-party platforms, meaning clouds and gateways can become critical channels. Second, regulatory
    and privacy concerns have already removed some public-sector and high-trust segments from the reachable customer pool,
    as TechCrunch, CNA, and Al Jazeera all document through bans and restrictions. The practical implication is that DeepSeek
    likely has a broad and fast-growing customer surface, but not yet a publicly legible customer-quality profile. The right
    diligence question is no longer “are people using DeepSeek?” Public evidence says yes. The harder question is whether
    usage is diversified, retained, expanding within accounts, and monetizing in a way that survives routing flexibility and
    policy friction. Public evidence still stops short of true account analytics.
  claimRefs:
