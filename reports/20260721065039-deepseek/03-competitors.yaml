chapter:
  number: 3
  title: Competitors
  summary: DeepSeek is no longer competing against one monolithic “Big Tech AI” cohort. Its real battlefield is a crowded
    multi-model market where frontier U.S. labs, Chinese open-weight peers, and cloud/platform intermediaries all shape price,
    reach, and switching costs. DeepSeek’s edge is unusually strong price-efficiency and open-weight credibility; its weakness
    is that many rivals are now copying the same compatibility, long-context, and low-price playbook.
sections:
- id: competitive-set
  title: 'Competitive set: frontier labs, Chinese peers, and platform intermediaries all matter'
  body: 'DeepSeek’s competitor map has to be segmented by business model, not just by benchmark score. The first layer is
    the frontier-lab set: OpenAI, Anthropic, and Google still define the premium end of the market, especially when enterprises
    prioritize trust, distribution breadth, and full-stack platform features over minimum price. The second layer is the Chinese
    open-weight and open-ish cohort—Alibaba/Qwen, Baidu/ERNIE via Qianfan, Z.ai/GLM, Moonshot/Kimi, and MiniMax—where the
    shared pattern is rapid model iteration, high API compatibility, and a strong willingness to compete on cost. CNBC’s January
    2026 survey of Chinese labs supports the idea that DeepSeek’s breakthrough accelerated an entire release cycle across
    domestic peers rather than creating a durable monopoly for one company. The third layer is the channel layer: Alibaba
    Cloud, AWS, Azure, and Google Cloud all shape buyer access by deciding which models appear inside managed catalogs and
    enterprise tooling. In that sense, some of DeepSeek’s most important “competitors” are really routing environments that
    lower search and switching costs for buyers. The resulting market is broader than a pure model bake-off and harsher than
    a normal startup-vs-incumbent frame. This also means any clean league table will miss the fact that buyers often compare
    channels, governance layers, and deployment convenience at the same time as model quality.'
