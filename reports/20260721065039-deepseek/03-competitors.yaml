- id: moat-and-switching
  title: 'Moat and switching dynamics: distribution helps, but multi-homing weakens lock-in'
  body: 'The strongest argument for DeepSeek’s competitive durability is that it has already crossed the hardest threshold
    in AI infrastructure markets: it is not merely benchmark-famous, it is present where developers and enterprises actually
    buy models. Google Cloud documents DeepSeek as a managed or self-deployed model option, Azure listed R1 in its model catalog,
    and AWS added DeepSeek-R1 to Bedrock Marketplace and SageMaker JumpStart. Those channel wins mean DeepSeek competes inside
    normal enterprise procurement paths instead of living only in a research community. The problem is that the same distribution
    rails also flatten moat. Alibaba, Baidu, BigModel, and other Chinese platforms train buyers to expect multi-model access,
    evaluation, routing, and easy substitution. Artificial Analysis reinforces this by framing competition in quality, price,
    speed, and openness—not brand alone. As a result, DeepSeek’s defensibility comes less from exclusivity and more from repeating
    a difficult but fragile formula: stay near the frontier on reasoning and coding while remaining obviously cheaper than
    premium labs and still differentiated enough from lower-cost Chinese peers. That is a real advantage today, but it is
    a moving target rather than a permanent moat. The company therefore competes in a market where distribution is necessary
    but never sufficient. Buyers can switch astonishingly fast. Daily.'
