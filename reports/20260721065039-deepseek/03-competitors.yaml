- id: TP004
  title: Substitutes and adjacent competitors table
  columns:
  - substitute or adjacent force
  - example set
  - why buyers consider it
  - pressure on DeepSeek
  - assessment
  rows:
  - - Premium frontier APIs
    - OpenAI, Anthropic, Gemini
    - Higher trust, support, and ecosystem depth
    - Can pull regulated or high-stakes workloads away from DeepSeek
    - DeepSeek must keep quality close enough that price matters
  - - Chinese low-cost model peers
    - Qwen, Kimi, MiniMax, GLM
    - Similar price-conscious buyer base and rapid release cadence
    - Compresses price umbrella and differentiation
    - This is DeepSeek’s hardest day-to-day battle
  - - Cloud model catalogs
    - AWS, Azure, Google Cloud, Alibaba catalogs
    - Make comparison easy inside existing procurement paths
    - Turn DeepSeek into one option among many
    - Good for reach, bad for exclusivity
  - - Developer gateways and routing layers
    - Vercel AI Gateway, OpenRouter
    - Optimize traffic to whichever model is best at the moment
    - Can redirect usage quickly when relative value changes
    - Rewards short-cycle performance improvement
  - - Internal or fine-tuned enterprise stacks
    - In-house tuned models on top of third-party bases
    - Reduce dependence on any one vendor
    - Shrink addressable recurring spend for general-purpose APIs
    - DeepSeek must remain the most economical foundation choice
  notes: These forces matter because many DeepSeek evaluations are actually “use DeepSeek versus route elsewhere” decisions,
    not clean one-vendor replacement decisions.
