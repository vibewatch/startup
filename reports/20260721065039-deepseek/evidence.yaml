evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: Audited financial statements including revenue, gross margin, and operating burn rate.
    whyItMatters: Without financials, valuation of $50-71B and IPO readiness cannot be independently verified.
    diligencePath: Monitor IPO prospectus or any pre-listing HKEX disclosure.
    relatedQuestionRefs:
      - QO029
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: Board composition, investor voting rights, and preference-stack terms.
    whyItMatters: Governance opacity prevents assessment of control risks, liquidation preferences, and founder dilution at IPO.
    diligencePath: Review investment agreement and any HKEX disclosure; contact investor relations.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: compute-infrastructure
    missingEvidence: Current compute infrastructure size and GPU count as of the run date.
    whyItMatters: >-
      Fire-Flyer 2 (5,000 A100s, 2021) confirmed; analysts estimate 50,000-plus Hopper GPUs but company has not
      confirmed; affects moat assessment.
    diligencePath: Seek post-2024 infrastructure announcements or regulatory compute disclosures.
  - type: missing-source
    severity: minor
    topic: founding
    missingEvidence: Beijing or other operating office distinct from Hangzhou registration.
    whyItMatters: >-
      Beijing presence would affect talent access and regulatory exposure but is not directly confirmed in reviewed
      sources.
    diligencePath: Request office lease or subsidiary registration confirmation.
    relatedQuestionRefs:
      - QO001
  - type: stale
    severity: material
    topic: leadership
    missingEvidence: Current headcount and 2026 hiring strategy beyond the approximately 160 estimate from 2025.
    whyItMatters: 2025 estimate of ~160 may be outdated; post-funding hiring plans would affect cost and talent retention analysis.
    diligencePath: Seek LinkedIn headcount data or post-funding hiring announcements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: Complete investor roster, ownership percentages, board seats, and preference-stack terms for the June 2026 round.
    whyItMatters: >-
      Without confirmed investor rights and preference structure the governance implications of state-capital
      participation cannot be assessed.
    diligencePath: Review investment agreement or any HKEX IPO prospectus disclosure.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Internal milestones including compute build-out dates, hiring milestones, and partnership events not covered by
      public reporting.
    whyItMatters: >-
      Public milestone chronology may omit material events (compute upgrades, office openings, early investor
      conversations) that affect the narrative.
    diligencePath: Request internal company chronology or board materials via investor relations.
    relatedTableRefs:
      - TO005
  - type: missing-source
    severity: material
    topic: deepseek-specific market share
    missingEvidence: A company or investor disclosure showing DeepSeek’s direct revenue share by workload or segment.
    whyItMatters: Macro TAM numbers do not show how much of the routed inference market DeepSeek actually captures economically.
    diligencePath: Request revenue-by-channel, gateway-partner data, and direct enterprise cohort data from management or investors.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: enterprise buyer mix
    missingEvidence: A segmented list of DeepSeek’s top enterprise use cases, verticals, and contract sizes.
    whyItMatters: >-
      Without buyer mix, it is hard to separate durable production adoption from opportunistic traffic chasing low
      prices.
    diligencePath: Request anonymized top-customer segmentation and win/loss analysis from the company or major platform partners.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      A consistent, audited cross-vendor revenue- or token-share dataset covering enterprise and developer usage across
      major model providers.
    whyItMatters: >-
      Without real share data, positioning judgments remain directional and cannot cleanly distinguish hype, usage, and
      monetization.
    diligencePath: >-
      Request gateway logs, cloud-catalog usage data, or investor-market-share datasets that normalize workloads across
      vendors.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: feature-matrix scope
    missingEvidence: >-
      Additional evidence on less-visible Chinese rivals, open-source substitutes, and region-specific deployments not
      covered in the top-comparison matrix.
    whyItMatters: >-
      The competitive field is wider than the eight vendors summarized here, so the matrix is a comparison lens rather
      than a complete market census.
    diligencePath: Expand the matrix with workflow-specific substitutes once target buyer segments and geographies are narrowed.
    relatedQuestionRefs:
      - QP001
      - QP004
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin
    missingEvidence: >-
      Audited revenue, gross margin, model-tier mix, and customer/channel revenue concentration for the last twelve
      months.
    whyItMatters: >-
      Without real revenue and margin disclosure, investors cannot judge whether DeepSeek’s low-price strategy is
      economically durable or merely adoption-maximizing.
    diligencePath: >-
      Request management accounts showing revenue by channel, gross margin by model tier, and top-customer
      concentration.
    relatedQuestionRefs:
      - QI012
      - QI025
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: Cash balance, monthly burn, committed compute spend, and capital-expenditure or reserved-capacity obligations.
    whyItMatters: Reported financing size is meaningful only in the context of actual burn and infrastructure commitments.
    diligencePath: >-
      Request the latest cash bridge, infrastructure contracts, and monthly burn trend from finance leadership or
      investors.
    relatedQuestionRefs:
      - QI019
      - QI020
    relatedTableRefs:
      - TI003
      - TI004
  - type: private-evidence-only
    severity: material
    topic: internal-qa-and-safety
    missingEvidence: >-
      Public or investor-grade disclosure of red-team results, reliability incident rates, evaluation methodology, and
      rollback governance across major model releases.
    whyItMatters: >-
      A frontier model can look strong in public artifacts while still failing at the operational discipline required
      for sustained enterprise deployment.
    diligencePath: Request model-evaluation packs, incident postmortems, release checklists, and internal reliability dashboards.
    relatedQuestionRefs:
      - QE016
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: infrastructure-architecture
    missingEvidence: >-
      A detailed systems architecture covering training/inference stack, capacity planning, serving orchestration, and
      partner-delivery responsibilities.
    whyItMatters: >-
      Without infrastructure detail, it is hard to judge whether DeepSeek’s low-price product surface is supported by
      durable technical economics and operational redundancy.
    diligencePath: >-
      Request architecture diagrams, deployment responsibility matrices, and capacity-planning materials from
      engineering leadership.
    relatedQuestionRefs:
      - QE013
      - QE022
      - QE023
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: >-
      Gross retention, net revenue retention, logo retention, expansion rates, and any customer-satisfaction survey data
      by segment.
    whyItMatters: >-
      Without retention and satisfaction data, it is impossible to know whether DeepSeek’s visible adoption converts
      into durable, expanding customer economics.
    diligencePath: Request cohort retention tables, NRR/GRR by segment, churn reasons, and any NPS/CSAT outputs from management.
    relatedQuestionRefs:
      - QU014
      - QU015
      - QU017
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Named paying-customer count, top-account concentration, direct-versus-channel revenue mix, and geography / sector
      concentration.
    whyItMatters: >-
      A broad top-of-funnel can still hide heavy dependence on a few channels, a few large accounts, or a narrow
      geography mix.
    diligencePath: Request a customer concentration memo with top-10 accounts, channel mix, and sector / geography splits.
    relatedQuestionRefs:
      - QU013
      - QU018
      - QU019
      - QU023
    relatedTableRefs:
      - TU005
