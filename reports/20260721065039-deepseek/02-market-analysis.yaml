tables:
- id: TM001
  title: Market definition table
  columns:
  - segment / category
  - included spend
  - excluded spend
  - buyer / payer
  - relevance to DeepSeek
  rows:
  - - Frontier model and inference spend
    - Token-metered API usage, reasoning calls, tool use, long-context inference
    - Raw GPU infrastructure purchases and unrelated cloud workloads
    - Developers, AI product teams, platform engineering
    - Core near-term monetization rail for DeepSeek
  - - AI platforms and routing layers
    - Evaluation, governance, observability, usage tracking, application-development tools
    - Pure model-research spending without deployment software
    - Enterprise AI platform owners, CIO/CTO budgets
    - Important because DeepSeek can win usage inside third-party platforms
  - - Agentic and coding workloads
    - Long-horizon task execution, coding agents, tool-driven reasoning
    - Simple chatbot traffic that never becomes production work
    - Developers, enterprise automation teams
    - DeepSeek’s low-cost reasoning position is most valuable here
  - - Consumer and prosumer AI applications
    - Chat subscriptions, app usage, creator experimentation, self-serve web traffic
    - General entertainment spending without AI dependence
    - End users and small teams
    - Drives awareness and top-of-funnel adoption, but not necessarily durable revenue
  - - Status-quo substitutes
    - Human labor, incumbent SaaS, incumbent U.S. model APIs, internal models
    - n/a
    - Existing product and operations budgets
    - Determines whether DeepSeek expands spend or merely displaces another vendor
  notes: The chapter uses a four-pool market definition plus status-quo substitutes to avoid overstating DeepSeek’s serviceable
    market.
