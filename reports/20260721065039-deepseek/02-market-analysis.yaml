- id: drivers-constraints
  title: 'Growth drivers and constraints: efficiency is the unlock, but it also drives commoditization'
  body: 'DeepSeek benefits from the most important current market driver: buyers want more AI output without accepting frontier-lab
    pricing. Vercel’s June 2026 production index and OpenRouter’s adoption note both show the same pattern—customers are willing
    to route substantial production token volume to lower-cost models if those models clear quality thresholds. DeepSeek’s
    pricing page, MiniMax’s pay-as-you-go pricing, Kimi’s 256k long-context positioning, and Anthropic’s premium pricing stack
    all show why the market is segmenting by routing strategy instead of converging on one winner. At the same time, the same
    forces that help DeepSeek also cap its moat. State of AI says competition has intensified and that China’s DeepSeek, Qwen,
    and Kimi have closed the gap on reasoning and coding; Artificial Analysis emphasizes that buyers can compare quality,
    price, speed, and openness side by side; and Alibaba’s model studio literally merchandises third-party models in one place.
    Regulation and geopolitics add another constraint layer. The MOFCOM export-control framework and China-specific domestic-silicon
    ambitions discussed in State of AI both mean DeepSeek operates in a market where the technology can spread quickly but
    trust, policy, and supply access still shape who can buy at scale. The result is a market with extraordinary demand and
    equally extraordinary commoditization pressure.'
