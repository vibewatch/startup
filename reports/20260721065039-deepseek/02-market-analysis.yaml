- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Low-cost frontier-quality reasoning
    - positive
    - now
    - Lets DeepSeek win production volume where frontier-lab pricing is hard to justify
    - How stable is quality on target workloads after buyer-specific evals?
  - - OpenAI / Anthropic API compatibility
    - positive
    - now
    - Reduces migration friction and lowers integration cost
    - What percentage of production traffic comes from drop-in compatibility migrations?
  - - Multi-cloud and platform distribution
    - positive
    - now
    - Expands reach through Azure, AWS, Google, Alibaba, NVIDIA, and gateway layers
    - Which channels drive the most net-new paid usage?
  - - Enterprise spend scrutiny
    - mixed
    - now
    - Favors measurable value and routing tools, not just raw model quality
    - Can DeepSeek or its partners provide observability, policy, and cost controls?
  - - Open-weight competition from Chinese peers
    - negative
    - now
    - Qwen, GLM, Kimi, MiniMax, and others reduce pricing power
    - What workloads remain differentiated enough to support durable margins?
  - - Platform merchandising of third-party models
    - negative
    - now
    - Makes buyer multi-homing normal and reduces lock-in
    - Does DeepSeek own end-customer relationships or merely occupy a catalog slot?
  - - Power and compute infrastructure constraints
    - mixed
    - now to 24 months
    - Rising usage helps model demand but keeps inference and supply economics strategic
    - What compute sources and domestic alternatives support scaling?
  - - Privacy and China-policy concerns
    - negative
    - now to 36 months
    - Can slow international enterprise adoption despite strong price-performance
    - Which geographies or regulated sectors are effectively closed today?
  - - Export-control and silicon geopolitics
    - negative
    - now to 36 months
    - Could constrain access to leading hardware or amplify policy volatility
    - How dependent is future model quality on hardware that may be restricted?
  - - Specialized model growth
    - mixed
    - next 24 months
    - Domain-specific models can either widen DeepSeek’s TAM through partners or narrow generic-model value
    - Where should DeepSeek stay general-purpose versus partner into specialization?
  notes: DeepSeek’s biggest driver—cheap enough and good enough reasoning—is also the main source of price compression and
    moat erosion in this market.
  enumerationScope:
    coverage: exhaustive
    basis: The rows capture the dominant growth and friction vectors visible across the fetched market forecasts, pricing
