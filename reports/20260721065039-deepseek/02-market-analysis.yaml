callouts:
- calloutType: strength
  title: The market is rewarding “good enough to ship” far below frontier-lab cost
  body: Vercel and OpenRouter both show that once a model clears production quality thresholds, very low token prices can
    translate into real routing share quickly. That dynamic is the clearest market tailwind behind DeepSeek.
  claimRefs:
  - CM023
  - CM024
  - CM025
- calloutType: risk
  title: The same multi-model tooling that expands the market also weakens moat durability
  body: Alibaba Model Studio, BigModel, Baidu Qianfan, and cloud catalogs all normalize buyer multi-homing. DeepSeek can win
    usage, but the market structure makes permanent lock-in harder.
  claimRefs:
  - CM015
  - CM016
  - CM027
  - CM028
- calloutType: insight
  title: DeepSeek’s practical SAM is a routing slice, not the whole TAM
  body: The relevant question is not whether AI is large. It is how much of the low-cost, production-ready reasoning and agentic
    workload pool DeepSeek can hold before quality parity or policy friction shifts buyers again.
  claimRefs:
  - CM001
  - CM007
  - CM019
  - CM032
