chapter:
  number: 2
  title: Market Analysis
  summary: 'DeepSeek sells into a market that is simultaneously enormous and brutally price-sensitive: frontier-model and
    AI-platform spending is growing quickly, but open-weight competition, multi-cloud distribution, and API compatibility
    compress lock-in. The practical near-term opportunity is not “all AI”; it is cost-efficient reasoning and agent workloads
    inside developer, enterprise, and consumer funnels that can tolerate an open-weight vendor with China-linked policy exposure.'
sections:
- id: market-boundary
  title: 'Market boundary: DeepSeek competes in model spend, platform spend, and AI application budgets'
  body: DeepSeek should not be mapped to a single undifferentiated “generative AI market.” The fetched evidence supports at
    least four linked spending pools. First is frontier-model and API inference spend, where buyers compare price, latency,
    context, and model quality across labs. Second is AI-platform spend, where enterprises pay for evaluation, governance,
    routing, and application-development layers that make multiple models manageable in production. Third is agentic and coding
    workload spend, where long-context reasoning quality and tool use determine whether a cheap model is deployable or merely
    test-worthy. Fourth is consumer and prosumer AI application spend, where app downloads and subscriptions create a high-volume
    but lower-governance funnel. Gartner’s July 2026 forecast and Goldman Sachs’s $150 billion software-TAM lens both confirm
    that the total market is large, but neither number is the right near-term SAM for DeepSeek on its own. The better working
    definition is the subset of AI workloads where an open-weight, low-price, reasoning-capable model can clear the quality
    bar and where buyers are willing to multi-home across vendors. That boundary makes DeepSeek’s opportunity materially narrower
    than the headline TAM, but also much more actionable.
  claimRefs:
