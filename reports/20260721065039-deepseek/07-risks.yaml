    - New geography-specific restrictions
  - - Government and agency bans
    - TechCrunch, CNA, Al Jazeera, Conference Board document bans or restrictions
    - Shrinks public-sector and high-trust demand pools
    - high
    - Expansion of bans into allied or enterprise contexts
  - - IP / distillation allegations
    - CNBC and FDD summarize allegations by U.S. AI firms
    - Could create legal, reputational, or procurement friction
    - high
    - Formal complaints, litigation, or stronger public evidence
  - - Trademark / brand misuse
    - CNIPA rejected 63 “DEEPSEEK” trademark applications
    - Shows brand-protection and copycat pressure around the franchise
    - medium
