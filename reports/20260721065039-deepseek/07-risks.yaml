- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk area
  - plausible mitigation
  - what public evidence would improve confidence
  - kill criterion
  rows:
  - - Privacy / jurisdiction risk
    - Clarify regional controls, enterprise data handling, and compliance posture
    - More granular privacy, data-transfer, and enterprise-control disclosure
    - Major new government bans in core commercial markets
  - - Safety / misuse risk
    - Publish stronger guardrail, red-team, or abuse-response evidence
    - Public safety testing and incident-response transparency
    - Widely documented harmful-use incidents tied directly to DeepSeek
  - - Partner / channel dependency
    - Diversify channels and preserve direct customer relationships
    - Direct-customer case studies and channel-mix disclosure
    - Loss or suspension across major distribution rails
  - - Execution / release risk
    - Tighter versioning, changelog discipline, and deprecation communication
    - Consistent policy/docs/changelog hygiene over multiple releases
    - Repeated breaking changes that erode developer trust
  - - Talent risk
    - Retention programs and broader leadership bench
    - Evidence of stable senior bench beyond a few stars
    - Visible talent exodus from core research / platform teams
  - - Policy / export-control risk
    - Scenario planning and compute diversification
    - More detail on supply and deployment resilience
    - Restrictions that materially impair next-generation model progress
  notes: Kill criteria are thesis-break conditions for investors, not predictions that these events will happen.
  enumerationScope:
    coverage: exhaustive
    basis: Rows cover the mitigation levers and thesis-break conditions most relevant to DeepSeek’s combined legal, operational,
      dependency, and execution risks.
