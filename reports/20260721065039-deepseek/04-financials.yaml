- id: unit-economics-and-risk
  title: 'Unit economics and financial risk: DeepSeek may be efficient, but efficiency is not the same as durability'
  body: 'DeepSeek’s financial upside comes from the same fact pattern that creates its main risks. Low list prices and rapid
    adoption can create enormous token volume, as Vercel and OpenRouter suggest, but low prices also leave less room to absorb
    compute shocks, channel fees, or aggressive competitive discounting. DeepSeek’s public materials and partner listings
    indicate that it can monetize through direct APIs and cloud intermediaries, yet those channels also give customers more
    routing flexibility and make revenue less sticky. The cost side is harder still. CSIS, CNBC, and FDD all point to risk
    factors that matter financially even when they are described as policy or IP stories: export controls can affect hardware
    access, alleged distillation or IP disputes can raise legal and reputational costs, and bans or security concerns can
    close off high-trust customer segments. CNBC’s June report on a “no poaching” condition in the fundraise also highlights
    talent scarcity as an economic variable, not just an HR issue. DeepSeek may indeed be more efficient than many peers on
    a model-performance basis, but investors should not confuse technical efficiency with proven cash-generation durability.
    Without revenue disclosure, churn data, or burn data, the best public assessment is that DeepSeek has a visible monetization
    engine, substantial fresh capital, and a still-unproven ability to convert scale into defensible long-term economics.'
