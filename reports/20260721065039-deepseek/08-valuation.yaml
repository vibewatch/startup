- id: scenarios-and-sensitivity
  title: 'Scenarios and sensitivity: upside exists, but it depends on converting strategic scarcity into fundamentals'
  body: 'The bull case for DeepSeek is easy to state. Demand proxies from Vercel and OpenRouter suggest real production interest.
    Public pricing shows the company can position itself far below premium Western labs. China’s AI ecosystem continues to
    attract capital and public-market routes, as shown by MiniMax, Z.ai, and StepFun signals. If DeepSeek can keep improving
    technically while using new capital to scale channel reach and enterprise trust, a premium private valuation can be rationalized.
    The base case is more restrained: DeepSeek remains important, widely used, and strategically scarce, but most of the valuation
    is still narrative-heavy because revenue quality and margin durability remain hidden. The bear case is not that DeepSeek
    disappears. It is that public usage proves less monetizable than assumed, policy and trust headwinds cap reachable demand,
    and faster-moving peers compress the premium. Sensitivity is therefore dominated less by market-size arguments and more
    by four variables: monetization efficiency, channel dependence, policy friction, and evidence quality. Small changes in
    any one of those can move the fair-value band materially because the current public data set is thin relative to the headline
    valuation. In short, assumptions matter more than spreadsheets. The same company can look cheap or expensive depending
    on whether those missing variables come in elite or merely ordinary.'
  claimRefs:
