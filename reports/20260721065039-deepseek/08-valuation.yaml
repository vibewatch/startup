company:
  name: DeepSeek
chapter:
  number: 8
  title: Valuation
  summary: DeepSeek has earned a premium strategic narrative, but public evidence does not justify taking the highest reported
    valuations at face value. The company clearly has demand, technical relevance, and scarce positioning in China’s AI stack,
    yet it still lacks the audited revenue, retention, and margin data needed to underwrite a $50B–$71B entry with confidence.
    The most defensible public posture is therefore to track or research more at current rumored pricing, not to treat the
    round headline as intrinsically fair.
sections:
- id: valuation-method
  title: 'Valuation method: use reported rounds, public comps, and risk haircuts—not a false-precision DCF'
  body: 'A traditional intrinsic valuation is not defensible from the reviewed public record because the crucial inputs are
    missing. There is no audited revenue, no disclosed gross margin, no published burn, and no reliable customer-cohort data.
    What the public record does provide is a set of valuation anchors: DeepSeek was reported at roughly $45 billion in May
    2026, above $50 billion in June 2026, and about $71 billion in July 2026 financing talk. It also provides comparable-company
    signals for other Chinese model labs and distribution proxies showing why the market is willing to pay attention. That
    means the correct methodology is a triangulation exercise. Start with the reported market-clearing price range. Cross-check
    it against peer valuations and public listing signals for Moonshot, MiniMax, Z.ai, and StepFun. Then apply a discount
    for disclosure opacity, policy overhang, and the risk that routed usage does not convert cleanly into durable high-margin
    revenue. Analyst market-size sources such as Gartner, Goldman Sachs, and Artificial Analysis help explain why strategic
    premiums exist, but they do not by themselves justify the exact round price. The result is necessarily a range-based valuation
    judgment, not a single-point number. That conservative methodology matters because apparent precision would be misleading
    here.'
