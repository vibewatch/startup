  title: Funding round valuation progression
  type: bar
  layout: standard
  summary: DeepSeek's reported valuation climbed from an initial $10 billion estimate in April 2026 to $71 billion in July
    2026 discussions—a sevenfold increase in approximately three months—reflecting state capital enthusiasm and global model-adoption
    momentum.
