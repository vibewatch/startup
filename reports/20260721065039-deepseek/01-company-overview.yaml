callouts:
- calloutType: strength
  title: Compute heritage plus research discipline create an unusually durable moat
  body: DeepSeek's competitive foundation—a pre-built petaflop-class compute cluster from High-Flyer, an AGI-focused research
    culture, and a CEO who personally writes code—produced V3 and R1 at a fraction of US frontier-model training cost. The
    open-source strategy compounds this by building global developer loyalty and independent technical validation that no
    marketing budget can replicate. State-capital backing from the Big Fund further insulates the company from near-term commercial
    pressure.
  claimRefs:
  - CO007
  - CO009
  - CO011
  - CO013
  - CO021
  - CO023
- calloutType: risk
  title: IP theft allegations and government bans are material reputational and regulatory risks
  body: Two of the most prominent US AI labs—OpenAI and Anthropic—have publicly accused DeepSeek of extracting training data
    via distillation attacks, including a Congressional memo. The US NDAA FY2026 and Australia's government-wide directive
    both ban DeepSeek in government contexts. These actions collectively limit DeepSeek's enterprise addressable market in
    the US, Australia, and allied nations, and could influence public-market investor sentiment at IPO.
  claimRefs:
  - CO033
  - CO034
  - CO036
- calloutType: insight
  title: The $10B-to-$71B valuation arc in 90 days requires independent underwriting before IPO
  body: The rapid valuation escalation from Reuters's April 2026 $10B report to Bloomberg's July 2026 $71B figure reflects
    negotiated pricing dynamics rather than verified fundamentals. No audited revenue, gross margin, or customer-cohort data
    has been disclosed. The IPO process will require prospectus-level financial disclosure; investors should treat any pre-IPO
    secondary-market valuation as a negotiated number pending that disclosure, not a verified fair value.
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO022
  - CO039
- calloutType: recommendation
  title: Governance, financials, and compute economics remain entirely undisclosed
  body: Despite global prominence, no audited financial statements, cap-table detail, board composition, investor voting rights,
    preference-stack terms, or compute-cost breakdown has been made public. Key-person dependence on Liang Wenfeng is high,
    and approximately 160 employees is exceptionally lean for a frontier AI lab at DeepSeek's model scale. Later chapters
    must independently reconstruct financial and governance signals from indirect evidence.
  claimRefs:
  - CO008
  - CO039
