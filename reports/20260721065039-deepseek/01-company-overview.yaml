- id: founder-leadership-and-governance
  title: Founder, leadership, and governance
  body: 'Liang Wenfeng (born 1985 in Guangdong Province) is DeepSeek''s founder, CEO, and controlling shareholder. He studied
    AI and electrical engineering at Zhejiang University, earning a bachelor''s and master''s degree. This background is cited
    by multiple sources as directly relevant to DeepSeek''s technical research agenda and unusual for a quantitative hedge
    fund founder. Liang co-founded High-Flyer Capital Management in 2015, growing it into one of China''s top four quantitative
    hedge funds and accumulating compute infrastructure—most notably the Fire-Flyer 2 cluster of 5,000 A100 GPUs in 625 nodes—that
    enabled DeepSeek''s training runs. Multiple sources describe Liang as personally ''reading papers, writing code, and participating
    in group discussions every day,'' positioning him as a practitioner-CEO. As of May 2026 he controlled approximately 90%
    of the company; Bloomberg estimated his personal net worth at $36 billion in July 2026, making him the wealthiest AI model-company
    founder globally. Governance transparency is limited: no board composition, investor voting rights, preference-stack terms,
    or cap-table detail has been publicly disclosed. The company employed approximately 160 researchers as of 2025—an unusually
    lean team for a frontier AI laboratory—raising key-person and succession questions that the public record does not resolve.
    The decision to take outside investment in 2026 was reportedly driven by a desire to offer employees equity, motivated
    by competitive poaching of researchers by well-funded rivals.'
  claimRefs:
