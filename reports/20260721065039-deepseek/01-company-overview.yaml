company:
  name: DeepSeek
chapter:
  number: 1
  title: Company Overview
  summary: DeepSeek is a Hangzhou-based AI research laboratory founded on July 17, 2023 by hedge-fund billionaire Liang Wenfeng,
    founder of High-Flyer Capital Management. The company built global reputation for open-weight frontier models—most dramatically
    with the January 2025 R1 release, which erased roughly $589 billion of Nvidia market capitalisation on a single trading
    day and reached the top of the App Store in more than 140 countries. Its V3 model (December 2024) demonstrated that a
    671-billion-parameter mixture-of-experts architecture could be trained on 2.788 million H800 GPU-hours at a cost estimated
    near $5.6 million, challenging Western scaling orthodoxy. By July 2026 DeepSeek had closed a $7 billion debut funding
    round at roughly $50 billion valuation—led by China's Integrated Circuit Industry Investment Fund—and was in talks for
    a further $1.5 billion at a $71 billion mark, with an IPO targeting 2027. The overview is positive on technical differentiation,
    founder-market fit, and state-capital backing, but cautious on opaque governance, undisclosed financials, US and Australian
    government bans, and IP-theft allegations from Anthropic and OpenAI that remain contested but materially reputational.
sections:
- id: identity-mission-and-legal-form
  title: Identity, mission, and legal form
  body: 'DeepSeek''s legal entity is Hangzhou DeepSeek Artificial Intelligence Basic Technology Research Co., Ltd. (Chinese:
    杭州深度求索人工智能基础技术研究有限公司), registered in Hangzhou, Zhejiang Province. The brand name 深度求索 (Shen Du Qiu Suo) means ''seek depth,''
    reflecting a research-first rather than product-first orientation. The company was incorporated on July 17, 2023, as a
    wholly owned subsidiary of High-Flyer Capital Management, the quantitative hedge fund controlled by founder Liang Wenfeng.
    DeepSeek''s mission statement—''unraveling the mystery of AGI with curiosity''—does not invoke safety, competition, or
    societal stakes in the manner typical of US frontier labs, focusing instead on pure scientific inquiry. The official website
    (deepseek.com) and platform (platform.deepseek.com) present the company as a research organization releasing open-weight
    models, with an API platform priced intentionally close to cost. The company operates an AI chatbot at chat.deepseek.com
    and publishes technical papers and model weights publicly. Multiple independent sources confirm the Hangzhou incorporation;
    a Beijing operational presence is plausible but was not directly verified in fetched sources. As of the run date DeepSeek
    remains a private company preparing for a possible IPO in 2027.'
  claimRefs:
