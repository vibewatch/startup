chapter:
  number: 5
  title: Product & Tech
  summary: 'DeepSeek’s product stack is more complete than the “one viral model” narrative suggests. Public materials show
    a layered system: research releases, open-weight repositories, API endpoints compatible with leading standards, cloud-distributed
    managed offerings, and a steady cadence from V2 to V4/R1. The main technical question is no longer whether DeepSeek can
    ship capable models; it is whether it can sustain quality, safety, and infrastructure reliability while iterating this
    quickly at low price points.'
sections:
- id: product-surface
  title: 'Product surface: DeepSeek has become a platform, not just a model release'
  body: 'The reviewed product evidence shows a stack with multiple user entry points. DeepSeek’s public site and transparency
    page describe a sequence of major model releases rather than a single static flagship. The API docs show OpenAI- and Anthropic-compatible
    access, model-specific pricing, token usage mechanics, and productized features such as JSON output, tool calls, and context
    management. GitHub and Hugging Face pages for V2, V3, and R1 further indicate that DeepSeek treats open-weight distribution
    as part of the product strategy, not merely as a research side effect. That matters because it broadens the addressable
    user base: some customers want direct hosted inference, some want managed cloud access, and some want weights or papers
    to evaluate or self-deploy. Partner sources from AWS, Azure, Google Cloud, and NVIDIA show that DeepSeek’s product surface
    also extends into third-party distribution layers where enterprise users discover and test models. The result is a product
    architecture with several doors into the same core capability base. Technically, this is a strength because it multiplies
    adoption vectors. Operationally, it creates more contracts to maintain across compatibility, performance, reliability,
    and documentation. It also means product diligence has to look at packaging and ecosystem behavior, not only raw model
    quality. The privacy policy also makes clear that DeepSeek is running a continuing software service, not just posting
    weights, while the English transparency page functions as a public release ledger with model cards and report links.'
