    sections:
      - number: '1.1'
        title: 身份、使命与法律形式
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的法律实体为 Hangzhou DeepSeek Artificial Intelligence Basic Technology Research Co.,
              Ltd.（中文：杭州深度求索人工智能基础技术研究有限公司），注册地在浙江省杭州市。品牌名「深度求索」（Shen Du Qiu Suo）意为「向深处求索」，体现的是研究优先，而非产品优先。公司于 2023 年 7
              月 17 日成立，是创始人 Liang Wenfeng 控制的量化对冲基金 High-Flyer Capital Management 的全资子公司。DeepSeek 的使命表述是「以好奇心解开 AGI
              的奥秘」，不像美国前沿实验室常见表述那样强调安全、竞争或社会影响，而是聚焦纯粹科学探索。官网（deepseek.com）和平台（platform.deepseek.com）把公司呈现为一家发布开放权重模型的研究组织，并将
              API 平台定价刻意贴近成本。公司在 chat.deepseek.com 运营 AI
              聊天机器人，也公开发布技术论文和模型权重。多家独立来源确认其杭州注册；北京运营存在具有合理可能，但已抓取来源没有直接验证。截至本次报告运行日，DeepSeek 仍是一家私人公司，正在为 2027 年可能 IPO
              做准备。
