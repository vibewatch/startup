  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险：隐私、司法辖区、禁令和 IP 纠纷站在最前线
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的法律与监管风险在公开材料中异常清晰。其隐私政策称，该政策适用于 DeepSeek 应用、网站、软件及相关服务，并将 Hangzhou DeepSeek Artificial
              Intelligence Co., Ltd.
              认定为控制者，还称个人数据会在中国境内被直接收集、处理和存储，以提供服务。其使用条款称，随着法律、法规或技术演进，服务可能变化、因司法辖区而异，或被暂停、终止。任何全球 AI
              创业公司都必须重视这些事实，但在这里分量更重，因为多个公开来源记录了与隐私和国家安全担忧相关的政府限制。TechCrunch、CNA、Al Jazeera 和 Conference Board
              都描述了国家、机构或州及联邦主体的禁令或限制。在此之上，CNBC 和 FDD 总结了围绕模型蒸馏或 IP 滥用的指控，CNIPA 的商标通知则显示 DeepSeek
              品牌本身也成了机会主义注册目标。整体法律/监管判断不只是「中国暴露」。它是一组相互叠加的问题：跨境信任、公共部门排除风险、演进中的 AI 治理，以及法律叙事可能比技术反驳传播更快。这组问题可以同时影响采购和估值。
