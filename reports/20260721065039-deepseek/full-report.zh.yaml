  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分：自助用户、开发者、企业平台团队和中介都重要
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的公开客户基础必须从产品表面和采用证据中推断，而不是来自一份干净的企业客户名单。第一类是通过聊天、移动应用或病毒式模型发布发现 DeepSeek 的自助用户。Sensor Tower 和
              Appfigures 显示，2025 年初这类受众形成得非常快。第二类是通过直接 API 或兼容路由层使用 DeepSeek 的开发者和 AI 原生产品团队。第三类是企业平台团队，他们在
              AWS、Azure、Google Cloud 等云目录或托管 AI 平台中遇到 DeepSeek。第四类是中介——网关、云和平台运营商——它们实际上成为客户或渠道客户，因为它们把第三方需求路由给
              DeepSeek。这种分层重要，因为各细分的采用质量不同。消费者下载证明知名度；网关 token 份额证明生产试验；云目录存在证明采购可达性。单看任何一个都不能证明黏性的企业账户，但合在一起说明 DeepSeek
              的客户足迹比一次病毒式消费者时刻更宽。因此，公司客户故事的强项是广度，弱项是直接披露。
