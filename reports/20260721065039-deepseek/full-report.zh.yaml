            title: IP 盗取指控和政府禁令构成实质声誉与监管风险
            body: >-
              两家最受关注的美国 AI 实验室 OpenAI 和 Anthropic 已公开指控 DeepSeek 通过蒸馏攻击提取训练数据，其中包括一份国会备忘录。美国 NDAA FY2026
              和澳大利亚政府范围内的指令都禁止在政府场景中使用 DeepSeek。这些行动共同限制了 DeepSeek 在美国、澳大利亚及盟友国家的企业可服务市场，并可能影响 IPO 时公开市场投资者情绪。
