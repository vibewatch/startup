      - number: '2.3'
        title: 增长驱动与约束：效率打开市场，但也推动商品化
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 受益于当前最重要的市场驱动：买家想要更多 AI 输出，却不愿接受前沿实验室定价。Vercel 2026 年 6 月生产指数和 OpenRouter
              的采用说明都显示同一模式——只要低成本模型达到质量门槛，客户愿意把大量生产 token 流量路由过去。DeepSeek 定价页、MiniMax 按用量付费定价、Kimi 的 256k 长上下文定位，以及
              Anthropic 的高端定价栈，都说明市场正在按路由策略分层，而不是收敛到一个赢家。与此同时，帮助 DeepSeek 的同一股力量也会限制它的护城河。State of AI 称竞争已经加剧，中国的
              DeepSeek、Qwen 和 Kimi 在推理和编码上缩小了差距；Artificial Analysis 强调，买家可以把质量、价格、速度和开放性并排比较；Alibaba
              的模型工作室更是把第三方模型直接放在一个目录里售卖。监管和地缘政治又叠加了一层约束。State of AI 讨论的 MOFCOM 出口管制框架和中国特定的国产硅野心都意味着，DeepSeek
              所处市场里技术可以快速扩散，但信任、政策和供应获取仍会决定谁能规模化购买。结果是一个需求异常强、商品化压力同样异常强的市场。
