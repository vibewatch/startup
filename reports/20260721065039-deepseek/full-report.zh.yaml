      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Liang Wenfeng（1985 年生于广东省）是 DeepSeek 的创始人、CEO 和控股股东。他在浙江大学学习 AI 与电气工程，取得学士和硕士学位。多方来源认为，这一背景直接支撑 DeepSeek
              的技术研究议程；量化对冲基金创始人很少有这种履历。Liang 于 2015 年共同创立 High-Flyer Capital
              Management，将其做成中国四大量化对冲基金之一，并积累了计算基础设施——最典型的是 Fire-Flyer 2 集群，包含 625 个节点上的 5,000 块 A100 GPU，支撑了 DeepSeek
              的训练任务。多方来源称 Liang 本人每天都在「读论文、写代码、参加小组讨论」，因此更像一位实践型 CEO。截至 2026 年 5 月，他控制公司约 90% 股权；Bloomberg 在 2026 年 7
              月估计其个人净资产为 $36 billion，使他成为全球最富有的 AI 模型公司创始人。治理透明度有限：董事会构成、投资者投票权、优先股堆叠条款或股权结构表细节都没有公开披露。公司截至 2025 年约有 160
              名研究人员——按前沿 AI 实验室标准异常精简——也带来关键人物依赖和接班问题，公开记录并未给出答案。据报道，公司决定在 2026
              年引入外部投资，是为了向员工提供股权；背后动因是资金充足的竞争对手正在挖角研究员。
