      - number: '1.6'
        title: 图表与论据
        blocks:
          - type: callout
            title: 算力传承叠加研究纪律，形成异常持久的护城河
            body: >-
              DeepSeek 的竞争基础包括 High-Flyer 预先建好的 petaflop 级计算集群、面向 AGI 的研究文化，以及一位亲自写代码的 CEO。这些因素让 V3 和 R1
              的训练成本只有美国前沿模型的一小部分。开源策略进一步放大优势：它建立全球开发者忠诚度，也带来任何营销预算都复制不了的独立技术验证。Big Fund 的国家资本支持还让公司免受短期商业压力。
