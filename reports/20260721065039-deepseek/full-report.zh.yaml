      - number: '1.3'
        title: 资本结构、融资与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              成立后的前两年半，DeepSeek 作为 High-Flyer 的全资部门运营，没有外部投资者。ChinaTalk 在 2024 年 11 月的专访明确称，DeepSeek 完全由 High-Flyer
              出资，且没有融资计划。战略转向发生在 2026 年上半年：Financial Times 报道称，Liang Wenfeng 选择融资，是为了向员工发放股份，以应对激烈的人才挖角。Reuters 和 The
              Information 报道，2026 年 4 月的初步讨论估值约为 $10 billion；到 2026 年 5 月，FT 和 Bloomberg 都称估值在数周谈判中从 $20 billion 飙升至 $45
              billion。该轮融资于 2026 年 6 月完成，约融资 $7 billion，估值 $50 billion——这是公司首次外部融资。领投方为 China Integrated Circuit
              Industry Investment Fund（Big Fund），这是一只支持国内半导体和 AI 发展的国家基金。Tencent 和 Alibaba 已确认参投；CB Insights 还将 CATL 和
              Guozhitou Private Equity Fund Management 列入投资者名单。一个值得注意的治理条款是禁止挖角约定，保护 DeepSeek 员工不被投资者的被投公司挖走。到 2026 年 7
              月 14 日——距离本次报告运行日一周——Bloomberg 和 TechCrunch 报道称，DeepSeek 正在洽谈进一步融资 $1.5 billion，估值约 $71 billion，为 2027 年
              IPO 目标做准备。估值在三个月内从 $10 billion 推进到 $71 billion，反映了国家资本对主权 AI 的热情，也反映了 DeepSeek 模型的国际采用。
