  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值方法：看报道轮次、公开可比公司和风险折价，不做伪精确 DCF
        blocks:
          - type: paragraph
            body: >-
              传统内在价值估值无法由已审阅的公开记录支撑，因为关键输入缺失。没有经审计收入、未披露毛利率、没有公开烧钱速度，也没有可靠客户队列数据。公开记录能提供的是一组估值锚点：DeepSeek 在 2026 年 5
              月被报道估值约 $45 billion，2026 年 6 月超过 $50 billion，2026 年 7 月融资讨论约 $71
              billion。它还提供了其他中国模型实验室的可比公司信号，以及说明市场为何愿意关注的分发代理指标。因此，正确方法是三角校验。先看报道中的市场出清价格区间。再用 Moonshot、MiniMax、Z.ai 和
              StepFun 的同业估值和公开上市信号交叉检查。然后针对披露不透明、政策悬顶，以及路由用量未必能顺畅转化为持久高毛利收入的风险打折。Gartner、Goldman Sachs、Artificial
              Analysis 等分析师市场规模来源能解释战略溢价为何存在，但不能单独证明某一轮的精确价格合理。结论必然是区间估值判断，而不是单点数字。保守方法重要，因为这里的表面精确会误导。
