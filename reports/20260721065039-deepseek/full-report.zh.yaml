      - CR014
      - CR017
      - CR023
      - CR024
      - CR037
      - CR041
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: DeepSeek 的执行风险集中在一张依赖网络上，横跨人才、合作伙伴、政策和算力。
    data:
      nodes:
        - id: talent
          label: 核心人才
        - id: releases
          label: 快速发布节奏
        - id: partners
          label: 云 / 网关合作伙伴
        - id: compute
          label: 算力获取
        - id: privacy
          label: 隐私 / 司法辖区立场
        - id: resilience
          label: 运营韧性
        - id: reach
          label: 客户触达
      edges:
        - from: talent
          to: releases
        - from: releases
          to: resilience
        - from: partners
          to: reach
        - from: compute
          to: releases
        - from: privacy
          to: reach
        - from: resilience
          to: reach
    approximationNotes: null
    claimRefs:
      - CR020
      - CR026
      - CR030
      - CR031
      - CR034
      - CR040
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 投资建议来自战略稀缺性和需求证明，但缺失运营指标与政策风险需要打很大折扣。
    data:
      nodes:
        - id: scarcity
          label: 战略稀缺性
          detail: DeepSeek 是全球关注的中国 AI 实验室，也有真实需求证明。
          tone: positive
        - id: demand
          label: 需求 / 采用代理指标
          detail: Vercel、OpenRouter 和应用信号说明产品有市场分量。
          tone: positive
        - id: opacity
          label: 披露不透明
          detail: 没有经审计的收入、毛利率、烧钱速度或留存数据。
          tone: warning
        - id: policy
          label: 政策 / 信任折价
          detail: 禁令、隐私担忧和监管文件暴露的品牌问题都会压低价值。
          tone: warning
        - id: recommend
          label: 观察 / 继续研究
          detail: 溢价关注有理由；但公开证据还不足以支撑溢价入场价格。
          tone: warning
      edges:
        - from: scarcity
          to: recommend
        - from: demand
          to: recommend
        - from: opacity
          to: recommend
        - from: policy
          to: recommend
    approximationNotes: null
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV027
      - CV028
      - CV029
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值最敏感的是财务证据缺口和政策折价，而不是宏观 TAM 本身。
    data:
      items:
        - label: 收入质量披露
          value: 10
          note: 最强的上行或下行驱动因素。
        - label: 留存 / 集中度数据
          value: 9
          note: 持久性证据可能大幅推动估值。
        - label: 政策 / 信任折价
          value: 8
          note: 可触达需求可能迅速变化。
        - label: 渠道依赖
          value: 7
          note: 经中介传导的需求需要折价。
        - label: 战略稀缺性溢价
          value: 7
          note: 解释溢价为何仍然存在。
        - label: 宏观市场增长
          value: 5
          note: 背景有利，但单靠它不够。
    approximationNotes: 分数是估值判断中的序位重要性权重，不是回归输出或概率估计。
    claimRefs:
      - CV012
      - CV018
      - CV019
      - CV024
      - CV031
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 除非私下尽调发现强得多的基本面，否则基于公开证据的合理价值区间低于最高传闻价格。
    data:
      items:
        - label: 公开证据合理价值区间
          low: 35
          mid: 45
          high: 55
        - label: 据报道 2026 年 6 月定价参考
          low: 50
          mid: 50
          high: 50
        - label: 据报道 2026 年 7 月洽谈参考
          low: 71
          mid: 71
          high: 71
        - label: 乐观情景区间
          low: 60
          mid: 70
          high: 80
    approximationNotes: 这些区间是判断范围，锚定据报道的轮次价格、同业估值信号和风险折价。它们不是市场报价，也不是投资建议。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV029
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 这张 IC 风格评分卡概括了为什么 DeepSeek 值得跟踪；但在最高传闻价格下，信息太不透明，无法激进押注。
    data:
      items:
        - label: 市场机会
          value: 9 / 10
          note: AI 模型与平台需求庞大，仍在快速增长。
        - label: 产品 / 技术分量
          value: 9 / 10
          note: DeepSeek 显然已进入全球考量清单。
        - label: 采用证明
          value: 8 / 10
          note: 使用代理指标强劲，但仍是间接证据。
        - label: 收入可见度
          value: 2 / 10
          note: 公开资料中没有经审计收入或 ARR。
        - label: 留存可见度
          value: 2 / 10
          note: 没有公开的 NRR 或队列披露。
        - label: 政策 / 信任压制
          value: High
          note: 禁令和隐私担忧足以支持重大折价。
        - label: 估值立场
          value: Stretched
          note: 溢价价格超过当前公开证据质量能支撑的水平。
        - label: 建议
          value: Track / research more
          note: 只有私下披露显著改善，才应继续推进。
    claimRefs:
      - CV014
      - CV015
      - CV020
      - CV027
      - CV028
      - CV029
      - CV039
      - CV040
