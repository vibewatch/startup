  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：前沿实验室、中国同行和平台中介都重要
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的竞争版图必须按商业模式拆分，而不能只看基准分数。第一层是前沿实验室：OpenAI、Anthropic 和 Google
              仍定义市场高端，尤其在企业更看重信任、分发广度和全栈平台功能，而不是最低价格时。第二层是中国开放权重和偏开放群体——Alibaba/Qwen、通过 Qianfan 分发的
              Baidu/ERNIE、Z.ai/GLM、Moonshot/Kimi 和 MiniMax——共同模式是模型迭代快、API 兼容性高，并且很愿意打价格战。CNBC 2026 年 1
              月对中国实验室的调查支持一个判断：DeepSeek 的突破加速了整个国内同行的发布周期，而不是为单家公司创造持久垄断。第三层是渠道层：Alibaba Cloud、AWS、Azure 和 Google Cloud
              都通过决定哪些模型进入托管目录和企业工具来塑造买家访问。按这个意义，DeepSeek
              最重要的一些「竞争对手」其实是路由环境，它们降低了买家的搜索和切换成本。最终市场比纯模型对比更宽，也比普通创业公司对抗在位者的框架更严酷。这也意味着，任何干净的排行榜都会漏掉一个事实：买家经常同时比较渠道、治理层、部署便利性和模型质量。
