      - number: '7.3'
        title: 人员、执行与缓释：快速迭代有价值，但会带来脆弱的协同要求
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的执行风险不只是能不能快速出货；关键在于在高强度审视下协调研究、产品、政策和渠道。CNBC 2026 年 6 月报道称，投资人被要求不要挖人，说明人才留存重要到足以写进融资动态。V3.1
              发布说明显示，DeepSeek 可以很快更新模型、模式、API
              映射、定价节奏和智能体功能；从产品角度看很亮眼，但从变更管理看也有风险。快迭代会抬高文档漂移、用户困惑和向后兼容错误的成本。外部生态压力又加了一层。State of AI
              认为中国开放权重生态在变强，Volcengine、Baidu Qianfan、Kimi 和 MiniMax 的材料也显示，同业正在迅速为客户搭建相邻路径。也就是说，DeepSeek
              一边要管内部执行，一边要追上外部市场。缓释风险应当是有条件的判断，而不是绝对判断。更好的披露、更强的安全防护和更有纪律的发布管理，可以降低部分风险。另一些风险——比如地缘政治信任缺口或出口管制制度——只能作为打破投资逻辑的条件持续监控。投资人应假设
              DeepSeek 能缓释很多运营风险，但不能假设它能完全控制周围的政策环境。执行风险会在团队之间快速复利。DeepSeek
              至少已经发布过一份面向透明度和安全使用的一手模型机制披露；这不是完整的保证体系，但公开释放了一定缓释意图。
