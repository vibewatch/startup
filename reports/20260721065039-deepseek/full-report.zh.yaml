      - number: '8.2'
        title: 情景与敏感性：有上行空间，但取决于能否把战略稀缺性转成基本面
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的乐观情景很容易讲清。Vercel 和 OpenRouter 的需求代理指标显示，真实生产兴趣存在。公开定价显示，公司可以把自己放在远低于高端西方实验室的位置。MiniMax、Z.ai 和
              StepFun 的信号显示，中国 AI 生态仍在吸引资本和公开市场通道。如果 DeepSeek 能持续提升技术，同时用新资本扩大渠道覆盖和企业信任，高溢价私人估值可以说得通。基准情景更克制：DeepSeek
              仍然重要、使用广泛且具战略稀缺性，但估值大部分仍靠叙事支撑，因为收入质量和利润率持久性仍被遮住。悲观情景不是 DeepSeek
              消失，而是公开使用量变现低于假设，政策和信任逆风封顶可触达需求，更快的同业压缩溢价。因此，敏感性不主要由市场规模论证驱动，而更受四个变量支配：变现效率、渠道依赖、政策摩擦和证据质量。任何一个变量的小变化，都可能显著移动公允价值区间，因为当前公开数据相对于醒目的估值数字太薄。简言之，假设比电子表格更重要。同一家公司看起来便宜还是贵，取决于这些缺失变量最终是顶级，还是只是普通。
