        title: 收入模式与定价：即便 P&L 不透明，变现轨道也清晰
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 披露的信息足以理解资金应如何流入，尽管它没有披露最终收入。API 文档称计费基于
              token，区分缓存与未缓存输入，并拆分输入和输出定价。这很重要，因为它让变现与用量绑定，而非与订阅绑定：收入会随推理量、模型组合、输出强度和缓存行为扩张。同一定价页显示两条主要 V4 路径——Flash 和
              Pro——单价与并发上限差异明显，暗示公司有意把低成本、高吞吐场景和更高要求工作负载分层。DeepSeek 的使用条款还表明，费用会从预付或赠送余额中扣除，公司保留调价权。这些机制更像现代云 API
              业务，而不是消费者订阅创业公司。除直接 API 收入外，DeepSeek 通过 Google Cloud、Azure、AWS 以及 Vercel
              等网关获得托管可用性，暗示还可通过渠道流量和企业路由变现。未知的是收入结构：公开来源没有说明直接 API
              支出、间接云渠道，或免费消费者使用后来转化为付费需求，各自贡献多少。官方变更日志还显示，模型名称和受支持接口正在被主动下线和替换，这让版本管理成为商业系统的一部分，而不只是技术细节。
