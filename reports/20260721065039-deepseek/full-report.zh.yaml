      - number: '1.5'
        title: 里程碑、市场影响与后续尽调缺口
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 从创立到可能成为估值超过 $50 billion 的私人公司，只用了 36 个月；这条路径靠三点支撑：High-Flyer
              集群带来的算力优势、来自浙江大学的顶尖研究人才，以及刻意选择的开源策略，后者在全球获得了自下而上的采用。Sensor Tower 数据量化了 R1 的病毒式反应：2025 年 1 月 22-28
              日期间，日活用户环比增长超过 700%；该应用 19 天内全球下载量超过 23 million，是 ChatGPT 在相同成熟阶段下载速度的两倍以上。Bloomberg 2025 年 10
              月数据显示，DeepSeek 在非洲超过 OpenAI 和 Google。截至 2026 年 6 月，DeepSeek 约占 Vercel 平台企业 AI token 流量的
              23%。后续章节必须展开的关键反向信号包括：（1）Anthropic 在 2026 年 2 月指控 DeepSeek 通过 24,000 个欺诈创建账户和 16 million
              次交互发起工业规模蒸馏攻击；（2）OpenAI 国会备忘录指称持续 IP 盗取；（3）美国 NDAA FY2026 限制政府使用 DeepSeek；（4）澳大利亚政府范围内禁用
              DeepSeek；（5）Stanford HAI 观察到，DeepSeek
              在隐私保护、数据来源和版权方面明显不透明。公司不披露收入、毛利率、客户数、流失数据、算力烧钱速度或经审计财务。后续章节应独立检验产品市场契合、客户质量、算力经济性、监管暴露和 IPO 准备度。
