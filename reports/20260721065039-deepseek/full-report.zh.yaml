      - number: '2.2'
        title: 买家分层：开发者、企业 AI 团队和自助用户行为完全不同
        blocks:
          - type: paragraph
            body: >-
              市场证据显示，DeepSeek 的买家不是同一类人。开发者和 AI 原生产品团队最在意兼容性、token 价格、上下文长度，以及模型是否「足够好到可以上线」。DeepSeek 自己的 API 文档通过模拟
              OpenAI 和 Anthropic 风格端点降低迁移摩擦；Alibaba Model Studio、BigModel 和 Baidu Qianfan
              也说明，中国平台正在把多模型访问和工具编排常态化。企业平台负责人是另一类买家：Gartner
              称，预算正在转向能证明成本透明、用量追踪、性能控制和可衡量结果的供应商。这既利好平台和路由层，也利好底层模型实验室。第三类买家是消费者或专业个人用户，习惯形成和自助试验比治理功能更重要。State of AI 的
              2025 年调查数据表明，采用已经足够广，消费者和个人专业用户不再只是无关紧要的旁路；它会把认知和试验反馈到企业试点。DeepSeek
              的市场位置最强的地方，是这些漏斗重叠之处：低成本开发者采用、智能体试验，以及足够高的质量，使其能升级进入受管理的企业路由，而不是只停留在爱好者流量。实践中，最有价值的买家往往不是终端用户，而是决定流量如何路由的团队。路由负责人通常决定
              DeepSeek 会成为持久支出，还是一阵短暂好奇。
