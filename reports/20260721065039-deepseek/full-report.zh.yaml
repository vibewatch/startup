        title: 产品表面：DeepSeek 已成为平台，而不只是一次模型发布
        blocks:
          - type: paragraph
            body: >-
              已审阅的产品证据显示，DeepSeek 是一个拥有多个用户入口的栈。DeepSeek 公开网站和透明度页面描述的是一连串重大模型发布，而不是单一静态旗舰。API 文档展示了与 OpenAI 和 Anthropic
              兼容的访问、模型特定定价、token 用量机制，以及 JSON 输出、工具调用、上下文管理等产品化功能。V2、V3 和 R1 的 GitHub 与 Hugging Face 页面进一步表明，DeepSeek
              把开放权重分发视为产品策略的一部分，而不只是研究副产品。这很重要，因为它扩大了可服务用户群：有些客户要直接托管推理，有些要托管云访问，有些要权重或论文来评估或自部署。AWS、Azure、Google Cloud
              和 NVIDIA 的合作伙伴来源显示，DeepSeek
              的产品表面也延伸到第三方分发层，企业用户在那里发现并测试模型。结果是一套产品架构：多扇门通向同一核心能力基础。技术上，这是优势，因为它增加采用路径；运营上，它制造更多需要维护的合约，涉及兼容性、性能、可靠性和文档。这也意味着，产品尽调不能只看原始模型质量，还必须看包装和生态行为。隐私政策也说明，DeepSeek
              运营的是持续软件服务，而不只是发布权重；英文透明度页面则像公开发布台账，包含模型卡和报告链接。
