      - number: '1.4'
        title: 模型架构与产品形态
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的产品逻辑是发布一流开放权重模型，配套详细技术论文，并提供价格可负担的 API。2023 年末的首批发布——DeepSeek-Coder（2023 年 11 月）和 DeepSeek-LLM
              67B——让这家实验室成为美国开源模型之外可信的中国替代方案。关键架构突破是 DeepSeek-V2（2024 年 5 月）：它采用 Multi-head Latent Attention（MLA）和稀疏
              Mixture-of-Experts 设计，将 KV cache 内存降到标准 Multi-Head Attention 的 5-13%，大幅压低推理成本。V2 将 API 访问定价为每百万 token 1
              RMB——约为当时 Llama 3 70B 成本的七分之一——点燃了中国 AI 价格战，迫使 ByteDance、Baidu、Tencent 和 Alibaba 降价。DeepSeek-V3（2024 年 12
              月）把架构扩展到 671 billion 总参数、每个 token 激活 37 billion 参数，并用 14.8 trillion tokens 训练；CSIS 估算，使用 H800
              芯片的最终预训练计算成本约为 $5.6 million。DeepSeek-R1（2025 年 1 月 20 日）在多个基准上达到或超过 OpenAI o1，并引发了 DeepSeek Monday 市场事件。R1
              方法论文发表于 Nature（volume 645，pages 633-638，2025）。DeepSeek-V4（2026 年 4 月 24 日）推出 V4-Pro，拥有 1.6 trillion 总参数和 1
              million-token 上下文窗口。截至本次报告运行日，API 提供 deepseek-chat，价格为每百万输入 token $0.07。模型权重可从 GitHub 和 Hugging Face
              免费下载；模型也可通过 AWS、Azure、Google Vertex AI 和 NVIDIA NIM 使用。
