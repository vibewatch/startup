      - number: '5.2'
        title: 架构与研发：效率、MoE 设计和推理专精是定义性主题
        blocks:
          - type: paragraph
            body: >-
              DeepSeek 的技术身份在公开来源中异常清晰。V2 被明确定位为经济高效；V3 被呈现为大型 MoE 架构，拥有 671B 总参数、每个 token 激活 37B；R1 则被定位为第一代推理家族。R1
              仓库强调由强化学习驱动的推理，V2 和 V3 材料则强调低成本训练和高效推理。透明度页面补上了发布节奏，让外界能把这套系统视为演进中的平台，V4 在 2026 年 4
              月加入这条弧线。定价文档增加了面向生产的约束和能力，例如上下文长度、输出限制和并发上限。Z.ai、MiniMax 和 Kimi 来源是有用对照，因为它们展示了 DeepSeek
              身处的技术竞赛：长上下文、编码、智能体任务和多模态工作流都在常态化。因此，DeepSeek 的技术挑战不只是再发布一个有能力的模型。它必须守住成本性能优势，同时保持 API
              稳定，支持托管和伙伴分发部署，并让推理质量在生产中可用，而不仅仅是在演示中惊艳。现有证据支持一个判断：DeepSeek 的 R&D
