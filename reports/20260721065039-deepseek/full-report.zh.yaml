      - number: '8.3'
        title: 建议与尽调问题：观察或继续研究，而不是盲目投资
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的建议，是观察 DeepSeek 或继续研究，而不是按报道价格上沿激进投资。估值约 $50 billion
              时，如果投资人能进入数据室、并相信渠道和质量叙事会转化为持久收入，公司作为稀缺资产仍有可辩护空间。估值约 $71 billion
              时，举证责任就高得多。核心原因不是市场机会小，而是证据质量仍远低于这一定价通常要求的水平。Conference Board 和禁令追踪来源显示，政策与信任担忧仍然真实存在。CNIPA
              的备案通知和隐私政策披露也强化了一个判断：非技术问题可以影响价值创造。出资前，投资人需要看到客户集中度、收入质量、队列留存、毛利率和算力来源数据。如果这些数字非常出色，DeepSeek
              可能配得上溢价。如果只是不错，今天报道的估值大概率偏高。因此，当前建议是谨慎好奇，而不是高信念资本。公开势头应被视为输入，而不是判决。保持谨慎有必要。
