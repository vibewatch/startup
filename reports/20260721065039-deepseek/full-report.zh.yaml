        - label: 安全 / 运营透明度
          values:
            - 中
            - 中
            - 中
            - 低
    approximationNotes: 单元格是作者基于审阅过的公开产品材料和反向评论作出的序位判断，不是基准测试得分或 SLA 承诺。
    claimRefs:
      - CE020
      - CE027
      - CE029
      - CE036
      - CE037
      - CE038
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: DeepSeek 的典型路径从发现开始，经过试用、路由，最后进入持续的工作负载选择。
    data:
      nodes:
        - id: discover
          label: 发现
          description: 用户通过病毒式发布、排名、应用商店或云目录接触 DeepSeek。
        - id: trial
          label: 试用
          description: 用户测试聊天、应用、API 或开放权重产物，判断适配和成本。
        - id: integrate
          label: 集成
          description: 兼容性和低价鼓励接入工作流。
        - id: route
          label: 路由 / 部署
          description: 生产使用可能走直连 API、云或网关。
        - id: repeat
          label: 复用或扩张
          description: 只有一部分工作负载会重复使用，并扩展为稳定支出。
    approximationNotes: null
    claimRefs:
      - CU001
      - CU010
      - CU011
      - CU023
      - CU026
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: DeepSeek 的公开客户漏斗从广泛认知收窄到较小的生产路由核心。
    data:
      items:
        - label: 全球应用 / 下载认知爆发
          value: 23000000
          note: Sensor Tower 报告称，前 19 天下载量超过 23M。
        - label: 早期爆发阶段美国应用下载
          value: 2000000
          note: Sensor Tower 报告称，美国下载量约 2M。
        - label: 追踪网站爆发流量代理指标
          value: 650
          note: Sensor Tower 报告称，爆发期间网站访问量环比上周（WoW）增长 650%。
        - label: Vercel 路由 token 份额
          value: 17
          note: DeepSeek 在 Vercel 2026 年 6 月指数中达到路由 token 的 17%。
        - label: OpenRouter token 份额
          value: 18
          note: OpenRouter 报告称，到 2026 年 6 月上旬 token 份额为 18%。
    approximationNotes: 这些阶段有意混合数量、增长率和平台份额，因为 DeepSeek 不发布统一的获客到留存漏斗；该图是从广泛认知走向生产路由的代理路径。
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: DeepSeek 的公开客户证明在渠道和路由环境最强，在具名终端客户披露上较弱。
    data:
      columns:
        - 消费者证明
        - 开发者证明
        - 企业渠道证明
        - 重复使用证明
      rows:
        - label: Sensor Tower / Appfigures
          values:
            - 高
            - 低
            - 低
            - 中
        - label: Vercel / OpenRouter
          values:
            - 低
            - 高
            - 中
            - 高
        - label: AWS / Azure / Google
          values:
            - 低
            - 中
            - 高
            - 中
        - label: NVIDIA / 平台包装
          values:
            - 低
            - 中
            - 中
            - 低
        - label: 具名终端客户标识
          values:
            - 低
            - 低
            - 低
            - 低
    approximationNotes: 单元格是基于各类来源能证明客户质量到什么程度作出的序位判断，不是量化得分。
    claimRefs:
