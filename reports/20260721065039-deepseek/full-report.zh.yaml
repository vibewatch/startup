            body: >-
              DeepSeek 的财务上行来自同一组事实，而这些事实也制造主要风险。Vercel 和 OpenRouter 暗示，低标价和快速采用可以带来巨大的 token
              量；但低价也留下更少空间来吸收算力冲击、渠道费用或激进竞争性折扣。DeepSeek 的公开材料和合作伙伴列表显示，它可以通过直接 API
              和云中介变现；但这些渠道也给客户更多路由灵活性，让收入黏性下降。成本侧更难判断。CSIS、CNBC 和 FDD 都指向一些会在财务上产生影响的风险因素，即便它们常被描述为政策或 IP
              故事：出口管制会影响硬件获取，所谓蒸馏或 IP 纠纷会抬高法律和声誉成本，禁令或安全担忧会关闭高信任客户细分。CNBC 6 月关于融资中「禁止挖角」条件的报道也提示，人才稀缺是经济变量，不只是 HR
              问题。按模型性能看，DeepSeek 确实可能比许多同行更高效；但投资者不应把技术效率误当成已验证的现金生成耐久性。没有收入披露、流失数据或烧钱数据，基于公开信息的最佳判断是：DeepSeek
