              DeepSeek 的公开材料和代码库说明了它为什么会成为如此有冲击力的对照组。DeepSeek-V2 强调经济训练和高效推理，DeepSeek-V3 扩展为 671B 参数 MoE、每个 token 激活 37B
              参数，DeepSeek-R1 则建立了强势的公开推理叙事。这个组合重要，因为它满足了严肃竞争的买家下限：能力足够高、开放权重可信、成本极低。但相对同行的功能差距正在收窄。Anthropic
              保持高端模型层级，Google 继续扩大 Gemini API 和工具表面，中国同行也已经把长上下文、多模态、智能体工具和兼容性当成基本配置来宣传。Z.ai 称 GLM-5.2 支持 1M 无损上下文；Kimi
              主打 256k 上下文和智能体用例；MiniMax 推低单 token 价格；Alibaba 的模型工作室公开在一个目录里售卖多个竞争模型。含义是：DeepSeek
              最适合被看作一个正在变拥挤的细分市场中的价值领导者。重视性价比的买家会继续测试 DeepSeek，但更在意广泛企业功能、政策舒适度或高端支持的买家仍有可信替代。换言之，功能趋同扩散得比独特定位更快。OpenAI
