        - label: 经网关路由的生产工作负载
          values:
            - 100
            - 75
            - 60
            - 45
    approximationNotes: 这些百分比是作者估计，锚定 Sensor Tower、Vercel 和 OpenRouter 信号所暗示的相对持续性。它们不是公司披露的队列，只能作为持久性判断线索解读。
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU037
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: DeepSeek 优先级最高的风险集中在「高可能性 / 高严重性」象限，政策、信任与平台依赖在这里叠加。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 中等严重性
          values:
            - 品牌仿冒压力
            - 输出不准确投诉
            - 预算份额竞争压力
        - label: 高严重性
          values:
            - 服务可靠性不透明
            - 人才留存 / 挖角压力
            - 云与网关依赖
        - label: 关键严重性
          values:
            - 更广泛监管禁令
            - 出口管制 / 硬件约束升级
            - 重大 IP / 蒸馏风险升级
    approximationNotes: 位置是作者基于已审阅来源作出的序位判断，目的是给尽调排优先级，不是预测精确概率。
    claimRefs:
      - CR005
      - CR010
      - CR012
      - CR023
      - CR029
      - CR033
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多个独立风险节点都可能传导到同样商业结果：客户采用放慢、利润率走弱、可投资性下降。
    data:
      nodes:
        - id: policy
          label: 政策 / 禁令风险
        - id: trust
          label: 信任 / 隐私风险
        - id: ip
          label: IP / 蒸馏风险
        - id: ops
          label: 运营 / 发布风险
        - id: channel
          label: 渠道依赖
        - id: adoption
          label: 客户采用摩擦
        - id: economics
          label: 毛利率 / 货币化压力
        - id: investability
          label: 估值 / 融资压力
      edges:
        - from: policy
          to: adoption
        - from: trust
          to: adoption
        - from: ip
          to: adoption
        - from: ops
          to: adoption
        - from: channel
          to: economics
        - from: adoption
          to: economics
        - from: economics
          to: investability
        - from: ip
          to: investability
    approximationNotes: null
    claimRefs:
