              资本故事比经营报表更容易观察。Forbes 和 Fortune 都把 DeepSeek 早期融资能力与创始人 Liang Wenfeng 及 High-Flyer
              创造的财富相连，这意味着公司起步时似乎拥有对这一规模 AI 实验室来说异常充足的创始人资金。但到 2026 年中，DeepSeek 已明显从创始人单独融资转向外部资本。TechCrunch 5
              月报道称，DeepSeek 首轮投资估值可能达到 $45 billion；CNBC 6 月报道称首轮外部融资已以超过 $50 billion 的估值完成；TechCrunch 7
              月又报道称，公司在据称仅一个月前融资 $7 billion 后，正在探索以约 $71 billion 估值再融约 $1.5 billion。CB Insights 补充了更多但部分冲突的元数据，将
