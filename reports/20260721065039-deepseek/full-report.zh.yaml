  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：DeepSeek 竞争的是模型支出、平台支出和 AI 应用预算
        blocks:
          - type: paragraph
            body: >-
              不应把 DeepSeek 简单归入一个没有差异的「生成式 AI 市场」。已抓取证据至少支持四个相互关联的支出池。第一是前沿模型与 API 推理支出，买家会在各实验室之间比较价格、延迟、上下文和模型质量。第二是
              AI 平台支出，企业为评估、治理、路由和应用开发层付费，以便在生产中管理多个模型。第三是智能体与编码工作负载支出，长上下文推理质量和工具使用能力决定一个便宜模型是能部署，还是只值得测试。第四是消费者与专业个人
              AI 应用支出，应用下载和订阅带来高量但低治理的漏斗。Gartner 2026 年 7 月预测和 Goldman Sachs 的 $150 billion 软件 TAM 视角都确认总市场很大，但这两个数字都不是
              DeepSeek 近期自己的合适 SAM。更好的工作定义是：AI 工作负载中，那些开放权重、低价格、具备推理能力的模型能达到质量门槛，且买家愿意多供应商并用的子集。这个边界让 DeepSeek
              的机会明显窄于标题级 TAM，但也可执行得多。
