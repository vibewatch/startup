        blocks:
          - type: paragraph
            body: >-
              已审阅材料中最强的客户证据来自衡量真实行为的采用代理指标。Sensor Tower 称，DeepSeek 在最初 19 天获得约 23 million 全球下载，是 ChatGPT
              可比发布窗口的两倍多；爆发期内平均移动 DAU 环比增长超过 700%。Appfigures 也称，该应用很快突破 1 million 下载，并即将挑战
              ChatGPT。这些移动信号是漏斗顶部，不是持久收入证明，但它们确立了异常快的获客速度。更新近的证据来自基础设施渠道。Vercel 2026 年 6 月生产指数称，DeepSeek 的路由 token
              份额一个月内从低于 1% 跃升至 17%，而支出仍接近 1%；OpenRouter 称，2026 年上半年 DeepSeek 的 token 份额从 9% 翻倍至
              18%，智能体工作负载贡献了大部分增长。这些信号重要，因为它们把故事从炒作推进到反复生产路由。同时，AWS、Azure、Google Cloud、NVIDIA 和 Vercel 都作为具名证据点，显示
              DeepSeek
              正在被打包给主流开发者和企业环境中的下游用户。因此，公开可见的扩张最可信地体现为渠道扩张和工作流扩张，而不是已披露的具名账户扩张。这个区别重要，因为路由用量比单纯应用榜单动能更接近可变现客户行为。
