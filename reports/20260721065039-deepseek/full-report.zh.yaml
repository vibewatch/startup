            body: >-
              客户质量是公开证据最薄的地方。已审阅来源没有披露净收入留存、logo
              留存、队列留存、NPS，甚至没有给出可对账的付费企业客户数。这迫使我们区分可见需求和可核保的客户耐久性。网关和云信号暗示重复使用，因为没有一些经常性工作负载，token
              份额不会上升；但它们没有说明需求是否集中在少数超级用户或中介手中。集中度风险真实存在，原因有两点。第一，DeepSeek
              大量可见企业触达经由第三方平台实现，这意味着云和网关可能成为关键渠道。第二，TechCrunch、CNA 和 Al Jazeera
              通过禁令和限制记录显示，监管和隐私担忧已经把一些公共部门和高信任细分从可触达客户池中移除。实际含义是，DeepSeek
              很可能拥有宽广且快速增长的客户表面，但还没有公开可读的客户质量画像。正确的尽调问题不再是「人们是否在用
              DeepSeek？」公开证据说是。更难的问题是，用量是否分散、留存、在账户内扩张，并且能以一种抵抗路由灵活性和政策摩擦的方式变现。公开证据仍未达到真正账户分析的层级。
