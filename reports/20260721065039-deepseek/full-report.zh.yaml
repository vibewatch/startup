      - CU027
  - id: FU004
    title: 留存 / 复用队列代理
    type: cohort
    layout: standard
    summary: 由于 DeepSeek 没有披露正式留存指标，该队列是估算代理，显示不同渠道的复用耐久性可能如何分化。
    data:
      columns:
        - 初始期
        - 跟进期
        - 中期
        - 较长期
      rows:
        - label: 移动 App 爆发用户
          values:
            - 100
            - 35
            - 18
            - 10
        - label: 开发者评估者 / API 试用者
          values:
            - 100
