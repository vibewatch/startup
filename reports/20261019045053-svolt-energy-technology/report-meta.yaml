companyProfile:
  summary: >-
    SVOLT Energy Technology is a 2018-founded Chinese battery manufacturer spun out from Great Wall Motor and
    headquartered in Jintan District, Changzhou. The company sells cells, modules, packs, and energy-storage products,
    combines real manufacturing footprint with Thailand localization, and is pushing a semi-solid battery roadmap, but
    public disclosure is still thin on current financials, governance depth, and capital-structure detail.
