      - number: '2.2'
        title: 需求规模口径及其真正衡量的内容
        blocks:
          - type: paragraph
            body: >-
              可用的公开规模口径是装机量和出货量，而不是收入 TAM。BatteryTech Network 报道的 SNE Research 数据显示，2025 年中国以外的 xEV 电池 装机量达到 464
              GWh，2017 至 2025 年 CAGR 为 47.7%；2026 年第一季度又同比增长 17.4%，达到 117.4 GWh。CnEVPost 另一组同样引用 SNE Research 的口径显示，2025
              年全球电动车电池使用量为 1,187 GWh，同比增长 31.7%；SVOLT 占 28.5 GWh，全球份额为 2.4%。 这些是需求和市场地位的代理指标，不是收入池，但足以说明 SVOLT
              所在的是一个规模庞大且仍在增长的品类，而非停滞的利基市场。 公司层面的主要前瞻口径是管理层提出的 2026 年 61 GWh 出货计划，这一方向性指标有参考价值，但不能当作已验证的 SAM 或已实现需求。
