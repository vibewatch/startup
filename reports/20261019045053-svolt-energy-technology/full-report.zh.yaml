          note: 2025 年全球最大供应商；在本来源池中，其优势更多来自规模，而非下一代技术的差异化证据。
          claimRefs:
            - CP004
        - label: BYD
          x: 5
          'y': 3
          tone: neutral
          note: 2025 年全球第二大供应商，具备强大的成熟供应商地位。
          claimRefs:
            - CP004
        - label: LG Energy Solution
          x: 4
          'y': 3
          tone: neutral
          note: 全球成熟供应商，规模可观，但保留证据更强调其采购地位，而非路线图的独特性。
          claimRefs:
            - CP004
            - CP008
        - label: CALB / Gotion 阵营
          x: 3
          'y': 3
          tone: opportunity
          note: 当前装机规模高于 SVOLT，且 Gotion 也被列为半固态竞争者之一。
          claimRefs:
            - CP004
            - CP010
        - label: SVOLT
          x: 2
          'y': 4
          tone: positive
          note: 当前装机基础较小，但半固态路线图加上本地化布局，使其战略选择空间高于单看份额所得出的判断。
          claimRefs:
            - CP005
            - CP009
            - CP014
        - label: 内部自建 / 合资
          x: 1
          'y': 2
          tone: risk
          note: 能带来控制权，但 Battery Technology 称，多项合资项目正在重新谈判、出售或解散。
          claimRefs:
            - CP008
    approximationNotes: 这些评分是序数式综合判断，不是基准测试结果或经审计的采购数据；它们反映保留证据中关于规模、本地化、路线图独特性和买方行为的信息。
    claimRefs:
      - CP004
      - CP005
