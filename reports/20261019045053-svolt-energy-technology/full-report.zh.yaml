companyProfile:
  summary: >-
    SVOLT Energy Technology 是一家 2018 年成立的中国电池制造商，从 Great Wall Motor 分拆而来，总部位于常州金坛区。
    公司销售电芯、模组、电池包和储能产品，既有真实制造基地，也在泰国推进本地化，并推动半固态电池路线；但其当前财务、 治理深度和资本结构细节的公开披露仍然不足。
  headquarters: Jintan District, Changzhou, Jiangsu, China
