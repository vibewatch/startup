            title: 公开数据更适合判断需求方向，而非收入 TAM
            body: 最强的公开数字是基于装机量的市场数据集和供应商份额表。它们证明了增长和相对地位，但无法揭示 SVOLT 已实现的分部经济性、积压订单质量， 或不同买家类别贡献的毛利。
