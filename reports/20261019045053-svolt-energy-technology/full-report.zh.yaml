      - number: '4.2'
        title: 公开经营动能强于公开财务透明度
        blocks:
          - type: paragraph
            body: >-
              当前最强的信号是经营代理指标，而非经审计的经济数据。Batteries News 报道称，收入从 2019 年的 RMB 929.187 million 增至 2021 年的 RMB 4.474
