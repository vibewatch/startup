  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 真实规模和技术期权价值，被过时的价格发现与执行风险抵消，因此建议继续研究。
    data:
      nodes:
        - id: scale
          label: 真实但尚未形成规模的制造证据
          value: 28.5 GWh global installations; 2.4% 2025 share
          note: 说明其具备运营相关性，但仍远落后于 CATL 和 BYD。
        - id: tech
          label: 技术期权价值
          value: Semi-solid milestones; 61 GWh 2026 shipment target
          note: 如果商业化和盈利按时兑现，上行空间存在。
        - id: price
          label: 过时的公开价格锚点
          value: 2023 CNY 46 billion post-money; IPO withdrawn
          note: 审阅材料中仍缺少新的融资条款。
        - id: risk
          label: 执行与稀释风险
          value: Germany retreat; thin fresh financial disclosure
          note: 这增加了对资本开支纪律和下行保护的不确定性。
        - id: diligence
          label: 价格出清证据
          value: Current audited financials; cap table; arm's-length financing terms
          note: 在判断目标回报之前，必须拿到这些私有材料。
        - id: call
          label: 推荐
          value: research-more / high risk / valuation unknown
          note: 继续推进尽调，但要求当前价格发现和更强的披露。
      edges:
        - from: scale
          to: tech
          label: 支持上行空间
        - from: tech
          to: price
          label: 仍需价格发现
        - from: price
          to: risk
          label: 提高投资判断门槛
        - from: risk
          to: diligence
          label: 需要验证
        - from: diligence
          to: call
          label: 确定当前立场
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
      - CV015
