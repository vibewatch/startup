  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与当前地位
        blocks:
          - type: paragraph
            body: >-
              保留证据显示，当前电池市场的竞争重心仍是规模，而不是新奇技术。CnEVPost 引用的 SNE Research 数据显示，CATL 和 BYD 合计占 2025 年全球电动车电池装机量的
              55.6%，所以任何较小的挑战者一开始与 OEM 洽谈，就处于信任度和可融资性劣势。在这一排名中，SVOLT 仍然重要，因为它位于全球前十；但其 2.4% 份额和 28.5 GWh
              装机量意味着它仍在第二梯队竞争，无法主导行业条件。 EqualOcean 和世界经济论坛的资料也显示，SVOLT 的范围足以覆盖电芯、电池包和储能系统，因此并非单一产品公司；但公开语料尚未给出
              具备行业领导者规模的证据。
            claimRefs:
              - CP001
              - CP004
              - CP005
