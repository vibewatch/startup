          - type: paragraph
            body: >-
              上行情景取决于 2026 年运营证明能否追上技术雄心。Battery-Tech 称，SVOLT 在 2025 年第四季度实现首次单季盈利，目标是在 2026 年实现全年盈利，并计划当年出货 61 GWh
              电池；Best Magazine 和 Electrive 也都描述了与 2026 年和 2027 年商业化相关的半固态里程碑。
              这些是有意义的信号，但仍属于里程碑陈述，不是对持久利润率、客户集中度缓解或开放退出窗口的充分去风险证明。因此，基准情景假设公司确实具备制造重要性和技术期权价值，但当前缺乏足够新的财务或合同透明度，不足以支持今天溢价买入。
              悲观情景是电池行业熟悉的模式：商业化时间表延误，资本开支仍然沉重，未来融资条款不如上次披露的估值高点。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍是估值判断中最弱的一环。Hurun 的 2025 年评论称，相比 2021 年高峰，独角兽市场 IPO 数量仍然相对较少；这很重要，因为 SVOLT 已放弃一次 IPO
              流程，而在受审阅公开语料中尚未用新的融资或招股书式披露材料替代它。 在从“继续研究”转向买入之前，投资人应要求当前经审计或达到审计质量的 2025 财年和 2026
              年年初至今财务数据、按工厂列示的利用率和资本开支、具有约束力的 OEM 定点及积压订单细节，以及任何新资金或结构化资本的确切经济条款。
              没有这些材料，持有或入场决策会更多依赖对电池行业叙事的信念，而不是有价格依据的证据。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 入场纪律应先于信念强度改善
            body: SVOLT 的实质性足以让它继续留在尽调名单中，但证据只有在价格或披露改善后才支持提高信念。没有新的融资锚点、股权结构条款和当前经审计运营细节，更安全的判断是继续研究，而不是买入。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV013
              - CV014
