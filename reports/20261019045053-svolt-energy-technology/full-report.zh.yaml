        title: 展示项
        blocks:
          - type: callout
            title: 采购选择性是核心竞争风险
            body: 公开记录显示，SVOLT 最难的不是证明自己有路线图，而是在价格透明度和旗舰项目确认仍然有限的情况下，证明 OEM 应该放弃更大、更可信的供应商。
            calloutType: risk
