      - number: '3.3'
        title: 转换成本有利于可信供应商，定价仍然不透明
        blocks:
          - type: paragraph
            body: >-
              证据池中最强的不利信号并非直接质疑 SVOLT 的技术，而是买家行为正在变化。Battery Technology 写道，在一波重新谈判或解散合资项目后，
              汽车制造商正向更少的可信合作伙伴集中；这提高了小供应商替代现有供应商的门槛，除非它能在某个项目上明显更优。 这使 SVOLT 的出口进展有价值但并不决定胜负：Gasgoo 将公司与
              Stellantis、Hyundai 和 VinFast 供应链联系起来，但 Best Magazine 也称， 经常被讨论的 Mini 半固态项目仍未获官方确认。EqualOcean 报道的 IPO
              撤回和高资本开支计划进一步说明，这是一场资本密集型竞争； 而保留语料仍没有 SVOLT 相对大型同行的可比公开报价或合同经济性。买家能看到路线图，却没有足够公开商业细节证明 SVOLT
              在总成本或合同灵活性上胜出。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
