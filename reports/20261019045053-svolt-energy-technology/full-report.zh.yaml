  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              SVOLT 服务的市场不只是单一的乘用电动车电芯细分市场。公开产品组合和渠道证据显示，公司销售电池材料、电芯、模组、电池包、
              电池管理系统和固定式储能产品；近期营销和项目证据则覆盖乘用电动车、混合动力和储能应用。因此，市场边界应围绕车辆平台和储能项目的 电池系统支出，而不是下游整车收入、充电网络收入或上游原材料采矿收入。实际替代方案包括
              BEV、PHEV 和 HEV 项目中的成熟锂离子供应商， 以及其他储能系统厂商和大型现有供应商的 OEM 内部采购。相邻储能需求可以分散买方基础，使市场更具吸引力；但公司仍需赢得具体车辆或项目，
              不能依靠泛化的电池 TAM 故事。
            claimRefs:
              - CM001
              - CM002
              - CM014
              - CM016
