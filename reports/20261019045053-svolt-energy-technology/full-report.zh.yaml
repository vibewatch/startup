      - number: '2.3'
        title: 买家、采用路径与采用约束
        blocks:
          - type: paragraph
            body: >-
              可见的采用路径是 OEM 平台团队、区域合资企业和储能项目开发商主导的项目制采购，而不是零售电池购买。汽车端，SVOLT 正通过 PHEV 电池包、半固态电池和 BMW Mini
              相关项目切入大批量买家流程，说明平台能量密度、充电速度、本地化和每 kWh 成本仍是核心采购标准。 储能端，官方 CIBF
              更新和泰国合资项目声明显示，海外集成商和项目开发商关注区域供应韧性、合规和全生命周期服务。相同证据也揭示了约束： 半固态电池仍处于早期阶段，全固态电池产业化尚未解决；泰国 EV 3.0
              等本地化激励也很重要，因为采用取决于政策、认证和本地生产经济性， 而不只是产品本身的优点。
            claimRefs:
