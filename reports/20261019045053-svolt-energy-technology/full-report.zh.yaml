      - number: '2.4'
        title: 公开证据仍无法拆分的内容
        blocks:
          - type: paragraph
            body: >-
              公开证据足以界定市场边界并显示需求动能，但还不足以支撑真正达到尽调标准的 SAM/SOM。现有数字混合了全球装机量、中国以外装机量和
              管理层出货目标，适合交叉验证，却不能直接放进同一条漏斗比较。公开语料也没有按客户披露积压订单、分部毛利率或按地区已锁定的 GWh，
              因此无法区分尚处于愿景阶段的平台胜出与已签约的经常性需求。这直接影响估值：一家出口业务已有一定规模的电池供应商，仍可能因客户集中度、
              本地化成本，以及储能机会中有多少是真实项目管线、多少只是展会兴趣，而呈现完全不同的经济性。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM016
