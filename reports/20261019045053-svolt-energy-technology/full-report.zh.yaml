      - number: '3.2'
        title: 差异化来自化学体系和本地化，而非当前份额
        blocks:
          - type: paragraph
            body: >-
              SVOLT 的公开切入点是技术加部署，而不是单纯追求销量。Electrive 和 Battery-Tech Network 都描述了把商业化推进到 2026 年的 半固态电池里程碑，但 Best Magazine
              的报道也明确指出，这并非 SVOLT 独占的赛道：CATL、Gotion High-Tech 和 WeLion 也在推进 半固态项目。因此，SVOLT
              拥有真实但非排他的差异化。当前语料中更持久的角度，是下一代化学体系与本地化的结合。 EqualOcean 曾描述其德国和泰国扩张，Gasgoo 后来则将德国和泰国服务中心定义为海外布局的一部分。实际上，SVOLT
              试图向 OEM 销售的 是出口准备度、区域服务和前瞻路线的组合，而不是靠价格取胜的商品化方案。
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
