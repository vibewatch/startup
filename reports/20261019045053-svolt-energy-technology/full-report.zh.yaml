  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据说明出货活动如何转化为收入，但无法说明实际定价或毛利桥接。
    data:
      nodes:
        - label: 客户需求
          detail: 车企和储能需求有 2025 年 28.5 GWh 装机量及 2026 年 1—2 月 1.66 GWh 出口作为证据
        - label: 产品家族
          detail: 电芯、模组、电池包、储能系统和集成解决方案
        - label: 项目供货
          detail: 销售通过车型项目、电池包发布和区域性供应链切入实现
        - label: 确认收入
          detail: 公开来源展示的是出货代理指标，而非实际 ASP 或收入确认时点
        - label: 毛利桥接
          detail: 利润率取决于良率、化学体系组合、质保、售后支持和产能利用率
        - label: 融资需求
          detail: 资本开支、研发和营运资金仍需要新的现金及债务披露
      edges:
        - from: Customer demand
          to: Product families
          label: 转化为电池订单
        - from: Product families
          to: Program supply
          label: 通过车企和储能项目出货
        - from: Program supply
          to: Recognized revenue
          label: 只有合同经济性明确后才转化为收入
        - from: Recognized revenue
          to: Gross profit bridge
          label: 定价和成本结构决定利润质量
        - from: Gross profit bridge
          to: Financing need
          label: 留存收益或外部资本为下一轮建设周期提供资金
    approximationNotes: 这座桥接图是概念性的，只使用来源支持的活动标记；它没有推算转化率、ASP 或毛利率。
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI010
      - CI013
      - CI014
      - CI016
  - id: FE001
    title: SVOLT 产品架构图
    type: stack
    summary: 公开证据呈现出一套分层的电池体系，从化学材料研发一路延伸到本地化电池包交付。
    data:
      layers:
        - label: 化学体系与材料研发
          detail: 半固态、固液混合和无钴产品方向
          modules:
            - label: 高镍和中镍变体
            - label: 全固态之前的固液混合路径
          outputs:
            - label: Higher-density cell roadmap
        - label: 电芯设计与试制验证
          detail: 第一代 140 Ah 半固态电芯和 B 样验证参考
          modules:
            - label: 140 Ah 半固态电芯
            - label: B 样验证
          outputs:
            - label: Trial-to-volume transition claims
        - label: 模组与电池包工程
          detail: 面向 PHEV 和 EREV 项目的整车可用电池包设计
          modules:
            - label: Fortress 2.0
            - label: Dragon Armor
          outputs:
            - label: Fast-charge pack products
        - label: BMS 与充电控制
          detail: 电池管理系统和脉冲充电控制属于公开架构描述的一部分
          modules:
            - label: BMS
            - label: 离子振荡脉冲充电
          outputs:
            - label: Charging-speed claims
        - label: 数字化制造与质量保证
          detail: 用于在泰国追踪和测试电池包的运营系统
          modules:
            - label: MES 追溯
            - label: WMS 智能物流
            - label: 自动化测试
          outputs:
            - label: Yield and traceability controls
        - label: 本地化组装与客户交付
          detail: 为区域车型项目服务的泰国合资电池包生产
          modules:
            - label: CTP 产线
            - label: LCTP/HEV 产线
            - label: TISI 认证产出
          outputs:
            - label: Regional pack deployment
    approximationNotes: 这套架构是定性的：它反映公开描述的层级和流程阶段，而不是一份封闭的工程物料清单。
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: SVOLT 从本地化车企电池包供货，走向更高规格的验证项目和服务驱动扩张，但每一步都让耐久性的可见度进一步下降。
    data:
      items:
        - label: 泰国车企部署
          actor: Great Wall Thailand 项目
          touchpoints:
            - 截至 2025 年 6 月达到第 10,000 个电动车电池包里程碑
            - ORA Good Cat、HAVAL H6 PHEV 和 TANK 300 HEV 已在市场销售
            - 这是当前量产部署最有力的公开证据
        - label: 本地化工厂与合作伙伴闭环
          actor: SVOLT + Banpu NEXT
          touchpoints:
            - 泰国合资公司将本地运营伙伴与电池制造结合起来
            - TISI 认证和 EEC 激励提升了本地交付的可信度
            - 扩张路径包括区域全生命周期服务
        - label: 储能交叉销售
          actor: 东南亚 BESS 客户
          touchpoints:
            - 管理层称，储能组装线正在加速建设
            - 亚太 BESS 扩张被定位为下一层商业机会
            - 具体终端客户尚未公开
        - label: 欧洲验证项目
          actor: 未具名的欧洲电动车和 eVTOL 项目
          touchpoints:
            - 据报道，订单来自一家知名欧洲电动车品牌
            - Battery-Tech 称，其中一个电池包已经装在一辆欧洲乘用车上
            - 在客户身份公开之前，商业进展已经可见
        - label: BMW Mini 上市门槛
          actor: Mini 下一代车型
          touchpoints:
            - 目标在 2025 年第四季度试产
            - 计划于 2027 年量产
            - 只有转化为持续的量产供货，参考价值才会提升
        - label: 欧洲服务驱动与采购筛选
          actor: 欧洲车企支持团队
          touchpoints:
            - 欧洲制造计划已撤回
            - 技术服务、仓储、物流和售后仍在继续
            - 法律指控噪音可能拖慢采购端的接受度
    approximationNotes: null
    claimRefs:
      - CU003
      - CU008
      - CU009
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高风险集中在已经显现的收缩、资本密集度，以及仍需规模化证明的目标上。
    data:
      columns:
        - label: 可能性
          note: 根据保留的公开证据，下行情景出现的可能性。
        - label: 影响
          note: 对融资灵活性、增长或估值的潜在损害。
        - label: 缓释成熟度
          note: 公开可见的具体运营或治理缓释措施有多少。
      rows:
        - label: 欧洲收缩与重返欧洲的经济性
          note: 关停已经发生；未来在欧洲的经济性仍取决于客户、政策和资本。
          values:
            - label: 高
              tone: high
              note: 收缩已经发生。
            - label: 高
              tone: high
              note: 失去选择空间和关停成本可能损害战略灵活性。
            - label: 低
              tone: low
              note: 保留来源没有展示出证据充分的完整恢复计划。
        - label: 2026 年盈利和出货目标落空
          note: 相对于目前可见的证据，公开目标仍然激进。
          values:
            - label: 中
              tone: medium
              note: 最近已有利润改善，但持续表现尚未得到验证。
            - label: 高
              tone: high
              note: 目标落空会迅速打击融资能力和可信度。
            - label: 中
              tone: medium
              note: 存在一些缓释因素，但从第四季度利润到可持续回报的公开桥接仍不完整。
        - label: 半固态商业化与客户认证
          note: 路线图时间表已公开，但客户证据仍不完整。
          values:
            - label: 中
              tone: medium
              note: 时间表明确，但认证仍可能推迟。
            - label: 中
              tone: medium
              note: 延期会压缩上行空间，并削弱技术领先地位的说法。
            - label: 低
              tone: low
              note: 保留来源尚未显示已有明确名称的官方上市客户。
        - label: 泰国质量与规模化控制
          note: 工厂具备可见的控制措施，但公开的现场表现数据有限。
          values:
            - label: 中
              tone: medium
              note: 控制措施可见，但样本仍处于早期。
            - label: 中
              tone: medium
              note: 运营失误会拖慢东盟规模化和利润率改善。
            - label: 中
              tone: medium
              note: 良率、自动化、可追溯性和认证都是真实的缓释因素。
        - label: 泰国合作伙伴与客户集中度
          note: 已具名的部署集中在 Banpu 和 Great Wall 关联项目周围。
          values:
            - label: 高
              tone: high
              note: 当前公开证据集中而不广泛。
            - label: 中
              tone: medium
              note: 集中度不会立即击垮公司，但可能限制海外韧性。
            - label: 低
              tone: low
              note: 保留来源没有展示出多元化的公开客户组合。
        - label: 治理结构与披露深度
          note: 董事会和监事结构已经存在，但外部投资人仍需要私下材料。
          values:
            - label: 中
              tone: medium
              note: 这是一个正在进行的尽调问题，而非已证实的控制失效。
            - label: 中
              tone: medium
              note: 披露单薄会削弱投资人信心，也会妨碍风险定价。
            - label: 中
              tone: medium
              note: 正式治理结构存在，但资本配置纪律的证据仍不完整。
