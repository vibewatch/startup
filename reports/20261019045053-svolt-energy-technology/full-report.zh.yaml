  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据确认，SVOLT 变现的是多种电池形态，而非单一 SKU：2022 年 IPO 招股书草案描述了电芯、模组、电池包、储能电池系统，以及按客户需求定制的集成解决方案；2026 年报道又加入了
              Fortress 2.0 PHEV 电池包和半固态电池等较新的高端产品。

              对投资判断而言，问题不在于识别产品家族，而在于现有语料没有按项目披露已实现 ASP、返利、质保准备金或收入确认机制。因此，投资人看得见硬件收入引擎，却难以判断哪些收入流真正带来毛利。
