      - number: '1.3'
        title: 规模更新、商业化里程碑与执行风险
        blocks:
          - type: paragraph
            body: >-
              本轮更新证据同时呈现出持续扩张信号和更复杂的执行画像。独立报道仍将 SVOLT 列为 2025 年全球前十大电动车电池供应商之一， 而官方新闻页面称其在 2026
              年上半年升至第九位。制造本地化也确有进展：Banpu 在泰国的合资项目于 2025 年年中实现第 1 万个电池包。 但 Battery-Tech 报道称，SVOLT 将在 2025
              年停止欧洲子公司运营，并暂停两个德国工厂项目，因此当前经营故事更像是有选择的地域收缩， 而不是全面扩张。
