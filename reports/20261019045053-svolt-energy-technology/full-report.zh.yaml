            body: >-
              较早的招股书和较新的路线图来源指向同一结论：即便撤回了部分欧洲建设计划，SVOLT 仍像一家资金需求很高的制造商。2022 年申报计划拟募资人民币 150 RMB 15
              billion，用于电池基地、研发、化学体系项目和营运资金；同一份文件显示，公司截至 2022 年上半年仍在亏损，2021 年研发支出为 RMB 724.062 million。

              较新的报道称，公司取消了包含约 €2 billion Saarland 项目和另一个 16 GWh Brandenburg 项目的欧洲工厂计划，但半固态项目和本地化服务基础设施的商业化仍需要资金。
