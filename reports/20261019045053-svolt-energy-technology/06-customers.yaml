company:
  name: "SVOLT Energy Technology"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    SVOLT has real customer traction where public evidence is concrete: its Thailand joint
    venture with Banpu had produced 10,000 EV battery packs by June 2025 and those packs were
    already used in multiple Great Wall models sold locally. Outside that core proof, the visible
    pipeline shifts to pre-production or management-described programs such as BMW Mini
    next-generation models, a European passenger-vehicle installation, and unnamed European EV and
    eVTOL orders, while retention and concentration remain largely undisclosed.
sections:
  - id: "customer-segments"
    title: "Public customer proof clusters around captive or partner-led channels"
    body: >-
      The clearest public customer evidence is not a broad disclosed roster but a small set of
      identifiable channels. In Southeast Asia, SVOLT and Banpu's Thailand joint venture had
      already produced its 10,000th EV battery pack by June 2025, and Gasgoo reported those packs
      were used in Great Wall's ORA Good Cat, HAVAL H6 PHEV, and TANK 300 HEV models sold in
      Thailand. Outside that base, disclosed customer proof becomes more forward-looking. CnEVPost
      and Electrive both reported that SVOLT's first-generation semi-solid batteries are intended
      for BMW Mini's next-generation models, while AutoTech and Battery-Tech described broader
      European passenger-vehicle and eVTOL programs without giving customer names or contracted
      volumes. That mix implies current customer concentration around affiliated or partner-shaped
      programs, with international diversification still more visible in engineering validation than
      in booked, disclosed series-production demand.
    claimRefs: ["CU001", "CU002", "CU004", "CU005", "CU006", "CU007"]
    tableRefs: ["TU001", "TU003"]
  - id: "adoption-and-durability"
    title: "Adoption evidence is stronger than durability evidence"
    body: >-
      Public adoption signals show that SVOLT can ship and localize battery systems, but they stop
      short of proving repeat purchasing economics. The Thailand operation demonstrates actual
      deployment and manufacturing throughput, and its plan to extend into energy-storage assembly
      lines suggests an account-expansion path beyond current EV packs. The Mini-related semi-solid
      program and the reported European EV and eVTOL projects show external interest in higher-spec
      products, yet the evidence is still mostly milestone language: trial production, planned mass
      production, installation, or secured orders. None of the reviewed sources disclosed customer
      count, renewal rates, gross or net revenue retention, churn, contract length, or the share of
      revenue attributable to any single OEM relationship. As a result, the current record supports
      adoption momentum better than it supports durability or multi-customer breadth.
    claimRefs: ["CU001", "CU003", "CU004", "CU005", "CU006", "CU011", "CU012"]
    tableRefs: ["TU002"]
  - id: "expansion-and-concentration-risks"
    title: "Expansion remains service-led in Europe and vulnerable to concentration and procurement friction"
    body: >-
      The commercial expansion story is mixed. Battery-News reported that SVOLT ended Europe
      operations as a manufacturing effort and would instead focus on technical services,
      warehousing, logistics, and after-sales, which preserves a customer-support presence but
      weakens the argument for near-market supply intimacy. LeadIQ still lists a European subsidiary
      with sales and operations contacts, yet that is a third-party estimate rather than direct
      proof of active customers. At the same time, BusinessKorea reported a Korean technology-leak
      case involving SVOLT entities that was referred to prosecutors, a dispute SVOLT denied. Even
      without proving the allegations, that kind of legal noise can slow OEM qualification or
      procurement committees. Combined with the missing public data on customer concentration, the
      evidence supports a view that SVOLT's customer expansion outside its strongest existing
      channels remains possible but not yet de-risked.
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012"]
    figureRefs: ["FU001"]
