figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning suggests SVOLT competes with more technology optionality
      than present procurement trust, while leaders keep the opposite advantage.
    data:
      xAxis:
        label: Current procurement trust / bankable scale
        min: 1
        max: 5
        low: Program-specific or emerging
        high: Bankable global incumbent
        description: Ordinal score synthesized from installed scale and buyer-trust signals in retained sources
        scale: ordinal
      yAxis:
        label: Technology differentiation / strategic optionality
        min: 1
        max: 5
        low: Mostly commodity supply position
        high: Distinct roadmap or strategic option
        description: Ordinal score synthesized from retained roadmap and localization evidence
        scale: ordinal
      points:
        - label: CATL
          x: 5
          y: 3
          tone: neutral
          note: Largest global supplier in 2025; advantage is scale more than differentiated next-gen evidence in this pool
          claimRefs: [CP004]
        - label: BYD
          x: 5
          y: 3
          tone: neutral
          note: Second-largest global supplier in 2025 with strong incumbent position
          claimRefs: [CP004]
        - label: LG Energy Solution
          x: 4
          y: 3
          tone: neutral
          note: Global incumbent with meaningful scale, but retained evidence emphasizes procurement position more than roadmap distinctiveness
          claimRefs: [CP004, CP008]
        - label: CALB / Gotion cohort
          x: 3
          y: 3
          tone: opportunity
          note: Larger than SVOLT on current installed scale, with Gotion also cited among semi-solid competitors
          claimRefs: [CP004, CP010]
        - label: SVOLT
          x: 2
          y: 4
          tone: positive
          note: Smaller installed base today, but semi-solid roadmap plus localization give it more strategic optionality than share alone suggests
          claimRefs: [CP005, CP009, CP014]
        - label: Internal build / JV
          x: 1
          y: 2
          tone: risk
          note: Offers control, but Battery Technology describes several ventures being renegotiated, sold, or dissolved
          claimRefs: [CP008]
    approximationNotes: >-
      Scores are ordinal synthesis rather than benchmark test results or audited
      procurement data; they reflect retained evidence on scale, localization,
      roadmap distinctiveness, and buyer behavior.
    claimRefs: [CP004, CP005, CP008, CP009, CP010, CP014]
callouts:
  - calloutType: risk
    title: Procurement selectivity is the core competitive risk
    body: >-
      The public record suggests SVOLT's hardest obstacle is not proving that it
      has a roadmap, but proving that OEMs should switch away from bigger and more
      trusted suppliers when price transparency and flagship-program confirmation
      are still limited.
    claimRefs: [CP005, CP008, CP011, CP015]
