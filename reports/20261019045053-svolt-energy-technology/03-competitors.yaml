  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-opacity
      missingEvidence: Public contract terms, list pricing, or procurement disclosures that make SVOLT's offer directly comparable with CATL, BYD, LG Energy Solution, or JV alternatives.
      whyItMatters: Without public commercial terms, the chapter can describe product and channel positioning but cannot prove a cost-based moat or discount strategy.
      diligencePath: Request customer contracts, quotation sheets, bid decks, or investor materials that show pricing, take-or-pay terms, and volume commitments by chemistry or pack format.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: customer-confirmation
      missingEvidence: Official OEM confirmation of which named vehicle programs, if any, will launch with SVOLT semi-solid batteries.
      whyItMatters: The difference between a rumored program and a signed launch materially changes how durable SVOLT's differentiation looks versus larger battery incumbents.
      diligencePath: Request OEM award letters, launch-program documentation, homologation records, or on-the-record customer confirmation for Mini or other next-generation platforms.
      relatedQuestionRefs: [QP006]
