      - ["Overseas access and localization", "Germany and Thailand plants/service build-out reported; Jan-Feb 2026 overseas share reached 39%", "Leaders already benefit from broader global procurement trust implied by scale", "Localized by design when a JV remains active", "Localization helps SVOLT narrow, but not erase, the credibility gap"]
      - ["Semi-solid commercialization timing", "Series production planned for September 2026; mid-nickel mass production cited for October 2026", "Chinese peers including CATL and Gotion also have semi-solid programmes", "Mostly undisclosed in retained corpus", "Roadmap is relevant, but not exclusive"]
      - ["Confirmed next-gen customer program", "Mini link remains unconfirmed in the retained public corpus", "Vehicle-program ties are generally stronger for larger incumbents, but detailed disclosures are sparse here", "Specific programs proceed only where OEMs stay committed", "SVOLT still needs clearer flagship-program proof"]
      - ["Public price transparency", "No comparable list or contract pricing disclosed", "No comparable list or contract pricing disclosed", "No transfer-price economics disclosed", "Commercial opacity weakens hard proof of a price-led moat"]
    notes: >-
      Unsupported cells are marked as undisclosed rather than estimated; the table
      compares public evidence quality as much as product capability.
