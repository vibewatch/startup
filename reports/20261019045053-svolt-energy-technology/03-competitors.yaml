      - ["SVOLT semi-solid roadmap", "No public list price", "Roadmap-led rather than contracted-price-led in retained sources", "Semi-solid cells, higher energy density targets, and fast-charging claims", "Differentiation exists, but price/performance proof is still incomplete"]
      - ["Incumbent external supply", "No comparable public list price", "Battery Technology says automakers are consolidating around fewer trusted partners", "Scaled volume, procurement trust, and existing OEM relationships", "Opaque pricing increases the value of incumbent trust and program history"]
      - ["Internal build / JV substitute", "No public transfer price", "Program-specific ventures; some 2026 deals were dissolved or renegotiated", "Potential vehicle-specific integration and supply control", "The substitute route is available, but it is capital intensive and fragile when demand slows"]
    notes: >-
      This is a commercial-transparency table, not a confirmed price book:
      "not publicly disclosed" means the retained source pool did not publish a
      directly comparable price or contract term.
