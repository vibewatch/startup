evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-cap-table
    missingEvidence: A current valuation source, latest round terms, total raised, and cap-table summary.
    whyItMatters: >-
      Without financing and cap-table evidence, later valuation work cannot test whether industrial traction justifies
      the latest private pricing.
    diligencePath: >-
      Request the latest financing deck, cap table, or a management-confirmed round history with investor names, dates,
      amounts, and security terms.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A current founder roster, board composition, and governance-rights map.
    whyItMatters: >-
      Leadership visibility is concentrated in a few spokesperson quotes, which is not enough to assess succession
      depth, board oversight, or investor control rights.
    diligencePath: >-
      Obtain the current org chart, board list, and any shareholder-rights summary that identifies directors, observers,
      and veto holders.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: post-europe-allocation
    missingEvidence: Current headcount, plant utilization, and capital-allocation detail after the Europe pullback.
    whyItMatters: >-
      The Europe retrenchment changes how to interpret production footprint, fixed-cost burden, and the credibility of
      future commercialization targets.
    diligencePath: >-
      Ask management for current headcount by geography, active plant status, utilization, and where canceled Europe
      spend was reallocated.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: Public segment-level booked GWh, pricing, or backlog by geography and buyer class.
    whyItMatters: >-
      Without segment revenue and backlog cuts, the market chapter cannot convert installation growth into a verified
      SVOLT-specific SAM or SOM.
    diligencePath: >-
      Request management pipeline, order-book, and regional shipment cuts that separate EV, hybrid, and storage demand
      by customer and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: installation-vs-shipment-basis
    missingEvidence: A reconciled bridge between market-installation datasets and SVOLT's shipment guidance.
    whyItMatters: >-
      Installations, supplier share, and management shipments are useful lenses but do not measure the same denominator
      or timing window.
    diligencePath: >-
      Ask finance and operations for a shipped-GWh versus installed-GWh bridge and a list of any customer programs
      already reflected in the 61 GWh plan.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-concentration
    missingEvidence: Customer concentration, procurement owners, and signed regional storage-project pipeline.
    whyItMatters: >-
      Buyer mix determines whether export traction is diversified or still dependent on a small number of OEM or JV
      programs.
    diligencePath: >-
      Request top-customer concentration, named storage-project pipeline, and procurement decision-maker mapping by
      region.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public contract terms, list pricing, or procurement disclosures that make SVOLT's offer directly comparable with
      CATL, BYD, LG Energy Solution, or JV alternatives.
    whyItMatters: >-
      Without public commercial terms, the chapter can describe product and channel positioning but cannot prove a
      cost-based moat or discount strategy.
    diligencePath: >-
      Request customer contracts, quotation sheets, bid decks, or investor materials that show pricing, take-or-pay
      terms, and volume commitments by chemistry or pack format.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-confirmation
    missingEvidence: Official OEM confirmation of which named vehicle programs, if any, will launch with SVOLT semi-solid batteries.
    whyItMatters: >-
      The difference between a rumored program and a signed launch materially changes how durable SVOLT's
      differentiation looks versus larger battery incumbents.
    diligencePath: >-
      Request OEM award letters, launch-program documentation, homologation records, or on-the-record customer
      confirmation for Mini or other next-generation platforms.
    relatedQuestionRefs:
      - QP006
  - type: stale
    severity: material
    topic: current-financial-statements
    missingEvidence: Audited or prospectus-grade income statement, balance sheet, cash-flow statement, and segment mix for 2023-2026.
    whyItMatters: >-
      Without updated financial statements, revenue quality, gross margin direction, and working-capital demands are
      still inferred from stale 2022 disclosure plus operating proxies.
    diligencePath: >-
      Request the latest audited statements, board deck, and monthly management accounts, then reconcile them to
      shipment and capacity disclosures.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-debt
    missingEvidence: Current cash balance, debt maturities, covenants, committed capex, and minimum-liquidity thresholds.
    whyItMatters: >-
      Capital adequacy is the chapter's core judgment, and it cannot be underwritten from shipment and roadmap evidence
      alone.
    diligencePath: Obtain the latest treasury schedule, debt agreements, capex plan, and 12-18 month cash bridge from management.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Program-level ASPs, rebates, raw-material pass-through terms, customer concentration, and warranty reserve
      assumptions.
    whyItMatters: Shipment growth can still destroy value if realized pricing, mix, or warranty burden is structurally weak.
    diligencePath: Review signed customer contracts, price-adjustment clauses, and pack-level gross-margin analysis by major program.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A practitioner-community proxy such as supplier conference talks, engineer recruiting decks, integration
      documentation, or industry-forum discussion of SVOLT's battery stack.
    whyItMatters: >-
      Without external practitioner signal, the diligence process cannot easily test integration friction, debugging
      burden, or technical adoption outside company-managed launch narratives.
    diligencePath: >-
      Request public engineer talks, recruiting packs, pack-integration documentation, or partner engineering references
      that show real technical adoption and support burden.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: validation-data
    missingEvidence: >-
      Independent cycle-life, abuse-safety, homologation, and warranty-performance data for Fortress, Dragon Armor, and
      the hybrid solid-liquid roadmap.
    whyItMatters: >-
      The investment case depends on performance and reliability claims that are stronger than the current public
      validation set.
    diligencePath: >-
      Obtain certification packs, third-party test reports, warranty curves, and customer validation summaries for the
      announced battery products.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: commercialization-timing
    missingEvidence: >-
      Customer SOP milestones, signed production schedules, and shipped-volume evidence for semi-solid programs and
      Thailand-led expansion.
    whyItMatters: >-
      Public timing moved materially between 2025 and 2026 coverage, so underwriting commercialization speed without
      primary evidence would overstate technical maturity.
    diligencePath: >-
      Request customer start-of-production schedules, plant ramp dashboards, and signed nomination evidence for
      announced semi-solid or localized-pack programs.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Customer-count history, renewal data, churn, GRR/NRR, and contract-length disclosure by cohort or major program.
    whyItMatters: Without retention or cohort data, it is difficult to distinguish one-time launches from durable recurring demand.
    diligencePath: Request cohort retention, reorder cadence, and contract-tenor data for top OEM and ESS accounts.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue or shipment share by top customer, especially Great Wall-affiliated demand versus external OEMs.
    whyItMatters: Customer concentration is central to judging whether current adoption is diversified or still effectively captive.
    diligencePath: Ask management for top-customer share, related-party share, and the external-customer mix by 2025 and 2026 YTD.
    relatedQuestionRefs:
      - QU004
      - QU006
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A fuller list of named production customers and named ESS users outside the Thailand/GWM channel.
    whyItMatters: The public named-customer set is too narrow to prove broad market penetration or diversified reference quality.
    diligencePath: >-
      Request a referenceable customer list with program stage, geography, and whether each account is pilot, SOP, or
      repeat production.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: active-litigation-enforcement
    missingEvidence: >-
      A current docket, recall, and regulator-notice package covering China, the EU, Thailand, and other active SVOLT
      jurisdictions.
    whyItMatters: >-
      The retained public corpus supports trade and operating-risk analysis, but it does not establish whether SVOLT
      currently faces litigation, recalls, or enforcement specific to product safety, labor, or environmental matters.
    diligencePath: >-
      Run jurisdiction-by-jurisdiction court, recall, environmental, labor, and customs checks and reconcile them to
      SVOLT legal entities and plants.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-capex-headroom
    missingEvidence: >-
      Updated audited financial statements, debt terms, cash balances, and board-approved capex allocations after the
      Europe shutdown.
    whyItMatters: >-
      Capital intensity is the central downside risk, but public sources do not show whether current liquidity can
