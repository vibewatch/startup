chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Public evidence supports SVOLT as a real multi-layer battery manufacturer rather than a lab-stage chemistry story: third-party coverage shows commercial pack programs, a Thailand pack plant, and top-10 battery share in China and globally. The main differentiation claim is its fast-charging and semi-solid / hybrid solid-liquid roadmap, but most performance, timing, and quality assertions still come through company-mediated trade coverage rather than independent certification or field-reliability data.
sections:
  - id: "delivered-portfolio"
    title: "Delivered portfolio is broader than a single cell program"
    body: |-
      The public record describes SVOLT as a power-battery and energy-storage supplier, not only a chemistry developer. RideAI characterizes the company as a producer of power batteries and energy storage systems, while 2026 trade coverage shows specific pack-level SKUs rather than generic platform language. The strongest currently evidenced delivered products are vehicle packs: Fortress 2.0 for plug-in hybrids and Dragon Armor for range-extender applications. That means the customer workflow is anchored in OEM pack supply, charging performance, and manufacturable integration, with energy storage expansion still more directional than fully enumerated in the assigned public evidence.
    claimRefs: ["CE001", "CE002", "CE003", "CE004"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "architecture-and-operating-model"
    title: "Architecture and operating model point to a vertically integrated battery stack"
    body: |-
      Multiple sources describe SVOLT across the battery stack, from materials and cells through modules, packs, battery-management systems, and energy-storage technologies. Best Magazine's reporting on the company's electrolyte-transfer process and B-sample verification suggests SVOLT is trying to commercialize new chemistry on top of existing manufacturing infrastructure instead of waiting for a greenfield solid-state line. Gasgoo's description of the Thailand JV plant adds operational detail that is absent from the chemistry stories: CTP and LCTP/HEV lines, MES traceability, automated testing, and local certification. Together, those details support real operating maturity, but they still leave public gaps on field reliability, warranty behavior, and independently verified throughput economics.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE011", "CE012"]
    tableRefs: ["TE003"]
  - id: "roadmap-differentiation-and-risks"
    title: "Roadmap ambition is credible, but timing and proof remain the core diligence risks"
    body: |-
      SVOLT's differentiation story rests on faster charging, higher-density semi-solid chemistry, and enough production scale to matter with OEMs. The caution is that public commercialization timing has moved quickly: 2025 reporting framed semi-solid cells as trial production with mass production later, while 2026 coverage describes large-scale or volume production beginning in September 2026. That may indicate execution progress, but it also means investors should not underwrite the roadmap as de-risked until customer start-of-production milestones, certification packs, and field-performance data are independently visible. Product delivery also remains capital intensive: Yicai reported that the withdrawn Shanghai IPO had planned to put most proceeds into capacity expansion projects, so roadmap execution still appears tied to financing as well as engineering.
    claimRefs: ["CE005", "CE006", "CE013", "CE014", "CE015"]
