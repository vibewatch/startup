      - number: '1.1'
        title: Identity, scope, and current footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned pool consistently identifies SVOLT as a 2018-founded battery company headquartered in Jintan
              District, Changzhou, with product scope that runs from cells, modules, and packs into multiple
              stationary-storage formats. Official materials are still the strongest anchor for what the company says it
              is today: the homepage and news surface describe activity across passenger vehicles, commercial
              applications, energy storage, and renewable recycling, while also listing 14 global production sites, 3
              technology R&D centers, 11,000+ patent applications, and RMB 5.2 billion of R&D investment from 2019 to
              2025. Those figures establish industrial ambition and breadth, but not utilization, revenue, or
              profitability.
