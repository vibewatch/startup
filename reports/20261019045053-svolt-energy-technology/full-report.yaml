      - number: '2.3'
        title: Buyers, adoption path, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The visible adoption path is program-led procurement by OEM platform teams, regional joint ventures, and
              storage-project developers rather than retail battery purchases. On the auto side, SVOLT is pushing into
              high-volume buyer workflows through PHEV packs, semi-solid batteries, and BMW Mini-linked programs, which
              suggests that platform energy density, charging speed, localization, and cost-per-kWh remain the central
              buying criteria. On the storage side, the official CIBF update and the Thailand JV statements indicate
              demand from overseas integrators and project developers who care about regional supply resilience,
              compliance, and lifecycle service. The same evidence also shows the constraint set: semi- solid batteries
              are still early, fully solid-state industrialization remains unresolved, and localization incentives such
              as Thailand's EV 3.0 program matter because adoption depends on policy, certification, and local
              production economics rather than pure product merit.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
