            body: >-
              Multiple sources describe SVOLT across the battery stack, from materials and cells through modules, packs,
              battery-management systems, and energy-storage technologies. Best Magazine's reporting on the company's
              electrolyte-transfer process and B-sample verification suggests SVOLT is trying to commercialize new
              chemistry on top of existing manufacturing infrastructure instead of waiting for a greenfield solid-state
