      - number: '3.3'
        title: Switching costs favor trusted suppliers, and pricing remains opaque
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal in the pool is not a direct attack on SVOLT's technology but the way buyer
              behavior is changing. Battery Technology wrote that automakers are consolidating around fewer trusted
              partners after a wave of renegotiated or dissolved ventures, which raises the threshold for a smaller
              supplier to displace an incumbent on anything other than a clearly superior program. That dynamic makes
              SVOLT's export traction useful but not decisive: Gasgoo linked the company to Stellantis, Hyundai, and
              VinFast supply chains, yet Best Magazine also said an oft-discussed Mini semi-solid program still lacks
              official confirmation. EqualOcean's withdrawn IPO and heavy capex plan reinforce that this remains a
              capital-intensive contest, and the retained corpus still offers no comparable public list pricing or
              contract economics for SVOLT versus larger peers. Buyers therefore can see the roadmap, but not enough
              public commercial detail to prove that SVOLT wins on total cost or contract flexibility.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
