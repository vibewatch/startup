              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real deployment exists, but mainly in one visible channel
            body: >-
              The Thailand JV gives SVOLT genuine production evidence instead of logo-only proof, but the most concrete
              public deployment still sits inside a narrow regional and related-party orbit.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU007
          - type: callout
            title: Durability and concentration remain the key customer diligence gap
            body: >-
              The public corpus shows launches, installations, and planned supply, but it does not show customer count,
              renewal quality, or how dependent SVOLT remains on a small number of OEM programs.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence points to a risk stack led by capital intensity and execution sequencing.
              SVOLT has already terminated its European commercial operations after announcing multi-gigawatt German
              projects, which means investors are no longer evaluating a hypothetical overseas setback but a realized
              retrenchment with unclear cleanup costs and unclear re-entry economics. At the same time,
              management-linked public reporting still frames 2026 as the year for full-year profitability, 61 GWh
              shipments, and semi-solid battery industrialization. That combination makes the central diligence question
              less about whether SVOLT has demand ambition and more about whether its current plants, partner structure,
              and financing capacity can absorb another aggressive ramp without repeating the Europe outcome at a larger
              scale.
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
