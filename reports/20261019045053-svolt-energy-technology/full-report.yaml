  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Public customer proof clusters around captive or partner-led channels
        blocks:
          - type: paragraph
            body: >-
              The clearest public customer evidence is not a broad disclosed roster but a small set of identifiable
              channels. In Southeast Asia, SVOLT and Banpu's Thailand joint venture had already produced its 10,000th EV
              battery pack by June 2025, and Gasgoo reported those packs were used in Great Wall's ORA Good Cat, HAVAL
              H6 PHEV, and TANK 300 HEV models sold in Thailand. Outside that base, disclosed customer proof becomes
              more forward-looking. CnEVPost and Electrive both reported that SVOLT's first-generation semi-solid
              batteries are intended for BMW Mini's next-generation models, while AutoTech and Battery-Tech described
              broader European passenger-vehicle and eVTOL programs without giving customer names or contracted volumes.
              That mix implies current customer concentration around affiliated or partner-shaped programs, with
              international diversification still more visible in engineering validation than in booked, disclosed
              series-production demand.
