      - number: '5.3'
        title: Roadmap ambition is credible, but timing and proof remain the core diligence risks
        blocks:
          - type: paragraph
            body: >-
              SVOLT's differentiation story rests on faster charging, higher-density semi-solid chemistry, and enough
              production scale to matter with OEMs. The caution is that public commercialization timing has moved
              quickly: 2025 reporting framed semi-solid cells as trial production with mass production later, while 2026
              coverage describes large-scale or volume production beginning in September 2026. That may indicate
              execution progress, but it also means investors should not underwrite the roadmap as de-risked until
              customer start-of-production milestones, certification packs, and field-performance data are independently
              visible. Product delivery also remains capital intensive: Yicai reported that the withdrawn Shanghai IPO
