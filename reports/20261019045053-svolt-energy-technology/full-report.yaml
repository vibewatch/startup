              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: What public evidence still cannot isolate
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to define the market boundary and show demand momentum, but it is still
              weak for a true diligence-grade SAM/SOM. Available figures mix global installations, ex-China
              installations, and management shipment targets, which are useful for triangulation but not directly
              comparable as one funnel. The public corpus also does not show customer-by-customer backlog, segment gross
              margin, or booked GWh by geography, so it cannot separate aspirational platform wins from contracted
              recurring demand. That matters for valuation because a battery supplier with meaningful export traction
              can still have very different economics depending on concentration, localization costs, and how much of
              the storage opportunity is real project pipeline versus trade-show interest.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM016
