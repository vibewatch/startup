              - CP003
              - CP008
              - CP009
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Procurement selectivity is the core competitive risk
            body: >-
              The public record suggests SVOLT's hardest obstacle is not proving that it has a roadmap, but proving that
              OEMs should switch away from bigger and more trusted suppliers when price transparency and
              flagship-program confirmation are still limited.
