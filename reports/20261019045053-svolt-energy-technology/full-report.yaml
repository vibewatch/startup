      - number: '4.3'
        title: Capital intensity remains the central underwriting issue
        blocks:
          - type: paragraph
            body: |-
              The older prospectus and newer roadmap sources point in the same direction: SVOLT still
              looks like a capital-hungry manufacturer even after retreating from part of its Europe
              buildout. The 2022 filing plan sought RMB 15 billion of IPO proceeds for battery bases,
              R&D, chemistry programs, and working capital, and the same filing showed losses through
              1H22 plus R&D spending of RMB 724.062 million in 2021. More recent reporting says the
              company cancelled European factory plans that had included a roughly €2 billion Saarland
              project and a separate 16 GWh Brandenburg plan, but product roadmaps still require
              commercialization funding for semi-solid programs and localized service infrastructure.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI008
              - CI009
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: |-
              Financially, the evidence supports a business with credible manufacturing scale and a
              broad battery product portfolio, but not a clean underwriting case. Management-linked
              2026 profitability targets and shipment goals are directionally encouraging, yet the
              current public record still lacks cash, debt, covenant, gross-margin, customer
              concentration, and realized-pricing disclosure. The practical conclusion is that SVOLT's
              revenue quality is plausible but unproven at investor-grade detail: a buyer can believe
              in demand growth and product expansion while still requiring fresh audited statements and
              program-level economics before treating the company as self-funding.
            claimRefs:
              - CI005
              - CI011
              - CI012
              - CI017
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy is still the main blocker
            body: >-
              Without updated cash, debt, and cash-flow disclosure, investors cannot tell whether Europe retrenchment
              materially reduced external financing dependency or just delayed it.
            calloutType: risk
            claimRefs:
