  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              SVOLT's served market is broader than a single passenger-EV cell niche. Public portfolio and channel
              evidence show it selling across battery materials, cells, modules, packs, battery management systems, and
              stationary energy-storage products, while recent marketing and project evidence span passenger EV, hybrid,
              and storage applications. That supports a market boundary centered on battery-system spend for vehicle
              platforms and storage projects, not downstream vehicle revenue, charging-network revenue, or upstream
              raw-material mining. The practical substitute set therefore includes incumbent lithium-ion suppliers for
              BEV, PHEV, and HEV programs, plus alternative storage-system vendors and in-house OEM sourcing from larger
              incumbents. The market is attractive because adjacent storage demand can diversify the buyer base, but the
              company still needs to win concrete vehicle or project programs rather than rely on generic battery TAM
              narratives.
            claimRefs:
              - CM001
              - CM002
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
