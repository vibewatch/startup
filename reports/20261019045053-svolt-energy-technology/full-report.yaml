          2026 shipments approach the 61 GWh company target, full-year profitability arrives after Q4 2025
          profitability, and semi-solid commercialization reaches customer programs on time.
        - >-
          A fresh financing or credible IPO-prep package could justify defending or improving on the last disclosed
          headline valuation because proof would be catching up with narrative.
        - >-
          Technology milestones may not translate into sustained margins, and customer concentration could still cap the
          multiple.
        - Look for audited FY2025/FY2026 numbers, confirmed production ramp data, and arm's-length price discovery.
      - - Base
        - >-
          SVOLT remains top ten globally, keeps advancing products, and improves profitability, but public disclosure
          stays too thin to refresh valuation rigorously.
        - Entry discipline should demand a discount to the stale 2023 pricing anchor, or investors should wait.
        - >-
          The company could be operationally stronger than the public record shows, but the upside is hard to monetize
          without price clarity.
        - Mixed operating progress with incomplete financing transparency best fits the current evidence set.
      - - Bear
        - >-
          Semi-solid timing slips, capital needs stay high, Europe retrenchment foreshadows weaker demand or
          utilization, and the next capital raise is less investor-friendly.
        - >-
          Down-round or preference-heavy capital would compress common-equity upside even if the business remains
          operational.
        - >-
          Execution misses, multiple compression, and customer concentration can all hurt returns simultaneously in
          battery manufacturing.
        - Absence of fresh terms, fresh audits, and reconciled milestone timing is the main warning sign today.
    notes: >-
      Scenario framing is directional because no current public cap-table or precise 2025/2026 valuation mark was found
      in the assigned source pool.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
