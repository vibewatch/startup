              - CR014
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              Another large overseas capex commitment before audited profitability, plant utilization, and customer
              diversification are evidenced would suggest SVOLT has not internalized the lessons of the Europe retreat.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
          - type: callout
            title: Best visible mitigation
            body: >-
              Thailand is the strongest public mitigation signal because it combines certified operations, traceability,
              and named customer deployments, but it mitigates only part of the story: it does not by itself prove broad
              customer diversity, Europe economics, or semi-solid qualification.
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
