              - CI008
              - CI009
          - type: callout
            title: Volume signals are ahead of economics signals
            body: >-
              The latest public evidence is rich on shipment, market-share, and product-launch activity, but still thin
              on realized pricing, gross margin, and customer concentration.
            calloutType: insight
            claimRefs:
