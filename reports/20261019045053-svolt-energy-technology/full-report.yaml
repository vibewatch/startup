  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and current position
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a battery market where today's competitive center of gravity is still
              scale, not novelty. SNE Research data cited by CnEVPost shows CATL and BYD with 55.6% of global 2025 EV
              battery installations, which means any smaller challenger starts each OEM discussion at a trust and
              bankability disadvantage. Within that ranking, SVOLT still matters because it is inside the global top
              ten, but its 2.4% share and 28.5 GWh of installations leave it competing from the second tier rather than
              dictating industry terms. EqualOcean and World Economic Forum profile material also show that SVOLT's
              scope is broad enough to cover battery cells, packs, and energy-storage systems, so the company is not
              narrowly single product, but it does not yet have leader-scale evidence in the public corpus.
