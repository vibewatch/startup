      - number: '3.2'
        title: Differentiation comes from chemistry and localization, not current share
        blocks:
          - type: paragraph
            body: >-
              SVOLT's public wedge is a technology-and-deployment story rather than a pure volume story. Electrive and
              Battery-Tech Network both describe semi-solid battery milestones that pull commercialization into 2026,
              while Best Magazine's reporting makes clear that this is not a uniquely owned lane: CATL, Gotion
              High-Tech, and WeLion are also pursuing semi-solid programs. That leaves SVOLT with a real but
              non-exclusive differentiator. The more durable angle in the current corpus is the combination of
              next-generation chemistry with localization. EqualOcean described German and Thai expansion, and Gasgoo
              later framed Germany and Thailand service hubs as part of the overseas pitch. In practice, that means
              SVOLT is trying to sell OEMs a mix of export readiness, regional service, and a forward roadmap rather
              than a price-led commodity proposition.
