              - CR002
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and market-access risk
        blocks:
          - type: paragraph
            body: >-
              No retained source shows a current headline enforcement action specific to SVOLT, but the company still
              faces material regulatory and market-access exposure. The clearest visible risk is Europe: the European
              Commission has finalized countervailing duties on Chinese BEV imports and is only offering an alternative
              price-undertaking path that can constrain minimum pricing, sales channels, and investment commitments.
              Against that backdrop SVOLT has already shut down its European commercial operations and suspended
              previously announced factory plans, making any future Europe strategy more contingent on customer pull,
              local economics, and capital availability than on technology alone. Governance structure exists on the
              investor page, but public disclosure remains thin versus the capital decisions still implied by any
              renewed overseas expansion.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
      - number: '7.3'
        title: Operational, partner, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The Thailand operation is the strongest public mitigation signal in the current evidence set: the Banpu
              joint venture has shipped at least 10,000 battery packs, cites a 99.9% yield rate, and describes
              traceability and certification progress. Even so, the public customer proof around that plant is still
              concentrated in China-brand vehicle programs and policy support in Thailand, not a broad disclosed mix of
              global OEMs. The same concentration pattern appears in technology commercialization. Independent reporting
              says semi-solid production should begin in September 2026, but it also says no official customer programme
              has yet been confirmed. That leaves SVOLT trying to prove manufacturing quality, customer diversity, and
              new-chemistry qualification in parallel while carrying a large fixed footprint of sites, headcount, and
              R&D spend.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
