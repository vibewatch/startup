      - number: '6.2'
        title: Adoption evidence is stronger than durability evidence
        blocks:
          - type: paragraph
            body: >-
              Public adoption signals show that SVOLT can ship and localize battery systems, but they stop short of
              proving repeat purchasing economics. The Thailand operation demonstrates actual deployment and
              manufacturing throughput, and its plan to extend into energy-storage assembly lines suggests an
              account-expansion path beyond current EV packs. The Mini-related semi-solid program and the reported
              European EV and eVTOL projects show external interest in higher-spec products, yet the evidence is still
              mostly milestone language: trial production, planned mass production, installation, or secured orders.
              None of the reviewed sources disclosed customer count, renewal rates, gross or net revenue retention,
              churn, contract length, or the share of revenue attributable to any single OEM relationship. As a result,
              the current record supports adoption momentum better than it supports durability or multi-customer
              breadth.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
      - number: '6.3'
        title: Expansion remains service-led in Europe and vulnerable to concentration and procurement friction
        blocks:
          - type: paragraph
            body: >-
              The commercial expansion story is mixed. Battery-News reported that SVOLT ended Europe operations as a
              manufacturing effort and would instead focus on technical services, warehousing, logistics, and
              after-sales, which preserves a customer-support presence but weakens the argument for near-market supply
              intimacy. LeadIQ still lists a European subsidiary with sales and operations contacts, yet that is a
              third-party estimate rather than direct proof of active customers. At the same time, BusinessKorea
              reported a Korean technology-leak case involving SVOLT entities that was referred to prosecutors, a
              dispute SVOLT denied. Even without proving the allegations, that kind of legal noise can slow OEM
              qualification or procurement committees. Combined with the missing public data on customer concentration,
              the evidence supports a view that SVOLT's customer expansion outside its strongest existing channels
              remains possible but not yet de-risked.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
