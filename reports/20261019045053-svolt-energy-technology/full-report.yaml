  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how shipment activity can become revenue, but not the realized pricing or gross-profit
      bridge.
    data:
      nodes:
        - label: Customer demand
          detail: OEM and storage demand evidenced by 28.5 GWh of 2025 installations and 1.66 GWh of Jan-Feb 2026 exports
        - label: Product families
          detail: Cells, modules, packs, energy-storage systems, and integrated solutions
        - label: Program supply
          detail: Sales occur through vehicle programs, pack launches, and region-specific supply-chain entry
        - label: Recognized revenue
          detail: Public sources show shipment proxies, not realized ASP or revenue-recognition timing
        - label: Gross profit bridge
          detail: Margin depends on yield, chemistry mix, warranty, after-sales support, and utilization
        - label: Financing need
          detail: Capex, R&D, and working capital still require fresh cash and debt disclosure
      edges:
        - from: Customer demand
          to: Product families
          label: converts into battery orders
        - from: Product families
          to: Program supply
          label: ships through OEM and storage programs
        - from: Program supply
          to: Recognized revenue
          label: becomes revenue only when contract economics clear
        - from: Recognized revenue
          to: Gross profit bridge
          label: pricing and cost structure determine margin quality
        - from: Gross profit bridge
          to: Financing need
          label: retained earnings or external capital fund the next build cycle
    approximationNotes: >-
