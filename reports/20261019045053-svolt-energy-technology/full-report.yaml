  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest-risk cells cluster around already-visible retrenchment, capital intensity, and targets that still need
      proof at scale.
    data:
      columns:
        - label: Likelihood
          note: How likely the downside scenario appears in the retained public evidence.
        - label: Impact
          note: Potential damage to financing flexibility, growth, or valuation.
        - label: Mitigation maturity
          note: How much concrete operating or governance mitigation is publicly visible.
      rows:
        - label: Europe retrenchment and re-entry economics
          note: Shutdown is real; future Europe economics still depend on customers, policy, and capital.
          values:
            - label: High
              tone: high
              note: The retrenchment has already occurred.
            - label: High
              tone: high
              note: Lost optionality and shutdown costs can impair strategic flexibility.
            - label: Low
              tone: low
              note: No retained source shows a fully evidenced recovery plan.
        - label: 2026 profitability and shipment target miss
          note: Public targets are ambitious relative to the proof set now visible.
          values:
            - label: Medium
              tone: medium
              note: Recent profit progress exists, but sustained performance is unproven.
            - label: High
              tone: high
              note: A miss would hit financing and credibility quickly.
            - label: Medium
              tone: medium
              note: Some mitigation exists, but the public bridge from Q4 profit to durable returns is incomplete.
        - label: Semi-solid commercialization and customer qualification
          note: Roadmap timing is public, but customer proof remains incomplete.
          values:
            - label: Medium
              tone: medium
              note: Schedule is explicit, but qualification can still slip.
            - label: Medium
              tone: medium
              note: Delay would narrow upside and weaken technology leadership claims.
            - label: Low
              tone: low
              note: No retained source shows a named official launch customer yet.
        - label: Thailand quality and scale-up control
          note: The factory has visible controls, but public field-performance data are limited.
          values:
            - label: Medium
              tone: medium
              note: Controls are visible, but the sample is still early.
            - label: Medium
              tone: medium
              note: Operational misses would slow ASEAN scale and margin progress.
            - label: Medium
              tone: medium
              note: Yield, automation, traceability, and certification are real mitigants.
        - label: Partner and customer concentration in Thailand
          note: Named deployments cluster around Banpu and Great Wall-linked programs.
          values:
            - label: High
              tone: high
              note: Current public proof is concentrated rather than broad.
            - label: Medium
              tone: medium
              note: Concentration would not instantly break the company, but it can cap overseas resilience.
            - label: Low
              tone: low
              note: No retained source shows a diversified public customer set.
        - label: Governance structure versus disclosure depth
          note: Board and supervisory structures exist, but outside investors still need private materials.
          values:
            - label: Medium
              tone: medium
              note: This is a live diligence issue rather than a proven control failure.
            - label: Medium
              tone: medium
              note: Thin disclosure impairs investor confidence and risk sizing.
            - label: Medium
              tone: medium
              note: Formal governance exists, but evidence of capital-allocation discipline is incomplete.
    claimRefs:
