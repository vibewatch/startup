      - number: '2.2'
        title: Demand sizing lenses and what they really measure
        blocks:
          - type: paragraph
            body: >-
              The usable public sizing lenses are installations and shipments, not revenue TAM. SNE Research data, as
              reported by BatteryTech Network, shows xEV battery installations outside China reaching 464 GWh in 2025
              after a 47.7% CAGR from 2017 to 2025, then rising another 17.4% year over year to 117.4 GWh in Q1 2026. A
              second lens from CnEVPost, again citing SNE Research, shows global EV battery usage at 1,187 GWh in 2025,
              up 31.7% year over year, with SVOLT holding 28.5 GWh and a 2.4% global share. Those are demand and
              position proxies rather than revenue pools, but they establish that SVOLT is operating inside a large,
              still-growing category rather than a stagnant niche. The main company-specific forward lens is
              management's 61 GWh shipment plan for 2026, which is directionally useful but should not be treated as a
              verified SAM or realized demand figure.
            claimRefs:
              - CM003
              - CM004
