      - number: '1.4'
        title: Technology roadmap and open disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned pool refreshes SVOLT's chemistry roadmap more clearly than it refreshes its financing
              picture. Electrive, Batteries News, and Best Magazine each report sequential milestones from trial
              production in late 2025 to volume deliveries or volume production in 2026, with a Mini-linked customer
              program and a 2027 mass production target still framed as forward-looking rather than fully proven
              commercial scale. None of the retained sources, however, supplies a current valuation, total raised
              figure, detailed round terms, current headcount, or a board-level governance map. Those omissions are
              material because they limit how confidently later chapters can convert industrial momentum into an
              underwriting view on valuation or control.
