      - number: '1.3'
        title: Scale refresh, commercialization milestones, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence shows both continued scale signals and a more complicated execution profile.
              Independent reporting still places SVOLT among the global top ten EV battery suppliers in 2025, while the
              official news page says it improved to ninth place in H1 2026. Manufacturing localization also looks real:
              the Banpu joint venture in Thailand crossed a 10,000-pack milestone in mid-2025. At the same time,
              Battery-Tech reports that SVOLT will cease European subsidiaries and suspend two German factory projects
              by 2025, so the current operating story is one of selective geographic retrenchment rather than uniform
              expansion.
            claimRefs:
              - CO009
