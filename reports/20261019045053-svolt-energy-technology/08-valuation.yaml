company:
  name: SVOLT Energy Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a price-sensitive "research-more" stance rather than a
    buy call. SVOLT shows real manufacturing footprint, technology ambition, and
    some 2026 operating momentum, but the latest company-specific financing anchor
    in the assigned evidence remains the 2023 CNY 46 billion post-money valuation.
    Germany retrenchment, limited fresh financial disclosure, and unclear current
    financing terms leave the current price untestable and dilution underwriting
    incomplete.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The reviewed evidence supports a research-more recommendation with medium
      confidence, a high risk rating, and an unknown valuation stance because no
      current entry price is supported by the assigned evidence. The positive side
      of the case is real: SVOLT still appears in the global top ten for EV battery
      installations, trade outlets describe active semi-solid commercialization
      work, and the company says it maintains a large R&D base and formal governance
      structure. The negative side is more important for underwriting entry price:
      the evidence still points back to a 2023 CNY 46 billion post-money mark, the
      STAR Market IPO was withdrawn, and the private-market exit backdrop remains
      selective rather than broad. Until a new arm's-length financing marker and
      audited operating disclosures close those gaps, the right posture is to keep
      diligence alive without treating the historical headline as current fair
      value.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-price-support
    title: Financing context and price support
    body: >-
      The most concrete public pricing evidence in the assigned pool is still
      historical. EqualOcean reported that SVOLT withdrew its STAR Market IPO after
      originally planning to raise CNY 15 billion and that the company had already
      completed five rounds of financing with cumulative capital above CNY 20
      billion and a CNY 46 billion post-investment valuation. That is useful as a
      ceiling reference, but it is not enough to treat as today's cleared entry
      price because the same public set does not provide refreshed cap-table terms,
      liquidation preferences, or audited post-2022 financial statements. The
      downside case is reinforced by the Germany reversal: both Motor1 and
      EnergyTrend describe cancelled or suspended European plant plans, suggesting
      that management has already had to reset expansion plans in response to softer
      demand and capital intensity. Real market share proves SVOLT is not a science
      project, but current pricing support remains weaker than current scale.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
    tableRefs:
      - TV002
  - id: scenario-framing
    title: Bull, base, and bear scenario framing
    body: >-
      The upside case depends on whether 2026 becomes the year that operating proof
      catches up with technology ambition. Battery-Tech says SVOLT recorded its
      first quarterly profit in Q4 2025, aims for full-year profitability in 2026,
      and plans 61 GWh of battery shipments this year, while Best Magazine and
      Electrive both describe semi-solid milestones tied to 2026 and 2027
      commercialization. Those are meaningful signals, but they are still milestone
      statements rather than fully de-risked evidence of durable margins, customer
      concentration relief, or an open exit window. The base case therefore assumes
      real manufacturing relevance and technology option value, but not enough fresh
      financial or contractual transparency to justify paying up today. The bear
      case is a familiar battery-sector pattern: commercialization timelines slip,
      capex remains heavy, and a future financing happens on less favorable terms
      than the last disclosed headline mark.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness remains the weakest part of the valuation case. Hurun's 2025
      commentary says the unicorn market still has relatively few IPOs versus the
      2021 peak, which matters because SVOLT already abandoned one IPO process and
      has not replaced it in the reviewed public corpus with a fresh financing or
      prospectus-style disclosure package. Before moving from research-more to buy,
      investors should require current audited or auditor-quality FY2025 and 2026
      year-to-date financials, plant utilization and capex by site, binding OEM
      nomination and backlog detail, and the exact economics of any new money or
      structured capital. Without those items, a hold or entry decision would be
      driven more by faith in battery-sector narrative than by price-grounded
      evidence.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
      - CV014
