  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
            Thesis: SVOLT is a real scaled manufacturer rather than a pre-revenue
            concept, with 28.5 GWh of 2025 global EV battery installations and a
            2.4% share.
        - >-
            A refreshed 2026 share trajectory, customer mix, and gross-margin bridge
            would show whether scale is compounding or plateauing.
      - - >-
            Thesis: management and trade coverage describe credible next-generation
            battery work, including semi-solid milestones and 2026 shipment and
            profitability targets.
        - >-
            Confirmed customer SOP dates, qualification status, and audited margins
            on new chemistries would move this from roadmap optionality to priced
            proof.
      - - >-
            Thesis: the company says it maintains six R&D centers, 2,500+ R&D staff,
            8,000+ patents, and a formal governance structure.
        - >-
            Third-party quality, yield, and return-on-capital data would show whether
            the organizational build converts into durable economics.
      - - >-
            Anti-thesis: the freshest public valuation anchor in the corpus is still
            the 2023 CNY 46 billion post-money mark attached to a withdrawn IPO path.
        - >-
            A new priced round, secondary mark, or prospectus-style disclosure pack
            could replace that stale anchor with something underwritable.
      - - >-
            Anti-thesis: Germany project cancellations show that capex plans can be
            reset sharply when demand and economics move against the plan.
        - >-
            Site-level utilization, capex per GWh, and post-Europe capital allocation
            would clarify whether the retreat strengthened discipline or exposed a
            deeper funding need.
    notes: >-
      Rows separate upside and downside arguments; they are qualitative and should be
      read alongside the scenario table rather than as mutually exclusive outcomes.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV011
      - CV012
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
            2026 shipments approach the 61 GWh company target, full-year
            profitability arrives after Q4 2025 profitability, and semi-solid
            commercialization reaches customer programs on time.
        - >-
            A fresh financing or credible IPO-prep package could justify defending or
            improving on the last disclosed headline valuation because proof would be
            catching up with narrative.
        - >-
            Technology milestones may not translate into sustained margins, and
            customer concentration could still cap the multiple.
        - >-
            Look for audited FY2025/FY2026 numbers, confirmed production ramp data,
            and arm's-length price discovery.
      - - Base
        - >-
            SVOLT remains top ten globally, keeps advancing products, and improves
            profitability, but public disclosure stays too thin to refresh valuation
            rigorously.
        - >-
            Entry discipline should demand a discount to the stale 2023 pricing
            anchor, or investors should wait.
        - >-
            The company could be operationally stronger than the public record shows,
            but the upside is hard to monetize without price clarity.
        - >-
            Mixed operating progress with incomplete financing transparency best fits
            the current evidence set.
      - - Bear
        - >-
            Semi-solid timing slips, capital needs stay high, Europe retrenchment
            foreshadows weaker demand or utilization, and the next capital raise is
            less investor-friendly.
        - >-
            Down-round or preference-heavy capital would compress common-equity
            upside even if the business remains operational.
        - >-
            Execution misses, multiple compression, and customer concentration can
            all hurt returns simultaneously in battery manufacturing.
        - >-
            Absence of fresh terms, fresh audits, and reconciled milestone timing is
            the main warning sign today.
    notes: >-
      Scenario framing is directional because no current public cap-table or precise
      2025/2026 valuation mark was found in the assigned source pool.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Real scale and technology option value are offset by stale price discovery and
      execution risk, leading to a research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Real but subscale manufacturing proof
          value: 28.5 GWh global installations; 2.4% 2025 share
          note: Shows operating relevance, but still far behind CATL and BYD.
        - id: tech
          label: Technology option value
          value: Semi-solid milestones; 61 GWh 2026 shipment target
          note: Upside exists if commercialization and profitability convert on time.
        - id: price
          label: Stale public price anchor
          value: 2023 CNY 46 billion post-money; IPO withdrawn
          note: Fresh terms are still missing from the reviewed corpus.
        - id: risk
          label: Execution and dilution risk
          value: Germany retreat; thin fresh financial disclosure
          note: Raises uncertainty around capex discipline and downside protection.
        - id: diligence
          label: Price-clearing evidence
          value: Current audited financials; cap table; arm's-length financing terms
          note: These private inputs are required before a target return can be underwritten.
        - id: call
          label: Recommendation
          value: research-more / high risk / valuation unknown
          note: Keep diligence alive, but require current price discovery and stronger disclosure.
      edges:
        - from: scale
          to: tech
          label: supports upside
        - from: tech
          to: price
          label: still needs price discovery
        - from: price
          to: risk
          label: increases underwriting burden
        - from: risk
          to: diligence
          label: requires verification
        - from: diligence
          to: call
          label: sets current stance
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
      - CV015
callouts:
  - calloutType: recommendation
    title: Entry discipline should move before conviction does
    body: >-
      SVOLT looks substantive enough to keep in diligence, but the evidence in this
      pool supports conviction only if price or disclosure improves. Without a fresh
      financing marker, cap-table terms, and current audited operating detail, the
      safer view is research-more rather than buy.
    claimRefs:
      - CV002
      - CV013
      - CV014
