      - ["Banpu / Banpu NEXT", "Thailand JV partner", "Gasgoo describes Banpu as SVOLT's local manufacturing partner in Chonburi, giving the company a concrete Southeast Asia localization path.", "Confirm ownership split, economics, and whether Thailand output materially diversifies customer concentration."]
