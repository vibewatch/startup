  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-cap-table
      missingEvidence: A current valuation source, latest round terms, total raised, and cap-table summary.
      whyItMatters: Without financing and cap-table evidence, later valuation work cannot test whether industrial traction justifies the latest private pricing.
      diligencePath: Request the latest financing deck, cap table, or a management-confirmed round history with investor names, dates, amounts, and security terms.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: governance-visibility
      missingEvidence: A current founder roster, board composition, and governance-rights map.
      whyItMatters: Leadership visibility is concentrated in a few spokesperson quotes, which is not enough to assess succession depth, board oversight, or investor control rights.
      diligencePath: Obtain the current org chart, board list, and any shareholder-rights summary that identifies directors, observers, and veto holders.
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: post-europe-allocation
      missingEvidence: Current headcount, plant utilization, and capital-allocation detail after the Europe pullback.
      whyItMatters: The Europe retrenchment changes how to interpret production footprint, fixed-cost burden, and the credibility of future commercialization targets.
      diligencePath: Ask management for current headcount by geography, active plant status, utilization, and where canceled Europe spend was reallocated.
      relatedTableRefs: [TO001]
