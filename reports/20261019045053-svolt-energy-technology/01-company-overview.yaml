slug: svolt-energy-technology
runDate: 2026-10-19
company:
  name: SVOLT Energy Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SVOLT enters the refresh with real manufacturing scale, an active semi-solid-state
    commercialization roadmap, and enough independent coverage to anchor later chapters
    on identity and milestones. The same evidence still leaves major holes around
    valuation, total capital raised, board/governance structure, and the capital-allocation
    consequences of the Europe retrenchment.
sections:
  - id: identity-and-footprint
    title: Identity, scope, and current footprint
    body: >-
      The assigned pool consistently identifies SVOLT as a 2018-founded battery company
      headquartered in Jintan District, Changzhou, with product scope that runs from
      cells, modules, and packs into multiple stationary-storage formats. Official
      materials are still the strongest anchor for what the company says it is today:
      the homepage and news surface describe activity across passenger vehicles,
      commercial applications, energy storage, and renewable recycling, while also
      listing 14 global production sites, 3 technology R&D centers, 11,000+ patent
      applications, and RMB 5.2 billion of R&D investment from 2019 to 2025. Those
      figures establish industrial ambition and breadth, but not utilization, revenue,
      or profitability.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, stakeholders, and governance visibility
    body: >-
      Public leadership visibility in the assigned evidence is concentrated in a narrow
      set of named operators rather than a fully disclosed founder or board roster.
      Yang Hongxin is the recurring external spokesperson for product-roadmap and
      commercialization milestones, while Chen Lei appears as the operating voice for
      the Thailand plant. The same pool names strategic stakeholders across parentage,
      investors, partners, and prospective customers, but it does not provide a current
      cap table, board composition, or control-rights map. That means later diligence
      can reuse the named ecosystem around SVOLT, but should not assume governance
      visibility is equivalent to governance strength.
    claimRefs: [CO007, CO008, CO009, CO010, CO012, CO013]
    tableRefs: [TO002, TO003]
  - id: scale-refresh-and-execution
    title: Scale refresh, commercialization milestones, and execution risk
    body: >-
      The refresh evidence shows both continued scale signals and a more complicated
      execution profile. Independent reporting still places SVOLT among the global top
      ten EV battery suppliers in 2025, while the official news page says it improved
      to ninth place in H1 2026. Manufacturing localization also looks real: the Banpu
      joint venture in Thailand crossed a 10,000-pack milestone in mid-2025. At the
      same time, Battery-Tech reports that SVOLT will cease European subsidiaries and
      suspend two German factory projects by 2025, so the current operating story is
      one of selective geographic retrenchment rather than uniform expansion.
    claimRefs: [CO009, CO011, CO015, CO016]
    figureRefs: [FO001]
  - id: roadmap-and-open-disclosure-gaps
    title: Technology roadmap and open disclosure gaps
    body: >-
      The assigned pool refreshes SVOLT's chemistry roadmap more clearly than it refreshes
      its financing picture. Electrive, Batteries News, and Best Magazine each report
      sequential milestones from trial production in late 2025 to volume deliveries or
      volume production in 2026, with a Mini-linked customer program and a 2027 mass
      production target still framed as forward-looking rather than fully proven
      commercial scale. None of the retained sources, however, supplies a current
      valuation, total raised figure, detailed round terms, current headcount, or a
      board-level governance map. Those omissions are material because they limit how
      confidently later chapters can convert industrial momentum into an underwriting
      view on valuation or control.
    claimRefs: [CO010, CO012, CO013, CO014]
