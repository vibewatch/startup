      - ["Xiaomi Corporation", "Named investor", "Battery-Tech lists Xiaomi among investors, making it relevant as a possible strategic or signaling shareholder.", "Clarify whether Xiaomi's role is financial, strategic, or paired with any commercial relationship."]
      - ["IDG Capital", "Named investor", "Battery-Tech also lists IDG Capital among investors, which suggests established venture participation but not current stake size.", "Request current ownership, follow-on participation history, and governance rights."]
