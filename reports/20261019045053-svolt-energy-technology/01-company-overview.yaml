figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained milestone set shows a company moving from spin-out and footprint
      build-out into selective retrenchment in Europe and an increasingly specific
      semi-solid commercialization sequence.
    data:
      items:
        - date: February 2018
          label: Spin-out origin
          detail: Batteries News says SVOLT was spun off from Great Wall Motor in February 2018.
          tone: neutral
        - year: "2018"
          label: Company establishment
          detail: Official and third-party profile evidence both identify 2018 as SVOLT's founding year.
          tone: neutral
        - date: 2025-06-30
          label: Thailand JV milestone
          detail: Gasgoo reported the Banpu-SVOLT Chonburi joint venture produced its 10,000th EV battery pack.
          tone: positive
        - period: "FY2025"
          label: Global top-ten battery standing
          detail: CnEVPost reported 28.5 GWh of 2025 EV battery installations and a tenth-place global ranking.
          tone: neutral
        - period: "By 2025"
          label: Europe retrenchment
          detail: Battery-Tech says SVOLT will cease European subsidiaries and suspend two German factory projects.
          tone: risk
        - period: "Q4 2025"
          label: Semi-solid trial production target
          detail: Electrive reported planned trial production of first-generation 140 Ah semi-solid-state batteries.
          tone: neutral
        - period: H1-2026
          label: Ranking improvement
          detail: The official news page says SVOLT ranked ninth globally in H1 2026 EV battery installations with 40.9% growth.
          tone: positive
        - period: "2026"
          label: Volume deliveries target
          detail: Batteries News reported first-generation semi-solid batteries would enter mass production and volume deliveries in 2026.
          tone: neutral
        - period: September 2026
          label: Semi-solid volume production plan
          detail: Best Magazine reported SVOLT planned to begin volume production of semi-solid-state batteries in September 2026.
          tone: neutral
        - year: "2027"
          label: Mini-linked mass production target
          detail: Electrive linked the first-generation semi-solid program to Mini supply with mass production targeted for 2027.
          tone: neutral
    claimRefs: [CO001, CO009, CO011, CO012, CO013, CO014, CO015, CO016]
