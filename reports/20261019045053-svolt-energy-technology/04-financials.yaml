  evidenceGaps:
    - type: stale
      severity: material
      topic: current-financial-statements
      missingEvidence: Audited or prospectus-grade income statement, balance sheet, cash-flow statement, and segment mix for 2023-2026.
      whyItMatters: Without updated financial statements, revenue quality, gross margin direction, and working-capital demands are still inferred from stale 2022 disclosure plus operating proxies.
      diligencePath: Request the latest audited statements, board deck, and monthly management accounts, then reconcile them to shipment and capacity disclosures.
      relatedQuestionRefs: [QI002, QI003, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: cash-and-debt
      missingEvidence: Current cash balance, debt maturities, covenants, committed capex, and minimum-liquidity thresholds.
      whyItMatters: Capital adequacy is the chapter's core judgment, and it cannot be underwritten from shipment and roadmap evidence alone.
      diligencePath: Obtain the latest treasury schedule, debt agreements, capex plan, and 12-18 month cash bridge from management.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Program-level ASPs, rebates, raw-material pass-through terms, customer concentration, and warranty reserve assumptions.
      whyItMatters: Shipment growth can still destroy value if realized pricing, mix, or warranty burden is structurally weak.
      diligencePath: Review signed customer contracts, price-adjustment clauses, and pack-level gross-margin analysis by major program.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI001, TI002]
