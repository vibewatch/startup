company:
  name: SVOLT Energy Technology
chapter:
  number: 4
  title: Financials
  summary: >-
    The assigned public corpus shows real shipment and market-share scale, but the last
    detailed financial disclosure still comes from SVOLT's 2022 IPO draft. That prospectus
    showed fast 2019-2021 revenue growth alongside persistent losses and elevated R&D spend,
    while newer sources mostly provide shipment, capacity, and commercialization proxies rather
    than current cash, margin, debt, or realized-pricing disclosure.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: |-
      Public evidence confirms that SVOLT monetizes multiple battery formats rather than a
      single SKU: the 2022 IPO draft described cells, modules, packs, energy-storage battery
      systems, and integrated solutions tailored to customer demand, while 2026 reporting adds
      newer premium products such as the Fortress 2.0 PHEV pack and semi-solid batteries.
      The problem for underwriting is not identifying product families; it is that the
      accessible corpus does not disclose realized ASPs, rebates, warranty reserves, or revenue
      recognition mechanics by program. That leaves investors with a visible hardware revenue
      engine but limited insight into which streams actually carry gross profit.
    claimRefs: [CI016, CI012, CI013, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-proxies
    title: Public traction proxies are stronger than public financial transparency
    body: |-
      The strongest current signals are operating proxies, not audited economics. Batteries
      News reported revenue growth from RMB 929.187 million in 2019 to RMB 4.474 billion in
      2021, plus RMB 3.738 billion in 1H22, but no newer P&L is in the assigned corpus. By
      contrast, 2025-2026 sources show the company still moving meaningful battery volume:
      CnEVPost and Electrive both cited 28.5 GWh of 2025 global installations and a 2.4%
      market share, while Gasgoo said Jan-Feb 2026 exports were 1.66 GWh and 39% of total
      shipments. That mix implies commercial traction and export momentum, but not yet the
      realized pricing or margin quality behind the volume.
    claimRefs: [CI003, CI007, CI010, CI015]
    tableRefs: [TI003]
  - id: capital-intensity
    title: Capital intensity remains the central underwriting issue
    body: |-
      The older prospectus and newer roadmap sources point in the same direction: SVOLT still
      looks like a capital-hungry manufacturer even after retreating from part of its Europe
      buildout. The 2022 filing plan sought RMB 15 billion of IPO proceeds for battery bases,
      R&D, chemistry programs, and working capital, and the same filing showed losses through
      1H22 plus R&D spending of RMB 724.062 million in 2021. More recent reporting says the
      company cancelled European factory plans that had included a roughly €2 billion Saarland
      project and a separate 16 GWh Brandenburg plan, but product roadmaps still require
      commercialization funding for semi-solid programs and localized service infrastructure.
    claimRefs: [CI001, CI002, CI005, CI006, CI008, CI009, CI013, CI014]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: |-
      Financially, the evidence supports a business with credible manufacturing scale and a
      broad battery product portfolio, but not a clean underwriting case. Management-linked
      2026 profitability targets and shipment goals are directionally encouraging, yet the
      current public record still lacks cash, debt, covenant, gross-margin, customer
      concentration, and realized-pricing disclosure. The practical conclusion is that SVOLT's
      revenue quality is plausible but unproven at investor-grade detail: a buyer can believe
      in demand growth and product expansion while still requiring fresh audited statements and
      program-level economics before treating the company as self-funding.
    claimRefs: [CI005, CI011, CI012, CI017]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - EV power batteries
        - Cells, modules, and packs sold into OEM vehicle programs
        - GWh; program shipments
        - 28.5 GWh of 2025 global installations; 1.66 GWh exported in Jan-Feb 2026
        - Scaled core line, but current ASP and gross margin are undisclosed
        - Break out revenue by OEM, chemistry, region, and pack versus cell content
      - - Energy storage systems
        - Battery systems and integrated solutions tailored to client demand
        - Project or system contract
        - Product line disclosed in the 2022 prospectus; no current public revenue split
        - Helpful diversification, but mix and service burden are opaque
        - Provide storage revenue, backlog, warranty terms, and gross margin
      - - Semi-solid batteries
        - Next-generation premium cells for future vehicle programs
        - kWh or program contract
        - Volume production targeted for Sep 2026; Mini-linked mass production cited for 2027
        - Forward-looking upside only; realized revenue is not yet evidenced
        - Share SOP timing, committed volumes, yields, scrap rates, and price premium
      - - Integrated PHEV packs
        - Higher-value pack sales around the Fortress 2.0 80 kWh product
        - Pack or vehicle program
        - March 2026 mass-production timing announced; 61 GWh company shipment target for 2026
        - Supports broader monetization than cells alone, but economics are still management-led
        - Disclose BOM, warranty reserve, and service obligations at pack level
    notes: Public corpus identifies monetized product families and activity signals, but null pricing detail remains a diligence gap rather than a zero value.
    claimRefs: [CI007, CI010, CI012, CI013, CI014, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / channel
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source-backed implication
    rows:
      - - OEM battery supply
        - Negotiated per-kWh or per-pack program pricing; exact public values unavailable
        - No current realized ASP disclosed in assigned sources
        - Unknown rebates, raw-material pass-through, tooling recovery, and warranty offsets
        - Scale is evidenced, but revenue quality cannot be inferred from shipment volume alone
      - - Energy storage systems
        - Project or system pricing not publicly disclosed
        - No list-price benchmark or realized margin disclosed
        - Unknown installation scope, maintenance burden, and channel economics
        - Segment exists, but public mix is too coarse for underwriting
      - - Semi-solid premium programs
        - Premium pricing thesis only; no public contract economics
        - Pre-commercial roadmap rather than realized pricing
        - Unknown qualification cost, yield curve, and customer-specific discounting
        - Could lift mix over time, but 2026 public evidence is still launch-stage
      - - Europe-localized manufacturing
        - Plant economics depended on utilization and regional customer awards, not disclosed price cards
        - Project cancellation removed planned capex, not proof of healthier realized margins
        - Unknown sunk costs, exit costs, and redeployment of tooling or staff
        - Capital discipline improved, but the demand signal is mixed
    notes: Rows separate supported contract form from unsupported price points; "unavailable" means the assigned public corpus did not disclose usable pricing or realized-margin data.
    claimRefs: [CI008, CI009, CI013, CI014, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2021 revenue
        - RMB 4.474bn
        - medium
        - Last detailed annual public revenue anchor in the assigned corpus
        - Provide FY2023-FY2026 audited revenue by segment and geography
      - - 1H22 revenue
        - RMB 3.738bn
        - medium
        - Shows scale before the current shipment and market-share updates, but is stale
        - Provide quarterly revenue through 2026 with comparable definitions
      - - 2021 R&D / revenue
        - "~16.2%"
        - low
        - Indicates heavy development spend before recent commercialization claims
        - Disclose current R&D spend, capitalization policy, and program allocation
      - - Profitability status
        - Loss-making through 1H22; first quarterly profit reported for Q4 2025; full-year 2026 profitability target
        - low
        - The bridge from scale to durable earnings is still only partly disclosed
        - Provide audited gross margin, EBITDA, and operating cash flow by quarter
      - - Overseas shipment mix
        - 39% of Jan-Feb 2026 shipments
        - medium
        - Export mix can improve scale and diversification if regional margins hold
        - Provide contribution margin by region and customer
      - - Cash / runway
        - null
        - low
        - Missing cash, debt, and covenant data blocks capital-adequacy underwriting
        - Share latest cash balance, debt maturities, capex budget, and liquidity thresholds
    notes: Confidence reflects source quality and disclosure freshness; null means the assigned corpus did not provide a public value, not that the company has none.
    claimRefs: [CI003, CI005, CI006, CI007, CI011, CI017]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows how shipment activity can become revenue, but not the realized pricing or gross-profit bridge.
    data:
      nodes:
        - label: Customer demand
          detail: OEM and storage demand evidenced by 28.5 GWh of 2025 installations and 1.66 GWh of Jan-Feb 2026 exports
        - label: Product families
          detail: Cells, modules, packs, energy-storage systems, and integrated solutions
        - label: Program supply
          detail: Sales occur through vehicle programs, pack launches, and region-specific supply-chain entry
        - label: Recognized revenue
          detail: Public sources show shipment proxies, not realized ASP or revenue-recognition timing
        - label: Gross profit bridge
          detail: Margin depends on yield, chemistry mix, warranty, after-sales support, and utilization
        - label: Financing need
          detail: Capex, R&D, and working capital still require fresh cash and debt disclosure
      edges:
        - from: Customer demand
          to: Product families
          label: converts into battery orders
        - from: Product families
          to: Program supply
          label: ships through OEM and storage programs
        - from: Program supply
          to: Recognized revenue
          label: becomes revenue only when contract economics clear
        - from: Recognized revenue
          to: Gross profit bridge
          label: pricing and cost structure determine margin quality
        - from: Gross profit bridge
          to: Financing need
          label: retained earnings or external capital fund the next build cycle
    approximationNotes: The bridge is conceptual and uses only source-backed activity markers; it does not impute conversion rates, ASPs, or gross margins.
    claimRefs: [CI002, CI007, CI008, CI010, CI013, CI014, CI016]
callouts:
  - calloutType: risk
    title: Capital adequacy is still the main blocker
    body: Without updated cash, debt, and cash-flow disclosure, investors cannot tell whether Europe retrenchment materially reduced external financing dependency or just delayed it.
    claimRefs: [CI002, CI008, CI009]
  - calloutType: insight
    title: Volume signals are ahead of economics signals
    body: The latest public evidence is rich on shipment, market-share, and product-launch activity, but still thin on realized pricing, gross margin, and customer concentration.
    claimRefs: [CI007, CI010, CI012]
