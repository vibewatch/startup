callouts:
  - calloutType: strength
    title: Institutional launch capital
    body: Blackstone's disclosed US$250 million investment and the strategic participation of Raya Holding, NRT Technology, and Sightline Payments provide evidence of financing and partner access, but not of operating performance.
    claimRefs: [CI011]
  - calloutType: risk
    title: Core underwriting gap
    body: No retained source discloses ADGT revenue, pricing, gross margin, customer count, cash balance, burn, runway, or debt; the financial case cannot yet be underwritten from public data.
    claimRefs: [CI006, CI008, CI012]
  - calloutType: recommendation
    title: Request a finance data room
    body: Before assigning a stronger financial view, obtain contracts, cohort revenue, processing volume, unit costs, fraud losses, cash forecast, and regulatory implementation budget.
    claimRefs: [CI009, CI010, CI012, CI014]
