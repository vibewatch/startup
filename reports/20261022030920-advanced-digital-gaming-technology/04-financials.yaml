artifact: financials
slug: advanced-digital-gaming-technology
runDate: 2026-10-22
company:
  name: Advanced Digital Gaming Technology
chapter:
  number: 4
  title: Financials
  summary: ADGT has a disclosed US$250 million Blackstone investment and a payments-and-compliance infrastructure model, but public evidence does not disclose revenue, pricing, margins, cash balance, burn, runway, or customer traction. The underwriting case therefore rests on capital backing and regulatory-market access rather than demonstrated financial performance.
sections:
  - id: monetization-model
    title: Monetization model and revenue quality
    body: >-
      Public materials describe ADGT as a B2B payments and data-intelligence platform rather than a
      consumer gaming operator. The disclosed product combines digital wallets, real-time funding and
      payout rails, identity and access management, compliance monitoring, and closed-loop and open-loop
      ecosystem controls for on-property and digital transactions. That architecture creates several
      plausible monetization surfaces—payment processing, platform or integration fees, compliance
      services, and possibly transaction-linked economics—but the retained sources do not disclose a
      price list, take rate, minimum commitment, revenue split, or realized revenue. Official
      competitor surfaces show that an incumbent iGaming payment provider can package cards, wallets,
      eCash, alternative payment methods, crypto, 250+ payment methods, 40+ currencies, and a single
      integration, while another large PSP reports US$300 billion of 2025 ecommerce payment volume;
      these are competitor capabilities and scale signals, not ADGT revenue proxies. The correct
      financial interpretation is therefore a potentially broad payments stack with unverified
      monetization and no public basis for ARR or revenue-run-rate underwriting.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The operating model is likely to carry payment-network, fraud and risk, compliance, identity,
      technology, support, and market-entry costs, but the sources do not quantify any of them for ADGT.
      Paysafe's iGaming offering explicitly emphasizes fraud and risk support, account management,
      secure and instant payments, and a single integration; Checkout.com describes fraud, risk and
      compliance tooling, hosted payment pages, APIs, support, and resilient cloud infrastructure.
      Those descriptions establish the cost and service dimensions a buyer will evaluate, not ADGT's
      gross margin or cost base. The disclosed strategic partners may reduce build time or capability
      risk, but no source states commercial terms, transfer pricing, revenue sharing, implementation
      costs, or exclusivity. Consequently CAC, payback, contribution margin, processing cost per
      transaction, chargeback loss, support cost, and working-capital needs remain unavailable. Any
      scenario should keep these as explicit diligence inputs rather than inserting industry averages.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Blackstone publicly disclosed a US$250 million investment in ADGT, alongside Raya Holding, NRT
      Technology, and Sightline Payments, and the company was described as newly established. That
      investment is financing raised, not cash currently available: the retained evidence does not
      state the instrument, ownership percentage, post-money valuation, use of proceeds, cash balance,
      burn rate, runway, debt, project-finance obligations, or next-round trigger. A separate
      publication reports that ADGT is understood to be valued at around US$1 billion according to
      Bloomberg, but this is not a primary valuation disclosure and should not be used as a verified
      metric. Regulatory change adds a financing and execution dependency: White & Case says the UAE's
      2025 CBUAE law can bring technology platforms that facilitate payments within licensing scope,
      with a transition deadline of 16 September 2026. ADGT therefore appears capitalized for launch,
      but its ability to fund operating losses and regulatory build-out cannot be tested publicly.
      The financial verdict is research-more: capital backing is a strength, while revenue quality,
      margin path, liquidity, and commercial traction are unresolved underwriting blockers.
    claimRefs: [CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate sourced product and market signals from unavailable company financial
      data. Blank or null values are intentional: the public record does not support a numerical
      estimate for the missing field. They also distinguish a financing announcement from cash
      availability, competitor scale from ADGT traction, and regulatory scope from an assertion that
      ADGT has breached a rule. This prevents the reader from treating list pricing as realized
      revenue, a reported valuation as a verified financing term, or an absence of customer names as
      proof that no customers exist. The diligence asks are designed to convert these public-data
      gaps into auditable underwriting inputs.
    claimRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism evidenced, Current value/status, Quality, Diligence ask]
    rows:
      - [Payment processing, "Wallets and real-time funding and payout rails for physical and online transactions", "Not disclosed", "Company-described product capability; no realized revenue", "Obtain transaction volume, take rate, authorization economics, chargebacks, and recognized revenue by stream"]
      - [Compliance and identity infrastructure, "Identity and access management plus compliance monitoring", "Not disclosed", "Company-described capability; pricing and customer adoption unknown", "Obtain contracted pricing, implementation fees, recurring versus usage-based mix, and named customers"]
      - [Platform or integration services, "Unified interoperable infrastructure and direct contracting with venues and online platforms", "Not disclosed", "Business model is plausible but not expressly priced", "Obtain contracts, minimum commitments, revenue-share terms, and deployment milestones"]
      - [Consumer payment methods, "Digital wallets, closed-loop and open-loop controls, and partner payment technology", "Not disclosed", "Product scope does not establish ADGT revenue share", "Map partner economics, settlement timing, and pass-through versus net presentation"]
    notes: "Sources describe product mechanisms and competitor benchmarks; ADGT pricing, revenue, customer count, and accounting presentation are not publicly disclosed."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Question, Public evidence, Underwriting implication, Required diligence]
    rows:
      - [List price or rate card, "No ADGT price list located in the retained sources", "Realized pricing cannot be separated from product claims", "Request current rate card and customer-specific pricing policy"]
      - [Take rate or revenue share, "No percentage or basis disclosed", "Gross payment volume cannot be converted to revenue", "Request take-rate schedule by payment method and venue type"]
      - [Contract structure, "Direct contracting capability is described; terms are not", "Recurring, usage, and implementation revenue mix is unknown", "Review representative operator and venue contracts"]
      - [Discounts and concessions, "No discounts, rebates, or minimums disclosed", "Net revenue quality and payback cannot be assessed", "Obtain cohort-level realized price and concession data"]
    notes: "Official competitor pages are contextual benchmarks only; they do not establish ADGT's prices or realized economics."
    claimRefs: [CI003, CI004, CI005]
  - id: TI003
    title: Unit-economics data room checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, "Unavailable", "Payments mix, partner fees, fraud losses, and compliance costs determine contribution quality", "Provide audited or management gross-margin bridge by product and geography"]
      - [CAC and payback, null, "Unavailable", "Enterprise venue and operator acquisition may require long implementation cycles", "Provide sales spend, pipeline conversion, cycle length, and gross-profit payback"]
      - [Processing cost per transaction, null, "Unavailable", "Network, banking, FX, fraud, and settlement costs can compress take rate", "Provide unit-cost waterfall by payment rail and corridor"]
      - [Chargeback and fraud loss, null, "Unavailable", "Gaming payments require risk controls and can create direct loss and reserve needs", "Provide approval, fraud, chargeback, and reserve metrics"]
      - [Cash balance and runway, null, "Unavailable", "US$250 million raised does not equal cash available or months of runway", "Provide latest balance sheet, 13-week cash forecast, burn, and financing commitments"]
      - [Working capital and settlement exposure, null, "Unavailable", "Timing of merchant settlement and player payouts can create liquidity needs", "Provide settlement terms, prefunding, reserves, and peak exposure"]
    notes: "Null means no quantitative ADGT disclosure was found in the assigned successful sources; it is not a zero."
    claimRefs: [CI006, CI008, CI010, CI011, CI012]
