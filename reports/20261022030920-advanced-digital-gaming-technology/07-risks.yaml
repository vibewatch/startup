    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Impact, Mitigation path, Residual exposure]
    rows:
      - ["Capital and governance", "Blackstone / Raya Holding", "Investment and sponsorship", "Unknown", "Conditions, governance conflict, or delayed deployment constrains execution.", "High", "Review investment instrument, funding schedule, board rights, vetoes, and budget.", "High"]
      - ["Gaming payment technology", "NRT Technology", "Gaming-sector payment technology", "Unknown", "Technology or support discontinuity delays venue integrations.", "High", "Review service levels, IP rights, escrow, transition support, and replacement plan.", "High"]
      - ["Wallet and digital payments", "Sightline Payments", "Digital wallet and payment capability", "Unknown", "Partner, processor, bank, or compliance disruption interrupts transaction flows.", "Critical", "Review architecture, service levels, substitution rights, incident history, and continuity tests.", "High"]
      - ["Operators and venues", "Undisclosed UAE counterparties", "Distribution and transaction demand", "Unknown", "Absent production demand or single-counterparty concentration prevents scale.", "High", "Obtain signed contracts, live volumes, pipeline conversion, and largest-counterparty share.", "High"]
    notes: "Partner roles come from syndicated formation reporting. Concentration, contractual protection, and live dependency levels are not public; reported investment amounts are not treated as cash available or runway."
    claimRefs: [CR010, CR011, CR012, CR013, CR016]

