      - ["Venue or system integration failure", "Competitor marketing shows casino deployments depend on slot-machine and casino-management-system compatibility.", "Unknown", "High", "Unverified", "High", "No named ADGT production integration or acceptance-test evidence."]
      - ["Cybersecurity, data, or recovery failure", "The platform handles identity and payment functions, but the assigned record contains no ADGT reliability evidence.", "Unknown", "Critical", "Unverified", "High", "No penetration-test, incident, uptime, recovery-test, or data-governance evidence."]
    notes: "Failure modes follow the announced product surfaces and sector control requirements. They do not assert that an incident occurred; unknown likelihood and unverified mitigation maturity reflect missing company-specific evidence."
    claimRefs: [CR007, CR008, CR009, CR014]
