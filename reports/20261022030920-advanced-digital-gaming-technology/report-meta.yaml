  productSummary: >-
    Digital wallets, real-time funding and payout rails, identity and access management, compliance monitoring, and
    closed-loop and open-loop payment controls for land-based and online regulated gaming environments.
  customerFocus: Regulated gaming operators, venues, and related gaming-market participants.
