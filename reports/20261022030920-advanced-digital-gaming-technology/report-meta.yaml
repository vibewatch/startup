companyProfile:
  summary: >-
    Advanced Digital Gaming Technology (ADGT) is a newly established Abu Dhabi-headquartered B2B platform intended to
    provide payments, wallet, identity, access-management, and compliance infrastructure for regulated gaming markets.
    The platform was established with Blackstone, Raya Holding, NRT Technology, and Sightline Payments, and Blackstone
    is reported to have invested US$250 million. The public record describes a credible strategic and regulatory-market
    positioning, but does not yet establish live operating scale or financial performance.
  founders: []
  foundingLocation: Abu Dhabi, United Arab Emirates
