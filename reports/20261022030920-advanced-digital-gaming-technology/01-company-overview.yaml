company:
  name: Advanced Digital Gaming Technology
chapter:
  number: 1
  title: Company Overview
  summary: ADGT is a newly established Abu Dhabi payments and compliance infrastructure platform for regulated digital markets, created with Blackstone, Raya Holding, NRT Technology, and Sightline Payments. Public evidence supports the founding structure, intended product scope, and a reported $250 million Blackstone investment, but does not disclose operating revenue, customers, headcount, governance terms, or a primary valuation disclosure.
sections:
  - id: identity-and-product
    title: Identity, product, and regulatory position
    body: >-
      Public descriptions identify Advanced Digital Gaming Technology (ADGT) as a newly established
      Abu Dhabi-headquartered payments and data-intelligence technology platform. The reported business
      model is B2B infrastructure: connecting player money to regulated gaming operators while combining
      digital wallets, real-time funding and payout rails, identity and access management, compliance
      monitoring, and closed-loop and open-loop controls. Blackstone's announcement says the platform
      plans to focus initially on the UAE, the Middle East, Africa, and selected international corridors,
      while the company-specific reporting describes the UAE commercial-gaming market as its immediate
      focus. These are issuer or company-release descriptions, not evidence of live transaction volume.
      The public record also says ADGT can contract with both land-based and online digital platforms, but
      the exact legal entity behind the claimed UAE license and the license terms remain unverified in
      the assigned sources. UAE financial-services guidance underscores that payment and fintech activity
      can span distinct CBUAE, DFSA, and FSRA regimes, while gaming-law commentary says regulated activity
      requires the relevant GCGRA authorization; this makes license mapping a material diligence item.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-capital
    title: Leadership, sponsors, and capital formation
    body: >-
      The assigned evidence names Michael Dominelli as ADGT's chief executive and describes the platform
      as established through a strategic partnership among Blackstone, Abu Dhabi-based Raya Holding,
      NRT Technology, and Sightline Payments. Blackstone is reported to have invested $250 million, and
      the investment is described as funding a newly created platform rather than a disclosed operating
      company with an established financial history. Jon Gray, Blackstone's president and chief operating
      officer, is the named sponsor-side executive quoted on the UAE opportunity. The reporting also
      names legal advisers to Blackstone and ADGT, but no board composition, ownership percentages,
      voting rights, debt, secondaries, or investor-side control terms are disclosed. One media report
      repeats an approximately $1 billion valuation attributed to Bloomberg; because the assigned source
      is secondary and no primary valuation disclosure is present, that figure is recorded as unverified
      rather than as a company metric. The public evidence therefore supports sponsor credibility and
      launch capitalization, but not a conclusion about governance or financial scale.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones, dependencies, and unresolved scale evidence
    body: >-
      ADGT's public milestone history is short because the platform was newly established in 2026.
      Available evidence shows a sequence of enabling ecosystem events: Sightline and Resorts World
      launched a second-generation cashless wallet in 2022; the GCGRA was established in 2023; national
      commercial-gaming regulation developed in 2024; the CBUAE perimeter and enforcement framework
      changed in 2025; and ADGT's 2026 launch positioned the platform for domestic and cross-border
      deployment. The broader UAE fintech environment is operationally demanding: the assigned legal
      sources describe multiple regulatory authorities, licensing obligations, compliance controls,
      and evolving rules. This supports a plausible infrastructure opportunity but does not establish
      ADGT customer adoption. No assigned source names a live ADGT customer, reports revenue or ARR,
      gives headcount, discloses a signed operator contract, or provides cap-table and board terms.
      The key-person risk is also unresolved: Dominelli is publicly named as CEO, but the sources do
      not provide a broader executive bench or succession plan. Investment diligence should therefore
      prioritize license-entity confirmation, customer contracts, deployment status, unit economics,
      and governance documents.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: []
    figureRefs: []
callouts:
  - calloutType: strength
    title: Institutional launch backing
    body: The reported $250 million Blackstone investment and named technology partners provide meaningful sponsor and implementation resources, but do not prove commercial traction.
    claimRefs: [CO006, CO007]
  - calloutType: risk
    title: Operating evidence gap
    body: Public sources do not disclose a live ADGT customer, revenue, headcount, contract backlog, or governance terms; the investment case remains launch-stage rather than operating-proof based.
    claimRefs: [CO014, CO015, CO016]
  - calloutType: insight
    title: License mapping is central
    body: The claimed ability to serve both physical and online venues has high strategic value, but the exact licensee entity and authorization scope should be verified directly with the relevant UAE registries and agreements.
    claimRefs: [CO004, CO005]
