  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: operating-metrics
      missingEvidence: A primary source showing a live ADGT customer, signed operator contract, transaction volume, revenue, or deployment status.
      whyItMatters: The investment case cannot be assessed as commercially operating rather than launch-stage without evidence of customer adoption and monetization.
      diligencePath: Request a current customer pipeline and executed-contract schedule, anonymized transaction-volume dashboard, revenue bridge, and deployment references under NDA.
      relatedQuestionRefs: [QO005, QO009]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Definitive cap table, shareholder agreement, board roster, voting rights, and any debt or preferred-security terms.
      whyItMatters: Sponsor names and gross funding do not establish control, dilution, liquidation preference, or investor downside protection.
      diligencePath: Obtain executed financing and shareholder documents plus a current capitalization table from management or counsel.
      relatedQuestionRefs: [QO003, QO004, QO009]
      relatedTableRefs: [TO002, TO003]
    - type: access-blocked
      severity: material
      topic: licensing
      missingEvidence: Primary GCGRA and financial-regulator records mapping the ADGT brand to the licensed legal entity and authorized activities.
      whyItMatters: The claimed cross-channel contracting position is central to the product thesis and could be narrower than the media descriptions imply.
      diligencePath: Verify the licensee, permitted activities, effective dates, conditions, and regulator correspondence directly with the relevant UAE authorities.
      relatedQuestionRefs: [QO007, QO008]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Primary valuation or transaction document corroborating or rejecting the approximately $1 billion figure.
      whyItMatters: A reported valuation materially changes the implied price of the $250 million investment and cannot be treated as fact without primary support.
      diligencePath: Request the transaction announcement, post-money capitalization, or a directly attributable Bloomberg report with valuation methodology.
      relatedQuestionRefs: [QO004]
