  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: ADGT list pricing, take-rate schedule, settlement economics, and customer-specific commercial terms.
      whyItMatters: Without realized pricing and unit economics, feature comparisons cannot establish monetization or margin durability.
      diligencePath: Obtain redacted operator contracts, pricing schedules, settlement reports, and contribution-margin history from management.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: customer-proof
      missingEvidence: Named ADGT customers, signed operator contracts, implementation references, and independent performance benchmarks.
      whyItMatters: Regulatory access and partner announcements do not prove adoption, retention, throughput, or switching costs.
      diligencePath: Request customer references, contract backlog, deployment dates, uptime, fraud-loss, and transaction-volume evidence.
      relatedQuestionRefs: [QP006, QP007, QP008, QP009]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-profile-table
      missingEvidence: Public scale, pricing, target-customer, and product-scope data for each named gaming supplier and internal-build alternative.
      whyItMatters: The competitive table is a bounded evidence sample, not an exhaustive census of every UAE or global provider.
      diligencePath: Expand the diligence set using regulator registers, supplier filings, customer procurement records, and named operator references.
      relatedQuestionRefs: [QP001, QP002]
      relatedTableRefs: [TP001]
    - type: conflicting-data
      severity: material
      topic: exclusivity
      missingEvidence: Regulator-confirmed scope and effective date for ADGT and PayBy gaming-related authorizations.
      whyItMatters: EnterpriseAM's reported exclusivity language may be time-bound and is not reconciled with PayBy's separate license announcement.
      diligencePath: Verify current license categories, permitted activities, and contracting scope directly with the GCGRA and the relevant licensees.
      relatedQuestionRefs: [QP003, QP007]
