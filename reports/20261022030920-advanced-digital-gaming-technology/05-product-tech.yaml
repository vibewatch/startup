      - ["Compliance systems", "Compliance and risk teams", "Described platform component", "Brings regulatory controls into the payment workflow", "Request AML, sanctions and responsible-gaming control mapping"]
      - ["Data intelligence", "Platform and operator teams", "Described in external coverage", "Could support monitoring and reporting", "Request data model, model validation and access controls"]
      - ["Operator / venue connectivity", "Physical venues and online platforms", "ADGT is described as licensed to contract with both", "Extends one platform across two operating contexts", "Request integration inventory and named production references"]
    notes: External descriptions identify the modules but do not establish ADGT's implementation, ownership of each component, or production maturity; nulls and gaps are diligence requests rather than claims of absence.
    claimRefs: [CE001, CE005, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow or need, ADGT solution described, Measurable benefit, Limitation]
    rows:
      - [Move player funds, Players fund gaming activity through operator channels, Unified wallet and payment rails, Potentially fewer payment handoffs, No ADGT transaction or conversion data]
      - [Accept online and venue transactions, Operators manage different channels, One platform intended for physical and online venues, Potentially simpler vendor management, Live multi-channel deployment is not evidenced]
      - [Verify identity and suitability, Compliance teams screen users and key risks, Identity-management and compliance systems, Potentially faster controlled onboarding, No workflow documentation or approval metrics]
      - [Monitor suspicious activity, Risk teams identify misuse and financial crime, Data intelligence and compliance layer, Potentially earlier detection, No ADGT alert-quality or case-outcome metrics]
      - [Operate cashless gaming, Venue teams reduce cash handling, Digital wallet and cashless transaction model, Potentially more convenient player payments, Geo-location and account-takeover risks remain material]
      - [Meet UAE gaming requirements, Operators and technology providers operate under GCGRA oversight, Licensed contracting position plus compliance infrastructure, Potentially aligns controls with a regulated market, Exact licensed entity and control scope require verification]
    notes: The benefit column is a workflow implication, not a measured ADGT outcome. GeoComply evidence describes category controls and the remaining rows rely on external descriptions of ADGT's intended proposition.
    claimRefs: [CE002, CE005, CE006, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Player and operator access", "Presents wallet and transaction entry points", "Mobile, web and venue integrations", "Request supported channels and authentication controls"]
      - ["Payments and settlement", "Routes and reconciles regulated gaming payments", "Payment processors, banks and settlement partners", "Request ledger ownership, reconciliation and exception handling"]
      - ["Identity and compliance", "Applies KYC, AML, sanctions and responsible-gaming checks", "Regulatory rules and identity data", "Request control coverage, auditability and false-positive handling"]
      - ["Fraud and location controls", "Detects spoofing, takeover and unauthorized access risks", "Device, location and transaction signals", "Request detection performance and incident response evidence"]
      - ["Data intelligence and reporting", "Produces operational and regulatory insight", "Data pipelines and operator inputs", "Request data lineage, model governance and retention policy"]
      - ["Operator / venue integration", "Connects the platform to physical and online gaming operations", "Customer APIs and partner systems", "Request API documentation, deployment references and uptime commitments"]
    notes: This is a source-bounded conceptual architecture assembled from ADGT descriptions and category-control evidence; it is not a verified ADGT system diagram.
    claimRefs: [CE001, CE006, CE009, CE010, CE011, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: A source-bounded view of the platform layers implied by public descriptions and regulated cashless-gaming requirements.
    data:
      layers:
        - label: Access and use cases
          detail: User and operator entry points for the intended workflow.
          items:
            - label: Player wallet
              detail: Wallet and payment access for gaming activity; live ADGT deployment is not independently shown.
            - label: Operator and venue channels
              detail: Physical-venue and online-platform contracting is described in external coverage.
        - label: Transaction services
          detail: Wallet and payment components described in external ADGT coverage.
          items:
            - label: Digital wallets
              detail: Named as a platform component in external ADGT coverage.
            - label: Real-time payment rails
              detail: Named as a platform component; processors and settlement partners are undisclosed.
        - label: Trust and control
          detail: Identity, compliance and fraud-control functions required by the operating context.
          items:
            - label: Identity management
              detail: Named as a platform component; exact KYC/KYB implementation is undisclosed.
            - label: Compliance systems
              detail: Named as a platform component; AML, sanctions and responsible-gaming evidence is not public.
            - label: Fraud and location controls
              detail: Category-relevant controls are described by GeoComply, not verified as ADGT modules.
        - label: Data and governance
          detail: Data intelligence and regulatory reporting functions implied by the platform and regime.
          items:
            - label: Data intelligence
              detail: Described as part of ADGT's platform proposition; data lineage and model governance are unverified.
            - label: Regulatory reporting
              detail: GCGRA-related reporting and ongoing control obligations are described by legal guidance.
        - label: Security assurance
          detail: Assurance, testing and incident-response evidence needed before technical maturity can be verified.
          items:
            - label: Security testing
              detail: No public ADGT penetration-test summary or certification is assigned.
        - label: Operations and support
          detail: Reliability, support and recovery processes required for production deployment.
          items:
            - label: Service operations
              detail: No public ADGT uptime, recovery or support performance record is assigned.
    approximationNotes: The layers show an analytical mapping of disclosed components and category requirements; they do not imply that ADGT has implemented every item or that the items share one production stack.
    claimRefs: [CE001, CE006, CE009, CE010, CE011, CE012]
callouts:
  - calloutType: strength
    title: Integrated regulated-market proposition
    body: The combination of payments, identity and compliance in a single platform is a credible workflow-level proposition for regulated gaming operators, provided the promised integrations and controls work in production.
    claimRefs: [CE001, CE005]
  - calloutType: risk
    title: Production proof is missing
    body: No assigned source provides an ADGT API, security assessment, uptime record, named live customer, incident history or independently tested performance baseline.
    claimRefs: [CE008, CE012]
  - calloutType: recommendation
    title: Require technical diligence before underwriting maturity
    body: Request architecture diagrams, control mappings, penetration-test summaries, recovery tests, integration references and evidence tying the licensed entity to the operating platform.
    claimRefs: [CE009, CE010, CE012]
