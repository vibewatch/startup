artifact: customers
slug: advanced-digital-gaming-technology
runDate: 2026-10-22
company:
  name: Advanced Digital Gaming Technology
chapter:
  number: 6
  title: Customers
  summary: >-
    ADGT's disclosed commercial thesis targets regulated land-based and online gaming
    operators across the UAE, the wider Middle East, Africa, and selected international
    corridors. The assigned evidence does not identify a named ADGT customer, pilot,
    production deployment, usage level, renewal, or retention metric, so customer
    validation remains the central diligence gap.
sections:
  - id: customer-definition
    title: Addressable customers, not yet a disclosed customer base
    body: >-
      The clearest evidence defines ADGT as a B2B payments and data-intelligence
      infrastructure provider for regulated digital markets rather than a consumer gaming
      operator. Its addressable buyers are therefore regulated land-based venues, online
      operators, and adjacent financial-services organizations that need payment,
      identity, access, and compliance capabilities. A gaming-industry article relays the
      company's position that it can contract with both land-based and online operators,
      while Morgan Lewis says initial deployment focus spans the UAE, the Middle East,
      Africa, and selected international corridors. These statements identify target
      segments and intended geography, but neither establishes an active customer,
      production use, payer, contract value, or revenue contribution. The public-sector
      Dubai gaming program and the broader vendor-licensing wave support market formation;
      they do not constitute demand proof for ADGT.
    claimRefs: [CU001, CU002, CU003, CU007, CU010]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption evidence remains pre-traction
    body: >-
      Across all eight assigned sources, no operator is identified as an ADGT customer and
      no source discloses a signed contract, pilot, production deployment, transaction
      volume, active account, location count, implementation milestone, or customer
      outcome. Global Gaming Insider describes a broad product surface spanning wallets,
      funding and payouts, identity, access, and compliance, but the article does not tie
      those capabilities to a named deployment. NRT's ResortID announcement shows that a
      strategic technology partner has a casino-oriented identity product with deployment
      options and list-checking data, yet it does not establish integration into ADGT or
      adoption by an ADGT customer. The correct adoption trajectory is therefore a
      sequence of undisclosed milestones rather than a numerical growth curve. Investor
      diligence should request contract-level evidence before crediting commercial
      traction.
    claimRefs: [CU004, CU005, CU006, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: procurement-expansion
    title: Procurement and expansion mechanics
    body: >-
      Customer acquisition is likely to be compliance-led and integration-heavy. The UAE
      fintech guide explains that regulated financial-services providers retain
      responsibility for outsourced functions and generally need written vendor
      agreements, oversight, audit access, data safeguards, and breach provisions. For
      ADGT, that makes regulatory permission only an entry condition: each operator or
      financial-services buyer still needs diligence, systems integration, controls
      testing, and production acceptance. The intended expansion loop is geographic and
      product-based--begin with UAE deployments, extend to the Middle East and Africa, and
      add selected international corridors while combining payments, identity, and
      compliance modules. That mechanism is plausible from the disclosed product and
      deployment scope, but there is no public land-and-expand cohort, cross-sell rate,
      sales-cycle duration, or channel-attribution evidence with which to test it.
    claimRefs: [CU002, CU004, CU008, CU009]
    figureRefs: [FU001]
  - id: durability-concentration
    title: Durability, concentration, and downside
    body: >-
      Retention cannot be assessed because the evidence set contains no NRR, GRR, churn,
      renewal rate, contract term, backlog, satisfaction score, repeat-purchase measure,
      or cohort data. Near-term customer concentration may also be structurally high:
      Gaming Eminence characterizes the UAE opportunity through 2027 as one resort plus a
      national lottery and flags certification delays, systems-integration risk, and bank
      friction. EnterpriseAM mentions Wynn Al Marjan only as an example of a physical
      venue in the market, not as an ADGT customer or contract. Legal and AML scrutiny
      further raises onboarding and operating burdens. The retained FATF capture is not
      usable as current UAE-specific proof because its body displays France ratings,
      reinforcing the need for primary regulatory verification rather than a
      success-shaped citation. Customer durability should remain unscored until contracts,
      usage, renewals, and concentration data are reviewed.
    claimRefs: [CU009, CU012, CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation and evidence boundary
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Evidenced scale
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - UAE land-based gaming operators
        - Regulated operator; payments, compliance, and venue teams
        - Wallets, funding, payouts, identity, access, and compliance
        - Target segment only; no named account
        - Potential launch beachhead; revenue undisclosed
        - Named contract, production status, locations, volume, and economics
      - - UAE online gaming operators
        - Regulated online operator; risk and payments teams
        - Unified payment and compliance layer
        - Contracting eligibility claimed; no named deployment
        - Potential digital expansion; revenue undisclosed
        - Licence scope, live operator, transaction volume, and take rate
      - - Middle East and Africa regulated operators
        - Operator or regulated financial-services buyer
        - Regional payments and compliance infrastructure
        - Intended deployment region only
        - Geographic expansion thesis; value undisclosed
        - Country pipeline, signed customers, localization, and approvals
      - - Selected international corridors
        - Regulated digital-market operator or payment counterparty
        - Cross-border funding, payout, identity, and compliance
        - Intended corridor expansion only
        - Long-term optionality; value undisclosed
        - Named corridors, counterparties, licences, and commercial terms
    notes: >-
      Segments reflect disclosed target users and deployment regions, not verified
      customers; all scale and revenue fields remain unavailable in the assigned evidence.
    claimRefs: [CU001, CU002, CU003, CU004, CU008]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Evidence date
      - Source basis
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Intended deployment footprint
        - UAE, Middle East, Africa, and selected international corridors
        - "2026-03-30"
        - Morgan Lewis transaction release
        - Medium
        - Broad pipeline ambition, not adoption
        - Operators, contracts, locations, and deployment timing
      - - Operator-channel reach
        - Land-based and online operators
        - "2026-03-26"
        - Company-positioning claim relayed by Global Gaming Insider
        - Low
        - Two potential operator channels
        - Licence identifiers, counterparties, and active integrations
      - - Named customers or live deployments
        - None identified in the eight-source assigned corpus
        - "2026-10-22"
        - Current-run evidence review
        - Medium
        - Commercial traction is not publicly verifiable
        - Total customers, pilots, production accounts, and transaction volume
      - - Retention and expansion
        - No NRR, GRR, churn, renewal, cohort, or cross-sell metric disclosed
        - "2026-10-22"
        - Current-run evidence review
        - Medium
        - Durability and land-and-expand remain untested
        - Customer cohort, contract value, renewal period, and starting base
    notes: >-
      The table preserves qualitative disclosures and explicit nulls; none of the values
      should be interpreted as active-customer counts or realized commercial performance.
    claimRefs: [CU002, CU003, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or reference
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Outcome
      - Limitation
    rows:
      - - No named ADGT operator disclosed
        - Land-based or online gaming
        - No customer-specific use case disclosed
        - Not disclosed
        - No outcome disclosed
        - Assigned sources identify target segments but no customer identity
      - - Wynn Al Marjan
        - Land-based resort market reference
        - Example of a physical gaming venue in the UAE market
        - Not established as an ADGT deployment or pilot
        - No ADGT-specific outcome disclosed
        - Market dependency is not customer proof
      - - NRT ResortID
        - Strategic-partner product reference
        - Casino identity authentication, age verification, and list checking
        - Product launch; no ADGT deployment status
        - Product capabilities described, but no ADGT customer outcome
        - No evidence of ADGT integration or an ADGT end customer
    notes: >-
      Partial enumeration of every named customer-like reference in the assigned evidence;
      references are included to distinguish market or partner context from actual ADGT
      customer proof.
    enumerationScope:
      coverage: partial
      basis: >-
        All named customer-like references found in the eight assigned sources reviewed
        through the 2026-10-22 run date.
    claimRefs: [CU005, CU006, CU011, CU015]
figures:
  - id: FU001
    title: Customer journey from addressable operator to durable account
    type: journey-map
    summary: >-
      Evidence is strongest at target definition and weakest from contracting through
      renewal, where no ADGT-specific public proof is available.
    data:
      nodes:
        - id: target-operator
          label: Target operator
          detail: Land-based and online regulated operators are the disclosed target.
          touchpoints:
            - UAE market
            - Middle East and Africa
            - Selected international corridors
        - id: regulatory-qualification
          label: Regulatory qualification
          detail: Licensing and buyer oversight are entry conditions, not customer adoption.
          touchpoints:
            - Payment-services perimeter
            - Vendor due diligence
            - Audit and data safeguards
        - id: procurement-integration
          label: Procurement and integration
          detail: Buyer evaluation, controls testing, and systems integration are expected.
          touchpoints:
            - Wallet and funding
            - Identity and access
            - Compliance monitoring
        - id: contract-pilot
          label: Contract or pilot
          detail: No named ADGT contract or pilot is disclosed in the assigned evidence.
          touchpoints:
            - Contract terms unavailable
            - Pilot scope unavailable
        - id: production-usage
          label: Production usage
          detail: No live account, transaction, location, or outcome metric is disclosed.
          touchpoints:
            - Volume unavailable
            - Utilization unavailable
            - Outcomes unavailable
        - id: renewal-expansion
          label: Renewal and expansion
          detail: No retention, renewal, cohort, or cross-sell evidence is disclosed.
          touchpoints:
            - NRR and GRR unavailable
            - Churn unavailable
            - Concentration unavailable
    approximationNotes: >-
      The sequence is an analytical diligence journey, not a claim that ADGT has completed
      any undisclosed stage or that all buyers follow identical procurement steps.
    claimRefs: [CU001, CU002, CU004, CU008, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Customer proof is below investment-grade diligence needs
    body: >-
      Licensing-position claims and partner capabilities do not substitute for named
      contracts, production usage, customer outcomes, renewals, or concentration data.
    claimRefs: [CU003, CU005, CU011, CU012]
  - calloutType: recommendation
    title: Make contract-level evidence a gating diligence request
    body: >-
      Request a customer roster reconciled to signed agreements, deployment status,
      transaction volumes, implementation milestones, revenue contribution, renewal terms,
      and reference calls before underwriting commercial traction.
    claimRefs: [CU011, CU012, CU013, CU014]
