    title: Market sizing lens
    type: pyramid
    summary: Evidence-supported opportunity layers narrow from enabling regulation to ADGT-specific commercial opportunity, with the company-specific layer remaining unquantified.
    data:
      items:
        - label: Broad multi-emirate UAE gaming scenario
          value: "USD 8-10 billion annual gaming revenue by 2030"
          note: Broad permission under a consistently enforced regime.
        - label: Structured UAE gaming scenario
          value: "USD 5-6 billion annual gaming revenue by 2030"
          note: Multiple integrated resorts plus regulated online gaming.
        - label: Limited UAE gaming scenario
          value: "USD 1.5-2 billion annual gaming revenue by 2030"
          note: One integrated resort and restricted online activity.
        - label: ADGT initial geographic focus
          value: "UAE, Middle East, Africa, and selected markets"
          note: Geography is a disclosed scope, not a revenue estimate.
        - label: ADGT serviceable vendor spend
          value: "Not disclosed"
          note: Pricing, payment volume, and attach-rate inputs are unavailable.
        - label: ADGT SAM/SOM
          value: "Not disclosed"
          note: Requires signed operators, contracted volume, and penetration evidence.
    approximationNotes: The three sourced ranges are annual UAE gaming-revenue scenarios; no take-rate conversion, numeric width, or market-share assumption is inferred for ADGT.
    claimRefs: [CM005, CM009, CM013]
