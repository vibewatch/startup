      - number: '3.2'
        title: Capability, trust, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              PayBy provides a useful capability benchmark: its retained materials describe online gateways, payment
              links, QR payments, point-of-sale devices, recurring payments, APIs, reporting, and fraud detection, while
              the licensing announcement says it can serve GCGRA-licensed commercial gaming operators. ADGT's disclosed
              edge is narrower but strategically important: cross-venue gaming infrastructure under a reported
              gaming-specific licence and a consortium of gaming-fintech partners. Wynn's official surface demonstrates
              operator scale and physical resort capability, not a competing payments product. Aristocrat and TCSHuxley
              are evidence of an approved supplier environment, but the pool does not document their payment stack. A
              buyer should therefore distinguish regulatory eligibility, operator distribution, payments functionality,
              fraud controls, and gaming workflow integration instead of treating all named companies as interchangeable
              competitors.
            claimRefs:
