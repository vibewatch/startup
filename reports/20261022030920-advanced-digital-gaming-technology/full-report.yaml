      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The operating model is likely to carry payment-network, fraud and risk, compliance, identity, technology,
              support, and market-entry costs, but the sources do not quantify any of them for ADGT. Paysafe's iGaming
              offering explicitly emphasizes fraud and risk support, account management, secure and instant payments,
              and a single integration; Checkout.com describes fraud, risk and compliance tooling, hosted payment pages,
              APIs, support, and resilient cloud infrastructure. Those descriptions establish the cost and service
              dimensions a buyer will evaluate, not ADGT's gross margin or cost base. The disclosed strategic partners
              may reduce build time or capability risk, but no source states commercial terms, transfer pricing, revenue
              sharing, implementation costs, or exclusivity. Consequently CAC, payback, contribution margin, processing
              cost per transaction, chargeback loss, support cost, and working-capital needs remain unavailable. Any
              scenario should keep these as explicit diligence inputs rather than inserting industry averages.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Blackstone publicly disclosed a US$250 million investment in ADGT, alongside Raya Holding, NRT Technology,
              and Sightline Payments, and the company was described as newly established. That investment is financing
              raised, not cash currently available: the retained evidence does not state the instrument, ownership
              percentage, post-money valuation, use of proceeds, cash balance, burn rate, runway, debt, project-finance
              obligations, or next-round trigger. A separate publication reports that ADGT is understood to be valued at
              around US$1 billion according to Bloomberg, but this is not a primary valuation disclosure and should not
              be used as a verified metric. Regulatory change adds a financing and execution dependency: White & Case
              says the UAE's 2025 CBUAE law can bring technology platforms that facilitate payments within licensing
              scope, with a transition deadline of 16 September 2026. ADGT therefore appears capitalized for launch, but
              its ability to fund operating losses and regulatory build-out cannot be tested publicly. The financial
              verdict is research-more: capital backing is a strength, while revenue quality, margin path, liquidity,
              and commercial traction are unresolved underwriting blockers.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate sourced product and market signals from unavailable company financial data. Blank or
              null values are intentional: the public record does not support a numerical estimate for the missing
              field. They also distinguish a financing announcement from cash availability, competitor scale from ADGT
              traction, and regulatory scope from an assertion that ADGT has breached a rule. This prevents the reader
              from treating list pricing as realized revenue, a reported valuation as a verified financing term, or an
              absence of customer names as proof that no customers exist. The diligence asks are designed to convert
              these public-data gaps into auditable underwriting inputs.
