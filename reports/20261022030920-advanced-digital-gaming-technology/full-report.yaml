        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory access is the clearest differentiator
            body: >-
              ADGT's reported gaming-specific authorization and cross-venue positioning could shorten access to
              regulated operators, but the claim requires direct regulator and contract verification.
            calloutType: strength
            claimRefs:
