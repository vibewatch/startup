  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Public materials describe ADGT as a B2B payments and data-intelligence platform rather than a consumer
              gaming operator. The disclosed product combines digital wallets, real-time funding and payout rails,
              identity and access management, compliance monitoring, and closed-loop and open-loop ecosystem controls
              for on-property and digital transactions. That architecture creates several plausible monetization
              surfaces—payment processing, platform or integration fees, compliance services, and possibly
              transaction-linked economics—but the retained sources do not disclose a price list, take rate, minimum
              commitment, revenue split, or realized revenue. Official competitor surfaces show that an incumbent
              iGaming payment provider can package cards, wallets, eCash, alternative payment methods, crypto, 250+
              payment methods, 40+ currencies, and a single integration, while another large PSP reports US$300 billion
              of 2025 ecommerce payment volume; these are competitor capabilities and scale signals, not ADGT revenue
              proxies. The correct financial interpretation is therefore a potentially broad payments stack with
              unverified monetization and no public basis for ARR or revenue-run-rate underwriting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
