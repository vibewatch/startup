      - number: '1.2'
        title: Leadership, sponsors, and capital formation
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence names Michael Dominelli as ADGT's chief executive and describes the platform as
              established through a strategic partnership among Blackstone, Abu Dhabi-based Raya Holding, NRT
              Technology, and Sightline Payments. Blackstone is reported to have invested $250 million, and the
              investment is described as funding a newly created platform rather than a disclosed operating company with
              an established financial history. Jon Gray, Blackstone's president and chief operating officer, is the
              named sponsor-side executive quoted on the UAE opportunity. The reporting also names legal advisers to
              Blackstone and ADGT, but no board composition, ownership percentages, voting rights, debt, secondaries, or
              investor-side control terms are disclosed. One media report repeats an approximately $1 billion valuation
              attributed to Bloomberg; because the assigned source is secondary and no primary valuation disclosure is
              present, that figure is recorded as unverified rather than as a company metric. The public evidence
              therefore supports sponsor credibility and launch capitalization, but not a conclusion about governance or
              financial scale.
