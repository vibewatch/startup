      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a conceptual layered architecture: user-facing wallet and payment access,
              transaction and identity services, compliance and risk controls, and operator or venue connectivity. Focus
              Gaming News explicitly names the core components, while GeoComply's cashless-gaming analysis illustrates
              the control requirements a platform in this category must address, including location verification,
              spoofing detection and account-takeover detection. These are category requirements and a competitor's
              control design, not an ADGT technical specification. The Chambers guide adds that covered UAE payment
              providers face technology-risk and information-security requirements, while regulated financial-service
              providers remain responsible for outsourced functions. ADGT is described as licensed to contract with
              physical venues and online platforms, which establishes an intended deployment perimeter, but no assigned
              source exposes system boundaries, hosting, encryption, uptime, recovery objectives, audit reports or
              integration test evidence. Maturity should therefore be assessed as launch-stage and described, not
              independently verified.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
