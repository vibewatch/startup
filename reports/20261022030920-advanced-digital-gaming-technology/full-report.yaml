              - CI008
              - CI012
          - type: callout
            title: Request a finance data room
            body: >-
              Before assigning a stronger financial view, obtain contracts, cohort revenue, processing volume, unit
              costs, fraud losses, cash forecast, and regulatory implementation budget.
            calloutType: recommendation
            claimRefs:
