    title: Product architecture map
    type: stack
    summary: >-
      A source-bounded view of the platform layers implied by public descriptions and regulated cashless-gaming
      requirements.
    data:
      layers:
        - label: Access and use cases
          detail: User and operator entry points for the intended workflow.
          items:
