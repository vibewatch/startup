  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is regulated commercial-gaming infrastructure rather than gaming entertainment or all
              fintech. Within that boundary, ADGT is described as supplying payment wallets, funding and payout rails,
              identity and access management, compliance monitoring, and interoperable data infrastructure to land-based
              venues and online platforms. The buyer-side problem is connecting player money to a licensed operator
              while satisfying the applicable gaming and payments controls. The boundary therefore includes
              operator-facing payment processing, gaming-related vendor services, identity and fraud controls, and the
              integration work needed to connect physical and digital environments. It excludes casino gaming revenue,
              lottery or wagering operator GGR, general-purpose consumer wallets unrelated to gaming, and the capital
              invested in resorts. Status-quo substitutes include separate payment, identity, fraud, and compliance
              vendors; internal operator builds; and a licensed fintech such as PayBy that can provide digital wallets,
              secure payments, and fraud detection to GCGRA- licensed operators. This boundary makes regulatory access
              and implementation scope more decision-relevant than a broad global gaming-spend headline.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports regulatory scenarios rather than a defensible single TAM. Mondaq, citing SCCG
              Management, describes approximately USD 1.5-2 billion of annual UAE gaming revenue by 2030 under a limited
              model, USD 5-6 billion with multiple integrated resorts and regulated online gaming, and USD 8-10 billion
              under broad multi-emirate permission. These estimates are operator gaming-revenue scenarios, not
              payment-processing revenue, compliance-software spend, or ADGT revenue. ADGT's reported initial geographic
              focus spans the UAE, the Middle East and Africa, and selected international markets, but geography is not
              a sizing denominator. Applying a take rate would require sourced payment volume, pricing, attach rates,
              qualified operator counts, and customer penetration; none is disclosed in the assigned evidence. The
              scenarios therefore frame the demand environment but cannot establish a numeric ADGT SAM or SOM.
              Company-specific market capture remains a diligence gap, not a precise value to infer from broad gaming
              revenue.
            claimRefs:
              - CM005
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM009
              - CM013
      - number: '2.3'
        title: Buyers, adoption triggers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is the regulated gaming operator or venue that must accept player funds, fund accounts,
              process payouts, and satisfy identity, fraud, and compliance obligations. The payer is likely the operator
              or its platform budget, while the user is the player; that separation matters because operator procurement
              and regulator approval can govern adoption even when the player experiences the wallet. A second buyer
              class is the licensed gaming-related vendor or platform partner that needs payment and compliance
              connectivity. Adoption triggers are the opening of licensed venues, online-platform availability, a
              requirement for safe payment controls, and the value of one interoperable layer across land-based and
              online channels. Constraints include the novelty of the UAE regime, licensing and regulatory perimeter
              questions, integration with operator systems, fraud and player-safety obligations, cross-border payment
              rules, and the absence of public evidence of ADGT customers or live volume. PayBy's reported
              gaming-related vendor licence demonstrates that a competing licensed fintech route exists; it also shows
              that licensing is an access condition rather than proof that ADGT has won demand. Until ADGT discloses
              signed operators, pilots, pricing, processing volume, and conversion timelines, adoption and valuation
              remain scenario-dependent.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory opening is the market catalyst, not a quantified demand proof
            body: >-
              The UAE's move from broad prohibition toward a licensing framework creates a credible opening for
              regulated gaming infrastructure, but the assigned evidence does not establish operator count, transaction
              volume, or ADGT commercial traction.
