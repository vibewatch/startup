  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              ADGT is described by EnterpriseAM as B2B infrastructure connecting a player's money to a regulated gaming
              operator, with the reported ability to contract across physical venues and online operators. The same
              account places ADGT alongside Raya Holding, NRT Technology, and Sightline, while separately identifying
              Wynn as a physical-venue demand anchor. This creates a layered landscape rather than a single peer set:
              ADGT and PayBy are regulated-payment infrastructure alternatives; Wynn is an operator and potential
              distribution or demand-side counterparty; NRT and Sightline are specialist gaming-fintech partners;
              Aristocrat and TCSHuxley are vendor-side gaming suppliers. Dubai's gaming program adds an ecosystem and
              talent/technology substitute, while internal operator builds remain a plausible status quo. The evidence
              does not show that ADGT is the only feasible provider beyond the reported licensing claim.
