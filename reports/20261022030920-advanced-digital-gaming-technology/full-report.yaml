      - number: '1.3'
        title: Milestones, dependencies, and unresolved scale evidence
        blocks:
          - type: paragraph
            body: >-
              ADGT's public milestone history is short because the platform was newly established in 2026. Available
              evidence shows a sequence of enabling ecosystem events: Sightline and Resorts World launched a
              second-generation cashless wallet in 2022; the GCGRA was established in 2023; national commercial-gaming
              regulation developed in 2024; the CBUAE perimeter and enforcement framework changed in 2025; and ADGT's
              2026 launch positioned the platform for domestic and cross-border deployment. The broader UAE fintech
              environment is operationally demanding: the assigned legal sources describe multiple regulatory
              authorities, licensing obligations, compliance controls, and evolving rules. This supports a plausible
              infrastructure opportunity but does not establish ADGT customer adoption. No assigned source names a live
              ADGT customer, reports revenue or ARR, gives headcount, discloses a signed operator contract, or provides
              cap-table and board terms. The key-person risk is also unresolved: Dominelli is publicly named as CEO, but
              the sources do not provide a broader executive bench or succession plan. Investment diligence should
              therefore prioritize license-entity confirmation, customer contracts, deployment status, unit economics,
              and governance documents.
