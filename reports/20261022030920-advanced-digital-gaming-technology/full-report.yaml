            title: Institutional launch capital
            body: >-
              Blackstone's disclosed US$250 million investment and the strategic participation of Raya Holding, NRT
              Technology, and Sightline Payments provide evidence of financing and partner access, but not of operating
              performance.
            calloutType: strength
            claimRefs:
              - CI011
          - type: callout
            title: Core underwriting gap
            body: >-
              No retained source discloses ADGT revenue, pricing, gross margin, customer count, cash balance, burn,
              runway, or debt; the financial case cannot yet be underwritten from public data.
            calloutType: risk
            claimRefs:
