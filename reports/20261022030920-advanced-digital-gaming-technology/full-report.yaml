chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and regulatory position
        blocks:
          - type: paragraph
            body: >-
              Public descriptions identify Advanced Digital Gaming Technology (ADGT) as a newly established Abu
              Dhabi-headquartered payments and data-intelligence technology platform. The reported business model is B2B
              infrastructure: connecting player money to regulated gaming operators while combining digital wallets,
              real-time funding and payout rails, identity and access management, compliance monitoring, and closed-loop
              and open-loop controls. Blackstone's announcement says the platform plans to focus initially on the UAE,
              the Middle East, Africa, and selected international corridors, while the company-specific reporting
              describes the UAE commercial-gaming market as its immediate focus. These are issuer or company-release
              descriptions, not evidence of live transaction volume. The public record also says ADGT can contract with
              both land-based and online digital platforms, but the exact legal entity behind the claimed UAE license
              and the license terms remain unverified in the assigned sources. UAE financial-services guidance
              underscores that payment and fintech activity can span distinct CBUAE, DFSA, and FSRA regimes, while
              gaming-law commentary says regulated activity requires the relevant GCGRA authorization; this makes
              license mapping a material diligence item.
