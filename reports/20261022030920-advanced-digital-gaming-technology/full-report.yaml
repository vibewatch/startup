  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              ADGT's public product description is B2B infrastructure rather than a consumer gaming product. Focus
              Gaming News describes a unified payments and data-intelligence platform for regulated digital markets,
              while separately describing digital wallets, real-time payment rails, identity management and compliance
              systems as components intended to support both land-based and online transactions. The customer workflow
              implied by those descriptions is an operator or venue integrating payment and compliance capabilities into
              a regulated gaming operation; the platform is intended to connect player funds with the operator, rather
              than replace the operator's gaming content. This is a coherent product thesis, but the public record does
              not identify an API, integration guide, customer implementation, service-level commitment or production
              metrics. The STN Mobile listing is useful ecosystem evidence because it shows a live gaming wallet and
              cashless-funding workflow in the broader NRT Technology environment, but it is not proof that ADGT
              supplies that application or that ADGT has deployed it.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
