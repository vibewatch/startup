      - number: '3.3'
        title: Pricing, packaging, and switching economics
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes ADGT list pricing, take rates, realized revenue, or customer contracts.
              PayBy's public surface describes a broad omnichannel package, including two-day settlement, international
              payments, virtual accounts, APIs, and fraud monitoring, but this is product positioning rather than
              realized economics. EnterpriseAM reports Wynn's resort investment at USD 3.9 billion and ADGT's reported
              USD 250 million investment, yet neither figure supplies a comparable payment price or unit margin.
              Switching costs are likely to be shaped by licensing, compliance approvals, integrations, settlement
              operations, and operator contracts; the sources establish the relevance of these categories but do not
              quantify them. Multi-homing remains plausible because operators can combine a licensed gaming vendor with
              general payment rails, and internal build is constrained by compliance and operating burden rather than
              proven technical impossibility.
            claimRefs:
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              ADGT's strongest apparent moat is regulatory and distributional: a gaming-specific authorization claim
              combined with Blackstone, Raya, NRT, and Sightline backing and reported access across physical and online
              venues. That moat is not yet proven durable. PayBy's first-fintech gaming-related licence claim shows that
              another regulated payment platform can obtain relevant access, while the UAE's multi-layered licensing
              environment can increase compliance cost for every participant. The government-backed Dubai Program for
              Gaming 2033 supports a growing local ecosystem, which can expand demand but also attract entrants and
              partners. The principal adverse evidence is the absence of public customer, pricing, revenue, or operating
              proof in the retained pool; reported valuation and exclusivity language should not be treated as benchmark
              evidence. Underwriting should require named contracts, regulator confirmation, uptime and fraud outcomes,
              and evidence of repeatable integration.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
