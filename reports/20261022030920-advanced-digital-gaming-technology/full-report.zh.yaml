              指定证据将 Michael Dominelli 列为 ADGT 首席执行官，并称该平台由 Blackstone、总部位于阿布扎比的 Raya Holding、NRT Technology 和 Sightline
              Payments 战略合作设立。据报道 Blackstone 投资了 $250 million；该投资被描述为支持一个新建平台，而不是投向一家已有财务历史且已披露的运营公司。Blackstone 总裁兼首席运营官
              Jon Gray 是公开谈论 UAE 机会的发起人方高管。报道还列出 Blackstone 和 ADGT 的法律顾问，但未披露董事会构成、持股比例、表决权、债务、二级交易或投资人控制条款。一篇媒体报道转述了
              Bloomberg 所称约 $1 billion
