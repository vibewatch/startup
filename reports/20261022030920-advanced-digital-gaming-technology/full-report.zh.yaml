  - id: FU001
    title: 从可触达运营商到长期账户的客户旅程
    type: journey-map
    summary: 目标定义阶段的证据最强，从签约到续约的证据最弱；这一阶段没有 ADGT 特定的公开证明。
    data:
      nodes:
        - id: target-operator
          label: 目标运营商
          detail: 已披露的目标是线下和线上受监管运营商。
          touchpoints:
            - UAE market
            - Middle East and Africa
            - Selected international corridors
        - id: regulatory-qualification
          label: 监管资格
          detail: 牌照和买方监督是准入条件，不等于客户采用。
          touchpoints:
            - Payment-services perimeter
            - Vendor due diligence
            - Audit and data safeguards
        - id: procurement-integration
          label: 采购与集成
          detail: 预计包括买方评估、控制测试和系统集成。
          touchpoints:
            - Wallet and funding
            - Identity and access
            - Compliance monitoring
        - id: contract-pilot
          label: 合同或试点
          detail: 指定证据中未披露点名的 ADGT 合同或试点。
          touchpoints:
            - Contract terms unavailable
            - Pilot scope unavailable
        - id: production-usage
          label: 生产使用
          detail: 未披露实际账户、交易、地点或结果指标。
          touchpoints:
            - Volume unavailable
            - Utilization unavailable
            - Outcomes unavailable
        - id: renewal-expansion
          label: 续约与扩张
          detail: 未披露留存、续约、客户群或交叉销售证据。
          touchpoints:
            - NRR and GRR unavailable
            - Churn unavailable
            - Concentration unavailable
    approximationNotes: 该顺序是分析性的尽调旅程，并非声称 ADGT 已完成任何未披露阶段，也并非声称所有买方都遵循相同的采购步骤。
