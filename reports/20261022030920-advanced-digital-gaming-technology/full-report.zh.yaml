        title: 伙伴、财务与商业化风险
        blocks:
          - type: paragraph
            body: >-
              成立公告将 Blackstone 和 Raya Holding 列为发起人，将 NRT Technology 和 Sightline Payments
              列为技术伙伴。这些关系提供资本和领域能力，但公开记录没有披露治理权利、服务水平、替代权、资本条件，或按处理商、银行、场所或运营商划分的集中度。融资证据也需谨慎：Aletihad 的联合公告称 Blackstone
              投资 USD 250 million，而 EnterpriseAM 标题称 USD 205 million，正文称 USD 250 million。EnterpriseAM 将约 USD 1 billion
              的估值归于 Bloomberg，而不是主要披露。Blackstone 抓取的投资者关系活动页面没有 ADGT
              运营经济性。因此，这些数字只是据报道的交易背景，不是现金可用性、runway、收入或估值支持。伙伴退出、集成延迟或依赖小型启动客户群，可能在平台建立独立运营能力前损害商业化。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: 监测指标与投资逻辑失效标准
        blocks:
          - type: paragraph
            body: >-
              监测计划应先取得文件证明：被许可实体、牌照类别和条件、逐产品监管分析、最终批准、AML/CFT 方案及监管沟通。运营指标应包括授权和结算错误率、payout
              延迟、对账差异、正常运行时间、恢复测试结果、安全发现、可疑活动告警质量和独立核实的整改。依赖指标应包括承诺资本与已部署资本、董事会和否决权、伙伴服务水平、替代权、现有运营商和场所数量，以及最大交易对手占比。若
              ADGT
              无法证明某项活动获准，或在未测试金融犯罪和恢复控制的情况下上线，或发生重大且未解决的资金或数据事故，或失去关键伙伴且没有替代能力，投资逻辑就会失效。在明确尽调期限后仍无法提供已签客户、运营和财务证据，也会否定规模化逻辑。Dubai
              公共博彩计划支持生态意图，但不能降低公司特定执行风险。
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR009
              - CR011
              - CR013
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要投资逻辑失效触发因素
            body: 如果无法将 ADGT 的确切运营实体和产品功能映射到有文件支持的博彩及支付许可，投资逻辑的监管前提就会失效。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 据报道的投资不等于 runway
            body: 指定记录报告了不一致的交易金额，也没有现金余额、部署条件、烧钱、收入或利润证据；因此无法证明可用现金或运营 runway。
            calloutType: assumption
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与证据
        blocks:
          - type: paragraph
            body: >-
              ADGT 披露的 US$250 million Blackstone 投资，以及与 Raya Holding、NRT Technology 和 Sightline
              的合作，提供了重要资本和领域能力；平台被描述为整合钱包、充值与 payout、身份、访问管理和合规监控。Blackstone 据报道在 2025 年年末管理资产 US$1,274.9
              billion，说明发起人规模，但管理资产不是 ADGT 可用现金。这些事实支持可信的平台逻辑，而不是已证明的盈利流。公开报道称市场认为公司估值约为 US$1 billion，但该数字归于
              Bloomberg，而非公司或投资人的主要披露。因此，公开记录支持继续研究，而不是买入建议。进入投资前应要求核实的投后估值、证券条款、runway、客户合同及审计或管理层财务数据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV014
      - number: '8.2'
        title: 正向逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              上行情景是：ADGT 成为 UAE 博彩业的受监管支付与合规基础设施层，能够与实体场所和线上运营商签约，并从 UAE 扩展到中东、非洲和部分国际市场。Dubai 公共博彩计划聚焦人才、内容和技术；Botim
              Money 所宣称的 Central Bank of the UAE 牌照则表明受监管支付替代方案已经存在。反向逻辑是：启动阶段、没有公开客户、没有披露收入或 take-rate 数据、估值条款不确定，使
              headline 融资金额难以代表内在价值。公开可比公司表明，博彩金融科技和支付资产可能带有较高杠杆或波动的股权价值：Everi 在合并材料中描述 2024 年调整后 EBITDA 的备考净债务杠杆为
              3.2-3.4x，而 Paysafe 市值页面记录 2026 年下降 38.89%。这些是背景，不是 ADGT 的直接估值输入。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
              - CV017
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV012
              - CV016
              - CV017
      - number: '8.3'
        title: 情景、进入纪律与尽调
        blocks:
          - type: paragraph
            body: >-
              可辩护的情景框架必须保持定性，因为公开记录没有提供 ADGT
              收入、毛利率、留存、交易量、客户数量、现金余额或资本表条款。乐观情景需要核实的运营商合同、持续交易量、覆盖目标地域的合规牌照，以及证明融资支持可扩张经济性、而非主要用于监管和实施成本的证据。基准情景是一个资金充足但仍在验证产品市场匹配的平台。悲观情景是商业化延迟、牌照或合规摩擦、客户集中，或之后以更低价格融资。第一道尽调门槛不是模型推导的目标价，而是足以填充模型的主要证据。指定公开证据不足以支持目标回报、持有期或退出价值。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 继续研究
            body: 证据支持战略选择权，但不支持有价格依据的买入建议。在判断是否进入前，应要求主要估值和运营证据。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV011
          - type: callout
            title: 估值披露缺口
            body: 约 US$1 billion 的估值被报道为市场所知，而非 ADGT 或投资人披露，因此不应视为已核实的估值标记。
            calloutType: risk
            claimRefs:
              - CV004
              - CV012
