companyProfile:
  summary: >-
    Advanced Digital Gaming Technology（ADGT）是一家新设立、总部位于阿布扎比的 B2B 平台，拟为受监管博彩市场提供支付、钱包、身份、访问管理和合规基础设施。该平台由 Blackstone、Raya
    Holding、NRT Technology 和 Sightline Payments 共同设立，据报道 Blackstone 投资了 US$250
    million。公开记录显示其战略定位和监管市场定位较为可信，但尚未证明其已有实际运营规模或财务表现。
