      - number: '1.3'
        title: 里程碑、依赖项与未解决的规模证据
        blocks:
          - type: paragraph
            body: >-
              ADGT 于 2026 年新设立，因此其公开里程碑历史很短。现有证据显示了一系列生态准备事件：Sightline 与 Resorts World 于 2022 年推出第二代无现金钱包；GCGRA 于 2023
              年成立；全国商业博彩监管于 2024 年发展；CBUAE 的监管边界和执法框架于 2025 年发生变化；ADGT 于 2026 年上线，并据此准备开展境内及跨境部署。更广泛的 UAE
              金融科技环境的运营要求很高：指定法律来源描述了多个监管机构、牌照义务、合规控制及不断变化的规则。这支持一个合理的基础设施机会，但不能证明 ADGT 已获得客户。没有指定来源点名现有 ADGT 客户、报告收入或
              ARR、提供员工人数、披露已签署的运营商合同，或提供资本表和董事会条款。关键人物风险也未解决：公开信息将 Dominelli 列为
              CEO，但来源没有提供更完整的管理层梯队或继任计划。因此，投资尽调应优先核实牌照实体、客户合同、部署状态、单位经济性和治理文件。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
