  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是受监管商业博彩基础设施，而不是博彩娱乐或整个金融科技市场。在这一边界内，ADGT 被描述为向线下场所和线上平台提供支付钱包、充值与 payout
              通道、身份与访问管理、合规监控及可互操作的数据基础设施。买方要解决的问题，是在满足适用博彩和支付控制的同时，把玩家资金接入持牌运营商。因此，市场边界包括面向运营商的支付处理、博彩相关供应商服务、身份与反欺诈控制，以及连接实体和数字环境所需的集成工作；不包括赌场博彩收入、彩票或博彩运营商
              GGR、与博彩无关的通用消费者钱包，以及投入度假村的资本。现状替代方案包括分立的支付、身份、反欺诈和合规供应商；运营商自建；以及 PayBy 等持牌金融科技公司向 GCGRA
              持牌运营商提供数字钱包、安全支付和欺诈检测。相比宽泛的全球博彩支出标题，监管准入和实施范围更适合作为决策依据。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据支持监管情景，而不是一个可辩护的单一 TAM。Mondaq 引用 SCCG Management 称，2030 年 UAE 博彩年收入在有限模式下约为 USD 1.5-2
              billion；若有多个综合度假村和受监管线上博彩，则为 USD 5-6 billion；若允许更广泛的多酋长国经营，则为 USD 8-10
              billion。这些是运营商博彩收入情景，不是支付处理收入、合规软件支出或 ADGT 收入。ADGT 据报道的初始地域范围包括 UAE、中东、非洲及部分国际市场，但地域本身不是规模测算分母。要应用 take
              rate，需要有来源支持的支付金额、定价、附加率、合格运营商数量和客户渗透率；指定证据均未披露。因此，这些情景可以描述需求环境，但不能得出 ADGT 的数值 SAM 或
              SOM。公司具体的市场份额仍是尽调缺口，不能从宽泛博彩收入中推算出精确值。
            claimRefs:
              - CM005
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM009
              - CM013
      - number: '2.3'
        title: 买方、采用触发因素与约束
        blocks:
          - type: paragraph
            body: >-
              主要买方是受监管博彩运营商或场所：它必须接收玩家资金、为账户充值、处理
              payout，并满足身份、反欺诈和合规义务。付款方可能是运营商或其平台预算，用户则是玩家；这种分离很重要，因为即使玩家直接使用钱包，运营商采购和监管审批仍可能决定采用。第二类买方是需要支付和合规连接的持牌博彩相关供应商或平台合作伙伴。采用触发因素包括持牌场所开业、线上平台可用、安全支付控制要求，以及在实体和线上渠道之间使用一层互操作基础设施的价值。约束包括
              UAE 监管制度的新颖性、牌照和监管边界问题、与运营商系统集成、欺诈和玩家安全义务、跨境支付规则，以及缺乏 ADGT 客户或实际交易量的公开证据。PayBy
              据报道获得博彩相关供应商牌照，证明存在竞争性持牌金融科技路径；这也说明牌照是准入条件，而不是 ADGT 已赢得需求的证明。在 ADGT
              披露已签约运营商、试点、定价、处理量和转化时间表之前，采用和估值都取决于情景。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 监管开放是市场催化剂，不是量化需求证明
            body: UAE 从广泛禁止转向牌照框架，为受监管博彩基础设施打开了可信机会，但指定证据没有证明运营商数量、交易量或 ADGT 的商业牵引力。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM012
          - type: callout
            title: 牌照和客户证据是市场尽调的核心缺口
            body: 市场逻辑取决于确切牌照边界、运营商开业时间表和 ADGT 已签署的客户管线；指定来源均未量化这些内容。
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与战略位置
        blocks:
          - type: paragraph
            body: >-
              EnterpriseAM 将 ADGT 描述为把玩家资金接入受监管博彩运营商的 B2B 基础设施，据报道可与实体场所和线上运营商签约。同一报道将 ADGT 与 Raya Holding、NRT
              Technology 和 Sightline 并列，并另将 Wynn 识别为实体场所需求锚点。因此，这不是单一同业集合，而是分层格局：ADGT 和 PayBy 是受监管支付基础设施替代方案；Wynn
              是运营商，也是潜在分销或需求方交易对手；NRT 和 Sightline 是专业博彩金融科技伙伴；Aristocrat 和 TCSHuxley 是供应商侧博彩供应商。Dubai
              的博彩计划增加了生态、人才和技术替代方案，运营商自建仍是可行现状。除据报道的牌照主张外，证据没有显示 ADGT 是唯一可行供应商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
