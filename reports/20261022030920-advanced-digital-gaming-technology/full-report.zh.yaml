    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与监管定位
        blocks:
          - type: paragraph
            body: >-
              公开描述将 Advanced Digital Gaming Technology（ADGT）定义为一家新设立、总部位于阿布扎比的支付与数据智能技术平台。据报道，其业务模式是 B2B
              基础设施：把玩家资金接入受监管博彩运营商，同时整合数字钱包、实时充值与 payout 通道、身份与访问管理、合规监控以及闭环和开放式控制。Blackstone 的公告称，平台初期计划聚焦
              UAE、中东、非洲及若干国际通道；公司相关报道则将 UAE 商业博彩市场列为近期重点。这些只是发行方或公司新闻稿中的描述，并不证明已有实际交易量。公开记录还称 ADGT
              可与线下场所及线上数字平台签约，但被宣称持有 UAE 牌照的确切法律实体及牌照条款，在指定来源中仍未核实。UAE 金融服务指引强调，支付和金融科技活动可能分别落入 CBUAE、DFSA 和 FSRA
              监管体系；博彩法律评论则称，受监管活动需要相应的 GCGRA 授权，因此牌照映射是重要尽调事项。
