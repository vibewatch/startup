      - number: '3.2'
        title: 能力、信任与分销比较
        blocks:
          - type: paragraph
            body: >-
              PayBy 提供了有用的能力基准：其保留材料描述线上网关、支付链接、二维码支付、销售点设备、经常性支付、API、报表和欺诈检测；牌照公告称其可服务 GCGRA 持牌商业博彩运营商。ADGT
              已披露的优势更窄但具有战略意义：据报道拥有博彩专用牌照，并由博彩金融科技伙伴组成联盟，提供跨场所基础设施。Wynn 的官方信息体现运营商规模和实体度假村能力，而不是竞争性支付产品。Aristocrat 和
              TCSHuxley 证明存在获批供应商环境，但材料池没有记录其支付技术栈。买方应区分监管资格、运营商分销、支付功能、反欺诈控制和博彩工作流集成，而不应把所有点名公司视为可互换竞争者。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
