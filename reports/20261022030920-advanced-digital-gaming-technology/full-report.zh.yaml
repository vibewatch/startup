      - number: '3.3'
        title: 定价、产品打包与切换经济性
        blocks:
          - type: paragraph
            body: >-
              没有保留来源公布 ADGT 的目录价、take rate、实际收入或客户合同。PayBy 的公开页面描述了覆盖多渠道的产品包，包括两日结算、国际支付、虚拟账户、API
              和欺诈监控，但这属于产品定位，不是实现的经济性。EnterpriseAM 报道 Wynn 度假村投资 USD 3.9 billion，ADGT 据报道投资 USD 250
              million，但两者都不能提供可比的支付价格或单位利润。切换成本可能由牌照、合规审批、集成、结算运营和运营商合同决定；来源只证明这些类别重要，没有量化。多平台并用仍然可行，因为运营商可以将持牌博彩供应商与通用支付通道组合使用；自建受合规和运营负担限制，而非已证明技术上不可能。
            claimRefs:
              - CP011
