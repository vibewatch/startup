      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              ADGT 最明显的护城河似乎来自监管和分销：博彩专用授权主张，加上 Blackstone、Raya、NRT 和 Sightline
              的支持，以及据报道覆盖实体和线上场所的准入。但该护城河尚未证明具有持久性。PayBy 首个金融科技博彩相关牌照的主张显示，另一家受监管支付平台也能获得相关准入；UAE
              多层级牌照环境则可能提高所有参与者的合规成本。政府支持的 Dubai Program for Gaming 2033
              有助于扩大本地生态，既能增加需求，也会吸引进入者和合作伙伴。最重要的反向证据是保留材料中缺少公开客户、定价、收入或运营证明；据报道的估值和排他性表述不应当作基准证据。投资判断应要求点名合同、监管机构确认、正常运行时间和欺诈结果，以及可重复集成的证据。
