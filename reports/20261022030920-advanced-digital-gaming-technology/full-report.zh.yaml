            body: >-
              公开材料将 ADGT 描述为 B2B 支付与数据智能平台，而非消费者博彩运营商。其产品包括数字钱包、实时充值与 payout
              通道、身份与访问管理、合规监控，以及面向场内和数字交易的闭环与开放式生态控制。这套架构可能通过支付处理、平台或集成费、合规服务及交易挂钩收入变现，但保留来源未披露价目表、take
              rate、最低承诺、收入分成或实际收入。竞争者公开信息显示，成熟 iGaming 支付供应商可以打包银行卡、钱包、电子现金、替代支付方式、加密货币、250+ 种支付方式、40+ 种货币和单一集成；另一家大型
              PSP 报告 2025 年电商支付量 US$300 billion。这些是竞争者能力和规模信号，不是 ADGT 收入代理。正确的财务解读是：ADGT 可能拥有宽泛支付栈，但变现尚未核实，公开信息不足以据此承销
