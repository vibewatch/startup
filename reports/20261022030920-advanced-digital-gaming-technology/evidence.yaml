evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: operating-metrics
    missingEvidence: >-
      A primary source showing a live ADGT customer, signed operator contract, transaction volume, revenue, or
      deployment status.
    whyItMatters: >-
      The investment case cannot be assessed as commercially operating rather than launch-stage without evidence of
      customer adoption and monetization.
    diligencePath: >-
      Request a current customer pipeline and executed-contract schedule, anonymized transaction-volume dashboard,
      revenue bridge, and deployment references under NDA.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Definitive cap table, shareholder agreement, board roster, voting rights, and any debt or preferred-security
      terms.
    whyItMatters: >-
      Sponsor names and gross funding do not establish control, dilution, liquidation preference, or investor downside
      protection.
    diligencePath: >-
      Obtain executed financing and shareholder documents plus a current capitalization table from management or
      counsel.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: material
    topic: licensing
    missingEvidence: >-
      Primary GCGRA and financial-regulator records mapping the ADGT brand to the licensed legal entity and authorized
      activities.
    whyItMatters: >-
      The claimed cross-channel contracting position is central to the product thesis and could be narrower than the
      media descriptions imply.
    diligencePath: >-
      Verify the licensee, permitted activities, effective dates, conditions, and regulator correspondence directly with
      the relevant UAE authorities.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary valuation or transaction document corroborating or rejecting the approximately $1 billion figure.
    whyItMatters: >-
      A reported valuation materially changes the implied price of the $250 million investment and cannot be treated as
      fact without primary support.
    diligencePath: >-
      Request the transaction announcement, post-money capitalization, or a directly attributable Bloomberg report with
      valuation methodology.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A market study or regulator/operator dataset reporting licensed operator count, expected gaming volume, payment
      volume, and serviceable payment or compliance spend.
    whyItMatters: >-
      Without a denominator and pricing basis, the broad geographic scope cannot be converted into a defensible TAM,
      SAM, SOM, or valuation multiple.
    diligencePath: >-
      Request ADGT's internal market model, operator pipeline, pricing assumptions, and third-party market study, then
      reconcile them to GCGRA licensee and venue data.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: traction-gap
    missingEvidence: >-
      Executed customer contracts, pilots, launch dates, processing volume, take rate, and customer acquisition
      economics.
    whyItMatters: >-
      Regulatory eligibility and product descriptions do not establish adoption, recurring revenue, or the pace at which
      the market becomes monetisable for ADGT.
    diligencePath: >-
      Obtain a customer reference list, redacted contracts, implementation milestones, monthly payment volume, pricing
      schedule, and retention or renewal data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: valuation
    missingEvidence: >-
      A primary financing announcement or transaction document that states the post-money valuation and investment
      terms.
    whyItMatters: >-
      EnterpriseAM reports an approximately $1 billion valuation while the other assigned launch accounts focus on the
      $250 million investment and do not verify valuation.
    diligencePath: >-
      Request the signed financing announcement, cap table summary, or investor confirmation and distinguish valuation
      from funding raised.
    relatedQuestionRefs:
      - QM004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: ADGT list pricing, take-rate schedule, settlement economics, and customer-specific commercial terms.
    whyItMatters: >-
      Without realized pricing and unit economics, feature comparisons cannot establish monetization or margin
      durability.
    diligencePath: >-
      Obtain redacted operator contracts, pricing schedules, settlement reports, and contribution-margin history from
      management.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named ADGT customers, signed operator contracts, implementation references, and independent performance
      benchmarks.
    whyItMatters: Regulatory access and partner announcements do not prove adoption, retention, throughput, or switching costs.
    diligencePath: >-
      Request customer references, contract backlog, deployment dates, uptime, fraud-loss, and transaction-volume
      evidence.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP008
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: >-
      Public scale, pricing, target-customer, and product-scope data for each named gaming supplier and internal-build
      alternative.
    whyItMatters: The competitive table is a bounded evidence sample, not an exhaustive census of every UAE or global provider.
    diligencePath: >-
      Expand the diligence set using regulator registers, supplier filings, customer procurement records, and named
      operator references.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: exclusivity
    missingEvidence: Regulator-confirmed scope and effective date for ADGT and PayBy gaming-related authorizations.
    whyItMatters: >-
      EnterpriseAM's reported exclusivity language may be time-bound and is not reconciled with PayBy's separate license
      announcement.
    diligencePath: >-
      Verify current license categories, permitted activities, and contracting scope directly with the GCGRA and the
      relevant licensees.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited or management revenue by stream, payment volume, take rate, customer concentration, and recognition
      policy.
    whyItMatters: >-
      Without revenue quality and concentration data, investors cannot assess whether the platform has commercial
      traction or durable monetization.
    diligencePath: >-
      Request monthly revenue and gross-profit cohorts reconciled to contracts, processor statements, and the general
      ledger.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin bridge, payment-network costs, fraud and chargeback losses, CAC, sales cycle, payback, and
      working-capital exposure.
    whyItMatters: A high-capital payments launch can still destroy value if processing and risk costs exceed net revenue.
    diligencePath: Obtain product-level unit economics and a cash conversion cycle analysis for each payment rail and corridor.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Latest balance sheet, cash forecast, burn, financing instrument, debt obligations, use of proceeds, and regulatory
      implementation budget.
    whyItMatters: Funding raised is not cash available, and licensing deadlines can create additional capital needs.
    diligencePath: Request the latest management accounts, 13-week cash forecast, debt schedule, and compliance program budget.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: production-proof
    missingEvidence: >-
      A named production customer, API or integration documentation, deployment reference, uptime history and measured
