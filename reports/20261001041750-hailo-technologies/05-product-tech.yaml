callouts:
  - calloutType: "strength"
    title: "Architectural Decoupling from External DRAM Bottlenecks"
    body: "Hailo's architectural decision to integrate all required memory on-chip within the Hailo-8 NPU represents a major competitive differentiator in edge vision applications. By eliminating reliance on external DRAM for model inference, the Hailo-8 reduces overall bill-of-materials cost, simplifies board layout complexity, minimizes vulnerability to global DRAM supply shortages, and achieves an industry-leading power consumption profile of approximately 2.5W."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Memory Scalability Limits for Frontier Multimodal Workloads"
    body: "While on-chip memory delivers exceptional power efficiency for convolutional neural networks and vision models, the Hailo-8's SRAM capacity cannot host modern multi-billion parameter language or multimodal models. Although the Hailo-10H introduces a direct DDR interface to support 2-billion parameter models, it reintroduces external DRAM cost and thermal dependencies, placing Hailo in direct competition with high-throughput edge GPUs and NPUs from incumbents."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE007"
