chapter:
  number: 5
  title: "Product & Technology"
  summary: "Hailo designs proprietary structure-driven dataflow Neural Processing Units (NPUs) and vision processors that deliver up to 26 TOPS (Hailo-8) and 40 TOPS INT4 (Hailo-10H) within sub-5W envelopes by eliminating external DRAM dependencies. While its hardware architecture and Hailo AI Software Suite enable scalable edge inference across automotive, robotics, and industrial vision, key technical and commercial risks center on thermal dissipation in fanless enclosures, host-driver dependencies across Linux and Windows, and software maturity for hybrid LLM pipelines."
sections:
  - id: "product-architecture-overview"
    title: "Proprietary Dataflow Architecture and Core Silicon Portfolio"
    body: "Hailo Technologies designs domain-specific edge AI processors that challenge traditional von Neumann computing architectures by aligning hardware execution with the graph topologies of deep neural networks. In traditional edge accelerator designs, frequent memory transfers between off-chip dynamic random-access memory (DRAM) and processing elements introduce significant memory bandwidth bottlenecks, increased latency, and high thermal dissipation. Hailo addresses this operational friction through a proprietary structure-driven dataflow architecture implemented in its flagship Hailo-8 NPU and subsequent product lines. The Hailo-8 integrates all memory directly on-chip, enabling up to 26 tera-operations per second (TOPS) of AI compute at a typical power dissipation of 2.5W without requiring external DRAM.\n\nTo address emerging multimodal models and on-device generative AI workloads, Hailo introduced the Hailo-10H discrete accelerator, delivering 40 TOPS of INT4 and 20 TOPS of INT8 compute within a 2.5W power envelope. Unlike the pure on-chip memory model of the Hailo-8, the Hailo-10H integrates a direct DDR memory interface to accommodate larger parameter spaces characteristic of 2-billion parameter large language models (LLMs) and vision-language models (VLMs). Hailo also offers the Hailo-15 series (Hailo-15L and Hailo-15H) of AI vision system-on-chips (SoCs), which combine image signal processing (ISP) with deep learning acceleration for intelligent security and smart city camera deployments. Engineering execution across multiple silicon generations demonstrates core architecture versatility, but scaling silicon performance under constrained board thermal budgets requires careful design trade-offs between on-chip SRAM capacity and external DRAM bandwidth."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "software-toolchain-stack"
    title: "Software Toolchain, Model Compilation, and Host Runtime Stack"
    body: "Silicon capabilities in edge AI deployments remain functionally inert without a comprehensive and robust software compilation toolchain. Hailo packages its complete developer environment within the quarterly-aligned Hailo AI Software Suite. The toolchain is anchored by the Hailo Dataflow Compiler (DFC), an SDK that ingests pre-trained neural network computational graphs from standard open frameworks including TensorFlow, TensorFlow Lite, PyTorch, Keras, and ONNX. The compiler performs parsing, model optimization, precision quantization, and graph resource allocation, generating a deterministic hardware execution binary known as the Hailo Executable Format (HEF).\n\nThe software environment bifurcates into the model-build environment and the runtime target environment. At the runtime level, HailoRT provides user-space C/C++ libraries and Python bindings (pyHailoRT) that communicate with the physical hardware accelerator over PCIe Gen 3.0 or Ethernet through a dedicated kernel-level PCIe driver. The software suite also includes the Hailo Model Zoo, offering pre-trained, pre-validated neural network architectures across object detection, segmentation, and classification, as well as TAPPAS, a deployment framework containing multi-network pipeline elements and reference application templates. While Hailo claims an active developer footprint exceeding 10,000 monthly users and over 100,000 community participants, developer friction remains concentrated in porting non-standard neural network operators, resolving compiler resource allocation constraints on dense vision transformers, and managing host Linux kernel driver updates."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
  - id: "hardware-modules-deployment"
    title: "Form Factors, Commercial Integration, and Hardware Reliability Controls"
    body: "Hailo delivers its silicon technology both as discrete packaged integrated circuits for board-down customer designs and as standardized plug-and-play modular acceleration cards. Through distribution and manufacturing partnerships with distributors such as EBV Elektronik (Avnet), Hailo provides standard NGFF M.2 acceleration modules across Key M, Key B+M, and Key A+E configurations, alongside PCI Express Mini (mPCIe) modules based on the 13 TOPS Hailo-8R variant. These form factors enable industrial PC manufacturers, robotics integrators, and edge gateway vendors to add high-performance AI inferencing capabilities into existing compute enclosures through standard PCIe Gen-3.0 interfaces (spanning 1-lane, 2-lane, or 4-lane configurations).\n\nDeployability in demanding operational environments is supported by automotive and industrial grade certifications. The Hailo-8 architecture satisfies AEC-Q100 Grade 2 temperature standards (-40°C to 105°C for automotive, -40°C to 85°C for industrial), adheres to Automotive SPICE (A-SPICE) Level 2 development flows, and complies with ISO-26262 ASIL-B (D) functional safety criteria. In commercial deployments such as Husqvarna robotic mowers, Automata Nexus building automation systems, and HP retail POS terminals, local on-device inference eliminates recurring cloud egress costs, mitigates cloud network latency, and ensures data privacy. However, technical risks persist regarding host driver stability across diverse operating systems (Linux, Windows, and Yocto), thermal dissipation under sustained maximum throughput in fanless enclosures, and long-term supply chain predictability."
    claimRefs:
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
