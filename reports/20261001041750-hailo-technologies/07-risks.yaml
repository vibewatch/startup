  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "regulatory-legal-risk-register"
      missingEvidence: "Product-level export classifications, licenses, sanctions screening, safety certifications, cybersecurity certifications, regulator correspondence, and commercial customer terms."
      whyItMatters: "Without the governing records, the probability and financial impact of market-access, compliance, warranty, and liability failures cannot be quantified."
      diligencePath: "Request the compliance matrix by SKU and jurisdiction, regulator and certification files, standard customer agreements, DPA, open claims, and counsel's legal-risk memorandum."
      relatedQuestionRefs: ["QR004", "QR005", "QR009"]
      relatedTableRefs: ["TR001"]
    - type: "missing-source"
      severity: "material"
      topic: "incidents-recalls"
      missingEvidence: "A complete record of product recalls, safety events, material outages, exploitable vulnerabilities, security incidents, field failures, returns, and customer remediation."
      whyItMatters: "The assigned pool's absence of incident records cannot establish that incidents did not occur or that controls are effective."
      diligencePath: "Obtain the board and audit-committee incident register, recall log, critical CVE history, penetration-test summaries, return rates, and top-customer remediation records."
      relatedQuestionRefs: ["QR008"]
      relatedTableRefs: ["TR002"]
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "liquidity-runway"
      missingEvidence: "Current cash, restricted cash, monthly gross and net burn, debt agreement and covenants, accounts payable, inventory commitments, SPAC identity, binding terms, expected net proceeds, and redemption sensitivity."
      whyItMatters: "Cumulative funding is not cash available, and the reported liquidity need could impair product execution before new financing closes."
      diligencePath: "Review monthly financials, bank statements, the loan agreement, 13-week cash forecast, board financing materials, and executed transaction documents."
      relatedQuestionRefs: ["QR001", "QR002"]
      relatedTableRefs: ["TR002", "TR003"]
    - type: "conflicting-data"
      severity: "material"
      topic: "workforce"
      missingEvidence: "A current employee and contractor roster by function, location, tenure, critical role, and post-layoff status."
      whyItMatters: "Public counts conflict enough to obscure actual capacity, geographic concentration, and whether layoffs affected engineering or customer support."
      diligencePath: "Reconcile payroll and HRIS records to finance headcount, then review regretted attrition, open roles, succession, and program staffing."
      relatedQuestionRefs: ["QR003", "QR007"]
      relatedTableRefs: ["TR002", "TR003"]
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "supply-chain"
      missingEvidence: "Foundry, OSAT, substrate, memory, packaging, test, and logistics counterparties; spend and unit shares; contractual allocation; yield; lead time; inventory; and qualified alternatives."
      whyItMatters: "A fabless semiconductor company can face shipment interruption from a single undisclosed production dependency even when product demand is healthy."
      diligencePath: "Review the approved-vendor list, supply agreements, capacity reservations, business-continuity tests, yield history, safety stock, and second-source qualification schedule."
      relatedQuestionRefs: ["QR010"]
      relatedTableRefs: ["TR002", "TR003"]
