      columns:
        - { label: "Likelihood", detail: "Evidence-based direction; unknown means the assigned pool lacks a frequency basis." }
        - { label: "Impact", detail: "Potential investment impact if the failure mode occurs." }
        - { label: "Mitigation maturity", detail: "Publicly evidenced mitigation only; private controls receive no credit." }
        - { label: "Residual severity", detail: "Exposure after giving credit only to disclosed mitigation." }
      rows:
        - label: "Liquidity / financing"
          values:
            - { label: "High", detail: "Urgent liquidity need, proposed SPAC, loan, and layoff were reported." }
            - { label: "Critical", detail: "Insufficient capital could delay product and commercial milestones." }
            - { label: "Low", detail: "No binding proceeds, runway, or covenant headroom is disclosed." }
            - { label: "Critical", detail: "Requires cash, burn, debt, and financing-close verification." }
        - label: "Valuation / exit execution"
          values:
            - { label: "High", detail: "Independent reporting described a proposed SPAC process." }
            - { label: "High", detail: "A sub-$500M indication would imply a major reset from the 2024 mark." }
            - { label: "Low", detail: "No SPAC identity, proceeds, or binding terms are disclosed." }
            - { label: "High", detail: "Monitor transaction status and alternative financing." }
        - label: "Workforce execution"
          values:
            - { label: "Medium", detail: "A near-10% layoff was reported, but public counts conflict." }
            - { label: "High", detail: "Semiconductor development and support depend on specialist teams." }
            - { label: "Unknown", detail: "Role-level retention and succession controls are not public." }
            - { label: "High", detail: "Requires team, attrition, and milestone evidence." }
        - label: "Manufacturing continuity"
          values:
            - { label: "Unknown", detail: "The assigned pool does not name foundry or OSAT counterparties." }
            - { label: "Critical", detail: "Supply loss can halt shipments and qualification schedules." }
            - { label: "Unknown", detail: "No dual-source, capacity, yield, or buffer evidence is public." }
            - { label: "Critical", detail: "No mitigation credit until supplier concentration is disclosed." }
        - label: "Certification / security"
          values:
            - { label: "Unknown", detail: "One module has stated CE/FCC certification; broader records are absent." }
            - { label: "High", detail: "Automotive, security, and industrial uses amplify defect consequences." }
            - { label: "Low", detail: "Portfolio-wide assurance and incident evidence are not in the pool." }
            - { label: "High", detail: "Requires certification scope, tests, and incident records." }
        - label: "Channel dependency"
          values:
            - { label: "Medium", detail: "Named distributors support expansion, but concentration is undisclosed." }
            - { label: "Medium", detail: "Partner loss could slow regional sales and support." }
            - { label: "Partial", detail: "Multiple regional partners are described without performance terms." }
            - { label: "Medium", detail: "Quantify revenue share, inventory, and replacement rights." }
    approximationNotes: "All cells are qualitative and evidence-bounded; the figure does not assign numeric probabilities or infer undisclosed incidents."
    claimRefs: ["CR001", "CR002", "CR004", "CR005", "CR007", "CR009", "CR010", "CR013", "CR016"]
