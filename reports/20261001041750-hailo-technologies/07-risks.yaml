    title: "Operational / quality / security risk register"
    columns: ["Failure mode", "Likelihood", "Severity", "Mitigation maturity", "Residual exposure", "Monitoring indicator", "Unresolved gap"]
    rows:
      - ["Liquidity shortfall or failed financing process", "High", "Critical", "Reported SPAC and $9M loan; binding proceeds and runway not disclosed", "Critical until cash, burn, covenants, and financing certainty are verified", "Monthly cash burn, minimum cash, signed financing, covenant headroom", "Cash balance, burn, runway, debt terms, and SPAC status"]
      - ["Execution loss from workforce contraction", "Medium", "High", "Public estimates conflict and one report cites a near-10% layoff", "High because role-level attrition and program impact are unknown", "Engineering attrition, vacancies, tape-out milestones, support backlog", "Employee roster, regretted attrition, affected functions, and hiring plan"]
      - ["Manufacturing interruption or allocation loss", "Unknown", "Critical", "Foundry and assembly counterparties are not named in assigned evidence", "High until alternate capacity and inventory buffers are evidenced", "Wafer allocation, yield, lead time, inventory days, second-source qualification", "Foundry, OSAT, substrate, memory, packaging, and test concentration"]
      - ["Product reliability or security defect", "Unknown", "High", "One module has stated CE/FCC certification; broader control evidence is absent", "High for automotive, security, and industrial deployments", "Field-failure rate, returns, critical CVEs, remediation time, recalls", "Incident history, certification scope, reliability testing, and customer remedies"]
    notes: "Severity is an underwriting assessment tied to cited disclosures and explicit gaps; unknown likelihood means the assigned public evidence cannot establish frequency, not that the event has never occurred."
    claimRefs: ["CR001", "CR002", "CR003", "CR007", "CR008", "CR013", "CR015", "CR016"]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns: ["Dependency", "Counterparty / role", "Concentration evidence", "Failure scenario", "Severity", "Mitigation", "Residual exposure"]
    rows:
