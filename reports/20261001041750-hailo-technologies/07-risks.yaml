      - ["Semiconductor fabrication and assembly", "Foundry and OSAT not disclosed", "No assigned source identifies counterparties or allocation shares", "Capacity, yield, geopolitical, or packaging disruption delays shipments", "Critical", "Dual sourcing, reserved capacity, safety stock, and qualified alternate packages", "Critical until suppliers, shares, and recovery times are documented"]
      - ["Talent geography", "Central and Western Asia workforce base", "Revelio estimates 73.3% of employees in the region; exact headcount conflicts", "Localized disruption or attrition affects engineering and operations", "High", "Distributed key-person coverage, remote continuity, succession, and retention plans", "Medium to high pending role-level location and continuity testing"]
      - ["Capital-market access", "Prospective SPAC, lenders, and existing investors", "Proposed listing and loan are reported; binding proceeds and terms are absent", "SPAC failure, valuation reset, or covenant pressure constrains execution", "Critical", "Alternative financing, board-approved downside plan, and milestone-based spending", "Critical until financing closes and post-close runway is verified"]
    notes: "Counterparty and concentration fields preserve the public-evidence boundary: named distributors are disclosed, while manufacturing and financing terms remain diligence gaps."
    claimRefs: ["CR001", "CR003", "CR004", "CR006", "CR007", "CR009", "CR010", "CR011", "CR016"]
figures:
