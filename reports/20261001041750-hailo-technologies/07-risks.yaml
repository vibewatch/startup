      - ["Cybersecurity and privacy assurance", "Edge devices and security-camera use cases", "Local processing is marketed, but no assigned source supplies audit, penetration-test, or incident evidence", "Unknown", "High", "Not publicly evidenced", "High because controls and incident history are unverified", "Obtain SOC 2 or ISO 27001 scope, secure-development evidence, SBOM, CVE process, penetration tests, and incident register"]
