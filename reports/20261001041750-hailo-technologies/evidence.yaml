evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements detailing Hailo's revenue run-rate, hardware gross margins, and operational cash burn
      rates.
    whyItMatters: >-
      Without audited financial disclosures, assessing whether Hailo's down-round SPAC valuation reflects terminal
      hardware margin compression or near-term liquidity friction is impossible.
    diligencePath: Review S-4 or F-4 registration statements once filed by the SPAC acquisition partner on the SEC EDGAR system.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-leadership
    missingEvidence: >-
      Full organizational chart including non-founding C-level executives, VP of Engineering, and independent board
      members.
    whyItMatters: >-
      Independent board oversight and executive continuity are critical to evaluating corporate governance during
      down-round restructuring.
    diligencePath: >-
      Examine prospective SEC proxy or listing prospectus disclosures detailing complete board and executive officer
      compensation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization-and-stakeholders
    missingEvidence: >-
      Exhaustive cap table detailing post-Series C liquidation preferences, conversion rights, and debt covenants of the
      $9M emergency facility.
    whyItMatters: >-
      Liquidation preferences and debt seniority dictate common equity recovery and dilution under a marked-down SPAC
      transaction under $500M.
    diligencePath: Audit Israeli corporate registry filings or the definitive SPAC merger agreement exhibits filed on EDGAR.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-and-shipments
    missingEvidence: >-
      Audited commercial shipment volumes, average selling prices (ASPs), and annual recurring revenue by vertical
      market segment.
    whyItMatters: >-
      Without volume shipments or revenue figures, obtainable market share and conversion velocity cannot be validated
      against competing silicon vendors.
    diligencePath: >-
      Request confidential OEM sales volumes, tier-1 customer shipment records, and management revenue breakdowns during
      formal diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercial-pricing-and-volume-margins
    missingEvidence: >-
      Volume commercial silicon pricing schedules, customer-specific ASPs, and tier-1 automotive OEM design win
      contracts.
    whyItMatters: >-
      Hailo does not publish per-chip volume price tiers or realized gross margins, making it difficult to assess
      competitive margin durability against NVIDIA and Qualcomm.
    diligencePath: >-
      Request direct channel distributor price sheets and audited tier-1 automotive customer contract terms during
      management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: blocking
    topic: financial-reporting-gaps
    missingEvidence: >-
      Audited financial statements detailing Hailo's gross margins, silicon bill-of-materials costs, and realized
      average selling prices.
    whyItMatters: >-
      Without audited gross margin data, institutional underwriting cannot determine if edge hardware sales cover fab
      foundry overhead and operational burn.
    diligencePath: >-
      Request confidential historical P&L statements and unit margin schedules under non-disclosure agreement during
      management diligence sessions.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-distress
    missingEvidence: Complete terms of the reported July 2026 Microchip acquisition and April 2026 $9 million emergency debt facility.
    whyItMatters: >-
      Understanding final liquidation preferences and debt seniority is critical to evaluating common equity recovery
      and capital structure outcomes.
    diligencePath: >-
      Examine shareholder register amendments, Israeli Registrar of Companies filings, and Microchip Technology
      acquisition disclosures.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI002
  - type: enumeration-incomplete
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Granular breakdown of Hailo's revenue mix across its 300+ customers, distinguishing automotive design wins from
      smart camera hardware shipments.
    whyItMatters: >-
      High customer concentration among pilot accounts creates revenue fragility and obscures true commercial volume
      adoption.
    diligencePath: Obtain customer concentration schedules and pipeline backlog reports directly from company management.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: thermal-benchmarks
    missingEvidence: >-
      Independent laboratory thermal throttling logs and sustained power dissipation profiles under continuous full-load
      execution in fanless sealed enclosures.
    whyItMatters: >-
      Edge devices deployed in industrial and outdoor settings often operate without forced air cooling; unverified
      thermal behavior under maximum load creates field reliability risks.
    diligencePath: >-
      Request third-party thermal qualification test reports and sustained TOPS/watt degradation curves across -40C to
      85C ambient temperature sweeps.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: vision-isp-benchmarking
    missingEvidence: >-
      Objective image signal processing (ISP) quality benchmarks and competitive latency comparisons for the Hailo-15
      series against incumbent edge camera SoCs.
    whyItMatters: >-
      Vision SoC adoption in enterprise security cameras depends heavily on ISP image tuning and low-light dynamic range
      parity alongside raw AI TOPS.
    diligencePath: >-
      Request customer evaluation reports comparing Hailo-15 against Ambarella and Rockchip platforms in standardized
      low-light surveillance test scenes.
    relatedQuestionRefs:
      - QE002
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-nrr
    missingEvidence: >-
      Disclosed net revenue retention (NRR), gross revenue retention (GRR), account-level expansion cohorts, and annual
      churn figures for enterprise edge AI accounts.
    whyItMatters: >-
      Without retention and expansion data, it is impossible to evaluate whether Hailo's 100+ customers represent
      expanding production deployments or single-batch evaluation purchases.
    diligencePath: >-
      Request confidential customer cohort retention schedules, recurring software maintenance billings, and multi-year
      silicon supply agreement renewals under diligence NDA.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive registry of all 100+ customer accounts and production volume commitments across automotive and smart
      camera verticals.
    whyItMatters: >-
      Public case studies highlight a select sample of showcase customers like Husqvarna and Automata Nexus, but leave
      OEM automotive production commitments opaque.
    diligencePath: Audit Microchip commercial design-win pipeline and Hailo Tier-1 automotive customer supply agreements.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Product-level export classifications, licenses, sanctions screening, safety certifications, cybersecurity
      certifications, regulator correspondence, and commercial customer terms.
    whyItMatters: >-
      Without the governing records, the probability and financial impact of market-access, compliance, warranty, and
      liability failures cannot be quantified.
    diligencePath: >-
      Request the compliance matrix by SKU and jurisdiction, regulator and certification files, standard customer
      agreements, DPA, open claims, and counsel's legal-risk memorandum.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incidents-recalls
    missingEvidence: >-
      A complete record of product recalls, safety events, material outages, exploitable vulnerabilities, security
      incidents, field failures, returns, and customer remediation.
    whyItMatters: >-
      The assigned pool's absence of incident records cannot establish that incidents did not occur or that controls are
      effective.
    diligencePath: >-
      Obtain the board and audit-committee incident register, recall log, critical CVE history, penetration-test
      summaries, return rates, and top-customer remediation records.
    relatedQuestionRefs:
      - QR008
