companyProfile:
  summary: >-
    Hailo Technologies is a Tel Aviv-headquartered fabless semiconductor company founded in 2017 that designs edge AI
    NPUs and vision processors for automotive, industrial, security, and robotics deployments. The company built a
    differentiated dataflow architecture and a broad hardware portfolio, but its public profile remains constrained by
    opaque financial disclosure, uncertain capital structure, and 2026 reports of distressed financing and a
    strategic-sale process.
