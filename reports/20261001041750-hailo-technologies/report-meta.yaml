  topStrengths:
    - Differentiated edge AI silicon portfolio with verified product breadth and efficiency advantages.
    - Broad customer and deployment footprint across automotive, industrial, security, and robotics use cases.
    - Strong strategic interest and channel reach despite a difficult capital backdrop.
  topRisks:
    - Liquidity pressure, valuation compression, and unresolved strategic-sale terms.
    - Opaque revenue, margin, and runway disclosure that blocks independent underwriting.
    - Supply-chain, certification, and customer-concentration gaps that remain only partially evidenced.
  unresolvedGaps:
    - Audited revenue, gross margin, and runway disclosures are still unavailable.
    - The reported Microchip acquisition lacks primary close evidence and disclosed consideration.
    - Customer concentration, supplier concentration, and contract waterfall terms remain opaque.
    - Regulatory classification and certification scope are not fully documented across the portfolio.
