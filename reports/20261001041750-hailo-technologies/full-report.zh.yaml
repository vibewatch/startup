          detail: 端到端视觉流水线、端侧 GenAI 助手与机器人感知应用
        - label: 主机运行时驱动层（HailoRT）
          detail: 用户态 C/C++ API、Python 绑定以及用于设备通信的 PCIe 内核驱动
        - label: 模型构建与量化层（Dataflow Compiler）
          detail: 模型解析器、资源分配器、INT8/INT4 量化器与 HEF 二进制生成器
        - label: 芯片架构核心层（Hailo-8 / 10H / 15）
          detail: 结构驱动型数据流神经计算架构，内置片上 SRAM 或直连 DDR
        - label: 硬件封装模块层（M.2 与 mPCIe 模块）
          detail: 标准 NGFF M.2 和 mPCIe 板卡，集成导热界面材料并支持 PCIe Gen-3.0
        - label: 物理系统部署层（边缘机箱与传感器）
          detail: 支持在 -40℃ 至 85℃ 环境温度下运行的智能相机、机器人计算单元与工控机
    approximationNotes: 逻辑架构抽象基于 Hailo AI Software Suite 2025-01 版本文档与官方芯片规格说明书。
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图谱
    type: journey-map
    summary: 涵盖从开发者评估与分销套件，到 OEM 硬件量产与规模化扩容的生命周期采纳漏斗。
    approximationNotes: 流程图展示了依据开发者社区指标、目录分销渠道以及已列名 OEM 量产部署梳理出的运营演进路径。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU013
    data:
      items:
        - label: 1. 生态初识
          userJob: Developer explores edge AI models and benchmarks
          touchpoints:
            - 开源社区论坛与 GitHub 代码仓库
            - 超过 10,000 名开发者的社区教程与网络研讨会
          friction: Model conversion and framework quantization learning curve
        - label: 2. 硬件原型开发
          userJob: Engineer purchases evaluation kit or add-on accelerator
          touchpoints:
            - 全球目录分销商：Newark、Farnell 与 element14
            - Raspberry Pi AI HAT+ 2 与 ASUS UGen300 USB 加速扩展器
          friction: Component availability and initial hardware evaluation costs
        - label: 3. 概念验证评测
          userJob: R&D team compiles proprietary neural networks on silicon
          touchpoints:
            - Hailo AI Software Suite 与模型编译器
            - 区域现场应用工程（FAE）团队的直接技术支持
          friction: Latency, thermal limits, and power budget verification under edge conditions
        - label: 4. OEM 系统集成
          userJob: Hardware manufacturer designs custom carrier board or camera SoC
          touchpoints:
            - Hailo-8 / Hailo-15 / Hailo-10H 模块架构规格书
            - 参考设计板级原理图与散热设计指南
          friction: Multi-quarter embedded hardware redesign and certification cycle
        - label: 5. 商业化量产
          userJob: OEM ships production equipment to end customers
          touchpoints:
            - 一级客户商业化量产部署（Husqvarna、Automata Nexus、Elo、Vicon）
            - 芯片直接批量采购协议与供应链物流支持
          friction: Long-term wafer allocation and supply chain predictability
        - label: 6. 规模化扩展与平台绑定
          userJob: Customer standardizes edge AI product lines on Hailo architecture
          touchpoints:
            - 采纳多代处理器路线图（从 Hailo-8 升级至 Hailo-10H）
            - 依托 Microchip Technology 销售网络支持的整合型系统整体解决方案
          friction: Vendor switching costs versus competing edge accelerators (NVIDIA, Qualcomm)
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 发生概率、影响程度、已披露缓解措施成熟度及残余严重性的序数呈现；未知概率明确标注为未知，而非折算为数字概率。
    data:
      columns:
        - label: 发生概率
          detail: 基于证据的方向判断；未知代表指定资料池缺乏测算频率的依据。
        - label: 影响程度
          detail: 若失效模式触发对投资造成的潜在冲击。
        - label: 缓解成熟度
          detail: 仅计入获公开凭证支持的缓解措施；未公开的内部控制不予加分。
        - label: 残余严重性
          detail: 仅扣减已披露缓解措施后的风险暴露程度。
      rows:
        - label: 流动性 / 融资
          values:
            - label: 高
              detail: 据报道存在急迫流动性需求、拟议 SPAC、借款及裁员。
            - label: 极高
              detail: 资金不足可能延误产品与商业化里程碑。
            - label: 低
              detail: 未公开披露具约束力的募资额、跑道或契约安全空间。
            - label: 极高
              detail: 须核实确证现金、消耗率、债务以及融资交割情况。
        - label: 估值 / 退出执行
          values:
            - label: 高
              detail: 独立报道称其推进潜在 SPAC 进程。
            - label: 高
              detail: 低于 $500M 的估值意向意味着较 2024 年水准大幅缩水。
            - label: 低
              detail: 未披露具体 SPAC 交易主体、募资金额或具约束力的条款。
            - label: 高
              detail: 密切监控交易进展与替代融资渠道。
        - label: 团队执行力
          values:
            - label: 中
              detail: 据报道裁员接近 10%，但公开员工统计相互冲突。
            - label: 高
              detail: 半导体研发与技术支持高度依赖专业化团队。
            - label: Unknown
              detail: 岗位级别的人才挽留与接班管控机制未予公开。
            - label: 高
              detail: 需要团队规模、离职率及里程碑完成证据。
        - label: 制造连续性
          values:
            - label: Unknown
              detail: 指定资料池未指明晶圆代工或 OSAT 合作方。
            - label: 极高
              detail: 供应中断可能叫停发货与客户认证进度。
            - label: Unknown
              detail: 双重供货、产能、良率或缓冲库存均缺乏公开证据。
            - label: 极高
              detail: 在供应商集中度披露前，缓解措施不予认可。
        - label: 认证 / 安全
          values:
            - label: Unknown
              detail: 某款模块声称获得 CE/FCC 认证；缺乏更广泛的合规记录。
            - label: 高
              detail: 车载、安防与工控场景加剧了缺陷带来的后果。
            - label: 低
              detail: 资料池中未见全产品线质量保证与安全事件记录。
            - label: 高
              detail: 需要认证范围、测试记录及安全事件台账。
        - label: 渠道依赖
          values:
            - label: 中
              detail: 明确列名的分销商支持业务扩张，但集中度未公开披露。
            - label: 中
              detail: 失去合作伙伴可能延缓区域销售推进与技术支持。
            - label: 部分
              detail: 提及多家区域伙伴，但未披露具体业绩履约条款。
            - label: 中
              detail: 量化收入分成、库存情况与替代权益。
    approximationNotes: 所有单元格均为定性且受证据约束；本图并未设定量化概率，亦未推断未披露的安全事故。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR007
      - CR009
      - CR010
      - CR013
      - CR016
