      - number: '1.3'
        title: 融资历程、估值走势与上市压力
        blocks:
          - type: paragraph
            body: >-
              Hailo 历经多轮机构融资，累计股权融资金额超过 $340M；2024 年 4 月完成的 $120M C 轮追加融资将投后估值推升至 $1.2B 顶峰。其投资银团汇集了 Zisapel 家族、Gil
              Agmon、Delek Motors、Poalim Equity 与 OurCrowd 等机构。然而，由于经常性收入、毛利率和客户回款情况缺乏透明度，先进制程 Fabless
              流片固有的结构性烧钱率被长期掩盖。2026 年 4 月，投资方 Delek Automotive 披露的监管文件显示，Hailo 正筹备通过 SPAC 合并方式在美股紧急上市，折价估值已不足
              $500M。该笔交易的背景是公司急需流动性资金，且已在 2026 年 1 月裁员近 10%，并借入了一笔 $9M 的应急过桥贷款。估值的断崖式下调突显出成长期后期风险投资再融资的严峻阻力，也让 Hailo
              独立商业模式的可行性面临严苛审视。
