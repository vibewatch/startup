          label: 经营验证凭据
          detail: 公司宣称拥有 300 多家客户并列名实际部署案例
          tone: positive
        - id: liquidity-pressure
          label: 2026 年流动性承压
          detail: 据报道获紧急借款、裁员并面临急迫流动性需求
          tone: negative
        - id: compressed-indication
          label: 缩水估值指引
          detail: 据报道 SPAC 估值低于 $500M
          tone: negative
        - id: transaction-gate
          label: 未披露交易
          detail: 据报道已达成确定性收购协议；需核实最终交割与对价情况
          tone: warning
    approximationNotes: 金额直接引述原始披露标签，未就债务、清算优先权、股权稀释或时间差异做归一化调整；该序列仅作分析呈现，不代表连续的估值走势。
