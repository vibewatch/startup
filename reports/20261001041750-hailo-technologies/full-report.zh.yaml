      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 受限边缘市场中的片上内存差异化优势
            body: >-
              在边缘 AI 硬件采购中，内存架构是决定成本与可靠性的关键要素。竞品加速芯片往往依赖频繁面临断供与价格暴涨的外置 DRAM 颗粒，而片上内存架构彻底免去了采购 DRAM 的环节。这为工业 OEM
              厂商带来了可预测的 BOM 成本，但在承载超大模型权重时，也不得不在芯片晶圆面积利用率上做出妥协。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 生态迁移成本与开发者平台锁定
            body: >-
              在嵌入式边缘计算市场，单纯的硬件效率无法直接转化为商业市占率。成熟软件生态的既有垄断构筑了极高的迁移壁垒。除非边缘 AI 硬件厂商能为标准神经网络框架提供成熟、无缝的编译器，否则 OEM
              买方将面临巨大的系统集成阻力与漫长的导入验证周期。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：传统巨头、专用边缘 NPU 与相邻赛道厂商
        blocks:
          - type: paragraph
            body: >-
              边缘人工智能半导体竞争格局清晰划分为三个层级：主流 GPU 加速的核心计算模组（SoM）、专用低功耗神经网络处理单元（NPU），以及相邻的移动端或 IoT 应用处理器。NVIDIA 凭借 Jetson
              系列在高性能机器人和工业感知领域占据主导地位，其旗舰 Jetson AGX Orin 在 60W 热设计功耗（TDP）下可输出高达 275 TOPS 算力。然而，NVIDIA 方案硬件单价昂贵（AGX Orin
              开发者套件售价约 3,700€），且功耗过高，无法直接应用于轻量级电池供电的嵌入式终端。


              Hailo Technologies 正是切入这一痛点，将自研 Hailo-8（2.5W 下提供 26 TOPS INT8 算力）及新一代 Hailo-10H 处理器定位于实时边缘推理的专用协处理器。传统 GPU
              架构需要在外部内存总线上反复搬运中间特征图，而 Hailo 的结构驱动型数据流架构直接将神经网络层映射到片上计算与存储单元阵列中。相邻赛道参与者还包括 Google Coral（提供 4 TOPS
              入门级算力，但缺乏高吞吐视觉处理能力及生成式 AI 路线规划）以及高通（Qualcomm，依托 Snapdragon 和 Cloud AI 平台瞄准企业级车载与移动端市场）。在商业化边缘部署上，Hailo 凭借
              Husqvarna 商用割草机器人、Vicon 智能模块化安防摄像头以及 Blue White Robotics 农业自动驾驶系统等量产项目验证了其市场采纳度。
