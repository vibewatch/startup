  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 自研数据流架构与核心芯片产品矩阵
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies 设计专用边缘 AI
              处理器，通过将硬件执行与深度神经网络的计算图拓扑相对齐，打破传统冯·诺依曼计算架构的束缚。在传统边缘加速芯片设计中，片外动态随机存取内存（DRAM）与计算核心之间频繁搬运数据，不仅造成严重的内存带宽瓶颈，还会推高延迟并加剧发热。Hailo
              通过自研的结构驱动型数据流架构解决了这一工程痛点，并在其旗舰 Hailo-8 NPU 及后续产品线中落地。Hailo-8 将所有所需内存直接集成于片上，在无需外置 DRAM 的前提下，以 2.5W
              的典型功耗提供最高 26 TOPS 的 AI 算力。


              为应对新兴的多模态模型与端侧生成式 AI 负载，Hailo 推出了 Hailo-10H 独立加速芯片，在 2.5W 功耗包络内提供 40 TOPS INT4 与 20 TOPS INT8 算力。与 Hailo-8
              纯片上内存的设计不同，Hailo-10H 集成了直接 DDR 内存接口，以承载 20 亿参数大语言模型（LLM）与视觉语言模型（VLM）所需的更大参数空间。此外，Hailo 还推出了 Hailo-15
              系列（Hailo-15L 与 Hailo-15H）AI
              视觉系统级芯片（SoC），将图像信号处理（ISP）与深度学习加速融为一体，专攻智能安防与智慧城市摄像机。跨多代芯片的工程实现印证了其核心架构的通用性，但在严苛的板卡散热预算约束下持续扩展算力，仍需在片上 SRAM
              容量与片外 DRAM 带宽之间做出精准的工程取舍。
            claimRefs:
