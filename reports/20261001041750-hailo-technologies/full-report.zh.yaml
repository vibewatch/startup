    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品架构与商业版图
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies Ltd. 成立于 2017 年，总部位于以色列特拉维夫-雅法 Yigal Alon 街 82
              号，是一家致力于为边缘设备提供高性能深度学习加速的无晶圆厂半导体架构公司。Hailo
              的半导体方案立足于自研结构驱动型数据流架构，通过将神经网络各层计算与相邻物理芯片单元共置，消除传统冯·诺依曼架构的内存瓶颈。该硬件布局由三大主力芯片家族承载：一是 Hailo-8
              协处理器系列，针对传统计算机视觉和卷积负载提供最高 26 TOPS 算力；二是 Hailo-10 及 Hailo-10H 生成式 AI 加速器，在 5W 功耗约束下提供最高 40 TOPS
              算力，用于本地大语言模型（LLM）与视觉语言模型（VLM）推理；三是 Hailo-15L 与 Hailo-15H AI 视觉处理器 SoC，直接在摄像头形态中集成 AI-ISP
              传感器处理与视频分析功能。商业层面，公司宣称客户网络覆盖全球 300 多家客户，涉及车载信息娱乐、物理安防、工业自动化、机器人以及个人计算，并在德国、美国、日本、韩国、中国大陆及中国台湾设立了区域运营实体。
