        title: 投资建议与定价纪律
        blocks:
          - type: paragraph
            body: >-
              当前投资评级为“需进一步调研”（Research-more），风险等级为高，独立估值立场为“未知”。Seedtable 报道称 Microchip 于 2026 年 7 月 24 日签署了收购 Hailo
              的最终协议，Startup Nation Central 亦将 Hailo 标注为 7
              月已被收购；然而交易对价未予披露，掌握的材料中亦缺乏一手正式交割公告。这一区分至关重要，因为推进中或已完成的战略出售将彻底改变可投标的标的属性、治理权利、退出路径以及相对于普通风险投资轮次的合理对价。公司最近一次可见的一级市场定价参考性较弱：第三方数据库显示其
              2024 年 4 月估值为 $1.2B，而 2026 年 4 月的报道称拟议中的 SPAC 上市将导致估值跌破
              $500M。在缺乏最终交易条款、经审计经营业绩或当前可投标的的情况下，无法给出具备可防守性的进场价格区间或预期回报率。
