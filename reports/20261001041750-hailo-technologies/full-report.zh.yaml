  - id: TE001
    title: Hailo 芯片处理器与模块产品矩阵
    columns:
      - 产品系列
      - 外形规格 / 封装
      - 计算性能
      - 典型功耗
      - 目标市场与状态
      - 尽调局限 / 技术差距
    rows:
      - - Hailo-8
        - 独立 SoC / M.2 模块（Key M、B+M、A+E）
        - 26 TOPS (INT8)
        - 2.5W（芯片）/ 约 5W（M.2 入门套件）
        - 工业 IVA、智慧城市、机器人；处于量产阶段
        - 片上 SRAM 容量有限，脱离外部宿主机协同无法运行大参数语言模型。
      - - Hailo-8R
        - Mini PCIe（mPCIe）模块
        - 13 TOPS (INT8)
        - 典型功耗 2.5W
        - 传统工控机、低剖面网关；处于量产阶段
        - 算力吞吐量降低（仅为 Hailo-8 的一半），且单通道 PCIe 构成高帧率密集多路摄像头视频流瓶颈。
      - - Hailo-10H
        - 独立加速器 / M.2 模块
        - 40 TOPS (INT4) / 20 TOPS (INT8)
        - 典型功耗 2.5W
        - 端侧生成式 AI、汽车座舱、零售 POS；于 2025/2026 年实现商用供货
        - DDR 接口引入外部内存依赖，增加板级设计复杂度，更易受 DRAM 供应短缺影响。
      - - Hailo-15L / 15H
        - 视觉处理器 SoC（摄像头 SoC）
        - 集成 ISP，算力达 20+ TOPS
        - 5W 以下摄像头功耗区间
        - 智能安防摄像头、模块化视觉传感器；处于商业化部署阶段
        - ISP 调优工具链成熟度及对比主流摄像头 SoC（如 Ambarella）的画质表现，仍未获得独立基准测试证实。
    notes: 数据综合自 Hailo 官方产品简介、授权分销商 EBV Elektronik 技术规范及 All About Circuits 技术通告。功耗数值代表典型功耗。
