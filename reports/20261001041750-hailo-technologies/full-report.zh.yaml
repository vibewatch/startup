      - - 商用自主机器人
        - 高功耗嵌入式 GPU 模块（如 NVIDIA Jetson），需配备主动散热风扇和笨重电池。
        - Husqvarna Automower 割草机器人采用 Hailo-8 M.2 模块搭配宿主 SoC，实现实时避障。
        - 超低功耗（约 2.5W）延长了电池续航，并支持被动散热密封机身。
        - 模型更新需借助 Dataflow Compiler 离线编译，无法在端侧进行在线微调。
      - - 智能安防与场馆安检
        - 集中式视频服务器集群接收全量未压缩视频流，给网络带宽带来沉重负担。
