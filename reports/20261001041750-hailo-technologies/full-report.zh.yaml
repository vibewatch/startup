      - number: '2.3'
        title: 买方细分、采购路径与落地阻力
        blocks:
          - type: paragraph
            body: >-
              边缘 AI 芯片的商业化落地主要分布于三大客户客群：工业/机器人 OEM 厂商、智能视觉与物理安防方案商，以及汽车 Tier-1 供应商。在工业自动化与机器人领域，硬件工程副总裁与嵌入式系统负责人把控 BOM
              清单，核心评估 NPU 芯片的瓦级热效率、工作温度耐受区间（-40°C 至
              85°C）以及摆脱片外内存的能力。在物理安防与智慧城市领域，摄像机产品经理重点看重免去云端订阅年费的实时多路视频分析能力。在车载感知领域，系统架构师则严格执行 ASIL-B 与 AEC-Q100
              安全认证标准。然而，在各个细分市场中，规模化落地均面临显著阻力：从成熟 NVIDIA CUDA
              软件生态迁移的高昂切换成本、针对自定义神经网络架构的编译器工具链适配难度、长达数年的车规验证周期，以及芯片厂商对单价与出货量严格保密所导致的商业单位经济模型不透明。
