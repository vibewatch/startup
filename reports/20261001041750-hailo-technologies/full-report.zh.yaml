            body: >-
              据报道 Microchip 的战略收购意向相比诉求性 IPO
              路径提供了更强退出证据，但这无法确立普通股股东所得款项或回报倍数。尽调的首要工作是获取已签署收购协议或交割公告、交易对价与支付形式、监管审批条件状态、债务与优先权清算分配瀑布、完全稀释后股权比例，以及管理层留任条款。财务尽调必须单独获取经审计收入、毛利率、在手订单、客户集中度、现金、债务、烧钱速度与现金跑道；累计融资并不等同于可用现金。投资逻辑失效的触发条件包括：交易未完成交割、交易对价被债务或优先权实质性削减、客户项目未能转化为持续量产收入，或重组后的技术路线图失去关键工程与商业能力。反之，若披露明确现金对价、顺利完成交割并保障合理股东所得，评估立场将从继续研究转向针对具体交易的投资核保。
