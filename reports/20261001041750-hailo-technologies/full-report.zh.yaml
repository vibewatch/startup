  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与支出范畴
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies 切入的商业领域聚焦于边缘人工智能加速硬件与嵌入式计算机视觉处理器。该市场涵盖集成于物理终端设备（如自动化设备、工业
              PC、智能安防摄像头及车载感知系统）中的协处理器与系统级芯片（SoC），专用于在本地执行深度学习推理。该赛道边界明确包含功耗通常处于 5W 至 25W
              之间的专用神经网络处理单元（NPU）、视觉处理单元（VPU）以及模块化加速卡（M.2 与 PCIe
              卡）。相反，该边界严格排除了高功耗云端数据中心训练集群、运行非神经网络控制软件的通用中央处理器（CPU）、云端托管 API
              服务，以及缺乏神经网络加速引擎的通用消费级显示硬件。目前主流的既有替代方案主要由嵌入式图形处理器（GPU）与宿主 CPU 构成，这类方案普遍存在热降频严重、功耗过高的问题，且需要外置 DRAM
              开销，推高了整体物料清单（BOM）成本。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
