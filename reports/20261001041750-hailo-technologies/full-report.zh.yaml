      - number: '3.2'
        title: 实测硬件基准：Hailo 数据流对比 NVIDIA GPU 架构
        blocks:
          - type: paragraph
            body: >-
              2026 年在波兹南-拉维卡机场（Poznań-Ławica Airport）进行的一项严谨独立实测基准测试，在跑道标线语义分割与跑道地面灯光点检测两项任务中，对 Hailo-8 与旗舰级 NVIDIA
              Jetson AGX Orin 进行了对比评估。实测表明，尽管 Jetson AGX Orin 在 MAXN 全功率模式下取得了更高的峰值帧率（点检测任务中为 84.51 FPS 对 67 FPS），但搭载
              Hailo-8 的 Raspberry Pi 5 在所有受测视觉模型上的单帧能耗均降低了 2.5 倍至 4 倍。具体而言，Hailo-8 方案的单帧能耗处于 119.07 mJ 至 216.86 mJ 之间，而
              Jetson AGX Orin 的单帧能耗则高达 332.98 mJ 至 638.41 mJ。


              此外，Hailo-8 系统的持续工作功耗保持在 7.98W 至 8.31W 之间——其中 Hailo-8 NPU 本身相比宿主 CPU 基线功耗仅增加 0.30W 至 0.48W——与 Jetson 持续
              26.96W 至 28.14W 的高功耗形成鲜明对比。对比内存占用，Jetson 在运行分割任务时需要超过 4 GB 的系统 RAM 来承载 PyTorch CUDA 缓冲区，而 Hailo-8
              方案不仅内存占用极低，其 RAM 开销甚至低于纯 CPU 运行的基线状态。这一实测数据证明，对于受制于散热空间与电池续航而无法采用高功耗 GPU 的边缘设备，Hailo
              的数据流架构在体积、重量与功耗（SWaP）指标上具备突出优势。
