  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户群体细分与目标市场
        blocks:
          - type: paragraph
            body: >-
              Hailo 的客户群体围绕高吞吐边缘 AI
              推理场景构建，在这些场景中，低功耗、本地实时计算与不依赖云端是核心的架构指标。公司将其商业客户细分为工业自动化、机器人、智能建筑管理、智慧零售以及安防监控摄像头系统等领域。其硬件采购方既涵盖一线消费级与工业级
              OEM 厂商——如自主割草机器人领域的 Husqvarna、交互式零售 POS 结算硬件领域的 Elo Touch Solutions，以及模块化安防摄像头领域的
              Vicon——也包括垂直领域的物联网方案商，如智慧暖通自控领域的 Automata Nexus 与智能农机领域的 Blue White Robotics。除深度定制的 OEM 集成外，Hailo 还维系着超
              10,000 名活跃开发者的庞大生态，支持包括 Raspberry Pi AI HAT+ 2 与 ASUS UGen300 USB 硬件模块在内的通用加速卡，建立了覆盖原型开发到企业量产的多元化客户漏斗。
