      - number: '8.2'
        title: 核心投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              正面产业逻辑在于：Hailo 搭建了布局广泛的边缘 AI 产品平台，并取得了清晰可见的落地深度。公司官网展示了加速器与视觉处理器产品线，罗列了明确的商用量产案例；2024 年 3 月的公司新闻稿宣称拥有超 300
              家客户并拓展了美洲分销网络。官方联系页面还列出了遍布以色列、日本、德国、美国、中国台湾、韩国及中国大陆的运营据点。反向论点则主要立足于财务与战略层面，而非单纯的技术优劣：独立第三方报道披露了公司紧迫的流动性需求、1
              月份的裁员、$9M 应急贷款，以及融资重压下随后发生的 50%
              团队大裁撤。招聘页面仍在开放岗位仅属于微弱的运营信号，根本无法对冲上述严重的财务危机指标，亦无法证明并购交割后的业务连续性。因此，现有的产品商业化落地证据仅能证明其具备被并购的战略价值，而无法支撑其独立的股权定价。
