  - id: FP001
    title: 边缘 AI 架构权衡图谱：能效与峰值算力
    type: quadrant
    summary: 边缘 AI 加速器的实证定位，对比原始算力、能效表现与成本占用。
    data:
      xAxis:
        label: 算力规模（归一化峰值 TOPS / 模型承载能力）
        min: 0
        max: 10
      yAxis:
        label: SWaP 与能效（单帧能耗倒数与成本优势）
        min: 0
        max: 10
      points:
        - label: Hailo-8（Raspberry Pi 5 HAT）
          x: 3.5
          'y': 9
          description: 2.5W 功耗下达 26 TOPS；单帧能耗最低（119-217 mJ），系统成本低至约 320 欧元
        - label: Hailo-10H（GenAI 加速器）
          x: 5
          'y': 8.5
          description: 40 TOPS INT4 at 2.5W；在紧凑散热预算内支持端侧 LLM/VLM 运行
        - label: NVIDIA Jetson AGX Orin (MAXN)
          x: 9.5
          'y': 2.5
          description: 60W 功耗下达 275 TOPS；具备峰值原始吞吐量与成熟 CUDA 生态，但成本高昂（约 3700 欧元）且运行功耗约 28W
        - label: NVIDIA Jetson Orin Nano / NX
          x: 6
          'y': 5.5
          description: 10-25W 功耗下达 20-100 TOPS；均衡中阶算力并享有完整 JetPack 软件支持
        - label: Google Coral Edge TPU
          x: 1.5
          'y': 7.5
          description: 4 TOPS at 2W；入门门槛低，但模型容量受限且无 GenAI 支持路径
        - label: Raspberry Pi 5（纯 CPU 基准）
          x: 0.8
          'y': 1
          description: 无加速的主机 CPU；吞吐量不足（低于 5 FPS）且单帧能耗高（超过 1500 mJ）
    approximationNotes: 散点坐标系根据 MDPI Electronics（2026）公布的功耗、单价及实测单帧能耗数据综合评估的序数定位。
