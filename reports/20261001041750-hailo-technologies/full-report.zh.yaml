figures:
  - id: FO001
    title: Hailo Technologies 公司发展与战略里程碑（2017-2026）
    type: timeline
    summary: 按时间顺序列示 Hailo 的创立历程、计算芯片架构发布、多轮股权融资里程碑以及 2026 年面临的流动性挑战。
    data:
      items:
        - date: 2017-02
          label: 公司创立
          detail: Hailo Technologies 由 Orr Danon、Avi Baum 和 Hadar Zeitlin 创立于以色列特拉维夫，专注于研发边缘 AI 专用芯片。
          tone: positive
        - date: 2019-05
          label: Hailo-8 架构首度亮相
          detail: 推出独创数据流架构与 Hailo-8 处理器，为边缘神经网络提供高达 26 TOPS 算力。
          tone: positive
        - date: 2020-03
          label: $60M B 轮融资
          detail: 公司斩获 $60M B 轮融资，加速边缘处理器制造工艺与商业化渠道拓展。
          tone: positive
        - date: 2021-10
          label: $136M C 轮融资
          detail: Hailo 完成由 Gil Agmon 领投的 $136M C 轮融资，投后估值提升至约 $1.0B。
          tone: positive
        - date: 2024-04
          label: Hailo-10 发布与 $120M 追加融资
          detail: 发布 Hailo-10 生成式 AI 加速器（功耗低于 5W 下达 40 TOPS），并宣布按 $1.2B 估值完成 $120M C 轮追加融资。
          tone: positive
        - date: 2026-01
          label: CES 2026 商业化成果展示
          detail: 集中展示商业化落地成果，涵盖 ASUS USB 加速器、Raspberry Pi AI HAT+、Fujitsu 零售 POS 终端以及 Husqvarna 自动割草机。
          tone: neutral
        - date: 2026-01
          label: 业务重组与紧急借款
          detail: 由于现金消耗加剧，公司裁员接近 10%，并获得一笔 900 万美元紧急信贷额度。
          tone: negative
        - date: 2026-04
          label: 折价 SPAC 上市报道
          detail: Delek Automotive 监管公告披露，受急迫流动性需求驱动，公司拟通过美国 SPAC 合并上市，目标估值低于 $500M。
          tone: negative
    approximationNotes: 各里程碑均基于已核实的新闻稿、员工记录以及 Delek Automotive 披露的监管文件。
    claimRefs:
      - CO001
      - CO002
