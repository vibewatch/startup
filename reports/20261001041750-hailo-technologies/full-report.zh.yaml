      - number: '2.2'
        title: 市场规模测算视角、增长驱动力与边界现实
        blocks:
          - type: paragraph
            body: >-
              评估边缘 AI 处理器的潜在市场空间，必须将宏观半导体预测与下游真实的实际采购支出区分开来。尽管业内机构常给出十年内达数百亿美元的边缘 AI
              芯片潜在市场总量（TAM）预期，但短期内可服务市场（SAM）规模要小得多。硬件采购方主要以独立 M.2/PCIe 加速扩展卡，或板载焊接的单片视觉处理器形式采购边缘 AI
              芯片。推动采购的核心结构性利好包括：数据中心传输带宽成本攀升、自动化机器人对延迟的严苛要求、禁止将原始监控视频上传至中心服务器的数据合规禁令，以及外置 DRAM
              价格波动带来的供应链风险。然而，可服务可获取市场（SOM）的渗透率正受到多重制约，包括车规级芯片漫长的研发验证周期、工业设备保守的换代节奏，以及新兴 Fabless 芯片初创企业普遍缺乏经审计公开出货量数据。
            claimRefs:
              - CM005
              - CM006
              - CM007
