              意向，以及随后未披露金额的战略交易。这些属于 Hailo 连续的融资与流动性信号，而非可比公司倍数。在交易对价、证券条款、财务表现与交割状态得以验证前，乐观、基准与悲观情景结果仍属定性判断。
