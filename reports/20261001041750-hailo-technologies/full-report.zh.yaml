      - number: '6.4'
        title: 留存韧性、渠道拓展与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管技术落地已获得一定验证且坐拥 100 多家客户，但 Hailo 在客户留存、同客群增购扩张以及营收韧性等商业指标上信息极其不透明。Hailo 及其收购方 Microchip Technology
              均未公开披露嵌入式芯片业务的净金额留存率（NRR）、毛金额留存率（GRR）、年化流失率或平均合同金额。在半导体行业中，客户导入设计（Design
              Win）通常意味着长达数年的开发周期与后续的稳定出货，但客户在芯片代际更迭时始终保留切换供应商的权利。此外，Revelio Labs 职场情报记录到 2026 年内公司活跃在招岗位同比骤降 50%，员工总数净减少
              2.4%，表明在出售给 Microchip 前夕公司已在大幅放缓招聘并紧缩商业开支。Microchip
              的收购公告亦提示了客户订单周期波动、价格竞争加剧以及并购整合执行等风险，突显出客户集中度与出货可持续性是后续尽调的核心变量。
