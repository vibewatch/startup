            body: >-
              Hailo 将芯片产品推向车载、安防、工业自动化、零售等终端领域，大幅延展了认证合规、安全标准、隐私保护与产品责任等维度的尽调暴露面。现存合作伙伴资料仅能证实某款指定的 Hailo-8 M.2 模块取得了 CE
