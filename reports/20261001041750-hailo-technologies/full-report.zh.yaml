  - id: TP002
    title: 功能与特性对比矩阵：Hailo-8 对比 NVIDIA Jetson AGX Orin
    columns:
      - 评估维度
      - 搭载于 Raspberry Pi 5 上的 Hailo-8
      - NVIDIA Jetson AGX Orin 开发者套件
      - 架构优势 / 权衡
      - 来源依据
    rows:
      - - AI 加速器架构
        - 专用 NPU（结构驱动数据流矩阵）
        - 异构 SoC（Ampere GPU + Tensor Cores + 双 NVDLA）
        - Hailo 将神经网络层直接映射至片上存储与计算单元；NVIDIA 采用标准的冯·诺依曼存储层级结构
        - MDPI 2026；Hailo 博客 2025
      - - AI 性能与精度
        - 26 TOPS (INT8)
        - 275 TOPS (INT8/FP16)
        - NVIDIA 峰值 TOPS 高出约 10.5×，但 Hailo 在特定 CNN 任务中可提供更高的每瓦吞吐量
        - MDPI 2026 表 1
      - - 持续运行动态功耗
        - 7.98 W 至 8.31 W（整板总功耗，其中 Hailo-8 NPU 增加约 0.30–0.48 W）
        - 26.96 W 至 28.14 W（MAXN 功耗模式）
        - Hailo 系统的持续运行电耗大约为 Jetson AGX Orin 的三分之一
        - MDPI 2026 第 5.2.4 节
      - - 单帧能耗
        - 119.07 mJ（关键点检测）至 216.86 mJ（图像分割）
        - 332.98 mJ（关键点检测）至 638.41 mJ（图像分割）
        - 在相同的机场视觉检测任务中，Hailo 单帧能耗降低了 2.5× 至 4×
        - MDPI 2026 第 5.2.4 节
      - - 主机内存占用
        - 内存占用低于纯 CPU 执行模式（系统 RAM <1 GB）
        - 运行图像分割需要 >4 GB 系统 RAM（PyTorch CUDA 缓冲区）
        - Hailo 避免了在主机端分配大容量 CUDA 缓冲区，更适配受限的单板计算机
        - MDPI 2026 第 5.2.2 节
    notes: 实证基准测试指标反映了 MDPI Electronics（2026 年 8 月）发布的在波兹南-瓦维察机场（Poznań-Ławica Airport）针对 1080p 30 FPS 视频进行的 25 分钟标准化测试运行结果。
