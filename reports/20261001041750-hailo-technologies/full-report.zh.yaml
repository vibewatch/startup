  - id: TE003
    title: 硬件、软件与系统运行架构
    columns:
      - 架构层级
      - 组件 / 技术
      - 在边缘流水线中的职能
      - 关键依赖
      - 运营或尽调风险
    rows:
      - - 芯片计算核心
        - 结构驱动型数据流神经网络引擎
        - 将神经网络各层作为数据流直接映射至计算与存储阵列执行。
        - 专有片上路由互连架构。
        - 刚性硬件映射需要专用编译；非标准算子层面临模拟执行的性能折损。
      - - 内存子系统
        - 全集成片上 SRAM（Hailo-8）/ 直接 DDR 接口（Hailo-10H）
        - 在本地缓存中间激活值和模型权重，避免内存总线饱和。
        - 裸片面积限制（SRAM）及外部 DRAM 时序限制（Hailo-10H）。
        - 全球 DRAM 价格上涨与元器件短缺影响 Hailo-10H 的物料清单（BOM）及毛利率。
      - - 模型构建环境
        - Hailo Dataflow Compiler（DFC）与 Model Zoo
        - 将浮点网络量化为 INT8/INT4，并将计算图优化为 HEF 二进制文件。
        - 宿主机工作站算力；Python 及主流机器学习框架（PyTorch、TensorFlow、ONNX）。
        - 处理复杂非卷积视觉语言架构时面临编译器优化瓶颈。
      - - 宿主机运行时与驱动
        - HailoRT 与 PCIe 内核驱动
        - 将 HEF 二进制文件加载至设备内存，并协调基于 PCIe Gen-3.0 的双向 DMA 传输。
        - 宿主机操作系统内核稳定性（Linux 内核主线、Windows WHQL 驱动）。
        - 宿主机 CPU 驱动开销和延迟抖动在多设备级联配置下可能成为瓶颈。
      - - 物理封装
        - NGFF M.2、mPCIe 以及独立 BGA
        - 为边缘设备、工控机（IPC）与网关提供标准机械及电气接口。
        - 系统级导热垫与被动散热片散热。
        - 在无通风的高温工业外壳（-40°C 至 85°C）中，持续重载会导致热降频。
    notes: 架构分析基于 Hailo AI 软件套件用户文档、技术产品简介及分销商硬件集成指南。
