        - 在场馆客流高峰期，多路视频流扩展受限于宿主机 PCIe 通道数及内存缓冲区吞吐量。
    notes: 综合自客户落地案例（HP、Husqvarna、Evolv、Vicon）及官方技术新闻稿。基准数据代表厂商公布的运行参数。
