      - number: '1.2'
        title: 领导架构、人员规模与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies 的管理层由首席执行官 Orr Danon 掌舵，他与首席技术官 Avi Baum 共同创立了公司；在创始高管 Rami Feig 离职后，早期商务拓展主要由联合创始人
              Hadar Zeitlin 主导。Danon 对 Hailo 的产品路线图、架构差异化及股权融资拥有全面的战略决策权。然而，鉴于 Hailo
              数据流编译器与硬件映射工具链的高度专有性，对核心技术创始人的重度依赖构成了实质性的关键人物风险。Revelio Labs 职场情报数据显示，Hailo 全球员工总数在 2025 年底达到 418 人的峰值，随后在
              2026 年 3 月回落至约 381 人，同比收缩 2.4%，同期活跃在招岗位数量骤降
              50%。从职能分布来看，员工分布于财务与运营（38.5%）、工程研发（32.4%）以及销售与营销（29.1%）；地理分布则高度集中在中西亚的核心研发中心（73.3%），东亚（17.6%）与西欧（2.9%）的商业驻点次之。
