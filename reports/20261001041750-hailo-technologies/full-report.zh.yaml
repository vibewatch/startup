      - number: '5.2'
        title: 软件工具链、模型编译与宿主机运行时协议栈
        blocks:
          - type: paragraph
            body: >-
              在边缘 AI 实际部署中，若缺乏完备稳健的软件编译工具链，芯片硬件性能将难以发挥。Hailo 将其完整的开发者套件打包至按季度迭代的 Hailo AI Software Suite 中。该工具链的核心是
              Hailo 数据流编译器（DFC），该 SDK 能够直接读取主流开源框架（包括 TensorFlow、TensorFlow Lite、PyTorch、Keras 及
              ONNX）预训练出的神经网络计算图。编译器依次执行解析、模型优化、精度量化以及图资源分配，最终生成确定性的硬件执行二进制文件，即 Hailo Executable Format（HEF）。


              该软件环境划分为模型构建环境与运行时目标环境两大体系。运行时方面，HailoRT 提供了用户空间 C/C++ 库与 Python 绑定（pyHailoRT），依托专用的内核级 PCIe 驱动程序，通过 PCIe
              Gen 3.0 或以太网与底层硬件加速器直接通信。软件套件还涵盖 Hailo Model Zoo，提供针对目标检测、图像分割与分类等任务预训练并验证的神经网络架构，以及包含多网络流水线组件与参考应用模板的部署框架
              TAPPAS。尽管 Hailo 宣称其活跃开发者已突破每月 10,000 人、社区参与者超 100,000 人，但开发者在非标神经网络算子迁移、密集视觉 Transformer
              模型的编译器资源分配冲突，以及宿主机 Linux 内核驱动更新维护上，依然面临较高的落地门槛。
            claimRefs:
