            title: 从架构上摆脱外置 DRAM 瓶颈
            body: >-
              Hailo 选择在 Hailo-8 NPU 内部集成全部所需内存，构成了其在边缘视觉领域的核心竞争壁垒。通过彻底摆脱模型推理对外置 DRAM 的依赖，Hailo-8 降低了整体 BOM 成本，简化了 PCB
              板卡布线复杂度，隔绝了全球 DRAM 供应短缺的波动冲击，并实现了约 2.5W 的业内领先功耗表现。
