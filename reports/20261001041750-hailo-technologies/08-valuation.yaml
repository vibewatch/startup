company:
  name: Hailo Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Research more rather than underwrite a new standalone entry: independent sources report a
    definitive Microchip acquisition, but the consideration and definitive closing evidence are
    absent from the assigned source set. The reported move from a $1.2 billion 2024 mark toward
    a sub-$500 million SPAC valuation, followed by an undisclosed sale, makes price discovery and
    transaction-status verification the controlling diligence questions.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with high risk and an unknown standalone valuation
      stance. Seedtable reports that Microchip signed a definitive agreement to acquire Hailo on
      July 24, 2026, while Startup Nation Central describes Hailo as acquired in July; however,
      the consideration was not disclosed and the assigned evidence does not include a primary
      closing notice. That distinction matters because a pending or completed strategic sale
      changes the investable security, governance rights, liquidity path, and relevant price from
      those of a venture round. The last visible private mark is also a weak anchor: third-party
      profiles place the April 2024 valuation at $1.2 billion, while April 2026 reporting said a
      proposed SPAC would reduce it below $500 million. Without transaction terms, audited
      operating results, or a currently available security, no defensible entry range or target
      return can be stated.
    claimRefs: [CV001, CV002, CV005, CV008, CV009, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The industrial thesis is that Hailo built a broad edge-AI product platform with visible
      deployment breadth. Its website describes accelerator and vision-processor families,
      identifies named product deployments, and a March 2024 company release claimed more than
      300 customers plus expanded American distribution. The official contact page also lists
      operating locations across Israel, Japan, Germany, the United States, Taiwan, South Korea,
      and China. The anti-thesis is financial and strategic rather than purely technical:
      independent reporting described urgent liquidity needs, a January layoff, a $9 million
      loan, and a subsequent 50% workforce reduction under funding pressure. A careers page that
      continues to invite applications is a weak operating signal and cannot offset those
      financing indicators or prove post-transaction continuity. Product adoption evidence
      therefore supports strategic value, but not a standalone equity price.
    claimRefs: [CV006, CV007, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-anchors
    title: Scenarios and comparable anchors
    body: >-
      The scenario frame is event-driven because the available evidence does not support a
      revenue-multiple model. Public profiles report roughly $340 million to more than $350
      million raised and a $1.2 billion 2024 valuation, but one profile explicitly says no
      audited revenue or ARR figure is disclosed in its underlying public sources. Historical
      round dilution estimates of about 14% and 10% are arithmetic estimates, not a current
      cap table, and no liquidation preferences are disclosed. The best available references
      are therefore the 2024 financing mark, the reported sub-$500 million SPAC indication, and
      the later undisclosed strategic transaction. These are sequential financing and liquidity
      signals for Hailo, not comparable-company multiples. Bull, base, and bear outcomes remain
      qualitative until consideration, security terms, financial performance, and closing
      status can be verified.
    claimRefs: [CV003, CV004, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence
    body: >-
      Reported strategic interest from Microchip is stronger exit evidence than an aspirational
      IPO path, but it does not establish proceeds to common shareholders or a return multiple.
      The immediate diligence sequence is to obtain the executed acquisition agreement or
      closing announcement, consideration and form of payment, regulatory-condition status,
      debt and preference waterfalls, fully diluted ownership, and management retention terms.
      Financial diligence must separately obtain audited revenue, gross margin, backlog,
      customer concentration, cash, debt, burn, and runway; cumulative funding is not cash
      available. The thesis breaks if the transaction did not close, consideration is materially
      impaired by debt or preferences, customer programs do not convert into repeat production
      revenue, or the post-restructuring roadmap loses key engineering and commercial capacity.
      Conversely, disclosed cash consideration with a clean close and defensible shareholder
      proceeds would move the analysis from research-more to transaction-specific underwriting.
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV010, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Decision rule
    body: >-
      Do not use the 2024 private mark as an entry price. Underwrite only after confirming the
      acquisition status, consideration, security waterfall, and audited operating metrics.
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV011]
