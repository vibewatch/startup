  evidenceGaps:
    - type: missing-source
      severity: material
      topic: acquisition
      missingEvidence: Primary confirmation of closing, consideration, payment form, regulatory conditions, and continuing legal entity.
      whyItMatters: The evidence determines whether any standalone security remains investable and what value can reach shareholders.
      diligencePath: Obtain Microchip filings, the executed agreement, closing release, regulatory approvals, and seller capitalization schedules.
      relatedQuestionRefs: [QV004]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited revenue, gross margin, backlog, customer concentration, cash, debt, burn, and runway.
      whyItMatters: Funding raised is not cash available, and no revenue multiple or solvency view is defensible without these metrics.
      diligencePath: Request audited statements, current management accounts, bank statements, debt documents, backlog, and cohort-level customer data.
      relatedQuestionRefs: [QV002, QV003, QV005, QV006]
    - type: private-evidence-only
      severity: material
      topic: ownership
      missingEvidence: Fully diluted cap table, option pool, debt, liquidation preferences, participation rights, and shareholder proceeds waterfall.
      whyItMatters: Gross transaction value may differ materially from proceeds available to common shareholders.
      diligencePath: Review the capitalization table, financing documents, debt schedule, preference stack, and transaction allocation model.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: Comparable-company operating metrics, transaction multiples, and Hailo financials on a consistent period and denominator.
      whyItMatters: Historical funding marks and a reported sale cannot be converted into a defensible revenue or earnings multiple.
      diligencePath: Build a comparable set from public filings and disclosed M&A after obtaining Hailo revenue, margin, and growth definitions.
      relatedQuestionRefs: [QV005]
