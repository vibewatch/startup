  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence, What would change the view]
    rows:
      - [Thesis, "Broad accelerator and vision-processor portfolio", "Audited product-line revenue and gross margin by generation"]
      - [Thesis, "Company claimed more than 300 customers in March 2024", "Repeat production orders and customer concentration disclosure"]
      - [Anti-thesis, "Reported urgent liquidity need, layoffs, and a $9 million loan", "Audited cash, debt, burn, and runway showing durable funding"]
      - [Anti-thesis, "Reported 50% workforce reduction during a strategic reset", "Retention plan and evidence that roadmap delivery remains intact"]
    notes: >-
      Product and customer statements are company-issued; liquidity and restructuring points are
      third-party reports, and none substitutes for audited financial or customer-level diligence.
    claimRefs: [CV006, CV007, CV012, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal]
    rows:
      - [Bull, "Acquisition closed on clean cash terms with limited preference leakage", "Positive return depends on disclosed common-share proceeds; no range supportable", "Primary closing notice and shareholder waterfall"]
      - [Base, "Strategic sale occurred but consideration and allocation remain undisclosed", "Research-more; historical financing marks do not establish realizable value", "Consistent secondary reporting but absent transaction documents"]
      - [Bear, "Close failed or proceeds are absorbed by debt, preferences, or restructuring costs", "Common-equity downside could be severe; no numeric floor supportable", "Missing close evidence plus reported liquidity pressure and valuation compression"]
    notes: >-
      Scenario values are intentionally not quantified because the assigned evidence lacks sale
      consideration, audited operating metrics, fully diluted ownership, debt, and preference terms.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV010, CV011]
