callouts:
  - calloutType: "insight"
    title: "The On-Chip Memory Differentiator in Constrained Edge Markets"
    body: "In edge AI hardware procurement, memory architecture represents a primary cost and reliability determinant. While competing accelerators demand external DRAM chips that face recurring supply shortages and pricing volatility, on-chip memory architectures bypass DRAM procurement entirely. This delivers predictable BOM costs for industrial OEMs, though it imposes silicon die area trade-offs for very large model weights."
    claimRefs:
      - "CM003"
      - "CM004"
  - calloutType: "risk"
    title: "Ecosystem Switching Costs and Developer Platform Lock-in"
    body: "Hardware efficiency alone does not guarantee commercial market share in embedded edge computing. The incumbent dominance of established software ecosystems creates steep switching barriers. Unless edge AI hardware vendors provide mature, seamless compilers for standard neural network frameworks, OEM buyers face substantial integration friction and extended qualification cycles."
    claimRefs:
      - "CM013"
      - "CM014"
