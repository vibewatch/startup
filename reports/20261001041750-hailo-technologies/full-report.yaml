        title: Leadership Structure, Operational Headcount, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Executive leadership at Hailo Technologies is steered by Chief Executive Officer Orr Danon, who co-founded
              the venture alongside Chief Technology Officer Avi Baum, with early business development shaped by
              co-founder Hadar Zeitlin following the tenure of founding executive Rami Feig. Danon exercises extensive
              strategic control over Hailo's product roadmap, architectural differentiation, and capital raises.
              However, heavy reliance on core technical founders creates material key-person dependence given the
              proprietary nature of Hailo's dataflow compiler and hardware mapping toolchain. According to workforce
              intelligence data from Revelio Labs, Hailo's total global headcount peaked at 418 employees in late 2025
              before settling at approximately 381 personnel as of March 2026, representing a 2.4% year-over-year
              contraction alongside a 50% drop in active job postings. Functionally, Hailo's staff is distributed across
              Finance and Operations (38.5%), Engineering (32.4%), and Sales and Marketing (29.1%), with geographic
              concentration heavily weighted toward its primary research and development hub in Central and Western Asia
              (73.3%), followed by commercial outposts in East Asia (17.6%) and Western Europe (2.9%).
