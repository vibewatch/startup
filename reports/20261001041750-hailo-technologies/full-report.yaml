      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Decoupling from External DRAM Bottlenecks
            body: >-
              Hailo's architectural decision to integrate all required memory on-chip within the Hailo-8 NPU represents
              a major competitive differentiator in edge vision applications. By eliminating reliance on external DRAM
              for model inference, the Hailo-8 reduces overall bill-of-materials cost, simplifies board layout
              complexity, minimizes vulnerability to global DRAM supply shortages, and achieves an industry-leading
              power consumption profile of approximately 2.5W.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Memory Scalability Limits for Frontier Multimodal Workloads
            body: >-
              While on-chip memory delivers exceptional power efficiency for convolutional neural networks and vision
              models, the Hailo-8's SRAM capacity cannot host modern multi-billion parameter language or multimodal
              models. Although the Hailo-10H introduces a direct DDR interface to support 2-billion parameter models, it
              reintroduces external DRAM cost and thermal dependencies, placing Hailo in direct competition with
              high-throughput edge GPUs and NPUs from incumbents.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Markets
        blocks:
          - type: paragraph
            body: >-
              Hailo's customer base is structured around high-throughput edge AI inference workloads where low power
              consumption, real-time local compute, and cloud independence are critical architectural requirements. The
              company segments its commercial buyers across industrial automation, robotics, intelligent building
              management, smart retail, and physical security camera systems. Commercial hardware buyers range from
              tier-1 consumer and industrial original equipment manufacturers—such as Husqvarna in autonomous robotic
              lawn mowers, Elo Touch Solutions in interactive retail point-of-sale checkout hardware, and Vicon in
              modular security cameras—to specialized IoT engineering firms like Automata Nexus in intelligent HVAC
              controls and Blue White Robotics in agricultural machinery. In addition to high-touch custom OEM
              integrations, Hailo supports an ecosystem of over 10,000 active developers using off-the-shelf
              accelerators including the Raspberry Pi AI HAT+ 2 and ASUS UGen300 USB hardware modules, establishing a
              diversified top-of-funnel customer pipeline across prototyping and enterprise production.
