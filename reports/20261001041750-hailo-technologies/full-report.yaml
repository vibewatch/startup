      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Hailo markets processors into automotive, security, industrial automation, retail, and other device
              contexts, widening the certification, safety, privacy, and product-liability diligence surface. The
              retained partner material supports CE and FCC certification only for a named Hailo-8 M.2 module; it does
              not establish portfolio-wide, automotive, functional-safety, or cybersecurity certification. Hailo's
              public website terms also say product use is governed by separate subscription terms and disclaim
              guarantees for website accuracy and availability. Those website clauses are not product incident evidence,
              but they leave commercial warranties, service levels, indemnities, and remedies outside the reviewed
              record.
