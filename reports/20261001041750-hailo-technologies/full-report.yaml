  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Financing and execution risk ranks first because the retained independent reporting describes an urgent
              liquidity need, workforce reduction, new debt, and a proposed SPAC at a sharply lower indicated valuation.
              Those reports do not disclose cash, burn, covenant terms, or committed SPAC proceeds, so funding raised
              must not be treated as cash available. Workforce data also conflicts materially across four databases,
              limiting confidence in operating-capacity trends. The heatmap therefore scores disclosed signals
              separately from missing-control evidence: high residual severity reflects both adverse facts and weak
              visibility, not an assertion that an undisclosed failure has occurred.
