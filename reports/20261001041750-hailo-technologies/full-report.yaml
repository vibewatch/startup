  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with high risk and an unknown standalone valuation stance. Seedtable
              reports that Microchip signed a definitive agreement to acquire Hailo on July 24, 2026, while Startup
              Nation Central describes Hailo as acquired in July; however, the consideration was not disclosed and the
              assigned evidence does not include a primary closing notice. That distinction matters because a pending or
              completed strategic sale changes the investable security, governance rights, liquidity path, and relevant
              price from those of a venture round. The last visible private mark is also a weak anchor: third-party
              profiles place the April 2024 valuation at $1.2 billion, while April 2026 reporting said a proposed SPAC
              would reduce it below $500 million. Without transaction terms, audited operating results, or a currently
              available security, no defensible entry range or target return can be stated.
            claimRefs:
              - CV001
              - CV002
              - CV005
