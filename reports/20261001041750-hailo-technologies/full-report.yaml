      - number: '6.2'
        title: Adoption Trajectory and Developer Ecosystem Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Hailo's edge AI platform reached a critical inflection point in 2026,
              culminating in the completed acquisition by Microchip Technology announced on September 21, 2026.
              Microchip disclosed that Hailo brings an established ecosystem encompassing more than 100 enterprise
              customers alongside an active developer community exceeding 10,000 users engaged across open-source and
              edge AI platforms. To accelerate adoption beyond direct silicon sales, Hailo expanded its distribution
              reach in July 2026 through global distribution partnerships with Newark in North America, Farnell in EMEA,
              and element14 in APAC. These distributor relationships provide international fulfillment of Hailo
              processors, evaluation modules, and development kits to engineers and enterprises worldwide, supported by
              design resources and supply chain infrastructure. Direct commercial support is maintained across seven
              global offices in Tel Aviv, Tokyo, Munich, Chicago, Taipei, Seoul, and Shenzhen, although third-party
              workforce data indicates total company headcount contracted 2.4% year-over-year in early 2026 to 381
              employees.
