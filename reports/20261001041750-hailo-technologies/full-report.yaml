  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Scope
        blocks:
          - type: paragraph
            body: >-
              The commercial domain targeted by Hailo Technologies centers specifically on edge artificial intelligence
              acceleration hardware and embedded computer vision processors. This market encompasses co-processors and
              system-on-chip (SoC) silicon integrated into physical client devices—such as automated machinery,
              industrial personal computers, smart security cameras, and automotive perception systems—to perform deep
              learning inference locally. The boundary explicitly includes dedicated Neural Processing Units (NPUs),
              Vision Processing Units (VPUs), and modular accelerators (M.2 and PCIe cards) designed for power envelopes
              typically under 5W to 25W. Conversely, this boundary strictly excludes high-power cloud data center
              training clusters, general-purpose central processing units (CPUs) executing non-neural control software,
              cloud-hosted API services, and off-the-shelf consumer display hardware lacking neural acceleration
              engines. Incumbent status-quo substitutes primarily comprise embedded graphics processing units (GPUs) and
              host CPUs, which frequently suffer from thermal throttling and high power draw, alongside external DRAM
              overheads that inflate bill-of-materials (BOM) expenses.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
