  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Streams, and Commercial Reach
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies generates commercial revenue as a fabless semiconductor designer focused on edge
              artificial intelligence acceleration. Its monetization architecture relies almost exclusively on physical
              hardware sales, spanning standalone neural processing unit (NPU) silicon such as the Hailo-8 and Hailo-15
              families as well as modular M.2 and PCIe accelerator cards. To support silicon adoption across diverse
              edge platforms, Hailo provides a proprietary software stack comprising the HailoRT runtime and Dataflow
              compiler without public recurring license fees. Commercial distribution is executed via a hybrid
              go-to-market structure combining direct OEM engagement with global value-added distributors including
              J-Squared Technologies in North America and Macnica DHW in South America. While developer starter kits
              carry transparent retail list pricing, production volume pricing and customer contract terms remain
              strictly private.
