            title: Commercial Down-Round and Liquidity Headwinds
            body: >-
              Despite technical edge efficiency, April 2026 regulatory disclosures reveal an urgent liquidity crunch,
              including early-2026 workforce layoffs, emergency bridge debt, and a proposed SPAC listing that would cut
              Hailo's valuation from $1.2B to below $500M.
            calloutType: risk
