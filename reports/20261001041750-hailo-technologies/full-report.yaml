              - CE006
      - number: '5.3'
        title: Form Factors, Commercial Integration, and Hardware Reliability Controls
        blocks:
          - type: paragraph
            body: >-
              Hailo delivers its silicon technology both as discrete packaged integrated circuits for board-down
              customer designs and as standardized plug-and-play modular acceleration cards. Through distribution and
              manufacturing partnerships with distributors such as EBV Elektronik (Avnet), Hailo provides standard NGFF
              M.2 acceleration modules across Key M, Key B+M, and Key A+E configurations, alongside PCI Express Mini
              (mPCIe) modules based on the 13 TOPS Hailo-8R variant. These form factors enable industrial PC
              manufacturers, robotics integrators, and edge gateway vendors to add high-performance AI inferencing
              capabilities into existing compute enclosures through standard PCIe Gen-3.0 interfaces (spanning 1-lane,
              2-lane, or 4-lane configurations).


              Deployability in demanding operational environments is supported by automotive and industrial grade
              certifications. The Hailo-8 architecture satisfies AEC-Q100 Grade 2 temperature standards (-40°C to 105°C
              for automotive, -40°C to 85°C for industrial), adheres to Automotive SPICE (A-SPICE) Level 2 development
              flows, and complies with ISO-26262 ASIL-B (D) functional safety criteria. In commercial deployments such
              as Husqvarna robotic mowers, Automata Nexus building automation systems, and HP retail POS terminals,
              local on-device inference eliminates recurring cloud egress costs, mitigates cloud network latency, and
              ensures data privacy. However, technical risks persist regarding host driver stability across diverse
              operating systems (Linux, Windows, and Yocto), thermal dissipation under sustained maximum throughput in
              fanless enclosures, and long-term supply chain predictability.
            claimRefs:
              - CE014
              - CE015
