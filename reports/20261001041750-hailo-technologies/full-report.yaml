      - number: '8.3'
        title: Scenarios and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The scenario frame is event-driven because the available evidence does not support a revenue-multiple
              model. Public profiles report roughly $340 million to more than $350 million raised and a $1.2 billion
              2024 valuation, but one profile explicitly says no audited revenue or ARR figure is disclosed in its
              underlying public sources. Historical round dilution estimates of about 14% and 10% are arithmetic
              estimates, not a current cap table, and no liquidation preferences are disclosed. The best available
              references are therefore the 2024 financing mark, the reported sub-$500 million SPAC indication, and the
              later undisclosed strategic transaction. These are sequential financing and liquidity signals for Hailo,
              not comparable-company multiples. Bull, base, and bear outcomes remain qualitative until consideration,
              security terms, financial performance, and closing status can be verified.
            claimRefs:
