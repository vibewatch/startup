      - number: '2.3'
        title: Buyer Segmentation, Procurement Paths, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of edge AI silicon divides across three primary customer tiers: Industrial/Robotics
              OEMs, Smart Vision and Physical Security providers, and Automotive Tier-1 suppliers. In industrial
              automation and robotics, VP of Hardware Engineering and Embedded Systems Leads control the bill of
              materials, evaluating NPU silicon on watt-level thermal efficiency, operating temperature tolerance (-40°C
              to 85°C), and off-chip memory elimination. In physical security and smart cities, Camera Product Managers
              prioritize real-time multi-stream video analytics without recurring cloud subscription fees. In automotive
              perception, Systems Architects enforce rigorous ASIL-B and AEC-Q100 safety certifications. However, across
              all segments, major adoption constraints persist: high switching costs from legacy NVIDIA CUDA software
              ecosystems, complex compiler toolchain porting for custom neural architectures, multi-year validation
              qualification lead times, and opaque commercial unit economics where vendors keep pricing and shipment
              totals private.
            claimRefs:
