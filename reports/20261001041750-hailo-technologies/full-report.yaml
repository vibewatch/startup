      - number: '6.4'
        title: Retention Durability, Channel Expansion, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite demonstrated technological traction and over 100 customer relationships, Hailo's commercial model
              exhibits significant information opacity regarding customer retention, cohort expansion, and revenue
              durability. Neither Hailo nor acquirer Microchip Technology publicly reports net revenue retention (NRR),
              gross retention (GRR), annual churn rates, or average contract values for embedded silicon accounts. In
              semiconductor markets, hardware design wins typically involve multi-year development cycles followed by
              sustained volume shipments, but customers retain switching options during generational silicon refreshes.
              Furthermore, workforce intelligence from Revelio Labs recorded a 50% year-over-year drop in active job
              postings and a 2.4% net decline in headcount during 2026, indicating hiring deceleration and commercial
              rationalization prior to the Microchip sale. Microchip's acquisition disclosures noted risks regarding
              customer order pattern fluctuations, pricing pressures, and integration execution, highlighting that
              customer concentration and volume repeatability represent key ongoing diligence variables.
            claimRefs:
              - CU001
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
