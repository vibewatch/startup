      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Public Listing Pressures
        blocks:
          - type: paragraph
            body: >-
              Hailo's cumulative equity funding exceeds $340 million across multiple institutional rounds, culminating
              in an April 2024 Series C extension of $120 million that valued the business at $1.2 billion post-money.
              Capital was provided by an investor syndicate featuring the Zisapel family, Gil Agmon, Delek Motors,
              Poalim Equity, and OurCrowd. However, lack of transparency regarding recurring revenue, gross margins, and
              customer cash collection has masked structural burn rates inherent in advanced-node fabless semiconductor
              tape-outs. In April 2026, regulatory disclosures from investor Delek Automotive revealed that Hailo was
              preparing an emergency public listing via a Special Purpose Acquisition Company (SPAC) merger on a U.S.
              exchange at a marked-down valuation under $500 million. This transaction follows an urgent need for
              liquidity, a nearly 10% workforce reduction in January 2026, and an emergency $9 million debt facility.
              This downward valuation reset underscores severe late-stage venture refinancing constraints and places
              intense scrutiny on the commercial viability of Hailo's stand-alone business model.
