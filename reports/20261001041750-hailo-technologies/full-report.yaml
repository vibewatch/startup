      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The industrial thesis is that Hailo built a broad edge-AI product platform with visible deployment
              breadth. Its website describes accelerator and vision-processor families, identifies named product
              deployments, and a March 2024 company release claimed more than 300 customers plus expanded American
              distribution. The official contact page also lists operating locations across Israel, Japan, Germany, the
              United States, Taiwan, South Korea, and China. The anti-thesis is financial and strategic rather than
              purely technical: independent reporting described urgent liquidity needs, a January layoff, a $9 million
              loan, and a subsequent 50% workforce reduction under funding pressure. A careers page that continues to
              invite applications is a weak operating signal and cannot offset those financing indicators or prove
              post-transaction continuity. Product adoption evidence therefore supports strategic value, but not a
              standalone equity price.
            claimRefs:
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
