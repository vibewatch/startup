      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Reported strategic interest from Microchip is stronger exit evidence than an aspirational IPO path, but it
              does not establish proceeds to common shareholders or a return multiple. The immediate diligence sequence
              is to obtain the executed acquisition agreement or closing announcement, consideration and form of
              payment, regulatory-condition status, debt and preference waterfalls, fully diluted ownership, and
              management retention terms. Financial diligence must separately obtain audited revenue, gross margin,
              backlog, customer concentration, cash, debt, burn, and runway; cumulative funding is not cash available.
              The thesis breaks if the transaction did not close, consideration is materially impaired by debt or
              preferences, customer programs do not convert into repeat production revenue, or the post-restructuring
              roadmap loses key engineering and commercial capacity. Conversely, disclosed cash consideration with a
              clean close and defensible shareholder proceeds would move the analysis from research-more to
              transaction-specific underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
