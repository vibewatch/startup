  - id: FP001
    title: 'Edge AI Architectural Tradeoff Map: Energy Efficiency vs. Peak Compute'
    type: quadrant
    summary: >-
      Empirical positioning of edge AI accelerators contrasting raw compute against energy efficiency and cost
      footprint.
    data:
      xAxis:
        label: Compute Scale (Normalized Peak TOPS / Model Capacity)
        min: 0
        max: 10
      yAxis:
        label: SWaP & Power Efficiency (Inverse Energy per Frame & Cost Advantage)
        min: 0
        max: 10
      points:
        - label: Hailo-8 (Raspberry Pi 5 HAT)
          x: 3.5
          'y': 9
          description: 26 TOPS at 2.5W; lowest energy per frame (119-217 mJ) and low ~320€ system cost
        - label: Hailo-10H (GenAI Accelerator)
          x: 5
          'y': 8.5
          description: 40 TOPS INT4 at 2.5W; enables on-device LLMs/VLMs within compact thermal budget
        - label: NVIDIA Jetson AGX Orin (MAXN)
          x: 9.5
          'y': 2.5
          description: 275 TOPS at 60W; peak raw throughput and CUDA maturity, but high cost (~3700€) and ~28W draw
        - label: NVIDIA Jetson Orin Nano / NX
          x: 6
          'y': 5.5
          description: 20-100 TOPS at 10-25W; balanced mid-tier compute with full JetPack software support
        - label: Google Coral Edge TPU
          x: 1.5
          'y': 7.5
          description: 4 TOPS at 2W; accessible entry-level inference but limited model capacity and no GenAI path
        - label: Raspberry Pi 5 (CPU-only Baseline)
          x: 0.8
          'y': 1
          description: Unaccelerated host CPU; insufficient throughput (<5 FPS) and high energy per frame (>1500 mJ)
    approximationNotes: >-
      Point coordinates represent ordinal positioning synthesized from published power draw, unit price, and empirical
      energy per frame data in MDPI Electronics (2026).
