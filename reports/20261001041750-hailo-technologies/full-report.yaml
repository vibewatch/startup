              - CM002
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Boundary Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for edge AI processors requires distinguishing broad macroeconomic
              silicon forecasts from actual accessible procurement spend. While aggregate edge AI semiconductor TAM
              estimates cited by industry observers frequently reach tens of billions of dollars over a ten-year
              horizon, near-term service addressable markets (SAM) are substantially narrower. Hardware buyers procure
              edge AI silicon either as discrete M.2/PCIe accelerator add-in boards or as soldered monolithic vision
              processors. Key structural tailwinds driving procurement include rising data center transit bandwidth
              costs, strict latency limits in automated robotics, data residency mandates that prohibit sending raw
              surveillance video to central servers, and supply-chain volatility surrounding external DRAM pricing.
              However, serviceable obtainable market (SOM) penetration is constrained by long automotive design cycles,
              conservative industrial retrofit cadence, and the lack of publicly audited unit shipment volumes from
              emerging fabless chipmakers.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
