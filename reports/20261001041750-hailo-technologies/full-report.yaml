      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Emergency Restructuring
        blocks:
          - type: paragraph
            body: >-
              Hailo raised over $340 million in total venture funding across six financing rounds through 2024,
              achieving a peak post-money valuation of $1.2 billion following its Series C extension. However, absence
              of self-sustaining hardware cash flows and high operating expenditure created severe liquidity strain by
              early 2026. The company laid off nearly 10% of its workforce in January 2026 and took out an emergency $9
              million loan to address urgent working capital needs. Continued cash burn prompted an additional 50%
              workforce reduction in June 2026, eliminating 110 positions. Plans to access public equity markets via a
              special-purpose acquisition company (SPAC) at a valuation under $500 million subsequently collapsed,
              leading to a reported distressed acquisition by Microchip Technology and a $54 million write-off by lead
              investor Delek Automotive.
