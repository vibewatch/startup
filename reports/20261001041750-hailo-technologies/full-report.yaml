      - number: '6.3'
        title: Named Production Deployments and Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer case studies provide concrete proof of Hailo's silicon performance in
              commercial production rather than speculative pilots. Husqvarna selected the Hailo-8 AI accelerator for
              its commercial Automower 430X NERA and 450X NERA robotic mowers, executing on-device deep learning
              inference to navigate complex turf environments and detect obstacles in real time without reliance on
              cellular or cloud connectivity. In commercial building operations, Automata Nexus deployed Hailo
              processors to build predictive, AI-enhanced telemetry systems that monitor commercial HVAC equipment,
              anticipate component failures, and optimize energy efficiency. For physical security, Vicon incorporated
              the Hailo-15 AI vision processor into its Vicon NEXT modular camera line to perform high-resolution edge
              video analytics and automated event triggering. In retail automation, Elo POS integrated the Hailo-8
              processor into checkout hardware for automated optical scanning, while Blue White Robotics implemented
              Hailo chips on autonomous tractors to optimize processing bandwidth and reduce thermal dissipation under
              harsh field operating conditions.
