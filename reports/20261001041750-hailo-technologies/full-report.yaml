  - id: TE003
    title: Hardware, Software, and System Operating Architecture
    columns:
      - Architecture Layer
      - Component / Technology
      - Functional Role in Edge Pipeline
      - Critical Dependency
      - Operational or Diligence Risk
    rows:
      - - Silicon Compute Core
        - Structure-driven Dataflow Neural Engine
        - Executes neural network layers as data streams mapped directly onto compute/memory array.
        - Proprietary on-chip routing interconnect fabric.
        - Rigid hardware mapping requires specialized compilation; non-standard layer types face emulation penalties.
      - - Memory Subsystem
        - Fully Integrated On-Chip SRAM (Hailo-8) / Direct DDR Interface (Hailo-10H)
        - Buffers intermediate activations and model weights locally to avoid memory bus saturation.
        - Die size area constraints (SRAM) and external DRAM timing constraints (Hailo-10H).
        - Surging global DRAM prices and component shortages impact Hailo-10H bill-of-materials and gross margins.
      - - Model Build Environment
        - Hailo Dataflow Compiler (DFC) & Model Zoo
        - Quantizes floating-point networks to INT8/INT4 and optimizes graphs into HEF binaries.
        - Host workstation compute; Python and standard ML frameworks (PyTorch, TensorFlow, ONNX).
        - Compiler optimization bottlenecks when handling complex, non-convolutional vision-language architectures.
      - - Host Runtime & Drivers
        - HailoRT & PCIe Kernel Driver
        - Loads HEF binaries into device memory and coordinates bidirectional DMA transfers via PCIe Gen-3.0.
        - Host operating system kernel stability (Linux kernel tree, Windows WHQL drivers).
        - Host CPU driver overhead and latency jitter can become bottlenecks in multi-device cascading setups.
      - - Physical Packaging
        - NGFF M.2, mPCIe, and Discrete BGA
        - Provides standard mechanical and electrical interfaces for edge boxes, IPCs, and gateways.
        - System-level thermal pads and passive heatsink dissipation.
        - >-
          Thermal throttling under sustained heavy load in unventilated high-ambient industrial enclosures (-40°C to
          85°C).
    notes: >-
      Architecture analysis based on Hailo AI SW Suite user documentation, technical product briefs, and distributor
      hardware integration guidelines.
