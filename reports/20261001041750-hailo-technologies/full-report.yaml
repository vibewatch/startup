      - number: '4.4'
        title: Financial Diligence Verdict and Underwriting Recommendations
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Hailo represents a distressed hardware investment where
              commercial traction has failed to keep pace with fabless semiconductor cash burn. The absence of public
              financial statements, gross margin data, and unit shipment counts constitutes a blocking diligence gap
              that conceals the company's true unit-level profitability. The emergency restructuring sequence throughout
              2026—characterized by debt incurrence, deep workforce reductions, valuation impairment, and an eventual
              discounted acquisition—confirms that Hailo was unable to establish an independent economic moat. Any
              future underwriting or secondary asset evaluation requires full disclosure of historical P&L records,
              customer concentration schedules, and liquidation preference outcomes from the Microchip transaction.
            claimRefs:
