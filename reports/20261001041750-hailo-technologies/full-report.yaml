      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The public record shows a channel-led Americas expansion, but it does not quantify distributor
              concentration, direct-versus-channel revenue, inventory commitments, or replacement rights. Workforce
              intelligence places 73.3% of employees in Central and Western Asia, creating geographic concentration even
              though exact headcount is disputed. More importantly for a fabless semiconductor company, the retained
              official and partner pages do not identify foundry or outsourced assembly and test counterparties. The
              absence is a diligence gap rather than proof of single sourcing; investment underwriting should assume no
              mitigation credit until dual-source plans, allocation rights, lead times, and business-continuity evidence
              are reviewed.
