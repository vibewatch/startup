        title: Exhibits
        blocks:
          - type: callout
            title: Empirical Energy Efficiency Advantage at the Extreme Edge
            body: >-
              Peer-reviewed airport monitoring benchmarks confirm that Hailo-8 delivers 2.5× to 4× lower energy
              consumption per frame and an ~11.5× hardware cost discount relative to NVIDIA Jetson AGX Orin, creating a
              compelling value proposition for battery-constrained, volume edge deployments.
            calloutType: strength
            claimRefs:
