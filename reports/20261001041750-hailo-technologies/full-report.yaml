chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Commercial Footprint
        blocks:
          - type: paragraph
            body: >-
              Founded in 2017 and headquartered at 82 Yigal Alon Street in Tel Aviv-Yafo, Israel, Hailo Technologies
              Ltd. operates as a fabless semiconductor architecture company dedicated to high-performance deep learning
              acceleration for edge devices. Hailo structures its semiconductor offering around a proprietary novel
              structure-driven dataflow architecture designed to eliminate traditional von Neumann memory bottlenecks by
              co-locating neural network layer computations on adjacent physical silicon segments. This hardware
              strategy is instantiated across three primary silicon families: the Hailo-8 co-processor line delivering
              up to 26 TOPS for classic computer vision and convolutional workloads, the Hailo-10 and Hailo-10H
              generative AI accelerators offering up to 40 TOPS under a 5-watt envelope for local Large Language Model
              and Vision-Language Model execution, and the Hailo-15L and Hailo-15H AI vision processor SoCs integrating
              AI-ISP sensor processing and video analytics directly into camera-class form factors. Commercially, the
              company claims an international footprint spanning more than 300 customers across automotive infotainment,
              physical security, industrial automation, robotics, and personal compute, supported by regional operating
              entities in Germany, the United States, Japan, South Korea, China, and Taiwan.
