      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The On-Chip Memory Differentiator in Constrained Edge Markets
            body: >-
              In edge AI hardware procurement, memory architecture represents a primary cost and reliability
              determinant. While competing accelerators demand external DRAM chips that face recurring supply shortages
              and pricing volatility, on-chip memory architectures bypass DRAM procurement entirely. This delivers
              predictable BOM costs for industrial OEMs, though it imposes silicon die area trade-offs for very large
              model weights.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Ecosystem Switching Costs and Developer Platform Lock-in
            body: >-
              Hardware efficiency alone does not guarantee commercial market share in embedded edge computing. The
              incumbent dominance of established software ecosystems creates steep switching barriers. Unless edge AI
              hardware vendors provide mature, seamless compilers for standard neural network frameworks, OEM buyers
              face substantial integration friction and extended qualification cycles.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Incumbents, Dedicated Edge NPUs, and Adjacencies'
        blocks:
          - type: paragraph
            body: >-
              The edge artificial intelligence semiconductor landscape is stratified into three distinct competitive
              tiers: incumbent GPU-accelerated Systems on Modules (SoMs), dedicated low-power Neural Processing Units
              (NPUs), and adjacent mobile or IoT application processors. NVIDIA dominates high-performance robotic and
              industrial perception through its Jetson family, notably the Jetson AGX Orin, which delivers up to 275
              TOPS of compute at a 60W thermal design power (TDP). However, NVIDIA's platform incurs high unit hardware
              costs (~3,700€ for the AGX Orin Developer Kit) and significant electrical power demands that render it
              unsuitable for lightweight, battery-operated embedded endpoints.


              Hailo Technologies targets this deployment constraint by positioning its proprietary Hailo-8 (26 TOPS INT8
              at 2.5W) and next-generation Hailo-10H processors as dedicated coprocessors for real-time edge inference.
              Unlike traditional GPU architectures that transfer intermediate feature maps across external memory buses,
              Hailo's structure-driven dataflow architecture maps neural network layers directly onto an on-chip matrix
              of compute and memory units. Adjacent players include Google Coral, which provides entry-level 4 TOPS
              acceleration but lacks high-throughput vision capacity or a generative AI roadmap, and Qualcomm, whose
              Snapdragon and Cloud AI platforms target enterprise automotive and mobile tiers. Commercial edge
              deployments validate Hailo's market adoption in commercial robotic lawnmowers with Husqvarna, smart
              modular security cameras with Vicon, and agricultural autonomy systems with Blue White Robotics.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP010
      - number: '3.2'
        title: 'Empirical Hardware Benchmarks: Hailo Dataflow vs. NVIDIA GPU Architecture'
        blocks:
          - type: paragraph
            body: >-
              Rigorous independent empirical benchmarking conducted at Poznań-Ławica Airport in 2026 evaluated Hailo-8
              against the flagship NVIDIA Jetson AGX Orin across semantic segmentation (runway markings) and point
              detection (airfield ground lighting). The empirical evaluation established that while Jetson AGX Orin in
              MAXN power profile achieved higher peak frame rates (84.51 FPS vs. 67 FPS in CSV point detection), the
              Raspberry Pi 5 augmented with Hailo-8 achieved a 2.5× to 4× lower energy footprint per frame across all
              evaluated vision architectures. Specifically, the Hailo-8 configuration consumed between 119.07 mJ and
              216.86 mJ per frame, compared to 332.98 mJ to 638.41 mJ per frame on the Jetson AGX Orin.


              Furthermore, continuous active electrical power draw for the Hailo-8 system remained between 7.98W and
              8.31W—with the Hailo-8 NPU contributing merely 0.30W to 0.48W above the host CPU baseline—contrasting
              sharply with the Jetson's continuous 26.96W to 28.14W draw. In memory utilization, Jetson required over 4
              GB of host system RAM to support PyTorch CUDA buffers during segmentation, whereas the Hailo-8 platform
              maintained a compact footprint with lower RAM overhead than CPU-only baseline execution. This empirical
              evidence demonstrates that Hailo's dataflow architecture delivers compelling Size, Weight, and Power
              (SWaP) advantages for edge devices where thermal envelopes and battery longevity preclude high-wattage
              GPUs.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
