        title: Exhibits
        blocks:
          - type: callout
            title: Decision rule
            body: >-
              Do not use the 2024 private mark as an entry price. Underwrite only after confirming the acquisition
              status, consideration, security waterfall, and audited operating metrics.
            calloutType: recommendation
            claimRefs:
