    title: Hailo Edge AI System and Software Stack
    type: stack
    summary: >-
      Layered representation of Hailo's end-to-end edge AI delivery model from developer model training down to physical
      silicon deployment.
    data:
      layers:
        - label: Application & Pipeline Layer (TAPPAS & Customer Apps)
          detail: End-to-end vision pipelines, local GenAI assistants, and robotics perception apps
        - label: Runtime Host Driver Layer (HailoRT)
          detail: User-space C/C++ API, Python bindings, and PCIe kernel driver for device communication
        - label: Model Build & Quantization Layer (Dataflow Compiler)
          detail: Model parser, resource allocator, INT8/INT4 quantizer, and HEF binary generator
        - label: Silicon Architecture Core Layer (Hailo-8 / 10H / 15)
          detail: Structure-driven dataflow neural compute fabric with on-chip SRAM or direct DDR
        - label: Hardware Packaging Layer (M.2 & mPCIe Modules)
          detail: Standard NGFF M.2 and mPCIe cards integrating thermal interface materials and PCIe Gen-3.0
        - label: Physical System Deployment Layer (Edge Enclosures & Sensors)
          detail: Smart cameras, robotics compute boxes, and industrial PCs operating in -40C to 85C ambient
    approximationNotes: >-
