  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Proprietary Dataflow Architecture and Core Silicon Portfolio
        blocks:
          - type: paragraph
            body: >-
              Hailo Technologies designs domain-specific edge AI processors that challenge traditional von Neumann
              computing architectures by aligning hardware execution with the graph topologies of deep neural networks.
              In traditional edge accelerator designs, frequent memory transfers between off-chip dynamic random-access
              memory (DRAM) and processing elements introduce significant memory bandwidth bottlenecks, increased
              latency, and high thermal dissipation. Hailo addresses this operational friction through a proprietary
              structure-driven dataflow architecture implemented in its flagship Hailo-8 NPU and subsequent product
              lines. The Hailo-8 integrates all memory directly on-chip, enabling up to 26 tera-operations per second
              (TOPS) of AI compute at a typical power dissipation of 2.5W without requiring external DRAM.


              To address emerging multimodal models and on-device generative AI workloads, Hailo introduced the
              Hailo-10H discrete accelerator, delivering 40 TOPS of INT4 and 20 TOPS of INT8 compute within a 2.5W power
              envelope. Unlike the pure on-chip memory model of the Hailo-8, the Hailo-10H integrates a direct DDR
              memory interface to accommodate larger parameter spaces characteristic of 2-billion parameter large
              language models (LLMs) and vision-language models (VLMs). Hailo also offers the Hailo-15 series (Hailo-15L
              and Hailo-15H) of AI vision system-on-chips (SoCs), which combine image signal processing (ISP) with deep
              learning acceleration for intelligent security and smart city camera deployments. Engineering execution
              across multiple silicon generations demonstrates core architecture versatility, but scaling silicon
              performance under constrained board thermal budgets requires careful design trade-offs between on-chip
              SRAM capacity and external DRAM bandwidth.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
