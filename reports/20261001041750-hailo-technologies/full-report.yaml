figures:
  - id: FO001
    title: Hailo Technologies Corporate Development and Strategic Milestones (2017-2026)
    type: timeline
    summary: >-
      Chronological trajectory of Hailo's corporate founding, architectural silicon releases, capital financing
      milestones, and 2026 liquidity challenges.
    data:
      items:
        - date: 2017-02
          label: Corporate Founding
          detail: >-
            Hailo Technologies founded in Tel Aviv, Israel by Orr Danon, Avi Baum, and Hadar Zeitlin to design
            specialized edge AI silicon.
          tone: positive
        - date: 2019-05
          label: Hailo-8 Architecture Debut
          detail: >-
            Introduction of proprietary dataflow architecture and Hailo-8 processor delivering up to 26 TOPS for edge
            neural networks.
          tone: positive
        - date: 2020-03
          label: $60M Series B Financing
          detail: >-
            Company secures $60M Series B round to accelerate edge processor manufacturing and commercial channel
            expansion.
          tone: positive
        - date: 2021-10
          label: $136M Series C Financing
          detail: >-
            Hailo completes $136M Series C funding round led by Gil Agmon, elevating post-money valuation to
            approximately $1.0B.
          tone: positive
        - date: 2024-04
          label: Hailo-10 Launch & $120M Extension
          detail: >-
            Unveils Hailo-10 generative AI accelerator (40 TOPS at <5W) and announces $120M Series C extension at $1.2B
            valuation.
          tone: positive
        - date: 2026-01
          label: CES 2026 Commercial Demonstrations
          detail: >-
            Showcases commercial deployments across ASUS USB accelerator, Raspberry Pi AI HAT+, Fujitsu retail POS, and
            Husqvarna autonomous mowers.
          tone: neutral
        - date: 2026-01
          label: Restructuring & Emergency Loan
          detail: >-
            Company undergoes workforce retrenchment of nearly 10% and secures an emergency $9 million debt facility
            amid mounting cash burn.
          tone: negative
        - date: 2026-04
          label: Down-Round SPAC Listing Reports
          detail: >-
            Delek Automotive regulatory filings disclose planned U.S. SPAC merger targeting valuation under $500M due to
            urgent liquidity requirements.
          tone: negative
    approximationNotes: Milestones reflect verified press releases, workforce records, and regulatory filings from Delek Automotive.
    claimRefs:
