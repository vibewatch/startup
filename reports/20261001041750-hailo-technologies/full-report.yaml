        title: Exhibits
        blocks:
          - type: callout
            title: Financing evidence is the immediate kill-criterion workstream
            body: >-
              Do not infer liquidity from cumulative funding. Require current cash, monthly burn, the $9 million loan
              agreement and covenants, binding SPAC documentation, minimum proceeds, redemption sensitivity, and a
              board-approved downside plan before underwriting continued product execution.
            calloutType: risk
