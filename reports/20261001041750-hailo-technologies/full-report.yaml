      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The financing thesis breaks if management cannot evidence at least 18 months of runway after binding
              financing, if the reported SPAC process fails without an alternative, or if debt covenants constrain
              product investment. Operational escalation triggers include another material workforce contraction, loss
              of a critical distributor, an unmitigated foundry or assembly single point of failure, or inability to
              document certifications required by target verticals. Security or safety incidents should be assessed from
              an incident register, recall log, penetration-test summary, and customer remediation records; the assigned
              pool contains none of those records. Mitigation maturity should therefore be scored as unverified until
              the diligence package supplies owners, controls, test results, and monitorable thresholds.
            claimRefs:
