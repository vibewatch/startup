      - - Active Continuous Power Draw
        - 7.98 W to 8.31 W (board total with Hailo-8 NPU adding ~0.30–0.48 W)
        - 26.96 W to 28.14 W (MAXN profile)
        - Hailo system operates at approximately one-third the continuous electrical power of Jetson AGX Orin
