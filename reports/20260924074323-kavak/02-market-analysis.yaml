company:
  name: Kavak
chapter:
  number: 2
  title: Market Analysis
  summary: Kavak operates in a large, fragmented used-car market whose main bottlenecks are trust, financing, logistics, and
    reconditioning. The opportunity is real, but public market-sizing data is thin, so the right answer is a structured boundary
    view rather than an overconfident TAM claim.
sections:
- id: boundary
  title: Defining the market
  body: 'Kavak should not be framed as a simple e-commerce marketplace. The company is trying to formalize a multi-step used-car
    transaction stack: sourcing, inspection, reconditioning, financing, logistics, customer support, and resale. That means
    the relevant market boundary includes the underlying used-vehicle transactions plus the services that make those transactions
    trustworthy. In practical diligence terms, the market is attractive precisely because it is inefficient, but that also
    means market size and conversion assumptions are inherently squishier than in a pure SaaS or consumer-app model. A useful
    diligence lens is that this market is large enough to support multiple winners, but only the operator that controls trust,
    financing, and service can capture the highest-value slice of the transaction stack.'
  claimRefs:
  - CM001
  - CM002
  - CM010
  tableRefs:
  - TM001
- id: sizing
  title: Sizing lenses, not a single TAM
  body: 'The public evidence does not support a single clean TAM number, so the better lens is a set of proxies: transaction
    volume, attach rates for financing, share of formal versus informal sales, and the addressable geography where the model
    can be operated profitably. Kavak’s own 2025 transaction and financing disclosures are useful as a company-scale benchmark,
    but they are not a market-size proof. The right conclusion is that the opportunity is large enough to matter, while still
    too opaque to convert into a precise spreadsheet certainty. That means the market answer is deliberately approximate:
    enough evidence exists to prove the opportunity is real, but not enough to collapse the space into one polished number
    without overclaiming precision.'
  claimRefs:
  - CM003
  - CM005
  - CM007
  - CM008
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: drivers
  title: Adoption drivers and constraints
  body: 'Adoption hinges on trust, underwriting, and operational execution. Buyers are willing to pay for a safer transaction
    when the alternative is a largely informal market with fraud risk and a weak warranty experience. Sellers care about liquidity
    and certainty of closing. The constraint set is equally clear: capital intensity, geography-specific regulation, macro
    volatility, and execution risk in post-sale service. That combination means the valuation case is not “large market therefore
    winner,” but “complex market where a strong operator can create defensible share if it keeps improving economics.” The
    same logic explains why customer experience and financing quality matter more than generic brand awareness: the buyer
    chooses the platform that most reliably reduces uncertainty and friction.'
  claimRefs:
  - CM004
  - CM006
  - CM009
  - CM011
  tableRefs:
  - TM003
