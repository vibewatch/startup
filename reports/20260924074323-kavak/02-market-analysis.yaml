  - CM005
  - CM010
  - CM011
- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - lens
  - proxy
  - usefulness
  - limitation
  rows:
  - - Transaction-volume lens
    - Company reported nearly 120,000 2025 transactions
    - Shows operational scale
    - Not a market total
  - - Financing lens
    - More than USD 1B financed since inception
    - Shows monetization depth
    - Not a market-size measure
  - - Share lens
    - Less than 1% market share per a16z
    - Shows white space
    - Depends on market definition
  - - Geography lens
    - LatAm plus GCC footprint
    - Explains where the model can scale
    - Country-by-country economics differ
  notes: This table deliberately uses proxies because a public investor-grade TAM is not available in the reviewed evidence.
