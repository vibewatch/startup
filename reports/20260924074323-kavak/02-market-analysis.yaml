  - buyer/payer
  - relevance
  rows:
  - - Used-car transaction stack
    - Used vehicle sale price plus marketplace services
    - New-car sales
    - Private buyers and sellers
    - Core market boundary
  - - Financing attach
    - Auto loans, installment plans, collateral-backed lending
    - Unsecured consumer credit
    - Buyer / lender
    - Critical monetization layer
  - - Inspection and reconditioning
    - Mechanical inspection, cosmetic reconditioning, warranty prep
    - Generic repair shops
    - Buyer / platform
    - Trust and quality layer
  - - Logistics and delivery
    - Transportation, pickup, delivery, storage
    - Commuter mobility services
    - Platform / seller
    - Operational moat layer
  - - Servicing and coverage
    - Post-sale support, warranty, return window
    - Standalone insurance only
    - Buyer / platform
    - Retention and trust layer
  notes: Boundary definition is qualitative because the reviewed sources do not provide a public TAM; the rows show what Kavak
    appears to monetize or de-risk.
