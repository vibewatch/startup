company:
  name: Kavak
chapter:
  number: 7
  title: Risks
  summary: The risk profile is still high even after profitability, because the company operates in a capital-intensive, trust-sensitive,
    and geographically complex category. The key risks are credit quality, after-sales service, expansion discipline, and
    the fact that several of the most important metrics remain undisclosed.
sections:
- id: operating-risk
  title: Operating and service risk
  body: 'The biggest practical risk is not that the business model is unknowable; it is that the model is hard. Every step
    in the used-car stack introduces room for error: inspection misses, pricing mistakes, warranty claims, credit mistakes,
    or poor issue resolution. Public complaints show that customers still sometimes experience that friction. In other words,
    the moat is inseparable from operations, which means execution quality is not a side issue. It is the business. Because
    the company also promises a better after-sales experience than the market norm, every quality miss has an outsized reputational
    effect relative to a simpler classifieds model. The product promise is strong precisely because customers can see the
    risk reduction, which means any service miss becomes highly visible and can travel quickly through word of mouth.'
  claimRefs:
  - CR002
  - CR006
  - CR010
  - CR012
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: credit-and-capital
  title: Credit and balance-sheet risk
  body: 'Kavak’s finance business is a strength only if credit quality remains controlled. The company is using financing
    to drive conversion and deepen monetization, but the public evidence does not reveal the default curve or underwriting
    loss profile. That is the single most important missing risk metric. The positive side is that the company appears better
    capitalized than a year ago; the negative side is that this remains a balance-sheet-heavy business in a cyclically exposed
    category. That makes the loan book and the funding stack intertwined: if underwriting softens or debt becomes more expensive,
    the operating model can feel the pressure quickly. The absence of a public loss-rate series means outside readers have
    to infer quality from financing growth and the company’s willingness to keep supporting the book, which is a far weaker
    signal than a disclosure-backed model. The 2026 Series F and other market trackers point in the same direction: fresh
    capital exists, but it does not erase the need to watch funding terms and credit performance closely.'
  claimRefs:
  - CR004
  - CR005
  - CR007
  - CR008
  tableRefs:
  - TR002
- id: geography-and-governance
  title: Geography, governance, and valuation risk
  body: The 2023 Peru/Colombia exit proves that expansion discipline matters. The 2025 valuation reset and 2026 financing
    also show that governance and capital allocation now matter more than bragging rights about rapid market entry. If Kavak
    grows too quickly into markets where the service model does not scale, the losses show up in both customer experience
    and equity dilution. The right response is not to stop expanding forever; it is to ensure that every market must earn
    its right to scale. The right mitigation is selective expansion with clear hurdle rates, not blanket caution, because
    the model still has room to create value if each market earns its right to scale. The valuation reset is therefore not
    a surprise in context; it is the market forcing a slower and more disciplined path to prove that the model can scale without
    heroic assumptions. A separate market readout on the 2025 financing round and public comp signals underscore that the
    reset was real, not just rhetorical, and that investors were pricing in the risk of slower but more durable growth.
  claimRefs:
  - CR003
  - CR009
  - CR011
  tableRefs:
  - TR003
