  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: credit-loss
    missingEvidence: The loan-book loss rate / NPL profile is still undisclosed.
    whyItMatters: It is the single most important missing risk metric for the financing stack.
    diligencePath: Ask for a credit investor deck, regulator filing, or loan-performance disclosure.
    relatedQuestionRefs:
    - QR002
    - QR007
  - type: missing-source
    severity: minor
    topic: regulatory-risk-coverage
    missingEvidence: A fuller public record on consumer-protection and lending scrutiny would deepen the register.
    whyItMatters: The regulatory / legal risk table is intentionally partial and should remain caveated.
    diligencePath: Search for regulator actions, lawsuits, or consumer complaints in each operating market.
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk
    missingEvidence: Direct regulator or legal records would clarify whether consumer-protection or lending issues are broader
      than the public complaints already captured.
    whyItMatters: The risk register should distinguish between anecdotal customer frustration and formal regulatory exposure.
    diligencePath: Search regulator enforcement pages, consumer-protection agencies, and court records in the company’s operating
      markets.
    relatedTableRefs:
    - TR001
