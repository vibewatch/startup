summary:
  headline: >-
    Kavak looks healthier than it did a year ago: profitability is showing up, the balance sheet has fresh support, and
    the company is still scaling a differentiated used-car and financing platform. The valuation reset and continued
    disclosure gaps keep the case interesting but not cheap, so the right posture remains to track rather than
    underwrite aggressively.
