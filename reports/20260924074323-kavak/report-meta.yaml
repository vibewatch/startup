companyProfile:
  summary: >-
    Kavak is a Mexico City-founded used-car marketplace that combines vehicle acquisition, inspection, reconditioning,
    financing, servicing, and customer support. The company is now showing a clear path to profitability and still
    reports strong transaction growth, but it remains a heavy-operations business with important financial and
    customer-experience metrics still undisclosed.
