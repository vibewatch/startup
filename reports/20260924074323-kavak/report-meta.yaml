  topStrengths:
    - Integrated used-car, financing, and post-sale model with clear customer trust value.
    - Fresh 2026 capital and first consolidated profitable month improve survivability.
    - Large partner ecosystem and high first-time-buyer share support demand.
  topRisks:
    - Credit and after-sales quality remain hard to observe and could break the thesis.
    - The company is still opaque on revenue, gross margin, headcount, and loss rates.
    - >-
      Geographic expansion has already shown retrenchment risk, and valuation remains below peak but still sensitive to
      execution.
  unresolvedGaps:
    - Exact revenue and gross margin remain undisclosed.
    - Loan-book loss rate / NPL profile is still missing.
    - Current headcount and customer-count baseline are not public.
    - Independent market-share and TAM data remain weak.
