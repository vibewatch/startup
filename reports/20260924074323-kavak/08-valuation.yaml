company:
  name: Kavak
chapter:
  number: 8
  title: Valuation
  summary: 'Kavak’s valuation reset is the most important change in the refresh: the company moved from an 8.7B peak to roughly
    2.2B, then raised fresh capital in 2026 as profitability improved. That makes the current stance closer to fair than euphoric,
    but the lack of public revenue and margin data still keeps the case from looking cleanly cheap.'
sections:
- id: history
  title: Valuation history and reset
  body: 'The valuation history is the core of the refresh. Kavak spent years at venture-style premium valuations and then
    re-priced down to roughly USD 2.2 billion in 2025, which was painful but also honest about the company’s execution reality.
    The 2026 round matters because it shows the market still sees value in the model, but at a valuation that is much closer
    to the current operating story. In other words, the business is no longer priced as a hyper-growth fantasy; it is priced
    as a complicated but increasingly disciplined operator. The turn from peak valuation to reset is important because it
    resets the burden of proof: future upside must come from execution, not multiple expansion alone.'
  claimRefs:
  - CV001
  - CV002
  - CV009
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: current-stance
  title: 'Current stance: fair, not cheap'
  body: 'The right stance is not “cheap” simply because the number is lower than the 2021 peak. The business is still private,
    still opaque on revenue and gross margin, and still exposed to credit and service execution. At the same time, the company
    is now showing profitability and is still attracting capital from high-quality investors. That combination supports a
    fair-value posture: the reset appears to have removed some of the bubble premium, but it has not yet made the business
    so transparent that the valuation case becomes purely mechanical. That makes the present case investable, but not frictionless,
    because public visibility is still too thin to treat the mark as fully de-risked.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
  - CV010
  tableRefs:
  - TV002
- id: gaps-and-exit
  title: What still blocks precision
  body: 'The biggest missing inputs are still the same: revenue, gross margin, credit losses, and a verifiable exit path.
    Without them, any valuation work is a scenario exercise rather than a true discounted cash-flow model. The practical answer
    is to keep the case in the track bucket and ask for more proof that profitability is durable. If the company can sustain
    the current capital structure and the credit business continues scaling, upside remains. If not, the reset could still
    have been too early. In practice, that means valuation should be framed as a range of outcomes tied to discipline, not
    as a single precise number that the evidence cannot support.'
  claimRefs:
  - CV007
  - CV008
  - CV011
  - CV012
  tableRefs:
  - TV003
