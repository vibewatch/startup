company:
  name: Kavak
chapter:
  number: 1
  title: Company Overview
  summary: Kavak is a Mexico City-founded used-car marketplace that now combines vehicle acquisition, reconditioning, financing,
    servicing, and partner distribution. The latest financing round and profitability milestone materially improve the story,
    but the company still keeps key operating metrics private, so the refresh remains a high-variance private-company diligence
    view rather than a fully transparent public-company profile.
sections:
- id: overview
  title: What Kavak does
  body: 'Kavak is still easiest to understand as a full-stack used-car marketplace: it sources vehicles, inspects and reconditions
    them, prices and finances purchases, and then supports the post-sale relationship with coverage and servicing. That model
    matters because it is not a thin listing layer; the company takes on operational complexity to reduce fraud and increase
    trust in markets where the used-car experience is often opaque. The latest company release frames the system as a mix
    of marketplace, credit, logistics, and AI-enabled workflow automation, which is why both growth and margin management
    matter at the same time. The 2026 refresh also adds a clearer line from 2025 profitability to the new capital raise, which
    makes the current story more about disciplined execution than pure growth.'
  claimRefs:
  - CO001
  - CO006
  - CO008
  - CO009
  tableRefs:
  - TO001
- id: leadership-and-capital
  title: Leadership, capital, and ownership signals
  body: 'The founder is still the public face, and that continuity helps explain why Kavak can keep a coherent mission narrative
    across expansion, retrenchment, and profitability milestones. The ownership story is also materially clearer than a year
    ago: the 2026 Series F and the 2025 down round show both fresh support and the reality that investors now price the business
    on improved operating discipline rather than on 2021-era growth optimism. That combination suggests a more durable balance
    sheet, but it also confirms that the company is still dependent on outside capital and on a narrow set of high-conviction
    backers.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO010
  tableRefs:
  - TO002
  - TO003
- id: open-questions
  title: What is still opaque
  body: 'The most important gaps remain basic operating metrics: exact headcount, exact customer count, public revenue, gross
    margin, and loss ratios in the financing book. Those omissions do not prevent a diligence view, but they do keep the profile
    from behaving like a public company model. The right interpretation is therefore disciplined but incomplete: the business
    is showing real scale and a path to profitability, yet the absence of full financial disclosure keeps the valuation and
    risk judgment from becoming mechanical. A simple milestone timeline is more useful than another prose summary because
    the refresh depends on a small number of dated turning points rather than a dense product roadmap.'
  claimRefs:
  - CO011
  - CO012
  figureRefs:
  - FO001
