chapter:
  number: 4
  title: Financials
  summary: The financing history now looks stronger than the 2024-2025 trough suggested, but the company still does not disclose
    revenue or gross margin. The key financial read is therefore balance-sheet resilience plus evidence of a path to durable
    profitability, not a fully modeled income statement.
sections:
- id: capital-history
  title: Funding and debt history
  body: 'The financial story starts with how much capital the company has been able to raise and the shape that capital has
    taken. The pattern is not unusual for a scaled marketplace with embedded credit: early equity to build the platform, late-stage
    equity to support expansion, debt to support inventory and lending, and then a reset when the market demanded more discipline.
    The important point is that Kavak is no longer a simple growth-at-all-costs story; it is a balance-sheet story with an
    attached operating turnaround. That matters because the company has moved from a simple venture-financing pattern into
    a hybrid structure where equity, debt, and operating cash performance all influence the next step in the capital stack.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI009
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: profitability-and-cash
  title: Profitability signals and capital adequacy
  body: 'The best financial news in the refresh is the December 2025 profitability milestone and the stronger 2026 capital
    package. Those two facts matter because they reduce near-term distress risk and suggest the company has enough support
    to keep investing in the credit stack and operational tooling. But the signal is still incomplete: one profitable month
    is not the same as durable EBITDA or free cash flow, and the actual cash burn remains invisible to outside readers. The
    read should therefore be “healthier, not solved.” The practical reading is that the market has given Kavak more room to
    execute, but not enough room to ignore discipline. If the company has truly crossed into repeatable profitability, the
    funding mix should become less defensive over time.'
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI012
  tableRefs:
  - TI002
- id: gaps
  title: What remains undisclosed
  body: 'The major blind spots are still the same ones that matter most for model quality: revenue, gross margin, loss rates,
    exact burn, and the precise economics of the lending book. Without those, the company can be assessed for capital adequacy
    and operating direction, but not for public-market-style unit economics. That is acceptable for private-company diligence,
    as long as the report is explicit about the missing pieces instead of pretending the capital story is more complete than
    it is. Until those inputs become public, the report should treat all valuation and capital judgments as directional rather
    than precise, even if the headline numbers now look better than they did in 2025.'
  claimRefs:
  - CI007
  - CI011
  tableRefs:
  - TI003
