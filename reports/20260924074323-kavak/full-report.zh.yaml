chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: Kavak 的核心业务
        blocks:
          - type: paragraph
            body: >-
              理解 Kavak
              最直观的视角，依旧是把它看作一家全栈二手车平台：一手收车，完成质检与整备，自主定价并提供购车金融，交易完成后再以质保和维保服务维系客群。这种模式的价值在于甩开了轻资产的信息撮合逻辑；在二手车交易长期缺乏透明度的市场中，公司主动揽下复杂的重运营环节，挤压欺诈空间，建立交易信任。公司最新公告将自身体系定义为交易平台、信贷、物流与
              AI 自动化工作流的结合体，这也是规模扩张与毛利管控必须并重的原因。2026 年的最新进展进一步串联起 2025 年的盈利节点与新一轮融资，将投资叙事从单纯追求规模转向严格的运营执行。
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO009
