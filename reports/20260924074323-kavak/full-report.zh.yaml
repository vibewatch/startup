      - number: '4.2'
        title: 盈利信号与资本充足度
        blocks:
          - type: paragraph
            body: >-
              本次更新中最亮眼的财务进展，莫过于 2025 年 12 月的盈利里程碑以及 2026
              年更充裕的资本注入。这两项进展压低了近期的财务危机风险，反映出公司手头具备足够的后盾，能够持续投入信贷系统与运营工具。但这一信号尚不完备：单月盈利绝不等于可持续的 EBITDA
              或自由现金流，外部观察者依然无法看清真实的烧钱速度。因而基准判断应定为“体质好转，但未彻底脱险”。实操维度的解读是：市场给予了 Kavak
              更多执行窗口，却绝容不得松懈纪律。如果公司确已步入可持续盈利阶段，其融资结构往后应当愈发摆脱防御色彩。
