      - - 资本依赖
        - 面临以弱势条款再度融资的需求
        - 股权稀释与债务契约压力
        - 2025 年折价轮 + 债务融资
      - - 监管风险敞口
        - 消费者权益或放贷业务监管审查
        - 运营端约束
        - 跨多司法管辖区业务模式
      - - 执行风险
        - 自动化未能改善单位经济效益
        - 复杂度上升却无毛利增益
        - AI / 运营优化仍处早期
