        title: 仍未披露的核心财务盲区
        blocks:
          - type: paragraph
            body: >-
              核心盲点依然关乎建模质量的关键几项：营业收入、毛利率、坏账率、精确烧钱率，以及信贷资产的底层经济效益。缺少这些数据，尽调可以评估其资本充足度与运营方向，却无法按照公开市场的标准审视其单车经济模型。私募尽调允许存在此类缺失，前提是报告必须据实圈出信息缺口，而不是粉饰太平。在这些关键数据公之于众前，即便当前的门面数字比
