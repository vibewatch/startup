      - number: '1.3'
        title: 尚未公开的关键盲区
        blocks:
          - type: paragraph
            body: >-
              最核心的缺失依然是基础运营指标：确切员工人数、精准客户数、公开营业收入、毛利率，以及信贷资产的坏账率。这些空白虽然不至于阻断尽调判断，但确实无法像对待上市公司那样进行严密建模。客观的评估应当是“运营趋于克制，但信息仍不完整”：业务确实展现出真实的体量与走向盈利的路径，然而由于缺乏完整的财务披露，对估值与风险的判断绝不能公式化。相比冗长的大段叙述，梳理清晰的里程碑时间线更有参考价值，因为本次更新的核心依据是几个带有明确日期的转折点，而非密集的产研路线图。
