      - number: '2.2'
        title: 多维测算视角，而非单一 TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据无法支撑出一个绝对精确的 TAM（总可用市场）数字，更合理的测算视角是借助一组替代指标：交易量、贷款渗透率、正规与非正规交易占比，以及该模式能够实现盈利的目标地域。Kavak 自身披露的 2025
              年交易与贷款数据可用作公司规模基准，却不能当作整体市场容量的凭证。恰当的结论在于：行业机遇足够大，值得重点下注，但整体透明度依然不足以转化为财务模型里的确定数字。市场判断只能保持审慎的模糊性：现有证据足以证实机遇客观存在，却不足以在不过度夸大精度的前提下，将其压缩为一个光鲜的单一数字。
