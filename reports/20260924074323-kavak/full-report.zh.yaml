      - number: '3.3'
        title: 对手依然能够施压的薄弱点
        blocks:
          - type: paragraph
            body: >-
              客户体验始终是软肋。公开评价中不乏对价格不透明、保修推诿和售后拖沓的控诉；路透社（Reuters）关于其撤离部分市场的报道亦指出，公司此前在地域扩张上步子迈得过大。对手因而无须全线击溃
              Kavak，只需抓住信任崩塌的缝隙，或者在廉价、轻便的平替方案足以应付的场景中分流客户。护城河确实存在，却无法自动生效。这正是竞争门槛不断推高的原因：一次醒目的服务翻车或价格纠纷，就足以让摩擦力更小的替代方案显得极具吸引力，哪怕后者的长远经济效益更差。
