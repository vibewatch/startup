      - number: '1.2'
        title: 高管团队、资本与股权结构信号
        blocks:
          - type: paragraph
            body: >-
              创始人始终站在台前担任公众形象，这种连贯性让 Kavak 无论是大举扩张、战略收缩还是迈向盈利，都能维持一致的战略叙事。股权信号较一年前也清晰了许多：2026 年 F 轮融资与 2025
              年流血轮反映出两大现实：公司既获得了新资金支持，也面临着估值逻辑的根本转变——投资人不再为 2021
              年式的盲目增长乐观买单，而是按扎实的运营纪律来重新定价。两者叠加，既带来了更具抗风险能力的资产负债表，却也坐实了一个现实：公司仍旧依赖外部注资，且资金来源高度集中在少数几家高确信度机构手中。
