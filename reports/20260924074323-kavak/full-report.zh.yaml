      - number: '2.3'
        title: 规模渗透的驱动因素与制约瓶颈
        blocks:
          - type: paragraph
            body: >-
              业务渗透完全系于三点：信任建立、风控审核与运营落地。当线下充斥着非正规交易、欺诈风险和形同虚设的质保时，买家甘愿为更安全的交易支付溢价。卖家在乎的则是变现速度与成交确定性。约束条件同样清晰：重资本投入、各地差异化监管、宏观经济波动，以及售后服务的交付风险。综合来看，支撑估值的逻辑绝非“市场大所以必胜”，而是“市场极其复杂，唯有经济模型持续改善的强运营者，才能守住高壁垒份额”。这一逻辑也阐明了为何客户体验与车贷质量远比泛泛的品牌知名度更关键：买家最终选中的，永远是那个最能稳稳消除不确定性与交易摩擦的平台。
