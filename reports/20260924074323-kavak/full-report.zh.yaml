  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 界定目标市场
        blocks:
          - type: paragraph
            body: >-
              不应把 Kavak
              简单视作电商交易平台。公司试图将繁杂的二手车交易链路正规化：涵盖收车、质检、整备、信贷、物流、售后及二手转售。对应的市场边界由此既包括二手车本身的交易体量，也涵盖了赋予交易信任感的一揽子配套服务。就尽调实操而言，市场的吸引力恰恰源于其低效，但这同样使得市场空间与转化率假设天然比纯粹的
              SaaS 或消费级 App 更加难以量化。一个切实可行的分析视角是：该市场足够庞大，足以容纳多家赢家，但只有牢牢掌控信任背书、信贷金融与售后服务的玩家，才能吃下交易链条中利润最丰厚的那部分。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
