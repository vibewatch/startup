  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Kavak 的真正对手
        blocks:
          - type: paragraph
            body: >-
              Kavak
              的成败并不取决于某一家具体的同行对手，而是面对一整组替代方案的围剿：线下车商、黑车贩、分类信息网站、纯贷款机构，以及那些成交更快却缺乏信任保障的本土交易平台。全栈一体化模式固然拉高了买卖双方的切换成本，但只要价格、便利度或成交速度占优，这些替代品依然极具吸引力。审视竞争格局必须把现有的灰色产业现状纳入视野，而不能只盯相近的初创公司。核心结论在于：对手根本无须复制
              Kavak 的整套闭环，只要在漏斗的关键环节咬下一块，就能打破价格透明度与信任背书的独占优势。
            claimRefs:
              - CP001
              - CP003
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
      - number: '3.2'
        title: 公司的差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              公司最硬核的差异化在于一体化闭环：质检、整备、定价、信贷与售后支持全包。在充斥着个人私下交易与地下灰产的市场中，这套闭环筑起了信任溢价。差异化唯有转化为更优的单位经济效益才能持久。2025 与 2026
              年的经营里程碑显示，公司正在逼近这一目标，但评估竞争格局仍须深究：公司赢在体验、信贷门槛，还是仅仅靠持续烧钱换取份额？2025-2026
              年的资本重置恰恰印证了这一点：护城河若无法以合理的经济效益变现便毫无意义。如果这套全栈能力真正具备壁垒，就应体现在转化率、贷款渗透率及复购率上，而非止步于品牌声量。
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP012
