  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 股权融资与债务历史
        blocks:
          - type: paragraph
            body: >-
              拆解财务脉络，首先要看公司融了多少钱，以及这些资本的具体形态。对一家嵌入信贷业务的规模化交易平台而言，这种路径并不罕见：早期靠股权资金搭平台，中后期靠成长期股权拓市场，以债权资金垫库存与放贷，随后在资本市场倒逼运营纪律时接受估值重置。核心在于，Kavak
              早已脱离单纯“不惜一切代价求增长”的叙事，演变为依托资产负债表展开的运营反转。这一变化至关重要，因为公司已从单线条的风险投资模式，转入股权、债权与经营现金流共同左右资本结构的混合生态。
            claimRefs:
              - CI001
