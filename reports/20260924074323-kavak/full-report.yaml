  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product stack
        blocks:
          - type: paragraph
            body: >-
              Kavak’s product should be understood as a stack, not a single app. The company needs to do the hard work
              of sourcing vehicles, pricing them, reconditioning them, financing purchases, and supporting the customer
              after the sale. The public materials reinforce that the business is increasingly built around bundled
              workflow modules rather than isolated features. That matters because the product advantage is not just “we
              have a marketplace”; it is “we control the operating chain and can tune the economics end to end.” The key
              diligence question is whether each added module deepens the moat or simply adds another layer of
              operational overhead.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
          - type: figure
