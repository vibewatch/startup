            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: AI and operating automation
        blocks:
          - type: paragraph
            body: >-
              The current refresh shows a stronger AI narrative. A16z says the company has re-architected operations
              around AI and the company itself says AI now serves a majority of customer demand. The right diligence
              read is not that AI is a marketing garnish; it is that automation is being used to compress operational
              load across pricing, customer handling, and internal workflows. That can be a real moat if it increases
              throughput and consistency, but it also raises the bar for execution because the system becomes more
              complex when it succeeds. If the automation stack keeps reducing cost-to-serve, the company can keep
              widening the gap between a software-assisted operation and a manual dealership workflow.
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE007
              - CE011
      - number: '5.3'
        title: Quality control and remaining questions
        blocks:
          - type: paragraph
            body: >-
              The quality-control story is credible but not fully transparent. Hiring material and customer-facing
              content point to a detailed inspection process, coverage, and a short return window, but public complaints
              show that after-sales problems still happen. That leaves a classic trade-off: the company is trying to
              formalize trust in a messy market, and the more it promises, the more it has to operationalize. The
              remaining question is whether the product keeps improving the customer experience fast enough to justify
              the complexity. The unresolved question is not whether the company has tools, but whether those tools are
              enough to keep quality and support ahead of growth.
            claimRefs:
              - CE006
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE006
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the customer really is
        blocks:
          - type: paragraph
            body: >-
              The most compelling customer story is first-time car ownership. Kavak’s own 2026 release says more than
              40% of buyers are first-time buyers, which is exactly the kind of signal that helps a marketplace justify
              its value proposition beyond simple price comparison. The customer base also includes sellers and partner
              ecosystem users, because the platform is not just a retail storefront; it is a transaction engine that
              touches liquidity, financing, and service. That breadth matters because it reduces the risk that the
              company is dependent on a single customer persona. The mix matters because first-time buyers are the
              clearest proof that the trust proposition is working, while sellers and partners prove the platform is not
              only a consumer app.
            claimRefs:
              - CU001
              - CU004
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Trust, conversion, and support
        blocks:
          - type: paragraph
            body: >-
              Kavak’s customer pitch is not “cheap cars”; it is “lower risk car ownership.” The financing launch
              material says 7 out of 10 Meses applications are pre-approved and that more than 1,000 customers had
              already used Préstamo, both of which suggest a meaningful conversion funnel. The trust layer is reinforced
              by inspection and coverage claims, but the platform still has to deliver when something goes wrong. That
              is why customer conversion and customer support should be read together, not separately. The financing
              numbers are particularly important because they show the platform can help convert intent into completed
              sales, not just generate web traffic or app installs.
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
      - number: '6.3'
        title: What public reviews say
        blocks:
          - type: paragraph
            body: >-
              Trustpilot shows the downside very plainly: complaints about warranties, refunds, price changes, and
              after-sales delays. Those are the exact moments where a customer decides whether the platform is a trust
              premium or just another dealership with a nicer website. Reuters’ reporting on geographic exits also
              suggests that customer demand can be outpaced by operating complexity. The customer view is therefore
              mixed: strong on first-time access and financing, weaker on service consistency and escalation handling.
              The customer chapter therefore has to hold two ideas at once: the product solves a real pain point, and
              the service layer can still fail in ways that matter to the brand.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operating and service risk
        blocks:
          - type: paragraph
            body: >-
              The biggest practical risk is not that the business model is unknowable; it is that the model is hard.
              Every step in the used-car stack introduces room for error: inspection misses, pricing mistakes, warranty
              claims, credit mistakes, or poor issue resolution. Public complaints show that customers still sometimes
              experience that friction. In other words, the moat is inseparable from operations, which means execution
              quality is not a side issue. It is the business. Because the company also promises a better after-sales
              experience than the market norm, every quality miss has an outsized reputational effect relative to a
              simpler classifieds model. The product promise is strong precisely because customers can see the risk
              reduction, which means any service miss becomes highly visible and can travel quickly through word of
              mouth.
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR012
      - number: '7.2'
        title: Credit and balance-sheet risk
        blocks:
          - type: paragraph
            body: >-
              Kavak’s finance business is a strength only if credit quality remains controlled. The company is using
              financing to drive conversion and deepen monetization, but the public evidence does not reveal the default
              curve or underwriting loss profile. That is the single most important missing risk metric. The positive
              side is that the company appears better capitalized than a year ago; the negative side is that this
              remains a balance-sheet-heavy business in a cyclically exposed category. That makes the loan book and the
              funding stack intertwined: if underwriting softens or debt becomes more expensive, the operating model can
              feel the pressure quickly. The absence of a public loss-rate series means outside readers have to infer
              quality from financing growth and the company’s willingness to keep supporting the book, which is a far
              weaker signal than a disclosure-backed model. The 2026 Series F and other market trackers point in the
              same direction: fresh capital exists, but it does not erase the need to watch funding terms and credit
              performance closely.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
      - number: '7.3'
        title: Geography, governance, and valuation risk
        blocks:
          - type: paragraph
            body: >-
              The 2023 Peru/Colombia exit proves that expansion discipline matters. The 2025 valuation reset and 2026
              financing also show that governance and capital allocation now matter more than bragging rights about
              rapid market entry. If Kavak grows too quickly into markets where the service model does not scale, the
              losses show up in both customer experience and equity dilution. The right response is not to stop
              expanding forever; it is to ensure that every market must earn its right to scale. The right mitigation is
              selective expansion with clear hurdle rates, not blanket caution, because the model still has room to
              create value if each market earns its right to scale. The valuation reset is therefore not a surprise in
              context; it is the market forcing a slower and more disciplined path to prove that the model can scale
              without heroic assumptions. A separate market readout on the 2025 financing round and public comp signals
              underscore that the reset was real, not just rhetorical, and that investors were pricing in the risk of
              slower but more durable growth.
            claimRefs:
              - CR003
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation history and reset
        blocks:
          - type: paragraph
            body: >-
              The valuation history is the core of the refresh. Kavak spent years at venture-style premium valuations
              and then re-priced down to roughly USD 2.2 billion in 2025, which was painful but also honest about the
              company’s execution reality. The 2026 round matters because it shows the market still sees value in the
              model, but at a valuation that is much closer to the current operating story. In other words, the business
              is no longer priced as a hyper-growth fantasy; it is priced as a complicated but increasingly disciplined
              operator. The turn from peak valuation to reset is important because it resets the burden of proof: future
              upside must come from execution, not multiple expansion alone.
            claimRefs:
              - CV001
              - CV002
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
      - number: '8.2'
        title: 'Current stance: fair, not cheap'
        blocks:
          - type: paragraph
            body: >-
              The right stance is not “cheap” simply because the number is lower than the 2021 peak. The business is
              still private, still opaque on revenue and gross margin, and still exposed to credit and service
              execution. At the same time, the company is now showing profitability and is still attracting capital from
              high-quality investors. That combination supports a fair-value posture: the reset appears to have removed
              some of the bubble premium, but it has not yet made the business so transparent that the valuation case
              becomes purely mechanical. That makes the present case investable, but not frictionless, because public
              visibility is still too thin to treat the mark as fully de-risked.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV012
      - number: '8.3'
        title: What still blocks precision
        blocks:
          - type: paragraph
            body: >-
              The biggest missing inputs are still the same: revenue, gross margin, credit losses, and a verifiable exit
              path. Without them, any valuation work is a scenario exercise rather than a true discounted cash-flow
              model. The practical answer is to keep the case in the track bucket and ask for more proof that
              profitability is durable. If the company can sustain the current capital structure and the credit business
              continues scaling, upside remains. If not, the reset could still have been too early. In practice, that
              means valuation should be framed as a range of outcomes tied to discipline, not as a single precise number
              that the evidence cannot support.
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV011
