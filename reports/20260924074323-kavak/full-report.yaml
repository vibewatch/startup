  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Defining the market
        blocks:
          - type: paragraph
            body: >-
              Kavak should not be framed as a simple e-commerce marketplace. The company is trying to formalize a
              multi-step used-car transaction stack: sourcing, inspection, reconditioning, financing, logistics,
              customer support, and resale. That means the relevant market boundary includes the underlying used-vehicle
              transactions plus the services that make those transactions trustworthy. In practical diligence terms, the
              market is attractive precisely because it is inefficient, but that also means market size and conversion
              assumptions are inherently squishier than in a pure SaaS or consumer-app model. A useful diligence lens is
              that this market is large enough to support multiple winners, but only the operator that controls trust,
              financing, and service can capture the highest-value slice of the transaction stack.
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >-
              The public evidence does not support a single clean TAM number, so the better lens is a set of proxies:
              transaction volume, attach rates for financing, share of formal versus informal sales, and the addressable
              geography where the model can be operated profitably. Kavak’s own 2025 transaction and financing
              disclosures are useful as a company-scale benchmark, but they are not a market-size proof. The right
              conclusion is that the opportunity is large enough to matter, while still too opaque to convert into a
              precise spreadsheet certainty. That means the market answer is deliberately approximate: enough evidence
              exists to prove the opportunity is real, but not enough to collapse the space into one polished number
              without overclaiming precision.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption hinges on trust, underwriting, and operational execution. Buyers are willing to pay for a safer
              transaction when the alternative is a largely informal market with fraud risk and a weak warranty
              experience. Sellers care about liquidity and certainty of closing. The constraint set is equally clear:
              capital intensity, geography-specific regulation, macro volatility, and execution risk in post-sale
              service. That combination means the valuation case is not “large market therefore winner,” but “complex
              market where a strong operator can create defensible share if it keeps improving economics.” The same
              logic explains why customer experience and financing quality matter more than generic brand awareness: the
              buyer chooses the platform that most reliably reduces uncertainty and friction.
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: What Kavak is really competing with
        blocks:
          - type: paragraph
            body: >-
              Kavak does not win or lose against a single named rival. It competes against a bundle of substitutes:
              offline dealerships, informal brokers, classifieds, finance-first lenders, and local marketplaces that can
              transact faster but offer less trust. That matters because the company’s integrated model raises switching
              costs for buyers and sellers, yet the substitutes are still attractive when price, convenience, or speed
              wins. The competition frame therefore has to be broad enough to include the status quo, not just adjacent
              startups. The key takeaway is that competitors do not need to match Kavak’s entire stack; they only need
              to win enough of the funnel to keep price discovery and trust from becoming exclusive advantages.
            claimRefs:
              - CP001
              - CP003
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
      - number: '3.2'
        title: Where the company is different
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is the combined stack: inspection, reconditioning, pricing, financing, and
              after-sales support. In a market that still contains a lot of private-party and informal activity, that
              stack creates a trust premium. But differentiation is only durable if it produces better economics. The
              2025 and 2026 milestones suggest the company is getting there, yet the competitor view still needs to ask
              whether the company is winning on experience, on financing access, or simply on willingness to spend
              capital to hold share. The 2025-2026 capital reset matters here because moat quality only matters if the
              business can monetise it at acceptable economics. If the stack is truly differentiated, it should show up
              in conversion, financing attach, and repeat usage rather than only in brand perception.
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
      - number: '3.3'
        title: How competitors can still pressure the model
        blocks:
          - type: paragraph
            body: >-
              Customer experience remains the soft spot. Public reviews show complaints about pricing transparency,
              warranty handling, and after-sales service; Reuters’ reporting on market exits shows that the company can
              also overreach geographically. That means competitors do not need to beat Kavak everywhere. They only need
              to win the moments where trust breaks down or where a cheaper, simpler alternative is good enough. The
              moat is real, but it is not self-executing. This is why the competitive bar keeps rising: a single visible
              service failure or pricing complaint can make a low-friction substitute look attractive even when the
              long-term economics are worse.
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding and debt history
        blocks:
          - type: paragraph
            body: >-
              The financial story starts with how much capital the company has been able to raise and the shape that
              capital has taken. The pattern is not unusual for a scaled marketplace with embedded credit: early equity
              to build the platform, late-stage equity to support expansion, debt to support inventory and lending, and
              then a reset when the market demanded more discipline. The important point is that Kavak is no longer a
              simple growth-at-all-costs story; it is a balance-sheet story with an attached operating turnaround. That
              matters because the company has moved from a simple venture-financing pattern into a hybrid structure
              where equity, debt, and operating cash performance all influence the next step in the capital stack.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
