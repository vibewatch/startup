      - number: '4.2'
        title: Profitability signals and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The best financial news in the refresh is the December 2025 profitability milestone and the stronger 2026
              capital package. Those two facts matter because they reduce near-term distress risk and suggest the
              company has enough support to keep investing in the credit stack and operational tooling. But the signal
              is still incomplete: one profitable month is not the same as durable EBITDA or free cash flow, and the
              actual cash burn remains invisible to outside readers. The read should therefore be “healthier, not
              solved.” The practical reading is that the market has given Kavak more room to execute, but not enough
              room to ignore discipline. If the company has truly crossed into repeatable profitability, the funding mix
              should become less defensive over time.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
      - number: '4.3'
        title: What remains undisclosed
        blocks:
          - type: paragraph
            body: >-
              The major blind spots are still the same ones that matter most for model quality: revenue, gross margin,
              loss rates, exact burn, and the precise economics of the lending book. Without those, the company can be
              assessed for capital adequacy and operating direction, but not for public-market-style unit economics.
              That is acceptable for private-company diligence, as long as the report is explicit about the missing
              pieces instead of pretending the capital story is more complete than it is. Until those inputs become
              public, the report should treat all valuation and capital judgments as directional rather than precise,
              even if the headline numbers now look better than they did in 2025.
            claimRefs:
