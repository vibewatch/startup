company:
  name: Kavak
chapter:
  number: 5
  title: Product & Technology
  summary: 'Kavak’s product is broader than a marketplace: it is an operational system for inspection, reconditioning, pricing,
    financing, coverage, and post-sale support. The refresh shows a company leaning harder into AI and workflow automation,
    but the tech story still has to prove that automation improves unit economics rather than just speeding up complexity.'
sections:
- id: product-stack
  title: The product stack
  body: Kavak’s product should be understood as a stack, not a single app. The company needs to do the hard work of sourcing
    vehicles, pricing them, reconditioning them, financing purchases, and supporting the customer after the sale. The public
    materials reinforce that the business is increasingly built around bundled workflow modules rather than isolated features.
    That matters because the product advantage is not just “we have a marketplace”; it is “we control the operating chain
    and can tune the economics end to end.” The key diligence question is whether each added module deepens the moat or simply
    adds another layer of operational overhead.
  claimRefs:
  - CE001
  - CE004
  - CE005
  - CE012
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: automation
  title: AI and operating automation
  body: The current refresh shows a stronger AI narrative. A16z says the company has re-architected operations around AI and
    the company itself says AI now serves a majority of customer demand. The right diligence read is not that AI is a marketing
    garnish; it is that automation is being used to compress operational load across pricing, customer handling, and internal
    workflows. That can be a real moat if it increases throughput and consistency, but it also raises the bar for execution
    because the system becomes more complex when it succeeds. If the automation stack keeps reducing cost-to-serve, the company
    can keep widening the gap between a software-assisted operation and a manual dealership workflow.
  claimRefs:
  - CE002
  - CE003
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE002
- id: quality-and-open-questions
  title: Quality control and remaining questions
  body: 'The quality-control story is credible but not fully transparent. Hiring material and customer-facing content point
    to a detailed inspection process, coverage, and a short return window, but public complaints show that after-sales problems
    still happen. That leaves a classic trade-off: the company is trying to formalize trust in a messy market, and the more
    it promises, the more it has to operationalize. The remaining question is whether the product keeps improving the customer
    experience fast enough to justify the complexity. The unresolved question is not whether the company has tools, but whether
    those tools are enough to keep quality and support ahead of growth.'
  claimRefs:
  - CE006
  - CE010
  - CE011
  tableRefs:
  - TE003
