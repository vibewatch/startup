- id: TE003
  title: Technology / operating architecture table
  columns:
  - quality signal
  - public evidence
  - benefit
  - watch-out
  rows:
  - - 240-point inspection
    - Hiring material
    - Standardizes input quality
    - Inspection can still miss defects
  - - 3-month test period
    - Hiring material
    - Reduces buyer fear
    - Creates after-sales cost if failures happen
  - - 5% post-sale service rate
    - Company release
    - Suggests improving quality
    - Still non-trivial in absolute terms
  - - 1.5% return/exchange rate
    - Company release
    - Trust signal
    - Can move if product quality slips
  - - Autonoma incident detection
    - Case study
    - Operational monitoring
    - Does not eliminate root-cause quality issues
  notes: The table is intentionally a mixed quality dashboard that combines company claims, hiring signals, and third-party
    evidence.
