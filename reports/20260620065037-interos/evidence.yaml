evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Reconciled cap table showing total equity raised, debt instruments, and ownership percentages by investor
    whyItMatters: >-
      Reported total funding ranges from $224M (Tracxn) to $310M (Technical.ly) – a $86M gap that materially affects any
      valuation or acquisition analysis
    diligencePath: Request data room cap table, convertible note register, and debt instrument schedules from company counsel
    relatedQuestionRefs:
      - QO006
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Post-2021 formal valuation assessment or primary-source post-money valuation from the 2024 Blue Owl round
    whyItMatters: >-
      Unicorn status rests on a 2021 price discovery event; no third party has confirmed $1B+ valuation in 2024 or 2026
      based on current financials
    diligencePath: Request Blue Owl Capital term sheet and any 409A or independent valuation studies from the 2024-2026 period
    relatedQuestionRefs:
      - QO015
  - type: access-blocked
    severity: minor
    topic: adverse
    missingEvidence: Direct access to Glassdoor and other employee review platforms to verify scope and recency of layoff complaints
    whyItMatters: >-
      Employee count compression from peak to ~150 workers is consistent with restructuring; independent verification of
      layoff scope would contextualize organizational health
    diligencePath: >-
      Request workforce headcount history from HR function; cross-reference LinkedIn employee count trend; conduct
      reference interviews with former employees
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: >-
      Consistent customer count methodology distinguishing direct enterprise/government accounts from
      channel/partner-sourced users
    whyItMatters: >-
      100 vs 500 customer figure conflict cannot be resolved without definitions; customer quality, ACV, and churn
      cannot be estimated without this clarity
    diligencePath: >-
      Request ARR breakdown by customer count tier, channel vs direct split, and definition of active customer from
      company
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Historical headcount trend with dates showing peak employee count and timing of any reductions
    whyItMatters: >-
      Current ~150 headcount is lean for a company with $290-310M raised; understanding the trajectory requires peak and
      trough figures
    diligencePath: Cross-reference LinkedIn employee count snapshots with Tracxn time series; request HR headcount trend directly
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: founding
    missingEvidence: >-
      Primary incorporation document or official record confirming 2005 founding date and distinguishing original entity
      from current Interos Inc. operating company
    whyItMatters: >-
      2005 vs 2017 founding date discrepancy affects assessments of company longevity, management tenure, and
      profitability timeline
    diligencePath: >-
      Request Virginia corporation records for INTEROS SOLUTIONS, INC. and current Interos Inc. entity; verify Delaware
      or Virginia incorporation dates
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: blocking
    topic: market-sizing
    missingEvidence: >-
      Interos' serviceable obtainable market (SOM), internal pipeline conversion rates, win/loss ratios, and average
      contract value by segment are required to model realistic revenue potential.
    whyItMatters: >-
      Without SOM data, TAM-to-revenue modeling rests entirely on external analyst estimates that measure a broader and
      less relevant market scope than Interos' actual competitive focus.
    diligencePath: >-
      Request data room access to pipeline by segment (federal vs. commercial), historical win rates, and average deal
      size by contract vehicle; cross-check against public GSA contract ceiling.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: federal-market
    missingEvidence: >-
      Publicly disclosed total obligated spend under Interos' GSA government-wide contract and annual agency-by-agency
      budget allocations for SCRM platforms across the federal civilian and DoD sectors.
    whyItMatters: >-
      Federal revenue is Interos' most validated segment, but without budget-level data it is impossible to assess
      whether federal spend is growing, stable, or subject to continuing resolution constraints that could limit organic
      growth.
    diligencePath: >-
      Search USASpending.gov for Interos contract awards; request Carahsoft task order data; review Congressional
      appropriations committee reports for SCRM budget line items.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Reconciled market sizing methodology from both Mordor Intelligence and MarketsAndMarkets that would allow the two
      estimates to be aligned on a common scope definition.
    whyItMatters: >-
      The gap between SCRM-specific ($5.12B) and ERM-inclusive ($6.0B) estimates makes it impossible to select a
      defensible anchor TAM without primary analyst interviews; using either figure without adjustment risks over- or
      under-stating the opportunity.
    diligencePath: >-
      Commission a primary analyst call with Gartner or IDC to obtain a scope-consistent SCRM market sizing;
      alternatively, build a bottom-up estimate from published company revenues of the top 10 SCRM vendors.
    relatedQuestionRefs:
      - QM009
      - QM025
  - type: stale
    severity: material
    topic: regulatory-drivers
    missingEvidence: >-
      Current EU CSDDD enforcement timeline and status, including any phase-in delays announced since the directive's
      adoption.
    whyItMatters: >-
      EU CSDDD is cited as a long-term demand driver, but the directive has been subject to repeated implementation
      delays; the actual enforcement start date materially affects the timing of European demand for supply chain
      traceability tools.
    diligencePath: >-
      Review the European Commission's CSDDD implementation tracker; check for any Council or Parliament announcements
      regarding phase-in schedule as of June 2026.
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A complete competitive landscape map including Exiger, Sayari Analytics, Prewave, and other AI-native SCRI
      platforms with market share and differentiation data.
    whyItMatters: >-
      Without a full competitive map it is difficult to assess how much of the 65% non-incumbent SCRM market is
      genuinely contestable by Interos versus already captured by other specialists.
    diligencePath: >-
      Chapter 4 (Competitive Landscape) should address this; coordinate with chapter author to ensure TM001's "included"
      segment is cross-referenced against Chapter 4 competitor table.
  - type: private-evidence-only
    severity: material
