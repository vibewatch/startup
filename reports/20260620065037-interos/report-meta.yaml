companyProfile:
  summary: Interos Inc. is a private Arlington, Virginia-based software company that sells AI-powered supply chain risk intelligence to enterprises and government agencies. Its core product is a multi-tier knowledge graph that maps more than 400 million entities and 11 billion-plus relationships to monitor cyber, financial, geopolitical, regulatory, ESG, and catastrophic risk across supplier networks. The company reached unicorn status in its 2021 Series C, added Blue Owl growth capital in 2024, and has become notable for government traction with the U.S. Navy, NASA, and a government-wide GSA vehicle, but it still discloses limited financial data and has not set a new public equity valuation since 2021.
  foundedDate: '2005-01-01'
  founders:
    - name: Jennifer Bisceglie
      role: Founder; former CEO; Executive Vice Chair
      background: Former Manhattan Associates executive focused on government-market supply chain solutions before building Interos.
      claimRefs: [CO002, CO030, CO033]
  foundingLocation: Arlington, Virginia, USA
  headquarters: Arlington, Virginia, USA
  productSummary: Subscription software platform for supply chain mapping, third-party risk intelligence, cyber resilience, and predictive disruption monitoring built on a large proprietary supplier-relationship graph.
  customerFocus: Fortune 1000 enterprises, defense and civilian federal agencies, and other procurement-heavy organizations with multi-tier supply chain exposure.
  businessModel: Enterprise SaaS subscriptions with implementation and support services, sold directly and through partners such as Carahsoft and SAP Ariba ecosystem channels.
  stage: Late-Stage Private
  fundingStatus: Series C $100M at $1B+ valuation in 2021; $40M Blue Owl growth capital in 2024; no new priced equity round publicly disclosed since.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO014, CO024, CO026, CO031]
summary:
  headline: Interos has real strategic value in government-grade supply chain risk intelligence, but stale 2021 unicorn pricing, credit-led financing, and limited financial disclosure keep it in research-more territory.
