callouts:
  - calloutType: strength
    title: Regulatory mandates create durable federal pull
    body: >-
      UFLPA enforcement, CMMC Phase 1 (November 2025), CISA C-SCRM guidance, and EO 14017/14028 create
      non-discretionary compliance requirements that drive federal and defense industrial base procurement
      independent of macro budget cycles. Interos' government-wide GSA contract and Navy enterprise SCRM
      win validate its positioning in this segment. Federal demand is structurally resilient in ways
      commercial enterprise demand is not.
    claimRefs:
      - CM017
      - CM019
      - CM020
      - CM023

  - calloutType: risk
    title: ERP bundling and SAP partnership present dual threat and dependency
    body: >-
      SAP Ariba's Supplier Risk module — which now features an Interos integration — creates both a
      distribution channel and a substitution risk. If SAP expands native AI supply chain intelligence,
      Interos could be displaced from its own integration partner's platform. The ERP incumbent threat
      is the primary structural constraint on commercial enterprise SCRM adoption, with 3–9 month
      integration timelines further delaying time-to-value versus incumbents.
    claimRefs:
      - CM005
      - CM038
      - CM041

  - calloutType: insight
    title: SCRM market TAM estimates should be treated as reference points, not anchors
