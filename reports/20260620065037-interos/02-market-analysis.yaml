  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: market-sizing
      missingEvidence: >-
        Interos' serviceable obtainable market (SOM), internal pipeline conversion rates, win/loss
        ratios, and average contract value by segment are required to model realistic revenue potential.
      whyItMatters: >-
        Without SOM data, TAM-to-revenue modeling rests entirely on external analyst estimates that
        measure a broader and less relevant market scope than Interos' actual competitive focus.
      diligencePath: >-
        Request data room access to pipeline by segment (federal vs. commercial), historical win rates,
        and average deal size by contract vehicle; cross-check against public GSA contract ceiling.
      relatedQuestionRefs: [QM024]

    - type: private-evidence-only
      severity: material
      topic: federal-market
      missingEvidence: >-
        Publicly disclosed total obligated spend under Interos' GSA government-wide contract and
        annual agency-by-agency budget allocations for SCRM platforms across the federal civilian
        and DoD sectors.
      whyItMatters: >-
        Federal revenue is Interos' most validated segment, but without budget-level data it is
        impossible to assess whether federal spend is growing, stable, or subject to continuing
        resolution constraints that could limit organic growth.
      diligencePath: >-
        Search USASpending.gov for Interos contract awards; request Carahsoft task order data;
        review Congressional appropriations committee reports for SCRM budget line items.
      relatedQuestionRefs: [QM007]

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Reconciled market sizing methodology from both Mordor Intelligence and MarketsAndMarkets
        that would allow the two estimates to be aligned on a common scope definition.
      whyItMatters: >-
        The gap between SCRM-specific ($5.12B) and ERM-inclusive ($6.0B) estimates makes it
        impossible to select a defensible anchor TAM without primary analyst interviews; using
        either figure without adjustment risks over- or under-stating the opportunity.
      diligencePath: >-
        Commission a primary analyst call with Gartner or IDC to obtain a scope-consistent SCRM
        market sizing; alternatively, build a bottom-up estimate from published company revenues
        of the top 10 SCRM vendors.
      relatedQuestionRefs: [QM009, QM025]

    - type: stale
      severity: material
      topic: regulatory-drivers
      missingEvidence: >-
        Current EU CSDDD enforcement timeline and status, including any phase-in delays announced
        since the directive's adoption.
      whyItMatters: >-
        EU CSDDD is cited as a long-term demand driver, but the directive has been subject to
        repeated implementation delays; the actual enforcement start date materially affects the
        timing of European demand for supply chain traceability tools.
      diligencePath: >-
        Review the European Commission's CSDDD implementation tracker; check for any Council or
        Parliament announcements regarding phase-in schedule as of June 2026.

    - type: enumeration-incomplete
      severity: minor
      topic: competitive-landscape
      missingEvidence: >-
        A complete competitive landscape map including Exiger, Sayari Analytics, Prewave, and
        other AI-native SCRI platforms with market share and differentiation data.
      whyItMatters: >-
        Without a full competitive map it is difficult to assess how much of the 65% non-incumbent
        SCRM market is genuinely contestable by Interos versus already captured by other specialists.
      diligencePath: >-
        Chapter 4 (Competitive Landscape) should address this; coordinate with chapter author to
        ensure TM001's "included" segment is cross-referenced against Chapter 4 competitor table.
