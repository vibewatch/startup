  topStrengths:
    - >-
      Government traction is unusually strong for a company of this scale, including the U.S. Navy, NASA, and a
      five-year GSA-wide SCRM contract vehicle.
    - >-
      The product is differentiated by a large multi-tier supplier graph spanning 400M+ entities and 11B+ relationships
      across multiple risk vectors.
    - >-
      Regulatory and geopolitical tailwinds are increasing demand for supply chain visibility, cyber resilience, and
      third-party risk monitoring.
    - >-
      The platform has added credible ecosystem distribution and workflow hooks through SAP Ariba, Carahsoft, and
      strategic investors including Coupa and ServiceNow.
  topRisks:
    - >-
      The last disclosed priced equity round was in 2021; subsequent Blue Owl financing looks credit-like and does not
      validate the old unicorn mark.
    - >-
      Public financial disclosure is thin: ARR, margins, burn, and NRR remain unaudited or undisclosed, limiting
      confidence in intrinsic-value modeling.
    - >-
      Government and channel concentration risk is meaningful, with Carahsoft the only clearly verified federal
      distributor and public-sector demand sensitive to budget cycles.
    - >-
      The 2024 founder-to-operator leadership transition created execution risk across sales, product, and customer
      continuity during a key scaling period.
    - >-
      Product complexity and data-quality verification at deeper supplier tiers may slow adoption or reduce trust versus
      simpler incumbent alternatives.
  unresolvedGaps:
    - >-
      Audited ARR, revenue, gross margin, burn, and NRR disclosures are needed to narrow the valuation range and assess
      SaaS quality.
    - >-
      Blue Owl facility terms, covenants, any warrants, and whether the remaining 2024 offering balance was drawn remain
      undisclosed.
    - >-
      Government-versus-commercial revenue mix and customer concentration are not public, limiting analysis of renewal
      and procurement risk.
    - >-
      The apparent 2005 versus 2017 founding-date discrepancy and the gap between reported total-raised figures need
      management reconciliation.
    - >-
      There is no disclosed new equity valuation after 2021, so any current mark remains model-based rather than
      price-discovered.
