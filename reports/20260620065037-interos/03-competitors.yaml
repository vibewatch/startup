  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-share
      missingEvidence: "Published SCRM market-share data by ARR or bookings across Interos, Resilinc, Exiger, and Altana; private company revenue figures."
      whyItMatters: "Without market-share data it is not possible to size Interos' competitive position or assess the risk of being displaced by a better-funded rival."
      diligencePath: "Commission analyst firm (Gartner, IDC, or Forrester) to produce SCRM market-sizing; obtain NDA financials from each competitor in a potential M&A process."
      relatedQuestionRefs: [QP010]

    - type: private-evidence-only
      severity: material
      topic: risk-coverage
      missingEvidence: "Independent third-party audit or benchmark comparing Interos' 150+ risk categories vs Prewave's 200+ categories for coverage quality, freshness, and false-positive rate."
      whyItMatters: "Vendor-claimed risk category counts are not standardized; the comparison between Interos and Prewave may overstate or understate actual coverage differentiation."
      diligencePath: "Commission a structured POC with both platforms using the same supplier set to evaluate coverage accuracy and alert quality."
      relatedQuestionRefs: [QP009]

    - type: missing-source
      severity: material
      topic: competitive-alternatives
      missingEvidence: "Primary evidence of enterprise buyer selection decisions where Resilinc, Exiger, or Altana explicitly won over Interos, including win-rate data or buyer testimony."
      whyItMatters: "Without confirmed loss evidence, the competitive risk profile is inferred from positioning and product gaps rather than observed buying behavior."
      diligencePath: "Request Interos win-loss analysis; interview 5–10 enterprise buyers who evaluated Interos and selected a competitor."
      relatedQuestionRefs: [QP019]

    - type: stale
      severity: minor
      topic: iQ-launch
      missingEvidence: "Post-launch buyer adoption evidence for Interos' April 2026 iQ C-level AI briefing product; pipeline impact on competitive win rates."
      whyItMatters: "The iQ launch repositions Interos in the executive-dashboard battleground against Resilinc's agentic AI, but without adoption data its competitive impact cannot be assessed."
      diligencePath: "Obtain iQ adoption metrics from Interos management (active users, accounts enabled, NPS); survey 3–5 existing customers on iQ engagement."
      relatedQuestionRefs: [QP025]

    - type: private-evidence-only
      severity: material
      topic: government-contracts
      missingEvidence: "Complete list of Interos' active federal agency accounts, contract values, and renewal status; comparable Exiger federal agency account detail."
      whyItMatters: "Without renewal and account-depth data, it is difficult to assess whether the GSA contract translates into deep agency penetration or thin initial deployments."
      diligencePath: "Request detailed government customer list and CLIN-level contract value from Interos; cross-reference with USASpending.gov for award history."

    - type: enumeration-incomplete
      severity: minor
