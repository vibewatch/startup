sections:
  - id: market-structure-and-categories
    title: "Competitive Landscape and Market Structure"
    body: |
      Interos competes across three overlapping competitive arenas: (1) dedicated supply chain risk intelligence (SCRI) platforms, where Altana Technologies, Resilinc, Exiger, and Everstream Analytics are the closest rivals; (2) cyber-risk and third-party risk management (TPRM), where Bitsight (now a Moody's subsidiary) and SecurityScorecard overlap in shared-buyer accounts; and (3) procurement-embedded risk modules, where Coupa and SAP Ariba address risk from inside the spend-management workflow.

      Interos' knowledge graph—spanning 200 million-plus entities across 11 billion-plus relationships—is the technical centerpiece of its competitive positioning. iTracing provides multi-tier supplier network mapping; iReputation monitors more than 150 risk categories simultaneously across financial, geopolitical, cyber, and ESG dimensions; iTariffs adds real-time tariff exposure modeling. No single rival spans all these vectors in one platform as of the research date.

      On the government channel, Interos holds a five-year GSA government-wide SCRM contract (June 2024) covering all DoD and civilian agencies and an enterprise-wide US Navy contract (April 2023). Exiger is the only named competitor with a comparably deep federal footprint (FedRAMP Moderate authorization, 60-plus federal agencies). Altana has a confirmed US Customs and Border Protection relationship, while Resilinc and Prewave are primarily commercial. This bifurcation—commercial SCRM leaders vs. government-authorized platforms—is the primary segmentation axis in the competitive landscape.

      The absence of a confirmed Gartner Magic Quadrant or Forrester Wave placement for Interos, at a time when Resilinc holds the MQ Leader position (2026), represents an analyst-visibility gap that enterprise buyers driven by Gartner recommendations may notice during shortlisting.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: direct-peers-and-differentiation
    title: "Direct Peers and Capability Differentiation"
    body: |
      Altana Technologies positions as a trade-intelligence platform built on a 600-million-company knowledge graph, with a differentiated US CBP partnership serving more than 5,000 agents for trade enforcement. Altana's product passports map material provenance for forced-labor (UFLPA) and sustainability compliance. Where Interos emphasizes real-time risk monitoring and financial/geopolitical signals, Altana leans toward customs compliance and product-level traceability. The buyer sets partially overlap (global multinationals) but diverge in use case: supply chain risk monitoring versus trade enforcement workflow.

      Resilinc (rebranded resilinc.ai) is Interos' closest head-to-head rival in the SCRM market. Resilinc was named a Gartner Magic Quadrant Leader for SCRM Solutions in 2026 and positions "agentic AI" for automated risk response. Resilinc's data model relies on direct supplier onboarding and community-sourced data, which delivers high accuracy for enrolled suppliers but limited breadth for Tier-2/3 nodes. Interos uses AI-driven discovery to map un-enrolled suppliers at scale, trading some accuracy at the leaf nodes for broader coverage. Resilinc targets automotive, electronics, and medical-device manufacturers; Interos has a stronger government and financial-services overlay.

      Exiger's 1ExigerAI platform ingests 10 billion records and achieved FedRAMP Moderate authorization. Exiger differentiates on sanctions screening, counterintelligence risk, and regulatory compliance workflows. In the government SCRM segment, Exiger is Interos' most credible direct competitive threat, with 60-plus confirmed federal agency relationships. Everstream Analytics focuses on supply chain operational disruption monitoring for procurement and logistics; its public materials are thin, suggesting a narrower product footprint. Prewave monitors 4.5 million data points per day across 200-plus risk categories, with strong ESG coverage, and has received Gartner recognition for SCRM. Prewave is predominantly a European-market competitor, benefiting from CSRD enforcement, and has limited US or government penetration.

      G2 buyer reviews (2022 archive) list Resilinc and Exiger as the primary Interos alternatives; buyer comments cite integration depth and breadth of multi-tier visibility as decision criteria, consistent with the capability comparison in the table below.
    claimRefs: [CP013, CP014, CP015, CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025]
    tableRefs: [TP002]
    figureRefs: [FP002]

  - id: cyber-and-procurement-adjacency
    title: "Cyber Risk and Procurement Adjacency"
    body: |
      Bitsight, acquired by Moody's Corporation for approximately $2.4 billion, and SecurityScorecard (TITAN AI platform, 12 million-plus rated organizations) are cyber-only TPRM vendors. Their buyer overlap with Interos occurs in Chief Information Security Officer and procurement risk workflows. Interos' own cyber-resilience product addresses this overlap directly: it monitors supply-chain-specific cyber risk vectors and positions the platform to compete with cyber TPRM vendors in shared accounts. However, Bitsight's integration into Moody's credit-risk ecosystem creates a risk that enterprise risk management and treasury teams could bundle cyber and financial risk monitoring under Moody's instead of Interos. SecurityScorecard's broad penetration (12M-plus rated organizations) makes it a low-friction entry point for buyers who later expand to supply chain risk use cases.

      On the procurement side, Coupa's supplier risk and performance module embeds TPRM inside the spend-management workflow, competing for buyer budget without requiring a separate procurement cycle. SAP Ariba published an Interos integration in November 2024, explicitly framing the two platforms as complementary—procurement workflow plus AI-driven risk monitoring. This is reinforced by Coupa's own position: Coupa Ventures co-invested in the Interos $100 million Series C, and Interos became a CoupaLink-certified solution, turning a potential competitor into a channel partner. Dataminr's real-time event intelligence is integrated into Interos iReputation, extending signal sourcing beyond Interos' own data corpus.

      The structural implication is that procurement platforms are both partial substitutes (for buyers who want "good enough" risk visibility inside an existing tool) and distribution channels (for buyers who start with procurement and expand to dedicated SCRI). Interos benefits from both dynamics but must defend against procurement-native expansions by Coupa and SAP.
    claimRefs: [CP026, CP027, CP028, CP029, CP030, CP031, CP032]
    tableRefs: [TP003]

  - id: moat-durability-and-win-loss
    title: "Moat Durability and Win/Loss Dynamics"
    body: |
      Interos' most defensible moats are its knowledge graph scale, its government procurement channel, and its Coupa/ServiceNow/SAP distribution ecosystem. The knowledge graph—200 million-plus entities, 11 billion-plus relationships, built over nearly two decades—cannot be replicated quickly by any entrant or acquirer. However, Altana's 600-million-company graph shows that competing graphs are achievable; Interos' edge is the multi-domain coverage (financial, regulatory, geopolitical, cyber simultaneously) rather than raw size alone.

      The GSA five-year contract is a structural moat: it provides a procurement vehicle through which all US DoD and civilian agencies can purchase Interos without a separate RFP. Exiger has FedRAMP Moderate authorization and competes for the same agencies, but the GSA schedule provides a faster path for civilian buyers and lowers procurement friction. The Navy enterprise-wide contract provides a large, renewble anchor account. Government contract renewals and CISA-related spending on supply chain risk are tailwinds.

      Named commercial wins include Google (global SCRM), L3Harris Technologies (enterprise-wide defense SCRM), and the F-35 fighter jet program—reference accounts that are hard to displace and that signal trust for new enterprise buyers. These references support premium pricing and help Interos access RFPs independently of analyst shortlisting.

      The main win/loss risk factors are: (1) Resilinc's Gartner MQ Leader status driving inbound demand for Resilinc in Gartner-influenced procurement processes; (2) Exiger's government penetration crowding Interos on new-agency bids; (3) Bitsight/Moody's bundling displacing Interos in financial-risk buying centers; and (4) pricing sensitivity—Interos' high ACV limits access to the mid-market. The April 2026 iQ product launch (AI-driven C-level supply chain briefing interface) mirrors Resilinc's agentic AI positioning and signals Interos is investing in the executive-dashboard battleground, but independent evidence of buyer adoption is not yet available. Switching costs are meaningful: API integrations, supplier onboarding workflows, and dashboards built on Interos data create re-platforming friction, but a competitor with comparable federal authorization and a lower ACV could erode the mid-enterprise segment.
    claimRefs: [CP033, CP034, CP035, CP036, CP037, CP038, CP039, CP040, CP041, CP042, CP043, CP044, CP045]
    tableRefs: [TP004]
    figureRefs: [FP003]

