callouts:
  - title: "Resilinc's Gartner MQ Leader Status Is the Primary Analyst-Credibility Gap"
    body: "Resilinc holds the 2026 Gartner Magic Quadrant Leader position for SCRM Solutions while Interos has no confirmed placement in the same report. Enterprise buyers who use Gartner for vendor shortlisting will encounter Resilinc before Interos. Interos must either earn MQ recognition or rely on reference-customer proof (Google, Navy, L3Harris) to be included in RFPs driven by analyst scorecards."
    calloutType: risk
    claimRefs: [CP011, CP037]

  - title: "Coupa Ventures Investment Converts a Competitor into a Channel"
    body: "Coupa invested in Interos through its Coupa Ventures fund, completing the $100M Series C, and Interos is CoupaLink-certified. This dual investor-channel relationship reduces the risk of Coupa building a competing native SCRM module and opens Coupa's enterprise spend-management customer base as an inbound pipeline for Interos. SAP Ariba's complementary integration (November 2024) extends the same channel logic to the SAP ecosystem."
    calloutType: strength
    claimRefs: [CP029, CP030]

  - title: "Exiger's Federal Footprint Is Interos' Highest-Urgency Competitive Threat"
    body: "Exiger's FedRAMP Moderate authorization and 60-plus federal agency relationships represent the most structurally credible threat to Interos' government growth engine. Both platforms hold FedRAMP status and compete for DoD and civilian agency budgets. Interos' GSA contract provides a procurement vehicle advantage, but Exiger's existing agency relationships and sanctions-screening differentiation could prevent displacement in accounts where Exiger is already embedded."
    calloutType: risk
    claimRefs: [CP012, CP019]

