  - id: integrations-deployment
    title: Integrations, Deployment Model, and Partner Ecosystem
    body: >-
      Interos positions its platform as a system of record that integrates with the tools customers already
      use. In November 2024, the company deepened its partnership with SAP Ariba, integrating AI-first risk
      intelligence into SAP Ariba Supplier Risk procurement workflows. This allows SAP Ariba customers to
      access supply chain visibility, real-time data, risk-monitoring, and risk-integrated workflows for
      better sourcing, onboarding, purchasing, and supplier management decisions directly within the SAP
      environment. SAP's Senior Director for Product Marketing confirmed the integration "significantly
      enhances the capability to navigate risks in real-time across multiple dimensions" within the
      source-to-pay lifecycle. The SAP Ariba Supplier Risk API is available through the SAP Business
      Accelerator Hub, providing technical integration documentation.

      In April 2022, Interos launched a ServiceNow integration available on the ServiceNow Store, enabling
      joint customers to access sub-tier supply chain risk insights within the ServiceNow Platform with
      automated workflow triggers. The integration enables organizations to identify sub-tier suppliers
      to the Nth tier, gain risk intelligence, and pre-emptively identify areas of concern from within
      their existing ServiceNow environment. The April 2026 iQ launch extended the integration model to
      general ERP systems, matching ERP identifiers with the knowledge graph to enable end-to-end workflow
      execution and dollar-denominated risk quantification. Interos is also listed in the Coupa marketplace.

      For government customers, Carahsoft Technology Corp. serves as the master government aggregator and
      channel partner, distributing the platform through multiple procurement vehicles including GSA Schedule
      No. 47QSWA18D008F, SEWP V contracts NNG15SC03B and NNG15SC27B, ITES-SW2 Contract W52P1J-20-D-0042,
      and NASPO ValuePoint Master Agreement #AR2472. The deployment model for commercial customers is
      standard SaaS subscription with implementation support; government deployments include PEO IWS
      organizational embedding for the Navy contract.
