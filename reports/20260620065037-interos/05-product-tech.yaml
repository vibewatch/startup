  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: platform-architecture
      missingEvidence: >-
        Third-party technical audit of the knowledge graph's data sources, accuracy methodology,
        entity deduplication approach, and refresh cadence; no data-source manifest is publicly disclosed.
      whyItMatters: >-
        The knowledge graph is the platform's central differentiator; its quality, coverage gaps (especially
        in emerging markets), and data sourcing integrity directly determine the reliability of all
        downstream risk intelligence.
      diligencePath: >-
        Request a data-source disclosure document and accuracy/completeness benchmarks from Interos
        during vendor diligence; commission a third-party data quality audit against a known supplier set.
      relatedQuestionRefs: [QE003, QE008, QE011, QE012]

    - type: missing-source
      severity: blocking
      topic: compliance-gap
      missingEvidence: >-
        FedRAMP authorization status, SOC 2 Type II attestation, and FISMA compliance posture for the
        interos.ai cloud platform are not publicly disclosed.
      whyItMatters: >-
        For a company with the Navy, NASA, MDA, HHS, and a GSA government-wide contract, the absence
        of FedRAMP authorization is a material compliance gap; it either limits use to non-sensitive
        federal systems or represents undisclosed risk.
      diligencePath: >-
        Check the official FedRAMP marketplace (fedramp.gov) directly; request FedRAMP ATO or In-Process
        documentation from Interos; ask for SOC 2 Type II report under NDA.
      relatedQuestionRefs: [QE005, QE021, QE022]

    - type: private-evidence-only
      severity: material
      topic: iQ-limitations
      missingEvidence: >-
        General availability timeline for iQ platform and full list of supported ERP connector types
        (SAP S/4HANA, Oracle, Microsoft Dynamics, etc.) have not been publicly disclosed.
      whyItMatters: >-
        iQ is the company's primary growth driver for 2026; if GA is delayed or ERP coverage is narrow,
        the commercial expansion thesis is at risk.
      diligencePath: >-
        Request roadmap documentation and ERP connector specification sheet from Interos; speak to
        existing iQ limited-release customers about implementation experience.
      relatedQuestionRefs: [QE006, QE020]
      relatedTableRefs: [TE001]

    - type: access-blocked
      severity: material
      topic: customer-reviews
      missingEvidence: >-
        G2, PeerSpot, and Gartner Peer Insights customer reviews for interos.ai returned CAPTCHA or
        bot-challenge blocks during research; no verified independent customer sentiment data was
        obtained.
      whyItMatters: >-
        Customer-voice evidence for product satisfaction, NPS, and churn risk is entirely absent from
        public sources; all positive customer proof comes from company-selected references.
      diligencePath: >-
        Access G2 and Gartner Peer Insights with authenticated accounts; request customer reference
        list and conduct reference calls; review any customer case studies independently.
      relatedQuestionRefs: [QE007, QE024]

    - type: missing-source
      severity: minor
      topic: platform-architecture
      missingEvidence: >-
        Implementation onboarding timeline, professional services scope, and typical time-to-value
        metrics for interos.ai enterprise deployments are not publicly disclosed.
      whyItMatters: >-
        Implementation complexity affects total cost of ownership and customer satisfaction; it is
        a key commercial risk factor for enterprise SaaS.
      diligencePath: >-
        Request implementation methodology documentation and typical deployment timelines from Interos;
        speak to systems integrators (e.g., Carahsoft partners) about professional services experience.
      relatedQuestionRefs: [QE020]

