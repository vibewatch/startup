company:
  name: Interos Inc.
chapter:
  number: 7
  title: Risks
  summary: >-
    Interos faces an interlocking set of risks anchored by a 2024 founder-CEO transition that replaced
    the entire C-suite, heavy public-sector revenue concentration routed through a single federal
    channel distributor (Carahsoft), and a financing profile that shifted from traditional venture
    equity to Blue Owl private credit—signaling possible inability to re-raise at the 2021 $1 B+
    unicorn valuation. Regulatory tailwinds from EU CSDDD and U.S. C-SCRM mandates partially offset
    competitive pressure from ERP incumbents and well-capitalized rivals (Resilinc, Altana AI), while
    data-quality and FedRAMP-authorization gaps represent unresolved operational diligence asks.
sections:
  - id: risk-overview
    title: Risk Landscape Overview and Severity Ranking
    body: >-
      Interos operates at the intersection of national security, enterprise procurement, and AI
      regulation—a position that amplifies both opportunity and exposure. The company's risk profile
      is dominated by six interlocking dimensions: (1) leadership and execution risk stemming from
      the April 2024 replacement of founder-CEO Jennifer Bisceglie with Ted Krantz and concurrent
      full C-suite turnover; (2) public-sector concentration and channel dependency, with Carahsoft
      acting as the sole confirmed federal distributor on a government-wide GSA contract; (3)
      competitive and market-multiple compression, with ERP incumbents bundling SCRM modules and
      private company valuations broadly compressed from 2021 peaks; (4) regulatory and legal
      compliance obligations under EU CSDDD, EU AI Act, GDPR, and U.S. NIST C-SCRM mandates; (5)
      data quality and technical reliability risk given unverified coverage claims of 400+ million
      entities; and (6) financial and financing risk from a shift to Blue Owl private credit that
      implies covenant constraints and potential equity dilution pressure.

      The risk heatmap below ranks each dimension by likelihood and impact. Most residual-severity
      scores are medium-to-high, reflecting the early stage of the new leadership team's mitigation
      efforts. No regulatory enforcement actions, IP litigation, or active lawsuits involving Interos
      were identified in public legal databases as of June 2026—this absence of litigation is a
      genuine positive finding and is preserved as such.
