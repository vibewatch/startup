  - id: leadership-execution-risk
    title: Leadership Transition and Execution Risk
    body: >-
      The most acute near-term risk is the 2024 complete leadership overhaul. Jennifer Bisceglie,
      who founded Interos in 2005 and led it for nearly two decades, was replaced as CEO by Ted
      Krantz effective April 16, 2024. Krantz came from data.ai, where he served as CEO, and
      previously held roles at SAP America and other enterprise software firms. Simultaneously,
      Yardley Pohl was installed as Chief Product and Technology Officer (from roles at C3.ai and
      Salesforce) and Chris Lee joined as Chief Revenue Officer. The Christian & Timbers executive
      search case study characterized the situation as a growth-stage transition requiring a
      commercially-oriented CEO to drive the next phase of scale—language consistent with a
      founder-led product company that needed go-to-market acceleration.

      This degree of C-suite change introduces material execution risk: customer relationships
      anchored to the founder, institutional knowledge of the government contract base, and
      cultural continuity are all under pressure. Glassdoor and similar employee review platforms
      returned bot-protection blocks during this research, preventing direct access to employee
      sentiment data—an acknowledged gap. No layoff events involving Interos were found in the
      layoffs.fyi tracker as of June 2026, which is a positive indicator but is also consistent
      with the tracker's incomplete coverage of smaller private companies. The SEC Form D filed
      October 25, 2024 lists Bisceglie as Director and Krantz as Executive Officer, confirming
      both remain formally engaged. The addition of Frank Verdecanna (former Mandiant CFO) to the
      Board provides governance continuity, though board composition cannot substitute for
      operational depth in mid-market federal sales.

      Diligence asks include: direct employee sentiment audit (structured Glassdoor/Blind queries
      or reference interviews), customer relationship mapping to identify accounts primarily owned
      by Bisceglie vs. the new team, and attrition data for the government capture and customer
      success functions.
    claimRefs:
