callouts:
  - calloutType: risk
    title: "Carahsoft Concentration is an Unmitigated Single Point of Failure"
    body: >-
      All confirmed Interos federal revenue flows through Carahsoft Technology Corp., which also
      holds the GSA prime contract through which DoD and civilian agencies procure. This dual
      concentration—one channel partner for one contract vehicle for one customer type—is the
      highest-priority structural risk in the portfolio. Any deterioration in the Carahsoft
      relationship (pricing dispute, exclusivity renegotiation, or Carahsoft's own financial stress)
      would immediately impair Interos' access to its core revenue base. Diligence must confirm
      whether Interos holds direct agency relationships that could survive a Carahsoft disruption.
    claimRefs:
      - CR019
      - CR022

  - calloutType: risk
    title: "Blue Owl Private Credit Signals Valuation Pressure"
    body: >-
      Two private credit transactions with Blue Owl Capital in 24 months ($40M in Oct 2024 and
      $20M in Jan 2026) without a concurrent equity round strongly suggests Interos cannot raise
      equity at its 2021 $1B+ valuation without a visible mark-down. Blue Owl's GP Strategic
      Capital and credit platforms specialize in lending to high-growth software companies that
      prefer to avoid dilutive equity raises—a rational choice for Interos but one that shifts
      financial risk from equity holders to debt covenants and interest obligations. The full
      credit terms remain undisclosed; investors should demand them before proceeding.
    claimRefs:
      - CR038
      - CR039
      - CR040
      - CR043
      - CR044

  - calloutType: insight
    title: "Absence of Litigation is a Genuine Positive, Not a Research Gap"
    body: >-
      A systematic search of U.S. federal court records (CourtListener), patent databases
      (Google Patents), and regulatory enforcement databases found no active or historical
      litigation, IP disputes, or enforcement actions involving Interos Inc. as of June 2026.
      This is preserved as a positive factual finding. The company has operated for approximately
      19 years without material legal exposure—a notable signal for an AI company handling
      sensitive government supply chain data.
    claimRefs:
      - CR030
      - CR031

  - calloutType: recommendation
    title: "Priority Diligence Asks Before Proceeding"
    body: >-
      Five diligence asks are required before the risk chapter can move from 'medium-high' to
      'manageable': (1) Blue Owl credit agreement in full, including covenants and any equity
      kicker; (2) FedRAMP authorization letter or ATO documentation; (3) direct employee
      reference checks covering at least 10 post-2024 interview subjects; (4) Carahsoft contract
      terms and revenue-share economics; (5) breakdown of ARR by customer segment (federal vs.
      commercial) to quantify concentration.
    claimRefs:
      - CR006
      - CR023
      - CR045

