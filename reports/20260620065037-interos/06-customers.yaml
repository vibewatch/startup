callouts:
  - calloutType: strength
    title: "Deepest public federal customer proof of any commercial SCRM vendor"
    body: "Interos has the strongest federal customer proof we reviewed: a named Navy executive quote (Robert Stukes), a government-wide GSA contract, and four named civilian/DoD agencies. This depth of public federal validation is unusual for a private SaaS company at this stage."
    claimRefs: [CU004, CU005, CU008, CU014]

  - calloutType: insight
    title: "Google and L3Harris carry brand weight but lack independent corroboration"
    body: "Named commercial customers Google and L3Harris lend brand credibility, but both are cited without executive quotes or quantified outcomes. Every commercial customer reference originates from Interos's own press releases, and Blue Owl's investment PR provides only secondary repetition of the same company-sourced claim."
    claimRefs: [CU006, CU007, CU029]

  - calloutType: risk
    title: "Single-channel federal sales through Carahsoft creates concentration risk"
    body: "All U.S. federal procurement routes through a single reseller (Carahsoft). While Carahsoft is the largest U.S. government IT aggregator, this creates a single-channel concentration risk for Interos's most heavily-referenced customer segment. Interos holds no direct federal contracts."
    claimRefs: [CU017, CU033]

  - calloutType: risk
    title: "Zero independent reviews contradict the 100+ enterprise customer claim"
    body: "Zero independent reviews on G2, SoftwareReviews.com, and Gartner Peer Insights—combined with zero Hacker News organic mentions—creates a reference validation gap inconsistent with a 100+ Fortune 1000 customer claim. Investors cannot rely on third-party sentiment data to validate the customer base."
    claimRefs: [CU029, CU030, CU031]

  - calloutType: risk
    title: "NRR, GRR, and revenue concentration are entirely undisclosed"
    body: "No NRR, GRR, or customer count trend beyond December 2024's 100+ figure has been disclosed. Revenue concentration (top-5 customer share of ARR) is entirely unknown. This is the most material unresolved diligence question for a SaaS business seeking growth-stage capital."
    claimRefs: [CU032]

