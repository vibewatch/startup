sections:
  - id: customer-segmentation
    title: "Customer Segmentation: Commercial vs. Government Mix"
    body: |
      Interos operates a dual-track go-to-market, serving both the Global Fortune 500 and a broad federal agency roster. As of December 2024, the company claimed to be trusted by "over 100 Fortune 1000 companies and numerous leading federal agencies"—a headline that Blue Owl Capital independently cited when announcing its $40M strategic investment. Named commercial anchors are Google and L3Harris; named federal anchors are the U.S. Navy, NASA, the Missile Defense Agency, and HHS.

      The commercial segment skews toward large multinational enterprises that manage complex, multi-tier supply chains with global supplier footprints. The government segment is bifurcated between DoD (Navy PEO IWS, MDA, F-35 JPO) and civilian agencies (NASA, HHS), with an allied-nation extension into the Five Eyes via Irving Shipbuilding's multi-year contract covering the Royal Canadian Navy and Canadian Coast Guard. The April 2024 ESG press release explicitly confirmed that Interos "serves a variety of commercial, government, and public sector customers around the world including a host of Global Fortune 500 companies and from within the members of the Five Eyes nations."

      Revenue mix between commercial and government segments is not disclosed. The concentration of named customers in defense and national-security contexts suggests a meaningful government book of business, while the 100+ Fortune 1000 count—if accurate—implies at least double-digit commercial accounts. No headcount-based customer count update above 100 has been published since December 2024.
    claimRefs: [CU002, CU003, CU006, CU007, CU026, CU036, CU037]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-customer-proof
    title: "Named Customer Evidence and Production Proof"
    body: |
      Interos's named customer roster carries varying degrees of production evidence. The strongest are the U.S. Navy and Irving Shipbuilding, where named executives were quoted confirming platform deployment. Robert Stukes, Deputy Program Manager PEO IWS, confirmed the Navy deployment "is accelerating our transition from analyzing lagging to leading risk indicators"—evidence of operational rather than pilot use. Aaron Plamondon, VP Strategic Development at Irving Shipbuilding, confirmed the platform "will be used to map and monitor our extended supplier base across our shipbuilding and fleet maintenance programs."

      Google and L3Harris are named in two separate Interos press releases (November and December 2024) but without named executive quotes or outcome metrics. Their inclusion in a Blue Owl Capital investment announcement adds a secondary corroboration layer. NASA and MDA are cited in the June 2024 GSA contract press release, where CEO Ted Krantz confirmed them as existing users. The F-35 Joint Program Office award from April 2019 is the earliest verified named contract.

      The Anglicotech SC-ROC deployment (March 2024) represents a partner-mediated channel: the Scottish defence company deployed Interos's SC-ROC product to serve its own defence customers, providing a named partner reference but leaving end-customer identities undisclosed. Delta, JPMorgan Chase, and Accenture appeared at the November 2024 Risk Intelligence Summit—their precise role as customers, prospects, or partners is not confirmed in the press release.

      Independent review coverage is nearly absent: SoftwareReviews.com returned zero reviews, G2 pages were inaccessible, and Hacker News yields no organic discussion. This creates a significant gap between the claimed customer count and independently verifiable reference quality.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU018, CU019, CU025, CU029, CU030, CU031]
    tableRefs: [TU002, TU003]
    figureRefs: [FU003]

  - id: adoption-and-growth
    title: "Customer Adoption Trajectory and Market Traction"
    body: |
      Interos's growth trajectory is evidenced through multiple third-party proxies: Inc. 5000 #1952 (310% three-year growth), Deloitte Technology Fast 500 (310% from 2018–2021), and a confirmed +50% ARR growth year for 2023 with +60% gross margin improvement. These consecutive high-growth signals are consistent with a SaaS company that is successfully converting enterprise logos at scale, not merely pilot or proof-of-concept revenue.

      The partner ecosystem has been a key adoption enabler. ServiceNow integration (April 2022) opens Interos to ServiceNow's enterprise customer base. CoupaLink certification (May 2022) reaches Coupa's procurement user base. The December 2024 SAP Ariba live integration deepens access to SAP's large ecosystem of procurement and supply chain customers. This platform-embed strategy converts incumbent procurement-platform users into Interos customers without requiring a standalone sales motion.

      The F-35 JPO contract (2019) through the Navy enterprise deployment (2023) and the government-wide GSA award (2024) represents a five-year federal expansion arc, growing from single-program to enterprise-wide to government-wide contract authority. The CrowdStrike outage analysis (July 2024) demonstrated real-time platform activity across the customer base during a global crisis, suggesting active rather than shelfware usage and high platform stickiness among deployed accounts.
    claimRefs: [CU001, CU011, CU014, CU020, CU021, CU022, CU023, CU024, CU027, CU034]
    tableRefs: [TU004]
    figureRefs: [FU002]

  - id: retention-and-durability
    title: "Retention Signals, Contract Durability, and Evidence Gaps"
    body: |
      Contract durability is supported by structural signals: the U.S. Navy contract is enterprise-wide with no disclosed end date; the Irving Shipbuilding deal is multi-year; the GSA government-wide contract runs five years (2024–2029). Enterprise SCRM implementations carry high switching costs due to data integration, workflow embedding, and trained analyst dependencies. The ServiceNow, Coupa, and SAP Ariba platform integrations further embed Interos into customer operational workflows.

      Interos holds annual customer summits (confirmed in April 2024 ESG press release) and generated CrowdStrike crisis-moment intelligence for its base, both indicators of a retention-oriented customer success program rather than transactional sales. The Blue Owl strategic investment announcement described Interos as "trusted by" its customers—language implying established, ongoing relationships rather than new logos.

      Despite these positive signals, critical retention metrics—net revenue retention (NRR), gross revenue retention (GRR), and customer lifetime value (CLTV)—are entirely undisclosed. No analyst (Gartner, Forrester, IDC) has published independent retention benchmarks for Interos. The absence of any independent review coverage on G2, SoftwareReviews, or Gartner Peer Insights is inconsistent with a company serving 100+ enterprise logos, suggesting either that reviews are systematically suppressed, customers are under NDA, or the addressable reviewer population is narrower than the headline count implies.
    claimRefs: [CU014, CU020, CU021, CU022, CU028, CU029, CU031, CU032, CU034, CU035, CU038]
    tableRefs: [TU005]
    figureRefs: [FU004]

  - id: concentration-and-procurement-channels
    title: "Customer Concentration Risks and Procurement Channel Analysis"
    body: |
      The most material concentration risk is channel: all U.S. federal procurement routes exclusively through Carahsoft Technology Corp as the sole Master Government Aggregator. Carahsoft holds the GSA Schedule (47QSWA18D008F), NASA SEWP V (NNG15SC03B / NNG15SC27B), ITES-SW2 (W52P1J-20-D-0042), and NASPO (AR2472) contract vehicles. While Carahsoft is the largest government IT reseller in the U.S.—which reduces access risk—Interos has no direct federal contract relationship. A Carahsoft disruption, de-listing, or margin dispute would impair all federal revenue.

      Geographic concentration is also present: all publicly named commercial customers are U.S.-based (Google, L3Harris), all federal contracts are U.S. or Five Eyes, and there is no evidence of named commercial customers in Europe, Asia-Pacific, or the Middle East despite claims of global supply chain reach. Vertical concentration is defense-heavy: four of eight named customers are DoD-adjacent (Navy, MDA, F-35 JPO, Irving Shipbuilding/Canadian Navy).

      Customer count concentration cannot be assessed: Interos does not disclose revenue by customer, revenue by segment, or top-customer concentration. The jump from 100+ Fortune 1000 (December 2024) to any updated figure has not been publicly published as of the June 2026 research date. An investor cannot determine whether the top five customers represent 20% or 80% of ARR based on available disclosures.
    claimRefs: [CU015, CU016, CU017, CU026, CU032, CU033, CU036, CU037]
    tableRefs: [TU006]

