  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: NRR-GRR
      missingEvidence: "Published net revenue retention (NRR) and gross revenue retention (GRR) metrics for any fiscal year"
      whyItMatters: "Without NRR, it is impossible to assess whether the customer base is expanding, flat, or eroding. This is the most critical metric for valuing a SaaS business and Interos provides none."
      diligencePath: "Request NRR/GRR directly from Interos CFO; cross-reference against investor data room if available; conduct reference calls with named customers to assess contract renewal behavior."
      relatedQuestionRefs: [QU004, QU024]

    - type: stale
      severity: material
      topic: customer-count
      missingEvidence: "Customer count update beyond December 2024's 100+ Fortune 1000 figure through June 2026"
      whyItMatters: "Eighteen months of silence on customer count means an investor cannot determine if the company has grown to 150+ accounts or stalled at 100. Both scenarios are plausible."
      diligencePath: "Request updated customer count from management; check for any H1 2025 or 2026 press releases citing updated figures; ask Blue Owl for portfolio update disclosures."
      relatedQuestionRefs: [QU025]
      relatedTableRefs: [TU003]

    - type: private-evidence-only
      severity: blocking
      topic: revenue-concentration
      missingEvidence: "Top-5 or top-10 customer revenue concentration as a share of total ARR"
      whyItMatters: "Given the heavy federal presence and small named logo count, there is material risk that a small number of contracts represent a disproportionate share of total ARR. This is unassessable from public sources."
      diligencePath: "Request customer revenue concentration schedule from management; review any Series D investor disclosures; check whether SEWP/GSA contract values are publicly recorded."
      relatedQuestionRefs: [QU019]

    - type: access-blocked
      severity: material
      topic: independent-reviews
      missingEvidence: "Independent customer reviews on G2, Gartner Peer Insights, Capterra, or equivalent platforms with rating scores and sentiment"
      whyItMatters: "The complete absence of reviews across all major platforms is the primary adverse signal in this chapter. Investors cannot validate customer satisfaction or identify delivery issues without these signals."
      diligencePath: "Conduct direct reference calls with named customers (Navy PEO IWS, Irving Shipbuilding). Request customer satisfaction scores or NPS data from Interos. Check Gartner Magic Quadrant positioning."
