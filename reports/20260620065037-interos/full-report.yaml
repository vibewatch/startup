      - number: '3.4'
        title: Moat Durability and Win/Loss Dynamics
        blocks:
          - type: paragraph
            body: >
              Interos' most defensible moats are its knowledge graph scale, its government procurement channel, and its
              Coupa/ServiceNow/SAP distribution ecosystem. The knowledge graph—200 million-plus entities, 11
              billion-plus relationships, built over nearly two decades—cannot be replicated quickly by any entrant or
              acquirer. However, Altana's 600-million-company graph shows that competing graphs are achievable; Interos'
              edge is the multi-domain coverage (financial, regulatory, geopolitical, cyber simultaneously) rather than
              raw size alone.


              The GSA five-year contract is a structural moat: it provides a procurement vehicle through which all US
              DoD and civilian agencies can purchase Interos without a separate RFP. Exiger has FedRAMP Moderate
              authorization and competes for the same agencies, but the GSA schedule provides a faster path for civilian
              buyers and lowers procurement friction. The Navy enterprise-wide contract provides a large, renewble
              anchor account. Government contract renewals and CISA-related spending on supply chain risk are tailwinds.


              Named commercial wins include Google (global SCRM), L3Harris Technologies (enterprise-wide defense SCRM),
              and the F-35 fighter jet program—reference accounts that are hard to displace and that signal trust for
              new enterprise buyers. These references support premium pricing and help Interos access RFPs independently
              of analyst shortlisting.


              The main win/loss risk factors are: (1) Resilinc's Gartner MQ Leader status driving inbound demand for
              Resilinc in Gartner-influenced procurement processes; (2) Exiger's government penetration crowding Interos
              on new-agency bids; (3) Bitsight/Moody's bundling displacing Interos in financial-risk buying centers; and
              (4) pricing sensitivity—Interos' high ACV limits access to the mid-market. The April 2026 iQ product
              launch (AI-driven C-level supply chain briefing interface) mirrors Resilinc's agentic AI positioning and
              signals Interos is investing in the executive-dashboard battleground, but independent evidence of buyer
              adoption is not yet available. Switching costs are meaningful: API integrations, supplier onboarding
              workflows, and dashboards built on Interos data create re-platforming friction, but a competitor with
              comparable federal authorization and a lower ACV could erode the mid-enterprise segment.
