          - type: callout
            title: GSA Government-Wide Contract Is a Potential Step-Change in Addressable Revenue
            body: >-
              The five-year GSA government-wide SCRM contract (October 2024) opens Interos' platform to all DoD and
              civilian agencies — a potential multiplier on the existing Navy, NASA, and MDA contracts. Government SaaS
              contracts are sticky, multi-year, and non-seasonal, providing revenue quality comparable to top-tier
              enterprise SaaS. If converted to full-agency deployments, this contract vehicle could materially expand
              government ARR beyond current named-agency deployments.
