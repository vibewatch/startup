      - number: '3.3'
        title: Cyber Risk and Procurement Adjacency
        blocks:
          - type: paragraph
            body: >
              Bitsight, acquired by Moody's Corporation for approximately $2.4 billion, and SecurityScorecard (TITAN AI
              platform, 12 million-plus rated organizations) are cyber-only TPRM vendors. Their buyer overlap with
              Interos occurs in Chief Information Security Officer and procurement risk workflows. Interos' own
              cyber-resilience product addresses this overlap directly: it monitors supply-chain-specific cyber risk
              vectors and positions the platform to compete with cyber TPRM vendors in shared accounts. However,
              Bitsight's integration into Moody's credit-risk ecosystem creates a risk that enterprise risk management
              and treasury teams could bundle cyber and financial risk monitoring under Moody's instead of Interos.
              SecurityScorecard's broad penetration (12M-plus rated organizations) makes it a low-friction entry point
              for buyers who later expand to supply chain risk use cases.


              On the procurement side, Coupa's supplier risk and performance module embeds TPRM inside the
              spend-management workflow, competing for buyer budget without requiring a separate procurement cycle. SAP
              Ariba published an Interos integration in November 2024, explicitly framing the two platforms as
              complementary—procurement workflow plus AI-driven risk monitoring. This is reinforced by Coupa's own
              position: Coupa Ventures co-invested in the Interos $100 million Series C, and Interos became a
              CoupaLink-certified solution, turning a potential competitor into a channel partner. Dataminr's real-time
              event intelligence is integrated into Interos iReputation, extending signal sourcing beyond Interos' own
              data corpus.


              The structural implication is that procurement platforms are both partial substitutes (for buyers who want
              "good enough" risk visibility inside an existing tool) and distribution channels (for buyers who start
              with procurement and expand to dedicated SCRI). Interos benefits from both dynamics but must defend
              against procurement-native expansions by Coupa and SAP.
