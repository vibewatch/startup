chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >
              Interos Inc., operating under the brand interos.ai, is a private SaaS company headquartered in Arlington,
              Virginia. Its stated mission is to eliminate risk from every supply chain and to build the most trusted
              and transparent supply chains in the world. The company describes itself as the AI-first supply chain risk
              intelligence company and positions its platform as the system of record for supply chain risk management.

              The operating model is a pure SaaS subscription platform sold to large enterprises and government
              agencies. The core product is a continuously updated knowledge graph that maps over 400 million global
              entities and 11 billion-plus business relationships, enabling customers to monitor for six risk vectors —
              cyber, financial, geopolitical, regulatory, ESG, and catastrophic — without manual supply-chain mapping
              processes. Customers include Fortune 1000 companies and U.S. federal agencies across defense,
              intelligence, and civilian domains. The company's revenue model is enterprise SaaS subscription with
              professional services as a complement, though CEO Ted Krantz stated in early 2026 that the company has
              shifted emphasis toward its software tools and away from the original professional services angle.

              Interos was founded in 2005 by Jennifer Bisceglie, who previously led government market efforts at
              Manhattan Associates, a supply chain solutions company. Some third-party databases list a 2017 founding
              date, which likely reflects a product rebrand or technology platform upgrade rather than the company's
              original incorporation. Interos' own 2022 press releases state the company was founded 17 years earlier,
              confirming 2005. The company is registered as INTEROS SOLUTIONS, INC. in Virginia.
            claimRefs:
