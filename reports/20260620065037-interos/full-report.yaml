      - number: '2.3'
        title: Buyer segmentation and procurement structure
        blocks:
          - type: paragraph
            body: >
              Interos serves two structurally distinct buyer segments: U.S. federal government agencies and large
              commercial enterprises. These segments differ in procurement pathway, budget ownership, key compliance
              drivers, and sales cycle dynamics.

              The U.S. federal segment is Interos' most clearly validated market. Interos holds a five-year
              government-wide SCRM contract with GSA (announced June 2024), making the platform accessible to all DoD
              and civilian agencies via Carahsoft as the authorized reseller through contract vehicles including GSA
              Schedule 47QSWA18D008F, SEWP V, ITES-SW2, and NASPO ValuePoint. The company also won the U.S. Navy
              enterprise-wide SCRM contract (2023), covering more than 30 support organizations and field activities
              globally under PEO IWS. An earlier F-35 fighter jet program SCRM contract validated Interos' defense
              industrial base reach. Federal buyers are driven primarily by executive orders (EO 14017, EO 14028), CMMC
              compliance requirements, and CISA guidance, with budget allocated through agency CISOs and contracting
              offices rather than commercial procurement lines.

              The commercial enterprise segment spans Fortune 500 companies across aerospace/defense, technology,
              automotive, and financial services verticals. In commercial settings, the buying decision is typically
              co-owned by the Chief Procurement Officer (supply chain disruption and sourcing risk angle) and the Chief
              Information Security Officer (third-party cyber risk, TPRM angle), with budget split across supply chain,
              procurement, and risk/GRC lines. This dual-ownership structure creates complex internal alignment
              requirements and longer sales cycles relative to single-buyer enterprise software purchases.

              Interos' product architecture reflects this dual-segment model: the iTracing solution addresses regulatory
              traceability (UFLPA forced labor, conflict minerals), iTariffs addresses tariff exposure monitoring, the
              supply chain mapping module targets network visualization for large enterprises, the TPRM module targets
              vendor cyber and operational risk, and the cyber resilience module addresses supply chain cybersecurity
              posture. Third-party risk buyers in financial services differ meaningfully from supply chain buyers — FS
              TPRM focuses on cyber/operational risk per OCC and DORA regulatory guidance, while supply chain TPRM
              targets multi-tier disruption.
