      - number: '2.4'
        title: Growth drivers and demand catalysts
        blocks:
          - type: paragraph
            body: >
              Supply chain risk intelligence demand is driven by a convergence of geopolitical, regulatory, and
              operational forces that are accelerating in 2025–2026.

              Regulatory mandates are the strongest and most durable demand driver for Interos' government segment. The
              UFLPA (signed December 23, 2021) establishes a rebuttable presumption that goods from Xinjiang's Uyghur
              Autonomous Region are prohibited from import, creating a legal mandate for multi-tier supplier tracing.
              CBP actively enforces UFLPA, publishing a public dashboard of shipment detentions. CMMC Phase 1 began
              November 10, 2025, requiring DoD contractors to comply with cybersecurity standards that include supply
              chain security elements. The CISA ICT SCRM Task Force (established December 2018) and NIST SP 800-161 Rev.
              1 (published May 2022) provide the frameworks underpinning federal compliance requirements. The EU
              Corporate Sustainability Due Diligence Directive (CSDDD) creates parallel demand from European-linked
              supply chains for human-rights vetting tools.

              Geopolitical disruption has intensified in 2025–2026. Interos' own blog posts in June 2026 reference the
              Pentagon's Section 1260H list expanding to 188 Chinese military-linked companies, and IEEPA tariff changes
              in early 2026 that significantly elevated tariff exposure monitoring demand. The US-India Critical
              Minerals Framework (signed May 2026 under the Quad partnership) signals growing government interest in
              supply chain diversification from China, particularly for electronics and rare earth inputs. These
              geopolitical events directly expand the addressable demand for real-time supply chain monitoring
              platforms.

              Operational and commercial drivers include cyber-insurance underwriters increasingly requiring continuous
              third-party cyber monitoring as a precondition for coverage, enterprise ESG and forced-labor disclosure
              requirements, and the documented $184 million average annual cost of supply shocks to large enterprises.
              Gartner's finding that 89% of companies experienced a supplier risk event in the past five years, combined
              with documented 2x improvement in risk tactic effectiveness from technology adoption, validates the
              business case for SCRM platforms.
