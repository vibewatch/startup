        - GAAP gross margin %, COGS breakdown, engineering vs. hosting costs
        - 40% gross margin improvement noted but absolute level unknown; needed for SaaS quality assessment
        - CFO data room; audited financials
      - - Net Revenue Retention (NRR)
        - NRR or Net Dollar Retention for most recent fiscal year
        - Key durability indicator for recurring-revenue platform; government vs. commercial NRR differ significantly
        - Management disclosure; data room
      - - Blue Owl facility terms
        - Interest rate, covenants, maturity, warrant/equity kicker, prepayment
        - Determines cost of capital, dilution, and downside covenant risk
        - Debt term sheet; data room
      - - 2026 financing
        - Confirmation of any 2025–2026 financing event (amount, structure, terms); no Form D filed as of 2026-06-20
        - Task hints reference 2026 financing amounts as disclosed; not located in fetched public sources
        - Press release, data room, or direct confirmation from Interos IR
      - - Cap table and preference stack
        - Current fully-diluted share count, option pool, and liquidation preference waterfall
        - Determines investor returns under various exit scenarios; critical for price-to-return analysis
        - Data room; legal counsel review of investor rights agreement
      - - Government contract backlog
        - Firm-fixed-price or indefinite-delivery amounts on GSA, Navy, MDA, and other existing contracts
        - Quantifies revenue visibility beyond ARR; key for government SaaS premium justification
        - Interos government contracts; USASpending.gov award data
      - - Headcount and burn rate
        - Employee count trend 2022–2026; monthly cash burn and current runway
        - Growth-capital context; burn rate determines how long Blue Owl credit extends runway
        - CFO disclosure; Glassdoor headcount proxy
    notes: >-
      These asks identify the missing private-company evidence required to tighten valuation ranges; null fields reflect
      information not publicly disclosed as of the run date.
