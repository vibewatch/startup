              Interos holds annual customer summits (confirmed in April 2024 ESG press release) and generated
              CrowdStrike crisis-moment intelligence for its base, both indicators of a retention-oriented customer
              success program rather than transactional sales. The Blue Owl strategic investment announcement described
              Interos as "trusted by" its customers—language implying established, ongoing relationships rather than new
