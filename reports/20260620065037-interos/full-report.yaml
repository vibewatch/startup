      - number: '1.4'
        title: Platform capabilities, customers, and scale metrics
        blocks:
          - type: paragraph
            body: >
              The Interos platform is built on what the company calls the world's largest supply chain knowledge graph,
              continuously mapping and monitoring over 400 million global entities across more than 11 billion business
              relationships. The platform's AI engine scores suppliers using the proprietary i-Score methodology,
              covering cyber, financial, geopolitical, regulatory, ESG, and catastrophic risk vectors. The primary
              products are the i-Score risk scoring engine, the Resilience Watchtower for real-time personalized alerts,
              and Ask Interos, an AI-powered conversational tool for identifying supplier threats launched in October
              2024. The platform also integrates with SAP Ariba for embedded procurement workflows, extending its reach
              to procurement teams.

              Customer scale numbers contain a genuine conflict. TechCrunch reported approximately 100 clients as of
              October 2024, while the Christian and Timbers case study and other sources describe 500 organizations as
              customers. The more likely reconciliation is that Interos distinguishes between direct
              enterprise/government clients and a broader installed base that includes channel or reseller
              relationships. Named customers include Google, NASA, the U.S. Navy, L3Harris, Accenture, Freddie Mac,
              Cooper University Health Care, Vantage Data Centers, TD Bank, and the Defense Logistics Agency.

              Revenue data from the Christian and Timbers case study indicates revenue of $19.9 million in 2022 growing
              to approximately $39.7 million by 2023-2024. TechCrunch cited 35% year-over-year revenue growth in October
              2024. Gross margins improved 60% in 2023 relative to 2022. Headcount sits at approximately 114 full-time
              employees as of December 2024 and 146 to 150 including contractors as of early 2026, which is a notably
              lean team relative to the company's $1 billion-plus valuation and total capital raised.
