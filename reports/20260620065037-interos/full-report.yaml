  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >
              Interos competes across three overlapping competitive arenas: (1) dedicated supply chain risk intelligence
              (SCRI) platforms, where Altana Technologies, Resilinc, Exiger, and Everstream Analytics are the closest
              rivals; (2) cyber-risk and third-party risk management (TPRM), where Bitsight (now a Moody's subsidiary)
              and SecurityScorecard overlap in shared-buyer accounts; and (3) procurement-embedded risk modules, where
              Coupa and SAP Ariba address risk from inside the spend-management workflow.


              Interos' knowledge graph—spanning 200 million-plus entities across 11 billion-plus relationships—is the
              technical centerpiece of its competitive positioning. iTracing provides multi-tier supplier network
              mapping; iReputation monitors more than 150 risk categories simultaneously across financial, geopolitical,
              cyber, and ESG dimensions; iTariffs adds real-time tariff exposure modeling. No single rival spans all
              these vectors in one platform as of the research date.


              On the government channel, Interos holds a five-year GSA government-wide SCRM contract (June 2024)
              covering all DoD and civilian agencies and an enterprise-wide US Navy contract (April 2023). Exiger is the
              only named competitor with a comparably deep federal footprint (FedRAMP Moderate authorization, 60-plus
              federal agencies). Altana has a confirmed US Customs and Border Protection relationship, while Resilinc
              and Prewave are primarily commercial. This bifurcation—commercial SCRM leaders vs. government-authorized
              platforms—is the primary segmentation axis in the competitive landscape.


              The absence of a confirmed Gartner Magic Quadrant or Forrester Wave placement for Interos, at a time when
              Resilinc holds the MQ Leader position (2026), represents an analyst-visibility gap that enterprise buyers
              driven by Gartner recommendations may notice during shortlisting.
