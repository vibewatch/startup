      - number: '6.1'
        title: 'Customer Segmentation: Commercial vs. Government Mix'
        blocks:
          - type: paragraph
            body: >
              Interos operates a dual-track go-to-market, serving both the Global Fortune 500 and a broad federal agency
              roster. As of December 2024, the company claimed to be trusted by "over 100 Fortune 1000 companies and
              numerous leading federal agencies"—a headline that Blue Owl Capital independently cited when announcing
              its $40M strategic investment. Named commercial anchors are Google and L3Harris; named federal anchors are
              the U.S. Navy, NASA, the Missile Defense Agency, and HHS.


              The commercial segment skews toward large multinational enterprises that manage complex, multi-tier supply
              chains with global supplier footprints. The government segment is bifurcated between DoD (Navy PEO IWS,
              MDA, F-35 JPO) and civilian agencies (NASA, HHS), with an allied-nation extension into the Five Eyes via
              Irving Shipbuilding's multi-year contract covering the Royal Canadian Navy and Canadian Coast Guard. The
              April 2024 ESG press release explicitly confirmed that Interos "serves a variety of commercial,
              government, and public sector customers around the world including a host of Global Fortune 500 companies
              and from within the members of the Five Eyes nations."


              Revenue mix between commercial and government segments is not disclosed. The concentration of named
              customers in defense and national-security contexts suggests a meaningful government book of business,
              while the 100+ Fortune 1000 count—if accurate—implies at least double-digit commercial accounts. No
              headcount-based customer count update above 100 has been published since December 2024.
