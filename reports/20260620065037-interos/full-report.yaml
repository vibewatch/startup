        title: Exhibits
        blocks:
          - type: callout
            title: Knowledge Graph as Defensible Moat
            body: >-
              The interos.ai knowledge graph—built over nearly two decades—represents a significant data and
              infrastructure moat. With 250M+ entities and 11B+ B2B relationships constructed via NLP/ML from
              large-scale public and commercial data, it would require years and hundreds of millions of dollars to
              replicate from scratch. The absence of a manual data-entry requirement for customers dramatically lowers
              adoption friction relative to legacy SCRM approaches.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE023
          - type: callout
            title: iQ Limited Release Creates Commercial Uncertainty
            body: >-
              As of April 2026, the iQ platform—including the three most commercially differentiated modules (itariffs,
              itracing, ireputation)—remained in limited release for select customers. The absence of a disclosed
              general availability timeline and the undisclosed ERP connector specifications create material uncertainty
              about whether iQ can be scaled to the broader Fortune 1000 customer base in the near term.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE029
          - type: callout
            title: FedRAMP Gap Is Material for Government Revenue Claims
            body: >-
              Interos holds a government-wide GSA contract and multiple agency-level deployments, yet no FedRAMP
              authorization was found in the public marketplace as of June 2026. For a company deriving significant
              revenue and positioning from government deployments, this represents either a material compliance gap or a
              gap in public-facing documentation—both of which warrant diligence.
            calloutType: risk
            claimRefs:
              - CE031
              - CE038
          - type: callout
            title: Gartner's Skepticism on SCRM Predictive Analytics Claims
            body: >-
              Gartner noted in its SCRM guidance that "few, if any" supply chain risk management platforms have genuine
              predictive analytics capabilities, while vendors claim they are developing ML/AI to spot potential issues.
              This market-wide skepticism applies to Interos' iQ positioning as the "industry's first fully productized
              predictive analytics platform," warranting independent validation of the predictive accuracy claims.
            calloutType: insight
            claimRefs:
              - CE032
              - CE006
  - number: 6
    title: Customers
