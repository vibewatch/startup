  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and competitive landscape definition
        blocks:
          - type: paragraph
            body: >
              Interos occupies a specialized sub-segment within the broader supply chain risk management software
              market, which itself sits inside the larger supply chain management (SCM) ecosystem. The company positions
              itself as delivering "Supply Chain Risk Intelligence" (SCRI) — an AI-native, continuous-monitoring
              approach to multi-tier supplier relationships — distinguishing this from generic procurement risk modules
              bundled into ERP platforms and from point solutions that address only financial credit risk or only
              cybersecurity.

              The relevant TAM boundary for Interos spans four overlapping market categories: (1) SCRM software
              platforms focused on supplier risk monitoring and scoring; (2) third-party risk management (TPRM)
              platforms targeting vendor cyber and operational risk; (3) supply chain mapping and traceability tools
              driven by regulatory compliance (UFLPA, CSDDD, conflict minerals); and (4) procurement intelligence tools
              that embed risk signals into sourcing decisions. Adjacent but excluded segments include physical supply
              chain management (inventory, logistics, TMS), IoT-based supply chain security hardware, and general
              enterprise risk management (ERM) GRC suites where SCRM is a minor module.

              Status-quo substitutes for dedicated SCRI platforms include manual spreadsheet-based supplier lists,
              ERP-native risk modules from SAP (Ariba Supplier Risk), Oracle, and IBM, periodic third-party audits and
              consulting engagements, and point solutions for cyber or financial risk alone. The ERP incumbent bundling
              threat is real: SAP Ariba's supplier risk module and Coupa's risk management capabilities are embedded in
              procurement workflows that already process supplier transactions, giving them a low-friction distribution
              advantage. Interos addresses this by pursuing platform partnerships — including a certified integration
              with Coupa (2022) and a featured integration with SAP Ariba Supplier Risk — rather than competing head-on.

              Resilinc is the closest specialist competitor to Interos, recognized as a Gartner Magic Quadrant Leader in
              2026. Other named competitors include Exiger (defense-focused), Sayari Analytics (beneficial ownership and
              supply chain), and Prewave (AI supplier intelligence). The supply chain security hardware market (IoT
              sensors, GPS tracking, RFID) is a related but distinct segment and is not part of Interos' addressable
              market.
