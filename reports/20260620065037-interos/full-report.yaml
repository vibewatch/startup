            title: SCRM market TAM estimates should be treated as reference points, not anchors
            body: >-
              The Mordor Intelligence $5.12B SCRM TAM and MarketsAndMarkets $6.0B ERM estimate measure different market
              scopes and cannot be reconciled without primary analyst access. Both are plausible as upper bounds but
              overstate the realistically addressable market for a specialist SCRI platform. A more conservative SAM
              estimate of $1–2B for AI-native multi-tier SCRI is appropriate for investment modeling until primary
