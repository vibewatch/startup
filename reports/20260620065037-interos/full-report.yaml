            body: >-
              CBInsights' Mosaic Score for Interos declined 32 points in the 30 days preceding June 2026. The Mosaic
              Score incorporates web traffic, employee headcount trends, social signals, and investor sentiment. A
              32-point decline in a single month is a meaningful deterioration and may reflect reduced web traffic, slow
