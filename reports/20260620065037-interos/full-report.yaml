      - number: '7.4'
        title: Public-Sector Concentration and Partner Dependency
        blocks:
          - type: paragraph
            body: >-
              Interos' most strategically concentrated risk is its dependence on U.S. federal government revenue routed
              through a single channel distributor. Carahsoft Technology Corp. is the confirmed distributor for Interos'
              federal sales, holding the SEWP V and GSA Schedule contracts through which agencies purchase. The
              government-wide SCRM contract awarded by the GSA in June 2024—which extends the Interos platform to all
              DoD and civilian agencies—passes through Carahsoft as the prime channel. This creates three layers of
              concentration: (a) customer type (federal government), (b) contract vehicle dependency (GSA through
              Carahsoft), and (c) annual-appropriations risk (federal budgets subject to continuing resolutions,
              sequestration, and program cancellations).

              Additional named government customers—the U.S. Navy (2023-2024 enterprise SCRM contract) and Canada's
              Coast Guard—amplify sector concentration rather than diversifying it. Commercial customers (Google,
              L3Harris, JPMorgan Chase, Delta, etc.) exist but their share of ARR is undisclosed, creating opacity about
              true concentration ratios. Interos announced partnerships with SAP Ariba, ServiceNow, Dun & Bradstreet,
              and Coupa that could help commercialize the platform beyond government, but integration partnerships are
              not equivalent to direct revenue diversification.

              FedRAMP cloud authorization status was not confirmed in the FedRAMP marketplace during this review.
              FedRAMP authorization is typically required for cloud software procured by federal civilian agencies, and
              its absence (or inability to confirm presence) is a material diligence ask for any government revenue
              thesis.
