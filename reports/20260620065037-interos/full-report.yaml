      - number: '6.5'
        title: Customer Concentration Risks and Procurement Channel Analysis
        blocks:
          - type: paragraph
            body: >
              The most material concentration risk is channel: all U.S. federal procurement routes exclusively through
              Carahsoft Technology Corp as the sole Master Government Aggregator. Carahsoft holds the GSA Schedule
              (47QSWA18D008F), NASA SEWP V (NNG15SC03B / NNG15SC27B), ITES-SW2 (W52P1J-20-D-0042), and NASPO (AR2472)
              contract vehicles. While Carahsoft is the largest government IT reseller in the U.S.—which reduces access
              risk—Interos has no direct federal contract relationship. A Carahsoft disruption, de-listing, or margin
              dispute would impair all federal revenue.


              Geographic concentration is also present: all publicly named commercial customers are U.S.-based (Google,
              L3Harris), all federal contracts are U.S. or Five Eyes, and there is no evidence of named commercial
              customers in Europe, Asia-Pacific, or the Middle East despite claims of global supply chain reach.
              Vertical concentration is defense-heavy: four of eight named customers are DoD-adjacent (Navy, MDA, F-35
              JPO, Irving Shipbuilding/Canadian Navy).


              Customer count concentration cannot be assessed: Interos does not disclose revenue by customer, revenue by
              segment, or top-customer concentration. The jump from 100+ Fortune 1000 (December 2024) to any updated
              figure has not been publicly published as of the June 2026 research date. An investor cannot determine
              whether the top five customers represent 20% or 80% of ARR based on available disclosures.
