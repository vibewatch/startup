    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and revenue breakdown
        - Audited or management-certified ARR for 2023, 2024, and 2025; split government vs. commercial
        - Validates or refutes $39.7 M proxy; core input to all valuation scenarios
        - Request directly from management under NDA; or obtain via data room
