  - id: TV005
    title: Thesis vs. Anti-Thesis
    columns:
      - Dimension
      - Investment Thesis (Bull argument)
      - Anti-Thesis (Bear argument)
      - What Changes the View
    rows:
      - - Market position
        - >-
          Only automated multi-vector SCRM AI platform with GSA government-wide contract; high switching costs for
          government agencies
        - >-
          SCRM market is fragmented; SAP, ServiceNow, and Oracle can embed SCRM natively; government contract
          concentration is also a risk
        - Evidence of commercial ACV growth > government; NRR > 115%
      - - Revenue quality
        - +50% ARR growth in 2023; gross margin improving +60%; sticky government and Fortune 500 customer base
        - >-
          2024 ARR (~$39.7 M) unverified; no audited financials since inception; growth-credit structure avoids equity
          price discovery
        - Audited ARR ≥ $55 M for 2025; confirmed NRR ≥ 110%
      - - AI and product moat
        - >-
          11 B+ entity relationships in proprietary knowledge graph; iQ predictive analytics and tariff exposure modules
          launched 2025–2026; embedded in SAP Ariba and D&B workflows
        - >-
          AI-first SCRM is a crowded investment theme; Google, Microsoft, Palantir can build similar knowledge graphs at
          scale; AI features may be replicated
        - >-
          Patents filed / granted; customer case studies with verifiable ROI; evidence of AI feature contributing to
          retention
      - - Financing and valuation
        - Blue Owl credit is cheap capital that preserves equity; total raised $192 M with disciplined use
        - >-
          No new equity round for 5 years; $1 B unicorn mark is likely stale; credit reliance can mask true equity
          market value; dilution from debt warrants is unknown
        - New priced equity round at disclosed valuation; clean cap table disclosure
      - - Exit / liquidity
        - >-
          Highly strategic to Moody's, D&B, SAP, ServiceNow, or Accenture; government SCRM consolidation theme is
          accelerating
        - Buyer universe is limited; strategic buyers may build vs. buy; no IPO clarity given scale
        - M&A activity in SCRM space; Interos ARR exceeds $100 M
      - - Regulatory / government risk
        - >-
          Government mandated SCRM requirements and CMMC create captive demand; GSA BPA and multi-agency deployments are
          durable
        - >-
          DOGE spending reviews, Continuing Resolution risk, and congressional uncertainty could pause or cancel even
          GSA-approved contracts
        - Government contract backlog data; confirmation of DoD active deployment schedules
    notes: >-
      This table summarizes investment arguments rather than direct factual metrics; each row compresses multi-source
      evidence into a bull vs. bear framing and should be read alongside the cited claims and evidence gaps.
    claimRefs:
