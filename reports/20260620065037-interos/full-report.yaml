  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Architecture and Knowledge Graph
        blocks:
          - type: paragraph
            body: >-
              The interos.ai Resilience Platform is a pure-SaaS supply chain risk intelligence system delivered via a
              browser-based interface and REST APIs. Its foundational layer is the interos.ai Knowledge Graph— described
              by the company as the world's largest database of B2B relationships—which continuously maps and monitors
              250 million+ companies (referred to as 400 million entities in some marketing materials and 230 million in
              a December 2024 press release) and billions of business relationships. The knowledge graph is constructed
              using machine learning (ML) and natural language processing (NLP) to ingest large-scale public and
              commercial data sets, discover supplier-to-supplier linkages, and propagate those connections to Nth-tier
              depth without requiring customers to manually onboard supplier data.

              Risk analysis runs across six domains: Cyber, Financial, Geopolitical, ESG, Catastrophic
              (operational/natural disaster), and Restrictions (sanctions, trade controls, and export regulations). Each
              domain feeds into the i-Score™, a composite resilience score first introduced as an industry-first metric
              that aggregates risk signals from dozens of sub-factors and hundreds of attributes into a single
              actionable score per supplier. In 2022, Interos enhanced the Cyber component of the i-Score to add a novel
              cyber behavior model detecting potentially harmful activity regardless of public disclosure, plus CVE
              data, MITRE ATT&CK® threat mapping, cloud exposure assessment, and regulatory compliance signals.

              The delivery model is fully multi-tenant SaaS: customers do not install software or maintain
              infrastructure. Interos manages the ingestion pipeline, knowledge graph refresh cycles, model training,
              and alerting infrastructure. The platform exposes APIs for programmatic access, enabling bi-directional
              data flows with enterprise procurement and ERP systems. As of April 2026, the company launched iQ, its
              second-generation predictive analytics layer that specifically orchestrates ERP identifier matching with
              the knowledge graph to quantify dollar-denominated financial exposure.
            claimRefs:
