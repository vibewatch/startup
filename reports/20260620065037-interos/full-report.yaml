      - number: '5.5'
        title: Roadmap, Product-Market Fit Evidence, and Limitations
        blocks:
          - type: paragraph
            body: >-
              Interos' product roadmap reflects a deliberate arc from foundational monitoring toward predictive and
              prescriptive intelligence. The company announced in December 2024 that it was building toward "the
              industry's first predictive analytics platform" and characterized Risk Trends and Benchmarking as
              foundational components of that predictive capability. The April 2026 iQ launch delivered on that stated
              direction, though in limited release only for select customers—meaning broad general availability had not
              yet been achieved as of the research date. The company's Chief Product and Technology Officer, Yardley
              Pohl, described iQ as enabling organizations to "quantify exposure in dollars and communicate risk in the
              language CFOs use every day," reflecting a shift toward C-suite and finance-oriented product positioning.

              Product-market fit evidence is strongest in the government sector: the Navy enterprise deployment, NASA,
              MDA, HHS, and the GSA government-wide contract together represent multi-year, enterprise-scale validated
              deployments. In the commercial sector, Vantage Data Centers (data center TPRM) provided a positive quote
              in the April 2026 iQ press release, and an unnamed global bank uses Resilience Watchtower for third-party
              cyber and financial risk thresholds. The company claimed 100+ Fortune 1000 customers as of 2024. CEO Ted
              Krantz was invited to the World Economic Forum annual meeting at Davos in January 2025, signaling
              C-suite-level market recognition.

              Key limitations and gaps include: (1) entity-count discrepancies (230M, 250M, and 400M across different
              materials) that raise data quality questions; (2) iQ limited-release status as of April 2026; (3) absence
              of publicly confirmed FedRAMP authorization despite government contract depth; (4) limited public
              technical documentation on the knowledge graph's data sources, refresh cadence, and accuracy methodology;
              and (5) Gartner's observation that "few, if any" SCRM platforms have genuine predictive
              analytics—suggesting the market is skeptical of vendor claims in this area.
            claimRefs:
              - CE006
              - CE023
              - CE024
              - CE027
              - CE028
              - CE029
              - CE033
              - CE034
              - CE035
              - CE036
