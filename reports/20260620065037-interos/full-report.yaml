  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Valuation Marks
        blocks:
          - type: paragraph
            body: >
              Interos has raised an estimated $192.35 M in total capital across four disclosed rounds (CB Insights). The
              founding-era raises (SEC Form D December 2019 and March 2020) established the company's Delaware
              incorporation and early investor base. The pivotal round was the September 2021 Series C: $100 M led by
              NightDragon with participation from Kleiner Perkins and Venrock, plus strategic checks from Accenture,
              Coupa, and ServiceNow. Multiple independent news outlets contemporaneously reported unicorn status,
              implying a post-money valuation of at least $1.0 B. The round timing coincided with peak private-market
              multiples, when B2B SaaS supply-chain companies routinely commanded 30–50x forward ARR.

              In October 2024, Interos announced a $40 M "growth capital" investment from funds managed by Blue Owl
              Capital (NYSE: OWL), a credit-focused alternative asset manager with >$192 B AUM. Jefferies LLC served as
              exclusive financial advisor. The SEC Form D filed 2024-10-25 (Acc-No. 0001797513-24-000001) shows a total
              offering of $75,610,033 with $45,560,033 sold as of filing date and $30,050,000 remaining; 10 investors.
              Blue Owl's primary technology-credit business structures growth capital as revenue-based or asset-backed
              lending with equity kickers rather than as priced equity rounds, which explains why no post-money
              valuation was stated. No Form D amendment or new Form D has been filed since 2024-10-25 as of the June 20,
              2026 run date, and no public press release or news article confirming a standalone 2026 equity-priced
              round was located during research. The company issued an April 2026 product-launch release (iQ platform)
              with no financing details.
