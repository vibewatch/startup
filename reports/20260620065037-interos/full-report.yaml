      - number: '2.5'
        title: Adoption constraints, limitations, and evidence gaps
        blocks:
          - type: paragraph
            body: >
              Despite strong demand drivers, several structural constraints limit the pace and scale of SCRM platform
              adoption and must be assessed carefully in any investment or commercial analysis.

              ERP incumbent integration is the primary competitive constraint. SAP Ariba Supplier Risk, Oracle
              Procurement Cloud risk modules, and IBM's supply chain risk tools are already embedded in the procurement
              workflows of most Fortune 500 companies. Integration of a specialist SCRI platform requires 3 to 9 months
              of professional services work according to Mordor Intelligence industry data, creating time-to-value
              delays that favor incumbents with pre-built ERP connectors. Interos partially addresses this via its
              certified Coupa integration and SAP Ariba Supplier Risk partnership, but the ERP bundling threat also
              represents a channel risk: if SAP expands its own AI-native supply chain intelligence capabilities,
              Interos' standalone value proposition narrows.

              Cost barriers create a mid-market gap. Enterprise implementation fees in the SCRM market range from
              $50,000 to $200,000 annually per Mordor Intelligence data, which is prohibitive for SMEs. Mordor data also
              indicates that 62% of manufacturers cited cost as the top adoption barrier even as 71% reported major
              disruptions — a striking gap between acknowledged risk and technology adoption. The SME segment is growing
              fastest (16.19% CAGR) but remains largely unaddressed by current enterprise-grade SCRI platforms.

              Data quality limits risk-scoring accuracy. The Institute for Supply Management reports that 58% of supply
              professionals view supplier-submitted data as unreliable due to outdated financials and incomplete
              facility lists. This structural challenge affects all SCRM platforms but is particularly acute for
              Interos' claims of comprehensive multi-tier mapping: the quality of the graph depends on the accuracy and
              coverage of underlying data ingestion.

              Material evidence gaps remain around Interos' SAM and SOM, federal procurement budget forecasts, and the
              permanence of tariff-driven demand should IEEPA enforcement fluctuate. Contradictory market sizing from
              different analyst firms (scope differences: SCRM vs. ERM) makes bottom-up TAM validation difficult without
              primary analyst interviews. The EU CSDDD's enforcement timeline, delayed repeatedly, introduces
              uncertainty into medium-term European demand projections.
            claimRefs:
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
