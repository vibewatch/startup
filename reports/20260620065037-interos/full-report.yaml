      - number: '5.4'
        title: Trust, Compliance, Security, and Government Deployment
        blocks:
          - type: paragraph
            body: >-
              Interos has achieved substantial government deployment validating enterprise readiness, but specific
              security certifications remain opaque. In June 2024, the GSA awarded Interos a five-year government- wide
              contract enabling all Department of Defense and civilian agencies to access the platform as their SCRM
              solution. This contract was preceded by agency-wide deployments with the U.S. Navy, Missile Defense Agency
              (MDA), NASA, and the Department of Health and Human Services (HHS). The Navy contract, announced April
              2023, required Interos to be embedded within the Navy's Program Executive Office Integrated Warfare
              Systems (PEO IWS) to support 30+ support organizations globally. The GSA library listing places the
              platform under Schedule 518210C (IT products and services).

              The platform's SCRM framework aligns with NIST SP 800-161 Rev. 1 (Cybersecurity Supply Chain Risk
              Management for Systems and Organizations, May 2022) and CISA's ICT Supply Chain Risk Management Task Force
              guidance, both of which mandate multi-tier supplier risk visibility for federal agencies. Interos'
              six-domain monitoring framework (including Restrictions/sanctions screening, Cyber, and Geopolitical) maps
              naturally onto these frameworks. The company also monitors compliance risks including UFLPA- aligned
              forced labor screening and CMMC-aligned cyber supply chain assessment.

              However, no FedRAMP authorization for interos.ai was identified in publicly available government
              marketplaces as of the research date—a notable gap for a company claiming pervasive government deployment.
              SOC 2 Type II certification status is not publicly disclosed. Security and data-handling practices for the
              cloud-hosted knowledge graph are not described in public-facing product documentation. The company's
              compliance page describes monitoring for data protection violations and regulatory compliance across
              suppliers, but its own security posture disclosures are minimal.
