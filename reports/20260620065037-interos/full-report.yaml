      - number: '7.3'
        title: Market Multiple Compression and Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              The supply chain risk management software market is estimated at $5.12 billion in 2026, growing at a
              13.11% CAGR to reach $9.48 billion by 2031. While this structural growth provides a favorable backdrop,
              Interos faces pressure from two sides. First, ERP incumbents with large installed bases—SAP (via SAP
              Ariba), Oracle, and Coupa—are embedding supply chain risk modules into procurement workflows where
              procurement teams already operate. Interos partially mitigated this by becoming a certified partner on the
              SAP Ariba Store in October 2024, but platform adjacency means SAP can expand native functionality without
              channel disruption. Second, a cohort of well-funded specialist competitors has emerged: Resilinc (founded
              2010, multi-tier mapping, AI disruption monitoring for aerospace and automotive), Altana AI (founded 2018,
              AI-driven global value chain platform serving governments and logistics providers), and others.

              On valuation, Interos' 2021 Series C was completed at a $1 billion-plus valuation implying an ARR multiple
              typical of 2021 SaaS markets—reported revenue of approximately $19.9 million in 2022 puts that implied
              multiple in the 50x range, which is dramatically above normalized current multiples for private SaaS
              companies of similar scale and growth. The shift to Blue Owl private credit in 2024 and again in 2026
              rather than a traditional equity round is consistent with inability or unwillingness to mark down the
              existing equity valuation via a dilutive down-round.

              Diligence asks include win/loss analysis against Resilinc and Altana AI for recent Fortune 500 competitive
              bids, and an independent ARR verification to assess current market multiple.
