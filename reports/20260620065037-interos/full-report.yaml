        title: Direct Peers and Capability Differentiation
        blocks:
          - type: paragraph
            body: >
              Altana Technologies positions as a trade-intelligence platform built on a 600-million-company knowledge
              graph, with a differentiated US CBP partnership serving more than 5,000 agents for trade enforcement.
              Altana's product passports map material provenance for forced-labor (UFLPA) and sustainability compliance.
              Where Interos emphasizes real-time risk monitoring and financial/geopolitical signals, Altana leans toward
              customs compliance and product-level traceability. The buyer sets partially overlap (global
              multinationals) but diverge in use case: supply chain risk monitoring versus trade enforcement workflow.


              Resilinc (rebranded resilinc.ai) is Interos' closest head-to-head rival in the SCRM market. Resilinc was
              named a Gartner Magic Quadrant Leader for SCRM Solutions in 2026 and positions "agentic AI" for automated
              risk response. Resilinc's data model relies on direct supplier onboarding and community-sourced data,
              which delivers high accuracy for enrolled suppliers but limited breadth for Tier-2/3 nodes. Interos uses
              AI-driven discovery to map un-enrolled suppliers at scale, trading some accuracy at the leaf nodes for
              broader coverage. Resilinc targets automotive, electronics, and medical-device manufacturers; Interos has
              a stronger government and financial-services overlay.


              Exiger's 1ExigerAI platform ingests 10 billion records and achieved FedRAMP Moderate authorization. Exiger
              differentiates on sanctions screening, counterintelligence risk, and regulatory compliance workflows. In
              the government SCRM segment, Exiger is Interos' most credible direct competitive threat, with 60-plus
              confirmed federal agency relationships. Everstream Analytics focuses on supply chain operational
              disruption monitoring for procurement and logistics; its public materials are thin, suggesting a narrower
              product footprint. Prewave monitors 4.5 million data points per day across 200-plus risk categories, with
              strong ESG coverage, and has received Gartner recognition for SCRM. Prewave is predominantly a
              European-market competitor, benefiting from CSRD enforcement, and has limited US or government
              penetration.


              G2 buyer reviews (2022 archive) list Resilinc and Exiger as the primary Interos alternatives; buyer
              comments cite integration depth and breadth of multi-tier visibility as decision criteria, consistent with
              the capability comparison in the table below.
