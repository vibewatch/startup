            title: Regulatory mandates create durable federal pull
            body: >-
              UFLPA enforcement, CMMC Phase 1 (November 2025), CISA C-SCRM guidance, and EO 14017/14028 create
              non-discretionary compliance requirements that drive federal and defense industrial base procurement
              independent of macro budget cycles. Interos' government-wide GSA contract and Navy enterprise SCRM win
              validate its positioning in this segment. Federal demand is structurally resilient in ways commercial
              enterprise demand is not.
