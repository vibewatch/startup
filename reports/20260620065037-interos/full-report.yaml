              - CV032
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV030
              - CV031
              - CV034
      - number: '8.6'
        title: Recommendation, Thesis vs. Anti-Thesis, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Given the weight of evidence, the appropriate stance is track with a conditional upgrade path. The
              investment thesis is compelling at the right price: Interos is the only automated, AI-first, multi-vector
              SCRM platform with government-wide GSA contract access, Fortune 1000 commercial adoption, a proprietary
              knowledge graph of 400+ million entities, and a growing AI product surface (iQ, Resilience Watchtower,
              itracing, itariffs). These are durable differentiated assets. The anti-thesis is equally clear: the 2021
              unicorn mark of $1 B is likely stale and unsupported by current revenue metrics at post-compression
              multiples; the absence of a new priced equity round for five years suggests term-sheet risk; growth-credit
              reliance may be subsidizing a runway that avoids accountability to market pricing; and government budget
              risk (DOGE-driven spending freezes, CR cycles) could impair the highest-visibility revenue segment.

              The recommendation would move to track-to-buy if: (a) management discloses audited ARR ≥ $55 M for 2025
              with ≥30% YoY growth, (b) a new equity round is completed at a disclosed price that confirms or resets the
              mark, (c) NRR is confirmed above 110%, and (d) gross margin reaches 70%+. Absent those data points, the
              valuation remains a wide range centered on $350–$600 M—attractive relative to the 2021 mark but
              unactionable without price discovery.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV006
            claimRefs:
              - CV033
              - CV034
          - type: table
            tableRef: TV007
            claimRefs:
              - CV035
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: TRACK — Conditional upgrade to buy pending revenue verification
            body: >
              Interos is a category-defining SCRM AI platform with credible government and commercial traction, but the
              2021 $1 B unicorn mark is likely stale and the true equity value is probably in the $350–$636 M range on a
              base scenario. Without audited ARR, confirmed NRR, cap-table disclosure, or a new priced equity round, the
              evidence is insufficient to recommend entry at or near the 2021 mark. Track until price discovery occurs.
            calloutType: recommendation
            claimRefs:
              - CV030
              - CV034
              - CV035
          - type: callout
            title: 'Adverse signal: Growth-credit reliance may mask down-round risk'
            body: >
              Blue Owl's $40 M growth capital facility does not price equity. Five years without a new equity
              round—despite strong ARR growth narrative—raises the question of whether equity investors are unwilling to
              meet management's price expectations. This is a classic private-market valuation opacity pattern. The $30
              M undrawn balance on the 2024 Form D may be drawn in 2026, but this would still be debt, not
              valuation-setting equity. Investors should require full covenant, warrant, and cap-table disclosure before
              assuming the $1 B mark is still valid.
            calloutType: risk
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 'Key assumption: ~$39.7 M ARR proxy is directionally correct'
            body: >
              All valuation scenarios depend on the ~$39.7 M 2024 ARR proxy from third-party aggregators. This figure
              was not confirmed from a primary source (company disclosure, audited statements, or Interos investor
              letter) during this research cycle. If actual ARR is materially lower (e.g., $25–30 M), the base and bull
              scenarios compress significantly; if higher (e.g., $55–65 M), the bear scenario no longer implies a
              down-round. Revenue verification is the single most critical diligence ask.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV011
