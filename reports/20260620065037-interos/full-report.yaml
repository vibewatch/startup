      - number: '5.2'
        title: Product Modules, SKUs, and Capabilities
        blocks:
          - type: paragraph
            body: >-
              Interos organizes its offering across two product generations and a range of solution modules. The
              foundational Resilience Platform covers due diligence, continuous monitoring, and executive reporting
              across the six risk domains. Built on top of it, the iQ platform (launched April 28, 2026 in limited
              release) adds a predictive analytics layer—described by the company as the industry's first fully
              productized predictive analytics platform for SCRM—with ERP integration enabling dollar-denominated risk
              quantification.

              Within iQ, three modules address the most pressing macroeconomic risks as of mid-2026. itariffs maps
              current and anticipated tariff exposure across multi-tier supply chains (tier 1, 2, and 3), with daily
              updates to US Executive Order and Most Favored Nation data; it includes a "Similar Suppliers" feature for
              rapid alternative-source identification during trade disruptions. itracing provides product-level supply
              chain visibility that can be overlaid on a customer's bill of materials (BOM) to trace disruption down to
              a specific part, supplier, and tier. ireputation, developed in partnership with Dataminr, delivers
              real-time reputational risk monitoring across five pillars— foreign influence, brand and operational
              performance, regulatory and compliance exposure, negative financial news, and corporate behavior—updated
              every 20 minutes.

              Resilience Watchtower is the company's exception-based monitoring tool, which applies personalized risk
              models to surface only the most material supplier risks relative to each customer's specific business
              context. The Supply Chain Mapping module provides a navigable visualization of tier 2 and tier 3 supplier
              networks. The TPRM module provides watchlist management with customizable risk thresholds and real-time
              alerts. Dedicated solution pages also cover Cyber Resilience (discovery of hidden supplier cyber
              vulnerabilities to Nth tier) and Compliance & Regulatory (ethical sourcing, sanctions screening, and data
              protection compliance). In December 2024, Interos added Risk Trends (12-month historical risk trend lines
              with 90-day delta and daily refresh) and Industry Benchmarking (peer-group comparison against
              industry-average risk profiles).
