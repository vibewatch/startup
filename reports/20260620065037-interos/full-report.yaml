      - CV031
      - CV032
  - id: TV006
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth stalls
        - Confirmed ARR growth falls below 15% YoY for two consecutive periods
        - Implies loss of growth premium; multiples compress to 4–6x; bear scenario activates
        - Reduce position or pass; request full ARR and churn audit
      - - Down-round equity raise
        - New priced equity round at valuation < $600 M
        - Confirms mark compression; existing preference stack diluted; fundraising narrative weakens
        - Re-underwrite at new price; assess liquidation preference coverage
      - - Government contract cancellation
        - GSA five-year contract terminated or not renewed; DoD agencies exit Interos platform
        - >-
          Removes single largest revenue anchor; growth story collapses; commercial revenue insufficient to sustain $1 B
          mark
        - Immediate review; assess commercial revenue self-sufficiency
      - - Blue Owl covenant breach
        - Covenants on growth-capital facility triggered; amendment or default event
        - Signals cash-flow stress; equity burning faster than modeled; potential forced M&A
        - Demand full covenant terms and runway analysis
      - - Competitive displacement
        - >-
          SAP Ariba, ServiceNow, or Google Cloud announces native multi-vector SCRM product replacing Interos at top-3
          account
        - Validates build-vs.-buy alternative; expansion ARR at risk
        - Check NRR trend immediately; assess contract lock-in terms
      - - Leadership instability
        - CEO Ted Krantz departs within 24 months of joining (Apr 2024) without a qualified successor
        - Execution risk, morale, and investor confidence signal; government customers may pause renewals
        - Track leadership stability; demand succession plan
    notes: >-
      Trigger thresholds are diligence heuristics derived from scenario analysis, not company guidance. They indicate
      events that would likely force a full re-underwrite rather than mechanical investment rules.
    claimRefs:
      - CV033
      - CV034
