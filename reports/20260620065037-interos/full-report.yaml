              valuation. The absence of a new equity round since September 2021 means the $1 B unicorn mark is the only
              officially tracked valuation; all subsequent inference is model-driven.

              The Blue Owl investment described as "growth capital" likely carries a cost-of-capital signal rather than
              a price signal; Blue Owl's technology credit platform typically lends at rates of 12–18% all-in yield
              versus setting an equity NAV. This means investors cannot read the 2024 transaction as setting a new
