      - number: '2.2'
        title: Market sizing — TAM, SAM, and analyst estimates
        blocks:
          - type: paragraph
            body: >
              The most specific third-party estimate for the SCRM market comes from Mordor Intelligence, which values
              the global market at $5.12 billion in 2026, projecting growth to $9.48 billion by 2031 (13.11% CAGR).
              Mordor segments the market by component (software leads at 68.24%), by deployment (cloud dominates at
              72.41%), by enterprise size (large enterprise at 64.47%), by risk type (cybersecurity risk at 27.53%), and
              by geography (North America at 38.63%). These breakdowns are useful but carry moderate credibility risk
              because Mordor does not disclose its methodology or primary data sources, which is typical of second-tier
              market research firms.

              MarketsAndMarkets projects the broader Enterprise Risk Management market — which includes TPRM as a
              sub-segment — at $6.0 billion in 2025, growing to $11.97 billion by 2030 (14.8% CAGR). Separately, their
              third-party risk management market report projects a fast-growing TPRM segment that overlaps with Interos'
              SCRI positioning. These two estimates are not directly comparable to the Mordor SCRM estimate: the Mordor
              figure is narrower (SCRM-specific) while MarketsAndMarkets captures a broader GRC-inclusive scope. The
              implication is that the addressable software market for a specialized SCRI platform like Interos is likely
              $1–2 billion of the Mordor TAM rather than the full $5.12 billion.

              Gartner, the highest-reputation analyst in this space, does not publish a standalone SCRM market sizing in
              its free-access content; however, Gartner survey data indicates 89% of companies experienced a supplier
              risk event in the past five years, and companies using SCRM technology are approximately 2x more effective
              in risk mitigation — suggesting strong underlying demand but stopping short of a discrete market size
              figure. The global supply shock cost of $184 million per enterprise per year (per Interos/ServiceNow press
              materials) provides further context for buyer willingness-to-pay, though this figure originates from
              company-controlled sources.

              Market concentration: SAP, IBM, Oracle, Resilinc, and Coupa hold approximately 35% combined market share,
              leaving the remaining 65% contested by specialist platforms including Interos, Exiger, Sayari, and others.
              Software accounts for 68% of revenue, cloud deployments for 72%. Asia-Pacific is the fastest-growing
              region at 14.16% CAGR, though North America remains the largest market at 38.63% and is Interos' primary
              revenue base.
