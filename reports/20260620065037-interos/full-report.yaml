      - number: '8.3'
        title: Comparable Set Selection and Limitations
        blocks:
          - type: paragraph
            body: >
              Interos sits at the intersection of three comp categories: (1) supply-chain risk management / visibility
              SaaS, (2) third-party risk management (TPRM) / cyber-risk ratings, and (3) government-focused security
              analytics SaaS. Each segment has its own trading dynamics, and none perfectly mirrors Interos's combined
              government/ commercial footprint, AI-first knowledge-graph model, and early-unicorn valuation history.

              The closest acquisition comp is BitSight Technologies, acquired by Moody's Corporation in late 2023 for
              approximately $2.4 B. BitSight is a cyber-risk ratings platform serving the TPRM market; analysts
              estimated ARR of $150–200 M at acquisition, implying a 12–16x ARR acquisition multiple—rich but defensible
              for sticky, recurring government and enterprise contracts. Interos's SCRM scope is broader than pure cyber
              ratings, which could argue for either a premium (broader TAM) or a discount (higher product complexity,
              longer sales cycle). Dun & Bradstreet (NYSE: DNB), a key Interos data-network partner, was taken private
              by Clearlake Capital in a deal valued at $7.7 B EV (approximately $4.1 B cash equity), representing
              approximately 3.2x trailing revenue—but D&B is a 180-year-old data incumbent with low growth (2–3%),
              making it a floor rather than a reference point. Verisk Analytics (NASDAQ: VRSK) trades at approximately
              7–8x NTM revenue with 44% operating margins; its data analytics and risk-scoring profile is analogous but
              it is far larger and more mature. Private comps include Exiger (supply chain and TPRM; $150 M Series C in
              2023), SecurityScorecard (Series F 2021; last at $1 B+ valuation), and Everstream Analytics (Series B,
              supply-chain disruption risk)—all privately held with opaque metrics.
