      - number: '7.5'
        title: Regulatory, Legal, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Interos operates in a regulatory environment that is simultaneously a demand driver and a compliance
              burden. On the demand side, EU Directive 2024/1760 (the Corporate Sustainability Due Diligence Directive,
              or CSDDD) entered into EU law in July 2024 and imposes mandatory supply chain due diligence obligations on
              large EU companies—creating direct regulatory pull for platforms like Interos. Similarly, the Biden
              Executive Order 14017 on supply chain resilience and NIST SP 800-161r1 on Cybersecurity Supply Chain Risk
              Management impose compliance obligations on U.S. federal agencies and their contractors, all of whom are
              potential Interos customers.

              On the burden side, the EU AI Act (2024-2026 phased rollout) may classify Interos' AI-driven risk
              assessments as a high-risk AI system—particularly its finance and restrictions domain scoring—which would
              impose conformity assessment, documentation, and transparency obligations. GDPR Article 5 requires that
              Interos' processing of the personal data of company officers or individuals embedded in supplier records
              meet data minimization, accuracy, and lawfulness standards; with 400 million global entities in the
              knowledge graph, the scope of potentially regulated data is significant. U.S. Export Administration
              Regulations (EAR, 15 CFR 730-774) may apply when Interos exports supply chain intelligence data involving
              dual-use entities or foreign technology suppliers to non-U.S. persons.

              Interos has no confirmed FedRAMP authorization as of this research, no public patent filings were
              identified, and no litigation, regulatory enforcement actions, or IP disputes involving Interos were found
              in public legal databases. These absences are genuine findings, not gaps. The company's legal counsel
              (Cooley LLP, per the Blue Owl press release) and the board composition (Verdecanna, DeWalt) suggest
              institutional capability but the company has not publicly disclosed its compliance certifications or
              regulatory status.
