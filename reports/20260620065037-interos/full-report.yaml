        title: Revenue Proxy and ARR Context
        blocks:
          - type: paragraph
            body: >
              Interos does not publish audited financials. The only public revenue signal is the April 2024 press
              release announcing "+50% ARR growth" in 2023 alongside "+60% improvement in gross margin." The company
              also claimed "record growth" and named Deloitte's Technology Fast 500 and Inc. Fastest-Growing in North
              America. If the 2024 ARR proxy of approximately $39.7 M is accurate (a figure cited in analyst databases
              but not independently confirmed from primary sources), and if growth continued near 30–50% into 2025–2026,
