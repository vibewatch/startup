              - CI025
          - type: callout
            title: No Disclosed Gross Margin, NRR, or Burn Rate — Standard SaaS Metrics Entirely Opaque
            body: >-
              Interos has never publicly disclosed absolute gross margin, net revenue retention, or burn rate. The only
              directional signal — a +60% improvement in gross margin in 2023 — cannot be interpreted without a starting
              base. This opacity is standard for private companies but creates substantial diligence risk. At a $1B 2021
              valuation and with $192M+ raised, investors would need these metrics under NDA before committing new
              capital.
