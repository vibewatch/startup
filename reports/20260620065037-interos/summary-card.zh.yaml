  topStrengths:
    - 以 Interos 的规模，政府牵引力异常强：客户包括 U.S. Navy、NASA，并拿下覆盖 GSA 全体系的五年期 SCRM 合同工具。
    - 产品差异化来自庞大的多层供应商图谱，覆盖 400M+ 实体、11B+ 关系，并横跨多类风险向量。
    - 监管与地缘政治顺风正在推高供应链可视化、网络韧性和第三方风险监测需求。
    - 平台借助 SAP Ariba、Carahsoft，以及 Coupa、ServiceNow 等战略投资者，补上了可信的生态分销和工作流入口。
  topRisks:
    - 上一轮披露的定价股权融资停在 2021 年；之后 Blue Owl 融资更像信用工具，无法验证旧独角兽估值。
    - 公开财务披露很薄：ARR、利润率、烧钱速度和 NRR 仍未审计或未披露，内在价值建模可信度受限。
    - 政府和渠道集中风险不低；Carahsoft 是唯一明确核验的联邦分销商，公共部门需求又受预算周期影响。
    - 2024 年从创始人到职业运营者的领导层交接，在关键扩张期给销售、产品和客户连续性带来执行风险。
    - 产品复杂度，以及更深供应商层级的数据质量验证，可能拖慢采用，或相较更简单的既有替代方案削弱信任。
  unresolvedGaps:
    - 需要经审计的 ARR、收入、毛利率、烧钱速度和 NRR 披露，才能收窄估值区间并判断 SaaS 质量。
    - Blue Owl 融资工具的条款、契约、任何认股权证，以及 2024 年剩余发行额度是否已提款，仍未披露。
    - 政府与商业收入占比、客户集中度未公开，限制了续约和采购风险分析。
    - 2005 年与 2017 年创立日期表面不一致，以及披露累计融资额之间的差距，需要管理层解释。
    - 2021 年后没有披露新的股权估值，因此任何当前估值标记都仍是模型推算，而不是市场定价。
