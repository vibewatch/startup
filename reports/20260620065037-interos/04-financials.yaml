schemaVersion: "report-v2"
artifact: "financials"
slug: "interos"
runDate: "2026-06-20"
company:
  name: "Interos Inc."
chapter:
  number: 4
  letter: "I"
  title: "Financials"
  summary: >-
    Interos has disclosed $39.7M in FY2024 revenue (CBInsights) and claimed +50% ARR growth in 2023,
    but has never released audited financials; gross margin, burn rate, NRR, and customer concentration
    remain entirely private. The company has raised a total of approximately $192M across eight rounds
    (CBInsights), with two Blue Owl Capital–led tranches in fourteen months signaling ongoing capital
    dependency. CEO Ted Krantz's stated goal of reaching break-even by end of 2026 confirms the company
    is currently loss-making, and CBInsights' Mosaic Score declined 32 points in the 30 days preceding
    the run date, indicating weakening momentum. A $1B unicorn valuation set in July 2021 implies a
    revenue multiple above 25x on FY2024 revenue — compression that is plausible given the broader
    software multiple reset but remains unconfirmed by any post-2021 disclosed valuation.

sections:
  - id: "revenue-model"
    title: "Revenue Model & ARR Trajectory"
    body: |
      Interos operates as a B2B enterprise SaaS platform selling annual subscription licences for
      AI-powered supply chain risk intelligence. Revenue is generated across two primary segments:
      commercial enterprises (Fortune 1000 companies) and U.S. federal government agencies
      (accessed via GSA Schedule through reseller Carahsoft). The company does not publicly disclose
      a pricing schedule; enterprise deals are negotiated individually, and government pricing flows
      through GSA contract vehicles at negotiated rates.

      The only third-party revenue figure on record is FY2024 revenue of $39.7M reported by
      CBInsights. The company itself issued directional metrics in April 2024, claiming +50% ARR
      growth and a +60% improvement in gross margin in 2023 — statements that are company-claimed
      with no external verification. No absolute ARR figures for FY2021, FY2022, FY2023, or
      FY2025/H1 2026 are publicly available.

      CEO Ted Krantz, who joined in April 2024 from data.ai, has pivoted the business away from
      professional services toward a pure SaaS model. He stated publicly in January 2026 that one
      of his primary goals since joining has been to reach break-even by the end of 2026, confirming
      the company is currently loss-making. This is one of the few explicit financial condition
      statements from management and carries material diligence weight.

      The product suite spans core risk intelligence (Resilience Watchtower, Procurement Risk,
      Cyber, Compliance, Catastrophic Risk, TPRM, Supply Chain Mapping) and newer add-on modules
      launched under the iQ platform in April 2026 (iTariffs, iTracing, iReputation). It is unclear
      whether iQ adds-on drive incremental subscription revenue or expand the base platform contract.
    claimRefs: [CI001, CI002, CI007, CI008, CI009, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: "capital-structure"
    title: "Capital Structure & Funding History"
    body: |
      Interos has completed at least six identifiable funding events since its founding in 2005.
      The first publicly verifiable round is a Series B (~$15M) in February 2020 per SEC Form D
      (CIK 0001797451). The Series C closed in July 2021 at $100M led by NightDragon, with total
      Series C-related filings showing a $126.3M offering across 69 investors by January 2022;
      strategic co-investors Accenture and Coupa Ventures joined in December 2021 (Coupa 8-K).

      The most recent SEC filing (Form D, October 25, 2024) covers a Series D offering of $75.6M
      total, with $45.56M sold and ~$30M remaining — Blue Owl Capital led with an announced $40M
      investment. A further $20M was raised in January 2026 from existing investors Blue Owl
      Capital and Structural Capital, characterised by thesaasnews.com as a "Growth Round."

      The capital structure has shifted meaningfully: early rounds were traditional VC preferred
      equity (Kleiner Perkins, Venrock, NightDragon/Foris), while the 2024 and 2026 tranches are
      led by Blue Owl Capital (NYSE: OWL), an alternative asset manager providing structured growth
      credit rather than traditional equity. Structural Capital is similarly a venture debt/credit
      firm. This shift raises questions about dilution, coupon obligations, and covenant exposure
      that are not disclosed publicly.

      Total fundraising is contested across data providers: CBInsights reports $192.35M across
      eight rounds; Craft.co shows $125.9M; Technical.ly cited approximately $310M in January
      2026. The divergence may reflect differing inclusion of debt-like instruments, pre-2019
      rounds, or reporting errors. The SEC Form D evidence supports a conservative total of
      roughly $186-192M in identifiable structured offerings through January 2026.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI026]
    tableRefs: [TI003, TI004]
    figureRefs: [FI003, FI004]

  - id: "growth-market-position"
    title: "Growth Indicators & Market Position"
    body: |
      Interos' publicly available growth indicators are largely directional rather than quantitative.
      The April 2024 CEO-change press release described 2023 as a "record year of momentum" with
      +50% ARR growth and +60% gross margin improvement — company-claimed figures with no external
      corroboration. Neither absolute ARR for 2021, 2022, or 2023 nor the base from which the 50%
      growth was calculated appears in any source examined.

      Third-party recognition provides some indirect validation: Interos ranked #1,952 on the Inc.
      5000 in 2023 (ranking by revenue growth 2019-2022) and was named to the Deloitte Technology
      Fast 500. In October 2024 a five-year government-wide GSA contract was awarded, extending
      platform access to all DoD and civilian agencies — a potential step-change in government
      ARR if adoption scales, but no contract value was disclosed. An earlier Navy enterprise-wide
      SCRM contract (covering 30+ support organizations globally) preceded the GSA award.

      The company claims to serve "over 100 Fortune 1000 companies and numerous leading federal
      agencies" (October 2024) and "a quarter of the Fortune 100 and five of the world's largest
      banks" (financial services website). Technical.ly's January 2026 profile cited "about 100
      public and private customers," suggesting flat customer count between these two data points
      or a narrower definition of "Fortune 1000" vs. total customers. Named commercial customers
      include Google, L3Harris, Delta, and JPMorgan Chase; named government customers include
      NASA, the U.S. Navy, the Missile Defense Agency, the Defense Logistics Agency, and HHS.

      CBInsights Mosaic Score, a proprietary market-health proxy, declined 32 points in the
      30 days preceding the run date of June 20, 2026 — an adverse signal that may reflect
      investor sentiment, employee attrition data, or web-traffic trends.
    claimRefs: [CI003, CI004, CI005, CI006, CI029, CI030, CI031, CI032, CI033, CI042, CI043]
    tableRefs: [TI005]
    figureRefs: [FI002]

  - id: "unit-economics-gaps"
    title: "Unit Economics & Evidence Gaps"
    body: |
      Interos is a private company with no public audit obligation and has not filed a registration
      statement or S-1. The result is a wide evidence gap on every standard SaaS unit-economics
      metric. Gross margin is unknown in absolute terms; the company mentioned a +60% improvement
      in 2023, which is directional only and does not reveal the base level (pre-improvement margin
      could have been 20%, 40%, or 60%). Net Revenue Retention is entirely undisclosed. Customer
      Acquisition Cost and average contract value (ACV) are unverifiable from public data.

      The company has 150 employees (including contractors) as of January 2026, per CEO Ted Krantz
      speaking to Technical.ly. This headcount figure implies an implied revenue-per-employee of
      approximately $265K on $39.7M FY2024 revenue — within the range for an enterprise SaaS
      firm but not particularly efficient given the data-infrastructure intensity of monitoring
      400M+ global entities in a knowledge graph.

      The two financings from Blue Owl Capital in 14 months ($40M in October 2024 + $20M in
      January 2026) suggest cash consumption is outpacing operating cash flow. The $30M remaining
      capacity in the October 2024 Form D offering supports the hypothesis that the January 2026
      draw was from a pre-committed facility rather than a new round, consistent with staged
      growth-credit drawdowns.

      No public disclosure of burn rate, monthly cash flow, or runway is available. The break-even
      target by end of 2026 (per CEO) implies the company was consuming cash at some rate as of
      January 2026, with approximately 11–12 months of runway needed to execute the plan. This
      math requires a burn rate below the cash raised in both rounds ($65M total: $45.56M Series D
      + $20M D-II) unless earlier fundraises also contributed working capital.
    claimRefs: [CI034, CI035, CI036, CI037, CI038, CI039, CI040, CI041, CI044, CI045]
    tableRefs: [TI006, TI007]

  - id: "financial-verdict"
    title: "Financial Verdict"
    body: |
      Interos presents a mixed financial picture. The revenue trajectory — $39.7M in FY2024 after
      claimed 50% growth in 2023 — is credible given the company's Inc. 5000 inclusion, government
      contract wins, and named enterprise customers. The gross-margin improvement direction is
      encouraging, and the SaaS pivot under Krantz points toward structurally better unit economics
      over time.

      However, the financing dependency is a material concern. Two rounds in 14 months from
      alternative credit providers (not traditional VC) at a stage when the company has been
      operating for nearly 20 years signals that the business has not yet achieved self-sustaining
      cash generation. The break-even target for end of 2026 is now the primary financial milestone;
      missing it would likely require a third financing event from the same credit facility or a new
      equity raise at a valuation significantly below the 2021 $1B peak.

      The 2021 unicorn valuation ($1B) implies a 25x+ revenue multiple on FY2024 revenue — a
      multiple consistent with high-growth SaaS at that era's peak but now likely compressed to
      the 5–10x range at comparable peers after the 2022 multiple reset. No post-2021 valuation
      has been disclosed. An investor would need to assume either aggressive revenue growth in
      2025–2027 or a mark-down to underwrite a current position responsibly.

      Blocking diligence gaps are: (1) absolute gross margin, (2) NRR, (3) monthly burn rate and
      cash on hand, (4) post-Series D and D-II implied valuation, (5) government contract ARR
      share, and (6) any customer-level revenue concentration. Until these are provided under NDA,
      the financial chapter verdict is "research-more" with medium confidence.
    claimRefs: [CI007, CI009, CI043, CI044, CI046, CI047]

