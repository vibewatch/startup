callouts:
  - calloutType: "risk"
    title: "Two Credit Rounds in 14 Months Signal Ongoing Cash Burn"
    body: >-
      Interos raised $40M in October 2024 and another $20M in January 2026 — both from existing
      credit investors Blue Owl Capital and Structural Capital, not new equity investors. This
      pattern, combined with CEO Krantz's public break-even target for December 2026, indicates
      the company is consuming cash at a rate that requires external capital and has not yet
      attracted new institutional equity at a valuation above its 2021 peak. The shift from equity
      VC to structured growth credit implies the company's equity story was not compelling enough
      to attract traditional growth equity at acceptable dilution.
    claimRefs: [CI044, CI045, CI009, CI024, CI025]

  - calloutType: "risk"
    title: "No Disclosed Gross Margin, NRR, or Burn Rate — Standard SaaS Metrics Entirely Opaque"
    body: >-
      Interos has never publicly disclosed absolute gross margin, net revenue retention, or burn
      rate. The only directional signal — a +60% improvement in gross margin in 2023 — cannot
      be interpreted without a starting base. This opacity is standard for private companies but
      creates substantial diligence risk. At a $1B 2021 valuation and with $192M+ raised, investors
      would need these metrics under NDA before committing new capital.
    claimRefs: [CI036, CI037, CI039, CI043]

  - calloutType: "strength"
    title: "GSA Government-Wide Contract Is a Potential Step-Change in Addressable Revenue"
    body: >-
      The five-year GSA government-wide SCRM contract (October 2024) opens Interos' platform to
      all DoD and civilian agencies — a potential multiplier on the existing Navy, NASA, and MDA
      contracts. Government SaaS contracts are sticky, multi-year, and non-seasonal, providing
      revenue quality comparable to top-tier enterprise SaaS. If converted to full-agency
      deployments, this contract vehicle could materially expand government ARR beyond current
      named-agency deployments.
    claimRefs: [CI031, CI006, CI002]

  - calloutType: "insight"
    title: "CBInsights Mosaic Score Decline Is an Adverse Near-Term Signal"
    body: >-
      CBInsights' Mosaic Score for Interos declined 32 points in the 30 days preceding June 2026.
      The Mosaic Score incorporates web traffic, employee headcount trends, social signals, and
      investor sentiment. A 32-point decline in a single month is a meaningful deterioration and
      may reflect reduced web traffic, slow hiring, or reduced investor attention — any of which
      would be material given the company's break-even timeline.
    claimRefs: [CI042, CI009]

