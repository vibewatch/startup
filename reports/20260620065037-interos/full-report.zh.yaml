          - type: callout
            title: 推进前的优先尽调事项
            body: >-
              风险章节若要从“中高”降至“可管理”，必须先完成五项尽调：（1）完整 Blue Owl 信贷协议，包括契约和任何股权增甜；（2）FedRAMP 授权函或 ATO 文件；（3）直接员工背调，覆盖至少 10 位
              2024 年后受访对象；（4）Carahsoft 合同条款和收入分成经济性；（5）按客户分部（联邦 vs. 商业）拆分 ARR，以量化集中度。
