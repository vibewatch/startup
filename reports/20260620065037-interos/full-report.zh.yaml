      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: |
              Interos 的财务图景好坏参半。收入轨迹——2023 年宣称增长 50% 后，FY2024 收入达到 $39.7M——
              结合 Inc. 5000 入选、政府合同中标和点名企业客户来看，具备可信度。
              毛利率改善方向令人鼓舞；Krantz 主导下的 SaaS 转型，也指向长期更好的单位经济结构。

              但融资依赖是实质担忧。公司运营近 20 年后，仍在 14 个月内从另类信贷提供方
              （而非传统 VC）获得两轮融资，说明业务尚未实现自我维持的现金生成。
              2026 年底盈亏平衡目标现在是首要财务里程碑；如果错过，公司很可能需要从同一信贷额度触发第三次融资，
              或以显著低于 2021 年 $1B 峰值的估值再做一轮股权融资。

              2021 年独角兽估值（$1B）对应 FY2024 收入 25x+ 收入倍数——这一倍数符合当年高增长 SaaS 峰值，
              但在 2022 年倍数重置后，可比公司大概率已压缩到 5–10x 区间。
              2021 年之后没有披露估值。投资者若要负责任地承销当前仓位，必须假设 2025–2027 年收入激进增长，
              或接受估值下调。

