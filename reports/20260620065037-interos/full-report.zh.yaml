      - number: '5.2'
        title: 产品模块、SKU 与能力
        blocks:
          - type: paragraph
            body: >-
              Interos 将产品组织为两代产品和一系列解决方案模块。基础 Resilience Platform 覆盖六大风险领域的尽调、 持续监控和高管报告。在其之上，iQ 平台（2026 年 4 月 28
              日有限发布）增加预测分析层——公司称其为行业首个 完全产品化的 SCRM 预测分析平台——并通过 ERP 集成实现以美元计的风险量化。

              在 iQ 内部，三个模块应对 2026 年中最紧迫的宏观经济风险。itariffs 映射多层供应链（tier 1、2、3） 当前和预期关税暴露，每日更新美国 Executive Order 和 Most
              Favored Nation 数据；它包含「Similar Suppliers」 功能，可在贸易中断时快速识别替代来源。itracing 提供产品级供应链可视性，可叠加到客户物料清单（BOM）上，
              将中断追溯到具体零件、供应商和层级。ireputation 与 Dataminr 合作开发，围绕五大支柱——外国影响、品牌与运营表现、 监管与合规暴露、负面金融新闻、企业行为——提供实时声誉风险监控，每 20
              分钟更新一次。

              Resilience Watchtower 是公司的例外式监控工具，使用个性化风险模型，只呈现相对于每个客户具体业务语境最重要的供应商风险。 Supply Chain Mapping 模块提供 tier 2 和
              tier 3 供应商网络的可导航可视化。TPRM 模块提供观察名单管理， 支持可定制风险阈值和实时告警。专门解决方案页面还覆盖 Cyber Resilience（发现到 Nth tier 的隐藏供应商网络漏洞）
              以及 Compliance & Regulatory（道德采购、制裁筛查和数据保护合规）。2024 年 12 月，Interos 新增 Risk Trends （12 个月历史风险趋势线，带 90 天 delta
              和每日刷新）以及 Industry Benchmarking（与行业平均风险画像对比的同业组比较）。
