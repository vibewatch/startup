      - number: '6.4'
        title: 留存信号、合同耐久性与证据缺口
        blocks:
          - type: paragraph
            body: >
              合同耐久性有结构性信号支撑：U.S. Navy 合同是企业范围且未披露结束日期；Irving Shipbuilding 交易为多年期； GSA 政府范围合同为五年（2024–2029）。企业 SCRM
              实施涉及数据集成、工作流嵌入和已训练分析师依赖， 切换成本很高。ServiceNow、Coupa 和 SAP Ariba 平台集成进一步把 Interos 嵌入客户运营工作流。


              Interos 举办年度客户峰会（2024 年 4 月 ESG 新闻稿确认），并在 CrowdStrike 危机时刻为客户基础生成情报； 两者都指向以留存为导向的客户成功计划，而非交易式销售。Blue Owl
              战略投资公告称 Interos 受到客户「trusted by」—— 这一措辞暗示已建立、持续的关系，而非新客户标识。


              尽管有这些积极信号，关键留存指标——净收入留存（NRR）、毛收入留存（GRR）和客户生命周期价值（CLTV）——完全未披露。 没有分析机构（Gartner、Forrester、IDC）发布 Interos
              的独立留存基准。G2、SoftwareReviews 或 Gartner Peer Insights 上 缺少任何独立评论覆盖，与一家服务 100+ 企业 logo 的公司不一致，说明评论可能被系统性抑制，客户受
              NDA 约束， 或可触达评论者群体比标题数字暗示的更窄。
