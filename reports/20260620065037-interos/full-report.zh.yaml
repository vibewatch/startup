      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: Carahsoft 集中度是未缓释的单点故障
            body: >-
              所有已确认的 Interos 联邦收入都流经 Carahsoft Technology Corp.，后者还持有 DoD 和民事机构采购所用的 GSA
              主合同。这种双重集中——一个渠道伙伴、一个合同载体、一个客户类型——是投资组合里优先级最高的结构性风险。Carahsoft 关系一旦恶化（定价争议、独家权重谈判，或 Carahsoft
              自身财务承压），Interos 触达核心收入基础的能力会立即受损。尽调必须确认，若 Carahsoft 中断，Interos 是否仍有可延续的直接机构关系。
            calloutType: risk
            claimRefs:
              - CR019
              - CR022
          - type: callout
            title: Blue Owl 私人信贷显示估值承压
            body: >-
              24 个月内与 Blue Owl Capital 完成两笔私人信贷交易（2024 年 10 月 $40M、2026 年 1 月 $20M），且没有同步股权轮，强烈暗示 Interos
              若不接受可见的估值下调，就难以按 2021 年 $1B+ 的估值融资。Blue Owl 的 GP Strategic Capital 和信贷平台专门向不愿稀释股权的高增长软件公司放贷；这对 Interos
              是理性选择，但也把财务风险从股东转向债务契约和利息义务。完整信贷条款仍未披露；投资人推进前应要求公司提供。
            calloutType: risk
            claimRefs:
              - CR038
              - CR039
              - CR040
              - CR043
              - CR044
          - type: callout
            title: 没有诉讼是真正的正面信号，不是研究缺口
            body: >-
              对美国联邦法院记录（CourtListener）、专利数据库（Google Patents）和监管执法数据库的系统检索显示，截至 2026 年 6 月，没有发现涉及 Interos Inc.
              的现行或历史诉讼、知识产权争议或执法行动。这应作为正面事实保留。公司运营约 19 年，未出现重大法律敞口；对一家处理敏感政府供应链数据的 AI 公司而言，这是值得注意的信号。
            calloutType: insight
