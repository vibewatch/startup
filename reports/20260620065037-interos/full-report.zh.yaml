  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台架构与知识图谱
        blocks:
          - type: paragraph
            body: >-
              interos.ai Resilience Platform 是纯 SaaS 供应链风险情报系统，通过浏览器界面和 REST API 交付。 其基础层是 interos.ai Knowledge
              Graph——公司称其为全球最大的 B2B 关系数据库——持续映射并监控 2.5 亿+ 家公司（部分营销材料称 4 亿实体，2024 年 12 月新闻稿称 2.3 亿）和数十亿条商业关系。
              该知识图谱使用机器学习（ML）和自然语言处理（NLP）摄取大规模公开与商业数据集，发现供应商之间的连接， 并把这些连接传播到 Nth-tier 深度，不要求客户手工导入供应商数据。

              风险分析覆盖六个领域：Cyber、Financial、Geopolitical、ESG、Catastrophic（运营 / 自然灾害）和 Restrictions （制裁、贸易管制和出口法规）。每个领域都输入
              i-Score™，这是一个复合韧性评分，最早以行业首创指标推出， 把数十个子因子和数百个属性的风险信号聚合为每个供应商一个可执行分数。2022 年，Interos 增强了 i-Score 的 Cyber
              组件，加入一种新的网络行为模型，可在不依赖公开披露的情况下检测潜在有害活动，同时加入 CVE 数据、 MITRE ATT&CK® 威胁映射、云暴露评估和监管合规信号。

              交付模式是完全多租户 SaaS：客户无需安装软件或维护基础设施。Interos 管理摄取管道、知识图谱刷新周期、 模型训练和告警基础设施。平台开放 API 供程序化访问，支持与企业采购和 ERP
              系统双向流动数据。 截至 2026 年 4 月，公司推出 iQ，即第二代预测分析层，专门把 ERP 标识符匹配与知识图谱编排起来， 量化以美元计的财务暴露。
