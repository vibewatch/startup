      - number: '5.3'
        title: 集成、部署模式与合作伙伴生态
        blocks:
          - type: paragraph
            body: >-
              Interos 将平台定位为记录系统，并与客户已经使用的工具集成。2024 年 11 月，公司深化与 SAP Ariba 的合作， 把 AI 优先的风险情报集成进 SAP Ariba Supplier Risk
              采购工作流。这让 SAP Ariba 客户能够直接在 SAP 环境中访问 供应链可视性、实时数据、风险监控和嵌入风险的工作流，从而改善寻源、入驻、采购和供应商管理决策。 SAP
              产品营销高级总监确认，该集成在「从寻源到付款」生命周期内「显著增强了跨多维度实时驾驭风险的能力」。 SAP Ariba Supplier Risk API 可通过 SAP Business Accelerator
              Hub 获取，后者提供技术集成文档。

              2022 年 4 月，Interos 推出 ServiceNow 集成，并上架 ServiceNow Store，使共同客户能够在 ServiceNow Platform
              内访问子层供应链风险洞察，并触发自动化工作流。该集成让组织能够识别到 Nth tier 的子层供应商、获得风险情报， 并在现有 ServiceNow 环境内提前识别关切领域。2026 年 4 月 iQ
              发布后，集成模式扩展到通用 ERP 系统： ERP 标识符与知识图谱匹配，支持端到端工作流执行和以美元计的风险量化。Interos 也列入 Coupa marketplace。

              面向政府客户，Carahsoft Technology Corp. 担任主政府聚合商和渠道伙伴，通过多个采购载体分销平台，包括 GSA Schedule No. 47QSWA18D008F、SEWP V 合同
              NNG15SC03B 和 NNG15SC27B、ITES-SW2 Contract W52P1J-20-D-0042， 以及 NASPO ValuePoint Master Agreement
              #AR2472。商业客户部署模式是标准 SaaS 订阅并配套实施支持； 政府部署则包括 Navy 合同下的 PEO IWS 组织嵌入。
