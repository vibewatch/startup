      - 尽调路径
    rows:
      - - 欧盟企业可持续发展尽职调查指令（CSDDD，Dir. 2024/1760）
        - 欧盟
        - 2024 年 7 月生效；成员国转化仍在推进
        - 高（拉动欧盟客户需求）
        - 中（给 Interos 的欧盟客户群带来合规负担）
        - 与欧盟客户共建强制性供应链映射工作流
        - 中 — 欧盟客户可能转向欧盟注册供应商
        - 确认 GDPR DPA 覆盖范围和 CSDDD 合规路线图
      - - EU AI Act（Regulation 2024/1689）— 高风险 AI 条款
        - 欧盟
        - 高风险 AI 规则于 2026 年 8 月生效
        - 中（供应链风险评分可能被归为高风险 AI）
        - 高（合格评定、透明度、文件义务）
        - 开展 AI Act 风险分类评估；准备合格评定文件
        - 中高 — 若被归为高风险 AI，将承担持续合规义务
        - 获取风险等级分类法律意见；记录 AI 系统说明
      - - GDPR — 数据最小化和准确性（Art. 5）
        - 欧盟 / EEA
        - 2018 年起生效；执法活跃
        - 高（Interos 在供应商记录中处理欧盟自然人数据）
        - 中（罚款最高达全球收入 4%；声誉受损）
        - 落地数据处理协议；审计知识图谱中的个人数据范围
        - 中 — 实体图谱规模让完整 GDPR 合规变复杂
        - 向 Interos 索取数据处理清单和 DPA 模板
      - - NIST SP 800-161r1 / C-SCRM 联邦强制要求
        - 美国（联邦）
        - 现行（2024 年更新）；对联邦机构具有约束力
        - 高（所有联邦机构客户都必须合规；Interos 必须证明对齐）
        - 中（影响合同资格和续约）
