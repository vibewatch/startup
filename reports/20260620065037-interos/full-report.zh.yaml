      - number: '1.4'
        title: 平台能力、客户与规模指标
        blocks:
          - type: paragraph
            body: >
              Interos 平台搭建在公司所称全球最大的供应链知识图谱之上，持续映射和监控超过 4 亿个全球实体，覆盖 110 亿多条商业关系。平台 AI 引擎使用专有 i-Score
              方法为供应商打分，覆盖网络、财务、地缘政治、监管、ESG 和灾难风险向量。主要产品包括 i-Score 风险评分引擎、用于实时个性化告警的 Resilience Watchtower，以及 2024 年 10
              月推出、用于识别供应商威胁的 AI 对话工具 Ask Interos。平台还与 SAP Ariba 集成，嵌入采购工作流，扩大对采购团队的触达。

              客户规模数字存在真实冲突。TechCrunch 报道截至 2024 年 10 月约有 100 家客户，而 Christian and Timbers 案例研究及其他来源称客户为 500
              家组织。更可能的解释是，Interos 区分直接企业 / 政府客户与包含渠道或转售关系在内的更广泛装机基础。具名客户包括 Google、NASA、美国海军、L3Harris、Accenture、Freddie
              Mac、Cooper University Health Care、Vantage Data Centers、TD Bank 和 Defense Logistics Agency。

              Christian and Timbers 案例研究中的收入数据显示，收入从 2022 年的 $19.9 million 增至 2023-2024 年约 $39.7 million。TechCrunch 在
              2024 年 10 月引用了 35% 的同比收入增长。毛利率较 2022 年在 2023 年改善 60%。截至 2024 年 12 月，全职员工约 114 人；到 2026 年初，包括承包商在内为 146 至
              150 人。相对于公司 $1 billion+ 估值和总融资额，这是一支明显精简的团队。
