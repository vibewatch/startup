      - number: '8.3'
        title: 可比公司选择与局限
        blocks:
          - type: paragraph
            body: >
              Interos 位于三类可比资产的交叉点：（1）供应链风险管理 / 可视化 SaaS，（2）第三方风险管理（TPRM）/ 网络风险评级，（3）面向政府的安全分析
              SaaS。各细分市场交易逻辑不同，也没有哪一类能完全映射 Interos 同时覆盖政府 / 商业客户、AI 优先知识图谱模型和早期独角兽估值历史的组合。

              最接近的并购可比是 BitSight Technologies，Moody's Corporation 于 2023 年底以约 $2.4 B 收购。BitSight 是服务 TPRM
              市场的网络风险评级平台；分析师估计收购时 ARR 为 $150–200 M，对应 12–16x ARR 并购倍数——偏高，但对黏性强、经常性政府和企业合同而言仍可辩护。Interos 的 SCRM
              范围比纯网络评级更宽，这既可能支持溢价（TAM 更大），也可能支持折价（产品复杂度更高、销售周期更长）。Interos 关键数据网络伙伴 Dun & Bradstreet（NYSE: DNB）被
              Clearlake Capital 私有化，交易 EV 为 $7.7 B（现金股权约 $4.1 B），约为过去收入的 3.2x；但 D&B 是有 180
              年历史的数据老牌公司，增长低（2–3%），更像估值下限而非参照点。Verisk Analytics（NASDAQ: VRSK）约以 7–8x NTM 收入交易，运营利润率
              44%；其数据分析和风险评分画像相似，但规模更大、成熟度更高。私有可比包括 Exiger（供应链与 TPRM；2023 年 $150 M Series C）、SecurityScorecard（2021 年
              Series F；最近估值 $1 B+）和 Everstream Analytics（Series B，供应链中断风险）——这些公司均为私有，指标不透明。
