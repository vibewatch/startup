  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: |
      决策链从市场证据、产品证明、财务代理指标和风险因素出发，推导出「跟踪」建议及有条件上调路径。
    data:
      nodes:
        - id: n1
          label: 市场：$5–12B SCRM TAM；政府强制要求正在加速需求
        - id: n2
          label: 产品：唯一自动化多向量 SCRM AI，拥有 11B+ 实体图谱
        - id: n3
          label: 客户：100+ Fortune 1000；GSA 政府范围合同
        - id: n4
          label: 财务：2023 年 ARR 增长 +50%；~$39.7M ARR 代理值（未经审计）
        - id: n5
          label: 风险：$1B 独角兽估值锚已陈旧；依赖信贷；ARR 未验证；政府预算风险
        - id: n6
          label: 估值：基准 $450–$636M，相比 $1B 估值锚；区间太宽，不足以买入
        - id: n7
          label: 建议：跟踪——若 ARR ≥$55M 且定价股权轮确认估值锚，则上调至买入
      edges:
        - from: n1
          to: n6
          label: 市场规模支撑牛市情景的溢价倍数
