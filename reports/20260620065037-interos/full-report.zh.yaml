      - number: '7.3'
        title: 市场倍数压缩与竞争压力
        blocks:
          - type: paragraph
            body: >-
              供应链风险管理软件市场预计 2026 年规模为 $5.12B，并以 13.11% CAGR 增长，到 2031 年达到 $9.48B。 这一结构性增长提供了有利背景，但 Interos
              同时承受两侧压力。第一，拥有庞大装机基础的既有 ERP 厂商——SAP（通过 SAP Ariba）、 Oracle 和 Coupa——正在把供应链风险模块嵌入采购团队已经工作的采购流程。Interos 通过
              2024 年 10 月成为 SAP Ariba Store 认证伙伴部分缓释了这一点，但平台邻近意味着 SAP 可以在不打断渠道的情况下扩展原生功能。第二，一批资金充足的专业竞争者已经出现：
              Resilinc（2010 年成立，多层映射，为航空航天和汽车提供 AI 中断监控）、Altana AI（2018 年成立，服务政府和物流提供商的 AI 驱动全球价值链平台）等。

              估值方面，Interos 2021 年 Series C 以 $1B+ 估值完成，对应 2021 年 SaaS 市场典型 ARR 倍数—— 2022 年报告收入约 $19.9M，则隐含倍数在 50x
              区间，显著高于当前同等规模和增长私营 SaaS 公司的正常化倍数。 公司 2024 年和 2026 年转向 Blue Owl
              私人信贷，而非传统股权轮，符合一种情况：公司无法或不愿通过稀释性下调估值融资来下调既有股权估值。

              尽调问题包括：近期 Fortune 500 竞争性投标中相对 Resilinc 和 Altana AI 的 win/loss 分析，以及独立 ARR 核验以评估当前市场倍数。
