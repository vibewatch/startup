      - number: '2.5'
        title: 采用约束、限制与证据缺口
        blocks:
          - type: paragraph
            body: >
              尽管需求驱动因素强劲，几类结构性约束仍限制 SCRM 平台采用的速度和规模，任何投资或商业分析都必须仔细评估。

              ERP 既有厂商集成是主要竞争约束。SAP Ariba Supplier Risk、Oracle Procurement Cloud 风险模块和 IBM 的供应链风险工具，已经嵌入大多数 Fortune 500
              公司的采购工作流。根据 Mordor Intelligence 行业数据，集成一个专业 SCRI 平台需要 3 至 9 个月专业服务工作，造成价值实现延迟，利好已有预构建 ERP 连接器的既有厂商。Interos
              通过认证 Coupa 集成和 SAP Ariba Supplier Risk 合作部分缓解这一点，但 ERP 捆绑威胁也代表渠道风险：如果 SAP 扩展自己的 AI-native 供应链情报能力，Interos
              的独立价值主张会收窄。

              成本门槛造成中端市场缺口。根据 Mordor Intelligence 数据，SCRM 市场企业实施费每年在 $50,000 至 $200,000 之间，对 SME 来说过高。Mordor 数据还显示，62%
              制造商把成本列为最大采用障碍，尽管 71% 报告发生过重大中断——已认知风险与技术采用之间差距很显著。SME 板块增长最快（16.19% CAGR），但当前企业级 SCRI 平台基本尚未覆盖。

              数据质量限制风险评分准确性。Institute for Supply Management 报告称，58% 的供应专业人士认为供应商提交的数据不可靠，原因包括财务数据过时和设施清单不完整。这一结构性挑战影响所有
              SCRM 平台，但对 Interos 关于全面多层级映射的主张尤其尖锐：图谱质量取决于底层数据摄取的准确性和覆盖度。

              Interos 的 SAM 和 SOM、联邦采购预算预测，以及关税驱动需求在 IEEPA 执法波动时的持久性，仍存在重大证据缺口。不同分析机构的市场规模估算相互矛盾（口径差异：SCRM vs.
              ERM），若没有一手分析师访谈，难以自下而上验证 TAM。EU CSDDD 执法时间线一再推迟，也给中期欧洲需求预测带来不确定性。
