      - number: '2.3'
        title: 买方分层与采购结构
        blocks:
          - type: paragraph
            body: >
              Interos 服务两个结构不同的买方群体：美国联邦政府机构和大型商业企业。这两类客户在采购路径、预算归属、关键合规驱动因素和销售周期动态上都不同。

              美国联邦板块是 Interos 被验证最清晰的市场。Interos 持有与 GSA 签署的五年全政府范围 SCRM 合同（2024 年 6 月宣布），通过授权转售商 Carahsoft 和包括 GSA
              Schedule 47QSWA18D008F、SEWP V、ITES-SW2、NASPO ValuePoint 在内的合同工具，使所有 DoD 和民用机构都能采购该平台。公司还赢得了美国海军企业级 SCRM
              合同（2023 年），覆盖 PEO IWS 下全球 30 多个支持组织和外场活动。更早的 F-35 战斗机项目 SCRM 合同验证了 Interos 对国防工业基础的触达。联邦买方主要受行政令（EO
              14017、EO 14028）、CMMC 合规要求和 CISA 指引驱动，预算通过机构 CISO 和合同办公室配置，而非商业采购线。

              商业企业板块覆盖航空航天 / 国防、科技、汽车和金融服务等垂直领域的 Fortune 500 公司。在商业场景中，购买决策通常由首席采购官（供应链中断和寻源风险角度）与首席信息安全官（第三方网络风险、TPRM
              角度）共同拥有，预算分散在供应链、采购和风险 / GRC 线。双重归属结构提高了内部对齐要求，也让销售周期长于单一买方企业软件采购。

              Interos 的产品架构反映了这种双板块模式：iTracing 解决监管可追溯（UFLPA 强迫劳动、冲突矿产），iTariffs 解决关税暴露监控，供应链映射模块面向大型企业网络可视化，TPRM
              模块面向供应商网络和运营风险，网络韧性模块解决供应链网络安全态势。金融服务领域的第三方风险买方与供应链买方差异明显——金融服务 TPRM 按 OCC 和 DORA 监管指引聚焦网络 / 运营风险，而供应链
              TPRM 盯多层级中断。
