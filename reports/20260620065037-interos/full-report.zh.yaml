      - number: '7.6'
        title: 数据质量、技术、财务与运营风险
        blocks:
          - type: paragraph
            body: >-
              Interos 的核心价值主张押在知识图谱上：公司称该全球实体库覆盖 4 亿多个实体，映射关系超过 110 亿条。因此，数据准确性、更新速度和覆盖面就是产品的底层风险。一旦图谱里有过期条目、缺失实体（尤其是更小的
              N 级供应商或新兴市场地区），或误报预警，产品可靠性就会被侵蚀，并带来客户流失和潜在责任。Interos 在 2024 年 7 月发布的 CrowdStrike 中断分析显示，其平台能迅速识别出 674,620
              家有风险的一级企业客户，证明了运营能力；但该分析完全依赖 Interos 自有且未经验证的数据，外部无法独立校验。

              Interos 自身也依赖云基础设施交付平台；一旦云服务商宕机，Interos 出售给客户、用于防范供应链风险的监控能力也会失效。2026 年 4 月推出的 iQ 平台加入 ERP 集成（SAP
              Ariba）、关税敞口量化、多层级追踪和声誉风险评分，技术复杂度和潜在失效模式随之扩大。

              融资层面，Blue Owl 的两笔私人信贷交易（根据 SEC Form D 和公司文件，2024 年 10 月 $40M、2026 年 1 月 $20M）显示资本结构从股权转向债务。Blue Owl
              Capital 是偏信贷的资产管理公司；其对 Interos 的投资更像成长期风险债，而不是传统股权。债务融资通常附带财务契约（收入、ARR 增长、覆盖率）、利息义务，以及潜在股权转换安排。Blue Owl
              累计约 $60M 的敞口若计息，相对 2023–2024 年约 $39.7M 的披露收入，是一项不小的固定成本。

              公司尚未披露烧钱速度、毛利率或盈利路径。尽调需要包括：审计知识图谱的数据来源和刷新方法、FedRAMP 授权文件，以及 Blue Owl 信贷协议条款，包括契约阈值和任何股权增甜安排。
