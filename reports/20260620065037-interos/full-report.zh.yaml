  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >
              Interos 是一家 B2B 企业 SaaS 平台，销售 AI 驱动供应链风险情报的年度订阅许可。收入来自两个主要板块：商业企业（Fortune 1000 公司）和美国联邦政府机构（通过转售商
              Carahsoft 经 GSA Schedule 触达）。公司不公开披露定价表；企业交易逐单谈判，政府定价则通过 GSA 合同工具按谈判费率执行。


              目前记录中唯一第三方收入数字是 CBInsights 报道的 FY2024 收入 $39.7M。公司自己在 2024 年 4 月发布方向性指标，声称 2023 年 ARR 增长 +50%、毛利率改善
              +60%——这些都是公司口径，缺乏外部验证。FY2021、FY2022、FY2023 或 FY2025/H1 2026 的绝对 ARR 数字均未公开。


              CEO Ted Krantz 于 2024 年 4 月从 data.ai 加入后，已把业务从专业服务转向纯 SaaS 模式。他在 2026 年 1 月公开表示，上任以来的主要目标之一是在 2026
              年底前达到盈亏平衡，确认公司目前仍在亏损。这是管理层少数明确说明财务状况的表述之一，尽调权重很高。


              产品套件覆盖核心风险情报（Resilience Watchtower、Procurement Risk、Cyber、Compliance、Catastrophic Risk、TPRM、Supply Chain
              Mapping）以及 2026 年 4 月在 iQ 平台下推出的新附加模块（iTariffs、iTracing、iReputation）。目前不清楚 iQ 附加模块是带来增量订阅收入，还是扩展基础平台合同。
