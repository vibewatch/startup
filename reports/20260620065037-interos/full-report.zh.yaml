  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              Interos 在三个重叠竞争场域中竞争：（1）专用供应链风险情报（SCRI）平台，Altana Technologies、Resilinc、Exiger 和 Everstream Analytics
              是最接近的对手；（2）网络风险和第三方风险管理（TPRM），Bitsight（现为 Moody's 子公司）和 SecurityScorecard 在共同买方账户中重叠；（3）嵌入采购的风险模块，Coupa 和
              SAP Ariba 从支出管理工作流内部处理风险。


              Interos 的知识图谱——覆盖 2 亿多个实体和 110 亿多条关系——是其竞争定位的技术核心。iTracing 提供多层级供应商网络映射；iReputation 同时监控金融、地缘政治、网络和 ESG
              维度下 150 多个风险类别；iTariffs 增加实时关税暴露建模。截至研究日期，还没有单一竞争对手在一个平台内覆盖所有这些向量。


              政府渠道上，Interos 持有五年期 GSA 全政府范围 SCRM 合同（2024 年 6 月），覆盖所有 DoD 和民用机构，并持有美国海军企业级合同（2023 年 4 月）。Exiger
              是唯一具名且联邦足迹同样深入的竞争对手（FedRAMP Moderate 授权、60 多个联邦机构）。Altana 已确认与 US Customs and Border Protection 有合作关系，而
              Resilinc 和 Prewave 主要偏商业客户。这种分化——商业 SCRM 领导者与获政府授权的平台——是竞争格局中的主要分层轴。


              Interos 尚无已确认的 Gartner Magic Quadrant 或 Forrester Wave 入选；与此同时，Resilinc 拿到 2026 年 MQ Leader
              位置。这构成分析师可见度缺口，依赖 Gartner 推荐的企业买方在短名单阶段可能会注意到。
