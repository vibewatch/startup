              估算衡量不同市场范围，没有一手分析师访问就无法调和。两者作为上限都合理，但都会高估专业 SCRI 平台的实际可服务市场。投资建模中，在获得一手分析师验证前，更保守的 AI 原生多层级 SCRI SAM 估算应为
