  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值标记
        blocks:
          - type: paragraph
            body: >
              据 CB Insights 估计，Interos 已在四轮披露融资中累计募集 $192.35 M。创立早期融资（2019 年 12 月和 2020 年 3 月 SEC Form D）确立了公司的 Delaware
              注册实体和早期投资人基础。关键一轮是 2021 年 9 月 Series C：NightDragon 领投 $100 M，Kleiner Perkins 和 Venrock
              参投，Accenture、Coupa、ServiceNow 也投入战略资金。多家独立新闻媒体当时报道其跻身独角兽，意味着投后估值至少 $1.0 B。该轮时间点正好落在私募市场倍数高峰期，当时 B2B SaaS
              供应链公司通常可获得 30–50x 远期 ARR。

              2024 年 10 月，Interos 宣布获得 Blue Owl Capital（NYSE: OWL）管理基金提供的 $40 M“增长资本”。Blue Owl 是偏信贷的另类资产管理公司，AUM 超过 $192
              B。Jefferies LLC 担任独家财务顾问。2024-10-25 提交的 SEC Form D（Acc-No. 0001797513-24-000001）显示，发行总额为
              $75,610,033，截至提交日已售出 $45,560,033，剩余 $30,050,000；投资人为 10 名。Blue Owl
              的核心科技信贷业务通常把增长资本设计成收入挂钩或资产支持贷款，并附带股权增甜，而非定价股权轮，这解释了为何没有披露投后估值。截至 2026 年 6 月 20 日运行日，自 2024-10-25 以来未见 Form
              D 修订或新的 Form D；研究中也未找到公开新闻稿或新闻文章确认 2026 年有单独的股权定价轮。公司 2026 年 4 月发布 iQ 平台产品发布稿，但未披露融资细节。
