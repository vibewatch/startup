      - number: '4.4'
        title: 单位经济与证据缺口
        blocks:
          - type: paragraph
            body: |
              Interos 是私营公司，没有公开审计义务，也没有提交注册声明或 S-1。
              因此，所有标准 SaaS 单位经济指标都存在很大证据缺口。
              绝对毛利率未知；公司提到 2023 年毛利率改善 +60%，但这只能说明方向，无法揭示起点
              （改善前毛利率可能是 20%、40% 或 60%）。净收入留存完全未披露。
              客户获取成本和平均合同价值（ACV）无法用公开数据核验。

              CEO Ted Krantz 对 Technical.ly 表示，截至 2026 年 1 月，公司有 150 名员工（含承包商）。
              按 FY2024 收入 $39.7M 计算，这一人数对应约 $265K 的人均收入——
              落在企业 SaaS 区间内，但考虑到公司要用知识图谱监控 400M+ 全球实体，数据基础设施强度很高，
              效率并不突出。

              Blue Owl Capital 在 14 个月内提供两笔融资（2024 年 10 月 $40M + 2026 年 1 月 $20M），
              暗示现金消耗快于经营现金流。2024 年 10 月 Form D 发行中剩余的 $30M 额度支持一个假设：
              2026 年 1 月提款来自预先承诺的融资额度，而非新一轮融资，这与分阶段增长信贷提款一致。

              公司没有公开披露烧钱率、月度现金流或现金 runway。CEO 提出的 2026 年底盈亏平衡目标意味着，
              截至 2026 年 1 月，公司仍在以某种速度消耗现金，并需要约 11–12 个月现金 runway 来执行计划。
              除非更早的融资也贡献了营运资本，否则这一测算要求烧钱率低于两轮合计筹得现金
              （总计 $65M：$45.56M Series D + $20M D-II）。
