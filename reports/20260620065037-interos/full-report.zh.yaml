      - number: '6.5'
        title: 客户集中风险与采购渠道分析
        blocks:
          - type: paragraph
            body: >
              最实质的集中风险在渠道：所有美国联邦采购路径都只通过               Carahsoft Technology Corp 这一唯一政府主聚合商。 Carahsoft 持有 GSA
              Schedule（47QSWA18D008F）、NASA SEWP V（NNG15SC03B / NNG15SC27B）、ITES-SW2 （W52P1J-20-D-0042）和
              NASPO（AR2472）合同载体。Carahsoft 是美国最大的政府 IT 转售商，这降低了访问风险； 但 Interos 没有直接联邦合同关系。若 Carahsoft
              出现中断、下架或利润分成争议，所有联邦收入都会受损。


              地理集中也存在：所有公开点名商业客户都在美国（Google、L3Harris），所有联邦合同都在美国或 Five Eyes，
              尽管公司声称拥有全球供应链触达，却没有欧洲、亚太或中东点名商业客户证据。垂直集中偏国防： 八个点名客户中有四个接近 DoD（Navy、MDA、F-35 JPO、Irving
              Shipbuilding/Canadian Navy）。


              客户数集中度无法评估：Interos 不披露按客户、按板块或头部客户集中度拆分的收入。从 2024 年 12 月 100+ Fortune 1000 到任何更新数字的跳变，截至 2026 年 6
              月研究日期尚未公开发布。基于现有披露，投资者无法判断前五大客户占 ARR 的 20% 还是 80%。
