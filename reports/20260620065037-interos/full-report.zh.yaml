      - number: '3.3'
        title: 网络风险与采购相邻领域
        blocks:
          - type: paragraph
            body: >
              Bitsight 被 Moody's Corporation 以约 $2.4 billion 收购，SecurityScorecard（TITAN AI 平台、1200 多万个已评级组织）则是纯网络 TPRM
              供应商。它们与 Interos 的买方重叠出现在首席信息安全官和采购风险工作流中。Interos 自己的网络韧性产品直接处理这一重叠：它监控供应链特定网络风险向量，并让平台能在共同账户中与网络 TPRM
              供应商竞争。不过，Bitsight 被整合进 Moody's 信用风险生态后，企业风险管理和财资团队可能把网络和财务风险监控打包到 Moody's，而不是 Interos。SecurityScorecard
              覆盖广（1200 万多个已评级组织），使其成为买方后续扩展到供应链风险用例的低摩擦入口。


              采购侧，Coupa 的供应商风险和绩效模块把 TPRM 嵌入支出管理工作流，无需单独采购周期就能争夺买方预算。SAP Ariba 于 2024 年 11 月发布 Interos
              集成，明确把两个平台定位为互补——采购工作流加 AI 驱动风险监控。Coupa 自身立场也强化了这一点：Coupa Ventures 共同投资了 Interos $100 million Series
              C，Interos 又成为 CoupaLink 认证解决方案，把潜在竞争者转化为渠道伙伴。Dataminr 的实时事件情报集成进 Interos iReputation，把信号来源扩展到 Interos
              自身数据语料之外。


              结构性含义是，采购平台既是部分替代品（买方只想在现有工具内获得「足够好」风险可见性），也是分销渠道（买方从采购开始，再扩展到专用 SCRI）。Interos 受益于两种动态，但必须防守 Coupa 和 SAP
              的采购原生扩张。
