chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Interos Inc. 以 interos.ai 品牌运营，是一家总部位于弗吉尼亚州阿灵顿的私人 SaaS 公司。公司公开使命是消除每条供应链中的风险，并打造全球最可信、最透明的供应链。Interos
              将自己描述为 AI-first 的供应链风险情报公司，并把平台定位为供应链风险管理的记录系统。

              运营模式是面向大型企业和政府机构销售的纯 SaaS 订阅平台。核心产品是一张持续更新的知识图谱，映射超过 4 亿个全球实体和 110
              亿多条商业关系，使客户无需手工绘制供应链，就能监控六类风险向量——网络、财务、地缘政治、监管、ESG 和灾难。客户包括 Fortune 1000
              公司，以及美国联邦政府中覆盖国防、情报和民用领域的机构。公司收入模式是企业 SaaS 订阅，专业服务作为补充；不过 CEO Ted Krantz 在 2026
              年初表示，公司已经把重点从最初的专业服务角度转向软件工具。

              Interos 由 Jennifer Bisceglie 于 2005 年创立。她此前在供应链解决方案公司 Manhattan Associates 负责政府市场业务。一些第三方数据库列出 2017
              年创立日期，这很可能反映产品重塑品牌或技术平台升级，而非公司的原始注册时间。Interos 自己在 2022 年的新闻稿称公司创立于 17 年前，确认 2005 年。公司在弗吉尼亚注册名为 INTEROS
              SOLUTIONS, INC.。
