      - number: '5.4'
        title: 信任、合规、安全与政府部署
        blocks:
          - type: paragraph
            body: >-
              Interos 已实现相当规模的政府部署，验证了企业级就绪度，但具体安全认证仍不透明。2024 年 6 月，GSA 授予 Interos 一份五年期政府范围合同，使所有 Department of Defense
              和民用机构都可把该平台作为其 SCRM 解决方案使用。 在此之前，公司已完成 U.S. Navy、Missile Defense Agency（MDA）、NASA 和 Department of Health
              and Human Services（HHS） 的机构级部署。2023 年 4 月公布的 Navy 合同要求 Interos 嵌入 Navy 的 Program Executive Office
              Integrated Warfare Systems（PEO IWS），以支持全球 30+ 支持组织。GSA 图书馆列表将该平台归入 Schedule 518210C（IT 产品和服务）。

              该平台的 SCRM 框架与 NIST SP 800-161 Rev. 1（Cybersecurity Supply Chain Risk Management for Systems and
              Organizations， 2022 年 5 月）以及 CISA 的 ICT Supply Chain Risk Management Task Force
              指引一致；两者都要求联邦机构具备多层供应商风险可视性。 Interos 的六领域监控框架（包括 Restrictions / 制裁筛查、Cyber 和 Geopolitical）自然映射到这些框架。
              公司还监控合规风险，包括与 UFLPA 对齐的强迫劳动筛查，以及与 CMMC 对齐的网络供应链评估。

              但截至研究日期，公开政府市场中未识别出 interos.ai 的 FedRAMP 授权；对一家声称广泛政府部署的公司而言，这是一个值得注意的缺口。 SOC 2 Type II
              认证状态未公开披露。面向公众的产品文档没有描述云托管知识图谱的安全与数据处理实践。 公司合规页面描述了对供应商数据保护违规和监管合规的监控，但对自身安全姿态披露极少。
