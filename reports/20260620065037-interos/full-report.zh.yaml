      - number: '1.6'
        title: 负面信号、缺口与尽调优先事项
        blocks:
          - type: paragraph
            body: >
              几类负面和缺口信号需要任何尽调团队关注。员工评价聚合网站记录了 Interos 被反复提及的裁员和组织不稳定。Glassdoor 匿名评价因平台屏蔽无法直接核验，但独立网页搜索结果报道称其提到「constant
              layoffs」。公司当前员工数约 146 至 150 人（含承包商），明显低于 2021 年 Series C
              后高增长期，据称当时公司雇用的员工多得多。相对于总融资额，员工规模压缩与重组事件相一致，不过尚未找到公司正式公开宣布裁员。

              第三方分析来源记录了实质性平台弱点。swotanalysis.com 的 SWOT 概况指出，Interos 平均合同价值高，把可服务市场限制在最大型企业和政府机构；实施复杂、销售周期长，会劝退客户；在第 3
              层及更深供应商层级验证数据准确性存在困难，是运营限制。这些都是真实结构性风险，Everstream Analytics 和 Altana AI 等竞争对手可能凭借更易接受的定价和更快部署加以利用。

              总融资额差异仍未解决——Tracxn $224M、TechCrunch $290M、technical.ly 报道 2026 年后轮次后 $310M——需要在任何交割数据室中把 cap table
              条目与融资交割数据对齐。公司没有披露 Series D 后估值数据，因此其 2026 年独角兽身份依托的是 2021 年先例，未经过市场价格发现刷新。到 2026 年底盈亏平衡是 CEO
              的公开目标，但截至本报告日期，公司仍未盈利；员工规模不大，也显示运营杠杆有限。
