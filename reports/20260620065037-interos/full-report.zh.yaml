      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Interos 至少完成六轮融资，报告总融资额在 $290 million 至超过 $310 million 之间，取决于来源和统计方法。公司官方叙事和多份新闻稿相互印证：2019 年 1 月由 Kleiner
              Perkins 领投 $8.35M Series A，2020 年由 Venrock 领投约 $20M Series B，随后在 2021 年 7 月由 NightDragon 领投里程碑式 $100M
              Series C，估值超过 $1 billion。Series C 让 Interos 成为独角兽，也成为少数达到这一里程碑的女性领导公司之一。战略投资者 Accenture Ventures、Coupa
              Ventures 和 ServiceNow 也参与或伴随了 Series C。

              在经历强劲有机增长和连续两年 ARR 扩张后，Interos 于 2024 年 10 月从 Blue Owl Capital 融资 $40 million，用于深化 AI 能力并加速预测分析开发。Blue Owl
              在 2026 年 1 月再次参与，与 Structural Capital 共同领投又一轮 $20 million 融资，使 Series C 后外部融资总额至少达到 $60 million。2026
              年资金的公开用途是从客户收集一方数据以训练预测性 AI 模型，并推动公司到 2026 年底实现盈亏平衡。

              报告总融资额存在重大差异。TechCrunch 报道截至 2024 年 10 月公司获得「近 $290 million 风险资本」，Tracxn 则显示六轮融资仅 $224
              million；completeaitraining.com 和 technical.ly 在 2026 年 1 月轮后报道约 $310 million。差异很可能来自不同统计方法、可能存在的债务工具，或 VC
              数据库未收录的未披露轮次。所有数字都来自一家没有强制公开财务披露义务的私人公司；Tracxn 的 $224M 与新闻报道 $290M+ 之间的差距，是任何收购方或后期投资者都必须核查的具体尽调项。
