        - 大幅降轮；可能出现困境出售或契约压力
        - 低到中等概率；需要多重逆风同时出现
    notes: >-
      所有估值都是模型估计，来源包括公开 ARR 代理、市场倍数基准和已宣布增长率。未取得审计财务报表。这些是示意区间，不是独立评估价值。2026E ARR 起点假设为 2024 年 ~$39.7 M
      代理值，再按各情景增长率增长一年。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
  - id: TV005
    title: 投资论点 vs. 反论点
    columns:
      - 维度
      - 投资论点（牛市论据）
      - 反论点（熊市论据）
      - 什么会改变判断
    rows:
      - - 市场位置
        - 唯一拥有 GSA 全政府合同的自动化多向量 SCRM AI 平台；政府机构切换成本高
        - SCRM 市场分散；SAP、ServiceNow、Oracle 可以把 SCRM 原生嵌入；政府合同集中本身也是风险
        - 商业 ACV 增长高于政府的证据；NRR > 115%
      - - 收入质量
        - 2023 年 ARR 增长 +50%；毛利率改善 +60%；政府和 Fortune 500 客户黏性强
        - 2024 年 ARR（~$39.7 M）未经验证；成立以来没有审计财务报表；成长信贷结构绕开股权价格发现
        - 2025 年审计 ARR ≥ $55 M；确认 NRR ≥ 110%
      - - AI 与产品护城河
        - 专有知识图谱覆盖 11 B+ 实体关系；iQ 预测分析和关税敞口模块在 2025–2026 年上线；嵌入 SAP Ariba 和 D&B 工作流
        - AI-first SCRM 已是拥挤投资主题；Google、Microsoft、Palantir 能够规模化搭建类似知识图谱；AI 功能可能被复制
        - 已提交 / 获批专利；客户案例能验证 ROI；AI 功能提升留存的证据
      - - 融资与估值
        - Blue Owl 信贷是保住股权的低成本资本；累计融资 $192 M，使用克制
        - 5 年没有新的股权轮；$1 B 独角兽标记可能已经过时；依赖信贷会掩盖真实股权市场价值；债务认股权证带来的稀释未知
        - 新一轮有定价股权融资并披露估值；清晰披露股权结构表
      - - 退出 / 流动性
        - 对 Moody's、D&B、SAP、ServiceNow 或 Accenture 战略价值高；政府 SCRM 整合主题正在加速
        - 买方池有限；战略买家可能自建而非收购；按当前规模，IPO 路径不清晰
        - SCRM 领域 M&A 活跃；Interos ARR 超过 $100 M
      - - 监管 / 政府风险
        - 政府强制 SCRM 要求和 CMMC 创造锁定需求；GSA BPA 与多机构部署具备耐久性
        - DOGE 支出审查、持续决议风险和国会不确定性，可能让已获 GSA 批准的合同暂停或取消
        - 政府合同积压数据；确认 DoD 正在执行的部署排期
    notes: 本表总结投资论据，而非直接事实指标；每一行都把多来源证据压缩为牛市 vs. 熊市框架，应与引用的主张和证据缺口一并阅读。
    claimRefs:
      - CV030
      - CV031
      - CV032
  - id: TV006
    title: 论点失效与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 增长停滞
        - 经确认的 ARR 增长连续两个期间低于 15% YoY
        - 意味着增长溢价消失；倍数压缩至 4–6x；熊市情景启动
        - 降低仓位或放弃；要求完整 ARR 与流失审计
      - - 股权融资降轮
        - 新一轮有定价股权融资估值 < $600 M
        - 确认估值标记压缩；既有优先权结构被稀释；融资叙事走弱
        - 按新价格重新承销；评估清算优先权覆盖
      - - 政府合同取消
        - GSA 五年合同终止或不续约；DoD 机构退出 Interos 平台
        - 最大收入锚点消失；增长故事崩塌；商业收入不足以支撑 $1 B 标记
        - 立即复核；评估商业收入自我支撑能力
      - - Blue Owl 契约违约
        - 成长资本工具的契约被触发；发生修订或违约事件
        - 释放现金流承压信号；股权消耗快于模型；可能被迫 M&A
        - 要求完整契约条款和跑道分析
      - - 竞争替代
        - SAP Ariba、ServiceNow 或 Google Cloud 宣布原生多向量 SCRM 产品，并在前三大客户中替代 Interos
        - 验证自建而非购买的替代路径；扩张 ARR 承压
        - 立即检查 NRR 趋势；评估合同锁定条款
      - - 领导层不稳定
        - CEO Ted Krantz 入职（2024 年 4 月）后 24 个月内离任，且没有合格继任者
        - 执行风险、士气和投资者信心释放警讯；政府客户可能暂停续约
        - 跟踪领导层稳定性；要求继任计划
    notes: 触发阈值是从情景分析推导出的尽调经验规则，并非公司指引。它们指向大概率会迫使全面重新承销的事件，而不是机械投资规则。
    claimRefs:
      - CV033
      - CV034
  - id: TV007
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与收入拆分
        - 2023、2024、2025 年经审计或管理层认证的 ARR；拆分政府 vs. 商业
        - 验证或反驳 $39.7 M 代理值；所有估值情景的核心输入
        - 在 NDA 下直接向管理层索取；或通过数据室获取
      - - 毛利率与单位经济
        - GAAP 毛利率 %、COGS 拆分、工程 vs. 托管成本
        - 已提到毛利率改善 40%，但绝对水平未知；评估 SaaS 质量需要该数据
        - CFO 数据室；审计财务报表
      - - Net Revenue Retention (NRR)
        - 最近财年的 NRR 或 Net Dollar Retention
        - 经常性收入平台耐久性的关键指标；政府与商业 NRR 差异显著
        - 管理层披露；数据室
      - - Blue Owl 工具条款
        - 利率、契约、到期日、认股权证 / 股权增甜、提前还款
        - 决定资本成本、稀释和下行情境下的契约风险
        - 债务条款清单；数据室
      - - 2026 年融资
        - 确认任何 2025–2026 年融资事件（金额、结构、条款）；截至 2026-06-20 未提交 Form D
        - 任务提示提到 2026 年融资金额已披露；已抓取公开来源中未找到
        - 新闻稿、数据室，或 Interos IR 直接确认
      - - 股权结构表与清算优先权栈
        - 当前完全摊薄股数、期权池和清算优先权瀑布
        - 决定不同退出情景下的投资人回报；是价格—回报分析的关键
        - 数据室；法律顾问审查投资人权利协议
      - - 政府合同待履约订单
        - GSA、Navy、MDA 及其他现有合同中的固定总价或不定期交付金额
        - 衡量 ARR 之外的收入可见度；是支撑政府 SaaS 溢价的关键
        - Interos 政府合同；USASpending.gov 授标数据
      - - 员工人数与烧钱速度
        - 2022–2026 年员工人数趋势；月度现金消耗与当前现金续航期
        - 增长资本背景；烧钱速度决定 Blue Owl 信贷能把现金续航期拉长多久
        - CFO 披露；Glassdoor 员工人数代理指标
    notes: 这些待索取材料对应缺失的私营公司证据，拿到后才能收窄估值区间；null 字段反映截至运行日期仍未公开披露的信息。
    claimRefs:
      - CV035
