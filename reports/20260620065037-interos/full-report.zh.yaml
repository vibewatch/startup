      - number: '8.5'
        title: 私募市场重置与不利因素
        blocks:
          - type: paragraph
            body: >
              2021 年独角兽群体面临结构性倍数压缩。相较 2021 年高峰（高增长 B2B SaaS 的 EV/NTM 收入中位数超过 20x），公开市场倍数在 2022–2023 年急剧回调至
              6–10x，私募市场标记随后滞后 6–18 个月跟进。CB Insights 和 Bessemer 的 State of the Cloud 2024 报告指出，在 2021 年泡沫中融资的云公司，在
              2023–2025 年寻求新资本时普遍面临降价轮压力，尤其是未达到或未维持 $100 M ARR 的公司。Interos 2025 年估计 ARR 约 $40–50 M，仍明显低于单靠成长型 SaaS 指标支撑
              $1 B 私募估值通常需要的门槛。

              Blue Owl 使用增长信贷（而非新的股权轮）可能反映管理层希望避免降价轮标记。信贷投资人不设定股权估值，因此 Blue Owl 的 $40 M 额度不会更新 cap table 上的 $1 B
              独角兽标记，但也不能验证它。2024 年 Form D 发行中剩余 $30 M 未提款，可能在 2025–2026 年提取，从而解释“2026
              年融资”的说法；但这仍是信贷，不是股权。持续依赖信贷结构而非股权轮本身就是不利信号：它暗示股权投资人不愿按管理层可接受的价格给公司标价。没有直接证据显示 Interos 曾被接洽收购，但政府合同、AI
              差异化和不理想的股权市场通道叠加，使战略买方退出——Moody's、Dun & Bradstreet、SAP 或 ServiceNow——成为未来 3–5 年最可能的变现路径。
