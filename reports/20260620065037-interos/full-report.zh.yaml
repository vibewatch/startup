      - number: '7.5'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Interos 所处监管环境既是需求驱动，也是合规负担。需求侧，EU Directive 2024/1760（Corporate Sustainability Due Diligence Directive， 即
              CSDDD）于 2024 年 7 月进入欧盟法律，对大型欧盟公司施加强制供应链尽调义务——这直接拉动 Interos 这类平台。 同样，Biden Executive Order 14017 关于供应链韧性，以及
              NIST SP 800-161r1 关于 Cybersecurity Supply Chain Risk Management， 对美国联邦机构及其承包商施加合规义务，而这些主体都是 Interos 的潜在客户。

              负担侧，EU AI Act（2024-2026 分阶段推出）可能把 Interos 的 AI 驱动风险评估归类为高风险 AI 系统——尤其是其金融和限制领域评分—— 进而施加合格评定、文档和透明度义务。GDPR
              Article 5 要求 Interos 处理公司高管个人数据，或嵌入供应商记录的个人数据时， 满足数据最小化、准确性和合法性标准；知识图谱覆盖 4 亿全球实体，潜在受监管数据范围很大。U.S. Export
              Administration Regulations（EAR, 15 CFR 730-774）可能适用于 Interos 向非美国人出口涉及两用实体或外国技术供应商的供应链情报数据。

              截至本研究，Interos 没有确认的 FedRAMP 授权，未识别出公开专利申请，也未在公开法律数据库中发现涉及 Interos 的诉讼、 监管执法或 IP 争议。这些缺席是真实发现，不是缺口。公司法律顾问（据
              Blue Owl 新闻稿为 Cooley LLP）和董事会构成 （Verdecanna、DeWalt）显示其具备机构能力，但公司没有公开披露合规认证或监管状态。
