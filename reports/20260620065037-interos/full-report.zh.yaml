      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪 — 待收入验证后有条件上调至买入
            body: >
              Interos 是定义品类的 SCRM AI 平台，政府和商业牵引力可信，但 2021 年 $1 B 独角兽标记很可能已经过时；在基准情景下，真实股权价值大概率落在 $350–$636 M 区间。没有经审计
              ARR、确认的 NRR、cap table 披露或新的定价股权轮，证据不足以支持按 2021 年标记或接近该标记入场。价格发现出现前应继续跟踪。
            calloutType: recommendation
            claimRefs:
              - CV030
              - CV034
              - CV035
          - type: callout
            title: 不利信号：依赖增长信贷可能掩盖降价轮风险
            body: >
              Blue Owl 的 $40 M 增长资本额度并未给股权定价。尽管 ARR 增长叙事强劲，五年没有新的股权轮，仍让人质疑股权投资人是否不愿满足管理层的价格预期。这是典型的私募市场估值不透明模式。2024 年
              Form D 上 $30 M 未提款余额可能在 2026 年提取，但仍是债务，不是设定估值的股权。投资人应要求完整披露契约、认股权证和 cap table，再假设 $1 B 标记仍有效。
            calloutType: risk
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 关键假设：约 $39.7 M ARR 代理值方向正确
            body: >
              所有估值情景都依赖第三方聚合商给出的约 $39.7 M 2024 年 ARR 代理值。本轮研究中，该数字未能从一手来源（公司披露、经审计报表或 Interos 投资人信）确认。若实际 ARR 明显更低（例如
              $25–30 M），基准和牛市情景将显著压缩；若更高（例如 $55–65 M），熊市情景不再意味着降价轮。收入验证是最关键的单一尽调事项。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV011
