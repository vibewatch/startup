      - number: '4.3'
        title: 增长指标与市场位置
        blocks:
          - type: paragraph
            body: |
              Interos 公开可得的增长指标大多只能指示方向，缺少硬数。
              2024 年 4 月 CEO 更替新闻稿称，2023 年是「动能创纪录的一年」，
              ARR 增长 +50%，毛利率改善 +60%——这些均为公司口径，缺少外部佐证。
              被审阅来源中没有披露 2021、2022 或 2023 年的绝对 ARR，也没有说明 50% 增长从哪个基数算起。

              第三方认可提供了一些间接验证：Interos 在 2023 年 Inc. 5000 中排名第 #1,952
              （按 2019-2022 年收入增长排名），并入选 Deloitte Technology Fast 500。
              2024 年 10 月，公司获得一份五年期、政府范围的 GSA 合同，平台访问扩展到所有 DoD 与民用机构——
              如果采用放大，政府 ARR 可能阶跃上行，但合同金额未披露。
              更早之前，公司已获得 Navy 企业级 SCRM 合同，覆盖全球 30+ 支持组织，早于 GSA 授标。

              公司称服务「超过 100 家 Fortune 1000 公司和众多领先联邦机构」（2024 年 10 月），
              也称服务「Fortune 100 的四分之一，以及全球最大银行中的五家」（金融服务网页）。
              Technical.ly 在 2026 年 1 月的报道引用「约 100 家公私营客户」，
              这暗示两个时间点之间客户数量持平，或「Fortune 1000」与总客户口径更窄不同。
              已点名商业客户包括 Google、L3Harris、Delta 和 JPMorgan Chase；
              已点名政府客户包括 NASA、U.S. Navy、Missile Defense Agency、Defense Logistics Agency 和 HHS。

              CBInsights Mosaic Score 是专有市场健康度代理指标；截至 2026 年 6 月 20 日运行日前的 30 天内，
              Interos 分数下降 32 点。这是一个反向信号，可能反映投资者情绪、员工流失数据或网站流量趋势。
