      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Jennifer Bisceglie 于 2005 年创立 Interos，并担任 CEO 至 2024 年 4 月，带领公司实现 232% 的三年 CAGR，并在 2021 年 7
              月完成独角兽融资事件。2024 年 4 月，董事会推动领导层交接，任命资深 SaaS 高管 Ted Krantz 为 CEO；Bisceglie
              转任创始人兼执行副主席，并加入董事会。两人同时进入董事会，形成双领导结构，意在把 Bisceglie 的行业愿景和政府关系，与 Krantz 的企业级规模化运营经验结合起来。高管猎头公司 Christian
              and Timbers 主导了 CEO 搜寻，并把这次交接描述为公司接近 $40M 收入时，对创始人主导扩张瓶颈的回应。

              Ted Krantz 拥有 20 多年 AI 和 SaaS 领域 CEO 及高管领导经验。他最近担任 data.ai CEO，在任内推动经常性收入显著增长和 AI 采用。此前他曾在 Skai、C3.ai、SAP
              America 和 Oracle 担任高级职位。Krantz 的初始任务是加速 ARR 增长、改善毛利率、深化 AI 能力，并推动公司走向盈亏平衡。

              董事会治理包括 NightDragon 创始人兼 CEO Dave DeWalt。他担任董事会成员，并曾被描述为董事长；此前他曾任 FireEye、McAfee 和 Documentum CEO。Frank
              Verdecanna 于 2024 年 10 月加入董事会，带来 Mandiant CFO 经验，包括 Mandiant 以 $5 billion 出售给 Google 的交易经验，预计将贡献财务纪律和 IPO
              准备视角。Yardley Pohl 担任首席产品与技术官，Chris Lee 担任首席营收官，两人均在 2024 年末与 Verdecanna 一同获任，是 Krantz
              上任后高管团队扩建的一部分。董事会还设有顾问层，曾包括 Microsoft 的 Edna Conway 和前英国联合部队司令 Sir Chris Deverell。

              关键人物风险仍然重大。Krantz 是公司当前增长阶段的主要运营领导者和公开门面。Bisceglie
              继续参与董事会，为政府关系和使命叙事提供连续性；但这次交接让执行依赖一支新近到位的领导团队，而该团队掌舵后的第一个完整财年仍在进行中。
