      - number: '8.2'
        title: 收入代理与 ARR 背景
        blocks:
          - type: paragraph
            body: >
              Interos 不公布经审计财务。唯一公开收入信号是 2024 年 4 月新闻稿：公司称 2023 年“ARR 增长 +50%”，同时“毛利率改善 +60%”。公司还称实现“创纪录增长”，并提到入选
              Deloitte Technology Fast 500 和 Inc. 北美增长最快公司榜。如果 2024 年 ARR 代理值约 $39.7 M 准确（该数字见于分析师数据库，但未由一手来源独立确认），且
              2025–2026 年增速仍接近 30–50%，则 2026 年 ARR 达 $50–$80 M 是乐观基准情形。CB Insights 将 Interos 列入 Unicorn
              Tracker，意味着该数据聚合商仍承认 2021 年 $1 B 是公司最后一次官方估值。自 2021 年 9 月以来没有新的股权轮，因此 $1 B 独角兽标记是唯一被官方跟踪的估值；之后的一切推断都来自模型。

              Blue Owl 所谓“增长资本”投资更可能传递资本成本信号，而不是价格信号；Blue Owl 的科技信贷平台通常按 12–18% 的综合收益率放贷，而不是设定股权 NAV。因此，投资人不能把 2024
              年交易解读为新的股权估值，这也是使用另类信贷的组合公司常见的不透明来源。
