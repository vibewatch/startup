  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险全景与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Interos 位于国家安全、企业采购和 AI 监管的交汇点，这一位置同时放大机会和暴露。公司的风险画像由六个相互锁定的维度主导： （1）领导层与执行风险，源自 2024 年 4 月创始人 CEO
              Jennifer Bisceglie 被 Ted Krantz 取代，以及 C-suite 同期全面更替； （2）公共部门集中和渠道依赖，Carahsoft 是政府范围 GSA
              合同下唯一确认的联邦分销商；（3）竞争和市场倍数压缩， 既有 ERP 厂商正在捆绑 SCRM 模块，私营公司估值也从 2021 年峰值普遍压缩；（4）EU CSDDD、EU AI Act、GDPR 和美国
              NIST C-SCRM 要求下的监管与法律合规义务；（5）数据质量和技术可靠性风险，因 4 亿+ 实体覆盖主张未经验证； （6）财务与融资风险，源自转向 Blue Owl
              私人信贷，暗示契约约束和潜在股权稀释压力。

              下方风险热力图按可能性和影响对每个维度排序。大多数剩余严重性分数处于中到高区间，反映出新领导团队的缓释工作仍在早期。 截至 2026 年 6 月，公开法律数据库中未识别出涉及 Interos 的监管执法、IP
              诉讼或活跃诉讼——无诉讼本身是一个真实正面发现， 并在此保留。
