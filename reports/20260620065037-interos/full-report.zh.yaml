      - number: '6.2'
        title: 点名客户证据与生产使用证明
        blocks:
          - type: paragraph
            body: >
              Interos 点名客户名单的生产证据强弱不一。最强的是 U.S. Navy 和 Irving Shipbuilding，两者都有具名高管引述确认平台部署。 PEO IWS Deputy Program
              Manager Robert Stukes 确认，Navy 部署「正在加速我们从分析滞后风险指标转向领先风险指标」—— 这是运营使用而非试点的证据。Irving Shipbuilding VP Strategic
              Development Aaron Plamondon 确认， 该平台「将用于映射和监控我们在造船和舰队维护项目中的扩展供应商基础」。


              Google 和 L3Harris 出现在两份不同的 Interos 新闻稿中（2024 年 11 月和 12 月），但没有具名高管引述或结果指标。 它们被纳入 Blue Owl Capital
              投资公告，提供了第二层佐证。NASA 和 MDA 出现在 2024 年 6 月 GSA 合同新闻稿中， CEO Ted Krantz 确认它们是现有用户。2019 年 4 月 F-35 Joint Program
              Office 授标是最早核验到的点名合同。


              Anglicotech SC-ROC 部署（2024 年 3 月）代表一种伙伴中介渠道：这家苏格兰国防公司部署 Interos 的 SC-ROC 产品，
              为自身国防客户服务，提供了具名伙伴引用，但最终客户身份未披露。Delta、JPMorgan Chase 和 Accenture 出现在 2024 年 11 月 Risk Intelligence
              Summit；新闻稿没有确认它们的准确角色是客户、潜在客户还是伙伴。


              独立评论覆盖几乎缺席：SoftwareReviews.com 返回零条评论，G2 页面无法访问，Hacker News 没有自然讨论。 这在公司宣称客户数量与可独立验证的引用质量之间制造了显著缺口。
