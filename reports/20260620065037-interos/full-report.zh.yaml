      - number: '7.4'
        title: 公共部门集中与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Interos 最具战略集中度的风险，是依赖通过单一渠道分销商路由的美国联邦政府收入。Carahsoft Technology Corp. 是 Interos 联邦销售的确认分销商，持有 SEWP V 和 GSA
              Schedule 合同，机构通过这些合同采购。GSA 于 2024 年 6 月授予的政府范围 SCRM 合同——把 Interos 平台扩展到所有 DoD 和民用机构——以 Carahsoft
              作为主渠道。这形成三层集中：（a）客户类型 （联邦政府），（b）合同载体依赖（通过 Carahsoft 的 GSA），（c）年度拨款风险（联邦预算受持续决议、自动削减和项目取消影响）。

              其他点名政府客户——U.S. Navy（2023-2024 企业 SCRM 合同）和 Canada's Coast Guard——放大的是部门集中，而非分散。
              商业客户（Google、L3Harris、JPMorgan Chase、Delta 等）存在，但它们占 ARR 的份额未披露，真实集中比例不透明。 Interos 宣布与 SAP
              Ariba、ServiceNow、Dun & Bradstreet 和 Coupa 合作，可能帮助平台在政府之外商业化； 但集成伙伴关系不等于直接收入多元化。

              本次审阅未能在 FedRAMP 市场确认 FedRAMP 云授权状态。联邦民用机构采购云软件通常需要 FedRAMP 授权； 其缺席（或无法确认存在）是任何政府收入论点的实质尽调问题。
