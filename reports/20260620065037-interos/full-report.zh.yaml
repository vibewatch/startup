      - number: '7.2'
        title: 领导层过渡与执行风险
        blocks:
          - type: paragraph
            body: >-
              最急迫的近期风险是 2024 年领导层全面换血。Jennifer Bisceglie 于 2005 年创立 Interos，并领导公司近二十年； 2024 年 4 月 16 日起，Ted Krantz 接任
              CEO。Krantz 来自 data.ai，曾任 CEO，此前也在 SAP America 和其他企业软件公司任职。 同时，Yardley Pohl 被任命为 Chief Product and
              Technology Officer（此前在 C3.ai 和 Salesforce 任职）， Chris Lee 加入担任 Chief Revenue Officer。Christian & Timbers
              高管猎聘案例研究将这一情形描述为成长阶段转型， 需要一位商业导向 CEO 推动下一阶段规模化——这一表述符合一家创始人主导的产品公司需要加速市场进入的状态。

              这种程度的 C-suite 变动带来实质执行风险：绑定创始人的客户关系、政府合同基础的机构知识、文化连续性都会承压。 Glassdoor
              和类似员工评论平台在本次研究中返回机器人防护阻断，无法直接访问员工情绪数据——这是已确认缺口。 截至 2026 年 6 月，layoffs.fyi tracker 未发现涉及 Interos
              的裁员事件，这是正面指标，但也可能源于该 tracker 对较小私营公司覆盖不完整。 2024 年 10 月 25 日提交的 SEC Form D 将 Bisceglie 列为 Director，将 Krantz
              列为 Executive Officer，确认两人仍正式参与。 Frank Verdecanna（前 Mandiant CFO）加入董事会提供治理连续性，但董事会构成无法替代中端市场联邦销售中的运营深度。

              尽调问题包括：直接员工情绪审计（结构化 Glassdoor/Blind 查询或背调访谈）、客户关系映射以识别主要由 Bisceglie 还是新团队维护的账户， 以及政府获客和客户成功职能的流失数据。
