      - number: '3.4'
        title: 护城河耐久性与赢单 / 输单动态
        blocks:
          - type: paragraph
            body: >
              Interos 最可防守的护城河是知识图谱规模、政府采购渠道，以及 Coupa/ServiceNow/SAP 分销生态。知识图谱——2 亿多个实体、110
              亿多条关系、历经近二十年构建——任何新进入者或收购方都无法快速复制。不过，Altana 的 6 亿家公司图谱说明竞争性图谱可以做出来；Interos
              的优势在于多领域覆盖（金融、监管、地缘政治、网络同时覆盖），而不只是原始规模。


              GSA 五年合同是结构性护城河：它提供一个采购工具，使所有美国 DoD 和民用机构无需单独 RFP 就能采购 Interos。Exiger 拥有 FedRAMP Moderate 授权，也竞争同一批机构，但
              GSA schedule 为民用买方提供更快路径，降低采购摩擦。Navy 企业级合同提供一个大型、可续约锚定账户。政府合同续约和 CISA 相关供应链风险支出都是顺风。


              具名商业赢单包括 Google（全球 SCRM）、L3Harris Technologies（企业级国防 SCRM）和 F-35
              战斗机项目——这些参考客户难以被替换，也向新企业买方传递信任信号。这些案例支持溢价定价，并帮助 Interos 在不依赖分析师短名单的情况下进入 RFP。


              主要赢单 / 输单风险因素包括：（1）Resilinc 的 Gartner MQ Leader 身份在受 Gartner 影响的采购流程中为 Resilinc 带来入站需求；（2）Exiger
              的政府渗透在新机构投标中挤压 Interos；（3）Bitsight/Moody's 捆绑在财务风险买方中心替代 Interos；（4）价格敏感性——Interos 高 ACV 限制其进入中端市场。2026 年
              4 月 iQ 产品发布（AI 驱动的高管级供应链简报界面）呼应 Resilinc 的 agentic AI 定位，显示 Interos 正在投资高管仪表盘战场，但尚无独立证据证明买方采用。切换成本有意义：API
              集成、供应商入驻工作流，以及基于 Interos 数据构建的仪表盘，都会造成重新平台化摩擦；但若竞争对手拥有可比联邦授权且 ACV 更低，可能侵蚀中型企业板块。
