      - number: '1.5'
        title: 里程碑时间线与政府进展
        blocks:
          - type: paragraph
            body: >
              公司公开里程碑从 2005 年创立开始，经历多年运营建设，并在 2019 年正式进入风险资本阶段。公司的拐点是 2021 年 7 月 Series C 和独角兽身份；此后公司在 2022 年 2
              月新闻稿中声称三年 CAGR 为 232%，客户增长 181%。2023 财年按 ARR 增长和利润率改善指标是历史最强一年，推动董事会引入具备企业级规模化经验的 CEO 领导层。

              政府进展是 Interos 最强的差异化因素之一，也是最重要的收入线之一。公司最重要的政府成果是 2024 年 6 月与美国 General Services Administration
              签署的五年合同，把平台扩展至所有国防部和民用机构客户。该 GSA 合同通过分销伙伴 Carahsoft 交付，形成覆盖一百多个机构的全政府范围 SCRM 采购工具。在此之前，Interos
              已经在美国海军、Missile Defense Agency、NASA、Health and Human Services 实现机构级部署，并在 2024 年初宣布与 Canadian Coast Guard 和
              Royal Canadian Navy 签署大型多年合同。

              2024 年，公司还同时完成三个重要运营里程碑：Blue Owl 注资、SAP Ariba 合作，以及 Ask Interos 发布，三者都在 2024 年 10 月公司首届 Risk Intelligence
              Summit 上一并公布。同月 Frank Verdecanna 加入董事会，引入具备公开市场和 M&A 经验的财务高管，可能是在为最终 IPO 或战略退出做准备。2026 年 1 月 $20M 融资以及到
              2026 年底盈亏平衡的公开目标，是最近的公开里程碑，也表明公司现在从不惜代价增长转向盈利能力。
