      - number: '2.4'
        title: 增长驱动因素与需求催化剂
        blocks:
          - type: paragraph
            body: >
              供应链风险情报需求由地缘政治、监管和运营力量汇合驱动，并在 2025–2026 年加速。

              监管要求是 Interos 政府板块最强、最持久的需求驱动因素。UFLPA（2021 年 12 月 23 日签署）建立可反驳推定：来自新疆维吾尔自治区的商品禁止进口，从而为多层级供应商追踪创造法律要求。CBP
              积极执行 UFLPA，并发布货物扣留公开仪表盘。CMMC Phase 1 于 2025 年 11 月 10 日启动，要求 DoD 承包商遵守包含供应链安全要素的网络安全标准。CISA ICT SCRM Task
              Force（2018 年 12 月成立）和 NIST SP 800-161 Rev. 1（2022 年 5 月发布）提供支撑联邦合规要求的框架。EU Corporate Sustainability Due
              Diligence Directive（CSDDD）为欧洲相关供应链的人权审查工具创造平行需求。

              地缘政治扰动在 2025–2026 年加剧。Interos 自己在 2026 年 6 月的博客提到，Pentagon 的 Section 1260H 清单扩大至 188 家中国军方关联公司；2026 年初
              IEEPA 关税变化显著提升了关税暴露监控需求。US-India Critical Minerals Framework（2026 年 5 月在 Quad
              伙伴关系下签署）显示政府对从中国分散供应链的兴趣增强，尤其是电子和稀土投入品。这些地缘政治事件直接扩大了实时供应链监控平台的可服务需求。

              运营和商业驱动因素包括：网络保险承保人越来越要求连续第三方网络监控作为承保前提；企业 ESG 和强迫劳动披露要求；以及大型企业平均每年 $184 million 供应冲击成本的记录。Gartner 发现 89%
              的公司过去五年经历过供应商风险事件，再叠加技术采用让风险策略有效性提升 2x 的记录，验证了 SCRM 平台的商业理由。
