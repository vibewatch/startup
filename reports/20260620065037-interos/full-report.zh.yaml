              Coupa 通过 Coupa Ventures 基金投资 Interos，完成 $100M Series C；Interos 也获得 CoupaLink 认证。这种投资者兼渠道关系降低了 Coupa
              自建竞争性原生 SCRM 模块的风险，并打开 Coupa 企业支出管理客户基础，成为 Interos 的入站管道。SAP Ariba 的互补集成（2024 年 11 月）把同样的渠道逻辑延伸到 SAP 生态。
