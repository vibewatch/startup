      - number: '4.2'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: |
              Interos 自 2005 年成立以来，至少完成了六次可识别融资。
              第一轮可公开核验的融资是 2020 年 2 月的 Series B（约 $15M），依据 SEC Form D
              （CIK 0001797451）。Series C 于 2021 年 7 月完成，规模 $100M，由 NightDragon 领投；截至 2022 年 1 月，
              Series C 相关申报显示，本轮发行总额为 $126.3M，覆盖 69 名投资者；
              战略共同投资方 Accenture 与 Coupa Ventures 于 2021 年 12 月加入（Coupa 8-K）。

              最新 SEC 申报（Form D，2024 年 10 月 25 日）覆盖一笔总额 $75.6M 的 Series D 发行，
              其中已售出 $45.56M，剩余约 $30M——Blue Owl Capital 领投，并公告投资 $40M。
              2026 年 1 月，公司又从现有投资方 Blue Owl Capital 与 Structural Capital 融资 $20M，
              thesaasnews.com 将其称为「增长轮」。

              资本结构已经明显转向：早期轮次是传统 VC 优先股融资（Kleiner Perkins、Venrock、NightDragon/Foris），
              2024 年和 2026 年两笔资金则由 Blue Owl Capital（NYSE: OWL）主导。Blue Owl 是另类资产管理人，
              提供结构化增长信贷，而非传统股权。Structural Capital 同样偏向创投债 / 信贷。
              这一转向引出稀释、票息义务和契约约束暴露等问题，但公司没有公开披露。

              各数据提供商对总融资额说法不一：CBInsights 报告八轮共 $192.35M；
              Craft.co 显示 $125.9M；Technical.ly 在 2026 年 1 月引用约 $310M。
              分歧可能来自是否计入类债务工具、2019 年前轮次，或报告错误。
              SEC Form D 证据支持一个保守结论：截至 2026 年 1 月，可识别结构化发行总额约为 $186-192M。
