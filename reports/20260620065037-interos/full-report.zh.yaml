      - number: '6.3'
        title: 客户采用轨迹与市场牵引
        blocks:
          - type: paragraph
            body: >
              Interos 的增长轨迹由多个第三方代理指标体现：Inc. 5000 #1952（三年增长 310%）、Deloitte Technology Fast 500 （2018–2021 年增长
              310%），以及确认的 2023 年 ARR 增长 +50%、毛利率改善 +60%。这些连续高增长信号与一家 成功规模化转化企业客户标识的 SaaS 公司相符，而不只是试点或概念验证收入。


              伙伴生态一直是关键采用推动器。ServiceNow 集成（2022 年 4 月）将 Interos 打开给 ServiceNow 的企业客户基础。 CoupaLink 认证（2022 年 5 月）触达 Coupa
              的采购用户群。2024 年 12 月 SAP Ariba 在线集成深化了进入 SAP 庞大采购和 供应链客户生态的路径。这种平台嵌入策略把既有采购平台用户转化为 Interos 客户，不需要单独销售动作。


              从 F-35 JPO 合同（2019）到 Navy 企业部署（2023），再到政府范围 GSA 授标（2024），构成五年联邦扩张弧线：
              从单一项目，扩展到企业范围，再扩展到政府范围合同权限。CrowdStrike 宕机分析（2024 年 7 月）显示，全球危机期间平台在客户基础中实时活动， 说明已部署账户是活跃使用，而非买来闲置，平台粘性较高。
