      - number: '5.5'
        title: 路线图、产品市场契合证据与局限
        blocks:
          - type: paragraph
            body: >-
              Interos 的产品路线图体现出一条有意设计的弧线：从基础监控走向预测和处方式情报。公司在 2024 年 12 月宣布， 正在建设「行业首个预测分析平台」，并把 Risk Trends 和
              Benchmarking 称为该预测能力的基础组件。 2026 年 4 月 iQ 发布兑现了这一方向，但仅限部分客户有限发布——也就是说，截至研究日期，广泛正式可用尚未实现。 公司 Chief Product
              and Technology Officer Yardley Pohl 称，iQ 让组织能够「以美元量化暴露，并用 CFO 每天使用的语言沟通风险」， 反映出产品定位转向 C-suite 和财务导向。

              产品市场契合证据在政府部门最强：Navy 企业部署、NASA、MDA、HHS 和 GSA 政府范围合同合在一起，构成多年期、 企业级、已验证部署。商业部门方面，Vantage Data Centers（数据中心
              TPRM）在 2026 年 4 月 iQ 新闻稿中给出正面引述； 一家未具名全球银行使用 Resilience Watchtower 管理第三方网络和财务风险阈值。公司称截至 2024 年拥有 100+
              Fortune 1000 客户。 CEO Ted Krantz 受邀参加 2025 年 1 月达沃斯 World Economic Forum 年会，显示 C-suite 层面的市场认可。

              关键局限与缺口包括：（1）实体数量口径不一致（不同材料中分别为 230M、250M 和 400M），引发数据质量问题； （2）截至 2026 年 4 月，iQ
              仍处于有限发布；（3）尽管政府合同深度很强，仍缺少公开确认的 FedRAMP 授权； （4）关于知识图谱数据来源、刷新频率和准确性方法的公开技术文档有限；（5）Gartner 观察称，真正具备预测分析能力的
              SCRM 平台「即便有，也很少」——说明市场对供应商在这一领域的主张持怀疑态度。
