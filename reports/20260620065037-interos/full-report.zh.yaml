      - number: '2.2'
        title: 市场规模——TAM、SAM 与分析师估算
        blocks:
          - type: paragraph
            body: >
              SCRM 市场最具体的第三方估算来自 Mordor Intelligence，其将全球市场在 2026 年估为 $5.12 billion，并预测到 2031 年增长至 $9.48 billion（13.11%
              CAGR）。Mordor 按组件（软件领先，占 68.24%）、部署方式（云占主导，72.41%）、企业规模（大型企业 64.47%）、风险类型（网络安全风险 27.53%）和地区（北美
              38.63%）拆分市场。这些拆分有参考价值，但可信度存在中等风险，因为 Mordor 不披露方法论或一手数据来源，这也是二线市场研究公司的典型情况。

              MarketsAndMarkets 预计更广义的企业风险管理市场——其中包括 TPRM 子板块——2025 年为 $6.0 billion，到 2030 年增至 $11.97 billion（14.8%
              CAGR）。另一个第三方风险管理市场报告则预计 TPRM 板块快速增长，与 Interos 的 SCRI 定位重叠。这两个估算不能与 Mordor 的 SCRM 估算直接比较：Mordor 口径更窄（特定于
              SCRM），而 MarketsAndMarkets 覆盖更广的 GRC 包含范围。含义是，Interos 这类专业 SCRI 平台可服务的软件市场很可能只是 Mordor TAM 中的 $1–2
              billion，而不是完整 $5.12 billion。

              Gartner 是该领域声誉最高的分析机构，但在免费公开内容中不发布独立 SCRM 市场规模；不过 Gartner 调研数据显示，89% 的公司在过去五年经历过供应商风险事件，使用 SCRM
              技术的公司风险缓释效果约为 2x——这说明底层需求强劲，但未给出离散市场规模数字。每家企业每年因全球供应冲击承担 $184 million 成本（据 Interos/ServiceNow
              新闻材料）进一步提供了买方付费意愿背景，不过该数字来自公司控制的来源。

              市场集中度：SAP、IBM、Oracle、Resilinc 和 Coupa 合计持有约 35% 市场份额，剩余 65% 由包括 Interos、Exiger、Sayari 等在内的专业平台争夺。软件贡献 68%
              收入，云部署占 72%。亚太是增长最快地区，CAGR 为 14.16%；但北美仍是最大市场，占 38.63%，也是 Interos 的主要收入基础。
