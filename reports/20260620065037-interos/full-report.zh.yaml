          to: n6
          label: 增长率决定倍数档位
        - from: n5
          to: n6
          label: 不确定性拉宽区间
        - from: n6
          to: n7
          label: 区间太宽；需要价格发现
    claimRefs:
      - CV019
      - CV020
      - CV030
  - id: FV002
    title: ARR 与倍数的估值敏感性
    type: bar
    layout: wide
    summary: |
      隐含股权价值在 ARR 情景（低 / 中 / 高）和 ARR 倍数情景（5x / 10x / 15x）下的敏感性，用来拆分 $1B 独角兽差距中有多少来自倍数、有多少来自收入。
    data:
      items:
        - label: ARR $44M × 5x 倍数
          value: 220
        - label: ARR $44M × 10x 倍数
          value: 440
        - label: ARR $44M × 15x 倍数
          value: 660
        - label: ARR $52M × 5x 倍数
          value: 260
        - label: ARR $52M × 10x 倍数
          value: 520
        - label: ARR $52M × 15x 倍数
          value: 780
        - label: ARR $68M × 5x 倍数
          value: 340
        - label: ARR $68M × 10x 倍数
          value: 680
        - label: ARR $68M × 15x 倍数
          value: 1020
        - label: 2021 年独角兽估值锚
          value: 1000
    approximationNotes: >-
      ARR 情景以 ~$39.7M 的 2024 年 ARR 代理值为基础，套用 10–70% 增长建模。5–15x 倍数区间反映当前私募市场对增长 10–50%+ 的企业 SaaS 公司的基准。$1,000M 柱为 2021
      年独角兽参考估值锚。所有数值均为百万美元。
    claimRefs:
      - CV019
      - CV021
      - CV022
  - id: FV003
    title: 各情景估值区间
    type: range
    layout: standard
    summary: |
      三个情景（熊市、基准、牛市）各自的低到高估值区间，并把 2021 年独角兽估值锚作为参考锚点。
    data:
      items:
        - label: 熊市情景
          low: 220
          high: 322
          midpoint: 271
        - label: 基准情景
          low: 450
          high: 636
          midpoint: 543
        - label: 牛市情景
          low: 910
          high: 1260
          midpoint: 1085
        - label: 2021 年独角兽估值锚（参考）
          low: 1000
          high: 1000
          midpoint: 1000
    approximationNotes: 所有数值均为百万美元。情景区间来自 ARR 代理估计和市场倍数基准。2021 年独角兽估值锚是报道估值，不是评估价值。这些是指示性区间，并非独立评估。
    claimRefs:
      - CV019
      - CV020
      - CV021
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      面向投委会的八个投资维度评分；每个维度按 1–5 分打分（1=很弱，5=很强），依据本章和前文收集的证据。
    data:
      items:
        - label: 市场规模和增长
          value: 4
          note: $5–12B SCRM TAM；监管顺风；政府 AI 采用加速
        - label: 产品差异化
          value: 4
          note: 唯一自动化多向量 AI SCRM 平台；11B+ 实体知识图谱；iQ 预测分析
        - label: 客户证明和留存
          value: 3
          note: 100+ Fortune 1000；GSA 政府范围合同；NRR 未知
        - label: 财务质量
          value: 2
          note: 2023 年 ARR 增长 +50%（公司陈述，未经审计）；ARR 代理值未验证；毛利率水平未知
        - label: 竞争护城河
          value: 3
          note: 知识图谱带来切换成本；但 SAP/ServiceNow/Google 可原生嵌入
        - label: 风险画像
          value: 2
          note: 政府集中度；陈旧独角兽估值锚；没有股权价格发现；依赖信贷
        - label: 估值吸引力
          value: 3
          note: 基准情景 $450–636M，比独角兽估值锚低 40–55%；若 ARR 得到确认则有吸引力，否则不确定
        - label: 证据质量
          value: 2
          note: 无经审计财务；ARR 代理值未验证；2026 年融资未确认；股权结构不透明
    claimRefs:
      - CV030
      - CV031
      - CV034
