      - number: '8.4'
        title: 牛 / 基准 / 熊估值情景
        blocks:
          - type: paragraph
            body: >
              三种情景围绕 $39.7 M 的中心 ARR 代理值（2024 年底）展开，增长假设来自公开表述。每种情景都采用一组 ARR 倍数，并按当前私募市场环境校准（成长期企业 SaaS 为
              7–15x），同时调整政府合同黏性和 AI 溢价潜力。由于缺少经审计财务，所有情景估值都应视为指示性区间，而非点估计。

              牛市情景下，Interos 借助 GSA 全政府 SCRM 合同和关税风险产品发布，把 ARR 增速提升至 40–50%，到 2026 年底达到 $65–70 M ARR。14–18x ARR
              倍数（由政府合同收入可预测性、AI 差异化和战略并购可选性支撑）意味着估值为 $910 M–$1.26 B，基本能维持 2021 年独角兽标记。基准情景假设 2026 年 ARR 以 25–35% 增至约
              $50–53 M，并采用 9–12x 的市场倍数，得到 $450–$636 M 估值区间，较 2021 年标记明显折价。熊市情景假设增长放缓至 10–15%，倍数压缩至
              5–7x，反映盈利路径、政府预算风险和竞争强度的不确定性；在约 $44–45 M ARR 和 5–7x 倍数下，隐含价值为 $220–$315 M，显著低于 2021
              年独角兽标记，也与若新增股权融资可能出现降价轮的情景一致。
