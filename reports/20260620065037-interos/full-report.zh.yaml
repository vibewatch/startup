      - number: '8.6'
        title: 建议、正向论点 vs. 反向论点与尽调事项
        blocks:
          - type: paragraph
            body: >
              综合证据权重，合适立场是跟踪，并保留有条件上调路径。投资论点在合适价格下有吸引力：Interos 是唯一具备自动化、AI 优先、多向量能力的 SCRM 平台，拥有全政府范围 GSA 合同通道、Fortune
              1000 商业采用、覆盖 4 亿多个实体的专有知识图谱，以及不断扩展的 AI 产品界面（iQ、Resilience
              Watchtower、itracing、itariffs）。这些都是持久的差异化资产。反向论点同样清晰：2021 年 $1 B
              独角兽标记很可能过时，在倍数压缩后已缺乏当前收入指标支撑；五年没有新的定价股权轮，说明 term sheet 风险存在；依赖增长信贷可能在补贴一条避免接受市场定价问责的跑道；政府预算风险（DOGE
              驱动的支出冻结、CR 周期）可能冲击能见度最高的收入分部。

              若满足以下条件，建议可从跟踪上调至跟踪买入：（a）管理层披露 2025 年经审计 ARR ≥ $55 M，且同比增长 ≥30%；（b）完成新的股权轮，并披露价格以确认或重置估值标记；（c）确认 NRR 高于
              110%；（d）毛利率达到 70%+。若缺少这些数据点，估值仍是以 $350–$600 M 为中心的宽区间——相较 2021 年标记有吸引力，但没有价格发现就无法行动。
