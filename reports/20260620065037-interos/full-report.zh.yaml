      - number: '3.2'
        title: 直接同业与能力差异化
        blocks:
          - type: paragraph
            body: >
              Altana Technologies 定位为贸易情报平台，底层是 6 亿家公司知识图谱，并拥有差异化的 US CBP 合作，为 5,000 多名执法人员提供贸易执法服务。Altana
              的产品护照映射强迫劳动（UFLPA）和可持续合规所需的材料来源。Interos 强调实时风险监控和财务 / 地缘政治信号；Altana
              则偏向海关合规和产品级可追溯。两者买方集合部分重叠（全球跨国公司），但用例不同：供应链风险监控，对应贸易执法工作流。


              Resilinc（重塑品牌为 resilinc.ai）是 Interos 在 SCRM 市场最正面的竞争对手。Resilinc 在 2026 年被评为 SCRM Solutions 的 Gartner Magic
              Quadrant Leader，并定位「agentic AI」用于自动化风险响应。Resilinc 的数据模型依赖直接供应商入驻和社区来源数据，这能为已入驻供应商提供高准确性，但对 Tier-2/3
              节点覆盖有限。Interos 用 AI 驱动发现来大规模映射未入驻供应商，以叶节点部分准确性换取更广覆盖。Resilinc 面向汽车、电子和医疗器械制造商；Interos 则有更强的政府和金融服务覆盖。


              Exiger 的 1ExigerAI 平台摄取 100 亿条记录，并已获得 FedRAMP Moderate 授权。Exiger 在制裁筛查、反情报风险和监管合规工作流上差异化。在政府 SCRM
              板块，Exiger 是 Interos 最可信的直接竞争威胁，拥有 60 多个已确认联邦机构关系。Everstream Analytics
              聚焦采购和物流中的供应链运营中断监控；其公开材料较薄，提示产品足迹更窄。Prewave 每天监控 450 万个数据点，覆盖 200 多个风险类别，ESG 覆盖强，并获得 Gartner 对 SCRM
              的认可。Prewave 主要是欧洲市场竞争对手，受益于 CSRD 执法，在美国或政府市场渗透有限。


              G2 买方评价（2022 年存档）把 Resilinc 和 Exiger 列为 Interos 主要替代方案；买方评论提到集成深度和多层级可见性广度是决策标准，与下表的能力比较一致。
