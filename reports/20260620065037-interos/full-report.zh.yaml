  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争格局定义
        blocks:
          - type: paragraph
            body: >
              Interos 位于更广义供应链风险管理软件市场中的一个专业子板块，而该市场本身又处在更大的供应链管理（SCM）生态内。公司把自己定位为提供「Supply Chain Risk
              Intelligence」（SCRI）——一种 AI-native、持续监控多层级供应商关系的方法——并将其与 ERP 平台捆绑的通用采购风险模块，以及只覆盖财务信用风险或只覆盖网络安全的点状解决方案区分开。

              对 Interos 而言，相关 TAM 边界横跨四类重叠市场：（1）聚焦供应商风险监控和评分的 SCRM
              软件平台；（2）面向供应商网络和运营风险的第三方风险管理（TPRM）平台；（3）由监管合规驱动的供应链映射和可追溯工具（UFLPA、CSDDD、冲突矿产）；（4）把风险信号嵌入寻源决策的采购情报工具。相邻但排除在外的板块包括实体供应链管理（库存、物流、TMS）、基于
              IoT 的供应链安全硬件，以及 SCRM 只是小模块的通用企业风险管理（ERM）GRC 套件。

              专用 SCRI 平台的现状替代品包括手工电子表格式供应商清单、SAP（Ariba Supplier Risk）、Oracle 和 IBM 的 ERP
              原生风险模块、周期性第三方审计和咨询项目，以及只覆盖网络或财务风险的点状方案。ERP 既有厂商的捆绑威胁真实存在：SAP Ariba 的供应商风险模块和 Coupa
              的风险管理能力嵌在已经处理供应商交易的采购工作流中，具备低摩擦分销优势。Interos 的应对方式是推进平台合作——包括与 Coupa 的认证集成（2022 年）和与 SAP Ariba Supplier
              Risk 的重点集成——而不是正面竞争。

              Resilinc 是最接近 Interos 的专业竞争对手，并在 2026 年被评为 Gartner Magic Quadrant Leader。其他具名竞争对手包括 Exiger（聚焦国防）、Sayari
              Analytics（受益所有权和供应链）以及 Prewave（AI 供应商情报）。供应链安全硬件市场（IoT 传感器、GPS 跟踪、RFID）是相关但不同的板块，并不属于 Interos 的可服务市场。
