callouts:
  - calloutType: recommendation
    title: "TRACK — Conditional upgrade to buy pending revenue verification"
    body: >
      Interos is a category-defining SCRM AI platform with credible government and commercial
      traction, but the 2021 $1 B unicorn mark is likely stale and the true equity value
      is probably in the $350–$636 M range on a base scenario. Without audited ARR, confirmed
      NRR, cap-table disclosure, or a new priced equity round, the evidence is insufficient
      to recommend entry at or near the 2021 mark. Track until price discovery occurs.
    claimRefs:
      - CV030
      - CV034
      - CV035

  - calloutType: risk
    title: "Adverse signal: Growth-credit reliance may mask down-round risk"
    body: >
      Blue Owl's $40 M growth capital facility does not price equity. Five years without a
      new equity round—despite strong ARR growth narrative—raises the question of whether
      equity investors are unwilling to meet management's price expectations. This is a
      classic private-market valuation opacity pattern. The $30 M undrawn balance on the
      2024 Form D may be drawn in 2026, but this would still be debt, not valuation-setting
      equity. Investors should require full covenant, warrant, and cap-table disclosure before
      assuming the $1 B mark is still valid.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027

  - calloutType: assumption
    title: "Key assumption: ~$39.7 M ARR proxy is directionally correct"
    body: >
      All valuation scenarios depend on the ~$39.7 M 2024 ARR proxy from third-party
      aggregators. This figure was not confirmed from a primary source (company disclosure,
      audited statements, or Interos investor letter) during this research cycle. If actual
      ARR is materially lower (e.g., $25–30 M), the base and bull scenarios compress
      significantly; if higher (e.g., $55–65 M), the bear scenario no longer implies a
      down-round. Revenue verification is the single most critical diligence ask.
    claimRefs:
      - CV010
      - CV011

