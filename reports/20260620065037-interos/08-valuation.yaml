  - id: private-market-context
    title: Private-Market Reset and Adverse Considerations
    body: >
      The 2021 unicorn cohort faces structural multiple compression. From peak 2021 levels
      (median EV/NTM revenue for high-growth B2B SaaS exceeded 20x), public-market
      multiples corrected sharply in 2022–2023 to 6–10x, and private-market marks followed
      with a 6–18 month lag. CB Insights and Bessemer's State of the Cloud 2024 report
      note that cloud companies that raised in the 2021 bubble routinely face down-round
      pressure when seeking new capital in 2023–2025, particularly those that did not
      reach or maintain $100 M ARR. Interos at an estimated ~$40–50 M ARR in 2025
      remains comfortably below the threshold that typically supports a $1 B private mark
      on standalone growth-SaaS metrics.

      Blue Owl's use of growth credit (rather than a new equity round) may reflect
      management's desire to avoid a down-round mark. Credit investors do not set equity
      valuations, so the $40 M Blue Owl facility does not update the $1 B unicorn mark
      on the cap table, but it does not validate it either. The remaining $30 M undrawn
      in the 2024 Form D offering could be drawn in 2025–2026, potentially explaining
      the "2026 financing" reference—but this would still be credit, not equity. Persistent
      reliance on credit structures over equity rounds is itself an adverse signal: it
      suggests equity investors are unwilling to mark the company at the prices management
      would accept. There is no direct evidence Interos has been approached about an
      acquisition, but the combination of government contracts, AI differentiation, and
      sub-optimal equity market access makes a strategic-buyer exit—to a Moody's, Dun &
      Bradstreet, SAP, or ServiceNow—the most plausible monetization pathway within 3–5
      years.
