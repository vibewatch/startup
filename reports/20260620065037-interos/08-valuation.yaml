chapter:
  number: 8
  title: Valuation
  summary: >
    Interos achieved $1B+ unicorn status in September 2021 with a $100 M Series C led by NightDragon. In October 2024 it raised $40 M in growth capital from Blue Owl Capital (SEC Form D total offering $75.6 M, $45.6 M sold, no valuation disclosed). A 2026 financing is referenced in the company press cadence but no Form D has been filed and no equity valuation is publicly disclosed. With 2023 ARR growth of +50% and gross-margin improvement of +60%, the 2024 proxy ARR of approximately $39.7 M is plausible but unconfirmed; at post-compression SaaS multiples of 7–15x ARR the implied range is $280–$596 M, materially below the 2021 unicorn mark. A research-more or track stance is warranted until revenue, terms, and retention are independently verified.

sections:
  - id: financing-history
    title: Financing History and Valuation Marks
    body: >
      Interos has raised an estimated $192.35 M in total capital across four disclosed
      rounds (CB Insights). The founding-era raises (SEC Form D December 2019 and March
      2020) established the company's Delaware incorporation and early investor base.
      The pivotal round was the September 2021 Series C: $100 M led by NightDragon with
      participation from Kleiner Perkins and Venrock, plus strategic checks from Accenture,
      Coupa, and ServiceNow. Multiple independent news outlets contemporaneously reported
      unicorn status, implying a post-money valuation of at least $1.0 B. The round timing
      coincided with peak private-market multiples, when B2B SaaS supply-chain companies
      routinely commanded 30–50x forward ARR.

      In October 2024, Interos announced a $40 M "growth capital" investment from funds
      managed by Blue Owl Capital (NYSE: OWL), a credit-focused alternative asset manager
      with >$192 B AUM. Jefferies LLC served as exclusive financial advisor. The SEC Form D
      filed 2024-10-25 (Acc-No. 0001797513-24-000001) shows a total offering of $75,610,033
      with $45,560,033 sold as of filing date and $30,050,000 remaining; 10 investors.
      Blue Owl's primary technology-credit business structures growth capital as revenue-based
      or asset-backed lending with equity kickers rather than as priced equity rounds, which
      explains why no post-money valuation was stated. No Form D amendment or new Form D has
      been filed since 2024-10-25 as of the June 20, 2026 run date, and no public press
      release or news article confirming a standalone 2026 equity-priced round was located
      during research. The company issued an April 2026 product-launch release (iQ platform)
      with no financing details.
