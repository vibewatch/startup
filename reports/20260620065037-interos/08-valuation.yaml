  - id: recommendation-and-diligence
    title: Recommendation, Thesis vs. Anti-Thesis, and Diligence Asks
    body: >
      Given the weight of evidence, the appropriate stance is track with a conditional
      upgrade path. The investment thesis is compelling at the right price: Interos is
      the only automated, AI-first, multi-vector SCRM platform with government-wide GSA
      contract access, Fortune 1000 commercial adoption, a proprietary knowledge graph
      of 400+ million entities, and a growing AI product surface (iQ, Resilience
      Watchtower, itracing, itariffs). These are durable differentiated assets. The
      anti-thesis is equally clear: the 2021 unicorn mark of $1 B is likely stale and
      unsupported by current revenue metrics at post-compression multiples; the absence
      of a new priced equity round for five years suggests term-sheet risk; growth-credit
      reliance may be subsidizing a runway that avoids accountability to market pricing;
      and government budget risk (DOGE-driven spending freezes, CR cycles) could impair
      the highest-visibility revenue segment.

      The recommendation would move to track-to-buy if: (a) management discloses audited
      ARR ≥ $55 M for 2025 with ≥30% YoY growth, (b) a new equity round is completed at
      a disclosed price that confirms or resets the mark, (c) NRR is confirmed above 110%,
      and (d) gross margin reaches 70%+. Absent those data points, the valuation remains
      a wide range centered on $350–$600 M—attractive relative to the 2021 mark but
      unactionable without price discovery.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
