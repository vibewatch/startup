  - id: revenue-and-arr-proxy
    title: Revenue Proxy and ARR Context
    body: >
      Interos does not publish audited financials. The only public revenue signal is the
      April 2024 press release announcing "+50% ARR growth" in 2023 alongside "+60%
      improvement in gross margin." The company also claimed "record growth" and named
      Deloitte's Technology Fast 500 and Inc. Fastest-Growing in North America. If the
      2024 ARR proxy of approximately $39.7 M is accurate (a figure cited in analyst
      databases but not independently confirmed from primary sources), and if growth
      continued near 30–50% into 2025–2026, ARR of $50–$80 M in 2026 would be the
      optimistic base case. CB Insights lists Interos on its Unicorn Tracker, implying
      the data aggregator still recognizes the 2021 $1 B mark as the company's last
      official valuation. The absence of a new equity round since September 2021 means
      the $1 B unicorn mark is the only officially tracked valuation; all subsequent
      inference is model-driven.

      The Blue Owl investment described as "growth capital" likely carries a cost-of-capital
      signal rather than a price signal; Blue Owl's technology credit platform typically
      lends at rates of 12–18% all-in yield versus setting an equity NAV. This means
      investors cannot read the 2024 transaction as setting a new equity valuation, a
      common source of opacity for portfolio companies using alternative credit.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
    tableRefs:
      - TV002
    figureRefs:
