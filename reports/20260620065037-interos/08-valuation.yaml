  - id: valuation-scenarios
    title: Bull / Base / Bear Valuation Scenarios
    body: >
      Three scenarios are developed around a central ARR proxy of $39.7 M (2024 year-end)
      with growth assumptions derived from public commentary. Each scenario applies a range
      of ARR multiples calibrated to current private-market conditions (7–15x for
      growth-stage enterprise SaaS) and adjusts for government contract stickiness and
      AI premium potential. All scenario valuations should be treated as indicative ranges,
      not point estimates, given the absence of audited financials.

      In the bull case, Interos accelerates ARR growth to 40–50% on the back of the GSA
      government-wide SCRM contract and tariff-risk product launches, reaching $65–70 M
      ARR by end of 2026. A 14–18x ARR multiple (justified by government contract
      revenue predictability, AI differentiation, and strategic M&A optionality) implies
      a valuation of $910 M–$1.26 B—roughly consistent with maintaining the 2021 unicorn
      mark. The base case assumes 25–35% ARR growth to ~$50–53 M ARR in 2026 with
      market-rate multiples of 9–12x, yielding a valuation range of $450–$636 M—a
      significant discount to the 2021 mark. The bear case assumes growth deceleration
      to 10–15% and multiple compression to 5–7x reflecting uncertainty about profitability
      path, government budget risk, and competitive intensity; at ~$44–45 M ARR and 5–7x
      multiple the implied value is $220–$315 M, well below the 2021 unicorn mark and
      consistent with a down-round scenario if new equity were raised.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
