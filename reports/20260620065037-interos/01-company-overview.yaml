  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: "Reconciled cap table showing total equity raised, debt instruments, and ownership percentages by investor"
      whyItMatters: "Reported total funding ranges from $224M (Tracxn) to $310M (Technical.ly) – a $86M gap that materially affects any valuation or acquisition analysis"
      diligencePath: "Request data room cap table, convertible note register, and debt instrument schedules from company counsel"
      relatedQuestionRefs: [QO006, QO026]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: material
      topic: valuation
      missingEvidence: "Post-2021 formal valuation assessment or primary-source post-money valuation from the 2024 Blue Owl round"
      whyItMatters: "Unicorn status rests on a 2021 price discovery event; no third party has confirmed $1B+ valuation in 2024 or 2026 based on current financials"
      diligencePath: "Request Blue Owl Capital term sheet and any 409A or independent valuation studies from the 2024-2026 period"
      relatedQuestionRefs: [QO015]

    - type: access-blocked
      severity: minor
      topic: adverse
      missingEvidence: "Direct access to Glassdoor and other employee review platforms to verify scope and recency of layoff complaints"
      whyItMatters: "Employee count compression from peak to ~150 workers is consistent with restructuring; independent verification of layoff scope would contextualize organizational health"
      diligencePath: "Request workforce headcount history from HR function; cross-reference LinkedIn employee count trend; conduct reference interviews with former employees"
      relatedQuestionRefs: [QO018]
      relatedTableRefs: [TO002]

    - type: conflicting-data
      severity: material
      topic: customers
      missingEvidence: "Consistent customer count methodology distinguishing direct enterprise/government accounts from channel/partner-sourced users"
      whyItMatters: "100 vs 500 customer figure conflict cannot be resolved without definitions; customer quality, ACV, and churn cannot be estimated without this clarity"
      diligencePath: "Request ARR breakdown by customer count tier, channel vs direct split, and definition of active customer from company"
      relatedQuestionRefs: [QO022]
      relatedTableRefs: [TO001]

    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: "Historical headcount trend with dates showing peak employee count and timing of any reductions"
      whyItMatters: "Current ~150 headcount is lean for a company with $290-310M raised; understanding the trajectory requires peak and trough figures"
      diligencePath: "Cross-reference LinkedIn employee count snapshots with Tracxn time series; request HR headcount trend directly"
      relatedQuestionRefs: [QO010]

    - type: missing-source
      severity: minor
      topic: founding
      missingEvidence: "Primary incorporation document or official record confirming 2005 founding date and distinguishing original entity from current Interos Inc. operating company"
      whyItMatters: "2005 vs 2017 founding date discrepancy affects assessments of company longevity, management tenure, and profitability timeline"
      diligencePath: "Request Virginia corporation records for INTEROS SOLUTIONS, INC. and current Interos Inc. entity; verify Delaware or Virginia incorporation dates"
