      - FO002

  - id: section-leadership
    title: Founders, leadership, and governance
    body: >
      Jennifer Bisceglie founded Interos in 2005 and served as CEO until April 2024, guiding the company
      through a 232% three-year CAGR and its July 2021 unicorn financing event. In April 2024, the board
      orchestrated a leadership transition that installed seasoned SaaS executive Ted Krantz as CEO while
      Bisceglie assumed the role of Founder and Executive Vice Chair and joined the Board of Directors.
      Both joined the board simultaneously, creating a dual-leadership structure intended to balance
      Bisceglie's industry vision and government relationships with Krantz's enterprise-scale operational
      expertise. Christian and Timbers, the executive search firm, conducted the CEO search and described
      the transition as a response to founder-led scaling bottlenecks as the company approached $40M in
      revenue.

      Ted Krantz brings more than 20 years of CEO and executive leadership experience in AI and SaaS.
      He most recently served as CEO of data.ai, where he drove significant recurring revenue growth and
      AI adoption. Prior to that he held senior roles at Skai, C3.ai, SAP America, and Oracle. Krantz's
      initial mandate has been to accelerate ARR growth, improve gross margins, deepen AI capabilities,
      and move toward break-even.

      Board governance includes Dave DeWalt, NightDragon founder and CEO, who serves as board member and
      was described as chairman; he was previously CEO of FireEye, McAfee, and Documentum. Frank
      Verdecanna joined the board in October 2024, bringing CFO experience from Mandiant, including its
      $5 billion sale to Google, and is expected to contribute financial rigor and IPO-readiness
      perspective. Yardley Pohl serves as Chief Product and Technology Officer and Chris Lee as Chief
      Revenue Officer, both appointed in late 2024 alongside Verdecanna as part of the post-Krantz
      executive build-out. The board also has an advisory layer that has included Edna Conway of
      Microsoft and former UK Joint Forces Commander Sir Chris Deverell.

      Key-person risk remains material. Krantz is the primary operational leader and public face of the
      company's current growth phase. Bisceglie's continued involvement on the board provides continuity
      for government relationships and mission narrative, but the transition creates execution dependency
      on a recently installed leadership team whose first full fiscal year at the helm is still in progress.
    claimRefs:
