  - id: section-capital
    title: Funding history and capital structure
    body: >
      Interos has completed at least six financing rounds totaling a reported $290 million to over $310
      million in raised capital, depending on the source and methodology used. The official company
      narrative and multiple press releases corroborate a progression from a $8.35M Series A in January
      2019 led by Kleiner Perkins, through an approximately $20M Series B in 2020 led by Venrock, to the
      landmark $100M Series C in July 2021 led by NightDragon at a valuation exceeding $1 billion. The
      Series C established Interos as a unicorn and as one of the few female-led companies to reach that
      milestone. Strategic investors Accenture Ventures, Coupa Ventures, and ServiceNow also participated
      in or alongside the Series C.

      Following a period of strong organic growth and two consecutive years of ARR expansion, Interos
      raised $40 million from Blue Owl Capital in October 2024 to deepen AI capabilities and
      accelerate predictive analytics development. Blue Owl returned in January 2026, co-leading a
      further $20 million round alongside Structural Capital, bringing total post-Series C external
      financing to at least $60 million. The stated use of the 2026 funds is first-party data
      collection from customers to train predictive AI models and a push toward break-even by
      year-end 2026.

      There is a material discrepancy between reported total raised figures. TechCrunch reported
      "nearly $290 million in venture capital" as of October 2024, while Tracxn shows only $224
      million across six rounds and completeaitraining.com and technical.ly report approximately
      $310 million post-January 2026 round. The discrepancy likely reflects different counting
      methodologies, possible debt instruments, or undisclosed rounds not captured in VC databases.
      All figures represent a private company with no mandatory public financial disclosure, and
      the gap between Tracxn's $224M and press-reported $290M-plus is a concrete diligence item
      for any acquirer or late-stage investor.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
