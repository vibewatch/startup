  - id: section-milestones
    title: Milestone chronology and government traction
    body: >
      The company's public milestone record traces from founding in 2005 through a multi-year period
      of operational build-out leading to a formal venture capital start in 2019. The company's inflection
      point was the July 2021 Series C and unicorn status, after which it claimed 232% three-year CAGR
      and 181% customer growth in a February 2022 press release. The 2023 fiscal year was the strongest
      on record by ARR growth and margin improvement metrics, catalyzing the board's decision to bring in
      enterprise-scale CEO leadership.

      Government traction is one of Interos' strongest differentiators and most important revenue lines.
      The company's most significant government achievement is the June 2024 five-year contract with the
      U.S. General Services Administration that extends its platform to all Department of Defense and
      civilian agency customers. This GSA contract, delivered through distribution partner Carahsoft,
      creates a government-wide SCRM vehicle covering over a hundred agencies. Prior to this, Interos had
      agency-wide deployments with the U.S. Navy, the Missile Defense Agency, NASA, and Health and Human
      Services, as well as a large multi-year contract with the Canadian Coast Guard and Royal Canadian
      Navy announced in early 2024.

      In 2024, the company also achieved three important operational milestones simultaneously: the
      Blue Owl capital infusion, the SAP Ariba partnership, and the launch of Ask Interos, all
      announced together at the company's inaugural Risk Intelligence Summit in October 2024. The
      Frank Verdecanna board appointment in the same month added a financial executive with public
      market and M&A experience, which may be preparation for an eventual IPO or strategic exit.
      The January 2026 $20M round with a stated break-even target by year-end 2026 is the most recent
      public milestone and suggests the company is now orienting toward profitability rather than
      growth-at-any-cost.
