callouts:
  - calloutType: strength
    title: Government-wide GSA contract is a structural revenue moat
    body: >-
      The June 2024 five-year GSA contract extending Interos to all DoD and civilian agencies creates
      a government-wide distribution channel that no competitor currently holds. Combined with existing
      Navy, NASA, and MDA deployments, this positions Interos as the default federal SCRM platform
      through at least 2029.
    claimRefs:
      - CO014
      - CO008
  - calloutType: risk
    title: Pre-profitability with unicorn-era valuation and unverified funding totals
    body: >-
      Interos has not reached break-even as of mid-2026, its last confirmed valuation of $1B+ dates to
      2021, and reported total funding figures conflict across sources by up to $86M. Any valuation
      or acquisition discussion requires a reconciled cap table and audited financials.
    claimRefs:
      - CO024
      - CO028
      - CO029
      - CO020
  - calloutType: risk
    title: Small headcount and reported layoffs signal organizational stress
    body: >-
      With approximately 150 employees including contractors serving 100-500 customers globally,
      Interos is operationally lean relative to its ambition. Employee review data suggests recurring
      layoffs, and the workforce is materially smaller than during post-Series C peak expansion.
    claimRefs:
      - CO021
      - CO038
      - CO040

