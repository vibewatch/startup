  - id: section-adverse
    title: Adverse indicators, gaps, and diligence priorities
    body: >
      Several adverse and gap indicators require attention from any diligence team. Employee review
      aggregators document recurring mentions of layoffs and organizational instability at Interos.
      Anonymous reviews on Glassdoor, while inaccessible for direct verification due to platform
      blocking, were reported in independent web search results as citing "constant layoffs." The
      company's current employee count of approximately 146 to 150 workers including contractors is
      markedly smaller than during its peak growth period, when the company reportedly employed
      significantly more staff following the 2021 Series C. This compression in headcount relative
      to total capital raised is consistent with restructuring events, though no formal public
      announcement of a reduction in force has been located.

      Third-party analytical sources document material platform weaknesses. The swotanalysis.com
      SWOT profile identifies Interos' high average contract value as limiting its addressable market
      to only the largest enterprises and government agencies, its complex implementation and long sales
      cycles as deterrents, and its difficulty verifying data accuracy at tier-3 and deeper supplier
      tiers as an operational limitation. These are genuine structural risks that competitors like
      Everstream Analytics and Altana AI may exploit with more accessible pricing and faster deployments.

      The total funding discrepancy — Tracxn $224M vs TechCrunch $290M vs post-2026-round $310M
      reported by technical.ly — is unresolved and requires a reconciliation of cap table entries with
      any closing data room. The company has not disclosed post-Series D valuation data, so its unicorn
      status as of 2026 rests on a 2021 precedent not refreshed by market price discovery.
      Break-even by year-end 2026 is the CEO's stated target, but the company remains pre-profitability
      as of the run date with modest headcount suggesting limited operational leverage.
    claimRefs:
      - CO020
      - CO028
      - CO029
