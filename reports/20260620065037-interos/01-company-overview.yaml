company:
  name: Interos Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Interos Inc. is an Arlington, Virginia-based AI-powered supply chain risk intelligence company founded
    in 2005 by Jennifer Bisceglie, which reached unicorn status in July 2021 on a $100M Series C led by
    NightDragon. With CEO Ted Krantz installed in April 2024, approximately $310M raised to date including
    a January 2026 $20M round, government-wide GSA SCRM contract, and $39.7M in ARR, the company is a
    credible but still pre-profitability specialist platform targeting break-even by end of 2026.
sections:
  - id: section-identity
    title: Identity, mission, and operating model
    body: >
      Interos Inc., operating under the brand interos.ai, is a private SaaS company headquartered in
      Arlington, Virginia. Its stated mission is to eliminate risk from every supply chain and to build
      the most trusted and transparent supply chains in the world. The company describes itself as the
      AI-first supply chain risk intelligence company and positions its platform as the system of record
      for supply chain risk management.

      The operating model is a pure SaaS subscription platform sold to large enterprises and government
      agencies. The core product is a continuously updated knowledge graph that maps over 400 million
      global entities and 11 billion-plus business relationships, enabling customers to monitor for
      six risk vectors — cyber, financial, geopolitical, regulatory, ESG, and catastrophic — without
      manual supply-chain mapping processes. Customers include Fortune 1000 companies and U.S. federal
      agencies across defense, intelligence, and civilian domains. The company's revenue model is
      enterprise SaaS subscription with professional services as a complement, though CEO Ted Krantz
      stated in early 2026 that the company has shifted emphasis toward its software tools and away from
      the original professional services angle.

      Interos was founded in 2005 by Jennifer Bisceglie, who previously led government market efforts
      at Manhattan Associates, a supply chain solutions company. Some third-party databases list a 2017
      founding date, which likely reflects a product rebrand or technology platform upgrade rather than
      the company's original incorporation. Interos' own 2022 press releases state the company was
      founded 17 years earlier, confirming 2005. The company is registered as INTEROS SOLUTIONS, INC.
      in Virginia.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
