callouts:
  - calloutType: risk
    title: The biggest risk is not demand collapse but control loss inside a fast-built network
    body: >-
      Market demand for cold-chain infrastructure appears robust. The harder underwriting question is whether a 110-warehouse, acquisition-heavy platform can maintain standards, visibility, and financial discipline as it scales.
    claimRefs: [CR003, CR014, CR019, CR022, CR032, CR041]
  - calloutType: strength
    title: Mitigation maturity is visible even if granular controls remain private
    body: >-
      Compliance language, technology spending, EDGE certifications, automation, and lower-carbon freezing investments all suggest management is building control systems rather than simply aggregating assets. That reduces—but does not eliminate—residual risk.
    claimRefs: [CR002, CR018, CR031, CR038]
