  topStrengths:
    - Largest or one of the largest cold-chain platforms in Latin America, with 110 warehouses across 11 countries.
    - Institutional capital backing is unusually deep for the category, with US$1.2B of equity plus a 2025 term loan.
    - >-
      Operates in a structurally attractive region where food safety, export growth, and infrastructure gaps support
      long-run demand.
    - Comfrio materially deepened Brazil coverage and widened the platform beyond simple cold storage.
    - Management pedigree and investor mix imply strong strategic and operating pattern recognition.
  topRisks:
    - Current revenue, EBITDA, leverage, and exact post-money valuation are not publicly disclosed.
    - Brazil integration and concentration risk after Comfrio are large enough to change fair value materially.
    - Public cold-chain comparables are large but low-margin and do not support aggressive private multiples by default.
    - Debt overhang and covenant uncertainty raise downside sensitivity for equity underwriting.
    - Customer concentration, retention, and incident history remain insufficiently transparent.
