company:
  name: Emergent Cold LatAm
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Emergent Cold LatAm is a Miami-linked, Latin America-focused cold-chain infrastructure platform founded in 2021 by executives with prior Americold, AGRO Merchants, Lineage, and food-distribution experience. Public company, investor, and advisor materials agree that it has scaled unusually fast through acquisitions and greenfield expansion, pairing more than a hundred warehouses across 11 countries with repeated large capital raises from Stonepeak, Lineage, Losa, D1, and a CPP Investments-led lender syndicate. The main diligence takeaway is not whether the platform is real—it clearly is—but that headline scale metrics evolve rapidly across sources and public disclosure remains much stronger on network growth than on revenue, profitability, or a precise current valuation.
sections:
  - id: identity-and-operating-model
    title: Identity, footprint, and operating model
    body: >-
      Emergent Cold Latin America launched in August 2021 as a temperature-controlled warehousing and logistics platform built to modernize a fragmented regional food cold chain. Launch materials said the company was based out of São Paulo with a corporate office in Miami, while the current task context and management footprint place Miami at the corporate center of gravity for an operating network that spans Latin America. Official company pages consistently describe the core offer as integrated cold-chain logistics rather than simple storage rental: refrigerated and frozen warehousing, transportation, processing, picking, cross-docking, port logistics, customs warehousing, blast freezing, and other value-added services for food and agribusiness customers.

      The strongest current first-party footprint claim is the About Us page and June 2026 operating news, both of which say the network includes 110 cold-storage warehouses in 11 Latin American countries. Service pages add that those assets are distributed across key ports and metropolitan centers and are meant to support end-to-end product flow rather than point solutions. In workflow terms, Emergent positions itself as a regional cold-chain operating platform for proteins, dairy, frozen foods, produce, food retail, foodservice, and import/export users that need storage, handling, transportation, and compliance-sensitive execution under one umbrella. IFC's project disclosure corroborates that framing by describing the company as a third-party temperature-controlled logistics platform built around refrigerated storage, transportation, and value-added services for processed foods, dairy, meat, seafood, and fruits and vegetables.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-and-governance
    title: Founders, management bench, and governance posture
    body: >-
      Emergent Cold LatAm was founded by Neal Rider and David Palfenier, two executives with deep prior cold-storage operating experience. Rider serves as CEO and, according to the company culture page, previously co-founded Emergent Cold and AGRO Merchants Group and served as chief operating officer of Americold Logistics. Palfenier serves as president and previously led AGRO Merchants Group's Latin American operations and ConAgra Frozen Foods. The wider disclosed bench is materially stronger than a typical startup's: Pedro Moreira is CFO, Mike Bender is general counsel and chief compliance officer, Ricardo Jacob leads operations, Rafa Rocha leads commercial activities, Adam Rushby leads network optimization, and regional managing directors oversee Andean, South Cone, and Mexico/Caribbean operations.

      The governance disclosure is still narrower than the scale disclosure. The sustainability page says the company has a board of directors, an executive leadership team, solid financial management, and a compliance program present in all 11 countries, but it does not publish a detailed board roster or committee structure in the reviewed source set. That means diligence comfort comes more from management pedigree and the institutional quality of the investor/advisor base than from line-item public governance reporting. Key-person exposure is meaningful: Rider is still the central strategic voice, acquisition pace remains management dependent, and many differentiating claims—expansion discipline, technology standards, and network build quality—are heavily associated with a relatively small senior team.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO024, CO050, CO051]
    tableRefs: [TO002]
    figureRefs: []
  - id: capital-formation-and-balance-of-growth
    title: Funding history, investors, and acquisition-led scaling
    body: >-
      Emergent Cold LatAm's financing history is unusually large for a regional cold-chain operator. At launch in 2021, the company announced a US$450 million capital raise anchored by Lineage, Stonepeak, and D1 Capital Partners. In December 2023, official company and Stonepeak materials announced a further US$500 million of equity commitments led by Stonepeak, Lineage, and Losa Group. Those same sources say total equity raised since July 2021 reached US$1.2 billion, and that the company had already completed eighteen acquisitions, two new construction projects, and nine additional greenfields in active development at the time of the 2023 raise. In September 2025, Emergent added a new US$250 million term loan led by CPPIB Credit Investments and arranged by Deutsche Bank to fund acquisitions and development projects.

      The capital has clearly been used to accelerate a consolidation-plus-development strategy. The 2021 launch announcement paired the raise with an initial Peru acquisition. The current About Us chronology then shows a sequence of acquisitions and new projects across Peru, Panama, Brazil, Chile, Colombia, Uruguay, Guatemala, Mexico, Paraguay, Ecuador, the Dominican Republic, and later Brazil again via Comfrio and Peru via Frialsa Perú. The biggest disclosed strategic move in Brazil was the Comfrio transaction: the announcement described Comfrio as a 24-site platform with about 420,000 pallet positions, while the completed-transaction release and Aqua Capital's sale announcement frame the combined business as the dominant integrated cold-chain platform in Brazil. Public sources therefore support a clear conclusion: Emergent has not grown by one or two marquee assets, but by a deliberate regional roll-up plus greenfield build program funded with infrastructure-scale capital.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: scale-current-state-and-country-buildout
    title: Scale today, operational spread, and milestone cadence
    body: >-
      The strongest public scale evidence comes from the company's 2025-2026 operating updates rather than from old launch materials. The June 2026 San Antonio blast-freezing release says Emergent operates in 11 countries with 110 cold-storage facilities and 9.4 million cubic meters of storage capacity, and that GCCA ranks it as the largest cold-chain operator in Latin America and the fifth largest globally. The 2025 infrastructure-investment release adds a dated intermediate checkpoint: as of December 2024 the company had nearly 5.1 million cubic meters of cold-storage capacity and, after completing 13 new facilities over three years, expected seven more openings by the end of 2025 worth over 260,000 pallet positions. Rather than treat those numbers as contradictory, the better reading is rapid asset growth across measurement dates.

      Country updates make the footprint concrete. In Chile, Emergent says it runs nine cold-storage facilities and the largest automated food cold-storage facility in Latin America, with 33,000 pallet positions at Olivo in Maipú. In Colombia, it says it operates seven warehouses with 58,000 pallet positions and 507,000 cubic meters nationally. In Guatemala, it says three facilities now total 32,000 pallet positions. In Mexico, the Guadalajara opening states the company now operates 36 warehouses in the country, after earlier opening a greenfield in Monterrey and expanding Villagrán and Apodaca. In Brazil, the Comfrio completion release says the combined platform reaches 37 facilities in 12 states, 4 million cubic meters of capacity, 610,000 pallet positions, and 3,500 employees within Brazil alone. The milestone pattern is therefore unusually dense: Emergent continues to add facilities, expand sites, automate large assets, and widen export-linked service capabilities at a speed consistent with an infrastructure platform still in active buildout rather than in harvest mode.
    claimRefs: [CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044]
    tableRefs: [TO004]
    figureRefs: []
  - id: disclosure-gaps-and-adverse-context
    title: Disclosure gaps, metric drift, and what remains unproven
    body: >-
      The public record is persuasive on scale but uneven on precision. Company, investor, advisor, and trade sources consistently agree that Emergent is one of the largest temperature-controlled logistics operators in the region and that it has raised very large amounts of capital. They are much weaker on audited financial quality. No reviewed first-party source disclosed revenue, EBITDA, cash flow, customer concentration, or a clean current headcount for the entire group. Public valuation is also imprecise: official releases emphasize capital raised and infrastructure deployment, while database pages such as CB Insights partially reveal funding chronology but mask valuation fields and show totals that appear incomplete relative to official announcements.

      Several operating metrics also require date and scope discipline. Sources variously refer to more than 60 warehouses, more than 70 warehouses, and 110 warehouses; 5.1 million, 5.4 million, and 9.4 million cubic meters; and region-wide versus Brazil-only employee counts. Those are not reasons to doubt the platform, but they are reasons to avoid overconfident underwriting from headline numbers alone. The right diligence stance is that Emergent's identity, investor base, acquisition cadence, and physical footprint are all well evidenced, while its current valuation, revenue quality, unit economics, and cap-table details remain substantially less transparent.
    claimRefs: [CO045, CO046, CO047, CO048, CO049]
    tableRefs: []
    figureRefs: []
