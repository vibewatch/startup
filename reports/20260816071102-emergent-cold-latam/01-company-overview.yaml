callouts:
  - calloutType: strength
    title: Infrastructure-scale sponsorship is the clearest non-operational advantage
    body: >-
      Emergent Cold LatAm is not scaling like a typical startup. Multiple first-party and partner sources show hundreds of millions of dollars deployed into acquisitions, greenfields, and standards-heavy facilities, giving the company a capital base that regional independent cold-storage operators would struggle to match.
    claimRefs: [CO021, CO022, CO023, CO024, CO025]
  - calloutType: risk
    title: Public disclosure quality lags the scale narrative
    body: >-
      The platform's physical growth is well evidenced, but public sources remain weak on audited revenue, whole-company headcount, exact ownership percentages, and a precise current valuation. That is acceptable for a private operator, but it limits high-conviction underwriting from public information alone.
    claimRefs: [CO045, CO046, CO047, CO048, CO049]
