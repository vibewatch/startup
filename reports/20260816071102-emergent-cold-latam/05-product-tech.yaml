callouts:
  - calloutType: strength
    title: The product is sticky because it is embedded in physical workflows
    body: >-
      Emergent's value proposition is strongest where customers need several steps of the cold chain to work together—storage, order handling, transport, and export support—rather than shopping for a single interchangeable module.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE007, CE028]
  - calloutType: risk
    title: Public technical disclosure is thinner than public service disclosure
    body: >-
      The company explains workflow benefits well, but public materials remain sparse on software architecture, information security, uptime, and standardized reliability metrics. That limits confidence in the digital-control layer relative to the physical-network story.
    claimRefs: [CE017, CE022, CE023, CE029, CE030, CE031, CE035]
