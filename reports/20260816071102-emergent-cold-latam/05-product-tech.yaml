  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-metrics
      missingEvidence: "Uptime, spoilage, temperature-excursion, pick-accuracy, and incident-response metrics for the cold-chain operating stack."
      whyItMatters: "Operational-tech claims are only truly investable if reliability is measurable and durable."
      diligencePath: "Request internal KPI dashboards and customer SLA reports by service line and country."
      relatedQuestionRefs: [QE015, QE025]
      relatedTableRefs: [TE003, TE004]
    - type: private-evidence-only
      severity: material
      topic: software-architecture-and-security
      missingEvidence: "Detailed software architecture, system ownership map, integrations, access controls, and cybersecurity governance for customer-facing tools and monitoring systems."
      whyItMatters: "The public corpus suggests digital control matters, but does not show whether that layer is proprietary, robust, or secure."
      diligencePath: "Request product architecture diagrams, vendor maps, penetration-test summaries, and security policies."
      relatedQuestionRefs: [QE014, QE021, QE025]
      relatedTableRefs: [TE003, TE004]
