callouts:
  - calloutType: strength
    title: Emergent's best competitive argument is regional breadth with cold-chain specialization
    body: >-
      Most visible regional rivals appear strongest in one country or corridor, while global specialists emphasize worldwide scale rather than Latin America-specific operating breadth. Emergent's 11-country network lets it pitch something neither group clearly matches in the fetched public corpus.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP008, CP010, CP011]
  - calloutType: risk
    title: Bigger rivals can win high-trust accounts even without matching every local lane
    body: >-
      Public financial visibility, automation narratives, and global-brand procurement comfort still favor Americold, Lineage, and NewCold in certain contests. Emergent must prove execution density rather than assume scale claims alone are sufficient.
    claimRefs: [CP014, CP015, CP016, CP020, CP021, CP031, CP033]
