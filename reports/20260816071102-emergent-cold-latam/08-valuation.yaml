callouts:
  - calloutType: recommendation
    title: Great company, incomplete pricing evidence
    body: >-
      Emergent looks like a serious regional winner, but the public record still cannot support a clean buy call because the decisive variables—revenue, EBITDA, leverage, and current post-money—remain undisclosed.
    claimRefs: [CV004, CV008, CV024, CV032, CV040]
  - calloutType: risk
    title: Public comparables are a valuation discipline tool, not a dismissal of the thesis
    body: >-
      Americold and Lineage prove that cold-chain specialists can be large and valuable. They also show that public markets still punish thin margins and inconsistent earnings quality, which should temper any aggressive private multiple assumptions.
    claimRefs: [CV009, CV011, CV012, CV015, CV017, CV018, CV019, CV020, CV037]
