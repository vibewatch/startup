      - [Retail and foodservice attach, "Segment-specific shocks could hurt volume", "Demand may be cyclical or margin-sensitive", "Request revenue split by vertical and seasonality"]
      - [Large food producers and distributors, "Top-account exposure unknown", "A few anchor customers could matter disproportionately", "Request top-10 customer concentration"]
      - [Export corridors, "Trade or customs disruption could hit customer volumes", "Lane dependence may drive volatility", "Request revenue split by export vs domestic workflows"]
      - [Acquisition-led expansion, "Customer overlap and churn risk after integration", "Network growth may mask retention issues", "Request retention data pre/post major acquisitions"]
    notes: "The company clearly has room to expand wallet share, but concentration risk is almost entirely undisclosed publicly."
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: Cold-chain buyers move from a pain point in product integrity to multi-step outsourced execution and support.
    data:
      items:
        - id: pain
          label: Workflow pain appears
          actor: Operations or supply-chain buyer
          description: Spoilage, stockouts, routing complexity, export handling, or inventory-control pain creates the need for a specialist cold-chain partner.
          channels: [Retail, Foodservice, Export, Distribution]
        - id: fit
          label: Cold-chain module fit
          actor: Buyer and operating team
          description: The customer matches its need to storage, processing, picking, cross-docking, transport, or other cold-chain modules.
          channels: [Storage, Picking, Processing, Cross-docking, Transport]
        - id: operate
          label: Active operating use
          actor: Facility and service users
          description: Exact-order prep, punctual delivery, temperature integrity, and customer support determine whether the workflow performs in production.
          channels: [Operations, Support, Quality]
        - id: expand
          label: Expand or deepen
          actor: Existing account owner
          description: More countries, more modules, or broader volume can increase wallet share if service quality remains reliable.
          channels: [More sites, More services, More lanes]
    approximationNotes: "The journey map is synthesized from public service pages rather than a disclosed sales-process document."
    claimRefs: [CU001, CU002, CU003, CU004, CU018, CU020, CU021]
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: Public evidence supports workflow relevance and network growth, but not a clean customer-count funnel.
    data:
      nodes:
        - id: need
          label: Customer cold-chain need
          detail: Retail, foodservice, export, distributor pain points
          claimRefs: [CU001, CU002, CU003]
        - id: module
          label: Module deployment
          detail: Storage, picking, processing, cross-docking, transport
          claimRefs: [CU004, CU005, CU006]
        - id: operations
          label: Active operations
          detail: Accuracy, punctuality, quality, and support testimonials
          claimRefs: [CU015, CU016, CU017]
        - id: network
          label: Expansion support
          detail: New facilities and country density support broader account coverage
          claimRefs: [CU009, CU010, CU011, CU012, CU013]
      edges:
        - {from: need, to: module, label: match workflow}
        - {from: module, to: operations, label: execute account}
        - {from: operations, to: network, label: support broader rollout}
    approximationNotes: "The funnel is qualitative because the company does not publish customer-count conversion metrics."
    claimRefs: [CU004, CU005, CU006, CU009, CU010, CU011, CU012, CU013, CU015, CU016, CU017]
