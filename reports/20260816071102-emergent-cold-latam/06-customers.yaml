    claimRefs: [CU020, CU021, CU022, CU023, CU024, CU025]
callouts:
  - calloutType: strength
    title: Customer fit is obvious wherever cold integrity and order precision matter
    body: >-
      The company is clearly aligned to workflows where delays, spoilage, and order errors are commercially painful. That makes the product relevant to retail, foodservice, export, and large perishable operations even before customer-count metrics are disclosed.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU018]
  - calloutType: risk
    title: Customer quality cannot be fully underwritten from testimonials alone
    body: >-
      The public record does not disclose active-customer counts, top-account concentration, contract duration, churn, or retention. Named proof exists, but its economic significance remains uncertain.
    claimRefs: [CU015, CU016, CU017, CU020, CU021, CU022, CU026, CU027]
