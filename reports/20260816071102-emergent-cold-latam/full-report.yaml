      - number: '2.4'
        title: Demand drivers are strong, but infrastructure, compliance, and energy constraints remain structural
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are mutually reinforcing. Market reports cite agricultural exports,
              urbanization, processed-food consumption, e-commerce, and pharmaceutical growth as the main engines of
              demand. GCCA's 2025 regional article adds practical color: Emergent's commercial leadership estimates that
              roughly 40 percent of regional demand is export-led, 20 percent is import-for-domestic-consumption, and 40
              percent is local production distribution. Company operating articles reinforce the same pattern,
              emphasizing foodservice, food retail, traceability, integrated logistics, and container-loading discipline
              as increasingly non-optional capabilities.

              The constraints are equally structural. Market Data Forecast, PAHO, WTO, and company logistics explainers
              all point to some combination of cross-border friction, food-safety complexity, infrastructure deficits,
              operational errors, and high capital intensity. Mordor adds energy-hungry warehousing and the need for
              technology upgrades; PAHO stresses the burden of robust food-control systems across the region; WTO
              highlights that trade facilitation still matters because border and clearance frictions directly affect
              goods in transit. The result is a market with real tailwinds but no easy economics: buyers increasingly
              need cold-chain sophistication, while operators still absorb heavy capex, compliance, and execution risk.
            claimRefs:
