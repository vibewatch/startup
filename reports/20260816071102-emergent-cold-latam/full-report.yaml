            body: >-
              The positive view is straightforward: Emergent has attracted infrastructure-scale equity and debt,
              deployed that capital into a tangible regional network, and continues to invest in expansion, automation,
              and service capabilities. That profile is consistent with a serious growth platform rather than a lightly
              capitalized roll-up. For a logistics operator in an underbuilt region, the availability of sponsor capital
              and lender support is itself a meaningful competitive advantage.

              The negative view is equally important. Public evidence still does not show whether the network is
              generating attractive utilization-adjusted returns, how gross margins behave across storage versus
              transport, whether acquisitions are accretive on a normalized basis, or how much debt service pressure the
              business can comfortably absorb. The underwriting stance should therefore separate financing capacity from
              financial quality: the former is well signaled, the latter remains materially underdisclosed.
