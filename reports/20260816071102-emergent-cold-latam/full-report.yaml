  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Emergent Cold Latin America launched in August 2021 as a temperature-controlled warehousing and logistics
              platform built to modernize a fragmented regional food cold chain. Launch materials said the company was
              based out of São Paulo with a corporate office in Miami, while the current task context and management
              footprint place Miami at the corporate center of gravity for an operating network that spans Latin
              America. Official company pages consistently describe the core offer as integrated cold-chain logistics
              rather than simple storage rental: refrigerated and frozen warehousing, transportation, processing,
              picking, cross-docking, port logistics, customs warehousing, blast freezing, and other value-added
              services for food and agribusiness customers.

              The strongest current first-party footprint claim is the About Us page and June 2026 operating news, both
              of which say the network includes 110 cold-storage warehouses in 11 Latin American countries. Service
              pages add that those assets are distributed across key ports and metropolitan centers and are meant to
              support end-to-end product flow rather than point solutions. In workflow terms, Emergent positions itself
              as a regional cold-chain operating platform for proteins, dairy, frozen foods, produce, food retail,
              foodservice, and import/export users that need storage, handling, transportation, and compliance-sensitive
              execution under one umbrella. IFC's project disclosure corroborates that framing by describing the company
              as a third-party temperature-controlled logistics platform built around refrigerated storage,
              transportation, and value-added services for processed foods, dairy, meat, seafood, and fruits and
              vegetables.
