  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Emergent's public materials make clear that the product is not a single facility or software package. It
              is a workflow solution for temperature-controlled food logistics that bundles physical infrastructure with
              specialized handling steps. Storage, transportation, food processing, picking, cross-docking, customs
              warehousing, blast freezing, and integrated logistics all appear as first-class modules in the offer. In
              practical buyer terms, that means Emergent is selling continuity of cold integrity across receiving,
              storage, handling, distribution, and export-related steps rather than selling one isolated warehouse
              service.

              The module map is also aligned to different customer jobs. Retailers and foodservice customers are routed
              toward picking and replenishment accuracy; exporters toward processing, IQF, container loading, and
              customs support; food manufacturers toward multi-temperature storage and transportation; and large-scale
              perishable operators toward an integrated, multi-step chain that reduces loss and preserves quality. That
              product definition is broad enough to support account expansion if execution is consistent.
