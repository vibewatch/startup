      - number: '7.2'
        title: Operational risk sits at the center of the thesis because cold-chain failures propagate quickly
        blocks:
          - type: paragraph
            body: >-
              Cold-chain logistics compresses physical, timing, and quality risk into the same operating system. OSHA's
              warehousing guidance shows that refrigerated and general warehousing operations face forklift, ergonomics,
              material-handling, chemical, slip-and-fall, and robotics hazards. Emergent's own product surfaces add more
              complexity than a basic warehouse landlord would face: food processing, picking, cross-docking, transport
              coordination, and blast-freezing all create additional execution points where downtime, temperature
              deviation, or handling errors could lead to spoilage, rejected loads, claims, or customer churn. Public
              market sources likewise stress that Latin America still faces infrastructure deficits, power-quality
              challenges, high logistics costs, and cargo-security issues that can degrade both service quality and
              margin.

              The most important operational point is that network scale cuts both ways. It provides density and
              customer reach, but it also creates a larger control problem across sites, countries, and acquired
              platforms. Comfrio alone added major domestic-distribution and last-mile exposure in Brazil, while the
              company continues to open and expand sites in Mexico, Colombia, Guatemala, Chile, and elsewhere. If
              operating standards, maintenance practices, or local management quality vary too widely, service failures
              can transmit from one facility problem into wider customer dissatisfaction and slower ramp on new
              capacity. Public mitigation signals exist—technology investment, automation, certifications, and explicit
              focus on operational standards—but they do not eliminate the need to inspect incident logs, outage
              history, insurance coverage, and post-acquisition quality metrics.
            claimRefs:
              - CR010
              - CR011
