      - number: '1.3'
        title: Funding history, investors, and acquisition-led scaling
        blocks:
          - type: paragraph
            body: >-
              Emergent Cold LatAm's financing history is unusually large for a regional cold-chain operator. At launch
              in 2021, the company announced a US$450 million capital raise anchored by Lineage, Stonepeak, and D1
              Capital Partners. In December 2023, official company and Stonepeak materials announced a further US$500
              million of equity commitments led by Stonepeak, Lineage, and Losa Group. Those same sources say total
              equity raised since July 2021 reached US$1.2 billion, and that the company had already completed eighteen
              acquisitions, two new construction projects, and nine additional greenfields in active development at the
              time of the 2023 raise. In September 2025, Emergent added a new US$250 million term loan led by CPPIB
              Credit Investments and arranged by Deutsche Bank to fund acquisitions and development projects.

              The capital has clearly been used to accelerate a consolidation-plus-development strategy. The 2021 launch
              announcement paired the raise with an initial Peru acquisition. The current About Us chronology then shows
              a sequence of acquisitions and new projects across Peru, Panama, Brazil, Chile, Colombia, Uruguay,
              Guatemala, Mexico, Paraguay, Ecuador, the Dominican Republic, and later Brazil again via Comfrio and Peru
              via Frialsa Perú. The biggest disclosed strategic move in Brazil was the Comfrio transaction: the
              announcement described Comfrio as a 24-site platform with about 420,000 pallet positions, while the
              completed-transaction release and Aqua Capital's sale announcement frame the combined business as the
              dominant integrated cold-chain platform in Brazil. Public sources therefore support a clear conclusion:
              Emergent has not grown by one or two marquee assets, but by a deliberate regional roll-up plus greenfield
              build program funded with infrastructure-scale capital.
