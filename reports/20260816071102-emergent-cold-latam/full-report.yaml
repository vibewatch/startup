        title: Retention is plausible operationally, but not disclosed metrically
        blocks:
          - type: paragraph
            body: >-
              Cold-chain workflows are naturally sticky. Once a customer embeds storage, order preparation, transport
              timing, and quality expectations into an operator, switching is painful and risky. Emergent's service
              materials reinforce this by emphasizing accuracy, punctuality, inventory discipline, and reduced
              waste—exactly the attributes that would support renewal if performed consistently. Cross-selling across
              modules also appears plausible: a customer storing goods with Emergent can also use picking,
              cross-docking, processing, transport, or export-support functions.

              The problem is not the logic of retention; it is the lack of hard data. The public corpus does not
              disclose NRR, GRR, churn, renewal rates, average contract duration, or cohort behavior. As a result,
              durability must be inferred from workflow complexity and testimonial tone, not measured directly. That is
              directionally encouraging but insufficient for a high-conviction customer-quality verdict. It also makes
              it hard to test whether multi-service accounts renew at better rates than simpler storage-only accounts.
