      - number: '1.5'
        title: Disclosure gaps, metric drift, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The public record is persuasive on scale but uneven on precision. Company, investor, advisor, and trade
              sources consistently agree that Emergent is one of the largest temperature-controlled logistics operators
              in the region and that it has raised very large amounts of capital. They are much weaker on audited
              financial quality. No reviewed first-party source disclosed revenue, EBITDA, cash flow, customer
              concentration, or a clean current headcount for the entire group. Public valuation is also imprecise:
              official releases emphasize capital raised and infrastructure deployment, while database pages such as CB
              Insights partially reveal funding chronology but mask valuation fields and show totals that appear
              incomplete relative to official announcements.

              Several operating metrics also require date and scope discipline. Sources variously refer to more than 60
              warehouses, more than 70 warehouses, and 110 warehouses; 5.1 million, 5.4 million, and 9.4 million cubic
              meters; and region-wide versus Brazil-only employee counts. Those are not reasons to doubt the platform,
              but they are reasons to avoid overconfident underwriting from headline numbers alone. The right diligence
              stance is that Emergent's identity, investor base, acquisition cadence, and physical footprint are all
              well evidenced, while its current valuation, revenue quality, unit economics, and cap-table details remain
              substantially less transparent.
            claimRefs:
              - CO045
              - CO046
              - CO047
              - CO048
              - CO049
