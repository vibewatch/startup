  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Emergent's relevant market is not “all logistics” and not simply “cold storage.” The closest boundary is
              Latin America's temperature-controlled food-and-pharma logistics stack: refrigerated warehousing, frozen
              and chilled storage, blast freezing, reefer transportation, container handling, cross-docking,
              customs-related warehousing, and the monitoring or traceability layer needed to keep products within
              temperature requirements from origin to final handoff. Company service pages and logistics explainers
              consistently present the category this way, combining storage, transport, value-added handling, and
              operational visibility rather than treating them as disconnected products.

              That boundary matters because buyer substitutes remain real. Customers can self-operate, use local
              specialist warehouses, rely on freight forwarders plus fragmented third parties, or shift product mix
              toward less temperature-sensitive channels. But the more complex the workflow becomes—multi-country
              exports, foodservice replenishment, multi-temperature storage, or pharma-adjacent handling—the weaker
              those substitutes look. Emergent's own blog and service materials repeatedly frame the market around
              integrated temperature-sensitive workflows, while third-party market reports likewise define the category
              as an end-to-end cold chain rather than a pure storage niche.
            claimRefs:
