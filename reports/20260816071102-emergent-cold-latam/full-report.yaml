              Emergent Cold LatAm is not scaling like a typical startup. Multiple first-party and partner sources show
              hundreds of millions of dollars deployed into acquisitions, greenfields, and standards-heavy facilities,
              giving the company a capital base that regional independent cold-storage operators would struggle to
